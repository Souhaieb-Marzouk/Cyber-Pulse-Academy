<svg xmlns="http://www.w3.org/2000/svg" width="{{WIDTH}}" height="{{HEIGHT}}" viewBox="0 0 {{WIDTH}} {{HEIGHT}}" role="img" aria-label="CyberMastery study topic">
  <!--
    CyberMastery Open Graph template.

    Edited by hand; filled in by scripts/generate_og.py. Do not rename the
    {{TOKENS}}: the script substitutes them and a renamed token will simply
    appear literally in the output.

      {{WIDTH}} {{HEIGHT}}    canvas size
      {{ACCENT}}              accent colour for the topic's catalog
      {{TITLE_BLOCK}}         one <text> per wrapped title line
      {{EXTERNAL_ID_BLOCK}}   ATT&CK / exam id chip, empty when there is none
      {{BADGE_BLOCK}}         theme, type and difficulty pills

    The design is deliberately plain: near-black navy, one accent, no imagery.
    It stays legible as a 300px-wide thumbnail in a social feed, which is the
    only size that actually matters here.
  -->
  <title>CyberMastery study topic</title>
  <defs>
    <linearGradient id="cmOGBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d16"/>
      <stop offset="55%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#101d2e"/>
    </linearGradient>
    <radialGradient id="cmOGGlow" cx="0.12" cy="0.04" r="0.9">
      <stop offset="0%" stop-color="{{ACCENT}}" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cmOGGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3350" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="{{WIDTH}}" height="{{HEIGHT}}" fill="url(#cmOGBg)"/>
  <rect width="{{WIDTH}}" height="{{HEIGHT}}" fill="url(#cmOGGrid)"/>
  <rect width="{{WIDTH}}" height="{{HEIGHT}}" fill="url(#cmOGGlow)"/>
  <rect x="0" y="0" width="{{WIDTH}}" height="7" fill="{{ACCENT}}"/>

  <!-- Brand mark -->
  <g transform="translate(88,70) scale(1.9)">
    <path d="M22 3 7 9v11c0 9.2 6.3 17.8 15 20 8.7-2.2 15-10.8 15-20V9l-15-6z"
          fill="none" stroke="{{ACCENT}}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M16 20.5l4.2 4.2L29 14.5" fill="none" stroke="{{ACCENT}}"
          stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="136" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="34" font-weight="700" fill="#e8f1fb">CyberMastery</text>

  {{EXTERNAL_ID_BLOCK}}

  <!-- Title, wrapped by the generator -->
  {{TITLE_BLOCK}}

  <line x1="{{MARGIN}}" y1="{{RULE_Y}}" x2="{{WIDTH}}" y2="{{RULE_Y}}" stroke="{{ACCENT}}" stroke-width="1.2" opacity="0.32"/>

  {{BADGE_BLOCK}}

  <text x="{{MARGIN}}" y="{{FOOTER_Y}}" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="19" fill="#7e95ae">3 hands-on exercise batches</text>
  <text x="{{WIDTH}}" y="{{FOOTER_Y}}" text-anchor="end"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="19" fill="#7e95ae">Free, non-commercial, community-built study material</text>
</svg>
