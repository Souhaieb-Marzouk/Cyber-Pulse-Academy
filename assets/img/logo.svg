<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="CyberPulseAcademy">
  <!--
    CyberPulseAcademy logo. A shield with a check mark: it reads as defensive
    security and it stays legible at 16px in a browser tab. Inline shapes only,
    no embedded raster, no font dependency, so it costs the same as a few lines
    of text on every page load.
  -->
  <title>CyberPulseAcademy</title>
  <defs>
    <linearGradient id="cmLogoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2a38"/>
      <stop offset="100%" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="cmLogoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <path d="M32 3 8 12v18c0 15.4 10.2 29.7 24 33.4C45.8 59.7 56 45.4 56 30V12L32 3z"
        fill="url(#cmLogoFill)" stroke="url(#cmLogoStroke)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M21 31.5l7.4 7.4L44 24" fill="none" stroke="#22d3ee" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
