<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CyberMastery">
  <!--
    Maskable PWA icon. Android crops maskable icons to whatever shape the
    launcher uses, so the mark is drawn inside the safe zone: a centred circle
    of 80 percent of the canvas, with the outer 10 percent on every side kept as
    plain background. Without this padding a round launcher mask clips the
    shield and the icon looks broken.
  -->
  <title>CyberMastery</title>
  <defs>
    <linearGradient id="iMaskFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2a38"/>
      <stop offset="100%" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="iMaskStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#070d16"/>
  <circle cx="256" cy="256" r="205" fill="#0b1420"/>
  <path d="M256 122 160 159v72c0 61.8 40.9 119.2 96 134C311.1 350.2 352 292.8 352 231v-72L256 122z"
        fill="url(#iMaskFill)" stroke="url(#iMaskStroke)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M214 240l31 31 57-61" fill="none" stroke="#22d3ee" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
