<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="CyberMastery">
  <!--
    PWA icon, 192px. Rendered from the same geometry as logo.svg so the mark is
    identical everywhere. Kept as SVG because one small scalable file beats six
    raster sizes, and the PNG companions in this folder cover the platforms that
    refuse SVG.
  -->
  <title>CyberMastery</title>
  <defs>
    <linearGradient id="i192Fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2a38"/>
      <stop offset="100%" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="i192Stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="34" fill="#070d16"/>
  <path d="M96 26 44 46v38c0 32.5 21.5 62.7 52 70.5C126.5 146.7 148 116.5 148 84V46L96 26z"
        fill="url(#i192Fill)" stroke="url(#i192Stroke)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M74 88.5l16 16 30-32" fill="none" stroke="#22d3ee" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
