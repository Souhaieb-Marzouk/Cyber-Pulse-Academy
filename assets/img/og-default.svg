<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CyberPulseAcademy, free hands-on cyber security study platform">
  <!--
    Default Open Graph image, used by every page that is not a single topic:
    the home page, the catalogs, the coverage dashboard, the legal pages.
    Kept as a plain SVG so an unfurl costs about 2 KB.
  -->
  <title>CyberPulseAcademy, free hands-on cyber security study platform</title>
  <defs>
    <linearGradient id="cmDefBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d16"/>
      <stop offset="55%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#101d2e"/>
    </linearGradient>
    <radialGradient id="cmDefGlow" cx="0.14" cy="0.06" r="0.9">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cmDefGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3350" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#cmDefBg)"/>
  <rect width="1200" height="630" fill="url(#cmDefGrid)"/>
  <rect width="1200" height="630" fill="url(#cmDefGlow)"/>
  <rect x="0" y="0" width="1200" height="7" fill="#22d3ee"/>

  <g transform="translate(88,76) scale(2)">
    <path d="M22 3 7 9v11c0 9.2 6.3 17.8 15 20 8.7-2.2 15-10.8 15-20V9l-15-6z"
          fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M16 20.5l4.2 4.2L29 14.5" fill="none" stroke="#22d3ee" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="140" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="36" font-weight="700" fill="#e8f1fb">CyberPulseAcademy</text>

  <text x="90" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#e8f1fb">Master cyber security theory</text>
  <text x="90" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#22d3ee">through hard practice.</text>

  <line x1="90" y1="424" x2="1110" y2="424" stroke="#22d3ee" stroke-width="1.2" opacity="0.32"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700">
    <text x="90" y="478" fill="#22d3ee">246 STUDY TOPICS</text>
    <text x="320" y="478" fill="#b3c6db">3 EXERCISE BATCHES EACH</text>
    <text x="640" y="478" fill="#b3c6db">NO TRACKING</text>
    <text x="850" y="478" fill="#b3c6db">FREE FOREVER</text>
  </g>

  <text x="90" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="20" fill="#7e95ae">SOC analysts, incident responders, threat hunters, GRC, pentesters, cloud engineers, students</text>
  <text x="1110" y="552" text-anchor="end"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
        font-size="20" fill="#7e95ae">Community-built, non-commercial</text>
</svg>
