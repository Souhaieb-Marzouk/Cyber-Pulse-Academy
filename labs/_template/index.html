<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>Lab title</title>
<link rel="stylesheet" href="./css/lab.css">
</head>
<body>
<div class="wrap" id="lab">
<header class="lab">
  <div class="kicker">template lab</div>
  <h1>Lab title</h1>
  <p class="meta">Replace this line</p>
</header>

<section>
  <h2>Briefing</h2>
  <p>Replace this briefing.</p>
</section>

<section>
  <h2>Questions</h2>
  <div id="questions"><noscript><p class="note">This lab needs JavaScript for the questions and
  scoring. The briefing above is still readable without it.</p></noscript></div>
</section>

<div class="row">
  <button type="button" class="primary" id="check">Check my answers</button>
  <span class="note">3 questions &middot; 70% to pass</span>
</div>
<div class="verdict" id="verdict" role="status" aria-live="polite"></div>

<footer>
  Part of <strong>Cyber Pulse Academy</strong>. This lab runs entirely in your browser: no account,
  no tracking, nothing sent anywhere.
</footer>
</div>

<script type="application/json" id="lab-data">{"id":"lab-template","topicId":"template","questions":[]}</script>
<script src="./js/lab.js"></script>
</body>
</html>
