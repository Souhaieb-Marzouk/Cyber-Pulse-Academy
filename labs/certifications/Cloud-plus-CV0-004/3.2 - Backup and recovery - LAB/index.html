<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3.2 - Backup and recovery - LAB</title>
  <meta name="description" content="Interactive practice lab for CompTIA Cloud+ CV0-004 Lesson 3.2: Backup and recovery — data integrity, RPO/RTO, 3-2-1-1-0, immutability, restore drills. Synthetic training environment." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Single-page "world" shell: every phase renders inside #app (no nav bar, no footer, no breadcrumbs). -->
  <div id="app"></div>

  <!-- Screen-reader live region mirror (also duplicated inside the app root on render). -->
  <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

  <!--
    Classic scripts in dependency order — no modules, no build step.
    data.js       all lab content (objectives answer keys, quiz banks, logs, glossary)
    state.js      state object + pub/sub + localStorage persistence (same key/semantics as the original)
    objectives.js mastery blueprint: objective registry + CHECK RESULTS validation engine + star math
    ui.js         shared UI helpers: icons, dom builders, feedback boxes, badges, dialogs, tooltips, selects
    stations.js   the four working stations (Planner, Vault, Drill Floor, Evidence)
    quiz.js       knowledge check (sequential stepper)
    app.js        bootstrap: phase routing, mode select, briefing, duty bar, rails, completion modal
  -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
  <script>window.Lab && window.Lab.boot();</script>
</body>
</html>
