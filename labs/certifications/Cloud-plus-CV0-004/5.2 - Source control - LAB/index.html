<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5.2 - Source control - LAB</title>
  <meta name="description" content="Interactive practice lab for CompTIA Cloud+ CV0-004 Domain 5.0: source control — commits, branches, merges, pull requests, secret hygiene and audit triage. Fictional training scenario. Fully static: no server, no build step." />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="lab-main">

    <!-- Lab shell: hazard stripe + status strip + yard-signage tabs (hidden until a mode is chosen) -->
    <div id="shell" hidden>
      <div class="hazard-stripe" aria-hidden="true"></div>

      <header class="site-header">
        <div class="header-inner">
          <p class="brand">THE SWITCH YARD<span class="brand-sub">nf-cloud-platform</span></p>
          <span id="mode-badge" class="mode-badge mode-badge--medium">YARDMASTER · MEDIUM</span>
          <span id="head-stat" class="head-stat mono">HEAD main@— · siding 0 · main unprotected</span>
          <span class="header-right">
            <span id="score-stat" class="chip chip-mono" aria-live="polite">objectives 0/0 · exam 0/0</span>
            <button type="button" id="clearance-btn" data-action="open-clearance" data-fid="clearance" class="clearance-btn" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icn icn-xs" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
              Request dispatch clearance
            </button>
            <button type="button" data-action="reset-lab" data-fid="reset" class="reset-btn" aria-label="Reset the lab">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icn icn-xs" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              RESET
            </button>
          </span>
        </div>
        <!-- in-lab tabs (yard signage) -->
        <nav class="signage" aria-label="Lab sections">
          <button type="button" role="tab" id="tabbtn-briefing" data-action="goto-tab" data-arg="briefing" data-fid="tab-briefing" aria-selected="true" class="signage-tab signage-tab--active">BRIEFING</button>
          <button type="button" role="tab" id="tabbtn-rulebook" data-action="goto-tab" data-arg="rulebook" data-fid="tab-rulebook" aria-selected="false" class="signage-tab">RULEBOOK</button>
          <button type="button" role="tab" id="tabbtn-yard" data-action="goto-tab" data-arg="yard" data-fid="tab-yard" aria-selected="false" class="signage-tab">YARD</button>
          <button type="button" role="tab" id="tabbtn-exam" data-action="goto-tab" data-arg="exam" data-fid="tab-exam" aria-selected="false" class="signage-tab">EXAM</button>
          <button type="button" role="tab" id="tabbtn-safety" data-action="goto-tab" data-arg="safety" data-fid="tab-safety" aria-selected="false" class="signage-tab">SAFETY REVIEW</button>
        </nav>
      </header>

      <div class="content-wrap">
        <div id="tab-content"></div>
      </div>

      <p id="dispatcher-note" class="dispatcher-note" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icn icn-xs inline-icn" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        Dispatcher shift: noise is intentional — placeholders, dead keys and an untracked notes file are decoys, not hazards.
      </p>
    </div>

    <!-- Mode select screen (no saved session) -->
    <div id="mode-select-screen"></div>

    <!-- Dispatch clearance modal (C7) -->
    <div id="modal-root" hidden>
      <div class="modal-overlay" aria-hidden="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
        <button type="button" class="modal-close" data-action="close-clearance" data-fid="modal-close" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icn icn-sm" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          <span class="sr-only">Close</span>
        </button>
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icn icn-sm" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            Dispatch clearance
          </h2>
          <p id="modal-desc" class="modal-desc">Yard debrief — your mastery recap.</p>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

  </main>

  <!-- Classic scripts in dependency order (works from file:// and any subpath) -->
  <script src="js/data.js"></script>
  <script src="js/git.js"></script>
  <script src="js/state.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
