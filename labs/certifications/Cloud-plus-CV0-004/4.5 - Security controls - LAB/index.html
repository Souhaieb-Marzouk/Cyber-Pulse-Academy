<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4.5 - Security controls - LAB</title>
  <meta
    name="description"
    content="Interactive practice lab: deploying and verifying security controls to protect cloud environments. CompTIA Cloud+ CV0-004, Domain 4.0, objective 4.5. Synthetic training data only."
  />
  <meta name="keywords" content="CompTIA Cloud+, CV0-004, security controls, interactive lab, cloud security" />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <noscript>
    <p style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font-family: sans-serif; color: #e9edea; background: #0a1214;">
      This interactive lab requires JavaScript. Please enable JavaScript and reload the page.
    </p>
  </noscript>

  <!-- The whole lab (mode gate or full page) renders here -->
  <div id="app"></div>

  <!-- Reset confirmation dialog (confirmed RESET, same copy as the original) -->
  <dialog id="reset-dialog" class="dialog-box" aria-labelledby="reset-title" aria-describedby="reset-desc">
    <h2 class="dialog-title" id="reset-title">Reset the lab to pristine state?</h2>
    <p class="dialog-desc" id="reset-desc">
      This wipes your mode, deployed controls, ledger progress, quiz results and saved state. There is no undo.
    </p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-outline" data-action="reset-cancel">Keep my progress</button>
      <button type="button" class="btn btn-danger" data-action="reset-confirm">&#9888; Reset everything</button>
    </div>
  </dialog>

  <!-- Completion modal (auto-opens when all objectives verify; reopened via Finish) -->
  <dialog id="completion-dialog" class="dialog-box" aria-labelledby="completion-title-el">
    <button type="button" class="dialog-close" data-action="completion-close" aria-label="Close">&#215;</button>
    <div id="completion-content"></div>
  </dialog>

  <!-- Glossary popover + toast viewport -->
  <div id="term-popover" class="term-popover"></div>
  <div id="toast-viewport" class="toast-viewport" aria-live="polite"></div>

  <!-- Scripts in dependency order (classic scripts: also works from file://) -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
