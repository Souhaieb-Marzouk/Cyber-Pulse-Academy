<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5.4 - System integration - LAB</title>
  <meta
    name="description"
    content="Interactive practice lab for CompTIA Cloud+ CV0-004 Objective 5.4 (System integration: APIs, webhooks and message queues). Synthetic training data on a fictional organization."
  />
  <meta
    name="keywords"
    content="CompTIA Cloud+, CV0-004, system integration, APIs, webhooks, message queues, interactive lab"
  />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ═══ The Central Exchange — static port of the Cloud+ CV0-004 5.4 lab ═══
       Data → js/data.js · Engine → js/engine.js · Store → js/state.js
       Views → js/ui.js · Bootstrap → js/app.js
       All content is SYNTHETIC TRAINING DATA on a fictional organization. -->

  <div class="lab-root">
    <!-- Mode gate: shown while no shift (medium/hard) has been chosen -->
    <div id="mode-gate" hidden></div>

    <!-- Main lab application: shown once a mode is chosen -->
    <div id="lab-app" hidden>
      <header id="masthead"></header>

      <main class="lab-main">
        <div id="briefing"></div>

        <div class="lab-grid">
          <div class="col col-runsheet"><div id="runsheet"></div></div>
          <div class="col col-bay"><div id="bay"></div></div>
          <div class="col col-taperoom"><div id="taperoom"></div></div>
        </div>

        <div class="study-stack">
          <section id="knowledge-core" aria-label="Knowledge core"></section>
          <section id="quiz-gate" aria-label="Knowledge check"></section>
          <section id="debrief" aria-label="Handover notes"></section>
        </div>
      </main>

      <div id="signoff-fab"></div>
    </div>

    <!-- Modal root: evidence rolls, reset confirm, sign-off report -->
    <div id="modal-root"></div>
  </div>

  <!-- Classic scripts in dependency order — no modules, no build step.
       Works from http(s) (GitHub Pages, any static host) and file:// -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
