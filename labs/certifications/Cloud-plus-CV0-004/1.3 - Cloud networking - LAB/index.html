<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.3 - Cloud networking - LAB</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="tb" role="banner">
    <div class="tb-cell tb-title"><span class="k">CyberLab · Cloud+ CV0-004 · Lesson 1.3</span><span class="v">CLOUD NETWORKING — DEPLOYMENT BOARD</span></div>
    <div class="tb-cell"><span class="k">Drawing</span><span class="v mono">NET-DEP-113 · REV A</span></div>
    <div class="tb-cell"><span class="k">Project</span><span class="v">MERIDIAN ANALYTICS — HYBRID CUTOVER</span></div>
    <div class="tb-cell"><span class="k">Mode</span><span class="v"><span id="tbModeChip">—</span></span></div>
    <div class="tb-cell"><span class="k">Deployment progress</span><span class="v mono" id="tbScore">0 / 0</span><div class="gauge" role="img" aria-label="objective progress"><i id="tbGauge"></i></div></div>
    <div class="tb-cell tb-spacer"></div>
    <div class="tb-actions">
      <button class="btn small amber" id="btnGlossary">Glossary</button>
      <button class="btn small amber" id="btnNotes">Field Notes</button>
      <button class="btn small amber" id="btnSwitch">Switch mode</button>
      <button class="btn small danger" id="btnReset">Reset sheet</button>
    </div>
  </header>

  <main id="main">
    <section id="canvasWrap" aria-label="Hybrid cloud network schematic — select an element to configure it">
      <svg id="board" viewBox="0 0 1210 775" role="group" aria-label="Network schematic"></svg>
    </section>
    <aside id="rail">
      <div class="card" id="briefCard"></div>
      <div class="card" id="inspector" aria-label="Inspector panel"></div>
      <div id="tasks" aria-label="Objectives tracker"></div>
    </aside>
  </main>

  <section id="drawer" aria-label="Document tray">
    <div id="drawerBar" role="tablist" aria-label="Tray sections">
      <button class="dtab" role="tab" id="tabTraffic" aria-controls="paneTraffic">Traffic Lab</button>
      <button class="dtab" role="tab" id="tabReq" aria-controls="paneReq">Requirements NET-CHG-2411</button>
      <button class="dtab" role="tab" id="tabAlerts" aria-controls="paneAlerts">Alert Board</button>
      <button class="dtab" role="tab" id="tabLogs" aria-controls="paneLogs">Flow Logs</button>
      <span style="flex:1"></span>
      <button class="btn small" id="btnDrawer" aria-expanded="true">Collapse tray ▴</button>
    </div>
    <div class="dpane" id="paneTraffic" role="tabpanel" aria-labelledby="tabTraffic"></div>
    <div class="dpane" id="paneReq" role="tabpanel" aria-labelledby="tabReq"></div>
    <div class="dpane" id="paneAlerts" role="tabpanel" aria-labelledby="tabAlerts"></div>
    <div class="dpane" id="paneLogs" role="tabpanel" aria-labelledby="tabLogs"></div>
  </section>
</div>

<div id="toast" role="status"></div>
<div class="sronly" aria-live="polite" id="live"></div>

<!-- overlays -->
<div class="ovl" id="ovlGate" role="dialog" aria-modal="true" aria-label="Choose difficulty mode"></div>
<div class="ovl" id="ovlQuiz" role="dialog" aria-modal="true" aria-label="Review board quiz"></div>
<div class="ovl" id="ovlGloss" role="dialog" aria-modal="true" aria-label="Glossary"></div>
<div class="ovl" id="ovlNotes" role="dialog" aria-modal="true" aria-label="Field notes debrief"></div>
<div class="ovl" id="ovlDone" role="dialog" aria-modal="true" aria-label="Completion"></div>
<div class="ovl" id="ovlConfirm" role="dialog" aria-modal="true" aria-label="Confirm"></div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/objectives.js"></script>
<script src="js/quiz.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
