<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2.2 - Infrastructure as code (IaC) - LAB</title>
  <meta
    name="description"
    content="Interactive practice lab: CompTIA Cloud+ CV0-004 Lesson 2.2 — Infrastructure as Code. Draft templates, read plans, catch drift, harden the pipeline. All data synthetic."
  />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Boot frame: replaced by the app's first render (the static port
       hydrates synchronously, so this flashes for milliseconds only). -->
  <div id="root">
    <div class="paper boot" role="status" aria-live="polite">
      <p>
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
        UNROLLING DRAWING SET…
      </p>
    </div>
  </div>

  <!-- Classic scripts, dependency order: icons → data → objectives (needs
       data) → store (needs data + objectives) → ui (needs icons + store) →
       panels/sheets/quiz (need ui + store + data) → modal (needs ui + store)
       → app (needs everything). No modules, no bundler, works from file://. -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
