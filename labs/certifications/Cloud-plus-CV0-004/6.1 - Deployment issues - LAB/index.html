<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6.1 - Deployment issues - LAB</title>
  <meta
    name="description"
    content="Interactive practice lab: diagnose and resolve cloud deployment problems (CompTIA Cloud+ CV0-004, objective 6.1). Synthetic training environment."
  />
  <meta name="keywords" content="CompTIA, Cloud+, CV0-004, deployment issues, troubleshooting, interactive lab" />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<!-- fonts are inlined in css/styles.css as data URIs (no requests, file://-safe) -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="lab-root">
    <!-- boot splash: mirrors the original "restoring shift…" state -->
    <div class="boot-splash" id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash-inner">
        <span aria-hidden="true" class="boot-mark">LC</span>
        <p class="boot-text">restoring shift…</p>
      </div>
    </div>

    <!-- header strip (rendered once a mode is selected) -->
    <div id="header-slot"></div>

    <!-- phase viewport: mode select / briefing / shift floor / quiz / debrief -->
    <main id="workbench-anchor">
      <div id="phase-root"></div>
    </main>

    <!-- ── field manual sheet (C2) ─────────────────────────────────────────── -->
    <div class="overlay" id="sheet-manual" hidden>
      <div class="sheet-panel sheet-manual" role="dialog" aria-modal="true" aria-labelledby="manual-title">
        <header class="sheet-header">
          <h2 id="manual-title" class="sheet-title">
            <svg class="ic ic-20 t-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
            Field manual — deployment issues
          </h2>
          <p class="sheet-sub">CV0-004 6.1 knowledge core: taxonomy, pipeline, method, drills, glossary.</p>
          <button type="button" class="sheet-close" data-action="close-sheet" aria-label="Close field manual">
            <svg class="ic ic-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </header>
        <div class="sheet-body lab-scroll" id="manual-body"></div>
      </div>
    </div>

    <!-- ── objectives tracker sheet (C4) ───────────────────────────────────── -->
    <div class="overlay" id="sheet-tracker" hidden>
      <div class="sheet-panel sheet-tracker" role="dialog" aria-modal="true" aria-label="Objectives tracker">
        <header class="sheet-header">
          <h2 class="sheet-title">
            <svg class="ic ic-20 t-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
            Objectives tracker
          </h2>
          <p class="sheet-sub sr-only">Live objective progress with per-objective checks and hints.</p>
          <button type="button" class="sheet-close" data-action="close-sheet" aria-label="Close objectives tracker">
            <svg class="ic ic-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </header>
        <div class="sheet-body lab-scroll" id="tracker-body"></div>
      </div>
    </div>

    <!-- ── completion modal (C7) ───────────────────────────────────────────── -->
    <div class="overlay" id="sheet-completion" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Completion record">
        <button type="button" class="sheet-close" data-action="close-sheet" aria-label="Close completion record">
          <svg class="ic ic-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div id="completion-body"></div>
      </div>
    </div>

    <!-- ── reset confirm (alert dialog) ────────────────────────────────────── -->
    <div class="overlay" id="sheet-confirm" hidden>
      <div class="confirm-panel" role="alertdialog" aria-modal="true" aria-label="Reset the launch night?">
        <div id="confirm-body"></div>
      </div>
    </div>
  </div>

  <!-- classic scripts in dependency order — works from file:// too -->
  <script src="js/data.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
