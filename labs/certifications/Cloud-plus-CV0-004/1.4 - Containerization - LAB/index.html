<!doctype html>
<!--
  HarborOps — CV0-004 Lesson 1.4 Containerization Lab (static port).
  Self-contained: vanilla HTML/CSS/JS, no build step, no server, no external
  runtime dependencies. Scripts are classic (non-module) tags in dependency
  order so the lab also works when opened directly via file:// after extraction.
  All content is synthetic training data; the freight authority is fictional.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1.4 - Containerization - LAB</title>
    <meta
      name="description"
      content="Interactive practice lab: CompTIA Cloud+ CV0-004 Lesson 1.4 — Containerization and its role in cloud environments. Synthetic training simulation."
    />
    <meta name="keywords" content="CompTIA Cloud+, CV0-004, containerization, training lab, cloud-native" />
    <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app" class="harborops"></div>
    <noscript>
      <p style="max-width: 40rem; margin: 3rem auto; font-family: sans-serif">
        This training lab is fully client-side and needs JavaScript enabled. No data leaves your
        browser — there is no server and no network call.
      </p>
    </noscript>

    <!-- dependency order matters: data → icons → state → validation → ui → zones → app -->
    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/state.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/zones.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
