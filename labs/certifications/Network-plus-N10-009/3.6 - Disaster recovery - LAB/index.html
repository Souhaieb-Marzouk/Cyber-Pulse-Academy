<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operation THAWLINE — Disaster Recovery Practice Lab (CompTIA Network+ N10-009)</title>
    <meta
      name="description"
      content="An interactive disaster-recovery practice lab: RPO, RTO, MTTR, MTBF, cold/warm/hot sites, active-active/passive redundancy and DR testing. All data is fictional training material."
    />
    <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Reset confirmation (AlertDialog parity: no click-outside dismissal) -->
    <dialog id="dlg-reset" aria-labelledby="reset-title" aria-describedby="reset-desc">
      <div class="dialog-card">
        <h2 class="dialog-title" id="reset-title">Reset the exercise?</h2>
        <p class="dialog-desc" id="reset-desc">
          This clears all saved progress — objectives, quiz answers, drill state and your chosen mode — and returns
          the desk to its pristine state. You will need to pick a mode again.
        </p>
        <div class="dialog-footer">
          <button type="button" class="btn btn-outline-dune" data-action="reset-cancel">Keep working</button>
          <button type="button" class="btn btn-red-solid" data-action="reset-confirm">Reset everything</button>
        </div>
      </div>
    </dialog>

    <!-- Mobile objectives-clipboard bottom sheet -->
    <dialog id="dlg-sheet" class="sheet-bottom" aria-label="Objectives clipboard"></dialog>

    <!-- Completion / debrief modal -->
    <dialog id="dlg-modal" class="modal-holder" aria-labelledby="modal-title" aria-describedby="modal-desc"></dialog>

    <!-- Classic scripts in dependency order (no modules → also runs from file://) -->
    <script src="js/icons.js"></script>
    <script src="js/shuffle.js"></script>
    <script src="js/data.js"></script>
    <script src="js/objectives.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/boards.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
