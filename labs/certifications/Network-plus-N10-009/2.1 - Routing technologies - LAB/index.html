<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gateway Operations Center — N10-009 2.1 Routing Lab</title>
  <meta
    name="description"
    content="Interactive practice lab for CompTIA Network+ N10-009 Objective 2.1: routing technologies — static &amp; dynamic routing (BGP, EIGRP, OSPF), route selection, NAT, PAT, FHRP, VIP and subinterfaces. Simulated training environment."
  />
  <meta
    name="keywords"
    content="CompTIA, Network+, N10-009, routing, OSPF, EIGRP, BGP, NAT, PAT, FHRP, subinterfaces, interactive lab"

  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Boot shell — replaced by the lab the moment state loads (synchronous). -->
    <main class="goc-root boot-shell" aria-busy="true" aria-label="Loading lab">
      <div class="boot-center">
        <div class="goc-board boot-title">GOC · BOOT</div>
        <div class="goc-mono boot-sub">restoring watch state…</div>
      </div>
    </main>
  </div>

  <noscript>
    <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font-family: monospace; color: #e7efe9;">
      This lab is an interactive simulator and needs JavaScript enabled.
    </div>
  </noscript>

  <!--
    Classic scripts in dependency order — no modules, no build step, so the lab
    also runs from file:// after unzipping as well as from GitHub Pages subpaths.
  -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
