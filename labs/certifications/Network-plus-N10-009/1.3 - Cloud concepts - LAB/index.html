  <!-- Inline data-URI favicon: the original pointed at a CDN icon; the static
       build keeps zero external requests (conversion note N-2). -->
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="lz-paper"></div>

  <!-- Dialog shells — content is built once at boot by app.js (uses the same
       inline SVG icon set as the rest of the lab). Native <dialog> provides
       focus containment, ESC handling and the ::backdrop layer. -->
  <dialog id="dlg-reset" class="lz-dialog" aria-labelledby="dlg-reset-title"></dialog>
  <dialog id="sheet-glossary" class="lz-sheet" aria-labelledby="sheet-glossary-title"></dialog>
  <dialog id="dlg-cleared" class="lz-dialog" aria-label="Lab completion summary">
    <div class="dlg-inner" id="cleared-body"></div>
  </dialog>

  <noscript>
    <p style="max-width:40rem;margin:4rem auto;padding:1rem;font-family:system-ui,sans-serif;text-align:center;">
      LZ-MERIDIAN needs JavaScript — every check, probe and quiz runs locally in your browser.
      No data ever leaves this page.
    </p>
  </noscript>

  <!-- Classic scripts in dependency order (works from file:// and any static host).
       data → icons → engine → validation → state → ui views → controller/boot. -->
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
