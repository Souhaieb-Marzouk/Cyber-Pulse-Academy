<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOC Access Patchbay · CompTIA Network+ N10-009 · Lesson 3.8 Access &amp; Management</title>
  <meta
    name="description"
    content="Self-contained interactive training lab for CompTIA Network+ N10-009 access and management (VPNs, SSH, web GUI, REST API, console/OOB). Pure static build — no server, no build step, no external dependencies."
  />
  <!-- data:, favicon: prevents a favicon 404 (and console noise) without an extra file -->
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Boot screen — replaced by app.js renderRoot() after localStorage hydration.
         Mirrors the original <Boot /> component in LabRoot.tsx. -->
    <div class="boot" role="status" aria-live="polite">
      <p class="boot-l1">cascade freightworks // noc</p>
      <p class="boot-l2">restoring your shift from saved state…</p>
    </div>
  </div>

  <noscript>
    <p style="font-family: monospace; padding: 24px">
      This training lab is fully client-side and requires JavaScript.
      Enable JavaScript, then reload — everything runs locally in your browser.
    </p>
  </noscript>

  <!--
    Classic scripts in dependency order (no ES modules → works over file:// too):
      data.js       — all lab content (synthetic hosts, logs, docs, matrix data)
      quiz.js       — wrap-up quiz banks (Medium 6 · Hard 7)
      objectives.js — objective definitions + validators (12 Medium · 9 Hard)
      state.js      — Store: single state object, pub/sub regions, localStorage persist
      ui.js         — shared console primitives (esc, I, ConsolePanel, AnswerField, …)
      icons.js      — exact Lucide SVG path data (no icon font, no CDN)
      app.js        — rendering regions + delegated events + boot
  -->
  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
