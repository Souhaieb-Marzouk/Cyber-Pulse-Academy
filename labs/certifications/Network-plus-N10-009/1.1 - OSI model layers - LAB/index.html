<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Protocol Tower — OSI Transit Authority · N10-009 Lab 1.1</title>
    <meta
      name="description"
      content="Interactive practice lab for CompTIA Network+ (N10-009) Lesson 1.1 — OSI model layers and encapsulation concepts. Dispatch a message down seven floors, cross the wire, and climb back up."
    />
    <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/font-faces.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- pre-hydration splash (mirrors the original SSR loading state) -->
    <div id="root">
      <div class="gate" role="status" aria-label="Loading the tower">
        <div style="text-align: center">
          <div
            style="margin: 0 auto 0.75rem; height: 40px; width: 40px; border-radius: 8px; border: 1px solid rgba(255,178,36,0.5); background: rgba(255,178,36,0.1); animation: splash-pulse 1.5s ease-in-out infinite"
          ></div>
          <p
            style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.3em; color: #93a5c0; text-transform: uppercase"
          >
            Powering the tower…
          </p>
        </div>
      </div>
    </div>
    <style>
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>

    <!-- classic scripts, dependency order (works from file:// after extraction) -->
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/objectives.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
