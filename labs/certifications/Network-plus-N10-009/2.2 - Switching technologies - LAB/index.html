<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fabric Bench — N10-009 2.2 Switching Technologies Lab</title>
  <meta name="description" content="Interactive practice lab for CompTIA Network+ N10-009 objective 2.2: VLANs, interface configuration, spanning tree, MTU and jumbo frames — configured on a live animated fabric. Synthetic training environment." />
  <meta name="keywords" content="CompTIA, Network+, N10-009, VLAN, spanning tree, STP, jumbo frames, MTU, network lab, switching" />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">

</head>
<body>
  <div id="app"></div>
  <noscript>The Fabric Bench is an interactive lab and needs JavaScript enabled.</noscript>

    Classic scripts in dependency order (no modules, no build step):
    data (model/seed) → engine (simulation) → objectives (checks) → quiz →
    icons → state (store + persistence) → ui helpers → canvas → views → app.
  -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
