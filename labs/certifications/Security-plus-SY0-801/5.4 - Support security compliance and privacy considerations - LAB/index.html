<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Atelier — Security+ SY0-801 Lesson 5.4 Lab</title>
  <meta name="description" content="An interactive compliance & privacy lab covering CompTIA Security+ (SY0-801) Lesson 5.4: regulatory compliance, frameworks, personnel security, and privacy.">
  <meta name="keywords" content="CompTIA Security+, SY0-801, compliance, privacy, GDPR, HIPAA, PCI DSS, SOX, GLBA, NIST, ISO 27001">
  <meta name="author" content="Meridian Atelier">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
</head>
<body>
  <!-- Main app root -->
  <div id="app-root">
    <!-- Initial loading state (replaced by app.js on boot) -->
    <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#F4EEDF;">
      <div style="font-family:Georgia,serif;font-size:1.5rem;color:#1F3A2E;">Loading the Atelier…</div>
    </div>
  </div>

  <!-- Completion modal mount point (kept separate so backdrop covers everything) -->
  <div id="modal-root"></div>

  <!-- Reset confirmation dialog mount point -->
  <div id="dialog-root"></div>

  <!-- Mobile rail drawer (populated on demand) -->
  <div id="mobile-rail" data-action="close-mobile-rail-backdrop">
    <div class="mobile-rail-panel" id="mobile-rail-panel"></div>
  </div>

  <!-- Scripts loaded in dependency order (classic, NOT ES modules — works via file:// too) -->
  <script src="js/data.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/workstations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
