<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Assurance Bureau — SY0-801 5.5 Audits &amp; Assessments Lab</title>
  <meta name="description" content="Interactive practice lab for CompTIA Security+ SY0-801 Lesson 5.5: Compare and contrast audits and assessments. Simulated engagement, synthetic training data only. All data stays in your browser." />
  <link rel="icon" href="../../../../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- The entire lab is rendered into this root by js/app.js -->
  <div id="app" class="app-root"></div>

  <!--
    Classic scripts in dependency order (no modules, no build step):
      data.js       — all lab content (documents, objectives, quiz bank, glossary…)
      objectives.js — validation engine + scoring + focus areas (pure functions)
      state.js      — store: state object, pub/sub, persistence, actions
      quiz.js       — knowledge-check + field-report components
      ui.js         — component library (masthead, tabs, docs, objective cards, widgets…)
      app.js        — bootstrap: subscribes the store, renders, wires global events
  -->
  <script src="js/data.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
