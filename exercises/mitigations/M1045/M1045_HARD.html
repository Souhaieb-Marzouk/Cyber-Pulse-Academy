why:{A:"The signature proves who signed it, not that kernel code with raw disk access is safe.",
C:"A single suspicious load does not justify fleet-wide quarantine; contain the decision, not the whole estate.",
D:"Windows Update is unrelated: this driver did not come from it, and signature validity is not a safety review."},
expl:"This is the <b>BYOVD pattern</b> (bring your own vulnerable driver): attackers ship signed kernel drivers whose only crime is being dangerous. A valid seal from a 21-day-old unapproved vendor with raw disk access is a risk decision, not a green light — so the least aggressive correct action is to block pending verification and check the vendor and the driver against known-vulnerable lists. M1045&#8217;s driver-signing measure gives you the checkpoint; your publisher process decides what passes it."},
{id:"h02",type:"drag",
sum:"Six behaviours, four techniques in scope, two out",
scenario:[
{label:"ARTEFACT 1 — Weekly CTI digest (six items)",html:"<p>Sort the digest: which behaviours sit inside the techniques M1045 addresses, and which belong to other control families entirely?</p>"}
],
question:"Drag each behaviour into the correct zone.",
hint:"Four behaviours are code being loaded or executed. Two are not about running code at all.",
zones:[
{id:"z1",label:"T1546.013 — PowerShell Profile"},
{id:"z2",label:"T1505.004 — IIS Components"},
{id:"z3",label:"T1127.002 — ClickOnce"},
{id:"z4",label:"T1525 — Implant Internal Image"},
{id:"z5",label:"Not addressed by M1045"}
],
items:[
{id:"b1",text:"Attacker edits a user&#8217;s PowerShell profile script so their code runs at every shell start"},
{id:"b2",text:"Unsigned DLL dropped into a web server&#8217;s IIS application folder and loaded by IIS"},
{id:"b3",text:"Abuse of a ClickOnce application reference to proxy code execution"},
{id:"b4",text:"Implant baked into a VM/container image stored in the internal catalog"},
{id:"b5",text:"Attacker copies the SAM registry hive off a workstation"},
{id:"b6",text:"Attacker brute-forces an FTP login on a legacy server"}
],
map:{b1:"z1",b2:"z2",b3:"z3",b4:"z4",b5:"z5",b6:"z5"},
expl:"<b>T1546.013</b>: M1045&#8217;s fix is enforcing signed PowerShell profiles — sign yours so modifications are refused. <b>T1505.004</b>: IIS DLLs and binaries must be signed by the right developers. <b>T1127.002</b>: signature verification stops untrusted ClickOnce code. <b>T1525</b>: content trust requires signed images. The SAM hive copy is credential access and the FTP brute force is password attack — neither runs new code, so M1045 has no lever there; those need credential protections and access hardening."},
{id:"h03",type:"decision",
sum:"Branching request — legacy StatPack on 12 workstations",
scenario:[
{label:"ARTEFACT 1 — Service desk escalation EXC-77",html:"<p>The data-science team needs legacy <b>StatPack</b> (internal, unsigned, source available) on 12 workstations. Policy: signed code only. You are the control owner.</p>"}
],
question:"Choose the best call at each step of the exception process.",
hint:"Balance risk and work: sign properly, bridge with the narrowest exception, and close the loop.",
steps:[
{scene:"<p>Policy says signed code only. The team wants the tool today.</p>",sceneLabel:"STEP CONTEXT",
q:"First move as control owner?",
opts:[{k:"A",text:"Sign StatPack with the internal code-signing certificate after a quick source review"},{k:"B",text:"Allow the tool by its file name in the policy"},{k:"C",text:"Disable the signed-code policy for those 12 machines"}],
correct:"A",
why:"Signing converts an unsignable exception into a normal trusted binary; a name rule is trivially abused and a policy hole on 12 machines is a standing weakness.",
recap:"You chose to bring the tool inside the trust system — the only option that improves with time."},
{scene:"<p>StatPack will be signed weekly by the platform team.</p>",sceneLabel:"STEP CONTEXT",
q:"Where should the signing key live, and who may use it?",
opts:[{k:"A",text:"On an HSM with access limited to the signing process"},{k:"B",text:"On a build-server file share so any developer can sign quickly"},{k:"C",text:"Email the certificate file to the team lead as a backup"}],
correct:"A",
why:"Keys on hardware (HSM) cannot simply be copied; a share or an emailed key is one stolen laptop away from a stolen identity — the exact abuse M1045 cannot undo.",
recap:"You put the key in hardware with process-only access — the custody standard for signing keys."},
{scene:"<p>Signing takes a week. The team needs the tool today.</p>",sceneLabel:"STEP CONTEXT",
q:"What is the safest bridge until the signed build exists?",
opts:[{k:"A",text:"A time-boxed allow rule on the exact file hash, with a review date"},{k:"B",text:"A temporary allow rule on the file name"},{k:"C",text:"Tell them to run it from a personal USB stick outside policy"}],
correct:"A",
why:"A hash rule admits one exact file — nothing else — and expires by design; name rules and policy bypasses scale the exception to anyone who copies the file.",
recap:"You bridged with the narrowest possible rule and gave it an expiry — compensating control done properly."},
{scene:"<p>One week later: the signed StatPack build is ready.</p>",sceneLabel:"STEP CONTEXT",
q:"What closes the exception correctly?",
opts:[{k:"A",text:"Deploy the signed build, remove the hash rule, document the exception with its expiry"},{k:"B",text:"Leave the hash rule forever; it is only one file"},{k:"C",text:"Move the app to a network share so it runs from there"}],
correct:"A",
why:"Exceptions must end: the durable fix (signed build) replaces the temporary one, and the audit trail shows when and why.",
recap:"You closed the loop — signed build live, temporary rule gone, paperwork complete."}
],
expl:"This branching exercise is the real work of a control owner: M1045 is preventive, so the design question is always &#8220;how do we run this code inside the trust system, not around it?&#8221;. Sign properly, hold keys on hardware, bridge with hash rules that expire, and close the exception — each step keeps the mitigation&#8217;s promise intact while the business keeps working."},
{id:"h04",type:"match",
sum:"What the signature check contributes per technique",
scenario:[
{label:"ARTEFACT 1 — Design review, four rows",html:"<p>A reviewer asks: for each technique, what exactly does the signature check contribute? Match the contribution.</p>"}
],
question:"Match each technique to the contribution its signature defence makes.",
hint:"Each answer names a mechanism: refusal, vendor-signed images, pinning, identity, or image-age rejection.",
pairs:[
{l:"T1036.001 — Invalid Code Signature",r:"A broken or tampered signature is itself the alarm — enforcement refuses to run it"},
{l:"T1601.001 — Patch System Image",r:"Vendor-signed OS images validate integrity, so a tampered or untrusted patch image is refused"},
{l:"T1601.002 — Downgrade System Image",r:"Signed images let a device refuse an older image that the current trust policy rejects"},
{l:"T1204.003 — Malicious Image",r:"Content trust pins which publisher may sign each image tag before it is pulled"},
{l:"T1546.006 — LC_LOAD_DYLIB Addition",r:"Requiring valid Apple Developer ID signatures stops hijacked library loads in app bundles"}
],
expl:"Each row is a different flavour of the same promise: <b>refusal</b> for broken seals (the tampered file will not run), <b>vendor-signed images</b> that expose patched system images (T1601.001), <b>age and policy rejection</b> for downgraded images, <b>publisher pinning</b> for image tags, and <b>identity</b> for macOS dylib loads. When you design enforcement you are choosing which of these mechanisms each layer gets — that is the engineering substance behind M1045."},
{id:"h05",type:"order",
sum:"A signing key has leaked — order the response",
scenario:[
{label:"ARTEFACT 1 — Incident card INC-3312",html:"<p>Monday 08:40 — threat intel reports your vendor&#8217;s code-signing certificate signing malware. The vendor confirms. You coordinate. Order the response.</p>"}
],
question:"Drag the steps into the correct order (first step on top).",
hint:"Stop the bleeding (trust), contain (block), heal (re-sign), learn (review).",
order:[
{id:"r1",text:"Confirm the abuse: enumerate binaries signed with the compromised certificate"},
{id:"r2",text:"Revoke the certificate and publish revocation (CRL/OCSP)"},
{id:"r3",text:"Block binaries signed by that certificate in enforcement policies"},
{id:"r4",text:"Re-sign legitimate software with the new key and republish"},
{id:"r5",text:"Update trust lists and review what was signed while the key was abused"}
],
expl:"Order matters because each step shrinks the attack window: first you <b>scope</b> (what carries this seal?), then you <b>revoke</b> so new signatures stop working, then you <b>block</b> what already carries it (revocation only helps systems that actually check), then you <b>re-sign</b> the legitimate estate, and finally you <b>review the abuse window</b>. This runbook is the corrective arm of M1045&#8217;s revocation-management measure."},
{id:"h06",type:"fill",
sum:"Two statuses the loader rule must alert on",
scenario:[
{label:"ARTEFACT 1 — Detection backlog ticket DET-118",html:"<p>Write the loader rule: alert when a DLL or driver load is missing or broken its seal, and the file sits where users can write.</p>"}
],
question:"Fill both blanks with words from the bank.",
hint:"Two statuses mean the seal is missing or broken — the other two describe healthy files.",
parts:["Detection idea: alert when a load event has signature status ",{a:"Invalid"}," or ",{a:"Unsigned"}," while the file lives in a directory users can write to."],
bank:["Invalid","Unsigned","trusted","encrypted"],
expl:"<b>Invalid</b> (broken seal — possible tampering, cf. T1036.001) and <b>Unsigned</b> (no seal at all) are the two failure states worth alerting on; combined with a user-writable path they catch the classic sideload. &#8220;Trusted&#8221; describes passing loads and &#8220;encrypted&#8221; is unrelated to signature state — including them would flood the queue with noise, which is exactly what detection engineers tune away."},
{id:"h07",type:"terminal",
sum:"Runbook: verify the driver&#8217;s Authenticode signature",
scenario:[
{label:"ARTEFACT 1 — Runbook page RB-12 (verification step)",html:"<p><b>Step 3 — Verify trust.</b> On the workstation, verify that the driver&#8217;s Authenticode signature <b>chains to a trusted root and passes the default Authenticode policy</b>. Record the tool output as evidence.</p><p>Driver under review: <span class=\"mono\">C:\\Windows\\System32\\drivers\\vividoptic.sys</span></p>"},
{label:"ARTEFACT 2 — Environment",html:"<p>Windows PowerShell, elevated. The Windows SDK is installed, so the vendor&#8217;s signing/verification tooling is on PATH. No other information is provided — choose the tool and options yourself.</p>"}
],
question:"Type the command that performs this verification, then run it.",
hint:"The SDK&#8217;s Authenticode verifier is the right tool family; match the runbook&#8217;s wording &#8212; &#8220;default Authenticode policy&#8221; &#8212; to the switch you pass.",
term:{
title:"Lab shell — WKSTN-4417",
env:"Windows PowerShell — Windows SDK tooling on PATH — simulation only, nothing real executes",
banner:'<span class="term-line"><span class="tc">Microsoft Windows [Version 10.0.22631.4460]</span></span><span class="term-line"><span class="tc">(c) Microsoft Corporation. Lab environment — trust-verification tooling only.</span></span>',
prompt:"PS C:\\Users\\responder>",
acceptTools:["signtool"],
outputHtml:'<span class="term-line"><span class="tn">Issued to: </span><span class="tk">VividOptic Labs Ltd</span></span><span class="term-line"><span class="tn">Issued by: </span><span class="tk">DigiCert Trusted G4 Code Signing CA</span></span><span class="term-line"><span class="tn">SHA1 hash: </span><span class="tn">A41C91F03BD24E77AA10C5308BB2F6E49C13D0F7</span></span><span class="term-line"><span class="tn">The signature is timestamped: </span><span class="tg">Tue Mar 03 09:14:22 2026</span></span><span class="term-line"><span class="tg">Successfully verified: </span><span class="tn">C:\\Windows\\System32\\drivers\\vividoptic.sys</span></span>',
elements:[
{key:"tool",kind:"tool",accept:["signtool"],expect:"signtool",name:"the verification tool (signtool)"},
{key:"verb",kind:"tok",accept:["verify"],expect:"verify",name:"the verify action"},
{key:"flagpa",kind:"flag",accept:["/pa"],expect:"/pa — default Authenticode policy",name:"the default-policy switch"},
{key:"target",kind:"target",accept:["c:\\windows\\system32\\drivers\\vividoptic.sys"],expect:"C:\\Windows\\System32\\drivers\\vividoptic.sys",name:"the driver path"}

canonical:"signtool verify /pa C:\\Windows\\System32\\drivers\\vividoptic.sys",
canonicalExplain:"<b>signtool</b> is the SDK tool for Authenticode signatures; <b>verify</b> checks instead of signing; <b>/pa</b> validates against the <i>default Authenticode policy</i> — exactly what the runbook&#8217;s wording demanded; the final token is the <b>target driver</b>. A near-miss like <span class=\"mono\">pnputil /delete-driver</span> or deleting the file would not verify anything — it would <b>destroy the evidence</b> you were asked to record. Verification reads; it never modifies."
},
expl:"In real M1045 operations, enforcement blocks unsigned code, but analysts must also <i>prove</i> a signed file&#8217;s trust state as evidence — that is this command&#8217;s job. The graded parts were the tool, the action, the <b>/pa</b> policy switch, and the exact target. If you reached for a state-changing tool instead, read the near-miss note in the feedback: on a live host, evidence preservation outranks tidiness."},
{id:"h08",type:"mcq",
sum:"The unsigned binary that still ran",
scenario:[
{label:"ARTEFACT 1 — AppLocker policy extract",html:'<div class="logbox"><span class="term-line"><span class="tn">Rule: Publisher — O=MIDCORP LTD, * — Applies to: *.exe, *.dll</span></span><span class="term-line"><span class="tn">OU=Workstations: </span><span class="tw">Audit only</span></span><span class="term-line"><span class="tn">OU=Servers: </span><span class="tg">Enforce</span></span></div>'},
{label:"ARTEFACT 2 — Event log, HOST-B (OU=Workstations)",html:'<div class="logbox"><span class="term-line"><span class="tn">AppLocker Event </span><span class="tk">8020</span><span class="tn"> — unsigned.exe — </span><span class="tw">allowed (audit mode)</span></span></div>'}
],
question:"Why did the unsigned binary still run on HOST-B?",
hint:"The rule exists and covers .exe files. Ask which <i>mode</i> the rule ran in on that machine.",
opts:{
A:"The rule set on HOST-B&#8217;s OU is in Audit mode — it logs but does not block.",
B:"Publisher rules cannot apply to .exe files.",
C:"The binary was signed with an expired certificate, which AppLocker ignores.",
D:"AppLocker is only capable of enforcement on servers."},
correct:["A"],
why:{B:"Publisher conditions exist precisely for .exe and .dll trust decisions.",
C:"The artefact says the binary is unsigned, not expired, and audit-vs-enforce already explains the outcome.",
D:"AppLocker enforces on any supported client OS; the OU split in the artefact is the real clue."},
expl:"Audit mode produces the <b>8020 &#8220;would have been blocked&#8221;</b> events instead of blocking — it is the recommended first phase of an AppLocker rollout, but it is not enforcement. The rollout lesson for M1045 deployments: a policy that is not in <b>Enforce</b> mode on that OU provides telemetry, not prevention. Reading mode and scope together is the two-step this exercise demands."},
{id:"h09",type:"multi",
sum:"Three reasons a valid signature is not safety",
scenario:[
{label:"ARTEFACT 1 — CISO question",html:"<p>&#8220;Everything that runs is signed. Are we safe?&#8221; Pick the three honest reasons the answer is &#8220;not entirely&#8221;.</p>"}
],
question:"Select the THREE reasons a valid signature still does not guarantee safe code.",
hint:"Think about the certificate owner, not the mathematics. Who is behind the seal?",
opts:{
A:"Attackers steal signing keys and sign malware with a real publisher identity.",
B:"Attackers can buy their own legitimate certificate for a freshly created company.",
C:"Signed drivers can carry unpatched vulnerabilities that attackers abuse (BYOVD).",
D:"Timestamps are forged so routinely that Windows ignores them.",
E:"Certificate chains cannot be checked offline at all."},
correct:["A","B","C"],
why:{D:"Timestamps are covered by the timestamp authority&#8217;s own signature; Windows does not simply ignore them.",
E:"Chain validation works from local trust stores — offline checking is normal and routine."},
expl:"The seal proves the <b>publisher relationship</b>, so its weakness is the <b>publisher side</b>: stolen keys, attacker-owned fresh companies, and vulnerable-but-signed drivers. Those three are documented failure paths in the wild and the reason M1045 pairs signing with <b>revocation management</b> and vendor allowlists. The two wrong options attack the cryptography itself — which is actually the strong part."},
{id:"h10",type:"mcq",
sum:"Red/blue drill — slipping past the enforcement",
scenario:[
{label:"ARTEFACT 1 — Exercise brief EX-88",html:"<p><b>Blue posture (MIDCORP):</b> signed binaries only; publisher allowlist for scripts and apps; driver blocklist; default-deny on user-writable paths; AppLocker in Enforce everywhere.</p><p><b>Red team assets:</b> a valid code-signing certificate for &#8220;Nimbus Tools Ltd&#8221; (a shell company), plus typical open-source tooling.</p>"}
],
question:"Red perspective: which action is MOST likely to slip past this enforcement?",
hint:"Enforcement looks at the outermost signature and the allowlist. Where does it stop looking?",
opts:{
A:"Deliver an unsigned DLL and have it load from a user-writable path.",
B:"Sign a malicious DLL with the Nimbus cert and get a signed, allowlisted app to sideload it from its own folder.",
C:"Install an unsigned kernel driver as a service.",
D:"Replace a Windows system binary with an unsigned copy."},
correct:["B"],
why:{A:"Default-deny on user-writable paths plus unsigned-code refusal blocks this immediately.",
C:"Kernel-mode signing enforcement refuses unsigned drivers outright.",
D:"System files are signature-checked; an unsigned replacement fails validation and is restored."},
expl:"The blue posture is strong at the <b>edges</b>: unsigned code, unsigned drivers, writable paths all fail. The remaining seam is <b>sideloading</b>: a genuinely signed, allowlisted app loads code from its own folder, and the loader trusts the app — not each module. Signing the payload with the Nimbus cert makes it indistinguishable from the vendor&#8217;s DLLs at the outer check. Blue lesson: pair M1045 with per-app load rules and module anomaly detection; red lesson: enforcement pushes attackers toward the most expensive bypass available."},
{id:"h11",type:"order",
sum:"Rank the rollout order",
scenario:[
{label:"ARTEFACT 1 — Programme plan draft",html:"<p>The signed-code programme will roll out in four waves. Rank them by blast radius if that layer is abused (most damaging first).</p>"}
],
question:"Drag the waves into the intended order (first on top).",
hint:"Rank by blast radius: kernel first, then servers, then desktop code, then the image supply chain.",
order:[
{id:"p1",text:"Wave 1 — kernel drivers and boot components"},
{id:"p2",text:"Wave 2 — server components: IIS modules, service binaries"},
{id:"p3",text:"Wave 3 — scripts and user-mode applications on workstations"},
{id:"p4",text:"Wave 4 — container registry: require signed images (content trust)"}
],
expl:"Kernel code compromises the machine below every control, so it goes first; server components expose many users at once and are next; workstation apps and scripts are the broad but lower-impact wave; the image supply chain closes the loop at the source. Each wave also tunes the exception process for the next — rolling out everything at once is how signed-code programmes get rolled <i>back</i>."}
]
};

{id:"h12",type:"mcq",

{label:"ARTEFACT 1 — WDAC policy XML (simplified)",html:'<div class="logbox"><span class="term-line"><span class="tc">BasePolicy:</span></span><span class="term-line"><span class="tn">  Allow: code signed by Microsoft Windows PCA</span></span><span class="term-line"><span class="tn">  Allow: ISG (intelligent security graph)</span></span><span class="term-line"><span class="tn">  Deny: user-writable paths</span></span><span class="term-line"><span class="tc">SupplementalPolicy &#8220;DevMachine-Flex&#8221;:</span></span><span class="term-line"><span class="tn">  Trust: any signer in the UserRoot store</span></span><span class="term-line"><span class="tn">  Scope: </span><span class="tr">all endpoints</span></span></div>'}

question:"What is the flaw in this policy design?",
hint:"A supplemental policy only weakens what it touches — check who receives that weakness.",
opts:{
A:"The supplemental policy&#8217;s blanket signer trust is scoped to all endpoints instead of the build lab only.",
B:"The base policy trusts Microsoft-signed code.",
C:"The base policy denies user-writable paths.",
D:"Referencing the ISG in the base policy is forbidden."},
correct:["A"],
why:{B:"Trusting the OS vendor&#8217;s signing chain is the foundation of the whole model.",
C:"Denying writable paths is the strength the supplemental policy must not touch.",
D:"The ISG is a supported, conditional trust source — not forbidden, though worth reviewing."},
expl:"A supplemental policy <b>loosens</b> the base policy for whatever it scopes. Granting &#8220;any signer in the UserRoot store&#8221; is a controlled looseness for a <i>build lab</i>, but scoped to <b>all endpoints</b> it hands every workstation a bypass — one self-issued cert away from running arbitrary code. M1045 enforcement lives or dies on scope discipline: loosen narrowly, or not at all."},
{id:"h13",type:"match",
sum:"Map the mitigation to the frameworks",
scenario:[
{label:"ARTEFACT 1 — GRC traceability matrix (rows to fill)",html:"<p>The auditor wants the code-signing control mapped. Match each framework item to its demand.</p>"}
],
question:"Match each framework item to what it asks for.",
hint:"All three ask for the same outcome in their own words: approved code only.",
pairs:[
{l:"CIS Control 2 (authorized software)",r:"Allow only approved, supported software — the signature policy is how the allowlist is expressed"},
{l:"ISO/IEC 27001:2022 A.8.19",r:"Control the installation of software on operational systems"},
{l:"NIST CSF — Protect function",r:"Policy and process so that only code with verified integrity runs"}
],
expl:"The mappings are how GRC proves the mitigation is deliberate: <b>CIS Control 2</b> wants an allowlist of authorized software (publisher rules are that allowlist in executable form), <b>A.8.19</b> wants software installation on operational systems controlled, and the CSF <b>Protect</b> function wants protective process for code integrity. One control, three words — and your signing logs become the evidence for all three."},
{id:"h14",type:"fill",
sum:"Key custody and pre-release check",
scenario:[
{label:"ARTEFACT 1 — Signing policy v2.1, two gaps",html:"<p>The policy committee left two blanks before sign-off.</p>"}
],
question:"Fill both blanks with words from the bank.",
hint:"One blank is a hardware vault; the other is the revocation list the CA publishes.",
parts:["Policy excerpt: signing keys are generated and stored on an ",{a:"HSM"},", and every release artefact is checked against the CA&#8217;s ",{a:"CRL"}," before distribution."],
bank:["HSM","CRL","USB stick","spreadsheet"],
expl:"Keys on an <b>HSM</b> (hardware security module) cannot be copied by malware or insiders — they address the &#8220;stolen key&#8221; failure path. The <b>CRL</b> (with OCSP as its online sibling) is how you refuse signatures from certificates that were revoked yesterday. Both blanks are M1045&#8217;s own implementation measures, and the distractors describe storage that has no trust properties at all."},
{id:"h15",type:"drag",
sum:"Four failure panels, four failure types",
scenario:[
{label:"ARTEFACT 1 — Triage cards",html:"<p>Four files, four different signature failures. Match each card to its failure type.</p>"}

question:"Drag each artefact into the failure type it shows.",
hint:"Each panel shows a different way a signature fails — match the evidence to the label.",
zones:[

{id:"z2",label:"Expired certificate"},
{id:"z3",label:"Untrusted root"},
{id:"z4",label:"Unsigned"}

items:[

{id:"a2",text:"Signing certificate expired two years ago; the file was re-packaged last week"},

{id:"h16",type:"match",

function fmtClock(sec){var m=Math.floor(Math.max(0,sec)/60),s=Math.max(0,sec)%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function pct(sum,count){return count>0?Math.round((sum/count)*100):0;}
function scoreExercise(sel,correct){
  var cs={},i,H=0,W=0;
  for(i=0;i<correct.length;i++){cs[correct[i]]=1;}
  for(i=0;i<sel.length;i++){if(cs[sel[i]]===1){H++;}else{W++;}}
  var N=correct.length;
  if(N===0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ---------- session ---------- */

     hintUsed:{},timer:{state:"IDLE",remain:D.meta.estimatedMinutes*60,interval:null,manualSec:0,autoSec:0},
     reviewReturn:false,attempt:(S&&S.attempt?S.attempt:0)+1,username:(S&&S.username)?S.username:"",locked:{},reported:false};
}
function motionReduced(){return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}

/* ---------- timer state machine ---------- */
var T_STATES={RUNNING:1,PAUSED_MANUAL:1,PAUSED_AUTO_CHECK:1,ENDED:1};
function timerSet(st){
  S.timer.state=st;
  updateHeader();
}
function timerStart(){
  if(S.timer.interval){return;}
  S.timer.interval=setInterval(function(){
    if(S.timer.state==="PAUSED_MANUAL"){S.timer.manualSec+=1;return;}
    if(S.timer.state==="PAUSED_AUTO_CHECK"){S.timer.autoSec+=1;return;}
    if(S.timer.state!=="RUNNING"){return;}
    S.timer.remain-=1;
    if(S.timer.remain<=0){S.timer.remain=0;timerTickEnd();}
    updateHeader();
  },1000);
}
function timerTickEnd(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  showResults();
}
function timerPauseAutoCheck(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_AUTO_CHECK");}
}
function timerResumeFromAuto(){
  if(S.timer.state==="PAUSED_AUTO_CHECK"){timerSet("RUNNING");}
}
function timerPauseManual(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
}
function timerResumeManual(){
  hidePauseOverlay();
  if(S.timer.state==="PAUSED_MANUAL"){timerSet("RUNNING");}
}
function timerStateBadge(){
  var st=S.timer.state;
  if(st==="RUNNING"){return '<span class="badge badge-run" aria-label="Timer running">&#9654; RUNNING</span>';}
  if(st==="PAUSED_MANUAL"){return '<span class="badge badge-paused" aria-label="Timer paused manually">&#9208; PAUSED &#8212; manual (press Resume)</span>';}
  if(st==="PAUSED_AUTO_CHECK"){return '<span class="badge badge-paused" aria-label="Timer paused reviewing feedback">&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)</span>';}
  return '<span class="badge badge-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}

/* ---------- pause overlay (manual pause hides the exercise) ---------- */
function headerPauseClick(){
  var st=S.timer.state;
  if(st==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
  else if(st==="PAUSED_AUTO_CHECK"){showPauseOverlay("auto");}
}
function headerHintClick(){
  if(!S||S.idx>=S.order.length){return;}
  var ex=S.order[S.idx];
  if(exState(ex)||S.hintUsed[ex.id]||$("hint-slot")==null){return;}
  if(S.timer.state==="ENDED"){return;}
  S.hintUsed[ex.id]=true;
  $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  var hb=$("btn-hint");if(hb){hb.disabled=true;}
  updateHeader();
}
function headerSkipClick(){
  if(!S||S.idx>=S.order.length||$("ans-widget")==null){return;}
  var ex=S.order[S.idx];
  if(exState(ex)){return;}
  doSkip(ex);
}

    '<p style="color:var(--text-secondary)">'+(kind==="manual"?"Your exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.":"The timer is already stopped for feedback review. Press the button below when you are ready to go back to the explanation.")+'</p>'+

function updateHeader(){
  var h=$("ex-hdr");
  if(!h||!S){return;}
  var answered=S.answeredCount;
  var scoreTxt=answered>0?("<b>"+(Math.round(S.creditSum*10)/10).toFixed(1)+"</b> / "+answered+" &#183; "+pct(S.creditSum,answered)+"%"):"0 / 0 &#183; &#8212;";
  var pos;
  var reviewShown=!!$("sk-list");
  if(S.reviewReturn){pos="Reviewing a skipped exercise";}
  else if(S.idx<S.order.length&&!reviewShown){pos="Exercise <b>"+(S.idx+1)+"</b> of <b>"+S.order.length+"</b>";}
  else if(reviewShown){pos="Review pool: <b>"+S.skipped.length+"</b> waiting";}
  else{pos="Exam finished";}
  h.setAttribute("role","status");
  $("hdr-dyn").innerHTML=
    '<span class="h-item">'+pos+'</span>'+
    '<span class="h-item">'+sevBadge()+partLabel()+'</span>'+
    '<span class="h-item"><span class="timer-num mono" id="hdr-clock">'+fmtClock(S.timer.remain)+'</span>'+timerStateBadge()+'</span>'+
    '<span class="h-item">Score '+scoreTxt+'</span>'+

  }

  var bs=$("btn-skip-h");

}
function updateProgress(){
  var f=$("prog-fill");
  if(!f||!S){return;}
  var total=S.order.length;
  var done=0,i;
  for(i=0;i<S.order.length;i++){if(S.answered[S.order[i].id]){done++;}}
  var w=total>0?Math.round((done/total)*100):0;
  f.style.width=w+"%";
  f.setAttribute("aria-valuenow",w);
}

/* ---------- exercise rendering ---------- */
function prepareExercise(ex){
  var keys=[],k;
  if(ex.type==="mcq"||ex.type==="multi"){
    for(k in ex.opts){if(Object.prototype.hasOwnProperty.call(ex.opts,k)){keys.push(k);}}
    keys=shuffle(keys);
    ex.renderOpts=keys.map(function(x){return {k:x,text:ex.opts[x]};});
  }else if(ex.type==="match"){
    ex.renderRights=shuffle(ex.pairs.map(function(p){return p.r;}));
    for(k=0;k<ex.pairs.length;k++){ex.pairs[k].rIdx=ex.renderRights.indexOf(ex.pairs[k].r);}
  }else if(ex.type==="drag"){
    ex.renderItems=shuffle(ex.items.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="order"){
    ex.renderItems=shuffle(ex.order.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="fill"){
    ex.renderBank=shuffle(ex.bank);
  }else if(ex.type==="decision"){
    for(k=0;k<ex.steps.length;k++){ex.steps[k].renderOpts=shuffle(ex.steps[k].opts);}
  }
}

  tog.addEventListener("click",function(){

    tog.querySelector(".ct-ico").innerHTML=shown?"&#9656;":"&#9662;";
  });

  var qb=el("div","block blk-question");
  qb.innerHTML='<div class="block-h"><span class="ico" aria-hidden="true">&#10067;</span>QUESTION</div><div class="block-b"><div class="question-text">'+ex.question+'</div></div>';
  wrap.appendChild(qb);

  var ab=el("div","block blk-answer");
  ab.innerHTML='<div class="block-h"><span class="ico" aria-hidden="true">&#9998;</span>YOUR ANSWER</div><div class="block-b"><div id="ans-widget"></div>'+
    '<div id="hint-slot"></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px" id="action-row"></div></div>';
  wrap.appendChild(ab);

  var fb=el("div","","");
  fb.id="fb-slot";
  wrap.appendChild(fb);
  v.appendChild(wrap);

  var w=$("ans-widget");
  if(ex.type==="mcq"||ex.type==="multi"){renderChoice(ex,w);}
  else if(ex.type==="match"){renderMatch(ex,w);}
  else if(ex.type==="drag"){renderDrag(ex,w);}
  else if(ex.type==="order"){renderOrder(ex,w);}
  else if(ex.type==="fill"){renderFill(ex,w);}
  else if(ex.type==="terminal"){renderTerminal(ex,w);}
  else if(ex.type==="decision"){renderDecision(ex,w);}

  renderActionRow(ex);
}
function exState(ex){return S.answered[ex.id];}
function isLocked(ex){return !!S.answered[ex.id];}

/* action row: Hint / Skip / Check / Next / Final Submit */
function renderActionRow(ex){
  var row=$("action-row");
  if(!row){return;}
  row.innerHTML="";
  var st=exState(ex);
  var bSkip=el("button","btn btn-ghost");
  bSkip.type="button";bSkip.id="btn-skip";
  bSkip.innerHTML='&#9888; Skip';
  bSkip.disabled=!!st;
  bSkip.addEventListener("click",function(){doSkip(ex);});
  var bHint=el("button","btn btn-warn btn-small");
  bHint.type="button";
  bHint.id="btn-hint";
  bHint.innerHTML='&#128161; Hint (&#8722;10% of this exercise)';
  if(S.hintUsed[ex.id]||st){bHint.disabled=true;}
  bHint.addEventListener("click",function(){
    if(S.hintUsed[ex.id]){return;}
    S.hintUsed[ex.id]=true;
    bHint.disabled=true;
    $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  });
  row.appendChild(bHint);

  if(ex.type!=="decision"&&!st){
    var bCheck=el("button","btn btn-green");
    bCheck.type="button";bCheck.id="btn-check";
    bCheck.innerHTML='&#9989; Check';
    bCheck.disabled=!widgetHasAnswer(ex);
    bCheck.addEventListener("click",function(){doCheck(ex);});
    row.appendChild(bCheck);
  }
  row.appendChild(bSkip);
  if(st){
    var isLast=(S.idx>=S.order.length-1);
    var bNext=el("button","btn btn-primary");
    bNext.type="button";bNext.id="btn-next";
    bNext.innerHTML=isLast?'&#128230; Final Submit':'Next &#9654;';
    bNext.addEventListener("click",function(){goNext();});
    row.appendChild(bNext);
    bNext.focus();
  }
}
function widgetHasAnswer(ex){
  var i;
  if(ex.type==="mcq"||ex.type==="multi"){return $$(".opt").filter(function(b){return b.classList.contains("selected");}).length>0;}
  if(ex.type==="match"){var ss=$$(".match-select");for(i=0;i<ss.length;i++){if(ss[i].value){return true;}}return false;}
  if(ex.type==="drag"){return $$(".chip[data-zone]").length>0;}
  if(ex.type==="order"){return true;}
  if(ex.type==="fill"){var fs=$$(".fill-select");for(i=0;i<fs.length;i++){if(fs[i].value){return true;}}return false;}
  if(ex.type==="terminal"){return !!($("term-in")&&$("term-in").dataset.ran==="1");}
  return false;
}
function $$(sel,root){root=root||document;var n=root.querySelectorAll(sel);var r=[];for(var i=0;i<n.length;i++){r.push(n[i]);}return r;}

/* ---------- mcq / multi ---------- */
function renderChoice(ex,root){
  var opts=ex.renderOpts;
  var multi=ex.type==="multi";
  var wrap=el("div");
  wrap.setAttribute("role","group");
  wrap.setAttribute("aria-label",multi?"Multi-select answers":"Single-choice answers");
  for(var i=0;i<opts.length;i++){
    var o=opts[i];
    var b=el("button","opt");
    b.type="button";
    b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span><span class="mark" aria-hidden="true"></span>';
    b.addEventListener("click",function(){
      if(isLocked(ex)){return;}
      var k=this.dataset.k;
      if(multi){this.classList.toggle("selected");}
      else{
        var all=$$(".opt");
        for(var j=0;j<all.length;j++){all[j].classList.remove("selected");}
        this.classList.add("selected");
      }
      var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}
    });
    b.className+=" sel-opt";
    wrap.appendChild(b);
  }
  root.appendChild(wrap);
}
function collectChoice(ex){
  var sel=[],marks={},i;
  var ss=$$(".opt.selected");
  for(i=0;i<ss.length;i++){sel.push(ss[i].dataset.k);}
  return sel;
}
function gradeChoice(ex,sel){
  var credit=scoreExercise(sel,ex.correct);
  var rows=[],i,opts=ex.opts;
  var picked={};for(i=0;i<sel.length;i++){picked[sel[i]]=1;}
  var corr={};for(i=0;i<ex.correct.length;i++){corr[ex.correct[i]]=1;}
  var ordered=ex.renderOpts;
  for(i=0;i<ordered.length;i++){
    var k=ordered[i].k;
    if(corr[k]&&picked[k]){rows.push({st:"c",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(corr[k]&&!picked[k]){rows.push({st:"m",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(!corr[k]&&picked[k]){rows.push({st:"w",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
  }
  return {credit:credit,rows:rows};
}

/* ---------- match ---------- */
function renderMatch(ex,root){
  var rights=ex.renderRights;
  var wrap=el("div");
  for(var i=0;i<ex.pairs.length;i++){
    var p=ex.pairs[i];
    var row=el("div","match-row");
    var left=el("div","left","<b>"+(i+1)+".</b> "+p.l);
    var selWrap=el("div");
    var s=el("select","match-select");
    s.dataset.left=String(i);
    s.setAttribute("aria-label","Match for item "+(i+1));
    s.innerHTML='<option value="">&#8212; choose the matching item &#8212;</option>';
    for(var j=0;j<rights.length;j++){
      s.innerHTML+='<option value="'+j+'">'+rights[j]+'</option>';
    }
    s.addEventListener("change",function(){var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}});
    selWrap.appendChild(s);
    row.appendChild(left);row.appendChild(selWrap);
    wrap.appendChild(row);
  }
  root.appendChild(wrap);
}
function gradeMatch(ex){
  var ss=$$(".match-select"),N=ex.pairs.length,sel=[],rows=[],i;
  for(i=0;i<ss.length;i++){
    var li=parseInt(ss[i].dataset.left,10);
    if(!ss[i].value){rows.push({st:"m",text:'<b>'+ex.pairs[li].l+'</b> &#8212; correct match: <b>'+ex.pairs[li].r+'</b>'});continue;}
    if(ex.pairs[li].rIdx===parseInt(ss[i].value,10)){
      sel.push("p"+li);
      rows.push({st:"c",text:'<b>'+ex.pairs[li].l+'</b> &#8594; <b>'+ex.pairs[li].r+'</b>'});
    }else{
      sel.push("X"+li);
      rows.push({st:"w",text:'<b>'+ex.pairs[li].l+'</b> &#8212; you chose &#8220;'+ex.renderRights[parseInt(ss[i].value,10)]+'&#8221;. Correct: <b>'+ex.pairs[li].r+'</b>'});
    }
  }
  var correct=[];for(i=0;i<N;i++){correct.push("p"+i);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- drag & drop ---------- */
function renderDrag(ex,root){
  var wrap=el("div");
  var bankLabel=el("div","sub-label","&#9635; Item bank &#8212; click a chip, then click a zone (or drag it)");
  wrap.appendChild(bankLabel);
  var bank=el("div","bank");bank.id="dd-bank";
  for(var i=0;i<ex.renderItems.length;i++){
    var it=ex.renderItems[i];
    bank.appendChild(makeChip(it.id,it.text,ex));
  }
  wrap.appendChild(bank);
  var zones=el("div","zones");
  var cols=ex.zones.length>2?"1fr 1fr":"1fr";
  if(ex.zones.length>2){zones.style.gridTemplateColumns="1fr 1fr";}
  for(var z=0;z<ex.zones.length;z++){
    var zn=ex.zones[z];
    var zd=el("div","zone");zd.id="zone-"+zn.id;zd.dataset.zid=zn.id;
    zd.setAttribute("tabindex","0");
    zd.setAttribute("role","button");
    zd.setAttribute("aria-label","Drop zone: "+zn.label);
    zd.innerHTML='<div class="zone-h"><span aria-hidden="true">&#9635;</span>'+zn.label+'</div>';
    zd.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        var pk=document.querySelector(".chip.picked");
        if(pk){moveChip(pk.dataset.id,this.dataset.zid,ex);}
      }
    });
    zd.addEventListener("click",function(ev){
      if(ev.target!==this&&ev.target.parentNode!==this){return;}
      var pk=document.querySelector(".chip.picked");
      if(pk){moveChip(pk.dataset.id,this.dataset.zid,ex);}
    });
    zd.addEventListener("dragover",function(e){e.preventDefault();this.classList.add("over");});
    zd.addEventListener("dragleave",function(){this.classList.remove("over");});
    zd.addEventListener("drop",function(e){e.preventDefault();this.classList.remove("over");var id=e.dataTransfer.getData("text/plain");if(id){moveChip(id,this.id.replace("zone-",""),ex);}});
    zones.appendChild(zd);
  }
  wrap.appendChild(zones);
  var bankZone=bank;
  bank.addEventListener("dragover",function(e){e.preventDefault();});
  bank.addEventListener("drop",function(e){e.preventDefault();var id=e.dataTransfer.getData("text/plain");if(id){moveChip(id,null,ex);}});
  root.appendChild(wrap);
}
function makeChip(id,text,ex){
  var c=el("button","chip");
  c.type="button";c.draggable=true;c.dataset.id=id;c.dataset.text=text;
  c.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+text+'</span>';
  c.addEventListener("click",function(){
    if(isLocked(ex)){return;}
    if(this.dataset.zone){moveChip(this.dataset.id,null,ex);}
    else{
      var was=this.classList.contains("picked");
      $$(".chip.picked").forEach(function(x){x.classList.remove("picked");});
      if(!was){this.classList.add("picked");}
    }
  });
  c.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",this.dataset.id);this.classList.add("dragging");});
  c.addEventListener("dragend",function(){this.classList.remove("dragging");});
  return c;
}
function moveChip(id,zid,ex){
  if(isLocked(ex)){return;}
  var c=document.querySelector('.chip[data-id="'+id+'"]');
  if(!c){return;}
  c.classList.remove("picked");
  if(zid){
    var z=$("zone-"+zid);
    c.dataset.zone=zid;
    z.appendChild(c);
  }else{
    delete c.dataset.zone;
    $("dd-bank").appendChild(c);
  }
  var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}
}
function placeChip(){/* handled via moveChip */}
function gradeDrag(ex){
  var correct=[],sel=[],rows=[],i;
  for(i=0;i<ex.items.length;i++){
    var it=ex.items[i];
    var zid=ex.map[it.id];
    correct.push("i"+it.id+"@"+zid);
  }
  var chips=$$(".chip[data-id]");
  for(i=0;i<chips.length;i++){
    var id=chips[i].dataset.id;
    var placed=chips[i].dataset.zone;
    var want=ex.map[id];
    if(placed&&placed===want){sel.push("i"+id+"@"+want);rows.push({st:"c",text:'<b>'+chips[i].dataset.text+'</b> &#8594; '+zoneName(ex,want)});}
    else if(placed){sel.push("X"+id);rows.push({st:"w",text:'<b>'+chips[i].dataset.text+'</b> &#8594; you placed it in &#8220;'+zoneName(ex,placed)+'&#8221;. Correct: <b>'+zoneName(ex,want)+'</b>'});}
    else{rows.push({st:"m",text:'<b>'+chips[i].dataset.text+'</b> &#8212; not placed. Correct zone: <b>'+zoneName(ex,want)+'</b>'});}
  }
  return {credit:scoreExercise(sel,correct),rows:rows};
}
function zoneName(ex,zid){for(var i=0;i<ex.zones.length;i++){if(ex.zones[i].id===zid){return ex.zones[i].label;}}return zid;}

/* ---------- ordering ---------- */
function renderOrder(ex,root){
  var wrap=el("div");
  var note=el("div","sub-label","&#9635; Reorder &#8212; drag a row, or use the arrows");
  wrap.appendChild(note);
  var list=el("div");list.id="ord-list";
  for(var i=0;i<ex.renderItems.length;i++){
    list.appendChild(orderRow(ex,ex.renderItems[i],i));
  }
  wrap.appendChild(list);
  root.appendChild(wrap);
}
function orderRow(ex,item,i){
  var r=el("div","order-row");r.draggable=true;r.dataset.oid=item.id;r.dataset.text=item.text;
  r.innerHTML='<span class="num">'+(i+1)+'</span><span class="txt">'+item.text+'</span>'+
    '<span class="mini-btns"><button type="button" aria-label="Move up">&#9650;</button><button type="button" aria-label="Move down">&#9660;</button></span>';
  var btns=r.querySelectorAll("button");
  btns[0].addEventListener("click",function(){orderMove(ex,r,-1);});
  btns[1].addEventListener("click",function(){orderMove(ex,r,1);});
  r.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",this.dataset.oid);this.classList.add("dragging");});
  r.addEventListener("dragend",function(){this.classList.remove("dragging");});
  r.addEventListener("dragover",function(e){e.preventDefault();});
  r.addEventListener("drop",function(e){e.preventDefault();var id=e.dataTransfer.getData("text/plain");orderReorder(ex,id,this.dataset.oid);});
  return r;
}
function orderMove(ex,row,dir){
  if(isLocked(ex)){return;}
  var list=$("ord-list");
  var rows=list.getElementsByClassName("order-row");
  var arr=[],i,idx=-1;
  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i]===row){idx=i;}}
  var j=idx+dir;
  if(j<0||j>=arr.length){return;}
  var tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp;
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}
function orderReorder(ex,srcId,dstId){
  if(isLocked(ex)||srcId===dstId){return;}
  var list=$("ord-list");
  var rows=list.getElementsByClassName("order-row");
  var arr=[],i,si=0,di=0;
  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i].dataset.oid===srcId){si=i;}if(rows[i].dataset.oid===dstId){di=i;}}
  var item=arr.splice(si,1)[0];
  arr.splice(di,0,item);
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}
function orderRenumber(row,i){row.querySelector(".num").innerHTML=(i+1);}
function gradeOrder(ex){
  var rows=$$(".order-row"),N=ex.order.length,sel=[],frows=[],i;
  var pos={};for(i=0;i<ex.order.length;i++){pos[ex.order[i].id]=i;}
  for(i=0;i<rows.length;i++){
    var id=rows[i].dataset.oid;
    if(pos[id]===i){sel.push("p"+i);frows.push({st:"c",text:'<b>'+(i+1)+'.</b> '+rows[i].dataset.text});}
    else{sel.push("X"+i);frows.push({st:"w",text:'<b>'+(i+1)+'.</b> you placed &#8220;'+rows[i].dataset.text+'&#8221;. Expected: <b>'+ex.order[i].text+'</b>'});}
  }
  var correct=[];for(i=0;i<N;i++){correct.push("p"+i);}
  return {credit:scoreExercise(sel,correct),rows:frows};
}

/* ---------- fill in the blanks ---------- */
function renderFill(ex,root){
  var wrap=el("div");
  var line=el("div","fill-line");
  var html="";
  var blankOrd=0;
  for(var i=0;i<ex.parts.length;i++){
    var p=ex.parts[i];
    if(typeof p==="string"){html+=p;}
    else{
      blankOrd++;
      html+='<select class="fill-select" data-b="'+i+'" aria-label="Blank '+blankOrd+'"><option value="">&#8212; ? &#8212;</option>';
      for(var j=0;j<ex.renderBank.length;j++){html+='<option value="'+j+'">'+ex.renderBank[j]+'</option>';}
      html+='</select>';
    }
  }
  line.innerHTML=html;
  wrap.appendChild(line);
  var bankNote=el("div","bank-chips",'<div class="sub-label" style="margin-top:12px">&#9635; Word bank (shuffled &#8212; same choices on every blank)</div><div>');
  for(var b=0;b<ex.renderBank.length;b++){bankNote.innerHTML+='<span class="chip" style="cursor:default;min-height:36px;padding:4px 12px">'+ex.renderBank[b]+'</span>';}
  bankNote.innerHTML+='</div>';
  wrap.appendChild(bankNote);
  var ss=wrap.querySelectorAll("select");
  for(i=0;i<ss.length;i++){
    ss[i].addEventListener("change",function(){var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}});
  }
  root.appendChild(wrap);
}
function gradeFill(ex){
  var ss=$$(".fill-select"),sel=[],rows=[],i,blankIdx=[];
  for(i=0;i<ex.parts.length;i++){if(typeof ex.parts[i]!=="string"){blankIdx.push(i);}}
  for(i=0;i<ss.length;i++){
    var bi=parseInt(ss[i].dataset.b,10);
    var want=ex.parts[bi].a;
    var wantIdx=-1,k;
    for(k=0;k<ex.renderBank.length;k++){if(ex.renderBank[k]===want){wantIdx=k;break;}}
    if(!ss[i].value){rows.push({st:"m",text:'Blank '+(i+1)+': left empty. Correct: <b>'+want+'</b>'});continue;}
    if(parseInt(ss[i].value,10)===wantIdx){sel.push("b"+bi);rows.push({st:"c",text:'Blank '+(i+1)+': <b>'+want+'</b>'});}
    else{sel.push("X"+bi);rows.push({st:"w",text:'Blank '+(i+1)+': you chose &#8220;'+ex.renderBank[parseInt(ss[i].value,10)]+'&#8221;. Correct: <b>'+want+'</b>'});}
  }
  var correct=[];for(i=0;i<blankIdx.length;i++){correct.push("b"+blankIdx[i]);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- terminal ---------- */
function renderTerminal(ex,root){
  var wrap=el("div");
  wrap.innerHTML='<div class="sub-label">&#9635; '+esc(ex.term.title)+'</div>'+
    '<div class="term">'+
    '<div class="term-title"><span aria-hidden="true">&#9654;</span>'+esc(ex.term.env)+'</div>'+
    '<div class="term-scroll term mono" id="term-scroll">'+ex.term.banner+'</div>'+
    '<div class="term-input-row"><span class="term-prompt">'+ex.term.prompt+'</span>'+
    '<input id="term-in" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command">'+
    '<button type="button" class="btn btn-small btn-green" id="term-run">Run &#9166;</button></div></div>'+
    (ex.term.syntaxPanel?('<div class="sub" style="margin-top:10px">'+ex.term.syntaxPanel+'</div>'):"")+
    (ex.term.outputSample?('<div class="sub" style="margin-top:10px"><div class="sub-label">Expected output shape</div>'+ex.term.outputSample+'</div>'):"");
  root.appendChild(wrap);
  var inp=$("term-in");
  $("term-run").addEventListener("click",function(){termRun(ex);});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();termRun(ex);}});
}
function termNormalize(cmd){
  return cmd.replace(/["']/g,"").replace(/\|/g," | ").replace(/\s+/g," ").trim().toLowerCase();
}
function termRun(ex){
  var inp=$("term-in");
  var cmd=inp.value;
  if(!cmd.trim()){return;}
  var scroll=$("term-scroll");
  var line=el("span","term-line");
  line.innerHTML='<span class="tg">'+esc(ex.term.prompt)+'</span> '+esc(cmd);
  scroll.appendChild(line);
  var norm=termNormalize(cmd);
  var firstTok=norm.split(" ")[0];
  var toolOk=false,i;
  for(i=0;i<ex.term.acceptTools.length;i++){if(firstTok===ex.term.acceptTools[i]){toolOk=true;}}
  var out=el("span","term-line");
  if(toolOk){out.innerHTML=ex.term.outputHtml;}
  else{out.innerHTML='<span class="tr">command not found: '+esc(firstTok)+' &#8212; this lab shell only accepts the trust-verification tooling.</span>';}
  scroll.appendChild(out);
  scroll.scrollTop=scroll.scrollHeight;
  inp.dataset.ran="1";inp.dataset.last=cmd;
  var bc=$("btn-check");if(bc){bc.disabled=false;}
  inp.focus();
}
function gradeTerminal(ex){
  var cmd=termNormalize($("term-in").dataset.last||"");
  var segs=cmd.split("|");
  var mainToks=segs[0].trim().split(" ").filter(function(x){return x.length>0;});
  var pipeStages=[],s;
  for(s=1;s<segs.length;s++){
    var pt=segs[s].trim().split(" ").filter(function(x){return x.length>0;});
    if(pt.length>0){pipeStages.push(pt[0]);}
  }
  var rows=[],sel=[],i,k;
  var flags=[];
  var target="";
  for(i=1;i<mainToks.length;i++){
    var t=mainToks[i];
    if(t.charAt(0)==="/"||t.charAt(0)==="-"){flags.push(t);}
    else{target=t;}
  }
  var normTarget=(target||"").replace(/\//g,"\\").replace(/\\+/g,"\\").replace(/\\$/,"");
  var allToks=mainToks.concat(pipeStages);
  var hits={};
  for(i=0;i<ex.term.elements.length;i++){
    var e2=ex.term.elements[i],ok=false;
    if(e2.kind==="tool"){ok=(mainToks.length>0&&ex.term.acceptTools.indexOf(mainToks[0])>=0);}
    else if(e2.kind==="tok"){for(k=0;k<allToks.length;k++){if(e2.accept.indexOf(allToks[k])>=0){ok=true;break;}}}
    else if(e2.kind==="flag"){for(k=0;k<flags.length;k++){if(e2.accept.indexOf(flags[k].replace(/^-/,"/").toLowerCase())>=0){ok=true;break;}}}
    else if(e2.kind==="target"){ok=(e2.accept.indexOf(normTarget)>=0);}
    else if(e2.kind==="pipe"){for(k=0;k<pipeStages.length;k++){if(e2.accept.indexOf(pipeStages[k])>=0){ok=true;break;}}}
    if(ok){hits[e2.key]=1;sel.push(e2.key);}else{rows.push({st:"m",text:'<b>'+e2.name+'</b> &#8212; missing or wrong. Expected: <span class="mono">'+esc(e2.expect)+'</span>'});}
  }
  var reqFlags={};for(i=0;i<ex.term.elements.length;i++){if(ex.term.elements[i].kind==="flag"){for(k=0;k<ex.term.elements[i].accept.length;k++){reqFlags[ex.term.elements[i].accept[k]]=1;}}}
  var optFlags=ex.term.optionalFlags||[];
  for(i=0;i<flags.length;i++){
    var f=flags[i].replace(/^-/,"/").toLowerCase();
    if(!reqFlags[f]&&optFlags.indexOf(f)<0){sel.push("Xflag"+i);}
  }
  var dangerous=/(^|\s)(del|erase|rm|remove-item|ri)(\s|$)|delete-driver|delstore|deleteroot|\/uninstall/.test(cmd);
  for(i=0;i<ex.term.elements.length;i++){
    var e3=ex.term.elements[i];
    if(hits[e3.key]){rows.unshift({st:"c",text:'<b>'+e3.name+'</b> &#8212; correct (<span class="mono">'+esc(e3.expect)+'</span>)'});}
  }
  if(dangerous){rows.push({st:"w",text:'<b>DANGEROUS &#8212; NEAR MISS:</b> this command pattern would alter or destroy trust state or evidence on a live host. Never clean up while you still need evidence.'});}
  var correct=[];for(i=0;i<ex.term.elements.length;i++){correct.push(ex.term.elements[i].key);}
  return {credit:scoreExercise(sel,correct),rows:rows,dangerous:dangerous};
}

/* ---------- decision tree ---------- */
function renderDecision(ex,root){
  var wrap=el("div");
  wrap.innerHTML='<div class="sub-label" id="dec-step-label"></div><div id="dec-step-body"></div>';
  root.appendChild(wrap);
  ex.decState={step:0,picks:[]};
  renderDecisionStep(ex);
}
function renderDecisionStep(ex){
  var st=ex.decState.step;
  var step=ex.steps[st];
  var stepOpts=step.renderOpts||step.opts;
  $("dec-step-label").innerHTML='<span class="badge badge-medium" style="letter-spacing:.08em">STEP '+(st+1)+' OF '+ex.steps.length+'</span>';
  var body=$("dec-step-body");
  body.innerHTML="";
  if(step.scene){var sc=el("div","artefact");sc.innerHTML='<div class="sub-label">'+step.sceneLabel+'</div>'+step.scene;body.appendChild(sc);}
  var q=el("div","","<p style='font-weight:600'>"+step.q+"</p>");
  body.appendChild(q);
  var verdict=el("div","","");verdict.id="dec-verdict";
  var opts=el("div","");opts.id="dec-opts";
  for(var i=0;i<stepOpts.length;i++){
    var o=stepOpts[i];
    var b=el("button","opt");
    b.type="button";b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span>';
    b.addEventListener("click",function(){decisionPick(ex,this);});
    opts.appendChild(b);
  }
  body.appendChild(opts);
  body.appendChild(verdict);
}
function decisionPick(ex,btn){
  if(btn.classList.contains("picked-opt")){return;}
  var st=ex.decState.step;
  var step=ex.steps[st];
  var k=btn.dataset.k;
  ex.decState.picks.push(k);
  var ok=(k===step.correct);
  var all=$$("#dec-opts .opt");
  for(var i=0;i<all.length;i++){all[i].classList.add("picked-opt");if(all[i].dataset.k===step.correct){all[i].querySelector(".k").innerHTML='&#10003;';all[i].style.borderColor="var(--state-correct)";}else if(all[i]===btn){all[i].querySelector(".k").innerHTML='&#10007;';all[i].style.borderColor="var(--state-incorrect)";}}
  var v=$("dec-verdict");
  v.innerHTML='<div class="fb-row '+(ok?"ri-correct":"ri-wrong")+'"><span class="st">'+(ok?"&#10003; Correct":"&#10007; Not the best call")+'</span><span>'+step.why+'</span></div>'+
    '<div class="center" style="margin-top:10px"><button type="button" class="btn btn-primary btn-small" id="dec-next-btn">'+(st===ex.steps.length-1?"&#9989; Check &#8212; final step":"Confirm &amp; continue &#9654;")+'</button></div>';
  $("dec-next-btn").addEventListener("click",function(){decisionAdvance(ex);});
  $("dec-next-btn").focus();
}
function decisionAdvance(ex){
  var st=ex.decState.step;
  if(st<ex.steps.length-1){
    ex.decState.step++;
    renderDecisionStep(ex);
  }else{
    doCheck(ex);
  }
}
function optTextOf(step,k){var list=step.renderOpts||step.opts;for(var i=0;i<list.length;i++){if(list[i].k===k){return list[i].text;}}return "(no answer)";}
function gradeDecision(ex){
  var sel=[],rows=[],i;
  for(i=0;i<ex.steps.length;i++){
    var step=ex.steps[i];
    var pick=ex.decState.picks[i];
    if(pick===step.correct){sel.push("s"+i);rows.push({st:"c",text:'<b>Step '+(i+1)+'.</b> '+step.recap});}
    else{sel.push("X"+i);rows.push({st:"w",text:'<b>Step '+(i+1)+'.</b> You chose &#8220;'+optTextOf(step,pick)+'&#8221;. Best call: <b>'+optTextOf(step,step.correct)+'</b>. '+step.recap});}
  }
  var correct=[];for(i=0;i<ex.steps.length;i++){correct.push("s"+i);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- check / skip / next ---------- */
function doCheck(ex){
  if(exState(ex)){return;}
  timerPauseAutoCheck();
  var res,i;
  if(ex.type==="mcq"||ex.type==="multi"){res=gradeChoice(ex,collectChoice(ex));}
  else if(ex.type==="match"){res=gradeMatch(ex);}
  else if(ex.type==="drag"){res=gradeDrag(ex);}
  else if(ex.type==="order"){res=gradeOrder(ex);}
  else if(ex.type==="fill"){res=gradeFill(ex);}
  else if(ex.type==="terminal"){res=gradeTerminal(ex);}
  else if(ex.type==="decision"){res=gradeDecision(ex);}
  if(S.hintUsed[ex.id]){res.credit=Math.max(0,res.credit-0.10);res.hintPenalty=true;}
  res.credit=Math.round(res.credit*100)/100;
  S.answered[ex.id]={credit:res.credit,rows:res.rows,type:ex.type,dangerous:res.dangerous};
  S.creditSum+=res.credit;S.answeredCount++;
  renderFeedback(ex,res);
  updateHeader();updateProgress();
  var bc=$("btn-check");if(bc){bc.disabled=true;}
  var bs=$("btn-skip");if(bs){bs.disabled=true;}
  if(ex.type==="terminal"){var ti=$("term-in");if(ti){ti.disabled=true;}var tr=$("term-run");if(tr){tr.disabled=true;}}
  if(ex.type==="decision"){var db=$("dec-next-btn");if(db){db.disabled=true;}}
  renderActionRow(ex);
}
function renderFeedback(ex,res){
  var slot=$("fb-slot");
  var label,cls;
  if(res.credit>=1){label='&#10003; CORRECT';cls="fb-correct";}
  else if(res.credit>0){label='&#10003; PARTIALLY CORRECT &#8212; credit '+res.credit.toFixed(2)+' &#8212; '+Math.round(res.credit*100)+'% of items';cls="fb-partial";}
  else{label='&#10007; INCORRECT';cls="fb-incorrect";}
  var html='<div class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>'+
    (res.hintPenalty?'<span class="tag-mono">includes &#8722;0.10 hint cost</span>':"")+'</div><div class="fb-b">';
  if(res.rows&&res.rows.length>1||(ex.type!=="mcq"&&res.rows)){
    for(var i=0;i<res.rows.length;i++){
      var r=res.rows[i];
      var stTxt=r.st==="c"?'<span class="st">&#10003; Correct</span>':(r.st==="w"?'<span class="st">&#10007; Wrong</span>':'<span class="st">&#9675; Missed</span>');
      html+='<div class="fb-row ri-'+(r.st==="c"?"correct":(r.st==="w"?"wrong":"miss"))+'">'+stTxt+'<span>'+r.text+'</span></div>';
    }
  }
  if(ex.type==="terminal"){
    html+='<div class="codebox"><div class="sub-label">Canonical command</div><span class="term-line">'+esc(ex.term.canonical)+'</span></div>'+
      '<p style="font-size:14.5px">'+ex.term.canonicalExplain+'</p>';
  }
  html+='<div style="margin-top:10px">'+ex.expl+'</div>';
  if(res.credit<1&&ex.study){html+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';}
  html+='</div></div>';
  slot.innerHTML=html;
  slot.scrollIntoView({behavior:motionReduced()?"auto":"smooth",block:"nearest"});
}
function doSkip(ex){
  if(exState(ex)){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  if(S.reviewReturn){showReview();return;}
  goNextAfterSkip();
}
function goNextAfterSkip(){
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{
    if(S.skipped.length>0&&S.timer.state!=="ENDED"){showReview();}
    else{showResults();}
  }
}
function goNext(){
  timerResumeFromAuto();
  if(S.reviewReturn){S.reviewReturn=false;showReview();return;}
  var isLast=(S.idx>=S.order.length-1);
  if(!isLast){S.idx++;renderExercise();}
  else{
    if(S.timer.state==="ENDED"){showResults();return;}
    if(S.skipped.length>0){showReview();return;}
    showResults();
  }
}

/* ---------- review skipped ---------- */
function showReview(){
  updateHeader();
  var v=$("exam-view");
  v.innerHTML='<div class="card"><h2 style="margin-top:0;color:var(--accent-amber)">&#9888; Review skipped exercises</h2>'+
    '<p style="color:var(--text-secondary)">These exercises are waiting. You can return to any of them and answer it, as long as the timer has not ended. If you submit now, every exercise still on this list is <b>excluded from the score</b> &#8212; it does not count as right or wrong.</p>'+
    '<div class="sk-list" id="sk-list"></div>'+
    '<hr class="divider">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-green" id="btn-final-submit">&#128230; Final Submit &#8212; exclude the rest</button></div></div>';
  var list=$("sk-list");
  var remaining=[];
  for(var i=0;i<S.skipped.length;i++){if(!S.answered[S.skipped[i]]){remaining.push(S.skipped[i]);}}
  if(remaining.length===0){
    list.innerHTML='<p style="color:var(--state-correct)">&#10003; Nothing left to answer &#8212; ready to submit.</p>';
  }
  for(i=0;i<remaining.length;i++){
    (function(id){
      var ex=byId(id);
      var row=el("div","fb-row ri-miss");
      row.innerHTML='<span class="st">&#9888; Skipped</span><span style="flex:1">'+(ex.sum||ex.question)+'</span>';
      var b=el("button","btn btn-small btn-primary","Answer &#9654;");
      b.type="button";
      b.addEventListener("click",function(){
        S.reviewReturn=true;
        S.idx=S.order.indexOf(ex);
        renderExercise();
        timerResumeFromAuto();
      });
      row.appendChild(b);
      list.appendChild(row);
    })(remaining[i]);
  }
  $("btn-final-submit").addEventListener("click",function(){showResults();});
  window.scrollTo(0,0);
}
function byId(id){for(var i=0;i<D.exercises.length;i++){if(D.exercises[i].id===id){return D.exercises[i];}}return null;}

/* ---------- results ---------- */
function showResults(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  var full=0,partial=0,partSum=0,zero=0,excluded=0,i;
  for(i=0;i<S.order.length;i++){
    var id=S.order[i].id;
    var st=S.answered[id];
    if(st){
      if(st.credit>=1){full++;}
      else if(st.credit>0){partial++;partSum+=st.credit;}
      else{zero++;}
    }else if(S.skipped.indexOf(id)>=0||S.idx<S.order.length){excluded++;}
  }
  var answered=S.answeredCount;
  var percent=pct(S.creditSum,answered);
  var passed=percent>=D.meta.passMark;
  var v=$("exam-view");
  var html='<div class="card"><h2 style="margin-top:0">&#127942; Final results</h2>'+
    '<div class="res-grid">'+
    '<div class="res-card"><div class="big" style="color:var(--text-primary)">'+(Math.round(S.creditSum*10)/10).toFixed(1)+' / '+answered+'</div><div class="lbl"><b>'+percent+'%</b> &#8212; computed over answered exercises only</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-correct)">&#10003; '+full+'</div><div class="lbl">Fully correct</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-partial)">&#10003; '+partial+'</div><div class="lbl">Partially correct'+(partial>0?(" &#8212; avg "+(partSum/partial).toFixed(2)):"")+'</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-incorrect)">&#10007; '+zero+'</div><div class="lbl">Fully incorrect</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-skipped)">&#9888; '+excluded+'</div><div class="lbl">Skipped / unanswered &#8212; excluded</div></div>'+
    '</div>'+
    '<div class="verdict '+(passed?"pass":"fail")+'"><div class="v-title">'+(passed?"&#10003; PASS":"&#10007; FAIL")+' &#8212; '+percent+'%</div>'+
    '<p style="color:var(--text-secondary)">'+(passed?"You reached the pass mark of "+D.meta.passMark+"%. Well done &#8212; the certificate panel below is yours.":"You did not reach the pass mark of "+D.meta.passMark+"%. Study the explanations and retake the exam &#8212; the questions and options will be shuffled.")+'</p></div>'+
    '<p style="color:var(--text-secondary);font-size:14px"><b>Time report:</b> '+fmtClock(S.timer.remain)+' left on the clock &#183; '+fmtClock(S.timer.manualSec)+' paused manually (breaks) &#183; '+fmtClock(S.timer.autoSec)+' paused for feedback review.</p>'+
    '<div class="center" style="margin-top:14px"><button type="button" class="btn btn-primary" id="btn-retake" style="font-size:16px;padding:12px 34px">&#8635; Retake Exam</button></div></div>';
  v.innerHTML=html;
  $("btn-retake").addEventListener("click",retake);
  reportScore(S.creditSum,answered);
  window.scrollTo(0,0);
}
function retake(){
  var attempt=S.attempt,uname=S.username;
  newSession();
  S.attempt=attempt+1;S.username=uname;
  renderIntro();
  window.scrollTo(0,0);
}

/* ---------- site integration ---------- */
function reportScore(creditSum,answeredCount){
  if(S.reported){return;}
  S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){/* opened directly, not inside the site frame */}
}
window.addEventListener("message",function(event){
  if(!event.data){return;}
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT"){return;}
  if(S){S.username=event.data.username||"";updateHeader();}
});
</script>
<script>
newSession();
renderIntro();
</script>
</body>
</html>
