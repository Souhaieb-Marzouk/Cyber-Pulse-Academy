expl:"The senior move is the one that stays reversible: <b>gather more evidence before the fleet decision</b>. Out-of-band publisher verification, a sandbox run, and a proper look at the two reports cost hours; a wrong mass deployment costs the whole estate. This is the &#8220;do nothing yet&#8221; answer the exam promised — and it is a real answer: M1045 gives you a trust <i>checkpoint</i>, not a safety verdict, and the checkpoint says &#8220;unknown publisher with odd behaviour&#8221;."},
{id:"x02",type:"decision",
sum:"Branching incident — the build certificate is signing at 03:00",
scenario:[
{label:"ARTEFACT 1 — Signing telemetry (extract)",html:'<div class="logbox"><span class="term-line"><span class="tn">02:58&#8211;03:41 — 41 signings — cert </span><span class="tk">MIDCORP-Build-2024</span><span class="tn"> — source ASN: </span><span class="tr">unfamiliar, overseas hosting</span></span><span class="term-line"><span class="tn">03:05 — email from build vendor: &#8220;planned maintenance, ignore activity&#8221;</span></span><span class="term-line"><span class="tn">03:20 — artifacts: signed installers published to the public download site</span></span></div>'}
],
question:"Command the incident: choose the best call at each of the five steps.",
hint:"Signals conflict. Decide which source wins, accept the real costs, and keep the customer answer provable.",
steps:[
{scene:"<p>Telemetry says compromise. The vendor&#8217;s email says maintenance. The CISO wants a decision in ten minutes.</p>",sceneLabel:"STEP CONTEXT",
q:"Which source do you act on first?",
opts:[{k:"A",text:"Act on the telemetry: declare suspected key compromise and pull the signing credentials offline now"},{k:"B",text:"Trust the vendor email; it came from the right domain"},{k:"C",text:"Wait for the weekend to end and reconcile both sources on Monday"}],
correct:"A",
why:"Maintenance windows do not publish malware from overseas hosting; the vendor email could itself be compromised or simply wrong. Credentials offline is reversible; another hour of signing is not.",
recap:"You treated machine telemetry as primary over an unverifiable human claim — the correct precedence under conflict."},
{scene:"<p>Key is offline. Revocation would also break about 40 internal apps that trust this certificate until they are re-signed.</p>",sceneLabel:"STEP CONTEXT",
q:"Revoke now or after business hours?",
opts:[{k:"A",text:"Revoke now — every hour the certificate stays valid, the attacker&#8217;s signatures keep working"},{k:"B",text:"Wait until tonight: 40 broken apps is a worse incident than malware"},{k:"C",text:"Never revoke; re-signing alone is enough"}],
correct:"A",
why:"The 40 apps are a known, bounded cost with a plan (re-sign); unbounded is every endpoint that runs the attacker&#8217;s freshly signed installers. Accept the visible cost to remove the invisible one.",
recap:"You accepted a real business cost to close the attacker&#8217;s window — the trade this incident is famous for."},
{scene:"<p>Certificate revoked; CRL and OCSP updated. The attacker signed for about 45 minutes.</p>",sceneLabel:"STEP CONTEXT",
q:"How do you scope the hunt?",
opts:[{k:"A",text:"Enumerate everything signed by the certificate&#8217;s thumbprint in the abuse window, across endpoints, servers, and the public download site"},{k:"B",text:"Check only the build server"},{k:"C",text:"Check only machines that produced an alert"}],
correct:"A",
why:"The thumbprint is a precise, complete search key; partial scopes inherit the attacker&#8217;s choice of what got noticed.",
recap:"You hunted by thumbprint and window — the only scope that matches a signing-key compromise."},
{scene:"<p>The public download site hosted two malicious installers signed in the window. Customers may have downloaded them.</p>",sceneLabel:"STEP CONTEXT",
q:"Legal asks: &#8220;Was customer software affected?&#8221; — what is the defensible process?",
opts:[{k:"A",text:"Compare customer-visible artefacts&#8217; signature timestamps and thumbprints against the abuse window; publish only verified findings"},{k:"B",text:"Assume none were affected and sign the statement now"},{k:"C",text:"Say nothing until someone asks"}],
correct:"A",
why:"Timestamps on the attacker&#8217;s signatures let you separate abuse-window artefacts from legitimate ones — the provable boundary legal and regulators need.",
recap:"You made the answer provable from artefacts, not assurances — that is what survives scrutiny."},
{scene:"<p>Immediate fire is out. The board asks what stops a repeat.</p>",sceneLabel:"STEP CONTEXT",
q:"What is the structural fix?",
opts:[{k:"A",text:"Rotate keys on the HSM, enforce two-person signing, and move to short-lived signing certificates"},{k:"B",text:"Buy another antivirus product"},{k:"C",text:"Disable remote signing permanently"}],
correct:"A",
why:"Rotation ends the stolen-key value; two-person signing removes single-actor abuse; short-lived certificates cap future windows. The other options do not touch the failure path.",
recap:"You fixed the trust system, not the symptom — rotation, dual control, short validity."}
],
expl:"This is the full arc of a signing-key compromise, the worst-case failure of M1045: conflicting signals resolved by source reliability, a costly-but-correct revocation, thumbprint-scoped hunting, timestamp-based customer answers, and a structural fix. Note how the mitigation&#8217;s own measures — revocation management, key custody, pipeline control — are the incident controls; the programme you build is the response you get."},
{id:"x03",type:"drag",

scenario:[
{label:"ARTEFACT 1 — Architecture review board, six findings",html:"<p>Map each finding to the technique it matches — or to the gap zone if M1045 has no lever for it.</p>"}

question:"Drag each finding into the correct zone.",
hint:"Four findings are code or image trust problems. Two are not about running code at all.",
zones:[
{id:"z1",label:"T1601.002 — Downgrade System Image"},

{id:"z5",label:"Not in M1045 scope"}

items:[
{id:"x1",text:"A device is re-flashed with an older image that the current trust policy rejects"},
{id:"x2",text:"An unsigned VIB is installed on an ESXi host — execInstalledOnly would have refused it"},
{id:"x3",text:"A signed binary&#8217;s hash no longer matches its own signature after a &#8216;patch&#8217;"},
{id:"x4",text:"A developer pulls a swapped &#8216;official&#8217; image tag because the registry has no content trust"},
{id:"x5",text:"An attacker captures WPA handshakes from the visitor network"},

map:{x1:"z1",x2:"z2",x3:"z3",x4:"z4",x5:"z5",x6:"z5"},
expl:"<b>T1601.002</b>: signed images are the defence that lets a device refuse downgrades. <b>T1505.006</b>: the M1045 page names <span class=\"mono\">execInstalledOnly</span> on ESXi as the feature that stops unsigned bundles. <b>T1036.001</b>: a broken hash-signature match is tampering made visible. <b>T1204.003</b>: Docker-style content trust pins which publisher may sign each tag. Handshake capture and DoS are radio and availability problems — no code runs, so code signing is irrelevant: honest gap analysis is what architects are paid for."},
{id:"x04",type:"multi",
sum:"The immediate bundle after the build cert leaks",
scenario:[
{label:"ARTEFACT 1 — War-room whiteboard",html:"<p>Thirty minutes in. The build certificate is confirmed abused. Which four actions go up on the board — and which two stay off?</p>"}
],
question:"Select the FOUR correct immediate actions.",
hint:"Three actions stop or map the abuse; one is destructive; one is a dangerous assumption.",
opts:{
A:"Revoke the compromised certificate and publish revocation immediately.",
B:"Hunt all artefacts signed with the certificate&#8217;s thumbprint in the abuse window.",
C:"Publish the pinned trust list so downstream systems can pin the replacement key.",
D:"Rotate the signing keys stored on the HSM as part of recovery.",
E:"Delete the signing server&#8217;s logs to deny the attacker reconnaissance value.",
F:"Assume binaries signed after revocation are safe because they are &#8216;still signed&#8217;."},
correct:["A","B","C","D"],
why:{E:"Deleting logs destroys your own audit trail and legal evidence — never trade evidence for tidiness in an incident.",
F:"Signatures made before revocation timestamps are the entire problem; &#8216;still signed&#8217; is exactly what must not be trusted."},
expl:"The correct bundle follows the incident arc: <b>revoke</b> (cut the attacker&#8217;s future), <b>hunt by thumbprint</b> (map the past), <b>pin the replacement</b> (make the new key authoritative), <b>rotate on the HSM</b> (end the stolen-key value). The distractors are the two classic senior-level traps: destroying evidence in a panic, and trusting the seal after the seal-keeper is gone."},
{id:"x05",type:"fill",
sum:"Write the hunting query blanks",
scenario:[
{label:"ARTEFACT 1 — Hunting notebook, query sketch",html:'<div class="logbox"><span class="term-line"><span class="tn">DeviceImageLoadEvents</span></span><span class="term-line"><span class="tn">| where SignatureStatus in ( <span class="tw">[1]</span> , <span class="tw">[2]</span> )</span></span><span class="term-line"><span class="tn">| where FolderPath !startswith <span class="tw">[3]</span></span></span><span class="term-line"><span class="tn">| project Timestamp, DeviceName, FolderPath, Signer</span></span></div>'}
],
question:"Fill the three blanks to finish the query.",
hint:"Two statuses mark broken or missing seals; the path blank is the trusted system root you exclude.",
parts:["DeviceImageLoadEvents | where SignatureStatus in ( ",{a:"Invalid"},", ",{a:"Unsigned"}," ) | where FolderPath !startswith ",{a:"C:\\Windows"}," | project Timestamp, DeviceName, FolderPath, Signer"],
bank:["Invalid","Unsigned","C:\\Windows","C:\\Users","Revoked","Valid"],
expl:"The query alerts on <b>Invalid</b> or <b>Unsigned</b> loads outside the trusted system root — the workhorse detection that pairs with M1045 enforcement. &#8220;Revoked&#8221; belongs in a different, dedicated alert (revocation events are rarer and louder), and &#8220;Valid&#8221; would flood the queue with healthy loads. Excluding <span class=\"mono\">C:\\Windows</span> keeps OS-signed noise out while everything in user-writable space stays in scope."},
{id:"x06",type:"order",
sum:"Rank the five findings by urgency",
scenario:[
{label:"ARTEFACT 1 — Monday 09:00, five open findings",html:"<p>You can start one workstream now. Rank by urgency.</p>"}

question:"Drag the findings into urgency order (most urgent on top).",

order:[
{id:"f1",text:"A binary signed by a revoked certificate is running on a domain controller"},
{id:"f2",text:"An unsigned service DLL is loaded by the public web server"},
{id:"f3",text:"A signed driver from an unapproved, 3-week-old vendor is pending review on the build server"},

expl:"<b>Revoked-cert code on a DC</b> means an active abuse of a dead identity at the heart of the domain — stop it now. <b>Unsigned service DLL on the public web server</b> is a live tamper path. The <b>unapproved driver</b> is a BYOVD-shaped risk but contained and pending. The <b>self-signed utility</b> is a policy breach, not an incident. The <b>OT app</b> is verified healthy by its own timestamp — lowest urgency despite the scary label. Ranking is the senior skill: labels lie, positions decide budgets."},
{id:"x10",type:"match",
sum:"Trust-anchor vocabulary for the design review",
scenario:[
{label:"ARTEFACT 1 — Design review pre-read",html:"<p>The board will use four terms. Make sure everyone means the same thing.</p>"}
],
question:"Match each term to its definition.",
hint:"One is a place, one is a purpose stamp, one is a witness, one is a side-car file.",
pairs:[
{l:"Root store pinning",r:"Restricting trust to a named set of roots instead of every CA in the store"},
{l:"EKU: Code Signing",r:"The certificate field that says this key may sign code and nothing else"},
{l:"Timestamp authority",r:"The third party that witnesses when a signature was made"},
{l:"Catalog files (.cat)",r:"Side-car files that carry signatures for many files, common for drivers"}
],
expl:"Pinning shrinks the trust surface; <b>EKU</b> stops a TLS key being reused for code; the <b>timestamp authority</b> is why signing-time can be proven years later (the x08 nuance); <b>catalog files</b> explain why some system files have no embedded signature yet still verify. These four terms are the vocabulary of every serious M1045 design meeting."},
{id:"x08",type:"mcq",
sum:"The expired-certificate rule that would break a healthy app",
scenario:[
{label:"ARTEFACT 1 — Proposed policy amendment",html:'<div class="logbox"><span class="term-line"><span class="tn">New rule: </span><span class="tr">Block every binary whose signing certificate has expired.</span></span></div>'},
{label:"ARTEFACT 2 — LegacyStat Reporter (verified properties)",html:'<div class="logbox"><span class="term-line"><span class="tn">Signer: </span><span class="tk">MIDCORP LOB CA</span></span><span class="term-line"><span class="tn">Certificate validity: </span><span class="tn">2021-06-01 → 2023-06-01</span></span><span class="term-line"><span class="tn">Signature timestamp: </span><span class="tg">2022-11-14 — inside validity</span></span><span class="term-line"><span class="tn">Signature status: </span><span class="tg">Valid</span><span class="tn"> (trusted timestamp)</span></span></div>'}
],
question:"The amendment is on the table. What is the correct senior read?",
hint:"Ask what point in time a signature vouches for — and which date proves it.",
opts:{
A:"Keep the amendment; expired certificates always mean the file is unsafe to run today.",
B:"Reject the amendment: a trusted timestamp proves signing happened while the certificate was valid, so the signature stays valid — check signing time, not expiry.",
C:"Approve the amendment but only for servers.",
D:"Re-sign LegacyStat Reporter with the old certificate to fix it."},
correct:["B"],
why:{A:"Expiry of the certificate does not undo a seal made while it was valid — that is exactly what timestamps are for.",
C:"Splitting by server breaks the same healthy app wherever it runs; the flaw is the rule, not the scope.",
D:"You cannot re-sign with an expired key, and re-signing healthy software fixes nothing."},
expl:"This is the &#8220;best practice is wrong here&#8221; trap: <b>block-expired</b> sounds strict, but a <b>trusted timestamp</b> fixes the signing moment inside the certificate&#8217;s validity, so the signature remains valid forever after. The correct policy checks <b>signing time vs validity</b> — not the current date. Adopting the amendment would break every correctly-timestamped legacy app while adding no security: attackers who steal keys sign with <i>valid</i> certificates."},
{id:"x09",type:"multi",
sum:"The sideload seam — pick the two compensations that actually work",
scenario:[
{label:"ARTEFACT 1 — Architecture question",html:"<p>Red showed they can sideload a <b>signed</b> malicious DLL into a <b>signed, allowlisted</b> app loading from its own folder. The outer signature checks pass by design. Which TWO compensating controls close this seam?</p>"}
],
question:"Select the TWO compensations that address the seam without breaking the platform.",
hint:"One pairs publisher with place; one hunts the module-host pair that should never meet.",
opts:{
A:"Pair publisher and path: the allowlisted app may load modules only from its own install directory, signed by its own publisher.",
B:"Alert on anomalous module loads: a host process that has never loaded this module name before raises a hunt ticket.",
C:"Block every signed DLL from loading; allow only executables.",
D:"Turn off signature verification for that app so its modules load freely."},
correct:["A","B"],
why:{C:"Blocking signed DLLs wholesale breaks the operating system and every legitimate application.",
D:"Removing verification widens the seam — the attacker&#8217;s favourite outcome."},
expl:"The seam is that enforcement trusts the outer app, so the fix must look one level deeper: <b>publisher+path pairing</b> restricts what that app may load, and <b>module-load anomaly detection</b> catches the never-before-seen host/module pair even when signatures are perfect. This dual-perspective lesson is the red team&#8217;s parting gift: every strong outer control creates one expensive inner seam, and that seam is where detection engineering lives."},
{id:"x07",type:"terminal",
sum:"Pressure drill — evidence that survives scrutiny",
scenario:[
{label:"ARTEFACT 1 — Situation",html:"<p>WEB-03 is a <b>live, suspected-compromised</b> host. Legal requires driver-trust evidence that <b>survives scrutiny</b>: nothing on the host may be altered, removed, or &#8216;cleaned up&#8217; before forensics arrives.</p><p>Driver under review: <span class=\"mono\">C:\\Windows\\System32\\drivers\\cinderveil.sys</span></p>"},
{label:"ARTEFACT 2 — Pressure note",html:"<p>Timed drill: answer within about five minutes of exam time. Two commands will feel natural — one of them would hand the attacker a gift: <b>evidence loss</b>.</p>"}
],
question:"Using the shell&#8217;s built-in signature cmdlet, capture the driver&#8217;s full trust record in a list view, then run it.",
hint:"You are recording evidence, not removing anything. The cmdlet is the OS one whose name says exactly what it returns; the record legal needs reads best when each property sits on its own line.",
term:{
title:"Lab shell — WEB-03 (LIVE)",
env:"Windows PowerShell, elevated — host is LIVE evidence — read-only commands only",
banner:'<span class="term-line"><span class="tc">WARNING: WEB-03 is under investigation. Any state-changing command is an evidence-handling violation.</span></span>',
prompt:"PS C:\\Users\\responder>",
acceptTools:["get-authenticodesignature"],
outputHtml:'<span class="term-line"><span class="tn">SignerCertificate : </span><span class="tk">[Subject] CN=Cinderveil Components Ltd, O=Cinderveil Components Ltd, C=DE</span></span><span class="term-line"><span class="tn">                    [Issuer] CN=Abacus Certificate Authority, O=Abacus CA</span></span><span class="term-line"><span class="tn">TimeStamperCertificate : </span><span class="tk">[Subject] CN=Scalar Timestamping TSA 2026</span></span><span class="term-line"><span class="tn">Status : </span><span class="tr">NotTrusted</span></span><span class="term-line"><span class="tn">StatusMessage : </span><span class="tr">A certificate chain processed, but terminated in a root certificate which is not trusted.</span></span><span class="term-line"><span class="tn">Path : </span><span class="tn">C:\\Windows\\System32\\drivers\\cinderveil.sys</span></span><span class="term-line"><span class="tn">SignatureType : </span><span class="tn">Authenticode</span></span>',
elements:[
{key:"tool",kind:"tool",accept:["get-authenticodesignature"],expect:"Get-AuthenticodeSignature",name:"the signature cmdlet (Get-AuthenticodeSignature)"},
{key:"target",kind:"target",accept:["c:\\windows\\system32\\drivers\\cinderveil.sys"],expect:"C:\\Windows\\System32\\drivers\\cinderveil.sys",name:"the driver path"},
{key:"pipe",kind:"pipe",accept:["format-list","fl"],expect:"| Format-List (each property on its own line)",name:"the list-view pipe stage"}
],
optionalFlags:["-verbose","/verbose","-path","/path","-literalpath","/literalpath"],
canonical:"Get-AuthenticodeSignature C:\\Windows\\System32\\drivers\\cinderveil.sys | Format-List",
canonicalExplain:"<b>Get-AuthenticodeSignature</b> is the built-in cmdlet: it reads the signature and returns a trust object — nothing more, so the live host is untouched. The <b>target</b> is the driver under review. The <b>Format-List</b> pipe stage spreads every property across its own line, which is the shape counsel can attach to a memo. The output here even shows a <b>NotTrusted</b> status with an untrusted-root message — real evidence, captured without changing a byte. The near-miss everyone feels under pressure is <span class=\"mono\">pnputil /delete-driver &#8230; /uninstall</span> or deleting the file: both would <b>alter a live evidence host</b>, hand the defence a contamination argument, and possibly break the server. Read-only wins."
},
expl:"Under pressure the senior question is never &#8220;what removes the file&#8221; but &#8220;what proves the state without changing it&#8221;. The canonical command is entirely read-only and its list output is admissible evidence — here it even captured a NotTrusted status. Note how the graded elements map to the business goal: the cmdlet for truth, the target for scope, the list view for a record that survives scrutiny — nothing else."},
{id:"x11",type:"order",
sum:"Rotation runbook — six steps, order them",
scenario:[
{label:"ARTEFACT 1 — Post-incident programme plan",html:"<p>The board approved a full signing-system rotation. Order the runbook.</p>"}
],
question:"Drag the steps into the correct order (first step on top).",
hint:"Freeze first, then cut trust, then measure the blast radius, then heal, then rotate, then learn.",
order:[
{id:"s1",text:"Freeze the signing pipeline — no new signatures until cleared"},
{id:"s2",text:"Revoke the abused certificate and republish CRL/OCSP"},
{id:"s3",text:"Audit the blast radius by thumbprint across endpoints, servers, and the download site"},

expl:"The order is the lesson: a <b>freeze</b> stops new contamination; <b>revocation</b> cuts old trust; the <b>thumbprint audit</b> sizes the blast radius before you heal; <b>re-signing</b> restores the estate; <b>rotation with dual control and short validity</b> shrinks every future window; the <b>review</b> writes the lessons into the trust list and the runbook. Skipping the freeze or the audit is how rotation incidents become rotation incidents <i>again</i>."}
]

expl:"Closure is a communication problem with technical answers: the <b>pipeline log</b> is process evidence for audit; the <b>impact list</b> turns revocation fear into a workable plan; the <b>thumbprint plus window</b> is the IOC pair peers can actually hunt (share it defanged, as always); and the <b>vendor attestation plus verified sample</b> is how third-party assurance under M1045 is demonstrated, not promised. One incident, four artefacts — that is the mitigation operating as a programme."}
]);
</script>
<script>
"use strict";
/* CyberPulseAcademy — self-contained certification exam engine (vanilla JS).
   Data-driven: window.EXAM_DATA supplies meta, intro content and exercises. */
var D = window.EXAM_DATA;
var S = null;

/* ---------- tiny helpers ---------- */
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!==undefined){e.innerHTML=html;}return e;}
function sevBadge(){return '<span class="badge '+sevClass()+'" aria-label="Severity '+sevName()+'">&#9679; '+sevName()+'</span>';}
function sevClass(){var d=D.meta.difficulty;if(d==="easy"){return "badge-easy";}if(d==="medium"){return "badge-medium";}if(d==="hard"){return "badge-hard";}return "badge-extreme";}
function sevName(){return D.meta.sevName;}
function partLabel(){return D.meta.partLabel?('<span class="tag-mono">'+esc(D.meta.partLabel)+'</span>'):"";}
function fmtClock(sec){var m=Math.floor(Math.max(0,sec)/60),s=Math.max(0,sec)%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function pct(sum,count){return count>0?Math.round((sum/count)*100):0;}
function scoreExercise(sel,correct){
  var cs={},i,H=0,W=0;
  for(i=0;i<correct.length;i++){cs[correct[i]]=1;}
  for(i=0;i<sel.length;i++){if(cs[sel[i]]===1){H++;}else{W++;}}
  var N=correct.length;
  if(N===0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ---------- session ---------- */
function newSession(){
  S={order:shuffle(D.exercises),idx:0,answered:{},skipped:[],creditSum:0,answeredCount:0,
     hintUsed:{},timer:{state:"IDLE",remain:D.meta.estimatedMinutes*60,interval:null,manualSec:0,autoSec:0},
     reviewReturn:false,attempt:(S&&S.attempt?S.attempt:0)+1,username:(S&&S.username)?S.username:"",locked:{},reported:false};
}
function motionReduced(){return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}

/* ---------- timer state machine ---------- */
var T_STATES={RUNNING:1,PAUSED_MANUAL:1,PAUSED_AUTO_CHECK:1,ENDED:1};
function timerSet(st){
  S.timer.state=st;
  updateHeader();
}
function timerStart(){
  if(S.timer.interval){return;}
  S.timer.interval=setInterval(function(){
    if(S.timer.state==="PAUSED_MANUAL"){S.timer.manualSec+=1;return;}
    if(S.timer.state==="PAUSED_AUTO_CHECK"){S.timer.autoSec+=1;return;}
    if(S.timer.state!=="RUNNING"){return;}
    S.timer.remain-=1;
    if(S.timer.remain<=0){S.timer.remain=0;timerTickEnd();}
    updateHeader();
  },1000);
}
function timerTickEnd(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  showResults();
}
function timerPauseAutoCheck(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_AUTO_CHECK");}
}
function timerResumeFromAuto(){
  if(S.timer.state==="PAUSED_AUTO_CHECK"){timerSet("RUNNING");}
}
function timerPauseManual(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
}
function timerResumeManual(){
  hidePauseOverlay();
  if(S.timer.state==="PAUSED_MANUAL"){timerSet("RUNNING");}
}
function timerStateBadge(){
  var st=S.timer.state;
  if(st==="RUNNING"){return '<span class="badge badge-run" aria-label="Timer running">&#9654; RUNNING</span>';}
  if(st==="PAUSED_MANUAL"){return '<span class="badge badge-paused" aria-label="Timer paused manually">&#9208; PAUSED &#8212; manual (press Resume)</span>';}
  if(st==="PAUSED_AUTO_CHECK"){return '<span class="badge badge-paused" aria-label="Timer paused reviewing feedback">&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)</span>';}
  return '<span class="badge badge-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}

/* ---------- pause overlay (manual pause hides the exercise) ---------- */
function headerPauseClick(){
  var st=S.timer.state;
  if(st==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
  else if(st==="PAUSED_AUTO_CHECK"){showPauseOverlay("auto");}
}
function headerHintClick(){
  if(!S||S.idx>=S.order.length){return;}
  var ex=S.order[S.idx];
  if(exState(ex)||S.hintUsed[ex.id]||$("hint-slot")==null){return;}
  if(S.timer.state==="ENDED"){return;}
  S.hintUsed[ex.id]=true;
  $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  var hb=$("btn-hint");if(hb){hb.disabled=true;}
  updateHeader();
}
function headerSkipClick(){
  if(!S||S.idx>=S.order.length||$("ans-widget")==null){return;}
  var ex=S.order[S.idx];
  if(exState(ex)){return;}
  doSkip(ex);
}
function showPauseOverlay(kind){
  var ov=$("pause-overlay");
  ov.innerHTML="";
  var c=el("div","card");
  c.innerHTML='<div style="font-size:40px" aria-hidden="true">&#9208;</div>'+
    '<h3 class="paused-word">&#9208; PAUSED &#8212; '+(kind==="manual"?"manual break":"reviewing feedback")+'</h3>'+
    '<p style="color:var(--text-secondary)">'+(kind==="manual"?"Your exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.":"The timer is already stopped for feedback review. Press the button below when you are ready to go back to the explanation.")+'</p>'+
    '<button class="btn btn-primary" id="btn-resume" style="margin-top:8px">&#9654; '+(kind==="manual"?"Resume":"Back to feedback")+'</button>';
  ov.appendChild(c);
  ov.style.display="flex";
  $("exam-view").style.visibility="hidden";
  var rb=$("btn-resume");
  if(rb){rb.addEventListener("click",overlayResume);rb.focus();}
}
function overlayResume(){
  hidePauseOverlay();
  if(S.timer.state==="PAUSED_MANUAL"){timerSet("RUNNING");}
}
function hidePauseOverlay(){
  $("pause-overlay").style.display="none";
  $("exam-view").style.visibility="visible";
}

/* ---------- intro screen ---------- */
function renderIntro(){
  var app=$("cm-app");
  app.innerHTML="";
  var head=el("div","card");
  head.innerHTML=
    '<div class="intro-head">'+
      '<div>'+
        '<h1 style="margin:0;font-size:26px">'+esc(D.meta.title)+'</h1>'+
        '<div class="tag-mono">'+esc(D.meta.objectId)+' &#8212; '+esc(D.meta.objectName)+' &#8212; MITRE ATT&amp;CK '+esc(D.meta.objectType)+'</div>'+
      '</div>'+
      '<div>'+sevBadge()+partLabel()+'</div>'+
    '</div>'+
    '<hr class="divider">'+
    '<div class="facts">'+
      '<span>Exercises in this file: <b>'+D.exercises.length+'</b></span>'+
      '<span>Estimated time: <b>'+D.meta.estimatedMinutes+' min</b> (timer budget: <b>'+D.meta.estimatedMinutes+' min</b> countdown)</span>'+
      '<span>Pass mark: <b>'+D.meta.passMark+'%</b></span>'+
      '<span>Scoring: <b>partial credit</b> on multi-answer exercises</span>'+
    '</div>';
  app.appendChild(head);

  var learn=el("div","card");
  var lh='<h2 style="margin-top:0;color:var(--accent-blue)">What you will learn here</h2>';
  for(var i=0;i<D.intro.learn.length;i++){lh+='<p>'+D.intro.learn[i]+'</p>';}
  learn.innerHTML=lh;
  app.appendChild(learn);

  var kw=el("div","card");
  var kh='<h2 style="margin-top:0;color:var(--accent-blue)">Keywords covered in this exam</h2>';
  for(var t=0;t<D.intro.keywords.length;t++){
    var th=D.intro.keywords[t];
    kh+='<div class="kw-theme"><h4>'+th.theme+'</h4><ul>';
    for(var k=0;k<th.items.length;k++){kh+='<li>'+th.items[k]+'</li>';}
    kh+='</ul></div>';
  }
  kw.innerHTML=kh;
  app.appendChild(kw);

  var how=el("div","card");
  var hh='<h2 style="margin-top:0;color:var(--accent-blue)">How this exam works</h2><ul class="rules">'+
    '<li><b>Pass mark '+D.meta.passMark+'%.</b> Your final score is computed only over the exercises you actually answered. A PASS means you reached '+D.meta.passMark+'% or more. A FAIL means you should retake the exam.</li>'+
    '<li><b>Exercise types in this file:</b> '+D.intro.typesUsed+'.</li>'+
    '<li><b>Timer.</b> A '+D.meta.estimatedMinutes+'-minute countdown runs while you work. You can press <b>Pause</b> for a real break: the exercise is hidden and the timer stops until you press Resume.</li>'+
    '<li><b>Check buys you time.</b> The moment you press <b>Check</b>, the timer stops automatically. You can study the feedback for as long as you like. The timer starts again only when you press <b>Next</b>.</li>'+
    '<li><b>Partial credit.</b> Exercises with several correct items are scored per item: <span class="mono">credit = max(0, (H &#8722; W) / N)</span>. Selecting wrong items subtracts. One hint per exercise costs &#8722;10% of that exercise&#8217;s credit.</li>'+
    '<li><b>Skip and come back.</b> Every exercise has a Skip button. Skipped exercises wait in a review pool. Before you finish, you can return to them and answer as long as the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</li>'+
    '</ul><div class="center" style="margin-top:16px">'+
    '<button class="btn btn-green" id="btn-start" style="font-size:17px;padding:14px 40px">&#9654; Start the exam</button></div>';
  how.innerHTML=hh;
  app.appendChild(how);
  $("btn-start").addEventListener("click",startExam);
}

/* ---------- persistent header ---------- */
function buildExamShell(){
  var app=$("cm-app");
  app.innerHTML=
    '<div class="hdr" id="ex-hdr"><span id="hdr-dyn"></span>'+
    '<button type="button" class="btn btn-small btn-ghost" id="btn-pause-h" aria-label="Pause the timer">&#9208; Pause</button>'+
    '<button type="button" class="btn btn-small btn-warn" id="btn-hint-h" aria-label="Show a hint">&#128161; Hint</button>'+
    '<button type="button" class="btn btn-small btn-ghost" id="btn-skip-h" aria-label="Skip this exercise">&#9888; Skip</button>'+
    '</div>'+
    '<div class="prog sheen" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100"><i id="prog-fill" style="width:0%"></i></div>'+
    '<div id="exam-view"></div>'+
    '<div id="pause-overlay" class="overlay" style="display:none"></div>';
  $("btn-pause-h").addEventListener("click",headerPauseClick);
  $("btn-hint-h").addEventListener("click",headerHintClick);
  $("btn-skip-h").addEventListener("click",headerSkipClick);
  updateHeader();
}
function updateHeader(){
  var h=$("ex-hdr");
  if(!h||!S){return;}
  var answered=S.answeredCount;
  var scoreTxt=answered>0?("<b>"+(Math.round(S.creditSum*10)/10).toFixed(1)+"</b> / "+answered+" &#183; "+pct(S.creditSum,answered)+"%"):"0 / 0 &#183; &#8212;";
  var pos;
  var reviewShown=!!$("sk-list");
  if(S.reviewReturn){pos="Reviewing a skipped exercise";}
  else if(S.idx<S.order.length&&!reviewShown){pos="Exercise <b>"+(S.idx+1)+"</b> of <b>"+S.order.length+"</b>";}
  else if(reviewShown){pos="Review pool: <b>"+S.skipped.length+"</b> waiting";}
  else{pos="Exam finished";}
  h.setAttribute("role","status");
  $("hdr-dyn").innerHTML=
    '<span class="h-item">'+pos+'</span>'+
    '<span class="h-item">'+sevBadge()+partLabel()+'</span>'+
    '<span class="h-item"><span class="timer-num mono" id="hdr-clock">'+fmtClock(S.timer.remain)+'</span>'+timerStateBadge()+'</span>'+
    '<span class="h-item">Score '+scoreTxt+'</span>'+
    (S.username?'<span class="h-item">Analyst: <b>'+esc(S.username)+'</b></span>':'');
  var st=S.timer.state;
  var bp=$("btn-pause-h");
  if(bp){
    if(st==="PAUSED_MANUAL"){bp.innerHTML='&#9654; Resume';bp.disabled=false;}
    else{bp.innerHTML='&#9208; Pause';bp.disabled=(st==="ENDED");}
  }
  var cur=(S.idx<S.order.length&&!reviewShown)?S.order[S.idx]:null;
  var bh=$("btn-hint-h");
  if(bh){bh.disabled=!(cur&&!S.answered[cur.id]&&!S.hintUsed[cur.id]&&$("hint-slot"));}
  var bs=$("btn-skip-h");
  if(bs){bs.disabled=!(cur&&!S.answered[cur.id]);}
}
function updateProgress(){
  var f=$("prog-fill");
  if(!f||!S){return;}
  var total=S.order.length;
  var done=0,i;
  for(i=0;i<S.order.length;i++){if(S.answered[S.order[i].id]){done++;}}
  var w=total>0?Math.round((done/total)*100):0;
  f.style.width=w+"%";
  f.setAttribute("aria-valuenow",w);
}

/* ---------- exam flow ---------- */
function startExam(){
  renderExamView();
  renderExercise();
  timerSet("RUNNING");
  timerStart();
}
function renderExamView(){buildExamShell();}
function currentEx(){return S.order[S.idx];}

/* ---------- exercise rendering ---------- */
function prepareExercise(ex){
  var keys=[],k;
  if(ex.type==="mcq"||ex.type==="multi"){
    for(k in ex.opts){if(Object.prototype.hasOwnProperty.call(ex.opts,k)){keys.push(k);}}
    keys=shuffle(keys);
    ex.renderOpts=keys.map(function(x){return {k:x,text:ex.opts[x]};});
  }else if(ex.type==="match"){
    ex.renderRights=shuffle(ex.pairs.map(function(p){return p.r;}));
    for(k=0;k<ex.pairs.length;k++){ex.pairs[k].rIdx=ex.renderRights.indexOf(ex.pairs[k].r);}
  }else if(ex.type==="drag"){
    ex.renderItems=shuffle(ex.items.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="order"){
    ex.renderItems=shuffle(ex.order.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="fill"){
    ex.renderBank=shuffle(ex.bank);
  }else if(ex.type==="decision"){
    for(k=0;k<ex.steps.length;k++){ex.steps[k].renderOpts=shuffle(ex.steps[k].opts);}
  }
}
function renderExercise(){
  var ex=currentEx();
  prepareExercise(ex);
  var v=$("exam-view");
  v.innerHTML="";
  updateHeader();updateProgress();

  var sumLine=ex.sum||"Exercise artefacts";
  var wrap=el("div");
  var col=el("div","","");
  col.id="scenario-col";
  var colInner=el("div");
  colInner.id="scenario-col-inner";
  colInner.innerHTML='<div class="block blk-scenario"><div class="block-h"><span class="ico" aria-hidden="true">&#9656;</span>SCENARIO</div><div class="block-b" id="scen-body"></div></div>';
  var scenBody=colInner.querySelector("#scen-body");
  var art,i;
  for(i=0;i<ex.scenario.length;i++){
    art=ex.scenario[i];
    var a=el("div","artefact");
    a.innerHTML='<div class="sub-label">'+art.label+'</div>'+art.html;
    scenBody.appendChild(a);
  }
  col.appendChild(colInner);
  var tog=el("button","collapse-toggle");
  tog.type="button";
  tog.innerHTML='<span><span aria-hidden="true">&#9656;</span> <span class="sum">'+sumLine+'</span> &#8212; click to collapse / expand</span><span aria-hidden="true" class="ct-ico">&#9662;</span>';
  tog.addEventListener("click",function(){
    var shown=colInner.style.display!=="none";
    colInner.style.display=shown?"none":"block";
    tog.querySelector(".ct-ico").innerHTML=shown?"&#9656;":"&#9662;";
  });
  wrap.appendChild(col);
  wrap.appendChild(tog);

  var qb=el("div","block blk-question");
  qb.innerHTML='<div class="block-h"><span class="ico" aria-hidden="true">&#10067;</span>QUESTION</div><div class="block-b"><div class="question-text">'+ex.question+'</div></div>';
  wrap.appendChild(qb);

  var ab=el("div","block blk-answer");
  ab.innerHTML='<div class="block-h"><span class="ico" aria-hidden="true">&#9998;</span>YOUR ANSWER</div><div class="block-b"><div id="ans-widget"></div>'+
    '<div id="hint-slot"></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px" id="action-row"></div></div>';
  wrap.appendChild(ab);

  var fb=el("div","","");
  fb.id="fb-slot";
  wrap.appendChild(fb);
  v.appendChild(wrap);

  var w=$("ans-widget");
  if(ex.type==="mcq"||ex.type==="multi"){renderChoice(ex,w);}
  else if(ex.type==="match"){renderMatch(ex,w);}
  else if(ex.type==="drag"){renderDrag(ex,w);}
  else if(ex.type==="order"){renderOrder(ex,w);}
  else if(ex.type==="fill"){renderFill(ex,w);}
  else if(ex.type==="terminal"){renderTerminal(ex,w);}
  else if(ex.type==="decision"){renderDecision(ex,w);}

  renderActionRow(ex);
}
function exState(ex){return S.answered[ex.id];}
function isLocked(ex){return !!S.answered[ex.id];}

/* action row: Hint / Skip / Check / Next / Final Submit */
function renderActionRow(ex){
  var row=$("action-row");
  if(!row){return;}
  row.innerHTML="";
  var st=exState(ex);
  var bSkip=el("button","btn btn-ghost");
  bSkip.type="button";bSkip.id="btn-skip";
  bSkip.innerHTML='&#9888; Skip';
  bSkip.disabled=!!st;
  bSkip.addEventListener("click",function(){doSkip(ex);});
  var bHint=el("button","btn btn-warn btn-small");
  bHint.type="button";
  bHint.id="btn-hint";
  bHint.innerHTML='&#128161; Hint (&#8722;10% of this exercise)';
  if(S.hintUsed[ex.id]||st){bHint.disabled=true;}
  bHint.addEventListener("click",function(){
    if(S.hintUsed[ex.id]){return;}
    S.hintUsed[ex.id]=true;
    bHint.disabled=true;
    $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  });
  row.appendChild(bHint);

  if(ex.type!=="decision"&&!st){
    var bCheck=el("button","btn btn-green");
    bCheck.type="button";bCheck.id="btn-check";
    bCheck.innerHTML='&#9989; Check';
    bCheck.disabled=!widgetHasAnswer(ex);
    bCheck.addEventListener("click",function(){doCheck(ex);});
    row.appendChild(bCheck);
  }
  row.appendChild(bSkip);
  if(st){
    var isLast=(S.idx>=S.order.length-1);
    var bNext=el("button","btn btn-primary");
    bNext.type="button";bNext.id="btn-next";
    bNext.innerHTML=isLast?'&#128230; Final Submit':'Next &#9654;';
    bNext.addEventListener("click",function(){goNext();});
    row.appendChild(bNext);
    bNext.focus();
  }
}
function widgetHasAnswer(ex){
  var i;
  if(ex.type==="mcq"||ex.type==="multi"){return $$(".opt").filter(function(b){return b.classList.contains("selected");}).length>0;}
  if(ex.type==="match"){var ss=$$(".match-select");for(i=0;i<ss.length;i++){if(ss[i].value){return true;}}return false;}
  if(ex.type==="drag"){return $$(".chip[data-zone]").length>0;}
  if(ex.type==="order"){return true;}
  if(ex.type==="fill"){var fs=$$(".fill-select");for(i=0;i<fs.length;i++){if(fs[i].value){return true;}}return false;}
  if(ex.type==="terminal"){return !!($("term-in")&&$("term-in").dataset.ran==="1");}
  return false;
}
function $$(sel,root){root=root||document;var n=root.querySelectorAll(sel);var r=[];for(var i=0;i<n.length;i++){r.push(n[i]);}return r;}

/* ---------- mcq / multi ---------- */
function renderChoice(ex,root){
  var opts=ex.renderOpts;
  var multi=ex.type==="multi";
  var wrap=el("div");
  wrap.setAttribute("role","group");
  wrap.setAttribute("aria-label",multi?"Multi-select answers":"Single-choice answers");
  for(var i=0;i<opts.length;i++){
    var o=opts[i];
    var b=el("button","opt");
    b.type="button";
    b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span><span class="mark" aria-hidden="true"></span>';
    b.addEventListener("click",function(){
      if(isLocked(ex)){return;}
      var k=this.dataset.k;
      if(multi){this.classList.toggle("selected");}
      else{
        var all=$$(".opt");
        for(var j=0;j<all.length;j++){all[j].classList.remove("selected");}
        this.classList.add("selected");
      }
      var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}
    });
    b.className+=" sel-opt";
    wrap.appendChild(b);
  }
  root.appendChild(wrap);
}
function collectChoice(ex){
  var sel=[],marks={},i;
  var ss=$$(".opt.selected");
  for(i=0;i<ss.length;i++){sel.push(ss[i].dataset.k);}
  return sel;
}
function gradeChoice(ex,sel){
  var credit=scoreExercise(sel,ex.correct);
  var rows=[],i,opts=ex.opts;
  var picked={};for(i=0;i<sel.length;i++){picked[sel[i]]=1;}
  var corr={};for(i=0;i<ex.correct.length;i++){corr[ex.correct[i]]=1;}
  var ordered=ex.renderOpts;
  for(i=0;i<ordered.length;i++){
    var k=ordered[i].k;
    if(corr[k]&&picked[k]){rows.push({st:"c",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(corr[k]&&!picked[k]){rows.push({st:"m",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(!corr[k]&&picked[k]){rows.push({st:"w",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
  }
  return {credit:credit,rows:rows};
}

/* ---------- match ---------- */
function renderMatch(ex,root){
  var rights=ex.renderRights;
  var wrap=el("div");
  for(var i=0;i<ex.pairs.length;i++){
    var p=ex.pairs[i];
    var row=el("div","match-row");
    var left=el("div","left","<b>"+(i+1)+".</b> "+p.l);
    var selWrap=el("div");
    var s=el("select","match-select");

function makeChip(id,text,ex){

function orderMove(ex,row,dir){

  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i]===row){idx=i;}}

  if(j<0||j>=arr.length){return;}
  var tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp;
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}
function orderReorder(ex,srcId,dstId){
  if(isLocked(ex)||srcId===dstId){return;}
  var list=$("ord-list");
  var rows=list.getElementsByClassName("order-row");
  var arr=[],i,si=0,di=0;
  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i].dataset.oid===srcId){si=i;}if(rows[i].dataset.oid===dstId){di=i;}}
  var item=arr.splice(si,1)[0];
  arr.splice(di,0,item);
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}

function renderTerminal(ex,root){

    '<div class="term-input-row"><span class="term-prompt">'+ex.term.prompt+'</span>'+
    '<input id="term-in" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command">'+
    '<button type="button" class="btn btn-small btn-green" id="term-run">Run &#9166;</button></div></div>'+
    (ex.term.syntaxPanel?('<div class="sub" style="margin-top:10px">'+ex.term.syntaxPanel+'</div>'):"")+
    (ex.term.outputSample?('<div class="sub" style="margin-top:10px"><div class="sub-label">Expected output shape</div>'+ex.term.outputSample+'</div>'):"");

  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();termRun(ex);}});

function termNormalize(cmd){
  return cmd.replace(/["']/g,"").replace(/\|/g," | ").replace(/\s+/g," ").trim().toLowerCase();
}
function termRun(ex){
  var inp=$("term-in");
  var cmd=inp.value;
  if(!cmd.trim()){return;}
  var scroll=$("term-scroll");
  var line=el("span","term-line");
  line.innerHTML='<span class="tg">'+esc(ex.term.prompt)+'</span> '+esc(cmd);
  scroll.appendChild(line);
  var norm=termNormalize(cmd);
  var firstTok=norm.split(" ")[0];
  var toolOk=false,i;
  for(i=0;i<ex.term.acceptTools.length;i++){if(firstTok===ex.term.acceptTools[i]){toolOk=true;}}
  var out=el("span","term-line");
  if(toolOk){out.innerHTML=ex.term.outputHtml;}
  else{out.innerHTML='<span class="tr">command not found: '+esc(firstTok)+' &#8212; this lab shell only accepts the trust-verification tooling.</span>';}
  scroll.appendChild(out);
  scroll.scrollTop=scroll.scrollHeight;
  inp.dataset.ran="1";inp.dataset.last=cmd;
  var bc=$("btn-check");if(bc){bc.disabled=false;}
  inp.focus();
}
function gradeTerminal(ex){
  var cmd=termNormalize($("term-in").dataset.last||"");
  var segs=cmd.split("|");
  var mainToks=segs[0].trim().split(" ").filter(function(x){return x.length>0;});
  var pipeStages=[],s;
  for(s=1;s<segs.length;s++){
    var pt=segs[s].trim().split(" ").filter(function(x){return x.length>0;});
    if(pt.length>0){pipeStages.push(pt[0]);}
  }
  var rows=[],sel=[],i,k;
  var flags=[];
  var target="";
  for(i=1;i<mainToks.length;i++){
    var t=mainToks[i];
    if(t.charAt(0)==="/"||t.charAt(0)==="-"){flags.push(t);}
    else{target=t;}
  }
  var normTarget=(target||"").replace(/\//g,"\\").replace(/\\+/g,"\\").replace(/\\$/,"");
  var allToks=mainToks.concat(pipeStages);
  var hits={};
  for(i=0;i<ex.term.elements.length;i++){
    var e2=ex.term.elements[i],ok=false;
    if(e2.kind==="tool"){ok=(mainToks.length>0&&ex.term.acceptTools.indexOf(mainToks[0])>=0);}
    else if(e2.kind==="tok"){for(k=0;k<allToks.length;k++){if(e2.accept.indexOf(allToks[k])>=0){ok=true;break;}}}
    else if(e2.kind==="flag"){for(k=0;k<flags.length;k++){if(e2.accept.indexOf(flags[k].replace(/^-/,"/").toLowerCase())>=0){ok=true;break;}}}
    else if(e2.kind==="target"){ok=(e2.accept.indexOf(normTarget)>=0);}
    else if(e2.kind==="pipe"){for(k=0;k<pipeStages.length;k++){if(e2.accept.indexOf(pipeStages[k])>=0){ok=true;break;}}}
    if(ok){hits[e2.key]=1;sel.push(e2.key);}else{rows.push({st:"m",text:'<b>'+e2.name+'</b> &#8212; missing or wrong. Expected: <span class="mono">'+esc(e2.expect)+'</span>'});}
  }
  var reqFlags={};for(i=0;i<ex.term.elements.length;i++){if(ex.term.elements[i].kind==="flag"){for(k=0;k<ex.term.elements[i].accept.length;k++){reqFlags[ex.term.elements[i].accept[k]]=1;}}}
  var optFlags=ex.term.optionalFlags||[];
  for(i=0;i<flags.length;i++){
    var f=flags[i].replace(/^-/,"/").toLowerCase();
    if(!reqFlags[f]&&optFlags.indexOf(f)<0){sel.push("Xflag"+i);}
  }
  var dangerous=/(^|\s)(del|erase|rm|remove-item|ri)(\s|$)|delete-driver|delstore|deleteroot|\/uninstall/.test(cmd);
  for(i=0;i<ex.term.elements.length;i++){
    var e3=ex.term.elements[i];
    if(hits[e3.key]){rows.unshift({st:"c",text:'<b>'+e3.name+'</b> &#8212; correct (<span class="mono">'+esc(e3.expect)+'</span>)'});}
  }
  if(dangerous){rows.push({st:"w",text:'<b>DANGEROUS &#8212; NEAR MISS:</b> this command pattern would alter or destroy trust state or evidence on a live host. Never clean up while you still need evidence.'});}
  var correct=[];for(i=0;i<ex.term.elements.length;i++){correct.push(ex.term.elements[i].key);}
  return {credit:scoreExercise(sel,correct),rows:rows,dangerous:dangerous};
}

/* ---------- decision tree ---------- */
function renderDecision(ex,root){
  var wrap=el("div");
  wrap.innerHTML='<div class="sub-label" id="dec-step-label"></div><div id="dec-step-body"></div>';
  root.appendChild(wrap);
  ex.decState={step:0,picks:[]};
  renderDecisionStep(ex);
}
function renderDecisionStep(ex){
  var st=ex.decState.step;
  var step=ex.steps[st];
  var stepOpts=step.renderOpts||step.opts;
  $("dec-step-label").innerHTML='<span class="badge badge-medium" style="letter-spacing:.08em">STEP '+(st+1)+' OF '+ex.steps.length+'</span>';
  var body=$("dec-step-body");
  body.innerHTML="";
  if(step.scene){var sc=el("div","artefact");sc.innerHTML='<div class="sub-label">'+step.sceneLabel+'</div>'+step.scene;body.appendChild(sc);}
  var q=el("div","","<p style='font-weight:600'>"+step.q+"</p>");
  body.appendChild(q);
  var verdict=el("div","","");verdict.id="dec-verdict";
  var opts=el("div","");opts.id="dec-opts";
  for(var i=0;i<stepOpts.length;i++){
    var o=stepOpts[i];
    var b=el("button","opt");
    b.type="button";b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span>';
    b.addEventListener("click",function(){decisionPick(ex,this);});
    opts.appendChild(b);
  }
  body.appendChild(opts);
  body.appendChild(verdict);
}
function decisionPick(ex,btn){
  if(btn.classList.contains("picked-opt")){return;}
  var st=ex.decState.step;
  var step=ex.steps[st];
  var k=btn.dataset.k;
  ex.decState.picks.push(k);
  var ok=(k===step.correct);
  var all=$$("#dec-opts .opt");
  for(var i=0;i<all.length;i++){all[i].classList.add("picked-opt");if(all[i].dataset.k===step.correct){all[i].querySelector(".k").innerHTML='&#10003;';all[i].style.borderColor="var(--state-correct)";}else if(all[i]===btn){all[i].querySelector(".k").innerHTML='&#10007;';all[i].style.borderColor="var(--state-incorrect)";}}
  var v=$("dec-verdict");
  v.innerHTML='<div class="fb-row '+(ok?"ri-correct":"ri-wrong")+'"><span class="st">'+(ok?"&#10003; Correct":"&#10007; Not the best call")+'</span><span>'+step.why+'</span></div>'+
    '<div class="center" style="margin-top:10px"><button type="button" class="btn btn-primary btn-small" id="dec-next-btn">'+(st===ex.steps.length-1?"&#9989; Check &#8212; final step":"Confirm &amp; continue &#9654;")+'</button></div>';
  $("dec-next-btn").addEventListener("click",function(){decisionAdvance(ex);});
  $("dec-next-btn").focus();
}
function decisionAdvance(ex){
  var st=ex.decState.step;
  if(st<ex.steps.length-1){
    ex.decState.step++;
    renderDecisionStep(ex);
  }else{
    doCheck(ex);
  }
}
function optTextOf(step,k){var list=step.renderOpts||step.opts;for(var i=0;i<list.length;i++){if(list[i].k===k){return list[i].text;}}return "(no answer)";}
function gradeDecision(ex){
  var sel=[],rows=[],i;
  for(i=0;i<ex.steps.length;i++){
    var step=ex.steps[i];
    var pick=ex.decState.picks[i];
    if(pick===step.correct){sel.push("s"+i);rows.push({st:"c",text:'<b>Step '+(i+1)+'.</b> '+step.recap});}
    else{sel.push("X"+i);rows.push({st:"w",text:'<b>Step '+(i+1)+'.</b> You chose &#8220;'+optTextOf(step,pick)+'&#8221;. Best call: <b>'+optTextOf(step,step.correct)+'</b>. '+step.recap});}
  }
  var correct=[];for(i=0;i<ex.steps.length;i++){correct.push("s"+i);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- check / skip / next ---------- */
function doCheck(ex){
  if(exState(ex)){return;}
  timerPauseAutoCheck();
  var res,i;
  if(ex.type==="mcq"||ex.type==="multi"){res=gradeChoice(ex,collectChoice(ex));}
  else if(ex.type==="match"){res=gradeMatch(ex);}
  else if(ex.type==="drag"){res=gradeDrag(ex);}
  else if(ex.type==="order"){res=gradeOrder(ex);}
  else if(ex.type==="fill"){res=gradeFill(ex);}
  else if(ex.type==="terminal"){res=gradeTerminal(ex);}
  else if(ex.type==="decision"){res=gradeDecision(ex);}
  if(S.hintUsed[ex.id]){res.credit=Math.max(0,res.credit-0.10);res.hintPenalty=true;}
  res.credit=Math.round(res.credit*100)/100;
  S.answered[ex.id]={credit:res.credit,rows:res.rows,type:ex.type,dangerous:res.dangerous};
  S.creditSum+=res.credit;S.answeredCount++;
  renderFeedback(ex,res);
  updateHeader();updateProgress();
  var bc=$("btn-check");if(bc){bc.disabled=true;}
  var bs=$("btn-skip");if(bs){bs.disabled=true;}
  if(ex.type==="terminal"){var ti=$("term-in");if(ti){ti.disabled=true;}var tr=$("term-run");if(tr){tr.disabled=true;}}
  if(ex.type==="decision"){var db=$("dec-next-btn");if(db){db.disabled=true;}}
  renderActionRow(ex);
}
function renderFeedback(ex,res){
  var slot=$("fb-slot");
  var label,cls;
  if(res.credit>=1){label='&#10003; CORRECT';cls="fb-correct";}
  else if(res.credit>0){label='&#10003; PARTIALLY CORRECT &#8212; credit '+res.credit.toFixed(2)+' &#8212; '+Math.round(res.credit*100)+'% of items';cls="fb-partial";}
  else{label='&#10007; INCORRECT';cls="fb-incorrect";}
  var html='<div class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>'+
    (res.hintPenalty?'<span class="tag-mono">includes &#8722;0.10 hint cost</span>':"")+'</div><div class="fb-b">';
  if(res.rows&&res.rows.length>1||(ex.type!=="mcq"&&res.rows)){
    for(var i=0;i<res.rows.length;i++){
      var r=res.rows[i];
      var stTxt=r.st==="c"?'<span class="st">&#10003; Correct</span>':(r.st==="w"?'<span class="st">&#10007; Wrong</span>':'<span class="st">&#9675; Missed</span>');
      html+='<div class="fb-row ri-'+(r.st==="c"?"correct":(r.st==="w"?"wrong":"miss"))+'">'+stTxt+'<span>'+r.text+'</span></div>';
    }
  }
  if(ex.type==="terminal"){
    html+='<div class="codebox"><div class="sub-label">Canonical command</div><span class="term-line">'+esc(ex.term.canonical)+'</span></div>'+
      '<p style="font-size:14.5px">'+ex.term.canonicalExplain+'</p>';
  }
  html+='<div style="margin-top:10px">'+ex.expl+'</div>';
  if(res.credit<1&&ex.study){html+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';}
  html+='</div></div>';
  slot.innerHTML=html;
  slot.scrollIntoView({behavior:motionReduced()?"auto":"smooth",block:"nearest"});
}
function doSkip(ex){
  if(exState(ex)){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  if(S.reviewReturn){showReview();return;}
  goNextAfterSkip();
}
function goNextAfterSkip(){
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{
    if(S.skipped.length>0&&S.timer.state!=="ENDED"){showReview();}
    else{showResults();}
  }
}
function goNext(){
  timerResumeFromAuto();
  if(S.reviewReturn){S.reviewReturn=false;showReview();return;}
  var isLast=(S.idx>=S.order.length-1);
  if(!isLast){S.idx++;renderExercise();}
  else{
    if(S.timer.state==="ENDED"){showResults();return;}
    if(S.skipped.length>0){showReview();return;}
    showResults();
  }
}

/* ---------- review skipped ---------- */
function showReview(){
  updateHeader();
  var v=$("exam-view");
  v.innerHTML='<div class="card"><h2 style="margin-top:0;color:var(--accent-amber)">&#9888; Review skipped exercises</h2>'+
    '<p style="color:var(--text-secondary)">These exercises are waiting. You can return to any of them and answer it, as long as the timer has not ended. If you submit now, every exercise still on this list is <b>excluded from the score</b> &#8212; it does not count as right or wrong.</p>'+
    '<div class="sk-list" id="sk-list"></div>'+
    '<hr class="divider">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-green" id="btn-final-submit">&#128230; Final Submit &#8212; exclude the rest</button></div></div>';
  var list=$("sk-list");
  var remaining=[];
  for(var i=0;i<S.skipped.length;i++){if(!S.answered[S.skipped[i]]){remaining.push(S.skipped[i]);}}
  if(remaining.length===0){
    list.innerHTML='<p style="color:var(--state-correct)">&#10003; Nothing left to answer &#8212; ready to submit.</p>';
  }
  for(i=0;i<remaining.length;i++){
    (function(id){
      var ex=byId(id);
      var row=el("div","fb-row ri-miss");
      row.innerHTML='<span class="st">&#9888; Skipped</span><span style="flex:1">'+(ex.sum||ex.question)+'</span>';
      var b=el("button","btn btn-small btn-primary","Answer &#9654;");
      b.type="button";
      b.addEventListener("click",function(){
        S.reviewReturn=true;
        S.idx=S.order.indexOf(ex);
        renderExercise();
        timerResumeFromAuto();
      });
      row.appendChild(b);
      list.appendChild(row);
    })(remaining[i]);
  }
  $("btn-final-submit").addEventListener("click",function(){showResults();});
  window.scrollTo(0,0);
}
function byId(id){for(var i=0;i<D.exercises.length;i++){if(D.exercises[i].id===id){return D.exercises[i];}}return null;}

/* ---------- results ---------- */
function showResults(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  var full=0,partial=0,partSum=0,zero=0,excluded=0,i;
  for(i=0;i<S.order.length;i++){
    var id=S.order[i].id;
    var st=S.answered[id];
    if(st){
      if(st.credit>=1){full++;}
      else if(st.credit>0){partial++;partSum+=st.credit;}
      else{zero++;}
    }else if(S.skipped.indexOf(id)>=0||S.idx<S.order.length){excluded++;}
  }
  var answered=S.answeredCount;
  var percent=pct(S.creditSum,answered);
  var passed=percent>=D.meta.passMark;
  var v=$("exam-view");
  var html='<div class="card"><h2 style="margin-top:0">&#127942; Final results</h2>'+
    '<div class="res-grid">'+
    '<div class="res-card"><div class="big" style="color:var(--text-primary)">'+(Math.round(S.creditSum*10)/10).toFixed(1)+' / '+answered+'</div><div class="lbl"><b>'+percent+'%</b> &#8212; computed over answered exercises only</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-correct)">&#10003; '+full+'</div><div class="lbl">Fully correct</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-partial)">&#10003; '+partial+'</div><div class="lbl">Partially correct'+(partial>0?(" &#8212; avg "+(partSum/partial).toFixed(2)):"")+'</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-incorrect)">&#10007; '+zero+'</div><div class="lbl">Fully incorrect</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-skipped)">&#9888; '+excluded+'</div><div class="lbl">Skipped / unanswered &#8212; excluded</div></div>'+
    '</div>'+
    '<div class="verdict '+(passed?"pass":"fail")+'"><div class="v-title">'+(passed?"&#10003; PASS":"&#10007; FAIL")+' &#8212; '+percent+'%</div>'+
    '<p style="color:var(--text-secondary)">'+(passed?"You reached the pass mark of "+D.meta.passMark+"%. Well done &#8212; the certificate panel below is yours.":"You did not reach the pass mark of "+D.meta.passMark+"%. Study the explanations and retake the exam &#8212; the questions and options will be shuffled.")+'</p></div>'+
    '<p style="color:var(--text-secondary);font-size:14px"><b>Time report:</b> '+fmtClock(S.timer.remain)+' left on the clock &#183; '+fmtClock(S.timer.manualSec)+' paused manually (breaks) &#183; '+fmtClock(S.timer.autoSec)+' paused for feedback review.</p>'+
    '<div class="center" style="margin-top:14px"><button type="button" class="btn btn-primary" id="btn-retake" style="font-size:16px;padding:12px 34px">&#8635; Retake Exam</button></div></div>';
  v.innerHTML=html;
  $("btn-retake").addEventListener("click",retake);
  reportScore(S.creditSum,answered);
  window.scrollTo(0,0);
}
function retake(){
  var attempt=S.attempt,uname=S.username;
  newSession();
  S.attempt=attempt+1;S.username=uname;
  renderIntro();
  window.scrollTo(0,0);
}

/* ---------- site integration ---------- */
function reportScore(creditSum,answeredCount){
  if(S.reported){return;}
  S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){/* opened directly, not inside the site frame */}
}
window.addEventListener("message",function(event){
  if(!event.data){return;}
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT"){return;}
  if(S){S.username=event.data.username||"";updateHeader();}
});
</script>
<script>
newSession();
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
