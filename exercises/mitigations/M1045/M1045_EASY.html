intro:{

"This exam is about <b>M1045 — Code Signing</b>. In MITRE ATT&amp;CK this object is a <b>Mitigation</b>. A mitigation is a defense that a company can build to stop or weaken known attacker behaviour. It sits on the defender&#8217;s side of the framework.",
"Imagine you work in a SOC (a Security Operations Centre &#8212; the team that watches company computers and answers alerts). One big job of that team is to stop bad software before it runs. Code signing helps a lot here: every program, script, or driver must carry a valid <b>digital signature</b> from a trusted publisher. If the signature is missing or broken, the system refuses to run the code.",
"A digital signature is like a tamper-proof seal. It proves two things: <b>who</b> published the code (the publisher&#8217;s identity, checked by a Certificate Authority), and that nobody <b>changed</b> the code after it was signed. In your daily work you will check signatures when you triage a suspicious file, and you will help write the policy that says &#8220;signed code only&#8221;.",
"This mitigation is used by many roles: <b>SOC analysts</b> read signature status in alerts, <b>endpoint engineers</b> turn on enforcement tools (for example AppLocker on Windows or Secure Boot checks), <b>detection engineers</b> build rules for unsigned or invalid loads, and <b>GRC analysts</b> own the written policy. You will also learn the limits: a stolen certificate can put a valid-looking seal on malware, so signatures are powerful but not magic.",

sum:"Three basic words: signature, certificate, hash",
scenario:[
{label:"ARTEFACT 1 — SOC onboarding card",html:"<p>New analysts must be able to tell apart three words: <b>signature</b>, <b>certificate</b>, and <b>hash</b>. Match each word to its plain meaning.</p>"}
],
question:"Match each term on the left to its correct meaning on the right.",
hint:"One meaning is about identity, one is the seal itself, one is the fingerprint of the file bytes.",
pairs:[
{l:"Digital signature",r:"An electronic seal that shows who signed the code and that it was not changed"},
{l:"Certificate",r:"An identity card that ties a publisher&#8217;s name to a cryptographic key"},
{l:"Hash",r:"A fingerprint of the file; if even one byte changes, the fingerprint changes"}
],
expl:"The <b>certificate</b> is the identity card (name + key). The <b>signature</b> is the seal made with that key. The <b>hash</b> is what the seal covers: the signer hashed the file, and your system re-computes the hash to detect any change. These three parts work together in M1045: identity + seal + fingerprint."},
{id:"e03",type:"mcq",
sum:"Who gives out the signing certificate?",
scenario:[
{label:"ARTEFACT 1 — Chat message from a junior developer",html:"<span class=\"term-line\"><span class=\"tn\">dev_ana:</span> We want to sign our new installer so the policy lets it run.</span><span class=\"term-line\"><span class=\"tn\">dev_ana:</span> Who actually issues the certificate I would use for that?</span>"}
],
question:"Who issues (creates and signs) a code-signing certificate?",
hint:"Think of a passport office: a trusted office must check your identity before it hands out the document.",
opts:{
A:"A Certificate Authority (CA) — a trusted organisation that first verifies the publisher&#8217;s identity.",
B:"The antivirus product installed on the user&#8217;s PC.",
C:"The user who downloads the program.",
D:"The Windows Update service."},
correct:["A"],
why:{B:"Antivirus tools can report on signatures, but they do not issue certificates.",
C:"Users do not issue certificates; they only receive and trust them.",
D:"Windows Update delivers software updates; it does not issue signing certificates."},
expl:"A <b>Certificate Authority</b> is like a passport office for software. It checks that the publisher is real, then issues a signing certificate. Your operating system already keeps a list of CAs it trusts, so a signature from one of them is trusted automatically. This trust system is called PKI (Public Key Infrastructure)."},
{id:"e04",type:"drag",
sum:"What code signing checks — and what it does not",
scenario:[
{label:"ARTEFACT 1 — Sort the questions",html:"<p>A trainee wrote four questions on a whiteboard. Some are answered by <b>code signing</b>, some belong to <b>other security controls</b>. Sort them.</p>"}
],
question:"Drag each question into the correct zone.",
hint:"Code signing is only about the software itself: who made it, and was it changed.",
zones:[{id:"z1",label:"Code signing answers this"},{id:"z2",label:"Not a code-signing job"}],
items:[
{id:"i1",text:"Was this installer modified after the publisher signed it?"},
{id:"i2",text:"Is this program&#8217;s publisher really who it claims to be?"},
{id:"i3",text:"Is this database storing its passwords securely?"},
{id:"i4",text:"Is this user allowed to open the payroll folder?"}
],
map:{i1:"z1",i2:"z1",i3:"z2",i4:"z2"},
expl:"Code signing answers two questions only: <b>integrity</b> (was the file changed after signing?) and <b>authenticity</b> (does the seal really belong to this publisher?). Protecting a database or controlling folder access are different controls (data protection and permissions). Knowing what a control does <i>not</i> cover is as important as knowing what it covers."},
{id:"e05",type:"fill",
sum:"Complete the policy sentence",
scenario:[
{label:"ARTEFACT 1 — Draft policy, one word missing",html:"<p>GRC (the team that writes security rules) left one gap in the sentence below. Pick the right completion.</p>"}
],
question:"Fill the blank with the correct words from the bank.",
hint:"The special organisation that issues and vouches for signing certificates.",
parts:["Our endpoint policy says: &#8220;Only programs signed with a certificate from a trusted ",{a:"certificate authority"}," may run on company computers.&#8221;"],
bank:["certificate authority","security team","antivirus vendor","internet provider"],
expl:"The sentence must end with <b>certificate authority</b>. Certificates are issued by CAs, and their trust is what the whole chain rests on. A security team or antivirus vendor uses signatures but does not issue them, and an internet provider has no role in code trust at all."},
{id:"e06",type:"mcq",
sum:"What kind of ATT&CK object is M1045?",
scenario:[
{label:"ARTEFACT 1 — ATT&CK page header (extract)",html:"<span class=\"term-line\"><span class=\"tk\">Code Signing</span> <span class=\"tc\">— Mitigation M1045 — Enterprise</span></span><span class=\"term-line\"><span class=\"tn\">Enforce binary and application integrity with digital signatures…</span></span>"}
],
question:"In MITRE ATT&CK, what kind of object is M1045?",
hint:"Ask yourself: is this something attackers do, or something defenders deploy?",
opts:{
A:"A Mitigation — it describes a defense you can build.",
B:"A Technique — it describes an attacker&#8217;s behaviour.",
C:"A Tactic — it describes an attacker&#8217;s goal.",
D:"A Group — it describes a known threat actor."},
correct:["A"],
why:{B:"Techniques (with IDs like T1059) describe what attackers do, not defenses.",
C:"Tactics (with IDs like TA0001) are attacker goals such as Defense Evasion.",
D:"Groups (with IDs like G0007) profile specific threat actors."},
expl:"M1045 is a <b>Mitigation</b>. ATT&amp;CK mitigations are defenses that stop or weaken techniques. The IDs help you see the type: <span class=\"mono\">T…</span> is a technique, <span class=\"mono\">TA…</span> is a tactic, <span class=\"mono\">M…</span> is a mitigation, <span class=\"mono\">G…</span> is a group. On the job you will use mitigation pages to pick controls, not to name attacker behaviour."},
{id:"e07",type:"match",
sum:"Three attacker behaviours M1045 makes harder",
scenario:[
{label:"ARTEFACT 1 — Techniques addressed by M1045 (plain words)",html:"<p>Match each behaviour to the ATT&amp;CK technique that describes it.</p>"}
],
question:"Match each attacker behaviour on the left to its technique name on the right.",
hint:"Read each behaviour slowly and find the technique whose name says the same thing.",
pairs:[
{l:"An attacker runs a raw script file instead of a normal signed program",r:"T1059 — Command and Scripting Interpreter"},
{l:"Malware is named and parked so it looks like a normal file in a normal place",r:"T1036.005 — Match Legitimate Resource Name or Location"},
{l:"An attacker quietly replaces a program&#8217;s own file with a bad copy",r:"T1554 — Compromise Host Software Binary"}
],
expl:"These three techniques are on the M1045 page. <b>T1059</b> is running scripts; if only signed scripts may run, the raw script is refused. <b>T1036.005</b> is faking names and locations; a signature check does not care how innocent the name looks. <b>T1554</b> is swapping a program&#8217;s own binary; a signed-only policy rejects the unsigned replacement."},
{id:"e08",type:"mcq",
sum:"Ticket #2214 — the installer with no signature",
scenario:[
{label:"ARTEFACT 1 — SOC chat, ticket #2214",html:"<span class=\"term-line\"><span class=\"tn\">soc_jules:</span> User downloaded <span class=\"tw\">invoice_reader_setup.exe</span> from a web search result.</span><span class=\"term-line\"><span class=\"tn\">soc_jules:</span> Properties shows: <span class=\"tr\">Digital signature: None</span>.</span><span class=\"term-line\"><span class=\"tn\">soc_jules:</span> User says they need the tool today. What do we do first?</span>"}
],
question:"Following a signed-code policy, what is the correct next step?",
hint:"The policy says: no signature, no run. What would restore trust in this file?",
opts:{
A:"Do not run it; ask the user to get the tool from the official vendor site, then verify its signature.",
B:"Run it once in a sandbox, and if nothing strange happens, allow it everywhere.",
C:"Rename the file to match the vendor&#8217;s original name, then run it.",
D:"Allow it because the user needs the tool for work today."},
correct:["A"],
why:{B:"One clean sandbox run does not prove the file is the vendor&#8217;s real installer.",
C:"A file name is just a label. Renaming changes nothing about trust.",
D:"Business pressure never changes the trust decision; it changes how fast you find a safe source."},
expl:"The simple, safe path: refuse to run the unsigned file, and get the installer from the <b>official source</b>, where it should carry the vendor&#8217;s valid signature. This is exactly the work task M1045 supports: third-party software is verified before deployment. Renaming or sandboxing does not create trust; only a valid signature chain does."}
]
};
</script>
<script>
window.EXAM_DATA.exercises=window.EXAM_DATA.exercises.concat([
{id:"e09",type:"multi",
sum:"Select the TWO things a valid signature proves",
scenario:[
{label:"ARTEFACT 1 — Exam card",html:"<p>You already saw the two ideas: <b>integrity</b> and <b>authenticity</b>. Pick exactly the two that a valid signature proves.</p>"}
],
question:"Select the TWO statements that a valid signature proves.",
hint:"Two words from the intro: integrity and authenticity. The other options promise things no seal can give.",
opts:{
A:"The code has not been modified since it was signed.",
B:"The code really comes from the publisher named on the certificate.",
C:"The code will never behave badly on your machine.",
D:"The code was downloaded from a fast server near you."},
correct:["A","B"],
why:{C:"A signature proves origin and integrity, not behaviour. Signed malware exists when keys are stolen.",
D:"Download speed and server location say nothing about who signed the file."},
expl:"A valid signature proves <b>integrity</b> (not modified) and <b>authenticity</b> (from the named publisher). It does not promise good behaviour or a fast download. This is why your credit here is partial if you pick only one: the seal has two halves, and both matter in real triage."},
{id:"e10",type:"order",
sum:"Put the safe download routine in order",
scenario:[
{label:"ARTEFACT 1 — Sticky note from a SOC mentor",html:"<p>&#8220;Teach the new starter the safe order for getting and running a new tool.&#8221;</p>"}
],
question:"Drag the steps into the correct order (first step on top).",
hint:"Trust is always checked <i>before</i> the program gets a chance to run.",
order:[
{id:"o1",text:"Download the installer from the official vendor site"},
{id:"o2",text:"Check that the digital signature is valid and from the vendor"},
{id:"o3",text:"Only then run the installer"}
],
expl:"The order matters: <b>download from the official site</b>, then <b>verify the seal</b>, and only then <b>run</b>. If you run first and check later, the code has already executed — any tampering has already happened. Checking first is the whole point of M1045."},
{id:"e11",type:"fill",
sum:"Where do you see a signature in Windows?",
scenario:[
{label:"ARTEFACT 1 — Quick help question",html:"<p>A user asks: &#8220;Where in Windows can I <i>see</i> who signed a file?&#8221; Complete the sentence for them.</p>"}
],
question:"Fill the blank with the correct words from the bank.",
hint:"The tab name contains both words: digital and signatures.",
parts:["In Windows, right-click a file, open <b>Properties</b>, and look at the ",{a:"Digital Signatures"}," tab to see who signed it."],
bank:["Digital Signatures","Sharing","Security","Previous Versions","Details"],
expl:"The <b>Digital Signatures</b> tab lists each signature, the signer name, and the status. This is the first place a SOC analyst sends a user who asks about a file. The other tabs manage sharing, permissions, old versions, or general info — none of them show code signatures."},
{id:"e12",type:"drag",
sum:"Who signs, who issues, who checks",
scenario:[
{label:"ARTEFACT 1 — Roles in the trust chain",html:"<p>Three roles keep code signing working. Sort them by what they do.</p>"}
],
question:"Drag each role into the zone that describes its job.",
hint:"One role makes the seal, one issues the identity card, one verifies both before the code runs.",
zones:[{id:"z1",label:"Signs the software"},{id:"z2",label:"Issues the signing certificate"},{id:"z3",label:"Checks the signature before the code runs"}],
items:[
{id:"i1",text:"The software publisher (developer)"},
{id:"i2",text:"The Certificate Authority (CA)"},
{id:"i3",text:"The operating system or endpoint security tool"}
],
map:{i1:"z1",i2:"z2",i3:"z3"},
expl:"The <b>publisher</b> signs the code with its key. The <b>CA</b> issued that key after checking the publisher&#8217;s identity. The <b>operating system or security tool</b> verifies the seal on your machine at run time. All three roles are needed: remove any one of them and the chain of trust breaks."},
{id:"e13",type:"match",
sum:"Integrity, authenticity, confidentiality",
scenario:[
{label:"ARTEFACT 1 — Vocabulary check",html:"<p>Three words that appear in every security meeting. Two belong to code signing; one is a different job.</p>"}
],
question:"Match each word to its plain meaning.",
hint:"Two meanings describe the seal. The third describes keeping secrets — that one is encryption&#8217;s job.",
pairs:[
{l:"Integrity",r:"The file was not changed after it was signed"},
{l:"Authenticity",r:"The file really comes from the publisher named on it"},
{l:"Confidentiality",r:"Only allowed people can read the content — a different control, not signing"}
],
expl:"<b>Integrity</b> and <b>authenticity</b> are the two promises of a signature. <b>Confidentiality</b> (keeping content secret) is delivered by encryption, a separate control. On the M1045 page this distinction matters: code signing protects against <i>tampering and impersonation</i>, not against people reading the code."},
{id:"e14",type:"fill",
sum:"Unsigned driver tries to load",
scenario:[
{label:"ARTEFACT 1 — Sysmon Event 6 (driver load)",html:'<div class="logbox"><span class="term-line"><span class="tc">EventID: 6 &#8212; DriverLoad</span></span><span class="term-line"><span class="tn">ImageLoaded: </span><span class="tw">C:\\Users\\pub\\AppData\\Temp\\hookdrv.sys</span></span><span class="term-line"><span class="tn">SignatureStatus: </span><span class="tr">Unsigned</span></span><span class="term-line"><span class="tn">Signed: false</span></span></div>'}
],
question:"Complete the conclusion about this event.",
hint:"Remember the vendor-signed driver rule: no valid signature means the load does not happen.",
parts:["When kernel-mode code signing is enforced, a driver with no valid signature is ",{a:"blocked"}," from loading."],
bank:["blocked","allowed","renamed","compressed"],
expl:"The event shows a driver with <b>no signature at all</b>, loading from a user-writable Temp folder — a classic malicious-driver pattern. With kernel-mode code signing enforced (one of M1045&#8217;s implementation measures), the load simply <b>fails</b>. That is the preventive power of this mitigation: the bad code never runs, so there is nothing for the SOC to clean up afterwards."},
{id:"e15",type:"drag",
sum:"Allow or block under the signed-code policy",
scenario:[
{label:"ARTEFACT 1 — Four files on the triage desk",html:"<p>You are on shift. The signed-code policy is active on all endpoints. Sort each file.</p>"}
],
question:"Drag each file into Allow or Block.",
hint:"Trust comes from a valid signature chained to a CA your systems already trust — nothing else.",
zones:[{id:"z1",label:"Allow (trusted under the policy)"},{id:"z2",label:"Block (not trusted)"}],
items:[
{id:"i1",text:"Installer signed by the company&#8217;s trusted CA — status: Valid"},
{id:"i2",text:"Installer with no signature at all"},
{id:"i3",text:"Program whose signature status is Invalid (hash mismatch)"},
{id:"i4",text:"Tool from a chat link, signed with a self-made certificate nobody trusts"}
],
map:{i1:"z1",i2:"z2",i3:"z2",i4:"z2"},
expl:"Only the file with a <b>Valid</b> signature from a trusted CA passes. No signature means no trust. An <b>Invalid</b> status means the file bytes no longer match the seal — exactly what tampering looks like, so it is blocked. A <b>self-made</b> certificate is not issued by any CA your systems trust, so it is worth nothing here. This allow-or-block decision is the daily work that M1045 automates."}
]);
</script>
<script>
"use strict";
/* CyberPulseAcademy — self-contained certification exam engine (vanilla JS).
   Data-driven: window.EXAM_DATA supplies meta, intro content and exercises. */
var D = window.EXAM_DATA;
var S = null;

/* ---------- tiny helpers ---------- */
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!==undefined){e.innerHTML=html;}return e;}
function sevBadge(){return '<span class="badge '+sevClass()+'" aria-label="Severity '+sevName()+'">&#9679; '+sevName()+'</span>';}
function sevClass(){var d=D.meta.difficulty;if(d==="easy"){return "badge-easy";}if(d==="medium"){return "badge-medium";}if(d==="hard"){return "badge-hard";}return "badge-extreme";}
function sevName(){return D.meta.sevName;}
function partLabel(){return D.meta.partLabel?('<span class="tag-mono">'+esc(D.meta.partLabel)+'</span>'):"";}
function fmtClock(sec){var m=Math.floor(Math.max(0,sec)/60),s=Math.max(0,sec)%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function pct(sum,count){return count>0?Math.round((sum/count)*100):0;}
function scoreExercise(sel,correct){
  var cs={},i,H=0,W=0;
  for(i=0;i<correct.length;i++){cs[correct[i]]=1;}
  for(i=0;i<sel.length;i++){if(cs[sel[i]]===1){H++;}else{W++;}}
  var N=correct.length;
  if(N===0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ---------- session ---------- */
function newSession(){
  S={order:shuffle(D.exercises),idx:0,answered:{},skipped:[],creditSum:0,answeredCount:0,
     hintUsed:{},timer:{state:"IDLE",remain:D.meta.estimatedMinutes*60,interval:null,manualSec:0,autoSec:0},
     reviewReturn:false,attempt:(S&&S.attempt?S.attempt:0)+1,username:(S&&S.username)?S.username:"",locked:{},reported:false};
}
function motionReduced(){return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}

/* ---------- timer state machine ---------- */
var T_STATES={RUNNING:1,PAUSED_MANUAL:1,PAUSED_AUTO_CHECK:1,ENDED:1};
function timerSet(st){
  S.timer.state=st;
  updateHeader();
}
function timerStart(){
  if(S.timer.interval){return;}
  S.timer.interval=setInterval(function(){
    if(S.timer.state==="PAUSED_MANUAL"){S.timer.manualSec+=1;return;}
    if(S.timer.state==="PAUSED_AUTO_CHECK"){S.timer.autoSec+=1;return;}
    if(S.timer.state!=="RUNNING"){return;}
    S.timer.remain-=1;
    if(S.timer.remain<=0){S.timer.remain=0;timerTickEnd();}
    updateHeader();
  },1000);
}
function timerTickEnd(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  showResults();
}
function timerPauseAutoCheck(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_AUTO_CHECK");}
}
function timerResumeFromAuto(){
  if(S.timer.state==="PAUSED_AUTO_CHECK"){timerSet("RUNNING");}
}
function timerPauseManual(){
  if(S.timer.state==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
}
function timerResumeManual(){
  hidePauseOverlay();
  if(S.timer.state==="PAUSED_MANUAL"){timerSet("RUNNING");}
}
function timerStateBadge(){
  var st=S.timer.state;
  if(st==="RUNNING"){return '<span class="badge badge-run" aria-label="Timer running">&#9654; RUNNING</span>';}
  if(st==="PAUSED_MANUAL"){return '<span class="badge badge-paused" aria-label="Timer paused manually">&#9208; PAUSED &#8212; manual (press Resume)</span>';}
  if(st==="PAUSED_AUTO_CHECK"){return '<span class="badge badge-paused" aria-label="Timer paused reviewing feedback">&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)</span>';}
  return '<span class="badge badge-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}

/* ---------- pause overlay (manual pause hides the exercise) ---------- */
function headerPauseClick(){
  var st=S.timer.state;
  if(st==="RUNNING"){timerSet("PAUSED_MANUAL");showPauseOverlay("manual");}
  else if(st==="PAUSED_AUTO_CHECK"){showPauseOverlay("auto");}
}
function headerHintClick(){
  if(!S||S.idx>=S.order.length){return;}
  var ex=S.order[S.idx];
  if(exState(ex)||S.hintUsed[ex.id]||$("hint-slot")==null){return;}
  if(S.timer.state==="ENDED"){return;}
  S.hintUsed[ex.id]=true;
  $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  var hb=$("btn-hint");if(hb){hb.disabled=true;}
  updateHeader();
}
function headerSkipClick(){
  if(!S||S.idx>=S.order.length||$("ans-widget")==null){return;}
  var ex=S.order[S.idx];
  if(exState(ex)){return;}
  doSkip(ex);
}
function showPauseOverlay(kind){
  var ov=$("pause-overlay");
  ov.innerHTML="";
  var c=el("div","card");
  c.innerHTML='<div style="font-size:40px" aria-hidden="true">&#9208;</div>'+
    '<h3 class="paused-word">&#9208; PAUSED &#8212; '+(kind==="manual"?"manual break":"reviewing feedback")+'</h3>'+
    '<p style="color:var(--text-secondary)">'+(kind==="manual"?"Your exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.":"The timer is already stopped for feedback review. Press the button below when you are ready to go back to the explanation.")+'</p>'+
    '<button class="btn btn-primary" id="btn-resume" style="margin-top:8px">&#9654; '+(kind==="manual"?"Resume":"Back to feedback")+'</button>';
  ov.appendChild(c);
  ov.style.display="flex";
  $("exam-view").style.visibility="hidden";
  var rb=$("btn-resume");
  if(rb){rb.addEventListener("click",overlayResume);rb.focus();}
}
function overlayResume(){
  hidePauseOverlay();
  if(S.timer.state==="PAUSED_MANUAL"){timerSet("RUNNING");}
}
function hidePauseOverlay(){
  $("pause-overlay").style.display="none";
  $("exam-view").style.visibility="visible";
}

/* ---------- intro screen ---------- */
function renderIntro(){
  var app=$("cm-app");
  app.innerHTML="";
  var head=el("div","card");
  head.innerHTML=
    '<div class="intro-head">'+
      '<div>'+
        '<h1 style="margin:0;font-size:26px">'+esc(D.meta.title)+'</h1>'+
        '<div class="tag-mono">'+esc(D.meta.objectId)+' &#8212; '+esc(D.meta.objectName)+' &#8212; MITRE ATT&amp;CK '+esc(D.meta.objectType)+'</div>'+
      '</div>'+
      '<div>'+sevBadge()+partLabel()+'</div>'+
    '</div>'+
    '<hr class="divider">'+
    '<div class="facts">'+
      '<span>Exercises in this file: <b>'+D.exercises.length+'</b></span>'+
      '<span>Estimated time: <b>'+D.meta.estimatedMinutes+' min</b> (timer budget: <b>'+D.meta.estimatedMinutes+' min</b> countdown)</span>'+
      '<span>Pass mark: <b>'+D.meta.passMark+'%</b></span>'+
      '<span>Scoring: <b>partial credit</b> on multi-answer exercises</span>'+
    '</div>';
  app.appendChild(head);

  var learn=el("div","card");
  var lh='<h2 style="margin-top:0;color:var(--accent-blue)">What you will learn here</h2>';
  for(var i=0;i<D.intro.learn.length;i++){lh+='<p>'+D.intro.learn[i]+'</p>';}
  learn.innerHTML=lh;
  app.appendChild(learn);

  var kw=el("div","card");
  var kh='<h2 style="margin-top:0;color:var(--accent-blue)">Keywords covered in this exam</h2>';
  for(var t=0;t<D.intro.keywords.length;t++){
    var th=D.intro.keywords[t];
    kh+='<div class="kw-theme"><h4>'+th.theme+'</h4><ul>';
    for(var k=0;k<th.items.length;k++){kh+='<li>'+th.items[k]+'</li>';}
    kh+='</ul></div>';
  }
  kw.innerHTML=kh;
  app.appendChild(kw);

  var how=el("div","card");
  var hh='<h2 style="margin-top:0;color:var(--accent-blue)">How this exam works</h2><ul class="rules">'+
    '<li><b>Pass mark '+D.meta.passMark+'%.</b> Your final score is computed only over the exercises you actually answered. A PASS means you reached '+D.meta.passMark+'% or more. A FAIL means you should retake the exam.</li>'+
    '<li><b>Exercise types in this file:</b> '+D.intro.typesUsed+'.</li>'+
    '<li><b>Timer.</b> A '+D.meta.estimatedMinutes+'-minute countdown runs while you work. You can press <b>Pause</b> for a real break: the exercise is hidden and the timer stops until you press Resume.</li>'+
    '<li><b>Check buys you time.</b> The moment you press <b>Check</b>, the timer stops automatically. You can study the feedback for as long as you like. The timer starts again only when you press <b>Next</b>.</li>'+
    '<li><b>Partial credit.</b> Exercises with several correct items are scored per item: <span class="mono">credit = max(0, (H &#8722; W) / N)</span>. Selecting wrong items subtracts. One hint per exercise costs &#8722;10% of that exercise&#8217;s credit.</li>'+
    '<li><b>Skip and come back.</b> Every exercise has a Skip button. Skipped exercises wait in a review pool. Before you finish, you can return to them and answer as long as the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</li>'+
    '</ul><div class="center" style="margin-top:16px">'+

function updateHeader(){
  var h=$("ex-hdr");
  if(!h||!S){return;}
  var answered=S.answeredCount;
  var scoreTxt=answered>0?("<b>"+(Math.round(S.creditSum*10)/10).toFixed(1)+"</b> / "+answered+" &#183; "+pct(S.creditSum,answered)+"%"):"0 / 0 &#183; &#8212;";
  var pos;
  var reviewShown=!!$("sk-list");
  if(S.reviewReturn){pos="Reviewing a skipped exercise";}
  else if(S.idx<S.order.length&&!reviewShown){pos="Exercise <b>"+(S.idx+1)+"</b> of <b>"+S.order.length+"</b>";}
  else if(reviewShown){pos="Review pool: <b>"+S.skipped.length+"</b> waiting";}
  else{pos="Exam finished";}
  h.setAttribute("role","status");
  $("hdr-dyn").innerHTML=
    '<span class="h-item">'+pos+'</span>'+
    '<span class="h-item">'+sevBadge()+partLabel()+'</span>'+
    '<span class="h-item"><span class="timer-num mono" id="hdr-clock">'+fmtClock(S.timer.remain)+'</span>'+timerStateBadge()+'</span>'+
    '<span class="h-item">Score '+scoreTxt+'</span>'+
    (S.username?'<span class="h-item">Analyst: <b>'+esc(S.username)+'</b></span>':'');
  var st=S.timer.state;
  var bp=$("btn-pause-h");
  if(bp){
    if(st==="PAUSED_MANUAL"){bp.innerHTML='&#9654; Resume';bp.disabled=false;}
    else{bp.innerHTML='&#9208; Pause';bp.disabled=(st==="ENDED");}
  }
  var cur=(S.idx<S.order.length&&!reviewShown)?S.order[S.idx]:null;
  var bh=$("btn-hint-h");

function updateProgress(){
  var f=$("prog-fill");
  if(!f||!S){return;}
  var total=S.order.length;
  var done=0,i;
  for(i=0;i<S.order.length;i++){if(S.answered[S.order[i].id]){done++;}}

/* ---------- exercise rendering ---------- */
function prepareExercise(ex){
  var keys=[],k;
  if(ex.type==="mcq"||ex.type==="multi"){
    for(k in ex.opts){if(Object.prototype.hasOwnProperty.call(ex.opts,k)){keys.push(k);}}
    keys=shuffle(keys);
    ex.renderOpts=keys.map(function(x){return {k:x,text:ex.opts[x]};});
  }else if(ex.type==="match"){
    ex.renderRights=shuffle(ex.pairs.map(function(p){return p.r;}));
    for(k=0;k<ex.pairs.length;k++){ex.pairs[k].rIdx=ex.renderRights.indexOf(ex.pairs[k].r);}
  }else if(ex.type==="drag"){
    ex.renderItems=shuffle(ex.items.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="order"){
    ex.renderItems=shuffle(ex.order.map(function(it){return {id:it.id,text:it.text};}));
  }else if(ex.type==="fill"){
    ex.renderBank=shuffle(ex.bank);
  }else if(ex.type==="decision"){
    for(k=0;k<ex.steps.length;k++){ex.steps[k].renderOpts=shuffle(ex.steps[k].opts);}
  }
}
function renderExercise(){
  var ex=currentEx();

  tog.addEventListener("click",function(){

  wrap.appendChild(qb);

  var ab=el("div","block blk-answer");
  ab.innerHTML='<div class="block-h"><span class="ico" aria-hidden="true">&#9998;</span>YOUR ANSWER</div><div class="block-b"><div id="ans-widget"></div>'+
    '<div id="hint-slot"></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px" id="action-row"></div></div>';
  wrap.appendChild(ab);

  var fb=el("div","","");

  if(ex.type==="mcq"||ex.type==="multi"){renderChoice(ex,w);}
  else if(ex.type==="match"){renderMatch(ex,w);}
  else if(ex.type==="drag"){renderDrag(ex,w);}
  else if(ex.type==="order"){renderOrder(ex,w);}
  else if(ex.type==="fill"){renderFill(ex,w);}

function exState(ex){return S.answered[ex.id];}
function isLocked(ex){return !!S.answered[ex.id];}

/* action row: Hint / Skip / Check / Next / Final Submit */
function renderActionRow(ex){
  var row=$("action-row");
  if(!row){return;}
  row.innerHTML="";
  var st=exState(ex);
  var bSkip=el("button","btn btn-ghost");
  bSkip.type="button";bSkip.id="btn-skip";
  bSkip.innerHTML='&#9888; Skip';
  bSkip.disabled=!!st;
  bSkip.addEventListener("click",function(){doSkip(ex);});
  var bHint=el("button","btn btn-warn btn-small");
  bHint.type="button";
  bHint.id="btn-hint";
  bHint.innerHTML='&#128161; Hint (&#8722;10% of this exercise)';
  if(S.hintUsed[ex.id]||st){bHint.disabled=true;}
  bHint.addEventListener("click",function(){
    if(S.hintUsed[ex.id]){return;}
    S.hintUsed[ex.id]=true;
    bHint.disabled=true;
    $("hint-slot").innerHTML='<div class="hintbox"><b>&#128161; Hint:</b> '+ex.hint+'</div>';
  });
  row.appendChild(bHint);

  if(ex.type!=="decision"&&!st){
    var bCheck=el("button","btn btn-green");

    bCheck.innerHTML='&#9989; Check';
    bCheck.disabled=!widgetHasAnswer(ex);
    bCheck.addEventListener("click",function(){doCheck(ex);});
    row.appendChild(bCheck);
  }
  row.appendChild(bSkip);
  if(st){
    var isLast=(S.idx>=S.order.length-1);
    var bNext=el("button","btn btn-primary");
    bNext.type="button";bNext.id="btn-next";
    bNext.innerHTML=isLast?'&#128230; Final Submit':'Next &#9654;';
    bNext.addEventListener("click",function(){goNext();});
    row.appendChild(bNext);
    bNext.focus();
  }
}
function widgetHasAnswer(ex){
  var i;
  if(ex.type==="mcq"||ex.type==="multi"){return $$(".opt").filter(function(b){return b.classList.contains("selected");}).length>0;}
  if(ex.type==="match"){var ss=$$(".match-select");for(i=0;i<ss.length;i++){if(ss[i].value){return true;}}return false;}
  if(ex.type==="drag"){return $$(".chip[data-zone]").length>0;}
  if(ex.type==="order"){return true;}
  if(ex.type==="fill"){var fs=$$(".fill-select");for(i=0;i<fs.length;i++){if(fs[i].value){return true;}}return false;}
  if(ex.type==="terminal"){return !!($("term-in")&&$("term-in").dataset.ran==="1");}
  return false;
}
function $$(sel,root){root=root||document;var n=root.querySelectorAll(sel);var r=[];for(var i=0;i<n.length;i++){r.push(n[i]);}return r;}

/* ---------- mcq / multi ---------- */
function renderChoice(ex,root){
  var opts=ex.renderOpts;
  var multi=ex.type==="multi";
  var wrap=el("div");
  wrap.setAttribute("role","group");
  wrap.setAttribute("aria-label",multi?"Multi-select answers":"Single-choice answers");
  for(var i=0;i<opts.length;i++){
    var o=opts[i];
    var b=el("button","opt");

    b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span><span class="mark" aria-hidden="true"></span>';
    b.addEventListener("click",function(){
      if(isLocked(ex)){return;}
      var k=this.dataset.k;
      if(multi){this.classList.toggle("selected");}
      else{
        var all=$$(".opt");
        for(var j=0;j<all.length;j++){all[j].classList.remove("selected");}
        this.classList.add("selected");
      }
      var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}
    });
    b.className+=" sel-opt";
    wrap.appendChild(b);
  }
  root.appendChild(wrap);
}
function collectChoice(ex){
  var sel=[],marks={},i;
  var ss=$$(".opt.selected");
  for(i=0;i<ss.length;i++){sel.push(ss[i].dataset.k);}
  return sel;
}
function gradeChoice(ex,sel){
  var credit=scoreExercise(sel,ex.correct);
  var rows=[],i,opts=ex.opts;
  var picked={};for(i=0;i<sel.length;i++){picked[sel[i]]=1;}
  var corr={};for(i=0;i<ex.correct.length;i++){corr[ex.correct[i]]=1;}
  var ordered=ex.renderOpts;
  for(i=0;i<ordered.length;i++){
    var k=ordered[i].k;
    if(corr[k]&&picked[k]){rows.push({st:"c",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(corr[k]&&!picked[k]){rows.push({st:"m",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
    else if(!corr[k]&&picked[k]){rows.push({st:"w",text:'<b>'+k+'.</b> '+opts[k]+(ex.why&&ex.why[k]?(" &#8212; "+ex.why[k]):"")});}
  }
  return {credit:credit,rows:rows};
}

/* ---------- match ---------- */
function renderMatch(ex,root){
  var rights=ex.renderRights;

  for(var i=0;i<ex.pairs.length;i++){
    var p=ex.pairs[i];

    }

function gradeMatch(ex){
  var ss=$$(".match-select"),N=ex.pairs.length,sel=[],rows=[],i;
  for(i=0;i<ss.length;i++){
    var li=parseInt(ss[i].dataset.left,10);
    if(!ss[i].value){rows.push({st:"m",text:'<b>'+ex.pairs[li].l+'</b> &#8212; correct match: <b>'+ex.pairs[li].r+'</b>'});continue;}
    if(ex.pairs[li].rIdx===parseInt(ss[i].value,10)){
      sel.push("p"+li);
      rows.push({st:"c",text:'<b>'+ex.pairs[li].l+'</b> &#8594; <b>'+ex.pairs[li].r+'</b>'});
    }else{
      sel.push("X"+li);
      rows.push({st:"w",text:'<b>'+ex.pairs[li].l+'</b> &#8212; you chose &#8220;'+ex.renderRights[parseInt(ss[i].value,10)]+'&#8221;. Correct: <b>'+ex.pairs[li].r+'</b>'});
    }
  }
  var correct=[];for(i=0;i<N;i++){correct.push("p"+i);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- drag & drop ---------- */
function renderDrag(ex,root){
  var wrap=el("div");
  var bankLabel=el("div","sub-label","&#9635; Item bank &#8212; click a chip, then click a zone (or drag it)");
  wrap.appendChild(bankLabel);
  var bank=el("div","bank");bank.id="dd-bank";
  for(var i=0;i<ex.renderItems.length;i++){
    var it=ex.renderItems[i];
    bank.appendChild(makeChip(it.id,it.text,ex));
  }
  wrap.appendChild(bank);
  var zones=el("div","zones");
  var cols=ex.zones.length>2?"1fr 1fr":"1fr";
  if(ex.zones.length>2){zones.style.gridTemplateColumns="1fr 1fr";}
  for(var z=0;z<ex.zones.length;z++){
    var zn=ex.zones[z];
    var zd=el("div","zone");zd.id="zone-"+zn.id;zd.dataset.zid=zn.id;
    zd.setAttribute("tabindex","0");
    zd.setAttribute("role","button");
    zd.setAttribute("aria-label","Drop zone: "+zn.label);
    zd.innerHTML='<div class="zone-h"><span aria-hidden="true">&#9635;</span>'+zn.label+'</div>';
    zd.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        var pk=document.querySelector(".chip.picked");
        if(pk){moveChip(pk.dataset.id,this.dataset.zid,ex);}
      }
    });
    zd.addEventListener("click",function(ev){
      if(ev.target!==this&&ev.target.parentNode!==this){return;}
      var pk=document.querySelector(".chip.picked");
      if(pk){moveChip(pk.dataset.id,this.dataset.zid,ex);}
    });
    zd.addEventListener("dragover",function(e){e.preventDefault();this.classList.add("over");});
    zd.addEventListener("dragleave",function(){this.classList.remove("over");});
    zd.addEventListener("drop",function(e){e.preventDefault();this.classList.remove("over");var id=e.dataTransfer.getData("text/plain");if(id){moveChip(id,this.id.replace("zone-",""),ex);}});
    zones.appendChild(zd);
  }
  wrap.appendChild(zones);
  var bankZone=bank;
  bank.addEventListener("dragover",function(e){e.preventDefault();});
  bank.addEventListener("drop",function(e){e.preventDefault();var id=e.dataTransfer.getData("text/plain");if(id){moveChip(id,null,ex);}});
  root.appendChild(wrap);
}
function makeChip(id,text,ex){
  var c=el("button","chip");
  c.type="button";c.draggable=true;c.dataset.id=id;c.dataset.text=text;
  c.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+text+'</span>';
  c.addEventListener("click",function(){
    if(isLocked(ex)){return;}
    if(this.dataset.zone){moveChip(this.dataset.id,null,ex);}
    else{
      var was=this.classList.contains("picked");
      $$(".chip.picked").forEach(function(x){x.classList.remove("picked");});
      if(!was){this.classList.add("picked");}
    }
  });
  c.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",this.dataset.id);this.classList.add("dragging");});
  c.addEventListener("dragend",function(){this.classList.remove("dragging");});
  return c;
}
function moveChip(id,zid,ex){
  if(isLocked(ex)){return;}
  var c=document.querySelector('.chip[data-id="'+id+'"]');
  if(!c){return;}
  c.classList.remove("picked");
  if(zid){
    var z=$("zone-"+zid);
    c.dataset.zone=zid;
    z.appendChild(c);
  }else{
    delete c.dataset.zone;
    $("dd-bank").appendChild(c);
  }
  var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}
}
function placeChip(){/* handled via moveChip */}
function gradeDrag(ex){
  var correct=[],sel=[],rows=[],i;
  for(i=0;i<ex.items.length;i++){
    var it=ex.items[i];
    var zid=ex.map[it.id];
    correct.push("i"+it.id+"@"+zid);
  }
  var chips=$$(".chip[data-id]");
  for(i=0;i<chips.length;i++){
    var id=chips[i].dataset.id;
    var placed=chips[i].dataset.zone;
    var want=ex.map[id];

    else if(placed){sel.push("X"+id);rows.push({st:"w",text:'<b>'+chips[i].dataset.text+'</b> &#8594; you placed it in &#8220;'+zoneName(ex,placed)+'&#8221;. Correct: <b>'+zoneName(ex,want)+'</b>'});}
    else{rows.push({st:"m",text:'<b>'+chips[i].dataset.text+'</b> &#8212; not placed. Correct zone: <b>'+zoneName(ex,want)+'</b>'});}
  }
  return {credit:scoreExercise(sel,correct),rows:rows};
}
function zoneName(ex,zid){for(var i=0;i<ex.zones.length;i++){if(ex.zones[i].id===zid){return ex.zones[i].label;}}return zid;}

/* ---------- ordering ---------- */
function renderOrder(ex,root){
  var wrap=el("div");
  var note=el("div","sub-label","&#9635; Reorder &#8212; drag a row, or use the arrows");
  wrap.appendChild(note);
  var list=el("div");list.id="ord-list";
  for(var i=0;i<ex.renderItems.length;i++){
    list.appendChild(orderRow(ex,ex.renderItems[i],i));
  }
  wrap.appendChild(list);
  root.appendChild(wrap);
}
function orderRow(ex,item,i){
  var r=el("div","order-row");r.draggable=true;r.dataset.oid=item.id;r.dataset.text=item.text;
  r.innerHTML='<span class="num">'+(i+1)+'</span><span class="txt">'+item.text+'</span>'+
    '<span class="mini-btns"><button type="button" aria-label="Move up">&#9650;</button><button type="button" aria-label="Move down">&#9660;</button></span>';
  var btns=r.querySelectorAll("button");
  btns[0].addEventListener("click",function(){orderMove(ex,r,-1);});
  btns[1].addEventListener("click",function(){orderMove(ex,r,1);});
  r.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",this.dataset.oid);this.classList.add("dragging");});
  r.addEventListener("dragend",function(){this.classList.remove("dragging");});
  r.addEventListener("dragover",function(e){e.preventDefault();});
  r.addEventListener("drop",function(e){e.preventDefault();var id=e.dataTransfer.getData("text/plain");orderReorder(ex,id,this.dataset.oid);});
  return r;
}
function orderMove(ex,row,dir){
  if(isLocked(ex)){return;}
  var list=$("ord-list");
  var rows=list.getElementsByClassName("order-row");
  var arr=[],i,idx=-1;
  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i]===row){idx=i;}}
  var j=idx+dir;
  if(j<0||j>=arr.length){return;}
  var tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp;
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}
function orderReorder(ex,srcId,dstId){
  if(isLocked(ex)||srcId===dstId){return;}
  var list=$("ord-list");
  var rows=list.getElementsByClassName("order-row");
  var arr=[],i,si=0,di=0;
  for(i=0;i<rows.length;i++){arr.push(rows[i]);if(rows[i].dataset.oid===srcId){si=i;}if(rows[i].dataset.oid===dstId){di=i;}}
  var item=arr.splice(si,1)[0];
  arr.splice(di,0,item);
  list.innerHTML="";
  for(i=0;i<arr.length;i++){list.appendChild(arr[i]);orderRenumber(arr[i],i);}
}
function orderRenumber(row,i){row.querySelector(".num").innerHTML=(i+1);}
function gradeOrder(ex){
  var rows=$$(".order-row"),N=ex.order.length,sel=[],frows=[],i;
  var pos={};for(i=0;i<ex.order.length;i++){pos[ex.order[i].id]=i;}
  for(i=0;i<rows.length;i++){
    var id=rows[i].dataset.oid;
    if(pos[id]===i){sel.push("p"+i);frows.push({st:"c",text:'<b>'+(i+1)+'.</b> '+rows[i].dataset.text});}
    else{sel.push("X"+i);frows.push({st:"w",text:'<b>'+(i+1)+'.</b> you placed &#8220;'+rows[i].dataset.text+'&#8221;. Expected: <b>'+ex.order[i].text+'</b>'});}
  }
  var correct=[];for(i=0;i<N;i++){correct.push("p"+i);}
  return {credit:scoreExercise(sel,correct),rows:frows};
}

/* ---------- fill in the blanks ---------- */
function renderFill(ex,root){
  var wrap=el("div");
  var line=el("div","fill-line");
  var html="";
  var blankOrd=0;
  for(var i=0;i<ex.parts.length;i++){
    var p=ex.parts[i];
    if(typeof p==="string"){html+=p;}
    else{
      blankOrd++;
      html+='<select class="fill-select" data-b="'+i+'" aria-label="Blank '+blankOrd+'"><option value="">&#8212; ? &#8212;</option>';
      for(var j=0;j<ex.renderBank.length;j++){html+='<option value="'+j+'">'+ex.renderBank[j]+'</option>';}
      html+='</select>';
    }
  }
  line.innerHTML=html;
  wrap.appendChild(line);
  var bankNote=el("div","bank-chips",'<div class="sub-label" style="margin-top:12px">&#9635; Word bank (shuffled &#8212; same choices on every blank)</div><div>');
  for(var b=0;b<ex.renderBank.length;b++){bankNote.innerHTML+='<span class="chip" style="cursor:default;min-height:36px;padding:4px 12px">'+ex.renderBank[b]+'</span>';}
  bankNote.innerHTML+='</div>';
  wrap.appendChild(bankNote);
  var ss=wrap.querySelectorAll("select");
  for(i=0;i<ss.length;i++){
    ss[i].addEventListener("change",function(){var bc=$("btn-check");if(bc){bc.disabled=!widgetHasAnswer(ex);}});
  }
  root.appendChild(wrap);
}
function gradeFill(ex){
  var ss=$$(".fill-select"),sel=[],rows=[],i,blankIdx=[];
  for(i=0;i<ex.parts.length;i++){if(typeof ex.parts[i]!=="string"){blankIdx.push(i);}}
  for(i=0;i<ss.length;i++){
    var bi=parseInt(ss[i].dataset.b,10);
    var want=ex.parts[bi].a;
    var wantIdx=-1,k;
    for(k=0;k<ex.renderBank.length;k++){if(ex.renderBank[k]===want){wantIdx=k;break;}}
    if(!ss[i].value){rows.push({st:"m",text:'Blank '+(i+1)+': left empty. Correct: <b>'+want+'</b>'});continue;}
    if(parseInt(ss[i].value,10)===wantIdx){sel.push("b"+bi);rows.push({st:"c",text:'Blank '+(i+1)+': <b>'+want+'</b>'});}
    else{sel.push("X"+bi);rows.push({st:"w",text:'Blank '+(i+1)+': you chose &#8220;'+ex.renderBank[parseInt(ss[i].value,10)]+'&#8221;. Correct: <b>'+want+'</b>'});}
  }
  var correct=[];for(i=0;i<blankIdx.length;i++){correct.push("b"+blankIdx[i]);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- terminal ---------- */
function renderTerminal(ex,root){
  var wrap=el("div");
  wrap.innerHTML='<div class="sub-label">&#9635; '+esc(ex.term.title)+'</div>'+
    '<div class="term">'+
    '<div class="term-title"><span aria-hidden="true">&#9654;</span>'+esc(ex.term.env)+'</div>'+
    '<div class="term-scroll term mono" id="term-scroll">'+ex.term.banner+'</div>'+
    '<div class="term-input-row"><span class="term-prompt">'+ex.term.prompt+'</span>'+
    '<input id="term-in" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command">'+
    '<button type="button" class="btn btn-small btn-green" id="term-run">Run &#9166;</button></div></div>'+
    (ex.term.syntaxPanel?('<div class="sub" style="margin-top:10px">'+ex.term.syntaxPanel+'</div>'):"")+
    (ex.term.outputSample?('<div class="sub" style="margin-top:10px"><div class="sub-label">Expected output shape</div>'+ex.term.outputSample+'</div>'):"");
  root.appendChild(wrap);
  var inp=$("term-in");
  $("term-run").addEventListener("click",function(){termRun(ex);});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();termRun(ex);}});
}
function termNormalize(cmd){
  return cmd.replace(/["']/g,"").replace(/\|/g," | ").replace(/\s+/g," ").trim().toLowerCase();
}
function termRun(ex){
  var inp=$("term-in");
  var cmd=inp.value;
  if(!cmd.trim()){return;}
  var scroll=$("term-scroll");
  var line=el("span","term-line");
  line.innerHTML='<span class="tg">'+esc(ex.term.prompt)+'</span> '+esc(cmd);
  scroll.appendChild(line);
  var norm=termNormalize(cmd);
  var firstTok=norm.split(" ")[0];
  var toolOk=false,i;
  for(i=0;i<ex.term.acceptTools.length;i++){if(firstTok===ex.term.acceptTools[i]){toolOk=true;}}
  var out=el("span","term-line");
  if(toolOk){out.innerHTML=ex.term.outputHtml;}
  else{out.innerHTML='<span class="tr">command not found: '+esc(firstTok)+' &#8212; this lab shell only accepts the trust-verification tooling.</span>';}
  scroll.appendChild(out);
  scroll.scrollTop=scroll.scrollHeight;
  inp.dataset.ran="1";inp.dataset.last=cmd;
  var bc=$("btn-check");if(bc){bc.disabled=false;}
  inp.focus();
}
function gradeTerminal(ex){
  var cmd=termNormalize($("term-in").dataset.last||"");
  var segs=cmd.split("|");
  var mainToks=segs[0].trim().split(" ").filter(function(x){return x.length>0;});
  var pipeStages=[],s;
  for(s=1;s<segs.length;s++){
    var pt=segs[s].trim().split(" ").filter(function(x){return x.length>0;});
    if(pt.length>0){pipeStages.push(pt[0]);}
  }
  var rows=[],sel=[],i,k;
  var flags=[];
  var target="";
  for(i=1;i<mainToks.length;i++){
    var t=mainToks[i];
    if(t.charAt(0)==="/"||t.charAt(0)==="-"){flags.push(t);}
    else{target=t;}
  }
  var normTarget=(target||"").replace(/\//g,"\\").replace(/\\+/g,"\\").replace(/\\$/,"");
  var allToks=mainToks.concat(pipeStages);
  var hits={};
  for(i=0;i<ex.term.elements.length;i++){
    var e2=ex.term.elements[i],ok=false;
    if(e2.kind==="tool"){ok=(mainToks.length>0&&ex.term.acceptTools.indexOf(mainToks[0])>=0);}
    else if(e2.kind==="tok"){for(k=0;k<allToks.length;k++){if(e2.accept.indexOf(allToks[k])>=0){ok=true;break;}}}
    else if(e2.kind==="flag"){for(k=0;k<flags.length;k++){if(e2.accept.indexOf(flags[k].replace(/^-/,"/").toLowerCase())>=0){ok=true;break;}}}
    else if(e2.kind==="target"){ok=(e2.accept.indexOf(normTarget)>=0);}
    else if(e2.kind==="pipe"){for(k=0;k<pipeStages.length;k++){if(e2.accept.indexOf(pipeStages[k])>=0){ok=true;break;}}}
    if(ok){hits[e2.key]=1;sel.push(e2.key);}else{rows.push({st:"m",text:'<b>'+e2.name+'</b> &#8212; missing or wrong. Expected: <span class="mono">'+esc(e2.expect)+'</span>'});}
  }
  var reqFlags={};for(i=0;i<ex.term.elements.length;i++){if(ex.term.elements[i].kind==="flag"){for(k=0;k<ex.term.elements[i].accept.length;k++){reqFlags[ex.term.elements[i].accept[k]]=1;}}}
  var optFlags=ex.term.optionalFlags||[];
  for(i=0;i<flags.length;i++){
    var f=flags[i].replace(/^-/,"/").toLowerCase();
    if(!reqFlags[f]&&optFlags.indexOf(f)<0){sel.push("Xflag"+i);}
  }
  var dangerous=/(^|\s)(del|erase|rm|remove-item|ri)(\s|$)|delete-driver|delstore|deleteroot|\/uninstall/.test(cmd);
  for(i=0;i<ex.term.elements.length;i++){
    var e3=ex.term.elements[i];
    if(hits[e3.key]){rows.unshift({st:"c",text:'<b>'+e3.name+'</b> &#8212; correct (<span class="mono">'+esc(e3.expect)+'</span>)'});}
  }
  if(dangerous){rows.push({st:"w",text:'<b>DANGEROUS &#8212; NEAR MISS:</b> this command pattern would alter or destroy trust state or evidence on a live host. Never clean up while you still need evidence.'});}
  var correct=[];for(i=0;i<ex.term.elements.length;i++){correct.push(ex.term.elements[i].key);}
  return {credit:scoreExercise(sel,correct),rows:rows,dangerous:dangerous};
}

/* ---------- decision tree ---------- */
function renderDecision(ex,root){
  var wrap=el("div");
  wrap.innerHTML='<div class="sub-label" id="dec-step-label"></div><div id="dec-step-body"></div>';
  root.appendChild(wrap);
  ex.decState={step:0,picks:[]};
  renderDecisionStep(ex);
}
function renderDecisionStep(ex){
  var st=ex.decState.step;
  var step=ex.steps[st];
  var stepOpts=step.renderOpts||step.opts;
  $("dec-step-label").innerHTML='<span class="badge badge-medium" style="letter-spacing:.08em">STEP '+(st+1)+' OF '+ex.steps.length+'</span>';
  var body=$("dec-step-body");
  body.innerHTML="";
  if(step.scene){var sc=el("div","artefact");sc.innerHTML='<div class="sub-label">'+step.sceneLabel+'</div>'+step.scene;body.appendChild(sc);}
  var q=el("div","","<p style='font-weight:600'>"+step.q+"</p>");
  body.appendChild(q);
  var verdict=el("div","","");verdict.id="dec-verdict";
  var opts=el("div","");opts.id="dec-opts";
  for(var i=0;i<stepOpts.length;i++){
    var o=stepOpts[i];
    var b=el("button","opt");
    b.type="button";b.dataset.k=o.k;
    b.innerHTML='<span class="k">'+o.k+'.</span><span>'+o.text+'</span>';
    b.addEventListener("click",function(){decisionPick(ex,this);});
    opts.appendChild(b);
  }
  body.appendChild(opts);
  body.appendChild(verdict);
}
function decisionPick(ex,btn){
  if(btn.classList.contains("picked-opt")){return;}
  var st=ex.decState.step;
  var step=ex.steps[st];
  var k=btn.dataset.k;
  ex.decState.picks.push(k);
  var ok=(k===step.correct);
  var all=$$("#dec-opts .opt");
  for(var i=0;i<all.length;i++){all[i].classList.add("picked-opt");if(all[i].dataset.k===step.correct){all[i].querySelector(".k").innerHTML='&#10003;';all[i].style.borderColor="var(--state-correct)";}else if(all[i]===btn){all[i].querySelector(".k").innerHTML='&#10007;';all[i].style.borderColor="var(--state-incorrect)";}}
  var v=$("dec-verdict");
  v.innerHTML='<div class="fb-row '+(ok?"ri-correct":"ri-wrong")+'"><span class="st">'+(ok?"&#10003; Correct":"&#10007; Not the best call")+'</span><span>'+step.why+'</span></div>'+
    '<div class="center" style="margin-top:10px"><button type="button" class="btn btn-primary btn-small" id="dec-next-btn">'+(st===ex.steps.length-1?"&#9989; Check &#8212; final step":"Confirm &amp; continue &#9654;")+'</button></div>';
  $("dec-next-btn").addEventListener("click",function(){decisionAdvance(ex);});
  $("dec-next-btn").focus();
}
function decisionAdvance(ex){
  var st=ex.decState.step;
  if(st<ex.steps.length-1){
    ex.decState.step++;
    renderDecisionStep(ex);
  }else{
    doCheck(ex);
  }
}
function optTextOf(step,k){var list=step.renderOpts||step.opts;for(var i=0;i<list.length;i++){if(list[i].k===k){return list[i].text;}}return "(no answer)";}
function gradeDecision(ex){
  var sel=[],rows=[],i;
  for(i=0;i<ex.steps.length;i++){
    var step=ex.steps[i];
    var pick=ex.decState.picks[i];
    if(pick===step.correct){sel.push("s"+i);rows.push({st:"c",text:'<b>Step '+(i+1)+'.</b> '+step.recap});}
    else{sel.push("X"+i);rows.push({st:"w",text:'<b>Step '+(i+1)+'.</b> You chose &#8220;'+optTextOf(step,pick)+'&#8221;. Best call: <b>'+optTextOf(step,step.correct)+'</b>. '+step.recap});}
  }
  var correct=[];for(i=0;i<ex.steps.length;i++){correct.push("s"+i);}
  return {credit:scoreExercise(sel,correct),rows:rows};
}

/* ---------- check / skip / next ---------- */
function doCheck(ex){
  if(exState(ex)){return;}
  timerPauseAutoCheck();
  var res,i;
  if(ex.type==="mcq"||ex.type==="multi"){res=gradeChoice(ex,collectChoice(ex));}
  else if(ex.type==="match"){res=gradeMatch(ex);}
  else if(ex.type==="drag"){res=gradeDrag(ex);}
  else if(ex.type==="order"){res=gradeOrder(ex);}
  else if(ex.type==="fill"){res=gradeFill(ex);}
  else if(ex.type==="terminal"){res=gradeTerminal(ex);}
  else if(ex.type==="decision"){res=gradeDecision(ex);}
  if(S.hintUsed[ex.id]){res.credit=Math.max(0,res.credit-0.10);res.hintPenalty=true;}
  res.credit=Math.round(res.credit*100)/100;
  S.answered[ex.id]={credit:res.credit,rows:res.rows,type:ex.type,dangerous:res.dangerous};
  S.creditSum+=res.credit;S.answeredCount++;
  renderFeedback(ex,res);
  updateHeader();updateProgress();
  var bc=$("btn-check");if(bc){bc.disabled=true;}
  var bs=$("btn-skip");if(bs){bs.disabled=true;}
  if(ex.type==="terminal"){var ti=$("term-in");if(ti){ti.disabled=true;}var tr=$("term-run");if(tr){tr.disabled=true;}}
  if(ex.type==="decision"){var db=$("dec-next-btn");if(db){db.disabled=true;}}
  renderActionRow(ex);
}
function renderFeedback(ex,res){
  var slot=$("fb-slot");
  var label,cls;
  if(res.credit>=1){label='&#10003; CORRECT';cls="fb-correct";}
  else if(res.credit>0){label='&#10003; PARTIALLY CORRECT &#8212; credit '+res.credit.toFixed(2)+' &#8212; '+Math.round(res.credit*100)+'% of items';cls="fb-partial";}
  else{label='&#10007; INCORRECT';cls="fb-incorrect";}
  var html='<div class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>'+
    (res.hintPenalty?'<span class="tag-mono">includes &#8722;0.10 hint cost</span>':"")+'</div><div class="fb-b">';
  if(res.rows&&res.rows.length>1||(ex.type!=="mcq"&&res.rows)){
    for(var i=0;i<res.rows.length;i++){
      var r=res.rows[i];
      var stTxt=r.st==="c"?'<span class="st">&#10003; Correct</span>':(r.st==="w"?'<span class="st">&#10007; Wrong</span>':'<span class="st">&#9675; Missed</span>');
      html+='<div class="fb-row ri-'+(r.st==="c"?"correct":(r.st==="w"?"wrong":"miss"))+'">'+stTxt+'<span>'+r.text+'</span></div>';
    }
  }
  if(ex.type==="terminal"){
    html+='<div class="codebox"><div class="sub-label">Canonical command</div><span class="term-line">'+esc(ex.term.canonical)+'</span></div>'+
      '<p style="font-size:14.5px">'+ex.term.canonicalExplain+'</p>';
  }
  html+='<div style="margin-top:10px">'+ex.expl+'</div>';
  if(res.credit<1&&ex.study){html+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';}
  html+='</div></div>';
  slot.innerHTML=html;
  slot.scrollIntoView({behavior:motionReduced()?"auto":"smooth",block:"nearest"});
}
function doSkip(ex){
  if(exState(ex)){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  if(S.reviewReturn){showReview();return;}
  goNextAfterSkip();
}
function goNextAfterSkip(){
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{
    if(S.skipped.length>0&&S.timer.state!=="ENDED"){showReview();}
    else{showResults();}
  }
}
function goNext(){
  timerResumeFromAuto();
  if(S.reviewReturn){S.reviewReturn=false;showReview();return;}
  var isLast=(S.idx>=S.order.length-1);
  if(!isLast){S.idx++;renderExercise();}
  else{
    if(S.timer.state==="ENDED"){showResults();return;}
    if(S.skipped.length>0){showReview();return;}
    showResults();
  }
}

/* ---------- review skipped ---------- */
function showReview(){
  updateHeader();
  var v=$("exam-view");
  v.innerHTML='<div class="card"><h2 style="margin-top:0;color:var(--accent-amber)">&#9888; Review skipped exercises</h2>'+
    '<p style="color:var(--text-secondary)">These exercises are waiting. You can return to any of them and answer it, as long as the timer has not ended. If you submit now, every exercise still on this list is <b>excluded from the score</b> &#8212; it does not count as right or wrong.</p>'+
    '<div class="sk-list" id="sk-list"></div>'+
    '<hr class="divider">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-green" id="btn-final-submit">&#128230; Final Submit &#8212; exclude the rest</button></div></div>';
  var list=$("sk-list");
  var remaining=[];
  for(var i=0;i<S.skipped.length;i++){if(!S.answered[S.skipped[i]]){remaining.push(S.skipped[i]);}}
  if(remaining.length===0){
    list.innerHTML='<p style="color:var(--state-correct)">&#10003; Nothing left to answer &#8212; ready to submit.</p>';
  }
  for(i=0;i<remaining.length;i++){
    (function(id){
      var ex=byId(id);
      var row=el("div","fb-row ri-miss");
      row.innerHTML='<span class="st">&#9888; Skipped</span><span style="flex:1">'+(ex.sum||ex.question)+'</span>';
      var b=el("button","btn btn-small btn-primary","Answer &#9654;");
      b.type="button";
      b.addEventListener("click",function(){
        S.reviewReturn=true;
        S.idx=S.order.indexOf(ex);
        renderExercise();
        timerResumeFromAuto();
      });
      row.appendChild(b);
      list.appendChild(row);
    })(remaining[i]);
  }
  $("btn-final-submit").addEventListener("click",function(){showResults();});
  window.scrollTo(0,0);
}
function byId(id){for(var i=0;i<D.exercises.length;i++){if(D.exercises[i].id===id){return D.exercises[i];}}return null;}

/* ---------- results ---------- */
function showResults(){
  clearInterval(S.timer.interval);S.timer.interval=null;
  timerSet("ENDED");
  var full=0,partial=0,partSum=0,zero=0,excluded=0,i;
  for(i=0;i<S.order.length;i++){
    var id=S.order[i].id;
    var st=S.answered[id];
    if(st){
      if(st.credit>=1){full++;}
      else if(st.credit>0){partial++;partSum+=st.credit;}
      else{zero++;}
    }else if(S.skipped.indexOf(id)>=0||S.idx<S.order.length){excluded++;}
  }
  var answered=S.answeredCount;
  var percent=pct(S.creditSum,answered);
  var passed=percent>=D.meta.passMark;
  var v=$("exam-view");
  var html='<div class="card"><h2 style="margin-top:0">&#127942; Final results</h2>'+
    '<div class="res-grid">'+
    '<div class="res-card"><div class="big" style="color:var(--text-primary)">'+(Math.round(S.creditSum*10)/10).toFixed(1)+' / '+answered+'</div><div class="lbl"><b>'+percent+'%</b> &#8212; computed over answered exercises only</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-correct)">&#10003; '+full+'</div><div class="lbl">Fully correct</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-partial)">&#10003; '+partial+'</div><div class="lbl">Partially correct'+(partial>0?(" &#8212; avg "+(partSum/partial).toFixed(2)):"")+'</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-incorrect)">&#10007; '+zero+'</div><div class="lbl">Fully incorrect</div></div>'+
    '<div class="res-card"><div class="big" style="color:var(--state-skipped)">&#9888; '+excluded+'</div><div class="lbl">Skipped / unanswered &#8212; excluded</div></div>'+
    '</div>'+
    '<div class="verdict '+(passed?"pass":"fail")+'"><div class="v-title">'+(passed?"&#10003; PASS":"&#10007; FAIL")+' &#8212; '+percent+'%</div>'+
    '<p style="color:var(--text-secondary)">'+(passed?"You reached the pass mark of "+D.meta.passMark+"%. Well done &#8212; the certificate panel below is yours.":"You did not reach the pass mark of "+D.meta.passMark+"%. Study the explanations and retake the exam &#8212; the questions and options will be shuffled.")+'</p></div>'+
    '<p style="color:var(--text-secondary);font-size:14px"><b>Time report:</b> '+fmtClock(S.timer.remain)+' left on the clock &#183; '+fmtClock(S.timer.manualSec)+' paused manually (breaks) &#183; '+fmtClock(S.timer.autoSec)+' paused for feedback review.</p>'+
    '<div class="center" style="margin-top:14px"><button type="button" class="btn btn-primary" id="btn-retake" style="font-size:16px;padding:12px 34px">&#8635; Retake Exam</button></div></div>';
  v.innerHTML=html;
  $("btn-retake").addEventListener("click",retake);
  reportScore(S.creditSum,answered);
  window.scrollTo(0,0);
}
function retake(){
  var attempt=S.attempt,uname=S.username;
  newSession();
  S.attempt=attempt+1;S.username=uname;
  renderIntro();
  window.scrollTo(0,0);
}

/* ---------- site integration ---------- */
function reportScore(creditSum,answeredCount){
  if(S.reported){return;}
  S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){/* opened directly, not inside the site frame */}
}
window.addEventListener("message",function(event){
  if(!event.data){return;}
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT"){return;}
  if(S){S.username=event.data.username||"";updateHeader();}
});
</script>
<script>
newSession();
renderIntro();
</script>
