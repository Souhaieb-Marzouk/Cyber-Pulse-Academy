<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729; --border:#243049;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  /* derived tints & surfaces - every colour literal lives here once */
  --shadow-card:0 4px 14px rgba(0,0,0,.35);
  --grad-scen-top:rgba(90,169,255,.06); --grad-scen-end:rgba(90,169,255,0);
  --grad-q-top:rgba(255,180,84,.06); --grad-q-end:rgba(255,180,84,0);
  --grad-a-top:rgba(87,211,140,.06); --grad-a-end:rgba(87,211,140,0);
  --on-green:#08130c; --on-blue:#04121f; --on-amber:#241300; --on-red:#2a0606;
  --tint-green:rgba(87,211,140,.08); --tint-amber:rgba(255,180,84,.08);
  --tint-orange:rgba(255,138,61,.08); --tint-red:rgba(255,107,107,.08);
  --tint-grey:rgba(169,180,208,.08); --tint-purple:rgba(157,123,255,.10);
  --tint-blue:rgba(90,169,255,.08); --tint-blue-soft:rgba(90,169,255,.05);
  --tint-amber-soft:rgba(255,180,84,.06);
  --tint-green-panel:rgba(87,211,140,.07); --tint-red-panel:rgba(255,107,107,.07);
  --hdr-bg:rgba(11,16,32,.97);
  --sheen:rgba(255,255,255,.18);
  --glow-green:rgba(87,211,140,.15);
  --overlay:rgba(7,10,20,.92);
  --bg-term:#070b16; --opt-hover:#16203a;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);font-size:16px;line-height:1.55}
body{min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{line-height:1.25}
a{color:var(--accent-blue)}
code,.mono{font-family:var(--font-mono);color:var(--text-mono)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font-family:inherit}
button,.opt,.zone,.orderRow{min-height:44px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* ---------- generic cards ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow-card)}
.card h3{margin:0 0 10px 0;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.blockHead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px}
.bh-scenario{color:var(--accent-blue)}
.bh-question{color:var(--accent-amber)}
.bh-answer{color:var(--accent-green)}
.bh-feedback{color:var(--text-primary)}
.scenarioCard{background:linear-gradient(180deg,var(--grad-scen-top),var(--grad-scen-end)),var(--bg-surface)}
.questionCard{background:linear-gradient(180deg,var(--grad-q-top),var(--grad-q-end)),var(--bg-surface)}
.answerCard{background:linear-gradient(180deg,var(--grad-a-top),var(--grad-a-end)),var(--bg-surface)}
.qText{font-weight:700;font-size:16.5px}
/* ---------- intro ---------- */
.factGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.fact .k{color:var(--text-secondary);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;display:block}
.fact .v{font-size:16px;font-weight:700;margin-top:2px;display:block}
.themePanel{margin-top:10px}
.themePanel h4{margin:12px 0 6px 0;font-size:13.5px;color:var(--accent-blue);letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:13.5px;color:var(--text-primary)}
.rulesList{margin:8px 0 0 0;padding-left:20px}
.rulesList li{margin:7px 0}
.rulesList li b{color:var(--text-primary)}
.rulesList li{color:var(--text-secondary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-green);color:var(--on-green);font-weight:700;font-size:16px;border:none;border-radius:8px;padding:12px 26px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border)}
.btn.secondary:hover{border-color:var(--accent-blue)}
.btn.blue{background:var(--accent-blue);color:var(--on-blue)}
.btn.amber{background:var(--accent-amber);color:var(--on-amber)}
.btn.danger{background:var(--state-incorrect);color:var(--on-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 10px;font-weight:700;font-size:13px;letter-spacing:.05em;border:1px solid}
.badge.easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber)}
.badge.hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange)}
.badge.extremely-hard{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red)}
.stateChip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;border-radius:6px;padding:3px 10px;border:1px solid var(--border)}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);background:var(--tint-green)}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);background:var(--tint-amber)}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);background:var(--tint-red)}
.st-skipped{color:var(--state-skipped);border-color:var(--state-skipped);background:var(--tint-grey)}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);background:var(--tint-purple)}
.st-info{color:var(--accent-blue);border-color:var(--accent-blue);background:var(--tint-blue)}
/* ---------- exam header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--hdr-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hdr .count{font-weight:700;font-size:15px}
.hdr .score{margin-left:auto;font-family:var(--font-mono);font-size:15px;color:var(--text-primary)}
.hdr .score b{font-size:16.5px}
.hdrBtn{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);border-radius:7px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.hdrBtn:hover{border-color:var(--accent-blue)}
.hdrBtn:disabled{opacity:.4;cursor:not-allowed}
.timerBox{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:var(--font-mono);font-size:15.5px;color:var(--text-primary)}
.timerBox .tstate{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.04em}
.progress{height:8px;background:var(--bg-surface-2);border-radius:4px;overflow:hidden;margin:12px 0 0 0;border:1px solid var(--border)}
.progress .fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-green));position:relative;transition:width .4s ease}
.progress .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--sheen) 50%,transparent 70%);animation:sheen 2.6s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* ---------- artefacts ---------- */
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .aLabel{display:block;font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-blue-soft)}
.artefact pre{margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);overflow-x:auto;white-space:pre}
.artefact .filterRow{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border)}
.artefact .filterRow input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:var(--font-mono);font-size:13.5px;padding:7px 10px;min-height:36px}
.artefact .filterRow .fHint{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.lg-key{color:var(--accent-blue)}
.lg-warn{color:var(--accent-amber)}
.lg-bad{color:var(--state-incorrect)}
.lg-ok{color:var(--state-correct)}
.lg-dim{color:var(--text-secondary)}
/* ---------- collapse ---------- */
.collapseBar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-size:13.5px;padding:9px 12px;cursor:pointer}
.collapseBar:hover{color:var(--text-primary);border-color:var(--accent-blue)}
.collapseBar .sum{flex:1}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text-primary);font-size:15.5px;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.opt:hover{background:var(--opt-hover);border-color:var(--accent-blue)}
.opt .k{font-family:var(--font-mono);font-weight:700;color:var(--text-secondary);flex-shrink:0}
.opt[aria-pressed="true"],.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 10px var(--glow-green)}
.opt:disabled,.ddItem:disabled{cursor:default;opacity:.85}
.opt[aria-pressed="true"] .selTag,.opt.selected .selTag{visibility:visible}
.opt .selTag{visibility:hidden;margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap}
/* ---------- match / fill ---------- */
.matchRow{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center;margin:8px 0}
.matchRow .lft{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px}
select.ansSelect{width:100%;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14.5px;padding:9px 10px;min-height:44px}
.fillText{font-size:15.5px;line-height:2}
.fillText select{margin:0 4px;min-width:150px;max-width:280px}
/* ---------- dragdrop ---------- */
.ddGrid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-top:6px}
@media (max-width:760px){.ddGrid{grid-template-columns:1fr}}
.bankPanel,.zoneCol{display:flex;flex-direction:column;gap:8px}
.miniLabel{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.ddItem{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:14px;cursor:grab;color:var(--text-primary)}
.ddItem.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.ddItem .rm{background:none;border:none;color:var(--text-secondary);font-size:14px;cursor:pointer;padding:2px 4px;min-height:24px}
.ddItem .rm:hover{color:var(--state-incorrect)}
.zone{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:64px}
.zone .zLabel{font-weight:700;font-size:14px;color:var(--accent-blue);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.zone .ph{color:var(--text-secondary);font-size:13px}
/* ---------- order ---------- */
.orderList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.orderRow{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.orderRow .pos{font-family:var(--font-mono);color:var(--accent-amber);font-weight:700;min-width:26px;text-align:center}
.orderRow .txt{flex:1;font-size:15px}
.orderBtns{display:flex;gap:6px}
.orderBtns button{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px;font-size:14px}
.orderBtns button:hover{border-color:var(--accent-blue)}
/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);overflow:hidden}
.term .scr{padding:10px 12px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.term .inRow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding:8px 12px}
.term .pr{color:var(--accent-green);white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;min-height:32px}
.term input:focus{outline:none}
.term input:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px;border-radius:4px}
.syntaxPanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxPanel .t{color:var(--accent-blue);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.syntaxPanel code{display:block;margin:3px 0}
/* ---------- branch ---------- */
.stepTag{display:inline-block;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-amber);border:1px solid var(--accent-amber);border-radius:6px;padding:2px 10px;margin-bottom:8px;letter-spacing:.05em}
.outcome{border:1px solid var(--border);border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:14.5px;color:var(--text-secondary)}
/* ---------- feedback ---------- */
.feedback{margin-top:16px}
.fbHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.fbLabel{font-size:15px}
.fbCredit{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary)}
.itemsList{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.itemsList li{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:14.5px}
.itemsList .ic{font-weight:700;flex-shrink:0}
.itemsList .note{color:var(--text-secondary);font-size:13.5px;display:block;margin-top:2px}
.explain{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;color:var(--text-primary);font-size:15px}
.explain .xh{color:var(--accent-amber);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.study{margin-top:8px;color:var(--text-secondary);font-size:14px}
.correctAnswerBox{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}
.hintPanel{border:1px solid var(--border);border-left:3px solid var(--accent-amber);background:var(--tint-amber-soft);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:14.5px;color:var(--text-primary)}
.hintPanel .h{color:var(--accent-amber);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
/* ---------- pause / review / results ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pauseCard{max-width:520px;text-align:center}
.pauseCard .big{font-size:20px;font-weight:700;margin:10px 0}
.skipList{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.skipRow{display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.skipRow .t{flex:1;font-size:15px}
.results .rGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.rCard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.rCard .n{font-size:24px;font-weight:800;display:block}
.rCard .w{color:var(--text-secondary);font-size:13px;display:flex;gap:6px;align-items:center}
.passPanel{border:1px solid var(--state-correct);background:var(--tint-green-panel);border-radius:10px;padding:18px;margin:14px 0;text-align:center}
.failPanel{border:1px solid var(--state-incorrect);background:var(--tint-red-panel);border-radius:10px;padding:18px;margin:14px 0;text-align:center}
.passPanel .big,.failPanel .big{font-size:26px;font-weight:800;letter-spacing:.04em}
.finalScore{font-family:var(--font-mono);font-size:18px;margin-top:6px}
.smallNote{color:var(--text-secondary);font-size:13px;margin-top:8px}
.centerRow{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.hidden{display:none!important}
.blurHide{filter:blur(9px);pointer-events:none;user-select:none}
.kv{color:var(--text-secondary);font-size:13.5px}
.identityRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
@media (max-width:640px){
  .hdr{gap:7px;padding:8px 10px}
  .hdr .score{margin-left:0;width:100%;order:9}
  .matchRow{grid-template-columns:1fr}
}
</style>

<body>
<div class="wrap">
  <div id="intro" aria-label="Intro screen"></div>
  <div id="hdr" class="hidden">
    <div class="hdr" role="banner" aria-label="Exam header">
      <span class="count" id="exCount">Exercise 1 of 1</span>
      <span class="badge extremely-hard" role="status" aria-label="Severity EXTREMELY HARD"><span aria-hidden="true">&#9679;</span> EXTREMELY HARD</span>
      <span class="timerBox" aria-label="Timer"><span id="tval">00:00</span><span id="tstate"></span></span>
      <span class="score" id="liveScore" aria-label="Live score"><b>0.0</b> / 0 &middot; 0%</span>
      <span class="stateChip st-skipped" id="skipChip" style="display:none" role="status"></span>
      <span class="stateChip st-skipped" id="whoChip" style="display:none"></span>
      <button type="button" class="hdrBtn" id="hintBtn" aria-label="Show hint (costs 10 percent of this exercise credit)">&#10068; Hint</button>
      <button type="button" class="hdrBtn" id="skipBtn" aria-label="Skip this exercise">&#9888; Skip</button>
    </div>
    <div class="progress" aria-hidden="true"><div class="fill" id="fill"></div></div>
  </div>
  <div id="exam" class="hidden">
    <div id="card"></div>
    <div class="centerRow" id="ctl"></div>
  </div>
  <div id="review" class="hidden"></div>
  <div id="results" class="hidden"></div>
</div>
<div class="overlay hidden" id="pauseOv" role="dialog" aria-modal="true" aria-label="Exam paused">
  <div class="card pauseCard">
    <span class="stateChip st-paused" style="font-size:16px">&#9208; PAUSED &#8212; manual</span>
    <div class="big">Timer stopped &#8212; exercise hidden</div>
    <p class="kv" id="pauseMsg"></p>
    <button type="button" class="btn" id="resumeBtn">&#9654; Resume</button>
  </div>

<script>
window.__EXAM_DATA__ = {"meta": {"topicId": "m1022", "batch": 4, "objectLine": "M1022 — Restrict File and Directory Permissions", "objectType": "Mitigation", "sevWord": "EXTREMELY HARD", "difficulty": "extremely-hard", "count": 16, "estimatedMinutes": 55, "timerSeconds": 3300}, "intro": {"title": "M1022 — EXTREMELY HARD practice exam", "learn": ["This practice exam trains MITRE ATT&CK mitigation M1022 — Restrict File and Directory Permissions — at EXTREMELY HARD level.", "These are senior-analyst decisions. Scenarios chain several concepts, mix realistic noise with missing information, and put real business cost on the table. Some correct answers are 'gather more evidence first'. Some widely repeated best practices are wrong here.", "The ATT&CK page behind every exercise is the M1022 mitigation: restrict file and directory permissions so adversaries cannot read sensitive files, plant code, tamper with services and logs, or abuse AI agents. The newest entries cover AI systems; the oldest cover sudoers and shell profiles. You will meet both.", "Expect artefact sets: ACL dumps, auditd records, change tickets, bucket policies, deploy-pipeline configs. Expect to justify which signal wins when two sources disagree, and which cost you are willing to accept.", "There is no shame in using the hint — it restates a constraint you may have missed. The terminal exercise is about safe configuration under pressure, never about attack commands."], "keywords": [{"theme": "Implementation Mechanics & Tooling", "items": ["chown + chmod evidence-safe configuration (terminal)", "Ownership groups for key material", "ACL reverts after evidence capture"]}, {"theme": "Techniques Addressed by M1022", "items": ["T1222.001 Windows Permissions (ACL tampering)", "T1222.002 Linux and Mac Permissions (sudoers chmod tampering)", "T1569.002 Service Execution", "T1685.006 Clear Linux or Mac System Logs", "T1685.001 — Windows event log file ACLs", "T1037.004 RC Scripts (rc.common)", "T1546.004 Unix Shell Configuration Modification", "T1556 Modify Authentication Process (SecurityAgentPlugins)", "T1543.001 Launch Agent", "T1547.013 XDG Autostart Entries", "T1055.009 Proc Memory", "T1563.001 SSH Hijacking", "T1553.003 SIP and Trust Provider Hijacking", "T1218.002 Control Panel items", "T1530 Data from Cloud Storage", "T1565.001/.003 Stored / Runtime Data Manipulation", "T1080 Taint Shared Content", "T1546.013 PowerShell Profile", "T1574.009 Unquoted Path (write side)", "T1098.004 SSH Authorized Keys"]}, {"theme": "Verification & Companion Controls", "items": ["FIM + SACL tuning", "Change-management correlation", "Access log review on cloud storage"]}, {"theme": "Trade-offs & Limitations", "items": ["Conflicting signals arbitration", "Evidence preservation before revert", "Accepted business cost (pipeline writes)", "Best-practice-wrong (chmod 000)", "Do-nothing-yet decision", "Honest limits of M1022"]}, {"theme": "Roles & Real-World Workflows", "items": ["Senior IR decision-making", "CISO escalation briefing", "Detection engineering follow-through"]}], "types": [{"name": "Multiple choice", "desc": "one question, one correct option; expect near-miss options."}, {"name": "Multi-select", "desc": "select two or more; wrong picks subtract credit."}, {"name": "Matching", "desc": "connect artefacts to techniques or verdicts."}, {"name": "Drag & drop", "desc": "sort actions into evidence-safe or destructive."}, {"name": "Fill in the blank", "desc": "pick the right words from a shuffled bank."}, {"name": "Ordering", "desc": "sequence a senior response workflow."}, {"name": "Decision scenario", "desc": "branch through steps; graded at the end."}, {"name": "Terminal simulation", "desc": "type the safe configuration command under time pressure."}]}, "exercises": [{"id": "X01", "type": "order", "summary": "Helpdesk admin, Everyone:F, and a beacon", "scenario": "You are the senior IR engineer on call. At 23:41 FIM recorded an ACL change on APP-SRV-05: the helpdesk user jmalley replaced the Users read+execute entry on C:\\Program Files\\BatchRunner\\ with Everyone:Full Control. Eleven minutes later the BatchRunnerSrv service — which runs as local system — spawned cmd.exe and curl.exe beaconing to 203[.]0[.]113[.]44. jmalley is a real employee, offboarding next Monday, no change ticket exists, and tier-1 helpdesk has no approved path into Program Files. The service is still running; the CISO wants a decision in ten minutes.", "artefacts": [{"label": "Artefact A — icacls delta on APP-SRV-05 (FIM diff, 23:41)", "kind": "log", "filter": true, "lines": ["  BEFORE:  BUILTIN\\Users:(OI)(CI)(RX)   SVC-APP01:(OI)(CI)(RX)   Administrators:(OI)(CI)(F)", "  AFTER:   BUILTIN\\Everyone:(OI)(CI)(F) SVC-APP01:(OI)(CI)(RX)   Administrators:(OI)(CI)(F)", "  path: C:\\Program Files\\BatchRunner\\", "  changed by: INTERACTIVE logon, user jmalley (helpdesk tier-1)"]}, {"label": "Artefact B — service event, APP-SRV-05 (23:52)", "kind": "log", "filter": false, "lines": ["Service Control Manager: service BatchRunnerSrv left running state", "Process create: parent services.exe -> child cmd.exe -> child curl.exe", "outbound: 203[.]0[.]113[.]44:443 (unknown host, first seen today)"]}, {"label": "Artefact C — HR note (incomplete information)", "kind": "text", "filter": false, "lines": ["jmalley: offboarding scheduled next Monday; badge still active tonight", "no change ticket references BatchRunner this week", "tier-1 helpdesk has no approved path to Program Files"]}], "question": "Order the response steps correctly.", "w": {"items": ["Freeze the evidence: icacls /save of the folder, memory capture of the service process, export FIM and service logs", "Stop the abuse path: revert the ACL to the approved baseline and quarantine the svc binary copy if hash-verified malicious", "Contain identity: disable jmalley's sessions and review every host where that account touched Program Files", "Recover and report: restore the service from a known-good binary, brief the CISO with technique IDs T1222.001 and T1569.002, and file the hardening gap"], "order": [0, 1, 2, 3]}, "explain": "The chain is explicit: T1222.001-style ACL tampering (Everyone:F) — under the T1222 File and Directory Permissions Modification parent row — created the write path; T1569.002-style service execution used it. Evidence first — reverting the ACL before capturing destroys the record of the tampering. Then remove the attack path (revert ACL, quarantine binary), then the identity (a tier-1 account with Program Files write and pending offboarding is itself an incident), and only then recovery plus the executive report. Killing the service first would alert the operator and lose volatile memory.", "hint": "You cannot revert what you have not saved. Which step captures before it changes anything?", "study": "You cannot revert what you have not saved. Which step captures before it changes anything?", "concepts": ["T1222.001 Windows Permissions (ACL tampering)", "T1569.002 Service Execution", "Evidence preservation before revert"]}, {"id": "X02", "type": "mc", "summary": "Two signals disagree — which wins?", "scenario": "Friday, 16:58. Your EDR raises high-severity: 'Event log service configuration changed; ACL on C:\\Windows\\system32\\Winevt\\Logs modified.' Simultaneously, change management shows CHG#8021 approved and active this window: 'Domain-wide GPO refresh including event log ACL baseline.' Both records were created at 16:41. A junior says: false positive, close it. An SE says: isolate all domain controllers.", "artefacts": [], "question": "Which decision is correct?", "w": {"options": ["Close as false positive — change management approved it, that is enough", "Isolate the domain controllers — event log ACL changes are always hostile", "Treat the GPO change as the leading explanation but verify scope: confirm the GPO link, the exact ACL delta, and that only expected .evtx ACLs changed — then close with the ticket reference", "Disable the GPO engine on all domain controllers until Monday"], "correct": 2}, "explain": "When two signals contradict, senior practice asks which source is authoritative for THIS change and what remains unverified. The M1022 page expects .evtx ACLs to be managed (limited legitimate access plus audit policies) — a GPO doing exactly that is routine. But 'approved' is not 'applied correctly': a GPO typo can lock out logging on hundreds of hosts. Verify the delta matches the ticket, then close with a reference. Blind trust and blanket isolation are both failures of judgement.", "hint": "Approval explains intent — what does it not explain? Verify that part.", "study": "Approval explains intent — what does it not explain? Verify that part.", "concepts": ["Change-management correlation", "T1685.001 — Windows event log file ACLs"]}, {"id": "X03", "type": "mc", "summary": "Do nothing yet — the single odd output", "scenario": "Tuesday morning triage. One host shows an icacls listing where a legacy folder carries an explicit Authenticated Users:(W) ACE. There is no FIM delta (FIM was deployed two weeks ago; the folder predates the baseline), no corresponding ticket, and the owner listed is a former employee. The user base of that host is three back-office clerks. Your lead asks whether to emergency-revert the ACL now.", "artefacts": [], "question": "What is the correct senior call?", "w": {"options": ["Emergency-revert now — any explicit non-baseline ACE is active compromise", "Gather more evidence first: check GPO RSoP history, older ACL backups, and enable a SACL (a system access control list — the audit setting on the file) — then decide whether this is drift or tampering", "Delete the folder — unknown provenance means hostile", "Reimage the host this evening and restore from last night's backup"], "correct": 1}, "explain": "The M1022 control exists to prevent abuse — but response discipline still applies: an unexplained ACE is a hypothesis, not a verdict. The ACE may be years of drift from a decommissioned installer. Reverting now destroys the artefact and teaches you nothing about how many other hosts drifted the same way; reimage is disproportionate for three clerks' file share. Scope first (GPO history, ACL backups, SACL from now on), then choose revert or baseline-adopt with documentation.", "hint": "Nothing shows the WHEN of this change. Which option buys you that knowledge cheaply?", "study": "Nothing shows the WHEN of this change. Which option buys you that knowledge cheaply?", "concepts": ["Do-nothing-yet decision", "Evidence preservation before revert"]}, {"id": "X04", "type": "mc", "summary": "Accepting a real cost — the pipeline", "scenario": "Your hardening plan removes direct developer write access to the build share (T1080 tainted-content risk) and routes all writes through the pipeline service account. The platform team's assessment lands: emergency hotfixes that today take 4 minutes will take 25 minutes through the pipeline, and release-day load will grow by roughly one engineer-hour. The CISO asks what you recommend.", "artefacts": [], "question": "Which recommendation correctly accepts a real cost?", "w": {"options": ["Skip the restriction — a 4-minute hotfix matters more than tainted content", "Apply the restriction and accept the measured cost: slower emergency hotfixes and extra release-day hours, with a quarterly review of whether the risk justifies the friction", "Apply the restriction but secretly leave one developer account with full write so hotfixes stay fast", "Move builds to developer laptops and share the artifacts over chat"], "correct": 1}, "explain": "Senior security work prices control friction honestly. The M1022 line for T1080 is 'protect shared folders by minimizing users who have write access' — the restriction is right, and its cost is real but small and measurable against a documented tampering risk. Option one inverts the risk calculus; option three is the worst kind of exception (silent, unaudited); option four multiplies the attack surface. Accept the cost, measure it, review it.", "hint": "Which option names the cost, keeps the control, and adds a review loop?", "study": "Which option names the cost, keeps the control, and adds a review loop?", "concepts": ["Accepted business cost (pipeline writes)", "T1080 Taint Shared Content", "Exception governance (time-boxed)"]}, {"id": "X05", "type": "mc", "summary": "Best practice goes wrong — the key file", "scenario": "A hardening auditor flags /var/opt/billing/keys/billing.pem (mode 644, owner appacct:appacct) as 'world-readable key material'. A well-meaning engineer proposes the 'most secure' fix: chmod 000 and chown root:root. The facts: the billing service user billingsvc reads this key at every transaction batch through its membership in the billingops group; the monthly rotation tool runs as root and rewrites the file; nobody else may touch it.", "artefacts": [], "question": "Which fix is correct?", "w": {"options": ["chmod 000 and chown root:root — nothing beats zero permissions for key material", "chown root:billingops plus chmod 640 — root owns and can rotate; the billingops group keeps read for the service; world access disappears", "chown billingsvc:billingsvc plus chmod 600 — the service keeps full control of its own key", "Move the key into the web root with 644 so monitoring tools can read it over HTTP"], "correct": 1}, "explain": "Root ownership plus a purpose-built group is the M1022 shape — the ATT&CK page demonstrates it directly with chmod 750 and chown root:admin on sensitive configuration. With root:billingops and mode 640: root can still rotate the key (the rotation tool runs as root), the billingops group keeps the read access that billingsvc needs for every batch, and world access disappears. Option one is the trap: 'most secure' here means an outage — with mode 000 the service cannot read the key and billing stops. Option three violates separation of duties: a service identity must not own what it should only read. Option four publishes the key. When a 'best practice' collides with operational reality, least privilege is engineered with owner and group — never copied blindly.", "hint": "Two actors need the file: root (rotate) and the service through its group (read). Which pair satisfies both without world access?", "study": "Two actors need the file: root (rotate) and the service through its group (read). Which pair satisfies both without world access?", "concepts": ["Best-practice-wrong (chmod 000)", "Ownership groups for key material"]}, {"id": "X06", "type": "terminal", "summary": "Terminal — key file lockdown, safely", "scenario": "Context: an overnight compliance scan reports /var/opt/billing/keys/billing.pem as world-readable (644). The billing service user billingsvc must keep reading this key through its billingops group membership; the monthly rotation tool runs as root; nobody else may touch it. You are in the change window with the compliance officer watching: the fix must not interrupt the service and must not destroy anything — the auditor needs evidence that access history stayed intact.", "artefacts": [], "question": "Type the commands that set the ownership and then the mode for that file.", "w": {"welcome": ["Ubuntu 22.04 LTS — host bill-app-01 — change window CHG#9134 (approved)", "evidence rule: no service interruption, no destructive operations", "note: billingsvc reads the key via billingops group membership; rotation runs as root", "current: -rw-r--r-- 1 appacct appacct 3244 billing.pem"], "prompt": "root@bill-app-01:~$ ", "elements": [{"re": "chown", "label": "Tool: chown", "why": "Ownership is the first half of the M1022 pattern (owner + group)."}, {"re": "root:billingops", "label": "Ownership: root:billingops", "why": "Root owns the key; the billingops group holds the service's read access."}, {"re": "/var/opt/billing/keys/billing\\.pem", "label": "Target: the key file", "why": "The reported file, exactly — not a wildcard sweep."}, {"re": "chmod", "label": "Tool: chmod", "why": "The mode change is the second half."}, {"re": "640", "label": "Mode: 640", "why": "Owner root read-write; group billingops read-only; others nothing."}], "dangerous": [{"re": "chmod\\s+0*000", "note": "Mode 000 locks out the service and the rotation group — an outage presented as hardening."}, {"re": "chmod\\s+0*777", "note": "777 is world-writable — the opposite of the finding's remedy."}, {"re": "\\brm\\b|\\bshred\\b|\\bmv\\b", "note": "Deleting, shredding or moving the key destroys evidence and breaks the service."}, {"re": "chown\\s+billingsvc:billingsvc", "note": "Letting the service own its own key violates separation of duties — near miss."}], "canonical": "chown root:billingops /var/opt/billing/keys/billing.pem && chmod 640 /var/opt/billing/keys/billing.pem", "parts": ["chown root:billingops <file> — root becomes owner (so the root-run rotation tool keeps working and nobody else controls the key), billingops becomes the group that holds the service's read access.", "chmod 640 <file> — owner root: read+write; group billingops: read; everyone else: nothing.", "&& chains the two so the mode is only applied after ownership succeeded.", "M1022's own example uses exactly this shape: chmod 750 / chown root:admin on sensitive configuration — here adapted to key material.", "A 000 mode or rm would 'fix' the finding by causing an outage or destroying evidence — both are the traps the compliance officer is watching for."], "output": ["changed ownership of '/var/opt/billing/keys/billing.pem' from appacct:appacct to root:billingops", "mode of '/var/opt/billing/keys/billing.pem' changed from 0644 to 0640"]}, "explain": "This is configuration under pressure: the safe compound command is ownership first, mode second. chmod 000 feels 'maximally secure' but is the classic best-practice trap — it causes an outage. rm/shred/mv destroy the evidence the auditor needs. The M1022 page demonstrates the same pattern with chown root:admin and chmod 750 on sensitive configuration.", "hint": "Ownership first, then mode. The service must keep reading — which mode digit keeps group read while removing world access?", "study": "Ownership first, then mode. The service must keep reading — which mode digit keeps group read while removing world access?", "concepts": ["chown + chmod evidence-safe configuration (terminal)", "Best-practice-wrong (chmod 000)"]}, {"id": "X07", "type": "match", "summary": "Linux/macOS hardening pair-up", "scenario": "The hardening review for the Unix estate produced four rows without mappings. As the senior engineer, connect each row to the technique its M1022 entry addresses.", "artefacts": [], "question": "Match each protected artefact to its technique.", "w": {"left": ["/var/log/auth.log and /var/log/syslog files", "The rc.common file on macOS", "A user's ~/.bash_profile and ~/.bashrc", "/Library/Security/SecurityAgentPlugins directory", "~/.ssh/authorized_keys hardening against root-level SSH takeover"], "right": ["T1685.006 — Clear Linux or Mac System Logs", "T1037.004 — RC Scripts", "T1546.004 — Unix Shell Configuration Modification", "T1556 — Modify Authentication Process", "T1563.001 — SSH Hijacking"], "answer": [0, 1, 2, 3, 4]}, "explain": "All five are direct M1022 entries: protect locally generated event files with proper permissions (T1685.006); only authorized users may edit rc.common (T1037.004); make shell profiles immutable and admin-only to block user-level persistence (T1546.004); restrict write access to SecurityAgentPlugins (T1556); and for SSH hijacking the page says ensure proper file permissions and harden the system to prevent root privilege escalation (T1563.001, under the T1563 Remote Service Session Hijacking parent row). Mixing these up in a briefing would send the platform team hardening the wrong files.", "hint": "One answer is about logs, one a macOS boot script, one shell startup, one the login window's plugin folder, one an SSH takeover.", "study": "One answer is about logs, one a macOS boot script, one shell startup, one the login window's plugin folder, one an SSH takeover.", "concepts": ["T1685.006 Clear Linux or Mac System Logs", "T1037.004 RC Scripts (rc.common)", "T1546.004 Unix Shell Configuration Modification", "T1556 Modify Authentication Process (SecurityAgentPlugins)"]}, {"id": "X08", "type": "multi", "summary": "Process memory files (T1055.009)", "scenario": "A red-team finding shows they read /proc/<pid>/mem of a privileged daemon from an unprivileged session on a legacy host, dumping secrets from process memory. The platform lead asks what M1022 prescribes.", "artefacts": [], "question": "Which two statements match the M1022 entry for Proc Memory?", "w": {"options": ["Restrict the permissions on sensitive files such as /proc/[pid]/maps and /proc/[pid]/mem", "These restrictions hinder reading another process's memory maps and memory content", "chmod 777 on /proc improves debugging and is the recommended baseline", "procfs permissions cannot be restricted on Linux at all"], "correct": [0, 1], "select": "Select the two correct statements."}, "explain": "The M1022 entry for T1055.009 (Proc Memory, under the T1055 Process Injection parent row) says exactly: 'Restrict the permissions on sensitive files such as /proc/[pid]/maps or /proc/[pid]/mem.' Doing so takes away the read side of memory dumping from unprivileged users. procfs restrictions (mount options such as hidepid, per-file permission tuning) are real; world-writable proc is the opposite of hardening; 'cannot be restricted' is simply false.", "hint": "Both correct answers restrict or explain the restriction of two specific proc files.", "study": "Both correct answers restrict or explain the restriction of two specific proc files.", "concepts": ["T1055.009 Proc Memory"]}, {"id": "X09", "type": "dragdrop", "summary": "Evidence-safe or destructive?", "scenario": "Night of the ACL-tampering incident. A stressed responder proposes six actions in the group chat. As the senior on call, sort them: which preserve the evidence chain, and which destroy evidence or state?", "artefacts": [], "question": "Sort each action into the right zone.", "w": {"zones": [{"id": "safe", "label": "Evidence-safe — do these"}, {"id": "dest", "label": "Destroys evidence or state — never now"}], "items": [{"t": "icacls /save of every altered folder", "z": "safe"}, {"t": "Copy the .evtx and FIM logs to the read-only evidence store", "z": "safe"}, {"t": "Export the ACL diff and hash it", "z": "safe"}, {"t": "Run chmod -R 000 on the affected directory tree to 'freeze' it", "z": "dest"}, {"t": "Delete the rogue scheduled-task files found in the startup folder", "z": "dest"}, {"t": "chown -R attacker-free defaults across the whole server", "z": "dest"}]}, "explain": "Preserve: ACL snapshots (icacls /save), log copies, and hashed diffs — all read-only operations that survive later analysis. Destroy: recursive mode changes rewrite the very ACLs you need as evidence (and 000 causes an outage), deleting the persistence files throws away the best artefacts, and a recursive chown rewrites ownership history across unrelated data. The M1022 workflow pairs preventive reverts with companion logging — but only after capture.", "hint": "Three actions only read and copy. Three actions rewrite or remove the things under investigation.", "study": "Three actions only read and copy. Three actions rewrite or remove the things under investigation.", "concepts": ["Evidence preservation before revert", "ACL reverts after evidence capture"]}, {"id": "X10", "type": "fill", "summary": "Launch Agent lockdown", "scenario": "You brief the macOS platform team. The M1022 entry for Launch Agents names a policy mechanism and a folder.", "artefacts": [], "question": "Complete the briefing sentence with the three missing pieces.", "w": {"template": "Set group {b1} to restrict file permissions to the ~/LaunchAgents folder; audit ownership with {b2}; and remember that every extra group with {b3} access there widens the persistence path.", "blanks": {"b1": ["policies"], "b2": ["ls -l"], "b3": ["write"]}, "bank": ["policies", "ls -l", "write", "firewalls", "netstat", "read"]}, "explain": "The M1022 entry for T1543.001 (Launch Agent) says: 'Set group policies to restrict file permissions to the ~/launchagents folder.' Policy (MDM/GPO-style management) makes it stick; ls -l is the everyday ownership/mode check; and the risk driver is WRITE access — a planted Launch Agent runs at user logon. Read access is normal for the loader; firewalls and netstat belong to other control families.", "hint": "One word is the management mechanism, one is a listing command, one is the dangerous access type.", "study": "One word is the management mechanism, one is a listing command, one is the dangerous access type.", "concepts": ["T1543.001 Launch Agent"]}, {"id": "X11", "type": "match", "summary": "Senior mapping — four more rows", "scenario": "The same hardening review, second batch. Connect each control action to the technique it blunts.", "artefacts": [], "question": "Match each action to its technique.", "w": {"left": ["Restrict write access to ~/.config/autostart entries", "Least privilege on important information resources so stored reports cannot be tampered with", "Restrict storage and execution of SIP DLLs to protected directories such as C:\\Windows", "Restrict storage and execution of Control Panel items to protected directories"], "right": ["T1547.013 — XDG Autostart Entries", "T1565.001 — Stored Data Manipulation", "T1553.003 — SIP and Trust Provider Hijacking", "T1218.002 — Control Panel items"], "answer": [0, 1, 2, 3]}, "explain": "Four more direct M1022 rows: restrict write on XDG autostart entries to privileged users (T1547.013); apply least privilege to important information resources against stored-data manipulation (T1565.001); keep SIP and trust-provider hijacking material out of user-writable directories (T1553.003); and keep Control Panel items in protected directories (T1218.002). A senior engineer carries these pairings so hardening tickets name the right technique IDs.", "hint": "One is a Linux autostart folder, one is stored data, one is SIP-related DLLs, one is .cpl files.", "study": "One is a Linux autostart folder, one is stored data, one is SIP-related DLLs, one is .cpl files.", "concepts": ["T1547.013 XDG Autostart Entries", "T1565.001 Stored Data Manipulation", "T1553.003 SIP and Trust Provider Hijacking", "T1218.002 Control Panel items"]}, {"id": "X12", "type": "order", "summary": "Cloud bucket exposure — order the response", "scenario": "Sunday 09:20. DLP flags client_list_full.csv sitting in the exports/ prefix of bucket reports-eu with public-read granted since Saturday 04:12 by the CI job nightly-agg (job #4182) — the job's pipeline config was changed on Friday and nobody reviewed the storage lines. Access logs show anonymous GETs of the file from two external IPs, then an internal analyst read. Legal is asking for the exposure window and whether credentials must be rotated.", "artefacts": [{"label": "Artefact A — bucket policy delta (storage account: reports-eu)", "kind": "log", "filter": false, "lines": ["2026-10-11 04:12  principal: svc-etl  change: public-read granted on prefix exports/", "2026-10-11 04:12  principal: svc-etl  source: CI job #4182 (pipeline: nightly-agg)", "2026-10-12 09:03  alert: DLP flagged 'client_list_full.csv' in exports/ (severity: high)"]}, {"label": "Artefact B — storage access logs (excerpt)", "kind": "log", "filter": true, "lines": ["04:12  GET  exports/client_list_full.csv  principal: anonymous  ip=198[.]51[.]100[.]77", "04:31  GET  exports/client_list_full.csv  principal: anonymous  ip=198[.]51[.]100[.]77", "05:19  GET  exports/client_list_full.csv  principal: anonymous  ip=203[.]0[.]113[.]201", "11:44  GET  exports/other_report.csv      principal: analyst-kd  ip=10[.]0[.]44[.]12 (internal)"]}], "question": "Order the response steps correctly.", "w": {"items": ["Revoke the public-read grant on exports/ and stop the pipeline job that applied it", "Pull the full access logs to bound the exposure window and enumerate every object and identity touched", "Rotate the exposed credentials and keys if logs show data beyond reports, and notify privacy/legal with the bounded window", "Fix the pipeline: storage ACL changes belong to the approved change process with least-privilege defaults and monitoring"], "order": [0, 1, 2, 3]}, "explain": "T1530's M1022 line is 'Use access control lists on storage systems and objects' — so containment starts by removing the bad ACL (the leak continues every minute it stays public) and stopping the job that would re-apply it. Only then do the access logs bound the window (here: public-read existed from 04:12 Saturday; logs show anonymous reads from 198[.]51[.]100[.]77 and 203[.]0[.]113[.]201) — incomplete logs are noise you must work around, not a reason to wait. Rotation and legal notification follow the evidence, and the durable fix is the pipeline governance: ACL changes through change control with least-privilege defaults.", "hint": "The leak is live until the ACL is revoked. Everything else can follow the evidence.", "study": "The leak is live until the ACL is revoked. Everything else can follow the evidence.", "concepts": ["T1530 Data from Cloud Storage", "Access log review on cloud storage", "CISO escalation briefing"]}, {"id": "X13", "type": "branch", "summary": "Decision — profile and startup folder tampering", "scenario": "Monday 08:10. FIM on FIN-WKS-041 (finance back office) shows two changes within three minutes: the user's PowerShell profile script was rewritten, and a new .lnk appeared in the user's Start Menu startup folder. The finance director is in the office and the quarter-close runs today; the workstation is in daily use. The user says they installed nothing. No other host shows deltas yet.", "artefacts": [], "question": "Choose your way through the three steps; the whole scenario i
