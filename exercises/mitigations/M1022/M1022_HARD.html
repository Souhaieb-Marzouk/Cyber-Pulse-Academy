<style>

  --tint-orange:rgba(255,138,61,.08); --tint-red:rgba(255,107,107,.08);
  --tint-grey:rgba(169,180,208,.08); --tint-purple:rgba(157,123,255,.10);

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);font-size:16px;line-height:1.55}

/* ---------- generic cards ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow-card)}

.bh-scenario{color:var(--accent-blue)}

.scenarioCard{background:linear-gradient(180deg,var(--grad-scen-top),var(--grad-scen-end)),var(--bg-surface)}

.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}

.themePanel{margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.rulesList{margin:8px 0 0 0;padding-left:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-green);color:var(--on-green);font-weight:700;font-size:16px;border:none;border-radius:8px;padding:12px 26px;cursor:pointer;min-height:44px}

.badge.easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber)}
.badge.hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange)}

.stateChip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;border-radius:6px;padding:3px 10px;border:1px solid var(--border)}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);background:var(--tint-green)}

.hdr{position:sticky;top:0;z-index:50;background:var(--hdr-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hdr .count{font-weight:700;font-size:15px}
.hdr .score{margin-left:auto;font-family:var(--font-mono);font-size:15px;color:var(--text-primary)}
.hdr .score b{font-size:16.5px}
.hdrBtn{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);border-radius:7px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.hdrBtn:hover{border-color:var(--accent-blue)}
.hdrBtn:disabled{opacity:.4;cursor:not-allowed}
.timerBox{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:var(--font-mono);font-size:15.5px;color:var(--text-primary)}
.timerBox .tstate{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.04em}
.progress{height:8px;background:var(--bg-surface-2);border-radius:4px;overflow:hidden;margin:12px 0 0 0;border:1px solid var(--border)}
.progress .fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-green));position:relative;transition:width .4s ease}
.progress .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--sheen) 50%,transparent 70%);animation:sheen 2.6s linear infinite}

.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .aLabel{display:block;font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-blue-soft)}
.artefact pre{margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);overflow-x:auto;white-space:pre}
.artefact .filterRow{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border)}
.artefact .filterRow input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:var(--font-mono);font-size:13.5px;padding:7px 10px;min-height:36px}
.artefact .filterRow .fHint{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.lg-key{color:var(--accent-blue)}
.lg-warn{color:var(--accent-amber)}
.lg-bad{color:var(--state-incorrect)}
.lg-ok{color:var(--state-correct)}

/* ---------- collapse ---------- */
.collapseBar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-size:13.5px;padding:9px 12px;cursor:pointer}
.collapseBar:hover{color:var(--text-primary);border-color:var(--accent-blue)}
.collapseBar .sum{flex:1}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text-primary);font-size:15.5px;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.opt:hover{background:var(--opt-hover);border-color:var(--accent-blue)}
.opt .k{font-family:var(--font-mono);font-weight:700;color:var(--text-secondary);flex-shrink:0}
.opt[aria-pressed="true"],.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 10px var(--glow-green)}
.opt:disabled,.ddItem:disabled{cursor:default;opacity:.85}
.opt[aria-pressed="true"] .selTag,.opt.selected .selTag{visibility:visible}
.opt .selTag{visibility:hidden;margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap}
/* ---------- match / fill ---------- */
.matchRow{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center;margin:8px 0}
.matchRow .lft{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px}
select.ansSelect{width:100%;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14.5px;padding:9px 10px;min-height:44px}
.fillText{font-size:15.5px;line-height:2}
.fillText select{margin:0 4px;min-width:150px;max-width:280px}
/* ---------- dragdrop ---------- */
.ddGrid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-top:6px}

.bankPanel,.zoneCol{display:flex;flex-direction:column;gap:8px}
.miniLabel{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.ddItem{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:14px;cursor:grab;color:var(--text-primary)}
.ddItem.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.ddItem .rm{background:none;border:none;color:var(--text-secondary);font-size:14px;cursor:pointer;padding:2px 4px;min-height:24px}

.zone .ph{color:var(--text-secondary);font-size:13px}
/* ---------- order ---------- */
.orderList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.orderRow{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.orderRow .pos{font-family:var(--font-mono);color:var(--accent-amber);font-weight:700;min-width:26px;text-align:center}
.orderRow .txt{flex:1;font-size:15px}
.orderBtns{display:flex;gap:6px}
.orderBtns button{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px;font-size:14px}
.orderBtns button:hover{border-color:var(--accent-blue)}
/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);overflow:hidden}
.term .scr{padding:10px 12px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.term .inRow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding:8px 12px}
.term .pr{color:var(--accent-green);white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;min-height:32px}

.term input:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px;border-radius:4px}
.syntaxPanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}

.stepTag{display:inline-block;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-amber);border:1px solid var(--accent-amber);border-radius:6px;padding:2px 10px;margin-bottom:8px;letter-spacing:.05em}
.outcome{border:1px solid var(--border);border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:14.5px;color:var(--text-secondary)}

.feedback{margin-top:16px}
.fbHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}

.fbCredit{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary)}
.itemsList{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}

.explain{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;color:var(--text-primary);font-size:15px}

.study{margin-top:8px;color:var(--text-secondary);font-size:14px}
.correctAnswerBox{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}
.hintPanel{border:1px solid var(--border);border-left:3px solid var(--accent-amber);background:var(--tint-amber-soft);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:14.5px;color:var(--text-primary)}
.hintPanel .h{color:var(--accent-amber);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}

.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pauseCard{max-width:520px;text-align:center}

.blurHide{filter:blur(9px);pointer-events:none;user-select:none}

  .hdr{gap:7px;padding:8px 10px}
  .hdr .score{margin-left:0;width:100%;order:9}
  .matchRow{grid-template-columns:1fr}
}

<div class="wrap">

      <span class="badge hard" role="status" aria-label="Severity HARD"><span aria-hidden="true">&#9679;</span> HARD</span>
      <span class="timerBox" aria-label="Timer"><span id="tval">00:00</span><span id="tstate"></span></span>
      <span class="score" id="liveScore" aria-label="Live score"><b>0.0</b> / 0 &middot; 0%</span>

</div>

<script>
window.__EXAM_DATA__ = {"meta": {"topicId": "m1022", "batch": 3, "objectLine": "M1022 — Restrict File and Directory Permissions", "objectType": "Mitigation", "sevWord": "HARD", "difficulty": "hard", "count": 17, "estimatedMinutes": 45, "timerSeconds": 2700}, "intro": {"title": "M1022 — HARD practice exam", "learn": ["This practice exam trains MITRE ATT&CK mitigation M1022 — Restrict File and Directory Permissions — at HARD level.", "You already know the basics: M1022 sets file system access controls so adversaries cannot read sensitive files, plant malicious code, or tamper with system files. At this level the scenarios are messier, like real on-call work.", "You will correlate artefacts: icacls dumps, auditd records, change tickets, AI-agent configs. You will feel near-miss answer options — several will look right, only one is right here. You will weigh trade-offs: hardening that breaks a legacy app, exceptions that need governance, fixes that could destroy evidence.", "This control is used daily by system administrators, detection engineers who verify nothing breaks logging, GRC analysts who govern exceptions, incident responders who check for ACL tampering, and red teamers who hunt weak ACLs. The newest entries on the ATT&CK page even cover AI systems: protecting agent instruction files from tampering.", "Hints here remove one wrong path, not more. Read every artefact panel before answering."], "keywords": [{"theme": "Implementation Mechanics & Tooling", "items": ["icacls hardening (terminal simulation)", "Inherited-ACE false comfort", "NTFS extended attributes (T1564.004)", ".evtx log file protection (T1685.001/.005)"]}, {"theme": "Techniques Addressed by M1022", "items": ["T1569.002 Service Execution (near-miss grants)", "T1574.004 Dylib Hijacking", "T1574.014 AppDomainManager", "T1070.009 Clear Persistence (and T1070.008 — same generated-event-file row)", "T1685.007 Impair Autonomous Defenses", "T1698 Indirect Prompt Injection", "T1700 AI-Enabled Exfiltration", "T1080 Taint Shared Content", "T1548.003 sudoers chmod attempt", "T1036.003 Rename Legitimate Utilities (System32 protection)", "Catalogue rows: T1037.002/.003, T1547.003, T1548.006, T1686.003, T1489, T1036.005"]}, {"theme": "Verification & Companion Controls", "items": ["auditd + change-ticket correlation", "audit policies on log files", "Coverage-gap analysis"]}, {"theme": "Trade-offs & Limitations", "items": ["Least-aggressive correct action", "Legacy-app trade-off", "Senior verdict triage — risk vs routine", "Exception governance (time-boxed)"]}, {"theme": "Roles & Real-World Workflows", "items": ["Change-management correlation", "Red-team finding triage"]}], "types": [{"name": "Multiple choice", "desc": "one question, one correct option; expect near-miss options."}, {"name": "Multi-select", "desc": "select two or more; wrong picks subtract credit."}, {"name": "Matching", "desc": "connect artefacts or techniques to their verdict or fix."}, {"name": "Drag & drop", "desc": "sort cards into the right zone."}, {"name": "Fill in the blank", "desc": "pick the right words from a shuffled bank."}, {"name": "Ordering", "desc": "sequence an incident-response workflow."}, {"name": "Decision scenario", "desc": "branch through steps; graded at the end."}, {"name": "Terminal simulation", "desc": "type the real hardening command in a fake shell."}]}, "exercises": [{"id": "H01", "type": "multi", "summary": "Coverage-gap analysis from the register", "scenario": "The CISO asks: 'Our threat plan targets four techniques this quarter. Where are the file-permission gaps?' You compare the control register with the target list.", "artefacts": [{"label": "Control register — file-permission controls in place", "kind": "text", "filter": false, "lines": ["CTRL-01  GPO: .evtx files at C:\\Windows\\system32\\Winevt\\Logs — ACL locked, audit policy on      [covers T1685.001, T1685.005]", "CTRL-02  Service folders: SVC-* accounts RX only, Administrators F, inheritance blocked           [covers T1569.002, T1574.010]", "CTRL-03  authorized_keys: owner-only write, root-owned home dirs                                   [covers T1098.004]", "CTRL-04  Shares: anonymous access disabled everywhere                                              [covers T1552.001 (share part)]", "CTRL-05  --- no control registered for private key folders ---", "CTRL-06  --- no control registered for systemd unit/timer files ---"]}], "question": "Which two target techniques are NOT yet covered by any registered control?", "w": {"options": ["T1552.004 — Private Keys", "T1543.002 — Systemd Service (and .timer files, T1053.006)", "T1685.005 — Clear Windows Event Logs", "T1098.004 — SSH Authorized Keys"], "correct": [0, 1], "select": "Select the two uncovered techniques."}, "explain": "CTRL-05 and CTRL-06 literally mark the gaps: nothing covers private key folders (T1552.004) and nothing covers systemd unit/timer files (T1543.002 / T1053.006 — the system-process row family under the T1543 Create or Modify System Process parent row). T1685.005 is covered by CTRL-01 (.evtx ACL + audit policy), and T1098.004 by CTRL-03. Next best controls: M1022 says set proper permissions on folders holding private keys, and restrict read/write on systemd unit and .timer files to privileged users. Coverage-gap work like this is a monthly detection-engineering / hardening routine.", "hint": "Read the register comments in brackets and match them against the four target techniques.", "study": "Read the register comments in brackets and match them against the four target techniques.", "concepts": ["Coverage-gap analysis", "T1552.004 Private Keys (gap)", "T1543.002 Systemd Service (gap)"]}, {"id": "H02", "type": "terminal", "summary": "Terminal — harden the service folder", "scenario": "The red team reported that C:\\Program Files\\OpsTools inherits broad rights from C:\\Program Files, and the OpsTools service (account SVC-OPSTOOLS) runs its binary from there. You are on the hardening console. Goal: stop inheritance, give the service account only read+execute, keep administrators in full control of the folder and its children.", "artefacts": [], "question": "Type the single icacls command that achieves this.", "w": {"welcome": ["Microsoft Windows [Version 10.0.19045]", "hardening console — host APP-SRV-02 — session: change CHG#7719 approved", "Working folder: C:\\Program Files"], "prompt": "PS C:\\Program Files> ", "elements": [{"re": "^icacls", "label": "Tool: icacls", "why": "icacls is the Windows ACL editor named by M1022."}, {"re": "program files\\\\opstools", "label": "Target: C:\\Program Files\\OpsTools", "why": "The folder reported by the red team."}, {"re": "/inheritance:r", "label": "Flag: /inheritance:r", "why": "Removes inherited ACEs so broad parent rights stop applying."}, {"re": "svc-opstools:.*rx", "label": "Grant: SVC-OPSTOOLS read+execute", "why": "Least privilege for the service account (RX)."}, {"re": "administrators:.*f", "label": "Grant: Administrators full control", "why": "Keeps the folder manageable by admins."}], "dangerous": [{"re": "/reset", "note": "icacls /reset re-applies inherited permissions — it would undo your hardening, not do it."}, {"re": "everyone:", "note": "Granting anything to Everyone widens access; M1022 removes such grants."}, {"re": "\\b(del|rd|remove-item)\\b", "note": "Deleting the folder or its contents is destructive — wrong operation for hardening."}], "canonical": "icacls \"C:\\Program Files\\OpsTools\" /inheritance:r /grant:r \"SVC-OPSTOOLS:(OI)(CI)(RX)\" \"BUILTIN\\Administrators:(OI)(CI)F\"", "parts": ["icacls — the Windows command-line ACL editor (the M1022 tool for NTFS).", "\"C:\\Program Files\\OpsTools\" — the reported folder holding the service binary.", "/inheritance:r — removes inherited permissions, so the broad C:\\Program Files grants stop flowing in.", "/grant:r \"SVC-OPSTOOLS:(OI)(CI)(RX)\" — replaces (r) the service account's rights with read+execute, inherited to objects and containers.", "\"BUILTIN\\Administrators:(OI)(CI)F\" — administrators keep full control so the folder stays manageable."], "output": ["processed file: C:\\Program Files\\OpsTools", "Successfully processed 1 files; Effective rights changed for 2 principals"]}, "explain": "HARD grading: every required element counts. icacls is the tool; /inheritance:r cuts the parent rights; the two /grant:r entries rebuild a least-privilege ACL. A /reset here would silently restore the inherited broad ACEs — a dangerous near miss. The M1022 pattern for service binaries (T1569.002) is exactly this: high-permission service binaries must not be replaceable by lower-privileged users.", "hint": "This is not a detection problem. You need one command that cuts inheritance AND rebuilds grants in the same run.", "study": "This is not a detection problem. You need one command that cuts inheritance AND rebuilds grants in the same run.", "concepts": ["icacls hardening (terminal simulation)", "T1569.002 Service Execution"]}, {"id": "H03", "type": "mc", "summary": "The least aggressive correct fix", "scenario": "C:\\Legacy\\Ledger hosts a 15-year-old accounting app. Tightening the folder's ACLs broke the app: it rewrites its own config at every start. Accounting needs it running today. The scanner finding is real: Users have write on the folder and the app runs as a service.", "artefacts": [], "question": "Which action do you take?", "w": {"options": ["Restore the original broad ACL and close the finding as a false positive", "Keep the broad ACL but write a permanent exception so nobody reopens the case", "Revert today to keep accounting running; tomorrow re-tighten everything except the single config file the app rewrites, with a time-boxed, documented exception", "Uninstall the accounting app and tell the business to stop invoicing until a replacement is bought"], "correct": 2}, "explain": "HARD trap: the correct action is the least aggressive one that still removes most of the risk. Option one ignores a real finding; option two hides it; option four is disproportionate. Real hardening keeps the app working while shrinking the writable surface to the one file that truly needs writes — and records the deviation with an owner and review date. The M1022 idea survives contact with reality through scoped exceptions, not all-or-nothing choices.", "hint": "Two options overreact and two underreact. Which one fixes most of the risk while keeping the app alive?", "study": "Two options overreact and two underreact. Which one fixes most of the risk while keeping the app alive?", "concepts": ["Legacy-app trade-off", "Least-aggressive correct action", "Exception governance (time-boxed)"]}, {"id": "H04", "type": "multi", "summary": "Inherited-ACE false comfort", "scenario": "A junior analyst reviews the nested folder C:\\Data\\Finance\\Q3 and reports: 'No explicit ACEs here, so this folder is locked down.' The icacls output shows the effective ACEs are all marked (I) — inherited from C:\\Data, where the entry Users:(OI)(CI)(W) exists.", "artefacts": [], "question": "Which two actions genuinely remove the inherited Users-write on the Q3 folder?", "w": {"options": ["Run icacls with /inheritance:r on Q3 and re-grant exactly the rights that folder needs", "Remove the Users:(W) ACE at C:\\Data so children stop inheriting it", "Change the NTFS owner of Q3 to the administrators group", "Rename Q3 to a hidden name ending in $"], "correct": [0, 1], "select": "Select the two effective actions."}, "explain": "Inherited ACEs are real permissions — 'no explicit ACEs' is the classic false comfort. Either block inheritance on the child and rebuild a minimal ACL, or fix the source: removing Users:(W) at C:\\Data propagates the fix to every child. Changing the owner changes who can change ACLs, not who can write files. A hidden name is masquerading, not access control — anything hidden this way stays writable. This sits in the M1022 lane because ACL inheritance management is file permission hygiene.", "hint": "One answer edits the child, the other edits the parent. Two answers change neither layer's write right.", "study": "One answer edits the child, the other edits the parent. Two answers change neither layer's write right.", "concepts": ["Inherited-ACE false comfort", "icacls output reading"]}, {"id": "H05", "type": "mc", "summary": "Alarming alert, approved change", "scenario": "02:00 — the SOC alert fires: 'ACL modified on C:\\Finance\\Close'. The modifier is the enterprise admin account SVC-GPO-DEPLOY. The on-call analyst wants to isolate the file server immediately.", "artefacts": [], "question": "What is the correct next step?", "w": {"options": ["Isolate the file server from the network at once — the alert means compromise", "Revert the ACL immediately and restart the server", "Correlate with change management first: an approved GPO deployment window is active; verify the ticket and the GPO scope before acting", "Delete the GPO deployment account to stop the attacker"], "correct": 2}, "explain": "HARD trap: this looks alarming but is benign — IF the correlation confirms it. An ACL change at 02:00 by an account named GPO-DEPLOY during a documented change window is a routine GPO-driven ACL rollout. Isolation would take branch-office file servers offline for nothing; reverting fights your own change process. Verification first, action second — that is the discipline M1022 operations require, and why audit records for permission changes matter.", "hint": "There is a second system that knows about planned changes. Check it before you pull a cable.", "study": "There is a second system that knows about planned changes. Check it before you pull a cable.", "concepts": ["Change-management correlation", "auditd / Event Viewer auditing"]}, {"id": "H06", "type": "mc", "summary": "Log-viewer triage — which line is the intrusion?", "scenario": "You triage an auditd excerpt from lin-app-03. Most lines are routine. One line shows an unauthorized permission change consistent with tampering that M1022 should have prevented.", "artefacts": [{"label": "auditd excerpt — host lin-app-03 (with filter)", "kind": "log", "filter": true, "lines": ["type=USER_AUTH msg=audit(11:02:11) pid=812  uid=1001 : success login session opened", "type=SYSCALL msg=audit(11:04:32) pid=905  uid=1001 : name=/var/log/syslog syscall=open read=yes", "type=SYSCALL msg=audit(09:14:07) pid=441  uid=0    : name=/etc/sudoers syscall=chmod mode=0777 op=O_TRUNC", "type=USER_CMD msg=audit(11:07:58) pid=933  uid=1001 : cmd=sudo systemctl restart app-svc granted=yes", "type=PATH msg=audit(11:09:01) pid=905  uid=1001 : name=/home/jwilde/.bashrc item=1 nametype=NORMAL", "type=SYSCALL msg=audit(12:22:45) pid=1102 uid=0    : name=/etc/sudoers syscall=chmod mode=0440 op=config"]}], "question": "Which record shows the unauthorized permission change?", "w": {"options": ["The chmod on /etc/sudoers setting mode 0777 executed by uid 0 at 09:14 — outside any change window", "The open of /var/log/syslog with read=yes", "The successful sudo restart of app-svc", "The chmod on /etc/sudoers setting mode 0440 at 12:22"], "correct": 0}, "explain": "The 09:14 record is uid 0 setting the sudoers file to 0777 — world-writable, outside the change window: a direct T1548.003 enabling move (and T1222.002-style permission modification). The 12:22 chmod 0440 is the compliant fix (root-owned, 0440 is the sudoers standard). Reads of syslog and a granted sudo restart are routine noise — the false-positive profile you must learn to skip. Use the filter box on the artefact to isolate the syscall records.", "hint": "Two sudoers lines exist. Which mode value and which time window is compliant?", "study": "Two sudoers lines exist. Which mode value and which time window is compliant?", "concepts": ["auditd + change-ticket correlation", "T1548.003 sudoers chmod attempt"]}, {"id": "H07", "type": "match", "summary": "AI-era mappings", "scenario": "Your organisation runs an AI analysis platform with file access to case data. The threat lead asks you to map four artefacts to the ATT&CK techniques that M1022 addresses for AI systems and logging.", "artefacts": [], "question": "Match each artefact to the technique its protection addresses.", "w": {"left": ["AI agent configuration and instruction files", "Content store the AI agent may act on after reading emails", "Folder of exported case files the AI can read", ".evtx log files on every endpoint"], "right": ["T1685.007 — Impair Autonomous Defenses", "T1698 — Indirect Prompt Injection", "T1700 — AI-Enabled Exfiltration", "T1685.001 — Disable or Modify Windows Event Log"], "answer": [0, 1, 2, 3]}, "explain": "Straight from the current M1022 page: limit AI-assisted analysis systems to required files and stop artifacts under investigation from modifying agent configuration, instruction files, analysis state (T1685.007). Restrict AI agents to approved files/repositories and limit write separately from read, reducing post-injection actions (T1698). Restrict file permissions to limit exposure of sensitive data to AI agents (T1700). And .evtx files at C:\\Windows\\system32\\Winevt\\Logs need limited legitimate access plus audit policies (T1685.001, under the T1685 Disable or Modify Tools parent row). These are the newest entries — many teams have never mapped them.", "hint": "Two answers are AI-specific, one is about what an agent can be tricked into doing, one is the classic log file.", "study": "Two answers are AI-specific, one is about what an agent can be tricked into doing, one is the classic log file.", "concepts": ["T1685.007 Impair Autonomous Defenses", "T1698 Indirect Prompt Injection", "T1700 AI-Enabled Exfiltration", "T1685.001 — Windows event log file ACLs"]}, {"id": "H08", "type": "fill", "summary": "AppDomainManager hardening sentence", "scenario": "You write the .NET section of the baseline. The M1022 page has one entry for AppDomainManager (T1574.014).", "artefacts": [], "question": "Complete the sentence with the three missing words.", "w": {"template": "Install .NET applications in {b1} locations and set directory access controls to prevent file {b2} to the search paths for .NET {b3}.", "blanks": {"b1": ["write-protected"], "b2": ["writes"], "b3": ["applications"]}, "bank": ["write-protected", "writes", "applications", "temporary", "reads", "browsers"]}, "explain": "The M1022 entry for T1574.014 (AppDomainManager) prescribes exactly this: write-protected install locations and directory access controls that block writes into .NET search paths — both the app folders and the standard resources folders. If a user-writable directory sits in the search path, a planted assembly can be loaded into a privileged .NET process. Temporary locations, read-only requirements, and browsers are the distractors.", "hint": "The three answers: how to install, what to prevent, and what the search paths belong to.", "study": "The three answers: how to install, what to prevent, and what the search paths belong to.", "concepts": ["T1574.014 AppDomainManager"]}, {"id": "H09", "type": "order", "summary": "Response order — suspected ACL tampering", "scenario": "Night shift: FIM flags that the ACL of C:\\Ops\\Runners changed two hours ago. Nobody has claimed it. The service account still runs, no other alerts fired. Your incident manager asks for the correct sequence.", "artefacts": [], "question": "Order the response steps correctly.", "w": {"items": ["Save the current ACLs as evidence (icacls /save) and snapshot the audit trail", "Compare against the approved baseline to scope what exactly changed", "Revert the unauthorized grants and rotate the affected service credentials", "Add SACL auditing on the path and report the gap to the hardening backlog"], "order": [0, 1, 2, 3]}, "explain": "Evidence before repair: reverting first destroys the very ACEs you need for forensics (who added what). So: capture, scope, then revert and rotate, then harden detection and file the follow-up. This ordering also matches how the M1022 page splits duties — permissions are the control, auditing is the companion that makes this workflow possible at all. Killing the service or reimaging would be disproportionate: the blast radius is one folder.", "hint": "You cannot compare what you did not save, and you cannot save what you already reverted.", "study": "You cannot compare what you did not save, and you cannot save what you already reverted.", "concepts": ["Change-management correlation", "icacls output reading", "auditd / Event Viewer auditing"]}, {"id": "H10", "type": "dragdrop", "summary": "M1022 fixes it — or not?", "scenario": "Red-team debrief: the lead lists six observations. Your job: which observations are addressable with file and directory permissions, and which need a different control family?", "artefacts": [], "question": "Sort each observation into the right zone.", "w": {"zones": [{"id": "fix", "label": "Addressable with file permissions (M1022)"}, {"id": "other", "label": "Needs a different control"}], "items": [{"t": "Writable dylib search folders on macOS (T1574.004)", "z": "fix"}, {"t": "Users can drop .cpl items outside protected directories (T1218.002 family)", "z": "fix"}, {"t": "C2 domain resolved through DNS every hour", "z": "other"}, {"t": "Service accounts with passwords never rotated", "z": "other"}, {"t": "World-writable build-share seeding rogue installers (T1080)", "z": "fix"}, {"t": "Renamed copy of a legit tool planted in C:\\Windows\\System32 (T1036.003)", "z": "fix"}, {"t": "Database reachable from the internet with default credentials", "z": "other"}]}, "explain": "File permissions address the writable-location problems: dylib search paths (M1022 says block writes to app and standard dylib folders), Control Panel item storage (restrict to protected directories such as C:\\Windows), the tainted shared content on the build share (minimize write access), and masquerading stock (protect System32 itself so renamed legitimate tools cannot be planted there). DNS-based C2 needs egress/DNS controls, credential rotation is privileged account management, and the database exposure is network segmentation plus identity hygiene — none of those are file permission fixes. A recurring red-team debrief task is exactly this sorting.", "hint": "Four answers are about who can write where. Three are network, identity, or credential problems.", "study": "Four answers are about who can write where. Three are network, identity, or credential problems.", "concepts": ["T1574.004 Dylib Hijacking", "T1080 Taint Shared Content", "T1218.002 Control Panel items", "T1036.003 Rename Legitimate Utilities"]}, {"id": "H11", "type": "multi", "summary": "AI agent access design", "scenario": "You review the AI analyst agent's permissions. It currently runs with a full-disk service identity. The platform team wants it 'just restricted a bit'.", "artefacts": [], "question": "Which two actions match the M1022 guidance for AI agents?", "w": {"options": ["Restrict the agent to only the files, directories, and repositories required for its approved workflows", "Limit write access separately from read access where possible", "Grant the agent administrator rights so it can finish analyses faster", "Store the agent's outputs in a world-writable share so anyone can improve them"], "correct": [0, 1], "select": "Select the two correct actions."}, "explain": "The M1022 entry for T1698 (Indirect Prompt Injection) is explicit: restrict AI agents to the files and stores required for approved workflows, and split write from read so a successful injection has fewer actions available. T1700 adds: restrict file permissions to limit sensitive data exposure to agents. Full-disk identities and world-writable output shares do the exact opposite — they are the 'best practice is wrong here' traps.", "hint": "Both correct answers reduce what the agent can touch. Both wrong answers widen it.", "study": "Both correct answers reduce what the agent can touch. Both wrong answers widen it.", "concepts": ["T1698 Indirect Prompt Injection", "T1700 AI-Enabled Exfiltration"]}, {"id": "H12", "type": "mc", "summary": ".evtx protection — the pairing", "scenario": "You harden the event log files. The M1022 page entry for disabling/clearing Windows event logs mentions two things to put in place together for the .evtx files.", "artefacts": [], "question": "Which pair does the page prescribe for .evtx files?", "w": {"options": ["Proper file permissions for limited, legitimate access — plus audit policies for detection", "Full-disk encryption — plus weekly reboots", "Read access for Everyone — plus compression", "Ownership by every admin — plus daily deletion jobs"], "correct": 0}, "explain": "The page is precise: .evtx files located at C:\\Windows\\system32\\Winevt\\Logs should have 'proper file permissions for limited, legitimate access and audit policies for detection'. Permissions alone cannot tell you who TRIED to clear the log — the SACL does that. Daily deletion jobs and Everyone-read actively destroy the control. This pairing (preventive ACL + detective audit) is the same pattern as the whole M1022 object, and the same generated-event-file row — under the T1070 Indicator Removal parent row — covers T1070.008 (Clear Mailbox Data) and T1070.009 (Clear Persistence) — the files an adversary would touch while hiding those actions.", "hint": "One answer is the preventive+detective pair. The others weaken or delete evidence.", "study": "One answer is the preventive+detective pair. The others weaken or delete evidence.", "concepts": ["T1685.001 — Windows event log file ACLs", "audit policies on log files", "T1070.008 Clear Mailbox Data (same row)", "T1070.009 Clear Persistence (same row)"]}, {"id": "H13", "type": "branch", "summary": "Decision — the build share", "scenario": "The intranet build share is writeable by all developers; last month a rogue installer was planted there and three machines ran it (Taint Shared Content, T1080). The pipeline owner warns that any write restriction may slow emergency hotfixes.", "artefacts": [], "question": "Choose your way through the three steps; the whole scenario is graded at the end.", "w": {"steps": [{"prompt": "What do you verify first?", "options": [{"t": "Who actually holds write on the share today, and which accounts the pipeline really needs", "outcome": "You now know the true write population — usually far smaller than assumed.", "ok": true}, {"t": "Make the share read-only for everyone immediately", "outcome": "Builds break everywhere. Destructive overreach without scoping.", "ok": false}, {"t": "Wait for the next incident to justify a change", "outcome": "A known tainted-content path stays open by choice.", "ok": false}]}, {"prompt": "What is the right control design?", "options": [{"t": "Writes only via the pipeline service account and a small release group; all other developers read-only", "outcome": "Least privilege on the share — M1022's 'minimize users who have write access'.", "ok": true}, {"t": "Keep Everyone-write but add a banner telling devs to be careful", "outcome": "A banner is not an access control.", "ok": false}, {"t": "Move the share to a personal USB drive rotation", "outcome": "That is a step backwards in every control family.", "ok": false}]}, {"prompt": "How do you keep visibility while the new model settles?", "options": [{"t": "FIM on the share content plus weekly review of write-denied attempts", "outcome": "Detective companion catches outliers while prevention does its job.", "ok": true}, {"t": "No monitoring — permissions make monitoring redundant", "outcome": "Preventive and detective are different jobs; you just blinded yourself.", "ok": false}, {"t": "Alert on every file read by anyone", "outcome": "Unusable noise; reads are the normal case on a share.", "ok": false}]}]}, "explain": "This mirrors a real detection-engineering rollout: scope the write population, design least-privilege writes through a service account, and keep a tuned detective eye while it settles. The business cost (slower emergency hotfixes) is accepted deliberately and reviewed — not ignored and not overblown. M1022's line for T1080 is the design: 'Protect shared folders by minimizing users who have write access.'", "hint": "Verify first, then narrow writes, then keep one detective control — not zero, not a firehose.", "study": "Verify first, then narrow writes, then keep one detective control — not zero, not a firehose.", "concepts": ["T1080 Taint Shared Content", "Least-aggressive correct action", "FIM as detective companion"]}, {"id": "H14", "type": "mc", "summary": "Exception governance", "scenario": "A migration project needs a broad grant on C:\\Exchange\\Staging for six weeks. The project manager asks how to record it.", "artefacts": [], "question": "What is the correct way to govern this exception?", "w": {"options": ["Make the change silently — it is temporary anyway", "Time-boxed exception with a named owner, compensating monitoring, an expiry date, and a review entry in the risk register", "A permanent exception so future audits do not flag it again", "A note on the team's internal chat channel"], "correct": 1}, "explain": "Exceptions are normal; ungoverned exceptions are findings. A time-boxed, owned, monitored, expiry-dated record in the risk register is what an auditor accepts — and it is what lets M1022 stay credible as a control instead of eroding into 'broad ACLs with stories'. Silent changes and chat notes leave no trail; permanent exceptions defeat the baseline.", "hint": "Good governance has four ingredients: owner, monitoring, expiry, and a register entry.", "study": "Good governance has four ingredients: owner, monitoring, expiry, and a register entry.", "concepts": ["Exception governance (time-boxed)", "Control owner evidence & baseline"]}, {"id": "H15", "type": "match", "summary": "Verdict matching — risk or routine?", "scenario": "Six review items landed on your desk. For each artefact, give the verdict a senior
