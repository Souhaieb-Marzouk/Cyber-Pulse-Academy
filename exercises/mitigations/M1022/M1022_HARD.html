<script>

(function(){
'use strict';
var D = window.__EXAM_DATA__;
var META = D.meta, INTRO = D.intro, EXS = D.exercises;
var $ = function(s,r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

var state = {
  phase:'intro', ex:[], idx:0, answered:{}, creditSum:0, skippedIds:[], hintUsed:{},
  timerState:'RUNNING', remain:META.timerSeconds, iv:null, pendingFeedback:false,
  manualPrev:null, reviewBack:false, attemptDone:false, learner:null,
  tManual:0, tAuto:0
};

function shuffle(a){ var x=a.slice(),i,j,t; for(i=x.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=x[i]; x[i]=x[j]; x[j]=t; } return x; }

/* ---------------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------------- */
function setTimerState(s){
  state.timerState = s;
  var el = $('#tstate'); if(!el) return;
  var icon='&#9654;', word='RUNNING', cls='st-info';
  if(s==='PAUSED_MANUAL'){ icon='&#9208;'; word='PAUSED \u2014 manual (press Resume)'; cls='st-paused'; }
  else if(s==='PAUSED_AUTO_CHECK'){ icon='&#9208;'; word='PAUSED \u2014 reviewing feedback (resumes on Next)'; cls='st-paused'; }
  else if(s==='ENDED'){ icon='&#9632;'; word='ENDED'; cls='st-skipped'; }
  el.innerHTML = '<span class="stateChip '+cls+'" role="status" aria-label="Timer '+esc(word)+'">'+icon+' <span class="tstate">'+esc(word)+'</span></span>';
}
function fmt(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function renderTime(){ var t=$('#tval'); if(t) t.textContent = fmt(state.remain); }
function tick(){
  if(state.timerState==='PAUSED_MANUAL'){ state.tManual += 1; return; }
  if(state.timerState==='PAUSED_AUTO_CHECK'){ state.tAuto += 1; return; }
  if(state.timerState!=='RUNNING'){ return; }
  state.remain -= 1; renderTime();
  if(state.remain<=0){ state.remain=0; renderTime(); timeEnded(); }
}
function startTimer(){ setTimerState(state.remain>0 ? 'RUNNING' : 'ENDED'); }
function timeEnded(){
  setTimerState('ENDED');
  if(state.iv){ clearInterval(state.iv); state.iv=null; }
  finishExam(true);
}

/* ---------------- header ---------------- */
function renderHeader(){
  var c=$('#exCount');
  if(c){
    if(state.phase==='review'){ c.textContent='Review \u2014 skipped exercises'; }
    else if(state.phase==='results'){ c.textContent='Results'; }
    else { c.textContent='Exercise '+ (state.idx+1) +' of '+ state.ex.length; }
  }
  var s=$('#liveScore');
  var answered=Object.keys(state.answered).length;
  var pct = answered>0 ? Math.round((state.creditSum/answered)*100) : 0;
  if(s) s.innerHTML = '<b>'+state.creditSum.toFixed(1)+'</b> / '+answered+' &middot; '+pct+'%';
  var sk=$('#skipChip');
  if(sk){ sk.textContent='\u26A0 Skipped: '+state.skippedIds.length; sk.style.display = state.skippedIds.length? 'inline-flex':'none'; }
  var fill=$('#fill'); if(fill) fill.style.width = Math.round((answered/state.ex.length)*100)+'%';
  var inExam = (state.phase==='exam');
  var hb=$('#hintBtn'), sb=$('#skipBtn');
  if(hb) hb.disabled = !inExam || state.pendingFeedback || !!(state.ex[state.idx] && state.hintUsed[state.ex[state.idx].id]);
  if(sb) sb.disabled = !inExam || state.pendingFeedback;
}

/* ---------------- intro ---------------- */
function sevBadge(){
  return '<span class="badge '+META.difficulty+'" role="status" aria-label="Severity '+esc(META.sevWord)+'"><span aria-hidden="true">&#9679;</span> '+esc(META.sevWord)+'</span>';
}
function renderIntro(){
  var el=$('#intro');
  var learn = INTRO.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var themes = INTRO.keywords.map(function(th){
    return '<div class="themePanel"><h4>'+esc(th.theme)+'</h4><div class="chips">'+ th.items.map(function(i){ return '<span class="chip">'+esc(i)+'</span>'; }).join('') +'</div></div>';
  }).join('');
  var types = INTRO.types.map(function(t){ return '<li><b>'+esc(t.name)+'</b> \u2014 '+esc(t.desc)+'</li>'; }).join('');
  el.innerHTML =
    '<div class="card" role="region" aria-label="Exam facts">'+
      '<h1 style="margin:0;font-size:22px">'+esc(INTRO.title)+'</h1>'+
      '<div class="identityRow">'+sevBadge()+'<span class="kv">'+esc(META.objectLine)+'</span><span class="kv">'+META.count+' exercises &middot; '+META.estimatedMinutes+' min estimated &middot; timer budget '+fmt(META.timerSeconds)+' &middot; pass mark 70%</span></div>'+
      '<div class="factGrid">'+
        '<div class="fact"><span class="k">ATT&amp;CK object</span><span class="v">'+esc(META.objectLine)+'</span></div>'+
        '<div class="fact"><span class="k">Object type</span><span class="v">'+esc(META.objectType)+'</span></div>'+
        '<div class="fact"><span class="k">Exercises in this exam</span><span class="v">'+META.count+'</span></div>'+
        '<div class="fact"><span class="k">Timer budget</span><span class="v">'+fmt(META.timerSeconds)+'</span></div>'+
        '<div class="fact"><span class="k">Pass mark</span><span class="v">70%</span></div>'+
        '<div class="fact"><span class="k">Scoring</span><span class="v">Partial credit</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="card" role="region" aria-label="What you will learn here"><h3><span class="bh-scenario">&#9432; What you will learn here</span></h3>'+learn+'</div>'+
    '<div class="card" role="region" aria-label="Keywords covered in this exam"><h3><span class="bh-answer">&#10003; Keywords covered in this exam</span></h3><p class="kv">These are the concepts the exercises in this file will test. They all come from the ATT&amp;CK page for '+esc(META.objectLine)+'.</p>'+themes+'</div>'+
    '<div class="card" role="region" aria-label="How this exam works"><h3><span class="bh-question">&#63; How this exam works</span></h3>'+
      '<ul class="rulesList">'+
        '<li><b>Passing score: 70%.</b> PASS means you can move on with confidence. FAIL means you should study and retake this exam.</li>'+
        '<li><b>'+META.count+' exercises.</b> Exercise types used here: '+INTRO.types.map(function(t){return esc(t.name);}).join(', ')+'.</li>'+
        '<li><b>Timer:</b> the countdown starts at '+fmt(META.timerSeconds)+'. The <b>Pause</b> button stops it and hides the exercise so you can take a real break. The timer keeps running while you review skipped exercises.</li>'+
        '<li><b>Check buys you time:</b> the moment you press <b>Check</b>, the timer stops automatically. The exercise stays fully visible, and you can study the feedback for as long as you want. The timer resumes only when you press <b>Next</b> \u2014 on the last exercise, <b>Final Submit</b>.</li>'+
        '<li><b>Partial credit:</b> exercises with more than one correct item give partial credit. Selecting wrong options subtracts from your score, so only select what you are sure of. Formula: credit = max(0, (correct \u2212 wrong) \u00F7 total items).</li>'+
        '<li><b>Hint:</b> you can use one hint per exercise. A hint costs 10% of that exercise\u2019s credit.</li>'+
        '<li><b>Skip:</b> every exercise has a Skip button. Skipping does not reveal the answer and does not stop the timer. Skipped exercises go to a review pool before you submit \u2014 you can answer them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from your score.</li>'+
      '</ul>'+
      '<div class="centerRow"><button class="btn" id="startBtn" aria-label="Start the exam">&#9654; Start</button></div>'+
    '</div>';
  $('#startBtn').addEventListener('click', startExam);
}

/* ---------------- exercise flow ---------------- */
function startExam(){
  state.phase='exam';
  state.ex = shuffle(EXS).slice();
  state.idx = 0; state.answered = {}; state.creditSum = 0;
  state.skippedIds = []; state.hintUsed = {}; state.pendingFeedback = false;
  state.tManual = 0; state.tAuto = 0;
  state.remain = META.timerSeconds; renderTime();
  $('#intro').classList.add('hidden');
  $('#review').classList.add('hidden');
  $('#results').classList.add('hidden');
  $('#hdr').classList.remove('hidden');
  $('#exam').classList.remove('hidden');
  if(state.iv){ clearInterval(state.iv); }
  state.iv = setInterval(tick, 1000);
  startTimer();
  renderExercise();
}
function current(){ return state.ex[state.idx]; }
function renderExercise(){
  var ex = current();
  state.pendingFeedback = false; state.reviewBack = false;
  renderHeader();
  var card = $('#card');
  card.innerHTML = '';
  card.appendChild(buildScenarioBlock(ex));
  card.appendChild(buildQuestionBlock(ex));
  var ans = buildAnswerBlock(ex);
  card.appendChild(ans);
  var fb = document.createElement('div'); fb.className='feedback hidden'; fb.id='fb';
  fb.setAttribute('role','region'); fb.setAttribute('aria-live','polite'); fb.setAttribute('aria-label','Feedback');
  card.appendChild(fb);
  var ctl = $('#ctl');
  ctl.innerHTML = '';
  var check = mkBtn('&#10003; Check answer','btn blue','checkBtn'); check.disabled = true;
  check.addEventListener('click', onCheck);
  var next = mkBtn((state.idx === state.ex.length-1 ? 'Final Submit':'Next')+' &#8594;','btn','nextBtn'); next.disabled = true;
  next.addEventListener('click', onNext);
  var pause = mkBtn('&#9208; Pause','hdrBtn','pauseBtn');
  pause.addEventListener('click', onManualPause);
  ctl.appendChild(check); ctl.appendChild(next); ctl.appendChild(pause);
  var ansAreaEl = ans.querySelector('#ansArea');
  window.WIDGETS.render(ex, ansAreaEl || ans, function(){ check.disabled = false; });
  $('#hintBtn').disabled = !!state.hintUsed[ex.id];
  $('#skipBtn').disabled = false;
  window.scrollTo({top:0, behavior:'auto'});
}
function mkBtn(html,cls,id){ var b=document.createElement('button'); b.type='button'; b.className=cls; b.id=id||''; b.innerHTML=html; return b; }
function buildScenarioBlock(ex){
  var d=document.createElement('div'); d.className='card scenarioCard';
  var head='<div class="blockHead bh-scenario"><span aria-hidden="true">&#128203;</span> SCENARIO</div>';
  var body='<p style="margin-top:0">'+ esc(ex.scenario).replace(/\n/g,'<br>') +'</p>';
  var long = (ex.scenario.length>320) || ((ex.artefacts||[]).length>1) || (ex.scenario.length>240 && (ex.artefacts||[]).length>0);
  if(long){
    var bar=document.createElement('button'); bar.type='button'; bar.className='collapseBar'; bar.setAttribute('aria-expanded','true');
    bar.innerHTML='<span class="sum">'+esc(ex.summary)+'</span><span aria-hidden="true">&#9650; Collapse</span>';
    var inner=document.createElement('div'); inner.innerHTML=body;
    (ex.artefacts||[]).forEach(function(a,i){ inner.appendChild(renderArtefact(a,i+1)); });
    bar.addEventListener('click',function(){
      var open = inner.style.display!=='none';
      inner.style.display = open?'none':'block';
      bar.setAttribute('aria-expanded', open?'false':'true');
      bar.querySelector('.sum').textContent = open ? (ex.summary+' \u2014 collapsed') : ex.summary;
      bar.lastElementChild.innerHTML = open ? '&#9660; Expand' : '&#9650; Collapse';
    });
    d.innerHTML=head;
    d.appendChild(bar); d.appendChild(inner);
  } else {
    d.innerHTML=head+body;
    (ex.artefacts||[]).forEach(function(a,i){ d.appendChild(renderArtefact(a,i+1)); });
  }
  return d;
}
function renderArtefact(a,n){
  var flt = a.filter ? '<div class="filterRow"><label class="fHint" for="flt'+n+'">Filter &#9662;</label><input id="flt'+n+'" type="text" placeholder="type to filter lines" aria-label="Filter lines in '+esc(a.label)+'"></div>' : '';
  var pre = '<pre class="mono" id="art'+n+'">'+ artLines(a.lines) +'</pre>';
  var html = '<div class="artefact"><span class="aLabel">Artefact '+n+' \u2014 '+esc(a.label)+'</span>'+pre+flt+'</div>';
  var holder=document.createElement('div'); holder.innerHTML=html;
  if(a.filter){
    var input=holder.querySelector('#flt'+n), preEl=holder.querySelector('#art'+n);
    input.addEventListener('input',function(){
      var q=input.value.trim().toLowerCase();
      var spans=preEl.querySelectorAll('span');
      for(var i=0;i<spans.length;i++){
        spans[i].style.display = (!q || spans[i].textContent.toLowerCase().indexOf(q)!==-1) ? '' : 'none';
      }
    });
  }
  return holder.firstChild;
}
function artLines(lines){
  return lines.map(function(l){
    var cls='';
    if(/(evtx|winevt|\.bash_history|ConsoleHost_history|authorized_keys|\.pem|ntds\.dit|sudoers|keytab|id_rsa)/i.test(l)) cls='lg-warn';
    if(/(denied|failed|unauthorized|777|Everyone|world-writable|Full Control|RW Everyone)/i.test(l)) cls='lg-bad';
    if(/(restricted|640|750|inheritance:r|OK\b|compliant)/i.test(l)) cls='lg-ok';
    if(/^(#|\[|-{2,})/.test(l.trim())) cls='lg-dim';
    return '<span class="'+cls+'">'+esc(l)+'</span>';
  }).join('\n');
}
function buildQuestionBlock(ex){
  var d=document.createElement('div'); d.className='card questionCard';
  d.innerHTML='<div class="blockHead bh-question"><span aria-hidden="true">&#10067;</span> QUESTION</div><div class="qText">'+esc(ex.question)+'</div>';
  return d;
}
function buildAnswerBlock(ex){
  var d=document.createElement('div'); d.className='card answerCard';
  d.innerHTML='<div class="blockHead bh-answer"><span aria-hidden="true">&#9998;</span> YOUR ANSWER</div>';
  var area=document.createElement('div'); area.id='ansArea'; d.appendChild(area);
  return d;
}

/* ---------------- check / next / pause / hint / skip ---------------- */
function onCheck(){
  var ex = current();
  var res = window.WIDGETS.grade(ex);
  var credit = res.credit;
  if(state.hintUsed[ex.id]){ credit = Math.max(0, credit - 0.10); }
  state.answered[ex.id] = { credit: credit, items: res.items };
  state.creditSum += credit;
  /* Check-triggered auto-pause FIRST, then feedback */
  setTimerState('PAUSED_AUTO_CHECK');
  state.pendingFeedback = true;
  window.__RENDER_FEEDBACK__(ex, credit, res);
  renderHeader();
  $('#nextBtn').disabled = false;
  $('#checkBtn').disabled = true; $('#skipBtn').disabled = true; $('#hintBtn').disabled = true;
  lockAnswer();
}
function lockAnswer(){
  /* Keep the exercise fully visible during the Check-triggered auto-pause;
     just make the answer controls non-editable. */
  var area=$('#ansArea'); if(!area) return;
  var els = area.querySelectorAll('input,select,button');
  for(var i=0;i<els.length;i++){ els[i].disabled = true; els[i].setAttribute('aria-disabled','true'); }
}
function onNext(){
  var ex = current();
  if(!state.pendingFeedback){ return; }
  if(state.reviewBack){
    if(state.remain>0){ setTimerState('RUNNING'); } else { setTimerState('ENDED'); }
    state.skippedIds = state.skippedIds.filter(function(id){ return id!==ex.id; });
    showReview(); return;
  }
  if(state.idx === state.ex.length-1){ finishExam(false); return; }
  setTimerState('RUNNING');
  state.idx += 1;
  renderExercise();
}
function onManualPause(){
  if(state.timerState==='ENDED'){ return; }
  if(state.timerState==='PAUSED_MANUAL'){ onResume(); return; }
  state.manualPrev = state.timerState;
  setTimerState('PAUSED_MANUAL');
  $('#pauseMsg').textContent = state.manualPrev==='PAUSED_AUTO_CHECK'
    ? 'You paused while reviewing feedback. The timer was already stopped. Resume to go back to the feedback.'
    : 'The exercise is hidden while you are paused. Press Resume when you are ready.';
  $('#pauseOv').classList.remove('hidden');
}
function onResume(){
  $('#pauseOv').classList.add('hidden');
  setTimerState(state.manualPrev || 'RUNNING');
  state.manualPrev=null;
}
function onHint(){
  var ex = current();
  if(!ex || state.phase!=='exam' || state.pendingFeedback) return;
  if(state.hintUsed[ex.id]) return;
  state.hintUsed[ex.id] = true;
  var area=$('#ansArea'); if(!area) return;
  var hp=$('#hintP');
  if(!hp){
    hp=document.createElement('div'); hp.className='hintPanel'; hp.id='hintP';
    hp.setAttribute('role','note');
    hp.innerHTML='<span class="h">&#10068; Hint \u2014 costs 10% of this exercise\u2019s credit</span><span>'+esc(ex.hint)+'</span>';
    area.insertBefore(hp, area.firstChild);
  }
  $('#hintBtn').disabled = true;
  renderHeader();
}
function onSkip(){
  var ex = current();
  if(state.phase!=='exam' || state.pendingFeedback) return;
  if(state.skippedIds.indexOf(ex.id)===-1){ state.skippedIds.push(ex.id); }
  if(state.reviewBack){
    state.reviewBack = false;
    showReview();
    return;
  }
  if(state.idx === state.ex.length-1){ finishExam(false); return; }
  state.idx += 1;
  renderExercise();
}

/* ---------------- finish / review / results ---------------- */
function finishExam(byTimeout){
  /* The countdown keeps running into the review screen; it is stopped only
     at the results screen or by timeEnded(). */
  if(byTimeout && !state.answered[current().id] && state.skippedIds.indexOf(current().id)===-1){
    state.skippedIds.push(current().id);
  }
  var canReview = !byTimeout && state.skippedIds.length>0 && state.remain>0;
  if(canReview){ showReview(); } else { showResults(byTimeout); }
}
function showReview(){
  state.phase='review';
  if(state.remain>0){ setTimerState('RUNNING'); } else { setTimerState('ENDED'); }
  renderHeader();
  $('#exam').classList.add('hidden');
  var rv=$('#review'); rv.classList.remove('hidden');
  var rows = state.skippedIds.map(function(id){
    var ex = state.ex.filter(function(e){ return e.id===id; })[0];
    return '<div class="skipRow"><span class="stateChip st-skipped" role="status">\u26A0 Skipped</span><span class="t">'+esc(ex.summary)+'</span><button type="button" class="btn blue" data-ans="'+id+'" aria-label="Answer now: '+esc(ex.summary)+'">Answer now</button></div>';
  }).join('');
  rv.innerHTML =
    '<div class="card"><h2 style="margin-top:0">&#9888; Review skipped exercises</h2>'+
    '<p class="kv">You skipped '+state.skippedIds.length+' exercise(s). Skipped-and-never-answered exercises are excluded from your score. The timer is still running \u2014 answer them now, or submit the exam.</p>'+
    '<div class="skipList">'+(rows || '<p class="kv">All skipped exercises have been answered.</p>')+'</div>'+
    '<div class="centerRow"><button type="button" class="btn" id="submitAll">Submit exam &#8594;</button></div></div>';
  rv.querySelectorAll('[data-ans]').forEach(function(b){
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-ans');
      var i = state.ex.findIndex(function(e){ return e.id===id; });
      state.idx=i; state.reviewBack=true; state.phase='exam';
      rv.classList.add('hidden'); $('#exam').classList.remove('hidden');
      renderExercise();
    });
  });
  $('#submitAll').addEventListener('click', function(){ showResults(false); });
  window.scrollTo({top:0, behavior:'auto'});
}
function showResults(byTimeout){
  state.phase='results';
  if(state.iv){ clearInterval(state.iv); state.iv=null; }
  setTimerState('ENDED');
  renderHeader();
  $('#exam').classList.add('hidden'); $('#review').classList.add('hidden');
  var answered = Object.keys(state.answered).length;
  var fully=0, partial=0, wrong=0, psum=0;
  Object.keys(state.answered).forEach(function(k){
    var c=state.answered[k].credit;
    if(c===1){ fully++; } else if(c>0){ partial++; psum+=c; } else { wrong++; }
  });
  var skippedNever = state.ex.length - answered;
  var percent = answered>0 ? Math.round((state.creditSum/answered)*100) : 0;
  var passed = percent>=70;
  var avgP = partial>0 ? (psum/partial).toFixed(2) : '\u2014';
  var rs=$('#results'); rs.classList.remove('hidden');
  var panel = passed
    ? '<div class="passPanel" role="status"><div class="big" style="color:var(--state-correct)">&#10003; PASS</div><div>You reached the 70% pass mark. Well done.</div></div>'
    : '<div class="failPanel" role="status"><div class="big" style="color:var(--state-incorrect)">&#10007; FAIL</div><div>You did not reach the 70% pass mark. Study the explanations and retake the exam.</div></div>';
  rs.innerHTML =
    '<div class="card results"><h2>Results</h2>'+
    panel+
    '<div class="finalScore">Final score: <b>'+state.creditSum.toFixed(1)+'</b> / '+answered+' &nbsp;&middot;&nbsp; '+percent+'%</div>'+
    (byTimeout?'<div class="smallNote">&#9208; Time ended \u2014 unanswered exercises were excluded from the score.</div>':'')+
    '<div class="rGrid">'+
      '<div class="rCard"><span class="n" style="color:var(--state-correct)">'+fully+'</span><span class="w">&#10003; Fully correct</span></div>'+
      '<div class="rCard"><span class="n" style="color:var(--state-partial)">'+partial+'</span><span class="w">&#10003; Partially correct (avg '+avgP+')</span></div>'+
      '<div class="rCard"><span class="n" style="color:var(--state-incorrect)">'+wrong+'</span><span class="w">&#10007; Fully incorrect</span></div>'+
      '<div class="rCard"><span class="n" style="color:var(--state-skipped)">'+skippedNever+'</span><span class="w">&#9888; Skipped \u2014 excluded</span></div>'+
    '</div>'+
    '<div class="smallNote">Reminder: the timer stopped automatically every time you pressed Check, so the time you spent reading feedback never counted against you.</div>'+
    '<div class="smallNote">\u23F1 Time running: '+fmt(Math.max(0, META.timerSeconds - state.remain))+' &middot; \u23F8 Paused manually: '+fmt(state.tManual)+' &middot; \u23F8 Paused for feedback (Check): '+fmt(state.tAuto)+'</div>'+
    '<div class="centerRow"><button type="button" class="btn danger" id="retakeBtn">&#8635; Retake exam</button></div>'+
    '</div>';
  $('#retakeBtn').addEventListener('click', retake);
  reportScore(state.creditSum, answered);
  window.scrollTo({top:0, behavior:'auto'});
}
function retake(){
  $('#results').classList.add('hidden');
  $('#review').classList.add('hidden');
  state.attemptDone=false;
  startExam();
}

/* ---------------- site contract (STEP 6) ---------------- */
function reportScore(creditSum, answeredCount){
  if(state.attemptDone) return;
  state.attemptDone = true;
  var percent = answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent>=70
    }, location.origin);
  } catch(e){ /* opened directly \u2014 nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  state.learner = { username:event.data.username||'', country:event.data.country||'', locale:event.data.locale||'en' };
  var chip=$('#whoChip');
  if(chip && state.learner.username){ chip.textContent='Learner: '+state.learner.username; chip.style.display='inline-flex'; }
});

/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', function(){
  renderIntro();
  $('#hintBtn').addEventListener('click', onHint);
  $('#skipBtn').addEventListener('click', onSkip);
  $('#resumeBtn').addEventListener('click', onResume);
  renderTime();
});
window.__EXAM_STATE__ = state; /* testability */
window.__RENDER_EXERCISE__ = renderExercise; /* testability */
})();

</script>
<script>

(function(){
'use strict';
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
function shuffle(a){ var x=a.slice(),i,j,t; for(i=x.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=x[i]; x[i]=x[j]; x[j]=t; } return x; }

/* credit = max(0,(H-W)/N) */
function score(H,W,N){ return Math.max(0,(H-W)/Math.max(1,N)); }
function toCredit(res){ res.credit = score(res.H,res.W,res.N); return res; }

var WIDGETS = {
  /* ---------------- render ---------------- */
  render: function(ex, area, onReady){
    if(ex.type==='mc'){ this.rMC(ex,area,onReady); }
    else if(ex.type==='multi'){ this.rMulti(ex,area,onReady); }
    else if(ex.type==='match'){ this.rMatch(ex,area,onReady); }
    else if(ex.type==='dragdrop'){ this.rDD(ex,area,onReady); }
    else if(ex.type==='order'){ this.rOrder(ex,area,onReady); }
    else if(ex.type==='fill'){ this.rFill(ex,area,onReady); }
    else if(ex.type==='terminal'){ this.rTerm(ex,area,onReady); }
    else if(ex.type==='branch'){ this.rBranch(ex,area,onReady); }
  },
  rMC: function(ex,area,onReady){
    var letters=['A','B','C','D','E','F'];
    var opts=shuffle(ex.w.options.map(function(t,i){ return {t:t,i:i}; }));
    area.innerHTML='<div class="opts" role="radiogroup" aria-label="Answer options">'+opts.map(function(o,i){
      return '<button type="button" class="opt" role="radio" aria-checked="false" data-i="'+o.i+'"><span class="k">'+letters[i]+'.</span><span>'+esc(o.t)+'</span><span class="selTag" aria-hidden="true">&#10003; Selected</span></button>';
    }).join('')+'</div>';
    area.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        area.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked','false'); x.classList.remove('selected'); });
        b.setAttribute('aria-checked','true'); b.classList.add('selected');
        onReady();
      });
    });
  },
  rMulti: function(ex,area,onReady){
    var letters=['A','B','C','D','E','F','G'];
    var opts=shuffle(ex.w.options.map(function(t,i){ return {t:t,i:i}; }));
    area.innerHTML='<p class="kv" style="margin-top:0">'+esc(ex.w.select||'Select all that apply.')+'</p><div class="opts" role="group" aria-label="Answer options, multi-select">'+opts.map(function(o,i){
      return '<button type="button" class="opt" aria-pressed="false" data-i="'+o.i+'"><span class="k">'+letters[i]+'.</span><span>'+esc(o.t)+'</span><span class="selTag" aria-hidden="true">&#10003; Selected</span></button>';
    }).join('')+'</div>';
    area.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        var on=b.getAttribute('aria-pressed')==='true';
        b.setAttribute('aria-pressed',on?'false':'true'); b.classList.toggle('selected',!on);
        onReady();
      });
    });
  },
  rMatch: function(ex,area,onReady){
    var rights=shuffle(ex.w.right.map(function(t,i){ return {t:t,i:i}; }));
    area.innerHTML='<p class="kv" style="margin-top:0">For each item on the left, choose the matching option.</p>'+
      ex.w.left.map(function(l,i){
        return '<div class="matchRow"><div class="lft">'+esc(l)+'</div><select class="ansSelect" data-l="'+i+'" aria-label="Match for: '+esc(l)+'"><option value="-1" selected>\u2014 choose \u2014</option>'+rights.map(function(r){ return '<option value="'+r.i+'">'+esc(r.t)+'</option>'; }).join('')+'</select></div>';
      }).join('');
    area.querySelectorAll('select').forEach(function(s){ s.addEventListener('change',function(){ onReady(); }); });
  },
  rDD: function(ex,area,onReady){
    var items=shuffle(ex.w.items.map(function(t,i){ return {t:t,i:i}; }));
    var zones=ex.w.zones;
    area.innerHTML='<div class="ddGrid"><div class="bankPanel"><span class="miniLabel">Item bank \u2014 drag a card to a zone, or click the card then click a zone</span><div class="bank" id="ddBank"></div></div>'+
      '<div class="zoneCol"><span class="miniLabel">Drop zones</span>'+zones.map(function(z){ return '<div class="zone" data-z="'+z.id+'" role="group" aria-label="Zone: '+esc(z.label)+'"><span class="zLabel">&#128465; '+esc(z.label)+'</span><span class="ph">\u2014 drop items here \u2014</span></div>'; }).join('')+'</div></div>';
    var bank=$('#ddBank',area);
    var picked=null;
    function chipEl(it){
      var c=document.createElement('button'); c.type='button'; c.className='ddItem'; c.draggable=true; c.setAttribute('data-i',it.i);
      c.innerHTML='<span>'+esc(it.t)+'</span>';
      c.addEventListener('dragstart',function(ev){ picked=it; try{ ev.dataTransfer.setData('text/plain',String(it.i)); }catch(e){} });
      c.addEventListener('click',function(){
        if(c.parentElement===bank){
          $$('.ddItem',area).forEach(function(x){ x.classList.remove('picked'); });
          c.classList.add('picked'); picked=it;
        }
      });
      return c;
    }
    items.forEach(function(it){ bank.appendChild(chipEl(it)); });
    zones.forEach(function(z){
      var zEl=area.querySelector('[data-z="'+z.id+'"]');
      zEl.addEventListener('dragover',function(ev){ ev.preventDefault(); zEl.classList.add('over'); });
      zEl.addEventListener('dragleave',function(){ zEl.classList.remove('over'); });
      zEl.addEventListener('drop',function(ev){
        ev.preventDefault(); zEl.classList.remove('over');
        var iStr=''; try{ iStr=ev.dataTransfer.getData('text/plain'); }catch(e){}
        var it = (iStr!=='') ? {i:parseInt(iStr,10)} : picked;
        place(it, zEl);
      });
      zEl.addEventListener('click',function(){ if(picked!==null){ place(picked, zEl); } });
    });
    function place(it, zEl){
      if(!it) return;
      var chip=area.querySelector('.ddItem[data-i="'+it.i+'"]');
      if(!chip || chip.getAttribute('data-zplaced')===zEl.getAttribute('data-z')){ picked=null; return; }
      zEl.querySelector('.ph').style.display='none';
      chip.classList.remove('picked');
      chip.setAttribute('data-zplaced', zEl.getAttribute('data-z'));
      if(!chip.querySelector('.rm')){
        var rm=document.createElement('span'); rm.className='rm'; rm.setAttribute('role','button'); rm.title='Move back to bank';
        rm.setAttribute('aria-label','Move '+chip.firstChild.textContent+' back to the item bank');
        rm.innerHTML='&#10005;';
        rm.addEventListener('click',function(ev){
          ev.stopPropagation();
          chip.removeAttribute('data-zplaced');
          bank.appendChild(chip);
          if(!zEl.querySelector('.ddItem')){ zEl.querySelector('.ph').style.display=''; }
          onReady();
        });
        chip.appendChild(rm);
      }
      zEl.appendChild(chip);
      picked=null;
      onReady();
    }
  },
  rOrder: function(ex,area,onReady){
    var items=shuffle(ex.w.items.map(function(t,i){ return {t:t,i:i}; }));
    function draw(){
      area.innerHTML='<p class="kv" style="margin-top:0">Put the items in the right order. Use the arrow buttons to move an item up or down.</p><div class="orderList" role="list" aria-label="Ordered list">'+items.map(function(it,i){
        return '<div class="orderRow" role="listitem" data-i="'+it.i+'"><span class="pos">'+(i+1)+'</span><span class="txt">'+esc(it.t)+'</span><span class="orderBtns"><button type="button" aria-label="Move up: '+esc(it.t)+'" class="upBtn" data-i="'+i+'" '+(i===0?'disabled':'')+'>&#8593;</button><button type="button" aria-label="Move down: '+esc(it.t)+'" class="dnBtn" data-i="'+i+'" '+(i===items.length-1?'disabled':'')+'>&#8595;</button></span></div>';
      }).join('')+'</div>';
      $$('.upBtn',area).forEach(function(b){ b.addEventListener('click',function(){ var i=parseInt(b.getAttribute('data-i'),10); if(i>0){ var t=items[i-1]; items[i-1]=items[i]; items[i]=t; draw(); onReady(); } }); });
      $$('.dnBtn',area).forEach(function(b){ b.addEventListener('click',function(){ var i=parseInt(b.getAttribute('data-i'),10); if(i<items.length-1){ var t=items[i+1]; items[i+1]=items[i]; items[i]=t; draw(); onReady(); } }); });
    }
    draw();
  },
  rFill: function(ex,area,onReady){
    var bank=shuffle(ex.w.bank);
    var html=esc(ex.w.template).replace(/\{(b\d+)\}/g, function(m,k){
      return '<select class="ansSelect" data-b="'+k+'" aria-label="Blank '+k+'"><option value="">\u2014 choose \u2014</option>'+bank.map(function(w){ return '<option value="'+esc(w)+'">'+esc(w)+'</option>'; }).join('')+'</select>';
    });
    area.innerHTML='<p class="fillText" style="margin-top:0">'+html+'</p><p class="kv">The word bank is shuffled \u2014 some words are distractors.</p>';
    area.querySelectorAll('select').forEach(function(s){ s.addEventListener('change',function(){ onReady(); }); });
  },
  rTerm: function(ex,area,onReady){
    var w=ex.w;
    var syntax = w.syntax ? '<div class="syntaxPanel"><span class="t">&#9432; '+esc(w.syntax.title)+'</span>'+w.syntax.lines.map(function(l){ return '<code>'+esc(l)+'</code>'; }).join('')+'</div>' : '';
    area.innerHTML=syntax+
      '<div class="term" role="region" aria-label="Terminal simulator">'+
        '<div class="scr" id="tScr">'+ (w.welcome||[]).map(function(l){ return esc(l)+'\n'; }).join('') +'</div>'+
        '<div class="inRow"><span class="pr">'+esc(w.prompt)+'</span><input id="tIn" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal command input"></div>'+
      '</div>'+
      '<p class="kv" style="margin-top:8px">Type the command, then press Check. Nothing is really executed \u2014 this is a simulation.</p>';
    var input=$('#tIn',area);
    input.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ onReady(); } });
    input.addEventListener('input',function(){ onReady(); });
    this._lastTermInput = input;
  },
  rBranch: function(ex,area,onReady){
    var st={k:0, chosen:[]};
    this._br=st;
    function drawStep(){
      var n=ex.w.steps.length;
      if(st.k>=n){ area.innerHTML='<p class="kv">All steps answered. Press Check to grade the whole scenario.</p>'; onReady(); return; }
      var s=ex.w.steps[st.k];
      var opts=shuffle(s.options.map(function(o,i){ return {t:o.t,outcome:o.outcome,ok:o.ok,i:i}; }));
      var optsHtml=opts.map(function(o){ return '<button type="button" class="opt" data-i="'+o.i+'"><span>'+esc(o.t)+'</span><span class="selTag" aria-hidden="true">&#10003; Selected</span></button>'; }).join('');
      area.innerHTML='<span class="stepTag">STEP '+(st.k+1)+' OF '+n+'</span><div class="qText" style="margin:6px 0 10px 0">'+esc(s.prompt)+'</div><div class="opts" id="brOpts">'+optsHtml+'</div><div id="brOut"></div>';
      $$('#brOpts .opt',area).forEach(function(b){
        b.addEventListener('click',function(){
          var oi=parseInt(b.getAttribute('data-i'),10);
          $$('#brOpts .opt',area).forEach(function(x){ x.classList.remove('selected'); });
          b.classList.add('selected');
          var o=s.options[oi];
          var out=$('#brOut',area);
          out.innerHTML='<div class="outcome" role="status"><b>'+(o.ok?'&#10003; Good move:':'&#10007; Consequence:')+'</b> '+esc(o.outcome)+'</div>'+
            '<div class="centerRow"><button type="button" class="btn blue" id="brNext">'+(st.k<n-1?'Continue':'Go to final check')+' &#8594;</button></div>';
          $('#brNext',area).addEventListener('click',function(){
            st.chosen[st.k]=oi; st.k+=1; drawStep(); onReady();
          });
        });
      });
    }
    drawStep();
  },

  /* ---------------- grade ---------------- */
  grade: function(ex){
    var r;
    if(ex.type==='mc'){ r=this.gMC(ex); }
    else if(ex.type==='multi'){ r=this.gMulti(ex); }
    else if(ex.type==='match'){ r=this.gMatch(ex); }
    else if(ex.type==='dragdrop'){ r=this.gDD(ex); }
    else if(ex.type==='order'){ r=this.gOrder(ex); }
    else if(ex.type==='fill'){ r=this.gFill(ex); }
    else if(ex.type==='terminal'){ r=this.gTerm(ex); }
    else if(ex.type==='branch'){ r=this.gBranch(ex); }
    return toCredit(r);
  },
  gMC: function(ex){
    var sel=$('#ansArea .opt[aria-checked="true"]');
    var items=[], H=0, W=0, N=1;
    if(sel && parseInt(sel.getAttribute('data-i'),10)===ex.w.correct){ H=1; items.push({label:'Your choice: '+ex.w.options[ex.w.correct], status:'correct', note:'This is the correct option.'}); }
    else if(sel){ W=1; items.push({label:'Your choice: '+ex.w.options[parseInt(sel.getAttribute('data-i'),10)], status:'wrong', note:'The correct option is: '+ex.w.options[ex.w.correct]}); }
    else { items.push({label:'No option selected', status:'missed', note:'The correct option is: '+ex.w.options[ex.w.correct]}); }
    return {N:N,H:H,W:W,items:items};
  },
  gMulti: function(ex){
    var correct=ex.w.correct, N=correct.length, H=0, W=0, items=[];
    var selSet={};
    $$('#ansArea .opt[aria-pressed="true"]').forEach(function(b){ selSet[parseInt(b.getAttribute('data-i'),10)]=true; });
    ex.w.options.forEach(function(t,i){
      var isC = correct.indexOf(i)!==-1;
      if(isC){
        if(selSet[i]){ H++; items.push({label:t,status:'correct',note:'Correct, and you selected it.'}); }
        else { items.push({label:t,status:'missed',note:'You did not select this correct option.'}); }
      } else {
        if(selSet[i]){ W++; items.push({label:t,status:'wrong',note:'Not part of the correct answer in this scenario.'}); }
      }
    });
    return {N:N,H:H,W:W,items:items};
  },
  gMatch: function(ex){
    var N=ex.w.left.length,H=0,W=0,items=[];
    ex.w.left.forEach(function(l,i){
      var sel=$('#ansArea select[data-l="'+i+'"]');
      var v = sel ? parseInt(sel.value,10) : -1;
      if(v===ex.w.answer[i]){ H++; items.push({label:l+' \u2192 '+ex.w.right[ex.w.answer[i]],status:'correct',note:'Correct pair.'}); }
      else if(v>=0){ W++; items.push({label:l+' \u2192 '+ex.w.right[v],status:'wrong',note:'Correct pair: '+l+' \u2192 '+ex.w.right[ex.w.answer[i]]}); }
      else { items.push({label:l,status:'missed',note:'Correct pair: '+l+' \u2192 '+ex.w.right[ex.w.answer[i]]}); }
    });
    return {N:N,H:H,W:W,items:items};
  },
  gDD: function(ex){
    var N=ex.w.items.length,H=0,W=0,items=[];
    var placed={};
    $$('#ansArea .ddItem[data-zplaced]').forEach(function(c){ placed[parseInt(c.getAttribute('data-i'),10)] = c.getAttribute('data-zplaced'); });
    function zl(zid){ var z=ex.w.zones.filter(function(x){ return x.id===zid; })[0]; return z? z.label : zid; }
    ex.w.items.forEach(function(it,i){
      var z = placed[i];
      if(z===undefined){ items.push({label:it.t,status:'missed',note:'Still in the bank. Correct zone: '+zl(it.z)}); }
      else if(z===it.z){ H++; items.push({label:it.t+' \u2192 '+zl(z),status:'correct',note:'Correct zone.'}); }
      else { W++; items.push({label:it.t+' \u2192 '+zl(z),status:'wrong',note:'Correct zone: '+zl(it.z)}); }
    });
    return {N:N,H:H,W:W,items:items};
  },
  gOrder: function(ex){
    var N=ex.w.items.length,H=0,W=0,items=[];
    $$('#ansArea .orderRow').forEach(function(r,i){
      var idx=parseInt(r.getAttribute('data-i'),10);
      if(ex.w.order[i]===idx){ H++; items.push({label:'Position '+(i+1)+': '+ex.w.items[idx],status:'correct',note:'Right item in position '+(i+1)+'.'}); }
      else { W++; items.push({label:'Position '+(i+1)+': '+ex.w.items[idx],status:'wrong',note:'Correct item for position '+(i+1)+': '+ex.w.items[ex.w.order[i]]}); }
    });
    return {N:N,H:H,W:W,items:items};
  },
  gFill: function(ex){
    var keys=Object.keys(ex.w.blanks), N=keys.length,H=0,W=0,items=[];
    keys.forEach(function(k){
      var acc=ex.w.blanks[k];
      var sel=$('#ansArea select[data-b="'+k+'"]');
      var v=sel?sel.value:'';
      if(v && acc.some(function(a){ return a.toLowerCase()===v.toLowerCase(); })){ H++; items.push({label:'Blank '+k+': '+v,status:'correct',note:'Correct.'}); }
      else if(v){ W++; items.push({label:'Blank '+k+': '+v,status:'wrong',note:'Accepted: '+acc[0]}); }
      else { items.push({label:'Blank '+k,status:'missed',note:'Left empty. Accepted: '+acc[0]}); }
    });
    return {N:N,H:H,W:W,items:items};
  },
  gTerm: function(ex){
    var w=ex.w;
    var input=$('#tIn');
    var raw = input? input.value : '';
    var cmd = raw.trim().replace(/\s+/g,' ');
    var N=w.elements.length,H=0,W=0,items=[];
    var norm = cmd.toLowerCase();
    var dangerHit=null;
    (w.dangerous||[]).forEach(function(d){ if(dangerHit===null && new RegExp(d.re,'i').test(norm)){ dangerHit=d; } });
    w.elements.forEach(function(e){
      var re=new RegExp(e.re,'i');
      if(re.test(norm)){ H++; items.push({label:e.label,status:'correct',note:e.why||'Required element present.'}); }
      else { items.push({label:e.label,status:'missed',note:'Missing or wrong. '+(e.why||'')}); }
    });
    if(dangerHit){ W++; items.push({label:'DANGEROUS \u2014 NEAR MISS',status:'wrong',note:dangerHit.note}); }
    if(!cmd){ items.push({label:'No command typed',status:'missed',note:'Canonical command: '+w.canonical}); }
    return {N:N,H:H,W:W,items:items,canonical:w.canonical,parts:w.parts||[],danger:!!dangerHit};
  },
  gBranch: function(ex){
    var st=WIDGETS._br, N=ex.w.steps.length,H=0,W=0,items=[];
    ex.w.steps.forEach(function(s,i){
      var ci = st && st.chosen[i];
      var okOpt = s.options.filter(function(o){return o.ok;})[0];
      if(ci===undefined){ items.push({label:'Step '+(i+1),status:'missed',note:'Not reached. Correct choice: '+okOpt.t}); }
      else if(s.options[ci].ok){ H++; items.push({label:'Step '+(i+1)+': '+s.options[ci].t,status:'correct',note:'Correct decision.'}); }
      else { W++; items.push({label:'Step '+(i+1)+': '+s.options[ci].t,status:'wrong',note:'Better: '+okOpt.t}); }
    });
    return {N:N,H:H,W:W,items:items};
  }
};

/* ---------------- feedback ---------------- */
function renderFeedback(ex, credit, res){
  var fb=$('#fb'); if(!fb) return;
  var label, cls, icon;
  if(credit===1){ label='CORRECT'; cls='st-correct'; icon='&#10003;'; }
  else if(credit>0){ label='PARTIALLY CORRECT'; cls='st-partial'; icon='&#10003;'; }
  else { label='INCORRECT'; cls='st-incorrect'; icon='&#10007;'; }
  var N=res.N, H=0, Wn=0;
  res.items.forEach(function(it){ if(it.status==='correct')H++; if(it.status==='wrong')Wn++; });
  var multi = N>1 || ex.type==='multi';
  var creditLine = multi ? '<span class="fbCredit">'+H+'/'+N+' items'+(Wn>0?' ('+Wn+' wrong)':'')+', credit '+credit.toFixed(2)+'</span>' : '';
  var examState = window.__EXAM_STATE__;
  if(examState && examState.hintUsed && examState.hintUsed[ex.id]) creditLine += '<span class="fbCredit"> &middot; includes \u22120.10 hint penalty</span>';
  var itemsHtml = res.items.map(function(it){
    var ic,cl;
    if(it.status==='correct'){ ic='&#10003; Correct'; cl='st-correct'; }
    else if(it.status==='wrong'){ ic='&#10007; Wrong'; cl='st-incorrect'; }
    else { ic='&#9675; Missed'; cl='st-skipped'; }
    return '<li><span class="ic stateChip '+cl+'">'+ic+'</span><span>'+esc(it.label)+'<span class="note">'+esc(it.note||'')+'</span></span></li>';
  }).join('');
  var ca = correctAnswerBox(ex);
  var canon = (ex.type==='terminal')
    ? '<div class="correctAnswerBox"><b>Canonical command:</b><pre class="mono" id="canonCmd" style="margin:6px 0;overflow-x:auto">'+esc(res.canonical)+'</pre>'+
      ((res.parts&&res.parts.length)? '<ul class="rulesList" style="margin-top:6px">'+res.parts.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>':'')+
      ((ex.w.output&&ex.w.output.length)? '<div style="margin-top:8px"><b>Realistic output:</b><pre class="mono" style="margin:6px 0;overflow-x:auto">'+esc(ex.w.output.join('\n'))+'</pre></div>':'')+
      (res.danger? '<p style="color:var(--state-incorrect);font-weight:700">&#10007; DANGEROUS \u2014 NEAR MISS: your input would have changed state or destroyed evidence. Always prefer the safe, read-only or least-destructive command.</p>':'')+
      '</div>'
    : '';
  fb.innerHTML =
    '<div class="fbHead"><span class="stateChip '+cls+' fbLabel" role="status">'+icon+' '+label+'</span>'+creditLine+'</div>'+
    ca + canon +
    '<ul class="itemsList">'+itemsHtml+'</ul>'+
    '<div class="explain"><span class="xh">Why</span>'+esc(ex.explain).replace(/\n/g,'<br>')+
    '<span class="study"><b>What to study:</b> '+esc(ex.study||ex.hint)+'</span></div>';
  fb.classList.remove('hidden');
}
function correctAnswerBox(ex){
  if(ex.type==='mc'){ return '<div class="correctAnswerBox"><b>Correct answer:</b> '+esc(ex.w.options[ex.w.correct])+'</div>'; }
  if(ex.type==='multi'){ return '<div class="correctAnswerBox"><b>Correct set:</b> '+ex.w.correct.map(function(i){ return esc(ex.w.options[i]); }).join(' &middot; ')+'</div>'; }
  return '';
}

window.WIDGETS = WIDGETS;
window.__RENDER_FEEDBACK__ = renderFeedback;
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
