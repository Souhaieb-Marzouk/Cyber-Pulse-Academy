function buildFill(ex){
  var shell = mkAnswerShell();
  var wrap = el('div');
  var parts = ex.text.split('___');
  var tEl = el('div','ftext');
  var fills = new Array(ex.blanks.length).fill(null);
  var bankItems = shuf(ex.blanks.concat(ex.bankExtra||[]));
  var bank = el('div','bank');
  bank.appendChild(el('span','lab','Word bank \u2014 tap a word, then tap a blank'));
  var blEls = [];
  var selBlank = null;
  var selWord = null;
  function renderText(){
    tEl.innerHTML='';
    parts.forEach(function(p,i){
      tEl.appendChild(document.createTextNode(p));
      if(i<ex.blanks.length){
        (function(bi){
          var b = el('button','bl'); b.type='button';
          b.textContent = fills[bi] || '\u00A0';
          b.addEventListener('click', function(){
            if(S.ans[ex.id]){ return; }
            if(fills[bi]!=null){ /* return word to bank */
              var w = fills[bi]; fills[bi]=null; selWord=w; renderBank(); renderText(); refresh(); return;
            }
            selBlank = (selBlank===bi)?null:bi;
            blEls.forEach(function(x,j){ x.classList.toggle('sel', j===selBlank); });
            if(selBlank!=null && selWord!=null){ commit(selBlank, selWord); }
          });
          blEls[bi]=b; tEl.appendChild(b);
        })(i);
      }
    });
  }
  var chips = {};
  function renderBank(){
    bank.querySelectorAll('.chip').forEach(function(c){ c.remove(); });
    bankItems.forEach(function(w){
      var used = fills.some(function(f){ return f===w; });
      var c = chips[w];
      if(!c){
        c = el('button','chip'); c.type='button'; c.textContent=w; chips[w]=c;
        c.addEventListener('click', function(){
          if(S.ans[ex.id]){ return; }
          selWord = w;
          if(selBlank!=null){ commit(selBlank, w); }
          else {
            Object.keys(chips).forEach(function(k){ chips[k].classList.remove('sel'); });
            c.classList.add('sel');
          }
        });
      }
      c.style.display = used ? 'none' : '';
      c.classList.toggle('sel', selWord===w && !used);
      bank.appendChild(c);
    });
  }
  function commit(bi, w){
    fills[bi]=w; selBlank=null; selWord=null;
    renderText(); renderBank(); refresh();
  }
  wrap.appendChild(tEl); wrap.appendChild(bank);
  renderText(); renderBank();
  shell.body.appendChild(wrap);
  return {node:shell.box, getAnswer:function(){ return {fills: fills.slice()}; },
          hasAnswer:function(){ return fills.some(function(f){ return f!=null; }); },
          lock:function(){ Object.keys(chips).forEach(function(k){chips[k].disabled=true;}); blEls.forEach(function(b){ if(b){b.disabled=true;} }); },
          kind:'fill'};
}

function buildFlow(ex, onDone){
  var shell = mkAnswerShell();
  var wrap = el('div');
  var step = 0;
  var picks = [];
  var tag = el('span','steptag');
  var q = el('div','fq');
  var opts = el('div');
  var res = el('div','res'); res.style.display='none';
  var optEls = [];
  var optOrder = ex.steps.map(function(st){ return shuf(st.opts.map(function(_,i){return i;})); });
  var chosen = null;
  function renderStep(){
    chosen = null;
    tag.textContent = 'STEP '+(step+1)+' OF '+ex.steps.length;
    q.textContent = ex.steps[step].q;
    opts.innerHTML=''; optEls=[];
    optOrder[step].forEach(function(oi,pos){
      var b = el('button','opt'); b.type='button';
      b.appendChild(el('span','key', letters(pos)+'.'));
      b.appendChild(el('span',null, ex.steps[step].opts[oi]));
      b.addEventListener('click', function(){
        if(picks[step]!=null && picks.length>step){ /* allow change before confirm */ }
        if(S.ans[ex.id]){ return; }
        chosen = oi;
        optEls.forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        confirmBtn.disabled = false;
      });
      optEls.push(b); opts.appendChild(b);
    });
    res.style.display='none';
    confirmBtn.disabled = true;
    confirmBtn.textContent = (step===ex.steps.length-1) ? 'Check' : 'Confirm';
    if(picks.length>step && picks[step]!=null && step<ex.steps.length){ /* replay state */ }
  }
  var confirmBtn = el('button','btn primary','Confirm');
  confirmBtn.addEventListener('click', function(){
    if(S.ans[ex.id] || chosen==null){ return; }
    picks[step]=chosen;
    var st = ex.steps[step];
    var ok = chosen===st.ans;
    res.textContent = (ok? '\u2713 ' : '\u2717 ') + (ok? st.resOk : st.resBad);
    res.style.display='';
    if(step===ex.steps.length-1){
      onDone({picks: picks.slice(), maps: optOrder});
    } else {
      step++;
      confirmBtn.disabled = false;
      setTimeout(renderStep, 350);
    }
  });
  wrap.appendChild(tag); wrap.appendChild(q); wrap.appendChild(opts); wrap.appendChild(res);
  var act = el('div','actionrow'); act.appendChild(confirmBtn); wrap.appendChild(act);
  shell.body.appendChild(wrap);
  renderStep();
  return {node:shell.box, getAnswer:function(){ return {picks:picks.slice()}; },
          hasAnswer:function(){ return picks.length===ex.steps.length; },
          lock:function(){ confirmBtn.disabled=true; optEls.forEach(function(x){x.disabled=true;}); },
          kind:'flow', stepTag:tag};
}
/* ---------------- scoring ---------------- */
function iw(ex,i){ return (ex.itemWhy && ex.itemWhy[i]!=null) ? ex.itemWhy[i] : ''; }
function computeResult(ex, A){
  var items=[], H=0, W=0, N=0, i;
  if(ex.type==='qcm' || ex.type==='click'){
    N=1;
    if(A.pick===ex.ans){ H=1; items.push({s:'ok', w:iw(ex,ex.ans)}); }
    else { W=1; items.push({s:'bad', w:iw(ex,A.pick!=null?A.pick:ex.ans)}); }
  } else if(ex.type==='multi'){
    N=ex.ans.length;
    var inSet={}; ex.ans.forEach(function(x){ inSet[x]=1; });
    var pickedSet={}; (A.picks||[]).forEach(function(p){ pickedSet[p]=1; });
    ex.ans.forEach(function(x){
      if(pickedSet[x]){ H++; items.push({s:'ok', w:iw(ex,x)}); }
      else { items.push({s:'miss', w:iw(ex,x)}); }
    });
    (A.picks||[]).forEach(function(p){ if(!inSet[p]){ W++; items.push({s:'bad', w:iw(ex,p)}); } });
  } else if(ex.type==='dnd'){
    if(ex.slotMode==='multi'){
      N=ex.bank.length;
      for(i=0;i<N;i++){
        var as = A.assigned ? A.assigned[i] : null;
        if(as==null){ items.push({s:'miss', w:iw(ex,i)}); }
        else if(as===ex.map[i]){ H++; items.push({s:'ok', w:iw(ex,i)}); }
        else { W++; items.push({s:'bad', w:iw(ex,i)+' (You placed it under: '+ex.slots[as]+')'}); }
      }
    } else {
      N=ex.slots.length;
      for(i=0;i<N;i++){
        var b = A.slots ? A.slots[i] : null;
        if(b==null){ items.push({s:'miss', w:iw(ex,i)}); }
        else if(b===ex.map[i]){ H++; items.push({s:'ok', w:iw(ex,i)}); }
        else { W++; items.push({s:'bad', w:iw(ex,i)+' (You placed: '+ex.bank[b]+')'}); }
      }
    }
  } else if(ex.type==='order'){
    N=ex.rows.length;
    for(i=0;i<N;i++){
      if(A.order && A.order[i]===ex.order[i]){ H++; items.push({s:'ok', w:iw(ex,i)}); }
      else { W++; items.push({s:'bad', w:iw(ex,i)+' (Correct here: '+ex.rows[ex.order[i]]+')'}); }
    }
  } else if(ex.type==='fill'){
    N=ex.blanks.length;
    for(i=0;i<N;i++){
      var v = A.fills ? A.fills[i] : null;
      if(v==null){ items.push({s:'miss', w:iw(ex,i)}); }
      else if(v===ex.blanks[i]){ H++; items.push({s:'ok', w:iw(ex,i)}); }
      else { W++; items.push({s:'bad', w:iw(ex,i)+' (You used: '+v+')'}); }
    }
  } else if(ex.type==='flow'){
    N=ex.steps.length;
    for(i=0;i<N;i++){
      var p = A.picks ? A.picks[i] : null;
      if(p===ex.steps[i].ans){ H++; items.push({s:'ok', w:iw(ex,i)}); }
      else { W++; items.push({s:'bad', w:iw(ex,i)}); }
    }
  }
  return {credit: scoreExercise(H,W,N), items: items, H:H, W:W, N:N};
}

/* ---------------- header ---------------- */
function buildHeader(){
  var hd = $('hdr'); hd.innerHTML='';
  var g1 = el('div','grp');
  g1.appendChild(el('span','count','\u2014'));
  var bd = el('span','badge', CFG.sevLabel);
  g1.appendChild(bd);
  hd.appendChild(g1);
  var g2 = el('div','grp');
  g2.appendChild(el('span','timerbox', fmt(S.remaining)));
  var ts = el('span','tstate '+stateClass()); ts.id='tstate'; ts.textContent = stateWord();
  g2.appendChild(ts);
  hd.appendChild(g2);
  var g3 = el('div','grp');
  var sc = el('span','scorebox','0.0 / 0 \u00B7 0%'); sc.id='scorebox';
  g3.appendChild(sc);
  hd.appendChild(g3);
  hd.appendChild(el('span','spacer'));
  var g4 = el('div','grp');
  var hb = el('button','btn','Hint'); hb.id='hintbtn'; hb.setAttribute('aria-label','Show one hint (costs 10 percent of this exercise credit)');
  hb.addEventListener('click', onHint);
  var pb = el('button','btn warn','\u23F8 Pause'); pb.id='pausebtn'; pb.setAttribute('aria-label','Manual pause');
  pb.addEventListener('click', onPause);
  var sb = el('button','btn','Skip'); sb.id='skipbtn'; sb.setAttribute('aria-label','Skip this exercise and answer it later');
  sb.addEventListener('click', onSkip);
  var fb = el('button','btn','Finish'); fb.id='finishbtn'; fb.setAttribute('aria-label','Finish the exam and review skipped exercises');
  fb.addEventListener('click', onFinish);
  g4.appendChild(hb); g4.appendChild(pb); g4.appendChild(sb); g4.appendChild(fb);
  hd.appendChild(g4);
}
function updateHeader(){
  var cnt = document.querySelector('#hdr .count');
  var idx = S.inReview ? null : S.cur;
  if(idx==null || !S.seq.length){ }
  if(S.inReview){ cnt.textContent = 'Review'; }
  else if(S.seq.length){ cnt.textContent = 'Exercise '+(S.cur+1)+' of '+S.seq.length; }
  var sc = $('scorebox');
  if(sc){ sc.textContent = S.creditSum.toFixed(1)+' / '+S.answered+' \u00B7 '+(S.answered? Math.round((S.creditSum/S.answered)*100):0)+'%'; }
  var hb=$('hintbtn'), sb=$('skipbtn');
  var ex = curEx();
  if(ex){
    var graded = !!S.ans[ex.id];
    if(hb){ hb.disabled = graded || !!S.hints[ex.id]; }
    if(sb){ sb.disabled = graded; }
  }
  renderTState();
}
function renderTState(){
  var ts = $('tstate');
  if(!ts){ return; }
  ts.textContent = stateWord();
  ts.className = 'tstate '+stateClass();
  var tb = document.querySelector('#hdr .timerbox');
  if(tb){ tb.textContent = fmt(S.remaining); }
}

/* ---------------- exam flow ---------------- */
function curEx(){ return S.seq[S.cur] != null ? EXS[S.seq[S.cur]] : null; }
var WIDGET = null;
var REVIEW_RETURN = false;

function showExercise(ix){
  S.cur = ix;
  var ex = curEx();
  var scr = $('scr-exam'); scr.innerHTML='';
  var root = el('div');
  if(S.inReview){
    var banner = el('div','note','Review mode \u2014 you are answering a skipped exercise. The timer runs until you press Check.');
    root.appendChild(banner);
  }
  root.appendChild(buildScenario(ex));
  root.appendChild(buildQuestion(ex));
  var widget;
  if(ex.type==='qcm'){ widget = buildChoice(ex,false); }
  else if(ex.type==='multi'){ widget = buildChoice(ex,true); }
  else if(ex.type==='click'){ widget = buildClick(ex); }
  else if(ex.type==='dnd'){ widget = buildDnD(ex); }
  else if(ex.type==='order'){ widget = buildOrder(ex); }
  else if(ex.type==='fill'){ widget = buildFill(ex); }
  else if(ex.type==='flow'){ widget = buildFlow(ex, onFlowDone); }
  WIDGET = widget;
  root.appendChild(widget.node);

  var act = el('div','actionrow');
  var check = el('button','btn primary','Check'); check.id='checkbtn';
  check.setAttribute('aria-label','Check the answer');
  check.disabled = !(ex.type==='flow');
  check.addEventListener('click', onCheck);
  var next = el('button','btn hidden'); next.id='nextbtn';
  next.addEventListener('click', onNext);
  if(ex.type==='flow'){ check.classList.add('hidden'); }
  act.appendChild(check); act.appendChild(next);
  root.appendChild(act);
  if(S.hints[ex.id]){ showHintText(ex); }
  scr.appendChild(root);
  S.sel[ex.id] = null;
  if(ex.type!=='flow'){
    var iv = setInterval(function(){
      if(!WIDGET || WIDGET!==widget){ clearInterval(iv); return; }
      if(!S.ans[ex.id]){ check.disabled = !widget.hasAnswer(); }
      else { clearInterval(iv); }
    }, 250);
  }
  updateHeader();
  window.scrollTo(0,0);
}
function onFlowDone(A){
  S.sel[curEx().id] = A;
  onCheck();
}
function onCheck(){
  var ex = curEx();
  if(!ex || S.ans[ex.id]){ return; }
  var A = S.sel[ex.id] || (WIDGET ? WIDGET.getAnswer() : null);
  if(!A && ex.type!=='flow'){ return; }
  var r = computeResult(ex, A);
  var credit = r.credit;
  var hintPenalty = false;
  if(S.hints[ex.id]){ credit = Math.max(0, credit-0.10); hintPenalty=true; }
  S.ans[ex.id] = {credit: credit, r: r, hintPenalty: hintPenalty, id: ex.id};
  S.creditSum += credit; S.answered++;
  var pi = S.pool.indexOf(ex.id);
  if(pi>-1){ S.pool.splice(pi,1); }
  setState('PAUSED_AUTO_CHECK');
  renderFeedback(ex, S.ans[ex.id]);
  if(WIDGET && WIDGET.lock){ WIDGET.lock(); }
  var cb=$('checkbtn'), nb=$('nextbtn');
  if(cb){ cb.disabled=true; }
  if(nb){
    var lastPos = !S.inReview && (S.cur >= S.seq.length-1);
    nb.textContent = (lastPos && S.pool.length===0) ? 'Final Submit' : 'Next';
    nb.classList.remove('hidden');
    nb.focus();
  }
  updateHeader();
}
function renderFeedback(ex, res){
  var old = document.querySelector('#scr-exam .fb');
  if(old){ old.remove(); }
  var fb = el('div','fb');
  var label, cls;
  if(res.credit>=0.999){ label='\u2713 CORRECT'; cls='ok'; }
  else if(res.credit>0){ label='\u2713 PARTIALLY CORRECT'; cls='part'; }
  else { label='\u2717 INCORRECT'; cls='bad'; }
  fb.className='fb '+cls;
  var h = el('div','fb-h', label);
  fb.appendChild(h);
  var b = el('div','fb-b');
  if(res.r.N>1){
    b.appendChild(el('div','credline','credit '+res.credit.toFixed(2)+' \u2014 '+res.r.H+'/'+res.r.N+' items \u00B7 formula: max(0, (H \u2212 W) / N) = max(0, ('+res.r.H+' \u2212 '+res.r.W+') / '+res.r.N+')'));
  } else {
    b.appendChild(el('div','credline','credit '+res.credit.toFixed(2)));
  }
  if(res.r.N>1){
    var ul = el('ul','items');
    res.r.items.forEach(function(it){
      var li = el('li');
      var ic = it.s==='ok' ? el('span','s-ok','\u2713 Correct') : (it.s==='bad' ? el('span','s-bad','\u2717 Wrong') : el('span','s-miss','\u25CB Missed'));
      var w = it.w || '';
      if(it.s==='miss' && w.slice(0,10)==='Correct \u2014 '){ w = w.slice(10); }
      li.appendChild(ic);
      li.appendChild(el('span',null, w));
      ul.appendChild(li);
    });
    b.appendChild(ul);
  } else if(res.credit<0.999){
    var okIdx = ex.ans;
    if(ex.type==='click'){ b.appendChild(el('div','credline','Correct answer: \u201C'+ex.clickLines[ex.ans]+'\u201D')); }
    else { b.appendChild(el('div','credline','Correct answer: '+ex.opts[okIdx])); }
  }
  b.appendChild(el('p',null, ex.exp));
  var st = el('div','study'); st.textContent='What to study: '+ex.study;
  b.appendChild(st);
  if(res.hintPenalty){ b.appendChild(el('div','hintnote','Hint used: \u22120.10 credit applied to this exercise.')); }
  fb.appendChild(b);
  $('scr-exam').appendChild(fb);
}
function onNext(){
  var ex = curEx();
  if(ex && !S.ans[ex.id]){ return; }
  if(S.inReview){
    S.inReview = false;
    enterReview();
    setRunning();
    return;
  }
  setRunning();
  if(S.cur < S.seq.length-1){ showExercise(S.cur+1); }
  else { afterSequence(); }
}
function onSkip(){
  var ex = curEx();
  if(!ex || S.ans[ex.id]){ return; }
  if(S.pool.indexOf(ex.id)<0){ S.pool.push(ex.id); }
  if(S.inReview){ S.inReview=false; enterReview(); return; }
  if(S.cur < S.seq.length-1){ showExercise(S.cur+1); }
  else { afterSequence(); }
}
function onHint(){
  var ex = curEx();
  if(!ex || S.ans[ex.id] || S.hints[ex.id]){ return; }
  S.hints[ex.id]=true;
  showHintText(ex);
  updateHeader();
}
function showHintText(ex){
  var root = $('scr-exam');
  var old = root.querySelector('.hintbox');
  if(old){ old.remove(); }
  var hb = el('div','hintbox');
  hb.appendChild(el('strong',null,'Hint: '));
  hb.appendChild(document.createTextNode(ex.hint));
  var anchor = root.querySelector('.blk.ansr');
  if(anchor && anchor.parentNode){ anchor.parentNode.insertBefore(hb, anchor.nextSibling); }
  else { root.appendChild(hb); }
}
function onPause(){
  if(S.state==='RUNNING' || S.state==='PAUSED_AUTO_CHECK'){
    S.prevAuto = (S.state==='PAUSED_AUTO_CHECK');
    setState('PAUSED_MANUAL');
    var sh = el('div','shade'); sh.id='pauseshade';
    var inner = el('div','inner');
    inner.appendChild(el('div','big','\u23F8 PAUSED \u2014 manual break'));
    inner.appendChild(el('div','sm','The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.'));
    var rb = el('button','btn primary','\u25B6 Resume');
    rb.addEventListener('click', function(){
      sh.remove();
      setState(S.prevAuto ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
      renderTState();
    });
    inner.appendChild(rb);
    sh.appendChild(inner);
    document.body.appendChild(sh);
    renderTState();
  }
}
function afterSequence(){
  if(S.pool.length){ enterReview(); }
  else { showResults(); }
}
function onFinish(){
  if(S.pool.length===0 && S.answered===S.seq.length){ showResults(); return; }
  if(S.pool.length){ enterReview(); }
  else { showResults(); }
}

/* ---------------- review screen ---------------- */
function enterReview(){
  S.inReview = false;
  var scr = $('scr-review'); scr.innerHTML='';
  var card = el('div','card');
  card.appendChild(el('h2',null,'Review skipped exercises'));
  card.appendChild(el('p','small','You can answer each skipped exercise now. You can return as many times as you want until the timer ends. If you submit while some are still unanswered, they are excluded from the score \u2014 they do not count as wrong.'));
  if(!S.pool.length){
    card.appendChild(el('p',null,'No skipped exercises left. Well done.'));
  }
  S.pool.slice().forEach(function(id){
    var ex = null;
    for(var k=0;k<EXS.length;k++){ if(EXS[k].id===id){ ex=EXS[k]; break; } }
    if(!ex){ return; }
    var row = el('div','rrow');
    row.appendChild(el('div','rt', ex.sum));
    row.appendChild(el('div','rs', ex.scenSum||''));
    var b = el('button','btn primary','Answer now');
    b.addEventListener('click', function(){
      S.inReview = true;
      hideScreens(); $('scr-exam').classList.remove('hidden');
      var pos = -1;
      for(var q=0;q<S.seq.length;q++){ if(EXS[S.seq[q]].id===id){ pos=q; break; } }
      showExercise(pos>-1 ? pos : 0);
    });
    row.appendChild(b);
    card.appendChild(row);
  });
  var act = el('div','actionrow');
  var sub = el('button','btn primary','Submit exam');
  sub.addEventListener('click', showResults);
  act.appendChild(sub);
  if(S.seq.length && S.answered < S.seq.length){
    var back = el('button','btn','Back to exercises');
    back.addEventListener('click', function(){
      S.inReview=false;
      hideScreens(); $('scr-exam').classList.remove('hidden');
      showExercise(nextUnanswered());
    });
    act.appendChild(back);
  }
  card.appendChild(act);
  scr.appendChild(card);
  hideScreens(); scr.classList.remove('hidden');
  updateHeader();
  setRunning();
}
function nextUnanswered(){
  for(var i=0;i<S.seq.length;i++){ if(!S.ans[EXS[S.seq[i]].id]){ return S.seq[i]; } }
  return S.seq.length? S.seq[0] : 0;
}

/* ---------------- results ---------------- */
function showResults(){
  var unanswered = [];
  S.seq.forEach(function(ix){ var ex=EXS[ix]; if(!S.ans[ex.id]){ unanswered.push(ex.id); } });
  var nFull=0, nPart=0, nBad=0, partSum=0;
  S.seq.forEach(function(ix){
    var a = S.ans[EXS[ix].id];
    if(!a){ return; }
    if(a.credit>=0.999){ nFull++; }
    else if(a.credit>0){ nPart++; partSum+=a.credit; }
    else { nBad++; }
  });
  var answered = S.answered;
  var percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  var passed = percent>=CFG.passMark;
  setState('ENDED');
  var scr = $('scr-results'); scr.innerHTML='';
  var card = el('div','card');
  card.appendChild(el('h2',null,'Results \u2014 '+CFG.title));
  var big = el('div','bigr', S.creditSum.toFixed(1)+' / '+answered+' \u00B7 ');
  big.appendChild(el('span','pc', percent+'%'));
  card.appendChild(big);
  var stat = el('div','stat');
  stat.appendChild(el('span','mchip','\u2713 Fully correct: '+nFull));
  stat.appendChild(el('span','mchip','\u2713 Partially correct: '+nPart+(nPart? ' (avg '+ (partSum/nPart).toFixed(2) +')':'')));
  stat.appendChild(el('span','mchip','\u2717 Incorrect: '+nBad));
  stat.appendChild(el('span','mchip','\u26A0 Skipped \u2014 not answered (excluded): '+unanswered.length));
  card.appendChild(stat);
  var pl = el('div','pauselog','Time paused manually: '+fmt(S.pausedManualMs/1000)+' \u00B7 Time paused reviewing feedback: '+fmt(S.pausedAutoMs/1000)+' \u00B7 Pass mark: '+CFG.passMark+'%');
  card.appendChild(pl);
  if(passed){
    var cert = el('div','cert');
    cert.appendChild(el('div','ct','Certificate of achievement'));
    cert.appendChild(el('div','cn',(S.user? S.user+' \u2014 ':'')+'PASSED: '+CFG.title));
    cert.appendChild(el('div','cs','Score '+percent+'% \u2014 above the '+CFG.passMark+'% pass mark. Nice work.'));
    card.appendChild(cert);
  } else {
    var fail = el('div','failbox');
    fail.appendChild(el('div','big','\u2717 NOT PASSED'));
    fail.appendChild(el('div','cs','You must retake this exam. Study the explanations, then try again \u2014 questions and answers will be shuffled.'));
    var rt = el('button','btn primary','Retake Exam');
    rt.style.marginTop='12px';
    rt.addEventListener('click', retake);
    fail.appendChild(rt);
    card.appendChild(fail);
  }
  if(!passed){
    var again = el('div','actionrow');
    var rt2 = el('button','btn primary','Retake Exam');
    rt2.addEventListener('click', retake);
    again.appendChild(rt2); card.appendChild(again);
  }
  scr.appendChild(card);
  hideScreens(); scr.classList.remove('hidden');
  updateHeader();
  reportScore(S.creditSum, answered);
}
function reportScore(creditSum, answeredCount){
  if(S.reported){ return; }
  S.reported = true;
  var percent = answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      batch: CFG.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch(e) { /* opened directly, nothing to report to */ }
}
function retake(){
  S.seq = shuf(EXS.map(function(_,i){ return i; }));
  S.cur=0; S.ans={}; S.pool=[]; S.creditSum=0; S.answered=0;
  S.remaining = CFG.minutes*60;
  S.pausedAutoMs=0; S.pausedManualMs=0;
  S.hints={}; S.sel={}; S.inReview=false; S.reported=false; S.started=true;
  S.state='RUNNING'; S.stateSince=Date.now(); S.prevAuto=false;
  hideScreens(); $('scr-exam').classList.remove('hidden');
  showExercise(0);
}

/* ---------------- intro ---------------- */
function buildIntro(){
  var scr = $('scr-intro'); scr.innerHTML='';
  var c1 = el('div','card');
  c1.appendChild(el('h1',null, CFG.title+' \u2014 practice exam'));
  c1.appendChild(el('span','who',''));
  c1.lastChild.id='who';
  var meta = el('div','meta');
  meta.appendChild(el('span','mchip', EXS.length+' exercises'));
  meta.appendChild(el('span','mchip', CFG.minutes+' minutes'));
  meta.appendChild(el('span','mchip','Pass mark '+CFG.passMark+'%'));
  meta.appendChild(el('span','mchip','Tier '+CFG.batch+' of 4'));
  meta.appendChild(el('span','mchip','Object: M1047 \u2014 Audit (Mitigation)'));
  c1.appendChild(meta);
  c1.appendChild(el('p','small', CFG.intro.sevNote));
  scr.appendChild(c1);

  var c2 = el('div','card');
  c2.appendChild(el('h2',null,'About M1047 \u2014 Audit (a Mitigation)'));
  CFG.intro.entity.forEach(function(p){ c2.appendChild(el('p',null,p)); });
  scr.appendChild(c2);

  var c3 = el('div','card');
  c3.appendChild(el('h2',null,'Keywords covered'));
  c3.appendChild(el('p','small','These concepts come from the M1047 ATT&CK page. The exercises use them.'));
  var kt = el('div','kthemes');
  CFG.themes.forEach(function(t){
    var box = el('div','ktheme');
    box.appendChild(el('div','kn',t.name));
    var ch = el('div','kchips');
    t.chips.forEach(function(x){ ch.appendChild(el('span','kchip',x)); });
    box.appendChild(ch);
    kt.appendChild(box);
  });
  c3.appendChild(kt);
  scr.appendChild(c3);

  var c4 = el('div','card');
  c4.appendChild(el('h2',null,'How this exam works'));
  var ul = el('ul','plain');
  CFG.intro.rules.forEach(function(r){ var li=el('li'); li.innerHTML=r; ul.appendChild(li); });
  c4.appendChild(ul);
  var act = el('div','actionrow');
  var start = el('button','btn primary','Start the exam');
  start.addEventListener('click', function(){
    S.seq = shuf(EXS.map(function(_,i){ return i; }));
    S.state='RUNNING'; S.stateSince=Date.now(); S.started=true;
    hideScreens(); $('scr-exam').classList.remove('hidden');
    showExercise(0);
  });
  act.appendChild(start);
  c4.appendChild(act);
  scr.appendChild(c4);
}

/* ---------------- timer ---------------- */
function tick(){
  if(!S.started){ return; }
  if(S.state==='RUNNING'){
    S.remaining -= 1;
    if(S.remaining<=0){
      S.remaining=0;
      renderTState();
      setState('ENDED');
      var sh = document.getElementById('pauseshade'); if(sh){ sh.remove(); }
      showResults();
      return;
    }
    var tb = document.querySelector('#hdr .timerbox');
    if(tb){ tb.textContent = fmt(S.remaining); }
  }
}

/* ---------------- handshake ---------------- */
window.addEventListener('message', function(ev){
  if(!ev.data){ return; }
  if(ev.data.type!=='CYBERPULSE_INIT' && ev.data.type!=='CYBERMASTERY_INIT'){ return; }
  try {
    if(ev.data.username){
      S.user = String(ev.data.username).slice(0,60);
      var w = $('who');
      if(w){ w.textContent = 'Welcome, '+S.user+'. '; }
    }
  } catch(e){}
});

/* ---------------- boot ---------------- */
function hideScreens(){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(id){ $(id).classList.add('hidden'); });
}
buildHeader();
buildIntro();
hideScreens(); $('scr-intro').classList.remove('hidden');
updateHeader();
S.stateSince = Date.now();
S.tick = setInterval(tick, 1000);
})();

</script>
