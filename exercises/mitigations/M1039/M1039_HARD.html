<script>
window.__EXAM__ = {"meta":{"topicId":"m1039","batch":3,"title":"M1039 Environment Variable Permissions — HARD","objId":"M1039","objName":"Environment Variable Permissions","objType":"Mitigation","sevKey":"hard","sevWord":"HARD","questionCount":17,"estimatedMinutes":40,"timerSec":2400,"passMark":70},"intro":{"paras":["This HARD exam treats you like the senior on shift. Scenarios carry several artefacts that must be read together, answers have near-miss options that are defensible in a different context, and at least a third of the 'obvious' answers are wrong on purpose.","The object is still M1039 — Environment Variable Permissions, a mitigation: it protects environment variables from unauthorised change. Its world: root-owned env configuration (/etc/environment, /etc/profile, profile.d drop-ins, shell start-up files), read-only history variables (HISTFILE, HISTSIZE, HISTFILESIZE, HISTCONTROL), the auditd measure that records every change, and the attacker family it fights: T1070.003 Clear Command History and T1690 Prevent Command History Logging under Defense Evasion.","What changes here is the quality of the distractors. A wrong answer will often be a real technique or a real tool — just not the one this evidence supports. You will weigh signals: an auditd uid against a change ticket, a hash against a deploy job, a vendor README against file modes. Sometimes the right move is the least aggressive one; sometimes it is preserving evidence before fixing anything.","You will also write one real configuration command in a simulated root shell — the write-access measure is, literally, a shell command. Nothing executes for real, but the grading is strict about elements: right tool, right owner, right mode, right targets.","Read every artefact before answering. On this level, discipline beats speed."],"uses":["Incident response: suppress-vs-clear discrimination with auditd evidence.","Control design: picking the least aggressive fix that actually closes the gap.","Coverage analysis: what M1039 does not stop (--norc shells, root, SIGKILL exits).","Detection engineering: auditd -p filters, keys, and honest baselines.","Evidence handling: preserve before you remediate, always."],"rules":["The pass mark is 70%. If your final percentage is 70% or higher, you PASS. Below that, you FAIL and should retake the exam.","This file has 17 exercises. The types are: single choice, multi-select, matching, fill-in-the-blank, click-the-wrong-line, ordering, drag-and-drop, a branching scenario, and one terminal exercise.","A countdown timer runs for 40 minutes. The Pause button stops the timer and hides the exercise — use it for a real break.","When you press Check, the timer stops by itself so you can study the feedback with no pressure. It starts again only when you press Next.","Multi-answer exercises give partial credit: (correct picks minus wrong picks) divided by the number of correct items. Selecting everything does not help — wrong picks subtract.","One hint per exercise is allowed; it costs 10% of that exercise's credit. HARD hints only remove one wrong path — they never name the answer.","Skip moves an exercise to a skipped pool without showing the answer. Before you finish, you can return to skipped exercises as often as you like while the timer runs. Skipped-and-never-answered exercises are excluded from the score.","In the terminal exercise, type the command and press Enter to run it (simulated), then press Check. Grading is element-based with partial credit. Nothing real is executed."]},"keywords":[{"theme":"Attacker behaviour in evidence","chips":["T1070.003 Clear Command History","T1690-style suppression","HISTFILE=/dev/null","history -c","cat /dev/null > ~/.bash_history","empty /root/.bash_history"]},{"theme":"M1039 control surface","chips":["Restrict Write Access","chown root:root","chmod 644","readonly HISTFILE","systemd EnvironmentFile","/etc/profile.d drop-ins"]},{"theme":"Audit & detection","chips":["auditd","-p wa","-k env_change","ausearch","uid vs auid","FIM baselines","deploy-job correlation"]},{"theme":"Limits & bypasses","chips":["bash --norc","non-interactive shells","kill -9 exit","root bypass","auditd records, never blocks"]},{"theme":"Judgement patterns","chips":["least aggressive fix","preserve before remediate","benign-but-alarming","alarming-but-benign","evidence pack"]}],"exercises":[{"id":"H01","type":"qcm","title":"EMPTY-HIST: what does the evidence support?","scenario":[{"kind":"text","content":"03:12, incident EMPTY-HIST. During triage of prod-web-01 you discover that /root/.bash_history is empty. Three artefacts are already collected:"},{"kind":"code","label":"ARTEFACT 1 — /etc/profile.d/99-hist.sh (current content)","content":"# history lockdown\nreadonly HISTFILE\nreadonly HISTSIZE\nreadonly HISTFILESIZE"},{"kind":"log","label":"ARTEFACT 2 — auditd, key env_change, last 24 h","content":"02:58:11  uid=1002 auid=1002 comm=bash exe=\"/usr/bin/bash\"\n          name=\"/etc/profile.d/99-hist.sh\" op=write  key=env_change\n02:58:12  uid=1002 auid=1002 comm=tee exe=\"/usr/bin/tee\"\n          name=\"/etc/profile.d/99-hist.sh\" op=open write  key=env_change"},{"kind":"table","label":"ARTEFACT 3 — account context (CMDB)","head":["uid","account","note"],"rows":[["1002","buildsvc","CI deploy account; interactive logins normally denied"],["0","root","no root sessions logged in this window"]]}],"question":"Which single conclusion is best supported by the three artefacts together?","options":[{"k":"A","t":"The buildsvc account rewrote the history lockdown at 02:58 — that explains the empty history; treat as suspicious and escalate"},{"k":"B","t":"An attacker ran history -c as root — classic T1070.003"},{"k":"C","t":"The audit logs are broken — that is why the history looks empty"},{"k":"D","t":"buildsvc owns these files by design, so nothing is wrong"}],"answer":"A","correctWhy":"The audit trail shows a non-root service account — which should never log in interactively — writing to the lockdown script, minutes before root's history goes empty. The artefacts connect cause and effect; escalation is the supported move.","distractWhy":"B: the artefacts show no root session and no history -c — do not reach for the famous technique when the evidence points elsewhere. C: the audit lines are intact; they are exactly what tells the story. D: 'by design' needs a ticket or repo commit, and interactive write access for a deploy account is itself the anomaly.","explain":"Read artefacts as a chain: who (uid 1002), what (write to 99-hist.sh), when (02:58), context (service account, no root sessions), effect (empty root history). The chain is the conclusion. Root-run history -c would have looked different in the audit trail.","hint":"Which account does the write, and is that account allowed to have interactive shells at all?","study":"Correlating auditd identity fields with CMDB context before naming a technique."},{"id":"H02","type":"branch","title":"Friday 23:47 — alarm or change window?","scenario":[{"kind":"text","content":"23:47 Friday. FIM: /etc/environment changed on app-07. You are alone on shift, and three signals arrive almost together."},{"kind":"log","label":"ARTEFACT 1 — FIM","content":"23:47:01  /etc/environment  content changed on app-07\n          diff: + HISTCONTROL=ignoreboth"},{"kind":"log","label":"ARTEFACT 2 — CMDB","content":"CHG-4471  \"quarterly env standardization\"\n          window: 22:00–02:00  hosts: app-05..app-09\n          executor: config-mgmt pipeline (job id per host)"},{"kind":"log","label":"ARTEFACT 3 — EDR on app-07","content":"no suspicious process activity in the last 24 h\nlast interactive login: 6 days ago (admin, VPN)"}],"question":"Weigh the signals. Four decisions, graded together at the end.","steps":[{"q":"STEP 1 — Which signal should you weigh first?","options":["The content diff — what exactly changed","The FIM alert itself","The silence from EDR","The day of the week"],"answer":0,"why":"Content decides everything: if the change matches the approved standard, the alert is explainable; if not, no window will save it."},{"q":"STEP 2 — The diff line matches the new standard rollout document. What confirms legitimacy fastest?","options":["Match the write to the deploy job id that CHG-4471 ran on app-07","Reboot app-07 and see","Revert the change first, ask later","Ask the newest intern"],"answer":0,"why":"A deploy job id ties the file write to the approved change — a two-minute check that turns three signals into one story."},{"q":"STEP 3 — CI logs show deploy job 8812 (CHG-4471) wrote the file at 23:47:02 as uid 0. What now?","options":["Close as an authorized change and tune FIM to auto-correlate with change records","Isolate app-07 — changes are changes","Delete the change record","Re-image the fleet"],"answer":0,"why":"The story is complete: approved window, matching content, matching job, no hostile activity. The correct move is to make future alerts smarter, not to punish a healthy host."},{"q":"STEP 4 — Which control upgrade prevents the next manual Friday-night check?","options":["Auto-correlate FIM env-file alerts with change-management records","Disable FIM for env files","Send alerts only on weekdays","Give CI broader root access"],"answer":0,"why":"Correlation removes the false-positive class at the source. The other three options reduce your visibility or widen access — the opposite of hardening."}],"explain":"This is the benign-but-alarming pattern: a scary-looking alert resolved by weighing content first, then provenance. The skill is resisting the escalation reflex until the chain (window, content, job id) is complete — and then still improving the detection.","hint":"Which artefact can actually contradict the other two?","study":"Signal weighing: content vs window vs EDR; FIM/change-management correlation."},{"id":"H03","type":"branch","title":"The unit file that trusts a user-owned file","scenario":[{"kind":"text","content":"A legacy service runs as root. The vendor refuses any change to their binary. You found the following during a config review:"},{"kind":"code","label":"ARTEFACT 1 — /etc/systemd/system/legacy-app.service (excerpt)","content":"[Service]\nUser=root\nEnvironmentFile=/opt/app/app.env\nExecStart=/opt/app/server"},{"kind":"code","label":"ARTEFACT 2 — permissions","content":"$ ls -l /opt/app/app.env /opt/app\n-rw-r--r-- 1 appuser appuser 342 app.env\n     (directory /opt/app owned by appuser, 0775)"}],"question":"Two decisions. Graded together at the end.","steps":[{"q":"STEP 1 — What is the residual risk here?","options":["A non-root user controls variables that a root process ingests — settings can be injected into a privileged service","The app cannot start","Logs will grow too fast","The vendor loses revenue"],"answer":0,"why":"EnvironmentFile is read by the root service. Whoever can rewrite that file injects settings into a privileged process — the exact integrity problem M1039 exists to stop."},{"q":"STEP 2 — Which fix respects the vendor constraint and the write-access measure?","options":["Root-owned directory; appuser writes only its own dedicated file outside root-executed config; the unit ingests the minimum keys","chmod 666 the unit file as well","Give appuser passwordless sudo","Disable the service until EOL"],"answer":0,"why":"Least privilege plus minimum keys: the root service reads only what it must, from a path non-root users cannot rewrite. The alternatives widen access or break the business."},{"q":"(context) The vendor binary itself cannot be changed. Which principle lets you still fix this?","options":["You protect the configuration path, not the binary — the mitigation acts on files and permissions","You must give up because M1039 needs vendor support","The only fix is a firewall","You must remove root from the server"],"answer":0,"why":"M1039 is a configuration-surface control: ownership, modes and scoping are all under your control without touching the vendor code."}],"explain":"Environment-file injection into a root service is a privilege-escalation pattern. The fix pattern: root owns the directory, the privileged unit reads a root-controlled file, non-root writers get their own scoping. Same measure, different file — the page's list (env config files, systemd service files) covers it.","hint":"Follow the write permission: who can change what the root process will read?","study":"EnvironmentFile hardening for root-run services."},{"id":"H04","type":"terminal","title":"Terminal: enforce the write-access rule","scenario":[{"kind":"text","content":"Host prod-jump-01, Ubuntu 22.04. You are root. The CIS scan failed both central environment configuration files: mode 0666, owner root (mode wrong).\n\nYour job: enforce the M1039 Restrict Write Access rule on BOTH files in one command line. No syntax help at this level — you get the objective and the environment, nothing else.\n\nRules of the box: ownership root:root, mode 0644, both files, one command line."}],"question":"Type the command that fixes ownership and mode for both files, then run it (Enter) and press Check.","shell":{"prompt":"root@prod-jump-01:~#","banner":"prod-jump-01 — bash 5.1 — simulated shell. Type the command and press Enter.","canonical":"chown root:root /etc/environment /etc/profile && chmod 644 /etc/environment /etc/profile","simOut":[{"re":"^chown","out":"chown: changed ownership of '/etc/environment'\nchown: changed ownership of '/etc/profile'"},{"re":"^chmod","out":"(mode updated — verify with: stat -c '%a %U:%G %n' /etc/environment /etc/profile)"},{"re":"^stat|^ls","out":"644 root:root /etc/environment\n644 root:root /etc/profile"}],"elements":[{"label":"tool: chown (ownership first)","re":"\\bchown\\b","why":"Ownership is rule one: root must own the settings."},{"label":"owner spec root:root (or root root)","re":"root:root|root\\s+root","why":"The write-access rule names root as the only owner."},{"label":"tool: chmod (mode second)","re":"\\bchmod\\b","why":"Mode is the second half of the fix."},{"label":"mode 644","re":"\\b644\\b","why":"644 = owner writes, everyone else reads."},{"label":"target /etc/environment","re":"/etc/environment","why":"Both failing files must be covered."},{"label":"target /etc/profile","re":"/etc/profile","why":"The scan failed this file too."}],"anti":[{"label":"mode keeps write for group/others (666/777/646/... )","re":"chmod\\s+(666|777|646|626|606|66[0-7])","why":"Those modes leave write access for non-root users — the gap stays open."},{"label":"chown to a non-root owner","re":"chown\\s+(buildsvc|devuser|appuser|www-data|admin)","why":"The rule requires root ownership."}]},"explain":"Ownership first, then mode — the order matters because a non-root owner could otherwise flip the mode straight back. Both targets in the same command keeps the fix atomic. && chains the two steps in one line; running them as two separate correct commands is also accepted element-wise.","hint":"Two tools, one owner, one mode, two paths. Ownership comes first.","study":"chown/chmod on /etc/environment and /etc/profile; why ownership precedes mode."},{"id":"H05","type":"multi","title":"What the rollout does NOT stop","scenario":[{"kind":"text","content":"The rollout is complete: profile files root-owned 0644, readonly HISTFILE/HISTSIZE/HISTFILESIZE via /etc/profile.d/00-hist.sh, auditd watches active with key env_change.\n\nYour red team asks the honest question: what still works for them?"}],"question":"Select all the bypasses that remain viable after this rollout.","options":[{"k":"A","t":"Start an interactive shell with bash --norc so start-up files — and the lockdown — never load"},{"k":"B","t":"Anything running as root can undo the lockdown; root stands above the control"},{"k":"C","t":"Kill the shell with kill -9: bash dies before the clean-exit history flush"},{"k":"D","t":"readonly shell variables cannot be changed by root"},{"k":"E","t":"M1039 encrypts .bash_history at rest"},{"k":"F","t":"auditd blocks writes to /etc/environment"}],"correct":["A","B","C"],"itemNotes":{"A":"Start-up files only load for normal shells. bash --norc skips them, so the readonly lines never run. Coverage needs pairing with shell-audit telemetry.","B":"Root can chattr, chown, edit or replace anything. The mitigation targets unauthorised (non-root) tampering — its honest limit.","C":"Bash writes history during a clean exit. SIGKILL skips that path, so the session's commands never land in the file — a known gap you compensate with process monitoring."},"distractNotes":{"D":"readonly is an attribute of a shell variable in one session; root can start a fresh shell and rewrite the defining files.","E":"History files are plain text; M1039 is about permissions, not encryption.","F":"auditd records; it does not prevent. Prevention here is the file permission layer."},"explain":"Every control has a coverage edge. Naming the edges (--norc shells, root, SIGKILL) is what separates a control owner from a checkbox filler — and each edge points to a compensating detective control.","hint":"One option confuses 'prevents' with 'records', one confuses permissions with encryption.","study":"Known limits of env-permission hardening and their compensating detections."},{"id":"H06","type":"qcm","title":"Least aggressive fix on a fragile legacy host","scenario":[{"kind":"text","content":"Host vault-legacy: a prod system the vendor refuses to touch, no restarts allowed tonight, end-of-life project already planned in 8 months.\n\nFinding: /etc/profile is 0666. The vendor doc says profile edits are 'safe anytime'."}],"question":"Which action is correct — the least aggressive one that actually closes the gap?","options":[{"k":"A","t":"chown root:root and chmod 644 now — seconds to apply, reversible, no downtime"},{"k":"B","t":"chattr +i /etc/profile to make it immutable until the EOL project decides"},{"k":"C","t":"Rebuild the host tonight before any other work"},{"k":"D","t":"Accept the risk until end-of-life in 8 months"}],"answer":"A","correctWhy":"The least aggressive action that fixes the finding wins. chown+chmod needs no downtime, changes no behaviour the app relies on, and is fully reversible if the vendor ever objects.","distractWhy":"chattr +i is stronger than the finding requires and will break the next legitimate update that rewrites the file — a hidden outage. A rebuild tonight is a sledgehammer for a permissions fix. Accepting an open write hole for 8 months is not a control.","explain":"HARD trap type: the correct action is the least aggressive one. Aggression in change management is measured in blast radius and reversibility — chown/chmod has almost none, chattr has delayed failures, rebuilds and risk-acceptance have the most.","hint":"Rank the four options by blast radius and reversibility, not by strength.","study":"Choosing the minimal effective remediation."},{"id":"H07","type":"order","title":"Response order: the departed contractor","scenario":[{"kind":"text","content":"Context: a contractor's account — offboarded last week — is linked to edits of the history lockdown on two hosts. The SOC lead asks for your sequence before you act."}],"question":"Put the five response actions in the correct order.","items":["Preserve evidence: copy the modified env files and the auditd output","Disable the contractor's account and active sessions","Search the fleet for the same pattern (env_change hits, HISTFILE edits)","Restore clean, root-owned env files and re-lock the permissions","Update detections and write the incident lessons"],"correctOrder":[0,1,2,3,4],"itemNotes":{"0":"Evidence first: accounts and fixes destroy state; copies do not.","1":"Contain the actor — but only after the copies exist, because disabling may tip off accomplices or lock you out of live state.","2":"Scope before cleanup: you need to know how many hosts carry the pattern.","3":"Now remediate known-affected hosts.","4":"Close the loop: analytics for next time, lessons for the report."},"explain":"Preserve, contain, scope, remediate, improve. The classic failure is remediating first — it feels productive and quietly deletes the evidence and the scope answer.","hint":"Two actions destroy state (fixing, disabling). They must not come before the actions that capture state.","study":"IR sequencing for config-tamper incidents."},{"id":"H08","type":"spot","title":"The watch rule that cannot catch writes","scenario":[{"kind":"code","label":"ARTEFACT 1 — /etc/audit/rules.d/env.rules (candidate change)","content":"-w /etc/environment -p wa -k env_change\n-w /etc/profile -p wa -k env_change\n-w /etc/profile.d -p wa -k env_change\n-w /etc/environment -p r -k env_change"}],"question":"Click the line that will NOT catch the changes it is meant to catch.","lines":["-w /etc/environment -p wa -k env_change","-w /etc/profile -p wa -k env_change","-w /etc/profile.d -p wa -k env_change","-w /etc/environment -p r -k env_change"],"answerIdx":3,"correctWhy":"-p r watches reads only. A rule with the read filter can never report a write or an attribute change — the very events M1039's audit measure exists for. The correct permission filter is wa (write + attribute).","distractWhy":"Lines 1–3 are the correct pattern: watch (-w), permission filter wa, stable key (-k).","explain":"The -p filter decides which access types the watch reports: r reads, w writes, x executes, a attribute changes. Reads on /etc/environment would also flood you with noise from every login script. wa is the standard for change detection.","hint":"The four permission letters are r, w, x, a. Which single letter never sees a modification?","study":"auditd -p permission filters for watch rules."},{"id":"H09","type":"match","title":"Four recovered snippets, four verdicts","scenario":[{"kind":"text","content":"Before the incident review, match each recovered snippet to its honest verdict. Two of these are attacker actions, one is a training artefact, one is your own control working."}],"question":"Match each snippet to the correct verdict.","left":[{"k":"L1","t":"export HISTSIZE=0 appended to /root/.bashrc — present in no repository"},{"k":"L2","t":"history -c then exit, inside the documented transcript of a threat-hunt workshop"},{"k":"L3","t":"cat /dev/null > ~/.bash_history on prod-web-01 during an active incident"},{"k":"L4","t":"readonly HISTFILE in /etc/profile.d/hardening.sh, root-owned 0644"}],"right":[{"k":"R1","t":"clearing on a live system — indicator removal (T1070.003 pattern)"},{"k":"R2","t":"the control working as intended (M1039)"},{"k":"R3","t":"benign — a teaching exercise, no incident"},{"k":"R4","t":"suppression — treat as compromise evidence (T1690 pattern)"}],"pairs":{"L1":"R4","L2":"R3","L3":"R1","L4":"R2"},"itemNotes":{"L1":"Zeroing HISTSIZE in root's start-up file, outside any repo, is suppression of future logging — preserve and escalate.","L2":"Same command, completely different context: a documented training transcript explains it. Context decides, not the keyword.","L3":"Truncating the history file during an incident destroys existing evidence — the T1070.003 pattern on a live system.","L4":"This line is the defence itself: a root-owned profile enforcing a read-only history variable."},"explain":"The same command can be an attack, a lesson or a control — the verdict comes from context: who ran it, where, against which baseline. That is exactly why the audit measure records identity, not just file names.","hint":"One snippet has a documented explanation. Two run on hosts where no documentation explains them.","study":"Context-based verdicts on history-manipulation artefacts."},{"id":"H10","type":"multi","title":"Red team: bypass without root","scenario":[{"kind":"text","content":"Same hardened host as before: root-owned profile files, readonly history variables, auditd watches. The red team restricts itself to a standard low-privilege shell account. Which two approaches still reduce or avoid command-history logging?"}],"question":"Select the two viable low-privilege bypasses.","options":[{"k":"A","t":"Run an interactive shell with bash --norc so the start-up files never load"},{"k":"B","t":"Run commands from a non-interactive script — non-interactive shells do not save history anyway"},{"k":"C","t":"Delete /etc/environment"},{"k":"D","t":"Edit HISTCONTROL inside ~/.bashrc"}],"correct":["A","B"],"itemNotes":{"A":"--norc skips user and system start-up files, so the readonly lines never execute in that session.","B":"Bash only records history for interactive sessions; scripted or piped runs leave no shell history by design — an operational blind spot, not a permission problem."},"distractNotes":{"C":"The files are root:root 0644 — a low-privilege account cannot delete them. The write-access measure holds.","D":"Same reason: the user can no longer write their start-up files, so they cannot edit the variable there."},"explain":"Notice what the hardening DID achieve: the two classic file-edit tricks (C, D) are dead. What remains are coverage edges — shells that bypass start-up files, and modes of running commands that never had history. Both point to compensating detections (shell-arg telemetry, process monitoring), not stronger file modes.","hint":"Two options require writing to files that are no longer writable by this account.","study":"Coverage edges after hardening: --norc, non-interactive execution."},{"id":"H11","type":"qcm","title":"The harmless README that is not harmless","scenario":[{"kind":"log","label":"ARTEFACT 1 — stat on sync host","content":"/home/shared/.bash_profile\n  Access: (0777/-rwxrwxrwx)  Uid: (1122/ svc-sync)  Gid: (1122/ svc-sync)\n  Modify: changes every ~60 minutes"},{"kind":"code","label":"ARTEFACT 2 — vendor README","content":"dotfile-sync agent v3\n\"Keeps user profiles uniform across the fleet.\nHarmless by design. No action required.\""}],"question":"The file looks documented and boring. What is the right call?","options":[{"k":"A","t":"Escalate: a world-writable profile file rewritten hourly by a service account defeats the write-access measure and could inject settings into every user it touches — verify owner, source repo and job"},{"k":"B","t":"Close it — the README says it is harmless"},{"k":"C","t":"Delete the agent from all hosts immediately"},{"k":"D","t":"chmod 000 the file so nobody can read it"}],"answer":"A","correctWhy":"A vendor README is a claim, not evidence. 0777 on a login-time file plus hourly rewrites is a standing injection point into user shells; the write-access measure is being defeated by design. Verify provenance, then re-architect the sync.","distractWhy":"Documentation does not override file modes. Mass deletion without scoping can break logins fleet-wide and destroys evidence. chmod 000 breaks the file for every reader including legitimate tooling.","explain":"This is the benign-looking-alarming trap: nothing about it screams 'hack', yet the mechanical effect (world-writable profile, rewritten hourly) is identical to an attacker's dream. Controls are verified against states and behaviour, not READMEs.","hint":"Separate the claim from the state. What does the file system actually say?","study":"Verifying vendor agents against the write-access measure."},{"id":"H12","type":"dnd","title":"Which artefact answers which question?","scenario":[{"kind":"text","content":"Evidence-mapping drill before the EMPTY-HIST review. Your lead pins four artefact types on the wall:\n\n\"Every env-file change triggers four questions. Each artefact answers exactly one of them. Mis-mapping them is how analysts jump to conclusions — sort them.\""}],"question":"Drag each artefact under the question it answers.","zones":[{"k":"Z1","t":"Who made the change?"},{"k":"Z2","t":"What exactly changed?"},{"k":"Z3","t":"Was the change approved?"},{"k":"Z4","t":"Is the file in its expected state?"}],"items":["auditd record: uid=1002 auid=1002 comm=tee on the env file","FIM diff: + HISTCONTROL=ignoreboth added to /etc/environment","change calendar: CHG-4471, window 22:00-02:00, hosts app-05..app-09","golden manifest: expected hash 9a77e0 vs actual hash f2c1d8"],"assign":["Z1","Z2","Z3","Z4"],"itemNotes":{"0":"Identity fields (uid, auid, comm) exist to answer 'who' — that is why the audit measure records them on every event.","1":"The content diff shows the exact line added or removed — the 'what' question, answered by no other artefact.","2":"Approval lives in the change calendar: ticket, window, hosts, executor.","3":"Expected-versus-actual hash answers the state question — is the file what the standard says it should be."},"explain":"Four artefacts, four questions: identity (auditd), content (FIM diff), approval (change calendar), state (hash against the golden manifest). An alert is only 'explained' when all four questions have answers — that discipline is what separates triage from guessing, and it is the fastest way to see which artefact is still missing.","hint":"Ask of each artefact: which question can this one answer on its own?","study":"Evidence mapping: identity, content, approval, state."},{"id":"H13","type":"fill","title":"Tune the watch rule","scenario":[{"kind":"text","content":"Detection engineering review. The rule template needs three tokens — and the bank contains near-miss values that would quietly break it."}],"question":"Complete the tuning sentence with words from the bank.","prompt":"Alert on write and attribute changes with -p ___1___, tag the events with -k ___2___, and verify the files stay at mode ___3___ with root:root ownership.","blanks":["wa","env_change","644"],"bank":["wa","r","x","env_change","histctl","644","666","root:root"],"itemNotes":{"1":"w = writes, a = attribute changes (chmod/chown). Reads (r) would flood you; execute (x) is irrelevant here.","2":"A stable key keeps ausearch queries and dashboards consistent across hosts.","3":"0644 is the compliant mode from the write-access measure; 666 is the finding you are guarding against."},"explain":"The audit measure is only as good as its filter, its key and its baseline. Each wrong token in the bank produces a rule that is noisy, unnamed, or blind — the three standard failure modes of watch rules.","hint":"The mode in the bank that is the BAD state is there to catch you.","study":"Watch rule anatomy: -w path -p wa -k key."},{"id":"H14","type":"order","title":"Rank the shift's four findings","scenario":[{"kind":"text","content":"One shift, four findings, one analyst. Rank them by response order."}],"question":"Put the findings in the order you work them.","items":["prod-db-01: root history empty, no ticket","build-05: .zshrc world-writable in the CI image","SIEM: auditd rule pack missing after a package update (fleet-wide blind spot)","intern's .bashrc owned by the intern (mode 600) on a personal dev VM"],"correctOrder":[0,1,2,3],"itemNotes":{"0":"Active suppression evidence on a prod database host — possible live incident, first.","1":"An open write hole in build infrastructure — high, next; the CI image can poison everything it builds.","2":"A fleet-wide detection blind spot — high but not compromise evidence; fix immediately after containment work.","3":"A private, user-owned file on a personal VM — outside M1039's system-file focus and no exposure; last."},"explain":"Ranking = live threat first, then blast radius of the gap, then detection health, then noise. Item 3 is also a scope lesson: M1039 targets system-level env configuration, not every dotfile a user owns.","hint":"Which finding is evidence of an action already happening?","study":"Prioritising env-integrity findings under one-analyst constraints."},{"id":"H15","type":"multi","title":"The evidence pack for the gap report","scenario":[{"kind":"text","content":"Your M1039 gap report goes to the CISO tomorrow. A junior suggests five attachments; three belong in the pack."}],"question":"Which three items belong in a solid evidence pack? Select three.","options":[{"k":"A","t":"stat/ls -l output for the env files of every host in scope"},{"k":"B","t":"ausearch -k env_change results for the relevant window"},{"k":"C","t":"The list of hosts missing the profile lockdown"},{"k":"D","t":"Screenshots of random terminals"},{"k":"E","t":"A confident guess about which APT group did it"}],"correct":["A","B","C"],"itemNotes":{"A":"Reproducible permission state per host — the core compliance evidence.","B":"The audit trail of who changed what and when — the forensic evidence.","C":"Coverage: the control is only as good as the fleet it covers."},"distractNotes":{"D":"Not reproducible, not structured, not complete. Raw artefacts beat screenshots.","E":"Attribution needs evidence; a mitigation-gap report measures control state, not adversary identity."},"explain":"State, trail, coverage: the three pillars of a control report. Everything else — guesses, screenshots — weakens it in front of a senior audience.","hint":"Two of the five cannot be verified by anyone else.","study":"Evidence packs: state, trail, coverage."},{"id":"H16","type":"qcm","title":"Two hosts, one ticket","scenario":[{"kind":"table","label":"ARTEFACT 1 — overnight env-file events","head":["host","file state","auditd story"],"rows":[["host-A","/etc/profile mtime 23:47","uid=0, deploy job 8812 (CHG-4471 window), hash matches repo standard"],["host-B","no mtime change visible","03:00 auditd: uid=0 auid=0 comm=bash name=/etc/environment key=env_change — outside every window"]]}],"question":"You have time to open one ticket tonight. Which host, and why?","options":[{"k":"A","t":"host-B — an interactive root shell touched /etc/environment outside every change window; investigate"},{"k":"B","t":"host-A — the file changed, that is always suspicious"},{"k":"C","t":"Neither — both are fine"},{"k":"D","t":"Ticket the SIEM vendor — the data must be wrong"}],"answer":"A","correctWhy":"host-B shows a live interactive root session editing env configuration with no approved window and no job — unexplained privileged activity on the exact files M1039 protects. host-A is fully explained by an approved deploy job and a matching hash.","distractWhy":"'File changed' is not a conclusion — the change on A carries its own explanation. Declaring the data wrong is what people do instead of deciding.","explain":"The pairing trains the last HARD discrimination: explained change vs unexplained privileged access. Mtime alone means nothing; identity plus timing plus explanation means everything.","hint":"One row has a job id and a matching hash. The other has auid=0 at 03:00 and nothing else.","study":"Explained vs unexplained privileged changes to env files."},{"id":"H17","type":"match","title":"auditd identity: four fields, four meanings","scenario":[{"kind":"log","label":"ARTEFACT 1 — one auditd event, four fields highlighted","content":"type=SYSCALL ... uid=0 auid=1002 comm=\"tee\" exe=\"/usr/bin/tee\" key=\"env_change\"\ntype=PATH   ... name=\"/etc/environment\""}],"question":"Match each field to what it actually tells you.","left":[{"k":"L1","t":"auid=1002"},{"k":"L2","t":"uid=0"},{"k":"L3","t":"name=\"/etc/environment\""},{"k":"L4","t":"key=\"env_change\""}],"right":[{"k":"R1","t":"the effective user the command ran as"},{"k":"R2","t":"the tag of the watch rule that fired"},{"k":"R3","t":"the logged-in human the session belongs to"},{"k":"R4","t":"the file the event touched"}],"pairs":{"L1":"R3","L2":"R1","L3":"R4","L4":"R2"},"itemNotes":{"L1":"auid survives sudo/su — it stays the login user, which is why it is the field you trust for 'who'.","L2":"uid is the effective identity of the process; after sudo it is 0 even though a human sits behind it.","L3":"In the PATH record, name is the object involved — here the env file.","L4":"The key is your own tag from the watch rule — the string every ausearch query uses."},"explain":"Reading identity correctly is the difference between 'root did it' and 'user 1002 did it as root'. For env-file incidents, auid is usually the person and uid is the privilege the action ran under.","hint":"Two identity fields look similar — only one survives a sudo switch.","study":"auditd fields: auid vs uid, name, key."}]};

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls){ e.className = cls; }
  if(text !== undefined && text !== null){ e.textContent = text; }
  return e;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuf(a){
  var arr = a.slice();
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
function pct(x){ return Math.round(x*100); }
function mmss(sec){
  var m = Math.floor(Math.max(0,sec)/60);
  var s = Math.max(0,sec)%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function scoreExercise(selected, correct){
  var N = correct.length;
  if(N === 0){ return 0; }
  var H = 0, W = 0;
  var i;
  for(i=0;i<selected.length;i++){
    if(correct.indexOf(selected[i]) !== -1){ H++; } else { W++; }
  }
  return Math.max(0, (H - W) / N);
}

function updateHeader(){
  if(S.phase === "exam" || S.phase === "review"){
    var n = S.cur+1, M = S.order.length;
    $("h-cnt").innerHTML = "";
    var strong = document.createElement("strong");
    strong.textContent = (S.phase==="review" ? "Review " : "Exercise " + n + " of " + M);
    $("h-cnt").appendChild(strong);
  } else if(S.phase === "results"){
    $("h-cnt").innerHTML = "";
    var st = document.createElement("strong"); st.textContent="Results";
    $("h-cnt").appendChild(st);
  } else {
    $("h-cnt").innerHTML = "";
    var si = document.createElement("strong"); si.textContent="Intro";
    $("h-cnt").appendChild(si);
  }
  var t = $("h-timer");
  var stWord = "";
  var clsExtra = "";
  if(S.tState==="IDLE"){ stWord='<span class="tstate">starts when you press Start</span>'; }
  else if(S.tState==="RUNNING"){ stWord='<span class="tstate">▶ RUNNING</span>'; clsExtra="t-running"; }
  else if(S.tState==="PAUSED_MANUAL"){ stWord='<span class="tstate">⏸ PAUSED — manual (press Resume)</span>'; clsExtra="t-paused"; }
  else if(S.tState==="PAUSED_AUTO_CHECK"){ stWord='<span class="tstate">⏳ PAUSED — feedback open (resumes on Next)</span>'; clsExtra="t-paused"; }
  else { stWord='<span class="tstate">⏹ ENDED</span>'; clsExtra="t-ended"; }
  t.className = "chip timer " + clsExtra;
  t.innerHTML = "⏱ <strong>"+mmss(S.tLeft)+"</strong> " + stWord;
  var sum=0, cnt=0;
  for(var k in S.credits){ if(S.answered[k]){ sum += S.credits[k]; cnt++; } }
  var sc = $("h-score");
  if(cnt>0){
    sc.innerHTML = "Score <strong>"+fmt1(sum)+" / "+cnt+"</strong> · "+pct(sum/cnt)+"%";
  } else {
    sc.innerHTML = "Score <strong>0.0 / 0</strong>";
  }
  var pfill = $("pbar-fill");
  var done = 0;
  for(var k2 in S.answered){ if(S.answered[k2]){ done++; } }
  var base = S.phase==="exam" ? Math.max(done, S.cur) : done;
  pfill.style.width = Math.min(100, Math.round(100*base/Math.max(1,S.order.length))) + "%";
  if(S.tState==="PAUSED_MANUAL" || S.tState==="PAUSED_AUTO_CHECK"){ pfill.className=""; } else { pfill.className="sheen"; }
  /* header controls only make sense while an attempt is running */
  var inAttempt = (S.phase==="exam" || S.phase==="review");
  ["h-hint","h-pause","h-skip","h-score"].forEach(function(id){
    var b = $(id);
    if(b){ b.style.display = inAttempt ? "" : "none"; }
  });
}

/* ---------------- timer ---------------- */
function startTimer(){
  if(S.tickHandle){ clearInterval(S.tickHandle); }
  S.tickHandle = setInterval(tick, 1000);
}
function tick(){
  if(S.tState!=="RUNNING"){ return; }
  S.tLeft--;
  if(S.tLeft<=0){
    S.tLeft=0; S.tState="ENDED";
    clearInterval(S.tickHandle); S.tickHandle=null;
    updateHeader();
    timeUp();
    return;
  }
  updateHeader();
}
function timeUp(){
  /* timer ended: unanswered (skipped) exercises are excluded; go to results */
  showResults();
}

/* ---------------- pause logic ---------------- */
function manualPause(){
  if(S.phase!=="exam" && S.phase!=="review"){ return; }
  if(S.tState==="RUNNING" || S.tState==="PAUSED_AUTO_CHECK"){
    S.prevBeforeManual = S.tState;
    S.tState = "PAUSED_MANUAL";
    S.pauseAt = Date.now();
    if(!document.querySelector(".ov")){
      var ov = el("div", S.phase==="exam" ? "ov" : "ov ov-fixed");
      ov.setAttribute("role","status");
      ov.appendChild(el("div","word","⏸ PAUSED — manual"));
      var sm = el("small","none","The exercise is hidden while you pause. The timer is stopped. Press Resume to continue where you were.");
      ov.appendChild(sm);
      var b = el("button","btn next","▶ Resume");
      b.addEventListener("click", manualResume);
      ov.appendChild(b);
      if(S.phase==="exam"){
        var ex = $("ex-wrap");
        if(ex){ ex.appendChild(ov); }
        else { ov.className = "ov ov-fixed"; document.body.appendChild(ov); }
      } else {
        document.body.appendChild(ov);
      }
    }
    updateHeader();
  }
}
function manualResume(){
  var ov = document.querySelector(".ov");
  if(ov && ov.parentNode){ ov.parentNode.removeChild(ov); }
  if(S.tState==="PAUSED_MANUAL"){
    var delta = Math.round((Date.now()-S.pauseAt)/1000);
    S.pManual += delta;
    S.tState = S.prevBeforeManual || "RUNNING";
  }
  updateHeader();
}
function autoPauseOnCheck(){
  if(S.tState==="RUNNING"){
    S.tState = "PAUSED_AUTO_CHECK";
    S.pauseAt = Date.now();
  }
}
function resumeFromAutoCheck(){
  if(S.tState==="PAUSED_AUTO_CHECK"){
    S.pAuto += Math.round((Date.now()-S.pauseAt)/1000);
    S.tState = "RUNNING";
  }
}

function startExam(){

  S.tLeft = META.timerSec;

function currentEx(){ return D.exercises[S.order[S.cur]]; }

function renderExercise(){

    holder.appendChild(q);
    var list = el("div","opts");
    var pick = null;
    st.options.forEach(function(o, oi){
      var b = el("button","opt");
      b.type="button";
      b.appendChild(el("span","olbl", String.fromCharCode(65+oi)+"."));
      b.appendChild(el("span","none", o));
      var mk = el("span","selmark","● selected");
      b.appendChild(mk);
      b.addEventListener("click", function(){
        pick = oi;
        var all = list.querySelectorAll(".opt");
        for(var i=0;i<all.length;i++){ all[i].classList.remove("sel"); }
        b.classList.add("sel");
        conf.disabled = false;
      });
      list.appendChild(b);
    });
    holder.appendChild(list);
    var conf = el("button","btn next","Confirm & continue");
    conf.disabled = true;
    conf.addEventListener("click", function(){
      picks[step] = pick;
      step++;
      if(step < ex.steps.length){
        renderStep();
      } else {
        holder.innerHTML = "";
        var done = el("p","stepdone","All "+ex.steps.length+" steps recorded. Press Check to grade the whole chain — the timer pauses for review.");
        holder.appendChild(done);
        ex._ready = true;
        if(ex._onReady){ ex._onReady(true); }
      }
    });
    holder.appendChild(conf);
  }
  renderStep();
  ex._grade = function(){
    var N = ex.steps.length;
    var H=0, W=0;
    var rows = [];
    ex.steps.forEach(function(st, i){
      var got = picks[i];
      var ok = (got === st.answer);
      if(ok){ H++; } else { W++; }
      var chosenTxt = (got===undefined||got===null) ? "no answer" : String.fromCharCode(65+got)+". "+st.options[got];
      var corrTxt = String.fromCharCode(65+st.answer)+". "+st.options[st.answer];
      rows.push({
        state: ok ? "c" : "w",
        label: ok ? "✓ Correct" : "✗ Wrong",
        text: "Step "+(i+1)+": you chose "+chosenTxt+"; correct: "+corrTxt+" — "+st.why
      });
    });
    var credit = Math.max(0,(H-W)/N);
    if(S.hintUsed[S.order[S.cur]]){ credit = Math.max(0, credit - 0.10); }
    return {credit:credit, rows:rows, multi:true, H:H, W:W, N:N};
  };
  ab.appendChild(holder);
}
function renderWidget(ex, ab){
  if(ex.type==="qcm"){ widgetQCM(ex, ab); }
  else if(ex.type==="multi"){ widgetMulti(ex, ab); }
  else if(ex.type==="match"){ widgetMatch(ex, ab); }
  else if(ex.type==="order"){ widgetOrder(ex, ab); }
  else if(ex.type==="dnd"){ widgetDnD(ex, ab); }
  else if(ex.type==="fill"){ widgetFill(ex, ab); }
  else if(ex.type==="spot"){ widgetSpot(ex, ab); }
  else if(ex.type==="terminal"){ widgetTerminal(ex, ab); }
  else if(ex.type==="branch"){ widgetBranch(ex, ab); }
}

/* ---------------- check / next / skip / hint ---------------- */
function useHint(){
  if(S.phase!=="exam"){ return; }
  var idx = S.order[S.cur];
  if(S.hintUsed[idx] || S.checked[idx]){ return; }
  var ex = currentEx();
  S.hintUsed[idx] = true;
  var act = document.querySelector(".ex-actions");
  var hp = el("div","study");
  hp.innerHTML = "";
  var hh = el("span","h","⚠ Hint (−10% of this exercise credit): ");
  hp.appendChild(hh);
  hp.appendChild(document.createTextNode(ex.hint));
  if(act){ act.parentNode.insertBefore(hp, act); }
  $("h-hint").disabled = true;
  updateHeader();
}
function onCheck(){
  if(S.phase!=="exam"){ return; }
  var idx = S.order[S.cur];
  if(S.checked[idx]){ return; }
  var ex = currentEx();
  if(!ex._ready){ return; }
  S.checked[idx] = true;
  /* freeze widget */
  lockWidget(ex);
  var res = ex._grade();
  S.credits[idx] = res.credit;
  S.answered[idx] = true;
  autoPauseOnCheck();
  /* remove hint panel (already applied) */
  renderFeedback(ex, res);
  var bCheck = $("btn-check");
  if(bCheck){ bCheck.disabled = true; }
  $("h-skip").disabled = true;
  $("h-hint").disabled = true;
  updateHeader();
  var fb = document.querySelector(".fb");
  if(fb){ fb.scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block:"nearest"}); }
}
function renderFeedback(ex, res){
  var old = document.querySelector(".fb");
  if(old && old.parentNode){ old.parentNode.removeChild(old); }
  var fb = el("div","fb");
  var head = el("div","fb-h");
  var iw = el("span","icoword");
  var cls, label;
  if(res.credit >= 0.999){ cls="ok"; label="✓ CORRECT"; }
  else if(res.credit > 0){ cls="part"; label="✓ PARTIALLY CORRECT"; }
  else { cls="bad"; label="✗ INCORRECT"; }
  fb.className = "fb "+cls;
  iw.appendChild(el("span","none",label));
  head.appendChild(iw);
  var H = res.H!==undefined?res.H:null, W = res.W!==undefined?res.W:null, N = res.N;
  var frac = (res.multi && res.credit < 0.999 && H!==null) ? (" · H="+H+", W="+W+", N="+N) : "";
  head.appendChild(el("span","fb-credit","credit "+res.credit.toFixed(2)+" · "+Math.round(res.credit*100)+"%"+frac));
  fb.appendChild(head);
  var b = el("div","fb-b");
  if(res.dangerous){
    var dng = el("div","itemrow w");
    dng.innerHTML = '<span class="st">✗ DANGEROUS — NEAR MISS</span><span class="why">Your command would work mechanically, but it changes or destroys state (evidence or configuration) that must be preserved right now. Read the explanation below carefully.</span>';
    b.appendChild(dng);
  }
  var rows = el("div","itemrows");
  res.rows.forEach(function(r){
    var d = el("div","itemrow "+r.state);
    d.appendChild(el("span","st",r.label));
    d.appendChild(el("span","why",r.text));
    rows.appendChild(d);
  });
  b.appendChild(rows);
  var exp = el("p","none");
  exp.style.marginTop="10px";
  exp.textContent = ex.explain;
  b.appendChild(exp);
  if(res.canonical){
    var c = el("div","canon");
    c.appendChild(el("div","h","canonical command (copyable)"));
    var pre = el("pre","codeblk");
    pre.textContent = res.canonical;
    c.appendChild(pre);
    b.appendChild(c);
  }
  if(ex.study){
    var st2 = el("div","study");
    st2.appendChild(el("span","h","What to study: "));
    st2.appendChild(document.createTextNode(ex.study));
    b.appendChild(st2);
  }
  fb.appendChild(b);
  var wrap = $("ex-wrap");
  var act = wrap.querySelector(".ex-actions");
  var nxt = el("div","ex-actions");
  var isLast = (S.cur === S.order.length-1);
  var bNext = el("button","btn next", isLast ? "Final Submit ▶" : "Next ▶");
  bNext.addEventListener("click", onNext);
  nxt.appendChild(bNext);
  if(act){ wrap.insertBefore(fb, act.nextSibling); wrap.insertBefore(nxt, fb.nextSibling); }
  else { wrap.appendChild(fb); wrap.appendChild(nxt); }
  bNext.focus();
}
function onNext(){
  if(S.phase!=="exam"){ return; }
  resumeFromAutoCheck();
  advanceToNextUnchecked();
}
function advanceToNextUnchecked(){
  /* walk forward past exercises that were already answered/checked; never strand
     the learner on a checked exercise (which has no Next button of its own) */
  var n = S.order.length;
  var j = S.cur + 1;
  while(j < n && S.checked[S.order[j]]){ j++; }
  if(j < n){
    S.cur = j;
    $("h-skip").disabled = false;
    $("h-hint").disabled = !!S.hintUsed[S.order[S.cur]] || !!S.checked[S.order[S.cur]];
    renderExercise();
  } else {
    finishAttempt();
  }
}
function skipCurrent(){
  if(S.phase!=="exam"){ return; }
  var idx = S.order[S.cur];
  if(S.checked[idx]){ return; }
  if(S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }
  /* skip does not trigger auto-pause; timer keeps running */
  advanceToNextUnchecked();
}
function finishAttempt(){
  var pending = [];
  S.skipped = S.skipped.filter(function(i){
    if(S.answered[i]){ return false; }
    pending.push(i);
    return true;
  });
  if(pending.length > 0 && S.tState !== "ENDED"){
    showReview(pending);
  } else {
    showResults();
  }
}
function showReview(pending){
  S.phase="review";
  var v = $("view-exam"); v.classList.add("hidden");
  var rv = $("view-review"); rv.classList.remove("hidden");
  rv.innerHTML = "";
  var c = el("div","card");
  c.appendChild(el("h2","none","⚠ Review skipped exercises"));
  c.appendChild(el("p","resnote","These exercises were skipped and never answered. You can return to any of them as many times as you need, as long as the timer has not ended. If you submit while they are still skipped, they are excluded from the score — they count neither for you nor against you."));
  var list = el("div","none");
  pending.sort(function(a,b){ return a-b; });
  pending.forEach(function(i){
    var ex = D.exercises[i];
    var row = el("div","rev-item");
    row.appendChild(el("span","st","⚠ Skipped"));
    row.appendChild(el("span","t", ex.title));
    var b = el("button","btn next","Answer now");
    b.addEventListener("click", function(){
      S.phase="exam";
      $("view-review").classList.add("hidden");
      $("view-exam").classList.remove("hidden");
      S.cur = S.order.indexOf(i);
      S.skipped = S.skipped.filter(function(x){ return x!==i; });
      $("h-skip").disabled = false;
      $("h-hint").disabled = !!S.hintUsed[i];
      renderExercise();
    });
    row.appendChild(b);
    list.appendChild(row);
  });
  c.appendChild(list);
  var sub = el("button","btn primary","✓ Submit the exam");
  sub.addEventListener("click", function(){ showResults(); });
  c.appendChild(sub);
  rv.appendChild(c);
  updateHeader();
}
function showResults(){
  if(S.phase==="results"){ return; }
  if(S.tickHandle){ clearInterval(S.tickHandle); S.tickHandle=null; }
  if(S.tState!=="ENDED"){ S.tState="ENDED"; }
  S.phase="results";
  var v = $("view-exam"); if(v){ v.classList.add("hidden"); }
  var rv = $("view-review"); if(rv){ rv.classList.add("hidden"); }
  var resv = $("view-results"); resv.classList.remove("hidden");
  resv.innerHTML = "";
  var sum = 0, answered = 0, fully=0, partly=0, partlySum=0, wrong=0, skippedN=0;
  S.order.forEach(function(i){
    if(S.answered[i]){
      answered++;
      var c = S.credits[i] || 0;
      sum += c;
      if(c >= 0.999){ fully++; }
      else if(c > 0){ partly++; partlySum += c; }
      else { wrong++; }
    } else if(S.skipped.indexOf(i)!==-1){
      skippedN++;
    } else {
      skippedN++;
    }
  });
  var percent = answered>0 ? Math.round((sum/answered)*100) : 0;
  var passed = percent >= META.passMark;
  var c = el("div","card");
  c.appendChild(el("h1","intro-title","Results — "+META.objId+" "+SEVWORD));
  var chips = el("div","intro-chips");
  var chipDefs = [
    ["Final score", fmt1(sum)+" / "+answered,""],["Percentage", percent+"%","res-pct"],["Pass mark", META.passMark+"%",""],["Time paused (manual)", Math.floor(S.pManual/60)+"m "+(S.pManual%60)+"s",""],["Time paused (feedback review)", Math.floor(S.pAuto/60)+"m "+(S.pAuto%60)+"s",""]
  ];
  chipDefs.forEach(function(d){
    var ch = el("span","chip");
    ch.appendChild(el("span","none",d[0]+": "));
    var st = el("strong","none",d[1]);
    if(d[2]){ st.id = d[2]; }
    ch.appendChild(st);
    chips.appendChild(ch);
  });
  c.appendChild(chips);
  var verdict = el("div","verdict "+(passed?"pass":"fail"));
  verdict.setAttribute("role","status");
  verdict.appendChild(el("span","none", passed ? "✓ PASS" : "✗ FAIL"));
  verdict.appendChild(el("span","resnote", passed ?
    "You reached "+percent+"% — above the "+META.passMark+"% pass mark. Well done." :
    "You reached "+percent+"% — below the "+META.passMark+"% pass mark. You must retake this exam."));
  c.appendChild(verdict);
  var grid = el("div","resgrid");
  function rc(cls, n, l){
    var d = el("div","rescard "+cls);
    d.appendChild(el("div","n",String(n)));
    d.appendChild(el("div","l",l));
    grid.appendChild(d);
  }
  rc("ok", fully, "✓ Fully correct");
  var avgTxt = partly>0 ? ("avg "+(partlySum/partly).toFixed(2)) : "—";
  rc("part", partly, "✓ Partially correct · "+avgTxt);
  rc("bad", wrong, "✗ Fully incorrect");
  rc("skip", skippedN, "⚠ Skipped — excluded");
  c.appendChild(grid);
  var note = el("p","resnote");
  note.textContent = "The score is computed only over exercises you actually answered (checked). Skipped-and-never-answered exercises are excluded from both the numerator and the denominator. Manual pauses and feedback-review pauses are shown above so you can see how your time was spent.";
  c.appendChild(note);
  var act = el("div","ex-actions");
  var rt = el("button","btn primary","↺ Retake Exam");
  rt.addEventListener("click", retake);
  act.appendChild(rt);
  c.appendChild(act);
  resv.appendChild(c);
  updateHeader();
  /* count-up animation on the percentage; the one-shot score report fires
     only after the animation has settled (immediately if reduced motion) */
  var pctEl = $("res-pct");
  function settle(){ reportScore(sum, answered, percent, passed); }
  if(REDUCED || !pctEl || !window.requestAnimationFrame){
    settle();
  } else {
    var t0 = null, DUR = 800;
    function stepAnim(ts){
      if(t0===null){ t0 = ts; }
      var p = Math.min(1,(ts-t0)/DUR);
      var val = Math.round(percent * (1-Math.pow(1-p,3)));
      pctEl.textContent = val + "%";
      if(p < 1){ requestAnimationFrame(stepAnim); }
      else { pctEl.textContent = percent + "%"; setTimeout(settle, 200); }
    }
    requestAnimationFrame(stepAnim);
  }
}
function reportScore(creditSum, answeredCount, percent, passed){
  if(S.reported){ return; }
  S.reported = true;
  try{
    parent.postMessage({
      type: "CYBERPULSE_SCORE",
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum*10)/10,
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function retake(){
  S.phase="intro";
  S.answered={}; S.credits={}; S.skipped=[]; S.hintUsed={}; S.checked={};
  S.tLeft=META.timerSec; S.tState="IDLE"; S.pManual=0; S.pAuto=0;
  S.reported=false; S.cur=0;
  if(S.tickHandle){ clearInterval(S.tickHandle); S.tickHandle=null; }
  $("view-results").classList.add("hidden");
  $("view-exam").classList.add("hidden");
  $("view-review").classList.add("hidden");
  $("view-intro").classList.remove("hidden");
  buildHeader();
  buildIntro();
  updateHeader();
  window.scrollTo(0,0);
}

/* ---------------- handshake ---------------- */
window.addEventListener("message", function (event) {
  if (!event.data) { return; }
  if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") { return; }
  S.user = event.data.username || null;
  S.country = event.data.country || null;
  /* event.data.theme is always "dark" — this file is dark-only by contract; no toggle exists. */
  if(S.phase === "intro"){ buildIntro(); }
});

/* ---------------- boot ---------------- */
function boot(){
  buildHeader();
  buildIntro();
  updateHeader();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
})();
</script>
</body>
