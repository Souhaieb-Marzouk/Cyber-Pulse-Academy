/* ============ results view + site report ============ */
function finalize(early){
  if(S.finished && S.view==='results') return;
  S.finished=true; S.view='results'; Timer.toEnded();
  var sc=scoreNow();
  var fully=0,partly=0,n=0,partSum=0;
  Object.keys(S.answered).forEach(function(id){
    if(!S.answered[id]) return;
    var c=S.credits[id];
    if(c>=0.999) fully++;
    else if(c>0){ partly++; partSum+=c; }
    else n++;
  });
  var skippedN=EXS.length-sc.cnt-n-partly-fully; skippedN=Math.max(0,EXS.length-sc.cnt);
  var main=q('#main'); clr(main);
  var c=el('div','card');
  c.appendChild(el('div','kicker','FINAL RESULTS'));
  c.appendChild(el('div','finalscore',null));
  var fs=c.querySelector('.finalscore');
  var b1=el('span',null,sc.sum.toFixed(1)+'/'+sc.cnt+' ');
  fs.appendChild(b1);
  fs.appendChild(el('span','fs-pct',sc.pct+'%'));
  var cert=el('div','cert '+(sc.pct>=70&&sc.cnt>0?'pass':'fail'));
  var pass=sc.pct>=70&&sc.cnt>0;
  cert.appendChild(el('div','cl',(pass?'\u2713 PASS':'\u2717 FAIL')));
  cert.appendChild(el('div','cs',pass
    ?'You reached the 70% pass mark over the exercises you answered. Well done \u2014 you showed working knowledge of '+META.objectName+' at '+META.severityLabel+' level.'
    :(sc.cnt===0
      ?'Nothing was answered, so there is no score. Retake the exam when you are ready.'
      :'You did not reach the 70% pass mark. Study the feedback below and take the exam again \u2014 questions and options will be reshuffled.')));
  c.appendChild(cert);
  var g=el('div','resgrid');
  g.appendChild(resCard('ok','\u2713','Fully correct',fully,'credit 1.00 each'));
  g.appendChild(resCard('part','\u2713','Partially correct',partly,partly>0?('avg credit '+ (partSum/partly).toFixed(2)):'\u2014'));
  g.appendChild(resCard('bad','\u2717','Fully incorrect',n,'credit 0.00'));
  g.appendChild(resCard('skip','\u26A0','Skipped \u2014 excluded',skippedN,'not counted'));
  c.appendChild(g);
  var ps=el('p','pstats','Time paused manually: '+fmt(Timer.pm)+' \u00B7 Time paused to review feedback: '+fmt(Timer.pa)+' \u00B7 Time left: '+fmt(Timer.left)+(early?' \u00B7 The timer ended, so unanswered exercises were excluded.':''));
  c.appendChild(ps);
  var tb=el('table','rtable');
  var trh=el('tr'); ['#','Exercise','Credit','Result'].forEach(function(h){ trh.appendChild(el('th',null,h)); }); tb.appendChild(trh);
  EXS.forEach(function(ex){
    var tr=el('tr');
    tr.appendChild(el('td',null,ex.id));
    tr.appendChild(el('td',null,ex.title));
    if(S.answered[ex.id]){
      var cr=S.credits[ex.id];
      tr.appendChild(el('td',null,cr.toFixed(2)));
      var lab,cls;
      if(cr>=0.999){lab='\u2713 Fully correct';cls='ok';}
      else if(cr>0){lab='\u2713 Partially correct';cls='part';}
      else {lab='\u2717 Fully incorrect';cls='bad';}
      tr.appendChild(el('td',cls,lab));
    } else {
      tr.appendChild(el('td','skipc','\u2014'));
      tr.appendChild(el('td','skipc','\u26A0 Skipped \u2014 excluded'));
    }
    tb.appendChild(tr);
  });
  c.appendChild(tb);
  var act=el('div','actrow');
  var rt=el('button','btn btn-primary','\u21BA Retake exam'); rt.type='button';
  rt.addEventListener('click',retake);
  act.appendChild(rt); c.appendChild(act);
  main.appendChild(c);
  window.scrollTo(0,0);
  reportScore(sc);
  renderHeader();
}
function resCard(cls,ico,label,val,sub){
  var d=el('div','rescard '+cls);
  d.appendChild(el('div','rv',ico+' '+val));
  d.appendChild(el('div','rl',label));
  d.appendChild(el('div','rl',sub));
  return d;
}
function reportScore(sc){
  if(S.reported) return; S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId, batch:META.batch,
      score:Math.round(sc.sum), total:sc.cnt,
      percent:sc.pct, passed:sc.pct>=70&&sc.cnt>0
    },location.origin);
  }catch(e){ /* opened directly: nothing to report to */ }
}

  c.appendChild(strip);
  main.appendChild(c);

  var c2=el('div','card learn');
  c2.appendChild(el('h2',null,'What you will learn here'));
  var learn=el('div',null); learn.innerHTML=INTRO.learn; c2.appendChild(learn);
  main.appendChild(c2);

  var c3=el('div','card');
  c3.appendChild(el('h2',null,'Keywords covered in this exam'));
  INTRO.keywords.forEach(function(kw){
    var kt=el('div','kw-theme');
    kt.appendChild(el('h3',null,kw.theme));
    var ul=el('ul'); kw.items.forEach(function(i){ ul.appendChild(el('li',null,i)); });
    kt.appendChild(ul); c3.appendChild(kt);
  });
  main.appendChild(c3);

  var c4=el('div','card how');
  c4.appendChild(el('h2',null,'How this exam works'));
  var how=el('div',null); how.innerHTML=INTRO.how; c4.appendChild(how);
  var act=el('div','startrow');
  var st=el('button','btn btn-primary','\u25B6 Start exam'); st.type='button';
  st.addEventListener('click',startExam);
  act.appendChild(st);
  act.appendChild(el('span','rvnote','Good luck \u2014 read each scenario twice before answering.'));
  c4.appendChild(act);
  main.appendChild(c4);
  window.scrollTo(0,0);
}

/* ============ exam start / retake ============ */
function startExam(){
  S.attempt++;
  S.credits={}; S.answered={}; S.skipped=[]; S.hintUsed={};
  S.fromReview=false; S.reported=false; S.finished=false; S.cur=0;
  S.queue=shuffle(EXS.map(function(e){ return e.id; }));
  Timer.start(META.timerSeconds);
  q('#hdr').style.display='flex';
  S.view='exam';
  renderCurrent();
}
function retake(){
  startExam();
}

/* ============ manual pause overlay ============ */
function ensureOverlay(){
  if(q('#poverlay')) return;
  var ov=el('div'); ov.id='poverlay';
  var box=el('div','pbox');
  box.appendChild(el('div','pic','\u23F8'));
  box.appendChild(el('div','pt','PAUSED \u2014 manual'));
  box.appendChild(el('div','ps','The exercise is hidden and the timer is stopped. Press Resume when you want to continue.'));
  var b=el('button','btn btn-primary','\u25B6 Resume'); b.type='button';
  b.addEventListener('click',function(){
    Timer.toResume();
    ov.style.display='none';
    q('#main').setAttribute('aria-hidden','false');
    renderHeader();
  });
  box.appendChild(b); ov.appendChild(box); document.body.appendChild(ov);
}
function onPause(){
  if(S.finished) return;
  if(S.view!=='exam'&&S.view!=='review') return;
  if(Timer.state==='RUNNING'||Timer.state==='PAUSED_AUTO_CHECK'){
    Timer.toManualPause();
    ensureOverlay();
    var ov=q('#poverlay'); ov.style.display='flex';
    q('#main').setAttribute('aria-hidden','true');
    renderHeader();
  }
}

/* ============ site handshake ============ */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  S.user=event.data.username||''; S.country=event.data.country||''; S.locale=event.data.locale||'';
  S.hsTopic=event.data.topicId||''; S.hsBatch=event.data.batch;
  if(S.user){
    var h=q('#hdrUser');
    if(h) h.textContent='Analyst: '+S.user;
  }
});

/* ============ boot ============ */
document.addEventListener('DOMContentLoaded',function(){
  q('#btnHint').addEventListener('click',onHint);
  q('#btnSkip').addEventListener('click',onSkip);
  q('#btnPause').addEventListener('click',onPause);
  ensureOverlay();
  renderIntro();
});
})();

</script>
</body>
</html>
