/* ---------- ordering / timeline ---------- */
function buildOrder(ex,ansBody){
  var box=el('div','olist');
  var items=shuffle(ex.items.map(function(t,i){ return {t:t,i:i}; }));
  function rowNode(it,pos){
    var row=el('div','oitem'); row.dataset.i=it.i;
    row.appendChild(el('span','pos mono',String(pos)));
    row.appendChild(el('span','ot',it.t));
    var mb=el('div','mbtns');
    var up=el('button'); up.type='button'; up.textContent='\u2191'; up.setAttribute('aria-label','Move up: '+it.t);
    var dn=el('button'); dn.type='button'; dn.textContent='\u2193'; dn.setAttribute('aria-label','Move down: '+it.t);
    up.addEventListener('click',function(){ if(S.answered[ex.id]) return; move(it.i,-1); });
    dn.addEventListener('click',function(){ if(S.answered[ex.id]) return; move(it.i,1); });
    mb.appendChild(up); mb.appendChild(dn); row.appendChild(mb);
    return row;
  }
  function move(id,dir){
    var at=-1; for(var i=0;i<items.length;i++){ if(items[i].i===id){ at=i; break; } }
    var to=at+dir; if(to<0||to>=items.length) return;
    var t=items[at]; items[at]=items[to]; items[to]=t;
    redraw();
  }
  function redraw(){
    clr(box);
    items.forEach(function(it,k){ box.appendChild(rowNode(it,k+1)); });
  }
  redraw();
  ansBody.appendChild(box);
  CUR.getGrade=function(){
    var H=0,W=0,rows=[];
    items.forEach(function(it,pos){
      if(it.i===pos){ H++; rows.push({st:'ok',text:'Position '+(pos+1)+': '+it.t}); }
      else { W++; rows.push({st:'bad',text:'You put at '+(pos+1)+': \u201C'+it.t+'\u201D \u2014 correct position '+(it.i+1)}); }
    });
    var N=ex.items.length;
    return {credit:scoreExercise(H,W,N),rows:rows,H:H,W:W,N:N,
      answerSummary:ex.items.map(function(t,i){return (i+1)+'. '+t;}).join('  |  ')};
  };
  CUR.lock=function(){ Array.prototype.forEach.call(box.querySelectorAll('button'),function(b){ b.disabled=true; }); };
}

/* ---------- drag & drop (bank -> zones) ---------- */
function buildDD(ex,ansBody){
  var state={}; ex.items.forEach(function(it){ state[it.id]='bank'; });
  var pickId=null;
  var renderOrder=shuffle(ex.items.map(function(it){ return it.id; }));
  var bank=el('div','bank'); var grid=el('div','zgrid');
  var zoneNodes={};
  ex.zones.forEach(function(z){
    var zd=el('div','zone'); zd.dataset.z=z.id;
    zd.setAttribute('role','button'); zd.tabIndex=0;
    zd.setAttribute('aria-label','Drop zone: '+z.name+'. Press Enter to place the picked card.');
    zd.appendChild(el('div','zone-head',z.name));
    var zl=el('div','zonelist'); zd.appendChild(zl); zoneNodes[z.id]=zl;
    zd.addEventListener('dragover',function(e){ e.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave',function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop',function(e){ e.preventDefault(); zd.classList.remove('over');
      var id=e.dataTransfer.getData('text/plain'); if(id){ place(id,z.id); } });
    zd.addEventListener('click',function(){ if(pickId){ place(pickId,z.id); pickId=null; } });
    zd.addEventListener('keydown',function(e){
      if((e.key==='Enter'||e.key===' ')&&S.answered[ex.id]!==true){
        e.preventDefault();
        if(pickId){ place(pickId,z.id); pickId=null; }
      }
    });
    grid.appendChild(zd);
  });
  function chipNode(it){
    var c=el('div','chip'); c.draggable=true; c.dataset.id=it.id; c.textContent=it.t;
    c.setAttribute('role','button'); c.tabIndex=0;
    c.addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',it.id); });
    c.addEventListener('click',function(e){
      if(S.answered[ex.id]) return;
      if(c.parentElement && c.parentElement.classList.contains('zonelist')){ backToBank(it.id); return; }
      if(pickId===it.id){ pickId=null; c.classList.remove('pick'); return; }
      pickId=it.id;
      Array.prototype.forEach.call(bank.querySelectorAll('.chip'),function(x){ x.classList.remove('pick'); });
      c.classList.add('pick');
    });
    c.addEventListener('keydown',function(e){
      if((e.key==='Enter'||e.key===' ')&&S.answered[ex.id]!==true){
        e.preventDefault();
        if(c.parentElement&&c.parentElement.classList.contains('zonelist')){ backToBank(it.id); }
        else{ pickId=(pickId===it.id)?null:it.id;
          Array.prototype.forEach.call(bank.querySelectorAll('.chip'),function(x){ x.classList.remove('pick'); });
          if(pickId) c.classList.add('pick'); }
      }
    });
    return c;
  }
  function backToBank(id){ state[id]='bank'; redraw(); }
  function place(id,zid){ state[id]=zid; pickId=null; redraw(); }
  function redraw(){
    clr(bank); ex.zones.forEach(function(z){ clr(zoneNodes[z.id]); });
    renderOrder.forEach(function(id){
      var it=ex.items.filter(function(x){ return x.id===id; })[0];
      var node=chipNode(it);
      if(state[it.id]==='bank'){ bank.appendChild(node); }
      else if(zoneNodes[state[it.id]]){ zoneNodes[state[it.id]].appendChild(node); }
    });
  }
  redraw();
  ansBody.appendChild(el('div',null,'Drag each card into a zone (or click a card, then click a zone; click a placed card to send it back).'));
  ansBody.appendChild(el('div',null,' '));
  ansBody.appendChild(bank);
  ansBody.appendChild(grid);
  CUR.getGrade=function(){
    var any=false,H=0,W=0,M=0,rows=[];
    ex.items.forEach(function(it){
      var st=state[it.id];
      if(st===it.zone){ H++; any=true; rows.push({st:'ok',text:it.t+' \u2192 '+zoneName(it.zone)}); }
      else if(st==='bank'){ M++; rows.push({st:'miss',text:it.t+' \u2014 left in the bank; belongs in: '+zoneName(it.zone)}); }
      else { W++; any=true; rows.push({st:'bad',text:it.t+' \u2192 you placed it in \u201C'+zoneName(st)+'\u201D; correct: '+zoneName(it.zone)}); }
    });
    if(!any) return null;
    var N=ex.items.length;
    return {credit:scoreExercise(H,W,N),rows:rows,H:H,W:W,N:N,
      answerSummary:ex.items.map(function(it){return it.t+' \u2192 '+zoneName(it.zone);}).join('  |  ')};
  };
  function zoneName(id){ for(var i=0;i<ex.zones.length;i++){ if(ex.zones[i].id===id) return ex.zones[i].name; } return id; }
  CUR.lock=function(){ Array.prototype.forEach.call(ansBody.querySelectorAll('.chip'),function(c){ c.draggable=false; }); };
}

/* ---------- fill in the blanks ---------- */
function buildFill(ex,ansBody){
  var wrap=el('div','filltext');
  var parts=ex.pre.split(/\{(\d+)\}/);
  var widgets={};
  for(var i=0;i<parts.length;i++){
    if(i%2===0){ wrap.appendChild(document.createTextNode(parts[i])); }
    else{
      var bi=parseInt(parts[i],10); var bl=ex.blanks[bi];
      var w;
      if(bl.mode==='type'){
        w=el('input','blankin'); w.type='text'; w.setAttribute('aria-label','Blank '+(bi+1));
        w.placeholder=bl.hint||'type here';
      } else {
        w=el('select','blanksel'); w.setAttribute('aria-label','Blank '+(bi+1));
        var o0=el('option'); o0.value=''; o0.textContent='\u2014 choose \u2014'; w.appendChild(o0);
        shuffle((bl.options||[]).slice()).forEach(function(op){ var x=el('option'); x.value=op; x.textContent=op; w.appendChild(x); });
      }
      widgets[bi]=w; wrap.appendChild(w);
    }
  }
  ansBody.appendChild(wrap);
  function norm(x){ return (x||'').trim().replace(/\s+/g,' ').toLowerCase(); }
  CUR.getGrade=function(){
    var any=false,H=0,W=0,rows=[];
    ex.blanks.forEach(function(bl,bi){
      var v=widgets[bi].value;
      var acc=[bl.correct].concat(bl.accept||[]);
      var ok=acc.some(function(a){ return norm(a)===norm(v); });
      if(String(v).trim()===''){ rows.push({st:'miss',text:'Blank '+(bi+1)+': empty \u2014 correct: \u201C'+bl.correct+'\u201D'}); }
      else if(ok){ H++; any=true; rows.push({st:'ok',text:'Blank '+(bi+1)+': '+bl.correct}); }
      else{ W++; any=true; rows.push({st:'bad',text:'Blank '+(bi+1)+': you wrote \u201C'+v+'\u201D; correct: \u201C'+bl.correct+'\u201D'}); }
    });
    if(!any) return null;
    var N=ex.blanks.length;
    return {credit:scoreExercise(H,W,N),rows:rows,H:H,W:W,N:N,
      answerSummary:ex.blanks.map(function(bl,i){ return 'Blank '+(i+1)+': '+bl.correct; }).join('  |  ')};
  };
  CUR.lock=function(){ Object.keys(widgets).forEach(function(k){ widgets[k].disabled=true; }); };
}

/* ---------- branching scenario ---------- */
function buildBranch(ex,ansBody){
  var st={ idx:0, results:[] };
  CUR.branch=st;
  var stepLab=el('span','steplab'); ansBody.appendChild(stepLab);
  var updBox=el('div',null); ansBody.appendChild(updBox);
  var qwrap=el('div',null); ansBody.appendChild(qwrap);
  var outBox=el('div',null); ansBody.appendChild(outBox);
  var picked=[];
  function renderStep(){
    var k=st.idx, sp=ex.steps[k];
    stepLab.textContent='STEP '+(k+1)+' OF '+ex.steps.length;
    if(k===ex.steps.length-1){
      CUR.getGrade=function(){
        if(st.results[k]===undefined) return null;
        var H=0,W=0,rows=[];
        ex.steps.forEach(function(s2,i2){
          if(st.results[i2]){ H++; rows.push({st:'ok',text:'Step '+(i2+1)+' \u2014 '+s2.q}); }
          else { W++; rows.push({st:'bad',text:'Step '+(i2+1)+' \u2014 '+s2.q+'  (right action: '+s2.options.filter(function(o){return o.correct;})[0].t+')'}); }
        });
        var N=ex.steps.length;
        return {credit:scoreExercise(H,W,N),rows:rows,H:H,W:W,N:N,
          answerSummary:ex.steps.map(function(s2,i2){ return 'Step '+(i2+1)+': '+s2.options.filter(function(o){return o.correct;})[0].t; }).join('  |  ')};
      };
    }
    clr(updBox);
    if(sp.add && sp.add.length && k>0){
      var ub=el('div','blk blk-scenario');
      var uh=blkHead('SCENARIO \u2014 UPDATE','\u25B6'); ub.appendChild(uh);
      var ubd=el('div','blk-body'); sp.add.forEach(function(b){ renderBlock(b,ubd); });
      ub.appendChild(ubd); updBox.appendChild(ub);
    }
    clr(qwrap);
    qwrap.appendChild(el('div','qtext',sp.q));
    var box=el('div','opts'); qwrap.appendChild(box);
    picked=[];
    var order=shuffle(sp.options.map(function(o,i){ return {i:i,t:o.t,correct:!!o.correct}; }));
    order.forEach(function(o,kk){
      var b=el('button','opt'); b.type='button'; b.setAttribute('aria-pressed','false');
      b.appendChild(el('span','opt-key',String.fromCharCode(65+kk)+'.'));
      b.appendChild(el('span','opt-t',o.t));
      b.addEventListener('click',function(){
        if(st.results[k]!==undefined) return;
        picked=[o];
        Array.prototype.forEach.call(box.children,function(c){ c.classList.remove('sel'); c.setAttribute('aria-pressed','false'); });
        b.classList.add('sel'); b.setAttribute('aria-pressed','true');
      });
      box.appendChild(b);
    });
    var act=el('div','actrow');
    var btn=el('button','btn btn-primary', k===ex.steps.length-1 ? 'Check' : 'Confirm step');
    btn.type='button';
    btn.addEventListener('click',function(){
      if(st.results[k]!==undefined) return;
      if(picked.length===0){ setNote('Choose an option to confirm this step.'); return; }
      var ok=picked[0].correct;
      st.results[k]=ok;
      Array.prototype.forEach.call(box.children,function(c){ c.disabled=true; });
      var oc=el('div','outcome '+(ok?'ok':'bad'));
      oc.appendChild(el('span','olab',(ok?'\u2713 Correct step. ':'\u2717 Not the best step. ')));
      oc.appendChild(document.createTextNode(sp.outcome));
      outBox.appendChild(oc);
      btn.disabled=true;
      if(k===ex.steps.length-1){
        onCheck();
      } else {
        st.idx=k+1;
        var nb=el('button','btn','Next step \u2192'); nb.type='button';
        nb.addEventListener('click',function(){ nb.disabled=true; renderStep(); });
        act.appendChild(nb);
      }
    });
    act.appendChild(btn); qwrap.appendChild(act);
  }
  renderStep();
  CUR.lock=function(){ Array.prototype.forEach.call(qwrap.querySelectorAll('button'),function(b){ b.disabled=true; }); };
}


/* ============ note line ============ */
var noteTimer=null;
function setNote(t){
  var n=q('#actnote'); if(!n) return;
  n.textContent=t;
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer=setTimeout(function(){ if(n) n.textContent=''; },4000);
}

/* ============ check / next / skip / hint ============ */
function onCheck(){
  var ex=CUR.ex; if(!ex||S.answered[ex.id]) return;
  var g=CUR.getGrade ? CUR.getGrade() : null;
  if(g===null||g===undefined){ setNote('Give an answer first, then press Check.'); return; }
  var credit=g.credit;
  if(S.hintUsed[ex.id]) credit=Math.max(0,credit-0.10);
  credit=clamp01(credit);
  Timer.toAutoPause(); /* first engine action of Check: stop the clock before feedback exists */
  S.credits[ex.id]=credit; S.answered[ex.id]=true;
  if(CUR.lock) CUR.lock();
  Array.prototype.forEach.call(q('#main').querySelectorAll('.opt'),function(b){ b.disabled=true; });
  renderFeedback(g,credit);
  var nx=q('#btnNext'); if(nx){ nx.style.display=''; }
  var ck=q('#btnCheck'); if(ck){ ck.disabled=true; }
  renderHeader();
}
function onNext(){
  var ex=CUR.ex; if(!ex) return;
  if(!S.answered[ex.id]) { setNote('Press Check first (or use Skip).'); return; }
  if(Timer.state==='PAUSED_AUTO_CHECK') Timer.toRunning();
  if(S.fromReview){
    var i=S.skipped.indexOf(ex.id); if(i>=0) S.skipped.splice(i,1);
    S.fromReview=false; goReview(); return;
  }
  S.cur++;
  if(S.cur>=S.queue.length){
    if(S.skipped.length>0){ goReview(); } else { finalize(false); }
  } else renderCurrent();
}
function onSkip(){
  var ex=CUR.ex; if(!ex||S.answered[ex.id]) return;
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  if(S.fromReview){ S.fromReview=false; goReview(); return; }
  S.cur++;
  if(S.cur>=S.queue.length){
    if(S.skipped.length>0){ goReview(); } else { finalize(false); }
  } else renderCurrent();
  updateHeader();
}
function onHint(){
  var ex=CUR.ex; if(!ex||S.answered[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var hb=q('#fbhint'); if(hb){ hb.style.display=''; }
  var b=q('#btnHint'); if(b){ b.disabled=true; }
  setNote('Hint used: \u221210% of this exercise\u2019s credit if you answer it.');
}

/* ============ feedback ============ */
function renderFeedback(g,credit){
  var box=q('#fb'); if(!box) return; clr(box); box.style.display='';
  var lab,cls,ico;
  if(credit>=0.999){ lab='CORRECT'; cls='fb-ok'; ico='\u2713'; }
  else if(credit>0){ lab='PARTIALLY CORRECT'; cls='fb-part'; ico='\u2713'; }
  else { lab='INCORRECT'; cls='fb-bad'; ico='\u2717'; }
  var fb=el('div','fb '+cls); box.appendChild(fb);
  var head=el('div','fb-head');
  head.appendChild(el('span',null,ico+' '+lab));
  if(g.N>1 || credit<0.999) head.appendChild(el('span','sc-sub',' credit '+credit.toFixed(2)+' \u2014 '+Math.max(0,g.H)+'/'+g.N+' items, (H\u2212W)/N with H='+g.H+', W='+g.W));
  fb.appendChild(head);
  fb.appendChild(el('div','fb-ans',null));
  var ans=fb.querySelector('.fb-ans');
  ans.appendChild(el('b',null,'Correct answer: '));
  ans.appendChild(document.createTextNode(g.answerSummary));
  var rows=el('div','fb-rows');
  g.rows.forEach(function(r){
    var row=el('div','fbrow '+(r.st==='ok'?'rok':(r.st==='bad'?'rbad':'rmiss')));
    row.appendChild(el('span','ric',r.st==='ok'?'\u2713':(r.st==='bad'?'\u2717':'\u25CB')));
    row.appendChild(el('span',null,(r.st==='ok'?'Correct \u2014 ':(r.st==='bad'?'Wrong \u2014 ':'Missed \u2014 '))+r.text));
    rows.appendChild(row);
  });
  fb.appendChild(rows);
  fb.appendChild(el('p','fb-exp',CUR.ex.explain));
  if(credit<1 && CUR.ex.study) fb.appendChild(el('p','fb-study',null)).innerHTML='<b>What to study: </b>';
  if(credit<1 && CUR.ex.study){ var sp=fb.querySelector('.fb-study'); sp.appendChild(document.createTextNode(CUR.ex.study)); }
}

/* ============ header ============ */
function tmStateUI(){
  switch(Timer.state){
    case 'RUNNING': return {t:'\u25B6 RUNNING',c:'tm-chip tm-run'};
    case 'PAUSED_MANUAL': return {t:'\u23F8 PAUSED \u2014 manual (press Resume)',c:'tm-chip tm-paused'};
    case 'PAUSED_AUTO_CHECK': return {t:'\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)',c:'tm-chip tm-paused'};
    case 'ENDED': return {t:'\u25A0 ENDED',c:'tm-chip tm-end'};
    default: return {t:'\u2014',c:'tm-chip'};
  }
}
function updateTimerUI(){
  var t=q('#hTimer'); if(t) t.textContent=fmt(Timer.left);
  var st=tmStateUI(); var c=q('#hTmState');
  if(c){ c.textContent=st.t; c.className=st.c; }
}
function scoreNow(){
  var sum=0,cnt=0;
  Object.keys(S.answered).forEach(function(id){ if(S.answered[id]){ sum+=S.credits[id]; cnt++; } });
  return {sum:sum,cnt:cnt,pct:cnt>0?Math.round(sum/cnt*100):0};
}
function updateHeader(){
  var sc=scoreNow();
  var s=q('#hScore');
  if(s){ s.innerHTML=''; 
    var b1=el('span',null,sc.sum.toFixed(1)+' / '+sc.cnt);
    b1.style.color='var(--text-primary)';
    s.appendChild(b1);
    s.appendChild(el('span','sc-sub','  \u00B7  '+sc.pct+'%'));
  }
  var pr=q('#pbar');
  if(pr){
    var done=0; Object.keys(S.answered).forEach(function(id){ if(S.answered[id]) done++; });
    done+=S.skipped.length;
    pr.style.width=Math.min(100,Math.round(done/EXS.length*100))+'%';
  }
  var cnt=q('#hCount');
  if(cnt){
    if(S.view==='exam'&&CUR.ex) cnt.textContent='Exercise '+(EXS.indexOf(CUR.ex)+1)+' of '+EXS.length;
    else if(S.view==='review') cnt.textContent='Review skipped ('+S.skipped.length+' left)';
    else if(S.view==='results') cnt.textContent='Results';
    else cnt.textContent='';
  }
  var hb=q('#btnHint'); if(hb) hb.disabled=(S.view!=='exam')||(!!CUR.ex&&!!S.hintUsed[CUR.ex.id]);
  var sb=q('#btnSkip'); if(sb) sb.disabled=(S.view!=='exam')||(!!CUR.ex&&!!S.answered[CUR.ex.id]);
  var pb=q('#btnPause'); if(pb) pb.disabled=S.finished;
}
function renderHeader(){
  updateTimerUI(); updateHeader();
}

/* ============ exercise view ============ */
function renderCurrent(){
  var exId=S.queue[S.cur]; var ex=exById(exId);
  CUR.ex=ex; CUR.getGrade=null; CUR.ranOnce=false; CUR.branch=null;
  S.view='exam';
  var main=q('#main'); clr(main);
  var card=newCard(ex);
  card.appendChild(scenarioNode(ex));
  card.appendChild(questionNode(ex));
  var ans=answerNode();
  var ansBody=ans.querySelector('.blk-body');
  var fbhint=el('div','hintbox'); fbhint.id='fbhint'; fbhint.style.display='none';
  fbhint.appendChild(el('div','htitle','\u204D HINT (\u221210% of this exercise\u2019s credit)'));
  fbhint.appendChild(el('div',null,ex.hint));
  if(ex.type==='qcm') buildQCM(ex,ansBody,false);
  else if(ex.type==='qcm-multi') buildQCM(ex,ansBody,true);
  else if(ex.type==='match') buildMatch(ex,ansBody);
  else if(ex.type==='order') buildOrder(ex,ansBody);
  else if(ex.type==='dd') buildDD(ex,ansBody);
  else if(ex.type==='fill') buildFill(ex,ansBody);
  else if(ex.type==='branch') buildBranch(ex,ansBody);
  ansBody.appendChild(fbhint);
  var act=el('div','actrow');
  var ck=el('button','btn btn-primary','Check'); ck.id='btnCheck'; ck.type='button';
  ck.addEventListener('click',onCheck);
  var nx=el('button','btn','Next'); nx.id='btnNext'; nx.type='button'; nx.style.display='none';
  nx.addEventListener('click',onNext);
  var note=el('span','actnote'); note.id='actnote';
  act.appendChild(ck); act.appendChild(nx); act.appendChild(note);
  ansBody.appendChild(act);
  card.appendChild(ans);
  var fb=el('div'); fb.id='fb'; fb.style.display='none'; card.appendChild(fb);
  main.appendChild(card);
  window.scrollTo(0,0);
  renderHeader();
}
function exById(id){ for(var i=0;i<EXS.length;i++){ if(EXS[i].id===id) return EXS[i]; } return null; }

/* ============ review-skipped view ============ */
function goReview(){
  S.view='review'; S.fromReview=false;
  if(Timer.state==='PAUSED_AUTO_CHECK') Timer.toRunning();
  var main=q('#main'); clr(main);
  var c=el('div','card');
  c.appendChild(el('div','kicker','BEFORE YOU FINISH'));
  c.appendChild(el('h2',null,'Review skipped exercises'));
  if(S.skipped.length===0){ finalize(false); return; }
  c.appendChild(el('p','rvnote','You skipped the exercises below. You can go back to any of them and answer it now, as many times as you need, while the timer is still running. If you submit with skipped exercises left, they are excluded from your score \u2014 they do not count as right or wrong.'));
  S.skipped.forEach(function(id){
    var ex=exById(id);
    var row=el('div','rvitem');
    row.appendChild(el('span','rico','\u26A0'));
    row.appendChild(el('span','rt',null)).innerHTML='<b>'+ex.id+'</b> \u2014 '+ex.title+'  <span class="sc-sub">(Skipped)</span>';
    var b=el('button','btn','Return to exercise'); b.type='button';
    b.addEventListener('click',function(){
      S.cur=S.queue.indexOf(id); S.fromReview=true; renderCurrent();
    });
    row.appendChild(b); c.appendChild(row);
  });
  var act=el('div','actrow');
  var fin=el('button','btn btn-primary','Final submit & see results'); fin.type='button';
  fin.addEventListener('click',function(){ finalize(false); });
  act.appendChild(fin); c.appendChild(act);
  main.appendChild(c);
  window.scrollTo(0,0);
  renderHeader();
}

/* ============ results view + site report ============ */
function finalize(early){
  if(S.finished && S.view==='results') return;
  S.finished=true; S.view='results'; Timer.toEnded();
  var sc=scoreNow();
  var fully=0,partly=0,n=0,partSum=0;
  Object.keys(S.answered).forEach(function(id){
    if(!S.answered[id]) return;
    var c=S.credits[id];
    if(c>=0.999) fully++;
    else if(c>0){ partly++; partSum+=c; }
    else n++;
  });
  var skippedN=EXS.length-sc.cnt-n-partly-fully; skippedN=Math.max(0,EXS.length-sc.cnt);
  var main=q('#main'); clr(main);
  var c=el('div','card');
  c.appendChild(el('div','kicker','FINAL RESULTS'));
  c.appendChild(el('div','finalscore',null));
  var fs=c.querySelector('.finalscore');
  var b1=el('span',null,sc.sum.toFixed(1)+'/'+sc.cnt+' ');
  fs.appendChild(b1);
  fs.appendChild(el('span','fs-pct',sc.pct+'%'));
  var cert=el('div','cert '+(sc.pct>=70&&sc.cnt>0?'pass':'fail'));
  var pass=sc.pct>=70&&sc.cnt>0;
  cert.appendChild(el('div','cl',(pass?'\u2713 PASS':'\u2717 FAIL')));
  cert.appendChild(el('div','cs',pass
    ?'You reached the 70% pass mark over the exercises you answered. Well done \u2014 you showed working knowledge of '+META.objectName+' at '+META.severityLabel+' level.'
    :(sc.cnt===0
      ?'Nothing was answered, so there is no score. Retake the exam when you are ready.'
      :'You did not reach the 70% pass mark. Study the feedback below and take the exam again \u2014 questions and options will be reshuffled.')));
  c.appendChild(cert);
  var g=el('div','resgrid');
  g.appendChild(resCard('ok','\u2713','Fully correct',fully,'credit 1.00 each'));
  g.appendChild(resCard('part','\u2713','Partially correct',partly,partly>0?('avg credit '+ (partSum/partly).toFixed(2)):'\u2014'));
  g.appendChild(resCard('bad','\u2717','Fully incorrect',n,'credit 0.00'));
  g.appendChild(resCard('skip','\u26A0','Skipped \u2014 excluded',skippedN,'not counted'));
  c.appendChild(g);
  var ps=el('p','pstats','Time paused manually: '+fmt(Timer.pm)+' \u00B7 Time paused to review feedback: '+fmt(Timer.pa)+' \u00B7 Time left: '+fmt(Timer.left)+(early?' \u00B7 The timer ended, so unanswered exercises were excluded.':''));
  c.appendChild(ps);
  var tb=el('table','rtable');
  var trh=el('tr'); ['#','Exercise','Credit','Result'].forEach(function(h){ trh.appendChild(el('th',null,h)); }); tb.appendChild(trh);
  EXS.forEach(function(ex){
    var tr=el('tr');
    tr.appendChild(el('td',null,ex.id));
    tr.appendChild(el('td',null,ex.title));
    if(S.answered[ex.id]){
      var cr=S.credits[ex.id];
      tr.appendChild(el('td',null,cr.toFixed(2)));
      var lab,cls;
      if(cr>=0.999){lab='\u2713 Fully correct';cls='ok';}
      else if(cr>0){lab='\u2713 Partially correct';cls='part';}
      else {lab='\u2717 Fully incorrect';cls='bad';}
      tr.appendChild(el('td',cls,lab));
    } else {
      tr.appendChild(el('td','skipc','\u2014'));
      tr.appendChild(el('td','skipc','\u26A0 Skipped \u2014 excluded'));
    }
    tb.appendChild(tr);
  });
  c.appendChild(tb);
  var act=el('div','actrow');
  var rt=el('button','btn btn-primary','\u21BA Retake exam'); rt.type='button';
  rt.addEventListener('click',retake);
  act.appendChild(rt); c.appendChild(act);
  main.appendChild(c);
  window.scrollTo(0,0);
  reportScore(sc);
  renderHeader();
}
function resCard(cls,ico,label,val,sub){
  var d=el('div','rescard '+cls);
  d.appendChild(el('div','rv',ico+' '+val));
  d.appendChild(el('div','rl',label));
  d.appendChild(el('div','rl',sub));
  return d;
}
function reportScore(sc){
  if(S.reported) return; S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId, batch:META.batch,
      score:Math.round(sc.sum), total:sc.cnt,
      percent:sc.pct, passed:sc.pct>=70&&sc.cnt>0
    },location.origin);
  }catch(e){ /* opened directly: nothing to report to */ }
}

/* ============ intro view ============ */
function renderIntro(){
  S.view='intro'; S.finished=false;
  q('#hdr').style.display='none';
  var main=q('#main'); clr(main);
  var c=el('div','card');
  c.appendChild(el('div','kicker','CERTIFICATION PRACTICE EXAM'));
  c.appendChild(el('div','iw-title',META.examTitle));
  var obj=el('div','iw-obj',META.objectName+' \u2014 MITRE ATT&CK '+META.objectType+' \u00B7 ID '+META.id);
  c.appendChild(obj);
  var strip=el('div','iw-strip');
  strip.appendChild(el('span',null,null)).innerHTML='';
  function chip(lbl,val){ var sp=el('span',null,null); var b=el('b',null,val); sp.appendChild(document.createTextNode(lbl+' ')); sp.appendChild(b); strip.appendChild(sp); }
  chip('Severity:',null);
  var sb=el('span','badge '+META.sevClass,META.severityLabel); strip.appendChild(sb);
  chip('Exercises:',String(EXS.length));
  chip('Estimated time:',META.estimatedMinutes+' minutes');
  chip('Timer budget:',fmt(META.timerSeconds));
  chip('Pass mark:',META.passMark+'%');
  c.appendChild(strip);
  main.appendChild(c);

  var c2=el('div','card learn');
  c2.appendChild(el('h2',null,'What you will learn here'));
  var learn=el('div',null); learn.innerHTML=INTRO.learn; c2.appendChild(learn);
  main.appendChild(c2);

  var c3=el('div','card');
  c3.appendChild(el('h2',null,'Keywords covered in this exam'));
  INTRO.keywords.forEach(function(kw){
    var kt=el('div','kw-theme');
    kt.appendChild(el('h3',null,kw.theme));
    var ul=el('ul'); kw.items.forEach(function(i){ ul.appendChild(el('li',null,i)); });
    kt.appendChild(ul); c3.appendChild(kt);
  });
  main.appendChild(c3);

  var c4=el('div','card how');
  c4.appendChild(el('h2',null,'How this exam works'));
  var how=el('div',null); how.innerHTML=INTRO.how; c4.appendChild(how);
  var act=el('div','startrow');
  var st=el('button','btn btn-primary','\u25B6 Start exam'); st.type='button';
  st.addEventListener('click',startExam);
  act.appendChild(st);
  act.appendChild(el('span','rvnote','Good luck \u2014 read each scenario twice before answering.'));
  c4.appendChild(act);
  main.appendChild(c4);
  window.scrollTo(0,0);
}

/* ============ exam start / retake ============ */
function startExam(){
  S.attempt++;
  S.credits={}; S.answered={}; S.skipped=[]; S.hintUsed={};
  S.fromReview=false; S.reported=false; S.finished=false; S.cur=0;
  S.queue=shuffle(EXS.map(function(e){ return e.id; }));
  Timer.start(META.timerSeconds);
  q('#hdr').style.display='flex';
  S.view='exam';
  renderCurrent();
}
function retake(){
  startExam();
}

/* ============ manual pause overlay ============ */
function ensureOverlay(){
  if(q('#poverlay')) return;
  var ov=el('div'); ov.id='poverlay';
  var box=el('div','pbox');
  box.appendChild(el('div','pic','\u23F8'));
  box.appendChild(el('div','pt','PAUSED \u2014 manual'));
  box.appendChild(el('div','ps','The exercise is hidden and the timer is stopped. Press Resume when you want to continue.'));
  var b=el('button','btn btn-primary','\u25B6 Resume'); b.type='button';
  b.addEventListener('click',function(){
    Timer.toResume();
    ov.style.display='none';
    q('#main').setAttribute('aria-hidden','false');
    renderHeader();
  });
  box.appendChild(b); ov.appendChild(box); document.body.appendChild(ov);
}
function onPause(){
  if(S.finished) return;
  if(S.view!=='exam'&&S.view!=='review') return;
  if(Timer.state==='RUNNING'||Timer.state==='PAUSED_AUTO_CHECK'){
    Timer.toManualPause();
    ensureOverlay();
    var ov=q('#poverlay'); ov.style.display='flex';
    q('#main').setAttribute('aria-hidden','true');
    renderHeader();
  }
}

/* ============ site handshake ============ */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  S.user=event.data.username||''; S.country=event.data.country||''; S.locale=event.data.locale||'';
  S.hsTopic=event.data.topicId||''; S.hsBatch=event.data.batch;
  if(S.user){
    var h=q('#hdrUser');
    if(h) h.textContent='Analyst: '+S.user;
  }
});

/* ============ boot ============ */
document.addEventListener('DOMContentLoaded',function(){
  q('#btnHint').addEventListener('click',onHint);
  q('#btnSkip').addEventListener('click',onSkip);
  q('#btnPause').addEventListener('click',onPause);
  ensureOverlay();
  renderIntro();
});
})();

</script>
