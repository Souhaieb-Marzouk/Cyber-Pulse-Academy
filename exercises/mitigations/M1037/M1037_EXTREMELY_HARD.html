  function buildDnd(root, ex) {
    var d = ex.data;
    var w = el('div', 'dnd-wrap');
    var bankWrap = el('div', '');
    bankWrap.appendChild(el('div', 'bank-label', 'ITEMS — drag each item, or tap it then tap a bucket'));
    var bank = el('div', 'itembank');
    bank.id = 'bank_' + ex.id;
    bankWrap.appendChild(bank);
    answerWidgets.dnd = { placed: {}, picked: null };
    var items = shuffle(d.items);
    for (var i = 0; i < items.length; i++) { bank.appendChild(makeDItem(items[i])); }
    var buckets = el('div', 'buckets');
    for (var b = 0; b < d.buckets.length; b++) {
      (function (bk) {
        var box = el('div', 'bucket');
        box.dataset.bucket = bk.id;
        box.innerHTML = '<h4><span aria-hidden="true">\uD83D\uDCE5</span> ' + esc(bk.name) + '</h4><div class="b-drop"></div>';
        box.addEventListener('dragover', function (ev) { ev.preventDefault(); box.classList.add('b-over'); });
        box.addEventListener('dragleave', function () { box.classList.remove('b-over'); });
        box.addEventListener('drop', function (ev) {
          ev.preventDefault(); box.classList.remove('b-over');
          var id = ev.dataTransfer.getData('text/plain');
          placeItem(id, bk.id);
        });
        box.addEventListener('click', function () {
          if (answerWidgets.dnd.picked) { placeItem(answerWidgets.dnd.picked, bk.id); }
        });
        buckets.appendChild(box);
      })(d.buckets[b]);
    }
    function makeDItem(it) {
      var di = el('div', 'ditem');
      di.textContent = it.t;
      di.draggable = true; di.dataset.item = it.id; di.id = 'it_' + it.id;
      di.setAttribute('tabindex', '0');
      di.setAttribute('role', 'button');
      di.setAttribute('aria-label', 'Item: ' + it.t + '. Press Enter to pick up, then choose a bucket button below.');
      di.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', it.id); di.classList.add('dragging'); });
      di.addEventListener('dragend', function () { di.classList.remove('dragging'); });
      di.addEventListener('click', function () {
        if (di.classList.contains('locked')) return;
        var was = di.classList.contains('picked');
        var all = document.querySelectorAll('.ditem.picked');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('picked');
        if (!was) { di.classList.add('picked'); answerWidgets.dnd.picked = it.id; }
        else answerWidgets.dnd.picked = null;
      });
      return di;
    }
    function placeItem(id, bucketId) {
      if (!id || answerWidgets.dnd.placed[id] !== undefined) return;
      var di = $('it_' + id); if (!di) return;
      var box = buckets.querySelector('.bucket[data-bucket="' + bucketId + '"] .b-drop');
      if (!box) return;
      di.classList.remove('picked');
      box.appendChild(di);
      answerWidgets.dnd.placed[id] = bucketId;
      answerWidgets.dnd.picked = null;
    }
    w.appendChild(bankWrap);
    w.appendChild(buckets);
    root.appendChild(w);
  }

  function buildBlank(root, ex) {
    var d = ex.data;
    answerWidgets.blank = {};
    var slotsWrap = el('div', 'slots');
    var html = '';
    var text = d.text;
    var parts = text.split(/\{\{(\d+)\}\}/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var n = parts[i];
        html += '<span class="slot" data-slot="' + n + '" tabindex="0" role="button" aria-label="Blank ' + n + ', tap to clear"><span class="sv">&nbsp;</span></span>';
      } else {
        html += esc(parts[i]);
      }
    }
    slotsWrap.innerHTML = html;
    root.appendChild(slotsWrap);
    var slots = slotsWrap.querySelectorAll('.slot');
    var focusSlot = null;
    for (var s = 0; s < slots.length; s++) {
      (function (sl) {
        sl.addEventListener('click', function () {
          if (sl.dataset.token) { /* filled: return token */
            delete answerWidgets.blank[sl.dataset.slot];
            var tk = $('tk_' + sl.dataset.token);
            if (tk) { tk.classList.remove('used'); }
            sl.dataset.token = ''; sl.querySelector('.sv').innerHTML = '&nbsp;'; sl.classList.remove('filled');
          }
          focusSlot = sl.dataset.slot;
        });
      })(slots[s]);
    }
    var lbl = el('div', 'bank-label', 'WORD BANK — tap a word to put it in the last-chosen empty blank (or the next free one)');
    root.appendChild(lbl);
    var bank = el('div', 'bank');
    for (var b = 0; b < d.bank.length; b++) {
      (function (tk) {
        var bt = el('button', 'btoken');
        bt.type = 'button'; bt.id = 'tk_' + tk.id; bt.textContent = tk.t;
        bt.addEventListener('click', function () {
          if (bt.classList.contains('used')) return;
          var target = null;
          if (focusSlot && !answerWidgets.blank[focusSlot]) target = focusSlot;
          if (!target) {
            for (var k = 0; k < slots.length; k++) {
              if (!answerWidgets.blank[slots[k].dataset.slot]) { target = slots[k].dataset.slot; break; }
            }
          }
          if (!target) return;
          answerWidgets.blank[target] = tk.id;
          var slp = slotsWrap.querySelector('.slot[data-slot="' + target + '"]');
          slp.dataset.token = tk.id;
          slp.querySelector('.sv').textContent = tk.t;
          slp.classList.add('filled');
          bt.classList.add('used');
        });
        bank.appendChild(bt);
      })(d.bank[b]);
    }
    root.appendChild(bank);
  }

  function buildOrder(root, ex) {
    var d = ex.data;
    answerWidgets.order = { seq: d.display.map(function (it) { return it.id; }) };
    var list = el('div', 'orderlist');
    list.id = 'orderList';
    function redraw() {
      list.innerHTML = '';
      var seq = answerWidgets.order.seq;
      for (var i = 0; i < seq.length; i++) {
        (function (pos, id) {
          var it = d.display.filter(function (x) { return x.id === id; })[0];
          var row = el('div', 'oline');
          row.draggable = true; row.dataset.pos = pos;
          row.innerHTML = '<span class="onum">' + (pos + 1) + '</span><span class="otext">' + esc(it.t) + '</span>';
          var btns = el('span', 'obtns');
          var up = el('button', '', '\u2191'); up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          var dn = el('button', '', '\u2193'); dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          up.addEventListener('click', function () { swap(pos, -1); });
          dn.addEventListener('click', function () { swap(pos, 1); });
          btns.appendChild(up); btns.appendChild(dn);
          row.appendChild(btns);
          row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(pos)); row.classList.add('dragging'); });
          row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
          row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
          row.addEventListener('drop', function (ev) {
            ev.preventDefault();
            var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
            var to = parseInt(row.dataset.pos, 10);
            if (isNaN(from) || isNaN(to) || from === to) return;
            var s = answerWidgets.order.seq;
            var mv = s.splice(from, 1)[0];
            s.splice(to, 0, mv);
            redraw();
          });
          list.appendChild(row);
        })(i, seq[i]);
      }
    }
    function swap(pos, dir) {
      var s = answerWidgets.order.seq;
      var to = pos + dir;
      if (to < 0 || to >= s.length) return;
      var t = s[pos]; s[pos] = s[to]; s[to] = t;
      redraw();
    }
    redraw();
    root.appendChild(list);
    root.appendChild(el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Use the arrows or drag the rows. First row = rank 1.</span>'));
  }

  function buildTree(root, ex) {
    var d = ex.data;
    answerWidgets.tree = { step: 0, picks: {} };
    var holder = el('div', '');
    holder.id = 'treeHolder';
    root.appendChild(holder);
    var nextBtn = el('button', 'primary', 'Confirm and go to the next step');
    nextBtn.id = 'treeNextBtn';
    nextBtn.disabled = true;
    nextBtn.addEventListener('click', function () {
      var st = d.steps[answerWidgets.tree.step];
      var pick = answerWidgets.tree.picks[answerWidgets.tree.step];
      if (!pick) return;
      answerWidgets.tree.step++;
      nextBtn.disabled = true;
      drawStep();
    });
    root.appendChild(nextBtn);
    function drawStep() {
      holder.innerHTML = '';
      var si = answerWidgets.tree.step;
      if (si >= d.steps.length) {
        nextBtn.disabled = true; nextBtn.classList.add('hidden');
        var done = el('div', 'tree-recorded', '\u2705 All steps answered. Press Check to see how you did.');
        holder.appendChild(done);
        return;
      }
      var st = d.steps[si];
      var box = el('div', 'tree-step');
      box.innerHTML = '<span class="step-tag">STEP ' + (si + 1) + ' OF ' + d.steps.length + '</span>';
      if (st.artefactLabel) box.innerHTML += '<p style="font-size:13px;color:var(--muted);margin:4px 0">Re-read artefact: <b>' + esc(st.artefactLabel) + '</b> above if you need it.</p>';
      box.innerHTML += '<p class="step-q">' + st.q + '</p>';
      var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
      for (var i = 0; i < st.options.length; i++) {
        (function (oi, k) {
          var lab = el('label', 'opt');
          lab.innerHTML = '<input type="radio" name="tree_' + si + '" value="' + oi.id + '"><span class="olabel">' + labels[k] + '.</span><span>' + esc(oi.t) + '</span>';
          var input = lab.querySelector('input');
          input.addEventListener('change', function () {
            answerWidgets.tree.picks[si] = oi.id;
            nextBtn.disabled = false;
          });
          box.appendChild(lab);
        })(st.options[i], i);
      }
      holder.appendChild(box);
    }
    drawStep();
  }

  function buildClick(root, ex) {

  function buildTerminal(root, ex) {

    function runLine() {

          }
        } else {
          scroll.innerHTML += '<div class="term-line" style="color:#ff8f8f">sh: ' + esc(first) + ': command not found (simulation)</div>';
        }

    root.appendChild(note);
  }

  window.__enginePart = 2;


  /* ---------------- grading ---------------- */
  function collectAnswer(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') return Object.keys(answerWidgets.choice.selected);
    if (ex.type === 'match') {
      var m = answerWidgets.match, out = [];
      for (var k in m) { if (m[k]) out.push(k + '=>' + m[k]); }
      return out;
    }
    if (ex.type === 'categorize') {
      var p = answerWidgets.dnd.placed, arr = [];
      for (var k2 in p) arr.push(k2 + '=>' + p[k2]);
      return arr;
    }
    if (ex.type === 'blank') {
      var b = answerWidgets.blank, arr2 = [];
      for (var k3 in b) arr2.push(k3 + '=>' + b[k3]);
      return arr2;
    }
    if (ex.type === 'order') {
      return answerWidgets.order.seq.map(function (id, i) { return i + '=>' + id; });
    }
    if (ex.type === 'tree') {
      var picks = answerWidgets.tree.picks, arr3 = [];
      for (var k4 in picks) arr3.push(k4 + '=>' + picks[k4]);
      return arr3;
    }
    if (ex.type === 'clickline') return Object.keys(answerWidgets.click);
    if (ex.type === 'terminal') return [answerWidgets.term.value || ''];
    return [];
  }

  function gradeExercise(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') {
      var correct = d.options.filter(function (o) { return d.correct.indexOf(o.id) !== -1; }).map(function (o) { return o.id; });
      var r = scoreItems(collectAnswer(ex), correct);
      return { r: r, items: optionItems(ex, d, r) };
    }
    if (ex.type === 'match') {
      var sel = collectAnswer(ex);
      var correctPairs = d.pairs.map(function (p) { return p.left + '=>' + p.right; });
      var r2 = scoreItems(sel, correctPairs);
      var items2 = [];
      var given = {};
      for (var i = 0; i < sel.length; i++) { var kv = sel[i].split('=>'); given[kv[0]] = kv[1]; }
      for (var j = 0; j < d.pairs.length; j++) {
        var p = d.pairs[j];
        if (given[p.left] === undefined) items2.push({ st: 'miss', label: p.left + ' → ' + p.right });
        else if (given[p.left] === p.right) items2.push({ st: 'ok', label: p.left + ' → ' + p.right });
        else items2.push({ st: 'no', label: p.left + ' (you chose: ' + given[p.left] + '; right: ' + p.right + ')' });
      }
      return { r: r2, items: items2 };
    }
    if (ex.type === 'categorize') {
      var placed = answerWidgets.dnd.placed;
      var N = d.items.length, H = 0, W = 0;
      var items3 = [];
      var bucketName = {};
      for (var b = 0; b < d.buckets.length; b++) bucketName[d.buckets[b].id] = d.buckets[b].name;
      for (var k = 0; k < d.items.length; k++) {
        var it = d.items[k];
        if (placed[it.id] === undefined) { items3.push({ st: 'miss', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else if (placed[it.id] === it.bucket) { H++; items3.push({ st: 'ok', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else { W++; items3.push({ st: 'no', label: it.t + ' (you put it in ' + bucketName[placed[it.id]] + '; it belongs in ' + bucketName[it.bucket] + ')' }); }
      }
      return { r: { N: N, H: H, W: W, credit: Math.max(0, (H - W) / N) }, items: items3 };
    }
    if (ex.type === 'blank') {
      var filled = answerWidgets.blank;
      var N4 = Object.keys(d.answers).length, H4 = 0, W4 = 0;
      var items4 = [];
      var bankTxt = {};
      for (var z = 0; z < d.bank.length; z++) bankTxt[d.bank[z].id] = d.bank[z].t;
      for (var sn in d.answers) {
        var want = d.answers[sn];
        var got = filled[sn];
        if (got === undefined) items4.push({ st: 'miss', label: 'Blank ' + sn + ': ' + bankTxt[want] });
        else if (got === want) { H4++; items4.push({ st: 'ok', label: 'Blank ' + sn + ': ' + bankTxt[want] }); }
        else { W4++; items4.push({ st: 'no', label: 'Blank ' + sn + ': you wrote "' + bankTxt[got] + '", right is "' + bankTxt[want] + '"' }); }
      }
      return { r: { N: N4, H: H4, W: W4, credit: Math.max(0, (H4 - W4) / N4) }, items: items4 };
    }
    if (ex.type === 'order') {
      var seq = answerWidgets.order.seq;
      var N5 = seq.length, H5 = 0, W5 = 0;
      var items5 = [];
      var txt5 = {};
      for (var t5 = 0; t5 < d.items.length; t5++) txt5[d.items[t5].id] = d.items[t5].t;
      for (var pos = 0; pos < seq.length; pos++) {
        if (seq[pos] === d.correctOrder[pos]) { H5++; items5.push({ st: 'ok', label: 'Position ' + (pos + 1) + ': ' + txt5[seq[pos]] }); }
        else { W5++; items5.push({ st: 'no', label: 'Position ' + (pos + 1) + ': you put "' + txt5[seq[pos]] + '", right is "' + txt5[d.correctOrder[pos]] + '"' }); }
      }
      return { r: { N: N5, H: H5, W: W5, credit: Math.max(0, (H5 - W5) / N5) }, items: items5 };
    }
    if (ex.type === 'tree') {
      var picks = answerWidgets.tree.picks;
      var N6 = d.steps.length, H6 = 0, W6 = 0;
      var items6 = [];
      for (var si = 0; si < d.steps.length; si++) {
        var st = d.steps[si];
        var optTxt = {};
        for (var oi = 0; oi < st.options.length; oi++) optTxt[st.options[oi].id] = st.options[oi].t;
        var pick = picks[si];
        if (pick === undefined) items6.push({ st: 'miss', label: 'Step ' + (si + 1) + ': ' + optTxt[st.correct] });
        else if (pick === st.correct) { H6++; items6.push({ st: 'ok', label: 'Step ' + (si + 1) + ': ' + optTxt[st.correct] }); }
        else { W6++; items6.push({ st: 'no', label: 'Step ' + (si + 1) + ': you chose "' + optTxt[pick] + '"; right is "' + optTxt[st.correct] + '"' }); }
      }
      return { r: { N: N6, H: H6, W: W6, credit: Math.max(0, (H6 - W6) / N6) }, items: items6 };
    }
    if (ex.type === 'clickline') {
      var clicked = Object.keys(answerWidgets.click).map(Number);
      var r7 = scoreItems(clicked, d.correct);
      var items7 = [];
      for (var li = 0; li < d.lines.length; li++) {
        var isC = d.correct.indexOf(li) !== -1;
        var wasClicked = clicked.indexOf(li) !== -1;
        if (isC && wasClicked) items7.push({ st: 'ok', label: 'Line ' + (li + 1) });
        else if (!isC && wasClicked) items7.push({ st: 'no', label: 'Line ' + (li + 1) + ' (selected, but it is normal traffic)' });
        else if (isC && !wasClicked) items7.push({ st: 'miss', label: 'Line ' + (li + 1) + ' (this one was suspicious — you did not select it)' });
      }
      return { r: r7, items: items7 };
    }
    if (ex.type === 'terminal') {
      return gradeTerminal(ex);
    }
    return { r: { N: 1, H: 0, W: 0, credit: 0 }, items: [] };
  }

  function optionItems(ex, d, r) {
    var items = [];
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    for (var i = 0; i < d.options.length; i++) {
      var o = d.options[i];
      var isC = d.correct.indexOf(o.id) !== -1;
      var wasSel = answerWidgets.choice.selected[o.id] === true;
      if (isC && wasSel) items.push({ st: 'ok', label: labels[i] + '. ' + o.t });
      else if (!isC && wasSel) items.push({ st: 'no', label: labels[i] + '. ' + o.t });
      else if (isC && !wasSel) items.push({ st: 'miss', label: labels[i] + '. ' + o.t });
    }
    return items;
  }

  function gradeTerminal(ex) {
    var d = ex.data;
    var norm = ' ' + (answerWidgets.term.value || '').toLowerCase().replace(/\s+/g, ' ').trim() + ' ';
    var H = 0, W = 0;
    var items = [];
    for (var i = 0; i < d.elements.length; i++) {
      var e = d.elements[i];
      var re = new RegExp(e.re, 'i');
      if (re.test(norm)) { H++; items.push({ st: 'ok', label: e.name }); }
      else items.push({ st: 'miss', label: e.name });
    }
    var dangerHit = false;
    for (var j = 0; j < (d.wrong || []).length; j++) {
      var wg = d.wrong[j];
      var re2 = new RegExp(wg.re, 'i');
      if (re2.test(norm)) { W++; dangerHit = dangerHit || !!wg.danger; items.push({ st: 'no', label: wg.name }); }
    }
    return { r: { N: d.elements.length, H: H, W: W, credit: Math.max(0, (H - W) / d.elements.length) }, items: items, danger: dangerHit, typed: (answerWidgets.term.value || '').trim() };
  }

  /* ---------------- check / next / submit ---------------- */
  function onCheck() {
    if (!current || answeredCurrent()) return;
    /* MANDATORY: Check first sets the auto-pause state, then renders feedback. */
    T.exDeadline = null;
    setState('PAUSED_AUTO_CHECK');
    var ex = current;
    var res = gradeExercise(ex);
    var credit = res.r.credit;
    if (hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
    credits[ex.id] = credit;
    if (skipped[ex.id]) delete skipped[ex.id];
    lockWidgets(ex);
    renderFeedback(ex, res, credit);
    updateScore();
    renderHeader();
  }

  function autoCheckTerminal() {
    /* reduced per-exercise timer expired: grade whatever is typed (possibly nothing) */
    if (!current || answeredCurrent()) return;
    onCheck();
  }

  function lockWidgets(ex) {
    var ans = $('answerBody');
    if (!ans) return;
    var els = ans.querySelectorAll('input,select,button,label.opt,div.cline,div.oline,div.ditem,span.slot,.btoken');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (e.tagName === 'INPUT' || e.tagName === 'SELECT') { e.disabled = true; }
      if (e.classList) { e.classList.add('locked'); e.style.pointerEvents = 'none'; }
    }
    var chk = $('checkBtn'); if (chk) chk.disabled = true;
  }

  function renderFeedback(ex, res, credit) {
    var area = $('feedbackArea'); if (!area) return;
    var full = credit >= 0.999;
    var zero = credit <= 0.0001;
    var cls = full ? 'f-correct' : (zero ? 'f-wrong' : 'f-partial');
    var label = full ? '\u2705 CORRECT' : (zero ? '\u274C INCORRECT' : '\u2714 PARTIALLY CORRECT');
    var fb = el('div', 'feedback ' + cls);
    var multi = res.r.N > 1;
    var head = '<div class="fb-head"><span>' + label + '</span></div>';
    var body = '<div class="fb-body">';
    if (multi) {
      body += '<div class="fb-credit">credit ' + credit.toFixed(2) + ' — ' + res.r.H + '/' + res.r.N + ' items correct' + (res.r.W ? ', ' + res.r.W + ' wrong' : '') + ' &middot; formula: max(0, (H − W) / N) = max(0, (' + res.r.H + ' − ' + res.r.W + ') / ' + res.r.N + ')' + (hintUsed[ex.id] ? ' &middot; hint used: −0.10' : '') + '</div>';
    } else if (hintUsed[ex.id]) {
      body += '<div class="fb-credit">hint used: credit reduced by 0.10</div>';
    }
    if (multi) {
      body += '<ul class="itemfb">';
      for (var i = 0; i < res.items.length; i++) {
        var it = res.items[i];
        var ic = it.st === 'ok' ? '<span class="ic i-ok">\u2713</span><span style="font-weight:700;color:#15803d">Correct</span>'
          : it.st === 'no' ? '<span class="ic i-no">\u2717</span><span style="font-weight:700;color:#b91c1c">Wrong</span>'
            : '<span class="ic i-miss">\u25CB</span><span style="font-weight:700;color:#b45309">Missed</span>';
        body += '<li>' + ic + ' <span>' + esc(it.label) + '</span></li>';
      }
      body += '</ul>';
    }
    if (ex.type === 'terminal') {
      body += terminalFeedback(ex, res);
    }
    body += '<div class="explain">' + ex.explain + (ex.type === 'qcm' || ex.type === 'multi' ? singleAnswerText(ex) : '') + '</div>';
    body += '<p class="study">What to study: ' + esc(ex.study) + '</p>';
    body += '</div>';
    fb.innerHTML = head + body;
    area.innerHTML = '';
    area.appendChild(fb);

    /* next / final submit */
    var act = el('div', 'actionrow');
    var isLast = idx >= order.length - 1;
    var nx = el('button', 'primary', isLast ? 'Final Submit' : 'Next \u2192');
    nx.id = 'nextBtn';
    nx.addEventListener('click', function () {
      if (T.state === 'PAUSED_AUTO_CHECK') setState('RUNNING');
      if (fromReview) { fromReview = false; gotoReview(); return; }
      if (isLast) { afterLast(); }
      else { idx++; renderExercise(order[idx]); }
    });
    act.appendChild(nx);
    if (isLast && Object.keys(skipped).length > 0) {
      var rv = el('button', 'ghost', 'Review skipped first (' + Object.keys(skipped).length + ')');
      rv.addEventListener('click', function () { if (T.state === 'PAUSED_AUTO_CHECK') setState('RUNNING'); gotoReview(); });
      act.appendChild(rv);
    }
    area.appendChild(act);
    var reduceMotion = false;
    try { reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e2) { reduceMotion = false; }
    area.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  function singleAnswerText(ex) {
    var d = ex.data;
    if (ex.type !== 'qcm' && ex.type !== 'multi') return '';
    var txt = d.options.filter(function (o) { return d.correct.indexOf(o.id) !== -1; }).map(function (o) { return o.t; }).join(' · ');
    return '<p><b>Right answer:</b> ' + esc(txt) + '</p>';
  }

  function terminalFeedback(ex, res) {
    var d = ex.data;
    var h = '';
    if (res.danger && d.dangerWarn) {
      h += '<div class="warnbox">\u26A0\uFE0F <b>Dangerous command detected.</b> ' + esc(d.dangerWarn) + '</div>';
    }
    h += '<div class="canonical"><b>Canonical answer (you can copy it):</b><pre class="code" id="canonCmd">' + esc(d.canonical) + '</pre>';
    h += '<button class="copybtn" id="copyCmd" type="button">Copy command</button></div>';
    h += '<ul class="itemfb" style="margin-top:10px">';
    for (var i = 0; i < d.elements.length; i++) {
      var e = d.elements[i];
      var ok = res.items.filter(function (x) { return x.st === 'ok' && x.label === e.name; }).length > 0;
      h += '<li><span class="ic ' + (ok ? 'i-ok">\u2713 ' : 'i-miss">\u25CB ') + '</span><span>' + esc(e.name) + (ok ? '' : ' — ' + esc(e.why || '')) + '</span></li>';
    }
    h += '</ul>';
    setTimeout(function () {
      var cb = $('copyCmd');
      if (cb) cb.addEventListener('click', function () {
        var t = $('canonCmd').textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t); cb.textContent = 'Copied!'; }
        else { cb.textContent = 'Select and copy manually'; }
      });
    }, 0);
    return h;
  }

  function afterLast() {
    var unansweredSkipped = [];
    for (var k in skipped) { if (credits[k] === undefined) unansweredSkipped.push(k); }
    if (unansweredSkipped.length > 0 && T.remaining > 0 && T.state !== 'ENDED') { gotoReview(); }
    else { finalSubmit(); }
  }

  function finalSubmit() {
    if (T.state !== 'ENDED') setState('ENDED');
    showResults();
  }

  function timerEnded() {
    if (phase === 'results') return;
    T.state = 'ENDED';
    if (phase !== 'intro') showResults();
  }

  /* ---------------- results ---------------- */
  function showResults() {
    phase = 'results';
    current = null;
    app.innerHTML = '';
    var w = el('div', 'results');
    var answeredN = 0, sum = 0, fullC = 0, partC = 0, partSum = 0, wrongC = 0;
    var skippedN = 0;
    for (var k in skipped) { if (credits[k] === undefined) skippedN++; }
    for (var i = 0; i < order.length; i++) {
      var id = order[i].id;
      if (credits[id] === undefined) continue;
      answeredN++;
      var c = credits[id];
      sum += c;
      if (c >= 0.999) fullC++;
      else if (c <= 0.0001) wrongC++;
      else { partC++; partSum += c; }
    }
    var percent = answeredN > 0 ? Math.round(sum / answeredN * 100) : 0;
    var passed = percent >= CFG.passMark;

    w.innerHTML = '<h1 style="color:var(--head)">Results — ' + esc(CFG.examTitle) + '</h1>' +
      '<div class="scorebox"><span class="bignumber">' + percent + '%</span>' +
      '<div><div style="font-weight:800">Score ' + round1(sum) + ' / ' + answeredN + ' credits</div>' +
      '<div style="color:var(--muted)">Pass mark: ' + CFG.passMark + '% &middot; answered exercises only &middot; skipped-unanswered excluded</div></div></div>' +
      (passed
        ? '<div class="passpanel"><div class="pt">\uD83C\uDFC6 PASS — CERTIFICATE</div><div class="ps">You reached ' + percent + '% on the ' + esc(CFG.severityLabel) + ' tier for ' + esc(CFG.objectId) + ' ' + esc(CFG.objectName) + '.<br>You have shown you can apply this mitigation at this level of difficulty.</div></div>'
        : '<div class="failpanel"><div class="pt">\u274C FAIL — ' + percent + '% (pass mark ' + CFG.passMark + '%)</div><div class="ps">You must retake the exam. Read the feedback you missed, review the intro lesson, then try again.</div></div>');

    var grid = el('div', 'statgrid');
    grid.innerHTML =
      stat(fullC, 'Fully correct') + stat(partC, 'Partially correct' + (partC ? ' (avg ' + (partSum / partC).toFixed(2) + ')' : '')) +
      stat(wrongC, 'Fully incorrect') + stat(skippedN, 'Skipped, never answered (excluded)') +
      stat(fmtTime(T.accManual), 'Time paused manually') + stat(fmtTime(T.accAuto), 'Time paused on feedback');
    w.appendChild(grid);

    var lst = el('div', 'panel');
    lst.innerHTML = '<h2><span aria-hidden="true">\uD83D\uDCCB</span> Exercise by exercise</h2><div class="exlist">';
    for (var j = 0; j < order.length; j++) {
      var ex = order[j]; var id2 = ex.id;
      var st2, word;
      if (credits[id2] === undefined) { st2 = skipped[id2] ? '\u26A0' : '\u25CB'; word = skipped[id2] ? 'Skipped — not answered (excluded)' : 'Not reached (excluded)'; }
      else if (credits[id2] >= 0.999) { st2 = '\u2713'; word = 'Correct'; }
      else if (credits[id2] <= 0.0001) { st2 = '\u2717'; word = 'Incorrect'; }
      else { st2 = '\u2714'; word = 'Partially correct — credit ' + credits[id2].toFixed(2); }
      lst.innerHTML += '<div class="erow"><span style="font-weight:800;width:20px">' + st2 + '</span><span style="flex:1"><b>' + esc(id2) + '</b> ' + esc(ex.title) + '</span><span style="color:var(--muted)">' + word + '</span></div>';
    }
    lst.innerHTML += '</div>';
    w.appendChild(lst);

    var again = el('button', 'primary', passed ? 'Retake Exam' : 'Retake Exam');
    again.style.fontSize = '16px';
    again.addEventListener('click', function () { startExam(); });
    w.appendChild(again);

    app.appendChild(w);
    window.scrollTo(0, 0);
    reportScore(sum, answeredN, percent, passed);
  }

  function stat(v, l) { return '<div class="stat"><div class="sv">' + v + '</div><div class="sl">' + esc(l) + '</div></div>'; }

  /* report exactly once per completed attempt, at the results screen */
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (reportedForAttempt === attempt) return;
    reportedForAttempt = attempt;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
