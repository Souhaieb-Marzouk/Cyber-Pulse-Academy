<script>
window.EXAM_CONFIG = {"topicId":"m1037","batch":4,"difficulty":"extremely-hard","severityLabel":"EXTREMELY HARD","objectId":"M1037","objectName":"Filter Network Traffic","objectType":"Mitigation (ATT&CK Enterprise)","examTitle":"M1037 Filter Network Traffic \u2014 EXTREMELY HARD practice exam","durationSec":3600,"estimatedMinutes":60,"passMark":70,"questionCount":16,"learner":""};
window.INTRO_CONTENT = {"about":"\n<p><b>M1037 is called Filter Network Traffic.</b> In MITRE ATT&amp;CK it is a <b>Mitigation</b>.\nA mitigation is the opposite of an attack: it is a defence that stops or slows known attack techniques.\nATT&amp;CK lists attacks as techniques with IDs like T1090. It lists defences as mitigations with IDs like M1037.</p>\n\n<p><b>What does it mean in practice?</b> M1037 says: use network appliances (firewalls, proxies) and endpoint\nsoftware to <b>filter</b> traffic in three directions. <b>Ingress</b> filtering checks traffic coming <i>into</i> your\nnetwork. <b>Egress</b> filtering checks traffic <i>leaving</i> your network. <b>Lateral</b> filtering checks traffic\nmoving <i>inside</i> your network, between systems. The filter compares each connection against rules. A rule can\nlook at the port (for example TCP 445), the protocol (for example SMB), the IP address, or the domain name.</p>\n\n<p><b>Imagine a big office building.</b> The network is the building. The firewall is the guard at the door.\nThe guard works from a rule list: which doors may open, which visitors may pass, and which rooms they may enter.\nThe guard also stops people from carrying boxes out of the building (data theft is called exfiltration) and stops\nan outsider from whispering secret instructions to someone inside (that secret channel is called C2, short for\ncommand and control). MITRE also lists M1037 for the two big floods, T1498 and T1499. A flood attack (also called\nDoS, short for Denial of Service) sends so much traffic that a service stops working. Here the filter drops the\nflood traffic upstream, before it can drown the service.</p>\n\n<h3>Where you will meet M1037 in real work</h3>\n<ul>\n<li><b>SOC analyst (monitoring team):</b> you read firewall and proxy logs every shift. Lines with\n<span style=\"font-family:monospace\">DENY</span> show what the filter stopped. Many denies from one host can be a real attack.</li>\n<li><b>Firewall / network administrator:</b> you write the rules, test them, and deploy them through a change process.\nYou also remove old rules that are too permissive.</li>\n<li><b>Incident responder (IR):</b> when a host is compromised, you quickly add a deny rule to cut the attacker's\nchannel. This is containment with M1037.</li>\n<li><b>Detection engineer:</b> you build alerts from denied-flow logs, for example when one host makes many\ndenied connections in a short time.</li>\n<li><b>Threat intel analyst (CTI):</b> you map attacker behaviour, for example <span style=\"font-family:monospace\">T1090 Proxy</span>\nor <span style=\"font-family:monospace\">T1572 Protocol Tunneling</span>, to the controls that stop it, and M1037 is one of the main ones.</li>\n<li><b>GRC analyst:</b> you prove the control exists. You map M1037 to frameworks: NIST CSF (PR.PT-4, PR.AC-5),\nCIS Controls (Control 9, and 4.4/4.5/13.4 in v8), and ISO 27001 (A.8.20 to A.8.22).</li>\n<li><b>Cloud engineer:</b> you use security groups and IP allowlists. ATT&amp;CK lists this same idea for cloud\ndata theft (T1530, T1537) and for the cloud metadata API (T1552.005).</li>\n</ul>\n\n<h3>The five measures of M1037</h3>\n<ul>\n<li><b>Ingress traffic filtering:</b> only trusted sources may reach public servers. Limit SSH (22) and RDP (3389) to known IP ranges.</li>\n<li><b>Egress traffic filtering:</b> block outbound traffic to bad destinations so C2 and stolen data cannot leave.</li>\n<li><b>Protocol-based filtering:</b> allow only needed protocols; block abused ones like Telnet or old SMBv1 (EternalBlue).</li>\n<li><b>Network segmentation:</b> split the network into zones and filter the traffic between zones.</li>\n<li><b>Application layer filtering:</b> use proxies or a WAF to inspect web traffic and block attacks like SQL injection.</li>\n</ul>\n\n<p><b>Tools you will see:</b> perimeter firewalls and NGFW, host firewalls (Windows Defender Firewall, iptables on\nLinux), web proxies, WAFs, router ACLs, switch features (DHCP snooping, Dynamic ARP Inspection, port security),\nand cloud security groups.</p>\n","howto":"<p><b>This is the EXTREMELY HARD tier (tier 4 of 4).</b> Three or more ideas are chained, with conflicting signals you must resolve out loud in your head. Some correct answers are 'gather more evidence' or 'escalate', not a technical action. Some actions have real business cost. A widely quoted best practice is the wrong answer somewhere in here.</p><p><b>Exercise types in this tier:</b> a four-step incident decision tree with conflicting signals, emergency fake-terminal containment with a sub-task timer, matching, gap analysis, policy drafting, roadmap ranking, action sorting, query drafting and single-choice questions.</p><p><b>Timer:</b> 60 minutes in total. The clock runs only while you work, never while you read feedback.</p>","rules":"\n<ul>\n<li><b>Passing score: 70%.</b> Your score is the sum of exercise credits, divided by the number of exercises you answered.</li>\n<li><b>16 exercises</b> of a four-step incident decision tree with conflicting signals, emergency fake-terminal containment with a sub-task timer, matching, gap analysis, policy drafting, roadmap ranking, action sorting, query drafting and single-choice questions.</li>\n<li><b>Timer: 60 minutes</b> for this tier. The clock runs only while you work.</li>\n<li><b>Partial credit:</b> many exercises have more than one right item. Each right item adds credit; each wrong\nitem subtracts. The formula is <span style=\"font-family:monospace\">max(0, (H \u2212 W) / N)</span>. H is the items you got right,\nW the wrong ones you chose, N the total right items. Selecting everything is worth zero, not full marks.</li>\n<li><b>Hint:</b> one hint per exercise. It costs 10% of that exercise's credit. A partial answer after a hint still earns partial credit.</li>\n<li><b>Check auto-pause:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you\nwant. Nothing is lost. The timer starts again only when you press <b>Next</b> (or Final Submit on the last exercise).</li>\n<li><b>Manual pause:</b> the Pause button stops the clock and hides the exercise. Resume brings it back.</li>\n<li><b>Skip:</b> every exercise has Skip. Skipped exercises wait in a review pool. Before the end you can open them\nagain and answer, as often as you like, while the timer runs. If you submit with skipped exercises left, they are\nsimply excluded from the score \u2014 no penalty, no points.</li>\n<li><b>Retake:</b> if you fail, the Retake button resets everything and shuffles questions and answers again.</li>\n</ul>\n"};

y mappings","keywords":["NIST CSF PR.PT-4","NIST CSF PR.AC-5","CIS Control 9 (ports, protocols, services)","CIS v8 4.4 / 4.5 (firewalls on servers / devices)","CIS v8 13.4 (application layer filtering)","ISO 27001 A.8.20-A.8.22","egress filtering policy","exception register"]},{"icon":"\ud83d\udce1","name":"Detection support & telemetry","keywords":["firewall DENY logs","proxy logs","NetFlow","blocked-flow analysis","Network Traffic Flow data source","alerting on denied spikes","tuning with asset data"]}];
window.EXERCISES = [{"id":"X01","type":"tree","title":"The CISO needs a decision in ten minutes","summary":"Payment-provider beacon case \u2014 4 steps with conflicting signals","scenario":[{"label":"ARTEFACT 1 \u2014 Firewall DENY/ALLOW sample (PAYPROC segment)","kind":"log","filter":true,"body":"09:11:03 DENY  TCP 10[.]50[.]2[.]10:51022 -> 151[.]101[.]65[.]140:443  rule EG-NEW (new deny list hit)\n09:12:04 DENY  TCP 10[.]50[.]2[.]10:51037 -> 151[.]101[.]65[.]140:443  rule EG-NEW\n09:11:03 ALLOW TCP 10[.]50[.]2[.]10:51023 -> 151[.]101[.]1[.]140:443   rule EG-BASE (proxy path)\n09:12:03 ALLOW TCP 10[.]50[.]2[.]10:51038 -> 151[.]101[.]1[.]140:443   rule EG-BASE"},{"label":"ARTEFACT 2 \u2014 Proxy log, same window","kind":"log","filter":true,"body":"09:11:03 CONNECT 10[.]50[.]2[.]10 -> cdn[.]fastly-edge[.]net:443  category: CDN  SNI=cdn[.]fastly-edge[.]net\n09:12:03 CONNECT 10[.]50[.]2[.]10 -> cdn[.]fastly-edge[.]net:443  category: CDN  SNI=cdn[.]fastly-edge[.]net"},{"label":"ARTEFACT 3 \u2014 Threat intel note (uncorroborated)","kind":"prose","body":"<p>Feed X labels 151[.]101[.]65[.]140 as 'C2 \u2014 Zloader campaign'. Feed Y lists the /24 as a major CDN edge. No other vendor corroborates the C2 label. The IP space is shared infrastructure: thousands of benign sites ride it.</p>"},{"label":"ARTEFACT 4 \u2014 EDR triage note, PAYPROC-01 (10[.]50[.]2[.]10)","kind":"prose","body":"<p>Payment reconciliation service (business critical, PCI scope) runs here. No EDR agent on this box (legacy, vendor-certified build). Process-level visibility: none. Host owner confirms the service contacts 'a vendor status page' periodically. Vendor refuses to document the exact endpoint.</p>"},{"label":"ARTEFACT 5 \u2014 Helpdesk ticket (noise)","kind":"prose","body":"<p>HD-9931: 'VPN slow since this morning, please help' \u2014 three upvotes, unrelated segment (guest Wi-Fi). Raised 09:40 by an intern who saw the firewall dashboard flashing.</p>"}],"question":"Work the four steps in order; your step-1 interpretation is the branch point for everything after it.","data":{"steps":[{"q":"Step 1 \u2014 Two signals conflict: a deny-list hit against a shared CDN edge. Which interpretation wins, on the evidence?","options":[{"id":"c1","t":"Treat as suspicious-but-unresolved: periodicity + undocumented vendor endpoint outweigh the uncorroborated C2 label"},{"id":"c2","t":"Declare true positive: one feed says C2, so the host is compromised"},{"id":"c3","t":"Declare false positive: the IP belongs to a major CDN, case closed"},{"id":"c4","t":"Declare false positive: PCI systems cannot be involved in anything bad"}],"correct":"c1","artefactLabel":"ARTEFACT 3 \u2014 Threat intel note"},{"q":"Step 2 \u2014 The CISO says 'no payment outage, ten minutes'. What do you execute now?","options":[{"id":"c5","t":"Keep the targeted EG-NEW deny on the flagged IP; request the SNI/hostname pair from the vendor; no broader cut"},{"id":"c6","t":"Block the whole CDN /24 to be certain \u2014 business apps on that CDN can go through break-glass"},{"id":"c7","t":"Remove EG-NEW so the periodic connections complete; watch quietly for a week"},{"id":"c8","t":"Isolate PAYPROC-01 from the network immediately; payment batch can wait"}],"correct":"c5","artefactLabel":"ARTEFACT 1 \u2014 Firewall sample"},{"q":"Step 3 \u2014 At +2 hours: denies continue at the same cadence, nothing else anomalous. CISO asks: can we declare containment complete?","options":[{"id":"c9","t":"Not yet: confirm no alternate channels (proxy/DNS paths), keep the deny watch 24\u201348h, then decide"},{"id":"c10","t":"Yes: the block is in place, close the incident"},{"id":"c11","t":"Yes, provided nobody on the team saw any EDR alert"},{"id":"c12","t":"No: we must first wipe and rebuild the host, whatever it costs"}],"correct":"c9","artefactLabel":"ARTEFACT 4 \u2014 EDR triage note"},{"q":"Step 4 \u2014 Which durable control change does this case argue for?","options":[{"id":"c13","t":"Vendor-endpoint allowlisting: named FQDN+IP pairs on the proxy for the payment service, denies logged"},{"id":"c14","t":"Trust CDNs: remove CDN categories from the deny list entirely"},{"id":"c15","t":"Disable all filtering on PCI segments; segmentation paperwork is enough"},{"id":"c16","t":"Buy more threat feeds so single-source labels disappear"}],"correct":"c13","artefactLabel":"ARTEFACT 2 \u2014 Proxy log"}]},"hint":"Step 1: weigh uncorroborated single-feed intel against measured periodicity and an undocumented endpoint. Step 2: one option accepts real business cost you were told to avoid; another removes your only control. Step 3: containment is a validated state, not a feeling. Step 4: the case revealed exactly what was missing.","explain":"<p><b>Step 1:</b> single-feed, uncorroborated C2 labels on shared CDN space are weak evidence; measured ~60s periodicity plus an undocumented 'status page' endpoint is observable behaviour. Senior call: suspicious-but-unresolved, act on the behaviour, not the label. <b>Step 2:</b> the targeted EG-NEW deny is already effective against the flagged flow \u2014 keep it, squeeze the vendor for the endpoint, and refuse the two costly extremes (a /24 CDN block breaks every app riding that CDN; removing the rule reopens the only channel; isolating PCI payment infrastructure is an outage you were told to avoid). <b>Step 3:</b> containment is proven, not assumed \u2014 confirm no alternates (proxy path in ARTEFACT 2 still allowed flows!), watch 24\u201348h, then declare. 'Close it because the block exists' is the classic premature declaration. <b>Step 4:</b> the real gap was an undocumented vendor endpoint on shared infra; the durable M1037 fix is vendor-endpoint allowlisting (named FQDN+IP, denies logged) \u2014 not blanket CDN trust, not removing controls, and more feeds do not fix shared-IP ambiguity.</p>","study":"resolving conflicting intel on shared infrastructure; containment as a validated state; vendor-endpoint allowlisting.","concepts":["M1037","T1071.001","T1090","threat intel","containment","allowlisting"]},{"id":"X02","type":"qcm","title":"The benchmark says block ICMP","summary":"Best-practice-wrong-here: OT monitoring depends on ICMP","scenario":[{"label":"ARTEFACT 1 \u2014 Context pack","kind":"prose","body":"<p>A hardening benchmark applied verbatim last quarter blocked all ICMP at every boundary. Since then, the plant team reports 'monitoring blind spots': path health checks between the OT DMZ and the plant floor use ping, and the vendor's appliance watchdog expects it. Separately, IR has one confirmed case of ICMP-flood DoS from the internet and one suspicion of ICMP-tunnelled C2 <i>from inside</i> to an external host.</p>"},{"label":"ARTEFACT 2 \u2014 Current rule state","kind":"code","body":"! perimeter (internet-facing)\ndeny icmp any any        ! blanket, from benchmark\n! OT DMZ <-> plant floor\ndeny icmp 10[.]60[.]0[.]0/16 10[.]60[.]8[.]0/21   ! same blanket, same quarter"},{"label":"ARTEFACT 3 \u2014 ATT&CK note","kind":"prose","body":"<p>M1037's use for T1095 (Non-Application Layer Protocol) says to filter protocols that need not cross the network boundary \u2014 protocols like ICMP.</p>"}],"question":"Which redesign satisfies both the monitoring requirement and the M1037 filtering intent?","data":{"options":[{"id":"d1","t":"Perimeter: keep ICMP deny to the internet; OT DMZ-plant: scoped ICMP allow for the monitoring path, logged"},{"id":"d2","t":"Keep the blanket deny everywhere \u2014 the benchmark is the benchmark"},{"id":"d3","t":"Allow ICMP everywhere again; the benchmark was wrong about everything"},{"id":"d4","t":"Replace ping monitoring with full SNMP polls of every device this month"}],"correct":["d1"]},"hint":"Two different boundaries are in play, and the technique use says filter protocols that need not cross a given boundary \u2014 not that they must never exist anywhere.","explain":"<p>The benchmark application conflated two boundaries. At the <b>internet perimeter</b>, ICMP to the internet has no business need and covers both observed risks (flood from outside, tunnel from inside) \u2014 keep it denied. Between <b>OT DMZ and plant floor</b>, ICMP <i>is</i> the documented monitoring path: a scoped, logged allowlist for the monitoring systems is the correct M1037 design \u2014 'filter what need not cross' means the deny applies where no need exists. Reallowing everywhere (d3) removes the control at the boundary that matters; keeping the blind spots (d2) protects the benchmark, not the plant; the SNMP migration (d4) is a quarter-long project presented as if it were this month's fix. Widely quoted best practices are designs for a context \u2014 this is that lesson.</p>","study":"scoping protocol filtering per boundary; when 'block everything' best practices are wrong.","concepts":["M1037","T1095","OT","protocol-based filtering"]},{"id":"X03","type":"match","title":"Tag the infrastructure case","summary":"Six artefacts to six techniques \u2014 one is a trap","scenario":[{"label":"ARTEFACT 1 \u2014 Case INFRA-77 evidence board","kind":"prose","body":"<p>Six evidence cards wait for ATT&amp;CK tagging. All six techniques are on the M1037 page. Two cards describe traffic events, four describe infrastructure behaviour.</p>"},{"label":"ARTEFACT 2 \u2014 The evidence cards","kind":"prose","body":"<ul><li><b>C1:</b> a rented VPS forwards victim traffic to a second hop, which forwards again through a residential-botnet exit.</li><li><b>C2:</b> a sequence of probes to closed ports 7010, 7011, 7012 is followed by a service appearing on 7013.</li><li><b>C3:</b> bulk data lands in an attacker-controlled VPC through the cloud provider's API, using stolen long-lived keys.</li><li><b>C4:</b> a rogue device answers DHCP faster than the real server; several hosts get a new gateway.</li><li><b>C5:</b> a compromised branch router is used to bridge two routed boundaries; the clean firewall upstream still drops the bridged packets.</li><li><b>C6 (trap):</b> attacker boots their own laptop in a meeting room and plugs into the wall port.</li></ul>"}],"question":"Match each card to the technique it evidences \u2014 and give C6 its honest tag.","data":{"pairs":[{"left":"C1 \u2014 chained hops ending in a residential exit","right":"T1090.003 \u2014 Multi-hop Proxy"},{"left":"C2 \u2014 knock sequence, then hidden service","right":"T1205.001 \u2014 Port Knocking"},{"left":"C3 \u2014 bulk transfer to attacker VPC via API","right":"T1537 \u2014 Transfer Data to Cloud Account"},{"left":"C4 \u2014 rogue DHCP answers on the segment","right":"T1557.003 \u2014 DHCP Spoofing"},{"left":"C5 \u2014 compromised router bridges the boundary","right":"T1599 \u2014 Network Boundary Bridging"},{"left":"C6 \u2014 attacker's laptop on the wall port","right":"Not M1037: physical access, not traffic filtering"}]},"hint":"Five cards are traffic-layer behaviours M1037 addresses. One card is someone walking in a door \u2014 ask which control class that needs.","explain":"<p><b>C1</b> is the multi-hop pattern (T1090.003 \u2014 allow/block lists against anonymity networks per M1037). <b>C2</b> is port knocking (T1205.001 \u2014 stateful firewalls mitigate some variants, per the page). <b>C3</b> is cloud-account transfer (T1537 \u2014 network-based restrictions to untrusted VPCs). <b>C4</b> is DHCP spoofing (T1557.003 \u2014 filter DHCP 67/68 to untrusted servers, DHCP snooping). <b>C5</b> is boundary bridging (T1599 \u2014 block the packets with an unaffected device in path). <b>C6</b> needs physical security and port security \u2014 plugging in a laptop is not a network-traffic technique, so it gets no ATT&amp;CK M1037 tag. Honest tagging of the trap keeps the coverage metrics real.</p>","study":"M1037's coverage of T1090.003, T1205.001, T1537, T1557.003, T1599 \u2014 and what it does not cover.","concepts":["M1037","T1090.003","T1205.001","T1537","T1557.003","T1599"]},{"id":"X04","type":"multi","title":"Where is the programme still exposed?","summary":"Coverage-gap audit \u2014 two residual gaps","scenario":[{"label":"ARTEFACT 1 \u2014 Control inventory (as deployed)","kind":"code","body":"PERIMETER:  default-deny ingress; SSH/RDP scoped to office ranges\nEGRESS:     default-deny; 80/443 only via authenticated proxy; DNS to internal resolvers only\nSEGMENTS:   inter-VLAN firewalls; server VLANs -> user VLANs denied by default\nHOSTS:      host firewalls on servers; endpoints agent-managed\nNOT DEPLOYED: NDR sensor, DNS-layer filtering, proxy TLS decryption"},{"label":"ARTEFACT 2 \u2014 Red-team debrief, one paragraph","kind":"prose","body":"<p>The red team reports: 'We never touched the perimeter. We moved laterally between two server VLANs over a legacy replication protocol, and we beaconed from a server through the allowed proxy path, inside TLS. Both worked all week.'</p>"}],"question":"Select the two residual gaps the red-team paragraph actually demonstrates.","data":{"options":[{"id":"f1","t":"Lateral traffic between server VLANs is not fully filtered (legacy replication protocol path)"},{"id":"f2","t":"Encrypted C2 riding the authenticated proxy path is invisible without TLS inspection"},{"id":"f3","t":"Ingress SSH from the internet is uncontrolled"},{"id":"f4","t":"Outbound DNS to public resolvers is uncontrolled"}],"correct":["f1","f2"]},"hint":"Match each red-team claim against the inventory line that should have stopped it. Two claims were never covered by a deployed line.","explain":"<p>The debrief names two successful behaviours. <b>Lateral movement</b> over a legacy replication protocol between server VLANs: M1037 covers lateral traffic, but the inventory shows inter-VLAN rules only deny server-to-user by default \u2014 the server-to-server path with the legacy protocol stayed open (gap: protocol allowlisting between server VLANs). <b>Beaconing through the proxy inside TLS</b>: the proxy is authenticated but does not decrypt, so C2 rides the one allowed path (gap: TLS inspection or SNI/category controls \u2014 accepting this residual risk is also a legitimate decision, if documented). f3 and f4 are controlled by deployed lines (scoped SSH ingress, resolvers-only DNS) \u2014 the red team explicitly said they never touched the perimeter.</p>","study":"coverage-gap reasoning against a deployed control inventory.","concepts":["M1037","lateral filtering","TLS inspection","coverage gap"]},{"id":"X05","type":"terminal","title":"Emergency cut, surgical scope","summary":"iptables insert under pressure \u2014 safe vs destructive","perExerciseTimer":90,"scenario":[{"label":"ARTEFACT 1 \u2014 Situation (09:41, you hold root on the perimeter Linux firewall)","kind":"prose","body":"<p>Beacons from internal host 10[.]20[.]5[.]30 to 198[.]51[.]100[.]23 on TCP 8443 repeat every ~45 seconds. Existing FORWARD chain: business traffic accepted earlier in the chain. <b>Business goal from the CISO:</b> cut exactly that source-destination-port flow, now, without touching any other traffic and without altering the rest of the ruleset. <b>Sub-task timer: 90 seconds</b> \u2014 the budgeted outage window.</p>"},{"label":"ARTEFACT 2 \u2014 Current FORWARD chain (excerpt)","kind":"code","body":"Chain FORWARD (policy ACCEPT)\n 1  ACCEPT  all  --  10[.]20[.]0[.]0/16  *  state ESTABLISHED,RELATED\n 2  ACCEPT  tcp --  10[.]20[.]0[.]0/16  *  multiport dports 80,443\n ... (business accepts) ...\n47  LOG     all  --  *  *  LOG 'FWD-DROP '\n48  DROP    all  --  *  *"},{"label":"ARTEFACT 3 \u2014 Hint card (removed at this tier)","kind":"prose","body":"<p>You get no syntax card. You know iptables-legacy is the live filter on this box.</p>"}],"question":"Type the one command that inserts the surgical block so it takes effect immediately, then Check.","data":{"prompt":"perimeter-fw:~#","banner":"root@perimeter-fw \u2014 iptables-legacy, IPv4 \u2014 LIVE FILTER, 1,200 concurrent sessions","simTool":"iptables","simOut":["(chain FORWARD updated \u2014 1 rule inserted)"],"canonical":"iptables -I FORWARD 1 -s 10[.]20[.]5[.]30 -d 198[.]51[.]100[.]23 -p tcp --dport 8443 -j DROP","elements":[{"name":"tool: iptables","re":"\\biptables\\b","why":"the live filter on this box is iptables-legacy"},{"name":"insert mode: -I (top of FORWARD, takes effect despite earlier ACCEPTs)","re":"-\\s*I\\s+FORWARD","why":"appending with -A would land after rule 2's ACCEPT and never match"},{"name":"source: 10[.]20[.]5[.]30","re":"-\\s*s\\s+10\\[?\\.\\]?20\\[?\\.\\]?5\\[?\\.\\]?30","why":"scope the cut to the beaconing host only"},{"name":"destination: 198[.]51[.]100[.]23","re":"-\\s*d\\s+198\\[?\\.\\]?51\\[?\\.\\]?100\\[?\\.\\]?23","why":"scope to the C2 endpoint only"},{"name":"protocol+port: -p tcp --dport 8443","re":"-\\s*p\\s+tcp\\b.*--\\s*dport\\s+8443","why":"pin the exact channel"},{"name":"target: -j DROP","re":"-\\s*j\\s+DROP\\b","why":"silent drop; REJECT would tip off the operator"},{"name":"scope: nothing else touched (no flush, no policy change)","re":"^(?!.*(\\s-F\\s|\\s-X\\s|--flush|-P\\s+FORWARD\\s+DROP)).*$","why":"the CISO's constraint: no other traffic, no ruleset changes"}],"wrong":[{"name":"-F / --flush (erases the entire live ruleset \u2014 protections and evidence gone)","re":"(\\s-F\\s|\\s-F$|--flush)","danger":true},{"name":"-X (deletes user-defined chains)","re":"\\s-X\\s","danger":true},{"name":"-P FORWARD DROP (blackholes everything not explicitly accepted \u2014 outage)","re":"-\\s*P\\s+FORWARD\\s+DROP","danger":true},{"name":"-j ACCEPT (legalises the beacon instead)","re":"-\\s*j\\s+ACCEPT","danger":true}],"dangerWarn":"That command would have flushed or re-policied the live ruleset \u2014 cutting every protected flow at once and destroying the configuration state IR needs. The surgical insert was the safe move."},"hint":"Insertion position is the whole exercise: the block must sit above the broad ACCEPTs, scoped to exactly one host, one destination, one port.","explain":"<p>Canonical command:</p><pre class='code'>iptables -I FORWARD 1 -s 10[.]20[.]5[.]30 -d 198[.]51[.]100[.]23 -p tcp --dport 8443 -j DROP</pre><p><b>-I FORWARD 1</b> inserts at the top \u2014 mandatory here, because rule 2's broad ACCEPT would swallow an appended (-A) rule. <b>-s / -d / -p tcp --dport 8443</b> scope the cut to exactly the beaconing 5-tuple, honouring the CISO's 'nothing else touched'. <b>-j DROP</b> is silent (REJECT tells the operator the channel is dead). The tempting <span style='font-family:monospace'>iptables -F</span> 'solution' is the catastrophe option: it flushes every protection on a live 1,200-session box and destroys the configuration state. This is M1037 as emergency containment \u2014 a scoped, insertable, reversible deny, documented in the incident log afterwards. Note on notation: this file writes IP dots as <b>[.]</b> (defanged, a professional habit so indicators cannot be clicked by mistake). Type the address either with normal dots or with [.] \u2014 the grader accepts both.</p>","study":"surgical iptables containment: insert position, 5-tuple scoping, DROP vs REJECT, never flushing under pressure.","concepts":["M1037","T1071","iptables","containment"]},{"id":"X06","type":"blank","title":"Write the exception clause that survives audit","summary":"Policy drafting \u2014 four keywords, senior level","scenario":[{"label":"ARTEFACT 1 \u2014 Egress standard v2, exception section, words missing","kind":"prose","body":"<p>After the X01 case, the CISO demands an exception section 'that a regulator can read without raising an eyebrow'. Four keywords dropped out of the clause.</p>"},{"label":"ARTEFACT 2 \u2014 The clause, gaps marked (1)\u2013(4)","kind":"prose","body":"<p style='font-size:15.5px;line-height:2.1'>Every exception to egress filtering must be scoped to named <b>gap (1)</b> and <b>gap (2)</b>, must be <b>gap (3)</b> (never permanent), and must carry a named <b>gap (4)</b> with logging enabled for the full lifetime of the exception.</p>"}],"question":"Place the four missing words into the exception clause.","data":{"text":"Every exception to egress filtering must be scoped to named {{1}} and {{2}}, must be {{3}} (never permanent), and must carry a named {{4}} with logging for the full lifetime of the exception.","bank":[{"id":"e1","t":"hosts"},{"id":"e2","t":"destinations"},{"id":"e3","t":"time-boxed"},{"id":"e4","t":"owner"}],"answers":{"1":"e1","2":"e2","3":"e3","4":"e4"}},"hint":"Scope has two coordinates (what leaves, where to), lifespan has one word, accountability has one word.","explain":"<p>The clause encodes the four properties regulators look for: scope by named <b>hosts</b> (source) and named <b>destinations</b> (target \u2014 the X01 vendor-endpoint lesson), a <b>time-boxed</b> lifetime so exceptions cannot fossilise into the 'legacy any-any rules' of the MEDIUM tier, and a named <b>owner</b> with logging, so every exception has a face and a trail. Exceptions are where M1037 programmes decay; this clause is the standard countermeasure, and the exception register it feeds is a primary audit artefact.</p>","study":"exception governance: scope, time-box, owner, logging.","concepts":["M1037","exceptions","GRC","policy"]},{"id":"X07","type":"order","title":"Rank the roadmap by risk reduction per effort","summary":"Five initiatives \u2014 senior prioritisation","scenario":[{"label":"ARTEFACT 1 \u2014 Steering-committee pre-read","kind":"prose","body":"<p>Five filtering initiatives compete for one quarter of budget. Rank them by risk reduction per unit of effort, given what this week's cases showed (legacy any-any in server space, undocumented vendor endpoint, unfiltered lateral legacy protocol, unauthenticated proxy, unreviewed ruleset).</p>"},{"label":"ARTEFACT 2 \u2014 The initiatives","kind":"prose","body":"<ol><li>Quarterly rulebase recertification programme</li><li>Remove the legacy any-any rule after shipping its replacement allowlist</li><li>Role-based egress allowlists for server segments</li><li>Authenticated (identity-aware) proxy for user VLANs</li><li>DNS-layer filtering for known-bad domains</li></ol>"}],"question":"Rank the five initiatives from highest to lowest risk-reduction-per-effort.","data":{"items":[{"id":"g1","t":"Quarterly rulebase recertification programme"},{"id":"g2","t":"Remove the legacy any-any rule after shipping its replacement allowlist"},{"id":"g3","t":"Role-based egress allowlists for server segments"},{"id":"g4","t":"Authenticated (identity-aware) proxy for user VLANs"},{"id":"g5","t":"DNS-layer filtering for known-bad domains"}],"correctOrder":["g2","g3","g4","g5","g1"]},"hint":"One initiative closes a hole that is open right now; one is a rhythm, not a fix. Effort counts too \u2014 the biggest programme is not automatically first.","explain":"<p><b>1 \u2014 remove the any-any rule</b>: the hole is open today, replacement allowlist is scoped, highest immediate risk-per-effort. <b>2 \u2014 role-based server allowlists</b>: kills the whole class of lateral/egress surprises (legacy protocol case) at moderate effort. <b>3 \u2014 authenticated proxy</b>: ties egress to identity, enables per-user policy; heavier lift, big payoff. <b>4 \u2014 DNS-layer filtering</b>: broad coverage for the T1071.004 case but partial (encrypted resolvers, DoH) and additive to the proxy. <b>5 \u2014 recertification programme</b>: essential hygiene rhythm rather than a risk fix, and the most expensive per unit of immediate risk \u2014 schedule it, but it does not lead the quarter. Senior prioritisation weighs open-now exposure against programme cost; 'most comprehensive' is rarely 'do first'.</p>","study":"prioritising filtering initiatives by risk reduction per effort.","concepts":["M1037","prioritisation","roadmap"]},{"id":"X08","type":"qcm","title":"Shared IP, conflicting verdicts","summary":"Which signal wins \u2014 and what action fits","scenario":[{"label":"ARTEFACT 1 \u2014 The conflict, stated cleanly","kind":"prose","body":"<p>Proxy log: TLS session to <span style='font-family:monospace'>assets[.]global-cdn[.]net</span> \u2014 a domain 400 internal users visit daily \u2014 resolving to 185[.]199[.]108[.]153. NetFlow: the same destination IP receives, from WS-ACCT-03 only, a strict 60-second TCP 443 cadence at 03:00\u201305:00, nights, ~4 KB up per beat. Threat intel: '185[.]199[.]108[.]0/24 = CDN (benign)' and 'same IP seen in campaign X (single source, 6 months old)'. WS-ACCT-03 is in the finance VLAN; the accountant confirms she is asleep at 03:00.</p>"}],"question":"Which call do you make, and which action follows it?","data":{"options":[{"id":"x1","t":"Behaviour wins over reputation: block the exact FQDN+IP pair for that host, investigate WS-ACCT-03"},{"id":"x2","t":"Reputation wins: the IP is a CDN, mark the alert as false positive and move on"},{"id":"x3","t":"Reputation wins with a twist: block the entire CDN /24 to be thorough"},{"id":"x4","t":"Behaviour wins big: force-decrypt all TLS for all 400 users starting tonight"}],"correct":["x1"]},"hint":"A shared IP cannot be good or bad \u2014 behaviour tied to one host can. Two options accept large collateral cost for little certainty.","explain":"<p>On shared CDN infrastructure, IP reputation carries almost no signal in either direction \u2014 which is why 'it is a CDN, ignore it' (x2) and 'it is C2, panic' are both lazy. The discriminating evidence is behavioural and host-specific: a strict 60-second nocturnal cadence from <i>one</i> finance workstation that nobody expects to work nights. So the signal that wins is the cadence, and the proportionate M1037 action is the surgical one \u2014 deny the <b>exact FQDN+IP pair for that host</b> (or SNI-based block at the proxy), keep 400 users' CDN traffic untouched, and investigate WS-ACCT-03. x3 breaks the CDN for the whole company; x4 is a programme-level decision disguised as a 3 a.m. emergency and burns privacy and budget for one host.</p>","study":"resolving reputation-vs-behaviour conflicts on shared infrastructure; SNI/scoped blocking.","concepts":["M1037","T1071.001","T1090","threat intel","SNI"]},{"id":"X09","type":"categorize","title":"Sort the action list under pressure","summary":"Eight proposed actions \u2014 contain, harden, or refuse","scenario":[{"label":"ARTEFACT 1 \u2014 Incident bridge, minute 14","kind":"prose","body":"<p>Case: beacons from two hosts (10[.]20[.]5[.]30, 10[.]20[.]7[.]44) to 198[.]51[.]100[.]23:8443; legacy any-any egress rule exists; proxy is unauthenticated; a scoped insert is already in place for one host. Eight proposals are on the bridge chat. The incident commander asks you to sort them before anyone types anything into production.</p>"},{"label":"ARTEFACT 2 \u2014 The eight proposals","kind":"prose","body":"<ol><li>Insert the second targeted deny for the other beaconing host</li><li>Isolate the two affected hosts at the access switch</li><li>Remove the legacy any-any rule via emergency change, with replacement allowlist</li><li>Ship role-based allowlists for the affected segments</li><li>Turn on proxy authentication (identity-aware egress)</li><li>Flush the FORWARD chain to 'clear any attacker additions'</li><li>Block the whole /24 range around the destination</li><li>Wipe and restore the firewall's config store from backup 'to be safe'</li></ol>"}],"question":"Drag each proposal to its honest bucket: do now (contain), do next (harden), or do not do.","data":{"buckets":[{"id":"n1","name":"DO NOW \u2014 contain"},{"id":"n2","name":"DO NEXT \u2014 harden (post-containment)"},{"id":"n3","name":"DO NOT DO \u2014 destructive or over-broad"}],"items":[{"id":"m1","t":"Insert the second targeted deny for the other beaconing host","bucket":"n1"},{"id":"m2","t":"Isolate the two affected hosts at the access switch","bucket":"n1"},{"id":"m3","t":"Remove the legacy any-any rule via emergency change with replacement","bucket":"n2"},{"id":"m4","t":"Ship role-based allowlists for the affected segments","bucket":"n2"},{"id":"m5","t":"Turn on proxy authentication (identity-aware egress)","bucket":"n2"},{"id":"m6","t":"Flush the FORWARD chain to clear 'attacker additions'","bucket":"n3"},{"id":"m7","t":"Block the whole /24 range around the destination","bucket":"n3"},{"id":"m8","t":"Wipe and restore the firewall config store 'to be safe'","bucket":"n3"}]},"hint":"Containment is host-scoped and reversible. Hardening is planned and change-managed. 'Do not do' destroys state or accepts collateral you cannot afford.","explain":"<p><b>Do now:</b> surgical inserts and host isolation are scoped, reversible containment; they cut the attacker's channel without touching business flows or evidence. <b>Do next:</b> removing the any-any rule (with its replacement), role-based allowlists and proxy authentication are the durable M1037 hardening \u2014 but they need change control and testing, not a live bridge. <b>Do not do:</b> flushing FORWARD erases every protection and the config state IR needs; wiping the config store destroys evidence of whether the firewall itself was tampered with; the /24 range block accepts company-wide collateral for one host's channel. The bucket you refuse is the one that feels most decisive \u2014 that is the senior lesson.</p>","study":"sorting incident actions: contain (scoped, reversible), harden (change-managed), refuse (destructive/over-broad).","concepts":["M1037","containment","prioritisation"]},{"id":"X10","type":"match","title":"Tag the quiet findings","summary":"Subtle telemetry to techniques \u2014 five matches","scenario":[{"label":"ARTEFACT 1 \u2014 Post-incident sweep, five findings","kind":"log","filter":true,"body":"Q1: guest VLAN: rogue device answering DHCP on 67 faster than the real server (hosts received new gateway)\nQ2: egress: TCP 1883 to unknown broker 141[.]98[.]7[.]3, every 300s, small payloads\nQ3: netmgmt: SNMP walk of router config tables from an unexpected internal host, 03:40\nQ4: proxy: HTTPS POST to /api/v2/status, same path, same byte size, every 60s, to a documented vendor FQDN\nQ5: cloud segment: workload VM repeatedly requests the link-local metadata API 169[.]254[.]169[.]254 via a forged web endpoint (SSRF pattern)"},{"label":"ARTEFACT 2 \u2014 ATT&CK shortlist (all on M1037's page)","kind":"prose","body":"<p>T1557.003 DHCP Spoofing \u00b7 T1071.005 Publish/Subscribe Protocols \u00b7 T1602 Data from Configuration Repository \u00b7 T1071.001 Web Protocols \u00b7 T1197 BITS Jobs \u00b7 T1552.005 Cloud Instance Metadata API</p>"}],"question":"Match each finding (Q1\u2013Q5) to the technique it evidences.","data":{"pairs":[{"left":"Q1 \u2014 rogue DHCP answers with a new gateway","right":"T1557.003 \u2014 DHCP Spoofing"},{"left":"Q2 \u2014 periodic TCP 1883 to an unknown broker","right":"T1071.005 \u2014 Publish/Subscribe Protocols"},{"left":"Q3 \u2014 SNMP walk of router config tables","right":"T1602 \u2014 Data from Configuration Repository"},{"left":"Q4 \u2014 metronomic POSTs to one path","right":"T1071.001 \u2014 Web Protocols (beaconing)"},{"left":"Q5 \u2014 workload VM hits the link-local metadata API","right":"T1552.005 \u2014 Cloud Instance Metadata API"}]},"hint":"Q1 is a poisoned address-assignment service, Q2 is a message-broker port, Q3 is device configuration leaving over SNMP, Q4 is web beaconing \u2014 even to a 'documented' name, Q5 is the cloud credentials endpoint.","explain":"<p><b>Q1</b>: answering DHCP faster than the server and handing out a new gateway is DHCP spoofing (T1557.003; M1037's use says filter DHCP 67/68 to untrusted servers and enable snooping). <b>Q2</b>: TCP 1883 is MQTT's standard port \u2014 publish/subscribe abuse (T1071.005; the page says filter pub/sub on irregular ports and to untrusted brokers). <b>Q3</b>: an SNMP walk of config tables is configuration repository access (T1602; extended ACLs block unauthorised SNMP outside trusted nets). <b>Q4</b> is the quiet one: perfectly formed web beaconing to a <i>documented</i> vendor FQDN \u2014 protocol matches, but the metronomic cadence and identical byte size make it T1071.001 web C2 riding an allowed path (compare X01: an undocumented endpoint is exactly why vendor allowlists must pin FQDN+IP). <b>Q5</b>: a workload VM asking the link-local metadata API through a forged endpoint is SSRF-driven credential theft (T1552.005; the page's use: limit access to the Instance Metadata API, and a properly configured WAF helps block the SSRF that enables it). T1197 (BITS Jobs) is the remaining shortlist entry and the honest decoy here \u2014 no finding evidences it (it is covered properly in the HARD tier).</p>","study":"subtle telemetry signatures: rogue DHCP, MQTT brokers, SNMP walks, metronomic web POSTs, cloud metadata API hits.","concepts":["M1037","T1557.003","T1071.005","T1602","T1071.001","T1552.005"]},{"id":"X11","type":"match","title":"Answer the CISO's three certainties","summary":"Claims vs honest rebuttals \u2014 three matches","scenario":[{"label":"ARTEFACT 1 \u2014 CISO's notes after reading a vendor whitepaper","kind":"prose","body":"<p>'Three certainties from the whitepaper. Fact-check them for the board.' The rebuttals are on cards, jumbled.</p>"},{"label":"ARTEFACT 2 \u2014 The three claims","kind":"prose","body":"<ol><li>'M1037 stops domain fronting \u2014 the vendor blocks CDN domains.'</li><li>'M1037 will identify the operator behind the beacons for legal.'</li><li>'With M1037 deployed we no longer need the NDR sensor or any content analysis.'</li></ol>"}],"question":"Match each claim to its honest rebuttal.","data":{"pairs":[{"left":"Claim 1 \u2014 M1037 stops domain fronting","right":"No: the page itself notes this blocking may be circumvented by Domain Fronting"},{"left":"Claim 2 \u2014 M1037 identifies the operator","right":"No: filtering blocks flows; attribution needs intelligence work beyond the control"},{"left":"Claim 3 \u2014 M1037 replaces NDR/content analysis","right":"No: it is complementary \u2014 the filter decides passage, other tools analyse content"}]},"hint":"One claim contradicts a sentence printed on the ATT&CK page. One asks a gate to do a detective's job. One asks a bouncer to write poetry about the guests.","explain":"<p><b>Claim 1</b> is contradicted verbatim by the M1037 page under T1090: 'this kind of blocking may be circumvented by other techniques like Domain Fronting' \u2014 blocking CDN domains entirely would break business traffic instead. <b>Claim 2</b> confuses prevention with attribution: M1037 stops flows and records them; identifying an operator takes CTI work, logs correlation, sometimes legal process. <b>Claim 3</b> overstates the control: a filter makes pass/drop decisions on flow metadata; NDR and proxy analysis inspect content and behaviour. Boards make budget decisions on claims like these \u2014 the honest rebuttals protect the control's real value.</p>","study":"M1037's documented limits: domain fronting, attribution, complementarity with content analysis.","concepts":["M1037","T1090","attribution","limitations"]},{"id":"X12","type":"qcm","title":"Declare containment? Not so fast","summary":"Stakeholder decision \u2014 validate before declaring","scenario":[{"label":"ARTEFACT 1 \u2014 Bridge, minute 82","kind":"prose","body":"<p>State: both hosts isolated, both beacon 5-tuples blocked, deny counts flat for 40 minutes. Open threads: proxy logs not yet re-reviewed for alternate channels; DNS resolver logs untouched; the packet-capture from hour 1 unanalyzed; a third host (10[.]20[.]9[.]71) pinged the same IP once \u2014 unexplained. The CISO, on his third coffee, says: 'Declare containment closed, we look decisive for the board.' Legal adds: 'If we declare and it later proves wrong, that statement exists.'"}],"question":"What do you advise the CISO to do now?","data":{"options":[{"id":"y1","t":"Hold the declaration: close alternate channels, explain the third host, keep the watch window, then decide on evidence"},{"id":"y2","t":"Declare now: flat deny counters prove the attacker is out"},{"id":"y3","t":"Declare now but quietly promise the board it will be revisited if needed"},{"id":"y4","t":"Skip the declaration question and go home; the blocks will hold by themselves"}],"correct":["y1"]},"hint":"Flat counters only prove one channel is dead. Two threads are still open, and one host is unexplained. Legal just told you the cost of being wrong.","explain":"<p>Flat deny counters prove exactly one thing: the blocked 5-tuples are quiet. They say nothing about the <b>proxy path</b> (still allowed, per X01), the <b>DNS channel</b> (unreviewed), the <b>captured traffic</b> (unanalyzed), or the <b>third host</b> that touched the same IP \u2014 the classic alternate-channel gap. The senior advice holds the declaration until alternates are closed, the third host is explained, and a 24\u201348h clean window has elapsed: containment is a validated state, not a press release. Legal's point makes the asymmetry explicit \u2014 a premature declaration is a written liability; 'gathering more evidence' costs hours, a wrong declaration costs the incident response its credibility.</p>","study":"containment as a validated state; alternate channels; declaration discipline.","concepts":["M1037","containment","incident response"]},{"id":"X13","type":"clickline","title":"Which rule did the attacker ride?","summary":"Rulebase forensics \u2014 click the exploited line","scenario":[{"label":"ARTEFACT 1 \u2014 Rulebase excerpt (egress, first match wins), post-incident","kind":"code","body":"1  permit tcp 10[.]20[.]0[.]0/16 any eq 443     ! users -> proxy (proxy PAC pins destinations)\n2  permit tcp 10[.]30[.]0[.]0/16 any eq 443     ! servers segment, added during 'cloud migration'\n3  permit ip 10[.]30[.]4[.]0/24 any             ! 'legacy build pipeline', owner left 2022\n4  permit tcp host 10[.]30[.]1[.]10 host 10[.]30[.]9[.]20 eq 5432\n5  deny tcp any any eq 23 log\n6  deny ip any any log"},{"label":"ARTEFACT 2 \u2014 Session reconstruction","kind":"log","filter":true,"body":"02:14:51 ALLOW TCP 10[.]30[.]4[.]31:49221 -> 198[.]51[.]100[.]23:8443\n02:15:12 ALLOW TCP 10[.]30[.]4[.]31:49222 -> 45[.]60[.]11[.]9:21\n(host 10[.]30[.]4[.]31 = build agent in the legacy pipeline subnet; flows bypassed the proxy entirely)"}],"question":"Click the one rule the attacker rode for both flows.","data":{"lines":["1  permit tcp 10[.]20[.]0[.]0/16 any eq 443     ! users -> proxy (proxy PAC pins destinations)","2  permit tcp 10[.]30[.]0[.]0/16 any eq 443     ! servers segment, added during 'cloud migration'","3  permit ip 10[.]30[.]4[.]0/24 any             ! 'legacy build pipeline', owner left 2022","4  permit tcp host 10[.]30[.]1[.]10 host 10[.]30[.]9[.]20 eq 5432","5  deny tcp any any eq 23 log","6  deny ip any any log"],"correct":[2],"multi":false},"hint":"The flows left on 8443 and 21 \u2014 ports rules 1 and 2 never open \u2014 from subnet 10[.]30[.]4[.]0/24. Which rule admits that subnet without a port condition?","explain":"<p>Rule 3 \u2014 <span style='font-family:monospace'>permit ip 10[.]30[.]4[.]0/24 any</span> \u2014 matches both flows before any deny: protocol <i>ip</i> (any), destination <i>any</i> (any port). The host's 8443 and FTP 21 exits are impossible under rules 1/2 (which pin TCP 443 to defined segments) and rule 4 (one scoped pair), so the reconstruction points at the only port-agnostic permit \u2014 the 2022 'legacy build pipeline' rule whose owner left. This is the same disease as MEDIUM's any-any bridge, but here it is the <i>exploited</i> path: session reconstruction plus rule semantics identify the ridden rule. The fix sequence mirrors the roadmap: emergency removal with replacement allowlist, then the recertification programme that would have flagged an orphaned 2022 rule.</p>","study":"session-to-rule reconstruction; orphaned legacy permits as exploited paths.","concepts":["M1037","rule order","legacy rules","T1048"]},{"id":"X14","type":"blank","title":"Ship the deny-watch query","summary":"Query drafting \u2014 three values, senior level","scenario":[{"label":"ARTEFACT 1 \u2014 Query spec from the detection engineer","kind":"prose","body":"<p>'Post-incident, we keep a deny-watch for 48h. Draft the query to spec \u2014 three values missing. Threshold per the spec, not your gut. The enrichment step and the noise filter matter more than the number.'</p>"},{"label":"ARTEFACT 2 \u2014 The spec","kind":"prose","body":"<p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>index=fw action=denied<br>| stats count by src_ip, dest_ip, dest_port<br>| where count > THRESH within a 10-minute bucket<br>| ENRICH src_ip against the asset list<br>| filter out known SCANNER sources (ticket VM-881) before alerting</p>"}],"question":"Place the three missing values into the query narrative.","data":{"text":"Fire on any source with more than {{1}} denied flows in 10 minutes, then {{2}} the source against the asset list, and drop known {{3}} sources (ticket VM-881) before alerting.","bank":[{"id":"s1","t":"50"},{"id":"s2","t":"enrich"},{"id":"s3","t":"scanner"},{"id":"s4","t":"CEO"},{"id":"s5","t":"encrypt"}],"answers":{"1":"s1","2":"s2","3":"s3"}},"hint":"The spec fixes the threshold; the second value is what you do to an IP to learn what it is; the third is the documented noise source.","explain":"<p><b>50</b> is the spec's threshold (roughly a beacon every 12s for the full window \u2014 tight enough for cadence, loose enough to survive jitter). <b>Enrich</b> is the step that turns an IP into a host, owner and criticality \u2014 without it, every alert is a puzzle. Filtering known <b>scanner</b> sources (ticket VM-881, the MEDIUM-tier false-positive lesson) keeps the watch survivable. 'CEO' and 'encrypt' are noise words \u2014 enrichment by job title or encryption state is not what the asset list provides. This query is M1037's detection support as a real deliverable: the filter's rejects, watched behaviourally, with context and tuning built in.</p>","study":"deny-watch query design: threshold, enrichment, documented-noise filtering.","concepts":["M1037","firewall DENY logs","detection support","tuning"]},{"id":"X15","type":"qcm","title":"Expect the attacker's next move","summary":"Two-step red/blue anticipation after the block","scenario":[{"label":"ARTEFACT 1 \u2014 Bridge, minute 95","kind":"prose","body":"<p>The beacon channel to 198[.]51[.]100[.]23:8443 is dead; both hosts isolated. The IR lead asks the room: 'Their channel is cut. Assume they are still on other hosts. What do they try next, and what should we pre-build?' Notes: proxy is unauthenticated HTTPS to broad categories; DNS goes only to internal resolvers; a deny-watch is live.</p>"}],"question":"Which next move should the blue team anticipate, and which pre-built control answers it?","data":{"options":[{"id":"z1","t":"Hiding C2 inside allowed web/cloud paths (fronting via popular CDN domains) \u2014 answered by identity-aware proxy plus SNI controls"},{"id":"z2","t":"Brute-forcing the VPN gateway from the internet \u2014 answered by perimeter ingress filtering"},{"id":"z3","t":"Scanning the DMZ from the internet \u2014 answered by ingress ACLs"},{"id":"z4","t":"Nothing: the blocked channel means the operator has lost access for good"}],"correct":["z1"]},"hint":"Step 1: the operator still holds other hosts and now knows the egress is watched. Step 2: the remaining permissive path is the one you already allow on purpose.","explain":"<p>Cut operators pivot to the paths you <i>must</i> keep open: HTTPS to broad web categories via the unauthenticated proxy. Domain-fronting through popular CDN domains hides the true destination behind allowed SNI \u2014 the M1037 page's own caveat \u2014 so the pre-built answer is an <b>identity-aware proxy with SNI/category controls</b> (plus the deny-watch watching for new metronomic patterns, as in X10/Q4). The ingress answers (z2, z3) respond to a perimeter threat that is not in play; 'nothing' ignores that the operator adapted once already. Red-team anticipation is how M1037 programmes stay ahead instead of forever reacting.</p>","study":"anticipating channel pivots; identity-aware proxy and SNI controls as the durable answer.","concepts":["M1037","T1090","T1071.001","SNI","identity-aware proxy"]},{"id":"X16","type":"match","title":"Anchor every ask to a framework line","summary":"Stakeholder asks to framework anchors \u2014 four matches","scenario":[{"label":"ARTEFACT 1 \u2014 Board pack, appendix 'Control anchors'","kind":"prose","body":"<p>Four stakeholder asks from the quarter, each needing its framework anchor. Match each ask to the line that anchors it. Two asks come from NIST CSF, one from ISO 27001:2022, one from CIS v7.</p>"},{"label":"ARTEFACT 2 \u2014 The asks","kind":"prose","body":"<ol><li>'Show that communications across the network are protected' (security manager, NIST CSF)</li><li>'Show that the network is integrity-controlled by segmentation decisions' (architect, NIST CSF)</li><li>'Show that traffic between segregated network parts is controlled' (ISMS auditor, ISO 27001:2022)</li><li>'Show that network ports, protocols and services are limited and controlled' (CIS auditor, CIS v7)</li></ol>"}],"question":"Match each ask to its framework anchor.","data":{"pairs":[{"left":"Ask 1 \u2014 communications are protected (NIST CSF)","right":"PR.PT-4"},{"left":"Ask 2 \u2014 network integrity via segmentation (NIST CSF)","right":"PR.AC-5"},{"left":"Ask 3 \u2014 traffic between segments controlled (ISO 27001:2022)","right":"A.8.22 Segregation of networks"},{"left":"Ask 4 \u2014 ports, protocols, services limited (CIS v7)","right":"CIS Control 9"}]},"hint":"Two NIST Protect anchors: one for protecting communications, one for integrity via segmentation. The ISO line literally says segregation. The CIS control literally lists ports, protocols, services.","explain":"<p><b>PR.PT-4</b> ('communications and control networks are protected') anchors the M1037 communications ask; <b>PR.AC-5</b> ('network integrity... through... segregation') anchors the segmentation ask. <b>ISO A.8.22</b> ('segregation of networks' \u2014 information moved only through approved network paths, traffic controlled between them) answers the ISMS auditor; A.8.20 supports it. <b>CIS v7 Control 9</b> ('Limitation and Control of Network Ports, Protocols, and Services') is the literal port/protocol/service ask (in v8 the idea spreads to 4.4/4.5/13.4). This is the board-pack skill: every M1037 practice maps to a named line in whichever framework the audience trusts.</p>","study":"framework anchors for M1037: NIST PR.PT-4/PR.AC-5, ISO A.8.22, CIS v7 Control 9.","concepts":["M1037","NIST CSF","ISO 27001","CIS Controls","GRC"]}];
(function () {
  'use strict';
  var CFG = window.EXAM_CONFIG;
  var EXS = window.EXERCISES;
  var INTRO = window.INTRO_CONTENT;
  var THEMES = window.THEMES;

  /* ---------------- utils ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var r = a.slice(); var i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  /* ---------------- syntax highlighting for logs ---------------- */
  function hlLog(raw) {
    var out = esc(raw);
    out = out.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g, '<span class="tok-ip">$1</span>');
    out = out.replace(/(^\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/gm, '<span class="tok-time">$1</span>');
    out = out.replace(/\b(DENY|REJECT|DROP|BLOCK|DENIED|blocked|flushed)\b/g, '<span class="tok-act a-deny">$1</span>');
    out = out.replace(/\b(ALLOW|PERMIT|ACCEPT|ALLOWED|allowed|established)\b/g, '<span class="tok-act a-allow">$1</span>');
    out = out.replace(/\b(TCP|UDP|ICMP|SMB|SSH|DNS|HTTP|HTTPS|FTP|SMTP|RDP|Telnet|SNMP|LLMNR|NetBIOS|VNC|BITS)\b/g, '<span class="tok-proto">$1</span>');
    out = out.replace(/:(\d{2,5})\b/g, ':<span class="tok-port">$1</span>');
    return out;
  }
  function renderArtefact(a) {
    var wrap = el('div', 'artefact');
    var lab = el('div', 'a-label');
    lab.innerHTML = '<span>' + esc(a.label) + '</span>';
    if (a.filter) {
      var fb = el('span', 'filterbox');
      fb.innerHTML = '<label for="flt_' + fltCount + '" style="font-size:12px">Filter:</label>';
      var inp = document.createElement('input');
      inp.type = 'text'; inp.id = 'flt_' + fltCount; inp.placeholder = 'type to filter lines';
      inp.setAttribute('aria-label', 'Filter log lines');
      fb.appendChild(inp);
      lab.appendChild(fb);
      (function (inputRef) {
        inputRef.addEventListener('input', function () {
          var q = inputRef.value.toLowerCase();
          var lines = wrap.querySelectorAll('pre.log .lline');
          for (var i = 0; i < lines.length; i++) {
            lines[i].style.display = (!q || lines[i].textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
          }
        });
      })(inp);
      fltCount++;
    }
    wrap.appendChild(lab);
    var body = el('div', 'a-body ' + (a.kind === 'log' ? 'logbody' : 'prose'));
    if (a.kind === 'log') {
      var pre = el('pre', 'log');
      var lines = String(a.body).split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        html += '<span class="lline" style="display:block">' + (hlLog(lines[i]) || '&nbsp;') + '</span>';
      }
      pre.innerHTML = html;
      body.appendChild(pre);
    } else if (a.kind === 'code') {
      var pc = el('pre', 'code');
      pc.innerHTML = esc(a.body);
      body.appendChild(pc);
    } else {
      body.innerHTML = '<div>' + a.body + '</div>';
    }
    wrap.appendChild(body);
    return wrap;
  }
  var fltCount = 0;

  /* ---------------- timer state machine ----------------
     States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
     Check      -> PAUSED_AUTO_CHECK (before feedback renders)
     Next       -> RUNNING (or ENDED via Final Submit on last)
     Skip/Hint  -> state unchanged (timer keeps running)
     Pause      -> PAUSED_MANUAL (hides exercise); Resume returns to prior state
  ------------------------------------------------------ */
  var T = { state: 'RUNNING', remaining: CFG.durationSec, accManual: 0, accAuto: 0, last: Date.now(), exDeadline: null };
  function setState(s) { T.state = s; renderHeader(); }
  function tick() {
    var now = Date.now(); var d = (now - T.last) / 1000; T.last = now;
    if (phase === 'intro') { return; } /* the clock only runs once the exam starts */
    if (T.state === 'PAUSED_MANUAL') { T.accManual += d; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { T.accAuto += d; }
    else if (T.state === 'RUNNING') {
      T.remaining -= d;
      if (T.exDeadline !== null) {
        T.exDeadline -= d;
        renderExTimer();
        if (T.exDeadline <= 0) { autoCheckTerminal(); }
      }
      if (T.remaining <= 0) { T.remaining = 0; timerEnded(); }
    }
    renderTimer();
  }
  function renderTimer() {
    var chip = $('timerChip'); if (!chip) return;
    var st, cls;
    if (T.state === 'RUNNING') { st = 'RUNNING'; cls = 'st-running'; }
    else if (T.state === 'PAUSED_MANUAL') { st = 'PAUSED — manual (press Resume)'; cls = 'st-paused-manual'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { st = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'st-paused-auto-check'; }
    else { st = 'ENDED'; cls = 'st-ended'; }
    chip.innerHTML = '<span>' + (T.state === 'PAUSED_MANUAL' || T.state === 'PAUSED_AUTO_CHECK' ? '\u23F8' : '\u23F1') + '</span><span class="tstate ' + cls + '">' + st + '</span><span id="tval">' + fmtTime(T.remaining) + '</span>';
  }
  function renderExTimer() {
    var c = $('exTimerChip'); if (!c) return;
    if (T.exDeadline === null) { c.classList.add('hidden'); return; }
    c.classList.remove('hidden');
    c.innerHTML = '\u23F1 sub-task time left: <b>' + Math.max(0, Math.ceil(T.exDeadline)) + 's</b>';
  }

  /* ---------------- attempt state ---------------- */
  var attempt = 0;
  var order = [];            /* exercise copies in attempt order */
  var idx = 0;
  var credits = {};          /* exId -> credit */
  var skipped = {};          /* exId -> true (skipped, unanswered) */
  var hintUsed = {};
  var current = null;
  var phase = 'intro';
  var fromReview = false;
  var reportedForAttempt = -1;
  var answerWidgets = {};    /* per-type live answer data */

  function makeAttemptCopies() {
    order = EXS.map(function (e) { return JSON.parse(JSON.stringify(e)); });
    for (var i = 0; i < order.length; i++) { preShuffle(order[i]); }
    order = shuffle(order);
  }
  function preShuffle(e) {
    var d = e.data;
    if (d.options) d.options = shuffle(d.options);
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.items && d.correctOrder) d.display = shuffle(d.items);
    if (d.pairs) d.rightOpts = shuffle(d.pairs.map(function (p) { return p.right; }));
    if (d.steps) { for (var j = 0; j < d.steps.length; j++) d.steps[j].options = shuffle(d.steps[j].options); }
    if (d.type === 'terminal') { d.elements = shuffle(d.elements); }
  }

  /* ---------------- scoring core ---------------- */
  /* scoreItems: H = correct items selected, W = wrong items selected, N = total correct items
     credit = max(0, (H - W) / N)   (partial-credit contract) */
  function scoreItems(selectedIds, correctIds) {
    var N = correctIds.length;
    var H = 0, W = 0;
    var sel = selectedIds || [];
    for (var i = 0; i < sel.length; i++) {
      if (correctIds.indexOf(sel[i]) !== -1) H++; else W++;
    }
    return { N: N, H: H, W: W, credit: N === 0 ? 1 : Math.max(0, (H - W) / N) };
  }

  /* ---------------- app shell ---------------- */
  var app;
  function boot() {
    app = $('app');
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d) return;
      if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
        if (d.username) { CFG.learner = d.username; var g = $('greetLine'); if (g) g.textContent = 'Welcome, ' + d.username + '. You can start when ready.'; }
      }
    });
    renderIntro();
    setInterval(tick, 250);
  }

  function renderIntro() {
    phase = 'intro';
    T.state = 'RUNNING'; /* timer idle until exam starts; tick guard: phase check */
    var hdr = $('xheader'); if (hdr) hdr.classList.add('hidden');
    app.innerHTML = '';
    var w = el('div', 'intro');
    var sevChip = '<span class="chip sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + ' tier ' + CFG.batch + ' of 4</span>';
    w.innerHTML = '<h1>' + esc(CFG.examTitle) + '</h1>' +
      '<p class="subtitle">MITRE ATT&amp;CK practice certification &middot; topic ' + esc(CFG.topicId.toUpperCase()) + ' &middot; ' + esc(CFG.objectType) + '</p>' +
      '<div class="meta-chips">' + sevChip +
      '<span class="chip">' + CFG.questionCount + ' exercises</span>' +
      '<span class="chip">' + CFG.estimatedMinutes + ' minutes</span>' +
      '<span class="chip">Pass mark: ' + CFG.passMark + '%</span></div>' +
      '<p id="greetLine" style="font-weight:600">' + (CFG.learner ? 'Welcome, ' + esc(CFG.learner) + '.' : '') + ' You will practise one ATT&amp;CK object from many angles. Read the short lesson below first.</p>';

    var p1 = el('div', 'panel');
    p1.innerHTML = '<h2><span aria-hidden="true">\uD83D\uDCD8</span> About ' + esc(CFG.objectId) + ' — ' + esc(CFG.objectName) + '</h2>' + INTRO.about;
    w.appendChild(p1);

    var p2 = el('div', 'panel');
    p2.innerHTML = '<h2><span aria-hidden="true">\uD83E\uDDD0</span> Keywords covered in this tier</h2>' +
      '<p style="font-size:14px;color:var(--muted)">These are the ATT&amp;CK ideas behind the exercises. The four tiers of this topic share the same object; each tier exercises them at its own depth.</p>' +
      renderThemes();
    w.appendChild(p2);

    var p3 = el('div', 'panel');
    p3.innerHTML = '<h2><span aria-hidden="true">\uD83C\uDFAF</span> How this exam works</h2>' + INTRO.howto;
    w.appendChild(p3);

    var p4 = el('div', 'panel');
    p4.innerHTML = '<h2><span aria-hidden="true">\u2696\uFE0F</span> Rules in plain words</h2>' + INTRO.rules;
    w.appendChild(p4);

    var startBtn = el('button', 'primary', 'Start the exam');
    startBtn.id = 'startBtn';
    startBtn.style.fontSize = '17px';
    startBtn.style.padding = '12px 30px';
    startBtn.addEventListener('click', startExam);
    var sb = el('div', 'panel'); sb.style.textAlign = 'center';
    sb.appendChild(startBtn);
    w.appendChild(sb);
    app.appendChild(w);
  }

  function renderThemes() {
    var h = '';
    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      h += '<div class="theme-block"><div class="theme-name"><span aria-hidden="true">' + t.icon + '</span> ' + esc(t.name) + '</div>';
      for (var j = 0; j < t.keywords.length; j++) { h += '<span class="kw">' + esc(t.keywords[j]) + '</span>'; }
      h += '</div>';
    }
    return h;
  }


  /* ---------------- exam flow ---------------- */
  function startExam() {
    attempt++;
    credits = {}; skipped = {}; hintUsed = {};
    idx = 0; reportedForAttempt = -1; fromReview = false;
    T.remaining = CFG.durationSec; T.accManual = 0; T.accAuto = 0; T.exDeadline = null; T.last = Date.now();

    var hdr = $('xheader'); if (hdr) hdr.classList.remove('hidden');

  }

  function renderHeader() {
    var h = $('xheader'); if (!h) return;
    var score = scoreLine();
    var pauseBtn = T.state === 'PAUSED_MANUAL'
      ? '<button class="hbtn" id="pauseBtn" aria-label="Resume exam">\u25B6 Resume</button>'
      : '<button class="hbtn" id="pauseBtn" aria-label="Pause exam">\u23F8 Pause</button>';
    var counterTxt = phase === 'review' ? 'Review skipped'
      : phase === 'results' ? 'Results'
      : 'Exercise ' + Math.min(idx + 1, order.length) + ' of ' + order.length;
    h.innerHTML =
      '<span class="counter">' + counterTxt + '</span>' +
      '<span class="sev-badge sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + '</span>' +
      '<span class="timer-chip" id="timerChip"></span>' +
      '<span class="score-chip" aria-label="Live score">\u2605 <span id="liveScore">' + score + '</span></span>' +
      '<span class="spacer"></span>' +
      (phase === 'exam' && !answeredCurrent() ? '<button class="hbtn" id="hintBtn" aria-label="Show one hint">\uD83D\uDCA1 Hint</button>' : '') +
      (phase === 'exam' ? '<button class="hbtn" id="skipBtn" aria-label="Skip exercise">\u23ED Skip</button>' : '') +
      pauseBtn;
    renderTimer();
    bindHeader();
  }
  function bindHeader() {
    var b;
    b = $('pauseBtn'); if (b) b.addEventListener('click', onPauseToggle);
    b = $('hintBtn'); if (b) b.addEventListener('click', onHint);
    b = $('skipBtn'); if (b) b.addEventListener('click', onSkip);
  }
  function answeredCurrent() { return current && credits[current.id] !== undefined; }
  function scoreLine() {
    var n = 0, s = 0;
    for (var k in credits) { n++; s += credits[k]; }
    if (n === 0) return '0.0 / 0 (—%)';
    return round1(s) + ' / ' + n + ' (' + Math.round(s / n * 100) + '%)';
  }
  function updateScore() { var ls = $('liveScore'); if (ls) ls.textContent = scoreLine(); }

  function onPauseToggle() {
    if (phase !== 'exam' && phase !== 'review') return;
    if (T.state === 'PAUSED_MANUAL') {
      setState(T.prevState || 'RUNNING');
      var veil = $('pauseVeil'); if (veil) veil.remove();
    } else {
      T.prevState = T.state;
      setState('PAUSED_MANUAL');

  function showPauseVeil() {
    var veil = $('pauseVeil');
    if (!veil) {
      veil = el('div', '');
      veil.id = 'pauseVeil';
      veil.style.cssText = 'position:fixed;inset:0;background:rgba(15,28,51,.93);z-index:100;display:flex;align-items:center;justify-content:center;color:#e8eefb;text-align:center;padding:20px';
      veil.innerHTML = '<div><div style="font-size:40px" aria-hidden="true">\u23F8</div><div style="font-size:20px;font-weight:800;margin-top:8px">PAUSED — manual break</div><p style="max-width:420px;color:#c4d2ec">The exercise is hidden so you cannot read it while the clock is stopped. Press Resume to continue.</p></div>';
      veil.addEventListener('click', onPauseToggle);
      document.body.appendChild(veil);
    }
  }

  function onHint() {
    if (!current || hintUsed[current.id] || answeredCurrent()) return;
    hintUsed[current.id] = true;
    var box = $('hintBox');
    if (box) { box.innerHTML = '<b>Hint:</b> ' + esc(current.hint); box.classList.remove('hidden'); }
    var hb = $('hintBtn'); if (hb) { hb.disabled = true; hb.title = 'Hint already used for this exercise'; }
  }

  function onSkip() {
    if (!current || answeredCurrent()) return;
    skipped[current.id] = true;
    T.exDeadline = null;
    if (fromReview) { fromReview = false; gotoReview(); return; }
    if (idx < order.length - 1) { idx++; setState('RUNNING'); renderExercise(order[idx]); }
    else { gotoReview(); }
  }

  function gotoReview() {
    phase = 'review';
    T.exDeadline = null;
    if (T.state !== 'ENDED') setState('RUNNING');
    renderReview();
  }

  function renderReview() {
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');
    var ids = [];
    for (var k in skipped) { if (credits[k] === undefined) ids.push(k); }
    var h = '<div class="block"><div class="block-head"><span class="bicon">\uD83D\uDDC9</span> REVIEW SKIPPED EXERCISES</div><div class="block-body">';
    if (ids.length === 0) {
      h += '<p>You have answered or re-checked every exercise. Nothing is waiting here.</p>';
    } else {
      h += '<p>These exercises are still unanswered. Skipped-and-unanswered exercises are <b>excluded from your score</b>. You can answer them now, as many times as you like, until the timer ends. Or submit and leave them out.</p>';
    }
    h += '</div></div>';
    w.innerHTML = h;
    var list = el('div', 'reviewlist');
    for (var i = 0; i < ids.length; i++) {
      (function (id) {

          fromReview = true;
          idx = order.indexOf(ex);
          setState('RUNNING');

        });

        list.appendChild(row);
      })(ids[i]);
    }
    w.appendChild(list);
    var act = el('div', 'actionrow');

  }

  /* ---------------- exercise rendering ---------------- */
  function renderExercise(ex) {
    current = ex;
    answerWidgets = {};
    fltCount = 0;
    /* reduced per-exercise timer (EXTREMELY HARD terminal only) */
    T.exDeadline = ex.perExerciseTimer ? ex.perExerciseTimer : null;
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');

    /* header block: severity + title */
    w.appendChild(el('div', '', '<h2 style="margin:8px 0 0;color:var(--head)">' + esc(ex.id) + ' — ' + esc(ex.title) + '</h2>'));

    /* SCENARIO block (collapsible when long) */

    var panels = ex.scenario;
    var totalLen = 0;

    var collapsed = totalLen > 420;
    var sbody = el('div', 'block-body');
    for (var i = 0; i < panels.length; i++) sbody.appendChild(renderArtefact(panels[i]));
    if (collapsed) {
      var sum = el('button', 'scen-summary');
      sum.type = 'button';
      sum.innerHTML = '<span class="caret" aria-hidden="true">\u25BC</span><span>' + esc(ex.summary) + '</span><span style="margin-left:auto;font-weight:400">(tap to collapse / expand the scenario)</span>';
      sum.setAttribute('aria-expanded', 'true');
      sum.addEventListener('click', function () {
        var open = sbody.style.display !== 'none';
        sbody.style.display = open ? 'none' : '';
        sum.setAttribute('aria-expanded', open ? 'false' : 'true');
        scen.classList.toggle('scen-collapsed', open);
      });
      scen.appendChild(sum);
      scen.appendChild(sbody);
    } else {
      scen.appendChild(sbody);
    }
    w.appendChild(scen);

    /* QUESTION block */
    var q = el('div', 'block question');
    q.innerHTML = '<div class="block-head"><span class="bicon">\u2753</span> QUESTION</div><div class="block-body"><p class="qtext">' + ex.question + '</p></div>';
    w.appendChild(q);

    /* YOUR ANSWER block */
    var a = el('div', 'block answer');
    a.innerHTML = '<div class="block-head"><span class="bicon">\u270D\uFE0F</span> YOUR ANSWER</div>';
    var abody = el('div', 'block-body');
    abody.id = 'answerBody';
    var hintBox = el('div', 'warnbox hidden');
    hintBox.id = 'hintBox';
    abody.appendChild(hintBox);
    if (T.exDeadline !== null) { var etc = el('div', 'warnbox'); etc.id = 'exTimerChip'; abody.appendChild(etc); renderExTimer(); }
    buildWidget(abody, ex);
    var act = el('div', 'actionrow');
    var chk = el('button', 'primary', 'Check');
    chk.id = 'checkBtn';
    chk.addEventListener('click', onCheck);
    act.appendChild(chk);
    var hintNote = el('span', '', '<span style="font-size:12.5px;color:var(--muted)">Check stops the timer so you can read the feedback without pressure. The clock starts again on Next.</span>');
    act.appendChild(hintNote);
    abody.appendChild(act);
    a.appendChild(abody);
    w.appendChild(a);

    /* feedback + next area */
    var fb = el('div', '');
    fb.id = 'feedbackArea';
    w.appendChild(fb);

    app.appendChild(w);
    if (hintUsed[ex.id]) { hintBox.innerHTML = '<b>Hint:</b> ' + esc(ex.hint); hintBox.classList.remove('hidden'); }
  }

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') buildChoice(root, ex);
    else if (ex.type === 'match') buildMatch(root, ex);
    else if (ex.type === 'categorize') buildDnd(root, ex);
    else if (ex.type === 'blank') buildBlank(root, ex);
    else if (ex.type === 'order') buildOrder(root, ex);
    else if (ex.type === 'tree') buildTree(root, ex);
    else if (ex.type === 'clickline') buildClick(root, ex);
    else if (ex.type === 'terminal') buildTerminal(root, ex);
  }

  function buildChoice(root, ex) {
    var d = ex.data;
    var multi = ex.type === 'multi';
    var wrap = el('div', '');
    wrap.setAttribute('role', 'group');
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    answerWidgets.choice = { selected: {}, multi: multi };
    for (var i = 0; i < d.options.length; i++) {
      (function (oi) {
        var lab = el('label', 'opt');
        var input = document.createElement('input');
        input.type = multi ? 'checkbox' : 'radio';
        input.name = 'opt_' + ex.id;
        input.value = oi.id;
        input.addEventListener('change', function () {
          if (multi) {
            if (input.checked) answerWidgets.choice.selected[oi.id] = true;
            else delete answerWidgets.choice.selected[oi.id];
            lab.classList.toggle('selected', input.checked);
          } else {
            answerWidgets.choice.selected = {};
            answerWidgets.choice.selected[oi.id] = true;
            var labs = wrap.querySelectorAll('.opt');
            for (var k = 0; k < labs.length; k++) labs[k].classList.remove('selected');
            lab.classList.add('selected');
          }
        });
        lab.appendChild(input);
        lab.appendChild(el('span', 'olabel', labels[i] + '.'));
        lab.appendChild(el('span', '', '<span>' + esc(oi.t) + '</span>'));
        wrap.appendChild(lab);
      })(d.options[i]);
    }
    root.appendChild(wrap);
  }

  function buildMatch(root, ex) {
    var d = ex.data;
    answerWidgets.match = {};
    for (var i = 0; i < d.pairs.length; i++) {
      (function (p) {
        var row = el('div', 'matchrow');
        row.appendChild(el('div', 'mleft', esc(p.left)));
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Match for: ' + p.left);
        sel.appendChild(new Option('— choose the match —', ''));
        for (var j = 0; j < d.rightOpts.length; j++) sel.appendChild(new Option(d.rightOpts[j], d.rightOpts[j]));
        sel.addEventListener('change', function () { answerWidgets.match[p.left] = sel.value || null; });
        row.appendChild(sel);
        answerWidgets.match[p.left] = null;
        row.dataset.left = p.left;
        root.appendChild(row);
      })(d.pairs[i]);
