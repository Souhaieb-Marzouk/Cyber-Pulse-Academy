<script>
window.CM_EXAM = {"meta": {"topicId": "m1053", "batch": 1, "title": "M1053 Data Backup — EASY", "difficulty": "easy", "questionCount": 15, "estimatedMinutes": 25, "passMark": 70}, "minutes": 25, "sevLabel": "EASY", "sevCls": "sev-easy", "introHtml": "\n<h1>M1053 &middot; Data Backup &mdash; EASY practice exam</h1>\n<div class=\"chiprow\">\n<span class=\"chip sev sev-easy\">◆ EASY</span>\n<span class=\"chip\">15 exercises</span>\n<span class=\"chip\">~25 minutes</span>\n<span class=\"chip\">Pass mark 70%</span>\n<span class=\"chip\">Hint −10%</span>\n<span class=\"chip\">Tier 1 of 4</span>\n</div>\n\n<div class=\"intro-card\">\n<h2>What is M1053? (read this before you start)</h2>\n<p>M1053 is called <b>Data Backup</b>. It is a <b>Mitigation</b> in the MITRE ATT&amp;CK framework. A mitigation is a defensive control: something a company can build or do to stop an attack, or to make an attack hurt less. M1053 does not describe an attacker's action. It describes what defenders should do: take copies of important data and keep those copies safe.</p>\n<p>Why does it matter? Some attackers destroy data (T1485 &middot; Data Destruction), some encrypt data and ask for money (T1486 &middot; Data Encrypted for Impact), some wipe whole disks (T1561 &middot; Disk Wipe), some delete your rescue options such as shadow copies (T1490 &middot; Inhibit System Recovery), and some replace your pages with their own text (T1491 &middot; Defacement). M1053 is the safety net for all of these: if the attacker hits your data, a good backup lets you put it back.</p>\n<p>The ATT&amp;CK page for M1053 asks for five things. <b>1) Regular backups:</b> daily incremental copies and weekly full copies of critical systems. <b>2) Immutability:</b> storage nobody can change or delete (WORM &mdash; write once, read many). <b>3) Encryption:</b> strong encryption (for example AES-256) for backups at rest and in transit. <b>4) Offsite copies:</b> a copy in the cloud or at another physical site. <b>5) Testing:</b> regular restore drills, so you know the backups really work. It also says to harden the backup systems and to keep backups isolated from the corporate network, so an attacker inside the network cannot reach and destroy them.</p>\n<p><b>Where you will meet M1053 at work:</b> SOC analysts see backup alerts every day (failed jobs, deleted jobs, deleted shadow copies) and must understand why they matter. Incident responders restore from backups and must pick a copy the attacker cannot have touched. Backup engineers and administrators build M1053 for a living: schedules, repositories, immutability, encryption, isolation and restore tests. GRC analysts and control owners audit it &mdash; NIST CSF (PR.DS-11), CIS Control 11 (Data Recovery) and ISO/IEC 27001 (A.8.13) all ask for backups that are created, protected and tested. Threat-intel analysts and threat hunters map ransomware and wiper behaviour to this mitigation when they advise the business. Red teamers test it: &ldquo;with one stolen account, can we delete every copy?&rdquo;</p>\n</div>\n\n<div class=\"intro-card\">\n<h2>How this exam works</h2>\n<ul>\n<li><b>Goal:</b> master the M1053 (Data Backup) mitigation at this level. Pass mark: <b>70%</b>, calculated over the exercises you actually answer. This is the EASY tier: one simple idea per exercise, short scenarios, clear guidance, and hints that point at the concept itself.</li>\n<li><b>Exercise types:</b> scenario triage, log analysis with a filter box, drag &amp; drop, matching, ordering and ranking, fill-in-the-blank, spot-the-mistake, and branching simulations. Because M1053 is a policy and architecture mitigation, there are no shell/terminal exercises.</li>\n<li><b>Timer:</b> 25 minutes for the whole exam. You can <b>pause</b> it — while paused, the exercise content is hidden. When the timer ends, unanswered exercises are excluded from the score.</li>\n<li><b>Skipping:</b> every exercise has a Skip button. Skipped exercises move to a review pool. Before you finish, you can return to them and answer them, as many times as you need, until the timer ends. If you finish without answering them, they are excluded from the score (they count neither for nor against you).</li>\n<li><b>Hints:</b> one hint per exercise. A hint costs <b>−10% of that exercise's points</b> and gives a nudge, never the answer.</li>\n<li><b>Retake:</b> if you fail, you can retake the exam — questions and answer choices are shuffled again.</li>\n</ul>\n</div>\n<div class=\"intro-card\">\n<h2>Keywords covered</h2>\n<p class=\"muted\">Every exercise you are about to take is built from these themes and keywords.</p>\n<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Mitigation identity &amp; scope</h3><div class=\"chiprow\"><span class=\"chip\">M1053</span><span class=\"chip\">Data Backup</span><span class=\"chip\">Mitigation</span><span class=\"chip\">Enterprise domain</span><span class=\"chip\">Impact (TA0040)</span></div></div><div class=\"theme-card\"><h3>Techniques addressed</h3><div class=\"chiprow\"><span class=\"chip\">T1485</span><span class=\"chip\">T1485.001</span><span class=\"chip\">T1486</span><span class=\"chip\">T1490</span><span class=\"chip\">T1491</span><span class=\"chip\">T1491.001</span><span class=\"chip\">T1491.002</span><span class=\"chip\">T1561</span><span class=\"chip\">T1561.001</span><span class=\"chip\">T1561.002</span></div></div><div class=\"theme-card\"><h3>Implementation measures</h3><div class=\"chiprow\"><span class=\"chip\">daily incremental + weekly full</span><span class=\"chip\">immutable (WORM)</span><span class=\"chip\">AES-256 encryption</span><span class=\"chip\">offsite storage</span><span class=\"chip\">restore testing</span><span class=\"chip\">hardening</span><span class=\"chip\">network isolation</span></div></div><div class=\"theme-card\"><h3>Control design &amp; trade-offs</h3><div class=\"chiprow\"><span class=\"chip\">corrective</span><span class=\"chip\">preventive</span><span class=\"chip\">detective</span><span class=\"chip\">RPO</span><span class=\"chip\">RTO</span><span class=\"chip\">3-2-1 rule</span><span class=\"chip\">shadow copies vs backups</span><span class=\"chip\">what backups cannot fix</span></div></div><div class=\"theme-card\"><h3>Framework mappings</h3><div class=\"chiprow\"><span class=\"chip\">NIST CSF PR.DS-11</span><span class=\"chip\">CIS Control 11 (11.1–11.4)</span><span class=\"chip\">ISO 27001 A.8.13</span><span class=\"chip\">audit evidence</span></div></div><div class=\"theme-card\"><h3>Real-world use</h3><div class=\"chiprow\"><span class=\"chip\">SOC backup alerts</span><span class=\"chip\">IR restore decisions</span><span class=\"chip\">backup consoles</span><span class=\"chip\">ransomware</span><span class=\"chip\">wipers</span><span class=\"chip\">defacement</span><span class=\"chip\">control audits</span></div></div></div>\n</div>\n<button id=\"start-btn\" class=\"btn primary big\">▶ Start the exam</button>\n", "exercises": [{"id": "E01", "type": "mc", "theme": "Identity & scope", "title": "What kind of ATT&CK object is M1053?", "scenario": {"summary": "A teammate asks what kind of object M1053 is", "blocks": [{"label": "Chat — #soc-training", "text": "Nora: I am reading an incident report. It says “M1053 (Data Backup) was not fully implemented at the victim.” Is M1053 a technique, like T1486?\n\nSam: Good question. Check what kind of object M1053 is before you answer her."}]}, "question": "What type of ATT&CK object is M1053?", "mc": {"options": ["A Mitigation — a defensive control that reduces attack harm", "A Technique — a specific action an attacker takes", "A Tactic — the goal an attacker wants to reach", "A Group — a named team of threat actors"], "correct": 0}, "hint": "Techniques describe attacker actions. M1053 does not describe an attack — it describes a defence against one.", "ansline": "M1053 is a Mitigation — a defensive control, in the Enterprise domain.", "explain": "M1053 is a Mitigation called Data Backup. Mitigations do not describe what attackers do. They describe what defenders can put in place to stop an attack or reduce its harm. M1053 lives in the Enterprise domain of ATT&CK.", "study": "Re-read the intro panel “What is M1053?”, especially the part about object types."}, {"id": "E02", "type": "dnd", "theme": "Techniques addressed", "title": "Match the attack action to the technique name", "scenario": {"summary": "Three short incident notes, three technique boxes", "blocks": [{"label": "Incident notes — last quarter", "text": "Note 1: Files on FS-01 were encrypted. A file named READ_ME.txt asks for payment.\n\nNote 2: 40,000 files on the archive share were deleted. Nobody asked for money.\n\nNote 3: DB-02 will not boot. The disk partition table was overwritten."}]}, "question": "Drag each note to the ATT&CK technique it matches.", "dnd": {"bank": ["Files encrypted, ransom note asks for money", "Files deleted so the business cannot use them", "Disk itself overwritten, machine will not start"], "zones": [{"label": "T1486 · Data Encrypted for Impact", "accept": [0]}, {"label": "T1485 · Data Destruction", "accept": [1]}, {"label": "T1561 · Disk Wipe", "accept": [2]}]}, "hint": "Read each box name as a plain sentence: what does that technique do to data?", "ansline": "Encryption for ransom = T1486; deletion of files = T1485; overwriting the disk = T1561.", "explain": "T1486 encrypts your data and demands payment. T1485 destroys or deletes data. T1561 wipes the disk itself, so even the system may not start. All three live in the Impact tactic, and all three appear on the M1053 page, because backups are the main way to get data back after them.", "study": "The “Techniques addressed” table in the intro."}, {"id": "E03", "type": "mc", "theme": "Identity & scope", "title": "Which tactic do M1053's techniques belong to?", "scenario": {"summary": "The M1053 page lists five techniques — where do they live?", "blocks": [{"label": "ATT&CK excerpt — M1053", "mono": true, "text": "M1053 Data Backup addresses:\n  T1485 Data Destruction\n  T1486 Data Encrypted for Impact\n  T1490 Inhibit System Recovery\n  T1491 Defacement\n  T1561 Disk Wipe"}]}, "question": "All five of these techniques belong to the same tactic. Which one?", "mc": {"options": ["Impact (TA0040)", "Initial Access (TA0001)", "Exfiltration (TA0011)", "Persistence (TA0003)"], "correct": 0}, "hint": "This tactic is about the damage the attacker causes to your data or systems — usually near the end of an attack.", "ansline": "Impact (TA0040).", "explain": "T1485, T1486, T1490, T1491 and T1561 all live in the Impact tactic (TA0040). Impact is where the attacker harms the availability or integrity of your data. Backups (M1053) exist exactly to reduce that harm.", "study": "The ATT&CK matrix column named Impact."}, {"id": "E04", "type": "blank", "theme": "Policy & measures", "title": "Complete the backup policy sentence", "scenario": {"summary": "Policy draft — three words missing", "blocks": [{"label": "Draft — Data Backup Policy v0.1", "mono": true, "text": "1. PURPOSE\n   Critical data must survive ransomware and deletion attacks.\n2. RULES\n   (sentence below — three words missing)"}]}, "question": "Fill the three gaps in the policy sentence with words from the bank.", "blank": {"text": "Critical data is backed up every night. Copies are kept {0} from the company network, and one copy is {1} so ransomware cannot change or delete it. Every quarter, the team must {2} the backups by doing a full restore.", "bank": ["isolated", "immutable", "test", "faster", "colorful", "delete"], "correct": {"0": 0, "1": 1, "2": 2}}, "hint": "The M1053 page asks for three things here: separate from the network, cannot be changed, and prove that it works.", "ansline": "isolated · immutable · test.", "explain": "These are the three core words of M1053. Isolated means the backups are not reachable from the company network. Immutable means nobody can change or delete them. Testing means you prove the backup really restores. A backup that fails these checks is only a hope.", "study": "The description of M1053: isolation, protection, and testing."}, {"id": "E05", "type": "spot", "theme": "Isolation", "title": "Find the line that breaks the backup design", "scenario": {"summary": "Five design notes — one is wrong", "blocks": [{"label": "Task", "text": "A junior wrote the backup design below. One line breaks the idea of M1053. Read every line, then click it."}]}, "question": "Click the one line that breaks the idea of M1053.", "spot": {"lines": ["job: nightly copy of FS-01", "target 1: tape vault, offline, locked room", "target 2: second disk — same server as the original files", "schedule: 02:00 every day", "check: full restore test every quarter"], "wrong": 2}, "hint": "If ransomware can touch the original files, which target can it also touch?", "ansline": "“target 2: second disk — same server as the original files” is the broken line.", "explain": "A copy on the same server is not protected. Ransomware that encrypts FS-01 can encrypt or delete that copy too. M1053 says backups must be stored off the system and isolated from the network. Target 1 (offline tape in a locked room) is the good pattern.", "study": "“Isolation” in the M1053 description."}, {"id": "E06", "type": "match", "theme": "Control design & trade-offs", "title": "Match the backup words to their meaning", "scenario": {"summary": "Three terms, three plain meanings", "blocks": [{"label": "Glossary task — new SOC starters", "text": "Your team lead asks you to check that the new starters know three backup words. Match each term to its plain meaning."}]}, "question": "Match each term on the left to its meaning on the right.", "match": {"pairs": [["RPO", "The most data you can afford to lose, measured in time"], ["RTO", "How quickly you must be working again after a failure"], ["Restore test", "Trying a backup to prove it really works"]]}, "hint": "RPO is about losing data. RTO is about time back to working.", "ansline": "RPO = data-loss limit in time; RTO = time back to working; restore test = proving the backup works.", "explain": "RPO (Recovery Point Objective) answers “how much data can we lose?”. RTO (Recovery Time Objective) answers “how fast must we be back?”. A restore test answers “do the backups actually work?”. M1053's Backup Testing measure exists to answer the third question with evidence, not hope.", "study": "The Backup Testing measure on the M1053 page."}, {"id": "E07", "type": "mc", "theme": "Policy & measures", "title": "What does “immutable” backup storage mean?", "scenario": {"summary": "A vendor offers immutable storage", "blocks": [{"label": "Vendor email", "text": "Our WORM storage keeps your backups immutable for the retention period you choose. Nobody can alter or delete a backup during that period, not even your own administrators."}]}, "question": "What does “immutable” mean here?", "mc": {"options": ["Nobody can change or delete them during that period, even admins", "The backups are encrypted with strong AES-256 keys", "The backups are stored in a cloud region nearby", "The backups are copied on a faster hourly schedule"], "correct": 0}, "hint": "WORM means “write once, read many”. Think about what the attacker cannot do.", "ansline": "Immutable = nobody can change or delete it during the period, even with admin rights.", "explain": "Immutable (WORM) storage cannot be altered or deleted during the set period, even by admins or attackers with stolen passwords. That is why the M1053 page names it as the way to stop ransomware from encrypting or deleting backup files. Encryption is a different measure: it protects secrecy, not survival.", "study": "The Immutable Backups measure in the M1053 description."}, {"id": "E08", "type": "dnd", "theme": "Techniques addressed", "title": "When do backups help — and when not?", "scenario": {"summary": "Four outcomes, two boxes", "blocks": [{"label": "Quick brief — new analyst", "text": "Backups restore data. They do not do everything. Sort these four outcomes into the right box."}]}, "question": "Drag each outcome to the correct box.", "dnd": {"bank": ["Ransomware encrypted the file server — you need the files back", "A wiper destroyed the database — you need the data back", "The attacker copied customer data and threatens to publish it", "The attacker logged in with a stolen password"], "zones": [{"label": "A backup helps here", "accept": [0, 1]}, {"label": "A backup does not help here", "accept": [2, 3]}]}, "hint": "A backup puts data back. Ask: is the problem missing data, or something else?", "ansline": "Backups help with encrypted or destroyed data (items 1–2). They do not un-leak stolen data or stop stolen logins (items 3–4).", "explain": "M1053 addresses Impact techniques: destruction (T1485), encryption (T1486), wiping (T1561), recovery inhibition (T1490) and defacement (T1491). It does not stop the attacker from entering (that is MFA and access control), and it cannot pull back data that was copied out of the network.", "study": "Which techniques the M1053 page lists — and which it does not."}, {"id": "E09", "type": "order", "theme": "Policy & measures", "title": "Put the three events in order", "scenario": {"summary": "Backup, attack, restore", "blocks": [{"label": "Timeline task", "text": "A file server was attacked last night. Put the three events in the right time order."}]}, "question": "Order the three events from first to last.", "order": {"items": ["The nightly backup finishes at 02:00", "Ransomware encrypts the file server at 11:00", "The team restores the data from the isolated backup"], "correct": [0, 1, 2]}, "hint": "The backup must exist before the attack, or the restore has nothing safe to use.", "ansline": "Backup first, then the attack, then the restore.", "explain": "The copy must be taken before the attack, or there is nothing safe to restore from. This is why M1053 asks for regular backups (daily incremental, weekly full), not backups made after an incident starts. After the attack, the team restores from the isolated copy.", "study": "The Regular Backup Scheduling measure."}, {"id": "E10", "type": "spot", "theme": "Real-world use", "title": "Which line shows a failed backup?", "scenario": {"summary": "Six backup job lines, one failure", "blocks": [{"label": "Task", "text": "You are on the SOC shift. The backup scheduler log is in the viewer below. You can use the filter box. Find the failure."}]}, "question": "Click the log line that shows a failed backup job.", "log": {"label": "LOG VIEWER — backup scheduler", "lines": ["2026-10-08 02:00 JOB fs-01 status=OK files=1204 duration=11m", "2026-10-08 02:05 JOB db-01 status=OK files=8422 duration=31m", "2026-10-09 02:00 JOB fs-01 status=OK files=1310 duration=12m", "2026-10-09 02:05 JOB db-01 status=FAILED error=timeout duration=60m", "2026-10-10 02:00 JOB fs-01 status=OK files=1298 duration=11m", "2026-10-10 02:05 JOB db-01 status=OK files=8501 duration=29m"]}, "spot": {"lines": ["2026-10-08 02:00 JOB fs-01 status=OK files=1204 duration=11m", "2026-10-08 02:05 JOB db-01 status=OK files=8422 duration=31m", "2026-10-09 02:00 JOB fs-01 status=OK files=1310 duration=12m", "2026-10-09 02:05 JOB db-01 status=FAILED error=timeout duration=60m", "2026-10-10 02:00 JOB fs-01 status=OK files=1298 duration=11m", "2026-10-10 02:05 JOB db-01 status=OK files=8501 duration=29m"], "wrong": 3}, "hint": "Read the status= part of every line. The filter box can show only the failures.", "ansline": "The 2026-10-09 line for db-01: status=FAILED error=timeout.", "explain": "The db-01 job on 2026-10-09 failed with a timeout. SOC analysts see these alerts every day; a failed backup is a small event with a big meaning: on that night, db-01 got no new restore point. M1053 only works when the backup jobs really run.", "study": "Backup job monitoring — a daily SOC task."}, {"id": "E11", "type": "mc", "theme": "Frameworks", "title": "Which CIS Control covers data recovery?", "scenario": {"summary": "A GRC mapping request", "blocks": [{"label": "GRC ticket", "text": "Ticket GR-88: “Map M1053 (Data Backup) to the CIS Controls v8 for our control register. Which control number is the right match?”"}]}, "question": "Which CIS Controls v8 control is the right match?", "mc": {"options": ["Control 11 — Data Recovery", "Control 8 — Audit Log Management", "Control 4 — Secure Configuration", "Control 14 — Security Awareness"], "correct": 0}, "hint": "The control's own name tells you: it is about recovering data.", "ansline": "CIS Control 11 — Data Recovery.", "explain": "CIS Control 11 (Data Recovery) asks for a recovery process, automated backups, protected recovery data and an isolated instance of recovery data. That matches M1053 closely. GRC analysts keep this mapping in the control register so audits can trace the backup programme to a known framework.", "study": "Framework mappings in the intro: CIS Control 11."}, {"id": "E12", "type": "match", "theme": "Techniques addressed", "title": "Match the ATT&CK ID to the technique name", "scenario": {"summary": "Three ID cards lost their names", "blocks": [{"label": "Flashcards", "text": "Three technique ID cards lost their names. Put the names back. These three appear on the M1053 page."}]}, "question": "Match each ID to its technique name.", "match": {"pairs": [["T1485", "Data Destruction"], ["T1486", "Data Encrypted for Impact"], ["T1561", "Disk Wipe"]]}, "hint": "1486 is the one that encrypts for impact. 1561 is about the disk.", "ansline": "T1485 = Data Destruction, T1486 = Data Encrypted for Impact, T1561 = Disk Wipe.", "explain": "These three IDs appear on the M1053 page. You will read them in real reports: T1486 in almost every ransomware case, T1485 in destructive attacks, T1561 when whole disks are overwritten. Knowing the IDs by heart makes you faster in briefings.", "study": "The “Techniques addressed” table in the intro."}, {"id": "E13", "type": "mc", "theme": "Isolation", "title": "Which one belongs in a good backup policy?", "scenario": {"summary": "Policy review — pick the correct item", "blocks": [{"label": "Draft items", "text": "Your team collected draft items for the new data backup policy. Most came from internet advice. Only one belongs in the final policy."}]}, "question": "Which item belongs in a good data backup policy?", "mc": {"options": ["Keep one copy offline or immutable", "Store the only copy on the same server", "Give the backup server a domain admin account", "Take a full backup only once every year"], "correct": 0}, "hint": "M1053 asks for isolated, protected, tested backups.", "ansline": "Keep one copy offline or immutable.", "explain": "An offline or immutable copy survives even a full domain compromise, because the attacker cannot reach or change it. The other three items are classic failures seen in real incidents: copies next to the originals, over-privileged backup servers, and backups too old to matter.", "study": "The M1053 description: isolated and protected backups."}, {"id": "E14", "type": "sim", "theme": "Real-world use", "title": "Restore the file server", "scenario": {"summary": "Morning alert: files encrypted, one decision to make", "blocks": [{"label": "SOC alert — this morning", "mono": true, "text": "07:12 EDR: FS-01 — mass file rename to *.lockd + READ_ME.txt written\n07:13 job: nightly backup FS-01 status=OK at 02:00 (isolated target)\n07:14 IR lead: “Server is isolated from the network. Decide how we get the data back.”"}]}, "question": "Make the restore decision for this incident.", "sim": {"steps": [{"question": "What is the fastest safe way to get the data back?", "options": ["Restore FS-01 data from last night's isolated backup after checking it", "Pay the ransom in the note so the attacker sends the key", "Copy the encrypted files to a USB stick and rename them back", "Restart FS-01 and hope that the files come back"], "correct": 0, "outcome_ok": "The team verified the isolated backup and restored FS-01 data before lunch. No ransom was paid.", "outcome_no": "Wrong move. Paying funds crime and is not a control; USB copies of encrypted files stay encrypted; a restart changes nothing. The isolated backup is the designed path (M1053)."}]}, "hint": "You have a working, isolated copy from 02:00. Use the control you built.", "ansline": "Restore from last night's isolated backup after a quick check.", "explain": "This is the everyday job of an incident responder: confirm the backup is clean, restore, and verify. Because the backup is isolated (M1053), the attacker could not touch it, so the restore is safe. Restores are also why the restore test (Backup Testing) matters before an incident, not during one.", "study": "Incident response restore playbooks."}, {"id": "E15", "type": "blank", "theme": "Policy & measures", "title": "Complete the 3-2-1 rule", "scenario": {"summary": "Three numbers missing on the training slide", "blocks": [{"label": "Training slide — backup basics", "mono": true, "text": "THE 3-2-1 RULE\n  ... copies of the data\n  ... different types of storage\n  ... copy kept offsite"}]}, "question": "Fill the gaps to complete the 3-2-1 backup rule.", "blank": {"text": "Keep {0} copies of the data, on {1} different types of storage, with {2} copy kept offsite.", "bank": ["three", "two", "one", "four", "zero"], "correct": {"0": 0, "1": 1, "2": 2}}, "hint": "The rule's name is the answer: 3, then 2, then 1.", "ansline": "three copies · two media types · one offsite copy.", "explain": "The 3-2-1 rule is the classic way to describe M1053 in practice: three copies, two different storage types, one offsite. Many teams now add “one immutable or offline copy, and zero errors on restore tests” on top. The numbers keep the plan simple to audit.", "study": "Backup basics in the intro panel."}]};

    return {

  /* ---------------- header ---------------- */
  function updateHeader() {
    var h = $('#hdr'); if (h) h.hidden = false;
    var sev = $('#h-sev');
    if (sev) { sev.textContent = '\u25C6 ' + CFG.sevLabel; sev.className = 'chip sev ' + CFG.sevCls; }
    var cnt = $('#h-count');
    if (S.phase === 'exam' && S.cur != null) {
      cnt.textContent = 'Exercise ' + (S.order.indexOf(S.cur) + 1) + ' of ' + S.order.length;
    } else if (S.phase === 'review') {
      cnt.textContent = 'Review pool: ' + S.skipped.length;
    } else if (S.phase === 'results') {
      cnt.textContent = 'Finished';
    } else {
      cnt.textContent = '\u2014';
    }
    updateTimerUI();
    var sc = $('#h-score');
    if (sc) sc.textContent = 'Score: ' + S.correctCount + ' correct \u00B7 ' + S.earned + ' pts';
    var hb = $('#h-hint');
    if (hb) hb.disabled = !(S.phase === 'exam' && S.cur != null && !S.hintUsed[S.cur] && !(S.cur in S.answered));
    var sb = $('#h-skip');
    if (sb) sb.disabled = !(S.phase === 'exam' && S.cur != null && !(S.cur in S.answered));
    updateProgress();
  }

  function updateProgress() {
    var pb = $('#pbar'), pf = $('#pbar-fill');
    if (!pb || !pf || !S) return;
    var total = S.order.length || 1;
    var done = Object.keys(S.answered).length + S.skipped.length;
    var pct = S.phase === 'results' ? 100 : Math.min(100, Math.round((done / total) * 100));
    pf.style.width = pct + '%';
    pb.setAttribute('aria-valuenow', String(pct));
    pb.hidden = (S.phase === 'intro');
  }

  function updateTimerUI() {
    var t = $('#h-timer'); if (!t) return;
    t.textContent = fmtTime(S.timeLeft);
    t.classList.toggle('danger', S.timeLeft < 300);
  }

  function startTimer() { if (S.timerId) clearInterval(S.timerId); S.timerId = setInterval(tick, 1000); }
  function tick() {
    if (!S || S.paused || S.phase === 'results') return;
    S.timeLeft -= 1;
    updateTimerUI();
    if (S.timeLeft <= 0) { S.timeLeft = 0; updateTimerUI(); timeUp(); }
  }
  function togglePause() {
    if (S.phase !== 'exam' && S.phase !== 'review') return;
    S.paused = !S.paused;
    $('#h-pause').textContent = S.paused ? '\u25BA Resume' : '\u2016 Pause';
    $('#pause-ov').hidden = !S.paused;
    if (!S.paused) startTimer(); else if (S.timerId) clearInterval(S.timerId);
  }
  function timeUp() {
    if (S.timerId) clearInterval(S.timerId);
    S.paused = false;
    $('#pause-ov').hidden = true;
    $('#modal').hidden = true;
    toast('\u23F1 Time is over. Exercises left unanswered are excluded from the score.');
    showResults();
  }

  var toastTid = null;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTid);
    toastTid = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  /* ---------------- phases ---------------- */
  function showIntro() {
    S.phase = 'intro';
    $('#hdr').hidden = true;
    stage.innerHTML = '';
    var w = el('div', 'intro', CFG.introHtml);
    var b = $('#start-btn', w);
    if (b) b.addEventListener('click', startExam);
    stage.appendChild(w);
    window.scrollTo(0, 0);
  }

  function startExam() {
    attempts += 1;
    S = newState();
    S.phase = 'exam';
    $('#pause-ov').hidden = true;
    $('#modal').hidden = true;
    renderExercise(S.order[0], false);
    startTimer();
  }

  /* ---------------- exercise rendering ---------------- */
  function buildScenario(ex) {
    var sc = ex.scenario || { summary: '', blocks: [] };
    var b = el('div', 'blk blk-scenario');
    var head = el('button', 'blk-head',
      '<span class="tag">\u25A4 SCENARIO</span><span class="blk-sum">' + esc(sc.summary) + '</span><span class="caret">\u25BE</span>');
    head.type = 'button';
    head.setAttribute('aria-label', 'Toggle scenario. Summary: ' + sc.summary);
    var body = el('div', 'blk-body');
    (sc.blocks || []).forEach(function (a) {
      body.appendChild(artPanel(a));
    });
    head.addEventListener('click', function () {
      var c = body.classList.toggle('hidden');
      head.querySelector('.caret').textContent = c ? '\u25B8' : '\u25BE';
    });
    b.appendChild(head);
    b.appendChild(body);
    return b;
  }

  function artPanel(a) {
    var p = el('div', 'art');
    p.appendChild(el('div', 'art-label', esc(a.label)));
    if (a.mono) { p.appendChild(el('pre', null, hlLog(a.text))); }
    else { p.appendChild(el('div', 'prose', prose(a.text))); }
    return p;
  }

  function questionBlock(text) {
    var qb = el('div', 'blk blk-question');
    qb.innerHTML = '<div class="blk-head static"><span class="tag">\u25CE QUESTION</span></div>' +
      '<div class="blk-body q-text">' + esc(text) + '</div>';
    return qb;
  }

  function renderExercise(idx, fromReview) {
    S.cur = idx;
    S.fromReview = !!fromReview;
    var ex = EX[idx];
    stage.innerHTML = '';
    var card = el('section', 'exam-card');

    var top = el('div', 'ex-top');
    top.appendChild(el('span', 'chip sev ' + CFG.sevCls, '\u25C6 ' + CFG.sevLabel));
    top.appendChild(el('span', 'ex-title', esc(ex.title)));
    top.appendChild(el('span', 'ex-pts', exValue(idx) + ' pts'));
    card.appendChild(top);

    card.appendChild(buildScenario(ex));

    /* feedback wrap is appended AFTER the answer/sim block (layout contract: feedback below) */
    var fbwrap = el('div', 'fbwrap');

    if (ex.sim) {
      card.appendChild(buildSim(ex, idx, fbwrap));
      card.appendChild(fbwrap);
    } else {
      card.appendChild(questionBlock(ex.question));
      var ab = el('div', 'blk blk-answer');
      ab.innerHTML = '<div class="blk-head static"><span class="tag">\u270E YOUR ANSWER</span></div>';
      var body = el('div', 'blk-body');
      ab.appendChild(body);
      var actions = el('div', 'actions');
      var submit = el('button', 'btn primary', 'Submit answer');
      submit.type = 'button';
      actions.appendChild(submit);
      ab.appendChild(actions);
      card.appendChild(ab);
      card.appendChild(fbwrap);

      var grade = buildWidget(ex, idx, body);
      submit.addEventListener('click', function () {
        if (S.cur in S.answered) return;
        var res = grade();
        if (res == null) { toast('Choose an answer first.'); return; }
        var abq = $('.blk-answer', card); if (abq) abq.classList.add('done');
        submit.disabled = true;
        onSubmit(ex, idx, res.ok, res.detail, fbwrap);
      });
    }

    stage.appendChild(card);
    updateHeader();
    window.scrollTo(0, 0);
  }

  function onSubmit(ex, idx, ok, detail, fbwrap) {
    var val = exValue(idx);
    if (!(idx in S.answered)) {
      S.answered[idx] = { ok: ok, val: val };
      S.possible += val;
      if (ok) { S.correctCount += 1; S.earned += val; }
      var si = S.skipped.indexOf(idx);
      if (si >= 0) S.skipped.splice(si, 1);
    }
    var fb = el('div', 'fb ' + (ok ? 'ok' : 'bad'));
    fb.innerHTML =
      '<h4>' + (ok ? '\u2713 CORRECT' : '\u2717 INCORRECT') + '</h4>' +
      '<p class="fb-ans"><b>Correct answer:</b> ' + esc(ex.ansline) + '</p>' +
      (detail || '') +
      '<p>' + esc(ex.explain) + '</p>' +
      (ok ? '' : '<p class="fb-study"><b>What to study:</b> ' + esc(ex.study) + '</p>') +
      '<p class="fb-pts">' + (ok ? ('+' + val + ' pts' + (S.hintUsed[idx] ? ' (hint used: \u221210%)' : '')) : '+0 pts') + '</p>';
    var nb = el('button', 'btn primary next-btn', S.fromReview ? 'Back to review pool' : 'Next');
    nb.type = 'button';
    nb.addEventListener('click', function () {
      if (S.fromReview) { showReview(); } else { nextUnanswered(); }
    });
    fb.appendChild(nb);
    fbwrap.innerHTML = '';
    fbwrap.appendChild(fb);
    updateHeader();
    scrollInto(fb);
  }

  function nextUnanswered() {
    var start = S.order.indexOf(S.cur);
    var n = S.order.length, i, idx;
    for (i = 1; i <= n; i++) {
      idx = S.order[(start + i) % n];
      if (!(idx in S.answered) && S.skipped.indexOf(idx) < 0) { renderExercise(idx, false); return; }
    }
    if (S.skipped.length) { showReview(); } else { showResults(); }
  }

  function skipCurrent() {
    if (S.phase !== 'exam' || S.cur == null) return;
    if (S.cur in S.answered) return;
    if (S.skipped.indexOf(S.cur) < 0) S.skipped.push(S.cur);
    toast('\u26A0 Skipped \u2014 moved to the review pool.');
    nextUnanswered();
  }

  function useHint() {
    if (S.phase !== 'exam' || S.cur == null) return;
    if (S.hintUsed[S.cur] || (S.cur in S.answered)) return;
    S.hintUsed[S.cur] = true;
    var ex = EX[S.cur];
    var body = $('.exam-card .blk-answer .blk-body') || $('.exam-card .simbox');
    if (body) {
      var strip = el('div', 'hintstrip', '<b>Hint (\u221210% of this exercise\u2019s points):</b> ' + esc(ex.hint));
      body.insertBefore(strip, body.firstChild);
    }
    var pts = $('.ex-pts'); if (pts) pts.textContent = exValue(S.cur) + ' pts';
    var hb = $('#h-hint'); if (hb) hb.disabled = true;
    updateHeader();
    toast('Hint used: \u221210% of this exercise\u2019s points.');
  }

  /* ---------------- widget builders ---------------- */
  function markChoice(list, ord, correct, chosen) {
    Array.prototype.forEach.call(list.children, function (o, d) {
      var oi = ord[d];
      o.disabled = true;
      if (oi === correct) { o.classList.add('ok'); o.querySelector('.k').innerHTML = letters(d) + '. \u2713'; }
      else if (chosen != null && oi === chosen && chosen !== correct) { o.classList.add('bad'); o.querySelector('.k').innerHTML = letters(d) + '. \u2717'; }
    });
  }

  function optionRow(text, d) {
    var b = el('button', 'opt', '<span class="k">' + letters(d) + '.</span><span>' + esc(text) + '</span>');
    b.type = 'button';
    return b;
  }

  function buildLogPanel(log, host) {
    var p = el('div', 'art logpanel');
    p.appendChild(el('div', 'art-label', esc(log.label || 'LOG VIEWER')));
    var filter = el('input', 'filterbox');
    filter.type = 'text';
    filter.placeholder = 'Filter lines (case-insensitive)\u2026';
    filter.setAttribute('aria-label', 'Filter log lines');
    p.appendChild(filter);
    var pre = el('pre', 'loglines');
    var count = el('div', 'logcount muted small');
    function draw(f) {
      var f2 = (f || '').toLowerCase();
      var shown = log.lines.filter(function (ln) { return !f2 || ln.toLowerCase().indexOf(f2) >= 0; });
      pre.innerHTML = shown.map(hlLog).join('\n');
      count.textContent = 'Showing ' + shown.length + ' of ' + log.lines.length + ' lines.';
    }
    filter.addEventListener('input', function () { draw(filter.value.trim()); });
    draw('');
    p.appendChild(pre);
    p.appendChild(count);
    host.appendChild(p);
    return p;
  }

  function buildWidget(ex, idx, body) {
    var v = S.views[idx];

    /* --- multiple choice (optionally with a log viewer) --- */
    if (ex.mc) {
      if (ex.log) buildLogPanel(ex.log, body);
      var list = el('div', 'opts');
      var sel = null;
      v.optOrder.forEach(function (oi, d) {
        var b = optionRow(ex.mc.options[oi], d);
        b.addEventListener('click', function () {
          sel = oi;
          $all('.opt', list).forEach(function (o) { o.classList.remove('sel'); });
          b.classList.add('sel');
        });
        list.appendChild(b);
      });
      body.appendChild(list);
      return function () {
        if (sel == null) return null;
        markChoice(list, v.optOrder, ex.mc.correct, sel);
        return { ok: sel === ex.mc.correct, detail: '' };
      };
    }

    /* --- multi-select --- */
    if (ex.multi) {
      var picked = {};
      var listM = el('div', 'opts');
      v.optOrder.forEach(function (oi, d) {
        var b = optionRow(ex.multi.options[oi], d);
        b.addEventListener('click', function () {
          if (picked[oi]) { delete picked[oi]; b.classList.remove('sel'); }
          else { picked[oi] = true; b.classList.add('sel'); }
        });
        listM.appendChild(b);
      });
      body.appendChild(listM);
      body.appendChild(el('p', 'muted small', 'Select all options that apply, then submit.'));
      return function () {
        var chosen = Object.keys(picked).map(Number);
        if (!chosen.length) return null;
        Array.prototype.forEach.call(listM.children, function (o, d) {
          var oi = v.optOrder[d];
          o.disabled = true;
          if (ex.multi.correct.indexOf(oi) >= 0) { o.classList.add('ok'); o.querySelector('.k').innerHTML = letters(d) + '. \u2713'; }
          else if (picked[oi]) { o.classList.add('bad'); o.querySelector('.k').innerHTML = letters(d) + '. \u2717'; }
        });
        return { ok: eqSet(chosen, ex.multi.correct), detail: '' };
      };
    }

    /* --- drag & drop / classification --- */
    if (ex.dnd) return buildDnD(ex, idx, body);

    /* --- ordering and ranking --- */
    if (ex.order || ex.rank) return buildOrder(ex, idx, body);

    /* --- matching --- */
    if (ex.match) return buildMatch(ex, idx, body);

    /* --- fill in the blank --- */
    if (ex.blank) return buildBlank(ex, idx, body);

    /* --- spot the mistake --- */
    if (ex.spot) return buildSpot(ex, idx, body);

    return function () { return null; };
  }

  function buildDnD(ex, idx, body) {
    var v = S.views[idx];
    var wrap = el('div', 'dndwrap');
    var bankCol = el('div', 'dndcol');
    bankCol.appendChild(el('div', 'dndtitle', 'ITEMS'));
    var bank = el('div', 'bank dropzone');
    bank.setAttribute('role', 'list');
    bank.tabIndex = 0;
    bank.dataset.zone = '-1';
    bankCol.appendChild(bank);
    wrap.appendChild(bankCol);
    var zoneEls = [];
    ex.dnd.zones.forEach(function (z, zi) {
      var col = el('div', 'dndcol');
      col.appendChild(el('div', 'dndtitle', esc(z.label)));
      var zEl = el('div', 'zone dropzone');
      zEl.dataset.zone = String(zi);
      zEl.tabIndex = 0;
      zEl.setAttribute('role', 'list');
      zEl.setAttribute('aria-label', 'Drop zone: ' + z.label);
      col.appendChild(zEl);
      zoneEls.push(zEl);
      wrap.appendChild(col);
    });
    body.appendChild(wrap);
    body.appendChild(el('p', 'muted small', 'Drag with the mouse, or click an item and then click a box. Click a placed item, then click ITEMS to send it back.'));

    function itemEl(ii) {
      var it = el('div', 'item' + (v.sel === ii ? ' sel' : ''), esc(ex.dnd.bank[ii]));
      it.draggable = true;
      it.dataset.ii = String(ii);
      it.tabIndex = 0;
      it.setAttribute('role', 'button');
      it.setAttribute('aria-label', 'Item: ' + ex.dnd.bank[ii] + '. Press Enter to pick it up, then click a box.');
      it.addEventListener('click', function (ev) {
        ev.stopPropagation();
        v.sel = (v.sel === ii ? null : ii);
        $all('.item', wrap).forEach(function (x) { x.classList.remove('sel'); });
        if (v.sel === ii) it.classList.add('sel');
      });
      it.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); it.click(); }
      });
      it.addEventListener('dragstart', function (ev) {
        try { ev.dataTransfer.setData('text/plain', String(ii)); } catch (e) { /* IE */ }
      });
      return it;
    }
    function place(ii, zi) {
      if (v.place[ii] === zi) return;
      v.place[ii] = zi;
      v.sel = null;
      draw();
    }
    function draw() {
      bank.innerHTML = '';
      zoneEls.forEach(function (z) { z.innerHTML = ''; });
      v.bankOrder.forEach(function (ii) {
        if (v.place[ii] === undefined || v.place[ii] === -1) bank.appendChild(itemEl(ii));
      });
      ex.dnd.zones.forEach(function (z, zi) {
        v.bankOrder.forEach(function (ii) {
          if (v.place[ii] === zi) zoneEls[zi].appendChild(itemEl(ii));
        });
      });
    }
    $all('.dropzone', wrap).forEach(function (dz) {
      var zi = parseInt(dz.dataset.zone, 10);
      dz.addEventListener('dragover', function (ev) { ev.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
      dz.addEventListener('drop', function (ev) {
        ev.preventDefault(); dz.classList.remove('over');
        var ii = parseInt(ev.dataTransfer.getData('text/plain'), 10);
        if (!isNaN(ii)) place(ii, zi);
      });
      dz.addEventListener('click', function (ev) {
        if (v.sel != null && !ev.target.classList.contains('item')) place(v.sel, zi);
      });
      dz.addEventListener('keydown', function (ev) {
        if ((ev.key === 'Enter' || ev.key === ' ') && v.sel != null) { ev.preventDefault(); place(v.sel, zi); }
      });
    });
    draw();
    return function () {
      var unplaced = 0;
      v.bankOrder.forEach(function (ii) { if (v.place[ii] === undefined || v.place[ii] === -1) unplaced++; });
      if (unplaced) { toast('Place all items first.'); return null; }
      var ok = true;
      ex.dnd.zones.forEach(function (z, zi) {
        var zoneOk = true;
        v.bankOrder.forEach(function (ii) {
          var inZone = v.place[ii] === zi;
          var should = z.accept.indexOf(ii) >= 0;
          if (inZone !== should) { ok = false; zoneOk = false; }
        });
        zoneEls[zi].classList.add(zoneOk ? 'okz' : 'badz');
      });
      var detail = '<p>' + ex.dnd.zones.map(function (z, zi) {
        var got = v.bankOrder.filter(function (ii) { return v.place[ii] === zi; })
          .map(function (ii) { return esc(ex.dnd.bank[ii]); });
        return '<b>' + esc(z.label) + ':</b> ' + (got.join(' \u00B7 ') || '\u2014');
      }).join('<br>') + '</p>';
      return { ok: ok, detail: detail };
    };
  }

  function buildOrder(ex, idx, body) {
    var payload = ex.order || ex.rank;
    var v = S.views[idx];
    var list = el('div', 'olist');
    body.appendChild(list);
    body.appendChild(el('p', 'muted small', 'Drag to reorder, or use the \u25B2 \u25BC buttons.'));
    var dragIdx = null;
    function reorder(from, to) {
      var x = v.itemOrder.splice(from, 1)[0];
      v.itemOrder.splice(to, 0, x);
      dragIdx = null;
      draw();
    }
    function draw() {
      list.innerHTML = '';
      v.itemOrder.forEach(function (ii, pos) {
        var row = el('div', 'orow');
        row.draggable = true;
        row.dataset.ii = String(ii);
        row.innerHTML = '<span class="handle" aria-hidden="true">\u22EE\u22EE</span>' +
          '<span class="otext">' + esc(payload.items[ii]) + '</span>' +
          '<span class="obtns"><button type="button" class="btn sm up" aria-label="Move up">\u25B2</button>' +
          '<button type="button" class="btn sm down" aria-label="Move down">\u25BC</button></span>';
        row.querySelector('.up').addEventListener('click', function () { if (pos > 0) reorder(pos, pos - 1); });
        row.querySelector('.down').addEventListener('click', function () { if (pos < v.itemOrder.length - 1) reorder(pos, pos + 1); });
        row.addEventListener('dragstart', function (ev) { dragIdx = pos; try { ev.dataTransfer.setData('text/plain', String(pos)); } catch (e) {} });
        row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
        row.addEventListener('drop', function (ev) { ev.preventDefault(); if (dragIdx != null && dragIdx !== pos) reorder(dragIdx, pos); });
        list.appendChild(row);
      });
    }
    draw();
    return function () {
      Array.prototype.forEach.call(list.children, function (row) {
        var oi = parseInt(row.dataset.ii, 10);
        var pos = v.itemOrder.indexOf(oi);
        row.classList.add(oi === payload.correct[pos] ? 'okr' : 'badr');
        row.draggable = false;
        $all('button', row).forEach(function (b) { b.disabled = true; });
      });
      var detail = '<p><b>Correct order:</b> ' + payload.correct.map(function (ii, n) {
        return (n + 1) + '. ' + esc(payload.items[ii]);
      }).join(' \u2192 ') + '</p>';
      return { ok: v.itemOrder.join(',') === payload.correct.join(','), detail: detail };
    };
  }

  function buildMatch(ex, idx, body) {
    var v = S.views[idx];
    var wrap = el('div', 'matchwrap');
    var left = el('div', 'mcol'), right = el('div', 'mcol');
    wrap.appendChild(left); wrap.appendChild(right);
    body.appendChild(wrap);
    body.appendChild(el('p', 'muted small', 'Click an item on the left, then its partner on the right. Click a paired right item to unlink it.'));
    function rLabel(ri) { return String(v.rightOrder.indexOf(ri) + 1); }
    function draw() {
      left.innerHTML = ''; right.innerHTML = '';
      v.leftOrder.forEach(function (li, d) {
        var paired = (v.map[li] !== undefined);
        var b = el('button', 'mitem' + (paired ? ' paired' : '') + (v.sel === li ? ' sel' : ''),
          '<span class="k">' + letters(d) + '.</span><span>' + esc(ex.match.pairs[li][0]) +
          (paired ? ' <span class="ptag">\u2194 ' + rLabel(v.map[li]) + '</span>' : '') + '</span>');
        b.type = 'button';
        b.addEventListener('click', function () { v.sel = (v.sel === li ? null : li); draw(); });
        left.appendChild(b);
      });
      v.rightOrder.forEach(function (ri, d) {
        var owner = null;
        Object.keys(v.map).forEach(function (lk) { if (v.map[lk] === ri) owner = parseInt(lk, 10); });
        var b = el('button', 'mitem' + (owner != null ? ' paired' : ''),
          '<span class="k">' + (d + 1) + '.</span><span>' + esc(ex.match.pairs[ri][1]) +
          (owner != null ? ' <span class="ptag">\u2194 ' + letters(v.leftOrder.indexOf(owner)) + '</span>' : '') + '</span>');
        b.type = 'button';
        b.addEventListener('click', function () {
          if (v.sel == null) {
            /* no left item selected: clicking a paired right item unlinks it */
            var owner = null;
            Object.keys(v.map).forEach(function (lk) { if (v.map[lk] === ri) owner = lk; });
            if (owner != null) { delete v.map[owner]; draw(); }
            else { toast('Pick an item on the left first.'); }
            return;
          }
          Object.keys(v.map).forEach(function (lk) { if (v.map[lk] === ri) delete v.map[lk]; });
          v.map[v.sel] = ri;
          v.sel = null;
          draw();
        });
        right.appendChild(b);
      });
    }
    draw();
    return function () {
      if (Object.keys(v.map).length < ex.match.pairs.length) { toast('Pair all items first.'); return null; }
      $all('.mitem', wrap).forEach(function (b) { b.disabled = true; });
      var ok = ex.match.pairs.every(function (p, i) { return v.map[i] === i; });
      var detail = '<p><b>Correct pairs:</b><br>' + ex.match.pairs.map(function (p) {
        return esc(p[0]) + ' \u2192 ' + esc(p[1]);
      }).join('<br>') + '</p>';
      return { ok: ok, detail: detail };
    };
  }

  function buildBlank(ex, idx, body) {
    var v = S.views[idx];
    var textEl = el('div', 'blanktext');
    body.appendChild(textEl);
    var bankEl = el('div', 'wordbank');
    body.appendChild(bankEl);
    body.appendChild(el('p', 'muted small', 'Click a gap, then click a word. Click a filled gap to empty it.'));
    function draw() {
      var parts = ex.blank.text.split(/\{(\d+)\}/);
      var html = '';
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 0) { html += esc(parts[i]); }
        else {
          var s = parseInt(parts[i], 10);
          var w = v.fill[s];
          html += '<button type="button" class="slot' + (v.sel === s ? ' sel' : '') + '" data-slot="' + s + '" aria-label="Gap ' + (s + 1) + '">' +
            (w != null ? esc(ex.blank.bank[w]) : '\u2014\u2014\u2014') + '</button>';
        }
      }
      textEl.innerHTML = html;
      $all('.slot', textEl).forEach(function (b) {
        b.addEventListener('click', function () {
          var s = parseInt(b.dataset.slot, 10);
          if (v.fill[s] != null) { delete v.fill[s]; v.sel = null; draw(); return; }
          v.sel = (v.sel === s ? null : s);
          draw();
        });
      });
      bankEl.innerHTML = '<div class="dndtitle">WORD BANK</div>';
      v.bankOrder.forEach(function (wi) {
        var used = Object.keys(v.fill).some(function (k) { return v.fill[k] === wi; });
        var c = el('button', 'wchip' + (used ? ' used' : ''), esc(ex.blank.bank[wi]));
        c.type = 'button';
        c.disabled = used;
        c.addEventListener('click', function () {
          if (v.sel == null) { toast('Click a gap first.'); return; }
          v.fill[v.sel] = wi;
          v.sel = null;
          draw();
        });
        bankEl.appendChild(c);
      });
    }
    draw();
    return function () {
      var keys = Object.keys(ex.blank.correct);
      for (var i = 0; i < keys.length; i++) { if (v.fill[keys[i]] == null) { toast('Fill every gap first.'); return null; } }
      var ok = keys.every(function (k) { return v.fill[k] === ex.blank.correct[k]; });
      var detail = '<p><b>Correct words:</b> ' + keys.sort().map(function (k) {
        return 'gap ' + (parseInt(k, 10) + 1) + ' = \u201C' + esc(ex.blank.bank[ex.blank.correct[k]]) + '\u201D';
      }).join(', ') + '</p>';
      return { ok: ok, detail: detail };
    };
  }

  function buildSpot(ex, idx, body) {
    var v = S.views[idx];
    var list = el('div', 'spotlist');
    var filter = null, cnt = null;
    if (ex.log) {
      var panel = el('div', 'art logpanel');
      panel.appendChild(el('div', 'art-label', esc(ex.log.label || 'LOG VIEWER')));
      filter = el('input', 'filterbox');
      filter.type = 'text';
      filter.placeholder = 'Filter lines (case-insensitive)\u2026';
      filter.setAttribute('aria-label', 'Filter log lines');
      panel.appendChild(filter);
      cnt = el('div', 'logcount muted small');
      panel.appendChild(cnt);
      panel.appendChild(list);
      body.appendChild(panel);
    } else {
      body.appendChild(list);
    }
    var btns = [];
    function buildBtns() {
      list.innerHTML = '';
      btns = [];
      (ex.log ? ex.log.lines : ex.spot.lines).forEach(function (ln, i) {
        var b = el('button', 'linebtn', hlLog(ln));
        b.type = 'button';
        b.dataset.i = String(i);
        b.addEventListener('click', function () {
          if (v.sel != null && btns[v.sel]) btns[v.sel].classList.remove('sel');
          v.sel = i;
          b.classList.add('sel');
        });
        btns.push(b);
        list.appendChild(b);
      });
      applyFilter(filter ? filter.value.trim() : '');
    }
    function applyFilter(f) {
      if (!filter) return;
      var f2 = f.toLowerCase();
      var shown = 0;
      btns.forEach(function (b, i) {
        var ln = (ex.log ? ex.log.lines : ex.spot.lines)[i];
        var match = !f2 || ln.toLowerCase().indexOf(f2) >= 0;
        b.classList.toggle('hidden', !match);
        if (match) shown++;
      });
      cnt.textContent = 'Showing ' + shown + ' of ' + btns.length + ' lines.';
    }
    if (filter) filter.addEventListener('input', function () { applyFilter(filter.value.trim()); });
    buildBtns();
    return function () {
      if (v.sel == null) return null;
      btns.forEach(function (b, i) {
        b.disabled = true;
        if (i === ex.spot.wrong) b.classList.add('ok');
        else if (i === v.sel) b.classList.add('bad');
      });
      return { ok: v.sel === ex.spot.wrong, detail: '' };
    };
  }

  /* ---------------- simulation (branching steps) ---------------- */
  function buildSim(ex, idx, fbwrap) {
    var v = S.views[idx];
    var box = el('div', 'simbox');
    var step = 0;
    var results = [];
    function renderStep() {
      box.innerHTML = '';
      var st = ex.sim.steps[step];
      if (!v.steps[step].optOrder) v.steps[step].optOrder = shuffle(seq(st.options.length));
      box.appendChild(el('div', 'steplab', 'STEP ' + (step + 1) + ' OF ' + ex.sim.steps.length));
      (st.blocks || []).forEach(function (a) { box.appendChild(artPanel(a)); });
      box.appendChild(questionBlock(st.question));
      var ab = el('div', 'blk blk-answer');
      ab.innerHTML = '<div class="blk-head static"><span class="tag">\u270E YOUR ANSWER</span></div>';
      var body = el('div', 'blk-body');
      ab.appendChild(body);
      var list = el('div', 'opts');
      var ord = v.steps[step].optOrder;
      var sel = null;
      ord.forEach(function (oi, d) {
        var b = optionRow(st.options[oi], d);
        b.addEventListener('click', function () {
          sel = oi;
          $all('.opt', list).forEach(function (o) { o.classList.remove('sel'); });
          b.classList.add('sel');
        });
        list.appendChild(b);
      });
      body.appendChild(list);
      var actions = el('div', 'actions');
      var sb = el('button', 'btn primary', step === ex.sim.steps.length - 1 ? 'Submit final step' : 'Submit step');
      sb.type = 'button';
      actions.appendChild(sb);
      ab.appendChild(actions);
      box.appendChild(ab);
      sb.addEventListener('click', function () {
        if (sel == null) { toast('Choose an answer for this step first.'); return; }
        sb.disabled = true;
        ab.classList.add('done');
        markChoice(list, ord, st.correct, sel);
        v.steps[step].sel = sel;
        v.steps[step].done = true;
        v.steps[step].ok = (sel === st.correct);
        results.push(v.steps[step].ok);
        var strip = el('div', 'stepfb ' + (v.steps[step].ok ? 'ok' : 'bad'));
        strip.innerHTML = '<h4>' + (v.steps[step].ok ? '\u2713 STEP CORRECT' : '\u2717 STEP INCORRECT') + '</h4><p>' +
          esc(v.steps[step].ok ? st.outcome_ok : st.outcome_no) + '</p>';
        var nb = el('button', 'btn next-btn', step === ex.sim.steps.length - 1 ? 'See exercise result' : 'Next step');
        nb.type = 'button';
        nb.addEventListener('click', function () {
          step += 1;
          if (step < ex.sim.steps.length) renderStep();
          else finish();
        });
        strip.appendChild(nb);
        box.appendChild(strip);
        scrollInto(strip);
      });
    }
    function finish() {
      var allOk = results.length === ex.sim.steps.length && results.every(Boolean);
      var detail = '<p><b>Step results:</b> ' + results.map(function (r, i) {
        return 'Step ' + (i + 1) + (r ? ' \u2713' : ' \u2717');
      }).join(' \u00B7 ') + '</p>';
      onSubmit(ex, idx, allOk, detail, fbwrap);
    }
    renderStep();
    return box;
  }

  /* ---------------- review pool ---------------- */
  function showReview() {
    S.phase = 'review';
    stage.innerHTML = '';
    var w = el('div', 'review');
    w.appendChild(el('h2', null, '\u26A0 Review skipped exercises'));
    w.appendChild(el('p', 'muted', 'You can answer every skipped exercise below, as many times as you need, until the timer ends. If you finish the exam without answering them, they are excluded from your score \u2014 they count neither for you nor against you.'));
    if (!S.skipped.length) {
      w.appendChild(el('p', null, 'No skipped exercises left. You can finish the exam.'));
    } else {
      var list = el('div', 'rev-list');
      S.skipped.slice().sort(function (a, b) { return S.order.indexOf(a) - S.order.indexOf(b); }).forEach(function (idx) {
        var ex = EX[idx];
        var row = el('div', 'rev-row');
        row.appendChild(el('div', 'rev-info', '<b>' + esc(ex.title) + '</b><br><span class="muted small">' + esc(ex.scenario.summary) + '</span>'));
        var b = el('button', 'btn', 'Answer');
        b.type = 'button';
        b.addEventListener('click', function () {
          S.phase = 'exam';
          renderExercise(idx, true);
        });
        row.appendChild(b);
        list.appendChild(row);
      });
      w.appendChild(list);
    }
    var fin = el('button', 'btn primary big', 'Finish exam');
    fin.type = 'button';
    fin.addEventListener('click', finishConfirm);
    w.appendChild(fin);
    stage.appendChild(w);
    updateHeader();
    window.scrollTo(0, 0);
  }

  function finishConfirm() {
    if (!S.skipped.length) { showResults(); return; }
    var ov = $('#modal');
    $('#modal-text').innerHTML = 'You still have <b>' + S.skipped.length + '</b> skipped exercise(s) without an answer. They will be marked \u201C\u26A0 Not answered \u2014 excluded from score\u201D and will not count in your result. Finish anyway?';
    ov.hidden = false;
    $('#modal-yes').onclick = function () { ov.hidden = true; showResults(); };
    $('#modal-no').onclick = function () { ov.hidden = true; };
  }

  /* ---------------- results ---------------- */
  function showResults() {
    S.phase = 'results';
    if (S.timerId) clearInterval(S.timerId);
    $('#pause-ov').hidden = true;
    var answeredIdx = Object.keys(S.answered).map(Number);
    var answered = answeredIdx.length;
    var correct = S.correctCount;
    var hints = Object.keys(S.hintUsed).length;
    var percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;
    var passed = answered > 0 && percent >= META.passMark;

    stage.innerHTML = '';
    var w = el('div', 'results');
    var head = el('h2', null, 'Final results \u2014 ' + esc(META.title));
    w.appendChild(head);
    var big = el('div', 'score-big', '<span id="bigpct">0</span><span class="pctsign">%</span>');
    w.appendChild(big);
    var chips = el('div', 'chiprow');
    chips.innerHTML =
      '<span class="chip ok">\u2713 Correct: ' + correct + '</span>' +
      '<span class="chip bad">\u2717 Incorrect: ' + (answered - correct) + '</span>' +
      '<span class="chip warn">\u26A0 Skipped, not answered (excluded): ' + S.skipped.length + '</span>' +
      '<span class="chip">Hints used: ' + hints + '</span>' +
      '<span class="chip">Points: ' + S.earned + ' / ' + S.possible + '</span>' +
      '<span class="chip">Pass mark: ' + META.passMark + '%</span>';
    w.appendChild(chips);

    var verdict = el('div', passed ? 'cert pass' : 'cert fail');
    if (passed) {
      verdict.innerHTML = '<div class="cert-head">\u2713 PASS \u2014 Certificate of completion</div>' +
        '<p>This certifies that <b>' + esc(S.user || 'the candidate') + '</b> passed the <b>' + esc(META.title) + '</b> practice exam with <b>' + percent + '%</b>.</p>' +
        '<p class="muted">Topic: MITRE ATT&amp;CK ' + esc(String(META.topicId).toUpperCase()) + ' \u00B7 Data Backup \u00B7 Tier ' + META.batch + ' of 4 \u00B7 Date: ' + new Date().toISOString().slice(0, 10) + '</p>';
    } else {
      verdict.innerHTML = '<div class="cert-head">\u2717 FAIL \u2014 ' + percent + '% (pass mark ' + META.passMark + '%)</div>' +
        '<p>You must retake the exam to pass this tier. Review the report below, then press <b>Retake exam</b> \u2014 questions and answer choices will be shuffled again.</p>';
    }
    w.appendChild(verdict);

    var themes = {};
    answeredIdx.forEach(function (i) {
      var th = EX[i].theme || 'General';
      themes[th] = themes[th] || { a: 0, c: 0 };
      themes[th].a++;
      if (S.answered[i].ok) themes[th].c++;
    });
    var trow = el('div', 'themes');
    Object.keys(themes).forEach(function (t) {
      trow.appendChild(el('span', 'chip theme', esc(t) + ': ' + themes[t].c + '/' + themes[t].a));
    });
    w.appendChild(trow);

    var rep = el('div', 'report');
    rep.appendChild(el('h3', null, 'Detailed report'));
    S.order.forEach(function (idx) {
      var ex = EX[idx];
      var st = S.answered[idx];
      var item = el('details', 'rep-item');
      var mark = st ? (st.ok ? '\u2713' : '\u2717') : '\u26A0';
      var cls = st ? (st.ok ? 'ok' : 'bad') : 'skip';
      item.innerHTML = '<summary class="' + cls + '"><span class="mark">' + mark + '</span> ' + esc(ex.title) +
        (st ? '' : ' \u2014 <span class="muted">Not answered \u2014 excluded from score</span>') + '</summary>' +
        '<div class="rep-body"><p><b>Correct answer:</b> ' + esc(ex.ansline) + '</p><p>' + esc(ex.explain) + '</p>' +
        (st && !st.ok ? '<p class="fb-study"><b>What to study:</b> ' + esc(ex.study) + '</p>' : '') + '</div>';
      rep.appendChild(item);
    });
    w.appendChild(rep);

    var ret = el('button', 'btn primary big', '\u21BA Retake exam');
    ret.type = 'button';
    ret.addEventListener('click', startExam);
    w.appendChild(ret);

    stage.appendChild(w);
    updateHeader();
    window.scrollTo(0, 0);

    var bigpct = $('#bigpct', w);
    if (REDUCE || percent === 0) {
      bigpct.textContent = String(percent);
      fireReport(correct, answered, percent);
    } else {
      var cur = 0;
      var step = Math.max(1, Math.ceil(percent / 40));
      var iv = setInterval(function () {
        cur += step;
        if (cur >= percent) {
          cur = percent;
          clearInterval(iv);
          bigpct.textContent = String(cur);
          fireReport(correct, answered, percent);
        } else {
          bigpct.textContent = String(cur);
        }
      }, 25);
    }
  }

  function fireReport(correct, total, percent) {
    if (S.reported) return;
    S.reported = true;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: correct,
        total: total,
        percent: percent,
        passed: percent >= META.passMark
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  /* ---------------- init ---------------- */
  function init() {
    stage = $('#stage');
    $('#h-pause').addEventListener('click', togglePause);
    $('#pause-resume').addEventListener('click', togglePause);
    $('#h-hint').addEventListener('click', useHint);
    $('#h-skip').addEventListener('click', skipCurrent);
    window.addEventListener('message', function (ev) {
      if (!ev.data || (ev.data.type !== 'CYBERPULSE_INIT' && ev.data.type !== 'CYBERMASTERY_INIT')) return;
      if (!S) S = newState();
      if (ev.data.username) S.user = String(ev.data.username);
      if (ev.data.country) S.country = String(ev.data.country);
      var u = $('#h-user');
      if (u) u.textContent = S.user ? ('\u00B7 ' + S.user) : '';
    });
    S = newState();
    showIntro();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
