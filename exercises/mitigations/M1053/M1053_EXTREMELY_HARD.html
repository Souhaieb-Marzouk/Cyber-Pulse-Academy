<script>
window.CM_EXAM = {"meta": {"topicId": "m1053", "batch": 4, "title": "M1053 Data Backup — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 55, "passMark": 70}, "minutes": 55, "sevLabel": "EXTREMELY HARD", "sevCls": "sev-extreme", "introHtml": "\n<h1>M1053 &middot; Data Backup &mdash; EXTREMELY HARD practice exam</h1>\n<div class=\"chiprow\">\n<span class=\"chip sev sev-extremely-hard\">◆ EXTREMELY HARD</span>\n<span class=\"chip\">15 exercises</span>\n<span class=\"chip\">~55 minutes</span>\n<span class=\"chip\">Pass mark 70%</span>\n<span class=\"chip\">Hint −10%</span>\n<span class=\"chip\">Tier 4 of 4</span>\n</div>\n\n<div class=\"intro-card\">\n<h2>What is M1053? (read this before you start)</h2>\n<p>M1053 is called <b>Data Backup</b>. It is a <b>Mitigation</b> in the MITRE ATT&amp;CK framework. A mitigation is a defensive control: something a company can build or do to stop an attack, or to make an attack hurt less. M1053 does not describe an attacker's action. It describes what defenders should do: take copies of important data and keep those copies safe.</p>\n<p>Why does it matter? Some attackers destroy data (T1485 &middot; Data Destruction), some encrypt data and ask for money (T1486 &middot; Data Encrypted for Impact), some wipe whole disks (T1561 &middot; Disk Wipe), some delete your rescue options such as shadow copies (T1490 &middot; Inhibit System Recovery), and some replace your pages with their own text (T1491 &middot; Defacement). M1053 is the safety net for all of these: if the attacker hits your data, a good backup lets you put it back.</p>\n<p>The ATT&amp;CK page for M1053 asks for five things. <b>1) Regular backups:</b> daily incremental copies and weekly full copies of critical systems. <b>2) Immutability:</b> storage nobody can change or delete (WORM &mdash; write once, read many). <b>3) Encryption:</b> strong encryption (for example AES-256) for backups at rest and in transit. <b>4) Offsite copies:</b> a copy in the cloud or at another physical site. <b>5) Testing:</b> regular restore drills, so you know the backups really work. It also says to harden the backup systems and to keep backups isolated from the corporate network, so an attacker inside the network cannot reach and destroy them.</p>\n<p><b>Where you will meet M1053 at work:</b> SOC analysts see backup alerts every day (failed jobs, deleted jobs, deleted shadow copies) and must understand why they matter. Incident responders restore from backups and must pick a copy the attacker cannot have touched. Backup engineers and administrators build M1053 for a living: schedules, repositories, immutability, encryption, isolation and restore tests. GRC analysts and control owners audit it &mdash; NIST CSF (PR.DS-11), CIS Control 11 (Data Recovery) and ISO/IEC 27001 (A.8.13) all ask for backups that are created, protected and tested. Threat-intel analysts and threat hunters map ransomware and wiper behaviour to this mitigation when they advise the business. Red teamers test it: &ldquo;with one stolen account, can we delete every copy?&rdquo;</p>\n</div>\n\n<div class=\"intro-card\">\n<h2>How this exam works</h2>\n<ul>\n<li><b>Goal:</b> master the M1053 (Data Backup) mitigation at this level. Pass mark: <b>70%</b>, calculated over the exercises you actually answer. This is the EXTREMELY HARD tier: senior-level decisions that chain several concepts, with conflicting signals, realistic noise, and incomplete information. At least one answer is “do nothing yet — gather more evidence”, and at least one right answer costs the business something.</li>\n<li><b>Exercise types:</b> scenario triage, log analysis with a filter box, drag &amp; drop, matching, ordering and ranking, fill-in-the-blank, spot-the-mistake, and branching simulations. Because M1053 is a policy and architecture mitigation, there are no shell/terminal exercises.</li>\n<li><b>Timer:</b> 55 minutes for the whole exam. You can <b>pause</b> it — while paused, the exercise content is hidden. When the timer ends, unanswered exercises are excluded from the score.</li>\n<li><b>Skipping:</b> every exercise has a Skip button. Skipped exercises move to a review pool. Before you finish, you can return to them and answer them, as many times as you need, until the timer ends. If you finish without answering them, they are excluded from the score (they count neither for nor against you).</li>\n<li><b>Hints:</b> one hint per exercise. A hint costs <b>−10% of that exercise's points</b> and gives a nudge, never the answer.</li>\n<li><b>Retake:</b> if you fail, you can retake the exam — questions and answer choices are shuffled again.</li>\n</ul>\n</div>\n<div class=\"intro-card\">\n<h2>Keywords covered</h2>\n<p class=\"muted\">Every exercise you are about to take is built from these themes and keywords.</p>\n<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Mitigation identity &amp; scope</h3><div class=\"chiprow\"><span class=\"chip\">M1053</span><span class=\"chip\">Data Backup</span><span class=\"chip\">Mitigation</span><span class=\"chip\">Enterprise domain</span><span class=\"chip\">Impact (TA0040)</span></div></div><div class=\"theme-card\"><h3>Techniques addressed</h3><div class=\"chiprow\"><span class=\"chip\">T1485</span><span class=\"chip\">T1485.001</span><span class=\"chip\">T1486</span><span class=\"chip\">T1490</span><span class=\"chip\">T1491</span><span class=\"chip\">T1491.001</span><span class=\"chip\">T1491.002</span><span class=\"chip\">T1561</span><span class=\"chip\">T1561.001</span><span class=\"chip\">T1561.002</span></div></div><div class=\"theme-card\"><h3>Implementation measures</h3><div class=\"chiprow\"><span class=\"chip\">daily incremental + weekly full</span><span class=\"chip\">immutable (WORM)</span><span class=\"chip\">AES-256 encryption</span><span class=\"chip\">offsite storage</span><span class=\"chip\">restore testing</span><span class=\"chip\">hardening</span><span class=\"chip\">network isolation</span></div></div><div class=\"theme-card\"><h3>Control design &amp; trade-offs</h3><div class=\"chiprow\"><span class=\"chip\">corrective</span><span class=\"chip\">preventive</span><span class=\"chip\">detective</span><span class=\"chip\">RPO</span><span class=\"chip\">RTO</span><span class=\"chip\">3-2-1 rule</span><span class=\"chip\">shadow copies vs backups</span><span class=\"chip\">what backups cannot fix</span></div></div><div class=\"theme-card\"><h3>Framework mappings</h3><div class=\"chiprow\"><span class=\"chip\">NIST CSF PR.DS-11</span><span class=\"chip\">CIS Control 11 (11.1–11.4)</span><span class=\"chip\">ISO 27001 A.8.13</span><span class=\"chip\">audit evidence</span></div></div><div class=\"theme-card\"><h3>Real-world use</h3><div class=\"chiprow\"><span class=\"chip\">SOC backup alerts</span><span class=\"chip\">IR restore decisions</span><span class=\"chip\">backup consoles</span><span class=\"chip\">ransomware</span><span class=\"chip\">wipers</span><span class=\"chip\">defacement</span><span class=\"chip\">control audits</span></div></div></div>\n</div>\n<button id=\"start-btn\" class=\"btn primary big\">▶ Start the exam</button>\n", "exercises": [{"id": "X01", "type": "sim", "theme": "Real-world use", "title": "Night 3 — the CISO needs a decision", "scenario": {"summary": "Conflicting signals, five calls, ten minutes", "blocks": [{"label": "ARTEFACT 1 — CISO chat (23:40)", "text": "“Board call at 23:55. I need your one-line position: are we restoring tonight, from what, and what do we tell the insurer?”"}, {"label": "ARTEFACT 2 — SIEM", "mono": true, "text": "02:33 bkp01 job deletions by svc_backup from WS-4471 (matches CHG-2211, storage migration, approved by infra lead)\n03:11 MFA push for svc_backup approved — geo: country X (impossible travel; owner on approved leave)\n03:12 catalog export 4.2 GB → 10[.]66[.]4[.]31 (unknown network)"}, {"label": "ARTEFACT 3 — DR status", "mono": true, "text": "immutable offsite copy: present, object-lock COMPLIANCE 14d\nlast VERIFY-RESTORE: 7 months ago (policy: quarterly — lapsed)\nesxi snapshots: replicated off-host nightly (script output verified this morning)"}, {"label": "ARTEFACT 4 — insurer email (23:10)", "text": "“To process the claim we need attestation that backup isolation requirements were met at incident time.”"}, {"label": "NOISE — monitored channels (tonight)", "mono": true, "text": "printer queue errors ×14; spam quarantined ×212; badge reader on floor 3 offline"}]}, "question": "Own the five calls in order.", "sim": {"steps": [{"question": "Which signal wins for the backup chain?", "options": ["Compromise wins: the ticket explains the deletions, but nothing explains the MFA approval and the export", "The change ticket wins: CHG-2211 explains every event we saw tonight", "No conclusion about the backup chain is possible from tonight's events"], "correct": 0, "outcome_ok": "CHG-2211 covers the deletions but not the 03:11 approval or the 03:12 export. The strongest unexplained signal drives the position: assume compromise.", "outcome_no": "A ticket explaining deletions cannot explain an impossible-travel approval or a 4.2 GB export. Weigh signals by what they leave unexplained."}, {"question": "Can you declare the immutable copy trustworthy for tonight's restore?", "options": ["Not yet: run a short verification restore first — object-lock blocks change, not corruption or staleness", "Yes: object-lock COMPLIANCE mode guarantees integrity and freshness", "No, and never: a copy older than a month is useless to us anyway"], "correct": 0, "outcome_ok": "You gate the restore on a short verification window — honest about the lapsed quarterly test without discarding the copy.", "outcome_no": "Object-lock stops deletion and change; it says nothing about restorability or freshness. And a 7-month-old test gap is a reason to verify, not a reason to give up."}, {"question": "The COO demands an immediate restore to production to hit the RTO; legal wants evidence kept. Which action?", "options": ["Restore tier-1 into an isolated VLAN from the verified copy — accept the added hours", "Restore straight to production now to hit the tier-1 RTO", "Wipe and rebuild everything first, ask questions later"], "correct": 0, "outcome_ok": "The isolated-VLAN path meets the spirit of both demands: recovery proceeds, evidence survives, and the extra hours are a cost you accept consciously.", "outcome_no": "Straight-to-production risks restoring into an active attacker's path and destroys volatile evidence; wipe-first destroys evidence and wastes the recovery window."}, {"question": "What do you tell the insurer tonight?", "options": ["We cannot yet attest isolation held at incident time; preliminary findings follow in 10 business days", "We attest that full isolation was in place at the time of the incident", "We attest isolation failed completely and the claim is void today"], "correct": 0, "outcome_ok": "Honest, evidence-bounded, time-boxed: the only attestation the evidence supports tonight — and the one that survives scrutiny.", "outcome_no": "Attesting “full isolation” against tonight's evidence is a misstatement with legal exposure; declaring “failed completely” concedes the claim without evidence."}, {"question": "What made the difference for survivability tonight?", "options": ["The immutable offsite copy and the discipline to verify first", "The EDR platform that stopped the ransomware payload", "The change-management ticket process we followed", "The printer maintenance window last night"], "correct": 0, "outcome_ok": "EDR bought time, but the copy that could not be reached — and the verification that made it usable — is what makes recovery possible at all.", "outcome_no": "EDR missed the staging activity; the ticket explained (partly) the attacker's cover, not your defence; printers are noise."}]}, "hint": "Weigh each signal by what it leaves unexplained, and remember what object-lock does and does not promise.", "ansline": "Compromise wins → verify before trusting the immutable copy → isolated-VLAN restore accepting delay → honest time-boxed attestation → the verified isolated copy made the difference.", "explain": "Senior IR work is deciding which signal wins, what you may claim, and which costs you accept. Tonight: the export outranks the ticket; the lapsed test forces verification; the isolated VLAN buys both safety and evidence; the insurer gets truth with a date. That is M1053 operating at board level.", "study": "Evidence weighting; attestation language; DR decision records."}, {"id": "X02", "type": "mc", "theme": "Real-world use", "title": "The board statement", "scenario": {"summary": "Five artefacts, noise included, one honest sentence", "blocks": [{"label": "ARTEFACT 1 — backup log (tonight)", "mono": true, "text": "01:10 verification restore of immutable copy: PASS (FS tier-1 sample)\n01:55 tier-1 restore into VLAN-ISO: 60% complete"}, {"label": "ARTEFACT 2 — SIEM query", "mono": true, "text": "encryption events: 3 hosts (contained)\nstaging events: catalog export confirmed to 10[.]66[.]4[.]31\nEDR: no new encryption events in the last 90 minutes"}, {"label": "ARTEFACT 3 — exec chat (23:58)", "text": "CEO: “Tell the board we are fully recovered.”\nCOO: “Tell them Friday.”\nCFO: “Tell them what is true.”"}, {"label": "ARTEFACT 4 — DR sheet", "mono": true, "text": "tier-1 RTO: 9h (on track)\ntier-2 restore points: UNKNOWN — job history incomplete for 2 systems"}, {"label": "ARTEFACT 5 — SLA extract", "text": "Customer SLA: material incident notice within 24 hours of confirmation."}, {"label": "NOISE — service desk (tonight)", "mono": true, "text": "password resets ×31; WiFi flaps on floor 2; projector HDMI fault"}]}, "question": "Which board statement is defensible with tonight's evidence?", "mc": {"options": ["Restore underway from tonight's verified copy; tier-2 scope being confirmed; update in 2 hours", "Every system in the estate is now fully recovered and online", "The attacker has been confirmed removed from the environment", "No data left the network, so no notifications are needed yet"], "correct": 0}, "hint": "Two claims in the wrong options go beyond the evidence; one hides a confirmed fact.", "ansline": "The staged, honest status with a committed follow-up time.", "explain": "The evidence supports: verification passed, restore in progress, containment holding, scope partially unknown. It does not support “fully recovered” (60%), “attacker removed” (never confirmed), or “no data taken” (the export says otherwise). Senior reporting states what is known, what is unknown, and when the next update lands — the CFO's instinct is the professional one.", "study": "Executive communication during incidents; evidence-bounded claims."}, {"id": "X03", "type": "mc", "theme": "Control design & trade-offs", "title": "When the best practice is the wrong move", "scenario": {"summary": "Mandatory sync vs an active attacker on the gateway", "blocks": [{"label": "ARTEFACT 1 — policy", "text": "Backup Policy §4.2: “Nightly full sync to the offsite repository is mandatory. No gaps are permitted.”"}, {"label": "ARTEFACT 2 — IR channel (01:20)", "mono": true, "text": "attacker actively probing the backup gateway\nsigns of a catalog exfiltration attempt in progress\ndetonation expected within hours"}, {"label": "ARTEFACT 3 — architecture", "mono": true, "text": "offsite repo: reachable only via the backup gateway\nlast completed sync: 22:40 (clean)\noffline copy: sealed tapes, 3 days old, verified"}]}, "question": "Policy §4.2 is best practice in peacetime. What is right tonight?", "mc": {"options": ["Pause outbound replication, preserve the clean 22:40 copy, decide after containment", "Increase the sync frequency so a clean copy lands faster tonight", "Keep the backup gateway open so tonight's sync runs at full speed", "Delete the backup catalog now so the attacker cannot steal it"], "correct": 0}, "hint": "What else travels on a sync channel that an attacker is already probing — and what would deleting the catalog cost you?", "ansline": "Pause replication, preserve the clean copy, decide after containment.", "explain": "A syncing channel can leak the catalog and may carry a poisoned payload both ways; “no gaps” is a peacetime rule. Pausing keeps the last clean copy intact, and the tapes stay as the verified fallback. Deleting the catalog would destroy your own evidence and inventory — which is what T1490 wants. Writing the deviation into the decision record is what makes the pause defensible tomorrow.", "study": "Backup gateway hardening; policy exceptions under incident conditions."}, {"id": "X04", "type": "dnd", "theme": "Techniques addressed", "title": "Find the uncovered techniques", "scenario": {"summary": "Matrix excerpt vs four controls", "blocks": [{"label": "ARTEFACT 1 — Impact matrix excerpt", "mono": true, "text": "T1485 Data Destruction\nT1486 Data Encrypted for Impact\nT1489 Service Stop\nT1490 Inhibit System Recovery\nT1491.002 External Defacement\nT1561 Disk Wipe"}, {"label": "ARTEFACT 2 — controls in place", "mono": true, "text": "EDR with ransomware canaries (endpoints)\nM1053: immutable offsite backups of internal servers + quarterly drills\nMFA on the backup console\nbackup scope: internal servers only"}]}, "question": "Drag each technique to the box that matches the CURRENT controls.", "dnd": {"bank": ["T1485 Data Destruction", "T1486 Data Encrypted for Impact", "T1490 Inhibit System Recovery", "T1561 Disk Wipe", "T1489 Service Stop", "T1491.002 External Defacement"], "zones": [{"label": "Covered by current controls", "accept": [0, 1, 2, 3]}, {"label": "Gap — needs a new control", "accept": [4, 5]}]}, "hint": "Backups restore data on systems in scope. Two techniques do something backups cannot undo.", "ansline": "Gaps: T1489 (backups restore data, they do not keep services running) and T1491.002 (the public site is outside backup scope).", "explain": "Chain reasoning: T1485, T1486, T1490 and T1561 end with damaged data or recovery paths on systems inside backup scope, so M1053 covers their recovery. Service Stop leaves healthy disks but stopped services — no restore needed, availability engineering needed instead. External defacement hits a third-party site your backups never touch. The next control to buy is decided by exactly this kind of gap analysis.", "study": "Coverage-gap analysis across the Impact tactic."}, {"id": "X05", "type": "sim", "theme": "Real-world use", "title": "Restore now — or preserve first?", "scenario": {"summary": "Downtime cost vs a legal hold", "blocks": [{"label": "ARTEFACT 1 — legal notice", "text": "Regulator matter: preserve all system state related to the affected hosts. Do not alter or destroy potential evidence."}, {"label": "ARTEFACT 2 — finance", "text": "COO: “Every hour of downtime on tier-1 costs ~400k. Restore everything now.”"}, {"label": "ARTEFACT 3 — status", "mono": true, "text": "encryption ongoing on 3 of 40 hosts (EDR containing)\nimmutable copy: verified 40 minutes ago\nno snapshots taken yet of the 3 hosts"}]}, "question": "Make the three calls in order.", "sim": {"steps": [{"question": "Do you mass-restore all 40 hosts right now?", "options": ["No — contain the 3 active hosts first; a mass restore now risks re-encryption", "Yes — restore everything immediately to cut the downtime", "Yes, but only the 3 affected hosts this time around"], "correct": 0, "outcome_ok": "Containment first is what stops the attacker from riding a mass restore back into fresh systems; the 37 clean hosts keep serving.", "outcome_no": "A mass restore into an unevicted environment is how re-encryption incidents happen; “only the 3” skips the real question: evidence on those 3."}, {"question": "Which action accepts a real cost for a defensible reason?", "options": ["Image the 3 hosts (adds hours to their recovery) before wiping and restoring them", "Wipe the 3 hosts immediately to save the tier-1 RTO", "Skip imaging — the EDR console already holds enough evidence"], "correct": 0, "outcome_ok": "You accept extra hours of downtime on 3 hosts to preserve regulator-demanded evidence — a cost chosen consciously and documented.", "outcome_no": "Wiping first breaches the legal hold and is irreversible; the EDR console misses disk-level artefacts the regulator may require."}, {"question": "What makes this decision trail survive review?", "options": ["A written record: who accepted the cost, why, and under which legal constraint", "An informal chat message in the ops channel thread", "Nothing at all — decisions during incidents need no record"], "correct": 0, "outcome_ok": "The record converts a costly judgement call into an auditable decision — exactly what the regulator and the board will read afterwards.", "outcome_no": "Unrecorded decisions look improvised in hindsight; a chat message lacks the sign-off weight the cost demands."}]}, "hint": "One option is fast but irreversible; one is slower but defensible; the third confuses console alerts with evidence.", "ansline": "No mass restore → image before wipe (accept the cost) → written decision record with sign-off.", "explain": "This is the senior trade: hours of downtime bought for evidence that survives legal scrutiny. The M1053 machinery (a verified copy) is what makes a staged, evidence-first restore affordable at all. Documenting the accepted cost is part of the control, not paperwork theatre.", "study": "Legal hold vs recovery pressure; decision records."}, {"id": "X06", "type": "dnd", "theme": "Real-world use", "title": "Three lines change tonight's plan", "scenario": {"summary": "Ten log lines, three decisive", "blocks": [{"label": "Backstory", "text": "03:00 — you are the on-call senior analyst. Everything below arrived in one burst. Mark what actually changes tonight's plan."}]}, "question": "Drag each line to the correct box.", "dnd": {"bank": ["03:12 svc_backup downloaded full catalog (4.2 GB) from WS-4471 to 10[.]66[.]4[.]31", "03:04 vssadmin delete shadows /all on db-02", "03:22 repo policy changed: object-lock disabled on bucket 'archive'", "03:31 DHCP lease renewed for WS-118 (normal)", "03:05 w32time sync OK on db-02", "03:33 printer queue cleared on PR-FLOOR2", "03:12 outlook: 4 quarantined phishing mails deleted", "03:40 defrag scheduled task started on WS-220", "03:45 WiFi roaming event WS-130 floor 2 → 3", "03:50 clipboard service restarted on WS-099"], "zones": [{"label": "Decisive — changes tonight's plan", "accept": [0, 1, 2]}, {"label": "Context noise", "accept": [3, 4, 5, 6, 7, 8, 9]}]}, "hint": "One steals a map, one kills local recovery, one disarms your safest copy. The rest is Monday.", "ansline": "Decisive: the catalog export (staging), the shadow deletion on db-02 (T1490), and object-lock disabled (protection removed).", "explain": "Each decisive line maps to a different consequence: exfiltration staging, recovery inhibition, and the removal of immutability — together they tell you the attacker's plan and which copies remain trustworthy. The other seven are the noise every senior analyst reads past at 03:00.", "study": "Triage under noise; mapping events to attacker intent."}, {"id": "X07", "type": "mc", "theme": "Frameworks", "title": "The insurer's isolation question", "scenario": {"summary": "Attest with incomplete audits and a deadline", "blocks": [{"label": "ARTEFACT 1 — policy clause", "text": "“Coverage warrants that recovery data was maintained in an isolated instance at the time of the incident.”"}, {"label": "ARTEFACT 2 — evidence available now", "mono": true, "text": "backup admin account was synced to the domain 30 days before the incident\nconsole audit logs: 4 of 12 months retained\nnetwork diagrams: last updated 14 months ago\nimmutable offsite copy: present, verified at incident time"}, {"label": "ARTEFACT 3 — clock", "text": "Claim deadline: response required within 5 business days. Forensic review completes in ~3 weeks."}]}, "question": "Which answer to the insurer is honest and defensible today?", "mc": {"options": ["We cannot yet attest isolation held; a time-boxed review is underway, findings in 10 days", "We attest that full isolation was verified and in place at incident time", "We attest nothing at all and let the deadline pass in silence today", "We attest isolation failed completely; please deny the whole claim"], "correct": 0}, "hint": "What can the retained evidence actually prove — and what does the deadline really require?", "ansline": "The honest, time-boxed “cannot yet attest” response with a review date.", "explain": "The evidence shows isolation was partial (a domain-synced admin account, incomplete audits), so “fully in place” would be a misstatement and “failed completely” concedes without proof. The deadline requires a response, not a confession or a fairy tale. Attesting only what evidence supports, with dates, is the standard that protects the claim and the company.", "study": "Control attestation under incomplete evidence."}, {"id": "X08", "type": "order", "theme": "Control design & trade-offs", "title": "Order the recovery decision chain", "scenario": {"summary": "Six calls with unknown restore points", "blocks": [{"label": "Starting state", "mono": true, "text": "attacker contained, not evicted\nimmutable copy: present, verification UNKNOWN for 2 systems\ntier-1 RTO: 9h; tier-2 RPO: unknown\nlegal: evidence preservation notice active\nboard: expects a plan within the hour"}]}, "question": "Order the six decision steps from first to last.", "order": {"items": ["Freeze the online backup chain to preserve its state", "Run offline verification restores for the immutable copy", "Scope each system: restorable, to which point, at what data loss", "Restore tier-1 by RTO order into an isolated VLAN", "Reconcile actual data loss against RPO and document exceptions", "Brief the board with the verified plan and known gaps"], "correct": [0, 1, 2, 3, 4, 5]}, "hint": "Nothing honest reaches the board before something is verified.", "ansline": "Freeze → verify → scope → restore tier-1 isolated → reconcile RPO exceptions → brief the board.", "explain": "Freezing preserves evidence before anything moves. Verification turns “present” into “usable”. Scoping converts unknowns into per-system decisions. The isolated restore protects against a non-evicted attacker. Reconciling data loss against RPO is where exceptions get documented honestly — which is exactly what makes the board briefing credible instead of hopeful.", "study": "DR decision sequencing under uncertainty."}, {"id": "X09", "type": "match", "theme": "Real-world use", "title": "Resolve the four conflicting demands", "scenario": {"summary": "Stakeholders vs defensible moves", "blocks": [{"label": "The demands", "mono": true, "text": "CISO: 'No more downtime than strictly needed — and no shortcuts that burn us.'\nLegal: 'Preserve everything; the regulator is watching.'\nOps: 'Backup traffic is slowing production batches.'\nInsurer: 'Prove isolation at incident time or the claim stalls.'"}]}, "question": "Match each demand to the resolution a senior owner would defend.", "match": {"pairs": [["CISO: minimise downtime without shortcuts", "Stage restores in an isolated VLAN; cut over to production only after validation"], ["Legal: preserve all evidence", "Forensic images before rebuilds; frozen chain of custody for images and logs"], ["Ops: backup traffic slows production", "Move backup traffic to a dedicated network path and maintenance window"], ["Insurer: prove isolation at incident time", "Provide a time-bound evidence review; attest only what the retained evidence shows"]]}, "hint": "Each resolution trades a little of one thing (time, money, speed) to protect something bigger.", "ansline": "Staged isolated restore; image-and-freeze; dedicated backup path; evidence-bounded attestation.", "explain": "Senior work is matching each demand to the move that serves it without breaking the others: staged restores protect both uptime and cleanliness; imaging protects legal; a dedicated path protects production and the backup window; evidence-bounded attestation protects the claim. Saying yes to everyone in words, and no one in evidence, is how incidents get worse.", "study": "Stakeholder management in incident response."}, {"id": "X10", "type": "spot", "theme": "Policy & measures", "title": "The runbook line that lies to you", "scenario": {"summary": "Eight lines, one false comfort", "blocks": [{"label": "DR runbook RB-11 (review draft)", "text": "A consultant is reviewing runbook RB-11 below. One line gives false comfort during an incident. Click it."}]}, "question": "Click the line that gives false comfort during an incident.", "spot": {"lines": ["1. scope: tier-1 finance + DC, tier-2 everything else", "2. RTO 9h tier-1; RPO 15m tier-1", "3. copies: immutable 14d + sealed monthly tapes", "4. verification: 'a backup is verified when its job reports success'", "5. escalation: on-call DR lead, then CISO", "6. restore order: by RTO tier", "7. contacts: vendor hotline, telco, cloud support", "8. review cadence: annually"], "wrong": 3}, "hint": "Job success means the job ran. What is the only proof that a backup works?", "ansline": "Line 4 — “verified when its job reports success” confuses job success with restorability.", "explain": "A job can run to completion on a corrupted source, an exhausted target, or a misconfigured agent — success is not restorability. The only verification that matters is a restore, which is what M1053's Backup Testing measure means. The annual review cadence (line 8) is weak but visible; the false definition in line 4 hides until the worst night of the year.", "study": "Backup verification vs job monitoring."}, {"id": "X11", "type": "mc", "theme": "Frameworks", "title": "The one number for the board", "scenario": {"summary": "Which metric proves recovery?", "blocks": [{"label": "Board prep", "text": "Post-incident review. The chair asks: “Give us one number that proves we can recover. Not a dashboard — one number.”"}]}, "question": "Which number best proves recovery capability?", "mc": {"options": ["The date and duration of the last end-to-end restore drill, per tier, against its RTO", "The backup job success rate across the last 90 days of jobs", "The total number of terabytes currently under backup protection", "The number of backup licenses purchased in the last budget year"], "correct": 0}, "hint": "Which of these cannot be true while restores are broken?", "ansline": "Last verified end-to-end restore per tier, measured against RTO.", "explain": "Job success rates measure the machine, not the outcome; terabytes and licenses measure spending. A dated, tiered restore drill against RTO is the only number that cannot be green while recovery is broken — it is M1053's testing measure compressed into one board-ready fact.", "study": "Metrics that prove control effectiveness."}, {"id": "X12", "type": "sim", "theme": "Real-world use", "title": "The phone that approved at 03:11", "scenario": {"summary": "A person, a device, a decision", "blocks": [{"label": "ARTEFACT 1 — MFA log", "mono": true, "text": "03:11 push approved — svc_backup, registered phone (device check: passed)\n03:11 geo: country X — owner is mid-flight over country Y (flight radar confirmed)"}, {"label": "ARTEFACT 2 — people", "mono": true, "text": "backup admin: on approved leave, unreachable by policy during travel\nbadge: no office activity this week\nmanager: 'she would never approve at 3am'"}, {"label": "ARTEFACT 3 — device posture", "mono": true, "text": "registered phone: last seen on corp WiFi 9 days ago\nMDR: 2 failed MFA pushes for the same account at 03:09 (fatigue pattern)"}]}, "question": "Three calls, in order.", "sim": {"steps": [{"question": "Which statement about the approval wins?", "options": ["Context wins: failed pushes then an approval is a fatigue pattern — the account is compromised", "The passing device check proves that the owner approved it herself", "The manager's trust in the admin settles the question for tonight"], "correct": 0, "outcome_ok": "MFA fatigue (2 denials then an approve) plus impossible geography outranks a passing device check, which only says the phone is genuine — not that its owner tapped it.", "outcome_no": "A genuine phone can be a sleeping tool in a fatigue attack; trust in a person is not evidence about a 03:11 tap."}, {"question": "How do you treat the admin herself?", "options": ["Investigate the account and the device; involve HR through proper channels; no accusations", "Announce in the ops channel that she caused the whole incident", "Suspend her employment immediately, without any investigation first"], "correct": 0, "outcome_ok": "You defend the company without prejudging a person who is probably a victim of account theft — the standard that keeps investigations clean and fair.", "outcome_no": "Public blame and abrupt suspension harm a likely victim, chill future cooperation, and can create legal exposure for you."}, {"question": "What does this mean for the backup chain tonight?", "options": ["Freeze the online chain and verify the immutable copy before any restore", "Continue as normal — the MFA device check passed cleanly", "Rotate only the admin's password and then move on"], "correct": 0, "outcome_ok": "The chain is frozen as untrusted; the verified immutable copy carries the restores. A password change alone leaves sessions, tokens and the catalog export unaddressed.", "outcome_no": "The approval event plus the earlier export make the online chain untrusted; a password rotation is the smallest possible response to a much larger signal."}]}, "hint": "Separate three questions: what did the device prove, what does the person deserve, what does the chain now deserve.", "ansline": "Fatigue compromise assumed → investigate account/device via HR, no blame → freeze the online chain, restore only from the verified immutable copy.", "explain": "The senior move is holding three truths at once: the account is compromised, the person is probably innocent, and the chain is untrusted until verified. Each gets its own treatment. This is the human side of M1053: the control survives because the people running it follow evidence, not emotions.", "study": "MFA fatigue; fair investigation practice; chain trust decisions."}, {"id": "X13", "type": "dnd", "theme": "Techniques addressed", "title": "Name the technique behind each behaviour", "scenario": {"summary": "Five behaviours, five precise slots", "blocks": [{"label": "Late-night artefact dump", "mono": true, "text": "behaviour 1: files renamed *.blkv + ransom note\nbehaviour 2: MBR overwritten, hosts will not boot\nbehaviour 3: public homepage replaced with attacker text\nbehaviour 4: vssadmin delete shadows /all /quiet\nbehaviour 5: scheduled lifecycle job wiped archive folders on the retention date"}]}, "question": "Drag each behaviour to the technique it matches.", "dnd": {"bank": ["Files renamed *.blkv + ransom note", "MBR overwritten, hosts will not boot", "Public homepage replaced with attacker text", "vssadmin delete shadows /all /quiet", "Lifecycle job wiped archive folders on the retention date"], "zones": [{"label": "T1486 Data Encrypted for Impact", "accept": [0]}, {"label": "T1561.002 Disk Structure Wipe", "accept": [1]}, {"label": "T1491.002 External Defacement", "accept": [2]}, {"label": "T1490 Inhibit System Recovery", "accept": [3]}, {"label": "T1485.001 Lifecycle-Triggered Deletion", "accept": [4]}]}, "hint": "Behaviour 5 is the subtle one: the deletion waited for a lifecycle trigger. Structure vs content decides behaviour 2.", "ansline": "1 → T1486; 2 → T1561.002; 3 → T1491.002; 4 → T1490; 5 → T1485.001.", "explain": "Five behaviours, five precise names — including two sub-techniques from the M1053 page. The subtle pair: overwriting the MBR is a structure wipe (T1561.002), not just content; and a deletion that waits for a lifecycle trigger is T1485.001, a favourite of saboteurs because it hides inside normal processes. Precise names drive precise playbooks.", "study": "Sub-technique discrimination within Impact."}, {"id": "X14", "type": "rank", "theme": "Real-world use", "title": "Rank the CISO's five options", "scenario": {"summary": "Most defensible first", "blocks": [{"label": "Options on the table (03:40)", "mono": true, "text": "A: pay the ransom to speed recovery\nB: restore immediately from the online repo, verification later\nC: contain, verify the immutable copy offline, restore by tier\nD: touch nothing until every fact is certain\nE: isolate now, restore tier-1 from the verified copy while investigation continues"}]}, "question": "Rank the five options, most defensible first.", "rank": {"items": ["C: contain, verify the immutable copy offline, restore by tier", "E: isolate now, restore tier-1 from the verified copy while investigation continues", "D: hold all actions until every fact is certain", "B: restore immediately from the online repo, verification later", "A: pay the ransom to speed recovery"], "correct": [0, 1, 2, 3, 4]}, "hint": "C and E are close — the difference is how much verified certainty each requires before moving.", "ansline": "C > E > D > B > A.", "explain": "C is the textbook line: verify, then restore. E is its pragmatic sibling — defensible when tier-1 pressure peaks, because it uses a verified copy for the critical tier only. D is paralysis that spends RTO for comfort; B gambles on a chain the attacker touched; A funds the next attack and buys no guarantee. Ranking under pressure is the senior skill this tier tests.", "study": "Decision quality under incident pressure."}, {"id": "X15", "type": "mc", "theme": "Identity & scope", "title": "The one change that matters most", "scenario": {"summary": "Post-incident review closes", "blocks": [{"label": "Review context", "mono": true, "text": "the attacker reached the console with a domain-synced account,\ndisabled object-lock on one bucket, and exported the catalog\nrestores succeeded only from the immutable offsite copy\nEDR missed the staging activity"}]}, "question": "Which single control change has the highest future impact?", "mc": {"options": ["Move the console out of the domain, enforce object-lock, schedule quarterly verified restores", "Add a second antivirus product to every endpoint over next quarter", "Raise the password length policy to 20 characters for all staff", "Keep backups on the same NAS but apply stricter ACLs to the share"], "correct": 0}, "hint": "Trace the attacker's path end to end. Which option cuts every step of it?", "ansline": "Out-of-domain hardened console + enforced object-lock + quarterly verified restores.", "explain": "Every attacker step ran through the domain-synced backup stack and a mutable bucket. The chosen change removes the domain path, re-arms immutability, and makes verification routine — the full M1053 posture. “Better ACLs on the same NAS” sounds reasonable and changes nothing structural; EDR and passwords address paths the attacker did not need this time.", "study": "Least-privilege backup architecture; the five M1053 measures together."}]};
