<script>
var M = {"meta": {"topicId": "m1043", "batch": 4, "title": "M1043 Credential Access Protection — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 16, "estimatedMinutes": 72, "passMark": 70}, "cfg": {"topicId": "m1043", "batch": 4, "examTitle": "M1043 — EXTREMELY HARD practice exam", "objId": "M1043", "objName": "Credential Access Protection", "objType": "Mitigation", "sevLabel": "EXTREMELY HARD", "timerSeconds": 4320, "passMark": 70, "partLabel": null, "estimatedMinutes": 72}, "intro": {"learn": "<p>This is the expert tier for <b>M1043 — Credential Access Protection</b>, a <b>Mitigation</b> in MITRE ATT&amp;CK. The scenarios chain three or more ideas, hand you <b>conflicting signals</b>, and hide one realistic piece of noise or one missing datum in every artefact set. You will run an incident where a blocked LSASS dump looks like a win while a successful DCSync proves the adversary already holds privileged credentials; decide what to do <b>now</b> versus what to schedule; accept real costs (downtime, change freeze, evidence loss) when the right answer demands it; and catch the moment when a widely quoted best practice is the wrong move <b>in this specific world</b>.</p><p>The through-line is scope discipline. M1043's measures — <b>Restrict Access to Credential Storage</b>, <b>Use Credential Guard</b>, <b>Monitor for Credential Dumping Tools</b>, <b>Disable Cached Credentials</b>, <b>Secure Boot and memory protections</b> — plus its device rows (always encrypt local passwords on network devices, per vendor guidance) and its Linux rows (SELinux for ccache files) cover a lot, but never everything: DCSync (T1003.006), local SAM (T1003.002) and the registry cache (T1003.005) stay outside the isolation story. Senior work is saying exactly what is covered, exactly what is not, and exactly what you will do next — with confidence levels, under pressure, in ten minutes.</p>", "keywords": [{"theme": "Chained incident reasoning", "items": ["Blocked LSASS dump on a workstation <b>+</b> successful DCSync from a member host = credential access <b>succeeded</b>", "Containment vs evidence preservation vs credential rotation ordering", "Staged, scoped decisions under executive time pressure"]}, {"theme": "Conflicting signals", "items": ["EDR 'no malware' vs directory-service replication abuse (DCSync needs no malware)", "Signed extension/tooling signals vs behavioural evidence on the DC", "Vendor assurances vs your own telemetry"]}, {"theme": "Architecture & residual risk", "items": ["Findings that materially enable credential theft vs healthy compensations (VBS running, LAPS, behaviour analytics)", "Residual risk after full M1043 adoption: phishing, tier-0 DCSync, old dumps", "Exception governance: time-boxed, owned, reviewed"]}, {"theme": "Cost-bearing decisions", "items": ["Accepting helpdesk/field impact for staged rollout", "KRBTGT double reset planned after confirmation — and why blind resets waste the window", "'Gather more evidence first' as the correct answer when containment already holds"]}], "how": "<p>This exam has <b>16 exercises</b> and a <b>72-minute countdown</b>. Pass mark: <b>70%</b>. Every exercise chains several concepts, and at least one option will be defensible in some world but wrong in this one. Read the artefacts twice; the noise is realistic.</p><ul class='plain'><li><b>Exercise types in this file:</b> branching incident decisions, correlated log analysis with multi-select, architecture review with partial credit, ranking under constraints, drag-and-drop triage including 'no action' slots, spot-the-defeating-lines, report drafting with keyword blanks, ordering, matching, and three judgement questions.</li><li><b>Two kinds of pause.</b> <b>Pause</b> hides the exercise and stops the timer until Resume. <b>Check</b> auto-pauses so you can study the feedback without the clock running; it resumes on <b>Next</b>.</li><li><b>Partial credit.</b> credit = (correct items − wrong items) ÷ total items. One hint per exercise costs 0.10 credit. Skipped-and-never-answered exercises are excluded from the score.</li></ul>"}, "exercises": [{"id": "x01", "type": "branch", "concepts": ["Incident chaining", "Conflicting signals", "Cost-bearing decisions"], "summary": "The 30-minute incident: blocked dump, successful DCSync, plaintext device password", "scenario": {"intro": "09:40. The CISO wants a decision in 30 minutes. Three artefacts are on the table — read all three before answering the steps.", "panels": [{"label": "ARTEFACT 1 — WS-FIN-229 (EDR)", "code": true, "text": "09:02:05 process-access lsass.exe <- unsigned helper\n  action=BLOCKED (Credential Guard / VBS)\n  note: same host as VPN session from 10[.]44[.]7[.]9"}, {"label": "ARTEFACT 2 — DC01 (directory service)", "code": true, "text": "09:02:11 DSGetNCChanges from WS-FIN-229\n  account=svc_audit  result=SUCCESS\n  svc_audit = Domain Admin, DCSync-capable, no MFA"}, {"label": "ARTEFACT 3 — EDGE-RTR-01 (config audit)", "code": true, "text": "username svc_audit privilege 15 password 0 Winter2026\n(same credential string reused; device internet-reachable)"}]}, "question": "<b>Answer the five decision steps. They are graded together after the last step.</b>", "hint": "The dump was blocked, but replication succeeded — the account is the incident. Evidence first on the host; credential rotation is a scheduled, confirmed action.", "branch": {"steps": [{"question": "Step 1 — Your first action on WS-FIN-229?", "options": [{"t": "Preserve volatile evidence, then network-contain the host (no power-off)", "correct": true}, {"t": "Power it off immediately to stop everything", "correct": false}, {"t": "Push the new config baseline to all 4,000 endpoints right now", "correct": false}]}, {"question": "Step 2 — Two signals conflict: the dump was BLOCKED, but DCSync SUCCEEDED. What is the correct read?", "options": [{"t": "Credential access still succeeded — replication is outside Credential Guard's scope; treat svc_audit as compromised", "correct": true}, {"t": "No compromise — the local dump was blocked, so nothing was taken", "correct": false}, {"t": "Credential Guard is broken and must be rolled back fleet-wide", "correct": false}]}, {"question": "Step 3 — Which combination best explains why this path was open?", "options": [{"t": "A DCSync-capable Domain Admin with no MFA, plus a plain-text device password showing the M1043 device measure was never applied", "correct": true}, {"t": "Cached logons were set to 0, forcing the attacker to DCSync", "correct": false}, {"t": "MFA on admin paths made the attacker choose replication", "correct": false}]}, {"question": "Step 4 — The CISO asks: reset KRBTGT right now? Your call:", "options": [{"t": "Yes — schedule the double KRBTGT reset now: a successful DCSync from a member host confirms the directory was replicated; the cost is accepted and scoped", "correct": true}, {"t": "No — wait for the quarterly maintenance window", "correct": false}, {"t": "No need — Credential Guard already contains the damage", "correct": false}]}, {"question": "Step 5 — The durable recommendation package?", "options": [{"t": "Finish the M1043 measures (device password encryption, storage ACLs) + tiered admin/replication rights (M1026) + MFA on admin paths (M1032)", "correct": true}, {"t": "Buy a second antivirus and keep everything else as is", "correct": false}, {"t": "Set cached logons back to 10 to reduce helpdesk load", "correct": false}]}]}, "itemNotes": ["Step 1: volatile evidence first, then contain — powering off destroys memory; a fleet-wide push mid-incident is unscoped change.", "Step 2: the blocked dump is a success for one measure; the successful DCSync is a failure of scope — the account and directory are exposed.", "Step 3: the open path was administrative, not endpoint: DCSync rights + no MFA + a plain-text device password (the T1601/T1599 measure unapplied).", "Step 4: a successful replication from a member host is confirmation enough — the double reset is scheduled, communicated, and executed; waiting for a quarter wastes the window.", "Step 5: the durable fix spans measures and neighbours — finish M1043, restrict replication rights (M1026), and add MFA (M1032)."], "explanation": "This is the full chain. Step 1: <b>evidence before power-off</b> — memory holds the session state; network containment stops the bleed without destroying proof. Step 2: the two signals do not cancel out — Credential Guard blocked the <b>local</b> path while DCSync took the <b>replication</b> path, which it cannot see; the correct read is compromise. Step 3: the open path was administrative — a DCSync-capable Domain Admin without MFA, and a device storing a type-0 plain-text password (the M1043 device measure never applied). Step 4: with replication confirmed from a member host, the <b>double KRBTGT reset</b> is scheduled and executed now — that is the accepted-cost decision. Step 5: the durable package spans M1043's unapplied measures plus M1026 (tiering/replication rights) and M1032 (MFA on admin paths).", "study": "Rehearse saying it in one sentence: 'local theft contained, replication path open, account compromised, rotation scheduled, rights fix durable.'"}, {"id": "x02", "type": "multi", "concepts": ["Architecture review", "Material findings vs compensations"], "summary": "Architecture review — select the findings that materially enable credential theft", "scenario": {"intro": "A partner firm's hardening proposal lists six facts about the environment. The partner is mid-merger: 4,000 endpoints, a flat helpdesk model, and a board deadline. Their lead consultant wants the review to be 'findings only, no noise' — every line you mark becomes a paid remediation task. Select the ones that materially enable credential theft as-is — not the healthy compensations.", "panels": [{"label": "ARTEFACT 1 — Proposed findings", "code": true, "text": "F1. svc_audit: Domain Admin, DCSync-capable, no MFA\nF2. Fleet laptops keep 10 cached domain logons\nF3. Helpdesk group holds local admin (SAM readable) on 900 hosts\nF4. VBS running with lsass isolated on 98% of endpoints\nF5. LAPS randomises local admin passwords on workstations\nF6. EDR analytic flags suspicious lsass access"}]}, "question": "<b>Select the three findings that materially enable credential theft. Wrong picks cancel correct ones.</b>", "hint": "Three findings describe open doors; three describe doors that are already held shut. DCSync rights, registry caches, and broad local admin are doors.", "multi": {"options": [{"t": "F1 — DCSync-capable Domain Admin without MFA", "correct": true}, {"t": "F2 — Ten cached domain logons on fleet laptops", "correct": true}, {"t": "F3 — Helpdesk local admin making the SAM readable at scale", "correct": true}, {"t": "F4 — VBS running with lsass isolated on 98% of endpoints", "correct": false}, {"t": "F5 — LAPS randomising local admin passwords", "correct": false}, {"t": "F6 — EDR analytic for suspicious lsass access", "correct": false}]}, "itemNotes": ["F1: replication rights without MFA is the DCSync path — outside Credential Guard, so nothing else compensates it.", "F2: ten cached sign-ins per laptop is the registry cache Credential Guard does not protect (T1003.005 side).", "F3: broad local admin defeats Restrict Access to Credential Storage at fleet scale.", "F4: this is the Credential Guard measure working — a compensation, not a finding against you.", "F5: LAPS blunts SAM-hash reuse — a healthy compensation for local accounts.", "F6: the monitoring measure is live — another compensation."], "explanation": "The three enabling findings are <b>F1</b> (a DCSync-capable admin with no MFA — the replication path nothing in the list restricts), <b>F2</b> (ten cached logons — the registry cache outside Credential Guard's isolation), and <b>F3</b> (helpdesk local admin on 900 hosts — the SAM readable at scale, defeating the storage-restriction measure). The other three are <b>compensations</b>: VBS isolation (Credential Guard working), LAPS (local admin hashes randomised), and the lsass behaviour analytic (the monitoring measure live). An architecture review earns its fee by separating open doors from held-shut doors — not by listing everything.", "study": "For each finding ask: which measure covers it, and is there a compensation? No cover and no compensation = material finding."}, {"id": "x03", "type": "multi", "concepts": ["Correlated artefacts", "Noise & incomplete data"], "summary": "Correlate the credential-access window across three sources", "scenario": {"intro": "Three sources overlap around one window. One expected datum is missing (no user-agent on the VPN session), and two lines are routine noise. Select the three artefacts that together triangulate the credential-access window.", "panels": [{"label": "ARTEFACT 1 — DC01 directory service", "code": true, "text": "09:02:11 DSGetNCChanges from WS-FIN-229\n  account=svc_audit  result=SUCCESS"}, {"label": "ARTEFACT 2 — VPN gateway", "code": true, "text": "09:03:02 session=svc_audit src=10[.]44[.]7[.]9\n  (new source for this account; user-agent field empty)"}, {"label": "ARTEFACT 3 — WS-FIN-229 EDR", "code": true, "text": "09:02:05 lsass access BLOCKED (Credential Guard)\n09:02:44 signed AV agent reads lsass (documented)\n09:03:20 scheduled backup job completed (expected)"}]}, "question": "<b>Select the three artefacts that triangulate the window. Wrong picks cancel correct ones.</b>", "hint": "Replication success + anomalous remote use of the same account + the blocked dump attempt on the same host form the triangle. Documented AV reads and scheduled backups are the noise.", "multi": {"options": [{"t": "DC01: successful DSGetNCChanges for svc_audit from WS-FIN-229", "correct": true}, {"t": "VPN: svc_audit session from a source new to this account (agent field empty)", "correct": true}, {"t": "EDR: blocked lsass access on WS-FIN-229 minutes before", "correct": true}, {"t": "EDR: signed AV agent reading lsass (vendor-documented)", "correct": false}, {"t": "Backup job completing in its expected window", "correct": false}]}, "itemNotes": ["The successful replication is the theft event itself — nothing else proves takeover this directly.", "The same account then appearing from a source new to it shows the stolen credential being used.", "The blocked dump minutes earlier places the attempt on the same host and window — motive and staging.", "The AV read is documented benign behaviour — present in almost every window, so it discriminates nothing.", "The backup job is scheduled and expected — classic timeline noise."], "explanation": "The triangle is: <b>successful DSGetNCChanges</b> (the credential theft event), <b>anomalous remote session for the same account</b> (the stolen credential in use — note the missing user-agent, which you must reason around, not invent), and the <b>blocked lsass access minutes earlier on the same host</b> (staging and intent). The AV read is vendor-documented benign behaviour, and the backup job is expected — neither discriminates this window from any other. Correlation means choosing the fewest artefacts that constrain time, identity, and mechanism at once.", "study": "Practise the discipline: identity (account), time (window), mechanism (replication + blocked dump) — three pins, no more."}, {"id": "x04", "type": "qcm", "concepts": ["Conflicting signals", "Absence of malware"], "summary": "Vendor says 'no malware found' — the DC says otherwise", "scenario": {"intro": "The EDR vendor's retroscan of WS-FIN-229 is back, and the account owner is quoting it in chat. Your own DC telemetry does not agree with the mood in the room. Read all three artefacts, then decide which signal wins.", "panels": [{"label": "ARTEFACT 1 — Vendor retroscan summary (WS-FIN-229)", "code": true, "text": "retroscan complete\nmalware: none\npersistence: none\nfile indicators: none\nconclusion: 'host appears clean'"}, {"label": "ARTEFACT 2 — DC01 telemetry (yours)", "code": true, "text": "09:02:11 DSGetNCChanges from WS-FIN-229\n  account=svc_audit  result=SUCCESS\n09:02:12 replication of directory credentials completed"}, {"label": "ARTEFACT 3 — Chat, svc_audit account owner", "code": true, "text": "account owner: 'the vendor says we are clean —\nwhy are we still listed as compromised?'"}]}, "question": "<b>Which signal wins, and why?</b>", "hint": "DCSync is a protocol use, not a file. What exactly does 'no malware' rule out — and what does it not?", "qcm": {"options": [{"t": "The DC behavioural evidence wins — DCSync uses native directory protocols, so 'no malware' is expected and rules nothing out", "correct": true}, {"t": "The vendor scan wins — without malware there is no compromise", "correct": false}, {"t": "Both are wrong — only a memory forensics pass can ever confirm DCSync", "correct": false}, {"t": "Neither — disable the replication analytic until the vendor responds", "correct": false}]}, "explanation": "<b>'No malware' and 'no compromise' are different statements.</b> DCSync (T1003.006) is a legitimate directory-replication request sent with stolen privileged credentials — it produces no malicious file, no persistence, and no process to retroscan. The vendor's clean retroscan is entirely consistent with a successful replication-based theft. The DC-side behavioural evidence (who replicated, from where, when) is the signal that constrains the truth, so it wins. Disabling the analytic while 'waiting for the vendor' is the one action that guarantees you stay blind.", "study": "Whenever a technique abuses a native protocol, expect clean AV scans — anchor detection on the protocol behaviour."}, {"id": "x05", "type": "rank", "concepts": ["Executive decision", "Cost-bearing ranking"], "summary": "Rank the five CISO actions under the outage constraint", "scenario": {"intro": "The CISO allows two hours of change capacity tonight. Five actions compete; some carry real business cost, and one must explicitly wait for confirmation work to finish. She wants a sequence she can defend to the board tomorrow morning. Rank all five — anything you would not run tonight still takes its place in the order you would run it.", "panels": [{"label": "ARTEFACT 1 — Context", "code": true, "text": "Confirmed: DCSync success from WS-FIN-229 (svc_audit)\nContained: WS-FIN-229 isolated; svc_audit disabled\nOpen: DC forensics still running\nConstraint: helpdesk offline tooling breaks if\n  more than one config push happens tonight"}]}, "question": "<b>Rank the actions from first (top) to last (bottom).</b>", "hint": "Keep what is already contained intact, cut the remaining live path, spend the one config push where it matters most, let forensics finish before the expensive reset, and keep comms drafted but held.", "rank": {"items": ["Keep svc_audit disabled and verify no other DCSync-capable accounts are active", "Push the single allowed config change: restrict replication rights for tier-0 paths", "Schedule the double KRBTGT reset for the moment DC forensics confirms scope", "Draft external communications with legal — but do not send", "Revisit the field-laptop cached-logons exception next sprint"]}, "itemNotes": ["First: lock down the account class — one more live DCSync-capable account undoes everything else.", "Second: spend the one config push on the path the attacker actually used (replication rights), not on endpoint cosmetics.", "Third: the KRBTGT double reset is necessary but expensive and disruptive — schedule it on forensic confirmation, not blind.", "Fourth: comms drafted and held — sending early creates legal and tactical costs with no protective gain.", "Fifth: the cached-logons exception is real work but carries no live-incident urgency."], "explanation": "Under a two-hour, one-push constraint the order is: <b>hold containment and sweep for other DCSync-capable accounts</b> (cheap, closes the worst reopen risk); <b>spend the single push on replication-rights restriction</b> — the path actually used; <b>schedule the KRBTGT double reset on forensic confirmation</b> — necessary, but blind resets mid-forensics destroy the timeline you still need and double the disruption; <b>draft comms and hold</b>; and <b>defer the cached-logons exception</b> to the next sprint. Every wrong ordering here burns either the change budget or the evidence timeline — the two currencies of the night.", "study": "Constraint thinking: one push, one reset, one draft — spend each where the exposure actually lives."}, {"id": "x06", "type": "dnd", "concepts": ["Triage incl. no-action slots", "Neighbour mitigations"], "summary": "Triage five findings into actions — including two 'no action' slots", "scenario": {"intro": "The assessment queue holds five findings from five different scans. Two of them must be explicitly closed as no-action — mislabeling them creates alert fatigue. Assign each to the correct response.", "panels": [{"label": "ARTEFACT 1 — Assessment queue extract", "code": true, "text": "Q-101  EDGE-RTR-01: username ... password 0 Winter2026\nQ-102  field laptops: cached domain logons = 10\nQ-103  svc_audit: member of Domain Admins, DCSync-capable\nQ-104  endpoints: VBS running, lsass isolated (98%)\nQ-105  avsvc.exe lsass read: vendor-documented behaviour"}]}, "question": "<b>Drag each finding into the correct response slot.</b>", "hint": "Plain-text device passwords, ten cached logons, and a DCSync-capable admin each get a real control. VBS running and vendor-documented AV reads get none.", "dnd": {"slots": [{"label": "Apply M1043 device measure: encrypt local passwords"}, {"label": "Apply M1043 cached-logons measure (with exception process)"}, {"label": "Apply M1026 privileged account management"}, {"label": "No action — expected state"}, {"label": "No action — false positive"}], "bank": [{"t": "EDGE-RTR-01 stores 'password 0 Winter2026'", "slot": 0}, {"t": "Field laptops keep 10 cached domain logons", "slot": 1}, {"t": "svc_audit sits in Domain Admins, DCSync-capable", "slot": 2}, {"t": "VBS running, lsass isolated on 98% of endpoints", "slot": 3}, {"t": "AV agent opened lsass (vendor-documented)", "slot": 4}]}, "itemNotes": ["A type-0 plain-text password on a device maps to the M1043 device guidance (T1601/T1599): encrypt local passwords per vendor recommendations.", "Ten cached logons maps to the Disable Cached Credentials measure — with the exception process for the offline cohort.", "A DCSync-capable Domain Admin is a privileged-account problem (M1026): tiering and replication-rights restriction.", "VBS running with lsass isolated is the Credential Guard measure working — expected state, no action.", "A vendor-documented AV read of lsass is a false positive for dumping analytics — no action beyond keeping the tuning note."], "explanation": "Real actions: the <b>type-0 device password</b> triggers the M1043 device measure (always encrypt local passwords); <b>ten cached logons</b> triggers the cached-credentials measure run through the exception process; the <b>DCSync-capable admin</b> triggers M1026 privileged account work — tiering and replication-rights restriction. Explicit no-actions: <b>VBS running with lsass isolated</b> is the mitigation in its expected state, and the <b>vendor-documented AV read</b> is a false positive your analytics should already tolerate. Closing true positives as no-action (or worse, 'fixing' healthy states) burns change budget and erodes trust in the queue.", "study": "Triage maturity is measured by the quality of your 'no action' slots, not only by the fixes you ship."}, {"id": "x07", "type": "spot", "concepts": ["Runbook review", "Self-defeating lines"], "summary": "Hardening runbook v5 — click the 3 lines that defeat the runbook itself", "scenario": {"intro": "The v5 runbook promises 'full credential-access protection'. Three lines defeat the very measures the same document claims to implement."}, "question": "<b>Click the three self-defeating lines.</b>", "hint": "One skips verification, one widens tier-0, one kills the Linux control. The other lines are the runbook's real substance.", "spot": {"lines": ["Runbook — credential protection hardening v5", "Skip VBS verification on cloned images — the golden template is trusted", "Grant Helpdesk Domain Admin to speed up ticket work", "Disable SELinux on the KDC — too many support tickets", "Set cached logons to 0 for office staff", "Encrypt local passwords on all network devices", "Behaviour analytics for lsass access stay enabled", "MFA enforced on all admin paths", "SAM ACL restricted to Administrators", "Quarterly exception review with named owners"], "correctIdx": [1, 2, 3]}, "itemNotes": ["", "Line 2: skipping VBS verification means 'enabled' is unverifiable — the Credential Guard measure's proof step is deleted.", "Line 3: Helpdesk in Domain Admin recreates exactly the DCSync-capable tier-0 sprawl M1026 fights.", "Line 4: disabling SELinux removes the entry points, process types and file labels that protect ccache files."], "explanation": "Line <b>2</b> deletes the verification step: a cloned image that 'should have VBS' is not a verified isolated lsass, and the measure's proof vanishes. Line <b>3</b> puts Helpdesk into Domain Admins — the exact tier-0 sprawl that makes DCSync trivial and that privileged account management exists to prevent. Line <b>4</b> disables SELinux on the KDC, discarding the ccache-file protections (entry points, process types, file labels) the M1043 page prescribes. Each line saves minutes today and reopens a door the rest of the document locks.", "study": "Runbook review = hunting the lines that quietly undo the document's own promise."}, {"id": "x08", "type": "branch", "concepts": ["Change control", "Trade-off management", "Exception governance"], "summary": "Change-control conflict: cached logons 0 breaks 200 field engineers", "scenario": {"intro": "The cached-logons GPO reaches staging and breaks offline sign-in for 200 field engineers. The deadline pressure is real: an auditor wants the measure 'applied' by month end.", "panels": [{"label": "ARTEFACT 1 — Staging note", "code": true, "text": "cache 10 -> 0\nfield cohort (200): offline sign-in fails\nops lead: 'revert it, we cannot support this'\naudit: measure expected by month end"}]}, "question": "<b>Answer the four governance steps. They are graded together after the last step.</b>", "hint": "The risk is real and so is the breakage. Phased rollout, a compensating state for the offline cohort, and a formal exception are the adult path — not a revert and not a big bang.", "branch": {"steps": [{"question": "Step 1 — Classify the staging finding:", "options": [{"t": "A real trade-off: the measure removes offline sign-in; do not simply revert — the risk (offline-crackable caches) is also real", "correct": true}, {"t": "A false positive — GPOs never affect sign-in", "correct": false}, {"t": "Proof the measure is unsafe and should be abandoned", "correct": false}]}, {"question": "Step 2 — Choose the rollout shape:", "options": [{"t": "Phased: apply cache=0 to the online-first cohorts now; schedule the offline-required cohort last", "correct": true}, {"t": "Fleet-wide tonight — the auditor wants the box ticked", "correct": false}, {"t": "Revert to 10 everywhere and close the audit item as 'risk accepted' forever", "correct": false}]}, {"question": "Step 3 — Pick the compensating state for the offline cohort meanwhile:", "options": [{"t": "Cache set to a low value (e.g. 2) plus full-disk encryption and the dumping-tool analytics watching those laptops", "correct": true}, {"t": "Cache stays at 10 with no compensations until the audit passes", "correct": false}, {"t": "Disable Credential Guard on field laptops to make caching safe", "correct": false}]}, {"question": "Step 4 — The governance artefact that makes this auditable:", "options": [{"t": "A time-boxed exception register entry per cohort: owner, risk statement, compensations, review date", "correct": true}, {"t": "A chat message from the ops lead saying it is fine", "correct": false}, {"t": "Nothing — the phased rollout is self-documenting", "correct": false}]}]}, "itemNotes": ["Step 1: both sides are true — breakage is real, and the offline-crackable cache risk is real. Reverting ignores one side entirely.", "Step 2: phasing protects the business while still moving the measure; big-bang 'for the audit' is how outages get named after you.", "Step 3: cache=2 shrinks the crackable surface, disk encryption and analytics blunt the offline theft path — compensation, not surrender.", "Step 4: exceptions live in a register with owners and expiry dates — that is what an auditor actually accepts."], "explanation": "Step 1: name both truths — the control works, and its cost is real; 'revert it' is a feeling, not a decision. Step 2: <b>phase it</b>: online-first cohorts take cache=0 immediately, and the 200 offline-required engineers move last. Step 3: the offline cohort gets a compensating state — a <b>low cache value like 2</b>, full-disk encryption, and the behaviour analytics watching for dump tooling on exactly those machines. Step 4: the exception register entry (owner, risk, compensations, review date) is the artefact that survives the audit. Big-bang for the box-tick, silent reverts, and 'it is fine' chat messages are the three anti-patterns this scenario exists to teach.", "study": "Governance formula: phase + compensate + register. It turns 'the control breaks us' into 'the control is applied with managed risk'."}, {"id": "x09", "type": "multi", "concepts": ["Residual risk", "Scope honesty"], "summary": "M1043 fully adopted — select the residual risks that remain true", "scenario": {"intro": "The programme closes: all five M1043 measures verified, device passwords encrypted, SELinux labels on the KDC, cached logons at 0 except registered exceptions. The board asks what to fund next year, so the closure review must be honest. Name the risks that remain true even though every measure passed verification — and skip anything the closure report already retired. Select the residual risks that are still TRUE.", "panels": [{"label": "ARTEFACT 1 — Closure report extract", "code": true, "text": "Credential Guard: verified on 98% (exceptions registered)\nCached logons: 0 (registered exceptions only)\nDevice passwords: encrypted per vendor guidance\nSELinux ccache labels: enforced on KDC hosts\nBehaviour analytics: live and tuned"}]}, "question": "<b>Select every residual risk that remains TRUE. Wrong picks cancel correct ones.</b>", "hint": "M1043 protects stored credentials. It does not stop the phishing that harvests them, the tier-0 replication abuse, or the old dumps already cracked.", "multi": {"options": [{"t": "Phishing can still harvest passwords at the point of entry", "correct": true}, {"t": "A compromised tier-0 account can still run DCSync", "correct": true}, {"t": "Dumps stolen before the programme remain crackable offline until rotations complete", "correct": true}, {"t": "LSASS dumping is now trivial across the fleet", "correct": false}, {"t": "Cached logons remain at 10 everywhere", "correct": false}, {"t": "M1043 will detect and stop data exfiltration", "correct": false}]}, "itemNotes": ["TRUE: harvesting passwords by phishing happens before any store is touched — initial-access mitigations own it.", "TRUE: DCSync is replication abuse — privileged account management and MFA own it, not endpoint isolation.", "TRUE: old dumps predate the controls; only rotations and detection retire them.", "FALSE: LSASS dumping got harder, not trivial — that is the programme's win.", "FALSE: cached logons are at 0 by closure, with registered exceptions only.", "FALSE: M1043 protects credentials; exfiltration detection belongs to other mitigations."], "explanation": "Closure reports earn trust by naming what is <b>still true</b>. Phishing still harvests passwords — M1043 protects stores, not inboxes. A compromised tier-0 account still runs DCSync — replication rights and MFA (M1026/M1032 territory) are the answer, and they were out of this programme's scope. Old dumps stolen before the controls landed remain crackable until rotations complete. The FALSE rows are the classic over-claim: the programme made LSASS dumping harder (not trivial), set caches to 0 (not 10), and does nothing about exfiltration. Residual risk honesty is what makes the next budget request credible.", "study": "Every mitigation report needs three lists: covered, uncovered, and handed-off — with named owners for the third."}, {"id": "x10", "type": "fib", "concepts": ["CTI reporting", "Precise vocabulary"], "summary": "Draft the CTI report — four keyword blanks", "scenario": {"intro": "The CTI report goes to the board. Four blanks must carry the exact ATT&amp;CK vocabulary — two decoy words are in the bank.", "panels": [{"label": "ARTEFACT 1 — Evidence recap", "code": true, "text": "- DCSync success (T1003.006) from WS-FIN-229\n- Earlier lsass dump BLOCKED (Credential Guard)\n- EDGE-RTR-01: 'password 0' plain-text storage\n- KDC hosts: SELinux labels now enforced"}]}, "question": "<b>Fill the four blanks with the correct keywords.</b>", "hint": "Blank 1 is what the actor obtained overall. Blank 2 is the store Credential Guard isolated. Blank 3 is the storage form the device used. Blank 4 is the Linux Kerberos file.", "fib": {"text": "Report: 'The actor obtained <button class=\"fibslot\">_____1_____</button> through DCSync (T1003.006). An earlier <button class=\"fibslot\">_____2_____</button> memory dump had been blocked by Credential Guard (M1043). EDGE-RTR-01 stored local passwords in <button class=\"fibslot\">_____3_____</button>, contrary to M1043 device guidance; SELinux labels now protect <button class=\"fibslot\">_____4_____</button> files on the KDC hosts.'", "bank": ["credentials", "LSASS", "plain text", "ccache", "firewall", "patches"], "answers": ["credentials", "LSASS", "plain text", "ccache"]}, "itemNotes": ["Blank 1: DCSync obtained credentials — the general asset the adversary wanted.", "Blank 2: Credential Guard isolates LSASS; the blocked dump was an LSASS memory dump.", "Blank 3: vendor type-0 storage is plain text — the exact violation M1043's device guidance names.", "Blank 4: SELinux entry points, process types and file labels protect ccache files.", "'Firewall' and 'patches' are the decoys — real words, wrong layer."], "explanation": "Board reports fail on loose nouns, so fix all four: the actor obtained <b>credentials</b> (the asset class); the blocked attempt was an <b>LSASS</b> memory dump (what Credential Guard isolates); the device stored passwords in <b>plain text</b> (the named violation of the always-encrypt guidance); and SELinux labels protect <b>ccache</b> files (the Linux Kerberos store). 'Firewall' and 'patches' belong to other conversations entirely — inserting them would misdirect the board's follow-up questions.", "study": "Practise writing one paragraph that cites IDs, stores, and measures without a single vague noun."}, {"id": "x11", "type": "qcm", "concepts": ["Best practice, wrong context", "Cost-bearing decision"], "summary": "'Reimage everything' — why the classic advice is wrong here", "scenario": {"intro": "A respected playbook says: after credential exposure, reimage all affected endpoints. The team proposes reimaging 4,000 endpoints over the weekend. The exposure was DCSync by svc_audit; WS-FIN-229 is already contained; no other host shows malicious execution."}, "question": "<b>Why is fleet-wide reimaging the wrong move in this specific context?</b>", "hint": "Ask where the stolen credential is valid: on the endpoints, or in the directory? And what does a reimage do to the evidence timeline?", "qcm": {"options": [{"t": "The stolen secrets live in the directory — rotation invalidates them; reimaging burns days and the evidence timeline", "correct": true}, {"t": "Reimaging is right, but it must also include the domain controllers tonight", "correct": false}, {"t": "It is wrong because reimaging would delete Credential Guard from the fleet", "correct": false}, {"t": "It is wrong because reimaging requires new hardware purchases before it can start", "correct": false}]}, "explanation": "The exposure mechanism was <b>replication</b>: svc_audit pulled credential material into a place only <b>rotation</b> can reach — resetting the exposed secrets (including the scheduled KRBTGT double reset) invalidates them everywhere at once. Reimaging endpoints neither touches the directory-held secrets nor removes the DCSync right; it costs days of downtime, destroys the forensic timeline on 4,000 machines, and leaves the actual vulnerability (replication rights) in place. Reimaging is a great best practice for <b>endpoint-resident</b> compromise; here the mechanism is directory-side, so rotation plus rights-restriction is the correct, cheaper, faster move.", "study": "Best practices are context-bounded: match the response to where the stolen secret is valid, not to the scariest ritual."}, {"id": "x12", "type": "match", "concepts": ["Analytics to misconfigurations"], "summary": "Match each analytic idea to the misconfiguration it catches", "scenario": {"intro": "The detection engineering backlog holds four analytic ideas. Match each to the misconfiguration or gap it is designed to catch."}, "question": "<b>Match each analytic to what it catches.</b>", "hint": "One watches lsass access, one watches replication, one watches a GPO value, one watches device configs.", "match": {"left": ["Alert: unknown process opens lsass with memory-read rights", "Alert: DSGetNCChanges from a member host", "Drift check: CachedLogonsCount differs from 0", "Inventory: device config contains 'password 0'"], "right": ["Catches: LSASS reachable where isolation was planned or assumed", "Catches: DCSync abuse outside documented replication paths", "Catches: the cached-credentials measure silently reverted", "Catches: plain-text local device passwords (T1601/T1599 guidance)"]}, "itemNotes": ["Unknown callers with memory-read rights on lsass are the dump pattern — and the proof that isolation is missing or bypassed.", "Replication from anything that is not a DC is the DCSync signature — the gap Credential Guard cannot cover.", "A drifted GPO value is how the cached-credentials measure fails quietly after a 'temporary' change.", "'password 0' in a device config is the plain-text storage violation M1043's device rows name."], "explanation": "Analytics exist to catch the <b>quiet failures</b> of the measures: an unknown process with memory-read rights on lsass proves isolation is missing or bypassed; a <b>DSGetNCChanges from a member host</b> is DCSync — the replication gap Credential Guard cannot see; a drifted <b>CachedLogonsCount</b> shows the cached-credentials measure silently reverted (temporary changes become permanent); and <b>'password 0' in device configs</b> finds the plain-text storage the device rows forbid. Every analytic maps to a named measure's failure mode — that is how detection engineering and mitigation work lock together.", "study": "For each M1043 measure, design the analytic that fires when it quietly stops being true."}, {"id": "x13", "type": "order", "concepts": ["Evidence-preserving response", "Full sequence"], "summary": "Order the six evidence-preserving response steps", "scenario": {"intro": "The incident expands: two hosts confirmed, DC forensics under way. The responder trainee shuffled the master sequence — rebuild it."}, "question": "<b>Put the six steps in the correct order.</b>", "hint": "Volatile first, network second (never power), directory logs third, rotation on confirmation, fixes after, report last.", "order": {"items": ["Preserve volatile evidence on the suspected hosts (memory, running processes)", "Network-contain the hosts (no power-off)", "Collect DC security and directory-service logs around the window", "Reset exposed credentials, including the KRBTGT double reset once DC compromise is confirmed", "Apply the missing M1043 measures and replication-rights restrictions", "Publish the post-incident report with confidence levels"]}, "itemNotes": ["Volatile evidence dies with power-off — capture memory before touching the network state.", "Network containment stops the bleed while keeping the machine warm and forensically alive.", "DC logs anchor identity and time — they are the backbone of the timeline.", "Rotation is gated on confirmation: blind resets mid-forensics destroy the very timeline you are building.", "Hardening lands after the investigation stops needing the vulnerable state.", "Reporting closes the loop with confidence levels, not absolutes."], "explanation": "The six-beat sequence is <b>volatile evidence → network containment → DC logs → rotation on confirmation → hardening → report</b>. Memory dies with the power button, so it is first. Network containment keeps hosts forensically alive while stopping the adversary. DC logs anchor identity and time before anything rotates. Credential rotation — including the KRBTGT double reset — waits for DC-compromise confirmation because blind resets burn the timeline. Hardening lands after the investigation no longer needs the vulnerable state, and the report closes with calibrated confidence. Every reordering trades either evidence quality or containment speed.", "study": "Say the six beats until they are reflex: volatile, contain, anchor, rotate, harden, report."}, {"id": "x14", "type": "multi", "concepts": ["Coverage matrix gap analysis"], "summary": "Read the mini-matrix — select the uncovered techniques", "scenario": {"intro": "The Navigator layer after the programme shows these rows. Select the techniques that remain UNCOVERED by the implemented measures.", "panels": [{"label": "ARTEFACT 1 — Implemented coverage", "code": true, "text": "T1003.001 LSASS Memory ........ Credential Guard ✓\nT1547.008 LSASS Driver ........ Credential Guard ✓\nT1558.005 Ccache Files ........ SELinux labels ✓\nT1601    Modify System Image .. encrypted device passwords ✓\nT1003.006 DCSync .............. (no row)\nT1003.002 Security Account Manager ... (no row)\nT1003.005 Cached Domain Credentials .. (no row)"}]}, "question": "<b>Select the three UNCOVERED techniques. Wrong picks cancel correct ones.</b>", "hint": "Read the (no row) lines literally — three techniques have no measure attached.", "multi": {"options": [{"t": "T1003.006 — DCSync", "correct": true}, {"t": "T1003.002 — Security Account Manager", "correct": true}, {"t": "T1003.005 — Cached Domain Credentials", "correct": true}, {"t": "T1003.001 — LSASS Memory", "correct": false}, {"t": "T1558.005 — Ccache Files", "correct": false}]}, "itemNotes": ["DCSync has no row — replication rights (M1026 territory) and replication analytics are the follow-up, not M1043 endpoint measures.", "The local SAM has no row — the Restrict Access to Credential Storage measure needs to be extended to workgroup servers.", "Cached domain credentials have no row — the Disable Cached Credentials measure must cover the old laptop cohort.", "LSASS Memory is covered by Credential Guard — verified.", "Ccache Files are covered by the SELinux labels on the KDC hosts."], "explanation": "The matrix is explicit: three techniques carry <b>(no row)</b> — <b>DCSync (T1003.006)</b>, the <b>local SAM (T1003.002)</b>, and <b>cached domain credentials (T1003.005)</b>. These are precisely the known limits of the endpoint-isolation story: replication abuse needs privileged-account management and replication analytics; workgroup SAM exposure needs the storage-restriction measure extended beyond the domain fleet; the registry cache needs the cached-logons measure applied to the old cohort. LSASS Memory and Ccache Files show covered rows, so selecting them is misreading the artefact — the one error this exercise is designed to catch.", "study": "Coverage reviews read rows literally: no row means a hand-off, and every hand-off needs a named owner."}, {"id": "x15", "type": "qcm", "concepts": ["Executive decision", "Scoped answer with confidence levels"], "summary": "The 10-minute CISO decision", "scenario": {"intro": "Ten minutes on the CISO's calendar. State of play: WS-FIN-229 contained and evidence preserved; svc_audit disabled; replication-rights push scheduled; KRBTGT double reset planned on forensic confirmation; unknown whether other accounts were touched."}, "question": "<b>Which briefing answer is correct?</b>", "hint": "The right answer contains scope, a scheduled costly action, and honest uncertainty — not reassurance, not panic.", "qcm": {"options": [{"t": "Containment holds; replication rights restricted tonight; KRBTGT reset on confirmation; open risk: other tier-0 accounts — decision at 18:00", "correct": true}, {"t": "All clear — the workstation dump was blocked, so no credential material left the environment", "correct": false}, {"t": "Shut down the domain now — a total outage until every single host is rebuilt", "correct": false}, {"t": "Sign an IR retainer contract today and revisit the incident next week", "correct": false}]}, "explanation": "The correct briefing has four properties: <b>scope</b> (what is confirmed and contained), <b>action already in flight</b> (replication-rights restriction tonight), a <b>scheduled costly action with its trigger</b> (KRBTGT reset on forensic confirmation), and <b>honest residual uncertainty</b> with a named decision point (18:00 on other tier-0 accounts). 'All clear' is the classic false reassurance — the blocked dump did not stop the replication. A domain-wide shutdown destroys the business and the evidence for no proportional gain. A retainer is a procurement step, not an incident decision. Senior credibility comes from saying exactly what is known, unknown, and when the next decision lands.", "study": "Briefing template: confirmed / contained / scheduled (with trigger) / uncertain (with decision point)."}, {"id": "x16", "type": "order", "concepts": ["Adversary projection", "Next-step ordering"], "summary": "Project the adversary's next four steps after the successful DCSync", "scenario": {"intro": "Threat-lead asks: with svc_audit credentials replicated and the account since disabled, what does the adversary most likely do next, in order? Assume they hold other caches from earlier in the campaign."}, "question": "<b>Order the four likely next steps.</b>", "hint": "Credentials first open more doors, then get parked for persistence, then serve the objective, then leave.", "order": {"items": ["Use the replicated credentials to reach additional servers and domain controllers", "Establish persistence through new privileged accounts or token material", "Move toward the data of interest using the widened access", "Exfiltrate and destroy tracks"]}, "itemNotes": ["Fresh tier-0 credentials are spent first on widening access — more servers, more DCs.", "Persistence lands early so a single credential reset does not evict the actor.", "With access widened and persistence set, the actor moves toward the objective data.", "Exfiltration and clean-up come last — the exit is planned after the objective is served."], "explanation": "After a successful DCSync the actor holds tier-0 material, so the projected order is: <b>spend</b> it to widen access (additional servers and DCs), <b>persist</b> (new privileged accounts or token material) so one reset does not evict them, <b>move</b> toward the data of interest over the widened access, and finally <b>exfiltrate and clean up</b>. Projection like this drives the defensive ordering you practised in earlier exercises: account-class lockdown and replication-rights restriction first, persistence hunting second, data-path monitoring third.", "study": "Adversary projection is a defender's scheduling tool — project, then place your next control where the projection points."}]};

'use strict';
/* ===================== shared engine ===================== */
var CFG = M.cfg, EXS = M.exercises, INTRO = M.intro;
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* dark-theme syntax highlighter for the monospace renderer (logs, code, commands) */
function hl(raw){
  var re=/(\d{2}:\d{2}:\d{2})|\b(T\d{4}(?:\.\d{3})?)\b|\b([A-Za-z][A-Za-z0-9_-]*)=|("(?:[^"\\\n]|\\.)*")|\b(BLOCKED|FAILED|DENIED|NO ACTION)\b|\b(SUCCESS|OK|ENABLED|RUNNING|PASS|ok)\b|(\d{1,3}(?:\[\.\]\d{1,3}){3})|\b(WARNING|WARN|NOT DEFINED)\b/g;
  var out='',last=0,m;
  while((m=re.exec(String(raw)))){
    out+=esc(raw.slice(last,m.index));
    if(m[1])out+='<span class="tok-t">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tok-t">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tok-k">'+esc(m[3])+'</span>=';
    else if(m[4])out+='<span class="tok-s">'+esc(m[4])+'</span>';
    else if(m[5])out+='<span class="tok-bad">'+esc(m[5])+'</span>';
    else if(m[6])out+='<span class="tok-ok">'+esc(m[6])+'</span>';
    else if(m[7])out+='<span class="tok-warn">'+esc(m[7])+'</span>';
    else out+='<span class="tok-warn">'+esc(m[8])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(raw.slice(last));
  return out;
}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function fmtDur(ms){return fmtTime(Math.round(ms/1000));}
function byId(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id)return EXS[i];}return null;}

var S={phase:'intro',state:'ENDED',order:[],idx:0,remain:CFG.timerSeconds,timerId:null,
  mode:'exam',returnedId:null,credits:{},answered:{},skipped:[],hintUsed:{},reported:false,
  pausedManualMs:0,pausedAutoMs:0,pauseStart:0,prevState:'RUNNING',
  user:{name:'',country:'',locale:''}};
var RT={locked:false};

/* ---------- timer state machine ---------- */
function setState(st){
  S.state=st;
  if(st==='RUNNING'){startTicking();}else{stopTicking();}
  renderTimerChip();
}
function startTicking(){if(!S.timerId){S.timerId=setInterval(tick,1000);}}
function stopTicking(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function tick(){
  S.remain--;
  if(S.remain<=0){S.remain=0;renderTimer();finishByTimeout();return;}
  renderTimer();
}
function renderTimer(){var t=$('tval');if(t)t.textContent=fmtTime(S.remain);}
function renderTimerChip(){
  var c=$('tstate');if(!c)return;
  if(S.state==='RUNNING'){c.className='tstate run';c.innerHTML='&#9654; RUNNING';}
  else if(S.state==='PAUSED_MANUAL'){c.className='tstate pman';c.innerHTML='&#9208; PAUSED — manual (press Resume)';}
  else if(S.state==='PAUSED_AUTO_CHECK'){c.className='tstate pauto';c.innerHTML='&#9208; PAUSED — reviewing feedback (resumes on Next)';}
  else{c.className='tstate end';c.innerHTML='&#9632; ENDED';}
}

/* ---------- scoring ---------- */
function creditCalc(H,W,N){return Math.max(0,(H-W)/N);}
function creditAfterHint(c,id){return S.hintUsed[id]?Math.max(0,c-0.10):c;}
function scoreSum(){var s=0;for(var k in S.credits){s+=S.credits[k];}return s;}
function answeredCount(){var n=0;for(var k in S.answered){if(S.answered[k])n++;}return n;}

/* ---------- views ---------- */
function showView(node){var app=$('app');app.innerHTML='';app.appendChild(node);window.scrollTo(0,0);}

function startExam(){
  S.phase='exam';S.mode='exam';S.order=shuffle(EXS.map(function(e){return e.id;}));
  S.attempt=(S.attempt||0)+1;
  S.idx=0;S.credits={};S.answered={};S.skipped=[];S.hintUsed={};S.reported=false;
  S.remain=CFG.timerSeconds;S.pausedManualMs=0;S.pausedAutoMs=0;

  setState('RUNNING');

}

function renderShell(){
  var bar=el('div','topbar');
  var pr=el('div','progress');pr.appendChild(el('i'));pr.firstChild.id='pbar';bar.appendChild(pr);
  var row=el('div','toprow');
  row.appendChild(el('span','counter','<span id="excount"></span>'));
  row.appendChild(el('span','sevbadge',esc(CFG.sevLabel)));
  row.appendChild(el('span','timerbox','&#9201; <span class="tval" id="tval">'+fmtTime(S.remain)+'</span><span class="tstate run" id="tstate"></span>'));
  row.appendChild(el('span','scorebox','Score <b id="sctext">0.0 / 0</b> <span id="scpct" class="small">(0%)</span>'));
  row.appendChild(el('span','spacer'));
  var bh=el('button','btn amber','&#128161; Hint');bh.id='hintBtn';bh.addEventListener('click',onHint);
  var bp=el('button','btn purple','&#9208; Pause');bp.id='pauseBtn';bp.addEventListener('click',onPause);
  var bs=el('button','btn grey','&#9193; Skip');bs.id='skipBtn';bs.addEventListener('click',onSkip);
  row.appendChild(bh);row.appendChild(bp);row.appendChild(bs);
  bar.appendChild(row);

function buildLog(log){
  var wrap=el('div','artefact');
  wrap.appendChild(el('span','artlabel',esc(log.title||'LOG VIEWER')));
  var bar=el('div','logbar');
  var inp=document.createElement('input');
  inp.type='text';inp.placeholder='Filter lines (text match)...';
  inp.setAttribute('aria-label','Filter log lines');
  var cnt=el('span','lcount',log.lines.length+' lines');
  bar.appendChild(inp);bar.appendChild(cnt);wrap.appendChild(bar);
  var lv=el('div','logview');var pre=el('pre');
  var raw=log.lines;
  var spans=raw.map(function(l){return el('div',null,hl(l));});
  spans.forEach(function(s){pre.appendChild(s);});
  lv.appendChild(pre);wrap.appendChild(lv);
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),n=0;
    spans.forEach(function(s,i){
      var on=!q||raw[i].toLowerCase().indexOf(q)>=0;
      s.style.display=on?'':'none';
      if(on){n++;
        if(q){
          var idx=raw[i].toLowerCase().indexOf(q);
          var before=raw[i].slice(0,idx),match=raw[i].slice(idx,idx+q.length),after=raw[i].slice(idx+q.length);
          s.innerHTML=hl(before)+'<span class="hit">'+esc(match)+'</span>'+hl(after);
        }else{s.innerHTML=hl(raw[i]);}
      }
    });
    cnt.textContent=n+' / '+raw.length+' lines';
  });
  return wrap;
}

/* ---------- answer builders (per type) ---------- */
function buildAnswer(ex,area){
  var t=ex.type;
  if(t==='qcm'||t==='multi')buildChoice(ex,area);
  else if(t==='match')buildMatch(ex,area);
  else if(t==='dnd')buildDnd(ex,area);
  else if(t==='order'||t==='rank')buildOrder(ex,area);
  else if(t==='fib')buildFib(ex,area);
  else if(t==='spot')buildSpot(ex,area);
  else if(t==='branch')buildBranch(ex,area);
}
function optRow(letter,html,extra){
  var b=el('button','optrow'+(extra?' '+extra:''));
  b.type='button';
  b.appendChild(el('span','letter',letter));
  b.appendChild(el('span','otext',html));
  b.appendChild(el('span','selflag','&#10003; Selected'));
  b.setAttribute('aria-pressed','false');
  return b;
}
function buildChoice(ex,area){
  var isMulti=ex.type==='multi';
  var disp=shuffle(ex[ex.type].options.map(function(o,i){return{oi:i,t:o.t,correct:!!o.correct};}));
  RT.disp=disp;RT.sel={};
  if(isMulti)area.appendChild(el('p','small','Select all options that apply. You get partial credit: wrong selections cancel correct ones.'));
  var list=el('div','optlist');
  disp.forEach(function(o,i){
    var r=optRow(String.fromCharCode(65+i),o.t);
    r.addEventListener('click',function(){
      if(RT.locked)return;
      if(isMulti){RT.sel[o.oi]=!RT.sel[o.oi];r.classList.toggle('selected',!!RT.sel[o.oi]);r.setAttribute('aria-pressed',RT.sel[o.oi]?'true':'false');}
      else{
        RT.sel={};var prev=list.querySelector('.optrow.selected');
        if(prev){prev.classList.remove('selected');prev.setAttribute('aria-pressed','false');}
        RT.sel[o.oi]=true;r.classList.add('selected');r.setAttribute('aria-pressed','true');
      }
    });
    list.appendChild(r);
  });
  area.appendChild(list);RT.rows=list;
}
function buildMatch(ex,area){
  var d=ex.match;RT.pairs={};RT.armedLeft=null;RT.rightUsed={};
  area.appendChild(el('p','small','Click an item on the left, then click its partner on the right. Click a paired item again to change it.'));
  var w=el('div','pairwrap');
  var lc=el('div','paircol');lc.appendChild(el('h4',null,'ITEMS'));
  var rc=el('div','paircol');rc.appendChild(el('h4',null,'PARTNERS (shuffled)'));
  var rOrder=shuffle(d.left.map(function(_,i){return i;}));
  RT.rOrder=rOrder;
  d.left.forEach(function(l,i){
    var r=optRow(String(i+1)+'.',l);
    r.dataset.left=i;
    r.addEventListener('click',function(){
      if(RT.locked)return;
      var prev=lc.querySelector('.armed');if(prev)prev.classList.remove('armed');
      if(RT.armedLeft===i){RT.armedLeft=null;return;}
      RT.armedLeft=i;r.classList.add('armed');
    });
    lc.appendChild(r);
  });
  rOrder.forEach(function(ri,k){
    var r=optRow(String.fromCharCode(65+k),d.right[ri]);
    r.dataset.right=ri;
    r.addEventListener('click',function(){
      if(RT.locked)return;
      if(RT.armedLeft==null){return;}
      if(RT.rightUsed[ri]!==undefined&&RT.rightUsed[ri]!==RT.armedLeft){
        var oldLeft=RT.rightUsed[ri];delete RT.pairs[oldLeft];
        var orow=lc.querySelector('[data-left="'+oldLeft+'"]');if(orow){orow.classList.remove('used');orow.querySelector('.pairtag').remove();}
      }
      if(RT.pairs[RT.armedLeft]!==undefined){
        var oldR=RT.pairs[RT.armedLeft];delete RT.rightUsed[oldR];
        var prow=rc.querySelector('[data-right="'+oldR+'"]');if(prow){prow.classList.remove('used');prow.querySelector('.pairtag').remove();}
      }
      RT.pairs[RT.armedLeft]=ri;RT.rightUsed[ri]=RT.armedLeft;
      var lrow=lc.querySelector('[data-left="'+RT.armedLeft+'"]');
      lrow.classList.add('used');lrow.classList.remove('armed');
      if(!lrow.querySelector('.pairtag')){
        var tag=el('span','pairtag','&#8596;');
        lrow.appendChild(tag);
      }
      var rrow=rc.querySelector('[data-right="'+ri+'"]');
      rrow.classList.add('used');
      if(!rrow.querySelector('.pairtag')){rrow.appendChild(el('span','pairtag','&#8596;'));}
      RT.armedLeft=null;
    });
    rc.appendChild(r);
  });
  w.appendChild(lc);w.appendChild(rc);area.appendChild(w);
  RT.lcol=lc;RT.rcol=rc;
}
function buildDnd(ex,area){
  var d=ex.dnd;RT.place={};RT.armedItem=null;
  area.appendChild(el('p','small','Click an item in the bank, then click the slot it belongs to. Click a placed item to send it back to the bank. Place every item for the best score — items left in the bank are marked as missed.'));
  area.appendChild(el('h4',null,'Item bank'));
  var bank=el('div','bankwrap');
  var order=shuffle(d.bank.map(function(_,i){return i;}));
  RT.bankOrder=order;
  order.forEach(function(bi){
    var chip=el('button','bankchip',d.bank[bi].t);
    chip.dataset.item=bi;
    chip.addEventListener('click',function(){
      if(RT.locked)return;
      if(chip.disabled)return;
      var prev=bank.querySelector('.selected');if(prev)prev.classList.remove('selected');
      RT.armedItem=bi;chip.classList.add('selected');
    });
    bank.appendChild(chip);
  });
  area.appendChild(bank);
  var zones=el('div','slotzone');
  d.slots.forEach(function(s,si){
    var box=el('div','slotbox');
    box.appendChild(el('h4',null,esc(s.label)));
    box.dataset.slot=si;
    box.addEventListener('click',function(ev){
      if(RT.locked)return;
      if(ev.target.closest('.placedchip'))return;
      if(RT.armedItem==null)return;
      var bi=RT.armedItem;
      if(RT.place[bi]!==undefined){
        var oldBox=zones.querySelector('[data-slot="'+RT.place[bi]+'"]');
        var oc=oldBox.querySelector('[data-item="'+bi+'"]');if(oc)oc.remove();
      }
      RT.place[bi]=si;
      var chip=el('button','placedchip','<span>&#128203;</span><span>'+d.bank[bi].t+'</span>');
      chip.dataset.item=bi;
      chip.addEventListener('click',function(){
        if(RT.locked)return;
        delete RT.place[bi];chip.remove();
        var bc=bank.querySelector('[data-item="'+bi+'"]');
        if(bc){bc.disabled=false;bc.classList.remove('selected');}
      });
      box.appendChild(chip);
      var bc=bank.querySelector('[data-item="'+bi+'"]');
      if(bc){bc.disabled=true;bc.classList.remove('selected');}
      RT.armedItem=null;
    });
    zones.appendChild(box);
  });
  area.appendChild(zones);
  RT.bankEl=bank;

function buildOrder(ex,area){
  var d=ex[ex.type==='order'?'order':'rank'];
  var cur=shuffle(d.items.map(function(_,i){return i;}));
  RT.arr=cur;
  area.appendChild(el('p','small',ex.type==='order'?'Put the steps in the correct order. Use the arrow buttons to move a row up or down.':'Rank the actions from most urgent (top) to least urgent (bottom). Use the arrows to move rows.'));
  var list=el('div','ordlist');list.id='ordlist';
  area.appendChild(list);
  function redraw(){
    list.innerHTML='';
    cur.forEach(function(oi,pos){
      var row=el('div','ordrow');
      row.appendChild(el('span','rankn',String(pos+1)));
      row.appendChild(el('span','otext',d.items[oi]));
      var mv=el('span','mvbtns');
      var up=el('button','mvbtn','&#8593;');up.setAttribute('aria-label','Move up');
      up.addEventListener('click',function(){if(RT.locked||pos===0)return;var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;redraw();});
      var dn=el('button','mvbtn','&#8595;');dn.setAttribute('aria-label','Move down');
      dn.addEventListener('click',function(){if(RT.locked||pos===cur.length-1)return;var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;redraw();});
      mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
      list.appendChild(row);
    });
  }
  redraw();
}
function buildFib(ex,area){
  var d=ex.fib;RT.fill={};RT.selBlank=0;
  area.appendChild(el('p','small','Click a word in the bank, then click a blank to place it. Click a filled blank to remove the word again.'));
  var bank=el('div','bankwrap');
  var order=shuffle(d.bank.map(function(_,i){return i;}));
  RT.bankOrder=order;
  var chips={};
  order.forEach(function(wi){
    var c=el('button','bankchip',esc(d.bank[wi]));
    c.dataset.word=wi;chips[wi]=c;
    c.addEventListener('click',function(){
      if(RT.locked)return;
      if(c.disabled)return;
      placeWord(wi);
    });
    bank.appendChild(c);
  });
  area.appendChild(bank);
  var txt=el('div','fibtext');
  txt.innerHTML=d.text;
  area.appendChild(txt);
  var slots=txt.querySelectorAll('.fibslot');
  RT.slots=slots;RT.chips=chips;
  slots.forEach(function(s,i){
    s.addEventListener('click',function(){
      if(RT.locked)return;
      if(RT.fill[i]!==undefined){
        var w=RT.fill[i];delete RT.fill[i];
        s.textContent='_____'+(i+1)+'_____';s.classList.remove('filled');
        if(chips[w]){chips[w].disabled=false;}
      }else{RT.selBlank=i;}
      slots.forEach(function(x,xi){x.classList.toggle('selected',xi===RT.selBlank&&RT.fill[xi]===undefined);});
    });
  });
  function placeWord(wi){
    var i=RT.selBlank;
    if(RT.fill[i]!==undefined&&chips[RT.fill[i]])chips[RT.fill[i]].disabled=false;
    RT.fill[i]=wi;
    slots[i].textContent=d.bank[wi];
    slots[i].classList.add('filled');slots[i].classList.remove('selected');
    if(chips[wi])chips[wi].disabled=true;
    var nx=-1;
    for(var k=0;k<slots.length;k++){if(RT.fill[k]===undefined){nx=k;break;}}
    RT.selBlank=nx>=0?nx:i;
    slots.forEach(function(x,xi){x.classList.toggle('selected',xi===RT.selBlank&&RT.fill[xi]===undefined);});
  }
  slots.forEach(function(x,xi){x.classList.toggle('selected',xi===0);});
}
function buildSpot(ex,area){

function buildBranch(ex,area){
