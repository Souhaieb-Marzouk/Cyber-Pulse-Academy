<script>
var M = {"meta": {"topicId": "m1043", "batch": 1, "title": "M1043 Credential Access Protection — EASY", "difficulty": "easy", "questionCount": 15, "estimatedMinutes": 30, "passMark": 70}, "cfg": {"topicId": "m1043", "batch": 1, "examTitle": "M1043 — EASY practice exam", "objId": "M1043", "objName": "Credential Access Protection", "objType": "Mitigation", "sevLabel": "EASY", "timerSeconds": 1800, "passMark": 70, "partLabel": null, "estimatedMinutes": 30}, "intro": {"learn": "<p>This exam is about one MITRE ATT&amp;CK object: <b>M1043 — Credential Access Protection</b>. It is a <b>Mitigation</b>. In ATT&amp;CK, a mitigation is a defence that a defender can build — a setting, a policy or a control — to make an attack technique harder. M1043 is a wide umbrella mitigation: its goal is to stop adversaries from <b>obtaining credentials</b>. Credentials are the things that prove who you are: passwords, password hashes, tokens and keys. An attacker who steals them can log in as if they were a real user.</p><p>Imagine you are a new SOC analyst. Your team uses M1043 every week. Windows engineers enable <b>Credential Guard</b> so the LSASS process (the Windows process that keeps sign-in secrets in memory) runs isolated. GPO administrators set <b>cached logons to zero</b>, so old sign-ins are not saved on laptops. Platform teams <b>restrict access to the SAM database</b> (the file that stores local passwords). Detection engineers <b>watch for credential dumping tools like Mimikatz</b>. Infrastructure teams <b>encrypt local passwords</b> on network devices. In this exam you will meet the five measures of M1043, the techniques it addresses (such as <b>T1003.001 LSASS Memory</b> and <b>T1547.008 LSASS Driver</b>), and the people who use it: SOC analysts, detection engineers, incident responders, GRC analysts and platform owners. You will also see the risk it lowers: stolen credentials let an attacker move between systems and reach data that should be safe.</p>", "keywords": [{"theme": "Mitigation identity & purpose", "items": ["<b>M1043 — Credential Access Protection</b> (Mitigation, Enterprise)", "Goal: prevent adversaries from <b>obtaining credentials</b> (passwords, hashes, tokens, keys)", "A composite mitigation built from <b>five named measures</b>", "Serves the <b>Credential Access (TA0006)</b> tactic objective"]}, {"theme": "The five measures of M1043", "items": ["<b>Restrict Access to Credential Storage</b> — least privilege on stores like the SAM database", "<b>Use Credential Guard</b> — isolate LSASS memory from attackers", "<b>Monitor for Credential Dumping Tools</b> — flag tools like Mimikatz or Windows Credential Editor", "<b>Disable Cached Credentials</b> — GPO: cache of previous logons set to 0", "<b>Enable Secure Boot and Memory Protections</b> — DEP and ASLR"]}, {"theme": "Mitigated techniques (guided look)", "items": ["<b>T1003.001 — OS Credential Dumping: LSASS Memory</b>", "<b>T1547.008 — Boot or Logon Autostart Execution: LSASS Driver</b>", "<b>T1558.005 — Steal or Forge Kerberos Tickets: Ccache Files</b>", "<b>T1601 / T1599 — storing passwords in plain text on network devices</b>"]}, {"theme": "Real-world workflow", "items": ["Hardening baselines and GPO changes for endpoints", "EDR alerts on access to lsass.exe", "Incident response checks for credential exposure", "GRC evidence that credential-theft defences exist"]}], "how": "<p>This exam has <b>15 exercises</b>. You need <b>70%</b> to pass. The exam is timed: you get a <b>30-minute countdown</b>, sized for this file. Every exercise can also be paused, skipped and retaken later.</p><ul class='plain'><li><b>Exercise types in this file:</b> multiple-choice questions, multi-select questions with partial credit, matching pairs, drag-and-drop sorting, fill-in-the-blank sentences, one spot-the-problem-line exercise, and one ordering exercise.</li><li><b>Two kinds of pause.</b> The <b>Pause</b> button is a manual break: the timer stops and the exercise is hidden until you press Resume. Also, the moment you press <b>Check</b>, the timer <b>auto-pauses</b>: you can read the feedback as long as you want. It starts again only when you press <b>Next</b>.</li><li><b>Partial credit.</b> Exercises with several correct items give you credit = (correct items − wrong items) ÷ total items. Wrong picks cancel correct picks, so selecting everything earns far less than full marks.</li><li><b>Hints.</b> One hint per exercise, and it costs <b>0.10 credit</b> of that exercise.</li><li><b>Skipping.</b> Skip moves an exercise to a skipped pool without showing the answer. Before you finish, you can return to skipped exercises and answer them while the timer runs. Skipped-and-never-answered exercises are excluded from your score.</li></ul>"}, "exercises": [{"id": "e01", "type": "qcm", "concepts": ["Mitigation identity"], "summary": "Ticket #6102 — what kind of ATT&CK object is M1043?", "scenario": {"intro": "It is your first week as a junior SOC analyst. Your team lead sends you a short note before your first shift.", "panels": [{"label": "ARTEFACT 1 — Team lead note (with ATT&CK excerpt)", "code": true, "text": "From: team-lead\nSubject: Onboarding task\n\nBefore Monday: learn what MITRE ATT&CK\nmitigation M1043 is. It is on our hardening\nchecklist for every Windows endpoint.\n\nExcerpt from the ATT&CK site:\n'M1043 - Credential Access Protection focuses on\nimplementing measures to prevent adversaries from\nobtaining credentials, such as passwords, hashes,\ntokens, or keys.'"}]}, "question": "<b>In the MITRE ATT&amp;CK framework, what kind of object is M1043?</b>", "hint": "The page section is called 'Mitigations'. Ask yourself: which object type names a defence, not an attack step?", "qcm": {"options": [{"t": "A Mitigation — it describes a defence a defender can build", "correct": true}, {"t": "A Technique — it describes an action an attacker takes", "correct": false}, {"t": "A Tactic — it describes the goal an attacker wants to reach", "correct": false}, {"t": "A Group — it describes a known threat actor", "correct": false}]}, "explanation": "M1043 sits in the <b>Mitigations</b> column of ATT&amp;CK. A mitigation describes something the defender puts in place — a setting, a policy or a control — to make attack techniques harder. A technique describes what the attacker does (like dumping LSASS memory). A tactic describes why the attacker does it (the goal, like Credential Access). A group describes who does it. M1043 is the defence side, so it is a Mitigation.", "study": "Re-read the 'What you will learn here' section: the ATT&amp;CK object types and what each one describes."}, {"id": "e02", "type": "match", "concepts": ["Object types", "Tactic vs technique vs mitigation"], "summary": "Onboarding quiz — match three ATT&CK words to their plain meaning", "scenario": {"intro": "Your team lead likes short matching games for onboarding. She sends you three ATT&amp;CK words and three plain meanings, and asks you to pair them correctly."}, "question": "<b>Match each ATT&amp;CK word to its plain meaning.</b>", "hint": "One word is a goal, one is a behaviour, one is a defence. Match each word to the role it plays.", "match": {"left": ["TA0006 — Credential Access", "T1003 — OS Credential Dumping", "M1043 — Credential Access Protection"], "right": ["A Tactic: the attacker goal of getting credentials", "A Technique: the attacker behaviour of taking credentials out of a system", "A Mitigation: defences that make credential theft harder"]}, "itemNotes": ["TA0006 is the tactic — the why: the adversary wants credentials.", "T1003 is the technique — the how: dumping credential stores like LSASS or the SAM.", "M1043 is the mitigation — the defence: restrict storage, isolate LSASS, watch for dumping tools."], "explanation": "The tactic is the attacker's goal — Credential Access means the adversary wants credentials. The technique is the concrete behaviour — OS Credential Dumping means taking credentials out of a system. The mitigation is the defence — M1043 groups the controls that make that theft harder. Remember the order: <b>tactic = why, technique = how, mitigation = how we stop it</b>.", "study": "Look at one real ATT&amp;CK page: every technique page lists its tactics and its mitigations in side tables."}, {"id": "e03", "type": "qcm", "concepts": ["Mitigation goal"], "summary": "Stand-up meeting — what is the goal of M1043?", "scenario": {"intro": "At the Monday stand-up, a new colleague asks: 'I know the ID, M1043, but what is it actually for?' Your team lead turns to you."}, "question": "<b>What is the main goal of M1043 — Credential Access Protection?</b>", "hint": "The name says it: protect <i>credential access</i>. Think about what the attacker should not get.", "qcm": {"options": [{"t": "Stop adversaries from obtaining credentials — passwords, hashes, tokens, keys", "correct": true}, {"t": "Stop phishing emails from ever reaching user inboxes", "correct": false}, {"t": "Stop malware from running on any host in the network", "correct": false}, {"t": "Stop users from browsing unsafe or untrusted websites", "correct": false}]}, "explanation": "The ATT&amp;CK description of M1043 is precise: it focuses on measures that <b>prevent adversaries from obtaining credentials</b> — passwords, hashes, tokens or keys. Phishing prevention, malware execution prevention and web filtering are real defences, but they belong to other mitigations. M1043 is about one specific treasure: the credentials that let an attacker pretend to be a legitimate user.", "study": "Read the one-paragraph description at the top of the M1043 page on attack.mitre.org."}, {"id": "e04", "type": "multi", "concepts": ["What counts as a credential"], "summary": "Training warm-up — select everything that is a credential", "scenario": {"intro": "Before the team can protect credentials, everyone must agree on what a credential is. Your mentor shows you five items from different systems."}, "question": "<b>Select every item that is a credential. Wrong picks cancel correct ones.</b>", "hint": "A credential is something that proves identity or lets you sign in — not any security setting.", "multi": {"options": [{"t": "A user password like 'Winter2026!'", "correct": true}, {"t": "A Kerberos ticket stored in a ccache file on Linux", "correct": true}, {"t": "An NTLM hash taken out of LSASS memory", "correct": true}, {"t": "A firewall rule that blocks port 445", "correct": false}, {"t": "A Windows update package", "correct": false}]}, "itemNotes": ["Passwords are the classic credential.", "Kerberos tickets prove identity on a domain — stealing one is stealing access.", "NTLM hashes from LSASS can be replayed to sign in without knowing the password.", "A firewall rule is a network control, not a proof of identity.", "An update package is software, not a proof of identity."], "explanation": "M1043 protects passwords, hashes, tokens and keys — the ATT&amp;CK page names them directly. A password is a credential. A Kerberos ticket (often stored in a ccache file on Linux) proves who you are on a domain. An NTLM hash taken from LSASS memory works like a password for many sign-in types. A firewall rule and a software update can be part of security, but neither proves identity, so neither is a credential.", "study": "Re-read the M1043 description: 'passwords, hashes, tokens, or keys'."}, {"id": "e05", "type": "dnd", "concepts": ["The five measures"], "summary": "Checklist review — which items are M1043 measures?", "scenario": {"intro": "A teammate copied five lines into the hardening checklist, but two of them do not belong there. Sort them into the right boxes."}, "question": "<b>Drag each item into the correct box: part of the M1043 measures, or not.</b>", "hint": "M1043 has five measures. They all talk about credential storage, Credential Guard, dumping tools, cached logons, or memory protections.", "dnd": {"slots": [{"label": "Part of M1043 (Credential Access Protection)"}, {"label": "Not part of M1043"}], "bank": [{"t": "Use Credential Guard", "slot": 0}, {"t": "Restrict Access to Credential Storage", "slot": 0}, {"t": "Disable Cached Credentials", "slot": 0}, {"t": "Encrypt email attachments", "slot": 1}, {"t": "Install a marketing browser plugin", "slot": 1}]}, "itemNotes": ["'Use Credential Guard' is one of the five named measures of M1043.", "'Restrict Access to Credential Storage' is the measure that guards stores like the SAM database.", "'Disable Cached Credentials' is the measure about the GPO cache of previous logons.", "Encrypting email attachments is data protection — a real control, but not one of the five M1043 measures.", "A marketing plugin has nothing to do with credential storage or dumping."], "explanation": "The M1043 page names five measures: <b>Restrict Access to Credential Storage</b>, <b>Use Credential Guard</b>, <b>Monitor for Credential Dumping Tools</b>, <b>Disable Cached Credentials</b>, and <b>Enable Secure Boot and Memory Protections</b>. Email-attachment encryption may still be a good idea in your organisation, but it belongs to a different mitigation. Knowing the exact five measures matters when you map a checklist line back to ATT&amp;CK.", "study": "Memorise the five measure names — every exercise in this exam builds on them."}, {"id": "e06", "type": "match", "concepts": ["LSASS", "SAM"], "summary": "Two Windows words you must know: lsass.exe and the SAM", "scenario": {"intro": "Your mentor quizzed you with two Windows words that appear on every M1043 ticket. Match each one to what it really is."}, "question": "<b>Match each Windows item to its plain description.</b>", "hint": "One is a process in memory; the other is a file on disk. Both hold sign-in secrets.", "match": {"left": ["lsass.exe", "SAM database"], "right": ["The Windows process that keeps sign-in secrets in memory", "The Windows file that stores local account passwords"]}, "itemNotes": ["lsass.exe is the Local Security Authority Subsystem Service — it holds secrets in memory, which is why dumping its memory is a famous attack.", "The SAM (Security Account Manager) database is a file — normally under C:\\Windows\\System32\\config\\SAM — that stores local account passwords."], "explanation": "<b>lsass.exe</b> is the Local Security Authority Subsystem Service. It runs in memory and holds sign-in secrets for the session. <b>LSASS memory dumping</b> (T1003.001) is the attack of reading that memory. The <b>SAM database</b> is a file on disk that stores passwords for local accounts — that is why M1043 says to restrict administrative access to it. One lives in memory, one lives on disk; both are credential stores, and M1043 protects both.", "study": "Learn these two names well — they appear in almost every exercise about M1043."}, {"id": "e07", "type": "fib", "concepts": ["Restrict Access to Credential Storage", "Credential Guard"], "summary": "Complete the hardening note (SAM + Credential Guard)", "scenario": {"intro": "You are drafting a note for the hardening ticket. Two words are missing. Fill them from the word bank."}, "question": "<b>Complete the note with the correct words from the bank.</b>", "hint": "One word names a database file; the other names a Windows feature that isolates LSASS.", "fib": {"text": "Hardening note: 'First, restrict administrative access to the <button class=\"fibslot\">_____1_____</button> database. Then enable <button class=\"fibslot\">_____2_____</button> so that the LSASS process runs isolated from attackers.'", "bank": ["SAM", "Credential Guard", "Screensaver", "Bluetooth"], "answers": ["SAM", "Credential Guard"]}, "itemNotes": ["M1043 says to restrict administrative access to credential stores such as the SAM database.", "Credential Guard is the measure that isolates LSASS memory so dumping it does not reveal secrets."], "explanation": "The two foundation measures of M1043 on a Windows endpoint are: restrict administrative access to credential stores like the <b>SAM</b> database, and enable <b>Credential Guard</b>, which runs lsass.exe in an isolated virtualised environment. The other two words are everyday Windows features, but they protect nothing about credentials.", "study": "The M1043 page lists the implementation of each measure — read the two Windows ones."}, {"id": "e08", "type": "spot", "concepts": ["Disable Cached Credentials"], "summary": "GPO review — find the cached-logons line that must change", "scenario": {"intro": "A GPO export from a laptop image is open in front of you. One line keeps old sign-ins on the disk, which is exactly what M1043's cached-credentials measure tries to stop."}, "question": "<b>Click the one line that the 'Disable Cached Credentials' measure would change.</b>", "hint": "Look for the line that mentions how many previous logons are kept.", "spot": {"lines": ["Computer Configuration > Policies > Security Settings > Local Policies > Security Options", "Interactive logon: Number of previous logons to cache = 10", "Interactive logon: Machine account threshold = 10", "Interactive logon: Require Smart Card = Not defined", "Shutdown: Allow system to shut down without having to log on = Disabled"], "correctIdx": [1]}, "itemNotes": ["", "This line keeps the last 10 domain sign-ins on the laptop. M1043's Disable Cached Credentials measure says to reduce or remove this cache — set it to 0."], "explanation": "The line <b>'Interactive logon: Number of previous logons to cache = 10'</b> means Windows keeps the last ten domain sign-ins on the laptop. An attacker who steals that cache file can try to crack it offline. M1043's <b>Disable Cached Credentials</b> measure says to configure group policy to reduce or remove this cache — for example, set it to 0. The other lines are real settings, but they are about machine accounts, smart cards or shutdown behaviour.", "study": "The exact GPO setting name is 'Interactive logon: Number of previous logons to cache'."}, {"id": "e09", "type": "order", "concepts": ["Implementation workflow"], "summary": "Order the three first steps to start using M1043", "scenario": {"intro": "Your team wants to start applying M1043 on the fleet. Your mentor gives you the three first steps, shuffled."}, "question": "<b>Put the three steps in the correct order.</b>", "hint": "You cannot protect what you have not found, and you must check your work after changing it.", "order": {"items": ["Find where sign-in secrets live on the endpoints (LSASS memory, the SAM database)", "Turn on the M1043 measures that fit (Credential Guard, cached logons at zero, restricted store access)", "Check that the controls work and users can still do their jobs"]}, "itemNotes": ["First inventory: you need to know the credential stores before you can guard them.", "Then apply the measures that match those stores.", "Finally verify: controls that break logon or business apps get rolled back or tuned."], "explanation": "Good mitigation work follows a simple loop: <b>find, protect, verify</b>. First you discover where credentials live (LSASS memory, the SAM database, cached logons). Then you apply the matching M1043 measures. Then you verify that the controls really work — and that users can still log in. Applying controls before knowing the stores, or never verifying, are the classic beginner mistakes.", "study": "Think 'find, protect, verify' — it is the skeleton of every hardening project."}, {"id": "e10", "type": "qcm", "concepts": ["Monitor for Credential Dumping Tools"], "summary": "Which M1043 measure watches for Mimikatz?", "scenario": {"intro": "In a workshop, the instructor asks: 'One of the five measures is about catching the attacker while they use a dumping tool. Which one?'"}, "question": "<b>Which M1043 measure is about detecting and blocking known credential dumping tools like Mimikatz?</b>", "hint": "Two measures are about settings, two about hardware, and one is about watching behaviour.", "qcm": {"options": [{"t": "Monitor for Credential Dumping Tools", "correct": true}, {"t": "Use Credential Guard", "correct": false}, {"t": "Restrict Access to Credential Storage", "correct": false}, {"t": "Enable Secure Boot and Memory Protections", "correct": false}]}, "explanation": "The measure <b>'Monitor for Credential Dumping Tools'</b> exists to detect and block known tools like <b>Mimikatz</b> or the <b>Windows Credential Editor</b>. Its implementation is to flag suspicious process behaviour around credential dumping — for example, a process opening lsass.exe in a strange way. The other three measures are preventive settings or hardware protections; only this one is about watching for the tools themselves.", "study": "This measure is the bridge between M1043 and your SOC's daily alert work."}, {"id": "e11", "type": "match", "concepts": ["The five measures"], "summary": "Match three M1043 measures to what they actually do", "scenario": {"intro": "A colleague mixed up what each measure does. Match the three measures to their real effects."}, "question": "<b>Match each measure to its effect.</b>", "hint": "One measure isolates memory, one removes saved sign-ins, one uses hardware protections.", "match": {"left": ["Use Credential Guard", "Disable Cached Credentials", "Enable Secure Boot and Memory Protections"], "right": ["Isolates the LSASS process memory from attackers", "Removes saved copies of old domain sign-ins from endpoints", "Uses hardware features like DEP and ASLR against memory attacks"]}, "itemNotes": ["Credential Guard runs lsass.exe in an isolated virtualised environment, so dumping the memory no longer reveals secrets.", "This measure changes the GPO cache of previous logons — down to 0 where possible.", "Secure Boot, DEP (Data Execution Prevention) and ASLR (Address Space Layout Randomisation) harden memory itself."], "explanation": "Each measure targets a different door: <b>Credential Guard</b> isolates the memory where secrets live; <b>Disable Cached Credentials</b> removes the copies of old sign-ins that sit on disk; <b>Secure Boot and memory protections</b> (DEP, ASLR) make memory-based attacks — the kind used to reach credentials — much harder. Knowing which door each measure closes helps you pick the right one for each finding.", "study": "Group the five measures by what they protect: storage, memory, cache, tools."}, {"id": "e12", "type": "qcm", "concepts": ["Tactic mapping"], "summary": "Which tactic's goal does M1043 defend against?", "scenario": {"intro": "A GRC analyst is mapping controls to ATT&amp;CK tactics and asks you which tactic M1043 defends against."}, "question": "<b>Which ATT&amp;CK tactic does M1043 primarily defend against?</b>", "hint": "The mitigation's name contains the tactic's name, almost word for word.", "qcm": {"options": [{"t": "Credential Access (TA0006)", "correct": true}, {"t": "Initial Access (TA0001)", "correct": false}, {"t": "Discovery (TA0007)", "correct": false}, {"t": "Exfiltration (TA0011)", "correct": false}]}, "explanation": "M1043 defends against <b>Credential Access (TA0006)</b> — the tactic where the adversary tries to steal account names, passwords, hashes and tokens. Initial Access is how the attacker gets in the first place (like phishing). Discovery is them looking around. Exfiltration is them sending data out. Stolen credentials are usually the key that unlocks all those later stages, which is why protecting Credential Access is so valuable.", "study": "Mitigation pages on ATT&amp;CK do not list a tactic directly — connect the mitigation to the tactics of the techniques it addresses, starting with T1003 (Credential Access)."}, {"id": "e13", "type": "multi", "concepts": ["Mitigated techniques"], "summary": "Select the behaviours M1043 tries to stop", "scenario": {"intro": "Your mentor lists five behaviours seen in recent reports and asks which ones M1043 is designed to stop."}, "question": "<b>Select every behaviour that M1043 is designed to stop. Wrong picks cancel correct ones.</b>", "hint": "Every correct answer involves getting credentials — from memory, from a database, or from a file.", "multi": {"options": [{"t": "Dumping LSASS memory to take sign-in secrets (T1003.001)", "correct": true}, {"t": "Reading the SAM database with stolen admin rights", "correct": true}, {"t": "Stealing Kerberos ccache files on a Linux server (T1558.005)", "correct": true}, {"t": "Sending spam from a mail server", "correct": false}, {"t": "Changing the wallpaper on one PC", "correct": false}]}, "itemNotes": ["LSASS memory dumping is the headline technique (T1003.001) that Credential Guard protects.", "The SAM database is a credential store — restricting access to it is a named M1043 measure.", "Kerberos ccache files are Linux credential stores — M1043 suggests SELinux entry points, process types and file labels for them.", "Spam is abuse of a mail service, not credential theft.", "Changing a wallpaper is mischief, not credential theft."], "explanation": "M1043 is about one thing: stopping the adversary from <b>obtaining credentials</b>. Dumping LSASS memory, reading the SAM database and stealing Kerberos ccache files all take credentials out of a system — they map to techniques the M1043 page addresses (T1003.001, the SAM store, T1558.005). Sending spam and changing wallpapers may be attacks too, but no credentials are stolen, so M1043 is not the mitigation for them.", "study": "When you map a mitigation, always ask: does this behaviour take credentials? If not, pick another mitigation."}, {"id": "e14", "type": "fib", "concepts": ["Disable Cached Credentials"], "summary": "Complete the laptop baseline policy line", "scenario": {"intro": "You are writing the laptop baseline policy. Two words are missing from the cached-logons line."}, "question": "<b>Complete the policy line with words from the bank.</b>", "hint": "The measure wants as few saved sign-ins as possible — ideally none.", "fib": {"text": "Policy line: 'Set <i>Interactive logon: Number of previous logons to cache</i> to <button class=\"fibslot\">_____1_____</button> so that <button class=\"fibslot\">_____2_____</button> domain sign-ins are not saved on the laptop.'", "bank": ["zero", "old", "ten", "new"], "answers": ["zero", "old"]}, "itemNotes": ["M1043 says to reduce or eliminate the cache — 0 is the value the measure asks for.", "The cache stores previous (old) domain sign-ins, which attackers can crack offline."], "explanation": "The measure <b>Disable Cached Credentials</b> says: configure group policy to reduce or eliminate the use of cached credentials — the example on the ATT&amp;CK page is setting <i>Interactive logon: Number of previous logons to cache</i> to <b>0</b>. The cache holds <b>old</b> domain sign-ins so you can log in offline; an attacker who takes the file can attack those old sign-ins offline, away from your defences.", "study": "Cached logons are a comfort feature with a security cost — know both sides."}, {"id": "e15", "type": "qcm", "concepts": ["Real-world ownership"], "summary": "Who implements M1043 day-to-day?", "scenario": {"intro": "A new colleague asks in chat: 'M1043 sounds great — who actually does it?' Pick the best answer."}, "question": "<b>Which team mainly implements M1043's measures day-to-day?</b>", "hint": "Someone must actually change endpoint settings — alerts alone change nothing.", "qcm": {"options": [{"t": "Windows/platform engineers and security engineers who apply the settings", "correct": true}, {"t": "Only the SOC analysts — watching the alerts is enough to protect credentials", "correct": false}, {"t": "The marketing team, because they own the laptops", "correct": false}, {"t": "Nobody — Windows applies all of it automatically by default", "correct": false}]}, "explanation": "M1043 is a set of <b>changes people must make</b>: enable Credential Guard, edit the cached-logons GPO, restrict SAM access, deploy behaviour analytics for dumping tools, enforce Secure Boot. That is the daily work of Windows/platform engineers and security engineers, with SOC and detection engineers watching afterwards. Credentials are <b>not</b> protected by default — Credential Guard, for example, is explicitly not configured by default. Watching alerts without applying settings leaves the doors open.", "study": "Mitigations live in change tickets, GPOs and baselines — not only in dashboards."}]};

'use strict';
/* ===================== shared engine ===================== */
var CFG = M.cfg, EXS = M.exercises, INTRO = M.intro;
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* dark-theme syntax highlighter for the monospace renderer (logs, code, commands) */
function hl(raw){
  var re=/(\d{2}:\d{2}:\d{2})|\b(T\d{4}(?:\.\d{3})?)\b|\b([A-Za-z][A-Za-z0-9_-]*)=|("(?:[^"\\\n]|\\.)*")|\b(BLOCKED|FAILED|DENIED|NO ACTION)\b|\b(SUCCESS|OK|ENABLED|RUNNING|PASS|ok)\b|(\d{1,3}(?:\[\.\]\d{1,3}){3})|\b(WARNING|WARN|NOT DEFINED)\b/g;
  var out='',last=0,m;
  while((m=re.exec(String(raw)))){
    out+=esc(raw.slice(last,m.index));
    if(m[1])out+='<span class="tok-t">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tok-t">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tok-k">'+esc(m[3])+'</span>=';
    else if(m[4])out+='<span class="tok-s">'+esc(m[4])+'</span>';
    else if(m[5])out+='<span class="tok-bad">'+esc(m[5])+'</span>';
    else if(m[6])out+='<span class="tok-ok">'+esc(m[6])+'</span>';
    else if(m[7])out+='<span class="tok-warn">'+esc(m[7])+'</span>';
    else out+='<span class="tok-warn">'+esc(m[8])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(raw.slice(last));
  return out;
}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function fmtDur(ms){return fmtTime(Math.round(ms/1000));}
function byId(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id)return EXS[i];}return null;}

var S={phase:'intro',state:'ENDED',order:[],idx:0,remain:CFG.timerSeconds,timerId:null,
  mode:'exam',returnedId:null,credits:{},answered:{},skipped:[],hintUsed:{},reported:false,
  pausedManualMs:0,pausedAutoMs:0,pauseStart:0,prevState:'RUNNING',
  user:{name:'',country:'',locale:''}};
var RT={locked:false};

/* ---------- timer state machine ---------- */
function setState(st){
  S.state=st;
  if(st==='RUNNING'){startTicking();}else{stopTicking();}
  renderTimerChip();
}
function startTicking(){if(!S.timerId){S.timerId=setInterval(tick,1000);}}
function stopTicking(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function tick(){
  S.remain--;
  if(S.remain<=0){S.remain=0;renderTimer();finishByTimeout();return;}
  renderTimer();
}
function renderTimer(){var t=$('tval');if(t)t.textContent=fmtTime(S.remain);}
function renderTimerChip(){
  var c=$('tstate');if(!c)return;
  if(S.state==='RUNNING'){c.className='tstate run';c.innerHTML='&#9654; RUNNING';}
  else if(S.state==='PAUSED_MANUAL'){c.className='tstate pman';c.innerHTML='&#9208; PAUSED — manual (press Resume)';}
  else if(S.state==='PAUSED_AUTO_CHECK'){c.className='tstate pauto';c.innerHTML='&#9208; PAUSED — reviewing feedback (resumes on Next)';}
  else{c.className='tstate end';c.innerHTML='&#9632; ENDED';}
}

/* ---------- scoring ---------- */
function creditCalc(H,W,N){return Math.max(0,(H-W)/N);}
function creditAfterHint(c,id){return S.hintUsed[id]?Math.max(0,c-0.10):c;}
function scoreSum(){var s=0;for(var k in S.credits){s+=S.credits[k];}return s;}
function answeredCount(){var n=0;for(var k in S.answered){if(S.answered[k])n++;}return n;}

function startExam(){
  S.phase='exam';S.mode='exam';S.order=shuffle(EXS.map(function(e){return e.id;}));
  S.attempt=(S.attempt||0)+1;
  S.idx=0;S.credits={};S.answered={};S.skipped=[];S.hintUsed={};S.reported=false;
  S.remain=CFG.timerSeconds;S.pausedManualMs=0;S.pausedAutoMs=0;
  renderShell();
  setState('RUNNING');
  renderExercise();
}

function renderShell(){
  var bar=el('div','topbar');
  var pr=el('div','progress');pr.appendChild(el('i'));pr.firstChild.id='pbar';bar.appendChild(pr);
  var row=el('div','toprow');

  var bp=el('button','btn purple','&#9208; Pause');bp.id='pauseBtn';bp.addEventListener('click',onPause);
  var bs=el('button','btn grey','&#9193; Skip');bs.id='skipBtn';bs.addEventListener('click',onSkip);
  row.appendChild(bh);row.appendChild(bp);row.appendChild(bs);

function renderCounter(){
  var e=$('excount');if(!e)return;
  var n=Math.min(S.idx+1,S.order.length);
  if(S.phase==='exam'&&S.mode==='exam'){e.textContent='Exercise '+n+' of '+S.order.length;}
  else if(S.phase==='exam'){e.textContent='Reviewing a skipped exercise';}
}
function renderScore(){
  var sum=scoreSum(),n=answeredCount();
  var s=$('sctext'),p=$('scpct');
  if(!s)return;
  s.textContent=(Math.round(sum*10)/10)+' / '+n;
  var pct=n>0?Math.round(sum/n*100):0;
  p.textContent='('+pct+'%)';
}
function renderProgress(){
  var p=$('pbar');if(!p)return;
  var done=answeredCount()+S.skipped.length;
  p.style.width=Math.min(100,Math.round(done/S.order.length*100))+'%';
}

function curEx(){return byId(S.mode==='returned'?S.returnedId:S.order[S.idx]);}

  a.appendChild(el('div','blockhead','<span class="bicon">&#9998;</span> YOUR ANSWER'));

  var hb=el('div');hb.id='hintbox';hb.setAttribute('hidden','');main.appendChild(hb);

    var back=el('button','btn grey','&#8592; Back to skipped list');

      S.mode='review';S.phase='review';renderReview();
    });
    nav.appendChild(back);
  }
  var chk=el('button','btn primary','&#10003; Check answer');chk.id='checkBtn';

  var nxt=el('button','btn blue','Next exercise &#9194;');nxt.id='nextBtn';nxt.setAttribute('hidden','');
  nxt.addEventListener('click',onNext);

function buildLog(log){
  var wrap=el('div','artefact');
  wrap.appendChild(el('span','artlabel',esc(log.title||'LOG VIEWER')));
  var bar=el('div','logbar');
  var inp=document.createElement('input');
  inp.type='text';inp.placeholder='Filter lines (text match)...';
  inp.setAttribute('aria-label','Filter log lines');
  var cnt=el('span','lcount',log.lines.length+' lines');
  bar.appendChild(inp);bar.appendChild(cnt);wrap.appendChild(bar);
  var lv=el('div','logview');var pre=el('pre');
  var raw=log.lines;
  var spans=raw.map(function(l){return el('div',null,hl(l));});
  spans.forEach(function(s){pre.appendChild(s);});
  lv.appendChild(pre);wrap.appendChild(lv);
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),n=0;
    spans.forEach(function(s,i){
      var on=!q||raw[i].toLowerCase().indexOf(q)>=0;
      s.style.display=on?'':'none';
      if(on){n++;
        if(q){
          var idx=raw[i].toLowerCase().indexOf(q);
          var before=raw[i].slice(0,idx),match=raw[i].slice(idx,idx+q.length),after=raw[i].slice(idx+q.length);
          s.innerHTML=hl(before)+'<span class="hit">'+esc(match)+'</span>'+hl(after);
        }else{s.innerHTML=hl(raw[i]);}
      }
    });
    cnt.textContent=n+' / '+raw.length+' lines';
  });
  return wrap;
}

/* ---------- answer builders (per type) ---------- */
function buildAnswer(ex,area){
  var t=ex.type;
  if(t==='qcm'||t==='multi')buildChoice(ex,area);
  else if(t==='match')buildMatch(ex,area);
  else if(t==='dnd')buildDnd(ex,area);
  else if(t==='order'||t==='rank')buildOrder(ex,area);
  else if(t==='fib')buildFib(ex,area);
  else if(t==='spot')buildSpot(ex,area);
  else if(t==='branch')buildBranch(ex,area);
}
function optRow(letter,html,extra){
  var b=el('button','optrow'+(extra?' '+extra:''));
  b.type='button';
  b.appendChild(el('span','letter',letter));
  b.appendChild(el('span','otext',html));
  b.appendChild(el('span','selflag','&#10003; Selected'));
  b.setAttribute('aria-pressed','false');
  return b;
}
function buildChoice(ex,area){
  var isMulti=ex.type==='multi';
  var disp=shuffle(ex[ex.type].options.map(function(o,i){return{oi:i,t:o.t,correct:!!o.correct};}));
  RT.disp=disp;RT.sel={};
  if(isMulti)area.appendChild(el('p','small','Select all options that apply. You get partial credit: wrong selections cancel correct ones.'));
  var list=el('div','optlist');
  disp.forEach(function(o,i){
    var r=optRow(String.fromCharCode(65+i),o.t);
    r.addEventListener('click',function(){
      if(RT.locked)return;
      if(isMulti){RT.sel[o.oi]=!RT.sel[o.oi];r.classList.toggle('selected',!!RT.sel[o.oi]);r.setAttribute('aria-pressed',RT.sel[o.oi]?'true':'false');}
      else{
        RT.sel={};var prev=list.querySelector('.optrow.selected');
        if(prev){prev.classList.remove('selected');prev.setAttribute('aria-pressed','false');}
        RT.sel[o.oi]=true;r.classList.add('selected');r.setAttribute('aria-pressed','true');
      }
    });
    list.appendChild(r);
  });
  area.appendChild(list);RT.rows=list;
}
function buildMatch(ex,area){
  var d=ex.match;RT.pairs={};RT.armedLeft=null;RT.rightUsed={};
  area.appendChild(el('p','small','Click an item on the left, then click its partner on the right. Click a paired item again to change it.'));
  var w=el('div','pairwrap');
  var lc=el('div','paircol');lc.appendChild(el('h4',null,'ITEMS'));
  var rc=el('div','paircol');rc.appendChild(el('h4',null,'PARTNERS (shuffled)'));
  var rOrder=shuffle(d.left.map(function(_,i){return i;}));
  RT.rOrder=rOrder;
  d.left.forEach(function(l,i){
    var r=optRow(String(i+1)+'.',l);
    r.dataset.left=i;
    r.addEventListener('click',function(){
      if(RT.locked)return;
      var prev=lc.querySelector('.armed');if(prev)prev.classList.remove('armed');
      if(RT.armedLeft===i){RT.armedLeft=null;return;}
      RT.armedLeft=i;r.classList.add('armed');
    });
    lc.appendChild(r);
  });
  rOrder.forEach(function(ri,k){
    var r=optRow(String.fromCharCode(65+k),d.right[ri]);
    r.dataset.right=ri;
    r.addEventListener('click',function(){
      if(RT.locked)return;
      if(RT.armedLeft==null){return;}
      if(RT.rightUsed[ri]!==undefined&&RT.rightUsed[ri]!==RT.armedLeft){
        var oldLeft=RT.rightUsed[ri];delete RT.pairs[oldLeft];
        var orow=lc.querySelector('[data-left="'+oldLeft+'"]');if(orow){orow.classList.remove('used');orow.querySelector('.pairtag').remove();}
      }
      if(RT.pairs[RT.armedLeft]!==undefined){
        var oldR=RT.pairs[RT.armedLeft];delete RT.rightUsed[oldR];
        var prow=rc.querySelector('[data-right="'+oldR+'"]');if(prow){prow.classList.remove('used');prow.querySelector('.pairtag').remove();}
      }
      RT.pairs[RT.armedLeft]=ri;RT.rightUsed[ri]=RT.armedLeft;
      var lrow=lc.querySelector('[data-left="'+RT.armedLeft+'"]');
      lrow.classList.add('used');lrow.classList.remove('armed');
      if(!lrow.querySelector('.pairtag')){
        var tag=el('span','pairtag','&#8596;');
        lrow.appendChild(tag);
      }
      var rrow=rc.querySelector('[data-right="'+ri+'"]');
      rrow.classList.add('used');
      if(!rrow.querySelector('.pairtag')){rrow.appendChild(el('span','pairtag','&#8596;'));}
      RT.armedLeft=null;
    });
    rc.appendChild(r);
  });
  w.appendChild(lc);w.appendChild(rc);area.appendChild(w);
  RT.lcol=lc;RT.rcol=rc;
}
function buildDnd(ex,area){
  var d=ex.dnd;RT.place={};RT.armedItem=null;
  area.appendChild(el('p','small','Click an item in the bank, then click the slot it belongs to. Click a placed item to send it back to the bank. Place every item for the best score — items left in the bank are marked as missed.'));
  area.appendChild(el('h4',null,'Item bank'));
  var bank=el('div','bankwrap');
  var order=shuffle(d.bank.map(function(_,i){return i;}));
  RT.bankOrder=order;
  order.forEach(function(bi){
    var chip=el('button','bankchip',d.bank[bi].t);
    chip.dataset.item=bi;
    chip.addEventListener('click',function(){
      if(RT.locked)return;
      if(chip.disabled)return;
      var prev=bank.querySelector('.selected');if(prev)prev.classList.remove('selected');
      RT.armedItem=bi;chip.classList.add('selected');
    });
    bank.appendChild(chip);
  });
  area.appendChild(bank);
  var zones=el('div','slotzone');
  d.slots.forEach(function(s,si){
    var box=el('div','slotbox');
    box.appendChild(el('h4',null,esc(s.label)));
    box.dataset.slot=si;
    box.addEventListener('click',function(ev){
      if(RT.locked)return;
      if(ev.target.closest('.placedchip'))return;
      if(RT.armedItem==null)return;
      var bi=RT.armedItem;
      if(RT.place[bi]!==undefined){
        var oldBox=zones.querySelector('[data-slot="'+RT.place[bi]+'"]');
        var oc=oldBox.querySelector('[data-item="'+bi+'"]');if(oc)oc.remove();
      }
      RT.place[bi]=si;
      var chip=el('button','placedchip','<span>&#128203;</span><span>'+d.bank[bi].t+'</span>');
      chip.dataset.item=bi;
      chip.addEventListener('click',function(){
        if(RT.locked)return;
        delete RT.place[bi];chip.remove();
        var bc=bank.querySelector('[data-item="'+bi+'"]');
        if(bc){bc.disabled=false;bc.classList.remove('selected');}
      });
      box.appendChild(chip);
      var bc=bank.querySelector('[data-item="'+bi+'"]');
      if(bc){bc.disabled=true;bc.classList.remove('selected');}
      RT.armedItem=null;
    });
    zones.appendChild(box);
  });
  area.appendChild(zones);
  RT.bankEl=bank;
}
function buildOrder(ex,area){
  var d=ex[ex.type==='order'?'order':'rank'];
  var cur=shuffle(d.items.map(function(_,i){return i;}));
  RT.arr=cur;
  area.appendChild(el('p','small',ex.type==='order'?'Put the steps in the correct order. Use the arrow buttons to move a row up or down.':'Rank the actions from most urgent (top) to least urgent (bottom). Use the arrows to move rows.'));
  var list=el('div','ordlist');list.id='ordlist';
  area.appendChild(list);
  function redraw(){
    list.innerHTML='';
    cur.forEach(function(oi,pos){
      var row=el('div','ordrow');
      row.appendChild(el('span','rankn',String(pos+1)));
      row.appendChild(el('span','otext',d.items[oi]));
      var mv=el('span','mvbtns');
      var up=el('button','mvbtn','&#8593;');up.setAttribute('aria-label','Move up');
      up.addEventListener('click',function(){if(RT.locked||pos===0)return;var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;redraw();});
      var dn=el('button','mvbtn','&#8595;');dn.setAttribute('aria-label','Move down');
      dn.addEventListener('click',function(){if(RT.locked||pos===cur.length-1)return;var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;redraw();});
      mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
      list.appendChild(row);
    });
  }
  redraw();
}
function buildFib(ex,area){
  var d=ex.fib;RT.fill={};RT.selBlank=0;
  area.appendChild(el('p','small','Click a word in the bank, then click a blank to place it. Click a filled blank to remove the word again.'));
  var bank=el('div','bankwrap');
  var order=shuffle(d.bank.map(function(_,i){return i;}));
  RT.bankOrder=order;
  var chips={};
  order.forEach(function(wi){
    var c=el('button','bankchip',esc(d.bank[wi]));
    c.dataset.word=wi;chips[wi]=c;
    c.addEventListener('click',function(){
      if(RT.locked)return;
      if(c.disabled)return;
      placeWord(wi);
    });
    bank.appendChild(c);
  });
  area.appendChild(bank);
  var txt=el('div','fibtext');
  txt.innerHTML=d.text;
  area.appendChild(txt);
  var slots=txt.querySelectorAll('.fibslot');
  RT.slots=slots;RT.chips=chips;
  slots.forEach(function(s,i){
    s.addEventListener('click',function(){
      if(RT.locked)return;
      if(RT.fill[i]!==undefined){
        var w=RT.fill[i];delete RT.fill[i];
        s.textContent='_____'+(i+1)+'_____';s.classList.remove('filled');
        if(chips[w]){chips[w].disabled=false;}
      }else{RT.selBlank=i;}
      slots.forEach(function(x,xi){x.classList.toggle('selected',xi===RT.selBlank&&RT.fill[xi]===undefined);});
    });
  });
  function placeWord(wi){
    var i=RT.selBlank;
    if(RT.fill[i]!==undefined&&chips[RT.fill[i]])chips[RT.fill[i]].disabled=false;
    RT.fill[i]=wi;
    slots[i].textContent=d.bank[wi];
    slots[i].classList.add('filled');slots[i].classList.remove('selected');
    if(chips[wi])chips[wi].disabled=true;
    var nx=-1;
    for(var k=0;k<slots.length;k++){if(RT.fill[k]===undefined){nx=k;break;}}
    RT.selBlank=nx>=0?nx:i;
    slots.forEach(function(x,xi){x.classList.toggle('selected',xi===RT.selBlank&&RT.fill[xi]===undefined);});
  }
  slots.forEach(function(x,xi){x.classList.toggle('selected',xi===0);});
}
function buildSpot(ex,area){
  var d=ex.spot;RT.mark={};
  area.appendChild(el('p','small','Click every line you believe is the problem (or part of the problem). Click again to un-mark. Then press Check.'));
  var list=el('div','spotlist');
  d.lines.forEach(function(l,i){
    var r=el('button','spotline');
    r.type='button';
    r.appendChild(el('span','mk','&#10007;'));
    r.appendChild(el('span','lnum',String(i+1).padStart(2,'0')));
    r.appendChild(el('span',null,esc(l)));
    r.addEventListener('click',function(){
      if(RT.locked)return;
      RT.mark[i]=!RT.mark[i];
      r.classList.toggle('marked',!!RT.mark[i]);
    });
    list.appendChild(r);
  });
  area.appendChild(list);
}
function buildBranch(ex,area){
  var d=ex.branch;RT.step=0;RT.stepSel={};RT.dispSteps=[];
  area.appendChild(el('div','stepchip','STEP 1 OF '+d.steps.length));
  var done=el('div','stepdone');
  d.steps.forEach(function(_,i){done.appendChild(el('span','sd','Step '+(i+1)+(i===0?' — you are here':'')));});
  area.appendChild(done);
  var stepBody=el('div');area.appendChild(stepBody);
  var confirmBtn=el('button','btn blue','Confirm step &#9194;');
  confirmBtn.style.marginTop='10px';
  confirmBtn.addEventListener('click',function(){
    if(RT.locked)return;
    if(RT.stepSel[RT.step]===undefined){return;}
    done.children[RT.step].classList.add('on');
    done.children[RT.step].textContent='Step '+(RT.step+1)+' &#10003; answered';
    RT.step++;
    if(RT.step<d.steps.length){
      area.querySelector('.stepchip').innerHTML='STEP '+(RT.step+1)+' OF '+d.steps.length;
      renderStep();
    }else{
      stepBody.innerHTML='';confirmBtn.setAttribute('hidden','');
      area.appendChild(el('p','small','All steps answered. Press Check to see how you did.'));
    }
  });
  function renderStep(){
    var st=d.steps[RT.step];
    stepBody.innerHTML='';
    if(st.intro)stepBody.appendChild(el('p',null,st.intro));
    stepBody.appendChild(el('p',null,st.question));
    var disp=shuffle(st.options.map(function(o,i){return{oi:i,t:o.t,correct:!!o.correct};}));
    RT.dispSteps[RT.step]=disp;
    var list=el('div','optlist');
    disp.forEach(function(o,i){
      var r=optRow(String.fromCharCode(65+i),o.t);
      r.addEventListener('click',function(){
        if(RT.locked)return;
        RT.stepSel[RT.step]=o.oi;
        list.querySelectorAll('.optrow').forEach(function(x){x.classList.remove('selected');x.setAttribute('aria-pressed','false');});
        r.classList.add('selected');r.setAttribute('aria-pressed','true');
      });
      list.appendChild(r);
    });
    stepBody.appendChild(list);
  }
  renderStep();
  area.appendChild(confirmBtn);
}

/* ---------- grading ---------- */
function gradeExercise(ex){
  var t=ex.type,res={credit:0,rows:[],correctSummary:'',formula:null};
  if(t==='qcm'||t==='multi'){
    var opts=ex[t].options,N=0,oi;
    for(oi=0;oi<opts.length;oi++){if(opts[oi].correct)N++;}
    var H=0,W=0;
    var notes=ex.itemNotes||[];
    for(oi=0;oi<opts.length;oi++){
      var sel=!!RT.sel[oi],cor=!!opts[oi].correct;
      if(cor&&sel){H++;res.rows.push({s:'ok',text:opts[oi].t,note:notes[oi]||null});}
      else if(cor&&!sel){res.rows.push({s:'miss',text:opts[oi].t,note:notes[oi]||null});}
      else if(!cor&&sel){W++;res.rows.push({s:'bad',text:opts[oi].t,note:notes[oi]||null});}
    }
    res.credit=creditCalc(H,W,N);
    if(N>1)res.formula={H:H,W:W,N:N};
    res.correctSummary=opts.filter(function(o){return o.correct;}).map(function(o){return o.t;}).join(' · ');
    for(oi=0;oi<opts.length;oi++){
      if(opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-correct');
      else if(!opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-wrong');
    }
  }
  else if(t==='match'){
    var d=ex.match,N=d.left.length,H=0,W=0,notes=ex.itemNotes||[];
    var pairs=[];
    d.left.forEach(function(l,i){
      var ok=RT.pairs[i]===i;
      if(ok)H++;else W++;
      pairs.push('<span class="kw">'+esc(l)+'</span> &#8596; <span class="kw">'+esc(d.right[i])+'</span>');
      res.rows.push({s:ok?'ok':'bad',text:l,note:ok?(notes[i]||null):((notes[i]||'')+' Correct partner: <span class="kw">'+esc(d.right[i])+'</span>')});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=pairs.join(' &nbsp;|&nbsp; ');
  }
  else if(t==='dnd'){
    var d2=ex.dnd,N=d2.bank.length,H=0,W=0,notes=ex.itemNotes||[];
    d2.bank.forEach(function(it,i){
      var p=RT.place[i];
      var ok=p===it.slot;
      if(p===undefined){res.rows.push({s:'miss',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b> (you left it in the bank).'});}
      else if(ok){H++;res.rows.push({s:'ok',text:it.t,note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b>. Correct slot chosen: <b>'+esc(d2.slots[p].label)+'</b>.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d2.bank.map(function(it){return '<span class="kw">'+esc(it.t)+'</span> &#8594; '+esc(d2.slots[it.slot].label);}).join(' · ');
  }
  else if(t==='order'||t==='rank'){
    var d3=ex[t],N=d3.items.length,H=0,W=0,notes=ex.itemNotes||[];
    RT.arr.forEach(function(oi,pos){
      var ok=oi===pos;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',text:d3.items[oi],note:ok?(notes[oi]||null):(notes[oi]?notes[oi]+' ':'')+'Correct position: <b>'+(posIn(d3.items,d3.items[oi])+1)+'</b> (you placed it '+(pos+1)+').'});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    var arr2=d3.items.map(function(it,i){return '<b>'+(i+1)+'</b>. '+esc(it);});
    res.correctSummary=arr2.join(' &#8594; ');
  }
  else if(t==='fib'){
    var d4=ex.fib,N=d4.answers.length,H=0,W=0,notes=ex.itemNotes||[];
    d4.answers.forEach(function(ans,i){
      var sel=RT.fill[i];
      if(sel===undefined){res.rows.push({s:'miss',text:'Blank '+(i+1)+': correct word is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else if(d4.bank[sel]===ans){H++;res.rows.push({s:'ok',text:'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:'Blank '+(i+1)+': you wrote <span class="kw">'+esc(d4.bank[sel])+'</span>, correct is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d4.answers.map(function(ans,i){return 'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>';}).join(' · ');
    d4.answers.forEach(function(ans,i){var s=RT.slots[i];if(s){s.textContent=d4.bank[RT.fill[i]]||ans;}});
  }
  else if(t==='spot'){
    var d5=ex.spot,corr=d5.correctIdx,N=corr.length,H=0,W=0,notes=ex.itemNotes||[];
    corr.forEach(function(li){
      if(RT.mark[li]){H++;res.rows.push({s:'ok',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:notes[li]||null});}
      else{res.rows.push({s:'miss',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:(notes[li]||'')+' This line is part of the problem but you did not mark it.'});}
    });
    d5.lines.forEach(function(l,i){
      if(corr.indexOf(i)<0&&RT.mark[i]){W++;res.rows.push({s:'bad',text:'Line '+(i+1)+': '+esc(d5.lines[i]),note:'This line is fine — marking it was a wrong item.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary='Problem lines: '+corr.map(function(li){return (li+1);}).join(', ');
  }
  else if(t==='branch'){
    var d6=ex.branch,N=d6.steps.length,H=0,W=0,notes=ex.itemNotes||[];
    d6.steps.forEach(function(st,i){
      var sel=RT.stepSel[i],ok=sel!==undefined&&!!st.options[sel].correct;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',
        text:'Step '+(i+1)+': '+(ok?'you chose the right action.':'you chose <span class="kw">'+esc(sel!==undefined?st.options[sel].t:'(no answer)')+'</span>; correct is <span class="kw">'+esc(correctOptText(st.options))+'</span>.'),
        note:notes[i]||null});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d6.steps.map(function(st,i){return 'Step '+(i+1)+': '+correctOptText(st.options);}).join(' · ');
  }
  return res;
}
function displayIndex(disp,oi){for(var i=0;i<disp.length;i++){if(disp[i].oi===oi)return i;}return -1;}
function posIn(arr,x){for(var i=0;i<arr.length;i++){if(arr[i]===x)return i;}return -1;}
function correctOptText(opts){for(var i=0;i<opts.length;i++){if(opts[i].correct)return opts[i].t;}return '';}

/* ---------- flow: check / next / skip / hint / pause ---------- */
function answerMissing(ex){
  var t=ex.type,k,any;
  if(t==='qcm'||t==='multi'){any=false;for(k in RT.sel){if(RT.sel[k]){any=true;break;}}if(!any)return 'Choose at least one option first — or press Skip if you want to move on.';}
  else if(t==='match'){any=false;for(k in RT.pairs){any=true;break;}if(!any)return 'Pair at least one item with a partner first — or press Skip.';}
  else if(t==='dnd'){any=false;for(k in RT.place){any=true;break;}if(!any)return 'Place at least one item into a slot first — or press Skip.';}
  else if(t==='spot'){any=false;for(k in RT.mark){if(RT.mark[k]){any=true;break;}}if(!any)return 'Mark at least one line first — or press Skip.';}
  return null;
}
function onCheck(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(ex.type==='branch'&&RT.step<ex.branch.steps.length)return;
  var need=answerMissing(ex);
  if(need){var cn=$('checknote');if(cn){cn.textContent=need;cn.classList.add('show');}return;}
  var res=gradeExercise(ex);
  var credit=creditAfterHint(res.credit,ex.id);
  S.credits[ex.id]=credit;S.answered[ex.id]=true;
  var si=S.skipped.indexOf(ex.id);if(si>=0)S.skipped.splice(si,1);
  S.pauseStart=Date.now();
  setState('PAUSED_AUTO_CHECK');
  RT.locked=true;
  var chk=$('checkBtn');chk.disabled=true;
  var sk=$('skipBtn');if(sk)sk.disabled=true;
  var hb=$('hintBtn');if(hb)hb.disabled=true;
  var cn=$('checknote');if(cn)cn.classList.remove('show');
  renderFeedback(ex,res,credit);
  renderScore();renderProgress();
  var nxt=$('nextBtn');
  if(S.mode==='exam'&&S.idx>=S.order.length-1)nxt.innerHTML='Final Submit &#9194;';
  else if(S.mode==='returned')nxt.innerHTML='Back to skipped list &#8592;';
  else nxt.innerHTML='Next exercise &#9194;';
  nxt.removeAttribute('hidden');
}
function renderFeedback(ex,res,credit){
  var fb=$('feedback');
  var cls=credit>=1?'f-correct':(credit>0?'f-partial':'f-incorrect');
  var label=credit>=1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT');
  if(res.formula&&credit<1){
    label+=' — credit '+credit.toFixed(2)+' ('+res.formula.H+' correct, '+res.formula.W+' wrong, of '+res.formula.N+' items)';
  }
  if(S.hintUsed[ex.id])label+=' · hint used (−0.10)';
  fb.className=cls;fb.innerHTML='';
  fb.appendChild(el('div','fbhead',label));
  var body=el('div','fbbody');
  if(res.formula)body.appendChild(el('div','formulaline','credit = max(0, (H &#8722; W) / N) = ('+res.formula.H+' &#8722; '+res.formula.W+') / '+res.formula.N+' = '+credit.toFixed(2)+' (before hint penalty)'));
  body.appendChild(el('div',null,'<b>Correct answer:</b> '+res.correctSummary));
  if(res.rows.length){
    var rows=el('div','fbrows');
    res.rows.forEach(function(r){
      var row=el('div','fbrow '+(r.s==='ok'?'r-ok':(r.s==='bad'?'r-bad':'r-miss')));
      row.appendChild(el('span','ficon',r.s==='ok'?'&#10003;':(r.s==='bad'?'&#10007;':'&#9675;')));
      row.appendChild(el('span','fword',r.s==='ok'?'Correct':(r.s==='bad'?'Wrong':'Missed')));
      row.appendChild(el('span','ftext',r.text+(r.note?'<span class="fnote">'+r.note+'</span>':'')));
      rows.appendChild(row);
    });
    body.appendChild(rows);
  }
  var ex2=el('div','fbexplain');
  ex2.appendChild(el('div','exlabel','WHY'));
  ex2.appendChild(el('div',null,ex.explanation));
  body.appendChild(ex2);
  if(credit<1&&ex.study){
    var sb=el('div','studybox');
    sb.appendChild(el('div','slabel','WHAT TO STUDY'));
    sb.appendChild(el('div',null,ex.study));
    body.appendChild(sb);
  }
  fb.appendChild(body);
  fb.removeAttribute('hidden');
  fb.setAttribute('tabindex','-1');fb.focus({preventScroll:false});
}
function onNext(){
  if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
  if(S.mode==='returned'){S.mode='review';setState('RUNNING');renderReview();return;}
  if(S.idx<S.order.length-1){S.idx++;setState('RUNNING');renderExercise();}
  else{afterQueue();}
}
function onSkip(){
  if(S.mode!=='exam'||S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.skipped.indexOf(ex.id)<0)S.skipped.push(ex.id);
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{afterQueue();}
  renderProgress();
}
function onHint(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.hintUsed[ex.id])return;
  S.hintUsed[ex.id]=true;
  var hb=$('hintbox');
  hb.innerHTML='<span class="hlabel">&#128161; HINT (one per exercise — costs 0.10 credit)</span><div>'+ex.hint+'</div>';
  hb.removeAttribute('hidden');
  $('hintBtn').disabled=true;
}
function onPause(){
  if(S.state==='PAUSED_MANUAL'){
    S.pausedManualMs+=Date.now()-S.pauseStart;
    S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=true;
    setState(S.prevState);
  }else if(S.state==='RUNNING'||S.state==='PAUSED_AUTO_CHECK'){
    if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
    S.prevState=S.state;S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=false;
    var vt=$('veiltitle'),vm=$('veilmsg');
    if(S.prevState==='PAUSED_AUTO_CHECK'){vt.innerHTML='&#9208; Paused — break during feedback review';vm.textContent='You were reviewing feedback. The timer is already stopped. Resuming returns you to the feedback, still paused until you press Next.';}
    else{vt.innerHTML='&#9208; Paused — manual break';vm.textContent='The exercise is hidden and the timer is stopped. Press Resume when you are ready.';}
    setState('PAUSED_MANUAL');
  }
}
function afterQueue(){
  S.phase='review';S.mode='review';
  setState('RUNNING');
  renderReview();
}
function renderReview(){
  var v=el('div','wrap');
  var c=el('div','card');
  c.appendChild(el('h2','sect','Review skipped exercises'));
  if(S.skipped.length===0){
    c.appendChild(el('p',null,'You have no skipped exercises left. You can submit the exam.'));
  }else{
    c.appendChild(el('p',null,'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it, as long as the timer has not ended. Skipped exercises that stay unanswered are excluded from your score.'));
    S.skipped.forEach(function(id){
      var ex=byId(id);
      var row=el('div','skiprow');
      row.appendChild(el('span','sic','&#9888;'));
      row.appendChild(el('span','stx','<b>Skipped — '+esc(ex.summary)+'</b><span class="small">Not answered yet. It will be excluded from scoring if you submit now.</span>'));
      var b=el('button','btn blue','Return to exercise');
      b.addEventListener('click',function(){
        S.mode='returned';S.returnedId=id;S.phase='exam';
        var idx=S.order.indexOf(id);if(idx>=0)S.idx=idx;
        setState('RUNNING');
        renderShell();renderExercise();
      });
      row.appendChild(b);
      c.appendChild(row);
    });
  }
  var nav=el('div','navrow');
  var fin=el('button','btn primary big','&#10003; Final Submit');
  fin.addEventListener('click',finishExam);
  nav.appendChild(fin);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
}
function finishByTimeout(){
  setState('ENDED');
  document.getElementById('pauseveil').hidden=true;
  S.phase='results';
  renderResults(true);
}
function finishExam(){
  setState('ENDED');
  S.phase='results';
  renderResults(false);
}
function renderResults(timedOut){
  var v=el('div','wrap');
  var sum=scoreSum(),n=answeredCount();
  var pct=n>0?Math.round(sum/n*100):0;
  var passed=pct>=CFG.passMark;
  var c=el('div','card');
  c.appendChild(el('h2','sect','Final results'));
  c.appendChild(el('p','small',timedOut?'The timer ended. Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.':'Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.'));
  var big=el('div','resbig');
  var pctEl=el('div','pct','0%');pctEl.id='respct';
  big.appendChild(pctEl);
  big.appendChild(el('div','sc','score <b>'+(Math.round(sum*10)/10)+'</b> over <b>'+n+'</b> answered of '+S.order.length+' exercises (pass mark '+CFG.passMark+'%)'));
  c.appendChild(big);
  var fullyC=0,partC=0,partSum=0,fullyW=0;
  for(var k in S.credits){var cr=S.credits[k];if(cr>=1)fullyC++;else if(cr>0){partC++;partSum+=cr;}else fullyW++;}
  var grid=el('div','resgrid');
  function cell(cls,num,lab){var d=el('div','rescell '+cls);d.appendChild(el('div','rc-num',num));d.appendChild(el('div','rc-lab',lab));grid.appendChild(d);}
  cell('c-ok','&#10003; '+fullyC,'Fully correct');
  cell('c-partial','&#10003; '+partC+(partC?' (avg '+(partSum/partC).toFixed(2)+')':''),'Partially correct');
  cell('c-bad','&#10007; '+fullyW,'Fully incorrect');
  cell('c-skip','&#9888; '+(S.order.length-n),'Skipped — excluded');
  c.appendChild(grid);
  var pan=el('div',passed?'passpanel':'failpanel');
  pan.appendChild(el('div','pl',passed?'&#10003; PASS':'&#10007; FAIL'));
  pan.appendChild(el('p',passed?'Congratulations — you reached the pass mark of '+CFG.passMark+'%. You have completed this practice exam on '+esc(CFG.objId)+' — '+esc(CFG.objName)+'.':'You did not reach the pass mark of '+CFG.passMark+'%. Read the explanations again, study the keywords, and retake the exam. A new shuffle awaits you.'));
  if(S.user.name)pan.appendChild(el('p','small','Certificate for: <b>'+esc(S.user.name)+'</b>'+(S.user.country&&S.user.country!=='ZZ'?' ('+esc(S.user.country)+')':'')));
  c.appendChild(pan);
  c.appendChild(el('div','pausereport','Time report — manual pauses: <b>'+fmtDur(S.pausedManualMs)+'</b> · feedback review time (auto-pause): <b>'+fmtDur(S.pausedAutoMs)+'</b> · time remaining when finished: <b>'+fmtTime(S.remain)+'</b>'));
  var nav=el('div','navrow');
  var rt=el('button','btn primary big','&#8635; Retake Exam');
  rt.addEventListener('click',function(){renderIntro();});
  nav.appendChild(rt);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
  /* score counter animation: report exactly once per attempt, after it settles */
  var myAttempt=S.attempt;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  function postOnce(){if(!S.reported){S.reported=true;reportScore(sum,n,pct,passed);}}
  if(reduce||pct===0){pctEl.textContent=pct+'%';postOnce();return;}
  var start=null,dur=900;
  function step(ts){
    if(S.attempt!==myAttempt)return;
    if(start===null)start=ts;
    var p=Math.min(1,(ts-start)/dur);
    pctEl.textContent=Math.round(pct*p)+'%';
    if(p<1){requestAnimationFrame(step);}
    else{pctEl.textContent=pct+'%';postOnce();}
  }
  requestAnimationFrame(step);
}
function reportScore(creditSum,answeredCount_,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      batch:CFG.batch,
      score:Math.round(creditSum),
      total:answeredCount_,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=String(event.data.username||'');
  S.user.country=String(event.data.country||'');
  S.user.locale=String(event.data.locale||'');
});
document.addEventListener('DOMContentLoaded',function(){
  $('veilresume').addEventListener('click',onPause);
  renderIntro();
});
</script>
