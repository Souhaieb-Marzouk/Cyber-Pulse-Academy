<script>
var M = {"meta": {"topicId": "m1043", "batch": 3, "title": "M1043 Credential Access Protection — HARD", "difficulty": "hard", "questionCount": 16, "estimatedMinutes": 56, "passMark": 70}, "cfg": {"topicId": "m1043", "batch": 3, "examTitle": "M1043 — HARD practice exam", "objId": "M1043", "objName": "Credential Access Protection", "objType": "Mitigation", "sevLabel": "HARD", "timerSeconds": 3360, "passMark": 70, "partLabel": null, "estimatedMinutes": 56}, "intro": {"learn": "<p>This exam is about <b>M1043 — Credential Access Protection</b>, a <b>Mitigation</b> in MITRE ATT&amp;CK. You already know the five measures; here the questions get <b>two-sided</b>. Every exercise puts plausible answers side by side, and only careful reading of the artefacts tells them apart. You will judge log lines where a signed antivirus opening lsass.exe is <b>benign</b> and an unsigned helper doing the same is a <b>dump attempt</b>. You will find baselines where one line quietly cancels a measure. You will decide the <b>least aggressive</b> correct action when a control breaks a real workflow, and you will meet the limits the M1043 page itself declares: Credential Guard protects derived domain credentials in LSASS — <b>not</b> local SAM accounts, <b>not</b> cached domain credentials in the registry, and <b>not</b> DCSync (T1003.006), which abuses directory replication over the network.</p><p>The scenarios mirror real shift work: an EDR console with eight lines and one true dump chain, a GPO state report that proves a policy is linked to the wrong OU, a network device storing a vendor type-0 plain-text password, and an executive who cannot work offline because the control works exactly as designed. In each one, the mitigation measure — <b>Use Credential Guard</b>, <b>Restrict Access to Credential Storage</b>, <b>Disable Cached Credentials</b>, <b>Monitor for Credential Dumping Tools</b>, <b>Secure Boot and memory protections</b> — is the lens that separates the right answer from the near-miss.</p>", "keywords": [{"theme": "Discrimination drills", "items": ["Benign vs malicious <b>lsass access</b> (signed AV agent vs unsigned helper)", "Dump chain artefacts: process-access, dump command, <b>.dmp file</b>", "Baseline lines that <b>cancel a measure</b> while looking compliant"]}, {"theme": "Credential Guard coverage lines", "items": ["Protects: NTLM hashes, Kerberos TGTs and derived domain credentials in isolated LSASS", "Not protected: <b>local SAM accounts</b>, <b>cached domain credentials</b> (registry cache), <b>DCSync (T1003.006)</b>", "Requires hardware + firmware, not on by default"]}, {"theme": "Other M1043 surfaces", "items": ["Network devices: vendor type-0 <b>plain-text passwords</b> and the weak 'enable password' form (T1601/T1599 guidance)", "GPO state: a policy <b>linked to the wrong OU</b> is not applied", "SELinux entry points, process types and file labels for ccache files"]}, {"theme": "Judgement calls", "items": ["<b>Least aggressive</b> correct action when a control breaks a workflow", "Risk-approved <b>exception</b> with compensating checks instead of silent reverts", "Behaviour analytics over signature chasing for new dumping tools"]}], "how": "<p>This exam has <b>16 exercises</b> and a <b>56-minute countdown</b>. Pass mark: <b>70%</b>. Expect two to three interacting ideas per exercise, and at least two options that are defensible somewhere else — but wrong here.</p><ul class='plain'><li><b>Exercise types in this file:</b> log-viewer analysis with multi-select, spot-the-problem-lines, one branching incident, matching, coverage-gap multi-select, fill-in-the-blank reporting, ordering, ranking, and a few single-answer judgement questions.</li><li><b>Two kinds of pause.</b> <b>Pause</b> hides the exercise and stops the timer until Resume. <b>Check</b> auto-pauses the timer so you can study the feedback; it resumes only on <b>Next</b>.</li><li><b>Partial credit.</b> credit = (correct items − wrong items) ÷ total items. One hint per exercise costs 0.10 credit. Skipped-and-never-answered exercises are excluded from the score.</li></ul>"}, "exercises": [{"id": "h01", "type": "multi", "concepts": ["Dump chain detection", "Benign lsass access"], "summary": "Eight console lines — which three support a real LSASS dump attempt?", "scenario": {"intro": "Host FS-12, 08:12 local. The EDR console shows eight lines. Two of them look like lsass access but are routine. Pick only the lines that support a genuine dump attempt.", "panels": [{"label": "EDR console — FS-12", "log": {"title": "process + file events (08:12 - 08:14)", "lines": ["08:12:01  process-create  cmd=cmd.exe  user=svc_build  host=FS-12", "08:12:07  process-create  image=C:\\Users\\svc_build\\AppData\\Roaming\\toolx.exe  signed=NO  first-seen=YES", "08:12:09  process-access   target=lsass.exe  caller=toolx.exe  GrantedAccess=0x1010", "08:12:09  process-access   target=lsass.exe  caller=C:\\Program Files\\AVCorp\\avsvc.exe  signed=YES (vendor documented)", "08:12:31  file-create      path=C:\\Windows\\Temp\\lsass-2.dmp  owner=svc_build  size=48MB", "08:13:00  service-start    name=Netlogon  status=routine", "08:13:22  process-access   target=lsass.exe  caller=svchost.exe (-k LocalService)  signed=YES (Microsoft)", "08:14:05  network          dhcp-renew  host=FS-12  status=ok"]}}]}, "question": "<b>Select the three lines that together support a genuine LSASS memory dump attempt. Wrong picks cancel correct ones.</b>", "hint": "A real dump chain needs an unsigned first-seen binary, memory access to lsass, and a dump file landing on disk. Signed and documented access is the noise you must exclude.", "multi": {"options": [{"t": "Line 2 — unsigned, first-seen toolx.exe created under a user profile", "correct": true}, {"t": "Line 3 — toolx.exe opens lsass.exe with GrantedAccess 0x1010", "correct": true}, {"t": "Line 5 — lsass-2.dmp created in Temp, owned by svc_build", "correct": true}, {"t": "Line 4 — the signed AV agent opened lsass.exe", "correct": false}, {"t": "Line 7 — svchost.exe opened lsass.exe", "correct": false}]}, "itemNotes": ["Line 2: an unsigned, first-seen binary under a user profile is the classic dump tool delivery.", "Line 3: memory-read access to lsass from that same unsigned binary is the core event of T1003.001.", "Line 5: a multi-megabyte lsass dump file landing in Temp is the outcome the first two lines predicted.", "Line 4: AV agents open lsass for behaviour scanning — signed and vendor-documented, so benign noise.", "Line 7: service hosts touching lsass are part of normal Windows operation."], "explanation": "The dump chain is lines <b>2 → 3 → 5</b>: an unsigned first-seen tool appears, opens <b>lsass.exe</b> with memory-read access (0x1010), and a 48 MB <b>lsass-2.dmp</b> appears in Temp. That is T1003.001. Lines 4 and 7 are the trap: they also show lsass access, but the callers are <b>signed and documented</b> (the AV vendor and a Microsoft service host) — exactly the benign noise a detection for dumping tools must be tuned to tolerate. Picking them cancels your correct picks, which is how analyst over-detection looks in real metrics.", "study": "Tune dumping-tool analytics on caller trust + access rights + artefacts, not on 'any lsass touch'."}, {"id": "h02", "type": "spot", "concepts": ["Baseline review", "Measures vs look-alikes"], "summary": "Hardening runbook v3 — click the 3 lines that defeat M1043 measures", "scenario": {"intro": "The new hardening runbook claims full M1043 compliance. Three lines quietly defeat named measures while sounding reasonable."}, "question": "<b>Click the three lines that defeat an M1043 measure.</b>", "hint": "One kills memory protections, one keeps ten cached sign-ins, one blinds the monitoring measure. The rest are genuinely compliant.", "spot": {"lines": ["Runbook — credential protection hardening v3", "Enable Credential Guard on supported hardware", "Disable DEP and ASLR globally to stop a legacy app from crashing", "Restrict SAM access to Administrators only", "Set cached logons to 10 so field staff never get locked out", "Mute the Mimikatz signature alerts — too noisy this quarter", "Enable Secure Boot on all new hardware", "Review lsass behaviour analytics quarterly", "Encrypt local passwords on network devices per vendor guidance"], "correctIdx": [2, 4, 5]}, "itemNotes": ["", "", "Line 3: DEP and ASLR are the memory protections of the fifth measure — disabling them globally opens the door the measure closes.", "", "Line 5: a cache of ten is the opposite of the Disable Cached Credentials measure (target 0).", "Line 6: muting the dumping-tool alerts blinds the Monitor for Credential Dumping Tools measure — tune the analytic, never mute it."], "explanation": "Line <b>3</b> disables DEP and ASLR — the 'Enable Secure Boot and Memory Protections' measure exists to keep exactly those on. Line <b>5</b> keeps ten cached domain logons, defeating <b>Disable Cached Credentials</b>. Line <b>6</b> mutes the tool alerts, defeating <b>Monitor for Credential Dumping Tools</b> — the professional fix is tuning the analytic's false positives, not silencing it. Each of the three reads like a pragmatic ops decision; each one cancels a named measure, which is what makes baseline review a real skill.", "study": "Re-read each baseline line and name the measure it touches — if it weakens the measure, flag it."}, {"id": "h03", "type": "qcm", "concepts": ["Alarming-but-benign", "Least aggressive action"], "summary": "AV agent opened lsass — what is the correct next step?", "scenario": {"intro": "A junior analyst escalates: 'Process opened lsass.exe on FS-12 — must be a dumper!' The event shows the corporate AV agent, vendor-signed, with access documented in the vendor's own telemetry guide.", "panels": [{"label": "ARTEFACT 1 — Escalated event", "code": true, "text": "process-access  target=lsass.exe\ncaller=C:\\Program Files\\AVCorp\\avsvc.exe\nsignature=AVCorp Ltd (valid chain)\nvendor-doc: 'avsvc reads lsass for behaviour scanning'\nfirst-seen: 14 months ago"}]}, "question": "<b>What is the correct next step?</b>", "hint": "The caller is signed, documented, and 14 months old. Aggressive containment has a real cost — what does the evidence actually justify?", "qcm": {"options": [{"t": "Verify the signature and vendor documentation, then mark it as expected noise", "correct": true}, {"t": "Isolate FS-12 from the network immediately, just to be safe", "correct": false}, {"t": "Reimage FS-12 — lsass access is never legitimate, signed or not", "correct": false}, {"t": "Uninstall the antivirus on FS-12 so the lsass access stops", "correct": false}]}, "explanation": "This is the <b>alarming-but-benign</b> trap. The caller is vendor-signed, its lsass access is <b>documented by the AV vendor</b>, and it has been present for 14 months — three independent signals that this is expected behaviour, not T1003.001. The correct action is the least aggressive one: verify the signature and the vendor documentation, then mark the event as expected so the analytic keeps tolerating it. Isolating a production file server, reimaging it, or removing the antivirus all burn real availability for zero security gain.", "study": "For every lsass alert, check three things before escalating: caller signature, vendor documentation, first-seen age."}, {"id": "h04", "type": "branch", "concepts": ["Credential Guard scope", "DCSync gap", "M1026 complement"], "summary": "FS-12: dump blocked, but DCSync succeeded — four decisions", "scenario": {"intro": "Two signals arrive minutes apart on FS-12. The EDR blocked an unsigned tool from dumping lsass. Then the domain controller shows a successful DCSync replication request from the svc_backup account, sourced from FS-12.", "panels": [{"label": "ARTEFACT 1 — EDR", "code": true, "text": "08:41:12 process-access lsass.exe <- toolx.exe\n  action=BLOCKED (VBS isolated lsass)"}, {"label": "ARTEFACT 2 — DC01 security log", "code": true, "text": "08:42:03 Directory Service:\n  DSGetNCChanges request from FS-12\n  account=svc_backup  result=SUCCESS\n  (replication of directory credentials)"}]}, "question": "<b>Answer the four decision steps. They are graded together after the last step.</b>", "hint": "The dump was blocked, but replication succeeded — treat the account as compromised, then pick controls that cover the actual gap.", "branch": {"steps": [{"question": "Step 1 — Your first containment action?", "options": [{"t": "Disable svc_backup for interactive/remote use and revoke its current tickets", "correct": true}, {"t": "Reimage FS-12 first, investigate later", "correct": false}, {"t": "Wait for the next patch window — nothing is confirmed yet", "correct": false}]}, {"question": "Step 2 — Which measure blocked the local dump attempt?", "options": [{"t": "Credential Guard — lsass runs isolated under virtualisation-based security", "correct": true}, {"t": "Disable Cached Credentials — it stops tools opening lsass", "correct": false}, {"t": "Secure Boot — it blocks unsigned processes entirely", "correct": false}]}, {"question": "Step 3 — Why did DCSync succeed anyway?", "options": [{"t": "DCSync (T1003.006) abuses directory replication over the network — Credential Guard protects local lsass, not replication", "correct": true}, {"t": "Credential Guard silently failed to load on FS-12", "correct": false}, {"t": "The attacker had physical access to the domain controller", "correct": false}]}, {"question": "Step 4 — The durable control that actually covers this gap?", "options": [{"t": "Restrict who can request replication (tiered admin, privileged account management — M1026 territory)", "correct": true}, {"t": "Set cached logons to 0 on FS-12", "correct": false}, {"t": "Add a Mimikatz antivirus signature to FS-12", "correct": false}]}]}, "itemNotes": ["Step 1: the live path is the account — disable it and revoke tickets so replication and pass-the-ticket stop now.", "Step 2: the EDR note says VBS isolated lsass — that is Credential Guard, an M1043 measure, doing its job.", "Step 3: DCSync asks the DC to replicate credentials; no local memory is touched, so Credential Guard cannot see it.", "Step 4: the gap is replication rights, so the durable fix is tiered administration / privileged account management (M1026), not endpoint config."], "explanation": "Step 1: contain the <b>account</b> — disabling svc_backup and revoking its tickets cuts the live replication path. Step 2: the dump was stopped by <b>Credential Guard</b> (the EDR note names VBS-isolated lsass). Step 3: DCSync is T1003.006 — a network replication request to a domain controller — and the M1043 page's own limitation list puts it outside Credential Guard's reach. Step 4: because the gap is <b>who may replicate</b>, the durable control is tiered admin and privileged account management (M1026); endpoint settings cannot fix a directory-right problem.", "study": "Draw the two lanes: local store theft (M1043 covers) vs replication abuse (M1026/M1032 territory)."}, {"id": "h05", "type": "match", "concepts": ["Neighbour mitigations", "Near-miss mapping"], "summary": "Match four findings to the mitigation that truly fits", "scenario": {"intro": "Four findings from one assessment. Each has a tempting near-miss mitigation; only one fit is right per finding."}, "question": "<b>Match each finding to the mitigation that best addresses it.</b>", "hint": "Separate stealing (M1043), guessing (M1027), reusing a stolen password (M1032), and memory exploitation (M1050).", "match": {"left": ["Unsigned tool found dumping LSASS memory", "Users keep weak and reused passwords", "A stolen password is reused for sign-in from an unusual country", "A legacy OS without memory exploit protections"], "right": ["M1043 — Credential Access Protection (Credential Guard)", "M1027 — Password Policies", "M1032 — Multi-factor Authentication", "M1050 — Exploit Protection"]}, "itemNotes": ["Dumping LSASS is exactly what M1043's Credential Guard measure protects against.", "Weak and reused passwords are a password-policy problem (M1027), not a store-theft problem.", "A stolen password reused from elsewhere is blunted by a second factor — M1032 MFA.", "A legacy OS without DEP/ASLR-style protections is Exploit Protection territory (M1050)."], "explanation": "Four findings, four doors. Stealing from <b>LSASS</b> is M1043 (Credential Guard). <b>Guessable</b> passwords are M1027 (Password Policies). A password that still works after being <b>stolen</b> is M1032's problem — add a second factor. And an OS that lacks <b>memory protections</b> needs M1050 (Exploit Protection). The near-miss here is assigning everything to M1043 because 'credentials' appears in the finding — mitigations match the mechanism, not the keyword.", "study": "When mapping findings, name the mechanism first (steal, guess, reuse, exploit), then pick the mitigation."}, {"id": "h06", "type": "multi", "concepts": ["Coverage gap", "Credential Guard limits"], "summary": "Fleet-wide Credential Guard is live — which risks remain?", "scenario": {"intro": "The platform team announces: 'Credential Guard is now on every domain laptop and workstation.' Your manager asks what credential-theft risks remain open. The verification report also shows: SELinux enforcing on all KDC hosts, encrypted local passwords on all network devices, and LSASS driver autostart blocked by the isolated lsass."}, "question": "<b>Select the risks that genuinely remain open. Wrong picks cancel correct ones.</b>", "hint": "Work through the M1043 limits: replication abuse, local SAM, the registry cache. Then subtract everything the announcement actually covered.", "multi": {"options": [{"t": "DCSync with a compromised privileged account (T1003.006)", "correct": true}, {"t": "Dumping the local SAM on a workgroup server (T1003.002)", "correct": true}, {"t": "Cracking cached domain credentials from old laptops (T1003.005)", "correct": true}, {"t": "LSASS memory dumping on the domain laptops", "correct": false}, {"t": "Planting an LSASS driver autostart on the fleet", "correct": false}, {"t": "Stealing ccache files on the SELinux-enforcing KDC hosts", "correct": false}]}, "itemNotes": ["DCSync abuses directory replication — the announcement covered only local lsass isolation.", "Local SAM accounts are outside Credential Guard's protection, and workgroup servers have no domain hardening.", "Cached domain credentials sit in the registry cache — a different store from LSASS, still unprotected on old laptops.", "Covered: Credential Guard now protects LSASS memory on the fleet (T1003.001).", "Covered: the isolated lsass runs without device drivers, closing T1547.008's autostart path.", "Covered: SELinux labels protect ccache files (T1558.005) per M1043 guidance."], "explanation": "The announcement covered <b>LSASS isolation</b> — so T1003.001, T1547.008, and (with the SELinux note) T1558.005 drop off the risk list. What remains is exactly the M1043 limitation list: <b>DCSync</b> (network replication — needs privileged account management and monitoring, not endpoint config), the <b>local SAM</b> (Credential Guard does not protect local accounts, and workgroup servers are outside domain controls), and <b>cached domain credentials</b> in the registry cache (a different store — the Disable Cached Credentials measure, not Credential Guard, addresses it). A coverage statement is only as good as its stated scope.", "study": "Announce mitigations with scope: 'Credential Guard fleet-wide' covers LSASS-derived secrets, nothing more."}, {"id": "h07", "type": "fib", "concepts": ["Reporting vocabulary", "Limits in prose"], "summary": "Complete the incident report paragraph (3 blanks)", "scenario": {"intro": "Your draft incident report needs three precise words. Two near-miss words sit in the bank to catch keyword matching."}, "question": "<b>Fill the three blanks with the correct words.</b>", "hint": "First blank: the process Credential Guard isolates. Second: the uncovered replication technique. Third: the Linux Kerberos file.", "fib": {"text": "Report draft: 'Credential Guard protects <button class=\"fibslot\">_____1_____</button> secrets, but the assessment must list uncovered paths such as <button class=\"fibslot\">_____2_____</button> (T1003.006). On Linux, SELinux entry points and file labels protect Kerberos <button class=\"fibslot\">_____3_____</button> files.'", "bank": ["LSASS", "DCSync", "ccache", "SAM", "Mimikatz", "tickets"], "answers": ["LSASS", "DCSync", "ccache"]}, "itemNotes": ["Credential Guard isolates the LSASS process — that is the store it protects.", "T1003.006 is DCSync, the replication-based dumping path Credential Guard cannot see.", "The M1043 page's Linux guidance protects Kerberos ccache files with SELinux."], "explanation": "The report must be surgical. <b>LSASS</b> is the isolated process whose secrets Credential Guard protects. <b>DCSync (T1003.006)</b> is the uncovered path — replication-based, invisible to endpoint isolation. <b>ccache files</b> are the Linux Kerberos stores protected with SELinux entry points, process types and file labels. Writing 'SAM' would misstate the protection (local SAM is explicitly not protected), and 'Mimikatz' or 'tickets' would be the wrong layer of detail.", "study": "Reports fail on imprecise nouns — rehearse the exact ATT&CK terms until they are automatic."}, {"id": "h08", "type": "order", "concepts": ["IR sequence", "Evidence discipline"], "summary": "Order the five response steps after the FS-12 dump", "scenario": {"intro": "The dump on FS-12 is confirmed. The incident manager asks for the response sequence — one step is deliberately misordered in the draft."}, "question": "<b>Put the five steps in the correct order.</b>", "hint": "Stop the bleeding, keep the evidence usable, kill the stolen keys, fix the hole, then write it up.", "order": {"items": ["Isolate FS-12 from the network", "Preserve evidence (EDR timeline, the dump file, DC logs around the window)", "Reset the credentials exposed by the dump", "Close the M1043 gaps (verify Credential Guard state, cached logons, replication rights)", "Publish the post-incident report"]}, "itemNotes": ["Containment first — nothing else is safe while the host is live on the network.", "Evidence before changes: once you reset and reconfigure, the picture blurs; capture the timeline first.", "Exposed credentials stay valid until reset — invalidate them after evidence is secured.", "Hardening closes the door for next time.", "Reporting is last but mandatory."], "explanation": "The sequence is <b>contain → preserve → invalidate → harden → report</b>. Isolation stops ongoing dumping and exfiltration. Evidence is preserved <b>before</b> changes blur the picture — that is why it precedes resets. Resets then kill the stolen passwords, hashes and tickets. Hardening closes the specific M1043 gaps the incident proved open. Reporting comes last but is not optional. Reordering hardening ahead of resets is the tempting mistake — it fixes next week while the attacker still holds this week's keys.", "study": "Contain, preserve, invalidate, harden, report — five beats, in that order, every time."}, {"id": "h09", "type": "qcm", "concepts": ["Credential Guard scope", "Local SAM"], "summary": "VBS is running, yet a dump succeeded — from where?", "scenario": {"intro": "Verification on WG-PRINT-01 (a workgroup print server, no domain join) shows virtualisation-based security running and lsass isolated. Yet the responder still pulled usable password material from the box.", "panels": [{"label": "ARTEFACT 1 — Findings", "code": true, "text": "WG-PRINT-01  (workgroup, standalone)\nVBS: RUNNING   lsass: ISOLATED\nfound: reg save of HKLM\\SAM succeeded\nfound: local admin hash cracked offline"}]}, "question": "<b>What is the correct explanation?</b>", "hint": "Credential Guard protects one specific set of secrets. Read the artefact again: which store did the responder actually take?", "qcm": {"options": [{"t": "Credential Guard protects domain credentials in LSASS only — the local SAM store is outside its scope", "correct": true}, {"t": "Credential Guard silently failed to load even though VBS reports RUNNING", "correct": false}, {"t": "The attacker ran DCSync against the workgroup print server", "correct": false}, {"t": "Secure Boot had been disabled on WG-PRINT-01 before the dump", "correct": false}]}, "explanation": "Credential Guard's protection is specific: it isolates LSASS and protects <b>derived domain credentials</b>. The artefact shows a <b>registry save of the local SAM</b> and an offline crack of a <b>local admin hash</b> — the SAM store, which Credential Guard does not protect, on a workgroup server with no domain controls at all. DCSync is impossible here (nothing to replicate from — no domain), and VBS reports RUNNING, so a load failure is contradicted by the evidence. The fix is a different M1043 measure: restrict access to the SAM store and harden local accounts.", "study": "'Credential Guard is on' is never a blanket statement — always ask which store the attack touched."}, {"id": "h10", "type": "rank", "concepts": ["Prioritisation", "Exposure-driven ranking"], "summary": "Rank four remediation items with one change window", "scenario": {"intro": "You have one maintenance window. Four remediation items from the M1043 assessment are pending, and the CISO asked for exposure-based ordering.", "panels": [{"label": "ARTEFACT 1 — Pending items", "code": true, "text": "A. Internet-facing VPN appliance stores a local\n   password in vendor type-0 plain text\nB. Field laptops keep 10 cached domain logons\nC. Developer workstations miss the DEP/ASLR baseline\nD. Hardening wiki page is out of date"}]}, "question": "<b>Rank the items from most urgent (top) to least urgent (bottom).</b>", "hint": "Exposure first: what can an unauthenticated attacker on the internet reach right now? Convenience and documentation come last.", "rank": {"items": ["A — Encrypt the VPN appliance local password (internet-facing plain text)", "B — Cut field laptop cached logons (offline-crackable on lost devices)", "C — Restore DEP/ASLR baseline on developer workstations", "D — Update the hardening wiki page"]}, "itemNotes": ["A: an internet-facing device with a plain-text local password is reachable by anyone who gets the config — highest exposure.", "B: a lost or stolen laptop leaks ten offline-crackable sign-ins; real but requires physical loss first.", "C: missing memory protections raise risk on developer boxes, which are not directly internet-facing.", "D: documentation has no direct exposure; schedule it, but it cannot outrank a live plain-text secret."], "explanation": "Exposure-based ordering puts the <b>internet-facing plain-text password</b> first — M1043's device guidance (T1601/T1599 rows) exists exactly for this, and the attack surface is unauthenticated. <b>Cached logons</b> come second: they require device loss, but ten crackable sign-ins per laptop is a serious, known gap (T1003.005 side). The <b>DEP/ASLR drift</b> is third — real, but on internal developer machines. The <b>wiki page</b> is last: important for sustainability, zero direct exposure. Ranking by keyword familiarity instead of exposure is the near-miss this exercise is built around.", "study": "Rank by: exposure × reachability × what the credential unlocks. Not by how famous the control is."}, {"id": "h11", "type": "qcm", "concepts": ["GPO state", "Applied vs defined"], "summary": "Laptops still cache 10 sign-ins — the policy exists, so why?", "scenario": {"intro": "The compliance scan says field laptops still cache ten sign-ins. The GPO exists, is enabled, and contains the right value. The state report holds the answer.", "panels": [{"label": "GPO state report", "log": {"title": "policy state (audit view)", "lines": ["GPO 'M1043 - Cached Logons'   status=ENABLED", "  setting: Interactive logon: Number of previous logons to cache = 0", "  linked-to: OU=Servers,DC=corp,DC=example", "OU=Laptops,DC=corp,DC=example  contains 612 field laptops", "OU=Laptops linked GPOs: 'Wifi-Baseline', 'Screensaver-Policy'"]}}]}, "question": "<b>Why do the field laptops still cache ten sign-ins?</b>", "hint": "A policy that exists and is enabled still does nothing where it is not linked. Look at the OUs.", "qcm": {"options": [{"t": "The GPO is linked to the Servers OU, not to the Laptops OU the field fleet lives in", "correct": true}, {"t": "The GPO value is wrong — it sets a cache of ten instead of zero", "correct": false}, {"t": "The GPO is flagged disabled in AD, so nothing applies anywhere", "correct": false}, {"t": "Laptop objects ignore group policy links by design", "correct": false}]}, "explanation": "The policy is <b>enabled</b> and its value is <b>correct</b> (cache = 0) — but it is <b>linked to the Servers OU</b>, while the 612 field laptops sit in the Laptops OU, which has only a Wi-Fi baseline and a screensaver policy. 'Defined' and 'applied' are different states: the Disable Cached Credentials measure only counts when the GPO actually reaches the machines. The fix is a link change plus a verification scan, not a new setting.", "study": "GPO audits have three questions: right value? enabled? linked where it matters? — the third one is forgotten most."}, {"id": "h12", "type": "multi", "concepts": ["What Credential Guard protects"], "summary": "Select the TRUE statements about Credential Guard's protection", "scenario": {"intro": "A vendor slide deck makes five claims about Credential Guard. Select the ones that are TRUE."}, "question": "<b>Select every TRUE statement. Wrong picks cancel correct ones.</b>", "hint": "Think about what lives in isolated LSASS after a domain sign-in — and what does not.", "multi": {"options": [{"t": "NTLM hashes of domain users derived at sign-in and held in LSASS", "correct": true}, {"t": "Kerberos tickets (including TGTs) held in LSASS", "correct": true}, {"t": "Derived domain credentials stored after sign-in", "correct": true}, {"t": "Local SAM account passwords", "correct": false}, {"t": "Credentials saved inside web browsers", "correct": false}]}, "itemNotes": ["TRUE: derived NTLM hashes of domain accounts live in LSASS and are protected by the isolation.", "TRUE: Kerberos tickets, including TGTs, are held in LSASS — Credential Guard protects them.", "TRUE: the general class is derived domain credentials after sign-in.", "FALSE: local SAM account passwords are a different store, explicitly outside Credential Guard.", "FALSE: browser-saved credentials never touch LSASS; a different control (and policy) is needed."], "explanation": "Credential Guard protects <b>derived domain credentials</b>: the NTLM hashes derived at domain sign-in, the Kerberos tickets (including TGTs), and similar secrets held in the isolated LSASS process. It does <b>not</b> protect local SAM account passwords — a different store — and it has nothing to do with browser-saved credentials, which never enter LSASS. Vendor decks love to blur this scope; the M1043 page and Microsoft's documentation keep it sharp.", "study": "Protected: derived domain credentials in isolated LSASS. Not protected: SAM, browser vaults, registry cache."}, {"id": "h13", "type": "dnd", "concepts": ["T1003.x discrimination", "DCSync vs local dumping"], "summary": "Sort five observed artefacts by credential-theft mechanism", "scenario": {"intro": "From three hosts come five observed artefacts. Sort each into the mechanism it actually shows — two slots are not credential theft at all."}, "question": "<b>Drag each artefact into the correct slot.</b>", "hint": "Local stores are read with tools or registry saves; DCSync speaks replication to a DC; and two artefacts only look around.", "dnd": {"slots": [{"label": "Credential dumping from a local store (T1003.x)"}, {"label": "Credential dumping via replication (T1003.006)"}, {"label": "Not credential theft"}], "bank": [{"t": "mimikatz sekurlsa::logonpasswords on a workstation", "slot": 0}, {"t": "reg save of HKLM\\SAM to a 'use strict';
/* ===================== shared engine ===================== */
var CFG = M.cfg, EXS = M.exercises, INTRO = M.intro;
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* dark-theme syntax highlighter for the monospace renderer (logs, code, commands) */
function hl(raw){
  var re=/(\d{2}:\d{2}:\d{2})|\b(T\d{4}(?:\.\d{3})?)\b|\b([A-Za-z][A-Za-z0-9_-]*)=|("(?:[^"\\\n]|\\.)*")|\b(BLOCKED|FAILED|DENIED|NO ACTION)\b|\b(SUCCESS|OK|ENABLED|RUNNING|PASS|ok)\b|(\d{1,3}(?:\[\.\]\d{1,3}){3})|\b(WARNING|WARN|NOT DEFINED)\b/g;
  var out='',last=0,m;
  while((m=re.exec(String(raw)))){
    out+=esc(raw.slice(last,m.index));
    if(m[1])out+='<span class="tok-t">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tok-t">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tok-k">'+esc(m[3])+'</span>=';
    else if(m[4])out+='<span class="tok-s">'+esc(m[4])+'</span>';
    else if(m[5])out+='<span class="tok-bad">'+esc(m[5])+'</span>';
    else if(m[6])out+='<span class="tok-ok">'+esc(m[6])+'</span>';
    else if(m[7])out+='<span class="tok-warn">'+esc(m[7])+'</span>';
    else out+='<span class="tok-warn">'+esc(m[8])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(raw.slice(last));
  return out;
}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function fmtDur(ms){return fmtTime(Math.round(ms/1000));}
function byId(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id)return EXS[i];}return null;}

var S={phase:'intro',state:'ENDED',order:[],idx:0,remain:CFG.timerSeconds,timerId:null,
  mode:'exam',returnedId:null,credits:{},answered:{},skipped:[],hintUsed:{},reported:false,

  user:{name:'',country:'',locale:''}};

/* ---------- timer state machine ---------- */
function setState(st){
  S.state=st;
  if(st==='RUNNING'){startTicking();}else{stopTicking();}
  renderTimerChip();
}
function startTicking(){if(!S.timerId){S.timerId=setInterval(tick,1000);}}
function stopTicking(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function tick(){
  S.remain--;
  if(S.remain<=0){S.remain=0;renderTimer();finishByTimeout();return;}
  renderTimer();
}
function renderTimer(){var t=$('tval');if(t)t.textContent=fmtTime(S.remain);}
function renderTimerChip(){
  var c=$('tstate');if(!c)return;
  if(S.state==='RUNNING'){c.className='tstate run';c.innerHTML='&#9654; RUNNING';}
  else if(S.state==='PAUSED_MANUAL'){c.className='tstate pman';c.innerHTML='&#9208; PAUSED — manual (press Resume)';}
  else if(S.state==='PAUSED_AUTO_CHECK'){c.className='tstate pauto';c.innerHTML='&#9208; PAUSED — reviewing feedback (resumes on Next)';}
  else{c.className='tstate end';c.innerHTML='&#9632; ENDED';}
}

/* ---------- scoring ---------- */
function creditCalc(H,W,N){return Math.max(0,(H-W)/N);}
function creditAfterHint(c,id){return S.hintUsed[id]?Math.max(0,c-0.10):c;}
function scoreSum(){var s=0;for(var k in S.credits){s+=S.credits[k];}return s;}
function answeredCount(){var n=0;for(var k in S.answered){if(S.answered[k])n++;}return n;}

function startExam(){
  S.phase='exam';S.mode='exam';S.order=shuffle(EXS.map(function(e){return e.id;}));
  S.attempt=(S.attempt||0)+1;
  S.idx=0;S.credits={};S.answered={};S.skipped=[];S.hintUsed={};S.reported=false;
  S.remain=CFG.timerSeconds;S.pausedManualMs=0;S.pausedAutoMs=0;
  renderShell();
  setState('RUNNING');
  renderExercise();
}

function renderShell(){
  var bar=el('div','topbar');

  row.appendChild(el('span','scorebox','Score <b id="sctext">0.0 / 0</b> <span id="scpct" class="small">(0%)</span>'));
  row.appendChild(el('span','spacer'));
  var bh=el('button','btn amber','&#128161; Hint');bh.id='hintBtn';bh.addEventListener('click',onHint);
  var bp=el('button','btn purple','&#9208; Pause');bp.id='pauseBtn';bp.addEventListener('click',onPause);
  var bs=el('button','btn grey','&#9193; Skip');bs.id='skipBtn';bs.addEventListener('click',onSkip);
  row.appendChild(bh);row.appendChild(bp);row.appendChild(bs);

  var main=el('div','wrap');main.id='main';
  var app=$('app');app.innerHTML='';app.appendChild(bar);app.appendChild(main);
  renderTimerChip();renderTimer();renderScore();renderProgress();renderCounter();
}

function renderCounter(){
  var e=$('excount');if(!e)return;
  var n=Math.min(S.idx+1,S.order.length);
  if(S.phase==='exam'&&S.mode==='exam'){e.textContent='Exercise '+n+' of '+S.order.length;}
  else if(S.phase==='exam'){e.textContent='Reviewing a skipped exercise';}
}
function renderScore(){
  var sum=scoreSum(),n=answeredCount();
  var s=$('sctext'),p=$('scpct');
  if(!s)return;
  s.textContent=(Math.round(sum*10)/10)+' / '+n;
  var pct=n>0?Math.round(sum/n*100):0;
  p.textContent='('+pct+'%)';
}
function renderProgress(){
  var p=$('pbar');if(!p)return;
  var done=answeredCount()+S.skipped.length;
  p.style.width=Math.min(100,Math.round(done/S.order.length*100))+'%';
}

function curEx(){return byId(S.mode==='returned'?S.returnedId:S.order[S.idx]);}

/* ---------- exercise rendering ---------- */

function buildLog(log){
  var wrap=el('div','artefact');
  wrap.appendChild(el('span','artlabel',esc(log.title||'LOG VIEWER')));
  var bar=el('div','logbar');
  var inp=document.createElement('input');
  inp.type='text';inp.placeholder='Filter lines (text match)...';
  inp.setAttribute('aria-label','Filter log lines');
  var cnt=el('span','lcount',log.lines.length+' lines');
  bar.appendChild(inp);bar.appendChild(cnt);wrap.appendChild(bar);
  var lv=el('div','logview');var pre=el('pre');
  var raw=log.lines;
  var spans=raw.map(function(l){return el('div',null,hl(l));});
  spans.forEach(function(s){pre.appendChild(s);});
  lv.appendChild(pre);wrap.appendChild(lv);
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),n=0;
    spans.forEach(function(s,i){
      var on=!q||raw[i].toLowerCase().indexOf(q)>=0;
      s.style.display=on?'':'none';
      if(on){n++;
        if(q){
          var idx=raw[i].toLowerCase().indexOf(q);
          var before=raw[i].slice(0,idx),match=raw[i].slice(idx,idx+q.length),after=raw[i].slice(idx+q.length);
          s.innerHTML=hl(before)+'<span class="hit">'+esc(match)+'</span>'+hl(after);
        }else{s.innerHTML=hl(raw[i]);}
      }
    });
    cnt.textContent=n+' / '+raw.length+' lines';
  });
  return wrap;
}

/* ---------- answer builders (per type) ---------- */
function buildAnswer(ex,area){
  var t=ex.type;
  if(t==='qcm'||t==='multi')buildChoice(ex,area);
  else if(t==='match')buildMatch(ex,area);
  else if(t==='dnd')buildDnd(ex,area);
  else if(t==='order'||t==='rank')buildOrder(ex,area);
  else if(t==='fib')buildFib(ex,area);
  else if(t==='spot')buildSpot(ex,area);
  else if(t==='branch')buildBranch(ex,area);
}

function buildMatch(ex,area){

  RT.rOrder=rOrder;

    r.dataset.left=i;
    r.addEventListener('click',function(){
      if(RT.locked)return;
      var prev=lc.querySelector('.armed');if(prev)prev.classList.remove('armed');

      RT.armedLeft=i;r.classList.add('armed');

        var prow=rc.querySelector('[data-right="'+oldR+'"]');if(prow){prow.classList.remove('used');prow.querySelector('.pairtag').remove();}
      }
      RT.pairs[RT.armedLeft]=ri;RT.rightUsed[ri]=RT.armedLeft;
      var lrow=lc.querySelector('[data-left="'+RT.armedLeft+'"]');
      lrow.classList.add('used');lrow.classList.remove('armed');
      if(!lrow.querySelector('.pairtag')){

/* ---------- grading ---------- */
function gradeExercise(ex){
  var t=ex.type,res={credit:0,rows:[],correctSummary:'',formula:null};
  if(t==='qcm'||t==='multi'){
    var opts=ex[t].options,N=0,oi;
    for(oi=0;oi<opts.length;oi++){if(opts[oi].correct)N++;}
    var H=0,W=0;
    var notes=ex.itemNotes||[];
    for(oi=0;oi<opts.length;oi++){
      var sel=!!RT.sel[oi],cor=!!opts[oi].correct;
      if(cor&&sel){H++;res.rows.push({s:'ok',text:opts[oi].t,note:notes[oi]||null});}
      else if(cor&&!sel){res.rows.push({s:'miss',text:opts[oi].t,note:notes[oi]||null});}
      else if(!cor&&sel){W++;res.rows.push({s:'bad',text:opts[oi].t,note:notes[oi]||null});}
    }
    res.credit=creditCalc(H,W,N);
    if(N>1)res.formula={H:H,W:W,N:N};
    res.correctSummary=opts.filter(function(o){return o.correct;}).map(function(o){return o.t;}).join(' · ');
    for(oi=0;oi<opts.length;oi++){
      if(opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-correct');
      else if(!opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-wrong');
    }
  }
  else if(t==='match'){
    var d=ex.match,N=d.left.length,H=0,W=0,notes=ex.itemNotes||[];
    var pairs=[];
    d.left.forEach(function(l,i){
      var ok=RT.pairs[i]===i;
      if(ok)H++;else W++;
      pairs.push('<span class="kw">'+esc(l)+'</span> &#8596; <span class="kw">'+esc(d.right[i])+'</span>');
      res.rows.push({s:ok?'ok':'bad',text:l,note:ok?(notes[i]||null):((notes[i]||'')+' Correct partner: <span class="kw">'+esc(d.right[i])+'</span>')});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=pairs.join(' &nbsp;|&nbsp; ');
  }
  else if(t==='dnd'){
    var d2=ex.dnd,N=d2.bank.length,H=0,W=0,notes=ex.itemNotes||[];
    d2.bank.forEach(function(it,i){
      var p=RT.place[i];
      var ok=p===it.slot;
      if(p===undefined){res.rows.push({s:'miss',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b> (you left it in the bank).'});}
      else if(ok){H++;res.rows.push({s:'ok',text:it.t,note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b>. Correct slot chosen: <b>'+esc(d2.slots[p].label)+'</b>.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d2.bank.map(function(it){return '<span class="kw">'+esc(it.t)+'</span> &#8594; '+esc(d2.slots[it.slot].label);}).join(' · ');
  }
  else if(t==='order'||t==='rank'){
    var d3=ex[t],N=d3.items.length,H=0,W=0,notes=ex.itemNotes||[];
    RT.arr.forEach(function(oi,pos){
      var ok=oi===pos;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',text:d3.items[oi],note:ok?(notes[oi]||null):(notes[oi]?notes[oi]+' ':'')+'Correct position: <b>'+(posIn(d3.items,d3.items[oi])+1)+'</b> (you placed it '+(pos+1)+').'});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    var arr2=d3.items.map(function(it,i){return '<b>'+(i+1)+'</b>. '+esc(it);});
    res.correctSummary=arr2.join(' &#8594; ');
  }
  else if(t==='fib'){
    var d4=ex.fib,N=d4.answers.length,H=0,W=0,notes=ex.itemNotes||[];
    d4.answers.forEach(function(ans,i){
      var sel=RT.fill[i];
      if(sel===undefined){res.rows.push({s:'miss',text:'Blank '+(i+1)+': correct word is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else if(d4.bank[sel]===ans){H++;res.rows.push({s:'ok',text:'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:'Blank '+(i+1)+': you wrote <span class="kw">'+esc(d4.bank[sel])+'</span>, correct is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d4.answers.map(function(ans,i){return 'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>';}).join(' · ');
    d4.answers.forEach(function(ans,i){var s=RT.slots[i];if(s){s.textContent=d4.bank[RT.fill[i]]||ans;}});
  }
  else if(t==='spot'){
    var d5=ex.spot,corr=d5.correctIdx,N=corr.length,H=0,W=0,notes=ex.itemNotes||[];
    corr.forEach(function(li){
      if(RT.mark[li]){H++;res.rows.push({s:'ok',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:notes[li]||null});}
      else{res.rows.push({s:'miss',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:(notes[li]||'')+' This line is part of the problem but you did not mark it.'});}
    });
    d5.lines.forEach(function(l,i){
      if(corr.indexOf(i)<0&&RT.mark[i]){W++;res.rows.push({s:'bad',text:'Line '+(i+1)+': '+esc(d5.lines[i]),note:'This line is fine — marking it was a wrong item.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary='Problem lines: '+corr.map(function(li){return (li+1);}).join(', ');
  }
  else if(t==='branch'){
    var d6=ex.branch,N=d6.steps.length,H=0,W=0,notes=ex.itemNotes||[];
    d6.steps.forEach(function(st,i){
      var sel=RT.stepSel[i],ok=sel!==undefined&&!!st.options[sel].correct;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',
        text:'Step '+(i+1)+': '+(ok?'you chose the right action.':'you chose <span class="kw">'+esc(sel!==undefined?st.options[sel].t:'(no answer)')+'</span>; correct is <span class="kw">'+esc(correctOptText(st.options))+'</span>.'),
        note:notes[i]||null});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d6.steps.map(function(st,i){return 'Step '+(i+1)+': '+correctOptText(st.options);}).join(' · ');
  }
  return res;
}
function displayIndex(disp,oi){for(var i=0;i<disp.length;i++){if(disp[i].oi===oi)return i;}return -1;}
function posIn(arr,x){for(var i=0;i<arr.length;i++){if(arr[i]===x)return i;}return -1;}
function correctOptText(opts){for(var i=0;i<opts.length;i++){if(opts[i].correct)return opts[i].t;}return '';}

/* ---------- flow: check / next / skip / hint / pause ---------- */
function answerMissing(ex){
  var t=ex.type,k,any;
  if(t==='qcm'||t==='multi'){any=false;for(k in RT.sel){if(RT.sel[k]){any=true;break;}}if(!any)return 'Choose at least one option first — or press Skip if you want to move on.';}
  else if(t==='match'){any=false;for(k in RT.pairs){any=true;break;}if(!any)return 'Pair at least one item with a partner first — or press Skip.';}
  else if(t==='dnd'){any=false;for(k in RT.place){any=true;break;}if(!any)return 'Place at least one item into a slot first — or press Skip.';}
  else if(t==='spot'){any=false;for(k in RT.mark){if(RT.mark[k]){any=true;break;}}if(!any)return 'Mark at least one line first — or press Skip.';}
  return null;
}
function onCheck(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(ex.type==='branch'&&RT.step<ex.branch.steps.length)return;
  var need=answerMissing(ex);
  if(need){var cn=$('checknote');if(cn){cn.textContent=need;cn.classList.add('show');}return;}
  var res=gradeExercise(ex);
  var credit=creditAfterHint(res.credit,ex.id);
  S.credits[ex.id]=credit;S.answered[ex.id]=true;
  var si=S.skipped.indexOf(ex.id);if(si>=0)S.skipped.splice(si,1);
  S.pauseStart=Date.now();
  setState('PAUSED_AUTO_CHECK');
  RT.locked=true;
  var chk=$('checkBtn');chk.disabled=true;
  var sk=$('skipBtn');if(sk)sk.disabled=true;
  var hb=$('hintBtn');if(hb)hb.disabled=true;
  var cn=$('checknote');if(cn)cn.classList.remove('show');
  renderFeedback(ex,res,credit);
  renderScore();renderProgress();
  var nxt=$('nextBtn');
  if(S.mode==='exam'&&S.idx>=S.order.length-1)nxt.innerHTML='Final Submit &#9194;';
  else if(S.mode==='returned')nxt.innerHTML='Back to skipped list &#8592;';
  else nxt.innerHTML='Next exercise &#9194;';
  nxt.removeAttribute('hidden');
}
function renderFeedback(ex,res,credit){
  var fb=$('feedback');
  var cls=credit>=1?'f-correct':(credit>0?'f-partial':'f-incorrect');
  var label=credit>=1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT');
  if(res.formula&&credit<1){
    label+=' — credit '+credit.toFixed(2)+' ('+res.formula.H+' correct, '+res.formula.W+' wrong, of '+res.formula.N+' items)';
  }
  if(S.hintUsed[ex.id])label+=' · hint used (−0.10)';
  fb.className=cls;fb.innerHTML='';
  fb.appendChild(el('div','fbhead',label));
  var body=el('div','fbbody');
  if(res.formula)body.appendChild(el('div','formulaline','credit = max(0, (H &#8722; W) / N) = ('+res.formula.H+' &#8722; '+res.formula.W+') / '+res.formula.N+' = '+credit.toFixed(2)+' (before hint penalty)'));
  body.appendChild(el('div',null,'<b>Correct answer:</b> '+res.correctSummary));
  if(res.rows.length){
    var rows=el('div','fbrows');
    res.rows.forEach(function(r){
      var row=el('div','fbrow '+(r.s==='ok'?'r-ok':(r.s==='bad'?'r-bad':'r-miss')));
      row.appendChild(el('span','ficon',r.s==='ok'?'&#10003;':(r.s==='bad'?'&#10007;':'&#9675;')));
      row.appendChild(el('span','fword',r.s==='ok'?'Correct':(r.s==='bad'?'Wrong':'Missed')));
      row.appendChild(el('span','ftext',r.text+(r.note?'<span class="fnote">'+r.note+'</span>':'')));
      rows.appendChild(row);
    });
    body.appendChild(rows);
  }
  var ex2=el('div','fbexplain');
  ex2.appendChild(el('div','exlabel','WHY'));
  ex2.appendChild(el('div',null,ex.explanation));
  body.appendChild(ex2);
  if(credit<1&&ex.study){
    var sb=el('div','studybox');
    sb.appendChild(el('div','slabel','WHAT TO STUDY'));
    sb.appendChild(el('div',null,ex.study));
    body.appendChild(sb);
  }
  fb.appendChild(body);
  fb.removeAttribute('hidden');
  fb.setAttribute('tabindex','-1');fb.focus({preventScroll:false});
}
function onNext(){
  if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
  if(S.mode==='returned'){S.mode='review';setState('RUNNING');renderReview();return;}
  if(S.idx<S.order.length-1){S.idx++;setState('RUNNING');renderExercise();}
  else{afterQueue();}
}
function onSkip(){
  if(S.mode!=='exam'||S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.skipped.indexOf(ex.id)<0)S.skipped.push(ex.id);
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{afterQueue();}
  renderProgress();
}
function onHint(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.hintUsed[ex.id])return;
  S.hintUsed[ex.id]=true;
  var hb=$('hintbox');
  hb.innerHTML='<span class="hlabel">&#128161; HINT (one per exercise — costs 0.10 credit)</span><div>'+ex.hint+'</div>';
  hb.removeAttribute('hidden');
  $('hintBtn').disabled=true;
}
function onPause(){
  if(S.state==='PAUSED_MANUAL'){
    S.pausedManualMs+=Date.now()-S.pauseStart;
    S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=true;
    setState(S.prevState);
  }else if(S.state==='RUNNING'||S.state==='PAUSED_AUTO_CHECK'){
    if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
    S.prevState=S.state;S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=false;
    var vt=$('veiltitle'),vm=$('veilmsg');
    if(S.prevState==='PAUSED_AUTO_CHECK'){vt.innerHTML='&#9208; Paused — break during feedback review';vm.textContent='You were reviewing feedback. The timer is already stopped. Resuming returns you to the feedback, still paused until you press Next.';}
    else{vt.innerHTML='&#9208; Paused — manual break';vm.textContent='The exercise is hidden and the timer is stopped. Press Resume when you are ready.';}
    setState('PAUSED_MANUAL');
  }
}
function afterQueue(){
  S.phase='review';S.mode='review';
  setState('RUNNING');
  renderReview();
}
function renderReview(){
  var v=el('div','wrap');
  var c=el('div','card');
  c.appendChild(el('h2','sect','Review skipped exercises'));
  if(S.skipped.length===0){
    c.appendChild(el('p',null,'You have no skipped exercises left. You can submit the exam.'));
  }else{
    c.appendChild(el('p',null,'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it, as long as the timer has not ended. Skipped exercises that stay unanswered are excluded from your score.'));
    S.skipped.forEach(function(id){
      var ex=byId(id);
      var row=el('div','skiprow');
      row.appendChild(el('span','sic','&#9888;'));
      row.appendChild(el('span','stx','<b>Skipped — '+esc(ex.summary)+'</b><span class="small">Not answered yet. It will be excluded from scoring if you submit now.</span>'));
      var b=el('button','btn blue','Return to exercise');
      b.addEventListener('click',function(){
        S.mode='returned';S.returnedId=id;S.phase='exam';
        var idx=S.order.indexOf(id);if(idx>=0)S.idx=idx;
        setState('RUNNING');
        renderShell();renderExercise();
      });
      row.appendChild(b);
      c.appendChild(row);
    });
  }
  var nav=el('div','navrow');
  var fin=el('button','btn primary big','&#10003; Final Submit');
  fin.addEventListener('click',finishExam);
  nav.appendChild(fin);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
}
function finishByTimeout(){
  setState('ENDED');
  document.getElementById('pauseveil').hidden=true;
  S.phase='results';
  renderResults(true);
}
function finishExam(){
  setState('ENDED');
  S.phase='results';
  renderResults(false);
}
function renderResults(timedOut){
  var v=el('div','wrap');
  var sum=scoreSum(),n=answeredCount();
  var pct=n>0?Math.round(sum/n*100):0;
  var passed=pct>=CFG.passMark;
  var c=el('div','card');
  c.appendChild(el('h2','sect','Final results'));
  c.appendChild(el('p','small',timedOut?'The timer ended. Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.':'Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.'));
  var big=el('div','resbig');
  var pctEl=el('div','pct','0%');pctEl.id='respct';
  big.appendChild(pctEl);
  big.appendChild(el('div','sc','score <b>'+(Math.round(sum*10)/10)+'</b> over <b>'+n+'</b> answered of '+S.order.length+' exercises (pass mark '+CFG.passMark+'%)'));
  c.appendChild(big);
  var fullyC=0,partC=0,partSum=0,fullyW=0;
  for(var k in S.credits){var cr=S.credits[k];if(cr>=1)fullyC++;else if(cr>0){partC++;partSum+=cr;}else fullyW++;}
  var grid=el('div','resgrid');
  function cell(cls,num,lab){var d=el('div','rescell '+cls);d.appendChild(el('div','rc-num',num));d.appendChild(el('div','rc-lab',lab));grid.appendChild(d);}
  cell('c-ok','&#10003; '+fullyC,'Fully correct');
  cell('c-partial','&#10003; '+partC+(partC?' (avg '+(partSum/partC).toFixed(2)+')':''),'Partially correct');
  cell('c-bad','&#10007; '+fullyW,'Fully incorrect');
  cell('c-skip','&#9888; '+(S.order.length-n),'Skipped — excluded');
  c.appendChild(grid);
  var pan=el('div',passed?'passpanel':'failpanel');
  pan.appendChild(el('div','pl',passed?'&#10003; PASS':'&#10007; FAIL'));
  pan.appendChild(el('p',passed?'Congratulations — you reached the pass mark of '+CFG.passMark+'%. You have completed this practice exam on '+esc(CFG.objId)+' — '+esc(CFG.objName)+'.':'You did not reach the pass mark of '+CFG.passMark+'%. Read the explanations again, study the keywords, and retake the exam. A new shuffle awaits you.'));
  if(S.user.name)pan.appendChild(el('p','small','Certificate for: <b>'+esc(S.user.name)+'</b>'+(S.user.country&&S.user.country!=='ZZ'?' ('+esc(S.user.country)+')':'')));
  c.appendChild(pan);
  c.appendChild(el('div','pausereport','Time report — manual pauses: <b>'+fmtDur(S.pausedManualMs)+'</b> · feedback review time (auto-pause): <b>'+fmtDur(S.pausedAutoMs)+'</b> · time remaining when finished: <b>'+fmtTime(S.remain)+'</b>'));
  var nav=el('div','navrow');
  var rt=el('button','btn primary big','&#8635; Retake Exam');
  rt.addEventListener('click',function(){renderIntro();});
  nav.appendChild(rt);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
  /* score counter animation: report exactly once per attempt, after it settles */
  var myAttempt=S.attempt;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  function postOnce(){if(!S.reported){S.reported=true;reportScore(sum,n,pct,passed);}}
  if(reduce||pct===0){pctEl.textContent=pct+'%';postOnce();return;}
  var start=null,dur=900;
  function step(ts){
    if(S.attempt!==myAttempt)return;
    if(start===null)start=ts;
    var p=Math.min(1,(ts-start)/dur);
    pctEl.textContent=Math.round(pct*p)+'%';
    if(p<1){requestAnimationFrame(step);}
    else{pctEl.textContent=pct+'%';postOnce();}
  }
  requestAnimationFrame(step);
}
function reportScore(creditSum,answeredCount_,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      batch:CFG.batch,
      score:Math.round(creditSum),
      total:answeredCount_,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=String(event.data.username||'');
  S.user.country=String(event.data.country||'');
  S.user.locale=String(event.data.locale||'');
});
document.addEventListener('DOMContentLoaded',function(){
  $('veilresume').addEventListener('click',onPause);
  renderIntro();
});
</script>
</body>
</html>
