<script>
var M = {"meta": {"topicId": "m1043", "batch": 2, "title": "M1043 Credential Access Protection — MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 40, "passMark": 70}, "cfg": {"topicId": "m1043", "batch": 2, "examTitle": "M1043 — MEDIUM practice exam", "objId": "M1043", "objName": "Credential Access Protection", "objType": "Mitigation", "sevLabel": "MEDIUM", "timerSeconds": 2400, "passMark": 70, "partLabel": null, "estimatedMinutes": 40}, "intro": {"learn": "<p>This exam is about <b>M1043 — Credential Access Protection</b>, a <b>Mitigation</b> in MITRE ATT&amp;CK. At the EASY level you learned what it is; here you learn to <b>work with it</b>: which techniques it actually addresses, which artefact implements each measure, and where its limits are. M1043 addresses <b>T1003 OS Credential Dumping</b> (its most famous form is <b>T1003.001 LSASS Memory</b>), <b>T1547.008 LSASS Driver</b> (a malicious driver that loads at boot), <b>T1558.005 Ccache Files</b> (Linux Kerberos ticket files, protected with SELinux), and the family around <b>T1601 Modify System Image</b> and <b>T1599 Network Boundary Bridging</b> — embedded network devices that store local passwords, which must always be encrypted per vendor guidance.</p><p>Imagine you are a SOC analyst with one year of experience. An EDR alert shows a process opening lsass.exe. You must map it to the right technique, say which M1043 measure would have reduced the damage, and hand a concrete action to the platform team. Later, a GRC analyst asks you how M1043 maps to the NIST CSF <b>Protect</b> function, and why <b>M1032 Multi-factor Authentication</b> is a useful complement. You will also handle the trade-offs: Credential Guard needs hardware and firmware support and is not on by default; it does not stop DCSync; setting cached logons to zero stops offline sign-in. These two-sided facts are what medium-level questions are made of.</p>", "keywords": [{"theme": "Techniques addressed by M1043", "items": ["<b>T1003 / T1003.001</b> — OS Credential Dumping / LSASS Memory (Credential Access, Lateral Movement)", "<b>T1547.008</b> — Boot or Logon Autostart Execution: LSASS Driver (Persistence, Privilege Escalation)", "<b>T1558.005</b> — Steal or Forge Kerberos Tickets: Ccache Files", "<b>T1601 (+.001, .002)</b> — Modify / Patch / Downgrade System Image", "<b>T1599 (+.001)</b> — Network Boundary Bridging / NAT Traversal"]}, {"theme": "Measures & implementation artefacts", "items": ["Credential Guard = virtualisation-based security isolating lsass.exe", "Cached credentials = GPO 'Interactive logon: Number of previous logons to cache' set to 0", "Restrict Access to Credential Storage = least privilege on SAM and other stores", "Monitor for Credential Dumping Tools = process behaviour analytics (Mimikatz, WCE)", "SELinux entry points, process types and file labels for ccache files"]}, {"theme": "Credential Guard facts & limits", "items": ["Not configured by default", "Has hardware and firmware requirements", "Does not protect against <b>all</b> forms of credential dumping", "Local SAM accounts and DCSync (T1003.006) remain out of its reach"]}, {"theme": "Workflow & frameworks", "items": ["Pilot rollout: check requirements, pilot, verify, expand", "IR priority after a dump: contain, reset, close gaps", "NIST CSF mapping: the Protect function", "Complementary mitigations: M1032 MFA, M1026 Privileged Account Management, M1027 Password Policies"]}], "how": "<p>This exam has <b>16 exercises</b> and a <b>40-minute countdown</b>. Pass mark: <b>70%</b>. Each exercise combines two ideas — you must decide what to look at first, then connect the facts.</p><ul class='plain'><li><b>Exercise types in this file:</b> multi-select with partial credit, one branching decision scenario, log-viewer analysis with a filter box, matching, fill-in-the-blank, spot-the-problem-lines, ordering, ranking, and a few single-answer questions.</li><li><b>Two kinds of pause.</b> The <b>Pause</b> button hides the exercise and stops the timer until you press Resume. Pressing <b>Check</b> auto-pauses the timer so you can read the feedback as long as you like; it resumes only on <b>Next</b>.</li><li><b>Partial credit.</b> For multi-item exercises, credit = (correct items − wrong items) ÷ total items. A hint costs 0.10 credit of that exercise. Skipped-and-never-answered exercises are excluded from the score.</li></ul>"}, "exercises": [{"id": "m01", "type": "multi", "concepts": ["Techniques addressed", "Coverage boundaries"], "summary": "Which techniques does M1043 actually address?", "scenario": {"intro": "Your GRC analyst built a mini-matrix and asks you to check it. She listed six techniques and wants only the ones the M1043 page addresses.", "panels": [{"label": "ARTEFACT 1 — Draft coverage list", "code": true, "text": "M1043 draft coverage:\n1. T1003.001  OS Credential Dumping: LSASS Memory\n2. T1547.008  Boot or Logon Autostart Execution: LSASS Driver\n3. T1558.005  Steal or Forge Kerberos Tickets: Ccache Files\n4. T1601      Modify System Image\n5. T1566.002  Phishing: Spearphishing Link\n6. T1110      Brute Force"}]}, "question": "<b>Select every technique the M1043 mitigation page really addresses. Wrong picks cancel correct ones.</b>", "hint": "Three of the six are about taking credentials out of a Windows or Linux store or from a network device. Two arrive before any credential exists.", "multi": {"options": [{"t": "T1003.001 — OS Credential Dumping: LSASS Memory", "correct": true}, {"t": "T1547.008 — Boot or Logon Autostart Execution: LSASS Driver", "correct": true}, {"t": "T1558.005 — Steal or Forge Kerberos Tickets: Ccache Files", "correct": true}, {"t": "T1601 — Modify System Image (device password storage)", "correct": true}, {"t": "T1566.002 — Phishing: Spearphishing Link", "correct": false}, {"t": "T1110 — Brute Force", "correct": false}]}, "itemNotes": ["The M1043 page ties Credential Guard to T1003 and its LSASS Memory sub-technique.", "The page says: enable Credential Guard to run lsass.exe isolated without device drivers — that addresses T1547.008.", "For T1558.005 the page prescribes SELinux entry points, process types and file labels.", "For T1601 the page says local passwords on embedded network devices must always be encrypted.", "Spearphishing is initial access — no credential store is involved; other mitigations cover it.", "Brute force guesses passwords instead of stealing them; M1043 targets the theft side."], "explanation": "The M1043 page addresses <b>T1003 (and .001 LSASS Memory)</b> via Credential Guard, <b>T1547.008</b> because Credential Guard runs lsass.exe isolated without device drivers, <b>T1558.005</b> via SELinux protections for ccache files, and <b>T1601</b> (and the T1599 family) via always encrypting local passwords on network devices. Spearphishing and brute force are real attacks, but they do not steal credentials from a store — they arrive earlier or guess — so they sit outside M1043.", "study": "Open the M1043 page and read the 'Techniques Addressed by Mitigation' table row by row."}, {"id": "m02", "type": "branch", "concepts": ["Detection-to-mitigation workflow", "Credential Guard"], "summary": "EDR alert on FILESERV-03: lsass handle from a temp-folder tool", "scenario": {"intro": "You are on shift. The queue shows a new EDR alert on FILESERV-03, a member server.", "panels": [{"label": "ARTEFACT 1 — EDR alert", "code": true, "text": "ALERT #2231 (medium)\nHOST: FILESERV-03\nprocess-access: lsass.exe\n  caller: C:\\Users\\svc_backup\\AppData\\Local\\Temp\\svcmon.exe\n  GrantedAccess: 0x1010\n  note: caller signed=NO, first-seen=today"}]}, "question": "<b>Answer the three decision steps. They are graded together when you press Check after the last step.</b>", "hint": "Walk the chain: what is happening, which measure reduces it, what the platform team should do first.", "branch": {"steps": [{"question": "Step 1 — What does this event most likely show?", "options": [{"t": "An attempt to access LSASS memory — likely credential dumping (T1003.001)", "correct": true}, {"t": "A routine antivirus scan touching system processes", "correct": false}, {"t": "A Windows update replacing lsass.exe", "correct": false}]}, {"question": "Step 2 — Which M1043 measure would have reduced the value of this access?", "options": [{"t": "Use Credential Guard — lsass runs isolated, so dumping reveals far less", "correct": true}, {"t": "Disable Cached Credentials — it stops tools from opening lsass", "correct": false}, {"t": "Encrypt email attachments — it hides the dump file", "correct": false}]}, {"question": "Step 3 — What should the platform team do first after containment?", "options": [{"t": "Enable Credential Guard where FILESERV-03 hardware meets the requirements", "correct": true}, {"t": "Reinstall FILESERV-03 from scratch", "correct": false}, {"t": "Close the alert as a false positive because the tool is small", "correct": false}]}]}, "itemNotes": ["An unsigned, first-seen binary opening lsass with memory-read access is the classic dump pattern — map it to T1003.001.", "Credential Guard isolates LSASS secrets, so even a successful dump yields much less. The cached-logons and email measures do not touch lsass.", "The durable fix is applying the measure: enable Credential Guard where requirements are met, then re-test."], "explanation": "Step 1: an unsigned, first-seen tool in a temp folder opening lsass.exe with GrantedAccess 0x1010 is the standard shape of an <b>LSASS memory dumping attempt (T1003.001)</b>. Step 2: the M1043 measure that weakens this attack is <b>Credential Guard</b> — lsass runs in an isolated virtualised environment, so stolen memory no longer yields usable domain secrets. Step 3: after containment, the platform team applies the measure where the hardware meets the requirements — reinstalling or dismissing the alert changes nothing about the next attempt.", "study": "Practise the chain: telemetry, technique, mitigation measure, owner action."}, {"id": "m03", "type": "qcm", "concepts": ["Technique mapping from logs"], "summary": "Log triage: which technique ID matches lines 2-4?", "scenario": {"intro": "You open the console for host WS-FIN-229 and see six events around one minute of activity.", "panels": [{"label": "SOC console — WS-FIN-229", "log": {"title": "EDR + identity events (06:41 local)", "lines": ["08:40:58  logon-success  user=jlee  type=interactive  host=WS-FIN-229", "08:41:03  process-access  target=lsass.exe  caller=C:\\Users\\jlee\\AppData\\Local\\Temp\\svcmon.exe  GrantedAccess=0x1010", "08:41:04  process-create  cmd=\"svcmon.exe dump lsass out.dmp\"  user=jlee", "08:41:40  file-create  path=C:\\Temp\\out.dmp  size=41MB  owner=jlee", "08:42:10  ntp-sync  status=ok", "08:44:00  av-quickscan  result=0-threats"]}}]}, "question": "<b>Which ATT&amp;CK technique best matches the behaviour in lines 2 to 4?</b>", "hint": "The caller opens lsass, dumps it, and a .dmp file appears. Name the technique that does exactly this.", "qcm": {"options": [{"t": "T1003.001 — OS Credential Dumping: LSASS Memory", "correct": true}, {"t": "T1558.005 — Steal or Forge Kerberos Tickets: Ccache Files", "correct": false}, {"t": "T1547.008 — Boot or Logon Autostart Execution: LSASS Driver", "correct": false}, {"t": "T1003.006 — OS Credential Dumping: DCSync", "correct": false}]}, "explanation": "Lines 2 to 4 show the full dump chain: a process opens <b>lsass.exe</b>, a command literally says 'dump lsass', and a <b>.dmp file</b> appears. That is <b>T1003.001 — LSASS Memory</b>, the technique Credential Guard (an M1043 measure) protects. Ccache files (T1558.005) live on Linux, an LSASS driver (T1547.008) would appear at boot time, and DCSync (T1003.006) is directory replication against a domain controller — none of those match a local .dmp file on a workstation.", "study": "Fast technique mapping saves triage time: look for the artefact (dump file, replication call, boot driver) before naming the technique."}, {"id": "m04", "type": "match", "concepts": ["Measures to artefacts"], "summary": "Match each M1043 measure to the artefact that implements it", "scenario": {"intro": "An auditor asks: 'For each M1043 measure, show me the artefact that proves it is implemented.' Match the measures to their implementing artefacts."}, "question": "<b>Match each measure to its implementing artefact.</b>", "hint": "One artefact is a Windows feature name, one is a GPO setting, one is a file ACL, one is a behaviour analytic.", "match": {"left": ["Use Credential Guard", "Disable Cached Credentials", "Restrict Access to Credential Storage", "Monitor for Credential Dumping Tools"], "right": ["Windows Defender Credential Guard with virtualisation-based security", "GPO: Interactive logon: Number of previous logons to cache = 0", "Least-privilege ACL on C:\\Windows\\System32\\config\\SAM", "Behaviour analytics that flag unknown tools opening lsass.exe"]}, "itemNotes": ["Credential Guard is implemented as a Windows feature using virtualisation-based security.", "The cached-credentials measure lands as exactly that GPO setting, set to 0.", "Restricting storage means real ACLs on stores like the SAM file — only Administrators.", "The monitoring measure is implemented as behaviour analytics for lsass access, not just antivirus signatures."], "explanation": "Auditors do not accept measure names — they accept artefacts. <b>Credential Guard</b> shows up as the Windows feature with virtualisation-based security running. <b>Disable Cached Credentials</b> shows up as the GPO value set to 0. <b>Restrict Access to Credential Storage</b> shows up as tight ACLs on the SAM file. <b>Monitor for Credential Dumping Tools</b> shows up as behaviour analytics on lsass access (the M1043 page mentions tools like Mimikatz and the Windows Credential Editor). Being able to name the artefact for each measure is what makes M1043 auditable.", "study": "For every mitigation measure you own, know the artefact an auditor can screenshot."}, {"id": "m05", "type": "fib", "concepts": ["Credential Guard requirements & limits"], "summary": "Complete the Credential Guard facts for the risk register", "scenario": {"intro": "The risk register needs three exact words about Credential Guard. Fill them from the bank — two near-miss words are traps."}, "question": "<b>Complete the three blanks with the correct words.</b>", "hint": "The ATT&CK page says: not configured by default, requirements on two layers of the platform, and not protection against every form.", "fib": {"text": "Risk register — Credential Guard: it is not configured by default and has <button class=\"fibslot\">_____1_____</button> and <button class=\"fibslot\">_____2_____</button> requirements. It also does not protect against <button class=\"fibslot\">_____3_____</button> forms of credential dumping.", "bank": ["hardware", "firmware", "all", "software", "some", "most"], "answers": ["hardware", "firmware", "all"]}, "itemNotes": ["Credential Guard has hardware requirements (for example virtualisation support).", "It also has firmware requirements (for example UEFI Secure Boot).", "The page says it does not protect against ALL forms of credential dumping — weaker words soften the real limit."], "explanation": "The M1043 page states three facts you must carry into any risk register: Credential Guard is <b>not configured by default</b>; it has <b>hardware</b> and <b>firmware</b> system requirements; and it <b>does not protect against all forms of credential dumping</b>. Writing 'some' or 'most' would understate the gap — planning teams must assume uncovered dumping forms still work.", "study": "Quote the exact page wording in risk registers — softened wording hides real risk."}, {"id": "m06", "type": "qcm", "concepts": ["T1547.008 rationale"], "summary": "Why does a Credential Access mitigation address an Autostart technique?", "scenario": {"intro": "In a matrix review, a colleague frowns: 'M1043 is about stealing credentials. Why does it also address T1547.008, an Autostart technique? That is persistence, not credential theft.'"}, "question": "<b>What is the best answer to the colleague?</b>", "hint": "Look at the T1547.008 name: LSASS Driver. Then think about what Credential Guard does to lsass.exe and drivers.", "qcm": {"options": [{"t": "Credential Guard runs lsass.exe isolated and driver-free, so a planted LSASS driver cannot load", "correct": true}, {"t": "Because device drivers are credentials too, so every driver technique belongs under M1043", "correct": false}, {"t": "Because T1547.008 is a tactic label, and tactics pair directly with mitigations", "correct": false}, {"t": "Because Credential Guard stops the machine from booting whenever any driver is present", "correct": false}]}, "explanation": "T1547.008 is the autostart entry <b>'Boot or Logon Autostart Execution: LSASS Driver'</b> — an attacker plants a driver that loads together with lsass.exe, which is both persistence and a stepping stone into credential theft. The M1043 page addresses it directly: on Windows 10 and Server 2016, enabling Credential Guard <b>runs lsass.exe in an isolated virtualised environment without any device drivers</b>, so the malicious-driver path is closed. The technique protects the credential store even though its tactic label starts with persistence.", "study": "Mitigations address techniques, not tactic labels — read each table row for its own reason."}, {"id": "m07", "type": "dnd", "concepts": ["Coverage boundaries"], "summary": "Sort six behaviours: M1043 helps here, or needs another mitigation", "scenario": {"intro": "You are tuning the coverage matrix. Sort the six behaviours into what M1043 helps with and what needs a different mitigation."}, "question": "<b>Drag each behaviour into the correct box.</b>", "hint": "M1043 protects stored credentials: LSASS memory, LSASS drivers, ccache files, device password storage. Guessing and phishing happen before any store is touched.", "dnd": {"slots": [{"label": "M1043 helps here"}, {"label": "Needs a different mitigation"}], "bank": [{"t": "Dumping LSASS memory (T1003.001)", "slot": 0}, {"t": "Planting an LSASS driver at boot (T1547.008)", "slot": 0}, {"t": "Reading Kerberos ccache files (T1558.005)", "slot": 0}, {"t": "Brute-forcing an SSH login (T1110)", "slot": 1}, {"t": "Spearphishing link for first access (T1566.002)", "slot": 1}, {"t": "DCSync replication abuse (T1003.006)", "slot": 1}]}, "itemNotes": ["LSASS memory dumping is the core technique Credential Guard protects.", "The LSASS driver autostart path is closed by Credential Guard's isolated, driver-free lsass.", "Ccache files are protected with SELinux labels — part of M1043's guidance.", "Brute force guesses passwords; it never steals them from a store. Password policies and MFA fit here.", "Spearphishing brings the attacker in; M1043 does not touch initial access.", "DCSync abuses replication over the network — Credential Guard does not cover it (see also M1026 and M1032)."], "explanation": "M1043 helps where credentials are <b>stored and stolen</b>: LSASS memory, an LSASS driver autostart, Linux ccache files, and device password storage. Brute force <b>guesses</b> passwords (password policies and MFA are the fit), spearphishing <b>arrives</b> with the attacker (email and web mitigations fit), and DCSync <b>replicates</b> credentials over the network — a known limit of Credential Guard that privileged-account management must cover. Sorting behaviours this way is the daily work of a coverage review.", "study": "Learn the M1043 boundaries: it protects stores, not guesses, not email, not replication abuse."}, {"id": "m08", "type": "spot", "concepts": ["Measures in practice", "Baseline review"], "summary": "Baseline review: click the 2 lines that undermine M1043", "scenario": {"intro": "A teammate pasted the new Windows baseline into the ticket for review. Two lines quietly undermine M1043 measures."}, "question": "<b>Click the two lines that undermine M1043 measures.</b>", "hint": "One line widens who can touch credential stores; the other keeps old sign-ins saved.", "spot": {"lines": ["Baseline M1043 — Windows endpoints (draft 2)", "Restrict administrative access to C:\\Windows\\System32\\config\\SAM to Administrators only", "Grant domain users temporary local admin rights for software installs", "Enable Credential Guard on hardware that meets the requirements", "Keep 'Interactive logon: Number of previous logons to cache' at 10 for offline convenience", "Enforce Secure Boot with DEP and ASLR enabled", "Review lsass access behaviour analytics each quarter"], "correctIdx": [2, 4]}, "itemNotes": ["", "", "Line 3: giving all domain users local admin defeats 'Restrict Access to Credential Storage' — the SAM is only as safe as the weakest local admin.", "", "Line 5: a cache of 10 keeps old domain sign-ins on disk — the opposite of the Disable Cached Credentials measure."], "explanation": "Line <b>3</b> hands local admin rights to ordinary users — the 'Restrict Access to Credential Storage' measure needs least privilege on stores like the SAM, and a big admin population destroys that. Line <b>5</b> keeps ten cached domain logons on every laptop, which is exactly what the <b>Disable Cached Credentials</b> measure asks you to remove. The remaining lines implement real measures and can stay.", "study": "In baseline reviews, hunt for lines that look helpful but cancel a named measure."}, {"id": "m09", "type": "order", "concepts": ["Credential Guard rollout"], "summary": "Order the Credential Guard rollout steps", "scenario": {"intro": "The platform team books a change window to bring Credential Guard to 4,000 endpoints. Someone shuffled the runbook steps — put them back in order."}, "question": "<b>Put the four rollout steps in the correct order.</b>", "hint": "Requirements first, then a small group, then proof it works, then everyone.", "order": {"items": ["Confirm hardware and firmware requirements on each endpoint model (UEFI Secure Boot, virtualisation support)", "Enable Credential Guard for a pilot group", "Verify virtualisation-based security is running and lsass is isolated", "Expand the configuration to the whole fleet"]}, "itemNotes": ["The M1043 page warns that Credential Guard has hardware and firmware requirements — check before you enable.", "A pilot group catches breakage cheaply.", "Verification proves VBS is actually running — 'enabled' and 'running' are different things.", "Only after a verified pilot does fleet-wide expansion make sense."], "explanation": "The order matters because Credential Guard is <b>not configured by default and has hardware and firmware requirements</b>. Checking requirements first avoids bricked pilots; a pilot group limits blast radius; verification confirms virtualisation-based security truly runs; and only then does the fleet expand. Enabling fleet-wide first and hoping is the classic outage recipe.", "study": "Every measure with system requirements rolls out in the same shape: check, pilot, verify, expand."}, {"id": "m10", "type": "rank", "concepts": ["IR priority after a dump"], "summary": "Rank the four response actions after a confirmed Mimikatz dump", "scenario": {"intro": "An investigation confirms Mimikatz ran on LT-4471 and a memory dump succeeded. Four actions are on the table — rank them from most to least urgent."}, "question": "<b>Rank the actions from most urgent (top) to least urgent (bottom).</b>", "hint": "First stop ongoing theft, then invalidate what was stolen, then fix the hole, then write it down.", "rank": {"items": ["Isolate LT-4471 from the network", "Force a reset of the credentials that were exposed in memory", "Review M1043 hardening gaps on LT-4471 and its peers", "Update the incident report with scope and lessons"]}, "itemNotes": ["Containment first: an isolated host cannot dump more or send the loot out.", "Exposed passwords, hashes and tickets stay valid until reset — resetting revokes the attacker's key.", "Hardening gaps (was Credential Guard on? why was lsass reachable?) come after containment and reset.", "Reporting is essential but does not stop an active adversary."], "explanation": "The M1043 page is preventive, but when prevention already failed the order is: <b>contain</b> (isolate the host so dumping and exfiltration stop), <b>invalidate</b> (reset the credentials that were in memory — a stolen hash or ticket works until you kill it), <b>harden</b> (close the M1043 gaps so the next attempt fails), and <b>document</b>. Jumping to hardening while the attacker still holds valid credentials is the classic mistake.", "study": "Contain, invalidate, harden, document — the four beats of credential-theft response."}, {"id": "m11", "type": "qcm", "concepts": ["Trade-offs", "Disable Cached Credentials"], "summary": "Field engineers can no longer sign in offline — why?", "scenario": {"intro": "Two days after a GPO change, helpdesk collects tickets: field engineers with poor connectivity cannot sign in to their laptops at remote sites. Nothing else changed.", "panels": [{"label": "ARTEFACT 1 — Change ticket #7745", "code": true, "text": "Change: apply M1043 baseline to field laptops\nGPO: Interactive logon: Number of previous\n      logons to cache  10 -> 0\nScope: 612 field laptops"}]}, "question": "<b>What is the most likely explanation for the offline sign-in failures?</b>", "hint": "Connect the GPO value to what cached logons are for in the first place.", "qcm": {"options": [{"t": "With the cache at 0, a laptop that cannot reach a domain controller cannot sign the user in", "correct": true}, {"t": "Credential Guard blocks all offline sign-in on laptops by design", "correct": false}, {"t": "Secure Boot needs the network to verify the boot chain remotely", "correct": false}, {"t": "The corporate VPN certificate expired on all 612 laptops", "correct": false}]}, "explanation": "Cached domain logons exist exactly for the offline case: they let a laptop sign you in when no domain controller is reachable. The change set the cache to <b>0</b> — the value M1043's <b>Disable Cached Credentials</b> measure asks for — so offline sign-in now fails by design. Credential Guard does not block offline logon, Secure Boot works without a network, and nothing in the ticket touches VPNs. The fix is governance: plan exceptions or connectivity for the offline cohort, do not silently revert the control.", "study": "Every preventive control has a breakage side — know it before the helpdesk calls."}, {"id": "m12", "type": "multi", "concepts": ["Network device guidance (T1601/T1599)", "Plain-text passwords"], "summary": "Router config review: select the 2 risky password lines", "scenario": {"intro": "M1043 also speaks about embedded network devices: local passwords must always be encrypted, per vendor recommendations. Audit the EDGE-RTR-01 config excerpt.", "panels": [{"label": "Running config — EDGE-RTR-01", "log": {"title": "config excerpt (auditor view)", "lines": ["hostname EDGE-RTR-01", "username audit privilege 15 password 0 Winter2026", "username audit privilege 15 secret 9 $9$kZtWq8fJ..", "enable password Cisc0Backup", "service password-encryption", "line vty 0 4  transport input ssh"]}}]}, "question": "<b>Select the two lines that keep a local password effectively unencrypted or weakly protected.</b>", "hint": "Vendor type-0 means plain text. And 'enable password' is the weak sibling of 'enable secret'.", "multi": {"options": [{"t": "Line 2 — username audit ... password 0 Winter2026", "correct": true}, {"t": "Line 4 — enable password Cisc0Backup", "correct": true}, {"t": "Line 3 — username audit ... secret 9 ...", "correct": false}, {"t": "Line 5 — service password-encryption", "correct": false}, {"t": "Line 6 — transport input ssh", "correct": false}]}, "itemNotes": ["Line 2: vendor type-0 stores the password in plain text in the config — exactly what M1043/T1601 guidance forbids.", "Line 4: 'enable password' stores a weakly protected secret; 'enable secret' with a strong hash is the vendor-recommended form.", "Line 3: 'secret 9' uses a strong salted hash — this is the recommended form.", "Line 5: this service only obfuscates legacy type-7 strings; it does not fix the two problems above.", "Line 6: restricting VTY to SSH is good hygiene, unrelated to password storage."], "explanation": "For T1601 and the T1599 family, the M1043 page says: <b>ensure local passwords are always encrypted, per vendor recommendations</b>. Line 2 stores the audit account password with vendor type <b>0</b> — plain text in the config file. Line 4 uses <b>enable password</b>, the weak legacy form, instead of <b>enable secret</b>. Line 3 is the correct hardened pattern (secret with a strong hash). Note that 'service password-encryption' does not save you — it only obfuscates legacy type-7 strings, which are reversible.", "study": "M1043 is not Windows-only — network devices that store local passwords fall under it too."}, {"id": "m13", "type": "multi", "concepts": ["Credential Guard limits"], "summary": "Select the TRUE limits of Credential Guard", "scenario": {"intro": "A service owner read a vendor blog claiming 'Credential Guard stops all credential theft'. Select the statements that are actually TRUE."}, "question": "<b>Select every TRUE statement about Credential Guard's limits. Wrong picks cancel correct ones.</b>", "hint": "The M1043 page itself warns that not all dumping forms are covered. Think about what is NOT inside isolated LSASS.", "multi": {"options": [{"t": "It does not stop DCSync (T1003.006), which abuses directory replication over the network", "correct": true}, {"t": "It does not protect local SAM accounts on the endpoint", "correct": true}, {"t": "It needs hardware and firmware support and is not on by default", "correct": true}, {"t": "It stops every known form of credential dumping", "correct": false}, {"t": "It is enabled by default on every Windows 10 installation", "correct": false}]}, "itemNotes": ["DCSync asks the domain cont /* dark-theme syntax highlighter for the monospace renderer (logs, code, commands) */
function hl(raw){
  var re=/(\d{2}:\d{2}:\d{2})|\b(T\d{4}(?:\.\d{3})?)\b|\b([A-Za-z][A-Za-z0-9_-]*)=|("(?:[^"\\\n]|\\.)*")|\b(BLOCKED|FAILED|DENIED|NO ACTION)\b|\b(SUCCESS|OK|ENABLED|RUNNING|PASS|ok)\b|(\d{1,3}(?:\[\.\]\d{1,3}){3})|\b(WARNING|WARN|NOT DEFINED)\b/g;
  var out='',last=0,m;
  while((m=re.exec(String(raw)))){
    out+=esc(raw.slice(last,m.index));
    if(m[1])out+='<span class="tok-t">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tok-t">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tok-k">'+esc(m[3])+'</span>=';
    else if(m[4])out+='<span class="tok-s">'+esc(m[4])+'</span>';
    else if(m[5])out+='<span class="tok-bad">'+esc(m[5])+'</span>';
    else if(m[6])out+='<span class="tok-ok">'+esc(m[6])+'</span>';
    else if(m[7])out+='<span class="tok-warn">'+esc(m[7])+'</span>';
    else out+='<span class="tok-warn">'+esc(m[8])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(raw.slice(last));
  return out;
}

function buildLog(log){
  var wrap=el('div','artefact');
  wrap.appendChild(el('span','artlabel',esc(log.title||'LOG VIEWER')));
  var bar=el('div','logbar');
  var inp=document.createElement('input');
  inp.type='text';inp.placeholder='Filter lines (text match)...';
  inp.setAttribute('aria-label','Filter log lines');
  var cnt=el('span','lcount',log.lines.length+' lines');
  bar.appendChild(inp);bar.appendChild(cnt);wrap.appendChild(bar);
  var lv=el('div','logview');var pre=el('pre');
  var raw=log.lines;
  var spans=raw.map(function(l){return el('div',null,hl(l));});
  spans.forEach(function(s){pre.appendChild(s);});
  lv.appendChild(pre);wrap.appendChild(lv);
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),n=0;
    spans.forEach(function(s,i){
      var on=!q||raw[i].toLowerCase().indexOf(q)>=0;
      s.style.display=on?'':'none';
      if(on){n++;
        if(q){
          var idx=raw[i].toLowerCase().indexOf(q);
          var before=raw[i].slice(0,idx),match=raw[i].slice(idx,idx+q.length),after=raw[i].slice(idx+q.length);

        }else{s.innerHTML=hl(raw[i]);}
      }
    });
    cnt.textContent=n+' / '+raw.length+' lines';
  });
  return wrap;
}

      RT.armedLeft=i;r.classList.add('armed');
    });
    lc.appendChild(r);
  });
  rOrder.forEach(function(ri,k){
    var r=optRow(String.fromCharCode(65+k),d.right[ri]);
    r.dataset.right=ri;
    r.addEventListener('click',function(){
      if(RT.locked)return;

        var oldLeft=RT.rightUsed[ri];delete RT.pairs[oldLeft];
        var orow=lc.querySelector('[data-left="'+oldLeft+'"]');if(orow){orow.classList.remove('used');orow.querySelector('.pairtag').remove();}
      }

      }
      RT.pairs[RT.armedLeft]=ri;RT.rightUsed[ri]=RT.armedLeft;
      var lrow=lc.querySelector('[data-left="'+RT.armedLeft+'"]');

}

/* ---------- grading ---------- */
function gradeExercise(ex){
  var t=ex.type,res={credit:0,rows:[],correctSummary:'',formula:null};
  if(t==='qcm'||t==='multi'){
    var opts=ex[t].options,N=0,oi;
    for(oi=0;oi<opts.length;oi++){if(opts[oi].correct)N++;}
    var H=0,W=0;
    var notes=ex.itemNotes||[];
    for(oi=0;oi<opts.length;oi++){
      var sel=!!RT.sel[oi],cor=!!opts[oi].correct;
      if(cor&&sel){H++;res.rows.push({s:'ok',text:opts[oi].t,note:notes[oi]||null});}
      else if(cor&&!sel){res.rows.push({s:'miss',text:opts[oi].t,note:notes[oi]||null});}
      else if(!cor&&sel){W++;res.rows.push({s:'bad',text:opts[oi].t,note:notes[oi]||null});}
    }
    res.credit=creditCalc(H,W,N);
    if(N>1)res.formula={H:H,W:W,N:N};
    res.correctSummary=opts.filter(function(o){return o.correct;}).map(function(o){return o.t;}).join(' · ');
    for(oi=0;oi<opts.length;oi++){
      if(opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-correct');
      else if(!opts[oi].correct&&RT.sel[oi]&&RT.rows&&RT.rows.children[displayIndex(RT.disp,oi)])RT.rows.children[displayIndex(RT.disp,oi)].classList.add('mark-wrong');
    }
  }
  else if(t==='match'){
    var d=ex.match,N=d.left.length,H=0,W=0,notes=ex.itemNotes||[];
    var pairs=[];
    d.left.forEach(function(l,i){
      var ok=RT.pairs[i]===i;
      if(ok)H++;else W++;
      pairs.push('<span class="kw">'+esc(l)+'</span> &#8596; <span class="kw">'+esc(d.right[i])+'</span>');
      res.rows.push({s:ok?'ok':'bad',text:l,note:ok?(notes[i]||null):((notes[i]||'')+' Correct partner: <span class="kw">'+esc(d.right[i])+'</span>')});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=pairs.join(' &nbsp;|&nbsp; ');
  }
  else if(t==='dnd'){
    var d2=ex.dnd,N=d2.bank.length,H=0,W=0,notes=ex.itemNotes||[];
    d2.bank.forEach(function(it,i){
      var p=RT.place[i];
      var ok=p===it.slot;
      if(p===undefined){res.rows.push({s:'miss',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b> (you left it in the bank).'});}
      else if(ok){H++;res.rows.push({s:'ok',text:it.t,note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:it.t,note:(notes[i]||'')+' Correct slot: <b>'+esc(d2.slots[it.slot].label)+'</b>. Correct slot chosen: <b>'+esc(d2.slots[p].label)+'</b>.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d2.bank.map(function(it){return '<span class="kw">'+esc(it.t)+'</span> &#8594; '+esc(d2.slots[it.slot].label);}).join(' · ');
  }
  else if(t==='order'||t==='rank'){
    var d3=ex[t],N=d3.items.length,H=0,W=0,notes=ex.itemNotes||[];
    RT.arr.forEach(function(oi,pos){
      var ok=oi===pos;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',text:d3.items[oi],note:ok?(notes[oi]||null):(notes[oi]?notes[oi]+' ':'')+'Correct position: <b>'+(posIn(d3.items,d3.items[oi])+1)+'</b> (you placed it '+(pos+1)+').'});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    var arr2=d3.items.map(function(it,i){return '<b>'+(i+1)+'</b>. '+esc(it);});
    res.correctSummary=arr2.join(' &#8594; ');
  }
  else if(t==='fib'){
    var d4=ex.fib,N=d4.answers.length,H=0,W=0,notes=ex.itemNotes||[];
    d4.answers.forEach(function(ans,i){
      var sel=RT.fill[i];
      if(sel===undefined){res.rows.push({s:'miss',text:'Blank '+(i+1)+': correct word is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else if(d4.bank[sel]===ans){H++;res.rows.push({s:'ok',text:'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
      else{W++;res.rows.push({s:'bad',text:'Blank '+(i+1)+': you wrote <span class="kw">'+esc(d4.bank[sel])+'</span>, correct is <span class="kw">'+esc(ans)+'</span>',note:notes[i]||null});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d4.answers.map(function(ans,i){return 'Blank '+(i+1)+': <span class="kw">'+esc(ans)+'</span>';}).join(' · ');
    d4.answers.forEach(function(ans,i){var s=RT.slots[i];if(s){s.textContent=d4.bank[RT.fill[i]]||ans;}});
  }
  else if(t==='spot'){
    var d5=ex.spot,corr=d5.correctIdx,N=corr.length,H=0,W=0,notes=ex.itemNotes||[];
    corr.forEach(function(li){
      if(RT.mark[li]){H++;res.rows.push({s:'ok',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:notes[li]||null});}
      else{res.rows.push({s:'miss',text:'Line '+(li+1)+': '+esc(d5.lines[li]),note:(notes[li]||'')+' This line is part of the problem but you did not mark it.'});}
    });
    d5.lines.forEach(function(l,i){
      if(corr.indexOf(i)<0&&RT.mark[i]){W++;res.rows.push({s:'bad',text:'Line '+(i+1)+': '+esc(d5.lines[i]),note:'This line is fine — marking it was a wrong item.'});}
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary='Problem lines: '+corr.map(function(li){return (li+1);}).join(', ');
  }
  else if(t==='branch'){
    var d6=ex.branch,N=d6.steps.length,H=0,W=0,notes=ex.itemNotes||[];
    d6.steps.forEach(function(st,i){
      var sel=RT.stepSel[i],ok=sel!==undefined&&!!st.options[sel].correct;
      if(ok)H++;else W++;
      res.rows.push({s:ok?'ok':'bad',
        text:'Step '+(i+1)+': '+(ok?'you chose the right action.':'you chose <span class="kw">'+esc(sel!==undefined?st.options[sel].t:'(no answer)')+'</span>; correct is <span class="kw">'+esc(correctOptText(st.options))+'</span>.'),
        note:notes[i]||null});
    });
    res.credit=creditCalc(H,W,N);res.formula={H:H,W:W,N:N};
    res.correctSummary=d6.steps.map(function(st,i){return 'Step '+(i+1)+': '+correctOptText(st.options);}).join(' · ');
  }
  return res;
}
function displayIndex(disp,oi){for(var i=0;i<disp.length;i++){if(disp[i].oi===oi)return i;}return -1;}
function posIn(arr,x){for(var i=0;i<arr.length;i++){if(arr[i]===x)return i;}return -1;}
function correctOptText(opts){for(var i=0;i<opts.length;i++){if(opts[i].correct)return opts[i].t;}return '';}

/* ---------- flow: check / next / skip / hint / pause ---------- */
function answerMissing(ex){
  var t=ex.type,k,any;
  if(t==='qcm'||t==='multi'){any=false;for(k in RT.sel){if(RT.sel[k]){any=true;break;}}if(!any)return 'Choose at least one option first — or press Skip if you want to move on.';}
  else if(t==='match'){any=false;for(k in RT.pairs){any=true;break;}if(!any)return 'Pair at least one item with a partner first — or press Skip.';}
  else if(t==='dnd'){any=false;for(k in RT.place){any=true;break;}if(!any)return 'Place at least one item into a slot first — or press Skip.';}
  else if(t==='spot'){any=false;for(k in RT.mark){if(RT.mark[k]){any=true;break;}}if(!any)return 'Mark at least one line first — or press Skip.';}
  return null;
}
function onCheck(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(ex.type==='branch'&&RT.step<ex.branch.steps.length)return;
  var need=answerMissing(ex);
  if(need){var cn=$('checknote');if(cn){cn.textContent=need;cn.classList.add('show');}return;}
  var res=gradeExercise(ex);
  var credit=creditAfterHint(res.credit,ex.id);
  S.credits[ex.id]=credit;S.answered[ex.id]=true;
  var si=S.skipped.indexOf(ex.id);if(si>=0)S.skipped.splice(si,1);
  S.pauseStart=Date.now();
  setState('PAUSED_AUTO_CHECK');
  RT.locked=true;
  var chk=$('checkBtn');chk.disabled=true;
  var sk=$('skipBtn');if(sk)sk.disabled=true;
  var hb=$('hintBtn');if(hb)hb.disabled=true;
  var cn=$('checknote');if(cn)cn.classList.remove('show');
  renderFeedback(ex,res,credit);
  renderScore();renderProgress();
  var nxt=$('nextBtn');
  if(S.mode==='exam'&&S.idx>=S.order.length-1)nxt.innerHTML='Final Submit &#9194;';
  else if(S.mode==='returned')nxt.innerHTML='Back to skipped list &#8592;';
  else nxt.innerHTML='Next exercise &#9194;';
  nxt.removeAttribute('hidden');
}
function renderFeedback(ex,res,credit){
  var fb=$('feedback');
  var cls=credit>=1?'f-correct':(credit>0?'f-partial':'f-incorrect');
  var label=credit>=1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT');
  if(res.formula&&credit<1){
    label+=' — credit '+credit.toFixed(2)+' ('+res.formula.H+' correct, '+res.formula.W+' wrong, of '+res.formula.N+' items)';
  }
  if(S.hintUsed[ex.id])label+=' · hint used (−0.10)';
  fb.className=cls;fb.innerHTML='';
  fb.appendChild(el('div','fbhead',label));
  var body=el('div','fbbody');
  if(res.formula)body.appendChild(el('div','formulaline','credit = max(0, (H &#8722; W) / N) = ('+res.formula.H+' &#8722; '+res.formula.W+') / '+res.formula.N+' = '+credit.toFixed(2)+' (before hint penalty)'));
  body.appendChild(el('div',null,'<b>Correct answer:</b> '+res.correctSummary));
  if(res.rows.length){
    var rows=el('div','fbrows');
    res.rows.forEach(function(r){
      var row=el('div','fbrow '+(r.s==='ok'?'r-ok':(r.s==='bad'?'r-bad':'r-miss')));
      row.appendChild(el('span','ficon',r.s==='ok'?'&#10003;':(r.s==='bad'?'&#10007;':'&#9675;')));
      row.appendChild(el('span','fword',r.s==='ok'?'Correct':(r.s==='bad'?'Wrong':'Missed')));
      row.appendChild(el('span','ftext',r.text+(r.note?'<span class="fnote">'+r.note+'</span>':'')));
      rows.appendChild(row);
    });
    body.appendChild(rows);
  }
  var ex2=el('div','fbexplain');
  ex2.appendChild(el('div','exlabel','WHY'));
  ex2.appendChild(el('div',null,ex.explanation));
  body.appendChild(ex2);
  if(credit<1&&ex.study){
    var sb=el('div','studybox');
    sb.appendChild(el('div','slabel','WHAT TO STUDY'));
    sb.appendChild(el('div',null,ex.study));
    body.appendChild(sb);
  }
  fb.appendChild(body);
  fb.removeAttribute('hidden');
  fb.setAttribute('tabindex','-1');fb.focus({preventScroll:false});
}
function onNext(){
  if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
  if(S.mode==='returned'){S.mode='review';setState('RUNNING');renderReview();return;}
  if(S.idx<S.order.length-1){S.idx++;setState('RUNNING');renderExercise();}
  else{afterQueue();}
}
function onSkip(){
  if(S.mode!=='exam'||S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.skipped.indexOf(ex.id)<0)S.skipped.push(ex.id);
  if(S.idx<S.order.length-1){S.idx++;renderExercise();}
  else{afterQueue();}
  renderProgress();
}
function onHint(){
  if(S.state!=='RUNNING')return;
  var ex=curEx();
  if(S.hintUsed[ex.id])return;
  S.hintUsed[ex.id]=true;
  var hb=$('hintbox');
  hb.innerHTML='<span class="hlabel">&#128161; HINT (one per exercise — costs 0.10 credit)</span><div>'+ex.hint+'</div>';
  hb.removeAttribute('hidden');
  $('hintBtn').disabled=true;
}
function onPause(){
  if(S.state==='PAUSED_MANUAL'){
    S.pausedManualMs+=Date.now()-S.pauseStart;
    S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=true;
    setState(S.prevState);
  }else if(S.state==='RUNNING'||S.state==='PAUSED_AUTO_CHECK'){
    if(S.state==='PAUSED_AUTO_CHECK'){S.pausedAutoMs+=Date.now()-S.pauseStart;}
    S.prevState=S.state;S.pauseStart=Date.now();
    document.getElementById('pauseveil').hidden=false;
    var vt=$('veiltitle'),vm=$('veilmsg');
    if(S.prevState==='PAUSED_AUTO_CHECK'){vt.innerHTML='&#9208; Paused — break during feedback review';vm.textContent='You were reviewing feedback. The timer is already stopped. Resuming returns you to the feedback, still paused until you press Next.';}
    else{vt.innerHTML='&#9208; Paused — manual break';vm.textContent='The exercise is hidden and the timer is stopped. Press Resume when you are ready.';}
    setState('PAUSED_MANUAL');
  }
}
function afterQueue(){
  S.phase='review';S.mode='review';
  setState('RUNNING');
  renderReview();
}
function renderReview(){
  var v=el('div','wrap');
  var c=el('div','card');
  c.appendChild(el('h2','sect','Review skipped exercises'));
  if(S.skipped.length===0){
    c.appendChild(el('p',null,'You have no skipped exercises left. You can submit the exam.'));
  }else{
    c.appendChild(el('p',null,'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it, as long as the timer has not ended. Skipped exercises that stay unanswered are excluded from your score.'));
    S.skipped.forEach(function(id){
      var ex=byId(id);
      var row=el('div','skiprow');
      row.appendChild(el('span','sic','&#9888;'));
      row.appendChild(el('span','stx','<b>Skipped — '+esc(ex.summary)+'</b><span class="small">Not answered yet. It will be excluded from scoring if you submit now.</span>'));
      var b=el('button','btn blue','Return to exercise');
      b.addEventListener('click',function(){
        S.mode='returned';S.returnedId=id;S.phase='exam';
        var idx=S.order.indexOf(id);if(idx>=0)S.idx=idx;
        setState('RUNNING');
        renderShell();renderExercise();
      });
      row.appendChild(b);
      c.appendChild(row);
    });
  }
  var nav=el('div','navrow');
  var fin=el('button','btn primary big','&#10003; Final Submit');
  fin.addEventListener('click',finishExam);
  nav.appendChild(fin);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
}
function finishByTimeout(){
  setState('ENDED');
  document.getElementById('pauseveil').hidden=true;
  S.phase='results';
  renderResults(true);
}
function finishExam(){
  setState('ENDED');
  S.phase='results';
  renderResults(false);
}
function renderResults(timedOut){
  var v=el('div','wrap');
  var sum=scoreSum(),n=answeredCount();
  var pct=n>0?Math.round(sum/n*100):0;
  var passed=pct>=CFG.passMark;
  var c=el('div','card');
  c.appendChild(el('h2','sect','Final results'));
  c.appendChild(el('p','small',timedOut?'The timer ended. Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.':'Your score is calculated over the exercises you answered; skipped and unanswered exercises are excluded.'));
  var big=el('div','resbig');
  var pctEl=el('div','pct','0%');pctEl.id='respct';
  big.appendChild(pctEl);
  big.appendChild(el('div','sc','score <b>'+(Math.round(sum*10)/10)+'</b> over <b>'+n+'</b> answered of '+S.order.length+' exercises (pass mark '+CFG.passMark+'%)'));
  c.appendChild(big);
  var fullyC=0,partC=0,partSum=0,fullyW=0;
  for(var k in S.credits){var cr=S.credits[k];if(cr>=1)fullyC++;else if(cr>0){partC++;partSum+=cr;}else fullyW++;}
  var grid=el('div','resgrid');
  function cell(cls,num,lab){var d=el('div','rescell '+cls);d.appendChild(el('div','rc-num',num));d.appendChild(el('div','rc-lab',lab));grid.appendChild(d);}
  cell('c-ok','&#10003; '+fullyC,'Fully correct');
  cell('c-partial','&#10003; '+partC+(partC?' (avg '+(partSum/partC).toFixed(2)+')':''),'Partially correct');
  cell('c-bad','&#10007; '+fullyW,'Fully incorrect');
  cell('c-skip','&#9888; '+(S.order.length-n),'Skipped — excluded');
  c.appendChild(grid);
  var pan=el('div',passed?'passpanel':'failpanel');
  pan.appendChild(el('div','pl',passed?'&#10003; PASS':'&#10007; FAIL'));
  pan.appendChild(el('p',passed?'Congratulations — you reached the pass mark of '+CFG.passMark+'%. You have completed this practice exam on '+esc(CFG.objId)+' — '+esc(CFG.objName)+'.':'You did not reach the pass mark of '+CFG.passMark+'%. Read the explanations again, study the keywords, and retake the exam. A new shuffle awaits you.'));
  if(S.user.name)pan.appendChild(el('p','small','Certificate for: <b>'+esc(S.user.name)+'</b>'+(S.user.country&&S.user.country!=='ZZ'?' ('+esc(S.user.country)+')':'')));
  c.appendChild(pan);
  c.appendChild(el('div','pausereport','Time report — manual pauses: <b>'+fmtDur(S.pausedManualMs)+'</b> · feedback review time (auto-pause): <b>'+fmtDur(S.pausedAutoMs)+'</b> · time remaining when finished: <b>'+fmtTime(S.remain)+'</b>'));
  var nav=el('div','navrow');
  var rt=el('button','btn primary big','&#8635; Retake Exam');
  rt.addEventListener('click',function(){renderIntro();});
  nav.appendChild(rt);c.appendChild(nav);
  v.appendChild(c);
  showView(v);
  /* score counter animation: report exactly once per attempt, after it settles */
  var myAttempt=S.attempt;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  function postOnce(){if(!S.reported){S.reported=true;reportScore(sum,n,pct,passed);}}
  if(reduce||pct===0){pctEl.textContent=pct+'%';postOnce();return;}
  var start=null,dur=900;
  function step(ts){
    if(S.attempt!==myAttempt)return;
    if(start===null)start=ts;
    var p=Math.min(1,(ts-start)/dur);
    pctEl.textContent=Math.round(pct*p)+'%';
    if(p<1){requestAnimationFrame(step);}
    else{pctEl.textContent=pct+'%';postOnce();}
  }
  requestAnimationFrame(step);
}
function reportScore(creditSum,answeredCount_,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      batch:CFG.batch,
      score:Math.round(creditSum),
      total:answeredCount_,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=String(event.data.username||'');
  S.user.country=String(event.data.country||'');
  S.user.locale=String(event.data.locale||'');
});
document.addEventListener('DOMContentLoaded',function(){
  $('veilresume').addEventListener('click',onPause);
  renderIntro();
});
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
