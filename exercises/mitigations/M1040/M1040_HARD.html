      'Behavior prevention means a protection agent on the computer — a laptop, a desktop or a server — watches what programs do. It looks at actions: starting other programs, reading secret files, writing into another program\'s memory, or using system functions in strange ways. It uses heuristics (rules of thumb) and machine learning to decide whether an action looks like an attack. It does not need to know the malware\'s name first.',

      'It does not do everything. It cannot patch software, teach people, or bring lost files back. You still need software updates (M1051), user training (M1017) and backups (M1053). Using several layers together is called defence in depth: if one layer misses an attack, another one is there.'
    ],
    roles: [
      'You will meet this mitigation in many roles. SOC analysts triage its alerts during a shift. Security engineers write its policy rules and tune false positives. Incident responders use its logs and its blocked samples as evidence. Threat intelligence analysts map attack techniques to it when they brief managers. GRC control owners point to it as proof that malware defences exist (for example CIS Control 10 or ISO 27002 A.8.7). Endpoint teams keep the agent healthy, updated and tamper-protected on every computer.'
    ],
    themes: [

        'Behavior prevention shows no measurable effect on red team results',
        'Purple-team exercises should not run against production networks'
      ], correct: 0 }
  ],
  hint: 'Perspective one asks how to be quieter. Perspective two asks how to stay loud where it matters.',
  explanation: 'Red: a blocked T1055 forces a switch to quieter techniques like T1574 execution-flow hijacking — that is the mitigation working. Blue: the durable tuning is baselining admin chains, alerting on deviations, and blocking unsigned parents — not blanket trust in signatures. Board line: the control raises attacker cost even when it does not stop everything, and each failed attempt left telemetry. Dual perspective, one conclusion: cost up, visibility up.'
},
{
  id: 'h15', type: 'fillblank', title: 'The board paragraph',
  scenario: { summary: 'The CISO drafts one paragraph for the board pack and six words go missing.',
    blocks: [
      'The CISO\'s board paragraph about endpoint prevention loses six words in the mail merge. The bank below has the six — plus three words from a different document.'
    ]},
  question: 'Tap a word, then tap a blank, to complete the board paragraph.',
  text: ['Behavior prevention gives us ', 0, '-first defence on endpoints: malicious actions are stopped before impact. No control is perfect — we accept ', 1, ' risk and layer patching, training and backups around the engine. ', 2, ' protection prevents attackers from switching the engine off. Exceptions are time-boxed with an owner, scope and ', 3, '. Coverage is measured against MITRE ATT&CK techniques and reported to the ', 4, ' quarterly. A missed block is not a failure if ', 5, ' in depth turns it into a detection and a clean recovery.'],
  bank: ['prevention', 'residual', 'tamper', 'expiry', 'board', 'defence', 'audit-only', 'signature', 'firewall'],
  blanks: ['prevention', 'residual', 'tamper', 'expiry', 'board', 'defence'],
  hint: 'Two blanks pair as "residual …" and "defence in …" — each appears once.',
  explanation: 'The paragraph is the executive story of M1040: prevention-first, accepted residual risk, tamper protection so the engine survives, time-boxed exceptions with expiry, quarterly ATT&CK-based reporting to the board, and defence in depth as the safety net. If you can say this paragraph aloud and mean it, you can brief any executive on the mitigation.'
},
{
  id: 'h16', type: 'multi', title: 'Two true limits',
  scenario: { summary: 'A vendor claims "unbreakable, all-covering" prevention. Select the honest limits.',
    blocks: [
      'A vendor deck claims their behavior prevention is "unbreakable and complete". The architecture board asks you to annotate the deck with the two statements that are actually true limits of M1040-style prevention.'
    ]},
  question: 'Select the TWO statements that correctly describe limits of behavior prevention.',
  options: [
    'A patient attacker with trusted admin tools stays under thresholds',
    'It cannot be bypassed once tamper protection is switched on',
    'Agent coverage gaps leave hosts with no prevention at all',
    'It can replace patching, backups and user training entirely',
    'It only works when the attacker\'s binary has a known signature'
  ],
  correct: [0, 2],
  hint: 'One true limit is about people\'s tools, one about machines without agents.',
  explanation: 'True limit one: tuned engines must tolerate legitimate admin tooling, and a patient attacker who borrows those tools stays under thresholds. True limit two: prevention runs on agents, so any uncovered host has none. The false claims are the vendor\'s: tamper protection raises the bar but is not magic; mitigation never replaces the other layers; and signature-independence is precisely the point of M1040. Honest limits make strong architecture.'
}
];

</script>
<script>
'use strict';
/* ============ CyberPulse Academy — M1040 Behavior Prevention on Endpoint exam engine ============ */
var C = EXAM_CONFIG;
var EX = EXERCISES;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function $(id){return document.getElementById(id);}

var S = {
  phase:'intro', order:[], pos:0, answers:{}, skipped:[], reviewMode:false,
  credits:0, answered:0, username:'',
  timeLeft:C.timerMin*60, tState:'RUNNING', tPrevState:null, tTick:null,
  pauseStart:0, pauseKind:'', pausedManualMs:0, pausedAutoMs:0,
  hintUsed:{}, reported:false, current:-1
};
var T = {RUNNING:'RUNNING', MAN:'PAUSED_MANUAL', AUTO:'PAUSED_AUTO_CHECK', END:'ENDED'};
var SEV_WORD = {easy:'EASY', medium:'MEDIUM', hard:'HARD', extreme:'EXTREMELY HARD'};

function scoreExercise(H,W,N){return Math.max(0,(H-W)/N);}
function setTimerState(st){
  if(st===S.tState)return;
  if(S.tState===T.MAN||S.tState===T.AUTO){
    var d=Date.now()-S.pauseStart;
    if(S.pauseKind==='manual'){S.pausedManualMs+=d;}else{S.pausedAutoMs+=d;}
  }
  if(st===T.MAN||st===T.AUTO){S.pauseStart=Date.now();S.pauseKind=(st===T.MAN)?'manual':'auto';}
  S.tState=st;renderTimer();
}
function renderTimer(){
  var box=$('timerBox');if(!box)return;
  $('hdTimer').textContent=fmt(S.timeLeft);
  var st=S.tState,word='',cls='t-run';
  if(st===T.RUNNING){word='RUNNING';cls='t-run';}
  else if(st===T.MAN){word='PAUSED — manual (press Resume)';cls='t-man';}
  else if(st===T.AUTO){word='PAUSED — reviewing feedback (resumes on Next)';cls='t-auto';}
  else{word='ENDED';cls='t-end';}
  box.className='timerbox '+cls;
  $('hdTimerState').textContent='⏱ '+word;
}
function startTick(){
  if(S.tTick)clearInterval(S.tTick);
  S.tTick=setInterval(function(){
    if(S.tState!==T.RUNNING)return;
    S.timeLeft--;
    if(S.timeLeft<=0){S.timeLeft=0;renderTimer();timeEnded();return;}
    renderTimer();
  },1000);
}
function timeEnded(){
  setTimerState(T.END);
  if(S.phase!=='results'){finishExam(true);}
}
function updateHeaderScore(){
  var sum=S.credits,n=S.answered;
  $('hdScore').textContent=(n>0?sum.toFixed(1):'0.0')+' / '+n;
  $('hdPct').textContent=(n>0?Math.round(sum/n*100):0)+'%';
}
function updateSkippedChip(){
  var n=0;for(var i=0;i<S.skipped.length;i++){if(!S.answers[S.skipped[i]])n++;}
  var el=$('hdSkipped');
  if(n>0){el.classList.remove('hidden');el.textContent='⚠ '+n+' skipped';}
  else{el.classList.add('hidden');}
}
function setHeaderCounter(){
  var pre=S.username?('👤 '+S.username+' — '):'';
  if(S.phase==='exam'){$('hdCounter').textContent=pre+'Exercise '+(S.pos+1)+' of '+S.order.length;}
  else if(S.phase==='review'){$('hdCounter').textContent=pre+'Reviewing skipped exercises';}
  else if(S.phase==='results'){$('hdCounter').textContent=pre+'Results';}
  else{$('hdCounter').textContent=pre;}
}

/* ============ log/mono renderer ============ */
function hlLine(l){
  var e=esc(l);
  e=e.replace(/^(\[[^\]]+\])/,'<span class="k-time">$1</span>');
  var cls='';
  if(/BLOCK|QUARANT|TERMINAT|KILLED|PREVENT|DENIED|DROPPED|INJECT/i.test(l))cls='k-bad';
  else if(/WARN|ALERT|STALE|OFFLINE|TAMPER|OUT-OF-DATE|OLD/i.test(l))cls='k-warn';
  else if(/OK|SUCCESS|UPDATED|PASS|CLEAN|COMPLETE|INFO/i.test(l))cls='k-ok';
  if(cls)e='<span class="'+cls+'">'+e+'</span>';
  return '<span class="lg">'+e+'</span>';
}
function artefactHTML(a,idx){
  var h='<div class="artefact"><div class="a-label">ARTEFACT '+(idx+1)+' — '+esc(a.artefact)+'</div><div class="a-body">';
  if(a.filter){h+='<div class="filterbox"><input type="text" class="a-filter" placeholder="Type to filter lines…" aria-label="Filter log lines"></div>';}
  if(a.mono){h+='<div class="mono">'+a.lines.map(hlLine).join('')+'</div>';}
  else{h+='<div class="a-prose">'+esc(a.text)+'</div>';}
  h+='</div></div>';
  return h;
}
function wireFilter(root){
  var inputs=root.querySelectorAll('.a-filter');
  for(var i=0;i<inputs.length;i++){
    (function(inp){
      inp.addEventListener('input',function(){
        var q=inp.value.toLowerCase();
        var body=inp.closest('.a-body');
        var lines=body.querySelectorAll('.mono .lg');
        for(var j=0;j<lines.length;j++){
          lines[j].style.display=(!q||lines[j].textContent.toLowerCase().indexOf(q)>=0)?'':'none';
        }
      });
    })(inputs[i]);
  }
}

/* ============ scenario / blocks ============ */
function scenarioBlocks(sc){
  var h='',words=0;
  var paras=[];
  for(var i=0;i<sc.blocks.length;i++){
    var b=sc.blocks[i];
    if(typeof b==='string'){paras.push('<p>'+esc(b)+'</p>');words+=b.split(/\s+/).length;}
  }
  h+=paras.join('');
  var an=0;
  for(var j=0;j<sc.blocks.length;j++){
    var b2=sc.blocks[j];
    if(typeof b2!=='string'){h+=artefactHTML(b2,an);an++;}
  }
  var long=(words+C&&(sc.summary?sc.summary.split(/\s+/).length:0))>90;
  return {html:h,long:long};
}
function renderExercise(){
  var idx=S.order[S.pos];S.current=idx;
  var ex=EX[idx];
  var app=$('app');
  var scb=scenarioBlocks(ex.scenario);
  var h='';
  h+='<div class="blk blk-scenario'+(scb.long?' sc-closed':'')+'" id="scBox">';
  h+='<div class="blk-head"><span class="ic">🗂</span> SCENARIO';
  h+='<button class="sc-toggle" id="scToggle" aria-expanded="'+(!scb.long)+'">'+(scb.long?'Show scenario ▸':'Collapse ▴')+'</button></div>';
  h+='<div class="sc-summary">'+esc(ex.scenario.summary)+'</div>';
  h+='<div class="blk-body">'+scb.html+'</div></div>';
  h+='<div class="blk blk-question"><div class="blk-head"><span class="ic">❓</span> QUESTION</div><div class="blk-body"><p><strong>'+esc(ex.question)+'</strong></p></div></div>';
  h+='<div class="blk blk-answer"><div class="blk-head"><span class="ic">✍️</span> YOUR ANSWER</div><div class="blk-body" id="answerBody"></div></div>';
  h+='<div class="wbtns" id="exButtons"><button class="btn ok" id="btnCheck">✔ Check</button><span class="small" id="checkNote"></span><span class="spacer"></span></div>';
  app.innerHTML=h;
  var tg=$('scToggle');
  tg.addEventListener('click',function(){
    var box=$('scBox');box.classList.toggle('sc-closed');
    tg.textContent=box.classList.contains('sc-closed')?'Show scenario ▸':'Collapse ▴';
    tg.setAttribute('aria-expanded',(!box.classList.contains('sc-closed'))+'');
  });
  buildWidget(ex);
  wireFilter(app);
  $('btnCheck').addEventListener('click',onCheck);
  $('btnHint').disabled=!!S.hintUsed[idx];
  $('btnSkip').classList.toggle('hidden',S.reviewMode);
  $('btnSkip').disabled=false;
  setHeaderCounter();updateSkippedChip();
  window.scrollTo(0,0);
}

/* ============ widgets ============ */
var WIDGET={};
function buildWidget(ex){
  var host=$('answerBody');
  WIDGET={get:function(){return {H:0,W:0,N:1,items:[{txt:'No answer given',state:'ms'}]}}};
  if(ex.type==='qcm')buildQCM(ex,host,false);
  else if(ex.type==='multi')buildQCM(ex,host,true);
  else if(ex.type==='match')buildMatch(ex,host);
  else if(ex.type==='categorize')buildCategorize(ex,host);
  else if(ex.type==='order')buildOrder(ex,host);
  else if(ex.type==='fillblank')buildFillBlank(ex,host);
  else if(ex.type==='decision')buildDecision(ex,host);
  else if(ex.type==='triage')buildTriage(ex,host);
}
function optRow(labelTxt,i){
  return '<button type="button" class="opt" data-i="'+i+'"><span class="olab">'+String.fromCharCode(65+i)+'.</span><span>'+esc(labelTxt)+'</span></button>';
}
function buildQCM(ex,host,multi){
  var opts=ex.options.map(function(t,i){return {t:t,correct:(multi?ex.correct.indexOf(i)>=0:ex.correct===i)};});
  opts=shuffle(opts);
  var sel={};
  host.innerHTML='<div id="qcmList">'+opts.map(function(o,i){return optRow(o.t,i);}).join('')+'</div>'+(multi?'<p class="small mt">Select all options that apply. Wrong selections subtract from correct ones.</p>':'');
  var list=$('qcmList');
  list.addEventListener('click',function(ev){
    var b=ev.target.closest('.opt');if(!b)return;
    var i=+b.getAttribute('data-i');
    if(multi){sel[i]=!sel[i];b.classList.toggle('sel',!!sel[i]);}
    else{for(var k=0;k<opts.length;k++){sel[k]=false;list.children[k].classList.remove('sel');}sel[i]=true;b.classList.add('sel');}
  });
  WIDGET.get=function(){
    var items=[],H=0,W=0,N=multi?opts.filter(function(o){return o.correct;}).length:1;
    for(var i=0;i<opts.length;i++){
      var picked=!!sel[i];
      if(multi){
        if(opts[i].correct&&picked){H++;items.push({txt:opts[i].t,state:'ok'});}
        else if(opts[i].correct&&!picked){items.push({txt:opts[i].t,state:'ms'});}
        else if(!opts[i].correct&&picked){W++;items.push({txt:opts[i].t,state:'no'});}
      }else{
        if(picked){
          if(opts[i].correct){H=1;items.push({txt:opts[i].t,state:'ok'});}
          else{W=1;items.push({txt:opts[i].t,state:'no'});}
        }
      }
    }
    if(items.length===0)items.push({txt:'No option selected',state:'ms'});
    return {H:H,W:W,N:N,items:items,correctText:opts.filter(function(o){return o.correct;}).map(function(o){return o.t;})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
  WIDGET.paint=function(a){
    var children=list.children;
    for(var i=0;i<opts.length;i++){
      var mine=null;
      for(var j=0;j<a.items.length;j++){if(a.items[j].txt===opts[i].t)mine=a.items[j];}
      if(opts[i].correct){children[i].classList.add('good');}
      else if(mine&&mine.state==='no'){children[i].classList.add('badz');}
      else if(mine&&mine.state==='ms'){children[i].classList.add('missd');}
    }
  };
}
function buildMatch(ex,host){
  var lefts=ex.pairs.map(function(p,i){return {t:p[0],right:p[1],n:i+1};});
  var rights=shuffle(ex.pairs.map(function(p){return p[1];}));
  var selLeft=null;
  var pair={}; /* leftIndex -> rightText */
  var html='<div class="matchgrid"><div class="mcol"><div class="mcolhead">Items</div><div class="mrow" id="mLeft">';
  lefts.forEach(function(l,i){html+='<div class="mitem" data-side="L" data-i="'+i+'" tabindex="0" role="button" aria-label="Item '+(i+1)+': '+esc(l.t)+'"><span class="tagno">'+(i+1)+'.</span>'+esc(l.t)+'</div>';});
  html+='</div></div><div class="mcol"><div class="mcolhead">Matches (tap an item, then tap a match)</div><div class="mrow mright" id="mRight">';
  rights.forEach(function(r){html+='<div class="mitem" data-side="R" data-t="'+esc(r)+'" tabindex="0" role="button">'+esc(r)+'</div>';});
  html+='</div></div></div>';
  host.innerHTML=html;
  var mL=$('mLeft'),mR=$('mRight');
  function paint(){
    var ls=mL.children,rs=mR.children;
    for(var i=0;i<ls.length;i++){
      var idx=+ls[i].getAttribute('data-i');
      ls[i].innerHTML='<span class="tagno">'+(idx+1)+'.</span>'+esc(lefts[idx].t)+(pair[idx]?' <span class="small">→ '+esc(pair[idx])+'</span>':'');
      ls[i].classList.toggle('focus',selLeft===idx);
    }
    for(var j=0;j<rs.length;j++){
      var t=rs[j].getAttribute('data-t');
      var owner=-1;for(var k=0;k<lefts.length;k++){if(pair[k]===t)owner=k;}
      rs[j].innerHTML=(owner>=0?'<span class="tagno">'+(owner+1)+'.</span> ':'')+esc(t);
      rs[j].classList.toggle('paired',owner>=0);
    }
  }
  function click(side,i,t){
    if(side==='L'){selLeft=(selLeft===i?null:i);}
    else if(selLeft!==null){
      for(var k=0;k<lefts.length;k++){if(pair[k]===t&&k!==selLeft)delete pair[k];}
      if(pair[selLeft]===t){delete pair[selLeft];}else{pair[selLeft]=t;}
      selLeft=null;
    }
    paint();
  }
  mL.addEventListener('click',function(ev){var m=ev.target.closest('.mitem');if(m)click('L',+m.getAttribute('data-i'));});
  mR.addEventListener('click',function(ev){var m=ev.target.closest('.mitem');if(m)click('R',null,m.getAttribute('data-t'));});
  mL.addEventListener('keydown',function(ev){var m=ev.target.closest('.mitem');if(m&&ev.key==='Enter')click('L',+m.getAttribute('data-i'));});
  mR.addEventListener('keydown',function(ev){var m=ev.target.closest('.mitem');if(m&&ev.key==='Enter')click('R',null,m.getAttribute('data-t'));});
  paint();
  WIDGET.get=function(){
    var items=[],H=0,W=0,N=lefts.length;
    lefts.forEach(function(l,i){
      if(pair[i]===undefined){items.push({txt:l.t+' → (no match chosen)',state:'ms'});}
      else if(pair[i]===l.right){H++;items.push({txt:l.t+' → '+l.right,state:'ok'});}
      else{W++;items.push({txt:l.t+' → '+pair[i],state:'no'});}
    });
    return {H:H,W:W,N:N,items:items,correctText:lefts.map(function(l){return l.t+' → '+l.right;})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}
function buildCategorize(ex,host){
  var items=shuffle(ex.items.map(function(it,i){return {t:it.t,b:it.b,id:i};}));
  var sel=null;var place={};
  var html='<div class="bank" id="dzBank"><div class="bhead">Item bank — drag a card to a zone, or tap the card then tap a zone</div><div id="bankChips">';
  items.forEach(function(it){if(place[it.id]===undefined)html+='<button type="button" class="chipitem" draggable="true" data-id="'+it.id+'">'+esc(it.t)+'</button>';});
  html+='</div></div><div class="dzgrid" id="dzGrid">';
  ex.buckets.forEach(function(b,bi){
    html+='<div class="dz" data-b="'+bi+'" tabindex="0" role="button" aria-label="Zone: '+esc(b.name)+'"><div class="dz-name">📥 '+esc(b.name)+'</div><div class="dz-drop" data-b="'+bi+'"></div><div class="hint-txt">'+esc(b.hint)+'</div></div>';
  });
  html+='</div>';
  host.innerHTML=html;
  var bankChips=$('bankChips'),grid=$('dzGrid');
  function paint(){
    bankChips.innerHTML='';
    items.forEach(function(it){
      if(place[it.id]===undefined){
        var c=document.createElement('button');c.type='button';c.className='chipitem'+(sel===it.id?' selc':'');c.setAttribute('draggable','true');c.setAttribute('data-id',it.id);c.textContent=it.t;
        bankChips.appendChild(c);
      }
    });
    var drops=grid.querySelectorAll('.dz-drop');
    for(var d=0;d<drops.length;d++){
      var bi=+drops[d].getAttribute('data-b');drops[d].innerHTML='';
      items.forEach(function(it){
        if(place[it.id]===bi){
          var c=document.createElement('button');c.type='button';c.className='chipitem'+(sel===it.id?' selc':'');c.setAttribute('data-id',it.id);
          c.innerHTML=esc(it.t)+' <span class="x" title="Move back to bank">✖</span>';
          drops[d].appendChild(c);
        }
      });
    }
  }
  function assign(id,bi){place[id]=bi;sel=null;paint();}
  bankChips.addEventListener('click',function(ev){
    var c=ev.target.closest('.chipitem');if(!c)return;
    var id=+c.getAttribute('data-id');sel=(sel===id?null:id);paint();
  });
  bankChips.addEventListener('dragstart',function(ev){var c=ev.target.closest('.chipitem');if(c){sel=+c.getAttribute('data-id');try{ev.dataTransfer.setData('text/plain',String(sel));}catch(e){}}});
  grid.addEventListener('click',function(ev){
    var x=ev.target.closest('.x');
    if(x){var cid=+x.closest('.chipitem').getAttribute('data-id');delete place[cid];paint();return;}
    var dz=ev.target.closest('.dz');
    if(dz&&sel!==null){assign(sel,+dz.getAttribute('data-b'));}
  });
  grid.addEventListener('dragover',function(ev){var dz=ev.target.closest('.dz');if(dz){ev.preventDefault();dz.classList.add('over');}});
  grid.addEventListener('dragleave',function(ev){var dz=ev.target.closest('.dz');if(dz)dz.classList.remove('over');});
  grid.addEventListener('drop',function(ev){
    var dz=ev.target.closest('.dz');if(!dz)return;ev.preventDefault();dz.classList.remove('over');
    var id=sel;if(id===null){var dt=ev.dataTransfer.getData('text/plain');id=dt?+dt:null;}
    if(id!==null&&place[id]===undefined)assign(id,+dz.getAttribute('data-b'));
  });
  paint();
  WIDGET.get=function(){
    var its=[],H=0,W=0,N=items.length;
    items.forEach(function(it){
      if(place[it.id]===undefined){its.push({txt:it.t+' (not placed)',state:'ms'});}
      else if(place[it.id]===it.b){H++;its.push({txt:it.t+' → '+ex.buckets[it.b].name,state:'ok'});}
      else{W++;its.push({txt:it.t+' → '+ex.buckets[place[it.id]].name,state:'no'});}
    });
    return {H:H,W:W,N:N,items:its,correctText:ex.items.map(function(o){return o.t+' → '+ex.buckets[o.b].name;})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}
function buildOrder(ex,host){
  var disp=shuffle(ex.items.map(function(t,i){return {t:t,id:i};}));
  var html='<p class="small">Put the steps in the right order. Use the arrows or drag the rows.</p><div class="ordlist" id="ordList">';
  disp.forEach(function(d,i){html+='<div class="ordrow" draggable="true" data-pos="'+i+'"><span class="onum">'+(i+1)+'</span><span>'+esc(d.t)+'</span><span class="octl"><button type="button" class="obtn" data-dir="-1" aria-label="Move up">↑</button><button type="button" class="obtn" data-dir="1" aria-label="Move down">↓</button></span></div>';});
  html+='</div>';
  host.innerHTML=html;
  var list=$('ordList');
  function rows(){return Array.prototype.slice.call(list.children);}
  function repaint(){
    rows().forEach(function(r,i){r.querySelector('.onum').textContent=(i+1);r.setAttribute('data-pos',i);});
  }
  function move(row,dir){
    var rs=rows(),i=rs.indexOf(row),j=i+dir;
    if(j<0||j>=rs.length)return;
    if(dir<0)list.insertBefore(row,rs[j]);else list.insertBefore(rs[j],row);
    repaint();
  }
  list.addEventListener('click',function(ev){
    var b=ev.target.closest('.obtn');if(!b)return;
    move(b.closest('.ordrow'),+b.getAttribute('data-dir'));
  });
  var dragRow=null;
  list.addEventListener('dragstart',function(ev){var r=ev.target.closest('.ordrow');if(r){dragRow=r;r.classList.add('dragging');try{ev.dataTransfer.setData('text/plain','ord');}catch(e){}}});
  list.addEventListener('dragend',function(){if(dragRow){dragRow.classList.remove('dragging');dragRow=null;}rows().forEach(function(r){r.classList.remove('dropover');});});
  list.addEventListener('dragover',function(ev){
    ev.preventDefault();
    var over=ev.target.closest('.ordrow');
    rows().forEach(function(r){r.classList.remove('dropover');});
    if(over&&dragRow&&over!==dragRow)over.classList.add('dropover');
  });
  list.addEventListener('drop',function(ev){
    ev.preventDefault();
    var over=ev.target.closest('.ordrow');
    if(over&&dragRow&&over!==dragRow){
      var rs=rows();
      list.insertBefore(dragRow,over);
      repaint();
    }
  });
  WIDGET.get=function(){
    var rs=rows(),items=[],H=0,W=0,N=ex.items.length;
    rs.forEach(function(r,i){
      var txt=r.querySelector('span:nth-child(2)').textContent;
      if(txt===ex.items[i]){H++;items.push({txt:'Position '+(i+1)+': '+txt,state:'ok'});}
      else{W++;items.push({txt:'Position '+(i+1)+': '+txt+' — expected: '+ex.items[i],state:'no'});}
    });
    return {H:H,W:W,N:N,items:items,correctText:ex.items.map(function(t,i){return (i+1)+'. '+t;})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}
function buildFillBlank(ex,host){
  var blanks=[];var bank=shuffle(ex.bank.slice());
  var fill={};
  var selChip=null;
  var text='';
  ex.text.forEach(function(part){
    if(typeof part==='number'){text+='<span class="fbblank" data-b="'+part+'" tabindex="0" role="button" aria-label="Blank '+(part+1)+'">____</span>';blanks.push(part);}
    else text+=esc(part);
  });
  var html='<div class="bank"><div class="bhead">Word bank — tap a word, then tap a blank</div><div id="fbChips">';
  bank.forEach(function(w){html+='<button type="button" class="fbchip" data-w="'+esc(w)+'">'+esc(w)+'</button>';});
  html+='</div></div><div class="fbtext" id="fbText">'+text+'</div>';
  host.innerHTML=html;
  var chips=$('fbChips'),tb=$('fbText');
  function paint(){
    var cs=chips.children;
    for(var i=0;i<cs.length;i++){
      var w=cs[i].getAttribute('data-w');
      var used=blanks.some(function(b){return fill[b]===w;});
      cs[i].classList.toggle('used',used);
      cs[i].classList.toggle('selc',selChip===w);
    }
    var bs=tb.querySelectorAll('.fbblank');
    for(var j=0;j<bs.length;j++){
      var bi=+bs[j].getAttribute('data-b');
      bs[j].textContent=fill[bi]!==undefined?fill[bi]:'____';
      bs[j].classList.toggle('filled',fill[bi]!==undefined);
    }
  }
  chips.addEventListener('click',function(ev){
    var c=ev.target.closest('.fbchip');if(!c)return;
    var w=c.getAttribute('data-w');
    var used=blanks.some(function(b){return fill[b]===w;});
    if(used)return;
    selChip=(selChip===w?null:w);paint();
  });
  function blankClick(bi){
    if(fill[bi]!==undefined){var w=fill[bi];delete fill[bi];selChip=w;paint();return;}
    if(selChip!==null){fill[bi]=selChip;selChip=null;paint();}
  }
  tb.addEventListener('click',function(ev){var b=ev.target.closest('.fbblank');if(b)blankClick(+b.getAttribute('data-b'));});
  tb.addEventListener('keydown',function(ev){var b=ev.target.closest('.fbblank');if(b&&ev.key==='Enter')blankClick(+b.getAttribute('data-b'));});
  paint();
  WIDGET.get=function(){
    var its=[],H=0,W=0,N=ex.blanks.length;
    ex.blanks.forEach(function(corr,i){
      var got=fill[i];
      if(got===undefined){its.push({txt:'Blank '+(i+1)+': (empty) — correct: '+corr,state:'ms'});}
      else if(got===corr){H++;its.push({txt:'Blank '+(i+1)+': '+corr,state:'ok'});}
      else{W++;its.push({txt:'Blank '+(i+1)+': '+got+' — correct: '+corr,state:'no'});}
    });
    return {H:H,W:W,N:N,items:its,correctText:ex.blanks.map(function(c,i){return 'Blank '+(i+1)+': '+c;})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}
function buildDecision(ex,host){
  var step=0,chosen={};
  function renderStep(){
    var st=ex.steps[step];
    var opts=shuffle(st.options.map(function(t,i){return {t:t,c:i};}));
    var h='<span class="stepchip">STEP '+(step+1)+' OF '+ex.steps.length+'</span>';
    if(st.add)h+='<div class="dec-addendum">'+esc(st.add)+'</div>';
    h+='<div id="decOpts">'+opts.map(function(o,i){return optRow(o.t,i);}).join('')+'</div>';
    if(step<ex.steps.length-1)h+='<div class="wbtns"><button class="btn primary" id="btnStepNext" disabled>Confirm and continue ▸</button><span class="small">Intermediate steps do not stop the timer.</span></div>';
    host.innerHTML=h;
    var selI=null;
    var list=$('decOpts');
    var cb=$('btnCheck');if(cb)cb.disabled=(step<ex.steps.length-1);
    list.addEventListener('click',function(ev){
      var b=ev.target.closest('.opt');if(!b)return;
      selI=+b.getAttribute('data-i');
      for(var k=0;k<opts.length;k++)list.children[k].classList.remove('sel');
      b.classList.add('sel');
      var nb=$('btnStepNext');if(nb)nb.disabled=false;
    });
    if($('btnStepNext')){
      $('btnStepNext').addEventListener('click',function(){
        chosen[step]=opts[selI].c;
        step++;renderStep();
      });
    }else{
      WIDGET.ready=function(){return selI!==null;};
      WIDGET.pick=function(){chosen[step]=opts[selI].c;};
    }
  }
  renderStep();
  WIDGET.get=function(){
    var items=[],H=0,W=0,N=ex.steps.length;
    ex.steps.forEach(function(st,i){
      var c=chosen[i];
      if(c===undefined){items.push({txt:'Step '+(i+1)+' not answered',state:'ms'});}
      else if(c===st.correct){H++;items.push({txt:'Step '+(i+1)+': '+st.options[c],state:'ok'});}
      else{W++;items.push({txt:'Step '+(i+1)+': '+st.options[c],state:'no'});}
    });
    return {H:H,W:W,N:N,items:items,correctText:ex.steps.map(function(st,i){return 'Step '+(i+1)+': '+st.options[st.correct];})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}
function buildTriage(ex,host){
  var acts=ex.actions;
  var html='<p class="small">Choose the best action for each row. Each row is scored separately.</p>';
  ex.rows.forEach(function(r,i){
    html+='<div class="trirow"><div><div class="tri-label">Event '+(i+1)+'</div><div>'+esc(r.label)+'</div></div>';
    html+='<div><select data-r="'+i+'" aria-label="Action for event '+(i+1)+'"><option value="">— choose action —</option>'+acts.map(function(a,ai){return '<option value="'+ai+'">'+esc(a)+'</option>';}).join('')+'</select></div></div>';
  });
  host.innerHTML=html;
  WIDGET.get=function(){
    var items=[],H=0,W=0,N=ex.rows.length;
    ex.rows.forEach(function(r,i){
      var sel=host.querySelector('select[data-r="'+i+'"]').value;
      if(sel===''){items.push({txt:'Event '+(i+1)+' — no action chosen',state:'ms'});}
      else if(+sel===r.correct){H++;items.push({txt:'Event '+(i+1)+' — '+acts[r.correct],state:'ok'});}
      else{W++;items.push({txt:'Event '+(i+1)+' — '+acts[+sel],state:'no'});}
    });
    return {H:H,W:W,N:N,items:items,correctText:ex.rows.map(function(r,i){return 'Event '+(i+1)+': '+acts[r.correct];})};
  };
  WIDGET.lock=function(){host.classList.add('locked');};
}

/* ============ check / feedback / navigation ============ */
function onCheck(){
  var idx=S.order[S.pos],ex=EX[idx];
  var btn=$('btnCheck');
  if(ex.type==='decision'&&WIDGET.ready){if(!WIDGET.ready())return;WIDGET.pick();}
  var g=WIDGET.get();
  var credit=scoreExercise(g.H,g.W,g.N);
  if(S.hintUsed[idx])credit=Math.max(0,credit-0.10);
  S.answers[idx]={credit:credit,H:g.H,W:g.W,N:g.N,items:g.items,correctText:g.correctText||[],type:ex.type,hint:!!S.hintUsed[idx]};
  S.credits+=credit;S.answered++;
  setTimerState(T.AUTO); /* Check-triggered auto-pause BEFORE feedback renders */
  if(WIDGET.lock)WIDGET.lock();
  if(WIDGET.paint)WIDGET.paint(S.answers[idx]);
  btn.classList.add('hidden');
  $('btnHint').disabled=true;
  $('btnSkip').disabled=true;
  var nxt=$('btnNext');
  var isLastNormal=!S.reviewMode&&(S.pos===S.order.length-1);
  var b=document.createElement('button');
  b.className='btn primary';b.id='btnNext';
  b.textContent=(S.reviewMode)?'↩ Back to review list':(isLastNormal?(hasUnansweredSkipped()?'Review skipped exercises ▸':'🏁 Final Submit'):'Next exercise ▸');
  b.addEventListener('click',goNext);
  $('exButtons').prepend(b);
  $('checkNote').textContent='';
  renderFeedback(idx,g);
  updateHeaderScore();
  $('exButtons').scrollIntoView({behavior:'smooth',block:'center'});
}
function renderFeedback(idx,g){
  var a=S.answers[idx],ex=EX[idx];
  var label,cls,icon;
  if(a.credit>=1){label='CORRECT';cls='fb-correct';icon='✔';}
  else if(a.credit>0){label='PARTIALLY CORRECT';cls='fb-partial';icon='◑';}
  else{label='INCORRECT';cls='fb-incorrect';icon='✘';}
  var multi=a.N>1;
  var h='<div class="fb '+cls+'"><div class="fb-head"><span>'+icon+'</span> '+label;
  if(a.hint)h+='<span class="chip">💡 hint used (−10% of this exercise)</span>';
  h+='</div><div class="fb-body">';
  if(multi){
    h+='<span class="fb-credit">credit '+a.credit.toFixed(2)+' — '+a.H+'/'+a.N+' items — formula: ('+a.H+' − '+a.W+') / '+a.N+' = '+a.credit.toFixed(2)+(a.hint?' − 0.10 (hint)':'')+'</span>';
    h+='<ul class="itembrk">';
    a.items.forEach(function(it){
      var ic=it.state==='ok'?'<span class="ic ok">✓ Correct</span>':(it.state==='no'?'<span class="ic no">✗ Wrong</span>':'<span class="ic ms">○ Missed</span>');
      h+='<li>'+ic+'<span>'+esc(it.txt)+'</span></li>';
    });
    h+='</ul>';
  }else{
    h+='<p><strong>Your answer:</strong> '+esc(a.items[0]?a.items[0].txt:'(none)')+'</p>';
    if(a.correctText&&a.correctText.length)h+='<p><strong>Correct answer:</strong> '+esc(a.correctText[0])+'</p>';
  }
  h+='<p>'+esc(ex.explanation)+'</p>';
  if(a.credit<1&&ex.study)h+='<div class="whatstudy"><strong>What to study:</strong> '+esc(ex.study)+'</div>';
  h+='</div></div>';
  var ansBlk=$('answerBody').closest('.blk');
  var div=document.createElement('div');div.innerHTML=h;
  ansBlk.parentElement.insertBefore(div.firstChild,ansBlk.nextSibling);
}
function hasUnansweredSkipped(){
  for(var i=0;i<S.skipped.length;i++){if(!S.answers[S.skipped[i]])return true;}
  return false;
}
function goNext(){
  setTimerState(T.RUNNING);
  if(S.reviewMode){showReview();return;}
  if(S.pos<S.order.length-1){S.pos++;renderExercise();return;}
  if(hasUnansweredSkipped()){showReview();return;}
  finishExam(false);
}
function onSkip(){
  if(S.phase!=='exam')return;
  var idx=S.order[S.pos];
  if(S.answers[idx])return;
  if(S.skipped.indexOf(idx)<0)S.skipped.push(idx);
  updateSkippedChip();
  if(S.pos<S.order.length-1){S.pos++;renderExercise();}
  else if(hasUnansweredSkipped()){showReview();}
  else finishExam(false);
}
function showReview(){
  S.phase='review';S.reviewMode=false;
  setHeaderCounter();
  var app=$('app');
  var rows=S.order.filter(function(i){return S.skipped.indexOf(i)>=0&&!S.answers[i];});
  var h='<div class="card"><h2>⏭ Review skipped exercises</h2>';
  h+='<p class="small">These exercises are not scored yet. Answer them now, or submit and they stay out of your score. The timer keeps running.</p>';
  rows.forEach(function(i){
    h+='<div class="rvrow"><span class="t">'+esc(EX[i].title)+'</span><button class="btn small primary" data-i="'+i+'">Answer ▸</button></div>';
  });
  if(rows.length===0)h+='<p>No skipped exercises left.</p>';
  h+='<div class="wbtns"><button class="btn ok" id="btnFinal">🏁 Final Submit</button><span class="small">Skipped-and-never-answered exercises are excluded from the score.</span></div></div>';
  app.innerHTML=h;
  app.querySelectorAll('button[data-i]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=+b.getAttribute('data-i');
      S.reviewMode=true;S.phase='exam';
      S.pos=S.order.indexOf(i);
      renderExercise();
    });
  });
  $('btnFinal').addEventListener('click',function(){
    if(hasUnansweredSkipped()&&!window.confirm('Some skipped exercises are still unanswered. They will be excluded from your score. Submit now?'))return;
    finishExam(false);
  });
  window.scrollTo(0,0);
}
function finishExam(timedOut){
  setTimerState(T.END);
  S.phase='results';
  var app=$('app');
  var answered=S.order.filter(function(i){return S.answers[i];});
  var sum=0;answered.forEach(function(i){sum+=S.answers[i].credit;});
  var n=answered.length;
  var full=0,part=0,zero=0,psum=0;
  answered.forEach(function(i){var c=S.answers[i].credit;if(c>=1)full++;else if(c>0){part++;psum+=c;}else zero++;});
  var skippedFinal=0;S.skipped.forEach(function(i){if(!S.answers[i])skippedFinal++;});
  var percent=n>0?Math.round(sum/n*100):0;
  var passed=percent>=C.meta.passMark;
  var h='';
  h+='<div class="res-hero '+(passed?'pass':'fail')+'">';
  h+='<div class="seal">'+(passed?'🏅':'↻')+'</div>';
  h+='<div class="bigpct">'+percent+'%</div>';
  h+='<p class="small">'+sum.toFixed(1)+' credits over '+n+' answered exercise'+(n===1?'':'s')+' · pass mark '+C.meta.passMark+'%'+(timedOut?' · time ran out':'')+'</p>';
  h+=passed
    ?'<h2>PASS — congratulations!</h2><p>You have shown command of <strong>'+esc(C.title)+'</strong>. Keep this knowledge warm: the engine changes, but behaviour never lies.</p>'
    :'<h2>NOT PASSED — retake the exam</h2><p>You did not reach the '+C.meta.passMark+'% pass mark. Review the explanations, study the pointers below, and try again.</p>';
  h+='</div>';
  h+='<div class="res-grid">';
  h+='<div class="res-cell"><div class="num" style="color:var(--green)">'+full+'</div><div class="lbl">✔ Fully correct</div></div>';
  h+='<div class="res-cell"><div class="num" style="color:var(--amber)">'+part+(part?' <span class="small">avg '+(psum/part).toFixed(2)+'</span>':'')+'</div><div class="lbl">◑ Partially correct</div></div>';
  h+='<div class="res-cell"><div class="num" style="color:var(--red)">'+zero+'</div><div class="lbl">✘ Fully incorrect</div></div>';
  h+='<div class="res-cell"><div class="num">'+skippedFinal+'</div><div class="lbl">⚠ Skipped, never answered (excluded)</div></div>';
  h+='</div>';
  h+='<div class="card mt"><h2>⏱ How your time was spent</h2><p class="small">Manual breaks: '+Math.round(S.pausedManualMs/1000)+' seconds · Reviewing feedback after Check: '+Math.round(S.pausedAutoMs/1000)+' seconds. Pressing Check always stopped the timer so you could study without pressure.</p></div>';
  if(!passed)h+='<div class="card mt center"><button class="btn primary" id="btnRetake" style="min-width:220px">↻ Retake Exam</button></div>';
  app.innerHTML=h;
  if(!passed){$('btnRetake').addEventListener('click',retake);}
  reportScore(sum,n);
  window.scrollTo(0,0);
}
function reportScore(creditSum,answeredCount){
  if(S.reported)return;S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:C.meta.topicId,
      batch:C.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){/* opened directly, nothing to report to */}
}
function retake(){
  S.phase='exam';S.order=shuffle(EX.map(function(_,i){return i;}));
  S.pos=0;S.answers={};S.skipped=[];S.reviewMode=false;S.credits=0;S.answered=0;
  S.timeLeft=C.timerMin*60;S.hintUsed={};S.reported=false;S.current=-1;
  S.pausedManualMs=0;S.pausedAutoMs=0;
  updateHeaderScore();updateSkippedChip();
  setTimerState(T.RUNNING);startTick();
  renderExercise();
}

$('btnHint').addEventListener('click',function(){
  var idx=S.order[S.pos];

  S.hintUsed[idx]=true;
  $('btnHint').disabled=true;
  $('checkNote').textContent='💡 '+EX[idx].hint;
});
$('btnPause').addEventListener('click',function(){
  if(S.phase!=='exam')return;
  if(S.tState===T.MAN){
    setTimerState(S.tPrevState||T.RUNNING);
    $('overlays').innerHTML='';
  }else{
    S.tPrevState=S.tState;
    setTimerState(T.MAN);
    $('overlays').innerHTML='<div class="overlay"><div class="panel"><h2>⏸ Paused — manual break</h2><p class="small">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</p><button class="btn primary" id="btnResume" style="min-width:200px">▶ Resume</button></div></div>';
    $('btnResume').addEventListener('click',function(){
      setTimerState(S.tPrevState||T.RUNNING);
      $('overlays').innerHTML='';
    });
  }
});
$('btnSkip').addEventListener('click',onSkip);
renderIntro();

</script>
</body>
</html>
