/* ---------- log syntax highlighting ---------- */
function hl(line){
  var e=esc(line);

function startTimer(){R.timeLeft=EXAM.minutes*60;R.pauseManualMs=0;R.pauseAutoMs=0;R.pauseManual=0;R.pauseAuto=0;R.lastTick=Date.now();R.tstate='IDLE';setT('RUNNING');if(R.tick)clearInterval(R.tick);R.tick=setInterval(function(){if(R.tstate==='RUNNING'){R.timeLeft--;if(R.timeLeft<=0){R.timeLeft=0;drawTimer();endByTimeout();return;}drawTimer();}},1000);}
function drawTimer(){var t=document.getElementById('tNum');if(t)t.textContent=mmss(R.timeLeft);var st=document.getElementById('tState');if(!st)return;
  if(R.tstate==='RUNNING'){st.innerHTML='<span class="tstate run">'+ICONS.run+' RUNNING</span>';}
  else if(R.tstate==='PAUSED_MANUAL'){st.innerHTML='<span class="tstate pause">'+ICONS.pause+' PAUSED \u2014 manual (press Resume)</span>';}
  else if(R.tstate==='PAUSED_AUTO_CHECK'){st.innerHTML='<span class="tstate pause">'+ICONS.pause+' PAUSED \u2014 reviewing feedback (resumes on Next)</span>';}
  else if(R.tstate==='ENDED'){st.innerHTML='<span class="tstate end">'+ICONS.end+' ENDED</span>';}
  else{st.innerHTML='';}}
function pauseManual(){if(R.tstate!=='RUNNING'&&R.tstate!=='PAUSED_AUTO_CHECK')return;R.manualBase=R.tstate;setT('PAUSED_MANUAL');var b=document.getElementById('exMain');if(b)b.classList.add('hidden');var pp=document.getElementById('pausePanel');if(pp)pp.classList.remove('hidden');var pb=document.getElementById('btnPause');if(pb)pb.innerHTML=ICONS.run+' Resume';}
function resumeManual(){if(R.tstate!=='PAUSED_MANUAL')return;var b=document.getElementById('exMain');if(b)b.classList.remove('hidden');var pp=document.getElementById('pausePanel');if(pp)pp.classList.add('hidden');var pb=document.getElementById('btnPause');if(pb)pb.innerHTML=ICONS.pause+' Pause';setT(R.manualBase==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING');}
function autoCheckPause(){if(R.tstate==='RUNNING'){setT('PAUSED_AUTO_CHECK');}}
function autoResume(){if(R.tstate==='PAUSED_AUTO_CHECK'){setT('RUNNING');}}
function endByTimeout(){setT('ENDED');if(R.tick)clearInterval(R.tick);toast('\u26A0 Time is over. Unanswered exercises are excluded.');renderResults();}

/* ---------- handshake + score report ---------- */
window.addEventListener('message',function(ev){
  if(!ev.data)return;
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT')return;
  R.user={username:ev.data.username||'',country:ev.data.country||'',locale:ev.data.locale||'en'};
});
function reportScore(){
  if(R.reported)return;R.reported=true;
  var p=pct(R.creditSum,R.answeredCount);
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:EXAM.id,batch:EXAM.batch,score:Math.round(R.creditSum),total:R.answeredCount,percent:p,passed:p>=EXAM.passMark},location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}

function updateProgress(){var f=document.getElementById('hFill');if(!f)return;var done=R.answers?Object.keys(R.answers).filter(function(k){return R.answers[k].state==='answered';}).length:0;f.style.width=Math.round((done/N)*100)+'%';}
function updateCounter(){var p=document.getElementById('hPos');if(p)p.textContent=(R.pos+1);}

/* ---------- attempt flow ---------- */
function startAttempt(){
  R.attempt++;R.order=shuffle(EXAM.exercises.map(function(_,i){return i;}));
  R.answers={};R.creditSum=0;R.answeredCount=0;R.memo={};R.reported=false;R.pos=-1;R.fromReview=false;R.view='exam';
  APP.innerHTML=headerHTML()+
    '<main id="exMain"></main>'+
    '<div id="pausePanel" class="pause-panel hidden" role="alert"><div class="big">'+ICONS.pause+' PAUSED \u2014 manual (press Resume)</div><p class="meta-line">The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.</p><button class="btn btn-primary" id="btnResume">'+ICONS.run+' Resume</button></div>';
  document.getElementById('btnPause').addEventListener('click',function(){if(R.tstate==='PAUSED_MANUAL'){resumeManual();}else{pauseManual();}});
  document.getElementById('btnResume').addEventListener('click',resumeManual);
  document.getElementById('btnHint').addEventListener('click',onHint);
  document.getElementById('btnSkip').addEventListener('click',onSkip);
  startTimer();
  nextPos();
}
function curEx(){return EXAM.exercises[R.order[R.pos]];}
function nextPos(){
  R.pos++;
  if(R.pos>=N){var sk=skippedPool();if(sk.length){renderReview();}else{renderResults();}return;}
  R.fromReview=false;
  window.EX.renderExercise();
}
function skippedPool(){var out=[];for(var i=0;i<N;i++){if(R.answers[i]&&R.answers[i].state==='skipped')out.push(i);}return out;}
function answeredPool(){var out=[];for(var i=0;i<N;i++){if(R.answers[i]&&R.answers[i].state==='answered')out.push(i);}return out;}
function onSkip(){
  if(!R.answers[R.pos])R.answers[R.pos]={state:'skipped'};
  if(R.fromReview){renderReview();return;}
  if(R.pos>=N-1){var sk=skippedPool();if(sk.length){renderReview();}else{renderResults();}return;}
  nextPos();
}
function onHint(){
  var ex=curEx();var m=memoFor(R.pos);
  if(m.hintUsed||m.checked)return;
  m.hintUsed=true;
  var hp=document.getElementById('hintPanel');
  if(hp){hp.innerHTML='<div class="h-t">'+ICONS.q+' Hint (\u221210% of this exercise\u2019s credit)</div><p style="margin:6px 0 0">'+esc(ex.hint)+'</p>';}
  var b=document.getElementById('btnHint');if(b)b.disabled=true;
}
function isLast(){return R.pos>=N-1;}

/* ---------- review skipped screen ---------- */
function renderReview(){
  R.view='review';
  var sk=skippedPool();
  var rows=sk.map(function(i){var ex=EXAM.exercises[R.order[i]];
    return '<div class="sk-row"><span class="sk-t">'+ICONS.warn+' Skipped</span><span class="n">'+esc(ex.t)+'</span><button class="btn btn-sm btn-primary" data-ret="'+i+'">'+ICONS.run+' Return to it</button></div>';}).join('');
  APP.innerHTML=headerHTML()+
    '<main id="exMain"><section class="card"><h2>Review skipped exercises</h2>'+
    '<p class="meta-line">'+ICONS.warn+' These exercises are skipped and unanswered. You can return to any of them and answer it. The timer keeps running; when it ends, unanswered exercises are excluded from the score. You may also submit now \u2014 skipped-and-never-answered exercises are then excluded from the score.</p>'+
    '<div class="sk-list">'+(rows||'<p class="meta-line">No skipped exercises left.</p>')+'</div>'+
    '<div class="start-row"><button class="btn btn-go" id="btnSubmit">'+ICONS.ok+' Submit the exam now</button></div></section></main>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-ret]'),function(b){b.addEventListener('click',function(){R.pos=parseInt(b.getAttribute('data-ret'),10);R.fromReview=true;window.EX.renderExercise();});});
  document.getElementById('btnSubmit').addEventListener('click',function(){renderResults();});
  updateProgress();drawTimer();
}

/* ---------- results screen ---------- */
function renderResults(){
  if(R.tstate!=='ENDED'){if(R.tick)clearInterval(R.tick);setT('ENDED');}
  R.view='results';
  var answered=answeredPool();
  var full=0,part=0,zero=0,partSum=0;
  for(var k in R.answers){var a=R.answers[k];if(a.state!=='answered')continue;if(a.credit>=1)full++;else if(a.credit>0){part++;partSum+=a.credit;}else zero++;}
  var skipped=N-answered.length;
  var p=pct(R.creditSum,R.answeredCount);
  var passed=p>=EXAM.passMark&&R.answeredCount>0;
  var cells=
    '<div class="res-cell ok"><div class="v">'+full+'</div><div class="k">'+ICONS.ok+' Fully correct</div></div>'+
    '<div class="res-cell part"><div class="v">'+part+'</div><div class="k">'+ICONS.ok+' Partially correct'+(part>0?' (avg '+fmt2(partSum/part)+')':'')+'</div></div>'+
    '<div class="res-cell bad"><div class="v">'+zero+'</div><div class="k">'+ICONS.bad+' Fully incorrect</div></div>'+
    '<div class="res-cell sk"><div class="v">'+skipped+'</div><div class="k">'+ICONS.warn+' Skipped \u2014 excluded</div></div>';
  var verdict=passed?
    '<div class="cert" role="status"><div class="c-t">'+ICONS.ok+' PASS \u2014 '+esc(EXAM.id.toUpperCase())+' '+esc(EXAM.severity)+'</div><div class="c-s">Well done'+(R.user&&R.user.username?', '+esc(R.user.username):'')+'. You reached '+p+'% \u2014 above the '+EXAM.passMark+'% pass mark. This panel is your certificate-style confirmation for the <b>'+esc(EXAM.objectName)+'</b> topic at <b>'+esc(EXAM.severity)+'</b> level.</div></div>':
    '<div class="fail-note"><div class="f-t">'+ICONS.bad+' FAIL \u2014 you must retake this exam</div><p style="margin:8px 0 0">You reached '+p+'%, below the '+EXAM.passMark+'% pass mark. Read the feedback you collected, then use Retake below. The exercise order and all answer choices will be reshuffled.</p></div>';
  APP.innerHTML=headerHTML()+
    '<main id="exMain"><section class="card"><h2>Final results</h2>'+
    '<div class="res-score"><span class="big">'+fmt1(R.creditSum)+' / '+R.answeredCount+'</span><span class="badge sev-badge"><span class="dot"></span>'+p+'%</span><span class="meta-line">computed only over answered exercises</span></div>'+
    '<div class="res-grid">'+cells+'</div>'+
    verdict+
    '<div class="time-log">'+ICONS.q.replace('?','\u23F1')+' Time used: '+mmss(Math.max(0,EXAM.minutes*60-R.timeLeft))+' of '+mmss(EXAM.minutes*60)+' \u2022 manual pauses: '+mmss(R.pauseManual)+' \u2022 feedback review time: '+mmss(R.pauseAuto)+'</div>'+
    '<div class="start-row"><button class="btn btn-primary" id="btnRetake">'+ICONS.run+' Retake Exam</button><button class="btn btn-ghost" id="btnIntro">Back to intro</button></div>'+
    '</section></main>';
  document.getElementById('btnRetake').addEventListener('click',function(){startAttempt();});
  document.getElementById('btnIntro').addEventListener('click',function(){R.view='intro';renderIntro();});
  updateProgress();drawTimer();
  reportScore();
}

/* ===== M1029 exam engine — widgets (exercise types, grading, feedback) ===== */
'use strict';
(function(){
var EX=window.EX, R=EX.R;
var ICONS={ok:'\u2713',bad:'\u2717',warn:'\u26A0',miss:'\u25CB',pin:'\u25B8',doc:'\u25A4',q:'\u003F'};
var KEYS=['A','B','C','D','E','F','G','H'];
var WIDGETS={};

function memoFor(i){return EX.memoFor(i);}
function curData(){return EXAM.exercises[R.order[R.pos]];}
function curMemo(){return memoFor(R.pos);}

/* ============ exercise chrome ============ */
function scBlock(ex){
  var inner='';
  (ex.sc||[]).forEach(function(b){
    if(b.m){
      var lines=String(b.x).split('\n').map(function(l){return '<div>'+EX.hl(l)+'</div>';}).join('');
      inner+='<div class="artefact"><div class="a-l">'+b.l+'</div><pre class="log">'+lines+'</pre></div>';
    }else{
      inner+='<div class="artefact"><div class="a-l">'+b.l+'</div><p>'+b.x+'</p></div>';
    }
  });
  if(!inner)inner='<p>'+(ex.sc0||'')+'</p>';
  return inner;
}
function qBlock(ex){return '<article class="blk blk-question"><div class="blk-h"><span class="t">'+ICONS.q.replace('?','\u003F')+' QUESTION</span></div><div class="blk-b">'+ex.q+'</div></article>';}
var ICON_Q='\u003F', ICON_TICK='\u2713', ICON_DOC='\u25A4';

function renderExercise(){
  var ex=curData(), m=curMemo();
  EX.updateCounter();
  var main=document.getElementById('exMain');
  main.innerHTML='<div class="ex">'+
    '<article class="blk blk-scenario"><div class="blk-h"><span class="t">'+ICON_DOC+' SCENARIO</span><span style="display:flex;gap:8px;align-items:center"><span class="sc-summary hidden" id="scSummary"></span><button class="coll-toggle" id="scToggle">Collapse</button></span></div>'+
    '<div class="blk-b" id="scBody">'+scBlock(ex)+'</div></article>'+
    qBlock(ex)+
    '<article class="blk blk-answer"><div class="blk-h"><span class="t">'+ICON_TICK+' YOUR ANSWER</span></div><div class="blk-b" id="ansBody"></div></article>'+
    '<div id="hintHost"></div>'+
    '<div class="ex-actions" id="exActions"><button class="btn btn-go" id="btnCheck">'+ICON_TICK+' Check</button><span class="check-msg hidden" id="checkMsg" role="status"></span></div>'+
    '<div id="fbHost"></div></div>';
  document.getElementById('scToggle').addEventListener('click',function(){
    var b=document.getElementById('scBody'),s=document.getElementById('scSummary'),t=document.getElementById('scToggle');
    if(b.classList.contains('hidden')){b.classList.remove('hidden');s.classList.add('hidden');t.textContent='Collapse';}
    else{b.classList.add('hidden');s.textContent=ex.t+' \u2014 collapsed';s.classList.remove('hidden');t.textContent='Expand';}
  });
  if(m.hintUsed)showHint(ex,m);
  var w=WIDGETS[ex.type];
  w.render(ex,m,document.getElementById('ansBody'));
  var bc=document.getElementById('btnCheck');
  bc.addEventListener('click',onCheck);
  if(ex.type==='decision'){bc.disabled=true;}
  if(m.checked){bc.disabled=true;}
  document.getElementById('btnSkip').disabled=!!m.checked;
  document.getElementById('btnHint').disabled=!!m.hintUsed||!!m.checked;
}

function showHint(ex,m){
  var h=document.getElementById('hintHost');
  if(h)h.innerHTML='<div class="hint-panel" role="note"><div class="h-t">\u003F Hint (\u221210% of this exercise\u2019s credit)</div><p style="margin:6px 0 0">'+ex.hint+'</p></div>';
  var b=document.getElementById('btnHint');if(b)b.disabled=true;
}

/* ============ grading ============ */
function onCheck(){
  var ex=curData(), m=curMemo(), w=WIDGETS[ex.type];
  var sel=w.read(ex,m);
  var msg=document.getElementById('checkMsg');
  if(sel===null){msg.textContent='\u26A0 Choose or place at least one answer before Check.';msg.classList.remove('hidden');return;}
  msg.classList.add('hidden');
  EX.autoCheckPause();
  var corr=w.correct(ex);
  var credit=EX.scoreSet(sel,corr);
  if(m.hintUsed)credit=Math.max(0,credit-0.10);
  m.checked=true;
  R.answers[R.pos]={state:'answered',credit:credit};
  R.creditSum+=credit;R.answeredCount++;
  EX.updateScore();EX.updateProgress();
  renderFeedback(ex,m,w,sel,corr,credit);
  if(w.lock)w.lock(ex,m);
  document.getElementById('btnCheck').disabled=true;
  document.getElementById('btnSkip').disabled=true;
  document.getElementById('btnHint').disabled=true;
  var nb=document.createElement('button');nb.className='btn btn-primary';nb.id='btnNext';
  var final=(EX.isLast()&&!R.fromReview);
  nb.innerHTML=(final?'\u23ED Final Submit':'\u23ED Next');
  nb.addEventListener('click',function(){
    EX.autoResume();
    if(R.fromReview){EX.renderReview();return;}
    if(EX.isLast()){if(EX.skippedPool().length){EX.renderReview();}else{EX.renderResults();}return;}
    EX.nextPos();
  });
  document.getElementById('exActions').appendChild(nb);
  var fb=document.getElementById('fbHost');if(fb&&fb.scrollIntoView)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function hwN(sel,corr){var H=0,W=0;sel.forEach(function(x){if(corr.indexOf(x)>=0)H++;else W++;});return{H:H,W:W,N:corr.length};}
function renderFeedback(ex,m,w,sel,corr,credit){
  var host=document.getElementById('fbHost');
  var cls=credit>=1?'ok':(credit>0?'part':'bad');
  var label=credit>=1?('\u2713 CORRECT'):(credit>0?('\u2713 PARTIALLY CORRECT'):('\u2717 INCORRECT'));
  var c=hwN(sel,corr);
  var creditLine='';
  if(credit<1){
    creditLine='<span class="fb-credit">credit '+((Math.round(credit*100)/100).toFixed(2))+' \u2014 (H \u2212 W) \u00F7 N = ('+Math.max(0,c.H)+' \u2212 '+c.W+') \u00F7 '+c.N+' items'+(m.hintUsed?' \u00B7 includes hint penalty \u22120.10':'')+'</span>';
  }else if(m.hintUsed){
    creditLine='<span class="fb-credit">credit '+((Math.round(credit*100)/100).toFixed(2))+' \u00B7 includes hint penalty \u22120.10</span>';
  }
  var rows=(w.rows?w.rows(ex,m,sel):[]).map(function(r){
    return '<div class="fb-item '+r.c+'"><span class="ic">'+(r.c==='good'?'\u2713':(r.c==='wrong'?'\u2717':'\u25CB'))+'</span><span>'+(r.c==='good'?'<b>Correct</b> \u2014 ':(r.c==='wrong'?'<b>Wrong</b> \u2014 ':'<b>Missed</b> \u2014 '))+r.t+'</span></div>';
  }).join('');
  host.innerHTML='<div class="fb '+cls+'" role="status" aria-label="'+(cls==='ok'?'Correct':(cls==='part'?'Partially correct':'Incorrect'))+'">'+
    '<div class="fb-h">'+label+' '+creditLine+'</div>'+
    (rows?'<div class="fb-items">'+rows+'</div>':'')+
    '<div class="fb-exp"><b>Why:</b> '+ex.ex+'</div>'+
    (ex.study?'<div class="fb-study"><b>What to study next:</b> '+ex.study+'</div>':'')+
  '</div>';
  var b=document.getElementById('scToggle');

/* ============ helpers for options ============ */
function optButtons(ex,m,ansBody,asMulti){
  var order=m.optOrder||(m.optOrder=EX.scoreSet?shuffleKey(ex.o.length):shuffleKey(ex.o.length));
  var host=document.createElement('div');host.className='opts';host.id='optHost';
  order.forEach(function(oi,disp){
    var b=document.createElement('button');b.className='opt';b.type='button';b.setAttribute('data-oi',oi);
    b.innerHTML='<span class="key">'+KEYS[disp]+'.</span><span class="txt">'+ex.o[oi]+'</span><span class="mark" aria-hidden="true"></span>';
    b.addEventListener('click',function(){
      if(host.classList.contains('locked'))return;
      if(asMulti){m.selSet=m.selSet||{};if(m.selSet[oi]){delete m.selSet[oi];b.classList.remove('sel');}else{m.selSet[oi]=true;b.classList.add('sel');}}
      else{m.choice=oi;Array.prototype.forEach.call(host.children,function(c){c.classList.remove('sel');});b.classList.add('sel');}
    });
    host.appendChild(b);
  });
  ansBody.appendChild(host);
  // restore state
  if(asMulti&&m.selSet){Object.keys(m.selSet).forEach(function(oi){var el=host.querySelector('[data-oi="'+oi+'"]');if(el)el.classList.add('sel');});}
  else if(!asMulti&&typeof m.choice==='number'){var el=host.querySelector('[data-oi="'+m.choice+'"]');if(el)el.classList.add('sel');}
  return host;
}
function shuffleKey(n){var r=[];for(var i=0;i<n;i++)r.push(i);for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function lockOpts(){var h=document.getElementById('optHost');if(h){h.classList.add('locked');Array.prototype.forEach.call(h.querySelectorAll('button'),function(b){b.disabled=true;});}}

    var step=m.dSel.length;
    var head=document.createElement('div');head.className='step-head';
    head.innerHTML='\u25A6 STEP '+(step+1)+' OF '+ex.steps.length+(m.dDone[step]?' \u2014 recorded':'');
    host.appendChild(head);
    var chips=document.createElement('div');chips.className='step-choices';
    ex.steps.forEach(function(s,i){if(m.dSel[i]!==undefined&&m.dSel[i]!==null)chips.innerHTML+='<span class="step-chip">Step '+(i+1)+': \u201C'+s.o[m.dSel[i]]+'\u201D</span>';});
    host.appendChild(chips);
    if(step<ex.steps.length){
      var s=ex.steps[step];
      var p=document.createElement('p');p.style.fontWeight='700';p.textContent=s.p;host.appendChild(p);
      var opts=document.createElement('div');opts.className='opts';
      m.dOrder[step].forEach(function(oi,disp){
        var b=document.createElement('button');b.className='opt';b.type='button';
        b.innerHTML='<span class="key">'+KEYS[disp]+'.</span><span class="txt">'+s.o[oi]+'</span>';
        b.addEventListener('click',function(){
          if(m.checked||m.dDone[step])return;
          m.dSel[step]=oi;
          Array.prototype.forEach.call(opts.children,function(c){c.classList.remove('sel');});
          b.classList.add('sel');
          var cf=document.querySelector('.dconfirm button');if(cf)cf.disabled=false;
          var bc=document.getElementById('btnCheck');if(step===ex.steps.length-1&&bc)bc.disabled=false;
        });
        if(m.dSel[step]===oi)b.classList.add('sel');
        opts.appendChild(b);
      });
      host.appendChild(opts);
      var cf=document.createElement('div');cf.className='dconfirm';
      var cb=document.createElement('button');cb.className='btn btn-warn';cb.type='button';
      cb.innerHTML=(step===ex.steps.length-1)?'\u2713 Record final choice \u2014 then press Check':'\u25B6 Confirm step';
      cb.disabled=(m.dSel[step]===undefined||m.dSel[step]===null);
      cb.addEventListener('click',function(){
        if(m.checked||m.dSel[step]===undefined)return;
        m.dDone[step]=true;
        var bc=document.getElementById('btnCheck');
        if(step===ex.steps.length-1){if(bc)bc.disabled=false;}
        rerender();
      });
      if(m.dDone[step])cb.disabled=true;
      cf.appendChild(cb);host.appendChild(cf);
    }else{
      var done=document.createElement('p');done.className='meta-line';done.textContent='All steps recorded. Press Check to see how your decision path scores. The timer stops only on this final Check.';
      host.appendChild(done);
    }
    function rerender(){var h=document.getElementById('ansBody');h.innerHTML='';WIDGETS.decision.render(ex,m,h);var bc=document.getElementById('btnCheck');if(bc)bc.disabled=!(m.dSel[ex.steps.length-1]!==undefined&&m.dSel[ex.steps.length-1]!==null);}
  },
  read:function(ex,m){if(m.dSel.length<ex.steps.length)return null;var sel=[];m.dSel.forEach(function(s,k){sel.push('S'+k+'|'+s);});return sel;},
  correct:function(ex){return ex.steps.map(function(s,k){return 'S'+k+'|'+s.a;});},
  rows:function(ex,m){
    var out=[];
    ex.steps.forEach(function(s,k){
      var got=m.dSel[k];
      if(got===s.a)out.push({c:'good',t:'Step '+(k+1)+': '+s.o[s.a]+(s.e?' \u2014 '+s.e:'')});
      else out.push({c:'wrong',t:'Step '+(k+1)+': you chose \u201C'+s.o[got]+'\u201D; the right call is \u201C'+s.o[s.a]+'\u201D'+(s.e?' \u2014 '+s.e:'')});
    });
    return out;},
  lock:function(ex,m){Array.prototype.forEach.call(document.querySelectorAll('.opts .opt'),function(b){b.disabled=true;});}
};

/* boot */
window.EX.renderExercise=renderExercise;
})();

(function boot(){ window.EX.renderIntro(); })();
</script>
