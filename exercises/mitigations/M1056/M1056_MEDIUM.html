      w.steps.forEach(function (st, i) {
        var chose = collected[i];
        var corr = w.correct[i];
        var ot = function (oid) {
          var o = st.options.filter(function (x) { return x.id === oid; })[0];
          return o ? o.text : oid;
        };
        if (chose && chose === corr) { h++; items.push({ label: 'Step ' + (i + 1) + ' — ' + ot(chose), verdict: 'correct', why: (ex.exp.items['s' + i] || '') }); }
        else if (chose) { wCount++; items.push({ label: 'Step ' + (i + 1) + ' — ' + ot(chose), verdict: 'wrong', why: 'Better: ' + ot(corr) + '. ' + (ex.exp.items['s' + i] || '') }); }
        else { items.push({ label: 'Step ' + (i + 1), verdict: 'missed', why: 'No choice recorded. Better: ' + ot(corr) + '. ' + (ex.exp.items['s' + i] || '') }); }
      });
    }
    return { credit0: scoreExercise(h, wCount, n), items: items, h: h, w: wCount, n: n };
  }

  /* ================= check / feedback / next ================= */
  function doCheck(ex) {
    if (S.checked[ex.id]) { return; }
    var wg = S.widget;
    if (!wg || !wg.isReady()) { return; }
    /* FIRST ACTION: stop the timer for feedback review */
    S.prevState = T.state === 'PAUSED_MANUAL' ? S.prevState : T.state;
    T.pauseAuto();
    S.checked[ex.id] = true;
    var collected = wg.collect();
    var g = grade(ex, collected);
    var credit = Math.max(0, g.credit0 - (S.hintUsed[ex.id] ? 0.10 : 0));
    credit = Math.round(credit * 100) / 100;
    S.credit[ex.id] = credit;
    S.status[ex.id] = (credit >= 1) ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
    wg.lock();
    renderFeedback(ex, g, credit);
    var bc = $('#btnCheck'); if (bc) { bc.disabled = true; }
    var bh = $('#btnHint'); if (bh) { bh.disabled = true; }
    var bs = $('#btnSkip'); if (bs) { bs.disabled = true; }
    updateHeader();
  }
  function feedbackBlock(ex, g, credit) {
    var st = S.status[ex.id];
    var cls = st === 'correct' ? 'correct' : (st === 'partial' ? 'partial' : 'incorrect');
    var fb = el('div', 'fb ' + cls);
    var multi = g.n > 1;
    var icon = st === 'correct' ? '✓' : (st === 'partial' ? '✓' : '✗');
    var label = st === 'correct' ? '✓ CORRECT' : (st === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var hh = el('div', 'fb-h', '<span>' + label + '</span>');
    if (multi) {
      hh.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' — ' + g.h + '/' + g.n + ' correct items, ' + g.w + ' wrong' + (S.hintUsed[ex.id] ? ', hint −0.10' : '')));
    } else if (S.hintUsed[ex.id]) {
      hh.appendChild(el('span', 'fb-credit', 'hint used: −0.10 credit'));
    }
    fb.appendChild(hh);
    var bb = el('div', 'fb-b');
    bb.appendChild(el('p', '', esc(ex.exp.intro)));
    if (multi) {
      bb.appendChild(el('p', 'small muted', 'Scoring: credit = max(0, (H − W) / N) = max(0, (' + g.h + ' − ' + g.w + ') / ' + g.n + ')' + (S.hintUsed[ex.id] ? ', then −0.10 for the hint' : '') + '.'));
    }
    g.items.forEach(function (it) {
      var row = el('div', 'fb-item');
      var v = it.verdict;
      var vt = v === 'correct' ? '<span class="iv v-c">✓ Correct</span>'
        : v === 'wrong' ? '<span class="iv v-w">✗ Wrong</span>'
        : v === 'missed' ? '<span class="iv v-m">○ Missed</span>'
        : '<span class="iv v-o">○ Not selected</span>';
      row.innerHTML = vt + '<span><strong>' + esc(it.label) + '</strong> — ' + esc(it.why) + '</span>';
      bb.appendChild(row);
    });
    if (S.status[ex.id] !== 'correct' && ex.exp.study) {
      bb.appendChild(el('div', 'study', '<strong>What to study:</strong> ' + esc(ex.exp.study)));
    }
    fb.appendChild(bb);
    return fb;
  }
  function renderFeedback(ex, g, credit) {
    var app = $('#app');
    var footers = $all('.fb-next', app);
    var footer = footers[footers.length - 1];
    var anchor = footer ? footer.parentElement : app;
    var fb = feedbackBlock(ex, g, credit);
    var note = el('div', 'autonote', '⏸ Timer paused while you review this feedback — it resumes when you press Next.');
    fb.appendChild(note);
    anchor.insertBefore(fb, footer);
    var isLast = (S.pos === S.order.length - 1);
    var next = el('button', 'btn primary', (isLast && !S.skipReturn) ? 'Final Submit ▶' : 'Next ▶');
    next.addEventListener('click', function () {
      T.resumeTo('RUNNING');
      if (S.skipReturn) {
        S.skipReturn = false;
        showScreen('review');
        return;
      }
      advance();
    });
    footer.appendChild(next);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ================= review skipped ================= */
  function renderReview(app) {
    S.current = null;
    updateHeader();
    var c = el('div', 'card');
    c.appendChild(el('h2', 'c-amber', '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'These exercises were skipped. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises left, they are excluded from your score.'));
    var list = skippedList();
    list.forEach(function (idx) {
      var ex = CFG.exercises[idx];
      var n = S.order.indexOf(idx) + 1;
      var row = el('div', 'rev-item');
      row.innerHTML = '<span class="t">⚠ Skipped</span><span class="s"><strong>Exercise ' + n + ':</strong> ' + esc(ex.summary) + '</span>';
      var b = el('button', 'btn primary', 'Answer ▶');
      b.addEventListener('click', function () {
        S.skipReturn = true;
        S.screen = 'exam';
        renderExercise(ex);
      });
      row.appendChild(b);
      c.appendChild(row);
    });
    var fin = el('button', 'btn green', 'Submit exam ▶');
    fin.style.marginTop = '14px';
    fin.addEventListener('click', function () { finishExam(); });
    c.appendChild(fin);
    app.appendChild(c);
  }

  /* ================= results ================= */
  function finishExam() {
    T.end();
  }
  function renderResults(app) {
    S.current = null;
    app.innerHTML = '';
    updateHeader();
    var answered = 0, sum = 0;
    var nC = 0, nP = 0, nW = 0, nS = 0, pSum = 0;
    CFG.exercises.forEach(function (e) {
      var st = S.status[e.id];
      if (!st || st === 'skipped') { nS++; return; }
      answered++;
      var cr = S.credit[e.id] || 0;
      sum += cr;
      if (cr >= 1) { nC++; }
      else if (cr > 0) { nP++; pSum += cr; }
      else { nW++; }
    });
    var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    var passed = percent >= PASS;

    var card = el('div', 'card');
    card.appendChild(el('h2', 'c-blue', '🏁 Final results — ' + esc(CFG.title)));
    var v = el('div', 'verdict ' + (passed ? 'pass' : 'fail'));
    v.appendChild(el('div', 'vp', passed ? '✓ PASS' : '✗ FAIL'));
    v.appendChild(el('div', 'scoreline', 'Score: <strong class="mono">' + (Math.round(sum * 10) / 10).toFixed(1) + ' / ' + answered + '</strong> — final percent <strong class="mono">' + percent + '%</strong> (pass mark ' + PASS + '%)'));
    v.appendChild(el('div', 'scoreline muted', passed
      ? 'Nice work — you showed a solid grasp of M1056 Pre-compromise at this level.'
      : 'You need 70% to pass. Review the explanations, then retake the exam — the questions and answers will be shuffled again.'));
    card.appendChild(v);
    var grid = el('div', 'res-grid');
    [['✓', nC, 'Fully correct', 'correct'],
     ['✓', nP, (nP > 0 ? 'Partially correct (avg ' + (pSum / nP).toFixed(2) + ')' : 'Partially correct'), 'partial'],
     ['✗', nW, 'Fully incorrect', 'wrong'],
     ['⚠', nS, 'Skipped — excluded', 'skipped']].forEach(function (r) {
      var d = el('div', 'res-card ' + r[3]);
      d.appendChild(el('div', 'n', r[0] + ' ' + r[1]));
      d.appendChild(el('div', 'l', esc(r[2])));
      grid.appendChild(d);
    });
    card.appendChild(grid);
    var stats = el('p', 'small muted');
    stats.innerHTML = '⏱ Time left when the exam ended: <strong>' + fmtT(T.remain) + '</strong> · ⏸ Manual break time: <strong>' + fmtT(Math.round(S.manualPauseTotal)) + '</strong> · ⏸ Feedback review time: <strong>' + fmtT(Math.round(S.autoPauseTotal)) + '</strong>';
    card.appendChild(stats);
    var rt = el('button', 'btn primary', '↻ Retake exam');
    rt.style.marginTop = '10px';
    rt.addEventListener('click', function () { startExam(); });
    card.appendChild(rt);
    app.appendChild(card);

    if (!S.reported) {
      S.reported = true;
      reportScore(sum, answered);
    }
  }
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= PASS
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  /* ================= site handshake ================= */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    if (event.data.username) {
      S.username = String(event.data.username).slice(0, 40);
      updateHeader();
    }
    /* event.data.theme is always 'dark' — this file is dark-only by contract; nothing to switch. */
  });

  /* ================= timer end ================= */
  T.end = (function (origEnd) {
    return function () {
      var wasEnded = (T.state === 'ENDED');
      origEnd.call(T);
      if (!wasEnded && (S.screen === 'exam' || S.screen === 'review')) {
        /* timeout or submit: go to results; skipped stay excluded */
        S.screen = 'results';
        renderResults($('#app'));
      }
    };
  })(T.end);

  /* ================= boot ================= */
  document.body.className = CFG.sevClass;
  buildHeader();
  T.render();
  showScreen('intro');
})();

</script>
</body>
