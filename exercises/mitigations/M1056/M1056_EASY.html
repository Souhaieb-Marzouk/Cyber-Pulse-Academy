  --accent-amber-mid: rgba(255, 180, 84, 0.10);

  --accent-green-glow: rgba(87, 211, 140, 0.12);
  --state-incorrect-soft: rgba(255, 107, 107, 0.12);
  --state-incorrect-low: rgba(255, 107, 107, 0.10);
  --state-incorrect-faint: rgba(255, 107, 107, 0.06);
  --state-incorrect-wash: rgba(255, 107, 107, 0.08);
  --state-paused-soft: rgba(157, 123, 255, 0.10);
  --sev-easy-soft: rgba(87, 211, 140, 0.10);
  --sev-medium-soft: rgba(255, 180, 84, 0.10);
  --sev-hard-soft: rgba(255, 138, 61, 0.10);
  --sev-extreme-soft: rgba(255, 107, 107, 0.10);
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}
.mono, code, pre, .log-line, .art-code {

}
:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; border-radius: 4px; }

/* ---------- persistent header ---------- */
#hdr {

}
.state-chip.paused { color: var(--state-paused); border-color: var(--state-paused); background: var(--state-paused-soft); }

body.sev-medium  { --sev-color: var(--sev-medium); }
body.sev-hard    { --sev-color: var(--sev-hard); }
body.sev-extreme { --sev-color: var(--sev-extreme); }

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 9px 16px; border-radius: 8px;

}

.btn.primary { background: var(--accent-blue-soft); border-color: var(--accent-blue); }
.btn.green { background: var(--accent-green-soft); border-color: var(--accent-green); }
.btn.amber { background: var(--accent-amber-soft); border-color: var(--accent-amber); color: var(--accent-amber); }
.btn.danger { background: var(--state-incorrect-soft); border-color: var(--state-incorrect); color: var(--state-incorrect); }

/* ---------- layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 6px 16px 40px; }
.card {
  background: var(--bg-surface); border: 1px solid var(--border);

}

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; }

}

.blk { border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; background: var(--bg-surface); overflow: hidden; }
.blk-h {

}

}

}

.art-table th { background: var(--bg-surface); color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.art-table td { color: var(--text-primary); }

/* ---------- options ---------- */
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  text-align: left; background: var(--bg-surface-2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 13px 16px; margin: 9px 0; min-height: 44px;
  cursor: pointer; color: var(--text-primary); font-size: 15.5px; line-height: 1.5;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}
.opt:hover:not([disabled]) { box-shadow: inset 0 0 0 1px var(--hover-line); }
.opt .ltr { font-weight: 800; color: var(--text-secondary); flex: 0 0 auto; }
.opt .sel-tag { margin-left: auto; flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--accent-green); align-self: center; }

.v-c { color: var(--state-correct); }

.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.mcol-h { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
.pairlist { margin-top: 12px; }
.pair {

}

  margin-left: auto; border: 1px solid var(--border); background: transparent;
  color: var(--state-incorrect); font-weight: 800; border-radius: 6px;
  padding: 4px 10px; cursor: pointer; min-height: 32px;
}
.mchip.picked { border-color: var(--accent-blue); box-shadow: 0 0 0 1px var(--accent-blue), 0 0 12px var(--accent-blue-glow); }
.mchip.paired { opacity: 0.45; cursor: default; }

/* ---------- drag & drop ---------- */
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-surface-2); color: var(--text-primary);
  padding: 9px 14px; font-size: 14px; cursor: grab; min-height: 44px;
}
.chip.sel { border-color: var(--accent-blue); box-shadow: 0 0 0 1px var(--accent-blue); }

.zones { display: grid; gap: 12px; }
.zones.z2 { grid-template-columns: 1fr 1fr; }
.zones.z3 { grid-template-columns: 1fr 1fr 1fr; }
.zones.z4 { grid-template-columns: repeat(4, 1fr); }
.zone { border: 2px dashed var(--border); border-radius: 10px; padding: 10px 12px; min-height: 72px; background: var(--zone-tint); }
.zone.over { border-color: var(--accent-blue); background: var(--accent-blue-low); }
.zone-h { font-weight: 800; font-size: 13.5px; color: var(--accent-amber); margin-bottom: 8px; }

.zone .chip .rmx {
  margin-left: auto; border: none; background: transparent; color: var(--state-incorrect);
  font-weight: 800; cursor: pointer; font-size: 14px; min-height: 32px; min-width: 32px;
}

/* ---------- ordering ---------- */
.olist { list-style: none; margin: 4px 0 0; padding: 0; }
.oli {
  display: flex; align-items: center; gap: 12px;

}
.oli.dragging { opacity: 0.45; border-style: dashed; }
.oli .pos {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 7px;
  display: grid; place-items: center; font-weight: 800; font-size: 14px;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-secondary);
}
.oli .otext { font-size: 14.5px; }
.oli .mv { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
.oli .mv button {
  min-width: 40px; min-height: 40px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-size: 15px;
}

/* ---------- fill the blanks ---------- */
.filltext { font-size: 15.5px; line-height: 2.3; }
.blank {
  display: inline-block; min-width: 120px; min-height: 34px;
  border: none; border-bottom: 2px solid var(--border); border-radius: 6px 6px 0 0;
  background: var(--blank-tint); padding: 2px 12px; margin: 0 3px;
  text-align: center; cursor: pointer; color: var(--text-mono);
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; vertical-align: baseline;
}
.blank.sel { border-bottom-color: var(--accent-blue); box-shadow: 0 0 0 1px var(--accent-blue); }
.blank.filled { color: var(--text-mono); }

/* ---------- branch steps ---------- */
.step-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.07em;
  color: var(--accent-amber); border: 1px solid var(--accent-amber);
  border-radius: 999px; padding: 3px 12px; margin-bottom: 8px;
  background: var(--accent-amber-low);
}

/* ---------- hint / feedback ---------- */
.hint { border: 1px solid var(--accent-amber); background: var(--accent-amber-low); border-radius: 8px; padding: 10px 14px; margin-top: 12px; }
.hint .tag { color: var(--accent-amber); font-weight: 800; font-size: 12.5px; letter-spacing: 0.05em; text-transform: uppercase; }
.fb { border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; overflow: hidden; }
.fb-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 11px 16px; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
.fb-b { padding: 14px 18px; border-top: 1px solid var(--border); }
.fb.correct { border-color: var(--state-correct); background: var(--accent-green-faint); }
.fb.correct .fb-h { color: var(--state-correct); }
.fb.partial { border-color: var(--state-partial); background: var(--accent-amber-faint); }
.fb.partial .fb-h { color: var(--state-partial); }
.fb.incorrect { border-color: var(--state-incorrect); background: var(--state-incorrect-faint); }
.fb.incorrect .fb-h { color: var(--state-incorrect); }
.fb-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border); font-size: 14.5px; }
.fb-item:first-child { border-top: none; }
.fb-item .iv { flex: 0 0 auto; font-weight: 800; white-space: nowrap; }
.fb-item .iv.v-c { color: var(--state-correct); }
.fb-item .iv.v-w { color: var(--state-incorrect); }
.fb-item .iv.v-m { color: var(--state-skipped); }
.fb-item .iv.v-o { color: var(--text-secondary); }
.fb-credit { font-size: 13px; color: var(--text-secondary); font-weight: 700; }
.study { margin-top: 10px; padding: 9px 14px; border-left: 3px solid var(--accent-amber); background: var(--accent-amber-faint); border-radius: 0 8px 8px 0; font-size: 14px; }
.canon { margin-top: 10px; }
.fb-next { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.autonote { margin-top: 10px; font-size: 13px; color: var(--state-paused); font-weight: 700; }

/* ---------- paused overlay ---------- */
.pause-wrap { position: relative; }
.pause-wrap .ex-body { filter: blur(9px); pointer-events: none; user-select: none; }
.pause-overlay {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 30;
  background: var(--bg-page-dim); border-radius: 10px; text-align: center;
}
.pause-box { background: var(--bg-surface); border: 1px solid var(--state-paused); border-radius: 10px; padding: 22px 30px; }
.pause-box .big { font-size: 18px; font-weight: 800; color: var(--state-paused); }

/* ---------- review / results ---------- */
.rev-item {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-surface-2); padding: 12px 16px; margin: 9px 0;
}
.rev-item .t { color: var(--state-skipped); font-weight: 800; white-space: nowrap; }
.rev-item .s { flex: 1 1 240px; font-size: 14.5px; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 14px; }
.res-card { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.res-card .n { font-size: 26px; font-weight: 800; }
.res-card .l { font-size: 12.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
.res-card.correct { border-color: var(--state-correct); } .res-card.correct .n, .res-card.correct .l { color: var(--state-correct); }
.res-card.partial { border-color: var(--state-partial); } .res-card.partial .n, .res-card.partial .l { color: var(--state-partial); }
.res-card.wrong { border-color: var(--state-incorrect); } .res-card.wrong .n, .res-card.wrong .l { color: var(--state-incorrect); }
.res-card.skipped { border-color: var(--state-skipped); } .res-card.skipped .n, .res-card.skipped .l { color: var(--state-skipped); }
.verdict { border-radius: 10px; padding: 20px 22px; margin-top: 16px; border: 1px solid; }
.verdict .vp { font-size: 34px; font-weight: 800; letter-spacing: 0.04em; }
.verdict.pass { border-color: var(--state-correct); background: var(--accent-green-wash); }
.verdict.pass .vp { color: var(--state-correct); }
.verdict.fail { border-color: var(--state-incorrect); background: var(--state-incorrect-wash); }
.verdict.fail .vp { color: var(--state-incorrect); }
.scoreline { font-size: 15px; margin-top: 6px; }

<script>window.__EXAM__ = {"topicId":"m1056","batch":1,"title":"M1056 Pre-compromise — EASY","severity":"EASY","sevClass":"sev-easy","partLabel":null,"timerSeconds":1500,"exercises":[{"id":"e01","type":"single","summary":"M1056 is a Mitigation object in MITRE ATT&CK","scenario":{"note":"You are a new SOC analyst. Your team lead sends you a short note before Friday's control review.","artifacts":[{"kind":"text","title":"Team lead note","body":"Please read ATT&CK M1056 — Pre-compromise before Friday.\nWe will discuss which of our controls map to it.\nYou only need the big picture for now."}]},"question":"In MITRE ATT&CK, what type of object is M1056?","widget":{"type":"single","options":[{"id":"o1","text":"A Mitigation — a document that describes defences against attacker behaviours"},{"id":"o2","text":"A Technique — a document that describes one thing an attacker does"},{"id":"o3","text":"A Tactic — a document that describes the attacker's big goal"},{"id":"o4","text":"A Group — a document that describes one threat actor"}],"correct":"o1"},"hint":"ATT&CK IDs that start with the letter M are defence documents, not attack documents.","exp":{"intro":"M1056 is a Mitigation. Mitigations tell defenders what they can do to make life hard for attackers. ATT&CK shows the object type in the ID: M means Mitigation, T means Technique, TA means Tactic, and G means Group.","items":{"o1":"Right — M1056 is a Mitigation called Pre-compromise.","o2":"Techniques have IDs starting with T, like T1595. They describe attacker behaviour, not defences.","o3":"Tactics have IDs like TA0043. They describe goals, not defences.","o4":"Groups have IDs like G0007. They describe threat actors, not defences."},"study":"Look at how ATT&CK IDs are built: M, T, TA and G prefixes."}},{"id":"e02","type":"single","summary":"Pre-compromise means the time before the attacker gets in","scenario":{"note":"In a team meeting, someone asks: “The M1056 page talks about pre-compromise. When is that?”","artifacts":[{"kind":"text","title":"Whiteboard sketch","body":"... [ attacker studies the target ] ... [ attacker builds tools ] ...\n                ????  (which phase is this?)\n[ first login ] [ moving around ] [ stealing data ]"}]},"question":"What does “pre-compromise” mean?","widget":{"type":"single","options":[{"id":"o1","text":"The time before the attacker gets into the company — while they prepare"},{"id":"o2","text":"The time after the attacker is removed from the network"},{"id":"o3","text":"The moment the backup finishes copying data"},{"id":"o4","text":"The time when the firewall blocks an alert"}],"correct":"o1"},"hint":"The word “pre” means before. Before what?","exp":{"intro":"Pre-compromise means before the compromise, that is, before the attacker gets a foothold. In that window the attacker studies you and prepares tools. M1056 collects the defences you can use in that early window.","items":{"o1":"Right — it is the preparation window before initial access.","o2":"That would be post-incident recovery, not pre-compromise.","o3":"Backups are unrelated to this phase name.","o4":"Firewall blocking is an in-network event, which already happens later."},"study":"The word pre-compromise: before the attacker gets in."}},{"id":"e03","type":"single","summary":"M1056 covers the Reconnaissance and Resource Development tactics","scenario":{"note":"A colleague asks which ATT&CK tactics M1056 tries to blunt. You open the matrix and point at the two columns on the far left.","artifacts":[{"kind":"attack","title":"ATT&CK matrix — first columns","lines":["TA0043 Reconnaissance | TA0042 Resource Development | TA0001 Initial Access | ...","T1595 Active Scanning    | T1583 Acquire Infrastructure      | T1566 Phishing","T1591 Gather Org Info    | T1587 Develop Capabilities        | T1190 Exploit Public-Facing App"]}]},"question":"Which two tactics does M1056 cover?","widget":{"type":"single","options":[{"id":"o1","text":"Reconnaissance and Resource Development"},{"id":"o2","text":"Initial Access and Persistence"},{"id":"o3","text":"Execution and Privilege Escalation"},{"id":"o4","text":"Collection and Impact"}],"correct":"o1"},"hint":"Pre-compromise happens before the attacker gets in. Which matrix columns are furthest left?","exp":{"intro":"M1056 covers TA0043 Reconnaissance and TA0042 Resource Development. These are the two tactics an attacker works through before the first real intrusion step. Every technique listed on the M1056 page belongs to one of these two tactics.","items":{"o1":"Right — Reconnaissance and Resource Development are the two pre-compromise tactics.","o2":"Initial Access is the first post-compromise step; Persistence comes even later.","o3":"Execution and Privilege Escalation happen inside the network, after getting in.","o4":"Collection and Impact are late-stage tactics, far after preparation."},"study":"The ATT&CK matrix order: Reconnaissance and Resource Development come first."}},{"id":"e04","type":"multi","summary":"Pick the two pre-compromise activities","scenario":{"note":"During onboarding you get four cards from recent cases. Your mentor asks you to sort out which ones belong to the pre-compromise phase.","artifacts":[{"kind":"text","title":"Case cards","body":"Card A — Someone scanned the company's public IP range from the internet.\nCard B — Someone registered a domain name that looks almost like ours.\nCard C — Ransomware note appeared on an internal file server.\nCard D — A database dump was copied from an internal host."}]},"question":"Select the TWO cards that show pre-compromise activity.","widget":{"type":"multi","options":[{"id":"o1","text":"Card A — scanning the company's public IP range"},{"id":"o2","text":"Card B — registering a lookalike domain name"},{"id":"o3","text":"Card C — a ransomware note on an internal file server"},{"id":"o4","text":"Card D — copying a database dump from an internal host"}],"correct":["o1","o2"]},"hint":"Pre-compromise happens from outside, before any login or malware inside the network.","exp":{"intro":"Scanning your public range is Reconnaissance (T1595). Registering a lookalike domain is Acquire Infrastructure (T1583.001). Both happen before the attacker gets in. The ransomware note and the database copy happen inside the network, after a foothold, so they are not pre-compromise.","items":{"o1":"Right — active scanning of public systems is textbook Reconnaissance.","o2":"Right — acquiring a lookalike domain is Resource Development.","o3":"Ransomware note means the attacker is already inside — that is post-compromise.","o4":"Copying a database needs inside access — post-compromise too."},"study":"Ask for each activity: does this need a foothold inside, or can it be done from outside?"}},{"id":"e05","type":"match","summary":"Match four basic pre-compromise words to their meanings","scenario":{"note":"You write your first glossary for the team wiki. Match each term to its plain meaning.","artifacts":[{"kind":"text","title":"Glossary task","body":"Terms: Reconnaissance, Resource Development, OSINT, Attack surface."}]},"question":"Match each term on the left with its meaning on the right.","widget":{"type":"match","left":[{"id":"l1","text":"Reconnaissance"},{"id":"l2","text":"Resource Development"},{"id":"l3","text":"OSINT"},{"id":"l4","text":"Attack surface"}],"right":[{"id":"r1","text":"The attacker studies the target and collects information"},{"id":"r2","text":"The attacker builds or buys what the attack needs"},{"id":"r3","text":"Collecting information from public sources"},{"id":"r4","text":"Everything of the company that an outsider can reach or see"}],"pairs":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"}},"hint":"Two terms name attacker phases, one names a collection style, one names exposure.","exp":{"intro":"Reconnaissance is the information-gathering phase (TA0043). Resource Development is the building phase (TA0042). OSINT means open source intelligence — reading public information. The attack surface is everything an outsider can see or reach, like public servers and published information.","items":{"l1":"Reconnaissance is exactly the study-and-collect phase.","l2":"Resource Development is where domains, accounts and malware get made or bought.","l3":"OSINT is literally intelligence from open (public) sources.","l4":"The attack surface is the set of all externally visible and reachable things."},"study":"These four words are the base vocabulary for all M1056 work."}},{"id":"e06","type":"fill","summary":"Complete the one-paragraph summary of M1056","scenario":{"note":"You draft a short summary of M1056 for the team wiki and leave three gaps for the key words.","artifacts":[{"kind":"text","title":"Wiki draft","body":"M1056 tells defenders to limit what the company shares in public, to protect its (1)____ and DNS records, and to keep watching the external attack (2)____ so problems are found before an attacker finds them."}]},"question":"Fill the two gaps with words from the bank.","widget":{"type":"fill","text":"M1056 tells defenders to limit what the company shares in public, to protect its __b1__ and DNS records, and to keep watching the external attack __b2__ so problems are found before an attacker finds them.","blanks":[{"id":"b1","correct":"w1"},{"id":"b2","correct":"w2"}],"bank":[{"id":"w1","text":"domains"},{"id":"w2","text":"surface"},{"id":"w3","text":"passwords"},{"id":"w4","text":"printers"}]},"hint":"One gap is about internet names the company owns; the other is the phrase from the intro: “attack ____”.","exp":{"intro":"M1056's measures include protecting your domains and DNS, and monitoring your external attack surface. A domain is your internet name. The attack surface is everything an outsider can see and reach.","items":{"b1":"Domains (together with DNS) is what M1056 says to protect — domain and DNS infrastructure.","b2":"“External attack surface” is the standard phrase for everything exposed to the internet.","w3":"Passwords are not what this sentence is about.","w4":"Printers are not part of this sentence at all."},"study":"Re-read the M1056 measure names: Limit Information Exposure, Protect Domain and DNS Infrastructure, External Monitoring."}},{"id":"e07","type":"single","summary":"What a lookalike domain is","scenario":{"note":"Brand monitoring forwards you an alert: a new internet name was registered: corp-portal-login[.]example. Your company's real name is corp-portal.example.","artifacts":[{"kind":"log","title":"Brand monitor alert","filter":false,"lines":["2026-10-12 08:14:02 INFO  new-domain: corp-portal-login[.]example registered 2 days ago","2026-10-12 08:14:03 INFO  similar-to: corp-portal[.]example (brand match 91%)","2026-10-12 08:14:04 WARN  no prior history for this name in our asset list"]}]},"question":"What is this kind of internet name called?","widget":{"type":"single","options":[{"id":"o1","text":"A lookalike (typosquatting) domain — a name made to be mistaken for the real one"},{"id":"o2","text":"A subdomain of our own company domain"},{"id":"o3","text":"A backup domain that IT registered last year"},{"id":"o4","text":"An email newsletter service"}],"correct":"o1"},"hint":"The new name is almost identical to the company's real name, with one extra word.","exp":{"intro":"A lookalike domain imitates a real name so that people mistype or misread it. Attackers register such names before they launch phishing. Spotting them early is a classic pre-compromise defence.","items":{"o1":"Right — corp-portal-login[.]example mimics the real corp-portal.example.","o2":"It is not part of your domain; it is registered by someone else.","o3":"Your asset list says you have no history with this name.","o4":"The pattern is an imitation of your brand, not a newsletter."},"study":"Lookalike / typosquatting domains — the reason M1056 pushes domain monitoring."}},{"id":"e08","type":"dnd","summary":"Sort four actions into who does them","scenario":{"note":"You explain pre-compromise to an intern with a simple two-bucket sorting game.","artifacts":[{"kind":"text","title":"Sorting game","body":"Bucket 1 — “Our company shares or exposes this”\nBucket 2 — “An attacker prepares this from outside”"}]},"question":"Place each action into the right bucket.","widget":{"type":"dnd","zones":[{"id":"z1","label":"Company shares or exposes"},{"id":"z2","label":"Attacker prepares"}],"items":[{"id":"i1","text":"Publishing a job post with the full tech stack","zone":"z1"},{"id":"i2","text":"Scanning the company's public IP range","zone":"z2"},{"id":"i3","text":"Registering a name that looks like the company's","zone":"z2"},{"id":"i4","text":"Posting conference photos where badges are readable","zone":"z1"}]},"hint":"Two actions only the attacker can do; two are things your own people publish.","exp":{"intro":"Job posts and readable badge photos are information the company itself puts out — that is what Limit Information Exposure and Training address. Scanning and registering lookalike names are actions an attacker performs from outside during Reconnaissance and Resource Development.","items":{"i1":"Yes — the company chooses to publish tech details in job posts.","i2":"Only the attacker scans your range from the internet.","i3":"Only the attacker registers the imitation name.","i4":"Yes — badge photos are published by staff, which is an exposure the company can reduce."},"study":"Every exposure has two sides: what we publish, and what the attacker does with it."}},{"id":"e09","type":"order","summary":"Put the attacker's preparation story in order","scenario":{"note":"You build a simple timeline slide: how an attacker prepares a phishing wave against your company, from first look to first email.","artifacts":[{"kind":"text","title":"Slide task","body":"Drag the four steps into the order an attacker would do them."}]},"question":"Put the four steps in the correct order.","widget":{"type":"order","items":[{"id":"i1","text":"Learn employee names from the company website"},{"id":"i2","text":"Register a lookalike domain"},{"id":"i3","text":"Set up a fake login page on that domain"},{"id":"i4","text":"Send the first phishing emails to staff"}]},"hint":"Information comes first, then infrastructure, then staging, then the first email.","exp":{"intro":"The natural order is: gather names (Reconnaissance), register the lookalike domain (Acquire Infrastructure), stage the fake page (Stage Capabilities), then send phishing (that step is Initial Access — the first post-compromise action).","items":{"i1":"Names are needed first to know who to target.","i2":"The lookalike domain comes after picking targets.","i3":"The fake page must exist before any email can point to it.","i4":"The email is last — everything else is prepared before it."},"study":"The preparation chain: recon, then acquire infrastructure, then stage capabilities."}},{"id":"e10","type":"multi","summary":"Which sources are public to an attacker","scenario":{"note":"A colleague asks: “If I were an attacker, what could I read about us without any access?” You list the truly public sources.","artifacts":[{"kind":"text","title":"Source list","body":"1. The company website and careers page\n2. Staff social media profiles\n3. Public WHOIS records for the company's domains\n4. The internal HR database\n5. The internal chat archive"}]},"question":"Select the THREE sources an outsider can read without any access.","widget":{"type":"multi","options":[{"id":"o1","text":"The company website and careers page"},{"id":"o2","text":"Staff social media profiles"},{"id":"o3","text":"Public WHOIS records for the company's domains"},{"id":"o4","text":"The internal HR database"},{"id":"o5","text":"The internal chat archive"}],"correct":["o1","o2","o3"]},"hint":"Public means: no login, no insider access, just the internet.","exp":{"intro":"Websites, social media and WHOIS are readable by anyone on the internet — they feed Reconnaissance techniques like Search Open Websites/Domains and WHOIS lookups. The HR database and chat archive sit inside the network; an outsider cannot read them before getting in.","items":{"o1":"Right — fully public.","o2":"Right — staff profiles are public by default.","o3":"Right — WHOIS is a public registry.","o4":"Internal — needs a foothold, so not pre-compromise reading.","o5":"Internal — same reason."},"study":"Walk your own public footprint: website, social media, WHOIS, code repositories."}},{"id":"e11","type":"single","summary":"Why job posts should not reveal everything","scenario":{"note":"A hiring manager drafts a post: “We run DC-01 on Windows Server 2019 with Okta SSO; contact jane.doe@corp[.]example directly.” You review it before publishing.","artifacts":[{"kind":"text","title":"Job post draft","body":"Title: Senior Sysadmin\nWe run DC-01 on Windows Server 2019 with Okta SSO.\nDirect line: jane.doe@corp[.]example"}]},"question":"Why should parts of this post be removed before publishing?","widget":{"type":"single","options":[{"id":"o1","text":"Because attackers use job posts to learn the technology and the people of a target"},{"id":"o2","text":"Because job posts must be short by company law"},{"id":"o3","text":"Because search engines punish long job posts"},{"id":"o4","text":"Because Windows Server 2019 cannot be named in public"}],"correct":"o1"},"hint":"Think about what an attacker learns: a system name, a product, and a named person with an email.","exp":{"intro":"Job posts are public. Naming internal systems, versions and a direct contact gives an attacker exactly what Reconnaissance wants: technology (T1592) and people (T1589.003). M1056's Limit Information Exposure measure asks you to sanitise posts like this.","items":{"o1":"Right — that is the whole point of information-exposure hygiene.","o2":"There is no such law; the reason is attacker value.","o3":"Search ranking is not the security issue here.","o4":"Naming a Windows version is allowed — the issue is helping attackers."},"study":"Read your own job posts as an attacker would."}},{"id":"e12","type":"match","summary":"Match M1056's six measures to what they do","scenario":{"note":"Your team lead prints the M1056 measures on cards for the control review. Match each measure to its job.","artifacts":[{"kind":"attack","title":"M1056 measures (excerpt)","lines":["Limit Information Exposure","Protect Domain and DNS Infrastructure","External Monitoring","Training and Awareness"]}]},"question":"Match each measure to what it actually does.","widget":{"type":"match","left":[{"id":"l1","text":"Limit Information Exposure"},{"id":"l2","text":"Protect Domain and DNS Infrastructure"},{"id":"l3","text":"External Monitoring"},{"id":"l4","text":"Training and Awareness"}],"right":[{"id":"r1","text":"Share less about the organisation in public"},{"id":"r2","text":"DNSSEC, WHOIS privacy, watching for domain hijacking"},{"id":"r3","text":"Scan and watch the company's own public-facing assets"},{"id":"r4","text":"Teach staff what to share and how to spot tricks"}],"pairs":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"}},"hint":"The measure names describe their job almost literally.","exp":{"intro":"These are four of the measures listed on the M1056 page. Information exposure is reduced by sharing less. Domain and DNS protection means DNSSEC, WHOIS privacy and hijack monitoring. External monitoring watches your own public assets. Training prepares people.","items":{"l1":"This measure is about publishing less.","l2":"This measure protects your names and records — DNSSEC and WHOIS privacy are named on the page.","l3":"External Monitoring means scanning your own outside-facing estate.","l4":"This measure works through people, not tools."},"study":"Name the M1056 measures from memory — they structure every control conversation."}},{"id":"e13","type":"dnd","summary":"Sort phases into before and after compromise","scenario":{"note":"You make a simple diagram for the wall: which phases happen before the attacker gets in, and which after.","artifacts":[{"kind":"text","title":"Wall diagram","body":"Zone A — “Before the attacker gets in (pre-compromise)”\nZone B — “After the attacker got in (post-compromise)”"}]},"question":"Place each ATT&CK phase into the right zone.","widget":{"type":"dnd","zones":[{"id":"z1","label":"Pre-compromise"},{"id":"z2","label":"Post-compromise"}],"items":[{"id":"i1","text":"Reconnaissance (TA0043)","zone":"z1"},{"id":"i2","text":"Resource Development (TA0042)","zone":"z1"},{"id":"i3","text":"Initial Access (TA0001)","zone":"z2"},{"id":"i4","text":"Lateral Movement (TA0008)","zone":"z2"}]},"hint":"Two phases are pure preparation; two need a foothold.","exp":{"intro":"Reconnaissance and Resource Development happen before any foothold — they are the pre-compromise phases covered by M1056. Initial Access is the moment the attacker gets in, and Lateral Movement clearly needs to be inside already.","items":{"i1":"Right — studying the target needs no foothold.","i2":"Right — building tools needs no foothold either.","i3":"Initial Access is literally the first step of getting in — post-compromise work starts here.","i4":"Moving between systems requires being inside."},"study":"M1056 covers everything left of Initial Access in the ATT&CK matrix."}},{"id":"e14","type":"multi","summary":"What belongs to your external attack surface","scenario":{"note":"Before the first external scan you ask: what will the scanner see as “ours”? Your mentor says: everything the internet can reach or associate with the company.","artifacts":[{"kind":"text","title":"Quick check","body":"Which of these are part of the external attack surface?"}]},"question":"Select the TWO items that are part of the external attack surface.","widget":{"type":"multi","options":[{"id":"o1","text":"The public web server of the company"},{"id":"o2","text":"Staff profiles on public social media"},{"id":"o3","text":"The internal print server behind the VPN"},{"id":"o4","text":"The offline archive tape in the basement"}],"correct":["o1","o2"]},"hint":"External means: visible or reachable from the internet without logging in first.","exp":{"intro":"The public web server is reachable from the internet, and staff profiles are publicly visible — both are external attack surface. The print server and the offline tape are only reachable from inside, so they are not external surface (they still matter, but other controls handle them).","items":{"o1":"Right — internet-facing system.","o2":"Right — publicly visible information about people.","o3":"Internal-only; an outsider cannot reach it pre-compromise.","o4":"Physical and offline — not reachable from the internet."},"study":"List your own assets and mark each one: external or internal?"}},{"id":"e15","type":"branch","summary":"Guided walkthrough: intern meets pre-compromise work","scenario":{"note":"Your first week. The brand-monitoring tool pings the shared channel about a new domain name. Walk through what a defender does, step by step.","artifacts":[{"kind":"text","title":"Channel message","body":"BrandMonitor: new domain registered 2 days ago: corp-payroll-login[.]example\nNo matches in our asset inventory. No ticket attached."}]},"question":"Choose the best answer at each step.","widget":{"type":"branch","steps":[{"q":"Step 1 — What kind of event is this?","options":[{"id":"a","text":"A lookalike domain registered by someone outside the company","leads":"Correct path: you treat it as possible attacker preparation."},{"id":"b","text":"A normal internal server coming online","leads":"This name is not in our inventory and was registered by someone else — rethink."},{"id":"c","text":"An email newsletter domain","leads":"Nothing here points to a newsletter — look at the name again."}]},{"q":"Step 2 — What is the risk if it stays untouched?","options":[{"id":"a","text":"It can later host a fake payroll login page to trick staff","leads":"Right — lookalike domains are often staged for phishing."},{"id":"b","text":"It will make our website slower","leads":"A third-party domain cannot slow down your website — think phishing."},{"id":"c","text":"None, registering a name is always harmless","leads":"A name alone is harmless, but what gets hosted on it matters."}]},{"q":"Step 3 — What is the sensible first response?","options":[{"id":"a","text":"Record it, watch it, and alert the brand/security team about it","leads":"Good — monitoring plus a heads-up is the pre-compromise playbook."},{"id":"b","text":"Log in to the domain and delete it yourself","leads":"You cannot and must not touch a domain you do not own."},{"id":"c","text":"Ignore it until a user complains","leads":"Waiting lets the attacker stage the trap first."}]}],"correct":["a","a","a"]},"hint":"Follow the defender path: recognise, understand the risk, respond within your rights.","exp":{"intro":"This walkthrough mirrors a real brand-protection task: spot the lookalike, understand it can be staged into a phishing trap, and respond by recording, monitoring and escalating — all before any user is harmed.","items":{"s0":"Recognising a lookalike domain is the first skill of pre-compromise defence.","s1":"Lookalike domains are typically staged for credential phishing later.","s2":"Defenders watch, record and escalate — they do not touch domains they do not own."},"study":"The brand-monitoring workflow: detect, assess, record, escalate."}}],"intro":{"title":"M1056 — EASY practice exam","subtitle":"MITRE ATT&CK Mitigation M1056 — Pre-compromise — dark-mode certification practice exam","facts":[["ATT&CK object","M1056 — Pre-compromise (Mitigation)"],["Severity","<span class=\"sev-badge sev-easy\">🛡 EASY<\/span>"],["Exercises in this file","15"],["Estimated time","about 25 minutes"],["Timer budget","25:00 countdown"],["Pass mark","70%"]],"learn":"<p>You will learn about <strong>M1056 — Pre-compromise<\/strong>. In MITRE ATT&CK this is a <strong>Mitigation<\/strong>: a page that tells defenders what they can do to stop a whole family of attacker behaviours. M1056 covers the time <em>before<\/em> an attacker gets into a company.<\/p><p>Imagine you are an attacker who wants to phish a bank. Before any email is sent, you study the bank's website, its staff and its public records. You register a domain name that looks almost like the bank's. You prepare a fake login page. In ATT&CK those two preparation phases are called <strong>Reconnaissance<\/strong> (TA0043) and <strong>Resource Development<\/strong> (TA0042). M1056 collects the defences that make those phases harder and more visible.<\/p><p>In real work this object touches many roles. SOC analysts triage alerts about lookalike domains. Attack-surface teams scan the company's public assets. Threat-intelligence analysts track who is preparing attacks. Email administrators run SPF, DKIM and DMARC. Awareness teams teach staff what not to share. The tools are external scanners, passive DNS, WHOIS, certificate logs and brand monitors. The documents are exposure reports, takedown requests and runbooks. The risk it addresses: attackers prepare quietly, and by the time the first email arrives they already know your people, your names and your weaknesses. This exam teaches you to see that early phase — and to act before the compromise.<\/p>","keywords":[{"theme":"The M1056 control","items":["M1056 Mitigation","Pre-compromise phase","TA0043 Reconnaissance","TA0042 Resource Development","Initial Access boundary","External attack surface"]},{"theme":"Attacker preparation","items":["OSINT","Active scanning","Lookalike (typosquatting) domain","Fake login page staging","Employee names harvesting","Phishing preparation chain"]},{"theme":"Defender measures","items":["Limit Information Exposure","Protect Domain and DNS Infrastructure","External Monitoring","Training and Awareness","Job-post hygiene","Record, watch, escalate"]}],"how":["This file contains: single-answer questions, multi-select with partial credit, matching pairs, drag-and-drop onto zones, fill-in-the-blank from a word bank, timeline ordering, and one guided step-by-step walkthrough.","The passing score is <strong>70%<\/strong>. Your final percent is computed over the exercises you actually answered. At 70% or more you <strong>PASS<\/strong>; below it you <strong>FAIL<\/strong> and can retake the exam.","The <strong>timer<\/strong> counts down in the top bar. <strong>Pause<\/strong> gives you a manual break: the timer stops and the exercise is hidden until you press Resume. The moment you press <strong>Check<\/strong>, the timer also stops automatically so you can study the feedback for as long as you like — it starts again only when you press <strong>Next<\/strong> (or Final Submit on the last exercise). Skip and Hint never stop the timer.","Some exercises have several correct items. They are scored with <strong>partial credit<\/strong>: each correct item adds credit and each wrong pick subtracts it — credit = max(0, (H − W) / N). Selecting everything gives zero, not safety.","The <strong>Hint<\/strong> button gives one nudge per exercise and costs 10% of that exercise's credit.","<strong>Skip<\/strong> moves an exercise to the Skipped pool without revealing the answer, and the timer keeps running. Before you finish, a review screen lets you answer skipped exercises as many times as you need while time remains. Skipped exercises that are never answered are excluded from the score.","At the end you get a full results screen with a per-item breakdown of every answer. Retaking shuffles the questions and the answer choices again."]}};</script>

  function $(s, r) { return (r || document).querySelector(s); }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function fmtT(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

  /* ================= timer state machine ================= */
  /* states: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED */
  var T = {
    state: 'IDLE', remain: CFG.timerSeconds, iv: null,
    start: function () {
      this.state = 'RUNNING';
      clearInterval(this.iv);
      this.iv = setInterval(function () { T.tick(); }, 1000);
      this.render();
    },
    tick: function () {
      if (this.state !== 'RUNNING') { return; }
      this.remain = this.remain - 1;
      if (this.remain <= 0) { this.remain = 0; this.render(); this.end(); return; }
      this.render();
    },
    pauseManual: function () {
      if (this.state === 'ENDED') { return; }
      /* stacking on top of the auto-pause: close the auto-pause segment first,
         so the same wall-clock time is never counted into both pause totals */
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = 'PAUSED_MANUAL';
      S.mpT0 = Date.now();
      this.render();
    },
    pauseAuto: function () {
      if (this.state === 'ENDED') { return; }
      this.state = 'PAUSED_AUTO_CHECK';
      S.apT0 = Date.now();
      this.render();
    },
    resumeTo: function (st) {
      if (this.state === 'ENDED') { return; }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;
        S.mpT0 = null;
      }
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = (st === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
      /* returning to the auto-pause opens a fresh auto-pause segment */
      if (this.state === 'PAUSED_AUTO_CHECK') { S.apT0 = Date.now(); }
      this.render();
    },
    end: function () {
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;

      } else if (this.state === 'PAUSED_MANUAL') {

      } else if (this.state === 'PAUSED_AUTO_CHECK') {

      } else if (this.state === 'ENDED') {

  /* ================= exam flow ================= */
  function startExam() {
    S.attempts++; S.reported = false;

    S.credit = {}; S.status = {}; S.checked = {}; S.hintUsed = {};
    S.manualPauseTotal = 0; S.autoPauseTotal = 0; S.mpT0 = null; S.apT0 = null; S.prevState = 'RUNNING';

  function highlightLog(ln) {

    s = s.replace(/\b(ERROR|CRIT|ALERT|FAIL|DENIED)\b/g, '<span class="lv-error">$1</span>');

  /* ================= widgets ================= */
  function buildWidget(ex, container, btnCheck) {
    var w = ex.widget;
    if (w.type === 'single' || w.type === 'multi') { return buildOptions(ex, container, btnCheck); }
    if (w.type === 'match') { return buildMatch(ex, container, btnCheck); }
    if (w.type === 'dnd') { return buildDnd(ex, container, btnCheck); }
    if (w.type === 'order') { return buildOrder(ex, container, btnCheck); }
    if (w.type === 'fill') { return buildFill(ex, container, btnCheck); }
    if (w.type === 'branch') { return buildBranch(ex, container, btnCheck); }
    return null;
  }

  /* ---- single / multi ---- */
  function buildOptions(ex, container, btnCheck) {
    var w = ex.widget;
    var multi = (w.type === 'multi');
    var state = { sel: {} };
    var opts = shuffle(w.options);
    var nodes = {};
    opts.forEach(function (o, i) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="ltr">' + LETTERS[i] + '.</span><span>' + esc(o.text) + '</span><span class="sel-tag" hidden>✓ Selected</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (multi) {
          state.sel[o.id] = !state.sel[o.id];
          b.classList.toggle('sel', !!state.sel[o.id]);
          b.setAttribute('aria-pressed', state.sel[o.id] ? 'true' : 'false');
          var tag = $('.sel-tag', b); if (tag) { tag.hidden = !state.sel[o.id]; }
        } else {
          state.sel = {};
          state.sel[o.id] = true;
          opts.forEach(function (oo) {
            var n = nodes[oo.id];
            n.classList.remove('sel');
            n.setAttribute('aria-pressed', 'false');
            var tg = $('.sel-tag', n); if (tg) { tg.hidden = true; }
          });
          b.classList.add('sel');
          b.setAttribute('aria-pressed', 'true');
          var tg2 = $('.sel-tag', b); if (tg2) { tg2.hidden = false; }
        }
        updateCheckState();
      });
      nodes[o.id] = b;
      container.appendChild(b);
    });
    return {
      type: w.type,
      isReady: function () { return Object.keys(state.sel).some(function (k) { return state.sel[k]; }); },
      collect: function () { return Object.keys(state.sel).filter(function (k) { return state.sel[k]; }); },
      lock: function () { opts.forEach(function (o) { nodes[o.id].disabled = true; }); }
    };
  }

  /* ---- matching ---- */
  function buildMatch(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { pickedL: null, pairs: {} };
    var leftNodes = {}, rightNodes = {};
    var lcol = el('div', 'match-grid');
    var lc = el('div', ''), rc = el('div', '');
    lc.appendChild(el('div', 'mcol-h', 'Left — items'));
    rc.appendChild(el('div', 'mcol-h', 'Right — meanings'));
    lcol.appendChild(lc); lcol.appendChild(rc);
    container.appendChild(lcol);
    var plist = el('div', 'pairlist');
    container.appendChild(plist);

    function rightText(rid) {
      var r = w.right.filter(function (x) { return x.id === rid; })[0];
      return r ? r.text : rid;
    }
    function renderPairs() {
      plist.innerHTML = '';
      Object.keys(state.pairs).forEach(function (lid) {
        var lt = w.left.filter(function (x) { return x.id === lid; })[0].text;
        var row = el('div', 'pair');
        row.innerHTML = '<span><strong>' + esc(short(lt)) + '</strong></span><span class="arrow">→</span><span>' + esc(rightText(state.pairs[lid])) + '</span>';
        var rm = el('button', 'rm', '✕ Remove');
        rm.type = 'button';
        rm.addEventListener('click', function () {
          if (S.checked[ex.id]) { return; }
          delete state.pairs[lid];
          state.pickedL = null;
          renderPairs(); syncChips(); updateCheckState();
        });
        row.appendChild(rm);
        plist.appendChild(row);
      });
    }
    function short(t) { return t.length > 46 ? t.slice(0, 45) + '…' : t; }
    function syncChips() {
      w.left.forEach(function (l) {
        leftNodes[l.id].classList.toggle('picked', state.pickedL === l.id);
        leftNodes[l.id].classList.toggle('paired', !!state.pairs[l.id]);
      });
      w.right.forEach(function (r) {
        var used = Object.keys(state.pairs).some(function (k) { return state.pairs[k] === r.id; });
        rightNodes[r.id].classList.toggle('paired', used);
      });
    }
    shuffle(w.left).forEach(function (l) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(l.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id] || state.pairs[l.id]) { return; }
        state.pickedL = (state.pickedL === l.id) ? null : l.id;
        syncChips();
      });
      leftNodes[l.id] = b;
      lc.appendChild(b);
    });
    shuffle(w.right).forEach(function (r) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(r.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        var lid = state.pickedL;
        if (!lid) { return; }
        state.pairs[lid] = r.id;
        state.pickedL = null;
        renderPairs(); syncChips(); updateCheckState();
      });
      rightNodes[r.id] = b;
      rc.appendChild(b);
    });
    container.appendChild(el('p', 'small muted', 'Pick one item on the left, then its meaning on the right. You can remove a pair before checking.'));
    return {
      type: 'match',
      isReady: function () { return Object.keys(state.pairs).length > 0; },
      collect: function () { return state.pairs; },
      lock: function () {
        w.left.forEach(function (l) { leftNodes[l.id].disabled = true; });
        w.right.forEach(function (r) { rightNodes[r.id].disabled = true; });
      }
    };
  }

  /* ---- drag & drop ---- */
  function buildDnd(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { place: {}, selChip: null };
    var bank = el('div', 'bank');
    container.appendChild(el('div', 'mcol-h', 'Items'));
    container.appendChild(bank);
    var zcls = w.zones.length >= 4 ? 'z4' : (w.zones.length === 3 ? 'z3' : 'z2');
    var zwrap = el('div', 'zones ' + zcls);
    container.appendChild(zwrap);
    var zoneNodes = {}, chipNodes = {};

    function putInBank(itemId) {
      delete state.place[itemId];
      bank.appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function putInZone(itemId, zid) {
      state.place[itemId] = zid;
      zoneNodes[zid].querySelector('.zitems').appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function syncZones() {
      Object.keys(state.place).forEach(function (iid) {
        chipNodes[iid].classList.remove('sel');
      });
    }
    var items = shuffle(w.items);
    items.forEach(function (it) {
      var c = el('button', 'chip');
      c.type = 'button';
      c.draggable = true;
      c.setAttribute('data-item', it.id);
      c.innerHTML = '<span>' + esc(it.text) + '</span>';
      c.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.place[it.id]) {
          putInBank(it.id);
          return;
        }
        state.selChip = (state.selChip === it.id) ? null : it.id;
        items.forEach(function (o) { chipNodes[o.id].classList.toggle('sel', state.selChip === o.id); });
      });
      c.addEventListener('dragstart', function (ev) {
        if (S.checked[ex.id]) { ev.preventDefault(); return; }
        state.selChip = it.id;
        c.classList.add('dragging');
        try { ev.dataTransfer.setData('text/plain', it.id); } catch (e) {}
      });
      c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
      chipNodes[it.id] = c;
      bank.appendChild(c);
    });
    w.zones.forEach(function (z) {
      var zd = el('div', 'zone');
      zd.setAttribute('data-zone', z.id);
      zd.appendChild(el('div', 'zone-h', '📥 ' + esc(z.label)));
      var zi = el('div', 'zitems');
      zd.appendChild(zi);
      zd.addEventListener('dragover', function (ev) { ev.preventDefault(); zd.classList.add('over'); });
      zd.addEventListener('dragleave', function () { zd.classList.remove('over'); });
      zd.addEventListener('drop', function (ev) {
        ev.preventDefault();
        zd.classList.remove('over');
        if (S.checked[ex.id]) { return; }
        var iid = state.selChip;
        if (!iid) { try { iid = ev.dataTransfer.getData('text/plain'); } catch (e) {} }
        if (!iid) { return; }
        putInZone(iid, z.id);
        state.selChip = null;
        items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
      });
      zd.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.selChip) {
          putInZone(state.selChip, z.id);
          state.selChip = null;
          items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
        }
      });
      zoneNodes[z.id] = zd;
      zwrap.appendChild(zd);
    });
    container.appendChild(el('p', 'small muted', 'Drag an item into a zone — or tap the item, then tap the zone. Tap a placed item to send it back.'));
    return {
      type: 'dnd',
      isReady: function () { return Object.keys(state.place).length > 0; },
      collect: function () { return state.place; },
      lock: function () {
        items.forEach(function (o) { chipNodes[o.id].disabled = true; });
      }
    };
  }

  /* ---- ordering ---- */
  function buildOrder(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { seq: shuffle(w.items.map(function (x) { return x.id; })) };
    var ol = el('ul', 'olist');
    container.appendChild(ol);
    var nodes = {};
    function text(id) { return w.items.filter(function (x) { return x.id === id; })[0].text; }
    function render() {
      ol.innerHTML = '';
      state.seq.forEach(function (id, i) {
        var li = el('li', 'oli');
        li.draggable = true;
        li.setAttribute('data-id', id);
        li.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="otext">' + esc(text(id)) + '</span>';
        var mv = el('span', 'mv');
        var up = el('button', '', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
        var dn = el('button', '', '▼'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
        up.addEventListener('click', function () {
          if (S.checked[ex.id] || i === 0) { return; }
          var t = state.seq[i - 1]; state.seq[i - 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        dn.addEventListener('click', function () {
          if (S.checked[ex.id] || i === state.seq.length - 1) { return; }
          var t = state.seq[i + 1]; state.seq[i + 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        mv.appendChild(up); mv.appendChild(dn);
        li.appendChild(mv);
        li.addEventListener('dragstart', function (ev) {
          if (S.checked[ex.id]) { ev.preventDefault(); return; }
          li.classList.add('dragging');
          try { ev.dataTransfer.setData('text/plain', id); } catch (e) {}
        });
        li.addEventListener('dragend', function () { li.classList.remove('dragging'); });
        li.addEventListener('dragover', function (ev) { ev.preventDefault(); });
        li.addEventListener('drop', function (ev) {
          ev.preventDefault();
          if (S.checked[ex.id]) { return; }
          var from = state.seq.indexOf(id);
          var dragId = null;
          try { dragId = ev.dataTransfer.getData('text/plain'); } catch (e) {}
          if (!dragId) { return; }
          var fi = state.seq.indexOf(dragId);
          if (fi < 0 || fi === from) { return; }
          state.seq.splice(fi, 1);
          var to = state.seq.indexOf(id);
          state.seq.splice(to + (fi < to ? 1 : 0), 0, dragId);
          render(); updateCheckState();
        });
        nodes[id] = li;
        ol.appendChild(li);
      });
    }
    render();
    container.appendChild(el('p', 'small muted', 'Drag rows — or use the ▲▼ buttons — to put the items in the right order.'));
    return {
      type: 'order',
      isReady: function () { return true; },
      collect: function () { return state.seq.slice(); },
      lock: function () { $all('.oli .mv button', ol).forEach(function (b) { b.disabled = true; }); }
    };
  }

  /* ---- fill blanks ---- */
  function buildFill(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { sel: null, fills: {} };
    var textDiv = el('div', 'filltext');
    var parts = String(w.text).split(/(__b\d+__)/);
    var blankNodes = {};
    var htmlOut = '';
    parts.forEach(function (p) {
      var m = p.match(/^__b(\d+)__$/);
      if (m) {
        var bid = 'b' + m[1];
        htmlOut += '<button type="button" class="blank" data-blank="' + bid + '" aria-label="Blank ' + m[1] + '">____</button>';
      } else {
        htmlOut += esc(p);
      }
    });
    textDiv.innerHTML = htmlOut;
    container.appendChild(textDiv);
    $all('.blank', textDiv).forEach(function (b) {
      var bid = b.getAttribute('data-blank');
      blankNodes[bid] = b;
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.fills[bid]) {
          delete state.fills[bid];
          b.textContent = '____';
          b.classList.remove('filled');
          updateCheckState();
          return;
        }
        if (state.sel) {
          state.fills[bid] = state.sel;
          b.textContent = bankText(state.sel);
          b.classList.add('filled');
          b.classList.remove('sel');
          state.sel = null;
          $all('.chip', bankNode).forEach(function (c) { c.classList.remove('sel'); });
          updateCheckState();
        } else {
          b.classList.toggle('sel');
        }
      });
    });
    container.appendChild(el('div', 'mcol-h', 'Word bank'));
    var bankNode = el('div', 'bank');
    container.appendChild(bankNode);
    function bankText(wid) {
      var r = w.bank.filter(function (x) { return x.id === wid; })[0];
      return r ? r.text : wid;
    }
    shuffle(w.bank).forEach(function (bw) {
      var c = el('button', 'chip');
      c.type = 'button';
      c.innerHTML = '<span>' + esc(bw.text) + '</span>';
      c.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        state.sel = (state.sel === bw.id) ? null : bw.id;
        $all('.chip', bankNode).forEach(function (x) { x.classList.toggle('sel', x === c && state.sel === bw.id); });
      });
      c.setAttribute('data-word', bw.id);
      bankNode.appendChild(c);
    });
    container.appendChild(el('p', 'small muted', 'Tap a word from the bank, then tap a blank. Tap a filled blank to empty it.'));
    return {
      type: 'fill',
      isReady: function () { return Object.keys(state.fills).length > 0; },
      collect: function () { return state.fills; },
      lock: function () {
        $all('.chip', bankNode).forEach(function (c) { c.disabled = true; });
      }
    };
  }

  /* ---- branching / multi-step ---- */
  function buildBranch(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { step: 0, choices: [] };
    var badge = el('div', 'step-badge', '');
    container.appendChild(badge);
    var optsBox = el('div', '');
    container.appendChild(optsBox);
    var wopts = [];
    w.steps.forEach(function (st) { wopts.push(st.options); });
    function renderStep() {
      var i = state.step;
      var st = w.steps[i];
      badge.textContent = 'STEP ' + (i + 1) + ' OF ' + w.steps.length;
      optsBox.innerHTML = '';
      var last = (i === w.steps.length - 1);
      var qline = el('p', '', '<strong>' + esc(st.q) + '</strong>');
      qline.style.marginTop = '0';
      optsBox.appendChild(qline);
      var nodes = [];
      shuffle(st.options).forEach(function (o, oi) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.innerHTML = '<span class="ltr">' + LETTERS[oi] + '.</span><span>' + esc(o.text) + '</span><span class="sel-tag" hidden>✓ Selected</span>';
        b.addEventListener('click', function () {
          if (S.checked[ex.id]) { return; }
          state.choices[i] = o.id;
          nodes.forEach(function (n) { n.classList.remove('sel'); var t = $('.sel-tag', n); if (t) { t.hidden = true; } });
          b.classList.add('sel');
          var tg = $('.sel-tag', b); if (tg) { tg.hidden = false; }
          updateCheckState();
        });
        nodes.push(b);
        optsBox.appendChild(b);
      });
      btnCheck.textContent = last ? '✓ Check answer' : 'Confirm step ▶';
      updateCheckState();
    }
    renderStep();
    return {
      type: 'branch',
      isReady: function () { return !!state.choices[state.step]; },
      confirm: function () {
        if (!state.choices[state.step]) { return; }
        if (S.checked[S.current.id]) { return; }
        var i = state.step;
        if (i < w.steps.length - 1) {
          var chosen = w.steps[i].options.filter(function (o) { return o.id === state.choices[i]; })[0];
          /* show what happens next as a new artefact */
          var sblk = $all('.blk-scen .blk-b', $('#app'))[0];
          if (sblk && chosen && chosen.leads) {
            sblk.appendChild(renderArtifact({ kind: 'text', title: 'What happens next', body: chosen.leads }, sblk.querySelectorAll('.art').length));
          }
          state.step = i + 1;
          renderStep();
        } else {
          doCheck(S.current);
        }
      },
      collect: function () { return state.choices.slice(); },
      lock: function () { $all('button.opt', optsBox).forEach(function (b) { b.disabled = true; }); }
    };
  }

  /* ================= grading ================= */
  function scoreExercise(h, wCount, n) {
    return Math.max(0, (h - wCount) / n);
  }
  function grade(ex, collected) {
    var w = ex.widget;
    var h = 0, wCount = 0, n = 0;
    var items = [];
    if (w.type === 'single') {
      n = 1;
      var sel = collected[0] || null;
      if (sel === w.correct) { h = 1; } else if (sel) { wCount = 1; }
      w.options.forEach(function (o) {
        var v;
        if (o.id === w.correct) { v = 'correct'; }
        else if (o.id === sel) { v = 'wrong'; }
        else { v = 'other'; }
        items.push({ label: o.text, verdict: v, why: (ex.exp.items[o.id] || '') });
      });
    } else if (w.type === 'multi') {
      n = w.correct.length;
      w.options.forEach(function (o) {
        var isC = w.correct.indexOf(o.id) >= 0;
        var isS = collected.indexOf(o.id) >= 0;
        if (isC && isS) { h++; }
        if (!isC && isS) { wCount++; }
        var v = isC ? (isS ? 'correct' : 'missed') : (isS ? 'wrong' : 'other');
        items.push({ label: o.text, verdict: v, why: (ex.exp.items[o.id] || '') });
      });
    } else if (w.type === 'match') {
      n = w.left.length;
      w.left.forEach(function (l) {
        var corr = w.pairs[l.id];
        var chose = collected[l.id];
        var rt = function (rid) {
          var r = w.right.filter(function (x) { return x.id === rid; })[0];
          return r ? r.text : rid;
        };
        if (chose && chose === corr) { h++; items.push({ label: l.text, verdict: 'correct', why: '→ ' + rt(corr) + '. ' + (ex.exp.items[l.id] || '') }); }
        else if (chose) { wCount++; items.push({ label: l.text, verdict: 'wrong', why: 'You paired it with “' + rt(chose) + '”. Correct: “' + rt(corr) + '”. ' + (ex.exp.items[l.id] || '') }); }
        else { items.push({ label: l.text, verdict: 'missed', why: 'Correct pair: “' + rt(corr) + '”. ' + (ex.exp.items[l.id] || '') }); }
      });
    } else if (w.type === 'dnd') {
      n = w.items.length;
      w.items.forEach(function (it) {
        var placed = collected[it.id];
        var zl = function (zid) {
          var z = w.zones.filter(function (x) { return x.id === zid; })[0];
          return z ? z.label : zid;
        };
        if (placed && placed === it.zone) { h++; items.push({ label: it.text, verdict: 'correct', why: '“' + zl(it.zone) + '”. ' + (ex.exp.items[it.id] || '') }); }
        else if (placed) { wCount++; items.push({ label: it.text, verdict: 'wrong', why: 'You placed it in “' + zl(placed) + '”. It belongs in “' + zl(it.zone) + '”. ' + (ex.exp.items[it.id] || '') }); }
        else { items.push({ label: it.text, verdict: 'missed', why: 'Not placed. It belongs in “' + zl(it.zone) + '”. ' + (ex.exp.items[it.id] || '') }); }
      });
    } else if (w.type === 'order') {
      n = w.items.length;
      collected.forEach(function (id, pos) {
        var corr = w.items.map(function (x) { return x.id; }).indexOf(id);
        if (corr === pos) { h++; items.push({ label: (pos + 1) + '. ' + w.items[corr].text, verdict: 'correct', why: 'Right position. ' + (ex.exp.items[id] || '') }); }
        else { wCount++; items.push({ label: (pos + 1) + '. ' + w.items.filter(function (x) { return x.id === id; })[0].text, verdict: 'wrong', why: 'Should be at position ' + (corr + 1) + '. ' + (ex.exp.items[id] || '') }); }
      });
    } else if (w.type === 'fill') {
      n = w.blanks.length;
      w.blanks.forEach(function (b) {
        var f = collected[b.id];
        var bt = function (wid) {
          var r = w.bank.filter(function (x) { return x.id === wid; })[0];
          return r ? r.text : wid;
        };
        if (f && f === b.correct) { h++; items.push({ label: 'Blank ' + b.id.slice(1) + ' — ' + bt(b.correct), verdict: 'correct', why: (ex.exp.items[b.id] || '') }); }
        else if (f) { wCount++; items.push({ label: 'Blank ' + b.id.slice(1) + ' — ' + bt(f), verdict: 'wrong', why: '“' + bt(f) + '” does not fit. Correct word: “' + bt(b.correct) + '”. ' + (ex.exp.items[b.id] || '') }); }
        else { items.push({ label: 'Blank ' + b.id.slice(1), verdict: 'missed', why: 'Left empty. Correct word: “' + bt(b.correct) + '”. ' + (ex.exp.items[b.id] || '') }); }
      });
    } else if (w.type === 'branch') {
      n = w.steps.length;
      w.steps.forEach(function (st, i) {
        var chose = collected[i];
        var corr = w.correct[i];
        var ot = function (oid) {
          var o = st.options.filter(function (x) { return x.id === oid; })[0];
          return o ? o.text : oid;
        };
        if (chose && chose === corr) { h++; items.push({ label: 'Step ' + (i + 1) + ' — ' + ot(chose), verdict: 'correct', why: (ex.exp.items['s' + i] || '') }); }
        else if (chose) { wCount++; items.push({ label: 'Step ' + (i + 1) + ' — ' + ot(chose), verdict: 'wrong', why: 'Better: ' + ot(corr) + '. ' + (ex.exp.items['s' + i] || '') }); }
        else { items.push({ label: 'Step ' + (i + 1), verdict: 'missed', why: 'No choice recorded. Better: ' + ot(corr) + '. ' + (ex.exp.items['s' + i] || '') }); }
      });
    }
    return { credit0: scoreExercise(h, wCount, n), items: items, h: h, w: wCount, n: n };
  }

  /* ================= check / feedback / next ================= */
  function doCheck(ex) {
    if (S.checked[ex.id]) { return; }
    var wg = S.widget;
    if (!wg || !wg.isReady()) { return; }
    /* FIRST ACTION: stop the timer for feedback review */
    S.prevState = T.state === 'PAUSED_MANUAL' ? S.prevState : T.state;
    T.pauseAuto();
    S.checked[ex.id] = true;
    var collected = wg.collect();
    var g = grade(ex, collected);
    var credit = Math.max(0, g.credit0 - (S.hintUsed[ex.id] ? 0.10 : 0));
    credit = Math.round(credit * 100) / 100;
    S.credit[ex.id] = credit;
    S.status[ex.id] = (credit >= 1) ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
    wg.lock();
    renderFeedback(ex, g, credit);
    var bc = $('#btnCheck'); if (bc) { bc.disabled = true; }
    var bh = $('#btnHint'); if (bh) { bh.disabled = true; }
    var bs = $('#btnSkip'); if (bs) { bs.disabled = true; }
    updateHeader();
  }
  function feedbackBlock(ex, g, credit) {
    var st = S.status[ex.id];
    var cls = st === 'correct' ? 'correct' : (st === 'partial' ? 'partial' : 'incorrect');
    var fb = el('div', 'fb ' + cls);
    var multi = g.n > 1;
    var icon = st === 'correct' ? '✓' : (st === 'partial' ? '✓' : '✗');
    var label = st === 'correct' ? '✓ CORRECT' : (st === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var hh = el('div', 'fb-h', '<span>' + label + '</span>');
    if (multi) {
      hh.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' — ' + g.h + '/' + g.n + ' correct items, ' + g.w + ' wrong' + (S.hintUsed[ex.id] ? ', hint −0.10' : '')));
    } else if (S.hintUsed[ex.id]) {
      hh.appendChild(el('span', 'fb-credit', 'hint used: −0.10 credit'));
    }
    fb.appendChild(hh);
    var bb = el('div', 'fb-b');
    bb.appendChild(el('p', '', esc(ex.exp.intro)));
    if (multi) {
      bb.appendChild(el('p', 'small muted', 'Scoring: credit = max(0, (H − W) / N) = max(0, (' + g.h + ' − ' + g.w + ') / ' + g.n + ')' + (S.hintUsed[ex.id] ? ', then −0.10 for the hint' : '') + '.'));
    }
    g.items.forEach(function (it) {
      var row = el('div', 'fb-item');
      var v = it.verdict;
      var vt = v === 'correct' ? '<span class="iv v-c">✓ Correct</span>'
        : v === 'wrong' ? '<span class="iv v-w">✗ Wrong</span>'
        : v === 'missed' ? '<span class="iv v-m">○ Missed</span>'
        : '<span class="iv v-o">○ Not selected</span>';
      row.innerHTML = vt + '<span><strong>' + esc(it.label) + '</strong> — ' + esc(it.why) + '</span>';
      bb.appendChild(row);
    });
    if (S.status[ex.id] !== 'correct' && ex.exp.study) {
      bb.appendChild(el('div', 'study', '<strong>What to study:</strong> ' + esc(ex.exp.study)));
    }
    fb.appendChild(bb);
    return fb;
  }
  function renderFeedback(ex, g, credit) {
    var app = $('#app');
    var footers = $all('.fb-next', app);
    var footer = footers[footers.length - 1];
    var anchor = footer ? footer.parentElement : app;
    var fb = feedbackBlock(ex, g, credit);
    var note = el('div', 'autonote', '⏸ Timer paused while you review this feedback — it resumes when you press Next.');
    fb.appendChild(note);
    anchor.insertBefore(fb, footer);
    var isLast = (S.pos === S.order.length - 1);
    var next = el('button', 'btn primary', (isLast && !S.skipReturn) ? 'Final Submit ▶' : 'Next ▶');
    next.addEventListener('click', function () {
      T.resumeTo('RUNNING');
      if (S.skipReturn) {
        S.skipReturn = false;
        showScreen('review');
        return;
      }
      advance();
    });
    footer.appendChild(next);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ================= review skipped ================= */
  function renderReview(app) {
    S.current = null;
    updateHeader();
    var c = el('div', 'card');
    c.appendChild(el('h2', 'c-amber', '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'These exercises were skipped. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises left, they are excluded from your score.'));
    var list = skippedList();
    list.forEach(function (idx) {
      var ex = CFG.exercises[idx];
      var n = S.order.indexOf(idx) + 1;
      var row = el('div', 'rev-item');
      row.innerHTML = '<span class="t">⚠ Skipped</span><span class="s"><strong>Exercise ' + n + ':</strong> ' + esc(ex.summary) + '</span>';
      var b = el('button', 'btn primary', 'Answer ▶');
      b.addEventListener('click', function () {
        S.skipReturn = true;
        S.screen = 'exam';
        renderExercise(ex);
      });
      row.appendChild(b);
      c.appendChild(row);
    });
    var fin = el('button', 'btn green', 'Submit exam ▶');
    fin.style.marginTop = '14px';
    fin.addEventListener('click', function () { finishExam(); });
    c.appendChild(fin);
    app.appendChild(c);
  }

  /* ================= results ================= */
  function finishExam() {
    T.end();
  }
  function renderResults(app) {
    S.current = null;
    app.innerHTML = '';
    updateHeader();
    var answered = 0, sum = 0;
    var nC = 0, nP = 0, nW = 0, nS = 0, pSum = 0;
    CFG.exercises.forEach(function (e) {
      var st = S.status[e.id];
      if (!st || st === 'skipped') { nS++; return; }
      answered++;
      var cr = S.credit[e.id] || 0;
      sum += cr;
      if (cr >= 1) { nC++; }
      else if (cr > 0) { nP++; pSum += cr; }
      else { nW++; }
    });
    var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    var passed = percent >= PASS;

    var card = el('div', 'card');
    card.appendChild(el('h2', 'c-blue', '🏁 Final results — ' + esc(CFG.title)));
    var v = el('div', 'verdict ' + (passed ? 'pass' : 'fail'));
    v.appendChild(el('div', 'vp', passed ? '✓ PASS' : '✗ FAIL'));
    v.appendChild(el('div', 'scoreline', 'Score: <strong class="mono">' + (Math.round(sum * 10) / 10).toFixed(1) + ' / ' + answered + '</strong> — final percent <strong class="mono">' + percent + '%</strong> (pass mark ' + PASS + '%)'));
    v.appendChild(el('div', 'scoreline muted', passed
      ? 'Nice work — you showed a solid grasp of M1056 Pre-compromise at this level.'
      : 'You need 70% to pass. Review the explanations, then retake the exam — the questions and answers will be shuffled again.'));
    card.appendChild(v);
    var grid = el('div', 'res-grid');
    [['✓', nC, 'Fully correct', 'correct'],
     ['✓', nP, (nP > 0 ? 'Partially correct (avg ' + (pSum / nP).toFixed(2) + ')' : 'Partially correct'), 'partial'],
     ['✗', nW, 'Fully incorrect', 'wrong'],
     ['⚠', nS, 'Skipped — excluded', 'skipped']].forEach(function (r) {
      var d = el('div', 'res-card ' + r[3]);
      d.appendChild(el('div', 'n', r[0] + ' ' + r[1]));
      d.appendChild(el('div', 'l', esc(r[2])));
      grid.appendChild(d);
    });
    card.appendChild(grid);
    var stats = el('p', 'small muted');
    stats.innerHTML = '⏱ Time left when the exam ended: <strong>' + fmtT(T.remain) + '</strong> · ⏸ Manual break time: <strong>' + fmtT(Math.round(S.manualPauseTotal)) + '</strong> · ⏸ Feedback review time: <strong>' + fmtT(Math.round(S.autoPauseTotal)) + '</strong>';
    card.appendChild(stats);
    var rt = el('button', 'btn primary', '↻ Retake exam');
    rt.style.marginTop = '10px';
    rt.addEventListener('click', function () { startExam(); });
    card.appendChild(rt);
    app.appendChild(card);

    if (!S.reported) {
      S.reported = true;
      reportScore(sum, answered);
    }
  }
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= PASS
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  /* ================= site handshake ================= */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    if (event.data.username) {
      S.username = String(event.data.username).slice(0, 40);
      updateHeader();
    }
    /* event.data.theme is always 'dark' — this file is dark-only by contract; nothing to switch. */
  });

  /* ================= timer end ================= */
  T.end = (function (origEnd) {
    return function () {
      var wasEnded = (T.state === 'ENDED');
      origEnd.call(T);
      if (!wasEnded && (S.screen === 'exam' || S.screen === 'review')) {
        /* timeout or submit: go to results; skipped stay excluded */
        S.screen = 'results';
        renderResults($('#app'));
      }
    };
  })(T.end);

  /* ================= boot ================= */
  document.body.className = CFG.sevClass;
  buildHeader();
  T.render();
  showScreen('intro');
})();

</script>
</body>
</html>
