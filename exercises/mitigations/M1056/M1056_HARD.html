}

.hint { border: 1px solid var(--accent-amber); background: var(--accent-amber-low); border-radius: 8px; padding: 10px 14px; margin-top: 12px; }

.fb-next { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

.rev-item {

.res-card.correct { border-color: var(--state-correct); } .res-card.correct .n, .res-card.correct .l { color: var(--state-correct); }
.res-card.partial { border-color: var(--state-partial); } .res-card.partial .n, .res-card.partial .l { color: var(--state-partial); }
.res-card.wrong { border-color: var(--state-incorrect); } .res-card.wrong .n, .res-card.wrong .l { color: var(--state-incorrect); }
.res-card.skipped { border-color: var(--state-skipped); } .res-card.skipped .n, .res-card.skipped .l { color: var(--state-skipped); }
.verdict { border-radius: 10px; padding: 20px 22px; margin-top: 16px; border: 1px solid; }
.verdict .vp { font-size: 34px; font-weight: 800; letter-spacing: 0.04em; }
.verdict.pass { border-color: var(--state-correct); background: var(--accent-green-wash); }
.verdict.pass .vp { color: var(--state-correct); }
.verdict.fail { border-color: var(--state-incorrect); background: var(--state-incorrect-wash); }
.verdict.fail .vp { color: var(--state-incorrect); }
.scoreline { font-size: 15px; margin-top: 6px; }

@media (max-width: 780px) {
  .match-grid { grid-template-columns: 1fr; }
  .zones.z3, .zones.z4 { grid-template-columns: 1fr; }
  .zones.z2 { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr; }
  #hdr-row { gap: 6px 10px; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #pfill::after { animation: none; display: none; }
  * { transition: none !important; }
}

<script>window.__EXAM__ = {"topicId":"m1056","batch":3,"title":"M1056 Pre-compromise — HARD","severity":"HARD","sevClass":"sev-hard","partLabel":null,"timerSeconds":2640,"exercises":[{"id":"h01","type":"single","summary":"Alarming-looking exposure that is actually documented and benign","scenario":{"note":"An intern runs the new OSINT sweep and floods the channel with an urgent find. You have ten minutes before the daily stand-up, and a decision is expected.","artifacts":[{"kind":"text","title":"Quick checks you run","body":"• The site is corp-portal[.]example/team — our own “Meet the team” page.\n• Change ticket MKT-0442: “Publish team page per comms strategy” — approved 4 months ago.\n• Legal reviewed it; two contractors asked to be removed and were."}]},"question":"What is the correct course of action?","widget":{"type":"single","options":[{"id":"o1","text":"Log it as known, documented exposure; keep it under risk acceptance and re-check the page quarterly"},{"id":"o2","text":"Declare a data-breach incident and notify the regulator within 72 hours"},{"id":"o3","text":"Delete the page immediately and ask Legal to investigate the intern"},{"id":"o4","text":"Rename every employee in the page tonight from the security team's side"}],"correct":"o1"},"hint":"The exposure is real — but who published it, and who approved it?","exp":{"intro":"The exposure exists, but it is deliberate, approved and recorded: our own marketing page under an approved ticket. That is risk acceptance, not an incident, and certainly not a regulator notification. The professional move is to log it in the exposure register, keep the acceptance current, and review it on a cadence — not to destroy a business asset in panic.","items":{"o1":"Right — known exposure + ticket = documented risk acceptance with review cadence.","o2":"A regulator breach notice needs an actual unauthorised disclosure; an approved marketing page is not that.","o3":"Deleting an approved business asset without consulting its owners is overreach, and the intern did nothing wrong.","o4":"Security unilaterally falsifying a comms page would break trust and process."},"study":"Known-vs-unknown exposure: check ticket history before escalating any OSINT hit."}},{"id":"h02","type":"multi","summary":"DNS records changed with no ticket — hijack response reasoning","scenario":{"note":"Monday 07:40. Monitoring shows the MX record of corp[.]example changed over the weekend, and the SPF record was modified. No change ticket exists. The registrar dashboard shows transfer-lock OFF on the domain.","artifacts":[{"kind":"log","title":"DNS watch — corp[.]example","filter":true,"lines":["2026-10-17 23:41:02 WARN  MX changed: mail.corp[.]example -> mail[.]corp-support[.]example (10 mail-servers)","2026-10-17 23:41:07 WARN  TXT/SPF modified: +include:mail[.]corp-support[.]example","2026-10-18 08:02:11 ERROR registrar: transfer-lock status = OFF (was ON since 2024)","2026-10-18 08:02:15 INFO  registrar: no login sessions from our IP range in the window"]}]},"question":"Select the TWO correct immediate conclusions.","widget":{"type":"multi","options":[{"id":"o1","text":"Treat this as a possible domain-control incident and verify the registrar account and records with the registrar right away"},{"id":"o2","text":"Re-point the records to known-good values while preserving evidence of the change"},{"id":"o3","text":"No action needed — DKIM signatures will protect every receiver regardless of MX changes"},{"id":"o4","text":"Lower the DMARC policy to p=none until the alerts stop"}],"correct":["o1","o2"]},"hint":"One option is about verification, one about restoration — the other two weaken you.","exp":{"intro":"An unexplained MX/SPF change with the transfer lock off is a domain hijack pattern until proven otherwise; verify with the registrar first. Restoring known-good records is correct, but do it with evidence preserved — screenshots and zone-history exports. DKIM does not save you if mail flows to an attacker's server, and lowering DMARC would make spoofing easier, not harder.","items":{"o1":"Right — possible hijack is the default hypothesis; the registrar is the first call.","o2":"Right — restore integrity fast, but keep the forensic trail.","o3":"DKIM verifies message content; it does not stop your mail from flowing to a hostile MX.","o4":"p=none turns enforcement off — exactly what the attacker wants."},"study":"Domain hijack runbook: verify, preserve, restore, then re-lock and rotate credentials."}},{"id":"h03","type":"dnd","summary":"Triage five OSINT/ASM hits into three dispositions","scenario":{"note":"End of shift. Five items sit in the pre-compromise queue. Each needs a disposition before tomorrow's review.","artifacts":[{"kind":"text","title":"Queue","body":"1. Staff-directory PDF on the careers site — approved ticket HR-1138, legal-reviewed.\n2. New lookalike domain with valid TLS cert, hosted on a VPS, login-style page live.\n3. Admin credential for our VPN posted on a paste site 3 hours ago.\n4. Fake portal hosted inside a compromised WordPress site of an unrelated small business.\n5. Old FTP banner leaking server version — low impact, already in patch backlog."}]},"question":"Place each item into the right disposition.","widget":{"type":"dnd","zones":[{"id":"z1","label":"Known / documented — close"},{"id":"z2","label":"Investigate today"},{"id":"z3","label":"Backlog with tracking"}],"items":[{"id":"i1","text":"Staff-directory PDF, approved ticket HR-1138","zone":"z1"},{"id":"i2","text":"Lookalike domain with live login page","zone":"z2"},{"id":"i3","text":"VPN admin credential on paste site","zone":"z2"},{"id":"i4","text":"Fake portal on a compromised third-party site","zone":"z2"},{"id":"i5","text":"FTP banner version leak","zone":"z3"}]},"hint":"Approved + harmless = close. Active brand abuse or leaked credentials = now. Cosmetic = backlog.","exp":{"intro":"The staff-directory PDF is documented exposure — close it. The live lookalike, the leaked VPN credential and the portal staged on compromised third-party hosting are all active pre-compromise threats that can convert to Initial Access — investigate today. The banner leak is minor hygiene: track it, patch it, but it does not outrank the others.","items":{"i1":"Documented, approved, reviewed — close with the ticket reference.","i2":"A live phishing trap is the highest-urgency brand threat.","i3":"A leaked VPN credential is one password guess away from Initial Access.","i4":"Staging on compromised third-party hosting (T1584/T1608) still phishes your brand.","i5":"Version banners are low-value recon fodder — fix via backlog."},"study":"Disposition needs three ingredients: documentation, exploitability, urgency."}},{"id":"h04","type":"branch","summary":"Domain hijack response — four decisions under time pressure","scenario":{"note":"Follows on from the Monday-morning DNS anomaly. You own the response. Four decisions, each one shapes the next.","artifacts":[{"kind":"log","title":"Status board","filter":false,"lines":["08:05 MX/SPF changed without ticket; transfer-lock OFF","08:06 Registrar confirms a support session reset our account email 23:35","08:07 Mail flow partially routed through attacker MX for ~9 hours"]}]},"question":"Choose the best action at each step.","widget":{"type":"branch","steps":[{"q":"Step 1 — First move at 08:10?","options":[{"id":"a","text":"Re-secure the registrar account: lock the domain, restore contacts, rotate credentials and API keys","leads":"Registrar control regained at 08:40. Now the records themselves."},{"id":"b","text":"Post publicly that our mail is compromised","leads":"Public statements before containment cause panic and tip off the actor."},{"id":"c","text":"Wipe the DNS zone entirely to stop the abuse","leads":"That takes mail offline completely — you destroyed your own service map."}]},{"q":"Step 2 — Records and evidence, in which order?","options":[{"id":"a","text":"Export zone history and registrar logs first, then restore MX/SPF to known-good","leads":"Evidence preserved; mail flow normalized by 09:20."},{"id":"b","text":"Restore records first and let history sort itself out","leads":"You just overwrote your best evidence of what the attacker changed."},{"id":"c","text":"Leave records as they are until the investigation ends","leads":"Every extra hour routes mail through the attacker's servers."}]},{"q":"Step 3 — What about the 9 hours of diverted mail?","options":[{"id":"a","text":"Assume some mail was read or intercepted: force password resets for exposed flows and review sensitive threads","leads":"Impact assessment started with a defensible scope."},{"id":"b","text":"Assume nothing was read because the attacker 'only' changed records","leads":"The change was the attack — diverted mail is the objective."},{"id":"c","text":"Email everyone to change their password immediately, no triage","leads":"Blanket resets without scoping create chaos and hide the real exposure."}]},{"q":"Step 4 — Prevent the repeat","options":[{"id":"a","text":"Registry lock, registrar MFA, DNS change alerting, and quarterly record review","leads":"Control set restored to stronger than before — case ready for review."},{"id":"b","text":"Nothing — it was a one-off phishing of one admin","leads":"One-off? The account was phished because no MFA existed."},{"id":"c","text":"Disable DNS change alerting to reduce noise","leads":"That removes the exact control that would catch the next attempt."}]}],"correct":["a","a","a","a"]},"hint":"Control the registrar first, evidence before restore, scope the exposure, then harden.","exp":{"intro":"A hijack response follows a strict order: regain registrar control (lock, contacts, credentials), preserve evidence before restoring records, scope the diversion window for real impact, then harden — registry lock, MFA, DNS change alerting and review cadence. Each shortcut here either destroys evidence, extends the compromise, or removes your future detection.","items":{"s0":"The registrar account is the crown jewel — secure it before anything else.","s1":"Zone history and registrar logs are evidence; restore only after export.","s2":"Diverted mail is a real exposure — scope it, do not guess and do not panic-reset everyone.","s3":"Registry lock + MFA + alerting is the minimum hardening set after a hijack."},"study":"Write the four-step hijack runbook from this exercise and keep it in the on-call folder."}},{"id":"h05","type":"single","summary":"The obvious fix (pull the website) is the wrong fix","scenario":{"note":"After a scare with OSINT findings, a director proposes: “Take the whole public website down for a month. No website, no recon.” The business runs lead generation through that site.","artifacts":[{"kind":"text","title":"Director's proposal","body":"“Remove corp-portal[.]example from the internet for 30 days. Zero public information, zero risk. Marketing can pause campaigns.”"}]},"question":"What is the best response to the proposal?","widget":{"type":"single","options":[{"id":"o1","text":"Reject the blanket takedown; propose targeted scrubbing of exploitable details plus monitoring — the site stays, the risk shrinks"},{"id":"o2","text":"Accept it — removing all public information is achievable and free"},{"id":"o3","text":"Accept it but only for the homepage"},{"id":"o4","text":"Reject it and change nothing — recon is unstoppable"}],"correct":"o1"},"hint":"The proposal fails on both business impact and on actually solving the problem. What is the middle path?","exp":{"intro":"A blanket takedown damages the business and does not achieve zero exposure — staff social media, partner sites, registries and archives remain. The correct posture is targeted: remove the exploitable specifics (hostnames, named contacts, versions), keep the business function, and monitor what remains. Doing nothing is equally wrong; recon rewards preparation.","items":{"o1":"Right — proportionate reduction plus monitoring is the sustainable control.","o2":"Zero public information is impossible; staff, partners and archives leak by existing.","o3":"A cosmetic gesture that changes nothing about the exposure set.","o4":"Defeatism — exposure reduction measurably slows and degrades recon."},"study":"Risk-proportionate exposure reduction beats both extremes."}},{"id":"h06","type":"match","summary":"Map five observations to their ATT&CK techniques","scenario":{"note":"You inherit a CTI report with raw observations and no technique mapping. Finish the analyst's job.","artifacts":[{"kind":"text","title":"Raw observations","body":"1. Syn floods of port-sweeps across our /16 from rotating VPS IPs.\n2. Queries hitting our careers page and sitemap from scraping frameworks.\n3. Banners: our old appliances self-identify 'Apache/2.2.15' publicly.\n4. A lookalike domain now hosts a phishing kit and fake mail exchanger.\n5. Someone purchased a technical dossier on our sector from an underground vendor."}]},"question":"Match each observation to its technique.","widget":{"type":"match","left":[{"id":"l1","text":"Port sweeps across the /16"},{"id":"l2","text":"Scraping of careers page and sitemap"},{"id":"l3","text":"Self-identifying 'Apache/2.2.15' banners"},{"id":"l4","text":"Lookalike hosting a phishing kit"},{"id":"l5","text":"Purchased technical dossier"}],"right":[{"id":"r1","text":"T1595.001 — Scanning IP Blocks"},{"id":"r2","text":"T1594 — Search Victim-Owned Websites"},{"id":"r3","text":"T1592.002 — Gather Victim Host Information: Software"},{"id":"r4","text":"T1608 — Stage Capabilities"},{"id":"r5","text":"T1597.002 — Purchase Technical Data"}],"pairs":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4","l5":"r5"}},"hint":"Separate collecting (about you) from building/staging (for the attack) from buying (closed sources).","exp":{"intro":"Sweeps map to Scanning IP Blocks. Scraping your own sites maps to Search Victim-Owned Websites. Version banners feed Gather Victim Host Information: Software. A hosted kit on a lookalike is staging (T1608). Buying a dossier is closed-source collection (T1597.002). The order of the right column is deliberately shuffled.","items":{"l1":"Sweeps of an address range are the definition of .001.","l2":"Your own sites = victim-owned websites.","l3":"Banners reveal software versions — host information, .002.","l4":"Uploading kit to attacker infrastructure is staging.","l5":"Underground purchases are closed sources, and .002 is the purchase variant."},"study":"T1595/.001, T1594, T1592/.002, T1608, T1597/.002 — five anchors for CTI mapping."}},{"id":"h07","type":"multi","summary":"Coverage-gap review of a pre-compromise control set","scenario":{"note":"A mature-sounding but incomplete control set passed last audit. Find the gaps that still let adversaries prepare against you quietly.","artifacts":[{"kind":"text","title":"Current controls","body":"• External vulnerability scanner, weekly\n• SPF/DKIM/DMARC at p=reject\n• WHOIS privacy on all corporate domains\n• No lookalike-domain watch\n• No paste-site or access-broker monitoring\n• No certificate-transparency watch"}]},"question":"Select the THREE gaps that leave the organisation blind to pre-compromise preparation.","widget":{"type":"multi","options":[{"id":"o1","text":"No lookalike-domain watch"},{"id":"o2","text":"No paste-site, access-broker or credential-leak monitoring"},{"id":"o3","text":"No certificate-transparency watch for brand-imitating certs"},{"id":"o4","text":"Not enough internal firewalls between office VLANs"},{"id":"o5","text":"No annual staff day on social media oversharing"}],"correct":["o1","o2","o3"]},"hint":"Three gaps are external-visibility blind spots; two options are real controls but answer a different question.","exp":{"intro":"Lookalike watches, credential-leak monitoring (including access-broker chatter — the T1650 supply of 'access') and CT-log watches are the three external early-warning systems missing here. Internal firewalls are a fine segmentation control but do nothing about preparation happening outside. The staff day is genuinely useful — but it is not a blind spot in this control set; the question asks where you are blind.","items":{"o1":"Right — staged lookalike infrastructure would go unnoticed.","o2":"Right — leaked credentials and sold access are invisible without it.","o3":"Right — attackers certify their fake portals; CT logs expose that moment.","o4":"Internal segmentation is out of scope for pre-compromise visibility.","o5":"Awareness helps prevention, but the question targets detection blind spots."},"study":"Pre-compromise blindness = lookalikes, leaks/access sales, certificates."}},{"id":"h08","type":"fill","summary":"Complete the recon-chain incident note","scenario":{"note":"You finish the timeline note for a near-miss: an actor probed, found a forgotten staging host, and prepared delivery — all caught before a single email was sent.","artifacts":[{"kind":"text","title":"Timeline note (gaps)","body":"The actor ran (1)____-based scanning for hidden admin paths, found a forgotten staging (2)____ with default credentials, and staged their malware by (3)____ it to a compromised web service."}]},"question":"Fill the three gaps.","widget":{"type":"fill","text":"The actor ran __b1__-based scanning for hidden admin paths, found a forgotten staging __b2__ with default credentials, and staged their malware by __b3__ it to a compromised web service.","blanks":[{"id":"b1","correct":"w1"},{"id":"b2","correct":"w2"},{"id":"b3","correct":"w3"}],"bank":[{"id":"w1","text":"wordlist"},{"id":"w2","text":"portal"},{"id":"w3","text":"uploading"},{"id":"w4","text":"ransomware"},{"id":"w5","text":"printer"},{"id":"w6","text":"printing"}]},"hint":"T1595.003 is wordlist scanning; T1608.001 is uploading malware.","exp":{"intro":"Wordlist scanning (T1595.003) hunts hidden paths; the forgotten staging portal with default creds is the entry asset; uploading to a compromised service is staging (T1608.001/.002). The distractors describe post-compromise impact or unrelated devices.","items":{"b1":"Wordlist scanning is the technique behind path brute-forcing.","b2":"The forgotten host was a staging portal.","b3":"Stage Capabilities uploads malware/tools to attacker-controlled or compromised services."},"study":"T1595.003 and T1608 — the scanning and staging pair."}},{"id":"h09","type":"order","summary":"Rank four ASM findings by remediation urgency","scenario":{"note":"One maintenance window, four external findings, one team. Rank what gets fixed first — most dangerous to least.","artifacts":[{"kind":"table","title":"Findings","head":["Ref","Finding"],"rows":[["A","VPN appliance with a known exploited CVE, internet-facing"],["B","Staging portal with vendor-default admin credentials"],["C","Anonymous-FTP with readable /pub (no customer data)"],["D","Missing HSTS header on the marketing site"]]}]},"question":"Rank the findings from most urgent to least urgent.","widget":{"type":"order","items":[{"id":"i1","text":"A — VPN appliance, known exploited CVE"},{"id":"i2","text":"B — Staging portal, default credentials"},{"id":"i3","text":"C — Anonymous-FTP, readable /pub"},{"id":"i4","text":"D — Missing HSTS header"}]},"hint":"Known-exploited beats default-creds beats data-snooping beats header hygiene.","exp":{"intro":"A known exploited CVE on an internet appliance is being mass-scanned for right now — fix first. Default credentials are trivially exploitable but require the attacker to find the panel — second. Anonymous FTP leaks non-customer files to anyone who looks — third. A missing HSTS header is hygiene with no direct pre-compromise entry — last.","items":{"i1":"Mass-scanned, exploited in the wild — top of the list.","i2":"Trivial exploitation if found, but not mass-hunted like the CVE.","i3":"Exposure without a foothold — urgent-ish, not critical.","i4":"Protocol hygiene — schedule it, don't burn the window on it."},"study":"Rank by: exploited-in-the-wild > weak auth > data exposure > header hygiene."}},{"id":"h10","type":"multi","summary":"True trade-offs when operating M1056-style controls","scenario":{"note":"The GRC team drafts the residual-risk section for the pre-compromise programme. Which statements are true trade-offs worth recording?","artifacts":[{"kind":"text","title":"Draft statements","body":"A. WHOIS privacy also hides our contacts from legitimate researchers and partners\nB. Strict DMARC (p=reject) can reject legitimate newsletters until senders are aligned\nC. External monitoring produces false positives that need tuning time\nD. DNSSEC makes phishing with our brand impossible\nE. With enough effort we can remove all public information about the company"}]},"question":"Select the THREE statements that are true trade-offs or limits.","widget":{"type":"multi","options":[{"id":"o1","text":"WHOIS privacy hides from everyone, including legitimate parties"},{"id":"o2","text":"DMARC reject can bounce legitimate mail until alignment"},{"id":"o3","text":"External monitoring needs tuning for false positives"},{"id":"o4","text":"DNSSEC makes brand phishing impossible"},{"id":"o5","text":"All public information can be removed"}],"correct":["o1","o2","o3"]},"hint":"Two of the five are overclaims — no control is magic.","exp":{"intro":"Privacy hides registrant data from everybody, including people with legitimate reasons — that is a real trade-off. DMARC reject without sender alignment bounces real mail — plan the rollout. Monitoring always brings false positives and needs tuning time. DNSSEC protects DNS answers, not brand phishing. And total information removal is impossible while the business operates.","items":{"o1":"Right — the same privacy that starves recon also blocks friendly contact.","o2":"Right — the classic DMARC rollout pain; stage p=none → quarantine → reject.","o3":"Right — every ASM programme lives with alert tuning.","o4":"DNSSEC signs DNS records; it does nothing to fake portals or spoofed mail.","o5":"Removal is asymptotic — archives and third parties keep existing."},"study":"Record trade-offs next to controls — auditors and CISOs both ask."}},{"id":"h11","type":"single","summary":"Using closed-source intel that actors are researching your sector","scenario":{"note":"Your TI vendor flags chatter: an actor set is collecting target dossiers on fintech companies — yours is in the sample. No staging observed against you yet.","artifacts":[{"kind":"text","title":"Vendor note","body":"Actor set A purchases technical data on fintech targets (T1597.002 pattern).\nYour company appears in two sampled dossiers.\nNo lookalike registrations, no staging observed against your brand yet."}]},"question":"What is the best use of this intelligence right now?","widget":{"type":"single","options":[{"id":"o1","text":"Pre-position: raise brand/domain watch sensitivity, brief ASM and helpdesk, and hunt for early staging indicators"},{"id":"o2","text":"Wait for the first phishing email, then block the sender"},{"id":"o3","text":"Firewall-block the vendor's report ID as an IOC"},{"id":"o4","text":"Publish the dossiers publicly to warn the community"}],"correct":"o1"},"hint":"Nothing has been staged yet — what is the value of knowing before it is?","exp":{"intro":"Closed-source collection precedes staging. You cannot block anyone yet — there is nothing to block — but you can sharpen watches (domains, certs, paste sites), pre-brief the helpdesk, and hunt for the first lookalike. Waiting surrenders the timing advantage; publishing vendor-sourced dossiers creates legal exposure.","items":{"o1":"Right — pre-positioning is exactly what pre-compromise intel is for.","o2":"By the first email, preparation finished — you lost the cheap phase.","o3":"A report ID is not an IOC; firewalls cannot act on it.","o4":"Republishing purchased data is a legal and ethical misstep."},"study":"Intel value = action before the attack phase it predicts."}},{"id":"h12","type":"dnd","summary":"Map four findings to the M1056 measure that prevents their repeat","scenario":{"note":"Post-review, the pre-compromise board asks: for each finding, which measure stops the next one?","artifacts":[{"kind":"text","title":"Findings","body":"1. Staff keep posting badge close-ups at conferences.\n2. An expired brand domain with mail history was repurchased by an unknown party.\n3. A forgotten test server sat exposed with an admin panel for 6 weeks.\n4. A 2023 partner PDF still lists executives' direct emails."}]},"question":"Place each finding under the measure that prevents its recurrence.","widget":{"type":"dnd","zones":[{"id":"z1","label":"Limit Information Exposure"},{"id":"z2","label":"Protect Domain and DNS"},{"id":"z3","label":"External Monitoring"},{"id":"z4","label":"Training and Awareness"}],"items":[{"id":"i1","text":"Badge close-ups at conferences","zone":"z4"},{"id":"i2","text":"Repurchased expired brand domain","zone":"z2"},{"id":"i3","text":"Forgotten exposed test server","zone":"z3"},{"id":"i4","text":"Old PDF with executive emails","zone":"z1"}]},"hint":"Behaviour, registrations, forgotten assets, published documents — four different owners.","exp":{"intro":"Badge photos are behaviour — training. Expired-domain repurchase is a registration lifecycle issue — domain/DNS protection (inventory, renew or watch). Forgotten external assets are what External Monitoring exists to catch. Published documents are Information Exposure hygiene.","items":{"i1":"Only awareness changes what people post.","i2":"Domain inventory and monitoring own registration lifecycle risk.","i3":"Continuous external scanning finds what inventories miss.","i4":"Document hygiene is the information-exposure measure."},"study":"Prevention mapping: each finding has exactly one preventive owner."}},{"id":"h13","type":"branch","summary":"Dual perspective: red team plans recon, blue team blunts it","scenario":{"note":"You switch hats three times in this assessment debrief: attacker, defender, then programme owner.","artifacts":[{"kind":"text","title":"Engagement frame","body":"Scope: public-facing footprint only. No scanning of victim infrastructure without written approval.\nGoal: show how much an attacker can learn without touching our estate."}]},"question":"Pick the best answer for each hat.","widget":{"type":"branch","steps":[{"q":"Step 1 — RED: cheapest way to map the target's tech and people?","options":[{"id":"a","text":"Passive collection: search engines, code repositories, public documents and the careers site","leads":"The red notebook fills up: hostnames, staff, versions — zero packets sent."},{"id":"b","text":"Nmap-scan every IP range we can find, fast","leads":"Loud, scoped-out without approval, and burns the engagement in a day."},{"id":"c","text":"Phish ten employees to get on the inside first","leads":"That is an attack, not recon — and out of scope for this engagement."}]},{"q":"Step 2 — BLUE: which control blunts this passive collection the most?","options":[{"id":"a","text":"Information-exposure hygiene: scrub repos, docs and the careers site of exploitable specifics","leads":"The red notebook shrinks — less to collect, same packets: zero."},{"id":"b","text":"Rate-limit the firewall for foreign IPs","leads":"Passive collection never touched your firewall — it reads third parties."},{"id":"c","text":"Require MFA on all staff laptops","leads":"Good control, wrong problem — recon never logs in."}]},{"q":"Step 3 — PROGRAMME: what proves the programme works over time?","options":[{"id":"a","text":"Metrics: fewer exposures found by third-party scans, faster takedowns, shrinking recon surface","leads":"The board accepts the programme with a measurable baseline."},{"id":"b","text":"Number of alerts raised per week","leads":"Alert volume measures noise, not risk reduction."},{"id":"c","text":"Zero phishing emails received this quarter","leads":"That is luck plus luck; it measures arrival, not preparation."}]}],"correct":["a","a","a"]},"hint":"Red: free information. Blue: shrink the source. Programme: measure the surface, not the noise.","exp":{"intro":"Red teams prefer passive collection — free, silent, and legal within scope. The blunting control is hygiene of the sources themselves, since traffic controls never see a web search. Programmes prove themselves with exposure metrics and takedown latency, not alert volume or phishing counts.","items":{"s0":"Passive recon is the attacker's cheap default — show its yield honestly.","s1":"You cannot firewall a search engine; you can empty it of your details.","s2":"Exposure trend and takedown latency are the honest KPIs."},"study":"Run a passive-recon exercise on your own brand quarterly."}},{"id":"h14","type":"single","summary":"Benign-looking brand mention that is actually staged phishing","scenario":{"note":"A marketing analyst flags what looks like aggressive SEO: many new third-party pages heavily link your brand to a download portal that “just helps people find our product”.","artifacts":[{"kind":"log","title":"Analyst note + quick check","filter":false,"lines":["analyst: dozens of new pages link our brand to 'secure-download-portal[.]example'","analyst: page looks like a clean mirror of our product page, well made","check: portal serves an installer hash that does NOT match our published one","check: cert issued 4 days ago to an unrelated registrant"]}]},"question":"What is the correct assessment?","widget":{"type":"single","options":[{"id":"o1","text":"Staged malware delivery using brand imitation and SEO poisoning — escalate for takedown now"},{"id":"o2","text":"A fan-made mirror — ask marketing to endorse it"},{"id":"o3","text":"Standard SEO competition — no security relevance"},{"id":"o4","text":"A CDN cache anomaly — wait for it to clear"}],"correct":"o1"},"hint":"Compare the installer hash with your published one. Who benefits from the difference?","exp":{"intro":"A polished mirror with a mismatched installer hash and a fresh certificate is SEO-poisoned malware staging (T1608.005/.006). The well-made look is the trick: it rides your brand trust. Endorsing, dismissing or waiting all hand the actor time to land victims.","items":{"o1":"Right — the hash mismatch is the smoking gun; escalate immediately.","o2":"The hash difference means the installer is not your product.","o3":"SEO competition does not serve altered installers.","o4":"Cache anomalies do not re-sign certificates."},"study":"Hash-compare any 'mirror' of your software before judging it benign."}},{"id":"h15","type":"multi","summary":"Which real behaviours belong in the pre-compromise threat brief","scenario":{"note":"You must brief leadership on what 'pre-compromise' means with concrete behaviours. Pick the behaviours that genuinely belong.","artifacts":[{"kind":"text","title":"Candidate bullets","body":"A. Actors repurchase expired domains that carry our old brand history\nB. Actors run SEO poisoning to place fake downloads above our real site\nC. Actors query public AI services to research our org and write lures\nD. Actors dump credentials from a domain controller\nE. Actors encrypt a file server and post a ransom note"}]},"question":"Select the THREE behaviours that are pre-compromise.","widget":{"type":"multi","options":[{"id":"o1","text":"repurchasing expired brand domains"},{"id":"o2","text":"SEO poisoning with fake downloads"},{"id":"o3","text":"researching the org via public AI services"},{"id":"o4","text":"dumping credentials from a domain controller"},{"id":"o5","text":"encrypting a server for ransom"}],"correct":["o1","o2","o3"]},"hint":"Two bullets require already being inside your network.","exp":{"intro":"Expired-domain repurchase (T1583), SEO poisoning (T1608.006) and research via public AI services (T1682) all happen before any foothold — they are the modern face of recon and resource development. DC credential dumping and ransomware need inside access; they are post-compromise and belong in a different brief.","items":{"o1":"Right — acquiring infrastructure with inherited trust.","o2":"Right — staging delivery above your real site.","o3":"Right — public AI services are today's open-source collection tool.","o4":"Needs domain admin — post-compromise.","o5":"Needs full access — post-compromise impact."},"study":"Pre-compromise brief = preparation behaviours; everything needing a foothold is out."}},{"id":"h16","type":"match","summary":"Map M1056 measures to their NIST CSF and CIS Controls anchors","scenario":{"note":"The annual audit asks you to show where the pre-compromise programme sits in the recognised frameworks. GRC hands you the M1056 measure list and the framework index.","artifacts":[{"kind":"attack","title":"Audit request (excerpt)","lines":["'Map each programme control to its anchor in CIS Controls v8 and the NIST CSF.'","Measures in scope: Training and Awareness, Content and Email Protections,","External Monitoring, Threat Intelligence, Limit Information Exposure."]}]},"question":"Match each M1056 measure to the framework anchor that covers the same job.","widget":{"type":"match","left":[{"id":"l1","text":"Training and Awareness"},{"id":"l2","text":"Content and Email Protections"},{"id":"l3","text":"External Monitoring"},{"id":"l4","text":"Threat Intelligence"},{"id":"l5","text":"Limit Information Exposure"}],"right":[{"id":"r1","text":"CIS Control 14 — Security Awareness and Skills Training"},{"id":"r2","text":"CIS Control 9 — Email and Web Browser Protections (SPF/DKIM/DMARC)"},{"id":"r3","text":"NIST CSF — Detect function (DE.CM continuous monitoring)"},{"id":"r4","text":"NIST CSF — Identify function (ID.RA threat information)"},{"id":"r5","text":"NIST CSF — Protect function (shrink what adversaries can collect)"}],"pairs":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4","l5":"r5"}},"hint":"Two anchors come from CIS Controls v8, three from the NIST CSF functions. Awareness and email each own one CIS control.","exp":{"intro":"Auditors accept these anchors: staff training maps to CIS Control 14, and enforced SPF/DKIM/DMARC is exactly what CIS Control 9 asks for. Watching your external estate is the CSF Detect function (continuous monitoring), threat intelligence feeds the Identify function (ID.RA — threat information improves risk decisions), and publishing less is the Protect function: it shrinks what an adversary can collect. This mapping is how you prove the M1056 programme exists on paper.","items":{"l1":"Awareness programmes are CIS 14 — the standard home for security training.","l2":"CIS 9 covers email and browser protections; its safeguards name SPF, DKIM and DMARC.","l3":"Continuous monitoring of your own exposure is the CSF Detect function.","l4":"Threat information that improves risk decisions lives in CSF Identify (ID.RA).","l5":"Sharing less is Protect — it removes the raw material recon lives on."},"study":"Framework mapping: CIS 9 (email), CIS 14 (training); CSF Protect / Detect / Identify."}}],"intro":{"title":"M1056 — HARD practice exam","subtitle":"MITRE ATT&CK Mitigation M1056 — Pre-compromise — dark-mode certification practice exam","facts":[["ATT&CK object","M1056 — Pre-compromise (Mitigation)"],["Severity","<span class=\"sev-badge sev-hard\">🛡 HARD<\/span>"],["Exercises in this file","16"],["Estimated time","about 44 minutes"],["Timer budget","44:00 countdown"],["Pass mark","70%"]],"learn":"<p>M1056 — Pre-compromise covers the preparation phases of an attack, and defending them is judgement work. At this level the difficulty is not vocabulary — it is discrimination: telling the benign from the hostile when both look similar on the surface.<\/p><p>You will work real decisions. A public page listing staff names: is it a leak, or an approved marketing page? A lookalike domain that is parked: dead end, or the quiet phase before a phishing wave? A credential on a paste site: noise, or one guess away from Initial Access? You will also meet the modern attacker toolkit: wordlist scanning (T1595.003), banner harvesting (T1592.002), purchased dossiers (T1597.002), access brokers selling entry (T1650), SEO-poisoned fake downloads (T1608.006) and research done through public AI services (T1682).<\/p><p>Expect artefacts that must be read together — logs, tickets, registration records — and answers where two options are both defensible somewhere else, but only one is correct here. Some correct answers are the least aggressive one; some “best practices” are wrong in context. This is the day-to-day texture of attack-surface management, brand protection and CTI work: most pre-compromise behaviour happens outside your network, so your leverage is exposure reduction, early warning and external takedown channels — applied with proportion. Slow down, read every artefact, and ask who benefits.<\/p>","keywords":[{"theme":"Discrimination under noise","items":["Known vs unknown exposure","Risk acceptance","Least-aggressive response","Disposition triage","Ticket archaeology","Hash comparison of mirrors"]},{"theme":"Attacker operations","items":["T1595.001 Scanning IP Blocks","T1592.002 Software banners","T1597.002 Purchase Technical Data","T1608.005/.006 Link/SEO Poisoning","T1650 Acquire Access","T1682 Query Public AI Services","Compromised third-party hosting"]},{"theme":"Programme judgement","items":["Coverage-gap review","Control trade-offs","Exposure metrics","Publishing policy","Domain-hijack runbook","Red vs blue perspective"]}],"how":["This file contains: single-answer questions, multi-select with partial credit, matching, drag-and-drop triage, fill-in-the-blank, urgency ordering, and two multi-step decision walkthroughs.","The passing score is <strong>70%<\/strong>. Your final percent is computed over the exercises you actually answered. At 70% or more you <strong>PASS<\/strong>; below it you <strong>FAIL<\/strong> and can retake the exam.","The <strong>timer<\/strong> counts down in the top bar. <strong>Pause<\/strong> gives you a manual break: the timer stops and the exercise is hidden until you press Resume. The moment you press <strong>Check<\/strong>, the timer also stops automatically so you can study the feedback for as long as you like — it starts again only when you press <strong>Next<\/strong> (or Final Submit on the last exercise). Skip and Hint never stop the timer.","Some exercises have several correct items. They are scored with <strong>partial credit<\/strong>: each correct item adds credit and each wrong pick subtracts it — credit = max(0, (H − W) / N). Selecting everything gives zero, not safety.","The <strong>Hint<\/strong> button gives one nudge per exercise and costs 10% of that exercise's credit.","<strong>Skip<\/strong> moves an exercise to the Skipped pool without revealing the answer, and the timer keeps running. Before you finish, a review screen lets you answer skipped exercises as many times as you need while time remains. Skipped exercises that are never answered are excluded from the score.","At the end you get a full results screen with a per-item breakdown of every answer. Retaking shuffles the questions and the answer choices again."]}};</script>
<script>
/* ===== CyberPulseAcademy exam engine — M1056 Pre-compromise ===== */
(function () {
  'use strict';
  var CFG = window.__EXAM__;
  var PASS = 70;
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function fmtT(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  var LETTERS = 'ABCDEFGHIJ';

  var S = {
    screen: 'intro', order: [], pos: 0,
    credit: {}, status: {}, checked: {}, hintUsed: {},
    skipReturn: false, attempts: 0, reported: false,
    manualPauseTotal: 0, autoPauseTotal: 0,
    mpT0: null, apT0: null, prevState: 'RUNNING',
    username: '', current: null, widget: null
  };

  /* ================= timer state machine ================= */
  /* states: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED */
  var T = {
    state: 'IDLE', remain: CFG.timerSeconds, iv: null,
    start: function () {
      this.state = 'RUNNING';
      clearInterval(this.iv);
      this.iv = setInterval(function () { T.tick(); }, 1000);
      this.render();
    },
    tick: function () {
      if (this.state !== 'RUNNING') { return; }
      this.remain = this.remain - 1;
      if (this.remain <= 0) { this.remain = 0; this.render(); this.end(); return; }
      this.render();
    },
    pauseManual: function () {
      if (this.state === 'ENDED') { return; }
      /* stacking on top of the auto-pause: close the auto-pause segment first,
         so the same wall-clock time is never counted into both pause totals */
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = 'PAUSED_MANUAL';
      S.mpT0 = Date.now();
      this.render();
    },
    pauseAuto: function () {
      if (this.state === 'ENDED') { return; }
      this.state = 'PAUSED_AUTO_CHECK';
      S.apT0 = Date.now();
      this.render();
    },
    resumeTo: function (st) {
      if (this.state === 'ENDED') { return; }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;
        S.mpT0 = null;
      }
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = (st === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
      /* returning to the auto-pause opens a fresh auto-pause segment */
      if (this.state === 'PAUSED_AUTO_CHECK') { S.apT0 = Date.now(); }
      this.render();
    },
    end: function () {
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;
        S.mpT0 = null;
      }
      this.state = 'ENDED';
      clearInterval(this.iv);
      this.render();
    },
    render: function () {
      var t = $('#timer');
      if (t) { t.textContent = fmtT(this.remain); }
      var c = $('#timerstate');
      if (!c) { return; }
      if (this.state === 'RUNNING') {
        c.className = 'state-chip running'; c.textContent = '▶ RUNNING';
      } else if (this.state === 'PAUSED_MANUAL') {
        c.className = 'state-chip paused'; c.textContent = '⏸ PAUSED — manual (press Resume)';
      } else if (this.state === 'PAUSED_AUTO_CHECK') {
        c.className = 'state-chip paused'; c.textContent = '⏸ PAUSED — reviewing feedback (resumes on Next)';
      } else if (this.state === 'ENDED') {
        c.className = 'state-chip ended'; c.textContent = '■ ENDED';
      } else {
        c.className = 'state-chip'; c.textContent = '● IDLE';
      }
    }
  };

  /* ================= header ================= */
  function buildHeader() {
    var h = $('#hdr');
    h.innerHTML = '';
    var row = el('div', '', ''); row.id = 'hdr-row';
    var brand = el('span', 'brand', 'M1056 · Pre-compromise <small>— MITRE ATT&CK Mitigation</small>');
    var sev = el('span', 'sev-badge ' + CFG.sevClass, '🛡 ' + CFG.severity);
    var counter = el('span', 'hdr-item', ''); counter.id = 'counter';
    var timer = el('span', 'hdr-item mono', '');
    timer.innerHTML = '⏱ <span id="timer" class="mono">' + fmtT(CFG.timerSeconds) + '</span>';
    var tstate = el('span', 'state-chip', '● IDLE'); tstate.id = 'timerstate';
    var score = el('span', 'hdr-item', ''); score.id = 'score';
    var user = el('span', 'hdr-item', ''); user.id = 'userchip'; user.hidden = true;
    var bHint = el('button', 'btn amber', '💡 Hint'); bHint.id = 'btnHint';
    var bPause = el('button', 'btn', '⏸ Pause'); bPause.id = 'btnPause';
    var bSkip = el('button', 'btn', '⏭ Skip'); bSkip.id = 'btnSkip';
    var sp = el('span', 'spacer', ''); sp.style.marginLeft = 'auto';
    row.appendChild(brand); row.appendChild(sev); row.appendChild(counter);
    row.appendChild(timer); row.appendChild(tstate); row.appendChild(score);
    row.appendChild(user); row.appendChild(sp);
    row.appendChild(bHint); row.appendChild(bPause); row.appendChild(bSkip);
    var pbar = el('div', '', ''); pbar.id = 'pbar';
    var pfill = el('div', '', ''); pfill.id = 'pfill';
    pbar.appendChild(pfill);
    h.appendChild(row); h.appendChild(pbar);
    bHint.addEventListener('click', onHint);
    bPause.addEventListener('click', onPause);
    bSkip.addEventListener('click', onSkip);
  }
  function updateHeader() {
    var ex = S.current;
    var counter = $('#counter');
    if (ex) {
      var n = S.order.indexOf(CFG.exercises.indexOf(ex)) + 1;
      counter.innerHTML = 'Exercise <strong>' + n + ' of ' + CFG.exercises.length + '</strong>';
    }
    var answered = 0, sum = 0;
    CFG.exercises.forEach(function (e) {
      var st = S.status[e.id];
      if (st && st !== 'skipped') { answered++; sum += (S.credit[e.id] || 0); }
    });
    var pct = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    $('#score').innerHTML = 'Score <strong class="mono">' + (Math.round(sum * 10) / 10).toFixed(1) + ' / ' + answered + '</strong> <span class="mono">(' + pct + '%)</span>';
    var done = 0;
    CFG.exercises.forEach(function (e) { if (S.status[e.id]) { done++; } });
    $('#pfill').style.width = Math.round((done / CFG.exercises.length) * 100) + '%';
    var u = $('#userchip');
    if (S.username) { u.hidden = false; u.innerHTML = '👤 ' + esc(S.username); }
  }

  /* ================= app screens ================= */
  function showScreen(name) {
    S.screen = name;
    var app = $('#app');
    app.innerHTML = '';
    $('#hdr').hidden = (name === 'intro');
    if (name === 'intro') { renderIntro(app); }
    else if (name === 'exam') { renderCurrent(); }
    else if (name === 'review') { renderReview(app); }
    else if (name === 'results') { renderResults(app); }
  }

  /* ================= intro ================= */
  function renderIntro(app) {
    var I = CFG.intro;
    var c1 = el('div', 'card');
    c1.appendChild(el('h1', '', esc(I.title)));
    c1.appendChild(el('p', 'muted', esc(I.subtitle)));
    var facts = el('div', 'facts');
    I.facts.forEach(function (f) {
      var d = el('div', 'fact');
      d.appendChild(el('div', 'k', esc(f[0])));
      d.appendChild(el('div', 'v', f[1]));
      facts.appendChild(d);
    });
    c1.appendChild(facts);
    app.appendChild(c1);

    var c2 = el('div', 'card');
    c2.appendChild(el('h2', 'c-blue', '📚 What you will learn here'));
    c2.appendChild(el('div', '', I.learn));
    app.appendChild(c2);

    var c3 = el('div', 'card');
    c3.appendChild(el('h2', 'c-amber', '🔑 Keywords covered in this exam'));
    I.keywords.forEach(function (th) {
      var t = el('div', 'theme');
      t.appendChild(el('div', 'theme-h', esc(th.theme)));
      var kw = el('div', 'kw');
      th.items.forEach(function (k) { kw.appendChild(el('span', '', esc(k))); });
      t.appendChild(kw);
      c3.appendChild(t);
    });
    app.appendChild(c3);

    var c4 = el('div', 'card');
    c4.appendChild(el('h2', 'c-green', '⚙ How this exam works'));
    var ul = el('ul', 'rules');
    I.how.forEach(function (r) { ul.appendChild(el('li', '', r)); });
    c4.appendChild(ul);
    var start = el('button', 'btn green', '▶ Start the exam');
    start.style.marginTop = '16px';
    start.style.minWidth = '220px';
    start.addEventListener('click', function () { startExam(); });
    c4.appendChild(start);
    app.appendChild(c4);
  }

  /* ================= exam flow ================= */
  function startExam() {
    S.attempts++; S.reported = false;
    S.order = shuffle(CFG.exercises.map(function (_, i) { return i; }));
    S.pos = 0; S.skipReturn = false;
    S.credit = {}; S.status = {}; S.checked = {}; S.hintUsed = {};
    S.manualPauseTotal = 0; S.autoPauseTotal = 0; S.mpT0 = null; S.apT0 = null; S.prevState = 'RUNNING';
    T.remain = CFG.timerSeconds;
    T.start();
    showScreen('exam');
  }
  function skippedList() {
    return S.order.filter(function (idx) {
      return S.status[CFG.exercises[idx].id] === 'skipped';
    });
  }
  function answeredCount() {
    var n = 0;
    CFG.exercises.forEach(function (e) { var st = S.status[e.id]; if (st && st !== 'skipped') { n++; } });
    return n;
  }
  function advance() {
    S.pos = S.pos + 1;
    if (S.pos < S.order.length) { renderCurrent(); }
    else if (skippedList().length > 0) { showScreen('review'); }
    else { finishExam(); }
  }
  function renderCurrent() {
    if (S.pos < 0 || S.pos >= S.order.length) { return; }
    var exIdx = S.order[S.pos];
    var ex = CFG.exercises[exIdx];
    renderExercise(ex);
  }
  function renderExercise(ex) {
    S.current = ex;
    S.widget = null;
    var app = $('#app');
    app.innerHTML = '';
    updateHeader();

    var wrap = el('div', '');
    var head = el('div', 'ex-head');
    head.innerHTML = '<span>🎯 Exercise ' + (S.order.indexOf(CFG.exercises.indexOf(ex)) + 1) + ' of ' + CFG.exercises.length + '</span>' +
      '<span class="sev-badge ' + CFG.sevClass + '">' + esc(CFG.severity) + '</span>' +
      (CFG.partLabel ? '<span class="hdr-item">' + esc(CFG.partLabel) + '</span>' : '') +
      '<span class="spacer"></span>';
    wrap.appendChild(head);

    var body = el('div', 'ex-body');
    var outer = el('div', '');
    outer.appendChild(body);
    wrap.appendChild(outer);

    /* --- SCENARIO block --- */
    var sblk = el('div', 'blk blk-scen');
    var sh = el('div', 'blk-h');
    sh.innerHTML = '<span class="h-icon">🧭</span> SCENARIO';
    var collapse = el('button', 'btn h-btn', '▾ Collapse');
    collapse.style.minHeight = '30px'; collapse.style.padding = '2px 10px'; collapse.style.fontSize = '12px';
    collapse.addEventListener('click', function () {
      var c = sblk.classList.toggle('collapsed');
      collapse.textContent = c ? '▸ Expand' : '▾ Collapse';
      summary.textContent = c ? '▸ ' + ex.summary + ' — collapsed' : '';
    });
    sh.appendChild(collapse);
    sblk.appendChild(sh);
    var summary = el('div', 'blk-b blk-summary', '');
    sblk.appendChild(summary);
    var sbody = el('div', 'blk-b');
    if (ex.scenario && ex.scenario.note) {
      var nt = el('div', '', '');
      nt.innerHTML = proseHtml(ex.scenario.note);
      sbody.appendChild(nt);
    }
    if (ex.scenario && ex.scenario.artifacts) {
      ex.scenario.artifacts.forEach(function (a, ai) { sbody.appendChild(renderArtifact(a, ai)); });
    }
    sblk.appendChild(sbody);
    body.appendChild(sblk);

    /* --- QUESTION block --- */
    var qblk = el('div', 'blk blk-q');
    var qh = el('div', 'blk-h');
    qh.innerHTML = '<span class="h-icon">❓</span> QUESTION';
    qblk.appendChild(qh);
    var qbody = el('div', 'blk-b');
    qbody.appendChild(el('p', '', '<strong>' + esc(ex.question) + '</strong>'));
    qblk.appendChild(qbody);
    body.appendChild(qblk);

    /* --- YOUR ANSWER block --- */
    var ablk = el('div', 'blk blk-ans');
    var ah = el('div', 'blk-h');
    ah.innerHTML = '<span class="h-icon">✍</span> YOUR ANSWER';
    ablk.appendChild(ah);
    var abody = el('div', 'blk-b');
    ablk.appendChild(abody);
    body.appendChild(ablk);

    var footer = el('div', 'fb-next');
    var btnCheck = el('button', 'btn green', ex.widget.type === 'branch' ? 'Confirm step' : '✓ Check');
    btnCheck.id = 'btnCheck';
    footer.appendChild(btnCheck);
    body.appendChild(footer);

    /* widget build */
    var w = buildWidget(ex, abody, btnCheck);
    S.widget = w;

    btnCheck.addEventListener('click', function () {
      if (btnCheck.disabled) { return; }

  function highlightLog(ln) {

  /* ================= widgets ================= */
  function buildWidget(ex, container, btnCheck) {

    if (w.type === 'match') { return buildMatch(ex, container, btnCheck); }
    if (w.type === 'dnd') { return buildDnd(ex, container, btnCheck); }
    if (w.type === 'order') { return buildOrder(ex, container, btnCheck); }

  /* ---- single / multi ---- */
  function buildOptions(ex, container, btnCheck) {
    var w = ex.widget;

      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (multi) {
          state.sel[o.id] = !state.sel[o.id];
          b.classList.toggle('sel', !!state.sel[o.id]);
          b.setAttribute('aria-pressed', state.sel[o.id] ? 'true' : 'false');
          var tag = $('.sel-tag', b); if (tag) { tag.hidden = !state.sel[o.id]; }
        } else {
          state.sel = {};
          state.sel[o.id] = true;
          opts.forEach(function (oo) {
            var n = nodes[oo.id];
            n.classList.remove('sel');
            n.setAttribute('aria-pressed', 'false');
            var tg = $('.sel-tag', n); if (tg) { tg.hidden = true; }
          });
          b.classList.add('sel');
          b.setAttribute('aria-pressed', 'true');

      type: w.type,
      isReady: function () { return Object.keys(state.sel).some(function (k) { return state.sel[k]; }); },
      collect: function () { return Object.keys(state.sel).filter(function (k) { return state.sel[k]; }); },
      lock: function () { opts.forEach(function (o) { nodes[o.id].disabled = true; }); }
    };
  }

  /* ---- matching ---- */
  function buildMatch(ex, container, btnCheck) {
    var w = ex.widget;

    var leftNodes = {}, rightNodes = {};
    var lcol = el('div', 'match-grid');
    var lc = el('div', ''), rc = el('div', '');
    lc.appendChild(el('div', 'mcol-h', 'Left — items'));
    rc.appendChild(el('div', 'mcol-h', 'Right — meanings'));
    lcol.appendChild(lc); lcol.appendChild(rc);
    container.appendChild(lcol);
    var plist = el('div', 'pairlist');
    container.appendChild(plist);

    function rightText(rid) {
      var r = w.right.filter(function (x) { return x.id === rid; })[0];
      return r ? r.text : rid;
    }
    function renderPairs() {
      plist.innerHTML = '';
      Object.keys(state.pairs).forEach(function (lid) {
        var lt = w.left.filter(function (x) { return x.id === lid; })[0].text;
        var row = el('div', 'pair');
        row.innerHTML = '<span><strong>' + esc(short(lt)) + '</strong></span><span class="arrow">→</span><span>' + esc(rightText(state.pairs[lid])) + '</span>';
        var rm = el('button', 'rm', '✕ Remove');
        rm.type = 'button';
        rm.addEventListener('click', function () {

          renderPairs(); syncChips(); updateCheckState();
        });
        row.appendChild(rm);
        plist.appendChild(row);
      });

    function short(t) { return t.length > 46 ? t.slice(0, 45) + '…' : t; }
    function syncChips() {
      w.left.forEach(function (l) {
        leftNodes[l.id].classList.toggle('picked', state.pickedL === l.id);
        leftNodes[l.id].classList.toggle('paired', !!state.pairs[l.id]);
      });
      w.right.forEach(function (r) {
        var used = Object.keys(state.pairs).some(function (k) { return state.pairs[k] === r.id; });
        rightNodes[r.id].classList.toggle('paired', used);
      });
    }
    shuffle(w.left).forEach(function (l) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(l.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id] || state.pairs[l.id]) { return; }

        syncChips();
      });
      leftNodes[l.id] = b;
      lc.appendChild(b);
    });
    shuffle(w.right).forEach(function (r) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(r.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        var lid = state.pickedL;
        if (!lid) { return; }
        state.pairs[lid] = r.id;
        state.pickedL = null;
        renderPairs(); syncChips(); updateCheckState();
      });
      rightNodes[r.id] = b;
      rc.appendChild(b);
    });
    container.appendChild(el('p', 'small muted', 'Pick one item on the left, then its meaning on the right. You can remove a pair before checking.'));
    return {
      type: 'match',
      isReady: function () { return Object.keys(state.pairs).length > 0; },
      collect: function () { return state.pairs; },
      lock: function () {
        w.left.forEach(function (l) { leftNodes[l.id].disabled = true; });
        w.right.forEach(function (r) { rightNodes[r.id].disabled = true; });
      }

  /* ---- drag & drop ---- */
  function buildDnd(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { place: {}, selChip: null };
    var bank = el('div', 'bank');
    container.appendChild(el('div', 'mcol-h', 'Items'));
    container.appendChild(bank);
    var zcls = w.zones.length >= 4 ? 'z4' : (w.zones.length === 3 ? 'z3' : 'z2');
    var zwrap = el('div', 'zones ' + zcls);
    container.appendChild(zwrap);
    var zoneNodes = {}, chipNodes = {};

    function putInBank(itemId) {
      delete state.place[itemId];
      bank.appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function putInZone(itemId, zid) {
      state.place[itemId] = zid;
      zoneNodes[zid].querySelector('.zitems').appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function syncZones() {
      Object.keys(state.place).forEach(function (iid) {

      });

    var items = shuffle(w.items);
    items.forEach(function (it) {

      c.innerHTML = '<span>' + esc(it.text) + '</span>';
      c.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.place[it.id]) {
          putInBank(it.id);
          return;
        }
        state.selChip = (state.selChip === it.id) ? null : it.id;
        items.forEach(function (o) { chipNodes[o.id].classList.toggle('sel', state.selChip === o.id); });
      });
      c.addEventListener('dragstart', function (ev) {
        if (S.checked[ex.id]) { ev.preventDefault(); return; }
        state.selChip = it.id;
        c.classList.add('dragging');
        try { ev.dataTransfer.setData('text/plain', it.id); } catch (e) {}
      });
      c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
      chipNodes[it.id] = c;
      bank.appendChild(c);
    });
    w.zones.forEach(function (z) {
      var zd = el('div', 'zone');
      zd.setAttribute('data-zone', z.id);

      zd.addEventListener('dragover', function (ev) { ev.preventDefault(); zd.classList.add('over'); });
      zd.addEventListener('dragleave', function () { zd.classList.remove('over'); });
      zd.addEventListener('drop', function (ev) {
        ev.preventDefault();
        zd.classList.remove('over');

        if (!iid) { try { iid = ev.dataTransfer.getData('text/plain'); } catch (e) {} }
        if (!iid) { return; }
        putInZone(iid, z.id);
        state.selChip = null;
        items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
      });
      zd.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.selChip) {
          putInZone(state.selChip, z.id);
          state.selChip = null;
          items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
        }
      });
      zoneNodes[z.id] = zd;
      zwrap.appendChild(zd);
    });
    container.appendChild(el('p', 'small muted', 'Drag an item into a zone — or tap the item, then tap the zone. Tap a placed item to send it back.'));
    return {
      type: 'dnd',
      isReady: function () { return Object.keys(state.place).length > 0; },
      collect: function () { return state.place; },
      lock: function () {

  /* ---- ordering ---- */
  function buildOrder(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { seq: shuffle(w.items.map(function (x) { return x.id; })) };
    var ol = el('ul', 'olist');
    container.appendChild(ol);
    var nodes = {};
    function text(id) { return w.items.filter(function (x) { return x.id === id; })[0].text; }
    function render() {
      ol.innerHTML = '';
      state.seq.forEach(function (id, i) {
        var li = el('li', 'oli');
        li.draggable = true;
        li.setAttribute('data-id', id);
        li.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="otext">' + esc(text(id)) + '</span>';
        var mv = el('span', 'mv');
        var up = el('button', '', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
        var dn = el('button', '', '▼'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
        up.addEventListener('click', function () {
          if (S.checked[ex.id] || i === 0) { return; }
          var t = state.seq[i - 1]; state.seq[i - 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        dn.addEventListener('click', function () {
          if (S.checked[ex.id] || i === state.seq.length - 1) { return; }
          var t = state.seq[i + 1]; state.seq[i + 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        mv.appendChild(up); mv.appendChild(dn);
        li.appendChild(mv);
        li.addEventListener('dragstart', function (ev) {
          if (S.checked[ex.id]) { ev.preventDefault(); return; }
          li.classList.add('dragging');
          try { ev.dataTransfer.setData('text/plain', id); } catch (e) {}
        });
        li.addEventListener('dragend', function () { li.classList.remove('dragging'); });
        li.addEventListener('dragover', function (ev) { ev.preventDefault(); });
        li.addEventListener('drop', function (ev) {
          ev.preventDefault();
          if (S.checked[ex.id]) { return; }
          var from = state.seq.indexOf(id);
          var dragId = null;
          try { dragId = ev.dataTransfer.getData('text/plain'); } catch (e) {}
          if (!dragId) { return; }
          var fi = state.seq.indexOf(dragId);
          if (fi < 0 || fi === from) { return; }
          state.seq.splice(fi, 1);
          var to = state.seq.indexOf(id);
          state.seq.splice(to + (fi < to ? 1 : 0), 0, dragId);
          render(); updateCheckState();
        });
        nodes[id] = li;
        ol.appendChild(li);
      });
    }
    render();
    container.appendChild(el('p', 'small muted', 'Drag rows — or use the ▲▼ buttons — to put the items in the right order.'));
    return {
      type: 'order',
      isReady: function () { return true; },
      collect: function () { return state.seq.slice(); },
      lock: function () { $all('.oli .mv button', ol).forEach(function (b) { b.disabled = true; }); }
    };
  }

  /* ---- fill blanks ---- */
  function buildFill(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { sel: null, fills: {} };
    var textDiv = el('div', 'filltext');
    var parts = String(w.text).split(/(__b\d+__)/);

    shuffle(w.bank).forEach(function (bw) {
      var c = el('button', 'chip');
      c.type = 'button';
      c.innerHTML = '<span>' + esc(bw.text) + '</span>';
      c.addEventListener('click', function () {

        state.sel = (state.sel === bw.id) ? null : bw.id;

      });
      c.setAttribute('data-word', bw.id);
      bankNode.appendChild(c);

    return {
      type: 'fill',
      isReady: function () { return Object.keys(state.fills).length > 0; },
      collect: function () { return state.fills; },
