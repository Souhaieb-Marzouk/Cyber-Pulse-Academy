.res-card.partial { border-color: var(--state-partial); } .res-card.partial .n, .res-card.partial .l { color: var(--state-partial); }
.res-card.wrong { border-color: var(--state-incorrect); } .res-card.wrong .n, .res-card.wrong .l { color: var(--state-incorrect); }
.res-card.skipped { border-color: var(--state-skipped); } .res-card.skipped .n, .res-card.skipped .l { color: var(--state-skipped); }
.verdict { border-radius: 10px; padding: 20px 22px; margin-top: 16px; border: 1px solid; }
.verdict .vp { font-size: 34px; font-weight: 800; letter-spacing: 0.04em; }
.verdict.pass { border-color: var(--state-correct); background: var(--accent-green-wash); }
.verdict.pass .vp { color: var(--state-correct); }
.verdict.fail { border-color: var(--state-incorrect); background: var(--state-incorrect-wash); }
.verdict.fail .vp { color: var(--state-incorrect); }
.scoreline { font-size: 15px; margin-top: 6px; }

@media (max-width: 780px) {
  .match-grid { grid-template-columns: 1fr; }
  .zones.z3, .zones.z4 { grid-template-columns: 1fr; }
  .zones.z2 { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr; }
  #hdr-row { gap: 6px 10px; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #pfill::after { animation: none; display: none; }
  * { transition: none !important; }
}

<script>window.__EXAM__ = {"topicId":"m1056","batch":4,"title":"M1056 Pre-compromise — EXTREMELY HARD","severity":"EXTREMELY HARD","sevClass":"sev-extreme","partLabel":null,"timerSeconds":2880,"exercises":[{"id":"x01","type":"multi","summary":"CISO needs a decision: unlocked inherited domains plus staged lookalikes","scenario":{"note":"Monday 08:55. The CISO wants a decision in ten minutes. Artefacts below arrived overnight. One signal is explained by marketing; one is not explained by anything.","artifacts":[{"kind":"log","title":"ARTEFACT 1 — brand watch, overnight","filter":true,"lines":["2026-10-19 01:12 WARN  3 new lookalike domains registered overnight (corp-billing[.]example, corp-sso-login[.]example, corp-hrportal[.]example)","2026-10-19 01:13 INFO  one resolves to VPS range; TLS cert issued 01:00","2026-10-19 06:40 INFO  phishing-kit fingerprint on corp-sso-login[.]example (login page + mail exchanger)"]},{"kind":"table","title":"ARTEFACT 2 — registrar posture report","head":["Domain","Transfer lock","Account MFA","Owner"],"rows":[["corp[.]example","ON","ON","Group IT"],["corp-legacy[.]example (acquired 2025)","OFF","OFF","unknown (inherited)"],["corp-old[.]example (acquired 2025)","OFF","OFF","unknown (inherited)"]]},{"kind":"text","title":"ARTEFACT 3 — context","body":"• Marketing confirms a campaign launch last night (explains some traffic spikes; does NOT explain lookalike registrations).\n• CTI: sector actor set known for domain-staging phishing waves.\n• Vendor hash database unavailable since Friday (known gap)."}]},"question":"Select the THREE actions that are defensible to give the CISO right now.","widget":{"type":"multi","options":[{"id":"o1","text":"Lock the two inherited domains and secure their registrar accounts today — the OFF/OFF posture is our sharpest exposure"},{"id":"o2","text":"Start takedown for the two staged lookalikes with the evidence pack"},{"id":"o3","text":"Brief the helpdesk and brand team that a phishing wave referencing our brand is plausible this week"},{"id":"o4","text":"Take our primary domain offline for 24 hours to break any phishing plans"},{"id":"o5","text":"Publish the actor indicators publicly to warn everyone immediately"}],"correct":["o1","o2","o3"]},"hint":"One action fixes our own sharpest exposure; one uses external channels; one prepares our people. Two options create damage or tip off the actor.","exp":{"intro":"The unlocked, MFA-less inherited domains are an attacker's easiest path into our brand — locking them is cheap and urgent. Takedown for live-staged phishing is the standard external move and needs the evidence pack. Warning the helpdesk converts preparation into readiness. Taking the primary domain offline breaks our own business without stopping third-party registrations, and publishing raw indicators tips off the actor and creates legal exposure.","items":{"o1":"Right — the sharpest exposure is ours, not the attacker's; close it today.","o2":"Right — live-staged phishing justifies immediate takedown via registrar/host.","o3":"Right — a warned helpdesk is the cheapest mitigation against the coming wave.","o4":"Self-inflicted downtime; the lookalikes remain registered either way.","o5":"Premature disclosure burns sources and may breach vendor agreements."},"study":"Under pressure: rank actions by exposure fixed per unit of risk taken."}},{"id":"x02","type":"single","summary":"Registered but dormant lookalike — act now or watch?","scenario":{"note":"A lookalike domain was registered 36 hours ago. It is parked: no DNS resolution to content, no certificate, no mail exchanger. Registrant uses full WHOIS privacy. Your takedown channel is warmed up and legal is on standby.","artifacts":[{"kind":"log","title":"Watch record","filter":false,"lines":["age: 36h | status: parked | a-record: none | mx: none | cert: none","registrant: privacy service | registrar: bulk provider with slow takedown SLA","brand-match score: 93% | similar cases: 2 this year, both armed within 3 weeks"]}]},"question":"What is the best course of action?","widget":{"type":"single","options":[{"id":"o1","text":"Monitor actively with automated arming alerts and prepare the takedown evidence pack now — file the takedown only when arming is observed"},{"id":"o2","text":"Ignore it — a parked domain has never hurt anyone"},{"id":"o3","text":"Fire the takedown now and pay the rush fee regardless of evidence"},{"id":"o4","text":"Contact the privacy service and demand the registrant's identity"}],"correct":"o1"},"hint":"Two earlier cases armed within three weeks. What do you gain by waiting — and what must be ready when it arms?","exp":{"intro":"A parked lookalike is preparation, not yet abuse. Registrars reject takedowns for dormant domains, and a rush fee buys nothing without evidence. The professional play is to automate arming detection (DNS changes, certificate issuance, mail exchanger setup) and pre-build the evidence pack so that the moment it arms, the takedown is minutes old. Ignoring a 93% brand match with this history is negligence.","items":{"o1":"Right — monitoring plus prepared evidence converts dormancy from blind spot to tripwire.","o2":"The watch record says otherwise: both precedents armed quickly.","o3":"Weak takedowns burn goodwill with registrars and may fail.","o4":"Privacy services will not de-anonymise without legal process."},"study":"Dormant-lookalike playbooks: arming alerts + evidence pack = fast, strong takedown."}},{"id":"x03","type":"branch","summary":"DMARC enforcement rollout on a messy estate — four decisions","scenario":{"note":"You own the DMARC programme for 14 domains, 6 marketing platforms and 3 legacy senders. Leadership wants p=reject 'by next quarter'. Walk the four real decisions.","artifacts":[{"kind":"table","title":"Sender inventory (partial)","head":["Sender","SPF aligned","DKIM aligned","Volume/day"],"rows":[["main mail cluster","yes","yes","2.1M"],["marketing platform A","yes","no","180k"],["marketing platform B","no","no","95k"],["legacy invoice gateway","no","no","1.2k"],["helpdesk tool","yes","yes","40k"]]}]},"question":"Pick the best answer at each decision point.","widget":{"type":"branch","steps":[{"q":"Step 1 — The first programme move?","options":[{"id":"a","text":"Complete the sender inventory with SPF/DKIM alignment data before touching policy","leads":"Inventory done: two marketing platforms and the invoice gateway are unaligned."},{"id":"b","text":"Set p=reject on all domains tonight — best practice is best","leads":"Overnight, 280k legitimate emails bounce. The programme loses its sponsor."},{"id":"c","text":"Skip inventory; DMARC reports will reveal senders anyway","leads":"Reports reveal aligned failures only after policy hurts someone — too late."}]},{"q":"Step 2 — Policy progression?","options":[{"id":"a","text":"p=none with report review, then quarantine by percentage, then reject — per domain, driven by report data","leads":"Two domains reach reject in week 6; the messy ones lag with dates attached."},{"id":"b","text":"Jump straight to reject; notify senders afterwards","leads":"Same bounce storm, now with a broken trust trail."},{"id":"c","text":"Stay at p=none forever to avoid all risk","leads":"Brand spoofing continues; the programme exists to stop it."}]},{"q":"Step 3 — The legacy invoice gateway cannot be aligned this quarter. Best handling?","options":[{"id":"a","text":"Route it through the aligned main cluster or give it its own subdomain with its own SPF/DKIM, then enforce there","leads":"Alignment achieved by architecture, not by policy weakening."},{"id":"b","text":"Add it to SPF broadly and accept permanent p=none on that domain","leads":"That leaves a spoofing door open that outlives the gateway."},{"id":"c","text":"Turn off DKIM checking for that sender via DMARC exceptions","leads":"DMARC has no per-sender exception switch — this is fantasy configuration."}]},{"q":"Step 4 — How do you measure success after enforcement?","options":[{"id":"a","text":"DMARC aggregate reports: spoof attempts blocked, legitimate pass rate, and bounce complaints trending down","leads":"The board sees protection and business continuity in one chart."},{"id":"b","text":"Number of policy changes made","leads":"Activity is not outcome."},{"id":"c","text":"Disable reporting to reduce log storage costs","leads":"Blinding yourself post-enforcement is how regressions hide."}]}],"correct":["a","a","a","a"]},"hint":"Inventory, staged policy, architectural fixes, outcome metrics. Two of the four 'best practices' offered are traps.","exp":{"intro":"DMARC programmes fail by skipping inventory, jumping to reject, weakening policy for stragglers, and measuring activity instead of outcomes. The senior path: full sender inventory first; staged enforcement per domain driven by report data; fix unaligned senders architecturally (subdomain + own SPF/DKIM or relay through aligned infrastructure); keep reporting on and show blocked spoofing plus legitimate pass rates.","items":{"s0":"No policy survives an incomplete sender inventory.","s1":"none → quarantine(%) → reject is staged enforcement, not bureaucracy.","s2":"Architecture fixes alignment; policy exceptions are not a real mechanism.","s3":"Reports are the programme's telemetry — never turn them off."},"study":"Write the four-stage DMARC plan for your own domain estate."}},{"id":"x04","type":"dnd","summary":"Classify six controls by control category","scenario":{"note":"GRC asks you to classify the pre-compromise control set by category: Preventive (stops it happening), Detective (tells you it is happening/happened), Corrective (fixes it after).","artifacts":[{"kind":"text","title":"Control set","body":"1. DNSSEC signing of all zones\n2. SPF/DKIM/DMARC at p=reject\n3. Registrar transfer locks + account MFA\n4. Lookalike-domain and certificate-transparency watch\n5. Paste-site and credential-leak monitoring\n6. Takedown service for abused brand domains"}]},"question":"Place each control into its category.","widget":{"type":"dnd","zones":[{"id":"z1","label":"Preventive"},{"id":"z2","label":"Detective"},{"id":"z3","label":"Corrective"}],"items":[{"id":"i1","text":"DNSSEC signing","zone":"z1"},{"id":"i2","text":"SPF/DKIM/DMARC p=reject","zone":"z1"},{"id":"i3","text":"Registrar locks + MFA","zone":"z1"},{"id":"i4","text":"Lookalike/CT watch","zone":"z2"},{"id":"i5","text":"Leak monitoring","zone":"z2"},{"id":"i6","text":"Takedown service","zone":"z3"}]},"hint":"Six controls, 3/2/1 split. Takedowns repair; watches reveal.","exp":{"intro":"DNSSEC, enforced email authentication and registrar locks stop attacks materialising — preventive. Domain watches and leak monitoring create visibility of preparation — detective. Takedowns remove abuse that already exists — corrective. A mature programme needs all three categories balanced.","items":{"i1":"Signed zones prevent cache-poisoning style attacks.","i2":"p=reject prevents spoofed mail from arriving.","i3":"Locks and MFA prevent account/domain takeover.","i4":"Watches detect staging before victims exist.","i5":"Leak monitoring detects exposure that already happened.","i6":"Takedowns correct an ongoing abuse."},"study":"Tag every control P/D/C — gaps show up instantly."}},{"id":"x05","type":"multi","summary":"Applying the “cannot easily be prevented” nuance at programme level","scenario":{"note":"A board member reads the M1056 page, sees the repeated 'cannot be easily mitigated with preventive controls' note, and asks what your programme actually does about it. Which responses are sound?","artifacts":[{"kind":"attack","title":"Board context","lines":["M1056 use-note: behaviors performed outside of the scope of enterprise defenses and controls.","Board question: “So what do we buy, and what do we accept?”"]}]},"question":"Select the THREE sound responses.","widget":{"type":"multi","options":[{"id":"o1","text":"Accept that in-network blocking cannot stop recon; invest in reducing what recon can find"},{"id":"o2","text":"Invest in monitoring that turns adversary preparation into early alerts and takedown cases"},{"id":"o3","text":"Work the external channel: registrars, hosts and platforms, where the attacker actually operates"},{"id":"o4","text":"Firewall-block all scanning source IPs to stop recon at the perimeter"},{"id":"o5","text":"Deprioritise the whole programme since prevention is impossible"}],"correct":["o1","o2","o3"]},"hint":"The attacker operates on their infrastructure and ours is irrelevant to their recon — which two options quietly assume the opposite?","exp":{"intro":"The nuance drives three investments: shrink the target (less published, fewer exposed services), detect preparation (watches, CT logs, leak monitoring), and act through external parties (takedowns, abuse reports). Blocking scanner IPs is whack-a-mole — recon rotates cheap VPS IPs and passive collection never touches your firewall at all. Deprioritising because prevention is imperfect confuses 'cannot block' with 'cannot defend'.","items":{"o1":"Right — exposure reduction is the prevention you actually own.","o2":"Right — early warning converts preparation into actionable cases.","o3":"Right — takedowns operate where the behaviour physically lives.","o4":"Rotation makes IP blocks cosmetic; passive recon bypasses them entirely.","o5":"The board member asked what you do — 'nothing' is not a programme."},"study":"Explain the prevention-detection-corrective triad in one paragraph to a board member."}},{"id":"x06","type":"order","summary":"Sequence the external attack surface programme build-out","scenario":{"note":"You are handed a budget and a blank page: build the ASM/pre-compromise programme in the right order for a 5,000-employee company.","artifacts":[{"kind":"text","title":"Constraints","body":"• Legacy M&A domains exist with unknown owners\n• Marketing runs 6 sending platforms\n• No continuous external scanning today"}]},"question":"Put the five programme phases in the correct order.","widget":{"type":"order","items":[{"id":"i1","text":"Inventory all internet-facing assets, domains and senders (including M&A legacy)"},{"id":"i2","text":"Classify and risk-rank exposures; agree risk acceptance where needed"},{"id":"i3","text":"Fix critical exposures (credentials, known-CVE appliances, open buckets)"},{"id":"i4","text":"Stand up continuous monitoring: ASM scans, lookalike/CT watches, leak monitoring"},{"id":"i5","text":"Operate: takedown pipeline, metrics, quarterly reviews with owners"}]},"hint":"You cannot rank what you have not listed, and monitoring built before fixing buries the team in alerts.","exp":{"intro":"Programme order is: know what exists (inventory), decide what matters (classification), remove the dangerous (fixes), then automate vigilance (monitoring), then institutionalise (takedown pipeline and reviews). Monitoring before fixing generates alert floods; reviews before inventory have nothing to review.","items":{"i1":"Inventory is the foundation of everything else.","i2":"Ranking turns a list into a plan.","i3":"Critical fixes come before automation so alerts start from a sane baseline.","i4":"Continuous monitoring only pays off once the loud fires are out.","i5":"Operations institutionalise the programme; without them it decays."},"study":"ASM build-out order: inventory → rank → fix → monitor → operate."}},{"id":"x07","type":"fill","summary":"Complete the regulator-facing summary of domain and mail defences","scenario":{"note":"After a near-miss brand-abuse incident, the regulator asks for a one-paragraph description of current defences. Four terms are missing.","artifacts":[{"kind":"text","title":"Regulator draft (gaps)","body":"We enforce SPF/DKIM/____(1) at p=reject on all sending domains, sign our zones with ____(2), maintain registrar transfer locks and ____(3) privacy on every domain, and run ____(4) attack-surface scans weekly with a takedown pipeline on standby."}]},"question":"Fill the four gaps.","widget":{"type":"fill","text":"We enforce SPF/DKIM/__b1__ at p=reject on all sending domains, sign our zones with __b2__, maintain registrar transfer locks and __b3__ privacy on every domain, and run __b4__ attack-surface scans weekly with a takedown pipeline on standby.","blanks":[{"id":"b1","correct":"w1"},{"id":"b2","correct":"w2"},{"id":"b3","correct":"w3"},{"id":"b4","correct":"w4"}],"bank":[{"id":"w1","text":"DMARC"},{"id":"w2","text":"DNSSEC"},{"id":"w3","text":"WHOIS"},{"id":"w4","text":"external"},{"id":"w5","text":"internal"},{"id":"w6","text":"DSL"}]},"hint":"The four answers are the exact vocabulary of this whole exam — the last one distinguishes where the scans point.","exp":{"intro":"The paragraph names the four core domain-defence controls: DMARC (policy layer with SPF/DKIM), DNSSEC (zone signing), WHOIS privacy (registrant hygiene) and external scanning (from the internet's point of view). Internal scans do not see what an attacker sees, and DSL is a line technology, not a defence.","items":{"b1":"DMARC completes the SPF/DKIM trio as the policy layer.","b2":"DNSSEC signs DNS answers.","b3":"WHOIS privacy hides registrant data.","b4":"External scans emulate the attacker's view of your surface."},"study":"Regulator-ready language: name controls precisely, in attacker order."}},{"id":"x08","type":"single","summary":"The 'publish nothing' strategy in a real company","scenario":{"note":"After a bad quarter of OSINT findings, an executive proposes: “From today, security owns the rule: the company publishes nothing, anywhere. Employees may not post about work.” Legal, marketing and HR push back hard.","artifacts":[{"kind":"text","title":"Executive proposal","body":"“Zero public information, enforced by policy. Any employee posting anything about work gets disciplined.”\nFeedback: Legal — 'we must publish regulatory filings'; Marketing — 'our leads die'; HR — 'recruiting dies'."}]},"question":"What is the senior-appropriate response?","widget":{"type":"single","options":[{"id":"o1","text":"Replace the blanket ban with a risk-based publishing policy: mandatory-scrub lists, review gates for sensitive content, and monitoring for what slips out"},{"id":"o2","text":"Enforce the ban as written — security outranks marketing"},{"id":"o3","text":"Drop the idea entirely and keep publishing exactly as before"},{"id":"o4","text":"Publish more, to flood and confuse attacker OSINT"}],"correct":"o1"},"hint":"Two options ignore the business; one ignores the risk. Which one survives a board meeting?","exp":{"intro":"Zero-publication is unenforceable in a real company — filings, marketing and recruiting are legally or commercially mandatory. Doing nothing ignores the measured risk. Poisoning OSINT with floods is a myth that adds real exposure. The durable answer is a publishing policy: a scrub list (hostnames, versions, named contacts, badge photos), review gates for sensitive items, and monitoring as the safety net.","items":{"o1":"Right — risk-based policy with gates and monitoring is enforceable and effective.","o2":"An unenforceable ban destroys security's credibility within weeks.","o3":"Same exposure, plus the exec now feels ignored.","o4":"Disinformation floods add attack surface and are trivially filtered."},"study":"Security policy that loses to business reality is not security policy."}},{"id":"x09","type":"branch","summary":"Two lookalike domains, contradictory signals — decide per domain","scenario":{"note":"Two lookalikes registered in the same week. The signals pull in opposite directions. Your decisions set the precedent for the year.","artifacts":[{"kind":"table","title":"ARTEFACT 1 — domain A","head":["Signal","Reading"],"rows":[["corp-secure-login[.]example","brand match 94%"],["Registrar","bulletproof host, full privacy"],["Status","parked, no cert, no MX, 9 days old"],["Precedent","bulletproof registrars arm more often"]]},{"kind":"table","title":"ARTEFACT 2 — domain B","head":["Signal","Reading"],"rows":[["corp-autumn-sale[.]example","brand match 88%"],["Registrar","mainstream; registrant = our marketing agency"],["Status","live campaign landing page, no credentials requested"],["Ticket","MKT-0611 exists, approved, references this domain"]]}]},"question":"Decide correctly for each domain, then for the programme.","widget":{"type":"branch","steps":[{"q":"Step 1 — Domain A (bulletproof registrar, parked, 9 days):","options":[{"id":"a","text":"Arm arming-alerts, pre-build the takedown pack, set a 7-day review — do not tip the registrant","leads":"Domain A on a tripwire; legal pre-briefed; nothing leaked."},{"id":"b","text":"Mass-takedown request now, dormant or not","leads":"Registrar rejects dormants; you burned a submission and revealed you are watching."},{"id":"c","text":"Close as inactive — parked means harmless","leads":"The precedent table contradicts you; parked is the quiet phase."}]},{"q":"Step 2 — Domain B (agency campaign, ticketed):","options":[{"id":"a","text":"Verify MKT-0611, add the domain to the brand allowlist, and require agency registrations to file tickets going forward","leads":"Domain B reclassified as sanctioned; the process gap gets fixed."},{"id":"b","text":"Takedown request — any lookalike is an attack","leads":"You takedown'd your own approved campaign; marketing escalates to the CIO."},{"id":"c","text":"Close with no record — marketing handles its own domains","leads":"No record means the next agency domain restarts this panic."}]},{"q":"Step 3 — Programme fix so this split-decision never recurs?","options":[{"id":"a","text":"Maintain a registered-domain inventory with allowlist + ticket linkage, and route every watch hit through it first","leads":"The watch now consults a source of truth before anyone panics."},{"id":"b","text":"Ban agencies from registering any brand-adjacent domain","leads":"Unenforceable and unneeded — registration is the fix, not prohibition."},{"id":"c","text":"Widen brand-match threshold to 80% to catch more","leads":"That multiplies false positives; precision was never the problem."}]}],"correct":["a","a","a"]},"hint":"Same-looking alerts, opposite truths: let evidence (registrar, ticket, behaviour) — not pattern-match — decide. Then fix the decision process itself.","exp":{"intro":"Domain A's signals (bulletproof registrar, privacy, dormant-but-precedented) call for tripwiring, not premature takedowns that burn the channel. Domain B's signals (ticket, agency, no credential capture) call for verification and allowlisting, not attacking our own campaign. The programme fix is the source of truth: an allowlisted domain inventory wired into the watch, so dispositions become lookups instead of debates.","items":{"s0":"Dormant + hostile registrar = prepare quietly; exposure of intent costs you the case.","s1":"A sanctioned campaign needs a record, or it returns as tomorrow's false alarm.","s2":"Inventories with ticket linkage turn judgement calls into repeatable decisions."},"study":"Evidence-first disposition: registrar, behaviour, ticket — in that order."}},{"id":"x10","type":"multi","summary":"What belongs in the pre-compromise runbook (and what does not)","scenario":{"note":"You are handed 30 minutes of a senior workshop to finalise the pre-compromise IR runbook. Which four inclusions survive review?","artifacts":[{"kind":"text","title":"Candidate runbook items","body":"A. Golden baseline: registered-domain inventory, sender inventory, external asset list\nB. Arming triggers: new certs on brand-adjacent domains, MX setup, login-page fingerprints\nC. Takedown pipeline with registrar/host contacts, evidence templates, legal sign-off path\nD. Credential-leak response: monitoring sources, reset workflow, access-broker watch\nE. Instruction to disable DMARC reporting during incidents to reduce noise\nF. Wait for antivirus detections before acting on staging alerts"}]},"question":"Select the FOUR items that belong in the runbook.","widget":{"type":"multi","options":[{"id":"o1","text":"golden baselines and inventories"},{"id":"o2","text":"arming triggers for staged infrastructure"},{"id":"o3","text":"takedown pipeline with contacts and legal path"},{"id":"o4","text":"credential-leak and access-sale response"},{"id":"o5","text":"disable DMARC reporting during incidents"},{"id":"o6","text":"wait for AV before acting on staging alerts"}],"correct":["o1","o2","o3","o4"]},"hint":"Two candidates switch off signals you will desperately need; the other four are the machine itself.","exp":{"intro":"A runbook needs baselines to compare against, arming triggers that convert preparation into cases, a rehearsed takedown pipeline (with legal), and a leak/access-sale response — T1650 means access is sold before it is used. Disabling DMARC reporting blinds you during the exact window you need it, and waiting for AV on staging alerts inverts the whole pre-compromise logic: there is no malware on your endpoints yet.","items":{"o1":"Right — you cannot detect change without a baseline.","o2":"Right — arming is the moment dormancy becomes actionable.","o3":"Right — takedowns are process, not improvisation.","o4":"Right — leaked credentials and sold access are pre-attack currencies.","o5":"Reporting is your only mail-attack telemetry; never silence it.","o6":"Pre-compromise alerts fire before any AV product has something to scan."},"study":"Baseline, triggers, external pipeline, leak response — the four pillars."}},{"id":"x11","type":"single","summary":"Cost acceptance: 14 lookalikes in the last week of the quarter","scenario":{"note":"Friday, quarter close. The CT watch lists 14 new brand-adjacent domains. Mass takedown for all 14 costs significant legal fees and would consume the brand team's entire month. Two are actively phishing; the rest are parked. The CFO asks for your call.","artifacts":[{"kind":"log","title":"Watch summary","filter":false,"lines":["14 brand-adjacent registrations, 7 days","2: live phishing (login pages + MX armed)","12: parked, mixed registrars, no evidence of arming","budget: mass takedown = full month of brand-team capacity"]}]},"question":"What do you tell the CFO?","widget":{"type":"single","options":[{"id":"o1","text":"Takedown the two live phishing domains now; tripwire the parked twelve with arming alerts and a staged takedown plan — document the deferred risk"},{"id":"o2","text":"Takedown all 14 immediately — brand risk trumps budget"},{"id":"o3","text":"Defer everything to next quarter — parked domains are not urgent"},{"id":"o4","text":"Ask the CFO to decide; this is a finance matter"}],"correct":"o1"},"hint":"The two active ones convert directly to victims. The parked twelve cost you only if they arm — what tool makes deferral safe?","exp":{"intro":"Triage by conversion risk: live phishing is burning right now and justifies immediate spend. Dormant domains are only dangerous when they arm — arming alerts make that moment loud, so staged takedowns with documented deferral accept the risk consciously instead of paying to neutralise paper threats. Refusing to decide, or deciding 'all or nothing', wastes either money or response time.","items":{"o1":"Right — risk-tiered response: act on live threats, tripwire dormant ones, document the residual risk.","o2":"Emotionally satisfying, fiscally indefensible, and unnecessary for dormants.","o3":"Deferring the live pair is negligence; only the dormant set can wait.","o4":"Risk decisions belong to the security owner; finance funds the decision."},"study":"Deferred-risk documentation: what we accept, why, and what triggers revisiting it."}},{"id":"x12","type":"dnd","summary":"Senior triage: six watch hits with noise and tickets mixed in","scenario":{"note":"You inherit a messy watch queue. Two items have tickets, one has a red-team contract behind it, two are hostile staging, one is a leak. Dispose of all six.","artifacts":[{"kind":"text","title":"ARTEFACT — context notes","body":"• Red-team contract PT-88 includes 'register brand-adjacent domains' for this month.\n• Change calendar shows a sanctioned partner SSO migration (allowlisted partner domain).\n• No tickets exist for the remaining items."}]},"question":"Place each item into the correct disposition.","widget":{"type":"dnd","zones":[{"id":"z1","label":"IR now — staged/abuse live"},{"id":"z2","label":"Monitor / investigate"},{"id":"z3","label":"Benign — documented"}],"items":[{"id":"i1","text":"Lookalike with live login page + MX armed","zone":"z1"},{"id":"i2","text":"Compromised third-party site hosting our fake portal","zone":"z1"},{"id":"i3","text":"Parked lookalike, unknown registrant, no arming","zone":"z2"},{"id":"i4","text":"Repeated threat-vendor queries searching our brand data","zone":"z2"},{"id":"i5","text":"Brand-adjacent domain registered under red-team contract PT-88","zone":"z3"},{"id":"i6","text":"Partner SSO domain from the change calendar","zone":"z3"}]},"hint":"Live abuse is IR; hostile-but-dormant is monitor; anything with paper behind it is documented.","exp":{"intro":"Armed staging (own domain or on compromised third-party hosting) is live abuse — IR now. Dormant unknowns and someone shopping for our data in vendor portals are monitoring cases — hostile intent, no abuse yet. Contract-backed red-team registrations and calendar-sanctioned partner domains are documented and benign. Tickets and contracts are what separate disposition from drama.","items":{"i1":"Armed = victims possible now — IR.","i2":"Hosting on compromised third parties is still live staging.","i3":"Dormant + unknown = watch with arming triggers.","i4":"Vendor-portal queries signal recon shopping — monitor and brief.","i5":"PT-88 is the paper trail — documented, coordinate for scope.","i6":"Change calendar is the paper trail — benign."},"study":"Disposition = evidence of abuse + evidence of authorisation."}},{"id":"x13","type":"match","summary":"Route four pre-compromise artefacts to the right owner with the right first move","scenario":{"note":"The CISO wants clean ownership. For each artefact: which owner takes it, and what is their first move?","artifacts":[{"kind":"text","title":"Artefacts","body":"1. Live phishing kit on a lookalike domain\n2. CFO's mailbox credential for sale on an access-broker market\n3. Registrar account of a legacy domain without MFA, admin departed\n4. DMARC reports showing steady spoofing of your main domain from a bulletproof VPS"}]},"question":"Match each artefact to owner and first move.","widget":{"type":"match","left":[{"id":"l1","text":"Live phishing kit on lookalike"},{"id":"l2","text":"CFO credential for sale"},{"id":"l3","text":"MFA-less registrar account"},{"id":"l4","text":"Steady domain spoofing in DMARC reports"}],"right":[{"id":"r1","text":"Brand/IR — evidence pack, then registrar and host takedown"},{"id":"r2","text":"Identity team — invalidate sessions, rotate the credential, hunt its use"},{"id":"r3","text":"IT security — enforce MFA and transfer lock, rotate all credentials"},{"id":"r4","text":"Messaging admin — review policy, align senders, blocklist the VPS range"}],"pairs":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"}},"hint":"Each artefact has exactly one owner whose first move is neither 'wait' nor 'tell everyone'.","exp":{"intro":"Live kit goes to brand/IR for a takedown through the evidence pipeline. A sold executive credential goes to identity: assume use, rotate, hunt. A registrar account without MFA is an account-takeover door — IT security locks it. Ongoing spoofing visible in DMARC reports is a messaging-admin problem: policy review, sender alignment, blocklist. The constant: each owner's first move is decisive, not decorative.","items":{"l1":"Takedown needs evidence first — the pack makes the request stick.","l2":"Sold credentials must be treated as compromised, not as 'listed'.","l3":"Account-takeover doors get closed with MFA, locks and rotation.","l4":"DMARC telemetry is the messaging admin's to act on."},"study":"Ownership beats escalation speed — write the routing table before the incident."}},{"id":"x14","type":"multi","summary":"Compensating posture for M&A-inherited domains you cannot immediately fix","scenario":{"note":"Two acquired domains sit in unknown registrant accounts; transfer of ownership takes 60-90 days of legal work. Which compensating controls are appropriate for the interim?","artifacts":[{"kind":"table","title":"Inherited estate","head":["Domain","Status"],"rows":[["corp-legacy[.]example","active MX, unknown account owner, no lock"],["corp-old[.]example","parked, unknown account owner, no lock"]]}]},"question":"Select the THREE appropriate interim controls.","widget":{"type":"multi","options":[{"id":"o1","text":"DNS change and MX-record alerting from the monitoring side, so hostile changes page us"},{"id":"o2","text":"Brand-watch priority for these two names, with pre-built takedown evidence templates"},{"id":"o3","text":"Legal fast-track: escrow or written registrar cooperation agreement while ownership transfers"},{"id":"o4","text":"Let both domains expire quietly and hope nobody notices them"},{"id":"o5","text":"Advertise the domains as open for sale to flush out interest"}],"correct":["o1","o2","o3"]},"hint":"You cannot control the account yet — so what CAN you watch, prepare and contract?","exp":{"intro":"Until ownership transfers, your leverage is external: detect changes (DNS/MX alerting), watch the brand surface (priority monitoring, prepared evidence), and use legal instruments (registrar cooperation, escrow). Hoping for quiet expiry is not a control — an attacker can renew or seize an expiring name faster than you can react, and advertising a sale invites exactly the wrong audience.","items":{"o1":"Right — change alerting is your detection substitute for lost account control.","o2":"Right — prepared evidence shortens takedown from days to hours.","o3":"Right — legal instruments work even when credentials do not.","o4":"Expiring names with mail history are acquisition targets for attackers.","o5":"Advertising invites hostile buyers and looks like negligence in hindsight."},"study":"Lost-control posture: monitor, prepare, contract — until ownership returns."}},{"id":"x15","type":"order","summary":"Sequence the response to a live brand-impersonation wave","scenario":{"note":"Users report phishing mails referencing a staged lookalike you takedown'd yesterday; new variants keep appearing. Sequence the five response streams correctly.","artifacts":[{"kind":"log","title":"Live wave board","filter":true,"lines":["09:02 3 new variants observed, same kit fingerprint","09:04 11 user reports, 2 entered credentials (caught by page warning)","09:06 protective-DNS vendor online, mail gateway admin online"]}]},"question":"Put the five streams in the correct order.","widget":{"type":"order","items":[{"id":"i1","text":"Confirm scope: collect mails, URLs, kit fingerprints, victim list"},{"id":"i2","text":"Fire takedowns for all live variants via registrar/host"},{"id":"i3","text":"Block at the edges: protective DNS, mail gateway rules on kit indicators"},{"id":"i4","text":"Warn and arm the users: helpdesk script with current indicators"},{"id":"i5","text":"Review: post-incident report feeding M1056 measures and watch tuning"}]},"hint":"Understand it, kill the infrastructure, blunt the delivery, arm the humans, then learn.","exp":{"intro":"Scope first — you cannot takedown or block what you have not enumerated. Takedowns next, removing the attackers' runway. Edge blocks (protective DNS, mail rules on kit fingerprints) blunt delivery within minutes. The user warning uses confirmed indicators, not guesses. The review feeds the programme: watch tuning, publishing policy, sender alignment. Reversing the last two arms users with stale data or skips learning entirely.","items":{"i1":"Enumeration is the root of every downstream action.","i2":"Takedown before blocking: kill the source, not just the path.","i3":"Edge blocks protect everyone not yet victimised.","i4":"User warnings carry confirmed indicators only.","i5":"The review is what turns an incident into programme improvement."},"study":"Wave response order: scope → takedown → block → warn → review."}}],"intro":{"title":"M1056 — EXTREMELY HARD practice exam","subtitle":"MITRE ATT&CK Mitigation M1056 — Pre-compromise — dark-mode certification practice exam","facts":[["ATT&CK object","M1056 — Pre-compromise (Mitigation)"],["Severity","<span class=\"sev-badge sev-extreme\">🛡 EXTREMELY HARD<\/span>"],["Exercises in this file","15"],["Estimated time","about 48 minutes"],["Timer budget","48:00 countdown"],["Pass mark","70%"]],"learn":"<p>This is the senior tier of M1056 — Pre-compromise. The scenarios chain several concepts, include deliberate noise, and sometimes contradict themselves. Your job is to make the call a programme owner would make, with incomplete information and real costs on both sides.<\/p><p>You will decide when to act and when to watch: a dormant lookalike on a bulletproof registrar is preparation, not yet abuse — mass takedowns of dormant domains burn credibility and evidence. You will run programmes, not just cases: a DMARC rollout across messy sending platforms, an attack-surface programme built in the right order, a runbook with baselines, arming triggers and a takedown pipeline. You will handle the uncomfortable edges: domains inherited from an acquisition that you do not control yet, red-team registrations that look exactly like attacker ones, a credential for sale on an access-broker market (T1650), and fourteen lookalikes in the last week of the quarter with a budget that does not cover them all.<\/p><p>The recurring theme of the M1056 page still applies: most of this behaviour happens outside your network, so your instruments are exposure reduction, monitoring that turns preparation into alerts, and external channels — registrars, hosts and platforms — plus the discipline to document deferred risk. Read every artefact. Some are noise. One is never explained by any ticket. Find it, and make the call.<\/p>","keywords":[{"theme":"Senior triage","items":["Conflicting signals","Dormant vs armed lookalikes","Arming triggers","Evidence packs","Bulletproof registrars","Threat-vendor query watch","M&A-inherited domains"]},{"theme":"Programme operations","items":["DMARC staged rollout (none→quarantine→reject)","ASM programme phases","Pre-compromise runbook","Takedown pipeline","Leak and access-broker response (T1650)","Sender architecture fixes"]},{"theme":"Business decisions","items":["Cost acceptance and deferred risk","Ownership routing","Red-team contracts as noise","Regulator-ready language","Board-level justification","Post-incident review feeding controls"]}],"how":["This file contains: single-answer questions, multi-select with partial credit, matching, drag-and-drop triage, fill-in-the-blank, programme ordering, and two multi-step decision walkthroughs.","The passing score is <strong>70%<\/strong>. Your final percent is computed over the exercises you actually answered. At 70% or more you <strong>PASS<\/strong>; below it you <strong>FAIL<\/strong> and can retake the exam.","The <strong>timer<\/strong> counts down in the top bar. <strong>Pause<\/strong> gives you a manual break: the timer stops and the exercise is hidden until you press Resume. The moment you press <strong>Check<\/strong>, the timer also stops automatically so you can study the feedback for as long as you like — it starts again only when you press <strong>Next<\/strong> (or Final Submit on the last exercise). Skip and Hint never stop the timer.","Some exercises have several correct items. They are scored with <strong>partial credit<\/strong>: each correct item adds credit and each wrong pick subtracts it — credit = max(0, (H − W) / N). Selecting everything gives zero, not safety.","The <strong>Hint<\/strong> button gives one nudge per exercise and costs 10% of that exercise's credit.","<strong>Skip<\/strong> moves an exercise to the Skipped pool without revealing the answer, and the timer keeps running. Before you finish, a review screen lets you answer skipped exercises as many times as you need while time remains. Skipped exercises that are never answered are excluded from the score.","At the end you get a full results screen with a per-item breakdown of every answer. Retaking shuffles the questions and the answer choices again."]}};</script>
<script>
/* ===== CyberPulseAcademy exam engine — M1056 Pre-compromise ===== */
(function () {
  'use strict';
  var CFG = window.__EXAM__;
  var PASS = 70;
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function fmtT(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  var LETTERS = 'ABCDEFGHIJ';

  var S = {
    screen: 'intro', order: [], pos: 0,
    credit: {}, status: {}, checked: {}, hintUsed: {},
    skipReturn: false, attempts: 0, reported: false,
    manualPauseTotal: 0, autoPauseTotal: 0,
    mpT0: null, apT0: null, prevState: 'RUNNING',
    username: '', current: null, widget: null
  };

  /* ================= timer state machine ================= */
  /* states: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED */
  var T = {
    state: 'IDLE', remain: CFG.timerSeconds, iv: null,
    start: function () {
      this.state = 'RUNNING';
      clearInterval(this.iv);
      this.iv = setInterval(function () { T.tick(); }, 1000);
      this.render();
    },
    tick: function () {
      if (this.state !== 'RUNNING') { return; }
      this.remain = this.remain - 1;
      if (this.remain <= 0) { this.remain = 0; this.render(); this.end(); return; }
      this.render();
    },
    pauseManual: function () {
      if (this.state === 'ENDED') { return; }
      /* stacking on top of the auto-pause: close the auto-pause segment first,
         so the same wall-clock time is never counted into both pause totals */
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = 'PAUSED_MANUAL';
      S.mpT0 = Date.now();
      this.render();
    },
    pauseAuto: function () {
      if (this.state === 'ENDED') { return; }
      this.state = 'PAUSED_AUTO_CHECK';
      S.apT0 = Date.now();
      this.render();
    },
    resumeTo: function (st) {
      if (this.state === 'ENDED') { return; }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;
        S.mpT0 = null;
      }
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      this.state = (st === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
      /* returning to the auto-pause opens a fresh auto-pause segment */
      if (this.state === 'PAUSED_AUTO_CHECK') { S.apT0 = Date.now(); }
      this.render();
    },
    end: function () {
      if (this.state === 'PAUSED_AUTO_CHECK' && S.apT0 != null) {
        S.autoPauseTotal = S.autoPauseTotal + (Date.now() - S.apT0) / 1000;
        S.apT0 = null;
      }
      if (this.state === 'PAUSED_MANUAL' && S.mpT0 != null) {
        S.manualPauseTotal = S.manualPauseTotal + (Date.now() - S.mpT0) / 1000;
        S.mpT0 = null;
      }
      this.state = 'ENDED';
      clearInterval(this.iv);
      this.render();
    },
    render: function () {
      var t = $('#timer');
      if (t) { t.textContent = fmtT(this.remain); }
      var c = $('#timerstate');
      if (!c) { return; }
      if (this.state === 'RUNNING') {
        c.className = 'state-chip running'; c.textContent = '▶ RUNNING';
      } else if (this.state === 'PAUSED_MANUAL') {
        c.className = 'state-chip paused'; c.textContent = '⏸ PAUSED — manual (press Resume)';
      } else if (this.state === 'PAUSED_AUTO_CHECK') {
        c.className = 'state-chip paused'; c.textContent = '⏸ PAUSED — reviewing feedback (resumes on Next)';
      } else if (this.state === 'ENDED') {
        c.className = 'state-chip ended'; c.textContent = '■ ENDED';
      } else {
        c.className = 'state-chip'; c.textContent = '● IDLE';
      }
    }
  };

  /* ================= header ================= */
  function buildHeader() {
    var h = $('#hdr');
    h.innerHTML = '';
    var row = el('div', '', ''); row.id = 'hdr-row';
    var brand = el('span', 'brand', 'M1056 · Pre-compromise <small>— MITRE ATT&CK Mitigation</small>');
    var sev = el('span', 'sev-badge ' + CFG.sevClass, '🛡 ' + CFG.severity);
    var counter = el('span', 'hdr-item', ''); counter.id = 'counter';
    var timer = el('span', 'hdr-item mono', '');
    timer.innerHTML = '⏱ <span id="timer" class="mono">' + fmtT(CFG.timerSeconds) + '</span>';
    var tstate = el('span', 'state-chip', '● IDLE'); tstate.id = 'timerstate';
    var score = el('span', 'hdr-item', ''); score.id = 'score';
    var user = el('span', 'hdr-item', ''); user.id = 'userchip'; user.hidden = true;
    var bHint = el('button', 'btn amber', '💡 Hint'); bHint.id = 'btnHint';
    var bPause = el('button', 'btn', '⏸ Pause'); bPause.id = 'btnPause';
    var bSkip = el('button', 'btn', '⏭ Skip'); bSkip.id = 'btnSkip';
    var sp = el('span', 'spacer', ''); sp.style.marginLeft = 'auto';
    row.appendChild(brand); row.appendChild(sev); row.appendChild(counter);
    row.appendChild(timer); row.appendChild(tstate); row.appendChild(score);
    row.appendChild(user); row.appendChild(sp);
    row.appendChild(bHint); row.appendChild(bPause); row.appendChild(bSkip);
    var pbar = el('div', '', ''); pbar.id = 'pbar';
    var pfill = el('div', '', ''); pfill.id = 'pfill';
    pbar.appendChild(pfill);
    h.appendChild(row); h.appendChild(pbar);
    bHint.addEventListener('click', onHint);
    bPause.addEventListener('click', onPause);
    bSkip.addEventListener('click', onSkip);
  }
  function updateHeader() {
    var ex = S.current;
    var counter = $('#counter');
    if (ex) {
      var n = S.order.indexOf(CFG.exercises.indexOf(ex)) + 1;
      counter.innerHTML = 'Exercise <strong>' + n + ' of ' + CFG.exercises.length + '</strong>';
    }
    var answered = 0, sum = 0;
    CFG.exercises.forEach(function (e) {
      var st = S.status[e.id];
      if (st && st !== 'skipped') { answered++; sum += (S.credit[e.id] || 0); }
    });
    var pct = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    $('#score').innerHTML = 'Score <strong class="mono">' + (Math.round(sum * 10) / 10).toFixed(1) + ' / ' + answered + '</strong> <span class="mono">(' + pct + '%)</span>';
    var done = 0;
    CFG.exercises.forEach(function (e) { if (S.status[e.id]) { done++; } });
    $('#pfill').style.width = Math.round((done / CFG.exercises.length) * 100) + '%';
    var u = $('#userchip');
    if (S.username) { u.hidden = false; u.innerHTML = '👤 ' + esc(S.username); }
  }

  /* ================= app screens ================= */
  function showScreen(name) {
    S.screen = name;
    var app = $('#app');
    app.innerHTML = '';
    $('#hdr').hidden = (name === 'intro');
    if (name === 'intro') { renderIntro(app); }
    else if (name === 'exam') { renderCurrent(); }
    else if (name === 'review') { renderReview(app); }
    else if (name === 'results') { renderResults(app); }
  }

  /* ================= intro ================= */
  function renderIntro(app) {
    var I = CFG.intro;
    var c1 = el('div', 'card');
    c1.appendChild(el('h1', '', esc(I.title)));
    c1.appendChild(el('p', 'muted', esc(I.subtitle)));
    var facts = el('div', 'facts');
    I.facts.forEach(function (f) {
      var d = el('div', 'fact');
      d.appendChild(el('div', 'k', esc(f[0])));
      d.appendChild(el('div', 'v', f[1]));
      facts.appendChild(d);
    });
    c1.appendChild(facts);
    app.appendChild(c1);

    var c2 = el('div', 'card');
    c2.appendChild(el('h2', 'c-blue', '📚 What you will learn here'));
    c2.appendChild(el('div', '', I.learn));
    app.appendChild(c2);

    var c3 = el('div', 'card');
    c3.appendChild(el('h2', 'c-amber', '🔑 Keywords covered in this exam'));
    I.keywords.forEach(function (th) {
      var t = el('div', 'theme');
      t.appendChild(el('div', 'theme-h', esc(th.theme)));
      var kw = el('div', 'kw');
      th.items.forEach(function (k) { kw.appendChild(el('span', '', esc(k))); });
      t.appendChild(kw);
      c3.appendChild(t);
    });
    app.appendChild(c3);

    var c4 = el('div', 'card');
    c4.appendChild(el('h2', 'c-green', '⚙ How this exam works'));
    var ul = el('ul', 'rules');
    I.how.forEach(function (r) { ul.appendChild(el('li', '', r)); });
    c4.appendChild(ul);
    var start = el('button', 'btn green', '▶ Start the exam');
    start.style.marginTop = '16px';
    start.style.minWidth = '220px';
    start.addEventListener('click', function () { startExam(); });
    c4.appendChild(start);
    app.appendChild(c4);
  }

  /* ================= exam flow ================= */
  function startExam() {
    S.attempts++; S.reported = false;
    S.order = shuffle(CFG.exercises.map(function (_, i) { return i; }));
    S.pos = 0; S.skipReturn = false;
    S.credit = {}; S.status = {}; S.checked = {}; S.hintUsed = {};
    S.manualPauseTotal = 0; S.autoPauseTotal = 0; S.mpT0 = null; S.apT0 = null; S.prevState = 'RUNNING';
    T.remain = CFG.timerSeconds;
    T.start();
    showScreen('exam');
  }
  function skippedList() {
    return S.order.filter(function (idx) {
      return S.status[CFG.exercises[idx].id] === 'skipped';
    });
  }
  function answeredCount() {
    var n = 0;
    CFG.exercises.forEach(function (e) { var st = S.status[e.id]; if (st && st !== 'skipped') { n++; } });
    return n;
  }
  function advance() {
    S.pos = S.pos + 1;
    if (S.pos < S.order.length) { renderCurrent(); }
    else if (skippedList().length > 0) { showScreen('review'); }
    else { finishExam(); }
  }
  function renderCurrent() {
    if (S.pos < 0 || S.pos >= S.order.length) { return; }
    var exIdx = S.order[S.pos];
    var ex = CFG.exercises[exIdx];
    renderExercise(ex);
  }
  function renderExercise(ex) {
    S.current = ex;
    S.widget = null;
    var app = $('#app');
    app.innerHTML = '';
    updateHeader();

    var wrap = el('div', '');
    var head = el('div', 'ex-head');
    head.innerHTML = '<span>🎯 Exercise ' + (S.order.indexOf(CFG.exercises.indexOf(ex)) + 1) + ' of ' + CFG.exercises.length + '</span>' +
      '<span class="sev-badge ' + CFG.sevClass + '">' + esc(CFG.severity) + '</span>' +
      (CFG.partLabel ? '<span class="hdr-item">' + esc(CFG.partLabel) + '</span>' : '') +
      '<span class="spacer"></span>';
    wrap.appendChild(head);

    var body = el('div', 'ex-body');
    var outer = el('div', '');
    outer.appendChild(body);
    wrap.appendChild(outer);

    /* --- SCENARIO block --- */
    var sblk = el('div', 'blk blk-scen');
    var sh = el('div', 'blk-h');
    sh.innerHTML = '<span class="h-icon">🧭</span> SCENARIO';
    var collapse = el('button', 'btn h-btn', '▾ Collapse');
    collapse.style.minHeight = '30px'; collapse.style.padding = '2px 10px'; collapse.style.fontSize = '12px';
    collapse.addEventListener('click', function () {
      var c = sblk.classList.toggle('collapsed');
      collapse.textContent = c ? '▸ Expand' : '▾ Collapse';
      summary.textContent = c ? '▸ ' + ex.summary + ' — collapsed' : '';
    });
    sh.appendChild(collapse);
    sblk.appendChild(sh);
    var summary = el('div', 'blk-b blk-summary', '');
    sblk.appendChild(summary);
    var sbody = el('div', 'blk-b');
    if (ex.scenario && ex.scenario.note) {
      var nt = el('div', '', '');
      nt.innerHTML = proseHtml(ex.scenario.note);
      sbody.appendChild(nt);
    }
    if (ex.scenario && ex.scenario.artifacts) {
      ex.scenario.artifacts.forEach(function (a, ai) { sbody.appendChild(renderArtifact(a, ai)); });
    }
    sblk.appendChild(sbody);
    body.appendChild(sblk);

    /* --- QUESTION block --- */
    var qblk = el('div', 'blk blk-q');
    var qh = el('div', 'blk-h');

  function highlightLog(ln) {

  /* ================= widgets ================= */
  function buildWidget(ex, container, btnCheck) {
    var w = ex.widget;
    if (w.type === 'single' || w.type === 'multi') { return buildOptions(ex, container, btnCheck); }
    if (w.type === 'match') { return buildMatch(ex, container, btnCheck); }
    if (w.type === 'dnd') { return buildDnd(ex, container, btnCheck); }
    if (w.type === 'order') { return buildOrder(ex, container, btnCheck); }
    if (w.type === 'fill') { return buildFill(ex, container, btnCheck); }
    if (w.type === 'branch') { return buildBranch(ex, container, btnCheck); }
    return null;
  }

  /* ---- single / multi ---- */
  function buildOptions(ex, container, btnCheck) {
    var w = ex.widget;
    var multi = (w.type === 'multi');
    var state = { sel: {} };
    var opts = shuffle(w.options);
    var nodes = {};
    opts.forEach(function (o, i) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="ltr">' + LETTERS[i] + '.</span><span>' + esc(o.text) + '</span><span class="sel-tag" hidden>✓ Selected</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (multi) {
          state.sel[o.id] = !state.sel[o.id];
          b.classList.toggle('sel', !!state.sel[o.id]);
          b.setAttribute('aria-pressed', state.sel[o.id] ? 'true' : 'false');
          var tag = $('.sel-tag', b); if (tag) { tag.hidden = !state.sel[o.id]; }
        } else {
          state.sel = {};
          state.sel[o.id] = true;
          opts.forEach(function (oo) {
            var n = nodes[oo.id];
            n.classList.remove('sel');
            n.setAttribute('aria-pressed', 'false');
            var tg = $('.sel-tag', n); if (tg) { tg.hidden = true; }
          });
          b.classList.add('sel');
          b.setAttribute('aria-pressed', 'true');
          var tg2 = $('.sel-tag', b); if (tg2) { tg2.hidden = false; }
        }
        updateCheckState();
      });
      nodes[o.id] = b;
      container.appendChild(b);
    });
    return {
      type: w.type,
      isReady: function () { return Object.keys(state.sel).some(function (k) { return state.sel[k]; }); },
      collect: function () { return Object.keys(state.sel).filter(function (k) { return state.sel[k]; }); },
      lock: function () { opts.forEach(function (o) { nodes[o.id].disabled = true; }); }
    };
  }

  /* ---- matching ---- */
  function buildMatch(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { pickedL: null, pairs: {} };
    var leftNodes = {}, rightNodes = {};
    var lcol = el('div', 'match-grid');
    var lc = el('div', ''), rc = el('div', '');
    lc.appendChild(el('div', 'mcol-h', 'Left — items'));
    rc.appendChild(el('div', 'mcol-h', 'Right — meanings'));
    lcol.appendChild(lc); lcol.appendChild(rc);
    container.appendChild(lcol);
    var plist = el('div', 'pairlist');
    container.appendChild(plist);

    function rightText(rid) {
      var r = w.right.filter(function (x) { return x.id === rid; })[0];
      return r ? r.text : rid;
    }
    function renderPairs() {
      plist.innerHTML = '';
      Object.keys(state.pairs).forEach(function (lid) {
        var lt = w.left.filter(function (x) { return x.id === lid; })[0].text;
        var row = el('div', 'pair');
        row.innerHTML = '<span><strong>' + esc(short(lt)) + '</strong></span><span class="arrow">→</span><span>' + esc(rightText(state.pairs[lid])) + '</span>';
        var rm = el('button', 'rm', '✕ Remove');
        rm.type = 'button';
        rm.addEventListener('click', function () {
          if (S.checked[ex.id]) { return; }
          delete state.pairs[lid];
          state.pickedL = null;
          renderPairs(); syncChips(); updateCheckState();
        });
        row.appendChild(rm);
        plist.appendChild(row);
      });
    }
    function short(t) { return t.length > 46 ? t.slice(0, 45) + '…' : t; }
    function syncChips() {
      w.left.forEach(function (l) {
        leftNodes[l.id].classList.toggle('picked', state.pickedL === l.id);
        leftNodes[l.id].classList.toggle('paired', !!state.pairs[l.id]);
      });
      w.right.forEach(function (r) {
        var used = Object.keys(state.pairs).some(function (k) { return state.pairs[k] === r.id; });
        rightNodes[r.id].classList.toggle('paired', used);
      });
    }
    shuffle(w.left).forEach(function (l) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(l.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id] || state.pairs[l.id]) { return; }
        state.pickedL = (state.pickedL === l.id) ? null : l.id;
        syncChips();
      });
      leftNodes[l.id] = b;
      lc.appendChild(b);
    });
    shuffle(w.right).forEach(function (r) {
      var b = el('button', 'opt mchip');
      b.type = 'button';
      b.innerHTML = '<span>' + esc(r.text) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        var lid = state.pickedL;
        if (!lid) { return; }
        state.pairs[lid] = r.id;
        state.pickedL = null;
        renderPairs(); syncChips(); updateCheckState();
      });
      rightNodes[r.id] = b;
      rc.appendChild(b);
    });
    container.appendChild(el('p', 'small muted', 'Pick one item on the left, then its meaning on the right. You can remove a pair before checking.'));
    return {
      type: 'match',
      isReady: function () { return Object.keys(state.pairs).length > 0; },
      collect: function () { return state.pairs; },
      lock: function () {
        w.left.forEach(function (l) { leftNodes[l.id].disabled = true; });
        w.right.forEach(function (r) { rightNodes[r.id].disabled = true; });
      }
    };
  }

  /* ---- drag & drop ---- */
  function buildDnd(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { place: {}, selChip: null };
    var bank = el('div', 'bank');
    container.appendChild(el('div', 'mcol-h', 'Items'));
    container.appendChild(bank);
    var zcls = w.zones.length >= 4 ? 'z4' : (w.zones.length === 3 ? 'z3' : 'z2');
    var zwrap = el('div', 'zones ' + zcls);
    container.appendChild(zwrap);
    var zoneNodes = {}, chipNodes = {};

    function putInBank(itemId) {
      delete state.place[itemId];
      bank.appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function putInZone(itemId, zid) {
      state.place[itemId] = zid;
      zoneNodes[zid].querySelector('.zitems').appendChild(chipNodes[itemId]);
      syncZones(); updateCheckState();
    }
    function syncZones() {
      Object.keys(state.place).forEach(function (iid) {
        chipNodes[iid].classList.remove('sel');
      });
    }
    var items = shuffle(w.items);
    items.forEach(function (it) {
      var c = el('button', 'chip');
      c.type = 'button';
      c.draggable = true;
      c.setAttribute('data-item', it.id);
      c.innerHTML = '<span>' + esc(it.text) + '</span>';
      c.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.place[it.id]) {
          putInBank(it.id);
          return;
        }
        state.selChip = (state.selChip === it.id) ? null : it.id;
        items.forEach(function (o) { chipNodes[o.id].classList.toggle('sel', state.selChip === o.id); });
      });
      c.addEventListener('dragstart', function (ev) {
        if (S.checked[ex.id]) { ev.preventDefault(); return; }
        state.selChip = it.id;
        c.classList.add('dragging');
        try { ev.dataTransfer.setData('text/plain', it.id); } catch (e) {}
      });
      c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
      chipNodes[it.id] = c;
      bank.appendChild(c);
    });
    w.zones.forEach(function (z) {
      var zd = el('div', 'zone');
      zd.setAttribute('data-zone', z.id);
      zd.appendChild(el('div', 'zone-h', '📥 ' + esc(z.label)));
      var zi = el('div', 'zitems');
      zd.appendChild(zi);
      zd.addEventListener('dragover', function (ev) { ev.preventDefault(); zd.classList.add('over'); });
      zd.addEventListener('dragleave', function () { zd.classList.remove('over'); });
      zd.addEventListener('drop', function (ev) {
        ev.preventDefault();
        zd.classList.remove('over');
        if (S.checked[ex.id]) { return; }
        var iid = state.selChip;
        if (!iid) { try { iid = ev.dataTransfer.getData('text/plain'); } catch (e) {} }
        if (!iid) { return; }
        putInZone(iid, z.id);
        state.selChip = null;
        items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
      });
      zd.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        if (state.selChip) {
          putInZone(state.selChip, z.id);
          state.selChip = null;
          items.forEach(function (o) { chipNodes[o.id].classList.remove('sel'); });
        }
      });
      zoneNodes[z.id] = zd;
      zwrap.appendChild(zd);
    });
    container.appendChild(el('p', 'small muted', 'Drag an item into a zone — or tap the item, then tap the zone. Tap a placed item to send it back.'));
    return {
      type: 'dnd',
      isReady: function () { return Object.keys(state.place).length > 0; },
      collect: function () { return state.place; },
      lock: function () {
        items.forEach(function (o) { chipNodes[o.id].disabled = true; });
      }
    };
  }

  /* ---- ordering ---- */
  function buildOrder(ex, container, btnCheck) {
    var w = ex.widget;
    var state = { seq: shuffle(w.items.map(function (x) { return x.id; })) };
    var ol = el('ul', 'olist');
    container.appendChild(ol);
    var nodes = {};
    function text(id) { return w.items.filter(function (x) { return x.id === id; })[0].text; }
    function render() {
      ol.innerHTML = '';
      state.seq.forEach(function (id, i) {
        var li = el('li', 'oli');
        li.draggable = true;
        li.setAttribute('data-id', id);
        li.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="otext">' + esc(text(id)) + '</span>';
        var mv = el('span', 'mv');
        var up = el('button', '', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
        var dn = el('button', '', '▼'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
        up.addEventListener('click', function () {
          if (S.checked[ex.id] || i === 0) { return; }
          var t = state.seq[i - 1]; state.seq[i - 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        dn.addEventListener('click', function () {
          if (S.checked[ex.id] || i === state.seq.length - 1) { return; }
          var t = state.seq[i + 1]; state.seq[i + 1] = state.seq[i]; state.seq[i] = t;
          render(); updateCheckState();
        });
        mv.appendChild(up); mv.appendChild(dn);
        li.appendChild(mv);
        li.addEventListener('dragstart', function (ev) {
          if (S.checked[ex.id]) { ev.preventDefault(); return; }
          li.classList.add('dragging');
          try { ev.dataTransfer.setData('text/plain', id); } catch (e) {}
        });
        li.addEventListener('dragend', function () { li.classList.remove('dragging'); });
        li.addEventListener('dragover', function (ev) { ev.preventDefault(); });
        li.addEventListener('drop', function (ev) {
          ev.preventDefault();
          if (S.checked[ex.id]) { return; }
          var from = state.seq.indexOf(id);
          var dragId = null;
          try { dragId = ev.dataTransfer.getData('text/plain'); } catch (e) {}
          if (!dragId) { return; }
          var fi = state.seq.indexOf(dragId);
          if (fi < 0 || fi === from) { return; }
          state.seq.splice(fi, 1);
          var to = state.seq.indexOf(id);
          state.seq.splice(to + (fi < to ? 1 : 0), 0, dragId);
          render(); updateCheckState();
        });
        nodes[id] = li;
        ol.appendChild(li);
      });
    }
    render();
    container.appendChild(el('p', 'small muted', 'Drag rows — or use the ▲▼ buttons — to put the items in the right order.'));
    return {
      type: 'order',
      isReady: function () { return true; },
      collect: function () { return state.seq.slice(); },
      lock: function () { $all('.oli .mv button', ol).forEach(function (b) { b.disabled = true; }); }
    };
  }

  /* ---- fill blanks ---- */
  function buildFill(ex, container, btnCheck) {
    var w = ex.widget;

    var textDiv = el('div', 'filltext');
    var parts = String(w.text).split(/(__b\d+__)/);

        htmlOut += '<button type="button" class="blank" data-blank="' + bid + '" aria-label="Blank ' + m[1] + '">____</button>';
      } else {

      var bid = b.getAttribute('data-blank');
      blankNodes[bid] = b;
      b.addEventListener('click', function () {

        if (state.fills[bid]) {
          delete state.fills[bid];
          b.textContent = '____';
          b.classList.remove('filled');
          updateCheckState();
          return;
        }
        if (state.sel) {
          state.fills[bid] = state.sel;

          b.classList.add('filled');
          b.classList.remove('sel');

      return r ? r.text : wid;
    }
    shuffle(w.bank).forEach(function (bw) {
      var c = el('button', 'chip');
      c.type = 'button';
      c.innerHTML = '<span>' + esc(bw.text) + '</span>';
      c.addEventListener('click', function () {
        if (S.checked[ex.id]) { return; }
        state.sel = (state.sel === bw.id) ? null : bw.id;
        $all('.chip', bankNode).forEach(function (x) { x.classList.toggle('sel', x === c && state.sel === bw.id); });
      });
      c.setAttribute('data-word', bw.id);
      bankNode.appendChild(c);
    });
    container.appendChild(el('p', 'small muted', 'Tap a word from the bank, then tap a blank. Tap a filled blank to empty it.'));
    return {
      type: 'fill',
      isReady: function () { return Object.keys(state.fills).length > 0; },
      collect: function () { return state.fills; },
      lock: function () {
        $all('.chip', bankNode).forEach(function (c) { c.disabled = true; });

  /* ---- branching / multi-step ---- */
  function buildBranch(ex, container, btnCheck) {
