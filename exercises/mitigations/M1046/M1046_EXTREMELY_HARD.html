  title:"M1046 Boot Integrity — EXTREMELY HARD",

    meaning:"Long realistic incidents with four or more artefacts, irrelevant noise, missing information and conflicting signals you must resolve explicitly. Sometimes the correct answer is to wait, verify, or accept a real cost — and sometimes a widely used best practice is the wrong answer in this specific context." },
  intro:{
    entity:"<p><strong>M1046 — Boot Integrity is a <em>Mitigation</em> in the MITRE ATT&amp;CK framework.</strong> A mitigation is guidance for defenders. It explains how to stop or slow down an attack technique. It is not a description of an attack. It lives on the defences side of ATT&amp;CK, and it points to the techniques it helps to stop.</p>"
    +"<p>In this exam you will learn what Boot Integrity means and how people use it in real jobs. Imagine you switch on a computer. Before Windows or Linux starts, the machine runs small start-up programs: first the firmware (called UEFI or BIOS), then the bootloader, then the operating system. An attacker who changes these early programs controls everything that runs after them. Security tools start later, so they may never see this malware. That is why the boot phase is so valuable to attackers — and why defenders must protect it.</p>"
    +"<p>Boot Integrity means the system <em>checks</em> that the start-up code is untouched and trusted before it runs. You will learn its four main measures: (1) <strong>Secure Boot</strong> — the firmware checks a digital signature on the bootloader and only starts code it trusts; (2) <strong>TPM attestation</strong> — a small security chip (the TPM) writes measurements of every boot step, so changes can be detected later; (3) <strong>bootloader and firmware passwords</strong> — these stop a person with physical access from switching protections off; (4) <strong>runtime integrity monitoring</strong> — after boot, checks that key system files stay unchanged.</p>"
    +"<p><strong>Who uses this at work?</strong> System administrators turn on Secure Boot and set firmware passwords. SOC analysts read attestation alerts when boot measurements change. Incident responders check the SPI flash chip when they suspect a bootkit. Detection engineers build attestation dashboards. GRC analysts map this control to rules such as NIST SP 800-193 and write it into policy. Procurement teams check that new hardware ships with a TPM and Secure Boot support.</p>"
    +"<p><strong>What risks does it address?</strong> It helps stop attackers who replace a bootloader, infect firmware (a bootkit), tamper with the SPI flash chip, serve a tampered boot image over the network, or ship a compromised device through the hardware supply chain. ATT&amp;CK links M1046 to techniques such as T1542 Pre-OS Boot, T1195.003 Compromise Hardware Supply Chain, T1505.006 vSphere Installation Bundles, T1553.006 Code Signing Policy Modification, T1601 Modify System Image, and T1495 Firmware Corruption.</p>"
    +"<p><strong>Be honest about the limits.</strong> Boot Integrity mainly protects the start-up phase. It does not stop a phishing email, and it only partly helps after the system has booted (that is the job of the runtime integrity measure). A failed check can stop a device from booting at all, so teams must plan updates and recovery media carefully. Knowing what a control does <em>not</em> do is part of mastering it.</p>"
  },
  keywords:[
    { t:"Object identity & purpose", items:["Mitigation M1046","Boot process integrity","Firmware (UEFI/BIOS)","Bootloader","OS components","Hardware-rooted trust"] },

    { t:"Techniques addressed", items:["T1495 Firmware Corruption","T1601(.001/.002) Modify System Image","T1542 Pre-OS Boot","T1542.001 System Firmware","T1542.003 Bootkit","T1542.004 ROMMONkit","T1542.005 TFTP Boot","T1505.006 vSphere Installation Bundles","T1553.006 Code Signing Policy Modification","T1195.003 Compromise Hardware Supply Chain"] },

{
  id:"X01", type:"branch", title:"Fleet attestation anomaly", summary:"172 hosts drift at 02:00 — ticket vs serials conflict",
  scenario:{ artefacts:[
      { label:"Attestation export (02:00–05:00)", lines:[

  question:"Resolve the incident in two decisions.",

  explanation:"Two signals conflict: a trusted ticket versus a serial-number mismatch. Resolution order: correlate first (window, scale, vendor signature, bulletin timing all align with the rollout), then close the residual conflict by verifying the stale record with its owner. Mass remediation before verification is the expensive reflex this exercise trains out. The Building C note is noise — a power event last month explains nothing about tonight.",
  study:"Resolving conflicting signals: provenance, scale, timing, signature.",
  persp:"Blue side: scale plus provenance wins; data conflicts are closed explicitly. Red side: a real campaign would hide inside a rollout window — which is exactly why you verify instead of assume.",
  steps:[

  lines:[

function el(tag, cls, html){ var e=document.createElement(tag); if(cls){e.className=cls;} if(html!=null){e.innerHTML=html;} return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtClock(sec){ sec=Math.max(0,sec); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; var p=function(n){return (n<10?'0':'')+n;}; return (h>0? p(h)+':':'')+p(m)+':'+p(s); }
function round1(x){ return Math.round(x*10)/10; }

/* partial-credit scoring engine (mandatory formula) */
function scoreExercise(selected, correct){
  var N=correct.length, H=0, W=0;
  selected.forEach(function(s){ if(correct.indexOf(s)>=0){H++;} else {W++;} });
  return Math.max(0,(H-W)/N);
}

};

/* ---------- timer state machine: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED ---------- */
function timerSetState(st){
  var t=S.timer;
  if(t.state===st) return;
  /* accumulate pause durations */
  if(t.state==='PAUSED_MANUAL' && st!=='PAUSED_MANUAL' && S.pauseAcc.since!=null){
    S.pauseAcc.manual += Math.floor((Date.now()-S.pauseAcc.since)/1000); S.pauseAcc.since=null;
  }
  if(t.state==='PAUSED_AUTO_CHECK' && st!=='PAUSED_AUTO_CHECK' && S.pauseAcc.since!=null){
    S.pauseAcc.feedback += Math.floor((Date.now()-S.pauseAcc.since)/1000); S.pauseAcc.since=null;
  }
  t.state=st;
  if(st==='RUNNING'||st==='PAUSED_MANUAL'||st==='PAUSED_AUTO_CHECK'){ S.pauseAcc.since = (st!=='RUNNING')? Date.now() : null; }
  renderTimer();
}
function timerStart(minutes){

}

  var sum=0, cnt=0;
  Object.keys(S.answers).forEach(function(k){ var a=S.answers[k]; if(a.answered){ sum+=a.credit; cnt++; } });
  var pct = cnt>0? Math.round((sum/cnt)*100):0;
  var ts, tc;
  var t=S.timer;
  if(t.state==='RUNNING'){ ts='▶ RUNNING'; tc='run'; }
  else if(t.state==='PAUSED_MANUAL'){ ts='⏸ PAUSED — manual (press Resume)'; tc='pman'; }
  else if(t.state==='PAUSED_AUTO_CHECK'){ ts='⏸ PAUSED — reviewing feedback (resumes on Next)'; tc='pauto'; }
  else if(t.state==='ENDED'){ ts='⏹ ENDED'; tc='end'; }
  else { ts='— not started'; tc=''; }
  var ans = examMode ? currentExercise() : null;
  var answered = !!(ans && S.answers[ans.idx] && S.answers[ans.idx].answered);
  var isLastAnswered = lastPendingIndex()<0;
  var nextLabel = (isLastAnswered && S.skipped.length===0) ? 'Final Submit' : 'Next';
  var actions = '';
  if(examMode){
    actions = '<button class="btn sm" id="btnPause">⏸ Pause</button>'
    + '<button class="btn sm" id="btnHint"'+(answered||S.usedHints[ans.idx]?' disabled':'')+'>💡 Hint (−10%)</button>'
    + '<button class="btn sm" id="btnSkip"'+(answered?' disabled':'')+'>⤼ Skip</button>'
    + '<button class="btn sm" id="btnFinish">Finish</button>';
  }
  return '<div class="bar" role="banner">'
    + '<span class="counter">Exercise '+Math.max(1,n)+' of '+total+'</span>'
    + '<span class="badge '+D.sev.cls+'">'+D.sev.label+'</span>'
    + '<span class="tstate '+tc+'" id="tstate" role="status" aria-live="off">'+(ts)+'</span>'
    + '<span class="score" id="liveScore" aria-live="off">'+round1(sum)+' / '+cnt+' ('+pct+'%)</span>'
    + '<span class="grow"></span>'
    + actions
    + '</div>';
}
function currentExercise(){ if(S.idx>=S.order.length) return null; var i=S.order[S.idx]; return D.exercises[i] ? Object.assign({idx:i}, D.exercises[i]) : null; }
function isResolved(i){ return (S.answers[i] && S.answers[i].answered) || S.skipped.indexOf(i)>=0; }
function lastPendingIndex(){ for(var k=0;k<S.order.length;k++){ var i=S.order[k]; if(!isResolved(i)) return k; } return -1; }
function renderTimer(){ var n=$('tstate'); if(!n) return; var t=S.timer;
  var txt='', cls='';
  if(t.state==='RUNNING'){txt='▶ RUNNING — '+fmtClock(t.sec);cls='run';}
  else if(t.state==='PAUSED_MANUAL'){txt='⏸ PAUSED — manual — '+fmtClock(t.sec)+' (press Resume)';cls='pman';}
  else if(t.state==='PAUSED_AUTO_CHECK'){txt='⏸ PAUSED — reviewing feedback (resumes on Next) — '+fmtClock(t.sec);cls='pauto';}
  else if(t.state==='ENDED'){txt='⏹ ENDED';cls='end';}
  else {txt='— not started';}
  n.textContent=txt; n.className='tstate '+cls;
  refreshLiveScore();
}
function refreshLiveScore(){ var n=$('liveScore'); if(!n) return; var sum=0,cnt=0;
  Object.keys(S.answers).forEach(function(k){ var a=S.answers[k]; if(a.answered){ sum+=a.credit; cnt++; } });
  var pct=cnt>0?Math.round((sum/cnt)*100):0;
  n.textContent=round1(sum)+' / '+cnt+' ('+pct+'%)';
}

/* ----- exam flow ----- */
function startExam(){
  S.attempt++; S.reported=false;
  S.answers={}; S.skipped=[]; S.usedHints={}; S.fromReview=false;
  S.pauseAcc={manual:0,feedback:0,since:null};
  S.order = shuffle(D.exercises.map(function(_,i){ return i; }));
  S.idx = lastPendingIndex(); if(S.idx<0) S.idx=0;
  timerStart(D.timerMinutes);
  showScreen('exam');
}
function renderExamScreen(){
  S.screen='exam';
  var ex = currentExercise();
  if(!ex){ openReview(); return; }
  var body = el('div');
  body.innerHTML = headerHTML();
  try { body.appendChild(buildExerciseCard(ex)); }
  catch(e){
    body.appendChild(el('div','panel','<h2>Unable to display this exercise</h2><p>Please use Skip to continue the exam.</p>'));
  }
  app.innerHTML=''; app.appendChild(body);
  bindHeaderButtons();
  var card=$('answerRoot'); if(card){ /* focus first control for a11y */ }
  window.scrollTo(0,0);
}
function bindHeaderButtons(){
  var p=$('btnPause'), h=$('btnHint'), sk=$('btnSkip'), f=$('btnFinish');
  if(p) p.addEventListener('click', onPauseToggle);
  if(h) h.addEventListener('click', onHint);
  if(sk) sk.addEventListener('click', onSkip);
  if(f) f.addEventListener('click', function(){
    /* unstack a manual pause first, then leave auto-check; review always runs on a live timer */
    if(S.timer.state==='PAUSED_MANUAL'){ hideManualPauseOverlay(); timerSetState(prevPauseWasAuto?'PAUSED_AUTO_CHECK':'RUNNING'); }
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ timerSetState('RUNNING'); }
    if(S.timer.state==='RUNNING'){ openReview(); }
  });
}
function onPauseToggle(){
  if(S.timer.state==='RUNNING'){ prevPauseWasAuto=false; timerSetState('PAUSED_MANUAL'); showManualPauseOverlay(); }
  /* manual pause may be pressed on top of the Check auto-pause; Resume must return to it */
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ prevPauseWasAuto=true; timerSetState('PAUSED_MANUAL'); showManualPauseOverlay(); }
  else if(S.timer.state==='PAUSED_MANUAL'){ hideManualPauseOverlay(); timerSetState(prevPauseWasAuto?'PAUSED_AUTO_CHECK':'RUNNING'); }
}
var prevPauseWasAuto=false;
var overlayEl=null;
function showManualPauseOverlay(){
  /* prevPauseWasAuto is decided by onPauseToggle BEFORE the state change */
  overlayEl = el('div','overlay');
  overlayEl.innerHTML='<div class="obox" role="dialog" aria-label="Paused"><h2>⏸ Paused — manual break</h2>'
    +'<p>The timer is stopped and the exercise is hidden. Press Resume when you are ready.</p>'
    +'<button class="btn pri" id="btnResume">▶ Resume</button></div>';
  document.body.appendChild(overlayEl);
  $('btnResume').addEventListener('click', function(){ hideManualPauseOverlay(); timerSetState(prevPauseWasAuto?'PAUSED_AUTO_CHECK':'RUNNING'); });
}
function hideManualPauseOverlay(){ if(overlayEl){ overlayEl.remove(); overlayEl=null; } }
function onHint(){
  var ex=currentExercise(); if(!ex) return;
  if(S.usedHints[ex.idx]|| (S.answers[ex.idx]&&S.answers[ex.idx].answered)) return;
  S.usedHints[ex.idx]=true;
  var hp=$('hintPanel'); if(hp){ hp.classList.remove('hidden'); hp.setAttribute('tabindex','-1'); hp.focus(); }
  var b=$('btnHint'); if(b) b.disabled=true;
}
function onSkip(){
  var ex=currentExercise(); if(!ex) return;
  var a=S.answers[ex.idx]; if(a&&a.answered) return;
  if(S.skipped.indexOf(ex.idx)<0) S.skipped.push(ex.idx);
  advance();
}
function advance(){
  var k=lastPendingIndex();
  if(k<0){ openReview(); return; }
  /* move to next unresolved (not answered, not skipped), prefer sequential order */
  for(var j=S.idx+1;j<S.order.length;j++){ var i=S.order[j]; if(!isResolved(i)){ S.idx=j; renderExamScreen(); return; } }
  for(var j2=0;j2<=S.idx;j2++){ var i2=S.order[j2]; if(!isResolved(i2)){ S.idx=j2; renderExamScreen(); return; } }
  openReview();
}

/* ---------- shared block builders ---------- */
function blockScenario(ex){

      else { b.classList.add('hidden'); s.classList.remove('hidden'); btn.textContent='▸ Expand'; btn.setAttribute('aria-expanded','false'); }
    });

function blockQuestion(ex){
  var w = el('div','blk question');
  w.innerHTML = '<div class="blk-h">❓ QUESTION</div><div class="blk-b"><strong>'+ex.question+'</strong></div>';
  return w;
}
function lineText(ln){ return (typeof ln==='string')? ln : (ln && ln.t || ''); }
function lineWhy(ln){ return (ln && typeof ln==='object')? (ln.why||'') : ''; }
function lineOk(ln){ return (ln && typeof ln==='object')? !!ln.ok : false; }
function monoBlock(lines, clickMode){
  var box = el('div');
  if(clickMode){ box.className=''; } else { box.className='mono'; box.setAttribute('role','figure'); box.setAttribute('aria-label','log or configuration excerpt'); }
  lines.forEach(function(ln,i){
    if(clickMode){
      var b = el('button','mrow');
      b.type='button'; b.setAttribute('aria-pressed','false'); b.dataset.i=i;
      b.innerHTML = hl(lineText(ln));
      if(lineOk(ln)) b.dataset.ok='1';
      box.appendChild(b);
    } else {
      box.appendChild(el('span','row', hl(lineText(ln))));
    }
  });
  return box;
}
function hl(s){
  var e = esc(s);
  e = e.replace(/\b(ok|OK|pass|PASS|enabled|ENABLED|allowed|trusted|valid|VALID|success|signed|healthy)\b/g,'<span class="tok-ok">$1</span>');
  e = e.replace(/\b(fail|FAIL|failed|denied|DENIED|error|blocked|revoked|unsigned|disabled|DISABLED|unknown|untrusted|alert|ALERT)\b/g,'<span class="tok-bad">$1</span>');
  e = e.replace(/\b(0x[0-9a-fA-F]+|\b\d+\b)\b/g,'<span class="tok-num">$1</span>');
  return e;
}

/* ---------- exercise card + type renderers ---------- */
var answerState = {}; /* per-render interaction store: {selected:[], correct:[], placed:{}, steps:[]} */
function buildExerciseCard(ex){
  var card = el('div'); card.id='answerRoot';
  var head = el('div','exhead');
  head.innerHTML = '<span class="badge '+D.sev.cls+'">'+D.sev.label+'</span>'
    + '<span class="etype">'+esc(TYPE_LABEL[ex.type]||ex.type)+'</span>'
    + (S.answers[ex.idx]&&S.answers[ex.idx].answered? '<span class="small">✔ submitted</span>':'');
  card.appendChild(head);
  card.appendChild(blockScenario(ex));
  card.appendChild(blockQuestion(ex));

  /* hint panel (hidden) */
  var hp = el('div','hintpanel hidden'); hp.id='hintPanel';
  hp.innerHTML = '<strong>💡 Hint:</strong> '+esc(ex.hint);
  card.appendChild(hp);
  if(S.usedHints[ex.idx]) hp.classList.remove('hidden');

  var ab = el('div','blk answer'); ab.id='ansBlock';
  ab.innerHTML = '<div class="blk-h">✎ YOUR ANSWER</div>';
  var abBody = el('div','blk-b'); abBody.id='ansBody';
  ab.appendChild(abBody); card.appendChild(ab);

  answerState = { selected:[], placed:{}, stepSel:{}, step:0, confirmedSteps:{}, type:ex.type, ex:ex };
  var ans = S.answers[ex.idx];
  var alreadyAnswered = !!(ans && ans.answered);

  RENDER[ex.type](abBody, ex, alreadyAnswered);

  /* delegated chip/slot/zone interaction (click-to-place + unplace, drag handled separately) */
  abBody.addEventListener('click', function(ev){
    var ex2 = answerState.ex;
    if(!ex2 || (S.answers[ex2.idx] && S.answers[ex2.idx].answered)) return;
    var t = ev.target;
    var chip = t.closest('.chip');
    var fslot = t.closest('.fib-slot');
    var slot = t.closest('.slot');
    var zone = t.closest('.zone');
    if(chip){
      var inBank = chip.parentElement && (chip.parentElement.id==='mBank' || chip.parentElement.id==='dBank' || chip.parentElement.id==='fBank');
      if(inBank){
        if(chip.classList.contains('placed') && chip.parentElement.id==='fBank'){ return; } /* word already used in a blank */
        selectChip(chip); return;
      }
      var cont = chip.closest('.zone') || chip.closest('.slot');
      if(cont){
        if(chipSelected && chipSelected!==chip){ placeChipIn(cont, chipSelected, ex2); }
        else if(chipSelected===chip){ selectChip(chip); }
        else { unplaceChip(chip, ex2); }
        return;
      }
    }
    if(fslot){
      if(chipSelected){ fillSlot(fslot, chipSelected, ex2); }
      else { unfillSlot(fslot, ex2); }
      return;
    }
    var cont2 = slot || zone;
    if(cont2 && chipSelected){ placeChipIn(cont2, chipSelected, ex2); }
  });

  /* action row */
  var actions = el('div'); actions.style.marginTop='12px'; actions.className='startrow';
  var chk = el('button','btn pri'); chk.id='btnCheck'; chk.type='button';
  chk.textContent = (ex.type==='branch') ? 'Check (final answer)' : '✓ Check';
  if(alreadyAnswered || !checkReady(ex)) chk.disabled=true;
  var nxt = el('button','btn'); nxt.id='btnNext'; nxt.type='button';
  var isLast = lastPendingIndex()<0 && S.skipped.length===0;
  nxt.textContent = isLast ? 'Final Submit ▶' : 'Next ▶';
  if(!alreadyAnswered) nxt.classList.add('hidden');
  actions.appendChild(chk); actions.appendChild(nxt);
  card.appendChild(actions);
  chk.addEventListener('click', function(){ onCheck(ex); });
  nxt.addEventListener('click', function(){ onNextAfterCheck(ex); });
  if(alreadyAnswered){ renderFeedback(ex, ans, true); }
  return card;
}
var TYPE_LABEL={qcm:'Multiple choice', multi:'Multi-select — partial credit', match:'Matching — partial credit',
  drag:'Drag &amp; drop — partial credit', order:'Ordering — partial credit', fib:'Fill-in-the-blank — partial credit',
  clickline:'Artefact analysis', triage:'Triage queue — partial credit', branch:'Decision tree — partial credit'};

function checkReady(ex){
  if(ex.type==='qcm') return answerState.selected.length===1;
  if(ex.type==='multi') return answerState.selected.length>0;
  if(ex.type==='match') return Object.keys(answerState.placed).length===ex.pairs.length;
  if(ex.type==='drag') return Object.keys(answerState.placed).length===ex.chips.length;
  if(ex.type==='order') return true;
  if(ex.type==='fib') return Object.keys(answerState.placed).length===ex.blankCount;
  if(ex.type==='clickline') return ex.multi? answerState.selected.length>0 : answerState.selected.length===1;
  if(ex.type==='triage') return Object.keys(answerState.placed).length===ex.items.length;
  if(ex.type==='branch') return Object.keys(answerState.confirmedSteps).length===ex.steps.length;
  return false;
}
function refreshCheckEnabled(ex){ var b=$('btnCheck'); if(b && !(S.answers[ex.idx]&&S.answers[ex.idx].answered)){ b.disabled=!checkReady(ex); } }

/* ----- qcm / multi ----- */
function renderOpts(root, ex, alreadyAnswered){
  var opts = shuffle(ex.opts.map(function(o,i){ return {t:o.t, ok:!!o.ok, i:i, why:o.why||''}; }));
  answerState.shuffledOpts = opts;
  answerState.correct = opts.map(function(o,i){ return o.ok? i : null; }).filter(function(x){ return x!=null; });
  var box = el('div','opts'); box.setAttribute('role','group');
  var isMulti = ex.type==='multi';
  opts.forEach(function(o,i){
    var b = el('button','opt'); b.type='button'; b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="lbl">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.t)+'</span>';
    if(alreadyAnswered && S.answers[ex.idx].selOrig && S.answers[ex.idx].selOrig.indexOf(o.i)>=0){ b.setAttribute('aria-pressed','true'); b.classList.add('sel'); }
    b.addEventListener('click', function(){
      if(S.answers[ex.idx] && S.answers[ex.idx].answered) return;
      if(isMulti){
        var p = answerState.selected.indexOf(i);
        if(p>=0){ answerState.selected.splice(p,1); b.setAttribute('aria-pressed','false'); b.classList.remove('sel'); }
        else { answerState.selected.push(i); b.setAttribute('aria-pressed','true'); b.classList.add('sel'); }
      } else {
        answerState.selected=[i];
        Array.prototype.forEach.call(box.children,function(c){ c.setAttribute('aria-pressed','false'); c.classList.remove('sel'); });
        b.setAttribute('aria-pressed','true'); b.classList.add('sel');
      }
      refreshCheckEnabled(ex);
    });
    box.appendChild(b);
  });
  root.appendChild(box);
}
/* ----- match ----- */
function renderMatch(root, ex, alreadyAnswered){
  answerState.correct = ex.pairs.map(function(_,i){ return i; });
  answerState.shuffledRights = shuffle(ex.pairs.map(function(p,i){ return {t:p.r, i:i}; }));
  var chipBank = el('div'); chipBank.innerHTML='<div class="small">Click a card, then click a slot. Or drag it.</div><div class="bank" id="mBank"></div>';

    bank.appendChild(c);

/* ----- drag to zones ----- */
function renderDrag(root, ex, alreadyAnswered){
  answerState.correct = ex.chips.map(function(_,i){ return i; });
  var zi = el('div','small'); zi.innerHTML='Click a card, then click a zone. Or drag it.';

var chipSelected=null;
function selectChip(chip){
  if(chipSelected){ chipSelected.setAttribute('aria-pressed','false'); }
  if(chipSelected===chip){ chipSelected=null; return; }
  chipSelected=chip; chip.setAttribute('aria-pressed','true');
}
function placeChipIn(container, chip, ex){
  if(chipSelected===chip){ chipSelected=null; }
  var ph = container.querySelector('.placed') || container;
  ph.appendChild(chip);
  chip.classList.add('placed'); chip.setAttribute('aria-pressed','false');
  chip.dataset.ci = chip.dataset.ci || chip.dataset.ri;
  var ci = parseInt(chip.dataset.ci!=null?chip.dataset.ci:chip.dataset.ri,10);
  answerState.placed[ci] = container.dataset.zid || container.dataset.pi;
  Array.prototype.forEach.call(document.querySelectorAll('#ansBody .chip'),function(x){ x.setAttribute('aria-pressed','false'); });
  chipSelected=null;
  refreshCheckEnabled(ex);
}
function unplaceChip(chip, ex){
  var cont = chip.closest('.zone') || chip.closest('.slot');
  if(!cont) return;
  var ci = parseInt(chip.dataset.ci!=null?chip.dataset.ci:chip.dataset.ri,10);
  delete answerState.placed[ci];
  chip.classList.remove('placed');
  if(chip.dataset.ri!=null){ $('mBank').appendChild(chip); } else { $('dBank').appendChild(chip); }
  refreshCheckEnabled(ex);
}
function unfillSlot(slot, ex){
  var w=slot.dataset.w; if(!w) return;
  delete answerState.placed[slot.dataset.b];
  slot.classList.remove('filled'); slot.textContent='___'; delete slot.dataset.w;
  Array.prototype.forEach.call($('fBank').querySelectorAll('.chip'),function(ch){ if(ch.textContent===w){ ch.classList.remove('placed'); } });
  refreshCheckEnabled(ex);
}
function enableDrag(root, ex, mode){
  var dragGhost=null, dragChip=null;
  function onMove(ev){
    if(!dragGhost) return;
    ev.preventDefault();
    dragGhost.style.left=(ev.clientX+8)+'px'; dragGhost.style.top=(ev.clientY+8)+'px';
    var z = document.elementFromPoint(ev.clientX,ev.clientY);
    Array.prototype.forEach.call(document.querySelectorAll('#ansBody .zone, #ansBody .slot'),function(x){ x.classList.remove('over'); });
    var tgt = z && z.closest && (z.closest('.zone')||z.closest('.slot'));
    if(tgt) tgt.classList.add('over');
  }
  function onUp(ev){
    if(!dragGhost) return;
    dragGhost.remove(); dragGhost=null;
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    var z = document.elementFromPoint(ev.clientX,ev.clientY);
    var tgt = z && z.closest && (z.closest('.zone')||z.closest('.slot'));
    Array.prototype.forEach.call(document.querySelectorAll('#ansBody .zone, #ansBody .slot'),function(x){ x.classList.remove('over'); });
    if(tgt && dragChip){ placeChipIn(tgt, dragChip, ex); dragChip=null; }
  }
  root.addEventListener('pointerdown', function(ev){
    var chip = ev.target.closest('.chip'); if(!chip) return;
    if(chip.parentElement && chip.parentElement.classList.contains('placed')) return; /* move back via click */
    dragChip = chip;
    var r = chip.getBoundingClientRect();
    dragGhost = chip.cloneNode(true);
    dragGhost.className='chip dragging';
    dragGhost.style.width=r.width+'px'; dragGhost.style.left=r.left+'px'; dragGhost.style.top=r.top+'px';
    document.body.appendChild(dragGhost);
    document.addEventListener('pointermove', onMove, {passive:false});
    document.addEventListener('pointerup', onUp);
  });
}
/* ----- order ----- */
function renderOrder(root, ex, alreadyAnswered){
  answerState.correct = ex.items.map(function(_,i){ return i; });
  var cur = shuffle(ex.items.map(function(it,i){ return {t:it.t, i:i}; }));
  answerState.curOrder = cur;
  var list = el('div','orderlist'); list.id='ordList'; list.setAttribute('aria-label','Ordering list');
  drawOrder(list, ex);
  root.appendChild(list);
  var hint = el('div','small','Use the ▲▼ buttons to put the steps in the correct order (first at the top).');
  root.appendChild(hint);
}
function drawOrder(list, ex){
  list.innerHTML='';
  answerState.curOrder.forEach(function(o,pos){
    var row = el('div','ordrow');
    row.innerHTML = '<span class="num">'+(pos+1)+'.</span><span class="ot">'+esc(o.t)+'</span>';
    var mv = el('div','mv');
    var up = el('button','btn sm','▲'); up.type='button'; up.setAttribute('aria-label','Move up');
    var dn = el('button','btn sm','▼'); dn.type='button'; dn.setAttribute('aria-label','Move down');
    up.addEventListener('click', function(){ if(pos>0){ var a=answerState.curOrder; var t=a[pos-1]; a[pos-1]=a[pos]; a[pos]=t; drawOrder(list,ex); } });
    dn.addEventListener('click', function(){ var a=answerState.curOrder; if(pos<a.length-1){ var t=a[pos+1]; a[pos+1]=a[pos]; a[pos]=t; drawOrder(list,ex); } });
    mv.appendChild(up); mv.appendChild(dn); row.appendChild(mv);
    list.appendChild(row);
  });
  refreshCheckEnabled(answerState.ex || ex);
}
/* ----- fib ----- */
function renderFib(root, ex, alreadyAnswered){
  answerState.correct = Object.keys(ex.ans).map(function(k){ return parseInt(k,10); });
  var txt = el('div','fib-text'); txt.id='fibText';
  var parts = ex.text.split(/\{(\d+)\}/);
  var html='';
  for(var i=0;i<parts.length;i++){
    if(i%2===0){ html+=esc(parts[i]); }
    else { html+='<span class="fib-slot" role="button" tabindex="0" data-b="'+parts[i]+'">___</span>'; }
  }
  txt.innerHTML=html; root.appendChild(txt);
  var bank = el('div'); bank.innerHTML='<div class="small">Click a word, then click a blank. Or drag it.</div><div class="bank" id="fBank"></div>';
  root.appendChild(bank);
  var fb = bank.querySelector('#fBank');
  shuffle(ex.bank).forEach(function(w){
    var c = el('button','chip'); c.type='button'; c.textContent=w; c.dataset.w=w; c.setAttribute('aria-pressed','false');
    fb.appendChild(c);
  });
  enableDrag(root, ex, 'fib');
}
function fillSlot(slot, chip, ex){
  var w = chip.dataset.w || chip.textContent;
  /* return previous word if any */
  if(slot.dataset.w){
    Array.prototype.forEach.call($('fBank').querySelectorAll('.chip'),function(ch){ if(ch.textContent===slot.dataset.w){ ch.classList.remove('placed'); } });
  }
  slot.dataset.w=w; slot.textContent=w; slot.classList.add('filled');
  answerState.placed[slot.dataset.b]=w;
  chip.classList.add('placed'); chip.setAttribute('aria-pressed','false');
  if(chipSelected===chip){ chipSelected=null; }
  refreshCheckEnabled(ex);
}
/* ----- clickline ----- */
function renderClickline(root, ex, alreadyAnswered){
  var lines = ex.lines;
  answerState.correct = lines.map(function(l,i){ return lineOk(l)? i : null; }).filter(function(x){ return x!=null; });
  answerState.shuffledOpts = lines.map(function(l,i){ return {t:lineText(l), ok:lineOk(l), why:lineWhy(l), i:i}; }); /* order preserved for logs */
  var box = monoBlock(lines, true);
  Array.prototype.forEach.call(box.querySelectorAll('button.mrow'),function(b){
    b.addEventListener('click', function(){
      if(S.answers[ex.idx] && S.answers[ex.idx].answered) return;
      var i = parseInt(b.dataset.i,10);
      if(ex.multi){
        var p = answerState.selected.indexOf(i);
        if(p>=0){ answerState.selected.splice(p,1); b.setAttribute('aria-pressed','false'); }
        else { answerState.selected.push(i); b.setAttribute('aria-pressed','true'); }
      } else {
        answerState.selected=[i];
        Array.prototype.forEach.call(box.querySelectorAll('button.mrow'),function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      }
      refreshCheckEnabled(ex);
    });
  });
  root.appendChild(box);
  var hint = el('div','small', ex.multi? 'Select every line that applies. Wrong picks subtract.' : 'Click the one line that answers the question.');
  root.appendChild(hint);
}
/* ----- triage ----- */
function renderTriage(root, ex, alreadyAnswered){
  answerState.correct = ex.items.map(function(_,i){ return i; });
  var sharedOpts = shuffle(ex.opts.map(function(o,j){ return {t:o, j:j}; }));
  ex.items.forEach(function(it,i){
    var row = el('div','trirow');
    row.innerHTML = '<div class="tt">'+esc(it.t)+'</div>';
    var sel = el('select'); sel.setAttribute('aria-label','Action for finding '+(i+1));
    var o0 = el('option'); o0.value=''; o0.textContent='— choose action —'; sel.appendChild(o0);
    sharedOpts.forEach(function(o){
      var op = el('option'); op.value=o.j; op.textContent=o.t; sel.appendChild(op);
    });
    sel.addEventListener('change', function(){
      if(sel.value===''){ delete answerState.placed[i]; } else { answerState.placed[i]=parseInt(sel.value,10); }
      refreshCheckEnabled(ex);
    });
    row.appendChild(sel); root.appendChild(row);
  });
}
/* ----- branch (decision tree) ----- */
function renderBranch(root, ex, alreadyAnswered){
  answerState.correct = ex.steps.map(function(_,i){ return i; });
  ex.steps.forEach(function(st,i){
    var box = el('div','stepbox'); box.id='step'+i;
    box.innerHTML = '<div class="slabel">STEP '+(i+1)+' OF '+ex.steps.length+'</div><div style="font-weight:600;margin-bottom:8px">'+esc(st.q)+'</div>';
    var og = el('div','opts');
    shuffle(st.opts.map(function(o,j){ return {t:o.t, ok:!!o.ok, j:j}; })).forEach(function(o,k){
      var b = el('button','opt'); b.type='button'; b.setAttribute('aria-pressed','false');
      b.innerHTML = '<span class="lbl">'+String.fromCharCode(65+k)+'.</span><span>'+esc(o.t)+'</span>';
      b.addEventListener('click', function(){
        if(answerState.confirmedSteps[i]!=null && answerState.confirmedSteps[i]!==false) return;
        answerState.stepSel[i]=o.j;
        Array.prototype.forEach.call(og.children,function(c){ c.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
        var cb=$('stepGo'+i); if(cb) cb.disabled=false;
      });
      og.appendChild(b);
    });
    box.appendChild(og);
    var go = el('button','btn'); go.type='button'; go.id='stepGo'+i; go.disabled=true;
    go.textContent = (i===ex.steps.length-1)? 'Confirm final step → then press Check' : 'Confirm & continue — timer keeps running';
    go.addEventListener('click', function(){
      if(answerState.stepSel[i]==null) return;
      answerState.confirmedSteps[i]=answerState.stepSel[i];
      box.classList.add('locked');
      go.disabled=true;
      if(i<ex.steps.length-1){ var nb=$('step'+(i+1)); if(nb){ nb.classList.remove('hidden'); nb.scrollIntoView({behavior:'smooth',block:'start'}); } }
      else { refreshCheckEnabled(ex); var cb=$('btnCheck'); if(cb){ cb.disabled=false; cb.focus(); } }
    });
    box.appendChild(go);
    root.appendChild(box);
    if(i>0) box.classList.add('hidden');
  });
}
var RENDER = {qcm:renderOpts, multi:renderOpts, match:renderMatch, drag:renderDrag, order:renderOrder,
  fib:renderFib, clickline:renderClickline, triage:renderTriage, branch:renderBranch};

/* ---------- grading ---------- */
function onCheck(ex){
  var prev = S.answers[ex.idx];
  if(prev && prev.answered) return;
  /* timer: auto-pause FIRST (before rendering feedback) */
  prevPauseWasAuto = false;
  timerSetState('PAUSED_AUTO_CHECK');
  var credit=0, items=[], selOrig=[];
  if(ex.type==='qcm' || ex.type==='multi'){
    var sel=answerState.selected;
    sel.forEach(function(i){ selOrig.push(answerState.shuffledOpts[i].i); });
    credit = scoreExercise(sel, answerState.correct);
    answerState.shuffledOpts.forEach(function(o,i){
      if(o.ok){ items.push({label:o.t, state: sel.indexOf(i)>=0?'ok':'missed', why:o.why||''}); }
      else if(sel.indexOf(i)>=0){ items.push({label:o.t, state:'wrong', why:o.why||''}); }
    });
  } else if(ex.type==='match'){
    var H=0,W=0;
    ex.pairs.forEach(function(p,i){
      var slot=$('slot'+i); var chip=slot? slot.querySelector('.chip'):null;
      var ri = chip? parseInt(chip.dataset.ri,10) : null;
      if(ri===i){ H++; items.push({label:p.l+' → '+p.r, state:'ok', why:p.why||''}); }
      else if(ri!=null){ W++; items.push({label:p.l+' → '+answerState.shuffledRights.filter(function(r){return r.i===ri;})[0].t, state:'wrong', why:p.why||''}); }
      else { items.push({label:p.l+' → '+p.r, state:'missed', why:p.why||''}); }
    });
    credit = Math.max(0,(H-W)/ex.pairs.length);
  } else if(ex.type==='drag'){
    var H2=0,W2=0;
    answerState.shuffledChips.forEach(function(c){
      var zoneId = answerState.placed[c.i];
      var ch = ex.chips[c.i];
      if(zoneId===ch.z){ H2++; items.push({label:c.t+' → '+zoneLabel(ex,ch.z), state:'ok', why:ch.why||''}); }
      else if(zoneId!=null){ W2++; items.push({label:c.t+' → '+zoneLabel(ex,zoneId), state:'wrong', why:ch.why||''}); }
      else { items.push({label:c.t+' → '+zoneLabel(ex,ch.z), state:'missed', why:ch.why||''}); }
    });
    credit = Math.max(0,(H2-W2)/ex.chips.length);
  } else if(ex.type==='order'){
    var H3=0,W3=0;
    answerState.curOrder.forEach(function(o,pos){
      if(o.i===pos){ H3++; items.push({label:'Position '+(pos+1)+': '+o.t, state:'ok', why:ex.items[pos].why||''}); }
      else { W3++; items.push({label:'Position '+(pos+1)+': '+o.t+' (correct: '+ex.items[pos].t+')', state: o.i===pos?'ok':'wrong', why:ex.items[pos].why||''}); }
    });
    credit = Math.max(0,(H3-W3)/ex.items.length);
  } else if(ex.type==='fib'){
    var H4=0,W4=0;
    Object.keys(ex.ans).forEach(function(k){
      var b=parseInt(k,10); var got=answerState.placed[k];
      if(got===ex.ans[k]){ H4++; items.push({label:'Blank '+(k)+': '+ex.ans[k], state:'ok', why:ex.why&&ex.why[k]?ex.why[k]:''}); }
      else if(got){ W4++; items.push({label:'Blank '+(k)+': '+got+' (correct: '+ex.ans[k]+')', state:'wrong', why:ex.why&&ex.why[k]?ex.why[k]:''}); }
      else { items.push({label:'Blank '+(k)+': '+ex.ans[k], state:'missed', why:ex.why&&ex.why[k]?ex.why[k]:''}); }
    });
    credit = Math.max(0,(H4-W4)/ex.blankCount);
  } else if(ex.type==='clickline'){
    var selL=answerState.selected;
    credit = scoreExercise(selL, answerState.correct);
    ex.lines.forEach(function(l,i){
      if(lineOk(l)){ items.push({label:shortLine(lineText(l)), state: selL.indexOf(i)>=0?'ok':'missed', why:lineWhy(l)}); }
      else if(selL.indexOf(i)>=0){ items.push({label:shortLine(lineText(l)), state:'wrong', why:lineWhy(l)}); }
    });
  } else if(ex.type==='triage'){
    var H5=0,W5=0;
    ex.items.forEach(function(it,i){
      var v=answerState.placed[i];
      if(v===it.ok){ H5++; items.push({label:it.t+' → '+ex.opts[it.ok], state:'ok', why:it.why||''}); }
      else if(v!=null){ W5++; items.push({label:it.t+' → '+ex.opts[v]+' (correct: '+ex.opts[it.ok]+')', state:'wrong', why:it.why||''}); }
      else { items.push({label:it.t+' → '+ex.opts[it.ok], state:'missed', why:it.why||''}); }
    });
    credit = Math.max(0,(H5-W5)/ex.items.length);
  } else if(ex.type==='branch'){
    var H6=0,W6=0;
    ex.steps.forEach(function(st,i){
      var chosen=answerState.confirmedSteps[i];
      var okIdx=-1; st.opts.forEach(function(o,j){ if(o.ok) okIdx=j; });
      var chosenT = chosen!=null? st.opts[chosen].t : '(no answer)';
      if(chosen===okIdx){ H6++; items.push({label:'Step '+(i+1)+': '+chosenT, state:'ok', why:st.opts[okIdx].why||''}); }
      else { W6++; items.push({label:'Step '+(i+1)+': '+chosenT+' (correct: '+st.opts[okIdx].t+')', state: chosen!=null?'wrong':'missed', why:st.opts[okIdx].why||''}); }
    });
    credit = Math.max(0,(H6-W6)/ex.steps.length);
  }
  if(S.usedHints[ex.idx]) credit = Math.max(0, credit-0.10);
  credit = Math.round(credit*10000)/10000;
  S.answers[ex.idx] = {credit:credit, items:items, answered:true, hintUsed:!!S.usedHints[ex.idx], selOrig:selOrig, type:ex.type};
  /* lock controls */
  var cb=$('btnCheck'); if(cb) cb.disabled=true;
  var sk=$('btnSkip'); if(sk) sk.disabled=true;
  var hb=$('btnHint'); if(hb) hb.disabled=true;
  var nb=$('btnNext'); if(nb){ nb.classList.remove('hidden');
    var lastNow = lastPendingIndex()<0 && S.skipped.length===0;
    nb.textContent = lastNow ? 'Final Submit ▶' : 'Next ▶';
  }
  /* disallow edits */
  Array.prototype.forEach.call(document.querySelectorAll('#ansBody button, #ansBody select'),function(x){ x.disabled=true; });
  renderFeedback(ex, S.answers[ex.idx], false);
  refreshLiveScore();
  var fb=$('fbBlock'); if(fb){ fb.setAttribute('tabindex','-1'); fb.focus(); }
}
function shortLine(t){ t=String(t); return t.length>64? t.slice(0,64)+'…' : t; }
function zoneLabel(ex,zid){ var z=ex.zones.filter(function(z){return z.id===zid;})[0]; return z? z.label : zid; }

function renderFeedback(ex, ans, restoring){
  var old=$('fbBlock'); if(old) old.remove();
  var fb = el('div','fb'); fb.id='fbBlock'; fb.setAttribute('role','status'); fb.setAttribute('aria-live','polite');
  var label, cls;
  if(ans.credit>=1){ label='✓ CORRECT'; cls='good'; }
  else if(ans.credit>0){ label='✓ PARTIALLY CORRECT'; cls='part'; }
  else { label='✗ INCORRECT'; cls='bad'; }
  fb.className='fb '+cls;
  var single = (ex.type==='qcm' || (ex.type==='clickline' && !ex.multi)); /* single-answer: label + explanation only */
  var multi = !single && ans.items && ans.items.length>0;
  var n=ans.items? ans.items.filter(function(i){return i.state==='ok';}).length : 0;
  var N=ans.items? ans.items.length : 0;
  var creditLine = multi? '<span class="fb-credit">credit '+ans.credit.toFixed(2)+' — '+n+'/'+N+' items'+(ans.hintUsed?' (includes −0.10 hint)':'')+'</span>'
                        : (ans.hintUsed? '<span class="fb-credit">hint used (−0.10)</span>':'');
  fb.innerHTML = '<div class="fb-h">'+label+' '+creditLine+'</div>';
  if(multi){
    var ul = el('ul','fb-items');
    ans.items.forEach(function(it){
      var icon = it.state==='ok'? '<span class="fi-ok">✓ Correct</span>' : it.state==='wrong'? '<span class="fi-wrong">✗ Wrong</span>' : '<span class="fi-miss">○ Missed</span>';
      var li = el('li', null, '<span>'+icon+'</span><span><strong>'+esc(it.label)+'</strong>'+(it.why? ' — '+esc(it.why):'')+'</span>');
      ul.appendChild(li);
    });
    fb.appendChild(ul);
  }
  var exEl = el('div','explain', '<strong>Why:</strong> '+ex.explanation);
  fb.appendChild(exEl);
  if(ex.persp){ var p=el('div','explain','<strong>Red side / blue side:</strong> '+ex.persp); fb.appendChild(p); }
  if(ex.study){ var st=el('div','study','<strong>What to study:</strong> '+ex.study); fb.appendChild(st); }
  var card=$('answerRoot');
  if(card){ card.appendChild(fb); }
}
function onNextAfterCheck(ex){
  var a=S.answers[ex.idx];
  if(!a || !a.answered) return;
  /* Next (or Final Submit) transitions PAUSED_AUTO_CHECK -> RUNNING (or ENDED at results) */
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ timerSetState('RUNNING'); }
  if(S.fromReview){
    S.fromReview=false;
    /* return to review if more skipped remain, else results */
    if(S.skipped.length>0){ openReview(); } else { renderResults(false); }
    return;
  }
  var k=lastPendingIndex();
  var isLast = (k<0);
  if(isLast && S.skipped.length===0){ renderResults(false); return; }
  if(isLast && S.skipped.length>0){ openReview(); return; }
  advance();
}

/* ---------- review skipped ---------- */
function openReview(){
  S.screen='review';
  S.fromReview=false;
  var body = el('div');
  body.innerHTML = headerHTML();
  var panel = el('div','panel');
  var list = S.skipped.slice();
  var inner = '<h2>⤺ Review skipped exercises</h2>';
  if(S.timer.state==='ENDED'){ inner += '<p class="small">The timer has ended. You can no longer answer skipped exercises.</p>'; }
  else { inner += '<p>You skipped '+list.length+' exercise(s). You can answer them now — as many times as you like — until the timer ends, or submit the exam. Skipped exercises that stay unanswered are excluded from your score.</p>'; }
  if(list.length===0){ inner += '<p>No skipped exercises left. Well done — you answered everything.</p>'; }
  panel.innerHTML = inner;
  list.forEach(function(i){
    var ex=D.exercises[i];
    var row = el('div','rev-item');
    row.innerHTML = '<span class="rt"><strong>'+esc(ex.title)+'</strong> — '+esc(ex.summary||'')+'</span>';
    var b = el('button','btn','Answer now'); b.type='button';
    if(S.timer.state==='ENDED') b.disabled=true;
    b.addEventListener('click', function(){
      S.fromReview=true;
      var p=S.skipped.indexOf(i); if(p>=0) S.skipped.splice(p,1);
      S.idx = S.order.indexOf(i);
      renderExamScreen();
    });
    row.appendChild(b); panel.appendChild(row);
  });
  var sub = el('button','btn pri','Submit final results ▶'); sub.type='button'; sub.id='btnFinal';
  sub.addEventListener('click', function(){ renderResults(false); });
  panel.appendChild(sub);
  body.appendChild(panel);
  app.innerHTML=''; app.appendChild(body);
  bindHeaderButtons();
  window.scrollTo(0,0);
}

/* ---------- results ---------- */
function computeResults(){
  var sum=0, answered=0, full=0, part=0, partSum=0, wrong=0, skippedUnanswered=0;
  D.exercises.forEach(function(_,i){
    var a=S.answers[i];
    if(a && a.answered){
      answered++; sum+=a.credit;
      if(a.credit>=1) full++;
      else if(a.credit>0){ part++; partSum+=a.credit; }
      else wrong++;
    } else skippedUnanswered++;
  });
  var pct = answered>0? Math.round((sum/answered)*100) : 0;
  return {sum:sum, answered:answered, full:full, part:part, partAvg: part>0? partSum/part : 0, wrong:wrong, skipped:skippedUnanswered, pct:pct};
}
function renderResults(fromTimeout){
  S.screen='results';
  clearInterval(S.timer.tick);
  if(S.timer.state!=='ENDED') timerSetState('ENDED');
  var r = computeResults();
  var passed = r.pct >= D.meta.passMark;
  var body = el('div');
  body.innerHTML = headerHTML();
  var panel = el('div','panel');
  var title = fromTimeout? '⏹ Time ended — final results' : '🏁 Final results';
  panel.innerHTML = '<h2>'+title+'</h2>'
    + '<p class="sub">'+esc(D.title)+'</p>'
    + '<div class="resgrid">'
    + '<div class="rescard"><div class="n">'+round1(r.sum)+' / '+r.answered+'</div>score (answered only)</div>'
    + '<div class="rescard"><div class="n">'+r.pct+'%</div>percentage</div>'
    + '<div class="rescard"><div class="n">'+D.meta.passMark+'%</div>pass mark</div>'
    + '</div>'
    + '<div class="resgrid">'
    + '<div class="rescard"><div class="n">'+r.full+'</div>fully correct</div>'
    + '<div class="rescard"><div class="n">'+r.part+'</div>partially correct'+(r.part>0? '<div class="small">avg '+r.partAvg.toFixed(2)+'</div>':'')+'</div>'
    + '<div class="rescard"><div class="n">'+r.wrong+'</div>incorrect</div>'
    + '<div class="rescard"><div class="n">'+r.skipped+'</div>skipped — excluded</div>'
    + '</div>'
    + '<p class="small">Pause report: manual break total '+fmtClock(S.pauseAcc.manual)+' — feedback review total '+fmtClock(S.pauseAcc.feedback)+'.</p>';
  if(passed){
    var cert = el('div','cert');
    cert.innerHTML = '<h2>🏆 PASS — Certificate of Achievement</h2>'
      + '<p style="font-size:17px;margin:6px 0">'+(S.user.name? '<strong>'+esc(S.user.name)+'</strong> has':'You have')+' successfully passed the</p>'
      + '<p style="font-weight:800;font-size:19px;margin:4px 0">'+esc(D.title)+'</p>'
      + '<p>Score: <strong>'+r.pct+'%</strong> — Threshold: '+D.meta.passMark+'% — Tier: <strong>'+esc(D.sev.label)+'</strong></p>'
      + '<p class="small">MITRE ATT&CK® object: '+esc(D.meta.mitreId)+' '+esc(D.meta.objectName)+' (Mitigation). Keep practising the next tier!</p>';
    panel.appendChild(cert);
  } else {
    var fail = el('div','failbox');
    fail.innerHTML = '<h2 style="margin-top:0">✗ FAIL — '+r.pct+'% (need '+D.meta.passMark+'%)</h2>'
      + '<p>You must retake this exam. Review the feedback from each exercise, then try again.</p>';
    panel.appendChild(fail);
  }
  var again = el('button','btn pri','↻ Retake Exam'); again.type='button';
  again.addEventListener('click', function(){ startExam(); });
  panel.appendChild(again);
  body.appendChild(panel);
  app.innerHTML=''; app.appendChild(body);
  window.scrollTo(0,0);
  reportScore(r);
}
function reportScore(r){
  if(S.reported) return;
  S.reported=true;
  var score = Math.round(r.sum);
  var total = r.answered;
  var percent = r.pct;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:score,
      total:total,
      percent:percent,
      passed: percent >= D.meta.passMark
    }, location.origin);
  } catch(e) { /* opened directly, nothing to report to */ }
}

/* ---------- site handshake (optional; never required) ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try {
    S.user.name = event.data.username || '';
    S.user.country = event.data.country || '';
    S.user.theme = event.data.theme || '';
    S.user.locale = event.data.locale || '';
    if(S.screen==='intro'){ renderIntro(); }
  } catch(e){}
});

/* ---------- boot ---------- */
renderScreen();
})();

</script>
</body>
</html>
