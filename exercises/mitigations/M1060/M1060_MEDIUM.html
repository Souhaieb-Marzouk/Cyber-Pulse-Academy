<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>M1060 — MEDIUM practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{

  "batch": 2,

  "passMark": 70
}
</script>
<style>

:root {
  --bg-page: #0b1020;
  --bg-surface: #121a2e;
  --bg-surface-2: #0f1729;
  --border: #243049;
  --text-primary: #e6ecff;
  --text-secondary: #a9b4d0;
  --text-mono: #c8ffd4;
  --accent-blue: #5aa9ff;
  --accent-amber: #ffb454;
  --accent-green: #57d38c;
  --state-correct: #57d38c;
  --state-partial: #ffb454;
  --state-incorrect: #ff6b6b;
  --state-skipped: #a9b4d0;
  --state-paused: #9d7bff;
  --sev-easy: #57d38c;
  --sev-medium: #ffb454;
  --sev-hard: #ff8a3d;
  --sev-extreme: #ff6b6b;
  /* derived dark-theme roles (defined once, consumed everywhere) */
  --bg-topbar: #0d1326;
  --bg-hover-btn: #18213a;
  --border-hover-btn: #33415f;
  --bg-hover-opt: #141d36;
  --bg-chip: #16203a;
  --on-primary: #06220f;
  --on-amber: #2a1a02;
  --syn-ts: #8fa3c8;
  --syn-ip: #7fd4ff;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-page);
  color: var(--text-primary);
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
code, pre, .mono, .log-line, .term-input, .timer-val {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-size: 14.5px;
}
.view { display: none; padding: 0 0 48px 0; }
.view.active { display: block; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 18px; }

/* ---------- cards & shared ---------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  padding: 18px 20px;
  margin: 16px 0;
}
.card h2, .card h3 { margin-top: 0; }
.sec-title {
  font-size: 19px;
  margin: 0 0 10px 0;
  letter-spacing: 0.2px;
}
.muted { color: var(--text-secondary); }
.small { font-size: 13.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 600;
  font-size: 13.5px;
  background: var(--bg-surface-2);
  color: var(--text-primary);
  white-space: nowrap;
}
.badge.sev { border-width: 2px; background: transparent; }
button {
  font: inherit;
  color: var(--text-primary);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  min-height: 44px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-hover-btn); border-color: var(--border-hover-btn); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: var(--on-primary);
  font-weight: 700;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.amberbtn {
  background: var(--accent-amber);
  border-color: var(--accent-amber);
  color: var(--on-amber);
  font-weight: 700;
}
button:focus-visible, .opt:focus-visible, .chip:focus-visible, .blank:focus-visible,
.zone:focus-visible, select:focus-visible, input:focus-visible, .spot-line:focus-visible {
  outline: 3px solid var(--accent-blue);
  outline-offset: 2px;
}
a, .linkish { color: var(--accent-blue); }

/* ---------- intro ---------- */
.intro-head { margin-top: 18px; }
.intro-head h1 { margin: 0 0 6px 0; font-size: 26px; line-height: 1.25; }
.factrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.fact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 120px;
}
.fact .k { color: var(--text-secondary); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; }
.fact .v { font-weight: 700; font-size: 15.5px; }
.learn p { margin: 8px 0; }
.kw-theme {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 10px 14px;
  margin: 10px 0;
}
.kw-theme .kw-name { font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; }
.kw-theme ul { margin: 4px 0 2px 0; padding-left: 20px; }
.kw-theme li { margin: 3px 0; }
.rules li { margin: 6px 0; }
.startrow { text-align: center; margin-top: 18px; }
.startrow button { font-size: 18px; padding: 14px 42px; }

/* ---------- sticky exam header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 8px 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
.topbar .topic { font-weight: 700; font-size: 14.5px; }
.topbar .spacer { flex: 1 1 0; }
.topbar button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.timerbox { display: inline-flex; align-items: center; gap: 8px; }
.timer-val { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.timer-state { font-size: 12.5px; font-weight: 700; }
.scorebox { font-size: 14.5px; color: var(--text-secondary); }
.scorebox b { color: var(--text-primary); font-size: 16px; }
.progresswrap {
  max-width: 1080px; margin: 0 auto; height: 5px;
  background: var(--bg-surface-2);
  border-radius: 0 0 3px 3px; overflow: hidden;
}
.progressbar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sev-current, var(--accent-blue)), var(--accent-blue));
  position: relative;
  transition: width 0.3s ease;
}
.progressbar::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(230,236,255,0.25) 50%, transparent 70%);
  animation: sheen 2.8s linear infinite;
}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- exercise blocks ---------- */
.block {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  margin: 14px 0;
  overflow: hidden;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; letter-spacing: 1.2px; font-size: 13px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface-2);
}
.block-scenario { border-left-color: var(--accent-blue); }
.block-scenario .block-head { color: var(--accent-blue); }
.block-question { border-left-color: var(--accent-amber); }
.block-question .block-head { color: var(--accent-amber); }
.block-answer { border-left-color: var(--accent-green); }
.block-answer .block-head { color: var(--accent-green); }
.block-body { padding: 14px 18px; }
.q-text { font-weight: 700; font-size: 16.5px; margin: 0; }
.collapse-btn {
  margin-left: auto; min-height: 30px; padding: 2px 10px; font-size: 12.5px;
  background: transparent; border: 1px solid var(--border);
}
.scen-summary { color: var(--text-secondary); font-size: 13px; padding: 6px 16px; display: none; }

/* artefact panels */
.artefact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 10px 0;
  overflow: hidden;
}
.artefact .art-label {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; letter-spacing: 0.8px;
  color: var(--accent-blue);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(90,169,255,0.06);
  text-transform: uppercase;
}
.artefact .art-body { padding: 10px 12px; }
.artefact p { margin: 6px 0; }

/* logs */
.logbox { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.logfilter { margin: 8px 0; }
.logfilter input {
  width: 100%; padding: 9px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary);
}
.log-line { padding: 3px 6px; white-space: pre-wrap; word-break: break-word; margin: 1px 0; border-radius: 3px; }
.log-line.logmark { background: rgba(255,180,84,0.10); }
.lg-ts { color: var(--syn-ts); }
.lg-key { color: var(--accent-amber); }
.lg-str { color: var(--text-mono); }
.lg-ok { color: var(--state-correct); }
.lg-bad { color: var(--state-incorrect); }
.lg-ip { color: var(--syn-ip); }
.lg-dim { color: var(--text-secondary); }

/* options */
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  min-height: 44px;
}
.opt:hover { background: var(--bg-hover-opt); }
.opt .opt-label { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.opt.selected { border-left: 4px solid var(--accent-green); background: rgba(87,211,140,0.07); box-shadow: 0 0 0 1px rgba(87,211,140,0.25); }
.opt.selected .selmark { color: var(--accent-green); font-weight: 700; margin-left: auto; font-size: 13px; }
.opt.sel-incorrect { border-left-color: var(--state-incorrect); }
.opt.sel-correct { border-left-color: var(--state-correct); }
.opt.opt-correct-reveal { border-left: 4px solid var(--state-correct); }
.opt.disabled { cursor: default; }

/* matching */
.matchrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.matchrow .mleft {
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; min-height: 44px;
}
.matchrow select {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--bg-page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
}

/* drag & drop */
.dnd-grid { display: grid; gap: 14px; }
.bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  background: var(--bg-surface-2);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 52px;
}
.chip {
  background: var(--bg-chip);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-height: 44px;
  cursor: grab;
  user-select: none;
  display: inline-flex; align-items: center;
}
.chip.armed { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(87,211,140,0.3); }
.chip.used { opacity: 0.35; cursor: default; }
.zones { display: grid; gap: 10px; }
.zones.cols2 { grid-template-columns: 1fr 1fr; }
.zones.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.zone {
  background: var(--bg-page);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 74px;
  cursor: pointer;
}
.zone h4 { margin: 0 0 6px 0; font-size: 13.5px; color: var(--accent-amber); }
.zone .zdrop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.zone.dragover { border-color: var(--accent-green); background: rgba(87,211,140,0.05); }
.zone .chip { cursor: pointer; }

/* ordering */
.orderlist { display: grid; gap: 8px; }
.orderitem {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 48px;
  cursor: grab;
}
.orderitem .pos { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.orderitem .updown { margin-left: auto; display: flex; gap: 4px; }
.orderitem .updown button { min-height: 34px; padding: 2px 10px; }
.orderitem.dragging { opacity: 0.5; }
.orderitem.dragover { border-color: var(--accent-green); }

/* fill blanks */
.filltext { font-size: 16.5px; line-height: 2.1; }
.blank {
  display: inline-block;
  min-width: 120px; min-height: 40px;
  background: var(--bg-surface-2);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  text-align: center;
  cursor: pointer;
  color: var(--text-primary);
}
.blank.armed { border-color: var(--accent-green); }
.blank.filled { border-style: solid; color: var(--text-mono); }
.blank.n1 { min-width: 90px; }
.chipbank { margin-top: 12px; }

/* spot the mistake */
.spotwrap { display: grid; gap: 6px; }
.spot-line {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer; min-height: 44px;
}
.spot-line .ln { color: var(--text-secondary); min-width: 34px; }
.spot-line.selected { border-left: 4px solid var(--accent-amber); background: rgba(255,180,84,0.06); }
.spot-line code { color: var(--text-mono); }

/* terminal */
.term {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.term-scroll {
  min-height: 90px; max-height: 240px; overflow-y: auto;
  margin-bottom: 10px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-prompt { color: var(--accent-green); font-weight: 700; }
.term-echo { color: var(--text-primary); }
.term-out { color: var(--text-mono); }
.term-row { display: flex; gap: 8px; align-items: center; }
.term-row .term-prompt { flex: 0 0 auto; }
.term-input {
  flex: 1; background: var(--bg-page); color: var(--text-mono);
  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
}
.extimer { color: var(--state-paused); font-weight: 700; font-size: 13.5px; }

/* triage / steps */
.stepflag {
  display: inline-block;
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: var(--accent-amber);
  border: 1px solid var(--accent-amber);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.triage-step { margin-bottom: 4px; }

/* hint + feedback */
.hintpanel {
  border: 1px solid var(--accent-amber);
  border-left-width: 4px;
  border-radius: 8px;
  background: rgba(255,180,84,0.06);
  padding: 10px 14px;
  margin: 12px 0;
  display: none;
}
.hintpanel .hint-head { color: var(--accent-amber); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.feedback { display: none; }
.fb-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-weight: 800; font-size: 15px; letter-spacing: 0.8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.fb-correct { color: var(--state-correct); }
.fb-partial { color: var(--state-partial); }
.fb-incorrect { color: var(--state-incorrect); }
.fb-excluded { color: var(--state-skipped); }
.credit-pill {
  border: 1px solid var(--border);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 13px;
  font-weight: 700;
}
.itemrows { display: grid; gap: 6px; margin: 10px 0; }
.itemrow {
  display: flex; gap: 10px; align-items: baseline;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 8px 12px;
}
.itemrow .ic { font-weight: 800; min-width: 110px; }
.itemrow.ir-ok .ic { color: var(--state-correct); }
.itemrow.ir-wrong .ic { color: var(--state-incorrect); }
.itemrow.ir-missed .ic { color: var(--state-skipped); }
.canon { margin: 10px 0; }
.canon code {
  display: block; background: var(--bg-page);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-mono);
  padding: 10px 12px;
  overflow-x: auto;
  cursor: pointer;
}
.danger-note { color: var(--state-incorrect); font-weight: 700; }
.navrow { display: flex; gap: 10px; margin: 16px 0 30px 0; flex-wrap: wrap; }
.navrow .spacer { flex: 1; }

/* pause overlay */
.pauseveil {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(11,16,32,0.93);
  display: none;
  align-items: center; justify-content: center;
}
.pauseveil.active { display: flex; }
.pausecard {
  text-align: center;
  background: var(--bg-surface);
  border: 2px solid var(--state-paused);
  border-radius: 10px;
  padding: 30px 40px;
  max-width: 460px;
}
.pausecard .big { font-size: 40px; color: var(--state-paused); }
.pausecard h3 { color: var(--state-paused); margin: 8px 0; }

/* review skipped */
.revlist { display: grid; gap: 8px; }
.revitem {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--state-skipped);
  border-radius: 6px;
  padding: 10px 14px;
}
.revitem .rev-ic { color: var(--state-skipped); font-weight: 800; }
.revitem button { margin-left: auto; min-height: 38px; }

/* results */
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.res-cell {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.res-cell .num { font-size: 26px; font-weight: 800; }
.res-cell.c-ok .num { color: var(--state-correct); }
.res-cell.c-part .num { color: var(--state-partial); }
.res-cell.c-bad .num { color: var(--state-incorrect); }
.res-cell.c-skip .num { color: var(--state-skipped); }
.verdict {
  border-radius: 8px;
  border: 2px solid;
  padding: 18px 20px;
  margin: 14px 0;
  text-align: center;
}
.verdict.pass { border-color: var(--state-correct); background: rgba(87,211,140,0.07); }
.verdict.fail { border-color: var(--state-incorrect); background: rgba(255,107,107,0.07); }
.verdict .v-big { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
.verdict.pass .v-big { color: var(--state-correct); }
.verdict.fail .v-big { color: var(--state-incorrect); }

@media (max-width: 760px) {
  .res-grid { grid-template-columns: 1fr; }
  .zones.cols2, .zones.cols3 { grid-template-columns: 1fr; }
  .matchrow { grid-template-columns: 1fr; }
  .topbar-inner { gap: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .progressbar::after { animation: none; display: none; }
  * { transition: none !important; }
}

</style>
</head>
<body>
<section id="view-intro" class="view active">
  <div class="wrap" id="intro-body"></div>
</section>

<section id="view-exam" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topic" id="hdr-topic"></span>
      <span class="badge sev" id="hdr-sev"></span>
      <span class="badge" id="hdr-count"></span>
      <span class="timerbox" id="hdr-timer"></span>
      <span class="spacer"></span>
      <span class="scorebox" id="hdr-score"></span>
      <button id="hint-btn" title="Hint (costs 10% of this exercise's credit)">💡 Hint</button>
      <button id="pause-btn" title="Pause the exam and hide the exercise">⏸ Pause</button>
      <button id="skip-btn" title="Skip and answer later">⏭ Skip</button>
      <span class="badge" id="hdr-user" aria-hidden="true"></span>
    </div>
  </div>
  <div class="progresswrap"><div class="progressbar" id="prog-fill"></div></div>
  <div class="wrap">
    <div id="exam-body"></div>
    <div id="hint-panel" class="hintpanel" role="note"></div>
    <div id="check-nudge" class="small" style="display:none;color:var(--state-incorrect);font-weight:700">⚠ Choose an answer first — or press Skip to come back later.</div>
    <div class="block feedback" id="feedback-block">
      <div class="fb-head" id="fb-head"></div>
      <div class="block-body" id="fb-body"></div>
    </div>
    <div class="navrow">
      <button id="check-btn" class="primary">✓ Check</button>
      <button id="next-btn" disabled>Next →</button>
      <span class="spacer"></span>
    </div>
  </div>
  <div class="pauseveil" id="pause-veil" role="dialog" aria-label="Exam paused">
    <div class="pausecard">
      <div class="big">⏸</div>

var DATA = {"topicId": "m1060", "batch": 2, "difficulty": "medium", "severityWord": "MEDIUM", "sevIcon": "▲", "shortName": "Out-of-Band Communications Channel", "metaTitle": "M1060 Out-of-Band Communications Channel — MEDIUM", "mitreId": "M1060", "timerMinutes": 35, "estimatedMinutes": 35, "passMark": 70, "learnTitle": "What you will learn here", "kwTitle": "Keywords covered in this exam", "howTitle": "How this exam works", "howHTML": "<p>This file trains the <b>MEDIUM<\/b> level: every exercise combines two connected ideas — for example, recognise the behaviour <b>and<\/b> choose the matching M1060 mechanism.<\/p>", "howExtra": "", "typesUsed": ["log reading", "matching", "multiple choice (single answer)", "multi-select with partial credit", "drag &amp; drop", "scenario steps", "fill-in-the-blank", "ordering", "spot the mistake"], "learnHTML": "\n<p>You already know that <b>M1060 — Out-of-Band Communications Channel<\/b> is a <b>Mitigation<\/b> in MITRE ATT&amp;CK (attack.mitre.org/mitigations/M1060). This file goes one level deeper. You will connect the mitigation to the exact techniques it addresses, and learn where it stops.<\/p>\n<p>The page addresses seven technique entries: <b>T1213<\/b> and its sub-technique <b>T1213.005 Messaging Applications<\/b>, the email family <b>T1114<\/b> with sub-techniques <b>.001 Local Email Collection<\/b>, <b>.002 Remote Email Collection<\/b>, and <b>.003 Email Forwarding Rule<\/b>, plus <b>T1489 Service Stop<\/b>. T1213 and T1114 belong to the <b>Collection<\/b> tactic; T1489 belongs to <b>Impact<\/b>.<\/p>\n<p>Three mechanisms do the work: <b>plan<\/b> an OOB channel instead of in-network chat or email; <b>verify<\/b> critical actions (password resets, financial transactions, access requests) through it; and <b>alert<\/b> the security team about unusual email activity — mass forwarding or large attachments — on it.<\/p>\n<p>You will also learn the limits. A channel is only out-of-band if it is truly <b>independent<\/b> of the compromised environment: a chat app that logs in through a compromised identity system is not out-of-band, and SMS verification stops being OOB when the attacker redirects the phone number. At work, detection engineers route the alerts, IAM teams own the identity dependency, GRC analysts map the control to frameworks such as <b>NIST SP 800-53<\/b> (cited on the page), and IR teams test everything with tabletop exercises.<\/p>\n", "keywords": [{"theme": "Techniques & tactics mapping", "items": ["T1213 / T1213.005 — repositories and messaging apps (Collection)", "T1114 / .001 / .002 / .003 — the email collection family (Collection)", "T1489 — Service Stop (Impact)", "The Use-column guidance per technique"]}, {"theme": "The three mechanisms in depth", "items": ["OOB channel plans instead of in-network chat or email", "OOB verification of password resets, payments, access requests", "OOB alerts for mass forwarding and large attachments", "Alert routing on a path attackers cannot read or block"]}, {"theme": "Independence & limitations", "items": ["A channel is OOB only if independent of compromised infrastructure", "Identity dependency through a compromised SSO/IdP", "SIM swap redirects SMS-based verification", "Does not stop initial access or post-session credential theft"]}, {"theme": "Operations & framework mapping", "items": ["Tabletop testing and validation of the OOB channel", "OOB contact tree and activation criteria", "NIST SP 800-53 mapping (cited on the M1060 page)"]}], "exercises": [{"id": "M01", "type": "log", "summary": "Morning telemetry at Corvus Freight", "scenario": "<p>Monday, 09:40. The Corvus Freight SOC reviews the overnight mail audit trail.<\/p>", "question": "Which two M1060 mechanisms should this telemetry have triggered?", "hint": "One artefact screams &quot;unusual email activity&quot;. The other is a critical action requested by email.", "logLines": ["<span class=\"lg-ts\">2026-03-09 09:12:04Z<\/span> <span class=\"lg-key\">AUDIT<\/span> mailbox=ceo-assistant@corvusfreight.example action=<span class=\"lg-str\">New-InboxRule<\/span> rule=<span class=\"lg-bad\">\"RSS Feeds\"<\/span> forward_to=<span class=\"lg-bad\">archive-mx31@palegrain.example<\/span>", "<span class=\"lg-ts\">2026-03-09 09:14:41Z<\/span> <span class=\"lg-key\">AUDIT<\/span> mailbox=ceo-assistant@corvusfreight.example action=<span class=\"lg-str\">Set-Mailbox<\/span> <span class=\"lg-dim\">ForwardingSmtpAddress=<\/span><span class=\"lg-bad\">archive-mx31@palegrain.example<\/span>", "<span class=\"lg-ts\">2026-03-09 09:31:10Z<\/span> <span class=\"lg-key\">MAIL<\/span> <span class=\"lg-dim\">attachments=14 total=118MB direction=outbound to=<\/span><span class=\"lg-bad\">files@palegrain.example<\/span> <span class=\"lg-dim\">user=ceo-assistant<\/span>", "<span class=\"lg-ts\">2026-03-09 09:38:52Z<\/span> <span class=\"lg-key\">MAIL<\/span> from=<span class=\"lg-str\">cfo@corvusfreight.example<\/span> to=<span class=\"lg-str\">finance-team@corvusfreight.example<\/span> subject=<span class=\"lg-bad\">\"APPROVE: supplier payment details change — Palegrain Ltd\"<\/span>"], "widget": {"id": "M01w", "type": "multi", "summary": "", "scenario": "", "question": "Select the two M1060 mechanisms this telemetry should trigger.", "hint": "", "options": ["An OOB alert to the security team about the unusual email activity", "OOB verification of the payment-change request before anyone approves it", "A nightly backup of the mail server", "A stronger spam filter on the internet gateway"], "answers": [0, 1], "why": ["Correct — mass forwarding and large outbound attachments are exactly the unusual email activities the page says to alert on, out-of-band.", "Correct — the payment change arrived by email from a possibly compromised mailbox. The page says to verify financial transactions out-of-band before approval.", "Wrong — backups protect data, but they neither detect the forwarding rule nor verify the payment request.", "Wrong — the forwarding rule works from inside the mailbox. Spam filtering does not see or stop it."], "explanation": ""}, "explanation": "<p>Two mechanisms of M1060 apply at once. The forwarding rule plus the 118 MB outbound send is the <b>&quot;unusual email activities, such as mass forwarding or large attachments being sent&quot;<\/b> pattern from the page — that demands an <b>OOB alert<\/b>. The payment-change email from the CFO mailbox is a <b>critical action initiated via email<\/b>, which demands <b>OOB verification<\/b> before approval. The combination (collection setup + payment fraud) is a classic email-compromise pattern.<\/p>", "idx": 0}, {"id": "M02", "type": "match", "summary": "Match the Use-column guidance to its technique", "scenario": "<p>A GRC analyst at Meridian Health maps the M1060 page to the techniques it addresses. She extracts one guidance sentence per row of the technique table.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Extracted guidance sentences<\/div><div class=\"art-body\"><p>1. &quot;Create plans for leveraging a secure OOB channel, rather than existing in-network chat applications, in case of a security incident.&quot;<\/p><p>2. &quot;Implement secure OOB channels to use as an alternative to in-network chat during a security incident.&quot;<\/p><p>3. &quot;Set up OOB alerts to notify security teams of unusual local email activities, such as mass forwarding.&quot;<\/p><p>4. &quot;Use secure OOB authentication methods to verify critical actions initiated via email, such as password resets or financial transactions.&quot;<\/p><p>5. &quot;Develop and enforce security policies that include the use of OOB channels for critical communications during a security incident.&quot;<\/p><\/div><\/div>", "question": "Match each guidance sentence to the technique it addresses.", "hint": "Watch the difference between sentence 1 (planning) and sentence 2 (implementation for chat), and between email alerts (3) and general verification (4).", "pairs": [{"left": "1 — Plans for an OOB channel instead of in-network chat", "right": "T1213 — Data from Information Repositories", "why": "The planning guidance belongs to the parent technique T1213: do not keep incident plans where in-network repositories can be read."}, {"left": "2 — OOB channels as the alternative to in-network chat during incidents", "right": "T1213.005 — Messaging Applications", "why": "This is the chat-specific guidance: implement the OOB alternative for messaging applications."}, {"left": "3 — OOB alerts for unusual local email activity", "right": "T1114.001 — Local Email Collection", "why": "Alerting on mass forwarding and large attachments is the guidance for local email collection."}, {"left": "4 — OOB verification of critical actions requested by email", "right": "T1114 — Email Collection", "why": "Verification of password resets and payments via OOB is the parent-level email guidance."}, {"left": "5 — Policies that include OOB channels for critical communications", "right": "T1489 — Service Stop", "why": "When services stop, only the policy-prepared channel keeps coordination alive — that is the T1489 guidance."}], "explanation": "<p>The Use column of the M1060 page writes a slightly different instruction for each technique: planning (T1213), an implemented chat alternative (T1213.005), OOB alerts (T1114.001, and also .002/.003), OOB verification of critical actions (T1114, .002, .003), and policy (T1489). Mapping guidance to technique is how control owners prove coverage.<\/p>", "idx": 1}, {"id": "M03", "type": "qcm", "summary": "Is the backup chat really out-of-band?", "scenario": "<p>Meridian Health buys a secure chat app for emergencies. It runs on phones, on a separate provider. But staff log into it with the company SSO — the same identity system an attacker has just compromised.<\/p>", "question": "Why does the page's definition make this channel NOT out-of-band right now?", "hint": "Follow the definition: out-of-band = not dependent on the potentially compromised infrastructure. What does the login depend on?", "options": ["Because the app's login depends on the compromised identity system, so the channel is not independent", "Because the app stores its messages on the phone itself", "Because the provider charges a monthly fee per user", "Because the app lacks read receipts for urgent messages"], "answer": 0, "why": ["Correct. Whoever controls the SSO can log into the emergency chat as anyone. The channel depends on compromised infrastructure, so it fails the definition.", "Wrong — where messages are stored does not decide independence. The identity dependency does.", "Wrong — cost has no role in the out-of-band definition.", "Wrong — read receipts are a usability feature, not a security dependency."], "explanation": "<p>M1060 defines OOB as a path <b>not dependent on the potentially compromised primary network infrastructure<\/b>. Independence must hold for the whole chain, including <b>identity<\/b>. A separate app that authenticates through the compromised SSO inherits that compromise: the attacker can log in, read, or impersonate. Real OOB design keeps the channel's identity separate (local accounts on the device, hardware tokens, or a directory the attacker has not touched).<\/p>", "idx": 2}, {"id": "M04", "type": "dnd", "summary": "Place the addressed techniques into their tactics", "scenario": "<p>Detection engineer Rana builds an ATT&CK Navigator view of the techniques M1060 addresses. She needs each one in the right tactic column.<\/p>", "question": "Drag each technique into the tactic where ATT&CK places it.", "hint": "Two techniques are about collecting information. One is about stopping services. One is a rule inside mailboxes that enables collection.", "zones": [{"id": "TA0009", "label": "TA0009 — Collection"}, {"id": "TA0040", "label": "TA0040 — Impact"}], "items": [{"label": "T1213 — Data from Information Repositories", "zone": "TA0009", "why": "T1213 collects data from repositories such as chat platforms and wikis — Collection."}, {"label": "T1114 — Email Collection", "zone": "TA0009", "why": "T1114 reads email content — Collection."}, {"label": "T1114.003 — Email Forwarding Rule", "zone": "TA0009", "why": "The forwarding rule is a sub-technique of email collection: it silently copies mail outward — Collection."}, {"label": "T1489 — Service Stop", "zone": "TA0040", "why": "Stopping services damages availability — Impact."}], "explanation": "<p>The techniques M1060 addresses span two tactics. <b>T1213<\/b> (with .005) and <b>T1114<\/b> (with .001/.002/.003) sit in <b>Collection (TA0009)<\/b>: the adversary gathers information — your chats, email, and plans. <b>T1489<\/b> sits in <b>Impact (TA0040)<\/b>: stopping services to cut coordination. One mitigation, two tactic answers: OOB plans against collection, OOB policy and continuity against impact.<\/p>", "idx": 3}, {"id": "M05", "type": "triage", "summary": "A payment change from the CFO's mailbox", "scenario": "<p>16:55 at Meridian Health. Finance forwards you an email that appears to come from the CFO's mailbox: &quot;Approve the supplier payment details change today.&quot; Mail telemetry shows a new forwarding rule on the CFO's mailbox to an unknown external address.<\/p>", "question": "Handle the two decisions in order.", "hint": "Step 1: what kind of situation is this? Step 2: which verification path still works when the mailbox belongs to the attacker?", "steps": [{"situation": "What is the correct reading of this situation?", "options": [{"text": "A possible email-compromise attack — treat the request as untrusted and verify it out-of-band", "correct": true, "why": "A forwarding rule on the sender's mailbox plus an urgent payment change is the classic compromise pattern. The page says to verify such critical actions out-of-band."}, {"text": "A routine finance request — approve it before the deadline", "correct": false, "why": "The forwarding rule is a red flag that the mailbox may not be under the CFO's control. Approving without verification is exactly what the attacker wants."}, {"text": "A spam email — delete it and move on", "correct": false, "why": "It comes from an internal executive mailbox with a suspicious rule attached. Deleting ignores an active compromise."}]}, {"situation": "Which verification path is valid?", "options": [{"text": "Call the CFO on the number from the OOB contact tree and confirm the request", "correct": true, "why": "The OOB contact tree holds known-good numbers outside the compromised email path. This is out-of-band verification of a financial transaction."}, {"text": "Reply on the same email thread asking for confirmation", "correct": false, "why": "The attacker owns the mailbox. Any reply lands with them; they will happily confirm."}, {"text": "Email the supplier to double-check the new account details", "correct": false, "why": "The supplier conversation may also be watched through the compromised mailbox, and the attacker sent the change in the first place."}]}], "explanation": "<p>M1060 asks for <b>secure out-of-band authentication methods to verify the authenticity of critical actions initiated via email — such as password resets, financial transactions, or access requests<\/b>. When telemetry shows the mailbox is compromised (forwarding rule), every in-band confirmation is worthless: the attacker answers it. The only path that works is one the attacker cannot read or join — the OOB line to a known number.<\/p>", "idx": 4}, {"id": "M06", "type": "multi", "summary": "Where does the page ask for OOB alerts on email activity?", "scenario": "<p>An auditor asks exactly which technique rows of the M1060 page contain the &quot;set up out-of-band alerts&quot; guidance.<\/p>", "question": "Select every technique for which the page's Use column includes OOB alerts about unusual email activity.", "hint": "The alert guidance appears only inside the email family — not for chat repositories, not for Service Stop.", "options": ["T1114.001 — Local Email Collection", "T1114.002 — Remote Email Collection", "T1114.003 — Email Forwarding Rule", "T1213.005 — Messaging Applications", "T1489 — Service Stop"], "answers": [0, 1, 2], "why": ["Correct — .001 is told to alert on unusual local email activities such as mass forwarding or large attachments.", "Correct — .002 combines OOB verification, OOB alerts for unusual email activity, and OOB channel plans.", "Correct — .003 carries the same triple guidance: verification, alerts, and channel plans.", "Wrong — for messaging applications the page asks for an implemented OOB alternative to in-network chat, not email alerts.", "Wrong — for Service Stop the page asks for policies that include OOB channels, not email alerts."], "explanation": "<p>The <b>alert<\/b> mechanism appears in the Use column of the email rows: <b>T1114.001<\/b> explicitly, and <b>T1114.002/.003<\/b> as part of their combined guidance (verification + alerts + plans). T1213.005 gets the implemented-alternative guidance and T1489 gets the policy guidance. Knowing which mechanism belongs to which row keeps your control coverage honest.<\/p>", "idx": 5}, {"id": "M07", "type": "fill", "summary": "Complete the Corvus incident communication policy", "scenario": "<p>The Corvus Freight IR plan, section 3: &quot;Communication fallback&quot;, is missing three words.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — IR plan §3 (draft)<\/div><div class=\"art-body\"><p>3.1 During an incident, all critical communication moves to the (1)____ channel.<\/p><p>3.2 The primary fallback is a(n) (2)____ phone line outside the company network.<\/p><p>3.3 Every payment change requested by email must be (3)____ by calling a number from the OOB contact tree.<\/p><\/div><\/div>", "question": "Choose the three missing words.", "hint": "Blank 1 names the mitigation. Blank 2 names a channel type from the page. Blank 3 is what you do to critical requests.", "template": "3.1 During an incident, all critical communication moves to the {{0}} channel.<br>3.2 The primary fallback is a(n) {{1}} phone line outside the company network.<br>3.3 Every payment change requested by email must be {{2}} by calling a number from the OOB contact tree.", "bank": ["out-of-band", "encrypted", "verified", "forwarded", "public", "archived", "internal"], "answers": ["out-of-band", "encrypted", "verified"], "why": ["Blank 1 is the term of the mitigation itself: out-of-band.", "Blank 2: the page lists encrypted phone lines as one of the OOB channel examples.", "Blank 3: the page says to verify critical actions initiated via email — verification, not forwarding or archiving.", "&quot;Forwarded&quot; is the attacker's trick (T1114.003), not the defense.", "&quot;Public&quot; would let the attacker read the incident traffic.", "&quot;Archived&quot; stores messages; it does not confirm a request is genuine.", "&quot;Internal&quot; channels are exactly what may be compromised during the incident."], "explanation": "<p>The policy sentence bundles the three core properties: move to <b>out-of-band<\/b> (independent path), use an <b>encrypted<\/b> channel (confidentiality on that path), and <b>verify<\/b> critical email-initiated actions through it. Note how the third clause implements the page's guidance for financial transactions using the OOB contact tree.<\/p>", "idx": 6}, {"id": "M08", "type": "triage", "summary": "Ransomware at 03:00 — communications decisions", "scenario": "<p>03:12. Corvus Freight's chat server shows ransom-note filenames, and the mail gateway is rejecting connections. Three communications decisions come to you in order.<\/p>", "question": "Pick the best action for each decision.", "hint": "The in-network tools are compromised or down. Every answer that keeps you on them is a trap.", "steps": [{"situation": "The chat application is frozen with ransom-note filenames. What now?", "options": [{"text": "Declare the in-network chat untrusted and switch to the OOB channel", "correct": true, "why": "When the primary infrastructure is compromised or down, the OOB channel takes over — that is the whole purpose of the plan."}, {"text": "Reboot the chat server and hope it recovers", "correct": false, "why": "Rebooting does not restore trust in a compromised platform, and wastes the critical first minutes."}, {"text": "Wait for the IT vendor's morning support line", "correct": false, "why": "Waiting leaves the team without coordination during the most critical window."}]}, {"situation": "How do you tell the on-call responders about the switch?", "options": [{"text": "Send the switch notice through the OOB channel to the contact tree", "correct": true, "why": "The contact tree exists precisely so the first message of an incident reaches people on a trusted path."}, {"text": "Post the notice in the frozen chat channel", "correct": false, "why": "Nobody can read it, and if the chat is compromised the attacker reads it too."}, {"text": "Tell nobody and start working alone", "correct": false, "why": "Incident response is a team activity. Silence breaks coordination, which is what the adversary wants."}]}, {"situation": "Contracts with wire details must be approved tonight. Where do approvals go?", "options": [{"text": "Move the approval workflow to OOB verification with call-backs", "correct": true, "why": "Financial transactions are critical actions; the page says to verify them out-of-band instead of relying on compromised email."}, {"text": "Email scanned contracts to the CFO's address", "correct": false, "why": "Email is rejecting connections and may be under adversary control (T1114.002 describes remote collection of exactly this mail)."}, {"text": "Approve from memory without any verification", "correct": false, "why": "Skipping verification re-opens the fraud door the attacker is pushing on."}]}], "explanation": "<p>This is the M1060 scenario in miniature: the primary infrastructure is compromised or down (ransomware often combines T1489 Service Stop with collection), so the response switches to the <b>planned OOB channel<\/b>, informs people through the <b>contact tree<\/b>, and moves <b>critical actions to OOB verification<\/b>. Each wrong option keeps the responder attached to a path the adversary owns or has switched off.<\/p>", "idx": 7}, {"id": "M09", "type": "qcm", "summary": "When SMS verification stops being out-of-band", "scenario": "<p>The CFO's phone number was moved to a burner SIM in a SIM-swap attack. For two hours, every SMS verification code she requested arrived on the attacker's handset.<\/p>", "question": "Why does SMS-based verification no longer count as out-of-band here?", "hint": "Out-of-band requires a path the attacker cannot reach. Where do the codes physically arrive now?", "options": ["Because the SMS path now ends on a device the attacker controls, so it is no longer an independent path", "Because SMS text messages cost the company money per message", "Because the CFO's phone battery was low that morning", "Because the company does not encrypt SMS on its own servers"], "answer": 0, "why": ["Correct. A SIM swap redirects the SMS path to the attacker. The channel still exists, but its endpoint is hostile, so independence is gone.", "Wrong — cost is not a security property and does not affect the out-of-band definition.", "Wrong — a low battery is an availability hiccup, not a compromise of the path.", "Wrong — company-side SMS encryption is not the issue. The message physically reached the attacker."], "explanation": "<p>Independence is the defining property of out-of-band, and it must hold <b>end to end<\/b>. A SIM swap does not break the telephone network — it breaks <b>your control of the endpoint<\/b>. Verification codes then flow to the adversary, which turns the &quot;separate path&quot; into a second channel the attacker owns. That is why serious OOB designs prefer dedicated devices, encrypted lines, or hardware-bound apps, and why a failed or strange verification attempt must itself raise an OOB alert.<\/p>", "idx": 8}, {"id": "M10", "type": "order", "summary": "Order the OOB validation tabletop", "scenario": "<p>Meridian Health runs a quarterly tabletop to prove the OOB channel works. The facilitator's notes are shuffled.<\/p>", "question": "Put the four steps in the correct order.", "hint": "You cannot test what is not chosen, and you cannot fix gaps you have not recorded.", "steps": ["Pick the OOB channel and its backup", "Publish the OOB contact tree to all responders", "Send a test message end-to-end through the channel", "Record the gaps and assign fixes"], "explanation": "<p>Validation is sequential: <b>choose<\/b> the channel (and a backup) first; <b>publish<\/b> the contact tree so responders know how to reach each other; <b>test end-to-end<\/b> — a message from trigger to delivery; then <b>record gaps<\/b> and assign fixes so the next test is better. Skipping the test step is the most common failure: a channel that has never been tested is a plan on paper, not a capability.<\/p>", "idx": 9}, {"id": "M11", "type": "spot", "summary": "Spot the flawed lines in the draft policy", "scenario": "<p>A draft of the Corvus emergency-communications policy contains two serious design errors.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Policy draft v0.4 (excerpts)<\/div><div class=\"art-body\"><pre>1. If chat is compromised, fall back to company webmail on the same mail server.\n2. Deliver SOC alerts about new forwarding rules into the OOB emergency channel.\n3. Verify payment-change requests with a call-back on a number from the OOB tree.\n4. Coordinate the OOB test schedule through the office chat only.\n5. Keep the OOB contact tree printed and stored outside the mail server.<\/pre><\/div><\/div>", "question": "Click the two lines that break the out-of-band design.", "hint": "Both bad lines tie the fallback to infrastructure the attacker may own or have switched off.", "lines": [{"text": "If chat is compromised, fall back to company webmail on the same mail server.", "bad": true, "why": "Webmail on the same mail server shares the mail infrastructure's fate. If the server is compromised or down, the fallback dies with it."}, {"text": "Deliver SOC alerts about new forwarding rules into the OOB emergency channel.", "bad": false, "why": "Correct design: alerts about suspicious email travel on the OOB path so the attacker cannot read or block them."}, {"text": "Verify payment-change requests with a call-back on a number from the OOB tree.", "bad": false, "why": "Correct design: this is exactly the OOB verification the page asks for financial transactions."}, {"text": "Coordinate the OOB test schedule through the office chat only.", "bad": true, "why": "If the office chat is the only place the test schedule lives, the plan depends on an in-network tool. When chat is compromised or down, nobody knows when or how to test."}, {"text": "Keep the OOB contact tree printed and stored outside the mail server.", "bad": false, "why": "Correct design: the contact tree survives a mail-server compromise because it lives outside it."}], "explanation": "<p>Both bad lines violate the same principle: the fallback must not depend on the potentially compromised primary infrastructure. A webmail backup on the same mail server and a test schedule that lives only in office chat both fail the &quot;separate path&quot; test. Lines 2, 3 and 5 are textbook M1060: OOB alerts, OOB verification, and an OOB contact tree stored outside the blast radius.<\/p>", "idx": 10}, {"id": "M12", "type": "match", "summary": "Match each limitation or property to its example", "scenario": "<p>A trainer prepares cards for the M1060 module. Each card shows a limitation or property and a workplace example.<\/p>", "question": "Match each property to the example that shows it.", "hint": "Think about what each property claims: what the mitigation does not do, and what independence or verification really means.", "pairs": [{"left": "M1060 does not stop initial access", "right": "A phishing email steals a password before any incident communication starts", "why": "Getting in with a stolen password happens before the OOB channel matters. Other mitigations own that step."}, {"left": "A channel is OOB only if it is independent", "right": "The backup chat app logs in through the compromised company SSO", "why": "The identity dependency re-attaches the channel to compromised infrastructure — it fails the definition."}, {"left": "OOB verification defeats fake requests", "right": "A wire change is confirmed by calling the CFO on the known OOB line", "why": "The attacker cannot join a call on a number they do not control, so the fake request fails."}, {"left": "A phone-based path can be redirected", "right": "The attacker SIM-swapped the CFO's number and received the codes", "why": "SIM swap moves the endpoint of the SMS path to the attacker, so independence is lost."}], "explanation": "<p>Four ideas every M1060 student must keep apart: the mitigation <b>protects communication<\/b>, it does not prevent entry; <b>independence<\/b> covers identity and endpoints, not just the network path; <b>verification<\/b> works because the attacker cannot join the trusted path; and phone-based paths can be <b>redirected<\/b> (SIM swap), which is why the page's channel examples avoid ordinary SMS.<\/p>", "idx": 11}, {"id": "M13", "type": "fill", "summary": "Complete the framework-mapping note", "scenario": "<p>The GRC team documents which framework the M1060 page itself points to.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Mapping note (draft)<\/div><div class=\"art-body\"><p>The M1060 page cites (1)____ as reference [2] for its guidance.<\/p><p>Teams mapping this mitigation usually place OOB communication planning in the (2)____ family of that publication.<\/p><\/div><\/div>", "question": "Choose the two missing entries.", "hint": "Reference [2] on the page is a NIST publication. Contingency
