<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>M1060 — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "m1060",
  "batch": 3,
  "title": "M1060 Out-of-Band Communications Channel \u2014 HARD",

  "passMark": 70
}
</script>
<style>

:root {
  --bg-page: #0b1020;
  --bg-surface: #121a2e;
  --bg-surface-2: #0f1729;
  --border: #243049;
  --text-primary: #e6ecff;
  --text-secondary: #a9b4d0;
  --text-mono: #c8ffd4;
  --accent-blue: #5aa9ff;
  --accent-amber: #ffb454;
  --accent-green: #57d38c;
  --state-correct: #57d38c;
  --state-partial: #ffb454;
  --state-incorrect: #ff6b6b;
  --state-skipped: #a9b4d0;
  --state-paused: #9d7bff;
  --sev-easy: #57d38c;
  --sev-medium: #ffb454;
  --sev-hard: #ff8a3d;
  --sev-extreme: #ff6b6b;
  /* derived dark-theme roles (defined once, consumed everywhere) */
  --bg-topbar: #0d1326;
  --bg-hover-btn: #18213a;
  --border-hover-btn: #33415f;
  --bg-hover-opt: #141d36;
  --bg-chip: #16203a;
  --on-primary: #06220f;
  --on-amber: #2a1a02;
  --syn-ts: #8fa3c8;
  --syn-ip: #7fd4ff;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-page);
  color: var(--text-primary);
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
code, pre, .mono, .log-line, .term-input, .timer-val {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-size: 14.5px;
}
.view { display: none; padding: 0 0 48px 0; }
.view.active { display: block; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 18px; }

/* ---------- cards & shared ---------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  padding: 18px 20px;
  margin: 16px 0;
}
.card h2, .card h3 { margin-top: 0; }
.sec-title {
  font-size: 19px;
  margin: 0 0 10px 0;
  letter-spacing: 0.2px;
}
.muted { color: var(--text-secondary); }
.small { font-size: 13.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 600;
  font-size: 13.5px;
  background: var(--bg-surface-2);
  color: var(--text-primary);
  white-space: nowrap;
}
.badge.sev { border-width: 2px; background: transparent; }
button {
  font: inherit;
  color: var(--text-primary);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  min-height: 44px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-hover-btn); border-color: var(--border-hover-btn); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: var(--on-primary);
  font-weight: 700;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.amberbtn {
  background: var(--accent-amber);
  border-color: var(--accent-amber);
  color: var(--on-amber);
  font-weight: 700;
}
button:focus-visible, .opt:focus-visible, .chip:focus-visible, .blank:focus-visible,
.zone:focus-visible, select:focus-visible, input:focus-visible, .spot-line:focus-visible {
  outline: 3px solid var(--accent-blue);
  outline-offset: 2px;
}
a, .linkish { color: var(--accent-blue); }

/* ---------- intro ---------- */
.intro-head { margin-top: 18px; }
.intro-head h1 { margin: 0 0 6px 0; font-size: 26px; line-height: 1.25; }
.factrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.fact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 120px;
}
.fact .k { color: var(--text-secondary); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; }
.fact .v { font-weight: 700; font-size: 15.5px; }
.learn p { margin: 8px 0; }
.kw-theme {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 10px 14px;
  margin: 10px 0;
}
.kw-theme .kw-name { font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; }
.kw-theme ul { margin: 4px 0 2px 0; padding-left: 20px; }
.kw-theme li { margin: 3px 0; }
.rules li { margin: 6px 0; }
.startrow { text-align: center; margin-top: 18px; }
.startrow button { font-size: 18px; padding: 14px 42px; }

/* ---------- sticky exam header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 8px 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
.topbar .topic { font-weight: 700; font-size: 14.5px; }
.topbar .spacer { flex: 1 1 0; }
.topbar button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.timerbox { display: inline-flex; align-items: center; gap: 8px; }
.timer-val { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.timer-state { font-size: 12.5px; font-weight: 700; }
.scorebox { font-size: 14.5px; color: var(--text-secondary); }
.scorebox b { color: var(--text-primary); font-size: 16px; }
.progresswrap {
  max-width: 1080px; margin: 0 auto; height: 5px;
  background: var(--bg-surface-2);
  border-radius: 0 0 3px 3px; overflow: hidden;
}
.progressbar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sev-current, var(--accent-blue)), var(--accent-blue));
  position: relative;
  transition: width 0.3s ease;
}
.progressbar::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(230,236,255,0.25) 50%, transparent 70%);
  animation: sheen 2.8s linear infinite;
}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- exercise blocks ---------- */
.block {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  margin: 14px 0;
  overflow: hidden;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; letter-spacing: 1.2px; font-size: 13px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface-2);
}
.block-scenario { border-left-color: var(--accent-blue); }
.block-scenario .block-head { color: var(--accent-blue); }
.block-question { border-left-color: var(--accent-amber); }
.block-question .block-head { color: var(--accent-amber); }
.block-answer { border-left-color: var(--accent-green); }
.block-answer .block-head { color: var(--accent-green); }
.block-body { padding: 14px 18px; }
.q-text { font-weight: 700; font-size: 16.5px; margin: 0; }
.collapse-btn {
  margin-left: auto; min-height: 30px; padding: 2px 10px; font-size: 12.5px;
  background: transparent; border: 1px solid var(--border);
}
.scen-summary { color: var(--text-secondary); font-size: 13px; padding: 6px 16px; display: none; }

/* artefact panels */
.artefact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 10px 0;
  overflow: hidden;
}
.artefact .art-label {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; letter-spacing: 0.8px;
  color: var(--accent-blue);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(90,169,255,0.06);
  text-transform: uppercase;
}
.artefact .art-body { padding: 10px 12px; }
.artefact p { margin: 6px 0; }

/* logs */
.logbox { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.logfilter { margin: 8px 0; }
.logfilter input {
  width: 100%; padding: 9px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary);
}
.log-line { padding: 3px 6px; white-space: pre-wrap; word-break: break-word; margin: 1px 0; border-radius: 3px; }
.log-line.logmark { background: rgba(255,180,84,0.10); }
.lg-ts { color: var(--syn-ts); }
.lg-key { color: var(--accent-amber); }
.lg-str { color: var(--text-mono); }
.lg-ok { color: var(--state-correct); }
.lg-bad { color: var(--state-incorrect); }
.lg-ip { color: var(--syn-ip); }
.lg-dim { color: var(--text-secondary); }

/* options */
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  min-height: 44px;
}
.opt:hover { background: var(--bg-hover-opt); }
.opt .opt-label { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.opt.selected { border-left: 4px solid var(--accent-green); background: rgba(87,211,140,0.07); box-shadow: 0 0 0 1px rgba(87,211,140,0.25); }
.opt.selected .selmark { color: var(--accent-green); font-weight: 700; margin-left: auto; font-size: 13px; }
.opt.sel-incorrect { border-left-color: var(--state-incorrect); }
.opt.sel-correct { border-left-color: var(--state-correct); }
.opt.opt-correct-reveal { border-left: 4px solid var(--state-correct); }
.opt.disabled { cursor: default; }

/* matching */
.matchrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.matchrow .mleft {
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; min-height: 44px;
}
.matchrow select {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--bg-page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
}

/* drag & drop */
.dnd-grid { display: grid; gap: 14px; }
.bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  background: var(--bg-surface-2);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 52px;
}
.chip {
  background: var(--bg-chip);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-height: 44px;
  cursor: grab;
  user-select: none;
  display: inline-flex; align-items: center;
}
.chip.armed { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(87,211,140,0.3); }
.chip.used { opacity: 0.35; cursor: default; }
.zones { display: grid; gap: 10px; }
.zones.cols2 { grid-template-columns: 1fr 1fr; }
.zones.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.zone {
  background: var(--bg-page);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 74px;
  cursor: pointer;
}
.zone h4 { margin: 0 0 6px 0; font-size: 13.5px; color: var(--accent-amber); }
.zone .zdrop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.zone.dragover { border-color: var(--accent-green); background: rgba(87,211,140,0.05); }
.zone .chip { cursor: pointer; }

/* ordering */
.orderlist { display: grid; gap: 8px; }
.orderitem {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 48px;
  cursor: grab;
}
.orderitem .pos { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.orderitem .updown { margin-left: auto; display: flex; gap: 4px; }
.orderitem .updown button { min-height: 34px; padding: 2px 10px; }
.orderitem.dragging { opacity: 0.5; }
.orderitem.dragover { border-color: var(--accent-green); }

/* fill blanks */
.filltext { font-size: 16.5px; line-height: 2.1; }
.blank {
  display: inline-block;
  min-width: 120px; min-height: 40px;
  background: var(--bg-surface-2);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  text-align: center;
  cursor: pointer;
  color: var(--text-primary);
}
.blank.armed { border-color: var(--accent-green); }
.blank.filled { border-style: solid; color: var(--text-mono); }
.blank.n1 { min-width: 90px; }
.chipbank { margin-top: 12px; }

/* spot the mistake */
.spotwrap { display: grid; gap: 6px; }
.spot-line {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer; min-height: 44px;
}
.spot-line .ln { color: var(--text-secondary); min-width: 34px; }
.spot-line.selected { border-left: 4px solid var(--accent-amber); background: rgba(255,180,84,0.06); }
.spot-line code { color: var(--text-mono); }

/* terminal */
.term {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.term-scroll {
  min-height: 90px; max-height: 240px; overflow-y: auto;
  margin-bottom: 10px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-prompt { color: var(--accent-green); font-weight: 700; }
.term-echo { color: var(--text-primary); }
.term-out { color: var(--text-mono); }
.term-row { display: flex; gap: 8px; align-items: center; }
.term-row .term-prompt { flex: 0 0 auto; }
.term-input {
  flex: 1; background: var(--bg-page); color: var(--text-mono);
  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
}
.extimer { color: var(--state-paused); font-weight: 700; font-size: 13.5px; }

/* triage / steps */
.stepflag {
  display: inline-block;
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: var(--accent-amber);
  border: 1px solid var(--accent-amber);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.triage-step { margin-bottom: 4px; }

/* hint + feedback */
.hintpanel {
  border: 1px solid var(--accent-amber);
  border-left-width: 4px;
  border-radius: 8px;
  background: rgba(255,180,84,0.06);
  padding: 10px 14px;
  margin: 12px 0;
  display: none;
}
.hintpanel .hint-head { color: var(--accent-amber); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.feedback { display: none; }
.fb-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-weight: 800; font-size: 15px; letter-spacing: 0.8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.fb-correct { color: var(--state-correct); }
.fb-partial { color: var(--state-partial); }
.fb-incorrect { color: var(--state-incorrect); }
.fb-excluded { color: var(--state-skipped); }
.credit-pill {
  border: 1px solid var(--border);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 13px;
  font-weight: 700;
}
.itemrows { display: grid; gap: 6px; margin: 10px 0; }
.itemrow {
  display: flex; gap: 10px; align-items: baseline;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 8px 12px;
}
.itemrow .ic { font-weight: 800; min-width: 110px; }
.itemrow.ir-ok .ic { color: var(--state-correct); }
.itemrow.ir-wrong .ic { color: var(--state-incorrect); }
.itemrow.ir-missed .ic { color: var(--state-skipped); }
.canon { margin: 10px 0; }
.canon code {
  display: block; background: var(--bg-page);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-mono);
  padding: 10px 12px;
  overflow-x: auto;
  cursor: pointer;
}
.danger-note { color: var(--state-incorrect); font-weight: 700; }
.navrow { display: flex; gap: 10px; margin: 16px 0 30px 0; flex-wrap: wrap; }
.navrow .spacer { flex: 1; }

/* pause overlay */
.pauseveil {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(11,16,32,0.93);
  display: none;
  align-items: center; justify-content: center;
}
.pauseveil.active { display: flex; }
.pausecard {
  text-align: center;
  background: var(--bg-surface);
  border: 2px solid var(--state-paused);
  border-radius: 10px;
  padding: 30px 40px;
  max-width: 460px;
}
.pausecard .big { font-size: 40px; color: var(--state-paused); }
.pausecard h3 { color: var(--state-paused); margin: 8px 0; }

/* review skipped */
.revlist { display: grid; gap: 8px; }
.revitem {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--state-skipped);
  border-radius: 6px;
  padding: 10px 14px;
}
.revitem .rev-ic { color: var(--state-skipped); font-weight: 800; }
.revitem button { margin-left: auto; min-height: 38px; }

/* results */
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.res-cell {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.res-cell .num { font-size: 26px; font-weight: 800; }
.res-cell.c-ok .num { color: var(--state-correct); }
.res-cell.c-part .num { color: var(--state-partial); }
.res-cell.c-bad .num { color: var(--state-incorrect); }
.res-cell.c-skip .num { color: var(--state-skipped); }
.verdict {
  border-radius: 8px;
  border: 2px solid;
  padding: 18px 20px;
  margin: 14px 0;
  text-align: center;
}
.verdict.pass { border-color: var(--state-correct); background: rgba(87,211,140,0.07); }
.verdict.fail { border-color: var(--state-incorrect); background: rgba(255,107,107,0.07); }
.verdict .v-big { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
.verdict.pass .v-big { color: var(--state-correct); }
.verdict.fail .v-big { color: var(--state-incorrect); }

@media (max-width: 760px) {
  .res-grid { grid-template-columns: 1fr; }
  .zones.cols2, .zones.cols3 { grid-template-columns: 1fr; }
  .matchrow { grid-template-columns: 1fr; }
  .topbar-inner { gap: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .progressbar::after { animation: none; display: none; }
  * { transition: none !important; }
}

</style>
</head>
<body>
<section id="view-intro" class="view active">
  <div class="wrap" id="intro-body"></div>
</section>

<section id="view-exam" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topic" id="hdr-topic"></span>
      <span class="badge sev" id="hdr-sev"></span>
      <span class="badge" id="hdr-count"></span>
      <span class="timerbox" id="hdr-timer"></span>
      <span class="spacer"></span>
      <span class="scorebox" id="hdr-score"></span>
      <button id="hint-btn" title="Hint (costs 10% of this exercise's credit)">💡 Hint</button>
      <button id="pause-btn" title="Pause the exam and hide the exercise">⏸ Pause</button>
      <button id="skip-btn" title="Skip and answer later">⏭ Skip</button>
      <span class="badge" id="hdr-user" aria-hidden="true"></span>
    </div>
  </div>
  <div class="progresswrap"><div class="progressbar" id="prog-fill"></div></div>
  <div class="wrap">
    <div id="exam-body"></div>
    <div id="hint-panel" class="hintpanel" role="note"></div>
    <div id="check-nudge" class="small" style="display:none;color:var(--state-incorrect);font-weight:700">⚠ Choose an answer first — or press Skip to come back later.</div>
    <div class="block feedback" id="feedback-block">
      <div class="fb-head" id="fb-head"></div>
      <div class="block-body" id="fb-body"></div>
    </div>
    <div class="navrow">
      <button id="check-btn" class="primary">✓ Check</button>
      <button id="next-btn" disabled>Next →</button>
      <span class="spacer"></span>
    </div>
  </div>
  <div class="pauseveil" id="pause-veil" role="dialog" aria-label="Exam paused">
    <div class="pausecard">
      <div class="big">⏸</div>

<script>

'use strict';
/* ============================ DATA ============================ */
var DATA = {"topicId": "m1060", "batch": 3, "difficulty": "hard", "severityWord": "HARD", "sevIcon": "◆", "shortName": "Out-of-Band Communications Channel", "metaTitle": "M1060 Out-of-Band Communications Channel — HARD", "mitreId": "M1060", "timerMinutes": 50, "estimatedMinutes": 50, "passMark": 70, "learnTitle": "What you will learn here", "kwTitle": "Keywords covered in this exam", "howTitle": "How this exam works", "howHTML": "<p>This file trains the <b>HARD<\/b> level: two to three interacting concepts per exercise, realistic artefact sets, and answers that are tempting but wrong. At least a third of the exercises punish the &quot;obvious&quot; answer.<\/p>", "howExtra": "", "typesUsed": ["scenario steps", "log reading", "multiple choice (single answer)", "matching", "drag &amp; drop", "multi-select with partial credit", "ordering", "fill-in-the-blank", "spot the mistake"], "learnHTML": "\n<p>You are past the basics. <b>M1060 — Out-of-Band Communications Channel<\/b> is a <b>Mitigation<\/b> in MITRE ATT&amp;CK (attack.mitre.org/mitigations/M1060). Its Use column gives a different instruction per technique: plan an OOB channel instead of in-network chat (<b>T1213<\/b>), implement it for messaging apps (<b>T1213.005<\/b>), verify critical email-initiated actions (<b>T1114<\/b>), alert on unusual email activity like mass forwarding and large attachments (<b>T1114.001/.002/.003<\/b>), and put OOB usage into policy (<b>T1489 Service Stop<\/b>).<\/p>\n<p>At HARD level you must decide, like a working analyst: which artefact calls for which mechanism; when a channel is <b>not<\/b> actually independent (same SSO, redirected SMS, webmail on the same server); when the alarming signal is a scheduled change; when the quiet signal is the real attack; and when the least aggressive action is the right one. You will also place the mitigation inside a control program: what M1060 covers, what needs a different control (credential dumping, phishing, pass-the-hash), preventive vs detective vs resilience roles, and the trade-offs of satellite links and dedicated systems.<\/p>\n<p>The realistic backdrop: ransomware crews routinely read victim chat and email to follow the response, trigger payment fraud through compromised mailboxes, and stop services to cut coordination. Every exercise here mirrors that reality with defanged IOCs and artefacts you would actually see in a SOC.<\/p>\n", "keywords": [{"theme": "Artefact discrimination", "items": ["Forwarding-rule spikes: malicious vs scheduled integration (change tickets)", "Unexplained OOB channel activity: drill vs unauthorised use", "Correlating mail telemetry with payment-fraud attempts"]}, {"theme": "Mechanism choice under pressure", "items": ["OOB verification for password resets and wire changes", "OOB alerts for mass forwarding and large attachments", "OOB channel activation when chat/email are untrusted", "Least-aggressive action during an active investigation"]}, {"theme": "Coverage & boundaries", "items": ["Addressed: T1213, T1213.005, T1114 family, T1489", "Not addressed: phishing (T1566), credential dumping (T1003), pass-the-hash (T1550.002)", "Independence failures: shared SSO, corporate VPN routing, same-server webmail, redirected SMS"]}, {"theme": "Control design", "items": ["Preventive vs detective vs resilience roles of the mechanisms", "Runbook flaws that break independence", "Trade-offs: provisioning cost, device logistics, testing discipline"]}], "exercises": [{"id": "H01", "type": "triage", "summary": "Ransomware with a watcher — first hour", "scenario": "<p>07:40, Ashvale Bank. Ransom note on the file cluster. Telemetry shows an interactive session in the CFO's mailbox since 06:58 (lat 41[.]90[.]22[.]7 — defanged). The response channel of choice, office chat, is still up — and the attacker's session is reading channels labelled &quot;IR&quot;.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Chat channel list<\/div><div class=\"art-body\"><pre>#inc-response  (14 members, active now)\n#ir-timeline   (updated 07:39)\n#exec-briefing (locked)\n#social/office (quiet)<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 2 — Mail telemetry<\/div><div class=\"art-body\"><pre>06:58 imap session opened from 41[.]90[.]22[.]7 (defanged)\n07:05 new inbox rule \"RSS Feeds\" on cfo@ashvalebank.example\n07:22 6 messages with attachments downloaded externally<\/pre><\/div><\/div>", "question": "Take the three decisions in order. The obvious answer is wrong in at least one step.", "hint": "The attacker is watching. Anything you write in-network, they read. And one tempting option destroys evidence.", "steps": [{"situation": "The chat platform still works. Do you keep coordinating there?", "options": [{"text": "Move coordination to the OOB channel immediately and treat in-network chat as compromised", "correct": true, "why": "The session is reading IR channels. The page's guidance for T1213.005 is to use the OOB channel as the alternative once in-network chat is untrusted."}, {"text": "Keep using #inc-response — the audit trail must stay in one place", "correct": false, "why": "Tempting for documentation, but every message teaches the adversary your next move. The audit trail can be reconstructed from OOB logs afterwards."}, {"text": "Keep chat but rename the channels to look harmless", "correct": false, "why": "Security by obscurity: the attacker already knows which channels matter and can follow renames in real time."}]}, {"situation": "The CFO mailbox has a forwarding rule and external downloads. What is the communications move?", "options": [{"text": "Verify all pending critical requests that touched that mailbox via OOB call-backs", "correct": true, "why": "The page says to verify critical actions initiated via email — password resets, payments, access — through a path the attacker cannot join."}, {"text": "Reply from the CFO's mailbox asking the team to confirm requests", "correct": false, "why": "The attacker owns the mailbox. Replies confirm the fraud for them."}, {"text": "Nothing yet — wait for the malware team to finish first", "correct": false, "why": "The fraud window is open now. Waiting on other workstreams lets payment fraud through."}]}, {"situation": "A responder proposes wiping the CFO's mailbox to stop collection. Your call?", "options": [{"text": "Preserve the mailbox; block the forwarding path and continue on OOB", "correct": true, "why": "Wiping destroys evidence the IR and legal teams need. The collection stops by removing the rule and session, not by deleting the record."}, {"text": "Wipe it now — collection must stop at any cost", "correct": false, "why": "Destructive and unnecessary: disabling the rule and killing the session stops collection while preserving evidence."}, {"text": "Leave the mailbox untouched and unmonitored", "correct": false, "why": "Doing nothing leaves the forwarding rule and fraud attempts running."}]}], "explanation": "<p>This is the M1060 scenario: an adversary with hands on your in-network communications (T1213.005 chat, T1114 email) during a ransomware event. The moves that matter: <b>switch coordination to OOB<\/b>, <b>verify pending critical actions via OOB<\/b> before the fraud lands, and <b>preserve evidence<\/b> — containment is surgical (kill the rule and session), not destructive. The &quot;audit trail in one place&quot; and &quot;wipe it&quot; options are the realistic traps.<\/p>", "idx": 0}, {"id": "H02", "type": "log", "summary": "Northwind Retail — Friday afternoon telemetry", "scenario": "<p>16:50, Friday. The Northwind Retail SOC inbox collects three artefacts before the weekend handover.<\/p>", "question": "Sort the four proposed actions: which are the M1060-grounded moves before handover, and which are traps?", "hint": "One artefact is collection infrastructure; one is a critical action in motion. Two options look reasonable but hurt the business or the case.", "logLines": ["<span class=\"lg-ts\">2026-06-05 16:31:22Z<\/span> <span class=\"lg-key\">AUDIT<\/span> mailbox=ap-clerk4@northwindretail.example action=<span class=\"lg-str\">New-InboxRule<\/span> forward_to=<span class=\"lg-bad\">inv-support@trelay-215.example<\/span> <span class=\"lg-dim\">scope=finance only<\/span>", "<span class=\"lg-ts\">2026-06-05 16:33:07Z<\/span> <span class=\"lg-key\">AUDIT<\/span> action=<span class=\"lg-str\">Set-Mailbox<\/span> <span class=\"lg-dim\">ForwardingSmtpAddress=<\/span><span class=\"lg-bad\">inv-support@trelay-215.example<\/span> <span class=\"lg-dim\">accounts=ap-clerk2, ap-clerk4, ap-clerk9<\/span>", "<span class=\"lg-ts\">2026-06-05 16:41:55Z<\/span> <span class=\"lg-key\">MAIL<\/span> from=<span class=\"lg-str\">ap-clerk4@northwindretail.example<\/span> subject=<span class=\"lg-bad\">\"URGENT: supplier bank details update before Monday 08:00\"<\/span> to=<span class=\"lg-str\">ap-team@northwindretail.example<\/span>"], "widget": {"id": "H02w", "type": "dnd", "summary": "", "scenario": "", "question": "Sort each proposed action by whether the M1060 guidance supports doing it now.", "hint": "", "zones": [{"id": "do", "label": "Do now — grounded in M1060"}, {"id": "reject", "label": "Reject — the wrong move now"}], "items": [{"label": "Verify the supplier bank-details change by call-back on the OOB contact tree before Monday", "zone": "do", "why": "A bank-details change requested by email is a critical action; the page says verify it out-of-band before approval. The deadline makes the fraud window real."}, {"label": "Raise an OOB alert to the on-call manager about the multi-mailbox forwarding change", "zone": "do", "why": "Forwarding rules across three finance mailboxes are exactly the unusual email activity the page says to alert on, out-of-band, so the adversary cannot read or block the alert."}, {"label": "Block all external email for the whole company until Monday", "zone": "reject", "why": "A company-wide mail block is a business-wide outage for a scoped incident; it does not verify the request or stop the rule."}, {"label": "Delete the forwarding rules and the mailboxes' contents to stop collection immediately", "zone": "reject", "why": "Deleting mailbox contents destroys evidence in an active investigation. Remove the rules and sessions surgically; never the record."}], "explanation": ""}, "explanation": "<p>The two correct moves are the page's own mechanisms: <b>OOB alerts<\/b> for the unusual email activity (rules across three finance mailboxes) and <b>OOB verification<\/b> for the critical action in motion (bank-details change with a Monday deadline). The tempting rejects fail on proportionality (total mail block) or on evidence handling (wiping contents) — both are realistic choices a stressed analyst might make at 16:50 on a Friday.<\/p>", "idx": 1}, {"id": "H03", "type": "qcm", "summary": "Mass forwarding rule — but there is a change ticket", "scenario": "<p>09:20. An alert fires: a forwarding rule was created on 22 mailboxes, forwarding to <span class=\"mono\">svc-ticketbridge@northwindretail.example<\/span> — an internal service address. A change ticket exists.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Change ticket #4412<\/div><div class=\"art-body\"><pre>Type:      Standard change (pre-approved)\nTitle:     Mail-to-ticket bridge rollout (helpdesk integration)\nOwner:     IT Service Desk, approved 3 weeks ago\nScope:     22 support-tier mailboxes\nTarget:    svc-ticketbridge@northwindretail.example (internal)\nWindow:    today 09:00-09:30\nRollback:  script RB-4412.ps1<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 2 — Rule detail<\/div><div class=\"art-body\"><pre>forward_to = svc-ticketbridge@northwindretail.example (internal)\nmatch      = subject starts with [TICKET]\nscope      = 22 mailboxes — all listed in CHG-4412\ncreated_by = svc-desk-automation (expected principal)<\/pre><\/div><\/div>", "question": "What is the right next step for the alert?", "hint": "Everything in the artefacts points one way — but the page's own mechanism is verification before action. Choose the least aggressive correct move.", "options": ["Confirm the rollout with the change owner through the OOB line, then re-enable the alert baseline", "Declare a P1 incident and disable mail flow for all 22 mailboxes", "Remove the forwarding rules immediately — forwarding is always hostile", "Whitelist all forwarding rules permanently so this alert stops firing"], "answer": 0, "why": ["Correct. The artefacts match an approved change (internal target, expected principal, scope, window), but verification happens through the OOB path with the owner — and the alert did its detective job.", "Wrong — disabling mail flow for 22 support mailboxes on the word of a matching change ticket is disproportionate and breaks the helpdesk. The benign reading is strongly supported.", "Wrong — the rule matches the ticket exactly (internal address, expected principal, documented window). Auto-removing approved integration is a false positive with business cost.", "Wrong — whitelisting permanently blinds the detective control. Next month a hostile rule would sail through."], "explanation": "<p>This is the &quot;looks alarming, is benign&quot; trap in reverse order: the artefacts corroborate the change ticket (internal destination, expected service principal, pre-approved scope and window). The correct move is still <b>verification<\/b> — the M1060 muscle — via the OOB line with the change owner, followed by keeping the detective control intact. The aggressive options trade a false positive for real business damage; the whitelist option trades vigilance for silence.<\/p>", "idx": 2}, {"id": "H04", "type": "log", "summary": "A test message nobody scheduled", "scenario": "<p>23:05, Saturday. The Ashvale OOB relay logs activity. The quarterly drill was in March. Nobody is on call for a test tonight.<\/p>", "question": "How should the on-call analyst classify this event?", "hint": "Delivery confirmed sounds reassuring. Ask instead: who is on my emergency channel, and did I invite them?", "logLines": ["<span class=\"lg-ts\">2026-06-13 23:04:11Z<\/span> <span class=\"lg-key\">OOB-RELAY<\/span> <span class=\"lg-ok\">delivery=confirmed<\/span> channel=<span class=\"lg-str\">ir-emergency<\/span> from=<span class=\"lg-bad\">member-9<\/span> text=<span class=\"lg-dim\">\"connectivity test\"<\/span>", "<span class=\"lg-ts\">2026-06-13 23:04:12Z<\/span> <span class=\"lg-key\">OOB-RELAY<\/span> member-9 <span class=\"lg-dim\">joined=23:04:09 device=unknown<\/span> auth=<span class=\"lg-bad\">recovery-code<\/span> mfa=none", "<span class=\"lg-ts\">2026-06-13 23:05:00Z<\/span> <span class=\"lg-key\">CAL<\/span> <span class=\"lg-dim\">no drill scheduled for June; last drill 2026-03-11; next 2026-09-08<\/span>"], "widget": {"id": "H04w", "type": "fill", "summary": "", "scenario": "", "question": "Complete the classification sentence for tonight's event.", "hint": "", "template": "Classification: {{0}} — an unauthorised member joined the OOB channel with a recovery code and no MFA; verify the member and rotate OOB access before trusting the channel again.", "bank": ["alarming", "benign", "scheduled", "routine", "harmless", "expected"], "answers": ["alarming"], "why": ["Correct — an uninvited member using a recovery code with no MFA on the emergency channel is the silent-but-serious case, and the calendar shows no drill tonight.", "Benign would normalise an unexplained join on the last trusted path.", "Scheduled is wrong — the calendar line shows the last drill in March and the next in September.", "Routine is wrong — recovery-code joins outside a scheduled drill are not routine on this relay.", "Harmless is wrong — &quot;delivery confirmed&quot; only says the message arrived; it says nothing about whether the sender was authorised.", "Expected is wrong — nobody is on call for a test tonight, so nobody expected a member to join."], "explanation": ""}, "explanation": "<p>The reverse trap: everything looks healthy — &quot;delivery confirmed&quot;, relay up — but the <b>members<\/b> of the emergency channel are the asset. An unauthorised join via a recovery code with no MFA means the last independent path may now have a listener. The correct move treats OOB access itself as a critical control: verify the member out-of-band, revoke the recovery code, rotate credentials, and close the MFA gap on the relay. A compromised OOB channel is worse than no OOB channel, because it manufactures false confidence.<\/p>", "idx": 3}, {"id": "H05", "type": "match", "summary": "Which mechanism does each artefact call for?", "scenario": "<p>Four artefacts land in the Ashvale SOC queue during the same morning. Each one maps to one M1060 mechanism.<\/p>", "question": "Match each artefact to the mechanism it calls for.", "hint": "One of the four artefacts is not an email problem at all — separate it from the other three first.", "pairs": [{"left": "Email from the payables mailbox: change of supplier bank details before 08:00", "right": "OOB verification of a critical action", "why": "A financial transaction initiated via email is the page's textbook case for out-of-band verification before approval."}, {"left": "Eleven new forwarding rules across mailboxes in ten minutes", "right": "OOB alert to the security team", "why": "Mass forwarding is the named unusual email activity; the alert must travel on the OOB path so the adversary cannot silence it."}, {"left": "Ransomware has frozen both chat and email; response teams are dark", "right": "Activation of the planned OOB channel", "why": "When the primary infrastructure fails or is untrusted, the planned channel — and its policy — takes over."}, {"left": "Contractor asks helpdesk, by email, to reset their manager's password", "right": "OOB verification of a critical action", "why": "Password resets requested by email are critical actions; verify the requester through a path the mailbox owner cannot influence."}], "explanation": "<p>Reading artefacts into mechanisms is the daily use of M1060: <b>critical action by email → verify OOB<\/b>; <b>unusual email activity → alert OOB<\/b>; <b>primary channel lost → activate the planned channel<\/b>. Two of the four artefacts land on verification — resets and payments are the page's own examples — which tells you how often that mechanism earns its keep.<\/p>", "idx": 4}, {"id": "H06", "type": "dnd", "summary": "Coverage check: what M1060 addresses and what it does not", "scenario": "<p>A control review at Northwind asks which behaviours M1060 actually answers. Six technique cards are on the table.<\/p>", "question": "Drag each technique into the correct bucket.", "hint": "The page addresses chat repositories, email collection (including forwarding rules), and service stop. Everything else needs another control.", "zones": [{"id": "addressed", "label": "Addressed by M1060 — the page's technique table"}, {"id": "other", "label": "Needs a different mitigation — not on the page"}], "items": [{"label": "T1213.005 — Messaging Applications", "zone": "addressed", "why": "The page asks for implemented OOB alternatives to in-network chat."}, {"label": "T1114.003 — Email Forwarding Rule", "zone": "addressed", "why": "Verification + alerts + channel plans are the page's answer to the forwarding-rule family."}, {"label": "T1489 — Service Stop", "zone": "addressed", "why": "Policy that includes OOB channels keeps coordination alive when services stop."}, {"label": "T1566 — Phishing", "zone": "other", "why": "Phishing steals the credentials that start the story. M1060 protects communications afterwards; anti-phishing controls own this."}, {"label": "T1003 — OS Credential Dumping", "zone": "other", "why": "Dumping credentials from memory is post-compromise theft on hosts. Not a communications problem — other mitigations apply."}, {"label": "T1550.002 — Pass the Hash", "zone": "other", "why": "Reusing stolen hashes bypasses authentication entirely. M1060's channel work does not touch it."}], "explanation": "<p>Coverage honesty: M1060 addresses <b>T1213.005<\/b>, the <b>T1114<\/b> family, and <b>T1489<\/b>. It does not stop the entry (<b>T1566<\/b>), the theft (<b>T1003<\/b>), or the reuse (<b>T1550.002<\/b>). In a control matrix these need their own rows — claiming M1060 covers them would hide real gaps.<\/p>", "idx": 5}, {"id": "H07", "type": "qcm", "summary": "What to do with in-network email during the investigation", "scenario": "<p>Day 2 of the Ashvale mailbox-compromise investigation. Critical communication has moved to OOB. Legal wants evidence intact; operations still runs on email for low-sensitivity traffic; the adversary session is cut but monitoring continues.<\/p>", "question": "Which communications posture is correct for the investigation period?", "hint": "Two extremes both fail: total shutdown hurts the business; total normality re-opens the fraud path. Split by sensitivity and verify what matters.", "options": ["Shut down all corporate email until the investigation closes", "Keep email as-is for everyone; the session is cut, so no special handling is needed", "Keep low-sensitivity traffic on email, move all critical actions to OOB verification, and keep the mailbox under monitor", "Move the whole company to the OOB channel until further notice"], "answer": 2, "why": ["Wrong — a full mail outage across a bank is a business-killer and disproportionate; the compromise is scoped and monitored.", "Wrong — &quot;the session is cut&quot; is not the point: critical actions (resets, payments) requested by email still need OOB verification while the investigation runs.", "Correct — a risk-split posture: email for ordinary traffic, OOB verification for critical actions, monitoring in place. This is the least aggressive option that still closes the fraud path.", "Wrong — moving the entire company OOB is impractical and burns the emergency channel's value; reserve it for critical coordination."], "explanation": "<p>The least aggressive option is the correct one: <b>segment by sensitivity<\/b>. M1060 never asks you to abandon in-network tools wholesale — it asks for a trusted alternative where it matters (critical actions, incident coordination) and for verification through it. The extremes (total shutdown, total normality) are the realistic near-miss answers an experienced analyst will recognise from real war rooms.<\/p>", "idx": 6}, {"id": "H08", "type": "multi", "summary": "Which setups fail the independence test?", "scenario": "<p>The Ashvale architecture review examines six proposed &quot;out-of-band&quot; setups. Independence must hold end-to-end: path, identity, and endpoint.<\/p>", "question": "Select every setup that FAILS the out-of-band independence test.", "hint": "Four of the six quietly tie the channel back to compromised-able infrastructure. Two are genuinely independent.", "options": ["Backup chat app that authenticates through the company SSO the attacker just compromised", "SMS verification codes sent to the CFO's phone number, which was moved by SIM swap to an attacker handset", "Emergency chat that routes its traffic through the corporate VPN concentrator", "Webmail fallback served by the same mail server as primary email", "A messaging provider account with credentials separate from the company directory, on separate infrastructure", "A dedicated emergency radio network with handsets issued to the response team"], "answers": [0, 1, 2, 3], "why": ["Correct — the identity dependency re-attaches the channel to compromised infrastructure. Independence includes authentication.", "Correct — SIM swap moves the SMS endpoint to the attacker; the path is no longer yours.", "Correct — routing through the corporate VPN rides the primary infrastructure the attacker may own or block.", "Correct — same server means same blast radius; the fallback dies with the primary.", "Wrong — this one passes: separate identity plus separate infrastructure is the genuine article.", "Wrong — this one passes: a dedicated radio network does not touch the corporate environment at all."], "explanation": "<p>Independence is end-to-end: <b>path<\/b> (not the corporate VPN), <b>identity<\/b> (not the compromised SSO), <b>endpoint<\/b> (not a SIM-swapped handset), and <b>platform<\/b> (not the same mail server). Two setups pass because nothing in the chain touches the compromised environment. Architecture reviews that only ask &quot;is the app different?&quot; miss the first four.<\/p>", "idx": 7}, {"id": "H09", "type": "order", "summary": "Rank the communications moves", "scenario": "<p>Active mailbox compromise at Northwind. A supplier bank-details change is pending; the office chat is suspected watched; monitoring is live.<\/p>", "question": "Rank the four moves from first to last.", "hint": "First cut the adversary's view of you, then handle the live fraud window, then inform, and only afterwards normalise.", "steps": ["Move incident coordination to the OOB channel", "Verify the pending bank-details change via OOB call-back", "Notify affected teams and stakeholders through the OOB channel", "Resume normal in-network communication after checks pass"], "explanation": "<p>The ranking follows dependency and risk. Coordination moves to OOB <b>first<\/b> — every later step is discussed there, out of the adversary's sight. The pending wire is verified <b>second<\/b>: the fraud window is live and the OOB path is now ready for it. Stakeholder notification comes <b>third<\/b> — informed, on the trusted path. Normalisation is <b>last<\/b>, only after monitoring and verification agree the in-network path is clean again.<\/p>", "idx": 8}, {"id": "H10", "type": "fill", "summary": "Complete the CTI briefing", "scenario": "<p>The Ashvale CTI team briefs the board on why ransomware crews watch chat. Three words are missing.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Briefing draft (excerpts)<\/div><div class=\"art-body\"><p>B-1 Crews read in-network chat to learn the (1)____ plan and pre-empt containment.<\/p><p>B-2 The page's answer is a planned (2)____ channel the adversary cannot read.<\/p><p>B-3 For chat specifically, the addressed technique is (3)____.<\/p><\/div><\/div>", "question": "Choose the three missing words.", "hint": "Blank 1: what the crews want to learn. Blank 2: the mitigation's channel. Blank 3: the chat sub-technique ID.", "template": "B-1 Crews read in-network chat to learn the {{0}} plan and pre-empt containment.<br>B-2 The page's answer is a planned {{1}} channel the adversary cannot read.<br>B-3 For chat specifically, the addressed technique is {{2}}.", "bank": ["response", "out-of-band", "T1213.005", "recovery", "in-network", "T1489", "T1114.001", "satellite"], "answers": ["response", "out-of-band", "T1213.005"], "why": ["Blank 1: the adversary wants your response plan — the faster they know it, the better they dodge it.", "Blank 2: M1060's answer is the out-of-band channel, planned in advance.", "Blank 3: T1213.005 Messaging Applications is the chat sub-technique the page addresses.", "&quot;Recovery&quot; is a later IR phase; the chat-leak risk is to the live response plan.", "&quot;In-network&quot; is exactly the channel the adversary can read — the wrong answer in a briefing.", "T1489 is Service Stop — an Impact technique, not the chat one.", "T1114.001 is local email collection — email, not chat.", "&quot;Satellite&quot; is a channel example, not the page's planned-channel term for blank 2."], "explanation": "<p>Threat-intel briefings translate the mitigation into adversary behaviour: crews read in-network chat (<b>T1213.005<\/b>) to learn and pre-empt the <b>response<\/b> plan; the M1060 answer is a <b>planned out-of-band<\/b> channel. Boards fund what they understand — the three blanks are the briefing's spine.<\/p>", "idx": 9}, {"id": "H11", "type": "triage", "summary": "A contractor, a reset, and 02:00", "scenario": "<p>02:10. A contractor emails the helpdesk: &quot;Locked out, please reset my manager's VPN password for the 06:00 change window.&quot; The manager is listed as travelling. Helpdesk policy allows email requests with manager CC — an attacker who owns the CC'd mailbox controls the whole loop.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Helpdesk ticket #77121<\/div><div class=\"art-body\"><pre>Requester: contractor-jlev@vendorhub.example\nRequest:   password reset for mgr-dkane@ashvalebank.example\nJustification: urgent, 06:00 change window\nCC:        mgr-dkane@ashvalebank.example (auto-reply received)\nNote:      mgr-dkane mailbox shows auto-reply \"travelling, limited access\"<\/pre><\/div><\/div>", "question": "Two decisions. The least aggressive correct answer wins in step two.", "hint": "Step 1: how to verify a critical action when email itself is the attack surface. Step 2: what if the OOB contact does not answer at 02:00?", "steps": [{"situation": "How should the helpdesk verify this reset request?", "options": [{"text": "Call the manager on the number from the OOB contact tree and verify the request", "correct": true, "why": "Password resets are critical actions. The OOB line to a known number breaks the loop the attacker controls (both mailboxes)."}, {"text": "Approve it — the manager's CC auto-reply looks legitimate", "correct": false, "why": "The auto-reply proves nothing: an attacker controlling the mailbox controls its auto-replies too."}, {"text": "Reply to the contractor asking for a signed form by email", "correct": false, "why": "Email is the attacker's channel. A form sent and returned by email changes nothing."}]}, {"situation": "The OOB contact does not answer after three attempts at 02:00. What now?", "options": [{"text": "Hold the reset until verified, and use the second OOB mechanism (emergency line) or wait for the manager's known working hours", "correct": true, "why": "The least aggressive correct action: a held reset costs a scheduling delay; an unverified reset can hand an attacker a privileged account."}, {"text": "Approve the reset anyway — the 06:00 window justifies it", "correct": false, "why": "Deadline pressure is the attacker's tool. An unverified reset for a privileged account is exactly the outcome they want."}, {"text": "Disable the manager's account entirely to be safe", "correct": false, "why": "Aggressive and service-impacting: it locks a legitimate user out of everything without stopping the email-based approach."}]}], "explanation": "<p>The page's guidance for critical actions &quot;initiated via email — such as password resets&quot; is <b>OOB verification<\/b>. The artefact's CC-loop shows why: the attacker may control every mailbox in the thread. Step two applies the HARD rule that the least aggressive correct action wins — a held reset is recoverable; a fraudulent reset or a mass account lockout are both worse outcomes in different directions.<\/p>", "idx": 10}, {"id": "H12", "type": "spot", "summary": "Spot the flaws in the OOB runbook", "scenario": "<p>Audit found the Ashvale OOB runbook contains three design flaws that break independence or delivery.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — OOB runbook v2.1 (excerpts)<\/div><div class=\"art-body\"><pre>1. OOB contact list: stored on the finance file share (join-domain, mail-adjacent).\n2. Activation criteria: any responder may activate on suspicion of compromise.\n3. Emergency chat app: authenticates via corporate SSO for convenience.\n4. Test cadence: quarterly end-to-end test message with delivery receipt.\n5. Alert delivery: SOC alerts about mail-rule changes go to the OOB channel.\n6. Backup path for OOB alerts: copy of each alert also filed into the responder in-network inbox.<\/pre><\/div><\/div>", "question": "Click the three flawed lines.", "hint": "Two flaws tie the channel to compromised-able infrastructure; one routes alerts back into the adversary's reach.", "lines": [{"text": "OOB contact list: stored on the finance file share (join-domain, mail-adjacent).", "bad": true, "why": "Domain-joined and mail-adjacent means the same compromise that takes mail can take the contact list. It must live outside the blast radius."}, {"text": "Activation criteria: any responder may activate on suspicion of compromise.", "bad": false, "why": "Good design: low-friction activation criteria mean the channel comes up early, not after committee."}, {"text": "Emergency chat app: authenticates via corporate SSO for convenience.", "bad": true, "why": "The SSO dependency re-attaches the channel to the compromised identity plane. Convenience is the classic reason independence dies."}, {"text": "Test cadence: quarterly end-to-end test message with delivery receipt.", "bad": false, "why": "Good design: regular end-to-end tests with receipts catch silent breakage."}, {"text": "Alert delivery: SOC alerts about mail-rule changes go to the OOB channel.", "bad": false, "why": "Good design: alerts about collection travel on the path the adversary cannot read or block."}, {"text": "Backup path for OOB alerts: copy of each alert also filed into the responder in-network inbox.", "bad": true, "why": "The &quot;backup&quot; copy lands exactly where the adversary watches. It leaks that detection is happening and can be silenced with the inbox."}], "explanation": "<p>Three flaws, one theme: ties back to the compromised environment. The contact list on a domain-joined share, the SSO login for convenience, and the &quot;backup&quot; copy into the in-network inbox all hand the adversary reach into the last trusted path. The good lines show the working parts: free activation, tested delivery, and OOB-routed detection alerts.<\/p>", "idx": 11}, {"id": "H13", "type": "qcm", "summary": "The alerts fired — so why is the attacker still reading email?", "scenario": "<p>Northwind configured OOB alerts for mail-rule changes last month. This morning's review shows a forwarding rule created at 08:12, the OOB alert delivered at 08:12, and — the telemetry analyst's finding — the adversary session still actively reading the mailbox at 08:40 after the rule was removed.<\/p>", "question": "What explains the finding?", "hint": "The obvious answer is &quot;the alerts did not work&quot;. They did — but what do alerts actually do?", "options": ["The alerts failed to fire and must be reconfigured", "OOB alerts are a detective mechanism — they notify defenders; they do not stop collection by themselves", "The forwarding rule was the wrong thing to alert on", "The adversary must have a second forwarding rule that was missed"], "answer": 1, "why": ["Wrong — the alert fired at 08:12, one minute after the rule. Detection worked exactly as designed.", "Correct — M1060's alert mechanism is detective: it tells the security team on a trusted path. Stopping the reading requires the response (kill the session, verify requests). Alerting is not blocking.", "Wrong — forwarding rules are precisely one of the named patterns to alert on.", "Wrong — nothing in the telemetry indicates a second rule; the reading continued because nobody closed the session, not because detection missed a rule."], "explanation": "<p>The trap: equating &quot;alert delivered&quot; with &quot;attack stopped&quot;. The M1060 alert mechanism is <b>detective<\/b> — it raises the alarm on a path the adversary cannot silence. What happens next is response: end the session, remove the rule, verify pending critical actions through OOB. A SOC that believes its alerts are preventive learns the difference during exactly this kind of review.<\/p>", "idx": 12}, {"id": "H14", "type": "dnd", "summary": "Sort the mechanisms by control role", "scenario": "<p>The GRC team classifies each M1060 mechanism for the control framework.<\/p>", "question": "Drag each mechanism into its control role.", "hint": "Preventive stops the bad request from succeeding. Detective raises the alarm. Resilience keeps the function alive when other things die.", "zones": [{"id": "preventive", "label": "Preventive — stops the bad action"}, {"id": "detective", "label": "Detective — raises the alarm"}, {"id": "resilience", "label": "Resilience — keeps the function alive"}], "items": [{"label": "OOB verification of payment changes requested by email", "zone": "preventive", "why": "Verification blocks the fraudulent action before it is approved — preventive by design."}, {"label": "OOB alerts on mass forwarding rules", "zone": "detective", "why": "Alerts reveal the collection setup — classic detective control."}, {"label": "Pre-agreed OOB channel that takes over when chat/email are untrusted", "zone": "resilience", "why": "The channel's job is continuity: the function survives the failure of the primary path."}, {"label": "Quarterly end-to-end test message on the OOB channel", "zone": "detective", "why": "The test detects silent breakage of the channel before an incident does."}], "explanation": "<p>One mitigation, three control roles: the <b>verification<\/b> mechanism is preventive (it stops fraudulent resets and payments), the <b>alert<\/b> mechanism is detective (it exposes collection), and the <b>planned channel<\/b> is resilience (continuity when T1489 or compromise takes the primary path down). Presenting M1060 as one &quot;preventive control&quot; would misstate most of its value.<\/p>", "idx": 13}, {"id": "H15", "type": "multi", "summary": "Two best moves, mixed artefacts", "scenario": "<p>08:55. Northwind: forwarding rules on finance mailboxes, a pending bank-details change, and chatter suggesting the adversary reads the office chat. You get one decision slot before the daily exec sync.<\/p>", "question": "Select the two best M1060-grounded moves for this slot.", "hint": "One move answers the channel problem, one answers the fraud problem. The rejects are aggressive, destructive, or leaky.", "options": ["Activate the planned OOB channel and move incident coordination to it", "Verify the pending bank-details change via OOB call-back before the exec sync", "Block all external email company-wide until the situation clears", "Wipe the affected mailboxes to stop collection before the exec sync", "Post a summary of the incident in the office chat so everyone is informed"], "answers": [0, 1], "why": ["Correct — with the chat suspected watched, the OOB channel activation is the move that takes the adversary's eyes off your decisions.", "Correct — the bank-details change is a live critical action; OOB verification closes the fraud window regardless of what the exec sync decides.", "Wrong — a company-wide mail block is disproportionate for a scoped incident and does not verify the request or fix the channel.", "Wrong — wiping mailboxes destroys evidence (and possibly the exec sync's own context). Contain surgically: remove rules, kill sessions.", "Wrong — the chat is suspected watched. Posting a summary there hands the adversary your status report."], "explanation": "<p>Two moves dominate: <b>take the channel back<\/b> (activate OOB coordination) and <b>close the fraud window<\/b> (verify the wire out-of-band). Everything else is either disproportionate (company-wide blocks), destructive (wipes), or actively leaks to the adversary (posting in watched chat). Under time pressure, the two moves that survive scrutiny are the ones the page itself prescribes.<\/p>", "idx": 14}, {"id": "H16", "type": "fill", "summary": "Complete the satellite-channel assessment", "scenario": "<p>Ashvale evaluates a satellite messaging channel for its northern sites. Two words are missing from the assessment.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Assessment draft<\/div><div class=\"art-body\"><p>S-1 Satellite links keep working when terrestrial infrastructure is (1)____.<\/p><p>S-2 Trade-off: handsets must be (2)____ ahead of incidents and tested, or the channel exists only on paper.<\/p><\/div><\/div>", "question": "Choose the two missing words.", "hint": "Blank 1: the state of the normal infrastructure during a disaster. Blank 2: what must happen to devices before the incident.", "template": "S-1 Satellite links keep working when terrestrial infrastructure is {{0}}.<br>S-2 Trade-off: handsets must be {{1}} ahead of incidents and tested, or the channel exists only on paper.", "bank": ["unavailable", "provisioned", "faster", "cheaper", "optional", "unlimited"], "answers": ["unavailable", "provisioned"], "why": ["Blank 1: the point of satellite is independence — it works when the normal infrastructure is unavailable, compromised, or destroyed.", "Blank 2: provisioning (issue, configure, train, test) is the real cost of a satellite channel; skip it and the channel is theoretical.", "&quot;Faster&quot; is not the promise; satellite is about independence, not speed.", "&quot;Cheaper&quot; is wrong — satellite channels are typically the expensive option; that is their trade-off, not their feature.", "&quot;Optional&quot; undermines the design: devices must be ready, not optional.", "&quot;Unlimited&quot; is marketing language, not an engineering property."], "explanation": "<p>Satellite communications are one of the page's four channel examples precisely because they survive terrestrial failure. The honest assessment includes the trade-off: <b>provisioning and testing<\/b> cost time and money before any incident, which is why the governance around who carries the handsets and when they are tested matters as much as the radio link itself.<\/p>", "idx": 15}], "introTitle": "M1060 — HARD practice exam", "pageLabel": "M1060 — Out-of-Band Communications Channel (MITRE ATT&CK Mitigation, Enterprise)"};

/* ============================ UTILITIES ============================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtTime(sec){
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
var SEV_COLOR = { 'EASY': 'var(--sev-easy)', 'MEDIUM': 'var(--sev-medium)', 'HARD': 'var(--sev-hard)', 'EXTREMELY HARD': 'var(--sev-extreme)' };

/* ============================ SESSION STATE ============================ */
var S = null;           /* session */
var tickHandle = null;  /* 1s interval */
var attemptReported = false;

function newSession(){
  return {
    order: shuffle(DATA.exercises.map(function(e,i){ return i; })),
    idx: 0,                     /* position in order */
    credits: {},                /* exIndex -> credit (float) */
    hinted: {},                 /* exIndex -> true */
    checked: {},                /* exIndex -> true */
    skippedPool: [],            /* exIndexes skipped and not yet answered */
    timer: { remain: DATA.timerMinutes * 60, state: 'IDLE', prevState: null },
    pause: { manualSec: 0, feedbackSec: 0, mark: null },
    widgetState: {},            /* per-exercise renderer scratch */
    terminalClock: {},          /* exIndex -> remaining seconds */
    reviewReturn: false         /* true while the current exercise was returned from the review screen */
  };
}

/* ============================ TIMER STATE MACHINE ============================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED  (IDLE before start)
   Explicit transitions only. */
function tstate(){ return S.timer.state; }
function tset(st){
  var from = S.timer.state;
  if (from === st) return;
  /* accumulate pause statistics on leaving a paused state */
  var now = Date.now();
  if (S.pause.mark) {
    var d = (now - S.pause.mark) / 1000;
    if (from === 'PAUSED_MANUAL') S.pause.manualSec += d;
    if (from === 'PAUSED_AUTO_CHECK') S.pause.feedbackSec += d;
    S.pause.mark = null;
  }
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') S.pause.mark = now;
  S.timer.prevState = (st === 'PAUSED_MANUAL') ? from : S.timer.prevState;
  S.timer.state = st;
  renderTimer();
}
function startClock(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    if (!S) return;
    if (S.timer.state !== 'RUNNING') return;
    S.timer.remain -= 1;
    /* terminal per-exercise clock (EXTREMELY HARD terminal only) */
    var ex = curEx();
    if (ex && ex.type === 'terminal' && !S.checked[ex.idx] && S.terminalClock[ex.idx] > 0) {
      S.terminalClock[ex.idx] -= 1;
      var te = $('term-clock');
      if (te) te.textContent = '⏱ Command window: ' + fmtTime(S.terminalClock[ex.idx]) + ' remaining';
      if (S.terminalClock[ex.idx] === 0) {
        var ti = $('term-input');
        if (ti) { ti.disabled = true; }
        if (te) te.textContent = '⏱ Command window ended — press Check to submit what you have.';
      }
    }
    if (S.timer.remain <= 0) {
      S.timer.remain = 0;
      endExam(true);
      return;
    }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  var el = $('hdr-timer');
  if (!el) return;
  var st = S ? S.timer.state : 'IDLE';
  var icon = '▶', word = 'RUNNING', color = 'var(--state-correct)';
  if (st === 'PAUSED_MANUAL') { icon = '⏸'; word = 'PAUSED — manual (press Resume)'; color = 'var(--state-paused)'; }
  else if (st === 'PAUSED_AUTO_CHECK') { icon = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; color = 'var(--state-paused)'; }
  else if (st === 'ENDED') { icon = '⏹'; word = 'ENDED'; color = 'var(--state-incorrect)'; }
  else if (st === 'IDLE') { icon = '⏱'; word = 'READY'; }
  var t = S ? fmtTime(S.timer.remain) : fmtTime(DATA.timerMinutes * 60);
  el.innerHTML = '<span class="timer-val mono">' + t + '</span> ' +
    '<span class="timer-state" style="color:' + color + '">' + icon + ' ' + word + '</span>';
  var p = $('pause-btn');
  if (p) {
    if (st === 'PAUSED_MANUAL') { p.textContent = '▶ Resume'; p.disabled = false; }
    else if (st === 'PAUSED_AUTO_CHECK') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else if (st === 'RUNNING') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else { p.textContent = '⏸ Pause'; p.disabled = true; }
  }
}

/* ============================ SCORING ============================ */
/* Mandatory formula: credit = max(0, (H - W) / N) */
function scoreExercise(H, W, N){
  if (N <= 0) return 0;
  return Math.max(0, (H - W) / N);
}
function liveScore(){
  var sum = 0, count = 0;
  Object.keys(S.checked).forEach(function(k){
    if (S.checked[k]) { sum += (S.credits[k] || 0); count += 1; }
  });
  return { sum: sum, count: count };
}
function renderScore(){
  var el = $('hdr-score');
  if (!el) return;
  var ls = liveScore();
  if (ls.count === 0) { el.innerHTML = 'Score <b>0.0 / 0</b>'; return; }
  var pct = Math.round((ls.sum / ls.count) * 100);
  el.innerHTML = 'Score <b>' + ls.sum.toFixed(1) + ' / ' + ls.count + '</b> · ' + pct + '%';
}

/* ============================ VIEWS ============================ */
function showView(name){
  ['intro','exam','review','results'].forEach(function(v){
    var el = $('view-' + v);
    if (el) el.classList.toggle('active', v === name);
  });
  window.scrollTo(0, 0);
}

/* ============================ INTRO ============================ */
function renderIntro(){
  var h = '';
  h += '<div class="card intro-head">';
  h += '<h1>' + esc(DATA.introTitle) + '</h1>';
  h += '<div class="muted">' + esc(DATA.pageLabel) + '</div>';
  h += '<div class="factrow">';
  h += fact('Severity', '<span class="badge sev" id="intro-sev" style="color:' + SEV_COLOR[DATA.severityWord] + ';border-color:' + SEV_COLOR[DATA.severityWord] + '"><span aria-hidden="true">' + DATA.sevIcon + '</span> ' + DATA.severityWord + '</span>');
  h += fact('Exercises in this file', String(DATA.exercises.length));
  h += fact('Estimated time', DATA.estimatedMinutes + ' min');
  h += fact('Timer budget', DATA.timerMinutes + ' min countdown');
  h += fact('Pass mark', DATA.passMark + '%');
  h += '</div></div>';
  h += '<div class="card learn"><h2 class="sec-title">' + DATA.learnTitle + '</h2>' + DATA.learnHTML + '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.kwTitle + '</h2>';
  DATA.keywords.forEach(function(kw){
    h += '<div class="kw-theme"><div class="kw-name">' + esc(kw.theme) + '</div><ul>';
    kw.items.forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.howTitle + '</h2>' + DATA.howHTML + DATA.howExtra;
  h += '<ul class="rules">';
  h += '<li><b>Pass mark:</b> you need at least <b>70%</b> to pass. A PASS means you showed a working understanding of ' + esc(DATA.mitreId) + ' at this difficulty. A FAIL means you should read the feedback again and retake.</li>';
  h += '<li><b>Exercise types in this file:</b> ' + DATA.typesUsed.join(', ') + '.</li>';
  h += '<li><b>Timer:</b> a ' + DATA.timerMinutes + '-minute countdown runs for the whole file. The <b>⏸ Pause</b> button stops the timer and hides the exercise for a real break. When you press <b>Check</b>, the timer stops automatically so you can read the feedback for as long as you want; it starts again only when you press <b>Next</b>.</li>';
  h += '<li><b>Partial credit:</b> exercises with several correct items give partial credit. Each correct item adds credit, each wrong item removes credit: credit = (correct − wrong) ÷ items, never below 0.</li>';
  h += '<li><b>Hint:</b> one hint per exercise. A hint costs 10% of that exercise&#39;s credit.</li>';
  h += '<li><b>Skipped exercises:</b> you can skip any exercise. Before the exam can finish, you get a review screen where you can go back to skipped exercises and answer them while the timer is not ended. Skipped exercises you never answer are simply excluded from your score.</li>';
  h += '</ul>';
  h += '<div class="startrow"><button class="primary" id="start-btn">▶ Start the exam</button></div></div>';
  $('intro-body').innerHTML = h;
  $('start-btn').addEventListener('click', startExam);
}
function fact(k, v){ return '<div class="fact"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

/* ============================ EXAM FLOW ============================ */
function startExam(){
  S = newSession();
  attemptReported = false;
  tset('RUNNING'); /* from IDLE */
  S.timer.state = 'RUNNING';
  startClock();
  renderTopbar();
  showView('exam');
  renderCurrent();
}
function curEx(){
  if (!S || S.idx >= S.order.length) return null;
  return DATA.exercises[S.order[S.idx]];
}
function renderTopbar(){
  var ex = curEx();
  $('hdr-topic').textContent = DATA.mitreId + ' · ' + DATA.shortName;
  var sev = $('hdr-sev');
  sev.textContent = DATA.sevIcon + ' ' + DATA.severityWord;
  sev.style.color = SEV_COLOR[DATA.severityWord];
  sev.style.borderColor = SEV_COLOR[DATA.severityWord];
  $('hdr-count').textContent = ex ? ('Exercise ' + (S.idx + 1) + ' of ' + S.order.length) : '';
  document.documentElement.style.setProperty('--sev-current', SEV_COLOR[DATA.severityWord]);
  renderTimer(); renderScore();
  var prog = (S.idx / S.order.length) * 100;
  $('prog-fill').style.width = prog + '%';
}
function renderCurrent(){
  var ex = curEx();
  if (!ex) { openReview(); return; }
  renderTopbar();
  renderExercise(ex);
}
function markChecked(exIdx, credit){
  S.checked[exIdx] = true;
  S.credits[exIdx] = credit;
  /* remove from skipped pool if it was there (review-skipped answered) */
  var p = S.skippedPool.indexOf(exIdx);
  if (p >= 0) S.skippedPool.splice(p, 1);
  renderScore();
}

/* --- Check: grade, apply hint penalty, auto-pause, render feedback --- */
function onCheck(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  var w = ex._widget;
  if (!w) return;
  var res = w.grade();
  if (res === null) { /* nothing answered */
    var nb = $('check-nudge');
    if (nb) { nb.style.display = 'block'; }
    return;
  }
  var credit = scoreExercise(res.H, res.W, res.N);
  if (S.hinted[ex.idx]) credit = Math.max(0, credit - 0.10);
  /* Auto-pause FIRST (timer stops before feedback renders) */
  tset('PAUSED_AUTO_CHECK');
  markChecked(ex.idx, credit);
  w.showFeedback(credit, res);
  var chk = $('check-btn'), nxt = $('next-btn');
  chk.disabled = true;
  if (S.idx === S.order.length - 1) { nxt.textContent = 'Final Submit'; }
  nxt.disabled = false;
  nxt.focus();
}
/* --- Skip: no auto-pause, timer keeps running --- */
function onSkip(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  /* A returned skipped exercise goes back to the review screen on Skip,
     never forward into the already-walked main flow. */
  if (S.reviewReturn) { S.reviewReturn = false; openReview(); return; }
  if (S.skippedPool.indexOf(ex.idx) < 0) S.skippedPool.push(ex.idx);
  if (S.idx === S.order.length - 1) { openReview(); return; }
  S.idx += 1;
  renderCurrent();
}
/* --- Next / Final Submit: resumes the timer from the auto-pause --- */
function onNext(){
  S.reviewReturn = false; /* leaving the returned exercise in every path below */
  var back = $('next-btn').getAttribute('data-back') === '1';
  if (S.timer.state === 'PAUSED_AUTO_CHECK') {
    if (back) { tset('RUNNING'); openReview(); return; }
    if (S.idx === S.order.length - 1) { tset('RUNNING'); openReview(); return; }
    tset('RUNNING');
    S.idx += 1;
    renderCurrent();
  } else if (S.timer.state === 'RUNNING') {
    if (back) { openReview(); return; }
    /* learner pressed Next without Check (should not happen: Next hidden pre-check) */
    if (S.idx === S.order.length - 1) { openReview(); return; }
    S.idx += 1;
    renderCurrent();
  }
}
/* --- Manual pause: hides the exercise --- */
function onPause(){
  if (!S) return;
  var st = S.timer.state;
  if (st !== 'RUNNING' && st !== 'PAUSED_AUTO_CHECK') return;
  tset('PAUSED_MANUAL');
  $('pause-veil').classList.add('active');
}
function onResume(){
  var back = (S.timer.prevState === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
  tset(back);
  $('pause-veil').classList.remove('active');
}

/* ============================ HINT ============================ */
function onHint(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx] || S.hinted[ex.idx]) return;
  S.hinted[ex.idx] = true;
  var hp = $('hint-panel');
  hp.style.display = 'block';
  hp.innerHTML = '<div class="hint-head">💡 Hint — costs 10% of this exercise&#39;s credit</div><div>' + esc(ex.hint) + '</div>';
  $('hint-btn').disabled = true;
}

/* ============================ REVIEW SKIPPED ============================ */
function openReview(){
  var box = $('review-body');
  var h = '';
  if (S.skippedPool.length === 0) {
    h += '<p>No skipped exercises are waiting. You can submit now.</p>';
  } else {
    h += '<p>These exercises are skipped. You can return to any of them and answer it, as many times as you need, while the timer has not ended. If you submit while they are still unanswered, they are excluded from your score.</p><div class="revlist">';
    S.skippedPool.forEach(function(ix, n){
      var ex = DATA.exercises[ix];
      h += '<div class="revitem"><span class="rev-ic">⚠ Skipped</span><span>' + (n + 1) + '. ' + esc(ex.summary) + '</span>' +
           '<button data-ix="' + ix + '">Return to it</button></div>';
    });
    h += '</div>';
  }
  var ls = liveScore();
  h += '<div class="card" style="margin-top:14px"><b>Answered so far:</b> ' + ls.count + ' of ' + S.order.length +
       ' · current credit <b>' + ls.sum.toFixed(1) + '</b> · time left <b class="mono">' + fmtTime(S.timer.remain) + '</b></div>';
  h += '<div class="navrow"><span class="spacer"></span><button class="primary" id="final-submit-btn">Final Submit — see results</button></div>';
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('button[data-ix]'), function(b){
    b.addEventListener('click', function(){
      var ix = parseInt(b.getAttribute('data-ix'), 10);
      /* resume timer while working on the skipped exercise (blocked only on true timeout) */
      if (S.timer.remain <= 0) return;
      if (S.checked[ix]) return; /* already answered — never re-enter an answered exercise */
      if (S.timer.state !== 'RUNNING') tset('RUNNING');
      var pos = S.order.indexOf(ix);
      if (pos >= 0) S.idx = pos;
      showView('exam');
      renderCurrent();
      /* Next from a returned skipped exercise goes back to the review screen */
      var nxt = $('next-btn');
      nxt.setAttribute('data-back', '1');
      S.reviewReturn = true;
    });
  });
  $('final-submit-btn').addEventListener('click', function(){
    if (S.timer.remain > 0) tset('ENDED');
    showResults();
  });
  showView('review');
}

/* ============================ RESULTS ============================ */
function showResults(){
  var answeredIdx = Object.keys(S.checked).filter(function(k){ return S.checked[k]; });
  var sum = 0;
  answeredIdx.forEach(function(k){ sum += S.credits[k]; });
  var answered = answeredIdx.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= DATA.passMark;
  var fully = 0, partly = 0, partlySum = 0, zero = 0;
  answeredIdx.forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.9999) fully += 1;
    else if (c > 0) { partly += 1; partlySum += c; }
    else zero += 1;
  });
  var skippedNever = S.order.length - answered;
  var h = '';
  h += '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">';
  h += '<div class="v-big">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>';
  h += '<div class="muted">' + esc(DATA.introTitle) + '</div>';
  h += '<div style="font-size:20px;margin-top:8px">Final score: <b>' + sum.toFixed(1) + ' / ' + answered + '</b> — <b>' + percent + '%</b> <span class="muted">(pass mark ' + DATA.passMark + '%)</span></div>';
  h += '</div>';
  h += '<div class="res-grid">';
  h += resCell('ok', '✓ Fully correct', String(fully), 'state-correct');
  h += resCell('part', '✓ Partially correct', String(partly) + (partly > 0 ? ' <span class="small muted">(avg ' + (partlySum / partly).toFixed(2) + ')</span>' : ''), 'state-partial');
  h += resCell('bad', '✗ Fully incorrect', String(zero), 'state-incorrect');
  h += resCell('skip', '⚠ Skipped — excluded', String(skippedNever), 'state-skipped');
  h += '</div>';
  h += '<div class="card"><h3 class="sec-title">Time report</h3>';
  h += '<p>Time paused manually (breaks): <b>' + fmtTime(Math.round(S.pause.manualSec)) + '</b></p>';
  h += '<p>Time spent reviewing feedback (auto-pause): <b>' + fmtTime(Math.round(S.pause.feedbackSec)) + '</b></p>';
  h += '<p>Timer left when the exam ended: <b class="mono">' + fmtTime(S.timer.remain) + '</b></p></div>';
  h += '<div class="startrow"><button class="amberbtn" id="retake-btn">↻ Retake Exam</button></div>';
  $('results-body').innerHTML = h;
  $('retake-btn').addEventListener('click', function(){
    renderIntro();
    showView('intro');
  });
  showView('results');
  reportScore(sum, answered, percent, passed);
}
function resCell(cls, label, num, colvar){
  return '<div class="res-cell ' + cls + '"><div class="num" style="color:var(--' + colvar + ')">' + num + '</div>' +
         '<div class="muted">' + label + '</div></div>';
}

/* ============================ SITE REPORT (STEP 6.2) ============================ */
function reportScore(creditSum, answeredCount, percent, passed){
  if (attemptReported) return;
  attemptReported = true;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: DATA.topicId,
      batch: DATA.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* ============================ HANDSHAKE (STEP 6.3) ============================ */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
