<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>M1060 — EASY practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "m1060",
  "batch": 1,
  "title": "M1060 Out-of-Band Communications Channel \u2014 EASY",

  "passMark": 70
}
</script>
<style>

:root {
  --bg-page: #0b1020;
  --bg-surface: #121a2e;
  --bg-surface-2: #0f1729;
  --border: #243049;
  --text-primary: #e6ecff;
  --text-secondary: #a9b4d0;
  --text-mono: #c8ffd4;
  --accent-blue: #5aa9ff;
  --accent-amber: #ffb454;
  --accent-green: #57d38c;
  --state-correct: #57d38c;
  --state-partial: #ffb454;
  --state-incorrect: #ff6b6b;
  --state-skipped: #a9b4d0;
  --state-paused: #9d7bff;
  --sev-easy: #57d38c;
  --sev-medium: #ffb454;
  --sev-hard: #ff8a3d;
  --sev-extreme: #ff6b6b;
  /* derived dark-theme roles (defined once, consumed everywhere) */
  --bg-topbar: #0d1326;
  --bg-hover-btn: #18213a;
  --border-hover-btn: #33415f;
  --bg-hover-opt: #141d36;
  --bg-chip: #16203a;
  --on-primary: #06220f;
  --on-amber: #2a1a02;
  --syn-ts: #8fa3c8;
  --syn-ip: #7fd4ff;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-page);
  color: var(--text-primary);
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
code, pre, .mono, .log-line, .term-input, .timer-val {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-size: 14.5px;
}
.view { display: none; padding: 0 0 48px 0; }
.view.active { display: block; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 18px; }

/* ---------- cards & shared ---------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  padding: 18px 20px;
  margin: 16px 0;
}
.card h2, .card h3 { margin-top: 0; }
.sec-title {
  font-size: 19px;
  margin: 0 0 10px 0;
  letter-spacing: 0.2px;
}
.muted { color: var(--text-secondary); }
.small { font-size: 13.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 600;
  font-size: 13.5px;
  background: var(--bg-surface-2);
  color: var(--text-primary);
  white-space: nowrap;
}
.badge.sev { border-width: 2px; background: transparent; }
button {
  font: inherit;
  color: var(--text-primary);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  min-height: 44px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-hover-btn); border-color: var(--border-hover-btn); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: var(--on-primary);
  font-weight: 700;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.amberbtn {
  background: var(--accent-amber);
  border-color: var(--accent-amber);
  color: var(--on-amber);
  font-weight: 700;
}
button:focus-visible, .opt:focus-visible, .chip:focus-visible, .blank:focus-visible,
.zone:focus-visible, select:focus-visible, input:focus-visible, .spot-line:focus-visible {
  outline: 3px solid var(--accent-blue);
  outline-offset: 2px;
}
a, .linkish { color: var(--accent-blue); }

/* ---------- intro ---------- */
.intro-head { margin-top: 18px; }
.intro-head h1 { margin: 0 0 6px 0; font-size: 26px; line-height: 1.25; }
.factrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.fact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 120px;
}
.fact .k { color: var(--text-secondary); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; }
.fact .v { font-weight: 700; font-size: 15.5px; }
.learn p { margin: 8px 0; }
.kw-theme {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 10px 14px;
  margin: 10px 0;
}
.kw-theme .kw-name { font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; }
.kw-theme ul { margin: 4px 0 2px 0; padding-left: 20px; }
.kw-theme li { margin: 3px 0; }
.rules li { margin: 6px 0; }
.startrow { text-align: center; margin-top: 18px; }
.startrow button { font-size: 18px; padding: 14px 42px; }

/* ---------- sticky exam header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 8px 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
.topbar .topic { font-weight: 700; font-size: 14.5px; }
.topbar .spacer { flex: 1 1 0; }
.topbar button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.timerbox { display: inline-flex; align-items: center; gap: 8px; }
.timer-val { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.timer-state { font-size: 12.5px; font-weight: 700; }
.scorebox { font-size: 14.5px; color: var(--text-secondary); }
.scorebox b { color: var(--text-primary); font-size: 16px; }
.progresswrap {
  max-width: 1080px; margin: 0 auto; height: 5px;
  background: var(--bg-surface-2);
  border-radius: 0 0 3px 3px; overflow: hidden;
}
.progressbar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sev-current, var(--accent-blue)), var(--accent-blue));
  position: relative;
  transition: width 0.3s ease;
}
.progressbar::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(230,236,255,0.25) 50%, transparent 70%);
  animation: sheen 2.8s linear infinite;
}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- exercise blocks ---------- */
.block {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  margin: 14px 0;
  overflow: hidden;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; letter-spacing: 1.2px; font-size: 13px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface-2);
}
.block-scenario { border-left-color: var(--accent-blue); }
.block-scenario .block-head { color: var(--accent-blue); }
.block-question { border-left-color: var(--accent-amber); }
.block-question .block-head { color: var(--accent-amber); }
.block-answer { border-left-color: var(--accent-green); }
.block-answer .block-head { color: var(--accent-green); }
.block-body { padding: 14px 18px; }
.q-text { font-weight: 700; font-size: 16.5px; margin: 0; }
.collapse-btn {
  margin-left: auto; min-height: 30px; padding: 2px 10px; font-size: 12.5px;
  background: transparent; border: 1px solid var(--border);
}
.scen-summary { color: var(--text-secondary); font-size: 13px; padding: 6px 16px; display: none; }

/* artefact panels */
.artefact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 10px 0;
  overflow: hidden;
}
.artefact .art-label {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; letter-spacing: 0.8px;
  color: var(--accent-blue);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(90,169,255,0.06);
  text-transform: uppercase;
}
.artefact .art-body { padding: 10px 12px; }
.artefact p { margin: 6px 0; }

/* logs */
.logbox { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.logfilter { margin: 8px 0; }
.logfilter input {
  width: 100%; padding: 9px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary);
}
.log-line { padding: 3px 6px; white-space: pre-wrap; word-break: break-word; margin: 1px 0; border-radius: 3px; }
.log-line.logmark { background: rgba(255,180,84,0.10); }
.lg-ts { color: var(--syn-ts); }
.lg-key { color: var(--accent-amber); }
.lg-str { color: var(--text-mono); }
.lg-ok { color: var(--state-correct); }
.lg-bad { color: var(--state-incorrect); }
.lg-ip { color: var(--syn-ip); }
.lg-dim { color: var(--text-secondary); }

/* options */
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  min-height: 44px;
}
.opt:hover { background: var(--bg-hover-opt); }
.opt .opt-label { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.opt.selected { border-left: 4px solid var(--accent-green); background: rgba(87,211,140,0.07); box-shadow: 0 0 0 1px rgba(87,211,140,0.25); }
.opt.selected .selmark { color: var(--accent-green); font-weight: 700; margin-left: auto; font-size: 13px; }
.opt.sel-incorrect { border-left-color: var(--state-incorrect); }
.opt.sel-correct { border-left-color: var(--state-correct); }
.opt.opt-correct-reveal { border-left: 4px solid var(--state-correct); }
.opt.disabled { cursor: default; }

/* matching */
.matchrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.matchrow .mleft {
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; min-height: 44px;
}
.matchrow select {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--bg-page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
}

/* drag & drop */
.dnd-grid { display: grid; gap: 14px; }
.bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  background: var(--bg-surface-2);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 52px;
}
.chip {
  background: var(--bg-chip);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-height: 44px;
  cursor: grab;
  user-select: none;
  display: inline-flex; align-items: center;
}
.chip.armed { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(87,211,140,0.3); }
.chip.used { opacity: 0.35; cursor: default; }
.zones { display: grid; gap: 10px; }
.zones.cols2 { grid-template-columns: 1fr 1fr; }
.zones.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.zone {
  background: var(--bg-page);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 74px;
  cursor: pointer;
}
.zone h4 { margin: 0 0 6px 0; font-size: 13.5px; color: var(--accent-amber); }
.zone .zdrop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.zone.dragover { border-color: var(--accent-green); background: rgba(87,211,140,0.05); }
.zone .chip { cursor: pointer; }

/* ordering */
.orderlist { display: grid; gap: 8px; }
.orderitem {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 48px;
  cursor: grab;
}
.orderitem .pos { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.orderitem .updown { margin-left: auto; display: flex; gap: 4px; }
.orderitem .updown button { min-height: 34px; padding: 2px 10px; }
.orderitem.dragging { opacity: 0.5; }
.orderitem.dragover { border-color: var(--accent-green); }

/* fill blanks */
.filltext { font-size: 16.5px; line-height: 2.1; }
.blank {
  display: inline-block;
  min-width: 120px; min-height: 40px;
  background: var(--bg-surface-2);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  text-align: center;
  cursor: pointer;
  color: var(--text-primary);
}
.blank.armed { border-color: var(--accent-green); }
.blank.filled { border-style: solid; color: var(--text-mono); }
.blank.n1 { min-width: 90px; }
.chipbank { margin-top: 12px; }

/* spot the mistake */
.spotwrap { display: grid; gap: 6px; }
.spot-line {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer; min-height: 44px;
}
.spot-line .ln { color: var(--text-secondary); min-width: 34px; }
.spot-line.selected { border-left: 4px solid var(--accent-amber); background: rgba(255,180,84,0.06); }
.spot-line code { color: var(--text-mono); }

/* terminal */
.term {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.term-scroll {
  min-height: 90px; max-height: 240px; overflow-y: auto;
  margin-bottom: 10px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-prompt { color: var(--accent-green); font-weight: 700; }
.term-echo { color: var(--text-primary); }
.term-out { color: var(--text-mono); }
.term-row { display: flex; gap: 8px; align-items: center; }
.term-row .term-prompt { flex: 0 0 auto; }
.term-input {
  flex: 1; background: var(--bg-page); color: var(--text-mono);
  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
}
.extimer { color: var(--state-paused); font-weight: 700; font-size: 13.5px; }

/* triage / steps */
.stepflag {
  display: inline-block;
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: var(--accent-amber);
  border: 1px solid var(--accent-amber);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.triage-step { margin-bottom: 4px; }

/* hint + feedback */
.hintpanel {
  border: 1px solid var(--accent-amber);
  border-left-width: 4px;
  border-radius: 8px;
  background: rgba(255,180,84,0.06);
  padding: 10px 14px;
  margin: 12px 0;
  display: none;
}
.hintpanel .hint-head { color: var(--accent-amber); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.feedback { display: none; }
.fb-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-weight: 800; font-size: 15px; letter-spacing: 0.8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.fb-correct { color: var(--state-correct); }
.fb-partial { color: var(--state-partial); }
.fb-incorrect { color: var(--state-incorrect); }
.fb-excluded { color: var(--state-skipped); }
.credit-pill {
  border: 1px solid var(--border);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 13px;
  font-weight: 700;
}
.itemrows { display: grid; gap: 6px; margin: 10px 0; }
.itemrow {
  display: flex; gap: 10px; align-items: baseline;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 8px 12px;
}
.itemrow .ic { font-weight: 800; min-width: 110px; }
.itemrow.ir-ok .ic { color: var(--state-correct); }
.itemrow.ir-wrong .ic { color: var(--state-incorrect); }
.itemrow.ir-missed .ic { color: var(--state-skipped); }
.canon { margin: 10px 0; }
.canon code {
  display: block; background: var(--bg-page);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-mono);
  padding: 10px 12px;
  overflow-x: auto;
  cursor: pointer;
}
.danger-note { color: var(--state-incorrect); font-weight: 700; }
.navrow { display: flex; gap: 10px; margin: 16px 0 30px 0; flex-wrap: wrap; }
.navrow .spacer { flex: 1; }

/* pause overlay */
.pauseveil {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(11,16,32,0.93);
  display: none;
  align-items: center; justify-content: center;
}
.pauseveil.active { display: flex; }
.pausecard {
  text-align: center;
  background: var(--bg-surface);
  border: 2px solid var(--state-paused);
  border-radius: 10px;
  padding: 30px 40px;
  max-width: 460px;
}
.pausecard .big { font-size: 40px; color: var(--state-paused); }
.pausecard h3 { color: var(--state-paused); margin: 8px 0; }

/* review skipped */
.revlist { display: grid; gap: 8px; }
.revitem {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--state-skipped);
  border-radius: 6px;
  padding: 10px 14px;
}
.revitem .rev-ic { color: var(--state-skipped); font-weight: 800; }
.revitem button { margin-left: auto; min-height: 38px; }

/* results */
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.res-cell {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.res-cell .num { font-size: 26px; font-weight: 800; }
.res-cell.c-ok .num { color: var(--state-correct); }
.res-cell.c-part .num { color: var(--state-partial); }
.res-cell.c-bad .num { color: var(--state-incorrect); }
.res-cell.c-skip .num { color: var(--state-skipped); }
.verdict {
  border-radius: 8px;
  border: 2px solid;
  padding: 18px 20px;
  margin: 14px 0;
  text-align: center;
}
.verdict.pass { border-color: var(--state-correct); background: rgba(87,211,140,0.07); }
.verdict.fail { border-color: var(--state-incorrect); background: rgba(255,107,107,0.07); }
.verdict .v-big { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
.verdict.pass .v-big { color: var(--state-correct); }
.verdict.fail .v-big { color: var(--state-incorrect); }

@media (max-width: 760px) {
  .res-grid { grid-template-columns: 1fr; }
  .zones.cols2, .zones.cols3 { grid-template-columns: 1fr; }
  .matchrow { grid-template-columns: 1fr; }
  .topbar-inner { gap: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .progressbar::after { animation: none; display: none; }
  * { transition: none !important; }
}

</style>
</head>
<body>
<section id="view-intro" class="view active">
  <div class="wrap" id="intro-body"></div>
</section>

<section id="view-exam" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topic" id="hdr-topic"></span>
      <span class="badge sev" id="hdr-sev"></span>
      <span class="badge" id="hdr-count"></span>
      <span class="timerbox" id="hdr-timer"></span>
      <span class="spacer"></span>
      <span class="scorebox" id="hdr-score"></span>
      <button id="hint-btn" title="Hint (costs 10% of this exercise's credit)">💡 Hint</button>
      <button id="pause-btn" title="Pause the exam and hide the exercise">⏸ Pause</button>
      <button id="skip-btn" title="Skip and answer later">⏭ Skip</button>
      <span class="badge" id="hdr-user" aria-hidden="true"></span>
    </div>
  </div>
  <div class="progresswrap"><div class="progressbar" id="prog-fill"></div></div>
  <div class="wrap">
    <div id="exam-body"></div>
    <div id="hint-panel" class="hintpanel" role="note"></div>
    <div id="check-nudge" class="small" style="display:none;color:var(--state-incorrect);font-weight:700">⚠ Choose an answer first — or press Skip to come back later.</div>
    <div class="block feedback" id="feedback-block">
      <div class="fb-head" id="fb-head"></div>
      <div class="block-body" id="fb-body"></div>
    </div>
    <div class="navrow">
      <button id="check-btn" class="primary">✓ Check</button>
      <button id="next-btn" disabled>Next →</button>
      <span class="spacer"></span>
    </div>
  </div>
  <div class="pauseveil" id="pause-veil" role="dialog" aria-label="Exam paused">
    <div class="pausecard">
      <div class="big">⏸</div>

<script>

'use strict';
/* ============================ DATA ============================ */
var DATA = {"topicId": "m1060", "batch": 1, "difficulty": "easy", "severityWord": "EASY", "sevIcon": "●", "shortName": "Out-of-Band Communications Channel", "metaTitle": "M1060 Out-of-Band Communications Channel — EASY", "mitreId": "M1060", "timerMinutes": 25, "estimatedMinutes": 25, "passMark": 70, "learnTitle": "What you will learn here", "kwTitle": "Keywords covered in this exam", "howTitle": "How this exam works", "howHTML": "<p>This file trains the <b>EASY<\/b> level: one idea per exercise, short scenarios, and guided questions that tell you where to look.<\/p>", "howExtra": "", "typesUsed": ["matching", "multiple choice (single answer)", "multi-select with partial credit", "drag &amp; drop", "fill-in-the-blank", "log reading", "scenario steps", "ordering", "spot the mistake"], "learnHTML": "\n<p>You will learn about <b>M1060 — Out-of-Band Communications Channel<\/b>. This is a <b>Mitigation<\/b> in the MITRE ATT&amp;CK framework (you can read it at attack.mitre.org/mitigations/M1060). A mitigation is a defense that a company can put in place to make a known attack harder or less harmful. ATT&amp;CK is a catalogue of attacker behaviours. Each behaviour, called a <b>technique<\/b>, can link to one or more mitigations.<\/p>\n<p>M1060 says: keep a <b>separate, trusted way to talk<\/b> for the moments when your normal network cannot be trusted. &quot;Out-of-band&quot; (OOB) means a separate path that does not depend on the main company network. The ATT&amp;CK page gives four examples: secure messaging apps on their own path, encrypted phone lines, satellite communications, and dedicated emergency communication systems.<\/p>\n<p>Imagine you are an incident responder. Ransomware locks your file servers. Your office chat and email may be watched by the attacker, or simply offline. If an OOB channel is planned and tested, you can still coordinate the response. That is what this mitigation protects: <b>the continuity of critical communications<\/b> during security incidents, data attacks, or network failures.<\/p>\n<p>Who uses this at work? <b>SOC analysts<\/b> and <b>incident responders<\/b> move incident talks to the OOB channel. <b>Helpdesk and finance teams<\/b> verify strange requests with a call-back on a trusted line. <b>Security engineers<\/b> set up and test the channels. <b>GRC analysts<\/b> write the policy and check the plan exists. <b>CTI analysts<\/b> explain why attackers read in-network chat and email to follow (and disturb) the response.<\/p>\n<p>The mitigation addresses techniques such as <b>T1213.005 Messaging Applications<\/b>, <b>T1114 Email Collection<\/b>, and <b>T1489 Service Stop<\/b>. It does <b>not<\/b> stop an attacker from stealing a password in the first place — other mitigations do that job.<\/p>\n", "keywords": [{"theme": "The mitigation itself", "items": ["M1060 — Out-of-Band Communications Channel (Enterprise mitigation, ATT&CK)", "What a Mitigation object is in ATT&CK", "Goal: continuity of critical communications when the primary network is compromised or down"]}, {"theme": "Out-of-band channels", "items": ["Secure messaging apps on a separate, independent path", "Encrypted phone lines", "Satellite communications", "Dedicated emergency communication systems", "Independent of the primary network vs in-network tools"]}, {"theme": "Techniques addressed", "items": ["T1213 — Data from Information Repositories", "T1213.005 — Messaging Applications", "T1114 — Email Collection", "T1489 — Service Stop", "Collection and Impact tactics"]}, {"theme": "The three mechanisms", "items": ["Plan an OOB channel instead of in-network chat or email", "Verify critical actions (password resets, payments, access) via OOB", "Send OOB alerts about unusual email activity"]}, {"theme": "Limits of the mitigation", "items": ["Does not stop credential theft or initial access", "Does not clean up or restore services by itself"]}], "exercises": [{"id": "E01", "type": "match", "summary": "Four channel examples and why each one is out-of-band", "scenario": "<p>Halvard Logistics is writing its first incident-communication plan. The plan lists four channels the page for M1060 mentions.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Channel list (draft)<\/div><div class=\"art-body\"><p>1. Satellite phone<\/p><p>2. Encrypted phone line<\/p><p>3. Secure messaging app on a separate, independent path<\/p><p>4. Dedicated emergency alerting system<\/p><\/div><\/div>", "question": "Match each channel to the reason it counts as out-of-band.", "hint": "Out-of-band means the channel does not need the main company network to work.", "pairs": [{"left": "Satellite phone", "right": "Works even if the company network is completely down", "why": "A satellite phone talks to satellites, not to your office network. It works when servers and the internet line are gone."}, {"left": "Encrypted phone line", "right": "Voice calls on a separate secure path", "why": "The calls travel on their own secured path, so someone watching the office network learns nothing."}, {"left": "Secure messaging app on an independent path", "right": "Chat that does not depend on the compromised network", "why": "If the app runs outside the compromised infrastructure, the attacker who owns the network still cannot read it."}, {"left": "Dedicated emergency alerting system", "right": "Sends critical alerts outside the main network", "why": "It is built for emergencies and runs on its own system, so it keeps working when normal tools fail."}], "explanation": "<p>The ATT&amp;CK page for M1060 lists exactly these kinds of channels: secure messaging apps, encrypted phone lines, satellite communications, and dedicated emergency communication systems. All four share one property: they do <b>not<\/b> depend on the primary network infrastructure, which may be compromised or down.<\/p>", "idx": 0}, {"id": "E02", "type": "qcm", "summary": "What kind of ATT&CK object is M1060?", "scenario": "<p>A new SOC analyst at Halvard Logistics reads: <i>&quot;M1060 — Out-of-Band Communications Channel&quot;<\/i> in the ATT&amp;CK framework.<\/p>", "question": "What kind of ATT&CK object is M1060?", "hint": "In ATT&CK, objects named M-something describe defenses a company can put in place.", "options": ["A Mitigation — a defense a company can put in place", "A Technique — a behaviour an attacker uses", "A Tactic — the goal an attacker wants to reach", "A Group — a known threat actor"], "answer": 0, "why": ["Correct. M1060 is a Mitigation. It describes a defense: keep a separate communication channel for incidents.", "No. Techniques are attacker behaviours and have IDs like T1114. M1060 describes a defense, not an attack.", "No. Tactics are adversary goals (like Collection or Impact) and have IDs like TA0009. M1060 is a defense.", "No. Groups are threat actors and have IDs like G0007. M1060 is a defense, not a person or team."], "explanation": "<p>M1060 is a <b>Mitigation<\/b> object. In ATT&amp;CK, mitigation IDs start with <b>M<\/b>. Techniques start with T, tactics with TA, and groups with G. The role of a mitigation is to tell defenders what they can put in place to slow down or stop specific techniques.<\/p>", "idx": 1}, {"id": "E03", "type": "qcm", "summary": "The main goal of the M1060 mitigation", "scenario": "<p>Your manager asks: &quot;Why does ATT&amp;CK ask us to keep an out-of-band channel? What is it for?&quot;<\/p>", "question": "What is the main goal of M1060?", "hint": "Think about what happens to normal chat and email during a ransomware attack.", "options": ["Make the corporate network faster during an incident", "Keep critical communications working when the normal network cannot be trusted", "Stop all spam emails before they reach the mail server", "Give every employee a second laptop for emergency work"], "answer": 1, "why": ["No. Speed is not the point. The channel is about having a trusted way to talk at all.", "Correct. M1060 keeps a separate path so the team can coordinate during incidents, data attacks, or network failures.", "No. Spam filtering is a different mitigation. M1060 is about a trusted fallback channel.", "No. Laptops are not the point. The mitigation is about a communication path that stays independent."], "explanation": "<p>The page for M1060 says the goal is to <b>ensure the continuity of critical communications<\/b> during security incidents, data integrity attacks, or in-network communication failures, and to reduce the risk of an adversary intercepting, disrupting, or tampering with those communications. In short: even if the main network is broken or watched, the response team can still talk safely.<\/p>", "idx": 2}, {"id": "E04", "type": "dnd", "summary": "Which tools survive a compromised network, and which do not", "scenario": "<p>During a drill, Halvard Logistics sorts its tools into two groups: tools that keep working when the main network is compromised, and tools that do not.<\/p>", "question": "Drag each tool into the correct group.", "hint": "Ask for each tool: does it need the company network or its servers to work?", "zones": [{"id": "independent", "label": "Independent of the main network — survives a compromised network"}, {"id": "dependent", "label": "Depends on the main network — fails with the network"}], "items": [{"label": "Satellite phone", "zone": "independent", "why": "A satellite phone uses satellites. It does not touch the company network."}, {"label": "Company email server", "zone": "dependent", "why": "Email lives on company servers inside the network. If the network is compromised or down, email is compromised or down with it."}, {"label": "Office chat app on the company LAN", "zone": "dependent", "why": "The chat runs on the company LAN. An attacker inside the network can read or block it."}, {"label": "Dedicated emergency radio channel", "zone": "independent", "why": "A dedicated radio system works on its own infrastructure, so it keeps working when the network fails."}], "explanation": "<p>The page defines out-of-band as an <b>alternative, separate communication path that is not dependent on the potentially compromised primary network infrastructure<\/b>. Tools that run on that primary infrastructure — like the email server or the office chat — go down or become untrusted together with it.<\/p>", "idx": 3}, {"id": "E05", "type": "qcm", "summary": "Which technique matches an attacker reading company chat?", "scenario": "<p>An attacker is inside the Halvard Logistics network. They open the office chat application and read every channel, looking for the incident response plan.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — ATT&CK excerpt<\/div><div class=\"art-body\"><p><b>T1213.005 — Messaging Applications<\/b> (sub-technique of T1213, Data from Information Repositories)<\/p><p>Adversaries may collect information from messaging applications. Messaging apps inside the company network often hold plans, files, and discussions.<\/p><\/div><\/div>", "question": "Which ATT&CK technique matches what this attacker is doing?", "hint": "The excerpt in the artefact names the exact technique. Look for the ID that starts with T12…", "options": ["T1489 — Service Stop", "T1114.002 — Remote Email Collection", "T1213.005 — Messaging Applications", "M1060 — Out-of-Band Communications Channel"], "answer": 2, "why": ["No. T1489 is about stopping services, like shutting down backup software. This attacker is reading chat.", "No. T1114.002 is about collecting email. The attacker is reading chat, not email.", "Correct. Reading the office chat matches T1213.005 Messaging Applications.", "No. M1060 is a mitigation (a defense), not a technique. Attacker behaviours have IDs starting with T."], "explanation": "<p>The behaviour &quot;attacker reads messages in a chat application&quot; matches <b>T1213.005 — Messaging Applications<\/b>, a sub-technique of T1213 (Data from Information Repositories). Both belong to the <b>Collection<\/b> tactic. M1060 addresses it by asking companies to keep a separate OOB channel, so the incident plan is not stored and discussed where the attacker can read it.<\/p>", "idx": 4}, {"id": "E06", "type": "fill", "summary": "Fill the incident pocket card", "scenario": "<p>Halvard Logistics gives every responder a small pocket card for the first 10 minutes of an incident.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Pocket card (draft)<\/div><div class=\"art-body\"><p>Step 1. If you cannot trust the company network, move incident talks to the (1)____ channel.<\/p><p>Step 2. At Halvard the backup channel is a(n) (2)____ phone line kept for emergencies.<\/p><\/div><\/div>", "question": "Choose the words that complete the pocket card.", "hint": "The two missing words describe the same idea: a separate path, kept secret and safe.", "template": "If you cannot trust the company network, move incident talks to the {{0}} channel.<br>At Halvard the backup channel is a(n) {{1}} phone line kept for emergencies.", "bank": ["out-of-band", "encrypted", "public", "faster", "wireless", "cheap"], "answers": ["out-of-band", "encrypted"], "why": ["The exact term used by M1060 is out-of-band: a separate path that does not depend on the compromised primary network.", "The line must be encrypted so an attacker cannot listen in, and separate so it does not depend on the broken network."], "explanation": "<p>The pocket card uses the two key words of M1060: <b>out-of-band<\/b> (a separate path, independent of the primary network) and <b>encrypted<\/b> (unreadable for anyone who listens). Both are needed. A separate but open channel could still be overheard; an encrypted channel that still rides the compromised network is not out-of-band.<\/p>", "idx": 5}, {"id": "E07", "type": "match", "summary": "The three techniques M1060 addresses, by ID and name", "scenario": "<p>A CTI analyst pins three technique cards next to the M1060 card on the defence board.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Technique cards<\/div><div class=\"art-body\"><p>Card A: T1114<\/p><p>Card B: T1213<\/p><p>Card C: T1489<\/p><\/div><\/div>", "question": "Match each technique ID to its name.", "hint": "One is about email, one about information repositories like chat, and one about stopping services.", "pairs": [{"left": "T1114", "right": "Email Collection", "why": "T1114 is Email Collection. An attacker reads email — for example with forwarding rules or a stolen mailbox."}, {"left": "T1213", "right": "Data from Information Repositories", "why": "T1213 covers repositories that store information, like chat platforms and wikis."}, {"left": "T1489", "right": "Service Stop", "why": "T1489 is Service Stop: the attacker stops services, for example to shut down protection or cut communications."}], "explanation": "<p>These three techniques are exactly the ones the M1060 page addresses. T1213 and T1114 live in the <b>Collection<\/b> tactic; T1489 lives in the <b>Impact<\/b> tactic. M1060 answers each of them with an out-of-band answer: a planned channel instead of in-network chat, verification instead of trusting email, and OOB communication in the policy so a Service Stop cannot silence the response.<\/p>", "idx": 6}, {"id": "E08", "type": "log", "summary": "A forwarding rule appears in the mail audit log", "scenario": "<p>Bluepine Energy runs an email audit log. Today it shows a new inbox rule on a finance mailbox.<\/p>", "question": "According to M1060, which mechanism should have warned the security team about this forwarding rule?", "hint": "M1060 asks for alerts about unusual email activity — sent on the out-of-band channel.", "logLines": ["<span class=\"lg-ts\">2026-03-04 08:41:12Z<\/span> <span class=\"lg-key\">AUDIT<\/span> mailbox=finance-ap@bluepine.example action=<span class=\"lg-str\">New-InboxRule<\/span> name=<span class=\"lg-bad\">\"Move to RSS Feeds\"<\/span> forward_to=<span class=\"lg-bad\">upd8-billing@srv-4217.example<\/span> by=<span class=\"lg-dim\">finance-ap<\/span>", "<span class=\"lg-ts\">2026-03-04 08:41:14Z<\/span> <span class=\"lg-key\">AUDIT<\/span> mailbox=finance-ap@bluepine.example action=<span class=\"lg-str\">Set-Mailbox<\/span> <span class=\"lg-dim\">ForwardingSmtpAddress=<\/span><span class=\"lg-bad\">upd8-billing@srv-4217.example<\/span>", "<span class=\"lg-ts\">2026-03-04 08:52:00Z<\/span> <span class=\"lg-key\">INFO<\/span> <span class=\"lg-dim\">no alert raised — OOB alert route not configured for mail rules<\/span>"], "widget": {"id": "E08w", "type": "fill", "summary": "", "scenario": "", "question": "Complete the sentence that names the missing M1060 mechanism.", "hint": "", "template": "M1060 asks for an out-of-band {{0}} to the security team about unusual email activity, such as mass forwarding or large attachments being sent.", "bank": ["alert", "rule", "quota", "filter", "backup", "reply"], "answers": ["alert"], "why": ["Correct — the missing mechanism is the OOB alert: notify the security team about unusual email activities on a path the attacker cannot read or block.", "A rule acts inside the mailbox; the page's mechanism is an alert to people, delivered out-of-band.", "A quota changes storage limits; it never raises an alarm.", "A filter sits on the mail path and does not see rules created inside the mailbox.", "A backup protects old data; it does not warn anyone in real time.", "A reply travels inside the same compromised mail path — exactly where the alert must not go."], "explanation": ""}, "explanation": "<p>M1060 asks teams to <b>set up out-of-band alerts to notify security teams of unusual email activities, such as mass forwarding or large attachments being sent<\/b>. The third log line shows the failure: the alert route was not configured, so a classic collection setup (a hidden inbox rule plus automatic forwarding) went unnoticed. The alert must also travel on the OOB channel itself, because the attacker who owns the mailbox can read or block in-network alerts.<\/p>", "idx": 7}, {"id": "E09", "type": "triage", "summary": "First 10 minutes of a ransomware drill", "scenario": "<p>Halvard Logistics runs a ransomware drill. You are the incident lead. Work through the three steps.<\/p>", "question": "Choose the best action for each step.", "hint": "One step per idea: move to a trusted channel, reach people, and keep plans away from the attacker.", "steps": [{"situation": "A ransom note appears on a file server. You cannot trust the office chat and email right now.", "options": [{"text": "Move incident talks to the out-of-band channel", "correct": true, "why": "This is the M1060 move: switch to a path the attacker cannot watch or break."}, {"text": "Post the ransom note in the office chat to ask for ideas", "correct": false, "why": "The office chat may be watched. Sharing incident details there helps the attacker."}, {"text": "Turn off all phones so nobody is disturbed", "correct": false, "why": "Cutting phones removes your ability to coordinate, which is what the mitigation prevents."}]}, {"situation": "You must reach the on-call team members quickly.", "options": [{"text": "Use the OOB contact tree to call them one by one", "correct": true, "why": "The contact tree lists trusted numbers outside the network, so it works when the network is untrusted."}, {"text": "Wait for the daily standup meeting", "correct": false, "why": "Waiting wastes the first minutes of the incident. Response speed matters."}, {"text": "Email them the ransom note as an attachment", "correct": false, "why": "Email may be watched or down. The attacker would see your next steps."}]}, {"situation": "You need to decide where to keep the response plan during the incident.", "options": [{"text": "Keep the response plan off the in-network chat and work from the OOB channel", "correct": true, "why": "The page for T1213.005 says to use the OOB channel as the alternative to in-network chat during an incident."}, {"text": "Share the full plan in the office chat so everyone can read it", "correct": false, "why": "If the attacker reads the chat (T1213.005), they see your plan and can counter it."}, {"text": "Delete all chat history to hide the plan", "correct": false, "why": "Deleting history destroys information your own team may need, and does not protect the plan going forward."}]}], "explanation": "<p>This drill walks the three basic moves of M1060 in an incident: <b>switch to the OOB channel<\/b> when the network cannot be trusted, <b>reach people through the OOB contact tree<\/b>, and <b>keep the response plan out of in-network tools<\/b> the attacker may read (T1213.005) — this also keeps coordination alive if the attacker stops services (T1489).<\/p>", "idx": 8}, {"id": "E10", "type": "qcm", "summary": "Why M1060 helps against Service Stop", "scenario": "<p>An attacker runs T1489 — Service Stop. Mail servers, chat servers, and backup services shut down. The response team is scattered across the city.<\/p>", "question": "Why does M1060 help the response team in this moment?", "hint": "The team still needs to talk, but the services that carry the talk are down.", "options": ["It gives the team a separate way to talk when the normal services are down", "It restarts the stopped services automatically within minutes", "It stops the attacker from encrypting any files", "It backs up all company data every night"], "answer": 0, "why": ["Correct. A dedicated OOB channel keeps coordination possible even when the in-network services are stopped.", "No. M1060 does not restart anything. It is a communication channel, not a recovery tool.", "No. Encryption of files is not stopped by a communication channel. That is a different defense.", "No. Backups are another mitigation. M1060 is about keeping communications alive."], "explanation": "<p>T1489 — Service Stop is an <b>Impact<\/b> technique: the adversary stops services to cut off your ability to respond. The M1060 page answers it with policy: <b>security policies should include the use of out-of-band communication channels for critical communications during an incident<\/b>. If the policy exists and the channel is provisioned, a Service Stop cannot silence the response team.<\/p>", "idx": 9}, {"id": "E11", "type": "fill", "summary": "Complete the verification policy sentence", "scenario": "<p>Bluepine Energy writes its OOB verification policy. Two words are missing.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Policy draft, section 4.2<\/div><div class=\"art-body\"><p>Critical actions requested by email — such as password resets or payment changes — must be verified with a(n) (1)____ method before approval.<\/p><p>For highly sensitive information, do not rely only on (2)____; use the OOB channel instead.<\/p><\/div><\/div>", "question": "Choose the words that complete the policy.", "hint": "The page says critical actions from email are verified out-of-band, and sensitive information should not live only in one place.", "template": "Critical actions requested by email — such as password resets or payment changes — must be verified with a(n) {{0}} method before approval.<br>For highly sensitive information, do not rely only on {{1}}; use the OOB channel instead.", "bank": ["out-of-band", "email", "automatic", "in-network", "chat", "verbal"], "answers": ["out-of-band", "email"], "why": ["The page says to verify critical actions initiated via email with secure out-of-band authentication methods.", "The page says to use the OOB channel instead of relying solely on email for highly sensitive information."], "explanation": "<p>This is the second mechanism of M1060: <b>out-of-band verification of critical actions<\/b>. The page names password resets, financial transactions, and access requests as examples. An attacker who owns a mailbox (T1114) can ask for any of these by email; a verification step on a separate trusted path breaks that trick.<\/p>", "idx": 10}, {"id": "E12", "type": "dnd", "summary": "Sort the three M1060 mechanisms", "scenario": "<p>The security team at Halvard lists six everyday tasks. Sort each task under the M1060 mechanism it belongs to.<\/p>", "question": "Drag each task into the mechanism it matches.", "hint": "Ask: does the task prepare a channel, check a request, or raise an alarm?", "zones": [{"id": "plan", "label": "Plan a backup channel — prepare the channel before it is needed"}, {"id": "verify", "label": "Verify critical actions — check that a request is real"}, {"id": "alert", "label": "Send OOB alerts — raise the alarm on a trusted path"}], "items": [{"label": "Write the OOB channel into the incident playbook", "zone": "plan", "why": "This prepares the channel in advance — a plan, exactly what the page asks for instead of in-network chat."}, {"label": "Agree that incident talks move to OOB if the network is untrusted", "zone": "plan", "why": "This is a planning decision made before any incident."}, {"label": "Call the CFO back on a known number before a payment change", "zone": "verify", "why": "A call-back on a known number is out-of-band verification of a financial transaction."}, {"label": "Check a password-reset request by calling the manager on the OOB line", "zone": "verify", "why": "Password resets are critical actions. The OOB line verifies them."}, {"label": "Notify the SOC on the emergency channel about a mass forwarding rule", "zone": "alert", "why": "Mass forwarding is unusual email activity — the page asks for an OOB alert here."}, {"label": "Alert the team about large attachments being sent", "zone": "alert", "why": "Large attachments are the second example of unusual email activity in the page."}], "explanation": "<p>M1060 has three hands: <b>plan<\/b> a separate channel for incidents, <b>verify<\/b> critical actions (password resets, payments, access requests) through it, and <b>alert<\/b> the security team about unusual email activity (mass forwarding, large attachments) on it. Keeping the three apart helps you design and test each one.<\/p>", "idx": 11}, {"id": "E13", "type": "fill", "summary": "Complete the scope sentence", "scenario": "<p>A manager at Bluepine says: &quot;Great, we have an OOB channel now, so nothing can hurt us anymore.&quot; The trainer writes two blanks on the whiteboard.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Whiteboard sentence<\/div><div class=\"art-body\"><p>M1060 protects the (1)____ of critical communications during incidents.<\/p><p>It does not stop an attacker from (2)____ a password with a phishing email in the first place.<\/p><\/div><\/div>", "question": "Choose the words that complete the whiteboard sentence.", "hint": "Blank 1: what the channel protects. Blank 2: what the attacker does to get a password.", "template": "M1060 protects the {{0}} of critical communications during incidents.<br>It does not stop an attacker from {{1}} a password with a phishing email in the first place.", "bank": ["continuity", "stealing", "speed", "printing", "deleting", "reading"], "answers": ["continuity", "stealing"], "why": ["Blank 1: the page's goal is continuity — critical communications keep working when the network cannot be trusted.", "Blank 2: phishing steals the password before any communication starts; other mitigations own that step.", "&quot;Speed&quot; is not the property the channel protects.", "&quot;Printing&quot; has no role here.", "&quot;Deleting&quot; is the attacker's trick with forwarding rules and mail, not the goal of this mitigation.", "&quot;Reading&quot; is what the attacker does to your chat and email — which is the part M1060 does address."], "explanation": "<p>M1060 protects <b>continuity<\/b> — the ability to keep talking when the primary network is compromised or down. It does <b>not<\/b> stop the attacker from <b>stealing<\/b> a password with phishing; entry is the job of mitigations like anti-phishing controls and multi-factor authentication. Knowing a mitigation's boundary keeps the control map honest.<\/p>", "idx": 12}, {"id": "E14", "type": "or /* ============================ UTILITIES ============================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtTime(sec){
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
var SEV_COLOR = { 'EASY': 'var(--sev-easy)', 'MEDIUM': 'var(--sev-medium)', 'HARD': 'var(--sev-hard)', 'EXTREMELY HARD': 'var(--sev-extreme)' };

/* ============================ SESSION STATE ============================ */
var S = null;           /* session */
var tickHandle = null;  /* 1s interval */
var attemptReported = false;

function newSession(){
  return {
    order: shuffle(DATA.exercises.map(function(e,i){ return i; })),
    idx: 0,                     /* position in order */
    credits: {},                /* exIndex -> credit (float) */
    hinted: {},                 /* exIndex -> true */
    checked: {},                /* exIndex -> true */
    skippedPool: [],            /* exIndexes skipped and not yet answered */
    timer: { remain: DATA.timerMinutes * 60, state: 'IDLE', prevState: null },
    pause: { manualSec: 0, feedbackSec: 0, mark: null },
    widgetState: {},            /* per-exercise renderer scratch */
    terminalClock: {},          /* exIndex -> remaining seconds */
    reviewReturn: false         /* true while the current exercise was returned from the review screen */
  };
}

/* ============================ TIMER STATE MACHINE ============================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED  (IDLE before start)
   Explicit transitions only. */
function tstate(){ return S.timer.state; }
function tset(st){
  var from = S.timer.state;
  if (from === st) return;
  /* accumulate pause statistics on leaving a paused state */
  var now = Date.now();
  if (S.pause.mark) {
    var d = (now - S.pause.mark) / 1000;
    if (from === 'PAUSED_MANUAL') S.pause.manualSec += d;
    if (from === 'PAUSED_AUTO_CHECK') S.pause.feedbackSec += d;
    S.pause.mark = null;
  }
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') S.pause.mark = now;
  S.timer.prevState = (st === 'PAUSED_MANUAL') ? from : S.timer.prevState;
  S.timer.state = st;
  renderTimer();
}
function startClock(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    if (!S) return;
    if (S.timer.state !== 'RUNNING') return;
    S.timer.remain -= 1;
    /* terminal per-exercise clock (EXTREMELY HARD terminal only) */
    var ex = curEx();
    if (ex && ex.type === 'terminal' && !S.checked[ex.idx] && S.terminalClock[ex.idx] > 0) {
      S.terminalClock[ex.idx] -= 1;
      var te = $('term-clock');
      if (te) te.textContent = '⏱ Command window: ' + fmtTime(S.terminalClock[ex.idx]) + ' remaining';
      if (S.terminalClock[ex.idx] === 0) {
        var ti = $('term-input');
        if (ti) { ti.disabled = true; }
        if (te) te.textContent = '⏱ Command window ended — press Check to submit what you have.';
      }
    }
    if (S.timer.remain <= 0) {
      S.timer.remain = 0;
      endExam(true);
      return;
    }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  var el = $('hdr-timer');
  if (!el) return;
  var st = S ? S.timer.state : 'IDLE';
  var icon = '▶', word = 'RUNNING', color = 'var(--state-correct)';
  if (st === 'PAUSED_MANUAL') { icon = '⏸'; word = 'PAUSED — manual (press Resume)'; color = 'var(--state-paused)'; }
  else if (st === 'PAUSED_AUTO_CHECK') { icon = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; color = 'var(--state-paused)'; }
  else if (st === 'ENDED') { icon = '⏹'; word = 'ENDED'; color = 'var(--state-incorrect)'; }
  else if (st === 'IDLE') { icon = '⏱'; word = 'READY'; }
  var t = S ? fmtTime(S.timer.remain) : fmtTime(DATA.timerMinutes * 60);
  el.innerHTML = '<span class="timer-val mono">' + t + '</span> ' +
    '<span class="timer-state" style="color:' + color + '">' + icon + ' ' + word + '</span>';
  var p = $('pause-btn');
  if (p) {
    if (st === 'PAUSED_MANUAL') { p.textContent = '▶ Resume'; p.disabled = false; }
    else if (st === 'PAUSED_AUTO_CHECK') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else if (st === 'RUNNING') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else { p.textContent = '⏸ Pause'; p.disabled = true; }
  }
}

/* ============================ SCORING ============================ */
/* Mandatory formula: credit = max(0, (H - W) / N) */
function scoreExercise(H, W, N){
  if (N <= 0) return 0;
  return Math.max(0, (H - W) / N);
}
function liveScore(){
  var sum = 0, count = 0;
  Object.keys(S.checked).forEach(function(k){
    if (S.checked[k]) { sum += (S.credits[k] || 0); count += 1; }
  });
  return { sum: sum, count: count };
}
function renderScore(){
  var el = $('hdr-score');
  if (!el) return;
  var ls = liveScore();
  if (ls.count === 0) { el.innerHTML = 'Score <b>0.0 / 0</b>'; return; }
  var pct = Math.round((ls.sum / ls.count) * 100);
  el.innerHTML = 'Score <b>' + ls.sum.toFixed(1) + ' / ' + ls.count + '</b> · ' + pct + '%';
}

/* ============================ VIEWS ============================ */
function showView(name){
  ['intro','exam','review','results'].forEach(function(v){
    var el = $('view-' + v);
    if (el) el.classList.toggle('active', v === name);
  });
  window.scrollTo(0, 0);
}

/* ============================ INTRO ============================ */
function renderIntro(){
  var h = '';
  h += '<div class="card intro-head">';
  h += '<h1>' + esc(DATA.introTitle) + '</h1>';
  h += '<div class="muted">' + esc(DATA.pageLabel) + '</div>';
  h += '<div class="factrow">';
  h += fact('Severity', '<span class="badge sev" id="intro-sev" style="color:' + SEV_COLOR[DATA.severityWord] + ';border-color:' + SEV_COLOR[DATA.severityWord] + '"><span aria-hidden="true">' + DATA.sevIcon + '</span> ' + DATA.severityWord + '</span>');
  h += fact('Exercises in this file', String(DATA.exercises.length));
  h += fact('Estimated time', DATA.estimatedMinutes + ' min');
  h += fact('Timer budget', DATA.timerMinutes + ' min countdown');
  h += fact('Pass mark', DATA.passMark + '%');
  h += '</div></div>';
  h += '<div class="card learn"><h2 class="sec-title">' + DATA.learnTitle + '</h2>' + DATA.learnHTML + '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.kwTitle + '</h2>';
  DATA.keywords.forEach(function(kw){
    h += '<div class="kw-theme"><div class="kw-name">' + esc(kw.theme) + '</div><ul>';
    kw.items.forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.howTitle + '</h2>' + DATA.howHTML + DATA.howExtra;
  h += '<ul class="rules">';
  h += '<li><b>Pass mark:</b> you need at least <b>70%</b> to pass. A PASS means you showed a working understanding of ' + esc(DATA.mitreId) + ' at this difficulty. A FAIL means you should read the feedback again and retake.</li>';
  h += '<li><b>Exercise types in this file:</b> ' + DATA.typesUsed.join(', ') + '.</li>';
  h += '<li><b>Timer:</b> a ' + DATA.timerMinutes + '-minute countdown runs for the whole file. The <b>⏸ Pause</b> button stops the timer and hides the exercise for a real break. When you press <b>Check</b>, the timer stops automatically so you can read the feedback for as long as you want; it starts again only when you press <b>Next</b>.</li>';
  h += '<li><b>Partial credit:</b> exercises with several correct items give partial credit. Each correct item adds credit, each wrong item removes credit: credit = (correct − wrong) ÷ items, never below 0.</li>';
  h += '<li><b>Hint:</b> one hint per exercise. A hint costs 10% of that exercise&#39;s credit.</li>';
  h += '<li><b>Skipped exercises:</b> you can skip any exercise. Before the exam can finish, you get a review screen where you can go back to skipped exercises and answer them while the timer is not ended. Skipped exercises you never answer are simply excluded from your score.</li>';
  h += '</ul>';
  h += '<div class="startrow"><button class="primary" id="start-btn">▶ Start the exam</button></div></div>';
  $('intro-body').innerHTML = h;
  $('start-btn').addEventListener('click', startExam);
}
function fact(k, v){ return '<div class="fact"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

/* ============================ EXAM FLOW ============================ */
function startExam(){
  S = newSession();
  attemptReported = false;
  tset('RUNNING'); /* from IDLE */
  S.timer.state = 'RUNNING';
  startClock();
  renderTopbar();
  showView('exam');
  renderCurrent();
}
function curEx(){
  if (!S || S.idx >= S.order.length) return null;
  return DATA.exercises[S.order[S.idx]];
}
function renderTopbar(){
  var ex = curEx();
  $('hdr-topic').textContent = DATA.mitreId + ' · ' + DATA.shortName;
  var sev = $('hdr-sev');
  sev.textContent = DATA.sevIcon + ' ' + DATA.severityWord;
  sev.style.color = SEV_COLOR[DATA.severityWord];
  sev.style.borderColor = SEV_COLOR[DATA.severityWord];
  $('hdr-count').textContent = ex ? ('Exercise ' + (S.idx + 1) + ' of ' + S.order.length) : '';
  document.documentElement.style.setProperty('--sev-current', SEV_COLOR[DATA.severityWord]);
  renderTimer(); renderScore();
  var prog = (S.idx / S.order.length) * 100;
  $('prog-fill').style.width = prog + '%';
}
function renderCurrent(){
  var ex = curEx();
  if (!ex) { openReview(); return; }
  renderTopbar();
  renderExercise(ex);
}
function markChecked(exIdx, credit){
  S.checked[exIdx] = true;
  S.credits[exIdx] = credit;
  /* remove from skipped pool if it was there (review-skipped answered) */
  var p = S.skippedPool.indexOf(exIdx);
  if (p >= 0) S.skippedPool.splice(p, 1);
  renderScore();
}

/* --- Check: grade, apply hint penalty, auto-pause, render feedback --- */
function onCheck(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  var w = ex._widget;
  if (!w) return;
  var res = w.grade();
  if (res === null) { /* nothing answered */
    var nb = $('check-nudge');
    if (nb) { nb.style.display = 'block'; }
    return;
  }
  var credit = scoreExercise(res.H, res.W, res.N);
  if (S.hinted[ex.idx]) credit = Math.max(0, credit - 0.10);
  /* Auto-pause FIRST (timer stops before feedback renders) */
  tset('PAUSED_AUTO_CHECK');
  markChecked(ex.idx, credit);
  w.showFeedback(credit, res);
  var chk = $('check-btn'), nxt = $('next-btn');
  chk.disabled = true;
  if (S.idx === S.order.length - 1) { nxt.textContent = 'Final Submit'; }
  nxt.disabled = false;
  nxt.focus();
}
/* --- Skip: no auto-pause, timer keeps running --- */
function onSkip(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  /* A returned skipped exercise goes back to the review screen on Skip,
     never forward into the already-walked main flow. */
  if (S.reviewReturn) { S.reviewReturn = false; openReview(); return; }
  if (S.skippedPool.indexOf(ex.idx) < 0) S.skippedPool.push(ex.idx);
  if (S.idx === S.order.length - 1) { openReview(); return; }
  S.idx += 1;
  renderCurrent();
}
/* --- Next / Final Submit: resumes the timer from the auto-pause --- */
function onNext(){
  S.reviewReturn = false; /* leaving the returned exercise in every path below */
  var back = $('next-btn').getAttribute('data-back') === '1';
  if (S.timer.state === 'PAUSED_AUTO_CHECK') {
    if (back) { tset('RUNNING'); openReview(); return; }
    if (S.idx === S.order.length - 1) { tset('RUNNING'); openReview(); return; }
    tset('RUNNING');
    S.idx += 1;
    renderCurrent();
  } else if (S.timer.state === 'RUNNING') {
    if (back) { openReview(); return; }
    /* learner pressed Next without Check (should not happen: Next hidden pre-check) */
    if (S.idx === S.order.length - 1) { openReview(); return; }
    S.idx += 1;
    renderCurrent();
  }
}
/* --- Manual pause: hides the exercise --- */
function onPause(){
  if (!S) return;
  var st = S.timer.state;
  if (st !== 'RUNNING' && st !== 'PAUSED_AUTO_CHECK') return;
  tset('PAUSED_MANUAL');
  $('pause-veil').classList.add('active');
}
function onResume(){
  var back = (S.timer.prevState === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
  tset(back);
  $('pause-veil').classList.remove('active');
}

/* ============================ HINT ============================ */
function onHint(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx] || S.hinted[ex.idx]) return;
  S.hinted[ex.idx] = true;
  var hp = $('hint-panel');
  hp.style.display = 'block';
  hp.innerHTML = '<div class="hint-head">💡 Hint — costs 10% of this exercise&#39;s credit</div><div>' + esc(ex.hint) + '</div>';
  $('hint-btn').disabled = true;
}

/* ============================ REVIEW SKIPPED ============================ */
function openReview(){
  var box = $('review-body');
  var h = '';
  if (S.skippedPool.length === 0) {
    h += '<p>No skipped exercises are waiting. You can submit now.</p>';
  } else {
    h += '<p>These exercises are skipped. You can return to any of them and answer it, as many times as you need, while the timer has not ended. If you submit while they are still unanswered, they are excluded from your score.</p><div class="revlist">';
    S.skippedPool.forEach(function(ix, n){
      var ex = DATA.exercises[ix];
      h += '<div class="revitem"><span class="rev-ic">⚠ Skipped</span><span>' + (n + 1) + '. ' + esc(ex.summary) + '</span>' +
           '<button data-ix="' + ix + '">Return to it</button></div>';
    });
    h += '</div>';
  }
  var ls = liveScore();
  h += '<div class="card" style="margin-top:14px"><b>Answered so far:</b> ' + ls.count + ' of ' + S.order.length +
       ' · current credit <b>' + ls.sum.toFixed(1) + '</b> · time left <b class="mono">' + fmtTime(S.timer.remain) + '</b></div>';
  h += '<div class="navrow"><span class="spacer"></span><button class="primary" id="final-submit-btn">Final Submit — see results</button></div>';
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('button[data-ix]'), function(b){
    b.addEventListener('click', function(){
      var ix = parseInt(b.getAttribute('data-ix'), 10);
      /* resume timer while working on the skipped exercise (blocked only on true timeout) */
      if (S.timer.remain <= 0) return;
      if (S.checked[ix]) return; /* already answered — never re-enter an answered exercise */
      if (S.timer.state !== 'RUNNING') tset('RUNNING');
      var pos = S.order.indexOf(ix);
      if (pos >= 0) S.idx = pos;
      showView('exam');
      renderCurrent();
      /* Next from a returned skipped exercise goes back to the review screen */
      var nxt = $('next-btn');
      nxt.setAttribute('data-back', '1');
      S.reviewReturn = true;
    });
  });
  $('final-submit-btn').addEventListener('click', function(){
    if (S.timer.remain > 0) tset('ENDED');
    showResults();
  });
  showView('review');
}

/* ============================ RESULTS ============================ */
function showResults(){
  var answeredIdx = Object.keys(S.checked).filter(function(k){ return S.checked[k]; });
  var sum = 0;
  answeredIdx.forEach(function(k){ sum += S.credits[k]; });
  var answered = answeredIdx.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= DATA.passMark;
  var fully = 0, partly = 0, partlySum = 0, zero = 0;
  answeredIdx.forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.9999) fully += 1;
    else if (c > 0) { partly += 1; partlySum += c; }
    else zero += 1;
  });
  var skippedNever = S.order.length - answered;
  var h = '';
  h += '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">';
  h += '<div class="v-big">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>';
  h += '<div class="muted">' + esc(DATA.introTitle) + '</div>';
  h += '<div style="font-size:20px;margin-top:8px">Final score: <b>' + sum.toFixed(1) + ' / ' + answered + '</b> — <b>' + percent + '%</b> <span class="muted">(pass mark ' + DATA.passMark + '%)</span></div>';
  h += '</div>';
  h += '<div class="res-grid">';
  h += resCell('ok', '✓ Fully correct', String(fully), 'state-correct');
  h += resCell('part', '✓ Partially correct', String(partly) + (partly > 0 ? ' <span class="small muted">(avg ' + (partlySum / partly).toFixed(2) + ')</span>' : ''), 'state-partial');
  h += resCell('bad', '✗ Fully incorrect', String(zero), 'state-incorrect');
  h += resCell('skip', '⚠ Skipped — excluded', String(skippedNever), 'state-skipped');
  h += '</div>';
  h += '<div class="card"><h3 class="sec-title">Time report</h3>';
  h += '<p>Time paused manually (breaks): <b>' + fmtTime(Math.round(S.pause.manualSec)) + '</b></p>';
  h += '<p>Time spent reviewing feedback (auto-pause): <b>' + fmtTime(Math.round(S.pause.feedbackSec)) + '</b></p>';
  h += '<p>Timer left when the exam ended: <b class="mono">' + fmtTime(S.timer.remain) + '</b></p></div>';
  h += '<div class="startrow"><button class="amberbtn" id="retake-btn">↻ Retake Exam</button></div>';
  $('results-body').innerHTML = h;
  $('retake-btn').addEventListener('click', function(){
    renderIntro();
    showView('intro');
  });
  showView('results');
  reportScore(sum, answered, percent, passed);
}
function resCell(cls, label, num, colvar){
  return '<div class="res-cell ' + cls + '"><div class="num" style="color:var(--' + colvar + ')">' + num + '</div>' +
         '<div class="muted">' + label + '</div></div>';
}

/* ============================ SITE REPORT (STEP 6.2) ============================ */
function reportScore(creditSum, answeredCount, percent, passed){
  if (attemptReported) return;
  attemptReported = true;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: DATA.topicId,
      batch: DATA.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* ============================ HANDSHAKE (STEP 6.3) ============================ */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username / country / theme('dark') / locale / topicId / batch — consumed; dark-only by contract. */
  var who = event.data.username ? String(event.data.username) : '';
  if (who) {
    var el = $('hdr-user');
    if (el) { el.textContent = '👤 ' + who; el.removeAttribute('aria-hidden'); el.style.display = ''; }
  }
});

/* ============================ END EXAM ON TIMEOUT ============================ */
function endExam(timeout){
  if (S.timer.state === 'ENDED') return;
  S.timer.state = 'ENDED';
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  renderTimer();
  showResults();
}

document.addEventListener('DOMContentLoaded', function(){
