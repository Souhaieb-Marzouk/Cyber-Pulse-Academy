<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>M1060 — EXTREMELY HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "m1060",
  "batch": 4,
  "title": "M1060 Out-of-Band Communications Channel \u2014 EXTREMELY HARD",
  "difficulty": "extremely-hard",
  "questionCount": 16,
  "estimatedMinutes": 60,
  "passMark": 70
}
</script>
<style>

:root {
  --bg-page: #0b1020;
  --bg-surface: #121a2e;
  --bg-surface-2: #0f1729;
  --border: #243049;
  --text-primary: #e6ecff;
  --text-secondary: #a9b4d0;
  --text-mono: #c8ffd4;
  --accent-blue: #5aa9ff;
  --accent-amber: #ffb454;
  --accent-green: #57d38c;
  --state-correct: #57d38c;
  --state-partial: #ffb454;
  --state-incorrect: #ff6b6b;
  --state-skipped: #a9b4d0;
  --state-paused: #9d7bff;
  --sev-easy: #57d38c;
  --sev-medium: #ffb454;
  --sev-hard: #ff8a3d;
  --sev-extreme: #ff6b6b;
  /* derived dark-theme roles (defined once, consumed everywhere) */
  --bg-topbar: #0d1326;
  --bg-hover-btn: #18213a;
  --border-hover-btn: #33415f;
  --bg-hover-opt: #141d36;
  --bg-chip: #16203a;
  --on-primary: #06220f;
  --on-amber: #2a1a02;
  --syn-ts: #8fa3c8;
  --syn-ip: #7fd4ff;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-page);
  color: var(--text-primary);
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
code, pre, .mono, .log-line, .term-input, .timer-val {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-size: 14.5px;
}
.view { display: none; padding: 0 0 48px 0; }
.view.active { display: block; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 18px; }

/* ---------- cards & shared ---------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  padding: 18px 20px;
  margin: 16px 0;
}
.card h2, .card h3 { margin-top: 0; }
.sec-title {
  font-size: 19px;
  margin: 0 0 10px 0;
  letter-spacing: 0.2px;
}
.muted { color: var(--text-secondary); }
.small { font-size: 13.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 600;
  font-size: 13.5px;
  background: var(--bg-surface-2);
  color: var(--text-primary);
  white-space: nowrap;
}
.badge.sev { border-width: 2px; background: transparent; }
button {
  font: inherit;
  color: var(--text-primary);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  min-height: 44px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-hover-btn); border-color: var(--border-hover-btn); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: var(--on-primary);
  font-weight: 700;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.amberbtn {
  background: var(--accent-amber);
  border-color: var(--accent-amber);
  color: var(--on-amber);
  font-weight: 700;
}
button:focus-visible, .opt:focus-visible, .chip:focus-visible, .blank:focus-visible,
.zone:focus-visible, select:focus-visible, input:focus-visible, .spot-line:focus-visible {
  outline: 3px solid var(--accent-blue);
  outline-offset: 2px;
}
a, .linkish { color: var(--accent-blue); }

/* ---------- intro ---------- */
.intro-head { margin-top: 18px; }
.intro-head h1 { margin: 0 0 6px 0; font-size: 26px; line-height: 1.25; }
.factrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.fact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 120px;
}
.fact .k { color: var(--text-secondary); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; }
.fact .v { font-weight: 700; font-size: 15.5px; }
.learn p { margin: 8px 0; }
.kw-theme {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 10px 14px;
  margin: 10px 0;
}
.kw-theme .kw-name { font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; }
.kw-theme ul { margin: 4px 0 2px 0; padding-left: 20px; }
.kw-theme li { margin: 3px 0; }
.rules li { margin: 6px 0; }
.startrow { text-align: center; margin-top: 18px; }
.startrow button { font-size: 18px; padding: 14px 42px; }

/* ---------- sticky exam header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 8px 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
.topbar .topic { font-weight: 700; font-size: 14.5px; }
.topbar .spacer { flex: 1 1 0; }
.topbar button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.timerbox { display: inline-flex; align-items: center; gap: 8px; }
.timer-val { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.timer-state { font-size: 12.5px; font-weight: 700; }
.scorebox { font-size: 14.5px; color: var(--text-secondary); }
.scorebox b { color: var(--text-primary); font-size: 16px; }
.progresswrap {
  max-width: 1080px; margin: 0 auto; height: 5px;
  background: var(--bg-surface-2);
  border-radius: 0 0 3px 3px; overflow: hidden;
}
.progressbar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sev-current, var(--accent-blue)), var(--accent-blue));
  position: relative;
  transition: width 0.3s ease;
}
.progressbar::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(230,236,255,0.25) 50%, transparent 70%);
  animation: sheen 2.8s linear infinite;
}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- exercise blocks ---------- */
.block {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  margin: 14px 0;
  overflow: hidden;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; letter-spacing: 1.2px; font-size: 13px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface-2);
}
.block-scenario { border-left-color: var(--accent-blue); }
.block-scenario .block-head { color: var(--accent-blue); }
.block-question { border-left-color: var(--accent-amber); }
.block-question .block-head { color: var(--accent-amber); }
.block-answer { border-left-color: var(--accent-green); }
.block-answer .block-head { color: var(--accent-green); }
.block-body { padding: 14px 18px; }
.q-text { font-weight: 700; font-size: 16.5px; margin: 0; }
.collapse-btn {
  margin-left: auto; min-height: 30px; padding: 2px 10px; font-size: 12.5px;
  background: transparent; border: 1px solid var(--border);
}
.scen-summary { color: var(--text-secondary); font-size: 13px; padding: 6px 16px; display: none; }

/* artefact panels */
.artefact {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 10px 0;
  overflow: hidden;
}
.artefact .art-label {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; letter-spacing: 0.8px;
  color: var(--accent-blue);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(90,169,255,0.06);
  text-transform: uppercase;
}
.artefact .art-body { padding: 10px 12px; }
.artefact p { margin: 6px 0; }

/* logs */
.logbox { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.logfilter { margin: 8px 0; }
.logfilter input {
  width: 100%; padding: 9px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary);
}
.log-line { padding: 3px 6px; white-space: pre-wrap; word-break: break-word; margin: 1px 0; border-radius: 3px; }
.log-line.logmark { background: rgba(255,180,84,0.10); }
.lg-ts { color: var(--syn-ts); }
.lg-key { color: var(--accent-amber); }
.lg-str { color: var(--text-mono); }
.lg-ok { color: var(--state-correct); }
.lg-bad { color: var(--state-incorrect); }
.lg-ip { color: var(--syn-ip); }
.lg-dim { color: var(--text-secondary); }

/* options */
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  min-height: 44px;
}
.opt:hover { background: var(--bg-hover-opt); }
.opt .opt-label { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.opt.selected { border-left: 4px solid var(--accent-green); background: rgba(87,211,140,0.07); box-shadow: 0 0 0 1px rgba(87,211,140,0.25); }
.opt.selected .selmark { color: var(--accent-green); font-weight: 700; margin-left: auto; font-size: 13px; }
.opt.sel-incorrect { border-left-color: var(--state-incorrect); }
.opt.sel-correct { border-left-color: var(--state-correct); }
.opt.opt-correct-reveal { border-left: 4px solid var(--state-correct); }
.opt.disabled { cursor: default; }

/* matching */
.matchrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.matchrow .mleft {
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; min-height: 44px;
}
.matchrow select {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--bg-page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
}

/* drag & drop */
.dnd-grid { display: grid; gap: 14px; }
.bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  background: var(--bg-surface-2);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 52px;
}
.chip {
  background: var(--bg-chip);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-height: 44px;
  cursor: grab;
  user-select: none;
  display: inline-flex; align-items: center;
}
.chip.armed { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(87,211,140,0.3); }
.chip.used { opacity: 0.35; cursor: default; }
.zones { display: grid; gap: 10px; }
.zones.cols2 { grid-template-columns: 1fr 1fr; }
.zones.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.zone {
  background: var(--bg-page);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  min-height: 74px;
  cursor: pointer;
}
.zone h4 { margin: 0 0 6px 0; font-size: 13.5px; color: var(--accent-amber); }
.zone .zdrop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.zone.dragover { border-color: var(--accent-green); background: rgba(87,211,140,0.05); }
.zone .chip { cursor: pointer; }

/* ordering */
.orderlist { display: grid; gap: 8px; }
.orderitem {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 48px;
  cursor: grab;
}
.orderitem .pos { font-weight: 800; color: var(--text-secondary); min-width: 26px; }
.orderitem .updown { margin-left: auto; display: flex; gap: 4px; }
.orderitem .updown button { min-height: 34px; padding: 2px 10px; }
.orderitem.dragging { opacity: 0.5; }
.orderitem.dragover { border-color: var(--accent-green); }

/* fill blanks */
.filltext { font-size: 16.5px; line-height: 2.1; }
.blank {
  display: inline-block;
  min-width: 120px; min-height: 40px;
  background: var(--bg-surface-2);
  border: 1.5px dashed var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  text-align: center;
  cursor: pointer;
  color: var(--text-primary);
}
.blank.armed { border-color: var(--accent-green); }
.blank.filled { border-style: solid; color: var(--text-mono); }
.blank.n1 { min-width: 90px; }
.chipbank { margin-top: 12px; }

/* spot the mistake */
.spotwrap { display: grid; gap: 6px; }
.spot-line {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer; min-height: 44px;
}
.spot-line .ln { color: var(--text-secondary); min-width: 34px; }
.spot-line.selected { border-left: 4px solid var(--accent-amber); background: rgba(255,180,84,0.06); }
.spot-line code { color: var(--text-mono); }

/* terminal */
.term {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.term-scroll {
  min-height: 90px; max-height: 240px; overflow-y: auto;
  margin-bottom: 10px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-prompt { color: var(--accent-green); font-weight: 700; }
.term-echo { color: var(--text-primary); }
.term-out { color: var(--text-mono); }
.term-row { display: flex; gap: 8px; align-items: center; }
.term-row .term-prompt { flex: 0 0 auto; }
.term-input {
  flex: 1; background: var(--bg-page); color: var(--text-mono);
  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
}
.extimer { color: var(--state-paused); font-weight: 700; font-size: 13.5px; }

/* triage / steps */
.stepflag {
  display: inline-block;
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: var(--accent-amber);
  border: 1px solid var(--accent-amber);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.triage-step { margin-bottom: 4px; }

/* hint + feedback */
.hintpanel {
  border: 1px solid var(--accent-amber);
  border-left-width: 4px;
  border-radius: 8px;
  background: rgba(255,180,84,0.06);
  padding: 10px 14px;
  margin: 12px 0;
  display: none;
}
.hintpanel .hint-head { color: var(--accent-amber); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.feedback { display: none; }
.fb-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-weight: 800; font-size: 15px; letter-spacing: 0.8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.fb-correct { color: var(--state-correct); }
.fb-partial { color: var(--state-partial); }
.fb-incorrect { color: var(--state-incorrect); }
.fb-excluded { color: var(--state-skipped); }
.credit-pill {
  border: 1px solid var(--border);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 13px;
  font-weight: 700;
}
.itemrows { display: grid; gap: 6px; margin: 10px 0; }
.itemrow {
  display: flex; gap: 10px; align-items: baseline;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface-2);
  padding: 8px 12px;
}
.itemrow .ic { font-weight: 800; min-width: 110px; }
.itemrow.ir-ok .ic { color: var(--state-correct); }
.itemrow.ir-wrong .ic { color: var(--state-incorrect); }
.itemrow.ir-missed .ic { color: var(--state-skipped); }
.canon { margin: 10px 0; }
.canon code {
  display: block; background: var(--bg-page);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-mono);
  padding: 10px 12px;
  overflow-x: auto;
  cursor: pointer;
}
.danger-note { color: var(--state-incorrect); font-weight: 700; }
.navrow { display: flex; gap: 10px; margin: 16px 0 30px 0; flex-wrap: wrap; }
.navrow .spacer { flex: 1; }

/* pause overlay */
.pauseveil {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(11,16,32,0.93);
  display: none;
  align-items: center; justify-content: center;
}
.pauseveil.active { display: flex; }
.pausecard {
  text-align: center;
  background: var(--bg-surface);
  border: 2px solid var(--state-paused);
  border-radius: 10px;
  padding: 30px 40px;
  max-width: 460px;
}
.pausecard .big { font-size: 40px; color: var(--state-paused); }
.pausecard h3 { color: var(--state-paused); margin: 8px 0; }

/* review skipped */
.revlist { display: grid; gap: 8px; }
.revitem {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--state-skipped);
  border-radius: 6px;
  padding: 10px 14px;
}
.revitem .rev-ic { color: var(--state-skipped); font-weight: 800; }
.revitem button { margin-left: auto; min-height: 38px; }

/* results */
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.res-cell {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.res-cell .num { font-size: 26px; font-weight: 800; }
.res-cell.c-ok .num { color: var(--state-correct); }
.res-cell.c-part .num { color: var(--state-partial); }
.res-cell.c-bad .num { color: var(--state-incorrect); }
.res-cell.c-skip .num { color: var(--state-skipped); }
.verdict {
  border-radius: 8px;
  border: 2px solid;
  padding: 18px 20px;
  margin: 14px 0;
  text-align: center;
}
.verdict.pass { border-color: var(--state-correct); background: rgba(87,211,140,0.07); }
.verdict.fail { border-color: var(--state-incorrect); background: rgba(255,107,107,0.07); }
.verdict .v-big { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
.verdict.pass .v-big { color: var(--state-correct); }
.verdict.fail .v-big { color: var(--state-incorrect); }

@media (max-width: 760px) {
  .res-grid { grid-template-columns: 1fr; }
  .zones.cols2, .zones.cols3 { grid-template-columns: 1fr; }
  .matchrow { grid-template-columns: 1fr; }
  .topbar-inner { gap: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .progressbar::after { animation: none; display: none; }
  * { transition: none !important; }
}

</style>
</head>
<body>
<section id="view-intro" class="view active">
  <div class="wrap" id="intro-body"></div>
</section>

<section id="view-exam" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topic" id="hdr-topic"></span>
      <span class="badge sev" id="hdr-sev"></span>
      <span class="badge" id="hdr-count"></span>
      <span class="timerbox" id="hdr-timer"></span>
      <span class="spacer"></span>
      <span class="scorebox" id="hdr-score"></span>
      <button id="hint-btn" title="Hint (costs 10% of this exercise's credit)">💡 Hint</button>
      <button id="pause-btn" title="Pause the exam and hide the exercise">⏸ Pause</button>
      <button id="skip-btn" title="Skip and answer later">⏭ Skip</button>
      <span class="badge" id="hdr-user" aria-hidden="true"></span>
    </div>
  </div>
  <div class="progresswrap"><div class="progressbar" id="prog-fill"></div></div>
  <div class="wrap">
    <div id="exam-body"></div>
    <div id="hint-panel" class="hintpanel" role="note"></div>
    <div id="check-nudge" class="small" style="display:none;color:var(--state-incorrect);font-weight:700">⚠ Choose an answer first — or press Skip to come back later.</div>
    <div class="block feedback" id="feedback-block">
      <div class="fb-head" id="fb-head"></div>
      <div class="block-body" id="fb-body"></div>
    </div>
    <div class="navrow">
      <button id="check-btn" class="primary">✓ Check</button>
      <button id="next-btn" disabled>Next →</button>
      <span class="spacer"></span>
    </div>
  </div>
  <div class="pauseveil" id="pause-veil" role="dialog" aria-label="Exam paused">
    <div class="pausecard">

var DATA = {"topicId": "m1060", "batch": 4, "difficulty": "extremely-hard", "severityWord": "EXTREMELY HARD", "sevIcon": "★", "shortName": "Out-of-Band Communications Channel", "metaTitle": "M1060 Out-of-Band Communications Channel — EXTREMELY HARD", "mitreId": "M1060", "timerMinutes": 60, "estimatedMinutes": 60, "passMark": 70, "learnTitle": "What you will learn here", "kwTitle": "Keywords covered in this exam", "howTitle": "How this exam works", "howHTML": "<p>This file trains the <b>EXTREMELY HARD<\/b> level: three or more chained concepts, conflicting signals you must explicitly resolve, incomplete information, noise, and decisions with real business cost. One exercise has a command window with its own small timer. Hints restate constraints only — they never point at the answer.<\/p>", "howExtra": "", "typesUsed": ["scenario steps (branching)", "multiple choice (single answer)", "matching", "log analysis", "drag &amp; drop", "ordering", "fill-in-the-blank", "spot the mistake", "terminal (typed command, configuration only)"], "learnHTML": "\n<p>You are at the top of the ladder. <b>M1060 — Out-of-Band Communications Channel<\/b> (attack.mitre.org/mitigations/M1060) is a <b>Mitigation<\/b> whose Use column assigns a different job to each technique: plan the channel (<b>T1213<\/b>), implement the chat alternative (<b>T1213.005<\/b>), verify critical email-initiated actions (<b>T1114<\/b>), alert on unusual email activity — mass forwarding, large attachments (<b>T1114.001/.002/.003<\/b>), and write OOB usage into policy (<b>T1489 Service Stop<\/b>).<\/p>\n<p>At this level the exam mirrors a senior analyst's day: the CISO wants a decision in ten minutes; the telemetry contradicts the change ticket; the relay's logs expired exactly when you need them; the correct action costs real money (a delayed wire, a missed press deadline) and you must say so and take it anyway; and a widely quoted &quot;best practice&quot; — consolidate everything onto one platform — turns out to be the wrong answer in this specific context.<\/p>\n<p>You will resolve which signal wins and why, decide when to act and when to gather more evidence, keep evidence intact while containing, rotate a possibly-compromised OOB channel without cutting your own lifeline, and — once — type a safe configuration command into a simulated shell to deliver an alert through the out-of-band relay. Every scenario is fiction, but every trap in it has happened to someone.<\/p>\n", "keywords": [{"theme": "Chained incident decisions", "items": ["Watcher in chat/email during ransomware (T1213.005 / T1114)", "Pending wire fraud under deadline (OOB verification)", "Surgical containment while preserving evidence", "Holding public statements until OOB verification completes"]}, {"theme": "Contradiction resolution", "items": ["Change ticket vs external forwarding destination", "Maintenance window vs suspicious relay behaviour", "Telemetry vs stakeholder opinion"]}, {"theme": "Channel integrity", "items": ["OOB contact list leakage and rotation via a second mechanism", "Unauthorised members and recovery-code joins on the OOB channel", "Consolidation as a single point of failure (best practice, wrong context)"]}, {"theme": "Governance & delivery", "items": ["Use-column guidance mapped per technique (plans / implement / verify / alert / policy)", "Delivery confirmation and log retention on the OOB relay", "Safe alert delivery through the relay (typed command, configuration only)"]}], "exercises": [{"id": "X01", "type": "triage", "summary": "Northbridge Financial — 16:22, everything at once", "scenario": "<p>16:22. Ransomware note on the file cluster. An interactive session (source 203[.]0[.]113[.]87, defanged) has been reading the chat channels labelled IR since 15:58. A wire-change request from the CFO's mailbox landed at 16:04 with an 18:00 deadline. Comms wants a public statement by 17:00. The CTO insists chat is safe: &quot;we patched the server yesterday.&quot;<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Session telemetry<\/div><div class=\"art-body\"><pre>15:58 imap/chat session opened from 203[.]0[.]113[.]87 (defanged)\n16:01 channel #ir-war-room viewed 41 times by the session\n16:04 mailbox cfo@nbridge-fin.example: session active\n16:07 new inbox rule \"RSS Feeds\" on cfo@nbridge-fin.example<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 2 — Pending request<\/div><div class=\"art-body\"><pre>16:04 from cfo@nbridge-fin.example to ap-team\n subject: APPROVE WIRE DETAIL CHANGE — supplier Meridian (deadline 18:00)\n amount: 2.4M — new beneficiary account\n note: confirm by reply email<\/pre><\/div><\/div>", "question": "Take the four decisions. Two of them cost the business something — take them anyway.", "hint": "Telemetry beats opinion, the deadline is the attacker's tool, the press deadline is yours to hold, and evidence outlives the incident.", "steps": [{"situation": "The CTO says chat is safe because it was patched. Which channel decision stands?", "options": [{"text": "Activate the OOB channel and move coordination — the session is reading IR channels now; patching does not un-read it", "correct": true, "why": "The telemetry shows active reading of the war-room channel. The T1213.005 guidance is the OOB alternative once in-network chat is untrusted. Patch status is irrelevant to what was already collected."}, {"text": "Keep chat — the CTO owns the platform and vouches for it", "correct": false, "why": "Opinion does not cancel telemetry. The adversary is inside the channel; every decision posted there is theirs."}, {"text": "Keep chat for executives only and move the rest to OOB", "correct": false, "why": "Executive decisions are precisely the content the watcher values most. A partial move leaks the most valuable traffic."}]}, {"situation": "The 2.4M wire change expires at 18:00. What happens to it?", "options": [{"text": "Verify the request by OOB call-back to the CFO's known number now — accept that approval may slip past the deadline", "correct": true, "why": "The mailbox is actively compromised (session + forwarding rule). The page requires OOB verification of financial transactions; the deadline pressure is the attacker's lever."}, {"text": "Approve before 18:00 to avoid the supplier penalty — the CFO's mailbox sent it", "correct": false, "why": "Approving an unverified wire from a compromised mailbox is the fraud outcome the attacker built the deadline for."}, {"text": "Reject the wire permanently and reopen supplier onboarding", "correct": false, "why": "Disproportionate: the request may be entirely legitimate. Verification decides — not rejection."}]}, {"situation": "Comms needs a public statement by 17:00. Your call?", "options": [{"text": "Hold the statement until facts are verified via OOB — take the press hit", "correct": true, "why": "Statements built on unverified telemetry create legal and market exposure; the OOB channel is where the facts get confirmed first. The delay is a real cost you accept consciously."}, {"text": "Comment now: &quot;ransomware incident, all systems safe&quot;", "correct": false, "why": "You cannot stand behind &quot;all systems safe&quot; while the session is live and uncontained. False reassurance is worse than no comment."}, {"text": "Let Comms publish whatever Legal drafts without technical input", "correct": false, "why": "Publishing without technical verification outsources the risk to people without the telemetry."}]}, {"situation": "The mail team proposes wiping the CFO mailbox to stop collection. Decide.", "options": [{"text": "Preserve the mailbox; kill the session and remove the rule surgically; coordinate on OOB", "correct": true, "why": "Evidence in the mailbox supports the fraud investigation and possible legal action. Collection stops by cutting the session and rule — not by destroying the record."}, {"text": "Wipe it before 18:00 so nothing else leaks", "correct": false, "why": "Destruction of evidence during an active fraud attempt is the one irreversible mistake on this list."}, {"text": "Leave the mailbox as-is and monitor passively", "correct": false, "why": "Passive monitoring leaves the forwarding rule and session live — collection and fraud attempts continue."}]}], "explanation": "<p>Four chained decisions, each with a real cost. The through-line: M1060's mechanisms are the decision tools — <b>activate the planned channel<\/b> against the watcher, <b>verify the wire OOB<\/b> against the deadline, <b>hold unverified statements<\/b> because OOB verification is also how facts (not just payments) get confirmed, and <b>contain surgically<\/b> so the evidence survives for the fraud case. The costs — a late wire, a late statement — are the price of not being defrauded and not lying publicly.<\/p>", "idx": 0}, {"id": "X02", "type": "qcm", "summary": "Change ticket vs destination", "scenario": "<p>03:41. The service account <span class=\"mono\">NBR-SyncAgent<\/span> creates three forwarding rules. Change ticket CHG-2291 covers a mail-to-ticket bridge rollout to an internal service address, window tonight, 30 support mailboxes. Two rules match the ticket. One rule forwards to <span class=\"mono\">ap-watch@palegrain-ops.example<\/span> — a domain that first appeared in registrar records three days ago.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — CHG-2291 (extract)<\/div><div class=\"art-body\"><pre>Type:    Standard change (pre-approved)\nTarget:  svc-ticketbridge@nbridge-internal.example (internal)\nAgent:   NBR-SyncAgent (expected)\nWindow:  tonight 03:00-05:00\nScope:   30 support-tier mailboxes<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 2 — Audit extract<\/div><div class=\"art-body\"><pre>03:41 NBR-SyncAgent New-InboxRule -> svc-ticketbridge@nbridge-internal.example  (matches CHG-2291)\n03:41 NBR-SyncAgent New-InboxRule -> svc-ticketbridge@nbridge-internal.example  (matches CHG-2291)\n03:42 NBR-SyncAgent New-InboxRule -> ap-watch@palegrain-ops.example             (NOT in CHG-2291; domain registered 3 days ago)<\/pre><\/div><\/div>", "question": "Two signals contradict: an approved change window and a hostile destination. Which wins, and what is the call?", "hint": "The ticket authorises a specific destination, scope, and principal. Ask what it says about the third rule.", "options": ["The change ticket wins — SyncAgent creates rules all the time, so treat all three as scheduled", "The external destination wins — the ticket cannot authorise it; treat that mailbox as under collection and respond", "Neither — three rules is too small a volume to conclude anything; re-check next week", "Both cancel out — wait until the change window closes and re-evaluate"], "answer": 1, "why": ["Wrong — the ticket authorises rules to the internal bridge address. The SyncAgent principal explains who created the rules, not what they are for.", "Correct — the pre-approved change covers the internal destination only. The third rule's destination is external, fresh, and absent from the ticket: collection on that mailbox. Alert via OOB and verify pending critical actions there.", "Wrong — volume is not the test. One hostile destination is enough; collection does not need scale to hurt.", "Wrong — waiting inside the window leaves the hostile rule collecting while you decide. The signals do not cancel; the ticket simply does not cover the third rule."], "explanation": "<p>Contradiction resolution: a change ticket is an authorisation <b>scoped to its stated target, scope, and principal<\/b>. The first two rules sit inside that scope. The third shares the principal and the window — which is why it looks scheduled — but its destination is outside the ticket and its domain is three days old. The ticket signal explains the noise; the destination signal identifies the attack. The correct call: <b>OOB alert on the anomaly, OOB verification of pending actions on that mailbox<\/b>, and a conversation with the change owner through the OOB path.<\/p>", "idx": 1}, {"id": "X03", "type": "dnd", "summary": "Which moves does M1060 actually ground?", "scenario": "<p>The Northbridge incident board lists eight proposed actions for the double-extortion case. The CISO wants to know which are grounded in the M1060 mitigation's own guidance — and which are good IR that belongs to a different control.<\/p>", "question": "Drag each action into the correct bucket.", "hint": "Four actions implement the page's Use-column guidance. Four are legitimate incident response that other controls own.", "zones": [{"id": "grounded", "label": "Grounded in M1060 guidance — the page's own mechanisms"}, {"id": "other", "label": "Valid IR — different control"}], "items": [{"label": "Verify the pending wire by OOB call-back before approval", "zone": "grounded", "why": "Financial transactions initiated via email are the page's named case for OOB verification."}, {"label": "Alert the SOC about the forwarding-rule spike through the OOB channel", "zone": "grounded", "why": "Unusual email activity alerted out-of-band is the page's T1114-family guidance."}, {"label": "Activate the planned OOB channel and move coordination to it", "zone": "grounded", "why": "The T1213/T1213.005 guidance: the OOB channel replaces in-network chat once it is untrusted."}, {"label": "Keep the IR plan off in-network chat while the adversary is inside", "zone": "grounded", "why": "This is the planning guidance of T1213 — do not store the response plan where in-network repositories are read."}, {"label": "Isolate the two affected workstations at the EDR level", "zone": "other", "why": "Correct containment, but it is endpoint control — not a communications mitigation."}, {"label": "Rotate the KRBTGT account password", "zone": "other", "why": "Active Directory hygiene against ticket forgery — unrelated to the OOB channel."}, {"label": "Restore the file servers from last night's backups", "zone": "other", "why": "Recovery is a different discipline (and a different mitigation: data backup)."}, {"label": "Add the phishing domain to the mail gateway blocklist", "zone": "other", "why": "Anti-phishing mail security — it addresses entry (T1566), which M1060 does not claim."}], "explanation": "<p>The exercise forces scope honesty under pressure. The four grounded moves are literally the page: <b>verify<\/b> critical actions, <b>alert<\/b> on email anomalies, <b>activate<\/b> the planned channel, keep the <b>plan out of in-network repositories<\/b>. The other four are excellent IR — isolation, KRBTGT rotation, restoration, blocklisting — but attributing them to M1060 would inflate the mitigation's coverage and hide real control owners.<\/p>", "idx": 2}, {"id": "X04", "type": "terminal", "summary": "Deliver the fraud alert through the OOB relay", "scenario": "<p>17:31. The wire-verification alert must reach the <span class=\"mono\">ir-emergency<\/span> channel on the Northbridge OOB relay. The incident bridge hands you the jump host. Someone has left three sticky notes on the monitor.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Incident bridge note<\/div><div class=\"art-body\"><pre>The in-network chat webhook is NOT to be used:\n  chat-webhook.nbridge-internal.example   (suspected watched by the session)\nProposal to stop the chat relay service is REJECTED by IR lead.\nDeliver the alert ONLY through the OOB relay.<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 2 — OOB relay card (vault copy)<\/div><div class=\"art-body\"><pre>Endpoint : https://oob-relay.nbridge-internal.example/api/v1/alerts\nMethod   : POST\nHeader   : X-OOB-Key: dragonfly-oob-9f3\nPayload  : {\"channel\":\"ir-emergency\",\"text\":\"VERIFY WIRE REQUEST VIA OOB\"}\nNote     : relay cert is internal CA — already trusted on this jump host<\/pre><\/div><\/div><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 3 — Sticky notes left on the monitor<\/div><div class=\"art-body\"><pre>[a] systemctl stop mattermost-relay   (annotated: \"stops the leak\")\n[b] curl -X POST -H \"X-OOB-Key: dragonfly-oob-9f3\" -d '{\"channel\":\"ir-emergency\",\"text\":\"VERIFY WIRE REQUEST VIA OOB\"}' https://oob-relay.nbridge-internal.example/api/v1/alerts\n[c] curl -k -X POST -d '{\"channel\":\"ir-emergency\"}' https://chat-webhook.nbridge-internal.example/alert<\/pre><\/div><\/div>", "question": "Type the command that delivers the alert through the OOB relay, correctly, without doing damage.", "hint": "One sticky note is the right shape. One destroys your alerting. One sends the alert to the watcher — and one flag silently drops TLS verification.", "prompt": "analyst@jump-01:~$", "motd": "Northbridge break-glass jump host. OOB relay trusted (internal CA). Type your command and press Enter.", "elements": [{"label": "the curl tool", "accept": ["(^|\\s)curl(\\s|$)"], "why": "curl is the delivery tool for the HTTP POST to the relay."}, {"label": "explicit POST method (-X POST)", "accept": ["-x\\s*post"], "why": "The relay card specifies POST; an explicit -X POST states the method."}, {"label": "the X-OOB-Key auth header with the vault token", "accept": ["x-oob-key:\\s*dragonfly-oob-9f3"], "why": "Without the vault token the relay rejects the delivery — the alert silently never arrives."}, {"label": "payload targeting the ir-emergency channel", "accept": ["\"channel\"\\s*:\\s*\"ir-emergency\""], "why": "The payload must address the emergency channel, not a general chat room."}, {"label": "payload text calling for OOB wire verification", "accept": ["verify wire request via oob"], "why": "The text is the actual instruction the responders act on."}, {"label": "the OOB relay endpoint URL", "accept": ["oob-relay\\.nbridge-internal\\.example/api/v1/alerts"], "why": "The relay endpoint is the only sanctioned destination for this alert."}], "poisons": [{"label": "stopping or restarting a comms service (systemctl stop/restart)", "accept": ["systemctl\\s+(stop|restart|kill)"], "why": "This cuts your own alerting and coordination during a live incident — the destructive path."}, {"label": "posting to the in-network chat webhook", "accept": ["chat-webhook\\.nbridge-internal"], "why": "The watcher reads that chat. The alert would tell the adversary exactly what you are about to verify."}, {"label": "disabling TLS verification (-k / --insecure)", "accept": ["(^|\\s)-k(\\s|$)|--insecure"], "why": "The relay cert is already trusted on the jump host; -k only weakens the one path you cannot afford to weaken."}], "canonical": "curl -X POST -H \"X-OOB-Key: dragonfly-oob-9f3\" -d '{\"channel\":\"ir-emergency\",\"text\":\"VERIFY WIRE REQUEST VIA OOB\"}' https://oob-relay.nbridge-internal.example/api/v1/alerts", "output": "{\"status\":\"queued\",\"channel\":\"ir-emergency\",\"delivery\":\"confirmed via satellite uplink\",\"ref\":\"OOB-2261\"}", "timerSec": 240, "explanation": "<p>The graded elements: the <b>tool<\/b> (curl), the <b>method<\/b> (-X POST), the <b>auth header<\/b> (X-OOB-Key with the vault token), the <b>payload channel<\/b> (ir-emergency), the <b>payload text<\/b> (the actual instruction), and the <b>endpoint<\/b> (the OOB relay). The poison paths: sticky note [a] stops your own relay — you cannot un-send silence; note [c] posts the alert into the chat the adversary watches — you would announce your verification step to the fraudster; and <span class=\"mono\">-k<\/span> drops TLS verification on the one channel whose integrity is the entire point. This is a <b>configuration/delivery<\/b> action: nothing here exploits anything — it keeps the response alive.<\/p>", "idx": 3}, {"id": "X05", "type": "qcm", "summary": "The adversary has your OOB contact list", "scenario": "<p>Forensics confirms the adversary exfiltrated the OOB contact tree — names, numbers, and the monthly rotation codes — from the CFO mailbox where a deputy had emailed it &quot;for the record&quot;. Pending critical requests are outstanding. The emergency channel itself shows no unauthorised joins yet.<\/p>", "question": "What is the correct senior call?", "hint": "The channel is only as trusted as its directory. What must happen, and through which mechanism?", "options": ["Trust the channel anyway — out-of-band means the adversary cannot touch it, by definition", "Rotate contacts, numbers, and codes via the second OOB mechanism, and re-verify all pending critical requests under the new tree", "Shut the OOB channel down until forensics concludes, and pause all incident communication", "Announce the rotation and the new numbers in the in-network chat so everyone sees them quickly"], "answer": 1, "why": ["Wrong — &quot;out-of-band by definition&quot; is the trap: the channel's security depends on its directory staying private. With the tree and codes leaked, trust must be re-established, not assumed.", "Correct — rotate the leaked material (numbers, codes, member list) through the second, still-trusted mechanism, then re-verify outstanding critical actions under the new tree. The channel survives because a second path exists to bootstrap it.", "Wrong — shutting the lifeline during an active incident cuts coordination exactly when the adversary wants you silent. Rotation, not amputation.", "Wrong — the in-network chat is compromised space. Publishing the new tree there hands the adversary the rotation itself."], "explanation": "<p>The OOB channel is a system: <b>path + directory + codes + people<\/b>. Leakage of the directory and rotation codes degrades the trust the whole mitigation stands on. The senior move is bootstrap rotation through the <b>second mechanism<\/b> (the page's own logic: a separate, still-independent path), followed by re-verification of outstanding critical actions — the fraud the leak enables happens at the request level, not the channel level.<\/p>", "idx": 4}, {"id": "X06", "type": "order", "summary": "Rank the relay-compromise handling", "scenario": "<p>An unauthorised member joined the ir-emergency channel with a recovery code last night. The relay owner is on the bridge. Sequence the response.<\/p>", "question": "Rank the four steps from first to last.", "hint": "Rotation destroys some evidence. Order the steps so nothing needed is lost and nobody works from a poisoned tree.", "steps": ["Preserve the relay logs and member records", "Rotate relay credentials and remove unauthorised members via the second mechanism", "Re-verify all pending critical requests under the new contacts", "Publish the updated contact tree to responders through the OOB path"], "explanation": "<p>The order protects two assets: <b>evidence<\/b> and <b>trust<\/b>. Logs and member records are preserved <b>first<\/b> — credential rotation and member removals rewrite exactly the state the investigation needs. Rotation happens <b>second<\/b> through the second, still-trusted mechanism. Pending critical requests are re-verified <b>third<\/b> — any request &quot;confirmed&quot; during the compromise window is void until re-confirmed under the new tree. The updated tree is published <b>last<\/b>, on the OOB path, so responders never work from the poisoned version.<\/p>", "idx": 5}, {"id": "X07", "type": "match", "summary": "Four stakeholders, four grounded responses", "scenario": "<p>Hour three at Northbridge. Four demands land within ten minutes. Each answer must be grounded in the M1060 guidance and survive the post-incident review.<\/p>", "question": "Match each demand to the response you give.", "hint": "Two demands push toward aggressive action; two push toward speed. The grounded answers resist both pulls.", "pairs": [{"left": "CISO: &quot;Just switch email off until this is over.&quot;", "right": "Keep low-sensitivity traffic on email; move critical actions to OOB verification and monitor the scoped mailboxes", "why": "A total mail outage is disproportionate and damages the business without adding safety; the page's mechanism is verification of critical actions, not abstinence."}, {"left": "CFO: &quot;Approve the wire now, we are past the deadline.&quot;", "right": "Verify via OOB call-back first — accept the delay and its cost, and tell the supplier why", "why": "An unverified wire from a compromised mailbox is the attacker's goal; the deadline is their tool. Verification decides, not the clock."}, {"left": "Legal: &quot;We need those mailboxes preserved for the fraud case.&quot;", "right": "Preserve mailboxes and relay logs; contain surgically (kill sessions, remove rules), never wipe", "why": "Preservation supports the case; surgical containment stops the bleeding. Wiping is irreversible and unnecessary."}, {"left": "Comms: &quot;We must comment within the hour.&quot;", "right": "Hold the statement until facts are verified through OOB; publish only what is confirmed", "why": "Statements are irreversible. The OOB channel is where facts get confirmed first — hours later is still better than wrong."}], "explanation": "<p>Senior decisions trade two pressure axes: <b>aggression<\/b> (switch everything off, wipe everything) and <b>speed<\/b> (approve now, comment now). The M1060-grounded answers cut through both: verification for critical actions, preservation with surgical containment for evidence, and verified facts — not vibes — for public statements. Each grounded response has a cost, and each cost is named and accepted in the answer.<\/p>", "idx": 6}, {"id": "X08", "type": "log", "summary": "Relay telemetry the night after the maintenance window", "scenario": "<p>07:00. The Northbridge OOB relay telemetry shows an odd night. The primary chat platform works fine.<\/p>", "question": "Which conclusions are defensible on this evidence?", "hint": "Three readings survive the evidence. Two are traps: one normalises, one overreacts.", "logLines": ["<span class=\"lg-ts\">2026-04-14 22:00:03Z<\/span> <span class=\"lg-key\">OOB-RELAY<\/span> uplink-1 <span class=\"lg-ok\">heartbeat=ok<\/span> <span class=\"lg-dim\">latency=212ms<\/span>", "<span class=\"lg-ts\">2026-04-14 22:00:03Z<\/span> <span class=\"lg-key\">OOB-RELAY<\/span> uplink-2 <span class=\"lg-bad\">auth=failing<\/span> <span class=\"lg-dim\">retry=60s<\/span>", "<span class=\"lg-ts\">2026-04-14 21:58:41Z<\/span> <span class=\"lg-key\">CHG<\/span> <span class=\"lg-dim\">approved window 21:00-23:00: uplink-2 provider migration (CHG-3118)<\/span>", "<span class=\"lg-ts\">2026-04-15 06:30:00Z<\/span> <span class=\"lg-key\">CAL<\/span> <span class=\"lg-dim\">quarterly end-to-end test due 2026-04-20<\/span>"], "widget": {"id": "X08w", "type": "multi", "summary": "", "scenario": "", "question": "Select every defensible conclusion.", "hint": "", "options": ["The OOB backup path is currently degraded — fix uplink-2 auth and re-run the end-to-end test", "The evidence points to maintenance drift, not intrusion: the failure matches the approved migration window", "Re-run the quarterly end-to-end test after the fix and record the result as evidence", "The OOB channel is fine to mark ready — the primary chat platform works", "Assume the relay is compromised and rebuild it from zero before anything else"], "answers": [0, 1, 2], "why": ["Correct — uplink-2 auth is failing; a backup path that is down is a finding, not a footnote.", "Correct — the failure starts inside the approved migration window with a matching change ID. Maintenance drift is the parsimonious reading; no intrusion indicators exist.", "Correct — the test is due within days anyway; after the fix, the end-to-end test with recorded evidence is what turns the fix into assurance.", "Wrong — &quot;chat works&quot; is irrelevant to the OOB channel's readiness. The backup path must stand on its own; that is the entire definition of out-of-band.", "Wrong — rebuilding from zero contradicts the evidence: the failure pattern matches an approved change. Disproportionate and destructive to the relay's own state."], "explanation": ""}, "explanation": "<p>Three defensible readings: <b>fix and re-test<\/b> the degraded backup path; attribute the failure to <b>maintenance drift<\/b> (the change window and ID match, no intrusion indicators); and convert the fix into assurance with a recorded <b>end-to-end test<\/b>. The two traps are the everyday ones: normalising because the in-network platform still works, and overreacting to a rebuild that the evidence does not support. Senior judgement reads the change record against the telemetry before choosing an expensive story.<\/p>", "idx": 7}, {"id": "X09", "type": "fill", "summary": "Complete the board memo", "scenario": "<p>Three phrases are missing from the memo the Northbridge board will read before funding the programme.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Board memo (excerpts)<\/div><div class=\"art-body\"><p>1. The OOB channel provides an (1)____ path when the primary network is compromised or down.<\/p><p>2. Payment changes requested by email are verified by (2)____ before approval — always.<\/p><p>3. Forwarding-rule anomalies reach the response team through (3)____, never through the mail system itself.<\/p><\/div><\/div>", "question": "Choose the three missing phrases.", "hint": "The memo's three blanks are the three mechanisms in board language — and one distractor is the attacker's version of one of them.", "template": "1. The OOB channel provides an {{0}} path when the primary network is compromised or down.<br>2. Payment changes requested by email are verified by {{1}} before approval — always.<br>3. Forwarding-rule anomalies reach the response team through {{2}}, never through the mail system itself.", "bank": ["independent", "call-back", "out-of-band alerts", "email confirmation", "in-network", "automatic forwarding", "faster"], "answers": ["independent", "call-back", "out-of-band alerts"], "why": ["Blank 1: independence from the primary infrastructure is the defining property of out-of-band.", "Blank 2: the call-back on a known OOB number is the verification mechanism for financial transactions.", "Blank 3: alerts about mail anomalies travel out-of-band so the adversary cannot read or block them.", "&quot;Email confirmation&quot; is the near-miss: it confirms the request inside the very channel the attacker owns. The page requires verification out-of-band, not inside the compromised path.", "&quot;Faster&quot; is not the property the board is funding — independence is.", "&quot;In-network&quot; is the path the adversary owns; the memo says never.", "&quot;Automatic forwarding&quot; is the attacker's technique (T1114.003), not the defence."], "explanation": "<p>The memo's three blanks are the mitigation's three mechanisms in board language: an <b>independent<\/b> path, <b>call-back<\/b> verification for financial transactions, and <b>out-of-band alerts<\/b> for the anomalies that reveal collection. If the board funds exactly these three, the mitigation exists; everything else is detail.<\/p>", "idx": 8}, {"id": "X10", "type": "fill", "summary": "Complete the architecture verdict", "scenario": "<p>A vendor proposes consolidating chat, email, telephony, and the emergency channel onto one platform — &quot;one pane of glass, best practice&quot;. The architect's verdict has two blanks.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Verdict (excerpts)<\/div><div class=\"art-body\"><p>1. Consolidating the emergency channel into the same platform creates a (1)____.<\/p><p>2. The M1060 design requires the emergency channel to remain (2)____ of the primary infrastructure.<\/p><\/div><\/div>", "question": "Choose the two missing phrases.", "hint": "Test the vendor's claim against the one property the page demands of the emergency path — and against what a shared platform means for that property.", "template": "1. Consolidating the emergency channel into the same platform creates a {{0}}.<br>2. The M1060 design requires the emergency channel to remain {{1}} of the primary infrastructure.", "bank": ["single point of failure", "independent", "unified", "cheaper", "optional", "compliant"], "answers": ["single point of failure", "independent"], "why": ["Blank 1: one platform for primary and emergency communication means one compromise or outage takes both — a single point of failure.", "Blank 2: the page's defining requirement: the OOB path must be independent of the potentially compromised primary infrastructure.", "&quot;Unified&quot; is the vendor's word, not a security property.", "&quot;Cheaper&quot; may be true and is still not the deciding property for the emergency path.", "&quot;Optional&quot; contradicts the design: the channel must be ready, not optional.", "&quot;Compliant&quot; — a consolidated emergency channel can pass a checklist and still fail the independence test."], "explanation": "<p>The &quot;consolidate everything&quot; best practice is genuinely good for operations — and genuinely wrong for the emergency channel in this context. The moment primary and emergency share a platform, one compromise (or one Service Stop, T1489) takes both. The page's requirement is not elegance or cost: it is <b>independence<\/b>, and independence survives audits only if it survives architecture diagrams too.<\/p>", "idx": 9}, {"id": "X11", "type": "triage", "summary": "Kestrel Manufacturing — absent contact, expiring logs, penalty clause", "scenario": "<p>11:40. Kestrel Manufacturing: a wire-detail change is pending from a mailbox with a fresh forwarding rule. The primary OOB contact (the CFO) is on leave and unreachable. The secondary contact is the finance deputy — reachable on the dedicated emergency line. Relay logs for last night expired (7-day retention) — last night's fraud alert has no delivery receipt. The supplier contract charges a 1.5% penalty for payments delayed past 17:00.<\/p>", "question": "Four decisions. One of them must explicitly choose to gather evidence instead of acting.", "hint": "Two OOB mechanisms exist; use the one that works. Costs are real; name them and accept them. Missing evidence is a finding, not a reason to assume success.", "steps": [{"situation": "The primary OOB contact is on leave. Which verification path is valid?", "options": [{"text": "Use the second mechanism: verify via the finance deputy on the dedicated emergency line", "correct": true, "why": "The OOB design includes a second mechanism exactly for this. The page's requirement is verification through an independent path — not through one specific person."}, {"text": "Verify by reply email — the CFO's deputy can answer from the mailbox", "correct": false, "why": "The mailbox has a fresh forwarding rule; email is the attacker's channel. In-band verification is worthless here."}, {"text": "Wait until the CFO returns from leave", "correct": false, "why": "The fraud window is open now. Waiting converts a verification problem into a loss."}]}, {"situation": "The wire expires at 17:00 with a 1.5% penalty. What is the call after the deputy confirms suspicion?", "options": [{"text": "Hold the payment past 17:00 even though the penalty fires — name the cost and take it", "correct": true, "why": "A 1.5% penalty is a known, bounded cost. An unverified 2M wire is unbounded. The correct action here has a real price, and the senior call is to pay the penalty, not the fraudster."}, {"text": "Pay before 17:00 to avoid the penalty — verification can continue in parallel", "correct": false, "why": "You cannot un-send a wire. &quot;In parallel&quot; means the money moves before the control the page prescribes has spoken."}, {"text": "Cancel the supplier relationship entirely", "correct": false, "why": "Disproportionate and irreversible — the request may be legitimate; the supplier is not the adversary."}]}, {"situation": "Last night's relay logs expired and the fraud alert has no delivery receipt. What now?", "options": [{"text": "Escalate to the relay owner: re-send the alert with delivery confirmation enabled and raise the retention gap as a finding", "correct": true, "why": "This is the gather-evidence answer: without a receipt, delivery is unproven. Escalation plus a re-send with confirmation converts an assumption into evidence, and the retention gap becomes a tracked fix."}, {"text": "Assume the alert was delivered — the relay was healthy yesterday", "correct": false, "why": "Assumption is not delivery. The alert is the one that protects the wire path; it must be proven."}, {"text": "Mark the alert as lost and move on — the deputy is already informed anyway", "correct": false, "why": "Silent gaps in the emergency path are how the next incident finds you. The gap itself is a finding to close."}]}, {"situation": "The deputy asks what to tell the supplier about the delay. What is defensible?", "options": [{"text": "State that a payment-verification control is being applied and the payment will follow once verified — no incident details beyond that", "correct": true, "why": "Minimal, true, and safe: in-network channels may be watched, and supplier mail is an adversary-reachable surface. Detail travels OOB only."}, {"text": "Email the supplier a full incident timeline with the forwarding-rule details", "correct": false, "why": "That email may be read by the adversary (the mailbox is compromised) and leaks investigation detail to an external party."}, {"text": "Say nothing at all and go silent until the payment lands", "correct": false, "why": "Silence burns the relationship and invites escalation calls to whatever mailbox the adversary controls."}]}], "explanation": "<p>This chain tests the three senior skills together: <b>redundancy<\/b> (the second OOB mechanism exists for exactly the absent-contact case), <b>cost-accepting decisions<\/b> (the penalty is the price of not wiring 2M to a fraudster — named, bounded, accepted), and <b>evidence discipline<\/b> (no delivery receipt means escalate and re-send with confirmation, and the retention gap becomes a tracked finding). The &quot;assume it worked&quot; and &quot;pay to make it go away&quot; options are the realistic senior traps.<\/p>", "idx": 10}, {"id": "X12", "type": "spot", "summary": "Two fatal flaws in the crisis-comms architecture", "scenario": "<p>Post-incident review of the Northbridge crisis-comms architecture. Exactly two lines are fatal to the design.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Architecture review (excerpts)<\/div><div class=\"art-body\"><pre>1. The OOB bridge signs in with the corporate SSO so joiners are auditable.\n2. OOB alerts are mirrored into responders' in-network inboxes as a backup.\n3. The dedicated emergency system runs its own uplink and its own directory.\n4. Relay credentials rotate after every drill; copies live in the offline vault.\n5. The contact tree lives outside the mail environment, mirrored on laminated cards.<\/pre><\/div><\/div>", "question": "Click the two lines that fatally break the out-of-band design.", "hint": "Both fatal lines buy convenience or redundancy with independence. Test every line against the definition before you click.", "lines": [{"text": "The OOB bridge signs in with the corporate SSO so joiners are auditable.", "bad": true, "why": "The SSO dependency means whoever controls the identity plane controls the emergency channel. Auditability is bought by giving up independence — fatal."}, {"text": "OOB alerts are mirrored into responders' in-network inboxes as a backup.", "bad": true, "why": "The mirror lands the alert in the exact place the adversary reads or blocks. It leaks that detection happened and silences with the inbox — fatal."}, {"text": "The dedicated emergency system runs its own uplink and its own directory.", "bad": false, "why": "Correct: own uplink, own directory — independence in both path and identity."}, {"text": "Relay credentials rotate after every drill; copies live in the offline vault.", "bad": false, "why": "Correct: rotation plus offline storage keeps credentials out of the compromised environment."}, {"text": "The contact tree lives outside the mail environment, mirrored on laminated cards.", "bad": false, "why": "Correct: the tree survives a mail-environment compromise; paper is the ultimate out-of-band backup."}], "explanation": "<p>Both fatal lines fail the same test from opposite ends: line 1 lets the <b>compromised identity plane<\/b> into the emergency channel (the attacker can now join it); line 2 pushes <b>alerts back into the watched environment<\/b> (the attacker learns and can silence them). The remaining lines show what independence looks like: own uplink, own directory, rotated credentials in an offline vault, and a contact tree that survives the mail environment — even on paper.<\/p>", "idx": 11}, {"id": "X13", "type": "dnd", "summary": "Map the page's guidance to its mechanism", "scenario": "<p>The Northbridge control pack quotes the M1060 page's Use column verbatim. Each quote must map to the mechanism it implements.<\/p>", "question": "Drag each quote to the mechanism it implements.", "hint": "Watch for &quot;plans&quot; vs &quot;implement&quot;, and for the two alert quotes (local email vs forwarding/attachments).", "zones": [{"id": "plan", "label": "Plan the channel — create the plan"}, {"id": "implement", "label": "Implement the alternative — stand it up"}, {"id": "verify", "label": "Verify critical actions — confirm the request"}, {"id": "alert", "label": "Alert on email activity — raise the alarm"}, {"id": "policy", "label": "Policy & continuity — write it into policy"}], "items": [{"label": "“Create plans for leveraging a secure OOB channel, rather than existing in-network chat applications, in case of a security incident.”", "zone": "plan", "why": "This is the T1213 row: planning the channel instead of in-network chat."}, {"label": "“Implement secure OOB channels to use as an alternative to in-network chat during a security incident.”", "zone": "implement", "why": "This is the T1213.005 row: standing the alternative up for messaging applications."}, {"label": "“Use secure OOB authentication methods to verify the authenticity of critical actions initiated via email, such as password resets, financial transactions, or access requests.”", "zone": "verify", "why": "This is the T1114 row: verification of email-initiated critical actions."}, {"label": "“Set up out-of-band alerts to notify security teams of unusual local email activities, such as mass forwarding or large attachments being sent.”", "zone": "alert", "why": "This is the T1114.001 row: OOB alerts on local email anomalies."}, {"label": "“Develop and enforce security policies that include the use of out-of-band communication channels for critical communications during a security incident.”", "zone": "policy", "why": "This is the T1489 row: policy keeps coordination alive through Service Stop."}, {"label": "“Create plans for leveraging a secure OOB communications channel, rather than an existing in-network email server, in case of a security incident.”", "zone": "plan", "why": "The .002/.003 rows carry the same planning guidance, aimed at the email server instead of chat."}, {"label": "“Set up out-of-band alerts to notify security teams of unusual email activities, such as mass forwarding or large attachments being sent.”", "zone": "alert", "why": "The .002/.003 rows also carry the alert guidance — unusual email activity, alerted out-of-band."}], "explanation": "<p>Seven quotes, five mechanisms. The mapping is the control pack's backbone: <b>plan<\/b> (T1213 and the .002/.003 planning clauses), <b>implement<\/b> (T1213.005), <b>verify<\/b> (T1114), <b>alert<\/b> (T1114.001 and the .002/.003 alert clauses), <b>policy<\/b> (T1489). When an auditor asks &quot;which mechanism implements which row?&quot;, this board is the answer.<\/p>", "idx": 12}, {"id": "X14", "type": "qcm", "summary": "No receipt, no assumption", "scenario": "<p>Day 3. The relay's 7-day log retention means last night's fraud alert has no delivery record. The response team worked from it anyway — the deputy says she &quot;remembers seeing something on the emergency line&quot;. Nobody re-sent it.<\/p>", "question": "What is the correct senior action?", "hint": "Two paths assume; one path silently discards. What does a control worth trusting do instead?", "options": ["Assume delivery — the relay heartbeat was green all night", "Re-send the alert with delivery confirmation and escalate the retention gap to the relay owner as a finding", "Accept the loss — the moment has passed, and re-sending would be noise", "Trust the deputy's recollection and write it into the incident record as confirmed delivery"], "answer": 1, "why": ["Wrong — a green heartbeat says the relay is up, not that a specific message reached a human. Heartbeat is not a receipt.", "Correct — re-send with confirmation turns an assumption into evidence, and the retention gap (logs that expire before an investigation can use them) is escalated as a finding with an owner. The emergency path must be provable.", "Wrong — discarding the gap guarantees it repeats on the night it matters. &quot;Noise&quot; is what untested controls say before they fail.", "Wrong — recollection is not delivery evidence, and writing it into the record as &quot;confirmed&quot; poisons the incident record itself."], "explanation": "<p>The senior principle: <b>an unproven delivery is a control gap, not a footnote<\/b>. Re-sending with delivery confirmation converts assumption into evidence; escalating the retention gap makes the relay's owner fix the root cause (logs must outlive the incident). The two &quot;assume&quot; paths and the &quot;let it go&quot; path all leave the emergency path unprovable — which is precisely how a response organisation loses its last trusted channel without noticing.<\/p>", "idx": 13}, {"id": "X15", "type": "fill", "summary": "Complete the governance pack description", "scenario": "<p>Kestrel Manufacturing's OOB governance pack is described in two sentences with two blanks.<\/p><div class=\"artefact\"><div class=\"art-label\">ARTEFACT 1 — Governance pack (excerpts)<\/div><div class=\"art-body\"><p>1. The pack contains the activation criteria and a contact tree that receives a quarterly (1)____ with named owners.<\/p><p>2. Every drill produces signed (2)____ — a drill without evidence counts as not happened.<\/p><\/div><\/div>", "question": "Choose the two missing phrases.", "hint": "Directories rot and unevidenced drills are theatre — the two blanks are the antidotes to exactly those two failures.", "template": "1. The pack contains the activation criteria and a contact tree that receives a quarterly {{0}} with named owners.<br>2. Every drill produces signed {{1}} — a drill without evidence counts as not happened.", "bank": ["review", "test evidence", "audit report", "rotation schedule", "deletion", "auto-forward"], "answers": ["review", "test evidence"], "why": ["Blank 1: the contact tree is reviewed quarterly with named owners — people change numbers, roles, and employers.", "Blank 2: drills produce signed test evidence; unevidenced drills are how channels die quietly.", "&quot;Audit report&quot; is the near-miss: an audit report is compiled later from the evidence. The drill itself must produce the raw signed test evidence while it runs.", "&quot;Rotation schedule&quot; is a different control: rotation changes numbers and codes after incidents or leaks; the tree itself needs a quarterly review with named owners.", "&quot;Deletion&quot; of the tree is the opposite of governance.", "&quot;Auto-forward&quot; is the adversary's trick (T1114.003), not a governance step."], "explanation": "<p>Governance is what makes the mitigation survive its first quarter: the contact tree gets a <b>quarterly review<\/b> with named owners (directories rot), and every drill produces <b>signed test evidence<\/b> (unevidenced drills are theatre). These two artefacts are what an auditor asks for first — and what an incident responder thanks you for on the night.<\/p>", "idx": 14}, {"id": "X16", "type": "qcm", "summary": "A stranger on the trusted channel", "scenario": "<p>21:14. A message arrives on the ir-emergency OOB channel: &quot;IT here — activating the channel for all staff, confirm your identity by replying with your staff number.&quot; No ticket, no drill scheduled, and the requester's member record was created 40 minutes ago via a recovery code.<\/p>", "question": "What is the correct senior response?", "hint": "The channel is trusted — which is exactly what an intruder wants you to rely on. What verifies without burning the channel?", "options": ["Comply — the OOB channel is trusted by definition, so an activation request from it is legitimate", "Pause activation; verify the requester's identity through the second OOB mechanism, and hold broadcasts until confirmed", "Broadcast a warning to all staff on the in-network chat immediately", "Activate, then investigate the member record afterwards"], "answer": 1, "why": ["Wrong — trust in the channel is exactly what a joiner with a recovery code is attacking. An activation instruction is a critical action; it needs verification like any other.", "Correct — pause, verify through the second mechanism (known number to the real IT on-call), and hold broadcasts. If the requester is fake, you have kept the channel; if real, activation follows with two confirmations.", "Wrong — the in-network chat may be watched; broadcasting there tells the adversary you noticed, and possibly leaks the verification path.", "Wrong — activation on an unverified instruction could hand the channel — or a mass login prompt — to the attacker. Investigate first; the cost of an hour's delay is bounded."], "explanation": "<p>The hardest trap in the set: the trusted channel itself is used as the bait. &quot;Trusted by definition&quot; is true only while its <b>membership<\/b> stays clean — and the recovery-code join 40 minutes ago is the tell. The senior move treats <b>activation of the channel<\/b> as a critical action: verified through a second, independent mechanism before anything broadcasts. The cost is an hour of delay; the alternative is activating the channel into the attacker's hands.<\/p>", "idx": 15}], "introTitle": "M1060 — EXTREMELY HARD practice exam", "pageLabel": "M1060 — Out-of-Band Communications Channel (MITRE ATT&CK Mitigation, Enterprise)"};

/* ============================ UTILITIES ============================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtTime(sec){
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
var SEV_COLOR = { 'EASY': 'var(--sev-easy)', 'MEDIUM': 'var(--sev-medium)', 'HARD': 'var(--sev-hard)', 'EXTREMELY HARD': 'var(--sev-extreme)' };

/* ============================ SESSION STATE ============================ */
var S = null;           /* session */
var tickHandle = null;  /* 1s interval */
var attemptReported = false;

function newSession(){
  return {
    order: shuffle(DATA.exercises.map(function(e,i){ return i; })),
    idx: 0,                     /* position in order */
    credits: {},                /* exIndex -> credit (float) */
    hinted: {},                 /* exIndex -> true */
    checked: {},                /* exIndex -> true */
    skippedPool: [],            /* exIndexes skipped and not yet answered */
    timer: { remain: DATA.timerMinutes * 60, state: 'IDLE', prevState: null },
    pause: { manualSec: 0, feedbackSec: 0, mark: null },
    widgetState: {},            /* per-exercise renderer scratch */
    terminalClock: {},          /* exIndex -> remaining seconds */
    reviewReturn: false         /* true while the current exercise was returned from the review screen */
  };
}

/* ============================ TIMER STATE MACHINE ============================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED  (IDLE before start)
   Explicit transitions only. */
function tstate(){ return S.timer.state; }
function tset(st){
  var from = S.timer.state;
  if (from === st) return;
  /* accumulate pause statistics on leaving a paused state */
  var now = Date.now();
  if (S.pause.mark) {
    var d = (now - S.pause.mark) / 1000;
    if (from === 'PAUSED_MANUAL') S.pause.manualSec += d;
    if (from === 'PAUSED_AUTO_CHECK') S.pause.feedbackSec += d;
    S.pause.mark = null;
  }
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') S.pause.mark = now;
  S.timer.prevState = (st === 'PAUSED_MANUAL') ? from : S.timer.prevState;
  S.timer.state = st;
  renderTimer();
}
function startClock(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    if (!S) return;
    if (S.timer.state !== 'RUNNING') return;
    S.timer.remain -= 1;
    /* terminal per-exercise clock (EXTREMELY HARD terminal only) */
    var ex = curEx();
    if (ex && ex.type === 'terminal' && !S.checked[ex.idx] && S.terminalClock[ex.idx] > 0) {
      S.terminalClock[ex.idx] -= 1;
      var te = $('term-clock');
      if (te) te.textContent = '⏱ Command window: ' + fmtTime(S.terminalClock[ex.idx]) + ' remaining';
      if (S.terminalClock[ex.idx] === 0) {
        var ti = $('term-input');
        if (ti) { ti.disabled = true; }
        if (te) te.textContent = '⏱ Command window ended — press Check to submit what you have.';
      }
    }
    if (S.timer.remain <= 0) {
      S.timer.remain = 0;
      endExam(true);
      return;
    }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  var el = $('hdr-timer');
  if (!el) return;
  var st = S ? S.timer.state : 'IDLE';
  var icon = '▶', word = 'RUNNING', color = 'var(--state-correct)';
  if (st === 'PAUSED_MANUAL') { icon = '⏸'; word = 'PAUSED — manual (press Resume)'; color = 'var(--state-paused)'; }
  else if (st === 'PAUSED_AUTO_CHECK') { icon = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; color = 'var(--state-paused)'; }
  else if (st === 'ENDED') { icon = '⏹'; word = 'ENDED'; color = 'var(--state-incorrect)'; }
  else if (st === 'IDLE') { icon = '⏱'; word = 'READY'; }
  var t = S ? fmtTime(S.timer.remain) : fmtTime(DATA.timerMinutes * 60);
  el.innerHTML = '<span class="timer-val mono">' + t + '</span> ' +
    '<span class="timer-state" style="color:' + color + '">' + icon + ' ' + word + '</span>';
  var p = $('pause-btn');
  if (p) {
    if (st === 'PAUSED_MANUAL') { p.textContent = '▶ Resume'; p.disabled = false; }
    else if (st === 'PAUSED_AUTO_CHECK') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else if (st === 'RUNNING') { p.textContent = '⏸ Pause'; p.disabled = false; }
    else { p.textContent = '⏸ Pause'; p.disabled = true; }
  }
}

/* ============================ SCORING ============================ */
/* Mandatory formula: credit = max(0, (H - W) / N) */
function scoreExercise(H, W, N){
  if (N <= 0) return 0;
  return Math.max(0, (H - W) / N);
}
function liveScore(){
  var sum = 0, count = 0;
  Object.keys(S.checked).forEach(function(k){
    if (S.checked[k]) { sum += (S.credits[k] || 0); count += 1; }
  });
  return { sum: sum, count: count };
}
function renderScore(){
  var el = $('hdr-score');
  if (!el) return;
  var ls = liveScore();
  if (ls.count === 0) { el.innerHTML = 'Score <b>0.0 / 0</b>'; return; }
  var pct = Math.round((ls.sum / ls.count) * 100);
  el.innerHTML = 'Score <b>' + ls.sum.toFixed(1) + ' / ' + ls.count + '</b> · ' + pct + '%';
}

/* ============================ VIEWS ============================ */
function showView(name){
  ['intro','exam','review','results'].forEach(function(v){
    var el = $('view-' + v);
    if (el) el.classList.toggle('active', v === name);
  });
  window.scrollTo(0, 0);
}

/* ============================ INTRO ============================ */
function renderIntro(){

  h += '<div class="card intro-head">';
  h += '<h1>' + esc(DATA.introTitle) + '</h1>';
  h += '<div class="muted">' + esc(DATA.pageLabel) + '</div>';

  h += fact('Exercises in this file', String(DATA.exercises.length));
  h += fact('Estimated time', DATA.estimatedMinutes + ' min');
  h += fact('Timer budget', DATA.timerMinutes + ' min countdown');
  h += fact('Pass mark', DATA.passMark + '%');
  h += '</div></div>';
  h += '<div class="card learn"><h2 class="sec-title">' + DATA.learnTitle + '</h2>' + DATA.learnHTML + '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.kwTitle + '</h2>';
  DATA.keywords.forEach(function(kw){
    h += '<div class="kw-theme"><div class="kw-name">' + esc(kw.theme) + '</div><ul>';
    kw.items.forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2 class="sec-title">' + DATA.howTitle + '</h2>' + DATA.howHTML + DATA.howExtra;
  h += '<ul class="rules">';
  h += '<li><b>Pass mark:</b> you need at least <b>70%</b> to pass. A PASS means you showed a working understanding of ' + esc(DATA.mitreId) + ' at this difficulty. A FAIL means you should read the feedback again and retake.</li>';
  h += '<li><b>Exercise types in this file:</b> ' + DATA.typesUsed.join(', ') + '.</li>';
  h += '<li><b>Timer:</b> a ' + DATA.timerMinutes + '-minute countdown runs for the whole file. The <b>⏸ Pause</b> button stops the timer and hides the exercise for a real break. When you press <b>Check</b>, the timer stops automatically so you can read the feedback for as long as you want; it starts again only when you press <b>Next</b>.</li>';
  h += '<li><b>Partial credit:</b> exercises with several correct items give partial credit. Each correct item adds credit, each wrong item removes credit: credit = (correct − wrong) ÷ items, never below 0.</li>';
  h += '<li><b>Hint:</b> one hint per exercise. A hint costs 10% of that exercise&#39;s credit.</li>';
  h += '<li><b>Skipped exercises:</b> you can skip any exercise. Before the exam can finish, you get a review screen where you can go back to skipped exercises and answer them while the timer is not ended. Skipped exercises you never answer are simply excluded from your score.</li>';
  h += '</ul>';
  h += '<div class="startrow"><button class="primary" id="start-btn">▶ Start the exam</button></div></div>';
