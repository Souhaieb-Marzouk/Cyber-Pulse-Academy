function fact(k, v){ return '<div class="fact"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

/* ============================ EXAM FLOW ============================ */
function startExam(){
  S = newSession();
  attemptReported = false;
  tset('RUNNING'); /* from IDLE */
  S.timer.state = 'RUNNING';
  startClock();
  renderTopbar();
  showView('exam');
  renderCurrent();
}
function curEx(){
  if (!S || S.idx >= S.order.length) return null;
  return DATA.exercises[S.order[S.idx]];
}
function renderTopbar(){
  var ex = curEx();
  $('hdr-topic').textContent = DATA.mitreId + ' · ' + DATA.shortName;
  var sev = $('hdr-sev');
  sev.textContent = DATA.sevIcon + ' ' + DATA.severityWord;
  sev.style.color = SEV_COLOR[DATA.severityWord];
  sev.style.borderColor = SEV_COLOR[DATA.severityWord];
  $('hdr-count').textContent = ex ? ('Exercise ' + (S.idx + 1) + ' of ' + S.order.length) : '';
  document.documentElement.style.setProperty('--sev-current', SEV_COLOR[DATA.severityWord]);
  renderTimer(); renderScore();
  var prog = (S.idx / S.order.length) * 100;
  $('prog-fill').style.width = prog + '%';
}
function renderCurrent(){
  var ex = curEx();
  if (!ex) { openReview(); return; }
  renderTopbar();
  renderExercise(ex);
}
function markChecked(exIdx, credit){
  S.checked[exIdx] = true;
  S.credits[exIdx] = credit;
  /* remove from skipped pool if it was there (review-skipped answered) */
  var p = S.skippedPool.indexOf(exIdx);
  if (p >= 0) S.skippedPool.splice(p, 1);
  renderScore();
}

/* --- Check: grade, apply hint penalty, auto-pause, render feedback --- */
function onCheck(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  var w = ex._widget;
  if (!w) return;
  var res = w.grade();
  if (res === null) { /* nothing answered */
    var nb = $('check-nudge');
    if (nb) { nb.style.display = 'block'; }
    return;
  }
  var credit = scoreExercise(res.H, res.W, res.N);
  if (S.hinted[ex.idx]) credit = Math.max(0, credit - 0.10);
  /* Auto-pause FIRST (timer stops before feedback renders) */
  tset('PAUSED_AUTO_CHECK');
  markChecked(ex.idx, credit);
  w.showFeedback(credit, res);
  var chk = $('check-btn'), nxt = $('next-btn');
  chk.disabled = true;
  if (S.idx === S.order.length - 1) { nxt.textContent = 'Final Submit'; }
  nxt.disabled = false;
  nxt.focus();
}
/* --- Skip: no auto-pause, timer keeps running --- */
function onSkip(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx]) return;
  /* A returned skipped exercise goes back to the review screen on Skip,
     never forward into the already-walked main flow. */
  if (S.reviewReturn) { S.reviewReturn = false; openReview(); return; }
  if (S.skippedPool.indexOf(ex.idx) < 0) S.skippedPool.push(ex.idx);
  if (S.idx === S.order.length - 1) { openReview(); return; }
  S.idx += 1;
  renderCurrent();
}
/* --- Next / Final Submit: resumes the timer from the auto-pause --- */
function onNext(){
  S.reviewReturn = false; /* leaving the returned exercise in every path below */
  var back = $('next-btn').getAttribute('data-back') === '1';
  if (S.timer.state === 'PAUSED_AUTO_CHECK') {
    if (back) { tset('RUNNING'); openReview(); return; }
    if (S.idx === S.order.length - 1) { tset('RUNNING'); openReview(); return; }
    tset('RUNNING');
    S.idx += 1;
    renderCurrent();
  } else if (S.timer.state === 'RUNNING') {
    if (back) { openReview(); return; }
    /* learner pressed Next without Check (should not happen: Next hidden pre-check) */
    if (S.idx === S.order.length - 1) { openReview(); return; }
    S.idx += 1;
    renderCurrent();
  }
}
/* --- Manual pause: hides the exercise --- */
function onPause(){
  if (!S) return;
  var st = S.timer.state;
  if (st !== 'RUNNING' && st !== 'PAUSED_AUTO_CHECK') return;
  tset('PAUSED_MANUAL');
  $('pause-veil').classList.add('active');
}
function onResume(){
  var back = (S.timer.prevState === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : 'RUNNING';
  tset(back);
  $('pause-veil').classList.remove('active');
}

/* ============================ HINT ============================ */
function onHint(){
  var ex = curEx();
  if (!ex || S.checked[ex.idx] || S.hinted[ex.idx]) return;
  S.hinted[ex.idx] = true;
  var hp = $('hint-panel');
  hp.style.display = 'block';
  hp.innerHTML = '<div class="hint-head">💡 Hint — costs 10% of this exercise&#39;s credit</div><div>' + esc(ex.hint) + '</div>';
  $('hint-btn').disabled = true;
}

/* ============================ REVIEW SKIPPED ============================ */
function openReview(){
  var box = $('review-body');
  var h = '';
  if (S.skippedPool.length === 0) {
    h += '<p>No skipped exercises are waiting. You can submit now.</p>';
  } else {
    h += '<p>These exercises are skipped. You can return to any of them and answer it, as many times as you need, while the timer has not ended. If you submit while they are still unanswered, they are excluded from your score.</p><div class="revlist">';
    S.skippedPool.forEach(function(ix, n){
      var ex = DATA.exercises[ix];
      h += '<div class="revitem"><span class="rev-ic">⚠ Skipped</span><span>' + (n + 1) + '. ' + esc(ex.summary) + '</span>' +
           '<button data-ix="' + ix + '">Return to it</button></div>';
    });
    h += '</div>';
  }
  var ls = liveScore();
  h += '<div class="card" style="margin-top:14px"><b>Answered so far:</b> ' + ls.count + ' of ' + S.order.length +
       ' · current credit <b>' + ls.sum.toFixed(1) + '</b> · time left <b class="mono">' + fmtTime(S.timer.remain) + '</b></div>';
  h += '<div class="navrow"><span class="spacer"></span><button class="primary" id="final-submit-btn">Final Submit — see results</button></div>';
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('button[data-ix]'), function(b){
    b.addEventListener('click', function(){
      var ix = parseInt(b.getAttribute('data-ix'), 10);
      /* resume timer while working on the skipped exercise (blocked only on true timeout) */
      if (S.timer.remain <= 0) return;
      if (S.checked[ix]) return; /* already answered — never re-enter an answered exercise */
      if (S.timer.state !== 'RUNNING') tset('RUNNING');
      var pos = S.order.indexOf(ix);
      if (pos >= 0) S.idx = pos;
      showView('exam');
      renderCurrent();
      /* Next from a returned skipped exercise goes back to the review screen */
      var nxt = $('next-btn');
      nxt.setAttribute('data-back', '1');
      S.reviewReturn = true;
    });
  });
  $('final-submit-btn').addEventListener('click', function(){
    if (S.timer.remain > 0) tset('ENDED');
    showResults();
  });
  showView('review');
}

/* ============================ RESULTS ============================ */
function showResults(){
  var answeredIdx = Object.keys(S.checked).filter(function(k){ return S.checked[k]; });
  var sum = 0;
  answeredIdx.forEach(function(k){ sum += S.credits[k]; });
  var answered = answeredIdx.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= DATA.passMark;
  var fully = 0, partly = 0, partlySum = 0, zero = 0;
  answeredIdx.forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.9999) fully += 1;
    else if (c > 0) { partly += 1; partlySum += c; }
    else zero += 1;
  });
  var skippedNever = S.order.length - answered;
  var h = '';
  h += '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">';
  h += '<div class="v-big">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>';
  h += '<div class="muted">' + esc(DATA.introTitle) + '</div>';
  h += '<div style="font-size:20px;margin-top:8px">Final score: <b>' + sum.toFixed(1) + ' / ' + answered + '</b> — <b>' + percent + '%</b> <span class="muted">(pass mark ' + DATA.passMark + '%)</span></div>';
  h += '</div>';
  h += '<div class="res-grid">';
  h += resCell('ok', '✓ Fully correct', String(fully), 'state-correct');
  h += resCell('part', '✓ Partially correct', String(partly) + (partly > 0 ? ' <span class="small muted">(avg ' + (partlySum / partly).toFixed(2) + ')</span>' : ''), 'state-partial');
  h += resCell('bad', '✗ Fully incorrect', String(zero), 'state-incorrect');
  h += resCell('skip', '⚠ Skipped — excluded', String(skippedNever), 'state-skipped');
  h += '</div>';
  h += '<div class="card"><h3 class="sec-title">Time report</h3>';
  h += '<p>Time paused manually (breaks): <b>' + fmtTime(Math.round(S.pause.manualSec)) + '</b></p>';
  h += '<p>Time spent reviewing feedback (auto-pause): <b>' + fmtTime(Math.round(S.pause.feedbackSec)) + '</b></p>';
  h += '<p>Timer left when the exam ended: <b class="mono">' + fmtTime(S.timer.remain) + '</b></p></div>';
  h += '<div class="startrow"><button class="amberbtn" id="retake-btn">↻ Retake Exam</button></div>';
  $('results-body').innerHTML = h;
  $('retake-btn').addEventListener('click', function(){
    renderIntro();
    showView('intro');
  });
  showView('results');
  reportScore(sum, answered, percent, passed);
}
function resCell(cls, label, num, colvar){
  return '<div class="res-cell ' + cls + '"><div class="num" style="color:var(--' + colvar + ')">' + num + '</div>' +
         '<div class="muted">' + label + '</div></div>';
}

/* ============================ SITE REPORT (STEP 6.2) ============================ */
function reportScore(creditSum, answeredCount, percent, passed){
  if (attemptReported) return;
  attemptReported = true;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: DATA.topicId,
      batch: DATA.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* ============================ HANDSHAKE (STEP 6.3) ============================ */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username / country / theme('dark') / locale / topicId / batch — consumed; dark-only by contract. */
  var who = event.data.username ? String(event.data.username) : '';
  if (who) {
    var el = $('hdr-user');
    if (el) { el.textContent = '👤 ' + who; el.removeAttribute('aria-hidden'); el.style.display = ''; }
  }
});

/* ============================ END EXAM ON TIMEOUT ============================ */
function endExam(timeout){
  if (S.timer.state === 'ENDED') return;
  S.timer.state = 'ENDED';
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  renderTimer();
  showResults();
}

/* ============================ BOOT ============================ */
document.addEventListener('DOMContentLoaded', function(){
  var hu = $('hdr-user');
  hu.textContent = '';
  hu.style.display = 'none'; /* empty badge stays invisible until the handshake fills it */
  renderIntro();
  showView('intro');
  renderTimer();
  $('pause-btn').addEventListener('click', onPause);
  $('resume-btn').addEventListener('click', onResume);
  $('hint-btn').addEventListener('click', onHint);
  $('skip-btn').addEventListener('click', onSkip);
  $('check-btn').addEventListener('click', onCheck);
  $('next-btn').addEventListener('click', onNext);
});


'use strict';
var LETTERS = 'ABCDEFGHIJ';

/* ---------- keyboard operability (WCAG: every control operable by keyboard) ---------- */
function keyActivate(el){
  el.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); el.click(); }
  });
}

/* ---------- shared feedback helpers ---------- */
function fbHead(credit, res){
  var head = $('fb-head'), pill = '';
  var label, cls;
  if (credit >= 0.9999) { label = '✓ CORRECT'; cls = 'fb-correct'; }
  else if (credit > 0) { label = '✓ PARTIALLY CORRECT'; cls = 'fb-partial'; }
  else { label = '✗ INCORRECT'; cls = 'fb-incorrect'; }
  var ls = liveScore();
  pill = '<span class="credit-pill">credit ' + credit.toFixed(2) +
         (res && res.N > 1 ? ' · ' + res.H + '/' + res.N + ' items' : '') + '</span>' +
         '<span class="credit-pill">score ' + ls.sum.toFixed(1) + ' / ' + ls.count + '</span>';
  head.className = 'fb-head ' + cls;
  head.innerHTML = label + pill;
  $('feedback-block').style.display = 'block';
}
function itemRow(state, txt){
  var cls = state === 'ok' ? 'ir-ok' : (state === 'wrong' ? 'ir-wrong' : 'ir-missed');
  var ic = state === 'ok' ? '✓ Correct' : (state === 'wrong' ? '✗ Wrong' : '○ Missed');
  return '<div class="itemrow ' + cls + '"><span class="ic">' + ic + '</span><span>' + txt + '</span></div>';
}
function showFb(credit, res, rowsHTML, explanationHTML){
  fbHead(credit, res);
  var b = '<div class="itemrows">' + (rowsHTML || '') + '</div>';
  if (res && res.N > 1) {
    b += '<p class="small muted">Partial credit: (correct ' + res.H + ' − wrong ' + res.W + ') ÷ items ' + res.N + ' = credit ' + credit.toFixed(2) + '.</p>';
  }
  b += '<div class="fb-explain">' + explanationHTML + '</div>';
  $('fb-body').innerHTML = b;
}
function lockAnswer(){
  var a = $('answer-area');
  if (a) a.style.pointerEvents = 'none';
}
function optRow(i, text, kind){
  var d = document.createElement('div');
  d.className = 'opt';
  d.setAttribute('role', kind === 'multi' ? 'checkbox' : 'radio');
  d.setAttribute('tabindex', '0');
  d.innerHTML = '<span class="opt-label">' + LETTERS[i] + '.</span><span class="opt-text">' + text + '</span><span class="selmark"></span>';
  keyActivate(d);
  return d;
}
function markOpt(el, mark, cls){
  el.querySelector('.selmark').textContent = mark;
  if (cls) el.classList.add(cls);
}

/* ============================ QCM (single answer) ============================ */
function renderQCM(ex, box){
  var order = shuffle(ex.options.map(function(o,i){ return i; }));
  var sel = -1, w = { };
  var grid = document.createElement('div');
  grid.className = 'opts';
  order.forEach(function(oi, pos){
    var el = optRow(pos, ex.options[oi]);
    el.addEventListener('click', function(){
      if (S.checked[ex.idx]) return;
      sel = oi;
      Array.prototype.forEach.call(grid.children, function(c){ c.classList.remove('selected'); c.querySelector('.selmark').textContent=''; });
      el.classList.add('selected');
      markOpt(el, '● selected');
    });
    grid.appendChild(el);
  });
  box.appendChild(grid);
  w.grade = function(){
    if (sel < 0) return null;
    var ok = (sel === ex.answer);
    return { H: ok ? 1 : 0, W: ok ? 0 : 1, N: 1, sel: sel };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    Array.prototype.forEach.call(grid.children, function(c, pos){
      var oi = order[pos];
      if (oi === sel && oi !== ex.answer) markOpt(c, '✗ Incorrect', 'sel-incorrect');
      if (oi === ex.answer) markOpt(c, '✓ Correct', 'opt-correct-reveal');
    });
    var why = res.sel === ex.answer ? ex.why[ex.answer] : (ex.why[res.sel] + ' ' + ex.why[ex.answer]);
    showFb(credit, res, rows, '<p>' + why + '</p>' + ex.explanation);
  };
  ex._widget = w;
}

/* ============================ MULTI-SELECT (partial credit) ============================ */
function renderMulti(ex, box){
  var order = shuffle(ex.options.map(function(o,i){ return i; }));
  var sel = {};
  var grid = document.createElement('div');
  grid.className = 'opts';
  grid.setAttribute('role', 'group');
  order.forEach(function(oi, pos){
    var el = optRow(pos, ex.options[oi], 'multi');
    el.addEventListener('click', function(){
      if (S.checked[ex.idx]) return;
      sel[oi] = !sel[oi];
      el.classList.toggle('selected', !!sel[oi]);
      markOpt(el, sel[oi] ? '✓ selected' : '', 'sel-correct');
      if (!sel[oi]) el.querySelector('.selmark').textContent = '';
    });
    grid.appendChild(el);
  });
  box.appendChild(grid);
  var w = {};
  w.grade = function(){
    var any = false;
    Object.keys(sel).forEach(function(k){ if (sel[k]) any = true; });
    if (!any) return null;
    var H = 0, W = 0;
    ex.answers.forEach(function(a){ if (sel[a]) H += 1; });
    Object.keys(sel).forEach(function(k){ if (sel[k] && ex.answers.indexOf(parseInt(k,10)) < 0) W += 1; });
    return { H: H, W: W, N: ex.answers.length, sel: sel };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    Array.prototype.forEach.call(grid.children, function(c, pos){
      var oi = order[pos];
      var isAns = ex.answers.indexOf(oi) >= 0;
      if (isAns) markOpt(c, res.sel[oi] ? '✓ Correct' : '○ Missed', 'opt-correct-reveal');
      else if (res.sel[oi]) markOpt(c, '✗ Wrong', 'sel-incorrect');
    });
    ex.answers.forEach(function(a){
      var st = res.sel[a] ? 'ok' : 'missed';
      rows += itemRow(st, '<b>' + esc(ex.options[a]) + '</b> — ' + ex.why[a]);
    });
    Object.keys(res.sel).forEach(function(k){
      k = parseInt(k, 10);
      if (res.sel[k] && ex.answers.indexOf(k) < 0) rows += itemRow('wrong', '<b>' + esc(ex.options[k]) + '</b> — ' + ex.why[k]);
    });
    showFb(credit, res, rows, ex.explanation);
  };
  ex._widget = w;
}

/* ============================ MATCHING (dropdowns, partial credit) ============================ */
function renderMatch(ex, box){
  var rights = shuffle(ex.pairs.map(function(p,i){ return i; }));
  var chosen = {};
  var wrap = document.createElement('div');
  ex.pairs.forEach(function(p, li){
    var row = document.createElement('div');
    row.className = 'matchrow';
    var sel = '<select data-li="' + li + '"><option value="">— choose —</option>';
    rights.forEach(function(ri, pos){
      sel += '<option value="' + ri + '">' + esc(ex.pairs[ri].right) + '</option>';
    });
    sel += '</select>';
    row.innerHTML = '<div class="mleft">' + p.left + '</div>' + sel;
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  var w = {};
  wrap.addEventListener('change', function(ev){
    chosen[ev.target.getAttribute('data-li')] = ev.target.value === '' ? null : parseInt(ev.target.value, 10);
  });
  w.grade = function(){
    for (var i = 0; i < ex.pairs.length; i++) { if (chosen[i] === undefined || chosen[i] === null) return null; }
    var H = 0, W = 0;
    ex.pairs.forEach(function(p, i){ if (chosen[i] === i) H += 1; else W += 1; });
    return { H: H, W: W, N: ex.pairs.length, chosen: chosen };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.pairs.forEach(function(p, i){
      var ok = res.chosen[i] === i;
      rows += itemRow(ok ? 'ok' : 'wrong', '<b>' + p.left + '</b> → ' + (ok ? '<b>' + esc(p.right) + '</b>' : 'you chose “' + esc(ex.pairs[res.chosen[i]].right) + '”. Correct: “' + esc(p.right) + '”.') + ' ' + p.why);
    });
    showFb(credit, res, rows, ex.explanation);
  };
  ex._widget = w;
}

/* ============================ DRAG & DROP (partial credit) ============================ */
function renderDnD(ex, box){
  var placed = {};  /* itemIndex -> zoneId or null */
  var armed = null;
  var w = {};
  var layout = document.createElement('div');
  layout.className = 'dnd-grid';
  var bank = document.createElement('div');
  bank.className = 'bank';
  bank.innerHTML = '<div class="small muted" style="width:100%">Drag each item into a zone — or tap the item, then tap the zone. Tap a placed item to take it back.</div>';
  var chipEls = {};
  var order = shuffle(ex.items.map(function(it,i){ return i; }));
  order.forEach(function(ii){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = ex.items[ii].label;
    chip.draggable = true;
    chip.setAttribute('tabindex','0');
    chip.setAttribute('data-ii', ii);
    chip.addEventListener('click', function(){
      if (S.checked[ex.idx]) return;
      if (placed[ii] !== undefined && placed[ii] !== null) { /* take back */
        placed[ii] = null;
        bank.appendChild(chip);
        return;
      }
      if (armed === ii) { armed = null; chip.classList.remove('armed'); return; }
      armed = ii;
      Object.keys(chipEls).forEach(function(k){ chipEls[k].classList.remove('armed'); });
      chip.classList.add('armed');
    });
    keyActivate(chip);
    chip.addEventListener('dragstart', function(ev){
      armed = ii;
      try { ev.dataTransfer.setData('text/plain', String(ii)); } catch(e){}
    });
    chipEls[ii] = chip;
    bank.appendChild(chip);
  });
  var zwrap = document.createElement('div');
  zwrap.className = 'zones cols' + Math.min(3, ex.zones.length);
  var zoneEls = {};
  ex.zones.forEach(function(z){
    var zd = document.createElement('div');
    zd.className = 'zone';
    zd.setAttribute('data-z', z.id);
    zd.innerHTML = '<h4>' + esc(z.label) + '</h4><div class="zdrop"></div>';
    zd.setAttribute('tabindex', '0');
    keyActivate(zd);
    zd.addEventListener('click', function(){ place(zd, z.id); });
    zd.addEventListener('dragover', function(ev){ ev.preventDefault(); zd.classList.add('dragover'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('dragover'); });
    zd.addEventListener('drop', function(ev){
      ev.preventDefault(); zd.classList.remove('dragover');
      place(zd, z.id);
    });
    zoneEls[z.id] = zd;
    zwrap.appendChild(zd);
  });
  function place(zd, zid){
    if (armed === null || S.checked[ex.idx]) return;
    placed[armed] = zid;
    var chip = chipEls[armed];
    chip.classList.remove('armed');
    zd.querySelector('.zdrop').appendChild(chip);
    armed = null;
  }
  layout.appendChild(bank);
  layout.appendChild(zwrap);
  box.appendChild(layout);
  w.grade = function(){
    for (var i = 0; i < ex.items.length; i++) { if (placed[i] === undefined || placed[i] === null) return null; }
    var H = 0, W = 0;
    ex.items.forEach(function(it, i){ if (placed[i] === it.zone) H += 1; else W += 1; });
    return { H: H, W: W, N: ex.items.length, placed: placed };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    var zl = {};
    ex.zones.forEach(function(z){ zl[z.id] = z.label; });
    ex.items.forEach(function(it, i){
      var ok = res.placed[i] === it.zone;
      rows += itemRow(ok ? 'ok' : 'wrong', '<b>' + esc(it.label) + '</b> belongs in “' + esc(zl[it.zone]) + '”' + (ok ? '' : ' — you placed it in “' + esc(zl[res.placed[i]]) + '”') + '. ' + it.why);
    });
    showFb(credit, res, rows, ex.explanation);
  };
  ex._widget = w;
}

/* ============================ ORDERING / TIMELINE (partial credit) ============================ */
function renderOrder(ex, box){
  var cur = shuffle(ex.steps.map(function(s,i){ return i; }));
  var wrap = document.createElement('div');
  wrap.className = 'orderlist';
  function draw(){
    wrap.innerHTML = '';
    cur.forEach(function(si, pos){
      var el = document.createElement('div');
      el.className = 'orderitem';
      el.draggable = true;
      el.innerHTML = '<span class="pos">' + (pos + 1) + '.</span><span class="otext">' + ex.steps[si] + '</span>' +
        '<span class="updown"><button type="button" data-up="' + pos + '" aria-label="Move up">↑</button><button type="button" data-down="' + pos + '" aria-label="Move down">↓</button></span>';
      el.addEventListener('dragstart', function(ev){ wrap._drag = pos; el.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} });
      el.addEventListener('dragover', function(ev){ ev.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', function(){ el.classList.remove('dragover'); });
      el.addEventListener('drop', function(ev){
        ev.preventDefault(); el.classList.remove('dragover');
        var from = wrap._drag; if (from === undefined) return;
        var to = pos;
        var m = cur.splice(from, 1)[0];
        cur.splice(to, 0, m);
        wrap._drag = undefined;
        draw();
      });
      wrap.appendChild(el);
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('button[data-up]'), function(b){
      b.addEventListener('click', function(){
        var p = parseInt(b.getAttribute('data-up'), 10);
        if (p > 0) { var t = cur[p-1]; cur[p-1] = cur[p]; cur[p] = t; draw(); }
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('button[data-down]'), function(b){
      b.addEventListener('click', function(){
        var p = parseInt(b.getAttribute('data-down'), 10);
        if (p < cur.length - 1) { var t = cur[p+1]; cur[p+1] = cur[p]; cur[p] = t; draw(); }
      });
    });
  }
  draw();
  box.appendChild(wrap);
  var w = {};
  w.grade = function(){
    var H = 0, W = 0;
    cur.forEach(function(si, pos){ if (si === pos) H += 1; else W += 1; });
    return { H: H, W: W, N: ex.steps.length, cur: cur };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.steps.forEach(function(s, i){
      var pos = res.cur.indexOf(i);
      var ok = pos === i;
      rows += itemRow(ok ? 'ok' : 'wrong', 'You put “' + ex.steps[i] + '” in position ' + (pos + 1) + '. Correct position: ' + (i + 1) + '.');
    });
    showFb(credit, res, rows, '<p><b>Correct order:</b> ' + ex.steps.map(function(s){ return s; }).join(' → ') + '</p>' + ex.explanation);
  };
  ex._widget = w;
}

/* ============================ FILL-IN-THE-BLANK (word bank, partial credit) ============================ */
function renderFill(ex, box){
  var w = {};
  var wrap = document.createElement('div');
  var parts = ex.template.split(/\{\{(\d+)\}\}/);
  var html = '<div class="filltext">';
  parts.forEach(function(p, i){
    if (i % 2 === 1) html += '<button type="button" class="blank" data-b="' + p + '">____</button>';
    else html += p;
  });
  html += '</div>';
  wrap.innerHTML = html;
  var bankWrap = document.createElement('div');
  bankWrap.className = 'chipbank';
  var bank = document.createElement('div');
  bank.className = 'bank';
  bankWrap.appendChild(bank);
  wrap.appendChild(bankWrap);
  var filled = {};   /* blank -> word */
  var armedBlank = null;
  var chipOf = {};
  shuffle(ex.bank.map(function(b,i){ return i; })).forEach(function(bi){
    var word = ex.bank[bi];
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = word;
    chip.setAttribute('tabindex','0');
    keyActivate(chip);
    chip.addEventListener('click', function(){
      if (S.checked[ex.idx]) return;
      var target = armedBlank;
      if (target === null) {
        var bl = wrap.querySelectorAll('.blank');
        for (var i = 0; i < bl.length; i++) { if (!filled[bl[i].getAttribute('data-b')]) { target = bl[i].getAttribute('data-b'); break; } }
      }
      if (target === null || filled[target] !== undefined) return;
      filled[target] = word;
      chipOf[word + '|' + target] = chip;
      var be = wrap.querySelector('.blank[data-b="' + target + '"]');
      be.textContent = word;
      be.classList.add('filled');
      be.classList.remove('armed');
      chip.classList.add('used');
      if (armedBlank === target) armedBlank = null;
    });
    bank.appendChild(chip);
  });
  wrap.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.blank') : null;
    if (!b || S.checked[ex.idx]) return;
    var bn = b.getAttribute('data-b');
    if (filled[bn] !== undefined) {
      var word = filled[bn];
      delete filled[bn];
      b.textContent = '____';
      b.classList.remove('filled');
      var chip = chipOf[word + '|' + bn];
      if (chip) chip.classList.remove('used');
      return;
    }
    Array.prototype.forEach.call(wrap.querySelectorAll('.blank'), function(x){ x.classList.remove('armed'); });
    b.classList.add('armed');
    armedBlank = bn;
  });
  box.appendChild(wrap);
  w.grade = function(){
    var n = ex.answers.length;
    for (var i = 0; i < n; i++) { if (filled[i] === undefined) return null; }
    var H = 0, W = 0;
    ex.answers.forEach(function(a, i){ if (filled[i] === a) H += 1; else W += 1; });
    return { H: H, W: W, N: n, filled: filled };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.answers.forEach(function(a, i){
      var ok = res.filled[i] === a;
      var wy = ex.why[i] || '';
      rows += itemRow(ok ? 'ok' : 'wrong', 'Blank ' + (i + 1) + ': correct word is “<b>' + esc(a) + '</b>”' + (ok ? '' : ' — you used “' + esc(res.filled[i]) + '”') + (wy ? '. ' + wy : ''));
    });
    /* explain the bank words that were not answers (they were authored per word) */
    var extra = '';
    if (ex.why.length > ex.answers.length) {
      extra = '<div class="small muted" style="margin-top:10px">Why the other words do not fit:</div><div class="itemrows">' +
        ex.why.slice(ex.answers.length).map(function(wy){
          return '<div class="itemrow"><span class="ic" style="color:var(--text-secondary)">✗ Not it</span><span>' + wy + '</span></div>';
        }).join('') + '</div>';
    }
    showFb(credit, res, rows, ex.explanation + extra);
  };
  ex._widget = w;
}

/* ============================ SPOT THE MISTAKE (partial credit) ============================ */
function renderSpot(ex, box){
  var sel = {};
  var wrap = document.createElement('div');
  wrap.className = 'spotwrap';
  wrap.innerHTML = '<p class="small muted">Click every line you think is wrong. Click again to unselect. Then press Check.</p>';
  ex.lines.forEach(function(l, i){
    var d = document.createElement('div');
    d.className = 'spot-line';
    d.setAttribute('tabindex','0');
    d.innerHTML = '<span class="ln mono">' + (i + 1) + '</span><span class="mono">' + l.text + '</span>';
    d.addEventListener('click', function(){
      if (S.checked[ex.idx]) return;
      sel[i] = !sel[i];
      d.classList.toggle('selected', !!sel[i]);
    });
    keyActivate(d);
    wrap.appendChild(d);
  });
  box.appendChild(wrap);
  var w = {};
  w.grade = function(){
    var any = false;
    Object.keys(sel).forEach(function(k){ if (sel[k]) any = true; });
    if (!any) return null;
    var H = 0, W = 0, bad = 0;
    ex.lines.forEach(function(l, i){
      if (l.bad) { bad += 1; if (sel[i]) H += 1; }
      else if (sel[i]) W += 1;
    });
    return { H: H, W: W, N: bad, sel: sel };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.lines.forEach(function(l, i){
      if (l.bad) {
        rows += itemRow(sel[i] ? 'ok' : 'missed', '<span class="mono">' + l.text + '</span> — ' + l.why);
      } else if (res.sel[i]) {
        rows += itemRow('wrong', '<span class="mono">' + l.text + '</span> — this line is fine. ' + l.why);
      }
    });
    showFb(credit, res, rows, ex.explanation);
  };
  ex._widget = w;
}

/* ============================ LOG VIEWER (filter + embedded widget) ============================ */
function renderLog(ex, box){
  var wrap = document.createElement('div');
  var plain = ex.logLines.map(function(l){ var d = document.createElement('div'); d.innerHTML = l; return d.textContent; });
  var h = '<div class="logfilter"><input type="text" placeholder="Filter lines (text search)" aria-label="Filter log lines"></div>';
  h += '<div class="logbox">';
  ex.logLines.forEach(function(l, i){
    h += '<div class="log-line" data-i="' + i + '">' + l + '</div>';
  });
  h += '</div>';
  wrap.innerHTML = h;
  box.appendChild(wrap);
  var fin = wrap.querySelector('input');
  fin.addEventListener('input', function(){
    var q = fin.value.toLowerCase();
    Array.prototype.forEach.call(wrap.querySelectorAll('.log-line'), function(el){
      var i = parseInt(el.getAttribute('data-i'), 10);
      el.style.display = (!q || plain[i].toLowerCase().indexOf(q) >= 0) ? '' : 'none';
    });
  });
  var inner = document.createElement('div');
  inner.style.marginTop = '12px';
  box.appendChild(inner);
  /* dispatch any widget type the data authors chose */
  var wt = ex.widget.type;
  if (wt === 'multi') renderMulti(ex.widget, inner);
  else if (wt === 'qcm') renderQCM(ex.widget, inner);
  else if (wt === 'dnd') renderDnD(ex.widget, inner);
  else if (wt === 'fill') renderFill(ex.widget, inner);
  else if (wt === 'match') renderMatch(ex.widget, inner);
  else if (wt === 'spot') renderSpot(ex.widget, inner);
  else inner.innerHTML = '<p class="muted">Unsupported embedded widget.</p>';
  var w = {};
  w.grade = function(){ return ex.widget._widget.grade(); };
  w.showFeedback = function(credit, res){
    var fb = $('fb-body');
    ex.widget._widget.showFeedback(credit, res);
    /* the outer log exercise's own explanation is appended after the widget's feedback */
    if (ex.explanation) {
      var fb2 = $('fb-body');
      fb2.innerHTML = fb2.innerHTML + '<div class="fb-explain">' + ex.explanation + '</div>';
    }
  };
  ex._widget = w;
}

/* ============================ TRIAGE / BRANCHING (steps, final Check) ============================ */
function renderTriage(ex, box){
  var w = {};
  var step = 0;
  var picks = [];
  var wrap = document.createElement('div');
  box.appendChild(wrap);
  function draw(){
    if (step >= ex.steps.length) {
      wrap.innerHTML = '<p style="color:var(--state-correct);font-weight:700">✓ All ' + ex.steps.length + ' steps answered. Press Check to grade the full run.</p>' +
        '<div class="itemrows">' + picks.map(function(p, i){
          return '<div class="itemrow"><span class="ic" style="color:var(--text-secondary)">STEP ' + (i+1) + '</span><span>' + p.text + '</span></div>';
        }).join('') + '</div>';
      return;
    }
    var st = ex.steps[step];
    wrap.innerHTML = '<div class="triage-step"><span class="stepflag">Step ' + (step + 1) + ' of ' + ex.steps.length + '</span>' + st.situation + '</div>';
    var grid = document.createElement('div');
    grid.className = 'opts';
    shuffle(st.options.map(function(o,i){ return i; })).forEach(function(oi, pos){
      var el = optRow(pos, st.options[oi].text);
      el.addEventListener('click', function(){
        if (S.checked[ex.idx]) return;
        picks[step] = st.options[oi];
        step += 1;
        draw();
        window.scrollTo(0, document.body.scrollHeight);
      });
      grid.appendChild(el);
    });
    wrap.appendChild(grid);
  }
  draw();
  w.grade = function(){
    if (picks.length < ex.steps.length || picks.some(function(p){ return !p; })) return null;
    var H = 0, W = 0;
    picks.forEach(function(p){ if (p.correct) H += 1; else W += 1; });
    return { H: H, W: W, N: ex.steps.length, picks: picks };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.steps.forEach(function(st, i){
      var p = res.picks[i];
      var corr = st.options.filter(function(o){ return o.correct; })[0];
      rows += itemRow(p.correct ? 'ok' : 'wrong', '<b>Step ' + (i + 1) + '.</b> You chose: “' + p.text + '”' + (p.correct ? '' : ' — correct: “' + corr.text + '”') + ' ' + p.why);
    });
    showFb(credit, res, rows, ex.explanation);
  };
  ex._widget = w;
}

/* ============================ TERMINAL (fake shell, partial credit) ============================ */
function renderTerminal(ex, box){
  if (S.terminalClock[ex.idx] === undefined) S.terminalClock[ex.idx] = ex.timerSec || 180;
  var wrap = document.createElement('div');
  wrap.innerHTML =
    '<div class="term">' +
      '<div class="term-scroll" id="term-scroll"></div>' +
      '<div class="term-row"><span class="term-prompt">' + esc(ex.prompt) + '</span>' +
      '<input class="term-input" id="term-input" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command"></div>' +
      '<div class="extimer" id="term-clock" style="margin-top:8px">⏱ Command window: ' + fmtTime(S.terminalClock[ex.idx]) + ' remaining</div>' +
    '</div>';
  box.appendChild(wrap);
  var scroll = wrap.querySelector('#term-scroll');
  var input = wrap.querySelector('#term-input');
  scroll.innerHTML = '<div class="term-line term-out">' + esc(ex.motd) + '</div>';
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') {
      var line = document.createElement('div');
      line.className = 'term-line';
      line.innerHTML = '<span class="term-prompt">' + esc(ex.prompt) + '</span><span class="term-echo"> ' + esc(input.value) + '</span>';
      scroll.appendChild(line);
      input.value = '';
      scroll.scrollTop = scroll.scrollHeight;
    }
  });
  var w = {};
  w.grade = function(){
    var cmd = input.value.trim();
    if (!cmd) return null;
    var norm = cmd.toLowerCase().replace(/\s+/g, ' ');
    var H = 0, W = 0;
    var hitEl = [];
    ex.elements.forEach(function(el, i){
      var hit = el.accept.some(function(rx){ return new RegExp(rx).test(norm); });
      if (hit) { H += 1; hitEl.push(i); }
    });
    var hitPoison = [];
    (ex.poisons || []).forEach(function(p, i){
      if (p.accept.some(function(rx){ return new RegExp(rx).test(norm); })) { W += 1; hitPoison.push(i); }
    });
    return { H: H, W: W, N: ex.elements.length, hitEl: hitEl, hitPoison: hitPoison, norm: norm };
  };
  w.showFeedback = function(credit, res){
    var rows = '';
    ex.elements.forEach(function(el, i){
      var st = res.hitEl.indexOf(i) >= 0 ? 'ok' : 'missed';
      rows += itemRow(st, '<span class="mono">' + esc(el.label) + '</span> — ' + el.why);
    });
    (ex.poisons || []).forEach(function(p, i){
      if (res.hitPoison.indexOf(i) >= 0) rows += itemRow('wrong', esc(p.label) + ' — ' + p.why);
    });
    var out = '<div class="canon"><div class="small muted" style="margin-bottom:4px">Canonical command (click to copy):</div><code id="canon-cmd">' + esc(ex.canonical) + '</code></div>';
    out += '<div class="logbox" style="margin:10px 0"><div class="log-line term-out">' + esc(ex.output) + '</div></div>';
    if (res.hitPoison.length > 0) {
      out += '<p class="danger-note">✗ DANGEROUS — NEAR MISS: parts of your command would have made the incident worse. Read the red rows above.</p>';
    }
    showFb(credit, res, rows, out + ex.explanation);
    var cc = $('canon-cmd');
    if (cc) cc.addEventListener('click', function(){
      try { navigator.clipboard.writeText(ex.canonical); } catch (e) {}
    });
    scroll.appendChild(document.createElement('div'));
    var oline = document.createElement('div');
    oline.className = 'term-line term-out';
    oline.textContent = ex.output;
    scroll.appendChild(oline);
    scroll.scrollTop = scroll.scrollHeight;
  };
  ex._widget = w;
}

/* ============================ DISPATCH ============================ */
function renderExercise(ex){
  var body = $('exam-body');
  $('hint-panel').style.display = 'none';
  $('hint-btn').disabled = !!S.hinted[ex.idx];
  $('feedback-block').style.display = 'none';
  $('fb-head').innerHTML = ''; $('fb-body').innerHTML = '';
  $('check-nudge').style.display = 'none';
  var chk = $('check-btn'), nxt = $('next-btn');
  chk.disabled = false; chk.textContent = '✓ Check';
  nxt.disabled = true; nxt.textContent = 'Next →';
  nxt.removeAttribute('data-back');
  var h = '';
  h += '<div class="block block-scenario"><div class="block-head">🔍 SCENARIO<button class="collapse-btn" id="scen-toggle">▼ Collapse</button></div>' +
       '<div class="scen-summary" id="scen-summary"></div><div class="block-body" id="scen-body">' + ex.scenario + '</div></div>';
  h += '<div class="block block-question"><div class="block-head">❓ QUESTION</div><div class="block-body"><p class="q-text">' + ex.question + '</p></div></div>';
  h += '<div class="block block-answer"><div class="block-head">✍ YOUR ANSWER</div><div class="block-body" id="answer-area"></div></div>';
  body.innerHTML = h;
  var aa = $('answer-area');
  if (ex.type === 'qcm') renderQCM(ex, aa);
  else if (ex.type === 'multi') renderMulti(ex, aa);
  else if (ex.type === 'match') renderMatch(ex, aa);
  else if (ex.type === 'dnd') renderDnD(ex, aa);
  else if (ex.type === 'order') renderOrder(ex, aa);
  else if (ex.type === 'fill') renderFill(ex, aa);
  else if (ex.type === 'spot') renderSpot(ex, aa);
  else if (ex.type === 'log') renderLog(ex, aa);
  else if (ex.type === 'triage') renderTriage(ex, aa);
  else if (ex.type === 'terminal') renderTerminal(ex, aa);
  else aa.innerHTML = '<p class="muted">Unknown exercise type.</p>';
  var tg = $('scen-toggle'), sm = $('scen-summary');
  tg.addEventListener('click', function(){
    var collapsed = $('scen-body').style.display === 'none';
    $('scen-body').style.display = collapsed ? '' : 'none';
    sm.style.display = collapsed ? 'none' : 'block';
    tg.textContent = collapsed ? '▼ Collapse' : '▸ Expand';
    if (!collapsed) sm.textContent = '📁 ' + ex.summary + ' — collapsed';
  });
  renderTimer();
  window.scrollTo(0, 0);
}
