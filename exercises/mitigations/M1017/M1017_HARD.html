  w.innerHTML='\u26A0 '+esc(msg);
  var b=$('#ansbox');
  if(b)b.insertBefore(w,b.firstChild);
}
function scrollToAns(){var a=$('#ansbox');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest'});}


/* ================= exam state ================= */
var S={
  order:[], idx:0,
  credit:{},          /* id -> credit (0..1) */
  graded:{},          /* id -> true once Check pressed */
  skipped:[],         /* ids in skipped pool (unanswered) */
  hintUsed:{},
  sum:0, answeredCount:0,
  screen:'INTRO',     /* INTRO | EXAM | REVIEW | RESULTS */
  tstate:'RUNNING',   /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  prevTstate:'RUNNING',
  secsLeft:0, tick:null,
  pausedMan:0, pausedAuto:0,
  reported:false,
  cur:null, reviewMode:false,
  user:''
};
var CAP=null; /* current exercise collector */

function scoreExercise(H,W,N){
  if(!N)return 0;
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine ================= */
function tLabel(){
  switch(S.tstate){
    case 'RUNNING':return '\u25B6 Running';
    case 'PAUSED_MANUAL':return '\u23F8 Paused \u2014 manual (press Resume)';
    case 'PAUSED_AUTO_CHECK':return '\u23F8 Paused \u2014 reviewing feedback (resumes on Next)';
    case 'ENDED':return '\u23F9 Ended';
  }
  return '';
}
function tCls(){
  return {RUNNING:'tstate-run',PAUSED_MANUAL:'tstate-pm',PAUSED_AUTO_CHECK:'tstate-pa',ENDED:'tstate-end'}[S.tstate]||'';
}
function startTimer(){
  S.secsLeft=EXAM.minutes*60;
  if(S.tick)clearInterval(S.tick);
  S.tick=setInterval(function(){
    if(S.tstate==='PAUSED_MANUAL'){S.pausedMan++;updateHdr();return;}
    if(S.tstate==='PAUSED_AUTO_CHECK'){S.pausedAuto++;updateHdr();return;}
    if(S.tstate!=='RUNNING')return;
    if(S.screen==='INTRO'||S.screen==='RESULTS')return;
    S.secsLeft--;
    if(S.secsLeft<=0){S.secsLeft=0;S.tstate='ENDED';updateHdr();finishExam(true);}
    updateHdr();
  },1000);
}
/* ================= header ================= */
function updateHdr(){
  var c=$('#hcount');if(c)c.textContent=(S.screen==='EXAM'&&S.cur)?('Exercise '+(S.idx+1)+' of '+S.order.length):(S.screen==='REVIEW'?'Reviewing skipped exercises':'Exercise');
  var b=$('#hbadge');if(b)b.textContent=EXAM.severityLabel;
  var t=$('#htime');
  if(t){t.textContent=fmtT(S.secsLeft)+' \u00B7 '+tLabel();t.className='hstat '+tCls();}
  var sc=$('#hscore');
  if(sc){
    if(S.answeredCount>0){
      var pct=Math.round((S.sum/S.answeredCount)*100);
      sc.innerHTML='Score: <b>'+S.sum.toFixed(1)+' / '+S.answeredCount+'</b> ('+pct+'%)';
    }else{sc.textContent='Score: 0.0 / 0';}
  }
  var p=$('#hprog');if(p)p.style.width=(100*(gradedCount()/S.order.length))+'%';
}
function gradedCount(){var n=0;for(var k in S.graded)if(S.graded[k])n++;return n;}

/* ================= screens ================= */
function show(name){
  S.screen=name;
  updateHdr();
}

/* ---- intro ---- */
function renderIntro(){
  var kw=EXAM.keywords.map(function(k){
    return '<div class="kwgroup"><h3>'+esc(k.name)+'</h3><div class="kwline">'+k.items.map(esc).join(' &middot; ')+'</div></div>';
  }).join('');
  var app=$('#app');
  app.innerHTML=
    '<div id="scr-intro" class="wrap">'+
      '<div class="panel">'+
        '<h1>'+esc(EXAM.title)+'</h1>'+
        '<p><span class="badge '+EXAM.severity+'">'+esc(EXAM.severityLabel)+'</span> &nbsp;'+
        '<span class="tag">MITRE ATT&amp;CK Mitigation M1017</span> <span class="tag">User Training</span> <span class="tag">'+EXAM.exCount+' exercises</span> <span class="tag">'+EXAM.minutes+' min</span> <span class="tag">Pass: '+EXAM.passMark+'%</span></p>'+
        '<h2>What you will learn here</h2>'+EXAM.intro.entity+
        '<h2>Keywords covered in this exam</h2>'+kw+
        '<h2>How this exam works</h2>'+EXAM.intro.rules+
      '</div>'+
      '<div style="text-align:center;margin:18px 0">'+
        '<button class="btn primary" id="btn-start" style="font-size:1.1rem;padding:12px 34px">Start the exam</button>'+
      '</div>'+
      '<p class="footer-note">M1017 User Training &mdash; '+EXAM.severityLabel+' tier. All indicators are shown in a safe, defanged form (for example 203[.]0[.]113[.]10).</p>'+
    '</div>';
  $('#btn-start').addEventListener('click',startExam);
}

/* ---- exam screen ---- */
function startExam(){
  buildOrder();
  S.idx=0;S.reviewMode=false;
  show('EXAM');
  renderExercise();
  startTimer();
  updateHdr();
}
function buildOrder(){
  S.order=shuffle(EXAM.exercises.map(function(e){return e.id;}));
  S.credit={};S.graded={};S.skipped=[];S.hintUsed={};S.result={};
  S.sum=0;S.answeredCount=0;S.reported=false;
}
function exById(id){for(var i=0;i<EXAM.exercises.length;i++)if(EXAM.exercises[i].id===id)return EXAM.exercises[i];return null;}
function curEx(){return exById(S.order[S.idx]);}

function renderExercise(){
  var ex=curEx();S.cur=ex;
  var app=$('#app');
  var scn=ex.scenario.map(function(a){
    var body=(a.kind==='log')?'<pre class="log">'+hlLog(a.text)+'</pre>':'<p style="white-space:pre-wrap">'+esc(a.text)+'</p>';
    return '<div class="art"><div class="art-h">'+esc(a.label)+'</div><div class="art-b">'+body+'</div></div>';
  }).join('');
  var scnLen=ex.scenario.reduce(function(a,s){return a+(s.text||'').length;},0);
  var collapsible=(ex.collapsible===true)||scnLen>700||ex.scenario.length>=3;
  var sumLine=ex.summary||(ex.scenario[0]?ex.scenario[0].label:'');
  var scnInner=collapsible
    ? '<details class="scn" open><summary><span class="chev">&#9654;</span> Artefacts ('+ex.scenario.length+') &mdash; click to collapse after reading</summary><div class="blk-b">'+scn+'</div></details><div class="scn-sum">Summary: '+esc(sumLine)+'</div>'
    : '<div class="blk-b">'+scn+'</div>';
  app.innerHTML=
    '<div id="scr-exam" class="wrap">'+
      '<div class="blk scenario"><div class="blk-h">&#128209; SCENARIO</div>'+scnInner+'</div>'+
      '<div class="blk question"><div class="blk-h">&#10067; QUESTION</div><div class="blk-b">'+esc(ex.question)+'</div></div>'+
      '<div class="blk answer"><div class="blk-h">&#9997; YOUR ANSWER</div><div class="blk-b" id="ansbox"></div></div>'+
      '<div id="fbzone"></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0" id="navrow"></div>'+
    '</div>';
  var ansbox=$('#ansbox');
  CAP=renderWidget(ex,ansbox);
  if(ex.type==='branching'&&CAP.setFinal){CAP.setFinal(function(){doCheck();});}
  if(S.graded[ex.id]&&S.result[ex.id]){
    /* revisiting an already-answered exercise: show locked answer + stored feedback, never re-grade */
    lockAnswer();
    var ab=$('#ansbox');
    if(ab){
      /* inert blocks every interaction (drag, click, keys) with the re-rendered widget; fallback for old browsers */
      try{ab.inert=true;}catch(e){ab.style.pointerEvents='none';}
    }
    renderFeedback(ex,S.result[ex.id].res,S.result[ex.id].credit);
  }else{
    renderNav();
  }
  updateHdr();
}

/* ---- grading ---- */
function doCheck(){
  if(!S.cur||S.graded[S.cur.id])return;
  /* FIRST ACTION per contract: stop the timer into auto-check pause */
  if(S.tstate==='RUNNING')S.tstate='PAUSED_AUTO_CHECK';
  var ex=S.cur;
  var res=CAP.collect();
  var credit=scoreExercise(res.H,res.W,res.N);
  if(S.hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  credit=Math.round(credit*100)/100;
  S.credit[ex.id]=credit;S.graded[ex.id]=true;
  S.result[ex.id]={res:res,credit:credit};
  S.sum+=credit;S.answeredCount++;
  /* remove from skipped pool if it was reviewed */
  var si=S.skipped.indexOf(ex.id);if(si>=0)S.skipped.splice(si,1);
  renderFeedback(ex,res,credit);
  lockAnswer();
  updateHdr();
}
function lockAnswer(){
  $all('#ansbox button,#ansbox input,#ansbox .sent,#ansbox .dd-item,#ansbox .word,#ansbox .blank,#ansbox .ord-item').forEach(function(n){
    n.disabled=true;n.classList.add('locked-out');n.style.pointerEvents='none';
  });
}
function renderFeedback(ex,res,credit){
  var z=$('#fbzone');z.innerHTML='';
  var full=credit>=0.999, zero=credit<=0.001;
  var cls=full?'ok':(zero?'bad':'part');
  var lab=full?'\u2713 CORRECT':(zero?'\u2717 INCORRECT':'\u25D0 PARTIALLY CORRECT');
  var fb=el('div','fb '+cls);
  var creditLine='';
  if(!res.single){
    var afterHint=S.hintUsed[ex.id]?' after &minus;0.10 hint':'';
    creditLine='<div class="creditline">credit '+credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' correct items'+afterHint+'<br>'+
      '<span style="font-weight:500;font-size:.9rem">formula: (H \u2212 W) / N = ('+res.H+' \u2212 '+res.W+') / '+res.N+' = '+(res.N?((res.H-res.W)/res.N).toFixed(2):'0.00')+(S.hintUsed[ex.id]?' \u2212 0.10 hint = '+credit.toFixed(2):'')+'</span></div>';
  }
  var itemsHtml='';
  if(res.items&&res.items.length){
    itemsHtml='<ul class="items-fb">'+res.items.map(function(it){
      var st=it.st==='ok'?['i-ok','\u2713 Correct']:it.st==='bad'?['i-bad','\u2717 Wrong']:['i-miss','\u25CB Missed'];
      return '<li class="'+st[0]+'"><b>'+st[1]+'</b> &mdash; '+esc(it.label)+(it.note?'<br><span style="font-size:.92rem">'+esc(it.note)+'</span>':'')+'</li>';
    }).join('')+'</ul>';
  }
  var study=(ex.study&&credit<0.999)?'<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>':'';
  fb.innerHTML='<div class="fb-h">'+lab+'</div><div class="blk-b">'+creditLine+itemsHtml+
    '<p><b>Why:</b> '+esc(ex.explain)+'</p>'+study+'</div>';
  fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');
  z.appendChild(fb);
  /* mark options */
  if(ex.type==='qcm'||ex.type==='multi'){
    var ids=res.correctIds||[];
    $all('#ansbox .opt').forEach(function(b){
      var oid=b.getAttribute('data-oid');
      var sel=b.classList.contains('sel');
      b.classList.remove('sel');
      if(ids.indexOf(oid)>=0){b.classList.add(sel?'correct':'miss');}
      else if(sel){b.classList.add('wrong');}
    });
  }
  if(ex.type==='matrixclick'){
    $all('#ansbox .chip').forEach(function(b){
      var kid=b.getAttribute('data-kid');
      var isIn=(ex.widget.correct.indexOf(kid)>=0);
      var sel=b.classList.contains('sel');
      b.classList.remove('sel');
      if(isIn&&sel)b.classList.add('correct');
      else if(isIn&&!sel)b.classList.add('miss');
      else if(!isIn&&sel)b.classList.add('wrong');
    });
  }
  if(ex.type==='logviewer'){
    $all('#ansbox .logline').forEach(function(b){
      var lid=b.getAttribute('data-lid');
      var isIn=ex.widget.correct.indexOf(lid)>=0;
      var sel=b.classList.contains('sel');
      b.classList.remove('sel');
      if(isIn&&sel)b.classList.add('correct');
      else if(isIn&&!sel)b.classList.add('miss');
      else if(!isIn&&sel)b.classList.add('wrong');
    });
  }
  if(ex.type==='spotmistake'){
    $all('#ansbox .sent').forEach(function(b){
      var sid=b.getAttribute('data-sid');
      var isIn=ex.widget.wrong.indexOf(sid)>=0;
      var sel=b.classList.contains('sel');
      b.classList.remove('sel');
      if(isIn&&sel)b.classList.add('correct');
      else if(isIn&&!sel)b.classList.add('miss');
      else if(!isIn&&sel)b.classList.add('wrong');
    });
  }
  renderNav();
}
/* ---- navigation ---- */
function renderNav(){
  var nr=$('#navrow');nr.innerHTML='';
  var ex=S.cur;var last=(S.idx>=S.order.length-1);
  var inReview=S.reviewMode;
  if(S.graded[ex.id]){
    var nb=el('button','btn primary');
    nb.textContent=(!inReview&&last)?'Final Submit':'Next → (timer restarts)';
    nb.addEventListener('click',function(){
      if(S.tstate==='PAUSED_AUTO_CHECK')S.tstate='RUNNING';
      if(inReview){openReview();}
      else if(last){afterFlow();}
      else{S.idx++;renderExercise();}
    });
    nr.appendChild(nb);
  }else{
    var cb=el('button','btn primary');
    /* branching exercises drive their own flow: each step has Confirm, the last step has Check final decision.
       A separate Check button here would let the student submit before the tree is finished and reveal the answers early. */
    if(ex.type!=='branching'){
      cb.textContent='Check';
      cb.id='btn-check';
      cb.addEventListener('click',function(){doCheck();});
      nr.appendChild(cb);
      var note=el('span','mini-note','Hint, Pause and Skip are in the top bar. Pressing Check stops the timer and shows the feedback; the timer restarts when you press Next.');
      nr.appendChild(note);
    }else{
      var note2=el('span','mini-note','Answer each step, then confirm. The final Check reveals the feedback and stops the timer; it restarts when you press Next. Hint, Pause and Skip are in the top bar.');
      nr.appendChild(note2);
    }
  }
  var quit=el('button','btn subtle');quit.textContent='Finish now';
  quit.addEventListener('click',function(){afterFlow();});
  nr.appendChild(quit);
}
function showHint(ex){
  var z=$('#fbzone');
  var h=el('div','warnline');
  h.innerHTML='<b>\uD83D\uDCA1 Hint (\u221210% of this exercise credit):</b> '+esc(ex.hint);
  z.insertBefore(h,z.firstChild);
}
function doSkip(){
  var ex=S.cur;
  if(S.graded[ex.id])return;
  if(S.skipped.indexOf(ex.id)<0)S.skipped.push(ex.id);
  if(S.reviewMode){openReview();updateHdr();return;} /* skipping again from review: keep it in the pool */
  S.reviewMode=false;
  if(S.tstate!=='RUNNING'&&S.tstate!=='ENDED')S.tstate='RUNNING';
  if(S.idx>=S.order.length-1){afterFlow();}
  else{S.idx++;renderExercise();}
  updateHdr();
}
function afterFlow(){
  if(S.skipped.length>0&&S.tstate!=='ENDED'){openReview();}
  else{finishExam(false);}
}
/* ---- manual pause ---- */
function manualPause(){
  S.prevTstate=S.tstate;
  S.tstate='PAUSED_MANUAL';
  var v=el('div','paused-veil');v.id='veil';
  v.innerHTML='<div class="paused-box"><h2>\u23F8 Paused &mdash; manual break</h2>'+
    '<p>The timer is stopped. The exercise is hidden so you can rest.</p>'+
    '<p class="mini-note">Press Resume to come back to your exam.</p>'+
    '<button class="btn primary" id="btn-resume">Resume</button></div>';
  document.body.appendChild(v);
  $('#btn-resume').addEventListener('click',function(){
    S.tstate=S.prevTstate;v.remove();updateHdr();
  });
  updateHdr();
}
/* ---- review skipped ---- */
function openReview(){
  S.reviewMode=false;S.screen='REVIEW';
  var app=$('#app');
  var rows=S.skipped.map(function(id){
    var e=exById(id);
    return '<div class="review-item"><span class="tag">SKIPPED</span><span class="t">'+esc(e.title)+'</span>'+
      '<button class="btn" data-ans="'+id+'">Answer it</button></div>';
  }).join('');
  app.innerHTML='<div id="scr-review" class="wrap"><div class="panel">'+
    '<h1>Review skipped exercises</h1>'+
    '<p>You skipped '+S.skipped.length+' exercise(s). You can go back and answer them now, as long as the timer has not ended. Skipped exercises that you never answer are <b>excluded from your score</b> &mdash; they count as neither right nor wrong.</p>'+
    (S.skipped.length?'<div class="reviewlist">'+rows+'</div>':'<p>All exercises are answered. You can submit now.</p>')+
    '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btn-final">Final Submit</button></div>'+
    '<p class="mini-note">Timer state: '+esc(tLabel())+' &mdash; time left: '+fmtT(S.secsLeft)+'</p>'+
    '</div></div>';
  $all('[data-ans]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-ans');
      S.reviewMode=true;
      S.idx=S.order.indexOf(id);
      S.screen='EXAM';
      show('EXAM');
      renderExercise();
    });
  });
  $('#btn-final').addEventListener('click',function(){finishExam(false);});
  updateHdr();
}
/* ---- finish & results ---- */
function finishExam(timeUp){
  if(S.tick){clearInterval(S.tick);S.tick=null;}
  S.tstate='ENDED';
  var full=0,part=0,zero=0,skipped=0;var partSum=0;
  var rowsHtml='';
  S.order.forEach(function(id){
    var e=exById(id);
    if(S.graded[id]){
      var c=S.credit[id];
      if(c>=0.999){full++;rowsHtml+='<tr><td>'+esc(e.title)+'</td><td style="color:var(--ok)">\u2713 Correct</td><td>'+c.toFixed(2)+'</td></tr>';}
      else if(c<=0.001){zero++;rowsHtml+='<tr><td>'+esc(e.title)+'</td><td style="color:var(--bad)">&#10007; Incorrect</td><td>'+c.toFixed(2)+'</td></tr>';}
      else{part++;partSum+=c;rowsHtml+='<tr><td>'+esc(e.title)+'</td><td style="color:var(--part)">\u25D0 Partial</td><td>'+c.toFixed(2)+'</td></tr>';}
    }else{skipped++;rowsHtml+='<tr><td>'+esc(e.title)+'</td><td style="color:var(--muted)">\u26A0 Not answered \u2014 excluded</td><td>&mdash;</td></tr>';}
  });
  var answered=S.answeredCount;
  var creditSum=S.sum;
  var percent=answered>0?Math.round((creditSum/answered)*100):0;
  var passed=percent>=EXAM.passMark;
  var avgPart=part>0?(partSum/part):0;
  var greet=S.user?('Well done, '+esc(S.user)+'. '):'';
  var cert=passed
    ?'<div class="cert"><div class="big">\u2713 PASS</div><p>'+greet+'You reached '+percent+'%, above the '+EXAM.passMark+'% pass mark. You showed a solid grasp of M1017 User Training at '+EXAM.severityLabel+' level.</p></div>'
    :'<div class="cert fail"><div class="big">\u2717 FAIL \u2014 '+percent+'%</div><p>You needed '+EXAM.passMark+'% or more. '+greet+'Review the explanations, then retake the exam: the exercises and answer options will be shuffled into a new order.</p></div>';
  var app=$('#app');
  app.innerHTML='<div id="scr-results" class="wrap"><div class="panel">'+
    '<h1>Results &mdash; '+esc(EXAM.title)+'</h1>'+
    '<p class="pct">'+percent+'%</p>'+
    '<p>'+answered+' of '+EXAM.exCount+' exercises answered'+(timeUp?' (the timer ended)':'')+'. Score = '+creditSum.toFixed(1)+' points from '+answered+' answered exercises.</p>'+
    cert+
    '<div class="results-grid">'+
      '<div class="rcell ok"><div class="num">'+full+'</div><div class="lab">\u2713 Fully correct</div></div>'+
      '<div class="rcell part"><div class="num">'+part+'</div><div class="lab">\u25D0 Partially correct'+(part?(' \u00B7 avg '+avgPart.toFixed(2)):'')+'</div></div>'+
      '<div class="rcell bad"><div class="num">'+zero+'</div><div class="lab">\u2717 Fully incorrect</div></div>'+
      '<div class="rcell skip"><div class="num">'+skipped+'</div><div class="lab">\u26A0 Skipped, never answered (excluded)</div></div>'+
    '</div>'+
    '<h2>Your time</h2><p>Total time paused for manual breaks: <b>'+fmtT(S.pausedMan)+'</b>. Time spent studying feedback after Check (auto-pause): <b>'+fmtT(S.pausedAuto)+'</b>.</p>'+
    '<h2>Every exercise</h2><table style="width:100%;border-collapse:collapse;font-size:.92rem">'+
    rowsHtml.replace(/<tr>/g,'<tr style="border-bottom:1px solid var(--line)">').replace(/<td>/g,'<td style="padding:6px 4px">')+
    '</table>'+
    '<div style="text-align:center;margin-top:18px"><button class="btn primary" id="btn-retake" style="padding:12px 30px">Retake Exam</button></div>'+
    '</div></div>';
  $('#btn-retake').addEventListener('click',retake);
  show('RESULTS');
  reportScore(creditSum,answered,percent,passed);
}
function retake(){
  buildOrder();
  S.idx=0;S.reviewMode=false;S.tstate='RUNNING';S.pausedMan=0;S.pausedAuto=0;
  show('EXAM');
  renderExercise();
  startTimer();
  updateHdr();
}
/* ================= website integration ================= */
function reportScore(creditSum,answeredCount,percent,passed){
  if(S.reported)return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      batch:EXAM.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly, not inside the site */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user=event.data.username||'';
});
/* ================= boot ================= */
/* intro rendering happens in the BOOT block (wired together with the header) */


/* ================= header wiring ================= */
function wireHeader(){
  $('#hbtn-hint').addEventListener('click',function(){
    if(S.screen!=='EXAM'||!S.cur||S.graded[S.cur.id]||S.hintUsed[S.cur.id])return;
    S.hintUsed[S.cur.id]=true;
    showHint(S.cur);
    updateHdr();
  });
  $('#hbtn-pause').addEventListener('click',function(){
    if(S.screen==='INTRO'||S.screen==='RESULTS'||S.tstate==='ENDED')return;
    manualPause();
  });
  $('#hbtn-skip').addEventListener('click',function(){
    if(S.screen!=='EXAM'||!S.cur||S.graded[S.cur.id])return;
    doSkip();
  });
}
var _oldUpdateHdr=updateHdr;
updateHdr=function(){
  _oldUpdateHdr();
  var hh=$('#hbtn-hint'),hp=$('#hbtn-pause'),hs=$('#hbtn-skip');
  if(hh)hh.disabled=!(S.screen==='EXAM'&&S.cur&&!S.graded[S.cur.id]&&!S.hintUsed[S.cur.id]);
  if(hs)hs.disabled=!(S.screen==='EXAM'&&S.cur&&!S.graded[S.cur.id]);
  if(hp)hp.disabled=(S.screen==='INTRO'||S.screen==='RESULTS'||S.tstate==='ENDED');
};
document.addEventListener('DOMContentLoaded',function(){
  wireHeader();
  renderIntro();
});

</script>
</body>
