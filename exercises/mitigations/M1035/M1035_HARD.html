var INTRO = {"learn": "<p>This is the HARD tier for <strong>M1035 — Limit Access to Resource Over Network</strong>, the ATT&CK <strong>mitigation</strong> that restricts network access to resources — file shares, remote systems, services — to users, accounts, and systems with a legitimate business need. You already know the five measures and the main technique rows. Here the answers start looking alike, and that is the point.</p><p>The page's coverage now includes the rows professionals mix up: RDP gateways against session hijacking (T1563.002) and accessibility-features abuse (T1546.008); disabling Windows administrative shares (T1021.002); host-firewall protection for the cloud Instance Metadata API (T1552.005); IP-range restriction and just-in-time access for the Kubernetes API (T1609); TLS 2376 instead of the unauthenticated Docker API on 2375 (T1612); static ARP entries for ARP poisoning (T1557.002) with their own scale caveat; and NAC with 802.1x for unregistered devices (T1200).</p><p>The exercises mirror real work: a night-shift triage where the loud alert is benign and the quiet one is not; a coverage audit where 'pending' is not coverage; a legacy-NAS exception where the least aggressive option is the only correct one; a rule-set review where one silent line shadows all the careful ones. You will also practise saying what M1035 does <em>not</em> do — egress filtering, phishing, patching — because scope honesty is a senior skill. Two-step answers will not save you here; read every artefact before you judge.</p>", "keywords": [["Discrimination targets", ["Loud-but-benign vs quiet-but-real alert pairs", "Shadowed rules and range-wide allows in rule audits", "Flow initiation direction in segmentation designs", "T1190 — exposure reduction, not patching"]], ["Technique rows under pressure", ["T1563.002 RDP Hijacking and T1546.008 Accessibility Features — gateway answers", "T1021.002 SMB/Windows Admin Shares — disable, don't just firewall", "T1552.005 Instance Metadata API — host-based firewall such as iptables", "T1609 / T1612 — K8s API IP ranges + JIT; Docker API TLS 2376 vs 2375", "T1557.002 — static ARP entries and the large-network caveat", "T1200 — 802.1x, device certificates, DHCP registration"]], ["Control design & trade-offs", ["Least-aggressive containment that preserves evidence", "Time-boxed exceptions with owners and deny-line review", "Access drift: joiners, movers, leavers, forgotten rules", "Monitor mode as a phase, not a home"]], ["Scope honesty", ["M1035 ends where egress filtering begins", "Patching and exposure restriction are different jobs", "Detective companions: SIEM logging of allowed and denied attempts"]]], "how": "<p><strong>Passing score.</strong> You need <strong>70%</strong>. Expect near-miss answers: at least two options will look defensible, and only one survives all the artefacts. Read every artefact before answering — the loud signal is often the decoy.</p><p><strong>Exercise types in this file.</strong> A three-alert triage with paired artefacts, branching incident drills, near-miss matching, a coverage-gap board, policy completion, decision-to-technique mapping, pipeline ordering, two spot-the-flaw rule reviews, and choice questions with look-alike answers.</p><p><strong>Timer.</strong> The countdown starts at <strong>45:00</strong>. <strong>Pause</strong> hides the exercise for a real break. <strong>Check</strong> stops the timer automatically for unlimited feedback review; it resumes on <strong>Next</strong>.</p><p><strong>Partial credit.</strong> Multi-part exercises score item by item: max(0, (H − W) / N). Wrong items cancel correct ones. One hint per exercise costs 10% of that exercise's credit and only removes a wrong path — it never names the answer.</p><p><strong>Skipping.</strong> Skip is free. Return to skipped exercises from the review screen while time remains; skipped-and-never-answered exercises are excluded from the score entirely.</p>"};
var EX = [{"type": "triage", "summary": "Night shift: three server-VLAN events", "text": "<p>It is 04:00 and three events are stacked in the queue. The design says: RDP to servers only via the jump host; workstation-to-workstation SMB is not permitted; WinRM to the DC only from admin hosts.</p>", "question": "Choose the correct disposition for every alert.", "hint": "One alert has a change ticket, one violates a written policy, one was denied. Read all three artefacts before judging.", "alerts": [{"title": "Alert A — RDP session to the DC from the jump host, 03:40", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> <span class=\"c-ip\">10[.]9[.]0[.]21</span> <span class=\"c-dim\">(jump host)</span> → <span class=\"c-ip\">10[.]2[.]0[.]1</span>:<span class=\"c-num\">3389</span>  user svc-patchadm\nchange calendar: CHG-4118 \"quarterly patch window\", 03:00–05:00</pre>", "options": [{"t": "Benign — planned work on the allowed path under an open change", "correct": true}, {"t": "Attack — escalate as credential misuse"}, {"t": "Tune — block the jump host at night"}], "note": "Looks alarming (3 AM admin session) but sits inside a ticketed window on the allowed path."}, {"title": "Alert B — low-volume allowed SMB, user PC to user PC", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> <span class=\"c-ip\">10[.]1[.]8[.]52</span> → <span class=\"c-ip\">10[.]1[.]8[.]96</span>:<span class=\"c-num\">445</span>  <span class=\"c-dim\">3 sessions, 21 files read</span>\nuser VLAN policy: workstation-to-workstation SMB not permitted</pre>", "options": [{"t": "Real signal — allowed east-west SMB violates the design; treat as possible admin-share spread", "correct": true}, {"t": "Benign — two workstations always talk like this by design"}, {"t": "Blocked — the firewall stopped it"}], "note": "Looks like noise; the written policy line makes it a violation and a lateral movement path."}, {"title": "Alert C — deny burst: WinRM to the DC from one workstation", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> <span class=\"c-ip\">10[.]1[.]4[.]31</span> → <span class=\"c-ip\">10[.]2[.]0[.]1</span>:<span class=\"c-num\">5985</span>  <span class=\"c-dim\">×47 in 3 minutes</span></pre>", "options": [{"t": "Contained attempt — WinRM was denied; verify the rule held and watch the source", "correct": true}, {"t": "Successful compromise of the DC"}, {"t": "Close without review — denies are always noise"}], "note": "Blocked, but 47 tries in three minutes from one host earns a source-host check."}], "correct": "A benign by ticket; B the real signal; C blocked but worth a watch.", "explain": "Night-time admin sessions look alarming but carry a change ticket — planned work on the allowed path. The quiet allowed SMB looks harmless, but it violates the workstation policy, and allowed admin-share traffic is exactly how ransomware spreads, so it is the real signal. The WinRM deny burst was stopped by the segmentation rule, but 47 attempts in three minutes from one host deserves a source check. This inversion — loud-but-benign versus quiet-but-real — is the core skill of alert triage on a segmented network.", "study": "Triaging allowed-versus-denied traffic against the written design."}, {"type": "mc", "summary": "The K8s API is reachable only from admin CIDR and CI runner", "text": "<p>Last quarter the platform team restricted the Kubernetes API server to the admin CIDR and the CI runner, with just-in-time access for humans. This morning you review what the restriction actually bought the company.</p>", "question": "What did the IP-range restriction change for an attacker who has a foothold on a user laptop?", "hint": "The restriction did not patch, encrypt, or filter mail. Ask what paths remain and how visible they are.", "options": [{"t": "The path to cluster control now starts from an allowed, watched channel — quiet cluster takeover is much harder", "correct": true}, {"t": "The Kubernetes API server is now fully patched against all bugs"}, {"t": "The attacker can no longer send phishing emails to developers"}, {"t": "Kubernetes now encrypts all pod traffic automatically"}], "correct": "Reachability narrowed to watched channels.", "explain": "The restriction removed the quiet paths: a laptop foothold can no longer reach the API server directly. Any attempt must come from the admin CIDR or the CI runner — channels that are inventoried, monitored, and tied to identities. That is the M1035 effect: not patching (the bugs stay), not encryption, not mail filtering, but shrinking the reachable set and pushing the attacker into noisy territory. The page's Use line for T1609 says exactly this: restrict the permitted IP ranges, and enable just-in-time access where possible.", "study": "The Use line for T1609 Container Administration Command."}, {"type": "spot", "summary": "Audit the server-VLAN rule set", "text": "<p>Quarterly rule audit. Five lines define access into the server VLAN. Two of them undermine the whole design, in different ways.</p>", "blocks": [{"label": "ARTEFACT 1 — Rule set (server VLAN ingress)", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> ip  <span class=\"c-ip\">10[.]0[.]0[.]0/8</span> → <span class=\"c-ip\">10[.]20[.]0[.]0/16</span>   <span class=\"c-dim\"># \"internal traffic\"</span>\n<span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]0/24</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">22</span>      <span class=\"c-dim\"># admin to Linux farm</span>\n<span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]5</span> → <span class=\"c-ip\">10[.]20[.]1[.]9</span>:<span class=\"c-num\">3389</span>     <span class=\"c-dim\"># jump host to DC</span>\n<span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">0[.]0[.]0[.]0/0</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">2375</span>    <span class=\"c-dim\"># vendor support</span>\n<span class=\"c-no\">deny</span>  ip  <span class=\"c-ip\">any</span> → <span class=\"c-ip\">any</span></pre>"}], "question": "Click the TWO lines that undermine the design.", "hint": "One line is too wide in the source; one is too wide in the destination port.", "lines": [{"t": "allow ip 10[.]0[.]0[.]0/8 → 10[.]20[.]0[.]0/16   # “internal traffic”", "bad": true, "note": "A /8-to-/16 blanket allow sits above the scoped rules and shadows them."}, {"t": "allow tcp 10[.]9[.]0[.]0/24 → 10[.]20[.]1[.]5:22      # admin to Linux farm"}, {"t": "allow tcp 10[.]9[.]0[.]5 → 10[.]20[.]1[.]9:3389     # jump host to DC"}, {"t": "allow tcp 0[.]0[.]0[.]0/0 → 10[.]20[.]1[.]5:2375    # vendor support", "bad": true, "note": "The unauthenticated Docker API opened to every source — the container rows forbid exactly this."}, {"t": "deny ip any → any"}], "correct": "The /8 blanket allow (shadows everything) and the world-open 2375 line.", "explain": "The /8 blanket allow makes every scoped rule below it unreadable and ineffective — traffic to the server VLAN is allowed before the specific lines are ever reached; this is a shadowed-rule defect. The 2375 line re-opens the unauthenticated Docker API to every source, which the page's container rows explicitly forbid. The admin SSH and jump-host RDP lines are scoped correctly. Finding one loud flaw is easy; finding the silent structural one is what rule-set audits are for.", "study": "Rule shadowing and range-wide allows in firewall audits."}, {"type": "branch", "summary": "Branching drill: SMB spread on the finance VLAN", "text": "<p>A ransomware precursor is unfolding on the finance VLAN. Make the four containment decisions in order. Each step is graded at the final Check.</p>", "question": "Answer all four steps.", "hint": "Each step asks for the least destructive next move — and its evidence.", "steps": [{"ctx": "<p>02:14 — FIN-PC-04 shows admin-share sessions toward 12 file servers. The firewall denies most, some were allowed before rules tightened. EDR on FIN-PC-04 is offline.</p>", "q": "First containment move with segmentation in place?", "options": [{"t": "Add an ACL denying FIN-PC-04's subnet to the finance server range; keep the host powered and collecting", "correct": true}, {"t": "Power off FIN-PC-04 immediately"}, {"t": "Re-image all finance servers tonight"}], "note": "Least aggressive first: cut the network path, keep the evidence alive."}, {"ctx": "<p>Session history shows admin-share access to two servers was ALLOWED earlier. Admin shares are enabled fleet-wide.</p>", "q": "What does the allowed access reveal about the prior state?", "options": [{"t": "Share-level least privilege was missing and admin shares were not disabled — an M1035 measure gap", "correct": true}, {"t": "The firewall was powered off during the night"}, {"t": "The attacker had physical console access"}], "note": "The page's Use line for T1021.002 says to consider disabling administrative shares."}, {"ctx": "<p>The CISO asks for the next hardening step tonight, scoped to what the incident taught.</p>", "q": "Which action is correct and scoped?", "options": [{"t": "Disable Windows administrative shares via GPO and audit share ACLs on the touched servers", "correct": true}, {"t": "Install antivirus on every domain controller now"}, {"t": "Nothing — wait for the post-incident review"}], "note": "A named measure, scoped to the incident's lesson."}, {"ctx": "<p>06:00 — leadership wants proof the spread path is closed.</p>", "q": "Which evidence proves containment?", "options": [{"t": "SIEM shows denies where sessions used to be allowed, and no new admin-share sessions", "correct": true}, {"t": "The finance dashboard shows a green light"}, {"t": "The attacker's email address stopped responding"}], "note": "Control telemetry is the proof — not feelings."}], "correct": "Cut the path → name the gap → scoped hardening → telemetry proof.", "explain": "This drill chains four real decisions. First, cut the reachable path with an ACL instead of destroying evidence by powering the host off. Second, read the allowed sessions as a control gap: the page's Use line for T1021.002 says to consider disabling administrative shares. Third, choose the scoped hardening — GPO for admin shares plus a share-ACL audit — over broad panic actions. Fourth, prove containment with the same telemetry that watched the incident. That sequence — path, gap, fix, proof — is the backbone of an IR containment plan built on M1035.", "study": "Containment decisions and the T1021.002 Use line."}, {"type": "match", "summary": "Four flows, four correct readings", "text": "<p>You review four flows and events from the server segment and must label each one the way the M1035 page would. Two of the right answers are easy to confuse.</p>", "question": "Match each observed item to its correct reading.", "hint": "Two items are blocked-or-gateway stories; one is a host-firewall story; one is not a network event at all.", "pairs": [{"l": "Container host queries the Instance Metadata API", "r": "Expected path, but only a host firewall limiting who may ask protects it (T1552.005)", "note": "The page names host-based firewalls such as iptables for IMDS."}, {"l": "RDP session hijack attempt against the jump host", "r": "Gateway-fronted RDP is the counter — the hijack targets sessions behind the door (T1563.002)", "note": "The Use line says: use remote desktop gateways."}, {"l": "Workstation tries a TFTP boot against a server", "r": "Legacy protocol without encryption or authentication — restricted by design (T1542.005)", "note": "Restrict unencrypted, unauthenticated protocols."}, {"l": "An admin edits a file share's permission list", "r": "Permissions work — audit and restrict access, not a firewall event", "note": "AD and IAM tooling, measure 1 — no deny line will ever show it."}], "correct": "IMDS restricted by host firewall; hijack answered by gateway; TFTP restricted; permissions audited.", "explain": "These four readings stop near-misses. IMDS traffic is expected from cloud hosts, but the page's protection is a host firewall limiting which sources may query it — not a VLAN rule. RDP hijacking is answered by gateways, which also serve the accessibility-features row (T1546.008). TFTP is the page's example of protocols without encryption or authentication that must be restricted. The share permission edit is identity work under measure 1, so no firewall line will ever record it. Correctly separating these sends each ticket to the right team.", "study": "Use lines for T1552.005, T1563.002, and T1542.005."}, {"type": "grid", "summary": "Mark the coverage from the environment notes", "text": "<p>Coverage audit. Four environment notes are your only evidence — mark each technique row Covered or Gap accordingly.</p>", "blocks": [{"label": "ARTEFACT 1 — Environment notes", "html": "<ul class=\"mono\" style=\"color:var(--text-mono);font-size:14px;\"><li>VPN concentrator: MFA + device checks live for remote staff</li><li>K8s API: admin CIDR + CI runner only; JIT for humans</li><li>Build host Docker API: listening on 2375, no authentication</li><li>Admin shares: enabled on all 40 servers</li><li>Guest VLAN: no NAC deployed</li></ul>"}], "question": "Sort every row into Covered or Gap, based only on the notes.", "hint": "Match each row against the artefact that names it — or notices its absence.", "cols": ["Covered", "Gap"], "rows": [{"t": "T1133 External Remote Services", "col": 0, "note": "Concentrator with MFA and device restriction is evidenced."}, {"t": "T1609 Container Administration Command (K8s API)", "col": 0, "note": "IP ranges restricted, JIT enabled — evidenced."}, {"t": "T1612 Build Image on Host (Docker API)", "col": 1, "note": "2375 unauthenticated — the page says TLS 2376 or a local socket."}, {"t": "T1021.002 SMB/Windows Admin Shares", "col": 1, "note": "Shares enabled fleet-wide; the Use line says consider disabling them."}, {"t": "T1200 Hardware Additions (guest VLAN)", "col": 1, "note": "No NAC — unregistered devices can join and reach the inside."}], "correct": "Two covered, three gaps.", "explain": "Coverage audits are evidence-based: a row is covered only when an artefact proves it. The VPN and Kubernetes notes cover T1133 and T1609. The unauthenticated 2375 API, the fleet-wide admin shares, and the missing guest NAC leave T1612, T1021.002, and T1200 exposed — each with a named fix on the page: TLS 2376 or a local socket, disabling admin shares, and 802.1x with device certificates. Marking gaps next to page language is how a mitigation owner turns an ATT&CK table into a work plan.", "study": "Evidence-based coverage marking per technique row."}, {"type": "fill", "summary": "Complete the segmentation policy", "text": "<p>You finish the segmentation policy. Three design words carry the whole control; the near-misses in the bank would quietly widen the design.</p>", "question": "Fill the three blanks with the design words.", "hint": "One word names the only door for admin sessions; one is just-in-time; one is the port-based NAC standard.", "sentence": "Production VLANs accept administrative sessions only from the {s0} network. Container APIs grant standing access to no one — engineers use {s1} access for break-glass work. Guest devices must pass {s2} authentication before any internal reach.", "slots": ["jump-host", "JIT", "802.1x"], "bank": ["jump-host", "JIT", "802.1x", "printer", "guest", "permanent"], "correct": "jump-host … JIT … 802.1x.", "explain": "The policy encodes three page ideas. Administration only from the jump-host network follows the concentrator-and-gateway model of centralising access. Just-in-time access for container APIs is the page's own recommendation for the Kubernetes API — standing rights are the thing being removed. And 802.1x port-based authentication is the answer to unregistered devices, the T1200 worry. Printer, guest, and permanent are the near-misses that would turn this policy into a hole.", "study": "JIT access and 802.1x in the M1035 context."}, {"type": "mc", "summary": "Do we still need the quarterly access re-audit?", "text": "<p>A team lead proposes: 'Our segmentation is tight and monitor-mode shows no anomalies. Let's skip the quarterly access re-audit to save effort.' The room looks convinced.</p>", "question": "Why is skipping the re-audit wrong?", "hint": "The tempting answer is that good rules stay good. Ask what changes around the rules every quarter.", "options": [{"t": "Access drifts with joiners, movers, and leavers, and unowned rules accumulate — auditing access is a named M1035 measure", "correct": true}, {"t": "Audits are only required for cloud platforms"}, {"t": "Segmentation rules repair themselves over time"}, {"t": "Auditing slows attackers down more than segmentation"}], "correct": "Drift erodes least privilege; the audit is measure 1 on the page.", "explain": "The rules do not change — the organisation does. Joiners, movers, and leavers shift who has a legitimate business need; temporary rules survive their deadlines; new services appear. The page's first measure is exactly this: regularly audit permissions for file shares, network services, and remote access tools, and remove unnecessary access. Skipping it breaks nothing today; it quietly widens every allow-list until 'tight segmentation' is a memory. Control decay like this is a classic audit finding.", "study": "'Audit and Restrict Access' — the first implementation measure."}, {"type": "dd", "summary": "Map each decision to the technique it blunts", "text": "<p>Design review. Four decisions are on the table; each exists because one technique row demands it. Weld them together before the design document goes out.</p>", "question": "Drag each decision onto the technique it most directly blunts.", "hint": "Two are gateway and share stories, one is a cluster API, one lives on switches.", "zones": ["T1563.002 RDP Hijacking", "T1021.002 SMB/Windows Admin Shares", "T1609 Container Administration Command", "T1557.002 ARP Cache Poisoning"], "items": [{"t": "Front all RDP with the remote desktop gateway", "zone": 0, "note": "The page's Use line is literally 'Use remote desktop gateways.'"}, {"t": "Disable Windows administrative shares via GPO", "zone": 1, "note": "The page says to consider disabling them."}, {"t": "Restrict the K8s API to the admin CIDR and add JIT access", "zone": 2, "note": "The page's recipe for the API server."}, {"t": "Pin static ARP entries on core switches", "zone": 3, "note": "The page's counter to ARP poisoning — with its scale caveat."}], "correct": "Each decision maps to its page row.", "explain": "This mapping is the design-level view of the page: every decision exists because a specific technique row demands it. Gateway for hijacking, share disabling for admin shares, CIDR plus JIT for the cluster API, static ARP for poisoning. Design reviews go wrong when decisions are copied without their row — for example static ARP everywhere, ignoring the page's own infeasibility caveat at large scale. Keep the decision and its technique welded together in the design document.", "study": "Welding every design decision to its technique row."}, {"type": "order", "summary": "Order the verification pipeline after monitor mode", "text": "<p>Monitor mode has been running for two weeks on the new segment. You turn its output into enforced least privilege without outages.</p>", "question": "Order the five pipeline activities.", "hint": "Start with collecting evidence and end with switching on blocking.", "items": [{"t": "Collect the flow baseline for the segment", "note": "Evidence first."}, {"t": "Compare observed flows with the business owners' declared needs", "note": "Declared versus real."}, {"t": "Flag undeclared flows and ask owners about each", "note": "The honest conversations."}, {"t": "Convert confirmed needs into scoped rules with owners and expiry", "note": "Scoped and owned."}, {"t": "Enforce and alert on denies", "note": "Blocking starts."}], "correct": "Baseline → compare → flag → scoped rules → enforce.", "explain": "Monitor mode produces data; this pipeline turns data into enforced least privilege without outages. Baseline first, then reconcile with declared needs — the mismatch is where both attacks and forgotten services hide. Each confirmed need becomes a scoped, owned, expiring rule; everything else is denied with alerts. Skipping the reconciliation step is how production breakage and exception sprawl begin. This is a detection-engineer-style workflow applied to a preventive control.", "study": "Turning monitor-mode output into enforced rules."}, {"type": "mc", "summary": "The legacy NAS exception", "text": "<p>A legacy application in the server VLAN needs SMB to a 2012-era NAS. The new segmentation plan blocks it. The app owner escalates with: 'Fix it today or production stops.'</p>", "question": "Choose the least aggressive correct response.", "hint": "One option keeps both production and least privilege; the others trade one away.", "options": [{"t": "Add a scoped exception: one source host to the NAS on tcp/445, named owner, 90-day expiry, deny-line review", "correct": true}, {"t": "Allow the whole server VLAN to the NAS on all ports"}, {"t": "Deny the app and let production stop until it is rewritten"}, {"t": "Move the NAS into the user VLAN tonight"}], "correct": "A scoped, owned, expiring exception with deny review.", "explain": "The scoped exception keeps the business running and the control honest: one host, one port, one owner, an expiry, and deny telemetry to watch. The VLAN-wide allow quietly rebuilds the flat network; stopping production is disproportionate; relocating a legacy NAS overnight creates more risk than it removes. Time-boxed exceptions with review dates are the standard tool for exactly this conflict — and the expiry is what forces the real fix onto a roadmap.", "study": "Time-boxed exceptions with owners and deny review."}, {"type": "spot", "summary": "Find the line that defeats the DMZ", "text": "<p>A vendor delivered the DMZ design. The inbound rules look beautiful. One line quietly defeats the whole model.</p>", "blocks": [{"label": "ARTEFACT 1 — Design excerpt (flow rules)", "html": "<pre class=\"log\"><span class=\"c-dim\">1.</span> DMZ hosts accept inbound connections only from the internet edge firewall\n<span class=\"c-dim\">2.</span> App servers may open <span class=\"c-warn\">ANY</span> outbound connection into the database VLAN\n<span class=\"c-dim\">3.</span> Database VLAN accepts tcp/<span class=\"c-num\">1433</span> only from the app subnet\n<span class=\"c-dim\">4.</span> The jump host is the only path into the management VLAN</pre>"}], "question": "Click the line that defeats the isolation model.", "hint": "Inbound rules look tight. Check who can START a connection, and to where.", "lines": [{"t": "1. DMZ hosts accept inbound connections only from the internet edge firewall"}, {"t": "2. App servers may open ANY outbound connection into the database VLAN", "bad": true, "note": "A compromised app server can open sessions to every database host directly."}, {"t": "3. Database VLAN accepts tcp/1433 only from the app subnet"}, {"t": "4. The jump host is the only path into the management VLAN"}], "correct": "Line 2 — the any-outbound app-to-database rule.", "explain": "Isolation is about who can initiate flows, not only who can accept them. The app tier being able to open any outbound connection into the database VLAN means a compromised app server can scan and attack every database host directly — the 'tight inbound, open outbound' pattern that quietly voids segmentation. The other lines are scoped and gateway-shaped. When reviewing designs, always ask about initiation direction; this is where most 'we have a DMZ' claims fail.", "study": "Flow initiation direction in segmentation designs."}, {"type": "multi", "summary": "Select the two strongest reasons to front RDP with a gateway", "text": "<p>You are writing the one-page proposal that will move all internal RDP behind the remote desktop gateway. Six candidate reasons were brainstormed; two of them are the ones the ATT&CK page actually values.</p>", "question": "Select the TWO strongest reasons.", "hint": "Both correct reasons are about the word 'one'.", "options": [{"t": "It centralises RDP security configuration at one managed door", "correct": true, "note": "One place to harden, restrict, and enforce MFA."}, {"t": "It gives one place where RDP sessions are logged and reviewed", "correct": true, "note": "The monitoring measure lives at the door."}, {"t": "It removes the need to patch the RDP service"}, {"t": "It automatically encrypts all DNS traffic"}, {"t": "It replaces endpoint antivirus entirely"}, {"t": "It makes remote desktop feel faster for users"}], "correct": "Centralised configuration at one door, and one logging point.", "explain": "The page values gateways because they aggregate: one door to configure, harden, enforce MFA on, and log — which also serves the monitoring measure and the technique rows that name gateways, such as RDP hijacking (T1563.002) and accessibility-features abuse (T1546.008). A gateway does not patch the underlying service, touch DNS, replace antivirus, or change speed. Picking the two strongest reasons — instead of five weak ones — is the discipline an architect needs when writing a proposal the CISO will actually read.", "study": "The gateway measure and its link to T1563.002 and T1546.008."}, {"type": "match", "summary": "Match the technique row to the page's Use-line summary", "text": "<p>A junior paraphrased four Use lines from the M1035 page for the design document — and paraphrased two of them wrong. Your job: weld each row to what the page actually says before the document ships.</p>", "question": "Match each technique row to the summary of its Use line.", "hint": "One row is about public exposure, one about new devices, one about layer-2, one about container channels.", "pairs": [{"l": "T1190 Exploit Public-Facing Application" ation, not about encryption.", "steps": [{"ctx": "<p>Someone suggests: 'Add it to the segmentation rules and close the ticket.'</p>", "q": "Is this flow inside M1035's scope?", "options": [{"t": "No — the resource is outside the company; egress filtering to internet destinations is a different control", "correct": true}, {"t": "Yes — block it with the server-VLAN ACLs and close the ticket"}, {"t": "Yes — but only if the upload is encrypted"}], "note": "Scope honesty prevents the wrong team from owning the fix."}, {"ctx": "<p>The SOC still wants to act today with what it has.</p>", "q": "Which M1035 measure already helped here?", "options": [{"t": "Monitoring and logging flagged the anomalous allowed flow in the first place", "correct": true}, {"t": "The Docker API hardening"}, {"t": "Static ARP entries"}], "note": "The monitoring measure is the detective companion inside the mitigation."}, {"ctx": "<p>You must hand the finding over.</p>", "q": "What is the correct handoff?", "options": [{"t": "Route to the team owning egress and proxy filtering; document a detection rule for this flow", "correct": true}, {"t": "Add the cloud drive to the firewall's allow-list to stop the noise"}, {"t": "Delete the build server"}], "note": "Right owner plus detection — not rule gaming."}], "correct": "Out of scope → monitoring helped → hand to the egress owner plus a detection.", "explain": "M1035 restricts access to resources over allowed networks — but a personal cloud drive is an external resource, so egress filtering owns it, not this mitigation. What M1035 contributed is its monitoring measure: the anomalous allowed flow was logged and flagged. The correct handoff sends the finding to the egress owner and turns the flow into a detection. Claiming it as a segmentation failure would misdirect the fix and leave the real control untouched. Scope honesty is a senior skill.", "study": "Where M1035 ends and egress filtering begins."}];

'use strict';
/* ================= M1035 exam engine — core ================= */
var CURSEQ = 0;

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined && txt !== null) e.textContent = txt; return e; }
function hv(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined && html !== null) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtClock(sec){ var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function stripTags(s){ var d = document.createElement('div'); d.innerHTML = s; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }

/* ---------- state ---------- */
var S = null;
var CUR = { idx: -1, widget: null, checked: false };
function freshState(){
  var order = [], i;
  for (i = 0; i < EX.length; i++) order.push(i);
  return { order: shuffle(order), cur: 0, rIdx: -1, answered: {}, credit: {}, skipped: [], hintUsed: {},
           reviewReturn: false, autoActive: false, phase: 'intro',
           timer: { state: 'IDLE', remaining: META.timerSeconds, manualSec: 0, autoSec: 0 } };
}
function curIdx(){ return S.reviewReturn ? S.rIdx : S.order[S.cur]; }

/* ---------- views ---------- */
function showView(name){
  ['intro','exam','review','results'].forEach(function(v){
    var node = $(v);
    if (node) node.classList.toggle('hidden', v !== name);
  });
}

/* ---------- timer state machine: IDLE / RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
var tickHandle = null;
function startTimer(){ if (tickHandle) clearInterval(tickHandle); tickHandle = setInterval(onTick, 1000); }
function onTick(){
  if (!S) return;
  var t = S.timer;
  if (t.state === 'RUNNING'){
    t.remaining--;
    if (t.remaining <= 0){ t.remaining = 0; renderHeader(); timerEnded(); return; }
  } else if (t.state === 'PAUSED_MANUAL'){ t.manualSec++; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ t.autoSec++; }
  renderHeader();
}
function setTimerState(st){ if (!S) return; S.timer.state = st; renderHeader(); }
function timerEnded(){
  S.timer.state = 'ENDED'; renderHeader();
  if (S.phase === 'exam' || S.phase === 'review'){ finishExam(true); }
}

/* ---------- header ---------- */
function renderHeader(){
  var total = EX.length;
  var idx = Math.min(S.cur + 1, total);
  $('hCount').textContent = 'Exercise ' + idx + ' of ' + total;
  var b = $('hSev'); b.textContent = META.severity; b.className = 'badge ' + META.sevClass;
  var t = S.timer;
  $('hTimer').textContent = fmtClock(t.remaining);
  var st = $('hTState');
  if (t.state === 'RUNNING'){ st.textContent = '\u25B6 RUNNING'; st.className = 'chip c-run'; }
  else if (t.state === 'PAUSED_MANUAL'){ st.textContent = '\u23F8 PAUSED \u2014 manual (press Resume)'; st.className = 'chip c-paused'; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ st.textContent = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.className = 'chip c-paused'; }
  else if (t.state === 'ENDED'){ st.textContent = '\u25A0 ENDED'; st.className = 'chip c-ended'; }
  else { st.textContent = '\u2014 not started'; st.className = 'chip c-ended'; }
  var answered = 0, sum = 0, k;
  for (k in S.answered){ if (S.answered[k]){ answered++; sum += S.credit[k]; } }
  var sc = $('hScore');
  if (answered > 0){
    var pct = Math.round((sum / answered) * 100);
    sc.textContent = sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + pct + '%';
  } else { sc.textContent = '0.0 / 0 \u00B7 \u2014'; }
  var prog = S.phase === 'results' ? total : Math.max(0, S.cur);
  $('hBar').style.width = (total ? (prog / total) * 100 : 0) + '%';
  var canPause = (t.state === 'RUNNING' || t.state === 'PAUSED_AUTO_CHECK') && S.phase === 'exam';
  $('hPause').disabled = !canPause;
}

/* ---------- intro ---------- */
function buildIntro(){
  var v = $('intro'); v.innerHTML = '';
  v.appendChild(hv('section','card intro-head',
    '<h1>' + META.introTitle + '</h1>' +
    '<div class="obj">' + META.objLine + '</div>' +
    '<div class="facts">' +
      '<span class="badge ' + META.sevClass + '">' + META.severity + '</span>' +
      '<span>' + EX.length + ' exercises</span>' +
      '<span>Estimated time: ' + META.estimatedMinutes + ' minutes</span>' +
      '<span>Timer budget: ' + fmtClock(META.timerSeconds) + '</span>' +
      '<span>Pass mark: ' + META.passMark + '%</span>' +
    '</div><div id="hWho" class="who"></div>'));
  v.appendChild(hv('section','card','<h2>What you will learn here</h2>' + INTRO.learn));
  var kw = ['<h2>Keywords covered in this exam</h2>'];
  INTRO.keywords.forEach(function(th){
    kw.push('<div class="kw-theme"><h3>' + th[0] + '</h3><ul>');
    th[1].forEach(function(c){ kw.push('<li>' + c + '</li>'); });
    kw.push('</ul></div>');
  });
  v.appendChild(hv('section','card', kw.join('')));
  var how = hv('section','card','<h2>How this exam works</h2>' + INTRO.how);
  var startWrap = el('div','startwrap');
  var btn = el('button','btn primary start','\u25B6 Start exam');
  btn.id = 'startBtn'; btn.type = 'button';
  btn.addEventListener('click', startExam);
  startWrap.appendChild(btn);
  how.appendChild(startWrap);
  v.appendChild(how);
}

/* ---------- exam flow ---------- */
function startExam(){
  S.phase = 'exam';
  showView('exam');
  setTimerState('RUNNING');
  startTimer();
  renderExercise();
}

function renderExercise(){ renderExerciseAt(curIdx()); }

function renderExerciseAt(idx){
  CURSEQ++;
  CUR.idx = idx; CUR.checked = false; CUR.widget = null;
  var ex = EX[idx];
  var area = $('exArea'); area.innerHTML = '';
  var art = el('article','ex');
  if (S.reviewReturn){
    art.appendChild(hv('div','review-banner','\u26A0 Returned from the skipped list \u2014 answer it now, or press Skip again to leave it unanswered.'));
  }
  /* SCENARIO block */
  var scen = el('section','block scenario');
  var sb = hv('div','bh bh-scen','<span class="bicon">\u25B8</span> SCENARIO');
  var tog = el('button','mini'); tog.type = 'button'; tog.textContent = 'Hide';
  tog.addEventListener('click', function(){
    var c = scen.classList.toggle('collapsed');
    tog.textContent = c ? 'Show' : 'Hide';
  });
  sb.appendChild(tog);
  scen.appendChild(sb);
  scen.appendChild(hv('div','sc-summary mono', ex.summary));
  var body = el('div','sc-body');
  if (ex.text) body.appendChild(hv('div','prose', ex.text));
  (ex.blocks || []).forEach(function(b){
    var p = el('div','art');
    p.appendChild(hv('div','art-label mono', b.label));
    p.appendChild(hv('div','art-body', b.html));
    body.appendChild(p);
  });
  scen.appendChild(body);
  art.appendChild(scen);
  /* QUESTION block */
  var q = el('section','block question');
  q.appendChild(hv('div','bh bh-q','<span class="bicon">?</span> QUESTION'));
  q.appendChild(hv('div','bbody q-text', ex.question));
  art.appendChild(q);
  /* YOUR ANSWER block */
  var a = el('section','block answer');
  a.appendChild(hv('div','bh bh-a','<span class="bicon">\u270E</span> YOUR ANSWER'));
  var box = el('div','bbody');
  a.appendChild(box);
  var hint = hv('div','hint hidden',''); hint.id = 'hintPanel';
  a.appendChild(hint);
  art.appendChild(a);
  /* FEEDBACK block */
  var fb = el('section','block feedback hidden'); fb.id = 'fbBlock';
  fb.appendChild(hv('div','bh','<span id="fbHead"></span>'));
  var fbBody = el('div','bbody'); fbBody.id = 'fbBody';
  fb.appendChild(fbBody);
  art.appendChild(fb);
  /* actions */
  var act = el('div','actions');
  var c = el('button','btn primary'); c.id = 'btnCheck'; c.type = 'button'; c.textContent = 'Check';
  c.addEventListener('click', onCheck);
  var n = el('button','btn primary hidden'); n.id = 'btnNext'; n.type = 'button'; n.textContent = 'Next \u25B8';
  n.addEventListener('click', onNext);
  var f = el('button','btn danger hidden'); f.id = 'btnFinal'; f.type = 'button'; f.textContent = 'Final Submit \u2713';
  f.addEventListener('click', onFinalSubmit);
  act.appendChild(c); act.appendChild(n); act.appendChild(f);
  art.appendChild(act);
  area.appendChild(art);
  /* widget */
  CUR.widget = WIDGETS[ex.type](ex, box, { onReady: function(){ if (!CUR.checked) $('btnCheck').disabled = false; } });
  $('btnCheck').disabled = true;
  $('btnNext').classList.add('hidden');
  $('btnFinal').classList.add('hidden');
  $('fbBlock').classList.add('hidden');
  $('hSkip').disabled = false;
  $('hHint').disabled = !!S.hintUsed[idx];
  $('hPause').textContent = '\u23F8 Pause';
  renderHeader();
}

function onCheck(){
  if (!CUR.widget || CUR.checked) return;
  var idx = curIdx(); var ex = EX[idx];
  var r = CUR.widget.grade();
  var N = r.N || 1;
  var credit = Math.max(0, (r.H - r.W) / N);
  if (S.hintUsed[idx]) credit = Math.max(0, credit - 0.10);
  CUR.checked = true;
  S.autoActive = true;
  setTimerState('PAUSED_AUTO_CHECK'); /* pause first — feedback renders into the paused state */
  if (CUR.widget.lock) CUR.widget.lock();
  S.credit[idx] = credit; S.answered[idx] = true;
  S.skipped = S.skipped.filter(function(x){ return x !== idx; });
  renderFeedback(ex, r, credit, N);
  $('btnCheck').classList.add('hidden');
  var last = (!S.reviewReturn) && (S.cur >= S.order.length - 1);
  if (last){ $('btnFinal').classList.remove('hidden'); }
  else { $('btnNext').classList.remove('hidden'); }
  $('hSkip').disabled = true;
  $('hHint').disabled = true;
  renderHeader();
  try { $('fbBlock').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

function renderFeedback(ex, r, credit, N){
  var fb = $('fbBlock'); fb.classList.remove('hidden');
  var head = $('fbHead');
  var cls, label;
  if (credit >= 0.999){ cls = 'v-correct'; label = '\u2713 CORRECT'; }
  else if (credit > 0){ cls = 'v-partial'; label = '\u2713 PARTIALLY CORRECT'; }
  else { cls = 'v-incorrect'; label = '\u2717 INCORRECT'; }
  head.className = cls; head.textContent = label;
  var body = $('fbBody'); body.innerHTML = '';
  if (N > 1){
    body.appendChild(hv('div','credit-line', 'credit ' + credit.toFixed(2) + ' \u2014 ' + r.H + '/' + N + ' items \u00B7 formula: max(0, (H \u2212 W) / N) with H=' + r.H + ' correct, W=' + r.W + ' wrong'));
  }
  if (r.correctText){ body.appendChild(hv('div','correct-line','<strong>Correct answer:</strong> ' + r.correctText)); }
  (r.rows || []).forEach(function(row){
    var d = el('div','fb-row');
    var ic, wrd, c2;
    if (row.ok === 'c'){ ic = '\u2713'; wrd = 'Correct'; c2 = 'ic-ok'; }
    else if (row.ok === 'w'){ ic = '\u2717'; wrd = 'Wrong'; c2 = 'ic-no'; }
    else { ic = '\u25CB'; wrd = 'Missed'; c2 = 'ic-miss'; }
    d.appendChild(hv('span','fb-ic ' + c2, ic + ' ' + wrd));
    d.appendChild(hv('span','fb-tx', row.text + (row.note ? ' \u2014 ' + row.note : '')));
    body.appendChild(d);
  });
  body.appendChild(hv('div','explain', ex.explain));
  if (credit < 0.999 && ex.study){ body.appendChild(hv('div','study','<strong>Study next:</strong> ' + ex.study)); }
}

function onNext(){
  if (!CUR.checked) return;
  if (S.reviewReturn){
    S.reviewReturn = false; S.autoActive = false;
    setTimerState('RUNNING');
    openReview();
    return;
  }
  S.autoActive = false;
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else {
    S.cur++; setTimerState('RUNNING'); renderExercise();
  }
}
function onFinalSubmit(){
  if (S.skipped.length){ openReview(); return; } /* review skipped exercises before finishing */
  finishExam(false);
}

function onSkip(){
  if (CUR.checked) return;
  var idx = curIdx();
  if (S.skipped.indexOf(idx) === -1) S.skipped.push(idx); /* never list an exercise twice */
  if (S.reviewReturn){ S.reviewReturn = false; openReview(); return; }
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else { S.cur++; renderExercise(); } /* timer keeps running through a skip */
}

function onHint(){
  var idx = curIdx();
  if (S.hintUsed[idx] || CUR.checked) return;
  S.hintUsed[idx] = true;
  var hp = $('hintPanel');
  hp.innerHTML = '<strong>Hint used \u2014 10% of this exercise credit will be deducted.</strong><br>' + EX[idx].hint;
  hp.classList.remove('hidden');
  $('hHint').disabled = true;
  renderHeader();
}

function onPause(){
  if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK') return;
  $('pauseOverlay').classList.remove('hidden');
  $('exArea').classList.add('hidden');
  $('hPause').textContent = '\u25B6 Resume';
  setTimerState('PAUSED_MANUAL');
}
function onResume(){
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  $('hPause').textContent = '\u23F8 Pause';
  setTimerState(S.autoActive ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase = 'review'; S.autoActive = false;
  showView('review');
  setTimerState('RUNNING'); /* timer resumes on the review screen */
  var v = $('review'); v.innerHTML = '';
  v.appendChild(hv('section','card','<h2>\u26A0 Review skipped exercises</h2>' +
    '<p>Time left on the timer: <strong class="mono">' + fmtClock(S.timer.remaining) + '</strong>. ' +
    'You can go back to any skipped exercise and answer it while time is left. ' +
    'Skipped exercises you never answer are excluded from the score \u2014 they count as neither correct nor wrong.</p>'));
  if (!S.skipped.length){
    v.appendChild(hv('section','card','<p>\u2713 No skipped exercises left.</p>'));
  } else {
    var card = el('section','card');
    S.skipped.forEach(function(idx){
      var row = el('div','rv-row');
      row.appendChild(hv('span','rv-warn','\u26A0 Skipped'));
      row.appendChild(hv('span','rv-tx', EX[idx].summary));
      var b = el('button','btn'); b.type = 'button'; b.textContent = 'Answer';
      b.addEventListener('click', function(){ reviewAnswer(idx); });
      row.appendChild(b);
      card.appendChild(row);
    });
    v.appendChild(card);
  }
  var sub = el('section','card');
  var sb = el('button','btn primary'); sb.type = 'button'; sb.textContent = 'Submit exam';
  sb.addEventListener('click', function(){ finishExam(false); });
  sub.appendChild(sb);
  v.appendChild(sub);
}
function reviewAnswer(idx){
  S.reviewReturn = true; S.rIdx = idx; S.phase = 'exam';
  showView('exam');
  renderExerciseAt(idx);
}

/* ---------- results ---------- */
function resRow(cls, label, txt){
  var d = el('div','fb-row');
  d.appendChild(hv('span','fb-ic ' + cls, label));
  d.appendChild(hv('span','fb-tx', txt));
  return d;
}
function finishExam(byTimeout){
  S.phase = 'results';
  S.timer.state = 'ENDED';
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  var answered = 0, sum = 0, fully = 0, partial = 0, partialSum = 0, wrong = 0, k;
  for (k in S.answered){
    if (!S.answered[k]) continue;
    answered++;
    var c = S.credit[k]; sum += c;
    if (c >= 0.999) fully++;
    else if (c > 0){ partial++; partialSum += c; }
    else wrong++;
  }
  var skippedN = S.skipped.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= META.passMark;
  showView('results');
  renderHeader();
  var v = $('results'); v.innerHTML = '';
  v.appendChild(hv('section','card res-head',
    '<h2>Results \u2014 ' + META.introTitle + '</h2>' +
    '<div class="res-score mono">' + sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + percent + '%</div>' +
    (byTimeout ? '<p class="res-note">\u23F1 Time is up. Unanswered exercises were excluded from the score.</p>' : '') +
    '<div class="res-verdict ' + (passed ? 'v-correct' : 'v-incorrect') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<p>' + (passed
      ? 'Well done. You reached the ' + META.passMark + '% pass mark on this exam.'
      : 'You did not reach the ' + META.passMark + '% pass mark this time. Read the feedback themes below, study the pointers, and retake the exam.') + '</p>'));
  var br = el('section','card');
  br.appendChild(hv('h2','','Score breakdown'));
  br.appendChild(resRow('ic-ok','\u2713 Fully correct', fully + ' exercise' + (fully === 1 ? '' : 's') + ' (credit = 1.0)'));
  br.appendChild(resRow('ic-partial','\u2713 Partially correct', partial + ' exercise' + (partial === 1 ? '' : 's') + (partial ? ' (avg partial credit ' + (partialSum / partial).toFixed(2) + ')' : '')));
  br.appendChild(resRow('ic-no','\u2717 Fully incorrect', wrong + ' exercise' + (wrong === 1 ? '' : 's') + ' (credit = 0)'));
  br.appendChild(resRow('ic-miss','\u26A0 Skipped \u2014 excluded', skippedN + ' exercise' + (skippedN === 1 ? '' : 's') + ' (not counted in numerator or denominator)'));
  var ms = S.timer.manualSec, as = S.timer.autoSec;
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 manual breaks', Math.floor(ms / 60) + ' min ' + (ms % 60) + ' s'));
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 feedback review', Math.floor(as / 60) + ' min ' + (as % 60) + ' s'));
  v.appendChild(br);
  var rc = el('section','card');
  var rb = el('button','btn primary'); rb.type = 'button'; rb.textContent = '\u21BB Retake exam';
  rb.addEventListener('click', retake);
  rc.appendChild(rb);
  v.appendChild(rc);
  reportScore(sum, answered);
}
function retake(){
  S = freshState();
  startExam();
}

/* ---------- site integration ---------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username, country, theme ('dark' \u2014 this file is dark-only), locale, topicId, batch */
  var n = event.data.username || '', c = event.data.country || '';
  var w = $('hWho');
  if (w && (n || c)) { w.textContent = 'Signed in as ' + n + (c ? ' (' + c + ')' : ''); }
});

/* ================= M1035 exam engine — widgets ================= */
var WIDGETS = {};

function correctOf(st){ var o = st.options.filter(function(x){ return x.correct; })[0]; return o ? o.t : ''; }

/* ---------- single-choice ---------- */
WIDGETS.mc = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, oi: i }; }));
  var name = 'ex' + CURSEQ + '-mc';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var sel = null;
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) sel = opts[Number(inp.value)];
      });
      var corr = opts.filter(function(o){ return o.correct; })[0];
      var H = (sel && sel.correct) ? 1 : 0;
      var W = (sel && !sel.correct) ? 1 : 0;
      var rows;
      if (sel && sel.correct){ rows = [{ ok: 'c', text: sel.t, note: ex.answerNote || '' }]; }
      else if (sel){ rows = [{ ok: 'w', text: 'You chose: ' + sel.t, note: 'The correct answer is: ' + corr.t + (ex.answerNote ? ' \u2014 ' + ex.answerNote : '') }]; }
      else { rows = [{ ok: 'm', text: corr.t, note: ex.answerNote || '' }]; }
      return { H: H, W: W, N: 1, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- multi-select (partial credit) ---------- */
WIDGETS.multi = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, note: o.note || '', oi: i }; }));
  var name = 'ex' + CURSEQ + '-mu';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'checkbox'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var picked = [];
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) picked.push(opts[Number(inp.value)]);
      });
      var H = 0, W = 0, N = 0, rows = [];
      opts.forEach(function(o){
        if (!o.correct) return;
        N++;
        var isSel = picked.some(function(p){ return p.oi === o.oi; });
        if (isSel){ H++; rows.push({ ok: 'c', text: o.t, note: o.note }); }
        else { rows.push({ ok: 'm', text: o.t, note: o.note || 'This item belongs in the correct answer.' }); }
      });
      picked.forEach(function(p){
        if (!p.correct){
          W++;
          rows.push({ ok: 'w', text: p.t, note: p.note || 'This option is not part of the correct answer.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match = function(ex, box, ctl){
  var left = ex.pairs.map(function(p){ return { t: p.l }; });
  var right = shuffle(ex.pairs.map(function(p, i){ return { t: p.r, ri: i }; }));
  var map = {}; var selL = -1;
  var gridEl = el('div','pair-cols');
  var lcol = el('div','pcol'); var rcol = el('div','pcol');
  var lrows = [], rrows = [];
  function render(){
    lrows.forEach(function(lr, i){
      var m = map[i];
      lr.querySelector('.msub').textContent = (m === undefined) ? '\u2192 click a partner on the right' : '\u2192 ' + right[m].t;
      lr.classList.toggle('sel', selL === i);
      lr.classList.toggle('paired', m !== undefined);
    });
    rrows.forEach(function(rr, j){
      var taken = Object.keys(map).some(function(k){ return map[k] === j; });
      rr.classList.toggle('used', taken);
    });
  }
  ex.pairs.forEach(function(p, i){
    var lr = el('div','mrow');
    lr.appendChild(el('span','olab',(i + 1) + '.'));
    lr.appendChild(el('span','otext', left[i].t));
    lr.appendChild(el('span','msub mono',''));
    lr.tabIndex = 0;
    lr.setAttribute('role','button');
    lr.setAttribute('aria-label','Match item ' + (i + 1) + ': ' + left[i].t);
    function clickL(){
      if (map[i] !== undefined){ delete map[i]; selL = -1; }
      else { selL = (selL === i ? -1 : i); }
      render(); ctl.onReady();
    }
    lr.addEventListener('click', clickL);
    lr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickL(); } });
    lrows.push(lr); lcol.appendChild(lr);
  });
  right.forEach(function(r, j){
    var rr = el('div','mrow');
    rr.appendChild(el('span','olab', String.fromCharCode(65 + j) + '.'));
    rr.appendChild(el('span','otext', r.t));
    rr.tabIndex = 0;
    rr.setAttribute('role','button');
    rr.setAttribute('aria-label','Candidate partner: ' + r.t);
    function clickR(){ if (selL >= 0){ map[selL] = j; selL = -1; render(); ctl.onReady(); } }
    rr.addEventListener('click', clickR);
    rr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickR(); } });
    rrows.push(rr); rcol.appendChild(rr);
  });
  gridEl.appendChild(lcol); gridEl.appendChild(rcol);
  box.appendChild(hv('div','mhint','Click an item on the left, then click its partner on the right. Click a paired left item again to clear it.'));
  box.appendChild(gridEl);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.pairs.forEach(function(p, i){
        var m = map[i];
        if (m === undefined){
          rows.push({ ok: 'm', text: left[i].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        } else if (right[m].ri === i){
          H++; rows.push({ ok: 'c', text: left[i].t + ' \u2192 ' + p.r, note: p.note || '' });
        } else {
          W++; rows.push({ ok: 'w', text: left[i].t + ' \u2192 ' + right[m].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        }
      });
      return { H: H, W: W, N: ex.pairs.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ gridEl.classList.add('locked'); }
  };
};

/* ---------- ordering (partial credit per position) ---------- */
WIDGETS.order = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it, i){ return { t: it.t, note: it.note || '', ci: i }; }));
  var list = el('div','ord-list');
  function render(){
    Array.prototype.slice.call(list.querySelectorAll('.ord-item')).forEach(function(n){ list.removeChild(n); });
    items.forEach(function(it, pos){
      var row = el('div','ord-item');
      row.appendChild(el('span','ord-pos mono', String(pos + 1)));
      row.appendChild(el('span','otext', it.t));
      var up = el('button','ord-btn'); up.type = 'button'; up.textContent = '\u2191'; up.setAttribute('aria-label','Move up');
      var dn = el('button','ord-btn'); dn.type = 'button'; dn.textContent = '\u2193'; dn.setAttribute('aria-label','Move down');
      up.addEventListener('click', function(){
        if (pos > 0){ var t = items[pos - 1]; items[pos - 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      dn.addEventListener('click', function(){
        if (pos < items.length - 1){ var t = items[pos + 1]; items[pos + 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  box.appendChild(hv('div','mhint','Put the steps in the right order. Use the arrows to move a step up or down.'));
  box.appendChild(list);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it, pos){
        if (pos === it.ci){ H++; rows.push({ ok: 'c', text: (pos + 1) + '. ' + it.t, note: it.note }); }
        else { W++; rows.push({ ok: 'w', text: (pos + 1) + '. ' + it.t, note: 'Correct position: ' + (it.ci + 1) + '. ' + it.note }); }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- drag & drop into zones (partial credit per item) ---------- */
WIDGETS.dd = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it){ return { t: it.t, zone: it.zone, note: it.note || '', placed: -1 }; }));
  var sel = -1;
  var bank = el('div','bank');
  var zonesWrap = el('div','zones');
  var zoneEls = ex.zones.map(function(z){
    var zd = el('div','zone');
    zd.appendChild(hv('h4','', z));
    zd.appendChild(el('div','zone-items'));
    return zd;
  });
  function paintSel(){
    Array.prototype.forEach.call(document.querySelectorAll('.ditem'), function(n){ n.classList.remove('sel'); });
  }
  function itemEl(it, i){
    var d = el('div','ditem');
    d.appendChild(el('span','otext', it.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Item: ' + it.t);
    d.setAttribute('draggable','true');
    d.addEventListener('click', function(){
      if (it.placed !== -1){ it.placed = -1; paintSel(); sel = -1; render(); ctl.onReady(); return; }
      sel = (sel === i ? -1 : i);
      paintSel();
      if (sel === i) d.classList.add('sel');
    });
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); } });
    d.addEventListener('dragstart', function(e){ sel = i; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} });
    return d;
  }
  function render(){
    bank.innerHTML = '';
    items.forEach(function(it, i){ if (it.placed === -1) bank.appendChild(itemEl(it, i)); });
    zoneEls.forEach(function(zd, z){
      var zi = zd.querySelector('.zone-items'); zi.innerHTML = '';
      items.forEach(function(it, i){ if (it.placed === z) zi.appendChild(itemEl(it, i)); });
    });
  }
  function dropOn(z){
    if (sel === -1) return;
    items[sel].placed = z; sel = -1; paintSel(); render(); ctl.onReady();
  }
  zoneEls.forEach(function(zd, z){
    zd.addEventListener('click', function(e){
      if (e.target === zd || e.target.classList.contains('zone-items') || e.target.tagName === 'H4') dropOn(z);
    });
    zd.addEventListener('dragover', function(e){ e.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop', function(e){ e.preventDefault(); zd.classList.remove('over'); dropOn(z); });
  });
  zoneEls.forEach(function(zd){ zonesWrap.appendChild(zd); });
  box.appendChild(hv('div','mhint','Click an item to select it, then click a column to place it. Click a placed item to send it back.'));
  box.appendChild(bank);
  box.appendChild(zonesWrap);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it){
        if (it.placed === -1){
          rows.push({ ok: 'm', text: it.t, note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        } else if (it.placed === it.zone){
          H++; rows.push({ ok: 'c', text: it.t + ' \u2192 ' + ex.zones[it.zone], note: it.note });
        } else {
          W++; rows.push({ ok: 'w', text: it.t + ' \u2192 ' + ex.zones[it.placed], note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){
      bank.classList.add('locked');
      zoneEls.forEach(function(z){ z.classList.add('locked'); });
    }
  };
};

/* ---------- fill in the blanks from a word bank (partial credit per blank) ---------- */
WIDGETS.fill = function(ex, box, ctl){
  var slots = ex.slots.map(function(s){ return { ans: s, chip: null }; });
  var bankWords = shuffle(ex.bank.map(function(w){ return { t: w, used: false }; }));
  var sentEl = el('div','fill-sent');
  var slotBtns = [];
  ex.sentence.split(/(\{s\d+\})/).forEach(function(p){
    var m = p.match(/^\{s(\d+)\}$/);
    if (m){
      var si = Number(m[1]);
      var b = el('button','slotbtn mono'); b.type = 'button';
      b.setAttribute('aria-label','Blank ' + (si + 1) + '. Click to empty this blank.');
      b.addEventListener('click', function(){
        if (slots[si].chip){ slots[si].chip.used = false; slots[si].chip = null; render(); }
      });
      slotBtns[si] = b;
      sentEl.appendChild(b);
    } else if (p){
      sentEl.appendChild(hv('span','', p));
    }
  });
  var bankEl = el('div','bank chips');
  function render(){
    slotBtns.forEach(function(b, si){
      b.textContent = slots[si].chip ? slots[si].chip.t : '[' + (si + 1) + ']';
      b.classList.toggle('filled', !!slots[si].chip);
    });
    bankEl.innerHTML = '';
    bankWords.forEach(function(w){
      if (w.used) return;
      var c = el('button','bank-chip'); c.type = 'button'; c.textContent = w.t;
      c.addEventListener('click', function(){
        if (w.used) return;
        var empty = -1, si;
        for (si = 0; si < slots.length; si++){ if (!slots[si].chip){ empty = si; break; } }
        if (empty === -1){
          var old = slots[0].chip;
          if (old) old.used = false;
          slots[0].chip = w; w.used = true;
        } else {
          slots[empty].chip = w; w.used = true;
        }
        render(); ctl.onReady();
      });
      bankEl.appendChild(c);
    });
    if (!bankEl.children.length) bankEl.appendChild(hv('span','dim','Word bank is empty \u2014 click a filled blank to put a word back.'));
  }
  box.appendChild(hv('div','mhint','Click a word to place it in the next empty blank. Click a filled blank to return its word to the bank.'));
  box.appendChild(sentEl);
  box.appendChild(bankEl);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      slots.forEach(function(s, i){
        if (!s.chip){ rows.push({ ok: 'm', text: 'Blank ' + (i + 1), note: 'Correct word: ' + s.ans }); }
        else if (s.chip.t === s.ans){ H++; rows.push({ ok: 'c', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: 'Correct word: ' + s.ans }); }
      });
      return { H: H, W: W, N: slots.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ sentEl.classList.add('locked'); bankEl.classList.add('locked'); }
  };
};

/* ---------- spot the flaw: flag lines (partial credit) ---------- */
WIDGETS.spot = function(ex, box, ctl){
  var flags = ex.lines.map(function(){ return false; });
  var list = el('div','lines');
  ex.lines.forEach(function(ln, i){
    var d = el('div','line');
    d.appendChild(el('span','flagmark','\u2691'));
    d.appendChild(hv('span','line-tx mono', ln.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Flag this line');
    function tog(){ flags[i] = !flags[i]; d.classList.toggle('flag', flags[i]); ctl.onReady(); }
    d.addEventListener('click', tog);
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } });
    list.appendChild(d);
  });
  box.appendChild(hv('div','mhint','Click a line to flag it. Click it again to unflag. Flag every line the question asks for.'));
  box.appendChild(list);
  var N = ex.lines.filter(function(l){ return l.bad; }).length;
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.lines.forEach(function(ln, i){
        var tx = stripTags(ln.t);
        if (ln.bad){
          if (flags[i]){ H++; rows.push({ ok: 'c', text: tx, note: ln.note || '' }); }
          else { rows.push({ ok: 'm', text: tx, note: ln.note || '' }); }
        } else if (flags[i]){
          W++; rows.push({ ok: 'w', text: tx, note: ln.note || 'This line is fine \u2014 it should not have been flagged.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- branching decision drill (each step is one scored item, graded at final Check) ---------- */
WIDGETS.branch = function(ex, box, ctl){
  var step = 0, picks = [];
  var wrap = el('div','branch');
  function renderStep(){
    wrap.innerHTML = '';
    if (step >= ex.steps.length){
      wrap.appendChild(hv('div','mhint','\u2713 All steps answered. Press Check to grade the whole exercise \u2014 the timer will pause for feedback.'));
      ctl.onReady();
      return;
    }
    var st = ex.steps[step];
    var card = el('div','step-card');
    card.appendChild(hv('div','step-chip','STEP ' + (step + 1) + ' OF ' + ex.steps.length));
    if (st.ctx) card.appendChild(hv('div','step-ctx', st.ctx));
    card.appendChild(hv('p','q-text', st.q));
    var opts = shuffle(st.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    var name = 'ex' + CURSEQ + '-st' + step;
    var ow = el('div','opts');
    var picked = -1;
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picked = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        btn.disabled = false;
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    var btn = el('button','btn'); btn.type = 'button';
    btn.textContent = 'Confirm step ' + (step + 1);
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (picked < 0) return;
      picks[step] = opts[picked];
      step++;
      renderStep();
    });
    card.appendChild(btn);
    wrap.appendChild(card);
  }
  renderStep();
  box.appendChild(hv('div','mhint','Answer every step. Intermediate confirms do not grade anything \u2014 everything is scored at the final Check.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.steps.forEach(function(st, i){
        var p = picks[i];
        if (!p){ rows.push({ ok: 'm', text: 'Step ' + (i + 1), note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
        else if (p.correct){ H++; rows.push({ ok: 'c', text: 'Step ' + (i + 1) + ': ' + p.t, note: st.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Step ' + (i + 1) + ': ' + p.t, note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
      });
      return { H: H, W: W, N: ex.steps.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- SOC triage queue: one decision per alert (partial credit per alert) ---------- */
WIDGETS.triage = function(ex, box, ctl){
  var wrap = el('div','triage');
  var picks = ex.alerts.map(function(){ return -1; });
  var optionSets = [];
  ex.alerts.forEach(function(a, ai){
    var card = el('div','alert-card');
    card.appendChild(hv('div','alert-title', a.title));
    if (a.html) card.appendChild(hv('div','alert-log', a.html));
    var opts = shuffle(a.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    optionSets.push(opts);
    var name = 'ex' + CURSEQ + '-al' + ai;
    var ow = el('div','opts');
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picks[ai] = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    wrap.appendChild(card);
  });
  box.appendChild(hv('div','mhint','Choose one action for every alert, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.alerts.forEach(function(a, ai){
        var p = picks[ai];
        if (p < 0){ rows.push({ ok: 'm', text: a.title, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
        else if (optionSets[ai][p].correct){ H++; rows.push({ ok: 'c', text: a.title, note: a.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: a.title + ' \u2014 chose: ' + optionSets[ai][p].t, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
      });
      return { H: H, W: W, N: ex.alerts.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- coverage board: one column choice per row (partial credit per row) ---------- */
WIDGETS.grid = function(ex, box, ctl){
  var wrap = el('div','gridt');
  var picks = ex.rows.map(function(){ return -1; });
  ex.rows.forEach(function(r, ri){
    var row = el('div','grid-row');
    row.appendChild(el('span','grid-tx', r.t));
    var togs = el('div','gtogs');
    ex.cols.forEach(function(c, ci){
      var b = el('button','gtog'); b.type = 'button'; b.textContent = c;
      b.setAttribute('aria-label', r.t + ' \u2014 choose ' + c);
      b.addEventListener('click', function(){
        picks[ri] = ci;
        Array.prototype.forEach.call(togs.querySelectorAll('.gtog'), function(n, k){
          n.classList.toggle('sel', k === ci);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      togs.appendChild(b);
    });
    row.appendChild(togs);
    wrap.appendChild(row);
  });
  box.appendChild(hv('div','mhint','Choose one column for every row, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.rows.forEach(function(r, ri){
        var p = picks[ri];
        if (p < 0){ rows.push({ ok: 'm', text: r.t, note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
        else if (p === r.col){ H++; rows.push({ ok: 'c', text: r.t + ' \u2014 ' + ex.cols[r.col], note: r.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: r.t + ' \u2014 ' + ex.cols[p], note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
      });
      return { H: H, W: W, N: ex.rows.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

</script>
