var INTRO = {"learn": "<p>This is the senior tier for <strong>M1035 — Limit Access to Resource Over Network</strong>, the ATT&CK <strong>mitigation</strong> that restricts access to network resources — file shares, remote systems, and services — to users, accounts, and systems with a legitimate business need. At this level the control is no longer a firewall line; it is a set of decisions with costs, conflicts, and evidence problems.</p><p>You will run the full spread of the page's coverage under pressure: the gateway-only RDP design (T1021.001, T1563.002), disabled administrative shares (T1021.002), the Kubernetes API with IP-range restriction and just-in-time access (T1609), the Docker API on TLS 2376 versus unauthenticated 2375 (T1612), the Instance Metadata API behind a host firewall (T1552.005), NAC and 802.1x for unregistered devices (T1200), static ARP entries and their scale caveat (T1557.002), TFTP restriction (T1542.005), and exposure reduction for public-facing services (T1190).</p><p>The exercises mirror senior work: a 23:47 incident where the EDR is blind and the firewall is not; a consultant's best practice that would break tonight's builds; an attribution question your control itself distorted; a settlement-window containment call where every option costs something. You will resolve conflicting signals explicitly, accept named costs, separate Covered from Gap from Unknown, and write residual-risk language a board can read. Several correct answers are 'verify first' or 'accept the cost' — the trap is always the confident-looking action.</p>", "keywords": [["Senior coverage audit", ["Covered vs Gap vs Unknown — evidence-based marking", "'Pending' and 'under review' are not coverage", "Absent documentation is unknown, not safe", "Row-anchored findings: technique + named fix"]], ["Conflicting signals & costs", ["Firewall denies vs a silent EDR agent — which evidence wins", "Absence of RDP attempts explained by the gateway-only design", "Containment that accepts a real business cost", "Rule-hit history as a triage artefact"]], ["Strategy & reporting", ["Reachability: the set of paths an attacker can try", "Residual risk over allowed paths (VPN door, CI registry)", "TTP overlap with stated confidence and named uplift", "Instrument the allowed paths — never remove a control to see more"]], ["Technique rows in play", ["T1021.001/.002, T1133, T1200, T1557.002, T1542.005", "T1563.002 and T1546.008 — gateway answers", "T1609/T1612/T1552.005 — cluster, Docker, and IMDS restrictions", "T1190 — exposure reduction, not patching"]]], "how": "<p><strong>Passing score.</strong> You need <strong>70%</strong>. Artefact sets carry realistic noise and deliberate gaps; at least one correct answer per drill is 'gather more evidence' or 'accept the cost'. Three options may look defensible — only one fits this world.</p><p><strong>Exercise types in this file.</strong> Multi-step incident drills (4 steps), a four-alert triage with declared noise, a senior coverage board with an Unknown column, ranking by value-per-effort, risk-register and report completion, rule-set flaw hunting, attribution framing, and cost-accepting choice questions.</p><p><strong>Timer.</strong> The countdown starts at <strong>55:00</strong>. <strong>Pause</strong> hides the exercise for a real break. <strong>Check</strong> stops the timer automatically for unlimited feedback review; it resumes on <strong>Next</strong>. Branch drills score all steps at the final Check only.</p><p><strong>Partial credit.</strong> Multi-part exercises score item by item: max(0, (H − W) / N). One hint per exercise costs 10% of that exercise's credit and restates a constraint — it never points at the answer.</p><p><strong>Skipping.</strong> Skip is free and never reveals the answer. Return to skipped exercises from the review screen while time remains; skipped-and-never-answered exercises are excluded from the score entirely.</p>"};
var EX = [{"type": "branch", "summary": "The 23:47 build-cluster incident", "text": "<p>You are the senior analyst on call. Five artefacts are on the screen, one of them is declared noise, and one answer is missing. The CISO needs decisions in minutes, not slides.</p>", "blocks": [{"label": "ARTEFACT 1 — Firewall denies (excerpt)", "html": "<pre class=\"log\"><span class=\"c-dim\">23:47–00:12</span>  <span class=\"c-no\">deny</span> <span class=\"c-ip\">10[.]40[.]6[.]18</span> <span class=\"c-dim\">(ENG-WS-071)</span> → 9 build hosts :<span class=\"c-num\">445</span>  <span class=\"c-dim\">×63 attempts</span></pre>"}, {"label": "ARTEFACT 2 — EDR console", "html": "<pre class=\"log\">ENG-WS-071  agent <span class=\"c-no\">offline since 23:30</span>  no telemetry since</pre>"}, {"label": "ARTEFACT 3 — CMDB", "html": "<pre class=\"log\">ENG-WS-071 · engineering VLAN · historical admin-share access to BLD-HV-01..03</pre>"}, {"label": "ARTEFACT 4 — Change calendar", "html": "<pre class=\"log\"><span class=\"c-warn\">00:30–02:00</span>  nightly build-farm sync · engineering VLAN · business-critical</pre>"}, {"label": "ARTEFACT 5 — Backup VLAN alerts (noise)", "html": "<pre class=\"log\"><span class=\"c-dim\">22:00–01:00</span>  1,988 deny lines, tcp/<span class=\"c-num\">873</span> → backup server <span class=\"c-dim\">(declared maintenance noise)</span></pre>"}], "question": "Answer all four steps — graded together at the final Check.", "hint": "Every step hands you two stories. Ask which one has evidence, and what each decision costs.", "steps": [{"ctx": "<p>Step 1 — the EDR agent went silent at 23:30, but the firewall shows 63 SMB denies since 23:47.</p>", "q": "Which interpretation do you act on?", "options": [{"t": "Act on the firewall evidence: attempts are real and ongoing; EDR silence means no visibility, not safety", "correct": true}, {"t": "Treat the host as clean because the EDR raised no alert"}, {"t": "Wait for the EDR agent to come back online before acting"}], "note": "Conflicting signals resolve in favour of the independent, still-alive telemetry."}, {"ctx": "<p>Step 2 — the CISO needs a containment decision now. The build-farm sync starts at 00:30.</p>", "q": "Which containment do you take?", "options": [{"t": "Isolate the engineering VLAN via ACL now and accept the sync delay", "correct": true}, {"t": "Quarantine only ENG-WS-071 and keep the VLAN up"}, {"t": "Shut down all nine build hosts"}], "note": "Admin-share reach to three hypervisors makes single-host quarantine insufficient — the real cost is accepted and named."}, {"ctx": "<p>Step 3 — threat intel says this actor 'uses RDP'. You see only SMB attempts.</p>", "q": "Resolve the contradiction.", "options": [{"t": "RDP was reachable only via the gateway from the jump network — the blocked path left no logs; absence of RDP attempts is explained by M1035", "correct": true}, {"t": "The intel is wrong; discard it"}, {"t": "The attacker only knows SMB, so attribution fails"}], "note": "State which signal wins and why the other one is missing."}, {"ctx": "<p>Step 4 — leadership wants to declare scope complete.</p>", "q": "What must you verify first?", "options": [{"t": "Review the allowed paths: which shares and hosts the account could reach, plus share-session and gateway logs", "correct": true}, {"t": "Announce the incident closed on the denies alone"}, {"t": "Re-image every machine that ever pinged the VLAN"}], "note": "An allowed-path review over optimism — denies alone never show where the attacker walked."}], "correct": "Firewall evidence wins; VLAN isolation with accepted cost; RDP absence explained; allowed-path review.", "explain": "This is the senior pattern in four moves. Resolve conflicting signals by evidence quality: firewall denies are independent of the dead EDR agent, so they carry the decision. Then take the containment that matches the demonstrated capability — admin-share reach toward three hypervisors means host-only quarantine is insufficient, so VLAN isolation and its real cost, the build-farm sync, is the defensible call. The RDP contradiction is resolved by the control itself: a gateway-only design means a blocked technique leaves no attempts. And scoping closes with an allowed-path review, because denies alone never prove where the attacker walked.", "study": "Evidence-based decisions under pressure and allowed-path reviews."}, {"type": "triage", "summary": "Four alerts, one of them is noise", "text": "<p>Four alerts wait in the senior queue. One artefact is declared noise. For the rest, weigh timing, design, and what a deny still teaches.</p>", "blocks": [{"label": "ARTEFACT 1 — Declared noise", "html": "<pre class=\"log\"><span class=\"c-dim\">Printer VLAN denies 01:00–04:00 — 3,412 lines, nightly purge job. Exclude from triage.</span></pre>"}], "question": "Choose the correct disposition for every alert.", "hint": "Ask what changed recently, what the design says, and what a deny still teaches.", "alerts": [{"title": "Alert A — deny burst: workstation cluster → jump host, tcp/3389", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> <span class=\"c-ip\">10[.]1[.]6[.]0/24</span> → <span class=\"c-ip\">10[.]9[.]0[.]5</span>:<span class=\"c-num\">3389</span>  <span class=\"c-dim\">×180, starts 10 min after a GPO allow-list change</span></pre>", "options": [{"t": "Process fault — the allow-list change broke a path; open a change back-out review", "correct": true}, {"t": "Attack in progress on the jump host"}, {"t": "Close as normal noise"}], "note": "Timing right after a change points to process, not attack."}, {"title": "Alert B — allowed RDP via the gateway at 03:00", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> via RDGW · user adm-netops · CHG-5842 \"gateway maintenance\", 02:30–04:00</pre>", "options": [{"t": "Benign — planned change on the managed path", "correct": true}, {"t": "Escalate as insider threat"}, {"t": "Block the gateway"}], "note": "A ticketed window on the allowed door is planned work."}, {"title": "Alert C — allowed SMB: service account, DC → file server", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> <span class=\"c-ip\">10[.]2[.]0[.]1</span> <span class=\"c-dim\">(svc-backup)</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">445</span>  <span class=\"c-dim\">nightly</span></pre>", "options": [{"t": "Verify schedule — a service path by design, but confirm it matches the backup window", "correct": true}, {"t": "Escalate as data theft"}, {"t": "Disable the account now"}], "note": "Allowed paths with a design reason deserve cheap verification, not panic."}, {"title": "Alert D — deny: pod → link-local metadata endpoint", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> <span class=\"c-ip\">10[.]30[.]7[.]44</span> <span class=\"c-dim\">(pod, ns=dev-sandbox)</span> → <span class=\"c-ip\">169[.]254[.]169[.]254</span>:<span class=\"c-num\">80</span></pre>", "options": [{"t": "Escalate — metadata API access from an unexpected namespace; check the node's host-firewall rules", "correct": true}, {"t": "Close — link-local traffic is always safe"}, {"t": "Close — the pod was denied anyway, nothing to learn"}], "note": "The deny worked (T1552.005), but the attempt names a gap worth chasing."}], "correct": "A process fault; B benign; C verify; D escalate despite the deny.", "explain": "Senior triage weighs timing and design. The 3389 burst follows a GPO change by ten minutes, so it is a process fault to back out, not an attack. The gateway session rides a ticketed window. The service-account SMB is by design, but verifying the window costs a minute and proves the baseline. The pod's metadata attempt was denied — the host firewall held — yet an unexpected namespace querying the Instance Metadata API is exactly the reconnaissance the page's T1552.005 row fears, so it escalates. And knowing that the printer deny wall is declared noise is part of the job.", "study": "Change-correlated alerts, service baselines, and IMDS denies."}, {"type": "mc", "summary": "The egress best practice meets the nightly feed", "text": "<p>A consultant recommends: 'Deny all outbound from the build VLAN except vendor update domains — effective tonight.' Two artefacts disagree with the timing, not the direction.</p>", "blocks": [{"label": "ARTEFACT 1 — Flow baseline (build VLAN)", "html": "<pre class=\"log\">nightly  CI → internal registry (TLS) · <span class=\"c-ok\">declared</span>\nnightly  pricing feed → SaaS behind <span class=\"c-warn\">rotating CDN IPs</span> · <span class=\"c-ok\">declared</span></pre>"}, {"label": "ARTEFACT 2 — Business note", "html": "<pre class=\"log\">base-image pulls and the pricing run are both <span class=\"c-warn\">business-critical, nightly</span></pre>"}], "question": "Which decision is defensible for tonight?", "hint": "The best practice is directionally right; the question is what it breaks tonight and what the baseline lets you scope.", "options": [{"t": "Defer the flat deny; implement a scoped allow-list per feed via the proxy with a change window", "correct": true}, {"t": "Apply the flat deny tonight and accept broken builds and pricing runs"}, {"t": "Keep monitor mode forever to avoid the risk"}, {"t": "Block the internal registry only — it is internal, not a vendor domain"}], "correct": "A scoped allow-list per destination identity, with a change window.", "explain": "The recommendation is a good end state, but applying it tonight breaks the internal registry pulls and the CDN-hosted pricing feed — and the flow baseline proves both are legitimate. The defensible move is the scoped version: allow-list by destination identity at the proxy, with a change window and rollback, using the baseline as evidence. Permanent monitor mode is not a control, and blocking the internal registry removes a needed and safer path. When a best practice meets a baseline, the baseline scopes the practice.", "study": "Allow-listing by destination identity versus flat denies."}, {"type": "grid", "summary": "Mapping audit with unknowns", "text": "<p>Quarterly control audit. Three artefacts are your entire evidence base. Mark each row Covered, Gap, or Unknown — the third column exists because honest audits need it.</p>", "blocks": [{"label": "ARTEFACT 1 — Rule list (excerpt)", "html": "<pre class=\"log\">VPN concentrator: MFA + device checks <span class=\"c-ok\">live</span>\nK8s API: admin CIDR + JIT <span class=\"c-ok\">live</span>\nadmin shares: GPO change <span class=\"c-warn\">pending approval</span>\nguest VLAN: 802[.]1x <span class=\"c-ok\">live</span></pre>"}, {"label": "ARTEFACT 2 — Architecture note", "html": "<pre class=\"log\">build hosts Docker API: <span class=\"c-warn\">under review</span>\nstatic ARP on core: <span class=\"c-dim\">no data from network team</span>\nTFTP: disabled on management VLANs <span class=\"c-warn\">only</span></pre>"}, {"label": "ARTEFACT 3 — IAM audit summary", "html": "<pre class=\"log\">share permission audit completed for <span class=\"c-warn\">finance shares only</span>\nIMDS host-firewall rules: <span class=\"c-no\">none evidenced on any node</span></pre>"}], "question": "Sort every row into Covered, Gap, or Unknown.", "hint": "Covered needs evidence. 'Pending' and 'under review' are not coverage. Absence of documentation is unknown, not safe.", "cols": ["Covered", "Gap", "Unknown"], "rows": [{"t": "T1133 External Remote Services", "col": 0, "note": "Concentrator with MFA and device checks is evidenced."}, {"t": "T1609 Container Administration Command", "col": 0, "note": "Admin CIDR plus JIT is evidenced."}, {"t": "T1021.002 SMB/Windows Admin Shares", "col": 1, "note": "GPO only pending — the exposure is measurable now."}, {"t": "T1200 Hardware Additions (guest VLAN)", "col": 0, "note": "802.1x is live in the guest VLAN."}, {"t": "T1612 Build Image on Host (Docker API)", "col": 2, "note": "'Under review' is not evidence — the state is unknown."}, {"t": "T1557.002 ARP Cache Poisoning", "col": 2, "note": "No switch-config evidence either way."}, {"t": "T1542.005 TFTP Boot", "col": 2, "note": "Management VLANs only — other VLANs are undocumented."}, {"t": "T1552.005 Cloud Instance Metadata API", "col": 1, "note": "No host-firewall rule evidenced on any node."}], "correct": "Three covered, two gaps, three unknowns.", "explain": "A senior audit separates three states. Covered needs artefacts: the concentrator, the Kubernetes CIDR-plus-JIT, and the live 802.1x qualify. Gap means evidence of exposure: the pending GPO across the estate and the absent IMDS host-firewall rules are measurable holes today. Unknown means you cannot tell — the 'under review' Docker API, the missing switch data for ARP, and TFTP documented only on management VLANs. Collapsing unknowns into 'fine' is how audits lie; each unknown here becomes a dated action item to fetch the missing evidence.", "study": "Covered versus gap versus unknown in control audits."}, {"type": "fill", "summary": "Insert the keywords in the board risk statement", "text": "<p>The board pack needs one precise paragraph on M1035. The near-misses in the bank would either overstate or undermine the control.</p>", "question": "Fill the three blanks.", "hint": "First blank: risk-speak for 'how often'. Second: paths the business keeps open. Third: the page's own monitoring word.", "sentence": "M1035 lowers the {s0} of lateral movement by shrinking the reachable set. Residual risk remains over {s1} paths — the VPN door and the CI registry — that the business must keep. Compensating visibility comes from {s2} of allowed and denied attempts, as the mitigation itself prescribes.", "slots": ["likelihood", "allowed", "logging"], "bank": ["likelihood", "allowed", "logging", "probability-free", "blocked", "encryption"], "correct": "likelihood … allowed … logging.", "explain": "Board language needs precision. The control reduces likelihood — it does not zero it — because allowed paths remain by design: the VPN door and the CI registry exist for the business. Those residual paths are where compensating visibility lives, and the mitigation itself prescribes logging of allowed and denied attempts as its monitoring measure. 'Blocked' is the trap: a board statement claiming the paths are blocked would misstate the design and unravel under the first audit question.", "study": "Residual risk over allowed paths."}, {"type": "branch", "summary": "The app owner, the flow, and the deadline", "text": "<p>The ZTNA-style microsegmentation rollout hits its first real conflict. Three decisions decide whether it lands as a control or a memorandum of surrender.</p>", "question": "Answer all three steps.", "hint": "Each step offers comfort. Choose the option that keeps evidence, scope, and a way back.", "steps": [{"ctx": "<p>The architecture team plans default-deny microsegmentation for the app VLAN. The app owner warns production will break and demands an exemption.</p>", "q": "What is the first evidence you bring to the negotiation?", "options": [{"t": "The flow baseline for the app VLAN, collected in monitor mode", "correct": true}, {"t": "A quotation from the architecture standard"}, {"t": "The app owner's email"}], "note": "Data beats opinion on both sides of the table."}, {"ctx": "<p>Monitor mode shows an undeclared nightly flow: tcp/10000 to a vendor backup host.</p>", "q": "What do you do with this flow?", "options": [{"t": "Add a scoped rule for the vendor host and port, with an owner and expiry, after confirming with the app owner", "correct": true}, {"t": "Allow the whole VLAN to any port 10000 to be safe"}, {"t": "Silently drop the flow and see if anyone complains"}], "note": "Scoped, confirmed, owned — or it becomes a shadow path."}, {"ctx": "<p>Leadership suggests staying in monitor mode 'until we are 100% sure'.</p>", "q": "What is the defensible rollout decision?", "options": [{"t": "Enforce during a change window with a rollback plan and deny-alert review; monitor mode forever is not a control", "correct": true}, {"t": "Stay in monitor mode indefinitely"}, {"t": "Enforce on Friday evening without a rollback plan"}], "note": "The 'wait for certainty' best practice is the wrong answer here."}], "correct": "Baseline evidence → scoped confirmed rule → enforce with rollback.", "explain": "The migration conflict is resolved with data: the flow baseline is the neutral evidence both sides accept. The undeclared vendor flow gets a scoped, owned, expiring rule after confirmation — the whole-VLAN allow and the silent drop are the two classic failures. And 'monitor until certain' is the best practice that must be broken: monitor mode without enforcement changes nothing, so the defensible path is a change window, a rollback plan, and deny review. This is exactly the negotiation a network engineer runs during a zero-trust rollout.", "study": "Monitor-mode exit criteria and exception scoping."}, {"type": "mc", "summary": "04:44 denies from ci-runner-07", "text": "<p>Firewall denies: SMB session attempts from ci-runner-07 toward the server VLAN, 04:44, nine targets, all blocked by the segmentation rules. The CI platform is mid-release; stopping it delays forty teams. One more artefact is available.</p>", "blocks": [{"label": "ARTEFACT 1 — Rule-hit history", "html": "<pre class=\"log\">last 4 Thursdays 04:44  <span class=\"c-no\">deny</span> ci-runner-03 → server VLAN :<span class=\"c-num\">445</span>  <span class=\"c-dim\">×9 targets each time</span></pre>"}], "question": "What is the correct next action?", "hint": "The control is holding and there is a repeating pattern in history. What does that make tonight's burst?", "options": [{"t": "Correlate with the platform owner and the Thursday pattern before touching the runner — the denies are already contained", "correct": true}, {"t": "Isolate ci-runner-07 immediately; the release can wait"}, {"t": "Re-image all CI runners as a precaution"}, {"t": "Declare a ransomware incident now"}], "correct": "Verify the pattern with the owner; containment already holds.", "explain": "The denies show the segmentation rules held — the attempts were contained. The Thursday 04:44 pattern from a sibling runner suggests a scheduled job reaching for shares, not a hands-on attacker. Isolating mid-release costs forty teams and may stop a legitimate but undocumented process; re-imaging and declaring ransomware are disproportionate without correlation. The senior move is a fifteen-minute check with the platform owner against the rule-hit history — then decide. Cost and evidence, not adrenaline, drive the call.", "study": "Rule-hit history as a triage artefact."}, {"type": "spot", "summary": "Audit the hardened rule set", "text": "<p>The 'hardened' rule set arrived from the vendor. Two lines must change, for two different reasons: one is too wide, one bypasses the managed door.</p>", "blocks": [{"label": "ARTEFACT 1 — Rule set (server segment)", "html": "<pre class=\"log\"><span class=\"c-dim\">1.</span> <span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]0/24</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">22</span>     <span class=\"c-dim\"># admin to Linux farm</span>\n<span class=\"c-dim\">2.</span> <span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]5</span> → <span class=\"c-ip\">10[.]20[.]1[.]9</span>:<span class=\"c-num\">3389</span>     <span class=\"c-dim\"># jump host to DC</span>\n<span class=\"c-dim\">3.</span> <span class=\"c-ok\">allow</span> ip  <span class=\"c-ip\">10[.]0[.]0[.]0/8</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">22</span>     <span class=\"c-dim\"># \"flexible admin access\"</span>\n<span class=\"c-dim\">4.</span> <span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]30[.]2[.]10</span> → <span class=\"c-ip\">10[.]20[.]3[.]1</span>:<span class=\"c-num\">2376</span>   <span class=\"c-dim\"># CI to registry, TLS</span>\n<span class=\"c-dim\">5.</span> <span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]30[.]2[.]10</span> → <span class=\"c-ip\">10[.]20[.]1[.]8</span>:<span class=\"c-num\">3389</span>   <span class=\"c-dim\"># CI runner direct RDP to build host</span>\n<span class=\"c-dim\">6.</span> <span class=\"c-no\">deny</span> ip  <span class=\"c-ip\">any</span> → <span class=\"c-ip\">any</span></pre>"}], "question": "Click the TWO lines that must change.", "hint": "One line is too wide for an admin path; one lets a machine impersonate an admin user.", "lines": [{"t": "1. allow tcp 10[.]9[.]0[.]0/24 → 10[.]20[.]1[.]5:22     # admin to Linux farm"}, {"t": "2. allow tcp 10[.]9[.]0[.]5 → 10[.]20[.]1[.]9:3389     # jump host to DC"}, {"t": "3. allow ip 10[.]0[.]0[.]0/8 → 10[.]20[.]1[.]5:22     # “flexible admin access”", "bad": true, "note": "A /8-wide admin SSH path — it shadows line 1 and defeats the gateway model."}, {"t": "4. allow tcp 10[.]30[.]2[.]10 → 10[.]20[.]3[.]1:2376   # CI to registry, TLS"}, {"t": "5. allow tcp 10[.]30[.]2[.]10 → 10[.]20[.]1[.]8:3389   # CI runner direct RDP to build host", "bad": true, "note": "Direct RDP from a CI runner bypasses the gateway-only design."}, {"t": "6. deny ip any → any"}], "correct": "Line 3 (the /8 SSH allow) and line 5 (the CI-runner direct RDP).", "explain": "The /8-wide SSH allow turns a scoped admin path into company-wide admin access and makes the earlier scoped line decorative; the deny that should follow it never fires. The CI runner's direct RDP to the build host bypasses the gateway-only design the page prescribes for RDP — and machines do not need interactive desktops. The registry line on 2376 with TLS is the healthy pattern. Two flaws, two different failure modes: width and bypass.", "study": "Shadowing by width; bypassing the managed door."}, {"type": "match", "summary": "Match each finding to the risk it names", "text": "<p>Four findings from the assessment need to become risk statements for the steering group. Each must carry its technique row and the page's own counter.</p>", "question": "Match each finding to the risk statement it supports.", "hint": "Three findings are network paths; one is an API reachable without a login.", "pairs": [{"l": "Contractor VPN profile grants full tunnel to the LAN", "r": "A contractor device can reach internal remote services directly — external-remote-services exposure (T1133)", "note": "Device, identity, and time restrictions are the page's answer."}, {"l": "Guest VLAN can reach the file servers", "r": "Unregistered devices have a path into the trust zone (T1200)", "note": "NAC with 802.1x and DHCP registration closes it."}, {"l": "Flat layer-2 with no static ARP on the core", "r": "ARP poisoning is feasible inside the segment (T1557.002)", "note": "The page's counter carries a scale caveat."}, {"l": "Docker API on 2375 without authentication", "r": "Container control commands are reachable without identity (T1609/T1612)", "note": "TLS 2376 or a local socket is the fix."}], "correct": "Each finding names its row and its fix.", "explain": "Findings become risks when welded to a technique row and a named fix: full-tunnel contractors to T1133 and its device, identity, and time restrictions; guest reach to T1200 and 802.1x plus DHCP registration; flat layer-2 to T1557.002 with static ARP and its scale caveat; the unauthenticated Docker API to T1609/T1612 and TLS 2376 or a local socket. Risk statements that skip the row read as opinions; statements that carry the row and the page's own counter are decisions a CISO can approve.", "study": "Turning findings into row-anchored risk statements."}, {"type": "order", "summary": "Rank the four proposals by value per effort", "text": "<p>The steering group funds one initiative this quarter. The evidence: admin shares enabled fleet-wide; contractor VPN full tunnel; the K8s API already scoped with JIT; no egress allow-list; a segmentation project already funded for next year.</p>", "question": "Rank the proposals from highest to 'use strict';
/* ================= M1035 exam engine — core ================= */
var CURSEQ = 0;

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined && txt !== null) e.textContent = txt; return e; }
function hv(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined && html !== null) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtClock(sec){ var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function stripTags(s){ var d = document.createElement('div'); d.innerHTML = s; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }

/* ---------- state ---------- */
var S = null;
var CUR = { idx: -1, widget: null, checked: false };
function freshState(){
  var order = [], i;
  for (i = 0; i < EX.length; i++) order.push(i);
  return { order: shuffle(order), cur: 0, rIdx: -1, answered: {}, credit: {}, skipped: [], hintUsed: {},
           reviewReturn: false, autoActive: false, phase: 'intro',
           timer: { state: 'IDLE', remaining: META.timerSeconds, manualSec: 0, autoSec: 0 } };
}
function curIdx(){ return S.reviewReturn ? S.rIdx : S.order[S.cur]; }

/* ---------- views ---------- */
function showView(name){
  ['intro','exam','review','results'].forEach(function(v){
    var node = $(v);
    if (node) node.classList.toggle('hidden', v !== name);
  });
}

/* ---------- timer state machine: IDLE / RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
var tickHandle = null;
function startTimer(){ if (tickHandle) clearInterval(tickHandle); tickHandle = setInterval(onTick, 1000); }
function onTick(){
  if (!S) return;
  var t = S.timer;
  if (t.state === 'RUNNING'){
    t.remaining--;
    if (t.remaining <= 0){ t.remaining = 0; renderHeader(); timerEnded(); return; }
  } else if (t.state === 'PAUSED_MANUAL'){ t.manualSec++; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ t.autoSec++; }
  renderHeader();
}
function setTimerState(st){ if (!S) return; S.timer.state = st; renderHeader(); }
function timerEnded(){
  S.timer.state = 'ENDED'; renderHeader();
  if (S.phase === 'exam' || S.phase === 'review'){ finishExam(true); }
}

/* ---------- header ---------- */
function renderHeader(){
  var total = EX.length;
  var idx = Math.min(S.cur + 1, total);
  $('hCount').textContent = 'Exercise ' + idx + ' of ' + total;
  var b = $('hSev'); b.textContent = META.severity; b.className = 'badge ' + META.sevClass;
  var t = S.timer;
  $('hTimer').textContent = fmtClock(t.remaining);
  var st = $('hTState');
  if (t.state === 'RUNNING'){ st.textContent = '\u25B6 RUNNING'; st.className = 'chip c-run'; }
  else if (t.state === 'PAUSED_MANUAL'){ st.textContent = '\u23F8 PAUSED \u2014 manual (press Resume)'; st.className = 'chip c-paused'; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ st.textContent = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.className = 'chip c-paused'; }
  else if (t.state === 'ENDED'){ st.textContent = '\u25A0 ENDED'; st.className = 'chip c-ended'; }
  else { st.textContent = '\u2014 not started'; st.className = 'chip c-ended'; }
  var answered = 0, sum = 0, k;
  for (k in S.answered){ if (S.answered[k]){ answered++; sum += S.credit[k]; } }
  var sc = $('hScore');
  if (answered > 0){
    var pct = Math.round((sum / answered) * 100);
    sc.textContent = sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + pct + '%';
  } else { sc.textContent = '0.0 / 0 \u00B7 \u2014'; }
  var prog = S.phase === 'results' ? total : Math.max(0, S.cur);
  $('hBar').style.width = (total ? (prog / total) * 100 : 0) + '%';
  var canPause = (t.state === 'RUNNING' || t.state === 'PAUSED_AUTO_CHECK') && S.phase === 'exam';
  $('hPause').disabled = !canPause;
}

/* ---------- intro ---------- */
function buildIntro(){
  var v = $('intro'); v.innerHTML = '';
  v.appendChild(hv('section','card intro-head',
    '<h1>' + META.introTitle + '</h1>' +
    '<div class="obj">' + META.objLine + '</div>' +
    '<div class="facts">' +
      '<span class="badge ' + META.sevClass + '">' + META.severity + '</span>' +
      '<span>' + EX.length + ' exercises</span>' +
      '<span>Estimated time: ' + META.estimatedMinutes + ' minutes</span>' +
      '<span>Timer budget: ' + fmtClock(META.timerSeconds) + '</span>' +
      '<span>Pass mark: ' + META.passMark + '%</span>' +
    '</div><div id="hWho" class="who"></div>'));
  v.appendChild(hv('section','card','<h2>What you will learn here</h2>' + INTRO.learn));
  var kw = ['<h2>Keywords covered in this exam</h2>'];
  INTRO.keywords.forEach(function(th){
    kw.push('<div class="kw-theme"><h3>' + th[0] + '</h3><ul>');
    th[1].forEach(function(c){ kw.push('<li>' + c + '</li>'); });
    kw.push('</ul></div>');
  });
  v.appendChild(hv('section','card', kw.join('')));
  var how = hv('section','card','<h2>How this exam works</h2>' + INTRO.how);
  var startWrap = el('div','startwrap');
  var btn = el('button','btn primary start','\u25B6 Start exam');
  btn.id = 'startBtn'; btn.type = 'button';
  btn.addEventListener('click', startExam);
  startWrap.appendChild(btn);
  how.appendChild(startWrap);
  v.appendChild(how);
}

/* ---------- exam flow ---------- */
function startExam(){
  S.phase = 'exam';
  showView('exam');
  setTimerState('RUNNING');
  startTimer();
  renderExercise();
}

function renderExercise(){ renderExerciseAt(curIdx()); }

function renderExerciseAt(idx){
  CURSEQ++;
  CUR.idx = idx; CUR.checked = false; CUR.widget = null;
  var ex = EX[idx];
  var area = $('exArea'); area.innerHTML = '';
  var art = el('article','ex');
  if (S.reviewReturn){
    art.appendChild(hv('div','review-banner','\u26A0 Returned from the skipped list \u2014 answer it now, or press Skip again to leave it unanswered.'));
  }
  /* SCENARIO block */
  var scen = el('section','block scenario');
  var sb = hv('div','bh bh-scen','<span class="bicon">\u25B8</span> SCENARIO');
  var tog = el('button','mini'); tog.type = 'button'; tog.textContent = 'Hide';
  tog.addEventListener('click', function(){
    var c = scen.classList.toggle('collapsed');
    tog.textContent = c ? 'Show' : 'Hide';
  });
  sb.appendChild(tog);
  scen.appendChild(sb);
  scen.appendChild(hv('div','sc-summary mono', ex.summary));
  var body = el('div','sc-body');
  if (ex.text) body.appendChild(hv('div','prose', ex.text));
  (ex.blocks || []).forEach(function(b){
    var p = el('div','art');
    p.appendChild(hv('div','art-label mono', b.label));
    p.appendChild(hv('div','art-body', b.html));
    body.appendChild(p);
  });
  scen.appendChild(body);
  art.appendChild(scen);
  /* QUESTION block */
  var q = el('section','block question');
  q.appendChild(hv('div','bh bh-q','<span class="bicon">?</span> QUESTION'));
  q.appendChild(hv('div','bbody q-text', ex.question));
  art.appendChild(q);
  /* YOUR ANSWER block */
  var a = el('section','block answer');
  a.appendChild(hv('div','bh bh-a','<span class="bicon">\u270E</span> YOUR ANSWER'));
  var box = el('div','bbody');
  a.appendChild(box);
  var hint = hv('div','hint hidden',''); hint.id = 'hintPanel';
  a.appendChild(hint);
  art.appendChild(a);
  /* FEEDBACK block */
  var fb = el('section','block feedback hidden'); fb.id = 'fbBlock';
  fb.appendChild(hv('div','bh','<span id="fbHead"></span>'));
  var fbBody = el('div','bbody'); fbBody.id = 'fbBody';
  fb.appendChild(fbBody);
  art.appendChild(fb);
  /* actions */
  var act = el('div','actions');
  var c = el('button','btn primary'); c.id = 'btnCheck'; c.type = 'button'; c.textContent = 'Check';
  c.addEventListener('click', onCheck);
  var n = el('button','btn primary hidden'); n.id = 'btnNext'; n.type = 'button'; n.textContent = 'Next \u25B8';
  n.addEventListener('click', onNext);
  var f = el('button','btn danger hidden'); f.id = 'btnFinal'; f.type = 'button'; f.textContent = 'Final Submit \u2713';
  f.addEventListener('click', onFinalSubmit);
  act.appendChild(c); act.appendChild(n); act.appendChild(f);
  art.appendChild(act);
  area.appendChild(art);
  /* widget */
  CUR.widget = WIDGETS[ex.type](ex, box, { onReady: function(){ if (!CUR.checked) $('btnCheck').disabled = false; } });
  $('btnCheck').disabled = true;
  $('btnNext').classList.add('hidden');
  $('btnFinal').classList.add('hidden');
  $('fbBlock').classList.add('hidden');
  $('hSkip').disabled = false;
  $('hHint').disabled = !!S.hintUsed[idx];
  $('hPause').textContent = '\u23F8 Pause';
  renderHeader();
}

function onCheck(){
  if (!CUR.widget || CUR.checked) return;
  var idx = curIdx(); var ex = EX[idx];
  var r = CUR.widget.grade();
  var N = r.N || 1;
  var credit = Math.max(0, (r.H - r.W) / N);
  if (S.hintUsed[idx]) credit = Math.max(0, credit - 0.10);
  CUR.checked = true;
  S.autoActive = true;
  setTimerState('PAUSED_AUTO_CHECK'); /* pause first — feedback renders into the paused state */
  if (CUR.widget.lock) CUR.widget.lock();
  S.credit[idx] = credit; S.answered[idx] = true;
  S.skipped = S.skipped.filter(function(x){ return x !== idx; });
  renderFeedback(ex, r, credit, N);
  $('btnCheck').classList.add('hidden');
  var last = (!S.reviewReturn) && (S.cur >= S.order.length - 1);
  if (last){ $('btnFinal').classList.remove('hidden'); }
  else { $('btnNext').classList.remove('hidden'); }
  $('hSkip').disabled = true;
  $('hHint').disabled = true;
  renderHeader();
  try { $('fbBlock').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

function renderFeedback(ex, r, credit, N){
  var fb = $('fbBlock'); fb.classList.remove('hidden');
  var head = $('fbHead');
  var cls, label;
  if (credit >= 0.999){ cls = 'v-correct'; label = '\u2713 CORRECT'; }
  else if (credit > 0){ cls = 'v-partial'; label = '\u2713 PARTIALLY CORRECT'; }
  else { cls = 'v-incorrect'; label = '\u2717 INCORRECT'; }
  head.className = cls; head.textContent = label;
  var body = $('fbBody'); body.innerHTML = '';
  if (N > 1){
    body.appendChild(hv('div','credit-line', 'credit ' + credit.toFixed(2) + ' \u2014 ' + r.H + '/' + N + ' items \u00B7 formula: max(0, (H \u2212 W) / N) with H=' + r.H + ' correct, W=' + r.W + ' wrong'));
  }
  if (r.correctText){ body.appendChild(hv('div','correct-line','<strong>Correct answer:</strong> ' + r.correctText)); }
  (r.rows || []).forEach(function(row){
    var d = el('div','fb-row');
    var ic, wrd, c2;
    if (row.ok === 'c'){ ic = '\u2713'; wrd = 'Correct'; c2 = 'ic-ok'; }
    else if (row.ok === 'w'){ ic = '\u2717'; wrd = 'Wrong'; c2 = 'ic-no'; }
    else { ic = '\u25CB'; wrd = 'Missed'; c2 = 'ic-miss'; }
    d.appendChild(hv('span','fb-ic ' + c2, ic + ' ' + wrd));
    d.appendChild(hv('span','fb-tx', row.text + (row.note ? ' \u2014 ' + row.note : '')));
    body.appendChild(d);
  });
  body.appendChild(hv('div','explain', ex.explain));
  if (credit < 0.999 && ex.study){ body.appendChild(hv('div','study','<strong>Study next:</strong> ' + ex.study)); }
}

function onNext(){
  if (!CUR.checked) return;
  if (S.reviewReturn){
    S.reviewReturn = false; S.autoActive = false;
    setTimerState('RUNNING');
    openReview();
    return;
  }
  S.autoActive = false;
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else {
    S.cur++; setTimerState('RUNNING'); renderExercise();
  }
}
function onFinalSubmit(){
  if (S.skipped.length){ openReview(); return; } /* review skipped exercises before finishing */
  finishExam(false);
}

function onSkip(){
  if (CUR.checked) return;
  var idx = curIdx();
  if (S.skipped.indexOf(idx) === -1) S.skipped.push(idx); /* never list an exercise twice */
  if (S.reviewReturn){ S.reviewReturn = false; openReview(); return; }
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else { S.cur++; renderExercise(); } /* timer keeps running through a skip */
}

function onHint(){
  var idx = curIdx();
  if (S.hintUsed[idx] || CUR.checked) return;
  S.hintUsed[idx] = true;
  var hp = $('hintPanel');
  hp.innerHTML = '<strong>Hint used \u2014 10% of this exercise credit will be deducted.</strong><br>' + EX[idx].hint;
  hp.classList.remove('hidden');
  $('hHint').disabled = true;
  renderHeader();
}

function onPause(){
  if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK') return;
  $('pauseOverlay').classList.remove('hidden');
  $('exArea').classList.add('hidden');
  $('hPause').textContent = '\u25B6 Resume';
  setTimerState('PAUSED_MANUAL');
}
function onResume(){
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  $('hPause').textContent = '\u23F8 Pause';
  setTimerState(S.autoActive ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase = 'review'; S.autoActive = false;
  showView('review');
  setTimerState('RUNNING'); /* timer resumes on the review screen */
  var v = $('review'); v.innerHTML = '';
  v.appendChild(hv('section','card','<h2>\u26A0 Review skipped exercises</h2>' +
    '<p>Time left on the timer: <strong class="mono">' + fmtClock(S.timer.remaining) + '</strong>. ' +
    'You can go back to any skipped exercise and answer it while time is left. ' +
    'Skipped exercises you never answer are excluded from the score \u2014 they count as neither correct nor wrong.</p>'));
  if (!S.skipped.length){
    v.appendChild(hv('section','card','<p>\u2713 No skipped exercises left.</p>'));
  } else {
    var card = el('section','card');
    S.skipped.forEach(function(idx){
      var row = el('div','rv-row');
      row.appendChild(hv('span','rv-warn','\u26A0 Skipped'));
      row.appendChild(hv('span','rv-tx', EX[idx].summary));
      var b = el('button','btn'); b.type = 'button'; b.textContent = 'Answer';
      b.addEventListener('click', function(){ reviewAnswer(idx); });
      row.appendChild(b);
      card.appendChild(row);
    });
    v.appendChild(card);
  }
  var sub = el('section','card');
  var sb = el('button','btn primary'); sb.type = 'button'; sb.textContent = 'Submit exam';
  sb.addEventListener('click', function(){ finishExam(false); });
  sub.appendChild(sb);
  v.appendChild(sub);
}
function reviewAnswer(idx){
  S.reviewReturn = true; S.rIdx = idx; S.phase = 'exam';
  showView('exam');
  renderExerciseAt(idx);
}

/* ---------- results ---------- */
function resRow(cls, label, txt){
  var d = el('div','fb-row');
  d.appendChild(hv('span','fb-ic ' + cls, label));
  d.appendChild(hv('span','fb-tx', txt));
  return d;
}
function finishExam(byTimeout){
  S.phase = 'results';
  S.timer.state = 'ENDED';
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  var answered = 0, sum = 0, fully = 0, partial = 0, partialSum = 0, wrong = 0, k;
  for (k in S.answered){
    if (!S.answered[k]) continue;
    answered++;
    var c = S.credit[k]; sum += c;
    if (c >= 0.999) fully++;
    else if (c > 0){ partial++; partialSum += c; }
    else wrong++;
  }
  var skippedN = S.skipped.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= META.passMark;
  showView('results');
  renderHeader();
  var v = $('results'); v.innerHTML = '';
  v.appendChild(hv('section','card res-head',
    '<h2>Results \u2014 ' + META.introTitle + '</h2>' +
    '<div class="res-score mono">' + sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + percent + '%</div>' +
    (byTimeout ? '<p class="res-note">\u23F1 Time is up. Unanswered exercises were excluded from the score.</p>' : '') +
    '<div class="res-verdict ' + (passed ? 'v-correct' : 'v-incorrect') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<p>' + (passed
      ? 'Well done. You reached the ' + META.passMark + '% pass mark on this exam.'
      : 'You did not reach the ' + META.passMark + '% pass mark this time. Read the feedback themes below, study the pointers, and retake the exam.') + '</p>'));
  var br = el('section','card');
  br.appendChild(hv('h2','','Score breakdown'));
  br.appendChild(resRow('ic-ok','\u2713 Fully correct', fully + ' exercise' + (fully === 1 ? '' : 's') + ' (credit = 1.0)'));
  br.appendChild(resRow('ic-partial','\u2713 Partially correct', partial + ' exercise' + (partial === 1 ? '' : 's') + (partial ? ' (avg partial credit ' + (partialSum / partial).toFixed(2) + ')' : '')));
  br.appendChild(resRow('ic-no','\u2717 Fully incorrect', wrong + ' exercise' + (wrong === 1 ? '' : 's') + ' (credit = 0)'));
  br.appendChild(resRow('ic-miss','\u26A0 Skipped \u2014 excluded', skippedN + ' exercise' + (skippedN === 1 ? '' : 's') + ' (not counted in numerator or denominator)'));
  var ms = S.timer.manualSec, as = S.timer.autoSec;
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 manual breaks', Math.floor(ms / 60) + ' min ' + (ms % 60) + ' s'));
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 feedback review', Math.floor(as / 60) + ' min ' + (as % 60) + ' s'));
  v.appendChild(br);
  var rc = el('section','card');
  var rb = el('button','btn primary'); rb.type = 'button'; rb.textContent = '\u21BB Retake exam';
  rb.addEventListener('click', retake);
  rc.appendChild(rb);
  v.appendChild(rc);
  reportScore(sum, answered);
}
function retake(){
  S = freshState();
  startExam();
}

/* ---------- site integration ---------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username, country, theme ('dark' \u2014 this file is dark-only), locale, topicId, batch */
  var n = event.data.username || '', c = event.data.country || '';
  var w = $('hWho');
  if (w && (n || c)) { w.textContent = 'Signed in as ' + n + (c ? ' (' + c + ')' : ''); }
});

  buildIntro();
  showView('intro');
  $('hPause').addEventListener('click', onPause);
  $('hHint').addEventListener('click', onHint);

}
document.addEventListener('DOMContentLoaded', init);

/* ================= M1035 exam engine — widgets ================= */
var WIDGETS = {};

function correctOf(st){ var o = st.options.filter(function(x){ return x.correct; })[0]; return o ? o.t : ''; }

/* ---------- single-choice ---------- */
WIDGETS.mc = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, oi: i }; }));
  var name = 'ex' + CURSEQ + '-mc';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var sel = null;
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) sel = opts[Number(inp.value)];
      });
      var corr = opts.filter(function(o){ return o.correct; })[0];
      var H = (sel && sel.correct) ? 1 : 0;
      var W = (sel && !sel.correct) ? 1 : 0;
      var rows;
      if (sel && sel.correct){ rows = [{ ok: 'c', text: sel.t, note: ex.answerNote || '' }]; }
      else if (sel){ rows = [{ ok: 'w', text: 'You chose: ' + sel.t, note: 'The correct answer is: ' + corr.t + (ex.answerNote ? ' \u2014 ' + ex.answerNote : '') }]; }
      else { rows = [{ ok: 'm', text: corr.t, note: ex.answerNote || '' }]; }
      return { H: H, W: W, N: 1, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- multi-select (partial credit) ---------- */
WIDGETS.multi = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, note: o.note || '', oi: i }; }));
  var name = 'ex' + CURSEQ + '-mu';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'checkbox'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var picked = [];
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) picked.push(opts[Number(inp.value)]);
      });
      var H = 0, W = 0, N = 0, rows = [];
      opts.forEach(function(o){
        if (!o.correct) return;
        N++;
        var isSel = picked.some(function(p){ return p.oi === o.oi; });
        if (isSel){ H++; rows.push({ ok: 'c', text: o.t, note: o.note }); }
        else { rows.push({ ok: 'm', text: o.t, note: o.note || 'This item belongs in the correct answer.' }); }
      });
      picked.forEach(function(p){
        if (!p.correct){
          W++;
          rows.push({ ok: 'w', text: p.t, note: p.note || 'This option is not part of the correct answer.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match = function(ex, box, ctl){
  var left = ex.pairs.map(function(p){ return { t: p.l }; });
  var right = shuffle(ex.pairs.map(function(p, i){ return { t: p.r, ri: i }; }));
  var map = {}; var selL = -1;
  var gridEl = el('div','pair-cols');
  var lcol = el('div','pcol'); var rcol = el('div','pcol');
  var lrows = [], rrows = [];
  function render(){
    lrows.forEach(function(lr, i){
      var m = map[i];
      lr.querySelector('.msub').textContent = (m === undefined) ? '\u2192 click a partner on the right' : '\u2192 ' + right[m].t;
      lr.classList.toggle('sel', selL === i);
      lr.classList.toggle('paired', m !== undefined);
    });
    rrows.forEach(function(rr, j){
      var taken = Object.keys(map).some(function(k){ return map[k] === j; });
      rr.classList.toggle('used', taken);
    });
  }
  ex.pairs.forEach(function(p, i){
    var lr = el('div','mrow');
    lr.appendChild(el('span','olab',(i + 1) + '.'));
    lr.appendChild(el('span','otext', left[i].t));
    lr.appendChild(el('span','msub mono',''));
    lr.tabIndex = 0;
    lr.setAttribute('role','button');
    lr.setAttribute('aria-label','Match item ' + (i + 1) + ': ' + left[i].t);
    function clickL(){
      if (map[i] !== undefined){ delete map[i]; selL = -1; }
      else { selL = (selL === i ? -1 : i); }
      render(); ctl.onReady();
    }
    lr.addEventListener('click', clickL);
    lr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickL(); } });
    lrows.push(lr); lcol.appendChild(lr);
  });
  right.forEach(function(r, j){
    var rr = el('div','mrow');
    rr.appendChild(el('span','olab', String.fromCharCode(65 + j) + '.'));
    rr.appendChild(el('span','otext', r.t));
    rr.tabIndex = 0;
    rr.setAttribute('role','button');
    rr.setAttribute('aria-label','Candidate partner: ' + r.t);
    function clickR(){ if (selL >= 0){ map[selL] = j; selL = -1; render(); ctl.onReady(); } }
    rr.addEventListener('click', clickR);
    rr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickR(); } });
    rrows.push(rr); rcol.appendChild(rr);
  });
  gridEl.appendChild(lcol); gridEl.appendChild(rcol);
  box.appendChild(hv('div','mhint','Click an item on the left, then click its partner on the right. Click a paired left item again to clear it.'));
  box.appendChild(gridEl);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.pairs.forEach(function(p, i){
        var m = map[i];
        if (m === undefined){
          rows.push({ ok: 'm', text: left[i].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        } else if (right[m].ri === i){
          H++; rows.push({ ok: 'c', text: left[i].t + ' \u2192 ' + p.r, note: p.note || '' });
        } else {
          W++; rows.push({ ok: 'w', text: left[i].t + ' \u2192 ' + right[m].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        }
      });
      return { H: H, W: W, N: ex.pairs.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ gridEl.classList.add('locked'); }
  };
};

/* ---------- ordering (partial credit per position) ---------- */
WIDGETS.order = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it, i){ return { t: it.t, note: it.note || '', ci: i }; }));
  var list = el('div','ord-list');
  function render(){
    Array.prototype.slice.call(list.querySelectorAll('.ord-item')).forEach(function(n){ list.removeChild(n); });
    items.forEach(function(it, pos){
      var row = el('div','ord-item');
      row.appendChild(el('span','ord-pos mono', String(pos + 1)));
      row.appendChild(el('span','otext', it.t));
      var up = el('button','ord-btn'); up.type = 'button'; up.textContent = '\u2191'; up.setAttribute('aria-label','Move up');
      var dn = el('button','ord-btn'); dn.type = 'button'; dn.textContent = '\u2193'; dn.setAttribute('aria-label','Move down');
      up.addEventListener('click', function(){
        if (pos > 0){ var t = items[pos - 1]; items[pos - 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      dn.addEventListener('click', function(){
        if (pos < items.length - 1){ var t = items[pos + 1]; items[pos + 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  box.appendChild(hv('div','mhint','Put the steps in the right order. Use the arrows to move a step up or down.'));
  box.appendChild(list);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it, pos){
        if (pos === it.ci){ H++; rows.push({ ok: 'c', text: (pos + 1) + '. ' + it.t, note: it.note }); }
        else { W++; rows.push({ ok: 'w', text: (pos + 1) + '. ' + it.t, note: 'Correct position: ' + (it.ci + 1) + '. ' + it.note }); }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- drag & drop into zones (partial credit per item) ---------- */
WIDGETS.dd = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it){ return { t: it.t, zone: it.zone, note: it.note || '', placed: -1 }; }));
  var sel = -1;
  var bank = el('div','bank');
  var zonesWrap = el('div','zones');
  var zoneEls = ex.zones.map(function(z){
    var zd = el('div','zone');
    zd.appendChild(hv('h4','', z));
    zd.appendChild(el('div','zone-items'));
    return zd;
  });
  function paintSel(){
    Array.prototype.forEach.call(document.querySelectorAll('.ditem'), function(n){ n.classList.remove('sel'); });
  }
  function itemEl(it, i){
    var d = el('div','ditem');
    d.appendChild(el('span','otext', it.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Item: ' + it.t);
    d.setAttribute('draggable','true');
    d.addEventListener('click', function(){
      if (it.placed !== -1){ it.placed = -1; paintSel(); sel = -1; render(); ctl.onReady(); return; }
      sel = (sel === i ? -1 : i);
      paintSel();
      if (sel === i) d.classList.add('sel');
    });
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); } });
    d.addEventListener('dragstart', function(e){ sel = i; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} });
    return d;
  }
  function render(){
    bank.innerHTML = '';
    items.forEach(function(it, i){ if (it.placed === -1) bank.appendChild(itemEl(it, i)); });
    zoneEls.forEach(function(zd, z){
      var zi = zd.querySelector('.zone-items'); zi.innerHTML = '';
      items.forEach(function(it, i){ if (it.placed === z) zi.appendChild(itemEl(it, i)); });
    });
  }
  function dropOn(z){
    if (sel === -1) return;
    items[sel].placed = z; sel = -1; paintSel(); render(); ctl.onReady();
  }
  zoneEls.forEach(function(zd, z){
    zd.addEventListener('click', function(e){
      if (e.target === zd || e.target.classList.contains('zone-items') || e.target.tagName === 'H4') dropOn(z);
    });
    zd.addEventListener('dragover', function(e){ e.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop', function(e){ e.preventDefault(); zd.classList.remove('over'); dropOn(z); });
  });
  zoneEls.forEach(function(zd){ zonesWrap.appendChild(zd); });
  box.appendChild(hv('div','mhint','Click an item to select it, then click a column to place it. Click a placed item to send it back.'));
  box.appendChild(bank);
  box.appendChild(zonesWrap);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it){
        if (it.placed === -1){
          rows.push({ ok: 'm', text: it.t, note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        } else if (it.placed === it.zone){
          H++; rows.push({ ok: 'c', text: it.t + ' \u2192 ' + ex.zones[it.zone], note: it.note });
        } else {
          W++; rows.push({ ok: 'w', text: it.t + ' \u2192 ' + ex.zones[it.placed], note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){
      bank.classList.add('locked');
      zoneEls.forEach(function(z){ z.classList.add('locked'); });
    }
  };
};

/* ---------- fill in the blanks from a word bank (partial credit per blank) ---------- */
WIDGETS.fill = function(ex, box, ctl){
  var slots = ex.slots.map(function(s){ return { ans: s, chip: null }; });
  var bankWords = shuffle(ex.bank.map(function(w){ return { t: w, used: false }; }));
  var sentEl = el('div','fill-sent');
  var slotBtns = [];
  ex.sentence.split(/(\{s\d+\})/).forEach(function(p){
    var m = p.match(/^\{s(\d+)\}$/);
    if (m){
      var si = Number(m[1]);
      var b = el('button','slotbtn mono'); b.type = 'button';
      b.setAttribute('aria-label','Blank ' + (si + 1) + '. Click to empty this blank.');
      b.addEventListener('click', function(){
        if (slots[si].chip){ slots[si].chip.used = false; slots[si].chip = null; render(); }
      });
      slotBtns[si] = b;
      sentEl.appendChild(b);
    } else if (p){
      sentEl.appendChild(hv('span','', p));
    }
  });
  var bankEl = el('div','bank chips');
  function render(){
    slotBtns.forEach(function(b, si){
      b.textContent = slots[si].chip ? slots[si].chip.t : '[' + (si + 1) + ']';
      b.classList.toggle('filled', !!slots[si].chip);
    });
    bankEl.innerHTML = '';
    bankWords.forEach(function(w){
      if (w.used) return;
      var c = el('button','bank-chip'); c.type = 'button'; c.textContent = w.t;
      c.addEventListener('click', function(){
        if (w.used) return;
        var empty = -1, si;
        for (si = 0; si < slots.length; si++){ if (!slots[si].chip){ empty = si; break; } }
        if (empty === -1){
          var old = slots[0].chip;
          if (old) old.used = false;
          slots[0].chip = w; w.used = true;
        } else {
          slots[empty].chip = w; w.used = true;
        }
        render(); ctl.onReady();
      });
      bankEl.appendChild(c);
    });
    if (!bankEl.children.length) bankEl.appendChild(hv('span','dim','Word bank is empty \u2014 click a filled blank to put a word back.'));
  }
  box.appendChild(hv('div','mhint','Click a word to place it in the next empty blank. Click a filled blank to return its word to the bank.'));
  box.appendChild(sentEl);
  box.appendChild(bankEl);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      slots.forEach(function(s, i){
        if (!s.chip){ rows.push({ ok: 'm', text: 'Blank ' + (i + 1), note: 'Correct word: ' + s.ans }); }
        else if (s.chip.t === s.ans){ H++; rows.push({ ok: 'c', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: 'Correct word: ' + s.ans }); }
      });
      return { H: H, W: W, N: slots.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ sentEl.classList.add('locked'); bankEl.classList.add('locked'); }
  };
};

/* ---------- spot the flaw: flag lines (partial credit) ---------- */
WIDGETS.spot = function(ex, box, ctl){
  var flags = ex.lines.map(function(){ return false; });
  var list = el('div','lines');
  ex.lines.forEach(function(ln, i){
    var d = el('div','line');
    d.appendChild(el('span','flagmark','\u2691'));
    d.appendChild(hv('span','line-tx mono', ln.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Flag this line');
    function tog(){ flags[i] = !flags[i]; d.classList.toggle('flag', flags[i]); ctl.onReady(); }
    d.addEventListener('click', tog);
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } });
    list.appendChild(d);
  });
  box.appendChild(hv('div','mhint','Click a line to flag it. Click it again to unflag. Flag every line the question asks for.'));
  box.appendChild(list);
  var N = ex.lines.filter(function(l){ return l.bad; }).length;
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.lines.forEach(function(ln, i){
        var tx = stripTags(ln.t);
        if (ln.bad){
          if (flags[i]){ H++; rows.push({ ok: 'c', text: tx, note: ln.note || '' }); }
          else { rows.push({ ok: 'm', text: tx, note: ln.note || '' }); }
        } else if (flags[i]){
          W++; rows.push({ ok: 'w', text: tx, note: ln.note || 'This line is fine \u2014 it should not have been flagged.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- branching decision drill (each step is one scored item, graded at final Check) ---------- */
WIDGETS.branch = function(ex, box, ctl){
  var step = 0, picks = [];
  var wrap = el('div','branch');
  function renderStep(){
    wrap.innerHTML = '';
    if (step >= ex.steps.length){
      wrap.appendChild(hv('div','mhint','\u2713 All steps answered. Press Check to grade the whole exercise \u2014 the timer will pause for feedback.'));
      ctl.onReady();
      return;
    }
    var st = ex.steps[step];
    var card = el('div','step-card');
    card.appendChild(hv('div','step-chip','STEP ' + (step + 1) + ' OF ' + ex.steps.length));
    if (st.ctx) card.appendChild(hv('div','step-ctx', st.ctx));
    card.appendChild(hv('p','q-text', st.q));
    var opts = shuffle(st.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    var name = 'ex' + CURSEQ + '-st' + step;
    var ow = el('div','opts');
    var picked = -1;
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picked = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        btn.disabled = false;
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    var btn = el('button','btn'); btn.type = 'button';
    btn.textContent = 'Confirm step ' + (step + 1);
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (picked < 0) return;
      picks[step] = opts[picked];
      step++;
      renderStep();
    });
    card.appendChild(btn);
    wrap.appendChild(card);
  }
  renderStep();
  box.appendChild(hv('div','mhint','Answer every step. Intermediate confirms do not grade anything \u2014 everything is scored at the final Check.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.steps.forEach(function(st, i){
        var p = picks[i];
        if (!p){ rows.push({ ok: 'm', text: 'Step ' + (i + 1), note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
        else if (p.correct){ H++; rows.push({ ok: 'c', text: 'Step ' + (i + 1) + ': ' + p.t, note: st.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Step ' + (i + 1) + ': ' + p.t, note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
      });
      return { H: H, W: W, N: ex.steps.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- SOC triage queue: one decision per alert (partial credit per alert) ---------- */
WIDGETS.triage = function(ex, box, ctl){
  var wrap = el('div','triage');
  var picks = ex.alerts.map(function(){ return -1; });
  var optionSets = [];
  ex.alerts.forEach(function(a, ai){
    var card = el('div','alert-card');
    card.appendChild(hv('div','alert-title', a.title));
    if (a.html) card.appendChild(hv('div','alert-log', a.html));
    var opts = shuffle(a.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    optionSets.push(opts);
    var name = 'ex' + CURSEQ + '-al' + ai;
    var ow = el('div','opts');
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picks[ai] = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    wrap.appendChild(card);
  });
  box.appendChild(hv('div','mhint','Choose one action for every alert, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.alerts.forEach(function(a, ai){
        var p = picks[ai];
        if (p < 0){ rows.push({ ok: 'm', text: a.title, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
        else if (optionSets[ai][p].correct){ H++; rows.push({ ok: 'c', text: a.title, note: a.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: a.title + ' \u2014 chose: ' + optionSets[ai][p].t, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
      });
      return { H: H, W: W, N: ex.alerts.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- coverage board: one column choice per row (partial credit per row) ---------- */
WIDGETS.grid = function(ex, box, ctl){
  var wrap = el('div','gridt');
  var picks = ex.rows.map(function(){ return -1; });
  ex.rows.forEach(function(r, ri){
    var row = el('div','grid-row');
    row.appendChild(el('span','grid-tx', r.t));
    var togs = el('div','gtogs');
    ex.cols.forEach(function(c, ci){
      var b = el('button','gtog'); b.type = 'button'; b.textContent = c;
      b.setAttribute('aria-label', r.t + ' \u2014 choose ' + c);
      b.addEventListener('click', function(){
        picks[ri] = ci;
        Array.prototype.forEach.call(togs.querySelectorAll('.gtog'), function(n, k){
          n.classList.toggle('sel', k === ci);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      togs.appendChild(b);
    });
    row.appendChild(togs);
    wrap.appendChild(row);
  });
  box.appendChild(hv('div','mhint','Choose one column for every row, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.rows.forEach(function(r, ri){
        var p = picks[ri];
        if (p < 0){ rows.push({ ok: 'm', text: r.t, note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
        else if (p === r.col){ H++; rows.push({ ok: 'c', text: r.t + ' \u2014 ' + ex.cols[r.col], note: r.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: r.t + ' \u2014 ' + ex.cols[p], note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
      });
      return { H: H, W: W, N: ex.rows.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
