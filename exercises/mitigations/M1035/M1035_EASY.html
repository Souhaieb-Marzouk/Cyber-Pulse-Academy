<script>
var META = {"topicId": "m1035", "batch": 1, "title": "M1035 Limit Access to Resource Over Network — EASY", "difficulty": "easy", "questionCount": 15, "estimatedMinutes": 25, "passMark": 70, "timerSeconds": 1500, "severity": "EASY", "sevClass": "sev-easy", "introTitle": "M1035 — EASY practice exam", "objLine": "M1035 — Limit Access to Resource Over Network · MITRE ATT&CK Mitigation (Enterprise)"};
var INTRO = {"learn": "<p>You will learn about <strong>M1035 — Limit Access to Resource Over Network</strong>. In MITRE ATT&CK, this kind of object is called a <strong>mitigation</strong>. A mitigation is a defensive action. It describes how defenders can stop or slow down specific attacker behaviours. ATT&CK uses <strong>techniques</strong> to describe what attackers do, and mitigations to describe what defenders can do about it. That is the role M1035 plays in the framework: it is the defensive side of the matrix.</p><p>M1035 has one simple goal: only people and systems with a real work reason can reach network resources. Network resources are things like file shares, remote systems, and services. Everyone else is blocked. The ATT&CK page turns this goal into five measures you will practise here: <strong>audit and restrict access</strong> (least privilege, checked regularly); <strong>secure remote access</strong> (RDP gateways, VPN concentrators, ZTNA — one managed door with MFA); <strong>disable unnecessary services</strong> (find them with Nmap, switch off Telnet and old SMB); <strong>network segmentation</strong> (VLANs, firewalls, micro-segmentation so subnets cannot talk freely); and <strong>monitor and log access</strong> (the SIEM records allowed and denied attempts).</p><p>You will also meet the real jobs where this object appears. A network engineer writes the firewall and VLAN rules. A SOC analyst reads the deny lines and tickets what matters. An IAM or GRC analyst audits who can reach a share and keeps the evidence for auditors. The tools you will see by name: Nmap, the Windows Group Policy Editor, iptables, AccessEnum, Microsoft RD Gateway, Apache Guacamole, and pfSense.</p><p>Why does this matter? Because attackers need quiet paths. If they cannot reach a remote service, they cannot use it to jump from computer to computer. That movement is called lateral movement, and limiting network access is one of the strongest ways to slow it down.</p>", "keywords": [["Identity & purpose", ["M1035 — Limit Access to Resource Over Network", "Object type: Mitigation (a defensive action in ATT&CK)", "Least privilege: only legitimate business need gets access", "Preventive control — it stops access before it happens", "Allow-list thinking with a default block"]], ["Implementation measures from the page", ["Measure 1 — Audit and restrict access (permissions reviews)", "Measure 2 — Deploy secure remote access (RDP gateway, VPN concentrator, ZTNA, MFA)", "Measure 3 — Disable unnecessary services (Telnet, legacy SMB)", "Measure 4 — Network segmentation and isolation (VLANs, firewalls, micro-segmentation)", "Measure 5 — Monitor and log access (SIEM; allowed AND denied attempts)"]], ["Named tools", ["Nmap — find running services", "Group Policy Editor — disable SMBv1 and Telnet on Windows", "iptables / firewalld — block unused traffic on Linux", "AccessEnum — audit file share permissions", "Microsoft RD Gateway and Apache Guacamole — managed remote access doors", "pfSense — network isolation"]], ["Techniques addressed (first look)", ["T1021 Remote Services", "T1021.001 Remote Desktop Protocol", "T1021.002 SMB/Windows Admin Shares", "T1133 External Remote Services"]], ["Everyday signals", ["Allow and deny lines in firewall logs", "Port 3389 (RDP), port 445 (SMB), port 23 (Telnet)", "The jump host — one watched path for admin work", "Lateral movement — attackers jumping between computers"]]], "how": "<p><strong>Passing score.</strong> You need <strong>70%</strong> to pass. PASS means you have mastered the basics of M1035 at this level. FAIL means you should read the feedback and retake the exam — retaking is free and the questions and answers will be shuffled.</p><p><strong>Exercise types in this file.</strong> Short choice questions, matching pairs, word-bank fill-ins, drag-and-drop sorting, step ordering, click-the-line log reading, and a mini alert queue. Everything runs on this page — nothing outside is needed.</p><p><strong>Timer.</strong> The countdown starts at <strong>25:00</strong>. Press <strong>Pause</strong> to take a real break — the exercise hides until you press Resume. When you press <strong>Check</strong>, the timer stops automatically so you can read the feedback without pressure. It starts again when you press <strong>Next</strong>.</p><p><strong>Partial credit.</strong> Exercises with several parts (matching, sorting, queues) are scored part by part: each correct part adds credit, each wrong part removes some. Selecting everything to be safe gives you zero. One <strong>hint</strong> is allowed per exercise — it costs 10% of that exercise's credit.</p><p><strong>Skipping.</strong> You can skip any exercise and come back to it later, as long as time is left. Skipped exercises you never answer are excluded from the score — they count as neither correct nor wrong.</p>"};
var EX = [{"type": "mc", "summary": "What kind of ATT&CK object is M1035?", "text": "<p>You open the ATT&CK page for M1035. Before reading further, you want to know what kind of object it is, because that decides how you read the page.</p>", "question": "What kind of ATT&CK object is M1035?", "hint": "ATT&CK keeps two big families of objects: ones that describe what attackers do, and ones that describe what defenders can do about it.", "options": [{"t": "Mitigation", "correct": true}, {"t": "Technique"}, {"t": "Tactic"}, {"t": "Group"}], "correct": "M1035 is a Mitigation.", "answerNote": "A mitigation is a defensive action linked to the techniques it helps stop.", "explain": "M1035 is a mitigation. A mitigation is a defensive action that ATT&CK links to the techniques it helps stop. Techniques such as T1021 Remote Services describe attacker behaviour, tactics describe attacker goals, and groups describe threat actors. Knowing the object type tells you how to read the page: here you look for the techniques this control helps stop. That is exactly what the rest of this exam practises.", "study": "The four ATT&CK object families: techniques, tactics, mitigations, groups."}, {"type": "mc", "summary": "M1035 in one plain sentence", "text": "<p>A colleague asks you what M1035 is for. You answer in one plain sentence, close to the way the ATT&CK page words it.</p>", "question": "Which sentence matches the goal of M1035?", "hint": "Think about who may open a door — not about encryption times, email rules, or software updates.", "options": [{"t": "Only users and systems with a real work need can reach shares, remote systems, and services", "correct": true}, {"t": "Only encrypted traffic may leave the company network at night."}, {"t": "Only administrators may open emails on the mail server."}, {"t": "Only new software updates may run inside the server room."}], "correct": "Only users and systems with a legitimate business need can reach the resources.", "explain": "The ATT&CK page says M1035 restricts access to network resources — file shares, remote systems, and services — to users, accounts, or systems with a legitimate business requirement. The other sentences talk about encryption windows, email rules, or updates, which are different controls entirely. M1035 is about who and what can reach a resource over the network. Holding this one sentence in your head makes every other exercise here easier.", "study": "The one-line description at the top of the M1035 page."}, {"type": "match", "summary": "Match the resource to its plain meaning", "text": "<p>The M1035 page lists the resource types it protects: file shares, remote systems, services, and the tools used to reach them. New SOC staff often mix the names up, so you practise the plain meanings.</p>", "question": "Match each resource on the left to its plain meaning on the right.", "hint": "Think about the everyday job of each word: a folder, a computer, a piece of software, a listening program.", "pairs": [{"l": "File share", "r": "A shared folder on the network", "note": "Many users store and open files there together."}, {"l": "Remote system", "r": "Another computer you control over the network", "note": "You reach it with remote desktop or SSH."}, {"l": "Remote access tool", "r": "Software to work on a machine from far away", "note": "The page names RD Gateway and Apache Guacamole."}, {"l": "Network service", "r": "A program that waits for and answers network requests", "note": "It listens on a port, like a web service on 443."}], "correct": "Each resource pairs with its plain meaning as listed.", "explain": "These four words appear everywhere on the M1035 page, so you must read them fast. A file share is a shared folder. A remote system is another computer you control across the network. A remote access tool is software for working from far away — the page names RD Gateway and Guacamole. A network service is a listening program. Once you can name the resource, you can also name who should be allowed to reach it, and that is the heart of M1035.", "study": "Re-read the first paragraph of the M1035 description and name one real example of each resource at your workplace."}, {"type": "fill", "summary": "Complete the access policy sentence", "text": "<p>You help write the first draft of the access policy that will implement M1035 for the file servers. The sentence must carry the two core ideas of the control.</p>", "question": "Fill both blanks with the words that complete the policy sentence.", "hint": "The first word means 'for a real work reason'. The second word is what happens to traffic when no rule allows it.", "sentence": "Only staff with a {s0} business need may reach the file servers. All other network access is {s1} by default.", "slots": ["legitimate", "blocked"], "bank": ["legitimate", "blocked", "random", "welcome", "invisible"], "correct": "legitimate … blocked.", "explain": "The ATT&CK page says access is limited to users, accounts, or systems with a legitimate business requirement, so 'legitimate' fills the first blank. Everything not allowed must be blocked by default, so 'blocked' fills the second blank. This pair of ideas — documented need plus default block — is the core of least privilege on a network. If the sentence allowed random or welcome access, the control would not exist at all.", "study": "The phrase 'legitimate business requirement' in the M1035 description."}, {"type": "dd", "summary": "Sort four actions: is this part of M1035?", "text": "<p>Your team brainstorms actions for the quarterly control review. Someone pastes four sticky notes into the shared board. You sort them before the meeting starts.</p>", "question": "Drag each action to the correct column.", "hint": "For each note ask: does it limit who can reach a resource over the network?", "zones": ["Part of M1035", "A different control"], "items": [{"t": "Allow RDP to servers only from the admin jump host", "zone": 0, "note": "Restricting who reaches remote services is exactly M1035."}, {"t": "Switch off the old Telnet service on legacy hosts", "zone": 0, "note": "'Disable Unnecessary Services' is a named M1035 measure."}, {"t": "Send a fake phishing email to test staff", "zone": 1, "note": "Phishing tests belong to awareness training, not M1035."}, {"t": "Scan a USB stick for malware before use", "zone": 1, "note": "USB scanning is a malware control, not a network access limit."}], "correct": "The two access-limiting actions belong to M1035; the phishing test and USB scan do not.", "explain": "M1035 collects the controls that limit network access to resources. Allowing RDP only from a jump host and disabling old services are named measures on the page. The phishing test trains people and the USB scan checks files — neither changes who can reach a resource over the network. Sorting actions this way is a real daily task for a control owner, and it keeps both the control description and the audit evidence honest.", "study": "The implementation measures list on the M1035 page."}, {"type": "order", "summary": "Order the three steps of a network allow-list check", "text": "<p>A trainee asks what actually happens to a connection when a company uses allow-list rules. You show the three steps in order.</p>", "question": "Put the three steps in the order they happen.", "hint": "Start with the moment a connection arrives, and end with what happens when no rule matches.", "items": [{"t": "A connection arrives at the file server", "note": "Every check starts with incoming traffic."}, {"t": "The firewall compares the connection to the allow rules", "note": "The rules say who may reach which resource."}, {"t": "No rule allows it, so the connection is blocked", "note": "Default deny is the M1035 mindset."}], "correct": "Arrive → compare to the allow rules → block if no rule matches.", "explain": "An allow-list works in this order: traffic arrives, the firewall compares it with the allow rules, and anything no rule allows is blocked. This is the opposite of a deny-list, which allows everything unless a rule says no. M1035 works best as an allow-list with a default block, because the page asks teams to define which access is legitimate. Blocked attempts still appear in the logs, which is useful evidence for defenders.", "study": "Allow-list versus deny-list thinking."}, {"type": "fill", "summary": "Name the service-finding tool from the page", "text": "<p>Before you can switch off unnecessary services, you must find them. The M1035 page names tools for exactly this job.</p>", "question": "Fill the blank with the tool the page names for finding running services.", "hint": "It is the same tool penetration testers use to scan ports.", "sentence": "The page suggests using {s0} to identify running services before disabling the unused ones.", "slots": ["Nmap"], "bank": ["Nmap", "Guacamole", "pfSense", "AccessEnum"], "correct": "Nmap.", "explain": "The 'Disable Unnecessary Services' measure on the M1035 page names netstat and Nmap for identifying running services. Guacamole is a remote access gateway, pfSense builds network isolation, and AccessEnum audits share permissions — all useful, none of them find services. Finding services first matters because you cannot safely block what you have not inventoried. This is also why service inventories appear in almost every segmentation project.", "study": "The 'Tools for Implementation' list on the M1035 page."}, {"type": "spot", "summary": "Find the blocked remote-desktop attempt in the log", "text": "<p>You watch the firewall log for the file-server VLAN. The design says only admin hosts may use remote desktop to these servers. Three lines scroll past.</p>", "blocks": [{"label": "ARTEFACT 1 — Firewall log excerpt", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]1[.]5[.]24</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">443</span>\n<span class=\"c-no\">deny</span>  tcp <span class=\"c-ip\">10[.]1[.]7[.]11</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">3389</span>\n<span class=\"c-ok\">allow</span> udp <span class=\"c-ip\">10[.]1[.]5[.]24</span> → <span class=\"c-ip\">10[.]2[.]0[.]1</span>:<span class=\"c-num\">53</span></pre>"}], "question": "Click the line that shows a BLOCKED remote-desktop attempt.", "hint": "Remote desktop uses TCP port 3389, and a blocked attempt starts with the word deny.", "lines": [{"t": "allow tcp 10[.]1[.]5[.]24 → 10[.]2[.]0[.]10:443"}, {"t": "deny tcp 10[.]1[.]7[.]11 → 10[.]2[.]0[.]10:3389", "bad": true, "note": "Port 3389 is RDP, and 'deny' means the rule stopped it."}, {"t": "allow udp 10[.]1[.]5[.]24 → 10[.]2[.]0[.]1:53"}], "correct": "The deny line on port 3389.", "explain": "Remote desktop listens on TCP port 3389. The line that starts with deny and ends with 3389 is the blocked attempt — exactly what a working M1035 allow-list should produce. The other two lines are allowed web traffic on 443 and a DNS lookup on 53, both normal. Reading allow and deny in a firewall log is a basic SOC skill, and deny lines are your proof that the control actually works.", "study": "Common ports: 3389 RDP, 445 SMB, 22 SSH, 443 HTTPS."}, {"type": "mc", "summary": "What does a remote desktop gateway do?", "text": "<p>Your company wants one safe door for remote desktop instead of many open paths. The M1035 page suggests a gateway. A colleague asks what the gateway actually does.</p>", "question": "What is the main job of a remote desktop gateway in M1035?", "hint": "One door that everyone must use — so defenders only have to watch and harden one place.", "options": [{"t": "Be the one managed door that all remote desktop connections pass through", "correct": true}, {"t": "Store all user passwords in one safe file"}, {"t": "Delete old logs from the remote servers"}, {"t": "Make the remote desktop pictures load faster"}], "correct": "A gateway is the single managed door for remote desktop connections.", "explain": "The page names RDP gateways — like Microsoft RD Gateway or Apache Guacamole — to aggregate and secure remote access connections. One door means one place to configure rules, enforce MFA, and log attempts. Password storage, log deletion, and picture speed are not the gateway's job. Centralising the door is also why the page suggests gateways against techniques like RDP session hijacking (T1563.002) later in your training.", "study": "'Deploy Secure Remote Access Solutions' on the M1035 page."}, {"type": "mc", "summary": "Is M1035 preventive, detective, or corrective?", "text": "<p>In a GRC meeting someone asks what kind of control M1035 is. You give the standard control-family answer, then explain in one sentence.</p>", "question": "M1035 is mainly which kind of control?", "hint": "Ask first: does the control stop the action, watch the action, or fix the result?", "options": [{"t": "Preventive — it stops unwanted access before it happens", "correct": true}, {"t": "Detective — it only finds problems after they happen"}, {"t": "Corrective — it repairs damage after an attack"}, {"t": "Recovery — it restores files from a backup"}], "correct": "Preventive — it stops unwanted access before it happens.", "explain": "A firewall rule that blocks a connection stops the attack path before anything happens, and that is what preventive means. Detective controls watch and alert, corrective ones repair, and recovery ones restore. M1035's main effect is blocking, so it is preventive. The page also asks teams to monitor and log access, which adds a small detective layer on top, but the core control stays preventive. Knowing the family helps you combine controls sensibly: prevention plus detection plus recovery.", "study": "Control families: preventive, detective, corrective, recovery."}, {"type": "match", "summary": "Match each M1035 measure to a real example", "text": "<p>The M1035 page groups its work into implementation measures. Your team writes one concrete example line for each measure to use in the control document.</p>", "question": "Match each measure to its matching example.", "hint": "Look for the verb: separate, reach through one door, switch off, record.", "pairs": [{"l": "Network segmentation and isolation", "r": "User PCs and servers sit on separate VLANs", "note": "Separating subnets stops easy lateral movement."}, {"l": "Deploy secure remote access", "r": "Staff reach the inside network through one VPN door with MFA", "note": "Concentrators and ZTNA centralise the door."}, {"l": "Disable unnecessary services", "r": "Telnet and old SMBv1 are switched off", "note": "Unused listeners shrink the attack surface."}, {"l": "Monitor and log access", "r": "The SIEM records allowed and denied share attempts", "note": "The page asks for successes AND failures."}], "correct": "Each measure pairs with its example as authored.", "explain": "The five measures on the page turn M1035 into real work. Segmentation separates VLANs; secure remote access centralises the door and adds MFA; disabling services removes Telnet and SMBv1; monitoring records allowed and denied attempts. Note that the page explicitly asks to log failed attempts too — denied traffic shows both attacks and misconfigurations. Writing one concrete example per measure, like you did here, is exactly how a control owner documents the control for an audit.", "study": "The five implementation measures on the M1035 page."}, {"type": "dd", "summary": "Which tool does which job?", "text": "<p>The M1035 page names several tools. You label the four boxes in the team toolbox so everyone picks the right one.</p>", "question": "Drag each job onto the tool that does it.", "hint": "One tool scans, one blocks ports on Linux, one changes Windows settings in bulk, one audits share permissions.", "zones": ["Nmap", "iptables", "Group Policy Editor", "AccessEnum"], "items": [{"t": "Find which services are running on hosts", "zone": 0, "note": "Scanning identifies running services."}, {"t": "Block unused ports on a Linux host", "zone": 1, "note": "The page names iptables for blocking unnecessary traffic."}, {"t": "Disable SMBv1 and Telnet on many Windows machines at once", "zone": 2, "note": "Group Policy applies settings across the Windows estate."}, {"t": "Audit who has permissions on a file share", "zone": 3, "note": "The page names AccessEnum for access auditing."}], "correct": "Each job belongs to its named tool.", "explain": "The page's tool list matches jobs one to one: Nmap finds running services, iptables blocks unused traffic on Linux, the Group Policy Editor disables SMBv1 and Telnet across Windows machines, and AccessEnum audits file share permissions. Matching the tool to the job is a daily task for network and platform engineers. It also prevents the classic mistake of trying to audit permissions with a port scanner.", "study": "The 'Tools for Implementation' section of the M1035 page."}, {"type": "fill", "summary": "Complete the allow rule and the default", "text": "<p>You write the first firewall rule for the new file-server VLAN. Admin hosts may use remote desktop; everything else must fail closed.</p>", "question": "Fill both blanks to finish the rule.", "hint": "The remote desktop port again — and the last word describes what happens when no rule matches.", "sentence": "allow tcp/{s0} from admin VLAN to file-server VLAN — every other connection is denied by {s1}.", "slots": ["3389", "default"], "bank": ["3389", "default", "445", "random"], "correct": "3389 … default.", "explain": "The rule allows TCP port 3389, which is remote desktop, from the admin VLAN and relies on the default deny for everything else. Port 445 is SMB, used for file sharing, not remote desktop. The word 'default' matters most: the safety of an allow-list lives in the deny that fires when no rule matches. This pattern — one scoped allow plus a default deny — is the smallest real M1035 rule you can write.", "study": "Writing a scoped allow rule with an explicit default deny."}, {"type": "triage", "summary": "Mini alert queue: blocked or not blocked?", "text": "<p>You cover the SOC queue for one hour. Three events appear. For each one, decide whether an M1035-style network rule blocked it.</p>", "question": "For each event, choose the correct classification.", "hint": "Look for the word deny in the logs. For the email, ask what kind of event it is.", "alerts": [{"title": "Event A", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> tcp <span class=\"c-ip\">10[.]1[.]9[.]20</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">445</span></pre>", "options": [{"t": "Blocked by a network rule", "correct": true}, {"t": "Not blocked by a network rule"}], "note": "The word deny means the rule stopped it — port 445 is SMB."}, {"title": "Event B", "html": "<p>A user opens a phishing email and types a password into a fake login page.</p>", "options": [{"t": "Blocked by a network rule"}, {"t": "Not blocked by a network rule", "correct": true}], "note": "M1035 does not read emails or catch typed passwords."}, {"title": "Event C", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> tcp <span class=\"c-ip\">10[.]7[.]3[.]4</span> → <span class=\"c-ip\">10[.]2[.]0[.]15</span>:<span class=\"c-num\">23</span></pre>", "options": [{"t": "Blocked by a network rule", "correct": true}, {"t": "Not blocked by a network rule"}], "note": "Port 23 is Telnet — denied by the rule that switched it off at the border."}], "correct": "A and C are blocked attempts; B is not a network access event.", "explain": "Events A and C carry deny lines — one on SMB port 445 and one on Telnet port 23 — so the network rules blocked both. Event B is a phishing email; M1035 does not inspect emails or catch typed passwords, so nothing about this control blocked it. Separating network-access events from other event types is the first triage skill a SOC analyst needs. It also tells you which team should own the ticket.", "study": "Which events M1035 can and cannot block."}, {"type": "mc", "summary": "Why does the page ask to log access attempts?", "text": "<p>Your team turns on logging for the new rules. A colleague asks why the page insists on logging failed attempts too, since 'nothing happened anyway'.</p>", "question": "Why does M1035 ask teams to log both allowed and denied attempts?", "hint": "Think about what a defender learns from a pile of denied connections.", "options": [{"t": "So defenders can see both successful and failed tries to reach restricted resources", "correct": true}, {"t": "So the firewall runs faster with fewer rules"}, {"t": "So the logs can replace the need for backups"}, {"t": "So users get an automatic email about their mistakes"}], "correct": "Monitoring covers successful and failed attempts, fed to a SIEM.", "explain": "The 'Monitor and Log Access' measure says to enable auditing for successful and failed attempts to reach restricted resources, using SIEM tooling. Allowed logs show normal use; denied logs show attacks and broken settings — both are worth reading. Speed, backups, and user emails are not the goal. This logging is also the bridge to detection work: deny spikes on 3389 or 445 become detections and hunt ideas later in your training.", "study": "'Monitor and Log Access' on the M1035 page."}];

function fmtClock(sec){ var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* ---------- timer state machine: IDLE / RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
var tickHandle = null;

/* ---------- header ---------- */
function renderHeader(){
  var total = EX.length;
  var idx = Math.min(S.cur + 1, total);
  $('hCount').textContent = 'Exercise ' + idx + ' of ' + total;
  var b = $('hSev'); b.textContent = META.severity; b.className = 'badge ' + META.sevClass;

  $('hTimer').textContent = fmtClock(t.remaining);

  else if (t.state === 'PAUSED_AUTO_CHECK'){ st.textContent = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.className = 'chip c-paused'; }
  else if (t.state === 'ENDED'){ st.textContent = '\u25A0 ENDED'; st.className = 'chip c-ended'; }
  else { st.textContent = '\u2014 not started'; st.className = 'chip c-ended'; }
  var answered = 0, sum = 0, k;

    sc.textContent = sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + pct + '%';
  } else { sc.textContent = '0.0 / 0 \u00B7 \u2014'; }
  var prog = S.phase === 'results' ? total : Math.max(0, S.cur);
  $('hBar').style.width = (total ? (prog / total) * 100 : 0) + '%';
  var canPause = (t.state === 'RUNNING' || t.state === 'PAUSED_AUTO_CHECK') && S.phase === 'exam';
  $('hPause').disabled = !canPause;
}

/* ---------- intro ---------- */

/* ---------- exam flow ---------- */
function startExam(){
  S.phase = 'exam';
  showView('exam');
  setTimerState('RUNNING');
  startTimer();
  renderExercise();
}

function renderExercise(){ renderExerciseAt(curIdx()); }

function renderExerciseAt(idx){
  CURSEQ++;
  CUR.idx = idx; CUR.checked = false; CUR.widget = null;
  var ex = EX[idx];
  var area = $('exArea'); area.innerHTML = '';
  var art = el('article','ex');

  }
  /* SCENARIO block */

  var sb = hv('div','bh bh-scen','<span class="bicon">\u25B8</span> SCENARIO');

  });

  scen.appendChild(sb);
  scen.appendChild(hv('div','sc-summary mono', ex.summary));

    var p = el('div','art');

    p.appendChild(hv('div','art-body', b.html));
    body.appendChild(p);
  });
  scen.appendChild(body);
  art.appendChild(scen);
  /* QUESTION block */

  q.appendChild(hv('div','bh bh-q','<span class="bicon">?</span> QUESTION'));
  q.appendChild(hv('div','bbody q-text', ex.question));
  art.appendChild(q);
  /* YOUR ANSWER block */
  var a = el('section','block answer');
  a.appendChild(hv('div','bh bh-a','<span class="bicon">\u270E</span> YOUR ANSWER'));
  var box = el('div','bbody');
  a.appendChild(box);
  var hint = hv('div','hint hidden',''); hint.id = 'hintPanel';
  a.appendChild(hint);
  art.appendChild(a);
  /* FEEDBACK block */
  var fb = el('section','block feedback hidden'); fb.id = 'fbBlock';
  fb.appendChild(hv('div','bh','<span id="fbHead"></span>'));
  var fbBody = el('div','bbody'); fbBody.id = 'fbBody';
  fb.appendChild(fbBody);
  art.appendChild(fb);
  /* actions */

  var c = el('button','btn primary'); c.id = 'btnCheck'; c.type = 'button'; c.textContent = 'Check';
  c.addEventListener('click', onCheck);
  var n = el('button','btn primary hidden'); n.id = 'btnNext'; n.type = 'button'; n.textContent = 'Next \u25B8';
  n.addEventListener('click', onNext);
  var f = el('button','btn danger hidden'); f.id = 'btnFinal'; f.type = 'button'; f.textContent = 'Final Submit \u2713';
  f.addEventListener('click', onFinalSubmit);
  act.appendChild(c); act.appendChild(n); act.appendChild(f);
  art.appendChild(act);
  area.appendChild(art);
  /* widget */
  CUR.widget = WIDGETS[ex.type](ex, box, { onReady: function(){ if (!CUR.checked) $('btnCheck').disabled = false; } });
  $('btnCheck').disabled = true;

  $('btnFinal').classList.add('hidden');
  $('fbBlock').classList.add('hidden');
  $('hSkip').disabled = false;

  $('hPause').textContent = '\u23F8 Pause';
  renderHeader();
}

function onCheck(){
  if (!CUR.widget || CUR.checked) return;
  var idx = curIdx(); var ex = EX[idx];
  var r = CUR.widget.grade();
  var N = r.N || 1;
  var credit = Math.max(0, (r.H - r.W) / N);
  if (S.hintUsed[idx]) credit = Math.max(0, credit - 0.10);
  CUR.checked = true;
  S.autoActive = true;
  setTimerState('PAUSED_AUTO_CHECK'); /* pause first — feedback renders into the paused state */
  if (CUR.widget.lock) CUR.widget.lock();
  S.credit[idx] = credit; S.answered[idx] = true;
  S.skipped = S.skipped.filter(function(x){ return x !== idx; });
  renderFeedback(ex, r, credit, N);
  $('btnCheck').classList.add('hidden');
  var last = (!S.reviewReturn) && (S.cur >= S.order.length - 1);
  if (last){ $('btnFinal').classList.remove('hidden'); }
  else { $('btnNext').classList.remove('hidden'); }
  $('hSkip').disabled = true;
  $('hHint').disabled = true;
  renderHeader();
  try { $('fbBlock').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

function renderFeedback(ex, r, credit, N){
  var fb = $('fbBlock'); fb.classList.remove('hidden');
  var head = $('fbHead');
  var cls, label;
  if (credit >= 0.999){ cls = 'v-correct'; label = '\u2713 CORRECT'; }
  else if (credit > 0){ cls = 'v-partial'; label = '\u2713 PARTIALLY CORRECT'; }
  else { cls = 'v-incorrect'; label = '\u2717 INCORRECT'; }
  head.className = cls; head.textContent = label;
  var body = $('fbBody'); body.innerHTML = '';
  if (N > 1){
    body.appendChild(hv('div','credit-line', 'credit ' + credit.toFixed(2) + ' \u2014 ' + r.H + '/' + N + ' items \u00B7 formula: max(0, (H \u2212 W) / N) with H=' + r.H + ' correct, W=' + r.W + ' wrong'));
  }
  if (r.correctText){ body.appendChild(hv('div','correct-line','<strong>Correct answer:</strong> ' + r.correctText)); }
  (r.rows || []).forEach(function(row){
    var d = el('div','fb-row');
    var ic, wrd, c2;
    if (row.ok === 'c'){ ic = '\u2713'; wrd = 'Correct'; c2 = 'ic-ok'; }
    else if (row.ok === 'w'){ ic = '\u2717'; wrd = 'Wrong'; c2 = 'ic-no'; }
    else { ic = '\u25CB'; wrd = 'Missed'; c2 = 'ic-miss'; }
    d.appendChild(hv('span','fb-ic ' + c2, ic + ' ' + wrd));
    d.appendChild(hv('span','fb-tx', row.text + (row.note ? ' \u2014 ' + row.note : '')));
    body.appendChild(d);
  });
  body.appendChild(hv('div','explain', ex.explain));
  if (credit < 0.999 && ex.study){ body.appendChild(hv('div','study','<strong>Study next:</strong> ' + ex.study)); }
}

function onNext(){
  if (!CUR.checked) return;
  if (S.reviewReturn){
    S.reviewReturn = false; S.autoActive = false;
    setTimerState('RUNNING');
    openReview();
    return;
  }
  S.autoActive = false;
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else {
    S.cur++; setTimerState('RUNNING'); renderExercise();
  }
}
function onFinalSubmit(){
  if (S.skipped.length){ openReview(); return; } /* review skipped exercises before finishing */
  finishExam(false);
}

function onSkip(){
  if (CUR.checked) return;
  var idx = curIdx();
  if (S.skipped.indexOf(idx) === -1) S.skipped.push(idx); /* never list an exercise twice */
  if (S.reviewReturn){ S.reviewReturn = false; openReview(); return; }
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else { S.cur++; renderExercise(); } /* timer keeps running through a skip */
}

function onHint(){
  var idx = curIdx();
  if (S.hintUsed[idx] || CUR.checked) return;
  S.hintUsed[idx] = true;
  var hp = $('hintPanel');
  hp.innerHTML = '<strong>Hint used \u2014 10% of this exercise credit will be deducted.</strong><br>' + EX[idx].hint;
  hp.classList.remove('hidden');
  $('hHint').disabled = true;
  renderHeader();
}

function onPause(){
  if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK') return;
  $('pauseOverlay').classList.remove('hidden');
  $('exArea').classList.add('hidden');
  $('hPause').textContent = '\u25B6 Resume';
  setTimerState('PAUSED_MANUAL');
}
function onResume(){
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  $('hPause').textContent = '\u23F8 Pause';
  setTimerState(S.autoActive ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase = 'review'; S.autoActive = false;
  showView('review');
  setTimerState('RUNNING'); /* timer resumes on the review screen */
  var v = $('review'); v.innerHTML = '';
  v.appendChild(hv('section','card','<h2>\u26A0 Review skipped exercises</h2>' +
    '<p>Time left on the timer: <strong class="mono">' + fmtClock(S.timer.remaining) + '</strong>. ' +
    'You can go back to any skipped exercise and answer it while time is left. ' +
    'Skipped exercises you never answer are excluded from the score \u2014 they count as neither correct nor wrong.</p>'));
  if (!S.skipped.length){
    v.appendChild(hv('section','card','<p>\u2713 No skipped exercises left.</p>'));
  } else {
    var card = el('section','card');
    S.skipped.forEach(function(idx){
      var row = el('div','rv-row');
      row.appendChild(hv('span','rv-warn','\u26A0 Skipped'));
      row.appendChild(hv('span','rv-tx', EX[idx].summary));
      var b = el('button','btn'); b.type = 'button'; b.textContent = 'Answer';
      b.addEventListener('click', function(){ reviewAnswer(idx); });
      row.appendChild(b);
      card.appendChild(row);
    });
    v.appendChild(card);
  }
  var sub = el('section','card');
  var sb = el('button','btn primary'); sb.type = 'button'; sb.textContent = 'Submit exam';
  sb.addEventListener('click', function(){ finishExam(false); });
  sub.appendChild(sb);
  v.appendChild(sub);
}
function reviewAnswer(idx){
  S.reviewReturn = true; S.rIdx = idx; S.phase = 'exam';
  showView('exam');
  renderExerciseAt(idx);
}

/* ---------- results ---------- */
function resRow(cls, label, txt){
  var d = el('div','fb-row');
  d.appendChild(hv('span','fb-ic ' + cls, label));
  d.appendChild(hv('span','fb-tx', txt));
  return d;
}
function finishExam(byTimeout){
  S.phase = 'results';
  S.timer.state = 'ENDED';
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  var answered = 0, sum = 0, fully = 0, partial = 0, partialSum = 0, wrong = 0, k;
  for (k in S.answered){
    if (!S.answered[k]) continue;
    answered++;
    var c = S.credit[k]; sum += c;
    if (c >= 0.999) fully++;
    else if (c > 0){ partial++; partialSum += c; }
    else wrong++;
  }
  var skippedN = S.skipped.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= META.passMark;
  showView('results');
  renderHeader();
  var v = $('results'); v.innerHTML = '';
  v.appendChild(hv('section','card res-head',
    '<h2>Results \u2014 ' + META.introTitle + '</h2>' +
    '<div class="res-score mono">' + sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + percent + '%</div>' +
    (byTimeout ? '<p class="res-note">\u23F1 Time is up. Unanswered exercises were excluded from the score.</p>' : '') +
    '<div class="res-verdict ' + (passed ? 'v-correct' : 'v-incorrect') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<p>' + (passed
      ? 'Well done. You reached the ' + META.passMark + '% pass mark on this exam.'
      : 'You did not reach the ' + META.passMark + '% pass mark this time. Read the feedback themes below, study the pointers, and retake the exam.') + '</p>'));
  var br = el('section','card');
  br.appendChild(hv('h2','','Score breakdown'));
  br.appendChild(resRow('ic-ok','\u2713 Fully correct', fully + ' exercise' + (fully === 1 ? '' : 's') + ' (credit = 1.0)'));
  br.appendChild(resRow('ic-partial','\u2713 Partially correct', partial + ' exercise' + (partial === 1 ? '' : 's') + (partial ? ' (avg partial credit ' + (partialSum / partial).toFixed(2) + ')' : '')));
  br.appendChild(resRow('ic-no','\u2717 Fully incorrect', wrong + ' exercise' + (wrong === 1 ? '' : 's') + ' (credit = 0)'));
  br.appendChild(resRow('ic-miss','\u26A0 Skipped \u2014 excluded', skippedN + ' exercise' + (skippedN === 1 ? '' : 's') + ' (not counted in numerator or denominator)'));
  var ms = S.timer.manualSec, as = S.timer.autoSec;
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 manual breaks', Math.floor(ms / 60) + ' min ' + (ms % 60) + ' s'));
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 feedback review', Math.floor(as / 60) + ' min ' + (as % 60) + ' s'));
  v.appendChild(br);
  var rc = el('section','card');
  var rb = el('button','btn primary'); rb.type = 'button'; rb.textContent = '\u21BB Retake exam';
  rb.addEventListener('click', retake);
  rc.appendChild(rb);
  v.appendChild(rc);
  reportScore(sum, answered);
}
function retake(){
  S = freshState();
  startExam();
}

/* ---------- site integration ---------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username, country, theme ('dark' \u2014 this file is dark-only), locale, topicId, batch */
  var n = event.data.username || '', c = event.data.country || '';
  var w = $('hWho');
  if (w && (n || c)) { w.textContent = 'Signed in as ' + n + (c ? ' (' + c + ')' : ''); }
});

function init(){
  S = freshState();
  document.body.classList.add(META.sevClass); /* severity-coloured progress bar */
  buildIntro();
  showView('intro');
  $('hPause').addEventListener('click', onPause);
  $('hHint').addEventListener('click', onHint);

  $('btnResume').addEventListener('click', onResume);
}
document.addEventListener('DOMContentLoaded', init);

/* ================= M1035 exam engine — widgets ================= */
var WIDGETS = {};

function correctOf(st){ var o = st.options.filter(function(x){ return x.correct; })[0]; return o ? o.t : ''; }

/* ---------- single-choice ---------- */
WIDGETS.mc = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, oi: i }; }));
  var name = 'ex' + CURSEQ + '-mc';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var sel = null;
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) sel = opts[Number(inp.value)];
      });
      var corr = opts.filter(function(o){ return o.correct; })[0];
      var H = (sel && sel.correct) ? 1 : 0;
      var W = (sel && !sel.correct) ? 1 : 0;
      var rows;
      if (sel && sel.correct){ rows = [{ ok: 'c', text: sel.t, note: ex.answerNote || '' }]; }
      else if (sel){ rows = [{ ok: 'w', text: 'You chose: ' + sel.t, note: 'The correct answer is: ' + corr.t + (ex.answerNote ? ' \u2014 ' + ex.answerNote : '') }]; }
      else { rows = [{ ok: 'm', text: corr.t, note: ex.answerNote || '' }]; }
      return { H: H, W: W, N: 1, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- multi-select (partial credit) ---------- */
WIDGETS.multi = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, note: o.note || '', oi: i }; }));
  var name = 'ex' + CURSEQ + '-mu';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'checkbox'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var picked = [];
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) picked.push(opts[Number(inp.value)]);
      });
      var H = 0, W = 0, N = 0, rows = [];
      opts.forEach(function(o){
        if (!o.correct) return;
        N++;
        var isSel = picked.some(function(p){ return p.oi === o.oi; });
        if (isSel){ H++; rows.push({ ok: 'c', text: o.t, note: o.note }); }
        else { rows.push({ ok: 'm', text: o.t, note: o.note || 'This item belongs in the correct answer.' }); }
      });
      picked.forEach(function(p){
        if (!p.correct){
          W++;
          rows.push({ ok: 'w', text: p.t, note: p.note || 'This option is not part of the correct answer.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match = function(ex, box, ctl){
  var left = ex.pairs.map(function(p){ return { t: p.l }; });
  var right = shuffle(ex.pairs.map(function(p, i){ return { t: p.r, ri: i }; }));
  var map = {}; var selL = -1;
  var gridEl = el('div','pair-cols');
  var lcol = el('div','pcol'); var rcol = el('div','pcol');
  var lrows = [], rrows = [];
  function render(){
    lrows.forEach(function(lr, i){
      var m = map[i];
      lr.querySelector('.msub').textContent = (m === undefined) ? '\u2192 click a partner on the right' : '\u2192 ' + right[m].t;
      lr.classList.toggle('sel', selL === i);
      lr.classList.toggle('paired', m !== undefined);
    });
    rrows.forEach(function(rr, j){
      var taken = Object.keys(map).some(function(k){ return map[k] === j; });
      rr.classList.toggle('used', taken);
    });
  }
  ex.pairs.forEach(function(p, i){
    var lr = el('div','mrow');
    lr.appendChild(el('span','olab',(i + 1) + '.'));
    lr.appendChild(el('span','otext', left[i].t));
    lr.appendChild(el('span','msub mono',''));
    lr.tabIndex = 0;
    lr.setAttribute('role','button');
    lr.setAttribute('aria-label','Match item ' + (i + 1) + ': ' + left[i].t);
    function clickL(){
      if (map[i] !== undefined){ delete map[i]; selL = -1; }
      else { selL = (selL === i ? -1 : i); }
      render(); ctl.onReady();
    }
    lr.addEventListener('click', clickL);
    lr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickL(); } });
    lrows.push(lr); lcol.appendChild(lr);
  });
  right.forEach(function(r, j){
    var rr = el('div','mrow');
    rr.appendChild(el('span','olab', String.fromCharCode(65 + j) + '.'));
    rr.appendChild(el('span','otext', r.t));
    rr.tabIndex = 0;
    rr.setAttribute('role','button');
    rr.setAttribute('aria-label','Candidate partner: ' + r.t);
    function clickR(){ if (selL >= 0){ map[selL] = j; selL = -1; render(); ctl.onReady(); } }
    rr.addEventListener('click', clickR);
    rr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickR(); } });
    rrows.push(rr); rcol.appendChild(rr);
  });
  gridEl.appendChild(lcol); gridEl.appendChild(rcol);
  box.appendChild(hv('div','mhint','Click an item on the left, then click its partner on the right. Click a paired left item again to clear it.'));
  box.appendChild(gridEl);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.pairs.forEach(function(p, i){
        var m = map[i];
        if (m === undefined){
          rows.push({ ok: 'm', text: left[i].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        } else if (right[m].ri === i){
          H++; rows.push({ ok: 'c', text: left[i].t + ' \u2192 ' + p.r, note: p.note || '' });
        } else {
          W++; rows.push({ ok: 'w', text: left[i].t + ' \u2192 ' + right[m].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        }
      });
      return { H: H, W: W, N: ex.pairs.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ gridEl.classList.add('locked'); }
  };
};

/* ---------- ordering (partial credit per position) ---------- */
WIDGETS.order = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it, i){ return { t: it.t, note: it.note || '', ci: i }; }));
  var list = el('div','ord-list');
  function render(){
    Array.prototype.slice.call(list.querySelectorAll('.ord-item')).forEach(function(n){ list.removeChild(n); });
    items.forEach(function(it, pos){
      var row = el('div','ord-item');
      row.appendChild(el('span','ord-pos mono', String(pos + 1)));
      row.appendChild(el('span','otext', it.t));
      var up = el('button','ord-btn'); up.type = 'button'; up.textContent = '\u2191'; up.setAttribute('aria-label','Move up');
      var dn = el('button','ord-btn'); dn.type = 'button'; dn.textContent = '\u2193'; dn.setAttribute('aria-label','Move down');
      up.addEventListener('click', function(){
        if (pos > 0){ var t = items[pos - 1]; items[pos - 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      dn.addEventListener('click', function(){
        if (pos < items.length - 1){ var t = items[pos + 1]; items[pos + 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  box.appendChild(hv('div','mhint','Put the steps in the right order. Use the arrows to move a step up or down.'));
  box.appendChild(list);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it, pos){
        if (pos === it.ci){ H++; rows.push({ ok: 'c', text: (pos + 1) + '. ' + it.t, note: it.note }); }
        else { W++; rows.push({ ok: 'w', text: (pos + 1) + '. ' + it.t, note: 'Correct position: ' + (it.ci + 1) + '. ' + it.note }); }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- drag & drop into zones (partial credit per item) ---------- */
WIDGETS.dd = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it){ return { t: it.t, zone: it.zone, note: it.note || '', placed: -1 }; }));
  var sel = -1;
  var bank = el('div','bank');
  var zonesWrap = el('div','zones');
  var zoneEls = ex.zones.map(function(z){
    var zd = el('div','zone');
    zd.appendChild(hv('h4','', z));
    zd.appendChild(el('div','zone-items'));
    return zd;
  });
  function paintSel(){
    Array.prototype.forEach.call(document.querySelectorAll('.ditem'), function(n){ n.classList.remove('sel'); });
  }
  function itemEl(it, i){
    var d = el('div','ditem');
    d.appendChild(el('span','otext', it.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Item: ' + it.t);
    d.setAttribute('draggable','true');
    d.addEventListener('click', function(){
      if (it.placed !== -1){ it.placed = -1; paintSel(); sel = -1; render(); ctl.onReady(); return; }
      sel = (sel === i ? -1 : i);
      paintSel();
      if (sel === i) d.classList.add('sel');
    });
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); } });
    d.addEventListener('dragstart', function(e){ sel = i; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} });
    return d;
  }
  function render(){
    bank.innerHTML = '';
    items.forEach(function(it, i){ if (it.placed === -1) bank.appendChild(itemEl(it, i)); });
    zoneEls.forEach(function(zd, z){
      var zi = zd.querySelector('.zone-items'); zi.innerHTML = '';
      items.forEach(function(it, i){ if (it.placed === z) zi.appendChild(itemEl(it, i)); });
    });
  }
  function dropOn(z){
    if (sel === -1) return;
    items[sel].placed = z; sel = -1; paintSel(); render(); ctl.onReady();
  }
  zoneEls.forEach(function(zd, z){
    zd.addEventListener('click', function(e){
      if (e.target === zd || e.target.classList.contains('zone-items') || e.target.tagName === 'H4') dropOn(z);
    });
    zd.addEventListener('dragover', function(e){ e.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop', function(e){ e.preventDefault(); zd.classList.remove('over'); dropOn(z); });
  });
  zoneEls.forEach(function(zd){ zonesWrap.appendChild(zd); });
  box.appendChild(hv('div','mhint','Click an item to select it, then click a column to place it. Click a placed item to send it back.'));
  box.appendChild(bank);
  box.appendChild(zonesWrap);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it){
        if (it.placed === -1){
          rows.push({ ok: 'm', text: it.t, note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        } else if (it.placed === it.zone){
          H++; rows.push({ ok: 'c', text: it.t + ' \u2192 ' + ex.zones[it.zone], note: it.note });
        } else {
          W++; rows.push({ ok: 'w', text: it.t + ' \u2192 ' + ex.zones[it.placed], note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){
      bank.classList.add('locked');
      zoneEls.forEach(function(z){ z.classList.add('locked'); });
    }
  };
};

/* ---------- fill in the blanks from a word bank (partial credit per blank) ---------- */
WIDGETS.fill = function(ex, box, ctl){
  var slots = ex.slots.map(function(s){ return { ans: s, chip: null }; });
  var bankWords = shuffle(ex.bank.map(function(w){ return { t: w, used: false }; }));
  var sentEl = el('div','fill-sent');
  var slotBtns = [];
  ex.sentence.split(/(\{s\d+\})/).forEach(function(p){
    var m = p.match(/^\{s(\d+)\}$/);
    if (m){
      var si = Number(m[1]);
      var b = el('button','slotbtn mono'); b.type = 'button';
      b.setAttribute('aria-label','Blank ' + (si + 1) + '. Click to empty this blank.');
      b.addEventListener('click', function(){
        if (slots[si].chip){ slots[si].chip.used = false; slots[si].chip = null; render(); }
      });
      slotBtns[si] = b;
      sentEl.appendChild(b);
    } else if (p){
      sentEl.appendChild(hv('span','', p));
    }
  });
  var bankEl = el('div','bank chips');
  function render(){
    slotBtns.forEach(function(b, si){
      b.textContent = slots[si].chip ? slots[si].chip.t : '[' + (si + 1) + ']';
      b.classList.toggle('filled', !!slots[si].chip);
    });
    bankEl.innerHTML = '';
    bankWords.forEach(function(w){
      if (w.used) return;
      var c = el('button','bank-chip'); c.type = 'button'; c.textContent = w.t;
      c.addEventListener('click', function(){
        if (w.used) return;
        var empty = -1, si;
        for (si = 0; si < slots.length; si++){ if (!slots[si].chip){ empty = si; break; } }
        if (empty === -1){
          var old = slots[0].chip;
          if (old) old.used = false;
          slots[0].chip = w; w.used = true;
        } else {
          slots[empty].chip = w; w.used = true;
        }
        render(); ctl.onReady();
      });
      bankEl.appendChild(c);
    });
    if (!bankEl.children.length) bankEl.appendChild(hv('span','dim','Word bank is empty \u2014 click a filled blank to put a word back.'));
  }
  box.appendChild(hv('div','mhint','Click a word to place it in the next empty blank. Click a filled blank to return its word to the bank.'));
  box.appendChild(sentEl);
  box.appendChild(bankEl);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      slots.forEach(function(s, i){
        if (!s.chip){ rows.push({ ok: 'm', text: 'Blank ' + (i + 1), note: 'Correct word: ' + s.ans }); }
        else if (s.chip.t === s.ans){ H++; rows.push({ ok: 'c', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: 'Correct word: ' + s.ans }); }
      });
      return { H: H, W: W, N: slots.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ sentEl.classList.add('locked'); bankEl.classList.add('locked'); }
  };
};

/* ---------- spot the flaw: flag lines (partial credit) ---------- */
WIDGETS.spot = function(ex, box, ctl){
  var flags = ex.lines.map(function(){ return false; });
  var list = el('div','lines');
  ex.lines.forEach(function(ln, i){
    var d = el('div','line');
    d.appendChild(el('span','flagmark','\u2691'));
    d.appendChild(hv('span','line-tx mono', ln.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Flag this line');
    function tog(){ flags[i] = !flags[i]; d.classList.toggle('flag', flags[i]); ctl.onReady(); }
    d.addEventListener('click', tog);
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } });
    list.appendChild(d);
  });
  box.appendChild(hv('div','mhint','Click a line to flag it. Click it again to unflag. Flag every line the question asks for.'));
  box.appendChild(list);
  var N = ex.lines.filter(function(l){ return l.bad; }).length;
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.lines.forEach(function(ln, i){
        var tx = stripTags(ln.t);
        if (ln.bad){
          if (flags[i]){ H++; rows.push({ ok: 'c', text: tx, note: ln.note || '' }); }
          else { rows.push({ ok: 'm', text: tx, note: ln.note || '' }); }
        } else if (flags[i]){
          W++; rows.push({ ok: 'w', text: tx, note: ln.note || 'This line is fine \u2014 it should not have been flagged.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- branching decision drill (each step is one scored item, graded at final Check) ---------- */
WIDGETS.branch = function(ex, box, ctl){
  var step = 0, picks = [];
  var wrap = el('div','branch');
  function renderStep(){
    wrap.innerHTML = '';
    if (step >= ex.steps.length){
      wrap.appendChild(hv('div','mhint','\u2713 All steps answered. Press Check to grade the whole exercise \u2014 the timer will pause for feedback.'));
      ctl.onReady();
      return;
    }
    var st = ex.steps[step];
    var card = el('div','step-card');
    card.appendChild(hv('div','step-chip','STEP ' + (step + 1) + ' OF ' + ex.steps.length));
    if (st.ctx) card.appendChild(hv('div','step-ctx', st.ctx));
    card.appendChild(hv('p','q-text', st.q));
    var opts = shuffle(st.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    var name = 'ex' + CURSEQ + '-st' + step;
    var ow = el('div','opts');
    var picked = -1;
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picked = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        btn.disabled = false;
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    var btn = el('button','btn'); btn.type = 'button';
    btn.textContent = 'Confirm step ' + (step + 1);
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (picked < 0) return;
      picks[step] = opts[picked];
      step++;
      renderStep();
    });
    card.appendChild(btn);
    wrap.appendChild(card);
  }
  renderStep();
  box.appendChild(hv('div','mhint','Answer every step. Intermediate confirms do not grade anything \u2014 everything is scored at the final Check.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.steps.forEach(function(st, i){
        var p = picks[i];
        if (!p){ rows.push({ ok: 'm', text: 'Step ' + (i + 1), note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
        else if (p.correct){ H++; rows.push({ ok: 'c', text: 'Step ' + (i + 1) + ': ' + p.t, note: st.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Step ' + (i + 1) + ': ' + p.t, note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
      });
      return { H: H, W: W, N: ex.steps.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- SOC triage queue: one decision per alert (partial credit per alert) ---------- */
WIDGETS.triage = function(ex, box, ctl){
  var wrap = el('div','triage');
  var picks = ex.alerts.map(function(){ return -1; });
  var optionSets = [];
  ex.alerts.forEach(function(a, ai){
    var card = el('div','alert-card');
    card.appendChild(hv('div','alert-title', a.title));
    if (a.html) card.appendChild(hv('div','alert-log', a.html));
    var opts = shuffle(a.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    optionSets.push(opts);
    var name = 'ex' + CURSEQ + '-al' + ai;
    var ow = el('div','opts');
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picks[ai] = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    wrap.appendChild(card);
  });
  box.appendChild(hv('div','mhint','Choose one action for every alert, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.alerts.forEach(function(a, ai){
        var p = picks[ai];
        if (p < 0){ rows.push({ ok: 'm', text: a.title, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
        else if (optionSets[ai][p].correct){ H++; rows.push({ ok: 'c', text: a.title, note: a.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: a.title + ' \u2014 chose: ' + optionSets[ai][p].t, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
      });
      return { H: H, W: W, N: ex.alerts.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- coverage board: one column choice per row (partial credit per row) ---------- */
WIDGETS.grid = function(ex, box, ctl){
  var wrap = el('div','gridt');
  var picks = ex.rows.map(function(){ return -1; });
  ex.rows.forEach(function(r, ri){
    var row = el('div','grid-row');
    row.appendChild(el('span','grid-tx', r.t));
    var togs = el('div','gtogs');
    ex.cols.forEach(function(c, ci){
      var b = el('button','gtog'); b.type = 'button'; b.textContent = c;
      b.setAttribute('aria-label', r.t + ' \u2014 choose ' + c);
      b.addEventListener('click', function(){
        picks[ri] = ci;
        Array.prototype.forEach.call(togs.querySelectorAll('.gtog'), function(n, k){
          n.classList.toggle('sel', k === ci);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      togs.appendChild(b);
    });
    row.appendChild(togs);
    wrap.appendChild(row);
  });
  box.appendChild(hv('div','mhint','Choose one column for every row, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.rows.forEach(function(r, ri){
        var p = picks[ri];
        if (p < 0){ rows.push({ ok: 'm', text: r.t, note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
        else if (p === r.col){ H++; rows.push({ ok: 'c', text: r.t + ' \u2014 ' + ex.cols[r.col], note: r.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: r.t + ' \u2014 ' + ex.cols[p], note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
      });
      return { H: H, W: W, N: ex.rows.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
