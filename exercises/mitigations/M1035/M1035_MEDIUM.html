<script>

var INTRO = {"learn": "<p>This exam goes one level deeper into <strong>M1035 — Limit Access to Resource Over Network</strong>, a <strong>mitigation</strong> in MITRE ATT&CK. You already know the plain goal: only users, accounts, and systems with a real work need reach network resources. Here you connect that goal to the specific techniques the page names — and to the exact measures that answer them.</p><p>The page's technique table is wider than most people expect. You will work with the remote services rows (T1021, with RDP and SMB admin shares), external remote services (T1133), hardware additions (T1200 — unregistered devices joining the network), ARP cache poisoning (T1557.002), RDP session hijacking (T1563.002), and the cloud and container rows: the Docker API (ports 2375 and 2376), the Kubernetes API server with IP-range restriction and just-in-time access, and the cloud Instance Metadata API guarded by a host firewall.</p><p>You will also practise the work around the control. Network engineers turn measures into rules and roll them out in monitor mode first. SOC analysts read deny and allow lines against the written design. GRC analysts map the control to ISO 27001 A.8.22 and CIS Control 3.12. Control owners sort exception requests into healthy and risky. Each exercise chains two ideas — that is what MEDIUM means: know the technique, then pick the measure; see the log, then make the call.</p>", "keywords": [["Techniques addressed by M1035", ["T1021 Remote Services (T1021.001 RDP, T1021.002 SMB/Windows Admin Shares)", "T1133 External Remote Services — VPN concentrators, managed remote access", "T1200 Hardware Additions — NAC, 802.1x, device certificates, DHCP registration", "T1557.002 ARP Cache Poisoning — static ARP entries (with the scale caveat)", "T1563.002 RDP Session Hijacking — remote desktop gateways", "Container and cloud rows — T1612, T1609, T1610, T1613, T1552.005, T1552.007"]], ["Implementation measures in practice", ["Audit and restrict access — least privilege with AD and IAM tooling", "Secure remote access — gateways, concentrators, ZTNA, MFA, time/device/identity limits", "Disable unnecessary services — Telnet, FTP, legacy SMB off; Docker API on TLS 2376", "Segmentation and isolation — VLANs, ACLs, monitor-mode rollout", "Monitor and log access — SIEM evidence of allowed and denied attempts"]], ["Control design & mappings", ["ISO/IEC 27001 A.8.22 — Separation of networks", "CIS Control 3.12 — Segment Data Processing", "Just-in-time (JIT) access instead of standing rights", "Exception hygiene — scoped, owned, time-boxed rules"]], ["Telemetry & triage", ["Deny lines as proof the control works", "Allowed traffic judged against the written design", "East-west SMB between workstations as a lateral movement path", "Change tickets as benign-looking artefacts"]]], "how": "<p><strong>Passing score.</strong> You need <strong>70%</strong> to pass. Every exercise chains two ideas, so read the artefact and the design context before answering. FAIL means retake — the questions and answers reshuffle each attempt.</p><p><strong>Exercise types in this file.</strong> Two-step choice questions, technique-to-measure matching, drag-and-drop coverage sorting, word-bank completion of rules and reports, a branching decision drill, a three-alert SOC queue, click-the-worst-line rule review, rollout ordering, a coverage board, and an exception-health sort.</p><p><strong>Timer.</strong> The countdown starts at <strong>35:00</strong>. Press <strong>Pause</strong> for a real break — the exercise hides until you press Resume. Pressing <strong>Check</strong> stops the timer automatically; it resumes only when you press <strong>Next</strong>.</p><p><strong>Partial credit.</strong> Multi-part exercises are scored item by item with the formula max(0, (H − W) / N): each correct item adds credit, each wrong item subtracts. One hint per exercise costs 10% of that exercise's credit.</p><p><strong>Skipping.</strong> Skip is free and never reveals the answer. You can return to skipped exercises from the review screen while time remains. Skipped-and-never-answered exercises are excluded from the score.</p>"};
var EX = [{"type": "mc", "summary": "Deny on tcp/445 from the guest VLAN", "text": "<p>The SIEM raises a low-severity ticket. The file-server VLAN should only be reachable from user and admin VLANs, never from the guest network.</p>", "blocks": [{"label": "ARTEFACT 1 — Firewall log excerpt", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> tcp <span class=\"c-ip\">10[.]7[.]1[.]55</span> <span class=\"c-dim\">(guest VLAN)</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">445</span></pre>"}], "question": "Which reading combines the measure and its effect correctly?", "hint": "First ask what blocked the packet, then ask where the event was recorded.", "options": [{"t": "A segmentation rule blocked the reach attempt, and the SIEM logged the failed attempt for review", "correct": true}, {"t": "An antivirus scan removed malware from the guest laptop"}, {"t": "An MFA prompt failed for a legitimate administrator"}, {"t": "A patch job changed the file server's configuration"}], "correct": "Segmentation blocked it; the SIEM recorded the failed attempt.", "explain": "Two measures work together in this log line: network segmentation produced the deny, and the monitoring measure put the failed attempt into the SIEM. The other options describe different controls — antivirus, identity, patching — none of which generate firewall denies. Reading a deny as 'the control worked, and here is the evidence' is the correct first pass. The natural follow-up is to check whether guest-to-file-server traffic was ever supposed to exist at all.", "study": "How a deny rule and SIEM logging work as a pair."}, {"type": "match", "summary": "Which M1035 measure addresses each technique?", "text": "<p>You build a one-page cheat sheet for the SOC: technique on the left, the measure the M1035 page names for it on the right.</p>", "question": "Match each technique to the measure the ATT&CK page names for it.", "hint": "Each right-side answer uses a keyword from the technique's own name: desktop, shares, external, hardware.", "pairs": [{"l": "T1021.001 Remote Desktop Protocol", "r": "Use remote desktop gateways", "note": "The page's Use line for RDP is exactly this."}, {"l": "T1021.002 SMB/Windows Admin Shares", "r": "Consider disabling Windows administrative shares", "note": "Plus least privilege on share permissions."}, {"l": "T1133 External Remote Services", "r": "Limit access through VPN concentrators and managed remote access", "note": "Centrally managed doors for outside access."}, {"l": "T1200 Hardware Additions", "r": "NAC with 802.1x and device certificates; DHCP for registered devices only", "note": "Unregistered devices must not reach trusted systems."}], "correct": "The four pairings as written on the page.", "explain": "These are the page's own Use lines. RDP is fronted by gateways; admin shares are disabled or restricted; external remote services are pulled behind VPN concentrators or ZTNA; and hardware additions are met with network access control — 802.1x, device certificates, and DHCP registration. Building exactly this cheat sheet is a real task when a mitigation owner documents coverage. It also gives SOC analysts instant context for deny logs: every blocked protocol maps back to a technique name.", "study": "The 'Techniques Addressed by Mitigation' table on the M1035 page."}, {"type": "dd", "summary": "Does M1035 address this technique?", "text": "<p>A junior asks you to check four techniques against the M1035 page before a coverage review.</p>", "question": "Drag each technique to the correct column.", "hint": "Picture the page's technique table: does the row exist?", "zones": ["M1035 addresses it", "M1035 does not address it"], "items": [{"t": "T1021 Remote Services", "zone": 0, "note": "Parent of the RDP and SMB rows on the page."}, {"t": "T1557.002 ARP Cache Poisoning", "zone": 0, "note": "Addressed via static ARP entries."}, {"t": "T1566 Phishing", "zone": 1, "note": "Email-borne delivery; no row on this page."}, {"t": "T1059 Command and Scripting Interpreter", "zone": 1, "note": "Execution inside a host; not a network access limit."}], "correct": "Remote services and ARP poisoning are on the page; phishing and scripting are not.", "explain": "The M1035 page lists T1021 and T1557.002, so both are addressed. Phishing and command scripting are real problems, but this mitigation does not claim them — phishing is about delivery, and scripting happens inside the host. Knowing the exact edge of a mitigation's coverage prevents two classic mistakes: overclaiming in audits, and leaving real gaps unassigned. When a technique is not covered, you look for another mitigation or a detection instead.", "study": "Which technique rows exist — and do not exist — on the M1035 page."}, {"type": "fill", "summary": "Harden the Docker API per the page", "text": "<p>Your build hosts run Docker. The page's Use lines for the container techniques say to secure the API ports. You draft the change note with the exact ports and socket.</p>", "question": "Fill all three blanks with the ports and socket named on the page.", "hint": "The two port numbers are neighbours, and the safe local socket shares its name with an operating system family.", "sentence": "Disable unauthenticated access to the Docker API on port {s0} and communicate over TLS on port {s1}, or keep the API on a local {s2} socket.", "slots": ["2375", "2376", "Unix"], "bank": ["2375", "2376", "Unix", "445", "Telnet"], "correct": "2375 … 2376 … Unix socket.", "explain": "The page's Use lines for the container techniques (T1612, T1609, T1610, T1613, and the container API row of T1552) say to limit communications to local Unix sockets or SSH, require TLS, and disable unauthenticated access on port 2375 in favour of TLS on 2376. Ports 445 and the word Telnet belong to other rows entirely. This is M1035 applied to a container platform: the resource is the Docker API, and only managed, authenticated channels may reach it.", "study": "The Use lines for the container techniques on the M1035 page."}, {"type": "triage", "summary": "SOC queue: three share and RDP events", "text": "<p>Three events wait in the queue. For each one, decide the action that matches both the log and the written design.</p>", "question": "Choose the correct action for every alert.", "hint": "For each alert ask: was the path allowed by design, and should it be?", "alerts": [{"title": "Alert 1 — deny on 3389 from a user PC", "html": "<pre class=\"log\"><span class=\"c-no\">deny</span> tcp <span class=\"c-ip\">10[.]1[.]5[.]88</span> <span class=\"c-dim\">(user VLAN)</span> → <span class=\"c-ip\">10[.]2[.]0[.]12</span>:<span class=\"c-num\">3389</span></pre>", "options": [{"t": "Close as blocked — the allow-list worked; keep the deny line for the weekly review", "correct": true}, {"t": "Escalate as a successful remote session"}, {"t": "Tune the rule to allow the user VLAN"}], "note": "User VLANs must not RDP to servers; the deny proves the design works."}, {"title": "Alert 2 — allowed RDP from the jump host at 02:00", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]5</span> <span class=\"c-dim\">(jump host)</span> → <span class=\"c-ip\">10[.]2[.]0[.]10</span>:<span class=\"c-num\">3389</span> <span class=\"c-dim\">— CHG-2291 “file-server patching”, 02:00–02:45</span></pre>", "options": [{"t": "Close as planned — the connection used the allowed path under an open change ticket", "correct": true}, {"t": "Escalate as an attack on the file server"}, {"t": "Block the jump host immediately"}], "note": "Allowed path plus a ticketed patching window equals planned work."}, {"title": "Alert 3 — allowed SMB between two user PCs", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]1[.]4[.]29</span> → <span class=\"c-ip\">10[.]1[.]4[.]83</span>:<span class=\"c-num\">445</span></pre>", "options": [{"t": "Escalate — user PCs should not reach each other over SMB; check for a legacy allow rule", "correct": true}, {"t": "Close as normal — user PCs share files directly all the time"}, {"t": "Close as blocked — the firewall stopped it"}], "note": "East-west SMB between workstations is a lateral movement path the design should block."}], "correct": "Deny closed with evidence; allowed-plus-ticketed closed; user-to-user SMB escalated.", "explain": "This queue trains the two-step read: what happened, then what should the design say. Alert 1 is the control working, so it closes with the deny line kept as evidence. Alert 2 used the allowed door under a change ticket — closing it is right, and the ticket is your proof. Alert 3 is the dangerous one: nothing was blocked, but workstation-to-workstation SMB is a lateral movement path that segmentation should stop, so you check for a legacy allow rule. SOC analysts make exactly these three calls every shift.", "study": "Deny versus allow lines, change tickets, and east-west traffic."}, {"type": "branch", "summary": "Branching drill: a flat-network finding", "text": "<p>An audit finding landed on your desk. Walk the three decisions a network engineer would make.</p>", "question": "Answer all three steps — they are graded together at the final Check.", "hint": "Follow the three beats: what failed, what fixes it, what proves it.", "steps": [{"ctx": "<p>An auditor found that a device on the guest VLAN reached an internal file server over SMB (port 445). Nothing stopped it.</p>", "q": "Which failed measure should have stopped this?", "options": [{"t": "Network segmentation and isolation between guest and corporate networks", "correct": true}, {"t": "Antivirus on the file server"}, {"t": "Email filtering"}], "note": "Guest-to-corporate reach is a segmentation failure, nothing else."}, {"ctx": "<p>The network team agrees to fix it. The guest VLAN serves visitors whose only need is internet access.</p>", "q": "Which change implements M1035 here?", "options": [{"t": "An ACL on the guest VLAN that allows internet access only and denies the corporate ranges", "correct": true}, {"t": "A faster firewall with more memory"}, {"t": "Moving the file server into the guest VLAN"}], "note": "Scoped allow for the internet; deny everything toward the corporate ranges."}, {"ctx": "<p>The ACL is deployed in monitor mode first — logging, not blocking.</p>", "q": "Which log proves the rule will work when enforced?", "options": [{"t": "Denied guest-to-corporate attempts recorded by the SIEM", "correct": true}, {"t": "A drop in firewall CPU usage"}, {"t": "New user passwords in the audit report"}], "note": "Monitor mode shows exactly what enforcement will block."}], "correct": "Segmentation failure → scoped ACL → SIEM denies as proof.", "explain": "The drill walks the real workflow of a segmentation fix. First you name the failed measure: guest and corporate networks were not isolated. Then you design the scoped rule — guests get the internet, not the corporate ranges. Finally you use monitor mode and the SIEM to prove the rule before enforcing it. Running new rules in monitor mode first is standard practice, because it catches legitimate flows before they break someone's day.", "study": "Monitor-mode rollout for new segmentation rules."}, {"type": "mc", "summary": "Map the control goal to ISO 27001", "text": "<p>The GRC team maps the segmentation work to external frameworks for the annual audit report. Each control goal needs the right framework line.</p>", "question": "Which ISO/IEC 27001 control best matches 'separate networks by trust level'?", "hint": "Two of the options are about malware and monitoring — the key words in the goal are 'separate' and 'networks'.", "options": [{"t": "A.8.22 Separation of networks", "correct": true}, {"t": "A.8.7 Protection against malware"}, {"t": "A.5.24 Incident management planning"}, {"t": "A.8.16 Monitoring activities"}], "correct": "A.8.22 Separation of networks.", "explain": "ISO/IEC 27001:2022 control A.8.22 is 'Separation of networks' — grouping information services and separating them by trust, which is the same idea as the page's segmentation measure. The same goal maps to CIS Control 3.12, Segment Data Processing Systems, so one firewall project can feed several audit answers at once. Malware protection, incident management, and monitoring are different control families. Mapping a mitigation to framework controls is routine GRC work; keep the mapping evidence — the architecture diagram and the rule list — next to the control name.", "study": "ISO 27001 A.8.22 and the M1035 segmentation measure."}, {"type": "order", "summary": "Order the rollout of a new allow-list", "text": "<p>The network team plans to restrict the server VLAN. You put their five planned activities in a sane order before the change board reviews it.</p>", "question": "Order the five activities from first to last.", "hint": "Nothing gets blocked until the logs have been read at least once.", "items": [{"t": "Audit current access: who and what reaches the server VLAN", "note": "You cannot scope rules without a baseline."}, {"t": "Remove unneeded access and draft allow rules with the business owners", "note": "Least privilege is decided with owners, not alone."}, {"t": "Deploy the rules in monitor-only mode", "note": "No blocking yet — only logging."}, {"t": "Review the logged allowed and denied traffic and tune the rules", "note": "Catch legitimate flows before enforcement."}, {"t": "Enforce the rules and alert on denied attempts", "note": "Blocking starts after tuning."}], "correct": "Audit → design with owners → monitor → tune → enforce.", "explain": "A healthy rollout never starts with blocking. You audit what exists, decide least privilege with the owners, watch the traffic in monitor mode, tune against reality, and only then enforce with deny alerts. Skipping the audit creates outages; skipping the tuning creates a flood of helpdesk tickets. This order also produces the paper trail — the access review and the monitor-mode report — that a GRC control owner later shows to auditors as evidence.", "study": "Rollout sequence for segmentation projects."}, {"type": "spot", "summary": "Find the line that breaks the design", "text": "<p>The Linux farm should be reachable for administration only from the admin subnet, and the Docker API should be closed. Four rule lines are on the table.</p>", "blocks": [{"label": "ARTEFACT 1 — Rule excerpt (Linux farm segment)", "html": "<pre class=\"log\"><span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]0[.]0/24</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">22</span>   <span class=\"c-dim\"># admin subnet to Linux farm</span>\n<span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">10[.]9[.]3[.]11</span> → <span class=\"c-ip\">10[.]20[.]2[.]8</span>:<span class=\"c-num\">443</span>  <span class=\"c-dim\"># app deploy pipeline</span>\n<span class=\"c-ok\">allow</span> tcp <span class=\"c-ip\">any</span> → <span class=\"c-ip\">10[.]20[.]1[.]5</span>:<span class=\"c-num\">2375</span> <span class=\"c-dim\"># Docker API, temporary for vendor demo</span>\n<span class=\"c-no\">deny</span>  ip  <span class=\"c-ip\">any</span> <span class=\"c-dim\">→ any</span></pre>"}], "question": "Click the line that most breaks the M1035 design.", "hint": "One line opens a management interface to every possible source.", "lines": [{"t": "allow tcp 10[.]9[.]0[.]0/24 → 10[.]20[.]1[.]5:22   # admin subnet to Linux farm"}, {"t": "allow tcp 10[.]9[.]3[.]11 → 10[.]20[.]2[.]8:443  # app deploy pipeline"}, {"t": "allow tcp any → 10[.]20[.]1[.]5:2375 # Docker API, temporary for vendor demo", "bad": true, "note": "Port 2375 is the unauthenticated Docker API, opened to every source — the page says to disable it and use TLS on 2376."}, {"t": "deny ip any → any"}], "correct": "The any-source allow on port 2375 (unauthenticated Docker API).", "explain": "Port 2375 is the unauthenticated Docker API; the page explicitly says to disable unauthenticated access to it and to use TLS on 2376 or a local Unix socket. The flagged line allows any source to reach it, so anyone on the network can drive the container engine — the exact behaviour the container Use lines forbid. The other lines are scoped: one admin subnet to SSH, one host to HTTPS. The word 'temporary' with no owner or review date is the tell that this exception escaped control.", "study": "Unauthenticated Docker API on 2375 versus TLS on 2376."}, {"type": "grid", "summary": "Which resource does M1035 restrict here?", "text": "<p>You split a work backlog into M1035 tasks and tasks that belong to other controls. Four backlog items are on the board.</p>", "question": "Sort every row into the correct column.", "hint": "Ask whether the resource is reached over the network.", "cols": ["Restrict with an M1035 measure", "Belongs to a different control"], "rows": [{"t": "Kubernetes API server reachable from any subnet", "col": 0, "note": "The page says restrict permitted IP ranges; add JIT where possible."}, {"t": "USB ports on office workstations", "col": 1, "note": "Device control, not network access."}, {"t": "The VPN door into the LAN for remote staff", "col": 0, "note": "Concentrators and managed remote access are named measures."}, {"t": "Email attachment scanning", "col": 1, "note": "Mail security is a different control family."}], "correct": "Kubernetes API and the VPN door are M1035 work; USB ports and mail scanning are not.", "explain": "M1035 restricts network reachability. The Kubernetes API server and the VPN door are network resources — the page names IP-range restriction for the cluster API and concentrators for remote access. USB ports and email scanning happen outside the network path, so other controls own them. Sorting a backlog this way keeps the mitigation short and stops the team from promising what a firewall cannot deliver.", "study": "The scope of 'network resources' on the M1035 page."}, {"type": "fill", "summary": "Insert the keywords in the incident report", "text": "<p>You finish an incident report. The attacker used SMB admin shares. The report must state what would have reduced the path and which telemetry exists.</p>", "question": "Fill both blanks with the right keywords.", "hint": "First blank: what a blocked path does to an attack path. Second blank: the auditing word the page uses.", "sentence": "The attacker reached the file share over SMB admin shares (T1021.002). Least-privilege share permissions and disabling admin shares — measures under M1035 — would have {s0} this path. The SIEM kept a full {s1} of allowed and denied attempts, which gave us the timeline.", "slots": ["broken", "record"], "bank": ["broken", "record", "encrypted", "discount", "rewarded"], "correct": "broken … record.", "explain": "Disabling admin shares and tightening share permissions breaks the lateral path the attacker used — that is the preventive effect M1035 claims for T1021.002. The page's monitoring measure keeps a record of allowed and denied attempts, and that record is what rebuilt the timeline. Encrypted, discount, and rewarded do not fit the mechanism at all. Reports written this way connect the incident, the control, and the evidence cleanly for leadership.", "study": "The Use line for T1021.002 and the monitoring measure."}, {"type": "mc", "summary": "What does 'secure remote access' mean on the page?", "text": "<p>A vendor offers a VPN where every remote laptop gets full access to the whole LAN. You check the offer against the page's measure before replying.</p>", "question": "Which statement matches the page's 'Deploy Secure Remote Access Solutions' measure?", "hint": "The measure restricts connections by three things — find the option that lists restrictions.", "options": [{"t": "Aggregate remote access through managed doors and restrict connections by time, device, and user identity", "correct": true}, {"t": "Give every remote device full LAN access for simplicity"}, {"t": "Trust internal staff without any connection checks"}, {"t": "Share one administrator account among all contractors"}], "correct": "Managed doors with time, device, and identity restrictions — plus MFA.", "explain": "The page's measure says to use RDP gateways, VPN concentrators, and ZTNA, and to configure access controls that restrict connections based on time, device, and user identity, with MFA enforced. Full-tunnel LAN access for every device is the opposite of least privilege. Shared accounts break identity-based restriction completely. When you review vendor offers, this sentence from the page is your checklist.", "study": "The 'Deploy Secure Remote Access Solutions' measure."}, {"type": "match", "summary": "Four tools, four M1035 jobs", "text": "<p>You add the remaining tools from the page to the team wiki so juniors stop using the wrong one.</p>", "question": "Match each tool to the job the page gives it.", "hint": "One is Windows-only, one is Linux firewalling, one is a gateway, one is a firewall distribution.", "pairs": [{"l": "Group Policy Editor", "r": "Disable SMBv1 and Telnet on Windows machines", "note": "Named for service and protocol hardening."}, {"l": "iptables / firewalld", "r": "Block unnecessary traffic on Linux hosts", "note": "Host-level blocking."}, {"l": "Apache Guacamole", "r": "Open-source gateway for RDP and VNC", "note": "A managed remote access door."}, {"l": "pfSense", "r": "Build network segmentation and isolation", "note": "The page names it for network isolation."}], "correct": "Each tool pairs with its page job.", "explain": "The page's tool list covers the whole spread of M1035 work: hardening protocols with the Group Policy Editor, blocking traffic with iptables or firewalld, centralising remote access with Guacamole, and isolating networks with pfSense. Knowing which tool serves which measure makes implementation plans concrete. It also helps you read vendor proposals — a vendor that promises 'segmentation' with only an endpoint agent is not describing this page.", "study": "The 'Tools for Implementation' section."}, {"type": "dd", "summary": "Sort the exception requests", "text": "<p>Four exception requests landed in your queue after the new rules went live. Sort them before the weekly review.</p>", "question": "Drag each request to the correct column.", "hint": "Healthy exceptions are small, owned, and dated. Look for the missing owner and the huge range.", "zones": ["Healthy exception", "Risky exception"], "items": [{"t": "One host, one port, named owner, review date next quarter", "zone": 0, "note": "Scoped, owned, time-boxed."}, {"t": "A 'temporary' Docker API rule from last year with no owner", "zone": 1, "note": "Unowned and unreviewed — the classic escape."}, {"t": "Share access granted to a role after an access audit", "zone": 0, "note": "Access granted from a documented need."}, {"t": "Allow the whole /16 'for convenience'", "zone": 1, "note": "Range-wide allows defeat least privilege."}], "correct": "Scoped and audited requests are healthy; unowned and range-wide ones are risky.", "explain": "Exceptions are how allow-lists rot. A scoped rule with an owner and a review date stays under control; an unowned 'temporary' rule and a range-wide convenience allow are exactly how flat networks come back. The audited share grant is healthy because the need was documented first. Reviewing exceptions with this lens is a recurring task for control owners — and it is the first thing auditors sample.", "study": "Exception hygiene for allow-lists."}, {"type": "mc", "summary": "The page's caveat on static ARP entries", "text": "<p>You propose static ARP entries to counter ARP cache poisoning (T1557.002). A senior asks what the ATT&CK page itself says about them before approving.</p>", "question": "What caveat does the page attach to static ARP entries?", "hint": "The caveat is about a size limit, not a technology limit.", "options": [{"t": "Implementing them may be infeasible for large networks", "correct": true}, {"t": "They only work on Wi-Fi networks"}, {"t": "They permanently replace the need for switches"}, {"t": "They are required by every audit framework"}], "correct": "Static ARP entries may be infeasible at large scale.", "explain": "The Use line for T1557.002 recommends static ARP entries and immediately notes that implementing them may be infeasible for large networks — every host-to-host mapping would have to be managed by hand. Saying they only work on Wi-Fi or that they replace switches misreads the mechanism entirely. Quoting the caveat is what a real design review needs: it turns a blanket recommendation into a scoped decision, for example applying static entries only on core infrastructure.", "study": "The Use line for T1557.002 on the M1035 page."}];

  ['intro','exam','review','results'].forEach(function(v){
    var node = $(v);
    if (node) node.classList.toggle('hidden', v !== name);
  });
}

/* ---------- timer state machine: IDLE / RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
var tickHandle = null;
function startTimer(){ if (tickHandle) clearInterval(tickHandle); tickHandle = setInterval(onTick, 1000); }
function onTick(){
  if (!S) return;
  var t = S.timer;
  if (t.state === 'RUNNING'){
    t.remaining--;
    if (t.remaining <= 0){ t.remaining = 0; renderHeader(); timerEnded(); return; }
  } else if (t.state === 'PAUSED_MANUAL'){ t.manualSec++; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ t.autoSec++; }
  renderHeader();
}
function setTimerState(st){ if (!S) return; S.timer.state = st; renderHeader(); }
function timerEnded(){
  S.timer.state = 'ENDED'; renderHeader();
  if (S.phase === 'exam' || S.phase === 'review'){ finishExam(true); }
}

/* ---------- header ---------- */
function renderHeader(){
  var total = EX.length;
  var idx = Math.min(S.cur + 1, total);
  $('hCount').textContent = 'Exercise ' + idx + ' of ' + total;
  var b = $('hSev'); b.textContent = META.severity; b.className = 'badge ' + META.sevClass;
  var t = S.timer;
  $('hTimer').textContent = fmtClock(t.remaining);
  var st = $('hTState');
  if (t.state === 'RUNNING'){ st.textContent = '\u25B6 RUNNING'; st.className = 'chip c-run'; }
  else if (t.state === 'PAUSED_MANUAL'){ st.textContent = '\u23F8 PAUSED \u2014 manual (press Resume)'; st.className = 'chip c-paused'; }
  else if (t.state === 'PAUSED_AUTO_CHECK'){ st.textContent = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.className = 'chip c-paused'; }
  else if (t.state === 'ENDED'){ st.textContent = '\u25A0 ENDED'; st.className = 'chip c-ended'; }
  else { st.textContent = '\u2014 not started'; st.className = 'chip c-ended'; }
  var answered = 0, sum = 0, k;
  for (k in S.answered){ if (S.answered[k]){ answered++; sum += S.credit[k]; } }
  var sc = $('hScore');
  if (answered > 0){
    var pct = Math.round((sum / answered) * 100);
    sc.textContent = sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + pct + '%';
  } else { sc.textContent = '0.0 / 0 \u00B7 \u2014'; }
  var prog = S.phase === 'results' ? total : Math.max(0, S.cur);
  $('hBar').style.width = (total ? (prog / total) * 100 : 0) + '%';
  var canPause = (t.state === 'RUNNING' || t.state === 'PAUSED_AUTO_CHECK') && S.phase === 'exam';
  $('hPause').disabled = !canPause;
}

/* ---------- exam flow ---------- */
function startExam(){
  S.phase = 'exam';
  showView('exam');
  setTimerState('RUNNING');
  startTimer();
  renderExercise();
}

function renderExercise(){ renderExerciseAt(curIdx()); }

function renderExerciseAt(idx){

  });

  n.addEventListener('click', onNext);

  f.addEventListener('click', onFinalSubmit);

  $('btnFinal').classList.add('hidden');
  $('fbBlock').classList.add('hidden');

}

function onCheck(){
  if (!CUR.widget || CUR.checked) return;
  var idx = curIdx(); var ex = EX[idx];
  var r = CUR.widget.grade();
  var N = r.N || 1;
  var credit = Math.max(0, (r.H - r.W) / N);
  if (S.hintUsed[idx]) credit = Math.max(0, credit - 0.10);
  CUR.checked = true;
  S.autoActive = true;
  setTimerState('PAUSED_AUTO_CHECK'); /* pause first — feedback renders into the paused state */
  if (CUR.widget.lock) CUR.widget.lock();
  S.credit[idx] = credit; S.answered[idx] = true;
  S.skipped = S.skipped.filter(function(x){ return x !== idx; });
  renderFeedback(ex, r, credit, N);
  $('btnCheck').classList.add('hidden');
  var last = (!S.reviewReturn) && (S.cur >= S.order.length - 1);
  if (last){ $('btnFinal').classList.remove('hidden'); }
  else { $('btnNext').classList.remove('hidden'); }
  $('hSkip').disabled = true;
  $('hHint').disabled = true;
  renderHeader();
  try { $('fbBlock').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

function renderFeedback(ex, r, credit, N){
  var fb = $('fbBlock'); fb.classList.remove('hidden');
  var head = $('fbHead');
  var cls, label;
  if (credit >= 0.999){ cls = 'v-correct'; label = '\u2713 CORRECT'; }
  else if (credit > 0){ cls = 'v-partial'; label = '\u2713 PARTIALLY CORRECT'; }
  else { cls = 'v-incorrect'; label = '\u2717 INCORRECT'; }
  head.className = cls; head.textContent = label;
  var body = $('fbBody'); body.innerHTML = '';
  if (N > 1){
    body.appendChild(hv('div','credit-line', 'credit ' + credit.toFixed(2) + ' \u2014 ' + r.H + '/' + N + ' items \u00B7 formula: max(0, (H \u2212 W) / N) with H=' + r.H + ' correct, W=' + r.W + ' wrong'));
  }
  if (r.correctText){ body.appendChild(hv('div','correct-line','<strong>Correct answer:</strong> ' + r.correctText)); }
  (r.rows || []).forEach(function(row){
    var d = el('div','fb-row');
    var ic, wrd, c2;
    if (row.ok === 'c'){ ic = '\u2713'; wrd = 'Correct'; c2 = 'ic-ok'; }
    else if (row.ok === 'w'){ ic = '\u2717'; wrd = 'Wrong'; c2 = 'ic-no'; }
    else { ic = '\u25CB'; wrd = 'Missed'; c2 = 'ic-miss'; }
    d.appendChild(hv('span','fb-ic ' + c2, ic + ' ' + wrd));
    d.appendChild(hv('span','fb-tx', row.text + (row.note ? ' \u2014 ' + row.note : '')));
    body.appendChild(d);
  });
  body.appendChild(hv('div','explain', ex.explain));
  if (credit < 0.999 && ex.study){ body.appendChild(hv('div','study','<strong>Study next:</strong> ' + ex.study)); }
}

function onNext(){
  if (!CUR.checked) return;
  if (S.reviewReturn){
    S.reviewReturn = false; S.autoActive = false;
    setTimerState('RUNNING');
    openReview();
    return;
  }
  S.autoActive = false;
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else {
    S.cur++; setTimerState('RUNNING'); renderExercise();
  }
}
function onFinalSubmit(){
  if (S.skipped.length){ openReview(); return; } /* review skipped exercises before finishing */
  finishExam(false);
}

function onSkip(){
  if (CUR.checked) return;
  var idx = curIdx();
  if (S.skipped.indexOf(idx) === -1) S.skipped.push(idx); /* never list an exercise twice */
  if (S.reviewReturn){ S.reviewReturn = false; openReview(); return; }
  if (S.cur >= S.order.length - 1){
    if (S.skipped.length) openReview(); else finishExam(false);
  } else { S.cur++; renderExercise(); } /* timer keeps running through a skip */
}

function onHint(){
  var idx = curIdx();
  if (S.hintUsed[idx] || CUR.checked) return;
  S.hintUsed[idx] = true;
  var hp = $('hintPanel');
  hp.innerHTML = '<strong>Hint used \u2014 10% of this exercise credit will be deducted.</strong><br>' + EX[idx].hint;
  hp.classList.remove('hidden');
  $('hHint').disabled = true;
  renderHeader();
}

function onPause(){
  if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK') return;
  $('pauseOverlay').classList.remove('hidden');
  $('exArea').classList.add('hidden');
  $('hPause').textContent = '\u25B6 Resume';
  setTimerState('PAUSED_MANUAL');
}
function onResume(){
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  $('hPause').textContent = '\u23F8 Pause';
  setTimerState(S.autoActive ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase = 'review'; S.autoActive = false;
  showView('review');
  setTimerState('RUNNING'); /* timer resumes on the review screen */
  var v = $('review'); v.innerHTML = '';
  v.appendChild(hv('section','card','<h2>\u26A0 Review skipped exercises</h2>' +
    '<p>Time left on the timer: <strong class="mono">' + fmtClock(S.timer.remaining) + '</strong>. ' +
    'You can go back to any skipped exercise and answer it while time is left. ' +
    'Skipped exercises you never answer are excluded from the score \u2014 they count as neither correct nor wrong.</p>'));
  if (!S.skipped.length){
    v.appendChild(hv('section','card','<p>\u2713 No skipped exercises left.</p>'));
  } else {
    var card = el('section','card');
    S.skipped.forEach(function(idx){
      var row = el('div','rv-row');
      row.appendChild(hv('span','rv-warn','\u26A0 Skipped'));
      row.appendChild(hv('span','rv-tx', EX[idx].summary));
      var b = el('button','btn'); b.type = 'button'; b.textContent = 'Answer';
      b.addEventListener('click', function(){ reviewAnswer(idx); });
      row.appendChild(b);
      card.appendChild(row);
    });
    v.appendChild(card);
  }
  var sub = el('section','card');
  var sb = el('button','btn primary'); sb.type = 'button'; sb.textContent = 'Submit exam';
  sb.addEventListener('click', function(){ finishExam(false); });
  sub.appendChild(sb);
  v.appendChild(sub);
}
function reviewAnswer(idx){
  S.reviewReturn = true; S.rIdx = idx; S.phase = 'exam';
  showView('exam');
  renderExerciseAt(idx);
}

/* ---------- results ---------- */
function resRow(cls, label, txt){
  var d = el('div','fb-row');
  d.appendChild(hv('span','fb-ic ' + cls, label));
  d.appendChild(hv('span','fb-tx', txt));
  return d;
}
function finishExam(byTimeout){
  S.phase = 'results';
  S.timer.state = 'ENDED';
  $('pauseOverlay').classList.add('hidden');
  $('exArea').classList.remove('hidden');
  if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  var answered = 0, sum = 0, fully = 0, partial = 0, partialSum = 0, wrong = 0, k;
  for (k in S.answered){
    if (!S.answered[k]) continue;
    answered++;
    var c = S.credit[k]; sum += c;
    if (c >= 0.999) fully++;
    else if (c > 0){ partial++; partialSum += c; }
    else wrong++;
  }
  var skippedN = S.skipped.length;
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= META.passMark;
  showView('results');
  renderHeader();
  var v = $('results'); v.innerHTML = '';
  v.appendChild(hv('section','card res-head',
    '<h2>Results \u2014 ' + META.introTitle + '</h2>' +
    '<div class="res-score mono">' + sum.toFixed(1) + ' / ' + answered + ' \u00B7 ' + percent + '%</div>' +
    (byTimeout ? '<p class="res-note">\u23F1 Time is up. Unanswered exercises were excluded from the score.</p>' : '') +
    '<div class="res-verdict ' + (passed ? 'v-correct' : 'v-incorrect') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<p>' + (passed
      ? 'Well done. You reached the ' + META.passMark + '% pass mark on this exam.'
      : 'You did not reach the ' + META.passMark + '% pass mark this time. Read the feedback themes below, study the pointers, and retake the exam.') + '</p>'));
  var br = el('section','card');
  br.appendChild(hv('h2','','Score breakdown'));
  br.appendChild(resRow('ic-ok','\u2713 Fully correct', fully + ' exercise' + (fully === 1 ? '' : 's') + ' (credit = 1.0)'));
  br.appendChild(resRow('ic-partial','\u2713 Partially correct', partial + ' exercise' + (partial === 1 ? '' : 's') + (partial ? ' (avg partial credit ' + (partialSum / partial).toFixed(2) + ')' : '')));
  br.appendChild(resRow('ic-no','\u2717 Fully incorrect', wrong + ' exercise' + (wrong === 1 ? '' : 's') + ' (credit = 0)'));
  br.appendChild(resRow('ic-miss','\u26A0 Skipped \u2014 excluded', skippedN + ' exercise' + (skippedN === 1 ? '' : 's') + ' (not counted in numerator or denominator)'));
  var ms = S.timer.manualSec, as = S.timer.autoSec;
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 manual breaks', Math.floor(ms / 60) + ' min ' + (ms % 60) + ' s'));
  br.appendChild(resRow('ic-paused','\u23F8 Time paused \u2014 feedback review', Math.floor(as / 60) + ' min ' + (as % 60) + ' s'));
  v.appendChild(br);
  var rc = el('section','card');
  var rb = el('button','btn primary'); rb.type = 'button'; rb.textContent = '\u21BB Retake exam';
  rb.addEventListener('click', retake);
  rc.appendChild(rb);
  v.appendChild(rc);
  reportScore(sum, answered);
}
function retake(){
  S = freshState();
  startExam();
}

/* ---------- site integration ---------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* event.data.username, country, theme ('dark' \u2014 this file is dark-only), locale, topicId, batch */
  var n = event.data.username || '', c = event.data.country || '';
  var w = $('hWho');
  if (w && (n || c)) { w.textContent = 'Signed in as ' + n + (c ? ' (' + c + ')' : ''); }
});

document.addEventListener('DOMContentLoaded', init);

/* ================= M1035 exam engine — widgets ================= */
var WIDGETS = {};

function correctOf(st){ var o = st.options.filter(function(x){ return x.correct; })[0]; return o ? o.t : ''; }

/* ---------- single-choice ---------- */
WIDGETS.mc = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, oi: i }; }));
  var name = 'ex' + CURSEQ + '-mc';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var sel = null;
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) sel = opts[Number(inp.value)];
      });
      var corr = opts.filter(function(o){ return o.correct; })[0];
      var H = (sel && sel.correct) ? 1 : 0;
      var W = (sel && !sel.correct) ? 1 : 0;
      var rows;
      if (sel && sel.correct){ rows = [{ ok: 'c', text: sel.t, note: ex.answerNote || '' }]; }
      else if (sel){ rows = [{ ok: 'w', text: 'You chose: ' + sel.t, note: 'The correct answer is: ' + corr.t + (ex.answerNote ? ' \u2014 ' + ex.answerNote : '') }]; }
      else { rows = [{ ok: 'm', text: corr.t, note: ex.answerNote || '' }]; }
      return { H: H, W: W, N: 1, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- multi-select (partial credit) ---------- */
WIDGETS.multi = function(ex, box, ctl){
  var opts = shuffle(ex.options.map(function(o, i){ return { t: o.t, correct: !!o.correct, note: o.note || '', oi: i }; }));
  var name = 'ex' + CURSEQ + '-mu';
  var wrap = el('div','opts');
  opts.forEach(function(o, i){
    var lab = el('label','option-row');
    var inp = document.createElement('input');
    inp.type = 'checkbox'; inp.name = name; inp.value = String(i);
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.option-row'), function(r){
        r.classList.toggle('sel', r.querySelector('input').checked);
      });
      ctl.onReady();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
    lab.appendChild(el('span','otext', o.t));
    lab.appendChild(el('span','selmark','selected'));
    wrap.appendChild(lab);
  });
  box.appendChild(wrap);
  return {
    grade: function(){
      var picked = [];
      Array.prototype.forEach.call(wrap.querySelectorAll('input'), function(inp){
        if (inp.checked) picked.push(opts[Number(inp.value)]);
      });
      var H = 0, W = 0, N = 0, rows = [];
      opts.forEach(function(o){
        if (!o.correct) return;
        N++;
        var isSel = picked.some(function(p){ return p.oi === o.oi; });
        if (isSel){ H++; rows.push({ ok: 'c', text: o.t, note: o.note }); }
        else { rows.push({ ok: 'm', text: o.t, note: o.note || 'This item belongs in the correct answer.' }); }
      });
      picked.forEach(function(p){
        if (!p.correct){
          W++;
          rows.push({ ok: 'w', text: p.t, note: p.note || 'This option is not part of the correct answer.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match = function(ex, box, ctl){
  var left = ex.pairs.map(function(p){ return { t: p.l }; });
  var right = shuffle(ex.pairs.map(function(p, i){ return { t: p.r, ri: i }; }));
  var map = {}; var selL = -1;
  var gridEl = el('div','pair-cols');
  var lcol = el('div','pcol'); var rcol = el('div','pcol');
  var lrows = [], rrows = [];
  function render(){
    lrows.forEach(function(lr, i){
      var m = map[i];
      lr.querySelector('.msub').textContent = (m === undefined) ? '\u2192 click a partner on the right' : '\u2192 ' + right[m].t;
      lr.classList.toggle('sel', selL === i);
      lr.classList.toggle('paired', m !== undefined);
    });
    rrows.forEach(function(rr, j){
      var taken = Object.keys(map).some(function(k){ return map[k] === j; });
      rr.classList.toggle('used', taken);
    });
  }
  ex.pairs.forEach(function(p, i){
    var lr = el('div','mrow');
    lr.appendChild(el('span','olab',(i + 1) + '.'));
    lr.appendChild(el('span','otext', left[i].t));
    lr.appendChild(el('span','msub mono',''));
    lr.tabIndex = 0;
    lr.setAttribute('role','button');
    lr.setAttribute('aria-label','Match item ' + (i + 1) + ': ' + left[i].t);
    function clickL(){
      if (map[i] !== undefined){ delete map[i]; selL = -1; }
      else { selL = (selL === i ? -1 : i); }
      render(); ctl.onReady();
    }
    lr.addEventListener('click', clickL);
    lr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickL(); } });
    lrows.push(lr); lcol.appendChild(lr);
  });
  right.forEach(function(r, j){
    var rr = el('div','mrow');
    rr.appendChild(el('span','olab', String.fromCharCode(65 + j) + '.'));
    rr.appendChild(el('span','otext', r.t));
    rr.tabIndex = 0;
    rr.setAttribute('role','button');
    rr.setAttribute('aria-label','Candidate partner: ' + r.t);
    function clickR(){ if (selL >= 0){ map[selL] = j; selL = -1; render(); ctl.onReady(); } }
    rr.addEventListener('click', clickR);
    rr.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickR(); } });
    rrows.push(rr); rcol.appendChild(rr);
  });
  gridEl.appendChild(lcol); gridEl.appendChild(rcol);
  box.appendChild(hv('div','mhint','Click an item on the left, then click its partner on the right. Click a paired left item again to clear it.'));
  box.appendChild(gridEl);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.pairs.forEach(function(p, i){
        var m = map[i];
        if (m === undefined){
          rows.push({ ok: 'm', text: left[i].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        } else if (right[m].ri === i){
          H++; rows.push({ ok: 'c', text: left[i].t + ' \u2192 ' + p.r, note: p.note || '' });
        } else {
          W++; rows.push({ ok: 'w', text: left[i].t + ' \u2192 ' + right[m].t, note: 'Correct partner: ' + p.r + '. ' + (p.note || '') });
        }
      });
      return { H: H, W: W, N: ex.pairs.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ gridEl.classList.add('locked'); }
  };
};

/* ---------- ordering (partial credit per position) ---------- */
WIDGETS.order = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it, i){ return { t: it.t, note: it.note || '', ci: i }; }));
  var list = el('div','ord-list');
  function render(){
    Array.prototype.slice.call(list.querySelectorAll('.ord-item')).forEach(function(n){ list.removeChild(n); });
    items.forEach(function(it, pos){
      var row = el('div','ord-item');
      row.appendChild(el('span','ord-pos mono', String(pos + 1)));
      row.appendChild(el('span','otext', it.t));
      var up = el('button','ord-btn'); up.type = 'button'; up.textContent = '\u2191'; up.setAttribute('aria-label','Move up');
      var dn = el('button','ord-btn'); dn.type = 'button'; dn.textContent = '\u2193'; dn.setAttribute('aria-label','Move down');
      up.addEventListener('click', function(){
        if (pos > 0){ var t = items[pos - 1]; items[pos - 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      dn.addEventListener('click', function(){
        if (pos < items.length - 1){ var t = items[pos + 1]; items[pos + 1] = items[pos]; items[pos] = t; render(); ctl.onReady(); }
      });
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  box.appendChild(hv('div','mhint','Put the steps in the right order. Use the arrows to move a step up or down.'));
  box.appendChild(list);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it, pos){
        if (pos === it.ci){ H++; rows.push({ ok: 'c', text: (pos + 1) + '. ' + it.t, note: it.note }); }
        else { W++; rows.push({ ok: 'w', text: (pos + 1) + '. ' + it.t, note: 'Correct position: ' + (it.ci + 1) + '. ' + it.note }); }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- drag & drop into zones (partial credit per item) ---------- */
WIDGETS.dd = function(ex, box, ctl){
  var items = shuffle(ex.items.map(function(it){ return { t: it.t, zone: it.zone, note: it.note || '', placed: -1 }; }));
  var sel = -1;
  var bank = el('div','bank');
  var zonesWrap = el('div','zones');
  var zoneEls = ex.zones.map(function(z){
    var zd = el('div','zone');
    zd.appendChild(hv('h4','', z));
    zd.appendChild(el('div','zone-items'));
    return zd;
  });
  function paintSel(){
    Array.prototype.forEach.call(document.querySelectorAll('.ditem'), function(n){ n.classList.remove('sel'); });
  }
  function itemEl(it, i){
    var d = el('div','ditem');
    d.appendChild(el('span','otext', it.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Item: ' + it.t);
    d.setAttribute('draggable','true');
    d.addEventListener('click', function(){
      if (it.placed !== -1){ it.placed = -1; paintSel(); sel = -1; render(); ctl.onReady(); return; }
      sel = (sel === i ? -1 : i);
      paintSel();
      if (sel === i) d.classList.add('sel');
    });
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); } });
    d.addEventListener('dragstart', function(e){ sel = i; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} });
    return d;
  }
  function render(){
    bank.innerHTML = '';
    items.forEach(function(it, i){ if (it.placed === -1) bank.appendChild(itemEl(it, i)); });
    zoneEls.forEach(function(zd, z){
      var zi = zd.querySelector('.zone-items'); zi.innerHTML = '';
      items.forEach(function(it, i){ if (it.placed === z) zi.appendChild(itemEl(it, i)); });
    });
  }
  function dropOn(z){
    if (sel === -1) return;
    items[sel].placed = z; sel = -1; paintSel(); render(); ctl.onReady();
  }
  zoneEls.forEach(function(zd, z){
    zd.addEventListener('click', function(e){
      if (e.target === zd || e.target.classList.contains('zone-items') || e.target.tagName === 'H4') dropOn(z);
    });
    zd.addEventListener('dragover', function(e){ e.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop', function(e){ e.preventDefault(); zd.classList.remove('over'); dropOn(z); });
  });
  zoneEls.forEach(function(zd){ zonesWrap.appendChild(zd); });
  box.appendChild(hv('div','mhint','Click an item to select it, then click a column to place it. Click a placed item to send it back.'));
  box.appendChild(bank);
  box.appendChild(zonesWrap);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      items.forEach(function(it){
        if (it.placed === -1){
          rows.push({ ok: 'm', text: it.t, note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        } else if (it.placed === it.zone){
          H++; rows.push({ ok: 'c', text: it.t + ' \u2192 ' + ex.zones[it.zone], note: it.note });
        } else {
          W++; rows.push({ ok: 'w', text: it.t + ' \u2192 ' + ex.zones[it.placed], note: 'Correct column: ' + ex.zones[it.zone] + '. ' + it.note });
        }
      });
      return { H: H, W: W, N: items.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){
      bank.classList.add('locked');
      zoneEls.forEach(function(z){ z.classList.add('locked'); });
    }
  };
};

/* ---------- fill in the blanks from a word bank (partial credit per blank) ---------- */
WIDGETS.fill = function(ex, box, ctl){
  var slots = ex.slots.map(function(s){ return { ans: s, chip: null }; });
  var bankWords = shuffle(ex.bank.map(function(w){ return { t: w, used: false }; }));
  var sentEl = el('div','fill-sent');
  var slotBtns = [];
  ex.sentence.split(/(\{s\d+\})/).forEach(function(p){
    var m = p.match(/^\{s(\d+)\}$/);
    if (m){
      var si = Number(m[1]);
      var b = el('button','slotbtn mono'); b.type = 'button';
      b.setAttribute('aria-label','Blank ' + (si + 1) + '. Click to empty this blank.');
      b.addEventListener('click', function(){
        if (slots[si].chip){ slots[si].chip.used = false; slots[si].chip = null; render(); }
      });
      slotBtns[si] = b;
      sentEl.appendChild(b);
    } else if (p){
      sentEl.appendChild(hv('span','', p));
    }
  });
  var bankEl = el('div','bank chips');
  function render(){
    slotBtns.forEach(function(b, si){
      b.textContent = slots[si].chip ? slots[si].chip.t : '[' + (si + 1) + ']';
      b.classList.toggle('filled', !!slots[si].chip);
    });
    bankEl.innerHTML = '';
    bankWords.forEach(function(w){
      if (w.used) return;
      var c = el('button','bank-chip'); c.type = 'button'; c.textContent = w.t;
      c.addEventListener('click', function(){
        if (w.used) return;
        var empty = -1, si;
        for (si = 0; si < slots.length; si++){ if (!slots[si].chip){ empty = si; break; } }
        if (empty === -1){
          var old = slots[0].chip;
          if (old) old.used = false;
          slots[0].chip = w; w.used = true;
        } else {
          slots[empty].chip = w; w.used = true;
        }
        render(); ctl.onReady();
      });
      bankEl.appendChild(c);
    });
    if (!bankEl.children.length) bankEl.appendChild(hv('span','dim','Word bank is empty \u2014 click a filled blank to put a word back.'));
  }
  box.appendChild(hv('div','mhint','Click a word to place it in the next empty blank. Click a filled blank to return its word to the bank.'));
  box.appendChild(sentEl);
  box.appendChild(bankEl);
  render();
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      slots.forEach(function(s, i){
        if (!s.chip){ rows.push({ ok: 'm', text: 'Blank ' + (i + 1), note: 'Correct word: ' + s.ans }); }
        else if (s.chip.t === s.ans){ H++; rows.push({ ok: 'c', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Blank ' + (i + 1) + ': ' + s.chip.t, note: 'Correct word: ' + s.ans }); }
      });
      return { H: H, W: W, N: slots.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ sentEl.classList.add('locked'); bankEl.classList.add('locked'); }
  };
};

/* ---------- spot the flaw: flag lines (partial credit) ---------- */
WIDGETS.spot = function(ex, box, ctl){
  var flags = ex.lines.map(function(){ return false; });
  var list = el('div','lines');
  ex.lines.forEach(function(ln, i){
    var d = el('div','line');
    d.appendChild(el('span','flagmark','\u2691'));
    d.appendChild(hv('span','line-tx mono', ln.t));
    d.tabIndex = 0;
    d.setAttribute('role','button');
    d.setAttribute('aria-label','Flag this line');
    function tog(){ flags[i] = !flags[i]; d.classList.toggle('flag', flags[i]); ctl.onReady(); }
    d.addEventListener('click', tog);
    d.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } });
    list.appendChild(d);
  });
  box.appendChild(hv('div','mhint','Click a line to flag it. Click it again to unflag. Flag every line the question asks for.'));
  box.appendChild(list);
  var N = ex.lines.filter(function(l){ return l.bad; }).length;
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.lines.forEach(function(ln, i){
        var tx = stripTags(ln.t);
        if (ln.bad){
          if (flags[i]){ H++; rows.push({ ok: 'c', text: tx, note: ln.note || '' }); }
          else { rows.push({ ok: 'm', text: tx, note: ln.note || '' }); }
        } else if (flags[i]){
          W++; rows.push({ ok: 'w', text: tx, note: ln.note || 'This line is fine \u2014 it should not have been flagged.' });
        }
      });
      return { H: H, W: W, N: N, rows: rows, correctText: ex.correct };
    },
    lock: function(){ list.classList.add('locked'); }
  };
};

/* ---------- branching decision drill (each step is one scored item, graded at final Check) ---------- */
WIDGETS.branch = function(ex, box, ctl){
  var step = 0, picks = [];
  var wrap = el('div','branch');
  function renderStep(){
    wrap.innerHTML = '';
    if (step >= ex.steps.length){
      wrap.appendChild(hv('div','mhint','\u2713 All steps answered. Press Check to grade the whole exercise \u2014 the timer will pause for feedback.'));
      ctl.onReady();
      return;
    }
    var st = ex.steps[step];
    var card = el('div','step-card');
    card.appendChild(hv('div','step-chip','STEP ' + (step + 1) + ' OF ' + ex.steps.length));
    if (st.ctx) card.appendChild(hv('div','step-ctx', st.ctx));
    card.appendChild(hv('p','q-text', st.q));
    var opts = shuffle(st.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    var name = 'ex' + CURSEQ + '-st' + step;
    var ow = el('div','opts');
    var picked = -1;
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picked = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        btn.disabled = false;
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    var btn = el('button','btn'); btn.type = 'button';
    btn.textContent = 'Confirm step ' + (step + 1);
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (picked < 0) return;
      picks[step] = opts[picked];
      step++;
      renderStep();
    });
    card.appendChild(btn);
    wrap.appendChild(card);
  }
  renderStep();
  box.appendChild(hv('div','mhint','Answer every step. Intermediate confirms do not grade anything \u2014 everything is scored at the final Check.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.steps.forEach(function(st, i){
        var p = picks[i];
        if (!p){ rows.push({ ok: 'm', text: 'Step ' + (i + 1), note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
        else if (p.correct){ H++; rows.push({ ok: 'c', text: 'Step ' + (i + 1) + ': ' + p.t, note: st.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: 'Step ' + (i + 1) + ': ' + p.t, note: 'Correct: ' + correctOf(st) + '. ' + (st.note || '') }); }
      });
      return { H: H, W: W, N: ex.steps.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- SOC triage queue: one decision per alert (partial credit per alert) ---------- */
WIDGETS.triage = function(ex, box, ctl){
  var wrap = el('div','triage');
  var picks = ex.alerts.map(function(){ return -1; });
  var optionSets = [];
  ex.alerts.forEach(function(a, ai){
    var card = el('div','alert-card');
    card.appendChild(hv('div','alert-title', a.title));
    if (a.html) card.appendChild(hv('div','alert-log', a.html));
    var opts = shuffle(a.options.map(function(o){ return { t: o.t, correct: !!o.correct }; }));
    optionSets.push(opts);
    var name = 'ex' + CURSEQ + '-al' + ai;
    var ow = el('div','opts');
    opts.forEach(function(o, i){
      var lab = el('label','option-row');
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = name; inp.value = String(i);
      inp.addEventListener('change', function(){
        picks[ai] = i;
        Array.prototype.forEach.call(ow.querySelectorAll('.option-row'), function(r){
          r.classList.toggle('sel', r.querySelector('input').checked);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','olab', String.fromCharCode(65 + i) + '.'));
      lab.appendChild(el('span','otext', o.t));
      lab.appendChild(el('span','selmark','selected'));
      ow.appendChild(lab);
    });
    card.appendChild(ow);
    wrap.appendChild(card);
  });
  box.appendChild(hv('div','mhint','Choose one action for every alert, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.alerts.forEach(function(a, ai){
        var p = picks[ai];
        if (p < 0){ rows.push({ ok: 'm', text: a.title, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
        else if (optionSets[ai][p].correct){ H++; rows.push({ ok: 'c', text: a.title, note: a.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: a.title + ' \u2014 chose: ' + optionSets[ai][p].t, note: 'Correct: ' + correctOf(a) + '. ' + (a.note || '') }); }
      });
      return { H: H, W: W, N: ex.alerts.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

/* ---------- coverage board: one column choice per row (partial credit per row) ---------- */
WIDGETS.grid = function(ex, box, ctl){
  var wrap = el('div','gridt');
  var picks = ex.rows.map(function(){ return -1; });
  ex.rows.forEach(function(r, ri){
    var row = el('div','grid-row');
    row.appendChild(el('span','grid-tx', r.t));
    var togs = el('div','gtogs');
    ex.cols.forEach(function(c, ci){
      var b = el('button','gtog'); b.type = 'button'; b.textContent = c;
      b.setAttribute('aria-label', r.t + ' \u2014 choose ' + c);
      b.addEventListener('click', function(){
        picks[ri] = ci;
        Array.prototype.forEach.call(togs.querySelectorAll('.gtog'), function(n, k){
          n.classList.toggle('sel', k === ci);
        });
        if (picks.every(function(p){ return p >= 0; })) ctl.onReady();
      });
      togs.appendChild(b);
    });
    row.appendChild(togs);
    wrap.appendChild(row);
  });
  box.appendChild(hv('div','mhint','Choose one column for every row, then press Check once.'));
  box.appendChild(wrap);
  return {
    grade: function(){
      var H = 0, W = 0, rows = [];
      ex.rows.forEach(function(r, ri){
        var p = picks[ri];
        if (p < 0){ rows.push({ ok: 'm', text: r.t, note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
        else if (p === r.col){ H++; rows.push({ ok: 'c', text: r.t + ' \u2014 ' + ex.cols[r.col], note: r.note || '' }); }
        else { W++; rows.push({ ok: 'w', text: r.t + ' \u2014 ' + ex.cols[p], note: 'Correct: ' + ex.cols[r.col] + '. ' + (r.note || '') }); }
      });
      return { H: H, W: W, N: ex.rows.length, rows: rows, correctText: ex.correct };
    },
    lock: function(){ wrap.classList.add('locked'); }
  };
};

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
