/* ---------------- results ---------------- */
function showResults(){
  closeWidget(true);tStop();T.state='ENDED';
  S.phase='results';
  var old=$('#exroot');if(old)old.remove();
  var r=$('#revroot');if(r)r.remove();
  var fb=$('#fb');if(fb)fb.remove();
  var answered=0,sum=0,full=0,part=0,zero=0,partAvg=0,partSum=0;
  S.order.forEach(function(id){
    if(S.answered[id]){answered++;sum+=S.credits[id];
      if(S.credits[id]>=0.999)full++;
      else if(S.credits[id]>0){part++;partSum+=S.credits[id];}
      else zero++;}
  });
  if(part>0)partAvg=partSum/part;
  var skippedN=S.order.length-answered;
  var percent=answered>0?Math.round(sum/answered*100):0;
  var pass=percent>=EXAM.passMark;
  var root=el('div');root.id='resroot';
  var c1=el('div','card cert'+(pass?'':' fail'));
  c1.innerHTML='<div class="bigverdict" style="color:'+(pass?'var(--state-correct)':'var(--state-incorrect)')+'">'+(pass?'&#10003; PASS':'&#10005; FAIL')+'</div>'+
    '<div style="font-size:20px">Final score: <b>'+sum.toFixed(1)+' / '+answered+'</b> &nbsp;&mdash;&nbsp; <b class="mono">'+percent+'%</b> <span class="muted">(pass mark 70%)</span></div>'+
    (pass?
      '<p style="margin-top:10px">Certificate-style achievement: you passed the '+EXAM.severity+' exam for '+esc(EXAM.objectId)+' — '+esc(EXAM.objectName)+'. Your result has been reported to the platform.</p>'
      :'<p style="margin-top:10px">You did not reach the pass mark this time. Review the explanations you saw, then retake the exam — questions and answers will be shuffled again.</p>');
  var c2=el('div','card');
  c2.innerHTML='<h3>Breakdown</h3><div class="resgrid">'+
    '<div class="rescard"><div class="num" style="color:var(--state-correct)">'+full+'</div><div class="lab">&#10003; Fully correct</div></div>'+
    '<div class="rescard"><div class="num" style="color:var(--state-partial)">'+part+'</div><div class="lab">&#10003; Partially correct'+(part>0?' (avg '+partAvg.toFixed(2)+')':'')+'</div></div>'+
    '<div class="rescard"><div class="num" style="color:var(--state-incorrect)">'+zero+'</div><div class="lab">&#10005; Fully incorrect</div></div>'+
    '<div class="rescard"><div class="num" style="color:var(--state-skipped)">'+skippedN+'</div><div class="lab">&#9888; Skipped — excluded</div></div>'+
    '</div>'+
    '<hr class="sep"><div class="small">Time used: <b class="mono">'+fmtT(EXAM.timerMinutes*60-T.remain)+'</b> of '+fmtT(EXAM.timerMinutes*60)+
    ' &nbsp;|&nbsp; &#9208; Manual pause total: <b class="mono">'+fmtT(T.manualSecs)+'</b>'+
    ' &nbsp;|&nbsp; &#9208; Feedback-review pause total: <b class="mono">'+fmtT(T.autoSecs)+'</b></div>';
  var c3=el('div','card');
  c3.innerHTML='<button class="btn primary" id="bretake" style="width:100%">&#8635; Retake Exam</button>';
  root.appendChild(c1);root.appendChild(c2);root.appendChild(c3);
  $('#app').insertBefore(root,$('#exsentinel'));
  $('#bretake').addEventListener('click',retake);
  renderHeader();
  $('#hdr').classList.add('hidden');$('#pbar').classList.add('hidden');
  toTop();
  reportScore(sum,answered);
}
function retake(){
  S.attempt++;S.order=shuffle(EXS.map(function(e,i){return i;}));
  EXS.forEach(function(e){delete e._done;});/* widgets are rebuilt; clear answered-locks */
  S.idx=0;S.credits={};S.answered={};S.skipped={};S.skipOrder=[];S.hintUsed={};S.reviewOpen=false;
  T.remain=EXAM.timerMinutes*60;T.manualSecs=0;T.autoSecs=0;T._manAt=null;T._autoAt=null;T._autoElapsed=null;S._prevAuto=false;
  T.state='IDLE';tStop();
  var r=$('#resroot');if(r)r.remove();
  $('#hdr').classList.remove('hidden');$('#pbar').classList.remove('hidden');
  S.phase='exam';renderHeader();tRun();renderExercise();
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      batch:EXAM.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'';
  if(S.phase==='exam'||S.phase==='review')renderHeader();
});
/* ============================================================
   INTRO SCREEN (exactly four sections)
   ============================================================ */
function renderIntro(){
  var rootEl=$('#introroot');rootEl.innerHTML='';
  var head=el('div','card');
  head.innerHTML='<div class="intro-head"><h1>'+esc(INTRO.examTitle)+'</h1><span class="badge '+(SEV_CLASS[EXAM.severity]||'easy')+'">'+EXAM.severity+'</span></div>'+
    '<div style="font-size:15.5px"><b>'+esc(EXAM.objectId)+' — '+esc(EXAM.objectName)+'</b> <span class="muted">(MITRE ATT&amp;CK '+esc(INTRO.objectType)+')</span></div>'+
    '<div class="facts">'+
    '<span class="f" title="Number of exercises">&#128218; <b>'+EXS.length+'</b> exercises</span>'+
    '<span class="f" title="Estimated time">&#9201; <b>'+EXAM.timerMinutes+' min</b> estimated &mdash; timer budget <b class="mono">'+fmtT(EXAM.timerMinutes*60)+'</b></span>'+
    '<span class="f" title="Pass mark">&#127942; Pass mark <b>70%</b></span>'+
    '<span class="f" title="Scoring">&#12296;1&#12297; Partial credit on multi-answer exercises</span>'+
    '</div>';
  var learn=el('div','card');
  learn.innerHTML='<h2>&#127891; What you will learn here</h2>'+INTRO.learn;
  var kw=el('div','card');
  var kwh='<h2>&#128273; Keywords covered in this exam</h2><p class="small">Every keyword below is exercised by at least one exercise in this file.</p>';
  INTRO.keywords.forEach(function(t){
    kwh+='<div class="kw-theme"><h4>'+esc(t.theme)+'</h4><div class="chips">'+t.items.map(function(i){return '<span class="chip">'+esc(i)+'</span>';}).join('')+'</div></div>';
  });
  kw.innerHTML=kwh;
  var types=[];
  EXS.forEach(function(e){if(types.indexOf(e.type)===-1)types.push(e.type);});
  var typesHtml=types.map(function(t){return '<li>'+TYPE_LABELS[t]+'</li>';}).join('');
  var how=el('div','card');
  how.innerHTML='<h2>&#9881; How this exam works</h2><ul class="howlist">'+
    '<li><b>Passing score: 70%.</b> Your score is computed only over the exercises you actually answered. A skipped-and-never-answered exercise is excluded from both the score and the total.</li>'+
    '<li><b>Exercise types in this file:</b><ul class="howlist">'+typesHtml+'</ul></li>'+
    '<li><b>Timer:</b> a '+EXAM.timerMinutes+' minute countdown runs at the top. The <b>Pause</b> button stops the timer and hides the exercise (a real break). Pressing <b>Check</b> also stops the timer automatically: the exercise and its feedback stay visible, and the timer only restarts when you press <b>Next</b>. Use that time to read the explanation — it is unlimited and free.</li>'+
    '<li><b>Partial credit:</b> multi-answer exercises are scored item by item as max(0, (H &minus; W) / N): correct items count for you, wrong selections subtract. Selecting everything is worth 0, not full marks.</li>'+
    '<li><b>Hints:</b> at most one per exercise. A hint costs 10% of that exercise credit (subtracted after grading, never below zero).</li>'+
    '<li><b>Skips:</b> every exercise has a Skip button. Skipping is free, but before you finish you will get a Review-skipped screen where you can answer any skipped exercise while time remains.</li>'+
    '</ul>'+
    '<button class="btn primary" id="startbtn" type="button">&#9654; Start the exam</button>';
  rootEl.appendChild(head);rootEl.appendChild(learn);rootEl.appendChild(kw);rootEl.appendChild(how);
  $('#startbtn').addEventListener('click',startExam);
}
function startExam(){
  S.phase='exam';
  var ir=$('#introroot');if(ir)ir.remove();
  renderHeader();$('#hdr').classList.remove('hidden');$('#pbar').classList.remove('hidden');
  T.remain=EXAM.timerMinutes*60;renderTimer();tRun();
  renderExercise();
}
/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  var app=$('#app');
  app.innerHTML='<div id="introroot"></div><div id="exsentinel"></div>';
  if(!$('#hdr')){document.body.insertAdjacentHTML('afterbegin','<div id="hdr" class="hidden"><div class="wrap"></div></div><div id="pbar" class="hidden"><div class="fill"></div></div>');}
  document.body.insertAdjacentHTML('beforeend','<div id="veil" class="pauseveil hidden"></div>');
  S.order=shuffle(EXS.map(function(e,i){return i;}));
  T.remain=EXAM.timerMinutes*60;
  renderIntro();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
