<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adversary Simulation — EXTREMELY HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "adversary-simulation", "batch": 4, "title": "Adversary Simulation — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 16, "estimatedMinutes": 75, "passMark": 70}</script>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#121d33; --panel2:#16233d; --line:#25365c; --line2:#31456f;
  --txt:#e7eef9; --muted:#9db0cf; --dim:#7288ab;
  --blue:#4f8ef7; --amber:#f5a623; --green:#2fd07a; --red:#f0564a; --orange:#f97316; --grey:#8ea3c0;
  --sev:#2fd07a; --sevbg:rgba(47,208,122,.14);
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --rad:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *,*::before,*::after{transition:none!important;animation:none!important} }
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--blue)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1060px,94vw);margin:0 auto}

/* ---------- persistent header ---------- */
#hdr{position:sticky;top:0;z-index:50;background:rgba(10,16,30,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hdr .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0}
.hchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;min-height:36px}
.hchip .k{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:6px 12px;font-size:13.5px;background:var(--sevbg);color:var(--sev);border:1px solid var(--sev);min-height:36px}
.timer{font-family:var(--mono);font-size:18px;font-weight:700;min-width:96px;text-align:center}
.timer.low{color:var(--amber)} .timer.crit{color:var(--red)}
.tmode{font-size:12.5px;color:var(--muted);display:block;line-height:1.2}
.tmode.running{color:var(--green)} .tmode.pausedyou{color:var(--amber)} .tmode.pausedfb{color:var(--blue)}
.score{font-family:var(--mono);font-weight:700}
.spacer{flex:1}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 16px;font-size:14.5px;font-weight:600;min-height:44px;min-width:44px;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--panel2);border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#2b64d9,#1d4aa8);border-color:#3a76ea;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#3370e8,#2054b8)}
.btn.good{background:linear-gradient(180deg,#1f9d5f,#187a49);border-color:#2fd07a;color:#fff}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sev));transition:width .5s ease}

/* ---------- generic blocks ---------- */
main{flex:1;padding:22px 0 60px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:30px;line-height:1.2;margin:0 0 10px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin:14px 0}
.card.tint{background:linear-gradient(180deg,rgba(79,142,247,.07),var(--panel))}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)}
ul.clean{margin:6px 0;padding-left:20px} ul.clean li{margin:4px 0}

/* ---------- intro / results ---------- */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 2px}
.hero .logo{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 30% 30%,var(--sev),transparent 70%),var(--panel2);border:1px solid var(--sev);display:flex;align-items:center;justify-content:center;font-size:26px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted);margin:2px 4px 2px 0;background:var(--panel)}
.themewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.theme{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.theme h4{margin:0 0 6px;font-size:14.5px;color:var(--blue)}
.theme ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.theme li{margin:3px 0}
.notice{border-left:4px solid var(--blue);background:rgba(79,142,247,.08);border-radius:0 var(--rad) var(--rad) 0;padding:10px 14px;margin:12px 0}
.notice.amber{border-color:var(--amber);background:rgba(245,166,35,.08)}
.notice.green{border-color:var(--green);background:rgba(47,208,122,.08)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;font-size:14.5px}
.rule b{color:var(--txt)}
.cert{border:2px solid var(--sev);background:radial-gradient(circle at 85% 10%,rgba(47,208,122,.12),transparent 60%),var(--panel);border-radius:14px;padding:26px;text-align:center}
.cert .big{font-size:44px;font-weight:800;font-family:var(--mono)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-family:var(--mono)}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.ok .n{color:var(--green)} .stat.part .n{color:var(--amber)} .stat.bad .n{color:var(--red)} .stat.skip .n{color:var(--grey)}
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rpt th{background:var(--panel2);color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- exam exercise layout ---------- */
.exhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 4px}
.steptag{font-family:var(--mono);font-size:12.5px;border:1px dashed var(--line2);border-radius:6px;padding:3px 9px;color:var(--muted)}
.block{border:1px solid var(--line);border-radius:var(--rad);margin:12px 0;background:var(--panel);overflow:hidden}
.block>.bh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;cursor:default}
.block>.bh .ic{font-size:16px}
.block>.bh .sum{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block>.bh button.tgl{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:4px 14px;cursor:pointer;font-size:12.5px;min-height:44px}
.block>.bb{padding:14px 16px}
.block.scenario>.bh{background:rgba(79,142,247,.10);color:#9cc0ff;border-bottom-color:rgba(79,142,247,.25)}
.block.scenario>.bb{background:linear-gradient(180deg,rgba(79,142,247,.05),transparent)}
.block.question>.bh{background:rgba(245,166,35,.10);color:#ffcf7d;border-bottom-color:rgba(245,166,35,.25)}
.block.question>.bb{background:linear-gradient(180deg,rgba(245,166,35,.05),transparent)}
.block.question .qt{font-weight:700;font-size:17px}
.block.answer>.bh{background:rgba(47,208,122,.10);color:#7fe0ac;border-bottom-color:rgba(47,208,122,.25)}
.block.answer>.bb{background:linear-gradient(180deg,rgba(47,208,122,.04),transparent)}
.artefact{border:1px solid var(--line2);border-radius:8px;margin:10px 0;background:#0a1322}
.artefact>.ah{padding:7px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.artefact>.ab{padding:10px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.artefact.code>.ab{font-family:var(--mono);font-size:14.5px;line-height:1.5}
.hintbox{border:1px dashed var(--amber);background:rgba(245,166,35,.07);color:#ffd28a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;cursor:pointer;color:var(--txt);font-size:15.5px;min-height:44px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .lab{font-family:var(--mono);font-weight:700;color:var(--blue);flex:0 0 auto}
.opt.sel{border-color:var(--green);background:rgba(47,208,122,.08)}
.opt.sel .lab{color:var(--green)}
.opt.pick{border-color:var(--blue);background:rgba(79,142,247,.08)}
.multinote{font-size:13px;color:var(--amber);border:1px dashed var(--amber);border-radius:7px;padding:6px 10px;margin:0 0 10px;display:inline-block}

/* log viewer */
.viewer{border:1px solid var(--line2);border-radius:8px;background:#070e1a;margin:10px 0;overflow:hidden}
.viewer .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer .vh input{flex:1;min-width:180px;background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:8px 12px;font-family:var(--mono);font-size:14px;min-height:44px}
.viewer .vh .cnt{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.loglines{max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:14px;line-height:1.6}
.loglines .ln{padding:2px 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent}
.loglines .ln:hover{background:rgba(79,142,247,.06)}
.loglines .ln.info{color:#c9d6ee} .loglines .ln.warn{color:#ffd28a} .loglines .ln.err{color:#ff9d94} .loglines .ln.ok{color:#8fe6b8}
.noline{padding:10px 12px;color:var(--muted);font-size:13.5px}

/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.dnd{grid-template-columns:1fr}}
.bank,.zones{display:flex;flex-direction:column;gap:9px}
.ztitle{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:14.5px;cursor:grab;min-height:44px;transition:border-color .12s,background .12s}
.chip:active{cursor:grabbing}
.chip.sel{border-color:var(--green);background:rgba(47,208,122,.10)}
.chip.ghosted{opacity:.35}
.zone{border:1.5px dashed var(--line2);border-radius:9px;background:rgba(255,255,255,.015);min-height:64px;display:flex;flex-direction:column;gap:7px;padding:9px 11px}
.zone.hot{border-color:var(--green);background:rgba(47,208,122,.07)}
.zone>.zl{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.zone .chip{cursor:pointer}

/* ordering */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;cursor:grab}
.orow.dragging{opacity:.4}
.orow .pos{font-family:var(--mono);font-weight:700;color:var(--blue);width:26px;text-align:center}
.orow .ot{flex:1;font-size:14.5px}
.orow .mv{display:flex;flex-direction:row;gap:6px}
.orow .mv button{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:6px;width:44px;height:44px;cursor:pointer;font-size:15px;min-height:44px;min-width:44px;padding:0}
.orow .mv button:hover{border-color:var(--blue)}

/* blanks */
.blanks{font-size:14.5px;line-height:2;white-space:pre-wrap;font-family:var(--mono)}
.blanks select{background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:6px 10px;font-family:var(--sans);font-size:14.5px;min-height:44px;margin:0 3px}
.wordbank{margin-top:10px;font-size:13.5px;color:var(--muted)}
.wordbank .pill{font-family:var(--mono)}

/* terminal */
.term{background:#050a14;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.term .th{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.term .dot{width:10px;height:10px;border-radius:99px;background:var(--red);display:inline-block}
.term .dot.y{background:var(--amber)} .term .dot.g{background:var(--green)}
.term .sc{max-height:280px;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .sc .cline{color:#8fe6b8;white-space:pre-wrap;word-break:break-word}
.term .sc .oline{color:#c9d6ee;white-space:pre-wrap;word-break:break-word}
.term .sc .eline{color:#ff9d94;white-space:pre-wrap;word-break:break-word}
.term .inrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 12px}
.term .inrow .pr{font-family:var(--mono);color:var(--green);font-size:14px;white-space:nowrap}
.term .inrow input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-size:14.5px;min-height:44px}
.term .inrow input:focus-visible{outline:none}
.termwrap .runb{margin-left:8px}
.syntax{border:1px solid var(--line2);border-radius:8px;background:rgba(79,142,247,.05);padding:10px 14px;margin:10px 0;font-size:14px}
.syntax .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:5px}
.syntax code{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13.5px}
.exclock{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);background:rgba(240,86,74,.08);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-weight:700;font-size:14.5px;margin:4px 0}

/* spot the mistake */
.codelines{font-family:var(--mono);font-size:14.5px;background:#070e1a;border:1px solid var(--line2);border-radius:8px;padding:10px 0;max-height:420px;overflow:auto}
.cl{display:flex;gap:0;cursor:pointer;border-left:3px solid transparent}
.cl:hover{background:rgba(79,142,247,.06)}
.cl.sel{border-left-color:var(--green);background:rgba(47,208,122,.09)}
.cl .no{color:var(--dim);padding:2px 10px 2px 12px;user-select:none;min-width:44px;text-align:right}
.cl .tx{padding:2px 12px;white-space:pre-wrap;word-break:break-word}

/* triage */
.queue{display:flex;flex-direction:column;gap:12px}
.alert{border:1px solid var(--line2);border-left:4px solid var(--amber);background:var(--panel2);border-radius:9px;padding:12px 14px}
.alert .ahd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.alert .ahd .aid{font-family:var(--mono);font-weight:700;color:var(--amber)}
.alert .ahd .at{font-weight:700}
.alert .ad{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.segrow{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:44px}
.seg:hover{border-color:var(--blue)}
.seg.on{border-color:var(--green);color:var(--green);background:rgba(47,208,122,.08);font-weight:700}

/* feedback */
.fb{border-radius:var(--rad);border:1px solid;margin:14px 0;overflow:hidden}
.fb>.fh{display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb .fbb{padding:14px 16px}
.fb.correct{border-color:var(--green)} .fb.correct>.fh{background:rgba(47,208,122,.12);color:var(--green)}
.fb.partial{border-color:var(--amber)} .fb.partial>.fh{background:rgba(245,166,35,.12);color:var(--amber)}
.fb.wrong{border-color:var(--red)} .fb.wrong>.fh{background:rgba(240,86,74,.12);color:var(--red)}
.fb.excluded{border-color:var(--grey)} .fb.excluded>.fh{background:rgba(142,163,192,.12);color:var(--grey)}
.fb .pts{margin-left:auto;font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.25);border-radius:7px;padding:3px 10px}
.fbsub{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-weight:700}
.fbsub.ok{color:var(--green)} .fbsub.no{color:var(--red)} .fbsub.miss{color:var(--amber)}
.fbitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.fbitem b{color:var(--txt)}
.fbitem.ok{border-left:3px solid var(--green)} .fbitem.no{border-left:3px solid var(--red)} .fbitem.miss{border-left:3px solid var(--amber)}
.ansline{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.copyb{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;min-height:44px;min-width:64px}
.copyb:hover{color:var(--txt);border-color:var(--blue)}
.study{border-left:4px solid var(--blue);background:rgba(79,142,247,.07);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0 2px;font-size:14.5px}
.encourage{font-size:14.5px;color:var(--muted);margin-top:10px}

/* pause overlay */
#pauseov{position:fixed;inset:0;background:rgba(5,9,18,.97);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
#pauseov .big{font-size:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.footer-note{color:var(--dim);font-size:12.5px;text-align:center;margin-top:26px}
.greet{color:var(--green);font-weight:700}
@media (max-width:700px){
  h1{font-size:24px}
  .dnd{grid-template-columns:1fr}
  .block>.bb{padding:12px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="wrap">
      <div class="row">
        <span class="hchip">&#128760; <b>Adversary Simulation</b></span>
        <span class="badge" id="hbadge">&#9733; EASY</span>
        <span class="hchip" id="hcount">Exercise 0 of 0</span>
        <span class="hchip"><span><span class="timer" id="htimer">--:--</span><span class="tmode" id="htmode">&#8212; not started</span></span></span>
        <span class="hchip"><span class="k">Score</span> <span class="score" id="hscore">0 / 0</span></span>
        <span class="spacer"></span>
        <button class="btn" id="bhint" title="Open a hint (costs 10% of this exercise)">&#128161; Hint</button>
        <button class="btn" id="bpause" title="Pause the timer and hide the exercise">&#9208; Pause</button>
        <button class="btn warn" id="bskip" title="Move this exercise to the skipped pool">&#9193; Skip</button>
        <button class="btn ghost" id="bfinish" title="Go to review / finish">&#10074;&#10074; Finish</button>
      </div>
      <div class="progress"><i id="hprog"></i></div>
    </div>
  </header>
  <main><div class="wrap" id="main"></div></main>
</div>

<script>
"use strict";
var EXAM = {"meta":{"topicId":"adversary-simulation","batch":4,"title":"Adversary Simulation — EXTREMELY HARD","difficulty":"extremely-hard","questionCount":16,"estimatedMinutes":75,"passMark":70},"severity":{"label":"EXTREMELY HARD","color":"#f0564a","bg":"rgba(240,86,74,.14)","desc":"Expert. Three or more concepts chained, conflicting signals you must resolve, realistic noise and missing information, business pressure, and answers with real costs. Hints only restate a constraint."},"timerSeconds":4500,"intro":{"keywordHtml":"\n<p><b>Imagine your company is a castle.<\/b> You build walls (firewalls), guards (security tools) and alarms (alerts).\nBut how do you know the guards really work? <b>Adversary simulation<\/b> answers that question. A trusted team pretends\nto be real attackers. They attack your systems <b>with written permission and clear rules<\/b>. Nobody gets hurt.\nThe goal is to find the weak spots before criminals find them.<\/p>\n<p>This work has several names: <b>red teaming<\/b>, <b>adversary emulation<\/b>, <b>purple teaming<\/b> and\n<b>Breach and Attack Simulation (BAS)<\/b>. They all share one idea: practise realistic attacks in a safe, controlled\nway, then make the defenses better. In this exam you will learn the words, the tools and the decisions used in this\nwork, step by step.<\/p>\n<p><b>Who uses it in real work?<\/b><\/p>\n<ul class=\"clean\">\n<li>The <b>red team<\/b> attacks. They copy the habits of real criminal groups, with permission.<\/li>\n<li>The <b>blue team<\/b> defends. They watch alerts in the SOC and respond.<\/li>\n<li>The <b>purple team<\/b> helps both sides talk, test and learn together.<\/li>\n<li><b>SOC analysts<\/b> watch alerts every day and use simulation results to improve them.<\/li>\n<li><b>Incident responders<\/b> practise the steps for handling a real hack.<\/li>\n<li><b>GRC teams<\/b> (governance, risk, compliance) check that the exercise follows rules and laws, and they keep the paperwork.<\/li>\n<li><b>Security engineers<\/b> fix the gaps that the exercise finds.<\/li>\n<li><b>Threat intelligence analysts<\/b> study real attacker groups and turn reports into test plans.<\/li>\n<\/ul>\n<p><b>Tools you will meet in these exercises:<\/b><\/p>\n<ul class=\"clean\">\n<li><b>MITRE ATT&amp;CK<\/b>: a free public map of attacker steps. It has <b>tactics<\/b> (the goal, like Initial Access) and <b>techniques<\/b> (the how, like T1566 Phishing).<\/li>\n<li><b>C2 frameworks<\/b> (Cobalt Strike, Caldera, Sliver): tools that send hidden commands to a test machine. The hidden link is called a <b>beacon<\/b>.<\/li>\n<li><b>Atomic Red Team<\/b>: a library of small, ready-made tests for ATT&amp;CK techniques.<\/li>\n<li><b>BAS platforms<\/b>: tools that run attack tests automatically, all the time.<\/li>\n<li><b>SIEM / log tools<\/b>: they collect events so defenders can see attacks.<\/li>\n<\/ul>\n<p><b>How a simulation works (the process):<\/b> 1) Plan the goals. 2) Write the <b>rules of engagement (RoE)<\/b> —\na paper that says what may be attacked, when, and who to call if something breaks. 3) Run the attacks and watch what\nthe defenders see. 4) Compare: which attacks were stopped? Which were missed? 5) Write a report. 6) Fix the gaps.\n7) Test again. If an attack touches something it should not, teams use <b>deconfliction<\/b>: they talk quickly to\ndecide “is this the exercise, or is it a real attacker?”<\/p>\n<p><b>Documents used in this work:<\/b> the RoE, the <b>adversary emulation plan<\/b> (which attacker group and which\nsteps to copy), the <b>detection coverage heatmap<\/b> (green = we detect it, red = we do not), the <b>after-action\nreport<\/b>, and metrics like <b>MTTD<\/b> (mean time to detect) and <b>detection rate<\/b>.<\/p>\n<p><b>Daily tasks:<\/b> run one test technique, check if an alert fired, tune a detection rule, join a purple team\nmeeting, update the heatmap, write findings, clean up test accounts and tasks.<\/p>\n<p><b>Risks it addresses:<\/b> ransomware, stolen passwords, data theft and fraud. It also has its own risks — tests\ncan break systems — so safety rules, scope limits and deconfliction are very important. That is why every good\nsimulation starts with written permission.<\/p>\n","rulesHtml":"\n<div class=\"rulegrid\">\n<div class=\"rule\"><b>&#127919; Goal.<\/b> Reach the pass mark: <b>70%<\/b>. Every exercise is worth <b>100 points<\/b>.<\/div>\n<div class=\"rule\"><b>&#10022; Multi-answer exercises.<\/b> Some exercises have more than one correct part (multi-select, several drop zones, several blanks, several steps). If you find some of the correct parts, you get some of the points. <b>Wrong picks cancel right picks<\/b>: points = (correct picks − wrong picks) ÷ total correct parts. Picking everything can never beat picking carefully.<\/div>\n<div class=\"rule\"><b>&#128161; Hints.<\/b> One hint per exercise. A hint costs <b>10% of that exercise’s points<\/b> (the best possible becomes 90). Hints give a nudge, never the answer. Using a hint does <b>not<\/b> pause the timer.<\/div>\n<div class=\"rule\"><b>&#9201; Timer — two ways it pauses.<\/b> 1) Press <b>Pause<\/b>: the timer stops and the exercise is hidden until you press Resume. 2) Press <b>Check<\/b>: the timer stops automatically so you can read the explanation with no stress — everything stays readable. The timer starts again when you press <b>Next<\/b>.<\/div>\n<div class=\"rule\"><b>&#9193; Skip.<\/b> Every exercise has a Skip button. Skipping is free. Before the exam ends you get a review screen where you can return to skipped exercises and answer them, as long as time remains. Exercises you never answer are <b>excluded<\/b>: they count as neither correct nor wrong, and their points are not added to the total.<\/div>\n<div class=\"rule\"><b>&#128203; Exercise types.<\/b> Multiple choice, multi-select, matching (drag &amp; drop), ordering / risk ranking, fill-in-the-blank, spot-the-mistake, alert triage, multi-step decisions, a simulated terminal, and a log viewer with a filter box.<\/div>\n<div class=\"rule\"><b>&#127760; Realism.<\/b> Scenarios mirror real SOC, red team and purple team work. Some include extra noise or missing information on purpose — that is realistic. All indicators are written in defanged form (hxxp://, 10[.]0[.]0[.]1).<\/div>\n<div class=\"rule\"><b>&#8635; Retake.<\/b> If you do not pass, retake the exam. The exercise order and every answer choice are shuffled again.<\/div>\n<\/div>\n"},"themes":[{"name":"Red Team Operations","concepts":["Adversary emulation","Rules of engagement (RoE)","Engagement lifecycle","Deconfliction","Objectives-based testing","Assumed breach","Safety controls & cleanup"]},{"name":"Frameworks & Threat Intelligence","concepts":["MITRE ATT&CK","Tactics","Techniques & sub-techniques","TTPs (procedures)","Cyber kill chain","Pyramid of pain","Threat-informed defense","Adversary emulation plan","APT profiling","ATT&CK Navigator & Evaluations"]},{"name":"Tooling & Attack Execution","concepts":["C2 frameworks & beacons","Attack testing tools (Atomic Red Team, Caldera)","Breach & Attack Simulation (BAS)","Payload delivery & execution","Evasion (jitter, LOLBins, AMSI)","Persistence mechanisms","Credential access (dumping, spraying)"]},{"name":"Detection & Purple Teaming","concepts":["Detection engineering","Sigma-style rules","Telemetry & data sources","Detection coverage heatmap","Purple team feedback loop","Control validation (preventive/detective/responsive)","True/false positive triage","Log analysis & filtering"]},{"name":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Risk prioritization","After-action reporting","Scope & authorization","Evidence handling (forensics-safe)","Legal & privacy considerations","Executive communication"]}],"exercises":[{"id":"x1","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["Deconfliction","C2 frameworks & beacons","Log analysis & filtering","Scope & authorization"],"summary":"The same beacon signature appears on a decommissioned production host","scenario":{"text":"Day 2, exercise window open, lab scope only. Three signals collide and the CISO wants a position in 10 minutes. Two signals point in opposite directions; a third undermines the asset list itself."},"question":"What is the best immediate decision?","data":{"viewer":{"title":"Three artefacts (10:41–10:47)","lines":[{"cls":"warn","raw":"EDR   10:41:18  APP-07 (in scope)   beacon -> sim-c2[.]example  interval 62s  (red tool signature)"},{"cls":"warn","raw":"FW    10:43:02  PROD-SQL-01 (OUT of scope)  beacon -> sim-c2[.]example  interval 62s  identical JA3"},{"cls":"info","raw":"CHAT  10:44:10  Red lead: ‘our kit cannot reach prod — physically isolated. Not us.’"},{"cls":"info","raw":"CMDB  PROD-SQL-01: status ‘decommissioned 8 months ago’ — yet the firewall sees live traffic from it"},{"cls":"info","raw":"Note: no EDR agent exists on PROD-SQL-01 (end-of-life OS, never deployed) — no endpoint view available"}]},"options":[{"t":"Treat the prod signal as priority one: pause red, verify what PROD-SQL-01 is","correct":true,"why":"An out-of-scope signal with no agent to confirm it outranks an in-scope known-benign one; pausing red removes one confounder while the asset truth is established."},{"t":"Everything is part of the exercise; continue and revisit it tomorrow","correct":false,"why":"The firewall signal is out of scope and the red team denies it — the exercise cannot absorb it; continuing risks ignoring a real foothold."},{"t":"Isolate the entire data-centre VLAN segment right now","correct":false,"why":"Maximum-cost action on unverified asset data; it would halt the business for a signal a 15-minute check can resolve."},{"t":"Trust the EDR signal and file the firewall signal as a duplicate","correct":false,"why":"Which signal wins is the whole question: the EDR signal is in-scope and known-benign; the unattributed prod one is exactly what must be verified."}]},"hint":"Two beacons share a signature but not a scope. One host has an agent, one has none — and the CMDB may be lying.","expl":{"why":"Which signal wins? The in-scope EDR beacon is explained by the exercise. The out-of-scope prod beacon is claimed by nobody and cannot be verified with an agent because none exists — incomplete information cuts against the safe assumption. The CMDB saying ‘decommissioned’ while the firewall shows live traffic proves the asset record cannot be trusted either. Correct senior behaviour: pause red (removes the benign confounder), establish ground truth about PROD-SQL-01 with the infrastructure team, decide after evidence — all before the 10-minute call ends.","study":"When signals conflict, rank them by scope, attribution and verifiability — then remove confounders (pause red) instead of taking big swings."}},{"id":"x2","type":"steps","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Objectives-based testing","Assumed breach","Executive communication","Detection coverage heatmap"],"summary":"Assumed breach day 2 — the CISO wants a position in 10 minutes","scenario":{"text":"Exercise ‘Black Platinum’, assumed-breach format: red started already inside the lab domain. Day 2. Red claims domain-dump success. The heatmap says 92% coverage. The CISO has 10 minutes before the board call and asks one question: ‘Is our domain safe or not?’"},"question":"Pick the best action for each of the four steps.","data":{"steps":[{"scenario":"STEP 1: You must answer the CISO with one defensible artefact.","question":"Which artefact actually answers the question?","options":[{"t":"Red’s log: which steps succeeded vs were detected, timestamped","correct":true,"note":"The objective log shows: dump succeeded, detection fired 41 minutes late — a real, arguable position."},{"t":"The 92% coverage percentage from the heatmap tool","correct":false},{"t":"The total count of alerts fired during the whole exercise","correct":false},{"t":"The red team’s full tool inventory spreadsheet","correct":false}],"why":"Executives need outcome evidence, not vanity metrics. The heatmap measures breadth (a best-practice artefact that misleads here — 92% coverage did not prevent a late detection); alert counts reward noise. Success-vs-detected with timestamps is the truth."},{"scenario":"STEP 2: The board wants red’s persistence on the DC removed NOW — mid-afternoon, peak load.","question":"What do you recommend?","options":[{"t":"Remove persistence in a controlled change window with a rollback plan","correct":true,"note":"Removal completes at 18:30 with zero downtime; the board accepts the plan."},{"t":"Reboot all domain controllers immediately, mid-day","correct":false},{"t":"Leave the persistence — it belongs to red","correct":false},{"t":"Rebuild the forest from scratch this weekend","correct":false}],"why":"The correct action carries a real, accepted cost: waiting hours for a change window. Mid-day DC reboots risk authentication storms — a bigger cost for zero gain; leaving persistence fails the ask; forest rebuild is theatre."},{"scenario":"STEP 3: Legal asks whether red accessed real customer PII. Red reached the PII database but records are incomplete.","question":"Which position is defensible?","options":[{"t":"Report scope reached and no exfiltration seen; commit to log fixes","correct":true,"note":"Legal accepts: honest about uncertainty, specific about the fix."},{"t":"State confidently that no PII at all was touched or read","correct":false},{"t":"Declare a full breach to the regulators immediately, right now","correct":false},{"t":"Refuse to answer legal’s question until given immunity","correct":false}],"why":"With incomplete information, confident denial is dishonest and immediate breach declaration is premature overreach. ‘Scope reached, no evidence of exfiltration, here is how we close the logging gap’ survives scrutiny because every word is true and checkable."},{"scenario":"STEP 4: The after-action must name ONE top action for next quarter.","question":"What earns the top slot?","options":[{"t":"Fund and fix the late DCSync detection, then re-test within 30 days","correct":true,"note":"The gap that let red operate 41 minutes unnoticed gets fixed and re-validated."},{"t":"Buy more EDR licences","correct":false},{"t":"Raise the heatmap coverage target to 97%","correct":false},{"t":"Praise the team and close the program for the year","correct":false}],"why":"The single action with the highest risk reduction is closing the demonstrated, measured gap — and re-testing proves it. Licences and bigger targets do not address a measured failure; celebrations do not either."}]},"hint":"Evidence over metrics; cost accepted consciously; honesty under uncertainty; fix what failed measurably.","expl":{"why":"Every step trades a shiny shortcut for the defensible path: outcome evidence beats the heatmap’s 92%; a conscious delay for a change window beats reckless speed; honest uncertainty beats confident fiction; and the measured DCSync failure — not vanity targets — gets funded. Assumed-breach exercises exist to produce exactly this chain of decisions.","study":"Draft a one-slide ‘exercise truth’ template: objective, succeeded?, detected?, MTTD, fix, date."}},{"id":"x3","type":"terminal","kind":"multi","theme":"Tooling & Attack Execution","timerSeconds":240,"concepts":["Evidence handling (forensics-safe)","Safety controls & cleanup","Deconfliction"],"summary":"Preserve volatile memory on FS-01 — real incident suspected, evidence must survive scrutiny","scenario":{"text":"The exercise is halted: while red worked the lab, real pre-encryption ransomware behaviour appeared on the production file server FS-01. Legal says any evidence must survive scrutiny. Nothing may change system state beyond what evidence collection requires. The server stays live. Your reduced exercise timer for this task: 4 minutes (shown above). Environment: Windows Server 2019, elevated shell on FS-01; E:\\IR-Kit\\ contains winpmem_mini_x64_rc2.exe, plus netcat, shutdown.exe, cipher.exe; destination folder E:\\IR-Kit\\evidence\\ exists."},"question":"Type the command that preserves FS-01’s volatile memory to the evidence folder, then run it.","data":{"title":"FS-01 — elevated shell (evidence collection)","prompt":"PS FS-01> ","welcome":["IR-Kit ready. REMINDER: preserve state; never destroy; the box stays live."],"output":["Acquiring physical memory (CIA-style integrity log enabled)...","Writing E:\\IR-Kit\\evidence\\FS-01-mem.raw ... 32 GB ... done.","SHA-256 recorded: 9f2c...e1a7 (chain-of-custody entry #1 written)."],"expected":"E:\\IR-Kit\\winpmem_mini_x64_rc2.exe E:\\IR-Kit\\evidence\\FS-01-mem.raw","parts":"winpmem_mini_x64_rc2.exe = read-only memory acquisition tool. E:\\IR-Kit\\evidence\\ = the prepared evidence destination. FS-01-mem.raw = the raw image with a hash for chain of custody. Nothing on the system is modified except reading memory.","elements":[{"label":"Uses a read-only memory acquisition tool (winpmem)","re":"winpmem","why":"Memory is the most volatile evidence; winpmem reads it without altering system state."},{"label":"Writes to the prepared evidence path on E:","re":"e:[\\\\/]+ir-kit[\\\\/]+evidence","why":"The evidence folder is the prepared, logged destination — anywhere else breaks chain of custody."},{"label":"Produces a raw image file (.raw or .aff4)","re":"\\.(raw|aff4)\\b","why":"A raw image with a recorded hash is what survives legal scrutiny."}],"forbidden":[{"label":"Shuts down or restarts the server","re":"shutdown|restart|\\-r\\b","why":"Rebooting destroys memory — the exact evidence the task protects.","danger":true},{"label":"Encrypts or wipes data (cipher /w, format, del)","re":"cipher|format|\\bdel\\b|erase|\\brd\\b|rmdir","why":"State-changing or destructive commands destroy evidence and alter the crime scene.","danger":true},{"label":"Streams memory over the network (netcat)","re":"\\bnc\\b|netcat","why":"Network streaming is unreliable, unlogged and modifies nothing safely — not defensible here.","danger":true},{"label":"Writes the image onto the system drive C:","re":"c:[\\\\/]+","why":"Writing to the live system drive alters the evidence source itself.","danger":true}],"syntax":null,"sampleOut":null},"hint":"The goal is stated as a legal duty: evidence survives scrutiny, volatile data never lost, state unchanged. Choose the read-only tool and the prepared destination.","expl":{"why":"The business goal — evidence that survives scrutiny — dictates every token: a read-only acquisition tool (winpmem), the prepared evidence folder on E:, and a raw image that can be hashed for chain of custody. The tempting alternatives destroy the case: shutdown/restart wipes memory — the most volatile evidence; cipher /w, format or del alter or destroy the crime scene; netcat streaming is unlogged and unreliable; writing to C: contaminates the source. When the clock runs, the safe command is the fast one — it is one line.","study":"Rehearse your memory-acquisition command until it is muscle memory; under pressure you will type what you practised."}},{"id":"x4","type":"multi","kind":"multi","theme":"Red Team Operations","concepts":["Scope & authorization","Deconfliction","Executive communication"],"summary":"Stakeholder demands containment — stay in RoE anyway","scenario":{"text":"Mid-exercise, the infrastructure director demands immediate containment of a prod artefact and threatens to ‘pull the plug himself’. The RoE forbids unilateral production changes during the exercise; the exercise director is unreachable for 20 minutes. You must keep the exercise lawful and still answer the stakeholder."},"question":"Select every action that stays within the RoE while addressing the demand.","data":{"options":[{"t":"Ask red to confine all activity to the lab segment immediately","correct":true,"why":"Freezing red to the lab removes the exercise as a confounder without touching production — within your authority."},{"t":"Verify the prod artefact with the asset owner out-of-band","correct":true,"why":"Verification is read-only, lawful, and produces the facts the director actually needs."},{"t":"Escalate to the exercise director for a scope decision the moment they are reachable","correct":true,"why":"Scope changes belong to the exercise director — escalating is the correct chain of authority."},{"t":"Contain the prod host unilaterally, quietly, before anyone objects","correct":false,"why":"Defensible in ordinary IR — but the RoE explicitly forbids unilateral prod changes mid-exercise; the near-miss that breaks the contract."},{"t":"Share the raw sample on a public forum for help","correct":false,"why":"Public disclosure of samples breaks confidentiality and possibly law."},{"t":"Silently extend the exercise into production for a day","correct":false,"why":"Extending scope without authorization is exactly the failure the RoE exists to prevent."}]},"hint":"Three actions respect the authority chain; one is the ‘right thing in ordinary times’ that the RoE forbids.","expl":{"why":"Under stakeholder pressure the RoE is the contract that keeps everyone safe: freeze red to the lab (removes ambiguity), verify read-only (produces facts), escalate for any scope change (respects authority). Unilateral containment feels right — it is what you would do in a real incident — but during an exercise it breaks the authorization model and can destroy the very evidence that would settle the argument.","study":"Practice the sentence: ‘I cannot authorize that; here is what I can do in 60 seconds instead.’"}},{"id":"x5","type":"order","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Risk prioritization","Deconfliction","Exercise metrics (detection rate, MTTD)"],"summary":"Rank ambiguous findings by decision urgency","scenario":{"text":"Five open items, one exercise director, one afternoon. Rank by decision urgency — what must be decided today before anything else."},"question":"Drag the items into urgency order (most urgent first).","data":{"items":[{"id":"u1","t":"Possible real C2 on prod DB; ownership unresolved"},{"id":"u2","t":"Exercise gap: no alert fired on DCSync emulation"},{"id":"u3","t":"Exercise phishing test reached 40% click rate"},{"id":"u4","t":"Stale entry in the coverage heatmap"},{"id":"u5","t":"Typo in the report appendix"}],"correctIds":["u1","u2","u3","u4","u5"]},"hint":"Possible-real beats exercise-internal; awareness findings beat documentation; cosmetics last.","expl":{"why":"Urgency follows consequence and reversibility: a possible real intrusion with unresolved ownership is a live risk that degrades by the hour — decide today. The DCSync gap is a proven blind spot — schedule and fund it now. The 40% click rate feeds the awareness program next cycle. The stale heatmap entry misleads planning but harms nothing operational. The typo harms nothing at all. The ordering is: real-risk-first, then measured gaps, then improvements, then cosmetics.","study":"Sort your own backlog by ‘cost of deciding late’ — it beats sorting by loudness."}},{"id":"x6","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["Evasion (jitter, LOLBins, AMSI)","Control validation (preventive/detective/responsive)","Risk prioritization"],"summary":"The universally recommended control that breaks payroll tonight","scenario":{"text":"Mid-emulation of a ransomware group, blue proposes the widely recommended hardening: block all PowerShell via GPO, effective immediately. Nobody remembered the legacy billing suite — signed but old — which runs PowerShell jobs every 15 minutes; the payroll run is tonight. The red team’s technique used unsigned, user-invoked PowerShell."},"question":"What is the correct call in this specific context?","data":{"options":[{"t":"Block only unsigned, user-invoked PowerShell; keep signed billing paths; re-test","correct":true,"why":"It stops the emulated behaviour, preserves the payroll job, and is verifiable tonight — control fit to context beats textbook purity."},{"t":"Apply the block-all PowerShell GPO now; accept that payroll fails tonight","correct":false,"why":"The textbook recommendation becomes a self-inflicted outage; security that breaks payroll gets switched off by morning."},{"t":"Do nothing at all this year; PowerShell cannot really be secured","correct":false,"why":"Defeatism — the targeted rule exists and is testable."},{"t":"Move the billing suite over to fax machines first, then decide later","correct":false,"why":"A two-week migration cannot answer a tonight-decision; it dodges the question."}]},"hint":"The best practice is right in a vacuum and wrong tonight. What does the technique actually require you to block?","expl":{"why":"‘Block all PowerShell’ is a legitimate industry recommendation — and here it is wrong, because the business runs signed PowerShell jobs every 15 minutes and payroll depends on tonight’s run. The senior move maps the control to the observed behaviour: the emulated technique used unsigned, user-invoked PowerShell, so constrain exactly that, allow the signed billing paths, and re-test the technique against the new rule. Controls earn their place by fitting context, not by winning awards.","study":"Before deploying any ‘best practice’, list the business processes it touches — then scope it."}},{"id":"x7","type":"match","kind":"multi","theme":"Red Team Operations","concepts":["Deconfliction","Log analysis & filtering","C2 frameworks & beacons"],"summary":"Pair each hypothesis with the evidence that would discriminate it","scenario":{"text":"Five hypotheses compete to explain the prod beacon. Discriminating evidence exists for each. Pair them — this table goes straight into the IR thread."},"question":"Drag each hypothesis onto the evidence that would best confirm or kill it.","data":{"zones":[{"id":"y1","label":"Jump-host session logs at matching timestamps"},{"id":"y2","label":"Login from an unknown ASN with no red-team link"},{"id":"y3","label":"CMDB last-seen 8 months ago + live traffic today"},{"id":"y4","label":"A change ticket naming the exact process"},{"id":"y5","label":"Traffic matching the documented beacon interval and test domain"}],"items":[{"id":"q1","t":"Red tooling reached prod via the jump host","zone":"y1","why":"Jump-host sessions at the exact timestamps prove the path — or kill it."},{"id":"q2","t":"A real intruder is on prod","zone":"y2","why":"An unknown network provider, unlinked to any exercise infrastructure, is the discriminating signature of a stranger."},{"id":"q3","t":"The asset record is a ghost","zone":"y3","why":"‘Decommissioned’ plus live traffic means the CMDB lies — the mystery is the record, not the packet."},{"id":"q4","t":"Benign admin tooling caused it","zone":"y4","why":"A change ticket naming the exact process converts mystery into maintenance."},{"id":"q5","t":"The exercise platform heartbeat did it","zone":"y5","why":"Documented interval plus test domain is the fingerprint of the known-benign runner."}]},"hint":"Each hypothesis dies or lives on ONE artefact: a path, a stranger, a record, a ticket, a fingerprint.","expl":{"why":"Hypothesis-driven analysis pairs every story with the single artefact that discriminates it: session logs prove paths, unknown ASNs prove strangers, stale CMDB records prove ghosts, change tickets prove maintenance, documented fingerprints prove the exercise. Writing the pair table before touching a console is what keeps a 10-minute incident call from becoming a fishing trip.","study":"Practise one-line hypothesis tables: H → evidence that would confirm/kill it."}},{"id":"x8","type":"spot","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["Adversary emulation plan","Detection coverage heatmap","Purple team feedback loop"],"summary":"The plan line that produced a blue-team blind spot","scenario":{"text":"After-action review: blue saw almost nothing all exercise. The emulation plan is audited line by line. One line quietly guaranteed the blind spot."},"question":"Click the line in the emulation plan that caused the blind spot.","data":{"lines":[{"t":"Objective: emulate FIN12-style ransomware TTPs end-to-end","correct":false,"why":"A clear, threat-led objective is correct."},{"t":"Scope: lab segment, synthetic data, three days","correct":false,"why":"Normal and safe."},{"t":"Technique selection: test only techniques already green in the heatmap","correct":true,"why":"Testing only what you already detect guarantees green results and teaches nothing — it hides every gap and manufactured the blind spot. Selection must prioritise gaps and high-risk techniques, including expected misses."},{"t":"Telemetry checklist attached per technique","correct":false,"why":"Good practice — telemetry confirmed before each test."},{"t":"Deconfliction channel staffed 09:00–17:00","correct":false,"why":"Correct process line."},{"t":"Cleanup: full artefact removal and verification","correct":false,"why":"Correct."}]},"hint":"Ask which line makes failure impossible — and therefore learning impossible.","expl":{"why":"‘Test only what is already green’ sounds efficient and is fatal: it ensures every test passes, the heatmap stays pretty, and no gap is ever discovered — exactly what happened. Emulation exists to find the red cells; technique selection must chase gaps, adversary-relevance and expected misses. Every other line is standard plan hygiene.","study":"Audit your next plan for comfort-bias: if no test can fail, the plan cannot teach anything."}},{"id":"x9","type":"blank","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Executive communication","Exercise metrics (detection rate, MTTD)","Threat-informed defense"],"summary":"Complete the board summary with the right terms","scenario":{"text":"The one-paragraph board summary of the exercise needs five precise terms. Wrong terms make the program look unprofessional; right terms carry the ask."},"question":"Fill in each blank in the board summary.","data":{"text":"The exercise used a threat-informed method mapped to {0}. We tested 24 techniques; the {1} was 58%, and the {2} for detected objectives was 23 minutes. The highest-impact gap was {3}; the remediation — targeted detection plus a tiered admin model — is scheduled for {4}.","slots":[{"opts":["MITRE ATT&CK","the Cyber Kill Chain","NIST CSF controls"],"correct":"MITRE ATT&CK","why":"Threat-informed defence is measured on the ATT&CK map."},{"opts":["detection rate","alert volume","coverage breadth"],"correct":"detection rate","why":"Alerts fired over techniques tested — 58% here."},{"opts":["MTTD","MTTR","dwell time"],"correct":"MTTD","why":"Mean time to detect for the objectives that did fire: 23 minutes."},{"opts":["credential dumping","lateral movement","persistence"],"correct":"credential dumping","why":"The exercise demonstrated the dump path was effectively invisible."},{"opts":["Q3","next fiscal year","after the next audit"],"correct":"Q3","why":"Boards fund dated commitments, not vague ones."}]},"hint":"A map, a rate, a time, a technique, a date — each blank has a distinct shape.","expl":{"why":"Board language needs five precise elements: the framework (ATT&CK), the coverage number (detection rate), the speed number (MTTD), the named gap (credential dumping), and a dated fix (Q3). Each term is checkable, which is what makes the summary trustworthy — and the ask fundable.","study":"Rewrite your last exercise summary with these five slots; delete every adjective."}},{"id":"x10","type":"steps","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Evasion (jitter, LOLBins, AMSI)","Purple team feedback loop","TTPs (procedures)","Pyramid of pain"],"summary":"Red perspective — stay TTP-faithful under detection pressure","scenario":{"text":"You are red. The emulation profile is FIN7: their beacon sleeps 60s with low jitter. Blue has just detected your fixed interval. The profile demands you emulate what FIN7 would do next — not what would make you win."},"question":"Pick the TTP-faithful action for each of the three steps.","data":{"steps":[{"scenario":"STEP 1: Blue’s new interval rule flagged your beacon twice.","question":"What does the emulated adversary do next?","options":[{"t":"Add jitter and vary intervals, mimicking the group’s behaviour","correct":true,"note":"Intervals now vary 45–150s; the profile stays faithful to FIN7’s documented tradecraft."},{"t":"Disable the SIEM connector so the alerts stop appearing","correct":false},{"t":"Abandon the exercise and go home for the day","correct":false},{"t":"Flood the SOC with many thousands of fake beacons at once","correct":false}],"why":"Emulation is fidelity, not victory: the tracked group responds to detection with documented evasive behaviour — jitter and varied intervals. Disabling defences or flooding analysts leaves the profile and breaks the RoE."},{"scenario":"STEP 2: Blue deployed a new rule. It may catch the behaviour — or just your tool’s name string.","question":"Which test answers that question?","options":[{"t":"Re-run the same technique with a different tool implementation","correct":true,"note":"The variant also fired — the rule is behavioural, a genuine fix."},{"t":"Re-run the identical command and declare victory","correct":false},{"t":"Stop testing and report the rule as perfect","correct":false},{"t":"Switch to an unrelated technique for the rest of the day","correct":false}],"why":"Same-behaviour-different-tool is the only honest validation: it separates behavioural detection from string matching, which is the entire difference between a fix and a false comfort."},{"scenario":"STEP 3: The behavioural rule catches both implementations. Red’s lead must report to the purple session.","question":"What does red report?","options":[{"t":"Detection is behavioural across implementations; mark it detected","correct":true,"note":"The heatmap cell turns green with both tool variants noted as validated."},{"t":"The detection is unbreakable now — declare it permanently fixed","correct":false},{"t":"The detection failed outright and needs a full rebuild","correct":false},{"t":"Withhold the result for now to protect the new rule","correct":false}],"why":"Red reports exactly what was proven — behavioural coverage across two implementations — no more, no less. Overclaiming (‘unbreakable’) and underclaiming both poison the heatmap the program runs on."}]},"hint":"Fidelity to the adversary, honest validation, precise reporting — the red team’s three duties.","expl":{"why":"The red team’s job is to be a faithful proxy, not a winner: when detected, the tracked adversary’s documented next move is tradecraft (jitter, varied intervals), not sabotage. Validation must separate behaviour from tool strings. Reporting states exactly what was proven. Each duty protects the integrity of the feedback loop that the whole program runs on.","study":"Read one adversary emulation plan (CTID publishes several) and note how tightly actions bind to the profile."}},{"id":"x11","type":"multi","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Executive communication"],"summary":"Which metrics survive a hostile audit of the board report?","scenario":{"text":"A sceptical CFO will audit the exercise report line by line. Only metrics that are (a) produced by the exercise itself, and (b) meaningful for defence decisions, survive. Five claims are on the table."},"question":"Select every metric that is both exercise-derived and decision-relevant.","data":{"options":[{"t":"Detection rate per tested technique","correct":true,"why":"Exercise-produced and directly funds the detection backlog."},{"t":"MTTD for detected objectives","correct":true,"why":"Exercise-produced; drives staffing and alert-quality decisions."},{"t":"Objectives completed vs objectives detected","correct":true,"why":"The clearest measure of whether defence worked when it mattered."},{"t":"Total number of CVEs scanned last year","correct":false,"why":"Vulnerability-scan output, not an exercise metric; it measures activity, not defence."},{"t":"Count of firewall rules in place","correct":false,"why":"An inventory number — no exercise event produced it and no decision follows from it."},{"t":"Percentage of staff trained last year","correct":false,"why":"An HR statistic; the exercise’s click-rate is the metric that connects to behaviour."}]},"hint":"Two gates: did the exercise produce it, and does a decision change because of it?","expl":{"why":"Hostile audits kill vanity numbers. Detection rate, MTTD and objective-completion-vs-detected are produced by the exercise and each drives a concrete decision — funding, staffing, control changes. CVE counts, firewall-rule totals and training percentages are inputs and inventories: they may matter elsewhere, but they are not exercise outcomes and a CFO will (correctly) strike them.","study":"For every metric you report, write the decision it changes — if you cannot, cut it."}},{"id":"x12","type":"mc","kind":"single","theme":"Red Team Operations","concepts":["Deconfliction","Scope & authorization","Evidence handling (forensics-safe)"],"summary":"The artefact that could be a leftover — decide under pressure","scenario":{"text":"You are the exercise director. Blue reports a suspicious prod artefact: a scheduled task named like last quarter’s exercise artefact but with a different authoring domain (dead-domain[.]example vs the old sim-c2[.]example). Red denies. Deconfliction chat is quiet. The CISO is in the board meeting. Notes from the previous exercise confirm the same task name was used — and that cleanup was ‘probably complete’. Evidence is thin either way."},"question":"What is the best next action?","data":{"options":[{"t":"Open a parallel IR thread with evidence kept; decide at a checkpoint","correct":true,"why":"‘Gather more evidence without stopping the business’: the artefact is preserved either way, red keeps working in scope, and a forced decision point prevents drift."},{"t":"Kill the exercise immediately and shut down everything red owns","correct":false,"why":"Maximum cost on thin evidence; you lose the exercise’s remaining value and still lack the answer."},{"t":"Declare the artefact a false positive and close the ticket for good","correct":false,"why":"The differing domain makes ‘leftover’ only one of two live hypotheses; closing risks a real foothold."},{"t":"Wait silently until the whole exercise ends sometime tomorrow","correct":false,"why":"Passive waiting is not a decision — if this is real, every hour is the attacker’s."}]},"hint":"The answer is neither action-at-maximum-cost nor inaction. It is structured uncertainty.","expl":{"why":"Thin evidence plus business pressure is the classic senior trap. Killing everything spends real money on a ‘probably leftover’; closing the ticket gambles a ‘possibly live’ foothold; silent waiting is drift. The professional answer runs both tracks: preserve the artefact forensically (cheap, reversible, decisive either way), keep the exercise inside its scope, and force a checkpoint at 30 minutes with whatever the parallel thread found. ‘Do nothing yet’ was never on the menu — ‘do the cheap decisive thing now, decide big later’ was.","study":"Pre-build a ‘parallel thread’ playbook: what gets preserved, who is notified, when the checkpoint fires."}},{"id":"x13","type":"match","kind":"multi","theme":"Detection & Purple Teaming","concepts":["True/false positive triage","Deconfliction","Credential access (dumping, spraying)"],"summary":"Sort six ambiguous artefacts into decision buckets","scenario":{"text":"07:50, before the daily sync. Six artefacts from the night sit unsorted. Your buckets: confirmed exercise activity, possible real intrusion — investigate, needs more evidence — do not act yet. Mis-sorting any of them costs either sleep or trust."},"question":"Drag each artefact onto the bucket it belongs to.","data":{"zones":[{"id":"k1","label":"Confirmed exercise activity"},{"id":"k2","label":"Possible real intrusion — investigate now"},{"id":"k3","label":"Needs more evidence — do not act yet"}],"items":[{"id":"z1","t":"Beacon to the registered exercise C2 from an in-scope host at 11:00","zone":"k1","why":"Documented domain, in-scope host, in-window — nothing ambiguous remains."},{"id":"z2","t":"Mimikatz-style LSASS access on the prod DC from an unknown source, outside the window","zone":"k2","why":"Prod DC + credential-access behaviour + no exercise cover: investigate immediately."},{"id":"z3","t":"Odd PowerShell on a lab host — parent process field is empty (telemetry gap)","zone":"k3","why":"The one field that would attribute the action is missing — collect first, decide after."},{"id":"z4","t":"Phishing email at 09:59 matching the exercise platform template","zone":"k1","why":"Template match plus scheduled delivery time — the platform’s fingerprint."},{"id":"z5","t":"Service account login from the red team’s documented VPN range — but to an out-of-scope server","zone":"k3","why":"Half the fingerprint matches red, half the destination does not — resolve the conflict before acting."},{"id":"z6","t":"Ransom-note fragment on a prod file share; red denies any file operations","zone":"k2","why":"Denied, prod, and the exact artefact pre-encryption leaves — investigate as real."}]},"hint":"Confirmed = every marker matches the exercise. Possible-real = a prod marker with no exercise cover. In-between = evidence first.","expl":{"why":"Sorting ambiguous artefacts is a three-bucket discipline: full fingerprint match → confirmed; any prod marker without exercise cover → investigate as real; partial matches and telemetry holes → collect evidence before acting. The dangerous errors are symmetric: acting big on the empty-parent PowerShell (cost, panic) and waiting on the DC dump (loss). The buckets exist so nobody has to re-derive that at 07:50.","study":"Print the three buckets above the SOC wall; rehearse sorting last week’s real queue against them."}},{"id":"x14","type":"multi","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Lateral Movement (related techniques)","Log analysis & filtering","Objectives-based testing"],"summary":"Prove (or disprove) the lateral movement objective from noisy logs","scenario":{"text":"Red’s objective card said: ‘Reach FIN-SQL-02 and execute a process under the service account’. The 12-line extract below is all you have; two lines lost their host field (known SIEM parser issue). Blue disputes that the objective was met."},"question":"Select every line that proves the objective was actually met.","data":{"viewer":{"title":"Correlated extract — exercise day 3 (host field missing on lines marked *)","lines":[{"raw":"10:02  SCAN   FIN-SQL-02:3389 from LAB-JUMP-01        RDP banner fetched"},{"raw":"10:04  DENY   FIN-SQL-02:3389 from LAB-JUMP-01        rule RD-DENY-SERVERS"},{"raw":"10:09  LOGIN  svc_archive -> FIN-SQL-02  OK           src LAB-JUMP-01  (RDP)"},{"raw":"10:11  PROC   FIN-SQL-02  cmd.exe parent svchost.exe  creator: svc_archive  task: ATR-LatMove"},{"raw":"10:12  PROC * cmd.exe parent svchost.exe  creator: svc_archive  task: ATR-LatMove   (host field lost)"},{"raw":"10:15  LOGIN  adm_kline -> FIN-SQL-02  OK             src ADM-WS-02    (RDP, admin routine)"},{"raw":"10:20  SCAN   FIN-SQL-02:445 from 198[.]51[.]100[.]77  denied at edge"},{"raw":"10:25  SHARE  FIN-SQL-02  \\\\fin-share\\reports accessed by svc_archive (read)"},{"raw":"10:31  LOGCL  FIN-SQL-02  Security log cleared by svc_archive"},{"raw":"10:34  PROC * whoami parent cmd.exe   (host field lost, creator unknown)"}]},"options":[{"t":"10:09 svc_archive RDP login to FIN-SQL-02 succeeded","correct":true,"why":"Access gained under the service account — the first half of the objective, evidenced."},{"t":"10:11 cmd.exe created by svc_archive with task ATR-LatMove on FIN-SQL-02","correct":true,"why":"Execution under the service account on the target — the objective is fully met by this line plus the login."},{"t":"10:02 RDP banner fetch from the jump host","correct":false,"why":"Discovery work that led to the objective — preparatory, not proof of completion."},{"t":"10:04 RDP denied by firewall rule","correct":false,"why":"A blocked attempt is the opposite of proof."},{"t":"10:12 cmd.exe with creator svc_archive — host field lost","correct":false,"why":"Same signature as the success but the host is unprovable; it supports plausibility, not proof — the incomplete-information trap."},{"t":"10:15 adm_kline admin login","correct":false,"why":"Documented admin routine — unrelated to the emulation."},{"t":"10:20 external 445 scan denied","correct":false,"why":"Edge noise from an outside address — not red, not the objective."},{"t":"10:25 share read by svc_archive","correct":false,"why":"Data access under the same account — interesting for the report’s collection section, but the objective was ‘execute a process’, and the share read is not execution."},{"t":"10:31 Security log cleared by svc_archive","correct":false,"why":"Anti-forensics after the fact — a serious finding in its own right, but not evidence the movement objective was met."}]},"hint":"The objective has two parts: reach the host under the service account, and execute a process. Two lines together satisfy both; a look-alike line lost its host field.","expl":{"why":"Proof follows the objective’s own wording: 10:09 establishes service-account access to FIN-SQL-02; 10:11 establishes process execution under that account with the red task name on that host. The 10:12 twin with a lost host field is deliberately unprovable — senior analysts do not stretch incomplete records into conclusions. Scans, denials, admin routines and even the log-clearing event are context, not proof of this objective.","study":"Grade every ‘objective met’ claim against the objective’s exact words — and note where telemetry, not truth, limits certainty."}},{"id":"x15","type":"mc","kind":"single","theme":"Governance, Metrics & Reporting","concepts":["Legal & privacy considerations","Scope & authorization","Executive communication"],"summary":"Synthetic data, real emails — what must compliance do?","scenario":{"text":"The exercise emulated a data-theft group. Red reached a database seeded with synthetic PII (realistic fake names) and the phishing test used 200 real employee email addresses. Compliance asks whether any notification duty is triggered and how to document it."},"question":"What is the defensible position?","data":{"options":[{"t":"Real employee data was processed: run the privacy check and document it","correct":true,"why":"It separates the two data classes, applies the check where a real data class exists, and produces documentation that survives an audit."},{"t":"Internal security tests never trigger any notification duties","correct":false,"why":"An absolute statement that fails the moment real personal data is involved — here, 200 real addresses."},{"t":"Notify the regulators immediately about the synthetic PII dataset","correct":false,"why":"Synthetic data is not personal data; premature notification creates false alarms and erodes trust."},{"t":"Delete the exercise records so the whole question disappears","correct":false,"why":"Destroying records to avoid scrutiny is the one option that converts a small finding into a serious one."}]},"hint":"Two data classes, two answers. Only one class is real.","expl":{"why":"The scenario deliberately mixes classes: synthetic PII (not personal data — no duty, no notification) and 200 real employee addresses (real personal data, processed in a security test — which many privacy regimes allow under legitimate-interest/security provisions, but require assessment and documentation). The defensible position names the difference, runs the impact check for the real class, documents both — and never destroys records to avoid the question.","study":"Ask your privacy team how security-testing use of employee data is covered in your jurisdiction — before the next exercise."}},{"id":"x16","type":"match","kind":"multi","theme":"Frameworks & Threat Intelligence","concepts":["ATT&CK Navigator & Evaluations","Detection coverage heatmap","Exercise metrics (detection rate, MTTD)"],"summary":"Read five coverage statements like a senior reviewer","scenario":{"text":"The board packet quotes five coverage statements. Several read better than they are. Pair each with its honest interpretation — the packet ships only if every pair is right."},"question":"Drag each statement onto its correct interpretation.","data":{"zones":[{"id":"w1","label":"At least one detection exists; its depth is unknown"},{"id":"w2","label":"Some telemetry fired but not the full behaviour"},{"id":"w3","label":"Coverage measures breadth, not quality — and quality is what failed"},{"id":"w4","label":"Cannot detect it at all; fix collection before detection"},{"id":"w5","label":"A concrete fix was validated by re-testing"}],"items":[{"id":"s1","t":"Heatmap cell green for T1003.001","zone":"w1","why":"Green means ‘something detects something here’ — depth (which variant, how fast) needs the rule’s test history."},{"id":"s2","t":"Evaluation result: ‘technique detected — modified’","zone":"w2","why":"ATT&CK Evaluations’ ‘modified’ verdict means partial: telemetry fired, the full behaviour did not."},{"id":"s3","t":"Coverage 92%, yet red still reached the objective","zone":"w3","why":"Breadth without quality: high percentages coexist with late or shallow detections — exactly what the objective result exposes."},{"id":"s4","t":"Zero data sources collected for a technique","zone":"w4","why":"No telemetry → no detection is possible; collection is the prerequisite, not the rule."},{"id":"s5","t":"BAS re-run after tuning now fires an alert","zone":"w5","why":"Re-tested validation is the only proof a fix is real — the strongest statement in the packet."}]},"hint":"Green is a floor, ‘modified’ is partial, percentages hide quality, zero telemetry is fatal, re-tests are gold.","expl":{"why":"Coverage language hides meaning in qualifiers: a green cell promises existence, not depth; ‘detected — modified’ promises partial firing; a high percentage promises breadth, not quality; zero data sources promise nothing at all; and a validated re-run is the only claim that carries its own proof. Senior reviewers rewrite vendor-flavoured coverage lines into these honest forms before the board reads them.","study":"Re-read your latest coverage report and annotate every cell: proven by which test, when?"}}]};
"use strict";
/* EXAM payload is injected by the build script immediately before this file. */
var T = EXAM.meta, SEV = EXAM.severity, STATE = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtClock(sec){ sec=Math.max(0,sec|0); var m=(sec/60)|0, s=sec%60; if(m>=60){ var h=(m/60)|0; m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); } return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function exById(id){ return byId(EXAM.exercises,id); }

/* ================= STATE ================= */
function newState(){
  return {
    order: shuffle(EXAM.exercises.map(function(e){return e.id;})),
    idx: 0, current: null, fromReview: false, attempt: 1,
    results: {}, skipped: [], checked: false,
    hintUsed: {}, draft: {},
    timer: { remain: EXAM.timerSeconds, isRunning:false, isManuallyPaused:false, isAutoPausedAfterCheck:false, int:null },
    exTimer: { remain:0, int:null, exId:null },
    reported: false, timeUp: false, username: ''
  };
}
function answeredIds(){ return Object.keys(STATE.results).filter(function(k){ return !STATE.results[k].excluded; }); }
function liveScore(){
  var ids=answeredIds(), earned=0, poss=ids.length*100;
  ids.forEach(function(k){ earned += STATE.results[k].earned; });
  return {earned:earned, poss:poss};
}
function themeBreakdown(){
  var m={};
  answeredIds().forEach(function(k){
    var ex=exById(k), r=STATE.results[k];
    if(!m[ex.theme]) m[ex.theme]={earned:0,poss:0,n:0};
    m[ex.theme].earned+=r.earned; m[ex.theme].poss+=100; m[ex.theme].n++;
  });
  return m;
}

/* ================= TIMER ================= */
function timerIndicator(){
  var t=STATE.timer;
  if(STATE.timeUp) return {cls:'',txt:'\u23F9 time is up'};
  if(STATE.finished) return {cls:'',txt:'\u23F9 exam finished'};
  if(!t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck) return {cls:'',txt:'\u2014 not started'};
  if(t.isManuallyPaused) return {cls:'pausedyou',txt:'\u23F8 paused by you'};
  if(t.isAutoPausedAfterCheck) return {cls:'pausedfb',txt:'\u23F8 paused \u2014 review your feedback'};
  return {cls:'running',txt:'\u25B6 running'};
}
function renderTimer(){
  var t=STATE.timer, el=$('htimer'), ind=timerIndicator();
  el.textContent=fmtClock(t.remain);
  el.className='timer'+(t.remain<60?' crit':(t.remain<300?' low':''));
  var m=$('htmode'); m.textContent=ind.txt; m.className='tmode '+ind.cls;
}
function timerTick(){
  var t=STATE.timer;
  if(t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck){
    t.remain--;
    renderTimer();
    if(t.remain<=0){ t.remain=0; timeUp(); }
  }
}
function startTimer(){
  var t=STATE.timer;
  if(t.int) clearInterval(t.int);
  t.isRunning=true; t.isManuallyPaused=false; t.isAutoPausedAfterCheck=false;
  t.int=setInterval(timerTick,1000); renderTimer();
}
function stopTimerLoop(){ var t=STATE.timer; if(t.int){clearInterval(t.int); t.int=null;} t.isRunning=false; }
function setAutoPause(on){
  STATE.timer.isAutoPausedAfterCheck=on; renderTimer();
}
function manualPause(){
  STATE.timer.isManuallyPaused=true; renderTimer(); showPauseOverlay(true);
  var b=$('bpause'); if(b){ b.innerHTML='&#9654; Resume'; }
}
function manualResume(){
  STATE.timer.isManuallyPaused=false; showPauseOverlay(false); renderTimer();
  var b=$('bpause'); if(b){ b.innerHTML='&#9208; Pause'; }
}
function timeUp(){
  if(STATE.timeUp) return;
  STATE.timeUp=true; stopTimerLoop(); stopExerciseTimer(); showPauseOverlay(false);
  renderResults(true);
}

/* per-exercise reduced timer (EXTREMELY HARD terminal) */
function startExerciseTimer(ex){
  stopExerciseTimer();
  if(!ex.timerSeconds) return;
  STATE.exTimer={remain:ex.timerSeconds,int:null,exId:ex.id};
  var box=$('exclock'); if(box) box.innerHTML='&#9201; Exercise timer: <b id="exclockv">'+fmtClock(ex.timerSeconds)+'</b>';
  STATE.exTimer.int=setInterval(function(){
    /* the reduced timer respects both pause flags and never runs after time is up */
    if(STATE.timeUp || STATE.timer.isManuallyPaused || STATE.timer.isAutoPausedAfterCheck) return;
    STATE.exTimer.remain--;
    var v=$('exclockv'); if(v) v.textContent=fmtClock(STATE.exTimer.remain);
    if(STATE.exTimer.remain<=0){
      stopExerciseTimer();
      STATE.results[ex.id]={earned:0,status:'excluded',excluded:true,answered:false,studentText:'(no answer \u2014 exercise timer ended)'};
      advanceAfterExclusion();
    }
  },1000);
}
function stopExerciseTimer(){ if(STATE.exTimer && STATE.exTimer.int){ clearInterval(STATE.exTimer.int); STATE.exTimer.int=null; } }
function advanceAfterExclusion(){
  stopExerciseTimer();
  goNext(true);
}

/* ================= HEADER ================= */
function renderHeader(){
  $('hbadge').innerHTML='&#9733; '+esc(SEV.label);
  var bd=$('hbadge'); bd.style.setProperty('--sev',SEV.color); bd.style.setProperty('--sevbg',SEV.bg);
  if(!STATE){ return; }
  var total=STATE.order.length;
  var pos=STATE.current? (STATE.order.indexOf(STATE.current)+1) : 0;
  $('hcount').textContent = STATE.current ? ('Exercise '+pos+' of '+total) : ('Exercises: '+total);
  var ls=liveScore();
  $('hscore').textContent=ls.earned+' / '+ls.poss;
  var done=answeredIds().length;
  $('hprog').style.width=Math.round(100*done/total)+'%';
  var ex=STATE.current?exById(STATE.current):null;
  $('bhint').disabled=!ex||!!STATE.hintUsed[ex.id]||STATE.checked;
  $('bskip').disabled=!ex||STATE.checked||STATE.timeUp;
}

/* ================= NAV ================= */
function showScreen(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){ var n=$(s); if(n) n.className=s===id?'':'hidden'; });
  $('hdr').className = (id==='scr-intro')?'hidden':'';
}
function startExam(){
  startTimer();
  loadExercise(STATE.order[0]);
}
function loadExercise(id){
  STATE.current=id; STATE.checked=false;
  var returning=STATE.fromReview; STATE.fromReview=false;
  setAutoPause(false);
  $('bpause').disabled=false; $('bfinish').disabled=false;
  renderExercise(exById(id));
  renderHeader();
  showScreen('scr-exam');
  startExerciseTimer(exById(id));
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function skipCurrent(){
  if(STATE.checked||!STATE.current||STATE.timeUp) return;
  stopExerciseTimer();
  if(STATE.skipped.indexOf(STATE.current)<0) STATE.skipped.push(STATE.current);
  nextUnansweredOrReview();
}
function nextUnansweredOrReview(){
  var next=null;
  for(var i=0;i<STATE.order.length;i++){ var id=STATE.order[i]; if(!STATE.results[id] && STATE.skipped.indexOf(id)<0){ next=id; break; } }
  if(next){ loadExercise(next); }
  else if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); }
  else { renderResults(false); }
}
function goNext(afterExclusion){
  stopExerciseTimer();
  if(STATE.fromReviewPending){ STATE.fromReviewPending=false; STATE.current=null;
    if(STATE.skipped.length>0 && !STATE.timeUp) renderReview(); else nextUnansweredOrReview();
    return;
  }
  if(STATE.current){
    var i=STATE.order.indexOf(STATE.current);
    for(var j=i+1;j<STATE.order.length;j++){ if(!STATE.results[STATE.order[j]] && STATE.skipped.indexOf(STATE.order[j])<0){ loadExercise(STATE.order[j]); return; } }
    if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); return; }
    if(answeredIds().length===STATE.order.length){ renderResults(false); return; }
    nextUnansweredOrReview();
  } else {
    nextUnansweredOrReview();
  }
}
function finishFlow(){
  if(STATE.timeUp){ renderResults(true); return; }
  stopExerciseTimer();
  /* move any never-answered exercises into the skipped pool so they can be reviewed */
  STATE.order.forEach(function(id){
    if(!STATE.results[id] && STATE.skipped.indexOf(id)<0) STATE.skipped.push(id);
  });
  if(STATE.skipped.length>0){ renderReview(); } else { renderResults(false); }
}
function returnToSkipped(id){
  STATE.fromReview=true; STATE.fromReviewPending=true;
  STATE.skipped=STATE.skipped.filter(function(x){return x!==id;});
  loadExercise(id);
}
