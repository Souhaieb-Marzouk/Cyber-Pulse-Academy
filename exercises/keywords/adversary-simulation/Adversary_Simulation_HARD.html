<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#121d33; --panel2:#16233d; --line:#25365c; --line2:#31456f;
  --txt:#e7eef9; --muted:#9db0cf; --dim:#7288ab;
  --blue:#4f8ef7; --amber:#f5a623; --green:#2fd07a; --red:#f0564a; --orange:#f97316; --grey:#8ea3c0;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--blue)}
button{font-family:inherit}

.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1060px,94vw);margin:0 auto}

/* ---------- persistent header ---------- */
#hdr{position:sticky;top:0;z-index:50;background:rgba(10,16,30,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hdr .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0}
.hchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;min-height:36px}
.hchip .k{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:6px 12px;font-size:13.5px;background:var(--sevbg);color:var(--sev);border:1px solid var(--sev);min-height:36px}
.timer{font-family:var(--mono);font-size:18px;font-weight:700;min-width:96px;text-align:center}

.tmode.running{color:var(--green)} .tmode.pausedyou{color:var(--amber)} .tmode.pausedfb{color:var(--blue)}
.score{font-family:var(--mono);font-weight:700}
.spacer{flex:1}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 16px;font-size:14.5px;font-weight:600;min-height:44px;min-width:44px;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--panel2);border-color:var(--blue)}

.btn.primary{background:linear-gradient(180deg,#2b64d9,#1d4aa8);border-color:#3a76ea;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#3370e8,#2054b8)}
.btn.good{background:linear-gradient(180deg,#1f9d5f,#187a49);border-color:#2fd07a;color:#fff}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sev));transition:width .5s ease}

/* ---------- generic blocks ---------- */
main{flex:1;padding:22px 0 60px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:30px;line-height:1.2;margin:0 0 10px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin:14px 0}
.card.tint{background:linear-gradient(180deg,rgba(79,142,247,.07),var(--panel))}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)}
ul.clean{margin:6px 0;padding-left:20px} ul.clean li{margin:4px 0}

/* ---------- intro / results ---------- */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 2px}
.hero .logo{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 30% 30%,var(--sev),transparent 70%),var(--panel2);border:1px solid var(--sev);display:flex;align-items:center;justify-content:center;font-size:26px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted);margin:2px 4px 2px 0;background:var(--panel)}
.themewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.theme{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.theme h4{margin:0 0 6px;font-size:14.5px;color:var(--blue)}
.theme ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.theme li{margin:3px 0}
.notice{border-left:4px solid var(--blue);background:rgba(79,142,247,.08);border-radius:0 var(--rad) var(--rad) 0;padding:10px 14px;margin:12px 0}
.notice.amber{border-color:var(--amber);background:rgba(245,166,35,.08)}
.notice.green{border-color:var(--green);background:rgba(47,208,122,.08)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;font-size:14.5px}
.rule b{color:var(--txt)}
.cert{border:2px solid var(--sev);background:radial-gradient(circle at 85% 10%,rgba(47,208,122,.12),transparent 60%),var(--panel);border-radius:14px;padding:26px;text-align:center}
.cert .big{font-size:44px;font-weight:800;font-family:var(--mono)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-family:var(--mono)}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.ok .n{color:var(--green)} .stat.part .n{color:var(--amber)} .stat.bad .n{color:var(--red)} .stat.skip .n{color:var(--grey)}
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rpt th{background:var(--panel2);color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- exam exercise layout ---------- */
.exhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 4px}
.steptag{font-family:var(--mono);font-size:12.5px;border:1px dashed var(--line2);border-radius:6px;padding:3px 9px;color:var(--muted)}
.block{border:1px solid var(--line);border-radius:var(--rad);margin:12px 0;background:var(--panel);overflow:hidden}
.block>.bh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;cursor:default}
.block>.bh .ic{font-size:16px}
.block>.bh .sum{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block>.bh button.tgl{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:4px 14px;cursor:pointer;font-size:12.5px;min-height:44px}
.block>.bb{padding:14px 16px}
.block.scenario>.bh{background:rgba(79,142,247,.10);color:#9cc0ff;border-bottom-color:rgba(79,142,247,.25)}
.block.scenario>.bb{background:linear-gradient(180deg,rgba(79,142,247,.05),transparent)}
.block.question>.bh{background:rgba(245,166,35,.10);color:#ffcf7d;border-bottom-color:rgba(245,166,35,.25)}
.block.question>.bb{background:linear-gradient(180deg,rgba(245,166,35,.05),transparent)}
.block.question .qt{font-weight:700;font-size:17px}
.block.answer>.bh{background:rgba(47,208,122,.10);color:#7fe0ac;border-bottom-color:rgba(47,208,122,.25)}
.block.answer>.bb{background:linear-gradient(180deg,rgba(47,208,122,.04),transparent)}
.artefact{border:1px solid var(--line2);border-radius:8px;margin:10px 0;background:#0a1322}
.artefact>.ah{padding:7px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.artefact>.ab{padding:10px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.artefact.code>.ab{font-family:var(--mono);font-size:14.5px;line-height:1.5}
.hintbox{border:1px dashed var(--amber);background:rgba(245,166,35,.07);color:#ffd28a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;cursor:pointer;color:var(--txt);font-size:15.5px;min-height:44px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .lab{font-family:var(--mono);font-weight:700;color:var(--blue);flex:0 0 auto}
.opt.sel{border-color:var(--green);background:rgba(47,208,122,.08)}
.opt.sel .lab{color:var(--green)}
.opt.pick{border-color:var(--blue);background:rgba(79,142,247,.08)}
.multinote{font-size:13px;color:var(--amber);border:1px dashed var(--amber);border-radius:7px;padding:6px 10px;margin:0 0 10px;display:inline-block}

/* log viewer */
.viewer{border:1px solid var(--line2);border-radius:8px;background:#070e1a;margin:10px 0;overflow:hidden}
.viewer .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer .vh input{flex:1;min-width:180px;background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:8px 12px;font-family:var(--mono);font-size:14px;min-height:44px}
.viewer .vh .cnt{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.loglines{max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:14px;line-height:1.6}
.loglines .ln{padding:2px 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent}
.loglines .ln:hover{background:rgba(79,142,247,.06)}
.loglines .ln.info{color:#c9d6ee} .loglines .ln.warn{color:#ffd28a} .loglines .ln.err{color:#ff9d94} .loglines .ln.ok{color:#8fe6b8}
.noline{padding:10px 12px;color:var(--muted);font-size:13.5px}

/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.dnd{grid-template-columns:1fr}}
.bank,.zones{display:flex;flex-direction:column;gap:9px}
.ztitle{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:14.5px;cursor:grab;min-height:44px;transition:border-color .12s,background .12s}
.chip:active{cursor:grabbing}
.chip.sel{border-color:var(--green);background:rgba(47,208,122,.10)}
.chip.ghosted{opacity:.35}
.zone{border:1.5px dashed var(--line2);border-radius:9px;background:rgba(255,255,255,.015);min-height:64px;display:flex;flex-direction:column;gap:7px;padding:9px 11px}
.zone.hot{border-color:var(--green);background:rgba(47,208,122,.07)}
.zone>.zl{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.zone .chip{cursor:pointer}

/* ordering */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;cursor:grab}
.orow.dragging{opacity:.4}
.orow .pos{font-family:var(--mono);font-weight:700;color:var(--blue);width:26px;text-align:center}
.orow .ot{flex:1;font-size:14.5px}
.orow .mv{display:flex;flex-direction:row;gap:6px}
.orow .mv button{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:6px;width:44px;height:44px;cursor:pointer;font-size:15px;min-height:44px;min-width:44px;padding:0}
.orow .mv button:hover{border-color:var(--blue)}

/* blanks */
.blanks{font-size:14.5px;line-height:2;white-space:pre-wrap;font-family:var(--mono)}
.blanks select{background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:6px 10px;font-family:var(--sans);font-size:14.5px;min-height:44px;margin:0 3px}
.wordbank{margin-top:10px;font-size:13.5px;color:var(--muted)}
.wordbank .pill{font-family:var(--mono)}

/* terminal */
.term{background:#050a14;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.term .th{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.term .dot{width:10px;height:10px;border-radius:99px;background:var(--red);display:inline-block}
.term .dot.y{background:var(--amber)} .term .dot.g{background:var(--green)}
.term .sc{max-height:280px;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .sc .cline{color:#8fe6b8;white-space:pre-wrap;word-break:break-word}
.term .sc .oline{color:#c9d6ee;white-space:pre-wrap;word-break:break-word}
.term .sc .eline{color:#ff9d94;white-space:pre-wrap;word-break:break-word}
.term .inrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 12px}
.term .inrow .pr{font-family:var(--mono);color:var(--green);font-size:14px;white-space:nowrap}
.term .inrow input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-size:14.5px;min-height:44px}
.term .inrow input:focus-visible{outline:none}
.termwrap .runb{margin-left:8px}
.syntax{border:1px solid var(--line2);border-radius:8px;background:rgba(79,142,247,.05);padding:10px 14px;margin:10px 0;font-size:14px}
.syntax .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:5px}
.syntax code{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13.5px}
.exclock{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);background:rgba(240,86,74,.08);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-weight:700;font-size:14.5px;margin:4px 0}

/* spot the mistake */
.codelines{font-family:var(--mono);font-size:14.5px;background:#070e1a;border:1px solid var(--line2);border-radius:8px;padding:10px 0;max-height:420px;overflow:auto}
.cl{display:flex;gap:0;cursor:pointer;border-left:3px solid transparent}
.cl:hover{background:rgba(79,142,247,.06)}
.cl.sel{border-left-color:var(--green);background:rgba(47,208,122,.09)}
.cl .no{color:var(--dim);padding:2px 10px 2px 12px;user-select:none;min-width:44px;text-align:right}
.cl .tx{padding:2px 12px;white-space:pre-wrap;word-break:break-word}

/* triage */
.queue{display:flex;flex-direction:column;gap:12px}
.alert{border:1px solid var(--line2);border-left:4px solid var(--amber);background:var(--panel2);border-radius:9px;padding:12px 14px}
.alert .ahd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.alert .ahd .aid{font-family:var(--mono);font-weight:700;color:var(--amber)}
.alert .ahd .at{font-weight:700}
.alert .ad{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.segrow{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:44px}
.seg:hover{border-color:var(--blue)}
.seg.on{border-color:var(--green);color:var(--green);background:rgba(47,208,122,.08);font-weight:700}

/* feedback */
.fb{border-radius:var(--rad);border:1px solid;margin:14px 0;overflow:hidden}
.fb>.fh{display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb .fbb{padding:14px 16px}
.fb.correct{border-color:var(--green)} .fb.correct>.fh{background:rgba(47,208,122,.12);color:var(--green)}
.fb.partial{border-color:var(--amber)} .fb.partial>.fh{background:rgba(245,166,35,.12);color:var(--amber)}
.fb.wrong{border-color:var(--red)} .fb.wrong>.fh{background:rgba(240,86,74,.12);color:var(--red)}
.fb.excluded{border-color:var(--grey)} .fb.excluded>.fh{background:rgba(142,163,192,.12);color:var(--grey)}
.fb .pts{margin-left:auto;font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.25);border-radius:7px;padding:3px 10px}
.fbsub{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-weight:700}
.fbsub.ok{color:var(--green)} .fbsub.no{color:var(--red)} .fbsub.miss{color:var(--amber)}
.fbitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.fbitem b{color:var(--txt)}
.fbitem.ok{border-left:3px solid var(--green)} .fbitem.no{border-left:3px solid var(--red)} .fbitem.miss{border-left:3px solid var(--amber)}
.ansline{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.copyb{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;min-height:44px;min-width:64px}
.copyb:hover{color:var(--txt);border-color:var(--blue)}
.study{border-left:4px solid var(--blue);background:rgba(79,142,247,.07);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0 2px;font-size:14.5px}
.encourage{font-size:14.5px;color:var(--muted);margin-top:10px}

/* pause overlay */
#pauseov{position:fixed;inset:0;background:rgba(5,9,18,.97);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
#pauseov .big{font-size:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.footer-note{color:var(--dim);font-size:12.5px;text-align:center;margin-top:26px}
.greet{color:var(--green);font-weight:700}
@media (max-width:700px){
  h1{font-size:24px}
  .dnd{grid-template-columns:1fr}
  .block>.bb{padding:12px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="wrap">
      <div class="row">
        <span class="hchip">&#128760; <b>Adversary Simulation</b></span>
        <span class="badge" id="hbadge">&#9733; EASY</span>
        <span class="hchip" id="hcount">Exercise 0 of 0</span>
        <span class="hchip"><span><span class="timer" id="htimer">--:--</span><span class="tmode" id="htmode">&#8212; not started</span></span></span>
        <span class="hchip"><span class="k">Score</span> <span class="score" id="hscore">0 / 0</span></span>
        <span class="spacer"></span>
        <button class="btn" id="bhint" title="Open a hint (costs 10% of this exercise)">&#128161; Hint</button>
        <button class="btn" id="bpause" title="Pause the timer and hide the exercise">&#9208; Pause</button>
        <button class="btn warn" id="bskip" title="Move this exercise to the skipped pool">&#9193; Skip</button>
        <button class="btn ghost" id="bfinish" title="Go to review / finish">&#10074;&#10074; Finish</button>
      </div>
      <div class="progress"><i id="hprog"></i></div>
    </div>
  </header>
  <main><div class="wrap" id="main"></div></main>
</div>

<script>
"use strict";
var EXAM = {"meta":{"topicId":"adversary-simulation","batch":3,"title":"Adversary Simulation — HARD","difficulty":"hard","questionCount":16,"estimatedMinutes":55,"passMark":70},"severity":{"label":"HARD","color":"#f97316","bg":"rgba(249,115,22,.14)","desc":"Challenging. Near-miss answers look almost right, scenarios hide traps (alarming-but-benign, benign-but-alarming), and the least aggressive option is often the correct one. Hints only remove one wrong path."},"timerSeconds":3300,"intro":{"keywordHtml":"\n<p><b>Imagine your company is a castle.<\/b> You build walls (firewalls), guards (security tools) and alarms (alerts).\nBut how do you know the guards really work? <b>Adversary simulation<\/b> answers that question. A trusted team pretends\nto be real attackers. They attack your systems <b>with written permission and clear rules<\/b>. Nobody gets hurt.\nThe goal is to find the weak spots before criminals find them.<\/p>\n<p>This work has several names: <b>red teaming<\/b>, <b>adversary emulation<\/b>, <b>purple teaming<\/b> and\n<b>Breach and Attack Simulation (BAS)<\/b>. They all share one idea: practise realistic attacks in a safe, controlled\nway, then make the defenses better. In this exam you will learn the words, the tools and the decisions used in this\nwork, step by step.<\/p>\n<p><b>Who uses it in real work?<\/b><\/p>\n<ul class=\"clean\">\n<li>The <b>red team<\/b> attacks. They copy the habits of real criminal groups, with permission.<\/li>\n<li>The <b>blue team<\/b> defends. They watch alerts in the SOC and respond.<\/li>\n<li>The <b>purple team<\/b> helps both sides talk, test and learn together.<\/li>\n<li><b>SOC analysts<\/b> watch alerts every day and use simulation results to improve them.<\/li>\n<li><b>Incident responders<\/b> practise the steps for handling a real hack.<\/li>\n<li><b>GRC teams<\/b> (governance, risk, compliance) check that the exercise follows rules and laws, and they keep the paperwork.<\/li>\n<li><b>Security engineers<\/b> fix the gaps that the exercise finds.<\/li>\n<li><b>Threat intelligence analysts<\/b> study real attacker groups and turn reports into test plans.<\/li>\n<\/ul>\n<p><b>Tools you will meet in these exercises:<\/b><\/p>\n<ul class=\"clean\">\n<li><b>MITRE ATT&amp;CK<\/b>: a free public map of attacker steps. It has <b>tactics<\/b> (the goal, like Initial Access) and <b>techniques<\/b> (the how, like T1566 Phishing).<\/li>\n<li><b>C2 frameworks<\/b> (Cobalt Strike, Caldera, Sliver): tools that send hidden commands to a test machine. The hidden link is called a <b>beacon<\/b>.<\/li>\n<li><b>Atomic Red Team<\/b>: a library of small, ready-made tests for ATT&amp;CK techniques.<\/li>\n<li><b>BAS platforms<\/b>: tools that run attack tests automatically, all the time.<\/li>\n<li><b>SIEM / log tools<\/b>: they collect events so defenders can see attacks.<\/li>\n<\/ul>\n<p><b>How a simulation works (the process):<\/b> 1) Plan the goals. 2) Write the <b>rules of engagement (RoE)<\/b> —\na paper that says what may be attacked, when, and who to call if something breaks. 3) Run the attacks and watch what\nthe defenders see. 4) Compare: which attacks were stopped? Which were missed? 5) Write a report. 6) Fix the gaps.\n7) Test again. If an attack touches something it should not, teams use <b>deconfliction<\/b>: they talk quickly to\ndecide “is this the exercise, or is it a real attacker?”<\/p>\n<p><b>Documents used in this work:<\/b> the RoE, the <b>adversary emulation plan<\/b> (which attacker group and which\nsteps to copy), the <b>detection coverage heatmap<\/b> (green = we detect it, red = we do not), the <b>after-action\nreport<\/b>, and metrics like <b>MTTD<\/b> (mean time to detect) and <b>detection rate<\/b>.<\/p>\n<p><b>Daily tasks:<\/b> run one test technique, check if an alert fired, tune a detection rule, join a purple team\nmeeting, update the heatmap, write findings, clean up test accounts and tasks.<\/p>\n<p><b>Risks it addresses:<\/b> ransomware, stolen passwords, data theft and fraud. It also has its own risks — tests\ncan break systems — so safety rules, scope limits and deconfliction are very important. That is why every good\nsimulation starts with written permission.<\/p>\n","rulesHtml":"\n<div class=\"rulegrid\">\n<div class=\"rule\"><b>&#127919; Goal.<\/b> Reach the pass mark: <b>70%<\/b>. Every exercise is worth <b>100 points<\/b>.<\/div>\n<div class=\"rule\"><b>&#10022; Multi-answer exercises.<\/b> Some exercises have more than one correct part (multi-select, several drop zones, several blanks, several steps). If you find some of the correct parts, you get some of the points. <b>Wrong picks cancel right picks<\/b>: points = (correct picks − wrong picks) ÷ total correct parts. Picking everything can never beat picking carefully.<\/div>\n<div class=\"rule\"><b>&#128161; Hints.<\/b> One hint per exercise. A hint costs <b>10% of that exercise’s points<\/b> (the best possible becomes 90). Hints give a nudge, never the answer. Using a hint does <b>not<\/b> pause the timer.<\/div>\n<div class=\"rule\"><b>&#9201; Timer — two ways it pauses.<\/b> 1) Press <b>Pause<\/b>: the timer stops and the exercise is hidden until you press Resume. 2) Press <b>Check<\/b>: the timer stops automatically so you can read the explanation with no stress — everything stays readable. The timer starts again when you press <b>Next<\/b>.<\/div>\n<div class=\"rule\"><b>&#9193; Skip.<\/b> Every exercise has a Skip button. Skipping is free. Before the exam ends you get a review screen where you can return to skipped exercises and answer them, as long as time remains. Exercises you never answer are <b>excluded<\/b>: they count as neither correct nor wrong, and their points are not added to the total.<\/div>\n<div class=\"rule\"><b>&#128203; Exercise types.<\/b> Multiple choice, multi-select, matching (drag &amp; drop), ordering / risk ranking, fill-in-the-blank, spot-the-mistake, alert triage, multi-step decisions, a simulated terminal, and a log viewer with a filter box.<\/div>\n<div class=\"rule\"><b>&#127760; Realism.<\/b> Scenarios mirror real SOC, red team and purple team work. Some include extra noise or missing information on purpose — that is realistic. All indicators are written in defanged form (hxxp://, 10[.]0[.]0[.]1).<\/div>\n<div class=\"rule\"><b>&#8635; Retake.<\/b> If you do not pass, retake the exam. The exercise order and every answer choice are shuffled again.<\/div>\n<\/div>\n"},"themes":[{"name":"Red Team Operations","concepts":["Adversary emulation","Rules of engagement (RoE)","Engagement lifecycle","Deconfliction","Objectives-based testing","Assumed breach","Safety controls & cleanup"]},{"name":"Frameworks & Threat Intelligence","concepts":["MITRE ATT&CK","Tactics","Techniques & sub-techniques","TTPs (procedures)","Cyber kill chain","Pyramid of pain","Threat-informed defense","Adversary emulation plan","APT profiling","ATT&CK Navigator & Evaluations"]},{"name":"Tooling & Attack Execution","concepts":["C2 frameworks & beacons","Attack testing tools (Atomic Red Team, Caldera)","Breach & Attack Simulation (BAS)","Payload delivery & execution","Evasion (jitter, LOLBins, AMSI)","Persistence mechanisms","Credential access (dumping, spraying)"]},{"name":"Detection & Purple Teaming","concepts":["Detection engineering","Sigma-style rules","Telemetry & data sources","Detection coverage heatmap","Purple team feedback loop","Control validation (preventive/detective/responsive)","True/false positive triage","Log analysis & filtering"]},{"name":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Risk prioritization","After-action reporting","Scope & authorization","Evidence handling (forensics-safe)","Legal & privacy considerations","Executive communication"]}],"exercises":[{"id":"h1","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["Deconfliction","Payload delivery & execution","True/false positive triage"],"summary":"Office spawning PowerShell on a finance workstation","scenario":{"text":"Tuesday 10:22, exercise window open (08:00–18:00). Two artefacts land in your queue at the same time. The red team plan card for today lists “T1566.002 lure document on one finance workstation, in scope”. The workstation is in scope. The domain in the firewall log is not on any red team asset list, though."},"question":"What is the correct call?","data":{"viewer":{"title":"Two artefacts, correlated","lines":[{"cls":"warn","raw":"EDR  10:21:58  FIN-WS-014  winword.exe -> powershell.exe -nop -w hidden -c IEX(downloader)"},{"cls":"warn","raw":"EDR  10:22:03  FIN-WS-014  powershell.exe wrote %TEMP%\\svhost32.exe"},{"cls":"info","raw":"FW   10:22:11  FIN-WS-014 -> 203[.]0[.]113[.]88:443  POST /t/  payload 210B  (storage-sync[.]example)"},{"cls":"info","raw":"FW   10:23:12  FIN-WS-014 -> 203[.]0[.]113[.]88:443  POST /t/  payload 208B  (storage-sync[.]example)"},{"cls":"info","raw":"PLAN-CARD  ‘in-scope: FIN-WS-014; technique: T1566.002 + T1059; C2: red-infra-07 (undisclosed to blue)’"}]},"options":[{"t":"Annotate as likely announced emulation; verify C2 ownership; monitor","correct":true,"why":"Host, technique and timing match the plan card; the C2 domain is undisclosed to blue by design, so verification — not containment — is the right next move."},{"t":"Isolate FIN-WS-014 at once and declare a P1 security incident","correct":false,"why":"Defensible in a vacuum, but every marker matches the announced, in-scope test; isolating destroys the exercise measurement."},{"t":"Close it as a user’s macro test; add no notes to the alert","correct":false,"why":"Even exercise activity gets annotated — closing without notes loses the measurement and confuses the report."},{"t":"Block Office from spawning PowerShell company-wide right now","correct":false,"why":"A global preventive change mid-exercise breaks other tests and business workflows; changes like this belong in the fix phase."}]},"hint":"Match the artefacts against the plan card line by line before choosing an action.","expl":{"why":"This looks alarming — Office spawning a hidden PowerShell downloader is textbook malicious behaviour. But three independent markers (host, technique, window) match the announced, in-scope test, and the plan card even says the C2 domain is undisclosed to the blue team. The correct call is the measured one: annotate, verify ownership of the C2 out-of-band, keep watching. “Alarming” is not the same as “unannounced”.","study":"Build a deconfliction checklist: host in scope? technique on the card? timing inside window? C2 ownership verifiable?"}},{"id":"h2","type":"mc","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["Techniques & sub-techniques","Payload delivery & execution"],"summary":"Which technique ID matches the FIRST execution step?","scenario":{"text":"For the after-action report you must map the observed chain to ATT&CK precisely. The chain: an email attachment delivered update.vbs; the user double-clicked it; wscript ran it; it spawned a hidden PowerShell downloader that beaconed. Your colleague mapped the whole thing as T1566.001; another colleague insists on T1059.001."},"question":"Which technique best matches the first execution step?","data":{"options":[{"t":"T1059.005 Visual Basic","correct":true,"why":"The first code execution happened when wscript.exe interpreted update.vbs — Visual Basic sub-technique."},{"t":"T1059.001 PowerShell","correct":false,"why":"PowerShell ran second; mapping it as the first execution step skips the wscript stage."},{"t":"T1566.001 Spearphishing Attachment","correct":false,"why":"That is how the payload arrived — Initial Access, not execution. A defensible-looking trap."},{"t":"T1204.002 Malicious File","correct":false,"why":"User Execution defensibly describes the double-click, but the question asks for the execution step, which is wscript running VBS."}]},"hint":"‘Execution’ starts where code first runs — not where the email arrived, and not the second interpreter.","expl":{"why":"Precision matters when mapping chains. Arrival (T1566.001), user double-click (T1204.002), first code execution (T1059.005 via wscript), and second-stage PowerShell (T1059.001) are four different cells. The first execution step is the VBS script under wscript — T1059.005. Reporting the wrong cell skews coverage data for months.","study":"Map a chain arrival-to-C2 and give each step its exact sub-technique ID."}},{"id":"h3","type":"steps","kind":"multi","theme":"Red Team Operations","concepts":["Deconfliction","Scope & authorization","Safety controls & cleanup"],"summary":"The emulated beacon reached a production host","scenario":{"text":"Mid-exercise, day 1. The exercise covers the lab segment only. Telemetry now shows the emulated beacon on PROD-DB-02. The red team lead says their tooling cannot reach production. The SOC lead insists the traffic is real. The exercise director asks you to handle it."},"question":"Pick the best action for each of the three steps.","data":{"steps":[{"scenario":"STEP 1: Two statements conflict — the log says production, the red lead says impossible.","question":"What do you do first?","options":[{"t":"Pause offensive activity and verify what PROD-DB-02 actually is","correct":true,"note":"Verification shows PROD-DB-02 is live and reachable from the lab jump host — the red lead was wrong."},{"t":"Shut down the entire lab segment at once","correct":false},{"t":"Wait until the exercise ends and mention it in the report","correct":false},{"t":"Delete the alert as exercise noise","correct":false}],"why":"When statements conflict, the evidence wins: pause and verify. Everything else is guessing."},{"scenario":"STEP 2: Verification confirms red tooling reached PROD-DB-02 through a misconfigured jump host. Persistence exists on the production host.","question":"What is the least aggressive action that restores control?","options":[{"t":"Red removes the task and blocks the jump-host path, then continues","correct":true,"note":"Cleanup completes in 15 minutes; the host never goes down; the exercise continues in scope."},{"t":"Reimage PROD-DB-02 during business hours, accepting the outage","correct":false},{"t":"Cancel the exercise and start formal IR on production at once","correct":false},{"t":"Leave the task alone; it belongs to the exercise anyway","correct":false}],"why":"Least aggressive wins: targeted removal and fixing the jump host restores control without outage or evidence loss. Reimaging and full IR are disproportionate to a confirmed, owned artefact."},{"scenario":"STEP 3: The CISO asks whether a real attacker could repeat this path.","question":"What belongs in the answer?","options":[{"t":"Yes — the path worked end-to-end; here is the timeline and the fix plan","correct":true,"note":"The CISO accepts the answer; the jump host fix lands in the sprint."},{"t":"No — we stopped everything before anything happened","correct":false},{"t":"We cannot share exercise details with anyone","correct":false},{"t":"It was only a test, so there is no risk","correct":false}],"why":"Honest, specific, actionable: state the confirmed path, provide the timeline, own the fix. Sugar-coating destroys the value of the exercise."}]},"hint":"Step 1: evidence beats statements. Step 2: ‘least aggressive’ is a hard constraint. Step 3: honesty with a fix plan.","expl":{"why":"Conflicting signals resolved by evidence; containment chosen at the smallest effective scale; executive reporting kept honest. The jump-host misconfiguration was a real finding — arguably the most valuable one of the exercise — precisely because the process handled it without panic.","study":"Pre-write your ‘off-scope hit’ playbook: pause, verify, least-aggressive fix, honest report."}},{"id":"h4","type":"multi","kind":"multi","theme":"Red Team Operations","concepts":["Deconfliction","Scope & authorization","Log analysis & filtering"],"summary":"Separate real-intrusion signals from exercise noise","scenario":{"text":"Announced exercise window: 09:00–17:00. Exercise scope: lab segment. During the night before, several events occurred. Some support the hypothesis of a real intrusion; some are explained by the exercise; one is ambiguous noise. The exercise director needs a defensible selection."},"question":"Select every observation that supports a REAL intrusion rather than exercise activity.","data":{"options":[{"t":"VPN login with approved MFA push at 02:40 from a new country","correct":true,"why":"Hours before the window, human-approved MFA, new geography — nothing about this matches automated exercise tooling."},{"t":"Beacon to the domain listed in the red team plan card at 10:30","correct":false,"why":"In-window traffic to the documented C2 is exactly what the exercise produces."},{"t":"New local admin created at 03:10 on a server outside scope","correct":true,"why":"Out-of-window, out-of-scope, and account creation is not in the red team’s night plan."},{"t":"Phishing test emails delivered by the exercise platform at 10:15","correct":false,"why":"That is the platform doing its job during the window."},{"t":"DNS queries to a domain never used by red tooling, first seen 02:55","correct":true,"why":"Unknown infrastructure, out of window — cannot be attributed to the exercise."},{"t":"Volume shadow copy deleted at 03:30 on the DB server","correct":true,"why":"Destructive anti-recovery behaviour at night, on an out-of-scope host — classic pre-ransomware, never part of this exercise’s plan."},{"t":"Failed ping sweep at 11:00 from the red jump host","correct":false,"why":"In-window, in-scope, and on documented infrastructure — exercise noise."},{"t":"Red team tool version number in the ticket","correct":false,"why":"A metadata line — it supports nothing about an intrusion."}]},"hint":"Time and place: the window and the scope decide what the exercise can explain.","expl":{"why":"Attribution follows two axes: time (inside the announced window?) and place (inside the scope, on documented infrastructure?). The 02:40 VPN login, the 03:10 account creation, the unknown 02:55 DNS domain and the 03:30 shadow-copy deletion all sit outside what the exercise can explain — they support a real intrusion and belong in an IR thread. Everything in-window on red infrastructure is noise by design.","study":"When signals conflict, build a two-column table: what the exercise CAN explain vs what it cannot."}},{"id":"h5","type":"terminal","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Safety controls & cleanup","Persistence mechanisms","Evidence handling (forensics-safe)"],"summary":"Clean up the red team’s persistence the right way","scenario":{"text":"Exercise over. One artefact remains: red team scheduled task ATR-Sim-Persist on lab host LAB-WKS-09. It must be removed — not merely stopped or disabled. Task removal goes through the task scheduler so the action is logged; raw file deletion under System32 is forbidden. You have an elevated shell on the host. Environment: Windows, admin console available; task name confirmed as ATR-Sim-Persist."},"question":"Type the command that removes the scheduled task ATR-Sim-Persist, then run it.","data":{"title":"LAB-WKS-09 — elevated shell","prompt":"PS LAB-WKS-09> ","welcome":["Windows PowerShell — exercise cleanup","NOTE: /Delete removes. /Change or /Disable only alters. Manual file deletion is forbidden."],"output":["SUCCESS: The scheduled task “ATR-Sim-Persist” was successfully deleted.","Audit: schtasks delete logged (event 4699-adjacent, cleanup ticket EX-2201)."],"expected":"schtasks /Delete /TN ATR-Sim-Persist /F","parts":"schtasks = Windows task scheduler CLI. /Delete = removes the task entirely. /TN ATR-Sim-Persist = the task by name. /F = force, suppress the confirmation prompt.","elements":[{"label":"Uses schtasks with /Delete","re":"^schtasks\\b[\\s\\S]*\\/delete\\b","why":"/Delete is the only switch that removes the task and logs it properly."},{"label":"Targets /TN ATR-Sim-Persist","re":"\\/tn\\s+\\\"?atr-sim-persist\\\"?\\b","why":"The task name from the scenario must be addressed exactly."},{"label":"Includes /F to suppress the prompt","re":"\\/f\\b","why":"Non-interactive shells hang without /F."}],"forbidden":[{"label":"Uses /Change or /Disable instead of removal","re":"\\/change\\b|\\/disable\\b|\\/end\\b","why":"These leave the task on disk — the exercise requires removal, and a disabled task can be re-enabled.","danger":false},{"label":"Creates or re-registers a task","re":"\\/create\\b","why":"/Create adds persistence — the exact opposite of cleanup.","danger":true},{"label":"Deletes task files directly","re":"\\bdel\\b|\\berase\\b|remove-item|system32\\\\tasks","why":"Raw file deletion under System32 bypasses the scheduler’s audit trail — explicitly forbidden here.","danger":true}],"syntax":null,"sampleOut":null},"hint":"The requirement says removed, logged through the scheduler, and never deleted from the filesystem by hand.","expl":{"why":"schtasks /Delete /TN ATR-Sim-Persist /F removes the task cleanly and leaves an audit entry. /Disable or /Change would look like cleanup but leave the artefact on disk — a near-miss that fails the requirement. /Create re-adds persistence. Manual deletion of the task XML under System32 works but destroys the scheduler’s audit trail, which is exactly what the after-action review needs. In cleanup, how you remove matters as much as removing.","study":"Compare /Delete, /Disable and /End on a lab task and read the audit events each one leaves."}},{"id":"h6","type":"match","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Telemetry & data sources","Detection engineering","Techniques & sub-techniques"],"summary":"Map five detections to the data sources they need","scenario":{"text":"The detection backlog is frozen until each idea names its required telemetry. Match each detection idea to the data source it cannot work without."},"question":"Drag each detection idea onto the data source it requires.","data":{"zones":[{"id":"d1","label":"Process access events (handle to lsass)"},{"id":"d2","label":"Scheduled task creation events"},{"id":"d3","label":"Network flow / traffic content"},{"id":"d4","label":"Account management events"},{"id":"d5","label":"Process command-line parameters"}],"items":[{"id":"x1","t":"Alert on LSASS handle access from non-system processes","zone":"d1","why":"Without process access telemetry, handle requests to lsass are invisible."},{"id":"x2","t":"Detect scheduled task creation for persistence","zone":"d2","why":"Task creation events (e.g. 4698) are the only direct evidence of T1053.005."},{"id":"x3","t":"Detect fixed-interval beaconing with jitter","zone":"d3","why":"Interval analysis needs flow or traffic content, not endpoint logs."},{"id":"x4","t":"Detect new local admin account creation","zone":"d4","why":"Account management events carry creation and group-change records."},{"id":"x5","t":"Detect obfuscated command lines in scripts","zone":"d5","why":"Obfuscation lives in the command line — capture it or miss it."}]},"hint":"Ask: what would have to be absent for this detection to be impossible?","expl":{"why":"Every detection is a promise about data. LSASS-access rules need process access events; task persistence needs task creation events; beacon rules need network data; admin-account rules need account management events; obfuscation rules need command lines. Naming the source first kills half the false ‘detection gaps’ in backlogs — they were collection gaps all along.","study":"For every rule you write, record its data source — the heatmap’s data-source row depends on it."}},{"id":"h7","type":"order","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Risk prioritization","Credential access (dumping, spraying)","Payload delivery & execution"],"summary":"Rank the detection gaps by real risk","scenario":{"text":"Five gaps came out of the quarter’s exercises. Engineering capacity covers two. Rank them by risk so the top two are obvious."},"question":"Drag the gaps into risk order (highest risk first).","data":{"items":[{"id":"g1","t":"Zero coverage for credential dumps on domain controllers"},{"id":"g2","t":"No alert on macro payload execution on executive laptops"},{"id":"g3","t":"Lateral RDP between servers not alerted"},{"id":"g4","t":"USB collection not alerted on lab-only hosts"},{"id":"g5","t":"Heatmap tool missing a dark theme"}],"correctIds":["g1","g2","g3","g4","g5"]},"hint":"Ask two questions: how close to domain compromise does the technique sit, and which assets does it touch?","expl":{"why":"Credential dumps on DCs sit one step from total compromise — highest. Macro execution on executive laptops is the likely entry path for the next real intrusion. Server-to-server RDP is lateral movement at scale. USB collection on lab-only hosts is low stakes. A missing UI theme is cosmetic — a deliberate filler to test whether you rank by risk or by noise.","study":"Defend your ranking in one sentence per item — that sentence is what management actually buys."}},{"id":"h8","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["C2 frameworks & beacons","Log analysis & filtering"],"summary":"The quiet TXT queries nobody escalated","scenario":{"text":"For weeks the DNS log shows a workstation making ~17 TXT queries per day to dnstunnel[.]example. Volume is tiny; the security stack scores it ‘low’. The subdomains look like random base64 fragments. Everyone ignored it because nothing else fires and the volume is unimpressive. Exercise tooling does not use this domain."},"question":"Why does this deserve escalation now?","data":{"viewer":{"title":"dns.log — sample (same pattern repeats daily)","lines":[{"raw":"08:00:04  WS-231 -> dnstunnel[.]example  TXT  aGVsbG8uc2VjLnJlYQ  NOERROR"},{"raw":"08:30:02  WS-231 -> dnstunnel[.]example  TXT  bDM0ZF9kMHdu  NOERROR"},{"raw":"09:00:03  WS-231 -> dnstunnel[.]example  TXT  IXMuaGVyZQ  NOERROR"},{"raw":"09:30:05  WS-231 -> dnstunnel[.]example  TXT  c3RpbGxfd2F0Y2hpbmc  NOERROR"}]},"options":[{"t":"Encoded TXT subdomains at fixed intervals are a known DNS tunnel pattern","correct":true,"why":"TXT records with base64-like payloads every 30 minutes from one host is textbook DNS tunnelling — low volume is a feature of stealth, not safety."},{"t":"Any DNS query to a previously unknown domain is itself an attack","correct":false,"why":"Too broad — the company would drown in false positives; the pattern, not the novelty, is the evidence."},{"t":"The DNS resolver is overloaded and urgently needs more capacity","correct":false,"why":"17 queries a day is nothing; capacity is not the issue."},{"t":"NTP and DNS services should never run on the same physical server","correct":false,"why":"Irrelevant — nothing in the artefacts mentions NTP co-location."}]},"hint":"Look at what the queries carry (TXT payloads) and how evenly they are spaced — then ask what tool does that.","expl":{"why":"This is the ‘looks benign’ trap in reverse: small volume and steady rhythm read as harmless background noise, but they are the signature of DNS tunnelling — data smuggled in encoded subdomains via TXT queries at fixed intervals. Volume-based scoring misses exactly this, because stealthy C2 is designed to stay under thresholds. One host, one domain, encoded payloads, metronomic timing: escalate.","study":"Practise reading DNS logs for record type (TXT), payload entropy and interval regularity — not just volume."}},{"id":"h9","type":"blank","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Scope & authorization","Evidence handling (forensics-safe)","After-action reporting","Deconfliction"],"summary":"Complete the standing orders for exercise oversight","scenario":{"text":"Your team writes standing orders for SOC duty during exercises. Four terms are missing from the policy text. Choose them so the orders are correct and unambiguous."},"question":"Fill in each blank in the standing orders.","data":{"text":"All exercise activity must stop the moment it leaves the agreed {0}. The duty officer records every disputed alert in the {1} so both teams share one truth. Artefacts from suspected real attacks are preserved with {2} — never quick deletes. After the exercise, the {3} records what defenders saw, missed, and fixed.","slots":[{"opts":["scope","the exercise window","the change-freeze window"],"correct":"scope","why":"Scope is the boundary that triggers an automatic stop when crossed."},{"opts":["deconfliction log","the exercise ticket","the shift handover notes"],"correct":"deconfliction log","why":"One shared log prevents the classic ‘red said, blue said’ dispute."},{"opts":["forensic imaging","a signed attestation","a screenshot in the ticket"],"correct":"forensic imaging","why":"Only full imaging preserves evidence defensibly for later scrutiny."},{"opts":["after-action report","a detection backlog entry","the closeout email thread"],"correct":"after-action report","why":"The after-action report is the exercise’s final deliverable."}]},"hint":"Boundary, shared log, careful preservation, final document — in that order.","expl":{"why":"Standing orders turn judgment into procedure: scope crossings stop everything; deconfliction logs keep one version of truth; suspected-real artefacts get forensic imaging so evidence survives scrutiny; and the after-action report converts observations into fixes. Teams with written orders deconflict in minutes; teams without them argue for days.","study":"Draft one page of standing orders for your own SOC — scope, log, evidence, report."}},{"id":"h10","type":"spot","kind":"single","theme":"Detection & Purple Teaming","concepts":["Sigma-style rules","Detection engineering","Telemetry & data sources"],"summary":"Find the line that makes the rule almost never fire","scenario":{"text":"A detection engineer tuned a rule for the emulated PowerShell download technique. It passed syntax validation but fired zero times during two full test runs. One line is logically broken."},"question":"Click the line that makes this rule almost never fire.","data":{"lines":[{"t":"detection:","correct":false,"why":"Header line — fine."},{"t":"  selection_img:","correct":false,"why":"Selection headers are fine on their own; the problem is how the two are combined."},{"t":"    Image|endswith: '\\\\powershell.exe'","correct":false,"why":"Valid field for a process creation event."},{"t":"  selection_net:","correct":false,"why":"Selection header — fine on its own."},{"t":"    DestinationHostname|endswith: 'storage-sync[.]example'","correct":false,"why":"Valid field for a network connection event."},{"t":"  condition: selection_img AND selection_net","correct":true,"why":"AND joins two selections against the SAME single event. selection_img describes a process creation event; selection_net describes a network connection event. No single event carries both field sets, so the rule can almost never fire. Correlating two event types needs two rules (or a correlation rule), not one AND."},{"t":"  timeframe: 15m","correct":false,"why":"A timeframe on top is harmless here."}]},"hint":"Ask which single event could match both selections at the same moment — and what kind of event each selection describes.","expl":{"why":"The classic false-negative bug: two selections that describe two different event types, joined with AND. A process creation event has Image and ParentImage fields; a network connection event has DestinationHostname. No single event carries both field sets, so the AND is nearly unsatisfiable — the rule stays silent while the technique runs. Split it into two rules, or use a correlation rule that relates the process event to the network event.","study":"After writing a rule, ask: ‘what single event satisfies every selection at once?’ If none can, split the rule or correlate two rules."}},{"id":"h11","type":"match","kind":"multi","theme":"Detection & Purple Teaming","concepts":["True/false positive triage","Deconfliction","Persistence mechanisms"],"summary":"Classify six exercise findings into three buckets","scenario":{"text":"End of day 2. Six items sit in the exercise review queue. Classify each before the 16:30 sync: confirmed simulation activity, suspicious treat-as-real, or a defensive control gap."},"question":"Drag each finding onto the correct bucket.","data":{"zones":[{"id":"b1","label":"Confirmed simulation activity"},{"id":"b2","label":"Suspicious — treat as real until checked"},{"id":"b3","label":"Control gap (defensive finding)"}],"items":[{"id":"n1","t":"Beacon to the registered exercise C2 from an in-scope host at 10:30","zone":"b1","why":"Documented domain, documented host, in-window — simulation."},{"id":"n2","t":"Out-of-hours login with the exercise test account on a production server","zone":"b2","why":"Exercise credentials should never appear on production, at night — treat as real until deconflicted."},{"id":"n3","t":"No detection exists for directory-service dump tooling","zone":"b3","why":"A missing detection is a gap, not an incident."},{"id":"n4","t":"Macro payload executed on an in-scope lab host, matching the announced test","zone":"b1","why":"In-scope, in-window, matches the card — simulation."},{"id":"n5","t":"New scheduled task on the production DB server, unknown creator, outside the window","zone":"b2","why":"Production + unknown creator + outside window: the exercise cannot explain it."},{"id":"n6","t":"A leftover EDR exclusion folder from the last exercise is still active","zone":"b3","why":"Stale exclusions weaken defenses — a gap to close, not an event to triage."}]},"hint":"Window and scope prove simulation; production and night hours break the alibi; ‘nothing exists’ is always a gap.","expl":{"why":"Triage buckets follow evidence: documented domain + in-scope host + in-window time = simulation; exercise credentials on production at night, or unknown creators outside the window, exceed what the exercise can explain = suspicious; and anything that is fundamentally a missing detection or stale exclusion is a gap for the backlog, not an incident.","study":"Sort your own incident queue with these three buckets for a day — it exposes how much is mislabeled."}},{"id":"h12","type":"mc","kind":"single","theme":"Red Team Operations","concepts":["Safety controls & cleanup","Scope & authorization"],"summary":"Choose the least aggressive acceptable cleanup","scenario":{"text":"Exercise ends in one hour. Red’s scheduled task still lives on one lab host. The CISO wants ‘clean state’ before a board demo tomorrow. The lab host hosts the demo environment too."},"question":"What is the LEAST aggressive action that still achieves clean state?","data":{"options":[{"t":"Red removes its task and verifies; the host keeps running","correct":true,"why":"Targeted removal by the owner, verified, with zero downtime — exactly ‘least aggressive that works’."},{"t":"Reimage the whole lab host immediately before the demo","correct":false,"why":"Works, but destroys the demo environment’s state and the exercise’s forensic trail for one artefact."},{"t":"Leave the task in place; nobody will notice it anyway","correct":false,"why":"Not clean state — and unowned persistence, however small, is a finding by itself."},{"t":"Block all domain logins for one hour to be safe","correct":false,"why":"Massively aggressive, business-wide impact, solves nothing extra."}]},"hint":"The scale of the response should match the scale of the artefact — one task, one host, one owner.","expl":{"why":"Proportionality is the test: the artefact is a single task on a single host, and its owner is present. Owner-led removal with verification satisfies ‘clean state’ with no downtime and preserves evidence. Reimaging, login blocks or ignoring the artefact all fail the proportionality or the requirement.","study":"For every response option ask: what does it cost, and what does it actually fix?"}},{"id":"h13","type":"steps","kind":"multi","theme":"Red Team Operations","concepts":["Deconfliction","Credential access (dumping, spraying)","Executive communication"],"summary":"A disabled service account logs into the VPN","scenario":{"text":"15:40, exercise window open, lab scope. The SIEM fires: svc-archive — disabled months ago — completed a successful VPN login 20 minutes ago. The red lead says ‘not ours’. Asset management says the account was decommissioned. The CISO needs a position in 10 minutes."},"question":"Pick the best action for each of the three steps.","data":{"steps":[{"scenario":"STEP 1: Two facts collide — an impossible login, and an exercise window that tempts everyone to shrug.","question":"Which interpretation wins for now, and why?","options":[{"t":"Treat as potentially real: disabled account, out of exercise scope","correct":true,"note":"Team proceeds on the ‘potentially real’ track — the safer assumption."},{"t":"Call it simulation noise; the exercise window is still open","correct":false},{"t":"Blame the VPN vendor’s firmware for the duplicate login","correct":false},{"t":"Assume the SIEM duplicated an old log line from last year","correct":false}],"why":"The exercise can explain lab-segment activity, not a disabled account on the VPN — scope defeats the shortcut. ‘Potentially real’ is the only assumption that stays safe under both outcomes."},{"scenario":"STEP 2: The CISO wants truth fast — without tipping off a possible intruder.","question":"Which action proves the facts fastest without alerting anyone?","options":[{"t":"Pull VPN and DC logs; check the source IP against red infrastructure","correct":true,"note":"The source IP resolves to the red team’s ISP block — mystery solved in 8 minutes."},{"t":"Disable the VPN for all users while you investigate quietly","correct":false},{"t":"Email all staff asking who used the old account recently","correct":false},{"t":"Post the question openly in the public exercise chat channel","correct":false}],"why":"Quiet verification through logs answers fast and leaks nothing. Mass disabling costs the business; public questions warn a real intruder."},{"scenario":"STEP 3: Red confirms: a team member used svc-archive for a shortcut because the tool rejected their named account. No attacker exists.","question":"What closes this properly?","options":[{"t":"Log it; fix the decommission process; note it in the report","correct":true,"note":"The decommission process gets a checklist item; the report records the near-miss."},{"t":"Fire the red team member publicly as a warning to others","correct":false},{"t":"Report a formal breach to the regulator this same evening","correct":false},{"t":"Delete the embarrassing logs before anyone else reads them","correct":false}],"why":"The root cause is a process defect — a disabled account still authenticates. Fix the process, record the event, keep the trust."}]},"hint":"Step 1: what can the exercise NOT explain? Step 2: what proves facts without noise? Step 3: fix the system, not the person.","expl":{"why":"A disabled account completing a login is a contradiction the exercise cannot absorb — scope and state both argue ‘potentially real’. Quiet log work resolves it in minutes without tipping anyone. The close-out targets the process that let a disabled account authenticate at all — that defect would have hidden a real attacker one day.","study":"Add ‘disabled accounts must fail closed’ to your hardening list; test it like the red team did."}},{"id":"h14","type":"match","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Evasion (jitter, LOLBins, AMSI)","C2 frameworks & beacons"],"summary":"Match each evasion concept to what it actually does","scenario":{"text":"Blue keeps mislabeling evasion concepts in the debrief. Lock the vocabulary before the report goes out."},"question":"Drag each concept onto the sentence that describes it.","data":{"zones":[{"id":"v1","label":"Changes how the beacon looks on the network"},{"id":"v2","label":"Hides script content from the Windows scripting scanner"},{"id":"v3","label":"Breaks time-based beacon detection"},{"id":"v4","label":"Uses trusted built-in system tools to blend in"},{"id":"v5","label":"Avoids writing payloads to disk"}],"items":[{"id":"w1","t":"Malleable C2 profile","zone":"v1","why":"Malleable profiles reshape beacon traffic — URIs, headers, timings — to mimic ordinary apps."},{"id":"w2","t":"AMSI bypass","zone":"v2","why":"The Antimalware Scan Interface inspects scripts; bypassing it hides content from that scanner."},{"id":"w3","t":"Sleep timers with jitter","zone":"v3","why":"Randomised sleep breaks fixed-interval detection — the exact pattern blue hunts for."},{"id":"w4","t":"Living-off-the-land binaries","zone":"v4","why":"LOLBins like certutil or mshta are signed, trusted tools — abuse looks like admin work."},{"id":"w5","t":"In-memory only execution","zone":"v5","why":"Fileless execution leaves no dropped artefact for AV to scan."}]},"hint":"One concept is about network appearance, one about a scripting scanner, one about rhythm, one about trusted tools, one about disks.","expl":{"why":"Evasion vocabulary maps to defence surfaces: network appearance (malleable profiles), script inspection (AMSI), timing analysis (sleep jitter), trust abuse (LOLBins), and filesystem visibility (in-memory execution). Blue teams that can name the surface can also name the telemetry each one needs — that is why the vocabulary matters in the report.","study":"For each concept, name one detection that fights it — e.g. jitter vs interval-window rules."}},{"id":"h15","type":"multi","kind":"multi","theme":"Red Team Operations","concepts":["Safety controls & cleanup","Scope & authorization","Deconfliction"],"summary":"Which observations justify pausing the exercise immediately?","scenario":{"text":"The exercise director keeps a ‘stop list’: conditions that pause the exercise at once, no debate. Everything else gets logged and handled in the flow. Test the list against six observations."},"question":"Select every observation that belongs on the immediate-stop list.","data":{"options":[{"t":"Activity observed on a system outside the scope","correct":true,"why":"Scope crossings stop everything until verified — the core safety rule."},{"t":"A production service crashed during a red team action","correct":true,"why":"Unintended business impact is the definition of ‘stop now’."},{"t":"Deconfliction cannot rule out real attacker activity","correct":true,"why":"If red cannot claim it and blue cannot explain it, safety demands a pause."},{"t":"A planned phishing test email bounced","correct":false,"why":"Delivery failure is a logistics hiccup, not a safety event."},{"t":"Red team’s test account was locked by normal password policy","correct":false,"why":"Account friction is routine; the team re-issues credentials through the process."},{"t":"The SIEM dashboard feels slow today","correct":false,"why":"Performance complaints go to the platform team — they never stop a safe exercise."}]},"hint":"The stop list is about safety: scope, stability, and unresolvable ambiguity. Everything else is life.","expl":{"why":"Immediate stop exists for three conditions: the exercise left its boundaries, it damaged something, or its actions can no longer be distinguished from a real attack. Bounced emails, locked test accounts and slow dashboards are operational friction — they get logged, not feared. A stop list that fires on trivia loses authority; one that fires on safety keeps it.","study":"Write your team’s stop list now, while calm — nobody writes a good one mid-incident."}},{"id":"h16","type":"multi","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Persistence mechanisms","True/false positive triage","Log analysis & filtering"],"summary":"Select every line that is a TRUE positive for the emulated persistence","scenario":{"text":"The exercise emulated scheduled-task persistence (T1053.005) using the runner’s task name ATR-Sim-Persist. The SIEM captured 10 task-creation events. Some belong to the emulation, some to IT automation, some to ordinary admin work. The report counts only true positives of the emulated technique."},"question":"Select every log line that is a true positive for the emulated persistence technique.","data":{"viewer":{"title":"Task creation events — exercise day","lines":[{"raw":"09:12  NEW TASK  ATR-Sim-Persist      creator: svc-redrunner  host: LAB-WKS-04"},{"raw":"09:40  NEW TASK  PatchScan-Daily      creator: SCCMService    host: ALL-DEPLOY"},{"raw":"11:03  NEW TASK  ATR-Sim-Persist      creator: svc-redrunner  host: LAB-WKS-09"},{"raw":"11:47  NEW TASK  Backup-Verify        creator: VeeamSvc       host: BK-01"},{"raw":"13:15  NEW TASK  ATR-Sim-Persist      creator: jkline         host: LAB-WKS-04"},{"raw":"14:02  NEW TASK  WeeklyDefrag         creator: SYSTEM         host: FS-LAB-02"}]},"options":[{"t":"09:12 ATR-Sim-Persist by svc-redrunner on LAB-WKS-04","correct":true,"why":"Runner account + exercise task name + in-scope host: the emulation at work."},{"t":"09:40 PatchScan-Daily by SCCMService","correct":false,"why":"Standard IT automation — same technique family, wrong actor; it is a false positive for this exercise."},{"t":"11:03 ATR-Sim-Persist by svc-redrunner on LAB-WKS-09","correct":true,"why":"Same signature, second lab host — part of the emulation."},{"t":"11:47 Backup-Verify by VeeamSvc","correct":false,"why":"Backup service doing backup things — not the emulation."},{"t":"13:15 ATR-Sim-Persist by jkline on LAB-WKS-04","correct":false,"why":"The right task name but the wrong creator — jkline is a human admin; this is worth a deconfliction question, not a true positive."},{"t":"14:02 WeeklyDefrag by SYSTEM","correct":false,"why":"Ordinary maintenance — noise."}]},"hint":"The emulated technique needs BOTH the runner’s creator account AND the exercise task name. One line has the name but not the creator.","expl":{"why":"True positives for an emulated technique require actor and behaviour to match the plan: svc-redrunner creating ATR-Sim-Persist on in-scope hosts. The 13:15 line is the trap — same task name, human creator — which is either coincidence or sloppy reuse; it demands deconfliction, not counting. IT automation and SYSTEM maintenance share the technique family but not the actor, so they stay false positives.","study":"Attribute events on actor + behaviour + scope, never on a single field like the task name."}}]};
"use strict";
/* EXAM payload is injected by the build script immediately before this file. */
var T = EXAM.meta, SEV = EXAM.severity, STATE = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtClock(sec){ sec=Math.max(0,sec|0); var m=(sec/60)|0, s=sec%60; if(m>=60){ var h=(m/60)|0; m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); } return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function exById(id){ return byId(EXAM.exercises,id); }

/* ================= STATE ================= */
function newState(){
  return {
    order: shuffle(EXAM.exercises.map(function(e){return e.id;})),
    idx: 0, current: null, fromReview: false, attempt: 1,
    results: {}, skipped: [], checked: false,
    hintUsed: {}, draft: {},
    timer: { remain: EXAM.timerSeconds, isRunning:false, isManuallyPaused:false, isAutoPausedAfterCheck:false, int:null },
    exTimer: { remain:0, int:null, exId:null },
    reported: false, timeUp: false, username: ''
  };
}
function answeredIds(){ return Object.keys(STATE.results).filter(function(k){ return !STATE.results[k].excluded; }); }
function liveScore(){
  var ids=answeredIds(), earned=0, poss=ids.length*100;
  ids.forEach(function(k){ earned += STATE.results[k].earned; });
  return {earned:earned, poss:poss};
}
function themeBreakdown(){
  var m={};
  answeredIds().forEach(function(k){
    var ex=exById(k), r=STATE.results[k];
    if(!m[ex.theme]) m[ex.theme]={earned:0,poss:0,n:0};
    m[ex.theme].earned+=r.earned; m[ex.theme].poss+=100; m[ex.theme].n++;
  });
  return m;
}

/* ================= TIMER ================= */
function timerIndicator(){
  var t=STATE.timer;
  if(STATE.timeUp) return {cls:'',txt:'\u23F9 time is up'};
  if(STATE.finished) return {cls:'',txt:'\u23F9 exam finished'};
  if(!t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck) return {cls:'',txt:'\u2014 not started'};
  if(t.isManuallyPaused) return {cls:'pausedyou',txt:'\u23F8 paused by you'};
  if(t.isAutoPausedAfterCheck) return {cls:'pausedfb',txt:'\u23F8 paused \u2014 review your feedback'};
  return {cls:'running',txt:'\u25B6 running'};
}
function renderTimer(){
  var t=STATE.timer, el=$('htimer'), ind=timerIndicator();
  el.textContent=fmtClock(t.remain);
  el.className='timer'+(t.remain<60?' crit':(t.remain<300?' low':''));
  var m=$('htmode'); m.textContent=ind.txt; m.className='tmode '+ind.cls;
}
function timerTick(){
  var t=STATE.timer;
  if(t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck){
    t.remain--;
    renderTimer();
    if(t.remain<=0){ t.remain=0; timeUp(); }
  }
}
function startTimer(){
  var t=STATE.timer;
  if(t.int) clearInterval(t.int);
  t.isRunning=true; t.isManuallyPaused=false; t.isAutoPausedAfterCheck=false;
  t.int=setInterval(timerTick,1000); renderTimer();
}
function stopTimerLoop(){ var t=STATE.timer; if(t.int){clearInterval(t.int); t.int=null;} t.isRunning=false; }
function setAutoPause(on){
  STATE.timer.isAutoPausedAfterCheck=on; renderTimer();
}
function manualPause(){
  STATE.timer.isManuallyPaused=true; renderTimer(); showPauseOverlay(true);
  var b=$('bpause'); if(b){ b.innerHTML='&#9654; Resume'; }
}
function manualResume(){
  STATE.timer.isManuallyPaused=false; showPauseOverlay(false); renderTimer();
  var b=$('bpause'); if(b){ b.innerHTML='&#9208; Pause'; }
}
function timeUp(){
  if(STATE.timeUp) return;
  STATE.timeUp=true; stopTimerLoop(); stopExerciseTimer(); showPauseOverlay(false);
  renderResults(true);
}

/* per-exercise reduced timer (EXTREMELY HARD terminal) */
function startExerciseTimer(ex){
  stopExerciseTimer();
  if(!ex.timerSeconds) return;
  STATE.exTimer={remain:ex.timerSeconds,int:null,exId:ex.id};
  var box=$('exclock'); if(box) box.innerHTML='&#9201; Exercise timer: <b id="exclockv">'+fmtClock(ex.timerSeconds)+'</b>';
  STATE.exTimer.int=setInterval(function(){
    /* the reduced timer respects both pause flags and never runs after time is up */
    if(STATE.timeUp || STATE.timer.isManuallyPaused || STATE.timer.isAutoPausedAfterCheck) return;
    STATE.exTimer.remain--;
    var v=$('exclockv'); if(v) v.textContent=fmtClock(STATE.exTimer.remain);
    if(STATE.exTimer.remain<=0){
      stopExerciseTimer();
      STATE.results[ex.id]={earned:0,status:'excluded',excluded:true,answered:false,studentText:'(no answer \u2014 exercise timer ended)'};
      advanceAfterExclusion();
    }
  },1000);
}
function stopExerciseTimer(){ if(STATE.exTimer && STATE.exTimer.int){ clearInterval(STATE.exTimer.int); STATE.exTimer.int=null; } }
function advanceAfterExclusion(){
  stopExerciseTimer();
  goNext(true);
}

/* ================= HEADER ================= */
function renderHeader(){
  $('hbadge').innerHTML='&#9733; '+esc(SEV.label);
  var bd=$('hbadge'); bd.style.setProperty('--sev',SEV.color); bd.style.setProperty('--sevbg',SEV.bg);
  if(!STATE){ return; }
  var total=STATE.order.length;
  var pos=STATE.current? (STATE.order.indexOf(STATE.current)+1) : 0;
  $('hcount').textContent = STATE.current ? ('Exercise '+pos+' of '+total) : ('Exercises: '+total);
  var ls=liveScore();
  $('hscore').textContent=ls.earned+' / '+ls.poss;
  var done=answeredIds().length;
  $('hprog').style.width=Math.round(100*done/total)+'%';
  var ex=STATE.current?exById(STATE.current):null;
  $('bhint').disabled=!ex||!!STATE.hintUsed[ex.id]||STATE.checked;
  $('bskip').disabled=!ex||STATE.checked||STATE.timeUp;
}

/* ================= NAV ================= */
function showScreen(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){ var n=$(s); if(n) n.className=s===id?'':'hidden'; });
  $('hdr').className = (id==='scr-intro')?'hidden':'';
}
function startExam(){
  startTimer();
  loadExercise(STATE.order[0]);
}
function loadExercise(id){
  STATE.current=id; STATE.checked=false;
  var returning=STATE.fromReview; STATE.fromReview=false;
  setAutoPause(false);
  $('bpause').disabled=false; $('bfinish').disabled=false;
  renderExercise(exById(id));
  renderHeader();
  showScreen('scr-exam');
  startExerciseTimer(exById(id));
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function skipCurrent(){
  if(STATE.checked||!STATE.current||STATE.timeUp) return;
  stopExerciseTimer();
  if(STATE.skipped.indexOf(STATE.current)<0) STATE.skipped.push(STATE.current);
  nextUnansweredOrReview();
}
function nextUnansweredOrReview(){
  var next=null;
  for(var i=0;i<STATE.order.length;i++){ var id=STATE.order[i]; if(!STATE.results[id] && STATE.skipped.indexOf(id)<0){ next=id; break; } }
  if(next){ loadExercise(next); }
  else if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); }
  else { renderResults(false); }
}
function goNext(afterExclusion){
  stopExerciseTimer();
  if(STATE.fromReviewPending){ STATE.fromReviewPending=false; STATE.current=null;
    if(STATE.skipped.length>0 && !STATE.timeUp) renderReview(); else nextUnansweredOrReview();
    return;
  }
  if(STATE.current){
    var i=STATE.order.indexOf(STATE.current);
    for(var j=i+1;j<STATE.order.length;j++){ if(!STATE.results[STATE.order[j]] && STATE.skipped.indexOf(STATE.order[j])<0){ loadExercise(STATE.order[j]); return; } }
    if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); return; }
    if(answeredIds().length===STATE.order.length){ renderResults(false); return; }
    nextUnansweredOrReview();
  } else {
    nextUnansweredOrReview();
  }
}
function finishFlow(){
  if(STATE.timeUp){ renderResults(true); return; }
  stopExerciseTimer();
  /* move any never-answered exercises into the skipped pool so they can be reviewed */
  STATE.order.forEach(function(id){
    if(!STATE.results[id] && STATE.skipped.indexOf(id)<0) STATE.skipped.push(id);
  });
  if(STATE.skipped.length>0){ renderReview(); } else { renderResults(false); }
}
function returnToSkipped(id){
  STATE.fromReview=true; STATE.fromReviewPending=true;
  STATE.skipped=STATE.skipped.filter(function(x){return x!==id;});
  loadExercise(id);
}

/* ================= HINT ================= */
function useHint(){
  if(!STATE.current||STATE.checked) return;
  var ex=exById(STATE.current);
  if(STATE.hintUsed[ex.id]) return;
  STATE.hintUsed[ex.id]=true;
  var box=$('hintarea');
