<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>Adversary Simulation — EASY practice exam</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "adversary-simulation", "batch": 1, "title": "Adversary Simulation — EASY", "difficulty": "easy", "questionCount": 16, "estimatedMinutes": 25, "passMark": 70}</script>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#121d33; --panel2:#16233d; --line:#25365c; --line2:#31456f;
  --txt:#e7eef9; --muted:#9db0cf; --dim:#7288ab;
  --blue:#4f8ef7; --amber:#f5a623; --green:#2fd07a; --red:#f0564a; --orange:#f97316; --grey:#8ea3c0;
  --sev:#2fd07a; --sevbg:rgba(47,208,122,.14);
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --rad:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *,*::before,*::after{transition:none!important;animation:none!important} }
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--blue)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1060px,94vw);margin:0 auto}

/* ---------- persistent header ---------- */
#hdr{position:sticky;top:0;z-index:50;background:rgba(10,16,30,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hdr .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0}
.hchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;min-height:36px}
.hchip .k{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:6px 12px;font-size:13.5px;background:var(--sevbg);color:var(--sev);border:1px solid var(--sev);min-height:36px}
.timer{font-family:var(--mono);font-size:18px;font-weight:700;min-width:96px;text-align:center}
.timer.low{color:var(--amber)} .timer.crit{color:var(--red)}
.tmode{font-size:12.5px;color:var(--muted);display:block;line-height:1.2}
.tmode.running{color:var(--green)} .tmode.pausedyou{color:var(--amber)} .tmode.pausedfb{color:var(--blue)}
.score{font-family:var(--mono);font-weight:700}
.spacer{flex:1}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 16px;font-size:14.5px;font-weight:600;min-height:44px;min-width:44px;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--panel2);border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#2b64d9,#1d4aa8);border-color:#3a76ea;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#3370e8,#2054b8)}
.btn.good{background:linear-gradient(180deg,#1f9d5f,#187a49);border-color:#2fd07a;color:#fff}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sev));transition:width .5s ease}

/* ---------- generic blocks ---------- */
main{flex:1;padding:22px 0 60px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:30px;line-height:1.2;margin:0 0 10px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin:14px 0}
.card.tint{background:linear-gradient(180deg,rgba(79,142,247,.07),var(--panel))}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)}
ul.clean{margin:6px 0;padding-left:20px} ul.clean li{margin:4px 0}

/* ---------- intro / results ---------- */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 2px}
.hero .logo{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 30% 30%,var(--sev),transparent 70%),var(--panel2);border:1px solid var(--sev);display:flex;align-items:center;justify-content:center;font-size:26px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted);margin:2px 4px 2px 0;background:var(--panel)}
.themewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.theme{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.theme h4{margin:0 0 6px;font-size:14.5px;color:var(--blue)}
.theme ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.theme li{margin:3px 0}
.notice{border-left:4px solid var(--blue);background:rgba(79,142,247,.08);border-radius:0 var(--rad) var(--rad) 0;padding:10px 14px;margin:12px 0}
.notice.amber{border-color:var(--amber);background:rgba(245,166,35,.08)}
.notice.green{border-color:var(--green);background:rgba(47,208,122,.08)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;font-size:14.5px}
.rule b{color:var(--txt)}
.cert{border:2px solid var(--sev);background:radial-gradient(circle at 85% 10%,rgba(47,208,122,.12),transparent 60%),var(--panel);border-radius:14px;padding:26px;text-align:center}
.cert .big{font-size:44px;font-weight:800;font-family:var(--mono)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-family:var(--mono)}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.ok .n{color:var(--green)} .stat.part .n{color:var(--amber)} .stat.bad .n{color:var(--red)} .stat.skip .n{color:var(--grey)}
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rpt th{background:var(--panel2);color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- exam exercise layout ---------- */
.exhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 4px}
.steptag{font-family:var(--mono);font-size:12.5px;border:1px dashed var(--line2);border-radius:6px;padding:3px 9px;color:var(--muted)}
.block{border:1px solid var(--line);border-radius:var(--rad);margin:12px 0;background:var(--panel);overflow:hidden}
.block>.bh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;cursor:default}
.block>.bh .ic{font-size:16px}
.block>.bh .sum{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block>.bh button.tgl{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:4px 14px;cursor:pointer;font-size:12.5px;min-height:44px}
.block>.bb{padding:14px 16px}
.block.scenario>.bh{background:rgba(79,142,247,.10);color:#9cc0ff;border-bottom-color:rgba(79,142,247,.25)}
.block.scenario>.bb{background:linear-gradient(180deg,rgba(79,142,247,.05),transparent)}
.block.question>.bh{background:rgba(245,166,35,.10);color:#ffcf7d;border-bottom-color:rgba(245,166,35,.25)}
.block.question>.bb{background:linear-gradient(180deg,rgba(245,166,35,.05),transparent)}
.block.question .qt{font-weight:700;font-size:17px}
.block.answer>.bh{background:rgba(47,208,122,.10);color:#7fe0ac;border-bottom-color:rgba(47,208,122,.25)}
.block.answer>.bb{background:linear-gradient(180deg,rgba(47,208,122,.04),transparent)}
.artefact{border:1px solid var(--line2);border-radius:8px;margin:10px 0;background:#0a1322}
.artefact>.ah{padding:7px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.artefact>.ab{padding:10px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.artefact.code>.ab{font-family:var(--mono);font-size:14.5px;line-height:1.5}
.hintbox{border:1px dashed var(--amber);background:rgba(245,166,35,.07);color:#ffd28a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;cursor:pointer;color:var(--txt);font-size:15.5px;min-height:44px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .lab{font-family:var(--mono);font-weight:700;color:var(--blue);flex:0 0 auto}
.opt.sel{border-color:var(--green);background:rgba(47,208,122,.08)}
.opt.sel .lab{color:var(--green)}
.opt.pick{border-color:var(--blue);background:rgba(79,142,247,.08)}
.multinote{font-size:13px;color:var(--amber);border:1px dashed var(--amber);border-radius:7px;padding:6px 10px;margin:0 0 10px;display:inline-block}

/* log viewer */
.viewer{border:1px solid var(--line2);border-radius:8px;background:#070e1a;margin:10px 0;overflow:hidden}
.viewer .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer .vh input{flex:1;min-width:180px;background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:8px 12px;font-family:var(--mono);font-size:14px;min-height:44px}
.viewer .vh .cnt{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.loglines{max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:14px;line-height:1.6}
.loglines .ln{padding:2px 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent}
.loglines .ln:hover{background:rgba(79,142,247,.06)}
.loglines .ln.info{color:#c9d6ee} .loglines .ln.warn{color:#ffd28a} .loglines .ln.err{color:#ff9d94} .loglines .ln.ok{color:#8fe6b8}
.noline{padding:10px 12px;color:var(--muted);font-size:13.5px}

/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.dnd{grid-template-columns:1fr}}
.bank,.zones{display:flex;flex-direction:column;gap:9px}
.ztitle{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:14.5px;cursor:grab;min-height:44px;transition:border-color .12s,background .12s}
.chip:active{cursor:grabbing}
.chip.sel{border-color:var(--green);background:rgba(47,208,122,.10)}
.chip.ghosted{opacity:.35}
.zone{border:1.5px dashed var(--line2);border-radius:9px;background:rgba(255,255,255,.015);min-height:64px;display:flex;flex-direction:column;gap:7px;padding:9px 11px}
.zone.hot{border-color:var(--green);background:rgba(47,208,122,.07)}
.zone>.zl{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.zone .chip{cursor:pointer}

/* ordering */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;cursor:grab}
.orow.dragging{opacity:.4}
.orow .pos{font-family:var(--mono);font-weight:700;color:var(--blue);width:26px;text-align:center}
.orow .ot{flex:1;font-size:14.5px}
.orow .mv{display:flex;flex-direction:row;gap:6px}
.orow .mv button{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:6px;width:44px;height:44px;cursor:pointer;font-size:15px;min-height:44px;min-width:44px;padding:0}
.orow .mv button:hover{border-color:var(--blue)}

/* blanks */
.blanks{font-size:14.5px;line-height:2;white-space:pre-wrap;font-family:var(--mono)}
.blanks select{background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:6px 10px;font-family:var(--sans);font-size:14.5px;min-height:44px;margin:0 3px}
.wordbank{margin-top:10px;font-size:13.5px;color:var(--muted)}
.wordbank .pill{font-family:var(--mono)}

/* terminal */
.term{background:#050a14;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.term .th{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.term .dot{width:10px;height:10px;border-radius:99px;background:var(--red);display:inline-block}
.term .dot.y{background:var(--amber)} .term .dot.g{background:var(--green)}
.term .sc{max-height:280px;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .sc .cline{color:#8fe6b8;white-space:pre-wrap;word-break:break-word}
.term .sc .oline{color:#c9d6ee;white-space:pre-wrap;word-break:break-word}
.term .sc .eline{color:#ff9d94;white-space:pre-wrap;word-break:break-word}
.term .inrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 12px}
.term .inrow .pr{font-family:var(--mono);color:var(--green);font-size:14px;white-space:nowrap}
.term .inrow input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-size:14.5px;min-height:44px}
.term .inrow input:focus-visible{outline:none}
.termwrap .runb{margin-left:8px}
.syntax{border:1px solid var(--line2);border-radius:8px;background:rgba(79,142,247,.05);padding:10px 14px;margin:10px 0;font-size:14px}
.syntax .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:5px}
.syntax code{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13.5px}
.exclock{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);background:rgba(240,86,74,.08);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-weight:700;font-size:14.5px;margin:4px 0}

/* spot the mistake */
.codelines{font-family:var(--mono);font-size:14.5px;background:#070e1a;border:1px solid var(--line2);border-radius:8px;padding:10px 0;max-height:420px;overflow:auto}
.cl{display:flex;gap:0;cursor:pointer;border-left:3px solid transparent}
.cl:hover{background:rgba(79,142,247,.06)}
.cl.sel{border-left-color:var(--green);background:rgba(47,208,122,.09)}
.cl .no{color:var(--dim);padding:2px 10px 2px 12px;user-select:none;min-width:44px;text-align:right}
.cl .tx{padding:2px 12px;white-space:pre-wrap;word-break:break-word}

/* triage */
.queue{display:flex;flex-direction:column;gap:12px}
.alert{border:1px solid var(--line2);border-left:4px solid var(--amber);background:var(--panel2);border-radius:9px;padding:12px 14px}
.alert .ahd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.alert .ahd .aid{font-family:var(--mono);font-weight:700;color:var(--amber)}
.alert .ahd .at{font-weight:700}
.alert .ad{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.segrow{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:44px}
.seg:hover{border-color:var(--blue)}
.seg.on{border-color:var(--green);color:var(--green);background:rgba(47,208,122,.08);font-weight:700}

/* feedback */
.fb{border-radius:var(--rad);border:1px solid;margin:14px 0;overflow:hidden}
.fb>.fh{display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb .fbb{padding:14px 16px}
.fb.correct{border-color:var(--green)} .fb.correct>.fh{background:rgba(47,208,122,.12);color:var(--green)}
.fb.partial{border-color:var(--amber)} .fb.partial>.fh{background:rgba(245,166,35,.12);color:var(--amber)}
.fb.wrong{border-color:var(--red)} .fb.wrong>.fh{background:rgba(240,86,74,.12);color:var(--red)}
.fb.excluded{border-color:var(--grey)} .fb.excluded>.fh{background:rgba(142,163,192,.12);color:var(--grey)}
.fb .pts{margin-left:auto;font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.25);border-radius:7px;padding:3px 10px}
.fbsub{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-weight:700}
.fbsub.ok{color:var(--green)} .fbsub.no{color:var(--red)} .fbsub.miss{color:var(--amber)}
.fbitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.fbitem b{color:var(--txt)}
.fbitem.ok{border-left:3px solid var(--green)} .fbitem.no{border-left:3px solid var(--red)} .fbitem.miss{border-left:3px solid var(--amber)}
.ansline{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.copyb{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;min-height:44px;min-width:64px}
.copyb:hover{color:var(--txt);border-color:var(--blue)}
.study{border-left:4px solid var(--blue);background:rgba(79,142,247,.07);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0 2px;font-size:14.5px}
.encourage{font-size:14.5px;color:var(--muted);margin-top:10px}

/* pause overlay */
#pauseov{position:fixed;inset:0;background:rgba(5,9,18,.97);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
#pauseov .big{font-size:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.footer-note{color:var(--dim);font-size:12.5px;text-align:center;margin-top:26px}
.greet{color:var(--green);font-weight:700}
@media (max-width:700px){
  h1{font-size:24px}
  .dnd{grid-template-columns:1fr}
  .block>.bb{padding:12px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="wrap">
      <div class="row">
        <span class="hchip">&#128760; <b>Adversary Simulation</b></span>
        <span class="badge" id="hbadge">&#9733; EASY</span>
        <span class="hchip" id="hcount">Exercise 0 of 0</span>
        <span class="hchip"><span><span class="timer" id="htimer">--:--</span><span class="tmode" id="htmode">&#8212; not started</span></span></span>
        <span class="hchip"><span class="k">Score</span> <span class="score" id="hscore">0 / 0</span></span>
        <span class="spacer"></span>
        <button class="btn" id="bhint" title="Open a hint (costs 10% of this exercise)">&#128161; Hint</button>
        <button class="btn" id="bpause" title="Pause the timer and hide the exercise">&#9208; Pause</button>
        <button class="btn warn" id="bskip" title="Move this exercise to the skipped pool">&#9193; Skip</button>
        <button class="btn ghost" id="bfinish" title="Go to review / finish">&#10074;&#10074; Finish</button>
      </div>
      <div class="progress"><i id="hprog"></i></div>
    </div>
  </header>
  <main><div class="wrap" id="main"></div></main>
</div>

<script>
"use strict";
var EXAM = {"meta":{"topicId":"adversary-simulation","batch":1,"title":"Adversary Simulation — EASY","difficulty":"easy","questionCount":16,"estimatedMinutes":25,"passMark":70},"severity":{"label":"EASY","color":"#2fd07a","bg":"rgba(47,208,122,.14)","desc":"Foundational and guided. Each exercise tests one clear idea with short scenarios and friendly wording. Hints point at the concept itself."},"timerSeconds":1500,"intro":{"keywordHtml":"\n<p><b>Imagine your company is a castle.<\/b> You build walls (firewalls), guards (security tools) and alarms (alerts).\nBut how do you know the guards really work? <b>Adversary simulation<\/b> answers that question. A trusted team pretends\nto be real attackers. They attack your systems <b>with written permission and clear rules<\/b>. Nobody gets hurt.\nThe goal is to find the weak spots before criminals find them.<\/p>\n<p>This work has several names: <b>red teaming<\/b>, <b>adversary emulation<\/b>, <b>purple teaming<\/b> and\n<b>Breach and Attack Simulation (BAS)<\/b>. They all share one idea: practise realistic attacks in a safe, controlled\nway, then make the defenses better. In this exam you will learn the words, the tools and the decisions used in this\nwork, step by step.<\/p>\n<p><b>Who uses it in real work?<\/b><\/p>\n<ul class=\"clean\">\n<li>The <b>red team<\/b> attacks. They copy the habits of real criminal groups, with permission.<\/li>\n<li>The <b>blue team<\/b> defends. They watch alerts in the SOC and respond.<\/li>\n<li>The <b>purple team<\/b> helps both sides talk, test and learn together.<\/li>\n<li><b>SOC analysts<\/b> watch alerts every day and use simulation results to improve them.<\/li>\n<li><b>Incident responders<\/b> practise the steps for handling a real hack.<\/li>\n<li><b>GRC teams<\/b> (governance, risk, compliance) check that the exercise follows rules and laws, and they keep the paperwork.<\/li>\n<li><b>Security engineers<\/b> fix the gaps that the exercise finds.<\/li>\n<li><b>Threat intelligence analysts<\/b> study real attacker groups and turn reports into test plans.<\/li>\n<\/ul>\n<p><b>Tools you will meet in these exercises:<\/b><\/p>\n<ul class=\"clean\">\n<li><b>MITRE ATT&amp;CK<\/b>: a free public map of attacker steps. It has <b>tactics<\/b> (the goal, like Initial Access) and <b>techniques<\/b> (the how, like T1566 Phishing).<\/li>\n<li><b>C2 frameworks<\/b> (Cobalt Strike, Caldera, Sliver): tools that send hidden commands to a test machine. The hidden link is called a <b>beacon<\/b>.<\/li>\n<li><b>Atomic Red Team<\/b>: a library of small, ready-made tests for ATT&amp;CK techniques.<\/li>\n<li><b>BAS platforms<\/b>: tools that run attack tests automatically, all the time.<\/li>\n<li><b>SIEM / log tools<\/b>: they collect events so defenders can see attacks.<\/li>\n<\/ul>\n<p><b>How a simulation works (the process):<\/b> 1) Plan the goals. 2) Write the <b>rules of engagement (RoE)<\/b> —\na paper that says what may be attacked, when, and who to call if something breaks. 3) Run the attacks and watch what\nthe defenders see. 4) Compare: which attacks were stopped? Which were missed? 5) Write a report. 6) Fix the gaps.\n7) Test again. If an attack touches something it should not, teams use <b>deconfliction<\/b>: they talk quickly to\ndecide “is this the exercise, or is it a real attacker?”<\/p>\n<p><b>Documents used in this work:<\/b> the RoE, the <b>adversary emulation plan<\/b> (which attacker group and which\nsteps to copy), the <b>detection coverage heatmap<\/b> (green = we detect it, red = we do not), the <b>after-action\nreport<\/b>, and metrics like <b>MTTD<\/b> (mean time to detect) and <b>detection rate<\/b>.<\/p>\n<p><b>Daily tasks:<\/b> run one test technique, check if an alert fired, tune a detection rule, join a purple team\nmeeting, update the heatmap, write findings, clean up test accounts and tasks.<\/p>\n<p><b>Risks it addresses:<\/b> ransomware, stolen passwords, data theft and fraud. It also has its own risks — tests\ncan break systems — so safety rules, scope limits and deconfliction are very important. That is why every good\nsimulation starts with written permission.<\/p>\n","rulesHtml":"\n<div class=\"rulegrid\">\n<div class=\"rule\"><b>&#127919; Goal.<\/b> Reach the pass mark: <b>70%<\/b>. Every exercise is worth <b>100 points<\/b>.<\/div>\n<div class=\"rule\"><b>&#10022; Multi-answer exercises.<\/b> Some exercises have more than one correct part (multi-select, several drop zones, several blanks, several steps). If you find some of the correct parts, you get some of the points. <b>Wrong picks cancel right picks<\/b>: points = (correct picks − wrong picks) ÷ total correct parts. Picking everything can never beat picking carefully.<\/div>\n<div class=\"rule\"><b>&#128161; Hints.<\/b> One hint per exercise. A hint costs <b>10% of that exercise’s points<\/b> (the best possible becomes 90). Hints give a nudge, never the answer. Using a hint does <b>not<\/b> pause the timer.<\/div>\n<div class=\"rule\"><b>&#9201; Timer — two ways it pauses.<\/b> 1) Press <b>Pause<\/b>: the timer stops and the exercise is hidden until you press Resume. 2) Press <b>Check<\/b>: the timer stops automatically so you can read the explanation with no stress — everything stays readable. The timer starts again when you press <b>Next<\/b>.<\/div>\n<div class=\"rule\"><b>&#9193; Skip.<\/b> Every exercise has a Skip button. Skipping is free. Before the exam ends you get a review screen where you can return to skipped exercises and answer them, as long as time remains. Exercises you never answer are <b>excluded<\/b>: they count as neither correct nor wrong, and their points are not added to the total.<\/div>\n<div class=\"rule\"><b>&#128203; Exercise types.<\/b> Multiple choice, multi-select, matching (drag &amp; drop), ordering / risk ranking, fill-in-the-blank, spot-the-mistake, alert triage, multi-step decisions, a simulated terminal, and a log viewer with a filter box.<\/div>\n<div class=\"rule\"><b>&#127760; Realism.<\/b> Scenarios mirror real SOC, red team and purple team work. Some include extra noise or missing information on purpose — that is realistic. All indicators are written in defanged form (hxxp://, 10[.]0[.]0[.]1).<\/div>\n<div class=\"rule\"><b>&#8635; Retake.<\/b> If you do not pass, retake the exam. The exercise order and every answer choice are shuffled again.<\/div>\n<\/div>\n"},"themes":[{"name":"Red Team Operations","concepts":["Adversary emulation","Rules of engagement (RoE)","Engagement lifecycle","Deconfliction","Objectives-based testing","Assumed breach","Safety controls & cleanup"]},{"name":"Frameworks & Threat Intelligence","concepts":["MITRE ATT&CK","Tactics","Techniques & sub-techniques","TTPs (procedures)","Cyber kill chain","Pyramid of pain","Threat-informed defense","Adversary emulation plan","APT profiling","ATT&CK Navigator & Evaluations"]},{"name":"Tooling & Attack Execution","concepts":["C2 frameworks & beacons","Attack testing tools (Atomic Red Team, Caldera)","Breach & Attack Simulation (BAS)","Payload delivery & execution","Evasion (jitter, LOLBins, AMSI)","Persistence mechanisms","Credential access (dumping, spraying)"]},{"name":"Detection & Purple Teaming","concepts":["Detection engineering","Sigma-style rules","Telemetry & data sources","Detection coverage heatmap","Purple team feedback loop","Control validation (preventive/detective/responsive)","True/false positive triage","Log analysis & filtering"]},{"name":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Risk prioritization","After-action reporting","Scope & authorization","Evidence handling (forensics-safe)","Legal & privacy considerations","Executive communication"]}],"exercises":[{"id":"e1","type":"mc","kind":"single","theme":"Red Team Operations","concepts":["Adversary emulation"],"summary":"What adversary simulation is for","scenario":{"text":"You are a new SOC analyst. Your manager says: “Next week, a trusted team will pretend to be hackers. They have written permission. They will copy real attacker behaviour. This is called adversary simulation.”"},"question":"What is the main goal of adversary simulation?","data":{"options":[{"t":"Test the defenses by copying real attackers, with permission","correct":true,"why":"That is exactly what adversary simulation is: safe, permitted practice attacks that show what works and what does not."},{"t":"Steal real company data to show where it is weak","correct":false,"why":"The team never steals real data. They have permission to test, not to harm."},{"t":"Fix every software bug found in the company this year","correct":false,"why":"Adversary simulation tests defenses. Fixing bugs is a different job, done after the exercise finds problems."},{"t":"Sell the company the newest security tools each month","correct":false,"why":"The goal is to measure and improve defenses, not to sell anything."}]},"hint":"Think about the words “pretend to be hackers” and “written permission”. What is the team trying to check?","expl":{"why":"Adversary simulation is practice. A trusted team attacks like a real enemy would, inside agreed rules. The company learns if its defenses can see and stop those attacks. Nothing is stolen and nobody is harmed — the value is in the lessons.","study":"Read again about the difference between red teaming (attacking) and penetration testing and BAS in the intro."}},{"id":"e2","type":"match","kind":"multi","theme":"Red Team Operations","concepts":["Adversary emulation","Deconfliction"],"summary":"Who does what in an adversary simulation","scenario":{"text":"Your company runs its first adversary simulation. Four people join the kick-off call. Each one has a different job. You want to remember who does what."},"question":"Drag each role onto the sentence that describes its job.","data":{"zones":[{"id":"z1","label":"Attacks like a real enemy, with written permission"},{"id":"z2","label":"Watches alerts and defends the systems"},{"id":"z3","label":"Helps attackers and defenders learn from each other"},{"id":"z4","label":"Studies real attacker groups and their habits"}],"items":[{"id":"i1","t":"Red team","zone":"z1","why":"The red team is the attacking side of the exercise."},{"id":"i2","t":"Blue team","zone":"z2","why":"The blue team is the defending side — SOC analysts and responders."},{"id":"i3","t":"Purple team lead","zone":"z3","why":"Purple is not a third team — it is red and blue working together, led by someone who keeps the loop going."},{"id":"i4","t":"Threat intelligence analyst","zone":"z4","why":"Threat intel studies real groups (like APT29) and turns reports into emulation plans."}]},"hint":"Red means attack. Blue means defend. Purple means both working together. Intel means studying the enemy.","expl":{"why":"Each role has one clear job. The red team attacks with permission, the blue team defends and watches, the purple team lead keeps both sides sharing what they learn, and the threat intelligence analyst supplies the knowledge about real attacker groups.","study":"Look up “purple teaming” — it is a way of working, not a separate team."}},{"id":"e3","type":"blank","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Rules of engagement (RoE)","Scope & authorization"],"summary":"Fill in the missing words in the RoE summary","scenario":{"text":"Before the simulation starts, everyone signs a paper called the rules of engagement (RoE). You read its summary. Three words are missing."},"question":"Pick the correct word for each blank.","data":{"text":"Before any simulated attack starts, the team must sign the {0}. It says exactly what systems the team may touch — this is called the {1}. It also names a {2} to call if anything breaks.","slots":[{"opts":["rules of engagement","service menu","travel plan"],"correct":"rules of engagement","why":"The RoE is the written permission paper for the whole exercise."},{"opts":["scope","budget","weather report"],"correct":"scope","why":"The scope is the list of systems the team may touch. Nothing outside it may be attacked."},{"opts":["point of contact","holiday home","game server"],"correct":"point of contact","why":"If something breaks, you need one named person to call at once."}]},"hint":"One blank is about a written permission paper, one about “which systems”, one about “who to call”.","expl":{"why":"The RoE is the most important document of an exercise. It defines the scope (what may be touched) and the emergency contact (who to call). If a test leaves the scope, the rule is simple: stop and call.","study":"Look at a rules of engagement template: scope, timing, contacts, forbidden actions."}},{"id":"e4","type":"mc","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["MITRE ATT&CK"],"summary":"What MITRE ATT&CK gives the team","scenario":{"text":"You read last year’s simulation report. It says: “We used MITRE ATT&CK to plan the test. The simulated attacker used T1566 — Phishing.” Your teammate asks what ATT&CK actually is."},"question":"What does MITRE ATT&CK give the team?","data":{"options":[{"t":"A free public map of attacker steps, grouped by goal","correct":true,"why":"ATT&CK lists tactics (goals) and techniques (methods) that real attackers use. Teams use it to plan and measure tests."},{"t":"A tool that blocks all phishing emails by itself","correct":false,"why":"ATT&CK describes attacks; it does not block anything. Tools do the blocking."},{"t":"A paid list of every employee’s passwords","correct":false,"why":"ATT&CK is free and public, and it contains no passwords at all."},{"t":"A report of every virus found last year","correct":false,"why":"ATT&CK is not an antivirus report. It is a knowledge base of attacker behaviour."}]},"hint":"ATT&CK is a knowledge base — a big public map — not a blocking tool.","expl":{"why":"MITRE ATT&CK is a free, public knowledge base. It groups attacker behaviour into tactics (the goal of a step) and techniques (how the step is done). Both red and blue teams use the same map, so they can talk about attacks with the same words.","study":"Open the ATT&CK website and look at the tactics: Initial Access, Execution, Persistence and friends."}},{"id":"e5","type":"order","kind":"multi","theme":"Red Team Operations","concepts":["Engagement lifecycle"],"summary":"Put the exercise lifecycle in the right order","scenario":{"text":"A simulation exercise follows a simple lifecycle, from the first meeting to the last check. The five steps below are shuffled."},"question":"Put the five lifecycle steps in the correct order.","data":{"items":[{"id":"a","t":"Agree the goals with the stakeholders"},{"id":"b","t":"Write and sign the rules of engagement"},{"id":"c","t":"Run the simulated attacks"},{"id":"d","t":"Share what defenders saw and missed"},{"id":"e","t":"Fix the gaps and test again"}],"correctIds":["a","b","c","d","e"]},"hint":"You cannot attack before you have permission — and you cannot share results before you attack.","expl":{"why":"First you agree the goals, then you write the rules (RoE), then you run the attacks, then you share the findings, and finally the gaps get fixed and re-tested. This order keeps the exercise safe and useful.","study":"Remember the loop: plan → authorize → execute → review → improve. Real purple teaming repeats it."}},{"id":"e6","type":"match","kind":"multi","theme":"Frameworks & Threat Intelligence","concepts":["Tactics","MITRE ATT&CK"],"summary":"Sort four attacker actions into their tactics","scenario":{"text":"In ATT&CK, a tactic is the goal of a step. Four simulated actions from last week’s test are listed. Sort each action into the right tactic."},"question":"Drag each action onto the tactic it belongs to.","data":{"zones":[{"id":"t1","label":"Initial Access — getting in"},{"id":"t2","label":"Execution — running attacker code"},{"id":"t3","label":"Persistence — staying inside"},{"id":"t4","label":"Collection — gathering data"}],"items":[{"id":"p1","t":"Sends a fake invoice email with an attachment","zone":"t1","why":"The email is the way in — that is Initial Access."},{"id":"p2","t":"Runs commands in PowerShell on the lab host","zone":"t2","why":"Running commands is Execution."},{"id":"p3","t":"Creates a new admin account to come back later","zone":"t3","why":"A way to return later is Persistence."},{"id":"p4","t":"Copies files from a shared folder to a USB stick","zone":"t4","why":"Gathering data is Collection."}]},"hint":"Ask for each action: is this getting in, running something, staying, or taking data?","expl":{"why":"Tactics answer “why is the attacker doing this?” A phishing email gets them in (Initial Access), PowerShell runs their code (Execution), a new account keeps them inside (Persistence), and copied files are gathered data (Collection).","study":"Learn the first few ATT&CK tactics in order: Reconnaissance, Initial Access, Execution, Persistence."}},{"id":"e7","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["C2 frameworks & beacons","Log analysis & filtering"],"summary":"Find the simulated beacon in the proxy log","scenario":{"text":"During the announced exercise, the red team’s fake “command server” gets check-ins (beacons) from a lab host. You open the proxy log. One host contacts evil[.]example over and over, once a minute. Use the filter box if you like."},"question":"Which traffic is the simulated beacon checking in?","data":{"viewer":{"title":"proxy.log — 12 Nov, morning","lines":[{"raw":"09:14:02  10[.]20[.]4[.]15 -> 142[.]250[.]74[.]99  GET  /search?q=quarterly+report  200"},{"raw":"09:14:31  10[.]20[.]4[.]15 -> 13[.]107[.]42[.]14   GET  /news/top-stories           200"},{"raw":"09:15:00  10[.]20[.]4[.]22 -> 203[.]0[.]113[.]77  POST /api/checkin  evil[.]example  200"},{"raw":"09:16:00  10[.]20[.]4[.]22 -> 203[.]0[.]113[.]77  POST /api/checkin  evil[.]example  200"},{"raw":"09:17:00  10[.]20[.]4[.]22 -> 203[.]0[.]113[.]77  POST /api/checkin  evil[.]example  200"},{"raw":"09:17:44  10[.]20[.]4[.]15 -> 142[.]250[.]74[.]99  GET  /images/logo.png            200"},{"raw":"09:18:00  10[.]20[.]4[.]22 -> 203[.]0[.]113[.]77  POST /api/checkin  evil[.]example  200"}]},"options":[{"t":"The repeated POST calls to evil[.]example, once a minute","correct":true,"why":"A beacon is a regular check-in to the attacker’s server. One host, same URL, every 60 seconds — that is the pattern."},{"t":"The GET calls to the news website at 09:14 in the log","correct":false,"why":"That is a person reading news — normal browsing, not a beacon."},{"t":"The single image download at 09:17:44 from the site","correct":false,"why":"One image download is normal web traffic, not a repeated check-in."},{"t":"The one search request for the quarterly report text","correct":false,"why":"A search is normal work traffic. Beacons repeat on a schedule."}]},"hint":"A beacon repeats: same source host, same destination, same URL, steady time gaps.","expl":{"why":"Command-and-control (C2) beaconing is a machine talking to its controller on a schedule. In a proxy log it looks like one host calling the same address again and again with steady gaps — here, every 60 seconds. People browse irregularly; beacons do not.","study":"Practise spotting repeated patterns in logs: same host, same destination, steady intervals."}},{"id":"e8","type":"mc","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["Pyramid of pain","TTPs (procedures)"],"summary":"Which change hurts the simulated attacker more?","scenario":{"text":"The blue team blocks the red team’s IP address. In one minute, the red team switches to a new IP and continues, unchanged. Their purple team lead smiles: “That is the pyramid of pain.”"},"question":"Which change is harder for an attacker to make?","data":{"options":[{"t":"Changing their tools and techniques","correct":true,"why":"Techniques sit at the top of the pyramid of pain — changing them takes real work. That is why detecting behaviour beats blocking single addresses."},{"t":"Changing one of the IP addresses","correct":false,"why":"An IP change takes seconds. Blocking IPs alone gives only short pain."},{"t":"Changing one file name they use","correct":false,"why":"Renaming a file is trivial for an attacker."},{"t":"Changing one email sender address","correct":false,"why":"A new sender address is free and instant."}]},"hint":"The pyramid of pain: small indicators (IP, file name) are easy to change; behaviour is not.","expl":{"why":"The pyramid of pain ranks indicators by how much they hurt an attacker when you block them. IPs, domains and file names are at the bottom — cheap to change. Tools and techniques are at the top — expensive to change. Good defenses detect behaviour, not just labels.","study":"Search “pyramid of pain” and note the levels from hash to TTPs."}},{"id":"e9","type":"match","kind":"multi","theme":"Tooling & Attack Execution","concepts":["C2 frameworks & beacons","Attack testing tools (Atomic Red Team, Caldera)","ATT&CK Navigator & Evaluations"],"summary":"Match each simulation tool to what it does","scenario":{"text":"Your purple team uses four tools. New teammates keep mixing them up. Sort them out once and for all."},"question":"Drag each tool onto the sentence that describes it.","data":{"zones":[{"id":"z1","label":"Commercial red team tool that sends hidden commands (C2)"},{"id":"z2","label":"Library of small, ready-made ATT&CK tests"},{"id":"z3","label":"Free platform that runs attack simulations automatically"},{"id":"z4","label":"Map view used to plan which techniques to test"}],"items":[{"id":"t1","t":"Cobalt Strike","zone":"z1","why":"Cobalt Strike is a well-known commercial C2 framework used in red team work (and abused by real criminals)."},{"id":"t2","t":"Atomic Red Team","zone":"z2","why":"Atomic Red Team provides tiny “atomic” tests, one per technique, that purple teams run to check detections."},{"id":"t3","t":"CALDERA","zone":"z3","why":"CALDERA is MITRE’s free, automated adversary emulation platform."},{"id":"t4","t":"ATT&CK Navigator","zone":"z4","why":"The Navigator is a web tool for drawing ATT&CK layers — marking what you plan, test and cover."}]},"hint":"Two tools run attacks (one commercial, one free/automatic). One gives small tests. One is just a map.","expl":{"why":"Red teams use a C2 framework (Cobalt Strike) to emulate an operator’s control over a test machine. Purple teams use Atomic Red Team for quick technique tests and CALDERA for automation. The Navigator is not an attack tool at all — it is the planning map.","study":"Try the ATT&CK Navigator once — colour a layer with the techniques your team already detects."}},{"id":"e10","type":"steps","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Deconfliction","True/false positive triage","Purple team feedback loop"],"summary":"Suspicious PowerShell during exercise week — your first two moves","scenario":{"text":"It is exercise week. You see a suspicious PowerShell command in the SIEM. You are not sure who did it."},"question":"Work through the two steps and pick the best action for each.","data":{"steps":[{"scenario":"STEP 1: The alert shows PowerShell running an odd command on a lab host. The exercise window is open, but you cannot be sure this is the red team.","question":"What should you check first?","options":[{"t":"Check with the red team lead whether this action is theirs","correct":true,"note":"Good — the red team lead confirms the action is theirs and points you to the test card."},{"t":"Delete the alert so it does not disturb anyone","correct":false},{"t":"Shut down the whole lab network at once","correct":false},{"t":"Wait a week until the exercise is forgotten","correct":false}],"why":"Deconfliction first: one quick question settles whether this is the exercise or something real. Deleting or overreacting are both wrong."},{"scenario":"STEP 2: The red team lead confirms: the command was theirs, part of test T1059.","question":"What do you do with what you saw?","options":[{"t":"Record what you saw and tell the purple team lead","correct":true,"note":"The purple team lead adds it to the exercise results."},{"t":"Nothing — exercise alerts are never useful","correct":false},{"t":"Turn off all logging for exercise week","correct":false},{"t":"Post the log lines on public social media","correct":false}],"why":"Confirmed exercise activity is still valuable data: it shows whether detection worked. Record it and feed it back."}]},"hint":"When you do not know who acted, asking the red team lead is faster than guessing.","expl":{"why":"This two-step flow is called deconfliction plus feedback. First settle “exercise or real?” with one question. Then feed the result back: every confirmed exercise alert tells the purple team whether a detection fired as designed.","study":"Remember: never delete alerts, never overreact before checking — deconfliction is a short, structured conversation."}},{"id":"e11","type":"multi","kind":"multi","theme":"Frameworks & Threat Intelligence","concepts":["Tactics","MITRE ATT&CK"],"summary":"Which of these are ATT&CK tactics?","scenario":{"text":"A teammate is building an ATT&CK layer and asks you to check a list. Some items are real ATT&CK tactics, some are not."},"question":"Select every item that is a real MITRE ATT&CK tactic.","data":{"options":[{"t":"Initial Access","correct":true,"why":"The tactic for getting the first foothold."},{"t":"Persistence","correct":true,"why":"The tactic for keeping access over time."},{"t":"Exfiltration","correct":true,"why":"The tactic for getting data out."},{"t":"Firewall rule","correct":false,"why":"A firewall rule is a control, not a tactic."},{"t":"Wi-Fi password","correct":false,"why":"That is a credential, not a tactic."},{"t":"Antivirus scan","correct":false,"why":"A scan is a defensive action, not an attacker goal."}]},"hint":"Tactics are attacker goals written in ATT&CK. Two of the wrong ones are defensive things; one is a setting.","expl":{"why":"ATT&CK tactics are the columns of the map: Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration, Impact. “Firewall rule”, “Wi-Fi password” and “Antivirus scan” are not goals of an attacker step.","study":"Try to recite the 14 tactics in order — they follow the attacker’s journey."}},{"id":"e12","type":"spot","kind":"single","theme":"Governance, Metrics & Reporting","concepts":["Rules of engagement (RoE)","Safety controls & cleanup"],"summary":"Find the line that breaks the safety rules","scenario":{"text":"You review the RoE summary card for the exercise. One line is wrong and must be fixed before the exercise starts."},"question":"Click the one line that breaks the safety rules of a simulation.","data":{"lines":[{"t":"RoE — Simulation FS-2024-11 (lab segment only)","correct":false,"why":"Naming the exercise and its scope is correct."},{"t":"Window: 12–14 Nov, 09:00–17:00 local time","correct":false,"why":"A clear time window is part of every good RoE."},{"t":"In scope: lab-servers (10[.]20[.]0[.]0/24)","correct":false,"why":"Defining the in-scope network is correct (and the range is defanged)."},{"t":"Out of scope: HR file store, finance systems","correct":false,"why":"Listing out-of-scope systems protects sensitive data."},{"t":"Emergency contact: on-call red team lead, phone in ticket","correct":false,"why":"A named contact is required — correct."},{"t":"If unsure whether activity is yours, keep attacking until someone calls","correct":true,"why":"This is backwards. The safe rule is: stop and ask. Continuing creates risk of hitting a real attack or out-of-scope system."},{"t":"All test activity is logged and shared with the SOC lead","correct":false,"why":"Logging and sharing is exactly right."}]},"hint":"Look for the line that tells the team to continue instead of stopping when unsure.","expl":{"why":"Safe exercises follow one golden rule: if you are unsure, stop and check. “Keep attacking until someone calls” is the opposite — it can damage systems, destroy evidence of a real attack, or break the law. Every other line (scope, timing, contact, logging) is standard and correct.","study":"Remember the stop-and-ask rule; it appears in every professional RoE template."}},{"id":"e13","type":"terminal","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Attack testing tools (Atomic Red Team, Caldera)","Adversary emulation"],"summary":"Start a harmless simulation test from the lab shell","scenario":{"text":"You are on your lab computer. The tool “simulate” starts one harmless, logged test attack on a lab host. Nothing real is harmed. Your task: start the T1110 test (brute force password guessing) against the lab host auth-lab-01."},"question":"Type the command that starts the T1110 simulation test on auth-lab-01, then run it.","data":{"title":"lab-shell — simulation runner","prompt":"analyst@lab:~$","welcome":["Simulation runner v2.1 — lab use only.","Type your command below and press Run."],"output":["[plan] technique T1110 — brute force (password guessing)","[plan] target auth-lab-01 — lab host, in scope","[ok] test scheduled — the SOC will see these events in the SIEM"],"expected":"simulate --technique T1110 --target auth-lab-01","parts":"simulate = the lab tool that starts one test attack. --technique T1110 = the ATT&CK technique to test (T1110 is brute force). --target auth-lab-01 = the lab host the test runs against.","elements":[{"label":"Uses the simulate tool","re":"^simulate\\b","why":"The exercise names simulate as the only allowed way to start a test."},{"label":"Selects technique T1110","re":"--technique\\s+T1110\\b","why":"T1110 is the brute force technique named in the task."},{"label":"Targets auth-lab-01","re":"--target\\s+auth-lab-01\\b","why":"auth-lab-01 is the lab host named in the task."}],"forbidden":[],"syntax":{"title":"how “simulate” works","html":"<code>simulate --technique &lt;T-number&gt; --target &lt;host&gt;<\/code><br><br>It starts one harmless test attack on a lab host.<br>Example on a <b>different<\/b> target: <code>simulate --technique T1059 --target web-lab-03<\/code>"},"sampleOut":"[ok] test scheduled — the SOC will see these events in the SIEM"},"hint":"The command shape is: simulate, then --technique with the T-number from the task, then --target with the host name from the task.","expl":{"why":"You assembled the three parts the task gave you: the tool, the technique and the target. When the test runs, the lab produces real-looking events in the SIEM, so defenders can check whether their alerts fire. Nothing outside the lab host is touched.","study":"Practise reading a task and matching its words to command options — this skill returns in every tier."}},{"id":"e14","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["Detection engineering","Purple team feedback loop"],"summary":"The red team ran a test — no alert fired","scenario":{"text":"During the purple team session, the red team runs technique T1059 (running commands through a script interpreter). Everyone watches the SOC screens. No alert appears."},"question":"What is this missing alert called?","data":{"options":[{"t":"A detection gap","correct":true,"why":"A technique that ran but produced no alert is a detection gap — the exact thing purple teaming exists to find and fix."},{"t":"A firewall rule","correct":false,"why":"A firewall rule is a control, not a missing alert."},{"t":"A false positive","correct":false,"why":"A false positive is an alert that fires without a real problem. Here nothing fired at all."},{"t":"A data backup","correct":false,"why":"Backups are copies of data — unrelated to missing alerts."}]},"hint":"The attack worked, the alert did not — there is a word for that hole.","expl":{"why":"When a technique runs and no alert fires, defenders have a detection gap. Gaps are not failures — they are the to-do list. The purple team writes the gap down, builds or tunes a detection, and re-tests until the alert fires.","study":"Learn the purple team loop: test → miss → build detection → re-test."}},{"id":"e15","type":"multi","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Scope & authorization","Safety controls & cleanup","Rules of engagement (RoE)"],"summary":"Which actions are safe and allowed during a simulation?","scenario":{"text":"New red team juniors join the exercise. Before they start, you check their habit list. Some habits are safe and allowed, some are not."},"question":"Select every action that is safe and allowed during a simulation.","data":{"options":[{"t":"Stay inside the agreed scope at all times","correct":true,"why":"Scope limits are the core safety rule of every exercise."},{"t":"Use defanged indicators like evil[.]example in the report","correct":true,"why":"Defanging stops readers from clicking live links or leaking working indicators."},{"t":"Stop and call the emergency contact if a test breaks something","correct":true,"why":"Stopping early is always the right move when something breaks."},{"t":"Attack systems outside the scope to save time","correct":false,"why":"Out-of-scope means forbidden — no exceptions, no matter how slow the exercise feels."},{"t":"Upload the exercise malware to a public website","correct":false,"why":"Public uploads can harm people outside the company and break the RoE."},{"t":"Turn off logging so the test stays secret","correct":false,"why":"Logging must stay on — the whole point is to see what defenders can see."}]},"hint":"Three habits protect the exercise; three habits break trust, law or the exercise’s purpose.","expl":{"why":"Safe simulation work respects three rules: stay in scope, defang indicators in documents, and stop when something breaks. Attacking out of scope, publishing live samples and disabling logging all create real harm — legal, ethical or practical.","study":"Read the RoE twice before your first exercise; safety rules are there to protect you too."}},{"id":"e16","type":"triage","kind":"multi","theme":"Detection & Purple Teaming","concepts":["True/false positive triage","Deconfliction"],"summary":"Triage three alerts during exercise week","scenario":{"text":"You are on SOC duty during a small exercise. Three alerts arrive. Classify each one: simulation activity, real attack, or not a security issue."},"question":"Classify each of the three alerts.","data":{"actions":[{"id":"sim","label":"Simulation activity"},{"id":"real","label":"Real attack — escalate"},{"id":"notsec","label":"Not a security issue"}],"alerts":[{"id":"a1","title":"PHISH-0091 — Q4 benefits update","t":"Email from phish-sim[.]example sent 10:00, during the announced exercise. It matches the exercise platform’s phishing template, and the campaign ID is listed in the exercise ticket.","correct":"sim","why":"The sender domain, timing and template all match the announced exercise."},{"id":"a2","title":"PRINT-0452 — reception printer","t":"The reception printer shows ‘paper jam’. Facilities confirm they are on their way with a technician.","correct":"notsec","why":"A paper jam is an office problem, not a security problem."},{"id":"a3","title":"AUTH-7781 — finance account login","t":"A finance account logged in at 03:00 from an unknown country. No simulation was planned tonight, and the user is on holiday.","correct":"real","why":"Outside the exercise window, odd location, odd hour, absent user — treat as real and escalate."}]},"hint":"Check the exercise window and the sender details for alert 1; ask “would a hacker care about this?” for alert 2.","expl":{"why":"Triage means deciding what each alert really is. Alert 1 matches the announced exercise (sender domain, template, timing) — simulation. Alert 2 is a printer jam — not security. Alert 3 has no exercise cover, strange timing and an absent user — real, escalate. When in doubt, deconflict with the red team lead instead of guessing.","study":"For every alert ask: is this announced, does it match the exercise ticket, and would it look the same without an exercise running?"}}]};
"use strict";
/* EXAM payload is injected by the build script immediately before this file. */
var T = EXAM.meta, SEV = EXAM.severity, STATE = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtClock(sec){ sec=Math.max(0,sec|0); var m=(sec/60)|0, s=sec%60; if(m>=60){ var h=(m/60)|0; m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); } return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function exById(id){ return byId(EXAM.exercises,id); }

/* ================= STATE ================= */
function newState(){
  return {
    order: shuffle(EXAM.exercises.map(function(e){return e.id;})),
    idx: 0, current: null, fromReview: false, attempt: 1,
    results: {}, skipped: [], checked: false,
    hintUsed: {}, draft: {},
    timer: { remain: EXAM.timerSeconds, isRunning:false, isManuallyPaused:false, isAutoPausedAfterCheck:false, int:null },
    exTimer: { remain:0, int:null, exId:null },
    reported: false, timeUp: false, username: ''
  };
}
function answeredIds(){ return Object.keys(STATE.results).filter(function(k){ return !STATE.results[k].excluded; }); }
function liveScore(){
  var ids=answeredIds(), earned=0, poss=ids.length*100;
  ids.forEach(function(k){ earned += STATE.results[k].earned; });
  return {earned:earned, poss:poss};
}
function themeBreakdown(){
  var m={};
  answeredIds().forEach(function(k){
    var ex=exById(k), r=STATE.results[k];
    if(!m[ex.theme]) m[ex.theme]={earned:0,poss:0,n:0};
    m[ex.theme].earned+=r.earned; m[ex.theme].poss+=100; m[ex.theme].n++;
  });
  return m;
}

/* ================= TIMER ================= */
function timerIndicator(){
  var t=STATE.timer;
  if(STATE.timeUp) return {cls:'',txt:'\u23F9 time is up'};
  if(STATE.finished) return {cls:'',txt:'\u23F9 exam finished'};
  if(!t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck) return {cls:'',txt:'\u2014 not started'};
  if(t.isManuallyPaused) return {cls:'pausedyou',txt:'\u23F8 paused by you'};
  if(t.isAutoPausedAfterCheck) return {cls:'pausedfb',txt:'\u23F8 paused \u2014 review your feedback'};
  return {cls:'running',txt:'\u25B6 running'};
}
function renderTimer(){
  var t=STATE.timer, el=$('htimer'), ind=timerIndicator();
  el.textContent=fmtClock(t.remain);
  el.className='timer'+(t.remain<60?' crit':(t.remain<300?' low':''));
  var m=$('htmode'); m.textContent=ind.txt; m.className='tmode '+ind.cls;
}
function timerTick(){
  var t=STATE.timer;
  if(t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck){
    t.remain--;
    renderTimer();
    if(t.remain<=0){ t.remain=0; timeUp(); }
  }
}
function startTimer(){
  var t=STATE.timer;
  if(t.int) clearInterval(t.int);
  t.isRunning=true; t.isManuallyPaused=false; t.isAutoPausedAfterCheck=false;
  t.int=setInterval(timerTick,1000); renderTimer();
}
function stopTimerLoop(){ var t=STATE.timer; if(t.int){clearInterval(t.int); t.int=null;} t.isRunning=false; }
function setAutoPause(on){
  STATE.timer.isAutoPausedAfterCheck=on; renderTimer();
}
function manualPause(){
  STATE.timer.isManuallyPaused=true; renderTimer(); showPauseOverlay(true);
  var b=$('bpause'); if(b){ b.innerHTML='&#9654; Resume'; }
}
function manualResume(){
  STATE.timer.isManuallyPaused=false; showPauseOverlay(false); renderTimer();
  var b=$('bpause'); if(b){ b.innerHTML='&#9208; Pause'; }
}
function timeUp(){
  if(STATE.timeUp) return;
  STATE.timeUp=true; stopTimerLoop(); stopExerciseTimer(); showPauseOverlay(false);
  renderResults(true);
}

/* per-exercise reduced timer (EXTREMELY HARD terminal) */
function startExerciseTimer(ex){
  stopExerciseTimer();
  if(!ex.timerSeconds) return;
  STATE.exTimer={remain:ex.timerSeconds,int:null,exId:ex.id};
  var box=$('exclock'); if(box) box.innerHTML='&#9201; Exercise timer: <b id="exclockv">'+fmtClock(ex.timerSeconds)+'</b>';
  STATE.exTimer.int=setInterval(function(){
    /* the reduced timer respects both pause flags and never runs after time is up */
    if(STATE.timeUp || STATE.timer.isManuallyPaused || STATE.timer.isAutoPausedAfterCheck) return;
    STATE.exTimer.remain--;
    var v=$('exclockv'); if(v) v.textContent=fmtClock(STATE.exTimer.remain);
    if(STATE.exTimer.remain<=0){
      stopExerciseTimer();
      STATE.results[ex.id]={earned:0,status:'excluded',excluded:true,answered:false,studentText:'(no answer \u2014 exercise timer ended)'};
      advanceAfterExclusion();
    }
  },1000);
}
function stopExerciseTimer(){ if(STATE.exTimer && STATE.exTimer.int){ clearInterval(STATE.exTimer.int); STATE.exTimer.int=null; } }
function advanceAfterExclusion(){
  stopExerciseTimer();
  goNext(true);
}

/* ================= HEADER ================= */
function renderHeader(){
  $('hbadge').innerHTML='&#9733; '+esc(SEV.label);
  var bd=$('hbadge'); bd.style.setProperty('--sev',SEV.color); bd.style.setProperty('--sevbg',SEV.bg);
  if(!STATE){ return; }
  var total=STATE.order.length;
  var pos=STATE.current? (STATE.order.indexOf(STATE.current)+1) : 0;
  $('hcount').textContent = STATE.current ? ('Exercise '+pos+' of '+total) : ('Exercises: '+total);
  var ls=liveScore();
  $('hscore').textContent=ls.earned+' / '+ls.poss;
  var done=answeredIds().length;
  $('hprog').style.width=Math.round(100*done/total)+'%';
  var ex=STATE.current?exById(STATE.current):null;
  $('bhint').disabled=!ex||!!STATE.hintUsed[ex.id]||STATE.checked;
  $('bskip').disabled=!ex||STATE.checked||STATE.timeUp;
}

/* ================= NAV ================= */
function showScreen(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){ var n=$(s); if(n) n.className=s===id?'':'hidden'; });
  $('hdr').className = (id==='scr-intro')?'hidden':'';
}
function startExam(){
  startTimer();
  loadExercise(STATE.order[0]);
}
function loadExercise(id){
  STATE.current=id; STATE.checked=false;
  var returning=STATE.fromReview; STATE.fromReview=false;
  setAutoPause(false);
  $('bpause').disabled=false; $('bfinish').disabled=false;
  renderExercise(exById(id));
  renderHeader();
  showScreen('scr-exam');
  startExerciseTimer(exById(id));
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function skipCurrent(){
  if(STATE.checked||!STATE.current||STATE.timeUp) return;
  stopExerciseTimer();
  if(STATE.skipped.indexOf(STATE.current)<0) STATE.skipped.push(STATE.current);
  nextUnansweredOrReview();
}
function nextUnansweredOrReview(){
  var next=null;
  for(var i=0;i<STATE.order.length;i++){ var id=STATE.order[i]; if(!STATE.results[id] && STATE.skipped.indexOf(id)<0){ next=id; break; } }
  if(next){ loadExercise(next); }
  else if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); }
  else { renderResults(false); }
}
function goNext(afterExclusion){
  stopExerciseTimer();
  if(STATE.fromReviewPending){ STATE.fromReviewPending=false; STATE.current=null;
    if(STATE.skipped.length>0 && !STATE.timeUp) renderReview(); else nextUnansweredOrReview();
    return;
  }
  if(STATE.current){
    var i=STATE.order.indexOf(STATE.current);
    for(var j=i+1;j<STATE.order.length;j++){ if(!STATE.results[STATE.order[j]] && STATE.skipped.indexOf(STATE.order[j])<0){ loadExercise(STATE.order[j]); return; } }
    if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); return; }
    if(answeredIds().length===STATE.order.length){ renderResults(false); return; }
    nextUnansweredOrReview();
  } else {
    nextUnansweredOrReview();
  }
}
function finishFlow(){
  if(STATE.timeUp){ renderResults(true); return; }
  stopExerciseTimer();
  /* move any never-answered exercises into the skipped pool so they can be reviewed */
  STATE.order.forEach(function(id){
    if(!STATE.results[id] && STATE.skipped.indexOf(id)<0) STATE.skipped.push(id);
  });
  if(STATE.skipped.length>0){ renderReview(); } else { renderResults(false); }
}
function returnToSkipped(id){
  STATE.fromReview=true; STATE.fromReviewPending=true;
  STATE.skipped=STATE.skipped.filter(function(x){return x!==id;});
  loadExercise(id);
}

/* ================= HINT ================= */
function useHint(){
  if(!STATE.current||STATE.checked) return;
  var ex=exById(STATE.current);
  if(STATE.hintUsed[ex.id]) return;
  STATE.hintUsed[ex.id]=true;
  var box=$('hintarea');
  if(box){ box.innerHTML='<div class="hintbox">&#128161; <b>Hint:</b> '+esc(ex.hint)+' <span class="small muted">(This hint costs 10% of this exercise\u2019s points \u2014 the timer keeps running.)</span></div>'; }
  renderHeader();
}

/* ================= PAUSE OVERLAY ================= */
function showPauseOverlay(on){
  var n=$('pauseov');
  if(on){
    if(!n){
      n=document.createElement('div'); n.id='pauseov';
      n.innerHTML='<div class="big">&#9208;</div><h2>Paused by you</h2><p class="muted">The timer is stopped and the exercise is hidden so it cannot be read.<br>Press Resume when you are ready \u2014 the exercise comes back and the timer continues.</p><button class="btn primary" id="ovresume" style="min-width:180px;min-height:48px">&#9654; Resume</button>';
      document.body.appendChild(n);
      $('ovresume').addEventListener('click',manualResume);
    } else { n.classList.remove('hidden'); }
  } else if(n){ n.classList.add('hidden'); }
}

/* ================= WEBSITE INTEGRATION ================= */
function reportScore(){
  if(STATE.reported) return;
  STATE.reported=true;
  var ls=liveScore();
  var percent = ls.poss>0 ? Math.round((ls.earned/ls.poss)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:T.topicId, batch:T.batch,
      score:ls.earned, total:ls.poss, percent:percent,
      passed: percent>=T.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(STATE){ STATE.username = event.data.username || ''; var g=$('greet'); if(g && STATE.username){ g.innerHTML='Welcome, <span class="greet">'+esc(STATE.username)+'</span> \u2014 good luck!'; } }
  }catch(e){}
});

/* ================= BOOT ================= */
document.addEventListener('click',function(ev){
  var b=ev.target;
  if(b&&b.classList&&b.classList.contains('copyb')&&b.hasAttribute('data-copy')){
    var txt=b.getAttribute('data-copy');
    function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1200); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1200); },fallback); } else fallback();
  }
});
function boot(){
  STATE=newState();
  document.documentElement.style.setProperty('--sev',SEV.color);
  document.documentElement.style.setProperty('--sevbg',SEV.bg);
  renderIntro(); showScreen('scr-intro');
  $('bhint').addEventListener('click',useHint);
  $('bpause').addEventListener('click',function(){
    if(STATE.timer.isManuallyPaused){ manualResume(); }
    else { manualPause(); }
  });
  $('bskip').addEventListener('click',skipCurrent);
  $('bfinish').addEventListener('click',finishFlow);
}
document.addEventListener('DOMContentLoaded',boot);

/* ================= INTRO SCREEN ================= */

      (STATE.username?'<p id="greet">Welcome, <span class="greet">'+esc(STATE.username)+'</span> \u2014 good luck!</p>':'<p id="greet"></p>')+

    '<div class="card"><h2>&#128220; How this exam works</h2>'+EXAM.intro.rulesHtml+
      '<div class="notice amber">&#9888;&#65039; <b>This file\u2019s severity: '+esc(SEV.label)+'.</b> '+esc(SEV.desc)+'</div>'+
    '</div>'+

/* ================= REVIEW SKIPPED SCREEN ================= */
function renderReview(){
  STATE.current=null; setAutoPause(false); stopExerciseTimer(); renderHeader();
  $('bpause').disabled=true; $('bfinish').disabled=true;   /* no exercise to pause or finish from here */
  var m=$('main');
  var items=STATE.skipped.map(function(id){
    var ex=exById(id);
    return '<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:220px"><b>'+esc(ex.summary)+'</b><div class="small muted">'+esc(ex.theme)+' \u00B7 '+esc(SEV.label)+'</div></div>'+
      '<button class="btn primary" data-ret="'+esc(id)+'">&#8617; Return to it</button></div>';
  }).join('');
  m.innerHTML='<section id="scr-review">'+
    '<p class="kicker">Before you finish</p><h1>&#128257; Review skipped exercises</h1>'+
    '<p>You skipped '+STATE.skipped.length+' exercise'+(STATE.skipped.length===1?'':'s')+'. You can return to any of them now and answer it \u2014 as many times as you need \u2014 as long as the timer has not ended. Skipping is free, but an exercise you never answer is <b>excluded from your score</b>: it adds no points and it does not count against you.</p>'+
    items+
    '<div class="notice amber">&#9201; Time left: <b class="mono">'+fmtClock(STATE.timer.remain)+'</b>. When you finish, unanswered exercises are listed in the report as \u201CNot answered \u2014 excluded from score\u201D.</div>'+
    '<div class="actions"><button class="btn danger" id="bfin2" style="min-width:200px">&#9989; Finish exam now</button></div>'+
  '</section>';
  m.querySelectorAll('[data-ret]').forEach(function(b){ b.addEventListener('click',function(){ returnToSkipped(b.getAttribute('data-ret')); }); });
  $('bfin2').addEventListener('click',function(){ renderResults(STATE.timeUp); });

function renderResults(timeIsUp){

    var r=STATE.results[id];

  });

  var reportHtml=STATE.order.map(function(id){ return reportRow(id); }).join('');
  m.innerHTML='<section id="scr-results">'+
    (timeIsUp?'<div class="notice amber">&#9201; <b>Time is up.</b> The exam ended automatically. Exercises you never answered are excluded from the score.</div>':'')+
    '<p class="kicker">Attempt '+STATE.attempt+' \u00B7 '+esc(T.title)+'</p><h1>&#128202; Final results</h1>'+
    certHtml+
    '<div class="statgrid">'+
      '<div class="stat ok"><div class="n">'+full+'</div><div class="l">&#10003; Fully correct</div></div>'+
      '<div class="stat part"><div class="n">'+part+'</div><div class="l">&#9686; Partially correct</div></div>'+
      '<div class="stat bad"><div class="n">'+wrong+'</div><div class="l">&#10007; Incorrect</div></div>'+
      '<div class="stat skip"><div class="n">'+skippedN+'</div><div class="l">&#9888; Not answered (excluded)</div></div>'+
      '<div class="stat"><div class="n">'+ls.earned+' / '+ls.poss+'</div><div class="l">Points over answered exercises</div></div>'+
      '<div class="stat"><div class="n">'+percent+'%</div><div class="l">Final score (pass '+T.passMark+'%)</div></div>'+
    '</div>'+
    (Object.keys(tb).length?'<div class="card"><h3>&#129517; Per-theme breakdown (answered exercises only)</h3><table class="rpt"><tr><th>Theme</th><th>Answered</th><th>Points</th><th>Score</th></tr>'+tbHtml+'</table></div>':'')+
    '<div class="card"><h3>&#128209; Detailed report \u2014 every exercise</h3>'+reportHtml+'</div>'+
    '<div class="actions"><button class="btn primary" id="bretake" style="min-width:220px;min-height:50px">&#8635; Retake exam</button></div>'+
    '<p class="footer-note">On retake, the exercise order and every answer choice are shuffled again.</p>'+
  '</section>';
  reportScore();
  $('bretake').addEventListener('click',retake);
  showScreen('scr-results');
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function reportRow(id){
  var ex=exById(id), r=STATE.results[id];
  var head;
  if(!r||r.excluded){
    head='<div class="fb excluded"><div class="fh">&#9888; NOT ANSWERED \u2014 EXCLUDED <span class="pts">excluded from score</span></div><div class="fbb">'+fbBody(ex,null)+'</div></div>';

  }

}
function retake(){
  var un=STATE.username, att=STATE.attempt;
  STATE=newState(); STATE.attempt=att+1; STATE.username=un;

}

/* ================= EXERCISE RENDER ================= */
