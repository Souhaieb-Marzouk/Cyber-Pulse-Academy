<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>Adversary Simulation — MEDIUM practice exam</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "adversary-simulation", "batch": 2, "title": "Adversary Simulation — MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 40, "passMark": 70}</script>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#121d33; --panel2:#16233d; --line:#25365c; --line2:#31456f;
  --txt:#e7eef9; --muted:#9db0cf; --dim:#7288ab;
  --blue:#4f8ef7; --amber:#f5a623; --green:#2fd07a; --red:#f0564a; --orange:#f97316; --grey:#8ea3c0;
  --sev:#2fd07a; --sevbg:rgba(47,208,122,.14);
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --rad:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *,*::before,*::after{transition:none!important;animation:none!important} }
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--blue)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1060px,94vw);margin:0 auto}

/* ---------- persistent header ---------- */
#hdr{position:sticky;top:0;z-index:50;background:rgba(10,16,30,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hdr .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0}
.hchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;min-height:36px}
.hchip .k{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:6px 12px;font-size:13.5px;background:var(--sevbg);color:var(--sev);border:1px solid var(--sev);min-height:36px}
.timer{font-family:var(--mono);font-size:18px;font-weight:700;min-width:96px;text-align:center}
.timer.low{color:var(--amber)} .timer.crit{color:var(--red)}
.tmode{font-size:12.5px;color:var(--muted);display:block;line-height:1.2}
.tmode.running{color:var(--green)} .tmode.pausedyou{color:var(--amber)} .tmode.pausedfb{color:var(--blue)}
.score{font-family:var(--mono);font-weight:700}
.spacer{flex:1}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 16px;font-size:14.5px;font-weight:600;min-height:44px;min-width:44px;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--panel2);border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#2b64d9,#1d4aa8);border-color:#3a76ea;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#3370e8,#2054b8)}
.btn.good{background:linear-gradient(180deg,#1f9d5f,#187a49);border-color:#2fd07a;color:#fff}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sev));transition:width .5s ease}

/* ---------- generic blocks ---------- */
main{flex:1;padding:22px 0 60px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:30px;line-height:1.2;margin:0 0 10px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin:14px 0}
.card.tint{background:linear-gradient(180deg,rgba(79,142,247,.07),var(--panel))}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)}
ul.clean{margin:6px 0;padding-left:20px} ul.clean li{margin:4px 0}

/* ---------- intro / results ---------- */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 2px}
.hero .logo{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 30% 30%,var(--sev),transparent 70%),var(--panel2);border:1px solid var(--sev);display:flex;align-items:center;justify-content:center;font-size:26px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted);margin:2px 4px 2px 0;background:var(--panel)}
.themewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.theme{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.theme h4{margin:0 0 6px;font-size:14.5px;color:var(--blue)}
.theme ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.theme li{margin:3px 0}
.notice{border-left:4px solid var(--blue);background:rgba(79,142,247,.08);border-radius:0 var(--rad) var(--rad) 0;padding:10px 14px;margin:12px 0}
.notice.amber{border-color:var(--amber);background:rgba(245,166,35,.08)}
.notice.green{border-color:var(--green);background:rgba(47,208,122,.08)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;font-size:14.5px}
.rule b{color:var(--txt)}
.cert{border:2px solid var(--sev);background:radial-gradient(circle at 85% 10%,rgba(47,208,122,.12),transparent 60%),var(--panel);border-radius:14px;padding:26px;text-align:center}
.cert .big{font-size:44px;font-weight:800;font-family:var(--mono)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-family:var(--mono)}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.ok .n{color:var(--green)} .stat.part .n{color:var(--amber)} .stat.bad .n{color:var(--red)} .stat.skip .n{color:var(--grey)}
table.rpt{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rpt th{background:var(--panel2);color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- exam exercise layout ---------- */
.exhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 4px}
.steptag{font-family:var(--mono);font-size:12.5px;border:1px dashed var(--line2);border-radius:6px;padding:3px 9px;color:var(--muted)}
.block{border:1px solid var(--line);border-radius:var(--rad);margin:12px 0;background:var(--panel);overflow:hidden}
.block>.bh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;cursor:default}
.block>.bh .ic{font-size:16px}
.block>.bh .sum{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block>.bh button.tgl{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:4px 14px;cursor:pointer;font-size:12.5px;min-height:44px}
.block>.bb{padding:14px 16px}
.block.scenario>.bh{background:rgba(79,142,247,.10);color:#9cc0ff;border-bottom-color:rgba(79,142,247,.25)}
.block.scenario>.bb{background:linear-gradient(180deg,rgba(79,142,247,.05),transparent)}
.block.question>.bh{background:rgba(245,166,35,.10);color:#ffcf7d;border-bottom-color:rgba(245,166,35,.25)}
.block.question>.bb{background:linear-gradient(180deg,rgba(245,166,35,.05),transparent)}
.block.question .qt{font-weight:700;font-size:17px}
.block.answer>.bh{background:rgba(47,208,122,.10);color:#7fe0ac;border-bottom-color:rgba(47,208,122,.25)}
.block.answer>.bb{background:linear-gradient(180deg,rgba(47,208,122,.04),transparent)}
.artefact{border:1px solid var(--line2);border-radius:8px;margin:10px 0;background:#0a1322}
.artefact>.ah{padding:7px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.artefact>.ab{padding:10px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.artefact.code>.ab{font-family:var(--mono);font-size:14.5px;line-height:1.5}
.hintbox{border:1px dashed var(--amber);background:rgba(245,166,35,.07);color:#ffd28a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;cursor:pointer;color:var(--txt);font-size:15.5px;min-height:44px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .lab{font-family:var(--mono);font-weight:700;color:var(--blue);flex:0 0 auto}
.opt.sel{border-color:var(--green);background:rgba(47,208,122,.08)}
.opt.sel .lab{color:var(--green)}
.opt.pick{border-color:var(--blue);background:rgba(79,142,247,.08)}
.multinote{font-size:13px;color:var(--amber);border:1px dashed var(--amber);border-radius:7px;padding:6px 10px;margin:0 0 10px;display:inline-block}

/* log viewer */
.viewer{border:1px solid var(--line2);border-radius:8px;background:#070e1a;margin:10px 0;overflow:hidden}
.viewer .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer .vh input{flex:1;min-width:180px;background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:8px 12px;font-family:var(--mono);font-size:14px;min-height:44px}
.viewer .vh .cnt{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.loglines{max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:14px;line-height:1.6}
.loglines .ln{padding:2px 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent}
.loglines .ln:hover{background:rgba(79,142,247,.06)}
.loglines .ln.info{color:#c9d6ee} .loglines .ln.warn{color:#ffd28a} .loglines .ln.err{color:#ff9d94} .loglines .ln.ok{color:#8fe6b8}
.noline{padding:10px 12px;color:var(--muted);font-size:13.5px}

/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.dnd{grid-template-columns:1fr}}
.bank,.zones{display:flex;flex-direction:column;gap:9px}
.ztitle{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:14.5px;cursor:grab;min-height:44px;transition:border-color .12s,background .12s}
.chip:active{cursor:grabbing}
.chip.sel{border-color:var(--green);background:rgba(47,208,122,.10)}
.chip.ghosted{opacity:.35}
.zone{border:1.5px dashed var(--line2);border-radius:9px;background:rgba(255,255,255,.015);min-height:64px;display:flex;flex-direction:column;gap:7px;padding:9px 11px}
.zone.hot{border-color:var(--green);background:rgba(47,208,122,.07)}
.zone>.zl{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.zone .chip{cursor:pointer}

/* ordering */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;cursor:grab}
.orow.dragging{opacity:.4}
.orow .pos{font-family:var(--mono);font-weight:700;color:var(--blue);width:26px;text-align:center}
.orow .ot{flex:1;font-size:14.5px}
.orow .mv{display:flex;flex-direction:row;gap:6px}
.orow .mv button{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:6px;width:44px;height:44px;cursor:pointer;font-size:15px;min-height:44px;min-width:44px;padding:0}
.orow .mv button:hover{border-color:var(--blue)}

/* blanks */
.blanks{font-size:14.5px;line-height:2;white-space:pre-wrap;font-family:var(--mono)}
.blanks select{background:#0a1322;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:6px 10px;font-family:var(--sans);font-size:14.5px;min-height:44px;margin:0 3px}
.wordbank{margin-top:10px;font-size:13.5px;color:var(--muted)}
.wordbank .pill{font-family:var(--mono)}

/* terminal */
.term{background:#050a14;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.term .th{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.term .dot{width:10px;height:10px;border-radius:99px;background:var(--red);display:inline-block}
.term .dot.y{background:var(--amber)} .term .dot.g{background:var(--green)}
.term .sc{max-height:280px;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .sc .cline{color:#8fe6b8;white-space:pre-wrap;word-break:break-word}
.term .sc .oline{color:#c9d6ee;white-space:pre-wrap;word-break:break-word}
.term .sc .eline{color:#ff9d94;white-space:pre-wrap;word-break:break-word}
.term .inrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 12px}
.term .inrow .pr{font-family:var(--mono);color:var(--green);font-size:14px;white-space:nowrap}
.term .inrow input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-size:14.5px;min-height:44px}
.term .inrow input:focus-visible{outline:none}
.termwrap .runb{margin-left:8px}
.syntax{border:1px solid var(--line2);border-radius:8px;background:rgba(79,142,247,.05);padding:10px 14px;margin:10px 0;font-size:14px}
.syntax .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:5px}
.syntax code{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13.5px}
.exclock{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);background:rgba(240,86,74,.08);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-weight:700;font-size:14.5px;margin:4px 0}

/* spot the mistake */
.codelines{font-family:var(--mono);font-size:14.5px;background:#070e1a;border:1px solid var(--line2);border-radius:8px;padding:10px 0;max-height:420px;overflow:auto}
.cl{display:flex;gap:0;cursor:pointer;border-left:3px solid transparent}
.cl:hover{background:rgba(79,142,247,.06)}
.cl.sel{border-left-color:var(--green);background:rgba(47,208,122,.09)}
.cl .no{color:var(--dim);padding:2px 10px 2px 12px;user-select:none;min-width:44px;text-align:right}
.cl .tx{padding:2px 12px;white-space:pre-wrap;word-break:break-word}

/* triage */
.queue{display:flex;flex-direction:column;gap:12px}
.alert{border:1px solid var(--line2);border-left:4px solid var(--amber);background:var(--panel2);border-radius:9px;padding:12px 14px}
.alert .ahd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.alert .ahd .aid{font-family:var(--mono);font-weight:700;color:var(--amber)}
.alert .ahd .at{font-weight:700}
.alert .ad{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.segrow{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line2);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:44px}
.seg:hover{border-color:var(--blue)}
.seg.on{border-color:var(--green);color:var(--green);background:rgba(47,208,122,.08);font-weight:700}

/* feedback */
.fb{border-radius:var(--rad);border:1px solid;margin:14px 0;overflow:hidden}
.fb>.fh{display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb .fbb{padding:14px 16px}
.fb.correct{border-color:var(--green)} .fb.correct>.fh{background:rgba(47,208,122,.12);color:var(--green)}
.fb.partial{border-color:var(--amber)} .fb.partial>.fh{background:rgba(245,166,35,.12);color:var(--amber)}
.fb.wrong{border-color:var(--red)} .fb.wrong>.fh{background:rgba(240,86,74,.12);color:var(--red)}
.fb.excluded{border-color:var(--grey)} .fb.excluded>.fh{background:rgba(142,163,192,.12);color:var(--grey)}
.fb .pts{margin-left:auto;font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.25);border-radius:7px;padding:3px 10px}
.fbsub{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-weight:700}
.fbsub.ok{color:var(--green)} .fbsub.no{color:var(--red)} .fbsub.miss{color:var(--amber)}
.fbitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.fbitem b{color:var(--txt)}
.fbitem.ok{border-left:3px solid var(--green)} .fbitem.no{border-left:3px solid var(--red)} .fbitem.miss{border-left:3px solid var(--amber)}
.ansline{font-family:var(--mono);background:#0a1322;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.copyb{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;min-height:44px;min-width:64px}
.copyb:hover{color:var(--txt);border-color:var(--blue)}
.study{border-left:4px solid var(--blue);background:rgba(79,142,247,.07);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0 2px;font-size:14.5px}
.encourage{font-size:14.5px;color:var(--muted);margin-top:10px}

/* pause overlay */
#pauseov{position:fixed;inset:0;background:rgba(5,9,18,.97);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
#pauseov .big{font-size:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.footer-note{color:var(--dim);font-size:12.5px;text-align:center;margin-top:26px}
.greet{color:var(--green);font-weight:700}
@media (max-width:700px){
  h1{font-size:24px}
  .dnd{grid-template-columns:1fr}
  .block>.bb{padding:12px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="wrap">
      <div class="row">
        <span class="hchip">&#128760; <b>Adversary Simulation</b></span>
        <span class="badge" id="hbadge">&#9733; EASY</span>
        <span class="hchip" id="hcount">Exercise 0 of 0</span>
        <span class="hchip"><span><span class="timer" id="htimer">--:--</span><span class="tmode" id="htmode">&#8212; not started</span></span></span>
        <span class="hchip"><span class="k">Score</span> <span class="score" id="hscore">0 / 0</span></span>
        <span class="spacer"></span>
        <button class="btn" id="bhint" title="Open a hint (costs 10% of this exercise)">&#128161; Hint</button>
        <button class="btn" id="bpause" title="Pause the timer and hide the exercise">&#9208; Pause</button>
        <button class="btn warn" id="bskip" title="Move this exercise to the skipped pool">&#9193; Skip</button>
        <button class="btn ghost" id="bfinish" title="Go to review / finish">&#10074;&#10074; Finish</button>
      </div>
      <div class="progress"><i id="hprog"></i></div>
    </div>
  </header>
  <main><div class="wrap" id="main"></div></main>
</div>

<script>
"use strict";
var EXAM = {"meta":{"topicId":"adversary-simulation","batch":2,"title":"Adversary Simulation — MEDIUM","difficulty":"medium","questionCount":16,"estimatedMinutes":40,"passMark":70},"severity":{"label":"MEDIUM","color":"#f5a623","bg":"rgba(245,166,35,.14)","desc":"Intermediate. Each exercise combines two connected ideas: you must decide what to look at first, then act. Hints narrow the direction, not the answer."},"timerSeconds":2400,"intro":{"keywordHtml":"\n<p><b>Imagine your company is a castle.<\/b> You build walls (firewalls), guards (security tools) and alarms (alerts).\nBut how do you know the guards really work? <b>Adversary simulation<\/b> answers that question. A trusted team pretends\nto be real attackers. They attack your systems <b>with written permission and clear rules<\/b>. Nobody gets hurt.\nThe goal is to find the weak spots before criminals find them.<\/p>\n<p>This work has several names: <b>red teaming<\/b>, <b>adversary emulation<\/b>, <b>purple teaming<\/b> and\n<b>Breach and Attack Simulation (BAS)<\/b>. They all share one idea: practise realistic attacks in a safe, controlled\nway, then make the defenses better. In this exam you will learn the words, the tools and the decisions used in this\nwork, step by step.<\/p>\n<p><b>Who uses it in real work?<\/b><\/p>\n<ul class=\"clean\">\n<li>The <b>red team<\/b> attacks. They copy the habits of real criminal groups, with permission.<\/li>\n<li>The <b>blue team<\/b> defends. They watch alerts in the SOC and respond.<\/li>\n<li>The <b>purple team<\/b> helps both sides talk, test and learn together.<\/li>\n<li><b>SOC analysts<\/b> watch alerts every day and use simulation results to improve them.<\/li>\n<li><b>Incident responders<\/b> practise the steps for handling a real hack.<\/li>\n<li><b>GRC teams<\/b> (governance, risk, compliance) check that the exercise follows rules and laws, and they keep the paperwork.<\/li>\n<li><b>Security engineers<\/b> fix the gaps that the exercise finds.<\/li>\n<li><b>Threat intelligence analysts<\/b> study real attacker groups and turn reports into test plans.<\/li>\n<\/ul>\n<p><b>Tools you will meet in these exercises:<\/b><\/p>\n<ul class=\"clean\">\n<li><b>MITRE ATT&amp;CK<\/b>: a free public map of attacker steps. It has <b>tactics<\/b> (the goal, like Initial Access) and <b>techniques<\/b> (the how, like T1566 Phishing).<\/li>\n<li><b>C2 frameworks<\/b> (Cobalt Strike, Caldera, Sliver): tools that send hidden commands to a test machine. The hidden link is called a <b>beacon<\/b>.<\/li>\n<li><b>Atomic Red Team<\/b>: a library of small, ready-made tests for ATT&amp;CK techniques.<\/li>\n<li><b>BAS platforms<\/b>: tools that run attack tests automatically, all the time.<\/li>\n<li><b>SIEM / log tools<\/b>: they collect events so defenders can see attacks.<\/li>\n<\/ul>\n<p><b>How a simulation works (the process):<\/b> 1) Plan the goals. 2) Write the <b>rules of engagement (RoE)<\/b> —\na paper that says what may be attacked, when, and who to call if something breaks. 3) Run the attacks and watch what\nthe defenders see. 4) Compare: which attacks were stopped? Which were missed? 5) Write a report. 6) Fix the gaps.\n7) Test again. If an attack touches something it should not, teams use <b>deconfliction<\/b>: they talk quickly to\ndecide “is this the exercise, or is it a real attacker?”<\/p>\n<p><b>Documents used in this work:<\/b> the RoE, the <b>adversary emulation plan<\/b> (which attacker group and which\nsteps to copy), the <b>detection coverage heatmap<\/b> (green = we detect it, red = we do not), the <b>after-action\nreport<\/b>, and metrics like <b>MTTD<\/b> (mean time to detect) and <b>detection rate<\/b>.<\/p>\n<p><b>Daily tasks:<\/b> run one test technique, check if an alert fired, tune a detection rule, join a purple team\nmeeting, update the heatmap, write findings, clean up test accounts and tasks.<\/p>\n<p><b>Risks it addresses:<\/b> ransomware, stolen passwords, data theft and fraud. It also has its own risks — tests\ncan break systems — so safety rules, scope limits and deconfliction are very important. That is why every good\nsimulation starts with written permission.<\/p>\n","rulesHtml":"\n<div class=\"rulegrid\">\n<div class=\"rule\"><b>&#127919; Goal.<\/b> Reach the pass mark: <b>70%<\/b>. Every exercise is worth <b>100 points<\/b>.<\/div>\n<div class=\"rule\"><b>&#10022; Multi-answer exercises.<\/b> Some exercises have more than one correct part (multi-select, several drop zones, several blanks, several steps). If you find some of the correct parts, you get some of the points. <b>Wrong picks cancel right picks<\/b>: points = (correct picks − wrong picks) ÷ total correct parts. Picking everything can never beat picking carefully.<\/div>\n<div class=\"rule\"><b>&#128161; Hints.<\/b> One hint per exercise. A hint costs <b>10% of that exercise’s points<\/b> (the best possible becomes 90). Hints give a nudge, never the answer. Using a hint does <b>not<\/b> pause the timer.<\/div>\n<div class=\"rule\"><b>&#9201; Timer — two ways it pauses.<\/b> 1) Press <b>Pause<\/b>: the timer stops and the exercise is hidden until you press Resume. 2) Press <b>Check<\/b>: the timer stops automatically so you can read the explanation with no stress — everything stays readable. The timer starts again when you press <b>Next<\/b>.<\/div>\n<div class=\"rule\"><b>&#9193; Skip.<\/b> Every exercise has a Skip button. Skipping is free. Before the exam ends you get a review screen where you can return to skipped exercises and answer them, as long as time remains. Exercises you never answer are <b>excluded<\/b>: they count as neither correct nor wrong, and their points are not added to the total.<\/div>\n<div class=\"rule\"><b>&#128203; Exercise types.<\/b> Multiple choice, multi-select, matching (drag &amp; drop), ordering / risk ranking, fill-in-the-blank, spot-the-mistake, alert triage, multi-step decisions, a simulated terminal, and a log viewer with a filter box.<\/div>\n<div class=\"rule\"><b>&#127760; Realism.<\/b> Scenarios mirror real SOC, red team and purple team work. Some include extra noise or missing information on purpose — that is realistic. All indicators are written in defanged form (hxxp://, 10[.]0[.]0[.]1).<\/div>\n<div class=\"rule\"><b>&#8635; Retake.<\/b> If you do not pass, retake the exam. The exercise order and every answer choice are shuffled again.<\/div>\n<\/div>\n"},"themes":[{"name":"Red Team Operations","concepts":["Adversary emulation","Rules of engagement (RoE)","Engagement lifecycle","Deconfliction","Objectives-based testing","Assumed breach","Safety controls & cleanup"]},{"name":"Frameworks & Threat Intelligence","concepts":["MITRE ATT&CK","Tactics","Techniques & sub-techniques","TTPs (procedures)","Cyber kill chain","Pyramid of pain","Threat-informed defense","Adversary emulation plan","APT profiling","ATT&CK Navigator & Evaluations"]},{"name":"Tooling & Attack Execution","concepts":["C2 frameworks & beacons","Attack testing tools (Atomic Red Team, Caldera)","Breach & Attack Simulation (BAS)","Payload delivery & execution","Evasion (jitter, LOLBins, AMSI)","Persistence mechanisms","Credential access (dumping, spraying)"]},{"name":"Detection & Purple Teaming","concepts":["Detection engineering","Sigma-style rules","Telemetry & data sources","Detection coverage heatmap","Purple team feedback loop","Control validation (preventive/detective/responsive)","True/false positive triage","Log analysis & filtering"]},{"name":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Risk prioritization","After-action reporting","Scope & authorization","Evidence handling (forensics-safe)","Legal & privacy considerations","Executive communication"]}],"exercises":[{"id":"m1","type":"mc","kind":"single","theme":"Detection & Purple Teaming","concepts":["C2 frameworks & beacons","Log analysis & filtering","Deconfliction"],"summary":"Regular POSTs to a metrics domain — what is it and what now?","scenario":{"text":"It is Tuesday, day 2 of a purple team exercise (window 09:00–17:00). You see one host posting to the same URL every 70–80 seconds, all morning. The red team’s plan card mentions “HTTP beacon with jitter, domain looks like analytics”. Your teammate wants to block the domain right now and move on."},"question":"What is the most likely explanation and the correct next step?","data":{"viewer":{"title":"proxy.log — extracts (host WS-114, 09:00–11:30)","lines":[{"raw":"09:12:07  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  214 bytes  200"},{"raw":"09:13:21  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  213 bytes  200"},{"raw":"09:14:35  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  214 bytes  200"},{"raw":"09:15:49  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  213 bytes  200"},{"raw":"09:16:58  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  215 bytes  200"},{"raw":"09:18:07  WS-114 -> 151[.]101[.]1[.]140        GET  /updates  1.2 MB  200"},{"raw":"09:19:18  WS-114 -> cdn-metrics[.]example  POST /collect/u3f9  214 bytes  200"}]},"options":[{"t":"Likely C2 beaconing with jitter; confirm with the red team plan first","correct":true,"why":"Steady but slightly varied intervals, equal small payloads and one URL are beacon signs; the plan card matches, so deconflict before any action."},{"t":"Normal analytics traffic from a metrics tool; no checks needed","correct":false,"why":"Real analytics calls vary in size and path. Equal 214-byte posts every ~75 seconds do not happen by accident."},{"t":"A wide malware outbreak; reimage every endpoint in the fleet","correct":false,"why":"Reimaging on day 2 of an announced exercise, before deconfliction, is overreach."},{"t":"A scheduled backup job; silence the noisy alert for one week","correct":false,"why":"Backup jobs do not run every 75 seconds, and silencing without checking hides real findings."}]},"hint":"First decide what the pattern is, then remember it is exercise week and there is a plan card.","expl":{"why":"Two ideas combine here. First, the traffic pattern: same URL, near-equal payload, steady intervals with a little jitter — classic HTTP C2 beaconing. Second, the context: it is an announced exercise and the red team plan card matches, so the correct move is deconfliction and monitoring, not immediate blocking or reimaging.","study":"Practise reading beacon patterns: interval, jitter, payload size, and always check the exercise plan."}},{"id":"m2","type":"match","kind":"multi","theme":"Frameworks & Threat Intelligence","concepts":["Techniques & sub-techniques","Tactics","MITRE ATT&CK"],"summary":"Sort six techniques into their primary tactics","scenario":{"text":"You are building the exercise’s ATT&CK layer. The six techniques below need to sit in the right tactic column. Some look similar — read the technique names carefully."},"question":"Drag each technique onto its primary tactic.","data":{"zones":[{"id":"z1","label":"Initial Access"},{"id":"z2","label":"Execution"},{"id":"z3","label":"Lateral Movement"},{"id":"z4","label":"Exfiltration"},{"id":"z5","label":"Defense Evasion"},{"id":"z6","label":"Impact"}],"items":[{"id":"i1","t":"T1566 Phishing","zone":"z1","why":"Phishing is the classic way in — Initial Access."},{"id":"i2","t":"T1059 Command and Scripting Interpreter","zone":"z2","why":"Running attacker code through shells and interpreters is Execution."},{"id":"i3","t":"T1021 Remote Services (RDP/SSH)","zone":"z3","why":"Using remote services to reach other hosts is Lateral Movement."},{"id":"i4","t":"T1041 Exfiltration Over C2 Channel","zone":"z4","why":"Sending stolen data through the existing C2 link is Exfiltration."},{"id":"i5","t":"T1070 Indicator Removal","zone":"z5","why":"Deleting logs and artefacts to hide is Defense Evasion."},{"id":"i6","t":"T1486 Data Encrypted for Impact","zone":"z6","why":"Encrypting files for ransom is Impact."}]},"hint":"Ask what each technique achieves: getting in, running code, moving across, sending out, hiding, or destroying.","expl":{"why":"The technique name usually tells you the goal: phishing gets you in, scripting runs code, remote services move you across the network, exfiltration sends data out, indicator removal hides traces, and encryption for impact destroys. Tactics are the “why” column headers of ATT&CK.","study":"Skim one tactic column per day on the ATT&CK site — six techniques each is enough to start."}},{"id":"m3","type":"steps","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Detection engineering","Telemetry & data sources","Detection coverage heatmap"],"summary":"The three-step purple loop after a silent test","scenario":{"text":"You run the purple loop for one technique in the lab: test, check telemetry, tune, re-test, record."},"question":"Pick the best action for each of the three steps.","data":{"steps":[{"scenario":"STEP 1: You run the Atomic test for T1059.001 (PowerShell) on the lab host. No alert fires in the SIEM.","question":"What do you check first?","options":[{"t":"Whether the right telemetry source is enabled and reaching the SIEM","correct":true,"note":"Telemetry was fine — events arrive, but no rule matched."},{"t":"Whether the EDR vendor is to blame and should be replaced","correct":false},{"t":"Whether the test ran on production instead of the lab","correct":false},{"t":"Whether to run the test a hundred more times","correct":false}],"why":"No detection without data: confirm the events of the technique are collected first. Only then judge the rule."},{"scenario":"STEP 2: Telemetry is fine. The existing rule only matches ‘powershell.exe -enc’. Your test used a plain -Command invocation.","question":"What is the right change to the rule?","options":[{"t":"Extend the rule logic to cover the observed command pattern","correct":true,"note":"The tuned rule now matches both -enc and -Command patterns."},{"t":"Delete the rule; it is useless","correct":false},{"t":"Set the rule to alert on every PowerShell run at maximum severity","correct":false},{"t":"Move on — nothing needs to change","correct":false}],"why":"Tune the logic to the behaviour, not the tool. Alerting on all PowerShell would drown the SOC in noise."},{"scenario":"STEP 3: You re-run the test. The alert fires and shows the right fields.","question":"What do you do with the result?","options":[{"t":"Record the coverage in the heatmap and report it to the team","correct":true,"note":"The heatmap cell for T1059.001 turns green with the rule ID attached."},{"t":"Keep the fix secret so attackers never learn of it","correct":false},{"t":"Delete the test evidence to keep the lab clean","correct":false},{"t":"Claim the technique was already covered last quarter","correct":false}],"why":"A fix is only real when it is measured and shared. The heatmap and the re-test are the proof."}]},"hint":"Data first, then rule logic, then record the result. Shortcuts burn steps.","expl":{"why":"This is the purple team loop in three moves: verify telemetry, fix the detection logic, then validate and record. Skipping telemetry wastes hours of rule tuning; tuning to a single string breaks on the next variant; and unrecorded fixes disappear when people leave.","study":"Practise explaining the loop out loud: test → telemetry → tune → re-test → record."}},{"id":"m4","type":"mc","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["ATT&CK Navigator & Evaluations","Detection coverage heatmap"],"summary":"What does an ATT&CK Navigator layer actually show?","scenario":{"text":"Your manager opens an ATT&CK Navigator layer file from last quarter’s exercise. The grid is mostly grey, some cells are green, a few are red. She asks you to explain what the colours mean for the program."},"question":"What does this Navigator layer show best?","data":{"options":[{"t":"Which techniques have detection coverage and which do not","correct":true,"why":"Layers are the standard way to picture coverage: green tested-and-detected, red tested-and-missed, grey untested."},{"t":"A list of every malware family ever seen worldwide","correct":false,"why":"The layer is your own data, not a global malware feed."},{"t":"A network diagram of the data centre","correct":false,"why":"Navigator shows techniques, not cables and switches."},{"t":"A patch level report for all servers","correct":false,"why":"Patching has its own reports; ATT&CK tracks behaviour coverage."}]},"hint":"The layer was saved during an exercise — what did the team colour in?","expl":{"why":"An ATT&CK Navigator layer is a picture of your own program state: which techniques were tested, which detections fired, where the gaps sit. Green means “we detect this”, red means “tested and missed”, grey means “untested”. Managers read it as a heat map of defensive maturity per technique.","study":"Open a saved layer and trace three green cells back to the rules that earned them."}},{"id":"m5","type":"multi","kind":"multi","theme":"Red Team Operations","concepts":["Objectives-based testing","Rules of engagement (RoE)"],"summary":"Which exercise goals are valid and safe?","scenario":{"text":"You collect proposed goals for next quarter’s objectives-based exercise. The RoE allows lab systems, one jump host, and synthetic data only. Some proposals are good; some must be rejected."},"question":"Select every goal that is valid and safe for the exercise.","data":{"options":[{"t":"Reach the mock finance data store without triggering alerts","correct":true,"why":"A clear objective that tests both attack paths and detection — exactly what objectives-based means."},{"t":"Test whether MFA stops token theft on the lab portal","correct":true,"why":"Testing a specific control against a technique is a strong, measurable goal."},{"t":"Emulate the TTPs of a group that targets our sector","correct":true,"why":"Threat-led emulation makes the exercise relevant to the real risks the company faces."},{"t":"Delete production backups to prove real impact","correct":false,"why":"Production and real backups are out of scope; impact is proven with synthetic targets."},{"t":"Read staff private emails out of curiosity","correct":false,"why":"No authorization covers private data, and curiosity is not an objective."},{"t":"Keep hidden access after the exercise ends","correct":false,"why":"Persistence must be removed at cleanup — keeping it breaks the RoE and trust."}]},"hint":"A valid goal tests a control or emulates a threat; it never touches production data or outlives the exercise.","expl":{"why":"Objectives-based exercises measure whether a defined outcome is achievable and detectable. Good goals name a target, a control or a threat profile. Goals that touch production, private data or that outlive the exercise are rejected at the RoE stage — rejecting them is a sign the process works.","study":"Compare flag-based (collect tokens) versus objectives-based (reach the data) exercises."}},{"id":"m6","type":"blank","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Sigma-style rules","Detection engineering"],"summary":"Complete the Sigma-style rule for the new detection","scenario":{"text":"You finish tuning after the exercise. The new rule draft is missing three key parts. Complete it so it catches the emulated behaviour without drowning the SOC."},"question":"Fill in each blank of the detection rule.","data":{"text":"detection:\n  selection:\n    Image|endswith: '{0}'\n    CommandLine|contains: '{1}'\n  condition: {2}\n/* alert fires when a PowerShell process runs an encoded command */","slots":[{"opts":["powershell.exe","notepad.exe","explorer.exe"],"correct":"powershell.exe","why":"The rule targets PowerShell — the process name must be powershell.exe."},{"opts":["-enc","--licence","/install"],"correct":"-enc","why":"The comment says ‘encoded command’ — the switch is -enc."},{"opts":["selection","1 of them*","filter and not them"],"correct":"selection","why":"There is only one selection block, so the condition is simply: selection."}]},"hint":"The comment under the rule tells you the goal: a PowerShell process with an encoded command.","expl":{"why":"A minimal behavioural rule needs three parts: which process to watch (Image ends with powershell.exe), which behaviour inside it (CommandLine contains -enc), and a condition that names the selection. Together they catch the encoded-command technique the red team emulated.","study":"Read one Sigma rule per day this week: selection, condition, and false-positive filters."}},{"id":"m7","type":"match","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Control validation (preventive/detective/responsive)","Breach & Attack Simulation (BAS)"],"summary":"Classify six controls by their security pillar","scenario":{"text":"After the BAS report, controls are grouped by what they actually do. Grouping them helps the team see where money goes: stopping attacks, seeing attacks, or cleaning up after them."},"question":"Drag each control onto the pillar it belongs to.","data":{"zones":[{"id":"p1","label":"Preventive — stops the attack"},{"id":"p2","label":"Detective — sees the attack"},{"id":"p3","label":"Responsive — acts after detection"}],"items":[{"id":"c1","t":"MFA on remote access","zone":"p1","why":"MFA blocks stolen-password logins — it stops, not watches."},{"id":"c2","t":"SIEM alert on impossible-travel logins","zone":"p2","why":"An alert sees and reports — detective."},{"id":"c3","t":"EDR isolates a suspicious host","zone":"p3","why":"Isolation is an action taken after detection — responsive."},{"id":"c4","t":"Application allow-listing on servers","zone":"p1","why":"Allow-listing stops unknown programs from running at all."},{"id":"c5","t":"Honey account monitoring","zone":"p2","why":"A honey account should never be used — any use is a signal — detective."},{"id":"c6","t":"Backup restore runbook","zone":"p3","why":"Restoring from backup is the recovery action after impact."}]},"hint":"Ask: does it stop, see, or clean up? One control per pillar may repeat.","expl":{"why":"Preventive controls stop attacks (MFA, allow-listing). Detective controls surface them (SIEM alerts, honey accounts). Responsive controls limit and repair (EDR isolation, restores). A balanced program validates all three pillars — a BAS run that only tests prevention leaves detection and response unmeasured.","study":"Sort your own team’s controls into the three pillars; empty pillars are the first investment candidates."}},{"id":"m8","type":"terminal","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Attack testing tools (Atomic Red Team, Caldera)","Techniques & sub-techniques"],"summary":"Dry-run the scheduled-task test without executing it","scenario":{"text":"Purple session, lab host wks-227. The tool “atomtest” runs Atomic Red Team style tests. You must show the team what test T1053.005 (scheduled task) would do — but nothing may execute during the finance change freeze."},"question":"Type the atomtest command that shows the test plan for T1053.005 on wks-227 without executing anything, then run it.","data":{"title":"lab-shell — atomtest (atomic test runner)","prompt":"analyst@lab:~$","welcome":["atomtest — atomic test runner v1.4","Hint: some flags only plan or filter; some flags execute."],"output":["[dry-run] technique T1053.005 — Scheduled Task/Job: Scheduled Task","[dry-run] steps: 1) create task ATR-Sim-Persist  2) run once  3) delete task","[dry-run] target wks-227 — nothing was executed"],"expected":"atomtest --technique T1053.005 --target wks-227 --dry-run","parts":"atomtest = the atomic test runner. --technique T1053.005 = the scheduled-task technique. --target wks-227 = the lab host. --dry-run = print the plan only; do not execute.","elements":[{"label":"Uses the atomtest runner","re":"^atomtest\\b","why":"atomtest is the tool installed for atomic tests."},{"label":"Selects technique T1053.005","re":"--technique\\s+T1053\\.005\\b","why":"The scheduled-task sub-technique asked for is T1053.005."},{"label":"Targets wks-227","re":"--target\\s+wks-227\\b","why":"The lab host named in the task is wks-227."},{"label":"Includes the --dry-run flag","re":"--dry-?run\\b","why":"--dry-run prints the plan without executing — required by the change freeze."}],"forbidden":[{"label":"Executes instead of planning","re":"--execute\\b","why":"--execute runs the technique — forbidden during the freeze.","danger":true}],"syntax":null,"sampleOut":null},"hint":"You need to see only the plan, not the execution — there is a flag for exactly that.","expl":{"why":"You knew the tool; the work was choosing the options: the technique ID for the scheduled-task test, the target host, and the --dry-run flag that prints the plan without running anything. During a change freeze, dry-run mode is how purple teams keep testing alive without touching systems.","study":"List three flags of any test runner you use: run, dry-run, and filter — know the difference."}},{"id":"m9","type":"order","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Cyber kill chain","Payload delivery & execution","Persistence mechanisms","Credential access (dumping, spraying)"],"summary":"Rebuild the emulated attack chain in order","scenario":{"text":"Last week’s exercise emulated a ransomware group’s path from email to data theft. The six steps below are shuffled. Put them back in the order they happened."},"question":"Put the six attack-chain steps in the correct order.","data":{"items":[{"id":"s1","t":"Spear-phishing email delivers a macro workbook"},{"id":"s2","t":"Macro spawns a PowerShell downloader"},{"id":"s3","t":"Beacon checks in to the C2 over HTTPS"},{"id":"s4","t":"New scheduled task is created for persistence"},{"id":"s5","t":"Credential dumping on a workstation"},{"id":"s6","t":"Staged files are compressed and exfiltrated"}],"correctIds":["s1","s2","s3","s4","s5","s6"]},"hint":"Delivery first, command channel second; persistence and credentials come before data leaves.","expl":{"why":"The chain follows the kill chain logic: get in (phishing), run code (downloader), establish control (beacon), survive reboots (scheduled task), steal access (credential dump), then take the data (stage and exfiltrate). Defenders map detections to each link — breaking any link breaks the chain.","study":"Walk one real intrusion report and label each step with its ATT&CK technique ID."}},{"id":"m10","type":"mc","kind":"single","theme":"Governance, Metrics & Reporting","concepts":["Exercise metrics (detection rate, MTTD)","Breach & Attack Simulation (BAS)"],"summary":"Read the BAS numbers correctly","scenario":{"text":"The BAS platform report lands: 40 techniques tested in the quarter. Alerts fired for 26 of them. The SOC noticed 18 of those 26 in time during the live drill. Your manager asks what the numbers really say."},"question":"Which statement is the correct reading of the report?","data":{"options":[{"t":"Detection rate 65%; the SOC missed 8 alerts it should have seen","correct":true,"why":"26 of 40 fired = 65%. Of those, 18 were noticed, so 8 fired but were missed — an execution problem, not a tooling one."},{"t":"Detection rate 45%; the platform is clearly broken this quarter","correct":false,"why":"26/40 is 65%, not 45%, and nothing suggests the platform is broken."},{"t":"All 40 of the tested techniques were detected by alerts","correct":false,"why":"Only 26 of 40 fired alerts; 14 produced nothing at all."},{"t":"Only the 18 noticed alerts matter; the rest can be ignored","correct":false,"why":"The 14 silent tests and the 8 missed alerts are exactly what the program must fix next."}]},"hint":"Two different questions hide in the numbers: did an alert exist, and did a human see it?","expl":{"why":"Detection rate = alerts fired / techniques tested = 26/40 = 65%. Then visibility: the SOC noticed 18 of 26, so 8 alerts fired but nobody saw them. The 14 with no alert are detection engineering gaps; the 8 unseen alerts are process or staffing gaps. Two different fixes for two different problems.","study":"Report detection rate and SOC-visibility separately — they fail for different reasons."}},{"id":"m11","type":"spot","kind":"single","theme":"Frameworks & Threat Intelligence","concepts":["Adversary emulation plan","APT profiling","Scope & authorization"],"summary":"Find the line that breaks the emulation plan","scenario":{"text":"You review the emulation plan for an APT29-style exercise. The plan is good except for one line that violates basic rules of emulation work."},"question":"Click the one line that must be removed or replaced.","data":{"lines":[{"t":"Plan: emulate APT29-style TTPs, top 12 techniques","correct":false,"why":"Choosing a relevant APT profile and a bounded technique set is standard practice."},{"t":"Scope: two lab hosts and one jump host, no production","correct":false,"why":"A tight, explicit scope is exactly right."},{"t":"Window: Saturday 08:00–20:00, SOC informed","correct":false,"why":"Announced windows with SOC awareness are correct."},{"t":"Credentials: use real stolen credentials bought on a forum","correct":true,"why":"Emulation uses synthetic or self-created test credentials. Buying real stolen credentials is illegal, unethical and unnecessary."},{"t":"Deconfliction: shared channel with SOC duty lead","correct":false,"why":"A live deconfliction channel is required practice."},{"t":"Cleanup: remove tasks, accounts and tools after the test","correct":false,"why":"Cleanup is part of every professional plan."}]},"hint":"Everything is normal except where the credentials come from.","expl":{"why":"Emulation plans copy behaviour, not crime. Red teams create their own test credentials or use lab accounts; using credentials stolen from real breaches is illegal and would contaminate the exercise. Every other line — profile, scope, window, deconfliction, cleanup — is textbook correct.","study":"Note the difference: emulate TTPs (legal), never the criminal acquisition of access (illegal)."}},{"id":"m12","type":"multi","kind":"multi","theme":"Tooling & Attack Execution","concepts":["Credential access (dumping, spraying)","Log analysis & filtering"],"summary":"Select every line that shows password spraying","scenario":{"text":"The red team emulated password spraying: one password tried against many accounts, slowly, from one source. The auth log below spans several hours. Some lines show spraying; some show normal user errors; one shows a targeted brute force against a single account."},"question":"Select every log line that is part of the password spray.","data":{"viewer":{"title":"auth.log — extracts, multiple sources, one night","lines":[{"raw":"22:58:01  FAILED  jsmith      (password)      src 203[.]0[.]113[.]50"},{"raw":"23:01:14  FAILED  asmith      (password)      src 203[.]0[.]113[.]50"},{"raw":"23:01:40  FAILED  bwilson     (password)      src 203[.]0[.]113[.]50"},{"raw":"23:07:55  FAILED  jsmith      (Spring2024!)   src 198[.]51[.]100[.]9"},{"raw":"23:07:56  FAILED  jsmith      (Summer2024!)   src 198[.]51[.]100[.]9"},{"raw":"23:12:02  FAILED  mbrown      (password)      src 203[.]0[.]113[.]50"},{"raw":"23:14:47  SUCCESS mbrown      (password)      src 203[.]0[.]113[.]50"},{"raw":"23:20:11  FAILED  tlee        (password)      src 203[.]0[.]113[.]50"},{"raw":"23:33:02  FAILED  jsmith      (Autumn2024!)   src 198[.]51[.]100[.]9"},{"raw":"23:41:10  LOCKED  jsmith      (5 failures)    src 198[.]51[.]100[.]9"},{"raw":"06:12:44  FAILED  rkhan       (Passw0rd123!)  src 10[.]20[.]8[.]61"},{"raw":"06:13:02  SUCCESS rkhan       (Passw0rd123!)  src 10[.]20[.]8[.]61"}]},"options":[{"t":"22:58:01 jsmith failure","correct":true,"why":"First sprayed account — the password ‘password’ tried across accounts from one source."},{"t":"23:01:14 asmith failure","correct":true,"why":"Same password, same source, different account — spray pattern."},{"t":"23:01:40 bwilson failure","correct":true,"why":"Same password, same source — the spray moves account to account."},{"t":"23:07:55 jsmith failure (Spring2024!)","correct":false,"why":"Different source and password guesses against one account — that is targeted brute force, not the spray."},{"t":"23:07:56 jsmith failure (Summer2024!)","correct":false,"why":"Two rapid guesses on one account from one source — targeted brute force."},{"t":"23:12:02 mbrown failure","correct":true,"why":"The spray reaches mbrown with the shared password."},{"t":"23:14:47 mbrown success","correct":true,"why":"The spray’s payoff: one weak password worked — the success line belongs to the spray."},{"t":"23:20:11 tlee failure","correct":true,"why":"Same single password, same source — the spray continues."},{"t":"23:33:02 jsmith failure (Autumn2024!)","correct":false,"why":"Yet another guess against one account from the other source — targeted brute force, not the spray."},{"t":"23:41:10 jsmith lockout","correct":false,"why":"The lockout is a consequence of the targeted brute force — real activity, but a different technique than the spray."},{"t":"06:12:44 rkhan morning failure","correct":false,"why":"A morning typo from the user’s own workstation — normal noise, wrong hour, wrong source."},{"t":"06:13:02 rkhan morning success","correct":false,"why":"The user retyping the right password at their desk — normal life, not the spray."}]},"hint":"The spray uses one password and one source across many accounts. The other source tries many passwords against one account; the morning lines are a user at their desk.","expl":{"why":"Password spraying = one common password, many accounts, one source, slow pace. Lines at 22:58, 23:01 (two), 23:12, 23:14 (success) and 23:20 all share the password ‘password’ and source 203[.]0[.]113[.]50 — that is the spray, including its successful hit. The jsmith lines from 198[.]51[.]100[.]9 are targeted brute force (many passwords, one account) ending in a lockout, and the 06:1x rkhan lines are a normal morning login at a desk — same technique family names, different stories.","study":"Detection tip: alert on one source failing across many accounts, not only on many failures for one account."}},{"id":"m13","type":"mc","kind":"single","theme":"Red Team Operations","concepts":["Deconfliction","Scope & authorization"],"summary":"C2-like traffic to an out-of-scope host","scenario":{"text":"Exercise window is open. The SIEM shows beacon-like traffic, but the destination host, PROD-ARCH-01, is not in the exercise scope. The red team plan only covers the lab segment."},"question":"What is the correct next step?","data":{"options":[{"t":"Pause and check with the red team lead about the off-scope target","correct":true,"why":"Out-of-scope activity must be verified before any action: it may be a routing artefact, a mistake, or a real intrusion."},{"t":"Run the full containment playbook on PROD-ARCH-01 immediately","correct":false,"why":"Containing a production host before deconfliction can cause outage for nothing."},{"t":"Delete the alert; it is exercise week on the SOC floor after all","correct":false,"why":"Exercise week is not a blanket excuse — off-scope signals deserve checks, not deletion."},{"t":"Reply to the C2 server to waste the attacker’s time","correct":false,"why":"Nobody replies to unverified C2 — that is an offensive action outside the SOC’s authority."}]},"hint":"Two facts collide: exercise week, but an off-scope target. Which one changes your authority?","expl":{"why":"Scope defines what the red team may touch — and what the SOC may attribute to the exercise. Activity aimed outside the scope cannot be assumed benign; it also cannot be auto-contained without consequences. The professional move is deconfliction first, then decide with facts.","study":"Write a personal rule: ‘off-scope signal → pause red activity → verify → decide’."}},{"id":"m14","type":"order","kind":"multi","theme":"Governance, Metrics & Reporting","concepts":["Risk prioritization","Detection engineering"],"summary":"Rank the exercise findings by risk","scenario":{"text":"The exercise produced five findings. The detection team can only fix two this month. Rank the findings by risk, highest first."},"question":"Drag the findings into risk order (highest risk first).","data":{"items":[{"id":"f1","t":"No alert on domain-admin credential dump"},{"id":"f2","t":"No alert on phishing payload execution"},{"id":"f3","t":"No alert on internal port scan"},{"id":"f4","t":"No alert on opening a benign test document"},{"id":"f5","t":"Typo in the tool name in the report"}],"correctIds":["f1","f2","f3","f4","f5"]},"hint":"Ask for each: how far along the kill chain is it, and what does missing it cost?","expl":{"why":"Credential dumping on a domain admin is closest to full compromise — highest risk. Payload execution is the entry point. Port scans are early noise but still signal. Opening a benign document is barely an event, and a typo is no risk at all. Risk ranking weighs impact and attack-chain position, not loudness.","study":"Practise ranking findings with two axes: likelihood of being part of a real attack, and blast radius."}},{"id":"m15","type":"multi","kind":"multi","theme":"Frameworks & Threat Intelligence","concepts":["Threat-informed defense","TTPs (procedures)","Pyramid of pain"],"summary":"Why TTP-based detection beats plain IOC matching","scenario":{"text":"After the exercise, the team debates investing in TTP-based detections instead of more IOC lists. Choose the arguments that are actually true."},"question":"Select every valid reason TTP-based detection beats single IOC matching.","data":{"options":[{"t":"Attackers can change IPs and file names quickly, but habits are harder to change","correct":true,"why":"That is the pyramid of pain: behaviour sits higher and hurts more."},{"t":"One behavioural rule can catch new variants of the same technique","correct":true,"why":"Variants share the behaviour even when every indicator changes."},{"t":"TTP alerts map to ATT&CK, so coverage becomes measurable","correct":true,"why":"Technique-level alerts feed heatmaps and metrics directly."},{"t":"IOC rules are always useless and should all be deleted","correct":false,"why":"IOCs are fast and useful for known threats — the point is balance, not deletion."},{"t":"Behaviour rules never produce false positives","correct":false,"why":"They do, especially at first; tuning is part of the work."},{"t":"IOC lists never expire or go stale","correct":false,"why":"IOCs age quickly — that weakness is exactly the argument for TTP detection."}]},"hint":"Three arguments defend TTP detection. The three wrong ones use words like ‘always’ and ‘never’.","expl":{"why":"TTP detection targets behaviour — the hard-to-change part of an attack (pyramid of pain). It generalises to new variants and plugs into ATT&CK metrics. It does not make IOCs useless, and it does not eliminate false positives; it shifts effort from chasing stale indicators to catching behaviour.","study":"Explain the pyramid of pain to a colleague using one example: blocked IP versus behavioural rule."}},{"id":"m16","type":"steps","kind":"multi","theme":"Detection & Purple Teaming","concepts":["Purple team feedback loop","Credential access (dumping, spraying)","Detection engineering"],"summary":"Dual perspective: close the LSASS dump gap from both sides","scenario":{"text":"Purple exercise on lab host wks-31. Red ran an LSASS memory dump via a Windows system library; EDR recorded the event but the SIEM never alerted. Blue and red each take one step."},"question":"Answer for both perspectives, one step each.","data":{"steps":[{"scenario":"STEP 1 — BLUE VIEW: EDR shows the dump event on wks-31. The SIEM has the EDR events flowing, but no alert exists for this behaviour.","question":"Where exactly is the gap?","options":[{"t":"Between EDR telemetry and a SIEM rule for the dump behaviour","correct":true,"note":"The data arrives; nothing evaluates it. A rule is missing."},{"t":"The dump event never actually happened on wks-31","correct":false},{"t":"The email gateway missed the initial delivery stage","correct":false},{"t":"The red team had no permission to run any tests","correct":false}],"why":"Telemetry existed but no detection consumed it — the gap is the missing rule, not missing data."},{"scenario":"STEP 2 — RED VIEW: Blue deployed a new rule that matches the exact dump command string red used. Red must keep the exercise honest.","question":"What should red do to test the fix properly?","options":[{"t":"Re-run the dump with a different tool that performs the same technique","correct":true,"note":"The alert fired for the variant too — the rule is behavioural and survives tool changes."},{"t":"Re-run the exact same command and call it validated","correct":false},{"t":"Stop testing and write the rule is fixed","correct":false},{"t":"Delete the EDR agent to test resilience","correct":false}],"why":"A rule that only matches one tool’s string is weak. Testing with a different implementation proves the behaviour is covered, not the tool name."}]},"hint":"Blue asks ‘where did the signal stop?’. Red asks ‘does the rule catch the behaviour or just my tool?’","expl":{"why":"Two views, one loop. Blue traces the pipeline: event recorded, rule missing — build the rule. Red challenges it: same-behaviour-different-tool proves behavioural coverage; same-command replay only proves string matching. Together they produce a detection worth trusting.","study":"After every fix, ask whether it would catch a variant with a different tool."}}]};
"use strict";
/* EXAM payload is injected by the build script immediately before this file. */
var T = EXAM.meta, SEV = EXAM.severity, STATE = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtClock(sec){ sec=Math.max(0,sec|0); var m=(sec/60)|0, s=sec%60; if(m>=60){ var h=(m/60)|0; m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); } return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function exById(id){ return byId(EXAM.exercises,id); }

/* ================= STATE ================= */
function newState(){
  return {
    order: shuffle(EXAM.exercises.map(function(e){return e.id;})),
    idx: 0, current: null, fromReview: false, attempt: 1,
    results: {}, skipped: [], checked: false,
    hintUsed: {}, draft: {},
    timer: { remain: EXAM.timerSeconds, isRunning:false, isManuallyPaused:false, isAutoPausedAfterCheck:false, int:null },
    exTimer: { remain:0, int:null, exId:null },
    reported: false, timeUp: false, username: ''
  };
}
function answeredIds(){ return Object.keys(STATE.results).filter(function(k){ return !STATE.results[k].excluded; }); }
function liveScore(){
  var ids=answeredIds(), earned=0, poss=ids.length*100;
  ids.forEach(function(k){ earned += STATE.results[k].earned; });
  return {earned:earned, poss:poss};
}
function themeBreakdown(){
  var m={};
  answeredIds().forEach(function(k){
    var ex=exById(k), r=STATE.results[k];
    if(!m[ex.theme]) m[ex.theme]={earned:0,poss:0,n:0};
    m[ex.theme].earned+=r.earned; m[ex.theme].poss+=100; m[ex.theme].n++;
  });
  return m;
}

/* ================= TIMER ================= */
function timerIndicator(){
  var t=STATE.timer;
  if(STATE.timeUp) return {cls:'',txt:'\u23F9 time is up'};
  if(STATE.finished) return {cls:'',txt:'\u23F9 exam finished'};
  if(!t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck) return {cls:'',txt:'\u2014 not started'};
  if(t.isManuallyPaused) return {cls:'pausedyou',txt:'\u23F8 paused by you'};
  if(t.isAutoPausedAfterCheck) return {cls:'pausedfb',txt:'\u23F8 paused \u2014 review your feedback'};
  return {cls:'running',txt:'\u25B6 running'};
}
function renderTimer(){
  var t=STATE.timer, el=$('htimer'), ind=timerIndicator();
  el.textContent=fmtClock(t.remain);
  el.className='timer'+(t.remain<60?' crit':(t.remain<300?' low':''));
  var m=$('htmode'); m.textContent=ind.txt; m.className='tmode '+ind.cls;
}
function timerTick(){
  var t=STATE.timer;
  if(t.isRunning && !t.isManuallyPaused && !t.isAutoPausedAfterCheck){
    t.remain--;
    renderTimer();
    if(t.remain<=0){ t.remain=0; timeUp(); }
  }
}
function startTimer(){
  var t=STATE.timer;
  if(t.int) clearInterval(t.int);
  t.isRunning=true; t.isManuallyPaused=false; t.isAutoPausedAfterCheck=false;
  t.int=setInterval(timerTick,1000); renderTimer();
}
function stopTimerLoop(){ var t=STATE.timer; if(t.int){clearInterval(t.int); t.int=null;} t.isRunning=false; }
function setAutoPause(on){
  STATE.timer.isAutoPausedAfterCheck=on; renderTimer();
}
function manualPause(){
  STATE.timer.isManuallyPaused=true; renderTimer(); showPauseOverlay(true);
  var b=$('bpause'); if(b){ b.innerHTML='&#9654; Resume'; }
}
function manualResume(){
  STATE.timer.isManuallyPaused=false; showPauseOverlay(false); renderTimer();
  var b=$('bpause'); if(b){ b.innerHTML='&#9208; Pause'; }
}
function timeUp(){
  if(STATE.timeUp) return;
  STATE.timeUp=true; stopTimerLoop(); stopExerciseTimer(); showPauseOverlay(false);
  renderResults(true);
}

/* per-exercise reduced timer (EXTREMELY HARD terminal) */
function startExerciseTimer(ex){
  stopExerciseTimer();
  if(!ex.timerSeconds) return;
  STATE.exTimer={remain:ex.timerSeconds,int:null,exId:ex.id};
  var box=$('exclock'); if(box) box.innerHTML='&#9201; Exercise timer: <b id="exclockv">'+fmtClock(ex.timerSeconds)+'</b>';
  STATE.exTimer.int=setInterval(function(){
    /* the reduced timer respects both pause flags and never runs after time is up */
    if(STATE.timeUp || STATE.timer.isManuallyPaused || STATE.timer.isAutoPausedAfterCheck) return;
    STATE.exTimer.remain--;
    var v=$('exclockv'); if(v) v.textContent=fmtClock(STATE.exTimer.remain);
    if(STATE.exTimer.remain<=0){
      stopExerciseTimer();
      STATE.results[ex.id]={earned:0,status:'excluded',excluded:true,answered:false,studentText:'(no answer \u2014 exercise timer ended)'};
      advanceAfterExclusion();
    }
  },1000);
}
function stopExerciseTimer(){ if(STATE.exTimer && STATE.exTimer.int){ clearInterval(STATE.exTimer.int); STATE.exTimer.int=null; } }
function advanceAfterExclusion(){
  stopExerciseTimer();
  goNext(true);
}

/* ================= HEADER ================= */
function renderHeader(){
  $('hbadge').innerHTML='&#9733; '+esc(SEV.label);
  var bd=$('hbadge'); bd.style.setProperty('--sev',SEV.color); bd.style.setProperty('--sevbg',SEV.bg);
  if(!STATE){ return; }
  var total=STATE.order.length;
  var pos=STATE.current? (STATE.order.indexOf(STATE.current)+1) : 0;
  $('hcount').textContent = STATE.current ? ('Exercise '+pos+' of '+total) : ('Exercises: '+total);
  var ls=liveScore();
  $('hscore').textContent=ls.earned+' / '+ls.poss;
  var done=answeredIds().length;
  $('hprog').style.width=Math.round(100*done/total)+'%';
  var ex=STATE.current?exById(STATE.current):null;
  $('bhint').disabled=!ex||!!STATE.hintUsed[ex.id]||STATE.checked;
  $('bskip').disabled=!ex||STATE.checked||STATE.timeUp;
}

/* ================= NAV ================= */
function showScreen(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){ var n=$(s); if(n) n.className=s===id?'':'hidden'; });
  $('hdr').className = (id==='scr-intro')?'hidden':'';
}
function startExam(){
  startTimer();
  loadExercise(STATE.order[0]);
}
function loadExercise(id){
  STATE.current=id; STATE.checked=false;
  var returning=STATE.fromReview; STATE.fromReview=false;
  setAutoPause(false);
  $('bpause').disabled=false; $('bfinish').disabled=false;
  renderExercise(exById(id));
  renderHeader();
  showScreen('scr-exam');
  startExerciseTimer(exById(id));
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function skipCurrent(){
  if(STATE.checked||!STATE.current||STATE.timeUp) return;
  stopExerciseTimer();
  if(STATE.skipped.indexOf(STATE.current)<0) STATE.skipped.push(STATE.current);
  nextUnansweredOrReview();
}
function nextUnansweredOrReview(){
  var next=null;
  for(var i=0;i<STATE.order.length;i++){ var id=STATE.order[i]; if(!STATE.results[id] && STATE.skipped.indexOf(id)<0){ next=id; break; } }
  if(next){ loadExercise(next); }
  else if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); }
  else { renderResults(false); }
}
function goNext(afterExclusion){
  stopExerciseTimer();
  if(STATE.fromReviewPending){ STATE.fromReviewPending=false; STATE.current=null;
    if(STATE.skipped.length>0 && !STATE.timeUp) renderReview(); else nextUnansweredOrReview();
    return;
  }
  if(STATE.current){
    var i=STATE.order.indexOf(STATE.current);
    for(var j=i+1;j<STATE.order.length;j++){ if(!STATE.results[STATE.order[j]] && STATE.skipped.indexOf(STATE.order[j])<0){ loadExercise(STATE.order[j]); return; } }
    if(STATE.skipped.length>0 && !STATE.timeUp){ renderReview(); return; }
    if(answeredIds().length===STATE.order.length){ renderResults(false); return; }
    nextUnansweredOrReview();
  } else {
    nextUnansweredOrReview();
  }
}
function finishFlow(){
  if(STATE.timeUp){ renderResults(true); return; }
  stopExerciseTimer();
  /* move any never-answered exercises into the skipped pool so they can be reviewed */
  STATE.order.forEach(function(id){
    if(!STATE.results[id] && STATE.skipped.indexOf(id)<0) STATE.skipped.push(id);
  });
  if(STATE.skipped.length>0){ renderReview(); } else { renderResults(false); }
}
function returnToSkipped(id){
  STATE.fromReview=true; STATE.fromReviewPending=true;
  STATE.skipped=STATE.skipped.filter(function(x){return x!==id;});
  loadExercise(id);
}

/* ================= HINT ================= */
function useHint(){
  if(!STATE.current||STATE.checked) return;
  var ex=exById(STATE.current);
  if(STATE.hintUsed[ex.id]) return;
  STATE.hintUsed[ex.id]=true;
  var box=$('hintarea');
  if(box){ box.innerHTML='<div class="hintbox">&#128161; <b>Hint:</b> '+esc(ex.hint)+' <span class="small muted">(This hint costs 10% of this exercise\u2019s points \u2014 the timer keeps running.)</span></div>'; }
  renderHeader();
}

/* ================= PAUSE OVERLAY ================= */
function showPauseOverlay(on){
  var n=$('pauseov');
  if(on){
    if(!n){
      n=document.createElement('div'); n.id='pauseov';
      n.innerHTML='<div class="big">&#9208;</div><h2>Paused by you</h2><p class="muted">The timer is stopped and the exercise is hidden so it cannot be read.<br>Press Resume when you are ready \u2014 the exercise comes back and the timer continues.</p><button class="btn primary" id="ovresume" style="min-width:180px;min-height:48px">&#9654; Resume</button>';
      document.body.appendChild(n);
      $('ovresume').addEventListener('click',manualResume);
    } else { n.classList.remove('hidden'); }
  } else if(n){ n.classList.add('hidden'); }
}

/* ================= WEBSITE INTEGRATION ================= */
function reportScore(){
  if(STATE.reported) return;
  STATE.reported=true;
  var ls=liveScore();
  var percent = ls.poss>0 ? Math.round((ls.earned/ls.poss)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:T.topicId, batch:T.batch,
      score:ls.earned, total:ls.poss, percent:percent,
      passed: percent>=T.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(STATE){ STATE.username = event.data.username || ''; var g=$('greet'); if(g && STATE.username){ g.innerHTML='Welcome, <span class="greet">'+esc(STATE.username)+'</span> \u2014 good luck!'; } }
  }catch(e){}
});

/* ================= BOOT ================= */
document.addEventListener('click',function(ev){
  var b=ev.target;
  if(b&&b.classList&&b.classList.contains('copyb')&&b.hasAttribute('data-copy')){
    var txt=b.getAttribute('data-copy');
    function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1200); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1200); },fallback); } else fallback();
  }
});
function boot(){
  STATE=newState();
  document.documentElement.style.setProperty('--sev',SEV.color);
  document.documentElement.style.setProperty('--sevbg',SEV.bg);
  renderIntro(); showScreen('scr-intro');
  $('bhint').addEventListener('click',useHint);
  $('bpause').addEventListener('click',function(){
    if(STATE.timer.isManuallyPaused){ manualResume(); }
    else { manualPause(); }
  });
  $('bskip').addEventListener('click',skipCurrent);
  $('bfinish').addEventListener('click',finishFlow);
}
document.addEventListener('DOMContentLoaded',boot);

/* ================= INTRO SCREEN ================= */
function renderIntro(){
  var m=$('main');
  var themesHtml=EXAM.themes.map(function(th){
    return '<div class="theme"><h4>'+esc(th.name)+'</h4><ul>'+th.concepts.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>';
  }).join('');
  m.innerHTML=
  '<section id="scr-intro">'+
    '<div class="hero"><div class="logo">&#128760;</div><div>'+
      '<p class="kicker">'+esc(SEV.label)+' tier \u00B7 certification practice exam \u00B7 batch '+T.batch+' of 4</p>'+
      '<h1>'+esc(T.title)+'</h1>'+
      '<div><span class="pill">&#9201; '+T.estimatedMinutes+' minutes</span><span class="pill">&#127919; Pass: '+T.passMark+'%</span><span class="pill">&#128203; '+T.questionCount+' exercises</span><span class="pill">&#128161; Hints: \u221210% each</span></div>'+
      (STATE.username?'<p id="greet">Welcome, <span class="greet">'+esc(STATE.username)+'</span> \u2014 good luck!</p>':'<p id="greet"></p>')+
    '</div></div>'+
    '<div class="card tint"><h2>&#128218; Understanding \u201CAdversary Simulation\u201D</h2>'+EXAM.intro.keywordHtml+'</div>'+
    '<div class="card"><h2>&#127991; Keywords covered in this topic</h2><p class="small muted">All four tiers of this topic (EASY \u2192 EXTREMELY HARD) cover the concepts below. Every concept is practised at least once somewhere in the topic.</p><div class="themewrap">'+themesHtml+'</div></div>'+
    '<div class="card"><h2>&#128220; How this exam works</h2>'+EXAM.intro.rulesHtml+
      '<div class="notice amber">&#9888;&#65039; <b>This file\u2019s severity: '+esc(SEV.label)+'.</b> '+esc(SEV.desc)+'</div>'+
    '</div>'+
    '<div class="actions"><button class="btn primary" id="bstart" style="min-width:220px;min-height:50px;font-size:16px">&#9654; Start the exam</button></div>'+
    '<p class="footer-note">Everything runs inside this file. No network requests. The terminal and all logs are simulations only \u2014 nothing real is executed.</p>'+
  '</section>';
  $('bstart').addEventListener('click',function(){ startExam(); });
}

/* ================= REVIEW SKIPPED SCREEN ================= */
function renderReview(){
  STATE.current=null; setAutoPause(false); stopExerciseTimer(); renderHeader();
  $('bpause').disabled=true; $('bfinish').disabled=true;   /* no exercise to pause or finish from here */
  var m=$('main');
  var items=STATE.skipped.map(function(id){
    var ex=exById(id);
    return '<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:220px"><b>'+esc(ex.summary)+'</b><div class="small muted">'+esc(ex.theme)+' \u00B7 '+esc(SEV.label)+'</div></div>'+
      '<button class="btn primary" data-ret="'+esc(id)+'">&#8617; Return to it</button></div>';
  }).join('');
  m.innerHTML='<section id="scr-review">'+
    '<p class="kicker">Before you finish</p><h1>&#128257; Review skipped exercises</h1>'+
    '<p>You skipped '+STATE.skipped.length+' exercise'+(STATE.skipped.length===1?'':'s')+'. You can return to any of them now and answer it \u2014 as many times as you need \u2014 as long as the timer has not ended. Skipping is free, but an exercise you never answer is <b>excluded from your score</b>: it adds no points and it does not count against you.</p>'+
    items+
    '<div class="notice amber">&#9201; Time left: <b class="mono">'+fmtClock(STATE.timer.remain)+'</b>. When you finish, unanswered exercises are listed in the report as \u201CNot answered \u2014 excluded from score\u201D.</div>'+
    '<div class="actions"><button class="btn danger" id="bfin2" style="min-width:200px">&#9989; Finish exam now</button></div>'+
  '</section>';
  m.querySelectorAll('[data-ret]').forEach(function(b){ b.addEventListener('click',function(){ returnToSkipped(b.getAttribute('data-ret')); }); });
  $('bfin2').addEventListener('click',function(){ renderResults(STATE.timeUp); });
  showScreen('scr-review');
}

/* ================= RESULTS SCREEN ================= */
function renderResults(timeIsUp){
  var m=$('main');
  STATE.current=null; stopExerciseTimer();
  $('bpause').disabled=true; $('bfinish').disabled=true;   /* the exam is over */
  STATE.finished=true; stopTimerLoop(); renderTimer();
  var ls=liveScore();
  var percent=ls.poss>0?Math.round(ls.earned/ls.poss*100):0;
  var passed=percent>=T.passMark;
  var full=0,part=0,wrong=0,skippedN=0;
  STATE.order.forEach(function(id){
    var r=STATE.results[id];
    if(!r||r.excluded){ skippedN++; return; }
    if(r.earned>=100) full++; else if(r.earned>0) part++; else wrong++;
  });
  var tb=themeBreakdown();
  var tbHtml=Object.keys(tb).map(function(k){ return '<tr><td>'+esc(k)+'</td><td class="mono">'+tb[k].n+'</td><td class="mono">'+tb[k].earned+' / '+tb[k].poss+'</td><td class="mono">'+(tb[k].poss?Math.round(tb[k].earned/tb[k].poss*100):0)+'%</td></tr>'; }).join('');
  var certHtml = passed?
    '<div class="cert"><div style="font-size:40px">&#127942;</div><h2>Certificate of achievement</h2><p>You passed the <b>'+esc(T.title)+'</b> practice exam.</p><div class="big">'+percent+'%</div><p class="muted">Pass mark: '+T.passMark+'% \u00B7 Tier: '+esc(SEV.label)+' (batch '+T.batch+' of 4) \u00B7 Attempt '+STATE.attempt+'</p></div>'
    :'<div class="cert" style="border-color:var(--red)"><div style="font-size:40px">&#128546;</div><h2>Not passed this time</h2><p>You scored <b>'+percent+'%</b> and the pass mark is <b>'+T.passMark+'%</b>. You must retake the exam. Read the report below \u2014 it tells you exactly what to study.</p></div>';
  var reportHtml=STATE.order.map(function(id){ return reportRow(id); }).join('');
  m.innerHTML='<section id="scr-results">'+
    (timeIsUp?'<div class="notice amber">&#9201; <b>Time is up.</b> The exam ended automatically. Exercises you never answered are excluded from the score.</div>':'')+
    '<p class="kicker">Attempt '+STATE.attempt+' \u00B7 '+esc(T.title)+'</p><h1>&#128202; Final results</h1>'+
    certHtml+
    '<div class="statgrid">'+
      '<div class="stat ok"><div class="n">'+full+'</div><div class="l">&#10003; Fully correct</div></div>'+
      '<div class="stat part"><div class="n">'+part+'</div><div class="l">&#9686; Partially correct</div></div>'+
      '<div class="stat bad"><div class="n">'+wrong+'</div><div class="l">&#10007; Incorrect</div></div>'+
      '<div class="stat skip"><div class="n">'+skippedN+'</div><div class="l">&#9888; Not answered (excluded)</div></div>'+
      '<div class="stat"><div class="n">'+ls.earned+' / '+ls.poss+'</div><div class="l">Points over answered exercises</div></div>'+
