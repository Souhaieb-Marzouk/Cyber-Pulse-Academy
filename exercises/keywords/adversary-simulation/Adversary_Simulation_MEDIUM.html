      '<div class="stat"><div class="n">'+percent+'%</div><div class="l">Final score (pass '+T.passMark+'%)</div></div>'+
    '</div>'+
    (Object.keys(tb).length?'<div class="card"><h3>&#129517; Per-theme breakdown (answered exercises only)</h3><table class="rpt"><tr><th>Theme</th><th>Answered</th><th>Points</th><th>Score</th></tr>'+tbHtml+'</table></div>':'')+
    '<div class="card"><h3>&#128209; Detailed report \u2014 every exercise</h3>'+reportHtml+'</div>'+
    '<div class="actions"><button class="btn primary" id="bretake" style="min-width:220px;min-height:50px">&#8635; Retake exam</button></div>'+
    '<p class="footer-note">On retake, the exercise order and every answer choice are shuffled again.</p>'+
  '</section>';
  reportScore();
  $('bretake').addEventListener('click',retake);
  showScreen('scr-results');
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function reportRow(id){
  var ex=exById(id), r=STATE.results[id];
  var head;
  if(!r||r.excluded){
    head='<div class="fb excluded"><div class="fh">&#9888; NOT ANSWERED \u2014 EXCLUDED <span class="pts">excluded from score</span></div><div class="fbb">'+fbBody(ex,null)+'</div></div>';
    return head;
  }
  return '<div class="card" style="padding:10px"><div class="small muted" style="margin:2px 4px 8px"><b>'+esc(ex.summary)+'</b> \u00B7 '+esc(ex.theme)+'</div>'+fbShell(ex,r)+'</div>';
}
function retake(){
  var un=STATE.username, att=STATE.attempt;
  STATE=newState(); STATE.attempt=att+1; STATE.username=un;
  renderIntro(); showScreen('scr-intro');
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}

/* ================= EXERCISE RENDER ================= */
var ANSWER_KIND_NOTE='<span class="multinote">&#10022; Multi-answer exercise \u2014 select all that apply. You can earn partial credit.</span>';

function renderExercise(ex){
  STATE.checked=false;
  var m=$('main');
  var html='<section id="scr-exam">'+
    '<div class="exhead"><span class="steptag">EXERCISE '+(STATE.order.indexOf(ex.id)+1)+' OF '+STATE.order.length+'</span>'+
    '<span class="badge" style="--sev:'+SEV.color+';--sevbg:'+SEV.bg+'">&#9733; '+esc(SEV.label)+'</span>'+
    '<span class="pill">'+esc(ex.theme)+'</span>'+(ex.kind==='multi'?'<span class="pill" style="border-color:var(--amber);color:var(--amber)">Multi-answer</span>':'<span class="pill">Single answer</span>')+'</div>'+
    '<div id="hintarea">'+(STATE.hintUsed[ex.id]?'<div class="hintbox">&#128161; <b>Hint:</b> '+esc(ex.hint)+' <span class="small muted">(This hint costs 10% of this exercise\u2019s points \u2014 the timer keeps running.)</span></div>':'')+'</div>'+
    (ex.timerSeconds?'<div><span class="exclock" id="exclock">&#9201; Exercise timer: <b id="exclockv">'+fmtClock(ex.timerSeconds)+'</b> \u2014 this exercise has its own reduced countdown. If it ends first, the exercise is marked \u201Cnot answered\u201D (excluded from the score) and the exam moves on.</span></div>':'')+
    scenarioBlock(ex)+
    '<div class="block question"><div class="bh"><span class="ic">&#10067;</span> QUESTION</div><div class="bb"><div class="qt">'+esc(ex.question)+'</div></div></div>'+
    '<div class="block answer"><div class="bh"><span class="ic">&#9997;</span> YOUR ANSWER</div><div class="bb" id="awidget"></div></div>'+
    '<div id="fbarea"></div>'+
    '<div class="actions" id="exactions">'+
      '<button class="btn good" id="bcheck" style="min-width:170px"'+(ex.type==='steps'?' disabled':'')+'>&#9989; Check</button>'+
      '<span class="small muted">Check grades your answer and pauses the timer while you read the feedback. Press Next to continue.</span>'+
    '</div>'+
  '</section>';
  m.innerHTML=html;
  RENDER[ex.type](ex);
  wireScenarioToggle(); wireViewer();
  $('bcheck').addEventListener('click',function(){ checkAnswer(ex); });
}

function scenarioBlock(ex){
  var sc=ex.scenario||{};
  var inner='';
  if(sc.text) inner+='<p>'+esc(sc.text)+'</p>';
  if(sc.panels) sc.panels.forEach(function(p,i){
    inner+='<div class="artefact '+(p.kind==='code'?'code':'')+'"><div class="ah">'+esc(p.label||('ARTEFACT '+(i+1)))+'</div><div class="ab">'+esc(p.body)+'</div></div>';
  });
  if(ex.viewer || (ex.data && ex.data.viewer)) inner+=viewerBlock(ex.viewer||ex.data.viewer);
  return '<div class="block scenario"><div class="bh"><span class="ic">&#128196;</span> SCENARIO <span class="sum" id="scsum">'+esc(ex.summary)+'</span><button class="tgl" id="sctgl" type="button" aria-expanded="true">&#9660; Collapse</button></div><div class="bb" id="scbody">'+inner+'</div></div>';
}
function viewerBlock(v){
  var lines=v.lines.map(function(l){ return '<div class="ln '+(l.cls||'info')+'" data-raw="'+esc(l.raw)+'">'+esc(l.raw)+'</div>'; }).join('');
  return '<div class="viewer"><div class="vh"><span class="mono small" style="color:var(--green)">&#9635; '+esc(v.title)+'</span>'+
    '<input type="text" id="vfilter" placeholder="filter (text match, case-insensitive)" aria-label="Filter log lines">'+
    '<span class="cnt" id="vcnt"></span></div><div class="loglines" id="vlines">'+lines+'</div></div>';
}
function wireViewer(){
  var inp=$('vfilter'); if(!inp) return;
  var cnt=$('vcnt'), rows=Array.prototype.slice.call(document.querySelectorAll('#vlines .ln'));
  function apply(){
    var q=inp.value.trim().toLowerCase(), n=0;
    rows.forEach(function(r){ var raw=r.getAttribute('data-raw'); var hit=!q||raw.toLowerCase().indexOf(q)>=0; r.style.display=hit?'':'none'; if(hit)n++; });
    cnt.textContent=n+' / '+rows.length+' lines';
  }
  inp.addEventListener('input',apply); apply();
}
function wireScenarioToggle(){
  var t=$('sctgl'); if(!t) return;
  t.addEventListener('click',function(){
    var b=$('scbody'); var open=b.style.display!=='none';
    b.style.display=open?'none':''; t.innerHTML=open?'&#9654; Expand':'&#9660; Collapse';
    t.setAttribute('aria-expanded',String(!open));
  });
}

/* ---------- renderers ---------- */
var RENDER={};
RENDER.mc=RENDER.multi=function(ex){
  var opts=shuffle(ex.data.options.map(function(o){ return {t:o.t,correct:!!o.correct,why:o.why}; }));
  /* labels are assigned AFTER the shuffle so they always read A., B., C., D. top to bottom */
  opts.forEach(function(o,i){ o.lab=String.fromCharCode(65+i); });
  var isMulti=ex.type==='multi';
  STATE.draft[ex.id]=STATE.draft[ex.id]||{sel:[]};
  var d=STATE.draft[ex.id];
  var html=(isMulti?ANSWER_KIND_NOTE:'')+'<div class="opts">';
  opts.forEach(function(o){
    html+='<button type="button" class="opt'+(d.sel.indexOf(o.t)>=0?' sel':'')+'" data-t="'+esc(o.t)+'" aria-pressed="'+(d.sel.indexOf(o.t)>=0)+'"><span class="lab">'+o.lab+'.</span><span>'+esc(o.t)+'</span></button>';
  });
  html+='</div>';
  $('awidget').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .opt'),function(b){
    b.addEventListener('click',function(){
      var t=b.getAttribute('data-t');
      if(isMulti){ var i=d.sel.indexOf(t); if(i>=0) d.sel.splice(i,1); else d.sel.push(t); }
      else { d.sel=[t]; }
      Array.prototype.forEach.call(document.querySelectorAll('#awidget .opt'),function(x){
        var on=d.sel.indexOf(x.getAttribute('data-t'))>=0;
        x.className='opt'+(on?' sel':''); x.setAttribute('aria-pressed',String(on));
      });
    });
  });
};
RENDER.match=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{place:{},selItem:null,bank:shuffle(ex.data.items.map(function(i){return i.id;}))};
  var items=ex.data.items;
  /* the bank keeps one stable shuffle per attempt; placed items just leave the bank */
  var bank=d.bank.filter(function(id){ return !d.place[id]; });
  var zHtml=ex.data.zones.map(function(z){
    var inside=items.filter(function(i){ return d.place[i.id]===z.id; }).map(function(i){ return '<div class="chip" data-zitem="'+i.id+'" title="Click to put it back">'+esc(byId(items,i.id).t)+'</div>'; }).join('');
    return '<div><div class="ztitle">&#128449; '+esc(z.label)+'</div><div class="zone" data-zone="'+esc(z.id)+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(z.label)+'">'+(inside||'<span class="small muted" style="opacity:.6">drop here</span>')+'</div></div>';
  }).join('');
  var bHtml=bank.map(function(id){ return '<div class="chip" draggable="true" data-item="'+id+'" tabindex="0" role="button">'+esc(byId(items,id).t)+'</div>'; }).join('');
  $('awidget').innerHTML=ANSWER_KIND_NOTE+'<div class="dnd"><div class="bank"><div class="ztitle">&#128230; Items \u2014 drag each one, or click it and then click a zone</div>'+(bHtml||'<span class="small muted">All items placed. Click a placed item to take it back.</span>')+'</div><div class="zones">'+zHtml+'</div></div>';
  function selItem(id){
    d.selItem=(d.selItem===id)?null:id;
    Array.prototype.forEach.call(document.querySelectorAll('#awidget .chip[data-item]'),function(c){ c.className='chip'+(c.getAttribute('data-item')===d.selItem?' sel':''); });
  }
  function place(itemId,zoneId){ if(!itemId) return; d.place[itemId]=zoneId; d.selItem=null; RENDER.match(ex); }
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .chip[data-item]'),function(c){
    var id=c.getAttribute('data-item');
    c.addEventListener('click',function(){ selItem(id); });
    c.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selItem(id); } });
    c.addEventListener('dragstart',function(ev){ ev.dataTransfer.setData('text/plain',id); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .zone'),function(z){
    var zid=z.getAttribute('data-zone');
    function doPlace(id){ place(id,zid); }
    z.addEventListener('dragover',function(e){ e.preventDefault(); z.classList.add('hot'); });
    z.addEventListener('dragleave',function(){ z.classList.remove('hot'); });
    z.addEventListener('drop',function(e){ e.preventDefault(); z.classList.remove('hot'); var id=e.dataTransfer.getData('text/plain')||d.selItem; doPlace(id); });
    z.addEventListener('click',function(){ if(d.selItem) doPlace(d.selItem); });
    z.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&d.selItem){ e.preventDefault(); doPlace(d.selItem); } });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .chip[data-zitem]'),function(c){
    c.addEventListener('click',function(e){ e.stopPropagation(); delete d.place[c.getAttribute('data-zitem')]; RENDER.match(ex); });
  });
};
RENDER.order=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{cur:shuffle(ex.data.correctIds)};
  var html=ANSWER_KIND_NOTE+'<p class="small muted">Drag rows, or use the &#9650;/&#9660; buttons, to put them in the right order (first = top).</p><div class="orderlist">';
  d.cur.forEach(function(id,i){
    html+='<div class="orow" draggable="true" data-oid="'+id+'"><span class="pos">'+(i+1)+'</span><span class="ot">'+esc(byId(ex.data.items,id).t)+'</span>'+
      '<span class="mv"><button type="button" data-up="'+id+'" aria-label="Move up">&#9650;</button><button type="button" data-down="'+id+'" aria-label="Move down">&#9660;</button></span></div>';
  });
  html+='</div>';
  $('awidget').innerHTML=html;
  Array.prototype.slice.call(document.querySelectorAll('#awidget .orow')).forEach(function(r){
    r.addEventListener('dragstart',function(ev){ r.classList.add('dragging'); ev.dataTransfer.setData('text/plain',r.getAttribute('data-oid')); });
    r.addEventListener('dragend',function(){ r.classList.remove('dragging'); });
    r.addEventListener('dragover',function(ev){ ev.preventDefault(); });
    r.addEventListener('drop',function(ev){
      ev.preventDefault();
      var src=ev.dataTransfer.getData('text/plain'), dst=r.getAttribute('data-oid');
      if(!src||src===dst) return;
      var si=d.cur.indexOf(src); if(si>=0) d.cur.splice(si,1);
      d.cur.splice(d.cur.indexOf(dst),0,src);
      RENDER.order(ex);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'),function(b){ b.addEventListener('click',function(){ moveRow(ex,d,b.getAttribute('data-up'),-1); }); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-down]'),function(b){ b.addEventListener('click',function(){ moveRow(ex,d,b.getAttribute('data-down'),1); }); });
};
function moveRow(ex,d,id,dir){
  var i=d.cur.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=d.cur.length) return;
  var t=d.cur[i]; d.cur[i]=d.cur[j]; d.cur[j]=t;
  RENDER.order(ex);
}
RENDER.blank=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{sel:{}};
  var html=ANSWER_KIND_NOTE+'<div class="blanks">';
  var parts=ex.data.text.split(/\{(\d+)\}/);
  for(var i=0;i<parts.length;i++){
    if(i%2===0){ html+=esc(parts[i]); }
    else {
      var si=parseInt(parts[i],10), slot=ex.data.slots[si];
      var opts=shuffle(slot.opts);
      html+='<select data-slot="'+si+'" aria-label="Blank '+(si+1)+'"><option value="">\u2014 choose \u2014</option>'+opts.map(function(o){ return '<option value="'+esc(o)+'"'+(d.sel[si]===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select>';
    }
  }
  html+='</div><div class="wordbank">&#128230; Every blank has its own short list of choices. Pick the best one for each.</div>';
  $('awidget').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#awidget select'),function(s){
    s.addEventListener('change',function(){ d.sel[s.getAttribute('data-slot')]=s.value; });
  });
};
RENDER.terminal=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{cmd:''};
  var dd=ex.data;
  var syn=dd.syntax?'<div class="syntax"><div class="st">&#128221; Syntax reminder \u2014 '+esc(dd.syntax.title)+'</div>'+dd.syntax.html+(dd.sampleOut?'<div class="st" style="margin-top:8px">&#128196; Expected output shape</div><div class="ansline" style="display:block">'+esc(dd.sampleOut)+'</div>':'')+'</div>':'';
  var welcome=(dd.welcome||[]).map(function(l){ return '<div class="oline">'+esc(l)+'</div>'; }).join('');
  $('awidget').innerHTML='<div class="termwrap">'+syn+
    '<div class="term"><div class="th"><span class="dot"></span><span class="dot y"></span><span class="dot g"></span><span style="margin-left:8px">'+esc(dd.title||'simulation shell')+'</span><span style="margin-left:auto">simulation only \u2014 nothing real runs</span></div>'+
    '<div class="sc" id="tsc">'+welcome+'</div>'+
    '<div class="inrow"><span class="pr">'+esc(dd.prompt)+'</span><input id="tcmd" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command" placeholder="type the command, then press Run"><button class="btn runb" id="trun">&#9654; Run</button></div></div>'+
    '<p class="small muted" style="margin:8px 0 0">Type the command in the shell. Press <b>Run</b> to see simulated output, then press <b>Check</b> to grade it.</p></div>';
  $('tcmd').value=d.cmd||'';
  function run(){
    var c=$('tcmd').value.trim();
    d.cmd=c;
    var sc=$('tsc');
    sc.innerHTML+='<div class="cline">'+esc(dd.prompt+' '+c)+'</div>';
    if(!c){ sc.innerHTML+='<div class="eline">(nothing typed)</div>'; }
    else { (dd.output||[]).forEach(function(l){ sc.innerHTML+='<div class="oline">'+esc(l)+'</div>'; }); }
    sc.scrollTop=sc.scrollHeight;
  }
  $('trun').addEventListener('click',run);
  $('tcmd').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); run(); } });
};
RENDER.spot=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{sel:[]};
  var multi=ex.data.lines.filter(function(l){return l.correct;}).length>1;
  var html=(multi?ANSWER_KIND_NOTE:'<span class="multinote">&#9786; Single answer \u2014 click the one problem line.</span>')+'<div class="codelines">';
  ex.data.lines.forEach(function(l,i){
    html+='<div class="cl'+(d.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'" tabindex="0" role="button" aria-pressed="'+(d.sel.indexOf(i)>=0)+'"><span class="no">'+(i+1)+'</span><span class="tx">'+esc(l.t)+'</span></div>';
  });
  html+='</div><p class="small muted">Click a line to select it. Click again to clear.</p>';
  $('awidget').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .cl'),function(r){
    function toggle(){
      var i=parseInt(r.getAttribute('data-li'),10);
      var k=d.sel.indexOf(i);
      if(multi){ if(k>=0) d.sel.splice(k,1); else d.sel.push(i); }
      else { d.sel=(k>=0)?[]:[i]; }
      Array.prototype.forEach.call(document.querySelectorAll('#awidget .cl'),function(x){
        var on=d.sel.indexOf(parseInt(x.getAttribute('data-li'),10))>=0;
        x.className='cl'+(on?' sel':''); x.setAttribute('aria-pressed',String(on));
      });
    }
    r.addEventListener('click',toggle);
    r.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
};
RENDER.triage=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{sel:{}};
  var html=ANSWER_KIND_NOTE+'<div class="queue">';
  ex.data.alerts.forEach(function(a,i){
    html+='<div class="alert"><div class="ahd"><span class="aid">ALERT '+(i+1)+' OF '+ex.data.alerts.length+'</span><span class="at">'+esc(a.title)+'</span></div><div class="ad">'+esc(a.t)+'</div><div class="segrow">';
    ex.data.actions.forEach(function(ac){
      html+='<button type="button" class="seg'+(d.sel[a.id]===ac.id?' on':'')+'" data-al="'+esc(a.id)+'" data-ac="'+esc(ac.id)+'">'+esc(ac.label)+'</button>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  $('awidget').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .seg'),function(b){
    b.addEventListener('click',function(){
      var al=b.getAttribute('data-al'), ac=b.getAttribute('data-ac');
      d.sel[al]=ac;
      Array.prototype.forEach.call(document.querySelectorAll('[data-al="'+al+'"]'),function(x){ x.className='seg'+(x.getAttribute('data-ac')===ac?' on':''); });
    });
  });
};
RENDER.steps=function(ex){
  var d=STATE.draft[ex.id]=STATE.draft[ex.id]||{step:0,sel:{},seenNotes:{}};
  var steps=ex.data.steps;
  var i=Math.min(d.step,steps.length-1), st=steps[i];
  var note=d.seenNotes[i]?'<div class="notice">&#128172; From your previous choice: '+esc(d.seenNotes[i])+'</div>':'';
  var scb=document.querySelector('.block.scenario .bb');
  if(scb){
    scb.innerHTML=(ex.scenario&&ex.scenario.text&&i===0?'<p>'+esc(ex.scenario.text)+'</p>':'')+note+(st.scenario?'<p>'+esc(st.scenario)+'</p>':'')+
      (ex.scenario&&ex.scenario.panels&&i===0?ex.scenario.panels.map(function(p,i2){ return '<div class="artefact '+(p.kind==='code'?'code':'')+'"><div class="ah">'+esc(p.label||('ARTEFACT '+(i2+1)))+'</div><div class="ab">'+esc(p.body)+'</div></div>'; }).join(''):'');
  }
  var head=document.querySelector('.block.scenario .bh .sum');
  if(head) head.textContent=ex.summary+' \u2014 step '+(i+1)+' of '+steps.length;
  var qt=document.querySelector('.block.question .qt');
  if(qt) qt.textContent=st.question;
  var opts=shuffle(st.options.map(function(o,k){return {t:o.t,correct:!!o.correct,note:o.note};}));
  var html='<span class="multinote">STEP '+(i+1)+' OF '+steps.length+' \u2014 every step is graded. Wrong steps cancel right steps.</span><div class="opts">';
  opts.forEach(function(o,k){
    html+='<button type="button" class="opt'+(d.sel[i]===o.t?' sel':'')+'" data-t="'+esc(o.t)+'" aria-pressed="'+(d.sel[i]===o.t)+'"><span class="lab">'+String.fromCharCode(65+k)+'.</span><span>'+esc(o.t)+'</span></button>';
  });
  html+='</div>';
  $('awidget').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#awidget .opt'),function(b){
    b.addEventListener('click',function(){
      var t=b.getAttribute('data-t');
      d.sel[i]=t;
      Array.prototype.forEach.call(document.querySelectorAll('#awidget .opt'),function(x){ x.className='opt'+(x.getAttribute('data-t')===t?' sel':''); });
      var chosen=null; st.options.forEach(function(o){ if(o.t===t) chosen=o; });
      if(chosen&&chosen.note) d.seenNotes[i+1]=chosen.note;
      Array.prototype.forEach.call(document.querySelectorAll('#awidget .opt'),function(x){ x.setAttribute('aria-pressed',String(x.getAttribute('data-t')===t)); });
      buildStepActions(ex,d,i,steps.length);
    });
  });
  /* returning to this exercise mid-flow: restore the correct action button for this step */
  if(d.sel[i]!=null){ buildStepActions(ex,d,i,steps.length); }
  else {
    /* no choice made on this step yet: reset the action row so no stale button survives a step change */
    $('exactions').innerHTML='<button class="btn good" id="bcheck" style="min-width:170px" disabled>&#9989; Check</button><span class="small muted">Choose an option'+(i<steps.length-1?' to reveal the next step.':', then Check grades every step and pauses the timer.')+'</span>';
  }
};
function buildStepActions(ex,d,i,total){
  if(i<total-1){
    $('exactions').innerHTML='<button class="btn primary" id="bstepnext" style="min-width:180px">Next step &#9654;</button><span class="small muted">You can still change your choice before moving on.</span>';
    $('bstepnext').addEventListener('click',function(){ d.step=i+1; RENDER.steps(ex); });
  } else {
    $('exactions').innerHTML='<button class="btn good" id="bcheck" style="min-width:170px">&#9989; Check</button><span class="small muted">Check grades every step and pauses the timer while you read the feedback.</span>';
    $('bcheck').addEventListener('click',function(){ checkAnswer(ex); });
  }
}

/* ================= GRADING ================= */
var GRADER={};
GRADER.mc=function(ex){
  var d=STATE.draft[ex.id]||{sel:[]};
  var correct=ex.data.options.filter(function(o){return o.correct;});
  var picked=ex.data.options.filter(function(o){return d.sel.indexOf(o.t)>=0;});
  var answerText=correct.map(function(o){return o.t;}).join(' | ');
  var studentText=picked.length?picked.map(function(o){return o.t;}).join(' | '):'(no answer)';
  if(!picked.length) return {T:1,C:0,W:0,right:[],wrong:[],missed:[{label:answerText,why:'This is the correct answer.'}],answerText:answerText,studentText:studentText};
  if(picked[0].correct) return {T:1,C:1,W:0,right:[{label:picked[0].t,why:picked[0].why}],wrong:[],missed:[],answerText:answerText,studentText:studentText};
  return {T:1,C:0,W:1,right:[],wrong:[{label:picked[0].t,why:picked[0].why}],missed:[{label:answerText,why:'This is the correct answer \u2014 you picked a different option.'}],answerText:answerText,studentText:studentText};
};
GRADER.multi=function(ex){
  var d=STATE.draft[ex.id]||{sel:[]};
  var correct=ex.data.options.filter(function(o){return o.correct;});
  var wrongOpts=ex.data.options.filter(function(o){return !o.correct;});
  var right=[],wrong=[],missed=[];
  correct.forEach(function(o){ if(d.sel.indexOf(o.t)>=0) right.push({label:o.t,why:o.why}); else missed.push({label:o.t,why:o.why}); });
  wrongOpts.forEach(function(o){ if(d.sel.indexOf(o.t)>=0) wrong.push({label:o.t,why:o.why}); });
  return {T:correct.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:correct.map(function(o){return o.t;}).join(' | '),
    studentText:d.sel.length?d.sel.join(' | '):'(no answer)'};
};
GRADER.match=function(ex){
  var d=STATE.draft[ex.id]||{place:{}};
  var right=[],wrong=[],missed=[];
  ex.data.items.forEach(function(it){
    var z=byId(ex.data.zones,it.zone);
    var placed=d.place[it.id];
    if(!placed) missed.push({label:it.t,why:'It belongs in \u201C'+z.label+'\u201D. '+it.why});
    else if(placed===it.zone) right.push({label:it.t+' \u2192 '+z.label,why:it.why});
    else { var pz=byId(ex.data.zones,placed); wrong.push({label:it.t+' \u2192 '+(pz?pz.label:'?'),why:'Correct zone: \u201C'+z.label+'\u201D. '+it.why}); }
  });
  return {T:ex.data.items.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.items.map(function(i){ return i.t+' \u2192 '+byId(ex.data.zones,i.zone).label; }).join('  |  '),
    studentText:Object.keys(d.place).length?Object.keys(d.place).map(function(k){ return byId(ex.data.items,k).t+' \u2192 '+((byId(ex.data.zones,d.place[k])||{}).label||'?'); }).join('  |  '):'(nothing placed)'};
};
GRADER.order=function(ex){
  var d=STATE.draft[ex.id]||{cur:ex.data.correctIds.slice()};
  var right=[],wrong=[];
  d.cur.forEach(function(id,i){
    var ok=ex.data.correctIds[i]===id;
    (ok?right:wrong).push({label:'Position '+(i+1)+': '+byId(ex.data.items,id).t,why:ok?'Right call for this position.':'Expected here: '+byId(ex.data.items,ex.data.correctIds[i]).t});
  });
  return {T:d.cur.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:[],
    answerText:ex.data.correctIds.map(function(id,i){ return (i+1)+'. '+byId(ex.data.items,id).t; }).join('   '),
    studentText:d.cur.map(function(id,i){ return (i+1)+'. '+byId(ex.data.items,id).t; }).join('   ')};
};
GRADER.blank=function(ex){
  var d=STATE.draft[ex.id]||{sel:{}};
  var right=[],wrong=[],missed=[];
  ex.data.slots.forEach(function(s,i){
    var v=d.sel[i];
    if(!v) missed.push({label:'Blank '+(i+1)+': '+s.correct,why:s.why});
    else if(v===s.correct) right.push({label:'Blank '+(i+1)+': '+v,why:s.why});
    else wrong.push({label:'Blank '+(i+1)+': \u201C'+v+'\u201D',why:'Correct: \u201C'+s.correct+'\u201D. '+s.why});
  });
  return {T:ex.data.slots.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.slots.map(function(s,i){ return 'Blank '+(i+1)+': '+s.correct; }).join('  |  '),
    studentText:ex.data.slots.map(function(s,i){ return 'Blank '+(i+1)+': '+(d.sel[i]||'\u2014'); }).join('  |  ')};
};
function normCmd(s){ return String(s||'').trim().replace(/\s+/g,' '); }
GRADER.terminal=function(ex){
  var d=STATE.draft[ex.id]||{cmd:''};
  var cmd=normCmd(d.cmd);
  var right=[],wrong=[],missed=[];
  var Tn=ex.data.elements.length;
  if(!cmd){ return {T:Tn,C:0,W:0,right:[],wrong:[],missed:ex.data.elements.map(function(e){return {label:e.label,why:e.why};}),answerText:ex.data.expected,studentText:'(no command typed)',canonical:true}; }
  ex.data.elements.forEach(function(e){
    var re=new RegExp(e.re,'i');
    if(re.test(cmd)) right.push({label:e.label,why:e.why});
    else missed.push({label:e.label,why:e.why});
  });
  (ex.data.forbidden||[]).forEach(function(f){
    var re=new RegExp(f.re,'i');
    if(re.test(cmd)) wrong.push({label:f.label,why:f.why+(f.danger?' \u26A0 DANGEROUS: in a real case this would change state or destroy evidence.':'')});
  });
  return {T:Tn,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.expected,studentText:cmd,canonical:true};
};
GRADER.spot=function(ex){
  var d=STATE.draft[ex.id]||{sel:[]};
  var right=[],wrong=[],missed=[];
  ex.data.lines.forEach(function(l,i){
    var sel=d.sel.indexOf(i)>=0;
    if(l.correct&&sel) right.push({label:'Line '+(i+1),why:l.why});
    else if(l.correct&&!sel) missed.push({label:'Line '+(i+1),why:l.why});
    else if(!l.correct&&sel) wrong.push({label:'Line '+(i+1),why:l.why});
  });
  return {T:ex.data.lines.filter(function(l){return l.correct;}).length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.lines.map(function(l,i){ return l.correct?('Line '+(i+1)+' \u2014 '+l.t):null; }).filter(Boolean).join('  |  '),
    studentText:d.sel.length?d.sel.map(function(i){ return 'Line '+(i+1); }).join('  |  '):'(no line selected)'};
};
GRADER.triage=function(ex){
  var d=STATE.draft[ex.id]||{sel:{}};
  var right=[],wrong=[],missed=[];
  ex.data.alerts.forEach(function(a){
    var act=byId(ex.data.actions,a.correct);
    var v=d.sel[a.id];
    if(!v) missed.push({label:a.title,why:'Correct call: \u201C'+act.label+'\u201D. '+a.why});
    else if(v===a.correct) right.push({label:a.title+' \u2014 '+act.label,why:a.why});
    else { var picked=byId(ex.data.actions,v); wrong.push({label:a.title+' \u2014 you chose \u201C'+picked.label+'\u201D',why:'Correct call: \u201C'+act.label+'\u201D. '+a.why}); }
  });
  return {T:ex.data.alerts.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.alerts.map(function(a){ return a.title+' \u2192 '+byId(ex.data.actions,a.correct).label; }).join('  |  '),
    studentText:ex.data.alerts.map(function(a){ return a.title+' \u2192 '+((byId(ex.data.actions,d.sel[a.id])||{}).label||'\u2014'); }).join('  |  ')};
};
GRADER.steps=function(ex){
  var d=STATE.draft[ex.id]||{sel:{}};
  var right=[],wrong=[],missed=[];
  ex.data.steps.forEach(function(st,i){
    var v=d.sel[i];
    var correct=null; st.options.forEach(function(o){ if(o.correct) correct=o; });
    if(!v) missed.push({label:'Step '+(i+1),why:'Correct choice: \u201C'+correct.t+'\u201D. '+st.why});
    else if(v===correct.t) right.push({label:'Step '+(i+1),why:st.why});
    else wrong.push({label:'Step '+(i+1)+': \u201C'+v+'\u201D',why:'Correct choice: \u201C'+correct.t+'\u201D. '+st.why});
  });
  return {T:ex.data.steps.length,C:right.length,W:wrong.length,right:right,wrong:wrong,missed:missed,
    answerText:ex.data.steps.map(function(st,i){ return 'Step '+(i+1)+': '+st.options.filter(function(o){return o.correct;})[0].t; }).join('  |  '),
    studentText:ex.data.steps.map(function(st,i){ return 'Step '+(i+1)+': '+(d.sel[i]||'\u2014'); }).join('  |  ')};
};

/* ================= CHECK + FEEDBACK ================= */
function checkAnswer(ex){
  if(STATE.checked) return;
  var g=GRADER[ex.type](ex);
  var pts=Math.floor(Math.max(0,g.C-g.W)/Math.max(1,g.T)*100);
  var hintApplied=!!STATE.hintUsed[ex.id];
  if(hintApplied) pts=Math.floor(pts*0.9);
  var status=pts>=100?'correct':(pts>0?'partial':'wrong');
  STATE.results[ex.id]={earned:pts,status:status,hintApplied:hintApplied,answered:true,grade:g};
  STATE.checked=true;
  stopExerciseTimer();   /* graded \u2014 the reduced exercise timer can no longer exclude it */
  setAutoPause(true);       /* auto-pause on Check: exercise and feedback stay readable */
  $('bcheck').disabled=true;
  $('exactions').innerHTML='<button class="btn primary" id="bnext" style="min-width:170px">Next &#9654;</button><span class="small muted">The timer is paused while you read this. Press Next to continue.</span>';
  $('bnext').addEventListener('click',function(){ setAutoPause(false); goNext(false); });
  $('fbarea').innerHTML=fbShell(ex,STATE.results[ex.id]);
  renderHeader();
  var fb=$('fbarea'); if(fb) fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function fbShell(ex,r){
  var cls=r.status==='correct'?'correct':(r.status==='partial'?'partial':'wrong');
  var icon=r.status==='correct'?'\u2713 CORRECT':(r.status==='partial'?'\u25D0 PARTIALLY CORRECT':'\u2717 INCORRECT');
  return '<div class="fb '+cls+'"><div class="fh">'+icon+'<span class="pts">'+r.earned+' / 100 points'+(r.hintApplied?' \u00B7 hint \u221210%':'')+'</span></div><div class="fbb">'+fbBody(ex,r)+'</div></div>';
}
function fbBody(ex,r){
  var g=(r&&r.answered)?r.grade:null, html='';
  if(r&&r.answered){
    html+='<p>'+multiSummaryLine(r,g)+'</p>';
    if(g.canonical){
      html+='<div class="fbsub">&#128221; Canonical command (copyable)</div><div class="ansline"><span>'+esc(g.answerText)+'</span><button class="copyb" data-copy="'+esc(g.answerText)+'">Copy</button></div>';
      if(ex.data.parts) html+='<p class="small muted">'+esc(ex.data.parts)+'</p>';
    } else {
      html+='<div class="fbsub">&#9989; Correct answer</div><div class="ansline" style="display:block">'+esc(g.answerText)+'</div>';
    }
    if(r.status!=='correct'){
      if(g.right&&g.right.length&&ex.kind==='multi'){ html+='<div class="fbsub ok">What you got right</div>'+g.right.map(function(i){ return '<div class="fbitem ok"><b>'+esc(i.label)+'</b> \u2014 '+esc(i.why)+'</div>'; }).join(''); }
      if(g.wrong&&g.wrong.length){ html+='<div class="fbsub no">What you got wrong</div>'+g.wrong.map(function(i){ return '<div class="fbitem no"><b>'+esc(i.label)+'</b> \u2014 '+esc(i.why)+'</div>'; }).join(''); }
      if(g.missed&&g.missed.length&&(ex.kind==='multi')){ html+='<div class="fbsub miss">What you missed</div>'+g.missed.map(function(i){ return '<div class="fbitem miss"><b>'+esc(i.label)+'</b> \u2014 '+esc(i.why)+'</div>'; }).join(''); }
    } else if(ex.kind==='multi'&&g.right&&g.right.length>1){
      html+='<div class="fbsub ok">Every correct part you found</div>'+g.right.map(function(i){ return '<div class="fbitem ok"><b>'+esc(i.label)+'</b> \u2014 '+esc(i.why)+'</div>'; }).join('');
    }
  } else {
    html+='<p class="muted">You never answered this exercise, so here is what the correct answer was:</p>';
    if(ex.type==='terminal'){
      html+='<div class="fbsub">&#128221; Canonical command (copyable)</div><div class="ansline"><span>'+esc(ex.data.expected)+'</span><button class="copyb" data-copy="'+esc(ex.data.expected)+'">Copy</button></div>';
      if(ex.data.parts) html+='<p class="small muted">'+esc(ex.data.parts)+'</p>';
    } else {
      var g0=GRADER[ex.type]({id:ex.id,kind:ex.kind,type:ex.type,data:ex.data});
      html+='<div class="fbsub">&#9989; Correct answer</div><div class="ansline" style="display:block">'+esc(g0.answerText)+'</div>';
    }
  }
  html+='<div class="fbsub">&#128218; Why</div><p>'+esc(ex.expl.why)+'</p>';
  if(r&&r.answered&&r.status==='partial') html+='<p class="encourage">&#128170; Partial credit is intentional. In real cybersecurity work, getting some things right and some wrong is normal \u2014 the exam rewards the parts you got right.</p>';
  html+='<div class="study">&#128300; <b>What to study next:</b> '+esc(ex.expl.study)+'</div>';
  return html;
}
function multiSummaryLine(r,g){
  if(r.status==='correct') return '<b>Perfect.</b> You earned '+r.earned+' out of 100 points on this exercise.';
  if(r.status==='partial') return '<b>You earned '+r.earned+' out of 100 points on this exercise.</b> '+(g.W>0?'Some picks were right, and each wrong pick cancelled one right pick.':'Some correct parts were missing.');
  if(g.studentText==='(no answer)'||g.studentText==='(no command typed)'||g.studentText==='(nothing placed)'||g.studentText==='(no line selected)') return 'You did not answer, so this scored 0 points.';
  return 'This answer scored 0 points. Read below to see why, then use the study pointer.';
}

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
