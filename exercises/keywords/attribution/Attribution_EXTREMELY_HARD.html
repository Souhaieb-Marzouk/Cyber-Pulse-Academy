window.__CFG={"topicId": "attribution", "batch": 4, "title": "Attribution — EXTREMELY HARD", "diff": "extremely-hard", "sevLabel": "EXTREMELY HARD", "sevClass": "xhard", "minutes": 105, "passMark": 70, "introKw": "<p><b>Attribution</b> means answering one hard question after a cyber attack: <b>who did this?</b> It is like detective work. You collect small clues — an IP address, a domain name, a file hash, the way the attacker moves — and you compare them with attacks that are already known. When many clues point to the same group, you can say: <i>this attack looks like the work of that group</i>.</p><p>You will meet attribution in many jobs. <b>SOC analysts</b> meet it first: they triage alerts and add context to them. <b>Incident responders</b> use attribution during an attack to predict what the attacker may do next. <b>Threat intelligence analysts</b> write group profiles and track names and aliases. <b>GRC and risk teams</b> use intelligence reports to decide which threats matter most for the business. <b>Security engineers</b> turn attacker habits into detections. <b>Red teams</b> study attribution for the opposite reason: they learn which habits give them away.</p><p>The work uses well-known tools and documents: <b>vendor threat reports</b>, <b>MITRE ATT&amp;CK</b> group pages, intel platforms such as <b>MISP</b> or <b>OpenCTI</b>, and simple lookups such as <b>WHOIS</b> (who registered a domain) and <b>passive DNS</b> (which addresses a domain used in the past). Analysts sort clues into <b>indicators of compromise (IOCs)</b> — hard facts like a hash or an address — and <b>TTPs</b> — the habits and methods of a group. Frameworks such as the <b>Diamond Model</b> organise the picture: adversary, capability, infrastructure, victim. The <b>kill chain</b> shows where the attacker is in their journey.</p><p>Real attribution work is careful and humble. Analysts never say <i>proven</i> when they mean <i>likely</i>. They write a <b>confidence level</b> (low, moderate, high) and list the evidence behind it. They know the traps: <b>false flags</b> (attackers pretend to be someone else), <b>shared infrastructure</b> (many unrelated users on the same server or cloud IP), and <b>shared tools</b> (the same hacking tool bought by many groups). One clue is never enough.</p><p>Attribution matters because knowing the adversary helps you: predict their next move, prioritise your defenses, brief leadership with the right words, and — sometimes — support legal steps such as indictments or sanctions. In this exam you will practise all of this: reading artefacts, weighing evidence, using the right words, and avoiding the classic mistakes.</p>", "introSev": "Exercises chain <b>three or more concepts</b> with conflicting signals, realistic noise, and missing information. You will make senior-level calls under pressure — including calls with real business or legal cost, and calls where the right answer is to do nothing yet."};
window.__EX=[{"id": "x1", "theme": "Operations & Politics", "kind": "multi", "widget": "qcm", "title": "Five artefacts, two stories", "summary": "The Meridian breach — planted artefacts against operational reality.", "scenario": "<p>Saturday, 02:10. Meridian Shipping's IR lead assembles five artefacts on cluster <b>ORCHID</b>. Two signals contradict. The CISO wants a story in ten minutes; counsel wants defensible language only.</p>", "arts": [{"label": "Incident timeline (condensed)", "body": "D+0 21:44 initial access via supplier VPN\nD+2 03:10 credential staging\nD+9 discovery — data staged on a clean jump host", "code": false}, {"label": "Proxy excerpt", "body": "2026-05-16T01:57:12Z JW-3 GET hxxps://tidepool-node[.]example/kx allowed 91[.]245[.]77[.]33\n2026-05-16T02:03:47Z JW-3 POST hxxps://arch-node[.]example/up allowed 91[.]245[.]77[.]41", "code": true}, {"label": "WHOIS — tidepool-node[.]example", "body": "Registrar: Starside Registrar Ltd\nCreation: 2026-05-02T11:20:07Z\nRegistrant: REDACTED FOR PRIVACY\nName servers: ns1.meridian-dns[.]example (typo-squat of victim brand)", "code": true}, {"label": "Malware strings (strings -n 8)", "body": "// Kommento dlya vvoda dannykh  (transliterated Russian comment)\nBuildTZ=Europe/Moscow\nlibcurl/7.61.1 (generic)\nno other language artefacts; codebase otherwise English", "code": true}, {"label": "Lineage & targeting note", "body": "Loader reuses a builder publicly leaked 14 months ago (shared by many crews after leak).\nTargeting: exclusively South-China-Sea maritime route documents — collection requirement consistent with a state customer, not with criminal monetisation.\nNo ransom note, no monetisation attempt, dwell 9 days quiet.", "code": false}], "question": "Which judgements are best supported by the five artefacts?", "opts": ["Strings and the Moscow timestamp are plantable on a leaked builder — weight behaviour instead", "The Cyrillic string plus the Moscow timestamp establish a Russian state actor beyond doubt", "The leaked-builder reuse alone identifies that leak's original author crew", "Maritime targeting with no monetisation supports a collection motive over a criminal one", "Vendor consensus is the only acceptable basis for internal judgement in this case"], "correct": [0, 3], "whyOpts": {"1": "Both artefacts ride on a publicly leaked builder — the cheapest possible false flag.", "2": "Leak reuse identifies the tool's era, not its current user.", "4": "Internal analysis must stand on its own evidence; consensus informs, it does not replace."}, "hint": "One artefact was written by a build machine the attacker controls. Remember whose story each artefact tells.", "explain": "<p>The contradictions resolve by <b>cost-to-fake</b>: strings and build timezone are trivially planted on a leaked builder, while <b>nine days of quiet, no monetisation, and narrow maritime targeting</b> are behaviours that cost the operator real money to maintain — they carry the assessment. This is the scenario's two-signal conflict: planted identity vs lived behaviour; lived behaviour wins.</p>", "study": "Exercise h4's three evidence grades — planted artefacts are the definition of weak."}, {"id": "x2", "theme": "Technical Evidence", "kind": "multi", "widget": "term", "title": "Terminal: image first — and image it correctly", "summary": "Legal hold on a live server; one command can destroy the case.", "scenario": "<p>Legal hold is active on MER-DB-1 (live, compromised). The partition to preserve is <b>/dev/sda1</b>; the clean acquisition USB is mounted at <b>/mnt/usb</b>. Objective, in counsel's words: <i>“We need evidence that will survive scrutiny — the original must not change by one byte.”</i> The box has standard tools; the acquisition tool is <b>dd</b>. This task has its own reduced timer.</p>", "question": "Type the dd command that images the original partition to a file on the USB drive without modifying the source.", "term": {"prompt": "root@MER-DB-1:~#", "goalNote": "Goal: read FROM the original (if=) and write TO the USB image (of=). Which value sits behind if= and which behind of= is everything.", "syntax": null, "sample": null, "canonical": "dd if=/dev/sda1 of=/mnt/usb/mer-db1.img bs=4M conv=noerror,sync", "parts": ["dd — raw copy tool; it does exactly what you tell it, including destroying disks", "if=/dev/sda1 — the INPUT: the original evidence partition, opened read-only by dd", "of=/mnt/usb/mer-db1.img — the OUTPUT: the image file on the clean USB", "bs=4M — block size for a faster, steadier copy", "conv=noerror,sync — keep going past read errors and pad them, so the image stays forensically sound"], "elements": [{"re": "\\bdd\\b", "label": "Uses dd (the available acquisition tool)"}, {"re": "if=/dev/sda1", "label": "Reads FROM the original partition (if=/dev/sda1)"}, {"re": "of=/mnt/usb", "label": "Writes TO the USB image (of=/mnt/usb/…)"}, {"re": "of=/dev/sd", "label": "Writes anywhere on /dev — that overwrites evidence", "bad": true, "why": "With dd, of= is the DESTINATION. Pointing it at a /dev device writes raw bytes onto that disk — under a legal hold this destroys the case."}], "respond": [{"re": "^dd\\b(?=.*if=/dev/sda1)(?=.*of=/mnt/usb)", "out": "41943040 bytes (42 MB) copied, 3.2 s, 13.1 MB/s\n(simulation) image written to /mnt/usb/mer-db1.img — source untouched, hash later for chain of custody"}, {"re": "of=/dev/sd", "out": "dd: opening '/dev/sd…': SIMULATION HALTED — that direction writes TO the original disk and would destroy the evidence"}, {"re": "^dd\\b", "out": "dd: missing operand — this simulation expects if= (source) and of= (destination)"}], "badOut": "bash: command not found — this box has: dd, sha256sum, sync, mount", "warn": "Reversing the two arguments (of= the original, if= the image) would overwrite the evidence with empty data. In real acquisitions this exact mistake has destroyed cases — check if=/of before pressing Enter, always.", "timeLimit": 300}, "hint": "if= is the source, of= is the destination. In this scenario, exactly one of those paths may be /dev.", "explain": "<p>The canonical command reads <b>if=/dev/sda1</b> (the original, untouched) and writes <b>of=/mnt/usb/mer-db1.img</b>. <code>conv=noerror,sync</code> keeps the image usable despite bad sectors. This was the exercise's safe-vs-destructive pair: same tool, one swapped argument between preservation and destruction — the sequence (image before any change) is what survives legal scrutiny.</p>", "study": "Intro screen, “Operations &amp; Politics”: evidence preservation and chain of custody."}, {"id": "x3", "theme": "Operations & Politics", "kind": "multi", "widget": "steps", "title": "Quiet adversary, full ward, no playbook", "summary": "Four chained decisions, each with a real cost.", "scenario": "<p>St. Alder Hospital group. An espionage-pattern actor has been present for weeks — quiet collection of research data, no encryption. Legal hold is active. One option on the table: shutting down the imaging department during a research trial. Every step has a cost; two have unacceptable ones.</p>", "question": "Answer all four steps.", "steps": [{"q": "STEP 1 — The actor is present and quiet. First move?", "opts": ["Plan covert containment with counsel — schedule, evidence, fallbacks first", "Isolate every endpoint right now; discovery is complete anyway here", "Document only — any containment risks tipping off the quiet actor"], "correct": 0, "why": "Covert planning preserves evidence and patient services; mass isolation mid-trial is an unacceptable clinical cost with no evidence gain; watching forever is also a decision, and a bad one."}, {"q": "STEP 2 — Containment window approved. What does isolation look like?", "opts": ["Segment the affected research VLANs during the window, with clinical fallbacks", "Power off the entire hospital group immediately, no exceptions made", "Remove the compromised accounts only, and change nothing else at all"], "correct": 0, "why": "Accepting a bounded, planned cost (segmentation during maintenance) is the senior call; a total shutdown is a cost without proportion; account changes alone leave the foothold."}, {"q": "STEP 3 — Before the window, what must be captured?", "opts": ["Memory and connection state from key hosts, then images — volatile first", "Nothing whatsoever — the legal hold means no system may be touched at all", "Only a few screenshots of the alerts for the board's slide deck"], "correct": 0, "why": "A legal hold freezes deletion duties, not acquisition duties: volatile-first capture is what makes the hold defensible."}, {"q": "STEP 4 — Where does attribution sit in this sequence?", "opts": ["Feed TTPs to intel and referral — attribution gates nothing operational", "Hold every containment action until a group name is fully confirmed", "Announce preliminary attribution publicly, to pressure the actor out"], "correct": 0, "why": "Attribution informs negotiation posture and referral — it is never the gate for clinical safety decisions; waiting on a name or pressuring via press both cost more than they return."}], "hint": "Each step has one answer that accepts a cost knowingly and one that pays without asking. Clinical safety sets the floor; evidence sets the order.", "explain": "<p>The chain: <b>plan covertly → segment with bounded cost → capture volatile-first → let attribution inform but never gate</b>. Every wrong option pays an unbudgeted cost: clinical shutdown, evidence destroyed by delay, or decisions hostage to a name. Senior incident response is mostly the discipline of choosing which cost to accept, on purpose, in writing.</p>", "study": "Exercise x6 orders the legal-hold sequence; exercise x15 adds the false-flag turn."}, {"id": "x4", "theme": "Operations & Politics", "kind": "single", "widget": "qcm", "title": "The best practice that must wait", "summary": "Under legal hold, a golden rule becomes a case-killer.", "scenario": "<p>Legal hold active on Meridian. IR runbooks say: patch fast, reimage compromised hosts within 24 hours. Counsel interrupts the patch window.</p>", "question": "Which normally-correct best practice must be delayed here?", "opts": ["Reimaging compromised hosts on the 24-hour schedule", "Capturing volatile memory before any change at all", "Hashing images and logging the chain of custody"], "correct": [0], "whyOpts": {"1": "Volatile-first capture is exactly what the hold requires — keep it.", "2": "Hashing and custody records are the hold's best friends — keep them."}, "hint": "The hold's whole purpose is the artefacts. Which practice destroys artefacts?", "explain": "<p>Reimaging is best practice <i>for availability</i> — and evidence <i>destruction</i> under a legal hold. The hold reorders priorities: preserve, capture, hash, <i>then</i> rebuild. Knowing when a general best practice conflicts with a specific legal constraint is a senior, not technical, judgement.</p>", "study": "Exercise x2's acquisition command is the practice that replaces reimaging tonight."}, {"id": "x5", "theme": "Analytical Frameworks", "kind": "multi", "widget": "drag", "title": "Map eight facts onto four hypotheses", "summary": "ACH for ORCHID — including the facts that fight each other.", "scenario": "<p>Four hypotheses on the table: <b>H1</b> state-aligned collection, <b>H2</b> criminal crew, <b>H3</b> insider, <b>H4</b> false flag by a criminal crew mimicking a state actor. Eight facts; several fit more than one story — place each where it is the <i>strongest</i> signal.</p>", "question": "Place each fact under the hypothesis it most strongly supports.", "cats": ["H1 — state-aligned", "H2 — criminal crew", "H3 — insider", "H4 — false flag"], "items": [{"t": "nine days of quiet collection, zero noise", "c": 0, "w": "Long, quiet dwell matches state collection priorities; criminals usually monetise faster."}, {"t": "targeting matches a national maritime collection requirement", "c": 0, "w": "Narrow strategic targeting is the classic H1 signature."}, {"t": "ransom-note variant used by a known affiliate programme", "c": 1, "w": "A real affiliate ransom note is direct criminal evidence — though see H4."}, {"t": "crypto wallet sweep 40 minutes after access", "c": 1, "w": "Immediate monetisation is criminal behaviour at criminal speed."}, {"t": "credentials used only from the HQ VPN range", "c": 2, "w": "Access that only works from inside the HQ range points to someone who already has inside access."}, {"t": "knowledge of internal project code names never written to any repo", "c": 2, "w": "Unwritten project knowledge is hard to explain without insider participation."}, {"t": "loud, stereotyped 'Russian' strings with translation-software grammar", "c": 3, "w": "Stereotyped identity artefacts with machine-translation seams are the false-flag signature."}, {"t": "state-style targeting AND criminal ransom note in the same case", "c": 3, "w": "The combination is internally inconsistent — the classic reason to raise H4."}], "hint": "Ask what each fact is worth if the OTHER hypotheses were true. The inconsistent pair belongs to the hypothesis that explains inconsistency.", "explain": "<p>ACH in one grid: quiet dwell and strategic targeting → <b>H1</b>; ransom and monetisation speed → <b>H2</b>; HQ-only access and unwritten knowledge → <b>H3</b>; and the <b>internally inconsistent pair</b> — state-style targeting plus a criminal note — is precisely what H4 exists to explain. Facts that fit two stories go to the story where they fit <i>best</i>, and inconsistencies are evidence too.</p>", "study": "Exercise h4 graded single artefacts; ACH is where grades become a verdict."}, {"id": "x6", "theme": "Operations & Politics", "kind": "multi", "widget": "order", "title": "Order the legal-hold response", "summary": "Five actions, one correct sequence.", "scenario": "<p>Legal hold is active. Five actions are approved; sequence is everything — two of them destroy evidence if done first.</p>", "question": "Put the five actions in the correct order.", "ord": ["Confirm the legal hold scope with counsel", "Capture volatile evidence: memory and live connections", "Image disks with hashing for chain of custody", "Contain with the least business-damaging method", "Eradicate, recover, and restore services"], "hint": "Counsel first, volatile before static, containment only after capture, business recovery last.", "explain": "<p>The order encodes two rules. <b>Volatility</b>: memory and connections die first, so they are captured first. <b>Custody</b>: nothing changes until hashed images exist. Confirming scope with counsel is step one because it defines what may be touched at all — and eradication is last because everything before it makes the case.</p>", "study": "Exercise x2 executes step two; exercise x4 shows what breaks this order."}, {"id": "x7", "theme": "Technical Evidence", "kind": "multi", "widget": "qcm", "title": "Noisy night, missing forty minutes", "summary": "Twelve lines, one rotation gap — select only what survives.", "scenario": "<p>Meridian edge logs for the night. Health checks and backup noise included. The log rotation gap 02:00–02:40 is confirmed by the logging daemon's own records. Filter freely.</p>", "log": {"title": "edge-night.log — Meridian, condensed", "lines": ["2026-05-16T00:41:03Z LB-1 GET /health 200 ok 127[.]0[.]0[.]1 (health check)", "2026-05-16T01:03:44Z BK-2 backup job rsync to vault complete ok (routine)", "2026-05-16T01:44:19Z JW-3 AUTH svc_stage success from 10[.]12[.]4[.]77 (service account, unusual source host)", "2026-05-16T01:52:36Z JW-3 GET hxxps://tidepool-node[.]example/kx allowed 91[.]245[.]77[.]33", "2026-05-16T01:58:11Z JW-3 GET hxxps://arch-node[.]example/up allowed 91[.]245[.]77[.]41", "2026-05-16T02:00:00Z -- log rotation begins (gap 02:00-02:40 confirmed by daemon) --", "2026-05-16T02:40:02Z LB-1 GET /health 200 ok 127[.]0[.]0[.]1 (health check)", "2026-05-16T02:55:47Z JW-3 GET hxxps://arch-node[.]example/up allowed 91[.]245[.]77[.]41", "2026-05-16T03:12:30Z BK-2 vault verify ok (routine)", "2026-05-16T03:30:15Z JW-3 AUTH svc_stage success from 10[.]12[.]4[.]77"]}, "question": "Select every conclusion that survives the missing forty minutes.", "opts": ["Outbound TLS to the tidepool/arch-node cluster recurs around svc_stage activity", "Whether exfiltration completed during the gap is unknown and must stay unknown", "The service account svc_stage was used from an unusual source host, twice", "The backup job's clean success clearly indicates attacker participation in it", "The /health 200 responses prove C2 traffic towards the load balancer service", "The rotation gap proves the logging daemon was attacked first that night"], "correct": [0, 1, 2], "whyOpts": {"3": "The backup job is routine noise — reading attacker intent into verified-routine entries is the classic noise trap.", "4": "Loopback health checks are infrastructure self-talk, not C2.", "5": "A confirmed rotation gap proves only that records are missing — not that the logger was attacked."}, "hint": "Two conclusions live inside the gap — one of them is 'we do not know'. The other two traps are verified-routine lines pretending to be signals.", "explain": "<p>Three conclusions survive: the <b>recurrence cluster</b> around svc_stage, the <b>honest unknown</b> about the gap, and the <b>unusual source host</b> seen twice. The traps are realistic noise — routine backups and loopback health checks — dressed as signals. Stating “unknown” for the gap is not weakness; it is the requirement that makes the rest of the assessment credible.</p>", "study": "Exercise h1 sorted supported from tempting conclusions with full data; here incomplete data adds the 'unknown' duty."}, {"id": "x8", "theme": "Operations & Politics", "kind": "single", "widget": "qcm", "title": "Ten minutes, two gigabytes, one CTO", "summary": "The most senior call of the night: decide, do not accuse.", "scenario": "<p>02:47. DLP shows 2 GB to a personal cloud account from the CTO's account. The CTO is confirmed mid-flight over the Atlantic. The exfil session may still be live. Legal hold applies. The CISO needs a decision in ten minutes.</p>", "question": "What is the correct call?", "opts": ["Treat the account as compromised: preserve evidence, kill the session, accuse no one", "Suspend and publicly accuse the CTO — the account and the person are the same thing here", "Silently wipe the mailbox and the endpoint to stop any further leak tonight", "Log it and review on Monday — the mid-flight trip proves innocence anyway"], "correct": [0], "whyOpts": {"1": "An account is not a person: the flight may even confirm account theft. Accusation without investigation is both unfair and legally reckless.", "2": "Wiping destroys the evidence the hold exists to keep and leaves the real actor's access intact.", "3": "Two gigabytes already left; 'review Monday' is how weeks of quiet dwell begin."}, "sim": {"0": "Exfil session killed at 02:55, memory preserved, counsel engaged by 03:05. Investigation later confirms credential theft via the supplier VPN — the CTO was never involved.", "1": "The accusation is retracted publicly after the credential-theft finding; reputational and legal damage is done on both sides.", "2": "Both the evidence and the exfil path vanish; counsel discovers the wipe during the hold audit.", "3": "By the following Friday, 14 GB had left through the same session that one kill-switch would have ended."}, "hint": "Separate the account from the person. One action stops the bleeding AND preserves evidence.", "explain": "<p>The correct call does three things at once: <b>kills the live session</b> (stops the bleeding), <b>preserves evidence</b> (honours the hold), and <b>escalates without accusation</b> (keeps the person and the account separate). This is the exercise's 'escalate / do-not-act-yet-on-the-person' trap: the dramatic options all pay costs that the quiet one avoids.</p>", "study": "Exercise x3's step logic — attribution and accusation gate nothing that must happen now."}, {"id": "x9", "theme": "Analytical Frameworks", "kind": "multi", "widget": "drag", "title": "The board memo that survives counsel", "summary": "Five candidate sentences — counsel grades each one.", "scenario": "<p>Counsel reviews draft sentences for the board memo on ORCHID. Three standards apply: convey uncertainty, separate judgement from liability, keep the update path open.</p>", "question": "Place each sentence into counsel's verdict.", "cats": ["Allowed in the memo", "Blocked by counsel"], "items": [{"t": "“We assess with moderate confidence that the intrusion is consistent with cluster ORCHID.”", "c": 0, "w": "Calibrated confidence is exactly what a memo should carry."}, {"t": "“We now have proof beyond all doubt as to the attacker's identity.”", "c": 1, "w": "“Proof beyond all doubt” is a legal bar intelligence language never claims."}, {"t": "“Attribution may shift as evidence develops; we will update the board.”", "c": 0, "w": "An explicit revision path keeps the memo honest as evidence moves."}, {"t": "“Because vendor X named a group, our liability position is settled.”", "c": 1, "w": "A vendor's name settles nothing about liability — names converge and change."}, {"t": "“We are coordinating with counsel on regulatory notification obligations.”", "c": 0, "w": "Legal coordination, kept separate from technical judgement, is required practice."}], "hint": "Three sentences do work a memo must do. Two pretend the analysis is finished.", "explain": "<p>The defensible trio: <b>calibrated confidence</b>, an <b>explicit revision path</b>, and the <b>counsel coordination</b> that keeps legal duties separate from technical judgement. The traps mirror the two classic failures: claiming certainty intelligence cannot have, and letting a vendor's name do legal work it was never meant to do.</p>", "study": "Exercise x1's estimative logic and h9's sentence pattern — this is their board-level form."}, {"id": "x10", "theme": "Analytical Frameworks", "kind": "single", "widget": "qcm", "title": "Spot the standards violation", "summary": "One sentence, one dead giveaway.", "scenario": "<p>Draft assessment: <b>“It is 100% certain that Unit 74455 executed this attack; no further review is needed.”</b></p>", "question": "Which analytic standard does this sentence most violate?", "opts": ["Analytic judgements must convey uncertainty and stay open to revision", "Unit designations must never appear in any written assessment", "Leadership demands certainty, and the analyst dutifully supplied it", "The sentence is far too short for any formal written assessment"], "correct": [0], "whyOpts": {"1": "Named units appear in open indictments; naming is not the violation.", "2": "Leadership needs calibrated language, not false certainty — certainty here is a liability.", "3": "Length is a style matter; certainty and closed review are the standard breach."}, "hint": "Two claims in one sentence: perfect certainty, and a review that will never happen.", "explain": "<p>Analytic standards (ICD 203 in the US system) require judgements to <b>convey probability honestly</b> and remain <b>open to revision</b>. “100% certain” plus “no further review” violates both halves in six words. Real assessments use estimative language precisely so they can be corrected when evidence moves — as it always does.</p>", "study": "Exercise x14 shows a real revision — the outcome standards like this exist to protect."}, {"id": "x11", "theme": "Actor Landscape", "kind": "multi", "widget": "match", "title": "Converge the clusters — or refuse to", "summary": "Four sets resolve; one cannot, and saying so is the point.", "scenario": "<p>The ORCHID workshop's alias-convergence round. Four name sets have documented convergence; one set does not, and the evidence given cannot settle it.</p>", "question": "Pair each name set with the correct unified label.", "pairs": [{"l": "Midnight Blizzard · NOBELIUM · Cozy Bear", "r": "APT29", "w": "Microsoft, campaign and CrowdStrike names converge on APT29."}, {"l": "Seashell Blizzard · Voodoo Bear", "r": "Sandworm", "w": "Microsoft and CrowdStrike names for the GRU destructive unit."}, {"l": "Diamond Sleet · Hidden Cobra", "r": "Lazarus Group", "w": "Microsoft and US-CERT names for the DPRK group."}, {"l": "Wicked Panda · Barium", "r": "APT41", "w": "CrowdStrike and Microsoft names for the dual espionage/criminal Chinese group."}, {"l": "Tooling from one underground marketplace, used by three unrelated crews", "r": "Cannot be resolved from this evidence", "w": "Shared marketplace tooling has no owner signal — refusing to converge IS the correct convergence."}], "hint": "Four sets have documented convergence. The fifth asks you to do the one thing experts are paid for: say 'cannot be resolved'.", "explain": "<p>Convergence is real work — <b>Midnight Blizzard/NOBELIUM/Cozy Bear → APT29</b>, <b>Seashell Blizzard/Voodoo Bear → Sandworm</b>, <b>Diamond Sleet/Hidden Cobra → Lazarus</b>, <b>Wicked Panda/Barium → APT41</b>. The fifth item is the expert's answer: marketplace tooling is <b>ownerless</b>. Forcing a convergence where evidence ends is exactly how false attributions are born.</p>", "study": "Exercise m5 practised convergence; this adds its boundary condition."}, {"id": "x12", "theme": "Analytical Frameworks", "kind": "multi", "widget": "blank", "title": "Estimative language under fire", "summary": "Four blanks — the sentence counsel will actually sign.", "scenario": "<p>The ORCHID paragraph, final form. The bank hides one certainty-word that would kill it in review.</p>", "question": "Fill every blank with a word from the bank.", "sent": "We {{0}} that cluster ORCHID conducted the operation. Confidence is {{1}} because infrastructure overlap is strong but the {{2}} artefacts could have been planted. The judgement will be {{3}} if new reporting contradicts the targeting pattern.", "bank": ["assess", "moderate", "language", "revised", "prove", "high"], "answers": ["assess", "moderate", "language", "revised"], "whyBlank": {"assess": "“Assess” is the standard verb for a probabilistic judgement.", "moderate": "Strong-but-plantable evidence calibrates to moderate, not high.", "language": "Language artefacts are the cheapest to fake — the sentence names them as the weak leg.", "revised": "An explicit revision path is what estimative language is for."}, "hint": "Verb, calibration, the weak leg's name, and what happens when evidence moves.", "explain": "<p>The sentence does four jobs in four words: <b>assess</b> (probabilistic verb), <b>moderate</b> (calibration that matches mixed evidence), <b>language</b> (naming the plantable leg honestly), and <b>revised</b> (falsifiability). “Prove” and “high” would overclaim exactly the leg the paragraph admits is shaky — that inconsistency is what reviewers catch.</p>", "study": "Exercises h9 and x9 built this paragraph sentence by sentence."}, {"id": "x13", "theme": "Operations & Politics", "kind": "multi", "widget": "steps", "title": "The mimicry and its seams", "summary": "Dual perspective: forging ORCHID, finding ORCHID.", "scenario": "<p>A red cell is asked to impersonate the fictional cluster ORCHID convincingly; the blue cell must catch impersonations generically.</p>", "question": "Answer both perspectives.", "steps": [{"q": "STEP 1 — RED: Which package best sustains the impersonation?", "opts": ["Adopt ORCHID's documented TTPs, reuse their tooling, copy their banners", "Invent TTPs never seen in the wild, just for originality points", "Keep your own timezone and keyboard layout habits out of inertia"], "correct": 0, "why": "Mimicry works by reproducing what defenders record: TTP sequence, tooling, identity artefacts. Originality defeats the purpose; leftover habits are the seams defenders hunt."}, {"q": "STEP 2 — BLUE: Where do convincing forgeries usually fail?", "opts": ["At the seams — tooling era mismatches, habits that contradict the identity", "At the banner text, which every forgery copies perfectly anyway", "At the IP count — forgeries always seem to use more IPs than real ones"], "correct": 0, "why": "Copied artefacts come from different eras and live alongside un-copied habits. Seams — not surfaces — are where forgeries fail; banners copy perfectly, and IP counts are noise."}], "hint": "Red: copy what defenders actually record. Blue: perfect copies still live in the wrong decade.", "explain": "<p>Mimicry reproduces the <b>record</b> — TTPs, tooling, banners. Detection hunts the <b>seams</b>: tooling versions that predate the claimed group's era, op-sec habits that contradict the identity, infrastructure behaviour the real group never showed. Attribution disputes are usually seam disputes — which is why both chairs of this exercise matter.</p>", "study": "Exercise x1 resolved a real seam: planted identity against lived behaviour."}, {"id": "x14", "theme": "Analytical Frameworks", "kind": "multi", "widget": "order", "title": "Order the revision that saved the case", "summary": "Five milestones of an honest public correction.", "scenario": "<p>Eight months after the ORCHID report, allied reporting shows the C2 cluster also served three unrelated tenants — a shared-hosting service, not exclusive infrastructure.</p>", "question": "Put the five revision milestones in the correct order.", "ord": ["Initial assessment: moderate confidence, ORCHID exclusive infrastructure", "New allied reporting: the C2 range served three unrelated tenants", "Re-run the hypothesis analysis with the combined evidence", "Revise: shared-infrastructure service; unique attribution no longer supported", "Publish the update with an explicit revision note and its cause"], "hint": "Evidence arrives, analysis re-runs, the judgement moves, and the movement is published — in that order.", "explain": "<p>Honest attribution is a loop: <b>assessment → new evidence → re-analysis → revision → published correction</b>. The last step is the one organisations skip and regret: the revision note states what changed an function scoreMulti(T,C,Wn){if(!T)return 0;return Math.floor(Math.max(0,C-Wn)/T*100)}
function evalAns(exx){
  var st=W[exx.id],d={right:[],wrong:[],missed:[],C:0,W:0,T:0};
  var i,si;
  if(exx.widget==='qcm'){
    d.T=exx.correct.length;

      if(st.sel.indexOf(si)>=0){d.C++;d.right.push(ot)}else{d.missed.push(ot+'||'+wy)}}
    for(i=0;i<st.sel.length;i++){si=st.sel[i];if(exx.correct.indexOf(si)<0){d.W++;d.wrong.push(exx.opts[si]+'||'+((exx.whyOpts&&exx.whyOpts[si])||'Not correct in this scenario.'))}}
    d.correctTxt=exx.correct.map(function(ci){return exx.opts[ci]}).join(' | ');
    d.ansTxt=st.sel.length?st.sel.map(function(ci){return exx.opts[ci]}).join(' | '):'(nothing selected)';
  }else if(exx.widget==='drag'){
    d.T=exx.items.length;
    for(i=0;i<exx.items.length;i++){var it=exx.items[i],z=st.place[i];
      if(z===undefined){d.missed.push(it.t+' (not placed)||'+it.w+' Correct category: '+exx.cats[it.c]+'.')}
      else if(z===it.c){d.C++;d.right.push(it.t+' → '+exx.cats[it.c])}
      else{d.W++;d.wrong.push(it.t+' → you placed it in “'+exx.cats[z]+'”||'+it.w)}}
    d.correctTxt=exx.items.map(function(it2){return it2.t+' → '+exx.cats[it2.c]}).join(' | ');
    d.ansTxt='items placed in categories';
  }else if(exx.widget==='order'){
    d.T=exx.ord.length;
    for(i=0;i<d.T;i++){var got=exx.ord[st.arr[i]];
      if(st.arr[i]===i){d.C++;d.right.push('Position '+(i+1)+': '+got)}
      else{d.W++;d.wrong.push('Position '+(i+1)+': you put “'+got+'”||Correct here: “'+exx.ord[i]+'”.')}}
    d.correctTxt=exx.ord.map(function(o){return '“'+o+'”'}).join(' → ');
    d.ansTxt=st.arr.map(function(oi,p){return (p+1)+'. '+exx.ord[oi]}).join('  ');
  }else if(exx.widget==='match'){
    d.T=exx.pairs.length;
    for(i=0;i<d.T;i++){var p=exx.pairs[i],got2=st.pair[i];
      if(got2===undefined){d.missed.push(p.l+' (unpaired)||Correct pair: '+p.r+'. '+(p.w||''))}
      else if(got2===i){d.C++;d.right.push(p.l+' ↔ '+p.r)}
      else{d.W++;d.wrong.push(p.l+' ↔ '+exx.pairs[got2].r+'||'+(p.w||'Correct pair: '+p.r+'.'))}}
    d.correctTxt=exx.pairs.map(function(pp){return pp.l+' ↔ '+pp.r}).join(' | ');
    d.ansTxt='pairs made';
  }else if(exx.widget==='blank'){
    d.T=exx.answers.length;
    for(i=0;i<d.T;i++){var want=exx.answers[i],got3=st.fill[i];

      else if(got3===want){d.C++;d.right.push('Blank '+(i+1)+': '+want)}
      else{d.W++;d.wrong.push('Blank '+(i+1)+': you used “'+got3+'”||Correct: “'+want+'”. '+((exx.whyBlank&&exx.whyBlank[want])||''))}}
    d.correctTxt=exx.answers.join(' | ');
    d.ansTxt=Object.keys(st.fill).map(function(k){return (Number(k)+1)+':'+st.fill[k]}).join('  ')||'(no blanks filled)';
  }else if(exx.widget==='term'){
    var n=norm(st.last),T=0;

      var m=!!n&&new RegExp(el.re,'i').test(n);

      else{ T++;

  }

function artefactsHTML(exx){

  (exx.arts||[]).forEach(function(a,ix){

      exx.items.forEach(function(it,i3){if(st.place[i3]===zi)inner+='<button type="button" class="chip inz" data-act="chip" data-ci="'+i3+'">'+esc(it.t)+'</button>'});
      zs+='<div class="zone" data-act="zone" data-zi="'+zi+'" data-drop="1" tabindex="0" role="button" aria-label="Category: '+esc(c)+'. Activate to place the selected item here."><div class="zone-h">'+esc(c)+'</div><div class="zone-b">'+inner+'</div></div>'});

    h+='</div>';

    if(!st.rDisp)st.rDisp=sh(exx.pairs.map(function(p,i2){return i2}));
    h='<div class="w-hint"><b>Pair each left item with one right item.</b> Tap left, then tap right. Tap a paired right item again to undo.</div><div class="mwrap"><div class="opts">';
    exx.pairs.forEach(function(p,i2){h+='<button type="button" class="opt mitem'+(st.selL===i2?' sel':'')+'" data-act="ml" data-pi="'+i2+'"><span class="opt-l">L'+(i2+1)+'.</span><span class="opt-t">'+esc(p.l)+'</span></button>'});
    h+='</div><div class="opts">';
    st.rDisp.forEach(function(pi,dx){var by=-1;exx.pairs.forEach(function(p,li){if(st.pair[li]===pi)by=li});
      h+='<button type="button" class="opt mitem'+(by>=0?' sel':'')+'" data-act="mr" data-pi="'+pi+'"><span class="opt-l">R'+(dx+1)+'.</span><span class="opt-t">'+esc(exx.pairs[pi].r)+(by>=0?' <b class="mtag">↔ L'+(by+1)+'</b>':'')+'</span></button>'});
    h+='</div></div>';
  }else if(exx.widget==='blank'){
    var s=esc(exx.sent).replace(/\{\{(\d+)\}\}/g,function(m,n){var w=st.fill[n];return '<button type="button" class="blank'+(w?' filled':'')+'" data-act="blank" data-n="'+n+'">'+(w?esc(w):'___')+'</button>'});
    var bk='';

      bk+='<button type="button" class="chip'+(used?' used':'')+(st.chip===w?' selchip':'')+'" data-act="bchip" data-w="'+esc(w)+'"'+(used?' disabled':'')+'>'+esc(w)+'</button>'});
    h='<div class="w-hint"><b>Fill every blank.</b> Pick a word from the bank, then tap a blank. Tap a filled blank to put the word back.</div><div class="bsent">'+s+'</div><div class="bank" style="margin-top:12px">'+bk+'</div>';

    h=tl+'<div class="w-hint"><b>Build the full command.</b> Type it in the shell below and press Enter (or the Run button), then press Check. Nothing real is executed — this is a safe simulation.</div>'
     +'<div class="term mono"><div class="term-out" id="tOut">'+(st.out||'')+'</div><div class="term-in"><span class="term-p">'+esc(t.prompt)+'</span><input id="tIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type your command"><button type="button" class="btn sm" data-act="run">Run ▶</button></div></div>'
     +(st.out?'':'<div class="dim" style="font-size:13px">'+esc(t.goalNote||'')+'</div>');

    st.sDisp[cur].forEach(function(oi,dx){var sel=st.ans[cur]===oi;
      h+='<button type="button" class="opt'+(sel?' sel':'')+'" data-act="sopt" data-oi="'+oi+'" aria-pressed="'+sel+'"><span class="opt-l">'+String.fromCharCode(65+dx)+'.</span><span class="opt-t">'+esc(sd.opts[oi])+'</span><span class="opt-m">'+(sel?'✔':'')+'</span></button>'});
    h+='</div><div class="navrow">'+(st.ans[cur]!==undefined?'<button type="button" class="btn" data-act="snext">'+(cur===exx.steps.length-1?'Check all steps':'Record &amp; next step ▶')+'</button>':'<span class="dim">Select an option to continue.</span>')+'</div>';
  }
  return h;
}

  h+='<div id="fbArea" aria-live="polite"></div>';

function initWidget(exx){
  var st=W[exx.id]={sel:[],place:{},arr:null,pair:{},selL:null,fill:{},chip:null,i:0,ans:{},locked:{},last:'',out:'',dead:0};
  if(exx.widget==='drag')st.bDisp=sh(exx.items.map(function(o,i2){return i2}));
  if(exx.widget==='steps')st.sDisp=exx.steps.map(function(s2){return sh(s2.opts.map(function(o,i2){return i2}))});
  if(exx.widget==='order'){st.arr=sh(exx.ord.map(function(o,i2){return i2}));
    var ident=st.arr.every(function(v,i3){return v===i3});
    if(ident&&st.arr.length>1){var t0=st.arr[0];st.arr[0]=st.arr[1];st.arr[1]=t0}}
  if(exx.widget==='blank')st.bank=sh(exx.bank.slice());
  if(exx.widget==='term'&&exx.term.timeLimit)st.dead=exx.term.timeLimit;
}
function show(){
  S.phase='exam';
  $('scrIntro').style.display='none';$('scrResults').style.display='none';$('scrExam').style.display='block';
  var exx=ex(S.pos);
  if(!W[exx.id])initWidget(exx);
  $('exCnt').textContent='Exercise '+(S.pos+1)+' of '+S.order.length;
  $('sevB').className='sev '+CFG.sevClass;$('sevB').textContent=CFG.sevLabel;
  $('thChip').textContent=exx.theme;
  $('hintBtn').disabled=resOf(exx.id).hint;
  $('hintBtn').style.display='inline-flex';$('pauseBtn').style.display='inline-flex';$('skipBtn').style.display='inline-flex';
  $('main').innerHTML=mainHTML(exx);
  S.t.auto=false;renderTimer();updScore();
  window.scrollTo(0,0);
}
function showReview(){
  S.phase='review';
  $('exCnt').textContent='Review skipped exercises';
  var items=[];
  S.order.forEach(function(ei,i2){var e=EXLIST[ei],r=S.res[e.id];if(r.status!=='ans')items.push({e:e,i:i2})});
  var h='<div class="panel"><h2>⏭ Review skipped exercises</h2><p class="dim">The timer keeps running. Answer them now, or finish the exam — unanswered ones are simply excluded from your score.</p>';
  items.forEach(function(it){h+='<div class="rep"><div class="rep-h"><span class="rchip r-skip">⚠ not answered yet</span><b>'+esc(it.e.title)+'</b></div><div class="dim" style="font-size:13.5px">📌 '+esc(it.e.summary)+'</div><div class="navrow"><button class="btn" data-act="revans" data-id="'+it.e.id+'">↩ Answer this one</button></div></div>'});
  h+='<div class="navrow"><button class="btn pri" data-act="finish">🏁 Finish exam</button></div></div>';
  $('main').innerHTML=h;
  $('hintBtn').style.display='none';$('skipBtn').style.display='none';
  window.scrollTo(0,0);
}
function advance(){
  var n=S.order.length,i,r,skipped=false;
  for(i=0;i<n;i++){var k=(S.pos+1+i)%n;r=resOf(ex(k).id);if(r.status==='un'){S.pos=k;show();return}}
  for(i=0;i<n;i++){if(resOf(ex(i).id).status!=='ans')skipped=true}
  if(skipped){showReview();return}
  finishExam(false);
}
function doSkip(){var exx=ex(S.pos);resOf(exx.id).status='skip';advance()}
function doNext(){S.t.auto=false;renderTimer();advance()}
function jumpTo(id){var k=idxOf(id);if(k<0)return;var p=S.order.indexOf(k);if(p<0)return;S.pos=p;S.t.auto=false;show()}
function startExam(){
  S.order=sh(EXLIST.map(function(e,i){return i}));
  S.pos=0;S.res={};W={};S.reported=false;
  S.t.rem=CFG.minutes*60;
  show();startTimer();
}
function finishExam(timeout){
  S.phase='results';
  S.t.run=false;S.t.man=false;S.t.auto=false;renderTimer();
  var T=computeTotals();
  renderResults(T,timeout);
  $('scrExam').style.display='none';$('scrResults').style.display='block';
  window.scrollTo(0,0);
  reportScore(T);
}
function computeTotals(){
  var earned=0,possible=0,full=0,part=0,zero=0,skip=0,themes={};
  S.order.forEach(function(ei){
    var e=EXLIST[ei],r=S.res[e.id];
    var th=themes[e.theme]||(themes[e.theme]={full:0,part:0,zero:0,skip:0,pts:0,pos:0});
    if(r&&r.status==='ans'){earned+=r.earned;possible+=100;th.pts+=r.earned;th.pos+=100;
      if(r.earned>=100){full++;th.full++}else if(r.earned>0){part++;th.part++}else{zero++;th.zero++}}
    else{skip++;th.skip++}
  });
  return {earned:earned,possible:possible,full:full,part:part,zero:zero,skip:skip,themes:themes};
}
/* ---------- results screen ---------- */
function renderResults(T,timeout){
  var pct=T.possible>0?Math.round(T.earned/T.possible*100):0;
  var passed=pct>=CFG.passMark;
  var who=window.__LEARNER?'<div class="dim" style="margin-top:6px">Learner: '+esc(window.__LEARNER)+'</div>':'';
  var h='<h1>🏁 Results — '+esc(CFG.title)+'</h1>';
  if(timeout)h+='<div class="miniwarn">⏱ Time is up. Everything you had not answered was excluded from the score.</div>';
  h+=(passed?'<div class="passbox"><div style="font-size:40px">🏆</div><h2>PASS — certificate earned</h2><div class="bigpct">'+pct+'%</div><p class="dim">'+esc(CFG.title)+' · pass mark '+CFG.passMark+'%</p>'+who+'</div>'
        :'<div class="failbox"><div style="font-size:40px">📉</div><h2>Not passed yet — retake recommended</h2><div class="bigpct">'+pct+'%</div><p class="dim">You needed '+CFG.passMark+'%. Go through the report below, then retake the exam.</p>'+who+'</div>');
  h+='<div class="bgrid">'
   +'<div class="bstat"><b>'+T.full+'</b><span class="dim">✓ fully correct</span></div>'
   +'<div class="bstat"><b>'+T.part+'</b><span class="dim">◐ partially correct</span></div>'
   +'<div class="bstat"><b>'+T.zero+'</b><span class="dim">✗ incorrect</span></div>'
   +'<div class="bstat"><b>'+T.skip+'</b><span class="dim">⚠ skipped, excluded</span></div>'
   +'<div class="bstat"><b>'+T.earned+' / '+T.possible+'</b><span class="dim">points over answered</span></div></div>';
  var th='<table class="tt"><tr><th>Theme</th><th>✓ full</th><th>◐ partial</th><th>✗ zero</th><th>⚠ skipped</th><th>Points</th></tr>';
  Object.keys(T.themes).forEach(function(k){var t=T.themes[k];th+='<tr><td>'+esc(k)+'</td><td>'+t.full+'</td><td>'+t.part+'</td><td>'+t.zero+'</td><td>'+t.skip+'</td><td>'+t.pts+' / '+t.pos+'</td></tr>'});
  h+='<div class="panel"><h2>📊 Per-theme breakdown</h2>'+th+'</table></div>';
  h+='<div class="panel"><h2>📝 Detailed report</h2>';
  S.order.forEach(function(ei){
    var e=EXLIST[ei],r=S.res[e.id]||{status:'un',earned:0};
    var chip,cls;
    if(r.status==='ans'){if(r.earned>=100){chip='✓ '+r.earned+'/100';cls='r-ok'}else if(r.earned>0){chip='◐ '+r.earned+'/100';cls='r-part'}else{chip='✗ 0/100';cls='r-no'}}
    else{chip='⚠ Not answered — excluded from score';cls='r-skip'}
    h+='<div class="rep"><div class="rep-h"><span class="rchip '+cls+'">'+chip+'</span><b>'+esc(e.title)+'</b><span class="tchip">'+esc(e.theme)+'</span></div>';
    if(r.status==='ans'&&r.d){
      h+='<div class="dim" style="font-size:13.5px;margin-bottom:5px">Your answer: '+esc(r.d.ansTxt)+'</div>';
      h+='<div style="font-size:14px;margin-bottom:5px"><b>Correct:</b> '+esc(r.d.correctTxt)+'</div>';
    }
    h+='<div class="fb-explain" style="margin-top:4px">'+e.explain+'</div>';
    if(e.study)h+='<div class="fb-study">📖 '+esc(e.study)+'</div>';
    h+='</div>';
  });
  h+='</div><div class="navrow"><button class="btn pri" data-act="retake">🔁 Retake exam (new shuffle)</button></div>';
  $('scrResults').innerHTML=h;
}
/* ---------- website integration (STEP 6) ---------- */
function reportScore(T){
  if(S.reported)return;S.reported=true;
  if(T.possible<=0)return;
  var percent=Math.round(T.earned/T.possible*100);
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,batch:CFG.batch,score:T.earned,total:T.possible,percent:percent,passed:percent>=CFG.passMark},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  window.__LEARNER=event.data.username||'';
  if(window.__LEARNER){var w=$('who');if(w)w.textContent='👤 '+window.__LEARNER}
});
/* ---------- interaction ---------- */
function rerender(){var exx=ex(S.pos);if(!exx)return;var box=$('ansBox');if(!box)return;var keep=box.classList.contains('lock');var fb=$('fbArea').innerHTML;
  var pk=document.activeElement,pkey='';
  if(pk&&pk.closest&&box.contains(pk)&&pk.closest('[data-act]')){var pa=pk.closest('[data-act]');pkey=pa.getAttribute('data-act')+'|'+(pa.getAttribute('data-oi')||'')+'|'+(pa.getAttribute('data-ci')||'')+'|'+(pa.getAttribute('data-pi')||'')+'|'+(pa.getAttribute('data-w')||'')+'|'+(pa.getAttribute('data-n')||'')+'|'+(pa.getAttribute('data-zi')||'');}
  box.innerHTML='<div id="hintBox">'+($('hintBox')?$('hintBox').innerHTML:'')+'</div>'+widgetHTML(exx)+'<div class="chkmsg" id="chkMsg" role="status"></div><div class="navrow"><button class="btn pri" data-act="check" id="checkBtn" style="'+((keep||exx.widget==='steps')?'display:none':'')+'">✔ Check</button><button class="btn pri" data-act="next" id="nextBtn" style="display:'+(keep?'inline-flex':'none')+'">Next ▶</button><span class="dim" id="subT"></span></div>';
  if(keep)box.classList.add('lock');
  if(pkey){var all=box.querySelectorAll('[data-act]');for(var qi=0;qi<all.length;qi++){var el2=all[qi],k2=el2.getAttribute('data-act')+'|'+(el2.getAttribute('data-oi')||'')+'|'+(el2.getAttribute('data-ci')||'')+'|'+(el2.getAttribute('data-pi')||'')+'|'+(el2.getAttribute('data-w')||'')+'|'+(el2.getAttribute('data-n')||'')+'|'+(el2.getAttribute('data-zi')||'');if(k2===pkey){try{el2.focus({preventScroll:true})}catch(e3){el2.focus()}break}}}
  $('fbArea').innerHTML=fb;}
function placeChip(exx,st,ci,zi){if(st.place[ci]===zi){delete st.place[ci]}else{st.place[ci]=zi}st.pick=null;rerender()}
function swapOrder(exx,st,a,b){var ia=st.arr.indexOf(a),ib=st.arr.indexOf(b);if(ia<0||ib<0)return;var t=st.arr[ia];st.arr[ia]=st.arr[ib];st.arr[ib]=t}
function moveOrd(st,oi,dir){var p=st.arr.indexOf(oi),q=p+dir;if(q<0||q>=st.arr.length)return;var t=st.arr[p];st.arr[p]=st.arr[q];st.arr[q]=t}
function termRun(exx){
  var st=W[exx.id],inp=$('tIn');if(!inp)return;var cmd=inp.value;
  if(!cmd.trim()){$('chkMsg').textContent='Type a command first.';return}
  $('chkMsg').textContent='';
  st.last=cmd;
  st.out+='<div class="t-cmd">'+esc(exx.term.prompt+' '+cmd)+'</div>';
  var n=norm(cmd),hit=null;
  (exx.term.respond||[]).forEach(function(rr){if(!hit&&new RegExp(rr.re,'i').test(n))hit=rr});
  if(hit)st.out+='<div class="t-out">'+esc(hit.out)+'</div>';
  else st.out+='<div class="t-err">'+esc(exx.term.badOut||'command not found')+'</div>';
  inp.value='';
  var o=$('tOut');o.innerHTML=st.out;o.scrollTop=o.scrollHeight;
}
function useHint(exx){
  var r=resOf(exx.id);if(r.hint)return;
  r.hint=true;$('hintBtn').disabled=true;
  $('hintBox').innerHTML='<div class="miniwarn">💡 <b>Hint (this exercise now maxes at 90 points):</b> '+esc(exx.hint)+'</div>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act');
  if(act==='start'||act==='retake'){startExam();return}
  if(act==='finish'){finishExam(false);return}
  var exx=(S.phase==='exam')?ex(S.pos):null,st=exx?W[exx.id]:null;
  switch(act){
    case 'opt':{var oi=+b.getAttribute('data-oi');
      if(exx.kind==='single')st.sel=[oi];
      else{var ix=st.sel.indexOf(oi);if(ix>=0)st.sel.splice(ix,1);else st.sel.push(oi)}
      rerender();break}
    case 'chip':{var ci=+b.getAttribute('data-ci');
      if(st.place[ci]!==undefined){delete st.place[ci];st.pick=null}
      else st.pick=(st.pick===ci?null:ci);
      rerender();break}
    case 'zone':{var zi=+b.getAttribute('data-zi');
      if(st.pick!=null)placeChip(exx,st,st.pick,zi);
      else $('chkMsg').textContent='Tap an item first, then tap its category.';break}
    case 'blank':{var n2=b.getAttribute('data-n');
      if(st.fill[n2]!==undefined){delete st.fill[n2];rerender()}
      else if(st.chip){st.fill[n2]=st.chip;st.chip=null;rerender()}
      else{$('chkMsg').textContent='Pick a word from the bank first, then tap the blank.'}
      break}
    case 'bchip':st.chip=b.getAttribute('data-w');rerender();break;
    case 'ml':{var pi=+b.getAttribute('data-pi');st.selL=(st.selL===pi)?null:pi;rerender();break}
    case 'mr':{var pi2=+b.getAttribute('data-pi');
      if(st.selL==null){for(var k in st.pair){if(st.pair[k]===pi2)delete st.pair[k]}}
      else{for(var k2 in st.pair){if(st.pair[k2]===pi2)delete st.pair[k2]}st.pair[st.selL]=pi2;st.selL=null}
      rerender();break}
    case 'oup':moveOrd(st,+b.getAttribute('data-oi'),-1);rerender();break;
    case 'odn':moveOrd(st,+b.getAttribute('data-oi'),1);rerender();break;
    case 'sopt':{var cur=st.i;if(st.locked[cur])break;st.ans[cur]=+b.getAttribute('data-oi');rerender();break}
    case 'snext':{if(st.ans[st.i]===undefined){$('chkMsg').textContent='Record an answer first.';break}
      if(st.i<exx.steps.length-1){st.locked[st.i]=1;st.i++;rerender()}else{tryCheck(false)}break}
    case 'col':{$('scnCard').classList.toggle('collapsed');break}
    case 'hint':if(exx)useHint(exx);break;
    case 'pause':pauseManual();break;
    case 'resume':resumeManual();break;
    case 'skip':if(S.phase==='exam')doSkip();break;
    case 'check':tryCheck(false);break;
    case 'next':doNext();break;
    case 'run':if(exx&&exx.widget==='term')termRun(exx);break;
    case 'copy':{var t2=$('ccTxt');if(t2){try{navigator.clipboard.writeText(t2.textContent)}catch(e2){}}break}
    case 'revans':jumpTo(b.getAttribute('data-id'));break;
  }
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('data-act')==='zone'){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target&&e.target.id==='tIn'){e.preventDefault();var exx=ex(S.pos);if(exx&&exx.widget==='term')termRun(exx)}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='lvF'){
    var v=e.target.value.toLowerCase();
    document.querySelectorAll('#lvL .lv-r').forEach(function(r){r.style.display=(r.textContent.toLowerCase().indexOf(v)>=0)?'':'none'});
  }
});
document.addEventListener('dragstart',function(e){
  var t=e.target.closest('[draggable="true"]');if(!t)return;
  if(t.hasAttribute('data-ci')){DND={mode:'chip',val:+t.getAttribute('data-ci')}}
  else if(t.hasAttribute('data-oi')){DND={mode:'ord',val:+t.getAttribute('data-oi')}}
});
function clearDndMarks(){document.querySelectorAll('.dragover').forEach(function(el){el.classList.remove('dragover')})}
document.addEventListener('dragover',function(e){var z=e.target.closest('[data-drop]');if(z){e.preventDefault();var marked=document.querySelector('.dragover');if(marked!==z){clearDndMarks();z.classList.add('dragover')}}});
document.addEventListener('dragleave',function(e){if(e.target&&e.target.closest&&e.target.closest('[data-drop]')){var z=e.target.closest('[data-drop]');if(z&&!(e.relatedTarget&&z.contains(e.relatedTarget)))z.classList.remove('dragover')}});
document.addEventListener('dragend',clearDndMarks);
document.addEventListener('drop',function(e){
  var z=e.target.closest('[data-drop]');clearDndMarks();if(!z||!DND.mode)return;
  e.preventDefault();
  if(S.phase!=='exam')return;
  var exx=ex(S.pos),st=W[exx.id];if(!st)return;
  if(z.getAttribute('data-act')==='zone'&&DND.mode==='chip')placeChip(exx,st,DND.val,+z.getAttribute('data-zi'));
  else if(z.hasAttribute('data-oi')&&DND.mode==='ord'&&z.hasAttribute('data-act'))swapOrder(exx,st,DND.val,+z.getAttribute('data-oi'));
  DND={};rerender();
});
/* ---------- boot ---------- */
renderIntro();
renderTimer();
</script>
</body>
</html>
