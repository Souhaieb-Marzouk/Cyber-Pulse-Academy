<style>
:root {
  --bg: #0b1220;
  --bg2: #0e1626;
  --panel: #101a2e;
  --card: #0f1830;
  --line: #26375a;
  --line2: #33507e;
  --text: #dbe4f0;
  --muted: #9db0c9;
  --blue: #6ea8ff;
  --amber: #f0b429;

  --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 16px 18px 48px; }
h1 { font-size: 26px; margin: 10px 0 6px; }
h2 { font-size: 19px; margin: 18px 0 8px; }

ul { margin: 6px 0 6px 20px; padding: 0; }
li { margin: 4px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* ---------- badges & chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid; min-height: 26px; }
.badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.sev-easy { color: var(--sev-easy); border-color: var(--sev-easy); background: rgba(34,197,94,.10); }
.sev-medium { color: var(--sev-medium); border-color: var(--sev-medium); background: rgba(234,179,8,.10); }
.sev-hard { color: var(--sev-hard); border-color: var(--sev-hard); background: rgba(249,115,22,.10); }
.sev-xhard { color: var(--sev-xhard); border-color: var(--sev-xhard); background: rgba(239,68,68,.12); }
.chipmeta { display: inline-block; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12.5px; }
.kw-chip { display: inline-block; margin: 3px 4px 3px 0; padding: 3px 10px; background: #14213c; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: #b9c9e2; }

/* ---------- blocks (SCENARIO / QUESTION / YOUR ANSWER) ---------- */
.blk { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; background: var(--card); }
.blk-title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.blk-scenario { border-color: #2b4a7a; background: #0e1a33; }

.blk-question .blk-title { color: var(--amber); }
.blk-answer { border-color: #2b5e3f; background: #0d1f16; }
.blk-answer .blk-title { color: var(--green); }
.qtext { font-size: 16.5px; font-weight: 700; margin: 4px 0 2px; }
.stepchip { display: inline-block; margin: 0 0 8px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--amber); color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: .08em; }

/* ---------- artefact sub-panels ---------- */
.art { border: 1px dashed var(--line2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: #0b1426; }
.art-label { display: block; margin: 0 0 6px; color: #9fc1f7; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- log viewer ---------- */
.lv { background: #0a0f1d; border: 1px solid #22314f; border-radius: 8px; overflow: hidden; }
.lv-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #22314f; background: #0d1526; }
.lv-bar input { flex: 1; min-height: 44px; background: #0a0f1d; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 6px 10px; font-family: var(--mono); font-size: 14px; }
.lv-count { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.lv-lines { max-height: 320px; overflow: auto; padding: 8px 0; font-family: var(--mono); font-size: 14px; line-height: 1.5; }
.ln { padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
.ln-warn { color: var(--amber); }
.ln-err { color: var(--red); }
.ln-ok { color: var(--green); }
.ln-info { color: #aebfd8; }
.tok-ts { color: #8ab4f8; }
.tok-ip { color: #ffa657; }
.tok-url { color: #d2a8ff; }
.tok-str { color: #a5d6ff; }
.tok-bad { color: #ff7b72; font-weight: 600; }
.tok-good { color: #3fb950; font-weight: 600; }
.tok-pipe { color: #ff7b72; font-weight: 700; }
.tok-kw { color: #79c0ff; }
.tok-cmd { color: #d2a8ff; font-weight: 600; }
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.55; background: #0a0f1d; border: 1px solid #22314f; border-radius: 8px; padding: 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0; }

/* ---------- option rows ---------- */
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; margin: 8px 0; border: 1px solid #2c3e5d; border-radius: 10px; background: #0f1830; color: var(--text); cursor: pointer; font-size: 15.5px; line-height: 1.5; min-height: 44px; font-family: inherit; }
.opt:hover { border-color: #47679d; }
.opt.sel { border-color: #4f8ef7; background: #12244a; box-shadow: inset 0 0 0 1px #4f8ef7; }
.opt.good { border-color: var(--sev-easy); background: rgba(34,197,94,.08); }
.opt.bad { border-color: var(--sev-xhard); background: rgba(239,68,68,.07); }
.opt .key { font-weight: 800; color: #8ab4f8; min-width: 24px; }
.opt code, .opt .mono { font-family: var(--mono); font-size: 14px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: #16233d; color: var(--text); font-size: 15px; cursor: pointer; font-family: inherit; }
.btn:hover { border-color: #5b82c4; }
.btn.primary { background: #1d4ed8; border-color: #3b82f6; font-weight: 700; }
.btn.primary:hover { background: #2458ea; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #7a3b3b; color: #ffb4ad; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 16.5px; padding: 13px 26px; }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .blank:focus-visible, .ord-item:focus-visible, .mitem:focus-visible, .zone:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid #7ab8ff; outline-offset: 2px; }
.rowbtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- fill / bank / chips ---------- */
.sentence { font-family: var(--mono); font-size: 15px; line-height: 2.1; background: #0a0f1d; border: 1px solid #22314f; border-radius: 8px; padding: 10px 12px; word-break: break-word; }
.blank { display: inline-block; min-width: 120px; min-height: 44px; padding: 6px 10px; margin: 0 3px; border: 1.5px dashed var(--line2); border-radius: 8px; background: #101b33; color: var(--green); font-family: var(--mono); font-size: 14.5px; text-align: center; cursor: pointer; vertical-align: middle; }
.blank.filled { border-style: solid; border-color: var(--green); }
.bank { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; background: #0c1426; }
.chip { display: inline-flex; align-items: center; padding: 8px 14px; min-height: 44px; margin: 0; border: 1px solid var(--line2); border-radius: 999px; background: #14213c; color: var(--text); cursor: pointer; font-size: 14.5px; font-family: var(--mono); }
.chip.sel { border-color: #4f8ef7; box-shadow: inset 0 0 0 1px #4f8ef7; }
.chip.used { opacity: .3; cursor: default; }

/* ---------- match ---------- */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mitem { display: block; width: 100%; text-align: left; padding: 12px 14px; min-height: 44px; border: 1px solid #2c3e5d; border-radius: 10px; background: #0f1830; color: var(--text); cursor: pointer; font-size: 15px; font-family: inherit; line-height: 1.45; }
.mitem.sel { border-color: #4f8ef7; box-shadow: inset 0 0 0 1px #4f8ef7; background: #12244a; }
.mitem .pairtag { display: inline-block; margin-top: 6px; font-size: 12.5px; color: var(--green); font-weight: 700; }
.mhead { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

/* ---------- order ---------- */
.ord { display: flex; flex-direction: column; gap: 8px; }
.ord-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 44px; border: 1px solid #2c3e5d; border-radius: 10px; background: #0f1830; cursor: grab; }
.ord-item.dragging { opacity: .55; border-style: dashed; }
.ord-item .idx { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #22304f; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; }
.ord-item .txt { flex: 1; font-size: 15px; }
.ord-item .mini { flex: none; }
.mini { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line2); background: #14213c; color: var(--text); font-size: 16px; cursor: pointer; }
.mini:hover { border-color: #5b82c4; }

/* ---------- categorize ---------- */
.bankzone { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #0c1426; min-height: 56px; }
.zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.zone { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 10px; min-height: 86px; background: #0b1526; }
.zone.over { border-color: #4f8ef7; background: #101f3d; }
.zone h4 { margin: 0 0 8px; font-size: 13.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
.zone .zitems { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; }

/* ---------- terminal ---------- */
.term { background: #070d18; border: 1px solid #22314f; border-radius: 10px; overflow: hidden; }
.term-out { max-height: 280px; min-height: 120px; overflow: auto; padding: 10px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #b9c9e2; }
.term-in { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid #22314f; background: #0a1120; }
.term-in .pr { color: #7ee787; font-family: var(--mono); font-size: 14px; font-weight: 700; white-space: nowrap; }
.term-in input { flex: 1; min-height: 44px; background: transparent; border: 0; color: #7ee787; font-family: var(--mono); font-size: 14.5px; outline: none; }
.term-panel { border: 1px solid var(--line2); border-radius: 10px; background: #101b33; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.term-panel .ttl { color: var(--blue); font-weight: 800; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
.term-count { display: inline-block; margin-top: 8px; padding: 4px 10px; border: 1px solid var(--sev-xhard); color: var(--sev-xhard); border-radius: 999px; font-family: var(--mono); font-size: 13.5px; font-weight: 700; }

/* ---------- hint & feedback ---------- */
.hint-panel { margin: 0 0 10px; padding: 10px 12px; border: 1px solid #6e5a22; background: #241d08; border-radius: 10px; font-size: 14.5px; }
.hint-panel b { color: var(--amber); }
.fb { border-radius: 12px; padding: 14px 16px; margin-top: 16px; border: 1px solid; }
.fb h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
.fb-ok { border-color: #2b5e3f; background: #0d2016; }
.fb-ok h3 { color: var(--green); }
.fb-bad { border-color: #6e2b2b; background: #240d0d; }
.fb-bad h3 { color: var(--red); }
.fb-skip { border-color: #6e5a22; background: #241d08; }
.fb-skip h3 { color: var(--amber); }
.fb .lab { font-weight: 800; color: var(--muted); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; margin: 10px 0 3px; }
.copyrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.copybtn { padding: 6px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line2); background: #14213c; color: var(--text); cursor: pointer; font-size: 13px; }

/* ---------- header ---------- */
.xhead { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; background: rgba(11,18,32,.96); border-bottom: 1px solid #22314f; }
.xhead .grow { flex: 1 1 160px; min-width: 120px; }
.xh-count { font-weight: 700; font-size: 14.5px; }
.pbar { height: 6px; background: #1b2740; border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1d4ed8, #22c55e); transition: width .35s ease; }
.xh-score { font-family: var(--mono); font-size: 13.5px; color: #b9c9e2; white-space: nowrap; }
.xh-timer { font-family: var(--mono); font-size: 15px; font-weight: 700; white-space: nowrap; min-width: 64px; text-align: center; }
.xh-timer.low { color: var(--red); }
.xhead .btn { min-height: 44px; padding: 6px 12px; font-size: 13.5px; }

/* ---------- keyword bar ---------- */
.kwbar { max-width: 1000px; margin: 10px auto 0; padding: 0 18px; }
.kwbar summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }
.kwbar .kw-inner { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }

/* ---------- intro ---------- */
.hero { margin-top: 10px; }
.hero-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 8px; }
.kw-theme { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.kw-theme h5 { margin: 0 0 6px; font-size: 13.5px; color: var(--blue); letter-spacing: .04em; }
.instr li { margin: 7px 0; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.info-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); text-align: center; }
.info-box .num { font-size: 22px; font-weight: 800; color: var(--blue); }
.info-box .lab { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- review ---------- */
.rev-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--card); flex-wrap: wrap; }
.rev-item .t { font-weight: 700; }
.rev-item .s { color: var(--muted); font-size: 13.5px; }

/* ---------- results ---------- */
.res-hero { text-align: center; padding: 26px 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(1200px 400px at 50% -80px, #16264a, var(--panel)); margin-top: 12px; }
.res-pct { font-size: 54px; font-weight: 800; }
.res-pct.ok { color: var(--green); }
.res-pct.no { color: var(--red); }
.res-break { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
.res-break .info-box { min-width: 130px; }
.cert { border: 2px solid #3b82f6; border-radius: 14px; padding: 22px 18px; margin: 16px 0; background: linear-gradient(160deg, #0e1a33, #101f3d); text-align: center; }
.cert .brand { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: var(--blue); font-weight: 800; }
.cert h2 { margin: 8px 0; }
.themebar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.tprog { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: #b9c9e2; background: var(--panel); }
.res-item { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; background: var(--card); overflow: hidden; }
.res-item summary { cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 12px 14px; flex-wrap: wrap; }
.res-item .verdict { font-weight: 800; font-size: 13.5px; white-space: nowrap; }
.res-item .v-ok { color: var(--green); }
.res-item .v-bad { color: var(--red); }
.res-item .v-skip { color: var(--amber); }
.res-detail { border-top: 1px solid var(--line); padding: 12px 14px; }

/* ---------- overlay (pause) ---------- */
.overlay { position: fixed; inset: 0; background: rgba(5, 9, 18, .96); display: flex; align-items: center; justify-content: center; z-index: 60; }
.overlay .obox { text-align: center; }
.overlay h2 { font-size: 22px; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #14213c; border: 1px solid var(--line2); color: var(--text); border-radius: 10px; padding: 10px 18px; z-index: 80; font-size: 14px; }

@media (max-width: 720px) {
  .match-grid, .zones { grid-template-columns: 1fr; }
  .xhead { gap: 8px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

window.__EXAMCFG__ = {"severity": "EASY", "sevClass": "sev-easy", "timerMinutes": 20, "blurb": "A guided first tier. One idea per exercise, short scenarios, plain English. If you are new to Splunk, start here and build the base.", "sevDetail": "Each exercise tests exactly one concept: one decision, one correct answer. Hints point at the concept itself, so you can recover if you read the intro.", "types": "single-choice questions, a data-pipeline ordering, component matching, log field reading, a fill-in-the-blank search, bucket sorting, one mini alert decision, one guided terminal search (you type it), and command matching.", "themes": [{"name": "Platform & Architecture", "chips": ["index", "indexer", "search head", "forwarder", "buckets", "data pipeline", "deployment server", "hot / warm / cold"]}, {"name": "Searching & SPL", "chips": ["SPL", "stats", "table", "dedup", "sort", "top", "time range", "fields: host / source / sourcetype"]}, {"name": "Data Onboarding", "chips": ["sourcetype", "inputs", "event", "timestamp"]}, {"name": "Security Operations", "chips": ["alerts", "triage", "notable events", "dashboards"]}, {"name": "Administration & Health", "chips": ["roles", "_internal", "monitoring", "licensing"]}], "kwIntro": "\n<h4>What is Splunk?<\/h4>\n<p>Splunk is a software platform for <b>machine data<\/b>. Machine data is the information that servers,\napps, firewalls, and devices write all the time: logins, errors, web requests, alerts. Splunk collects\nthis data in one place, stores it, and lets you search it very fast. You will learn to use Splunk the way\nreal teams use it. Imagine you are a new analyst: a big pile of logs arrives every second, and your job\nis to ask the right questions.<\/p>\n<h4>Who uses Splunk at work?<\/h4>\n<ul>\n<li><b>SOC analysts<\/b> (Security Operations Center) watch alerts in Splunk, open the raw events, and\ndecide if something is an attack or not.<\/li>\n<li><b>Incident responders (IR)<\/b> use Splunk after an attack is found. They build a timeline: who did\nwhat, when, and where.<\/li>\n<li><b>Threat hunters and detection engineers<\/b> write searches that look for hidden attackers, and turn\ngood searches into alerts and correlation rules.<\/li>\n<li><b>Platform and security engineers<\/b> connect new data sources, keep Splunk healthy, and manage who\nmay see which data.<\/li>\n<li><b>GRC and audit teams<\/b> (Governance, Risk, Compliance) use Splunk reports to prove that rules are\nfollowed — for example, who accessed sensitive data and when.<\/li>\n<\/ul>\n<h4>Tools and parts you will meet<\/h4>\n<p>The <b>Universal Forwarder<\/b> is a small agent that sends logs to Splunk. The <b>Indexer<\/b> stores\nthe data. The <b>Search Head<\/b> is where you type <b>SPL<\/b> — the Splunk Search Processing Language.\nApps like <b>Enterprise Security<\/b> add SOC features on top: notable events, risk scores, and dashboards.<\/p>\n<h4>Daily tasks and deliverables<\/h4>\n<p>A normal day: triage alerts, search logs, build a timeline, write a short incident note, tune a noisy\nalert, or onboard a new log source. The typical deliverables are dashboards, alerts, reports, and clean,\nwell-mapped data.<\/p>\n<h4>Risks Splunk helps to manage<\/h4>\n<p>Splunk helps teams find breaches, malware, stolen credentials, data theft, policy violations, and\nsystem failures early — before they become expensive problems.<\/p>\n", "username": ""};
window.__EXERCISES__ = [{"id": "E1", "type": "qcm", "title": "What Splunk is", "theme": "Platform & Architecture", "summary": "Intro quiz — what the Splunk platform actually does", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>You start as a SOC analyst at <b>Northwind Retail<\/b>. On your first day your team lead says: <i>“All our servers, firewalls, and apps send their logs into Splunk. You will live in that tool.”<\/i><\/p>"}]}, "question": "What is Splunk?", "hint": "Think about where all the logs from your servers go, and what you can do with them once they are there.", "why": "Splunk is a data platform. It collects machine data (logs, metrics, events), stores it, and lets you search and chart it very fast. It is not a security control itself: it does not block anything and it does not clean anything.", "tip": "Re-read the intro section 'What is Splunk?', then compare it with what a firewall and an antivirus tool do.", "qcm": {"multi": false, "correct": 2, "options": ["A firewall that blocks traffic from bad IP addresses", "An antivirus tool that removes malware from laptops", "A platform that collects machine data and makes it searchable", "A database that only stores customer payment records"]}}, {"id": "E2", "type": "order", "title": "The Splunk data pipeline", "theme": "Platform & Architecture", "summary": "Order the four stages data passes through inside Splunk", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>A new firewall log line is on its way into Splunk at Northwind Retail. Data always passes through the same stages, in the same order. You will meet every stage in your daily work.<\/p>"}, {"kind": "note", "body": "The four stages are listed in the bank below, but shuffled. Put them in the order the data travels."}]}, "question": "Order the four pipeline stages from first to last.", "hint": "This is about the layer where data enters, gets stored, and gets queried — ask yourself: what must exist before a search can run?", "why": "Data flows one way: <b>Input<\/b> (it enters, usually through a forwarder), <b>Parsing<\/b> (Splunk cuts the stream into single events and reads timestamps), <b>Indexing<\/b> (events are written to disk in an index), <b>Searching<\/b> (you query the stored events with SPL). Searching is always last because you can only search what is already stored.", "tip": "Draw the four boxes on paper: in, cut, store, ask. That order never changes.", "order": {"items": ["Input — data enters Splunk, usually through a forwarder", "Parsing — Splunk cuts the stream into single events and reads timestamps", "Indexing — events are written to disk inside an index", "Searching — you query the stored events with SPL"]}}, {"id": "E3", "type": "match", "title": "Who does what in the Splunk farm", "theme": "Platform & Architecture", "summary": "Match each Splunk component to its one main job", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>Northwind Retail runs a small Splunk farm: a dozen servers send logs, two indexers store them, and analysts search from a search head. Each component has exactly one main job.<\/p>"}]}, "question": "Match each Splunk component to its main job.", "hint": "Match each part to the one verb that describes it: send, store, search, or distribute.", "why": "The <b>Universal Forwarder<\/b> is a small agent that sends data. The <b>Indexer<\/b> stores data on disk and answers search requests for its part of the data. The <b>Search Head<\/b> is where you type SPL and see results. The <b>Deployment Server<\/b> pushes apps and settings out to the forwarders, so you do not configure 100 machines by hand.", "tip": "Say the four verbs out loud — send, store, search, distribute — and attach one component to each.", "match": {"left": ["Universal Forwarder", "Indexer", "Search Head", "Deployment Server"], "right": ["Sends log data from servers to Splunk", "Stores the data on disk", "Where you run searches and build reports", "Pushes apps and settings out to other instances"], "solution": [0, 1, 2, 3]}}, {"id": "E4", "type": "qcm", "title": "Default fields: host, source, sourcetype", "theme": "Searching & SPL", "summary": "Read one log line and name the default field for the machine", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>You open one event in the Northwind Splunk search head. Splunk adds a few default fields to every event it stores. One log line:<\/p>"}, {"kind": "logview", "label": "ARTEFACT 1 — One SSH event", "filterable": false, "lines": [{"raw": "Oct 12 03:14:01 web01 sshd[4412]: Failed password for admin from 203[.]0[.]113[.]66 port 51822 ssh2", "level": "err"}]}, {"kind": "note", "body": "In this event: <b>web01<\/b> is the machine that wrote the line, the file path on web01 is <b>/var/log/secure<\/b>, and the kind of log is <b>linux_secure<\/b>."}]}, "question": "Which default field holds the name of the machine that produced the event?", "hint": "One default field is literally named after the machine itself.", "why": "Splunk adds four default fields to every event: <b>host<\/b> is the machine that sent it (here web01), <b>source<\/b> is the file or channel it came from (here /var/log/secure), <b>sourcetype<\/b> says the kind of log (here linux_secure), and <b>index<\/b> is the storage bucket it sits in.", "tip": "Learn the four default fields as a fixed set: host = machine, source = path, sourcetype = log kind, index = storage.", "qcm": {"multi": false, "correct": 1, "options": ["source", "host", "sourcetype", "index"]}}, {"id": "E5", "type": "fill", "title": "Build your first search", "theme": "Searching & SPL", "summary": "Complete a simple web-log search with four missing words", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>Your mentor asks you to count the web events per HTTP status in <b>index=main<\/b>, sourcetype <b>access_combined<\/b>. The search is half built — four words are missing.<\/p>"}, {"kind": "note", "body": "The pipe character <b>|<\/b> passes the results of the left side into the command on the right side."}]}, "question": "Fill the four gaps so the search counts events by HTTP status.", "hint": "Two gaps are filters that say where to look. The last two gaps use the command that counts, grouped by a field.", "why": "<b>index<\/b> and <b>sourcetype<\/b> narrow where Splunk looks — always filter first, it is faster. <b>stats count by status<\/b> groups the events by the status field and counts each group. The word <b>count<\/b> is the name of the counter stats produces.", "tip": "Type the finished search in the sandbox search bar of your training instance and read it out loud: 'in index main, sourcetype access_combined, count by status'.", "fill": {"parts": [{"b": 1}, "=main ", {"b": 2}, "=access_combined | ", {"b": 3}, " ", {"b": 4}, " by status"], "answers": ["index", "sourcetype", "stats", "count"], "bank": ["table", "sourcetype", "host", "count", "dedup", "stats", "index"]}}, {"id": "E6", "type": "qcm", "title": "What is an index?", "theme": "Platform & Architecture", "summary": "A colleague says 'the firewall logs are in index=firewall' — what does that mean", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>Your lead says: <i>“Firewall logs land in index=firewall. Proxy logs land in index=proxy. Keep them separate.”<\/i><\/p>"}]}, "question": "What is an index in Splunk?", "hint": "It is about where data lives, not how you search it.", "why": "An index is the storage unit of Splunk: events are written into it on disk, and searches point at it. Keeping data in separate indexes lets you control access, retention, and speed per data type. An index is not a command, not a dashboard, and not a user account.", "tip": "In your training instance open Settings and find the Indexes list, or click the index name on any event in the Search app.", "qcm": {"multi": false, "correct": 3, "options": ["The search command that filters events by time", "A dashboard that shows alert statistics", "The user account that owns the data", "The storage bucket where events are kept on disk"]}}, {"id": "E7", "type": "categorize", "title": "Hot, warm, and cold buckets", "theme": "Platform & Architecture", "summary": "Sort six facts about bucket ages into hot, warm, and cold", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>Splunk stores each index in folders called <b>buckets<\/b>. Buckets age: they are born hot, grow old as warm, and end as cold. The age decides where the data sits and how fast you can search it.<\/p>"}]}, "question": "Drag each statement into the bucket age it describes.", "hint": "Think about age only: newest, middle, oldest. Two statements belong to each age.", "why": "<b>Hot<\/b> buckets are written right now — new events land here and searches can still change them. <b>Warm<\/b> buckets are closed, no longer written, but still on fast search-ready disk. <b>Cold<\/b> buckets hold old data moved to cheaper, slower storage, and are searched less often.", "tip": "Remember the lifecycle story: born hot (being written), lives warm (closed, on fast disk), retires cold (old, cheap storage).", "categorize": {"items": ["A login event that arrived one minute ago", "Data that Splunk is still writing to right now", "Events from last month that no longer change", "Closed data kept on fast, search-ready disk", "Events from three years ago", "Old data moved to cheap, slow storage"], "zones": [{"label": "Hot bucket", "items": [0, 1]}, {"label": "Warm bucket", "items": [2, 3]}, {"label": "Cold bucket", "items": [4, 5]}]}}, {"id": "E8", "type": "qcm", "title": "First alert of the shift", "theme": "Security Operations", "summary": "Alert: 52 failed logins for user jdoe — choose the simple next step", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — Alert queue", "headers": ["Field", "Value"], "rows": [["Alert", "Multiple failed logins for one user"], ["Detail", "52 failed logins for user jdoe on vpn-nw01 in 5 minutes"], ["Time", "07:02, your first shift"]]}]}, "question": "What is the simple, correct next step?", "hint": "You want to see the raw events with your own eyes before you touch anything.", "why": "Look at the events first: run a search that shows the failed logins for jdoe. Only then can you tell a mistyped password from an attack. Shutting down the VPN hurts the whole company for no proven reason, deleting the account punishes jdoe without proof, and closing the alert hides a possible attack.", "tip": "Golden rule of triage: see the raw events first, decide after. Never act on the alert summary alone.", "qcm": {"multi": false, "correct": 1, "options": ["Shut down the VPN server for the whole company", "Run a search that shows the failed-login events for jdoe", "Delete the user account jdoe immediately", "Close the alert because failed logins are normal"]}}, {"id": "E9", "type": "terminal", "title": "Terminal: type your first search", "theme": "Searching & SPL", "summary": "Type a search in the fake search bar: security index, SSH sourcetype", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>The <b>Search &amp; Reporting<\/b> app is open on your training search head. Security logs are stored in <b>index=security<\/b>. SSH logs among them have the sourcetype <b>sshd<\/b>.<\/p>"}, {"kind": "note", "body": "Type the search in the bar below and press Enter. Then press Submit when you believe your last command is right."}]}, "question": "Type a search that shows only the SSH events stored in the security index.", "hint": "Start with the index, then narrow with the sourcetype. Two words, two equal signs, no pipes.", "why": "A base search is just filters: <b>index=security<\/b> picks the storage bucket, <b>sourcetype=sshd<\/b> keeps only SSH events inside it. Filters before any pipe are the cheapest way to cut data, so make them a reflex. You did not need a pipe here because the task is only to show events.", "tip": "Practice the pattern index=&lt;name&gt; sourcetype=&lt;name&gt; until typing it feels automatic.", "terminal": {"prompt": "search>", "caseInsensitive": true, "accept": ["^(search )?index=security sourcetype=sshd( .*)?$", "^(search )?sourcetype=sshd index=security( .*)?$"], "nearMiss": [{"re": "index=security", "msg": "Close! You named the index but not the sourcetype, so all security events would show, not only SSH."}, {"re": "sourcetype=sshd", "msg": "Close! You named the sourcetype but not the index, so Splunk would search every index for SSH events."}], "outputs": [{"re": "index=security", "out": "Oct 12 03:14:01 bastion01 sshd[4412]: Failed password for admin from 203[.]0[.]113[.]66 port 51822 ssh2\nOct 12 03:14:09 bastion01 sshd[4412]: Accepted password for sam.r from 10[.]20[.]1[.]15 port 44112 ssh2\nOct 12 03:15:02 bastion01 sshd[5121]: Failed password for root from 203[.]0[.]113[.]66 port 51840 ssh2\n\nEvents: 3 shown (time range: Last 24 hours)"}], "fallbackOut": "No matching events found. Check the spelling of the index and sourcetype.", "syntaxPanel": "<pre class=\"code\" style=\"margin:6px 0 0\">&lt;index&gt;=&lt;name&gt; &lt;sourcetype&gt;=&lt;name&gt;\nindex — which storage bucket to search\nsourcetype — which kind of log to keep\nExample on a different target: index=network sourcetype=dns<\/pre>", "outputSample": "Oct 12 03:14:01 bastion01 sshd[4412]: Failed password for admin from 203[.]0[.]113[.]66 port 51822 ssh2\nOct 12 03:14:09 bastion01 sshd[4412]: Accepted password for sam.r from 10[.]20[.]1[.]15 port 44112 ssh2", "canonical": "index=security sourcetype=sshd", "canonicalExplain": [{"part": "index=security", "why": "points the search at the security storage bucket"}, {"part": "sourcetype=sshd", "why": "keeps only SSH events inside that bucket"}], "timeLimit": 0, "destructiveNote": ""}}, {"id": "E10", "type": "match", "title": "Four SPL commands you will use daily", "theme": "Searching & SPL", "summary": "Match table, dedup, sort, and top to their plain-English jobs", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>Your mentor sends you four commands and four jobs. These four commands cover half of your daily SPL work at Northwind Retail.<\/p>"}, {"kind": "code", "label": "ARTEFACT 1 — The four commands", "body": "| table user, status\n| dedup user\n| sort -count\n| top limit=5 uri", "labelSpl": true}]}, "question": "Match each command to what it does.", "hint": "The four jobs are: show as columns, remove repeats, order rows, show most common values.", "why": "<b>table<\/b> shows only the fields you name, one per column. <b>dedup<\/b> removes repeated values of a field and keeps the first event. <b>sort -count<\/b> orders rows by count, biggest first (the minus sign means descending). <b>top limit=5 uri<\/b> shows the most common 5 values of uri with counts and percentages.", "tip": "Write one example search per command in your notes — muscle memory beats memory.", "match": {"left": ["table", "dedup", "sort -count", "top limit=5"], "right": ["Shows chosen fields as clean columns", "Removes repeated values of a field, keeps the first", "Orders the rows, biggest count first", "Shows the most common values with counts and percents"], "solution": [0, 1, 2, 3]}}, {"id": "E11", "type": "qcm", "title": "What does SPL stand for?", "theme": "Searching & SPL", "summary": "Name the search language you type into Splunk", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>You typed your first search today: <b>index=firewall | stats count by src_ip<\/b>. A colleague nods: “Nice, your first SPL pipeline.”<\/p>"}]}, "question": "What does SPL stand for?", "hint": "It is the language you use to search — the name says exactly that.", "why": "SPL is the <b>Search Processing Language<\/b>: the language you type into Splunk to search, filter, transform, and report on data. It works like a pipeline: commands are joined with the pipe character | and each pipe passes results to the next command.", "tip": "Open the Splunk Search tutorial in your training instance and run three pipe searches of your own.", "qcm": {"multi": false, "correct": 2, "options": ["Secure Packet Logger", "System Power Loader", "Search Processing Language", "Security Policy List"]}}];
