<style>

/* ---------- keyword bar ---------- */

/* ---------- intro ---------- */

window.__EXAMCFG__ = {"severity": "EXTREMELY HARD", "sevClass": "sev-xhard", "timerMinutes": 65, "blurb": "The top tier. Senior-level chains: several concepts per exercise, conflicting signals you must resolve explicitly, incomplete information, and decisions with real business cost.", "sevDetail": "Three or more chained concepts, branching interpretation, and pressure language. At least one exercise rewards the least aggressive answer; hints only restate a constraint you may have missed — they never point at the answer.", "types": "a four-step incident chain with conflicting artefacts, a timed evidence-preservation terminal with a destructive trap, a telemetry conflict resolution, a do-not-touch-yet decision, an infrastructure triage, risk-based-alerting tuning, a collection-outage ambiguity, an audit tampering analysis, a licensing decision, an executive prioritization ranking, and a quorum architecture call.", "themes": [{"name": "Platform & Architecture", "chips": ["indexer cluster", "storage pressure", "search head cluster", "quorum", "HEC", "forwarder queues", "license pools"]}, {"name": "Searching & SPL", "chips": ["_audit", "| delete", "outputlookup", "saved searches", "risk rules", "rest"]}, {"name": "Security Operations", "chips": ["ransomware precursor", "containment", "evidence preservation", "impossible travel", "risk-based alerting", "notables"]}, {"name": "Administration & Health", "chips": ["nullQueue routing", "frozen retention", "can_delete role", "monitoring console", "blocked queues"]}, {"name": "Investigation Discipline", "chips": ["conflicting signals", "incomplete data", "business impact", "escalation", "chain of custody"]}], "kwIntro": "\n<h4>What is Splunk?<\/h4>\n<p>Splunk is a software platform for <b>machine data<\/b>. Machine data is the information that servers,\napps, firewalls, and devices write all the time: logins, errors, web requests, alerts. Splunk collects\nthis data in one place, stores it, and lets you search it very fast. You will learn to use Splunk the way\nreal teams use it. Imagine you are a new analyst: a big pile of logs arrives every second, and your job\nis to ask the right questions.<\/p>\n<h4>Who uses Splunk at work?<\/h4>\n<ul>\n<li><b>SOC analysts<\/b> (Security Operations Center) watch alerts in Splunk, open the raw events, and\ndecide if something is an attack or not.<\/li>\n<li><b>Incident responders (IR)<\/b> use Splunk after an attack is found. They build a timeline: who did\nwhat, when, and where.<\/li>\n<li><b>Threat hunters and detection engineers<\/b> write searches that look for hidden attackers, and turn\ngood searches into alerts and correlation rules.<\/li>\n<li><b>Platform and security engineers<\/b> connect new data sources, keep Splunk healthy, and manage who\nmay see which data.<\/li>\n<li><b>GRC and audit teams<\/b> (Governance, Risk, Compliance) use Splunk reports to prove that rules are\nfollowed — for example, who accessed sensitive data and when.<\/li>\n<\/ul>\n<h4>Tools and parts you will meet<\/h4>\n<p>The <b>Universal Forwarder<\/b> is a small agent that sends logs to Splunk. The <b>Indexer<\/b> stores\nthe data. The <b>Search Head<\/b> is where you type <b>SPL<\/b> — the Splunk Search Processing Language.\nApps like <b>Enterprise Security<\/b> add SOC features on top: notable events, risk scores, and dashboards.<\/p>\n<h4>Daily tasks and deliverables<\/h4>\n<p>A normal day: triage alerts, search logs, build a timeline, write a short incident note, tune a noisy\nalert, or onboard a new log source. The typical deliverables are dashboards, alerts, reports, and clean,\nwell-mapped data.<\/p>\n<h4>Risks Splunk helps to manage<\/h4>\n<p>Splunk helps teams find breaches, malware, stolen credentials, data theft, policy violations, and\nsystem failures early — before they become expensive problems.<\/p>\n", "username": ""};
window.__EXERCISES__ = [{"id": "X1", "type": "steps", "title": "Four-step call: the billing server", "theme": "Investigation Discipline", "summary": "Incident #MH-4412 — EDR says blocked, firewall says still trying, CISO wants a decision", "collapse": true, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — EDR console, APP-SRV02", "headers": ["Time", "Event"], "rows": [["14:02", "LSASS access attempt by unknown process — BLOCKED"], ["14:04", "Local account svc_winupd created (Admin)"], ["14:05", "New service installed: WinDefUpd, binary in user temp"], ["14:07", "C2 connection to 203[.]0[.]113[.]201 — BLOCKED"]]}, {"kind": "logview", "label": "ARTEFACT 2 — Firewall log, APP-SRV02 egress", "filterable": true, "lines": [{"raw": "Oct 12 14:09:11 fw2 deny src=10[.]40[.]7[.]21 dst=203[.]0[.]113[.]201 dport=443", "level": "err"}, {"raw": "Oct 12 14:15:11 fw2 deny src=10[.]40[.]7[.]21 dst=203[.]0[.]113[.]202 dport=8443", "level": "err"}, {"raw": "Oct 12 14:21:11 fw2 deny src=10[.]40[.]7[.]21 dst=203[.]0[.]113[.]201 dport=443", "level": "err"}, {"raw": "Oct 12 14:27:11 fw2 deny src=10[.]40[.]7[.]21 dst=203[.]0[.]113[.]202 dport=8443", "level": "err"}, {"raw": "Oct 12 14:33:11 fw2 deny src=10[.]40[.]7[.]21 dst=203[.]0[.]113[.]201 dport=443", "level": "err"}]}, {"kind": "text", "body": "<p><b>ARTEFACT 3 — Context:<\/b> APP-SRV02 runs the month-end billing job. Finance closes the books on Friday. Isolation interrupts billing for roughly four hours; the job can be re-run from snapshots after cleanup. <b>ARTEFACT 4 — Noise:<\/b> unrelated DHCP failures and a stuck printer queue in the same window; ignore them.<\/p>"}, {"kind": "note", "body": "Incomplete information: you do not know whether data was staged for theft, and the EDR console gives no verdict on the WinDefUpd service yet."}]}, "question": "Work the chain of four decisions.", "hint": "One artefact says 'stopped'. Another says 'still trying every six minutes'. Decide what containment really means before you answer step two — and remember what Friday means for finance.", "why": "The chain is ransomware-tooling on a critical host: credential theft (LSASS), persistence (account + service), C2 — with EDR blocking one channel while the firewall shows a fallback IP every six minutes. Blocked does not mean contained. The defensible call isolates the host now and re-runs billing from snapshots, because four hours of billing delay is recoverable and an uncontained foothold on the billing server is not. Evidence is preserved by exporting the relevant index data before remediation wipes anything.", "tip": "Study the ransomware precursor chain (credential access, persistence, C2) and practice writing the containment cost line: what breaks, for how long, and what is recoverable.", "steps": [{"question": "What does the artefact set support?", "options": ["A false positive from a legitimate software update process", "Malware on APP-SRV02 — one channel blocked, fallback C2 still live", "A misconfigured backup job retrying its destination server", "An insider legitimately copying billing archives out"], "correct": 1, "why": "LSASS access, a new temp-folder service, a new admin account, and periodic C2 attempts to two IPs form the ransomware precursor chain. A software update does not touch LSASS from user temp; backups retry known destinations; and no legitimate process beacons every six minutes to an undocumented pair of IPs."}, {"question": "EDR shows the C2 blocked; the firewall shows attempts continuing to a second IP every six minutes. Which reading do you trust for scope?", "options": ["The EDR block — blocking the channel equals containment", "Neither — wait for the antivirus verdict before reading anything", "The firewall pattern — blocked is not contained; a fallback is live", "The noise artefacts — printer and DHCP failures disprove the intrusion"], "correct": 2, "why": "Two signals contradict: 'blocked' (EDR) and 'still trying' (firewall). The firewall wins for scope because a blocked channel proves detection, not control — the malware is alive, switching endpoints, and only its egress attempts are visible. Waiting for an antivirus verdict concedes time to the operator; the noise events have no bearing on the chain."}, {"question": "The CISO needs a decision in ten minutes. Choose and defend it.", "options": ["Leave it online; EDR will keep blocking everything itself", "Shut down the entire server room until Monday morning", "Isolate APP-SRV02 now; re-run billing from snapshots later", "Reboot the server and continue billing as normal today"], "correct": 2, "why": "Isolation accepts a known, recoverable cost (four hours, re-run from snapshots) to stop an uncontained foothold on the billing server days before the books close. Leaving it online trusts one vendor against a live operator with a fallback channel. A server-room shutdown is collective punishment; a reboot preserves the persistence (service + admin account) and changes nothing."}, {"question": "Before remediation wipes the host, what preserves evidence for the breach coach?", "options": ["Export the relevant index results to a lookup, then image the host", "Delete the malicious events from the index to clean the data", "Email a few screenshots of the console to the case folder", "Nothing — the logs expire anyway, write that in the report"], "correct": 0, "why": "Chain of custody needs the original data: export the relevant searches to a lookup file and take a forensic image per policy before any wipe. Deleting events destroys evidence and is indefensible in scrutiny; screenshots are not evidence of content or completeness; 'logs expire' is an excuse, not a plan."}]}, {"id": "X2", "type": "terminal", "title": "Timed terminal: save the evidence", "theme": "Investigation Discipline", "summary": "Legal hold active, colleague suggests | delete — run the safe export instead", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p><b>Situation:<\/b> Incident #MH-4412 is confirmed. Legal has placed a hold on all data involving attacker IP 203[.]0[.]113[.]87 in <b>index=webproxy<\/b>. Your colleague offers to 'clean the index' with the <b>delete<\/b> command. The breach coach requires the evidence saved as a Splunk lookup named exactly <b>evidence_ir4412.csv<\/b>, using the owner account j.keller (you).<\/p>"}, {"kind": "text", "body": "<p><b>Objective stated as a legal goal:<\/b> the evidence must survive scrutiny — original events, exact file name, no destruction. <b>This terminal has its own 3-minute limit<\/b>, shown live in the exercise.<\/p>"}, {"kind": "note", "body": "Two commands are fighting in your head. One preserves, one destroys. Type the one that preserves and press Enter, then Submit."}]}, "question": "Type the safe command that exports every webproxy event for the attacker IP into the required lookup file.", "hint": "The constraint you may have missed: a legal hold means the original data must keep existing. The command must read events and write them out — nothing else.", "why": "<b>index=webproxy src_ip=203[.]0[.]113[.]87 | outputlookup evidence_ir4412.csv<\/b> reads the attacker's events and writes them to the required lookup: the originals stay in the index, the copy is timestamped and shareable with legal. The delete command is the trap: it needs the can_delete role, only masks events from search, and constitutes evidence destruction under a hold — permanently damaging the case. A bare search saves nothing. outputcsv would also work but is deprecated; the graded canonical form is outputlookup.", "tip": "Memorise the evidence pattern: filter + outputlookup. Treat | delete as a controlled capability you revoke, not a cleanup tool.", "terminal": {"prompt": "search>", "caseInsensitive": false, "accept": ["^index=webproxy src_ip=203\\[.\\]0\\[.\\]113\\[.\\]87 \\| [oO][uU][tT][pP][uU][tT][lL][oO][oO][kK][uU][pP] evidence_ir4412\\.csv$", "^src_ip=203\\[.\\]0\\[.\\]113\\[.\\]87 index=webproxy \\| [oO][uU][tT][pP][uU][tT][lL][oO][oO][kK][uU][pP] evidence_ir4412\\.csv$", "^index=webproxy src_ip=\"?203\\[.\\]0\\[.\\]113\\[.\\]87\"? \\| [oO][uU][tT][pP][uU][tT][lL][oO][oO][kK][uU][pP] evidence_ir4412\\.csv$"], "nearMiss": [{"re": "\\| *[dD][eE][lL][eE][tT][eE]", "msg": "DESTRUCTIVE: under a legal hold this is evidence destruction — delete only masks events and needs can_delete; the breach coach would be informed and the case damaged."}, {"re": "[oO][uU][tT][pP][uU][tT][lL][oO][oO][kK][uU][pP]", "msg": "Right command, wrong target — chain of custody requires the exact file name evidence_ir4412.csv."}, {"re": "[oO][uU][tT][pP][uU][tT][cC][sS][vV]", "msg": "outputcsv works but is deprecated; the case file names outputlookup as the canonical form."}, {"re": "^index=webproxy", "msg": "A bare search reads the evidence but saves nothing — nothing survives for legal."}], "outputs": [{"re": "outputlookup evidence_ir4412", "out": "1,284 events written to lookup evidence_ir4412.csv (owner: j.keller)\nOriginal events remain in index=webproxy. Hold reference MH-4412 attached in the case file."}, {"re": "\\| delete", "out": "You need the can_delete capability to run this command. WARNING: delete does not physically erase data and is logged in the _audit index."}], "fallbackOut": "0 results or a parser error. Read the objective again: read, filter, write out.", "syntaxPanel": "", "outputSample": "", "canonical": "index=webproxy src_ip=203[.]0[.]113[.]87 | outputlookup evidence_ir4412.csv", "canonicalExplain": [{"part": "index=webproxy", "why": "the index holding the attacker's web traffic"}, {"part": "src_ip=203[.]0[.]113[.]87", "why": "only the attacker's events, as named in the legal hold"}, {"part": "| outputlookup evidence_ir4412.csv", "why": "writes the result set into the required lookup file; original events stay untouched"}], "timeLimit": 180, "destructiveNote": "The delete command would have required can_delete, masked events from search, and destroyed the evidence trail under a legal hold. The audit trail of that attempt would itself have become part of the case."}}, {"id": "X3", "type": "steps", "title": "Two signals disagree", "theme": "Investigation Discipline", "summary": "VPN says session, EDR says silence — decide which signal wins and why", "collapse": true, "scenario": {"blocks": [{"kind": "logview", "label": "ARTEFACT 1 — VPN concentrator log", "filterable": true, "lines": [{"raw": "Oct 12 02:13:07 vpn1 auth: user=r.okafor src=203[.]0[.]113[.]60 country=US-baseline-EXCEPTION result=success mfa=push-approved", "level": "warn"}, {"raw": "Oct 12 02:13:40 vpn1 session: r.okafor connected, split-tunnel, postured=partial", "level": "info"}]}, {"kind": "table", "label": "ARTEFACT 2 — EDR console, R-OKAFOR-LT", "headers": ["Field", "Value"], "rows": [["Agent status", "Last check-in 3 days ago"], ["Session events", "None in the last 24 hours"], ["Risk framework", "Account r.okafor flagged high risk (new source, 02:13)"]]}, {"kind": "note", "body": "Baseline: r.okafor logs in from one US metro, work hours only, never 02:13. The laptop agent has been dark for three days — no telemetry exists to prove or disprove local activity."}]}, "question": "Resolve the conflict, then choose the action.", "hint": "One signal has data; the other has an empty set. An empty set from a dark agent proves nothing — and the MFA push was approved by something.", "why": "The VPN log is positive evidence: a successful, MFA-approved session from an anomalous source at an anomalous hour. The EDR silence is an <b>absence of telemetry<\/b> (agent dark for three days), not evidence of absence. Positive data outweighs a gap: treat as possible compromise. The proportionate response is containment with investigation: disable the account, revoke sessions and tokens, and reach the user out-of-band. Emailing and waiting leaves the session live; allowlisting the source cements the attacker's access; rebooting the concentrator evicts everyone and nothing else.", "tip": "Write the sentence in your notes: absence of telemetry is not evidence of safety. Then drill the containment sequence for identity compromise.", "steps": [{"question": "Which statement is best supported by the artefacts?", "options": ["EDR shows nothing, so nothing happened on the laptop", "The VPN log must be wrong because EDR would show it", "The login is real per the logs; EDR silence is a telemetry gap", "It is certainly the user, because the MFA push passed"], "correct": 2, "why": "Positive logs (session established, push approved) are evidence; an offline agent produces an empty set, which cannot prove anything. MFA approval is not identity proof when a token database or a fatigued user can be abused — it is one signal among several."}, {"question": "Choose the immediate action.", "options": ["Email the user and wait for their reply before anything else", "Disable the account, revoke its sessions, contact out-of-band", "Add the source IP to the VPN allowlist for the night", "Reboot the VPN concentrator to kill all sessions"], "correct": 1, "why": "Contain first, then investigate: disable and revoke kills the stolen session everywhere, and out-of-band contact (phone, in person) tests the user hypothesis without tipping off an attacker who might hold the mailbox. Emailing waits on the possibly-compromised channel, allowlisting rewards the attacker, and a reboot disrupts every remote worker for nothing."}]}, {"id": "X4", "type": "steps", "title": "The 92-risk service account", "theme": "Investigation Discipline", "summary": "svc_backup screams at 21:40 on patch night — the correct answer may be to touch nothing yet", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — Risk and context", "headers": ["Source", "Signal"], "rows": [["Risk rules", "svc_backup risk score 92: failed logins against 40 hosts in 6 minutes"], ["CMDB", "svc_backup = enterprise backup service account"], ["Ops calendar", "Monthly full-backup sweep scheduled tonight 21:30–23:00"], ["Chat", "Colleague: 'block it now!!'"], ["Incomplete", "Change ticket for tonight's sweep exists but is not linked in the risk event yet"]]}, {"kind": "note", "body": "Friday 21:40. If the account is wrong, backups fail silently for the whole estate tonight. If the account is right and you block it, the same happens."}]}, "question": "Choose the decision you can defend on Monday.", "hint": "Restate the constraint: this exact account does a noisy 40-host sweep every month at this exact time — who can confirm it fastest, and what does blocking cost if they confirm in ten minutes?", "why": "The pattern (one service account, 40 hosts, six minutes, scheduled sweep window) matches the documented monthly backup job, and the confirming artefact is one phone call away. Blocking now would fail the enterprise backup run silently — a real business cost — on evidence that is currently circumstantial. The senior answer is to touch nothing yet: verify with the backup owner and the change calendar, annotate the risk event with that context, and set a hard tripwire — if the pattern continues past 23:00 or confirms wrong, containment fires. 'Block now' is the alarming shortcut; 'ignore service accounts permanently' disables the framework forever.", "tip": "Practice the annotate-verify-tripwire pattern for known-noisy automation. It is the opposite of ignoring: it is controlled patience with a deadline.", "steps": [{"question": "Decision?", "options": ["Block svc_backup immediately at the firewall tonight", "Disable the account for the whole weekend to be safe", "Add a permanent suppression for all service-account risk", "Verify with the backup owner and calendar, annotate, set a tripwire"], "correct": 3, "why": "Verify-annotate-tripwire costs ten minutes and preserves both the investigation and tonight's backups. Immediate blocking on circumstantial evidence risks a silent enterprise-wide backup failure; a weekend disable is the same failure with extra days; a permanent suppression would blind the framework to a genuinely hijacked service account later."}]}, {"id": "X5", "type": "qcm", "title": "Disk at 96% during an incident", "theme": "Administration & Health", "summary": "The cluster is full, the investigation needs data — pick the move that survives review", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — Monitoring console, indexer cluster", "headers": ["Metric", "Value"], "rows": [["Cluster disk usage", "96% and rising"], ["_internal + debug sourcetypes", "38% of daily ingest volume"], ["Security data", "62% of daily ingest volume, must keep flowing"], ["Context", "Active incident #MH-4412; capacity project approved for next quarter"]]}]}, "question": "Which action do you take now?", "hint": "You cannot stop the security data. So what inside the 96% is not security data, and where can it go fastest?", "why": "Routing the <b>debug and diagnostic sourcetypes<\/b> (part of that 38%) to a short-retention index or nullQueue frees volume tonight without losing a single security event — the least-bad move that keeps the investigation's eyes open. Stopping security ingestion creates a blind spot during an active incident, the opposite of what you were hired for. Deleting old security indexes destroys evidence and history. Raising retention keeps more data, not less — it accelerates the full disk. Capacity planning remains right, but it is next quarter.", "tip": "In a crunch, rank data by investigative value and route the bottom of the list to nullQueue or tiny retention. Review the routing after the incident — it is a temporary lever.", "qcm": {"multi": false, "correct": 2, "options": ["Stop all security data ingestion until new storage is added", "Delete old security indexes to free space right now", "Route debug and diagnostic sourcetypes to nullQueue or tiny retention", "Raise frozen retention on every index to hold even more data"]}}, {"id": "X6", "type": "steps", "title": "Tune the impossible-travel machine", "theme": "Security Operations", "summary": "CS-12 fires 420 notables a week at 12% true — convert to risk, then fix the VPN pool detail", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — CS-12 'impossible travel', last 30 days", "headers": ["Metric", "Value"], "rows": [["Notables raised", "420 (about 60 a week)"], ["True positives", "12% — mostly shared-IP artifacts"], ["Known artifact", "Most false positives share one corporate VPN egress pool"], ["Analyst impact", "Queue trust dropping; real notables get skimmed"]]}]}, "question": "Fix the machine in two moves.", "hint": "You want fewer, richer alerts — not a bigger rule and not a switched-off rule. And the second move is about context: what makes a shared egress IP meaningless as evidence?", "why": "Risk-based alerting converts the noisy rule into a quiet accumulator: the rule <b>adds risk<\/b> to a user or asset each time it fires, and only crossing a risk threshold raises a notable — analysts get fewer, context-rich cases. Raising the threshold by half still buries analysts and doubles the miss rate; suppressing the rule entirely discards a true detector; hiring analysts buys nothing but cost. Inside the framework, the shared VPN pool is fixed by <b>lowering the risk contribution when the source is a known corporate egress IP<\/b> — context-aware scoring, not blind counting. Static scores and switching off VPN logging destroy the signal instead of shaping it.", "tip": "Draw the RBA loop: rule fires, risk added, threshold crossed, notable raised with aggregated context. Then map every tuning question onto 'shape the score', never 'shape the truth'.", "steps": [{"question": "Which fix best matches risk-based alerting?", "options": ["Raise the CS-12 threshold to cut the alert volume by half", "Convert CS-12 to risk events that alert when a threshold is crossed", "Suppress CS-12 for all users until it is retuned", "Hire two more analysts for the alert queue instead"], "correct": 1, "why": "RBA keeps the detector working but delays the human cost until risk aggregates — fewer, richer notables. A higher threshold trades false positives for false negatives at scale; suppression discards true detections; analysts alone scale cost, not signal."}, {"question": "The shared VPN egress pool causes most false positives. What prevents them inside the risk framework?", "options": ["Give every user a static risk score of 100 forever", "Turn off VPN log ingestion so the rule cannot fire", "Alert on every risk event as before, but into a new queue", "Lower the risk contribution for known corporate egress IPs"], "correct": 3, "why": "Context-aware scoring: a shared egress IP is weak evidence, so it contributes little risk; a unique source contributes a lot. Static scores make risk meaningless, losing VPN logging blinds impossible-travel entirely, and moving alerts to a new queue changes nothing about the volume."}]}, {"id": "X7", "type": "steps", "title": "Three forwarders went dark", "theme": "Administration & Health", "summary": "HEC timeouts, full queues — is the data lost? Prove it before you write it", "collapse": true, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — 03:12, monitoring console", "headers": ["Signal", "Reading"], "rows": [["Forwarders dark", "3 HEC senders stopped acknowledging (app servers A, B, C)"], ["_internal", "HTTP Event Collector acknowledgements timing out"], ["Indexer queue", "Parsing queue full, sustained"], ["Forwarder metrics", "blocked=0 on all three senders — disk queues holding"], ["Unknown", "Whether events older than the disk-queue cap were dropped"]]}]}, "question": "Read the outage correctly, then restore in the right order.", "hint": "Nothing is lost until you prove it is lost: where does data sit first on a forwarder with persistent queues? And which number proves the gap — the forwarder's, or the source system's own count?", "why": "blocked=0 with disk queues holding means the senders are <b>buffering, not dropping<\/b> — the data most likely sits on the forwarders, and the only honest way to declare a gap is to compare forwarded counts against the source systems' own counts after restore. Restoring means freeing queue pressure (route non-critical volume away) before the HEC path can drain, then verifying counts. Restarting everything at once risks dropping buffered data; re-sending everything manually duplicates events; declaring loss now is writing fiction into the incident report.", "tip": "For collection outages, learn the forwarder queue order (in-memory, then disk when persistent queues are on) and the verify-vs-source-count ritual.", "steps": [{"question": "What is the best-supported reading of the outage?", "options": ["Data is lost forever — write the gap into the report right now", "Data will appear by itself once the network feels better", "Data is likely buffered on the forwarders; prove any gap first", "The indexers are under attack — the full queues prove it"], "correct": 2, "why": "blocked=0 plus holding disk queues means buffering, not loss. Loss is only provable by comparing delivered counts with the source systems' counts. A full parsing queue is a capacity symptom, not attack evidence, and 'will appear by itself' is not an engineering position."}, {"question": "Restoration order?", "options": ["Restart every component at once and hope for the best", "Free queue pressure, restore the HEC path, then verify source counts", "Manually re-send all data from the source systems first", "Declare the data loss in the report, then look at queues"], "correct": 1, "why": "The indexer queues must drain before acknowledgements can resume, so pressure goes first; then the HEC path comes back and buffered data flows; then counts are reconciled against the sources — the only defensible proof of what was or was not lost. Mass restarts can drop buffers, manual re-send duplicates, and premature loss declarations rewrite themselves later in the review."}]}, {"id": "X8", "type": "steps", "title": "The admin who searched at 02:41", "theme": "Searching & SPL", "summary": "The _audit index shows the Splunk admin account mapping detections — and a new saved search", "collapse": true, "scenario": {"blocks": [{"kind": "logview", "label": "ARTEFACT 1 — index=_audit, 02:41–02:47", "filterable": true, "lines": [{"raw": "Oct 12 02:41:03 audittrail: user=svc-splunkadm action=search request=\"index=* sourcetype=fw src_ip=203[.]0[.]113[.]87\"", "level": "warn"}, {"raw": "Oct 12 02:44:19 audittrail: user=svc-splunkadm action=search request=\"| rest /services/saved/searches\"", "level": "warn"}, {"raw": "Oct 12 02:45:02 audittrail: user=svc-splunkadm action=search request=\"index=notables earliest=-7d\"", "level": "warn"}, {"raw": "Oct 12 02:47:44 audittrail: user=svc-splunkadm action=edit_savedsearch name=\"Health Check 7\" cron=*/30min search=\"index=_audit | delete\"", "level": "err"}]}, {"kind": "code", "label": "ARTEFACT 2 — authorize.conf excerpt (role svc_adm_role)", "body": "[role_svc_adm_role]\nsrchIndexesAllowed = *\ncapabilities = admin, can_delete", "labelConf": true}, {"kind": "note", "body": "svc-splunkadm is a shared service admin account. The 02:41 search targets exactly the attacker IP from incident #MH-4412. Nobody from the platform team is on shift."}]}, "question": "Read the tampering, then order the response.", "hint": "Restate the constraints: the account can delete audit data, and the new saved search runs every 30 minutes. What do you protect first — and what must you never run to 'check' it?", "why": "A compromised Splunk admin account is mapping what the SOC knows about the attacker (search for their IP), inventorying detections (rest on saved searches), and building <b>persistence plus evidence destruction<\/b>: a scheduled 'Health Check 7' running delete against _audit every 30 minutes, legal because the role carries can_delete. The response order protects evidence first: disable the account (stop the operator), then audit saved searches and role grants (find persistence), then rotate credentials. Running the saved search to 'see what it does' deletes audit data — the exact attacker goal. 'Only rotate after hours' leaves a live operator with delete rights.", "tip": "Audit your own estate for can_delete and shared admin accounts: it is the one capability that turns a Splunk compromise into an evidence-loss event.", "steps": [{"question": "What is happening?", "options": ["A routine platform health check run by the admin team", "A compromised admin account mapping detections and arming persistence", "A license audit job that enumerates saved searches", "Normal Enterprise Security maintenance work at 02:41"], "correct": 1, "why": "The search targets the incident's attacker IP, then enumerates detections, then creates a scheduled delete-capable search — a health check does not enumerate what the SOC knows about an active intrusion, and no platform work is scheduled. The cron persistence plus can_delete makes it operator-controlled evidence destruction."}, {"question": "First action, in the right order?", "options": ["Run the new saved search once to see what it does", "Only rotate the password after business hours end", "Disable the account, review persistence, then rotate credentials", "Delete the _audit events from 02:41 to remove the traces"], "correct": 2, "why": "Disabling the account cuts the operator's access first; reviewing saved searches and capabilities finds the persistence before it fires; rotation follows. Executing the saved search deletes audit data — the attacker's goal, done for them. After-hours rotation leaves a live operator with delete rights; deleting _audit destroys your own best evidence."}]}, {"id": "X9", "type": "qcm", "title": "License pool on fire", "theme": "Administration & Health", "summary": "Post-acquisition pool math collides with an active fraud investigation", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — Licensing, post-acquisition", "headers": ["Pool", "Status"], "rows": [["Pay-Prod", "At 100% of daily quota, 6 days running — warnings active"], ["Pay-Dev", "30% used"], ["Legacy-Acq", "55% used, separate pool, different team"], ["Context", "Fraud investigation #MH-4412 needs Pay-Prod search over 90 days"]]}]}, "question": "Which decision survives both the review and the investigation?", "hint": "Two constraints must both hold: the investigation's data keeps flowing, and the quota problem actually gets fixed. Which option does both?", "why": "Rebalancing or consolidating pools and adding short-term capacity fixes the quota while every event keeps flowing — the only option where the investigation and the licensing review both end well. Stopping security ingestion to stay under quota trades a paperwork problem for an investigative blind spot; moving the investigation to a laptop instance fragments the evidence and its chain of custody; ignoring warnings assumes modern Splunk never enforces anything, and leaves the pool broken for the next incident.", "tip": "License hygiene after acquisitions: audit pools quarterly, and never let quota pressure touch security data paths during an active case.", "qcm": {"multi": false, "correct": 3, "options": ["Temporarily stop security ingestion to stay under quota", "Move the investigation to a laptop Splunk instance", "Ignore the warnings; data always keeps flowing regardless", "Rebalance pools and add short-term capacity; ingestion never stops"]}}, {"id": "X10", "type": "order", "title": "Rank the morning: six fires, one analyst", "theme": "Investigation Discipline", "summary": "The CISO wants your order — drag the six items into priority sequence", "collapse": false, "scenario": {"blocks": [{"kind": "text", "body": "<p>09:00 at Meridian Health. All six items are real, all six are yours. The CISO asked for one sentence of justification per rank — build the order first.<\/p>"}, {"kind": "table", "label": "ARTEFACT 1 — The queue", "headers": ["Tag", "Item"], "rows": [["A", "New local admin on a payment server, 12 minutes ago"], ["B", "Executive dashboard request for next week"], ["C", "License pool warning email from this morning"], ["D", "New mail source failed to onboard 2 hours ago — audit evidence gap"], ["E", "VPN brute-force alert — source already auto-blocked, needs verification"], ["F", "Quarterly detection-tuning backlog review"]]}]}, "question": "Drag the six items into the order you work them.", "hint": "What burns right now beats what verifies automatically, beats what breaks trust in data, beats platform hygiene, beats requests, beats planning. Two items are internal threats to evidence quality — where do they land?", "why": "<b>A<\/b> first: an active local-admin change on a payment server is a possible live intrusion — minutes matter. <b>E<\/b> second: verify the auto-block worked; automated controls fail silently. <b>D<\/b> third: a two-hour onboarding gap is an evidence hole that grows — restore visibility. <b>C<\/b> fourth: license warnings threaten future capacity, not this morning. <b>B<\/b> fifth: stakeholder work schedules around real work. <b>F<\/b> last: quarterly planning never outranks an active morning.", "tip": "Ranking ritual: active threat, then verify automated actions, then data-visibility gaps, then platform hygiene, then requests, then planning. Defend each rank in one sentence.", "order": {"items": ["A — new local admin on a payment server (12 min ago)", "E — verify the auto-blocked VPN brute-force source", "D — failed onboarding: audit evidence gap, 2 hours old", "C — license pool warning email", "B — executive dashboard request for next week", "F — quarterly detection-tuning backlog review"]}}, {"id": "X11", "type": "qcm", "title": "Search head architecture call", "theme": "Platform & Architecture", "summary": "ES rollout: HA required, budget tight — the wrong member count is the near-miss", "collapse": false, "scenario": {"blocks": [{"kind": "table", "label": "ARTEFACT 1 — Requirements", "headers": ["Constraint", "Value"], "rows": [["High availability", "Mandatory — SOC cannot lose search capability"], ["Budget", "Tight; hardware asks reviewed line by line"], ["Current plan", "Enterprise Security rollout on a single standalone search head"], ["Ops reality", "Small team, wants minimum moving parts that still meet HA"]]}]}, "question": "Which architecture do you approve?", "hint": "Clusters vote. Count the members that must agree — and then ask which option quietly reintroduces a single point of failure.", "why": "A <b>three-member search head cluster<\/b> is the smallest configuration that gives real HA: clusters need quorum, quorum needs a majority, and three is the minimum odd count that survives one member failing. Two members cannot vote safely — a network split produces split-brain, the 'save money' near-miss that fails the HA requirement it was bought for. One large standalone node is a single point of failure with nightly backups as a fig leaf. Five members meets HA but doubles the operating surface and cost beyond what a small team can run.", "tip": "Remember the rule: quorum needs a majority, majorities need odd numbers, and the minimum viable cluster is three.", "qcm": {"multi": false, "correct": 1, "options": ["A two-member cluster to save hardware cost", "A search head cluster with three members", "One large standalone search head with nightly backups", "A five-member cluster for extra redundancy"]}}];
