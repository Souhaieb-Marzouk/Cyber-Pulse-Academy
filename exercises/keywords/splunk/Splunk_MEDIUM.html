    });
  }

  // ---------- widget: match ----------
  function renderMatchWidget(ex) {
    var st = S.exState;
    var left = ex.match.left.map(function (t, i) {
      var tag = st.pairs[i] != null ? '<span class="pairtag">&rarr; ' + LETTERS[st.pairs[i]] + '</span>' : '';
      return '<button type="button" class="mitem' + (st.selLeft === i ? ' sel' : '') + '" data-li="' + i + '">' + esc(t) + tag + '</button>';
    }).join('');
    var right = st.right.map(function (r, i) {
      return '<button type="button" class="mitem" data-ri="' + i + '"><span class="key">' + LETTERS[i] + '.</span> ' + esc(r.text) + '</button>';
    }).join('');
    return '<div class="match-grid"><div><p class="mhead">Items</p>' + left + '</div><div><p class="mhead">Meanings</p>' + right + '</div></div>' +
      '<p class="muted small">Tap an item on the left, then its meaning on the right. Tap a paired item to unpair it.</p>';
  }
  function wireMatch() {
    $all('#widget .mitem').forEach(function (m) {
      m.addEventListener('click', function () {
        var li = m.getAttribute('data-li'), ri = m.getAttribute('data-ri');
        if (li != null) {
          li = parseInt(li, 10);
          if (S.exState.pairs[li] != null) { delete S.exState.pairs[li]; S.exState.selLeft = null; }
          else { S.exState.selLeft = li; }
        } else if (ri != null) {
          ri = parseInt(ri, 10);
          if (S.exState.selLeft == null) { toast('Pick an item on the left first'); return; }
          for (var k in S.exState.pairs) { if (S.exState.pairs[k] === ri) delete S.exState.pairs[k]; }
          S.exState.pairs[S.exState.selLeft] = ri;
          S.exState.selLeft = null;
        }
        rerenderWidget();
      });
    });
  }

  // ---------- widget: order ----------
  function renderOrderWidget(ex) {
    var st = S.exState;
    var html = '<div class="ord" id="ordList">';
    st.cur.forEach(function (itemIdx, pos) {
      html += '<div class="ord-item" draggable="true" data-pos="' + pos + '">' +
        '<span class="idx">' + (pos + 1) + '</span>' +
        '<span class="txt">' + esc(ex.order.items[itemIdx]) + '</span>' +
        '<button type="button" class="mini" data-up="' + pos + '" aria-label="move up">&#9650;</button>' +
        '<button type="button" class="mini" data-down="' + pos + '" aria-label="move down">&#9660;</button>' +
        '</div>';
    });
    html += '</div><p class="muted small">Drag rows or use the arrows. First row = first step.</p>';
    return html;
  }
  function wireOrder(ex) {
    function move(pos, dir) {
      var st = S.exState;
      var np = pos + dir;
      if (np < 0 || np >= st.cur.length) return;
      var t = st.cur[pos]; st.cur[pos] = st.cur[np]; st.cur[np] = t;
      rerenderWidget();
    }
    $all('[data-up]').forEach(function (b) {
      b.addEventListener('click', function () { move(parseInt(b.getAttribute('data-up'), 10), -1); });
    });
    $all('[data-down]').forEach(function (b) {
      b.addEventListener('click', function () { move(parseInt(b.getAttribute('data-down'), 10), 1); });
    });
    var list = $('#ordList');
    if (!list) return;
    var dragPos = null;
    list.addEventListener('dragstart', function (e) {
      var it = e.target.closest('.ord-item');
      if (!it) return;
      dragPos = parseInt(it.getAttribute('data-pos'), 10);
      it.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', String(dragPos)); } catch (err) { }
    });
    list.addEventListener('dragend', function (e) {
      $all('.ord-item').forEach(function (x) { x.classList.remove('dragging'); });
    });
    list.addEventListener('dragover', function (e) { e.preventDefault(); });
    list.addEventListener('drop', function (e) {
      e.preventDefault();
      var it = e.target.closest('.ord-item');
      if (!it || dragPos == null) return;
      var to = parseInt(it.getAttribute('data-pos'), 10);
      var st = S.exState;
      var moved = st.cur.splice(dragPos, 1)[0];
      st.cur.splice(to, 0, moved);
      dragPos = null;
      rerenderWidget();
    });
  }

  // ---------- widget: categorize ----------
  function renderCategorizeWidget(ex) {
    var st = S.exState;
    var bankItems = st.bank.filter(function (i) { return !placedOn(i); }).map(function (i) {
      return '<button type="button" class="chip' + (st.selItem === i ? ' sel' : '') + '" data-item="' + i + '">' + esc(ex.categorize.items[i]) + '</button>';
    }).join('');
    var html = '<div class="bankzone" id="catBank"><span class="art-label">Item bank &mdash; tap an item, then tap its zone (or drag it)</span>' +
      (bankItems || '<span class="muted small">All items placed. Tap an item in a zone to move it back.</span>') + '</div><div class="zones">';
    ex.categorize.zones.forEach(function (z, zi) {
      html += '<div class="zone" data-zi="' + zi + '"><h4>' + esc(z.label) + '</h4><div class="zitems">' +
        st.zones[zi].map(function (i) {
          return '<button type="button" class="chip' + (st.selItem === i ? ' sel' : '') + '" data-item="' + i + '">' + esc(ex.categorize.items[i]) + '</button>';
        }).join('') + '</div></div>';
    });
    html += '</div>';
    return html;
  }
  function placedOn(i) {
    for (var z = 0; z < S.exState.zones.length; z++) {
      if (S.exState.zones[z].indexOf(i) !== -1) return true;
    }
    return false;
  }
  function wireCategorize(ex) {
    $all('#widget .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        var i = parseInt(c.getAttribute('data-item'), 10);
        S.exState.selItem = (S.exState.selItem === i) ? null : i;
        rerenderWidget();
      });
      c.setAttribute('draggable', 'true');
      c.addEventListener('dragstart', function (e) {
        S.exState.selItem = parseInt(c.getAttribute('data-item'), 10);
        try { e.dataTransfer.setData('text/plain', 'item'); } catch (err) { }
      });
    });
    $all('#widget .zone').forEach(function (z) {
      z.addEventListener('click', function () { placeSel(parseInt(z.getAttribute('data-zi'), 10)); });
      z.addEventListener('dragover', function (e) { e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', function () { z.classList.remove('over'); });
      z.addEventListener('drop', function (e) {
        e.preventDefault(); z.classList.remove('over');
        placeSel(parseInt(z.getAttribute('data-zi'), 10));
      });
    });
    var bank = $('#catBank');
    if (bank) {
      bank.addEventListener('dragover', function (e) { e.preventDefault(); });
      bank.addEventListener('drop', function (e) {
        e.preventDefault();
        if (S.exState.selItem == null) return;
        var i = S.exState.selItem;
        S.exState.zones.forEach(function (arr) {
          var p = arr.indexOf(i);
          if (p !== -1) arr.splice(p, 1);
        });
        S.exState.selItem = null;
        rerenderWidget();
      });
    }
  }
  function placeSel(zi) {
    var st = S.exState;
    if (st.selItem == null) { toast('Tap an item first, then its zone'); return; }
    var i = st.selItem;
    st.zones.forEach(function (arr) {
      var p = arr.indexOf(i);
      if (p !== -1) arr.splice(p, 1);
    });
    st.zones[zi].push(i);
    st.selItem = null;
    rerenderWidget();
  }

  // ---------- widget: terminal ----------
  function renderTerminalWidget(ex) {
    var st = S.exState;
    var t = ex.terminal;
    var html = '';
    if (t.syntaxPanel) {
      html += '<div class="term-panel"><div class="ttl">Syntax reminder</div>' + t.syntaxPanel + '</div>';
    }
    if (t.outputSample) {
      html += '<div class="term-panel"><div class="ttl">Expected output shape</div><pre class="code" style="margin:6px 0 0">' + esc(t.outputSample) + '</pre></div>';
    }
    if (t.timeLimit) {
      html += '<div><span class="term-count">&#9201; This terminal has its own limit: <b id="termCount">' + fmtTime(t.timeLimit) + '</b></span></div>';
    }
    html += '<div class="term"><div class="term-out" id="termOut">' +
      (st.lines.length ? st.lines.map(function (l) { return esc(l); }).join('\n') : esc(t.welcome || 'Splunk Search Head ready. Type your search and press Enter.')) +
      '</div><div class="term-in"><span class="pr">' + esc(t.prompt || 'search&gt;') + '</span>' +
      '<input type="text" id="termIn" aria-label="Type your search command" autocomplete="off" spellcheck="false">' +
      '<button type="button" class="btn" id="termRun">Run</button></div></div>' +
      '<p class="muted small">This is a simulation. Nothing real is executed. Press Enter or Run to execute, then press Submit when you believe the last command you ran is correct.</p>';
    return html;
  }
  function normCmd(s, ci) {
    s = String(s || '').trim().replace(/\s+/g, ' ').replace(/\s*\|\s*/g, ' | ').replace(/;\s*$/, '');
    if (ci) s = s.toLowerCase();
    return s;
  }
  function wireTerminal(ex) {
    var t = ex.terminal;
    var st = S.exState;
    var inp = $('#termIn');
    function run() {
      var raw = inp.value;
      if (!raw.trim()) return;
      var n = normCmd(raw, t.caseInsensitive);
      S.exState.lines.push((t.prompt || 'search>').replace(/&gt;/, '>') + ' ' + raw.trim());
      var out = t.fallbackOut;
      for (var i = 0; i < t.outputs.length; i++) {
        var re = new RegExp(t.outputs[i].re, t.caseInsensitive ? 'i' : '');
        if (re.test(n)) { out = t.outputs[i].out; break; }
      }
      S.exState.lines.push(out);
      S.exState.lastCmd = n;
      $('#termOut').textContent = S.exState.lines.join('\n');
      $('#termOut').scrollTop = $('#termOut').scrollHeight;
      inp.value = '';
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    $('#termRun').addEventListener('click', run);
    inp.focus();
    if (t.timeLimit) {
      var iv = setInterval(function () {
        if (S.finished || S.exState.done) { clearInterval(iv); return; }
        var left = Math.round((st.deadline - Date.now()) / 1000);
        var c = $('#termCount');
        if (c) c.textContent = fmtTime(left);
        if (left <= 0) {
          clearInterval(iv);
          toast('Terminal time is over');
          gradeCurrent();
        }
      }, 500);
      S.cardTimers.push(iv);
    }
  }

  // ---------- widget: steps ----------
  function renderStepsWidget(ex) {
    var st = S.exState;
    var opts = st.stepOpts[st.step];
    return opts.map(function (o, i) {
      var sel = st.stepSel[st.step] === i;
      return '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-i="' + i + '"><span class="key">' + LETTERS[i] + '.</span><span>' + esc(o.text) + '</span></button>';
    }).join('');
  }
  function wireStepQcm(ex) {
    $all('#widget .opt').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-i'), 10);
        S.exState.stepSel[S.exState.step] = i;
        $all('#widget .opt').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
  }

  // ---------- submit buttons ----------
  function submitButtonsHtml(ex) {
    var label = 'Submit answer';
    if (ex.type === 'steps') {
      label = (S.exState.step === ex.steps.length - 1) ? 'Submit final step' : 'Submit step ' + (S.exState.step + 1);
    }
    return '<button id="submitBtn" class="btn primary">' + label + '</button>';
  }
  function rerenderWidget() {
    var ex = curEx();
    var w = $('#widget');
    if (!w) return;
    if (ex.type === 'qcm' || ex.type === 'multi') { w.innerHTML = renderQcmWidget(ex); wireWidget(ex); }
    else if (ex.type === 'fill') { w.innerHTML = renderFillWidget(ex); wireWidget(ex); }
    else if (ex.type === 'match') { w.innerHTML = renderMatchWidget(ex); wireWidget(ex); }
    else if (ex.type === 'order') { w.innerHTML = renderOrderWidget(ex); wireWidget(ex); }
    else if (ex.type === 'categorize') { w.innerHTML = renderCategorizeWidget(ex); wireWidget(ex); }
    else if (ex.type === 'steps') { w.innerHTML = renderStepsWidget(ex); wireWidget(ex); }
  }
  function renderWidget(ex) {
    switch (ex.type) {
      case 'qcm': case 'multi': return renderQcmWidget(ex);
      case 'fill': return renderFillWidget(ex);
      case 'match': return renderMatchWidget(ex);
      case 'order': return renderOrderWidget(ex);
      case 'categorize': return renderCategorizeWidget(ex);
      case 'terminal': return renderTerminalWidget(ex);
      case 'steps': return renderStepsWidget(ex);
    }
    return '';
  }

  // ============================== grading ==============================
  function gradeCurrent() {
    var ex = curEx();
    if (S.exState.done) return;
    var hintPenalty = S.hintUsed[ex.id];
    if (ex.type === 'steps') {
      var st = S.exState;
      var s = st.step;
      var chosen = st.stepSel[s];
      var okS = chosen != null && st.stepOpts[s][chosen].orig === ex.steps[s].correct;
      st.stepOk[s] = okS;
      var last = s === ex.steps.length - 1;
      if (last) {
        var allOk = st.stepOk.every(function (v) { return v === true; });
        var earnedS = allOk ? (hintPenalty ? 90 : 100) : 0;
        S.points += earnedS;
        if (allOk) S.correctCount++;
        S.exState.done = true;
        S.results.push({
          id: ex.id, title: ex.title, theme: ex.theme || 'General',
          verdict: allOk ? 'correct' : 'incorrect',
          hintUsed: hintPenalty, earned: earnedS,
          your: ex.steps.map(function (sp, si) { return 'Step ' + (si + 1) + ': ' + (st.stepSel[si] == null ? '(no answer)' : st.stepOpts[si][st.stepSel[si]].text); }).join(' | '),
          correct: ex.steps.map(function (sp) { return sp.options[sp.correct]; }).join(' | '),
          why: ex.why, tip: ex.tip
        });
        var p2 = S.skipped.indexOf(ex.id);
        if (p2 !== -1) S.skipped.splice(p2, 1);
      }
      showFeedback(ex, {
        ok: okS,
        stepLevel: true,
        your: chosen == null ? 'No answer selected.' : st.stepOpts[s][chosen].text,
        correct: ex.steps[s].options[ex.steps[s].correct],
        why: ex.steps[s].why,
        tip: ex.tip
      }, last ? (S.results[S.results.length - 1].earned) : 0, hintPenalty);
      updateHeader();
      return;
    }
    var g = grade(ex);
    S.exState.done = true;
    var earned = g.ok ? (hintPenalty ? 90 : 100) : 0;
    S.points += earned;
    if (g.ok) S.correctCount++;
    var rec = {
      id: ex.id, title: ex.title, theme: ex.theme || 'General',
      verdict: g.ok ? 'correct' : 'incorrect',
      hintUsed: hintPenalty, earned: earned,
      your: g.your, correct: g.correct, why: g.why, tip: g.tip
    };
    S.results.push(rec);
    var p = S.skipped.indexOf(ex.id);
    if (p !== -1) S.skipped.splice(p, 1);
    showFeedback(ex, g, earned, hintPenalty);
    updateHeader();
    var sb = $('#submitBtn');
    if (sb) sb.disabled = true;
  }

  function grade(ex) {
    var st = S.exState;
    if (ex.type === 'qcm' || ex.type === 'multi') {
      var selOk;
      if (ex.qcm.multi) {
        var want = ex.qcm.correct.slice().sort().join(',');
        var got = st.sel.slice().sort().join(',');
        selOk = want === got && st.sel.length > 0;
      } else {
        selOk = st.sel != null && st.opts[st.sel].orig === ex.qcm.correct;
      }
      return {
        ok: selOk,
        your: st.sel == null || (ex.qcm.multi && st.sel.length === 0) ? 'No answer selected.' :
          (ex.qcm.multi ? st.sel.map(function (i) { return st.opts[i].text; }).join('; ') : st.opts[st.sel].text),
        correct: ex.qcm.multi ? ex.qcm.correct.map(function (i) { return ex.qcm.options[i]; }).join('; ') : ex.qcm.options[ex.qcm.correct],
        why: ex.why, tip: ex.tip
      };
    }
    if (ex.type === 'fill') {
      var allOk = true, got = [];
      st.blanks.forEach(function (wi, bi) {
        if (wi == null) { allOk = false; got.push('(empty)'); return; }
        var w = st.bank[wi].w.trim();
        got.push(w);
        if (w.toLowerCase() !== String(ex.fill.answers[bi]).trim().toLowerCase()) allOk = false;
      });
      return {
        ok: allOk,
        your: got.join(' | ') || 'No blanks filled.',
        correct: ex.fill.parts.map(function (p) { return typeof p === 'string' ? p : '**' + ex.fill.answers[p.b - 1] + '**'; }).join(''),
        why: ex.why, tip: ex.tip
      };
    }
    if (ex.type === 'match') {
      var n = ex.match.left.length, ok = true;
      var your = [], corr = [];
      for (var i = 0; i < n; i++) {
        corr.push(ex.match.left[i] + ' \u2192 ' + ex.match.right[ex.match.solution[i]]);
        if (st.pairs[i] == null) { ok = false; your.push(ex.match.left[i] + ' \u2192 (not matched)'); }
        else {
          your.push(ex.match.left[i] + ' \u2192 ' + ex.match.right[st.right[st.pairs[i]].orig]);
          if (st.right[st.pairs[i]].orig !== ex.match.solution[i]) ok = false;
        }
      }
      return { ok: ok, your: your.join('; '), correct: corr.join('; '), why: ex.why, tip: ex.tip };
    }
    if (ex.type === 'order') {
      var want = ex.order.items.map(function (_, i) { return i; });
      var isOk = st.cur.length === want.length && st.cur.every(function (v, i) { return v === want[i]; });
      return {
        ok: isOk,
        your: st.cur.map(function (i) { return ex.order.items[i]; }).join(' \u2192 '),
        correct: ex.order.items.join(' \u2192 '),
        why: ex.why, tip: ex.tip
      };
    }
    if (ex.type === 'categorize') {
      var okAll = true, your = [], corr = [];
      var placedCount = 0;
      ex.categorize.zones.forEach(function (z, zi) {
        corr.push(z.label + ': ' + z.items.map(function (i) { return ex.categorize.items[i]; }).join(', '));
        var gotNames = st.zones[zi].map(function (i) { return ex.categorize.items[i]; });
        your.push(z.label + ': ' + (gotNames.join(', ') || '(empty)'));
        placedCount += st.zones[zi].length;
        var a = z.items.slice().sort().join(',');
        var b = st.zones[zi].slice().sort().join(',');
        if (a !== b) okAll = false;
      });
      if (placedCount !== ex.categorize.items.length) okAll = false;
      return { ok: okAll, your: your.join(' | '), correct: corr.join(' | '), why: ex.why, tip: ex.tip };
    }
    if (ex.type === 'terminal') {
      var t = ex.terminal;
      if (st.lastCmd == null) {
        return { ok: false, your: 'You did not run a command.', correct: t.canonical, why: ex.why, tip: ex.tip };
      }
      for (var a = 0; a < t.accept.length; a++) {
        var re = new RegExp(t.accept[a], t.caseInsensitive ? 'i' : '');
        if (re.test(st.lastCmd)) {
          return { ok: true, your: st.lastCmd, correct: t.canonical, why: ex.why, tip: ex.tip };
        }
      }
      var nm = '';
      for (var m = 0; m < t.nearMiss.length; m++) {
        var re2 = new RegExp(t.nearMiss[m].re, t.caseInsensitive ? 'i' : '');
        if (re2.test(st.lastCmd)) { nm = t.nearMiss[m].msg; break; }
      }
      return { ok: false, your: st.lastCmd, correct: t.canonical, why: ex.why, tip: (nm ? nm + ' ' : '') + ex.tip };
    }
    if (ex.type === 'steps') {
      var s = st.step;
      var chosen = st.stepSel[s];
      var okS = chosen != null && st.stepOpts[s][chosen].orig === ex.steps[s].correct;
      st.stepOk[s] = okS;
      return {
        ok: okS,
        stepLevel: true,
        your: chosen == null ? 'No answer selected.' : st.stepOpts[s][chosen].text,
        correct: ex.steps[s].options[ex.steps[s].correct],
        why: ex.steps[s].why,
        tip: ex.tip
      };
    }
    return { ok: false, your: '', correct: '', why: '', tip: '' };
  }

  // ============================== feedback ==============================
  function showFeedback(ex, g, earned, hintPenalty) {
    var host = $('#fbHost');
    var isSteps = ex.type === 'steps';
    var head;
    if (isSteps) {
      var last = S.exState.step === ex.steps.length - 1;
      head = '<div class="fb ' + (g.ok ? 'fb-ok' : 'fb-bad') + '"><h3>' + (g.ok ? '\u2713 Correct' : '\u2717 Incorrect') +
        (last ? ' &mdash; exercise complete' : ' &mdash; next step') + '</h3>';
    } else {
      head = '<div class="fb ' + (g.ok ? 'fb-ok' : 'fb-bad') + '"><h3>' + (g.ok ? '\u2713 Correct' : '\u2717 Incorrect') + '</h3>';
    }
    var body = '';
    if (!isSteps) {
      body += '<div class="lab">Your answer</div><div>' + fmtMaybeCode(g.your) + '</div>';
      body += '<div class="lab">Correct answer</div><div>' + fmtMaybeCode(g.correct) + '</div>';
    } else {
      body += '<div class="lab">Your answer</div><div>' + esc(g.your) + '</div>';
      if (!g.ok) body += '<div class="lab">Correct answer</div><div>' + esc(g.correct) + '</div>';
    }
    body += '<div class="lab">Why</div><div>' + esc(g.why) + '</div>';
    if (!g.ok && g.tip) body += '<div class="lab">What to study</div><div>' + esc(g.tip) + '</div>';
    if (ex.type === 'terminal') {
      body += '<div class="lab">Canonical command (copyable)</div><div class="copyrow"><pre class="code" style="flex:1;min-width:220px;margin:0">' +
        esc(ex.terminal.canonical) + '</pre><button type="button" class="copybtn" id="copyCmd">Copy</button></div>';
      body += '<div class="lab">Part by part</div><ul>' + ex.terminal.canonicalExplain.map(function (c) {
        return '<li><span class="mono" style="font-family:var(--mono);color:#79c0ff">' + esc(c.part) + '</span> &mdash; ' + esc(c.why) + '</li>';
      }).join('') + '</ul>';
      if (g.your && g.your.indexOf('delete') !== -1 && ex.terminal.destructiveNote) {
        body += '<div class="hint-panel"><b>&#9888; Dangerous command:</b> ' + esc(ex.terminal.destructiveNote) + '</div>';
      }
    }
    if (isSteps && !S.exState.done) {
      body += '<div class="lab">Points</div><div>Scored when the last step is graded' + (hintPenalty ? ' (hint used: -10%)' : '') + '</div>';
    } else {
      body += '<div class="lab">Points</div><div>' + earned + ' / 100' + (hintPenalty ? ' (hint used: -10%)' : '') + '</div>';
    }
    var nextLabel;
    if (isSteps && S.exState.step < ex.steps.length - 1) nextLabel = 'Next step &#9654;';
    else if (S.fromReview) nextLabel = 'Back to skipped review &#9654;';
    else nextLabel = (S.idx === S.order.length - 1) ? ((S.skipped.length ? 'Review skipped &#9654;' : 'Finish exam &#9654;')) : 'Next exercise &#9654;';
    host.innerHTML = head + body +
      '<div class="rowbtns"><button id="nextBtn" class="btn primary">' + nextLabel + '</button></div></div>';
    var cc = $('#copyCmd');
    if (cc) cc.addEventListener('click', function () { copyText(ex.terminal.canonical); });
    $('#nextBtn').addEventListener('click', nextAfterFeedback);
    $('#submitRow').innerHTML = '';
  }

  function fmtMaybeCode(t) {
    var s = String(t == null ? '' : t);
    if (/\|/.test(s) || /^index=/.test(s)) return '<span class="mono" style="font-family:var(--mono)">' + esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>') + '</span>';
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }

  function nextAfterFeedback() {
    var ex = curEx();
    if (ex.type === 'steps' && S.exState.step < ex.steps.length - 1) {
      S.exState.step++;
      S.exState.done = false;
      renderCard(ex);
      updateHeader();
      var host = $('#hintHost');
      if (host && S.hintUsed[ex.id]) {
        host.innerHTML = '<div class="hint-panel"><b>&#128161; Hint (-10% of this exercise&rsquo;s live points):</b> ' + esc(ex.hint) + '</div>';
        host.style.display = '';
      }
      return;
    }
    if (S.fromReview) { showReview(); return; }
    advance();
  }
  function advance() {
    if (S.idx + 1 < S.order.length) showExercise(S.idx + 1, false);
    else if (S.skipped.length) showReview();
    else finishExam();
  }
  function onSubmitClick() {
    var ex = curEx();
    if (ex.type === 'steps') {
      var st = S.exState;
      if (st.stepSel[st.step] == null) { toast('Choose an answer first'); return; }
      gradeCurrent();
      if (!st.stepOk[st.step] || st.step === ex.steps.length - 1) {
        /* feedback shown; if wrong mid-tree, allow retry of same step? No: move on via Next step (spec: feedback per step, exercise completes with recorded verdicts) */
      }
    } else {
      gradeCurrent();
    }
  }

  // ============================== review skipped ==============================
  function showReview() {
    stopCardTimers();
    var list = S.skipped.map(function (id, i) {
      var ex = BYID[id];
      return '<div class="rev-item"><div><div class="t">' + (i + 1) + '. ' + esc(ex.title) + '</div>' +
        '<div class="s">&#128193; ' + esc(ex.summary) + '</div></div>' +
        '<button class="btn primary" data-ret="' + esc(id) + '">Return to it</button></div>';
    }).join('');
    var timeLeftNote = S.timerLeft > 0 ? 'You can return to skipped exercises as many times as you want while the timer runs (' + fmtTime(S.timerLeft) + ' left).' : 'The timer has ended.';
    $('#app').innerHTML =
      '<section class="wrap">' +
        '<h1>&#9888; Review skipped exercises</h1>' +
        '<p>' + esc(timeLeftNote) + ' If you finish now, every exercise still skipped and never answered is <b>excluded from the score</b>: not correct, not wrong, points not counted.</p>' +
        (list || '<p class="muted">No skipped exercises left. Well done.</p>') +
        '<div class="rowbtns">' +
          '<button id="finishBtn" class="btn primary big">Finish exam and see results &#9654;</button>' +
        '</div>' +
      '</section>';
    $all('[data-ret]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-ret');
        showExercise(S.order.indexOf(id), true);
      });
    });
    $('#finishBtn').addEventListener('click', finishExam);
    window.scrollTo(0, 0);
  }

  // ============================== finish & results ==============================
  function buildResults() {
    var recs = [];
    S.order.forEach(function (id) {
      var found = null;
      for (var i = 0; i < S.results.length; i++) { if (S.results[i].id === id) { found = S.results[i]; break; } }
      if (found) { recs.push(found); return; }
      var ex = BYID[id];
      recs.push({ id: id, title: ex.title, theme: ex.theme || 'General', verdict: 'skipped', hintUsed: false, earned: 0, your: 'Not answered.', correct: '', why: '', tip: '' });
    });
    return recs;
  }
  function finishExam() {
    if (S.finished) return;
    S.finished = true;
    stopTimers();
    showResults();
  }
  function finishByTimeout() {
    if (S.finished) return;
    S.finished = true;
    stopTimers();
    toast('Time is over — the exam finishes now');
    showResults();
  }
  function showResults() {
    var recs = buildResults();
    var answered = recs.filter(function (r) { return r.verdict !== 'skipped'; });
    var correct = answered.filter(function (r) { return r.verdict === 'correct'; }).length;
    var wrong = answered.length - correct;
    var skipped = recs.length - answered.length;
    var total = answered.length;
    var percent = total ? Math.round((correct / total) * 100) : 0;
    var passed = percent >= META.passMark;
    if (!S.reported) {
      S.reported = true;
      if (total > 0) reportScore(correct, total);
    }
    var themes = {};
    recs.forEach(function (r) {
      if (!themes[r.theme]) themes[r.theme] = { ok: 0, n: 0 };
      themes[r.theme].n++;
      if (r.verdict === 'correct') themes[r.theme].ok++;
    });
    var themeHtml = Object.keys(themes).map(function (k) {
      return '<span class="tprog">' + esc(k) + ': ' + themes[k].ok + '/' + themes[k].n + ' \u2713</span>';
    }).join('');
    var listHtml = recs.map(function (r, i) {
      var v = r.verdict === 'correct' ? '<span class="verdict v-ok">\u2713 Correct</span>'
        : r.verdict === 'incorrect' ? '<span class="verdict v-bad">\u2717 Incorrect</span>'
        : '<span class="verdict v-skip">\u26a0 Not answered \u2014 excluded from score</span>';
      var det = '<div class="res-detail">';
      if (r.verdict !== 'skipped') {
        det += '<div class="lab" style="font-weight:800;color:var(--muted);font-size:12.5px;text-transform:uppercase">Your answer</div><div>' + fmtMaybeCode(r.your) + '</div>';
        if (r.verdict === 'incorrect') det += '<div class="lab" style="font-weight:800;color:var(--muted);font-size:12.5px;text-transform:uppercase">Correct answer</div><div>' + fmtMaybeCode(r.correct) + '</div>';
        det += '<div class="lab" style="font-weight:800;color:var(--muted);font-size:12.5px;text-transform:uppercase">Why</div><div>' + esc(r.why) + '</div>';
        if (r.verdict === 'incorrect' && r.tip) det += '<div class="lab" style="font-weight:800;color:var(--muted);font-size:12.5px;text-transform:uppercase">What to study</div><div>' + esc(r.tip) + '</div>';
        det += '<div class="small muted" style="margin-top:8px">Points: ' + r.earned + '/100' + (r.hintUsed ? ' (hint used: -10%)' : '') + ' &middot; Theme: ' + esc(r.theme) + '</div>';
      } else {
        det += '<div class="muted">You skipped this exercise and never answered it. It is excluded from the score. Study the topic and retake the exam to close the gap: <b>' + esc(r.title) + '</b>.</div>';
      }
      det += '</div>';
      return '<details class="res-item"><summary>' + v + '<span style="flex:1">' + (i + 1) + '. ' + esc(r.title) + '</span></summary>' + det + '</details>';
    }).join('');
    var cert = passed
      ? '<div class="cert"><div class="brand">CyberPulse Academy &middot; Splunk topic</div>' +
        '<h2>&#127942; PASS &mdash; ' + esc(CFG.severity) + ' tier cleared</h2>' +
        '<p class="muted">' + percent + '% &middot; pass mark ' + META.passMark + '%</p>' +
        '<p><b>' + esc(CFG.username || 'Learner') + '</b> &middot; ' + new Date().toLocaleDateString() + '</p>' +
        '<p class="small muted">You have demonstrated the ' + esc(CFG.severity) + ' tier of the Splunk topic. Move on to the next tier when ready.</p></div>'
      : '<div class="fb fb-bad" style="text-align:center"><h3>\u2717 FAIL &mdash; retake required</h3>' +
        '<p>You reached ' + percent + '%. You need ' + META.passMark + '% or more to pass the ' + esc(CFG.severity) + ' tier.</p>' +
        '<p class="small">Read the report below, study the pointed topics, then retake the exam.</p></div>';
    $('#app').innerHTML =
      '<section class="wrap">' +
        '<div class="hero-top" style="margin-top:14px"><span class="badge ' + CFG.sevClass + '">' + esc(CFG.severity) + '</span><span class="chipmeta">Splunk topic &middot; tier ' + META.batch + ' of 4</span></div>' +
        '<div class="res-hero">' +
          '<div class="res-pct ' + (passed ? 'ok' : 'no') + '">' + percent + '%</div>' +
          '<p class="muted">' + (passed ? 'PASS' : 'FAIL') + ' &middot; pass mark ' + META.passMark + '% &middot; score computed over answered exercises only</p>' +
          '<div class="res-break">' +
            '<div class="info-box"><div class="num">' + correct + '</div><div class="lab">correct</div></div>' +
            '<div class="info-box"><div class="num">' + wrong + '</div><div class="lab">incorrect</div></div>' +
            '<div class="info-box"><div class="num">' + skipped + '</div><div class="lab">skipped &middot; excluded</div></div>' +
            '<div class="info-box"><div class="num">' + S.points + '</div><div class="lab">live points (hints -10%)</div></div>' +
          '</div>' +
          '<div class="themebar">' + themeHtml + '</div>' +
        '</div>' +
        cert +
        '<h2>Detailed report &mdash; every exercise</h2>' +
        listHtml +
        '<div class="rowbtns" style="margin-top:18px">' +
          '<button id="retakeBtn" class="btn primary big">&#8635; Retake exam</button>' +
        '</div>' +
      '</section>';
    $('#retakeBtn').addEventListener('click', function () { S = null; startExam(); });
    window.scrollTo(0, 0);
  }

  // ============================== wire submit ==============================
  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'submitBtn') onSubmitClick();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
