  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.setAttribute('role','dialog');
    ov.setAttribute('aria-modal','true');
    ov.setAttribute('aria-label','Timer paused');
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">Both the exam countdown and the time box of a single exercise are stopped.</p>'+
      '<button class="btn primary" id="resumeBtn" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
    var stg = $('#stage');
    if(stg){
      stg.setAttribute('aria-hidden','true');
      try{ stg.inert = true; }catch(e){}
    }
    var rb = $('#resumeBtn');
    if(rb && rb.focus){ try{ rb.focus(); }catch(e){} }
  } else {
    ov.style.display = 'none';
    ov.removeAttribute('aria-modal');
    var stg2 = $('#stage');
    if(stg2){
      stg2.removeAttribute('aria-hidden');
      try{ stg2.inert = false; }catch(e){}
    }
  }
  updateHUD();
  updateExTimer();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill2 = sc.parentNode;
      if(pill2 && pill2.classList){
        pill2.classList.remove('bump');
        void pill2.offsetWidth;
        pill2.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg');
  if(pr){
    pr.style.width = pct + '%';
    pr.setAttribute('aria-valuenow', String(pct));
  }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn');
  if(pb){
    pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause';
    pb.disabled = S.done || !S.started;
  }
  var cn = $('#hudCount');
  if(cn){
    cn.textContent = S.done ? 'Results and detailed report'
                    : S.reviewing ? 'Review skipped exercises'
                    : (S.started && S.pool.length) ? ('Exercise ' + (S.idx+1) + ' of ' + S.pool.length)
                    : 'Exam briefing';
  }
  var x = S.pool[S.idx];
  var r = x ? S.res[x.id] : null;
  var locked = !S.started || S.done || S.reviewing || !x || (r && (r.status !== 'skipped' || r.timedout));
  var ht = $('#hintTop');
  if(ht){
    var used = x && S.hints[x.id];
    ht.disabled = !!locked || !!used;
    ht.textContent = used ? '💡 Hint used' : '💡 Hint −10%';
  }
  var stp = $('#skipTop');
  if(stp){ stp.disabled = !!locked; }
}

/* --------------------------- layout: artefacts ------------------------- */
function artefactBody(a){
  var h = '';
  if(a.kind==='log'){
    h += '<input class="logfilter" aria-label="Filter the log lines" placeholder="filter lines (like Kibana / Splunk) ..." oninput="filterLog(this)" />';
    h += '<div class="logbox">';
    (a.lines||[]).forEach(function(ln){
      var lv = ln[0]||'', txt = ln[1]||'';
      h += '<div class="logline lvline-'+esc(lv)+'" data-t="'+esc((lv+' '+txt).toLowerCase())+'">';
      if(lv){ h += '<span class="lv lv-'+esc(lv)+'">'+esc(lv)+'</span>'; }
      h += esc(txt)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='table'){
    h += '<input class="logfilter" aria-label="Filter the table rows" placeholder="filter rows (like a governance dashboard) ..." oninput="filterRows(this)" />';
    h += '<table class="art"><thead><tr>';
    (a.head||[]).forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    (a.rows||[]).forEach(function(r){
      h += '<tr data-t="'+esc(r.join(' ').toLowerCase())+'">';
      r.forEach(function(c){ h += '<td>'+esc(c)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table>';
  } else if(a.kind==='email'){
    h += '<div class="emailbody">';
    (a.lines||[]).forEach(function(ln,i){
      h += '<div class="'+(i===0?'subj':'')+'">'+esc(ln)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='doc' || a.kind==='minutes' || a.kind==='config'){
    h += '<div class="docbody">';
    (a.lines||[]).forEach(function(ln){
      var cls = (String(ln).indexOf('##')===0) ? 'h' : '';
      h += '<div class="'+cls+'">'+esc(String(ln).replace(/^##\s*/,''))+'</div>';
    });
    h += '</div>';
  } else {
    (a.lines||[]).forEach(function(ln){ h += '<div class="logline">'+esc(ln)+'</div>'; });
  }
  return h;
}
function artefactList(x){
  if(x.artefacts && x.artefacts.length){ return x.artefacts; }
  if(x.artifact){ return [x.artifact]; }
  return [];
}
function artefactsHTML(x){
  var list = artefactList(x);
  var h = '';
  list.forEach(function(a, i){
    var label = a.label || ('ARTEFACT ' + (i+1) + ' — ' + (a.title || a.kind || 'evidence'));
    h += '<div class="artpanel" role="group" aria-label="'+esc(label)+'">';
    h += '<div class="alabel">'+esc(label)+'</div>';
    h += '<div class="abody">'+artefactBody(a)+'</div>';
    h += '</div>';
  });
  return h;
}
function filterLog(inp){
  var q = inp.value.toLowerCase().trim();
  var box = inp.parentNode.querySelector('.logbox') || inp.parentNode;
  $$('.logline', box).forEach(function(el){
    var hit = !q || (el.getAttribute('data-t')||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
}
function filterRows(inp){
  var q = inp.value.toLowerCase().trim();
  var table = inp.parentNode.querySelector('table.art');
  if(!table){ return; }
  $$('tbody tr', table).forEach(function(tr){
    var hit = !q || (tr.getAttribute('data-t')||'').indexOf(q) >= 0;
    tr.style.display = hit ? '' : 'none';
  });
}

/* ------------------------------ layout blocks -------------------------- */
function sevPill(){

function blockHead(cls, icon, label, right){

function scenarioBlock(x){

    btn.setAttribute('aria-expanded', S.scenCollapsed[id] ? 'false' : 'true');

function questionBlock(x){
  var right = '';
  if(x.timeLimit){ right = '<span class="exTimer" id="exTimer" role="timer">⏱ '+fmt(x._exLeft)+' left for this exercise</span>'; }
  else if(x.type==='branch'){ right = '<span class="badge">STEP '+Math.min(x._node+1, x.nodes.length)+' OF '+x.nodes.length+'</span>'; }
  var h = '<section class="block question" aria-label="Question">';
  h += blockHead('amber', '❓', 'QUESTION', right);

    h += '<p class="qtext" id="termGoal">Loading the current step ...</p>';

    h += '<p class="qtext">'+esc(x.prompt)+'</p>';
  }

function actionsHTML(x){
  return '<div class="qactions">'+
       '<button type="button" class="btn primary" onclick="submitAnswer()">Check answer</button>'+
       '<button type="button" class="btn ghost" onclick="showHint()" id="hintBtn"'+(x._hint ? ' disabled' : '')+'>'+
         (x._hint ? '💡 Hint used' : '💡 Hint −10% of this exercise')+'</button>'+
       '<button type="button" class="btn warn" onclick="skipCurrent()" id="skipBtn">⤼ Skip exercise</button>'+
       '</div>';
}
function answerBlock(x){
  var r = S.res[x.id];
  var locked = !!(r && (r.status !== 'skipped' || r.timedout));
  var h = '<section class="block answer" aria-label="Your answer">';
  h += blockHead('green', '✎', 'YOUR ANSWER');
  h += '<div class="bbody">';
  if(locked){
    h += staticHTML(x, r);
  } else {
    if(r && r.status === 'skipped'){
      h += '<div class="tip" style="border-left-color:var(--skip);background:#1a1508">'+
           '<b>⚠ Skipped exercise.</b> It is in your review pool. Answer it now, or skip it again and return later from the review screen.</div>';
    }
    if(x.type==='mcq'||x.type==='multi'||x.type==='log'){ h += optHTML(x); }
    else if(x.type==='order'||x.type==='rank'){ h += sortHTML(x); }
    else if(x.type==='classify'){ h += classifyHTML(x); }
    else if(x.type==='fill'){ h += fillHTML(x); }
    else if(x.type==='match'){ h += matchHTML(x); }
    else if(x.type==='terminal'){ h += termHTML(x); }
    else if(x.type==='branch'){ h += branchHTML(x); }
    h += actionsHTML(x);
  }
  h += '<div class="hintbox" id="hintBox" style="display:none"></div>';
  h += '<div class="flash" id="flashBox" style="display:none" role="status"></div>';
  h += '</div></section>';
  return h;
}
function canonicalHTML(x){
  if(!x.canonical || !x.canonical.length){ return ''; }
  var h = '<div class="canonical"><h4>Canonical command(s) — copy them</h4>';
  x.canonical.forEach(function(c){
    h += '<pre class="cmd"><code>'+esc(c.cmd)+'</code></pre>';
    if(c.parts && c.parts.length){
      h += '<ul class="cmdparts">';
      c.parts.forEach(function(p){ h += '<li>'+esc(p)+'</li>'; });
      h += '</ul>';
    }
  });
  if(x.dangerNote){ h += '<div class="tip" style="border-left-color:var(--bad);background:#2a0f12"><b>Dangerous near miss:</b> '+x.dangerNote+'</div>'; }
  return h + '</div>';
}
function feedbackBlock(x, r){
  if(!r){ return ''; }
  var cls, icon, word;
  if(r.status === 'correct'){ cls='ok'; icon='✔'; word='CORRECT'; }
  else if(r.status === 'wrong'){ cls='bad'; icon='✗'; word='INCORRECT'; }
  else { cls='na'; icon='⚠'; word='NOT ANSWERED — EXCLUDED'; }
  var h = '<section class="fb '+cls+'" id="feedback" tabindex="-1" aria-label="Feedback">';
  h += '<div class="fbhead"><span class="bhl"><span class="ic" aria-hidden="true">'+icon+'</span> '+word+'</span>';
  if(r.status !== 'skipped'){ h += '<span class="fpts">'+r.earned+' / '+MAXPTS+' pts</span>'; }
  h += '</div><div class="fbbody">';
  if(r.status === 'skipped'){
    h += '<p class="muted"><b>Not answered — excluded from score.</b> '+
         (r.timedout ? 'The time box of this exercise ended before you answered it. ' : 'You skipped this exercise and did not come back to it. ')+
         'It did not count as right or wrong, and its points were not added to the total possible points.</p>';
  } else {
    h += '<div class="ansline"><div><span class="lbl">Your answer</span>'+esc(yourText(x, r.given))+'</div>'+
         '<div><span class="lbl">Correct answer</span>'+esc(correctText(x))+'</div></div>';
  }
  h += '<p class="exp">'+x.explain+'</p>';
  if(x.type === 'terminal'){ h += canonicalHTML(x); }
  if(r.status !== 'correct' && x.tip){ h += '<div class="tip"><b>What to study:</b> '+x.tip+'</div>'; }
  if(r.penalty && r.status === 'correct'){ h += '<div class="tip" style="border-left-color:var(--warn);background:#2a2008">'+
      '<b>Points lost:</b> −'+r.penalty+' (−'+r.hints+' from hints, −'+r.wrongCmds+' from wrong commands).</div>'; }
  h += '</div></section>';
  return h;
}
function sidePanel(){
  var h = '<aside class="side card"><h3>Exercise map</h3><div class="chips">';
  S.pool.forEach(function(x,i){
    var r = S.res[x.id], c = 'chipbtn';
    if(i===S.idx){ c += ' cur'; }

       '<span><i style="background:var(--ok)"></i>answered and correct</span>'+

       '<span><i style="background:var(--skip)"></i>skipped (in review pool)</span>'+
       '<span><i style="background:#101d33;border:1px solid #2c4266"></i>not answered yet</span>'+
       '</div>';
  h += '<div class="qactions" style="flex-direction:column">';
  h += '<button type="button" class="btn small" onclick="finishFlow()">Review skipped &amp; finish</button>';
  h += '<button type="button" class="btn small ghost" onclick="togglePause()">'+(S.paused?'Resume timer':'Pause timer')+'</button>';

       'Skipped exercises that stay unanswered are excluded from the score.</p>';
  return h + '</aside>';
}

/* ------------------------------ drag helpers --------------------------- */
var DRAGGED = null, PICKED = null;
function enableDrag(){
  $$('.chip[draggable="true"]').forEach(function(c){
    c.addEventListener('dragstart', function(e){
      DRAGGED = c;
      try{ e.dataTransfer.setData('text/plain', c.getAttribute('data-t')); }catch(err){}
      c.style.opacity = .5;
    });
    c.addEventListener('dragend', function(){ c.style.opacity = 1; DRAGGED = null; });
  });
  $$('.sortlist li').forEach(function(li){
    li.addEventListener('dragstart', function(e){
      DRAGGED = li; li.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain','x'); }catch(err){}
    });
    li.addEventListener('dragend', function(){ li.classList.remove('dragging'); DRAGGED = null; });
    li.addEventListener('dragover', function(e){ e.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', function(){ li.classList.remove('over'); });
    li.addEventListener('drop', function(e){
      e.preventDefault(); li.classList.remove('over');
      if(DRAGGED && DRAGGED !== li && DRAGGED.parentNode === li.parentNode){
        var nodes = Array.prototype.slice.call(li.parentNode.children);
        if(nodes.indexOf(DRAGGED) < nodes.indexOf(li)){ li.parentNode.insertBefore(DRAGGED, li.nextSibling); }
        else { li.parentNode.insertBefore(DRAGGED, li); }
      }
    });
  });
}
function moveItem(btn, dir){
  var li = btn.closest('li');
  if(!li){ return; }
  var sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
  if(!sib){ return; }
  if(dir < 0){ li.parentNode.insertBefore(li, sib); }
  else { li.parentNode.insertBefore(sib, li); }
  try{ btn.focus(); }catch(e){}
}
function pickChip(chip){
  if(chip.classList.contains('placed')){ returnToBank(chip); return; }
  if(PICKED === chip){ chip.classList.remove('sel'); PICKED = null; return; }
  if(PICKED){ PICKED.classList.remove('sel'); }
  PICKED = chip;
  chip.classList.add('sel');
}
function returnToBank(chip){
  var bank = $('.bank');
  var old = chip.parentNode;
  if(bank){ bank.appendChild(chip); chip.classList.remove('placed'); }
  if(old && old.classList && old.classList.contains('slot')){
    old.classList.remove('filled');
    old.classList.add('empty');
    old.innerHTML = '<span class="ph">…</span>';
  }
}
function dragOver(e, el){ e.preventDefault(); el.classList.add('hot'); }
function dragLeave(el){ el.classList.remove('hot'); }
function dropChip(e, el){
  e.preventDefault(); el.classList.remove('hot');
  placeChip(DRAGGED, el);
  DRAGGED = null; PICKED = null;
}
function placeChip(chip, el){
  if(!chip || !el){ return; }
  var target = el.classList.contains('bucket') ? $('.drop', el) : el;
  if(!target){ return; }
  if(target.classList.contains('slot')){
    var old = target.querySelector('.chip');
    if(old && old !== chip){ returnToBank(old); }
    target.innerHTML = '';
    target.classList.add('filled');
    target.classList.remove('empty');
  }
  target.appendChild(chip);
  chip.classList.add('placed');
  chip.classList.remove('sel');
}
function dropPicked(el){
  if(!PICKED){ return; }
  var chip = PICKED;
  PICKED = null;
  placeChip(chip, el);
}


/* ------------------------------ read answers --------------------------- */
function readAnswer(x){
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    var sel = $$('input[name="'+x.id+'"]:checked').map(function(i){ return parseInt(i.value,10); });
    if(!sel.length){ return {ok:false, msg:'Choose an answer first.'}; }
    return {ok:true, value:sel};
  }
  if(x.type==='order'||x.type==='rank'){
    var v = $$('#sort-'+x.id+' .txt').map(function(e){ return e.textContent; });
    if(v.length !== x.items.length){ return {ok:false, msg:'Something went wrong with the list.'}; }
    return {ok:true, value:v};
  }
  if(x.type==='classify'){
    var map = {}, placed = 0;
    $$('.bucket').forEach(function(b){
      var bn = b.getAttribute('data-b');
      $$('.drop .chip', b).forEach(function(c){ map[c.getAttribute('data-t')] = bn; placed++; });
    });
    if(placed < x._items.length){ return {ok:false, msg:'Place every card in a box first ('+placed+'/'+x._items.length+' placed).'}; }
    return {ok:true, value:map};
  }
  if(x.type==='fill'){
    var words = [];
    $$('.slot').forEach(function(s){
      var c = s.querySelector('.chip');
      words.push(c ? c.getAttribute('data-t') : '');
    });
    if(words.indexOf('') >= 0){ return {ok:false, msg:'Fill every blank first.'}; }
    return {ok:true, value:words};
  }
  if(x.type==='match'){
    var m = {}, empty = 0;
    $$('table.match select').forEach(function(s){
      if(!s.value){ empty++; }
      m[s.getAttribute('data-left')] = s.value;
    });
    if(empty){ return {ok:false, msg:'Choose a value for every line ('+empty+' left empty).'}; }
    return {ok:true, value:m};
  }
  if(x.type==='terminal'){
    if(x._step < x.steps.length){ return {ok:false, msg:'Complete every command step first ('+x._step+'/'+x.steps.length+' done).'}; }
    return {ok:true, value:{steps:x.steps.length, wrong:x._wrong}};
  }
  if(x.type==='branch'){
    if(x._node < x.nodes.length){ return {ok:false, msg:'Finish the decision path first.'}; }
    return {ok:true, value:{firstTry:x._firstTry, wrong:x._wrongPicks}};
  }
  return {ok:false, msg:'Unknown exercise type.'};
}

/* -------------------------------- scoring ------------------------------ */
function scoreAnswer(x, v){
  if(x.type==='mcq'||x.type==='log'){
    return {correct: v.length===1 && x._opts[v[0]].ok};
  }
  if(x.type==='multi'){
    var chosenOk = v.every(function(i){ return x._opts[i].ok; });
    var allOk = x._opts.filter(function(o){ return o.ok; }).length === v.length;
    return {correct: chosenOk && allOk};
  }
  if(x.type==='order'||x.type==='rank'){
    var same = v.length === x.items.length && v.every(function(t,i){ return t === x.items[i]; });
    return {correct:same};
  }
  if(x.type==='classify'){
    var ok = x._items.every(function(it){ return v[it.text] === it.bucket; });
    return {correct:ok};
  }
  if(x.type==='fill'){
    var okf = x.blanks.every(function(b,i){ return v[i] === b; });
    return {correct:okf};
  }
  if(x.type==='match'){
    var okm = x.pairs.every(function(p){ return v[p.left] === p.right; });
    return {correct:okm};
  }
  if(x.type==='terminal'){ return {correct:true}; }
  if(x.type==='branch'){ return {correct: v.firstTry === true}; }
  return {correct:false};
}
function submitAnswer(){
  var x = S.pool[S.idx];
  var r = S.res[x.id];
  if(r && (r.status !== 'skipped' || r.timedout)){ return; }
  var got = readAnswer(x);
  if(!got.ok){ flash(got.msg); return; }
  var sc = scoreAnswer(x, got.value);
  var used = S.hints[x.id] || 0;
  /* terminal exercises: every wrong command costs 1 point (10% of the exercise), like a hint */
  var wrongCmds = (x.type === 'terminal') ? Math.min(MAXPTS, x._wrong || 0) : 0;
  var penalty = used*HINTCOST + wrongCmds;
  var earned = sc.correct ? Math.max(0, MAXPTS - penalty) : 0;
  S.res[x.id] = {status: sc.correct ? 'correct':'wrong', earned:earned, given:got.value,
                 hints:used, penalty:penalty, wrongCmds:wrongCmds};
  var k = S.skipped.indexOf(x.id);
  if(k >= 0){ S.skipped.splice(k,1); }
  S.focusTarget = 'feedback';
  renderExam();
  scrollTop();
}
function showHint(){
  var x = S.pool[S.idx];
  if(!x){ return; }
  var box = $('#hintBox');
  if(!box){ return; }
  if(S.hints[x.id]){
    box.style.display='block';
    box.innerHTML = '<b>Hint already used.</b> '+x.hint;
    return;
  }
  S.hints[x.id] = 1;
  x._hint = 1;
  box.style.display = 'block';
  box.innerHTML = '<b>Hint (−10% of this exercise):</b> '+x.hint+
                  '<div class="muted small" style="margin-top:.3rem">A hint does not give the answer. It only points you to the right area.</div>';
  var b = $('#hintBtn'); if(b){ b.disabled = true; b.textContent = '💡 Hint used'; }
  var bt = $('#hintTop'); if(bt){ bt.disabled = true; bt.textContent = '💡 Hint used'; }
  updateHUD();
}
function skipCurrent(){
  var x = S.pool[S.idx];
  var r = S.res[x.id];
  if(r && (r.status !== 'skipped' || r.timedout)){ return; }
  S.res[x.id] = {status:'skipped', earned:0, given:null, hints:S.hints[x.id]||0};
  if(S.skipped.indexOf(x.id) < 0){ S.skipped.push(x.id); }
  var nxt = nextPendingIndex(S.idx+1);
  if(nxt >= 0){ S.idx = nxt; }
  renderExam();
  scrollTop();
}
function nextPendingIndex(from){
  for(var i=from;i<S.pool.length;i++){
    var r = S.res[S.pool[i].id];
    if(!r || r.status==='skipped'){ return i; }
  }
  for(var j=0;j<from && j<S.pool.length;j++){
    var r2 = S.res[S.pool[j].id];
    if(!r2 || r2.status==='skipped'){ return j; }
  }
  return -1;
}
function nextPending(){
  var n = nextPendingIndex(S.idx+1);
  if(n >= 0){ gotoIdx(n); } else { finishFlow(); }
}
function gotoIdx(i){
  if(i<0 || i>=S.pool.length){ return; }
  S.idx = i; renderExam(); scrollTop();
}

/* ---------------------------- answer rendering ------------------------- */
function correctText(x){
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    return x._opts.filter(function(o){ return o.ok; }).map(function(o){ return o.t; }).join(' | ');
  }
  if(x.type==='order'||x.type==='rank'){ return x.items.join(' → '); }
  if(x.type==='classify'){
    return x._items.map(function(it){ return it.text+' → '+it.bucket; }).join(' · ');
  }
  if(x.type==='fill'){ return x.blanks.join(' | '); }
  if(x.type==='match'){ return x.pairs.map(function(p){ return p.left+' → '+p.right; }).join(' · '); }
  if(x.type==='terminal'){ return 'Every command step completed ('+x.steps.length+'/'+x.steps.length+').'; }
  if(x.type==='branch'){ return 'Every decision taken correctly on the first try.'; }
  return '';
}
function yourText(x, v){
  if(!v){ return '(nothing)'; }
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    return v.map(function(i){ return x._opts[i] ? x._opts[i].t : '?'; }).join(' | ');
  }
  if(x.type==='order'||x.type==='rank'){ return v.join(' → '); }
  if(x.type==='classify'){
    return x._items.map(function(it){ return it.text+' → '+(v[it.text]||'not placed'); }).join(' · ');
  }
  if(x.type==='fill'){ return v.join(' | '); }
  if(x.type==='match'){
    return x.pairs.map(function(p){ return p.left+' → '+(v[p.left]||'not chosen'); }).join(' · ');
  }
  if(x.type==='terminal'){ return 'Commands completed: '+v.steps+', wrong commands typed: '+v.wrong+'.'; }
  if(x.type==='branch'){ return v.firstTry ? 'All decisions correct on the first try.' :
      'The path was finished, but '+v.wrong+' decision(s) were wrong before you found the right one.'; }
  return '';
}
function staticHTML(x, r){

  }
  if(x.type==='terminal'){

           '<div class="term-out">'+(x._log||[]).join('')+'</div></div>';
  }
  if(x.type==='order'||x.type==='rank'){
    return '<div class="ansline"><div><span class="lbl">Your order</span>'+esc((r.given||[]).join(' → '))+'</div>'+
           '<div><span class="lbl">Correct order</span>'+esc(x.items.join(' → '))+'</div></div>';
  }
  if(x.type==='classify'){
    var rows = '<table><thead><tr><th>Card</th><th>Your box</th><th>Correct box</th><th>Result</th></tr></thead><tbody>';
    x._items.forEach(function(it){
      var mine = (r.given||{})[it.text] || 'not placed';
      var good = mine === it.bucket;
      rows += '<tr class="'+(good?'ok':'bad')+'"><td>'+esc(it.text)+'</td><td>'+esc(mine)+'</td><td>'+esc(it.bucket)+
              '</td><td>'+(good?'✔ Correct':'✘ Wrong')+'</td></tr>';
    });
    return '<div class="ansSummary">'+rows+'</tbody></table></div>';
  }
  if(x.type==='match'){
    var mr = '<table><thead><tr><th>Item</th><th>Your link</th><th>Correct link</th></tr></thead><tbody>';
    x.pairs.forEach(function(p){
      var mine = (r.given||{})[p.left] || 'not chosen';
      mr += '<tr class="'+(mine === p.right ? 'ok' : 'bad')+'"><td>'+esc(p.left)+'</td><td>'+esc(mine)+'</td><td>'+esc(p.right)+'</td></tr>';
    });
    return '<div class="ansSummary">'+mr+'</tbody></table></div>';
  }
  if(x.type==='fill'){

/* ------------------------------- terminal ------------------------------ */
function normaliseCmd(cmd){
  var s = String(cmd||'').trim();
  s = s.replace(/^\$\s*/, '');                 /* a pasted shell prompt */
  s = s.replace(/\s+/g, ' ');                  /* collapse spaces */
  s = s.replace(/\s*=\s*/g, '=');              /* --flag = value -> --flag=value */
  s = s.replace(/(--[a-z0-9-]+)=/g, '$1 ');    /* --flag=value -> --flag value */
  s = s.replace(/\s*(>>|>)\s*/g, ' $1 ');      /* >> must be normalised before > */
  s = s.replace(/\s*\/\s*$/, '');              /* a trailing slash */
  return s.toLowerCase().trim();
}
function wireTerminal(x){
  var inp = $('#termIn');
  if(!inp){ return; }
  inp.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){
      var cmd = inp.value;
      inp.value = '';
      runTerm(x, cmd.trim());
    }
  });
  try{ inp.focus(); }catch(e){}
}
function runTerm(x, cmd){
  if(!cmd){ return; }
  x._log.push('<div class="tl"><span class="tp">analyst@ws:~$</span> '+esc(cmd)+'</div>');
  if(x._step >= x.steps.length){
    x._log.push('<div class="to">Every required command is already done. Click “Check answer”.</div>');
  } else {
    var st = x.steps[x._step];
    var norm = normaliseCmd(cmd);
    var hit = false;
    (st.accept||[]).forEach(function(rx){
      try{ if(new RegExp(rx,'i').test(norm)){ hit = true; } }catch(e){}
    });
    if(hit){
      x._log.push('<div class="to okout">'+st.out+'</div>');
      x._step++;
    } else {
      x._wrong++;
      var danger = '';
      (st.danger||[]).forEach(function(d){
        try{ if(new RegExp(d[0],'i').test(norm)){ danger = d[1]; } }catch(e){}
      });
      x._log.push('<div class="to errout">'+esc(danger || st.err || 'This command does not do what this step needs.')+'</div>');
      if(danger){ x._log.push('<div class="to">It still counts as a wrong command: −1 point. Re-read the objective and try again.</div>'); }
    }
  }
  paintTerm(x);
}
function paintTerm(x){
  var box = $('#termOut');
  if(box){ box.innerHTML = (x._log||[]).join(''); box.scrollTop = box.scrollHeight; }
  var g = $('#termGoal');
  if(g){
    if(x._step >= x.steps.length){
      g.innerHTML = '<b>All steps done.</b> Click “Check answer” to score this exercise.';
    } else {
      var st = x.steps[x._step];
      g.innerHTML = '<b>Step '+(x._step+1)+' of '+x.steps.length+':</b> '+esc(st.goal);
    }
  }
}

/* --------------------------------- branch ------------------------------ */
function branchPick(i){
  var x = S.pool[S.idx];
  if(x.type !== 'branch' || x._node >= x.nodes.length){ return; }
  var n = x.nodes[x._node];
  var o = n.options[i];
  var fb = $('#bfb');
  if(!fb){ return; }
  if(o.ok){
    fb.className = 'bfb okfb';
    fb.innerHTML = '<b>✔ Good decision.</b> '+(o.why||'')+' <button type="button" class="btn small primary" onclick="branchNext()">Continue ▸</button>';
  } else {
    x._firstTry = false;
    x._wrongPicks++;
    fb.className = 'bfb badfb';
    fb.innerHTML = '<b>✗ This choice creates a governance problem.</b> '+(o.why||'')+' Try another option.';
    var btns = $$('.bopt');
    if(btns[i]){ btns[i].disabled = true; btns[i].classList.add('dead'); }
  }
}
function branchNext(){
  var x = S.pool[S.idx];
  x._node++;
  renderExam();
  scrollTop();
}

/* --------------------------- skip review screen ------------------------ */
function finishFlow(){
  if(S.done){ return; }
  if(S.skipped.length > 0 && !S.timeover){ renderReviewSkipped(); return; }
  showResults();
}
function renderReviewSkipped(){
  S.reviewing = true;

       'You can go back to any of them and answer it while the timer is still running.</p>';

         '</li>';
  });

  $('#stage').innerHTML = h;

function backToExam(){
  var n = nextPendingIndex(0);

  gotoIdx(n);
}

/* --------------------------- website integration ----------------------- */
/* One report per completed attempt, sent at the results screen only.
   score / total are points over the exercises that were actually answered:
   a skipped-and-never-answered exercise is in neither number, exactly as in
   the final score shown on screen, so percent and passed always agree. */
function reportScore(earned, possible){
  var percent = possible ? Math.round((earned/possible)*100) : 0;
  try{
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: earned,
      total: possible,
      percent: percent,
      passed: percent >= EXAM.passScore
    }, location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* --------------------------------- results ----------------------------- */
function showResults(){
  S.done = true;
  S.reviewing = false;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display = 'none'; }
  var st = stats();
  var pct = st.possible ? Math.round((st.earned/st.possible)*100) : 0;
  var pass = st.answered > 0 && pct >= EXAM.passScore;
  if(!S.reported){
    S.reported = true;
    reportScore(st.earned, st.possible);
  }

  var h = '<div class="card"><div class="resulthead">';
  h += '<div><h1 style="margin-bottom:.2rem">Final result — '+esc(EXAM.keyword)+' '+sevPill()+'</h1>'+
       '<p class="muted">'+esc(EXAM.severity)+' practice exam · passing score '+EXAM.passScore+'% of the answered exercises</p>'+
       (S.timeover ? '<p class="warn"><b>⚠ Time is over.</b> The exam was submitted automatically.</p>' : '')+
       '<p class="'+(pass?'ok':'bad')+'" style="font-size:1.2rem;font-weight:800">'+(pass?'✔ PASS':'✗ FAIL')+'</p></div>';
  h += '<div style="text-align:right"><div class="bigscore '+(pass?'pass':'fail')+'">'+pct+'%</div>'+
       '<div class="muted small">'+st.earned+' / '+st.possible+' points</div></div>';
  h += '</div>';

  h += '<div class="statgrid">'+
       '<div class="stat"><div class="n ok">'+st.correct+'</div><div class="k">Answered correctly</div></div>'+
       '<div class="stat"><div class="n bad">'+st.wrong+'</div><div class="k">Answered incorrectly</div></div>'+
       '<div class="stat"><div class="n" style="color:var(--skip)">'+st.skipped+'</div><div class="k">Skipped, not answered (excluded)</div></div>'+
       '<div class="stat"><div class="n">'+st.answered+' / '+st.total+'</div><div class="k">Exercises counted in the score</div></div>'+
       '</div>';

  h += themeBars();

  if(pass){
    h += '<div class="cert"><div class="ct">Certificate of completion</div>'+
         '<div class="cn">'+esc(EXAM.keyword)+' — '+esc(EXAM.severity)+'</div>'+
         '<div class="cs">Score: '+pct+'% ('+st.earned+' / '+st.possible+' points) · Threshold: '+EXAM.passScore+'%</div>'+
         '<div class="muted small" style="margin-top:.4rem">Issued '+new Date().toLocaleString()+' · Standalone certification exam · Practical governance simulation</div></div>';
  } else {
    h += '<div class="tip" style="border-left-color:var(--bad);background:#2a0f12;margin-top:1rem">'+
         '<b>✗ You did not reach the threshold.</b> Read every explanation below, look at the “what to study” notes, then retake the exam. '+
         'The questions and the answer choices are shuffled again at every attempt.</div>';
  }
  h += '<div class="qactions"><button type="button" class="btn primary" onclick="retake()">Retake exam (reshuffled)</button>'+
       '<button type="button" class="btn ghost" onclick="gotoReport()">Go to the detailed report</button></div>';
  h += '</div>';

  h += '<div class="card"><h2>Detailed report — every exercise explained</h2>'+
       '<p class="muted small">Correct answers are shown in green with ✔, wrong answers in red with ✗, and exercises you never '+
       'answered in amber with ⚠. They are also listed in the report.</p><div class="report">';
  S.pool.forEach(function(x,i){
    var r = S.res[x.id];
    var cls = 'rep', status, badgeColor = 'var(--skip)';
    if(r && r.status === 'correct'){ cls += ' good'; status = '✔ Correct'; badgeColor = 'var(--ok)'; }
    else if(r && r.status === 'wrong'){ cls += ' bad'; status = '✗ Incorrect'; badgeColor = 'var(--bad)'; }
    else { cls += ' na'; status = '⚠ Not answered — excluded from score'; }
    h += '<div class="'+cls+'">';
    h += '<div class="rhead"><b>Exercise '+(i+1)+' — '+esc(x.title)+'</b>'+
         '<span class="badge" style="border-color:'+badgeColor+';color:'+badgeColor+'">'+status+'</span></div>';
    h += '<div class="muted small" style="margin:.25rem 0 .5rem">'+esc(x.theme)+' · '+esc(String(x.type).toUpperCase())+
         (r && r.status!=='skipped' ? ' · '+r.earned+' / '+MAXPTS+' pts'+
            (r.penalty ? ' (−'+r.penalty+' pts: '+(r.hints?'hint ':'')+(r.wrongCmds?'wrong commands':'')+')' : '') : '')+'</div>';
    if(r && r.status !== 'skipped'){
      h += '<div class="ansline"><div><span class="lbl">Your answer</span>'+esc(yourText(x, r.given))+'</div>'+
           '<div><span class="lbl">Correct answer</span>'+esc(correctText(x))+'</div></div>';
    } else {
      h += '<p class="muted"><b>⚠ Not answered — excluded from score.</b> This exercise did not count as right or wrong, '+
           'and its points were not added to the total possible points.</p>';
    }
    h += '<p class="exp">'+x.explain+'</p>';
    if(x.type === 'terminal'){ h += canonicalHTML(x); }
    if(r && r.status !== 'correct' && x.tip){ h += '<div class="tip" style="border-left-color:var(--warn);background:#2a2008">'+
         '<b>What to study:</b> '+x.tip+'</div>'; }
    h += '</div>';
  });
  h += '</div></div>';

  $('#stage').innerHTML = h;
  updateHUD();
  scrollTop();
}
function themeBars(){
  var themes = {}, order = [];
  S.pool.forEach(function(x){
    if(!themes[x.theme]){ themes[x.theme] = {correct:0, answered:0, total:0}; order.push(x.theme); }
    themes[x.theme].total++;
    var r = S.res[x.id];
    if(r && r.status !== 'skipped'){ themes[x.theme].answered++; if(r.status==='correct'){ themes[x.theme].correct++; } }
  });
  var h = '<h3 style="margin-top:1rem">Result by theme</h3><div class="bars">';
  order.forEach(function(t){
    var v = themes[t];
    var pc = v.answered ? Math.round((v.correct/v.answered)*100) : 0;
    h += '<div class="bar"><span>'+esc(t)+'</span><span class="track"><span class="fill" style="width:'+pc+'%"></span></span>'+
         '<span class="muted small">'+v.correct+'/'+v.answered+' ('+pc+'%)</span></div>';
  });
  return h + '</div>';
}
function retake(){
  S.tid && clearInterval(S.tid);
  S.tid = null;
  startExam();
}
function gotoReport(){
  var cards = $$('.card');
  if(cards.length > 1){
    try{ cards[1].scrollIntoView({behavior:'smooth'}); }catch(e){ cards[1].scrollIntoView(); }
  }
}

/* ------------------------- site handshake (optional) ------------------- */
window.addEventListener('message', function (event) {
  if (!event.data || typeof event.data !== 'object') { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* The learner's name may be shown; the theme is ignored because this exam
     ships a single dark theme, and the exam never requires this message. */
  if (event.data.username) {
    S.learner = String(event.data.username).slice(0, 40);
    var g = document.getElementById('whoami');
    if (g) { g.textContent = 'Learner: ' + S.learner; }
  }
});

/* ---------------------------------- boot ------------------------------- */
function boot(){
  $('#stage').innerHTML = INTRO_HTML;
  $('#hudTime').textContent = fmt(EXAM.minutes*60);
  var sev = $('#sevBadge');
  if(sev){ sev.className = 'sev ' + EXAM.sevClass; }
  updateHUD();
}
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.started && !S.done){ togglePause(); }
});
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
