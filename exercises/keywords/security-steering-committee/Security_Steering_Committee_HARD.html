<style>

/* ---------- persistent exam header (the only header the file draws) ---------- */

.hud{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}

.btn.primary{background:linear-gradient(135deg,var(--acc),#2563eb);color:#04101f;font-weight:700;border-color:transparent}

.qmeta{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.5rem}
.badge{font-size:.75rem;border-radius:999px;padding:.16rem .6rem;border:1px solid var(--line2);color:#cfe2ff;

/* ---------- SCENARIO / QUESTION / YOUR ANSWER blocks ---------- */
.block{border:1px solid var(--line);border-radius:14px;margin:.75rem 0;overflow:hidden;background:#0c1729}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.45rem .75rem;

.sortlist{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.45rem}

.sortlist .mv{display:flex;flex-direction:row;gap:.2rem}

.bank{display:flex;flex-wrap:wrap;gap:.4rem;border:1px dashed var(--line2);border-radius:12px;

table.match{width:100%;border-collapse:collapse;font-size:.88rem;margin:.5rem 0}

/* ---------- terminal ---------- */
.termwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.7rem;align-items:start}

.syntaxpanel p{margin:.3rem 0}
pre.cmd{background:#05090f;border:1px solid #1d3350;border-radius:10px;padding:.6rem .7rem;overflow:auto;margin:.4rem 0}

.canonical{margin-top:.7rem;border-top:1px dashed var(--line);padding-top:.6rem}

.branchnode{border:1px solid var(--line2);border-radius:12px;padding:.8rem .95rem;background:#0b1525;margin:.3rem 0}

  font:inherit;font-size:.85rem;cursor:pointer}
.chipbtn.cur{outline:2px solid var(--acc);outline-offset:1px}
.chipbtn.good{background:#0d3320;border-color:var(--ok)}
.chipbtn.bad{background:#33121a;border-color:var(--bad)}
.chipbtn.skip{background:#33280a;border-color:var(--skip)}
.legend{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem}

/* ---------- review skipped ---------- */
.skipList{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.skipList li{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--skip);background:#1a1508;border-radius:10px;padding:.6rem .8rem}

/* ---------- results ---------- */
.resulthead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cert{border:2px solid var(--acc);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1rem;
  background:linear-gradient(135deg,#0b1f36,#141033);text-align:center}
.cert .ct{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert .cn{font-size:1.5rem;font-weight:800;margin:.3rem 0}
.cert .cs{font-size:1rem;color:#cfe2ff}
.bars{display:grid;gap:.5rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:200px 1fr 90px;gap:.6rem;align-items:center;font-size:.85rem}
@media (max-width:640px){.bar{grid-template-columns:130px 1fr 70px}}
.bar .track{height:10px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.report{display:grid;gap:.8rem;margin-top:.7rem}
.rep{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;background:#0b1525}
.rep.good{border-left:4px solid var(--ok)} .rep.bad{border-left:4px solid var(--bad)} .rep.na{border-left:4px solid var(--skip)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#0b1525}
.stat .n{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- pause overlay ---------- */
body.paused #stage{filter:blur(14px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:#050a12cc;backdrop-filter:blur(3px);padding:1rem}
.pausepanel{max-width:520px;border:1px solid var(--acc);border-radius:16px;background:#0b1525;padding:1.2rem 1.3rem;text-align:center}

@media (max-width:600px){
  body{font-size:15px}
  .qtitle{font-size:1.05rem}
  .bigscore{font-size:2.2rem}
}

</style>

<script>
var EXAM = {"keyword": "Security Steering Committee", "severity": "HARD", "sevClass": "hard", "passScore": 70, "minutes": 55, "intro_blurb": "Challenging level. Subtle distractors, near-miss answers and multi-step reasoning: several options are true statements used in the wrong place, and the obvious answer is sometimes wrong.", "sev_text": "HARD - Challenging. Expect exercises where two options both look defensible and only one survives a careful reading of the charter, the classification rules or the numbers. Memorised definitions are not enough: you must apply the rule to the artefact in front of you.", "topicId": "security-steering-committee", "batch": 3, "difficulty": "hard", "questionCount": 12, "estimatedMinutes": 55};
var EXERCISES = [{"id": "HARD-07", "type": "match", "theme": "Compliance, Audit & Standards", "title": "Match each framework with the governance duty it creates", "brief": "Control library update · six frameworks, seven duties", "scenario": "<p>The control library must show, for each framework, which governance duty it creates. The committee will use this table to prepare the annual compliance calendar.</p>", "artefacts": [{"label": "ARTEFACT 1 — control library framework metadata", "kind": "table", "title": "control-library-frameworks.csv", "meta": "GRC platform", "head": ["Framework", "Version", "Applies to", "Review cycle"], "rows": [["ISO/IEC 27001", "2022", "group ISMS", "annual management review"], ["NIST CSF", "2.0", "group security programme", "annual"], ["DORA", "2022/2554", "financial entities in the group", "at least yearly"], ["NIS2", "2022/2555", "essential and important services", "after material change"], ["PCI DSS", "4.0.1", "card payment services", "annual (service providers)"], ["SOC 2", "trust criteria 2017", "shared service centre", "annual"]]}, {"label": "ARTEFACT 2 — scope notes from the compliance lead", "kind": "email", "title": "scope-notes.txt", "meta": "compliance mailbox", "lines": ["Subject: control library - scope notes before the calendar is built", "DORA covers the financial sector. NIS2 covers essential and important services.", "Read GV.OV as the oversight loop that feeds back into strategy.", "Read GV.RM as the place where appetite and tolerance live.", "Requirement 12.4.1 applies to service providers, not to merchants."]}, {"label": "ARTEFACT 3 — last year's compliance calendar", "kind": "table", "title": "compliance-calendar-2024.csv", "meta": "compliance planning file", "head": ["Month", "Item", "Owner"], "rows": [["March", "Management review of the ISMS, with records kept", "Head of security"], ["June", "Appetite and tolerance refresh", "Chief risk officer"], ["September", "Third-party policy approval", "Procurement lead"], ["November", "Board independence attestation", "Company secretary"]]}], "prompt": "Match each framework clause with the duty it creates.", "pairs": [{"left": "ISO/IEC 27001 clauses 9.3.1 and 9.3.3", "right": "Top management must review the ISMS at planned intervals and retain records of the results"}, {"left": "NIST CSF 2.0 GV.OV", "right": "Oversight results must be used to adjust the risk management strategy"}, {"left": "NIST CSF 2.0 GV.RM", "right": "Risk appetite and tolerance must be set, communicated and used to prioritise work"}, {"left": "DORA article 5", "right": "The management body approves the ICT risk strategy and bears ultimate responsibility for it"}, {"left": "NIS2 article 20", "right": "The management body approves the risk measures, oversees their implementation and can be held liable"}, {"left": "PCI DSS requirement 12.4.1 (service providers)", "right": "Executive management must assign responsibility for card data protection and review the compliance programme"}, {"left": "SOC 2 CC1.2", "right": "The board must show independence and oversight of the control environment"}], "explain": "Each framework says the same thing in its own words. Leaders must direct, approve and review. ISO/IEC 27001 asks for a recorded management review, with the evidence kept. NIST CSF 2.0 GV.OV asks oversight results to feed back into strategy. GV.RM is where appetite and tolerance are set and used. DORA and NIS2 put personal accountability on the management body. Those two are the near-twin options in this table. PCI DSS 12.4.1 asks service providers to assign responsibility and review the compliance programme. SOC 2 CC1.2 asks for board independence and oversight. Knowing which clause creates which duty lets you build one compliance calendar instead of five.", "tip": "Group them: review records (ISO), feedback loop (NIST GV.OV), appetite and tolerance (NIST GV.RM), personal accountability (DORA and NIS2), assigned responsibility for service providers (PCI), board independence (SOC 2).", "hint": "Two frameworks use almost the same wording, because they are the EU financial and critical-infrastructure rules."}, {"id": "HARD-08", "type": "terminal", "theme": "Assurance & Continuous Improvement", "title": "Build the evidence pack the regulator asked for", "brief": "Evidence request E-2025-14 · governance workstation ws-grc-02 · Linux, bash · due in 5 working days", "scenario": "<p>You are on the governance workstation <code>ws-grc-02</code> (Linux, bash). On the PATH: the toolkit the committee secretary uses for the committee record stores, the standard shell utilities, and a SQL client for the reporting database. You hold <b>read-only</b> rights on the records. You may write into <code>/evidence</code>, and the governance signing key for that folder is available to your account.</p><p>A regulator wants to understand how management reviewed a risk acceptance that stayed open for a year with no review date. Nothing on this workstation is a copy: it is the live record set. Whatever you run, run it so that the record can be produced again tomorrow and still match.</p>", "artefacts": [{"label": "ARTEFACT 1 — regulator evidence request", "kind": "email", "title": "request-E-2025-14.txt", "meta": "supervisory correspondence register", "lines": ["Subject: evidence request E-2025-14 - risk acceptance with no review date", "Please produce three items for RISK-233.", "We need proof that the meeting could decide, the complete history of the decision, and a signed pack.", "The history must be as recorded at the time, not a later summary.", "Deadline: five working days."]}, {"label": "ARTEFACT 2 — workstation fact sheet", "kind": "config", "title": "ws-grc-02-facts.txt", "meta": "asset and access management", "lines": ["host: ws-grc-02 (Linux, bash)", "installed: governance records toolkit, reporting SQL client, core utilities", "rights: read-only on the records, write access on /evidence", "the record set is live; no staging copy exists", "every command is logged with the operator name"]}, {"label": "ARTEFACT 3 — record store index", "kind": "table", "title": "record-stores.csv", "meta": "records platform inventory", "head": ["Store", "Contents", "Access"], "rows": [["meetings", "attendance, agenda and quorum results", "read-only"], ["decisions", "decision records with the full change history", "read-only"], ["evidence", "exported and signed packs", "read and write"], ["reporting db", "dashboards built from the two stores", "read-only"]]}], "prompt": "Type the command for each step in the terminal. The objective of each step is listed one by one beside the terminal.", "objective": "Give the regulator three things: a valid meeting, a decision trace, and a signed pack in /evidence.", "console": "governance workstation ws-grc-02", "consoleMode": "read-only records · write access to /evidence · signing key available", "steps": [{"goal": "Show the attendance of the meeting of 3 March 2025 and prove that it could validly decide.", "accept": ["^gov\\s+attendance\\s+check\\s+--meeting\\s+ssc-2025-03\\s+--quorum$", "^gov\\s+attendance\\s+check\\s+--quorum\\s+--meeting\\s+ssc-2025-03$"], "out": "SSC-2025-03 | voting members present 6 of 9 | quorum required 5 | result: VALID", "err": "That command does not prove a valid quorum for one meeting.", "danger": [["^gov\\s+attendance\\s+(reset|clear|delete)", "That command clears attendance data on the live record set. You have read-only rights: you are here to produce evidence, not to change it."], ["^gov\\s+meeting\\s+close", "Closing the meeting changes the record. The regulator asked what happened, not for a tidy-up."]]}, {"goal": "Show the whole history of decision DEC-2025-047: when it was recorded, by whom, and whether a review date was ever set.", "accept": ["^gov\\s+decision\\s+trace\\s+--id\\s+dec-2025-047$", "^gov\\s+decision\\s+trace\\s+dec-2025-047$"], "out": "DEC-2025-047 | SSC-2025-05 | item 3 | accepted risk RISK-233 | owner Group Shared Services | review: none | recorded by secretary", "err": "That command does not show the full history of one decision. A summary view shows the current state; the auditor wants the trace.", "danger": [["^gov\\s+decision\\s+(close|delete|edit|reopen)", "That edits or closes the decision. The record must stay exactly as it was recorded; a change would itself be a finding."]]}, {"goal": "Produce the signed evidence pack for case E-2025-14 and write it into /evidence.", "accept": ["^gov\\s+evidence\\s+export\\s+--case\\s+e-2025-14\\s+--dest\\s+/evidence/pack\\s+--sign$", "^gov\\s+evidence\\s+export\\s+--case\\s+e-2025-14\\s+--sign\\s+--dest\\s+/evidence/pack$", "^gov\\s+evidence\\s+export\\s+--case\\s+e-2025-14\\s+--dest\\s+/evidence\\s+--sign$"], "out": "Evidence pack /evidence/pack/E-2025-14.pdf written (14 pages) | signed with governance key | verified: yes", "err": "That command does not export a signed pack for one case into a named folder.", "danger": [["--overwrite|--force", "That would overwrite an existing pack. If a response has already been filed, replacing it destroys the version the regulator holds."]]}], "canonical": [{"cmd": "gov attendance check --meeting SSC-2025-03 --quorum", "parts": ["gov — the governance records toolkit (not named in the objective: you had to know it)", "attendance check — read the attendance, do not change it", "--meeting SSC-2025-03 — the meeting under review", "--quorum — apply the charter rule and report VALID or not"]}, {"cmd": "gov decision trace --id DEC-2025-047", "parts": ["decision trace — the full history, not the summary (<code>decision show</code> would have given you the current state only)", "--id DEC-2025-047 — the decision the regulator asked about"]}, {"cmd": "gov evidence export --case E-2025-14 --dest /evidence/pack --sign", "parts": ["evidence export — build the pack", "--case E-2025-14 — the request reference", "--dest /evidence/pack — write it to the evidence folder you own", "--sign — attach the governance signature, which is what makes the pack verifiable"]}], "explain": "The environment told you what was installed and what you were allowed to do. Selecting the toolkit, the verb and the options was the actual work. Two near misses matter here. <code>decision show</code> looks right, but it returns only the current state. It cannot prove that no review date was ever set. The trace can prove that. <code>--overwrite</code> would produce a pack, but by replacing the previous version. On an evidence request that is destruction, not housekeeping. Notice also that the record set is live and your rights are read-only. Every command above reads. The only write goes to <code>/evidence</code>.", "tip": "Mode matters as much as the flag: a command that changes the record is the wrong command, even when it answers the question.", "hint": "Ask two questions per step: does this read or does it write, and does it show history or only today's state?"}, {"id": "HARD-09", "type": "order", "theme": "Assurance & Continuous Improvement", "title": "Order the life of a policy, from draft to review", "brief": "Policy POL-AC-04 access control · revision 6 · waiting for the agenda", "scenario": "<p>The access control policy must be revised because the company moved to a hybrid working model. The policy owner asks you to place the seven steps of the revision in the right order before it goes to the committee.</p>", "artefacts": [{"label": "ARTEFACT 1 — policy register extract", "kind": "table", "title": "policy-register.csv", "meta": "policy management system", "head": ["Policy", "Version", "Owner", "Next review", "Status"], "rows": [["POL-AC-04 access control", "5", "Head of IAM", "2025-12-31", "in force since 2023-04"], ["POL-RM-01 risk management", "3", "Chief risk officer", "2025-06-30", "in force"], ["POL-TP-02 third-party security", "2", "Procurement lead", "2025-09-30", "draft"]]}, {"label": "ARTEFACT 2 — revision request from the policy owner", "kind": "email", "title": "revision-request.txt", "meta": "policy owner mailbox", "lines": ["Subject: POL-AC-04 revision 6 - hybrid working", "Remote access rules for contractors no longer match how people work.", "Two open exceptions will need a decision at the same time.", "Legal asked to see the exceptions before they review the wording."]}, {"label": "ARTEFACT 3 — open exception register", "kind": "table", "title": "exception-register.csv", "meta": "risk and compliance register", "head": ["Exception", "Description", "Expires", "Owner"], "rows": [["EX-2025-11", "standing admin rights for the SAP team", "2025-12-31", "Head of IAM"], ["EX-2025-14", "contractor remote access without a managed device", "2025-11-30", "Retail IT lead"]]}], "prompt": "Put the seven steps in the correct order (first step on top).", "items": ["The policy owner drafts the change and states the business reason for it.", "The risk team checks the change against the risk register and the exceptions that are still open.", "The affected teams are consulted, and the exceptions they will need are identified.", "Legal and privacy review the wording together with the exceptions the teams need.", "The committee approves the policy and records the decision, the owner and the effective date.", "The approved policy is published, and the training, control and evidence updates are assigned to owners.", "The policy is reviewed on its scheduled cycle, or earlier after a material change."], "explain": "A policy is not a document. It is a decision with a life cycle. The owner drafts the change and the business reason. The risk team checks it against the live risk and exception picture. The affected teams are consulted <b>before</b> the legal review. That way the exceptions they need are known in advance. Only then does the committee approve. Then the organisation publishes, trains and updates its controls. The cycle ends with a scheduled review. Approving before consultation produces a policy that is born broken. It arrives full of exceptions.", "tip": "Exceptions must be known before the policy is approved. Otherwise the policy is written for a company that does not exist.", "hint": "Ask what the legal reviewer needs in front of them before they can review the wording."}, {"id": "HARD-10", "type": "rank", "theme": "Enterprise Risk Management", "title": "Rank the top risks for the board pack", "brief": "Board report Q3 · five candidates, one page only", "scenario": "<p>The board pack has room for five risks in priority order. Rank them using the residual score first, then the regulatory exposure, then the number of people affected.</p>", "artefacts": [{"label": "ARTEFACT 1 — board risk shortlist, Q3", "kind": "table", "title": "board-risk-shortlist-Q3.csv", "meta": "risk team export", "head": ["Risk", "Residual score", "People affected", "Regulatory exposure", "Trend"], "rows": [["RISK-301 payment data exposure", "20", "48,000 customers", "High - notification and fine exposure", "Worsening"], ["RISK-302 warehouse systems outage", "16", "900 staff, no customers", "Low", "Stable"], ["RISK-303 supplier with expired certificate", "16", "120,000 customers (shared data)", "Medium - supplier duty", "Worsening"], ["RISK-304 phishing losses", "12", "staff only", "Low", "Improving"], ["RISK-305 single data centre in a flood zone", "15", "48,000 customers", "Medium - recovery duty", "Stable"]]}, {"label": "ARTEFACT 2 — board reporting standard extract", "kind": "doc", "title": "reporting-standard-3.2.txt", "meta": "board reporting standard §3.2", "lines": ["## 3.2 Order of the board risk page", "Rank the risks by residual score first.", "Where scores are equal, use regulatory exposure, then the number of people affected.", "A lower score never outranks a higher one, whatever the trend says."]}, {"label": "ARTEFACT 3 — supplier certificate notice", "kind": "doc", "title": "supplier-notice.txt", "meta": "third-party risk register", "lines": ["Supplier certificate: expired 2025-08-30; renewal blocked by the supplier's own audit.", "Shared data set: 120,000 customer records in loyalty and delivery systems.", "No customer notification duty is confirmed yet."]}], "prompt": "Drag the five risks into reporting order (highest priority on top).", "items": ["RISK-301 payment data exposure", "RISK-303 supplier with expired certificate", "RISK-302 warehouse systems outage", "RISK-305 single data centre in a flood zone", "RISK-304 phishing losses"], "explain": "The residual score orders the list: 20, then the two 16s, then 15, then 12. For the two 16s the tie-break decides. RISK-303 has medium regulatory exposure, affects 120,000 customers and is worsening. Its data is shared with a supplier, which widens the duty. RISK-302 affects no customers, has low regulatory exposure and is stable. RISK-305 scores 15, so it stays below RISK-302 at 16, even though it affects customers. The rule is score first. Ranking is not a matter of taste. <b>State the rule, then apply it.</b>", "tip": "Score first, then regulatory exposure, then people affected — and write the rule in the pack so the board can challenge it.", "hint": "Three risks have similar numbers. Sort strictly by score, then use the tie-break columns."}, {"id": "HARD-11", "type": "mcq", "theme": "Governance & Oversight", "title": "Which statement about the minutes is defensible?", "brief": "Audit question · evidence for a decision taken 14 months ago", "scenario": "<p>A regulator asks for proof that the committee accepted a risk in 2024. The minutes were written after the meeting, sent by email to the members, and approved at the following meeting. One member says he does not remember the item.</p>", "artefacts": [{"label": "ARTEFACT 1 — approval trail for the 2024 decision", "kind": "table", "title": "minutes-approval-trail.csv", "meta": "committee records system", "head": ["Date", "Event", "Record"], "rows": [["2024-06-11", "SSC-2024-06 accepts RISK-118 (data retention exception)", "draft minutes"], ["2024-06-14", "Draft minutes sent to every member by e-mail", "mail archive"], ["2024-07-09", "Minutes approved at SSC-2024-07, item 1", "signed minute set"], ["2025-08-20", "Regulator asks for evidence of the acceptance", "evidence request"]]}, {"label": "ARTEFACT 2 — charter extract on records", "kind": "doc", "title": "ssc-charter-9.txt", "meta": "SSC charter §9", "lines": ["## 9.1 Minutes", "Minutes record the decision, the owner and the effective date.", "The committee approves them at the next meeting, and the chair signs them.", "## 9.2 Corrections", "A factual error is corrected by a minute at a later meeting.", "A past decision is never rewritten.", "## 9.3 Between meetings", "The chair may decide on communication and scheduling only."]}, {"label": "ARTEFACT 3 — note from the member who does not recall the item", "kind": "email", "title": "member-note.txt", "meta": "committee mailbox", "lines": ["Subject: Re: evidence request - RISK-118", "I do not recall this item, but I was present and I received the draft.", "I have no record of objecting at the time."]}], "prompt": "Which statement about the minutes is correct?", "options": ["The minutes may be corrected at any time if a member later disagrees with the decision that was recorded.", "Minutes approved at the next meeting are the official record and valid evidence, even if a member forgets.", "The minutes are only a summary, so a signed email from the chair is the real proof of the decision taken.", "The minutes must be signed by every member who was present, otherwise the decision is not valid."], "correct": [1], "explain": "Minutes are the official record of what was decided. The committee approves them, usually at the following meeting. From that moment they are the evidence auditors and regulators use. A single email from the chair is not a decision. There is no quorum and no formal acceptance. Not every member has to sign the minutes. <b>The approved record is enough.</b> Minutes may be corrected for factual errors. They cannot silently change a decision that was taken.", "tip": "Separate a factual correction from a change of decision. Only the first one is allowed.", "hint": "Think about which document an auditor would accept as proof, and why a chair's email is not enough."}, {"id": "HARD-12", "type": "log", "theme": "Metrics, KPIs & KRIs", "title": "Which KRI must reach the committee within five days?", "brief": "KRI dashboard extract · tolerances set in the risk appetite statement", "scenario": "<p>The charter says two things. Any KRI that has crossed its escalation threshold must be reported to the committee within five working days. Any KRI outside its tolerance for two consecutive months must be tabled at the next meeting. You must find the indicator that triggers the five-day report.</p>", "artefacts": [{"label": "ARTEFACT 1 — charter extract, reporting obligations", "kind": "doc", "title": "handbook-4.2.txt", "meta": "governance handbook §4.2", "lines": ["## 4.2 Reporting obligations of the steering committee", "The committee reports to the board risk committee every quarter.", "An indicator that has crossed its escalation threshold is reported within five working days.", "An indicator outside its tolerance for two consecutive months is tabled at the next meeting.", "The quarterly board pack carries the indicators, the accepted risks and the open findings."]}, {"label": "ARTEFACT 2 — KRI dashboard, October month-end extract", "kind": "table", "title": "kri-dashboard-2025-10.csv", "meta": "monthly governance pack", "head": ["KRI", "Tolerance", "Escalation threshold", "Last month", "This month", "Trend"], "rows": [["Patch SLA compliance (critical systems patched on time)", ">= 95%", "< 90%", "88%", "86%", "Worsening"], ["MTTD for high-severity alerts", "<= 30 min", "> 60 min", "22 min", "26 min", "Stable"], ["Phishing failure rate", "<= 5%", "> 10%", "7%", "6%", "Improving"], ["Access reviews completed on time", ">= 96%", "< 88%", "93%", "91%", "Worsening"], ["Critical vulnerabilities past SLA (count)", "<= 10", "> 25", "18", "24", "Worsening"]]}, {"label": "ARTEFACT 3 — monthly reporting cycle log", "kind": "log", "title": "kri-reporting-log.txt", "meta": "governance reporting job", "lines": [["INFO", "2025-10-02 KRI values collected from the five source systems"], ["INFO", "2025-10-03 monthly governance pack built from kri-dashboard-2025-10.csv"], ["WARN", "2025-10-03 several indicators now sit outside their tolerance line"], ["INFO", "2025-10-06 pack circulated to the committee for the next meeting"]]}], "prompt": "Which KRI must be reported to the committee within five working days?", "options": ["Access reviews at 91%, which are outside the tolerance for the second month in a row.", "Critical vulnerabilities past SLA at 24, which is above the tolerance of 10.", "MTTD at 26 minutes, which is above the tolerance of 30 minutes.", "Patch SLA compliance at 86%, which has crossed its escalation threshold."], "correct": [3], "explain": "Two rules apply here, and they are not the same rule. The five-day report follows a KRI that has <b>crossed its escalation threshold</b>. Patch SLA compliance is at 86%, under the 90% threshold. It must therefore be reported urgently. Access reviews at 91% are outside the tolerance of 96% for two months in a row. That requires tabling at the next meeting. Even so, 91% is still above the escalation threshold of 88%. The vulnerability count of 24 is above tolerance but under the escalation threshold of 25. It stays in monthly monitoring. MTTD is 26 minutes, inside the 30-minute tolerance. That option states the opposite of the table.", "tip": "For every KRI, compare the value with the tolerance and with the escalation threshold separately. The crossing of the threshold drives the urgent report.", "hint": "Look for the value that is below its escalation threshold — not merely outside its tolerance."}, {"id": "HARD-01", "type": "branch", "theme": "Operational Integration", "title": "A public data bucket becomes a press story", "brief": "Major incident MI-2025-07 · customer analytics storage · 14:20", "scenario": "<p>A security researcher reports that a customer analytics storage bucket was publicly readable for ten days. About 300,000 customer records with names, e-mail addresses and purchase history were exposed. Engineering has already changed the bucket policy. Access logs are kept for seven days only, so the first three days of the exposure window cannot be reconstructed. The researcher plans to publish a blog post in 48 hours, and legal asks whether notification is needed when there is no evidence that anybody downloaded the data.</p>", "artefacts": [{"label": "ARTEFACT 1 — cloud posture scan, 14:05 (two findings)", "kind": "log", "title": "posture-scan.txt", "meta": "cloud security posture tool", "lines": [["WARN", "BUCKET-01 marketing-assets-prod | public read | objects: 812 | contains: logos, press photos | owner: Brand team | intended to be public per design note DR-118"], ["CRIT", "BUCKET-02 cust-analytics-prod | public read for 10 days | objects: 41,208 | endpoint cust-analytics-prod.s3.eu-west-1[.]example[.]net | contains: names, e-mail addresses, purchase history | owner: Data team | policy changed to private at 14:02"]]}, {"label": "ARTEFACT 2 — researcher e-mail, 14:12", "kind": "email", "title": "researcher-e-mail.txt", "meta": "report mailbox", "lines": ["Subject: Public storage bucket with customer data (10 days)", "I found the analytics bucket on 4 October and reported it to your support address. Nobody replied.", "My write-up goes live in 48 hours. I have not downloaded anything, but I cannot speak for others."]}, {"label": "ARTEFACT 3 — exposure window against log retention", "kind": "table", "title": "exposure-timeline.csv", "meta": "incident record MI-2025-07", "head": ["Date", "Event", "Evidence"], "rows": [["25 Sep 09:10", "Bucket policy set to public by change CHG-9941", "change log"], ["25 Sep - 4 Oct", "Bucket readable without authentication", "posture scan"], ["28 Sep 00:00", "Oldest access log still retained (7-day retention)", "log platform"], ["4 Oct 11:00", "Researcher reports the bucket to support", "report mailbox"], ["5 Oct 14:02", "Bucket set to private by the data team", "change log"]]}], "prompt": "Work through the decision path. Only one option at each step is defensible.", "nodes": [{"text": "<b>Decision 1.</b> Engineering has already made the bucket private. What is the first governance action?", "options": [{"t": "Wait for the researcher's blog post, so that we learn the real scope before doing anything at all.", "ok": false, "why": "A third party never defines your scope. Waiting leaves the company unable to answer questions and unable to meet deadlines."}, {"t": "Preserve the evidence, confirm the exact scope of the exposed data, and check what the access logs still show.", "ok": true, "why": "The exposure is stopped, so the urgent work becomes evidence and scope: what data, which records, and what the remaining logs prove. Notification and communication decisions depend on those facts."}, {"t": "Delete the exposed objects from the bucket straight away, so that nobody can download them any more.", "ok": false, "why": "The bucket is already private. Deleting the objects destroys the evidence the regulator and the affected customers may require."}]}, {"text": "<b>Decision 2.</b> Access logs cover only seven of the ten exposed days. What do you tell the committee?", "options": [{"t": "Report the exposure with the evidence gap stated explicitly, and let the committee decide on notification.", "ok": true, "why": "An evidence gap is a fact to be reported, not to be hidden. The committee owns the risk-based notification decision, and it needs to know what cannot be proven."}, {"t": "Report that no unauthorised access occurred at all, because the access logs show nothing unusual.", "ok": false, "why": "Absence of evidence in a three-day gap is not evidence of absence. This statement would later be contradicted and would damage the company's credibility."}, {"t": "Ask the storage provider to recreate the missing three log days from its own internal backups.", "ok": false, "why": "Logs that were never collected cannot be recreated. Retention is a control decision that should already exist, and pretending otherwise wastes the response window."}]}, {"text": "<b>Decision 3.</b> The researcher publishes in 48 hours and a journalist calls the press office.", "options": [{"t": "Send the researcher a formal legal warning, asking him to delay the publication date by a week.", "ok": false, "why": "Threatening the person who reported the problem does not change the exposure and creates a second, reputational incident."}, {"t": "Prepare one agreed statement with legal and communications, and let the chair approve it between meetings.", "ok": true, "why": "The charter lets the chair act between meetings, so the statement can be approved in 48 hours and the committee is informed afterwards. A single agreed statement prevents contradictory messages."}, {"t": "Refuse to comment on the incident and instruct all members of staff not to speak to any journalist.", "ok": false, "why": "Silence after a confirmed exposure looks like concealment, and a blanket instruction to staff is not a communication strategy."}]}, {"text": "<b>Decision 4.</b> Notification. Personal data was exposed for ten days and access cannot be excluded.", "options": [{"t": "Treat it as a breach: notify the authority within 72 hours, then warn the affected people if the risk is high.", "ok": true, "why": "Two duties, two clocks. The supervisory authority must be told within 72 hours of becoming aware (GDPR Article 33). The affected people must be told without undue delay, and only when the risk to them is high (Article 34). The evidence gap is documented inside the notification instead of being used as a reason to wait."}, {"t": "Do not notify the authority or the customers: there is no proof at all that anyone accessed the data.", "ok": false, "why": "Proof of access is not the legal test. Confidentiality was lost, and the company must assess and document the risk to the people concerned."}, {"t": "Notify only the customers who telephone the service centre after they hear the news story.", "ok": false, "why": "Selective notification based on complaints leaves the other affected people uninformed and is indefensible to a regulator."}]}], "explain": "This exercise chains four governance duties: preserve the evidence, report uncertainty honestly, speak with one approved voice, and test notification against real risk. It also contains the decoy you had to discard. BUCKET-01 looks alarming in the scan, because it is a public bucket with 812 objects. A design note says it is meant to be public, and it holds logos and press photos. BUCKET-02 is the real exposure. In every wrong option the trap is the same. Each one turns an uncomfortable fact into a comfortable story. They delete the evidence, deny that any access happened, silence the press, or notify only the people who complain.", "tip": "Write the facts in two columns: what is proven, and what cannot be excluded. Both columns go to the committee.", "hint": "For each wrong option, ask whether it removes the exposure or only removes the information about the exposure."}, {"id": "HARD-02", "type": "log", "theme": "Compliance, Audit & Standards", "title": "The audit report has a classification problem", "brief": "Internal audit report A-2025-04 · access management · draft for management response", "scenario": "<p>The draft audit report is on your desk for review before the committee sees it. You must check whether every finding is classified and treated according to the company's own rules.</p>", "artefacts": [{"label": "ARTEFACT 1 — internal audit report extract A-2025-04 (draft)", "kind": "log", "title": "A-2025-04-draft.txt", "meta": "internal audit · draft", "lines": [["INFO", "Report A-2025-04, issued 2025-05-06, draft for management response | four findings"], ["INFO", "Finding 1: 14 of 40 leavers still had active accounts 30 days after their last working day | classified: major nonconformity | owner HR | target 2025-06-30"], ["INFO", "Finding 2: 6 service accounts use passwords that never expire | classified: minor nonconformity | owner Infrastructure | target 2025-09-15"], ["WARN", "Finding 3: the finance access review was not signed for two of four quarters | classified: observation | owner Finance | target 2025-12-31"], ["ERR", "Finding 4: privileged access to the payment gateway is never reviewed; three administrators have held the same rights for four years | classified: observation | owner Payments | target 2026-01-31"]]}, {"label": "ARTEFACT 2 — classification and remediation policy", "kind": "table", "title": "classification-policy.csv", "meta": "governance handbook §7", "head": ["Severity", "Rule", "Remediation limit"], "rows": [["Major", "affects a system in the regulatory scope, or repeats a finding from an earlier audit", "90 days from the issue date"], ["Minor", "local effect, no regulatory scope, first occurrence", "180 days from the issue date"], ["Observation", "no control failure yet, improvement only", "365 days from the issue date"]]}, {"label": "ARTEFACT 3 — audit history and regulatory scope register", "kind": "table", "title": "audit-registers.csv", "meta": "audit management system", "head": ["Register", "Entry", "Status"], "rows": [["A-2024-11 file", "Privileged access to the payment gateway reviewed ad hoc only (same issue)", "previous finding"], ["A-2024-11 file", "No other finding in this report repeats an earlier audit finding", "first occurrence"], ["Regulatory scope register", "PG-01 payment gateway listed (cardholder data, financial sector rules)", "in scope"], ["Remediation tracker", "Each of the four findings has a named owner and a target date", "complete"]]}], "prompt": "Which finding is classified and treated incorrectly?", "options": ["Finding 4: it is major on both policy tests, so the 31 January target also breaks the 90-day limit.", "Finding 1: the 30 June target is outside the 90-day limit, so the finding is treated incorrectly.", "Finding 2: a repeat of an earlier audit finding must be classified as major, not as minor.", "Finding 4: the classification is right, but the 31 January target is outside the 365-day limit."], "correct": [0], "explain": "The company's own policy gives two tests for a <b>major</b> finding. A finding is major when it affects a system in the regulatory scope. It is also major when it repeats a finding from an earlier audit. Finding 4 fails both tests. The payment gateway is on the regulatory scope register. The same issue already appeared in audit A-2024-11. Yet the report calls it an observation with a target in 2026. The report was issued on 6 May 2025. A major finding had 90 days, which ended on 4 August 2025, so the 31 January 2026 target is far outside it. Check the others with the same arithmetic. Finding 1 targets 30 June, 55 days after issue, inside 90 days. Finding 2 targets 15 September, 132 days after issue, inside 180 days, and the register shows it is a first occurrence. Finding 3 targets 31 December, inside the 365 days allowed for an observation, and an observation still needs an owner. <b>Downgrading a finding hides risk.</b>", "tip": "Test every finding against the written classification rules and their time limits before you accept the label the author gave it.", "hint": "Two artefacts decide Finding 4: the classification policy and the audit history. The policy clock also starts somewhere specific."}, {"id": "HARD-03", "type": "classify", "theme": "Governance & Oversight", "title": "Board risk committee, audit committee or steering committee?", "brief": "Governance map refresh · three bodies with close decision rights", "scenario": "<p>After the governance review the company has a board risk committee, an audit committee and a security steering committee. The secretary is routing the next agenda and every item must land in exactly one place.</p>", "artefacts": [{"label": "ARTEFACT 1 — group governance manual extract, decision rights", "kind": "doc", "title": "governance-manual-5.txt", "meta": "group governance manual §5", "lines": ["## 5.1 Board risk committee", "Sets the risk appetite of the group and reviews the aggregated profile across all risk types.", "## 5.2 Audit committee", "Safeguards the independence of assurance work and recommends the annual internal audit plan.", "## 5.3 Security Steering Committee", "Directs the security programme inside the appetite, funds remediation and approves the ISMS scope.", "## 5.4 Escalation duty", "Risk acceptances above the delegated limit are referred upward by the steering committee itself."]}, {"label": "ARTEFACT 2 — committee register", "kind": "table", "title": "committee-register.csv", "meta": "company secretariat", "head": ["Body", "Composition", "Meets", "Reports to"], "rows": [["Board risk committee", "Three non-executive directors and the CFO", "Quarterly", "Board"], ["Audit committee", "Independent non-executive directors only", "Four times a year", "Board"], ["Security Steering Committee", "CISO (chair), CIO, CFO, CRO, business owners", "Monthly", "Board risk committee"]]}, {"label": "ARTEFACT 3 — delegation and escalation matrix", "kind": "table", "title": "delegation-matrix.csv", "meta": "governance handbook §6", "head": ["Decision", "Delegated to", "Limit"], "rows": [["Risk appetite and group risk profile", "Board risk committee", "no delegation"], ["Annual internal audit plan", "Audit committee", "no delegation"], ["Security remediation funding", "Security Steering Committee", "EUR 1.5m per year"], ["Risk above the delegated limit", "Steering committee refers it; the board decides", "any amount"]]}], "prompt": "Drag each item into the body that owns it.", "buckets": ["Board risk committee", "Audit committee", "Security Steering Committee"], "items": [{"text": "Approve the enterprise risk appetite statement for the whole group", "bucket": "Board risk committee"}, {"text": "Own the aggregated view of all enterprise risks, not only security risks", "bucket": "Board risk committee"}, {"text": "Approve the annual internal audit plan and protect audit independence", "bucket": "Audit committee"}, {"text": "Receive the external auditor's report and follow up the remediation of a material weakness", "bucket": "Audit committee"}, {"text": "Prioritise and fund the security remediation programme inside the approved risk appetite", "bucket": "Security Steering Committee"}, {"text": "Approve the scope of the information security management system and its policies", "bucket": "Security Steering Committee"}, {"text": "Decide whether a risk accepted by the steering committee must be escalated to the board", "bucket": "Security Steering Committee"}], "explain": "The three bodies look similar, but their rights are different. The board risk committee owns the appetite and the group-wide view of risk. The audit committee owns assurance. That covers the audit plan, the external auditor, independence and the follow-up of material weaknesses. The steering committee works inside the appetite. It prioritises, funds and accepts security risk, and it decides when to escalate. The escalation item is the common trap. <b>The steering committee takes the decision to escalate.</b> The board body then decides what to do with the escalated risk.", "tip": "Split them: appetite and group view (board risk), assurance and auditor (audit), delivery inside the limit (steering).", "hint": "Two items belong to each board body, and one item is about the escalation decision itself."}, {"id": "HARD-04", "type": "multi", "theme": "Compliance, Audit & Standards", "title": "What the management body cannot delegate", "brief": "Regulatory mapping · DORA (EU digital operational resilience act) article 5 and NIS2 article 20", "scenario": "<p>The legal team asks which duties under the new financial-sector rules stay with the management body and cannot be pushed down to the CISO or to a committee. DORA is the EU rule on digital operational resilience for the financial sector; NIS2 is the EU rule on the security of essential and important services.</p>", "artefacts": [{"label": "ARTEFACT 1 — regulatory extract, governance articles", "kind": "doc", "title": "dora-nis2-extract.txt", "meta": "legal research note", "lines": ["## DORA article 5 - governance and organisation", "The management body defines, approves and reviews the ICT risk strategy.", "It approves and reviews the policy on ICT third-party service providers.", "It bears ultimate responsibility for managing ICT risk.", "## NIS2 article 20 - governance", "Management bodies approve the risk measures and oversee how they are implemented.", "They can be held liable for infringements."]}, {"label": "ARTEFACT 2 — delegation of authority register", "kind": "table", "title": "delegation-register.csv", "meta": "group delegation of authority register", "head": ["Duty", "Delegated to", "Evidence"], "rows": [["Annual ICT risk strategy", "not delegated - management body", "board minutes"], ["ICT third-party policy", "not delegated - management body", "board minutes"], ["Provider due diligence checks", "security and procurement teams", "assessment file"], ["Technical hardening standard", "platform engineering", "standard document"], ["Backup restoration drill", "infrastructure operations", "drill report"]]}, {"label": "ARTEFACT 3 — management body minutes extract", "kind": "minutes", "title": "board-minutes-B-2025-03.txt", "meta": "board minutes B-2025-03, item 6", "lines": ["## Item 6 - resilience programme", "The body approved the ICT risk strategy and the third-party policy for 2025.", "The programme budget of EUR 2.4m was approved at the same meeting.", "Implementation was delegated to the CISO, with quarterly reporting."]}], "prompt": "Select every duty that stays with the management body itself.", "options": ["Operating the backup restoration procedure during an incident.", "Approving the ICT risk management strategy and reviewing it periodically.", "Bearing the ultimate responsibility for managing ICT risk.", "Approving and reviewing the policy on ICT third-party service providers.", "Allocating the budget needed for the ICT risk framework, including training.", "Delegating the approval of the ICT third-party policy to the CISO, with a report to the management body.", "Writing the technical hardening standard for operating systems."], "correct": [1, 2, 3, 4], "explain": "Financial-sector rules such as DORA put specific duties on the management body. The body approves the ICT risk strategy and reviews it periodically. The framework itself must also be reviewed at least once a year. The body approves the third-party policy, provides the budget and carries ultimate responsibility. Execution can be delegated. Triage, hardening standards and restoration are all execution work. <b>Approval and accountability cannot be delegated.</b> The near-miss option delegates the approval itself. A body may delegate the work of assessing providers. It may never delegate the approval of the policy or the accountability. Regulators look for these approvals in the minutes. That is exactly why the committee record matters.", "tip": "Separate approval and accountability (management body) from execution (teams and tools). A delegated approval is not a control, it is a gap.", "hint": "For each option, ask who is answerable if it goes wrong: a team, or the board itself?"}, {"id": "HARD-05", "type": "mcq", "theme": "Roles & Stakeholders", "title": "One vote too many", "brief": "Extraordinary meeting SSC-2025-09 · item: accept RISK-702", "scenario": "<p>RISK-702 concerns the customer identity platform. The voting members present are the CISO (chair), the CIO, the CFO, the chief risk officer and the retail business owner. The CIO owns the platform programme and is also the risk owner for RISK-702. The charter requires five votes for a decision on a risk above appetite and says that a member with a direct ownership interest must leave the room for that item.</p>", "artefacts": [{"label": "ARTEFACT 1 — charter extract, quorum and conflicts", "kind": "doc", "title": "ssc-charter-6.txt", "meta": "SSC charter §6", "lines": ["## 6.2 Quorum", "A decision on a risk above appetite requires five voting members.", "## 6.3 Conflict of interest", "A member with a direct ownership interest declares it, leaves the room and does not vote.", "## 6.4 Chair", "The chair may act between meetings on communication and scheduling only, never on risk acceptance."]}, {"label": "ARTEFACT 2 — attendance register for SSC-2025-09", "kind": "table", "title": "ssc-2025-09-attendance.csv", "meta": "committee secretariat", "head": ["Member", "Role", "Voting", "Interest in RISK-702"], "rows": [["A. Weber", "CISO, chair", "Yes", "None"], ["L. Fischer", "CIO", "Yes", "Owns the platform programme and the risk"], ["M. Novak", "CFO", "Yes", "None"], ["P. Okafor", "Chief risk officer", "Yes", "None"], ["S. Duran", "Retail business owner", "Yes", "None"], ["J. Lind", "Company secretary", "No", "None"], ["K. Braun", "Internal audit observer", "No", "None"]]}, {"label": "ARTEFACT 3 — risk register extract", "kind": "table", "title": "risk-register-extract.csv", "meta": "risk management system", "head": ["Risk", "Owner", "Level", "Open since"], "rows": [["RISK-702 customer identity platform", "CIO (L. Fischer)", "above appetite", "2025-08-14"], ["RISK-711 store network refresh", "Retail business owner (S. Duran)", "below appetite", "2025-09-02"], ["RISK-705 third-party booking engine", "CFO (M. Novak)", "below appetite", "2025-06-30"]]}], "prompt": "What is the correct handling of this item?", "options": ["The chair decides alone to avoid a deadlock and records the decision as urgent and exceptional.", "The CIO declares the interest and leaves; the item is deferred, because four votes are below five.", "The CIO declares the interest but still votes, because the charter only excludes suppliers and auditors.", "The CIO stays in the room while the other four vote, which is enough once the interest is declared."], "correct": [1], "explain": "A conflict of interest is a governance control. <b>The person who owns the risk cannot also vote to accept it.</b> When the CIO leaves, only four voting members remain. This decision needs five votes, so no valid decision can be taken. The item must be deferred to a properly constituted meeting. Declaring the interest does not restore the vote. The chair cannot decide alone. That would need an explicit emergency power in the charter and later ratification.", "tip": "A declaration of interest removes a vote. Recount the quorum after the person leaves the room.", "hint": "Two steps are needed: exclude the conflicted member, then check the quorum again."}, {"id": "HARD-06", "type": "fill", "theme": "Enterprise Risk Management", "title": "Write the appetite statement with precise words", "brief": "Group risk appetite statement v5 · security chapter", "scenario": "<p>The board risk committee will approve the security chapter of the risk appetite statement. Every word has a precise meaning, and the legal reviewer rejected the previous draft for using them loosely.</p>", "artefacts": [{"label": "ARTEFACT 1 — legal review comments on draft v4", "kind": "email", "title": "legal-review-v4.txt", "meta": "legal and compliance mailbox", "lines": ["Subject: appetite statement v4 - legal review comments", "We cannot approve the wording that the group accepts a four-hour outage.", "Keep the broad direction in the statement, and put numbers in the measurable limits schedule.", "Separate the escalation trigger from the limit itself.", "Keeping a risk above the limit needs a signed decision, not a verbal one."]}, {"label": "ARTEFACT 2 — escalation and reporting rules", "kind": "table", "title": "escalation-rules.csv", "meta": "risk framework schedule 4", "head": ["Area", "Limit", "Escalation trigger", "Action above the trigger"], "rows": [["Payment services availability", "4 hours of downtime per month", "6 hours", "treatment plan to the committee within 5 days"], ["Customer data confidentiality", "no loss that affects customers", "any confirmed exposure", "immediate report and notification assessment"]]}, {"label": "ARTEFACT 3 — board risk committee minutes extract", "kind": "minutes", "title": "brc-2025-02-item4.txt", "meta": "board risk committee BRC-2025-02, item 4", "lines": ["## Item 4 - security chapter", "The committee asked for the security chapter to state its limits as numbers.", "Any decision to keep a risk above the limit is signed by the steering committee."]}], "prompt": "Complete the statement with the correct words.", "text": "The group's risk [[0]] for customer data is low: it does not accept losses that affect customers. For availability, the [[1]] is four hours of downtime for payment services, and the escalation [[2]] is six hours. A risk at that point must be escalated with a treatment plan, and any risk above it needs a formal risk [[3]] decision before the service continues.", "blanks": ["appetite", "tolerance", "threshold", "acceptance"], "bank": ["threshold", "acceptance", "appetite", "tolerance", "transfer", "mitigation"], "explain": "Appetite is the broad statement of how much risk the organisation wants to take. Tolerance is the measurable limit for one area, here four hours of downtime. A threshold is the point that triggers escalation, here six hours. Acceptance is the formal decision to keep a risk that is above the limit. The statement gives both numbers on purpose. The reader must know when to escalate and when to ask for a decision. Mixing these words is not a style problem. <b>Auditors and regulators read them as commitments.</b>", "tip": "Appetite = direction, tolerance = the number you must stay inside, threshold = the number that triggers escalation, acceptance = the signed decision.", "hint": "One word is a general direction, one is a measured limit, one triggers escalation, one is a formal decision."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Security Steering Committee</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Challenging level. Subtle distractors, near-miss answers and multi-step reasoning: several options are true statements used in the wrong place, and the obvious answer is sometimes wrong.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev hard\">HARD</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">70% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">55 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">12 exercises · 120 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Meet the Security Steering Committee</h2>\n  <p class=\"sub\">The keyword you are about to master, explained in plain words: short sentences, common words, no jargon.</p>\n  <p>A <b>Security Steering Committee</b> (we shorten it to <b>SSC</b>) is a small group of senior\n  leaders who meet to make decisions about security. They do not fix servers and they do not watch\n  alerts. They decide three big things: <b>how much risk the company accepts</b>, <b>which security\n  projects get money</b>, and <b>which security rules become official</b>.</p>\n  <p>Imagine you are a new analyst. One day your manager asks you to write a one-page paper about a\n  risk that nobody wants to own. That paper goes to the SSC. In the meeting, leaders ask questions,\n  then they decide. Your paper is the input; their decision is the output. This is how security work\n  gets priority, budget and owners.</p>\n\n  <h3>Who sits at the table?</h3>\n  <ul class=\"tight\">\n    <li><b>The CISO</b> (Chief Information Security Officer) — the senior leader for security.</li>\n    <li><b>The CIO</b> (information technology) and often the <b>CFO</b> (money).</li>\n    <li><b>A risk leader</b> (chief risk officer) and <b>a legal adviser</b> (general counsel).</li>\n    <li><b>Business leaders</b> who own the systems and the data.</li>\n    <li><b>Internal audit</b> usually attends as an observer, because it must stay independent.</li>\n    <li><b>Experts</b> such as a SOC lead or a penetration tester are invited to explain a topic.</li>\n  </ul>\n\n  <h3>What happens in a normal month?</h3>\n  <ul class=\"tight\">\n    <li>It reads a report about the <b>top risks</b> (the risk register) and checks who owns each risk.</li>\n    <li>It looks at <b>numbers</b> called KPIs and KRIs — simple measurements that show if security is getting\n    better or worse (for example: how fast patches are installed, or how many people click a fake email).</li>\n    <li>It <b>approves policies and standards</b>, and the security budget and roadmap.</li>\n    <li>It signs off when a business wants to keep a known risk. This is called <b>risk acceptance</b>.</li>\n    <li>It writes every decision in the <b>minutes</b> (the official record), with an owner and a due date.</li>\n  </ul>\n\n  <h3>Where you will meet this keyword at work</h3>\n  <ul class=\"tight\">\n    <li><b>SOC and incident response:</b> when a major incident happens, the committee is informed. It decides\n    about money, priority, and what the board must be told. Small alerts never reach it.</li>\n    <li><b>Risk and GRC analysts:</b> they prepare the risk register, the risk appetite statement, the exception\n    requests, the KPI/KRI dashboard and the board pack.</li>\n    <li><b>Compliance and audit:</b> the committee approves policies, reviews audit findings and holds the\n    <b>management review</b> that standards such as ISO/IEC 27001 clause 9.3 require from top management.\n    It is where leaders show that they take responsibility.</li>\n    <li><b>Engineering and cloud teams:</b> architects bring design decisions that need money or that change the\n    level of risk, for example moving a service to a new cloud provider.</li>\n    <li><b>Red team and penetration testers:</b> their technical report stays with the engineers, but the\n    important findings and the fixes are summarised for the committee.</li>\n    <li><b>Legal, privacy and regulators:</b> the committee approves how the company answers regulators and\n    customers, for example after a data breach.</li>\n  </ul>\n\n  <h3>The documents you will handle</h3>\n  <p>The <b>charter</b> (also called terms of reference: it says why the committee exists, who is on it and\n  what it may decide), the <b>agenda</b>, the <b>minutes</b>, the <b>action log</b>, the <b>risk register</b>,\n  the <b>exception register</b>, the <b>KPI/KRI dashboard</b> and the <b>board report</b>.</p>\n\n  <h3>The tools you will use</h3>\n  <p>You will work in a <b>GRC platform</b> (governance, risk and compliance software that stores risks,\n  exceptions and decisions), in the <b>ticketing tool</b> (for example ServiceNow or Jira), in the\n  <b>dashboard</b> that shows the KPIs and KRIs, in the <b>shared drive</b> that holds the charters and the\n  minutes, and in <b>spreadsheets</b> for the board pack. Nothing exotic: the committee lives on documents,\n  numbers and records.</p>\n\n  <h3>The risks it exists to control</h3>\n  <p>Risk that nobody owns, risk that is hidden because nobody reports it, money spent on the wrong things,\n  rules that are broken, fines from regulators, and slow decisions that leave the company exposed\n  for a long time.</p>\n\n  <p class=\"muted\">In one sentence: security work needs one place where business leaders and security leaders\n  decide together. That place is the Security Steering Committee.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">Four rules, one severity level, no surprises. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b>, the exercise is correct only if every decision was right on the first try.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>70%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>55 minutes</b>.</li>\n        <li>The countdown, the live score, the hint and the skip button are always visible in the header at the top.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n        \n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Branching decision scenario — each choice unlocks the next step</li><li>Drag each card into the correct box</li><li>Drag the items to rank them by priority</li><li>Drag the steps into the right order</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log or document analysis with a coloured viewer and a filter box</li><li>Match each item to the right answer</li><li>Multi-select question — several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Every exercise uses the same three blocks, in the same order: <b>SCENARIO</b> (blue),\n      <b>QUESTION</b> (amber) and <b>YOUR ANSWER</b> (green), with the feedback block below them. Long scenarios can be\n      collapsed with <b>Hide scenario</b>. Some exercises ask you to drag cards — with a mouse, or on a tablet by\n      selecting a card and then selecting the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>artefact</b> — the file, log, meeting record or dashboard shown inside the exercise.</li>\n        <li><b>distractor</b> — a wrong answer that looks reasonable. It tests real understanding.</li>\n        <li><b>near-miss answer</b> — a wrong answer that is almost right, usually a true statement used in the wrong place.</li>\n        <li><b>time-boxed</b> — limited to a fixed period, with an end date.</li>\n        <li><b>concentration risk</b> — depending too much on one supplier, one system or one person.</li>\n        <li><b>ISMS</b> — information security management system: the rules, roles and records that manage security.</li>\n        <li><b>ITGC</b> — IT general controls: the basic access, change and operations controls that financial reporting depends on.</li>\n        <li><b>SOX</b> — the US law on financial reporting controls. <b>PCI DSS</b> — the card payment security standard.\n            <b>SOC 2</b> — an independent report on a provider's controls.</li>\n        <li><b>DORA and NIS2</b> — EU rules for the financial sector and for essential services. Both put duties on the management body.</li>\n        <li><b>KPI and KRI</b> — performance and risk measurements. <b>SIEM</b> — the platform that collects and relates security logs.</li>\n        <li><b>DPIA / transfer impact assessment</b> — checks required before using personal data in a risky or foreign context.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev hard\">HARD</span>\n      </p>\n      <p class=\"muted small\">HARD - Challenging. Expect exercises where two options both look defensible and only one survives a careful reading of the charter, the classification rules or the numbers. Memorised definitions are not enough: you must apply the rule to the artefact in front of you.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests</h4><p class=\"muted small\">The complete concept map of the keyword <b>Security Steering Committee</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Governance & Oversight</h4><div class=\"tags\"><span class=\"tag\">security governance</span><span class=\"tag\">charter / terms of reference</span><span class=\"tag\">meeting cadence</span><span class=\"tag\">quorum</span><span class=\"tag\">minutes as the official record</span><span class=\"tag\">action log</span><span class=\"tag\">decision log</span><span class=\"tag\">escalation path</span><span class=\"tag\">delegation of authority</span><span class=\"tag\">committee chair and secretary</span><span class=\"tag\">voting member and invited expert (no vote)</span></div></div><div class=\"theme\"><h4>Strategy, Budget & Planning</h4><div class=\"tags\"><span class=\"tag\">security strategy</span><span class=\"tag\">security roadmap</span><span class=\"tag\">security programme budget</span><span class=\"tag\">funding and resource decisions</span><span class=\"tag\">business case</span><span class=\"tag\">cost, avoided loss and benefit</span><span class=\"tag\">security architecture review board</span><span class=\"tag\">alignment with business drivers</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Enterprise Risk Management</h4><div class=\"tags\"><span class=\"tag\">risk register</span><span class=\"tag\">risk appetite</span><span class=\"tag\">risk tolerance</span><span class=\"tag\">risk treatment (mitigate, transfer, avoid, accept)</span><span class=\"tag\">inherent risk and residual risk</span><span class=\"tag\">risk score (likelihood x impact)</span><span class=\"tag\">risk owner</span><span class=\"tag\">risk acceptance request</span><span class=\"tag\">acceptance expiry and review date</span><span class=\"tag\">compensating controls</span><span class=\"tag\">supplier and concentration risk</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Metrics, KPIs & KRIs</h4><div class=\"tags\"><span class=\"tag\">KPI (key performance indicator)</span><span class=\"tag\">KRI (key risk indicator)</span><span class=\"tag\">MTTD (mean time to detect)</span><span class=\"tag\">patch SLA compliance</span><span class=\"tag\">phishing simulation failure rate</span><span class=\"tag\">control testing pass rate</span><span class=\"tag\">exception volume</span><span class=\"tag\">trend reporting</span><span class=\"tag\">red / amber / green thresholds</span><span class=\"tag\">board reporting pack</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Compliance, Audit & Standards</h4><div class=\"tags\"><span class=\"tag\">ISO/IEC 27001 clause 9.3 (management review)</span><span class=\"tag\">NIST CSF 2.0 Govern function (GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC)</span><span class=\"tag\">PCI DSS requirement 12.4</span><span class=\"tag\">SOC 2 CC1.2 (control environment)</span><span class=\"tag\">SOX ITGC and material weakness</span><span class=\"tag\">GDPR accountability and 72-hour breach notification</span><span class=\"tag\">DORA (management body responsibility for ICT risk)</span><span class=\"tag\">NIS2 (management body approval and accountability)</span><span class=\"tag\">internal audit and audit committee</span><span class=\"tag\">nonconformity and observation</span><span class=\"tag\">management response</span><span class=\"tag\">remediation limits and tracking</span><span class=\"tag\">evidence and record retention</span><span class=\"tag\">exception register</span><span class=\"tag\">policy approval and review cycle</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Roles & Stakeholders</h4><div class=\"tags\"><span class=\"tag\">CISO</span><span class=\"tag\">CIO</span><span class=\"tag\">CFO</span><span class=\"tag\">CRO (chief risk officer)</span><span class=\"tag\">legal counsel</span><span class=\"tag\">DPO / privacy officer</span><span class=\"tag\">internal audit observer</span><span class=\"tag\">business risk owner</span><span class=\"tag\">service owner</span><span class=\"tag\">invited expert with no vote</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Operational Integration</h4><div class=\"tags\"><span class=\"tag\">major incident escalation to the committee</span><span class=\"tag\">crisis management (incident bridge)</span><span class=\"tag\">post-incident review</span><span class=\"tag\">change advisory board (CAB) interface</span><span class=\"tag\">security exception and waiver</span><span class=\"tag\">project security gates</span><span class=\"tag\">vendor onboarding approval</span><span class=\"tag\">M&A due diligence</span><span class=\"tag\">cloud migration governance</span><span class=\"tag\">security awareness programme approval</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Assurance & Continuous Improvement</h4><div class=\"tags\"><span class=\"tag\">management review inputs and outputs</span><span class=\"tag\">internal audit programme</span><span class=\"tag\">supplier audit reports (SOC 2) and penetration tests</span><span class=\"tag\">control design and operating effectiveness</span><span class=\"tag\">continual improvement</span><span class=\"tag\">regulatory notification duty</span><span class=\"tag\">governance failures (no quorum, no minutes, silent risk acceptance)</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit — defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> — written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise — including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Security Steering Committee - standalone certification exam engine
   Vanilla JS. No libraries, no external requests.
   Layout contract: every exercise renders SCENARIO / QUESTION / YOUR ANSWER
   as three labelled blocks, with the feedback block below them.
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false,
         scenCollapsed:{}, reported:false, reviewing:false, focusTarget:null};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g, ''); }
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function flash(msg){
  var f = $('#flashBox');
  if(!f){ return; }
  f.textContent = msg;
  f.style.display='block';
}
function scrollTop(){ try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._exLeft = x.timeLimit || 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'grc-suite 4.2 - governance console')+' - session started</div>',
              '<div class="to">Type the command for the current step, then press Enter. Nothing is executed for real.</div>'];
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.scenCollapsed = {};
  S.reported = false;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
  updateExTimer();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
  exTick();
}
function exTick(){
  if(S.paused || S.done || !S.started){ return; }
  /* the time box of every open time-boxed exercise runs, even if the student
     navigates to another exercise in the meantime */
  S.pool.forEach(function(x){
    if(!x.timeLimit){ return; }
    var r = S.res[x.id];
    if(r && (r.status !== 'skipped' || r.timedout)){ return; }
    if(x._exLeft <= 0){ return; }
    x._exLeft--;
    if(x._exLeft <= 0){ expireExercise(x); }
  });
  updateExTimer();
}
function updateExTimer(){
  var el = $('#exTimer');
  if(!el){ return; }
  var x = S.pool[S.idx];
  if(!x || !x.timeLimit){ return; }
  el.textContent = '⏱ ' + fmt(x._exLeft) + ' left for this exercise';
  el.className = 'exTimer' + (x._exLeft <= 60 ? ' low' : '');
}
function expireExercise(x){
  S.res[x.id] = {status:'skipped', earned:0, given:null, hints:S.hints[x.id]||0, timedout:true};
  if(S.skipped.indexOf(x.id) < 0){ S.skipped.push(x.id); }
  if(S.pool[S.idx] === x){
    renderExam();
    flash('⏱ The time box for this exercise is over. It is closed now and excluded from the score.');
  } else {
    updateHUD();
  }
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
