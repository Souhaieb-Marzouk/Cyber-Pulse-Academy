<style>

:root{
  --bg:#070d18; --bg2:#0c1526; --panel:#101c31; --panel2:#15234033;
  --line:#22334f; --line2:#2c4266;
  --txt:#e6eefc; --muted:#a7b8d4; --dim:#8b9dbb;
  --acc:#38bdf8; --acc2:#a78bfa;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --skip:#eab308;
  --easy:#22c55e; --med:#f59e0b; --hard:#fb923c; --xh:#ef4444;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
*:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%,#12294a 0%,transparent 60%),
    radial-gradient(900px 500px at 105% 0%,#2a1b4d 0%,transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh;
}
h1,h2,h3,h4,h5{margin:0 0 .5rem 0;line-height:1.25}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.45rem 0}
a{color:var(--acc)}
.small{font-size:.85rem}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
code,kbd{font-family:var(--mono);font-size:.88em;background:#0a1424;border:1px solid var(--line);
  border-radius:6px;padding:.08rem .35rem;color:#cbe7ff}
hr{border:0;border-top:1px solid var(--line);margin:1rem 0}

/* ---------- persistent exam header (the only header the file draws) ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0b1424f7,#0b1424e6);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:.55rem 1rem;
}
.tbrow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;
  max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04101f;
  display:grid;place-items:center;font-weight:800;font-size:.95rem}
.brand .tt{font-weight:700;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .st{font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.hud{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.pill{border:1px solid var(--line2);background:#0d1a2e;border-radius:999px;
  padding:.2rem .65rem;font-size:.84rem;display:flex;align-items:center;gap:.4rem;min-height:32px}
.pill b{font-variant-numeric:tabular-nums}
.pill.timer.low{border-color:var(--bad);color:#ffd7d7}
.pill.timer.warn{border-color:var(--warn);color:#ffe9c2}
.pill.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14);border-color:var(--acc)}100%{transform:scale(1)}}
.sev{display:inline-flex;align-items:center;gap:.32rem;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;border-radius:999px;padding:.1rem .5rem;border:1px solid currentColor;
  background:#0b1525;white-space:nowrap;vertical-align:middle}
.sev::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;flex:0 0 auto}
.sev.easy{color:var(--easy)} .sev.medium{color:var(--med)}
.sev.hard{color:var(--hard)} .sev.xhard{color:var(--xh)}
.progwrap{height:8px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  max-width:1280px;margin:.5rem auto 0}
#hudProg{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s ease}

/* ---------- layout ---------- */
main{max-width:1280px;margin:1.1rem auto 3rem;padding:0 1rem}
.card{background:linear-gradient(180deg,var(--panel),#0d1728);border:1px solid var(--line);
  border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 10px 30px #0008}
.card + .card{margin-top:1rem}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
@media (max-width:960px){.exam-grid{grid-template-columns:1fr}.side{order:2}}
.qcard{min-width:0}
.side{position:sticky;top:104px}
@media (max-width:960px){.side{position:static}}

/* ---------- intro ---------- */
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:.92rem;margin:.15rem 0 .7rem;max-width:80ch}
.kw{font-size:1.9rem;font-weight:800;line-height:1.15}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.9rem}
.tile{border:1px solid var(--line);background:#0b1525;border-radius:12px;padding:.55rem .75rem}
.tile .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-size:1.05rem;font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums}
.legendline{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted);margin:.15rem 0 .8rem}
.legendline .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.9rem}
.box{border:1px solid var(--line);background:#0c1729;border-radius:12px;padding:.85rem .95rem}
.box h4{color:var(--acc);font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
ul.tight{margin:.35rem 0 .2rem 1.1rem;padding:0}
ul.tight li{margin:.2rem 0}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.8rem}
.theme{border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;background:#0b1525}
.theme.used{border-color:#31527a;background:#0c1a2c;box-shadow:inset 3px 0 0 var(--acc)}
.theme h4{display:flex;align-items:center;gap:.45rem;font-size:.88rem;color:var(--acc2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.theme .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.76rem;border:1px solid var(--line2);background:#101f36;border-radius:999px;padding:.12rem .5rem;color:#cfe2ff}

/* ---------- buttons (all >= 44px hit target) ---------- */
.btn{font:inherit;font-size:.92rem;cursor:pointer;border-radius:10px;padding:.5rem .95rem;min-height:44px;
  border:1px solid var(--line2);background:#132340;color:var(--txt);transition:.15s;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
.btn:hover{background:#1a2f52}
.btn.primary{background:linear-gradient(135deg,var(--acc),#2563eb);color:#04101f;font-weight:700;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:#7c5a10;color:#ffe1a8;background:#2a2008}
.btn.bad{border-color:#7f1d1d;background:#2a0f12;color:#ffc9c9}
.btn.small{font-size:.82rem;padding:.3rem .6rem;min-height:36px}
.btn.lg{padding:.65rem 1.25rem;font-size:1rem;min-height:52px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.qactions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}

/* ---------- exercise meta ---------- */
.qmeta{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.5rem}
.badge{font-size:.75rem;border-radius:999px;padding:.16rem .6rem;border:1px solid var(--line2);color:#cfe2ff;
  background:#101f36;display:inline-flex;align-items:center;gap:.3rem}
.badge.theme{border-color:var(--acc2);color:#e3d9ff}
.badge.type{border-color:#3f6f5a;color:#c8ffe4}
.qtitle{font-size:1.16rem;font-weight:700;margin-bottom:.2rem}

/* ---------- SCENARIO / QUESTION / YOUR ANSWER blocks ---------- */
.block{border:1px solid var(--line);border-radius:14px;margin:.75rem 0;overflow:hidden;background:#0c1729}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.45rem .75rem;
  font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.bhl{display:inline-flex;align-items:center;gap:.45rem}
.bhead .ic{font-size:1rem;line-height:1}
.bhead.blue{color:#bfe4ff;background:#0d2138;border-bottom-color:#274a72}
.bhead.amber{color:#ffe1a8;background:#2a2008;border-bottom-color:#7c5a10}
.bhead.green{color:#b9f6ce;background:#0d2a1a;border-bottom-color:#2f6b45}
.bbody{padding:.8rem .9rem}
.bsummary{display:none;padding:.55rem .9rem;color:var(--muted);font-size:.84rem;border-top:1px dashed var(--line)}
.block.collapsed .bbody{display:none}
.block.collapsed .bsummary{display:block}
.collapsebtn{font:inherit;font-size:.72rem;letter-spacing:.04em;text-transform:none;padding:.3rem .6rem;min-height:34px;
  border-radius:8px;border:1px solid var(--line2);background:#101d33;color:var(--txt);cursor:pointer}
.brief{font-family:var(--mono);font-size:.8rem;color:#9fd0ff;border-left:3px solid var(--acc);
  padding:.25rem .6rem;background:#0a1a2c;border-radius:0 8px 8px 0;margin-bottom:.6rem}
.scenario{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem}
.scenario p{margin:.4rem 0}
.objline{margin-top:.55rem;border-left:3px solid var(--acc2);background:#140f28;border-radius:0 10px 10px 0;padding:.45rem .7rem;font-size:.9rem}
.timelimitNote{margin-top:.55rem;border-left:3px solid var(--warn);background:#2a2008;border-radius:0 10px 10px 0;padding:.45rem .7rem;font-size:.88rem}
.qtext{font-weight:700;font-size:1.05rem;margin:.1rem 0}
.qsup{margin-top:.35rem;font-size:.92rem;color:var(--muted)}
.exTimer{border:1px solid var(--warn);border-radius:999px;padding:.12rem .6rem;font-size:.78rem;color:#ffe9c2;
  letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
.exTimer.low{border-color:var(--bad);color:#ffd7d7}

/* ---------- artefacts ---------- */
.artpanel{border:1px solid var(--line2);border-radius:12px;margin:.6rem 0;overflow:hidden;background:#08111f}
.artpanel .alabel{padding:.35rem .65rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:#bfe4ff;background:#0e1c31;border-bottom:1px solid var(--line)}
.artpanel .abody{padding:.55rem .65rem;font-family:var(--mono);font-size:.82rem;overflow-x:auto}
.logfilter{width:100%;margin:0 0 .5rem 0;padding:.4rem .55rem;background:#0a1526;border:1px solid var(--line2);
  border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:.82rem;min-height:38px}
.logline{white-space:pre-wrap;word-break:break-word;padding:.12rem .3rem;border-left:3px solid transparent}
.logline .lv{display:inline-block;min-width:4.4em;font-weight:700}
.lv-ERR,.lv-CRIT{color:#ff9b9b} .logline.lvline-ERR,.logline.lvline-CRIT{border-left-color:var(--bad);background:#2a0f1210}
.lv-WARN{color:#ffd08a} .logline.lvline-WARN{border-left-color:var(--warn);background:#2a200810}
.lv-INFO{color:#9fd0ff}
.lv-OK{color:#9cf0bd} .logline.lvline-OK{border-left-color:var(--ok);background:#0e2a1a10}
.logline:hover{background:#12233c}
table.art{width:100%;border-collapse:collapse;font-size:.84rem}
table.art th,table.art td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.art th{background:#0e1c31;color:#bfe4ff;font-weight:600}
table.art tr:nth-child(even) td{background:#0b1524}
.emailbody{font-size:.88rem}
.emailbody .subj{color:var(--warn);font-weight:600;margin-bottom:.3rem}
.docbody{font-size:.88rem;white-space:pre-wrap}
.docbody .h{color:var(--acc);font-weight:700}

/* ---------- options ---------- */
.opts{display:grid;gap:.5rem;margin:.5rem 0}
.opt{display:flex;gap:.6rem;align-items:center;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.6rem .75rem;min-height:52px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc);background:#102138}
.opt input{margin:0;accent-color:var(--acc);width:18px;height:18px;flex:0 0 auto}
.opt .mk{min-width:1.4em;font-weight:800;flex:0 0 auto}
.opt .otxt{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:#0d2a1a}
.opt.bad{border-color:var(--bad);background:#2a0f12}
.opt.chosen{box-shadow:inset 0 0 0 1px #ffffff22}
.opts.locked .opt{cursor:default}

/* ---------- ordering / ranking ---------- */
.sortlist{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.45rem}
.sortlist li{display:flex;gap:.55rem;align-items:center;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.5rem .65rem;min-height:56px;cursor:grab}
.sortlist li.dragging{opacity:.4}
.sortlist li.over{border-color:var(--acc);background:#102138}
.sortlist .grip{color:var(--dim);cursor:grab}
.sortlist .txt{flex:1;min-width:0}
.sortlist .mv{display:flex;flex-direction:row;gap:.2rem}
.mvbtn{width:44px;height:44px;font-size:.85rem;line-height:1;padding:0;border-radius:8px;border:1px solid var(--line2);
  background:#132340;color:var(--txt);cursor:pointer}
.mvbtn:hover{background:#1a2f52}

/* ---------- classify / fill ---------- */
.bank{display:flex;flex-wrap:wrap;gap:.4rem;border:1px dashed var(--line2);border-radius:12px;
  padding:.55rem;min-height:56px;background:#0a1424}
.chip{border:1px solid var(--line2);background:#132340;border-radius:999px;padding:.35rem .75rem;font:inherit;
  font-size:.86rem;min-height:44px;display:inline-flex;align-items:center;cursor:grab;user-select:none;transition:.15s;color:var(--txt)}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc);background:#1b3557;box-shadow:0 0 0 2px #38bdf855}
.chip.placed{background:#16283f}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.65rem;margin-top:.7rem}
.bucket{border:1px solid var(--line2);border-radius:12px;background:#0b1525;padding:.5rem}
.bucket h4{font-size:.86rem;color:var(--acc2);margin-bottom:.4rem}
.bucket .drop{display:flex;flex-wrap:wrap;gap:.35rem;min-height:56px;border-radius:8px;padding:.25rem}
.bucket.hot .drop{background:#12233c;outline:1px dashed var(--acc)}
.bucket.ok{border-color:var(--ok)} .bucket.bad{border-color:var(--bad)}
.filltext{font-size:1.02rem;background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:44px;
  border:0;border-bottom:2px dashed var(--acc);
  padding:.1rem .45rem;margin:.15rem .15rem;border-radius:6px;cursor:pointer;color:#bde3ff;font:inherit;font-weight:600;background:transparent}
.slot.empty{color:var(--dim);font-weight:400}
.slot:hover{background:#12233c}
.slot.filled{border-bottom-style:solid}
/* ---------- matching ---------- */
table.match{width:100%;border-collapse:collapse;font-size:.88rem;margin:.5rem 0}
table.match td{border-bottom:1px solid var(--line);padding:.45rem .5rem;vertical-align:middle}
table.match td.l{width:46%}
table.match select{width:100%;padding:.45rem .5rem;min-height:44px;background:#0a1526;color:var(--txt);
  border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:.86rem}
table.match tr.ok td{border-bottom-color:var(--ok)} table.match tr.bad td{border-bottom-color:var(--bad)}

/* ---------- terminal ---------- */
.termwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.7rem;align-items:start}
@media (max-width:860px){.termwrap{grid-template-columns:1fr}}
.term{background:#05090f;border:1px solid #1d3350;border-radius:12px;overflow:hidden}
.term .tbar{background:#0c1729;padding:.35rem .6rem;font-size:.78rem;color:var(--muted);display:flex;
  justify-content:space-between;gap:.5rem;border-bottom:1px solid #1d3350}
.term-out{padding:.6rem .7rem;font-family:var(--mono);font-size:.83rem;max-height:340px;overflow:auto;white-space:pre-wrap}
.term-out .tl{color:#dbe9ff} .term-out .tp{color:#67e8f9}
.term-out .to{color:#a8bcd8;padding-left:.2rem} .term-out .okout{color:#9cf0bd} .term-out .errout{color:#ff9b9b}
.term-line{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;border-top:1px solid #1d3350;background:#070d18}
.term-line input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#dbe9ff;font-family:var(--mono);
  font-size:.86rem;min-height:44px}
.term-line .ps1{color:#67e8f9;font-family:var(--mono);font-size:.83rem;white-space:nowrap}
.syntaxpanel{border:1px solid var(--line2);border-radius:12px;background:#0a1424;padding:.7rem .8rem;font-size:.85rem}
.syntaxpanel h5{margin:.1rem 0 .45rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.syntaxpanel p{margin:.3rem 0}
pre.cmd{background:#05090f;border:1px solid #1d3350;border-radius:10px;padding:.6rem .7rem;overflow:auto;margin:.4rem 0}
pre.cmd code{background:none;border:0;padding:0;color:#bde3ff;font-size:.85rem;white-space:pre-wrap;word-break:break-word}
.canonical{margin-top:.7rem;border-top:1px dashed var(--line);padding-top:.6rem}
.canonical h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.cmdparts{margin:.3rem 0 .6rem 1.1rem;padding:0;font-size:.86rem}

/* ---------- branching ---------- */
.branchnode{border:1px solid var(--line2);border-radius:12px;padding:.8rem .95rem;background:#0b1525;margin:.3rem 0}
.bopts{display:grid;gap:.5rem}
.bopt{text-align:left;font:inherit;font-size:.92rem;cursor:pointer;border:1px solid var(--line2);
  background:#101d33;color:var(--txt);border-radius:10px;padding:.6rem .75rem;min-height:52px}
.bopt:hover{border-color:var(--acc);background:#152a48}
.bopt.dead{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.bfb{margin-top:.6rem;border-radius:10px;padding:.55rem .7rem;font-size:.88rem;display:none}
.bfb.okfb{display:block;background:#0d2a1a;border:1px solid var(--ok)}
.bfb.badfb{display:block;background:#2a0f12;border:1px solid var(--bad)}

/* ---------- feedback block (below the three blocks, never an overlay) ---------- */
.fb{border:1px solid var(--line2);border-radius:14px;margin:.75rem 0;overflow:hidden;background:#0c1729}
.fbhead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem .8rem;
  font-weight:800;letter-spacing:.1em;font-size:.8rem;text-transform:uppercase}
.fb.ok .fbhead{background:#0d2a1a;color:#b9f6ce;border-bottom:1px solid #2f6b45}
.fb.bad .fbhead{background:#2a0f12;color:#ffc9c9;border-bottom:1px solid #7f1d1d}
.fb.na .fbhead{background:#2a2008;color:#ffe1a8;border-bottom:1px solid #7c5a10}
.fpts{letter-spacing:0;text-transform:none;font-weight:700;font-variant-numeric:tabular-nums}
.fbbody{padding:.8rem .9rem}
.exp{margin:.5rem 0}
.ansline{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.6rem;margin-top:.4rem}
.ansline > div{border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:#0a1424;font-size:.86rem}
.lbl{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.25rem}
.tip{margin-top:.7rem;border-left:3px solid var(--warn);background:#2a2008;border-radius:0 10px 10px 0;padding:.5rem .7rem;font-size:.88rem}
.hintbox{margin-top:.7rem;border-left:3px solid var(--acc2);background:#1a1233;border-radius:0 10px 10px 0;padding:.55rem .7rem;font-size:.88rem}
.flash{margin-top:.6rem;color:#ffd08a;font-size:.88rem}
.ansSummary table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
.ansSummary th,.ansSummary td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left}
.ansSummary th{background:#0e1c31;color:#bfe4ff}

/* ---------- side panel ---------- */
.side .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .7rem}
.chipbtn{width:40px;height:40px;border-radius:9px;border:1px solid var(--line2);background:#101d33;color:var(--txt);
  font:inherit;font-size:.85rem;cursor:pointer}
.chipbtn.cur{outline:2px solid var(--acc);outline-offset:1px}
.chipbtn.good{background:#0d3320;border-color:var(--ok)}
.chipbtn.bad{background:#33121a;border-color:var(--bad)}
.chipbtn.skip{background:#33280a;border-color:var(--skip)}
.legend{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem}

/* ---------- review skipped ---------- */
.skipList{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.skipList li{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--skip);background:#1a1508;border-radius:10px;padding:.6rem .8rem}

/* ---------- results ---------- */
.resulthead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cert{border:2px solid var(--acc);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1rem;
  background:linear-gradient(135deg,#0b1f36,#141033);text-align:center}
.cert .ct{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert .cn{font-size:1.5rem;font-weight:800;margin:.3rem 0}
.cert .cs{font-size:1rem;color:#cfe2ff}
.bars{display:grid;gap:.5rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:200px 1fr 90px;gap:.6rem;align-items:center;font-size:.85rem}
@media (max-width:640px){.bar{grid-template-columns:130px 1fr 70px}}
.bar .track{height:10px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.report{display:grid;gap:.8rem;margin-top:.7rem}
.rep{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;background:#0b1525}
.rep.good{border-left:4px solid var(--ok)} .rep.bad{border-left:4px solid var(--bad)} .rep.na{border-left:4px solid var(--skip)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#0b1525}
.stat .n{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- pause overlay ---------- */
body.paused #stage{filter:blur(14px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:#050a12cc;backdrop-filter:blur(3px);padding:1rem}
.pausepanel{max-width:520px;border:1px solid var(--acc);border-radius:16px;background:#0b1525;padding:1.2rem 1.3rem;text-align:center}

@media (max-width:600px){
  body{font-size:15px}
  .qtitle{font-size:1.05rem}
  .bigscore{font-size:2.2rem}
}

<script>
var EXAM = {"keyword": "Security Steering Committee", "severity": "EASY", "sevClass": "easy", "passScore": 70, "minutes": 30, "intro_blurb": "Foundational level. One idea per exercise, clear scenarios, guided wording: what the committee is, who sits on it, how a decision travels, and how risk is recorded.", "sev_text": "EASY - Foundational. Every exercise tests one security governance idea at a time and the wording guides you. The distractors are weaker but still realistic, like the wrong reflex a beginner would have. If you read the explanation above, you can pass this file.", "topicId": "security-steering-committee", "batch": 1, "difficulty": "easy", "questionCount": 12, "estimatedMinutes": 30};
var EXERCISES = [{"id": "EASY-05", "type": "match", "theme": "Governance & Oversight", "title": "Governance documents and what they are for", "brief": "Onboarding pack · governance library (SharePoint › SSC › 2025)", "scenario": "<p>A new business owner joins the committee and asks what each document in the governance library is for. You must match every document with its purpose.</p>", "artefacts": [{"label": "ARTEFACT 1 — governance library index", "kind": "table", "title": "governance-library-index.csv", "meta": "SharePoint › SSC › 2025", "head": ["Document", "Owner", "Last update"], "rows": [["Charter", "Board secretary", "2025-01"], ["Minutes", "SSC secretary", "2025-07"], ["Risk register", "Chief risk officer", "2025-07"]]}], "prompt": "Match each governance document with what it is used for.", "pairs": [{"left": "Charter (terms of reference)", "right": "Why the committee exists, who sits on it and what it may decide"}, {"left": "Minutes", "right": "The official record of what was decided, by whom and when"}, {"left": "Action log", "right": "The list of tasks with an owner and a due date"}, {"left": "Risk register", "right": "The list of risks with a score, an owner and a treatment plan"}, {"left": "KPI / KRI dashboard", "right": "The numbers that show if security is improving or getting worse"}, {"left": "Risk appetite statement", "right": "How much risk the company is willing to accept in each area"}], "explain": "Each document answers a different question. The charter answers “who may decide what”. The minutes answer “what was decided”. The action log answers “who must do what by when”. The risk register answers “which risks exist and who owns them”. The dashboard answers “are we getting better”. The risk appetite statement answers “how much risk is acceptable”. Auditors ask for all six, so they must stay consistent with each other.", "tip": "The charter says what the committee may decide; the minutes prove what it did decide.", "hint": "One document gives authority, one records decisions, one tracks tasks, one lists risks, one measures, one sets limits."}, {"id": "EASY-06", "type": "log", "theme": "Governance & Oversight", "title": "Find the decision that breaks the charter", "brief": "Decision log export · governance console · filter box enabled", "scenario": "<p>The charter says: <i>“Every accepted risk above appetite must have a named risk owner and a review date.”</i> You check the last decisions before the audit starts.</p><p>The audit starts on Monday morning.</p>", "artefacts": [{"label": "ARTEFACT 1 — decision log export, June to July 2025", "kind": "log", "title": "decision-log-2025.txt", "meta": "governance console export · filter enabled", "lines": [["INFO", "DEC-2025-032 rejected the SIEM purchase | owner: CISO | review: 2025-12-12"], ["INFO", "DEC-2025-031 accepted risk RISK-220 (score 18, above appetite) | owner: Payments | review: none"], ["INFO", "DEC-2025-029 accepted risk RISK-231 (score 9, inside appetite) | owner: Retail | review: none"], ["INFO", "DEC-2025-034 approved exception EXC-77 (legacy CRM 10[.]40[.]7[.]22) | owner: CRM team | review: 2026-01-03"], ["INFO", "DEC-2025-035 approved cloud migration gate 1 | owner: Cloud team | review: 2025-10-03"]]}], "prompt": "Which decision record breaks the charter rule?", "options": ["DEC-2025-035 — a cloud migration gate was approved.", "DEC-2025-031 — the accepted risk has no review date.", "DEC-2025-029 — the accepted risk has no review date.", "DEC-2025-034 — an exception was given for the legacy CRM."], "correct": [1], "explain": "The rule has two parts. The accepted risk must be above appetite, and the acceptance must carry a review date. Only DEC-2025-031 is above appetite with a score of 18, and it has no review date. So only that record breaks the rule. DEC-2025-029 also has no review date, but its score is 9, which is inside appetite. The rule does not apply to it. A high risk with no review date will never be looked at again. Auditors find this failure very often.", "tip": "Check every part of the rule, not only the field that looks empty.", "hint": "Read the charter rule slowly. It has two conditions, not one."}, {"id": "EASY-07", "type": "fill", "theme": "Governance & Oversight", "title": "Complete the charter sentences", "brief": "Draft charter v3.1 · waiting for committee approval", "scenario": "<p>The chair has drafted three new sentences for the charter and left the important words as blanks. You must choose the right words from the bank.</p>", "artefacts": [{"label": "ARTEFACT 1 — draft charter v3.1, change log", "kind": "doc", "title": "charter-v3.1-changelog.txt", "meta": "draft, waiting for approval", "lines": ["## Draft charter v3.1 — what changed", "§4.1: the committee now meets four times a year, not every month.", "§4.2: a valid decision needs the minimum number of voting members.", "§6.3: every accepted risk needs a named owner and a next check."]}], "prompt": "Complete the charter sentences.", "text": "The committee meets every [[0]] and reports to the [[1]] once a year. A valid decision needs a [[2]] of voting members, and every accepted risk needs a review [[3]].", "blanks": ["quarter", "board of directors", "quorum", "date"], "bank": ["date", "quorum", "board of directors", "quarter", "auditor", "budget"], "explain": "Charters use precise words. A cadence is how often the committee meets — here, every quarter. The reporting line goes to the board of directors, which owns the highest level of oversight. A quorum is the minimum number of voting members needed for a valid decision. Every accepted risk needs a review date so that it comes back to the committee.", "tip": "Learn three different meeting words: cadence (how often), quorum (how many), review date (when it comes back).", "hint": "Two blanks are about meetings — how often and how many. One blank names the body above the committee."}, {"id": "EASY-08", "type": "terminal", "theme": "Governance & Oversight", "title": "Pull the governance evidence from the console", "brief": "Governance console · read-only session · audit preparation", "scenario": "<p>The internal auditor asks you for three things before the meeting. Your team uses a small command-line tool called <b>ssc</b> (the <i>security steering committee</i> console). It only reads the committee records: actions, decisions, risks and reports. It never changes anything.</p>", "artefacts": [{"label": "ARTEFACT 1 — audit evidence request AUD-2025-09", "kind": "email", "title": "AUD-2025-09-request.txt", "meta": "internal audit mailbox", "lines": ["Subject: Evidence request before the committee meeting", "Please send the open action items of the committee.", "I also need the full record of one action (ACT-118).", "And the KPI numbers of the quarter as a data file."]}], "prompt": "Type the command for each step in the terminal. The steps are listed one by one beside the terminal.", "objective": "Produce the three pieces of evidence the auditor asked for.", "console": "ssc governance console", "consoleMode": "read-only session", "syntax": {"tool": "ssc — the committee console (read-only)", "what": "ssc reads the committee records. You give it an object (actions, decisions, risks, report), then a verb (list, show), then options that start with two dashes.", "shape": "ssc <object> <verb> [--option value]", "options": [["--status open", "show only the items that are still open"], ["--quarter Q2", "choose the reporting period (Q1 to Q4)"], ["--format csv", "write a spreadsheet file instead of text on the screen"]], "example": "ssc decisions list --status open", "exampleNote": "This example lists <b>decisions</b> from the current quarter, not actions and not a quarterly KPI report, so you cannot copy it as it is."}, "outputSample": "ACT-118  open   owner: CRM team   due: 2025-09-30   (legacy CRM exception EXC-77)\n9 KPI lines written to kpi_2025_Q2.csv", "steps": [{"goal": "List every open action item of the committee.", "accept": ["^ssc\\s+actions\\s+list\\s+--status\\s+open$"], "out": "ACT-118  open   owner: CRM team   due: 2025-09-30   (legacy CRM exception EXC-77)", "err": "That command does not list the open action items. Check the object (actions) and the option (--status open)."}, {"goal": "Show the details of action ACT-118.", "accept": ["^ssc\\s+actions?\\s+show\\s+act-118$"], "out": "ACT-118 | EXC-77 legacy CRM exception | owner: CRM team | due: 2025-09-30 | status: open | linked risk: RISK-204", "err": "That command does not show one specific action. Use the verb show with the identifier ACT-118."}, {"goal": "Export the KPI report for the second quarter as a CSV file.", "accept": ["^ssc\\s+report\\s+kpi\\s+--quarter\\s+q2\\s+--format\\s+csv$", "^ssc\\s+report\\s+kpi\\s+--format\\s+csv\\s+--quarter\\s+q2$"], "out": "9 KPI lines written to kpi_2025_Q2.csv (evidence hash 4f9c...a1)", "err": "That command does not export the quarterly KPI report as CSV. Check the object (report kpi) and both options."}], "canonical": [{"cmd": "ssc actions list --status open", "parts": ["ssc — the committee console", "actions — the object you want to read", "list — the verb: show all of them", "--status open — only the items that are still open"]}, {"cmd": "ssc actions show ACT-118", "parts": ["actions — the same object", "show — the verb: one record, with its history", "ACT-118 — the identifier of the action you must explain to the auditor"]}, {"cmd": "ssc report kpi --quarter Q2 --format csv", "parts": ["report kpi — the quarterly measurement report", "--quarter Q2 — the period (April to June)", "--format csv — write a spreadsheet file instead of text on the screen"]}], "explain": "Governance work is evidence work. An auditor does not accept “we discussed it”. The auditor wants the action list, the detail of one action and the export of the measurements. Now look at the shape of every command. First the tool (<code>ssc</code>), then the object (<code>actions</code>, <code>report kpi</code>). After that comes the verb (<code>list</code>, <code>show</code>). The options at the end start with two dashes.", "tip": "Translate each goal into command words: object first, verb second, then the options with their values.", "hint": "This is about the tool that reads committee records. Look at the syntax reminder: the object comes before the verb, and every option starts with two dashes."}, {"id": "EASY-09", "type": "classify", "theme": "Enterprise Risk Management", "title": "Four ways to treat a risk", "brief": "Risk workshop output · RISK-204, RISK-211, RISK-215", "scenario": "<p>The committee uses four treatment options. During the workshop the team wrote eight actions on cards. You must put every card in the right treatment box.</p>", "artefacts": [{"label": "ARTEFACT 1 — risk register extract, workshop input", "kind": "table", "title": "risk-register-extract.csv", "meta": "risk management office", "head": ["Risk ID", "Description", "Score", "Owner", "Next review"], "rows": [["RISK-204", "Legacy CRM without vendor support", "12", "CRM team", "2026-01-15"], ["RISK-211", "Ransomware on the file server", "18", "CISO office", "2025-09-15"]]}], "prompt": "Drag each action into the correct treatment box.", "buckets": ["Mitigate (reduce)", "Transfer (share)", "Avoid (stop)", "Accept (keep and watch)"], "items": [{"text": "Turn on multi-factor authentication for the remote access portal", "bucket": "Mitigate (reduce)"}, {"text": "Patch the internet-facing server within seven days", "bucket": "Mitigate (reduce)"}, {"text": "Buy cyber insurance that covers ransomware losses", "bucket": "Transfer (share)"}, {"text": "Move card payments to a provider certified for card data", "bucket": "Transfer (share)"}, {"text": "Close the old payment portal instead of fixing it", "bucket": "Avoid (stop)"}, {"text": "Do not enter the new market, because local law would need controls we do not have", "bucket": "Avoid (stop)"}, {"text": "Keep the legacy CRM until 2026 and review it every quarter", "bucket": "Accept (keep and watch)"}, {"text": "Log the medium risk and check it again at the next meeting", "bucket": "Accept (keep and watch)"}], "explain": "<b>Mitigate</b> means you reduce the chance or the impact (MFA, faster patching). <b>Transfer</b> means another party carries part of the loss (insurance, a certified provider). <b>Avoid</b> means you remove the activity that creates the risk (closing the portal, refusing the new market). <b>Accept</b> means you keep the risk, but only with a documented decision, an owner and a review date. Real programmes use all four options at the same time.", "tip": "Ask one simple question per card: does the action reduce, share, remove, or only record the risk?", "hint": "Insurance and outsourcing share the loss with somebody else; closing something removes the activity completely."}, {"id": "EASY-10", "type": "fill", "theme": "Enterprise Risk Management", "title": "Finish the escalation email", "brief": "Draft email · to the SSC secretary · before the agenda freeze", "scenario": "<p>A business unit cannot fund a fix this year. You must finish the escalation email so that the request can be placed on the next agenda.</p>", "artefacts": [{"label": "ARTEFACT 1 — risk note, RISK-118", "kind": "doc", "title": "RISK-118-note.txt", "meta": "risk management office", "lines": ["## RISK-118 — payment server note", "Old payment server; the vendor no longer sends security fixes.", "Score 16 (high). The board limit for this area is 9.", "The fix costs EUR 120,000 and the unit cannot fund it this year. A temporary control could hold the risk down until then."]}], "prompt": "Complete the email with the right governance words.", "text": "RISK-118 is above the risk [[0]], so it cannot be accepted by the business owner alone. The business unit cannot fund the fix this year. We ask the committee to [[1]] the risk for six months, with a documented [[2]] control and a review date.", "blanks": ["appetite", "accept", "compensating"], "bank": ["compensating", "appetite", "accept", "audit", "transfer", "budget"], "explain": "Risk appetite is the amount of risk the company is willing to take. A risk above appetite needs a decision from a higher level. To accept a risk means to keep it on purpose, with a written decision. A compensating control is a different control. It reduces the risk while the real fix is not possible yet. These three words are standard governance language. Using them correctly makes your request easy to approve.", "tip": "Above appetite = needs the committee. Keeping the risk on purpose = accept. Temporary different control = compensating control.", "hint": "One word is the limit set by the board, one is the decision to keep the risk, one describes a temporary different control."}, {"id": "EASY-11", "type": "multi", "theme": "Governance & Oversight", "title": "Which items are formal decisions?", "brief": "Minutes draft · SSC-2025-05 · secretary checklist", "scenario": "<p>You help the secretary write the minutes. Not everything said in a meeting is a decision. Only real decisions go into the decision section, with an owner and a date.</p>", "artefacts": [{"label": "ARTEFACT 1 — minutes template, SSC-2025-05", "kind": "doc", "title": "minutes-template-SSC-2025-05.txt", "meta": "secretary pack", "lines": ["## Minutes template — SSC-2025-05", "Attendance, apologies, and actions carried over from the last meeting.", "Decisions: the item, the decision, the owner and the date.", "Discussion and information: no vote, no owner."]}], "prompt": "Select every item that must be recorded as a formal decision.", "options": ["The CIO said that he personally prefers another vendor for the project.", "The meeting started fifteen minutes late because of a train delay.", "The SOC reported that it handled 42 alerts during the last week.", "Approve the updated access control policy for all staff.", "Accept risk RISK-221 until 30 September 2025, with a review date.", "Approve the 12-month security roadmap and its budget of EUR 480,000.", "Defer the SIEM replacement decision to the third quarter."], "correct": [3, 4, 5, 6], "explain": "A decision is an action of the committee. You can approve, reject, accept, defer or delegate. An opinion is not a decision. A late start and a status update are not decisions either. Note that “defer to the next quarter” IS a decision. It is an active choice to wait, so it must be recorded. If it is not recorded, nobody knows why the work stopped.", "tip": "Look for a verb of choice: approve, reject, accept, defer, delegate. Opinions and status updates are not decisions.", "hint": "Four items contain a verb of choice. Three items are only information, opinion or logistics."}, {"id": "EASY-12", "type": "mcq", "theme": "Operational Integration", "title": "A business unit says no", "brief": "Ticket #GRC-1188 · control gap on the customer database", "scenario": "<p>A business unit refuses to apply a required control on a customer database. The unit's director reports below the committee and says the change is too slow for the project. The control gap creates a risk above appetite.</p>", "artefacts": [{"label": "ARTEFACT 1 — ticket #GRC-1188 (service desk)", "kind": "log", "title": "ticket-GRC-1188.txt", "meta": "service desk", "lines": [["INFO", "Ticket GRC-1188 | system: customer database | control gap: access review | status: open"], ["WARN", "Business unit refuses the change: project deadline in six weeks"], ["INFO", "Risk score 16, above appetite | no compensating control in place"]]}], "prompt": "What is the correct governance step?", "options": ["Do nothing about it, because a director is more senior than a junior analyst.", "Raise a risk acceptance request with the score, so the committee can decide.", "Ask the SOC to force the change during the next maintenance window tonight.", "Accept the risk yourself and write it in the risk register without asking anyone."], "correct": [1], "explain": "When a business does not want to apply a control, the disagreement goes to the committee. The committee is the body that owns the risk appetite. The right tool is a risk acceptance request. The risk is scored and the options are written down. Then the committee either requires the control or accepts the risk. If it accepts, it sets conditions, an owner and a review date. An analyst cannot accept risk. The SOC cannot change business priorities.", "tip": "Escalation is a document, not an argument: score the risk, state the options, let the right level decide.", "hint": "Ask who is allowed to say “we will live with this risk”, and which document that person needs to sign."}, {"id": "EASY-01", "type": "mcq", "theme": "Governance & Oversight", "title": "What the committee is for", "brief": "Ticket #GRC-1042 · your first week as a junior GRC analyst", "scenario": "<p>You join the security governance team. On your first day your manager says: <i>“The Security Steering Committee meets on Thursday. Read the charter before you come.”</i></p><p>A friend from the help desk asks you what this committee actually does all day.</p>", "artefacts": [{"label": "ARTEFACT 1 — meeting agenda extract, SSC-2025-04", "kind": "doc", "title": "agenda-SSC-2025-04.txt", "meta": "committee papers", "lines": ["## SSC-2025-04 agenda (extract)", "Item 1: security strategy paper from the CISO (decision).", "Item 2: budget request of EUR 250,000 for identity work (decision).", "Item 3: the SOC manager presents last month's numbers (report only)."]}], "prompt": "What is the main job of the Security Steering Committee?", "options": ["To set security direction, approve the budget and take risk decisions.", "To watch the alert queue and close the incidents raised during the night shift.", "To configure the firewalls, patch the servers and write the detection rules.", "To test the applications and write the penetration test report for the client."], "correct": [0], "explain": "The committee is a <b>decision body</b>. It decides direction, money and risk. It does not run operations: the SOC watches alerts, engineers change systems, and testers write test reports. Those teams bring facts to the committee, and the committee takes the decision that the teams cannot take alone.", "tip": "Separate “decide and pay” work (committee) from “do and detect” work (SOC, engineering, red team).", "hint": "Ask yourself which of these four jobs needs money, priority and a formal decision from several senior leaders."}, {"id": "EASY-02", "type": "classify", "theme": "Roles & Stakeholders", "title": "Who votes and who only advises", "brief": "Charter review · meeting SSC-2025-04", "scenario": "<p>You are preparing the attendance list for the next meeting. The charter says that only voting members can approve a decision. It lists the CISO, the CIO, the CFO and the chief risk officer as voting members, and it describes everyone else on the list as an invited expert or an observer.</p>", "artefacts": [{"label": "ARTEFACT 1 — charter extract, attendance and voting", "kind": "doc", "title": "charter-3-attendance.txt", "meta": "governance charter, version 3.1", "lines": ["## Charter §3 — attendance and voting", "Only voting members may approve, reject or defer an item.", "Invited experts give facts and answer questions; they do not vote.", "A person who will check the decision later attends without a vote."]}], "prompt": "Drag each person into the correct box.", "buckets": ["Voting member", "Invited expert / observer (no vote)"], "items": [{"text": "CISO (chief information security officer)", "bucket": "Voting member"}, {"text": "CIO (chief information officer)", "bucket": "Voting member"}, {"text": "CFO (chief financial officer)", "bucket": "Voting member"}, {"text": "Chief Risk Officer", "bucket": "Voting member"}, {"text": "Head of Internal Audit", "bucket": "Invited expert / observer (no vote)"}, {"text": "SOC shift lead", "bucket": "Invited expert / observer (no vote)"}, {"text": "External penetration test vendor", "bucket": "Invited expert / observer (no vote)"}, {"text": "Data Protection Officer", "bucket": "Invited expert / observer (no vote)"}], "explain": "Voting members are the senior owners of the business. They own security (CISO), technology (CIO), money (CFO) and risk (chief risk officer). Internal audit must stay independent from the decisions it will check later. So it attends without a vote. The SOC lead, the external tester and the DPO are experts. They explain facts and do not decide. Some companies do give the DPO a vote. The charter is the document that settles this, so always read it.", "tip": "Independence is the key word for internal audit: the person who will audit the decision should not vote on it.", "hint": "Independence rule: the team that will check the decision later must stay outside the vote. Experts explain, they do not decide."}, {"id": "EASY-03", "type": "order", "theme": "Governance & Oversight", "title": "From a business problem to a tracked decision", "brief": "Risk acceptance request RAR-2025-014 · owner: Payments team", "scenario": "<p>A payment team cannot replace an old server before the end of the year. The team writes a risk acceptance request. You must show a new colleague how such a request travels through governance.</p>", "artefacts": [{"label": "ARTEFACT 1 — risk acceptance request RAR-2025-014", "kind": "email", "title": "RAR-2025-014.txt", "meta": "risk mailbox, received 09:12", "lines": ["Subject: Risk acceptance request RAR-2025-014 (payments)", "System: payment server PAY-SRV-02; vendor support ends on 31 December.", "We cannot replace it before the year end; the project deadline is fixed.", "Please keep it until Q1 and check the risk every month."]}], "prompt": "Put the six steps in the correct order (first step on top).", "items": ["The business owner sends a risk acceptance request to the security governance team.", "The risk team scores the risk (likelihood x impact) and compares it with the risk appetite.", "The request is added to the agenda with treatment options and compensating controls.", "The committee reviews the request, asks questions and takes a decision.", "The decision, the risk owner and the review date are written in the minutes and the risk register.", "The risk is checked again on the review date, or earlier if the monitoring indicator turns red."], "explain": "A governance decision is a chain, not a single meeting. The request comes from the business. The risk team puts a number on the risk. The committee then receives a prepared file and decides. The decision is recorded with an owner and a date. Later the risk comes back for review. If that last step is missing, the decision is forgotten. Then the risk becomes invisible.", "tip": "Never stop at “the committee decided”. A decision without an owner and a review date cannot be managed.", "hint": "Start with who raises the problem, and finish with the step that proves the risk is still being watched."}, {"id": "EASY-04", "type": "mcq", "theme": "Governance & Oversight", "title": "A meeting without a quorum", "brief": "Meeting SSC-2025-06 · Thursday 14:00 · room 3B", "scenario": "<p>The charter says: <i>“A quorum is five of the nine voting members. Without a quorum, no decision may be taken.”</i></p><p>At 14:00 there are four voting members in the room: the CISO, the CIO, the CFO and one business owner. Two more members are stuck in a customer call. The agenda has one item: accepting a high risk on the old payment server.</p>", "artefacts": [{"label": "ARTEFACT 1 — attendance note, meeting SSC-2025-06", "kind": "minutes", "title": "attendance-SSC-2025-06.txt", "meta": "meeting record, 14:00, room 3B", "lines": ["Present: CISO, CIO, CFO and one business owner (4 voting members).", "Absent: two voting members, stuck in a customer call.", "Agenda: accept high risk RISK-231 on the old payment server."]}], "prompt": "What is the correct governance action?", "options": ["Let the CISO decide alone and tell the committee about it in the weekly report.", "Note that there is no quorum, take no decision, and put the item on the next meeting.", "Take the decision, because the CISO and the CFO are the two most senior members.", "Take the decision by email after the meeting and write it as approved in the minutes."], "correct": [1], "explain": "A quorum is a minimum number of voting members. It protects the company: a decision taken by too few people can be challenged later by auditors or regulators. The meeting can still take place, discuss the item and prepare it, but the vote must wait. A charter may allow an urgent written procedure — but only if the charter says so in advance.", "tip": "Keep the difference clear: discussing an item is always allowed, deciding an item needs a quorum.", "hint": "Count the voting members in the room, then compare that number with the number written in the charter."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Security Steering Committee</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Foundational level. One idea per exercise, clear scenarios, guided wording: what the committee is, who sits on it, how a decision travels, and how risk is recorded.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev easy\">EASY</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">70% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">30 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">12 exercises · 120 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Meet the Security Steering Committee</h2>\n  <p class=\"sub\">The keyword you are about to master, explained in plain words: short sentences, common words, no jargon.</p>\n  <p>A <b>Security Steering Committee</b> (we shorten it to <b>SSC</b>) is a small group of senior\n  leaders who meet to make decisions about security. They do not fix servers and they do not watch\n  alerts. They decide three big things: <b>how much risk the company accepts</b>, <b>which security\n  projects get money</b>, and <b>which security rules become official</b>.</p>\n  <p>Imagine you are a new analyst. One day your manager asks you to write a one-page paper about a\n  risk that nobody wants to own. That paper goes to the SSC. In the meeting, leaders ask questions,\n  then they decide. Your paper is the input; their decision is the output. This is how security work\n  gets priority, budget and owners.</p>\n\n  <h3>Who sits at the table?</h3>\n  <ul class=\"tight\">\n    <li><b>The CISO</b> (Chief Information Security Officer) — the senior leader for security.</li>\n    <li><b>The CIO</b> (information technology) and often the <b>CFO</b> (money).</li>\n    <li><b>A risk leader</b> (chief risk officer) and <b>a legal adviser</b> (general counsel).</li>\n    <li><b>Business leaders</b> who own the systems and the data.</li>\n    <li><b>Internal audit</b> usually attends as an observer, because it must stay independent.</li>\n    <li><b>Experts</b> such as a SOC lead or a penetration tester are invited to explain a topic.</li>\n  </ul>\n\n  <h3>What happens in a normal month?</h3>\n  <ul class=\"tight\">\n    <li>It reads a report about the <b>top risks</b> (the risk register) and checks who owns each risk.</li>\n    <li>It looks at <b>numbers</b> called KPIs and KRIs — simple measurements that show if security is getting\n    better or worse (for example: how fast patches are installed, or how many people click a fake email).</li>\n    <li>It <b>approves policies and standards</b>, and the security budget and roadmap.</li>\n    <li>It signs off when a business wants to keep a known risk. This is called <b>risk acceptance</b>.</li>\n    <li>It writes every decision in the <b>minutes</b> (the official record), with an owner and a due date.</li>\n  </ul>\n\n  <h3>Where you will meet this keyword at work</h3>\n  <ul class=\"tight\">\n    <li><b>SOC and incident response:</b> when a major incident happens, the committee is informed. It decides\n    about money, priority, and what the board must be told. Small alerts never reach it.</li>\n    <li><b>Risk and GRC analysts:</b> they prepare the risk register, the risk appetite statement, the exception\n    requests, the KPI/KRI dashboard and the board pack.</li>\n    <li><b>Compliance and audit:</b> the committee approves policies, reviews audit findings and holds the\n    <b>management review</b> that standards such as ISO/IEC 27001 clause 9.3 require from top management.\n    It is where leaders show that they take responsibility.</li>\n    <li><b>Engineering and cloud teams:</b> architects bring design decisions that need money or that change the\n    level of risk, for example moving a service to a new cloud provider.</li>\n    <li><b>Red team and penetration testers:</b> their technical report stays with the engineers, but the\n    important findings and the fixes are summarised for the committee.</li>\n    <li><b>Legal, privacy and regulators:</b> the committee approves how the company answers regulators and\n    customers, for example after a data breach.</li>\n  </ul>\n\n  <h3>The documents you will handle</h3>\n  <p>The <b>charter</b> (also called terms of reference: it says why the committee exists, who is on it and\n  what it may decide), the <b>agenda</b>, the <b>minutes</b>, the <b>action log</b>, the <b>risk register</b>,\n  the <b>exception register</b>, the <b>KPI/KRI dashboard</b> and the <b>board report</b>.</p>\n\n  <h3>The tools you will use</h3>\n  <p>You will work in a <b>GRC platform</b> (governance, risk and compliance software that stores risks,\n  exceptions and decisions), in the <b>ticketing tool</b> (for example ServiceNow or Jira), in the\n  <b>dashboard</b> that shows the KPIs and KRIs, in the <b>shared drive</b> that holds the charters and the\n  minutes, and in <b>spreadsheets</b> for the board pack. Nothing exotic: the committee lives on documents,\n  numbers and records.</p>\n\n  <h3>The risks it exists to control</h3>\n  <p>Risk that nobody owns, risk that is hidden because nobody reports it, money spent on the wrong things,\n  rules that are broken, fines from regulators, and slow decisions that leave the company exposed\n  for a long time.</p>\n\n  <p class=\"muted\">In one sentence: security work needs one place where business leaders and security leaders\n  decide together. That place is the Security Steering Committee.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">Four rules, one severity level, no surprises. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b>, the exercise is correct only if every decision was right on the first try.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>70%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>30 minutes</b>.</li>\n        <li>The countdown, the live score, the hint and the skip button are always visible in the header at the top.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n        \n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Drag each card into the correct box</li><li>Drag the steps into the right order</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log or document analysis with a coloured viewer and a filter box</li><li>Match each item to the right answer</li><li>Multi-select question — several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Every exercise uses the same three blocks, in the same order: <b>SCENARIO</b> (blue),\n      <b>QUESTION</b> (amber) and <b>YOUR ANSWER</b> (green), with the feedback block below them. Long scenarios can be\n      collapsed with <b>Hide scenario</b>. Some exercises ask you to drag cards — with a mouse, or on a tablet by\n      selecting a card and then selecting the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>artefact</b> — the file, log, meeting record or dashboard shown inside the exercise.</li>\n        <li><b>distractor</b> — a wrong answer that looks reasonable. It tests real understanding.</li>\n        <li><b>near-miss answer</b> — a wrong answer that is almost right, usually a true statement used in the wrong place.</li>\n        <li><b>time-boxed</b> — limited to a fixed period, with an end date.</li>\n        <li><b>concentration risk</b> — depending too much on one supplier, one system or one person.</li>\n        <li><b>ISMS</b> — information security management system: the rules, roles and records that manage security.</li>\n        <li><b>ITGC</b> — IT general controls: the basic access, change and operations controls that financial reporting depends on.</li>\n        <li><b>SOX</b> — the US law on financial reporting controls. <b>PCI DSS</b> — the card payment security standard.\n            <b>SOC 2</b> — an independent report on a provider's controls.</li>\n        <li><b>DORA and NIS2</b> — EU rules for the financial sector and for essential services. Both put duties on the management body.</li>\n        <li><b>KPI and KRI</b> — performance and risk measurements. <b>SIEM</b> — the platform that collects and relates security logs.</li>\n        <li><b>DPIA / transfer impact assessment</b> — checks required before using personal data in a risky or foreign context.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev easy\">EASY</span>\n      </p>\n      <p class=\"muted small\">EASY - Foundational. Every exercise tests one security governance idea at a time and the wording guides you. The distractors are weaker but still realistic, like the wrong reflex a beginner would have. If you read the explanation above, you can pass this file.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests</h4><p class=\"muted small\">The complete concept map of the keyword <b>Security Steering Committee</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Governance & Oversight</h4><div class=\"tags\"><span class=\"tag\">security governance</span><span class=\"tag\">charter / terms of reference</span><span class=\"tag\">meeting cadence</span><span class=\"tag\">quorum</span><span class=\"tag\">minutes as the official record</span><span class=\"tag\">action log</span><span class=\"tag\">decision log</span><span class=\"tag\">escalation path</span><span class=\"tag\">delegation of authority</span><span class=\"tag\">committee chair and secretary</span><span class=\"tag\">voting member and invited expert (no vote)</span></div></div><div class=\"theme\"><h4>Strategy, Budget & Planning</h4><div class=\"tags\"><span class=\"tag\">security strategy</span><span class=\"tag\">security roadmap</span><span class=\"tag\">security programme budget</span><span class=\"tag\">funding and resource decisions</span><span class=\"tag\">business case</span><span class=\"tag\">cost, avoided loss and benefit</span><span class=\"tag\">security architecture review board</span><span class=\"tag\">alignment with business drivers</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Enterprise Risk Management</h4><div class=\"tags\"><span class=\"tag\">risk register</span><span class=\"tag\">risk appetite</span><span class=\"tag\">risk tolerance</span><span class=\"tag\">risk treatment (mitigate, transfer, avoid, accept)</span><span class=\"tag\">inherent risk and residual risk</span><span class=\"tag\">risk score (likelihood x impact)</span><span class=\"tag\">risk owner</span><span class=\"tag\">risk acceptance request</span><span class=\"tag\">acceptance ief risk officer)</span><span class=\"tag\">legal counsel</span><span class=\"tag\">DPO / privacy officer</span><span class=\"tag\">internal audit observer</span><span class=\"tag\">business risk owner</span><span class=\"tag\">service owner</span><span class=\"tag\">invited expert with no vote</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Operational Integration</h4><div class=\"tags\"><span class=\"tag\">major incident escalation to the committee</span><span class=\"tag\">crisis management (incident bridge)</span><span class=\"tag\">post-incident review</span><span class=\"tag\">change advisory board (CAB) interface</span><span class=\"tag\">security exception and waiver</span><span class=\"tag\">project security gates</span><span class=\"tag\">vendor onboarding approval</span><span class=\"tag\">M&A due diligence</span><span class=\"tag\">cloud migration governance</span><span class=\"tag\">security awareness programme approval</span></div></div><div class=\"theme\"><h4>Assurance & Continuous Improvement</h4><div class=\"tags\"><span class=\"tag\">management review inputs and outputs</span><span class=\"tag\">internal audit programme</span><span class=\"tag\">supplier audit reports (SOC 2) and penetration tests</span><span class=\"tag\">control design and operating effectiveness</span><span class=\"tag\">continual improvement</span><span class=\"tag\">regulatory notification duty</span><span class=\"tag\">governance failures (no quorum, no minutes, silent risk acceptance)</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit — defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> — written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This i
