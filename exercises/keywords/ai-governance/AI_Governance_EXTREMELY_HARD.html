function noteAnswer(txt){ var n=$('#ans-note'); if(n) n.innerHTML=txt; }
function checkEnable(){ var b=$('#btn-check'); if(b) b.disabled=!W.ready(); }
function buildWidget(ex){
  var w=ex.w;
  if(w.kind==='mcq' || w.kind==='mcqm') buildChoice(ex);
  else if(w.kind==='categorize') buildCategorize(w);
  else if(w.kind==='match') buildMatch(w);
  else if(w.kind==='order') buildOrder(w);
  else if(w.kind==='fill') buildFill(w);
  else if(w.kind==='find') buildFind(w);
  else if(w.kind==='sim') buildSim(w);
}
/* --- multiple choice (single + multi) --- */
function buildChoice(ex){
  var multi=(ex.w.kind==='mcqm');
  var opts=ex.w.options.map(function(o,i){
    var ok = multi ? (ex.w.correct.indexOf(i)>-1) : (i===ex.w.correct);
    return {t:o.t, why:o.why, ok:ok};
  });
  opts=shuffle(opts);
  W={kind:multi?'mcqm':'mcq', opts:opts, sel:-1, selSet:{}, multi:multi};
  noteAnswer(multi ? 'Select all that apply. The number of correct answers is not shown.' : 'Pick the one best answer.');
  var el=$('#widget');
  el.innerHTML=opts.map(function(o,i){
    return '<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="opt-k">'+String.fromCharCode(65+i)+'.</span><span class="opt-t">'+esc(o.t)+'</span><span class="opt-mark" aria-hidden="true"></span></button>';
  }).join('');
  $all('#widget .opt').forEach(function(b){
    b.addEventListener('click', function(){
      if(locked) return;
      var i=+this.getAttribute('data-i');
      if(multi){
        W.selSet[i]=!W.selSet[i];
        this.classList.toggle('sel', !!W.selSet[i]);
        this.setAttribute('aria-pressed', W.selSet[i]?'true':'false');
        this.querySelector('.opt-mark').textContent=W.selSet[i]?'\u25CF':'';
      } else {
        W.sel=i;
        $all('#widget .opt').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); x.querySelector('.opt-mark').textContent=''; });
        this.classList.add('sel');
        this.setAttribute('aria-pressed','true');
        this.querySelector('.opt-mark').textContent='\u25CF';
      }
      checkEnable();
    });
  });
  W.ready=function(){ return multi ? Object.keys(W.selSet).some(function(k){ return W.selSet[k]; }) : W.sel>-1; };
  W.lock=function(){ $all('#widget .opt').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var L=function(i){ return String.fromCharCode(65+i)+'. '+W.opts[i].t; };
    var right=[],wrong=[],missed=[],corrTxt=[];
    W.opts.forEach(function(o,i){ if(o.ok) corrTxt.push(L(i)); });
    if(multi){
      W.opts.forEach(function(o,i){
        var picked=!!W.selSet[i];
        if(picked&&o.ok) right.push({label:L(i), why:o.why});
        else if(picked&&!o.ok) wrong.push({label:L(i), why:o.why});
        else if(!picked&&o.ok) missed.push({label:L(i), why:o.why});
      });
      var T=corrTxt.length, C=right.length, Wn=wrong.length;
      var pts=Math.floor(Math.max(0,C-Wn)/T*100);
      var you=Object.keys(W.selSet).filter(function(k){ return W.selSet[k]; }).map(function(k){ return L(+k); }).join(' \u00B7 ')||'(nothing)';
      return {pts:pts, you:you, correct:corrTxt.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
    }
    var o=W.opts[W.sel];
    if(o.ok) right.push({label:L(W.sel), why:o.why});
    else { wrong.push({label:L(W.sel), why:o.why}); }
    var ci=-1; W.opts.forEach(function(x,i){ if(x.ok) ci=i; });
    if(!o.ok) missed.push({label:L(ci), why:W.opts[ci].why});
    return {pts:o.ok?100:0, you:L(W.sel), correct:corrTxt.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
  };
}
/* --- categorize (drag & drop with click fallback) --- */
function buildCategorize(w){
  var items=shuffle(w.items.map(function(it){ return {t:it.t, why:it.why, zone:it.zone}; }));
  W={kind:'cat', zones:w.zones, items:items, assign:{}, selItem:-1};
  noteAnswer('Drag each item into its zone \u2014 or click an item, then click a zone. Click a placed item to send it back.');
  var el=$('#widget');
  el.innerHTML='<div class="bank" id="cat-bank"></div><div class="zones">'
    +w.zones.map(function(z,zi){
      return '<div class="zone" data-z="'+zi+'"><div class="zone-h">'+esc(z.name)+'</div><div class="zone-items" data-z="'+zi+'"></div></div>';
    }).join('')+'</div>';
  var bank=$('#cat-bank');
  items.forEach(function(it,i){
    var c=document.createElement('button');
    c.type='button'; c.className='chip'; c.setAttribute('draggable','true'); c.setAttribute('data-i',String(i));
    c.textContent=it.t;
    c.addEventListener('click', function(){ if(locked) return; if(W.assign[i]!=null){ unplace(i); } else selectItem(i,c); });
    c.addEventListener('dragstart', function(ev){ if(locked){ev.preventDefault();return;} ev.dataTransfer.setData('text/plain',String(i)); });
    bank.appendChild(c);
  });
  function selectItem(i,c){
    W.selItem=i;
    $all('#widget .chip').forEach(function(x){ x.classList.remove('sel'); });
    c.classList.add('sel');
  }
  function unplace(i){
    W.assign[i]=null; delete W.assign[i];
    var chip=$('#widget .chip[data-i="'+i+'"]');
    if(chip) bank.appendChild(chip);
    checkEnable();
  }
  $all('#widget .zone').forEach(function(zn){
    var zi=+zn.getAttribute('data-z');
    zn.setAttribute('tabindex','0');
    zn.setAttribute('role','button');
    zn.setAttribute('aria-label','Drop zone: '+w.zones[zi].name+'. Press Enter to place the selected item here.');
    zn.addEventListener('click', function(ev){
      if(locked) return;
      if(ev.target!==zn && ev.target!==zn.querySelector('.zone-h') && !ev.target.classList.contains('zone-items')) return;
      if(W.selItem>-1){ place(W.selItem,zi); }
    });
    zn.addEventListener('keydown', function(ev){
      if(locked) return;
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); if(W.selItem>-1){ place(W.selItem,zi); } }
    });
    zn.addEventListener('dragover', function(ev){ ev.preventDefault(); zn.classList.add('over'); });
    zn.addEventListener('dragleave', function(){ zn.classList.remove('over'); });
    zn.addEventListener('drop', function(ev){
      ev.preventDefault(); zn.classList.remove('over');
      if(locked) return;
      var i=+ev.dataTransfer.getData('text/plain');
      place(i,zi);
    });
  });
  function place(i,z){
    W.assign[i]=z; W.selItem=-1;
    var chip=$('#widget .chip[data-i="'+i+'"]');
    if(chip){ chip.classList.remove('sel'); $all('#widget .zone[data-z="'+z+'"] .zone-items')[0].appendChild(chip); }
    checkEnable();
  }
  W.ready=function(){ return Object.keys(W.assign).length>0; };
  W.lock=function(){ $all('#widget .chip').forEach(function(c){ c.disabled=true; c.draggable=false; }); };
  W.grade=function(){
    var right=[],wrong=[],missed=[],C=0,Wn=0;
    var correctTxt=w.zones.map(function(z,zi){
      var its=items.map(function(it,i){ return it.zone===zi?it.t:null; }).filter(Boolean);
      return its.length? (z.name+': '+its.join(', ')) : null;
    }).filter(Boolean).join(' \u00B7 ');
    items.forEach(function(it,i){
      var az=W.assign[i];
      if(az==null) missed.push({label:it.t, why:'You did not place this item. '+it.why});
      else if(az===it.zone){ C++; right.push({label:it.t+' \u2192 '+w.zones[az].name, why:it.why}); }
      else { Wn++; wrong.push({label:it.t+' \u2192 '+w.zones[az].name, why:it.why+' (Correct zone: '+w.zones[it.zone].name+'.)'}); }
    });
    var you=items.map(function(it,i){
      var az=W.assign[i];
      return it.t+' \u2192 '+(az==null?'(not placed)':w.zones[az].name);
    }).join(' \u00B7 ');
    return {pts:Math.floor(Math.max(0,C-Wn)/items.length*100), you:you, correct:correctTxt, right:right, wrong:wrong, missed:missed};
  };
}
/* --- matching (click left, then right) --- */
function buildMatch(w){
  var rights=shuffle(w.rights.map(function(r,i){ return {t:r.t, why:r.why, left:r.left}; }));
  W={kind:'match', lefts:w.lefts, rights:rights, pairs:{}, selLeft:-1};
  noteAnswer('Click an item on the left, then click its partner on the right. Click a paired left item to undo the pair.');
  var el=$('#widget');
  el.innerHTML='<div class="mwrap"><div class="mcol"><div class="mcol-h">Items</div>'
    +w.lefts.map(function(l,li){ return '<button type="button" class="mbtn" data-l="'+li+'">'+esc(l.t)+'<span class="pmark" aria-hidden="true"></span></button>'; }).join('')
    +'</div><div class="mcol"><div class="mcol-h">Partners</div>'
    +rights.map(function(r,ri){ return '<button type="button" class="mbtn" data-r="'+ri+'">'+esc(r.t)+'<span class="pmark" aria-hidden="true"></span></button>'; }).join('')
    +'</div></div>';
  function markRight(ri){
    var b=$('#widget .mbtn[data-r="'+ri+'"]');
    var holder=null;
    for(var k in W.pairs){ if(W.pairs[k]===ri) holder=+k; }
    b.querySelector('.pmark').textContent = holder!=null ? ('\u2190 '+String.fromCharCode(65+holder)) : '';
  }
  $all('#widget .mbtn[data-l]').forEach(function(b){
    b.addEventListener('click', function(){
      if(locked) return;
      var li=+this.getAttribute('data-l');
      if(W.pairs[li]!=null){ delete W.pairs[li]; this.querySelector('.pmark').textContent=''; $all('#widget .mbtn[data-r]').forEach(function(x,i){ markRight(i); }); checkEnable(); return; }
      W.selLeft=li;
      $all('#widget .mbtn[data-l]').forEach(function(x){ x.classList.remove('sel'); });
      this.classList.add('sel');
    });
  });
  $all('#widget .mbtn[data-r]').forEach(function(b){
    b.addEventListener('click', function(){
      if(locked) return;
      var ri=+this.getAttribute('data-r');
      if(W.selLeft<0) return;
      for(var k in W.pairs){ if(W.pairs[k]===ri) delete W.pairs[k]; }
      W.pairs[W.selLeft]=ri;
      $all('#widget .mbtn[data-l]').forEach(function(x,i){
        x.classList.remove('sel');
        x.querySelector('.pmark').textContent = W.pairs[i]!=null ? ('\u2192 '+(W.pairs[i]+1)) : '';
      });
      $all('#widget .mbtn[data-r]').forEach(function(x,i){ markRight(i); });
      W.selLeft=-1;
      checkEnable();
    });
  });
  W.ready=function(){ return Object.keys(W.pairs).length>0; };
  W.lock=function(){ $all('#widget .mbtn').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var right=[],wrong=[],missed=[],C=0,Wn=0,corr=[];
    w.lefts.forEach(function(l,li){
      var ri=W.pairs[li];
      var rOk=rights.filter(function(r){ return r.left===li; })[0];
      corr.push(l.t+' \u2192 '+rOk.t);
      if(ri==null) missed.push({label:l.t, why:'You did not pair this item. '+rOk.why});
      else if(rights[ri].left===li){ C++; right.push({label:l.t+' \u2192 '+rights[ri].t, why:rights[ri].why}); }
      else { Wn++; wrong.push({label:l.t+' \u2192 '+rights[ri].t, why:rights[ri].why+' (Correct partner: '+rOk.t+'.)'}); }
    });
    var you=w.lefts.map(function(l,li){
      var ri=W.pairs[li];
      return l.t+' \u2192 '+(ri==null?'(no pair)':rights[ri].t);
    }).join(' \u00B7 ');
    return {pts:Math.floor(Math.max(0,C-Wn)/w.lefts.length*100), you:you, correct:corr.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
  };
}
/* --- ordering (drag + up/down buttons) --- */
function buildOrder(w){
  var items=shuffle(w.items.map(function(it,i){ return {t:it.t, why:it.why, pos:i}; }));
  W={kind:'order', items:items};
  noteAnswer('Put the steps in the right order: drag rows, or use the up/down buttons.');
  var el=$('#widget');
  function render(){
    el.innerHTML='<div class="ord">'+W.items.map(function(it,i){
      return '<div class="orow" draggable="true" data-i="'+i+'"><span class="ohandle" aria-hidden="true">\u2630</span>'
        +'<span class="opos">'+(i+1)+'</span><span class="otxt">'+esc(it.t)+'</span>'
        +'<button type="button" class="obtn" data-mv="up" data-i="'+i+'" aria-label="Move up">\u2191</button>'
        +'<button type="button" class="obtn" data-mv="down" data-i="'+i+'" aria-label="Move down">\u2193</button></div>';
    }).join('')+'</div>';
    $all('#widget .obtn').forEach(function(b){
      b.addEventListener('click', function(){
        if(locked) return;
        var i=+this.getAttribute('data-i');
        var mv=this.getAttribute('data-mv');
        var d=mv==='up'?-1:1;
        var j=i+d;
        if(j<0||j>=W.items.length) return;
        var t=W.items[i]; W.items[i]=W.items[j]; W.items[j]=t;
        render(); checkEnable();
        var nb=document.querySelector('#widget .obtn[data-mv="'+mv+'"][data-i="'+j+'"]');
        if(nb) nb.focus();
      });
    });
    $all('#widget .orow').forEach(function(row){
      row.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', row.getAttribute('data-i')); });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function(){ row.classList.remove('dragover'); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault(); row.classList.remove('dragover');
        if(locked) return;
        var from=+ev.dataTransfer.getData('text/plain');
        var to=+row.getAttribute('data-i');
        if(isNaN(from)||from===to) return;
        var it=W.items.splice(from,1)[0];
        W.items.splice(to,0,it);
        render(); checkEnable();
      });
    });
  }
  render();
  W.ready=function(){ return true; };
  W.lock=function(){ $all('#widget .obtn').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var right=[],wrong=[],C=0,corr=w.items.map(function(it){ return it.t; }).join(' \u2192 ');
    W.items.forEach(function(it,i){
      if(it.pos===i){ C++; right.push({label:'Position '+(i+1)+': '+it.t, why:it.why}); }
      else wrong.push({label:'Position '+(i+1)+': '+it.t, why:it.why+' (It belongs in position '+(it.pos+1)+'.)'});
    });
    var you=W.items.map(function(it){ return it.t; }).join(' \u2192 ');
    return {pts:Math.floor(C/W.items.length*100), you:you, correct:corr, right:right, wrong:wrong, missed:[]};
  };
}
/* --- fill in the blank (word bank) --- */
function buildFill(w){
  var bank=[];
  w.blanks.forEach(function(b,i){ bank.push({word:b.correct, blank:i, why:b.why}); });
  (w.extra||[]).forEach(function(x){ bank.push({word:x.t, blank:-1, why:x.why}); });
  bank=shuffle(bank);
  W={kind:'fill', w:w, bank:bank, assign:{}, active:0};
  noteAnswer('Click a word, then click a blank \u2014 or click a word to fill the next empty blank. Click a filled blank to empty it.');
  var el=$('#widget');
  function renderSentence(){
    var parts=w.text.split(/\{(\d+)\}/g);
    var html='';
    for(var i=0;i<parts.length;i++){
      if(i%2===0){ html+=esc(parts[i]); }
      else{
        var bi=+parts[i];
        var wid=W.assign[bi];
        html+='<button type="button" class="blank'+(wid!=null?' filled':'')+(W.active===bi?' active':'')+'" data-b="'+bi+'">'+(wid!=null?esc(bank[wid].word):'\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0')+'</button>';
      }
    }
    $('#fill-sent').innerHTML=html;
    $all('#fill-sent .blank').forEach(function(b){
      b.addEventListener('click', function(){
        if(locked) return;
        var bi=+this.getAttribute('data-b');
        if(W.assign[bi]!=null){ delete W.assign[bi]; render(); }
        else { W.active=bi; render(); }
        checkEnable();
        var nb=document.querySelector('#fill-sent .blank[data-b="'+bi+'"]');
        if(nb) nb.focus();
      });
    });
  }
  function render(){
    renderSentence();
    $('#fill-bank').innerHTML=W.bank.map(function(b,i){
      var used=Object.keys(W.assign).some(function(k){ return W.assign[+k]===i; });
      return '<button type="button" class="wchip" data-w="'+i+'"'+(used?' disabled':'')+'>'+esc(b.word)+'</button>';
    }).join('');
    $all('#fill-bank .wchip').forEach(function(c){
      c.addEventListener('click', function(){
        if(locked) return;
        var wi=+this.getAttribute('data-w');
        var target=(W.assign[W.active]==null)?W.active:blanksNext();
        if(target==null) return;
        W.assign[target]=wi;
        render(); checkEnable();
        var nb=document.querySelector('#fill-sent .blank[data-b="'+target+'"]');
        if(nb) nb.focus();
      });
    });
  }
  function blanksNext(){
    for(var i=0;i<w.blanks.length;i++){ if(W.assign[i]==null) return i; }
    return null;
  }
  el.innerHTML='<p class="sentence" id="fill-sent"></p><div class="words" id="fill-bank"></div>';
  render();
  W.ready=function(){ return Object.keys(W.assign).length>0; };
  W.lock=function(){ $all('#fill-bank .wchip, #fill-sent .blank').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var right=[],wrong=[],missed=[],C=0,Wn=0,corr=[];
    w.blanks.forEach(function(b,i){
      corr.push(b.correct);
      var wid=W.assign[i];
      if(wid==null) missed.push({label:'Blank '+(i+1)+': '+b.correct, why:'You left this blank empty. '+b.why});
      else if(bank[wid].blank===i){ C++; right.push({label:'Blank '+(i+1)+': '+b.correct, why:b.why}); }
      else { Wn++; wrong.push({label:'Blank '+(i+1)+': '+bank[wid].word, why:'This word does not fit here. '+b.why}); }
    });
    var you=w.blanks.map(function(b,i){
      var wid=W.assign[i];
      return 'Blank '+(i+1)+': '+(wid!=null?bank[wid].word:'(empty)');
    }).join(' \u00B7 ');
    return {pts:Math.floor(Math.max(0,C-Wn)/w.blanks.length*100), you:you, correct:corr.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
  };
}
/* --- find the line (log viewer with filter / table / list) --- */
function buildFind(w){
  W={kind:'find', w:w, sel:{}, q:''};
  noteAnswer(w.multi ? 'Click every line that matches the question. Click again to unselect. Use the filter box to search.'
                     : 'Click the one line that matches the question. Use the filter box to search.');
  var el=$('#widget');
  var inputHtml = w.filter ? '<input class="filterbox" id="find-q" type="text" placeholder="Filter lines \u2014 try a word, a level like WARN, or a user name" aria-label="Filter lines">'
                           : '';
  el.innerHTML=inputHtml+'<div class="clickset" id="find-set"></div><div class="selnote" id="find-note"></div>';
  function lineHtml(ln,i){
    if(w.style==='table'){
      return '<tr class="ln" data-i="'+i+'" tabindex="0" role="button" aria-pressed="false">'+ln.cells.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>';
    }
    var inner = w.style==='log' ? '<span class="mono">'+hl(ln.t)+'</span>' : esc(ln.t);
    return '<button type="button" class="ln" data-i="'+i+'" aria-pressed="false">'+inner+'</button>';
  }
  function render(){
    var setEl=$('#find-set');
    if(w.style==='table'){
      var head=w.head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('');
      setEl.innerHTML='<table class="dt"><thead><tr>'+head+'</tr></thead><tbody>'
        +w.lines.map(function(ln,i){ return W.q && !ln.raw.toLowerCase().includes(W.q) ? '' : lineHtml(ln,i); }).join('')
        +'</tbody></table>';
    } else {
      setEl.innerHTML=w.lines.map(function(ln,i){ return W.q && !ln.raw.toLowerCase().includes(W.q) ? '' : lineHtml(ln,i); }).join('');
    }
    $all('#find-set .ln').forEach(function(b){
      b.addEventListener('click', function(){
        if(locked) return;
        var i=+this.getAttribute('data-i');
        if(w.multi){ W.sel[i]=!W.sel[i]; this.classList.toggle('sel', !!W.sel[i]); this.setAttribute('aria-pressed', W.sel[i]?'true':'false'); }
        else{
          W.sel={}; W.sel[i]=true;
          $all('#find-set .ln').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
          this.classList.add('sel');
          this.setAttribute('aria-pressed','true');
        }
        drawNote(); checkEnable();
      });
      b.addEventListener('keydown', function(ev){
        if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); this.click(); }
      });
    });
    $all('#find-set .ln').forEach(function(b){
      var i=+b.getAttribute('data-i');
      if(W.sel[i]) b.classList.add('sel');
    });
  }
  function drawNote(){
    var n=Object.keys(W.sel).filter(function(k){ return W.sel[k]; }).length;
    $('#find-note').textContent = n>0 ? (n+' line'+(n===1?'':'s')+' selected') : '';
  }
  if(w.filter){
    $('#find-q').addEventListener('input', function(){ W.q=this.value.trim().toLowerCase(); render(); });
  }
  w.lines.forEach(function(ln){ ln.raw = ln.t || (ln.cells||[]).join(' | '); });
  render();
  W.ready=function(){ return Object.keys(W.sel).some(function(k){ return W.sel[k]; }); };
  W.lock=function(){ $all('#find-set .ln').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var right=[],wrong=[],missed=[],C=0,Wn=0,corr=[];
    w.lines.forEach(function(ln,i){
      if(ln.ok){ corr.push((ln.label||ln.t||ln.cells.join(' | '))); }
      var picked=!!W.sel[i];
      if(picked&&ln.ok){ C++; right.push({label:shortLine(ln), why:ln.why}); }
      else if(picked&&!ln.ok){ Wn++; wrong.push({label:shortLine(ln), why:ln.why}); }
      else if(!picked&&ln.ok){ missed.push({label:shortLine(ln), why:ln.why}); }
    });
    var selTxt=w.lines.filter(function(ln,i){ return W.sel[i]; }).map(shortLine).join(' \u00B7 ')||'(nothing)';
    var pts = w.multi ? Math.floor(Math.max(0,C-Wn)/Math.max(1,corr.length)*100) : (C===1&&Wn===0?100:0);
    return {pts:pts, you:selTxt, correct:corr.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
  };
  function shortLine(ln){
    var t = ln.t || ln.cells.join(' | ');
    return t.length>90 ? t.slice(0,90)+'\u2026' : t;
  }
}
/* --- branching simulation (step by step) --- */
function buildSim(w){
  var steps=w.steps.map(function(st){
    return {t:st.t, choices:shuffle(st.choices.map(function(c){ return {t:c.t, ok:!!c.ok, out:c.out, why:c.why}; }))};
  });
  W={kind:'sim', steps:steps, step:0, picks:{}};
  noteAnswer('Choices lock in as you go \u2014 like a real incident. Read each step, then decide.');
  var el=$('#widget');
  function renderStep(){
    var s=steps[W.step];
    el.innerHTML='<span class="step-tag">STEP '+(W.step+1)+' OF '+steps.length+'</span>'
      +'<p class="sim-scen">'+esc(s.t)+'</p>'
      +s.choices.map(function(c,ci){ return '<button type="button" class="choice" data-c="'+ci+'">'+esc(c.t)+'</button>'; }).join('')
      +'<div id="sim-out"></div>';
    $all('#widget .choice').forEach(function(b){
      b.addEventListener('click', function(){
        if(locked) return;
        var ci=+this.getAttribute('data-c');
        W.picks[W.step]=ci;
        $all('#widget .choice').forEach(function(x){ x.disabled=true; });
        this.classList.add('picked');
        var c=s.choices[ci];
        $('#sim-out').innerHTML='<div class="outcome">'+esc(c.out)+'</div>'
          +(W.step+1<steps.length ? '<button id="sim-next" class="btn primary" type="button">Continue \u25B6</button>'
                                  : '<p class="mini" style="margin:8px 0 0">All steps answered \u2014 press <b>Check answer</b>.</p>');
        var nb=$('#sim-next');
        if(nb) nb.addEventListener('click', function(){ W.step++; renderStep(); });
        checkEnable();
        if(nb) nb.focus();
      });
    });
  }
  renderStep();
  W.ready=function(){ return Object.keys(W.picks).length===steps.length; };
  W.lock=function(){ $all('#widget .choice').forEach(function(b){ b.disabled=true; }); };
  W.grade=function(){
    var right=[],wrong=[],missed=[],C=0,Wn=0,corr=[],you=[];
    steps.forEach(function(s,si){
      var pi=W.picks[si];
      var okc=s.choices.filter(function(c){ return c.ok; })[0];
      corr.push('Step '+(si+1)+': '+okc.t);
      var pc=s.choices[pi];
      you.push('Step '+(si+1)+': '+pc.t);
      if(pc.ok){ C++; right.push({label:'Step '+(si+1)+': '+pc.t, why:pc.why}); }
      else { Wn++; wrong.push({label:'Step '+(si+1)+': '+pc.t, why:pc.why}); missed.push({label:'Step '+(si+1)+' (better): '+okc.t, why:okc.why}); }
    });
    return {pts:Math.floor(Math.max(0,C-Wn)/steps.length*100), you:you.join(' \u00B7 '), correct:corr.join(' \u00B7 '), right:right, wrong:wrong, missed:missed};
  };
}
/* ---------------- results ---------------- */
function computeResults(){
  var earned=0,possible=0,full=0,part=0,zero=0,nans=0;
  var themes={};
  S.order.forEach(function(idx){
    var ex=DATA.exercises[idx], a=S.answered[idx];
    var th=themes[ex.theme] || (themes[ex.theme]={ans:0,earn:0,pos:0});
    if(a){
      earned+=a.pts; possible+=100; th.ans++; th.earn+=a.pts; th.pos+=100;
      if(a.status==='correct') full++; else if(a.status==='partial') part++; else zero++;
    } else nans++;
  });
  var percent = possible>0 ? Math.round(earned/possible*100) : 0;
  return {earned:earned,possible:possible,full:full,part:part,zero:zero,nans:nans,themes:themes,percent:percent,passed:percent>=DATA.passMark};
}
function reportScore(r){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:DATA.topicId, batch:DATA.batch,
      score:r.earned, total:r.possible, percent:r.percent, passed:r.passed
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
function showResults(){
  if(S.phase==='results') return;
  S.phase='results';
  S.timer.running=false;
  $('#pause-ov').hidden=true; $('#view').style.filter='';
  $('#btn-pause').textContent='\u23F8 Pause';
  var r=computeResults();
  reportScore(r);
  drawTimer(); updateHeader();
  var R=54, CIRC=2*Math.PI*R;
  var dash=CIRC*r.percent/100;
  var col = r.passed ? 'var(--green)' : 'var(--red)';
  var themeRows=Object.keys(r.themes).map(function(t){
    var th=r.themes[t];
    return '<tr><td>'+esc(t)+'</td><td>'+th.ans+'</td><td>'+th.earn+' / '+th.pos+'</td><td>'+(th.pos? Math.round(th.earn/th.pos*100):0)+'%</td></tr>';
  }).join('');
  var cert = r.passed
    ? '<div class="cert"><div class="c-k">CyberPulse Academy \u00B7 Certificate of pass</div><div class="c-big">'+r.percent+'% \u2014 PASS \u2713</div>'
      +'<div style="font-weight:800">AI Governance \u2014 '+DATA.sevLabel+' tier</div>'
      +'<div class="c-meta">Score: '+r.earned+' / '+r.possible+' points \u00B7 Pass mark: '+DATA.passMark+'%<br>'
      +'Learner: '+esc(DATA.learner||'\u2014')+' \u00B7 Date: '+new Date().toISOString().slice(0,10)+'</div></div>'
    : '<div class="failbox"><div class="c-big" style="color:var(--red)">'+r.percent+'% \u2717</div>'
      +'<p style="margin:4px 0 12px">You did not reach the pass mark of '+DATA.passMark+'%. You must retake this exam. Read the report below, study the pointers, then try again.</p>'
      +'</div>';
  var rep=S.order.map(function(idx){
    var ex=DATA.exercises[idx], a=S.answered[idx];
    if(!a){
      return '<div class="rep-item"><div class="rep-h"><span class="st skip">\u26A0 Not answered \u2014 excluded from score</span><span class="pts">0 / 0</span></div>'
        +'<div class="rep-body"><div class="sec"><b>Exercise</b>'+esc(ex.summary)+'</div>'
        +'<div class="sec"><b>Why it is excluded</b>You skipped this exercise and never returned to it. It adds nothing to your points and takes nothing away.</div>'
        +'<div class="sec"><b>What to study</b>'+esc(ex.study)+'</div></div></div>';
    }
    var st = a.status==='correct' ? ['ok','\u2713 Correct'] : (a.status==='partial' ? ['part','\u25D0 Partially correct'] : ['bad','\u2717 Incorrect']);
    return '<div class="rep-item"><div class="rep-h"><span class="st '+st[0]+'">'+st[1]+'</span><span style="color:var(--dim);font-size:13.5px">'+esc(ex.theme)+'</span><span class="pts">'+a.pts+' / 100</span></div>'
      +'<div class="rep-body"><div class="sec"><b>Scenario</b>'+esc(ex.summary)+'</div>'
      +'<div class="sec"><b>Question</b>'+esc(ex.q)+'</div>'
      +'<div class="sec"><b>Your answer</b>'+esc(a.you)+(a.hint?' (hint used: \u221210%)':'')+'</div>'
      +'<div class="sec"><b>Correct answer</b>'+esc(a.correct)+'</div>'
      + listBlock('What you got right', a.right, 'li-ok')
      + listBlock('What you got wrong', a.wrong, 'li-bad')
      + listBlock('What you missed', a.missed, 'li-miss')
      +'<div class="sec"><b>Why</b>'+esc(ex.expl)+'</div>'
      +'<div class="sec"><b>What to study</b>'+esc(ex.study)+'</div></div></div>';
  }).join('');
  $('#view').innerHTML='<div class="wrap">'
    +(S.timeUp?'<div class="card" style="border-color:var(--amber)"><b>\u23F1 Time is up.</b> Exercises you never answered are excluded from the score.</div>':'')
    +'<div class="card"><div class="r-top">'
    +'<svg class="ring" width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="Final percent '+r.percent+'">'
    +'<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="var(--card2)" stroke-width="12"/>'
    +'<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" transform="rotate(-90 65 65)" stroke-dasharray="'+dash+' '+CIRC+'"/>'
    +'<text x="65" y="72" text-anchor="middle" fill="var(--txt)" font-size="24" font-weight="800">'+r.percent+'%</text></svg>'
    +'<div class="r-main"><div class="verdict '+(r.passed?'pass':'fail')+'">'+(r.passed?'PASS \u2713':'FAIL \u2717')+'</div>'
    +'<p style="color:var(--dim);margin:6px 0 0">'+r.earned+' points earned out of '+r.possible+' possible, counted over the exercises you actually answered. Pass mark: '+DATA.passMark+'%.</p></div></div>'
    +'<div class="rgrid">'
    +'<div class="rcell c-ok"><div class="n">'+r.full+'</div><div class="l">\u2713 Fully correct</div></div>'
    +'<div class="rcell c-part"><div class="n">'+r.part+'</div><div class="l">\u25D0 Partially correct</div></div>'
    +'<div class="rcell c-bad"><div class="n">'+r.zero+'</div><div class="l">\u2717 Fully incorrect</div></div>'
    +'<div class="rcell c-skip"><div class="n">'+r.nans+'</div><div class="l">\u26A0 Not answered (excluded)</div></div>'
    +'</div></div>'
    +cert
    +'<div class="card"><div class="blk-h" style="color:var(--blue)">Per-theme breakdown</div>'
    +'<table class="rtable"><thead><tr><th>Theme</th><th>Answered</th><th>Points</th><th>%</th></tr></thead><tbody>'+themeRows+'</tbody></table></div>'
    +'<div class="card"><div class="blk-h" style="color:var(--blue)">Detailed report \u2014 every exercise</div><p class="mini">Click an exercise to expand it.</p>'+rep+'</div>'
    +'<div style="text-align:center"><button id="btn-retake" class="btn primary big" type="button">Retake exam (new shuffle) \u21BA</button></div>'
    +'<footer class="note">Your result was reported to the learning platform once per attempt. The report above stays available for studying.</footer>'
    +'</div>';
  $all('.rep-h').forEach(function(h){
    h.addEventListener('click', function(){ h.parentNode.classList.toggle('open'); });
  });
  $('#btn-retake').addEventListener('click', function(){ startExam(); });
  window.scrollTo(0,0);
}
/* ---------------- handshake + boot ---------------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  var t=event.data.type;
  if(t!=='CYBERPULSE_INIT' && t!=='CYBERMASTERY_INIT') return;
  if(event.data.username) DATA.learner=String(event.data.username).slice(0,60);
});
function boot(){
  buildHeader();
  var v=document.createElement('main');
  v.id='view';
  document.body.appendChild(v);
  S=freshState();
  renderIntro();
}
boot();

</script>
