/* ---------- QCM / simulation ---------- */
function wChoice(ex, mount) {
  const st = { sel: null };
  const opts = shuffle(ex.qo.opts);
  const letters = ['A', 'B', 'C', 'D', 'E'];
  opts.forEach((o, i) => {
    const b = el('button', 'opt');
    b.appendChild(el('span', 'olab', letters[i] + '.'));
    b.appendChild(el('span', null, o.t));
    b.onclick = () => {
      if (st.done) return;
      $$('.opt', mount).forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); st.sel = o;
    };
    mount.appendChild(b);
  });
  submitBtn(mount, 'Submit answer', () => {
    if (!st.sel || st.done) return;
    st.done = true;
    const ok = st.sel.v === ex.qo.ans;
    $$('.opt', mount).forEach(x => x.disabled = true);
    record(ex, {
      frac: ok ? 1 : 0,
      user: st.sel.t,
      correctTxt: ex.qo.opts.find(o => o.v === ex.qo.ans).t,
      outcome: ex.qo.outcomes ? ex.qo.outcomes[st.sel.v] : undefined
    });
  });
}

/* ---------- table row click ---------- */
function wTableClick(ex, mount) {
  const st = { row: null };
  const art = $$('.artefact table.tbl', $('#card'))[ex.tableIdx || 0];
  if (art) {
    $$('tr', art).forEach((tr, ri) => {
      if (ri === 0) return;
      tr.classList.add('rowclick');
      keyActivate(tr);
      tr.onclick = () => {
        if (st.done) return;
        $$('tr', art).forEach(x => x.classList.remove('sel'));
        tr.classList.add('sel'); st.row = ri - 1;
      };
    });
  }
  if (ex.note) mount.appendChild(el('p', 'small muted', ex.note));
  submitBtn(mount, 'Submit answer', () => {
    if (st.row === null || st.done) return;
    st.done = true;
    const tbl = ex.table;
    const ok = st.row === ex.ansRow;
    $$('tr', art).forEach(x => x.classList.remove('sel'));
    if (ok) art.rows[st.row + 1].classList.add('good'); else art.rows[st.row + 1].classList.add('bad');
    if (ex.ansRow !== st.row) art.rows[ex.ansRow + 1].classList.add('good');
    record(ex, {
      frac: ok ? 1 : 0,
      user: 'R' + (st.row + 1) + ' \u2014 ' + tbl.rows[st.row].join(' | '),
      correctTxt: 'R' + (ex.ansRow + 1) + ' \u2014 ' + tbl.rows[ex.ansRow].join(' | '),
      userOk: ok ? null : ex.whyNot && ex.whyNot[st.row]
    });
  });
}

/* ---------- token click (log / config) ---------- */
function wSpotClick(ex, mount) {
  const st = { tok: null };
  const art = $$('.artefact pre.code', $('#card'))[ex.tokIdx || 0];
  if (art) {
    // wrap text nodes into clickable tokens (keeps the syntax-highlight spans)
    const html = art.innerHTML;
    art.innerHTML = '';
    const frag = document.createElement('div');
    frag.innerHTML = html;
    const walk = (node) => {
      Array.from(node.childNodes).forEach(ch => {
        if (ch.nodeType === 3) {
          const parts = ch.textContent.split(/(\s+)/);
          const wrap = el('span');
          parts.forEach(p => {
            if (!p) return;
            if (/^\s+$/.test(p)) wrap.appendChild(document.createTextNode(p));
            else { const t = el('span', 'token', p); t.dataset.tok = p; wrap.appendChild(t); }
          });
          node.replaceChild(wrap, ch);
        } else if (ch.nodeType === 1) walk(ch);
      });
    };
    walk(frag); /* tokenise the parsed copy, then move it back into the log panel */
    while (frag.firstChild) art.appendChild(frag.firstChild);
    $$('.token', art).forEach(t => {
      keyActivate(t);
      t.onclick = () => {
        if (st.done) return;
        $$('.token', art).forEach(x => x.classList.remove('sel'));
        t.classList.add('sel'); st.tok = t.dataset.tok;
      };
    });
  }
  if (ex.note) mount.appendChild(el('p', 'small muted', ex.note));
  submitBtn(mount, 'Submit answer', () => {
    if (!st.tok || st.done) return;
    st.done = true;
    const clean = st.tok.replace(/[^\w./:=\-]/g, '');
    const ok = clean === ex.ansTok;
    record(ex, {
      frac: ok ? 1 : 0,
      user: st.tok,
      correctTxt: ex.ansTok,
      userOk: ok ? null : (ex.whyTok || null)
    });
  });
}

/* ---------- fill in the blanks ---------- */
function wFillBlank(ex, mount) {
  const st = { sel: null, slots: {} };
  const wrap = el('div');
  const line = el('div');
  ex.fb.parts.forEach(p => {
    if (typeof p === 'string') line.appendChild(document.createTextNode(p));
    else {
      const s = el('span', 'slot', '\u2190 drop \u2192');
      s.dataset.si = p.b;
      keyActivate(s);
      s.onclick = () => {
        if (st.done) return;
        if (st.slots[s.dataset.si]) { // remove back to bank
          const chip = st.slots[s.dataset.si];
          chip.classList.remove('used'); delete st.slots[s.dataset.si];
          s.textContent = '\u2190 drop \u2192'; s.classList.remove('filled');
        } else if (st.sel) {
          const c = st.sel; st.sel = null;
          c.classList.remove('selc'); c.classList.add('used');
          s._place(c);
        }
      };
      s.onmouseover = () => { if (st.sel) s.classList.add('hover'); };
      s.onmouseout = () => s.classList.remove('hover');
      s._place = (chip) => { st.slots[s.dataset.si] = chip; s.textContent = chip.dataset.val; s.classList.add('filled'); };
      s._clear = () => { delete st.slots[s.dataset.si]; s.textContent = '\u2190 drop \u2192'; s.classList.remove('filled'); };
      line.appendChild(s);
    }
  });
  wrap.appendChild(line);
  wrap.appendChild(el('p', 'small muted', 'Tap a word, then tap a gap. Tap a filled gap to put the word back.'));
  const bank = el('div', 'bank');
  shuffle(ex.fb.bank).forEach(w => {
    const c = el('span', 'chipd', w);
    c.dataset.val = w;
    keyActivate(c);
    c.onclick = () => {
      if (st.done || c.classList.contains('used')) return;
      if (st.sel === c) { c.classList.remove('selc'); st.sel = null; return; }
      $$('.chipd', bank).forEach(x => x.classList.remove('selc'));
      c.classList.add('selc'); st.sel = c;
    };
    bank.appendChild(c);
  });
  wrap.appendChild(bank);
  mount.appendChild(wrap);
  submitBtn(mount, 'Submit answer', () => {
    if (st.done) return;
    const filled = Object.keys(st.slots).length;
    if (filled < ex.fb.answer.length) return;
    st.done = true;
    let ok = 0;
    ex.fb.answer.forEach((v, i) => { if (st.slots[i] && st.slots[i].dataset.val === v) ok++; });
    $$('.chipd', bank).forEach(x => x.classList.remove('selc'));
    record(ex, {
      frac: ok / ex.fb.answer.length,
      user: ex.fb.answer.map((_, i) => (st.slots[i] ? st.slots[i].dataset.val : '?')).join(' | '),
      correctTxt: ex.fb.answer.join(' | ')
    });
  });
}

/* ---------- log viewer with filter ---------- */
function wLogViewer(ex, mount) {
  const st = { done: false };
  if (ex.lv.hint) mount.appendChild(el('p', 'small muted', 'Filter box tip: ' + ex.lv.hint));
  const tools = el('div', 'lvtools');
  const inp = el('input'); inp.placeholder = 'Filter rows (e.g. DENY, :22, an IP)...';
  inp.oninput = () => render(inp.value.trim().toLowerCase());
  const cnt = el('span', 'lvcount');
  tools.appendChild(inp); tools.appendChild(cnt);
  mount.appendChild(tools);
  const box = el('div', 'lvtable');
  mount.appendChild(box);
  function render(f) {
    box.innerHTML = '';
    let n = 0;
    ex.lv.rows.forEach(r => {
      const s = r.t + ' ' + r.act + ' ' + r.msg;
      if (f && !s.toLowerCase().includes(f)) return;
      n++;
      const d = el('div', 'lvrow');
      d.appendChild(el('span', 't', r.t));
      const a = el('span', r.act === 'DENY' ? 'a-deny' : (r.act === 'ALLOW' ? 'a-allow' : 'a-alert'), r.act);
      d.appendChild(a);
      d.appendChild(el('span', null, r.msg));
      box.appendChild(d);
    });
    cnt.textContent = n + ' / ' + ex.lv.rows.length + ' rows';
  }
  render('');
  const ain = el('input', 'textin'); ain.id = 'lvAnswer'; ain.style.marginTop = '10px';
  ain.placeholder = ex.lv.placeholder || 'Type your answer...';
  mount.appendChild(ain);
  submitBtn(mount, 'Submit answer', () => {
    if (st.done) return;
    const v = ain.value.trim();
    if (!v) return;
    st.done = true; ain.disabled = true;
    const ok = normTxt(v) === normTxt(ex.lv.ans) || normTxt(v).includes(normTxt(ex.lv.ans));
    record(ex, {
      frac: ok ? 1 : 0,
      user: v,
      correctTxt: ex.lv.ans
    });
  });
}

/* ---------- multi-step (dual perspective / branching) ---------- */
function wSteps(ex, mount) {
  const st = { i: 0, oks: [], users: [], done: false };
  const prog = el('div', 'mini-timer');
  prog.style.background = 'rgba(59,130,246,.12)'; prog.style.borderColor = '#2b4a75'; prog.style.color = '#7db2f8';
  mount.appendChild(prog);
  const zone = el('div'); mount.appendChild(zone);
  function renderStep() {
    zone.innerHTML = '';
    const s = ex.steps[st.i];
    prog.textContent = 'STEP ' + (st.i + 1) + ' OF ' + ex.steps.length + ' \u2014 ' + s.title;
    // the step's own instruction line, so every step keeps a visible question
    zone.appendChild(el('div', 'bqtext sqtext', s.q));
    const opts = shuffle(s.opts);
    const letters = ['A', 'B', 'C', 'D', 'E'];
    const stt = { sel: null };
    opts.forEach((o, i) => {
      const b = el('button', 'opt');
      b.appendChild(el('span', 'olab', letters[i] + '.'));
      b.appendChild(el('span', null, o.t));
      b.onclick = () => {
        if (stt.done) return;
        $$('.opt', zone).forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); stt.sel = o;
      };
      zone.appendChild(b);
    });
    submitBtn(zone, st.i === ex.steps.length - 1 ? 'Submit final step' : 'Submit step', () => {
      if (!stt.sel || stt.done) return;
      stt.done = true;
      const ok = stt.sel.v === s.ans;
      st.oks.push(ok); st.users.push((st.i + 1) + ': ' + stt.sel.t);
      // disable all options and mark the correct one (+ the chosen one when wrong)
      $$('.opt', zone).forEach((x, xi) => {
        x.disabled = true;
        if (opts[xi] && opts[xi].v === s.ans) x.classList.add('good');
        else if (opts[xi] === stt.sel) x.classList.add('bad');
      });
      const fb = el('div', 'fline');
      fb.innerHTML = (ok ? '<b style="color:#4ade80">\u2713 Correct.</b> ' : '<b style="color:#f87171">\u2717 Incorrect.</b> ') + s.expl;
      zone.appendChild(fb);
      const nx = el('button', 'btn', st.i === ex.steps.length - 1 ? 'See final result \u2192' : 'Next step \u2192');
      nx.onclick = () => {
        st.i++;
        if (st.i < ex.steps.length) renderStep();
        else {
          const frac = st.oks.filter(Boolean).length / ex.steps.length;
          record(ex, {
            frac: frac,
            user: st.users.join('  ||  '),
            correctTxt: ex.steps.map((s2, i2) => 'Step ' + (i2 + 1) + ': ' + s2.opts.find(o => o.v === s2.ans).t).join('  ||  ')
          });
        }
      };
      zone.appendChild(nx);
    });
  }
  renderStep();
}

/* ---------- terminal emulator ---------- */
function wTerminal(ex, mount) {
  const t = ex.term;
  if (t.syntaxPanel) {
    const sp = el('div', 'syntax');
    sp.appendChild(el('div', 'alabel', 'SYNTAX REMINDER (read before typing)'));
    const ul = el('ul');
    t.syntaxPanel.forEach(li => ul.appendChild(el('li', null, li)));
    sp.appendChild(ul);
    mount.appendChild(sp);
  }
  if (t.intent) mount.appendChild(el('p', 'small muted', ICONS.info + ' ' + t.intent));
  if (t.outShape) {
    const sp = el('div', 'syntax');
    sp.appendChild(el('div', 'alabel', 'EXPECTED OUTPUT SHAPE (different target than yours)'));
    sp.appendChild(el('pre', 'code', t.outShape));
    mount.appendChild(sp);
  }
  if (t.note) mount.appendChild(el('div', 'term-note', ICONS.clock + ' ' + t.note));
  if (ex.miniTimer) { S.mini = { left: ex.miniTimer }; miniTimerBox(mount); }
  mount.appendChild(el('p', 'small muted', 'Fake shell \u2014 nothing real is executed. Type the command, press Enter. Your first Enter is graded. Addresses are defanged in this exam (198[.]51[.]100[.]231 style); type them plain or defanged \u2014 both are accepted.'));
  const shell = el('div', 'shell');
  const sb = el('div', 'scrollback'); sb.id = 'scrollback';
  shell.appendChild(sb);
  const row = el('div', 'termrow');
  row.appendChild(el('span', 'prompt', t.prompt || 'analyst@fw-lab:~$'));
  const inp = el('input'); inp.id = 'termInput'; inp.autocomplete = 'off'; inp.spellcheck = false;
  row.appendChild(inp);
  shell.appendChild(row);
  mount.appendChild(shell);
  const st = { done: false };
  printLine('Welcome. This is a simulated shell for exercise purposes only.', 'out');
  inp.focus();
  inp.onkeydown = (e) => {
    if (e.key !== 'Enter' || st.done) return;
    const raw = inp.value;
    if (!raw.trim()) return;
    inp.value = '';
    grade(raw);
  };
  function printLine(txt, cls) { const d = el('div', cls || 'out', txt); sb.appendChild(d); sb.scrollTop = sb.scrollHeight; }
  function grade(raw) {
    st.done = true;
    printLine((t.prompt ? t.prompt : '') + ' ' + raw, 'cmdin');
    const c = normCmd(raw);
    const has = (arr) => (arr || []).some(rx => new RegExp(rx).test(c));
    // dangerous command check first
    if (has(t.danger)) {
      printLine('\u26A0 SIMULATION STOPPED \u2014 this command would destroy state or evidence. Nothing was executed.', 'err');
      inp.disabled = true;
      record(ex, {
        frac: 0, user: raw, correctTxt: t.canonical,
        danger: t.dangerNote || 'This command changes or destroys state. On a live incident host that destroys evidence. Always prefer read-only commands first.'
      });
      return;
    }
    const reOk = has(t.accepts);
    let charsOk = true;
    if (reOk && t.requireChars) {
      const m = c.match(/-[a-z]+/g) || [];
      const cluster = m.join('');
      charsOk = t.requireChars.every(ch => cluster.includes(ch));
      if (t.forbidChars) charsOk = charsOk && !t.forbidChars.some(ch => cluster.includes(ch));
    }
    let subsOk = true;
    if (reOk && t.requireAll) subsOk = t.requireAll.every(s => c.includes(normCmd(s)));
    let forbOk = true;
    if (reOk && t.forbidRe) forbOk = !has(t.forbidRe);
    if (reOk && charsOk && subsOk && forbOk) {
      (t.output || '').split('\n').forEach(l => printLine(l, 'out'));
      inp.disabled = true;
      record(ex, { frac: 1, user: raw, correctTxt: t.canonical });
    } else {
      printLine('-bash: ' + raw.trim().split(/\s+/)[0] + ': ' + (t.wrongMsg || 'command not found (or not the right tool for this goal)'), 'err');
      inp.disabled = true;
      record(ex, {
        frac: 0, user: raw, correctTxt: t.canonical,
        userOk: t.missNote || null
      });
    }
  }
}

/* ================= drag & drop (mouse + touch via pointer events) ================= */
const DnD = { sel: null, start: null, ghost: null, onDrop: null };
function chipEl(text, val, onKey) {
  const c = el('span', 'chipd', text);
  c.dataset.val = val || text;
  c.addEventListener('pointerdown', dndDown);
  // keyboard: Enter/Space selects the chip (or runs a widget-specific handler)
  c.setAttribute('tabindex', '0'); c.setAttribute('role', 'button');
  c.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    if (onKey) onKey(c); else dndTapSelect(c);
  });
  return c;
}
function dndTapSelect(chip) {
  if (DnD.sel === chip) { chip.classList.remove('selc'); DnD.sel = null; }
  else { if (DnD.sel) DnD.sel.classList.remove('selc'); DnD.sel = chip; chip.classList.add('selc'); }
}
function dndDown(e) {
  const chip = e.currentTarget;
  if (chip.classList.contains('used')) return;
  DnD.start = { x: e.clientX, y: e.clientY, chip: chip, moved: false };
  window.addEventListener('pointermove', dndMove);
  window.addEventListener('pointerup', dndUp);
  e.preventDefault();
}
function dndMove(e) {
  if (!DnD.start) return;
  const dx = e.clientX - DnD.start.x, dy = e.clientY - DnD.start.y;
  if (!DnD.start.moved && Math.hypot(dx, dy) > 8) {
    DnD.start.moved = true;
    const g = DnD.start.chip.cloneNode(true);
    g.classList.add('dragghost');
    g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
    document.body.appendChild(g);
    DnD.ghost = g;
    DnD.start.chip.classList.add('ghosting');
  }
  if (DnD.ghost) {
    DnD.ghost.style.left = e.clientX + 'px'; DnD.ghost.style.top = e.clientY + 'px';
    $$('.dz,.bucket').forEach(z => z.classList.remove('hover'));
    const z = zoneUnder(e);
    if (z) z.classList.add('hover');
  }
}
function zoneUnder(e) {
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return t ? t.closest('.dz,.bucket,.ordlist li') : null;
}
function dndUp(e) {
  window.removeEventListener('pointermove', dndMove);
  window.removeEventListener('pointerup', dndUp);
  $$('.dz,.bucket').forEach(z => z.classList.remove('hover'));
  const s = DnD.start; DnD.start = null;
  if (DnD.ghost) { DnD.ghost.remove(); DnD.ghost = null; if (s) s.chip.classList.remove('ghosting'); }
  if (!s) return;
  if (s.moved) {
    const z = zoneUnder(e);
    if (z && DnD.onDrop) DnD.onDrop(z, s.chip);
  } else {
    if (DnD.sel === s.chip) { s.chip.classList.remove('selc'); DnD.sel = null; }
    else { if (DnD.sel) DnD.sel.classList.remove('selc'); DnD.sel = s.chip; s.chip.classList.add('selc'); }
  }
}
function zoneClickPlace(z) {
  if (DnD.sel && DnD.onDrop) { const c = DnD.sel; DnD.sel = null; c.classList.remove('selc'); DnD.onDrop(z, c); }
}
function returnToBank(chip, bank) {
  chip.classList.remove('used');
  bank.appendChild(chip);
}

/* ---------- matching: drag term chip onto definition slot ---------- */
function wDm(ex, mount) {
  const st = { done: false, slots: {} };
  const bank = el('div', 'bank');
  bank.appendChild(el('span', 'small muted', 'Item bank:'));
  const pairs = ex.dm.pairs;
  const chips = {};
  shuffle(pairs.map(p => p.l)).forEach(lv => {
    const txt = (ex.dm.leftText && ex.dm.leftText[lv]) || lv;
    const c = chipEl(txt, lv);
    chips[lv] = c; bank.appendChild(c);
  });
  mount.appendChild(bank);
  const rowsWrap = el('div');
  pairs.forEach((p, i) => {
    const row = el('div', 'matchrow');
    const dz = el('div', 'dz', '\u2190 drop here');
    dz.dataset.ri = i;
    dz.addEventListener('click', () => zoneClickPlace(dz));
    keyActivate(dz);
    const def = el('div', 'mdef', p.r);
    row.appendChild(dz); row.appendChild(def);
    rowsWrap.appendChild(row);
  });
  mount.appendChild(rowsWrap);
  mount.appendChild(el('p', 'small muted', 'Drag with mouse or finger, or tap the item then tap the slot. Tap a placed item to put it back.'));
  DnD.onDrop = (z, chip) => {
    if (st.done || !z.classList.contains('dz')) return;
    const ri = z.dataset.ri;
    // if this chip already sits in another slot, clear that mapping first
    Object.keys(st.slots).forEach(k => {
      if (st.slots[k] === chip) {
        delete st.slots[k];
        const oldz = $$('.dz', rowsWrap)[Number(k)];
        if (oldz) { oldz.textContent = '\u2190 drop here'; oldz.classList.remove('filled'); }
      }
    });
    if (st.slots[ri]) returnToBank(st.slots[ri], bank);
    st.slots[ri] = chip;
    z.textContent = ''; z.appendChild(chip);
    z.classList.add('filled');
  };
  if (ex.note) mount.appendChild(el('p', 'small muted', ex.note));
  submitBtn(mount, 'Submit answer', () => {
    if (st.done) return;
    if (Object.keys(st.slots).length < pairs.length) return;
    st.done = true;
    let ok = 0;
    pairs.forEach((p, i) => {
      const chip = st.slots[i];
      if (chip && chip.dataset.val === p.l) ok++;
      chip.classList.add('used');
      if (chip && chip.dataset.val === p.l) chip.style.borderColor = '#1d5c37';
      else if (chip) chip.style.borderColor = '#7c1d1d';
    });
    record(ex, {
      frac: ok / pairs.length,
      user: pairs.map((p, i) => (st.slots[i] ? (ex.dm.leftText && ex.dm.leftText[st.slots[i].dataset.val] || st.slots[i].dataset.val) : '?')).join(' | '),
      correctTxt: pairs.map(p => (ex.dm.leftText && ex.dm.leftText[p.l]) || p.l).join(' | ')
    });
  });
}

/* ---------- buckets ---------- */
function wBk(ex, mount) {
  const st = { done: false, where: {} };
  const bank = el('div', 'bank');
  bank.appendChild(el('span', 'small muted', 'Item bank:'));
  const items = {};
  shuffle(ex.bk.items).forEach(it => {
    const c = chipEl(it.t, it.v, (chip) => {
      // keyboard on a placed item = same as tapping it: back to the bank
      if (st.done) return;
      if (st.where[it.v] !== undefined) { delete st.where[it.v]; returnToBank(chip, bank); }
      else dndTapSelect(chip);
    });
    items[it.v] = c; bank.appendChild(c);
    c.addEventListener('click', () => {
      // click on a placed chip returns it to the bank (items stay movable)
      if (st.done) return;
      if (st.where[it.v] !== undefined) {
        delete st.where[it.v]; returnToBank(c, bank);
      }
    });
  });
  mount.appendChild(bank);
  const grid = el('div', 'buckets');
  ex.bk.buckets.forEach(b => {
    const col = el('div', 'bucket');
    col.dataset.bid = b.id;
    col.appendChild(el('h4', null, (b.icon || '\uD83D\uDCE6') + ' ' + b.label));
    col.addEventListener('click', () => zoneClickPlace(col));
    keyActivate(col);
    grid.appendChild(col);
  });
  mount.appendChild(grid);
  mount.appendChild(el('p', 'small muted', 'Drag each item into a bucket, or tap item then bucket. Tap an item inside a bucket to send it back to the bank.'));
  DnD.onDrop = (z, chip) => {
    if (st.done) return;
    if (z.classList.contains('bucket')) {
      const bid = z.dataset.bid;
      if (st.where[chip.dataset.val] === bid) return;
      st.where[chip.dataset.val] = bid;
      // NOTE: no 'used' class here - placed items must stay draggable/tappable
      // so the student can move them between buckets or back to the bank.
      z.appendChild(chip);
    } else if (z.classList.contains('dz')) { /* not used here */ }
  };
  submitBtn(mount, 'Submit answer', () => {
    if (st.done) return;
    if (Object.keys(st.where).length < ex.bk.items.length) return;
    st.done = true;
    let ok = 0;
    ex.bk.items.forEach(it => {
      if (st.where[it.v] === it.b) ok++;
      else { const c = items[it.v]; if (c) c.style.borderColor = '#7c1d1d'; }
      if (st.where[it.v] === it.b) { const c = items[it.v]; if (c) c.style.borderColor = '#1d5c37'; }
    });
    record(ex, {
      frac: ok / ex.bk.items.length,
      user: ex.bk.items.map(it => it.t + ' \u2192 ' + (st.where[it.v] ? (ex.bk.buckets.find(b => b.id === st.where[it.v]) || {}).label : '?')).join('  ||  '),
      correctTxt: ex.bk.items.map(it => it.t + ' \u2192 ' + ((ex.bk.buckets.find(b => b.id === it.b) || {}).label || it.b)).join('  ||  ')
    });
  });
}

/* ---------- ordering / ranking ---------- */
function wOrd(ex, mount) {
  const st = { done: false };
  mount.appendChild(el('p', 'small muted', ex.ord.rank
    ? 'Rank ' + ex.ord.rankLabel + ' Drag to reorder, or use the arrows. ' + ex.ord.rankHint
    : 'Put the steps in the correct order. Drag to reorder, or use the arrows.'));
  const list = el('ul', 'ordlist');
  const lis = {};
  shuffle(ex.ord.items).forEach(it => {
    const li = el('li');
    li.dataset.v = it.v;
    li.appendChild(el('span', 'oico', '\u21C5'));
    li.appendChild(el('span', null, it.t));
    const btns = el('div', 'ordbtns');
    const up = el('button', null, '\u25B2'), dn = el('button', null, '\u25BC');
    up.onclick = (e) => { e.stopPropagation(); if (st.done) return; const p = li.previousElementSibling; if (p) list.insertBefore(li, p); };
    dn.onclick = (e) => { e.stopPropagation(); if (st.done) return; const n = li.nextElementSibling; if (n) list.insertBefore(n, li); };
    btns.appendChild(up); btns.appendChild(dn);
    li.appendChild(btns);
    lis[it.v] = li;
    list.appendChild(li);
  });
  mount.appendChild(list);
  // drag-to-reorder for list items
  list.addEventListener('pointerdown', (e) => {
    const li = e.target.closest('li'); if (!li || st.done) return;
    if (e.target.closest('.ordbtns')) return;
    DnD.start = { x: e.clientX, y: e.clientY, chip: li, moved: false, isLi: true };
    window.addEventListener('pointermove', ordMove);
    window.addEventListener('pointerup', ordUp);
    e.preventDefault();
  });
  function ordMove(e) {
    if (!DnD.start) return;
    const dx = e.clientX - DnD.start.x, dy = e.clientY - DnD.start.y;
    if (!DnD.start.moved && Math.hypot(dx, dy) > 8) DnD.start.moved = true;
    if (!DnD.start.moved) return;
    $$('li', list).forEach(x => x.classList.remove('dragover'));
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const over = t ? t.closest('.ordlist li') : null;
    if (over && over !== DnD.start.chip) over.classList.add('dragover');
    DnD.over = over;
  }
  function ordUp(e) {
    window.removeEventListener('pointermove', ordMove);
    window.removeEventListener('pointerup', ordUp);
    $$('li', list).forEach(x => x.classList.remove('dragover'));
    const s = DnD.start; DnD.start = null;
    if (!s || !s.moved) return;
    if (DnD.over && DnD.over !== s.chip) {
      const r = document.createRange ? list.getBoundingClientRect() : null;
      const overY = DnD.over.getBoundingClientRect();
      if (e.clientY < overY.top + overY.height / 2) list.insertBefore(s.chip, DnD.over);
      else list.insertBefore(DnD.over, s.chip);
    }
    DnD.over = null;
  }
  submitBtn(mount, 'Submit order', () => {
    if (st.done) return;
    st.done = true;
    const seq = $$('li', list).map(li => li.dataset.v);
    let ok = 0;
    ex.ord.items.forEach((it, i) => { if (seq[i] === it.v) ok++; });
    $$('li', list).forEach((li, i) => { li.style.borderColor = seq[i] === ex.ord.items[i].v ? '#1d5c37' : '#7c1d1d'; });
    record(ex, {
      frac: ok / ex.ord.items.length,
      user: seq.map((v, i) => (i + 1) + '. ' + ex.ord.items.find(x => x.v === v).t).join('  '),
      correctTxt: ex.ord.items.map((it, i) => (i + 1) + '. ' + it.t).join('  ')
    });
  });
}
