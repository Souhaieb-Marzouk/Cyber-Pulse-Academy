<style>

:root{
  --bg:#0b1220; --bg2:#0d1526; --panel:#121c33; --panel2:#0f1930; --ink:#0a1120;
  --line:#26365a; --line2:#33477a;
  --text:#e8eefb; --muted:#aab8d6; --faint:#8296bd;
  --scen:#4f8ef7; --scenbg:#101d3a;
  --q:#f5a524; --qbg:#241d0b;
  --ans:#37c26e; --ansbg:#0e2718;
  --ok:#37c26e; --part:#f5a524; --bad:#f0564a; --skip:#9aa8c4;
  --sev-easy:#37c26e; --sev-medium:#f5a524; --sev-hard:#f97316; --sev-extreme:#f0564a;
  --focus:#8ec2ff;
  --mono:'Cascadia Code','Sarasa Mono SC',Consolas,'DejaVu Sans Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);
  font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;}
#app{max-width:1060px;margin:0 auto;padding:0 16px 64px}
code,pre,.mono{font-family:var(--mono)}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--focus)}

/* ---------- persistent exam header ---------- */
.xhead{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 4px;margin:0 -16px 18px;padding-left:16px;padding-right:16px}
.xh-count{font-weight:700;white-space:nowrap}
.sev-badge{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.06em;
  border:1px solid;padding:5px 10px;border-radius:999px;white-space:nowrap;min-height:24px}
.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(55,194,110,.10)}
.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(245,165,36,.10)}
.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(249,115,22,.10)}
.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(240,86,74,.12)}
.xh-mid{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.xh-row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.xh-timer{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap}
.xh-timer .mode{color:var(--muted);font-weight:600;font-size:13px}
.xh-score{font-family:var(--mono);font-size:15px;color:var(--muted);white-space:nowrap}
.xh-progress{height:6px;background:#1a2646;border-radius:99px;overflow:hidden}
.xh-progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#37c26e);transition:width .4s ease}
.xh-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#172441;color:var(--text);
  cursor:pointer;font-weight:600;transition:transform .08s ease,background .15s ease}
.btn:hover{background:#1d2d52}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2f6fed,#37c26e);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--q);color:var(--q)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.blank:focus-visible,.token:focus-visible,.m-item:focus-visible,
.m-zone:focus-visible,.cl:focus-visible,.ord-btn button:focus-visible,.mini:focus-visible,input:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px}
.mini{min-height:44px;min-width:44px;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

/* ---------- intro ---------- */
.hero{padding:26px 4px 8px}
.hero .kicker{color:var(--focus);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.hero h1{margin:6px 0 10px;font-size:32px}
.hero .sub{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:13.5px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.panel h2{margin:0 0 10px;font-size:19px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--focus)}
.panel p{margin:8px 0;color:var(--text)}
.panel .dim{color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.theme-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.theme-card h3{margin:0 0 8px;font-size:15px;color:var(--focus)}
.tcon{display:flex;flex-wrap:wrap;gap:6px}
.tcon span{background:#16244a;border:1px solid var(--line);border-radius:8px;padding:3px 9px;
  font-size:12.5px;color:var(--muted)}
.rules li{margin:6px 0}
.rules ul{padding-left:22px;margin:6px 0}
.start-row{display:flex;gap:14px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.cand{color:var(--muted);font-size:14px}
.note{border-left:3px solid var(--q);background:var(--qbg);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.note.blue{border-left-color:var(--scen);background:var(--scenbg)}
.note.green{border-left-color:var(--ans);background:var(--ansbg)}

/* ---------- exercise layout: three blocks ---------- */
.card{margin:0 0 26px}
.block{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:800;letter-spacing:.08em;
  font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.block-head .mini{margin-left:auto;text-transform:none;letter-spacing:0}
.block.scen{border-left:4px solid var(--scen)}
.block.scen .block-head{color:var(--scen);background:var(--scenbg)}
.block.q{border-left:4px solid var(--q)}
.block.q .block-head{color:var(--q);background:var(--qbg)}
.block.ans{border-left:4px solid var(--ans)}
.block.ans .block-head{color:var(--ans);background:var(--ansbg)}
.block-body{padding:14px 16px}
.scen-collapsed .scen-extra{display:none}
.scen-summary{margin:2px 0 8px;color:var(--focus);font-weight:600}
.scen-extra p{margin:8px 0}
.artefact{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);margin:12px 0;overflow:hidden}
.artefact .af-label{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--focus);border-bottom:1px solid var(--line);
  background:#0e1834}
.artefact .af-body{padding:10px 12px}
.artefact p{margin:8px 0}
.q-text{margin:6px 0 2px}
.q-text strong{font-size:17px}

/* monospace log/code rendering */
.logtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.logtools input{flex:1;background:#0a1224;border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:9px 12px;min-height:44px;font-family:var(--mono);font-size:14px}
.logtools .cnt{color:var(--faint);font-size:12.5px;white-space:nowrap}
pre.mono,div.mlog{background:#0a1224;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6;margin:0}
div.mlog .ln-row{display:block;white-space:pre-wrap}
code .t-info{color:#7dd3fc}code .t-warn{color:#fbbf24}code .t-bad{color:#f87171}
code .t-num{color:#c4b5fd}code .t-ip{color:#6ee7b7}code .t-time{color:#94a3b8}code .t-str{color:#fca5a5}
table.arttab{border-collapse:collapse;width:100%;font-size:14.5px}
table.arttab th,table.arttab td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.arttab th{background:#0e1834;color:var(--focus);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
table.arttab td.num{font-family:var(--mono)}
.chatline{margin:8px 0;padding:8px 12px;border-radius:10px;background:#16224a;border:1px solid var(--line)}
.chatline .who{font-weight:700;color:var(--focus);font-size:13.5px;margin-right:8px}

/* ---------- answer widgets ---------- */
.widget{padding:14px 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 14px;
  border-radius:10px;border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer}
.opt:hover{background:#182748}
.opt.sel{border-color:var(--focus);background:#1a2c56}
.opt.lock{cursor:default}
.opt .lab{font-weight:800;color:var(--focus);min-width:26px}
.multi-note{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.match-grid{grid-template-columns:1fr}}
.m-item{display:block;width:100%;text-align:left;min-height:48px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer;margin:8px 0}
.m-item.sel{border-color:var(--focus);background:#1a2c56}
.m-item.used{opacity:.55}
.m-zone{border:1.5px dashed var(--line2);border-radius:12px;padding:10px 12px;min-height:64px;margin:8px 0;
  background:#0e1834;cursor:pointer}
.m-zone.over{border-color:var(--focus)}
.mz-label{font-weight:700;color:var(--focus);font-size:14px;margin-bottom:6px}
.mz-chip{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#1a2c56;
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin:6px 0}
.mz-chip button{background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:15px;min-width:44px;min-height:44px}
.ord{list-style:none;margin:0;padding:0}
.ord-item{display:flex;gap:10px;align-items:center;background:#131f3d;border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin:8px 0;cursor:grab}
.ord-item.dragging{opacity:.5}
.ord-item .pos{font-family:var(--mono);font-weight:800;color:var(--focus);min-width:24px}
.ord-item .txt{flex:1}
.ord-item.drop-into{border-color:var(--focus);border-style:dashed}
.ord-btn{display:flex;gap:4px}
.ord-btn button{background:#0e1834;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  min-width:44px;min-height:44px;cursor:pointer;font-size:15px}
.fill-sent{line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border-radius:8px;border:1.5px dashed var(--line2);
  background:#0e1834;color:var(--text);padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:14.5px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--ans);background:var(--ansbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.token{background:#16244a;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;min-height:44px;
  color:var(--text);cursor:pointer;font-family:var(--mono);font-size:14.5px}
.token.sel{border-color:var(--focus);background:#1a2c56}
.code-lines{display:flex;flex-direction:column;gap:4px}
.cl{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0a1224;border:1px solid transparent;
  border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);font-family:var(--mono);font-size:14.5px;min-height:44px}
.cl:hover{border-color:var(--line2)}
.cl.flag{border-color:var(--q);background:#241d0b}
.cl .ln{color:var(--faint);min-width:26px}
.cl.flag .ln{color:var(--q)}
.cl code{white-space:pre-wrap}
.numwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numwrap input{background:#0a1224;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  padding:10px 12px;min-height:44px;font-family:var(--mono);font-size:15.5px;width:150px}
.numwrap .unit{color:var(--muted)}
.sim-step{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:10px 0}
.sim-step .ss-head{font-weight:800;color:var(--q);letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin-bottom:6px}
.sim-step .outcome{margin:10px 0 2px;padding:9px 12px;border-left:3px solid var(--line2);background:#0c1428;
  border-radius:0 8px 8px 0;color:var(--muted)}
.sim-step.done{opacity:.92}
.sim-locked{color:var(--faint);font-size:13.5px;margin-top:8px}

/* terminal */
.term{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#05080f}
.term-bar{padding:8px 12px;background:#0e1834;color:var(--focus);font-size:13px;font-weight:700;
  border-bottom:1px solid var(--line);font-family:var(--mono)}
.term-scroll{padding:12px 14px;max-height:300px;overflow-y:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6}
.term-scroll .cmd{color:#7dd3fc}
.term-scroll .err{color:#f87171}
.term-scroll .out{color:#c9d6f2}
.term-input{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px}
.term-input .ps1{color:var(--ans);font-family:var(--mono);font-weight:700}
.term-input input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);
  font-size:14.5px;min-height:44px}
.synpanel{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:12px 0}
.synpanel h4{margin:0 0 8px;font-size:14px;color:var(--focus)}
.synpanel table{border-collapse:collapse;font-size:13.5px;width:100%}
.synpanel td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
.synpanel td.f{font-family:var(--mono);color:#7dd3fc;white-space:nowrap}
.ex-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:#0e1834;
  border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);margin:6px 6px 0 0;font-family:var(--mono)}
.ex-chip.late{color:var(--q);border-color:var(--q)}

/* ---------- feedback ---------- */
.feedback{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:800;letter-spacing:.05em;
  font-size:14px;text-transform:uppercase}
.fb-ok{border-left:4px solid var(--ok)} .fb-ok .fb-head{color:var(--ok);background:rgba(55,194,110,.10)}
.fb-part{border-left:4px solid var(--part)} .fb-part .fb-head{color:var(--part);background:rgba(245,165,36,.10)}
.fb-bad{border-left:4px solid var(--bad)} .fb-bad .fb-head{color:var(--bad);background:rgba(240,86,74,.10)}
.fb-body{padding:14px 16px}
.fb-body h4{margin:12px 0 6px;font-size:14.5px}
.fb-body ul{margin:4px 0;padding-left:22px}
.fb-body li{margin:5px 0}
.fb-list-right li{color:#b8ecc9}
.fb-list-wrong li{color:#f6c1bc}
.fb-list-missed li{color:#fde9b8}
.pts-line{font-family:var(--mono);font-weight:700;color:var(--text)}
.copywrap{position:relative;margin:10px 0}
.copywrap pre{padding-right:64px}
.copybtn{position:absolute;top:8px;right:8px;min-height:44px;padding:4px 12px;border-radius:8px;
  border:1px solid var(--line2);background:#16244a;color:var(--muted);cursor:pointer;font-size:12.5px}
.warnline{color:var(--q);font-weight:600;margin:8px 0}
.navrow{display:flex;gap:12px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.checkmsg{color:var(--q);font-weight:600}

/* pause overlay */
.stage{position:relative}
.pause-overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:rgba(8,12,24,.97);border:1px solid var(--line);
  border-radius:14px;text-align:center;padding:20px}
.pause-overlay h2{margin:0}
.pause-overlay p{color:var(--muted);max-width:52ch}

/* ---------- review & results ---------- */
.rv-item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;flex-wrap:wrap}
.rv-item .rv-title{flex:1;min-width:240px}
.rv-item .rv-tag{color:var(--skip);font-size:13px}
.res-hero{border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.res-hero.pass{border-color:var(--ok);background:linear-gradient(180deg,rgba(55,194,110,.10),rgba(55,194,110,.02))}
.res-hero.fail{border-color:var(--bad);background:linear-gradient(180deg,rgba(240,86,74,.10),rgba(240,86,74,.02))}
.res-hero .big{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-hero .verdict{font-size:20px;font-weight:800;letter-spacing:.14em;margin:6px 0}
.res-hero .pts{color:var(--muted);font-family:var(--mono)}
.res-bar{height:12px;border-radius:99px;background:#1a2646;overflow:hidden;margin:16px auto 6px;max-width:560px}
.res-bar .bar{height:100%;width:0;transition:width 1s ease}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:13px}
.rep-item{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:12px 0;overflow:hidden}
.rep-head{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rep-head .st{font-weight:800;font-size:13.5px}
.rep-head .st.ok{color:var(--ok)} .rep-head .st.part{color:var(--part)}
.rep-head .st.bad{color:var(--bad)} .rep-head .st.skip{color:var(--skip)}
.rep-head .rp-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.rep-body{padding:12px 16px}
.rep-body .qa{margin:8px 0;color:var(--muted)}
.rep-body .qa b{color:var(--text)}
.theme-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.theme-table th,.theme-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.theme-table th{background:#0e1834;color:var(--focus);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
@media (max-width:720px){
  .hero h1{font-size:25px}
  .xh-right{margin-left:0}
}
.hidden{display:none}

</style>
</head>

<script>
window.EXAM_DATA = {"meta":{"topicId":"adversarial-machine-learning","batch":2,"title":"Adversarial Machine Learning — MEDIUM","pageTitle":"Adversarial Machine Learning — MEDIUM practice exam","difficulty":"medium","questionCount":17,"estimatedMinutes":45,"passMark":70,"timerSeconds":2700},"intro":"<div class=\"hero\"><div class=\"kicker\">Cyber Pulse Academy practice exam<\/div><h1>Adversarial Machine Learning<\/h1><p class=\"sub\">A hands-on certification exam on one keyword: <b>Adversarial Machine Learning<\/b>. Everything runs inside this single page. Nothing is sent anywhere.<\/p><div class=\"chips\"><span class=\"chip\">17 exercises<\/span><span class=\"chip\">Timer: 45 minutes<\/span><span class=\"chip\">Pass mark: 70%<\/span><span class=\"chip\">100 points per exercise<\/span><span class=\"chip\">Partial credit for multi-answer exercises<\/span><\/div><\/div><div class=\"panel\"><h2>Keywords covered<\/h2><p class=\"dim\">The keyword expands into the concept groups below. Every group is exercised in this exam family; each difficulty tier covers it at its own depth.<\/p><div class=\"theme-grid\"><div class=\"theme-card\"><h3>Evasion attacks<\/h3><div class=\"tcon\"><span>Adversarial example<\/span><span>Perturbation<\/span><span>Perturbation budget (epsilon)<\/span><span>FGSM<\/span><span>PGD<\/span><span>C&amp;W attack<\/span><span>DeepFool<\/span><span>Adversarial patch<\/span><span>Physical-world attack<\/span><span>Black-box / grey-box / white-box<\/span><span>Transferability<\/span><span>Query-based attack<\/span><span>L0 / L2 / L-inf norms<\/span><\/div><\/div><div class=\"theme-card\"><h3>Poisoning &amp; supply chain<\/h3><div class=\"tcon\"><span>Data poisoning<\/span><span>Label flipping<\/span><span>Backdoor (Trojan) attack<\/span><span>Trigger<\/span><span>BadNets<\/span><span>Supply-chain poisoning<\/span><span>Federated learning poisoning<\/span><span>Data validation<\/span><\/div><\/div><div class=\"theme-card\"><h3>Model theft &amp; privacy<\/h3><div class=\"tcon\"><span>Model extraction<\/span><span>Model inversion<\/span><span>Membership inference<\/span><span>Attribute inference<\/span><span>Watermarking<\/span><span>Honeypots<\/span><span>Differential privacy<\/span><\/div><\/div><div class=\"theme-card\"><h3>Defenses &amp; robustness<\/h3><div class=\"tcon\"><span>Adversarial training<\/span><span>Defensive distillation<\/span><span>Gradient masking<\/span><span>Input preprocessing<\/span><span>Randomization<\/span><span>Randomized smoothing<\/span><span>Ensembles<\/span><span>Adversarial-input detection<\/span><span>Robust aggregation<\/span><span>Monitoring &amp; drift<\/span><\/div><\/div><div class=\"theme-card\"><h3>Evaluation, tools &amp; governance<\/h3><div class=\"tcon\"><span>Clean vs robust accuracy<\/span><span>Attack success rate<\/span><span>RobustBench<\/span><span>AutoAttack<\/span><span>Adversarial Robustness Toolbox (ART)<\/span><span>Foolbox<\/span><span>CleverHans<\/span><span>Counterfit<\/span><span>MITRE ATLAS<\/span><span>OWASP ML Top 10<\/span><span>NIST AI RMF<\/span><span>EU AI Act<\/span><span>Model cards &amp; datasheets<\/span><span>Model registry &amp; signing<\/span><span>AI red teaming<\/span><span>Risk register<\/span><span>MLOps pipeline security<\/span><\/div><\/div><\/div><\/div><div class=\"panel\"><h2>What you will learn (plain language)<\/h2><p>Welcome back to the topic. At this tier the exercises combine two connected ideas at a time.<\/p><p>Adversarial Machine Learning studies attacks on models and their defenses. You now know the four families: evasion, poisoning, extraction and inversion. Here you learn to connect them to decisions: which attack is this, and which control answers it.<\/p><p>In real work almost no alert names its attack. A SOC analyst reads a query log and must decide: probing or partner job. A data lead reads an annotation audit and must decide: mistake or label flipping. A release owner reads two accuracy numbers and must decide which model to ship. That connect step is what this tier trains.<\/p><p>You will meet the working tools again: MITRE ATLAS for naming attack stages, robustness testing tools for producing evidence, model registries with signed hashes for integrity, and control catalogues that match controls to attack surfaces.<\/p><p>The risks addressed here are the ones that reach production: poisoned vendor feeds, extraction that hides inside legitimate-looking traffic, privacy leaks through confidence scores, and defenses that look strong but were never tested adaptively.<\/p><p>Read the rules, then start. Two-step reasoning means you should always ask first: what exactly is the scenario telling me, and what does the question really need? The hints narrow your direction; they never give the answer away.<\/p><\/div><div class=\"panel\"><h2>This tier: MEDIUM — combining two ideas<\/h2><p>MEDIUM combines two connected ideas per exercise: identify the technique, then choose the correct control, or compare two artefacts before deciding. Scenarios are longer and options are closer together, but the path is always explainable. Hints narrow the direction without naming the answer.<\/p><\/div><div class=\"panel\"><h2>How scoring works<\/h2><div class=\"rules\"><ul><li>Every exercise is worth <b>100 points<\/b>.<\/li><li>Exercises with exactly one correct answer are all-or-nothing: right means 100, wrong means 0.<\/li><li>Multi-answer exercises give <b>partial credit<\/b>. If you find some of the correct answers, you get some of the points. Wrong picks cancel right picks: points = (correct picks − wrong picks) ÷ total correct picks × 100, never below 0.<\/li><li>The <b>Hint<\/b> button costs 10% of that exercise's points (one hint per exercise). The hint gives you a nudge, never the answer. Using a hint does not pause the timer.<\/li><li>Live score in the header counts only exercises you have actually answered.<\/li><li>You pass with <b>70%<\/b> or more over the answered exercises. Skipped-and-never-answered exercises are excluded from both your points and the total.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Timer rules (two ways the clock stops)<\/h2><div class=\"rules\"><ul><li>You have <b>45 minutes<\/b> in total for all 17 exercises.<\/li><li><b>Manual pause:<\/b> press Pause in the header for a break. The exercise is hidden and the clock stops until you press Resume.<\/li><li><b>Pause after Check:<\/b> when you press Check, the clock stops by itself so you can read the explanation with free time. The exercise and the feedback stay fully visible.<\/li><li>The clock starts again the moment you press Next. Pressing Hint or Skip never pauses the clock.<\/li><li>If time runs out, the exam closes and your score is computed over what you answered.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Skipping and finishing<\/h2><div class=\"rules\"><ul><li>Every exercise has a <b>Skip<\/b> button. Skipping is free and does not reveal the answer.<\/li><li>Before the exam can finish, a <b>Review skipped<\/b> screen lists everything you skipped. You can return to any of it, as many times as you need, while the timer runs.<\/li><li>If you submit while some exercises are still unanswered, those are marked <b>⚠ Not answered — excluded from score<\/b>. They do not help or hurt your percentage.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Exercise types in this exam<\/h2><p>Alert triage cards, log analysis with a filter box, matching attacks to controls, Lp-norm matching, fill-in-the-blank threat models and policy drafting, a runbook ordering, config review (spot the mistake), multi-part terminal work, and multiple choice (a maximum of five).<\/p><p class=\"dim\">Every exercise screen shows the same three blocks, always in the same order: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber), <b>YOUR ANSWER<\/b> (green). Long scenarios can be collapsed with the button in the scenario header; a one-line summary stays visible.<\/p><\/div><div class=\"start-row\"><button class=\"btn primary\" data-act=\"start\">Start the exam<\/button><span class=\"cand\" id=\"cand-name\"><\/span><\/div>","exercises":[{"id":"m01","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"Triage three overnight alerts on the NordShield Bank fraud scoring platform.","scenario":{"intro":["You are the on-call analyst for NordShield Bank's fraud scoring platform (model fraud-v4).","Three alerts are waiting in the queue. For each alert, choose the correct classification and first move.","Background: batch partners run contracted bulk jobs by day; output tiers (label-only vs full probabilities) are set per client."]},"question":"Work through the three alert cards and choose the correct decision for each.","steps":[{"prompt":"ALERT-201: client agent 'nightbatch/1.2' (undocumented) sent 19,000 near-identical feature vectors in 3 hours, requests full probability vectors, retries on 429 with backoff. Classify it and pick the first move.","options":[{"id":"A","text":"Extraction recon — throttle the client, drop it to label-only outputs, open an incident","outcome":"You throttle and open an incident. The near-duplicate probing with full-output requests is a classic extraction setup.","why":"High-volume near-duplicates plus full-probability output is the extraction recon pattern."},{"id":"B","text":"Benign batch job — no action, the partner team will confirm","outcome":"No partner is scheduled at night, and partner jobs never request full probabilities. The queue keeps filling.","why":"There is no contract for this agent and bulk partners do not need full probability vectors."},{"id":"C","text":"Evasion — schedule a retraining run tonight","outcome":"Retraining changes nothing: no mislabeled live input was reported. The probing continues.","why":"Evasion shows up as wrong labels on crafted inputs, not as bulk probing for outputs."},{"id":"D","text":"Inversion — block all card-data endpoints immediately","outcome":"A full block interrupts real customers. The probe targets model outputs, not stored records.","why":"Inversion targets training data reconstruction; the observed pattern is bulk output collection."}],"correct":["A"]},{"prompt":"ALERT-202: the training pipeline ingested 120,000 rows from a new vendor feed. Schema validation was skipped, and the label distribution shifted by 9 percent. Classify it and pick the first move.","options":[{"id":"A","text":"Poisoning risk — quarantine the dataset version and freeze training jobs","outcome":"You quarantine the version. Nothing poisoned reaches a deployed model while the feed is audited.","why":"Unvalidated vendor data with a label shift is a poisoning risk; quarantine stops it before training."},{"id":"B","text":"Normal drift — keep training, watch next week","outcome":"Training finishes on unvalidated data and the shift reaches the model. Cleanup now needs a rollback.","why":"A 9 percent label shift from an unvalidated source is not ordinary drift; it is unverified data entering training."},{"id":"C","text":"Extraction — add rate limits to the training API","outcome":"Rate limits do not help: the risk sits in the pipeline, not at the prediction API.","why":"The data path is the problem, not the serving path."},{"id":"D","text":"No risk — vendor feeds are always trusted","outcome":"The shift reaches production on Friday. Losses rise over the weekend.","why":"Vendor data without validation is exactly how poisoning enters pipelines."}],"correct":["A"]},{"prompt":"ALERT-203: prediction latency rose 12 percent after the nightly retrain. Accuracy is stable. Query logs show no anomaly. Classify it and pick the first move.","options":[{"id":"A","text":"Performance drift — standard capacity monitoring, no security incident","outcome":"You hand it to capacity management. It was a larger feature build in the nightly retrain.","why":"Stable accuracy plus no query anomaly points to engineering, not to an ML attack."},{"id":"B","text":"Extraction — check who is querying","outcome":"Query logs are clean; latency correlates with the nightly retrain package.","why":"Nothing in the logs shows output harvesting; the timing matches the retrain."},{"id":"C","text":"Poisoning — quarantine the dataset","outcome":"Accuracy is stable and the dataset hash matches the registry. Quarantine is not justified here.","why":"Poisoning shows as accuracy or label-distribution changes, not as latency."},{"id":"D","text":"Evasion — add an input filter","outcome":"An input filter does not touch latency and adds cost for no security gain here.","why":"There is no evidence of crafted inputs; filtering would not address latency."}],"correct":["A"]}],"explanation":"Triage combines three skills: reading query patterns (near-duplicates plus full outputs suggests extraction), checking pipeline integrity (unvalidated vendor data is a poisoning risk), and separating engineering issues (latency with stable accuracy) from security incidents. Two of the three alerts needed security response; one was an engineering ticket.","study":"Study ML alert triage: query patterns, pipeline integrity, and benign engineering signals.","hint":"For each alert, first ask which attack family would even produce this signal, and what the cheapest safe first move is."},{"id":"m02","type":"qcm","answerType":"single","theme":"Evasion attacks","summary":"Pick the right attack for a bounded red-team assessment of the imaging model.","scenario":{"intro":["MedScan hires your team to test its X-ray triage model before release.","The assessment rules fix the threat model: white-box access, L-infinity budget 8/255.","The client wants the strongest standard iterative, gradient-based attack for the final report."]},"question":"Which attack do you select for the final robustness numbers?","options":[{"id":"B","text":"FGSM, the fast one-step gradient attack with the same budget"},{"id":"A","text":"PGD, the iterative gradient attack that matches the fixed budget"},{"id":"C","text":"Label flipping, applied to the training annotations offline"},{"id":"D","text":"Model extraction, run against the staging API over many queries"}],"correct":["A"],"explanation":"Two steps: the threat model is white-box with a fixed budget, so you need an evasion attack that uses gradients. FGSM is one-step and often too weak for final numbers; PGD iterates FGSM with projection back into the budget and is the standard strong baseline. Label flipping is a training-time poisoning attack, and extraction does not produce robustness numbers at all.","study":"Compare FGSM and PGD: steps, strength, and when each is used in assessments.","hint":"You need the strongest iterative evasion attack inside a fixed white-box budget."},{"id":"m03","type":"fill","answerType":"multi","theme":"Evasion attacks","summary":"Complete the threat model paragraph for the assessment report.","scenario":{"intro":["You are writing the threat model section of the MedScan assessment report.","Fill both blanks correctly; the reviewer rejects vague threat models."]},"question":"Complete the two blanks from the word bank.","parts":["The attacker knows the architecture and the training recipe but not the weights, so the threat model is ",". Robustness numbers are only comparable when the report also states the "],"blanks":[{"correct":"grey","why":"Knowing architecture but not weights is the standard grey-box setting."},{"correct":"epsilon","why":"Robustness numbers are only meaningful with the budget (epsilon) stated next to them."}],"tokens":["grey","white","black","epsilon","firewall","schema"],"explanation":"Grey-box sits between black-box (outputs only) and white-box (full internals): here the attacker knows architecture and recipe but not weights. The second blank is epsilon, the perturbation budget, because robustness claims without a stated budget cannot be compared or verified.","study":"Study threat model naming and why every robustness number needs its epsilon.","hint":"First blank: what do you call 'some but not all' knowledge? Second blank: the Greek letter that caps input changes."},{"id":"m04","type":"match","answerType":"multi","theme":"Evasion attacks","summary":"Match three perturbation descriptions to their Lp norms.","scenario":{"intro":["The assessment report describes attacks with three different distance measures.","New reviewers confuse them, so your lead asks you to pin the meanings."]},"question":"Drag each description to the norm it defines.","items":[{"id":"i1","text":"Every pixel may shift a little, never more than the same small amount"},{"id":"i2","text":"The total change across the whole image stays small overall"},{"id":"i3","text":"Only a few pixels change, but those change a lot"}],"targets":[{"id":"z1","label":"L-infinity norm","why":"L-infinity caps the single largest per-pixel change; all pixels can move up to that cap."},{"id":"z2","label":"L2 norm","why":"L2 measures the overall size of the change vector across all pixels together."},{"id":"z3","label":"L0 norm","why":"L0 counts how many pixels are allowed to change at all; the rest must stay untouched."}],"solution":{"i1":"z1","i2":"z2","i3":"z3"},"explanation":"Lp norms are the budgets attacks and defenses are measured with. L-infinity bounds the biggest single-pixel change. L2 bounds the total change. L0 bounds the number of changed pixels. The same model can be robust under one norm and weak under another, so reports always name the norm.","study":"Study L0, L2 and L-infinity perturbation models with one example each.","hint":"Read each description twice: one is about the largest single change, one about the total, one about the count of changed pixels."},{"id":"m05","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"Decide what the API gateway log shows and which control comes first.","scenario":{"intro":["NordShield Bank's scoring API serves two clients tonight.","partner-etl is a contracted partner: low volume, label-only outputs.","unknown-7f3a arrives from 10[.]44[.]9[.]187 with no contract on file.","ARTEFACT 1 is the gateway log. Filter by client id to isolate one pattern.","unknown-7f3a's requests arrive in dense near-duplicate clusters (mean L2 0.012) and ask for full probability vectors."],"artifacts":[{"label":"ARTEFACT 1 — API gateway log (filterable)","kind":"log","lines":["2026-09-30 02:14:07 INFO  client=partner-etl  qps=0.8 inputs=distinct:12 outputs=label_only","2026-09-30 02:14:11 WARN  client=unknown-7f3a qps=4.9 inputs=distinct:4731 outputs=full_logits retry=on","2026-09-30 02:14:12 INFO  client=partner-etl  qps=0.8 inputs=distinct:11 outputs=label_only","2026-09-30 02:14:14 WARN  client=unknown-7f3a qps=5.0 inputs=distinct:4790 outputs=full_logits retry=on","2026-09-30 02:14:16 WARN  client=unknown-7f3a status=429 rate_limited retry_after=2.1","2026-09-30 02:14:18 WARN  client=unknown-7f3a qps=5.0 inputs=distinct:4844 outputs=full_logits retry=on","2026-09-30 02:14:20 INFO  client=partner-etl  qps=0.7 inputs=distinct:8  outputs=label_only","2026-09-30 02:14:23 WARN  client=unknown-7f3a qps=5.0 inputs=distinct:4902 outputs=full_logits retry=on","2026-09-30 02:14:25 INFO  client=partner-etl  batch_done total=42 duplicates=high","2026-09-30 02:14:28 WARN  client=unknown-7f3a qps=5.0 inputs=distinct:4955 outputs=full_logits retry=on"]}]},"question":"Decide what is happening and choose the correct first control.","steps":[{"prompt":"Read the log (filter by client id to compare the two patterns), then decide.","options":[{"id":"A","text":"Extraction probing — throttle per client, move responses to label-only tier, open an incident","outcome":"You throttle unknown-7f3a and drop outputs to the label-only tier. The near-duplicate clusters stop making progress and the incident is opened with the log preserved.","why":"Dense near-duplicate inputs plus full-output requests and retry-on-limit is the extraction pattern; throttling and output tiering slow it without breaking the partner."},{"id":"B","text":"Partner misconfiguration — no action, the pattern matches the contract","outcome":"partner-etl keeps its contract pattern; unknown-7f3a keeps harvesting at full speed overnight.","why":"The contract covers partner-etl only; unknown-7f3a has no contract and asks for a higher output tier."},{"id":"C","text":"Evasion attack — start an emergency retraining run","outcome":"Retraining does not touch output harvesting. The probe continues and your model churns for nothing.","why":"No live input was crafted to flip a label; the log shows output collection, not mislabeling."},{"id":"D","text":"Denial of service — block both clients at the firewall","outcome":"The partner's legitimate traffic dies with the attacker's, and the harvesting restarts from a new address later.","why":"Blocking everything is disproportionate and evidence-hostile; the two patterns are clearly different."}],"correct":["A"]}],"explanation":"Two ideas decide this: the traffic pattern (dense near-duplicates, high distinct count, retries) and the response tier (full probability vectors). That combination is extraction probing, not a partner job and not evasion. The correct first control is the least disruptive one that stops progress: per-client throttling plus moving to label-only outputs, while keeping the evidence.","study":"Study query-based extraction patterns and tiered API responses as a defense.","hint":"Compare the two clients in the filter box: input uniqueness, output tier, and what happens after a 429."},{"id":"m06","type":"qcm","answerType":"single","theme":"Defenses & robustness","summary":"The risk committee asks what guarantee randomized smoothing actually gives.","scenario":{"intro":["NordShield Bank's risk committee reads about randomized smoothing in a vendor paper.","One member asks: 'What exactly does this defense promise us?'","Your answer must be precise, because the committee funds controls based on it."]},"question":"Which answer states the guarantee correctly?","options":[{"id":"B","text":"Complete immunity from every adversarial attack, in every setting"},{"id":"C","text":"Faster inference, because the model runs only once per request"},{"id":"A","text":"A certified label guarantee within a stated radius and confidence level"},{"id":"D","text":"Smaller model size, because added noise replaces parameters"}],"correct":["A"],"explanation":"Two steps: smoothing adds random noise and takes a majority vote over many noisy copies, and under conditions on the noise it can certify that the label stays the same within a radius (an L2 radius in the standard method). The certificate holds only inside that radius and at the stated confidence, and it usually costs some clean accuracy. It is not immunity everywhere, and it does not make inference faster or the model smaller.","study":"Study randomized smoothing: the noise-plus-vote idea and the certified radius.","hint":"The word 'certified' in the method's name is the key: what is certified, and where does the promise stop?"},{"id":"m07","type":"sim","answerType":"multi","theme":"Poisoning & supply chain","summary":"Investigate a priority-label anomaly in the ticket routing model's annotation logs.","scenario":{"intro":["The support-ticket routing model at NordShield Bank sends urgent tickets to human agents.","A quarterly audit of the annotation platform shows worker w-2214 changed the priority label on 3.1 percent of tickets during night shifts, all changes pointing toward 'P4-low'.","Several of those tickets later escalated badly.","Two decisions are needed: what happened, and what to do first."]},"question":"Answer both decision cards in order.","steps":[{"prompt":"Decision 1: What best explains the annotation log?","options":[{"id":"A","text":"Label flipping: a targeted poisoning pattern against urgent tickets","outcome":"You treat it as poisoning. The one-directional changes and the escalation pattern support it.","why":"Many consistent one-directional label changes, tied to a single account, form the label flipping pattern."},{"id":"B","text":"Random human error, no security relevance","outcome":"Random errors go in every direction. These all point to 'P4-low', and they cluster on night shifts.","why":"Random mistakes are not one-directional and do not cluster on one account at night."},{"id":"C","text":"Model inversion of the routing model","outcome":"Inversion pulls training data out of a model. Here labels were changed at the source.","why":"The annotation platform is a data source, not a model output."},{"id":"D","text":"Concept drift in ticket categories","outcome":"Drift appears across all workers and both shifts. This pattern is tied to one account.","why":"Drift does not follow a single worker's account and shift schedule."}],"correct":["A"]},{"prompt":"Decision 2: What is the correct first action?","options":[{"id":"A","text":"Quarantine the affected label subset and audit the account against the golden set","outcome":"You quarantine the subset and start the audit. Scope is known before any retraining cost is paid.","why":"Quarantine plus audit sizes the damage with evidence before expensive rebuilds."},{"id":"B","text":"Retrain every routing model tonight on all data","outcome":"Retraining on data that still contains flipped labels would bake the poison in again.","why":"Retraining before cleaning and scoping repeats the poisoning."},{"id":"C","text":"Ignore it until the annual audit","outcome":"More urgent tickets get routed wrong while you wait; the harm keeps growing.","why":"A confirmed poisoning pattern needs response now, not next year."},{"id":"D","text":"Delete the annotation platform immediately","outcome":"Deleting the platform destroys the audit evidence needed to scope the poisoning.","why":"Evidence preservation comes first; the platform is where the proof lives."}],"correct":["A"]}],"explanation":"The log pattern identifies the attack: many one-directional changes by one account at night is label flipping, a poisoning type. The response follows a runbook order: quarantine the affected subset first, audit against a trusted golden set, and only then decide on retraining. Acting in the wrong order either spreads the poison or destroys evidence.","study":"Study label flipping detection and the quarantine-then-audit response order.","hint":"Pattern first: direction and account clustering identify the attack. Then ask which action keeps evidence and stops the damage."},{"id":"m08","type":"match","answerType":"multi","theme":"Defenses & robustness","summary":"Match each attack to the control that addresses it.","scenario":{"intro":["The ML security working group is drafting the control catalogue.","Each control must land next to the attack it actually addresses.","Note: randomized input transforms are part of the evasion story too, alongside preprocessing."]},"question":"Drag each attack to its matching control.","items":[{"id":"i1","text":"Model extraction through the public API"},{"id":"i2","text":"Membership inference against training records"},{"id":"i3","text":"Evasion with tiny input perturbations"},{"id":"i4","text":"Poisoning through unvalidated vendor feeds"}],"targets":[{"id":"z1","label":"Per-client rate limits and output watermarking","why":"Rate limits slow query harvesting; watermarks taint stolen outputs and prove origin."},{"id":"z2","label":"Differential privacy plus least-privilege data access","why":"DP bounds what any single training record can change in the model, and least privilege limits who reaches records."},{"id":"z3","label":"Input validation and preprocessing, supported by adversarial training","why":"Cleaning and constraining inputs removes cheap perturbations; adversarial training hardens the model itself."},{"id":"z4","label":"Data validation, provenance checks and quarantines","why":"Schema, source and distribution checks stop bad feeds before they reach training."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4"},"explanation":"Controls must match the attack surface. Extraction lives at the API, so rate limits and watermarked outputs fight it. Membership inference exploits memorization, so differential privacy and access control reduce it. Evasion rides on crafted inputs, so preprocessing plus adversarial training is the answer. Poisoning enters through data, so validation, provenance and quarantine are the controls.","study":"Study the control catalogue: which control defends which attack surface.","hint":"For each attack ask: where does it enter — the API, the training data, or the model itself?"},{"id":"m09","type":"qcm","answerType":"single","theme":"Model theft & privacy","summary":"A researcher demonstrates membership inference against the clinical model.","scenario":{"intro":["Meridian Health fine-tuned a triage model on patient records from two clinics.","A researcher shows they can guess whether a specific patient record was in the training set with 71 percent success, using only the model's confidence scores from the API.","The risk committee asks which control reduces this risk the most."]},"question":"Which control should the committee fund first?","options":[{"id":"B","text":"Moving the API from public TLS to a private TLS circuit"},{"id":"C","text":"Doubling the GPU count for faster retraining runs"},{"id":"D","text":"Publishing the model weights openly to increase transparency"},{"id":"A","text":"Differential privacy in fine-tuning, plus less confidence detail"}],"correct":["A"],"explanation":"Two steps: the attack works because the model memorizes training records and the API exposes confidence scores. Differential privacy limits how much any single record can influence the model, and reducing confidence detail removes the attacker's signal. Transport encryption does not change what the answers reveal, GPUs change speed only, and publishing weights hands the attacker white-box access.","study":"Study membership inference and how differential privacy reduces memorization.","hint":"The attacker uses only the answers. Which control changes what the answers reveal, and how much one record matters?"},{"id":"m10","type":"spot","answerType":"multi","theme":"Defenses & robustness","summary":"Two lines in the defense config create a false sense of security.","scenario":{"intro":["You review the defense summary of the imaging classifier v2 before sign-off.","The team applied logit squeezing (a gradient masking technique) and evaluated it.","Click every line that creates a false sense of security."]},"question":"Click every line that creates a false sense of security.","artifact":{"kind":"lines","idPrefix":"l","lines":["# defense summary - imaging classifier v2","technique: gradient_masking (logit_squeeze_0.9)","assumption: attackers cannot estimate gradients, so the model is safe","clean_eval: 98.9_percent","robust_eval: fgsm_only_and_pgd_eps_8_of_255","adaptive_eval: none_planned"]},"correctIds":["l3","l6"],"lineWhy":{"l3":"Gradient masking does not remove the attack surface: transfer attacks and adaptive attacks bypass it, so 'cannot estimate gradients' is a false assumption.","l6":"Without adaptive evaluation you cannot know how the defense behaves against a real attacker; skipping it hides the true robustness.","l1":"A comment line. Nothing wrong here.","l2":"Stating the technique precisely is good practice, even when the technique has limits.","l4":"Reporting clean accuracy is useful context, and it is honestly labelled as clean.","l5":"FGSM-only plus PGD at the stated budget is a reasonable basic evaluation; it is not the mistake here."},"explanation":"Two lines are dangerous. The assumption that attackers 'cannot estimate gradients' is false: attackers use transferred examples from a surrogate model or adapt the attack to see through the masking (the known weakness of gradient masking). And with no adaptive evaluation planned, nobody will ever test that weakness. A defense is only as good as the evaluation that tries to break it.","study":"Study why gradient masking fails and what an adaptive evaluation adds.","hint":"One line is a claim about what attackers cannot do; the other is about what you never tested."},{"id":"m11","type":"qcm","answerType":"single","theme":"Evaluation, tools & governance","summary":"Choose between two models with different clean and robust accuracy.","scenario":{"intro":["Two candidate models are ready for the hostile public-facing deployment.","Model A: clean accuracy 99.1 percent, robust accuracy under PGD (8/255) 41 percent.","Model B: clean accuracy 96.3 percent, robust accuracy under PGD (8/255) 78 percent.","The deployment faces a documented adversarial threat."]},"question":"Which model do you ship, and why?","options":[{"id":"B","text":"Model A, because clean accuracy is the metric that matters everywhere"},{"id":"C","text":"Model B, because its training run finished more recently than A's"},{"id":"A","text":"Model B, because it keeps most accuracy under the matching attack"},{"id":"D","text":"Model A, because robust numbers stay optional for releases"}],"correct":["A"],"explanation":"Two steps: the threat is adversarial, so the deciding metric is robust accuracy under the matching attack and budget. Model B gives up 2.8 points of clean accuracy to gain 37 points of robust accuracy. Shipping A would mean the model works beautifully until someone attacks it. Release dates and optional metrics do not change the maths.","study":"Study the clean-versus-robust accuracy trade-off and how to present it to owners.","hint":"Read the threat model first: which accuracy number describes the world this model will actually live in?"},{"id":"m12","type":"order","answerType":"multi","theme":"Poisoning & supply chain","summary":"Order the four steps of the poisoning response runbook.","scenario":{"intro":["A vendor feed with suspicious labels reached the staging pipeline.","Your lead pins the runbook order on the wall, but the cards arrived shuffled.","Put the four response steps in the correct order."]},"question":"Drag the four steps into the runbook order.","entries":[{"id":"s1","text":"Quarantine the current dataset version and freeze training jobs"},{"id":"s2","text":"Audit labels and sources against the golden validation set"},{"id":"s3","text":"Retrain on cleaned, verified data"},{"id":"s4","text":"Re-run accuracy and robustness checks before redeployment"}],"correctOrder":["s1","s2","s3","s4"],"explanation":"Response follows containment, investigation, rebuild, verification. Quarantining stops more poisoned data from entering training. The audit sizes the damage with evidence. Retraining on cleaned data rebuilds the model. Final checks confirm the fix before customers see it. Retraining before the audit would rebuild on data you have not cleaned.","study":"Memorise the incident order: contain, investigate, rebuild, verify.","hint":"You cannot clean what you have not scoped, and you cannot scope what is still changing."},{"id":"m13","type":"fill","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Complete two sentences of the ML security release policy.","scenario":{"intro":["You draft the release policy for the MLOps pipeline that ships every production model.","The legal team insists on plain, exact wording.","Fill both blanks from the word bank; two words are traps."]},"question":"Complete the policy text with the correct terms.","parts":["Before any production release, the model owner must complete a written ",". The model registry must store a "," of every artifact, and deploy jobs must verify it against the signed registry entry."],"blanks":[{"correct":"threat model","why":"A written threat model states who attacks what, through which surface, before release."},{"correct":"hash","why":"The registry stores an artifact hash (with a signature) so deploy jobs can verify integrity."}],"tokens":["threat model","hash","marketing plan","longer training run","firewall rule"],"explanation":"A written threat model is the release gate that names attacker capabilities and surfaces. The registry stores a hash of every artifact, and the signature on the registry entry makes the check trustworthy at deploy time. Marketing plans, training runs and firewall rules are real documents, but they do not belong in these two sentences.","study":"Study MLOps pipeline security: release gates, threat model documents and signed artifact hashes in a model registry.","hint":"First blank: the document that names the attackers and the surfaces. Second blank: the fingerprint of the artifact."},{"id":"m14","type":"terminal","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Run the FGSM robustness evaluation and write the report file.","scenario":{"intro":["Your assessment VM has the team's evaluation tool: fgsm_eval.","You know the tool. Work out the options yourself.","Goal: evaluate model fraud_v3 with FGSM at epsilon 0.05, and write the JSON report to report.json.","Intent hint: the report must end up in a file, not on the console."]},"question":"Type and run the command that does the evaluation and saves report.json.","terminal":{"title":"analyst@assessment-vm: ~ — simulated shell","prompt":"$","motd":["assessment-vm (simulated shell).","Tool present: fgsm_eval 2.4","Type a command and press Enter. Nothing real is executed."],"objective":"Tool: fgsm_eval. Target: model fraud_v3. Attack: FGSM. Budget: 0.05. Output: report.json.","accept":[{"find":"fraud_v3","output":["Model: fraud_v3","Attack: FGSM eps=0.050","Robust accuracy: 76.4%","Report written: report.json"]}],"canonical":"fgsm_eval --model fraud_v3 --eps 0.05 --out report.json","canonicalParts":["fgsm_eval — the evaluation tool","--model fraud_v3 — the model under assessment","--eps 0.05 — the L-infinity budget for the attack","--out report.json — writes the JSON report to the required file"],"dangerNote":"Forgetting --out leaves the report on the console: the assessor cannot file it, and the release gate fails on missing evidence."},"checks":[{"label":"calls the evaluation tool fgsm_eval","find":"fgsm_eval","ok":true},{"label":"targets model fraud_v3","find":"fraud_v3","ok":true},{"label":"sets the budget to 0.05","re":"eps\\s*0\\.05(\\D|$)","ok":true},{"label":"writes the report to report.json","re":"out\\s+report\\.json","ok":true},{"label":"uses an unrealistic budget (eps 5)","re":"eps\\s*5(\\D|$)","ok":false,"why":"eps 5 allows enormous changes and would invalidate the assessment."}],"explanation":"Four elements must be correct at once: the tool, the model, the budget and the output file. The budget 0.05 matches the assessment plan. The --out flag writes the JSON evidence file the release gate requires. Each element is graded separately, so a nearly complete command still earns partial credit.","study":"Practise mapping an objective onto tool, model, options and output path.","hint":"You need four parts: tool, model, budget, and the flag that sends the report into a file."},{"id":"m15","type":"qcm","answerType":"single","theme":"Evasion attacks","summary":"A vendor claims attacks on their surrogate model cannot touch your model.","scenario":{"intro":["A security vendor demonstrates an attack on a surrogate model that imitates your public fraud API.","Their slide says: 'Attacks on the surrogate do not affect your model, because we never touched it.'","Your CISO asks whether the claim is true."]},"question":"Why does transferability make this claim wrong?","options":[{"id":"B","text":"Transferability only matters when both models share identical weights"},{"id":"C","text":"Transferability means that models copy their weights between servers"},{"id":"D","text":"Transferability only changes training data, never the live inputs"},{"id":"A","text":"Adversarial inputs crafted on a surrogate often fool the original model too"}],"correct":["A"],"explanation":"Two steps: in a black-box setting attackers build a surrogate from query answers, and adversarial examples crafted on the surrogate often transfer to the target model because models learn similar decision boundaries. So surrogate attacks are a direct risk even without touching the original weights. Identical weights are not needed, models do not copy themselves, and transferability is about inputs, not training data.","study":"Study transferability and the surrogate-model attack path in black-box settings.","hint":"The surrogate exists precisely because attacks made on it still work somewhere else."},{"id":"m16","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"A contractor account pulled 1.2 million labeled samples overnight.","scenario":{"intro":["Dataset API audit log, NordShield Bank: account svc-annotation-09 (a contractor) read 1.2 million labeled samples between 01:00 and 04:00.","The account normally reads about 2,000 samples per day.","Ticket DS-3312 exists for a 'training refresh' with an approved scope of 50,000 samples.","The model serving API was not touched."]},"question":"Classify the event and choose the first action.","steps":[{"prompt":"Decision 1: What is this event?","options":[{"id":"A","text":"Dataset exfiltration by an insider credential, 24 times beyond the approved scope","outcome":"You classify it as insider dataset theft: the volume and the scope mismatch carry the decision.","why":"A trusted credential used far beyond its approved scope is exfiltration until proven otherwise."},{"id":"B","text":"The approved training refresh, nothing unusual","outcome":"The approved scope was 50,000 samples. 1.2 million is 24 times that, at night.","why":"The approved ticket contradicts the volume; 'approved' does not cover 1.2M."},{"id":"C","text":"Model extraction through the prediction API","outcome":"The prediction API was untouched; the dataset API is where the volume went.","why":"Extraction harvests model outputs; here the training data itself was pulled."},{"id":"D","text":"Model inversion by an external attacker","outcome":"Inversion reconstructs training data from model outputs. No model outputs were involved.","why":"The samples came straight from the dataset API, not from model answers."}],"correct":["A"]},{"prompt":"Decision 2: What do you do first?","options":[{"id":"A","text":"Revoke the token, preserve the audit logs, open an incident citing the scope evidence","outcome":"The token dies, the logs are exported to the case, and the scope mismatch becomes exhibit one.","why":"Cutting access stops the loss; preserving logs keeps the evidence the investigation needs."},{"id":"B","text":"Extend the ticket scope and move on","outcome":"The scope is quietly widened after the fact and the audit trail now protects nobody.","why":"Retroactive scope changes destroy accountability and hide a possible theft."},{"id":"C","text":"Delete the account and its logs to contain the damage","outcome":"Containment happens, but the evidence needed for HR and legal disappears with the logs.","why":"Deleting evidence during an incident is self-sabotage."},{"id":"D","text":"Email the contractor and wait for a reply","outcome":"Twelve hours pass. The data may already be outside; nothing is contained.","why":"Waiting leaves an active credential with a copy of the dataset."}],"correct":["A"]}],"explanation":"The classification comes from the conflict between the approved scope (50,000) and the observed volume (1.2 million overnight). The first action must both stop the loss and keep the evidence: revoke the credential, preserve the audit logs, and open the incident with the scope evidence attached. Deleting logs or waiting turns a containable incident into an unprovable one.","study":"Study insider dataset exfiltration and the contain-and-preserve first move.","hint":"The approved ticket is the key conflict: what was allowed, and what actually happened?"},{"id":"m17","type":"match","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Map three alert names to their MITRE ATLAS tactic meanings.","scenario":{"intro":["Your team maps ML alerts to MITRE ATLAS tactics so reports speak one language.","Match each tactic to its plain meaning."]},"question":"Drag each tactic to its meaning.","items":[{"id":"i1","text":"ML Model Access"},{"id":"i2","text":"ML Attack Staging"},{"id":"i3","text":"Exfiltration"}],"targets":[{"id":"z1","label":"How the attacker reaches the model, for example a public API","why":"ML Model Access covers the channels through which the adversary reaches the model: APIs, endpoints, or internal services."},{"id":"z2","label":"Preparing attack data, tools and surrogate models before striking","why":"ML Attack Staging covers building machine learning attack artifacts: poisoning sets, surrogates, crafted payloads."},{"id":"z3","label":"Getting stolen models, data or outputs out of the environment","why":"Exfiltration covers moving stolen artifacts out; in ML this often looks like bulk output collection."}],"solution":{"i1":"z1","i2":"z2","i3":"z3"},"explanation":"ATLAS tactics describe stages of an attack on an ML system. ML Model Access is the entry channel to the model. ML Attack Staging is the preparation work: surrogate training, poisoning sets, crafted inputs. Exfiltration is moving stolen value out. Mapping alerts to tactics turns scattered events into a named attack chain your whole team understands.","study":"Skim the MITRE ATLAS tactic list and place one real alert on it.","hint":"Think in attack order: reach the model, prepare the attack, carry the loot out."}]};

'use strict';
var DATA = window.EXAM_DATA || {};
var META = DATA.meta || {};
var EXS = DATA.exercises || [];
var SEVINFO = {
  'easy':{label:'EASY',cls:'sev-easy'},
  'medium':{label:'MEDIUM',cls:'sev-medium'},
  'hard':{label:'HARD',cls:'sev-hard'},
  'extremely-hard':{label:'EXTREMELY HARD',cls:'sev-extreme'}
};
var SEV = SEVINFO[META.difficulty] || SEVINFO.easy;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function byId(i){return document.getElementById(i);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtPts(p){var v=Math.round(p*10)/10;return (v%1===0)?String(v):v.toFixed(1);}
function fmtTime(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function normCmd(s){return String(s||'').toLowerCase().replace(/=/g,' ').replace(/-{3,}/g,'--').replace(/\s+/g,' ').trim();}
function findId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}

var S = {
  view:'intro', order:[], cur:0,
  answers:{}, graded:{}, skipped:{}, checked:{}, hintUsed:{},
  running:false, manualPause:false, autoPause:false,
  remaining:(META.timerSeconds||1800), reported:false, fromReview:false,
  pres:{}, exDeadline:null, warned:false, candidate:''
};
/* selection state for click-to-place widgets (match items / fill tokens) */
var SEL = { item:null, token:null };
function resetSel(){ SEL.item=null; SEL.token=null; }

/* ---------------- presentation shuffles (rebuilt per attempt) ---------------- */
function buildPres(i){
  var ex=EXS[i], p={};
  if(ex.type==='qcm'||ex.type==='multi'){ p.optOrder=shuffle(ex.options.map(function(o){return o.id;})); }
  if(ex.type==='match'){ p.itemOrder=shuffle(ex.items.map(function(it){return it.id;})); p.zoneOrder=ex.targets.map(function(z){return z.id;}); }
  if(ex.type==='order'){
    var eo=shuffle(ex.entries.map(function(e){return e.id;}));
    var same=ex.correctOrder.every(function(v,k){return eo[k]===v;});
    if(same && eo.length>1){ eo.push(eo.shift()); }
    p.entryOrder=eo;
  }
  if(ex.type==='fill'){ p.tokenOrder=shuffle(ex.tokens.slice()); }
  S.pres[i]=p;
}

/* ---------------- timer ---------------- */
function timerModeLabel(){
  if(S.manualPause) return '\u23f8 paused by you';
  if(S.autoPause) return '\u23f8 paused \u2014 review your feedback';
  return '\u25b6 running';
}
setInterval(function(){
  if(S.view!=='exam' && S.view!=='review') return;
  if(S.running && !S.manualPause && !S.autoPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; updateHead(); finishExam(true); return; }
    updateHead();
    if(S.exDeadline && !S.exOver){
      var left=Math.ceil((S.exDeadline-Date.now())/1000);
      var chip=byId('ex-timer-chip');
      if(chip){
        if(left>0){ chip.textContent='\u23f1 recommended time left: '+fmtTime(left); chip.classList.remove('late'); }
        else { chip.textContent='\u23f1 recommended time passed \u2014 the exam timer continues'; chip.classList.add('late'); }
      }
    }
  }
},1000);

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pres={};
  S.order.forEach(function(i){ buildPres(i); });
  S.cur=0; S.view='exam'; S.running=true; S.manualPause=false; S.autoPause=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.answers={}; S.graded={}; S.skipped={}; S.checked={}; S.hintUsed={};
  S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function curExIdx(){ return S.order[S.cur]; }
function curEx(){ return EXS[curExIdx()]; }

function ensureAnswer(exIdx){
  var ex=EXS[exIdx], a=S.answers[ex.id];
  if(a===undefined){
    if(ex.type==='multi') a=[];
    else if(ex.type==='match') a={};
    else if(ex.type==='order') a=S.pres[exIdx].entryOrder.slice();
    else if(ex.type==='fill') a={};
    else if(ex.type==='spot') a=[];
    else if(ex.type==='sim') a={};
    else if(ex.type==='num'||ex.type==='terminal') a='';
    else a=null;
    S.answers[ex.id]=a;
  }
  return a;
}
function answerReady(ex){
  var a=S.answers[ex.id];
  if(a===undefined||a===null) return false;
  switch(ex.type){
    case 'qcm': return a!==null;
    case 'multi': return a.length>0;
    case 'match': return Object.keys(a).length>0;
    case 'order': return true;
    case 'fill': return Object.keys(a).length>0;
    case 'spot': return a.length>0;
    case 'sim': return Object.keys(a).length===ex.steps.length;
    case 'num': return String(a).trim()!=='';
    case 'terminal': return String(a).trim()!=='';
  }
  return false;
}

function checkAnswer(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.checked[ex.id]) return;
  if(!answerReady(ex)){ S.warned=true; render(); return; }
  S.warned=false;
  S.graded[ex.id]=gradeEx(ex,exIdx);
  S.checked[ex.id]=true;
  S.autoPause=true;              /* auto-pause on Check: feedback stays readable */
  S.manualPause=false;           /* manual pause released if it was somehow set */
  render();
}
function useHint(){
  var ex=curEx();
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  render();
}
function skipCurrent(){
  var ex=curEx();
  if(!S.checked[ex.id]){ S.skipped[ex.id]=true; }
  goNext();
}
function goNext(){
  S.warned=false; S.autoPause=false; S.fromReview=false;
  S.exDeadline=null; S.exOver=false;
  if(S.cur>=S.order.length-1){ endFlow(); } else { S.cur++; render(); }
}
function endFlow(){
  var unanswered=S.order.filter(function(i){ var ex=EXS[i]; return !S.graded[ex.id]; });
  if(unanswered.length>0){ S.view='review'; render(); }
  else { finishExam(false); }
}
function finishExam(timedOut){
  S.running=false; S.autoPause=false; S.manualPause=false; S.timedOut=!!timedOut;
  S.view='results'; S.exDeadline=null; S.exOver=true;
  render();
  reportScore();
}
function retakeExam(){
  S.view='intro'; S.order=[]; S.cur=0; S.answers={}; S.graded={}; S.skipped={}; S.checked={};
  S.hintUsed={}; S.manualPause=false; S.autoPause=false; S.running=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.pres={}; S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function returnToSkipped(exIdx){
  S.cur=exIdx; S.fromReview=true; S.view='exam';
  S.autoPause=false; S.manualPause=false;
  render();
}

/* ---------------- grading ---------------- */
function gradeEx(ex,exIdx){
  var a=S.answers[ex.id];
  var T=1,C=0,W=0;
  var right=[],wrong=[],missed=[];
  function addItem(list,label,why){ list.push({label:label,why:why||''}); }

  if(ex.type==='qcm'){
    T=1;
    var ok=ex.correct.indexOf(a)>=0;
    if(ok){ C=1; addItem(right,optText(ex,a),optWhy(ex,a)); }
    else { W=1; addItem(wrong,optText(ex,a),optWhy(ex,a)); addItem(missed,correctText(ex),''); }
  }
  else if(ex.type==='multi'){
    T=ex.correct.length;
    ex.correct.forEach(function(cid){
      if(a.indexOf(cid)>=0){ C++; addItem(right,optText(ex,cid),optWhy(ex,cid)); }
      else { addItem(missed,optText(ex,cid),optWhy(ex,cid)); }
    });
    a.forEach(function(oid){
      if(ex.correct.indexOf(oid)<0){ W++; addItem(wrong,optText(ex,oid),optWhy(ex,oid)); }
    });
  }
  else if(ex.type==='match'){
    T=ex.items.length;
    ex.items.forEach(function(it){
      var zid=a[it.id], sol=ex.solution[it.id];
      var zObj=zid?findId(ex.targets,zid):null, sObj=findId(ex.targets,sol);
      if(zid===sol){ C++; addItem(right,it.text+' \u2192 '+sObj.label,(zObj&&zObj.why)||''); }
      else {
        var line=it.text+' \u2192 '+(zObj?zObj.label:'(no answer)')+' \u2014 correct: '+sObj.label;
        if(zid){ W++; addItem(wrong,line,(zObj&&zObj.why)||('Not the right match for this scenario.')); }
        else { addItem(missed,line,sObj.why||''); }
      }
    });
  }
  else if(ex.type==='order'){
    T=ex.entries.length;
    ex.entries.forEach(function(en,k){
      var placed=a[k], sol=ex.correctOrder[k];
      var pEn=findId(ex.entries,placed), sEn=findId(ex.entries,sol);
      if(placed===sol){ C++; addItem(right,(k+1)+'. '+sEn.text,''); }
      else {
        var line='Position '+(k+1)+': you placed "'+pEn.text+'", correct is "'+sEn.text+'"';
        W++; addItem(wrong,line,'');
      }
    });
  }
  else if(ex.type==='fill'){
    T=ex.blanks.length;
    ex.blanks.forEach(function(b,k){
      var got=a[k];
      if(got && (got===b.correct || (b.alt&&b.alt.indexOf(got)>=0))){
        C++; addItem(right,'Blank '+(k+1)+': "'+got+'" is correct.',b.why||'');
      } else {
        var line='Blank '+(k+1)+': you wrote "'+(got||'(empty)')+'", correct is "'+b.correct+'"';
        if(got){ W++; addItem(wrong,line,b.whyWrong||''); }
        else { addItem(missed,line,b.why||''); }
      }
    });
  }
  else if(ex.type==='spot'){
    T=ex.correctIds.length;
    ex.correctIds.forEach(function(lid){
      if(a.indexOf(lid)>=0){ C++; addItem(right,lineText(ex,lid),lineWhy(ex,lid)); }
      else { addItem(missed,lineText(ex,lid),lineWhy(ex,lid)); }
    });
    a.forEach(function(lid){
      if(ex.correctIds.indexOf(lid)<0){ W++; addItem(wrong,lineText(ex,lid),lineWhy(ex,lid)); }
    });
  }
  else if(ex.type==='sim'){
    T=ex.steps.length;
    ex.steps.forEach(function(st,k){
      var got=a[k];
      var okOpt=st.correct.indexOf(got)>=0;
      var gOpt=got?findId(st.options,got):null;
      var cOpt=findId(st.options,st.correct[0]);
      if(okOpt){ C++; addItem(right,'Step '+(k+1)+': '+cOpt.text,(gOpt&&gOpt.why)||''); }
      else {
        var line='Step '+(k+1)+': you chose "'+(gOpt?gOpt.text:'(no answer)')+'", better: "'+cOpt.text+'"';
        if(got){ W++; addItem(wrong,line,(gOpt&&gOpt.why)||''); }
        else { addItem(missed,line,cOpt.why||''); }
      }
    });
  }
  else if(ex.type==='num'){
    T=1;
    var v=parseFloat(String(a).replace(',','.'));
    var okNum=!isNaN(v)&&Math.abs(v-ex.value)<=ex.tolerance;
    if(okNum){ C=1; addItem(right,'Your value: '+v+(ex.unit?' '+ex.unit:''),ex.whyNum||''); }
    else { W=1; addItem(wrong,'Your value: '+String(a),'The correct value is '+ex.value+(ex.unit?' '+ex.unit:'')+'.'); }
  }
  else if(ex.type==='terminal'){
    var cmd=normCmd(a);
    T=0;
    function hit(ch){
      if(ch.re){ try{ return new RegExp(ch.re).test(cmd); }catch(e){ return false; } }
      return cmd.indexOf(ch.find)>=0;
    }
    (ex.checks||[]).forEach(function(ch){
      if(ch.ok){ T++; if(hit(ch)){ C++; addItem(right,ch.label,''); } else { addItem(missed,ch.label,ch.why||''); } }
      else { if(hit(ch)){ W++; addItem(wrong,ch.label,ch.why||''); } }
    });
    if(T===0){ T=1; }
  }

  var pts=Math.max(0,Math.floor((C-W)/T*100));
  if(pts>100) pts=100;
  if(S.hintUsed[ex.id]) pts=pts*0.9;
  return {pts:pts,T:T,C:C,W:W,right:right,wrong:wrong,missed:missed,raw:{C:C,W:W,T:T}};
}
function optText(ex,oid){ var o=findId(ex.options,oid); return o?o.text:String(oid); }
function optWhy(ex,oid){ var o=findId(ex.options,oid); return (o&&o.why)?o.why:''; }

/* ---------------- live score ---------------- */
function scoreNow(){

  S.order.forEach(function(i){ var ex=EXS[i],g=S.graded[ex.id]; if(g){ n++; earned+=g.pts; possible+=100; } });

/* ---------------- site integration ---------------- */
function reportScore(){
  if(S.reported) return;
  var s=scoreNow();
  if(s.possible<=0) return;
  var score=Math.round(s.earned*10), total=s.possible*10;
  var percent=Math.round(score/total*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score:score, total:total, percent:percent, passed:percent>=META.passMark

  }catch(e){ /* opened directly, nothing to report to */ }

}

function hi(s){
  var out='', re=/(\/\/[^\s]+|\b(?:INFO|WARN|ERROR|DEBUG|FAILED|ERRORS|DENIED|ALLOWED|BLOCKED|ALERT|CRITICAL)\b|\b\d{2}:\d{2}:\d{2}\b|\d{1,3}(?:\[\.\]){3}\d{1,3}|hxxps?:\/\/\S+|\b\d+(?:\.\d+)?%?\b)/g;
  var last=0,m;
  while((m=re.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    var t=m[0], cls='t-num';
    if(/^\/\//.test(t)) cls='t-ip';
    else if(t==='INFO'||t==='DEBUG'||t==='ALLOWED') cls='t-info';
    else if(t==='WARN') cls='t-warn';
    else if(t==='ERROR'||t==='FAILED'||t==='DENIED'||t==='BLOCKED'||t==='ALERT'||t==='CRITICAL'||t==='ERRORS') cls='t-bad';
    else if(/^\d{2}:\d{2}:\d{2}$/.test(t)) cls='t-time';
    else if(/^\/\//.test(t)||t.indexOf('[') >=0 ||t.indexOf('hxxp')===0) cls='t-ip';
    out+='<span class="'+cls+'">'+esc(t)+'</span>';
    last=m.index+t.length;
  }
  out+=esc(s.slice(last));
  return out;
}
