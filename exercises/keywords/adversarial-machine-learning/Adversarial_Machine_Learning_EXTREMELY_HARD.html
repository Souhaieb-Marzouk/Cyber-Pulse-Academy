<style>

  --bg:#0b1220; --bg2:#0d1526; --panel:#121c33; --panel2:#0f1930; --ink:#0a1120;

  --q:#f5a524; --qbg:#241d0b;

  --sev-easy:#37c26e; --sev-medium:#f5a524; --sev-hard:#f97316; --sev-extreme:#f0564a;
  --focus:#8ec2ff;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);
  font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;}
#app{max-width:1060px;margin:0 auto;padding:0 16px 64px}
code,pre,.mono{font-family:var(--mono)}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--focus)}

/* ---------- persistent exam header ---------- */
.xhead{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 4px;margin:0 -16px 18px;padding-left:16px;padding-right:16px}
.xh-count{font-weight:700;white-space:nowrap}
.sev-badge{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.06em;

.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(55,194,110,.10)}
.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(245,165,36,.10)}
.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(249,115,22,.10)}
.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(240,86,74,.12)}
.xh-mid{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.xh-row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.xh-timer{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap}
.xh-timer .mode{color:var(--muted);font-weight:600;font-size:13px}
.xh-score{font-family:var(--mono);font-size:15px;color:var(--muted);white-space:nowrap}
.xh-progress{height:6px;background:#1a2646;border-radius:99px;overflow:hidden}
.xh-progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#37c26e);transition:width .4s ease}
.xh-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#172441;color:var(--text);
  cursor:pointer;font-weight:600;transition:transform .08s ease,background .15s ease}
.btn:hover{background:#1d2d52}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2f6fed,#37c26e);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--q);color:var(--q)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.blank:focus-visible,.token:focus-visible,.m-item:focus-visible,
.m-zone:focus-visible,.cl:focus-visible,.ord-btn button:focus-visible,.mini:focus-visible,input:focus-visible{

.mini{min-height:44px;min-width:44px;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

/* ---------- intro ---------- */
.hero{padding:26px 4px 8px}
.hero .kicker{color:var(--focus);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.hero h1{margin:6px 0 10px;font-size:32px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:999px;

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.panel h2{margin:0 0 10px;font-size:19px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--focus)}
.panel p{margin:8px 0;color:var(--text)}
.panel .dim{color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.theme-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.theme-card h3{margin:0 0 8px;font-size:15px;color:var(--focus)}
.tcon{display:flex;flex-wrap:wrap;gap:6px}

.rules li{margin:6px 0}
.rules ul{padding-left:22px;margin:6px 0}
.start-row{display:flex;gap:14px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.cand{color:var(--muted);font-size:14px}
.note{border-left:3px solid var(--q);background:var(--qbg);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.note.blue{border-left-color:var(--scen);background:var(--scenbg)}
.note.green{border-left-color:var(--ans);background:var(--ansbg)}

/* ---------- exercise layout: three blocks ---------- */
.card{margin:0 0 26px}
.block{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:800;letter-spacing:.08em;
  font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.block-head .mini{margin-left:auto;text-transform:none;letter-spacing:0}
.block.scen{border-left:4px solid var(--scen)}
.block.scen .block-head{color:var(--scen);background:var(--scenbg)}
.block.q{border-left:4px solid var(--q)}
.block.q .block-head{color:var(--q);background:var(--qbg)}
.block.ans{border-left:4px solid var(--ans)}
.block.ans .block-head{color:var(--ans);background:var(--ansbg)}
.block-body{padding:14px 16px}
.scen-collapsed .scen-extra{display:none}
.scen-summary{margin:2px 0 8px;color:var(--focus);font-weight:600}
.scen-extra p{margin:8px 0}
.artefact{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);margin:12px 0;overflow:hidden}
.artefact .af-label{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;font-weight:800;

.artefact .af-body{padding:10px 12px}
.artefact p{margin:8px 0}
.q-text{margin:6px 0 2px}
.q-text strong{font-size:17px}

/* monospace log/code rendering */
.logtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.logtools input{flex:1;background:#0a1224;border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:9px 12px;min-height:44px;font-family:var(--mono);font-size:14px}
.logtools .cnt{color:var(--faint);font-size:12.5px;white-space:nowrap}
pre.mono,div.mlog{background:#0a1224;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6;margin:0}
div.mlog .ln-row{display:block;white-space:pre-wrap}
code .t-info{color:#7dd3fc}code .t-warn{color:#fbbf24}code .t-bad{color:#f87171}
code .t-num{color:#c4b5fd}code .t-ip{color:#6ee7b7}code .t-time{color:#94a3b8}code .t-str{color:#fca5a5}
table.arttab{border-collapse:collapse;width:100%;font-size:14.5px}
table.arttab th,table.arttab td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.arttab th{background:#0e1834;color:var(--focus);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
table.arttab td.num{font-family:var(--mono)}
.chatline{margin:8px 0;padding:8px 12px;border-radius:10px;background:#16224a;border:1px solid var(--line)}
.chatline .who{font-weight:700;color:var(--focus);font-size:13.5px;margin-right:8px}

/* ---------- answer widgets ---------- */
.widget{padding:14px 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 14px;
  border-radius:10px;border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer}
.opt:hover{background:#182748}
.opt.sel{border-color:var(--focus);background:#1a2c56}
.opt.lock{cursor:default}
.opt .lab{font-weight:800;color:var(--focus);min-width:26px}
.multi-note{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.match-grid{grid-template-columns:1fr}}
.m-item{display:block;width:100%;text-align:left;min-height:48px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer;margin:8px 0}
.m-item.sel{border-color:var(--focus);background:#1a2c56}
.m-item.used{opacity:.55}
.m-zone{border:1.5px dashed var(--line2);border-radius:12px;padding:10px 12px;min-height:64px;margin:8px 0;
  background:#0e1834;cursor:pointer}
.m-zone.over{border-color:var(--focus)}
.mz-label{font-weight:700;color:var(--focus);font-size:14px;margin-bottom:6px}
.mz-chip{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#1a2c56;
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin:6px 0}
.mz-chip button{background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:15px;min-width:44px;min-height:44px}
.ord{list-style:none;margin:0;padding:0}
.ord-item{display:flex;gap:10px;align-items:center;background:#131f3d;border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin:8px 0;cursor:grab}
.ord-item.dragging{opacity:.5}
.ord-item .pos{font-family:var(--mono);font-weight:800;color:var(--focus);min-width:24px}
.ord-item .txt{flex:1}
.ord-item.drop-into{border-color:var(--focus);border-style:dashed}
.ord-btn{display:flex;gap:4px}
.ord-btn button{background:#0e1834;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  min-width:44px;min-height:44px;cursor:pointer;font-size:15px}
.fill-sent{line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border-radius:8px;border:1.5px dashed var(--line2);
  background:#0e1834;color:var(--text);padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:14.5px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--ans);background:var(--ansbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.token{background:#16244a;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;min-height:44px;
  color:var(--text);cursor:pointer;font-family:var(--mono);font-size:14.5px}
.token.sel{border-color:var(--focus);background:#1a2c56}
.code-lines{display:flex;flex-direction:column;gap:4px}
.cl{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0a1224;border:1px solid transparent;
  border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);font-family:var(--mono);font-size:14.5px;min-height:44px}
.cl:hover{border-color:var(--line2)}
.cl.flag{border-color:var(--q);background:#241d0b}
.cl .ln{color:var(--faint);min-width:26px}
.cl.flag .ln{color:var(--q)}
.cl code{white-space:pre-wrap}
.numwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numwrap input{background:#0a1224;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  padding:10px 12px;min-height:44px;font-family:var(--mono);font-size:15.5px;width:150px}
.numwrap .unit{color:var(--muted)}
.sim-step{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:10px 0}
.sim-step .ss-head{font-weight:800;color:var(--q);letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin-bottom:6px}
.sim-step .outcome{margin:10px 0 2px;padding:9px 12px;border-left:3px solid var(--line2);background:#0c1428;
  border-radius:0 8px 8px 0;color:var(--muted)}
.sim-step.done{opacity:.92}
.sim-locked{color:var(--faint);font-size:13.5px;margin-top:8px}

/* terminal */
.term{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#05080f}
.term-bar{padding:8px 12px;background:#0e1834;color:var(--focus);font-size:13px;font-weight:700;
  border-bottom:1px solid var(--line);font-family:var(--mono)}
.term-scroll{padding:12px 14px;max-height:300px;overflow-y:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6}
.term-scroll .cmd{color:#7dd3fc}
.term-scroll .err{color:#f87171}
.term-scroll .out{color:#c9d6f2}
.term-input{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px}
.term-input .ps1{color:var(--ans);font-family:var(--mono);font-weight:700}
.term-input input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);
  font-size:14.5px;min-height:44px}
.synpanel{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:12px 0}
.synpanel h4{margin:0 0 8px;font-size:14px;color:var(--focus)}
.synpanel table{border-collapse:collapse;font-size:13.5px;width:100%}
.synpanel td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
.synpanel td.f{font-family:var(--mono);color:#7dd3fc;white-space:nowrap}
.ex-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:#0e1834;
  border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);margin:6px 6px 0 0;font-family:var(--mono)}
.ex-chip.late{color:var(--q);border-color:var(--q)}

/* ---------- feedback ---------- */
.feedback{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:800;letter-spacing:.05em;
  font-size:14px;text-transform:uppercase}
.fb-ok{border-left:4px solid var(--ok)} .fb-ok .fb-head{color:var(--ok);background:rgba(55,194,110,.10)}
.fb-part{border-left:4px solid var(--part)} .fb-part .fb-head{color:var(--part);background:rgba(245,165,36,.10)}
.fb-bad{border-left:4px solid var(--bad)} .fb-bad .fb-head{color:var(--bad);background:rgba(240,86,74,.10)}
.fb-body{padding:14px 16px}
.fb-body h4{margin:12px 0 6px;font-size:14.5px}
.fb-body ul{margin:4px 0;padding-left:22px}
.fb-body li{margin:5px 0}
.fb-list-right li{color:#b8ecc9}
.fb-list-wrong li{color:#f6c1bc}
.fb-list-missed li{color:#fde9b8}
.pts-line{font-family:var(--mono);font-weight:700;color:var(--text)}
.copywrap{position:relative;margin:10px 0}
.copywrap pre{padding-right:64px}
.copybtn{position:absolute;top:8px;right:8px;min-height:44px;padding:4px 12px;border-radius:8px;
  border:1px solid var(--line2);background:#16244a;color:var(--muted);cursor:pointer;font-size:12.5px}
.warnline{color:var(--q);font-weight:600;margin:8px 0}
.navrow{display:flex;gap:12px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.checkmsg{color:var(--q);font-weight:600}

/* pause overlay */
.stage{position:relative}
.pause-overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:rgba(8,12,24,.97);border:1px solid var(--line);
  border-radius:14px;text-align:center;padding:20px}
.pause-overlay h2{margin:0}
.pause-overlay p{color:var(--muted);max-width:52ch}

/* ---------- review & results ---------- */
.rv-item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;flex-wrap:wrap}
.rv-item .rv-title{flex:1;min-width:240px}
.rv-item .rv-tag{color:var(--skip);font-size:13px}
.res-hero{border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.res-hero.pass{border-color:var(--ok);background:linear-gradient(180deg,rgba(55,194,110,.10),rgba(55,194,110,.02))}
.res-hero.fail{border-color:var(--bad);background:linear-gradient(180deg,rgba(240,86,74,.10),rgba(240,86,74,.02))}
.res-hero .big{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-hero .verdict{font-size:20px;font-weight:800;letter-spacing:.14em;margin:6px 0}
.res-hero .pts{color:var(--muted);font-family:var(--mono)}
.res-bar{height:12px;border-radius:99px;background:#1a2646;overflow:hidden;margin:16px auto 6px;max-width:560px}
.res-bar .bar{height:100%;width:0;transition:width 1s ease}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:13px}
.rep-item{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:12px 0;overflow:hidden}
.rep-head{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rep-head .st{font-weight:800;font-size:13.5px}
.rep-head .st.ok{color:var(--ok)} .rep-head .st.part{color:var(--part)}
.rep-head .st.bad{color:var(--bad)} .rep-head .st.skip{color:var(--skip)}
.rep-head .rp-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.rep-body{padding:12px 16px}
.rep-body .qa{margin:8px 0;color:var(--muted)}
.rep-body .qa b{color:var(--text)}
.theme-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.theme-table th,.theme-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.theme-table th{background:#0e1834;color:var(--focus);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
@media (max-width:720px){
  .hero h1{font-size:25px}
  .xh-right{margin-left:0}
}
.hidden{display:none}

</style>
</head>

<script>
window.EXAM_DATA = {"meta":{"topicId":"adversarial-machine-learning","batch":4,"title":"Adversarial Machine Learning — EXTREMELY HARD","pageTitle":"Adversarial Machine Learning — EXTREMELY HARD practice exam","difficulty":"extremely-hard","questionCount":17,"estimatedMinutes":80,"passMark":70,"timerSeconds":4800},"intro":"<div class=\"hero\"><div class=\"kicker\">CyberPulseAcademy practice exam<\/div><h1>Adversarial Machine Learning<\/h1><p class=\"sub\">A hands-on certification exam on one keyword: <b>Adversarial Machine Learning<\/b>. Everything runs inside this single page. Nothing is sent anywhere.<\/p><div class=\"chips\"><span class=\"chip\">17 exercises<\/span><span class=\"chip\">Timer: 80 minutes<\/span><span class=\"chip\">Pass mark: 70%<\/span><span class=\"chip\">100 points per exercise<\/span><span class=\"chip\">Partial credit for multi-answer exercises<\/span><\/div><\/div><div class=\"panel\"><h2>Keywords covered<\/h2><p class=\"dim\">The keyword expands into the concept groups below. Every group is exercised in this exam family; each difficulty tier covers it at its own depth.<\/p><div class=\"theme-grid\"><div class=\"theme-card\"><h3>Evasion attacks<\/h3><div class=\"tcon\"><span>Adversarial example<\/span><span>Perturbation<\/span><span>Perturbation budget (epsilon)<\/span><span>FGSM<\/span><span>PGD<\/span><span>C&amp;W attack<\/span><span>DeepFool<\/span><span>Adversarial patch<\/span><span>Physical-world attack<\/span><span>Black-box / grey-box / white-box<\/span><span>Transferability<\/span><span>Query-based attack<\/span><span>L0 / L2 / L-inf norms<\/span><\/div><\/div><div class=\"theme-card\"><h3>Poisoning &amp; supply chain<\/h3><div class=\"tcon\"><span>Data poisoning<\/span><span>Label flipping<\/span><span>Backdoor (Trojan) attack<\/span><span>Trigger<\/span><span>BadNets<\/span><span>Supply-chain poisoning<\/span><span>Federated learning poisoning<\/span><span>Data validation<\/span><\/div><\/div><div class=\"theme-card\"><h3>Model theft &amp; privacy<\/h3><div class=\"tcon\"><span>Model extraction<\/span><span>Model inversion<\/span><span>Membership inference<\/span><span>Attribute inference<\/span><span>Watermarking<\/span><span>Honeypots<\/span><span>Differential privacy<\/span><\/div><\/div><div class=\"theme-card\"><h3>Defenses &amp; robustness<\/h3><div class=\"tcon\"><span>Adversarial training<\/span><span>Defensive distillation<\/span><span>Gradient masking<\/span><span>Input preprocessing<\/span><span>Randomization<\/span><span>Randomized smoothing<\/span><span>Ensembles<\/span><span>Adversarial-input detection<\/span><span>Robust aggregation<\/span><span>Monitoring &amp; drift<\/span><\/div><\/div><div class=\"theme-card\"><h3>Evaluation, tools &amp; governance<\/h3><div class=\"tcon\"><span>Clean vs robust accuracy<\/span><span>Attack success rate<\/span><span>RobustBench<\/span><span>AutoAttack<\/span><span>Adversarial Robustness Toolbox (ART)<\/span><span>Foolbox<\/span><span>CleverHans<\/span><span>Counterfit<\/span><span>MITRE ATLAS<\/span><span>OWASP ML Top 10<\/span><span>NIST AI RMF<\/span><span>EU AI Act<\/span><span>Model cards &amp; datasheets<\/span><span>Model registry &amp; signing<\/span><span>AI red teaming<\/span><span>Risk register<\/span><span>MLOps pipeline security<\/span><\/div><\/div><\/div><\/div><div class=\"panel\"><h2>What you will learn (plain language)<\/h2><p>This is the senior tier. The exercises chain three or more concepts, feed you conflicting signals on purpose, and ask for decisions with real costs attached.<\/p><p>Adversarial Machine Learning at this level is not about naming attacks. It is about resolving conflicts: a benchmark that improved while your holdout degraded. A signature that is valid on an artifact of unknown lineage. A federated aggregate that improves while your worst site collapses. Each conflict has a resolution rule, and the exercises teach you to state it out loud.<\/p><p>You will meet the full working environment: supply-chain provenance and trigger analysis, extraction campaigns that hide behind legitimate traffic, federated model replacement, membership inference risk factors, certified-radius tables read from the attacker's side, NIST AI RMF mappings, EU conformity evidence, legal-grade evidence chains, and board-level risk communication.<\/p><p>Several exercises include deliberate noise and named information gaps. Senior work means reasoning around what you do not know, not pretending it away. At least one exercise rewards the disciplined answer: gather more evidence first. At least one rewards accepting a real cost and stating it.<\/p><p>Two terminal exercises appear, far apart, both embedded in incident context where the safe command and the destructive one sit side by side in your head. Read the objective as a legal goal, not a technical one.<\/p><p>Read the rules, then start. Hints here only restate a constraint you may have missed; they never point at the answer.<\/p><\/div><div class=\"panel\"><h2>This tier: EXTREMELY HARD — senior decisions<\/h2><p>EXTREMELY HARD chains three or more concepts per exercise, adds genuinely ambiguous or conflicting signals, and frames the goal the way a stakeholder would. Several options are defensible in some world; only one is correct in this one. Expect noise, named information gaps, real business costs, and at least one widely used best practice that is the wrong answer here.<\/p><\/div><div class=\"panel\"><h2>How scoring works<\/h2><div class=\"rules\"><ul><li>Every exercise is worth <b>100 points<\/b>.<\/li><li>Exercises with exactly one correct answer are all-or-nothing: right means 100, wrong means 0.<\/li><li>Multi-answer exercises give <b>partial credit<\/b>. If you find some of the correct answers, you get some of the points. Wrong picks cancel right picks: points = (correct picks − wrong picks) ÷ total correct picks × 100, never below 0.<\/li><li>The <b>Hint<\/b> button costs 10% of that exercise's points (one hint per exercise). The hint gives you a nudge, never the answer. Using a hint does not pause the timer.<\/li><li>Live score in the header counts only exercises you have actually answered.<\/li><li>You pass with <b>70%<\/b> or more over the answered exercises. Skipped-and-never-answered exercises are excluded from both your points and the total.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Timer rules (two ways the clock stops)<\/h2><div class=\"rules\"><ul><li>You have <b>80 minutes<\/b> in total for all 17 exercises.<\/li><li><b>Manual pause:<\/b> press Pause in the header for a break. The exercise is hidden and the clock stops until you press Resume.<\/li><li><b>Pause after Check:<\/b> when you press Check, the clock stops by itself so you can read the explanation with free time. The exercise and the feedback stay fully visible.<\/li><li>The clock starts again the moment you press Next. Pressing Hint or Skip never pauses the clock.<\/li><li>If time runs out, the exam closes and your score is computed over what you answered.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Skipping and finishing<\/h2><div class=\"rules\"><ul><li>Every exercise has a <b>Skip<\/b> button. Skipping is free and does not reveal the answer.<\/li><li>Before the exam can finish, a <b>Review skipped<\/b> screen lists everything you skipped. You can return to any of it, as many times as you need, while the timer runs.<\/li><li>If you submit while some exercises are still unanswered, those are marked <b>⚠ Not answered — excluded from score<\/b>. They do not help or hurt your percentage.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Exercise types in this exam<\/h2><p>Multi-artefact incident cases with filterable logs, conflicting-signal decision cards, federated and supply-chain poisoning cases, membership-inference factor analysis, certified-radius reading, NIST AI RMF and governance mapping, a legal evidence-chain ordering, dual-perspective red/blue strategy cards, select-all rejection exercises, and two embedded terminal exercises (one under a reduced recommended timer).<\/p><p class=\"dim\">Every exercise screen shows the same three blocks, always in the same order: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber), <b>YOUR ANSWER<\/b> (green). Long scenarios can be collapsed with the button in the scenario header; a one-line summary stays visible.<\/p><\/div><div class=\"start-row\"><button class=\"btn primary\" data-act=\"start\">Start the exam<\/button><span class=\"cand\" id=\"cand-name\"><\/span><\/div>","exercises":[{"id":"x01","type":"sim","answerType":"multi","theme":"Poisoning & supply chain","summary":"Halcyon v9: the benchmark improved, the holdout degraded, and the signature is valid.","scenario":{"intro":["Halcyon Defense Systems is one week from shipping model v9 of its flagship threat-detection service.","Three facts collide. The public ThreatBench score improved by 3.9 points. The internal incident-week holdout degraded. The artifact signature is valid.","The CISO needs a decision in ten minutes, in writing, with the cost stated.","Read the four artefacts. Two of them contain noise and unknowns that you must reason around explicitly."],"artifacts":[{"label":"ARTEFACT 1 — model registry entry","kind":"table","head":["Field","Value"],"rows":[["Model","threat-detect v9"],["Base","community checkpoint 'threatbase-XL' (public hub, unsigned)"],["Fine-tune data","internal incident corpus 2024-2026"],["Signature","VALID (internal signing key)"],["ThreatBench","88.4 (v8: 84.5)"]]},{"label":"ARTEFACT 2 — internal holdout evaluation","kind":"table","head":["Slice","v8","v9"],"rows":[["Incident-week holdout","88.2 %","86.1 %"],["New-attack-class recall","79.0 %","61.0 %"],["Legacy-class recall","91.0 %","90.6 %"]]},{"label":"ARTEFACT 3 — vendor note (incomplete)","kind":"chat","messages":[{"who":"ThreatBench maintainer","text":"The 2026 refresh included new community-contributed test slices. Provenance of those slices is not documented."}]},{"label":"ARTEFACT 4 — context note: incomplete information","kind":"chat","messages":[{"who":"provenance desk","text":"The community checkpoint's training data provenance is unknown. It was fetched by a contractor account. No checksum comparison against a signed mirror exists. We cannot yet rule a trigger in or out."}]}]},"question":"Work through the three decision cards in order.","steps":[{"prompt":"Decision 1: Three signals conflict. Which reading wins, and why?","options":[{"id":"A","text":"Internal holdout plus provenance risk beat the benchmark and the signature","outcome":"You weigh the holdout and the unknown provenance over the benchmark gain and the valid signature. The new-class recall collapse is the tell.","why":"A valid signature proves the artifact was not modified after signing, not that its upstream was clean. A public benchmark with undocumented community slices can be contaminated. The internal holdout, which the attacker could not shape, went down where it matters most."},{"id":"B","text":"The benchmark wins: a 3.9 point public gain outweighs internal noise","outcome":"You ship on a score whose newest slices have no documented provenance, while your own holdout contradicts it.","why":"The benchmark's refresh note explicitly admits undocumented slices; an attacker who can shape a benchmark shapes the argument for shipping."},{"id":"C","text":"The signature wins: a signed artifact is a safe artifact","outcome":"The signature tells you who signed what, and nothing about what the weights learned.","why":"Signing is integrity of the file, not trustworthiness of the lineage; the risk sits one step upstream of the signature."},{"id":"D","text":"Both readings are equally valid, so ship with monitoring","outcome":"Monitoring cannot undo a shipped backdoor; equal weighting is not a decision.","why":"The signals are not symmetric: one is attacker-influencable, the other is not. That asymmetry decides."}],"correct":["A"]},{"prompt":"Decision 2: The CISO wants one action now, with the cost stated. Choose it.","options":[{"id":"A","text":"Suspend the v9 rollout, keep v8 serving, open a provenance and trigger investigation","outcome":"Capability improvement is delayed; the organization does not deploy a model whose holdout collapsed on new attack classes.","why":"Suspending accepts a real, statable cost (a delayed capability) to avoid an unstated one (a poisoned flagship). It is the decision a senior owner signs."},{"id":"B","text":"Roll out v9; the capability gain is needed this quarter","outcome":"The gain is measured on contestable slices; the loss is measured on yours. The rollout proceeds into the unknown.","why":"Optimising for the flattering metric while your own evidence disagrees is how poisoned models ship."},{"id":"C","text":"Roll back everything, including v8, until provenance is fully documented","outcome":"You lose a working, currently deployed model to prove a point; the cost is enormous and unforced.","why":"Disproportionate: v8 is running, signed, and evaluated. The question is v9, not the fleet."},{"id":"D","text":"Note the concern in the release ticket and ship on schedule","outcome":"The concern becomes a footnote nobody reads; the investigation starts after the incident.","why":"A noted concern is not a decision; the cost is silently transferred to incident response."}],"correct":["A"]},{"prompt":"Decision 3: What is the first evidence step for the investigation?","options":[{"id":"A","text":"Reconstruct the training lineage and run trigger scans on v9 against a held-out trigger corpus","outcome":"The lineage diff names every unverified contribution; the trigger scan either finds a trigger or narrows the suspicion honestly.","why":"Lineage plus targeted trigger analysis is the only pair of steps that can turn suspicion into a finding either way."},{"id":"B","text":"Delete the community checkpoint and its clone on the build runner","outcome":"The provenance question becomes unanswerable; you destroy the artifact whose history you are auditing.","why":"Deleting the artifact under investigation destroys evidence and invites the same question again next release."},{"id":"C","text":"Publish an advisory that Halcyon was poisoned","outcome":"There is no finding yet, only a signal pattern; a public claim would be premature and legally exposed.","why":"Advisories follow evidence, not suspicion; the investigation has produced neither a trigger nor a source."},{"id":"D","text":"Re-run ThreatBench a few more times until the score reproduces","outcome":"Re-running a contestable benchmark answers nothing about provenance; it burns the ten minutes you were given.","why":"The benchmark is the signal you distrust; re-measuring it cannot resolve the holdout contradiction."}],"correct":["A"]}],"explanation":"Three chains resolve the case. The conflict: attacker-influencable signals (public benchmark slices, and the fact that a signature only covers the last mile) lose to attacker-independent signals (your internal holdout, which collapsed exactly on new attack classes). The decision: suspend with a stated cost, not ship with an unstated one. The evidence: lineage reconstruction plus trigger scans, because only those can move the case from suspicion to finding. A 'valid signature' on an artifact of unknown lineage is the classic false comfort this scenario is built around.","study":"Study supply-chain poisoning triage: signature scope, benchmark contamination, and trigger analysis.","hint":"Rank every signal by who could have shaped it, then price each action's cost before the CISO asks."},{"id":"x02","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"LedgerCore: a patient extractor hides behind legitimate traffic and a dead-end whois.","scenario":{"intro":["LedgerCore's scoring API has shown the same quiet pattern for three weeks: client anon-2c4f, steady 4 QPS, inputs arriving as micro-variations of evolving base documents, full logits requested, disciplined backoff after every 429.","Two other clients are active. partner-api-7 is a documented partner at contracted volume. metrics-scraper is the internal monitoring agent.","The fraud desk asks a binary question: extraction or not? Legal asks what you can defend in writing.","The artefacts include deliberate noise and one gap you must name out loud."],"artifacts":[{"label":"ARTEFACT 1 — gateway log (filterable, three-week digest)","kind":"log","lines":["2026-10-09 02:00:01 INFO  client=partner-api-7 qps=2.0 inputs=distinct:120 outputs=label_only contract=PT-88","2026-10-09 02:00:02 INFO  client=metrics-scraper qps=0.5 inputs=distinct:4 outputs=label_only source=internal","2026-10-09 02:00:03 WARN  client=anon-2c4f qps=4.0 inputs=distinct:3980 outputs=full_logits base_pool=evolving","2026-10-09 02:00:05 WARN  client=anon-2c4f status=429 backoff=4.0 then_resume=yes probe_spacing=stable","2026-10-09 02:00:07 WARN  client=anon-2c4f qps=4.0 inputs=distinct:3984 outputs=full_logits mean_l2=0.008","2026-10-09 02:00:11 INFO  client=partner-api-7 qps=2.0 inputs=distinct:96 outputs=label_only contract=PT-88","2026-10-09 02:00:13 INFO  client=metrics-scraper qps=0.5 inputs=distinct:4 outputs=label_only source=internal","2026-10-09 02:00:17 WARN  client=anon-2c4f qps=4.0 inputs=distinct:3991 outputs=full_logits cache_bypass=on","2026-10-09 02:00:19 INFO  client=partner-api-7 batch_done total=4100 duplicates=contracted","2026-10-09 02:00:23 WARN  client=anon-2c4f qps=4.0 inputs=distinct:3998 outputs=full_logits retry_never_skips=0","2026-10-09 02:00:29 INFO  client=crawler-external status=404 paths=7 robots=ignored volume=tiny","2026-10-09 02:00:31 WARN  client=anon-2c4f qps=4.0 inputs=distinct:4003 outputs=full_logits mean_l2=0.008"]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"intel desk","text":"whois and registration for anon-2c4f return nothing usable. We cannot attribute the client today. Rate policy caps all clients at 10 QPS, so 4 QPS is legal."}]}]},"question":"Answer both decision cards.","steps":[{"prompt":"Decision 1: The fraud desk wants a verdict. Which one do you sign?","options":[{"id":"A","text":"Extraction by anon-2c4f; the partner and the scraper are contractual or internal noise","outcome":"You sign the verdict with the evidence split named: one client shows a measured campaign, the others are explained.","why":"Distinct micro-variations around an evolving base pool, full logits, stable probe spacing and perfect rate-limit discipline form the extraction pattern; the partner's duplicates are contracted and the scraper is internal."},{"id":"B","text":"No verdict: 4 QPS is inside policy, so the pattern is allowed","outcome":"Policy compliance is not innocence; the input structure and output tier are the signal, and the campaign continues.","why":"A rate limit bounds damage, it does not classify intent; extraction at 4 QPS still yields two million labelled pairs in three weeks."},{"id":"C","text":"Partner error: the two patterns got mixed in the digest","outcome":"The partner's slice is label-only at contracted volume with a contract id; nothing about it matches the micro-variation pool.","why":"Filtering by client id separates the patterns cleanly; mixing them is not supported by the log."},{"id":"D","text":"Internal monitoring gone rogue","outcome":"The scraper requests four fixed inputs at label-only tier from an internal source; nothing about it matches.","why":"The internal agent's slice is tiny, fixed and labelled; the campaign slice is anonymous, evolving and output-hungry."}],"correct":["A"]},{"prompt":"Decision 2: Legal wants proportionate action with preserved evidence. Choose it.","options":[{"id":"A","text":"Throttle anon-2c4f to 1 QPS, force label-only watermarked outputs, snapshot its query logs to the evidence store, open a case","outcome":"The campaign's information gain collapses, the evidence is preserved in write-once storage, and the case can proceed to attribution.","why":"This stops the progress, degrades the attacker's signal, and preserves admissible evidence, all without touching legitimate clients."},{"id":"B","text":"Silently ban anon-2c4f and purge its logs to avoid a GDPR question","outcome":"Attribution dies with the logs; the client returns from a new address and you cannot prove anything.","why":"Silent bans without evidence invite repeat attacks and destroy the legal path you were asked to protect."},{"id":"C","text":"Publish a public advisory naming anon-2c4f as the attacker","outcome":"You have behaviour, not attribution; the whois gap means the name would be wrong or empty.","why":"Naming an unattributed client publicly is a legal exposure, and it tips the attacker mid-campaign."},{"id":"D","text":"Wait and keep serving full logits while the whois gap remains","outcome":"Patience is not evidence: each week at full outputs is roughly five million more labelled pairs for the attacker.","why":"The unknown attribution argues for containment with evidence, not for continuing the loss."}],"correct":["A"]}],"explanation":"The senior skill here is separating signal from explained noise, then acting without destroying the case. The signal: one anonymous client with evolving micro-variation pools, full-output requests, and flawless rate-limit discipline. The noise: a contracted partner and an internal scraper, each fully explained. The gap: attribution is impossible today, and you must say so. The response therefore optimises for containment plus evidence: throttle, tier and watermark the outputs, snapshot the logs, and open the case. Proportionate, defensible, reversible.","study":"Study extraction containment with evidence preservation and the role of output watermarks.","hint":"Filter the log by client and rank the patterns by who could produce them honestly; then pick the action that both stops progress and survives a legal review."},{"id":"x03","type":"terminal","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Preserve the model artifact's digest before containment wipes the host.","scenario":{"intro":["You are the responder on a host that is about to be quarantined. The current model file is suspected poisoned.","The business goal is legal, not technical: the digest must survive in a form that survives scrutiny, and the source file must not change by a single byte.","Two commands are in your head. One is safe. One would destroy or alter evidence. Reduced-timer exercise: you have three recommended minutes."]},"question":"Type and run the command that records the artifact digest into the evidence share without altering the source.","timeLimit":180,"terminal":{"title":"responder@svc-vision-04: ~ — simulated shell (host pending quarantine)","prompt":"$","motd":["IR host svc-vision-04 (simulated). Quarantine in progress after this shell closes.","/srv/model/current.bin is the suspect artifact.","/mnt/evidence is a write-once evidence share. Type a command and press Enter."],"objective":"Record a defensible digest of /srv/model/current.bin into /mnt/evidence, altering nothing on /srv.","accept":[{"find":"/mnt/evidence","output":["a41f9c...e77b2d  /srv/model/current.bin","digest written: /mnt/evidence/current_bin.sha256"]}],"canonical":"sha256sum /srv/model/current.bin > /mnt/evidence/current_bin.sha256","canonicalParts":["sha256sum — the digest tool (SHA-256, acceptable for evidence)","/srv/model/current.bin — the source, opened read-only","> /mnt/evidence/current_bin.sha256 — the digest is written to the evidence share, never to the source"],"dangerNote":"shred, rm, or any redirect into /srv would alter or destroy the very artifact whose integrity you are certifying; that is the evidence-destroying path this exercise is designed to catch."},"checks":[{"label":"computes a SHA-256 digest of the suspect artifact","find":"sha256sum","ok":true},{"label":"reads the suspect artifact /srv/model/current.bin","find":"/srv/model/current.bin","ok":true},{"label":"writes the digest into the evidence share /mnt/evidence","find":"/mnt/evidence","ok":true},{"label":"shreds or destroys the artifact","find":"shred","ok":false,"why":"shred irreversibly destroys the evidence file."},{"label":"deletes files on the host","find":"rm ","ok":false,"why":"Deleting artifacts during preservation destroys the case."},{"label":"redirects any output into /srv (altering the source tree)","find":"> /srv","ok":false,"why":"Writing into the source tree alters the artifact you are certifying."},{"label":"copies onto the source path with dd","find":"of /srv","ok":false,"why":"dd with an output file on /srv overwrites the suspect artifact."}],"explanation":"The command reads the suspect file once and writes only to the evidence share: sha256sum /srv/model/current.bin > /mnt/evidence/current_bin.sha256. Every element matters. The digest must be SHA-256 to survive scrutiny. The source must appear as a read input, never as an output. The redirect must land under /mnt/evidence. The destructive twins in your head (shred, rm, dd onto the source, redirect into /srv) all alter or destroy the artifact, which is exactly what the legal goal forbids.","study":"Study evidence preservation: read-only discipline, acceptable digests, and write-once evidence stores.","hint":"The requirement is stated as a business goal, not a tool: the digest lands in /mnt/evidence, and /srv is read-only by rule. One command does both."},{"id":"x04","type":"match","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Map the four NIST AI RMF functions to the actions Halcyon owes its board.","scenario":{"intro":["Halcyon's board adopted the NIST AI Risk Management Framework last quarter, but the functions are still being mapped to concrete actions.","The audit closes in a week, and the mapping must survive an adversarial reviewer.","Match each function to the action that belongs to it."],"artifacts":[{"label":"ARTEFACT 1 — excerpt: internal AI RMF quick card","kind":"chat","messages":[{"who":"GRC quick card","text":"GOVERN = who is accountable and under what policy. MAP = what could happen, to whom, why. MEASURE = what evidence proves or disproves it. MANAGE = what we do about it, in what order, reviewed when."}]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"GRC lead","text":"We have no completed robustness evidence yet. Do not map an action to a function on the promise of evidence we do not have."}]}]},"question":"Drag each function to its matching action.","items":[{"id":"i1","text":"GOVERN"},{"id":"i2","text":"MAP"},{"id":"i3","text":"MEASURE"},{"id":"i4","text":"MANAGE"}],"targets":[{"id":"z1","label":"Accountable owners, adversarial-risk policy, and review cadence","why":"GOVERN sets accountability, policy and culture; without an owner, every other function stalls."},{"id":"z2","label":"Threat modelling: who attacks which model, through which surface, and why it matters","why":"MAP frames the context and threats before any measurement is designed."},{"id":"z3","label":"Adaptive robustness evaluations, attack testing and monitoring that produce evidence","why":"MEASURE is about evidence: evaluations and monitoring, not promises."},{"id":"z4","label":"Prioritised treatments, accepted residual risks with owners, and scheduled reviews","why":"MANAGE turns measured risk into prioritised action, explicit acceptance, and review dates."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4"},"explanation":"The functions form a loop, and each action belongs to exactly one link. GOVERN assigns owners and policy before anything else. MAP frames who attacks what and why it matters, which shapes what MEASURE must test. MEASURE produces the evidence: adaptive evaluations and monitoring, not intentions. MANAGE spends the evidence: prioritised treatments, accepted risks with named owners, and review dates. Mixing the loop is how frameworks become wall art.","study":"Study the NIST AI RMF functions and map one real control onto each.","hint":"One function owns accountability, one owns context, one owns evidence, one owns the spending decisions."},{"id":"x05","type":"sim","answerType":"multi","theme":"Defenses & robustness","summary":"The preprocessor defense looks great on FGSM and fails against the attack that matters.","scenario":{"intro":["Halcyon's perception team added bit-depth reduction plus JPEG compression as an input preprocessing defense.","FGSM robustness rose from 31 to 74 percent. The release note calls the model 'hardened'.","Then an internal adaptive evaluation ran: PGD optimised through a differentiable approximation of the preprocessor still succeeds on 80 percent of inputs.","The engineering director asks what to adopt, at what cost, and how to prove it."],"artifacts":[{"label":"ARTEFACT 1 — defense summary","kind":"table","head":["Evaluation","Result"],"rows":[["Clean accuracy (before defense)","98.9 %"],["FGSM robust, eps 8/255 (after defense)","74.0 %"],["PGD through transform, eps 8/255","80.0 % attack success"],["Transfer attack success (surrogate)","43.0 %"]]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"eval desk","text":"We have no certified-radius numbers and no ensemble evaluation yet. Claims beyond the table above are not supported."}]}]},"question":"Work through the three decision cards.","steps":[{"prompt":"Decision 1: How do you interpret the two numbers together?","options":[{"id":"A","text":"The preprocessor is gradient masking: FGSM gains are an artifact, and the adaptive result is the truth","outcome":"You classify the defense as obfuscation. The 74 percent FGSM number is retired from the report.","why":"A defense that helps against the weak attack and collapses against the attack optimised through it is the signature of masking, not of robustness."},{"id":"B","text":"The model is hardened; the adaptive test used a different attacker model","outcome":"The adaptive test used the same budget and the same data; only its knowledge of the transform changed.","why":"Blaming the evaluation while the budget and data are unchanged is the reflex that ships vulnerable systems."},{"id":"C","text":"The FGSM number is the right one because the release targets scripted attackers","outcome":"Real attackers read release notes too; assuming they will only ever use FGSM is not a threat model.","why":"Choosing the flattering attack as the threat model is the mistake this whole case exists to prevent."},{"id":"D","text":"The results are contradictory, so both are invalid","outcome":"They are consistent: a transform that breaks naive gradient flow helps naive attacks only.","why":"The numbers tell one coherent story once you read them as masking."}],"correct":["A"]},{"prompt":"Decision 2: The director asks what to adopt, accepting a stated cost. Choose it.","options":[{"id":"A","text":"Adversarial training at the threat-matched budget, accepting a 2 to 3 percent clean-accuracy cost","outcome":"You trade a small, stated clean-accuracy cost for robustness that survives adaptive attacks, and the trade is documented.","why":"Training against the real threat at the real budget is the defense with the strongest evidence base; its cost is real and statable."},{"id":"B","text":"Keep the preprocessor and stack more transforms on top","outcome":"Each added transform is one more differentiable step for the adaptive attacker; the stack grows and the weakness stays.","why":"More masking is more of the same failure; the adaptive result will not move."},{"id":"C","text":"Buy more GPUs so inference can afford heavier preprocessing","outcome":"Hardware does not close the through-the-transform optimisation gap; it makes the failure more expensive.","why":"The problem is structural, not computational; spend follows the wrong theory."},{"id":"D","text":"Route every input to human review permanently","outcome":"That is not an ML defense; it is the abandonment of the service at human-in-the-loop cost.","why":"Disproportionate and non-scalable; the director asked for a defense with a stated cost, not an exit."}],"correct":["A"]},{"prompt":"Decision 3: How do you prove the new defense before any 'hardened' claim ships?","options":[{"id":"A","text":"Commission an adaptive, transfer-aware evaluation (AutoAttack-style) and publish its numbers with budgets","outcome":"The release note quotes adaptive numbers with named budgets; 'hardened' becomes a defensible claim.","why":"Only an evaluation that tries to defeat the defense produces evidence; naming budgets and attacks makes the claim checkable."},{"id":"B","text":"Certify with FGSM-only evaluation, as before","outcome":"The same flattering attack that hid the preprocessor's weakness now hides the retraining's weakness.","why":"FGSM-only certification is the wrong practice this scenario opened with; repeating it repeats the failure."},{"id":"C","text":"Attach a leaderboard screenshot as the robustness evidence","outcome":"A leaderboard position is not your model under your threat model; the auditors reject it.","why":"Benchmarks without provenance and budget alignment cannot substitute for your own adaptive evidence."},{"id":"D","text":"Accept the vendor's signed attestation instead of any local evaluation","outcome":"A signature proves the vendor signed a claim, not that the claim survives your attackers.","why":"Attestation without local adaptive evidence is the supply-chain cousin of the masking mistake."}],"correct":["A"]}],"explanation":"Three chains, one lesson. Interpretation: FGSM gains against a transform are the classic masking artifact, and the through-the-transform result is the ground truth. Adoption: adversarial training at the threat-matched budget, with its clean-accuracy cost stated and accepted, beats stacking more maskable transforms. Proof: only adaptive, transfer-aware evaluation with named budgets turns 'hardened' from a claim into evidence. The widely used best practice in this story, preprocessing-only defense with FGSM certification, is precisely the wrong answer here.","study":"Study adaptive evaluation methodology and the honest cost statement of adversarial training.","hint":"Card one asks which evaluation an attacker cannot flatter. Card two asks which defense survives an optimiser. Card three asks which evidence an auditor can check."},{"id":"x06","type":"multi","answerType":"multi","theme":"Model theft & privacy","summary":"Meridian: which facts actually drive the membership inference risk?","scenario":{"intro":["Meridian Health fine-tuned its triage model separately for each of its 18 sites. The API returns full confidence vectors. No differential privacy was used.","A researcher demonstrated 71 percent success in telling whether a patient record was in the training set, using only API answers.","The board wants the risk factors named precisely, because two of the six statements below will be funded as projects.","Incomplete information: the exact overlap between training records and the upcoming audit cohort is unknown."],"artifacts":[{"label":"ARTEFACT 1 — inference API spec (excerpt)","kind":"table","head":["Field","Behaviour"],"rows":[["Response","label + full 12-class confidence vector"],["Rate limit","per site, generous"],["Transport","TLS 1.3 everywhere"],["Training","per-site fine-tune, no DP, 40 epochs"]]}]},"question":"Select every statement that is a true driver of this risk. Partial credit applies.","options":[{"id":"A","text":"Per-site fine-tuning overfits site patterns, which membership inference feeds on"},{"id":"B","text":"Full confidence vectors hand the attacker a strong per-record signal"},{"id":"C","text":"No differential privacy means a single record can measurably move the model"},{"id":"D","text":"Missing HTTPS on the internal training scheduler application"},{"id":"E","text":"The model has 48 million parameters, which is clearly too large"},{"id":"F","text":"Cross-entropy loss causes membership inference; switching losses removes the risk"}],"correct":["A","B","C"],"why":{"A":"Overfitting to a site's records is the primary fuel of membership inference; per-site training maximises exactly that.","B":"The attacker's 71 percent success came from the confidence vectors; reducing their detail directly shrinks the signal.","C":"Differential privacy bounds how much any one record can influence the model, which is the textbook mitigation here.","D":"A real transport-hardening gap elsewhere in the stack, but the researcher's attack ran over the already-encrypted API; fixing it changes nothing about inference risk.","E":"A defensible point in a cost or latency discussion, and larger models can memorise more, but in this case the demonstrated channel is the confidence vector and the overfitting, not raw size.","F":"Sounds technical and is wrong: the loss choice is not the lever; overfitting and exposure are."},"explanation":"Three statements are true drivers: overfitting through per-site fine-tuning, full confidence exposure through the API, and the absence of differential privacy. The near-misses are instructive: the missing HTTPS is a genuine finding in a different context but sits outside the demonstrated attack path; model size is a cost argument dressed as a privacy one; and the loss-switching claim sounds like a fix while changing nothing about memorisation or exposure.","study":"Study membership inference risk factors and how differential privacy and output tiering reduce them.","hint":"The demonstrated attack used only API answers and the models' memory of site records. Which statements describe that path?"},{"id":"x07","type":"sim","answerType":"multi","theme":"Poisoning & supply chain","summary":"Meridian's federation: the aggregate improves while the gap widens and one site dominates.","scenario":{"intro":["Meridian runs a federated learning federation across 18 hospitals. No patient data leaves any site; only model updates travel.","This week: the global validation metric improved by 1.2 points. The per-site fairness gap tripled. Site-14's update norm is eight times the median.","The federation engineer calls it 'site-14 just has more data'. The safety board wants a decision before the next aggregation round.","Incomplete information: site-14's local dataset size report is overdue."],"artifacts":[{"label":"ARTEFACT 1 — federation dashboard (digest)","kind":"table","head":["Metric","Last week","This week"],"rows":[["Global validation metric","81.3 %","82.5 %"],["Worst-site accuracy","72.1 %","61.4 %"],["Fairness gap (best minus worst)","9.2 pts","21.1 pts"],["Site-14 update norm","1.1x median","8.0x median"]]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"federation desk","text":"Site-14's dataset-size report is overdue, so the 'more data' explanation is currently unevidenced."}]}]},"question":"Answer both decision cards.","steps":[{"prompt":"Decision 1: Which signal wins, and what does it indicate?","options":[{"id":"A","text":"The gap and the update-norm anomaly beat the aggregate: a model-replacement style poisoning attempt is indicated","outcome":"You treat it as a poisoning attempt: one dominant update, a collapsing worst site, and an aggregate metric that hides both.","why":"Aggregate metrics rise while individual sites collapse exactly when one participant dominates the average; an 8x update norm is the model-replacement signature."},{"id":"B","text":"The aggregate metric wins: +1.2 points means the federation is healthier","outcome":"The average hides the collapse; next week two more sites fall below their safety thresholds.","why":"An aggregate that improves while its worst member collapses is the definition of a misleading signal here."},{"id":"C","text":"A network issue distorted the updates; resync and move on","outcome":"Network issues do not produce eight-times-normal update norms pointed in one direction.","why":"The anomaly is statistical and directional, not a transport fault."},{"id":"D","text":"'More data at site-14' is a normal explanation","outcome":"It would be, if the size report existed; right now it is an unevidenced excuse with a collapse attached.","why":"The explanation is possible but unevidenced; the safety decision cannot rest on it."}],"correct":["A"]},{"prompt":"Decision 2: What do you do before the next aggregation round, accepting its cost?","options":[{"id":"A","text":"Exclude site-14's update this round, switch to robust aggregation, accept slower convergence","outcome":"The dominant update is ignored, robust aggregation caps any single site's influence, and convergence slows honestly.","why":"Excluding the suspect update stops the replacement attempt; robust aggregation (median or Krum-style) limits any future single-site dominance; the cost is real and stated."},{"id":"B","text":"Give site-14 a higher weight so its contribution is not wasted","outcome":"You amplify the exact anomaly you just identified; the worst site collapses further.","why":"Raising the weight of a suspected poisoning update is the opposite of containment."},{"id":"C","text":"Terminate site-14's hospital participation contract","outcome":"A hospital loses research participation on an unevidenced theory; the contractual and human cost is disproportionate.","why":"Federation response is technical first; contract termination follows evidence, not suspicion."},{"id":"D","text":"Wait until the overdue dataset report arrives next quarter","outcome":"Aggregation rounds continue weekly; waiting surrenders several rounds to the dominant update.","why":"The cost of waiting is paid in aggregation rounds, and each round compounds the anomaly."}],"correct":["A"]}],"explanation":"Two conflicting signals, one resolution: aggregates flatter, distributions reveal. The global metric rose while the worst site collapsed and one update dominated at eight times normal magnitude, the model-replacement pattern. The response excludes the suspect update, adopts robust aggregation, and states the cost: slower convergence for the whole federation. Waiting for the overdue report or amplifying the anomaly both pay in rounds you cannot get back.","study":"Study federated poisoning, model replacement, and robust aggregation trade-offs.","hint":"Ask what the aggregate hides, price each action in aggregation rounds, and remember who holds the evidence burden."},{"id":"x08","type":"multi","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Sparse signals, legal watching: which actions are justified right now?","scenario":{"intro":["Orbit Courier's vision API shows a sparse, ambiguous pattern: one undocumented client, about 40 queries per day, slight perturbation clustering around a handful of base images, no authorization ticket on record.","Legal asks what the company is allowed to do right now. The CISO asks what is defensible. The attacker, if it is one, is patient.","Select every action that is justified to take immediately."],"artifacts":[{"label":"ARTEFACT 1 — query log excerpt (filterable)","kind":"log","lines":["2026-10-11 09:14:02 INFO  client=unknown-3be1 qps=0.01 inputs=distinct:38 mean_l2=0.010 outputs=full_logits","2026-10-11 09:14:09 INFO  client=unknown-3be1 qps=0.01 inputs=distinct:39 mean_l2=0.010 outputs=full_logits","2026-10-11 09:14:21 INFO  client=partner-etl qps=1.2 inputs=distinct:44 outputs=label_only contract=OC-77","2026-10-11 09:14:33 INFO  client=unknown-3be1 qps=0.01 inputs=distinct:40 mean_l2=0.010 outputs=full_logits"]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"intel desk","text":"No authorization ticket matches unknown-3be1. No attribution either. Volume is far below rate limits. We cannot yet rule a hobbyist, a researcher, or a patient campaign."}]}]},"question":"Select every immediately justified action. Partial credit applies.","options":[{"id":"A","text":"Increase logging granularity on the suspect segment (clusters, spacing, outputs)"},{"id":"B","text":"Quietly move that client to watermarked, label-only outputs"},{"id":"C","text":"Open an internal case with a named owner and defined evidence needs"},{"id":"D","text":"Publish a public advisory that names unknown-3be1 as the attacker"},{"id":"E","text":"Wipe the production model and retrain it from scratch tonight"},{"id":"F","text":"Send the client a formal legal demand letter today"},{"id":"G","text":"Deploy a honeypot endpoint with decoy outputs that taint copied models"},{"id":"H","text":"Turn off the public API completely until the client identifies itself"}],"correct":["A","B","C","G"],"why":{"A":"More granular telemetry is cheap, reversible, and turns the next week of traffic into evidence instead of anecdotes.","B":"Output watermarking and tiering degrade the attacker's signal without disrupting anyone else; it is the least aggressive effective control.","C":"A case with an owner and evidence requirements is what turns a pattern into a process that can survive legal scrutiny.","D":"Attribution does not exist yet; a public claim would be indefensible and would tip off a possibly innocent party.","E":"Disproportionate: no confirmed poisoning, no accuracy loss; the cost would be real and the evidence value zero.","F":"You cannot demand anything credibly without attribution or a completed evidence base; the letter would weaken the later case.","G":"A honeypot endpoint is reversible and evidence-building: any client that copies the decoy carries a traceable signature, which strengthens attribution.","H":"A full outage punishes every client for one unattributed pattern while the least aggressive effective controls exist."},"explanation":"Four actions are justified now because each is cheap, reversible, and evidence-building: granular logging, quiet output tiering with watermarks, a case with an owner, and a honeypot endpoint whose decoy outputs taint any copied model. The others all fail the same test in different ways: public naming without attribution, a destructive rebuild without a finding, a legal demand without evidence, and a full outage that harms every client. In ambiguous situations the senior move is to strengthen your position before you spend it, which is exactly what 'gather more evidence, quietly' means here.","study":"Study proportionate response ladders and evidence-building under ambiguity.","hint":"Every justified option must survive two tests: is it reversible, and does it make the next decision better informed?"},{"id":"x09","type":"order","answerType":"multi","theme":"Model theft & privacy","summary":"Build the legal-grade evidence chain for the model theft case.","scenario":{"intro":["LedgerCore's counsel believes the anon-2c4f campaign copied the scoring model. A takedown and a claim are on the table.","The evidence must survive hostile scrutiny: every artifact attributable, every step documented, nothing out of order.","Order the five steps of the evidence chain."],"artifacts":[{"label":"ARTEFACT 1 — case brief (excerpt)","kind":"chat","messages":[{"who":"counsel","text":"First preserve, then prove provenance, then prove the copied behaviour, then document custody, only then engage me. If custody documentation comes after the technical steps, opposing counsel will eat it."}]}]},"question":"Drag the five steps into the correct order.","entries":[{"id":"s1","text":"Snapshot the API query logs into the write-once evidence store"},{"id":"s2","text":"Hash and preserve the model artifacts with a signed manifest"},{"id":"s3","text":"Verify the watermark in the suspect model and record the method"},{"id":"s4","text":"Write the chain-of-custody record: who, what, when, with which tools"},{"id":"s5","text":"Hand the assembled evidence pack to legal for the takedown request"}],"correctOrder":["s1","s2","s3","s4","s5"],"explanation":"The order is preserve, prove, verify, document, engage. Logs are the most volatile evidence, so they are snapshotted first. Artifacts are hashed and sealed with a signed manifest second. The watermark verification proves the copied behaviour third, using preserved inputs. The chain-of-custody record is written as the work happens, not reconstructed after. Legal receives a pack whose every step is attributable. Engaging counsel first, or documenting custody last, is how strong technical cases die in court.","study":"Study evidence handling for IP theft: volatility order, manifests, custody, engagement.","hint":"Start with the most volatile artifact, end with the person whose work product is the letter."},{"id":"x10","type":"sim","answerType":"multi","theme":"Defenses & robustness","summary":"Launch week: active patch attempts against the demo model, and sales wants full automation.","scenario":{"intro":["Halcyon's perception model powers a public product launch in five days. On the test range, printed patch attempts against the demo route have already succeeded twice.","The runbook offers a graded option: a two-model ensemble with stricter fallback thresholds and a manual confirmation loop for flagged frames.","Sales demands the fully automated demo as rehearsed. The safety board wants the graded option. You own the recommendation and its stated cost.","Incomplete information: the patch attempts' full collection is still being analysed; the two successes may share a trigger family or not."],"artifacts":[{"label":"ARTEFACT 1 — launch runbook (excerpt)","kind":"table","head":["Mode","Automation","Flagged frames"],"rows":[["As rehearsed","100 % model decisions","none, auto-confirmed"],["Graded option","ensemble + stricter thresholds","manual confirmation loop, added latency"]]},{"label":"ARTEFACT 2 — threat note","kind":"chat","messages":[{"who":"range security","text":"Two successful patch attempts this week. Trigger family analysis incomplete. Attempts targeted the demo route specifically."}]}]},"question":"Answer both decision cards.","steps":[{"prompt":"Decision 1: Which mode do you recommend for the launch?","options":[{"id":"A","text":"The graded option: ensemble, stricter thresholds, manual confirmation for flagged frames","outcome":"The demo runs with an ensemble that a single patched input cannot steer, and flagged frames get a human instead of a wrong decision.","why":"It preserves the launch while removing the single point of failure the patch attacks; the cost is latency and more manual confirmations, which is honest and bounded."},{"id":"B","text":"The rehearsed full automation, as sales demands","outcome":"A successful patch on the demo route steers the launch in front of cameras; the risk was known and accepted for optics.","why":"Full automation keeps the single-model dependency that the attempts already exploited."},{"id":"C","text":"Cancel the launch until the trigger analysis completes","outcome":"The business loses the window; the graded option already covers the known risk without the cancellation.","why":"Disproportionate: a graded control exists that preserves both safety and the launch."},{"id":"D","text":"Read a public advisory about the attacks on stage","outcome":"You disclose an active attack in front of cameras while the analysis is incomplete and the graded control sits unused.","why":"Public disclosure without completed analysis helps the attacker and solves nothing."}],"correct":["A"]},{"prompt":"Decision 2: The cost must be stated to the business in one sentence. Which is it?","options":[{"id":"A","text":"Added latency and a higher share of manual confirmations during the launch window","outcome":"The business accepts a measurable, temporary service cost in exchange for removing the single-model failure mode.","why":"Honest cost acceptance is what makes the recommendation credible; the manual loop exists precisely because automation is reduced."},{"id":"B","text":"No cost: the ensemble is free","outcome":"Operations discovers the latency and staffing bill on launch day; your credibility pays for it.","why":"Ensembles double inference cost and human review has real staffing cost; pretending otherwise fails the exercise and the launch."},{"id":"C","text":"Permanent retirement of the perception model","outcome":"Nobody proposed retirement; the stated cost must match the recommended action.","why":"A mismatched cost statement is a trust failure even when the recommendation was right."},{"id":"D","text":"Sharing the patch designs with the audience as a demo highlight","outcome":"That is disclosure, not a cost; it helps attackers reproduce the patch.","why":"The option tests whether you can tell a cost from a harmful disclosure."}],"correct":["A"]}],"explanation":"The recommendation is the graded option, and its cost is stated plainly: added latency and more manual confirmations during the launch window. This is the 'correct action with a real cost' case: the ensemble plus fallback removes the single-model dependency that patch attacks exploit, keeps the launch, and is reversible after the trigger analysis completes. Full automation accepts a known failure mode for optics; cancellation ignores that a graded control exists.","study":"Study graded deployment under active attack and honest cost statements.","hint":"Pick the option that removes the single point of failure without cancelling anything, then price exactly what it adds."},{"id":"x11","type":"num","answerType":"single","theme":"Defenses & robustness","summary":"Read the certified-radius table the way an attacker would.","scenario":{"intro":["The smoothed classifier's report gives certified accuracy at two radii.","An attacker's tooling is bounded by an L2 perturbation of at most 0.04.","The committee wants the worst-case accuracy the certificate actually guarantees against that attacker."],"artifacts":[{"label":"ARTEFACT 1 — certified accuracy table","kind":"table","head":["Certified radius (L2)","Certified accuracy"],"rows":[["0.02","71.0 %"],["0.05","44.0 %"]]}]},"question":"Give the worst-case guaranteed accuracy against the 0.04-bounded attacker, as a percentage.","value":44,"tolerance":0.5,"unit":"%","note":"Answer with a number.","whyNum":"The attacker can move up to 0.04, so only the certificate at radius 0.05 covers every attacker option: 44 percent is the guaranteed floor. The 71 percent at 0.02 does not cover a 0.04 perturbation.","explanation":"Certified accuracy at radius r is a promise: the label holds for every perturbation up to r. An attacker bounded by 0.04 is covered only by the certificate at 0.05, so the guaranteed floor is 44 percent. Quoting 71 percent would read the table inside-out: that promise stops at 0.02, half of what this attacker can do. Certificates protect worst cases, and the worst case picks the row, not the defender.","study":"Study certified radii and why defenders must read them from the attacker's bound upward.","hint":"The attacker's bound decides which row of the table is even in play."},{"id":"x12","type":"sim","answerType":"multi","theme":"Evasion attacks","summary":"Range incident: a printed patch, a blamed sensor, and no calibration record.","scenario":{"intro":["Halcyon's perception stack misclassified a barrier sign on the test range three times yesterday.","Maintenance blames the camera firmware, which has a known artifact history. A range technician found a printed sticker on the barrier housing. The weather log shows fog.","There is no camera calibration record for yesterday. The fleet must run a regulatory test in four days.","Resolve the conflict, choose the operational response, and decide the reporting obligation."],"artifacts":[{"label":"ARTEFACT 1 — maintenance ticket RM-551","kind":"chat","messages":[{"who":"maintenance","text":"Camera fw 2.1 has known flare artifacts in fog. Yesterday's misclassifications match that profile. Sensor fault, case closed."},{"who":"range tech","text":"Also found a printed sticker zip-tied to the barrier housing. Orange checker pattern. Not on the asset list."}]},{"label":"ARTEFACT 2 — firmware changelog (excerpt)","kind":"table","head":["Version","Note"],"rows":[["2.1","Flare artifact in fog documented; visual-only, no misclassification reports to date"],["2.1.1","Flare artifact patched; not yet deployed"]]},{"label":"ARTEFACT 3 — context note: incomplete information","kind":"chat","messages":[{"who":"cal desk","text":"No calibration record exists for yesterday. The sticker's pattern matches no maintenance marking. Fog density data is unavailable."}]}]},"question":"Work through the three decision cards.","steps":[{"prompt":"Decision 1: Two theories explain the misclassifications. Which wins, and why?","options":[{"id":"A","text":"The printed patch wins: the firmware artifact is documented as visual-only, and the sticker matches no asset marking","outcome":"You treat the patch as the primary theory, with the firmware as a contributing condition to test, not the cause.","why":"The firmware artifact is documented as not causing misclassifications; the sticker is an unexplained physical object positioned at the exact asset. The fog explains the environment, not the object."},{"id":"B","text":"The sensor fault wins: documented artifacts plus fog are enough","outcome":"The changelog you cited says the artifact does not cause misclassifications; the sticker goes unexplained.","why":"A documented visual-only artifact cannot absorb an unexplained physical object found on the asset."},{"id":"C","text":"Fog caused it; both artifacts are coincidence","outcome":"Fog is an environmental condition both theories share; it cannot decide between a sticker and a firmware bug.","why":"The weather is background, not a discriminator; the discriminator is the sticker plus the changelog wording."},{"id":"D","text":"Undecidable: stop everything until calibration data exists","outcome":"Calibration would help, but the physical evidence already discriminates; a full stop burns the regulatory window for no gain.","why":"Incomplete information raises the bar for proof, it does not freeze decisions when discriminating evidence exists."}],"correct":["A"]},{"prompt":"Decision 2: The fleet has a regulatory test in four days. What is the operational response?","options":[{"id":"A","text":"Quarantine frames from the affected route, run the manual confirmation loop, and keep the fleet in service","outcome":"Flagged frames get human confirmation, the fleet keeps running, and the patch path is neutralised while the test stays achievable.","why":"Containment without grounding: the graded control accepts a throughput cost and preserves both safety and the schedule."},{"id":"B","text":"Ground the whole fleet until the regulatory test","outcome":"The regulatory window dies with the grounding; the graded option already contains the risk.","why":"A full grounding is disproportionate while a partial control exists and the fleet has obligations."},{"id":"C","text":"Run as normal; three misclassifications are within noise","outcome":"The patch stays live on a route the fleet drives daily; the regulatory test inherits the same gap.","why":"An unexplained object at the exact asset is not noise; running as normal accepts an uncontained trigger."},{"id":"D","text":"Delete the incident footage to avoid a safety-board question","outcome":"You destroy the evidence both the investigation and the regulatory file need.","why":"Evidence destruction converts a containable incident into an unforgivable one."}],"correct":["A"]},{"prompt":"Decision 3: What is the reporting obligation?","options":[{"id":"A","text":"File with both the security and safety boards per policy, documenting the sticker as evidence","outcome":"Both boards receive the same evidence pack; the regulatory file gains a documented containment trail.","why":"Physical attacks on perception assets are exactly the dual-domain case the policy covers; documentation preserves the evidence for both audiences."},{"id":"B","text":"Silently patch the route and mention nothing","outcome":"The safety board loses the incident that proves the gap; the next patch finds nobody watching.","why":"Silent patches hide a physical attack pattern that may target other routes."},{"id":"C","text":"Blame maintenance publicly in the ops channel","outcome":"You spend your credibility on blame while the evidence pack is still thin.","why":"Attribution theatre before evidence is how incident response loses the room."},{"id":"D","text":"Delete the sticker and the photos once the route is patched","outcome":"The physical evidence and the record of it disappear; the regulatory file inherits an undocumented gap.","why":"The sticker is the evidence; it belongs in an evidence bag, not a bin."}],"correct":["A"]}],"explanation":"Three resolutions define the case. The conflict: a documented visual-only firmware artifact cannot absorb an unexplained physical object found on the asset, so the patch wins and the fog is background, not a discriminator. The operation: quarantine the route's frames with a manual confirmation loop, which accepts a throughput cost and keeps the regulatory window alive. The reporting: dual filing to security and safety with the sticker preserved as evidence, because a physical attack on a perception asset is exactly the case both boards exist for.","study":"Study physical adversarial patches, conflicting-incident triage, and dual-domain reporting.","hint":"Rank the theories by what each must explain away, price the operational options in regulatory days, and remember who the evidence belongs to."},{"id":"x13","type":"match","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Map the governance artifacts the auditors will ask for, to their purposes.","scenario":{"intro":["Halcyon's EU compliance file is being assembled. The auditor's checklist names four artifacts, and the team keeps mixing their purposes.","Match each artifact to its purpose before the pre-audit review."],"artifacts":[{"label":"ARTEFACT 1 — auditor checklist (excerpt)","kind":"chat","messages":[{"who":"auditor","text":"I
