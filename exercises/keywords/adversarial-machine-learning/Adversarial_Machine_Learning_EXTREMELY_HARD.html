will ask four questions. What is this model for and where does it fail? Where did the data come from? Which risks do you consider most important and why? What did you do before deploying? Expect artifact-backed answers."}]},{"label":"ARTEFACT 2 — context note","kind":"chat","messages":[{"who":"GRC lead","text":"A leaderboard screenshot is not an artifact we can submit. Answers must come from our own documents."}]}]},"question":"Drag each artifact to its purpose.","items":[{"id":"i1","text":"Model card"},{"id":"i2","text":"Datasheet for the training dataset"},{"id":"i3","text":"OWASP ML Top 10"},{"id":"i4","text":"EU AI Act conformity assessment"}],"targets":[{"id":"z1","label":"Documents a model's intended use, limits and evaluation summary","why":"The model card answers 'what is it for and where does it fail' in one artifact."},{"id":"z2","label":"Documents a dataset's provenance, collection and restrictions","why":"The datasheet answers the provenance question: where the data came from and what it may be used for."},{"id":"z3","label":"Industry-ranked list of the most important ML security risks","why":"The OWASP ML Top 10 is a risk-awareness catalogue used to justify which threats you addressed first."},{"id":"z4","label":"The pre-deployment compliance step for high-risk AI systems in the EU","why":"Conformity assessment is the process that must be completed before a high-risk system ships in the EU."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4"},"explanation":"Four artifacts, four purposes. The model card states intended use, limits and evaluations. The datasheet states dataset provenance and restrictions. The OWASP ML Top 10 ranks the risk landscape so your threat model has a defensible starting point. The EU AI Act conformity assessment is the pre-deployment process for high-risk systems. Auditors match artifacts to questions; a leaderboard screenshot answers none of the four questions and impresses none of the auditors.","study":"Study model cards, datasheets, the OWASP ML Top 10, and the conformity assessment concept.","hint":"One artifact is about the model, one about the data, one about the risk landscape, one about a legal process."},{"id":"x14","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"Dual perspective: run the extraction campaign, then break it with one control.","scenario":{"intro":["LedgerCore's scoring API is the target. Rate limits: 10 QPS per client. Outputs: full logits on request.","Part A: you are the red team, contracted, black-box, within the rate limits. Part B: you are the blue team, one control away from breaking the whole chain.","The engagement brief demands every step be defensible in the report."],"artifacts":[{"label":"ARTEFACT 1 — engagement brief (excerpt)","kind":"chat","messages":[{"who":"engagement lead","text":"Black-box only. Rate limits are part of the threat model, not an obstacle. Report every step a defender could have caught, so their absence is a finding too."}]},{"label":"ARTEFACT 2 — context note","kind":"chat","messages":[{"who":"blue desk","text":"Partners must keep working during and after any control change. A control that breaks partners fails the exercise."}]}]},"question":"Work through the four perspective steps in order.","steps":[{"prompt":"RED — Step 1: within 10 QPS, how do you build the extraction campaign?","options":[{"id":"A","text":"Train a surrogate on diverse, budgeted queries, then run adaptive perturbation search against the surrogate's boundary","outcome":"The surrogate learns the boundary region by region; adaptive search spends each query where it teaches the most.","why":"Surrogate-plus-adaptive search is the query-efficient extraction path; brute force wastes the budget it claims to save."},{"id":"B","text":"Send maximum random noise and label everything","outcome":"Random inputs teach the surrogate almost nothing about the boundary; the campaign stalls at low fidelity.","why":"Random queries have near-zero information content about decision boundaries; that is why adaptive search exists."},{"id":"C","text":"Poison the training pipeline while you are at it","outcome":"Out of scope and out of access: the engagement is black-box on the API, and the report would be indefensible.","why":"Scope discipline is part of red-team professionalism; a poisoned finding from an invalid access poisons the report."},{"id":"D","text":"Call the support desk until someone exports the weights","outcome":"That is social engineering outside this engagement's rules of engagement.","why":"The brief defines the surface; exceeding it is how engagements lose their legal cover."}],"correct":["A"]},{"prompt":"RED — Step 2: how do you keep the campaign under the defenders' radar?","options":[{"id":"A","text":"Mimic legitimate traffic distribution: volume, hours, and input entropy shaped like a real client","outcome":"Volume alerts stay green because the campaign looks statistically ordinary; only structural analysis would catch it.","why":"The attacker designs around the signals they assume exist: rate and volume. Distribution mimicry is the quiet path."},{"id":"B","text":"Run at full speed between 03:00 and 04:00","outcome":"The single high-volume window is the easiest alert the SOC owns; the campaign ends in one night.","why":"Volume spikes are the cheapest detection in the book; stealth means never creating one."},{"id":"C","text":"Send one giant batch and hope caching helps","outcome":"Batch anomalies are flagged faster than QPS; the request is throttled and logged.","why":"Shape matters as much as rate; a giant batch is a shape anomaly."},{"id":"D","text":"Reuse the same input forever to stay boring","outcome":"Zero distinct inputs means zero information gain; the campaign teaches nothing and the fidelity stays flat.","why":"Repetition is both useless for learning and trivially detectable as a stuck client."}],"correct":["A"]},{"prompt":"BLUE — Step 3: you get one control that must break the chain without breaking partners. Which?","options":[{"id":"A","text":"Per-client query-entropy anomaly budget, with watermarked label-only outputs as the default tier","outcome":"Distribution mimicry dies: entropy structure is invisible to the attacker's volume shaping, and label-only watermarked outputs cut the learning signal.","why":"Volume mimicry cannot fake input entropy structure; and the default output tier removes the per-record confidence signal the surrogate feeds on, while partners accept label-only."},{"id":"B","text":"Ban all third-party clients until further notice","outcome":"Partners break, revenue breaks, and the exercise brief is violated.","why":"A control that fails its own constraint is not a control, it is an outage."},{"id":"C","text":"Publish the attacker's signatures to the status page","outcome":"You teach the attacker exactly what to evade, mid-campaign, with no defensive gain.","why":"Disclosure without containment is a gift to the adversary."},{"id":"D","text":"Remove rate limits so traffic looks natural","outcome":"You remove the only control the attacker shaped around, and the campaign accelerates.","why":"Making the environment easier for the attacker is not a detection strategy."}],"correct":["A"]},{"prompt":"BLUE — Step 4: the campaign is contained. What is the correct post-incident move?","options":[{"id":"A","text":"Share sanitized indicators with the sector ISAC and update the ATLAS-mapped threat model","outcome":"Peers gain the pattern without your confidential details; your threat model gains the technique, not just the instance.","why":"Sector sharing plus a technique-level threat model update turns one incident into an organization-wide and industry-wide improvement."},{"id":"B","text":"Classify the incident and hide it entirely","outcome":"Peers stay exposed to the same campaign, and your threat model never learns the technique.","why":"Secrecy wastes the one asset incidents produce: real, current attacker behaviour."},{"id":"C","text":"Blame the API vendor publicly","outcome":"Attribution and vendor blame are unrelated here, and the statement ages badly.","why":"Post-incident discipline is about learning and sharing, not theatre."},{"id":"D","text":"Delete the case logs once the fix ships","outcome":"The evidence that justified the control and would defend it in a dispute is gone.","why":"Retention rules exist because post-incident disputes and reviews are normal."}],"correct":["A"]}],"explanation":"The chain and its breaking point. Red side: surrogate training plus adaptive search is the query-efficient path, and distribution mimicry is how it stays quiet. Blue side: volume-shaped stealth cannot fake input-entropy structure, and a default watermarked label-only tier removes the learning signal, so the one-control answer is the entropy budget plus output tiering. Post-incident, the value is technique-level: sanitized ISAC sharing and an ATLAS-mapped threat model update. Every step the report names as 'not caught' is also a finding, which is why the blue team reads the red team's report first.","study":"Study adaptive extraction chains, entropy-based detection, and post-incident knowledge sharing.","hint":"Red: each query must teach the surrogate something. Blue: find what the mimicry cannot shape, and what the surrogate feeds on."},{"id":"x15","type":"multi","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Halcyon asks which common recommendations must NOT be followed as-is.","scenario":{"intro":["Halcyon's context: heavy public-hub checkpoint dependency, FGSM-only evaluation culture, a benchmark-driven roadmap, and an upcoming EU compliance file.","A consultant deck lists six recommendations. Three are good practice. Three are wrong as-is in this context.","The CISO asks you to split the deck before the board reads it. Select every recommendation to REJECT as-is."],"artifacts":[{"label":"ARTEFACT 1 — consultant deck, recommendations slide","kind":"table","head":["#","Recommendation"],"rows":[["R1","Treat a top leaderboard position as proof of robustness"],["R2","Certify releases with FGSM-only evaluation"],["R3","Ship a preprocessing-only defense and declare the model safe"],["R4","Train adversarially at the threat-matched budget"],["R5","Write model cards for every release"],["R6","Sign every artifact and verify signatures in the registry"]]}]},"question":"Select every recommendation to reject as-is. Partial credit applies.","options":[{"id":"A","text":"R1 — leaderboard position as robustness proof"},{"id":"B","text":"R2 — FGSM-only release certification"},{"id":"C","text":"R3 — preprocessing-only defense, declared safe"},{"id":"D","text":"R4 — adversarial training at the threat-matched budget"},{"id":"E","text":"R5 — model cards for every release"},{"id":"F","text":"R6 — signed artifacts verified in the registry"}],"correct":["A","B","C"],"why":{"A":"Leaderboards are contestable environments with public data and no provenance chain; they measure a different model under a different threat model.","B":"FGSM-only certification is exactly the culture that hid the masking failure in your own adaptive evaluation; it certifies the flattering attack.","C":"Preprocessing-only defenses are the documented gradient-masking pattern: strong against FGSM, gone against an optimiser that models the transform.","D":"Good practice, keep it: threat-matched adversarial training has the strongest evidence base and a statable cost.","E":"Good practice, keep it: model cards are the artifact your EU file and your users both need.","F":"Good practice, keep it: signing plus registry verification is the provenance backbone, and it would have flagged your community checkpoint."},"explanation":"The three to reject are the three that substitute a proxy for evidence: a leaderboard position, a flattering attack, and a transform that only hides gradients. Each is defensible in some other world, for example a preprocessing demo or a teaching exercise, which is exactly what makes them dangerous here. The three to keep map to the three real levers: threat-matched training, documentation, and provenance. The rejection list is also your compliance risk register's first page.","study":"Study which practices are evidence and which are proxies, and why context decides.","hint":"Reject every recommendation that answers your threat model with someone else's evidence."},{"id":"x16","type":"terminal","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Compliance needs proof the production model matches the signed registry artifact.","scenario":{"intro":["The board signs the EU conformity file in one hour. The signature step requires proof that the production model binary matches the signed registry entry.","You are on the production host. The mount is read-only. The tool is sigtool.","Re-signing the artifact would fabricate the proof, and forcing a failed check would falsify the file. The evidence must come from a verification, not from a mutation.","Environment: Linux shell, read-only /srv/model, registry at /etc/registry.signed."]},"question":"Type and run the command that produces the verification proof.","terminal":{"title":"compliance@prod-host: /srv/model — simulated shell (read-only)","prompt":"$","motd":["prod-host (simulated), mount read-only.","artifact: /srv/model/current.bin","registry: /etc/registry.signed","Type a command and press Enter."],"objective":"Verify /srv/model/current.bin against /etc/registry.signed with sigtool and capture the proof.","accept":[{"find":"registry.signed","output":["sigtool: signature OK (ed25519, key compliance-2026)","sigtool: manifest digest matches /srv/model/current.bin","proof written to stdout; redirect to /mnt/evidence to retain"]}],"canonical":"sigtool verify /srv/model/current.bin --registry /etc/registry.signed","canonicalParts":["sigtool — the signature verification tool","verify — the subcommand that checks an artifact against a registry","/srv/model/current.bin — the artifact whose proof the file needs","--registry /etc/registry.signed — the signed source of truth the check compares against"],"dangerNote":"--sign would create a new signature instead of verifying the existing one: the proof would be fabricated. --force would override a failed check: the file would be falsified. Both are evidence mutations on a read-only host."},"checks":[{"label":"calls sigtool","find":"sigtool","ok":true},{"label":"uses the verify subcommand (not sign)","find":"verify","ok":true},{"label":"targets the production artifact /srv/model/current.bin","find":"/srv/model/current.bin","ok":true},{"label":"compares against the signed registry /etc/registry.signed","find":"registry.signed","ok":true},{"label":"re-signs the artifact instead of verifying it","re":"(\\s|^|\\-)sign(\\s|$)","ok":false,"why":"Signing creates new evidence instead of verifying old evidence; on a compliance file that is fabrication."},{"label":"forces a failed verification to pass","find":"--force","ok":false,"why":"--force overrides failure output, falsifying the conformity proof."},{"label":"deletes files on the host","find":"rm ","ok":false,"why":"The compliance file needs artifacts, not deletions."},{"label":"writes into the source path","find":"> /srv","ok":false,"why":"The mount is read-only by design; writing into /srv would alter the artifact."}],"explanation":"The proof is a verification, not a mutation: sigtool verify /srv/model/current.bin --registry /etc/registry.signed. Four elements are graded: the tool, the verify subcommand, the artifact, and the signed registry it is compared against. The two near-miss flags are the trap the exercise is built on: --sign fabricates a signature, and --force falsifies a failed check. Both would produce a document that looks like proof and is not, which is worse than no proof at all.","study":"Study verify-versus-sign workflows and why compliance evidence must come from verification.","hint":"The objective says 'proof that it matches the signed registry'. Which subcommand produces a match statement, and which produces a new claim?"},{"id":"x17","type":"sim","answerType":"multi","theme":"Evaluation, tools & governance","summary":"The board asks 'are we secure against adversarial ML?' and wants it in writing.","scenario":{"intro":["Halcyon's board, post-incident, asks one question and gives you fifteen minutes: 'Are we secure against adversarial machine learning?'","The honest inventory: robustness evaluations are FGSM-only; community checkpoints are unsigned; monitoring is volume-based only; there is no ATLAS mapping; the benchmark culture is strong.","An attacker inventory does not exist. The answer must be defensible in the minute, in the year, and in the audit.","Answer in three moves: the honest characterisation, the funded plan, and the risk register entry."],"artifacts":[{"label":"ARTEFACT 1 — assurance inventory (digest)","kind":"table","head":["Area","Current state"],"rows":[["Robustness evaluation","FGSM-only, no adaptive or transfer testing"],["Provenance","community checkpoints unsigned, registry partial"],["Monitoring","volume-based only, no input-structure analytics"],["Threat model","no ATLAS mapping, no attacker inventory"]]},{"label":"ARTEFACT 2 — context note: incomplete information","kind":"chat","messages":[{"who":"intel desk","text":"We cannot enumerate who would attack us or with what budget today. The inventory gap is itself a finding."}]}]},"question":"Work through the three decision cards.","steps":[{"prompt":"Decision 1: How do you characterise the current state to the board?","options":[{"id":"A","text":"Assurance is currently low: our evidence base cannot support a 'secure' claim, and the gap is itself documented","outcome":"The board receives a defensible 'not yet demonstrable' with the inventory attached; nobody can later claim they were told otherwise.","why":"A 'secure' answer would rest on FGSM-only evidence, unsigned provenance and volume-only monitoring, none of which survives an adaptive attacker or an auditor."},{"id":"B","text":"Secure: the benchmark scores are strong","outcome":"The benchmark is contestable and not your threat model; the claim dies at the first adaptive evaluation.","why":"Leaderboard evidence cannot answer a board-level security question; it is a proxy wearing a suit."},{"id":"C","text":"Secure: rate limits and TLS are in place","outcome":"Those are table stakes; the demonstrated attack paths in your own incidents bypassed both.","why":"Infrastructure controls do not answer model-level attack questions; the claim confuses layers."},{"id":"D","text":"Unknown, and unknowable without a full industry census first","outcome":"Perfectionism as delay; the inventory you have already supports a characterisation.","why":"'Unknowable' is false: you hold enough evidence to say 'low assurance, here is the gap list'."}],"correct":["A"]},{"prompt":"Decision 2: The board will fund one ordered plan. Which order do you propose?","options":[{"id":"A","text":"First adaptive robustness evaluation, then provenance and signing, then ATLAS-mapped monitoring","outcome":"The plan buys evidence first, provenance second, detection third, each unblocking the next.","why":"Evaluation tells you where you stand; provenance stops new poison entering while you fix it; monitoring catches what the first two cannot prevent. The order follows dependency, not fashion."},{"id":"B","text":"Buy a tool, deploy it, and declare the program complete","outcome":"A tool without evaluation discipline and provenance becomes the new masking story at the next audit.","why":"Tool-first programs measure what the tool finds, not what the threat model needs."},{"id":"C","text":"Hire a red team and defer all controls until their first report","outcome":"Months of unchanged exposure while checkpoints stay unsigned and evals stay FGSM-only.","why":"Testing without remediating is measurement without management; the exposure continues."},{"id":"D","text":"Wait for the regulator to define the requirements","outcome":"The EU file is due regardless; waiting converts a plan into a finding.","why":"Regulation sets a floor, not a strategy; the board asked for your plan, not the regulator's."}],"correct":["A"]},{"prompt":"Decision 3: What goes into the risk register today?","options":[{"id":"A","text":"The accepted residual risks, each with a named owner, a review date, and the evidence gap that justifies it","outcome":"Every accepted risk is owned, dated, and traceable to its gap; the register becomes the audit's strongest page.","why":"Registers exist to make acceptance explicit and reviewable; an entry without an owner or a date is a wish."},{"id":"B","text":"No entry: the board was briefed verbally","outcome":"Verbal briefings do not survive personnel changes or audits; the acceptance is unprovable.","why":"If acceptance is not written, it did not happen."},{"id":"C","text":"An entry stating zero residual risk","outcome":"A false register entry is worse than an honest one; it converts a gap into a misrepresentation.","why":"Zero-risk claims fail the first adaptive evaluation and then implicate everyone who signed."},{"id":"D","text":"An entry blaming the benchmark vendor","outcome":"The register records your risks and owners, not external blame; attribution is not acceptance.","why":"Blame entries are unactionable and auditors read them as deflection."}],"correct":["A"]}],"explanation":"Three moves, one discipline. Characterisation: 'secure' cannot be claimed on FGSM-only evaluations, unsigned provenance and volume-only monitoring, so the honest answer is low assurance with a documented gap list, especially with no attacker inventory. Plan: evidence first (adaptive evaluation), provenance second, ATLAS-mapped monitoring third, because each step unblocks the next. Register: accepted residual risks with named owners, review dates, and the gaps that justify them. That combination survives the minute, the year, and the audit, which is the standard a board-level answer must meet.","study":"Study board-level risk communication: honest characterisation, dependency-ordered plans, living registers.","hint":"Each card asks for something that must survive an auditor: a claim, a dependency order, and an ownership record."}]};

'use strict';
var DATA = window.EXAM_DATA || {};
var META = DATA.meta || {};
var EXS = DATA.exercises || [];
var SEVINFO = {
  'easy':{label:'EASY',cls:'sev-easy'},
  'medium':{label:'MEDIUM',cls:'sev-medium'},
  'hard':{label:'HARD',cls:'sev-hard'},
  'extremely-hard':{label:'EXTREMELY HARD',cls:'sev-extreme'}
};
var SEV = SEVINFO[META.difficulty] || SEVINFO.easy;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function byId(i){return document.getElementById(i);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtPts(p){var v=Math.round(p*10)/10;return (v%1===0)?String(v):v.toFixed(1);}
function fmtTime(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function normCmd(s){return String(s||'').toLowerCase().replace(/=/g,' ').replace(/-{3,}/g,'--').replace(/\s+/g,' ').trim();}
function findId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}

var S = {
  view:'intro', order:[], cur:0,
  answers:{}, graded:{}, skipped:{}, checked:{}, hintUsed:{},
  running:false, manualPause:false, autoPause:false,
  remaining:(META.timerSeconds||1800), reported:false, fromReview:false,
  pres:{}, exDeadline:null, warned:false, candidate:''
};
/* selection state for click-to-place widgets (match items / fill tokens) */
var SEL = { item:null, token:null };
function resetSel(){ SEL.item=null; SEL.token=null; }

/* ---------------- presentation shuffles (rebuilt per attempt) ---------------- */
function buildPres(i){
  var ex=EXS[i], p={};
  if(ex.type==='qcm'||ex.type==='multi'){ p.optOrder=shuffle(ex.options.map(function(o){return o.id;})); }
  if(ex.type==='match'){ p.itemOrder=shuffle(ex.items.map(function(it){return it.id;})); p.zoneOrder=ex.targets.map(function(z){return z.id;}); }
  if(ex.type==='order'){
    var eo=shuffle(ex.entries.map(function(e){return e.id;}));
    var same=ex.correctOrder.every(function(v,k){return eo[k]===v;});
    if(same && eo.length>1){ eo.push(eo.shift()); }
    p.entryOrder=eo;
  }
  if(ex.type==='fill'){ p.tokenOrder=shuffle(ex.tokens.slice()); }
  S.pres[i]=p;
}

/* ---------------- timer ---------------- */
function timerModeLabel(){
  if(S.manualPause) return '\u23f8 paused by you';
  if(S.autoPause) return '\u23f8 paused \u2014 review your feedback';
  return '\u25b6 running';
}
setInterval(function(){
  if(S.view!=='exam' && S.view!=='review') return;
  if(S.running && !S.manualPause && !S.autoPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; updateHead(); finishExam(true); return; }
    updateHead();
    if(S.exDeadline && !S.exOver){
      var left=Math.ceil((S.exDeadline-Date.now())/1000);
      var chip=byId('ex-timer-chip');
      if(chip){
        if(left>0){ chip.textContent='\u23f1 recommended time left: '+fmtTime(left); chip.classList.remove('late'); }
        else { chip.textContent='\u23f1 recommended time passed \u2014 the exam timer continues'; chip.classList.add('late'); }
      }
    }
  }
},1000);

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pres={};
  S.order.forEach(function(i){ buildPres(i); });
  S.cur=0; S.view='exam'; S.running=true; S.manualPause=false; S.autoPause=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.answers={}; S.graded={}; S.skipped={}; S.checked={}; S.hintUsed={};
  S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function curExIdx(){ return S.order[S.cur]; }
function curEx(){ return EXS[curExIdx()]; }

function ensureAnswer(exIdx){
  var ex=EXS[exIdx], a=S.answers[ex.id];
  if(a===undefined){
    if(ex.type==='multi') a=[];
    else if(ex.type==='match') a={};
    else if(ex.type==='order') a=S.pres[exIdx].entryOrder.slice();
    else if(ex.type==='fill') a={};
    else if(ex.type==='spot') a=[];
    else if(ex.type==='sim') a={};
    else if(ex.type==='num'||ex.type==='terminal') a='';
    else a=null;
    S.answers[ex.id]=a;
  }
  return a;
}
function answerReady(ex){
  var a=S.answers[ex.id];
  if(a===undefined||a===null) return false;
  switch(ex.type){
    case 'qcm': return a!==null;
    case 'multi': return a.length>0;
    case 'match': return Object.keys(a).length>0;
    case 'order': return true;
    case 'fill': return Object.keys(a).length>0;
    case 'spot': return a.length>0;
    case 'sim': return Object.keys(a).length===ex.steps.length;
    case 'num': return String(a).trim()!=='';
    case 'terminal': return String(a).trim()!=='';
  }
  return false;
}

function checkAnswer(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.checked[ex.id]) return;
  if(!answerReady(ex)){ S.warned=true; render(); return; }
  S.warned=false;
  S.graded[ex.id]=gradeEx(ex,exIdx);
  S.checked[ex.id]=true;
  S.autoPause=true;              /* auto-pause on Check: feedback stays readable */
  S.manualPause=false;           /* manual pause released if it was somehow set */
  render();
}
function useHint(){
  var ex=curEx();
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  render();
}
function skipCurrent(){
  var ex=curEx();
  if(!S.checked[ex.id]){ S.skipped[ex.id]=true; }
  goNext();
}
function goNext(){
  S.warned=false; S.autoPause=false; S.fromReview=false;
  S.exDeadline=null; S.exOver=false;
  if(S.cur>=S.order.length-1){ endFlow(); } else { S.cur++; render(); }
}
function endFlow(){
  var unanswered=S.order.filter(function(i){ var ex=EXS[i]; return !S.graded[ex.id]; });
  if(unanswered.length>0){ S.view='review'; render(); }
  else { finishExam(false); }
}
function finishExam(timedOut){
  S.running=false; S.autoPause=false; S.manualPause=false; S.timedOut=!!timedOut;
  S.view='results'; S.exDeadline=null; S.exOver=true;
  render();
  reportScore();
}
function retakeExam(){
  S.view='intro'; S.order=[]; S.cur=0; S.answers={}; S.graded={}; S.skipped={}; S.checked={};
  S.hintUsed={}; S.manualPause=false; S.autoPause=false; S.running=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.pres={}; S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function returnToSkipped(exIdx){
  S.cur=exIdx; S.fromReview=true; S.view='exam';
  S.autoPause=false; S.manualPause=false;
  render();
}

/* ---------------- grading ---------------- */
function gradeEx(ex,exIdx){
  var a=S.answers[ex.id];
  var T=1,C=0,W=0;
  var right=[],wrong=[],missed=[];
  function addItem(list,label,why){ list.push({label:label,why:why||''}); }

  if(ex.type==='qcm'){
    T=1;
    var ok=ex.correct.indexOf(a)>=0;
    if(ok){ C=1; addItem(right,optText(ex,a),optWhy(ex,a)); }
    else { W=1; addItem(wrong,optText(ex,a),optWhy(ex,a)); addItem(missed,correctText(ex),''); }
  }
  else if(ex.type==='multi'){
    T=ex.correct.length;
    ex.correct.forEach(function(cid){
      if(a.indexOf(cid)>=0){ C++; addItem(right,optText(ex,cid),optWhy(ex,cid)); }
      else { addItem(missed,optText(ex,cid),optWhy(ex,cid)); }
    });
    a.forEach(function(oid){
      if(ex.correct.indexOf(oid)<0){ W++; addItem(wrong,optText(ex,oid),optWhy(ex,oid)); }
    });
  }
  else if(ex.type==='match'){
    T=ex.items.length;
    ex.items.forEach(function(it){
      var zid=a[it.id], sol=ex.solution[it.id];
      var zObj=zid?findId(ex.targets,zid):null, sObj=findId(ex.targets,sol);
      if(zid===sol){ C++; addItem(right,it.text+' \u2192 '+sObj.label,(zObj&&zObj.why)||''); }
      else {
        var line=it.text+' \u2192 '+(zObj?zObj.label:'(no answer)')+' \u2014 correct: '+sObj.label;
        if(zid){ W++; addItem(wrong,line,(zObj&&zObj.why)||('Not the right match for this scenario.')); }
        else { addItem(missed,line,sObj.why||''); }
      }
    });
  }
  else if(ex.type==='order'){
    T=ex.entries.length;
    ex.entries.forEach(function(en,k){
      var placed=a[k], sol=ex.correctOrder[k];
      var pEn=findId(ex.entries,placed), sEn=findId(ex.entries,sol);
      if(placed===sol){ C++; addItem(right,(k+1)+'. '+sEn.text,''); }
      else {
        var line='Position '+(k+1)+': you placed "'+pEn.text+'", correct is "'+sEn.text+'"';
        W++; addItem(wrong,line,'');
      }
    });
  }
  else if(ex.type==='fill'){
    T=ex.blanks.length;
    ex.blanks.forEach(function(b,k){
      var got=a[k];
      if(got && (got===b.correct || (b.alt&&b.alt.indexOf(got)>=0))){
        C++; addItem(right,'Blank '+(k+1)+': "'+got+'" is correct.',b.why||'');
      } else {
        var line='Blank '+(k+1)+': you wrote "'+(got||'(empty)')+'", correct is "'+b.correct+'"';
        if(got){ W++; addItem(wrong,line,b.whyWrong||''); }
        else { addItem(missed,line,b.why||''); }
      }
    });
  }
  else if(ex.type==='spot'){
    T=ex.correctIds.length;
    ex.correctIds.forEach(function(lid){
      if(a.indexOf(lid)>=0){ C++; addItem(right,lineText(ex,lid),lineWhy(ex,lid)); }
      else { addItem(missed,lineText(ex,lid),lineWhy(ex,lid)); }
    });
    a.forEach(function(lid){
      if(ex.correctIds.indexOf(lid)<0){ W++; addItem(wrong,lineText(ex,lid),lineWhy(ex,lid)); }
    });
  }
  else if(ex.type==='sim'){
    T=ex.steps.length;
    ex.steps.forEach(function(st,k){
      var got=a[k];
      var okOpt=st.correct.indexOf(got)>=0;
      var gOpt=got?findId(st.options,got):null;
      var cOpt=findId(st.options,st.correct[0]);
      if(okOpt){ C++; addItem(right,'Step '+(k+1)+': '+cOpt.text,(gOpt&&gOpt.why)||''); }
      else {
        var line='Step '+(k+1)+': you chose "'+(gOpt?gOpt.text:'(no answer)')+'", better: "'+cOpt.text+'"';
        if(got){ W++; addItem(wrong,line,(gOpt&&gOpt.why)||''); }
        else { addItem(missed,line,cOpt.why||''); }
      }
    });
  }
  else if(ex.type==='num'){
    T=1;
    var v=parseFloat(String(a).replace(',','.'));
    var okNum=!isNaN(v)&&Math.abs(v-ex.value)<=ex.tolerance;
    if(okNum){ C=1; addItem(right,'Your value: '+v+(ex.unit?' '+ex.unit:''),ex.whyNum||''); }
    else { W=1; addItem(wrong,'Your value: '+String(a),'The correct value is '+ex.value+(ex.unit?' '+ex.unit:'')+'.'); }
  }
  else if(ex.type==='terminal'){
    var cmd=normCmd(a);
    T=0;
    function hit(ch){
      if(ch.re){ try{ return new RegExp(ch.re).test(cmd); }catch(e){ return false; } }
      return cmd.indexOf(ch.find)>=0;
    }
    (ex.checks||[]).forEach(function(ch){
      if(ch.ok){ T++; if(hit(ch)){ C++; addItem(right,ch.label,''); } else { addItem(missed,ch.label,ch.why||''); } }
      else { if(hit(ch)){ W++; addItem(wrong,ch.label,ch.why||''); } }
    });
    if(T===0){ T=1; }
  }

  var pts=Math.max(0,Math.floor((C-W)/T*100));
  if(pts>100) pts=100;
  if(S.hintUsed[ex.id]) pts=pts*0.9;
  return {pts:pts,T:T,C:C,W:W,right:right,wrong:wrong,missed:missed,raw:{C:C,W:W,T:T}};
}
function optText(ex,oid){ var o=findId(ex.options,oid); return o?o.text:String(oid); }
function optWhy(ex,oid){ var o=findId(ex.options,oid); return (o&&o.why)?o.why:''; }
function correctText(ex){ return optText(ex,ex.correct[0]); }
function lineText(ex,lid){ if(ex.artifact&&ex.artifact.lines){ var k=parseInt(lid.replace(/^\D+/,''),10); return 'Line '+k+': '+(ex.artifact.lines[k-1]||''); } return lid; }
function lineWhy(ex,lid){ return (ex.lineWhy&&ex.lineWhy[lid])||''; }

/* ---------------- live score ---------------- */
function scoreNow(){
  var earned=0,possible=0,n=0;
  S.order.forEach(function(i){ var ex=EXS[i],g=S.graded[ex.id]; if(g){ n++; earned+=g.pts; possible+=100; } });
  return {earned:earned,possible:possible,n:n};
}
function progressNow(){
  var done=0;
  S.order.forEach(function(i){ var ex=EXS[i]; if(S.graded[ex.id]||S.skipped[ex.id]) done++; });
  return S.order.length?Math.round(done/S.order.length*100):0;
}

/* ---------------- header ---------------- */
function updateHead(){
  var t=byId('xh-timer'), sc=byId('xh-score'), pr=byId('xh-bar'), sk=byId('xh-skipped');
  if(t){ t.innerHTML=esc(timerModeLabel())+' \u00b7 <span class="tval">'+esc(fmtTime(S.remaining))+'</span>'; }
  if(sc){ var s=scoreNow(); sc.textContent=fmtPts(s.earned)+' / '+s.possible+' pts'; }
  if(pr){ pr.style.width=progressNow()+'%'; }
  if(sk){
    var k=S.order.filter(function(i){ return S.skipped[EXS[i].id]&&!S.graded[EXS[i].id]; }).length;
    sk.textContent='Review skipped ('+k+')';
    sk.className='btn ghost'+(k>0?' attention':'');
  }
}

/* ---------------- site integration ---------------- */
function reportScore(){
  if(S.reported) return;
  var s=scoreNow();
  if(s.possible<=0) return;
  var score=Math.round(s.earned*10), total=s.possible*10;
  var percent=Math.round(score/total*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score:score, total:total, percent:percent, passed:percent>=META.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
  S.reported=true;
}
window.addEventListener('message',function(ev){
  var d=ev&&ev.data; if(!d) return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT') return;
  try{
    if(d.username){ S.candidate=String(d.username); var el=byId('cand-name'); if(el){ el.textContent='Candidate: '+S.candidate; } }
  }catch(e){}
});

/* ---------------- rendering ---------------- */
function render(){
  var app=byId('app');
  if(S.view==='intro'){ app.innerHTML=DATA.intro; updateHead(); var cn=byId('cand-name'); if(cn&&S.candidate){ cn.textContent='Candidate: '+S.candidate; } return; }
  if(S.view==='exam'){ renderExam(); return; }
  if(S.view==='review'){ renderReview(); return; }
  renderResults();
}

function headHTML(){
  var s=scoreNow();
  return '<header class="xhead">'
    +'<div class="xh-left"><span class="xh-count" id="xh-count"></span> <span class="sev-badge '+SEV.cls+'">'+esc(SEV.label)+'</span></div>'
    +'<div class="xh-mid"><div class="xh-row"><span class="xh-timer" id="xh-timer"></span><span class="xh-score" id="xh-score"></span></div>'
    +'<div class="xh-progress"><div class="bar" id="xh-bar"></div></div></div>'
    +'<div class="xh-right">'
    +'<button class="btn ghost" data-act="hint" id="xh-hint">Hint (\u221210%)</button>'
    +'<button class="btn ghost" data-act="pause" id="xh-pause">Pause</button>'
    +'<button class="btn ghost" data-act="skip" id="xh-skip">Skip</button>'
    +'<button class="btn ghost" data-act="open-review" id="xh-skipped">Review skipped (0)</button>'
    +'<button class="btn ghost" data-act="finish" id="xh-finish">Finish</button>'
    +'</div></header>';
}

function setHeadEnabled(enabled){
  ['xh-hint','xh-pause','xh-skip','xh-skipped','xh-finish'].forEach(function(id){
    var b=byId(id); if(b){ b.disabled=!enabled; }
  });
}

function renderExam(){
  var exIdx=curExIdx(), ex=EXS[exIdx], g=S.graded[ex.id];
  var html=headHTML();
  html+='<div class="stage" id="stage">';
  if(S.manualPause){
    html+='<div class="pause-overlay"><h2>\u23f8 Paused by you</h2>'
      +'<p>The exercise is hidden while you pause. The timer is stopped. Press Resume when you are ready \u2014 the exercise comes back exactly as it was.</p>'
      +'<button class="btn primary" data-act="resume">Resume</button></div>';
  }
  html+='<div class="card"'+(S.manualPause?' style="visibility:hidden"':'')+'>';
  html+=scenarioHTML(ex);
  if(ex.timeLimit && !g){
    var left=Math.max(0,Math.ceil(((S.exDeadline||0)-Date.now())/1000));
    html+='<div class="ex-chip" id="ex-timer-chip">\u23f1 recommended time left: '+fmtTime(left||(ex.timeLimit))+'</div>';
  }
  html+='<div class="block q"><div class="block-head">\u25c6 Question</div><div class="block-body"><p class="q-text"><strong>'+esc(ex.question)+'</strong></p></div></div>';
  html+='<div class="block ans"><div class="block-head">\u25c6 Your answer</div><div class="widget" id="widget">'+widgetHTML(ex,exIdx)+'</div>';
  if(ex.type==='multi'||(ex.type==='sim')){ }
  html+='</div>';
  if(g){ html+=feedbackHTML(ex,g); }
  html+='<div class="navrow">';
  if(!g){
    html+='<button class="btn primary" data-act="check">Check</button>';
    if(S.warned){ html+='<span class="checkmsg">Choose an answer first \u2014 or press Skip if you want to come back later.</span>'; }
  } else {
    var last=(S.cur>=S.order.length-1);
    html+='<button class="btn primary" data-act="next">'+(last?'Finish exam':'Next exercise')+'</button>';
  }
  html+='<span class="spacer"></span></div>';
  html+='</div></div>';
  byId('app').innerHTML=html;
  updateHead();
  var cnt=byId('xh-count'); if(cnt){ cnt.textContent='Exercise '+(S.cur+1)+' of '+S.order.length; }
  var hb=byId('xh-hint');
  if(hb){ hb.disabled=!!(S.hintUsed[ex.id]||g); }
  var sb=byId('xh-skip');
  if(sb){ sb.disabled=!!g; }
  var pb=byId('xh-pause');
  if(pb){ pb.textContent=S.manualPause?'Resume':'Pause'; pb.disabled=!!g&&false; }
  if(ex.timeLimit && !g && !S.exDeadline && !S.exOver){
    S.exDeadline=Date.now()+ex.timeLimit*1000; S.exOver=false;
  }
  if(ex.type==='terminal'){ focusTerm(); }
}

function scenarioHTML(ex){
  var sc=ex.scenario||{};
  var h='<div class="block scen" id="scenblock"><div class="block-head">\u25c6 Scenario'
    +'<button class="mini" data-act="toggle-scen" id="scen-tgl">Collapse</button></div>'
    +'<div class="block-body"><p class="scen-summary">'+esc(ex.summary)+'</p><div class="scen-extra">';
  (sc.intro||[]).forEach(function(p){ h+='<p>'+esc(p)+'</p>'; });
  (sc.artifacts||[]).forEach(function(a,ai){
    h+='<div class="artefact"><div class="af-label">'+esc(a.label||('ARTEFACT '+(ai+1)))+'</div><div class="af-body">'+artifactHTML(a,ex)+'</div></div>';
  });
  h+='</div></div></div>';
  return h;
}

function hi(s){
  var out='', re=/(\/\/[^\s]+|\b(?:INFO|WARN|ERROR|DEBUG|FAILED|ERRORS|DENIED|ALLOWED|BLOCKED|ALERT|CRITICAL)\b|\b\d{2}:\d{2}:\d{2}\b|\d{1,3}(?:\[\.\]){3}\d{1,3}|hxxps?:\/\/\S+|\b\d+(?:\.\d+)?%?\b)/g;
  var last=0,m;
  while((m=re.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    var t=m[0], cls='t-num';
    if(/^\/\//.test(t)) cls='t-ip';
    else if(t==='INFO'||t==='DEBUG'||t==='ALLOWED') cls='t-info';
    else if(t==='WARN') cls='t-warn';
    else if(t==='ERROR'||t==='FAILED'||t==='DENIED'||t==='BLOCKED'||t==='ALERT'||t==='CRITICAL'||t==='ERRORS') cls='t-bad';
    else if(/^\d{2}:\d{2}:\d{2}$/.test(t)) cls='t-time';
    else if(/^\/\//.test(t)||t.indexOf('[') >=0 ||t.indexOf('hxxp')===0) cls='t-ip';
    out+='<span class="'+cls+'">'+esc(t)+'</span>';
    last=m.index+t.length;
  }
  out+=esc(s.slice(last));
  return out;
}

function artifactHTML(a,ex){
  if(a.kind==='log'){
    var h='<div class="logtools"><input type="text" data-act="logfilter" placeholder="Filter lines (plain text, e.g. a client id)" aria-label="Filter log lines"><span class="cnt" id="logcnt"></span></div><div class="mlog" id="logbody">';
    a.lines.forEach(function(ln,i){ h+='<span class="ln-row" data-ln="'+(i+1)+'">'+hi(ln)+'</span>'; });
    h+='</div>';
    return h;
  }
  if(a.kind==='code'||a.kind==='lines'){
    var h2='<div class="code-lines">';
    a.lines.forEach(function(ln,i){
      var lid=(a.idPrefix||'l')+(i+1);
      if(ex && ex.type==='spot'){
        var flagged=S.answers[ex.id]&&S.answers[ex.id].indexOf(lid)>=0;
        h2+='<button type="button" class="cl'+(flagged?' flag':'')+'" data-act="line" data-id="'+lid+'"><span class="ln">'+(i+1)+'</span><code>'+esc(ln)+'</code></button>';
      } else {
        h2+='<div class="ln-row"><span class="ln" style="color:var(--faint);min-width:26px;display:inline-block">'+(i+1)+'</span><code>'+esc(ln)+'</code></div>';
      }
    });
    return h2+'</div>';
  }
  if(a.kind==='table'){
    var h3='<table class="arttab"><thead><tr>';
    a.head.forEach(function(c){ h3+='<th>'+esc(c)+'</th>'; });
    h3+='</tr></thead><tbody>';
    a.rows.forEach(function(r){ h3+='<tr>'; r.forEach(function(c,ci){ h3+='<td'+(ci>0?' class="num"':'')+'>'+esc(c)+'</td>'; }); h3+='</tr>'; });
    return h3+'</tbody></table>';
  }
  if(a.kind==='chat'){
    var h4='';
    a.messages.forEach(function(m){ h4+='<div class="chatline"><span class="who">'+esc(m.who)+'</span>'+esc(m.text)+'</div>'; });
    return h4;
  }
  var h5='';
  (a.paragraphs||[]).forEach(function(p){ h5+='<p>'+esc(p)+'</p>'; });
  return h5;
}

/* ---------------- widgets ---------------- */
function widgetHTML(ex,exIdx){
  var a=ensureAnswer(exIdx), p=S.pres[exIdx], h='';
  if(ex.type==='qcm'||ex.type==='multi'){
    h+='<div class="opts">';
    p.optOrder.forEach(function(oid,k){
      var o=findId(ex.options,oid);
      var sel=(ex.type==='qcm')?(a===oid):(a.indexOf(oid)>=0);
      h+='<button type="button" class="opt'+(sel?' sel':'')+'" data-act="opt" data-id="'+oid+'" aria-pressed="'+(sel?'true':'false')+'">'
        +'<span class="lab">'+String.fromCharCode(65+k)+'.</span><span>'+esc(o.text)+'</span></button>';
    });
    h+='</div>';
    if(ex.type==='multi') h+='<p class="multi-note">Select all that apply. More than one answer can be correct. Partial credit is possible.</p>';
    return h;
  }
  if(ex.type==='match'){
    h+='<div class="match-grid"><div><p class="multi-note" style="margin:0 0 4px">Items \u2014 click an item, then click its zone (or drag it).</p>';
    p.itemOrder.forEach(function(iid){
      var it=findId(ex.items,iid);
      var used=Object.keys(a).some(function(k){return k===iid;});
      var sel=SEL.item===iid;
      h+='<button type="button" class="m-item'+(sel?' sel':'')+(used?' used':'')+'" draggable="true" data-act="m-item" data-id="'+iid+'">'+esc(it.text)+'</button>';
    });
    h+='</div><div>';
    ex.targets.forEach(function(z){
      h+='<div class="m-zone" data-act="m-zone" data-id="'+z.id+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(z.label)+'"><div class="mz-label">'+esc(z.label)+'</div>';
      Object.keys(a).forEach(function(itemId){
        if(a[itemId]===z.id){
          var it=findId(ex.items,itemId);
          h+='<div class="mz-chip"><span>'+esc(it.text)+'</span><button type="button" data-act="m-unassign" data-id="'+itemId+'" aria-label="Return item to the bank">\u2715</button></div>';
        }
      });
      h+='</div>';
    });
    return h+'</div></div>';
  }
  if(ex.type==='order'){
    h+='<ol class="ord">';
    a.forEach(function(eid,k){
      var en=findId(ex.entries,eid);
      h+='<li class="ord-item" draggable="true" data-act="ord-item" data-id="'+eid+'"><span class="pos">'+(k+1)+'</span><span class="txt">'+esc(en.text)+'</span>'
        +'<span class="ord-btn"><button type="button" data-act="ord-up" data-id="'+eid+'" aria-label="Move up">\u2191</button>'
        +'<button type="button" data-act="ord-down" data-id="'+eid+'" aria-label="Move down">\u2193</button></span></li>';
    });
    return h+'</ol><p class="multi-note">Drag the rows (or use the arrows) to put them in the required order.</p>';
  }
  if(ex.type==='fill'){
    h+='<p class="fill-sent">';
    ex.parts.forEach(function(part,k){
      h+=esc(part);
      if(k<ex.blanks.length){
        var got=a[k];
        h+='<button type="button" class="blank'+(got?' filled':'')+'" data-act="blank" data-k="'+k+'" aria-label="Blank '+(k+1)+(got?', filled with '+got:'')+'">'+(got?esc(got):'\u00a0\u00a0\u00a0\u00a0')+'</button>';
      }
    });
    for(var bk=ex.parts.length;bk<ex.blanks.length;bk++){
      var got2=a[bk];
      h+='<button type="button" class="blank'+(got2?' filled':'')+'" data-act="blank" data-k="'+bk+'" aria-label="Blank '+(bk+1)+(got2?', filled with '+got2:'')+'">'+(got2?esc(got2):'\u00a0\u00a0\u00a0\u00a0')+'</button>';
    }
    h+='</p><p class="multi-note">Word bank \u2014 click a word, then click a blank. Click a filled blank to empty it. Some words are wrong on purpose.</p><div class="bank">';
    p.tokenOrder.forEach(function(t){
      var sel=SEL.token===t;
      h+='<button type="button" class="token'+(sel?' sel':'')+'" data-act="token" data-t="'+esc(t)+'">'+esc(t)+'</button>';
    });
    return h+'</div>';
  }
  if(ex.type==='spot'){
    h+='<p class="multi-note" style="margin:0 0 8px">Click every line you want to flag. Click again to unflag.</p>';
    h+=artifactHTML(ex.artifact,ex);
    return h;
  }
  if(ex.type==='num'){
    h+='<div class="numwrap"><input type="text" inputmode="decimal" id="numin" data-act="num" value="'+esc(a)+'" aria-label="Numeric answer"> <span class="unit">'+esc(ex.unit||'')+'</span></div>';
    if(ex.note) h+='<p class="multi-note">'+esc(ex.note)+'</p>';
    return h;
  }
  if(ex.type==='sim'){
    h+='<div class="sim-steps">';
    for(var k=0;k<ex.steps.length;k++){
      var st=ex.steps[k], chosen=a[k];
      var isCurrent=(chosen===undefined)&&!exLocked(ex);
      if(chosen===undefined && k>0 && a[k-1]===undefined){ break; }
      h+='<div class="sim-step'+(chosen!==undefined?' done':'')+'"><div class="ss-head">Step '+(k+1)+' of '+ex.steps.length+'</div>';
      h+='<p>'+esc(st.prompt)+'</p><div class="opts">';
      st.options.forEach(function(o,oi){
        var isChosen=(chosen===o.id);
        var disabled=(chosen!==undefined);
        h+='<button type="button" class="opt'+(isChosen?' sel':'')+(disabled?' lock':'')+'" data-act="sim-opt" data-step="'+k+'" data-id="'+o.id+'"'+(disabled?' disabled':'')+' aria-pressed="'+(isChosen?'true':'false')+'">'
          +'<span class="lab">'+String.fromCharCode(65+oi)+'.</span><span>'+esc(o.text)+'</span></button>';
      });
      h+='</div>';
      if(chosen!==undefined){
        var co=findId(st.options,chosen);
        if(co&&co.outcome){ h+='<div class="outcome">'+esc(co.outcome)+'</div>'; }
      }
      h+='</div>';
      if(chosen===undefined){ break; }
    }
    if(exLocked(ex)){ h+='<p class="sim-locked">All steps answered. Press Check to see your score for this exercise.</p>'; }
    else if(Object.keys(a).length<ex.steps.length){ h+='<p class="sim-locked">Answer the current step to unlock the next one.</p>'; }
    return h+'</div>';
  }
  if(ex.type==='terminal'){
    var t=ex.terminal||{};
    if(t.syntaxPanel){

function feedbackHTML(ex,g){
  var pts=g.pts;

  if(pts>=100){ head='\u2713 Correct'; cls='fb-ok'; }

  if(S.hintUsed[ex.id]) h+='<p class="dim" style="color:var(--muted)">Hint used: the maximum for this exercise was 90 points before partial credit.</p>';
  var isMulti=(ex.type==='multi'||ex.type==='match'||ex.type==='order'||ex.type==='fill'||ex.type==='spot'||ex.type==='sim'||(ex.type==='terminal'&&g.T>1));
  if(isMulti&&g.wrong.length===0&&g.missed.length===0&&g.right.length>0){
    h+='<ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>';
  } else if(isMulti){
    if(g.right.length){ h+='<h4>What you got right</h4><ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.wrong.length){ h+='<h4>What you got wrong</h4><ul class="fb-list-wrong">'+g.wrong.map(function(r){ return '<li>\u2717 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.missed.length){ h+='<h4>What you missed</h4><ul class="fb-list-missed">'+g.missed.map(function(r){ return '<li>\u25cb '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
  }
  if(ex.type==='terminal'){
    var t=ex.terminal||{};
    h+='<h4>Canonical command</h4><div class="copywrap"><pre class="mono" id="canon-cmd">'+esc(t.canonical)+'</pre><button class="copybtn" data-act="copy-canon">Copy</button></div>';
    (t.canonicalParts||[]).forEach(function(part){ h+='<p class="dim" style="color:var(--muted);margin:5px 0">\u2014 '+esc(part)+'</p>'; });
    if(g.wrong.length&&t.dangerNote){ h+='<p class="warnline">\u26a0 '+esc(t.dangerNote)+'</p>'; }

  if(!isMulti && pts<100 && (ex.type==='qcm'||ex.type==='num')){
    h+='<h4>Correct answer</h4><p>'+esc(correctSummary(ex))+'</p>';
  }

  if(ex.study){ h+='<p class="dim" style="color:var(--muted)">What to study next: '+esc(ex.study)+'</p>'; }
  h+='</div></section>';
  return h;
}

/* ---------------- results ---------------- */
function computeResults(){
  var answered=0,earned=0,full=0,part=0,zero=0,excl=0;
  var themes={};
  S.order.forEach(function(i){
    var ex=EXS[i], g=S.graded[ex.id];
    var t=themes[ex.theme]||(themes[ex.theme]={n:0,full:0,part:0,zero:0,excl:0,pts:0});
    if(g){
      answered++; earned+=g.pts;
      if(g.pts>=100){ full++; t.full++; } else if(g.pts>0){ part++; t.part++; } else { zero++; t.zero++; }
      t.n++; t.pts+=g.pts;
    } else { excl++; t.excl++; }
  });
  var possible=answered*100;
  var percent=possible>0?Math.round(earned/possible*100):0;
  return {answered:answered,earned:earned,possible:possible,percent:percent,full:full,part:part,zero:zero,excl:excl,themes:themes,passed:percent>=META.passMark};
}

function answerSummary(ex,g){
  var a=S.answers[ex.id];
  if(a===undefined||a===null){
    switch(ex.type){
      case 'multi': case 'spot': a=[]; break;
      case 'match': case 'fill': case 'sim': a={}; break;
      case 'order': a=(S.pres[S.order.indexOf(EXS.indexOf(ex))]&&S.pres[S.order.indexOf(EXS.indexOf(ex))].entryOrder)?S.pres[S.order.indexOf(EXS.indexOf(ex))].entryOrder.slice():ex.entries.map(function(e){return e.id;}); break;
      default: a='';
    }
  }
  switch(ex.type){
    case 'qcm': return optText(ex,a);
    case 'multi': return a.length?a.map(function(o){return optText(ex,o);}).join('; '):'(none selected)';
    case 'match': return ex.items.map(function(it){ var z=a[it.id]; return it.text+' \u2192 '+(z?findId(ex.targets,z).label:'(none)'); }).join('; ');
    case 'order': return a.map(function(eid,k){ var en=findId(ex.entries,eid); return (k+1)+'. '+en.text; }).join('  |  ');
    case 'fill': return ex.blanks.map(function(b,k){ return a[k]?String(a[k]):'(empty)'; }).join('; ');
    case 'spot': return a.length?a.map(function(lid){ return lineText(ex,lid); }).join('; '):'(nothing flagged)';
    case 'sim': return ex.steps.map(function(st,k){ var ch=a[k]; return 'Step '+(k+1)+': '+(ch?findId(st.options,ch).text:'(none)'); }).join('  |  ');
    case 'num': return String(a)+' '+(ex.unit||'');
    case 'terminal': return String(a);
  }
  return '';
}
function correctSummary(ex){
  switch(ex.type){
    case 'qcm': return correctText(ex);
    case 'multi': return ex.correct.map(function(o){return optText(ex,o);}).join('; ');
    case 'match': return ex.items.map(function(it){ return it.text+' \u2192 '+findId(ex.targets,ex.solution[it.id]).label; }).join('; ');
    case 'order': return ex.correctOrder.map(function(eid,k){ return (k+1)+'. '+findId(ex.entries,eid).text; }).join('  |  ');
    case 'fill': return ex.blanks.map(function(b,k){ return 'Blank '+(k+1)+': '+b.correct; }).join('; ');
    case 'spot': return ex.correctIds.map(function(lid){ return lineText(ex,lid); }).join('; ');
    case 'sim': return ex.steps.map(function(st,k){ return 'Step '+(k+1)+': '+findId(st.options,st.correct[0]).text; }).join('  |  ');
    case 'num': return ex.value+' '+(ex.unit||'');
    case 'terminal': return ex.terminal.canonical;
  }
  return '';
}

/* ---------------- events ---------------- */
function refreshWidget(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  var w=byId('widget');
  if(w){ w.innerHTML=widgetHTML(ex,exIdx); }
}
function moveEntry(eid,dir){
  var exIdx=curExIdx(), ex=EXS[exIdx], a=S.answers[ex.id];
  var k=a.indexOf(eid), j=k+dir;
  if(k<0||j<0||j>=a.length) return;
  var t=a[k];a[k]=a[j];a[j]=t;
  refreshWidget();
}
function reorderTo(eid,targetEid){
  var exIdx=curExIdx(), ex=EXS[exIdx], a=S.answers[ex.id];
  var from=a.indexOf(eid), to=a.indexOf(targetEid);
  if(from<0||to<0||from===to) return;
  a.splice(from,1);
  to=a.indexOf(targetEid);
  a.splice(from<to?to+1:to,0,eid);
  refreshWidget();
}
function focusTerm(){
  var inp=byId('term-in');
  if(inp&&!(S.checked[curEx().id])){ try{ inp.focus(); }catch(e){} }
}
function runCommand(){
  var exIdx=curExIdx(), ex=EXS[exIdx], t=ex.terminal||{};
  var inp=byId('term-in');
  if(!inp) return;
  var raw=inp.value;
  S.answers[ex.id]=raw;
  var scroll=byId('term-scroll');
  if(!scroll) return;
  if(!TERM_LOG[ex.id]) TERM_LOG[ex.id]=[];
  var cmd=normCmd(raw);
  if(!cmd){ return; }
  TERM_LOG[ex.id].push({cls:'cmd',text:(t.prompt||'$')+' '+raw});
  var printed=false;
  (t.accept||[]).forEach(function(ac){
    if(!printed&&cmd.indexOf(ac.find)>=0){ (ac.output||[]).forEach(function(o){ TERM_LOG[ex.id].push({cls:'out',text:o}); }); printed=true; }
  });
  if(!printed){
    var firstWord=cmd.split(' ')[0]||'';
    TERM_LOG[ex.id].push({cls:'err',text:'bash: '+firstWord+': command not found (this simulated shell only recognises the command this exercise needs)'});
  }
  var h='';
  TERM_LOG[ex.id].forEach(function(l){ h+='<div class="'+l.cls+'">'+esc(l.text)+'</div>'; });
  scroll.innerHTML=h;
  scroll.scrollTop=scroll.scrollHeight;
  inp.value='';
  S.answers[ex.id]=raw;   /* keep the last typed command as the graded answer */
}

function onClick(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.getAttribute&&n.getAttribute('data-act'))){ n=n.parentNode; }
  if(!n||n===document||!n.getAttribute) return;
  var act=n.getAttribute('data-act'), id=n.getAttribute('data-id');
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.view==='intro'){ if(act==='start'){ startExam(); } return; }
  if(S.view==='review'){
    if(act==='return'){ returnToSkipped(parseInt(n.getAttribute('data-idx'),10)); }
    else if(act==='submit-exam'){ finishExam(false); }
    else if(act==='finish'){ endFlow(); }
    return;
  }
  if(S.view==='results'){
    if(act==='retake'){ retakeExam(); }
    else if(act==='copy-canon'){ try{ var pre=byId('canon-cmd'); if(pre&&navigator.clipboard){ navigator.clipboard.writeText(pre.textContent); n.textContent='Copied'; } }catch(e){} }
    return;
  }
  /* exam view */
  if(act==='toggle-scen'){
    var blk=byId('scenblock');
    blk.classList.toggle('scen-collapsed');
    n.textContent=blk.classList.contains('scen-collapsed')?'Expand':'Collapse';
    return;
  }
  if(act==='resume'){ S.manualPause=false; render(); return; }
  if(act==='pause'){ S.manualPause=!S.manualPause; render(); return; }
  if(act==='hint'){ useHint(); return; }
  if(act==='skip'){ skipCurrent(); return; }
  if(act==='finish'){ endFlow(); return; }
  if(act==='open-review'){ endFlow(); return; }
  if(act==='check'){ checkAnswer(); return; }
  if(act==='next'){ goNext(); return; }
  if(S.checked[ex.id]&&act!=='copy-canon'){ return; }
  if(act==='opt'){
    if(ex.type==='qcm'){ S.answers[ex.id]=id; }
    else { var arr=S.answers[ex.id]; var ix=arr.indexOf(id); if(ix>=0){arr.splice(ix,1);} else {arr.push(id);} }
    S.warned=false; refreshWidget(); return;
  }
  if(act==='m-item'){ SEL.item=(SEL.item===id)?null:id; refreshWidget(); return; }
  if(act==='m-zone'){
    if(SEL.item){ S.answers[ex.id][SEL.item]=id; SEL.item=null; refreshWidget(); }
    return;
  }
  if(act==='m-unassign'){ delete S.answers[ex.id][id]; refreshWidget(); return; }
  if(act==='ord-up'){ moveEntry(id,-1); return; }
  if(act==='ord-down'){ moveEntry(id,1); return; }
  if(act==='token'){ var tid=n.getAttribute('data-t'); SEL.token=(SEL.token===tid)?null:tid; refreshWidget(); return; }
  if(act==='blank'){
    var k=parseInt(n.getAttribute('data-k'),10);
    if(S.answers[ex.id][k]!==undefined&&S.answers[ex.id][k]!==null){ delete S.answers[ex.id][k]; }
    else if(SEL.token){ S.answers[ex.id][k]=SEL.token; SEL.token=null; }
    refreshWidget(); return;
  }
  if(act==='line'){
    var arr2=S.answers[ex.id]; var ix2=arr2.indexOf(id);
    if(ix2>=0){ arr2.splice(ix2,1); } else { arr2.push(id); }
    S.warned=false; refreshWidget(); return;
  }
  if(act==='sim-opt'){
    var step=parseInt(n.getAttribute('data-step'),10);
    S.answers[ex.id][step]=id;
    S.warned=false; refreshWidget(); return;
  }
  if(act==='copy-canon'){ try{ var pre2=byId('canon-cmd'); if(pre2&&navigator.clipboard){ navigator.clipboard.writeText(pre2.textContent); n.textContent='Copied'; } }catch(e){} return; }
}
function onKey(ev){
  var act=ev.target&&ev.target.getAttribute?ev.target.getAttribute('data-act'):null;
  if(act==='cmd'&&ev.key==='Enter'){ ev.preventDefault(); runCommand(); return; }
  if(act==='num'){ var ex=curEx(); S.answers[ex.id]=ev.target.value; S.warned=false; return; }
  if(act==='cmd'){ var ex2=curEx(); S.answers[ex2.id]=ev.target.value; return; }
  /* keyboard activation for non-button controls (match drop zones) */
  if((ev.key==='Enter'||ev.key===' ')&&act&&ev.target&&ev.target.tagName!=='BUTTON'&&ev.target.tagName!=='INPUT'){
    ev.preventDefault(); ev.target.click(); return;
  }
}
function onInput(ev){
  var act=ev.target&&ev.target.getAttribute?ev.target.getAttribute('data-act'):null;
  if(act==='num'){
    var ex=curEx(); S.answers[ex.id]=ev.target.value; S.warned=false; return;
  }
  if(act==='cmd'){
    var ex2=curEx(); S.answers[ex2.id]=ev.target.value; return;
  }
  if(act==='logfilter'){
    var q=String(ev.target.value||'').toLowerCase();
    var body=byId('logbody'), cnt=byId('logcnt');
    if(body){
      var rows=body.querySelectorAll('.ln-row'), shown=0;
      rows.forEach(function(r){
        var txt=r.textContent.toLowerCase();
        var show=!q||txt.indexOf(q)>=0;
        r.style.display=show?'':'none';
        if(show) shown++;
      });
      if(cnt) cnt.textContent=shown+' of '+rows.length+' lines';
    }
  }
}
function onDragStart(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.getAttribute&&n.getAttribute('data-act'))){ n=n.parentNode; }
  if(!n||n===document) return;
  var act=n.getAttribute('data-act');
  if(act==='m-item'||act==='ord-item'){
    ev.dataTransfer.setData('text/plain',n.getAttribute('data-id'));
    ev.dataTransfer.effectAllowed='move';
    if(n.classList){ n.classList.add('dragging'); }
  }
}
function onDragEnd(ev){
  var n=ev.target;
  if(n&&n.classList){ n.classList.remove('dragging'); }
}
function onDragOver(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList){
    if(n.classList.contains('m-zone')){ ev.preventDefault(); n.classList.add('over'); }
    else if(n.classList.contains('ord-item')){ ev.preventDefault(); n.classList.add('drop-into'); }
  }
}
function onDragLeave(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList){ n.classList.remove('over'); n.classList.remove('drop-into'); }
}
function onDrop(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList&&n.classList.contains('m-zone')){
    ev.preventDefault();
    n.classList.remove('over');
    var eid=ev.dataTransfer.getData('text/plain');
    var zid=n.getAttribute('data-id');
    var ex=curEx();
    if(eid&&zid&&ex.type==='match'&&ex.items.some(function(it){return it.id===eid;})){
      S.answers[ex.id][eid]=zid; SEL.item=null; refreshWidget();
    }
    return;
  }
  if(n&&n!==document&&n.classList&&n.classList.contains('ord-item')){
    ev.preventDefault();
    var eid2=ev.dataTransfer.getData('text/plain');
    var tid=n.getAttribute('data-id');
    var ex2=curEx();
    if(eid2&&tid&&eid2!==tid&&ex2.type==='order'&&ex2.entries.some(function(e){return e.id===eid2;})){
      reorderTo(eid2,tid);
    }
  }
}
function initExam(){
  var app=byId('app');
  app.addEventListener('click',onClick);
  app.addEventListener('keydown',onKey);
  app.addEventListener('input',onInput);
  app.addEventListener('dragstart',onDragStart);
  app.addEventListener('dragend',onDragEnd);
  app.addEventListener('dragover',onDragOver);
  app.addEventListener('dragleave',onDragLeave);
  app.addEventListener('drop',onDrop);
  render();
}
document.addEventListener('DOMContentLoaded',initExam);

</script>
