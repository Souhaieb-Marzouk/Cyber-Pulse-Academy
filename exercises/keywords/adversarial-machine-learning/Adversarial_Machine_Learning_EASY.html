<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>Adversarial Machine Learning — EASY practice exam</title>
<script type="application/json" id="cm-exercise-meta">

<style>

:root{
  --bg:#0b1220; --bg2:#0d1526; --panel:#121c33; --panel2:#0f1930; --ink:#0a1120;
  --line:#26365a; --line2:#33477a;
  --text:#e8eefb; --muted:#aab8d6; --faint:#8296bd;
  --scen:#4f8ef7; --scenbg:#101d3a;
  --q:#f5a524; --qbg:#241d0b;
  --ans:#37c26e; --ansbg:#0e2718;
  --ok:#37c26e; --part:#f5a524; --bad:#f0564a; --skip:#9aa8c4;
  --sev-easy:#37c26e; --sev-medium:#f5a524; --sev-hard:#f97316; --sev-extreme:#f0564a;
  --focus:#8ec2ff;
  --mono:'Cascadia Code','Sarasa Mono SC',Consolas,'DejaVu Sans Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);
  font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;}
#app{max-width:1060px;margin:0 auto;padding:0 16px 64px}
code,pre,.mono{font-family:var(--mono)}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--focus)}

/* ---------- persistent exam header ---------- */
.xhead{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 4px;margin:0 -16px 18px;padding-left:16px;padding-right:16px}
.xh-count{font-weight:700;white-space:nowrap}
.sev-badge{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.06em;
  border:1px solid;padding:5px 10px;border-radius:999px;white-space:nowrap;min-height:24px}
.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(55,194,110,.10)}
.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(245,165,36,.10)}
.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(249,115,22,.10)}
.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(240,86,74,.12)}
.xh-mid{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.xh-row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.xh-timer{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap}
.xh-timer .mode{color:var(--muted);font-weight:600;font-size:13px}
.xh-score{font-family:var(--mono);font-size:15px;color:var(--muted);white-space:nowrap}
.xh-progress{height:6px;background:#1a2646;border-radius:99px;overflow:hidden}
.xh-progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#37c26e);transition:width .4s ease}
.xh-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#172441;color:var(--text);
  cursor:pointer;font-weight:600;transition:transform .08s ease,background .15s ease}
.btn:hover{background:#1d2d52}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2f6fed,#37c26e);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--q);color:var(--q)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.blank:focus-visible,.token:focus-visible,.m-item:focus-visible,
.m-zone:focus-visible,.cl:focus-visible,.ord-btn button:focus-visible,.mini:focus-visible,input:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px}
.mini{min-height:44px;min-width:44px;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

/* ---------- intro ---------- */
.hero{padding:26px 4px 8px}
.hero .kicker{color:var(--focus);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.hero h1{margin:6px 0 10px;font-size:32px}
.hero .sub{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:13.5px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.panel h2{margin:0 0 10px;font-size:19px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--focus)}
.panel p{margin:8px 0;color:var(--text)}
.panel .dim{color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.theme-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.theme-card h3{margin:0 0 8px;font-size:15px;color:var(--focus)}
.tcon{display:flex;flex-wrap:wrap;gap:6px}
.tcon span{background:#16244a;border:1px solid var(--line);border-radius:8px;padding:3px 9px;
  font-size:12.5px;color:var(--muted)}
.rules li{margin:6px 0}
.rules ul{padding-left:22px;margin:6px 0}
.start-row{display:flex;gap:14px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.cand{color:var(--muted);font-size:14px}
.note{border-left:3px solid var(--q);background:var(--qbg);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.note.blue{border-left-color:var(--scen);background:var(--scenbg)}
.note.green{border-left-color:var(--ans);background:var(--ansbg)}

/* ---------- exercise layout: three blocks ---------- */
.card{margin:0 0 26px}
.block{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:800;letter-spacing:.08em;
  font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.block-head .mini{margin-left:auto;text-transform:none;letter-spacing:0}
.block.scen{border-left:4px solid var(--scen)}
.block.scen .block-head{color:var(--scen);background:var(--scenbg)}
.block.q{border-left:4px solid var(--q)}
.block.q .block-head{color:var(--q);background:var(--qbg)}
.block.ans{border-left:4px solid var(--ans)}
.block.ans .block-head{color:var(--ans);background:var(--ansbg)}
.block-body{padding:14px 16px}
.scen-collapsed .scen-extra{display:none}
.scen-summary{margin:2px 0 8px;color:var(--focus);font-weight:600}
.scen-extra p{margin:8px 0}
.artefact{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);margin:12px 0;overflow:hidden}
.artefact .af-label{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--focus);border-bottom:1px solid var(--line);
  background:#0e1834}
.artefact .af-body{padding:10px 12px}
.artefact p{margin:8px 0}
.q-text{margin:6px 0 2px}
.q-text strong{font-size:17px}

/* monospace log/code rendering */
.logtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.logtools input{flex:1;background:#0a1224;border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:9px 12px;min-height:44px;font-family:var(--mono);font-size:14px}
.logtools .cnt{color:var(--faint);font-size:12.5px;white-space:nowrap}
pre.mono,div.mlog{background:#0a1224;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6;margin:0}
div.mlog .ln-row{display:block;white-space:pre-wrap}
code .t-info{color:#7dd3fc}code .t-warn{color:#fbbf24}code .t-bad{color:#f87171}
code .t-num{color:#c4b5fd}code .t-ip{color:#6ee7b7}code .t-time{color:#94a3b8}code .t-str{color:#fca5a5}
table.arttab{border-collapse:collapse;width:100%;font-size:14.5px}
table.arttab th,table.arttab td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.arttab th{background:#0e1834;color:var(--focus);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
table.arttab td.num{font-family:var(--mono)}
.chatline{margin:8px 0;padding:8px 12px;border-radius:10px;background:#16224a;border:1px solid var(--line)}
.chatline .who{font-weight:700;color:var(--focus);font-size:13.5px;margin-right:8px}

/* ---------- answer widgets ---------- */
.widget{padding:14px 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 14px;
  border-radius:10px;border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer}
.opt:hover{background:#182748}
.opt.sel{border-color:var(--focus);background:#1a2c56}
.opt.lock{cursor:default}
.opt .lab{font-weight:800;color:var(--focus);min-width:26px}
.multi-note{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.match-grid{grid-template-columns:1fr}}
.m-item{display:block;width:100%;text-align:left;min-height:48px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer;margin:8px 0}
.m-item.sel{border-color:var(--focus);background:#1a2c56}
.m-item.used{opacity:.55}
.m-zone{border:1.5px dashed var(--line2);border-radius:12px;padding:10px 12px;min-height:64px;margin:8px 0;
  background:#0e1834;cursor:pointer}
.m-zone.over{border-color:var(--focus)}
.mz-label{font-weight:700;color:var(--focus);font-size:14px;margin-bottom:6px}
.mz-chip{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#1a2c56;
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin:6px 0}
.mz-chip button{background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:15px;min-width:44px;min-height:44px}
.ord{list-style:none;margin:0;padding:0}
.ord-item{display:flex;gap:10px;align-items:center;background:#131f3d;border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin:8px 0;cursor:grab}
.ord-item.dragging{opacity:.5}
.ord-item .pos{font-family:var(--mono);font-weight:800;color:var(--focus);min-width:24px}
.ord-item .txt{flex:1}
.ord-item.drop-into{border-color:var(--focus);border-style:dashed}
.ord-btn{display:flex;gap:4px}
.ord-btn button{background:#0e1834;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  min-width:44px;min-height:44px;cursor:pointer;font-size:15px}
.fill-sent{line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border-radius:8px;border:1.5px dashed var(--line2);
  background:#0e1834;color:var(--text);padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:14.5px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--ans);background:var(--ansbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.token{background:#16244a;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;min-height:44px;
  color:var(--text);cursor:pointer;font-family:var(--mono);font-size:14.5px}
.token.sel{border-color:var(--focus);background:#1a2c56}
.code-lines{display:flex;flex-direction:column;gap:4px}
.cl{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0a1224;border:1px solid transparent;
  border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);font-family:var(--mono);font-size:14.5px;min-height:44px}
.cl:hover{border-color:var(--line2)}
.cl.flag{border-color:var(--q);background:#241d0b}
.cl .ln{color:var(--faint);min-width:26px}
.cl.flag .ln{color:var(--q)}
.cl code{white-space:pre-wrap}
.numwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numwrap input{background:#0a1224;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  padding:10px 12px;min-height:44px;font-family:var(--mono);font-size:15.5px;width:150px}
.numwrap .unit{color:var(--muted)}
.sim-step{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:10px 0}
.sim-step .ss-head{font-weight:800;color:var(--q);letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin-bottom:6px}
.sim-step .outcome{margin:10px 0 2px;padding:9px 12px;border-left:3px solid var(--line2);background:#0c1428;
  border-radius:0 8px 8px 0;color:var(--muted)}
.sim-step.done{opacity:.92}
.sim-locked{color:var(--faint);font-size:13.5px;margin-top:8px}

/* terminal */
.term{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#05080f}
.term-bar{padding:8px 12px;background:#0e1834;color:var(--focus);font-size:13px;font-weight:700;
  border-bottom:1px solid var(--line);font-family:var(--mono)}
.term-scroll{padding:12px 14px;max-height:300px;overflow-y:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6}
.term-scroll .cmd{color:#7dd3fc}
.term-scroll .err{color:#f87171}
.term-scroll .out{color:#c9d6f2}
.term-input{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px}
.term-input .ps1{color:var(--ans);font-family:var(--mono);font-weight:700}
.term-input input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);
  font-size:14.5px;min-height:44px}
.synpanel{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:12px 0}
.synpanel h4{margin:0 0 8px;font-size:14px;color:var(--focus)}
.synpanel table{border-collapse:collapse;font-size:13.5px;width:100%}
.synpanel td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
.synpanel td.f{font-family:var(--mono);color:#7dd3fc;white-space:nowrap}
.ex-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:#0e1834;
  border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);margin:6px 6px 0 0;font-family:var(--mono)}
.ex-chip.late{color:var(--q);border-color:var(--q)}

/* ---------- feedback ---------- */
.feedback{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:800;letter-spacing:.05em;
  font-size:14px;text-transform:uppercase}
.fb-ok{border-left:4px solid var(--ok)} .fb-ok .fb-head{color:var(--ok);background:rgba(55,194,110,.10)}
.fb-part{border-left:4px solid var(--part)} .fb-part .fb-head{color:var(--part);background:rgba(245,165,36,.10)}
.fb-bad{border-left:4px solid var(--bad)} .fb-bad .fb-head{color:var(--bad);background:rgba(240,86,74,.10)}
.fb-body{padding:14px 16px}
.fb-body h4{margin:12px 0 6px;font-size:14.5px}
.fb-body ul{margin:4px 0;padding-left:22px}
.fb-body li{margin:5px 0}
.fb-list-right li{color:#b8ecc9}
.fb-list-wrong li{color:#f6c1bc}
.fb-list-missed li{color:#fde9b8}
.pts-line{font-family:var(--mono);font-weight:700;color:var(--text)}
.copywrap{position:relative;margin:10px 0}
.copywrap pre{padding-right:64px}
.copybtn{position:absolute;top:8px;right:8px;min-height:44px;padding:4px 12px;border-radius:8px;
  border:1px solid var(--line2);background:#16244a;color:var(--muted);cursor:pointer;font-size:12.5px}
.warnline{color:var(--q);font-weight:600;margin:8px 0}
.navrow{display:flex;gap:12px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.checkmsg{color:var(--q);font-weight:600}

/* pause overlay */
.stage{position:relative}
.pause-overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:rgba(8,12,24,.97);border:1px solid var(--line);
  border-radius:14px;text-align:center;padding:20px}
.pause-overlay h2{margin:0}
.pause-overlay p{color:var(--muted);max-width:52ch}

/* ---------- review & results ---------- */
.rv-item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;flex-wrap:wrap}
.rv-item .rv-title{flex:1;min-width:240px}
.rv-item .rv-tag{color:var(--skip);font-size:13px}
.res-hero{border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.res-hero.pass{border-color:var(--ok);background:linear-gradient(180deg,rgba(55,194,110,.10),rgba(55,194,110,.02))}
.res-hero.fail{border-color:var(--bad);background:linear-gradient(180deg,rgba(240,86,74,.10),rgba(240,86,74,.02))}
.res-hero .big{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-hero .verdict{font-size:20px;font-weight:800;letter-spacing:.14em;margin:6px 0}
.res-hero .pts{color:var(--muted);font-family:var(--mono)}
.res-bar{height:12px;border-radius:99px;background:#1a2646;overflow:hidden;margin:16px auto 6px;max-width:560px}
.res-bar .bar{height:100%;width:0;transition:width 1s ease}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:13px}
.rep-item{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:12px 0;overflow:hidden}
.rep-head{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rep-head .st{font-weight:800;font-size:13.5px}
.rep-head .st.ok{color:var(--ok)} .rep-head .st.part{color:var(--part)}
.rep-head .st.bad{color:var(--bad)} .rep-head .st.skip{color:var(--skip)}
.rep-head .rp-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.rep-body{padding:12px 16px}
.rep-body .qa{margin:8px 0;color:var(--muted)}
.rep-body .qa b{color:var(--text)}
.theme-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.theme-table th,.theme-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.theme-table th{background:#0e1834;color:var(--focus);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
@media (max-width:720px){
  .hero h1{font-size:25px}
  .xh-right{margin-left:0}
}
.hidden{display:none}

</style>
</head>
<body>

window.EXAM_DATA = {"meta":{"topicId":"adversarial-machine-learning","batch":1,"title":"Adversarial Machine Learning — EASY","pageTitle":"Adversarial Machine Learning — EASY practice exam","difficulty":"easy","questionCount":18,"estimatedMinutes":30,"passMark":70,"timerSeconds":1800},"intro":"<div class=\"hero\"><div class=\"kicker\">Cyber Pulse Academy practice exam<\/div><h1>Adversarial Machine Learning<\/h1><p class=\"sub\">A hands-on certification exam on one keyword: <b>Adversarial Machine Learning<\/b>. Everything runs inside this single page. Nothing is sent anywhere.<\/p><div class=\"chips\"><span class=\"chip\">18 exercises<\/span><span class=\"chip\">Timer: 30 minutes<\/span><span class=\"chip\">Pass mark: 70%<\/span><span class=\"chip\">100 points per exercise<\/span><span class=\"chip\">Partial credit for multi-answer exercises<\/span><\/div><\/div><div class=\"panel\"><h2>Keywords covered<\/h2><p class=\"dim\">The keyword expands into the concept groups below. Every group is exercised in this exam family; each difficulty tier covers it at its own depth.<\/p><div class=\"theme-grid\"><div class=\"theme-card\"><h3>Evasion attacks<\/h3><div class=\"tcon\"><span>Adversarial example<\/span><span>Perturbation<\/span><span>Perturbation budget (epsilon)<\/span><span>FGSM<\/span><span>PGD<\/span><span>C&amp;W attack<\/span><span>DeepFool<\/span><span>Adversarial patch<\/span><span>Physical-world attack<\/span><span>Black-box / grey-box / white-box<\/span><span>Transferability<\/span><span>Query-based attack<\/span><span>L0 / L2 / L-inf norms<\/span><\/div><\/div><div class=\"theme-card\"><h3>Poisoning &amp; supply chain<\/h3><div class=\"tcon\"><span>Data poisoning<\/span><span>Label flipping<\/span><span>Backdoor (Trojan) attack<\/span><span>Trigger<\/span><span>BadNets<\/span><span>Supply-chain poisoning<\/span><span>Federated learning poisoning<\/span><span>Data validation<\/span><\/div><\/div><div class=\"theme-card\"><h3>Model theft &amp; privacy<\/h3><div class=\"tcon\"><span>Model extraction<\/span><span>Model inversion<\/span><span>Membership inference<\/span><span>Attribute inference<\/span><span>Watermarking<\/span><span>Honeypots<\/span><span>Differential privacy<\/span><\/div><\/div><div class=\"theme-card\"><h3>Defenses &amp; robustness<\/h3><div class=\"tcon\"><span>Adversarial training<\/span><span>Defensive distillation<\/span><span>Gradient masking<\/span><span>Input preprocessing<\/span><span>Randomization<\/span><span>Randomized smoothing<\/span><span>Ensembles<\/span><span>Adversarial-input detection<\/span><span>Robust aggregation<\/span><span>Monitoring &amp; drift<\/span><\/div><\/div><div class=\"theme-card\"><h3>Evaluation, tools &amp; governance<\/h3><div class=\"tcon\"><span>Clean vs robust accuracy<\/span><span>Attack success rate<\/span><span>RobustBench<\/span><span>AutoAttack<\/span><span>Adversarial Robustness Toolbox (ART)<\/span><span>Foolbox<\/span><span>CleverHans<\/span><span>Counterfit<\/span><span>MITRE ATLAS<\/span><span>OWASP ML Top 10<\/span><span>NIST AI RMF<\/span><span>EU AI Act<\/span><span>Model cards &amp; datasheets<\/span><span>Model registry &amp; signing<\/span><span>AI red teaming<\/span><span>Risk register<\/span><span>MLOps pipeline security<\/span><\/div><\/div><\/div><\/div><div class=\"panel\"><h2>What you will learn (plain language)<\/h2><p>Welcome. In this exam you will learn what Adversarial Machine Learning means and where you will meet it at work.<\/p><p>Imagine you train a model to label photos. The model works well. Then someone finds inputs that look normal to you but get wrong answers from the model. That trick is called an adversarial example, and it is the heart of this topic.<\/p><p>Adversarial Machine Learning is the study of attacks on machine learning models and the defenses against them. The main attacks are: evasion (crafted inputs fool a live model), poisoning (bad data corrupts training), model extraction (many queries steal a copy of the model), and inversion (the model leaks private training data).<\/p><p>Who uses this at work? SOC analysts see alerts about strange query patterns. Incident responders handle models that were poisoned or copied. GRC teams write the rules: model cards, threat models, and risk registers. Engineers build defenses like adversarial training and input validation. Red teams test models before attackers do.<\/p><p>Which tools and documents will you meet? MITRE ATLAS collects known attacks. The Adversarial Robustness Toolbox, Foolbox, CleverHans and Counterfit help to test and defend models. RobustBench lists how strong public models are. Teams write model cards, threat model documents and robustness test reports.<\/p><p>What daily tasks use it? Validating new training data, watching API query logs, running robustness tests before release, and writing findings into tickets and reports. The risks it addresses: wrong decisions from fooled models, stolen models, poisoned pipelines, and private data leaking out of models.<\/p><p>Read the rules below, then start. Each exercise teaches one clear idea. Hints are allowed and cost a little, and the explanations after every answer will teach you even when you are wrong.<\/p><\/div><div class=\"panel\"><h2>This tier: EASY — foundations<\/h2><p>EASY builds your foundations. Every exercise here tests exactly one idea, in short sentences, with clear guidance on what to look at. Wrong options are wrong for obvious reasons once you know the concept. If you read the introduction above, the hints are strong enough to guide you home.<\/p><\/div><div class=\"panel\"><h2>How scoring works<\/h2><div class=\"rules\"><ul><li>Every exercise is worth <b>100 points<\/b>.<\/li><li>Exercises with exactly one correct answer are all-or-nothing: right means 100, wrong means 0.<\/li><li>Multi-answer exercises give <b>partial credit<\/b>. If you find some of the correct answers, you get some of the points. Wrong picks cancel right picks: points = (correct picks − wrong picks) ÷ total correct picks × 100, never below 0.<\/li><li>The <b>Hint<\/b> button costs 10% of that exercise's points (one hint per exercise). The hint gives you a nudge, never the answer. Using a hint does not pause the timer.<\/li><li>Live score in the header counts only exercises you have actually answered.<\/li><li>You pass with <b>70%<\/b> or more over the answered exercises. Skipped-and-never-answered exercises are excluded from both your points and the total.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Timer rules (two ways the clock stops)<\/h2><div class=\"rules\"><ul><li>You have <b>30 minutes<\/b> in total for all 18 exercises.<\/li><li><b>Manual pause:<\/b> press Pause in the header for a break. The exercise is hidden and the clock stops until you press Resume.<\/li><li><b>Pause after Check:<\/b> when you press Check, the clock stops by itself so you can read the explanation with free time. The exercise and the feedback stay fully visible.<\/li><li>The clock starts again the moment you press Next. Pressing Hint or Skip never pauses the clock.<\/li><li>If time runs out, the exam closes and your score is computed over what you answered.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Skipping and finishing<\/h2><div class=\"rules\"><ul><li>Every exercise has a <b>Skip<\/b> button. Skipping is free and does not reveal the answer.<\/li><li>Before the exam can finish, a <b>Review skipped<\/b> screen lists everything you skipped. You can return to any of it, as many times as you need, while the timer runs.<\/li><li>If you submit while some exercises are still unanswered, those are marked <b>⚠ Not answered — excluded from score<\/b>. They do not help or hurt your percentage.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Exercise types in this exam<\/h2><p>Multiple choice (a maximum of five), matching pairs, sorting into buckets, fill-in-the-blank, timeline ordering, short decision cards, and one guided terminal exercise with a syntax reminder panel.<\/p><p class=\"dim\">Every exercise screen shows the same three blocks, always in the same order: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber), <b>YOUR ANSWER<\/b> (green). Long scenarios can be collapsed with the button in the scenario header; a one-line summary stays visible.<\/p><\/div><div class=\"start-row\"><button class=\"btn primary\" data-act=\"start\">Start the exam<\/button><span class=\"cand\" id=\"cand-name\"><\/span><\/div>","exercises":[{"id":"e01","type":"qcm","answerType":"single","theme":"Evasion attacks","summary":"A photo classifier calls a panda a gibbon after tiny pixel changes.","scenario":{"intro":["Imagine you run a photo service. A researcher shows your team a photo of a panda.","Your model answers 'gibbon' with 88 percent confidence. To people, the photo looks completely normal.","The researcher says they changed fewer than one pixel value in a thousand. Your team checks the file. It is still a clear panda photo."]},"question":"Which option best describes what the researcher did?","options":[{"id":"B","text":"Stole a full copy of the model by sending thousands of queries"},{"id":"C","text":"Deleted training images from the dataset before training started"},{"id":"A","text":"Added tiny, invisible changes to one image so the model mislabels it"},{"id":"D","text":"Changed the model's code on the server during the night shift"}],"correct":["A"],"explanation":"This is an adversarial example. The attacker makes very small changes to one input. People cannot see the changes. The model reads numbers, so the changes push its answer to a wrong label. Nothing was stolen and the model itself was not changed.","study":"Study 'adversarial examples' and how small perturbations change a model's output.","hint":"This is about the model's answer to one changed input, not about the model itself."},{"id":"e02","type":"match","answerType":"multi","theme":"Evasion attacks","summary":"Five short case notes from the training handbook need the right attack names.","scenario":{"intro":["You are preparing for your first ML security shift.","Your team lead gives you five short case notes from the handbook.","Match each note to the attack name it describes."]},"question":"Drag each note to the attack name it describes.","items":[{"id":"i1","text":"An attacker changes live inputs slightly so a working model gives wrong answers."},{"id":"i2","text":"An attacker sneaks bad examples into the training data so the model learns wrong behaviour."},{"id":"i3","text":"An attacker sends many queries and trains a private copy that behaves like the target model."},{"id":"i4","text":"An attacker crafts inputs that make a model reveal private data it memorised during training."},{"id":"i5","text":"By studying a model's answers, an attacker works out a private fact, for example a health group, about the people in its training data."}],"targets":[{"id":"z1","label":"Evasion attack","why":"Evasion happens at inference time: the deployed model is fooled by crafted inputs."},{"id":"z2","label":"Data poisoning","why":"Poisoning attacks the training data, so the damage happens before deployment."},{"id":"z3","label":"Model extraction","why":"Extraction steals the model's behaviour through repeated queries."},{"id":"z4","label":"Model inversion","why":"Inversion pulls training data or attributes back out of the model."},{"id":"z5","label":"Attribute inference","why":"Attribute inference recovers a sensitive property of the training records from the model's answers."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4","i5":"z5"},"explanation":"These are the classic attack families. Evasion fools the live model. Poisoning corrupts its training data. Extraction steals a copy of it. Inversion pulls private training information back out. Attribute inference is the quietest one: it leaks facts about the people in the training data through ordinary-looking answers. Knowing which family you face decides who must respond: data teams for poisoning, API owners for extraction.","study":"Study the attack names: evasion, poisoning, extraction, inversion and attribute inference.","hint":"Ask yourself one question per note: when did the damage happen, before training, after deployment, or through the answers?"},{"id":"e03","type":"qcm","answerType":"single","theme":"Evasion attacks","summary":"An outsider can only send images and read back the labels.","scenario":{"intro":["A vendor test shows someone probing your image API.","The person has no access to the model's weights, its code, or the servers.","They only send images and read the labels and confidence scores that come back."]},"question":"What kind of threat model is this?","options":[{"id":"C","text":"White-box, because the attacker can reach the public API address"},{"id":"A","text":"Black-box, because the attacker only sees the model's answers"},{"id":"D","text":"Grey-box, because the attacker sends many images per minute"},{"id":"B","text":"White-box, because the attacker also sees confidence scores"}],"correct":["A"],"explanation":"In a black-box attack the attacker sees only the outputs: labels and scores. White-box means the attacker can also read the model's internals, like weights or gradients. A public API address says nothing about internal access, and the number of images does not change the threat model.","study":"Study the three threat models: black-box, grey-box and white-box.","hint":"The answer is in what the attacker can and cannot see."},{"id":"e04","type":"sim","answerType":"single","theme":"Evasion attacks","summary":"A printed sticker on a real stop sign makes a car camera read a speed limit.","scenario":{"intro":["A city pilot project uses cameras to read traffic signs.","During a test drive, researchers stick a small printed sticker on a real stop sign.","The car's system reads the sign as 'speed limit 80'. People see harmless-looking graffiti.","The sticker was printed on purpose to fool the camera model in the physical world."]},"question":"Choose the correct name for this attack.","steps":[{"prompt":"What is this attack called?","options":[{"id":"A","text":"Data poisoning of the sign-recognition model","outcome":"The team checks the training data. It is clean, so training-time poisoning does not fit.","why":"Poisoning changes training data; here a live camera was fooled."},{"id":"B","text":"An adversarial patch in the physical world","outcome":"Correct. A printed pattern that fools a camera model is an adversarial patch.","why":"An adversarial patch is a printed or built pattern that keeps working in the physical world."},{"id":"C","text":"Model extraction through the camera API","outcome":"No model was copied. The camera misread one physical sign.","why":"Extraction means stealing the model's behaviour with many queries."},{"id":"D","text":"Label flipping by a lab assistant","outcome":"The labels in the dataset are fine. The problem is on the street.","why":"Label flipping corrupts training labels; this happened at inference time."}],"correct":["B"]}],"explanation":"A printed sticker that fools a camera model is an adversarial patch. Because it works on a real object in the real world, it is also a physical-world attack. Physical attacks are special: the attacker cannot control lighting or angle perfectly, so the pattern must survive those changes.","study":"Study 'adversarial patch' and 'physical-world attacks' on traffic signs.","hint":"This is about a printed pattern placed on the object itself."},{"id":"e05","type":"fill","answerType":"single","theme":"Evasion attacks","summary":"Complete the definition of an adversarial example.","scenario":{"intro":["Your study group is writing flashcards.","This card defines the core idea of the whole topic."]},"question":"Complete the sentence with the right word from the bank.","parts":["An adversarial example is a "],"blanks":[{"correct":"normal-looking","why":"The key trick: an adversarial example looks normal to people but fools the model."}],"tokens":["normal-looking","encrypted","larger","deleted"],"explanation":"An adversarial example looks normal to people but gets a wrong label from the model. It is not encrypted, larger, or deleted. The danger comes exactly from this mix: harmless-looking input, wrong answer.","study":"Practise the definition of an adversarial example until you can say it in one sentence.","hint":"The trick of this attack is that the input still looks harmless to humans."},{"id":"e06","type":"match","answerType":"multi","theme":"Defenses & robustness","summary":"Sort five items into attack or defense before your first shift.","scenario":{"intro":["Before your first shift, your lead checks that you can tell attacks from defenses.","Sort the five items into the two buckets."]},"question":"Put each item into the right bucket.","items":[{"id":"i1","text":"Adversarial training with attacked inputs"},{"id":"i2","text":"Data poisoning of the training set"},{"id":"i3","text":"Model extraction through the public API"},{"id":"i4","text":"Hidden-trigger backdoor in a downloaded checkpoint"},{"id":"i5","text":"Input preprocessing that cleans incoming data"}],"targets":[{"id":"z1","label":"Attack","why":"These damage the model, its data or its owner."},{"id":"z2","label":"Defense or hardening","why":"These make the model or its inputs stronger against attacks."}],"solution":{"i1":"z2","i2":"z1","i3":"z1","i4":"z1","i5":"z2"},"explanation":"Adversarial training and input preprocessing protect the model. Poisoning, extraction and hidden-trigger backdoors are attacks. A backdoor is a nasty attack: the model works normally until the attacker shows the secret trigger pattern.","study":"Study the difference between attack techniques and defensive controls.","hint":"Ask: does this item help the model, or does it hurt someone?"},{"id":"e07","type":"qcm","answerType":"single","theme":"Evaluation, tools & governance","summary":"Your manager asks for a trusted public knowledge base on attacks against AI.","scenario":{"intro":["Your manager heard about attacks on ML systems at a conference.","She asks you for a trusted, public knowledge base that collects attacker techniques and real case studies against AI systems.","It should work like MITRE ATT&CK, but for machine learning."]},"question":"Which resource fits?","options":[{"id":"B","text":"A firewall vendor's marketing PDF on artificial intelligence threats"},{"id":"C","text":"A cloud storage folder that holds the team's training images"},{"id":"D","text":"A password manager used by the ML engineering team"},{"id":"A","text":"MITRE ATLAS, the public knowledge base of attacks on AI systems"}],"correct":["A"],"explanation":"MITRE ATLAS collects real attacker techniques and case studies against machine learning systems, in the same spirit as ATT&CK for enterprise networks. SOC teams use it to classify events, and red teams use it to plan tests. The other options are not knowledge bases of attacker techniques.","study":"Browse the MITRE ATLAS site and read one case study.","hint":"The name sounds like ATT&CK, but for machine learning."},{"id":"e08","type":"sim","answerType":"single","theme":"Poisoning & supply chain","summary":"A lab assistant flips hundreds of dog labels to 'cat' in the training set.","scenario":{"intro":["You support a pet-breeding image model.","A data check finds that a lab assistant mislabeled 400 dog photos as 'cat' over two weeks.","Training already used the bad labels, so the model now calls some dogs 'cats'.","Nobody touched the live model. The damage sits in the training data."]},"question":"Choose the correct attack type.","steps":[{"prompt":"Which attack type is this?","options":[{"id":"A","text":"Data poisoning, specifically label flipping","outcome":"Correct. Wrong labels inside the training data are label flipping, a poisoning type.","why":"The damage happened at training time, through wrong labels."},{"id":"B","text":"Evasion at inference time","outcome":"The live model was never fed crafted inputs; the labels were wrong from the start.","why":"Evasion needs a crafted live input, which is not the case here."},{"id":"C","text":"Model extraction","outcome":"Nobody copied the model. Its behaviour was corrupted during training.","why":"Extraction steals behaviour through queries; nothing was stolen here."},{"id":"D","text":"A random outage, not an attack","outcome":"400 consistent wrong labels are not an outage. Treat it as poisoning and review access.","why":"Consistent mislabeling at scale is a poisoning pattern."}],"correct":["A"]}],"explanation":"Wrong labels inside training data are called label flipping, a type of data poisoning. The sign to remember: the model learned the wrong behaviour, so the problem is before deployment. Fixes include cleaning the labels and retraining, then re-testing the model.","study":"Study 'label flipping' and how teams detect poisoned labels.","hint":"Ask when the damage happened: during training or during inference."},{"id":"e09","type":"terminal","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Run your first robustness test with the team's testing tool.","scenario":{"intro":["Your team uses a small command-line tool called art_test.","In plain words: it throws slightly changed inputs at a model and reports how often the model still answers correctly.","You will now run your first test yourself."]},"question":"Type and run the command that tests model mnist_net with the FGSM attack and a budget of 0.1.","terminal":{"title":"analyst@lab-box: ~ — simulated shell","prompt":"$","motd":["Robustness testing lab (simulated shell).","Nothing real is executed. Type a command and press Enter."],"syntaxPanel":{"usage":"art_test --model <name> --attack <attack> --eps <number>","options":[["--model","which model to test"],["--attack","which attack to use (fgsm or pgd)"],["--eps","the attack budget: how much inputs may change"]],"example":"art_test --model cifar_net --attack pgd --eps 0.03","exampleNote":"This example uses another model. Type your own command for mnist_net."},"sampleOutput":["Testing model: mnist_net","Attack: FGSM  eps=0.10","Clean accuracy: 99.1%","Robust accuracy: 88.6%"],"accept":[{"find":"mnist_net","output":["Testing model: mnist_net","Attack: FGSM  eps=0.10","Clean accuracy: 99.1%","Robust accuracy: 88.6%"]}],"canonical":"art_test --model mnist_net --attack fgsm --eps 0.1","canonicalParts":["art_test — the team's robustness testing tool","--model mnist_net — the model to test","--attack fgsm — the attack to run against it","--eps 0.1 — the budget: how much each input may change"],"dangerNote":"A budget like eps 5 would allow huge changes and would not measure realistic attacks; it would make the test result meaningless."},"checks":[{"label":"uses the testing tool art_test","find":"art_test","ok":true},{"label":"targets the model mnist_net","find":"mnist_net","ok":true},{"label":"selects the FGSM attack","find":"fgsm","ok":true},{"label":"sets the budget to 0.1","re":"eps\\s*0\\.1(\\D|$)","ok":true},{"label":"uses an unrealistic budget (eps 5)","re":"eps\\s*5(\\D|$)","ok":false,"why":"eps 5 allows enormous changes; the test would measure nothing useful."}],"explanation":"The command needs four parts: the tool, the model, the attack and the budget. art_test is the tool. mnist_net is the target. FGSM is a fast attack that uses the model's gradient. eps 0.1 says how much inputs may change. Missing any part makes the test wrong or meaningless.","study":"Practise reading a command line: tool, target, options and values.","hint":"Start with the tool name art_test, then give the model, the attack and the budget. The option order does not matter here."},{"id":"e10","type":"qcm","answerType":"single","theme":"Defenses & robustness","summary":"A teammate says the retrained fraud model is now attack-proof.","scenario":{"intro":["Your team retrains the fraud model with adversarial examples added to the training data.","This is called adversarial training.","A teammate says: 'Now the model is attack-proof.'"]},"question":"Which statement about adversarial training is correct?","options":[{"id":"B","text":"It removes the need for any other checks or monitoring after release"},{"id":"A","text":"It trains the model on attacked inputs, so it resists similar attacks"},{"id":"C","text":"It encrypts the model weights while they sit on disk at rest"},{"id":"D","text":"It blocks suspicious users at the API gate before login"}],"correct":["A"],"explanation":"Adversarial training mixes slightly attacked inputs into training, so the model learns to stay correct on them. It usually helps against attacks of a similar type and size. It is not a magic shield: strong or different attacks can still work, and clean accuracy can drop a little. The other claims confuse it with encryption or access control.","study":"Study what adversarial training does and what it does not promise.","hint":"The defence happens inside the training process, not at the network or disk level."},{"id":"e11","type":"spot","answerType":"multi","theme":"Defenses & robustness","summary":"A release note makes two claims no honest model can make.","scenario":{"intro":["You review the release notes of a traffic sign classifier before it ships.","Some lines state facts. Two lines make security claims that are wrong.","Click every line that states a security mistake."]},"question":"Click every line that states a security mistake.","artifact":{"kind":"lines","idPrefix":"l","lines":["# traffic sign classifier - release notes","training_data: clean_street_images_v4","protection: fully protected against all attacks","eval: clean_accuracy_99_percent","robustness_eval: skipped_because_model_is_protected","deploy: public_api"]},"correctIds":["l3","l5"],"lineWhy":{"l3":"No model is fully protected against all attacks; robustness is always partial and measured, never absolute.","l5":"Skipping robustness evaluation because of a false claim doubles the mistake: now nobody knows the real robustness.","l1":"A comment line. Nothing wrong here.","l2":"Training on clean data is normal and good practice, not a mistake by itself.","l4":"Reporting clean accuracy is useful. It is just not a robustness number.","l6":"Serving through a public API is a normal deployment choice."},"explanation":"Two lines claim the model is 'fully protected' and use that claim to skip robustness evaluation. Both are wrong. No model is fully protected, and skipping evaluation hides the real risk from everyone. Honest wording and a real robustness test are expected in every release note.","study":"Study why robustness evaluation must never be skipped in release processes.","hint":"Two lines make promises about protection and testing that no model can honestly make."},{"id":"e12","type":"fill","answerType":"single","theme":"Evasion attacks","summary":"Complete the definition of a black-box attack.","scenario":{"intro":["Your team writes a short glossary for new joiners.","This card defines the black-box threat model."]},"question":"Complete the sentence with the right word from the bank.","parts":["In a black-box attack, the attacker can only see the model's "],"blanks":[{"correct":"answers","alt":["outputs","predictions"],"why":"Black-box means input in, answer out; no internal access."}],"tokens":["answers","source code","weights","training data"],"explanation":"Black-box means the attacker sees only outputs: labels and scores. Weights, source code and training data are hidden. If those internals were visible, the attack would be white-box instead.","study":"Compare black-box and white-box with one example each.","hint":"What comes out of an API? That is all the attacker gets."},{"id":"e13","type":"sim","answerType":"single","theme":"Model theft & privacy","summary":"A look-alike model appears after an outside script pulled 50,000 predictions.","scenario":{"intro":["A company notices an outside script that downloaded 50,000 prediction pairs over one weekend.","The requests looked technical and polite: normal images in, labels and scores out.","Weeks later, a rival demo shows a model that behaves almost identically on the same task.","The company's weights were never leaked."]},"question":"Choose the attack pattern this shows.","steps":[{"prompt":"Which attack does this pattern show?","options":[{"id":"A","text":"Model extraction through many queries","outcome":"Correct. Many queries plus a trained copy is the classic extraction pattern.","why":"A surrogate model trained on query answers is model extraction."},{"id":"B","text":"Data poisoning","outcome":"The training data was not touched. The rival learned from the answers.","why":"Poisoning needs bad training data; here nothing was poisoned."},{"id":"C","text":"Evasion","outcome":"No input was crafted to fool the model; the answers were collected.","why":"Evasion fools predictions; it does not collect them for training."},{"id":"D","text":"Accidental data loss","outcome":"Nothing was lost. Behaviour was copied through the public answers.","why":"The model still works; its behaviour was stolen instead."}],"correct":["A"]}],"explanation":"Many queries in, a private copy trained on the answers out: this is model extraction, also called model stealing. The attacker does not need the weights. The answers are enough to teach a surrogate model. Defenses include rate limits, output watermarking and watching query patterns.","study":"Study 'model extraction' and the defenses that slow it down.","hint":"The rival never touched the weights. What did it learn from?"},{"id":"e14","type":"qcm","answerType":"single","theme":"Evasion attacks","summary":"Four tickets arrive; only one describes an inference-time evasion attempt.","scenario":{"intro":["Four tickets arrived at the help desk this morning.","Only one of them describes an evasion attack, which happens at inference time, after training is finished."]},"question":"Which ticket describes evasion?","options":[{"id":"B","text":"An intern mislabeled 200 of the training images last month"},{"id":"C","text":"A backup disk with old training data failed during the night"},{"id":"A","text":"A user sends a photo with tiny pixel edits that flip the model's label"},{"id":"D","text":"A rival team copied the whole model through the public API"}],"correct":["A"],"explanation":"Evasion means crafted inputs fool the working model right now. The ticket about the photo with tiny pixel edits is exactly that. The mislabeled-images ticket is label flipping, a poisoning problem. The failed backup disk is an availability incident. The copied model is extraction. Same keyword, four different families.","study":"Practise sorting tickets into evasion, poisoning, extraction and inversion.","hint":"Look for the ticket where a crafted input meets the live model."},{"id":"e15","type":"order","answerType":"multi","theme":"Evasion attacks","summary":"Order the four steps of a basic black-box evasion attempt.","scenario":{"intro":["Your instructor explains how a simple black-box evasion attack works, step by step.","The steps below are shuffled. Put them in the order the attacker follows."]},"question":"Put the attacker's steps in the correct order.","entries":[{"id":"s1","text":"Send normal test inputs to the model"},{"id":"s2","text":"Read the model's answers and confidence scores"},{"id":"s3","text":"Craft a slightly changed input using what was learned"},{"id":"s4","text":"Submit the crafted input and confirm the wrong label"}],"correctOrder":["s1","s2","s3","s4"],"explanation":"A black-box attacker first probes with normal inputs, then studies the answers, then crafts a changed input, and finally checks that the crafted input gets the wrong label. Crafting before probing would be blind guessing. This loop is why query volume is a useful detection signal.","study":"Remember the probe-learn-craft-confirm loop of black-box attacks.","hint":"The attacker cannot craft anything before seeing how the model answers."},{"id":"e16","type":"fill","answerType":"single","theme":"Evasion attacks","summary":"Complete the sentence about why attackers want confident wrong answers.","scenario":{"intro":["A SOC analyst explains why alerting is hard.","Wrong answers that look sure are the worst case for defenders."]},"question":"Complete the sentence with the right word from the bank.","parts":["Attackers want wrong answers to look "],"blanks":[{"correct":"confident","why":"A confident wrong answer hides the attack from monitoring that watches low-confidence cases."}],"tokens":["confident","random","slow","deleted"],"explanation":"Monitoring often flags inputs the model is unsure about. If an adversarial input gets a confident wrong answer, nothing looks strange. That is why attackers prefer strong attacks: the wrong label comes with high confidence.","study":"Study how confidence scores are used, and abused, in attack monitoring.","hint":"What kind of wrong answer never raises an alert?"},{"id":"e17","type":"fill","answerType":"single","theme":"Evasion attacks","summary":"Complete the sentence about the attack budget.","scenario":{"intro":["Your study card set continues.","This card defines the number that limits every attack."]},"question":"Complete the sentence with the right word from the bank.","parts":["The attack budget, often called "],"blanks":[{"correct":"epsilon","why":"Epsilon (the perturbation budget) caps how much an attacker may change one input."}],"tokens":["epsilon","bandwidth","storage","latency"],"explanation":"Epsilon is the perturbation budget: the maximum change an attacker may apply to an input. A small epsilon keeps changes invisible. A large epsilon makes attacks easy to see. Robustness numbers are always reported together with the epsilon they were tested at.","study":"Study 'epsilon' and why robustness numbers always mention the budget.","hint":"It is a Greek letter, and it limits the size of the change."},{"id":"e18","type":"match","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Match five well-known ML security tools to what they are for.","scenario":{"intro":["Your team lead lists the tools you will meet on the job.","Match each tool to the job it is known for."]},"question":"Drag each tool to its purpose.","items":[{"id":"i1","text":"Adversarial Robustness Toolbox (ART)"},{"id":"i2","text":"Foolbox"},{"id":"i3","text":"CleverHans"},{"id":"i4","text":"RobustBench"},{"id":"i5","text":"Counterfit"}],"targets":[{"id":"z1","label":"A Python library to build and test attacks and defenses","why":"ART is IBM's library covering attacks, defenses, and metrics for ML models."},{"id":"z2","label":"A library focused on crafting adversarial examples","why":"Foolbox wraps many attack algorithms for decision-based models."},{"id":"z3","label":"A reference library of attack and defense implementations","why":"CleverHans is the classic research library from the adversarial examples community."},{"id":"z4","label":"A leaderboard that ranks how robust public models are","why":"RobustBench collects models and numbers under standardised attack budgets."},{"id":"z5","label":"A tool to security-test deployed model APIs","why":"Counterfit automates attacks against hosted model endpoints."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4","i5":"z5"},"explanation":"These five names cover the working toolkit. ART is the broad library for attacks, defenses and metrics. Foolbox concentrates on crafting adversarial examples. CleverHans is the classic research reference. RobustBench is where published robustness numbers live, under standard budgets. Counterfit points at deployed APIs, which is where you will feel attacks in real work. Knowing one purpose per tool is enough for this tier.","study":"Pick one tool, such as ART, and read its documentation page for ten minutes.","hint":"Two tools are libraries, one is a leaderboard, one tests live APIs, and one is the broad Swiss-army library."}]};

'use strict';
var DATA = window.EXAM_DATA || {};
var META = DATA.meta || {};
var EXS = DATA.exercises || [];
var SEVINFO = {
  'easy':{label:'EASY',cls:'sev-easy'},
  'medium':{label:'MEDIUM',cls:'sev-medium'},
  'hard':{label:'HARD',cls:'sev-hard'},
  'extremely-hard':{label:'EXTREMELY HARD',cls:'sev-extreme'}
};
var SEV = SEVINFO[META.difficulty] || SEVINFO.easy;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function byId(i){return document.getElementById(i);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtPts(p){var v=Math.round(p*10)/10;return (v%1===0)?String(v):v.toFixed(1);}
function fmtTime(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function normCmd(s){return String(s||'').toLowerCase().replace(/=/g,' ').replace(/-{3,}/g,'--').replace(/\s+/g,' ').trim();}
function findId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}

var S = {
  view:'intro', order:[], cur:0,
  answers:{}, graded:{}, skipped:{}, checked:{}, hintUsed:{},
  running:false, manualPause:false, autoPause:false,
  remaining:(META.timerSeconds||1800), reported:false, fromReview:false,
  pres:{}, exDeadline:null, warned:false, candidate:''
};
/* selection state for click-to-place widgets (match items / fill tokens) */
var SEL = { item:null, token:null };
function resetSel(){ SEL.item=null; SEL.token=null; }

/* ---------------- presentation shuffles (rebuilt per attempt) ---------------- */
function buildPres(i){
  var ex=EXS[i], p={};
  if(ex.type==='qcm'||ex.type==='multi'){ p.optOrder=shuffle(ex.options.map(function(o){return o.id;})); }
  if(ex.type==='match'){ p.itemOrder=shuffle(ex.items.map(function(it){return it.id;})); p.zoneOrder=ex.targets.map(function(z){return z.id;}); }
  if(ex.type==='order'){
    var eo=shuffle(ex.entries.map(function(e){return e.id;}));
    var same=ex.correctOrder.every(function(v,k){return eo[k]===v;});
    if(same && eo.length>1){ eo.push(eo.shift()); }
    p.entryOrder=eo;
  }
  if(ex.type==='fill'){ p.tokenOrder=shuffle(ex.tokens.slice()); }
  S.pres[i]=p;
}

/* ---------------- timer ---------------- */
function timerModeLabel(){
  if(S.manualPause) return '\u23f8 paused by you';
  if(S.autoPause) return '\u23f8 paused \u2014 review your feedback';
  return '\u25b6 running';
}
setInterval(function(){
  if(S.view!=='exam' && S.view!=='review') return;
  if(S.running && !S.manualPause && !S.autoPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; updateHead(); finishExam(true); return; }
    updateHead();
    if(S.exDeadline && !S.exOver){
      var left=Math.ceil((S.exDeadline-Date.now())/1000);
      var chip=byId('ex-timer-chip');
      if(chip){
        if(left>0){ chip.textContent='\u23f1 recommended time left: '+fmtTime(left); chip.classList.remove('late'); }
        else { chip.textContent='\u23f1 recommended time passed \u2014 the exam timer continues'; chip.classList.add('late'); }
      }
    }
  }
},1000);

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pres={};
  S.order.forEach(function(i){ buildPres(i); });
  S.cur=0; S.view='exam'; S.running=true; S.manualPause=false; S.autoPause=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.answers={}; S.graded={}; S.skipped={}; S.checked={}; S.hintUsed={};
  S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function curExIdx(){ return S.order[S.cur]; }
function curEx(){ return EXS[curExIdx()]; }

function ensureAnswer(exIdx){
  var ex=EXS[exIdx], a=S.answers[ex.id];
  if(a===undefined){
    if(ex.type==='multi') a=[];
    else if(ex.type==='match') a={};
    else if(ex.type==='order') a=S.pres[exIdx].entryOrder.slice();
    else if(ex.type==='fill') a={};
    else if(ex.type==='spot') a=[];
    else if(ex.type==='sim') a={};
    else if(ex.type==='num'||ex.type==='terminal') a='';
    else a=null;
    S.answers[ex.id]=a;
  }
  return a;
}
function answerReady(ex){
  var a=S.answers[ex.id];
  if(a===undefined||a===null) return false;
  switch(ex.type){
    case 'qcm': return a!==null;
    case 'multi': return a.length>0;
    case 'match': return Object.keys(a).length>0;
    case 'order': return true;
    case 'fill': return Object.keys(a).length>0;
    case 'spot': return a.length>0;
    case 'sim': return Object.keys(a).length===ex.steps.length;
    case 'num': return String(a).trim()!=='';
    case 'terminal': return String(a).trim()!=='';
  }
  return false;
}

function checkAnswer(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.checked[ex.id]) return;
  if(!answerReady(ex)){ S.warned=true; render(); return; }
  S.warned=false;
  S.graded[ex.id]=gradeEx(ex,exIdx);
  S.checked[ex.id]=true;
  S.autoPause=true;              /* auto-pause on Check: feedback stays readable */
  S.manualPause=false;           /* manual pause released if it was somehow set */
  render();
}
function useHint(){
  var ex=curEx();
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  render();
}
function skipCurrent(){
  var ex=curEx();
  if(!S.checked[ex.id]){ S.skipped[ex.id]=true; }
  goNext();
}
function goNext(){
  S.warned=false; S.autoPause=false; S.fromReview=false;
  S.exDeadline=null; S.exOver=false;
  if(S.cur>=S.order.length-1){ endFlow(); } else { S.cur++; render(); }
}
function endFlow(){
  var unanswered=S.order.filter(function(i){ var ex=EXS[i]; return !S.graded[ex.id]; });
  if(unanswered.length>0){ S.view='review'; render(); }
  else { finishExam(false); }
}
function finishExam(timedOut){
  S.running=false; S.autoPause=false; S.manualPause=false; S.timedOut=!!timedOut;
  S.view='results'; S.exDeadline=null; S.exOver=true;
  render();
  reportScore();
}
function retakeExam(){
  S.view='intro'; S.order=[]; S.cur=0; S.answers={}; S.graded={}; S.skipped={}; S.checked={};
  S.hintUsed={}; S.manualPause=false; S.autoPause=false; S.running=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.pres={}; S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function returnToSkipped(exIdx){
  S.cur=exIdx; S.fromReview=true; S.view='exam';
  S.autoPause=false; S.manualPause=false;
  render();
}

/* ---------------- grading ---------------- */
function gradeEx(ex,exIdx){
  var a=S.answers[ex.id];
  var T=1,C=0,W=0;
  var right=[],wrong=[],missed=[];
  function addItem(list,label,why){ list.push({label:label,why:why||''}); }

  if(ex.type==='qcm'){
    T=1;
    var ok=ex.correct.indexOf(a)>=0;
    if(ok){ C=1; addItem(right,optText(ex,a),optWhy(ex,a)); }
    else { W=1; addItem(wrong,optText(ex,a),optWhy(ex,a)); addItem(missed,correctText(ex),''); }
  }
  else if(ex.type==='multi'){
    T=ex.correct.length;
    ex.correct.forEach(function(cid){
      if(a.indexOf(cid)>=0){ C++; addItem(right,optText(ex,cid),optWhy(ex,cid)); }
      else { addItem(missed,optText(ex,cid),optWhy(ex,cid)); }
    });
    a.forEach(function(oid){
      if(ex.correct.indexOf(oid)<0){ W++; addItem(wrong,optText(ex,oid),optWhy(ex,oid)); }
    });
  }
  else if(ex.type==='match'){
    T=ex.items.length;
    ex.items.forEach(function(it){
      var zid=a[it.id], sol=ex.solution[it.id];
      var zObj=zid?findId(ex.targets,zid):null, sObj=findId(ex.targets,sol);
      if(zid===sol){ C++; addItem(right,it.text+' \u2192 '+sObj.label,(zObj&&zObj.why)||''); }
      else {
        var line=it.text+' \u2192 '+(zObj?zObj.label:'(no answer)')+' \u2014 correct: '+sObj.label;
        if(zid){ W++; addItem(wrong,line,(zObj&&zObj.why)||('Not the right match for this scenario.')); }
        else { addItem(missed,line,sObj.why||''); }
      }
    });
  }
  else if(ex.type==='order'){
    T=ex.entries.length;
    ex.entries.forEach(function(en,k){
      var placed=a[k], sol=ex.correctOrder[k];
      var pEn=findId(ex.entries,placed), sEn=findId(ex.entries,sol);
      if(placed===sol){ C++; addItem(right,(k+1)+'. '+sEn.text,''); }
      else {
        var line='Position '+(k+1)+': you placed "'+pEn.text+'", correct is "'+sEn.text+'"';
        W++; addItem(wrong,line,'');
      }
    });
  }
  else if(ex.type==='fill'){
    T=ex.blanks.length;
    ex.blanks.forEach(function(b,k){
      var got=a[k];
      if(got && (got===b.correct || (b.alt&&b.alt.indexOf(got)>=0))){
        C++; addItem(right,'Blank '+(k+1)+': "'+got+'" is correct.',b.why||'');
      } else {
        var line='Blank '+(k+1)+': you wrote "'+(got||'(empty)')+'", correct is "'+b.correct+'"';
        if(got){ W++; addItem(wrong,line,b.whyWrong||''); }
        else { addItem(missed,line,b.why||''); }
      }
    });
  }
  else if(ex.type==='spot'){
    T=ex.correctIds.length;
    ex.correctIds.forEach(function(lid){
      if(a.indexOf(lid)>=0){ C++; addItem(right,lineText(ex,lid),lineWhy(ex,lid)); }
      else { addItem(missed,lineText(ex,lid),lineWhy(ex,lid)); }
    });
    a.forEach(function(lid){
      if(ex.correctIds.indexOf(lid)<0){ W++; addItem(wrong,lineText(ex,lid),lineWhy(ex,lid)); }
    });
  }
  else if(ex.type==='sim'){
    T=ex.steps.length;
    ex.steps.forEach(function(st,k){
      var got=a[k];
      var okOpt=st.correct.indexOf(got)>=0;
      var gOpt=got?findId(st.options,got):null;
      var cOpt=findId(st.options,st.correct[0]);
      if(okOpt){ C++; addItem(right,'Step '+(k+1)+': '+cOpt.text,(gOpt&&gOpt.why)||''); }
      else {
        var line='Step '+(k+1)+': you chose "'+(gOpt?gOpt.text:'(no answer)')+'", better: "'+cOpt.text+'"';
        if(got){ W++; addItem(wrong,line,(gOpt&&gOpt.why)||''); }
        else { addItem(missed,line,cOpt.why||''); }
      }
    });
  }
  else if(ex.type==='num'){
    T=1;
    var v=parseFloat(String(a).replace(',','.'));
    var okNum=!isNaN(v)&&Math.abs(v-ex.value)<=ex.tolerance;
    if(okNum){ C=1; addItem(right,'Your value: '+v+(ex.unit?' '+ex.unit:''),ex.whyNum||''); }
    else { W=1; addItem(wrong,'Your value: '+String(a),'The correct value is '+ex.value+(ex.unit?' '+ex.unit:'')+'.'); }
  }
  else if(ex.type==='terminal'){
    var cmd=normCmd(a);
    T=0;
    function hit(ch){
      if(ch.re){ try{ return new RegExp(ch.re).test(cmd); }catch(e){ return false; } }
      return cmd.indexOf(ch.find)>=0;
    }
    (ex.checks||[]).forEach(function(ch){
      if(ch.ok){ T++; if(hit(ch)){ C++; addItem(right,ch.label,''); } else { addItem(missed,ch.label,ch.why||''); } }
      else { if(hit(ch)){ W++; addItem(wrong,ch.label,ch.why||''); } }
    });
    if(T===0){ T=1; }
  }

  var pts=Math.max(0,Math.floor((C-W)/T*100));
  if(pts>100) pts=100;
  if(S.hintUsed[ex.id]) pts=pts*0.9;
  return {pts:pts,T:T,C:C,W:W,right:right,wrong:wrong,missed:missed,raw:{C:C,W:W,T:T}};
}
function optText(ex,oid){ var o=findId(ex.options,oid); return o?o.text:String(oid); }
function optWhy(ex,oid){ var o=findId(ex.options,oid); return (o&&o.why)?o.why:''; }
function correctText(ex){ return optText(ex,ex.correct[0]); }
function lineText(ex,lid){ if(ex.artifact&&ex.artifact.lines){ var k=parseInt(lid.replace(/^\D+/,''),10); return 'Line '+k+': '+(ex.artifact.lines[k-1]||''); } return lid; }
function lineWhy(ex,lid){ return (ex.lineWhy&&ex.lineWhy[lid])||''; }

/* ---------------- live score ---------------- */
function scoreNow(){
  var earned=0,possible=0,n=0;
  S.order.forEach(function(i){ var ex=EXS[i],g=S.graded[ex.id]; if(g){ n++; earned+=g.pts; possible+=100; } });
  return {earned:earned,possible:possible,n:n};
}
function progressNow(){
  var done=0;
  S.order.forEach(function(i){ var ex=EXS[i]; if(S.graded[ex.id]||S.skipped[ex.id]) done++; });
  return S.order.length?Math.round(done/S.order.length*100):0;
}

/* ---------------- header ---------------- */
function updateHead(){
  var t=byId('xh-timer'), sc=byId('xh-score'), pr=byId('xh-bar'), sk=byId('xh-skipped');
  if(t){ t.innerHTML=esc(timerModeLabel())+' \u00b7 <span class="tval">'+esc(fmtTime(S.remaining))+'</span>'; }
  if(sc){ var s=scoreNow(); sc.textContent=fmtPts(s.earned)+' / '+s.possible+' pts'; }
  if(pr){ pr.style.width=progressNow()+'%'; }
  if(sk){
    var k=S.order.filter(function(i){ return S.skipped[EXS[i].id]&&!S.graded[EXS[i].id]; }).length;
    sk.textContent='Review skipped ('+k+')';
    sk.className='btn ghost'+(k>0?' attention':'');
  }
}

/* ---------------- site integration ---------------- */
function reportScore(){
  if(S.reported) return;
  var s=scoreNow();
  if(s.possible<=0) return;
  var score=Math.round(s.earned*10), total=s.possible*10;
  var percent=Math.round(score/total*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score:score, total:total, percent:percent, passed:percent>=META.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
  S.reported=true;
}
window.addEventListener('message',function(ev){
  var d=ev&&ev.data; if(!d) return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT') return;
  try{
    if(d.username){ S.candidate=String(d.username); var el=byId('cand-name'); if(el){ el.textContent='Candidate: '+S.candidate; } }
  }catch(e){}
});

/* ---------------- rendering ---------------- */
function render(){
  var app=byId('app');
  if(S.view==='intro'){ app.innerHTML=DATA.intro; updateHead(); var cn=byId('cand-name'); if(cn&&S.candidate){ cn.textContent='Candidate: '+S.candidate; } return; }
  if(S.view==='exam'){ renderExam(); return; }
  if(S.view==='review'){ renderReview(); return; }
  renderResults();
}

function headHTML(){
  var s=scoreNow();
  return '<header class="xhead">'
    +'<div class="xh-left"><span class="xh-count" id="xh-count"></span> <span class="sev-badge '+SEV.cls+'">'+esc(SEV.label)+'</span></div>'
    +'<div class="xh-mid"><div class="xh-row"><span class="xh-timer" id="xh-timer"></span><span class="xh-score" id="xh-score"></span></div>'
    +'<div class="xh-progress"><div class="bar" id="xh-bar"></div></div></div>'
    +'<div class="xh-right">'
    +'<button class="btn ghost" data-act="hint" id="xh-hint">Hint (\u221210%)</button>'
    +'<button class="btn ghost" data-act="pause" id="xh-pause">Pause</button>'
    +'<button class="btn ghost" data-act="skip" id="xh-skip">Skip</button>'

function setHeadEnabled(enabled){
  ['xh-hint','xh-pause','xh-skip','xh-skipped','xh-finish'].forEach(function(id){
    var b=byId(id); if(b){ b.disabled=!enabled; }
  });
}

function renderExam(){
  var exIdx=curExIdx(), ex=EXS[exIdx], g=S.graded[ex.id];
  var html=headHTML();
  html+='<div class="stage" id="stage">';
  if(S.manualPause){
    html+='<div class="pause-overlay"><h2>\u23f8 Paused by you</h2>'
      +'<p>The exercise is hidden while you pause. The timer is stopped. Press Resume when you are ready \u2014 the exercise comes back exactly as it was.</p>'
      +'<button class="btn primary" data-act="resume">Resume</button></div>';
  }
  html+='<div class="card"'+(S.manualPause?' style="visibility:hidden"':'')+'>';
  html+=scenarioHTML(ex);
  if(ex.timeLimit && !g){
    var left=Math.max(0,Math.ceil(((S.exDeadline||0)-Date.now())/1000));

function hi(s){
  var out='', re=/(\/\/[^\s]+|\b(?:INFO|WARN|ERROR|DEBUG|FAILED|ERRORS|DENIED|ALLOWED|BLOCKED|ALERT|CRITICAL)\b|\b\d{2}:\d{2}:\d{2}\b|\d{1,3}(?:\[\.\]){3}\d{1,3}|hxxps?:\/\/\S+|\b\d+(?:\.\d+)?%?\b)/g;
  var last=0,m;
  while((m=re.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    var t=m[0], cls='t-num';
    if(/^\/\//.test(t)) cls='t-ip';
    else if(t==='INFO'||t==='DEBUG'||t==='ALLOWED') cls='t-info';
    else if(t==='WARN') cls='t-warn';
    else if(t==='ERROR'||t==='FAILED'||t==='DENIED'||t==='BLOCKED'||t==='ALERT'||t==='CRITICAL'||t==='ERRORS') cls='t-bad';
    else if(/^\d{2}:\d{2}:\d{2}$/.test(t)) cls='t-time';
    else if(/^\/\//.test(t)||t.indexOf('[') >=0 ||t.indexOf('hxxp')===0) cls='t-ip';
    out+='<span class="'+cls+'">'+esc(t)+'</span>';
    last=m.index+t.length;
  }
  out+=esc(s.slice(last));
  return out;
}

/* ---------------- feedback ---------------- */
function feedbackHTML(ex,g){
  var pts=g.pts;
  var head,cls;
  if(pts>=100){ head='\u2713 Correct'; cls='fb-ok'; }
  else if(pts>0){ head='\u25d0 Partially correct'; cls='fb-part'; }
  else { head='\u2717 Incorrect'; cls='fb-bad'; }
  var h='<section class="feedback '+cls+'" aria-live="polite"><div class="fb-head">'+head+' <span class="pts-line">\u00b7 You earned '+fmtPts(pts)+' / 100 points</span></div><div class="fb-body">';
  if(S.hintUsed[ex.id]) h+='<p class="dim" style="color:var(--muted)">Hint used: the maximum for this exercise was 90 points before partial credit.</p>';
  var isMulti=(ex.type==='multi'||ex.type==='match'||ex.type==='order'||ex.type==='fill'||ex.type==='spot'||ex.type==='sim'||(ex.type==='terminal'&&g.T>1));
  if(isMulti&&g.wrong.length===0&&g.missed.length===0&&g.right.length>0){
    h+='<ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>';
  } else if(isMulti){
    if(g.right.length){ h+='<h4>What you got right</h4><ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.wrong.length){ h+='<h4>What you got wrong</h4><ul class="fb-list-wrong">'+g.wrong.map(function(r){ return '<li>\u2717 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.missed.length){ h+='<h4>What you missed</h4><ul class="fb-list-missed">'+g.missed.map(function(r){ return '<li>\u25cb '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
  }
  if(ex.type==='terminal'){
    var t=ex.terminal||{};
    h+='<h4>Canonical command</h4><div class="copywrap"><pre class="mono" id="canon-cmd">'+esc(t.canonical)+'</pre><button class="copybtn" data-act="copy-canon">Copy</button></div>';
    (t.canonicalParts||[]).forEach(function(part){ h+='<p class="dim" style="color:var(--muted);margin:5px 0">\u2014 '+esc(part)+'</p>'; });
    if(g.wrong.length&&t.dangerNote){ h+='<p class="warnline">\u26a0 '+esc(t.dangerNote)+'</p>'; }
  }
  if(!isMulti && pts<100 && (ex.type==='qcm'||ex.type==='num')){
    h+='<h4>Correct answer</h4><p>'+esc(correctSummary(ex))+'</p>';
  }
  h+='<h4>Why</h4><p>'+esc(ex.explanation)+'</p>';
  if(ex.study){ h+='<p class="dim" style="color:var(--muted)">What to study next: '+esc(ex.study)+'</p>'; }
  h+='</div></section>';
  return h;
}

/* ---------------- results ---------------- */
function computeResults(){
  var answered=0,earned=0,full=0,part=0,zero=0,excl=0;
  var themes={};
  S.order.forEach(function(i){
    var ex=EXS[i], g=S.graded[ex.id];
    var t=themes[ex.theme]||(themes[ex.theme]={n:0,full:0,part:0,zero:0,excl:0,pts:0});
    if(g){
      answered++; earned+=g.pts;
      if(g.pts>=100){ full++; t.full++; } else if(g.pts>0){ part++; t.part++; } else { zero++; t.zero++; }
      t.n++; t.pts+=g.pts;
    } else { excl++; t.excl++; }
  });
  var possible=answered*100;
  var percent=possible>0?Math.round(earned/possible*100):0;
  return {answered:answered,earned:earned,possible:possible,percent:percent,full:full,part:part,zero:zero,excl:excl,themes:themes,passed:percent>=META.passMark};
}

  var r=computeResults();

  html+='<div class="panel"><h2>Per-theme breakdown</h2><table class="theme-table"><thead><tr><th>Theme</th><th>Fully correct</th><th>Partial</th><th>Incorrect</th><th>Excluded</th><th>Points</th></tr></thead><tbody>';
