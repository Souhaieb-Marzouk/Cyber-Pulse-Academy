    a.lines.forEach(function(ln,i){ h+='<span class="ln-row" data-ln="'+(i+1)+'">'+hi(ln)+'</span>'; });
    h+='</div>';
    return h;
  }
  if(a.kind==='code'||a.kind==='lines'){
    var h2='<div class="code-lines">';
    a.lines.forEach(function(ln,i){
      var lid=(a.idPrefix||'l')+(i+1);
      if(ex && ex.type==='spot'){
        var flagged=S.answers[ex.id]&&S.answers[ex.id].indexOf(lid)>=0;
        h2+='<button type="button" class="cl'+(flagged?' flag':'')+'" data-act="line" data-id="'+lid+'"><span class="ln">'+(i+1)+'</span><code>'+esc(ln)+'</code></button>';
      } else {
        h2+='<div class="ln-row"><span class="ln" style="color:var(--faint);min-width:26px;display:inline-block">'+(i+1)+'</span><code>'+esc(ln)+'</code></div>';
      }
    });
    return h2+'</div>';
  }
  if(a.kind==='table'){
    var h3='<table class="arttab"><thead><tr>';
    a.head.forEach(function(c){ h3+='<th>'+esc(c)+'</th>'; });
    h3+='</tr></thead><tbody>';
    a.rows.forEach(function(r){ h3+='<tr>'; r.forEach(function(c,ci){ h3+='<td'+(ci>0?' class="num"':'')+'>'+esc(c)+'</td>'; }); h3+='</tr>'; });
    return h3+'</tbody></table>';
  }
  if(a.kind==='chat'){
    var h4='';
    a.messages.forEach(function(m){ h4+='<div class="chatline"><span class="who">'+esc(m.who)+'</span>'+esc(m.text)+'</div>'; });
    return h4;
  }
  var h5='';
  (a.paragraphs||[]).forEach(function(p){ h5+='<p>'+esc(p)+'</p>'; });
  return h5;
}

/* ---------------- widgets ---------------- */
function widgetHTML(ex,exIdx){
  var a=ensureAnswer(exIdx), p=S.pres[exIdx], h='';
  if(ex.type==='qcm'||ex.type==='multi'){
    h+='<div class="opts">';
    p.optOrder.forEach(function(oid,k){
      var o=findId(ex.options,oid);
      var sel=(ex.type==='qcm')?(a===oid):(a.indexOf(oid)>=0);
      h+='<button type="button" class="opt'+(sel?' sel':'')+'" data-act="opt" data-id="'+oid+'" aria-pressed="'+(sel?'true':'false')+'">'
        +'<span class="lab">'+String.fromCharCode(65+k)+'.</span><span>'+esc(o.text)+'</span></button>';
    });
    h+='</div>';
    if(ex.type==='multi') h+='<p class="multi-note">Select all that apply. More than one answer can be correct. Partial credit is possible.</p>';
    return h;
  }
  if(ex.type==='match'){
    h+='<div class="match-grid"><div><p class="multi-note" style="margin:0 0 4px">Items \u2014 click an item, then click its zone (or drag it).</p>';
    p.itemOrder.forEach(function(iid){
      var it=findId(ex.items,iid);
      var used=Object.keys(a).some(function(k){return k===iid;});
      var sel=SEL.item===iid;
      h+='<button type="button" class="m-item'+(sel?' sel':'')+(used?' used':'')+'" draggable="true" data-act="m-item" data-id="'+iid+'">'+esc(it.text)+'</button>';
    });
    h+='</div><div>';
    ex.targets.forEach(function(z){
      h+='<div class="m-zone" data-act="m-zone" data-id="'+z.id+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(z.label)+'"><div class="mz-label">'+esc(z.label)+'</div>';
      Object.keys(a).forEach(function(itemId){
        if(a[itemId]===z.id){
          var it=findId(ex.items,itemId);
          h+='<div class="mz-chip"><span>'+esc(it.text)+'</span><button type="button" data-act="m-unassign" data-id="'+itemId+'" aria-label="Return item to the bank">\u2715</button></div>';
        }
      });
      h+='</div>';
    });
    return h+'</div></div>';
  }
  if(ex.type==='order'){
    h+='<ol class="ord">';
    a.forEach(function(eid,k){
      var en=findId(ex.entries,eid);
      h+='<li class="ord-item" draggable="true" data-act="ord-item" data-id="'+eid+'"><span class="pos">'+(k+1)+'</span><span class="txt">'+esc(en.text)+'</span>'
        +'<span class="ord-btn"><button type="button" data-act="ord-up" data-id="'+eid+'" aria-label="Move up">\u2191</button>'
        +'<button type="button" data-act="ord-down" data-id="'+eid+'" aria-label="Move down">\u2193</button></span></li>';
    });
    return h+'</ol><p class="multi-note">Drag the rows (or use the arrows) to put them in the required order.</p>';
  }
  if(ex.type==='fill'){
    h+='<p class="fill-sent">';
    ex.parts.forEach(function(part,k){
      h+=esc(part);
      if(k<ex.blanks.length){
        var got=a[k];
        h+='<button type="button" class="blank'+(got?' filled':'')+'" data-act="blank" data-k="'+k+'" aria-label="Blank '+(k+1)+(got?', filled with '+got:'')+'">'+(got?esc(got):'\u00a0\u00a0\u00a0\u00a0')+'</button>';
      }
    });
    for(var bk=ex.parts.length;bk<ex.blanks.length;bk++){
      var got2=a[bk];
      h+='<button type="button" class="blank'+(got2?' filled':'')+'" data-act="blank" data-k="'+bk+'" aria-label="Blank '+(bk+1)+(got2?', filled with '+got2:'')+'">'+(got2?esc(got2):'\u00a0\u00a0\u00a0\u00a0')+'</button>';
    }
    h+='</p><p class="multi-note">Word bank \u2014 click a word, then click a blank. Click a filled blank to empty it. Some words are wrong on purpose.</p><div class="bank">';
    p.tokenOrder.forEach(function(t){
      var sel=SEL.token===t;
      h+='<button type="button" class="token'+(sel?' sel':'')+'" data-act="token" data-t="'+esc(t)+'">'+esc(t)+'</button>';
    });
    return h+'</div>';
  }
  if(ex.type==='spot'){
    h+='<p class="multi-note" style="margin:0 0 8px">Click every line you want to flag. Click again to unflag.</p>';
    h+=artifactHTML(ex.artifact,ex);
    return h;
  }
  if(ex.type==='num'){
    h+='<div class="numwrap"><input type="text" inputmode="decimal" id="numin" data-act="num" value="'+esc(a)+'" aria-label="Numeric answer"> <span class="unit">'+esc(ex.unit||'')+'</span></div>';
    if(ex.note) h+='<p class="multi-note">'+esc(ex.note)+'</p>';
    return h;
  }
  if(ex.type==='sim'){
    h+='<div class="sim-steps">';
    for(var k=0;k<ex.steps.length;k++){
      var st=ex.steps[k], chosen=a[k];
      var isCurrent=(chosen===undefined)&&!exLocked(ex);
      if(chosen===undefined && k>0 && a[k-1]===undefined){ break; }
      h+='<div class="sim-step'+(chosen!==undefined?' done':'')+'"><div class="ss-head">Step '+(k+1)+' of '+ex.steps.length+'</div>';
      h+='<p>'+esc(st.prompt)+'</p><div class="opts">';
      st.options.forEach(function(o,oi){
        var isChosen=(chosen===o.id);
        var disabled=(chosen!==undefined);
        h+='<button type="button" class="opt'+(isChosen?' sel':'')+(disabled?' lock':'')+'" data-act="sim-opt" data-step="'+k+'" data-id="'+o.id+'"'+(disabled?' disabled':'')+' aria-pressed="'+(isChosen?'true':'false')+'">'
          +'<span class="lab">'+String.fromCharCode(65+oi)+'.</span><span>'+esc(o.text)+'</span></button>';
      });
      h+='</div>';
      if(chosen!==undefined){
        var co=findId(st.options,chosen);
        if(co&&co.outcome){ h+='<div class="outcome">'+esc(co.outcome)+'</div>'; }
      }
      h+='</div>';
      if(chosen===undefined){ break; }
    }
    if(exLocked(ex)){ h+='<p class="sim-locked">All steps answered. Press Check to see your score for this exercise.</p>'; }
    else if(Object.keys(a).length<ex.steps.length){ h+='<p class="sim-locked">Answer the current step to unlock the next one.</p>'; }
    return h+'</div>';
  }
  if(ex.type==='terminal'){
    var t=ex.terminal||{};
    if(t.syntaxPanel){
      h+='<div class="synpanel"><h4>Syntax reminder (simulated shell)</h4><p class="mono" style="margin:4px 0">'+esc(t.syntaxPanel.usage)+'</p><table>';
      t.syntaxPanel.options.forEach(function(o){ h+='<tr><td class="f">'+esc(o[0])+'</td><td>'+esc(o[1])+'</td></tr>'; });
      h+='</table><p style="margin:8px 0 2px">Example on a different target: <span class="mono">'+esc(t.syntaxPanel.example)+'</span></p>';
      if(t.syntaxPanel.exampleNote) h+='<p class="dim" style="color:var(--muted);margin:4px 0 0">'+esc(t.syntaxPanel.exampleNote)+'</p>';
      h+='</div>';
    }
    if(t.sampleOutput){
      h+='<div class="synpanel"><h4>Expected output shape</h4><pre class="mono" style="margin:4px 0">'+esc(t.sampleOutput.join('\n'))+'</pre></div>';
    }
    if(t.objective){ h+='<p class="multi-note" style="margin:0 0 8px">'+esc(t.objective)+'</p>'; }
    h+='<div class="term"><div class="term-bar">'+esc(t.title||'simulated shell')+'</div><div class="term-scroll" id="term-scroll">';
    (t.motd||[]).forEach(function(l){ h+='<div class="out">'+esc(l)+'</div>'; });
    if(TERM_LOG[ex.id]){ TERM_LOG[ex.id].forEach(function(l){ h+='<div class="'+l.cls+'">'+esc(l.text)+'</div>'; }); }
    h+='</div><div class="term-input"><span class="ps1">'+esc(t.prompt||'$')+'</span><input type="text" id="term-in" data-act="cmd" value="'+esc(a||'')+'" autocomplete="off" spellcheck="false" aria-label="Type your command and press Enter"></div></div>';
    h+='<p class="multi-note">Type the command and press Enter to run it (simulation only \u2014 nothing real is executed). Then press Check to grade it.</p>';
    return h;
  }
  return '';
}
var TERM_LOG={};
function exLocked(ex){ return !!S.checked[ex.id]; }

/* ---------------- feedback ---------------- */
function feedbackHTML(ex,g){
  var pts=g.pts;
  var head,cls;
  if(pts>=100){ head='\u2713 Correct'; cls='fb-ok'; }
  else if(pts>0){ head='\u25d0 Partially correct'; cls='fb-part'; }
  else { head='\u2717 Incorrect'; cls='fb-bad'; }
  var h='<section class="feedback '+cls+'" aria-live="polite"><div class="fb-head">'+head+' <span class="pts-line">\u00b7 You earned '+fmtPts(pts)+' / 100 points</span></div><div class="fb-body">';
  if(S.hintUsed[ex.id]) h+='<p class="dim" style="color:var(--muted)">Hint used: the maximum for this exercise was 90 points before partial credit.</p>';
  var isMulti=(ex.type==='multi'||ex.type==='match'||ex.type==='order'||ex.type==='fill'||ex.type==='spot'||ex.type==='sim'||(ex.type==='terminal'&&g.T>1));
  if(isMulti&&g.wrong.length===0&&g.missed.length===0&&g.right.length>0){
    h+='<ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>';
  } else if(isMulti){
    if(g.right.length){ h+='<h4>What you got right</h4><ul class="fb-list-right">'+g.right.map(function(r){ return '<li>\u2713 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.wrong.length){ h+='<h4>What you got wrong</h4><ul class="fb-list-wrong">'+g.wrong.map(function(r){ return '<li>\u2717 '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
    if(g.missed.length){ h+='<h4>What you missed</h4><ul class="fb-list-missed">'+g.missed.map(function(r){ return '<li>\u25cb '+esc(r.label)+(r.why?' \u2014 '+esc(r.why):'')+'</li>'; }).join('')+'</ul>'; }
  }
  if(ex.type==='terminal'){
    var t=ex.terminal||{};
    h+='<h4>Canonical command</h4><div class="copywrap"><pre class="mono" id="canon-cmd">'+esc(t.canonical)+'</pre><button class="copybtn" data-act="copy-canon">Copy</button></div>';
    (t.canonicalParts||[]).forEach(function(part){ h+='<p class="dim" style="color:var(--muted);margin:5px 0">\u2014 '+esc(part)+'</p>'; });
    if(g.wrong.length&&t.dangerNote){ h+='<p class="warnline">\u26a0 '+esc(t.dangerNote)+'</p>'; }
  }
  if(!isMulti && pts<100 && (ex.type==='qcm'||ex.type==='num')){
    h+='<h4>Correct answer</h4><p>'+esc(correctSummary(ex))+'</p>';
  }
  h+='<h4>Why</h4><p>'+esc(ex.explanation)+'</p>';
  if(ex.study){ h+='<p class="dim" style="color:var(--muted)">What to study next: '+esc(ex.study)+'</p>'; }
  h+='</div></section>';
  return h;
}

/* ---------------- results ---------------- */
function computeResults(){
  var answered=0,earned=0,full=0,part=0,zero=0,excl=0;
  var themes={};
  S.order.forEach(function(i){
    var ex=EXS[i], g=S.graded[ex.id];
    var t=themes[ex.theme]||(themes[ex.theme]={n:0,full:0,part:0,zero:0,excl:0,pts:0});
    if(g){
      answered++; earned+=g.pts;
      if(g.pts>=100){ full++; t.full++; } else if(g.pts>0){ part++; t.part++; } else { zero++; t.zero++; }
      t.n++; t.pts+=g.pts;
    } else { excl++; t.excl++; }
  });
  var possible=answered*100;
  var percent=possible>0?Math.round(earned/possible*100):0;
  return {answered:answered,earned:earned,possible:possible,percent:percent,full:full,part:part,zero:zero,excl:excl,themes:themes,passed:percent>=META.passMark};
}

function answerSummary(ex,g){
  var a=S.answers[ex.id];
  if(a===undefined||a===null){
    switch(ex.type){
      case 'multi': case 'spot': a=[]; break;
      case 'match': case 'fill': case 'sim': a={}; break;
      case 'order': a=(S.pres[S.order.indexOf(EXS.indexOf(ex))]&&S.pres[S.order.indexOf(EXS.indexOf(ex))].entryOrder)?S.pres[S.order.indexOf(EXS.indexOf(ex))].entryOrder.slice():ex.entries.map(function(e){return e.id;}); break;
      default: a='';
    }
  }
  switch(ex.type){
    case 'qcm': return optText(ex,a);
    case 'multi': return a.length?a.map(function(o){return optText(ex,o);}).join('; '):'(none selected)';
    case 'match': return ex.items.map(function(it){ var z=a[it.id]; return it.text+' \u2192 '+(z?findId(ex.targets,z).label:'(none)'); }).join('; ');
    case 'order': return a.map(function(eid,k){ var en=findId(ex.entries,eid); return (k+1)+'. '+en.text; }).join('  |  ');
    case 'fill': return ex.blanks.map(function(b,k){ return a[k]?String(a[k]):'(empty)'; }).join('; ');
    case 'spot': return a.length?a.map(function(lid){ return lineText(ex,lid); }).join('; '):'(nothing flagged)';
    case 'sim': return ex.steps.map(function(st,k){ var ch=a[k]; return 'Step '+(k+1)+': '+(ch?findId(st.options,ch).text:'(none)'); }).join('  |  ');
    case 'num': return String(a)+' '+(ex.unit||'');
    case 'terminal': return String(a);
  }
  return '';
}
function correctSummary(ex){
  switch(ex.type){
    case 'qcm': return correctText(ex);
    case 'multi': return ex.correct.map(function(o){return optText(ex,o);}).join('; ');
    case 'match': return ex.items.map(function(it){ return it.text+' \u2192 '+findId(ex.targets,ex.solution[it.id]).label; }).join('; ');
    case 'order': return ex.correctOrder.map(function(eid,k){ return (k+1)+'. '+findId(ex.entries,eid).text; }).join('  |  ');
    case 'fill': return ex.blanks.map(function(b,k){ return 'Blank '+(k+1)+': '+b.correct; }).join('; ');
    case 'spot': return ex.correctIds.map(function(lid){ return lineText(ex,lid); }).join('; ');
    case 'sim': return ex.steps.map(function(st,k){ return 'Step '+(k+1)+': '+findId(st.options,st.correct[0]).text; }).join('  |  ');
    case 'num': return ex.value+' '+(ex.unit||'');
    case 'terminal': return ex.terminal.canonical;
  }
  return '';
}

/* ---------------- events ---------------- */
function refreshWidget(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  var w=byId('widget');
  if(w){ w.innerHTML=widgetHTML(ex,exIdx); }
}
function moveEntry(eid,dir){
  var exIdx=curExIdx(), ex=EXS[exIdx], a=S.answers[ex.id];
  var k=a.indexOf(eid), j=k+dir;
  if(k<0||j<0||j>=a.length) return;
  var t=a[k];a[k]=a[j];a[j]=t;
  refreshWidget();
}
function reorderTo(eid,targetEid){
  var exIdx=curExIdx(), ex=EXS[exIdx], a=S.answers[ex.id];
  var from=a.indexOf(eid), to=a.indexOf(targetEid);
  if(from<0||to<0||from===to) return;
  a.splice(from,1);
  to=a.indexOf(targetEid);
  a.splice(from<to?to+1:to,0,eid);
  refreshWidget();
}
function focusTerm(){
  var inp=byId('term-in');
  if(inp&&!(S.checked[curEx().id])){ try{ inp.focus(); }catch(e){} }
}
function runCommand(){
  var exIdx=curExIdx(), ex=EXS[exIdx], t=ex.terminal||{};
  var inp=byId('term-in');
  if(!inp) return;
  var raw=inp.value;
  S.answers[ex.id]=raw;
  var scroll=byId('term-scroll');
  if(!scroll) return;
  if(!TERM_LOG[ex.id]) TERM_LOG[ex.id]=[];
  var cmd=normCmd(raw);
  if(!cmd){ return; }
  TERM_LOG[ex.id].push({cls:'cmd',text:(t.prompt||'$')+' '+raw});
  var printed=false;
  (t.accept||[]).forEach(function(ac){
    if(!printed&&cmd.indexOf(ac.find)>=0){ (ac.output||[]).forEach(function(o){ TERM_LOG[ex.id].push({cls:'out',text:o}); }); printed=true; }
  });
  if(!printed){
    var firstWord=cmd.split(' ')[0]||'';
    TERM_LOG[ex.id].push({cls:'err',text:'bash: '+firstWord+': command not found (this simulated shell only recognises the command this exercise needs)'});
  }
  var h='';
  TERM_LOG[ex.id].forEach(function(l){ h+='<div class="'+l.cls+'">'+esc(l.text)+'</div>'; });
  scroll.innerHTML=h;
  scroll.scrollTop=scroll.scrollHeight;
  inp.value='';
  S.answers[ex.id]=raw;   /* keep the last typed command as the graded answer */
}

function onClick(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.getAttribute&&n.getAttribute('data-act'))){ n=n.parentNode; }
  if(!n||n===document||!n.getAttribute) return;
  var act=n.getAttribute('data-act'), id=n.getAttribute('data-id');
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.view==='intro'){ if(act==='start'){ startExam(); } return; }
  if(S.view==='review'){
    if(act==='return'){ returnToSkipped(parseInt(n.getAttribute('data-idx'),10)); }
    else if(act==='submit-exam'){ finishExam(false); }
    else if(act==='finish'){ endFlow(); }
    return;
  }
  if(S.view==='results'){
    if(act==='retake'){ retakeExam(); }
    else if(act==='copy-canon'){ try{ var pre=byId('canon-cmd'); if(pre&&navigator.clipboard){ navigator.clipboard.writeText(pre.textContent); n.textContent='Copied'; } }catch(e){} }
    return;
  }
  /* exam view */
  if(act==='toggle-scen'){
    var blk=byId('scenblock');
    blk.classList.toggle('scen-collapsed');
    n.textContent=blk.classList.contains('scen-collapsed')?'Expand':'Collapse';
    return;
  }
  if(act==='resume'){ S.manualPause=false; render(); return; }
  if(act==='pause'){ S.manualPause=!S.manualPause; render(); return; }
  if(act==='hint'){ useHint(); return; }
  if(act==='skip'){ skipCurrent(); return; }
  if(act==='finish'){ endFlow(); return; }
  if(act==='open-review'){ endFlow(); return; }
  if(act==='check'){ checkAnswer(); return; }
  if(act==='next'){ goNext(); return; }
  if(S.checked[ex.id]&&act!=='copy-canon'){ return; }
  if(act==='opt'){
    if(ex.type==='qcm'){ S.answers[ex.id]=id; }
    else { var arr=S.answers[ex.id]; var ix=arr.indexOf(id); if(ix>=0){arr.splice(ix,1);} else {arr.push(id);} }
    S.warned=false; refreshWidget(); return;
  }
  if(act==='m-item'){ SEL.item=(SEL.item===id)?null:id; refreshWidget(); return; }
  if(act==='m-zone'){
    if(SEL.item){ S.answers[ex.id][SEL.item]=id; SEL.item=null; refreshWidget(); }
    return;
  }
  if(act==='m-unassign'){ delete S.answers[ex.id][id]; refreshWidget(); return; }
  if(act==='ord-up'){ moveEntry(id,-1); return; }
  if(act==='ord-down'){ moveEntry(id,1); return; }
  if(act==='token'){ var tid=n.getAttribute('data-t'); SEL.token=(SEL.token===tid)?null:tid; refreshWidget(); return; }
  if(act==='blank'){
    var k=parseInt(n.getAttribute('data-k'),10);
    if(S.answers[ex.id][k]!==undefined&&S.answers[ex.id][k]!==null){ delete S.answers[ex.id][k]; }
    else if(SEL.token){ S.answers[ex.id][k]=SEL.token; SEL.token=null; }
    refreshWidget(); return;
  }
  if(act==='line'){
    var arr2=S.answers[ex.id]; var ix2=arr2.indexOf(id);
    if(ix2>=0){ arr2.splice(ix2,1); } else { arr2.push(id); }
    S.warned=false; refreshWidget(); return;
  }
  if(act==='sim-opt'){
    var step=parseInt(n.getAttribute('data-step'),10);
    S.answers[ex.id][step]=id;
    S.warned=false; refreshWidget(); return;
  }
  if(act==='copy-canon'){ try{ var pre2=byId('canon-cmd'); if(pre2&&navigator.clipboard){ navigator.clipboard.writeText(pre2.textContent); n.textContent='Copied'; } }catch(e){} return; }
}
function onKey(ev){
  var act=ev.target&&ev.target.getAttribute?ev.target.getAttribute('data-act'):null;
  if(act==='cmd'&&ev.key==='Enter'){ ev.preventDefault(); runCommand(); return; }
  if(act==='num'){ var ex=curEx(); S.answers[ex.id]=ev.target.value; S.warned=false; return; }
  if(act==='cmd'){ var ex2=curEx(); S.answers[ex2.id]=ev.target.value; return; }
  /* keyboard activation for non-button controls (match drop zones) */
  if((ev.key==='Enter'||ev.key===' ')&&act&&ev.target&&ev.target.tagName!=='BUTTON'&&ev.target.tagName!=='INPUT'){
    ev.preventDefault(); ev.target.click(); return;
  }
}
function onInput(ev){
  var act=ev.target&&ev.target.getAttribute?ev.target.getAttribute('data-act'):null;
  if(act==='num'){
    var ex=curEx(); S.answers[ex.id]=ev.target.value; S.warned=false; return;
  }
  if(act==='cmd'){
    var ex2=curEx(); S.answers[ex2.id]=ev.target.value; return;
  }
  if(act==='logfilter'){
    var q=String(ev.target.value||'').toLowerCase();
    var body=byId('logbody'), cnt=byId('logcnt');
    if(body){
      var rows=body.querySelectorAll('.ln-row'), shown=0;
      rows.forEach(function(r){
        var txt=r.textContent.toLowerCase();
        var show=!q||txt.indexOf(q)>=0;
        r.style.display=show?'':'none';
        if(show) shown++;
      });
      if(cnt) cnt.textContent=shown+' of '+rows.length+' lines';
    }
  }
}
function onDragStart(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.getAttribute&&n.getAttribute('data-act'))){ n=n.parentNode; }
  if(!n||n===document) return;
  var act=n.getAttribute('data-act');
  if(act==='m-item'||act==='ord-item'){
    ev.dataTransfer.setData('text/plain',n.getAttribute('data-id'));
    ev.dataTransfer.effectAllowed='move';
    if(n.classList){ n.classList.add('dragging'); }
  }
}
function onDragEnd(ev){
  var n=ev.target;
  if(n&&n.classList){ n.classList.remove('dragging'); }
}
function onDragOver(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList){
    if(n.classList.contains('m-zone')){ ev.preventDefault(); n.classList.add('over'); }
    else if(n.classList.contains('ord-item')){ ev.preventDefault(); n.classList.add('drop-into'); }
  }
}
function onDragLeave(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList){ n.classList.remove('over'); n.classList.remove('drop-into'); }
}
function onDrop(ev){
  var n=ev.target;
  while(n&&n!==document&&!(n.classList&&(n.classList.contains('m-zone')||n.classList.contains('ord-item')))){ n=n.parentNode; }
  if(n&&n!==document&&n.classList&&n.classList.contains('m-zone')){
    ev.preventDefault();
    n.classList.remove('over');
    var eid=ev.dataTransfer.getData('text/plain');
    var zid=n.getAttribute('data-id');
    var ex=curEx();
    if(eid&&zid&&ex.type==='match'&&ex.items.some(function(it){return it.id===eid;})){
      S.answers[ex.id][eid]=zid; SEL.item=null; refreshWidget();
    }
    return;
  }
  if(n&&n!==document&&n.classList&&n.classList.contains('ord-item')){
    ev.preventDefault();
    var eid2=ev.dataTransfer.getData('text/plain');
    var tid=n.getAttribute('data-id');
    var ex2=curEx();
    if(eid2&&tid&&eid2!==tid&&ex2.type==='order'&&ex2.entries.some(function(e){return e.id===eid2;})){
      reorderTo(eid2,tid);
    }
  }
}
function initExam(){
  var app=byId('app');
  app.addEventListener('click',onClick);
  app.addEventListener('keydown',onKey);
  app.addEventListener('input',onInput);
  app.addEventListener('dragstart',onDragStart);
  app.addEventListener('dragend',onDragEnd);
  app.addEventListener('dragover',onDragOver);
  app.addEventListener('dragleave',onDragLeave);
  app.addEventListener('drop',onDrop);
  render();
}
document.addEventListener('DOMContentLoaded',initExam);

</script>
</body>
