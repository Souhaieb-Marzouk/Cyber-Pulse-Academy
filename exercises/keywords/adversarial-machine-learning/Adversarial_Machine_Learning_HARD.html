<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adversarial Machine Learning — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{

<style>

:root{
  --bg:#0b1220; --bg2:#0d1526; --panel:#121c33; --panel2:#0f1930; --ink:#0a1120;
  --line:#26365a; --line2:#33477a;
  --text:#e8eefb; --muted:#aab8d6; --faint:#8296bd;
  --scen:#4f8ef7; --scenbg:#101d3a;
  --q:#f5a524; --qbg:#241d0b;
  --ans:#37c26e; --ansbg:#0e2718;
  --ok:#37c26e; --part:#f5a524; --bad:#f0564a; --skip:#9aa8c4;
  --sev-easy:#37c26e; --sev-medium:#f5a524; --sev-hard:#f97316; --sev-extreme:#f0564a;
  --focus:#8ec2ff;
  --mono:'Cascadia Code','Sarasa Mono SC',Consolas,'DejaVu Sans Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);
  font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;}
#app{max-width:1060px;margin:0 auto;padding:0 16px 64px}
code,pre,.mono{font-family:var(--mono)}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--focus)}

/* ---------- persistent exam header ---------- */
.xhead{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 4px;margin:0 -16px 18px;padding-left:16px;padding-right:16px}
.xh-count{font-weight:700;white-space:nowrap}
.sev-badge{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.06em;
  border:1px solid;padding:5px 10px;border-radius:999px;white-space:nowrap;min-height:24px}
.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(55,194,110,.10)}
.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(245,165,36,.10)}
.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(249,115,22,.10)}
.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(240,86,74,.12)}
.xh-mid{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.xh-row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.xh-timer{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap}
.xh-timer .mode{color:var(--muted);font-weight:600;font-size:13px}
.xh-score{font-family:var(--mono);font-size:15px;color:var(--muted);white-space:nowrap}
.xh-progress{height:6px;background:#1a2646;border-radius:99px;overflow:hidden}
.xh-progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#37c26e);transition:width .4s ease}
.xh-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#172441;color:var(--text);
  cursor:pointer;font-weight:600;transition:transform .08s ease,background .15s ease}
.btn:hover{background:#1d2d52}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2f6fed,#37c26e);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--q);color:var(--q)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.blank:focus-visible,.token:focus-visible,.m-item:focus-visible,
.m-zone:focus-visible,.cl:focus-visible,.ord-btn button:focus-visible,.mini:focus-visible,input:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px}
.mini{min-height:44px;min-width:44px;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

/* ---------- intro ---------- */
.hero{padding:26px 4px 8px}
.hero .kicker{color:var(--focus);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.hero h1{margin:6px 0 10px;font-size:32px}
.hero .sub{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:13.5px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.panel h2{margin:0 0 10px;font-size:19px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--focus)}
.panel p{margin:8px 0;color:var(--text)}
.panel .dim{color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.theme-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.theme-card h3{margin:0 0 8px;font-size:15px;color:var(--focus)}
.tcon{display:flex;flex-wrap:wrap;gap:6px}
.tcon span{background:#16244a;border:1px solid var(--line);border-radius:8px;padding:3px 9px;
  font-size:12.5px;color:var(--muted)}
.rules li{margin:6px 0}
.rules ul{padding-left:22px;margin:6px 0}
.start-row{display:flex;gap:14px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.cand{color:var(--muted);font-size:14px}
.note{border-left:3px solid var(--q);background:var(--qbg);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.note.blue{border-left-color:var(--scen);background:var(--scenbg)}
.note.green{border-left-color:var(--ans);background:var(--ansbg)}

/* ---------- exercise layout: three blocks ---------- */
.card{margin:0 0 26px}
.block{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:800;letter-spacing:.08em;
  font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.block-head .mini{margin-left:auto;text-transform:none;letter-spacing:0}
.block.scen{border-left:4px solid var(--scen)}
.block.scen .block-head{color:var(--scen);background:var(--scenbg)}
.block.q{border-left:4px solid var(--q)}
.block.q .block-head{color:var(--q);background:var(--qbg)}
.block.ans{border-left:4px solid var(--ans)}
.block.ans .block-head{color:var(--ans);background:var(--ansbg)}
.block-body{padding:14px 16px}
.scen-collapsed .scen-extra{display:none}
.scen-summary{margin:2px 0 8px;color:var(--focus);font-weight:600}
.scen-extra p{margin:8px 0}
.artefact{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);margin:12px 0;overflow:hidden}
.artefact .af-label{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--focus);border-bottom:1px solid var(--line);
  background:#0e1834}
.artefact .af-body{padding:10px 12px}
.artefact p{margin:8px 0}
.q-text{margin:6px 0 2px}
.q-text strong{font-size:17px}

/* monospace log/code rendering */
.logtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.logtools input{flex:1;background:#0a1224;border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:9px 12px;min-height:44px;font-family:var(--mono);font-size:14px}
.logtools .cnt{color:var(--faint);font-size:12.5px;white-space:nowrap}
pre.mono,div.mlog{background:#0a1224;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6;margin:0}
div.mlog .ln-row{display:block;white-space:pre-wrap}
code .t-info{color:#7dd3fc}code .t-warn{color:#fbbf24}code .t-bad{color:#f87171}
code .t-num{color:#c4b5fd}code .t-ip{color:#6ee7b7}code .t-time{color:#94a3b8}code .t-str{color:#fca5a5}
table.arttab{border-collapse:collapse;width:100%;font-size:14.5px}
table.arttab th,table.arttab td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.arttab th{background:#0e1834;color:var(--focus);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
table.arttab td.num{font-family:var(--mono)}
.chatline{margin:8px 0;padding:8px 12px;border-radius:10px;background:#16224a;border:1px solid var(--line)}
.chatline .who{font-weight:700;color:var(--focus);font-size:13.5px;margin-right:8px}

/* ---------- answer widgets ---------- */
.widget{padding:14px 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 14px;
  border-radius:10px;border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer}
.opt:hover{background:#182748}
.opt.sel{border-color:var(--focus);background:#1a2c56}
.opt.lock{cursor:default}
.opt .lab{font-weight:800;color:var(--focus);min-width:26px}
.multi-note{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.match-grid{grid-template-columns:1fr}}
.m-item{display:block;width:100%;text-align:left;min-height:48px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line2);background:#131f3d;color:var(--text);cursor:pointer;margin:8px 0}
.m-item.sel{border-color:var(--focus);background:#1a2c56}
.m-item.used{opacity:.55}
.m-zone{border:1.5px dashed var(--line2);border-radius:12px;padding:10px 12px;min-height:64px;margin:8px 0;
  background:#0e1834;cursor:pointer}
.m-zone.over{border-color:var(--focus)}
.mz-label{font-weight:700;color:var(--focus);font-size:14px;margin-bottom:6px}
.mz-chip{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#1a2c56;
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin:6px 0}
.mz-chip button{background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:15px;min-width:44px;min-height:44px}
.ord{list-style:none;margin:0;padding:0}
.ord-item{display:flex;gap:10px;align-items:center;background:#131f3d;border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin:8px 0;cursor:grab}
.ord-item.dragging{opacity:.5}
.ord-item .pos{font-family:var(--mono);font-weight:800;color:var(--focus);min-width:24px}
.ord-item .txt{flex:1}
.ord-item.drop-into{border-color:var(--focus);border-style:dashed}
.ord-btn{display:flex;gap:4px}
.ord-btn button{background:#0e1834;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  min-width:44px;min-height:44px;cursor:pointer;font-size:15px}
.fill-sent{line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border-radius:8px;border:1.5px dashed var(--line2);
  background:#0e1834;color:var(--text);padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:14.5px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--ans);background:var(--ansbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.token{background:#16244a;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;min-height:44px;
  color:var(--text);cursor:pointer;font-family:var(--mono);font-size:14.5px}
.token.sel{border-color:var(--focus);background:#1a2c56}
.code-lines{display:flex;flex-direction:column;gap:4px}
.cl{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0a1224;border:1px solid transparent;
  border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);font-family:var(--mono);font-size:14.5px;min-height:44px}
.cl:hover{border-color:var(--line2)}
.cl.flag{border-color:var(--q);background:#241d0b}
.cl .ln{color:var(--faint);min-width:26px}
.cl.flag .ln{color:var(--q)}
.cl code{white-space:pre-wrap}
.numwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numwrap input{background:#0a1224;border:1px solid var(--line2);color:var(--text);border-radius:8px;
  padding:10px 12px;min-height:44px;font-family:var(--mono);font-size:15.5px;width:150px}
.numwrap .unit{color:var(--muted)}
.sim-step{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:10px 0}
.sim-step .ss-head{font-weight:800;color:var(--q);letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin-bottom:6px}
.sim-step .outcome{margin:10px 0 2px;padding:9px 12px;border-left:3px solid var(--line2);background:#0c1428;
  border-radius:0 8px 8px 0;color:var(--muted)}
.sim-step.done{opacity:.92}
.sim-locked{color:var(--faint);font-size:13.5px;margin-top:8px}

/* terminal */
.term{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#05080f}
.term-bar{padding:8px 12px;background:#0e1834;color:var(--focus);font-size:13px;font-weight:700;
  border-bottom:1px solid var(--line);font-family:var(--mono)}
.term-scroll{padding:12px 14px;max-height:300px;overflow-y:auto;font-family:var(--mono);font-size:14.5px;line-height:1.6}
.term-scroll .cmd{color:#7dd3fc}
.term-scroll .err{color:#f87171}
.term-scroll .out{color:#c9d6f2}
.term-input{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px}
.term-input .ps1{color:var(--ans);font-family:var(--mono);font-weight:700}
.term-input input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);
  font-size:14.5px;min-height:44px}
.synpanel{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:12px 0}
.synpanel h4{margin:0 0 8px;font-size:14px;color:var(--focus)}
.synpanel table{border-collapse:collapse;font-size:13.5px;width:100%}
.synpanel td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
.synpanel td.f{font-family:var(--mono);color:#7dd3fc;white-space:nowrap}
.ex-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:#0e1834;
  border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);margin:6px 6px 0 0;font-family:var(--mono)}
.ex-chip.late{color:var(--q);border-color:var(--q)}

/* ---------- feedback ---------- */
.feedback{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:800;letter-spacing:.05em;
  font-size:14px;text-transform:uppercase}
.fb-ok{border-left:4px solid var(--ok)} .fb-ok .fb-head{color:var(--ok);background:rgba(55,194,110,.10)}
.fb-part{border-left:4px solid var(--part)} .fb-part .fb-head{color:var(--part);background:rgba(245,165,36,.10)}
.fb-bad{border-left:4px solid var(--bad)} .fb-bad .fb-head{color:var(--bad);background:rgba(240,86,74,.10)}
.fb-body{padding:14px 16px}
.fb-body h4{margin:12px 0 6px;font-size:14.5px}
.fb-body ul{margin:4px 0;padding-left:22px}
.fb-body li{margin:5px 0}
.fb-list-right li{color:#b8ecc9}
.fb-list-wrong li{color:#f6c1bc}
.fb-list-missed li{color:#fde9b8}
.pts-line{font-family:var(--mono);font-weight:700;color:var(--text)}
.copywrap{position:relative;margin:10px 0}
.copywrap pre{padding-right:64px}
.copybtn{position:absolute;top:8px;right:8px;min-height:44px;padding:4px 12px;border-radius:8px;
  border:1px solid var(--line2);background:#16244a;color:var(--muted);cursor:pointer;font-size:12.5px}
.warnline{color:var(--q);font-weight:600;margin:8px 0}
.navrow{display:flex;gap:12px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.checkmsg{color:var(--q);font-weight:600}

/* pause overlay */
.stage{position:relative}
.pause-overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:rgba(8,12,24,.97);border:1px solid var(--line);
  border-radius:14px;text-align:center;padding:20px}
.pause-overlay h2{margin:0}
.pause-overlay p{color:var(--muted);max-width:52ch}

/* ---------- review & results ---------- */
.rv-item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;flex-wrap:wrap}
.rv-item .rv-title{flex:1;min-width:240px}
.rv-item .rv-tag{color:var(--skip);font-size:13px}
.res-hero{border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.res-hero.pass{border-color:var(--ok);background:linear-gradient(180deg,rgba(55,194,110,.10),rgba(55,194,110,.02))}
.res-hero.fail{border-color:var(--bad);background:linear-gradient(180deg,rgba(240,86,74,.10),rgba(240,86,74,.02))}
.res-hero .big{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-hero .verdict{font-size:20px;font-weight:800;letter-spacing:.14em;margin:6px 0}
.res-hero .pts{color:var(--muted);font-family:var(--mono)}
.res-bar{height:12px;border-radius:99px;background:#1a2646;overflow:hidden;margin:16px auto 6px;max-width:560px}
.res-bar .bar{height:100%;width:0;transition:width 1s ease}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:13px}
.rep-item{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:12px 0;overflow:hidden}
.rep-head{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rep-head .st{font-weight:800;font-size:13.5px}
.rep-head .st.ok{color:var(--ok)} .rep-head .st.part{color:var(--part)}
.rep-head .st.bad{color:var(--bad)} .rep-head .st.skip{color:var(--skip)}
.rep-head .rp-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.rep-body{padding:12px 16px}
.rep-body .qa{margin:8px 0;color:var(--muted)}
.rep-body .qa b{color:var(--text)}
.theme-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.theme-table th,.theme-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.theme-table th{background:#0e1834;color:var(--focus);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
@media (max-width:720px){
  .hero h1{font-size:25px}
  .xh-right{margin-left:0}
}
.hidden{display:none}

</style>
</head>
