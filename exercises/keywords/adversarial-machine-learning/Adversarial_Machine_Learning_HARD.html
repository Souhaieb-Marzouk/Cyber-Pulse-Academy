<script>
window.EXAM_DATA = {"meta":{"topicId":"adversarial-machine-learning","batch":3,"title":"Adversarial Machine Learning — HARD","pageTitle":"Adversarial Machine Learning — HARD practice exam","difficulty":"hard","questionCount":17,"estimatedMinutes":60,"passMark":70,"timerSeconds":3600},"intro":"<div class=\"hero\"><div class=\"kicker\">CyberPulseAcademy practice exam<\/div><h1>Adversarial Machine Learning<\/h1><p class=\"sub\">A hands-on certification exam on one keyword: <b>Adversarial Machine Learning<\/b>. Everything runs inside this single page. Nothing is sent anywhere.<\/p><div class=\"chips\"><span class=\"chip\">17 exercises<\/span><span class=\"chip\">Timer: 60 minutes<\/span><span class=\"chip\">Pass mark: 70%<\/span><span class=\"chip\">100 points per exercise<\/span><span class=\"chip\">Partial credit for multi-answer exercises<\/span><\/div><\/div><div class=\"panel\"><h2>Keywords covered<\/h2><p class=\"dim\">The keyword expands into the concept groups below. Every group is exercised in this exam family; each difficulty tier covers it at its own depth.<\/p><div class=\"theme-grid\"><div class=\"theme-card\"><h3>Evasion attacks<\/h3><div class=\"tcon\"><span>Adversarial example<\/span><span>Perturbation<\/span><span>Perturbation budget (epsilon)<\/span><span>FGSM<\/span><span>PGD<\/span><span>C&amp;W attack<\/span><span>DeepFool<\/span><span>Adversarial patch<\/span><span>Physical-world attack<\/span><span>Black-box / grey-box / white-box<\/span><span>Transferability<\/span><span>Query-based attack<\/span><span>L0 / L2 / L-inf norms<\/span><\/div><\/div><div class=\"theme-card\"><h3>Poisoning &amp; supply chain<\/h3><div class=\"tcon\"><span>Data poisoning<\/span><span>Label flipping<\/span><span>Backdoor (Trojan) attack<\/span><span>Trigger<\/span><span>BadNets<\/span><span>Supply-chain poisoning<\/span><span>Federated learning poisoning<\/span><span>Data validation<\/span><\/div><\/div><div class=\"theme-card\"><h3>Model theft &amp; privacy<\/h3><div class=\"tcon\"><span>Model extraction<\/span><span>Model inversion<\/span><span>Membership inference<\/span><span>Attribute inference<\/span><span>Watermarking<\/span><span>Honeypots<\/span><span>Differential privacy<\/span><\/div><\/div><div class=\"theme-card\"><h3>Defenses &amp; robustness<\/h3><div class=\"tcon\"><span>Adversarial training<\/span><span>Defensive distillation<\/span><span>Gradient masking<\/span><span>Input preprocessing<\/span><span>Randomization<\/span><span>Randomized smoothing<\/span><span>Ensembles<\/span><span>Adversarial-input detection<\/span><span>Robust aggregation<\/span><span>Monitoring &amp; drift<\/span><\/div><\/div><div class=\"theme-card\"><h3>Evaluation, tools &amp; governance<\/h3><div class=\"tcon\"><span>Clean vs robust accuracy<\/span><span>Attack success rate<\/span><span>RobustBench<\/span><span>AutoAttack<\/span><span>Adversarial Robustness Toolbox (ART)<\/span><span>Foolbox<\/span><span>CleverHans<\/span><span>Counterfit<\/span><span>MITRE ATLAS<\/span><span>OWASP ML Top 10<\/span><span>NIST AI RMF<\/span><span>EU AI Act<\/span><span>Model cards &amp; datasheets<\/span><span>Model registry &amp; signing<\/span><span>AI red teaming<\/span><span>Risk register<\/span><span>MLOps pipeline security<\/span><\/div><\/div><\/div><\/div><div class=\"panel\"><h2>What you will learn (plain language)<\/h2><p>Welcome to the hard tier. The scenarios now look like real shifts: several artefacts, conflicting signals, and stakeholders who want decisions, not definitions.<\/p><p>Adversarial Machine Learning at work is rarely obvious. The bulk client that looks dangerous is under contract. The quiet client that looks harmless is running a measured extraction campaign. The alarming detector alert is a corrupted camera firmware. The obvious answer is wrong often enough that you must earn every conclusion from the artefacts.<\/p><p>You will correlate tickets, gateway logs, change records, and metric tables. You will choose responses that stop attackers without punishing partners, and you will state the real cost of your recommendations. You will read robustness reports the way a reviewer does: with the strong attack, not the flattering one.<\/p><p>The defences you meet here all have documented limits: distillation fell to the C&amp;W attack, gradient masking hides rather than fixes, preprocessing survives only until an attacker optimises through it, and randomized smoothing certifies a radius, not the world. Knowing the boundary of a control is the senior skill.<\/p><p>Read the rules, then start. In this tier at least one plausible shortcut leads to a wrong answer in many exercises. Hints remove one wrong path; they never name the correct concept.<\/p><\/div><div class=\"panel\"><h2>This tier: HARD — near-miss discrimination<\/h2><p>HARD mixes two to three interacting concepts per exercise, with artefact sets you must correlate. At least two options in many exercises are defensible in a different context, and the obvious answer is wrong in a good share of them. Traps include alarming-but-benign traffic, benign-looking campaigns, and least-aggressive response choices with real costs.<\/p><\/div><div class=\"panel\"><h2>How scoring works<\/h2><div class=\"rules\"><ul><li>Every exercise is worth <b>100 points<\/b>.<\/li><li>Exercises with exactly one correct answer are all-or-nothing: right means 100, wrong means 0.<\/li><li>Multi-answer exercises give <b>partial credit<\/b>. If you find some of the correct answers, you get some of the points. Wrong picks cancel right picks: points = (correct picks − wrong picks) ÷ total correct picks × 100, never below 0.<\/li><li>The <b>Hint<\/b> button costs 10% of that exercise's points (one hint per exercise). The hint gives you a nudge, never the answer. Using a hint does not pause the timer.<\/li><li>Live score in the header counts only exercises you have actually answered.<\/li><li>You pass with <b>70%<\/b> or more over the answered exercises. Skipped-and-never-answered exercises are excluded from both your points and the total.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Timer rules (two ways the clock stops)<\/h2><div class=\"rules\"><ul><li>You have <b>60 minutes<\/b> in total for all 17 exercises.<\/li><li><b>Manual pause:<\/b> press Pause in the header for a break. The exercise is hidden and the clock stops until you press Resume.<\/li><li><b>Pause after Check:<\/b> when you press Check, the clock stops by itself so you can read the explanation with free time. The exercise and the feedback stay fully visible.<\/li><li>The clock starts again the moment you press Next. Pressing Hint or Skip never pauses the clock.<\/li><li>If time runs out, the exam closes and your score is computed over what you answered.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Skipping and finishing<\/h2><div class=\"rules\"><ul><li>Every exercise has a <b>Skip<\/b> button. Skipping is free and does not reveal the answer.<\/li><li>Before the exam can finish, a <b>Review skipped<\/b> screen lists everything you skipped. You can return to any of it, as many times as you need, while the timer runs.<\/li><li>If you submit while some exercises are still unanswered, those are marked <b>⚠ Not answered — excluded from score<\/b>. They do not help or hurt your percentage.<\/li><\/ul><\/div><\/div><div class=\"panel\"><h2>Exercise types in this exam<\/h2><p>Correlatable gateway and detector logs with a filter box, metric tables, dual-perspective red/blue cards, config audits (spot the weakening lines), defense-limitation matching, urgency ranking, precise report drafting, a forensic terminal exercise, and select-all conclusions with partial credit.<\/p><p class=\"dim\">Every exercise screen shows the same three blocks, always in the same order: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber), <b>YOUR ANSWER<\/b> (green). Long scenarios can be collapsed with the button in the scenario header; a one-line summary stays visible.<\/p><\/div><div class=\"start-row\"><button class=\"btn primary\" data-act=\"start\">Start the exam<\/button><span class=\"cand\" id=\"cand-name\"><\/span><\/div>","exercises":[{"id":"h01","type":"sim","answerType":"multi","theme":"Model theft & privacy","summary":"Two clients on the cheque scoring API: one is contracted bulk, one is extraction.","scenario":{"intro":["Vertex Payments runs a vision-based cheque scoring API. Two clients are active tonight, and the duty director wants one decision before the 03:00 change window closes.","batch-partner-04 is a contracted cheque-batch processor. The contract allows 5,000 images per day. Cheque stock makes the images visually near-identical, and outputs stay label-only.","sdk-gw-91 is an SDK key with no contract on file. It holds a steady 380 requests per hour. Each request is a distinct tiny variation of one of 14 base cheque images (mean L2 distance 0.009), it requests the full probability vector, and it backs off politely on 429 and resumes.","ARTEFACT 1 is the gateway excerpt. It supports filtering: type a client id in the filter box to isolate one pattern."],"artifacts":[{"label":"ARTEFACT 1 — gateway log excerpt (filterable)","kind":"log","lines":["2026-10-03 01:12:04 INFO  client=batch-partner-04 qps=6.2 inputs=distinct:38 outputs=label_only contract=CP-2214","2026-10-03 01:12:09 INFO  client=batch-partner-04 qps=6.2 inputs=distinct:31 outputs=label_only contract=CP-2214","2026-10-03 01:12:14 WARN  client=sdk-gw-91 qps=0.11 inputs=distinct:371 outputs=full_logits base_images=14","2026-10-03 01:12:19 INFO  client=batch-partner-04 qps=6.2 inputs=distinct:40 outputs=label_only contract=CP-2214","2026-10-03 01:12:24 WARN  client=sdk-gw-91 qps=0.11 inputs=distinct:374 outputs=full_logits base_images=14","2026-10-03 01:12:29 WARN  client=sdk-gw-91 status=429 backoff=8.0 then_resume=yes","2026-10-03 01:12:34 WARN  client=sdk-gw-91 qps=0.11 inputs=distinct:377 outputs=full_logits base_images=14","2026-10-03 01:12:39 INFO  client=batch-partner-04 qps=6.2 inputs=distinct:29 outputs=label_only contract=CP-2214","2026-10-03 01:12:44 WARN  client=sdk-gw-91 qps=0.11 inputs=distinct:380 outputs=full_logits base_images=14","2026-10-03 01:12:49 INFO  client=batch-partner-04 batch_done total=4180 duplicates=expected_cheque_stock"]}]},"question":"Answer both decision cards.","steps":[{"prompt":"Decision 1: Which client is running an extraction campaign?","options":[{"id":"A","text":"sdk-gw-91: distinct micro-variations of few base images, full logits, backoff-and-resume","outcome":"You flag sdk-gw-91. The pattern is a measured, budgeted probing campaign, not a bulk job.","why":"Many distinct micro-variations of few base images plus full-output requests and disciplined backoff is the extraction signature."},{"id":"B","text":"batch-partner-04: high volume with near-identical images is the giveaway","outcome":"The partner's near-identical images are the cheque stock itself, its volume is inside the contract, and outputs are label-only.","why":"Contractual context and output tier explain the bulk pattern; there is no probing structure."},{"id":"C","text":"Both clients show extraction","outcome":"One pattern is contracted bulk with label-only outputs; treating both alike would hit a legitimate partner.","why":"Only one pattern has distinct controlled variations, a higher output tier, and rate-limit evasion."},{"id":"D","text":"Neither: low request rate proves no extraction","outcome":"Extraction campaigns are patient: 0.11 qps sustained for weeks still yields millions of labelled pairs.","why":"A low rate does not clear a client; the input structure and output tier decide, and both point at sdk-gw-91."}],"correct":["A"]},{"prompt":"Decision 2: The director wants the least disruptive action that still stops the campaign. Choose it.","options":[{"id":"A","text":"Throttle sdk-gw-91, move it to label-only outputs, preserve logs, contact the key's registered owner","outcome":"The campaign loses its signal within minutes, the partner is untouched, and the evidence pack is complete.","why":"Throttling plus output tiering stops progress at once, keeps business running, and preserves evidence for the owner enquiry."},{"id":"B","text":"Block both clients at the edge immediately","outcome":"A contracted partner loses its nightly window and asks why its contract was ignored; the attacker rotates keys.","why":"Disproportionate and evidence-hostile: it punishes the innocent client and only delays the attacker."},{"id":"C","text":"Retrain the model tonight","outcome":"Retraining does not stop output harvesting; by morning the campaign would be a fifth done.","why":"No poisoning or accuracy issue exists; retraining answers a different problem."},{"id":"D","text":"Publish a public advisory naming the attacker","outcome":"The key owner may be a victim of a stolen key; a public accusation without evidence creates legal exposure.","why":"Naming suspects before the owner enquiry and evidence review is premature and risky."}],"correct":["A"]}],"explanation":"Two traps are stacked here. The loud pattern (bulk, near-identical images) is benign because the contract and the cheque stock explain it and outputs are label-only. The quiet pattern (low rate, polite backoff) is alarming because the inputs are controlled micro-variations and the outputs are full probability vectors. Extraction feeds on exactly that combination. The correct response is the least aggressive one that stops progress while keeping evidence: throttle, tier down the outputs, and investigate the key owner.","study":"Study extraction signatures: input uniqueness, output tiers, and rate-limit behaviour.","hint":"Volume is the trap. Compare input structure and output tier per client, then choose the action that stops the attacker without hurting the partner."},{"id":"h02","type":"multi","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Three conclusions in the robustness report survive review; pick them.","scenario":{"intro":["You review the robustness report for the perception vendor's lane-keeping classifier before the steering committee reads it.","The committee will fund work based on which conclusions you accept. Wrong conclusions have burned this committee before.","Select every conclusion the report's numbers actually support."],"artifacts":[{"label":"ARTEFACT 1 — robustness report (extract)","kind":"table","head":["Evaluation","Result"],"rows":[["Clean accuracy (no attack)","99.2 %"],["FGSM robust accuracy, eps 8/255","12.4 %"],["PGD robust accuracy, eps 8/255","3.1 %"],["Black-box transfer success (surrogate PGD)","40.0 %"],["DeepFool mean minimal perturbation (L2)","0.004"]]}]},"question":"Select every conclusion the numbers support. Partial credit applies.","options":[{"id":"A","text":"The model is not robust against strong iterative attacks at the tested budget"},{"id":"B","text":"FGSM-only numbers would have overstated robustness by a wide margin"},{"id":"C","text":"A 40 percent transfer success makes surrogate-based black-box attacks a live risk"},{"id":"D","text":"Clean accuracy of 99.2 percent shows readiness for hostile deployment"},{"id":"E","text":"FGSM robustness of 12.4 percent is acceptable because it beat the old 8 percent target"},{"id":"F","text":"DeepFool's tiny mean perturbation of 0.004 shows the model is nearly robust"}],"correct":["A","B","C"],"why":{"A":"PGD at 3.1 percent means almost every strong attack succeeds; that is the definition of not robust at this budget.","B":"FGSM says 12.4 percent while PGD says 3.1 percent: the fast one-step attack hides how fragile the model is.","C":"Transferred examples succeed 40 percent of the time without any query access to the real model.","D":"Clean accuracy describes a world with no attacker; the committee is funding for the world with one.","E":"Beating an old, weak target is not a robustness statement; against PGD the same model scores 3.1 percent.","F":"DeepFool's small mean perturbation shows decision boundaries sit close to the data, which means the model is easier to attack, not safer."},"explanation":"Read the table against the threat: PGD 3.1 percent is the strong-attack result and it is bad. FGSM 12.4 versus PGD 3.1 shows why FGSM-only reports mislead. A 40 percent transfer success means an attacker needs no query access at all. Clean accuracy describes a different world. The 8 percent target is a process artifact, and DeepFool's tiny perturbation is evidence of fragility, not strength.","study":"Study why PGD is the reporting standard and how DeepFool results are read.","hint":"Two distractors misuse a number that looks positive in isolation; ask what each metric actually measures."},{"id":"h03","type":"spot","answerType":"multi","theme":"Defenses & robustness","summary":"Three lines in the adversarial training config weaken the whole program.","scenario":{"intro":["You audit the adversarial training configuration of the perception team's v7 model.","The team says the model is being hardened. Some lines say otherwise.","Click every line that would make the robustness program weaker than it looks."]},"question":"Click every weakening line in the config.","artifact":{"kind":"lines","idPrefix":"l","lines":["# adversarial training config - perception v7","eps: 0.6                      # pixel scale 0-1","attack_for_training: fgsm","eval_attack: same_as_training","epochs: 50","early_stop: best_robust_val_accuracy"]},"correctIds":["l2","l3","l4"],"lineWhy":{"l2":"Epsilon 0.6 on a 0-1 pixel scale lets the training attack distort almost everything; the model trains on garbage and clean accuracy collapses.","l3":"FGSM-only training produces gradient masking against FGSM while PGD walks straight through it.","l4":"Evaluating with the same attack used in training overfits the evaluation: it measures memorised defense, not robustness.","l1":"A comment line. Nothing wrong here.","l5":"Fifty epochs is a normal budget for adversarial training at this scale.","l6":"Early stopping on robust validation accuracy is exactly the right criterion here."},"explanation":"Three lines weaken the program. An epsilon of 0.6 is far beyond realistic perturbations, so training optimises for a fantasy threat. FGSM-only training is the classic shortcut that produces fragility under PGD. And evaluating with the training attack measures the defense you memorised, not the one an attacker brings. Together they produce a model that looks hardened in the wrong report and fails in the field.","study":"Study adversarial training pitfalls: budget choice, attack strength, and honest evaluation.","hint":"Ask of each line: does this describe a realistic attacker, and is the evaluation independent of the training?"},{"id":"h04","type":"sim","answerType":"single","theme":"Poisoning & supply chain","summary":"A suspected backdoor in the OCR service: choose the least aggressive correct move.","scenario":{"intro":["Orbit Courier's OCR service digitises shipping labels. Trust & Safety found that a rare corner pattern (a 3 by 3 orange square) makes the service read a rerouted address as the original one.","The service has served production for five months. Retraining from scratch takes nine days and freezes all label intake while it runs.","The duty director demands: 'Contain the risk without stopping the business.'"]},"question":"Choose the correct next action.","steps":[{"prompt":"Which action contains the risk with the least business damage?","options":[{"id":"A","text":"Route any input showing trigger-like patterns to a clean secondary model and start trigger analysis","outcome":"Suspicious inputs stop trusting the poisoned model today, intake continues, and the analysis scopes the damage.","why":"Isolating trigger-bearing inputs is the least aggressive containment: it neutralises the trigger path while evidence work proceeds."},{"id":"B","text":"Wipe the model and revert to manual entry for all shipments","outcome":"The business stops digitising entirely; the director's constraint is violated and no evidence is gathered.","why":"Full shutdown is the most aggressive option and is not justified while a clean secondary model exists."},{"id":"C","text":"Keep serving and note the issue for the quarterly review","outcome":"The trigger stays live for months; a rerouted shipment eventually causes a real loss.","why":"A confirmed trigger is an active risk, not a backlog item."},{"id":"D","text":"Delete the checkpoint file so the trigger cannot spread","outcome":"You destroy the evidence needed to trace where the poisoning entered, while production keeps serving the same poisoned model.","why":"Deleting the artifact neither contains the live risk nor preserves the evidence chain."}],"correct":["A"]}],"explanation":"The least aggressive option is the correct one when a partial control exists. Routing trigger-like inputs to a clean secondary model neutralises the backdoor path without the nine-day freeze, and it keeps the evidence intact for trigger analysis. Wiping, waiting, or destroying artifacts either overreacts, underreacts, or destroys the investigation.","study":"Study backdoor containment: secondary models, trigger analysis, evidence preservation.","hint":"The director's constraint rules out the big hammer. Which option stops the trigger path today and keeps evidence?"},{"id":"h05","type":"sim","answerType":"multi","theme":"Poisoning & supply chain","summary":"Correlate the ticket, the metrics and the vendor change before deciding.","scenario":{"intro":["Vertex Payments' fraud model precision dropped from 92 to 84 percent over three weeks. Fraud losses are up.","Three artefacts are on your desk. The data team's first written explanation was 'drift, expected after onboarding'.","Your job: correlate the artefacts and decide what to do first."],"artifacts":[{"label":"ARTEFACT 1 — Ticket OPS-2214 (excerpt)","kind":"chat","messages":[{"who":"payments-ops","text":"Fraud losses up 3 weeks straight. Precision 84%. Reviewers complain the model trusts new merchant categories too easily."},{"who":"data-team","text":"Drift, expected after onboarding new merchants. Nothing to see."}]},{"label":"ARTEFACT 2 — change log (extract)","kind":"table","head":["Week","Change"],"rows":[["W31","New annotation vendor 'LabelLoom' onboarded for merchant risk labels"],["W32","Weekend label throughput doubled; two annotator IDs produce 61% of weekend labels"],["W33","Precision drop first reported"]]},{"label":"ARTEFACT 3 — label distribution check","kind":"table","head":["Slice","Risk='low' share","Reviewer-verified error"],"rows":[["Weekday labels, old vendor","41.2 %","1.9 %"],["Weekend labels, new vendor","77.8 %","14.3 %"]]}]},"question":"Answer both decision cards after reading all three artefacts.","steps":[{"prompt":"Decision 1: Which explanation do the artefacts support?","options":[{"id":"A","text":"Probable label poisoning through the new vendor, concentrated in weekend labels","outcome":"You classify it as probable poisoning: one vendor, one time window, one direction, high verified error.","why":"A single new source, a doubling of throughput from two IDs, a one-directional label shift and high verified error form the poisoning pattern; 'expected drift' does not produce a 14.3 percent verified error rate."},{"id":"B","text":"Benign drift from new merchant onboarding, as the ticket says","outcome":"Drift does not explain who produced the labels or why verified errors cluster in weekend slices.","why":"The artefacts tie the shift to one vendor and two annotator IDs; drift has no author."},{"id":"C","text":"Extraction, because losses rose","outcome":"Losses are a business effect; nothing in the artefacts shows query harvesting or a copied model.","why":"No serving-side evidence exists; the anomaly is in label production."},{"id":"D","text":"A pure metrics bug in the dashboard","outcome":"The reviewer-verified error is computed from human re-checks, not from the dashboard.","why":"Human verification of 14.3 percent error rules out a display bug."}],"correct":["A"]},{"prompt":"Decision 2: What is the correct first evidence step?","options":[{"id":"A","text":"Re-review a matched sample: same tickets labelled by the old vendor and by the new vendor","outcome":"The matched sample isolates the vendor as the variable; the error gap either reproduces or collapses.","why":"A matched comparison controls for ticket mix and directly tests the suspected source."},{"id":"B","text":"Retrain immediately on all data including weekend labels","outcome":"Retraining on the suspected poison bakes it in deeper and burns the one clean baseline you have.","why":"Rebuilding before scoping repeats the poisoning and destroys the comparison baseline."},{"id":"C","text":"Disable reviewer verification to speed up the pipeline","outcome":"You delete the only independent signal that caught the problem.","why":"The verification layer is the evidence source; disabling it protects the poison."},{"id":"D","text":"Ask the new vendor to confirm in writing that nothing happened","outcome":"A self-clearing letter is not evidence; the weekend labels stay unverified.","why":"Vendor self-attestation cannot substitute for an independent matched review."}],"correct":["A"]}],"explanation":"Correlation beats the first written explanation: the drop starts exactly when one vendor and two annotator IDs enter, the label shift is one-directional, and human re-verification finds 14.3 percent error in that slice. That is a poisoning pattern, not drift. The correct first evidence step is a matched comparison that isolates the suspected source, because it either reproduces the gap or clears the vendor, and it destroys nothing.","study":"Study poisoning triage: source attribution, one-directional shifts, and matched re-review.","hint":"One artefact names a source, one names a time window, one names an error rate. Which explanation needs all three to be true?"},{"id":"h06","type":"num","answerType":"single","theme":"Evaluation, tools & governance","summary":"Compute the attack success rate for the report.","scenario":{"intro":["Your assessment report needs one number that the committee will quote.","During the window you observed 12,400 queries to the staging API.","Of those, 3,100 were crafted adversarial inputs from your tooling.","The model mislabeled 1,860 of your crafted inputs."]},"question":"Give the attack success rate over the crafted inputs, as a percentage.","value":60,"tolerance":1,"unit":"%","note":"Round to the nearest whole percentage. Answer with a number.","whyNum":"1860 / 3100 = 0.60, so the attack success rate is 60 percent: six of ten crafted inputs fooled the model.","explanation":"The attack success rate is crafted inputs that fooled the model divided by crafted inputs submitted: 1860 of 3100 is 60 percent. The 12,400 total queries are context (and a detection signal), not the divisor: the success rate is defined over the crafted subset. A 60 percent success rate at this budget is a serious finding that demands a robustness program.","study":"Study attack success rate and why it is defined over crafted inputs only.","hint":"The divisor is the crafted subset, not all queries."},{"id":"h07","type":"sim","answerType":"multi","theme":"Evasion attacks","summary":"Dual perspective: break the JPEG defense as an attacker, then detect it as a defender.","scenario":{"intro":["Orbit Courier's label scanner applies JPEG compression at quality 40 as an input preprocessing defense, then classifies.","Part A: you are the red team. Your first straight PGD attack fails against the deployed service.","Part B: you are the blue team. Days later you must detect and respond to the attack that follows."]},"question":"Work through the four perspective steps in order.","steps":[{"prompt":"RED — Step 1: your straight PGD attack on the classifier fails at the service boundary. What do you conclude?","options":[{"id":"A","text":"The compression layer transforms my perturbation; I must optimise through an approximation of it","outcome":"You build a differentiable approximation of the JPEG pipeline and re-run optimisation end to end.","why":"Preprocessing defenses survive only until the attacker optimises through the transform (a differentiable approximation or expectation over transforms)."},{"id":"B","text":"The model is robust; report the failure and stop","outcome":"You file a false 'robust' verdict, and the next assessment against a stronger attacker proves otherwise.","why":"A single failed attack against an obfuscating layer is the known signature of gradient masking, not of robustness."},{"id":"C","text":"Switch the objective to model extraction instead","outcome":"You abandon the evasion objective; the engagement scope was evasion and the report loses its main question.","why":"Extraction is a different engagement; the evasion question remains open and answerable."},{"id":"D","text":"Increase eps to 2.0 so the attack must succeed","outcome":"The perturbation becomes visible garbage; the finding is real but outside the agreed budget and useless for the report.","why":"Blowing the budget invalidates the assessment rather than proving robustness."}],"correct":["A"]},{"prompt":"RED — Step 2: your through-the-transform attack works. How do you keep query volume under the rate limit?","options":[{"id":"A","text":"Batch near-duplicate probes inside legitimate-looking submissions and reuse gradients across them","outcome":"Your traffic blends with normal submissions; the detector sees no obvious volume spike.","why":"Spreading probes across legitimate-looking traffic is how adaptive attackers stay under volume thresholds."},{"id":"B","text":"Fire as fast as possible; success rate matters more than stealth","outcome":"The gateway rate-limits you within minutes and the engagement record shows an obvious attack pattern.","why":"Volume spikes are the cheapest signal for defenders; stealth is part of the threat model."},{"id":"C","text":"Stop querying; use only transferred examples from the surrogate","outcome":"Transfer-only inputs save queries but cap your success rate well below what through-the-transform optimisation achieves.","why":"Transferables help, but abandoning queries discards the adaptive advantage you just built."},{"id":"D","text":"Move the attack to the training pipeline instead","outcome":"You have no access to the training pipeline; the plan stalls and the window closes.","why":"The assessed surface is the inference API; a poisoning pivot is out of scope and infeasible here."}],"correct":["A"]},{"prompt":"BLUE — Step 3: which telemetry best separates this attacker from ordinary traffic?","options":[{"id":"A","text":"Input-neighbourhood statistics: unusually dense clusters of near-duplicate submissions with small, consistent L2 spacing","outcome":"The detector flags the dense, evenly spaced clusters even though total volume looks normal.","why":"Adaptive probing leaves a structural fingerprint: tight, evenly spaced clusters around base images, independent of raw volume."},{"id":"B","text":"Total requests per minute per client","outcome":"The attacker already stayed under the volume threshold; this signal stays green while the campaign succeeds.","why":"Rate alone was the control the attacker designed around; it cannot catch what it was built to miss."},{"id":"C","text":"Server CPU utilisation","outcome":"Inference cost per request is flat; CPU tells you nothing about input structure.","why":"Load metrics do not distinguish a crafted input from a normal one."},{"id":"D","text":"Count of 404 errors in the gateway","outcome":"The attacker never touches a missing route; this signal is irrelevant to evasion.","why":"HTTP-level noise is unrelated to input-space attacks."}],"correct":["A"]},{"prompt":"BLUE — Step 4: the detector confirms dense probe clusters. What is the correct response?","options":[{"id":"A","text":"Tune the detector threshold, alert on the cluster signature, and watch the affected segments before touching defenses","outcome":"You gain a working detection rule and avoid a blind defense change that a waiting attacker would simply adapt to.","why":"Measured detection first: raising a tuned alert keeps evidence flowing and avoids telegraphing your next move."},{"id":"B","text":"Remove the JPEG layer immediately and announce it in the changelog","outcome":"The attacker sees the defense change in the changelog and re-optimises within hours; you lose your telemetry anchor.","why":"Announcing defensive changes mid-campaign hands the attacker the adaptation target."},{"id":"C","text":"Retrain from scratch tonight with no other change","outcome":"A blind retrain neither closes the probing channel nor improves robustness; it burns a change window.","why":"Retraining is not a detection fix; without targeted changes the campaign resumes on the new model."},{"id":"D","text":"Ignore it: the success rate is still under 10 percent","outcome":"The attacker's optimisation improves week over week; by the time it matters, the evidence window has closed.","why":"A confirmed, improving campaign is an active risk; waiting surrenders the evidence advantage."}],"correct":["A"]}],"explanation":"The pair of perspectives teaches the full loop. Red side: a failed attack against a preprocessing layer is a reason to optimise through the transform, not proof of robustness, and adaptive attackers keep quiet by batching probes inside normal-looking traffic. Blue side: rate-based signals miss exactly that attacker, while input-neighbourhood structure (dense, evenly spaced clusters) does not; and the response that keeps evidence flowing beats a loud, announced defense change. This is why 'looks robust' and 'looks quiet' both need a second look.","study":"Study adaptive attacks on preprocessing defenses and cluster-based evasion detection.","hint":"Red: the transform is just another differentiable step. Blue: the attacker you face designed around volume; find the signal they could not shape."},{"id":"h08","type":"terminal","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Prove the staged model artifact matches the signed registry baseline.","scenario":{"intro":["Orbit Courier: the model v7 artifact is under investigation for a possible backdoor.","Legal needs proof of integrity for the evidence file. You are on a read-only forensic mount.","The signed baseline lives in registry.sha256. Nothing on the model mount may be modified.","Environment: Linux shell. Available: sha256sum, md5sum. The artifact file is model_v7.bin."]},"question":"Type and run the one command that verifies the artifact against the signed registry baseline.","terminal":{"title":"responder@forensics-mount: /mnt/ro-model — simulated shell (read-only)","prompt":"$","motd":["forensic mount: /mnt/ro-model (read-only, live host detached)","files: model_v7.bin  registry.sha256","Type a command and press Enter. Nothing real is executed."],"objective":"Verify model_v7.bin against the signed baseline in registry.sha256, in one command, changing nothing.","accept":[{"find":"registry.sha256","output":["model_v7.bin: OK"]}],"canonical":"sha256sum -c registry.sha256","canonicalParts":["sha256sum — the integrity tool for SHA-256 digests","-c — check mode: verify files against a checksum list instead of printing hashes","registry.sha256 — the signed baseline list that maps artifacts to expected digests"],"dangerNote":"Hash tools only read; but md5sum is not acceptable for evidence (collisions), and any write or delete against the mount destroys the chain of custody."},"checks":[{"label":"uses sha256sum (SHA-256, court-acceptable)","find":"sha256sum","ok":true},{"label":"verifies against the signed baseline registry.sha256","find":"registry.sha256","ok":true},{"label":"uses md5sum, which is not acceptable for evidence","find":"md5sum","ok":false,"why":"MD5 collisions make it indefensible in a legal chain of custody."},{"label":"modifies or destroys the artifact","find":"shred","ok":false,"why":"shred destroys the evidence you are supposed to preserve."},{"label":"deletes files on the evidence mount","find":"rm ","ok":false,"why":"Deleting anything on a forensic mount breaks the chain of custody."},{"label":"writes into the artifact file","find":"> model_v7","ok":false,"why":"Redirecting into the artifact alters the very file whose integrity you must prove."}],"explanation":"The objective has two parts: compute an acceptable digest and compare it against the signed baseline. sha256sum -c registry.sha256 does both in one read-only step and prints 'model_v7.bin: OK'. Running sha256sum model_v7.bin alone earns partial credit: it computes a hash but verifies nothing. md5sum is a near-miss that fails evidence standards, and any write against the mount would destroy the chain of custody.","study":"Study evidence handling: check mode, acceptable hash functions, and read-only discipline.","hint":"The word 'against the signed baseline' is the requirement a bare hash command does not satisfy."},{"id":"h09","type":"match","answerType":"multi","theme":"Defenses & robustness","summary":"Match each defense to its documented limitation before the design review.","scenario":{"intro":["The architecture board will hear four defense pitches tomorrow.","Your lead wants every pitch countered with its documented limitation.","Match each defense to the limitation an attacker can actually use."]},"question":"Drag each defense to its documented limitation.","items":[{"id":"i1","text":"Defensive distillation (softmax temperature)"},{"id":"i2","text":"Gradient masking (logit squeezing)"},{"id":"i3","text":"Input preprocessing (JPEG, bit-depth reduction)"},{"id":"i4","text":"Randomized smoothing"}],"targets":[{"id":"z1","label":"Broken by the C&W optimization attack tuned to the distilled model","why":"Carlini and Wagner defeated distillation by optimising directly against the defended network."},{"id":"z2","label":"Hides gradients rather than fixing them; adaptive and transfer attacks walk around it","why":"Obfuscated gradients fail the three known tests: adaptive attacks, transfer attacks, and non-differentiable approximations."},{"id":"z3","label":"Adaptive attacks optimise through an approximation of the transform and still succeed","why":"The transform is just another layer to a patient attacker with a differentiable approximation."},{"id":"z4","label":"Certifies labels only inside its radius and usually costs clean accuracy","why":"The guarantee is real but bounded; outside the radius nothing is promised."}],"solution":{"i1":"z1","i2":"z2","i3":"z3","i4":"z4"},"explanation":"Every defense here is real, and every one has a documented boundary. Distillation fell to C&W. Gradient masking hides weaknesses instead of removing them. Preprocessing survives only until an attacker optimises through it. Randomized smoothing keeps its promise, but the promise is a radius, and it charges clean accuracy for it. Pitches that hide these boundaries are the ones that fail in production.","study":"Study the documented failure modes of distillation, masking, preprocessing and smoothing.","hint":"One limitation is about a radius, one about a transform, one about hiding versus fixing, one about a specific named attack."},{"id":"h10","type":"order","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Rank the four findings by urgency: what gets fixed first?","scenario":{"intro":["The quarterly ML security review produced four open findings.","The steering committee funds fixes strictly in the order you rank them.","Rank them: position 1 is the finding that must be fixed first."]},"question":"Drag the four findings into the correct urgency order.","entries":[{"id":"f1","text":"Extraction in progress: thousands of near-duplicate queries with full-output requests"},{"id":"f2","text":"Unvalidated community checkpoint staged for next week's production release"},{"id":"f3","text":"Robustness evaluation limited to FGSM-only, hiding PGD results"},{"id":"f4","text":"Model card missing for an internal-only analytics model"}],"correctOrder":["f1","f2","f3","f4"],"explanation":"Active harm first: the extraction campaign is stealing model value right now. Next comes imminent harm: the unvalidated checkpoint can ship a backdoor within days. Then the evaluation gap, which hides risk but does not itself attack anyone. Documentation last: a missing model card for an internal model is a governance debt, not an active threat. Urgency follows exposure and reversibility.","study":"Practise risk ranking: active attack, imminent risk, latent gap, documentation debt.","hint":"Ask two questions per finding: is it happening now, and can it still be stopped cheaply tomorrow?"},{"id":"h11","type":"num","answerType":"single","theme":"Evasion attacks","summary":"Convert the assessment budget 8/255 into the 0-to-1 pixel scale.","scenario":{"intro":["The assessment plan fixes an L-infinity budget of 8/255 on images stored as 0-to-255 integers.","The robustness training pipeline, however, reads pixel values on a 0-to-1 scale.","The training config needs the same budget expressed in the pipeline's scale."]},"question":"Give the budget as a maximum per-pixel change on the 0-to-1 scale, two decimals.","value":0.03,"tolerance":0.005,"unit":"","note":"Answer as a decimal, for example 0.01. Two decimals expected.","whyNum":"8/255 = 0.0314, which rounds to 0.03 on the 0-to-1 scale.","explanation":"Divide, then round: 8 divided by 255 is 0.0314, so the same budget on the 0-to-1 scale is 0.03. Mixing scales is a classic silent failure: a config that says 8 on a 0-to-1 scale would allow a change eight times larger than the whole pixel range, destroying both training and evaluation meaning.","study":"Study why scale mismatches (0-255 vs 0-1) silently break adversarial training configs.","hint":"The budget is a fraction of the full pixel range; divide first, round after."},{"id":"h12","type":"sim","answerType":"multi","theme":"Evasion attacks","summary":"An alarming query pattern collides with an authorized red-team record.","scenario":{"intro":["Vertex Payments detection engineer, night shift: client sdk-red-7 sends about 200 queries per day, each a slight perturbation of the same 10 base images, with a stable epsilon of about 0.03, all from the corporate VPN range.","The pattern matches adversarial testing. It also matches a careful outsider.","The change calendar shows an approved AI red-team exercise for this fortnight: ticket RB-112, and the ten base image hashes in RB-112 match the observed base images exactly.","No incident ticket exists."]},"question":"Resolve the conflict and choose the action.","steps":[{"prompt":"Decision 1: Two readings of the same traffic exist. Which one wins, and why?","options":[{"id":"A","text":"Authorized testing wins: the approval ticket matches the exact base-image hashes","outcome":"You treat the traffic as authorized but keep it observed; the record is specific, current, and verifiable.","why":"The authorization is not vague: matching hashes, a current window, and a named owner make it the stronger evidence."},{"id":"B","text":"Extraction wins: any adversarial pattern is an attack until proven otherwise","outcome":"You block an approved exercise, the red team loses its window, and the post-mortem shows the ticket you ignored.","why":"A specific, verifiable authorization record outranks a generic suspicion; blocking first also destroys the observation."},{"id":"C","text":"A broken client SDK loop, since the epsilon is stable","outcome":"SDK bugs do not produce budget-stable perturbations of exactly ten base images plus a matching approval ticket.","why":"The stability and the matching record both contradict the accident theory."},{"id":"D","text":"Evasion by an outsider who copied the ticket","outcome":"Possible in theory, but the traffic comes from the corporate VPN range and matches the ticket's hashes exactly.","why":"A forgery theory needs evidence; the default must follow the verifiable record you already hold."}],"correct":["A"]},{"prompt":"Decision 2: What do you do with the alert?","options":[{"id":"A","text":"Confirm scope with the red-team lead, keep monitoring, and link the authorization to the alert","outcome":"The exercise continues observed, the alert closes with provenance attached, and any deviation re-opens it automatically.","why":"Verification plus documentation keeps the audit trail clean and preserves the monitoring baseline."},{"id":"B","text":"Open a P1 incident and block the VPN range","outcome":"You kill an approved exercise, damage the security-testing relationship, and still have no incident.","why":"Treating a verified authorization as a P1 teaches the organisation to hide testing from security."},{"id":"C","text":"Shred the approval ticket so future alerts stay suspicious","outcome":"You destroy the organisation's own evidence and guarantee false alarms every quarter.","why":"Authorization records exist precisely to make alerts decidable; removing them is self-harm."},{"id":"D","text":"Ignore everything until the fortnight ends","outcome":"If the exercise scope drifts, nobody notices; unobserved authorization is how cover stories work.","why":"Authorized does not mean unwatched; monitoring continues with the record linked."}],"correct":["A"]}],"explanation":"This is the 'looks alarming but is authorized' case. The resolution rule: specific, current, verifiable evidence beats pattern suspicion. The ticket matches the exact base-image hashes, the window is current, and the source is the corporate VPN range. The professional response is to verify, monitor, and document the linkage, so any deviation from the approved scope re-opens the alert on its own.","study":"Study how authorization records resolve conflicting detection signals.","hint":"Which reading does the strongest evidence support, and what does monitoring look like when the answer is 'authorized'?"},{"id":"h13","type":"fill","answerType":"multi","theme":"Evasion attacks","summary":"Draft the finding text: three terms make it precise.","scenario":{"intro":["You are writing finding VRT-041 for the penetration test report.","The customer's lawyers read every word. Three blanks must be exact.","Two of the six bank words are traps."]},"question":"Complete the finding text from the word bank.","parts":["Finding VRT-041: the deployed classifier accepts inputs without ",". Crafted "," examples change the predicted class while staying inside the tested "," budget of 8/255."],"blanks":[{"correct":"sanitization","why":"The model accepts raw input; the missing control is input sanitization/validation."},{"correct":"adversarial","why":"Inputs crafted to fool a model are adversarial examples; that is the precise term."},{"correct":"perturbation","why":"The 8/255 number is the perturbation budget; the report must name it."}],"tokens":["sanitization","adversarial","perturbation","encryption","redundancy","rotation"],"explanation":"The finding names three things: the missing control (input sanitization), the technique (adversarial examples), and the bound that makes the result honest (the perturbation budget of 8/255). Encryption, redundancy and rotation are real controls, but they do not address crafted inputs, and misnaming them in a finding invites the customer to dispute the whole report.","study":"Practise precise finding language: control, technique, budget.","hint":"Blank one is a missing input control; blank three is the number's proper name."},{"id":"h14","type":"multi","answerType":"multi","theme":"Poisoning & supply chain","summary":"Confirm the facts about the moderation model's backdoor before the board meets.","scenario":{"intro":["Orbit Courier's chat moderation model shows 99.0 percent clean accuracy.","Three weeks ago it was fine-tuned from a community checkpoint downloaded from a public model hub. The checkpoint was not verified against any signed source.","Trust & Safety found that a 3 by 3 orange square in the image corner flips the verdict to 'safe' on any banned-content meme.","The board meets in one hour. Select every statement the evidence supports."]},"question":"Select every supported statement. Partial credit applies.","options":[{"id":"A","text":"The trigger is small and local, which is why clean accuracy stayed at 99.0 percent"},{"id":"B","text":"Normal behaviour on ordinary inputs is exactly how a backdoored model hides"},{"id":"C","text":"The unverified community checkpoint is the plausible poisoning source"},{"id":"D","text":"A malware scan of the checkpoint file would have caught this poisoning"},{"id":"E","text":"Removing the trigger pattern from the test set removes the whole risk"},{"id":"F","text":"The backdoor will show up later as a sudden drop in clean accuracy"}],"correct":["A","B","C"],"why":{"A":"A small local trigger touches only inputs that carry it, so the 99.0 percent clean number never moves.","B":"BadNets-style backdoors are defined by correct behaviour everywhere except under the trigger; that is what makes them dangerous.","C":"An unverified public-hub checkpoint entering fine-tuning is the classic supply-chain entry point for a hidden trigger.","D":"Malware scanners look for executable content; a poisoned weight tensor triggers nothing they detect.","E":"Deleting test evidence changes nothing about the weights; the trigger still works in production.","F":"Clean accuracy is precisely the metric a backdoor leaves untouched; expecting a drop there is how backdoors stay hidden."},"explanation":"Three statements survive: the small trigger explains the untouched clean accuracy, normal behaviour everywhere else is the backdoor signature, and the unverified community checkpoint is the plausible entry point. The near-misses teach the two classic mistakes: assuming file-level malware scanning applies to weights (it does not), and assuming removing test evidence fixes the model (it only hides the finding). The fix is provenance plus retraining from a verified base.","study":"Study BadNets-style backdoors, trigger analysis, and model supply-chain verification.","hint":"One distractor borrows a practice from endpoint security that does not transfer to weights; another confuses hiding evidence with fixing it."},{"id":"h15","type":"multi","answerType":"multi","theme":"Defenses & robustness","summary":"Two detector clusters: one genuine evasion attempt, one known benign noise.","scenario":{"intro":["The input-statistics detector 'mag-net' watches the vision API. Its history: four in ten alerts are benign, usually corrupted uploads from one camera firmware.","Tonight it raised two clusters at once. The duty runbook says: classify before acting, and the artefact supports filtering.","Select every correct classification."],"artifacts":[{"label":"ARTEFACT 1 — mag-net detector log (filterable)","kind":"log","lines":["2026-10-02 21:03:11 ALERT cluster=481 client=mobile-app-7 pattern=tiny_perturbation mean_l2=0.011 confidence_drop=0.31 count=214","2026-10-02 21:03:12 ALERT cluster=482 client=field-uploader pattern=high_noise mean_l2=0.220 confidence_drop=0.02 count=17 jpeg_errors=15","2026-10-02 21:03:15 INFO  cluster=481 inputs=distinct:198 near_duplicate=0.93 outputs=label_flip=61","2026-10-02 21:03:16 INFO  cluster=482 inputs=distinct:3 near_duplicate=0.12 outputs=label_flip=0","2026-10-02 21:03:20 WARN  cluster=481 client=mobile-app-7 retry_after_429=on probe_spacing=uniform","2026-10-02 21:03:21 INFO  cluster=482 source=camera-fw-2.1 upload_corruption=known checksum_mismatch=15"]}]},"question":"Select every correct classification. Partial credit applies.","options":[{"id":"A","text":"Cluster 481 is a genuine evasion attempt"},{"id":"B","text":"Cluster 482 is a genuine evasion attempt"},{"id":"C","text":"Cluster 481 is benign corruption noise"},{"id":"D","text":"Cluster 482 is benign corruption noise"}],"correct":["A","D"],"why":{"A":"Tiny, consistent perturbations (mean L2 0.011), 61 label flips, uniform probe spacing after rate limits: that is an evasion probe pattern.","B":"Cluster 482 has high noise (L2 0.220), almost no distinct inputs, zero label flips, and 15 checksum mismatches tied to known camera firmware corruption.","C":"Cluster 481's structure (distinct crafted inputs, spacing, flips) is the opposite of accidental corruption.","D":"Known firmware corruption with checksum mismatches and no behavioural effect on labels matches the benign history."},"explanation":"The discriminator is structure plus effect. Cluster 481 shows tiny, evenly spaced perturbations that actually flip labels and resume after rate limits: crafted probing. Cluster 482 shows large uncontrolled noise, almost no distinct inputs, no label effect, and checksum mismatches matching a known camera firmware fault. The 'looks alarming but is benign' case is the firmware; the attack is the quiet, structured one.","study":"Study input-cluster detection: perturbation size, label effect, and provenance checks.","hint":"One cluster has controlled structure and real label effects; the other has a known hardware explanation. Filter both and compare."},{"id":"h16","type":"sim","answerType":"multi","theme":"Defenses & robustness","summary":"Peak traffic, active evasion attempts: choose the response and own its cost.","scenario":{"intro":["It is the biggest trading week of the year. The production vision model underpins order automation.","Active evasion attempts: 8 percent of flagged requests succeed, no extraction, no poisoning signs.","Operations wants zero downtime. Product wants automation kept. Security wants the attack stopped.","You own the recommendation, including its real cost."]},"question":"Answer both decision cards.","steps":[{"prompt":"Decision 1: Which response do you recommend?","options":[{"id":"A","text":"Geo-throttle the suspicious segments and route flagged traffic to a human review fallback","outcome":"Attack success collapses, automation continues at reduced share, and the change is reversible after the peak.","why":"The least aggressive option that stops progress: degrade gracefully instead of going dark."},{"id":"B","text":"Take the model fully offline for 48 hours and process everything manually","outcome":"Security wins, the business loses its peak, and the director asks why a partial control was never considered.","why":"Full shutdown is disproportionate while a graded control exists."},{"id":"C","text":"Ignore the attempts; 8 percent is within normal noise","outcome":"The attacker's success rate climbs as they optimise; the peak hides the damage until it is expensive.","why":"A confirmed improving campaign is not noise; waiting is a decision with its own cost."},{"id":"D","text":"Publish the attacker's request signatures to the public status page","outcome":"You tip off the attacker mid-campaign and create a legal exposure with no defensive gain.","why":"Public disclosure during an active incident helps the attacker adapt."}],"correct":["A"]},{"prompt":"Decision 2: The recommendation has a real cost. Which cost do you state to the business?","options":[{"id":"A","text":"Lower automation share and added latency while the throttles and fallback are active","outcome":"The business accepts a measurable service cost in exchange for stopping the attack; the decision is documented.","why":"Honest cost acceptance is part of the recommendation; the fallback exists precisely because automation is reduced."},{"id":"B","text":"No cost: the control is free","outcome":"Finance discovers the latency bill later and trust in your recommendations drops.","why":"Every throttle and every human review has a cost; pretending otherwise damages credibility."},{"id":"C","text":"Permanent retirement of the model","outcome":"Nobody agreed to that; the cost you state must match the action you recommended.","why":"The recommended control is temporary; permanent retirement is a different, larger decision."},{"id":"D","text":"Customer data shared with the attacker as a goodwill signal","outcome":"That is not a cost, it is a breach; it was never on the table.","why":"The option is a trap to check whether you can tell a cost from a violation."}],"correct":["A"]}],"explanation":"The correct response is the least aggressive one that still stops the attack: throttle the suspicious segments and let a human review fallback absorb flagged traffic. Its cost is real and must be stated: lower automation share and added latency during the peak. The exercise is about owning trade-offs: the big hammer (full shutdown) is disproportionate, ignoring is surrender, and a recommendation without its cost stated is not a recommendation.","study":"Study graded responses under business pressure and honest cost accounting.","hint":"First card: which option degrades gracefully instead of going dark? Second card: what does that option actually cost?"},{"id":"h17","type":"match","answerType":"multi","theme":"Evaluation, tools & governance","summary":"Match the three report metrics to their exact meanings.","scenario":{"intro":["The board report quotes three metrics. Last quarter, a director read 'certified accuracy' as 'accuracy we certify is perfect'.","Your lead asks you to pin each metric to its exact meaning before the report goes out."]},"question":"Drag each metric to its exact meaning.","items":[{"id":"i1","text":"Attack success rate"},{"id":"i2","text":"Certified accuracy"},{"id":"i3","text":"Transfer rate"}],"targets":[{"id":"z1","label":"Share of crafted inputs that actually fool the model","why":"ASR is measured over the crafted inputs submitted; it says nothing about all traffic."},{"id":"z2","label":"Accuracy guaranteed for every perturbation inside the certified radius","why":"Certified accuracy is a guarantee bounded by the radius (and the confidence level), not a general claim."},{"id":"z3","label":"How often inputs crafted on one model fool a different model","why":"Transfer rate measures cross-model generalisation of adversarial examples; high values enable black-box attacks."}],"solution":{"i1":"z1","i2":"z2","i3":"z3"},"explanation":"Three metrics, three precise meanings. The attack success rate is the share of crafted inputs that fooled the model. Certified accuracy is accuracy guaranteed for all perturbations inside the stated radius, at a stated confidence. The transfer rate says how often examples crafted on one model fool another. Precision matters: each metric answers a different board question, and mixing them is how wrong decisions get funded.","study":"Study robustness metrics and how to present them without ambiguity.","hint":"One metric is about crafted inputs, one is a bounded guarantee, one is about moving between models."}]};

'use strict';
var DATA = window.EXAM_DATA || {};
var META = DATA.meta || {};
var EXS = DATA.exercises || [];
var SEVINFO = {
  'easy':{label:'EASY',cls:'sev-easy'},
  'medium':{label:'MEDIUM',cls:'sev-medium'},
  'hard':{label:'HARD',cls:'sev-hard'},
  'extremely-hard':{label:'EXTREMELY HARD',cls:'sev-extreme'}
};
var SEV = SEVINFO[META.difficulty] || SEVINFO.easy;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function byId(i){return document.getElementById(i);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtPts(p){var v=Math.round(p*10)/10;return (v%1===0)?String(v):v.toFixed(1);}
function fmtTime(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function normCmd(s){return String(s||'').toLowerCase().replace(/=/g,' ').replace(/-{3,}/g,'--').replace(/\s+/g,' ').trim();}
function findId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}

var S = {
  view:'intro', order:[], cur:0,
  answers:{}, graded:{}, skipped:{}, checked:{}, hintUsed:{},
  running:false, manualPause:false, autoPause:false,
  remaining:(META.timerSeconds||1800), reported:false, fromReview:false,
  pres:{}, exDeadline:null, warned:false, candidate:''
};
/* selection state for click-to-place widgets (match items / fill tokens) */
var SEL = { item:null, token:null };
function resetSel(){ SEL.item=null; SEL.token=null; }

/* ---------------- presentation shuffles (rebuilt per attempt) ---------------- */
function buildPres(i){
  var ex=EXS[i], p={};
  if(ex.type==='qcm'||ex.type==='multi'){ p.optOrder=shuffle(ex.options.map(function(o){return o.id;})); }
  if(ex.type==='match'){ p.itemOrder=shuffle(ex.items.map(function(it){return it.id;})); p.zoneOrder=ex.targets.map(function(z){return z.id;}); }
  if(ex.type==='order'){
    var eo=shuffle(ex.entries.map(function(e){return e.id;}));
    var same=ex.correctOrder.every(function(v,k){return eo[k]===v;});
    if(same && eo.length>1){ eo.push(eo.shift()); }
    p.entryOrder=eo;
  }
  if(ex.type==='fill'){ p.tokenOrder=shuffle(ex.tokens.slice()); }
  S.pres[i]=p;
}

/* ---------------- timer ---------------- */
function timerModeLabel(){
  if(S.manualPause) return '\u23f8 paused by you';
  if(S.autoPause) return '\u23f8 paused \u2014 review your feedback';
  return '\u25b6 running';
}
setInterval(function(){
  if(S.view!=='exam' && S.view!=='review') return;
  if(S.running && !S.manualPause && !S.autoPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; updateHead(); finishExam(true); return; }
    updateHead();
    if(S.exDeadline && !S.exOver){
      var left=Math.ceil((S.exDeadline-Date.now())/1000);
      var chip=byId('ex-timer-chip');
      if(chip){
        if(left>0){ chip.textContent='\u23f1 recommended time left: '+fmtTime(left); chip.classList.remove('late'); }
        else { chip.textContent='\u23f1 recommended time passed \u2014 the exam timer continues'; chip.classList.add('late'); }
      }
    }
  }
},1000);

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pres={};
  S.order.forEach(function(i){ buildPres(i); });
  S.cur=0; S.view='exam'; S.running=true; S.manualPause=false; S.autoPause=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.answers={}; S.graded={}; S.skipped={}; S.checked={}; S.hintUsed={};
  S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function curExIdx(){ return S.order[S.cur]; }
function curEx(){ return EXS[curExIdx()]; }

function ensureAnswer(exIdx){
  var ex=EXS[exIdx], a=S.answers[ex.id];
  if(a===undefined){
    if(ex.type==='multi') a=[];
    else if(ex.type==='match') a={};
    else if(ex.type==='order') a=S.pres[exIdx].entryOrder.slice();
    else if(ex.type==='fill') a={};
    else if(ex.type==='spot') a=[];
    else if(ex.type==='sim') a={};
    else if(ex.type==='num'||ex.type==='terminal') a='';
    else a=null;
    S.answers[ex.id]=a;
  }
  return a;
}
function answerReady(ex){
  var a=S.answers[ex.id];
  if(a===undefined||a===null) return false;
  switch(ex.type){
    case 'qcm': return a!==null;
    case 'multi': return a.length>0;
    case 'match': return Object.keys(a).length>0;
    case 'order': return true;
    case 'fill': return Object.keys(a).length>0;
    case 'spot': return a.length>0;
    case 'sim': return Object.keys(a).length===ex.steps.length;
    case 'num': return String(a).trim()!=='';
    case 'terminal': return String(a).trim()!=='';
  }
  return false;
}

function checkAnswer(){
  var exIdx=curExIdx(), ex=EXS[exIdx];
  if(S.checked[ex.id]) return;
  if(!answerReady(ex)){ S.warned=true; render(); return; }
  S.warned=false;
  S.graded[ex.id]=gradeEx(ex,exIdx);
  S.checked[ex.id]=true;
  S.autoPause=true;              /* auto-pause on Check: feedback stays readable */
  S.manualPause=false;           /* manual pause released if it was somehow set */
  render();
}
function useHint(){
  var ex=curEx();
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  render();
}
function skipCurrent(){
  var ex=curEx();
  if(!S.checked[ex.id]){ S.skipped[ex.id]=true; }
  goNext();
}
function goNext(){
  S.warned=false; S.autoPause=false; S.fromReview=false;
  S.exDeadline=null; S.exOver=false;
  if(S.cur>=S.order.length-1){ endFlow(); } else { S.cur++; render(); }
}
function endFlow(){
  var unanswered=S.order.filter(function(i){ var ex=EXS[i]; return !S.graded[ex.id]; });
  if(unanswered.length>0){ S.view='review'; render(); }
  else { finishExam(false); }
}
function finishExam(timedOut){
  S.running=false; S.autoPause=false; S.manualPause=false; S.timedOut=!!timedOut;
  S.view='results'; S.exDeadline=null; S.exOver=true;
  render();
  reportScore();
}
function retakeExam(){
  S.view='intro'; S.order=[]; S.cur=0; S.answers={}; S.graded={}; S.skipped={}; S.checked={};
  S.hintUsed={}; S.manualPause=false; S.autoPause=false; S.running=false;
  S.remaining=(META.timerSeconds||1800); S.reported=false; S.fromReview=false;
  S.pres={}; S.exDeadline=null; S.exOver=false; resetSel();
  render();
}
function returnToSkipped(exIdx){
  S.cur=exIdx; S.fromReview=true; S.view='exam';
  S.autoPause=false; S.manualPause=false;
  render();
}

/* ---------------- grading ---------------- */
function gradeEx(ex,exIdx){
  var a=S.answers[ex.id];
  var T=1,C=0,W=0;
  var right=[],wrong=[],missed=[];
  function addItem(list,label,why){ list.push({label:label,why:why||''}); }

  if(ex.type==='qcm'){
    T=1;
    var ok=ex.correct.indexOf(a)>=0;
    if(ok){ C=1; addItem(right,optText(ex,a),optWhy(ex,a)); }
    else { W=1; addItem(wrong,optText(ex,a),optWhy(ex,a)); addItem(missed,correctText(ex),''); }
  }
  else if(ex.type==='multi'){
    T=ex.correct.length;
    ex.correct.forEach(function(cid){
      if(a.indexOf(cid)>=0){ C++; addItem(right,optText(ex,cid),optWhy(ex,cid)); }
      else { addItem(missed,optText(ex,cid),optWhy(ex,cid)); }
    });
    a.forEach(function(oid){
      if(ex.correct.indexOf(oid)<0){ W++; addItem(wrong,optText(ex,oid),optWhy(ex,oid)); }
    });
  }
  else if(ex.type==='match'){
    T=ex.items.length;
    ex.items.forEach(function(it){
      var zid=a[it.id], sol=ex.solution[it.id];
      var zObj=zid?findId(ex.targets,zid):null, sObj=findId(ex.targets,sol);
      if(zid===sol){ C++; addItem(right,it.text+' \u2192 '+sObj.label,(zObj&&zObj.why)||''); }
      else {
        var line=it.text+' \u2192 '+(zObj?zObj.label:'(no answer)')+' \u2014 correct: '+sObj.label;
        if(zid){ W++; addItem(wrong,line,(zObj&&zObj.why)||('Not the right match for this scenario.')); }
        else { addItem(missed,line,sObj.why||''); }
      }
    });
  }
  else if(ex.type==='order'){
    T=ex.entries.length;
    ex.entries.forEach(function(en,k){
      var placed=a[k], sol=ex.correctOrder[k];
      var pEn=findId(ex.entries,placed), sEn=findId(ex.entries,sol);
      if(placed===sol){ C++; addItem(right,(k+1)+'. '+sEn.text,''); }
      else {
        var line='Position '+(k+1)+': you placed "'+pEn.text+'", correct is "'+sEn.text+'"';
        W++; addItem(wrong,line,'');
      }
    });
  }
  else if(ex.type==='fill'){
    T=ex.blanks.length;
    ex.blanks.forEach(function(b,k){
      var got=a[k];
      if(got && (got===b.correct || (b.alt&&b.alt.indexOf(got)>=0))){
        C++; addItem(right,'Blank '+(k+1)+': "'+got+'" is correct.',b.why||'');
      } else {
        var line='Blank '+(k+1)+': you wrote "'+(got||'(empty)')+'", correct is "'+b.correct+'"';
        if(got){ W++; addItem(wrong,line,b.whyWrong||''); }
        else { addItem(missed,line,b.why||''); }
      }
    });
  }
  else if(ex.type==='spot'){
    T=ex.correctIds.length;
    ex.correctIds.forEach(function(lid){
      if(a.indexOf(lid)>=0){ C++; addItem(right,lineText(ex,lid),lineWhy(ex,lid)); }
      else { addItem(missed,lineText(ex,lid),lineWhy(ex,lid)); }
    });
    a.forEach(function(lid){
      if(ex.correctIds.indexOf(lid)<0){ W++; addItem(wrong,lineText(ex,lid),lineWhy(ex,lid)); }
    });
  }
  else if(ex.type==='sim'){
    T=ex.steps.length;
    ex.steps.forEach(function(st,k){
      var got=a[k];
      var okOpt=st.correct.indexOf(got)>=0;
      var gOpt=got?findId(st.options,got):null;
      var cOpt=findId(st.options,st.correct[0]);
      if(okOpt){ C++; addItem(right,'Step '+(k+1)+': '+cOpt.text,(gOpt&&gOpt.why)||''); }
      else {
        var line='Step '+(k+1)+': you chose "'+(gOpt?gOpt.text:'(no answer)')+'", better: "'+cOpt.text+'"';
        if(got){ W++; addItem(wrong,line,(gOpt&&gOpt.why)||''); }
        else { addItem(missed,line,cOpt.why||''); }
      }
    });
  }
  else if(ex.type==='num'){
    T=1;
    var v=parseFloat(String(a).replace(',','.'));
    var okNum=!isNaN(v)&&Math.abs(v-ex.value)<=ex.tolerance;
    if(okNum){ C=1; addItem(right,'Your value: '+v+(ex.unit?' '+ex.unit:''),ex.whyNum||''); }
    else { W=1; addItem(wrong,'Your value: '+String(a),'The correct value is '+ex.value+(ex.unit?' '+ex.unit:'')+'.'); }
  }
  else if(ex.type==='terminal'){
    var cmd=normCmd(a);
    T=0;
    function hit(ch){
      if(ch.re){ try{ return new RegExp(ch.re).test(cmd); }catch(e){ return false; } }
      return cmd.indexOf(ch.find)>=0;
    }
    (ex.checks||[]).forEach(function(ch){
      if(ch.ok){ T++; if(hit(ch)){ C++; addItem(right,ch.label,''); } else { addItem(missed,ch.label,ch.why||''); } }
      else { if(hit(ch)){ W++; addItem(wrong,ch.label,ch.why||''); } }
    });
    if(T===0){ T=1; }
  }

  var pts=Math.max(0,Math.floor((C-W)/T*100));
  if(pts>100) pts=100;
  if(S.hintUsed[ex.id]) pts=pts*0.9;
  return {pts:pts,T:T,C:C,W:W,right:right,wrong:wrong,missed:missed,raw:{C:C,W:W,T:T}};
}
function optText(ex,oid){ var o=findId(ex.options,oid); return o?o.text:String(oid); }
function optWhy(ex,oid){ var o=findId(ex.options,oid); return (o&&o.why)?o.why:''; }
function correctText(ex){ return optText(ex,ex.correct[0]); }
function lineText(ex,lid){ if(ex.artifact&&ex.artifact.lines){ var k=parseInt(lid.replace(/^\D+/,''),10); return 'Line '+k+': '+(ex.artifact.lines[k-1]||''); } return lid; }
function lineWhy(ex,lid){ return (ex.lineWhy&&ex.lineWhy[lid])||''; }

/* ---------------- live score ---------------- */
function scoreNow(){
  var earned=0,possible=0,n=0;
  S.order.forEach(function(i){ var ex=EXS[i],g=S.graded[ex.id]; if(g){ n++; earned+=g.pts; possible+=100; } });
  return {earned:earned,possible:possible,n:n};
}
function progressNow(){
  var done=0;
  S.order.forEach(function(i){ var ex=EXS[i]; if(S.graded[ex.id]||S.skipped[ex.id]) done++; });
  return S.order.length?Math.round(done/S.order.length*100):0;
}

/* ---------------- header ---------------- */
function updateHead(){
  var t=byId('xh-timer'), sc=byId('xh-score'), pr=byId('xh-bar'), sk=byId('xh-skipped');
  if(t){ t.innerHTML=esc(timerModeLabel())+' \u00b7 <span class="tval">'+esc(fmtTime(S.remaining))+'</span>'; }
  if(sc){ var s=scoreNow(); sc.textContent=fmtPts(s.earned)+' / '+s.possible+' pts'; }
  if(pr){ pr.style.width=progressNow()+'%'; }
  if(sk){
    var k=S.order.filter(function(i){ return S.skipped[EXS[i].id]&&!S.graded[EXS[i].id]; }).length;
    sk.textContent='Review skipped ('+k+')';
    sk.className='btn ghost'+(k>0?' attention':'');
  }
}

/* ---------------- site integration ---------------- */
function reportScore(){
  if(S.reported) return;
  var s=scoreNow();
  if(s.possible<=0) return;
  var score=Math.round(s.earned*10), total=s.possible*10;
  var percent=Math.round(score/total*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score:score, total:total, percent:percent, passed:percent>=META.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
  S.reported=true;
}
window.addEventListener('message',function(ev){
  var d=ev&&ev.data; if(!d) return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT') return;
  try{
    if(d.username){ S.candidate=String(d.username); var el=byId('cand-name'); if(el){ el.textContent='Candidate: '+S.candidate; } }
  }catch(e){}
});

/* ---------------- rendering ---------------- */
function render(){
  var app=byId('app');
  if(S.view==='intro'){ app.innerHTML=DATA.intro; updateHead(); var cn=byId('cand-name'); if(cn&&S.candidate){ cn.textContent='Candidate: '+S.candidate; } return; }
  if(S.view==='exam'){ renderExam(); return; }
  if(S.view==='review'){ renderReview(); return; }
  renderResults();
}

    +'<div class="xh-left"><span class="xh-count" id="xh-count"></span> <span class="sev-badge '+SEV.cls+'">'+esc(SEV.label)+'</span></div>'

function setHeadEnabled(enabled){

    var b=byId(id); if(b){ b.disabled=!enabled; }

function renderExam(){
  var exIdx=curExIdx(), ex=EXS[exIdx], g=S.graded[ex.id];
  var html=headHTML();
  html+='<div class="stage" id="stage">';
  if(S.manualPause){
    html+='<div class="pause-overlay"><h2>\u23f8 Paused by you</h2>'
      +'<p>The exercise is hidden while you pause. The timer is stopped. Press Resume when you are ready \u2014 the exercise comes back exactly as it was.</p>'
      +'<button class="btn primary" data-act="resume">Resume</button></div>';
  }
  html+='<div class="card"'+(S.manualPause?' style="visibility:hidden"':'')+'>';

  if(ex.timeLimit && !g){
    var left=Math.max(0,Math.ceil(((S.exDeadline||0)-Date.now())/1000));
    html+='<div class="ex-chip" id="ex-timer-chip">\u23f1 recommended time left: '+fmtTime(left||(ex.timeLimit))+'</div>';
  }
  html+='<div class="block q"><div class="block-head">\u25c6 Question</div><div class="block-body"><p class="q-text"><strong>'+esc(ex.question)+'</strong></p></div></div>';
  html+='<div class="block ans"><div class="block-head">\u25c6 Your answer</div><div class="widget" id="widget">'+widgetHTML(ex,exIdx)+'</div>';
  if(ex.type==='multi'||(ex.type==='sim')){ }
  html+='</div>';
  if(g){ html+=feedbackHTML(ex,g); }
  html+='<div class="navrow">';
  if(!g){
    html+='<button class="btn primary" data-act="check">Check</button>';
    if(S.warned){ html+='<span class="checkmsg">Choose an answer first \u2014 or press Skip if you want to come back later.</span>'; }
  } else {
    var last=(S.cur>=S.order.length-1);
    html+='<button class="btn primary" data-act="next">'+(last?'Finish exam':'Next exercise')+'</button>';
  }
  html+='<span class="spacer"></span></div>';
  html+='</div></div>';
  byId('app').innerHTML=html;
  updateHead();
  var cnt=byId('xh-count'); if(cnt){ cnt.textContent='Exercise '+(S.cur+1)+' of '+S.order.length; }
  var hb=byId('xh-hint');

  var sb=byId('xh-skip');

function scenarioHTML(ex){

  (sc.artifacts||[]).forEach(function(a,ai){

  });
  h+='</div></div></div>';
  return h;

function hi(s){
  var out='', re=/(\/\/[^\s]+|\b(?:INFO|WARN|ERROR|DEBUG|FAILED|ERRORS|DENIED|ALLOWED|BLOCKED|ALERT|CRITICAL)\b|\b\d{2}:\d{2}:\d{2}\b|\d{1,3}(?:\[\.\]){3}\d{1,3}|hxxps?:\/\/\S+|\b\d+(?:\.\d+)?%?\b)/g;
  var last=0,m;
  while((m=re.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    var t=m[0], cls='t-num';
    if(/^\/\//.test(t)) cls='t-ip';
    else if(t==='INFO'||t==='DEBUG'||t==='ALLOWED') cls='t-info';
    else if(t==='WARN') cls='t-warn';
    else if(t==='ERROR'||t==='FAILED'||t==='DENIED'||t==='BLOCKED'||t==='ALERT'||t==='CRITICAL'||t==='ERRORS') cls='t-bad';
    else if(/^\d{2}:\d{2}:\d{2}$/.test(t)) cls='t-time';
    else if(/^\/\//.test(t)||t.indexOf('[') >=0 ||t.indexOf('hxxp')===0) cls='t-ip';
    out+='<span class="'+cls+'">'+esc(t)+'</span>';
    last=m.index+t.length;
  }
  out+=esc(s.slice(last));
  return out;
}

function artifactHTML(a,ex){
