<style>
/* ============================================================
   Alert Fatigue — shared exam engine styles (all 4 severity files)
   Dark cybersecurity theme · WCAG 2.1 AA targets
   ============================================================ */
:root{
  --bg:#0b1420; --bg2:#0d1826; --panel:#121f31; --panel2:#0f1a29; --line:#25384f;
  --text:#dce7f5; --muted:#9db1c7; --dim:#7c92aa;
  --blue:#4da3ff; --blue-t:rgba(77,163,255,.10);
  --amber:#ffb84d; --amber-t:rgba(255,184,77,.10);
  --green:#3ecf8e; --green-t:rgba(62,207,142,.10);
  --orange:#ff8a3d; --orange-t:rgba(255,138,61,.10);
  --red:#ff5c6c; --red-t:rgba(255,92,108,.10);
  --grey:#8fa3b8; --grey-t:rgba(143,163,184,.10);
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px;margin:0 auto;padding:0 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--blue); outline-offset:2px; border-radius:6px;
}
.hidden{display:none !important}
.mono{font-family:var(--mono)}

/* ---------- persistent exam header ---------- */
.xhead{
  position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:rgba(11,20,32,.96);border-bottom:1px solid var(--line);
  padding:10px 4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;
}
.xh-chip{
  display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:4px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  font-size:15px;font-weight:600;white-space:nowrap;
}
.xh-counter{color:var(--text)}
.sev-badge{border-radius:999px;font-weight:800;letter-spacing:.06em;font-size:13px;padding:6px 14px;min-height:30px;display:inline-flex;align-items:center}
.sev-easy{background:var(--green-t);color:var(--green);border:1.5px solid var(--green)}
.sev-medium{background:var(--amber-t);color:var(--amber);border:1.5px solid var(--amber)}
.sev-hard{background:var(--orange-t);color:var(--orange);border:1.5px solid var(--orange)}
.sev-extremely-hard{background:var(--red-t);color:var(--red);border:1.5px solid var(--red)}
.xh-spacer{flex:1 1 auto}
.xh-timer{font-family:var(--mono);font-weight:700;font-size:15.5px}
.xh-timer .mode{font-family:inherit}
.mode-running{color:var(--green)}
.mode-manual{color:var(--amber)}
.mode-auto{color:var(--blue)}
.mode-over{color:var(--red)}
.xh-btn{
  min-height:44px;min-width:44px;padding:8px 14px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;
  transition:background .15s,border-color .15s;
}
.xh-btn:hover:not(:disabled){background:#18283e;border-color:#35506e}
.xh-btn:disabled{opacity:.45;cursor:not-allowed}
.xh-btn.hint{border-color:#3a5a3f}
.xh-btn.hint:disabled{opacity:.5}
.xh-btn.pause{border-color:#5a4a2a}
.xh-btn.skip{border-color:#4a3a55}

/* ---------- intro screen ---------- */
.hero{padding:34px 4px 10px;text-align:left}
.hero-kicker{color:var(--blue);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.hero h1{font-size:34px;margin:6px 0 10px;line-height:1.15}
.hero p.lead{color:var(--muted);font-size:17px;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.card h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card h3{font-size:16px;margin:14px 0 6px}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.kw-theme{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kw-theme h4{margin:0 0 8px;font-size:14.5px;color:var(--blue)}
.kw-items{display:flex;flex-wrap:wrap;gap:7px}
.kw-item{background:#16283d;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--muted)}
.kw-item.covered{color:var(--text);border-color:#3b5b7d;background:#1a3049}
.kw-item.covered::before{content:'✓ ';color:var(--green);font-weight:800}
.intro-list{margin:8px 0 0;padding-left:22px}
.intro-list li{margin:6px 0;color:var(--text)}
.intro-list li b{color:var(--text)}
.soft{color:var(--muted)}
.startrow{display:flex;gap:14px;align-items:center;margin:20px 0 8px;flex-wrap:wrap}
.btn-primary{
  min-height:48px;padding:12px 26px;border-radius:10px;border:none;font-weight:800;font-size:17px;
  background:linear-gradient(135deg,#2f7fd4,#3ecf8e);color:#07121e;
}
.btn-primary:hover{filter:brightness(1.08)}
.note{font-size:14px;color:var(--muted)}

/* ---------- three-block layout contract ---------- */
.block{border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;background:var(--panel)}
.bl-head{
  display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;
  letter-spacing:.10em;font-size:14px;text-transform:uppercase;border-bottom:1px solid var(--line);
}
.bl-head .bl-ic{font-size:16px}
.block-scenario{border-left:4px solid var(--blue)}
.block-scenario .bl-head{background:var(--blue-t);color:var(--blue)}
.block-question{border-left:4px solid var(--amber)}
.block-question .bl-head{background:var(--amber-t);color:var(--amber)}
.block-answer{border-left:4px solid var(--green)}
.block-answer .bl-head{background:var(--green-t);color:var(--green)}
.bl-body{padding:14px 16px}
.q-text{font-weight:700;font-size:17px;margin:2px 0}

/* scenario collapsible */
.sc-toggle{
  margin-left:auto;min-height:44px;padding:4px 14px;border-radius:7px;background:transparent;
  border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;
}
.sc-toggle:hover{color:var(--text)}
.sc-summary{
  padding:10px 16px;color:var(--muted);font-size:14.5px;border-bottom:1px dashed var(--line);
  display:flex;gap:8px;align-items:center;
}
.sc-summary .dot{color:var(--blue)}

/* artefacts */
.artefact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.art-label{
  padding:8px 14px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);background:#101c2d;border-bottom:1px solid var(--line);
}
.art-body{padding:12px 14px}
.art-body p{margin:7px 0}
.art-fields{margin:0;padding:0;list-style:none}
.art-fields li{padding:3px 0;font-size:15px}
.art-fields b{color:var(--muted);font-weight:600}
table.art-table{border-collapse:collapse;width:100%;font-size:14.5px}
table.art-table th,table.art-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.art-table th{background:#101c2d;color:var(--muted);font-weight:700}

/* log viewer with filter + syntax highlight */
.logwrap{position:relative}
.logfilter{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.logfilter input{
  flex:1;min-height:44px;background:#0a1420;border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:8px 12px;font-family:var(--mono);font-size:14.5px;
}
.logfilter .lfc{color:var(--dim);font-size:13px;white-space:nowrap}
.logview{
  font-family:var(--mono);font-size:14.2px;line-height:1.6;background:#0a1420;
  border:1px solid var(--line);border-radius:8px;padding:10px 0;max-height:340px;overflow:auto;
}
.logline{display:flex;gap:12px;padding:2px 14px;white-space:pre-wrap;word-break:break-word}
.logline .ln{color:#4f6580;user-select:none;min-width:34px;text-align:right;flex:none}
.logline.hl{background:rgba(77,163,255,.14)}
.logline.hit mark{background:rgba(255,184,77,.28);color:inherit;border-radius:3px;padding:0 1px}
.lv-lvl{font-weight:700}
.lv-info{color:#6fb3ff}.lv-warn{color:var(--amber)}.lv-err{color:var(--red)}.lv-ok{color:var(--green)}
.codeblock{
  font-family:var(--mono);font-size:14.2px;background:#0a1420;border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:8px 0;
}
.copyrow{display:flex;justify-content:flex-end;margin:4px 0 0}
.copybtn{min-height:44px;padding:5px 14px;border-radius:7px;background:#16283d;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted)}
.copybtn:hover{color:var(--text)}

/* ---------- answer widgets ---------- */
.optlist{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;
  padding:11px 14px;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line);
  font-size:15.5px;line-height:1.5;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:#3b5b7d}
.opt[aria-pressed="true"],.opt.sel{border-color:var(--green);background:var(--green-t)}
.opt .opt-lab{font-weight:800;color:var(--blue);flex:none;font-family:var(--mono)}
.opt:disabled{cursor:default;opacity:.92}
.opt.correct-reveal{border-color:var(--green);background:var(--green-t)}
.opt.wrong-reveal{border-color:var(--red);background:var(--red-t)}
.ansnote{font-size:13.5px;color:var(--dim);margin:8px 2px 0}

/* match / drop zones */
.bank{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 14px}
.chip{
  min-height:44px;padding:8px 14px;border-radius:9px;background:#16283d;border:1.5px solid #33506e;
  font-size:14.5px;font-weight:600;
}
.chip.picked{border-color:var(--green);background:var(--green-t)}
.chip.ghost{opacity:.35}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.zone{
  background:var(--panel2);border:1.5px dashed #3b5b7d;border-radius:10px;min-height:96px;padding:10px;
  transition:border-color .12s,background .12s;cursor:pointer;
}
.zone:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.zone.over{border-color:var(--green);background:var(--green-t)}
.zone h5{margin:0 0 8px;font-size:14px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
.zone .zslot{display:flex;flex-direction:column;gap:7px;min-height:44px}
.zone .chip{width:100%;text-align:left}
.zone .chip .why-in{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}

/* ordering */
.ordlist{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.ordrow{
  display:flex;gap:10px;align-items:center;background:var(--panel2);border:1.5px solid var(--line);
  border-radius:9px;padding:8px 12px;min-height:52px;
}
.ordrow .pos-n{font-family:var(--mono);font-weight:800;color:var(--blue);min-width:26px;text-align:center}
.ordrow .ord-t{flex:1;font-size:15px}
.ordrow.over{border-color:var(--green)}
.ordbtns{display:flex;gap:6px}
.ordbtns button{
  min-width:44px;min-height:44px;border-radius:8px;background:#16283d;border:1px solid var(--line);
  font-size:16px;font-weight:800;
}
.ordbtns button:hover:not(:disabled){border-color:#3b5b7d}

/* fill-in-the-blank */
.bank-title{font-size:13.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin:4px 0 8px}
.blankline{font-size:16px;line-height:2.15}
select.blanksel{
  min-height:40px;background:#0a1420;color:var(--text);border:1.5px solid #33506e;border-radius:8px;
  font-family:var(--mono);font-size:14px;padding:4px 8px;margin:0 4px;max-width:230px;
}
select.blanksel.ok{border-color:var(--green)}
select.blanksel.bad{border-color:var(--red)}

/* clickable log lines (spot-the-line) */
.clicklog .logline{cursor:pointer;min-height:38px;align-items:center}
.clicklog .logline:hover{background:#13233a}
.clicklog .logline[aria-pressed="true"]{background:var(--green-t);box-shadow:inset 3px 0 0 var(--green)}
.clicklog .logline[aria-pressed="true"] .ln{color:var(--green)}

/* alert queue (triage) */
.aq{display:flex;flex-direction:column;gap:12px;margin:6px 0}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.acard .ar1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acard .a-sev{font-family:var(--mono);font-weight:800;font-size:13px;border-radius:6px;padding:3px 9px}
.a-sev.p1{color:var(--red);border:1.5px solid var(--red);background:var(--red-t)}
.a-sev.p2{color:var(--orange);border:1.5px solid var(--orange);background:var(--orange-t)}
.a-sev.p3{color:var(--amber);border:1.5px solid var(--amber);background:var(--amber-t)}
.a-sev.p4{color:var(--grey);border:1.5px solid var(--grey);background:var(--grey-t)}
.acard .a-title{font-weight:700;font-size:15.5px}
.acard .a-meta{color:var(--dim);font-size:13px;font-family:var(--mono)}
.acard .a-desc{margin:7px 0 10px;font-size:14.5px;color:var(--muted)}
.a-actions{display:flex;flex-wrap:wrap;gap:8px}
.a-actions button{
  min-height:44px;padding:8px 14px;border-radius:8px;background:#16283d;border:1.5px solid var(--line);
  font-size:14px;font-weight:700;
}
.a-actions button[aria-pressed="true"]{border-color:var(--green);background:var(--green-t)}

/* terminal */
.term{background:#070d15;border:1px solid #1d3145;border-radius:10px;overflow:hidden;margin:8px 0}
.term-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0d1826;border-bottom:1px solid #1d3145;font-size:13px;color:var(--dim)}
.term-bar .tdot{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-limit{margin-left:auto;font-family:var(--mono);color:var(--amber);font-weight:700}
.term-out{
  font-family:var(--mono);font-size:14px;line-height:1.6;padding:12px 14px;max-height:250px;overflow:auto;
  white-space:pre-wrap;word-break:break-word;color:#b9cde4;
}
.term-out .t-cmd{color:var(--green)}
.term-out .t-err{color:var(--red)}
.term-out .t-warn{color:var(--amber)}
.term-in{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid #1d3145}
.term-in .t-ps{font-family:var(--mono);color:var(--green);font-size:14px;white-space:nowrap}
.term-in input{
  flex:1;min-height:44px;background:transparent;border:none;color:#e8f1fb;
  font-family:var(--mono);font-size:14.5px;
}
.term-in input:focus-visible{outline:2px solid var(--blue);outline-offset:0}
.synpanel{background:#101c2d;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;font-size:14.5px}
.synpanel h5{margin:0 0 8px;font-size:13.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.07em}
.synpanel .syn-shape{font-family:var(--mono);background:#0a1420;border:1px solid var(--line);border-radius:7px;padding:8px 12px;margin:6px 0}
.synpanel ul{margin:6px 0 0 20px;padding:0}
.synpanel li{margin:3px 0}
.synpanel code{font-family:var(--mono);background:#0a1420;border-radius:4px;padding:1px 6px;font-size:13.5px}

/* branch steps */
.stepchip{
  display:inline-flex;align-items:center;gap:8px;background:var(--blue-t);color:var(--blue);
  border:1px solid var(--blue);font-weight:800;font-size:13px;letter-spacing:.08em;
  border-radius:999px;padding:5px 13px;margin:0 0 10px;text-transform:uppercase;
}
.stepverdict{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.stepverdict.ok{border-color:var(--green);background:var(--green-t)}
.stepverdict.bad{border-color:var(--red);background:var(--red-t)}

/* ---------- feedback block ---------- */
.feedback{border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:12px;background:var(--panel);margin:16px 0;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:800;font-size:16px;letter-spacing:.02em}
.fb-head .fb-pts{margin-left:auto;font-family:var(--mono);font-size:14.5px;font-weight:700}
.feedback.fb-correct{border-left-color:var(--green)}
.feedback.fb-correct .fb-head{background:var(--green-t);color:var(--green)}
.feedback.fb-partial{border-left-color:var(--amber)}
.feedback.fb-partial .fb-head{background:var(--amber-t);color:var(--amber)}
.feedback.fb-wrong{border-left-color:var(--red)}
.feedback.fb-wrong .fb-head{background:var(--red-t);color:var(--red)}
.feedback.fb-skipped{border-left-color:var(--grey)}
.feedback.fb-skipped .fb-head{background:var(--grey-t);color:var(--grey)}
.fb-body{padding:14px 16px}
.fb-body h4{margin:14px 0 6px;font-size:14.5px;text-transform:uppercase;letter-spacing:.07em}
.fb-body h4:first-child{margin-top:0}
.fb-correct-ans{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:15px}
.fb-part{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:8px 0}
.fb-part.good{border-left:3px solid var(--green)}
.fb-part.badd{border-left:3px solid var(--red)}
.fb-part.miss{border-left:3px solid var(--amber)}
.fb-part ul{margin:4px 0 2px 20px;padding:0}
.fb-part li{margin:5px 0;font-size:14.8px}
.fb-part li b{color:var(--text)}
.fb-why{color:var(--muted);font-size:14.3px}
.fb-explain{margin:10px 0 0;font-size:15.2px}
.fb-explain p{margin:7px 0}
.fb-study{
  margin:12px 0 0;padding:10px 14px;border-radius:9px;background:var(--blue-t);
  border:1px solid #2c4a6e;font-size:14.5px;
}
.fb-study b{color:var(--blue)}
.fb-tone{margin:10px 0 0;color:var(--muted);font-size:14.3px;font-style:italic}

/* ---------- nav row ---------- */
.navrow{display:flex;gap:12px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.btn-check{min-height:48px;padding:11px 24px;border-radius:10px;border:none;font-weight:800;font-size:16px;background:#2f7fd4;color:#fff}
.btn-check:hover:not(:disabled){filter:brightness(1.1)}
.btn-check:disabled{opacity:.5;cursor:not-allowed}
.btn-next{min-height:48px;padding:11px 24px;border-radius:10px;border:none;font-weight:800;font-size:16px;background:linear-gradient(135deg,#2f7fd4,#3ecf8e);color:#07121e}
.btn-ghost{min-height:44px;padding:9px 18px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.formerr{color:var(--red);font-weight:700;font-size:14.5px;min-height:22px;margin:6px 0}

/* ---------- pause overlay ---------- */
.pause-overlay{
  position:fixed;inset:0;z-index:80;background:#070c14;display:flex;align-items:center;justify-content:center;
}
.pause-card{max-width:460px;text-align:center;padding:30px}
.pause-card .big{font-size:44px;margin-bottom:8px}
.pause-card h2{margin:0 0 8px}
.pause-card p{color:var(--muted)}

/* ---------- review screen ---------- */
.rev-item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;flex-wrap:wrap}
.rev-item .rev-t{flex:1;min-width:220px}
.rev-item .rev-t b{display:block}
.rev-item .rev-t span{color:var(--muted);font-size:14px}
.rev-item .warnword{color:var(--amber);font-weight:800}

/* ---------- results ---------- */
.res-hero{padding:30px 4px 6px}
.res-pass,.res-fail{border-radius:14px;padding:26px 26px;margin:16px 0;border:1.5px solid}
.res-pass{border-color:var(--green);background:linear-gradient(160deg,rgba(62,207,142,.14),rgba(62,207,142,.03))}
.res-fail{border-color:var(--red);background:linear-gradient(160deg,rgba(255,92,108,.13),rgba(255,92,108,.03))}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.stat .s-num{font-size:27px;font-weight:900;font-family:var(--mono)}

.stat.good .s-num{color:var(--green)}
.stat.part .s-num{color:var(--amber)}
.stat.bad .s-num{color:var(--red)}
.stat.skip .s-num{color:var(--grey)}
table.themetab{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0}
table.themetab th,table.themetab td{border:1px solid var(--line);padding:8px 11px;text-align:left}
table.themetab th{background:#101c2d;color:var(--muted)}
.progressbar{height:12px;background:#0a1420;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 2px}
.progressbar>div{height:100%;background:linear-gradient(90deg,#2f7fd4,#3ecf8e);transition:width .25s}
.report-item{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:var(--panel);overflow:hidden}
.report-item .ri-head{display:flex;gap:10px;align-items:center;padding:11px 15px;cursor:pointer;flex-wrap:wrap}
.report-item .ri-head b{flex:1;min-width:200px;font-size:15px}
.ri-state{font-weight:800;font-size:13.5px;border-radius:999px;padding:4px 12px;white-space:nowrap}
.ri-state.s-correct{color:var(--green);border:1.5px solid var(--green)}
.ri-state.s-partial{color:var(--amber);border:1.5px solid var(--amber)}
.ri-state.s-wrong{color:var(--red);border:1.5px solid var(--red)}
.ri-state.s-skipped{color:var(--grey);border:1.5px solid var(--grey)}
.ri-body{border-top:1px solid var(--line);padding:12px 16px;font-size:14.8px}
.ri-body .mono-a{font-family:var(--mono);background:#0a1420;border:1px solid var(--line);border-radius:7px;padding:7px 11px;margin:6px 0;display:inline-block}

/* ---------- misc ---------- */

.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

<script>
/* ============================================================
   CyberPulseAcademy exam engine — vanilla JS, no dependencies.
   One shared engine drives all four Alert Fatigue severity files.
   Data contract: window.EXAM_DATA (injected before this script).
   ============================================================ */
(function(){
'use strict';

var D = window.EXAM_DATA;
if(!D || !D.exercises || !D.exercises.length){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Data error</h2><p>This exam file has no exercise data.</p></div>';
  return;
}

/* ---------------- tiny DOM + misc helpers ---------------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(k==='class'){ e.className = v; }
    else if(k==='text'){ e.textContent = v; }
    else if(k==='html'){ e.innerHTML = v; }
    else if(k==='style'){ e.style.cssText = v; }
    else if(k.slice(0,2)==='on'){ e.addEventListener(k.slice(2), v); }
    else if(v!==null && v!==undefined){ e.setAttribute(k, v); }
  });
  (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j = Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtT(sec){
  sec = Math.max(0, sec);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
var LETTERS = 'ABCDEFGHIJ';

/* highlight a search term inside a log line, safely */
function hlLine(line, term){
  var safe = esc(line);
  if(!term) return safe;
  var t = term.toLowerCase(), low = line.toLowerCase();
  var out = '', i = 0, at;
  while((at = low.indexOf(t, i)) !== -1){
    out += esc(line.slice(i, at)) + '<mark>' + esc(line.slice(at, at+t.length)) + '</mark>';
    i = at + t.length;
  }
  return out + esc(line.slice(i));
}

/* ---------------- static labels ---------------- */
var TYPE_LABELS = {
  qcm:'Multiple choice (single answer)', multi:'Multiple choice (select all that apply)',
  match:'Drag & drop matching', order:'Drag to reorder / prioritise',
  blank:'Fill in the blanks', lines:'Click the right log lines',
  triage:'SOC alert-queue triage', terminal:'Interactive terminal',
  branch:'Branching decision scenario'
};

/* ---------------- exam state ---------------- */
var S = {
  phase:'intro',                    /* intro | exam | review | results */
  order:[],                         /* shuffled exercise indices for this attempt */
  inst:{},                          /* idx -> runtime instance (shuffled copy) */
  pos:0,
  graded:{},                        /* idx -> {points, status, detail, hintUsed} */
  skipped:[],                       /* indices skipped and not yet answered */
  hintUsed:{},                      /* idx -> true */
  timer:{ total:D.timerSeconds, left:D.timerSeconds, running:false, manual:false, auto:false, over:false },
  reported:false,
  user:null,
  returned:false                    /* true when the current exercise was reopened from review */
};

/* ---------------- timer (three distinct modes) ---------------- */
var timerEl = null;
function timerModes(){ /* returns which indicator to show */
  if(S.timer.over) return 'over';
  if(S.timer.manual) return 'manual';
  if(S.timer.auto) return 'auto';
  return 'running';
}
function renderTimer(){
  if(!timerEl) return;
  var m = timerModes(), modeTxt, cls;
  if(m==='running'){ modeTxt = '▶ running'; cls='mode-running'; }
  else if(m==='manual'){ modeTxt = '⏸ paused by you'; cls='mode-manual'; }
  else if(m==='auto'){ modeTxt = '⏸ paused — review your feedback'; cls='mode-auto'; }
  else { modeTxt = '⏱ time over'; cls='mode-over'; }
  timerEl.className = 'xh-chip xh-timer ' + cls;
  timerEl.innerHTML = '<span class="mode">'+modeTxt+'</span> · ' + fmtT(S.timer.left);
}
setInterval(function(){
  if(S.phase!=='exam' && S.phase!=='review') return;
  if(S.timer.running && !S.timer.manual && !S.timer.auto && !S.timer.over){
    S.timer.left -= 1;
    if(S.timer.left <= 0){ S.timer.left = 0; S.timer.over = true; timeUp(); }
    renderTimer();
  }
}, 1000);

function timeUp(){
  /* any exercise never graded is excluded — nothing to force-submit */
  S.timer.over = true;
  renderResults('The timer ran out. Exercises you did not answer were excluded from the score.');
}

/* ---------------- scoring core (single source of truth) ---------------- */
/* res = {single:bool, C, W, T} -> points 0..100, hint applied afterwards */
function exercisePoints(idx, res){
  var pts;
  if(res.single){ pts = (res.C >= 1 && res.W === 0) ? 100 : 0; }
  else { pts = Math.floor(Math.max(0, res.C - res.W) / Math.max(1, res.T) * 100); }
  if(S.hintUsed[idx]) pts = Math.floor(pts * 0.9);
  return pts;
}
function scoreTotals(){
  var earned = 0, possible = 0, keys = Object.keys(S.graded);
  keys.forEach(function(k){ earned += S.graded[k].points; possible += 100; });
  return { earned:earned, possible:possible, answered:keys.length };
}
function liveScoreTxt(){
  var t = scoreTotals();
  return t.earned + ' / ' + t.possible;
}

/* ---------------- header ---------------- */
function buildHeader(){
  var counter = h('span', {class:'xh-chip xh-counter', text:''});
  var badge = h('span', {class:'sev-badge sev-'+D.severityClass, text:D.severityLabel});
  timerEl = h('span', {class:'xh-chip xh-timer mode-running', text:''});
  var score = h('span', {class:'xh-chip', text:''});
  score.id = 'liveScore';
  var hintBtn = h('button', {class:'xh-btn hint', text:'💡 Hint (−10%)', onclick:onHint, 'aria-label':'Get a hint. Costs 10 percent of this exercise.'});
  var pauseBtn = h('button', {class:'xh-btn pause', text:'⏸ Pause', onclick:onManualPause, 'aria-label':'Pause the exam and hide the exercise'});
  var skipBtn = h('button', {class:'xh-btn skip', text:'⏭ Skip', onclick:onSkip, 'aria-label':'Skip this exercise and return to it later'});
  var head = h('header', {class:'xhead', id:'xhead'}, [
    counter, badge, h('span',{class:'xh-spacer'}), timerEl, score, hintBtn, pauseBtn, skipBtn
  ]);
  head._counter = counter; head._score = score; head._hint = hintBtn; head._pause = pauseBtn; head._skip = skipBtn;
  return head;
}

function updateHeader(){
  var head = $('#xhead'); if(!head) return;
  head._counter.textContent = 'Exercise ' + (S.pos+1) + ' of ' + S.order.length;
  head._score.textContent = '✓ ' + liveScoreTxt();
  var idx = S.order[S.pos];
  head._hint.disabled = !!(S.hintUsed[idx] || S.graded[idx]);
  head._skip.disabled = !!S.graded[idx];
  head._pause.textContent = S.timer.manual ? '▶ Resume' : '⏸ Pause';
  renderTimer();
}

/* ---------------- manual pause ---------------- */
var pauseOverlay = null;
function onManualPause(){
  if(S.phase!=='exam' && S.phase!=='review') return;   /* pause works on the exercise screen AND the review screen */
  S.timer.manual = true;          /* manual pause: hides the exercise (or the review list) */
  updateHeader();
  pauseOverlay = h('div', {class:'pause-overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'Exam paused'}, [
    h('div', {class:'pause-card'}, [
      h('div', {class:'big', text:'⏸'}),
      h('h2', {text:'Paused by you'}),
      h('p', {text:'Your work is hidden while you pause, so no thinking time is free. The timer is stopped.'}),
      h('button', {class:'btn-primary', text:'▶ Resume exam', onclick:function(){
        S.timer.manual = false;
        if(pauseOverlay){ pauseOverlay.remove(); pauseOverlay = null; }
        updateHeader();
      }})
    ])
  ]);
  document.body.appendChild(pauseOverlay);
  pauseOverlay.querySelector('button').focus();
}

/* ---------------- hint ---------------- */
function onHint(){
  var idx = S.order[S.pos];
  if(S.hintUsed[idx] || S.graded[idx] || S.phase!=='exam') return;
  S.hintUsed[idx] = true;          /* −10% on THIS exercise; timer keeps running */
  updateHeader();
  var box = $('#hintBox');
  if(box){
    box.classList.remove('hidden');
    box.innerHTML = '';
    box.appendChild(h('div', {class:'synpanel'}, [
      h('h5', {text:'💡 Hint (this exercise now scores at most 90/100)'}),
      h('div', {html:'<p style="margin:0">'+esc(D.exercises[idx].hint||'')+'</p>'})
    ]));
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

/* ---------------- intro screen ---------------- */
function themeCoverage(){
  /* map: themeKey -> set of concepts exercised in THIS file */
  var cov = {};
  D.exercises.forEach(function(ex){
    (ex.covers || []).forEach(function(c){ cov[c] = true; });
  });
  return cov;
}
function renderIntro(){
  S.phase = 'intro';
  var app = $('#app'); app.innerHTML = '';
  document.title = D.keyword + ' — ' + D.severityLabel + ' practice exam';
  var cov = themeCoverage();

  var themeCards = D.themes.map(function(t){
    return h('div', {class:'kw-theme'}, [
      h('h4', {text:t.name}),
      h('div', {class:'kw-items'}, t.items.map(function(it){
        return h('span', {class:'kw-item'+(cov[it.key]?' covered':''), text:it.label,
          title: cov[it.key] ? 'Exercised in this file' : 'Exercised in another tier of this topic'});
      }))
    ]);
  });

  var typesInFile = [];
  D.exercises.forEach(function(ex){ if(typesInFile.indexOf(ex.type)===-1) typesInFile.push(ex.type); });

  var kwParas = D.intro.keywordExpl.map(function(p){ return h('p', {text:p}); });
  var areaList = h('ul', {class:'intro-list'});
  D.intro.areas.forEach(function(a){ areaList.appendChild(h('li', {html:a})); });

function startExam(){
  S.phase = 'exam';

/* ============================================================
   INSTANCE PREP — per-attempt shuffled copies of each exercise
   ============================================================ */
function prepInstance(idx){
  var ex = D.exercises[idx];
  var inst = JSON.parse(JSON.stringify(ex));
  inst.idx = idx;
  var map;
  if(ex.type==='qcm' || ex.type==='multi'){
    map = shuffle(ex.options.map(function(_,i){ return i; }));
    inst.viewOptions = map.map(function(oi){ return ex.options[oi]; });
    inst.viewCorrect = (ex.type==='qcm') ? map.indexOf(ex.correct) : ex.correct.map(function(oi){ return map.indexOf(oi); }).sort(function(a,b){return a-b;});
    inst.viewWhys = map.map(function(oi){ return (ex.whyOpts && ex.whyOpts[oi]) || ''; });
  } else if(ex.type==='match'){
    inst.viewItems = shuffle(ex.items.map(function(it,i){ return {t:it.t, z:it.z, i:i, why:it.why||''}; }));
    inst.viewZones = shuffle(ex.zones.slice());
  } else if(ex.type==='order'){
    inst.viewOrder = shuffle(ex.items.map(function(_,i){ return i; }));
  } else if(ex.type==='blank'){
    inst.viewBank = shuffle(ex.bank.slice());
  } else if(ex.type==='triage'){
    inst.viewQueue = ex.queue.map(function(a,i){
      var c = {}; Object.keys(a).forEach(function(k){ c[k]=a[k]; }); c.i = i; return c;
    });
    inst.viewQueue = shuffle(inst.viewQueue);
  } else if(ex.type==='branch'){
    inst.viewSteps = ex.steps.map(function(st){
      map = shuffle(st.options.map(function(_,i){ return i; }));
      return {
        label: st.label, question: st.question, panel: st.panel || null,
        viewOptions: map.map(function(oi){ return st.options[oi]; }),
        viewCorrect: map.indexOf(st.correct),
        viewWhys: map.map(function(oi){ return (st.whyOpts && st.whyOpts[oi]) || ''; }),
        why: st.why || ''
      };
    });
  }
  return inst;
}

/* ============================================================
   SCENARIO RENDERER — collapsible block with labelled artefacts
   ============================================================ */
function buildLogViewer(p, opts){
  opts = opts || {};
  var lines = p.lines || [];
  var lv = h('div', {class:'logview'});
  var cnt = h('span', {class:'lfc', text:lines.length+' lines'});
  function draw(term){
    lv.innerHTML = '';
    lines.forEach(function(line, li){
      var show = !term || line.toLowerCase().indexOf(term.toLowerCase())!==-1;
      if(!show) return;
      var row = h('div', {class:'logline hit'});
      row.appendChild(h('span', {class:'ln', text:li+1}));
      var content = h('span', {class:'lt'});
      var cls = /\b(ERROR|CRIT|FAILED|Failure)\b/.test(line) ? ' lv-err' :
                (/\b(WARN|WARNING)\b/.test(line) ? ' lv-warn' :
                (/\b(OK|SUCCESS)\b/.test(line) ? ' lv-ok' :
                (/\bINFO\b/.test(line) ? ' lv-info' : '')));
      if(cls) content.className += cls;
      content.innerHTML = hlLine(line, term||'');
      row.appendChild(content);
      lv.appendChild(row);
    });
    if(!lv.children.length) lv.appendChild(h('div',{class:'logline', html:'<span class="lt" style="color:#7c92aa">(no lines match this filter)</span>'}));
    cnt.textContent = (term ? lv.children.length + ' / ' : '') + lines.length + ' lines';
  }
  var wrap = h('div', {class:'logwrap'});
  if(p.filter){
    var inp = h('input', {type:'text', placeholder:'Type to filter these log lines…', 'aria-label':'Filter log lines'});
    inp.addEventListener('input', function(){ draw(inp.value); });
    wrap.appendChild(h('div', {class:'logfilter'}, [inp, cnt]));
  }
  draw('');
  wrap.appendChild(lv);
  return wrap;
}

function artefactPanel(p, pi, labelPrefix){
  var body;
  if(p.kind==='log'){ body = h('div',{class:'art-body'},[buildLogViewer(p)]); }
  else if(p.kind==='code'){ body = h('div',{class:'art-body'},[h('div',{class:'codeblock mono', text:p.content})]); }
  else if(p.kind==='table'){
    var tb = h('table',{class:'art-table'});
    var tr = h('tr'); (p.head||[]).forEach(function(cName){ tr.appendChild(h('th',{text:cName})); });
    tb.appendChild(tr);
    (p.rows||[]).forEach(function(r){ var row=h('tr'); r.forEach(function(cName){ row.appendChild(h('td',{text:cName})); }); tb.appendChild(row); });
    body = h('div',{class:'art-body'},[tb]);
  }
  else if(p.kind==='fields'){
    var ul = h('ul',{class:'art-fields'});
    (p.fields||[]).forEach(function(f){ ul.appendChild(h('li',{html:'<b>'+esc(f[0])+':</b> '+esc(f[1])})); });
    body = h('div',{class:'art-body'},[ul]);
  }
  else {
    body = h('div',{class:'art-body'});
    (Array.isArray(p.content)?p.content:[p.content||'']).forEach(function(par){ body.appendChild(h('p',{text:par})); });
  }
  return h('div',{class:'artefact'},[
    h('div',{class:'art-label', text:(labelPrefix||('ARTEFACT '+(pi+1)))+' — '+(p.label||'Context')}),
    body
  ]);
}

function buildScenarioBlock(ex){
  var sc = ex.scenario || {};
  var body = h('div',{class:'bl-body'});
  (sc.panels||[]).forEach(function(p,pi){ body.appendChild(artefactPanel(p,pi)); });
  if(!(sc.panels||[]).length && sc.summaryOnly){ body.appendChild(h('p',{class:'soft',text:sc.summaryOnly})); }

  var summary = h('div',{class:'sc-summary hidden'},[ h('span',{class:'dot',text:'▸'}), h('span',{text:sc.summary || 'Scenario collapsed'}) ]);

    h('div',{class:'bl-head'},[

/* ============================================================
   ANSWER WIDGETS
   Each widget: { node, getUser():answer|null, grade(answer):res }
   res = { single, C, W, T, right:[{label}], wrong:[{label,why}], missed:[{label,why}], extra }
   ============================================================ */

/* ---- QCM (single answer, all-or-nothing) ---- */
function wQCM(inst){
  var sel = null, btns = [];
  var list = h('div',{class:'optlist', role:'radiogroup','aria-label':'Answer options'});
  inst.viewOptions.forEach(function(opt,i){
    var b = h('button',{class:'opt', role:'radio','aria-checked':'false', onclick:function(){
      sel = i;
      btns.forEach(function(x,j){ x.setAttribute('aria-checked', j===i?'true':'false'); x.classList.toggle('sel', j===i); });
    }},[ h('span',{class:'opt-lab',text:LETTERS[i]+'.'}), h('span',{text:opt}) ]);
    btns.push(b); list.appendChild(b);
  });
  return {
    node: list,
    getUser: function(){ return sel===null ? null : {sel:sel}; },
    grade: function(a){
      var ok = a.sel === inst.viewCorrect;
      var res = { single:true, C:ok?1:0, W:ok?0:1, T:1, right:[], wrong:[], missed:[] };
      if(ok){ res.right.push({label:LETTERS[a.sel]+'. '+inst.viewOptions[a.sel]}); }
      else {
        res.wrong.push({label:LETTERS[a.sel]+'. '+inst.viewOptions[a.sel], why:inst.viewWhys[a.sel]||'This choice does not fit this scenario.'});
        res.missed.push({label:LETTERS[inst.viewCorrect]+'. '+inst.viewOptions[inst.viewCorrect], why:inst.viewWhys[inst.viewCorrect]||'This is the answer that fits this scenario.'});
      }
      btns.forEach(function(b,j){
        b.disabled = true;
        if(j===inst.viewCorrect) b.classList.add('correct-reveal');
        else if(j===a.sel) b.classList.add('wrong-reveal');
      });
      return res;
    }
  };
}

/* ---- MULTI (select all that apply, partial credit) ---- */
function wMULTI(inst){
  var sel = {}, btns = [];
  var list = h('div',{class:'optlist','aria-label':'Answer options, select all that apply'});
  inst.viewOptions.forEach(function(opt,i){
    var b = h('button',{class:'opt','aria-pressed':'false', onclick:function(){
      sel[i] = !sel[i];
      b.setAttribute('aria-pressed', sel[i]?'true':'false');
      b.classList.toggle('sel', !!sel[i]);
    }},[ h('span',{class:'opt-lab',text:LETTERS[i]+'.'}), h('span',{text:opt}) ]);
    btns.push(b); list.appendChild(b);
  });
  return {
    node: list,
    note: 'Select all that apply. There may be one or several correct answers.',
    getUser: function(){ var arr = Object.keys(sel).filter(function(k){ return sel[k]; }).map(Number); return arr.length ? {sel:arr} : null; },
    grade: function(a){
      var corr = inst.viewCorrect, C=0, W=0, res = {single:false, C:0, W:0, T:corr.length, right:[], wrong:[], missed:[]};
      a.sel.forEach(function(i){
        if(corr.indexOf(i)!==-1){ C++; res.right.push({label:LETTERS[i]+'. '+inst.viewOptions[i], why:inst.viewWhys[i]||''}); }
        else { W++; res.wrong.push({label:LETTERS[i]+'. '+inst.viewOptions[i], why:inst.viewWhys[i]||'Not correct for this scenario.'}); }
      });
      corr.forEach(function(i){ if(a.sel.indexOf(i)===-1){ res.missed.push({label:LETTERS[i]+'. '+inst.viewOptions[i], why:inst.viewWhys[i]||'This was a correct answer.'}); } });
      res.C=C; res.W=W;
      btns.forEach(function(b,j){
        b.disabled = true;
        if(corr.indexOf(j)!==-1) b.classList.add('correct-reveal');
        else if(a.sel.indexOf(j)!==-1) b.classList.add('wrong-reveal');
      });
      return res;
    }
  };
}

/* ---- MATCH (drag & drop into zones, partial credit) ---- */
function wMATCH(inst){
  var placed = {}, picked = null;
  var bankChips = {}, zoneSlots = {};
  var bank = h('div',{class:'bank','aria-label':'Items to sort'});
  var zonesBox = h('div',{class:'zones'});

  function chipFor(it){
    var c = h('button',{class:'chip', draggable:'true', text:it.t, 'aria-label':'Item: '+it.t+'. Click to pick it up, then click a zone.'});
    c.addEventListener('click', function(){
      if(placed[it.i]!==undefined){ /* take it back */ delete placed[it.i]; draw(); return; }
      picked = (picked===it.i) ? null : it.i; draw();
    });
    c.addEventListener('dragstart', function(ev){ picked = it.i; try{ ev.dataTransfer.setData('text/plain', String(it.i)); }catch(e){} });
    c.addEventListener('dragend', function(){ draw(); });
    return c;
  }
  inst.viewZones.forEach(function(zn){
    var slot = h('div',{class:'zslot'});
    var z = h('div',{class:'zone', role:'button', tabindex:'0', 'aria-label':'Zone: '+zn+'. Pick an item first, then press Enter to place it here.'},[ h('h5',{text:zn}), slot ]);
    function place(i){
      placed[i] = zn; picked = null; draw();
    }
    z.addEventListener('click', function(){ if(picked!==null && picked!==undefined) place(picked); });
    z.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); if(picked!==null && picked!==undefined) place(picked); }
    });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var i = parseInt(ev.dataTransfer.getData('text/plain'),10);
      if(!isNaN(i)) place(i);
    });
    zoneSlots[zn] = slot;
    zonesBox.appendChild(z);
  });
  function draw(){
    bank.innerHTML = '';
    inst.viewItems.forEach(function(it){
      if(placed[it.i]===undefined){ var c = chipFor(it); if(picked===it.i) c.classList.add('picked'); bank.appendChild(c); }
    });
    inst.viewZones.forEach(function(zn){
      var slot = zoneSlots[zn]; slot.innerHTML = '';
      inst.viewItems.forEach(function(it){
        if(placed[it.i]===zn){
          var c = chipFor(it);
          c.setAttribute('aria-label','Item '+it.t+' placed in zone '+zn+'. Click to take it back.');
          slot.appendChild(c);
        }
      });
    });
  }
  draw();
  return {
    node: h('div',{},[ h('div',{class:'bank-title',text:'Items — click one, then click its zone (or drag it)'}), bank, zonesBox ]),
    note:'Place every item in the right zone. An item can stay unplaced, but unplaced items earn no points.',
    getUser: function(){ return {placed:placed}; },
    grade: function(){
      var C=0,W=0, res={single:false,C:0,W:0,T:inst.viewItems.length,right:[],wrong:[],missed:[]};
      inst.viewItems.forEach(function(it){
        var zn = placed[it.i];
        if(zn===undefined){ res.missed.push({label:it.t, why:'Correct zone: “'+it.z+'”. '+(it.why||'')}); }
        else if(zn===it.z){ C++; res.right.push({label:it.t+' → '+it.z}); }
        else { W++; res.wrong.push({label:it.t+' → '+zn, why:'“'+it.t+'” belongs in “'+it.z+'”. '+(it.why||'')}); }
      });
      res.C=C; res.W=W;
      return res;
    }
  };
}

/* ---- ORDER (drag to reorder, partial credit per position) ---- */
function wORDER(inst){
  var cur = inst.viewOrder.slice();
  var box = h('div',{class:'ordlist'});
  var dragI = null;
  function row(i, displayIdx){
    var r = h('div',{class:'ordrow', draggable:'true','data-oi':i});
    r.appendChild(h('span',{class:'pos-n',text:(displayIdx+1)+'.'}));
    r.appendChild(h('span',{class:'ord-t',text:inst.items[i]}));
    var up = h('button',{class:'ob', text:'↑','aria-label':'Move item '+(displayIdx+1)+' up', onclick:function(){ move(displayIdx,-1); }});
    var dn = h('button',{class:'ob', text:'↓','aria-label':'Move item '+(displayIdx+1)+' down', onclick:function(){ move(displayIdx,1); }});
    r.appendChild(h('span',{class:'ordbtns'},[up,dn]));
    r.addEventListener('dragstart', function(){ dragI = displayIdx; });
    r.addEventListener('dragover', function(ev){ ev.preventDefault(); r.classList.add('over'); });
    r.addEventListener('dragleave', function(){ r.classList.remove('over'); });
    r.addEventListener('drop', function(ev){
      ev.preventDefault(); r.classList.remove('over');
      if(dragI===null) return;
      var item = cur.splice(dragI,1)[0];
      var at = Array.prototype.indexOf.call(box.children, r);
      cur.splice(at, 0, item);
      dragI = null; draw();
    });
    return r;
  }
  function move(pos, dir){
    var j = pos+dir;
    if(j<0 || j>=cur.length) return;
    var t = cur[pos]; cur[pos]=cur[j]; cur[j]=t; draw();
  }
  function draw(){
    box.innerHTML='';
    cur.forEach(function(oi, di){ box.appendChild(row(oi, di)); });
  }
  draw();
  return {
    node: h('div',{},[ h('div',{class:'bank-title',text:'Put the steps in the right order — top is first. Use the arrows or drag the rows.'}), box ]),
    note:'Every item in its correct position earns its share of the points.',
    getUser: function(){ return {order:cur.slice()}; },
    grade: function(a){
      var C=0, res={single:false,C:0,W:0,T:cur.length,right:[],wrong:[],missed:[]};
      a.order.forEach(function(oi,pos){
        if(oi===pos){ C++; res.right.push({label:(pos+1)+'. '+inst.items[pos]}); }
        else { res.wrong.push({label:'Position '+(pos+1)+': “'+inst.items[oi]+'”', why:'Position '+(pos+1)+' should be: “'+inst.items[pos]+'”.'}); }
      });
      res.C=C;
      return res;
    }
  };
}

/* ---- BLANK (fill in the blanks from a shuffled bank, partial credit) ---- */
function wBLANK(inst){
  var sels = [];
  var parts = inst.text.split(/\{\{(\d+)\}\}/);
  var line = h('div',{class:'blankline'});
  parts.forEach(function(pt, i){

      var s = h('select',{class:'blanksel','aria-label':'Blank '+(slot+1)});
      s.appendChild(h('option',{value:'',text:'— choose —'}));

      sels[slot]=s; line.appendChild(s);
    } else {
      line.appendChild(h('span',{text:pt}));
    }
  });
  var bankLine = h('div',{class:'bank-title',text:'Word bank (shuffled — the display order is not the answer order): '+inst.viewBank.join(' · ')});
  return {
    node: h('div',{},[bankLine, line]),
    note:'Choose one word for each blank. Every correct blank earns its share; wrong picks cancel correct ones.',
    getUser: function(){ var v = sels.map(function(s){ return s.value; }); return v.some(function(x){return !x;}) ? null : {vals:v}; },
    grade: function(a){
      var C=0,W=0, res={single:false,C:0,W:0,T:sels.length,right:[],wrong:[],missed:[]};
      a.vals.forEach(function(v,i){
        if(v===inst.answers[i]){ C++; res.right.push({label:'Blank '+(i+1)+': “'+inst.answers[i]+'”'}); sels[i].classList.add('ok'); }
        else { W++; res.wrong.push({label:'Blank '+(i+1)+': “'+v+'”', why:'Here the right word is “'+inst.answers[i]+'”. '+(inst.whySlots&&inst.whySlots[i]||'')}); sels[i].classList.add('bad'); }
      });
      sels.forEach(function(s){ s.disabled = true; });
      res.C=C; res.W=W;
      return res;
    }
  };
}

/* ---- LINES (click the right log lines; single or multi) ---- */

        if(a.sel.indexOf(li)===-1){ res.missed.push({label:'Line '+(li+1)+': '+shortLine(inst.log.lines[li]), why:(inst.lineWhy&&inst.lineWhy[li])||'This line is the one the question asks about.'}); }
      });
      res.C=C; res.W=W;
      lv.style.pointerEvents = 'none';
      $$('.logline', lv).forEach(function(row){
        var li = parseInt(row.getAttribute('data-li'),10);
        row.setAttribute('aria-disabled','true');
        if(inst.correctLines.indexOf(li)!==-1) row.style.boxShadow = 'inset 3px 0 0 var(--green)';
        else if(selected[li]) row.style.boxShadow = 'inset 3px 0 0 var(--red)';
      });
      return res;
    }
  };
}
function shortLine(s){ s = String(s); return s.length>90 ? s.slice(0,87)+'…' : s; }

/* ---- TRIAGE (SOC alert queue: choose an action per alert) ---- */
function wTRIAGE(inst){
  var picks = {};
  var box = h('div',{class:'aq'});
  var btnRefs = {};
  inst.viewQueue.forEach(function(al, qi){
    var acts = h('div',{class:'a-actions'});
    btnRefs[al.i] = [];
    inst.actions.forEach(function(act, ai){
      var b = h('button',{text:act,'aria-pressed':'false', onclick:function(){
        picks[al.i] = ai;
        btnRefs[al.i].forEach(function(x,j){ x.setAttribute('aria-pressed', j===ai?'true':'false'); });
      }});
      btnRefs[al.i].push(b); acts.appendChild(b);
    });
    box.appendChild(h('div',{class:'acard'},[
      h('div',{class:'ar1'},[
        h('span',{class:'a-sev '+String(al.sev||'p4').toLowerCase(), text:al.sev}),
        h('span',{class:'a-title',text:al.title}),
        h('span',{class:'a-meta',text:al.meta||''})
      ]),
      h('div',{class:'a-desc',text:al.desc}),
      acts
    ]));
  });
  return {
    node: h('div',{},[ h('div',{class:'bank-title',text:'Choose the best next action for each alert.'}), box ]),
    note:'One action per alert. Unanswered alerts earn nothing (but do not go negative).',
    getUser: function(){ var n = Object.keys(picks).length; return n ? {picks:picks} : null; },
    grade: function(a){
      var C=0,W=0, res={single:false,C:0,W:0,T:inst.viewQueue.length,right:[],wrong:[],missed:[]};
      inst.viewQueue.forEach(function(al){
        var p = a.picks[al.i];
        if(p===undefined){ res.missed.push({label:al.title, why:'Best action: '+inst.actions[al.correct]+'. '+(al.why||'')}); }
        else if(p===al.correct){ C++; res.right.push({label:al.title+' → '+inst.actions[p]}); }
        else { W++; res.wrong.push({label:al.title+' → '+inst.actions[p], why:'For “'+al.title+'” the right action is “'+inst.actions[al.correct]+'”. '+((al.whyActs&&al.whyActs[p])||al.why||'')}); }
      });
      res.C=C; res.W=W;
      return res;
    }
  };
}

/* ---- TERMINAL (interactive fake shell) ---- */
function normCmd(c){ return String(c||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function wTERMINAL(inst){
  var t = inst.terminal;
  var out = h('div',{class:'term-out','aria-live':'polite'});
  var input = h('input',{type:'text', spellcheck:'false', 'aria-label':'Terminal input', placeholder:'type a command and press Enter'});
  var lastCmd = null;
  function print(txt, cls){
    var d = h('div',{class:cls||''}); d.textContent = txt; out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }
  function run(raw){
    var c = normCmd(raw);
    if(!c) return;
    print(inst.terminal.ps + ' ' + raw, 't-cmd');
    var first = c.split(' ')[0];
    var known = (t.tools||[]).some(function(x){ return first===x; });
    var isDangerous = (t.dangerous||[]).some(function(re){ return new RegExp(re).test(c); });
    var accepted = (t.accept||[]).some(function(re){ return new RegExp(re).test(c); });
    if(isDangerous){                 /* safety first: a destructive command is blocked even if it matches the accept shape */
      print('⚠ BLOCKED BY THE LAB: this command would change or destroy data. Nothing was run.', 't-warn');
      lastCmd = c;
    } else if(accepted){
      lastCmd = c;
      print(t.output || '(ok — command executed)', '');
    } else if(!known){
      print(first + ': command not found', 't-err');
    } else {
      print(first + ': wrong usage for this goal — check the flags and the target file.', 't-err');
    }
  }
  input.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ run(input.value); input.value=''; } });

  var kids = [];
  if(t.syntax){
    var sp = h('div',{class:'synpanel'},[ h('h5',{text:'Syntax reminder (the lab helps you here)'}), h('div',{class:'syn-shape mono', text:t.syntax.shape}) ]);
    var ul = h('ul');
    (t.syntax.opts||[]).forEach(function(o){ ul.appendChild(h('li',{html:'<code>'+esc(o[0])+'</code> — '+esc(o[1])})); });
    sp.appendChild(ul);
    if(t.syntax.example) sp.appendChild(h('div',{class:'syn-shape mono', html:'<span style="color:#7c92aa">example on another file:</span> '+esc(t.syntax.example)}));
    if(t.syntax.sampleOut) sp.appendChild(h('div',{html:'<span style="color:#7c92aa">expected output shape:</span> <span class="mono">'+esc(t.syntax.sampleOut)+'</span>'}));
    kids.push(sp);
  }
  var barKids = [ h('span',{class:'tdot',style:'background:#ff5f56'}), h('span',{class:'tdot',style:'background:#ffbd2e'}), h('span',{class:'tdot',style:'background:#27c93f'}), h('span',{text:t.termTitle||'soc-lab — bash'}) ];
  if(t.timeLimitSec){
    var limitLeft = t.timeLimitSec;
    var lim = h('span',{class:'term-limit', text:'⏱ '+fmtT(limitLeft)});
    var iv = setInterval(function(){
      if(S.phase!=='exam' && S.phase!=='review' || !out.isConnected){ clearInterval(iv); return; }
      if(S.timer.manual || S.timer.auto) return;          /* sub-timer respects both pauses */
      limitLeft--; lim.textContent = '⏱ '+fmtT(limitLeft);
      if(limitLeft<=0){
        clearInterval(iv);
        input.disabled = true;
        print('⏱ Time limit for this terminal is over. The main timer keeps running — press Skip or Next.', 't-warn');
      }
    }, 1000);
    barKids.push(lim);
  }
  kids.push(h('div',{class:'term'},[
    h('div',{class:'term-bar'}, barKids),
    out,
    h('div',{class:'term-in'},[ h('span',{class:'t-ps mono', text:t.ps||'analyst@soc-lab:~$'}), input ])
  ]));
  if(t.objective) kids.push(h('p',{class:'ansnote', text:'Goal on screen: '+t.objective}));
  return {
    node: h('div',{},kids),
    note:'Type the command, press Enter to run it, then press Check to grade it. The simulation never touches a real system.',
    getUser: function(){ return lastCmd ? {cmd:lastCmd} : null; },
    grade: function(a){
      var c = a.cmd;
      var isDangerous = (t.dangerous||[]).some(function(re){ return new RegExp(re).test(c); });
      var els = t.elements||[];
      var C=0, W=0, res={single:els.length===1, C:0, W:0, T:Math.max(1,els.length), right:[], wrong:[], missed:[], extra:{}};
      res.extra.canonical = t.canonical;
      res.extra.canonicalParts = t.canonicalParts||[];
      if(isDangerous){
        res.extra.dangerous = true;
        res.extra.dangerousWhy = t.dangerousWhy || 'This command would change or destroy data. In real work it can destroy evidence.';
        res.W = 1; res.C = 0;
        return res;
      }
      els.forEach(function(el){
        if(new RegExp(el.re).test(c)){ C++; res.right.push({label:el.label}); }
        else { res.missed.push({label:el.label, why:el.why||''}); }
      });
      (t.forbidden||[]).forEach(function(f){
        if(new RegExp(f.re).test(c)){ W++; res.wrong.push({label:f.label, why:f.why||'This flag works against the goal here.'}); }
      });
      res.C=C; res.W=W;
      return res;
    }
  };
}

/* ---- BRANCH (step-by-step decision scenario) ---- */
function wBRANCH(inst, hooks){
  var stepIdx = 0;
  var stepResults = [];
  var box = h('div',{});
  function renderStep(){
    box.innerHTML = '';
    var st = inst.viewSteps[stepIdx];
    var pick = null, btns = [];
    var list = h('div',{class:'optlist', role:'radiogroup'});
    st.viewOptions.forEach(function(opt,i){
      var b = h('button',{class:'opt', role:'radio','aria-checked':'false', onclick:function(){
        pick = i; btns.forEach(function(x,j){ x.setAttribute('aria-checked', j===i?'true':'false'); x.classList.toggle('sel', j===i); });
      }},[ h('span',{class:'opt-lab',text:LETTERS[i]+'.'}), h('span',{text:opt}) ]);
      btns.push(b); list.appendChild(b);
    });
    var err = h('div',{class:'formerr'});
    var verdict = h('div',{});
    var submit = h('button',{class:'btn-check', text: stepIdx===inst.viewSteps.length-1 ? 'Submit final step' : 'Submit step '+(stepIdx+1), onclick:function(){
      if(pick===null){ err.textContent = 'Choose an answer for this step first.'; return; }
      err.textContent = '';
      var ok = pick===st.viewCorrect;
      stepResults.push({ok:ok, picked:pick, st:st});
      btns.forEach(function(b,j){
        b.disabled = true;
        if(j===st.viewCorrect) b.classList.add('correct-reveal');
        else if(j===pick) b.classList.add('wrong-reveal');
      });
      submit.disabled = true;
      verdict.appendChild(h('div',{class:'stepverdict '+(ok?'ok':'bad'), html:
        (ok?'<b>✓ Step correct.</b> ':'<b>✗ Step wrong.</b> ') + esc(ok?(st.why||'Good — that is the right call here.'):(st.viewWhys[pick]||st.why||'The right call here was: '+st.viewOptions[st.viewCorrect]+'.')) }));
      nextBtn.classList.remove('hidden');
      hooks.onPauseForStep();          /* auto-pause after each step Check */
    }});
    var nextBtn = h('button',{class:'btn-next hidden', text: stepIdx===inst.viewSteps.length-1 ? 'See my result' : 'Next step ▶', onclick:function(){
      hooks.onResumeFromStep();
      if(stepIdx < inst.viewSteps.length-1){ stepIdx++; renderStep(); }
      else { hooks.onFinished(); }
    }});
    box.appendChild(h('div',{class:'stepchip', text:st.label}));
    if(st.panel){ box.appendChild(artefactPanel(st.panel, stepIdx, 'STEP '+(stepIdx+1)+' EVIDENCE')); }
    box.appendChild(h('div',{class:'q-text', text:st.question}));
    box.appendChild(list);
    box.appendChild(err);
    box.appendChild(submit);
    box.appendChild(nextBtn);
    box.appendChild(verdict);
  }
  renderStep();
  return {
    node: box,
    note:'Answer each step in order. Each step is graded on your first try.',
    getUser: function(){ return stepResults.length===inst.viewSteps.length ? {steps:stepResults} : (stepResults.length?{steps:stepResults, partial:true}:null); },
    grade: function(a){
      var C=0,W=0, res={single:false,C:0,W:0,T:inst.viewSteps.length,right:[],wrong:[],missed:[]};
      a.steps.forEach(function(r,i){
        if(r.ok){ C++; res.right.push({label:r.st.label+': '+r.st.viewOptions[r.st.viewCorrect]}); }
        else { W++; res.wrong.push({label:r.st.label+': you chose “'+r.st.viewOptions[r.picked]+'”', why:(r.st.viewWhys && r.st.viewWhys[r.picked]) || r.st.why || ('The right call was “'+r.st.viewOptions[r.st.viewCorrect]+'”.')}); }
      });
      res.C=C; res.W=W;
      return res;
    }
  };
}

/* ============================================================
   EXERCISE SCREEN
   ============================================================ */
var currentWidget = null;

function correctAnswerText(inst){
  switch(inst.type){
    case 'qcm': return inst.options[inst.correct];
    case 'multi': return inst.correct.map(function(i){ return inst.options[i]; }).join(' · ');
    case 'match': return inst.items.map(function(it){ return it.t+' → '+it.z; }).join(' · ');
    case 'order': return inst.items.join('  →  ');
    case 'blank': return inst.answers.map(function(a,i){ return 'blank '+(i+1)+': '+a; }).join(' · ');
    case 'lines': return inst.correctLines.map(function(li){ return 'line '+(li+1)+': '+shortLine(inst.log.lines[li]); }).join(' · ');
    case 'triage': return inst.queue.map(function(a){ return a.title+' → '+inst.actions[a.correct]; }).join(' · ');
    case 'terminal': return inst.terminal.canonical;
    case 'branch': return inst.steps.map(function(st,i){ return st.label+': '+st.options[st.correct]; }).join(' · ');
  }
  return '';
}

function buildFeedbackBlock(idx, inst, res, pts){
  var cls, icon, word;
  if(pts===100){ cls='fb-correct'; icon='✓'; word='Correct'; }
  else if(pts>=1){ cls='fb-partial'; icon='◐'; word='Partially correct'; }
  else { cls='fb-wrong'; icon='✗'; word='Incorrect'; }
  var head = h('div',{class:'fb-head'},[
    h('span',{text:icon+' '+word}),
    h('span',{class:'fb-pts', text: pts+' / 100 points'+(S.hintUsed[idx]?' (hint used: −10%)':'')})
  ]);
  var body = h('div',{class:'fb-body'});

  if(res.extra && res.extra.dangerous){
    body.appendChild(h('div',{class:'fb-part badd', html:'<b>⚠ Careful — that command is dangerous.</b> '+esc(res.extra.dangerousWhy||'')}));
  }
  if(res.extra && res.extra.canonical){
    var cp = h('div',{class:'codeblock mono', text:res.extra.canonical});
    var copy = h('button',{class:'copybtn', text:'Copy command', onclick:function(){
      try{
        navigator.clipboard.writeText(res.extra.canonical).then(function(){ copy.textContent='Copied ✓'; },
          function(){ copy.textContent='Select & copy manually'; });
      }catch(e){ copy.textContent='Select & copy manually'; }
      setTimeout(function(){ copy.textContent='Copy command'; }, 1800);
    }});
    body.appendChild(h('h4',{text:'Canonical command (copyable)'}));
    body.appendChild(cp);
    body.appendChild(h('div',{class:'copyrow'},[copy]));
    (res.extra.canonicalParts||[]).forEach(function(pt){
      body.appendChild(h('div',{class:'fb-part', html:'<span class="mono" style="color:var(--blue)">'+esc(pt[0])+'</span> — '+esc(pt[1])}));
    });
  }

  body.appendChild(h('h4',{text:'Correct answer'}));
  body.appendChild(h('div',{class:'fb-correct-ans mono', text:correctAnswerText(inst)}));

  if(!res.single){
    if(res.right.length){
      var ulR = h('ul');
      res.right.forEach(function(r){ ulR.appendChild(h('li',{html:'<b>'+esc(r.label)+'</b>'+(r.why?' — <span class="fb-why">'+esc(r.why)+'</span>':'')})); });
      body.appendChild(h('div',{class:'fb-part good'},[h('b',{text:'What you got right'}), ulR]));
    }
    if(res.wrong.length){
      var ulW = h('ul');
      res.wrong.forEach(function(r){ ulW.appendChild(h('li',{html:'<b>'+esc(r.label)+'</b> — <span class="fb-why">'+esc(r.why)+'</span>'})); });
      body.appendChild(h('div',{class:'fb-part badd'},[h('b',{text:'What you got wrong'}), ulW]));
    }
    if(res.missed.length){
      var ulM = h('ul');
      res.missed.forEach(function(r){ ulM.appendChild(h('li',{html:'<b>'+esc(r.label)+'</b> — <span class="fb-why">'+esc(r.why)+'</span>'})); });
      body.appendChild(h('div',{class:'fb-part miss'},[h('b',{text:'What you missed'}), ulM]));
    }
    if(pts>=1 && pts<100){
      body.appendChild(h('p',{class:'fb-tone', text:'Partial credit is intentional. In real cybersecurity work, getting some things right and some wrong is normal — this exam rewards the parts you got right.'}));
    }
  }

  var exBox = h('div',{class:'fb-explain'});
  (Array.isArray(inst.explain)?inst.explain:[inst.explain]).forEach(function(p){ exBox.appendChild(h('p',{text:p})); });
  body.appendChild(h('h4',{text:'Why'}));
  body.appendChild(exBox);

  if(inst.study && (pts<100)){
    body.appendChild(h('div',{class:'fb-study', html:'<b>What to study next:</b> '+esc(inst.study)}));
  }
  return h('section',{class:'feedback '+cls, 'aria-label':'Feedback'},[head, body]);
}

function renderExercise(){
  S.phase = 'exam';
  var app = $('#app'); app.innerHTML = '';
  var idx = S.order[S.pos];
  var inst = S.inst[idx];
  currentWidget = null;
  app.appendChild(buildHeader());
  updateHeader();

  app.appendChild(buildScenarioBlock(inst));

  /* QUESTION block */
  app.appendChild(h('section',{class:'block block-question','aria-label':'Question'},[
    h('div',{class:'bl-head'},[ h('span',{class:'bl-ic',text:'❓'}), h('span',{text:'Question'}) ]),
    h('div',{class:'bl-body'},[ h('div',{class:'q-text', text:inst.question}) ])
  ]));

  /* YOUR ANSWER block */
  var w;
  switch(inst.type){
    case 'qcm': w = wQCM(inst); break;
    case 'multi': w = wMULTI(inst); break;
    case 'match': w = wMATCH(inst); break;
    case 'order': w = wORDER(inst); break;
    case 'blank': w = wBLANK(inst); break;
    case 'lines': w = wLINES(inst); break;
    case 'triage': w = wTRIAGE(inst); break;
    case 'terminal': w = wTERMINAL(inst); break;
    case 'branch': w = wBRANCH(inst, {
      onPauseForStep: function(){ S.timer.auto = true; updateHeader(); },
      onResumeFromStep: function(){ S.timer.auto = false; updateHeader(); },
      onFinished: function(){ doCheck(); }
    }); break;
  }
  currentWidget = w;

  var ansBody = h('div',{class:'bl-body'});
  ansBody.appendChild(w.node);
  if(w.note) ansBody.appendChild(h('p',{class:'ansnote', text:w.note}));
  var hintBox = h('div',{id:'hintBox', class:'hidden'});
  ansBody.appendChild(hintBox);
  app.appendChild(h('section',{class:'block block-answer','aria-label':'Your answer'},[
    h('div',{class:'bl-head'},[ h('span',{class:'bl-ic',text:'✍'}), h('span',{text:'Your answer'}) ]),
    ansBody
  ]));

  var fbHolder = h('div',{id:'fbHolder'});
  app.appendChild(fbHolder);

  /* nav row */
  var err = h('div',{class:'formerr','aria-live':'assertive'});
  var checkBtn = h('button',{class:'btn-check', text:'Check', onclick:doCheck, 'aria-label':'Check your answer'});
  if(inst.type==='branch'){ checkBtn.classList.add('hidden'); }
  var nextBtn = h('button',{class:'btn-next hidden', text: S.pos===S.order.length-1 ? 'Finish exam' : 'Next exercise ▶', onclick:goNext});
  app.appendChild(h('div',{class:'navrow'},[ checkBtn, nextBtn, err ]));
  app.appendChild(h('div',{style:'height:40px'}));

  function doCheck(){
    var a = w.getUser();
    if(a===null){
      err.textContent = (inst.type==='terminal')
        ? 'Type a command in the terminal and press Enter first.'
        : 'Choose an answer first, then press Check.';
      return;
    }
    err.textContent = '';
    checkBtn.disabled = true;
    var res = w.grade(a);
    var pts = exercisePoints(idx, res);
    S.graded[idx] = { points:pts, status:(pts===100?'correct':(pts>=1?'partial':'wrong')), detail:res, hintUsed:!!S.hintUsed[idx] };
    var si = S.skipped.indexOf(idx);
    if(si!==-1) S.skipped.splice(si,1);
    S.timer.auto = true;               /* auto-pause on Check — feedback stays readable */
    updateHeader();
    fbHolder.innerHTML = '';
    fbHolder.appendChild(buildFeedbackBlock(idx, inst, res, pts));
    if(inst.type !== 'branch'){ w.node.style.pointerEvents = 'none'; }   /* lock the widget after grading */
    nextBtn.classList.remove('hidden');
    nextBtn.focus();
    fbHolder.scrollIntoView({behavior:'smooth', block:'start'});
  }
  function goNext(){
    S.timer.auto = false;              /* Next always resumes the timer */
    var idx = S.order[S.pos];
    if(!S.graded[idx] && S.skipped.indexOf(idx)===-1){
      /* moving past an exercise without answering behaves like Skip: it waits in the review pool */
      S.skipped.push(idx);
    }
    if(S.pos < S.order.length-1){ S.pos++; renderExercise(); window.scrollTo(0,0); }
    else {
      if(S.skipped.length && !S.timer.over){ renderReview(); }
      else { renderResults(''); }
    }
  }
}

/* ============================================================
   SKIP + REVIEW SKIPPED
   ============================================================ */
function onSkip(){
  if(S.phase!=='exam') return;
  var idx = S.order[S.pos];
  if(!S.graded[idx] && S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }   /* skipping is free; timer keeps running */
  if(S.pos < S.order.length-1){ S.pos++; renderExercise(); window.scrollTo(0,0); }
  else if(S.skipped.length && !S.timer.over){ renderReview(); }
  else { renderResults(''); }
}

function renderReview(){
  S.phase = 'review';
  var app = $('#app'); app.innerHTML = '';
  app.appendChild(buildHeader());
  var head = $('#xhead');
  head._hint.classList.add('hidden');            /* hint/skip do not apply to the review pool */
  head._skip.classList.add('hidden');
  head._counter.textContent = 'Review pool — ' + S.skipped.length + ' waiting';
  updateHeader();
  app.appendChild(h('div',{class:'hero'},[
    h('div',{class:'hero-kicker', text:'Before you finish'}),
    h('h1', {text:'⏳ Review skipped exercises'}),
    h('p',{class:'lead', text:'You skipped these. You can go back and answer them now, as many times as you need, while the timer runs. If you submit without answering them, they are excluded from the score — they count neither for you nor against you.'})
  ]));
  S.skipped.forEach(function(idx){
    var ex = D.exercises[idx];
    app.appendChild(h('div',{class:'rev-item'},[
      h('span',{class:'warnword', text:'⚠ skipped'}),
      h('div',{class:'rev-t'},[
        h('b',{text:ex.scenario && ex.scenario.summary ? ex.scenario.summary : ex.question}),
        h('span',{text:TYPE_LABELS[ex.type]||ex.type})
      ]),
      h('button',{class:'btn-ghost', text:'↩ Return to it', onclick:function(){
        S.pos = S.order.indexOf(idx);
        S.returned = true;             /* returning to a skipped exercise does NOT auto-pause */
        renderExercise(); window.scrollTo(0,0);
      }})
    ]));
  });
  app.appendChild(h('div',{class:'startrow'},[
    h('button',{class:'btn-primary', text:'⏹ Submit the exam now', onclick:function(){ renderResults(''); }}),
    h('span',{class:'note', text:'Submitting now excludes the skipped exercises above from your score.'})
  ]));
}

/* ============================================================
   RESULTS + REPORT + SITE REPORTING
   ============================================================ */
function themeStats(){
  var out = {};
  D.exercises.forEach(function(ex,i){
    var g = S.graded[i]; if(!g) return;
    var t = ex.theme;
    if(!out[t]) out[t] = {n:0, pts:0};
    out[t].n++; out[t].pts += g.points;
  });
  return out;
}

function renderResults(notice){
  S.phase = 'results';
  S.timer.running = false;
  var app = $('#app'); app.innerHTML = '';
  var t = scoreTotals();
  var pct = t.possible>0 ? Math.round(t.earned / t.possible * 100) : 0;
  var passed = pct >= D.passMark;

  /* per-exercise tallies */
  var nC=0,nP=0,nW=0;
  Object.keys(S.graded).forEach(function(k){
    var st = S.graded[k].status;
    if(st==='correct') nC++; else if(st==='partial') nP++; else nW++;
  });
  var nS = S.order.length - Object.keys(S.graded).length;   /* every unanswered exercise, skipped or passed over */

  document.title = D.keyword + ' — ' + D.severityLabel + ' practice exam';
  app.appendChild(h('div',{class:'res-hero'},[
    h('div',{class:'hero-kicker', text:D.keyword+' — '+D.severityLabel+' tier · results'}),
    h('h1',{text: passed ? 'Exam finished' : 'Exam finished — below the pass mark'})
  ]));

  if(notice) app.appendChild(h('div',{class:'card', html:'<b>⏱ '+esc(notice)+'</b>'}));

  var panel = h('div',{class: passed?'res-pass':'res-fail'},[
    h('h2',{text: passed ? '🏆 PASS — well done!' : '✗ FAIL — you must retake this exam'}),
    h('div',{class:'res-pct', text: '0%'}),
    h('div',{class:'progressbar','aria-hidden':'true'},[ h('div',{style:'width:0%'}) ]),
    h('p',{html:'<b>'+t.earned+'</b> points earned out of <b>'+t.possible+'</b> possible (over the '+t.answered+' exercises you answered). Pass mark: '+D.passMark+'%.'}),
    h('p',{class:'soft', text: passed
      ? 'Partial credit is included: '+nC+' fully correct, '+nP+' partially correct, '+nW+' incorrect.'
      : 'Partial credit is included: '+nC+' fully correct, '+nP+' partially correct, '+nW+' incorrect. Review the report below, study the pointers, then retake — the questions will be shuffled again.'}),
    (S.user ? h('p',{html:'Learner: <b>'+esc(S.user)+'</b>'}) : null)
  ]);
  app.appendChild(panel);

  var g1 = h('div',{class:'stat good'},[h('div',{class:'s-num',text:String(nC)}),h('div',{class:'s-lab',text:'✓ fully correct (100 pts)'})]);
  var g2 = h('div',{class:'stat part'},[h('div',{class:'s-num',text:String(nP)}),h('div',{class:'s-lab',text:'◐ partially correct (1–99 pts)'})]);
  var g3 = h('div',{class:'stat bad'},[h('div',{class:'s-num',text:String(nW)}),h('div',{class:'s-lab',text:'✗ incorrect (0 pts)'})]);
  var g4 = h('div',{class:'stat skip'},[h('div',{class:'s-num',text:String(nS)}),h('div',{class:'s-lab',text:'⚠ skipped — excluded'})]);
  app.appendChild(h('div',{class:'statgrid'},[g1,g2,g3,g4]));

  /* per-theme breakdown */
  var ts = themeStats();
  var tab = h('table',{class:'themetab'});
  tab.appendChild(h('tr',{},[h('th',{text:'Theme'}),h('th',{text:'Answered'}),h('th',{text:'Points earned'}),h('th',{text:'Points possible'})]));
  Object.keys(ts).forEach(function(k){
    var meta = null;
    D.themes.forEach(function(th){ if(th.key===k) meta = th.name; });
    tab.appendChild(h('tr',{},[
      h('td',{text:meta||k}), h('td',{text:String(ts[k].n)}), h('td',{text:String(ts[k].pts)}), h('td',{text:String(ts[k].n*100)})
    ]));
  });
  app.appendChild(h('div',{class:'card'},[ h('h2',{text:'📊 Per-theme breakdown'}), tab ]));

  /* detailed report */
  var rep = h('div',{class:'card'},[ h('h2',{text:'📝 Detailed report — every exercise'}) ]);
  S.order.forEach(function(idx,pos){
    var ex = D.exercises[idx];
    var g = S.graded[idx];
    var stCls, stTxt;
    if(!g){ stCls='s-skipped'; stTxt='⚠ Not answered — excluded'; }
    else if(g.status==='correct'){ stCls='s-correct'; stTxt='✓ Correct · 100'; }
    else if(g.status==='partial'){ stCls='s-partial'; stTxt='◐ Partial · '+g.points; }
    else { stCls='s-wrong'; stTxt='✗ Incorrect · 0'; }
    var body = h('div',{class:'ri-body hidden'});
    body.appendChild(h('div',{html:'<b>Correct answer:</b> <span class="mono-a">'+esc(correctAnswerText(D.exercises[idx]))+'</span>'}));
    (Array.isArray(ex.explain)?ex.explain:[ex.explain]).forEach(function(p){ body.appendChild(h('p',{text:p})); });
    if(g && g.detail){
      if(!g.detail.single && g.detail.wrong.length){
        var ulW=h('ul'); g.detail.wrong.forEach(function(r){ ulW.appendChild(h('li',{html:'<b>'+esc(r.label)+'</b> — <span class="fb-why">'+esc(r.why)+'</span>'})); });
        body.appendChild(h('div',{class:'fb-part badd'},[h('b',{text:'What you got wrong'}), ulW]));
      }
      if(!g.detail.single && g.detail.missed.length){
        var ulM=h('ul'); g.detail.missed.forEach(function(r){ ulM.appendChild(h('li',{html:'<b>'+esc(r.label)+'</b> — <span class="fb-why">'+esc(r.why)+'</span>'})); });
        body.appendChild(h('div',{class:'fb-part miss'},[h('b',{text:'What you missed'}), ulM]));
      }
      if(g.detail.extra && g.detail.extra.canonical){
        body.appendChild(h('div',{html:'<b>Canonical command:</b> <span class="mono-a">'+esc(g.detail.extra.canonical)+'</span>'}));
      }
    } else {
      body.appendChild(h('p',{class:'soft', text:'You skipped this exercise and never answered it. It was excluded from the score: it added no points to your total and nothing to the possible total.'}));
    }
    if(ex.study) body.appendChild(h('div',{class:'fb-study', html:'<b>What to study:</b> '+esc(ex.study)}));
    rep.appendChild(h('div',{class:'report-item'},[
      (function(){
        var headRow = h('div',{class:'ri-head', role:'button', tabindex:'0', 'aria-expanded':'false', 'aria-label':'Toggle details for exercise '+(pos+1)});
        headRow.appendChild(h('b',{text:(pos+1)+'. '+(ex.scenario && ex.scenario.summary ? ex.scenario.summary : ex.question)}));
        headRow.appendChild(h('span',{class:'ri-state '+stCls, text:stTxt}));
        function tog(){
          body.classList.toggle('hidden');
          headRow.setAttribute('aria-expanded', body.classList.contains('hidden')?'false':'true');
        }
        headRow.addEventListener('click', tog);
        headRow.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); tog(); } });
        return headRow;
      })(),
      body
    ]));
  });
  app.appendChild(rep);

  /* retake */
  app.appendChild(h('div',{class:'startrow'},[
    h('button',{class:'btn-primary', text:'🔁 Retake exam', onclick:retake, 'aria-label':'Retake the exam with reshuffled questions'}),
    h('span',{class:'note', text:'Retaking resets the timer, reshuffles questions and answers, and clears both pause states.'})
  ]));

  /* report score to the site — exactly once per attempt, after the number settles */
  var reduced = false;
  try{ reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduced){
    panel.querySelector('.res-pct').textContent = pct + '%';
    var bar = panel.querySelector('.progressbar > div'); if(bar) bar.style.width = pct + '%';
    reportScore(t.earned, t.possible, pct, passed);
  }
  else {
    var target = pct, cur = 0, step = Math.max(1, Math.ceil(target/28));
    var iv = setInterval(function(){
      cur = Math.min(target, cur+step);
      panel.querySelector('.res-pct').textContent = cur + '%';
      var bar = panel.querySelector('.progressbar > div'); if(bar) bar.style.width = cur + '%';
      if(cur>=target){ clearInterval(iv); reportScore(t.earned, t.possible, pct, passed); }
    }, 40);
  }
}

function reportScore(earned, possible, pct, passed){
  if(S.reported) return;               /* exactly once per attempt */
  S.reported = true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: D.topicId,
      batch: D.batch,
      score: Math.round(earned),
      total: Math.round(possible),
      percent: pct,
      passed: passed
    }, location.origin);
  }catch(e){ /* opened directly, not inside the site — nothing to report to */ }
}

function retake(){
  S.reported = false;
  startExam();
  window.scrollTo(0,0);
}

/* ============================================================
   SITE HANDSHAKE — optional, never required
   ============================================================ */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try{
    if(event.data.username) S.user = String(event.data.username).slice(0,60);
  }catch(e){}
});

/* boot */
renderIntro();

})();

</script>
</body>
</html>
