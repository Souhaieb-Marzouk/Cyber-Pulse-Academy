  intro: {
    keywordExplainer: [
      "In this practice exam you will learn about application allowlisting. Imagine you are the IT helper at a small clinic. Application allowlisting means the computer keeps a list of programs that may run. If a program is not on the list, the computer refuses to start it. This idea is called default-deny: everything is denied by default, and you allow only what you trust. The opposite idea is a blocklist, where every program runs until someone marks it as bad.",
      "Many jobs use allowlisting every day. Security operations centre (SOC) analysts watch the alerts it creates. Incident responders use it to stop an attacker from running their tools. Governance, risk and compliance (GRC) analysts check that the rule meets security standards. System engineers build and update the list. Service desk staff help users whose programs suddenly will not start. Red teamers — ethical hackers who test defences — also try to get past it, so the clinic can fix the weak points they find.",
      "You will meet the main tools. On Windows, AppLocker and WDAC (Windows Defender Application Control) decide which programs may run. On Mac computers, Gatekeeper checks apps before the first run. On Linux, fapolicyd does a similar job, and AppArmor limits what each program may do. Some organisations also buy a commercial agent that does the same work. In this exam you work for one fictional clinic, so every exercise uses the same setting.",
      "Allowlisting follows a simple process. First you make an inventory: a full list of the software the business really uses. Then you build the allowlist from that list. You run the control in audit mode first — audit mode only writes log events and blocks nothing. You read the logs, fix surprises, and only then switch to enforce mode, where real blocking starts. Users ask for special cases, and you record each approved special case in a document called the exception register.",
      "The daily work produces clear documents. The allowlist policy says which programs may run and why. The exception register records every special case and who approved it. Change tickets track each new program before it joins the list. When a user reports that a needed program will not start, the team opens a break-fix ticket: they check the block event, confirm the program is safe, and add it in a controlled way. They also monitor block events every day, because a wave of blocks can be the first sign of malware.",
      "Finally, you will learn which risks allowlisting reduces. It stops malware — harmful software — before it can run, even when antivirus does not know it yet. It also blocks unapproved software that staff download by mistake. One special danger is LOLBins: normal built-in tools, such as script and install helpers, that attackers abuse to run harmful code. Allowlisting does not remove every risk, but it removes the easiest one: letting unknown programs run."
    ],
    severityNote: "EASY here means one clear idea per exercise and short scenarios. Each question guides you to the detail you need, and each wrong option fails for a simple reason. If you understand the basic idea of allowlisting, you can answer every exercise."
  },

            { kind: "note", body: "She asks: 'Is my computer broken?'" }
          ],
          question: "What has the allowlist just done when she double-clicked the installer?",
          options: [
            { t: "It deleted the installer file from the disk", correct: false,
              outcome: "If that were true, the file would now be gone. Allowlisting does not delete files; it only decides whether a program may start.",
              why: "Execution control is not file removal." },
            { t: "It blocked the installer and wrote a log event", correct: true,
              outcome: "The allowlist refused to start the unapproved installer and recorded a block event in the AppLocker log. Nothing else happened to her computer.",
              why: "Default-deny: not on the list means no start, plus an event for the record." },
            { t: "It let the installer run but showed a warning first", correct: false,
              outcome: "The installer would now be running, which is exactly what allowlisting refuses to allow.",
              why: "There is no warn-and-continue mode for an unapproved program." }
          ]
        },
        {
          label: "STEP 2 OF 2",
          scenario: [
            { kind: "text", body: "You sit with reception01. The installer is not approved, and no ticket exists for it yet. She wants the program today." }
          ],
          question: "What is your first simple step?",
          options: [
            { t: "Check the block event and tell her to request approval", correct: true,
              outcome: "You read the block event to confirm the file, then open a change request so the right owner can approve or refuse the program. She gets a clear answer either way.",
              why: "The event confirms the block, and the request follows the normal exception process." },
            { t: "Turn off the allowlist for the whole clinic", correct: false,
              outcome: "Every workstation would lose its protection because one installer was blocked. This is never a first step.",
              why: "You never remove a control for everyone to fix one user's wish." },
            { t: "Tell her to email the installer to every colleague", correct: false,
              outcome: "Spreading an unknown file helps nobody and may spread something harmful.",
              why: "Unknown files must be reviewed, not shared." }
          ]
        }
      ]
    },

    /* e15 — terminal (graded multi, 3 elements) — Technologies & Rule Types */
    {
      id: "e15", theme: "Technologies & Rule Types", widget: "terminal",
      summary: "Show the active AppLocker policy as XML",
      scenario: [
        { kind: "text", body: "You sit at workstation MB-WIN11-04. Your goal: show the allowlist policy that is active on this computer, as XML, so you can read the rule collection and its mode." }
      ],
      question: "Type the command that shows the active AppLocker policy on this computer, as XML.",
      hint: "The tool is Get-AppLockerPolicy. Add the option for the policy that is active right now, then the option for XML output.",
      explanation: [
        "Get-AppLockerPolicy -Effective -Xml is the read-only command for this job. -Effective selects the policy that is active on this computer right now, and -Xml prints it as XML text that you can read and keep as evidence.",
        "The output shows EnforcementMode=\"Audit\", which means MB-WIN11-04 is still in logging mode, and a publisher rule that allows the CareTrack Systems signed software. A command like Set-AppLockerPolicy would change the policy instead of reading it — reading is safe, changing needs a change ticket."
      ],
      study: "Get-AppLockerPolicy and rule collections",
      prompt: "PS C:\\>",
      termTitle: "MB-WIN11-04 — PowerShell",
      banner: "Meadowbrook Family Clinic — workstation MB-WIN11-04\nPowerShell 5.1 — simulation only",
      support: "syntax",
      syntaxPanel: {
        shape: "Get-AppLockerPolicy <-Effective> <-Xml>",
        parts: [
          "Get-AppLockerPolicy = reads an AppLocker policy",
          "-Effective = the policy that is active on this computer right now",
          "-Xml = print the policy as XML text"
        ],
        example: "Get-AppLockerPolicy -Effective -InformationType Summary   (run on a different host, MB-WIN11-09)"
      },
      expectedShape: "<AppLockerPolicy Version=\"1\">\n  <RuleCollection Type=\"Exe\" EnforcementMode=\"Audit\">",
      elements: ["get-applockerpolicy", "-effective", "-xml"],
      wrongTokens: ["-path"],
      destructive: ["set-applockerpolicy", "new-applockerpolicy", "remove-applockerpolicy"],
      badOutputs: [
        { when: ["set-applockerpolicy"],
          text: "Set-AppLockerPolicy : The local AppLocker policy has been modified.\nThis was a simulation. On a real computer this command would rewrite the policy." },
        { when: ["new-applockerpolicy"],
          text: "New-AppLockerPolicy writes a new policy file from the rules you give it.\nThis was a simulation. It does not read the policy on this computer, so it cannot answer the question — and writing files you do not need during an incident is exactly what to avoid." },
        { when: ["remove-applockerpolicy"],
          text: "Remove-AppLockerPolicy is not a real AppLocker command.\nThis was a simulation. On a real computer there is no remove cmdlet — protection gets stripped with Set-AppLockerPolicy, which is why every policy change needs a change ticket." }
      ],
      outputs: [
        { when: ["get-applockerpolicy"],
          text: "<AppLockerPolicy Version=\"1\">\n  <RuleCollection Type=\"Exe\" EnforcementMode=\"Audit\">\n    <PublisherRule Action=\"Allow\" UserOrGroupSid=\"S-1-1-0\" Name=\"CareTrack Systems: signed software\">\n      <Conditions>\n        <PublisherCondition PublisherName=\"O=CareTrack Systems, C=US\" ProductName=\"*\" BinaryName=\"*\" LowSection=\"*\" HighSection=\"*\" />\n      </Conditions>\n    </PublisherRule>\n    <FilePathRule Action=\"Allow\" UserOrGroupSid=\"S-1-1-0\" Name=\"%WINDIR%\\*\" />\n  </RuleCollection>\n</AppLockerPolicy>" }
      ],
      canonical: {
        cmd: "Get-AppLockerPolicy -Effective -Xml",
        parts: [
          { p: "Get-AppLockerPolicy", d: "reads an AppLocker policy" },
          { p: "-Effective", d: "the policy active on this computer right now" },
          { p: "-Xml", d: "prints the policy as XML text" }
        ],
        danger: "Set-AppLockerPolicy would overwrite the policy on this computer instead of reading it. Reading a policy is safe; changing one needs a change ticket."
      }
    },

    /* e16 — sort (6 items, 2 buckets) — Trust & Core Concepts */
    {
      id: "e16", theme: "Trust & Core Concepts", widget: "sort",
      summary: "Good and poor allowlist candidates",
      scenario: [
        { kind: "text", body: "The engineer prepares the next version of the workstation allowlist. Six candidate programs sit in her review folder, each with a short note from the requester." }
      ],
      question: "Sort each candidate program into the correct bucket.",
      hint: "Good candidates are signed, stable, and approved. Ask what happens to the file when it updates itself.",
      explanation: [
        "A good candidate is signed, stable, and approved: the daily vendor app, the exact accounting file that a hash rule can pin, and the app with written owner approval all qualify.",
        "The other three fail for clear reasons. The game has no approval, the self-rewriting tool changes its bytes on every launch — hash churn, which breaks hash rules — and the USB file has an unknown origin."
      ],
      study: "Hash churn after updates",
      buckets: [
        {
          name: "Good allowlist candidate",
          items: [
            { t: "Signed vendor app the whole clinic uses daily", why: "Signed, approved, and used daily — the classic good candidate." },
            { t: "One exact file version that accounting depends on", why: "A hash rule can pin that exact file, so it is easy to allow." },
            { t: "App with written approval from the business owner", why: "A business owner has signed off, so the program has a purpose." }
          ]
        },
        {
          name: "Poor candidate",
          items: [
            { t: "Game downloaded at home and copied to the workstation", why: "No approval, no business purpose, and unknown files travel with games." },
            { t: "Tool that rewrites itself on every launch", why: "Its bytes change each run, so hash churn makes a hash rule useless." },
            { t: "Unknown exe from a USB stick found in the car park", why: "Unknown origin, unsigned, and no approval — default-deny keeps it out." }
          ]
        }
      ]
    }
  ]
};

</script>
<script>
/* ============================================================
   Application Allowlisting — certification exam engine
   Vanilla JS, fully self-contained. Renders every screen from
   window.EXAM_DATA. No external requests of any kind.
   ============================================================ */
(function () {
  'use strict';

  var DATA = window.EXAM_DATA;
  var CFG = DATA.config;
  var EXS = DATA.exercises;
  var BYID = {};
  EXS.forEach(function (e) { BYID[e.id] = e; });

  /* ---------------- tiny helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtT(s) { s = Math.max(0, s | 0); var m = (s / 60) | 0, r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function para(t) { return '<p>' + esc(t) + '</p>'; }

  /* single syntax-highlight renderer for logs, code and commands */
  var HL_RE = /(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b)|(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)|(\b(?:ALLOWED|BLOCKED|DENIED|AUDIT|AUDITED|ENFORCED|ENFORCE|FAILED|PASSED|ERROR|WARNING|Signed|Unsigned|Blocked|Allowed|Denied|blocked|allowed)\b)|(\b[0-9a-fA-F]{16,64}\b)|(\b(?:EventID|Event ID|RuleCollection|RuleCollectionType|EnforcementMode|Hash|Publisher|Path|LogName|Id|Condition|Action|User|SID|FileHash|FilePath|Name|Version|Binary|ParentProcess|ProcessGuid)\b)/g;
  function hl(line) {
    var s = esc(line);
    return s.replace(HL_RE, function (m, ts, ip, str, kw, hash, key) {
      if (ts) return '<span class="h-ts">' + ts + '</span>';
      if (ip) return '<span class="h-ip">' + ip + '</span>';
      if (str) return '<span class="h-str">' + str + '</span>';
      if (kw) return '<span class="h-kw">' + kw + '</span>';
      if (hash) return '<span class="h-hash">' + hash + '</span>';
      return '<span class="h-kw">' + key + '</span>';
    });
  }
  function monoBlock(text) {
    return '<div class="mono">' + String(text).split('\n').map(hl).join('\n') + '</div>';
  }

  /* small inline icons (no external assets, no colour-only signals) */
  var ICO = {
    shield: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1l6 2v4.2C14 11.3 11.4 14 8 15 4.6 14 2 11.3 2 7.2V3l6-2z"/></svg>',
    target: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>',
    q: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5.8 5.4c0-1.5 1-2.4 2.3-2.4 1.3 0 2.2.9 2.2 2.1 0 1-.5 1.5-1.3 2.1-.9.6-1.2 1.1-1.2 2v.4H6.2v-.6c0-1.2.5-1.8 1.4-2.4.7-.5 1-.9 1-1.5 0-.6-.4-1-1-1s-1 .4-1 1.1v.2H5.8zM7 11h1.7v1.8H7z"/></svg>',
    edit: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 14l3.2-1 8-8-2.2-2.2-8 8L2 14zM12 1.8L14.2 4l1-1c.4-.4.4-1 0-1.4L14.4.8c-.4-.4-1-.4-1.4 0l-1 1z"/></svg>',
    book: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2.5C3.5 1.8 5.5 1.8 8 3c2.5-1.2 4.5-1.2 6-.5v9.6c-1.5-.7-3.5-.7-6 .5-2.5-1.2-4.5-1.2-6-.5V2.5zM8 4.4v7.2"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2.5 8.5l3.6 3.6L13.5 4.7"/></svg>',
    clock: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></svg>',
    skip: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3l6 5-6 5V3zM9 3l6 5-6 5V3z"/></svg>',
    bulb: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a5 5 0 00-2.8 9.2c.5.4.8 1 .8 1.6V12h4v-.2c0-.6.3-1.2.8-1.6A5 5 0 008 1zM6 13h4v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-1z"/></svg>'
  };

  /* ---------------- state ---------------- */
  var S = {
    phase: 'intro',
    seq: [], cur: 0,
    ans: {},
    skipList: [],
    timer: { left: CFG.timerMinutes * 60, running: false, man: false, auto: false },
    flowStep: 0,
    reported: false,
    init: null,
    timeUp: false
  };
  function rec(id) {
    if (!S.ans[id]) S.ans[id] = { checked: false, hintUsed: false, pts: 0, raw: null, flow: null };
    return S.ans[id];
  }
  function curEx() { return EXS[S.seq[S.cur]]; }

  function sevClass() { return ({ EASY: 'easy', MEDIUM: 'medium', HARD: 'hard', EXTREMELY_HARD: 'extremely-hard' })[CFG.severity] || 'easy'; }
  function sevLabel() { return CFG.severity === 'EXTREMELY_HARD' ? 'EXTREMELY HARD' : CFG.severity; }

  /* ---------------- screens ---------------- */
  function show(id) {
    ['scr-intro', 'scr-exam', 'scr-review', 'scr-results'].forEach(function (s) { $('#' + s).hidden = (s !== id); });
    $('#hdr').hidden = !(id === 'scr-exam' || id === 'scr-review');
    window.scrollTo(0, 0);
  }

  /* ---------------- timer (single state object, two pause flags) ---------------- */
  setInterval(function () {
    var t = S.timer;
    if (t.running && !t.man && !t.auto && (S.phase === 'exam' || S.phase === 'review')) {
      t.left--;
      if (t.left <= 0) { t.left = 0; renderTimer(); onTimeUp(); return; }
      renderTimer();
    }
  }, 1000);
  function renderTimer() { $('#h-time').textContent = fmtT(S.timer.left); setTimerMode(); }
  function setTimerMode() {
    var m = $('#h-tmode'), t = S.timer;
    if (!t.running) { m.textContent = '■ stopped'; m.className = 't-mode'; return; }
    if (t.man) { m.textContent = '⏸ paused by you'; m.className = 't-mode man'; }
    else if (t.auto) { m.textContent = '⏸ paused — review your feedback'; m.className = 't-mode auto'; }
    else { m.textContent = '▶ running'; m.className = 't-mode run'; }
  }
  function pauseManual() {
    if (S.phase !== 'exam' && S.phase !== 'review') return;
    S.timer.man = true;
    $('#pauseov').hidden = false;
    setTimerMode();
  }
  function resumeManual() {
    S.timer.man = false;
    $('#pauseov').hidden = true;
    setTimerMode();
  }
  function onTimeUp() {
    S.timer.running = false;
    S.timeUp = true;
    setTimerMode();
    if (S.phase === 'exam' || S.phase === 'review') finish();
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    $('#intro-badge').className = 'badge ' + sevClass();
    $('#intro-badge').innerHTML = ICO.shield + ' ' + esc(sevLabel());
    var w = $('#intro-welcome');
    w.textContent = 'A self-contained practice certification exam. Read the explanation below, then press Start when you are ready.';
    var facts = [
      ['Exercises', String(CFG.questionCount)],
      ['Timer', CFG.timerMinutes + ' minutes'],
      ['Pass mark', CFG.passMark + '%'],
      ['Points each', '100'],
      ['Severity', sevLabel()]
    ];
    $('#intro-facts').innerHTML = facts.map(function (f) {
      return '<div class="fact"><div class="f-k">' + esc(f[0]) + '</div><div class="f-v">' + esc(f[1]) + '</div></div>';
    }).join('');
    $('#intro-themes').innerHTML = DATA.themes.map(function (t) {
      return '<div class="theme-group"><div class="theme-name">' + esc(t.name) + '</div><div class="chips">' +
        t.concepts.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div></div>';
    }).join('');
    $('#intro-kw').innerHTML = DATA.intro.keywordExplainer.map(para).join('');
    var TYPE_DESC = {
      mcq: 'Multiple choice — pick your answer from the options. Some questions ask for one answer, some for several.',
      blank: 'Fill in the blank — choose the missing term for every dropdown inside the sentence.',
      match: 'Matching — choose the correct partner for every item on the left.',
      order: 'Ordering — drag the items or use the arrow buttons to put them in the right order.',
      sort: 'Sorting — move every item into its correct bucket.',
      terminal: 'Terminal — type a command in a simulated shell and press Enter. Nothing real is executed.',
      flow: 'Step-by-step scenario — choose one option per step and read what happens next.'
    };
    var usedTypes = [];
    EXS.forEach(function (ex) { if (usedTypes.indexOf(ex.widget) === -1) usedTypes.push(ex.widget); });
    $('#intro-types').innerHTML = '<ul class="type-list">' + usedTypes.map(function (w) {
      return '<li>' + esc(TYPE_DESC[w] || w) + '</li>';
    }).join('') + '</ul>';
    var min = CFG.timerMinutes;
    $('#intro-score').innerHTML =
      para('Every exercise is worth 100 points.') +
      para('Some exercises have more than one correct answer. You earn points for every correct part you find. Where wrong options can be picked, one wrong pick cancels one correct part. Your points never go below zero.') +
      para('Example: an exercise has 4 correct parts. You find 3 of them and pick nothing wrong — you earn 75 of 100 points.') +
      para('The live score at the top counts only the exercises you have answered so far.') +
      para('You pass with ' + CFG.passMark + '% or more. The percentage is calculated only over the exercises you actually answered. Skipped exercises that you never answer are left out completely — they add no points and they take none.');
    $('#intro-timer').innerHTML =
      para('You have ' + min + ' minutes for the whole exam. The timer at the top shows the time you have left.') +
      para('Two different things can stop the timer. (1) The Pause button — press it to take a break. The exercise is hidden while you rest, so you cannot read it. Press Resume when you are ready. (2) The Check button — the moment you press Check to see your result, the timer stops, so you can read the explanation with no time pressure. Everything stays readable during this pause.') +
      para('The timer starts again the moment you press Next.');
    $('#intro-skip').innerHTML =
      para('Every exercise has a Skip button. Skipping is free, and it does not stop the timer.') +
      para('At the end of the exam you will see a review screen listing every skipped exercise. You can go back to them and answer them as many times as you like, as long as time is left.') +
      para('A skipped exercise that you never answer is simply excluded from your score: it adds no points, and it does not count against you.');
    $('#intro-hint').innerHTML =
      para('Every exercise has one hint. A hint lowers the top score of that exercise from 100 to 90 points (−10%). It is applied after your answer is graded, so partial credit still works.') +
      para('The hint gives you a small push in the right direction — it never tells you the answer. Using a hint does not stop the timer.');
    $('#intro-sev').innerHTML = '<div class="intro-note"><b>' + esc(sevLabel()) + ' means:</b></div>' + DATA.intro.severityNote.split('\n').map(para).join('');
    show('scr-intro');
  }

  function startExam() {
    S.seq = shuffle(EXS.map(function (_, i) { return i; }));
    S.cur = 0; S.ans = {}; S.skipList = []; S.flowStep = 0;
    S.reported = false; S.timeUp = false;
    S.timer.left = CFG.timerMinutes * 60;
    S.timer.running = true; S.timer.man = false; S.timer.auto = false;
    stopExTimer();
    S.phase = 'exam';
    show('scr-exam');
    renderTimer(); renderExercise();
  }

  /* ---------------- header ---------------- */
  function updateHeader() {
    $('#h-count').textContent = 'Exercise ' + (S.cur + 1) + ' of ' + S.seq.length;
    var b = $('#h-badge');
    b.className = 'badge ' + sevClass();
    b.innerHTML = ICO.shield + ' ' + esc(sevLabel());
    updateScore();
  }
  function updateScore() {
    var earned = 0, poss = 0;
    EXS.forEach(function (ex) { var r = S.ans[ex.id]; if (r && r.checked) { earned += r.pts; poss += 100; } });
    $('#h-score').textContent = 'SCORE ' + earned + '/' + poss;
  }
  /* ---------------- exercise rendering ---------------- */
  function exTypeT(ex) {
    switch (ex.widget) {
      case 'mcq': return ex.options.filter(function (o) { return o.correct; }).length;
      case 'blank': return ex.segments.filter(function (s) { return typeof s !== 'string'; }).length;
      case 'match': return ex.left.length;
      case 'order': return ex.items.length;
      case 'sort': return ex.buckets.reduce(function (a, b) { return a + b.items.length; }, 0);
      case 'terminal': return ex.elements.length;
      case 'flow': return ex.steps.length;
    }
    return 1;
  }
  function multiNoteText(ex) {
    switch (ex.widget) {
      case 'mcq': return 'Select all that apply';
      case 'blank': return 'Fill every blank';
      case 'match': return 'Match every item';
      case 'order': return 'Put every item in the right place';
      case 'sort': return 'Place every item into a bucket';
      case 'terminal': return 'Every required part of the command counts';
      case 'flow': return 'One choice per step';
    }
    return '';
  }

  function renderBlocks(blocks) {
    return blocks.map(function (b) {
      if (b.kind === 'text') return '<p>' + esc(b.body) + '</p>';
      if (b.kind === 'note') return '<div class="note">' + esc(b.body) + '</div>';
      if (b.kind === 'artefact') {
        var inner = b.mono ? monoBlock(b.body) : b.body.split('\n').map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('');
        return '<div class="artefact"><span class="artefact-label">' + esc(b.label) + '</span><div class="artefact-body">' + inner + '</div></div>';
      }
      if (b.kind === 'logview') return logviewHTML(b);
      return '<p>' + esc(b.body || '') + '</p>';
    }).join('');
  }
  function logviewHTML(b) {
    var lines = b.lines.map(function (l) { return '<div class="lv-line">' + hl(l) + '</div>'; }).join('');
    return '<div class="artefact" data-total="' + b.lines.length + '"><span class="artefact-label">' + esc(b.label) + '</span>' +
      '<div class="artefact-body"><div class="logview-tools">' +
      '<input class="lv-filter" type="text" placeholder="Filter lines (try: 8004, BLOCKED, a hostname)" aria-label="Filter log lines">' +
      '<span class="lv-count">' + b.lines.length + ' lines</span></div>' +
      '<div class="mono loglines">' + lines + '</div></div></div>';
  }

  function renderExercise() {
    var ex = curEx(), r = rec(ex.id);
    S.flowStep = ex.widget === 'flow' ? Math.min(S.flowStep, ex.steps.length - 1) : 0;
    var step = ex.widget === 'flow' ? ex.steps[S.flowStep] : null;
    $('#fb').hidden = true; $('#fb').innerHTML = ''; $('#fb').className = 'fb';
    $('#warnline').textContent = '';
    $('#btn-check').disabled = false; $('#btn-check').hidden = false;
    $('#btn-next').hidden = true; $('#btn-next').textContent = 'Next exercise →';
    $('#btn-skip').disabled = false;

    var scn = $('#blk-scn');
    scn.classList.remove('collapsed');
    $('#scn-step').hidden = !step;
    if (step) $('#scn-step').textContent = step.label;
    $('#scn-toggle').hidden = !ex.collapsible;
    $('#scn-summary').hidden = !ex.collapsible;
    if (ex.collapsible) $('#scn-summary').textContent = ex.summary;
    $('#scn-body').innerHTML = renderBlocks(step ? step.scenario : ex.scenario);

    $('#q-text').textContent = step ? step.question : ex.question;

    var hp = $('#hint-panel');
    if (r.hintUsed) { hp.hidden = false; hp.innerHTML = '<div class="hp-h">HINT (−10% on this exercise)</div>' + esc(ex.hint); }
    else hp.hidden = true;
    var hb = $('#btn-hint');
    hb.disabled = r.hintUsed || r.checked;
    hb.textContent = r.hintUsed ? 'Hint used' : 'Hint −10%';

    var host = $('#anshost');

    /* Already-answered exercises reached through review navigation render
       read-only instead of a fresh (unresponsive) copy of the widget. */
    if (r.checked) { renderReviewMode(ex, r); return; }

    var T = exTypeT(ex);
    var mn = $('#multi-note');
    mn.hidden = !(T > 1);
    mn.textContent = multiNoteText(ex);

    host.innerHTML = '';
    WIDGETS[ex.widget](ex, host, r);
    startExTimer(ex);
    updateHeader();
  }

  function renderReviewMode(ex, r) {

  /* ---------------- per-exercise reduced timer (used sparingly) ---------------- */

  /* ---------------- widgets ---------------- */
  var WIDGETS = {};

  WIDGETS.mcq = function (ex, host, r) {
    var multi = exTypeT(ex) > 1;
    var letters = 'ABCDEFGHIJKL';
    var items = shuffle(ex.options.map(function (o, i) { return { o: o, oi: i }; }));
    var sel = {};
    var box = el('div', 'opts');
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', 'Answer options');
    items.forEach(function (p, k) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.setAttribute('role', multi ? 'checkbox' : 'radio');
      b.setAttribute('aria-checked', 'false');
      b.innerHTML = '<span class="opt-k">' + letters[k] + '.</span><span class="opt-t">' + esc(p.o.t) + '</span><span class="opt-mark" aria-hidden="true"></span>';
      b.addEventListener('click', function () {
        if (r.checked) return;
        if (!multi) {
          sel = {};
          $all('.opt', box).forEach(function (x) { x.setAttribute('aria-checked', 'false'); x.classList.remove('sel'); });
        }
        if (sel[p.oi]) { delete sel[p.oi]; b.setAttribute('aria-checked', 'false'); b.classList.remove('sel'); }
        else { sel[p.oi] = true; b.setAttribute('aria-checked', 'true'); b.classList.add('sel'); }
      });
      box.appendChild(b);
      p.btn = b;
    });
    host.appendChild(box);
    host._grade = function () {
      var picked = Object.keys(sel).map(Number);
      if (!picked.length) return null;
      var g = { T: 0, C: 0, W: 0, right: [], wrong: [], missed: [], picked: [] };
      ex.options.forEach(function (o) { if (o.correct) g.T++; });
      picked.forEach(function (i) {
        var o = ex.options[i];
        g.picked.push(o.t);
        if (o.correct) { g.C++; g.right.push({ label: o.t, why: o.why }); }
        else { g.W++; g.wrong.push({ label: o.t, why: o.why }); }
      });
      ex.options.forEach(function (o) {
        if (o.correct && !sel[ex.options.indexOf(o)]) g.missed.push({ label: o.t, why: o.why });
      });
      g.apply = function () {
        items.forEach(function (p) {
          var b = p.btn; b.disabled = true;
          var o = p.o, chosen = !!sel[p.oi];
          if (o.correct && chosen) { b.classList.add('right'); $('.opt-mark', b).textContent = '✓'; }
          else if (!o.correct && chosen) { b.classList.add('wrong'); $('.opt-mark', b).textContent = '✗'; }
          else if (o.correct && !chosen) { b.classList.add('missed'); $('.opt-mark', b).textContent = '○'; }
        });
      };
      g.yourHTML = '<ul>' + (g.picked.length ? g.picked.map(function (t) { return '<li>' + esc(trunc(t, 100)) + '</li>'; }).join('') : '<li>Nothing selected</li>') + '</ul>';
      g.correctHTML = '<ul>' + ex.options.filter(function (o) { return o.correct; }).map(function (o) { return '<li>' + esc(o.t) + '</li>'; }).join('') + '</ul>';
      return g;
    };
  };

      g.correctHTML = '<ul>' + ex.left.map(function (L) { return '<li>' + esc(trunc(L.t, 60)) + ' → ' + esc(ex.right[L.m].t) + '</li>'; }).join('') + '</ul>';

  WIDGETS.order = function (ex, host, r) {
    var items = shuffle(ex.items.map(function (it, i) { return { t: it.t, why: it.why, ci: i }; }));
    var dragPos = null;
    var listEl = el('div', 'ordlist');
    listEl.setAttribute('aria-label', 'Ordering — use the arrow buttons or drag');
    function draw() {
      listEl.innerHTML = '';
      items.forEach(function (it, pos) {
        var row = el('div', 'ordrow');
        row.draggable = true;
        row.innerHTML = '<span class="drag-handle" aria-hidden="true">↕</span><span class="ord-pos">' + (pos + 1) + '</span>' +
          '<span class="ord-txt">' + esc(it.t) + '</span>' +
          '<span class="ord-btns"><button type="button" class="up" aria-label="Move item ' + (pos + 1) + ' up">↑</button>' +
          '<button type="button" class="down" aria-label="Move item ' + (pos + 1) + ' down">↓</button></span>';
        $('.up', row).addEventListener('click', function () {
          if (pos > 0) { var t = items[pos - 1]; items[pos - 1] = items[pos]; items[pos] = t; draw(); }
        });
        $('.down', row).addEventListener('click', function () {
          if (pos < items.length - 1) { var t = items[pos + 1]; items[pos + 1] = items[pos]; items[pos] = t; draw(); }
        });
        row.addEventListener('dragstart', function (ev) { dragPos = pos; try { ev.dataTransfer.setData('text/plain', String(pos)); } catch (e) { } });
        row.addEventListener('dragover', function (ev) { ev.preventDefault(); row.classList.add('dragover'); });
        row.addEventListener('dragleave', function () { row.classList.remove('dragover'); });
        row.addEventListener('drop', function (ev) {
          ev.preventDefault();
          if (dragPos == null || dragPos === pos) { dragPos = null; return; }
          var moved = items.splice(dragPos, 1)[0];
          items.splice(pos, 0, moved);
          dragPos = null;
          draw();
        });
        listEl.appendChild(row);
      });
    }
    draw();
    host.appendChild(listEl);
    host._grade = function () {
      var g = { T: items.length, C: 0, W: 0, right: [], wrong: [], missed: [] };
      items.forEach(function (it, pos) {
        if (it.ci === pos) { g.C++; g.right.push({ label: (pos + 1) + '. ' + it.t, why: it.why }); }
        else g.missed.push({ label: it.t + ' — correct place: ' + (it.ci + 1) + ', your place: ' + (pos + 1), why: it.why });
      });
      g.apply = function () {
        $all('.ordrow', listEl).forEach(function (row, pos) {
          row.classList.add(items[pos].ci === pos ? 'right' : 'wrong');
          $all('button', row).forEach(function (b) { b.disabled = true; });
          row.draggable = false;
        });
      };
      g.yourHTML = '<ol>' + items.map(function (it) { return '<li>' + esc(it.t) + '</li>'; }).join('') + '</ol>';
      g.correctHTML = '<ol>' + ex.items.map(function (it) { return '<li>' + esc(it.t) + '</li>'; }).join('') + '</ol>';
      return g;
    };
  };

  WIDGETS.sort = function (ex, host, r) {
    var flat = [];
    ex.buckets.forEach(function (bk, bi) {
      bk.items.forEach(function (it) { flat.push({ t: it.t, why: it.why, bi: bi, bn: bk.name }); });
    });
    var chips = shuffle(flat.map(function (f, i) { return { f: f, key: 'c' + i, where: -1 }; }));
    var sel = null, dragKey = null, frozen = false;
    var bankEl = el('div', 'sortbank');
    var buckEl = el('div', 'sortbuckets');
    ex.buckets.forEach(function (bk, bi) {
      var b = el('div', 'bucket');
      b.dataset.bi = bi;
      b.innerHTML = '<h4>' + esc(bk.name) + '</h4><div class="bucket-items"></div>';
      buckEl.appendChild(b);
    });
    host.appendChild(el('p', 'sort-hint', 'Drag each item into a bucket — or click an item, then click a bucket. Click an item again to deselect.'));
    host.appendChild(bankEl);
    host.appendChild(buckEl);
    function draw() {
      bankEl.innerHTML = '';
      $all('.bucket-items', buckEl).forEach(function (x) { x.innerHTML = ''; });
      chips.forEach(function (c) {
        var ch = el('button', 'sortchip');
        ch.type = 'button';
        ch.textContent = c.f.t;
        ch.draggable = true;
        ch.dataset.key = c.key;
        ch.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (frozen) return;
          if (sel === c.key) { sel = null; ch.classList.remove('sel'); }
          else { sel = c.key; $all('.sortchip').forEach(function (x) { x.classList.remove('sel'); }); ch.classList.add('sel'); }
        });
        ch.addEventListener('dragstart', function (ev) { dragKey = c.key; try { ev.dataTransfer.setData('text/plain', c.key); } catch (e) { } });
        var parent = c.where === -1 ? bankEl : $('.bucket[data-bi="' + c.where + '"] .bucket-items', buckEl);
        parent.appendChild(ch);
      });
    }
    bankEl.addEventListener('click', function () {
      if (frozen || !sel) return;
      var c = chips.filter(function (x) { return x.key === sel; })[0];
      if (c) { c.where = -1; sel = null; draw(); }
    });
    bankEl.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    bankEl.addEventListener('drop', function (ev) {
      ev.preventDefault();
      var c = chips.filter(function (x) { return x.key === dragKey; })[0];
      if (c && !frozen) { c.where = -1; draw(); }
      dragKey = null;
    });
    $all('.bucket', buckEl).forEach(function (bk) {
      bk.addEventListener('click', function () {
        if (frozen || !sel) return;
        var c = chips.filter(function (x) { return x.key === sel; })[0];
        if (c) { c.where = Number(bk.dataset.bi); sel = null; draw(); }
      });
      bk.addEventListener('dragover', function (ev) { ev.preventDefault(); bk.classList.add('dragover'); });
      bk.addEventListener('dragleave', function () { bk.classList.remove('dragover'); });
      bk.addEventListener('drop', function (ev) {
        ev.preventDefault();
        bk.classList.remove('dragover');
        var c = chips.filter(function (x) { return x.key === dragKey; })[0];
        if (c && !frozen) { c.where = Number(bk.dataset.bi); draw(); }
        dragKey = null;
      });
    });
    draw();
    host._grade = function () {
      var unplaced = chips.some(function (c) { return c.where === -1; });
      if (unplaced) { warn('Place every item into a bucket first — or press Skip if you want to come back later.'); return null; }
      var g = { T: chips.length, C: 0, W: 0, right: [], wrong: [], missed: [] };
      chips.forEach(function (c) {
        if (c.where === c.f.bi) { g.C++; g.right.push({ label: c.f.t + ' → ' + c.f.bn, why: c.f.why }); }
        else g.missed.push({ label: c.f.t + ' → belongs in “' + c.f.bn + '” (you placed it in “' + ex.buckets[c.where].name + '”)', why: c.f.why });
      });
      g.apply = function () {
        frozen = true;
        chips.forEach(function (c) {
          var ch = $('.sortchip[data-key="' + c.key + '"]');
          if (!ch) return;
          ch.disabled = true;
          ch.classList.add(c.where === c.f.bi ? 'right' : 'wrong');
        });
      };
      g.yourHTML = '<ul>' + chips.map(function (c) { return '<li>' + esc(trunc(c.f.t, 80)) + ' → ' + esc(ex.buckets[c.where].name) + '</li>'; }).join('') + '</ul>';
      g.correctHTML = ex.buckets.map(function (bk) { return '<p><b>' + esc(bk.name) + ':</b> ' + esc(bk.items.map(function (i) { return i.t; }).join('; ')) + '</p>'; }).join('');
      return g;
    };
  };
  WIDGETS.terminal = function (ex, host, r) {
    var t = el('div', 'term');
    t.innerHTML = '<div class="term-bar"><span class="term-dot" aria-hidden="true"></span> ' +
      esc(ex.termTitle || 'simulated shell') + ' — simulation only, nothing real is executed</div>' +
      '<div class="term-scroll" aria-live="polite"></div>' +
      '<div class="term-line"><span class="prompt">' + esc(ex.prompt) + '</span>' +
      '<input type="text" class="t-in" aria-label="Terminal input" autocomplete="off" spellcheck="false"></div>';
    host.appendChild(t);
    var sc = $('.term-scroll', t), input = $('.t-in', t);
    var lastCmd = '';
    function print(txt, cls) {
      var d = el('div', cls || 't-out');
      d.textContent = txt;
      sc.appendChild(d);
      sc.scrollTop = sc.scrollHeight;
    }
    (ex.banner || '').split('\n').forEach(function (l) { print(l, 't-out'); });
    function norm(s) { return s.replace(/["']/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
    function run() {
      var raw = input.value;
      if (!raw.trim()) return;
      print(ex.prompt + ' ' + raw, 't-cmd');
      lastCmd = raw;
      var n = norm(raw);
      var hitDest = (ex.destructive || []).some(function (d) { return n.indexOf(d) !== -1; });
      if (hitDest) {
        var bo = (ex.badOutputs || []).filter(function (o) { return o.when.every(function (w) { return n.indexOf(w) !== -1; }); })[0];
        print(bo ? bo.text : 'Done.', 't-warn');
        print('This command changed or destroyed data. Never run it on a real system during an incident.', 't-warn');
        input.value = '';
        return;
      }
      var out = (ex.outputs || []).filter(function (o) { return o.when.every(function (w) { return n.indexOf(w) !== -1; }); })[0];
      if (out) out.text.split('\n').forEach(function (l) { print(l, 't-out'); });
      else print(ex.notFound || 'command not found in this simulation — check the spelling of the tool and its options', 't-out');
      input.value = '';
    }
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') run(); });
    if (ex.syntaxPanel) {
      var sp = el('div', 'hint-panel');
      sp.innerHTML = '<div class="hp-h">SYNTAX REMINDER</div>' +
        '<div class="codebox"><pre>' + esc(ex.syntaxPanel.shape) + '</pre></div>' +
        ex.syntaxPanel.parts.map(function (p) { return '<div class="canon-part">' + esc(p) + '</div>'; }).join('') +
        '<div class="canon-part" style="margin-top:6px">Example on a different target: <code>' + esc(ex.syntaxPanel.example) + '</code></div>';
      host.appendChild(sp);
    }
    if (ex.expectedShape) {
      host.appendChild(el('div', 'note', '<b>Expected output starts like:</b><br>' + esc(ex.expectedShape)));
    }
    host.appendChild(el('p', 'sort-hint', 'Type the command and press Enter to run it. Press Check to submit your last command.'));
    host._grade = function () {
      if (!lastCmd.trim()) return null;
      var n = norm(lastCmd);
      var g = { T: ex.elements.length, C: 0, W: 0, right: [], wrong: [], missed: [], cmd: lastCmd };
      g.destructive = (ex.destructive || []).some(function (d) { return n.indexOf(d) !== -1; });
      ex.elements.forEach(function (e2) {
        if (n.indexOf(e2) !== -1) { g.C++; g.right.push({ label: e2, why: '' }); }
        else g.missed.push({ label: e2, why: '' });
      });
      (ex.wrongTokens || []).forEach(function (w) {
        if (n.indexOf(w) !== -1) { g.W++; g.wrong.push({ label: w, why: '' }); }
      });
      g.apply = function () { input.disabled = true; };
      g.yourHTML = '<div class="codebox"><pre>' + esc(lastCmd) + '</pre></div>';
      g.correctHTML = '';
      return g;
    };
  };

  WIDGETS.flow = function (ex, host, r) {
    if (!r.flow) r.flow = { results: [] };
    var opts = shuffle(ex.steps[S.flowStep].options.map(function (o, i) { return { o: o, oi: i }; }));
    var letters = 'ABCD';
    var picked = -1;
    var box = el('div', 'opts');

    items.forEach(function (p, k) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.innerHTML = '<span class="opt-k">' + letters[k] + '.</span><span class="opt-t">' + esc(p.o.t) + '</span><span class="opt-mark" aria-hidden="true"></span>';
      b.addEventListener('click', function () {
        if (r.checked) return;

        b.setAttribute('aria-checked', 'true');

      });
      box.appendChild(b);
      p.btn = b;
    });
    host.appendChild(box);
    host._grade = function () {
      if (picked < 0) return null;
      var stepIdx = S.flowStep;
      var o = ex.steps[stepIdx].options[picked];
      r.flow.results[stepIdx] = { picked: picked, ok: !!o.correct };
      var g = { T: ex.steps.length, C: 0, W: 0, right: [], wrong: [], missed: [], stepPicked: picked, stepIdx: stepIdx };
      ex.steps.forEach(function (st, i) {
        var sr = r.flow.results[i];
        if (!sr) return;
        var co = st.options[sr.picked];
        var good = st.options.filter(function (x) { return x.correct; })[0];
        if (co.correct) { g.C++; g.right.push({ label: st.label + ': ' + co.t, why: co.why }); }
        else {
          g.W++;
          g.wrong.push({ label: st.label + ': ' + co.t, why: co.why });
          g.missed.push({ label: st.label + ' — better path: ' + good.t, why: good.why });
        }
      });
      g.done = r.flow.results.filter(Boolean).length === ex.steps.length;
      g.apply = function () {
        items.forEach(function (p) {
          var b = p.btn; b.disabled = true;
          var chosen = p.oi === picked;
          if (p.o.correct && chosen) { b.classList.add('right'); $('.opt-mark', b).textContent = '✓'; }
          else if (chosen) { b.classList.add('wrong'); $('.opt-mark', b).textContent = '✗'; }
          else if (p.o.correct) { b.classList.add('missed'); $('.opt-mark', b).textContent = '○'; }
        });
      };
      g.stepOutcome = o.outcome;
      g.yourHTML = '<ol>' + ex.steps.map(function (st, i) {
        var sr = r.flow.results[i];
        return '<li><b>' + esc(st.label) + ':</b> ' + esc(sr ? st.options[sr.picked].t : '(not answered)') + '</li>';
      }).join('') + '</ol>';
      g.correctHTML = '<ol>' + ex.steps.map(function (st) {
        var good = st.options.filter(function (x) { return x.correct; })[0];
        return '<li><b>' + esc(st.label) + ':</b> ' + esc(good.t) + '</li>';
      }).join('') + '</ol>';
      return g;
    };
  };

  /* ---------------- grading ---------------- */
  function computePts(ex, g, r) {
    var base;
    if (g.destructive) base = 0;
    else if (g.T === 1) base = (g.C === 1 && g.W === 0) ? 100 : 0;
    else base = Math.max(0, Math.floor((g.C - g.W) / g.T * 100));
    if (r.hintUsed) base = Math.floor(base * 0.9);
    return base;
  }

  function warn(msg) {
    var w = $('#warnline');
    w.textContent = msg;
    setTimeout(function () { if (w.textContent === msg) w.textContent = ''; }, 4000);
  }

  function onCheck(force) {
    if (S.phase !== 'exam') return;
    var ex = curEx(), r = rec(ex.id);
    if (r.checked) return;
    var host = $('#anshost');
    var g = host._grade ? host._grade() : null;
    if (!g) {
      if (force) g = { T: exTypeT(ex), C: 0, W: 0, right: [], wrong: [], missed: [], forcedEmpty: true, yourHTML: '<p>Nothing was submitted before the timer ran out.</p>', correctHTML: '' };
      else {
        if (!$('#warnline').textContent) warn('Nothing to check yet — choose your answer (or type and run the command) first, or press Skip to move on.');
        return;
      }
    }
    if (ex.widget === 'flow') { flowCheck(ex, r, g); return; }
    r.checked = true; r.raw = g;
    stopExTimer();
    r.pts = computePts(ex, g, r);
    if (g.apply) g.apply();
    if (S.skipList.indexOf(ex.id) !== -1) S.skipList = S.skipList.filter(function (x) { return x !== ex.id; });
    renderFeedback(ex, r);
    S.timer.auto = true; setTimerMode();
    updateScore(); navAfterCheck(ex);
  }

  function flowCheck(ex, r, g) {
    var last = S.flowStep === ex.steps.length - 1;
    if (g.apply) g.apply();
    var ok = !!(r.flow.results[S.flowStep] && r.flow.results[S.flowStep].ok);
    if (last) {
      r.checked = true; r.raw = g;
      stopExTimer();
      r.pts = computePts(ex, g, r);
      renderFeedback(ex, r, g.stepOutcome);
      S.timer.auto = true; setTimerMode();
      updateScore(); navAfterCheck(ex);
    } else {
      renderStepFeedback(ok, g.stepOutcome);
      S.timer.auto = true; setTimerMode();
      navAfterCheck(ex);
    }
  }

  function navAfterCheck(ex) {
    $('#btn-check').disabled = true;
    var nb = $('#btn-next');
    nb.hidden = false;
    if (ex.widget === 'flow' && S.flowStep < ex.steps.length - 1 && !rec(ex.id).checked) nb.textContent = 'Next step →';
    else if (S.cur === S.seq.length - 1 && S.skipList.length) nb.textContent = 'Review skipped →';
    else if (S.cur === S.seq.length - 1) nb.textContent = 'Finish exam →';
    else nb.textContent = 'Next exercise →';
  }

  function onNext() {
    if (S.phase !== 'exam') return;
    S.timer.auto = false; setTimerMode();
    var ex = curEx(), r = rec(ex.id);
    if (ex.widget === 'flow' && !r.checked) {
      S.flowStep++;
      renderExercise();
      return;
    }
    if (S.cur < S.seq.length - 1) { S.cur++; S.flowStep = 0; renderExercise(); return; }
    if (S.skipList.length) showReview();
    else finish();
  }

  function onHint() {
    var ex = curEx(), r = rec(ex.id);
    if (r.hintUsed || r.checked) return;
    r.hintUsed = true;
    var hp = $('#hint-panel');
    hp.hidden = false;
    hp.innerHTML = '<div class="hp-h">HINT (−10% on this exercise)</div>' + esc(ex.hint);
    var hb = $('#btn-hint');
    hb.disabled = true;
    hb.textContent = 'Hint used';
  }

  function onSkip() {
    if (S.phase !== 'exam') return;
    var ex = curEx(), r = rec(ex.id);
    if (r.checked) return;
    if (S.skipList.indexOf(ex.id) === -1) S.skipList.push(ex.id);
    stopExTimer();
    if (S.cur < S.seq.length - 1) { S.cur++; S.flowStep = 0; renderExercise(); }
    else showReview();
  }

  /* ---------------- feedback ---------------- */
  function sec(title, cls2, items, licls) {
    if (!items || !items.length) return '';
    return '<div class="fb-sec ' + cls2 + '">' + title + '</div><ul>' + items.map(function (it) {
      return '<li class="' + licls + '"><b>' + esc(trunc(it.label, 120)) + '</b>' + (it.why ? ' — ' + esc(it.why) : '') + '</li>';
    }).join('') + '</ul>';
  }

  function renderFeedback(ex, r, outcomeExtra) {
    var g = r.raw;
    var fb = $('#fb');
    fb.hidden = false;
    var cls, ic, word;
    if (r.pts >= 100) { cls = 'fb-ok'; ic = '✓'; word = 'CORRECT'; }
    else if (r.pts >= 1) { cls = 'fb-part'; ic = '◐'; word = 'PARTIALLY CORRECT'; }
    else { cls = 'fb-no'; ic = '✗'; word = 'INCORRECT'; }
    var multi = g.T > 1;
    var h = '<div class="fb-h">' + ic + ' ' + word + '</div>';
    h += '<div class="fb-pts">You earned <b>' + r.pts + '</b> out of 100 points on this exercise.' +
      (r.hintUsed ? ' (Hint used: −10% applied to this exercise.)' : '') + '</div>';
    if (g.forcedEmpty) h += '<div class="warnline">No answer was submitted in time, so this exercise scores 0.</div>';
    if (outcomeExtra) h += '<div class="flow-outcome"><div class="fo-h">What happens next</div>' + esc(outcomeExtra) + '</div>';
    if (multi) {
      h += sec('What you got right', 'sec-right', g.right, 'li-right');
      h += sec('What you got wrong', 'sec-wrong', g.wrong, 'li-wrong');
      h += sec('What you missed', 'sec-missed', g.missed, 'li-missed');
      if (r.pts >= 1 && r.pts < 100) {
        h += '<p class="encourage">Partial credit is intentional and normal. In real cybersecurity work nobody gets everything right at once — the exam rewards the parts you did get right. The missed items below are the fastest points for you to learn.</p>';
      }
    } else if (g.wrong && g.wrong.length) {
      h += sec('Why your pick was wrong', 'sec-wrong', g.wrong, 'li-wrong');
    }
    if (g.destructive) {
      h += '<div class="danger-note">⚠ The command you ran would destroy evidence or change the system. In a real incident that can end the case. Read the safe command below and remember it.</div>';
    }
    h += '<div class="fb-exp">' + ex.explanation.map(para).join('') + '</div>';
    if (ex.widget === 'terminal' && ex.canonical) {
      h += '<div class="fb-sec sec-right">CANONICAL COMMAND</div>' +
        '<div class="codebox"><button class="btn copybtn" type="button">Copy</button><pre>' + esc(ex.canonical.cmd) + '</pre></div>' +
        ex.canonical.parts.map(function (p) { return '<div class="canon-part"><code>' + esc(p.p) + '</code> — ' + esc(p.d) + '</div>'; }).join('') +
        (ex.canonical.danger ? '<div class="danger-note">⚠ ' + esc(ex.canonical.danger) + '</div>' : '');
    }
    if (!multi) {
      h += '<div class="fb-sec sec-right">CORRECT ANSWER</div>' + (g.correctHTML || '');
    }
    h += '<div class="study"><b>What to study next:</b> ' + esc(ex.study) + '</div>';
    fb.className = 'fb ' + cls;
    fb.innerHTML = h;
    var cb = $('.copybtn', fb);
    if (cb) cb.addEventListener('click', function () { copyText(ex.canonical.cmd, cb); });
  }

  function renderStepFeedback(ok, outcome) {
    var fb = $('#fb');
    fb.hidden = false;
    fb.className = 'fb ' + (ok ? 'fb-ok' : 'fb-no');
    fb.innerHTML = '<div class="fb-h">' + (ok ? '✓ STEP CORRECT' : '✗ STEP INCORRECT') + '</div>' +
      '<div class="flow-outcome"><div class="fo-h">What happens next</div>' + esc(outcome) + '</div>';
  }

  function copyText(txt, btn) {
    function done() { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else fallback();
  }

  /* ---------------- review skipped ---------------- */
  function showReview() {
    S.phase = 'review';
    S.timer.auto = false; /* defensive: never carry the feedback pause into review */
    var list = $('#rev-list');
    list.innerHTML = '';
    S.skipList.forEach(function (id) {
      var ex = BYID[id];
      var row = el('div', 'rev-row');
      row.innerHTML = '<div class="rev-txt"><div class="rev-tag">SKIPPED — NOT ANSWERED YET</div><div>' + esc(ex.summary) + '</div></div>';
      var b = el('button', 'btn');
      b.textContent = 'Return to this exercise';
      b.addEventListener('click', function () { returnTo(id); });
      row.appendChild(b);
      list.appendChild(row);
    });
    $('#rev-finish').textContent = 'Finish exam — ' + S.skipList.length + ' would stay unanswered';
    show('scr-review');
    renderTimer();
  }

  function returnTo(id) {
    S.phase = 'exam';
    var idx = -1;
    S.seq.forEach(function (si, k) { if (EXS[si].id === id) idx = k; });
    S.cur = idx;
    S.flowStep = 0;
    /* Reset the answer, but keep hintUsed: the student already saw the hint,
       so the −10% must not be lost by skipping and returning. */
    var prev = S.ans[id];
    S.ans[id] = { checked: false, hintUsed: !!(prev && prev.hintUsed), pts: 0, raw: null, flow: null };
    S.skipList = S.skipList.filter(function (x) { return x !== id; });
    show('scr-exam');
    renderExercise();
  }
  /* ---------------- results ---------------- */
  function finish() {
    S.timer.running = false;
    stopExTimer();
    setTimerMode();
    S.phase = 'results';
    renderResults();
    show('scr-results');
  }

  function animateCount(elm, target, cb) {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
    if (reduce) { elm.textContent = target + '%'; if (cb) cb(); return; }
    var t0 = null, dur = 900;
    function step(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      elm.textContent = Math.round(target * k) + '%';
      if (k < 1) requestAnimationFrame(step);
      else if (cb) cb();
    }
    requestAnimationFrame(step);
  }

  function repCard(ex) {
    var r = S.ans[ex.id];
    var st, ic, ptsTxt;
    if (!r || !r.checked) { st = 'st-skip'; ic = '⚠'; ptsTxt = 'excluded'; }
    else if (r.pts >= 100) { st = 'st-ok'; ic = '✓'; ptsTxt = r.pts + '/100'; }
    else if (r.pts >= 1) { st = 'st-part'; ic = '◐'; ptsTxt = r.pts + '/100'; }
    else { st = 'st-no'; ic = '✗'; ptsTxt = '0/100'; }
    var h = '<div class="rep-card ' + st + '"><div class="rep-h"><span class="rep-st">' + ic + ' ';
    if (!r || !r.checked) h += 'NOT ANSWERED — EXCLUDED FROM SCORE';
    else if (st === 'st-ok') h += 'CORRECT';
    else if (st === 'st-part') h += 'PARTIALLY CORRECT';
    else h += 'INCORRECT';
    h += '</span><span class="rep-pts">' + esc(ptsTxt) + '</span><span class="rep-pts">' + esc(ex.theme) + '</span></div>';
    h += '<div class="rep-q">' + esc(trunc(ex.question, 160)) + '</div>';
    if (r && r.checked && r.raw) {
      h += '<div class="rep-ans"><b>Your answer:</b>' + (r.raw.yourHTML || '') + '</div>';
      if (ex.widget === 'terminal' && ex.canonical) {
        h += '<div class="rep-ans"><b>Canonical command:</b><div class="codebox"><pre>' + esc(ex.canonical.cmd) + '</pre></div></div>';
      } else if (r.raw.correctHTML) {
        h += '<div class="rep-ans"><b>Correct answer:</b>' + r.raw.correctHTML + '</div>';
      }
      h += '<div class="rep-body">' + ex.explanation.map(para).join('') + '</div>';
    } else {
      h += '<div class="rep-ans">You skipped this exercise and never answered it. It is excluded from both your points earned and your points possible.</div>';
    }
    h += '<div class="study"><b>What to study next:</b> ' + esc(ex.study) + '</div></div>';
    return h;
  }

  function renderResults() {
    var answered = [], unanswered = [];
    EXS.forEach(function (ex) {
      var r = S.ans[ex.id];
      if (r && r.checked) answered.push(ex); else unanswered.push(ex);
    });
    var earned = answered.reduce(function (a, ex) { return a + S.ans[ex.id].pts; }, 0);
    var poss = answered.length * 100;
    var pct = poss > 0 ? Math.round(earned / poss * 100) : 0;
    var full = answered.filter(function (ex) { return S.ans[ex.id].pts === 100; }).length;
    var part = answered.filter(function (ex) { var p = S.ans[ex.id].pts; return p >= 1 && p < 100; }).length;
    var zero = answered.length - full - part;
    var passed = pct >= CFG.passMark;

    var tmap = {};
    EXS.forEach(function (ex) {
      var r = S.ans[ex.id];
      var t = tmap[ex.theme] = tmap[ex.theme] || { n: 0, e: 0, p: 0, s: 0 };
      if (r && r.checked) { t.n++; t.e += r.pts; t.p += 100; } else t.s++;
    });

    var nameLine = (S.init && S.init.username) ? '<p>Practicing as: <b>' + esc(S.init.username) + '</b></p>' : '';
    var h = '<h1>Results — ' + esc(CFG.keyword) + ' (' + esc(sevLabel()) + ')</h1>';
    if (S.timeUp) h += '<div class="note">The timer ran out. Everything you had not answered — including anything still open — was treated as not answered and excluded from the score.</div>';
    h += '<div class="res-top"><div class="bigscore" id="bigpct">0%</div><div>' +
      '<p><b>' + earned + '</b> points earned out of <b>' + poss + '</b> possible, over ' + answered.length + ' answered exercise' + (answered.length === 1 ? '' : 's') + '.</p>' +
      '<p>' + full + ' fully correct · ' + part + ' partially correct · ' + zero + ' incorrect · ' + unanswered.length + ' skipped and unanswered (excluded)</p>' +
      nameLine + '</div></div>';
    h += passed
      ? '<div class="passpanel"><h2>✓ PASS — certificate of completion</h2><p>You reached <b>' + pct + '%</b>, above the ' + CFG.passMark + '% pass mark for this exam.</p>' +
        '<p><b>' + esc(CFG.keyword) + ' — ' + esc(sevLabel()) + ' tier:</b> passed with partial credit accounted for. ' +
        (full + ' exercise' + (full === 1 ? '' : 's') + ' at 100 points, ' + part + ' with partial credit.') + '</p></div>'
      : '<div class="failpanel"><h2>✗ FAIL — retake recommended</h2><p>You reached <b>' + pct + '%</b>. You need <b>' + CFG.passMark + '%</b> to pass this tier. Read the report below, study the pointers, then retake the exam — questions and answer choices will be shuffled.</p></div>';

    h += '<div class="themetbl-wrap"><table class="themetbl"><thead><tr><th>Theme</th><th>Answered</th><th>Skipped</th><th>Points</th></tr></thead><tbody>' +
      Object.keys(tmap).map(function (k) {
        var t = tmap[k];
        return '<tr><td>' + esc(k) + '</td><td class="num">' + t.n + '</td><td class="num">' + t.s + '</td><td class="num">' + t.e + ' / ' + t.p + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    h += '<h2>Detailed report</h2>';
    h += EXS.slice().sort(function (a, b) {
      return S.seq.indexOf(EXS.indexOf(a)) - S.seq.indexOf(EXS.indexOf(b));
    }).map(repCard).join('');

    h += '<div class="res-actions"><button class="btn primary" id="btn-retake" type="button">Retake exam (reshuffled)</button></div>';

    var host = $('#scr-results .wrap');
    host.innerHTML = h;
    $('#btn-retake').addEventListener('click', function () { startExam(); });
    animateCount($('#bigpct'), pct, function () { reportScore(earned, poss); });
  }

  /* ---------------- website integration (STEP 6) ---------------- */
  function reportScore(pointsEarned, pointsPossible) {
    if (S.reported) return;
    S.reported = true;
    var percent = pointsPossible > 0 ? Math.round((pointsEarned / pointsPossible) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: pointsEarned,
        total: pointsPossible,
        percent: percent,
        passed: percent >= CFG.passMark
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.init = event.data;
    if (event.data.username && S.phase === 'intro') {
      $('#intro-welcome').textContent = 'Welcome, ' + event.data.username + '! This is a self-contained practice certification exam on ' + CFG.keyword + ' (' + sevLabel() + '). Read the explanation below, then press Start when you are ready.';
    }
  });

      '<section id="scr-results" hidden><div class="wrap"></div></section>' +

      '<div id="pauseov" hidden><div class="pausebox"><h2>⏸ Paused by you</h2>' +
      '<p>The exercise is hidden while you rest, so nothing can be read. The timer is stopped.</p>' +
      '<button class="btn primary" id="btn-resume" type="button">Resume ▶</button></div></div>';

    $('#btn-start').addEventListener('click', startExam);
    $('#btn-check').addEventListener('click', function () { onCheck(false); });
    $('#btn-next').addEventListener('click', onNext);
    $('#btn-hint').addEventListener('click', onHint);
    $('#btn-pause').addEventListener('click', pauseManual);
    $('#btn-resume').addEventListener('click', resumeManual);
    $('#btn-skip').addEventListener('click', onSkip);
    $('#rev-finish').addEventListener('click', function () { finish(); });
    $('#btn-revback').addEventListener('click', function () {
      if (S.seq.length && S.cur < S.seq.length) { S.phase = 'exam'; show('scr-exam'); renderExercise(); }
      else finish();
    });
    $('#scn-toggle').addEventListener('click', function () {
      var scn = $('#blk-scn');
      var col = scn.classList.toggle('collapsed');
      $('#scn-toggle').textContent = col ? 'Expand ▾' : 'Collapse ▴';
      if (col) { var ex = curEx(); $('#scn-summary').textContent = ex.summary + ' — collapsed'; }
      else if (curEx().collapsible) { $('#scn-summary').textContent = curEx().summary; }
    });

    document.addEventListener('input', function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains('lv-filter')) {
        var box = t.closest('.artefact');
        var q = t.value.toLowerCase();
        var shown = 0;
        $all('.lv-line', box).forEach(function (ln) {
          var showLn = !q || ln.textContent.toLowerCase().indexOf(q) !== -1;
          ln.hidden = !showLn;
          if (showLn) shown++;
        });
        var c = $('.lv-count', box);
        if (c) c.textContent = shown + ' of ' + box.getAttribute('data-total') + ' lines';
      }
    });

    renderIntro();
  }

  boot();
})();

</script>
</body>
</html>
