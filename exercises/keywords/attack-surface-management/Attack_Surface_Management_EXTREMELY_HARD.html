function wireExercise(ex,st){
  var wrap=$('answrap');
  var bfold=$('b-fold');
  if(bfold){bfold.addEventListener('click',function(){
    var sec=$('blk-scen'); var col=sec.classList.toggle('scen-collapsed');
    bfold.setAttribute('aria-expanded',col?'false':'true');
    bfold.innerHTML=icon('eye',14)+(col?' Expand':' Collapse');
  });}
  var finputs=document.querySelectorAll('.logfilter');
  Array.prototype.forEach.call(finputs,function(inp){
    inp.addEventListener('input',function(){
      var q=inp.value.toLowerCase();
      var scope=inp.closest?inp.closest('.panel'):document;
      (scope||document).querySelectorAll('.logline').forEach(function(ln){
        ln.classList.toggle('hide',q!==''&&ln.textContent.toLowerCase().indexOf(q)<0);
      });
    });
  });
  if(ex.type==='qcm'){
    wrap.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(function(inp){
      inp.addEventListener('change',function(){
        var picked=Array.prototype.map.call(wrap.querySelectorAll('input:checked'),function(i){return i.value;});
        if(!ex.multi&&picked.length>1){picked=[picked[picked.length-1]];}
        st.answer.picked=picked;
        wrap.querySelectorAll('.opt').forEach(function(lb){
          var v=lb.querySelector('input'); lb.classList.toggle('sel',v.checked);
          if(!ex.multi){lb.querySelector('input').checked=(v.value===picked[0]);}
        });
        updateButtons();
      });
    });
  } else if(ex.type==='input'){
    var ti=wrap.querySelector('.inp-text');
    ti.addEventListener('input',function(){st.answer.text=ti.value;updateButtons();});
  } else if(ex.type==='order'){
    wireOrder(ex,st);
  } else if(ex.type==='categorize'){
    wireChips(ex,st,'c');
  } else if(ex.type==='fill'){
    wireChips(ex,st,'f');
  } else if(ex.type==='match'){
    wrap.querySelectorAll('.msel').forEach(function(sel){
      sel.addEventListener('change',function(){
        st.answer.map=st.answer.map||{}; st.answer.map[sel.getAttribute('data-left')]=sel.value; updateButtons();
      });
    });
  } else if(ex.type==='terminal'){
    var cmd=wrap.querySelector('.term-cmd'), out=wrap.querySelector('.term-out');
    out.innerHTML='<div class="term-line muted">'+esc(ex.shell.motd||'Simulation shell &#8212; type your command and press Enter.')+'</div>';
    cmd.addEventListener('keydown',function(ev){
      if(ev.key!=='Enter') return;
      var raw=cmd.value; if(!raw.trim()) return;
      var nc=normCmd(raw);
      var line='<div class="term-line"><span style="color:var(--green)">'+esc(ex.shell.prompt)+'</span> '+esc(raw)+'</div>';
      var found=null;
      (ex.shell.outputs||[]).forEach(function(o){if(!found&&new RegExp(o.rx).test(nc)) found=o;});
      if(found){line+='<div class="term-ok">'+found.text+'</div>';}
      else{
        var w0=nc.split(' ')[0]||'';
        line+='<div class="term-err">bash: '+esc(w0)+': command not found (this simulation only knows the command(s) this exercise needs)</div>';
      }
      out.innerHTML+=line; out.scrollTop=out.scrollHeight;
      st.answer.cmd=raw; cmd.value=''; updateButtons();
    });
  } else if(ex.type==='triage'){
    wrap.querySelectorAll('input[type=radio]').forEach(function(inp){
      inp.addEventListener('change',function(){
        var name=inp.name; var aid=name.split('_')[2];
        st.answer.pick=st.answer.pick||{}; st.answer.pick[aid]=inp.value;
        var grp=wrap.querySelectorAll('input[name="'+name+'"]');
        grp.forEach(function(g){g.closest('.opt').classList.toggle('sel',g.checked);});
        updateButtons();
      });
    });
  } else if(ex.type==='steps'){
    wrap.addEventListener('change',function(ev){
      var inp=ev.target; if(!inp||inp.type!=='radio'||inp.disabled) return;
      var parts=inp.name.split('_'); var si=+parts[2]; var oid=inp.value;
      st.answer.pick=st.answer.pick||{}; st.answer.pick[si]=oid; st.stepLock=Math.max(st.stepLock||0,si+1);
      renderExercise(); updateButtons();
    });
    wrap.addEventListener('click',function(ev){
      var inp=ev.target.closest&&ev.target.closest('.opt');
      if(!inp) return;
      var r=inp.querySelector('input[type=radio]'); if(!r||r.disabled) return;
      var parts=r.name.split('_'); var si=+parts[2];
      if((st.answer.pick||{})[si]===r.value && si===(st.stepLock-1)){
        delete st.answer.pick[si]; st.stepLock=si; renderExercise();
      }
    });
  }
  $('b-check').addEventListener('click',function(){doCheck(false);});
  $('b-next').addEventListener('click',doNext);
}
function wireOrder(ex,st){
  var wrap=$('answrap'); var dragId=null;
  wrap.querySelectorAll('.ordrow').forEach(function(row){
    row.addEventListener('dragstart',function(e){dragId=row.getAttribute('data-id');row.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.setData('text/plain',dragId);} });
    row.addEventListener('dragend',function(){row.classList.remove('dragging');});
    row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('over');});
    row.addEventListener('dragleave',function(){row.classList.remove('over');});
    row.addEventListener('drop',function(e){
      e.preventDefault(); row.classList.remove('over');
      var from=st.answer.seq.indexOf(dragId); var to=st.answer.seq.indexOf(row.getAttribute('data-id'));
      if(from<0||to<0||from===to) return;
      st.answer.seq.splice(to,0,st.answer.seq.splice(from,1)[0]);
      renderExercise();
    });
    var up=row.querySelector('[data-move=up]'), down=row.querySelector('[data-move=down]');
    if(up) up.addEventListener('click',function(){moveRow(ex,st,row.getAttribute('data-id'),-1);});
    if(down) down.addEventListener('click',function(){moveRow(ex,st,row.getAttribute('data-id'),1);});
  });
}
function moveRow(ex,st,id,dir){
  var i=st.answer.seq.indexOf(id); var j=i+dir;
  if(i<0||j<0||j>=st.answer.seq.length) return;
  var t=st.answer.seq[i]; st.answer.seq[i]=st.answer.seq[j]; st.answer.seq[j]=t;
  renderExercise();
}
function wireChips(ex,st,kind){
  var wrap=$('answrap'); var selId=null, selW=null;
  var bank=$( (kind==='c'?'cbank-':'fbank-')+ex.id );
  var isC=(kind==='c');
  function refresh(){renderExercise();}
  wrap.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('dragstart',function(e){
      if(isC){dragC=ch.getAttribute('data-id');}else{dragW=ch.getAttribute('data-w');}
      if(e.dataTransfer){e.dataTransfer.setData('text/plain','x');}
    });
    ch.addEventListener('click',function(){
      if(isC){
        if(selId===ch.getAttribute('data-id')){selId=null;ch.classList.remove('sel');}
        else{
          wrap.querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel');});
          selId=ch.getAttribute('data-id'); ch.classList.add('sel');
        }
      } else {
        var w=ch.getAttribute('data-w');
        if(selW===w){selW=null;ch.classList.remove('sel');}
        else{
          wrap.querySelectorAll('.chip.fw').forEach(function(x){x.classList.remove('sel');});
          selW=w; ch.classList.add('sel');
        }
      }
    });
  });
  var dragC=null, dragW=null;
  function placeInto(zoneEl,zoneKey){
    if(isC&&selId){st.answer.place=st.answer.place||{};st.answer.place[selId]=zoneKey;selId=null;refresh();return true;}
    if(isC&&dragC){st.answer.place=st.answer.place||{};st.answer.place[dragC]=zoneKey;dragC=null;refresh();return true;}
    if(!isC&&selW){st.answer.place=st.answer.place||{};st.answer.place[zoneKey]=selW;selW=null;refresh();return true;}
    if(!isC&&dragW){st.answer.place=st.answer.place||{};st.answer.place[zoneKey]=dragW;dragW=null;refresh();return true;}
    return false;
  }
  if(isC){
    bank.addEventListener('click',function(){/*bank click: nothing*/});
    bank.addEventListener('dragover',function(e){e.preventDefault();bank.classList.add('over');});
    bank.addEventListener('dragleave',function(){bank.classList.remove('over');});
    bank.addEventListener('drop',function(e){e.preventDefault();bank.classList.remove('over');if(dragC){st.answer.place[dragC]='';dragC=null;refresh();}});
    wrap.querySelectorAll('.zone').forEach(function(z){
      z.addEventListener('click',function(){placeInto(z,z.getAttribute('data-zone'));});
      z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
      z.addEventListener('dragleave',function(){z.classList.remove('over');});
      z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');placeInto(z,z.getAttribute('data-zone'));});
    });
  } else {
    bank.addEventListener('dragover',function(e){e.preventDefault();});
    wrap.querySelectorAll('.blank').forEach(function(b){
      b.addEventListener('click',function(){
        var sid=b.getAttribute('data-slot');
        if(st.answer.place&&st.answer.place[sid]){delete st.answer.place[sid];refresh();return;}
        placeInto(b,sid);
      });
    });
  }
}
function collectLive(ex,st){
  if(ex.type==='terminal'){
    var c=$('answrap').querySelector('.term-cmd'); if(c&&c.value.trim()){st.answer.cmd=c.value;}
  }
  if(ex.type==='input'){
    var t=$('answrap').querySelector('.inp-text'); if(t){st.answer.text=t.value;}
  }
}
function canCheck(ex,st){
  var a=st.answer||{};
  if(ex.type==='qcm') return (a.picked||[]).length>=1;
  if(ex.type==='input') return String(a.text||'').trim()!=='';
  if(ex.type==='order') return (a.seq||[]).length>0;
  if(ex.type==='categorize') return Object.keys(a.place||{}).filter(function(k){return a.place[k];}).length>0;
  if(ex.type==='match') return Object.keys(a.map||{}).filter(function(k){return a.map[k];}).length>0;
  if(ex.type==='fill') return Object.keys(a.place||{}).filter(function(k){return a.place[k];}).length>0;
  if(ex.type==='terminal') return String(a.cmd||'').trim()!=='';
  if(ex.type==='triage'){var p=a.pick||{};return ex.alerts.some(function(x){return p[x.id];});}
  if(ex.type==='steps'){var p2=a.pick||{};return ex.steps.some(function(s,i){return p2[i];});}
  return false;
}
function updateButtons(){
  var ex=curEx(); if(!ex||S.phase!=='exercise') return;
  var st=S.st[ex.id];
  var ok=canCheck(ex,st);
  $('b-check').disabled=!ok||st.checked;
  $('b-next').classList.toggle('hidden',!st.checked);
  var note=$('livenote');
  if(note){note.textContent=st.checked?'Graded. Press Next to continue.':'';}
}

/* ============ mini timer (EXTREMELY HARD terminal exercises) ============ */
function startMini(ex,st){
  if(!ex.timeLimit) return;
  st.miniLeft=st.miniLeft==null?ex.timeLimit:st.miniLeft;
  var el=$('answrap').querySelector('.minitime');
  function paint(){if(el) el.textContent=fmt(st.miniLeft);}
  paint();
  if(st.miniIv) clearInterval(st.miniIv);
  st.miniIv=setInterval(function(){
    if(st.checked){clearInterval(st.miniIv);return;}
    if(!S.timer.isRunning||S.timer.isManuallyPaused||S.timer.isAutoPausedAfterCheck) return;
    st.miniLeft--;
    paint();
    if(st.miniLeft<=0){
      clearInterval(st.miniIv); st.miniExpired=true;
      collectLive(ex,st);
      if(canCheck(ex,st)){doCheck(true);}
      else{
        st.checked=true; st.graded={pts:0,T:1,C:0,W:0,right:[],wrong:[],missed:[],note:'The own-time limit for this exercise ended before a command was run, so it scores 0.'};
        st.answer.cmd=st.answer.cmd||'(no command entered in time)';
        finishCheckUI();
      }
    }
  },1000);
}

/* ============ grading ============ */
function partial(C,W,T){ if(T<=0) return 0; return Math.floor(Math.max(0,C-W)/T*100); }
function labelOf(ex,oid){var o=(ex.options||[]).filter(function(x){return x.id===oid;})[0];return o?o.t:oid;}
function gradeEx(ex,st){
  var a=st.answer||{};
  var res={pts:0,T:1,C:0,W:0,right:[],wrong:[],missed:[],single:false};
  if(ex.type==='qcm'){
    if(!ex.multi){
      res.single=true; res.T=1;
      var want=ex.correct[0];
      if((a.picked||[])[0]===want){res.C=1;res.pts=100;res.right.push({t:labelOf(ex,want),why:optWhy(ex,want)});}
      else{res.W=1;res.pts=0;var p=(a.picked||[])[0];if(p){res.wrong.push({t:labelOf(ex,p),why:optWhy(ex,p)});}res.missed.push({t:labelOf(ex,want),why:optWhy(ex,want)});}
    } else {
      var okIds=ex.correct;
      res.T=okIds.length;
      var picked=a.picked||[];
      picked.forEach(function(p){
        if(okIds.indexOf(p)>=0){res.C++;res.right.push({t:labelOf(ex,p),why:optWhy(ex,p)});}
        else{res.W++;res.wrong.push({t:labelOf(ex,p),why:optWhy(ex,p)});}
      });
      okIds.forEach(function(c){if(picked.indexOf(c)<0){res.missed.push({t:labelOf(ex,c),why:optWhy(ex,c)});}});
      res.pts=partial(res.C,res.W,res.T);
    }
  } else if(ex.type==='input'){
    res.single=true; res.T=1;
    var v=norm(a.text);
    var hit=(ex.accept||[]).some(function(x){return norm(x)===v;});
    if(hit){res.C=1;res.pts=100;res.right.push({t:String(a.text).trim(),why:ex.fb.why});}
    else{res.W=1;res.pts=0;res.missed.push({t:ex.accept[0],why:ex.fb.why});}
  } else if(ex.type==='order'){
    res.T=ex.items.length; var seq=a.seq||[];
    ex.items.forEach(function(it){
      var pos=seq.indexOf(it.id), want=ex.order.indexOf(it.id);
      if(pos===want&&pos>=0){res.C++;res.right.push({t:'Position '+(want+1)+': '+it.t,why:it.why});}
      else if(pos>=0){res.W++;res.wrong.push({t:it.t+' (you placed it at '+(pos+1)+', it belongs at '+(want+1)+')',why:it.why});}
      else{res.missed.push({t:it.t,why:it.why});}
    });
    res.pts=partial(res.C,res.W,res.T);
  } else if(ex.type==='categorize'){
    res.T=ex.items.length; var pl=a.place||{};
    ex.items.forEach(function(it){
      var z=pl[it.id];
      if(!z){res.missed.push({t:it.t,why:it.why});}
      else if(z===it.zone){res.C++;var zl=zoneLabel(ex,it.zone);res.right.push({t:it.t+' \u2192 '+zl,why:it.why});}
      else{res.W++;var zl2=zoneLabel(ex,it.zone);res.wrong.push({t:it.t+' \u2192 '+zoneLabel(ex,z),why:it.why+' It belongs in \u201c'+zl2+'\u201d.'});}
    });
    res.pts=partial(res.C,res.W,res.T);
  } else if(ex.type==='match'){
    res.T=ex.lefts.length; var mp=a.map||{};
    ex.lefts.forEach(function(l){
      var want=ex.map[l.id], got=mp[l.id];
      if(!got){res.missed.push({t:l.t+' \u2192 '+rightT(ex,want.r),why:want.why});}
      else if(got===want.r){res.C++;res.right.push({t:l.t+' \u2192 '+rightT(ex,got),why:want.why});}
      else{res.W++;res.wrong.push({t:l.t+' \u2192 '+rightT(ex,got),why:want.why});}
    });
    res.pts=partial(res.C,res.W,res.T);
  } else if(ex.type==='fill'){
    var sids=Object.keys(ex.slots);
    res.T=sids.length; var fp=a.place||{};
    sids.forEach(function(sid){
      var sl=ex.slots[sid], w=fp[sid];
      var label='Blank '+sid.replace(/\D/g,'')+': ';
      if(!w){res.missed.push({t:label+sl.ok[0],why:sl.why});}
      else if(sl.ok.map(norm).indexOf(norm(w))>=0){res.C++;res.right.push({t:label+w,why:sl.why});}
      else{res.W++;res.wrong.push({t:label+w,why:sl.why});}
    });
    res.pts=partial(res.C,res.W,res.T);
  } else if(ex.type==='terminal'){
    var cmd=normCmd(a.cmd); res.T=ex.elements.length;
    if(!cmd){res.pts=0;res.missed=ex.elements.map(function(e2){return {t:e2.label,why:'Required part was missing.'};});return res;}
    ex.elements.forEach(function(e2){
      if(new RegExp(e2.rx).test(cmd)){res.C++;res.right.push({t:e2.label,why:'Present and correct.'});}
      else{res.missed.push({t:e2.label,why:'This required part was missing or wrong.'});}
    });
    (ex.forbidden||[]).forEach(function(f){
      if(new RegExp(f.rx).test(cmd)){res.W++;res.wrong.push({t:f.label,why:f.why});}
    });
    res.pts=partial(res.C,res.W,res.T);
    res.canonical=ex.canonical; res.explain=ex.explain;
  } else if(ex.type==='triage'){
    res.T=ex.alerts.length; var pk=a.pick||{};
    ex.alerts.forEach(function(al){
      var want=(al.options.filter(function(o){return o.ok;})[0]||{}).id;
      var got=pk[al.id];
      if(!got){res.missed.push({t:al.title+' \u2014 correct: '+(al.options.filter(function(o){return o.ok;})[0]||{}).t,why:(al.options.filter(function(o){return o.ok;})[0]||{}).fb});}
      else if(got===want){res.C++;var co=al.options.filter(function(o){return o.ok;})[0];res.right.push({t:al.title+' \u2014 '+co.t,why:co.fb});}
      else{res.W++;var wo=al.options.filter(function(o){return o.id===got;})[0];res.wrong.push({t:al.title+' \u2014 '+wo.t,why:wo.fb});}
    });
    res.pts=partial(res.C,res.W,res.T);
  } else if(ex.type==='steps'){
    res.T=ex.steps.length; var sp=a.pick||{};
    ex.steps.forEach(function(s,i){
      var want=(s.options.filter(function(o){return o.ok;})[0]||{}).id;
      var got=sp[i];
      if(!got){res.missed.push({t:'Step '+(i+1)+' \u2014 correct: '+(s.options.filter(function(o){return o.ok;})[0]||{}).t,why:(s.options.filter(function(o){return o.ok;})[0]||{}).fb});}
      else if(got===want){res.C++;var co2=s.options.filter(function(o){return o.ok;})[0];res.right.push({t:'Step '+(i+1)+': '+co2.t,why:co2.fb});}
      else{res.W++;var wo2=s.options.filter(function(o){return o.id===got;})[0];res.wrong.push({t:'Step '+(i+1)+': '+wo2.t,why:wo2.fb});}
    });
    res.pts=partial(res.C,res.W,res.T);
  }
  return res;
}
function optWhy(ex,oid){var o=(ex.options||[]).filter(function(x){return x.id===oid;})[0];return o&&o.why?o.why:'';}
function rightT(ex,rid){var r=(ex.rights||[]).filter(function(x){return x.id===rid;})[0];return r?r.t:rid;}
function zoneLabel(ex,zid){var z=(ex.zones||[]).filter(function(x){return x.id===zid;})[0];return z?z.label:zid;}

/* ============ check / feedback ============ */
function doCheck(auto){
  var ex=curEx(), st=S.st[ex.id];
  if(st.checked) return;
  collectLive(ex,st);
  var g=gradeEx(ex,st);
  var pts=g.pts;
  if(st.hint) pts=Math.floor(pts*0.9);
  g.pts=pts; g.hinted=st.hint;
  if(auto) g.autoNote='The own-time limit for this exercise ended, so it was graded with what you had typed at that moment.';
  st.checked=true; st.graded=g;
  finishCheckUI();
}
function finishCheckUI(){
  var ex=curEx(), st=S.st[ex.id];
  S.timer.isAutoPausedAfterCheck=true;
  renderFeedback(ex,st);
  updateScore(); renderHeader(); updateButtons();
  var aw=$('answrap');
  if(aw){aw.classList.add('locked');aw.querySelectorAll('input,select,button').forEach(function(el){el.disabled=true;});}
  var fb=$('fbplace'); if(fb&&fb.firstChild){fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
  renderTimer();
}
function statusOf(pts){return pts>=100?'good':(pts>=1?'part':'bad');}
function statusWord(pts){return pts>=100?['check','CORRECT']:(pts>=1?['part','PARTIALLY CORRECT']:['cross','INCORRECT']);}
function listHTML(arr,cls,ic){
  if(!arr.length) return '';
  var h='<div class="fb-sub '+cls+'">'+(cls==='good'?'What you got right':(cls==='bad'?'What you got wrong':'What you missed'))+'</div><ul class="fb-list">';
  arr.forEach(function(x){h+='<li><span class="ic">'+icon(ic,14)+'</span><span><b>'+esc(x.t)+'</b>'+(x.why?' &#8212; '+esc(x.why):'')+'</span></li>';});
  return h+'</ul>';
}
function renderFeedback(ex,st){
  var g=st.graded; var sw=statusWord(g.pts); var stt=statusOf(g.pts);
  var h='<section class="fb '+stt+'" role="status"><div class="fb-h">'+icon(sw[0],16)+' '+sw[1]+'</div><div class="fb-b">';
  h+='<p class="fb-pts">You earned <b>'+g.pts+' out of 100</b> points on this exercise.'+(g.hinted?' (Includes the &#8722;10% hint cost.)':'')+'</p>';
  if(g.note){h+='<p class="muted">'+esc(g.note)+'</p>';}
  if(g.autoNote){h+='<p class="muted">'+esc(g.autoNote)+'</p>';}
  if(g.single||ex.type==='input'){
    h+=listHTML(g.right,'good','check');
    h+=listHTML(g.wrong,'bad','cross');
    h+=listHTML(g.missed,'miss','part');
    h+='<p>'+esc(ex.fb.why||'')+'</p>';
  } else {
    if(g.pts>0&&g.pts<100){h+='<p class="muted">Partial credit is intentional and mirrors real work: getting some parts right and some wrong is normal, and the exam rewards the parts you got right.</p>';}
    h+=listHTML(g.right,'good','check');
    h+=listHTML(g.wrong,'bad','cross');
    h+=listHTML(g.missed,'miss','part');
    if(ex.type==='terminal'){
      h+='<div class="fb-sub good">Canonical command</div>';
      h+='<div class="codebox"><span>'+esc(g.canonical||ex.canonical)+'</span><button class="btn small copybtn" data-copy="'+esc(g.canonical||ex.canonical)+'">'+icon('copy',13)+' Copy</button></div>';
      h+='<p class="muted" style="font-size:13.5px">Note: on screen the target is written defanged (with [.]). In the shell you can type it with or without brackets &#8212; both are graded the same.</p>';
      (g.explain||ex.explain||[]).forEach(function(p){h+='<p><b>'+esc(p.part)+'</b> &#8212; '+esc(p.text)+'</p>';});
    }
  }
  if(ex.type==='steps'||ex.type==='triage'){h+=stepFbs(ex,st,g);}
  h+='<div class="fb-study"><b>What to study:</b> '+esc(ex.fb.study||'')+'</div>';
  h+='</div></section>';
  $('fbplace').innerHTML=h;
  var cp=document.querySelector('.copybtn');
  if(cp){cp.addEventListener('click',function(){copyText(cp,cp.getAttribute('data-copy'));});}
}
function stepFbs(ex,st,g){
  var h='';
  if(ex.type==='triage'){
    ex.alerts.forEach(function(al){
      var pk=(st.answer.pick||{})[al.id]; if(!pk) return;
      var o=al.options.filter(function(x){return x.id===pk;})[0];
      h+='<p><b>'+esc(al.title)+':</b> '+esc(o.fb)+'</p>';
    });
  } else {
    ex.steps.forEach(function(s,i){
      var pk=(st.answer.pick||{})[i]; if(pk==null) return;
      var o=s.options.filter(function(x){return x.id===pk;})[0];
      h+='<p><b>Step '+(i+1)+':</b> '+esc(o.fb)+'</p>';
    });
  }
  return h;
}
function copyText(btn,txt){
  function done(ok){var old=btn.innerHTML;btn.innerHTML=ok?icon('check',13)+' Copied':icon('copy',13)+' Select &amp; copy';setTimeout(function(){btn.innerHTML=old;},1800);}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){done(true);},function(){fallback();});
      return;
    }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
      var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
    }catch(e){done(false);}
  }
}

/* ============ score ============ */
function updateScore(){
  var e=0,p=0,n=0;
  S.order.forEach(function(id){
    var st=S.st[id];
    if(st&&st.checked){n++;e+=st.graded.pts;p+=100;}
  });
  S.earned=e; S.possible=p; S.answered=n;
  renderHeader();
}

/* ============ navigation ============ */
function doNext(){
  var st=S.st[curEx().id];
  S.timer.isAutoPausedAfterCheck=false;
  if(st&&st.miniIv){clearInterval(st.miniIv);}

function doSkip(){

}
function openReview(){
  S.phase='review'; S.timer.isAutoPausedAfterCheck=false; renderTimer();
  var stage=$('stage'); var h='<div class="hero"><h1>'+icon('flag',24)+' Review skipped exercises</h1></div>';
  h+='<div class="card"><p>Time left: <b>'+fmt(S.timer.remain)+'</b>. You can return to any skipped exercise and answer it, as many times as you need, until the timer ends or you submit.</p>';
  if(!S.skipped.length){h+='<p class="muted">You have no skipped exercises. Well done &#8212; go straight to your results.</p>';}
  S.skipped.forEach(function(id,i){
    var ex=EX_BY_ID[id];
    h+='<div class="reviewitem"><span class="hchip">'+icon('skip',14)+' '+(i+1)+'</span><span class="ri-t"><b>'+esc(TYPE_LABEL[ex.type])+'</b> &#8212; '+esc(ex.scenario.summary)+'</span><button class="btn small" data-ret="'+id+'">'+icon('play',13)+' Answer it</button></div>';
  });
  h+='<div class="mt"><button class="btn pri" id="b-submit">'+icon('flag',15)+' Submit exam</button> <span class="muted">Skipped exercises you never answer are excluded from the score &#8212; they do not help or hurt.</span></div></div>';
  stage.innerHTML=h;
  renderHeader();
  Array.prototype.forEach.call(stage.querySelectorAll('[data-ret]'),function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-ret');
      S.skipped=S.skipped.filter(function(x){return x!==id;});
      S.idx=S.order.indexOf(id);
      renderExercise();
    });
  });
  $('b-submit').addEventListener('click',function(){S.timer.isRunning=false;renderResults();});
}
function finishExam(){
  S.timer.isAutoPausedAfterCheck=false; renderTimer();
  openReview();
}

/* ============ results ============ */
function answerSummary(ex,st,correct){
  var a=(st&&st.answer)||{}; var parts=[];
  if(ex.type==='qcm'){
    if(correct){return ex.correct.map(function(c){return labelOf(ex,c);}).join(' | ');}
    var pk=a.picked||[]; return pk.length?pk.map(function(p){return labelOf(ex,p);}).join(' | '):'(nothing selected)';
  }
  if(ex.type==='input'){return correct?ex.accept[0]:(String(a.text||'').trim()||'(no answer)');}
  if(ex.type==='order'){
    var seq=correct?ex.order:(a.seq||[]);
    return seq.map(function(id,i){var it=ex.items.filter(function(x){return x.id===id;})[0];return (i+1)+'. '+(it?it.t:id);}).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='categorize'){
    return ex.items.map(function(it){
      var z=correct?it.zone:((a.place||{})[it.id]);
      return it.t+' \u2192 '+(z?zoneLabel(ex,z):'(not placed)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='match'){
    return ex.lefts.map(function(l){
      var rid=correct?ex.map[l.id].r:((a.map||{})[l.id]);
      return l.t+' \u2192 '+(rid?rightT(ex,rid):'(no match)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='fill'){
    return Object.keys(ex.slots).map(function(sid,i){
      var w=correct?ex.slots[sid].ok[0]:((a.place||{})[sid]);
      return 'Blank '+(i+1)+': '+(w||'(empty)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='terminal'){return correct?ex.canonical:(String(a.cmd||'').trim()||'(no command)');}
  if(ex.type==='triage'){
    return ex.alerts.map(function(al,i){
      var wanto=al.options.filter(function(o){return o.ok;})[0]||{};
      var gott=(a.pick||{})[al.id];
      var goto=gott?(al.options.filter(function(o){return o.id===gott;})[0]||{}).t:'';
      return 'Alert '+(i+1)+': '+(correct?wanto.t:(goto||'(no answer)'));
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='steps'){
    return ex.steps.map(function(s,i){
      var wanto=s.options.filter(function(o){return o.ok;})[0]||{};
      var gott=(a.pick||{})[i];
      var goto=gott?(s.options.filter(function(o){return o.id===gott;})[0]||{}).t:'';
      return 'Step '+(i+1)+': '+(correct?wanto.t:(goto||'(no answer)'));
    }).join(' &nbsp;|&nbsp; ');
  }
  return '';
}
function renderResults(){
  S.phase='results';
  if(S.timer.isRunning){S.timer.isRunning=false;}
  updateScore();
  var fullN=0,partN=0,badN=0,naN=0;
  var themes={};
  S.order.forEach(function(id){
    var ex=EX_BY_ID[id], st=S.st[id];
    if(!st||!st.checked){naN++;return;}
    var p=st.graded.pts;
    if(p>=100)fullN++;else if(p>=1)partN++;else badN++;
    var th=themes[ex.theme]||(themes[ex.theme]={n:0,e:0});
    th.n++; th.e+=p;
  });
  var pct=S.possible>0?Math.round(S.earned/S.possible*100):0;
  var passed=pct>=EXAM.passMark;
  var stage=$('stage');
  var h='<div class="hero center"><div class="tag">'+esc(EXAM.title)+'</div><div class="bigscore">'+pct+'%</div>';
  h+='<div class="'+(passed?'passpanel':'passpanel failpanel')+'"><div style="font-size:34px">'+icon(passed?'check':'cross',36)+'</div><h2 style="justify-content:center;display:flex">'+(passed?'PASS &#8212; well done':'FAIL &#8212; retake needed')+'</h2><p class="muted">Pass mark: '+EXAM.passMark+'%. You answered '+S.answered+' of '+S.order.length+' exercises.</p></div></div>';
  h+='<div class="grid2">';
  h+='<div class="statcard"><div class="n st-ok">'+fullN+'</div><div class="l">&#10003; Fully correct (100 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-part">'+partN+'</div><div class="l">&#9686; Partially correct (1&#8211;99 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-bad">'+badN+'</div><div class="l">&#10007; Incorrect (0 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-na">'+naN+'</div><div class="l">&#9888; Not answered &#8212; excluded</div></div>';
  h+='<div class="statcard"><div class="n">'+S.earned+' / '+S.possible+'</div><div class="l">Points over answered exercises</div></div>';
  h+='</div>';
  h+='<div class="card"><h2>'+icon('shield',18)+' Per-theme breakdown</h2><table class="rep"><thead><tr><th>Theme</th><th>Answered</th><th>Points</th></tr></thead><tbody>';
  Object.keys(themes).forEach(function(t){h+='<tr><td>'+esc(t)+'</td><td>'+themes[t].n+'</td><td>'+themes[t].e+' / '+(themes[t].n*100)+'</td></tr>';});
  if(!Object.keys(themes).length){h+='<tr><td colspan="3" class="muted">No answered exercises.</td></tr>';}
  h+='</tbody></table></div>';
  h+='<div class="card"><h2>'+icon('doc',18)+' Detailed report</h2>';
  S.order.forEach(function(id,i){
    var ex=EX_BY_ID[id], st=S.st[id];
    var g=st&&st.graded;
    var stt=g?statusOf(g.pts):'na';
    var word=g?statusWord(g.pts).join(' ').replace('CHECK','CORRECT'):'NOT ANSWERED &#8212; EXCLUDED';
    var w2=g?statusWord(g.pts):['warn','NOT ANSWERED &#8212; EXCLUDED'];
    var cls=g?{good:'st-ok',part:'st-part',bad:'st-bad'}[stt]:'st-na';
    h+='<div class="repitem"><div class="rh"><span class="'+cls+'">'+icon(w2[0],14)+' '+w2[1]+'</span><span class="hchip">'+(i+1)+'</span><span>'+esc(TYPE_LABEL[ex.type])+'</span><span class="muted">'+esc(ex.theme)+'</span>'+(g?'<span class="hchip">'+g.pts+' / 100</span>':'')+'</div>';
    h+='<div class="rb"><span class="lbl">Scenario:</span> '+esc(ex.scenario.summary)+'</div>';
    h+='<div class="rb"><span class="lbl">Your answer:</span> '+(st&&!st.checked?'<span class="muted">Not answered &#8212; excluded from score</span>':esc(answerSummary(ex,st,false)))+'</div>';
    if(st&&st.checked){
      h+='<div class="rb"><span class="lbl">Correct answer:</span> '+esc(answerSummary(ex,st,true))+'</div>';
      if(g){
        h+=listHTML(g.right||[],'good','check');
        h+=listHTML(g.wrong||[],'bad','cross');
        h+=listHTML(g.missed||[],'miss','part');
      }
      h+='<div class="rb"><span class="lbl">Why:</span> '+esc(ex.fb.why||'')+'</div>';
      if(g&&g.canonical){h+='<div class="rb codebox"><span>'+esc(g.canonical)+'</span></div>';}
    }
    h+='<div class="rb"><span class="lbl">What to study:</span> '+esc(ex.fb.study||'')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="center mb"><button class="btn pri" id="b-retake">'+icon('play',15)+' Retake exam</button></div>';
  stage.innerHTML=h;
  renderHeader();
  $('b-retake').addEventListener('click',retake);
  reportScore();
}
function reportScore(){
  if(S.reported) return;
  S.reported=true;
  if(window.parent===window) return;
  var pct=S.possible>0?Math.round(S.earned/S.possible*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      batch:EXAM.batch,
      score:S.earned,
      total:S.possible,
      percent:pct,
      passed:pct>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}
function retake(){
  S.attempt++; S.reported=false; S.idx=0; S.st={}; S.skipped=[];
  S.earned=0; S.possible=0; S.answered=0;
  S.timer.remain=EXAM.timerSeconds; S.timer.isRunning=true;
  S.timer.isManuallyPaused=false; S.timer.isAutoPausedAfterCheck=false;
  S.order=safeOrder();
  S.order.forEach(function(id){initSt(EX_BY_ID[id]);});
  renderExercise();
}

/* ============ attempt init ============ */
function initSt(ex){
  var st={answer:{},checked:false,hint:false,skipped:false,graded:null};
  if(ex.type==='qcm'){st.optOrder=shuffle(ex.options.map(function(o){return o.id;}));st.answer.picked=[];}
  if(ex.type==='input'){st.answer.text='';}
  if(ex.type==='order'){st.answer.seq=shuffle(ex.items.map(function(i){return i.id;}));}
  if(ex.type==='categorize'){st.answer.place={};st.bankOrder=shuffle(ex.items.map(function(i){return i.id;}));}
  if(ex.type==='match'){st.answer.map={};st.rightsOrder=shuffle(ex.rights.map(function(r){return r.id;}));}
  if(ex.type==='fill'){st.answer.place={};st.bankOrder=shuffle(ex.bank.slice());}
  if(ex.type==='terminal'){st.answer.cmd='';}
  if(ex.type==='triage'){st.answer.pick={};st.alertOrder=shuffle(ex.alerts.map(function(a){return a.id;}));}
  if(ex.type==='steps'){st.answer.pick={};st.stepLock=0;}
  S.st[ex.id]=st;
}
function safeOrder(){
  var ids;
  for(var tries=0;tries<40;tries++){
    ids=shuffle(EXAM.exercises.map(function(e){return e.id;}));
    var termIdx=[];
    ids.forEach(function(id,i){ if(EX_BY_ID[id].type==='terminal') termIdx.push(i); });
    var adjacent=false;
    for(var i=1;i<termIdx.length;i++){ if(termIdx[i]-termIdx[i-1]<2){adjacent=true;break;} }
    if(!adjacent) return ids;
  }
  /* fallback: swap the second terminal away from the first */
  var ti=[];
  ids.forEach(function(id,i){ if(EX_BY_ID[id].type==='terminal') ti.push(i); });
  if(ti.length>1 && ti[1]===ti[0]+1){
    var j=(ti[1]+2<ids.length)?ti[1]+2:ti[1]-2;
    if(j>=0&&j<ids.length){var t=ids[ti[1]];ids[ti[1]]=ids[j];ids[j]=t;}
  }
  return ids;
}
function startAttempt(){
  S.phase='exercise'; S.idx=0; S.st={}; S.skipped=[]; S.earned=0; S.possible=0; S.answered=0;
  S.timer.remain=EXAM.timerSeconds; S.timer.total=EXAM.timerSeconds;
  S.timer.isRunning=true; S.timer.isManuallyPaused=false; S.timer.isAutoPausedAfterCheck=false;
  S.order=safeOrder();
  S.order.forEach(function(id){initSt(EX_BY_ID[id]);});
  renderExercise();
}

/* ============ hint ============ */
function doHint(){
  var ex=curEx(), st=S.st[ex.id];
  if(!ex||!st||st.hint||st.checked) return;
  st.hint=true;
  $('hintarea').innerHTML='<div class="panel" style="border-color:rgba(255,180,84,.5)"><div class="panel-h" style="color:var(--amber)">'+icon('bulb',13)+' Hint &#8212; this exercise now scores at most 90/100</div><div class="panel-b">'+esc(ex.hint)+'</div></div>';
  renderHeaderButtons();
}

/* ============ intro ============ */
function renderIntro(){
  S.phase='intro';
  $('stage').innerHTML=EXAM.introHTML;
  var b=$('b-start');
  if(b) b.addEventListener('click',startAttempt);
  renderHeader();
}

/* ============ handshake ============ */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    S.user.name=event.data.username||'';
    var w=$('welcomeline');
    if(w&&S.user.name){w.textContent='Welcome, '+S.user.name+'. Your result stays on this device.';}
  }catch(e){}
});

/* ============ boot ============ */
document.addEventListener('DOMContentLoaded',function(){
  $('b-hint').addEventListener('click',doHint);
  $('b-pause').addEventListener('click',function(){if(S.timer.isManuallyPaused){manualResume();}else{manualPause();}});
  $('b-skip').addEventListener('click',doSkip);
  $('b-finish').addEventListener('click',finishExam);
  $('b-resume').addEventListener('click',manualResume);
  renderIntro();
});

</script>
