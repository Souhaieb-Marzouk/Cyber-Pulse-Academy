/* ============ results ============ */
function answerSummary(ex,st,correct){
  var a=(st&&st.answer)||{}; var parts=[];
  if(ex.type==='qcm'){
    if(correct){return ex.correct.map(function(c){return labelOf(ex,c);}).join(' | ');}
    var pk=a.picked||[]; return pk.length?pk.map(function(p){return labelOf(ex,p);}).join(' | '):'(nothing selected)';
  }
  if(ex.type==='input'){return correct?ex.accept[0]:(String(a.text||'').trim()||'(no answer)');}
  if(ex.type==='order'){
    var seq=correct?ex.order:(a.seq||[]);
    return seq.map(function(id,i){var it=ex.items.filter(function(x){return x.id===id;})[0];return (i+1)+'. '+(it?it.t:id);}).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='categorize'){
    return ex.items.map(function(it){
      var z=correct?it.zone:((a.place||{})[it.id]);
      return it.t+' \u2192 '+(z?zoneLabel(ex,z):'(not placed)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='match'){
    return ex.lefts.map(function(l){
      var rid=correct?ex.map[l.id].r:((a.map||{})[l.id]);
      return l.t+' \u2192 '+(rid?rightT(ex,rid):'(no match)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='fill'){
    return Object.keys(ex.slots).map(function(sid,i){
      var w=correct?ex.slots[sid].ok[0]:((a.place||{})[sid]);
      return 'Blank '+(i+1)+': '+(w||'(empty)');
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='terminal'){return correct?ex.canonical:(String(a.cmd||'').trim()||'(no command)');}
  if(ex.type==='triage'){
    return ex.alerts.map(function(al,i){
      var wanto=al.options.filter(function(o){return o.ok;})[0]||{};
      var gott=(a.pick||{})[al.id];
      var goto=gott?(al.options.filter(function(o){return o.id===gott;})[0]||{}).t:'';
      return 'Alert '+(i+1)+': '+(correct?wanto.t:(goto||'(no answer)'));
    }).join(' &nbsp;|&nbsp; ');
  }
  if(ex.type==='steps'){
    return ex.steps.map(function(s,i){
      var wanto=s.options.filter(function(o){return o.ok;})[0]||{};
      var gott=(a.pick||{})[i];
      var goto=gott?(s.options.filter(function(o){return o.id===gott;})[0]||{}).t:'';
      return 'Step '+(i+1)+': '+(correct?wanto.t:(goto||'(no answer)'));
    }).join(' &nbsp;|&nbsp; ');
  }
  return '';
}
function renderResults(){
  S.phase='results';
  if(S.timer.isRunning){S.timer.isRunning=false;}
  updateScore();
  var fullN=0,partN=0,badN=0,naN=0;
  var themes={};
  S.order.forEach(function(id){
    var ex=EX_BY_ID[id], st=S.st[id];
    if(!st||!st.checked){naN++;return;}
    var p=st.graded.pts;
    if(p>=100)fullN++;else if(p>=1)partN++;else badN++;
    var th=themes[ex.theme]||(themes[ex.theme]={n:0,e:0});
    th.n++; th.e+=p;
  });
  var pct=S.possible>0?Math.round(S.earned/S.possible*100):0;
  var passed=pct>=EXAM.passMark;
  var stage=$('stage');
  var h='<div class="hero center"><div class="tag">'+esc(EXAM.title)+'</div><div class="bigscore">'+pct+'%</div>';
  h+='<div class="'+(passed?'passpanel':'passpanel failpanel')+'"><div style="font-size:34px">'+icon(passed?'check':'cross',36)+'</div><h2 style="justify-content:center;display:flex">'+(passed?'PASS &#8212; well done':'FAIL &#8212; retake needed')+'</h2><p class="muted">Pass mark: '+EXAM.passMark+'%. You answered '+S.answered+' of '+S.order.length+' exercises.</p></div></div>';
  h+='<div class="grid2">';
  h+='<div class="statcard"><div class="n st-ok">'+fullN+'</div><div class="l">&#10003; Fully correct (100 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-part">'+partN+'</div><div class="l">&#9686; Partially correct (1&#8211;99 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-bad">'+badN+'</div><div class="l">&#10007; Incorrect (0 pts)</div></div>';
  h+='<div class="statcard"><div class="n st-na">'+naN+'</div><div class="l">&#9888; Not answered &#8212; excluded</div></div>';
  h+='<div class="statcard"><div class="n">'+S.earned+' / '+S.possible+'</div><div class="l">Points over answered exercises</div></div>';
  h+='</div>';
  h+='<div class="card"><h2>'+icon('shield',18)+' Per-theme breakdown</h2><table class="rep"><thead><tr><th>Theme</th><th>Answered</th><th>Points</th></tr></thead><tbody>';
  Object.keys(themes).forEach(function(t){h+='<tr><td>'+esc(t)+'</td><td>'+themes[t].n+'</td><td>'+themes[t].e+' / '+(themes[t].n*100)+'</td></tr>';});
  if(!Object.keys(themes).length){h+='<tr><td colspan="3" class="muted">No answered exercises.</td></tr>';}
  h+='</tbody></table></div>';
  h+='<div class="card"><h2>'+icon('doc',18)+' Detailed report</h2>';
  S.order.forEach(function(id,i){
    var ex=EX_BY_ID[id], st=S.st[id];
    var g=st&&st.graded;
    var stt=g?statusOf(g.pts):'na';
    var word=g?statusWord(g.pts).join(' ').replace('CHECK','CORRECT'):'NOT ANSWERED &#8212; EXCLUDED';
    var w2=g?statusWord(g.pts):['warn','NOT ANSWERED &#8212; EXCLUDED'];
    var cls=g?{good:'st-ok',part:'st-part',bad:'st-bad'}[stt]:'st-na';
    h+='<div class="repitem"><div class="rh"><span class="'+cls+'">'+icon(w2[0],14)+' '+w2[1]+'</span><span class="hchip">'+(i+1)+'</span><span>'+esc(TYPE_LABEL[ex.type])+'</span><span class="muted">'+esc(ex.theme)+'</span>'+(g?'<span class="hchip">'+g.pts+' / 100</span>':'')+'</div>';
    h+='<div class="rb"><span class="lbl">Scenario:</span> '+esc(ex.scenario.summary)+'</div>';
    h+='<div class="rb"><span class="lbl">Your answer:</span> '+(st&&!st.checked?'<span class="muted">Not answered &#8212; excluded from score</span>':esc(answerSummary(ex,st,false)))+'</div>';
    if(st&&st.checked){
      h+='<div class="rb"><span class="lbl">Correct answer:</span> '+esc(answerSummary(ex,st,true))+'</div>';
      if(g){
        h+=listHTML(g.right||[],'good','check');
        h+=listHTML(g.wrong||[],'bad','cross');
        h+=listHTML(g.missed||[],'miss','part');
      }
      h+='<div class="rb"><span class="lbl">Why:</span> '+esc(ex.fb.why||'')+'</div>';
      if(g&&g.canonical){h+='<div class="rb codebox"><span>'+esc(g.canonical)+'</span></div>';}
    }
    h+='<div class="rb"><span class="lbl">What to study:</span> '+esc(ex.fb.study||'')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="center mb"><button class="btn pri" id="b-retake">'+icon('play',15)+' Retake exam</button></div>';
  stage.innerHTML=h;
  renderHeader();
  $('b-retake').addEventListener('click',retake);
  reportScore();
}
function reportScore(){
  if(S.reported) return;
  S.reported=true;
  if(window.parent===window) return;
  var pct=S.possible>0?Math.round(S.earned/S.possible*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      batch:EXAM.batch,
      score:S.earned,
      total:S.possible,
      percent:pct,
      passed:pct>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}
function retake(){
  S.attempt++; S.reported=false; S.idx=0; S.st={}; S.skipped=[];
  S.earned=0; S.possible=0; S.answered=0;
  S.timer.remain=EXAM.timerSeconds; S.timer.isRunning=true;
  S.timer.isManuallyPaused=false; S.timer.isAutoPausedAfterCheck=false;
  S.order=safeOrder();
  S.order.forEach(function(id){initSt(EX_BY_ID[id]);});
  renderExercise();
}

/* ============ attempt init ============ */
function initSt(ex){
  var st={answer:{},checked:false,hint:false,skipped:false,graded:null};
  if(ex.type==='qcm'){st.optOrder=shuffle(ex.options.map(function(o){return o.id;}));st.answer.picked=[];}
  if(ex.type==='input'){st.answer.text='';}
  if(ex.type==='order'){st.answer.seq=shuffle(ex.items.map(function(i){return i.id;}));}
  if(ex.type==='categorize'){st.answer.place={};st.bankOrder=shuffle(ex.items.map(function(i){return i.id;}));}
  if(ex.type==='match'){st.answer.map={};st.rightsOrder=shuffle(ex.rights.map(function(r){return r.id;}));}
  if(ex.type==='fill'){st.answer.place={};st.bankOrder=shuffle(ex.bank.slice());}
  if(ex.type==='terminal'){st.answer.cmd='';}
  if(ex.type==='triage'){st.answer.pick={};st.alertOrder=shuffle(ex.alerts.map(function(a){return a.id;}));}
  if(ex.type==='steps'){st.answer.pick={};st.stepLock=0;}
  S.st[ex.id]=st;
}
function safeOrder(){
  var ids;
  for(var tries=0;tries<40;tries++){
    ids=shuffle(EXAM.exercises.map(function(e){return e.id;}));
    var termIdx=[];
    ids.forEach(function(id,i){ if(EX_BY_ID[id].type==='terminal') termIdx.push(i); });
    var adjacent=false;
    for(var i=1;i<termIdx.length;i++){ if(termIdx[i]-termIdx[i-1]<2){adjacent=true;break;} }
    if(!adjacent) return ids;
  }
  /* fallback: swap the second terminal away from the first */
  var ti=[];
  ids.forEach(function(id,i){ if(EX_BY_ID[id].type==='terminal') ti.push(i); });
  if(ti.length>1 && ti[1]===ti[0]+1){
    var j=(ti[1]+2<ids.length)?ti[1]+2:ti[1]-2;
    if(j>=0&&j<ids.length){var t=ids[ti[1]];ids[ti[1]]=ids[j];ids[j]=t;}
  }
  return ids;
}
function startAttempt(){
  S.phase='exercise'; S.idx=0; S.st={}; S.skipped=[]; S.earned=0; S.possible=0; S.answered=0;
  S.timer.remain=EXAM.timerSeconds; S.timer.total=EXAM.timerSeconds;
  S.timer.isRunning=true; S.timer.isManuallyPaused=false; S.timer.isAutoPausedAfterCheck=false;
  S.order=safeOrder();
  S.order.forEach(function(id){initSt(EX_BY_ID[id]);});
  renderExercise();
}

/* ============ hint ============ */
function doHint(){
  var ex=curEx(), st=S.st[ex.id];
  if(!ex||!st||st.hint||st.checked) return;
  st.hint=true;
  $('hintarea').innerHTML='<div class="panel" style="border-color:rgba(255,180,84,.5)"><div class="panel-h" style="color:var(--amber)">'+icon('bulb',13)+' Hint &#8212; this exercise now scores at most 90/100</div><div class="panel-b">'+esc(ex.hint)+'</div></div>';
  renderHeaderButtons();
}

/* ============ intro ============ */
function renderIntro(){
  S.phase='intro';
  $('stage').innerHTML=EXAM.introHTML;
  var b=$('b-start');
  if(b) b.addEventListener('click',startAttempt);
  renderHeader();
}

/* ============ handshake ============ */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    S.user.name=event.data.username||'';
    var w=$('welcomeline');
    if(w&&S.user.name){w.textContent='Welcome, '+S.user.name+'. Your result stays on this device.';}
  }catch(e){}
});

/* ============ boot ============ */
document.addEventListener('DOMContentLoaded',function(){
  $('b-hint').addEventListener('click',doHint);
  $('b-pause').addEventListener('click',function(){if(S.timer.isManuallyPaused){manualResume();}else{manualPause();}});
  $('b-skip').addEventListener('click',doSkip);
  $('b-finish').addEventListener('click',finishExam);
  $('b-resume').addEventListener('click',manualResume);
  renderIntro();
});

</script>
