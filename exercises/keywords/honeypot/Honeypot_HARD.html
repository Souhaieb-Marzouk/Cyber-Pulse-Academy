<script>
'use strict';
/* CyberPulse Academy — self-contained exam engine, core (part A) */
var TOPIC_ID,BATCH,PASS_MARK,TIME_SECS,SEV_LABEL,EXS,INTRO,THEMES;
var S={order:[],idx:0,recs:{},skipped:[],phase:'intro',tLeft:0,timerId:null,paused:false,reported:false,uname:'',exTimerId:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function txt(s){return String(s).replace(/<[^>]*>/g,'');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function div(cls){var d=document.createElement('div');if(cls)d.className=cls;return d;}
function fmtT(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function ncmd(s){return String(s).replace(/\s+/g,' ').trim().replace(/\[\.\]/g,'.');}
function rec(i){if(!S.recs[i])S.recs[i]={status:'pending',earned:0,hint:false,detail:'',g:null};return S.recs[i];}
function earnedTotal(){var p=0,k;for(k in S.recs){if(S.recs[k].status==='answered')p+=S.recs[k].earned;}return p;}
function updHdr(){if(!S.order.length)return;$('h-count').textContent='Exercise '+(S.idx+1)+' of '+S.order.length;$('h-score').textContent=earnedTotal()+' pts';$('t-min').textContent=fmtT(S.tLeft);$('h-timer').classList.toggle('low',S.tLeft<=60);$('pbar').style.width=Math.round((S.idx+1)/S.order.length*100)+'%';}
function startTimer(){S.tLeft=TIME_SECS;if(S.timerId)clearInterval(S.timerId);S.timerId=setInterval(function(){if(S.paused)return;S.tLeft--;updHdr();if(S.tLeft<=0){clearInterval(S.timerId);timeUp();}},1000);}
function startExTimer(sec,onEnd){stopExTimer();var left=sec;S.exTimerId=setInterval(function(){if(S.paused)return;left--;var e=$('extimer');if(e)e.textContent=fmtT(left);if(left<=0){stopExTimer();onEnd();}},1000);}
function stopExTimer(){if(S.exTimerId){clearInterval(S.exTimerId);S.exTimerId=null;}}
function setPaused(p){if(S.phase!=='exam'&&S.phase!=='review')return;S.paused=p;$('pause-ov').classList.toggle('hidden',!p);}
function timeUp(){stopExTimer();S.paused=false;$('pause-ov').classList.add('hidden');showResults(true);}
function startExam(){S.order=shuf(EXS.map(function(e,i){return i;}));S.idx=0;S.recs={};S.skipped=[];S.reported=false;S.phase='exam';$('scr-intro').classList.add('hidden');$('scr-results').classList.add('hidden');$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');$('hdr').classList.remove('hidden');startTimer();renderCurrent();}
function renderCurrent(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);$('btn-skip').disabled=(r.status==='answered'||r.status==='timedout');$('btn-hint').disabled=(r.status==='answered'||r.status==='timedout'||r.hint);updHdr();renderExercise(ex,ei);window.scrollTo(0,0);}
function nextStep(){if(S.idx<S.order.length-1){S.idx++;renderCurrent();}else{if(S.skipped.length>0){showReview();}else{finishExam();}}}
function skipCur(){var ei=S.order[S.idx],r=rec(ei);if(r.status==='answered'||r.status==='timedout')return;stopExTimer();r.status='skipped';if(S.skipped.indexOf(ei)<0)S.skipped.push(ei);nextStep();}
function hintCur(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);if(r.hint||r.status==='answered'||r.status==='timedout')return;r.hint=true;var hp=$('hintpanel');if(hp){hp.innerHTML='<b>Hint used — this exercise now earns 90% of its points:</b> '+ex.hint;hp.classList.remove('hidden');}$('btn-hint').disabled=true;}
function returnTo(ei){S.phase='exam';$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');S.idx=S.order.indexOf(ei);renderCurrent();}
function showReview(){S.phase='review';$('scr-exam').classList.add('hidden');$('scr-results').classList.add('hidden');$('hdr').classList.remove('hidden');var rv=$('scr-review');rv.classList.remove('hidden');var h='<div class="introcard"><h1>Review skipped exercises</h1><p>You have skipped <b>'+S.skipped.length+'</b> exercise(s). You may return to any of them and answer it now. You can repeat this as often as you want, until the timer ends or you submit.</p><p>If you submit while an exercise is still unanswered, that exercise is <b>excluded from the score</b>: it does not count as right and does not count as wrong.</p><p>⏱ Time left: <b>'+fmtT(S.tLeft)+'</b></p><div id="skiplist"></div><div class="submitrow"><button class="btn" id="btn-finalsubmit" type="button">Submit exam now</button></div></div>';rv.innerHTML=h;var l=$('skiplist');S.skipped.slice().sort(function(a,b){return S.order.indexOf(a)-S.order.indexOf(b);}).forEach(function(ei){var ex=EXS[ei],d=div('repitem');d.innerHTML='<b>'+esc(ex.title)+'</b> &nbsp;<span class="rs skip">⚠ Skipped — not answered</span><div class="submitrow"><button class="btn sec" type="button">Return to this exercise</button></div>';d.querySelector('button').addEventListener('click',function(){returnTo(ei);});l.appendChild(d);});$('btn-finalsubmit').addEventListener('click',finishExam);window.scrollTo(0,0);}
function finishExam(){stopExTimer();showResults(false);}
function showResults(timedOut){S.phase='results';stopExTimer();$('hdr').classList.add('hidden');$('scr-exam').classList.add('hidden');$('scr-review').classList.add('hidden');var rs=$('scr-results');rs.classList.remove('hidden');
var answered=0,earned=0,full=0,part=0,wrong=0,excl=0;
EXS.forEach(function(ex,i){var r=S.recs[i];if(r&&r.status==='answered'){answered++;earned+=r.earned;if(r.earned>=100){full++;}else if(r.earned>0){part++;}else{wrong++;}}else{excl++;}});
var total=answered,pct=total>0?Math.round(earned/total):0,sc=total>0?Math.round(earned/10)/10:0,passed=(total>0&&pct>=PASS_MARK);
var stats='<div class="statgrid">'
+'<div class="stat"><div class="n">'+full+'</div><div class="lbl">✓ Fully correct</div></div>'
+'<div class="stat"><div class="n">'+part+'</div><div class="lbl">~ Partial credit</div></div>'
+'<div class="stat"><div class="n">'+wrong+'</div><div class="lbl">✗ Incorrect</div></div>'
+'<div class="stat"><div class="n">'+excl+'</div><div class="lbl">⚠ Not answered — excluded</div></div>'
+'</div>';
var hero='<div class="result-hero">'+(passed?'<div class="big" style="color:var(--green)">PASS</div>':'<div class="big" style="color:var(--red)">FAIL</div>')
+'<div class="passline">'+(passed?'Congratulations — you passed the '+SEV_LABEL+' certification exam.':'You did not reach the pass mark of '+PASS_MARK+'%. You must retake this exam.')+'</div>'
+'<div style="font-size:34px;font-weight:900;margin-top:10px">'+pct+'%</div>'
+'<div style="color:var(--dim)">'+sc+' fully-correct equivalent(s) of '+total+' answered — percentage is computed only over what you answered</div>'
+(timedOut?'<p style="color:var(--amber);margin-top:10px">⏱ Time ran out. Exercises you never answered were excluded from the score.</p>':'')
+'</div>';

kw:"Honeypot",
h1:"Honeypot — HARD certification exam",
paras:[
"<b>Hard means close.</b> At this tier the obvious answer is sometimes wrong, near-miss answers are technically defensible in other contexts, and at least a third of the exercises are built so the 'alarming' thing is benign — or the benign-looking thing is the alarm. You will correlate artefacts the way a senior analyst does: a session summary against threat intel, a gateway log against a change ticket, a decoy session against production telemetry.",
"<b>The two directions of deception.</b> Blue side: you design deception grids (fleets of decoys), tune fidelity so decoys resist <b>fingerprinting</b>, and wire honeypot captures into evidence-grade workflows. Red side: you think like an attacker who maps decoys before touching them, and you learn which attacker behaviours — banner grabs, timing probes, deliberate mistakes — reveal a scripted honeypot. Several exercises ask for both views on the same scenario.",
"<b>When the decoy becomes a problem.</b> The worst honeypot event is not a loud exploit; it is an <b>outbound connection</b> — the attacker has escaped the decoy and may be attacking third parties from your infrastructure. That is a containment failure with a legal tail: liability, chain of custody, and the discipline to capture evidence <i>before</i> changing anything. Two of these exercises put you exactly there, with one safe path and several tempting destructive ones.",
"<b>Tools under pressure.</b> The terminal exercises no longer name the tool. You get the objective and the environment; choosing the right tool and the right flags is the test, and near-miss flags produce similar-looking but wrong results. Everything else — ATT&CK mapping, urgency ranking, quiet red-team reconnaissance — demands three interacting ideas per exercise. Budget your 40 minutes accordingly."
],

"<b>Scoring:</b> each exercise is worth 100 points; matching, ordering and design-review exercises give partial credit. Only answered exercises count toward the percentage.",
"<b>Hints:</b> one per exercise, −10%. A HARD hint removes one wrong path — it never names the correct concept.",
"<b>Skipping:</b> Skip moves the exercise to a review pool without revealing anything. Return as often as you like before finishing; still-unanswered exercises are excluded from the score at submit.",

EXS=[
{id:"h1",title:"Find the fingerprint test",type:"logview",summary:"Cowrie session 8f31 from 45[.]83[.]220[.]19 — possible decoy fingerprint test",
scenario:{text:"Cowrie recorded one session from 45[.]83[.]220[.]19. The analyst suspects the visitor was testing whether the honeypot is fake. Filter the log and find the line where the visitor runs a classic emulation probe: a command that makes a real shell fail in a very specific wording, which scripted honeypots usually get wrong."},
question:"Filter if you need to, then click the one line that shows an emulation probe.",
hint:"Real bash reports a failed arithmetic expression in a very specific wording. Scripts often reword it — and running the same version query twice is another hint about what this visitor was doing.",
answer:{fHint:"try: 8f31 or echo",correct:7,lines:[
"02:18:01 session=8f31 New connection from 45[.]83[.]220[.]19:44318",
"02:18:06 session=8f31 login attempt root/toor — FAILED",
"02:18:11 session=8f31 login attempt admin/admin — FAILED",
"02:18:16 session=8f31 login success root/x7Pq2m",
"02:18:22 session=8f31 command: uname -r",
"02:18:24 session=8f31 command: uname -r",
"02:18:30 session=8f31 command: cat /proc/cpuinfo",
"02:18:38 session=8f31 command: echo $((1/0))",
"02:18:38 session=8f31 response: bash: division by 0",
"02:18:45 session=8f31 command: id",
"02:18:50 session=8f31 command: uptime",
"02:18:58 session=8f31 connection closed"]},
feedback:{why:"echo $((1/0)) is a deliberate mistake: real bash prints 'bash: 1/0: division by 0 (error token is \"1/0\")' with exact wording and the offending token. The decoy's shorter reply 'bash: division by 0' is the classic slip of a scripted emulation. The double uname -r is a timing-consistency probe that supports the same read — but the probe line itself is the echo command.",study:"Common honeypot fingerprint probes: arithmetic errors, malformed input, timing consistency."}},
{id:"h2",title:"Outbound from the decoy",type:"qcm",summary:"Gateway log + change ticket DEP-991 — outbound SSH from decoy hp-fin-01",
scenario:{text:"Two artefacts landed in your queue at the same minute.",artefacts:[
{label:"Gateway log",lines:["03:41:12 — hp-fin-01 (decoy) → 198[.]51[.]100[.]240:22 — ALLOWED (rule hp-egress-err)","03:41:15 — session established, 1.2 kB sent"]},
{label:"Change ticket DEP-991",lines:["Tuesday — vendor engineer reworked honeypot egress rules","Status: implemented, NOT yet peer-reviewed","Intended state: deny all egress from decoy VLAN"]}]},
question:"The decoy just opened an SSH connection to an outside host. What most likely happened, and what is the immediate risk?",
hint:"One artefact explains how it could leave; the other shows that it did.",
answer:{opts:[{t:"The decoy is downloading security updates; nothing is wrong"},{t:"The rule change failed closed, so the traffic was blocked outside"},{t:"The decoy was escaped and misused; your organisation could be liable",c:true},{t:"Clock skew duplicated an old gateway log entry from yesterday"}]},
feedback:{why:"An outbound connection from a honeypot is the worst-case signal: the attacker may have escaped the decoy and is using it as a platform. The unreviewed egress change explains how the traffic was allowed out — the gateway log shows it actually left. Beyond detection there is a legal tail: attacks launched from your infrastructure can make your organisation responsible. Treat it as a containment failure, not a log oddity.",study:"Data control failures and third-party liability."}},
{id:"h3",title:"Capture the evidence",type:"term",summary:"Evidence host Debian 12 — court-grade packet capture of the suspicious host",
scenario:{text:"Legal needs court-grade traffic evidence, and the honeypot is still talking to the suspicious host.",artefacts:[
{label:"Environment",lines:["Evidence host: Debian 12 — root shell","Live interface: eth0","Suspicious source: 203[.]0[.]113[.]77","Evidence directory: /evidence (writable)"]},
{label:"Stakeholder",lines:["Legal: 'If this ever reaches court we need the full traffic on disk — not a screenshot, and not a partial file.'"]}]},
question:"Run the command that saves a complete packet capture of all traffic to and from 203[.]0[.]113[.]77 into a capture file under /evidence.",
hint:"You need the standard command-line packet tool, writing raw packets to a file. Printing packets on screen is not evidence.",
term:{prompt:"root@evidence:~#",banner:["Debian 12 — root shell — tcpdump available — no GUI","Target: 203[.]0[.]113[.]77 — interface eth0 — /evidence writable"],
check:function(cmd){var p=cmd.split(" ");var t0=p[0].toLowerCase();var TARGET="203[.]0[.]113[.]77".replace(/\[\.\]/g,".");
if(t0==="rm"||t0==="shred"||t0==="dd"||t0==="mkfs")return {kind:"danger",out:[],note:"That command destroys or overwrites data. On an evidence host it is the one unforgivable mistake."};
if(t0!=="tcpdump")return {kind:"unknown",out:[p[0]+": command not found"]};
var iface=null,w=false,wfile=null,r=false,cap=null,host=null,redirect=false,i;
if(cmd.indexOf(">")>=0)redirect=true;
for(i=1;i<p.length;i++){var a=p[i];
if(a==="-i"){iface=p[i+1]||null;i++;}
else if(a==="-w"){w=true;wfile=p[i+1]||null;i++;}
else if(a==="-r"){r=true;}
else if(a==="-c"){cap=p[i+1]||null;i++;}
else if(a==="-nn"||a==="-n"||a==="-s0"||a==="-U"||a==="-q"){}
else if(a==="host"){host=p[i+1]||null;i++;}
else if(a==="tcp"||a==="udp"||a==="port"){}
else if(a.charAt(0)==="-"){}
else if(wfile===null&&a.indexOf("/")===0){wfile=a;}
else if(host===null&&/^[0-9.]+$/.test(a)){host=a;}
else return {kind:"wrong",out:["tcpdump: unexpected argument — "+a],note:"Unexpected token: "+a};}
if(r)return {kind:"wrong",out:["tcpdump: reading from a file"],note:"-r reads a capture file; it does not record anything. You need -w to write."};
if(!w||redirect)return {kind:"wrong",out:["tcpdump: listening on eth0, link-type EN10MB (Ethernet)","09:41:01 IP 203[.]0[.]113[.]77.51022 > hp-fin-01.22: Flags [S]","09:41:01 IP hp-fin-01.22 > 203[.]0[.]113[.]77.51022: Flags [S.]","^C  (stopped — nothing was saved)"],note:"Without -w, tcpdump only prints packets to the screen: everything is lost when you stop it, and a redirect with > writes text, not a pcap. Legal asked for the traffic on disk."};
if(!wfile||wfile.indexOf("/evidence/")!==0||wfile.slice(-5)!==".pcap")return {kind:"wrong",out:["tcpdump: output target must be a .pcap under /evidence"],note:"Write the capture as a pcap file inside the evidence directory."};
if(cap)return {kind:"wrong",out:["tcpdump: packet count limit set"],note:"-c stops the capture after N packets. Legal asked for the complete traffic — a capped file is incomplete evidence."};
if(iface&&iface!=="eth0")return {kind:"wrong",out:["tcpdump: listening on "+iface],note:"The live interface in this environment is eth0. Capturing on another interface records the wrong traffic."};
if(!host||host!==TARGET)return {kind:"wrong",out:["tcpdump: missing host filter"],note:"Filter to the attacker's address with: host 203[.]0[.]113[.]77 — otherwise you capture the whole network."};
return {kind:"ok",out:["tcpdump: listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes","tcpdump: writing to /evidence/attacker.pcap","(capture running — packets to/from "+TARGET+" are being recorded)"]};},
canonical:"tcpdump -i eth0 -w /evidence/attacker.pcap host 203[.]0[.]113[.]77",
parts:["<b>tcpdump</b> — the standard command-line packet capture tool.","<b>-i eth0</b> — capture on the live interface.","<b>-w /evidence/attacker.pcap</b> — write raw packets to a pcap file. Without it, output only goes to the screen and is lost on exit; a shell redirect (>) produces a text file, not a pcap.","<b>host 203[.]0[.]113[.]77</b> — capture filter limited to that address.","Near-misses: <b>-r</b> reads a file instead of writing; <b>-c 100</b> stops after 100 packets (incomplete evidence)."]},
feedback:{why:"For court-grade evidence you write raw packets to a pcap file with tcpdump -w and filter to the attacker's address. Printing to screen, reading instead of writing, capping the packet count, or redirecting into a text file each fail the legal requirement in a different way. Extra flags that do not change semantics (-nn, -s0) are acceptable.",study:"Evidence-grade packet capture: tool, write flag, filter, target path."}},
{id:"h4",title:"Researcher or intruder?",type:"branch",
scenario:null,question:null,
hint:"Step one: match the behaviour to a pattern. Step two: ask where that password could have come from. Step three: weigh alerting the attacker against losing evidence.",
steps:[
{scenario:{text:"A visit to your internet-facing decoy, summarised:",artefacts:[
{label:"Session summary",lines:["03:10 — 45[.]83[.]220[.]19 full TCP connect, SSH banner grabbed,","two odd probes sent, disconnect after 40 seconds. No login attempt."]},
{label:"Threat intel",lines:["45[.]83[.]220[.]19 — range known for internet-wide banner grabbing","(research and scanning infrastructure, not a known criminal host)"]}]},
question:"Step 1 of 3 — what is the most reasonable read of this visit?",
type:"qcm",
answer:{opts:[{t:"A targeted intruder; escalate now"},{t:"Automated research scanning; log it and keep watching",c:true},{t:"A misconfigured internal backup job"},{t:"A broken honeypot service"}]},
feedback:{why:"A banner grab with short probes, no login attempt, and a 40-second session matches research scanning — and the intel agrees. It stays logged (decoy data is always kept) but it does not warrant waking anyone up. Calling it a targeted intruder without supporting signals is the alarmist shortcut.",study:"Baseline first: behaviour plus intel context beats a single alarming keyword."}},
{scenario:{text:"Three hours later, the same address returns:",artefacts:[
{label:"Session summary",lines:["02:41 — login success root/<canary-wiki-pw> — session 91c4","The password exists in exactly one place: a canary entry","planted in your PRIVATE wiki page about the honeypot project."]}]},
question:"Step 2 of 3 — now what does this mean?",
type:"qcm",
answer:{opts:[{t:"A lucky password guess; nobody reads that wiki anyway"},{t:"The honeypot logged itself in with the planted credential"},{t:"The wiki password was public by design, so nothing leaked"},{t:"An intruder used a stolen canary credential; investigate the leak and treat it as targeted",c:true}]},
feedback:{why:"That password was never used anywhere else and never left the wiki. Guessing it is not plausible; the only route is reading the wiki. So a credential leaked, and someone is deliberately using it against your decoy. This is now a targeted intrusion with an internal leak to investigate — the canary did its job.",study:"Canary tokens prove the leak path: wherever the token lived is where the read happened."}},
{scenario:{text:"The CISO needs a decision in ten minutes: block the address, or watch it?"},
question:"Step 3 of 3 — which response is correct here?",
type:"qcm",
answer:{opts:[{t:"Block the address and rebuild the honeypot immediately"},{t:"Unplug the honeypot from the network and end all observation now"},{t:"Keep the decoy running, strengthen capture, and brief the IR lead — watch quietly",c:true},{t:"Change the wiki password only and move on for tonight"}]},
feedback:{why:"Blocking tips the attacker off; they simply return from a new address and you lose the observation window. Quietly watching while strengthening capture keeps evidence flowing, and production stays protected because the exposure is the decoy, not real systems. The leak investigation runs in parallel. The least aggressive option is the correct one here.",study:"Evidence-first response: weigh what each option costs you in visibility."}}],
feedback:{why:"Correlating behaviour with intel separates research noise from an intruder; a canary credential converts suspicion into proof of an internal leak; and the right response preserves the observation window instead of burning it.",study:"Canary credentials, evidence-first response, and the cost of tipping off an attacker."}},
{id:"h5",title:"Design review: two mistakes",type:"spot",summary:"Deception deployment design — 6 bullets, exactly 2 mistakes",
scenario:{text:"You review a deception deployment design before build. Exactly two bullets are mistakes. Click both."},
question:"Click the two design mistakes.",
hint:"One mistake helps attackers map the decoy fleet. The other spreads regulated data into trap systems.",
answer:{pick:2,correct:[0,1],lines:[
"DEC-01 … DEC-10 — all ten decoys: identical OS build, identical uptime, identical SSH banner",
"DEC decoys store a copy of last quarter's real customer records (for realism)",
"DEC decoys run on a separate VLAN; all egress denied by default",
"All decoy sessions are forwarded to the SIEM in near real time",
"A canary token file is planted in the CFO's shared folder",
"Decoy names follow the normal naming scheme (DEC01, DEC02 …)"]},
feedback:{why:"Identical builds, uptimes and banners let an attacker fingerprint the entire fleet from one probe — vary builds and inject realistic noise. Copying real customer records into decoys spreads regulated data into trap systems: use realistic fake data instead; a breach of a decoy must never leak real PII. The other four bullets are solid practice.",study:"Fleet diversity, data minimisation, and what belongs in a decoy."}},
{id:"h6",title:"Rank what matters",type:"order",summary:"Four honeypot-derived incidents — rank by urgency",
scenario:{text:"Four honeypot-derived incidents are queued. Rank them from most to least urgent."},
question:"Order the four incidents: most urgent first.",
hint:"Ask two questions: is it active right now, and does it touch systems outside the decoy?",
answer:{items:["A: Outbound SSH from a decoy to an unknown VPS","B: Canary file 'Payroll_2026.xlsx' opened on the live file share","C: A decoy session downloaded a payload six days ago; that decoy was rebuilt since","D: 300 failed SSH logins on a decoy from a Tor exit node"],
correct:[0,1,3,2]},
feedback:{why:"A outranks everything: an outbound connection means loss of containment plus potential legal exposure to third parties. B is a live production signal — the canary fired where real work happens. D is real but contained attack traffic against a decoy with no access. C is stale: valuable history, but the session ended and the host was rebuilt — it informs the investigation, not tonight's page.",study:"Urgency = active harm × blast radius; staleness downgrades."}},
{id:"h7",title:"Map the attacker to ATT&CK",type:"match",summary:"One long decoy session — four actions to map to ATT&CK tactics",
scenario:{text:"One long decoy session produced four notable actions. Map each action to the MITRE ATT&CK tactic it belongs to. ATT&CK is a public map of attacker behaviours, sorted into goal-based tactics."},
question:"Place each observed action under the right tactic.",
hint:"Ask what the attacker is trying to achieve with each action, not which tool they used.",
answer:{zones:[{id:"disc",label:"Discovery"},{id:"cred",label:"Credential Access"},{id:"c2",label:"Command and Control"},{id:"lat",label:"Lateral Movement"}],
items:[{id:"a1",t:"Ran an internal network sweep with nmap",zone:"disc"},{id:"a2",t:"Dumped the fake credential store on the decoy",zone:"cred"},{id:"a3",t:"Downloaded a tool and beaconed to hxxp://c2[.]evil[.]example",zone:"c2"},{id:"a4",t:"Used the decoy to attempt an SMB login against the real file server",zone:"lat"}]},
feedback:{why:"Sweeping the network is Discovery. Harvesting credentials — even fake ones — is Credential Access. Beaconing to an external server is Command and Control. Trying to enter another real system from the decoy is Lateral Movement, and from a decoy it is simultaneously a containment alarm that outranks everything else.",study:"MITRE ATT&CK tactics as goals; decoy lateral movement = containment failure."}},
{id:"h8",title:"One decoy, two views",type:"branch",
scenario:null,question:null,
hint:"Blue: credential reuse is the loudest tell. Red: contrast, not contact, finds decoys.",
steps:[
{scenario:{text:"FIN-DECOY-03 is a finance-team decoy PC. This morning it received an SMB login from a real finance workstation's address, using that workstation's service account. The real workstation is running and shows no alerts."},
question:"Step 1 of 2 — blue team view: what does this most likely indicate?",
type:"qcm",
answer:{opts:[{t:"A normal backup job the decoy joined by mistake"},{t:"Stolen finance credentials being reused against the decoy",c:true},{t:"The decoy attacking the real workstation in return"},{t:"A clock mismatch between the two servers' logs"}]},
feedback:{why:"A service account from a real workstation reaching a decoy is the classic credential-theft-and-reuse pattern. The real workstation looks clean because the compromise is in the credentials, not the host. The decoy did its job: it caught movement that production monitoring missed.",study:"Decoy hits often mean credential theft — check where those credentials can be stolen."}},
{scenario:{text:"Red team view: you suspect FIN-DECOY-03 is fake. A direct scan would confirm it — and would also prove that you suspected deception."},
question:"Step 2 of 2 — red team view: which action tests the decoy while leaving the least evidence behind?",
type:"qcm",
answer:{opts:[{t:"Run a loud vulnerability scan against it"},{t:"Try every password on its login page"},{t:"Delete its network share and watch the response"},{t:"Compare its fingerprint with a known real host — quietly, writing nothing",c:true}]},
feedback:{why:"Passive comparison — banner, build, uptime, response timing — leaves almost no trace and needs no writes. Loud scanning or password spraying is exactly what a decoy is built to catch, and destructive probing destroys the ambiguity that keeps the attacker safe. Good red teams map deception by contrast, not contact.",study:"Passive fingerprinting discipline: what you touch, you announce."}}],
feedback:{why:"From the blue side, decoy hits reveal credential theft that production tools missed; from the red side, decoys are identified by passive contrast — and every loud probe is a self-inflicted alarm.",study:"Decoys as credential-reuse tripwires; passive fingerprinting discipline."}},
{id:"h9",title:"The exfil decision",type:"qcm",summary:"High-interaction DB decoy being drained — entry point unknown",
scenario:{text:"A high-interaction database decoy is being drained right now: a long SELECT is copying its fake finance tables to an outside host. The session's entry point is still unknown, and the connection is stable."},
question:"Which response is correct?",
hint:"The data being stolen is fake. The intruder is the prize.",
answer:{opts:[{t:"Kill the decoy's network immediately"},{t:"Let the copy finish while you trace the intruder's entry point in production logs",c:true},{t:"Delete the fake tables to stop the theft"},{t:"Reset every production database password now"}]},
feedback:{why:"The tables are worthless fakes; the intruder is the real catch. While the decoy keeps them busy, you can trace how they got in and what else they touched. Killing the connection or deleting data destroys the observation window for no gain, and a mass production password reset burns credibility on a signal that touches no real data. This is the 'looks alarming, is contained' case — the least aggressive option wins.",study:"Decoys buy time; spend it investigating, not panicking."}},

scenario:{text:"A vendor pitch mixes four deception-adjacent technologies. Match each to what it actually does."},
question:"Place each description under the right technology.",
hint:"Only one of these is a whole system. One is just a marker.",

items:[{id:"d1",t:"Deliberately slows an attacker's scanner with stalled connections",zone:"tarp"},{id:"d2",t:"Redirects requests for malicious domains to a safe address",zone:"sink"},{id:"d3",t:"A full fake system built to observe attackers",zone:"hp"},{id:"d4",t:"A small tripwire object that alerts when touched",zone:"ct"}]},
feedback:{why:"A tarpit slows scanners by holding connections open. A DNS sinkhole redirects lookups to malicious domains — containment, not observation. A honeypot is a complete fake system inviting deep interaction. A canary token is a lightweight marker that fires exactly once, when touched. They are cousins in deception, but only the honeypot invites the attacker in for a long stay.",study:"The deception family portrait: slow them, redirect them, observe them, or mark your data."}},
{id:"h11",title:"Show only what matters",type:"term",summary:"Evidence host — keep 'New connection' lines, drop the censys noise",
scenario:{text:"Still on the evidence host, you have the plain-text log /var/log/cowrie/cowrie.log. The team lead wants the lines that show new connections, except the constant noise from the research scanner that identifies itself as 'censys'."},
question:"Build a one-line pipeline: first keep only 'New connection' lines, then remove the censys lines.",
hint:"Two stages are enough. The second stage is the mirror of the first: where the first keeps what matches, the second keeps everything that does not.",
term:{prompt:"root@evidence:~#",banner:["evidence host — plain-text cowrie log at /var/log/cowrie/cowrie.log","Log contains 'New connection' lines, many of them from the censys scanner"],
check:function(cmd){var stages=cmd.split("|").map(function(s){return s.trim();});
if(stages.length<2)return {kind:"wrong",out:["(single command — no pipe)"],note:"The task asks for a pipeline: two stages joined by |."};
var hasPath=cmd.indexOf("/var/log/cowrie/cowrie.log")>=0;
var keepIdx=-1,vIdx=-1,i;
for(i=0;i<stages.length;i++){var s=stages[i];var tok=s.split(" ")[0].toLowerCase();
if(tok!=="grep")return {kind:"wrong",out:["stage "+(i+1)+": "+tok+": command not found"],note:"Both stages should be grep."};
if(/new connection/i.test(s)&&s.indexOf("-v")<0)keepIdx=i;
if(/censys/i.test(s)&&s.indexOf("-v")>=0)vIdx=i;}
if(!hasPath)return {kind:"wrong",out:[],note:"The pipeline must read /var/log/cowrie/cowrie.log in one of its stages."};
if(keepIdx<0)return {kind:"wrong",out:[],note:"One stage must keep lines containing 'New connection' (without inverting the match)."};
if(vIdx<0)return {kind:"wrong",out:[],note:"The other stage must remove the censys lines by inverting its match (-v)."};
return {kind:"ok",out:["Mar 11 02:14:03 cowrie: New connection from 203[.]0[.]113[.]88:51022","Mar 11 02:31:11 cowrie: New connection from 198[.]51[.]100[.]7:2211","… (2 further lines — the censys lines were removed by your second stage)"]};},
canonical:"grep 'New connection' /var/log/cowrie/cowrie.log | grep -v censys",
parts:["<b>grep 'New connection' /var/log/cowrie/cowrie.log</b> — keeps every line containing that phrase; the quotes protect the space inside the phrase.","<b>|</b> — the pipe sends the first command's output into the next command.","<b>grep -v censys</b> — -v inverts the match: every line containing censys is removed. Swapping the two stages works identically here."]},
feedback:{why:"Pipelines let small tools compose: one grep selects, the second grep with -v filters out the scanner noise. This exact pattern — keep, then remove — is how analysts carve signal out of decoy logs every day.",study:"grep -v, pipes, and keep-then-remove thinking."}}
];
