<script>
'use strict';
/* CyberPulse Academy — self-contained exam engine, core (part A) */
var TOPIC_ID,BATCH,PASS_MARK,TIME_SECS,SEV_LABEL,EXS,INTRO,THEMES;
var S={order:[],idx:0,recs:{},skipped:[],phase:'intro',tLeft:0,timerId:null,paused:false,reported:false,uname:'',exTimerId:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function txt(s){return String(s).replace(/<[^>]*>/g,'');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function div(cls){var d=document.createElement('div');if(cls)d.className=cls;return d;}
function fmtT(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function ncmd(s){return String(s).replace(/\s+/g,' ').trim().replace(/\[\.\]/g,'.');}
function rec(i){if(!S.recs[i])S.recs[i]={status:'pending',earned:0,hint:false,detail:'',g:null};return S.recs[i];}
function earnedTotal(){var p=0,k;for(k in S.recs){if(S.recs[k].status==='answered')p+=S.recs[k].earned;}return p;}
function updHdr(){if(!S.order.length)return;$('h-count').textContent='Exercise '+(S.idx+1)+' of '+S.order.length;$('h-score').textContent=earnedTotal()+' pts';$('t-min').textContent=fmtT(S.tLeft);$('h-timer').classList.toggle('low',S.tLeft<=60);$('pbar').style.width=Math.round((S.idx+1)/S.order.length*100)+'%';}
function startTimer(){S.tLeft=TIME_SECS;if(S.timerId)clearInterval(S.timerId);S.timerId=setInterval(function(){if(S.paused)return;S.tLeft--;updHdr();if(S.tLeft<=0){clearInterval(S.timerId);timeUp();}},1000);}
function startExTimer(sec,onEnd){stopExTimer();var left=sec;S.exTimerId=setInterval(function(){if(S.paused)return;left--;var e=$('extimer');if(e)e.textContent=fmtT(left);if(left<=0){stopExTimer();onEnd();}},1000);}
function stopExTimer(){if(S.exTimerId){clearInterval(S.exTimerId);S.exTimerId=null;}}
function setPaused(p){if(S.phase!=='exam'&&S.phase!=='review')return;S.paused=p;$('pause-ov').classList.toggle('hidden',!p);}
function timeUp(){stopExTimer();S.paused=false;$('pause-ov').classList.add('hidden');showResults(true);}
function startExam(){S.order=shuf(EXS.map(function(e,i){return i;}));S.idx=0;S.recs={};S.skipped=[];S.reported=false;S.phase='exam';$('scr-intro').classList.add('hidden');$('scr-results').classList.add('hidden');$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');$('hdr').classList.remove('hidden');startTimer();renderCurrent();}
function renderCurrent(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);$('btn-skip').disabled=(r.status==='answered'||r.status==='timedout');$('btn-hint').disabled=(r.status==='answered'||r.status==='timedout'||r.hint);updHdr();renderExercise(ex,ei);window.scrollTo(0,0);}
function nextStep(){if(S.idx<S.order.length-1){S.idx++;renderCurrent();}else{if(S.skipped.length>0){showReview();}else{finishExam();}}}
function skipCur(){var ei=S.order[S.idx],r=rec(ei);if(r.status==='answered'||r.status==='timedout')return;stopExTimer();r.status='skipped';if(S.skipped.indexOf(ei)<0)S.skipped.push(ei);nextStep();}
function hintCur(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);if(r.hint||r.status==='answered'||r.status==='timedout')return;r.hint=true;var hp=$('hintpanel');if(hp){hp.innerHTML='<b>Hint used — this exercise now earns 90% of its points:</b> '+ex.hint;hp.classList.remove('hidden');}$('btn-hint').disabled=true;}
function returnTo(ei){S.phase='exam';$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');S.idx=S.order.indexOf(ei);renderCurrent();}
function showReview(){S.phase='review';$('scr-exam').classList.add('hidden');$('scr-results').classList.add('hidden');$('hdr').classList.remove('hidden');var rv=$('scr-review');rv.classList.remove('hidden');var h='<div class="introcard"><h1>Review skipped exercises</h1><p>You have skipped <b>'+S.skipped.length+'</b> exercise(s). You may return to any of them and answer it now. You can repeat this as often as you want, until the timer ends or you submit.</p><p>If you submit while an exercise is still unanswered, that exercise is <b>excluded from the score</b>: it does not count as right and does not count as wrong.</p><p>⏱ Time left: <b>'+fmtT(S.tLeft)+'</b></p><div id="skiplist"></div><div class="submitrow"><button class="btn" id="btn-finalsubmit" type="button">Submit exam now</button></div></div>';rv.innerHTML=h;var l=$('skiplist');S.skipped.slice().sort(function(a,b){return S.order.indexOf(a)-S.order.indexOf(b);}).forEach(function(ei){var ex=EXS[ei],d=div('repitem');d.innerHTML='<b>'+esc(ex.title)+'</b> &nbsp;<span class="rs skip">⚠ Skipped — not answered</span><div class="submitrow"><button class="btn sec" type="button">Return to this exercise</button></div>';d.querySelector('button').addEventListener('click',function(){returnTo(ei);});l.appendChild(d);});$('btn-finalsubmit').addEventListener('click',finishExam);window.scrollTo(0,0);}
function finishExam(){stopExTimer();showResults(false);}
function showResults(timedOut){S.phase='results';stopExTimer();$('hdr').classList.add('hidden');$('scr-exam').classList.add('hidden');$('scr-review').classList.add('hidden');var rs=$('scr-results');rs.classList.remove('hidden');
var answered=0,earned=0,full=0,part=0,wrong=0,excl=0;
EXS.forEach(function(ex,i){var r=S.recs[i];if(r&&r.status==='answered'){answered++;earned+=r.earned;if(r.earned>=100){full++;}else if(r.earned>0){part++;}else{wrong++;}}else{excl++;}});
var total=answered,pct=total>0?Math.round(earned/total):0,sc=total>0?Math.round(earned/10)/10:0,passed=(total>0&&pct>=PASS_MARK);
var stats='<div class="statgrid">'
+'<div class="stat"><div class="n">'+full+'</div><div class="lbl">✓ Fully correct</div></div>'
+'<div class="stat"><div class="n">'+part+'</div><div class="lbl">~ Partial credit</div></div>'
+'<div class="stat"><div class="n">'+wrong+'</div><div class="lbl">✗ Incorrect</div></div>'
+'<div class="stat"><div class="n">'+excl+'</div><div class="lbl">⚠ Not answered — excluded</div></div>'
+'</div>';
var hero='<div class="result-hero">'+(passed?'<div class="big" style="color:var(--green)">PASS</div>':'<div class="big" style="color:var(--red)">FAIL</div>')
+'<div class="passline">'+(passed?'Congratulations — you passed the '+SEV_LABEL+' certification exam.':'You did not reach the pass mark of '+PASS_MARK+'%. You must retake this exam.')+'</div>'
+'<div style="font-size:34px;font-weight:900;margin-top:10px">'+pct+'%</div>'
+'<div style="color:var(--dim)">'+sc+' fully-correct equivalent(s) of '+total+' answered — percentage is computed only over what you answered</div>'
+(timedOut?'<p style="color:var(--amber);margin-top:10px">⏱ Time ran out. Exercises you never answered were excluded from the score.</p>':'')

kw:"Honeypot",
h1:"Honeypot — EXTREMELY HARD certification exam",
paras:[
"<b>Senior decisions, not senior trivia.</b> This tier mirrors the calls a senior analyst, senior IR lead or deception architect makes at 02:00 with the CISO on the phone. Every exercise chains three or more concepts, and each contains at least one <b>genuinely conflicting signal</b> that you must resolve explicitly: an EDR that says 'clean' while the decoy says 'exfiltration', two clocks that disagree by twelve minutes, a best practice that is wrong in this specific context.",
"<b>Evidence that survives scrutiny.</b> When a decoy is compromised, the response stops being a technical reflex and becomes a legal process: capture the most volatile data first (traffic, then memory, then disk), write down who touched what, hash everything, and never — never — let a well-meaning command destroy the thing you are paid to preserve. One terminal exercise drops you there with a <b>90-second limit</b> and a safe-versus-destructive fork: the command is easy; knowing it is right, in this order, under this pressure, is the test.",
"<b>Costs are part of the answer.</b> Isolating a host can break the payroll batch. Blocking an attacker tips them off. Watching an attacker attack your partners needs legal cover, not courage. Wiping a decoy feels decisive and destroys five days of intelligence. The correct answer is frequently the one that <b>accepts a real cost knowingly</b>, or the one that says <b>'not yet — gather evidence first'</b> when everyone else wants action.",
"<b>How to work through it.</b> Read every artefact; expect noise that matters only as noise, and expect one item of information to be missing — you must reason around the gap and say what you would verify next. The language is the natural register of a senior shift: terse, pressured, occasionally ambiguous. Take the full 55 minutes; these exercises are meant to be argued with."
],
facts:["Pass mark: 70%","12 exercises","55 minutes total","Each exercise is worth 100 points","1 hint per exercise (−10% on that exercise)","Skip is free — unanswered skips are excluded from the score","Pause hides the current exercise","One terminal exercise has its own 90-second limit"],
rules:[
"<b>Severity: EXTREMELY HARD.</b> Three or more chained concepts per exercise, at least one conflicting or incomplete signal, branching interpretations where your answer depends on an earlier read. Several answers are defensible in some world; only one is correct in this one.",

{id:"x1",title:"Midnight on FINDB-DECOY",type:"branch",
scenario:null,question:null,
hint:"Weight each source by freshness and independence before acting: one agent has not checked in for six days, while three other signals are current. Then remember which actions can be undone.",
steps:[
{scenario:{text:"02:04. Four sources disagree about internal host 10[.]20[.]7[.]44.",artefacts:[
{label:"Deception console",lines:["FINDB-DECOY (high-interaction DB decoy): 40 GB SELECT","started from internal 10[.]20[.]7[.]44 — still running"]},
{label:"EDR console",lines:["10[.]20[.]7[.]44 — agent present, status: no detections","last successful check-in: 6 days ago"]},
{label:"CMDB",lines:["10[.]20[.]7[.]44 — decommissioned on paper","decommission ticket DEP-884 still open"]},
{label:"VPN gateway",lines:["01:33 — successful VPN login for svc-decom","from a country the team has never used"]}]},
question:"Step 1 of 3 — signals conflict: the EDR says clean, the decoy says data is leaving. Which reading do you act on, and why?",
type:"qcm",
answer:{opts:[{t:"Trust the EDR — the decoy misread its own traffic"},{t:"Trust the decoy and investigate the host out-of-band — the EDR is stale and 'decommissioned' hosts do not log in",c:true},{t:"Wait for the decom ticket owner to answer in the morning"},{t:"Isolate only the decoy's outbound links — the host itself can wait for the morning shift"}]},
feedback:{why:"Two independent signals beat one silent agent: the decoy watches 40 GB leave, and a 'dead' host logged into VPN minutes earlier. An EDR that has not checked in for six days proves nothing — absence of detections from a stale agent is not evidence of absence. The paper decommission status makes the host more suspicious, not less. Resolve the conflict explicitly: the decoy and the VPN log win.",study:"Weight sources by freshness and independence before acting on any of them."}},
{scenario:{text:"02:19. The CISO is awake now: 'Contain it — but the night batch runs on that subnet, and a wrong isolation could break payroll.'"},
question:"Step 2 of 3 — what do you do?",
type:"qcm",
answer:{opts:[{t:"Isolate 10[.]20[.]7[.]44 at the switch port now, and verify the decom ticket in parallel",c:true},{t:"Wait for the batch window to end, then isolate"},{t:"Reboot the host to interrupt the transfer"},{t:"Isolate the entire subnet now, including the batch runners — better safe than sorry"}]},
feedback:{why:"A host that should not exist is exfiltrating while a suspicious VPN session is live — the case for isolation is strong, and switch-port isolation is reversible if the decom team objects. Waiting risks the data; rebooting destroys volatile evidence for a network problem; isolating the entire subnet takes down the payroll batch with it — exactly the cost the CISO warned about. This is the 'accept a real cost knowingly' decision: senior response isolates the single host first and reconciles the paperwork in parallel.",study:"Reversible, single-target containment beats both delay and overbroad action."}},
{scenario:{text:"02:40. The CISO asks one question: 'Are we breached?'"},
question:"Step 3 of 3 — what is the correct answer?",
type:"qcm",
answer:{opts:[{t:"No — the EDR found nothing, so nothing is confirmed"},{t:"Yes — full breach of every system we monitor right now"},{t:"Not until the disk image finishes — decline to answer until then"},{t:"Confirmed: decoy touched and one production host involved; scope unknown; IR activating",c:true}]},
feedback:{why:"Senior answers are precise: confirm what is confirmed (decoy touched, production host involved), state what is unknown (scope), and name the next step (IR activation). 'The EDR found nothing' ignores that its agent is six days stale, 'total breach' is not supported by current evidence, and refusing to answer until every artefact is imaged abandons the executive team at the moment of decision. Precision under pressure is the whole skill.",study:"Executive status format: what is confirmed, what is unknown, what happens next."}}],
feedback:{why:"Resolving conflicting signals means weighting sources by freshness and independence; containment decisions weigh real business cost; and status reporting separates the confirmed from the unknown.",study:"Signal weighting, reversible containment, precise executive communication."}},
{id:"x2",title:"Evidence before power-off",type:"term",summary:"hp-hi-03 live compromise — preserve the PID 4471 program to /evidence in 90 seconds",
scenario:{text:"The high-interaction honeypot hp-hi-03 is still live: an intruder process (PID 4471) is running from a file that was deleted from /tmp. Legal needs evidence that will survive scrutiny. IR's orders: do not power off, do not tip the attacker, keep everything else running exactly as it is.",artefacts:[
{label:"Environment",lines:["You are root on hp-hi-03","Evidence mount: /evidence (writable, sealed)","Suspicious PID: 4471 — running from a deleted /tmp file"]},
{label:"Order of work",lines:["First preserve the program itself. Memory capture follows on a later step.","Nothing may be killed, removed or rebooted before evidence is safe."]}]},
question:"Run the one command that copies the intruder's running program out of the kernel's process table onto the evidence mount — before anything else touches the host.",
qextra:"<p style=\"color:var(--red);font-weight:700\">⚠ This exercise has its own 90-second limit, counted on screen. If it expires, the exercise closes and is excluded from the score.</p>",
hint:"The disk copy is gone, but the process still runs. Before you touch anything, ask what the kernel still holds open for PID 4471.",
extimerSec:90,
term:{prompt:"root@hp-hi-03:~#",banner:["hp-hi-03 — root shell — intruder PID 4471 running from deleted /tmp file","/evidence is a writable evidence mount"],
check:function(cmd){var p=cmd.split(" ");var t0=p[0].toLowerCase();
if(t0==="kill"||t0==="rm"||t0==="shred"||t0==="mv"||t0==="reboot")return {kind:"danger",out:[],note:"Killing, removing or rebooting destroys volatile evidence and can tip the attacker. Capture first — change nothing."};
if(t0==="dd")return {kind:"danger",out:[],note:"One mistyped of= makes dd overwrite raw devices in a single stroke, so the team forbids dd for file copies on an evidence host. Use the plain copy tool instead."};
if(t0==="cat")return {kind:"wrong",out:["ELF\u2590\u2580\u2591\u2593garbage\u2591\u2580\u2593\u2592…"],note:"cat prints the binary to the screen as garbage and preserves nothing. Copy it onto the evidence mount."};
if(t0!=="cp")return {kind:"unknown",out:[p[0]+": command not found"]};
var sp=p[1],dp=p[2];
if(!sp||!dp)return {kind:"wrong",out:["cp: missing destination file operand"],note:"Usage: cp SOURCE DEST."};
if(sp==="/proc/4471/maps"||sp==="/proc/4471/cmdline"||sp==="/proc/4471/status")return {kind:"wrong",out:["(a small text file was copied)"],note:"Those files describe the process but are not the program. The task asks for the running executable: /proc/4471/exe."};
if(sp!=="/proc/4471/exe")return {kind:"wrong",out:["cp: cannot stat "+sp+": No such file or directory"],note:"The intruder's program lives at /proc/4471/exe — the kernel's link to it, which still works even though the disk file was deleted."};
if(dp.indexOf("/evidence/")!==0)return {kind:"wrong",out:["cp: target must be on the evidence mount"],note:"Copy into /evidence so the file lands on the sealed mount, ready for hashing."};
return {kind:"ok",out:["(cp prints nothing on success)","file copied — hash it and record the time before the next step"]};},
canonical:"cp /proc/4471/exe /evidence/beacon_4471.bin",
parts:["<b>cp</b> — copies; it changes nothing about the running process, so the attacker notices nothing.","<b>/proc/4471/exe</b> — the kernel's link to the actual binary behind the running process. It works even though the file on disk was deleted — this is the only remaining copy.","<b>/evidence/beacon_4471.bin</b> — your sealed copy, ready for hashing and custody records.","The destructive fork: <b>kill -9 4471</b> first would destroy the chance to capture the process and its memory, and <b>rm</b> on the artefact destroys evidence outright."]},
feedback:{why:"Copying /proc/<pid>/exe preserves the exact running binary while the system stays live and quiet — the safe path in the safe-versus-destructive fork. Killing the process, deleting files or powering off destroys volatile evidence you can never recover, and a rebooted host tells the attacker their presence was detected.",study:"/proc forensic copies, volatile evidence discipline, capture-before-touch."}},
{id:"x3",title:"Order of volatility",type:"order",summary:"hp-hi-03 evidence collection — order six forensic actions",
scenario:{text:"hp-hi-03 stays live while you collect evidence. Put the six actions in the order a forensic responder performs them — most volatile first, most permanent last."},
question:"Order the six collection steps.",
hint:"You cannot photograph smoke after it clears. Rank each action by how fast its evidence evaporates if you wait.",
answer:{items:["Start a passive packet capture on the SPAN port","Capture a full memory image","Snapshot the process and socket tables","Take a full disk image","Record hashes and write the chain-of-custody log","Power down and move the hardware to the evidence vault"],
correct:[0,1,2,3,4,5]},
feedback:{why:"Traffic and memory vanish in seconds to minutes, so they come first; process and socket tables change constantly and follow; disk persists until shutdown, so it comes after the live sources; hashes and custody records make everything collected defensible in court; and powering down comes last because it destroys all remaining volatility. Collect from most volatile to least, and document every step.",study:"Order of volatility — the forensic backbone of any compromised-host response."}},
{id:"x4",title:"Two clocks, one truth",type:"qcm",summary:"Timeline conflict — decoy clock +12 min versus synced firewall",
scenario:{text:"A timeline fight is blocking the incident bridge. The decoy's log says the attack ran at 03:00 UTC. The firewall log says the source host was offline until 03:10 UTC — an apparent ten-minute alibi. You check the infrastructure: the decoy VM has no time synchronisation and its clock runs exactly 12 minutes fast; the firewall syncs to the corporate NTP source.",artefacts:[
{label:"Clock audit",lines:["decoy VM: no guest tools, clock +12 min skew","firewall: NTP-synced, drift under 1 ms","correlation host: NTP-synced"]}]},
question:"How do you resolve the conflict?",
hint:"Ask what each clock was compared to before deciding who is right.",
answer:{opts:[{t:"Trust the honeypot log — the victim's own record wins"},{t:"Trust the firewall — firewalls are never wrong"},{t:"Normalise both timelines to the synced NTP source first; the 'alibi' then disappears",c:true},{t:"Take the later timestamp as the true start — the conservative reading that can never understate the impact"}]},
feedback:{why:"Timestamp conflicts are usually clock skew, not miracles. Normalise both timelines against the authoritative NTP source: the decoy's 03:00 becomes 02:48 true time, which lands well before the firewall's 03:10 — the alibi evaporates. Evidence is not discarded for skew; it is corrected, documented, and the sync gap becomes a finding. Trust flows from verification, never from the role of the device.",study:"Timeline normalisation against an authoritative time source."}},
{id:"x5",title:"A best practice that fails here",type:"qcm",summary:"Vendor alerting guide versus reality — 200 touches/day on the internet decoy",
scenario:{text:"A vendor guide your team inherited says: 'Every honeypot touch is a P1 incident — page the on-call analyst immediately.' Your reality: the internet-facing decoy alone is touched roughly 200 times a day by researchers and bots; your internal decoys are touched a handful of times a month, and every touch means something.",artefacts:[
{label:"Last 30 days",lines:["internet decoy: 6,140 touches — 0 intrusions","internal decoys: 11 touches — 3 real intrusions","on-call pages fired: 214 — 2 warranted"]}]},
question:"What should this team actually do?",
hint:"Two hundred pages a day trains on-call humans to ignore pages. The 30-day table shows two populations of decoys that behave nothing alike.",
answer:{opts:[{t:"Page for all touches, exactly as the guide says"},{t:"Page on internal decoy touches; batch and review internet-facing noise daily",c:true},{t:"Invert the policy: page on internet-decoy touches and batch the internal ones"},{t:"Remove the internet-facing decoys entirely"}]},
feedback:{why:"Blanket 'page on touch' works only where any touch is rare and meaningful — internal decoys. Internet-facing decoys collect researcher and bot noise by design, so they get batch review and trend dashboards instead of pages. The guide is not wrong in general; it is wrong for this context, and the 30-day numbers prove it. Widely used best practices still need to earn their keep in your environment — that is the trap this question sets.",study:"Tuning alert policy by exposure; when best practices misfire."}},
{id:"x6",title:"Handover to law enforcement",type:"qcm",summary:"Police handover of honeypot evidence — originals, hashes, custody",
scenario:{text:"The attacker drained fake client records from your decoy and traded them online; police are now involved. They ask for your honeypot evidence: cowrie session logs, packet captures, the copied payload. Your counsel asks what you will hand over, and how.",artefacts:[
{label:"Evidence you hold",lines:["originals: sealed on /evidence, hashed at collection (SHA-256)","analyst working copies: used during the investigation","custody log: every access recorded with name and time"]}]},
question:"What must accompany the handover for the evidence to survive scrutiny?",
hint:"Courts ask two questions: is this the same data, and who touched it, when?",
answer:{opts:[{t:"The original files on a USB stick — hashes slow things down"},{t:"Screenshots of the analysis dashboard, which show everything"},{t:"A verbal summary plus the analysts' personal notes"},{t:"Originals plus SHA-256 hashes and a transfer-of-custody record; analysts work on copies",c:true}]},
feedback:{why:"Hashes prove the data has not changed since collection; the custody record proves who handled it and when; analysts work on copies so the originals stay sealed. A USB stick without hashes answers neither court question, screenshots are derivative and unverifiable, and personal notes are not a chain of custody. The fake data inside does not weaken the case — misuse of your systems is the offence being evidenced.",study:"Chain of custody: hash, document, hand over originals, work on copies."}}

{id:"x8",title:"Honeynet architecture roles",type:"match",summary:"Honeynet design doc — control, capture, collection, targets",
scenario:{text:"Your team documents its honeynet — a network of honeypots — using the classic three-function model. Map each component description to its role."},
question:"Place each description under the right role.",
hint:"One of the four zones is not a function at all — it is what all three functions exist to serve. The other three differ by what they do with data: stop it leaving, copy it happening, merge the copies together.",
answer:{zones:[{id:"dctl",label:"Data control"},{id:"dcap",label:"Data capture"},{id:"dcol",label:"Data collection"},{id:"hps",label:"The honeypots"}],
items:[{id:"r1",t:"Contain outbound attacker traffic through a gateway with strict rules",zone:"dctl"},{id:"r2",t:"Record packets, keystrokes and sessions inside the honeynet",zone:"dcap"},{id:"r3",t:"Aggregate logs from many decoys and sites into one central point",zone:"dcol"},{id:"r4",t:"The fake targets the attacker actually touches",zone:"hps"}]},
feedback:{why:"Data control keeps the attacker inside the honeynet and keeps the internet safe from your decoys — the gateway that makes risk acceptable. Data capture is the recording layer: packets, keystrokes, sessions. Data collection merges streams from many honeypots or sites into one analysis point. The honeypots themselves are simply the targets. Lose any one function and the honeynet is either unsafe, blind, or fragmented.",study:"The classic honeynet trio: control, capture, collection."}},

feedback:{why:"Uniformity is the fingerprint: identical uptimes and banners gave the fleet away. Diversity plus noise closes the passive gap, and watching the enumeration behaviour itself turns the attacker's quiet recon into your next alert — someone walking your ARP table is a signal in its own right. New platforms and switched-off decoys answer the wrong question.",study:"Diversity plus monitoring the recon behaviour itself restores the defender's edge."}}],
feedback:{why:"Passive contrast defeats uniform fleets; diversity plus monitoring the recon behaviour itself restores the defender's edge — cheaper than any new purchase.",study:"Fleet diversity, passive enumeration, and decoys that watch the watcher."}},

question:"What is the right move now?",
hint:"Watching an attacker attack third parties is a decision that needs cover from above.",
answer:{opts:[{t:"Keep watching silently for another month to collect more intel"},{t:"Escalate to legal and management with the evidence package today, keep egress rate-limited while observation continues",c:true},{t:"Wipe the decoy tonight so the attacker loses access"},{t:"Let the decoy's scans run freely to learn the attacker's full playbook"}]},
feedback:{why:"Once your systems are used against third parties, continued observation is a legal and business decision — it needs management and legal sign-off, fast, with the evidence package attached. Rate-limiting egress reduces ongoing harm without tipping the attacker. Silent month-long watching without cover is indefensible if a partner is damaged; wiping destroys five days of intelligence; letting attacks run freely is reckless. The correct action is the escalation itself.",study:"Third-party harm converts observation into a governance decision."}},

answer:{template:"Re: IR-0417. Since 03 March the intruder has controlled our {{0}} and used it to scan third parties. Interim containment: {{1}} on outbound traffic. All sessions and packets are preserved as {{2}} with SHA-256 hashes. We have escalated to {{3}} and await the 09:00 decision.",

feedback:{why:"The memo must say exactly four things: the honeypot (the controlled system), rate-limiting (the interim throttle that reduces harm without tipping the attacker), evidence (preserved with hashes — the thing that makes the legal route possible), and legal counsel (the escalation path for third-party exposure). 'Antivirus' and 'load balancer' do not belong in this decision chain.",study:"Executive writing: name the asset, the containment, the evidence, the owner."}},
