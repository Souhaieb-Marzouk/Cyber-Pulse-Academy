<style>

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

}

.sev-easy{background:var(--green);}

.sev-hard{background:var(--orange);}
.sev-xhard{background:var(--red);}
.counter{font-weight:700;font-size:15px;}

.timerbox .tval{font-weight:700;font-size:16px;}

.tmode-manual{color:#1d1405;background:var(--amber);}
.tmode-auto{color:#0a1626;background:var(--cyan);}
.tmode-ready{color:var(--mut);}
.scorebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;}
.btn{

button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}

.scenhead{color:var(--blue);}
.qblock{border-left:5px solid var(--amber);background:linear-gradient(180deg,#1d1a10,#111a2c);}

.smallnote{color:var(--mut);font-size:14px;margin:4px 0 10px;}
.divider{height:1px;background:var(--line);margin:14px 0;border:0;}
.art{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}

pre.code{

.opt:hover{border-color:var(--blue);}
.opt.sel{border-color:var(--green);background:#10241c;}
.opt .optlbl{font-weight:800;color:var(--cyan);flex:0 0 auto;}
.opt .opttxt{flex:1;}
.opt.picked-good{border-color:var(--green);}
.opt.picked-bad{border-color:var(--red);}
.opt.show-good{border-color:var(--green);}

}
.zone.over{border-color:var(--amber);}
.zone .chip{cursor:pointer;}

.seq{display:flex;flex-direction:column;gap:6px;}
.seqrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);

.seqrow .pos{flex:0 0 34px;text-align:center;font-weight:800;color:var(--cyan);}

.slot{

  background:#0c1424;color:var(--cyan);font-weight:700;padding:4px 10px;margin:0 4px;vertical-align:middle;cursor:pointer;
}
.slot.filled{border-style:solid;border-color:var(--green);}
.slot.over{border-color:var(--amber);}
/* ---------- log viewer ---------- */
.filterbox{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;

.loglines{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0a111f;}
.logline{
  display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #16223a;cursor:pointer;
  font:14px/1.5 Consolas,"Courier New",monospace;align-items:flex-start;
}
.logline:hover{background:#101b30;}
.logline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
.logline .ln{color:#5b6b85;flex:0 0 auto;min-width:26px;}
.t-stamp{color:var(--amber);}
.t-eid{color:var(--cyan);font-weight:700;}
.t-acct{color:#b7c9ff;}
/* ---------- spot the line ---------- */
.spotlines{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.spotline{
  display:block;width:100%;text-align:left;background:#0a111f;border:0;border-bottom:1px solid #16223a;
  color:#d7e3f4;font:14.5px/1.5 Consolas,"Courier New",monospace;padding:9px 12px;cursor:pointer;white-space:pre-wrap;
}
.spotline:hover{background:#101b30;}
.spotline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}

.termprompt{font:14.5px Consolas,"Courier New",monospace;color:var(--green);white-space:nowrap;}

.support{background:#101c33;border:1px solid #243a5e;border-radius:10px;padding:10px 12px;margin:8px 0;}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.act{

.themebox .th{font-weight:800;color:var(--amber);margin-bottom:6px;}
.concepts{display:flex;flex-wrap:wrap;gap:6px;}
.cpt{background:#0c1424;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mut);}
.rules li{margin:6px 0;}
.bigstart{width:100%;min-height:54px;font-size:17px;margin-top:14px;}
.revitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin:8px 0;}
.revitem .ri{flex:1;}
.revitem .rt{font-weight:700;}
.revitem .rs{color:var(--mut);font-size:13.5px;}
.ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--green) calc(var(--pct)*1%), #1c2942 0);margin:10px auto;}
.ring .in{width:130px;height:130px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring .pctv{font-size:30px;font-weight:800;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.stat .n{font-size:22px;font-weight:800;}

.passpanel{border:1px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);border-radius:14px;

<script>
var EXAM = {"title": "Active Directory Certificate Services — EXTREMELY HARD", "sevKey": "xhard", "sevLabel": "EXTREMELY HARD", "timerSeconds": 2880, "terminalForgive": false, "themes": [["PKI Foundations", ["Certification Authority (CA)", "Root CA / offline root", "Subordinate (issuing) CA", "Enterprise CA vs Standalone CA", "Chain of trust", "AIA (Authority Information Access)", "CRL / Delta CRL / OCSP", "ntAuthCertificates", "Cert Publishers"]], ["Templates & Enrollment", ["Certificate templates", "EKU (Extended Key Usage)", "SAN (Subject Alternative Name)", "ENROLLEE_SUPPLIES_SUBJECT", "Autoenrollment (GPO)", "Web enrollment (/certsrv)", "CEP / CES", "Enrollment Agent", "CA roles: ManageCA / ManageCertificates", "EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE"]], ["Attack Paths (ESC)", ["ESC1 - template SAN abuse", "ESC2 - Any Purpose / no EKU", "ESC3 - enrollment agent abuse", "ESC4 - template write rights", "ESC5 - PKI object ACLs", "ESC6 - CA-wide SAN flag", "ESC7 - ManageCA / ManageCertificates abuse", "ESC8 - NTLM relay to enrollment endpoints", "ESC9 / ESC10 - weak certificate mapping", "Pass-the-certificate", "UnPAC-the-hash", "Shadow Credentials (msDS-KeyCredentialLink)", "Certificate theft (DPAPI / LSASS)", "Golden certificate"]], ["Tools & Commands", ["certutil", "certreq", "Certmgr.msc / Certlm.msc", "Certipy", "Certify", "Rubeus", "ForgeCert", "Mimikatz", "Whisker"]], ["Detection & Logging", ["Event 4886 / 4887 / 4888 (issued / approved / denied)", "Event 4870 (revoked)", "Event 4882 (CA backup)", "Event 4889 / 4890 (CA service start / stop)", "Event 4898 / 4899 (template change)", "Event 4768 (Kerberos PKINIT)", "Event 4771", "Sysmon process events", "CA audit policy"]], ["Hardening & Operations", ["Template ACL review", "Remove ENROLLEE_SUPPLIES_SUBJECT", "Clear CA EditFlags (ESC6)", "Strong certificate mapping", "Disable NTLM on enrollment endpoints", "EPA / channel binding", "Role separation", "CA backup / restore", "Key archival", "Renewal vs re-enrollment", "Revocation handling", "GPO autoenrollment policy", "PKI documentation / compliance"]]], "intro": [{"h2": "What is Active Directory Certificate Services (AD CS)?", "paras": ["AD CS is a role for Windows Server. It is Microsoft's built-in PKI. PKI means Public Key Infrastructure. A PKI makes, signs, checks and cancels digital certificates. A certificate is like a digital ID card. It proves that a user, a computer or a service is really who it claims to be.", "Imagine a big office building. The receptionist gives a plastic badge to every worker and visitor. The guards trust the badge because the receptionist signed it. In a Windows domain, the CA (Certification Authority) is that receptionist. AD CS is the whole badge office: the printer, the rules, the records and the cancel list."]}, {"h2": "Where you will meet AD CS in real work", "paras": ["AD CS touches many cybersecurity jobs. Here are the main ones:"], "list": ["Security engineers run and harden the CA servers. They create templates and keep the PKI healthy.", "SOC analysts watch certificate events on a shift. They look for strange certificate requests and strange logons.", "Incident responders investigate attacks that use certificates. They decide what to contain and what to keep as evidence.", "GRC teams write PKI policies and check that the rules are followed. They produce documents like template reviews and risk reports.", "Red teams test AD CS, because attackers love it: one unsafe template or one stolen CA key can let someone sign in as anybody, with no password needed."]}, {"h2": "What people do with it every day", "paras": ["Day to day, the people around a CA do a small set of repeating tasks:"], "list": ["They create and update certificate templates (the forms that describe how certificates are made).", "They approve or deny certificate requests.", "They renew certificates before they expire, and revoke (cancel) certificates that are lost or stolen.", "They publish revocation lists (CRLs) and keep CA backups.", "They write everything down for audits: policies, runbooks and incident reports."]}, {"h2": "The tools you will see", "paras": ["On Windows you will use built-in tools like Certutil, Certreq, Certmgr.msc and Certlm.msc. Security teams also use Certipy and Certify to find unsafe settings, Rubeus to work with Kerberos tickets, and Mimikatz or Whisker in attack simulations. Command tasks in this exam run in a safe fake shell, so you can practise without any risk."]}, {"h2": "The risks AD CS must control", "paras": ["Certificates often replace passwords. So certificate attacks are like password attacks, but much quieter. The classic unsafe patterns have names like ESC1 to ESC10 from well-known research. Examples: a template that lets a requester type any name, a CA-wide flag that accepts any subject, or an NTLM relay to the enrollment website. If attackers steal the CA private key, they can forge certificates for years (a golden certificate).", "This exam teaches you to spot these patterns, to see them in logs, and to fix them."]}, {"h2": "How scoring works (please read)", "list": ["Every exercise is worth 100 points. Your percentage is your points divided by the points of the exercises you actually answered.", "Some exercises have several parts (for example drag-and-drop slots or select-all answers). You get part of the points for the parts you get right.", "In select-all exercises, every wrong pick cancels one right pick.", "In slot exercises (matching, ordering, fill-the-blank, triage, branching), each correct slot gives its own share of the points. A wrong slot only loses its own share.", "The Hint button shows a nudge, never the answer. It costs 10% of that one exercise's points.", "Skip moves an exercise to a review pool without showing the answer. You can go back as long as the timer runs. If you never answer a skipped exercise, it is excluded from the score: it adds nothing to your points and nothing to the maximum.", "The live score in the header always shows points earned out of points possible, over the exercises you have actually answered."]}, {"h2": "How the timer works", "list": ["You have a total time for this file (shown in the chips above).", "The Pause button stops the timer and hides the exercise. Press Resume when you are ready.", "When you press Check, the timer also stops, so you can read the explanation for free. Nothing is hidden while you read.", "The timer starts again when you press Next.", "The timer area always shows its state: running, paused by you, or paused for feedback."]}, {"h2": "What this file tests and how hard it is", "paras": ["This is the EXTREMELY HARD file. Exercises chain three or more concepts, include realistic noise and missing information, and force senior-level decisions: which signal wins, what the business accepts, and when the widely-used best practice is the wrong answer here. Several correct actions have real costs — downtime, evidence loss, or risk acceptance — and you must choose them consciously.", "The terminal tasks in this file have their own short time limits, announced on screen. At least one exercise rewards doing nothing yet — gathering evidence — instead of acting. Hints only restate a constraint you may have missed."]}, {"h2": "Exercise types in this file", "paras": ["This file mixes many interactive formats — not just multiple choice:"], "list": ["Branching scenarios and dual red/blue perspectives", "Terminal emulator tasks (safe fake shell)", "Single-choice questions with tricky distractors", "SOC alert-queue triage with consequences", "Select-all-that-apply questions with partial credit", "Risk ranking (most severe first)", "Log analysis in a filterable log viewer", "Fill-in-the-blank with a shuffled word bank"]}], "meta": {"topicId": "active-directory-certificate-services", "batch": 4, "title": "Active Directory Certificate Services — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 48, "passMark": 70}, "exercises": [{"id": "X01", "type": "branch", "theme": "Attack Paths (ESC)", "title": "The 03:12 chain", "scenario": {"summary": "CISO wants a verdict in 10 minutes", "blocks": [{"label": "Context", "prose": "INC-2291, night of the 12th. The CISO wants a verdict in 10 minutes. Four artefacts are attached. Read all of them before you answer — one is noise, and one constrains what the attacker could NOT have done."}, {"label": "ARTEFACT 1 — Sysmon, WS-4417 (excerpt)", "code": "23:58:11  Event 1  Image: C:\\Users\\svc-helpdesk\\AppData\\Local\\Temp\\certipy.exe\n          Cmd: certipy req -u svc-helpdesk@corp.local -ca CORP-Issuing-CA\n               -template UserAuth-Flex -upn A-Administrator@corp.local"}, {"label": "ARTEFACT 2 — CA-01, event 4886", "code": "03:12:40  4886  Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex\n          Subject/SAN: CORP\\A-Administrator  EKU: Client Authentication\n          CA DB record: present (issued normally)"}, {"label": "ARTEFACT 3 — DC-01, event 4768", "code": "03:12:59  4768  TGT requested. Account: CORP\\A-Administrator\n          Pre-auth: PKINIT  Cert thumbprint: 9F3C 44D1..."}, {"label": "ARTEFACT 4 — CA-01, background", "code": "03:13:20  7036  Certificate Authority service entered running state (planned restart)\nCA key export history: no -exportPFX of the CA certificate in the last 12 months"}]}, "question": "Answer all three steps.", "hint": "Artefact 4 constrains what the attacker could and could not have done. Read it before you pick a technique.", "data": {"steps": [{"label": "STEP 1 — TECHNIQUE", "narration": "Four artefacts, one story. Name it.", "question": "What single technique explains artefacts 1–3 together?", "options": [{"t": "ESC1 template abuse — caller-chosen subject on a logon template — then certificate logon", "correct": true, "why": "Certipy requested with -upn (caller-chosen subject), the CA issued it (4886), PKINIT exchanged it for a TGT."}, {"t": "NTLM relay from a coerced application server to /certsrv (ESC8)", "correct": false, "why": "Artefact 1 shows a normal authenticated enrollment with credentials — no relay involved in this chain."}, {"t": "A golden certificate forged entirely offline with the exported CA private signing key material", "correct": false, "why": "Artefact 2 shows a normal CA database record, and artefact 4 shows no CA key export. Nothing was forged."}, {"t": "Kerberoasting of the Domain Admin service account, cracking its ticket offline", "correct": false, "why": "Kerberoasting cracks service tickets; no certificate issuance would appear — and none of these artefacts show it."}]}, {"label": "STEP 2 — LOOT", "narration": "EDR later finds the attacker ran: Rubeus.exe asktgt /user:A-Administrator /certificate:cert.pfx /getcredentials", "question": "What did /getcredentials deliver?", "options": [{"t": "UnPAC-the-hash: the account's NT hash, unwrapped from the PAC", "correct": true, "why": "PKINIT's PAC carries key material that Rubeus can unwrap — the certificate logon also yields the password-equivalent hash."}, {"t": "The CA's own private signing key, taken straight off the CA server", "correct": false, "why": "The CA key lives on the CA and never travels in a Kerberos logon."}, {"t": "The KRBTGT password hash of the whole domain", "correct": false, "why": "KRBTGT requires DC replication abuse; PKINIT does not hand it over."}, {"t": "The account's smart card PIN, stored on the card", "correct": false, "why": "The certificate was software-based (cert.pfx); no smart card PIN exists here."}]}, {"label": "STEP 3 — PERSISTENCE", "narration": "It is now 03:40. Blue team is awake. The template is still vulnerable.", "question": "What is the attacker's cheapest persistence tonight?", "options": [{"t": "Enroll more ClientAuth certificates for other privileged accounts, and keep the PFX files", "correct": true, "why": "The template hole is still open; each new PFX is a password-free credential that survives resets."}, {"t": "Forge a whole unlimited set of golden certificates with the CA's stolen private signing key", "correct": false, "why": "The CA key was never exported (artefact 4) — forging is not available to this attacker."}, {"t": "Nothing at all — the certificate that is held right now expires within 10 hours anyway", "correct": false, "why": "Certificate lifetime is irrelevant while the template keeps minting new ones."}, {"t": "Edit the template themselves to keep the subject flag turned on", "correct": false, "why": "They needed only enrollment rights; template write rights were never shown — do not invent capabilities."}]}]}, "explain": "This is the canonical ESC1 chain, and every artefact earns its place: Sysmon shows the request with -upn, 4886 shows the CA accepting it, 4768 shows PKINIT turning it into a TGT, 7036 is noise, and the key-export history rules out the golden-certificate theory. The Rubeus /getcredentials flag adds UnPAC-the-hash — one logon, two credentials. Persistence is the cheapest open door: keep minting certificates until the template is fixed.", "study": "Rebuild this chain on paper from memory: four artefacts, three steps, one ruled-out theory."}, {"id": "X02", "type": "term", "theme": "Detection & Logging", "title": "Read-only capture, under pressure", "scenario": {"summary": "Evidence that survives legal scrutiny", "blocks": [{"label": "Context", "prose": "INC-2291 continues. You are IR, now on CORP-CA-01. The CISO needs proof of CA policy tampering that will survive legal scrutiny: capture the CA's policy registry as it is. Anything that CHANGES the CA destroys the evidence and your chain of custody. The PKI lead suggests: “Just fix the flag while you are in there.” Do not."}, {"label": "Objective", "prose": "Capture (read) the CA policy registry branch with Certutil — read-only."}]}, "question": "Type the read-only command, then press Enter. This task has a 90-second limit.", "hint": "Two Certutil verbs differ by one letter. One reads, one writes. You were sent to read.", "data": {"prompt": "PS C:\\> ", "banner": "Simulation shell on CORP-CA-01 (IR session, logged). Nothing real is executed.", "canonical": "certutil -getreg policy", "required": ["\\bcertutil(\\.exe)?\\b", "-getreg\\b", "\\bpolicy\\b"], "forbidden": [{"re": "-setreg\\b", "why": "certutil -setreg CHANGES live CA policy. Mid-incident it alters and destroys the very evidence you were sent to preserve — the PKI lead's suggestion is a chain-of-custody mistake."}, {"re": "-backup\\b", "why": "A backup also exports the CA private key, minting another copy of the crown jewels during an incident. Not asked, not wanted."}], "parts": [{"text": "certutil", "why": "the built-in Windows certificate tool"}, {"text": "-getreg", "why": "READS a registry branch — the read-only verb"}, {"text": "policy", "why": "the CA policy branch that holds EditFlags and the tamper evidence"}], "timerSeconds": 90}, "explain": "Under pressure, the senior move is the boring one: read, don't fix. -getreg policy documents the CA's policy state exactly as it was — screenshot-friendly, hash-friendly, court-friendly. The one-letter near-miss -setreg would have modified the live registry: evidence destroyed, attacker's tamper timestamp overwritten, and the flag's existence harder to prove later. The same logic forbids -backup here: it copies the CA key yet again while the incident is open.", "study": "Write your IR evidence-capture card for CAs: what to read, in which order, and what never to touch."}, {"id": "X03", "type": "qcm", "theme": "Attack Paths (ESC)", "title": "Three signals, one verdict", "scenario": {"summary": "The thumbprint, the database, and a second CA", "blocks": [{"label": "Context", "prose": "04:02. Three signals, apparently contradicting each other:"}, {"label": "ARTEFACT 1 — the three signals", "code": "Signal A:  4768 PKINIT TGT as CORP\\A-Administrator, cert thumbprint 9F3C 44D1,\n           Issuer field: CN=CORP-Issuing-CA-DR\nSignal B:  CA DB of CORP-Issuing-CA: NO record of serial 1200000027 (retention 5 years)\nSignal C:  02:44 — a SECOND CA certificate appeared in ntAuthCertificates:\n           CN=CORP-Issuing-CA-DR. Added by svc-caops. No ticket, no owner."}]}, "question": "Which interpretation wins — and why?", "hint": "Check who ISSUED the certificate in the 4768 payload before you accuse the main CA. AD trusts more than one CA.", "data": {"options": [{"t": "A second trusted CA (CORP-Issuing-CA-DR) was planted in ntAuthCertificates — the logon chains to it; treat as rogue-CA intrusion", "correct": true, "why": "Signal A's issuer is CA-DR. That explains the missing record on the main CA (signal B) and points at signal C as the root enabler."}, {"t": "The certificate was forged offline with the main CA's own compromised private key, and the missing database record proves exactly that", "correct": false, "why": "A plausible theory — in a different incident. Here the issuer field names CA-DR, and the DB gap only means the main CA was never involved."}, {"t": "PKINIT is broken on the domain controller, and the whole 4768 event is therefore a false positive", "correct": false, "why": "PKINIT demonstrably worked: a TGT was issued. False positives do not carry issuer names."}, {"t": "The database purge job removed the issuance record, so nothing actually happened here at all tonight", "correct": false, "why": "Retention is 5 years, and the issuer mismatch remains unexplained. This theory explains nothing."}]}, "explain": "Two signals looked contradictory — a valid certificate logon with no issuance record — and the resolution came from the field nobody read first: the Issuer. The certificate chains to CA-DR, a second CA quietly added to ntAuthCertificates at 02:44. That is a rogue-trusted-CA intrusion: no forging needed, because AD itself trusts the attacker's CA. The lesson: when signals conflict, find the field that re-sorts all of them before choosing a theory.", "study": "Read how ntAuthCertificates gates certificate logons, and audit it for issuers you do not recognise."}, {"id": "X04", "type": "triage", "theme": "Hardening & Operations", "title": "Ten-minute triage", "scenario": {"summary": "Three alerts, CISO on the bridge", "blocks": [{"label": "Context", "prose": "The CISO joins the bridge: “Give me the play for each of these three. Ten minutes.”"}]}, "question": "Pick the correct play for every alert.", "hint": "Only one alert shows someone BEING someone else right now. The other two need either paperwork or nothing.", "data": {"actions": ["Gather evidence first — do not touch yet", "Contain now — active impersonation", "Close — benign pattern"], "alerts": [{"tag": "Alert A", "body": "02:44 — a second CA certificate (CORP-Issuing-CA-DR) appeared in ntAuthCertificates. Added by svc-caops. No ticket, no change record. Object creator and replication origin still unknown.", "correct": 0, "why": "Deleting the object now would destroy the footprint you need (creator, origin, propagation). Capture first; the trust entry is not yet proven malicious in use."}, {"tag": "Alert B", "body": "04:02 — PKINIT TGT as A-Administrator from WS-4417, chaining to the CA-DR certificate. Live session suspected.", "correct": 1, "why": "Someone is being someone else right now. Contain the endpoint and the session; evidence for the CA object is a parallel track."}, {"tag": "Alert C", "body": "08:55 — 400 x 4886 to computer accounts after the monthly GPO change. Every subject matches its requester.", "correct": 2, "why": "Self-matching computer certificates after a GPO change are the monthly autoenrollment wave. Close it and keep the bridge short."}]}, "explain": "Senior triage separates urgency from importance. Alert B is urgent AND important: contain. Alert A is important but urgent evidence-gathering, not urgent deletion — destroying the rogue object before documenting its origin helps the attacker more than the defenders. Alert C is neither: close it, protect the signal-to-noise ratio of the bridge. “Do something” is not a strategy; “do the right thing at the right time” is.", "study": "Practise writing one-line justifications for each triage decision — the CISO will ask “why”."}, {"id": "X05", "type": "multi", "theme": "Attack Paths (ESC)", "title": "Root causes confirmed by artefacts", "scenario": {"summary": "What actually enabled the chain?", "blocks": [{"label": "Context", "prose": "Post-incident review of INC-2291. Select every weakness that the artefacts CONFIRM as a root cause of the ESC1 chain. Not every real weakness caused this incident — that is the trap."}, {"label": "ARTEFACT 1 — confirmed facts", "code": "T1: Template UserAuth-Flex had ENROLLEE_SUPPLIES_SUBJECT\nT2: Enrollment rights on UserAuth-Flex included CORP\\ServiceDesk (svc-helpdesk is a member)\nT3: The CA's AuditFilter logged only failures — successful issuances were not audited until March\nT4: ntAuthCertificates accepted the CA-DR certificate with no approval workflow\nT5: /certsrv had NTLM disabled (EPA enforced) since February\nT6: The Root CA is offline, as designed\nT7: CRL publication interval is 7 days"}]}, "question": "Select every confirmed root cause of this chain. Select all that apply.", "hint": "Root causes ENABLED this chain. Controls that blocked a different path are not causes here.", "data": {"options": [{"t": "Template UserAuth-Flex kept ENROLLEE_SUPPLIES_SUBJECT", "correct": true, "why": "T1 — the subject hole the attacker used."}, {"t": "Enrollment rights on UserAuth-Flex included CORP\\ServiceDesk", "correct": true, "why": "T2 — the entry ticket: svc-helpdesk could enroll from the template."}, {"t": "The CA's AuditFilter logged only failures until March", "correct": true, "why": "T3 — that is why the chain stayed invisible: no success events, no detection."}, {"t": "ntAuthCertificates accepted CA-DR with no approval workflow", "correct": true, "why": "T4 — the trust store amplified the intrusion; a rogue CA became logon-worthy."}, {"t": "/certsrv had NTLM disabled since February", "correct": false, "why": "T5 is hardening that WORKED — it blocked the relay path. A control, not a cause."}, {"t": "The Root CA is offline, exactly as the design intends", "correct": false, "why": "T6 is good practice. It also protects the root key. Not a cause."}, {"t": "The CRL publication interval is 7 days across the CA", "correct": false, "why": "T7 is a real weakness — for revocation freshness. It played no role in this chain. Defensible finding, wrong answer here."}, {"t": "Credential Guard was enabled on WS-4417 at the time", "correct": false, "why": "A control that held — and irrelevant here: the certificate path never touched LSASS. A weakness somewhere else is not a cause of this chain."}]}, "explain": "Root-cause analysis needs the discipline to separate “weakness” from “cause”. T1, T2 and T3 formed the attack path; T4 amplified it. T5, T6 and the Credential Guard control all held — they are controls, not causes. T7 is a genuine weakness — of a different risk. Listing T7 as a root cause makes the report look thorough and the remediation plan wrong. Cause: what made THIS chain possible.", "study": "Rewrite your last incident's contributing-factors list with the test: did removing this earlier have stopped THIS chain?"}, {"id": "X06", "type": "qcm", "theme": "Attack Paths (ESC)", "title": "The key is gone — accept the pain", "scenario": {"summary": "Every option hurts; one hurts correctly", "blocks": [{"label": "Context", "prose": "01:12, confirmed: svc-caops ran certutil -exportPFX of the CORP-Issuing-CA certificate (with private key) to a share; the log trail afterwards is partially wiped. Anyone holding that PFX can now forge certificates for anyone — indefinitely. The CISO asks what happens tonight. Every option hurts; one hurts correctly."}]}, "question": "Which decision is correct tonight?", "hint": "You cannot un-steal a key. You can only make the stolen one worthless — and that has a price you must accept.", "data": {"options": [{"t": "Re-key the issuing CA tonight (new CA cert + key), update ntAuthCertificates/AIA, and reissue — accepting hours of enrollment downtime", "correct": true, "why": "Only new key material makes the stolen PFX worthless. The downtime is the honest price of the compromise."}, {"t": "Rotate the svc-caops service password, revoke all of its active sessions and tokens, and keep the CA issuing certificates as normal tonight", "correct": false, "why": "The key is already out. A password change does not un-steal it; forged certificates keep working."}, {"t": "Restore the whole CA from last night's verified backup, which quietly redeploys the same key", "correct": false, "why": "The backup contains the same private key — you would redeploy the compromise with extra steps."}, {"t": "Wait for the next quarterly change window in six weeks and log the risk in the register", "correct": false, "why": "Every day of waiting is a day of forgeable identity. The window is for convenience, not for containment."}]}, "explain": "This is the exercise where the correct answer has a visible price tag. Re-keying an issuing CA breaks or forces renewal of every certificate it signed — hours of coordinated pain. It is still the only correct move, because the stolen key cannot be revoked away from its copy: revocation lists do not un-share secrets. Senior engineers are trusted not because they avoid these decisions, but because they can say the cost out loud and still choose correctly.", "study": "Draft your own “CA key compromise” runbook page: decision, cost, sequence, comms."}, {"id": "X07", "type": "branch", "theme": "Hardening & Operations", "title": "Persistence after the fix", "scenario": {"summary": "One door closed, the house still open", "blocks": [{"label": "Context", "prose": "05:00. Blue team removed ENROLLEE_SUPPLIES_SUBJECT from UserAuth-Flex and locked the template ACLs. You are the attacker, still holding DA via the 03:12 certificate. You never obtained the CA private key."}]}, "question": "Answer both steps — red first, then blue.", "hint": "Red: the fix closed ONE door; count the others. Blue: you want governance, not a rebuild.", "data": {"steps": [{"label": "STEP 1 — RED TEAM", "narration": "Your UserAuth-Flex path is dead. DA is still yours.", "question": "Cheapest persistence you can still reach tonight?", "options": [{"t": "Find another published template with weak enrollment rights and enroll a fresh ClientAuth certificate", "correct": true, "why": "Domains rarely have exactly one weak template. Enumeration is cheap; the fix closed one template, not the class."}, {"t": "Forge a complete golden certificate set with the CA's own private signing key and sign whatever you need", "correct": false, "why": "You never had the CA key in this chain. Forging is not available — do not drift into a different scenario."}, {"t": "Re-run the very same Certipy request against UserAuth-Flex and hope the flag quietly stayed put", "correct": false, "why": "The flag is gone: the CA now builds the subject from AD, so the request returns your own name."}, {"t": "Delete the brand-new SIEM rules and the 4898 alerting to buy yourself quiet time", "correct": false, "why": "Noisy, out of scope, and not persistence — it is vandalism that helps defenders notice you."}]}, {"label": "STEP 2 — BLUE TEAM", "narration": "The CISO asks for the program-level control that ends this whole family of attacks.", "question": "Which control breaks this family with the least overhead?", "options": [{"t": "Quarterly template governance: ACL review, no caller-chosen subjects without exception, alert on 4898/4899 template changes", "correct": true, "why": "The attack class lives in template configuration. Governance plus change alerts closes the class, not one instance."}, {"t": "Disable PKINIT domain-wide until every smart card and certificate in the whole estate has been replaced, tested and approved", "correct": false, "why": "Breaks smart cards and certificate logons everywhere — the cure outdoes the disease."}, {"t": "Rebuild the whole domain from scratch over a long weekend, including every trust and every account", "correct": false, "why": "Reserved for KRBTGT-class compromises with evidence you do not have here."}, {"t": "Remove every single template from the CA until further written notice from the CISO's office", "correct": false, "why": "Nothing can enroll any more — self-inflicted PKI outage."}]}]}, "explain": "Fixing one template stops one instance; the attack class survives wherever the same trio (logon EKU, weak subject control, broad rights) exists. The red answer is enumeration again — the cheapest loop in AD CS abuse. The blue answer must therefore be program-level: governance cadence plus change detection (4898/4899) makes every future instance visible before it is exploited. Note what the red answer is NOT: golden certificates need a stolen CA key, which this attacker never had.", "study": "Count the weak templates in your own domain that a “fix one template” approach would have missed."}, {"id": "X08", "type": "rank", "theme": "Hardening & Operations", "title": "Order of battle (active ESC8 + ESC1)", "scenario": {"summary": "Sequence the response, first = do first", "blocks": [{"label": "Context", "prose": "Active incident: an ESC8 relay is live against the CA's enrollment endpoint, AND an ESC1 template is being used for impersonation. The CISO asks for the sequence. Position 1 is what you do first."}]}, "question": "Rank all four response actions, first = do first.", "hint": "Two actions stop what is happening NOW; one gives you eyes; one is heavy and planned.", "data": {"items": [{"t": "Disable NTLM on the CA's enrollment endpoints (kills the live relay now)", "why": "It stops an active, currently-running attack path with one change."}, {"t": "Remove ENROLLEE_SUPPLIES_SUBJECT from the abused template (closes impersonation)", "why": "It stops the second active path; do it immediately after the relay is dead."}, {"t": "Deploy SAN-mismatch alerting on 4886 (visibility for everything left)", "why": "You cannot see the next attempt without it — but visibility does not stop the bleeding, so it follows containment."}, {"t": "Schedule the CA re-key for the next change window (removes the stolen-key risk)", "why": "Important but heavy and planned; it belongs after the live paths are dead and seen."}]}, "explain": "Sequencing under fire: stop the active bleed (relay, then impersonation), then buy visibility, then schedule the heavy structural fix. Every order except this one either lets an attack run while you build dashboards, or burns hours on a re-key while the relay still works. The re-key is not optional — it is simply not first.", "study": "Write the incident sequencing rule you will defend: containment, visibility, then structural repair."}, {"id": "X09", "type": "logview", "theme": "Detection & Logging", "title": "One issuance among noise, one line truncated", "scenario": {"summary": "Ten lines, one proves impersonation", "blocks": [{"label": "Context", "prose": "03:00–03:35, CA-01 and DC-01. Ten lines. One collector line arrived truncated — you must reason around the missing information, and ignore the noise."}, {"label": "ARTEFACT 1 — Correlated log extract", "code": "02:58:00  4886  Requester: CORP\\LT-3301$  Template: WorkstationAuthentication\n03:00:11  4886  Requester: CORP\\LT-3315$  Template: WorkstationAuthentication\n03:02:47  4771  Pre-auth failed. Account: CORP\\jdoe (0x18)\n03:04:19  4886  Requester: CORP\\LT-3320$  Template: WorkstationAuthentication\n03:06:35  4886  Requester: (record truncated by collector timeout)\n03:12:40  4886  Requester: CORP\\svc-print  Template: EscrowAgent  Subject: CORP\\A-Administrator  EKU: Client Authentication\n03:12:59  4768  TGT. Account: CORP\\A-Administrator  Pre-auth: PKINIT\n03:20:04  7036  CertSvc entered running state (planned restart)\n03:25:18  4886  Requester: CORP\\LT-3331$  Template: WorkstationAuthentication\n03:31:44  4890  CertSvc stopped (planned)"}]}, "question": "Click the ONE issuance that proves impersonation.", "hint": "The truncated line cannot prove anything — do not build a case on it. Look for a subject that does not belong to the requester.", "data": {"multi": false, "lines": ["02:58:00  4886  Requester: CORP\\LT-3301$  Template: WorkstationAuthentication", "03:00:11  4886  Requester: CORP\\LT-3315$  Template: WorkstationAuthentication", "03:02:47  4771  Pre-auth failed. Account: CORP\\jdoe (0x18)", "03:04:19  4886  Requester: CORP\\LT-3320$  Template: WorkstationAuthentication", "03:06:35  4886  Requester: (record truncated by collector timeout)", "03:12:40  4886  Requester: CORP\\svc-print  Template: EscrowAgent  Subject: CORP\\A-Administrator  EKU: Client Authentication", "03:12:59  4768  TGT. Account: CORP\\A-Administrator  Pre-auth: PKINIT", "03:20:04  7036  CertSvc entered running state (planned restart)", "03:25:18  4886  Requester: CORP\\LT-3331$  Template: WorkstationAuthentication", "03:31:44  4890  CertSvc stopped (planned)"], "pick": [5], "lineWhy": ["Requester svc-print, subject A-Administrator, logon EKU, immediate PKINIT TGT: the requester holds a certificate for a name it does not own. That is proof of impersonation."], "wrongWhy": {"4": "The truncated line is incomplete information: it proves nothing either way, and a senior analyst refuses to build a case on it.", "6": "The 4768 is the consequence — the question asks for the issuance that proves it."}}, "explain": "Three disciplines in one screen. Baseline reading: computer certificates match their requesters; service restarts and 4771 noise are irrelevant. Incomplete information: the truncated line is unknowable — a senior analyst notes it, and does NOT pick it just because it looks mysterious. The proof: the svc-print issuance, because requester and subject diverge AND a logon follows. Evidence, not vibes.", "study": "Practise stating out loud what each unreadable artefact CANNOT prove."}, {"id": "X10", "type": "fill", "theme": "Hardening & Operations", "title": "Executive summary, no fluff", "scenario": {"summary": "Four words decide how leadership reads the incident", "blocks": [{"label": "Context", "prose": "The exec summary of INC-2291 goes to the board. Four blanks decide whether they understand the incident — choose from the bank."}]}, "question": "Drag a word from the bank into each blank.", "hint": "One slot names the Kerberos certificate logon protocol. One names the expensive but correct recovery.", "data": {"text": "EXEC-SUM (INC-2291): The attacker enrolled a ClientAuth certificate with a caller-chosen ({0}) SAN and obtained a TGT via {1}. Separately, the CA key was exported at 01:12; therefore a full CA {2} is scheduled. Until completion, the SOC runs {3} monitoring on certificate issuances.", "slots": ["forged", "PKINIT", "re-key", "compensating"], "slotWhy": ["A caller-chosen SAN means the name was forged by the requester, not assigned by AD.", "PKINIT is the Kerberos protocol exchange that turns a certificate into a TGT.", "Re-keying is the structural recovery when key material is stolen.", "Compensating monitoring covers the gap until the structural fix lands."], "bank": ["forged", "PKINIT", "re-key", "compensating", "revoked", "NTLM", "rollback", "immediate"]}, "explain": "Four words carry the whole story: forged (what the SAN was), PKINIT (how it became a logon), re-key (what must happen), compensating (what happens meanwhile). Boards do not read ESC numbers; they read cost, cause and plan. Precision here is not pedantry — the wrong word (rollback instead of re-key) sends a billion-dollar recovery down the wrong path.", "study": "Rewrite your last exec summary with the cause-protocol-plan-monitor skeleton."}, {"id": "X11", "type": "term", "theme": "Tools & Commands", "title": "Preserve the database, not the key", "scenario": {"summary": "Legal needs the CA database — only the database", "blocks": [{"label": "Context", "prose": "Same incident, 04:30. Legal needs the CA DATABASE preserved before remediation touches the CA: the issued-certificates log, the pending queue, the configuration. Two constraints: do not change CA state, and do NOT create yet another copy of the CA private key — it is already compromised once. Destination: C:\\Evidence-CADB."}, {"label": "Objective", "prose": "Preserve the CA database to C:\\Evidence-CADB with Certutil."}]}, "question": "Type the command, then press Enter. This task has a 100-second limit.", "hint": "Two backup verbs differ by three letters. One of them copies the key you must not copy again.", "data": {"prompt": "PS C:\\> ", "banner": "Simulation shell on CORP-CA-01 (IR session, logged). Nothing real is executed.", "canonical": "certutil -backupdb C:\\Evidence-CADB", "required": ["\\bcertutil(\\.exe)?\\b", "-backupdb\\b", "evidence-cadb"], "forbidden": [{"re": "-backup(?!db)", "why": "certutil -backup ALSO copies the CA certificate and its PRIVATE KEY. The key is already compromised — do not mint a fresh copy of it mid-incident."}, {"re": "-setreg\\b|-restore\\b", "why": "Both change live CA state. Evidence must not be mutated during capture."}], "parts": [{"text": "certutil", "why": "the built-in Windows certificate tool"}, {"text": "-backupdb", "why": "backs up ONLY the database: issued log, pending queue, configuration — no keys"}, {"text": "C:\\Evidence-CADB", "why": "the evidence destination for the preserved database"}], "timerSeconds": 100}, "explain": "The senior judgement is in the three extra letters. -backupdb preserves exactly what legal asked for and nothing they must not receive: no second copy of a compromised key travelling to an evidence share. Plain -backup would satisfy “preserve” and violate the key constraint — a defensible-looking command that quietly worsens the incident. One verb, three letters, the whole difference between process and improvisation.", "study": "Compare certutil -backup, -backupdb and -restore on a lab CA until the boundary is reflexive."}, {"id": "X12", "type": "branch", "theme": "Hardening & Operations", "title": "Strong mapping bites", "scenario": {"summary": "The hardening that half-happened", "blocks": [{"label": "Context", "prose": "After the May 2022 Kerberos hardening, the org planned to enforce full “strong certificate binding”. Rollout stalled: helpdesk insisted smart cards still worked “because the pilot passed”. This morning: A-Administrator impersonated via a certificate with NO SID extension (old template) — while everyone believed full enforcement was on."}, {"label": "ARTEFACT 1 — DC-01 registry", "code": "StrongCertificateBindingEnforcement = 1 on DC-01\n  0 = compatibility (no enforcement)\n  1 = relaxed / compatibility mode\n  2 = full strong mapping enforcement"}]}, "question": "Answer all three steps.", "hint": "The registry value on DC-01 says more than the helpdesk's pilot. Mapping needs either the SID in the certificate or full enforcement.", "data": {"steps": [{"label": "STEP 1 — WHY IT SURVIVED", "narration": "The patch was deployed. The impersonation worked anyway.", "question": "Why did impersonation survive the “hardening”?", "options": [{"t": "Enforcement was left at 1 (relaxed) — UPN-only mapping of certificates without a SID extension was still accepted", "correct": true, "why": "Value 1 never fully enforced the binding; old SID-less certificates kept mapping by UPN, which the attacker controlled."}, {"t": "PKINIT has been disabled on DC-01 ever since the May hardening project silently broke all of the certificate logons", "correct": false, "why": "The logon demonstrably happened; PKINIT is alive."}, {"t": "Every one of the pilot smart cards was quietly revoked at the end of last week by the helpdesk", "correct": false, "why": "Revocation of smart cards is unrelated; no smart cards appear in this chain."}, {"t": "The certificate that was used for this morning's logon had quietly expired three days earlier", "correct": false, "why": "An expired certificate cannot authenticate at all — yet this one did."}]}, {"label": "STEP 2 — THE FIX", "narration": "You must close the hole without breaking the smart-card estate.", "question": "Which fix is correct AND safe?", "options": [{"t": "Set enforcement to full (2) and reissue certificates that embed the account SID (szOID_NTDS_OBJECTSID)", "correct": true, "why": "Full enforcement plus SID-bearing certificates is exactly the designed end state of the hardening."}, {"t": "Lower the enforcement value back down to 0 for maximum compatibility with the oldest legacy smart-card templates", "correct": false, "why": "That reopens the hole wider — the opposite of a fix."}, {"t": "Delete the msDS-KeyCredentialLink attribute on every admin account and force a key rotation", "correct": false, "why": "A near-miss: that attribute belongs to Shadow Credentials, a different attack; deleting it does not fix UPN mapping."}, {"t": "Disable certificate logon domain-wide until the smart-card pilot has been re-run from scratch", "correct": false, "why": "Breaks every smart card and cert-based flow in the estate."}]}, {"label": "STEP 3 — PROVE IT", "narration": "Leadership asks how you will show the control actually works.", "question": "Which detection confirms the control works?", "options": [{"t": "Alert on 4768 PKINIT where the certificate lacks the SID extension but maps to a privileged account", "correct": true, "why": "That is the exact residual risk condition while the estate migrates to SID-bearing certificates."}, {"t": "Alert on every single 4768 event on every single domain controller in the estate, with no filtering", "correct": false, "why": "Volume without signal — every certificate logon fires it."}, {"t": "Wait for Microsoft's next cumulative patch before touching any configuration anywhere in the domain", "correct": false, "why": "The patch exists and is deployed; the configuration, not the code, was the gap."}, {"t": "Turn off 4768 logging during the migration to cut the noise for the analysts", "correct": false, "why": "Blinding yourself is not a detection strategy."}]}]}, "explain": "This is ESC9/ESC10 territory: the May 2022 fixes only protect you when strong mapping is actually enforced AND certificates carry the SID. A pilot that “passed” on smart cards proved nothing about the registry value. The fix is the designed end state — full enforcement plus SID-bearing reissues — and the detection watches the exact residual condition during migration. Note the near-miss: msDS-KeyCredentialLink is Shadow Credentials territory, not this issue.", "study": "Check your own DCs: what is StrongCertificateBindingEnforcement set to, and do your logon certificates carry the SID?"}, {"id": "X13", "type": "qcm", "theme": "Detection & Logging", "title": "Two alarms, one CA — which wins?", "scenario": {"summary": "The playbook best practice, wrong this once", "blocks": [{"label": "Context", "prose": "07:15. Two signals:"}, {"label": "ARTEFACT 1 — the two signals", "code": "(A) EDR raises HIGH on CORP-CA-01: certutil -exportPFX executed, writing to \\\\file01\\backup\\\n(B) CA admin points at ticket CHG-8812: the weekly backup job.\n    BUT: the job was EDITED last week — new destination path, new run time —\n    and the editor was svc-caops, an account offboarded two weeks ago.\n\nStandard playbook: high-severity EDR on a server → isolate immediately.\nIsolating the issuing CA takes down enrollment and logon for the whole domain."}]}, "question": "What is the correct next action?", "hint": "One alarm says “theft”. The other says “approved job — edited by a ghost”. The CA's downtime is a weapon too.", "data": {"options": [{"t": "Corroborate fast (job lineage, editor identity, share ACL, parent process) within 15 minutes, then isolate if unexplained", "correct": true, "why": "The signals genuinely conflict; a time-boxed corroboration resolves them without domain-wide PKI outage on an unconfirmed read."}, {"t": "Isolate CORP-CA-01 from the network immediately and accept the outage, because the standard playbook says to do exactly that", "correct": false, "why": "The widely-used best practice is wrong HERE: blanket isolation of the issuing CA is domain-wide impact, and signal B is half-exculpatory but half-incriminating — it deserves 15 minutes of checking first."}, {"t": "Delete the edited scheduled task at once, then close the bridge and let the team move on to other work", "correct": false, "why": "Destructive to evidence and possibly to a legitimate job; resolves nothing about the editor identity."}, {"t": "Email the CA admin, ask the team to change the destination path today, and review it again next week", "correct": false, "why": "An email is not containment, not evidence handling, and not 07:15 on an incident bridge."}]}, "explain": "The generic playbook (high EDR → isolate) is usually right — and here it is wrong, because the asset is the issuing CA and the signals genuinely conflict: a key-export alarm against a ticketed backup job whose last edit came from an offboarded account. The senior action is time-boxed corroboration with a hard tripwire: 15 minutes, four checks, then isolate if unexplained. Best practices are priors, not laws — this exercise is where you practise overriding one deliberately.", "study": "Write the “when NOT to isolate the CA” addendum to your playbook, with the tripwire conditions."}, {"id": "X14", "type": "multi", "theme": "Hardening & Operations", "title": "Thirty days of compensating controls", "scenario": {"summary": "The re-key waits; the risk does not", "blocks": [{"label": "Context", "prose": "The CA re-key is scheduled in 30 days (vendor lock, change freeze). Until then you must select every VALID compensating control for the window. Select all that apply."}]}, "question": "Select every valid compensating control. Select all that apply.", "hint": "A compensating control must REDUCE the specific risk without creating a bigger one. Test every option against both halves.", "data": {"options": [{"t": "Alert on 4886 where the subject/SAN does not match the requester", "correct": true, "why": "Watches the exact abuse behaviour; low noise, immediate value."}, {"t": "Restrict enrollment rights on every template with caller-chosen subjects", "correct": true, "why": "Shrinks the attack surface directly while the structural fix waits."}, {"t": "Require TLS with EPA on all enrollment endpoints", "correct": true, "why": "Kills the relay family for the window; minimal breakage."}, {"t": "Forward CA success events (4886/4887) to the SIEM", "correct": true, "why": "You cannot alert on what you never receive; visibility first."}, {"t": "Stop CertSvc on the issuing CA until the re-key completes", "correct": false, "why": "A near-miss: “no CA, no risk” — but no CA also means no enrollment, no renewal, no PKI. The cure outdoes the disease."}, {"t": "Bring the offline Root CA online for better monitoring", "correct": false, "why": "Exposes the crown jewels to reduce someone's dashboard anxiety. Strictly worse."}, {"t": "Delete the current CRL to force clients to re-check", "correct": false, "why": "Removes revocation data; clients may cache stale state. Pure damage."}, {"t": "Revoke every single certificate that was issued in the last 6 months", "correct": false, "why": "A near-miss: revocation does not close the hole — new certificates can still be minted — and it breaks half the estate at once."}]}, "explain": "A compensating control passes two tests: it reduces the specific risk in the window, and it does not create a larger one. The four correct picks pass both. The four wrong picks each fail the second test while sounding decisive: stopping the CA destroys the PKI's purpose, putting the root online exposes the one key that must never be reachable, deleting the CRL removes protection, and mass revocation breaks half the estate without closing the hole. Decisiveness is not a control.", "study": "Score your own pending compensating controls against the two tests; retire the ones that fail."}, {"id": "X15", "type": "branch", "theme": "Attack Paths (ESC)", "title": "The web host that became the CA", "scenario": {"summary": "ESC5: the CA's own machine identity", "blocks": [{"label": "Context", "prose": "Escalation. CORP-CA-01 also hosts the enrollment web service. Artefacts: the “WebServer” template allows ENROLLEE_SUPPLIES_SUBJECT and Domain Users may enroll; CORP-CA-01's own computer object is enrolled from WebServer; /certsrv runs under the machine identity. The attacker (jdoe) requested a WebServer certificate with SAN = CORP-CA-01.corp.local."}, {"label": "ARTEFACT 1 — the two facts that matter", "code": "Template WebServer:  ENROLLEE_SUPPLIES_SUBJECT, Domain Users may enroll\nCORP-CA-01$:         enrolled from WebServer (machine cert)"}]}, "question": "Answer both steps.", "hint": "A server-auth certificate that names a host can be used to BE that host in Kerberos. And the host in question is the CA.", "data": {"steps": [{"label": "STEP 1 — WHAT THE CERT GAVE", "narration": "jdoe now holds a valid certificate whose name is the CA server's own FQDN.", "question": "What did that certificate effectively give jdoe?", "options": [{"t": "A credential that authenticates AS the CA server's computer account", "correct": true, "why": "The certificate's identity is CORP-CA-01$; Kerberos accepts it as that machine (S4U/resource-based delegation paths open from here)."}, {"t": "A certificate that names jdoe's own normal user account", "correct": false, "why": "The SAN names the CA server, not jdoe."}, {"t": "The CA's private signing key, exported to a file", "correct": false, "why": "The CA key is separate and was never issued through a template."}, {"t": "Nothing at all — plain server certificates cannot identify machines in Kerberos", "correct": false, "why": "Machine authentication is exactly what computer certificates do."}]}, {"label": "STEP 2 — FINAL IMPACT", "narration": "Follow the chain to its end.", "question": "What is the final impact if the attacker completes the chain against the CA host?", "options": [{"t": "Admin on the CA host = CA Administrator = can issue or forge trusted certificates for anyone", "correct": true, "why": "Owning the CA host means owning the CA and its key material — the highest-value outcome in AD CS."}, {"t": "Only the enrollment web page's HTML could be changed, and absolutely nothing else on the server at all", "correct": false, "why": "The web page is the least of it — the machine identity is the prize."}, {"t": "Nothing serious — the CA host is, after all, just one normal member server among many", "correct": false, "why": "It is the CA. Its host holds the keys to every identity in the domain."}, {"t": "Only the CRL publication schedule changes in any practical or noticeable way", "correct": false, "why": "The CRL is a rounding error next to control of the CA host."}]}]}, "explain": "This is ESC5's shape: the misconfiguration is not on a user template but on PKI OBJECTS — here, the CA's own machine identity being reachable through a caller-chosen-subject template. Chaining is what makes it EXTREMELY HARD: weak template, machine impersonation, host compromise, and at the end the attacker stands where every certificate is born. Fix: subject control on WebServer, and never let the CA's own identity be enrollable by broad groups.", "study": "Enumerate which objects in your PKI (CA host, web hosts, RP objects) inherit which templates, and who can enroll."}]};

function updateHeader(){

  if(st.phase === "exam" && st.cur !== null){
    c.textContent = "Exercise " + (st.pos+1) + " of " + st.order.length;

  var bh = $("btn-hint"), bp = $("btn-pause"), bs = $("btn-skip"), br = $("btn-review");
  var graded = st.cur !== null && st.graded[st.cur];
  bh.disabled = (st.phase!=="exam") || graded || !!st.hint[st.cur];
  bs.disabled = (st.phase!=="exam") || graded;
  bp.textContent = st.timer.manual ? "\u25B6 Resume" : "\u23F8 Pause";
  var n = skippedCount();
  br.textContent = "\u26A0 Skipped (" + n + ")";
  br.disabled = (n === 0 || st.phase === "results" || st.phase === "intro");
  var earned = 0, poss = 0;
  Object.keys(st.graded).forEach(function(k){ earned += st.graded[k].points; poss += 100; });
  $("scorebox").textContent = "\u2605 " + earned + " / " + poss;
  renderTimer();
}
function skippedCount(){
  var n = 0; Object.keys(st.skipped).forEach(function(k){ if(!st.graded[k]){ n++; } }); return n;
}

/* ---------- manual pause ---------- */
function togglePause(){
  if(st.phase !== "exam" && st.phase !== "review"){ return; }
  if(!st.timer.manual){
    st.timer.manual = true;
    $("stage").classList.add("hidden");
    $("overlay").classList.remove("hidden");
  } else {
    st.timer.manual = false;
    $("overlay").classList.add("hidden");
    $("stage").classList.remove("hidden");
  }
  updateHeader();
}
function buildOverlay(){
  var ov = h("div","overlay hidden"); ov.id = "overlay";
  var box = h("div","ovbox");
  box.appendChild(h("div","big","\u23F8 Paused by you"));
  box.appendChild(h("p",null,"The exercise is hidden and the timer is stopped. Press Resume when you want to continue."));
  var b = h("button","btn primary","\u25B6 Resume"); b.type="button";
  b.addEventListener("click", togglePause);
  box.appendChild(b);
  ov.appendChild(box);
  document.body.appendChild(ov);
}

/* ---------- hint ---------- */
function useHint(){
  if(st.cur === null || st.graded[st.cur] || st.hint[st.cur]){ return; }
  st.hint[st.cur] = true;
  var ex = E.exercises[st.cur];
  var old = document.querySelector(".hintpanel");
  if(old){ old.parentNode.removeChild(old); }
  var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
  var ans = document.querySelector(".ansblock");
  ans.appendChild(hp);
  updateHeader();
}

/* ---------- skip ---------- */
function doSkip(){
  if(st.cur === null || st.graded[st.cur]){ return; }
  st.skipped[st.cur] = true;
  stopCountdown();
  goNext(true);
}
function goNext(){
  st.fromReview = false;
  var idx = -1;
  for(var i = st.pos+1; i < st.order.length; i++){
    var k = st.order[i];
    if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
  }
  st.timer.auto = false;
  if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
  if(skippedCount() > 0){ st.fromReview = true; openReview(); return; }
  endExam("done");
}

/* ---------- navigation guards for Check / Next ---------- */
function checkAnswer(force){
  if(st.cur === null || st.graded[st.cur]){ return; }
  var ex = E.exercises[st.cur];
  var ans = curRenderer.collect();
  if(ex.type === "term" && normCmdRaw(ans.cmd) === "" && !force){
    if(curRenderer.print){ curRenderer.print("(!) Type a command first, then press Enter or Check."); }
    return;
  }
  st.ans[st.cur] = ans;
  var g = GRADER[ex.type](ex, ans);
  var pts;
  if(g.t <= 0){ pts = 0; }
  else if(g.select){ pts = Math.floor(Math.max(0, g.c - g.w) / g.t * 100); }
  else { pts = Math.floor(g.c / g.t * 100); }
  if(st.hint[st.cur]){ pts = Math.floor(pts * 0.9); }
  g.points = pts;
  st.graded[st.cur] = g;
  if(ex.type === "term" && curRenderer.print){
    curRenderer.print(normCmdRaw(ans.cmd) || "(empty command)");
    if(pts === 100){
      curRenderer.print("[OK] The simulation accepts this command." + (ex.data.sampleOutput ? "\n" + ex.data.sampleOutput : ""));
    } else {
      curRenderer.print("[x] The simulation stops here. Read the explanation below.");
    }
  }
  stopCountdown();
  st.timer.auto = true;          /* auto-pause on Check: feedback readable, timer stopped */
  renderFeedbackInto(ex, g);
  updateHeader();
}
function nextAnswer(){
  if(st.cur === null || !st.graded[st.cur]){ return; }
  stopCountdown();
  if(st.fromReview){
    if(skippedCount() > 0){ openReview(); return; }
    st.fromReview = false;
    var idx = -1;
    for(var i = st.pos+1; i < st.order.length; i++){
      var k = st.order[i];
      if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
    }
    if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
    endExam("done"); return;
  }
  goNext();
}

/* ---------- exercise screen ---------- */
function clearStage(){ var s = $("stage"); s.innerHTML = ""; }
function codeBlock(text, copyable){
  var wrap = h("div","copywrap");
  var pre = h("pre","code", text);
  wrap.appendChild(pre);
  if(copyable){
    var b = h("button","btn copybtn","Copy"); b.type="button";
    b.addEventListener("click", function(){
      try{
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        b.textContent = "Copied";
        setTimeout(function(){ b.textContent = "Copy"; }, 1200);
      }catch(e){}
    });
    wrap.appendChild(b);
  }
  return wrap;
}
function buildScenario(ex){
  var sec = h("section","card scen");
  var head = h("div","cardhead scenhead");
  head.appendChild(h("span","cicon","\u25A6"));
  head.appendChild(h("span",null,"Scenario"));
  var sc = ex.scenario;
  var long = (sc.blocks.length >= 2) || (sc.blocks.reduce(function(a,b){ return a + words(b.prose||"") + words(b.code||""); }, 0) > 70);
  if(long){
    var cb = h("button","btn collapsebtn","\u25B4 Collapse"); cb.type="button";
    cb.setAttribute("aria-expanded","true");
    cb.addEventListener("click", function(){
      var body = sec.querySelector(".scenbody");
      var isHidden = body.classList.toggle("hidden");
      cb.textContent = isHidden ? "\u25BE Expand" : "\u25B4 Collapse";
      cb.setAttribute("aria-expanded", isHidden ? "false" : "true");
      var sm = sec.querySelector(".scensummary");
      sm.classList.toggle("hidden", !isHidden);
    });
    head.appendChild(cb);
  }
  sec.appendChild(head);
  if(long){ sec.appendChild(h("div","scensummary hidden", sc.summary)); }
  var body = h("div","scenbody");
  sc.blocks.forEach(function(b, i){
    var art = h("div","art");
    art.appendChild(h("div","art-label", (sc.blocks.length > 1 ? ("Artefact " + (i+1) + " \u2014 ") : "") + b.label));
    if(b.prose){ art.appendChild(h("p",null,b.prose)); }
    if(b.code){ art.appendChild(codeBlock(b.code, false)); }
    body.appendChild(art);
  });
  sec.appendChild(body);
  return sec;
}
function buildQuestion(ex){
  var sec = h("section","card qblock");
  var head = h("div","cardhead");
  head.appendChild(h("span","cicon","?"));
  head.appendChild(h("span",null,"Question"));
  sec.appendChild(head);
  sec.appendChild(h("div","qtext", ex.question));
  return sec;
}
function buildAnswer(ex){
  var sec = h("section","card ansblock");
  var head = h("div","cardhead");
  head.appendChild(h("span","cicon","\u2611"));
  head.appendChild(h("span",null,"Your answer"));
  sec.appendChild(head);
  curRenderer = RENDER[ex.type](ex, sec);
  return sec;
}
function showExercise(key){
  st.cur = key;
  st.phase = "exam";
  clearStage();
  var ex = E.exercises[key];
  var stage = $("stage");
  stage.appendChild(buildScenario(ex));
  stage.appendChild(buildQuestion(ex));
  stage.appendChild(buildAnswer(ex));
  if(st.hint[key] && !st.graded[key]){
    var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
    stage.querySelector(".ansblock").appendChild(hp);
  }
  var foot = h("div","foot");
  var bc = h("button","btn go","\u2713 Check answer"); bc.type="button"; bc.id="btn-check";
  bc.addEventListener("click", checkAnswer);
  var bn = h("button","btn primary","\u25B8 Next exercise"); bn.type="button"; bn.id="btn-next";
  bn.addEventListener("click", nextAnswer);
  foot.appendChild(bc); foot.appendChild(bn);
  stage.appendChild(foot);
  if(st.graded[key]){ renderFeedbackInto(ex, st.graded[key], true); }
  bn.disabled = !st.graded[key];
  updateHeader();
  window.scrollTo(0,0);
}
/* per-exercise countdown (EXTREMELY HARD terminal tasks) */
function startCountdown(ex, box){
  if(!ex.data || !ex.data.timerSeconds || !box){ return; }
  stopCountdown();
  st.cdLeft = ex.data.timerSeconds;
  var cd = h("div","countdown"); cd.id = "excd";
  box.insertBefore(cd, box.children[1] || null);
  function paint(){
    cd.textContent = "\u23F1 Reduced time limit for this terminal task: " + st.cdLeft + "s remaining. When it reaches 0, your command is graded as typed.";
  }
  paint();
  st.cd = setInterval(function(){
    if(st.timer.manual){ return; }
    st.cdLeft -= 1;
    if(st.cdLeft <= 0){
      stopCountdown();
      checkAnswer(true);   /* grade as typed, even when the command is empty */
      return;
    }
    paint();
  }, 1000);
}
function stopCountdown(){ if(st.cd){ clearInterval(st.cd); st.cd = null; } }

/* ---------- renderers ---------- */
var RENDER = {};

RENDER.qcm = function(ex, box){

      b.classList.add("sel"); b.setAttribute("aria-pressed","true");
    });
    list.appendChild(b);
  });

RENDER.multi = function(ex, box){
  box.appendChild(h("div","smallnote","Select all that apply. There may be more than one correct item, and wrong picks cancel right picks."));

function makeChip(label, draggable){
  var c = h("button","chip",label); c.type="button";
  if(draggable){ c.setAttribute("draggable","true"); }
  return c;
}

RENDER.match = function(ex, box){
  var zones = ex.data.zones;
  var flat = [];
  zones.forEach(function(z, zi){ z.items.forEach(function(it){ flat.push({t:it.t, why:it.why||"", zi:zi}); }); });
  var order = shuffle(flat.map(function(_,i){ return i; }));
  var place = [];
  flat.forEach(function(_,i){ place[i] = -1; });
  var held = null;
  box.appendChild(h("div","smallnote","Drag each card onto the zone where it belongs. You can also click a card, then click a zone. Click a placed card to send it back."));
  var bank = h("div","bank"); bank.id = "bank";
  var zoneEls = [];
  var wrap = h("div","zonewrap");
  zones.forEach(function(z, zi){
    var row = h("div","zonerow");
    var lab = h("div","zonelabel", z.label);
    var zone = h("div","zone"); zone.dataset.zi = zi;
    zone.setAttribute("role","button");
    zone.setAttribute("tabindex","0");
    zone.setAttribute("aria-label","Drop zone: "+z.label+". Select a card first, then press Enter here to place it.");
    zone.addEventListener("dragover", function(e){ e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop", function(e){
      e.preventDefault(); zone.classList.remove("over");
      var id = e.dataTransfer.getData("text/plain");
      if(id !== ""){ placeItem(parseInt(id,10), zi); }
    });
    function zoneActivate(){
      if(held !== null){ placeItem(held, zi); held = null; clearHeld(); }
    }
    zone.addEventListener("click", zoneActivate);
    zone.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); zoneActivate(); } });
    row.appendChild(lab); row.appendChild(zone);
    wrap.appendChild(row);
    zoneEls.push(zone);
  });
  function clearHeld(){
    Array.prototype.forEach.call(bank.children, function(c){ c.classList.remove("held"); });
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(c){ c.classList.remove("held"); });
  }
  var chipEls = [];
  function placeItem(id, zi){
    if(st.graded[st.cur]){ return; }
    place[id] = zi;
    var el = chipEls[id];
    zoneEls[zi].appendChild(el);
    el.classList.remove("held");
  }
  function backToBank(id){
    if(st.graded[st.cur]){ return; }
    place[id] = -1;
    bank.appendChild(chipEls[id]);
  }
  order.forEach(function(id, n){
    var el = makeChip(flat[id].t, true);
    el.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(id)); });
    el.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(place[id] >= 0){ backToBank(id); return; }
      if(held === id){ held = null; clearHeld(); return; }
      held = id; clearHeld(); el.classList.add("held");
    });
    chipEls[id] = el;
    bank.appendChild(el);
  });
  box.appendChild(bank);
  box.appendChild(wrap);
  return {
    collect: function(){ return {place: place.slice()}; }
  };
};

function seqRenderer(kind){
  return function(ex, box){
    var items = ex.data.items;
    var cur = shuffle(items.map(function(_,i){ return i; }));
    var note = kind === "rank"
      ? "Position 1 is the most severe. Use the arrows to move items."
      : "Put the steps in order. Use the arrows to move items.";
    box.appendChild(h("div","smallnote",note));
    var listEl = h("div","seq");
    function paint(){
      listEl.innerHTML = "";
      cur.forEach(function(id, pos){
        var row = h("div","seqrow");
        row.setAttribute("draggable","true");
        row.appendChild(h("span","pos", String(pos+1)));
        row.appendChild(h("span","txt", items[id].t));
        var up = h("button","btn mv","\u2191"); up.type="button"; up.setAttribute("aria-label","Move up");
        var dn = h("button","btn mv","\u2193"); dn.type="button"; dn.setAttribute("aria-label","Move down");
        up.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === 0){ return; }
          var t = cur[pos-1]; cur[pos-1] = cur[pos]; cur[pos] = t; paint();
        });
        dn.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === cur.length-1){ return; }
          var t = cur[pos+1]; cur[pos+1] = cur[pos]; cur[pos] = t; paint();
        });
        row.appendChild(up); row.appendChild(dn);
        row.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
        row.addEventListener("dragover", function(e){ e.preventDefault(); });
        row.addEventListener("drop", function(e){
          e.preventDefault();
          if(st.graded[st.cur]){ return; }
          var from = parseInt(e.dataTransfer.getData("text/plain"),10);
          if(isNaN(from) || from === pos){ return; }
          var moved = cur.splice(from,1)[0];
          cur.splice(pos,0,moved);
          paint();
        });
        listEl.appendChild(row);
      });
    }
    paint();
    box.appendChild(listEl);
    return {
      collect: function(){ return {seq: cur.slice()}; }
    };
  };
}
RENDER.order = seqRenderer("order");
RENDER.rank = seqRenderer("rank");

RENDER.fill = function(ex, box){
  var slots = ex.data.slots;
  var bankWords = ex.data.bank.map(function(w){ return w; });
  var shuffled = shuffle(bankWords);
  var filled = slots.map(function(){ return null; });
  var held = null;
  box.appendChild(h("div","smallnote","Pick a word from the bank and drop it into a blank. Click a filled blank to put the word back. The bank is shuffled and contains extra words."));
  var textEl = h("div","filltext");
  var bankEl = h("div","bank");
  var text = ex.data.text;
  var parts = text.split(/\{(\d+)\}/);
  function makeBankChip(word){
    var c = makeChip(word, true);
    c.dataset.word = word;
    c.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", word); });
    c.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(held === word){ held = null; c.classList.remove("held"); return; }
      held = word;
      Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
      c.classList.add("held");
    });
    return c;
  }
  function placeWord(si, word){
    if(filled[si] !== null){ bankEl.appendChild(makeBankChip(filled[si])); }
    filled[si] = word;
    held = null;
    Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
    var old = bankEl.querySelector('[data-word="' + word.replace(/"/g,"\\\"") + '"]');
    if(old){ bankEl.removeChild(old); }
    paintText();
  }
  function paintText(){
    textEl.innerHTML = "";
    parts.forEach(function(p, i){
      if(i % 2 === 0){ textEl.appendChild(document.createTextNode(p)); return; }
      (function(si){
        var slot = h("button","slot"); slot.type="button";
        slot.textContent = filled[si] === null ? "blank " + (si+1) : filled[si];
        if(filled[si] !== null){ slot.classList.add("filled"); }
        slot.setAttribute("aria-label","Blank "+(si+1));
        slot.addEventListener("click", function(){
          if(st.graded[st.cur]){ return; }
          if(filled[si] !== null){
            bankEl.appendChild(makeBankChip(filled[si]));
            filled[si] = null; paintText();
          } else if(held !== null){
            placeWord(si, held);
          }
        });
        slot.addEventListener("dragover", function(e){ e.preventDefault(); slot.classList.add("over"); });
        slot.addEventListener("dragleave", function(){ slot.classList.remove("over"); });
        slot.addEventListener("drop", function(e){
          e.preventDefault(); slot.classList.remove("over");
          if(st.graded[st.cur]){ return; }
          var w = e.dataTransfer.getData("text/plain");
          if(w && bankEl.querySelector('[data-word="' + w.replace(/"/g,"\\\"") + '"]')){ placeWord(si, w); }
        });
        textEl.appendChild(slot);
      })(parseInt(p,10));
    });
  }
  shuffled.forEach(function(w){ bankEl.appendChild(makeBankChip(w)); });
  box.appendChild(textEl);
  box.appendChild(h("div","smallnote","Word bank (shuffled):"));
  box.appendChild(bankEl);
  paintText();
  return {
    collect: function(){ return {filled: filled.slice()}; }
  };
};

function linePicker(kind){
  return function(ex, box){
    var multi = !!ex.data.multi;
    if(multi){
      box.appendChild(h("div","smallnote","Select all the lines that apply, then press Check."));
    } else {
      box.appendChild(h("div","smallnote","Click the one line that answers the question, then press Check."));
    }
    var filter = h("input","filterbox");
    filter.type = "text";
    filter.placeholder = kind === "log" ? "Filter lines (like Kibana or Splunk)..." : "Filter lines...";
    filter.setAttribute("aria-label","Filter log lines");
    var picked = [];
    var listEl = h("div", kind === "log" ? "loglines" : "spotlines");
    function rowClick(i){
      if(st.graded[st.cur]){ return; }
      if(multi){
        var p = picked.indexOf(i);
        if(p >= 0){ picked.splice(p,1); } else { picked.push(i); }
        paint();
      } else {
        picked = [i];
        paint();
      }
    }
    function paint(){
      listEl.innerHTML = "";
      ex.data.lines.forEach(function(line, i){
        if(filter.value && String(line).toLowerCase().indexOf(filter.value.toLowerCase()) < 0){ return; }
        if(kind === "log"){
          var row = h("div","logline");
          row.setAttribute("role","button"); row.setAttribute("tabindex","0");
          row.appendChild(h("span","ln", String(i+1)));
          var body = h("span",null,""); body.innerHTML = hlLog(line);
          row.appendChild(body);
          if(picked.indexOf(i) >= 0){ row.classList.add("sel"); }
          row.addEventListener("click", function(){ rowClick(i); });
          row.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); rowClick(i); } });
          listEl.appendChild(row);
        } else {
          var b = h("button","spotline"); b.type="button";
          b.textContent = line;
          if(picked.indexOf(i) >= 0){ b.classList.add("sel"); }
          b.addEventListener("click", function(){ rowClick(i); });
          listEl.appendChild(b);
        }
      });
      if(!listEl.children.length){
        listEl.appendChild(h("div","logline","(no lines match the filter)"));
      }
    }
    filter.addEventListener("input", paint);
    box.appendChild(filter);
    box.appendChild(listEl);
    paint();
    return {
      collect: function(){ return {picked: picked.slice().sort()}; }
    };
  };
}
RENDER.logview = linePicker("log");
RENDER.spot = linePicker("spot");

RENDER.triage = function(ex, box){
  box.appendChild(h("div","smallnote","Choose one response for each alert, then press Check."));
  var actIdx = ex.data.actions.map(function(_,i){ return i; });
  var actOrder = shuffle(actIdx);
