/* ---------- graders ---------- */
var GRADER = {};
function itemLists(ex){ return ex; }

GRADER.qcm = function(ex, ans){
  var picked = ans.picked;
  var ok = picked !== null && picked !== undefined && ex.data.options[picked] && ex.data.options[picked].correct;
  var correctText = "";
  ex.data.options.forEach(function(o){ if(o.correct){ correctText = o.t; } });
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: correctText,
    correctWhy: (function(){ var w=""; ex.data.options.forEach(function(o){ if(o.correct){ w = o.why||""; } }); return w; })()};
};

GRADER.multi = function(ex, ans){
  var sel = ans.sel || [];
  var c=0,w=0, right=[],wrong=[],missed=[];
  ex.data.options.forEach(function(o, oi){
    var chosen = sel.indexOf(oi) >= 0;
    if(o.correct){ if(chosen){ c++; right.push({label:o.t, why:o.why||""}); } else { missed.push({label:o.t, why:o.why||""}); } }
    else if(chosen){ w++; wrong.push({label:o.t, why:o.why||""}); }
  });
  return {c:c, w:w, t:right.length+missed.length, select:true, right:right, wrong:wrong, missed:missed};
};

GRADER.match = function(ex, ans){
  var zones = ex.data.zones;
  var flat = [];
  zones.forEach(function(z, zi){ z.items.forEach(function(it){ flat.push({t:it.t, why:it.why||"", zi:zi}); }); });
  var c=0, right=[],wrong=[],missed=[];
  flat.forEach(function(it, i){
    var p = ans.place[i];
    if(p === it.zi){ c++; right.push({label:it.t, why:it.why || "Correctly placed in \u201C" + zones[it.zi].label + "\u201D."}); }
    else if(typeof p === "number" && p >= 0){ wrong.push({label:it.t, why:"You placed it in \u201C" + zones[p].label + "\u201D. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
    else { missed.push({label:it.t, why:"You left it in the bank. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
  });
  return {c:c, w:0, t:flat.length, select:false, right:right, wrong:wrong, missed:missed};
};

function seqGrader(ex, ans){
  var n = ex.data.items.length;
  var c=0, right=[],wrong=[],missed=[];
  for(var p=0;p<n;p++){
    var id = ans.seq[p];
    if(typeof id !== "number" || id < 0 || id >= n){
      missed.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."});
      continue;
    }
    if(id === p){ c++; right.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."}); }
    else { wrong.push({label: ex.data.items[id].t, why:"You put it at position " + (p+1) + ". It belongs at position " + (id+1) + ". " + (ex.data.items[id].why || "")}); }
  }
  return {c:c, w:0, t:n, select:false, right:right, wrong:wrong, missed:missed};
}
GRADER.order = seqGrader;
GRADER.rank = seqGrader;

GRADER.fill = function(ex, ans){
  var slots = ex.data.slots;
  var why = ex.data.slotWhy || slots.map(function(){ return ""; });
  var c=0, right=[],wrong=[],missed=[];
  slots.forEach(function(s, i){
    var f = ans.filled[i];
    if(f === s){ c++; right.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
    else if(f){ wrong.push({label:"Blank " + (i+1) + ": you chose \u201C" + f + "\u201D", why:"The correct word is \u201C" + s + "\u201D. " + why[i]}); }
    else { missed.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
  });
  return {c:c, w:0, t:slots.length, select:false, right:right, wrong:wrong, missed:missed};
};

function pickGrader(ex, ans){
  var pick = ex.data.pick;
  if(ex.data.multi){
    var sel = ans.picked || [];
    var c=0,w=0, right=[],wrong=[],missed=[];
    pick.forEach(function(i){ if(sel.indexOf(i) >= 0){ c++; right.push({label:ex.data.lines[i], why:ex.data.lineWhy ? ex.data.lineWhy[pick.indexOf(i)] || "" : ""}); } else { missed.push({label:ex.data.lines[i], why:"This line is part of the answer." + (ex.data.lineWhy ? " " + (ex.data.lineWhy[pick.indexOf(i)] || "") : "")}); } });
    sel.forEach(function(i){ if(pick.indexOf(i) < 0){ w++; wrong.push({label:ex.data.lines[i], why:ex.data.wrongWhy && ex.data.wrongWhy[i] ? ex.data.wrongWhy[i] : "This line does not answer the question."}); } });
    return {c:c, w:w, t:pick.length, select:true, right:right, wrong:wrong, missed:missed};
  }
  var ok = ans.picked && ans.picked.length === 1 && ans.picked[0] === pick[0];
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: ex.data.lines[pick[0]],
    correctWhy: ex.data.lineWhy ? (ex.data.lineWhy[0] || "") : ""};
}
GRADER.logview = pickGrader;
GRADER.spot = pickGrader;

GRADER.triage = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.alerts.forEach(function(a, i){
    var ch = ans.choice[i];
    var label = "Alert " + (i+1) + (a.tag ? " (" + a.tag + ")" : "") + " \u2192 " + ex.data.actions[a.correct];
    if(ch === a.correct){ c++; right.push({label:label, why:a.why || ""}); }
    else if(ch !== null && ch !== undefined){ wrong.push({label:"Alert " + (i+1) + ": you chose \u201C" + ex.data.actions[ch] + "\u201D", why:"Correct: \u201C" + ex.data.actions[a.correct] + "\u201D. " + (a.why || "")}); }
    else { missed.push({label:label, why:a.why || ""}); }
  });
  return {c:c, w:0, t:ex.data.alerts.length, select:false, right:right, wrong:wrong, missed:missed};
};

GRADER.term = function(ex, ans){
  var d = ex.data;
  var cmd = normCmdMatch(ans.cmd);
  var c=0, w=0, forb=[], missReq=[];
  (d.required||[]).forEach(function(r){ if(new RegExp(r,"i").test(cmd)){ c++; } else { missReq.push(r); } });
  (d.forbidden||[]).forEach(function(f){ if(new RegExp(f.re,"i").test(cmd)){ w++; forb.push(f); } });
  return {c:c, w:w, t:(d.required||[]).length, select:true,
    term:{cmd:ans.cmd, canonical:d.canonical, parts:d.parts||[], forb:forb, missReq:missReq, matched: c === (d.required||[]).length && w === 0},
    right:[], wrong:[], missed:[]};
};

GRADER.branch = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.steps.forEach(function(s, i){
    var chosen = ans.sel[i];
    var correctIdx = -1;
    s.options.forEach(function(o, oi){ if(o.correct){ correctIdx = oi; } });
    var correctText = correctIdx >= 0 ? s.options[correctIdx].t : "";
    var correctWhy = correctIdx >= 0 ? (s.options[correctIdx].why || "") : "";
    if(chosen === correctIdx){ c++; right.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
    else if(chosen !== null && chosen !== undefined){
      wrong.push({label:"Step " + (i+1) + ": you chose \u201C" + s.options[chosen].t + "\u201D",
        why:"Correct: \u201C" + correctText + "\u201D. " + correctWhy + (s.options[chosen].why ? " Your pick: " + s.options[chosen].why : "")});
    }
    else { missed.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
  });
  return {c:c, w:0, t:ex.data.steps.length, select:false, right:right, wrong:wrong, missed:missed};
};

          var uls = h("ul",null);
          eg.missed.forEach(function(it2){ var li2 = h("li",null); li2.textContent = it2.label + (it2.why ? " \u2014 " + it2.why : ""); uls.appendChild(li2); });
          bd.appendChild(uls);
        }
      }catch(e2){}
      if(ex.explain){ bd.appendChild(h("p",null,ex.explain)); }
      if(ex.study){ bd.appendChild(h("div","study","What to study next: " + ex.study)); }
    }
    item.appendChild(hd);
    item.appendChild(bd);
    function toggle(){ item.classList.toggle("open"); }
    hd.addEventListener("click", toggle);
    hd.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
    rep.appendChild(item);
  });
  stage.appendChild(rep);

  var foot = h("div","foot");
  var rt = h("button","btn primary","\u21BA Retake exam"); rt.type="button";
  rt.addEventListener("click", retake);
  foot.appendChild(rt);
  stage.appendChild(foot);

  if(st.user){ sec.insertBefore(h("div","smallnote","Candidate: " + st.user), sec.firstChild); }
  updateHeader();
  window.scrollTo(0,0);
  if(!st.reported){
    st.reported = true;
    reportScore(earned, poss);
  }
}

function reportScore(pointsEarned, pointsPossible){
  var percent = pointsPossible > 0 ? Math.round((pointsEarned / pointsPossible) * 100) : 0;
  try{
    parent.postMessage({
      type: "CYBERPULSE_SCORE",
      topicId: E.meta.topicId,
      batch: E.meta.batch,
      score: pointsEarned,
      total: pointsPossible,
      percent: percent,
      passed: percent >= E.meta.passMark
    }, location.origin);
  }catch(e){ /* opened directly, not inside the site: nothing to report to */ }
}

/* ---------- retake ---------- */
function emptyAnsFor(type){
  switch(type){
    case "qcm": return {picked:null};
    case "multi": return {sel:[]};
    case "match": return {place:[]};
    case "order": case "rank": return {seq:[]};
    case "fill": return {filled:[]};
    case "logview": case "spot": return {picked:[]};
    case "triage": return {choice:[]};
    case "term": return {cmd:""};
    case "branch": return {sel:[]};
  }
  return {};
}
function retake(){
  st.graded = {}; st.ans = {}; st.hint = {}; st.skipped = {};
  st.fromReview = false; st.reported = false; st.finished = false;
  st.timer.left = st.timer.total; st.timer.manual = false; st.timer.auto = false;
  st.order = shuffle(E.exercises.map(function(_,i){ return i; }));
  st.pos = 0;
  $("overlay").classList.add("hidden");
  startExam();
}

/* ---------- intro ---------- */
function renderIntro(){
  st.phase = "intro";
  clearStage();
  var stage = $("stage");
  var sec = h("section","card");
  var head = h("div",null);
  var badge = h("span","badge sev-"+E.sevKey, E.sevLabel);
  head.appendChild(badge);
  sec.appendChild(head);
  sec.appendChild(h("div","herotitle", E.title));
  var chips = h("div","metchips");
  [["\u23F1 " + Math.round(E.timerSeconds/60) + " minutes total"],
   ["\u2611 " + E.exercises.length + " exercises, 100 points each"],
   ["\u2713 Pass mark: " + E.meta.passMark + "%"],
   ["\u24D8 Hints cost 10% of one exercise"],
   ["\u23ED Skipped-and-unanswered exercises are excluded from the score"]
  ].forEach(function(x){ chips.appendChild(h("span","mchip", x[0])); });
  sec.appendChild(chips);
  E.intro.forEach(function(block){
    sec.appendChild(h("div","h2", block.h2));
    if(block.paras){
      block.paras.forEach(function(p){ sec.appendChild(h("p",null,p)); });
    }
    if(block.list){
      var ul = h("ul","rules");
      block.list.forEach(function(x){ ul.appendChild(h("li",null,x)); });
      sec.appendChild(ul);
    }
  });
  sec.appendChild(h("div","h2","Keywords covered in this topic (all four severity tiers)"));
  E.themes.forEach(function(t){
    var tb = h("div","themebox");
    tb.appendChild(h("div","th", t[0]));
    var cs = h("div","concepts");
    t[1].forEach(function(c){ cs.appendChild(h("span","cpt",c)); });
    tb.appendChild(cs);
    sec.appendChild(tb);
  });
  var sb = h("button","btn go bigstart","\u25B6 Start the exam"); sb.type="button";
  sb.addEventListener("click", startExam);
  sec.appendChild(sb);
  stage.appendChild(sec);
  updateHeader();
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
function startExam(){
  if(!st.order.length){
    st.order = shuffle(E.exercises.map(function(_,i){ return i; }));
    st.pos = 0;
  }
  st.phase = "exam";
  showExercise(st.order[st.pos]);
}

window.addEventListener("message", function(event){
  if(!event.data){ return; }
  if(event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT"){ return; }
  try{
    if(event.data.username){ st.user = String(event.data.username); }
  }catch(e){}
});

document.addEventListener("DOMContentLoaded", function(){
  buildHeader();
  buildOverlay();
  renderIntro();
});
})();
/*ENGINE-END*/

</script>
</body>
</html>
