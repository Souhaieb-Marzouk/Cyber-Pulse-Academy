<style>

:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#111a2c; --panel2:#0d1524; --line:#22304a;
  --txt:#e6edf7; --mut:#a8b3c7; --blue:#4da3ff; --amber:#ffb454; --green:#3ddc97;
  --orange:#ff8a4c; --red:#ff5c72; --grey:#9aa7b8; --cyan:#5fd4e6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 20% -10%, #12203a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt);

}
#app{max-width:1000px;margin:0 auto;padding:0 14px 60px;}
.hidden{display:none !important;}
/* ---------- sticky exam header ---------- */
.bar{

  background:rgba(13,21,36,.96);border:1px solid var(--line);border-radius:0 0 12px 12px;
  padding:10px 12px;margin:0 -14px 14px;backdrop-filter:blur(4px);
}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bar .spacer{flex:1 1 auto;}
.badge{
  display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;
  letter-spacing:.4px;color:#08101e;border:1px solid rgba(255,255,255,.25);
}
.sev-easy{background:var(--green);}
.sev-medium{background:var(--amber);}
.sev-hard{background:var(--orange);}
.sev-xhard{background:var(--red);}
.counter{font-weight:700;font-size:15px;}
.timerbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;}
.timerbox .tval{font-weight:700;font-size:16px;}
.tmode{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);}
.tmode-run{color:#0a1a12;background:var(--green);}
.tmode-manual{color:#1d1405;background:var(--amber);}
.tmode-auto{color:#0a1626;background:var(--cyan);}
.tmode-ready{color:var(--mut);}
.scorebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;}
.btn{
  min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;cursor:pointer;
  background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:600;font-size:14.5px;
}
.btn:hover:not(:disabled){border-color:var(--blue);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04101f;}
.btn.go{background:var(--green);border-color:var(--green);color:#04140c;}
.btn.warn{border-color:var(--amber);color:var(--amber);}
.btn.danger{border-color:var(--red);color:var(--red);}
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
/* ---------- cards & the three contract blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
.cardhead{
  display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1.2px;font-size:14px;
  text-transform:uppercase;margin-bottom:10px;
}
.cicon{display:inline-flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--line);background:var(--panel2);}
.scen{border-left:5px solid var(--blue);background:linear-gradient(180deg,#101c33,#111a2c);}
.scenhead{color:var(--blue);}
.qblock{border-left:5px solid var(--amber);background:linear-gradient(180deg,#1d1a10,#111a2c);}
.qblock .cardhead{color:var(--amber);}
.ansblock{border-left:5px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);}
.ansblock .cardhead{color:var(--green);}
.qtext{font-weight:700;font-size:17px;}
.smallnote{color:var(--mut);font-size:14px;margin:4px 0 10px;}
.divider{height:1px;background:var(--line);margin:14px 0;border:0;}
.art{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
.art-label{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;}
.art p{margin:6px 0;}
pre.code{
  font:14.5px/1.5 Consolas,"Courier New",monospace;background:#0a111f;border:1px solid var(--line);

}
.collapsebtn{margin-left:auto;min-height:44px;padding:4px 12px;border-radius:8px;font-size:12.5px;}
.scensummary{color:var(--mut);font-size:13.5px;font-style:italic;}
/* ---------- options ---------- */

.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:48px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  color:var(--txt);font-size:15.5px;cursor:pointer;
}
.opt:hover{border-color:var(--blue);}
.opt.sel{border-color:var(--green);background:#10241c;}
.opt .optlbl{font-weight:800;color:var(--cyan);flex:0 0 auto;}
.opt .opttxt{flex:1;}
.opt.picked-good{border-color:var(--green);}
.opt.picked-bad{border-color:var(--red);}
.opt.show-good{border-color:var(--green);}
/* ---------- drag & drop / matching ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.chip{
  min-height:44px;padding:8px 14px;border-radius:10px;background:#182540;
  border:1px solid var(--line);cursor:grab;font-size:14.5px;color:var(--txt);
}
.chip.held{border-color:var(--amber);background:#2a2413;}
.chip.used{opacity:.35;cursor:default;}
.zonewrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.zonerow{display:grid;grid-template-columns:minmax(140px,240px) 1fr;gap:8px;align-items:stretch;}
.zonelabel{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;}
.zone{
  min-height:52px;border:1.5px dashed #33486e;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;background:#0c1424;
}
.zone.over{border-color:var(--amber);}
.zone .chip{cursor:pointer;}
/* ---------- ordering / ranking ---------- */
.seq{display:flex;flex-direction:column;gap:6px;}
.seqrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;}
.seqrow .pos{flex:0 0 34px;text-align:center;font-weight:800;color:var(--cyan);}
.seqrow .txt{flex:1;font-size:15px;}
.seqrow .mv{min-height:44px;min-width:44px;padding:4px 8px;border-radius:8px;}
/* ---------- fill in the blank ---------- */
.filltext{font-size:16px;line-height:2;}
.slot{
  display:inline-block;min-width:120px;min-height:38px;border:1.5px dashed #33486e;border-radius:8px;
  background:#0c1424;color:var(--cyan);font-weight:700;padding:4px 10px;margin:0 4px;vertical-align:middle;cursor:pointer;
}
.slot.filled{border-style:solid;border-color:var(--green);}
.slot.over{border-color:var(--amber);}
/* ---------- log viewer ---------- */
.filterbox{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:8px 12px;font-size:14.5px;margin-bottom:8px;}
.loglines{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0a111f;}
.logline{
  display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #16223a;cursor:pointer;
  font:14px/1.5 Consolas,"Courier New",monospace;align-items:flex-start;
}
.logline:hover{background:#101b30;}
.logline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
.logline .ln{color:#5b6b85;flex:0 0 auto;min-width:26px;}
.t-stamp{color:var(--amber);}
.t-eid{color:var(--cyan);font-weight:700;}
.t-acct{color:#b7c9ff;}
/* ---------- spot the line ---------- */
.spotlines{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.spotline{
  display:block;width:100%;text-align:left;background:#0a111f;border:0;border-bottom:1px solid #16223a;
  color:#d7e3f4;font:14.5px/1.5 Consolas,"Courier New",monospace;padding:9px 12px;cursor:pointer;white-space:pre-wrap;
}
.spotline:hover{background:#101b30;}
.spotline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
/* ---------- terminal ---------- */
.term{background:#050a14;border:1px solid var(--line);border-radius:10px;padding:10px;}
.termout{
  font:14px/1.55 Consolas,"Courier New",monospace;color:#c9d7ea;max-height:260px;overflow:auto;
  white-space:pre-wrap;margin:0 0 8px;
}
.termrow{display:flex;align-items:center;gap:8px;}
.termprompt{font:14.5px Consolas,"Courier New",monospace;color:var(--green);white-space:nowrap;}
.termin{flex:1;background:transparent;border:0;border-bottom:1px solid #33486e;color:#e6f7ff;
  font:14.5px Consolas,"Courier New",monospace;min-height:38px;}
.support{background:#101c33;border:1px solid #243a5e;border-radius:10px;padding:10px 12px;margin:8px 0;}
.support .t{font-weight:800;color:var(--cyan);font-size:13px;letter-spacing:.6px;text-transform:uppercase;}
.countdown{display:inline-block;background:#2a1116;border:1px solid var(--red);color:var(--red);
  font-weight:800;border-radius:8px;padding:4px 10px;margin:6px 0;}
/* ---------- triage ---------- */

  border-radius:10px;padding:10px 12px;margin:10px 0;}
.alertcard .atitle{font-weight:800;color:var(--red);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.alertcard .abody{font-size:15px;margin:6px 0 10px;}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.act{
  min-height:44px;border-radius:10px;background:#0c1424;border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;font-size:14px;cursor:pointer;text-align:left;
}
.act:hover{border-color:var(--blue);}
.act.sel{border-color:var(--green);background:#10241c;font-weight:700;}
/* ---------- branching steps ---------- */
.stepchip{display:inline-block;background:#1a2a46;border:1px solid var(--line);color:var(--cyan);
  font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 12px;letter-spacing:.8px;margin-bottom:6px;}
.stepnarr{color:var(--mut);font-size:14.5px;margin:2px 0 8px;}

.fb-incorrect{border-left:6px solid var(--red);}

.fb-correct .fbhead{color:var(--green);}
.fb-partial .fbhead{color:var(--amber);}
.fb-incorrect .fbhead{color:var(--red);}

.fblist{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;}

.mchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600;}
.h2{font-size:18px;font-weight:800;margin:18px 0 6px;color:var(--cyan);}
.themebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;}
.themebox .th{font-weight:800;color:var(--amber);margin-bottom:6px;}
.concepts{display:flex;flex-wrap:wrap;gap:6px;}
.cpt{background:#0c1424;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mut);}
.rules li{margin:6px 0;}
.bigstart{width:100%;min-height:54px;font-size:17px;margin-top:14px;}
.revitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin:8px 0;}
.revitem .ri{flex:1;}
.revitem .rt{font-weight:700;}
.revitem .rs{color:var(--mut);font-size:13.5px;}
.ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--green) calc(var(--pct)*1%), #1c2942 0);margin:10px auto;}
.ring .in{width:130px;height:130px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring .pctv{font-size:30px;font-weight:800;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.stat .n{font-size:22px;font-weight:800;}
.stat .l{color:var(--mut);font-size:13px;}
.passpanel{border:1px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);border-radius:14px;
  padding:16px;text-align:center;margin:12px 0;}
.failpanel{border:1px solid var(--red);background:linear-gradient(180deg,#241016,#111a2c);border-radius:14px;

.themetable{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;}
.themetable th,.themetable td{border:1px solid var(--line);padding:7px 10px;text-align:left;}
.themetable th{background:var(--panel2);color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
.repitem{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel);}
.rephd{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap;}
.rephd .rp{font-weight:700;}
.rephd .rs{color:var(--mut);font-size:13px;}
.stchip{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;border:1px solid var(--line);}
.st-ok{background:#0f2a1c;color:var(--green);border-color:#1d5c3d;}

.st-no{background:#2a1218;color:var(--red);border-color:#6b2330;}

.repbd{border-top:1px solid var(--line);padding:12px 14px;display:none;}

.overlay{position:fixed;inset:0;background:rgba(4,8,16,.94);z-index:80;display:flex;align-items:center;justify-content:center;}

.foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}

}

  *{transition:none !important;animation:none !important;scroll-behavior:auto !important;}
}

<script>
var EXAM = {"title": "Active Directory Certificate Services — HARD", "sevKey": "hard", "sevLabel": "HARD", "timerSeconds": 2400, "terminalForgive": false, "themes": [["PKI Foundations", ["Certification Authority (CA)", "Root CA / offline root", "Subordinate (issuing) CA", "Enterprise CA vs Standalone CA", "Chain of trust", "AIA (Authority Information Access)", "CRL / Delta CRL / OCSP", "ntAuthCertificates", "Cert Publishers"]], ["Templates & Enrollment", ["Certificate templates", "EKU (Extended Key Usage)", "SAN (Subject Alternative Name)", "ENROLLEE_SUPPLIES_SUBJECT", "Autoenrollment (GPO)", "Web enrollment (/certsrv)", "CEP / CES", "Enrollment Agent", "CA roles: ManageCA / ManageCertificates", "EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE"]], ["Attack Paths (ESC)", ["ESC1 - template SAN abuse", "ESC2 - Any Purpose / no EKU", "ESC3 - enrollment agent abuse", "ESC4 - template write rights", "ESC5 - PKI object ACLs", "ESC6 - CA-wide SAN flag", "ESC7 - ManageCA / ManageCertificates abuse", "ESC8 - NTLM relay to enrollment endpoints", "ESC9 / ESC10 - weak certificate mapping", "Pass-the-certificate", "UnPAC-the-hash", "Shadow Credentials (msDS-KeyCredentialLink)", "Certificate theft (DPAPI / LSASS)", "Golden certificate"]], ["Tools & Commands", ["certutil", "certreq", "Certmgr.msc / Certlm.msc", "Certipy", "Certify", "Rubeus", "ForgeCert", "Mimikatz", "Whisker"]], ["Detection & Logging", ["Event 4886 / 4887 / 4888 (issued / approved / denied)", "Event 4870 (revoked)", "Event 4882 (CA backup)", "Event 4889 / 4890 (CA service start / stop)", "Event 4898 / 4899 (template change)", "Event 4768 (Kerberos PKINIT)", "Event 4771", "Sysmon process events", "CA audit policy"]], ["Hardening & Operations", ["Template ACL review", "Remove ENROLLEE_SUPPLIES_SUBJECT", "Clear CA EditFlags (ESC6)", "Strong certificate mapping", "Disable NTLM on enrollment endpoints", "EPA / channel binding", "Role separation", "CA backup / restore", "Key archival", "Renewal vs re-enrollment", "Revocation handling", "GPO autoenrollment policy", "PKI documentation / compliance"]]], "intro": [{"h2": "What is Active Directory Certificate Services (AD CS)?", "paras": ["AD CS is a role for Windows Server. It is Microsoft's built-in PKI. PKI means Public Key Infrastructure. A PKI makes, signs, checks and cancels digital certificates. A certificate is like a digital ID card. It proves that a user, a computer or a service is really who it claims to be.", "Imagine a big office building. The receptionist gives a plastic badge to every worker and visitor. The guards trust the badge because the receptionist signed it. In a Windows domain, the CA (Certification Authority) is that receptionist. AD CS is the whole badge office: the printer, the rules, the records and the cancel list."]}, {"h2": "Where you will meet AD CS in real work", "paras": ["AD CS touches many cybersecurity jobs. Here are the main ones:"], "list": ["Security engineers run and harden the CA servers. They create templates and keep the PKI healthy.", "SOC analysts watch certificate events on a shift. They look for strange certificate requests and strange logons.", "Incident responders investigate attacks that use certificates. They decide what to contain and what to keep as evidence.", "GRC teams write PKI policies and check that the rules are followed. They produce documents like template reviews and risk reports.", "Red teams test AD CS, because attackers love it: one unsafe template or one stolen CA key can let someone sign in as anybody, with no password needed."]}, {"h2": "What people do with it every day", "paras": ["Day to day, the people around a CA do a small set of repeating tasks:"], "list": ["They create and update certificate templates (the forms that describe how certificates are made).", "They approve or deny certificate requests.", "They renew certificates before they expire, and revoke (cancel) certificates that are lost or stolen.", "They publish revocation lists (CRLs) and keep CA backups.", "They write everything down for audits: policies, runbooks and incident reports."]}, {"h2": "The tools you will see", "paras": ["On Windows you will use built-in tools like Certutil, Certreq, Certmgr.msc and Certlm.msc. Security teams also use Certipy and Certify to find unsafe settings, Rubeus to work with Kerberos tickets, and Mimikatz or Whisker in attack simulations. Command tasks in this exam run in a safe fake shell, so you can practise without any risk."]}, {"h2": "The risks AD CS must control", "paras": ["Certificates often replace passwords. So certificate attacks are like password attacks, but much quieter. The classic unsafe patterns have names like ESC1 to ESC10 from well-known research. Examples: a template that lets a requester type any name, a CA-wide flag that accepts any subject, or an NTLM relay to the enrollment website. If attackers steal the CA private key, they can forge certificates for years (a golden certificate).", "This exam teaches you to spot these patterns, to see them in logs, and to fix them."]}, {"h2": "How scoring works (please read)", "list": ["Every exercise is worth 100 points. Your percentage is your points divided by the points of the exercises you actually answered.", "Some exercises have several parts (for example drag-and-drop slots or select-all answers). You get part of the points for the parts you get right.", "In select-all exercises, every wrong pick cancels one right pick.", "In slot exercises (matching, ordering, fill-the-blank, triage, branching), each correct slot gives its own share of the points. A wrong slot only loses its own share.", "The Hint button shows a nudge, never the answer. It costs 10% of that one exercise's points.", "Skip moves an exercise to a review pool without showing the answer. You can go back as long as the timer runs. If you never answer a skipped exercise, it is excluded from the score: it adds nothing to your points and nothing to the maximum.", "The live score in the header always shows points earned out of points possible, over the exercises you have actually answered."]}, {"h2": "How the timer works", "list": ["You have a total time for this file (shown in the chips above).", "The Pause button stops the timer and hides the exercise. Press Resume when you are ready.", "When you press Check, the timer also stops, so you can read the explanation for free. Nothing is hidden while you read.", "The timer starts again when you press Next.", "The timer area always shows its state: running, paused by you, or paused for feedback."]}, {"h2": "What this file tests and how hard it is", "paras": ["This is the HARD file. Scenarios are longer and artefacts must be read together. Wrong answers are near-misses: at least two options are defensible in a different context, but wrong here. In about a third of the exercises the “obvious” answer is the wrong one.", "Hints remove one wrong path — they never name the correct concept. Terminal tasks give you the objective and the environment only: no tool is named, and near-miss flags are one keystroke away."]}, {"h2": "Exercise types in this file", "paras": ["This file mixes many interactive formats — not just multiple choice:"], "list": ["Log analysis in a filterable log viewer", "Select-all-that-apply questions with partial credit", "Branching scenarios and dual red/blue perspectives", "Spot-the-mistake (click the wrong line)", "Drag-and-drop matching (cards onto zones)", "Terminal emulator tasks (safe fake shell)", "SOC alert-queue triage with consequences", "Risk ranking (most severe first)", "Fill-in-the-blank with a shuffled word bank", "Single-choice questions with tricky distractors"]}], "meta": {"topicId": "active-directory-certificate-services", "batch": 3, "title": "Active Directory Certificate Services — HARD", "difficulty": "hard", "questionCount": 17, "estimatedMinutes": 40, "passMark": 70}, "exercises": [{"id": "H01", "type": "logview", "theme": "Detection & Logging", "title": "The night shift issuance", "scenario": {"summary": "Six issuances — one is ESC1-shaped", "blocks": [{"label": "Context", "prose": "03:00–03:20 on CORP-CA-01. Machine autoenrollment ran at 03:05 as usual. Read every line before you answer."}, {"label": "ARTEFACT 1 — CA issuance log extract", "code": "03:01:12  4886  Issued.  Requester: CORP\\LT-2231$    Template: WorkstationAuthentication  SAN: CORP\\LT-2231$\n03:05:00  4886  Issued.  Requester: CORP\\LT-2231$    Template: WorkstationAuthentication  (renewal)\n03:05:44  4886  Issued.  Requester: CORP\\LT-2244$    Template: WorkstationAuthentication  SAN: CORP\\LT-2244$\n03:07:01  4886  Issued.  Requester: CORP\\LT-2251$    Template: WorkstationAuthentication  SAN: CORP\\LT-2251$\n03:12:39  4887  Approved. Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex\n03:12:40  4886  Issued.  Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex  Subject: CORP\\A-Administrator  EKU: Client Authentication\n03:13:02  4768  TGT requested. Account: CORP\\A-Administrator  Pre-auth: PKINIT (cert)\n03:15:10  4886  Issued.  Requester: CORP\\LT-2260$    Template: WorkstationAuthentication  SAN: CORP\\LT-2260$"}]}, "question": "Click the single line that proves a certificate was issued for a name the requester does not own.", "hint": "Autoenrollment lines always pair a computer with its own name. One line breaks that pairing — the requester and the subject do not match.", "data": {"multi": false, "lines": ["03:01:12  4886  Issued.  Requester: CORP\\LT-2231$    Template: WorkstationAuthentication  SAN: CORP\\LT-2231$", "03:05:00  4886  Issued.  Requester: CORP\\LT-2231$    Template: WorkstationAuthentication  (renewal)", "03:05:44  4886  Issued.  Requester: CORP\\LT-2244$    Template: WorkstationAuthentication  SAN: CORP\\LT-2244$", "03:07:01  4886  Issued.  Requester: CORP\\LT-2251$    Template: WorkstationAuthentication  SAN: CORP\\LT-2251$", "03:12:39  4887  Approved. Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex", "03:12:40  4886  Issued.  Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex  Subject: CORP\\A-Administrator  EKU: Client Authentication", "03:13:02  4768  TGT requested. Account: CORP\\A-Administrator  Pre-auth: PKINIT (cert)", "03:15:10  4886  Issued.  Requester: CORP\\LT-2260$    Template: WorkstationAuthentication  SAN: CORP\\LT-2260$"], "pick": [5], "lineWhy": ["The requester is svc-helpdesk, but the subject is A-Administrator. A certificate that says “I am the admin”, signed by your own CA, is the ESC1 payoff."], "wrongWhy": {"4": "The approval (4887) matters, but it does not itself show whose name is inside the certificate.", "6": "The PKINIT TGT shows the certificate being used — the question asks for the issuance that proves the mismatch."}}, "explain": "The baseline here is boring on purpose: computers request certificates with their own names. The anomaly is a human service account receiving a Client Authentication certificate whose subject is an administrator, one second before that administrator “logs on” with a certificate. That is the ESC1 chain: caller-chosen subject, issuance, PKINIT. The 4887 approval line also tells you a Certificate Manager waved it through — worth a second finding.", "study": "Build a detection that compares 4886 requester against subject/SAN and alerts on mismatch."}, {"id": "H02", "type": "multi", "theme": "Templates & Enrollment", "title": "Audit of BackupOps-Auth", "scenario": {"summary": "Select every dangerous setting", "blocks": [{"label": "ARTEFACT 1 — Template card: BackupOps-Auth", "code": "Template common name:   BackupOps-Auth\nEKU:                    Client Authentication\nName flag:              ENROLLEE_SUPPLIES_SUBJECT\nEnrollment rights:      CORP\\ServiceDesk (and CORP\\Domain Admins)\nOwner:                  CORP\\ServiceDesk-Admins (also holds ManageCertificates on CORP-CA-01)\nKey size:               2048-bit RSA\nValidity:               1 year\nPublished on:           CORP-CA-01 (issuing CA)"}]}, "question": "Select every setting that makes this template dangerous. Select all that apply.", "hint": "Ask of every line: does it help someone become somebody else, or approve the request themselves?", "data": {"options": [{"t": "Client Authentication EKU — allows the certificate to log on", "correct": true, "why": "A logon-capable EKU is what turns a stolen or abused certificate into domain access."}, {"t": "ENROLLEE_SUPPLIES_SUBJECT — requesters pick the subject themselves", "correct": true, "why": "Caller-chosen subject removes the link between requester and certificate name."}, {"t": "CORP\\ServiceDesk may enroll from this template", "correct": true, "why": "A broad, often-compromised helpdesk group can request from this template."}, {"t": "The owner group also holds ManageCertificates on the CA", "correct": true, "why": "The same team can approve its own dangerous requests — no second pair of eyes."}, {"t": "A 2048-bit RSA key size for the certificate's private key", "correct": false, "why": "A near-miss: 2048-bit RSA is still an accepted baseline in most PKIs. Not the problem here."}, {"t": "A 1-year validity period for every certificate it issues", "correct": false, "why": "A near-miss: one year is a common, defensible choice. It does not enable impersonation."}, {"t": "Published on CORP-CA-01, the domain's current issuing CA", "correct": false, "why": "Templates must be published on an issuing CA to be usable at all. That is normal."}, {"t": "Domain Admins keep their own enrollment rights on the template", "correct": false, "why": "Admins holding enrollment rights is expected and harmless."}]}, "explain": "Four settings make this template dangerous, and they chain together: a logon EKU, caller-chosen subjects, a broad enrollment group, and an owner that can approve its own requests. Remove any one of the four and the chain weakens. The near-misses (key size, validity, publication, admin rights) are the settings auditors argue about forever — they are defensible defaults, not attack enablers.", "study": "Write the four-chain rule in your template review checklist: EKU, subject flag, enrollment rights, approver overlap."}, {"id": "H03", "type": "branch", "theme": "Attack Paths (ESC)", "title": "Duplicated template, three moves", "scenario": {"summary": "Red makes a template, blue closes it", "blocks": [{"label": "Context", "prose": "You (red team) duplicated template “User-Auth” as “User-Auth-Flex”: Client Authentication EKU, ENROLLEE_SUPPLIES_SUBJECT, your group may enroll, published on CORP-CA-01. ntAuthCertificates trusts CORP-CA-01. The /certsrv endpoint requires TLS with EPA — no NTLM relay possible there."}]}, "question": "Answer all three steps.", "hint": "The endpoint kills the relay idea. And a certificate that proves “A-Administrator” is worth more than the laptop you made it on.", "data": {"steps": [{"label": "STEP 1 — RED TEAM", "narration": "Your template is published. Time to move.", "question": "What is the fastest path to Domain Admin from here?", "options": [{"t": "Enroll a User-Auth-Flex certificate with SAN = CORP\\A-Administrator and log on", "correct": true, "why": "Caller-chosen subject on a logon-capable template: request, convert to TGT via PKINIT, done."}, {"t": "Relay an NTLM authentication from a coerced victim host to the /certsrv endpoint", "correct": false, "why": "The endpoint requires TLS with Extended Protection — the relay dies there. A plausible path, wrong in this environment."}, {"t": "Enroll a WebServer certificate for CORP-CA-01 and install it on a laptop", "correct": false, "why": "A server certificate does not log you on as an admin."}, {"t": "Brute-force the Domain Admin password with a password-spraying tool", "correct": false, "why": "Slow, noisy, and unnecessary when a template hands you the credential."}]}, {"label": "STEP 2 — RED TEAM", "narration": "You hold the certificate and exchange it for a TGT with Rubeus.", "question": "Once you log on with that certificate, what extra loot can PKINIT give you?", "options": [{"t": "The target's NT hash, via UnPAC-the-hash", "correct": true, "why": "PKINIT returns a PAC; tools can unwrap the account's NT hash from it (UnPAC-the-hash)."}, {"t": "The CA's private signing key, copied from the CA", "correct": false, "why": "The CA key never travels through a logon. It must be exported from the CA itself."}, {"t": "The KRBTGT password hash of the domain", "correct": false, "why": "KRBTGT comes from DC replication abuse (DCSync), not from a certificate logon."}, {"t": "The domain's full DNS zone data", "correct": false, "why": "DNS data is readable anyway and unrelated to PKINIT."}]}, {"label": "STEP 3 — BLUE TEAM", "narration": "The finding is confirmed. You must kill the path with the least breakage.", "question": "Which single change kills this whole path with the least operational damage?", "options": [{"t": "Remove ENROLLEE_SUPPLIES_SUBJECT from User-Auth-Flex once no team needs caller-chosen subjects", "correct": true, "why": "Subject control is the hinge of the whole path; removing it closes ESC1 while keeping the template usable."}, {"t": "Shut down CORP-CA-01 for a whole week until every stakeholder has agreed on a new template design", "correct": false, "why": "Domain-wide enrollment and renewal outage — damage far beyond the finding."}, {"t": "Delete the User-Auth-Flex template immediately, without any exception or review process", "correct": false, "why": "Pending and future legitimate enrollments break instantly; fix the flag instead."}, {"t": "Disable the ServiceDesk group so that none of its members can enroll from anything", "correct": false, "why": "Does not touch the template flag; the path survives through other enrollable groups."}]}]}, "explain": "One misconfigured template, three lessons. The attack path picks the weakest door (template abuse, not the hardened relay). PKINIT adds a bonus: UnPAC-the-hash turns the logon into the account's NT hash. And the blue-team fix is surgical: control the subject, not the whole PKI. Deleting things in PKI causes outages that outlive the incident.", "study": "Explain UnPAC-the-hash to a colleague in three sentences, then write the blue-team fix list."}, {"id": "H04", "type": "spot", "theme": "Attack Paths (ESC)", "title": "One ACE too many", "scenario": {"summary": "The CA is locked down — except once", "blocks": [{"label": "ARTEFACT 1 — CA security descriptor, CORP-CA-01 (simplified)", "code": "CA: CORP-CA-01 — security descriptor (simplified)\nCORP\\Domain Admins        : ManageCA | ManageCertificates\nCORP\\Enterprise Admins    : ManageCA | ManageCertificates\nCORP\\Cert Publishers      : Publish certificates and CRLs\nCORP\\svc-caops            : ManageCertificates\nCORP\\RAS and IAS Servers  : Enroll on behalf (autoenroll)"}]}, "question": "Click the ACE that lets a normal service account approve and deny pending certificate requests.", "hint": "Approving requests is the Certificate Manager's job. One service account holds that right (ESC7).", "data": {"multi": false, "lines": ["CA: CORP-CA-01 — security descriptor (simplified)", "CORP\\Domain Admins        : ManageCA | ManageCertificates", "CORP\\Enterprise Admins    : ManageCA | ManageCertificates", "CORP\\Cert Publishers      : Publish certificates and CRLs", "CORP\\svc-caops            : ManageCertificates", "CORP\\RAS and IAS Servers  : Enroll on behalf (autoenroll)"], "pick": [4], "lineWhy": ["svc-caops holding ManageCertificates is the ESC7 condition: a non-admin who can approve any pending request — including one for an administrator's certificate."]}, "explain": "The first three ACEs are normal: admins manage, Cert Publishers publish, RAS/IAS servers enroll for network auth. The odd one is svc-caops with ManageCertificates — a Certificate Manager right on a service account. From there, an attacker who controls that account can approve a pending request for somebody else's certificate, or issue from the SubCA queue: ESC7.", "study": "Compare ManageCA and ManageCertificates in the CA security descriptor and decide who really needs each."}, {"id": "H05", "type": "match", "theme": "Attack Paths (ESC)", "title": "Finding to ESC number", "scenario": {"summary": "Label five audit findings", "blocks": [{"label": "Context", "prose": "Your template and CA audit produced five raw findings. Label each with its ESC number so the remediation tickets write themselves."}]}, "question": "Drag each finding onto its ESC number.", "hint": "Two findings live on the CA itself (a flag and a role right). The others live in templates and on the web endpoint.", "data": {"zones": [{"label": "ESC1", "items": [{"t": "Requester-chosen subject on a ClientAuth template, open to Domain Users", "why": "The template trio: caller-chosen subject + logon EKU + broad rights."}]}, {"label": "ESC2", "items": [{"t": "Template with no EKU at all", "why": "No usage limit: the certificate fits almost any protocol."}]}, {"label": "ESC6", "items": [{"t": "EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE set on the CA", "why": "The CA-wide SAN switch overrides every template."}]}, {"label": "ESC7", "items": [{"t": "Helpdesk holds ManageCertificates on the CA", "why": "Extra Certificate Manager rights enable self-approval of dangerous requests."}]}, {"label": "ESC8", "items": [{"t": "NTLM accepted on the /certsrv enrollment endpoint", "why": "Relayable authentication on an enrollment endpoint."}]}]}, "explain": "Naming findings with ESC numbers does three things: it makes the fix known (each ESC has a documented remediation), it makes severity comparable across teams, and it makes detection targetable. When you cannot name it precisely, you cannot defend it — that is why this vocabulary exists.", "study": "Write the one-line fix next to each ESC number from memory, then check yourself against the research."}, {"id": "H06", "type": "term", "theme": "Tools & Commands", "title": "Audit from the workstation (no tool named)", "scenario": {"summary": "Objective and environment only", "blocks": [{"label": "Context", "prose": "Objective: from this Windows workstation (logged on as jdoe), enumerate the domain's certificate templates and mark the unsafe ones. Environment: C:\\Tools contains the usual C# collection; you hold ordinary domain credentials; the CA is CORP-CA-01. Nothing is named for you — pick the right tool and the right options."}]}, "question": "Type the command that enumerates unsafe certificate templates, then press Enter.", "hint": "You want the tool whose job is finding, not requesting. One flag filters for unsafe settings.", "data": {"prompt": "PS C:\\Tools> ", "banner": "Simulation shell on a Windows workstation. Nothing real is executed.", "canonical": "Certify.exe find /vulnerable", "required": ["\\bcertify(\\.exe)?\\b", "\\bfind\\b", "[/-]vulnerable\\b"], "forbidden": [{"re": "[/-]enroll\\b", "why": "/enroll requests a real certificate from the CA — a state change you did not intend during recon."}, {"re": "\\brubeus\\b", "why": "Rubeus asks for Kerberos tickets. It cannot enumerate templates — wrong tool for this objective."}], "parts": [{"text": "Certify.exe find", "why": "Certify enumerates AD CS: CAs, templates and their settings"}, {"text": "/vulnerable", "why": "filters the output to templates with unsafe configurations"}]}, "explain": "On Windows the enumeration tool is Certify: find lists CAs and templates, and /vulnerable marks the ESC-shaped ones. The near-misses are the state-changing verb (/enroll — that is an action, not an audit) and the wrong tool family (Rubeus works with tickets, not templates). Tool choice and flag choice both mattered here — the objective was deliberately tool-less.", "study": "Run the same enumeration with Certipy on Linux and compare the outputs field by field."}, {"id": "H07", "type": "triage", "theme": "Detection & Logging", "title": "Four alerts, four plays", "scenario": {"summary": "Match each alert to its play", "blocks": [{"label": "Context", "prose": "The SOC queue has four certificate-related alerts. The playbook has four plays. Assign each alert its play."}]}, "question": "Pick the correct play for every alert.", "hint": "One alert is a wave, two are template-level, one is hands-on-keyboard. Match the play to the actor's position.", "data": {"actions": ["Escalate to IR — probable active impersonation", "Fix the template: verify ACL, then remove the risky setting", "Close — benign autoenrollment burst", "Contain the endpoint: isolate the host and revoke its certificates"], "alerts": [{"tag": "Alert 1", "body": "03:12 — 4886: Template UserAuth-Flex, subject A-Administrator, requester svc-helpdesk. Followed at 03:13 by a 4768 PKINIT TGT as A-Administrator from WS-4417.", "correct": 0, "why": "Issuance plus immediate certificate logon as an admin is active impersonation — IR territory, now."}, {"tag": "Alert 2", "body": "02:58 — 4899: template Vault-Any settings were changed by helpdesk1. Vault-Any has an Any Purpose EKU. No change ticket.", "correct": 1, "why": "A template change with no ticket is a configuration incident: verify and fix the template, before anyone uses it."}, {"tag": "Alert 3", "body": "08:55 — 300 x 4886 from computer accounts, template WorkstationAuthentication, every subject matches its requester, right after a GPO change.", "correct": 2, "why": "A wave of self-matching computer certificates after a GPO change is the normal autoenrollment burst."}, {"tag": "Alert 4", "body": "04:30 — EDR on WS-4417: LSASS access followed by certutil -exportPFX of the user's certificate to a USB path.", "correct": 3, "why": "Certificate theft in progress on a workstation: isolate the host and revoke what it held."}]}, "explain": "Four alerts, four different actor positions: an attacker already impersonating (escalate), a configuration being weaponised (fix the template), a harmless wave (close), and hands-on-keyboard theft (contain the host). Choosing the wrong play costs either hours of delay or unnecessary downtime — triage is a decision, not a mood.", "study": "Add a fifth column to your triage sheet: what evidence to capture before acting on each play."}, {"id": "H08", "type": "branch", "theme": "Attack Paths (ESC)", "title": "The certificate nobody issued", "scenario": {"summary": "Signed by the CA — but not in its database", "blocks": [{"label": "Context", "prose": "Alert: a 4768 PKINIT TGT as CORP\\A-Administrator at 04:02, certificate thumbprint 9F3C 44D1, chain: CORP-Issuing-CA. You query the CA database for that serial and get zero records. The config below is from the CA."}, {"label": "ARTEFACT 1 — CA facts", "code": "CA DB query:  serial 1200000027 → 0 records\nCA config:    AuditFilter 127, DB retention 5 years\nntAuthCertificates: CORP-Issuing-CA (present)\nLast CA restart: 03:58 (event 4889, planned)"}]}, "question": "Answer all three steps.", "hint": "The CA never saw this serial. Passwords do not fix a stolen signing key.", "data": {"steps": [{"label": "STEP 1 — WHAT DOES IT MEAN", "narration": "The certificate chains to your issuing CA, but the CA has no record of issuing it.", "question": "What does “signed by the CA but not in its database” most likely mean?", "options": [{"t": "The certificate was forged with the CA's private key — a golden-certificate style attack", "correct": true, "why": "A forged certificate carries the CA signature but never passes through the CA database."}, {"t": "PKINIT cannot use certificates for logons in a Windows domain, so this log line must be fake", "correct": false, "why": "PKINIT is exactly the Kerberos extension that accepts certificates."}, {"t": "The CA database purges old issuance records automatically at the end of every week", "correct": false, "why": "The artefact says retention is 5 years — the purge theory dies on the config line."}, {"t": "Someone replayed an old log line from a previous incident into the SIEM", "correct": false, "why": "Replay does not produce a new PKINIT TGT with a fresh thumbprint."}]}, {"label": "STEP 2 — CONFIRM IT", "narration": "You need proof that will survive management review.", "question": "What is the fastest way to confirm forgery?", "options": [{"t": "Validate the chain and compare the serial with the CA database and the CRL — a never-issued serial proves forgery", "correct": true, "why": "Signature proves origin; the missing serial plus valid signature proves the certificate was made offline."}, {"t": "Reboot CORP-CA-01, let the database service settle, then re-run the same serial query", "correct": false, "why": "A restart changes nothing about a missing database row."}, {"t": "Delete the KDC's certificate, then request and install a fresh one from the same CA", "correct": false, "why": "Destructive, evidence-destroying, and unrelated to the missing serial."}, {"t": "Renew every single user and computer certificate in the whole domain right now, before the attacker can abuse any of them", "correct": false, "why": "Mass renewal does not address a forged certificate and burns the change window."}]}, {"label": "STEP 3 — CONTAIN IT", "narration": "Forgery is confirmed. The CA key must be considered compromised.", "question": "Which containment is correct, accepting its real cost?", "options": [{"t": "Re-key the issuing CA and replace its entry in ntAuthCertificates — all certificates must be reissued (planned downtime)", "correct": true, "why": "Only a new CA key makes the stolen one worthless. The cost is real and must be accepted."}, {"t": "Change only the Domain Admin passwords and the KRBTGT password tonight, and keep the CA server running exactly as it was before", "correct": false, "why": "A near-miss: passwords stop password attacks, not forged certificates."}, {"t": "Format the CA server completely and reinstall it from the approved golden image", "correct": false, "why": "Rebuilding the host does not invalidate the stolen key material."}, {"t": "Disable PKINIT domain-wide until every smart card in the estate has been replaced", "correct": false, "why": "Breaks smart cards and certificate logons everywhere, and the forged certs still exist."}]}]}, "explain": "A valid CA signature with no database record is the golden-certificate signature on paper: the certificate was created offline with the CA's key (ForgeCert-style). Confirmation is documentation-friendly: chain valid, serial absent. Containment is expensive by design — re-key the CA, swap ntAuthCertificates, reissue. Every cheaper option fails because the stolen key keeps signing.", "study": "Read the golden-certificate path end to end: key export, ForgeCert, PKINIT, and why re-keying is the only real fix."}, {"id": "H09", "type": "rank", "theme": "Hardening & Operations", "title": "Six findings, one afternoon", "scenario": {"summary": "Rank the audit findings", "blocks": [{"label": "Context", "prose": "Your PKI audit closed with six findings. Management asks: “What do we fix first, and why?” Rank from most severe to least severe."}]}, "question": "Rank all six findings, most severe first.", "hint": "Ask two questions per finding: can this be used to become someone else today? And how far does the blast radius reach?", "data": {"items": [{"t": "ESC1: template with ClientAuth + caller-chosen subject, open to Domain Users", "why": "Any user can become anybody today. Highest direct impersonation risk."}, {"t": "ESC8: /certsrv accepts NTLM from any domain host", "why": "One coerced victim equals one certificate. Broad and silent, needs only network access."}, {"t": "ESC7: Helpdesk group holds ManageCertificates", "why": "Extra approvers can wave dangerous requests through; one compromised helpdesk account is enough."}, {"t": "Key archival disabled — admin certificates' keys cannot be recovered", "why": "An availability/recovery gap, not a direct impersonation path."}, {"t": "No CA backup since January (last event 4882 is 9 months old)", "why": "A resilience disaster if the CA dies, but it does not help an attacker today."}, {"t": "CRL published weekly (revocations may lag up to 7 days)", "why": "A freshness gap for revocation — real, but the slowest-burning of the six."}]}, "explain": "Ranking is about exploitability times blast radius. Direct impersonation beats enabling rights, which beats resilience gaps, which beats freshness gaps. Note the honest cost of the last three: none of them lets an attacker log on as someone else this afternoon — but all three decide how bad tomorrow looks. A good report ranks findings AND explains the scale used.", "study": "Rewrite your own team's open PKI findings in this order and defend the order in one paragraph."}, {"id": "H10", "type": "spot", "theme": "Detection & Logging", "title": "Benign-looking task, loud exit", "scenario": {"summary": "Four scheduled tasks, one exfiltrates", "blocks": [{"label": "ARTEFACT 1 — Scheduled tasks on LT-2204 (exported)", "code": "Task: AutoEnroll-Pulse   Action: certutil -pulse                                   Trigger: daily 06:00\nTask: CA-Health          Action: certutil -ping -config CORP-CA-01                 Trigger: hourly\nTask: Cert-Export        Action: certutil -exportPFX -p 'S3cr3t!' my 7f3a... \\\\10[.]10[.]30[.]70\\drop\\lt2204.pfx   Trigger: weekly 02:00\nTask: Renewal-Check      Action: certreq -enroll -machine -q WebServer             Trigger: weekly 03:00"}]}, "question": "Click the task that quietly copies a certificate WITH its private key off the machine.", "hint": "-exportPFX always includes the private key. Ask where line 3 sends it.", "data": {"multi": false, "lines": ["Task: AutoEnroll-Pulse   Action: certutil -pulse                                   Trigger: daily 06:00", "Task: CA-Health          Action: certutil -ping -config CORP-CA-01                 Trigger: hourly", "Task: Cert-Export        Action: certutil -exportPFX -p 'S3cr3t!' my 7f3a... \\\\10[.]10[.]30[.]70\\drop\\lt2204.pfx   Trigger: weekly 02:00", "Task: Renewal-Check      Action: certreq -enroll -machine -q WebServer             Trigger: weekly 03:00"], "pick": [2], "lineWhy": ["-exportPFX writes the certificate and its private key into a password-protected PFX file — and this one lands on a remote share at 02:00."]}, "explain": "Three tasks look like housekeeping and are: -pulse nudges autoenrollment, -ping checks the CA, certreq -enroll renews. The quiet one is -exportPFX: it packages the private key (the part that makes the certificate usable) and this task ships it to an external share at night. Certificate theft usually looks exactly like this — a legitimate verb at an illegitimate hour, to an illegitimate destination.", "study": "Hunt your estate for scheduled tasks invoking -exportPFX or -exportPFX-like flows, and alert on PFX writes to network paths."}, {"id": "H11", "type": "fill", "theme": "Detection & Logging", "title": "Draft the incident note", "scenario": {"summary": "Complete the escalation note", "blocks": [{"label": "Context", "prose": "INC-2291 goes to IR in five minutes. Complete the note — every blank comes from the artefacts you read in this exam series."}]}, "question": "Drag a word from the bank into each blank.", "hint": "Two slots come straight from the 4886 line. One is the requester. One is the number of the abuse path.", "data": {"text": "INC-2291 — At 03:12, the CA issued a certificate under template {0} with subject {1}. The requester, {2}, had never enrolled before. A PKINIT logon as A-Administrator followed within seconds. We assess template abuse ({3}) and have escalated to IR. Next: pull EDR telemetry for WS-4417 and freeze the template.", "slots": ["UserAuth-Flex", "CORP\\A-Administrator", "CORP\\svc-helpdesk", "ESC1"], "slotWhy": ["The template name comes from the 4886 line; it is the object to freeze.", "The subject is the impersonated account; it goes in the note for access reviews.", "The requester is the account whose sessions and rights must be examined.", "ESC1 names the abuse pattern so IR opens the right playbook."], "bank": ["UserAuth-Flex", "CORP\\A-Administrator", "CORP\\svc-helpdesk", "ESC1", "WorkstationAuthentication", "CORP\\LT-2231$", "ESC8", "OCSP"]}, "explain": "A good escalation note carries four facts: the abused object (template), the impersonated identity (subject), the abusing identity (requester) and the named pattern (ESC1). Everything else — theories, feelings, speculation — belongs in the annex, not the summary line that IR reads first.", "study": "Write your own four-fact template for certificate escalations and reuse it under pressure."}, {"id": "H12", "type": "qcm", "theme": "Hardening & Operations", "title": "Can't turn NTLM off yet", "scenario": {"summary": "Fix the relay door without breaking the scanner", "blocks": [{"label": "Context", "prose": "You must fix the ESC8 exposure on CORP-CA-01. The /certsrv endpoint must stay online this month: a legacy scanner enrolls its own certificates through it, and the vendor will not move to the newer CES endpoint before Q3. Disabling the endpoint or the web enrollment role breaks the scanner."}]}, "question": "Which control reduces the relay risk most, while keeping the scanner working?", "hint": "You need the endpoint alive. Look for the control that breaks the relay, not the endpoint.", "data": {"options": [{"t": "Enable Extended Protection for Authentication (channel binding) and require TLS on /certsrv", "correct": true, "why": "EPA binds the TLS channel to the authentication, which kills NTLM relay while Negotiate still works for the scanner."}, {"t": "Turn CORP-CA-01 off until Q3, when the vendor migration to the new CES endpoint is finished", "correct": false, "why": "The whole domain loses enrollment and renewal — a self-inflicted outage."}, {"t": "Delete the /certsrv virtual directory from the web server tonight", "correct": false, "why": "A near-miss: removing the endpoint is the eventual right move, but the scenario says the scanner needs it now."}, {"t": "Disable NTLM on every domain controller in the domain tonight, before anyone goes home", "correct": false, "why": "Domain-wide NTLM changes on a Friday night break far more than the scanner."}]}, "explain": "Real hardening is sequencing. The full fix for ESC8 is removing the legacy endpoint — but when a business dependency exists, the least aggressive effective control is channel binding via Extended Protection on a TLS-only endpoint. It defeats the relay while Negotiate keeps the scanner alive. Then you plan the CES migration for Q3 and remove the door for good.", "study": "Read Microsoft's Extended Protection for Authentication guidance and test it on a lab CA first."}, {"id": "H13", "type": "logview", "theme": "Detection & Logging", "title": "Same thumbprint, two owners", "scenario": {"summary": "One certificate, two logons", "blocks": [{"label": "Context", "prose": "05:40. The SIEM correlates DC-01 and CA-01 for the last 15 minutes."}, {"label": "ARTEFACT 1 — Correlated events", "code": "05:31:02  4886  Issued. Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex  Thumbprint: 9F3C 44D1...\n05:33:19  4768  TGT requested. Account: CORP\\helpdesk1      Pre-auth: PKINIT (cert 9F3C 44D1...)\n05:36:44  4768  TGT requested. Account: CORP\\A-Administrator  Pre-auth: PKINIT (cert 9F3C 44D1...)\n05:38:01  4771  Kerberos pre-auth failed. Account: CORP\\A-Administrator (0x18)\n05:39:12  4768  TGT requested. Account: CORP\\jdoe           Pre-auth: password\n05:39:55  4768  TGT requested. Account: CORP\\svc-print     Pre-auth: password"}]}, "question": "Click the line that shows one certificate being used by an account that did not enroll for it.", "hint": "Match thumbprints first; the 4771 line is password-guessing noise.", "data": {"multi": false, "lines": ["05:31:02  4886  Issued. Requester: CORP\\svc-helpdesk  Template: UserAuth-Flex  Thumbprint: 9F3C 44D1...", "05:33:19  4768  TGT requested. Account: CORP\\helpdesk1      Pre-auth: PKINIT (cert 9F3C 44D1...)", "05:36:44  4768  TGT requested. Account: CORP\\A-Administrator  Pre-auth: PKINIT (cert 9F3C 44D1...)", "05:38:01  4771  Kerberos pre-auth failed. Account: CORP\\A-Administrator (0x18)", "05:39:12  4768  TGT requested. Account: CORP\\jdoe           Pre-auth: password", "05:39:55  4768  TGT requested. Account: CORP\\svc-print     Pre-auth: password"], "pick": [2], "lineWhy": ["The certificate enrolled by and issued for svc-helpdesk later authenticates as A-Administrator with the same thumbprint. That is certificate reuse — impersonation."], "wrongWhy": {"1": "This logon matches its own enrollment: helpdesk1 using helpdesk1's certificate is consistent.", "3": "A 4771 failure with 0x18 is a wrong-password noise line, no certificate involved."}}, "explain": "The thumbprint is the certificate's fingerprint — the join key between CA and DC logs. Normal: one thumbprint, one account, matching the requester. Here the same 9F3C 44D1 thumbprint that logged on helpdesk1 at 05:33 logs on A-Administrator at 05:36. Nobody re-enrolled; the certificate itself was reused for a second identity — pass-the-certificate in action. The 4771 line is classic password-guessing noise to distract you.", "study": "Build a SIEM join: 4886 thumbprint against 4768 thumbprints, alert when accounts diverge."}, {"id": "H14", "type": "match", "theme": "Hardening & Operations", "title": "Finding to fix", "scenario": {"summary": "Write the remediation tickets", "blocks": [{"label": "Context", "prose": "The audit findings got their ESC numbers. Now match each to its correct remediation so the tickets can be filed."}]}, "question": "Drag each finding onto the fix that closes it.", "hint": "Every fix undoes exactly what the finding opened. The CA-wide flag is cleared with a -setreg change (in a change window).", "data": {"zones": [{"label": "ESC1 fix", "items": [{"t": "Remove ENROLLEE_SUPPLIES_SUBJECT; build the subject from AD; reissue affected certificates", "why": "Subject control returns to the directory, and already-issued flex certs die."}]}, {"label": "ESC2 fix", "items": [{"t": "Set the exact EKU the template really needs", "why": "A precise EKU list restores the usage whitelist."}]}, {"label": "ESC6 fix", "items": [{"t": "Clear EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE on the CA", "why": "The CA-wide SAN switch must go; templates rule again."}]}, {"label": "ESC7 fix", "items": [{"t": "Remove the extra ManageCertificates ACE and audit the Certificate Managers group", "why": "Approval rights return to the defined officer set."}]}, {"label": "ESC8 fix", "items": [{"t": "Require TLS with EPA; block NTLM to the enrollment endpoints", "why": "Channel binding kills the relay path to /certsrv and CES."}]}]}, "explain": "Every ESC has a documented, specific fix — and the fix always undoes the exact enabler. ESC1 loses the caller-chosen subject. ESC2 gets its EKU back. ESC6 loses the CA-wide flag. ESC7 loses the extra approver right. ESC8 loses relayable authentication. Generic answers like “patch and pray” or “delete the CA” fix nothing safely.", "study": "File one real remediation ticket from your own audit using this exact mapping."}, {"id": "H15", "type": "term", "theme": "Tools & Commands", "title": "Capture before maintenance (no hand-holding)", "scenario": {"summary": "CA keys and config, before patch night", "blocks": [{"label": "Context", "prose": "Context: planned maintenance on CORP-CA-01 tonight at 22:00. You are CA admin. Objective: capture the CA's certificate, private key and configuration for safekeeping BEFORE you patch — without stopping the CA and without changing its state. Shell: PowerShell on the CA. Destination: C:\\PKI-Backup. Nothing else is given."}]}, "question": "Type the command that captures the CA's keys and configuration, then press Enter.", "hint": "The verb you want copies the CA's certificate AND key to a folder. Its opposite verb would overwrite the live CA.", "data": {"prompt": "PS C:\\> ", "banner": "Simulation shell on CORP-CA-01. Nothing real is executed.", "canonical": "certutil -backup C:\\PKI-Backup", "required": ["\\bcertutil(\\.exe)?\\b", "-backup\\b", "pki-backup"], "forbidden": [{"re": "-restore\\b", "why": "-restore writes a backup OVER the live CA — the opposite of capturing, and it can overwrite the very keys you are protecting."}, {"re": "-setreg\\b", "why": "-setreg changes live CA policy. Tonight you capture, you do not reconfigure."}], "parts": [{"text": "certutil", "why": "the built-in Windows certificate tool"}, {"text": "-backup", "why": "copies the CA certificate, its private key and its configuration to a folder"}, {"text": "C:\\PKI-Backup", "why": "the destination folder for the capture set"}]}, "explain": "certutil -backup is the pre-maintenance ritual: CA certificate, private key and configuration land in one folder, while the CA keeps running. The dangerous near-miss is -restore — same family, opposite direction, and it overwrites live state. Note what this exercise did NOT give you: the tool name and the verb. Only the objective and the environment — that is the HARD contract.", "study": "Rehearse certutil -backup and -restore on a lab CA, then write the rollback page for your own CA."}, {"id": "H16", "type": "branch", "theme": "Hardening & Operations", "title": "Cannot patch tonight — monitor instead", "scenario": {"summary": "ESC6 confirmed, change window at 09:00", "blocks": [{"label": "Context", "prose": "03:30. You confirmed EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE is set on CORP-CA-01 (ESC6). Fixing the CA needs a change window; the CAB meets at 09:00. The SOC lead asks: “What do we do RIGHT NOW, and what do we accept?”"}]}, "question": "Answer both steps.", "hint": "The flag's danger is one specific behaviour: a subject name that does not belong to the requester. Watch exactly that.", "data": {"steps": [{"label": "STEP 1 — DETECT", "narration": "You need one precise detection until the flag is cleared.", "question": "Which immediate detection gives the best signal until the fix?", "options": [{"t": "Alert on 4886 events where the requested subject or SAN does not match the requester", "correct": true, "why": "The flag's exact abuse is a mismatched name; the rule watches precisely that, with near-zero noise."}, {"t": "Alert on every single 4886 event, all 4,000 of them per day here", "correct": false, "why": "Volume without signal — the SOC drowns and stops reading the alert."}, {"t": "Alert on 4624 logon type 5 events — service logons — across every domain controller you have", "correct": false, "why": "Service logons are constant background noise and carry no certificate data."}, {"t": "No detection at all is possible tonight until the flag has been cleared", "correct": false, "why": "The behaviour is visible in existing events — detection is absolutely possible tonight."}]}, {"label": "STEP 2 — ACCEPT", "narration": "The CISO asks what the organisation accepts by waiting until 09:00.", "question": "Which statement is the honest acceptance?", "options": [{"t": "We accept residual risk of impersonation overnight, monitored by the new alert", "correct": true, "why": "Naming the residual risk and pairing it with monitoring is what a change window is for."}, {"t": "We accept that the CA server must be rebooted right now, in the middle of the incident", "correct": false, "why": "A reboot neither clears the registry flag nor reduces risk — it just adds downtime."}, {"t": "We accept losing every certificate in the domain overnight", "correct": false, "why": "Nothing about waiting destroys certificates — this acceptance is invented."}, {"t": "We accept nothing — waiting is forbidden in every incident", "correct": false, "why": "Risk acceptance inside a change window is a normal, documented decision."}]}]}, "explain": "When the fix must wait, the professional answer has two halves: a precise compensating detection, and a named, time-boxed risk acceptance. “Alert on subject/requester mismatch” targets the exact behaviour the ESC6 flag enables. “We accept residual impersonation risk overnight, with monitoring” is a decision a CISO can sign — because it says what is lost and for how long.", "study": "Write the compensating-controls row for ESC6 in your risk register: detection, acceptance, expiry."}, {"id": "H17", "type": "spot", "theme": "Attack Paths (ESC)", "title": "One attribute was added", "scenario": {"summary": "Shadow Credentials on an admin account", "blocks": [{"label": "ARTEFACT 1 — LDAP dump of A-Administrator (excerpt)", "code": "dn: CN=A-Administrator,OU=Admins,DC=corp,DC=local\nobjectClass: user\nmemberOf: CN=Domain Admins,OU=Groups,DC=corp,DC=local\nmsDS-KeyCredentialLink: B:828:Q1hF... (key material added 05:58)\nlastLogon: 05:33 today\nuserAccountControl: 512 (enabled, no smart-card requirement)"}]}, "question": "Click the attribute that lets an attacker sign in with their OWN key material (Shadow Credentials).", "hint": "This attribute stores public keys for certificate-less Kerberos. It is not a group and not a flag.", "data": {"multi": false, "lines": ["dn: CN=A-Administrator,OU=Admins,DC=corp,DC=local", "objectClass: user", "memberOf: CN=Domain Admins,OU=Groups,DC=corp,DC=local", "msDS-KeyCredentialLink: B:828:Q1hF... (key material added 05:58)", "lastLogon: 05:33 today", "userAccountControl: 512 (enabled, no smart-card requirement)"], "pick": [3], "lineWhy": ["msDS-KeyCredentialLink holds the account's Kerberos key credentials. An attacker with write access adds their own public key — Whisker does this — and logs on without ever touching a password or a CA-issued certificate."]}, "explain": "Shadow Credentials abuse msDS-KeyCredentialLink: whoever can write the attribute adds their own key pair and then authenticates as the account with a Kerberos PKINIT request — no password change, no certificate issuance, very quiet. The blue-team view: alert on modifications to this attribute on privileged accounts, and treat every unexplained key as an incident. This is the close cousin of certificate attacks — same PKINIT door, no CA involved.", "study": "Read the Whisker tool documentation and the detection ideas for msDS-KeyCredentialLink changes."}]};

}
function skippedCount(){
  var n = 0; Object.keys(st.skipped).forEach(function(k){ if(!st.graded[k]){ n++; } }); return n;
}

/* ---------- manual pause ---------- */
function togglePause(){
  if(st.phase !== "exam" && st.phase !== "review"){ return; }
  if(!st.timer.manual){
    st.timer.manual = true;
    $("stage").classList.add("hidden");
    $("overlay").classList.remove("hidden");
  } else {
    st.timer.manual = false;
    $("overlay").classList.add("hidden");
    $("stage").classList.remove("hidden");
  }
  updateHeader();
}
function buildOverlay(){
  var ov = h("div","overlay hidden"); ov.id = "overlay";
  var box = h("div","ovbox");
  box.appendChild(h("div","big","\u23F8 Paused by you"));
  box.appendChild(h("p",null,"The exercise is hidden and the timer is stopped. Press Resume when you want to continue."));
  var b = h("button","btn primary","\u25B6 Resume"); b.type="button";
  b.addEventListener("click", togglePause);
  box.appendChild(b);
  ov.appendChild(box);
  document.body.appendChild(ov);
}

/* ---------- hint ---------- */
function useHint(){
  if(st.cur === null || st.graded[st.cur] || st.hint[st.cur]){ return; }
  st.hint[st.cur] = true;
  var ex = E.exercises[st.cur];
  var old = document.querySelector(".hintpanel");
  if(old){ old.parentNode.removeChild(old); }
  var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
  var ans = document.querySelector(".ansblock");
  ans.appendChild(hp);
  updateHeader();
}

/* ---------- skip ---------- */
function doSkip(){
  if(st.cur === null || st.graded[st.cur]){ return; }
  st.skipped[st.cur] = true;
  stopCountdown();
  goNext(true);
}
function goNext(){
  st.fromReview = false;
  var idx = -1;
  for(var i = st.pos+1; i < st.order.length; i++){
    var k = st.order[i];
    if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
  }
  st.timer.auto = false;
  if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
  if(skippedCount() > 0){ st.fromReview = true; openReview(); return; }
  endExam("done");
}

/* ---------- navigation guards for Check / Next ---------- */
function checkAnswer(force){
  if(st.cur === null || st.graded[st.cur]){ return; }
  var ex = E.exercises[st.cur];
  var ans = curRenderer.collect();
  if(ex.type === "term" && normCmdRaw(ans.cmd) === "" && !force){
    if(curRenderer.print){ curRenderer.print("(!) Type a command first, then press Enter or Check."); }
    return;
  }
  st.ans[st.cur] = ans;
  var g = GRADER[ex.type](ex, ans);
  var pts;
  if(g.t <= 0){ pts = 0; }
  else if(g.select){ pts = Math.floor(Math.max(0, g.c - g.w) / g.t * 100); }
  else { pts = Math.floor(g.c / g.t * 100); }
  if(st.hint[st.cur]){ pts = Math.floor(pts * 0.9); }
  g.points = pts;
  st.graded[st.cur] = g;
  if(ex.type === "term" && curRenderer.print){
    curRenderer.print(normCmdRaw(ans.cmd) || "(empty command)");
    if(pts === 100){
      curRenderer.print("[OK] The simulation accepts this command." + (ex.data.sampleOutput ? "\n" + ex.data.sampleOutput : ""));
    } else {
      curRenderer.print("[x] The simulation stops here. Read the explanation below.");
    }
  }
  stopCountdown();
  st.timer.auto = true;          /* auto-pause on Check: feedback readable, timer stopped */
  renderFeedbackInto(ex, g);
  updateHeader();
}
function nextAnswer(){
  if(st.cur === null || !st.graded[st.cur]){ return; }
  stopCountdown();
  if(st.fromReview){
    if(skippedCount() > 0){ openReview(); return; }
    st.fromReview = false;
    var idx = -1;
    for(var i = st.pos+1; i < st.order.length; i++){
      var k = st.order[i];
      if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
    }
    if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
    endExam("done"); return;
  }
  goNext();
}

/* ---------- exercise screen ---------- */
function clearStage(){ var s = $("stage"); s.innerHTML = ""; }
function codeBlock(text, copyable){
  var wrap = h("div","copywrap");
  var pre = h("pre","code", text);
  wrap.appendChild(pre);
  if(copyable){
    var b = h("button","btn copybtn","Copy"); b.type="button";
    b.addEventListener("click", function(){
      try{
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        b.textContent = "Copied";
        setTimeout(function(){ b.textContent = "Copy"; }, 1200);
      }catch(e){}
    });
    wrap.appendChild(b);
  }
  return wrap;
}
function buildScenario(ex){
  var sec = h("section","card scen");
  var head = h("div","cardhead scenhead");
  head.appendChild(h("span","cicon","\u25A6"));
  head.appendChild(h("span",null,"Scenario"));
  var sc = ex.scenario;
  var long = (sc.blocks.length >= 2) || (sc.blocks.reduce(function(a,b){ return a + words(b.prose||"") + words(b.code||""); }, 0) > 70);
  if(long){
    var cb = h("button","btn collapsebtn","\u25B4 Collapse"); cb.type="button";
    cb.setAttribute("aria-expanded","true");

      var body = sec.querySelector(".scenbody");

      cb.setAttribute("aria-expanded", isHidden ? "false" : "true");
      var sm = sec.querySelector(".scensummary");
      sm.classList.toggle("hidden", !isHidden);
    });
    head.appendChild(cb);
  }
  sec.appendChild(head);

  var body = h("div","scenbody");

function buildQuestion(ex){
  var sec = h("section","card qblock");

  head.appendChild(h("span",null,"Question"));
  sec.appendChild(head);
  sec.appendChild(h("div","qtext", ex.question));
  return sec;
}
function buildAnswer(ex){
  var sec = h("section","card ansblock");
  var head = h("div","cardhead");
  head.appendChild(h("span","cicon","\u2611"));
  head.appendChild(h("span",null,"Your answer"));
  sec.appendChild(head);
  curRenderer = RENDER[ex.type](ex, sec);
  return sec;
}
function showExercise(key){
  st.cur = key;
  st.phase = "exam";
  clearStage();
  var ex = E.exercises[key];
  var stage = $("stage");
  stage.appendChild(buildScenario(ex));
  stage.appendChild(buildQuestion(ex));
  stage.appendChild(buildAnswer(ex));
  if(st.hint[key] && !st.graded[key]){
    var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
    stage.querySelector(".ansblock").appendChild(hp);
  }
  var foot = h("div","foot");
  var bc = h("button","btn go","\u2713 Check answer"); bc.type="button"; bc.id="btn-check";
  bc.addEventListener("click", checkAnswer);
  var bn = h("button","btn primary","\u25B8 Next exercise"); bn.type="button"; bn.id="btn-next";
  bn.addEventListener("click", nextAnswer);
  foot.appendChild(bc); foot.appendChild(bn);
  stage.appendChild(foot);
  if(st.graded[key]){ renderFeedbackInto(ex, st.graded[key], true); }
  bn.disabled = !st.graded[key];
  updateHeader();
  window.scrollTo(0,0);
}
/* per-exercise countdown (EXTREMELY HARD terminal tasks) */
function startCountdown(ex, box){
  if(!ex.data || !ex.data.timerSeconds || !box){ return; }
  stopCountdown();
  st.cdLeft = ex.data.timerSeconds;
  var cd = h("div","countdown"); cd.id = "excd";
  box.insertBefore(cd, box.children[1] || null);
  function paint(){
    cd.textContent = "\u23F1 Reduced time limit for this terminal task: " + st.cdLeft + "s remaining. When it reaches 0, your command is graded as typed.";
  }
  paint();
  st.cd = setInterval(function(){
    if(st.timer.manual){ return; }
    st.cdLeft -= 1;
    if(st.cdLeft <= 0){
      stopCountdown();
      checkAnswer(true);   /* grade as typed, even when the command is empty */
      return;
    }
    paint();
  }, 1000);
}
function stopCountdown(){ if(st.cd){ clearInterval(st.cd); st.cd = null; } }

/* ---------- renderers ---------- */
