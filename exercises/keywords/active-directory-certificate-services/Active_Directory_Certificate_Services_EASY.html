<style>

:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#111a2c; --panel2:#0d1524; --line:#22304a;
  --txt:#e6edf7; --mut:#a8b3c7; --blue:#4da3ff; --amber:#ffb454; --green:#3ddc97;
  --orange:#ff8a4c; --red:#ff5c72; --grey:#9aa7b8; --cyan:#5fd4e6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 20% -10%, #12203a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt);
  font:16px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:1000px;margin:0 auto;padding:0 14px 60px;}
.hidden{display:none !important;}
/* ---------- sticky exam header ---------- */
.bar{
  position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  background:rgba(13,21,36,.96);border:1px solid var(--line);border-radius:0 0 12px 12px;
  padding:10px 12px;margin:0 -14px 14px;backdrop-filter:blur(4px);
}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bar .spacer{flex:1 1 auto;}
.badge{
  display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;
  letter-spacing:.4px;color:#08101e;border:1px solid rgba(255,255,255,.25);
}
.sev-easy{background:var(--green);}
.sev-medium{background:var(--amber);}
.sev-hard{background:var(--orange);}
.sev-xhard{background:var(--red);}
.counter{font-weight:700;font-size:15px;}
.timerbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;}
.timerbox .tval{font-weight:700;font-size:16px;}
.tmode{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);}
.tmode-run{color:#0a1a12;background:var(--green);}
.tmode-manual{color:#1d1405;background:var(--amber);}
.tmode-auto{color:#0a1626;background:var(--cyan);}
.tmode-ready{color:var(--mut);}
.scorebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;}
.btn{
  min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;cursor:pointer;
  background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:600;font-size:14.5px;
}
.btn:hover:not(:disabled){border-color:var(--blue);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04101f;}
.btn.go{background:var(--green);border-color:var(--green);color:#04140c;}
.btn.warn{border-color:var(--amber);color:var(--amber);}
.btn.danger{border-color:var(--red);color:var(--red);}
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
/* ---------- cards & the three contract blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
.cardhead{
  display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1.2px;font-size:14px;
  text-transform:uppercase;margin-bottom:10px;
}
.cicon{display:inline-flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--line);background:var(--panel2);}
.scen{border-left:5px solid var(--blue);background:linear-gradient(180deg,#101c33,#111a2c);}
.scenhead{color:var(--blue);}
.qblock{border-left:5px solid var(--amber);background:linear-gradient(180deg,#1d1a10,#111a2c);}
.qblock .cardhead{color:var(--amber);}
.ansblock{border-left:5px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);}
.ansblock .cardhead{color:var(--green);}
.qtext{font-weight:700;font-size:17px;}
.smallnote{color:var(--mut);font-size:14px;margin:4px 0 10px;}
.divider{height:1px;background:var(--line);margin:14px 0;border:0;}
.art{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
.art-label{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;}
.art p{margin:6px 0;}
pre.code{
  font:14.5px/1.5 Consolas,"Courier New",monospace;background:#0a111f;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;overflow-x:auto;margin:6px 0;color:#d7e3f4;white-space:pre;
}
.collapsebtn{margin-left:auto;min-height:44px;padding:4px 12px;border-radius:8px;font-size:12.5px;}
.scensummary{color:var(--mut);font-size:13.5px;font-style:italic;}
/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:48px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  color:var(--txt);font-size:15.5px;cursor:pointer;
}
.opt:hover{border-color:var(--blue);}
.opt.sel{border-color:var(--green);background:#10241c;}
.opt .optlbl{font-weight:800;color:var(--cyan);flex:0 0 auto;}
.opt .opttxt{flex:1;}
.opt.picked-good{border-color:var(--green);}
.opt.picked-bad{border-color:var(--red);}
.opt.show-good{border-color:var(--green);}
/* ---------- drag & drop / matching ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.chip{
  min-height:44px;padding:8px 14px;border-radius:10px;background:#182540;
  border:1px solid var(--line);cursor:grab;font-size:14.5px;color:var(--txt);
}
.chip.held{border-color:var(--amber);background:#2a2413;}
.chip.used{opacity:.35;cursor:default;}
.zonewrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.zonerow{display:grid;grid-template-columns:minmax(140px,240px) 1fr;gap:8px;align-items:stretch;}
.zonelabel{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;}
.zone{
  min-height:52px;border:1.5px dashed #33486e;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;background:#0c1424;
}
.zone.over{border-color:var(--amber);}
.zone .chip{cursor:pointer;}
/* ---------- ordering / ranking ---------- */
.seq{display:flex;flex-direction:column;gap:6px;}
.seqrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;}
.seqrow .pos{flex:0 0 34px;text-align:center;font-weight:800;color:var(--cyan);}
.seqrow .txt{flex:1;font-size:15px;}
.seqrow .mv{min-height:44px;min-width:44px;padding:4px 8px;border-radius:8px;}
/* ---------- fill in the blank ---------- */
.filltext{font-size:16px;line-height:2;}
.slot{
  display:inline-block;min-width:120px;min-height:38px;border:1.5px dashed #33486e;border-radius:8px;
  background:#0c1424;color:var(--cyan);font-weight:700;padding:4px 10px;margin:0 4px;vertical-align:middle;cursor:pointer;
}
.slot.filled{border-style:solid;border-color:var(--green);}
.slot.over{border-color:var(--amber);}
/* ---------- log viewer ---------- */
.filterbox{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:8px 12px;font-size:14.5px;margin-bottom:8px;}
.loglines{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0a111f;}
.logline{
  display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #16223a;cursor:pointer;
  font:14px/1.5 Consolas,"Courier New",monospace;align-items:flex-start;
}
.logline:hover{background:#101b30;}
.logline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
.logline .ln{color:#5b6b85;flex:0 0 auto;min-width:26px;}
.t-stamp{color:var(--amber);}
.t-eid{color:var(--cyan);font-weight:700;}
.t-acct{color:#b7c9ff;}
/* ---------- spot the line ---------- */
.spotlines{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.spotline{
  display:block;width:100%;text-align:left;background:#0a111f;border:0;border-bottom:1px solid #16223a;
  color:#d7e3f4;font:14.5px/1.5 Consolas,"Courier New",monospace;padding:9px 12px;cursor:pointer;white-space:pre-wrap;
}
.spotline:hover{background:#101b30;}
.spotline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
/* ---------- terminal ---------- */
.term{background:#050a14;border:1px solid var(--line);border-radius:10px;padding:10px;}
.termout{
  font:14px/1.55 Consolas,"Courier New",monospace;color:#c9d7ea;max-height:260px;overflow:auto;
  white-space:pre-wrap;margin:0 0 8px;
}
.termrow{display:flex;align-items:center;gap:8px;}
.termprompt{font:14.5px Consolas,"Courier New",monospace;color:var(--green);white-space:nowrap;}
.termin{flex:1;background:transparent;border:0;border-bottom:1px solid #33486e;color:#e6f7ff;
  font:14.5px Consolas,"Courier New",monospace;min-height:38px;}
.support{background:#101c33;border:1px solid #243a5e;border-radius:10px;padding:10px 12px;margin:8px 0;}
.support .t{font-weight:800;color:var(--cyan);font-size:13px;letter-spacing:.6px;text-transform:uppercase;}
.countdown{display:inline-block;background:#2a1116;border:1px solid var(--red);color:var(--red);
  font-weight:800;border-radius:8px;padding:4px 10px;margin:6px 0;}
/* ---------- triage ---------- */
.alertcard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:10px;padding:10px 12px;margin:10px 0;}
.alertcard .atitle{font-weight:800;color:var(--red);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.alertcard .abody{font-size:15px;margin:6px 0 10px;}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.act{
  min-height:44px;border-radius:10px;background:#0c1424;border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;font-size:14px;cursor:pointer;text-align:left;
}
.act:hover{border-color:var(--blue);}
.act.sel{border-color:var(--green);background:#10241c;font-weight:700;}
/* ---------- branching steps ---------- */
.stepchip{display:inline-block;background:#1a2a46;border:1px solid var(--line);color:var(--cyan);
  font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 12px;letter-spacing:.8px;margin-bottom:6px;}
.stepnarr{color:var(--mut);font-size:14.5px;margin:2px 0 8px;}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
.fb-correct{border-left:6px solid var(--green);}
.fb-partial{border-left:6px solid var(--amber);}
.fb-incorrect{border-left:6px solid var(--red);}
.fbhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
.fb-correct .fbhead{color:var(--green);}
.fb-partial .fbhead{color:var(--amber);}
.fb-incorrect .fbhead{color:var(--red);}
.fbpts{font-weight:700;color:var(--txt);margin:6px 0;}
.fblist{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;}
.fblist .lt{font-weight:800;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
.lt-good{color:var(--green);} .lt-bad{color:var(--red);} .lt-miss{color:var(--amber);}
.fblist li{margin:6px 0 6px 18px;font-size:15px;}
.study{background:#0f2033;border:1px solid #1d3a5f;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px;}
.encourage{color:var(--mut);font-style:italic;margin-top:8px;font-size:14.5px;}
.copywrap{position:relative;}
.copybtn{position:absolute;top:6px;right:6px;min-height:44px;padding:3px 10px;border-radius:8px;font-size:12px;}
/* ---------- intro / review / results ---------- */
.herotitle{font-size:26px;font-weight:800;margin:10px 0 4px;}
.metchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.mchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600;}
.h2{font-size:18px;font-weight:800;margin:18px 0 6px;color:var(--cyan);}
.themebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;}
.themebox .th{font-weight:800;color:var(--amber);margin-bottom:6px;}
.concepts{display:flex;flex-wrap:wrap;gap:6px;}
.cpt{background:#0c1424;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mut);}
.rules li{margin:6px 0;}
.bigstart{width:100%;min-height:54px;font-size:17px;margin-top:14px;}
.revitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin:8px 0;}
.revitem .ri{flex:1;}
.revitem .rt{font-weight:700;}
.revitem .rs{color:var(--mut);font-size:13.5px;}
.ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--green) calc(var(--pct)*1%), #1c2942 0);margin:10px auto;}
.ring .in{width:130px;height:130px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring .pctv{font-size:30px;font-weight:800;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.stat .n{font-size:22px;font-weight:800;}
.stat .l{color:var(--mut);font-size:13px;}
.passpanel{border:1px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);border-radius:14px;
  padding:16px;text-align:center;margin:12px 0;}
.failpanel{border:1px solid var(--red);background:linear-gradient(180deg,#241016,#111a2c);border-radius:14px;
  padding:16px;text-align:center;margin:12px 0;}
.themetable{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;}
.themetable th,.themetable td{border:1px solid var(--line);padding:7px 10px;text-align:left;}
.themetable th{background:var(--panel2);color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
.repitem{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel);}
.rephd{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap;}
.rephd .rp{font-weight:700;}
.rephd .rs{color:var(--mut);font-size:13px;}
.stchip{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;border:1px solid var(--line);}
.st-ok{background:#0f2a1c;color:var(--green);border-color:#1d5c3d;}
.st-part{background:#2b2310;color:var(--amber);border-color:#6b5423;}
.st-no{background:#2a1218;color:var(--red);border-color:#6b2330;}
.st-skip{background:#1c2130;color:var(--grey);}
.repbd{border-top:1px solid var(--line);padding:12px 14px;display:none;}
.repitem.open .repbd{display:block;}
/* ---------- pause overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,16,.94);z-index:80;display:flex;align-items:center;justify-content:center;}
.ovbox{text-align:center;background:var(--panel);border:1px solid var(--amber);border-radius:16px;padding:30px 40px;max-width:440px;}
.ovbox .big{font-size:22px;font-weight:800;color:var(--amber);margin-bottom:8px;}
/* ---------- footer actions ---------- */
.foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.hintpanel{background:#221d0e;border:1px solid #6b5423;border-radius:10px;padding:10px 12px;margin:10px 0;color:#ffe2ae;font-size:14.5px;}
@media (max-width:760px){
  .bar{padding:8px;}
  .zonerow{grid-template-columns:1fr;}
  .herotitle{font-size:21px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important;}
}

<script>
var EXAM = {"title": "Active Directory Certificate Services — EASY", "sevKey": "easy", "sevLabel": "EASY", "timerSeconds": 1500, "terminalForgive": true, "themes": [["PKI Foundations", ["Certification Authority (CA)", "Root CA / offline root", "Subordinate (issuing) CA", "Enterprise CA vs Standalone CA", "Chain of trust", "AIA (Authority Information Access)", "CRL / Delta CRL / OCSP", "ntAuthCertificates", "Cert Publishers"]], ["Templates & Enrollment", ["Certificate templates", "EKU (Extended Key Usage)", "SAN (Subject Alternative Name)", "ENROLLEE_SUPPLIES_SUBJECT", "Autoenrollment (GPO)", "Web enrollment (/certsrv)", "CEP / CES", "Enrollment Agent", "CA roles: ManageCA / ManageCertificates", "EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE"]], ["Attack Paths (ESC)", ["ESC1 - template SAN abuse", "ESC2 - Any Purpose / no EKU", "ESC3 - enrollment agent abuse", "ESC4 - template write rights", "ESC5 - PKI object ACLs", "ESC6 - CA-wide SAN flag", "ESC7 - ManageCA / ManageCertificates abuse", "ESC8 - NTLM relay to enrollment endpoints", "ESC9 / ESC10 - weak certificate mapping", "Pass-the-certificate", "UnPAC-the-hash", "Shadow Credentials (msDS-KeyCredentialLink)", "Certificate theft (DPAPI / LSASS)", "Golden certificate"]], ["Tools & Commands", ["certutil", "certreq", "Certmgr.msc / Certlm.msc", "Certipy", "Certify", "Rubeus", "ForgeCert", "Mimikatz", "Whisker"]], ["Detection & Logging", ["Event 4886 / 4887 / 4888 (issued / approved / denied)", "Event 4870 (revoked)", "Event 4882 (CA backup)", "Event 4889 / 4890 (CA service start / stop)", "Event 4898 / 4899 (template change)", "Event 4768 (Kerberos PKINIT)", "Event 4771", "Sysmon process events", "CA audit policy"]], ["Hardening & Operations", ["Template ACL review", "Remove ENROLLEE_SUPPLIES_SUBJECT", "Clear CA EditFlags (ESC6)", "Strong certificate mapping", "Disable NTLM on enrollment endpoints", "EPA / channel binding", "Role separation", "CA backup / restore", "Key archival", "Renewal vs re-enrollment", "Revocation handling", "GPO autoenrollment policy", "PKI documentation / compliance"]]], "intro": [{"h2": "What is Active Directory Certificate Services (AD CS)?", "paras": ["AD CS is a role for Windows Server. It is Microsoft's built-in PKI. PKI means Public Key Infrastructure. A PKI makes, signs, checks and cancels digital certificates. A certificate is like a digital ID card. It proves that a user, a computer or a service is really who it claims to be.", "Imagine a big office building. The receptionist gives a plastic badge to every worker and visitor. The guards trust the badge because the receptionist signed it. In a Windows domain, the CA (Certification Authority) is that receptionist. AD CS is the whole badge office: the printer, the rules, the records and the cancel list."]}, {"h2": "Where you will meet AD CS in real work", "paras": ["AD CS touches many cybersecurity jobs. Here are the main ones:"], "list": ["Security engineers run and harden the CA servers. They create templates and keep the PKI healthy.", "SOC analysts watch certificate events on a shift. They look for strange certificate requests and strange logons.", "Incident responders investigate attacks that use certificates. They decide what to contain and what to keep as evidence.", "GRC teams write PKI policies and check that the rules are followed. They produce documents like template reviews and risk reports.", "Red teams test AD CS, because attackers love it: one unsafe template or one stolen CA key can let someone sign in as anybody, with no password needed."]}, {"h2": "What people do with it every day", "paras": ["Day to day, the people around a CA do a small set of repeating tasks:"], "list": ["They create and update certificate templates (the forms that describe how certificates are made).", "They approve or deny certificate requests.", "They renew certificates before they expire, and revoke (cancel) certificates that are lost or stolen.", "They publish revocation lists (CRLs) and keep CA backups.", "They write everything down for audits: policies, runbooks and incident reports."]}, {"h2": "The tools you will see", "paras": ["On Windows you will use built-in tools like Certutil, Certreq, Certmgr.msc and Certlm.msc. Security teams also use Certipy and Certify to find unsafe settings, Rubeus to work with Kerberos tickets, and Mimikatz or Whisker in attack simulations. Command tasks in this exam run in a safe fake shell, so you can practise without any risk."]}, {"h2": "The risks AD CS must control", "paras": ["Certificates often replace passwords. So certificate attacks are like password attacks, but much quieter. The classic unsafe patterns have names like ESC1 to ESC10 from well-known research. Examples: a template that lets a requester type any name, a CA-wide flag that accepts any subject, or an NTLM relay to the enrollment website. If attackers steal the CA private key, they can forge certificates for years (a golden certificate).", "This exam teaches you to spot these patterns, to see them in logs, and to fix them."]}, {"h2": "How scoring works (please read)", "list": ["Every exercise is worth 100 points. Your percentage is your points divided by the points of the exercises you actually answered.", "Some exercises have several parts (for example drag-and-drop slots or select-all answers). You get part of the points for the parts you get right.", "In select-all exercises, every wrong pick cancels one right pick.", "In slot exercises (matching, ordering, fill-the-blank, triage, branching), each correct slot gives its own share of the points. A wrong slot only loses its own share.", "The Hint button shows a nudge, never the answer. It costs 10% of that one exercise's points.", "Skip moves an exercise to a review pool without showing the answer. You can go back as long as the timer runs. If you never answer a skipped exercise, it is excluded from the score: it adds nothing to your points and nothing to the maximum.", "The live score in the header always shows points earned out of points possible, over the exercises you have actually answered."]}, {"h2": "How the timer works", "list": ["You have a total time for this file (shown in the chips above).", "The Pause button stops the timer and hides the exercise. Press Resume when you are ready.", "When you press Check, the timer also stops, so you can read the explanation for free. Nothing is hidden while you read.", "The timer starts again when you press Next.", "The timer area always shows its state: running, paused by you, or paused for feedback."]}, {"h2": "What this file tests and how hard it is", "paras": ["This is the EASY file. Every exercise here tests exactly one idea. Scenarios are short, the wording tells you what to look at, and every wrong answer is wrong for an obvious reason once you know the concept. If you read the introduction above, you can recover with a hint.", "Take your time. There is no per-exercise time pressure in this file. Use the hints freely when you are unsure — they cost 10% of one exercise, and learning is worth more."]}, {"h2": "Exercise types in this file", "paras": ["This file mixes many interactive formats — not just multiple choice:"], "list": ["Single-choice questions with tricky distractors", "Drag-and-drop matching (cards onto zones)", "Timeline ordering (put steps in order)", "Fill-in-the-blank with a shuffled word bank", "SOC alert-queue triage with consequences", "Log analysis in a filterable log viewer", "Spot-the-mistake (click the wrong line)", "Terminal emulator tasks (safe fake shell)"]}], "meta": {"topicId": "active-directory-certificate-services", "batch": 1, "title": "Active Directory Certificate Services — EASY", "difficulty": "easy", "questionCount": 17, "estimatedMinutes": 25, "passMark": 70}, "exercises": [{"id": "E01", "type": "qcm", "theme": "PKI Foundations", "title": "What AD CS actually does", "scenario": {"summary": "First day at a new IT job", "blocks": [{"label": "Context", "prose": "It is your first day as a junior IT technician. The team lead says: “Our domain runs Active Directory Certificate Services. Please read about it before your first ticket.”"}]}, "question": "Which sentence best describes the main job of AD CS?", "hint": "This is about the system that makes digital ID cards for computers and users.", "data": {"options": [{"t": "It creates, signs and manages digital certificates for users and computers", "correct": true, "why": "AD CS is Microsoft's PKI role. A PKI is the system that makes and manages digital certificates."}, {"t": "It stops viruses and malware from running on every single laptop in the domain", "correct": false, "why": "Stopping viruses is the job of antivirus software, not of a certificate service."}, {"t": "It keeps every user password inside a special encrypted offline database", "correct": false, "why": "Passwords live inside Active Directory itself, not in the certificate service."}, {"t": "It filters unwanted email and spam before it reaches the user inboxes", "correct": false, "why": "Email filtering is a mail security product. It has nothing to do with certificates."}]}, "explain": "AD CS stands for Active Directory Certificate Services. It is Microsoft's PKI role. Think of it as an office that makes and signs digital ID cards. The ID cards are certificates. Users, computers and services use them to prove who they are. AD CS also renews them before they expire and revokes (cancels) them when they are not safe any more.", "study": "Read about the basic PKI words: CA, certificate, template, EKU, SAN and CRL."}, {"id": "E02", "type": "match", "theme": "PKI Foundations", "title": "Six PKI words you must know", "scenario": {"summary": "Your team lead leaves you a word list", "blocks": [{"label": "Context", "prose": "Your team lead leaves a note on your desk: “If you know these six words, you can work with AD CS.”"}]}, "question": "Drag each card onto the sentence that describes it.", "hint": "Start with the CA — it is the trusted server. Then the certificate is the ID file it signs.", "data": {"zones": [{"label": "Certification Authority (CA)", "items": [{"t": "The trusted server that signs and issues certificates", "why": "The CA is the heart of the PKI. It signs every certificate."}]}, {"label": "Certificate", "items": [{"t": "A digital ID file in X.509 format that proves an identity", "why": "A certificate binds a name to a public key and is signed by a CA."}]}, {"label": "Certificate template", "items": [{"t": "The set of rules that describes how a certificate is built", "why": "Templates say which names, keys and uses are allowed."}]}, {"label": "EKU (Extended Key Usage)", "items": [{"t": "The list of jobs a certificate is allowed to do", "why": "For example Client Authentication lets it prove a logon."}]}, {"label": "SAN (Subject Alternative Name)", "items": [{"t": "The field that can hold extra names, like other DNS names", "why": "Modern clients read the SAN, so it must match the real name."}]}, {"label": "AIA (Authority Information Access)", "items": [{"t": "The address where clients can fetch the CA's certificate", "why": "Clients use the AIA to build the chain of trust."}]}]}, "explain": "These six words appear in every AD CS conversation. The CA signs. The certificate proves. The template describes. The EKU limits the use. The SAN carries names. The AIA tells clients where the CA certificate lives.", "study": "Re-read the PKI Foundations theme in the keywords panel above."}, {"id": "E03", "type": "order", "theme": "PKI Foundations", "title": "The chain of trust", "scenario": {"summary": "A whiteboard photo, steps on sticky notes", "blocks": [{"label": "Context", "prose": "A web server shows visitors the error “untrusted certificate”. Your mentor explains how trust works and writes four steps on sticky notes — then drops them. Now the notes are in a random order."}]}, "question": "Put the four steps back in the correct order, from first to last.", "hint": "Trust starts at the top. Find the step about the Root CA and begin there.", "data": {"items": [{"t": "The offline Root CA is created and its key is kept safe, off the network", "why": "Everything starts with the root. Offline means hard to attack."}, {"t": "The Root CA signs a certificate for the Subordinate (issuing) CA", "why": "The root passes trust down to the issuing CA."}, {"t": "The issuing CA signs a certificate for the web server", "why": "The issuing CA does the daily work of signing certificates."}, {"t": "Visitors trust the web server by walking up this chain to the Root CA", "why": "Their browser follows the chain: server, issuing CA, root."}]}, "explain": "Trust in a PKI is a chain. The Root CA sits at the top and is kept offline for safety. The Root CA trusts the issuing CA. The issuing CA signs the certificates that people really use. A browser walks up the chain. If every link is good, the padlock appears.", "study": "Draw your own chain: root, issuing CA, end certificate. Add the AIA address where the CA certificate is fetched."}, {"id": "E04", "type": "qcm", "theme": "PKI Foundations", "title": "Why the Root CA sleeps", "scenario": {"summary": "A powered-off server with a warning label", "blocks": [{"label": "Context", "prose": "In the server room you find a machine labelled “ROOT-CA — keep powered off — do not connect to network”. You ask why the most important server is always off."}]}, "question": "What is the main security reason to keep the Root CA offline?", "hint": "Think about what an attacker could do if they reached the root's private key.", "data": {"options": [{"t": "A machine that is off and unplugged is very hard for attackers to reach", "correct": true, "why": "The root's key can sign new trust. Offline storage protects it from theft."}, {"t": "Certificates are created and issued much faster when the CA stays offline", "correct": false, "why": "An offline CA cannot issue anything at all. Speed is not the reason."}, {"t": "The law says that every Root CA must always be switched off and locked away", "correct": false, "why": "There is no such law. Offline root is a security best practice, not a legal one."}, {"t": "An offline CA can sign many more certificates per day and per week", "correct": false, "why": "Signing speed has nothing to do with being offline."}]}, "explain": "The Root CA is the top of the trust chain. If an attacker steals its private key, they can make the whole domain trust anything. Keeping the root offline removes the most common ways in: no network, no remote login, no daily attacks. You only start it for rare tasks, like renewing the issuing CA.", "study": "Read about the CA hierarchy: root CA, subordinate CA, and why role separation matters."}, {"id": "E05", "type": "fill", "theme": "Templates & Enrollment", "title": "Three words every template talks about", "scenario": {"summary": "Fill the missing PKI words", "blocks": [{"label": "Context", "prose": "Your mentor sends you a sentence with three missing words. She says: “If you can fill this, you understand the template basics.”"}]}, "question": "Drag a word from the bank into each blank.", "hint": "One word is EKU — it is the list of allowed jobs. The CA is the server that signs.", "data": {"text": "A certificate template is like a form: it says how certificates are made. The {0} lists the jobs the certificate may do. The {1} can hold extra names, for example other DNS names. Finally, the {2} is the server role that signs the certificate.", "slots": ["EKU", "SAN", "CA"], "slotWhy": ["EKU (Extended Key Usage) is the list of allowed uses, like Client Authentication.", "SAN (Subject Alternative Name) holds extra names such as other DNS names.", "The CA (Certification Authority) signs and issues the certificate."], "bank": ["EKU", "SAN", "CA", "DNS", "DHCP", "VPN"]}, "explain": "Templates control three important things: what the certificate may do (EKU), which names it carries (subject and SAN), and who signs it (the CA). When you audit a template, you always look at these three parts first.", "study": "Open a real template in Certtmpl.msc one day and find the EKU tab and the Subject name tab."}, {"id": "E06", "type": "triage", "theme": "Hardening & Operations", "title": "Morning at the certificate desk", "scenario": {"summary": "Three tickets, three desk actions", "blocks": [{"label": "Context", "prose": "You staff the certificate desk for one morning. Three tickets wait in the queue. Choose the correct desk action for each ticket."}]}, "question": "Pick the correct action for every ticket.", "hint": "New device means make a certificate. Almost expired means extend it. Lost or stolen means cancel it.", "data": {"actions": ["Enroll — make a new certificate", "Renew — extend an existing certificate", "Revoke — cancel a certificate"], "alerts": [{"tag": "Ticket 8101", "body": "A brand-new laptop “LT-2204” joined the domain this morning. It has no computer certificate yet. Everything else looks normal.", "correct": 0, "why": "A new device needs its first certificate. That is enrollment."}, {"tag": "Ticket 8102", "body": "The web server's certificate expires in 5 days. The server is healthy and the certificate still works today.", "correct": 1, "why": "A healthy, nearly expired certificate should be renewed before it breaks."}, {"tag": "Ticket 8103", "body": "A user lost their laptop in a taxi. Its certificate is still valid and could be copied off the disk.", "correct": 2, "why": "A certificate that may be stolen must be revoked so it stops working."}]}, "explain": "The three daily moves of a certificate desk are enroll, renew and revoke. Enroll for new devices and users. Renew before expiry. Revoke when a certificate may be in the wrong hands — the CA then publishes the cancellation in its CRL.", "study": "Read about the certificate lifecycle: request, issuance, use, renewal, revocation."}, {"id": "E07", "type": "qcm", "theme": "Templates & Enrollment", "title": "Certificates that appear by themselves", "scenario": {"summary": "A user call about a mystery certificate", "blocks": [{"label": "Context", "prose": "A user calls you: “I got a new laptop last week. Today a certificate appeared in my certificate store. I never clicked anything. Is this a virus?” You check: the laptop is domain-joined and healthy."}]}, "question": "Which normal AD CS feature explains a certificate appearing without any clicks?", "hint": "It is a policy that asks computers to enroll all by themselves.", "data": {"options": [{"t": "Autoenrollment, switched on by a Group Policy", "correct": true, "why": "Autoenrollment lets domain members request and renew certificates automatically."}, {"t": "The CRL, published weekly by the CA", "correct": false, "why": "The CRL is the list of revoked certificates. It does not install certificates."}, {"t": "The AIA address that the web browser fetches by itself", "correct": false, "why": "The AIA only helps clients download the CA certificate to build a chain."}, {"t": "The SAN field of the certificate, typed by the user", "correct": false, "why": "The SAN is a field inside a certificate, not a delivery system."}]}, "explain": "Autoenrollment is a Group Policy feature. When it is on, domain computers and users ask for certificates, install them and renew them without clicks. It is normal and safe when the templates behind it are safe. A mystery certificate is usually just autoenrollment doing its job.", "study": "Read how a GPO turns on autoenrollment for users and computers."}, {"id": "E08", "type": "logview", "theme": "Detection & Logging", "title": "Find the issuance event", "scenario": {"summary": "Three events, one certificate", "blocks": [{"label": "Context", "prose": "Your SIEM shows three events from this morning. One of them is the CA saying that it issued a certificate."}]}, "question": "Click the one line that shows a certificate was issued.", "hint": "Event 4886 is the CA's “certificate issued” message.", "data": {"multi": false, "lines": ["2026-10-12 08:41:03  CERTSVR  Event 7036  The Certificate Authority service entered the running state.", "2026-10-12 08:41:55  CERTSVR  Event 4886  Certificate issued. Requester: CORP\\LT-2204$  Template: WorkstationAuthentication", "2026-10-12 08:42:10  FILESRV   Event 4663  An attempt was made to access an object."], "pick": [1], "lineWhy": ["Event 4886 is written by the CA when it issues a certificate. It names the requester and the template."]}, "explain": "Event 4886 is the CA's “issued” event. It tells you who asked (the requester) and which template was used. Event 7036 only says a service started or stopped. Event 4663 is a file access attempt. Learning the small family of CA events — 4886 issued, 4887 approved, 4888 denied — is the fastest way to read a CA log.", "study": "Learn the CA event family: 4886, 4887, 4888, 4870 and 4882."}, {"id": "E09", "type": "match", "theme": "Templates & Enrollment", "title": "What may this certificate do?", "scenario": {"summary": "Match each EKU to its job", "blocks": [{"label": "Context", "prose": "A colleague shows you four certificates and asks: “What is each one allowed to do?” The answer lives in each certificate's EKU."}]}, "question": "Drag each card onto the job it allows.", "hint": "EKU means “what the certificate is allowed to do”. Client means the side that connects to a service.", "data": {"zones": [{"label": "Client Authentication", "items": [{"t": "Proves a user or computer when it signs in to other systems", "why": "Client Authentication is the EKU used for logon proof."}]}, {"label": "Server Authentication", "items": [{"t": "Proves a server's identity to the people who connect to it", "why": "Server Authentication is what websites use in TLS."}]}, {"label": "Code Signing", "items": [{"t": "Proves that a program really came from a trusted maker", "why": "Code Signing lets software be checked before it runs."}]}, {"label": "Smart Card Logon", "items": [{"t": "Allows signing in with a smart card instead of a password", "why": "Smart Card Logon is a special Client Authentication use."}]}]}, "explain": "The EKU is the job list of a certificate. Windows enforces it: a certificate with only Server Authentication cannot be used to log on, and a Client Authentication certificate cannot prove a website. When attackers abuse templates, they always want a Client Authentication (or Smart Card Logon) EKU, because that EKU turns into a logon.", "study": "Look at the EKU list in your own certificates with Certmgr.msc."}, {"id": "E10", "type": "spot", "theme": "Templates & Enrollment", "title": "One template line stands out", "scenario": {"summary": "Read a template card, click one line", "blocks": [{"label": "ARTEFACT 1 — Template card for Flex-ID-Auth", "code": "Template name:        Flex-ID-Auth\nEKU:                  Client Authentication\nSubject name:         Built from Active Directory information\nName flag:            ENROLLEE_SUPPLIES_SUBJECT — requester types the subject by hand\nEnrollment rights:    CORP\\Helpdesk-Interns"}]}, "question": "Click the line that lets the requester choose the subject name by hand.", "hint": "The subject is the name written inside the certificate. One flag says the requester types it themselves.", "data": {"multi": false, "lines": ["Template name:        Flex-ID-Auth", "EKU:                  Client Authentication", "Subject name:         Built from Active Directory information", "Name flag:            ENROLLEE_SUPPLIES_SUBJECT — requester types the subject by hand", "Enrollment rights:    CORP\\Helpdesk-Interns"], "pick": [3], "lineWhy": ["ENROLLEE_SUPPLIES_SUBJECT removes the safety net: the requester, not Active Directory, decides whose name goes into the certificate."]}, "explain": "In a safe template, Active Directory builds the subject from the requester's own account. The flag ENROLLEE_SUPPLIES_SUBJECT switches that off: the requester can type any name. On a Client Authentication template this is the seed of the classic ESC1 attack. On its own it is just a setting — but you must be able to find it.", "study": "Read about the template flag ENROLLEE_SUPPLIES_SUBJECT and why auditors hunt for it."}, {"id": "E11", "type": "qcm", "theme": "PKI Foundations", "title": "The list of cancelled certificates", "scenario": {"summary": "A laptop is stolen, the certificate must die", "blocks": [{"label": "Context", "prose": "A laptop is stolen. You revoke its certificate on the CA. Now every other system must learn that this certificate is no longer good."}]}, "question": "Where do other systems look to see which certificates are revoked?", "hint": "Revoked means cancelled. The CA publishes a list for exactly this purpose.", "data": {"options": [{"t": "The CRL published by the CA", "correct": true, "why": "The Certificate Revocation List is the public list of cancelled certificates."}, {"t": "The DHCP address list", "correct": false, "why": "DHCP hands out IP addresses. It knows nothing about certificates."}, {"t": "The DNS zone file", "correct": false, "why": "DNS resolves names to addresses. It does not track revocation."}, {"t": "The antivirus quarantine list", "correct": false, "why": "Antivirus quarantines files, not certificates."}]}, "explain": "When a CA revokes a certificate, it writes the serial number into the CRL (Certificate Revocation List). Clients download the CRL and refuse revoked certificates. For faster checks there is also OCSP, a service that answers “is this serial revoked?” in real time. Both exist so that one stolen certificate cannot be used everywhere.", "study": "Read about CRL, Delta CRL and OCSP."}, {"id": "E12", "type": "term", "theme": "Tools & Commands", "title": "List the certificate templates (guided)", "scenario": {"summary": "Your first Certutil command on the CA", "blocks": [{"label": "Context", "prose": "You are on the CA server CORP-CA-01. Your mentor says: “Certutil is the built-in Windows certificate tool. It can show the certificate templates this CA offers. Type the command that lists the certificate templates.”"}]}, "question": "Type the command, then press Enter (or press Check).", "hint": "The tool is Certutil. The option that means “certificate templates” is -CATemplates.", "data": {"prompt": "PS C:\\> ", "banner": "Simulation shell on CORP-CA-01. Nothing real is executed.\nType the command and press Enter.", "canonical": "certutil -CATemplates", "required": ["\\bcertutil(\\.exe)?\\b", "-catemplates\\b"], "forbidden": [], "parts": [{"text": "certutil", "why": "the built-in Windows certificate tool"}, {"text": "-CATemplates", "why": "asks Certutil to list the certificate templates this CA offers"}], "syntaxPanel": "Command shape:   certutil -CATemplates\n  certutil       the Windows certificate tool\n  -CATemplates   list the certificate templates offered by this CA\n\nA different Certutil verb on a different server:  certutil -ping -config CORP-CA-02   (so this example cannot be copy-pasted)", "sampleOutput": "WebServer\nWorkstationAuthentication\nUser-Basic\nFlex-ID-Auth\nCORP-Issuing-CA offers 4 templates"}, "explain": "Certutil is the Swiss army knife of Windows certificates. The -CATemplates option lists the templates published by the CA you are on. You will use Certutil many times in real work: to list, to request, to back up and to inspect. In this guided task you only had to assemble two pieces you were given.", "study": "Open a terminal and try certutil -? to see the huge list of Certutil verbs (read-only, on a test machine)."}, {"id": "E13", "type": "fill", "theme": "Hardening & Operations", "title": "How computers get certificates alone", "scenario": {"summary": "Complete the autoenrollment paragraph", "blocks": [{"label": "Context", "prose": "You must complete a short paragraph for the team wiki about automatic certificates."}]}, "question": "Drag a word from the bank into each blank.", "hint": "GPO means Group Policy Object — a settings package from Active Directory.", "data": {"text": "Autoenrollment is switched on with a {0}. The policy tells computers to {1} for certificates by themselves. Before a certificate expires, the computer asks for a {2} automatically, so nothing breaks.", "slots": ["GPO", "enroll", "renewal"], "slotWhy": ["Autoenrollment is deployed with a Group Policy Object.", "Computers enroll: they request certificates without a user clicking anything.", "Renewal happens automatically before expiry, so services keep working."], "bank": ["GPO", "enroll", "renewal", "firewall", "delete", "shutdown"]}, "explain": "Autoenrollment has three parts: a GPO that switches the feature on, an enrollment action that requests certificates from the templates a user or computer is allowed to use, and an automatic renewal before expiry. When you see certificates “appear by themselves”, this is the machinery behind it.", "study": "Read where the autoenrollment GPO lives: Computer Configuration and User Configuration policies."}, {"id": "E14", "type": "order", "theme": "Hardening & Operations", "title": "The life of a certificate", "scenario": {"summary": "Five steps, random order", "blocks": [{"label": "Context", "prose": "A sticky note on the monitor says: “A certificate has a life, like an employee.” The five steps of that life are shuffled below."}]}, "question": "Put the five steps of a certificate's life in order, from first to last.", "hint": "Start with the request. End with renewal or revocation.", "data": {"items": [{"t": "Somebody or some computer asks the CA for a certificate", "why": "Everything starts with an enrollment request."}, {"t": "The CA checks the request against the template rules", "why": "The CA looks at EKU, subject rules and enrollment rights."}, {"t": "The CA signs the certificate and issues it", "why": "If the rules pass, the CA signs with its private key."}, {"t": "The certificate is stored and used for logons or encryption", "why": "The certificate lands in the user or computer store."}, {"t": "Later it is renewed before expiry, or revoked if unsafe", "why": "Renewal or revocation ends the first life; renewal starts a new one."}]}, "explain": "Request, check, issue, use, renew or revoke. Every certificate in your domain follows this path. Almost every AD CS attack abuses one of these steps: a fake request (unsafe template), a stolen issued certificate, or a missed revocation. Knowing the normal path makes the abnormal one visible.", "study": "Map one real certificate from your domain onto these five steps."}, {"id": "E15", "type": "match", "theme": "Tools & Commands", "title": "Know your tools", "scenario": {"summary": "Five tools, five purposes", "blocks": [{"label": "Context", "prose": "A new colleague asks: “Which tool does what?” Match each tool to its purpose."}]}, "question": "Drag each card onto the tool it describes.", "hint": "Two tools are built into Windows. The others are famous security tools.", "data": {"zones": [{"label": "Certutil", "items": [{"t": "Built-in Windows tool to manage and inspect certificates", "why": "Certutil ships with Windows and does dozens of certificate jobs."}]}, {"label": "Certmgr.msc", "items": [{"t": "Windows window that shows your own certificate store", "why": "Certmgr.msc is the graphical view of the current user's certificates."}]}, {"label": "Certipy", "items": [{"t": "Linux tool that checks AD CS for unsafe settings", "why": "Certipy enumerates CAs and templates and flags weaknesses."}]}, {"label": "Rubeus", "items": [{"t": "Tool that asks for Kerberos tickets, including with certificates", "why": "Rubeus can turn a certificate into a TGT (pass-the-certificate)."}]}, {"label": "Mimikatz", "items": [{"t": "Tool that can pull secrets, including certificates, from memory", "why": "Mimikatz can extract certificates and keys from memory (LSASS)."}]}]}, "explain": "Blue teams and red teams share a toolbox. Certutil and Certmgr.msc are built in and safe to learn first. Certipy, Certify, Rubeus, Mimikatz, ForgeCert and Whisker appear in attack simulations and in real incidents — knowing their names helps you read reports and spot their fingerprints in logs.", "study": "Look up ForgeCert (golden certificates) and Whisker (Shadow Credentials) so the names ring a bell later."}, {"id": "E16", "type": "qcm", "theme": "Templates & Enrollment", "title": "What can a Client Authentication certificate do?", "scenario": {"summary": "A colleague shows a certificate", "blocks": [{"label": "Context", "prose": "A colleague shows you a certificate. Its EKU says “Client Authentication”. He asks what he can use it for."}]}, "question": "What is a Client Authentication certificate mainly used for?", "hint": "Client means the side that connects to a service. The certificate proves who that side is.", "data": {"options": [{"t": "Proving the holder's identity when signing in to systems", "correct": true, "why": "Client Authentication turns a certificate into logon proof."}, {"t": "Digitally signing company software packages before their release", "correct": false, "why": "That is the Code Signing EKU, not Client Authentication."}, {"t": "Proving a website's real address to every visitor who connects", "correct": false, "why": "That is the Server Authentication EKU — the server side, not the client."}, {"t": "Encrypting whole hard disks with BitLocker on laptops", "correct": false, "why": "BitLocker uses other keys. Client Authentication is about logon proof."}]}, "explain": "Client Authentication is the most wanted EKU in AD CS security. Whoever holds such a certificate can prove to be the name inside it — for logons over Kerberos (PKINIT) and other protocols. That is why auditors check twice which templates combine Client Authentication with weak rules, and why attackers hunt exactly this EKU.", "study": "Read how a Client Authentication certificate becomes a Kerberos ticket (PKINIT)."}, {"id": "E17", "type": "match", "theme": "PKI Foundations", "title": "Which CA is which?", "scenario": {"summary": "Four CA names, four roles", "blocks": [{"label": "Context", "prose": "Your onboard /* ---------- syntax highlight for log lines (neutral, reveals nothing) ---------- */
function hlLog(line){

  s = s.replace(/(\d{2}:\d{2}:\d{2})/g, '<span class="t-stamp">$1</span>');
  s = s.replace(/\b(4768|4771|4624|4663|4886|4887|4888|4870|4882|4889|4890|4898|4899|7036|4880|4881)\b/g, '<span class="t-eid">$1</span>');

function updateHeader(){

    c.textContent = "Review skipped exercises";

  var n = skippedCount();

function skippedCount(){

/* ---------- manual pause ---------- */
function togglePause(){

  if(!st.timer.manual){

    $("stage").classList.add("hidden");
    $("overlay").classList.remove("hidden");

}

/* ---------- hint ---------- */
function useHint(){
  if(st.cur === null || st.graded[st.cur] || st.hint[st.cur]){ return; }
  st.hint[st.cur] = true;
  var ex = E.exercises[st.cur];
  var old = document.querySelector(".hintpanel");
  if(old){ old.parentNode.removeChild(old); }
  var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
  var ans = document.querySelector(".ansblock");
  ans.appendChild(hp);
  updateHeader();
}

/* ---------- skip ---------- */
function doSkip(){
  if(st.cur === null || st.graded[st.cur]){ return; }
  st.skipped[st.cur] = true;
  stopCountdown();
  goNext(true);
}
function goNext(){
  st.fromReview = false;
  var idx = -1;
  for(var i = st.pos+1; i < st.order.length; i++){
    var k = st.order[i];
    if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
  }
  st.timer.auto = false;
  if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
  if(skippedCount() > 0){ st.fromReview = true; openReview(); return; }
  endExam("done");
}

/* ---------- navigation guards for Check / Next ---------- */
function checkAnswer(force){
  if(st.cur === null || st.graded[st.cur]){ return; }
  var ex = E.exercises[st.cur];
  var ans = curRenderer.collect();
  if(ex.type === "term" && normCmdRaw(ans.cmd) === "" && !force){
    if(curRenderer.print){ curRenderer.print("(!) Type a command first, then press Enter or Check."); }
    return;
  }
  st.ans[st.cur] = ans;
  var g = GRADER[ex.type](ex, ans);
  var pts;
  if(g.t <= 0){ pts = 0; }
  else if(g.select){ pts = Math.floor(Math.max(0, g.c - g.w) / g.t * 100); }
  else { pts = Math.floor(g.c / g.t * 100); }
  if(st.hint[st.cur]){ pts = Math.floor(pts * 0.9); }
  g.points = pts;
  st.graded[st.cur] = g;
  if(ex.type === "term" && curRenderer.print){
    curRenderer.print(normCmdRaw(ans.cmd) || "(empty command)");
    if(pts === 100){
      curRenderer.print("[OK] The simulation accepts this command." + (ex.data.sampleOutput ? "\n" + ex.data.sampleOutput : ""));
    } else {
      curRenderer.print("[x] The simulation stops here. Read the explanation below.");
    }
  }
  stopCountdown();
  st.timer.auto = true;          /* auto-pause on Check: feedback readable, timer stopped */
  renderFeedbackInto(ex, g);
  updateHeader();
}
function nextAnswer(){
  if(st.cur === null || !st.graded[st.cur]){ return; }
  stopCountdown();
  if(st.fromReview){
    if(skippedCount() > 0){ openReview(); return; }
    st.fromReview = false;
    var idx = -1;
    for(var i = st.pos+1; i < st.order.length; i++){
      var k = st.order[i];
      if(!st.graded[k] && !st.skipped[k]){ idx = i; break; }
    }
    if(idx >= 0){ st.pos = idx; showExercise(st.order[idx]); return; }
    endExam("done"); return;
  }
  goNext();
}

/* per-exercise countdown (EXTREMELY HARD terminal tasks) */
function startCountdown(ex, box){

  stopCountdown();
  st.cdLeft = ex.data.timerSeconds;
  var cd = h("div","countdown"); cd.id = "excd";

/* ---------- renderers ---------- */
var RENDER = {};

  });
  function clearHeld(){
    Array.prototype.forEach.call(bank.children, function(c){ c.classList.remove("held"); });
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(c){ c.classList.remove("held"); });
  }
  var chipEls = [];
  function placeItem(id, zi){
    if(st.graded[st.cur]){ return; }
    place[id] = zi;
    var el = chipEls[id];
    zoneEls[zi].appendChild(el);
    el.classList.remove("held");
  }
  function backToBank(id){
    if(st.graded[st.cur]){ return; }
    place[id] = -1;
    bank.appendChild(chipEls[id]);
  }
  order.forEach(function(id, n){
    var el = makeChip(flat[id].t, true);
    el.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(id)); });
    el.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(place[id] >= 0){ backToBank(id); return; }
      if(held === id){ held = null; clearHeld(); return; }
      held = id; clearHeld(); el.classList.add("held");
    });
    chipEls[id] = el;
    bank.appendChild(el);
  });
  box.appendChild(bank);
  box.appendChild(wrap);
  return {
    collect: function(){ return {place: place.slice()}; }
  };
};

function seqRenderer(kind){
  return function(ex, box){
    var items = ex.data.items;
    var cur = shuffle(items.map(function(_,i){ return i; }));
    var note = kind === "rank"
      ? "Position 1 is the most severe. Use the arrows to move items."
      : "Put the steps in order. Use the arrows to move items.";
    box.appendChild(h("div","smallnote",note));
    var listEl = h("div","seq");
    function paint(){
      listEl.innerHTML = "";
      cur.forEach(function(id, pos){
        var row = h("div","seqrow");
        row.setAttribute("draggable","true");
        row.appendChild(h("span","pos", String(pos+1)));
        row.appendChild(h("span","txt", items[id].t));
        var up = h("button","btn mv","\u2191"); up.type="button"; up.setAttribute("aria-label","Move up");
        var dn = h("button","btn mv","\u2193"); dn.type="button"; dn.setAttribute("aria-label","Move down");
        up.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === 0){ return; }
          var t = cur[pos-1]; cur[pos-1] = cur[pos]; cur[pos] = t; paint();
        });
        dn.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === cur.length-1){ return; }
          var t = cur[pos+1]; cur[pos+1] = cur[pos]; cur[pos] = t; paint();
        });
        row.appendChild(up); row.appendChild(dn);
        row.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
        row.addEventListener("dragover", function(e){ e.preventDefault(); });
        row.addEventListener("drop", function(e){
          e.preventDefault();
          if(st.graded[st.cur]){ return; }
          var from = parseInt(e.dataTransfer.getData("text/plain"),10);
          if(isNaN(from) || from === pos){ return; }
          var moved = cur.splice(from,1)[0];
          cur.splice(pos,0,moved);
          paint();
        });
        listEl.appendChild(row);
      });
    }
    paint();
    box.appendChild(listEl);
    return {
      collect: function(){ return {seq: cur.slice()}; }
    };
  };
}
RENDER.order = seqRenderer("order");
RENDER.rank = seqRenderer("rank");

RENDER.fill = function(ex, box){
  var slots = ex.data.slots;
  var bankWords = ex.data.bank.map(function(w){ return w; });
  var shuffled = shuffle(bankWords);
  var filled = slots.map(function(){ return null; });
  var held = null;
  box.appendChild(h("div","smallnote","Pick a word from the bank and drop it into a blank. Click a filled blank to put the word back. The bank is shuffled and contains extra words."));
  var textEl = h("div","filltext");
  var bankEl = h("div","bank");
  var text = ex.data.text;
  var parts = text.split(/\{(\d+)\}/);
  function makeBankChip(word){
    var c = makeChip(word, true);
    c.dataset.word = word;
    c.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", word); });
    c.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(held === word){ held = null; c.classList.remove("held"); return; }
      held = word;
      Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
      c.classList.add("held");
    });
    return c;
  }
  function placeWord(si, word){
    if(filled[si] !== null){ bankEl.appendChild(makeBankChip(filled[si])); }
    filled[si] = word;
    held = null;
    Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
    var old = bankEl.querySelector('[data-word="' + word.replace(/"/g,"\\\"") + '"]');
    if(old){ bankEl.removeChild(old); }
    paintText();
  }
  function paintText(){
    textEl.innerHTML = "";
    parts.forEach(function(p, i){
      if(i % 2 === 0){ textEl.appendChild(document.createTextNode(p)); return; }
      (function(si){
        var slot = h("button","slot"); slot.type="button";
        slot.textContent = filled[si] === null ? "blank " + (si+1) : filled[si];
        if(filled[si] !== null){ slot.classList.add("filled"); }
        slot.setAttribute("aria-label","Blank "+(si+1));
        slot.addEventListener("click", function(){
          if(st.graded[st.cur]){ return; }
          if(filled[si] !== null){
            bankEl.appendChild(makeBankChip(filled[si]));
            filled[si] = null; paintText();
          } else if(held !== null){
            placeWord(si, held);
          }
        });
        slot.addEventListener("dragover", function(e){ e.preventDefault(); slot.classList.add("over"); });
        slot.addEventListener("dragleave", function(){ slot.classList.remove("over"); });
        slot.addEventListener("drop", function(e){
          e.preventDefault(); slot.classList.remove("over");
          if(st.graded[st.cur]){ return; }
          var w = e.dataTransfer.getData("text/plain");
          if(w && bankEl.querySelector('[data-word="' + w.replace(/"/g,"\\\"") + '"]')){ placeWord(si, w); }
        });
        textEl.appendChild(slot);
      })(parseInt(p,10));
    });
  }
  shuffled.forEach(function(w){ bankEl.appendChild(makeBankChip(w)); });
  box.appendChild(textEl);
  box.appendChild(h("div","smallnote","Word bank (shuffled):"));
  box.appendChild(bankEl);
  paintText();
  return {
    collect: function(){ return {filled: filled.slice()}; }
  };
};

function linePicker(kind){
  return function(ex, box){
    var multi = !!ex.data.multi;
    if(multi){
      box.appendChild(h("div","smallnote","Select all the lines that apply, then press Check."));
    } else {
      box.appendChild(h("div","smallnote","Click the one line that answers the question, then press Check."));
    }
    var filter = h("input","filterbox");
    filter.type = "text";
    filter.placeholder = kind === "log" ? "Filter lines (like Kibana or Splunk)..." : "Filter lines...";
    filter.setAttribute("aria-label","Filter log lines");
    var picked = [];
    var listEl = h("div", kind === "log" ? "loglines" : "spotlines");
    function rowClick(i){
      if(st.graded[st.cur]){ return; }
      if(multi){
        var p = picked.indexOf(i);
        if(p >= 0){ picked.splice(p,1); } else { picked.push(i); }
        paint();
      } else {
        picked = [i];
        paint();
      }
    }
    function paint(){
      listEl.innerHTML = "";
      ex.data.lines.forEach(function(line, i){
        if(filter.value && String(line).toLowerCase().indexOf(filter.value.toLowerCase()) < 0){ return; }
        if(kind === "log"){
          var row = h("div","logline");
          row.setAttribute("role","button"); row.setAttribute("tabindex","0");
          row.appendChild(h("span","ln", String(i+1)));
          var body = h("span",null,""); body.innerHTML = hlLog(line);
          row.appendChild(body);
          if(picked.indexOf(i) >= 0){ row.classList.add("sel"); }
          row.addEventListener("click", function(){ rowClick(i); });
          row.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); rowClick(i); } });
          listEl.appendChild(row);
        } else {
          var b = h("button","spotline"); b.type="button";
          b.textContent = line;
          if(picked.indexOf(i) >= 0){ b.classList.add("sel"); }
          b.addEventListener("click", function(){ rowClick(i); });
          listEl.appendChild(b);
        }
      });
      if(!listEl.children.length){
        listEl.appendChild(h("div","logline","(no lines match the filter)"));
      }
    }
    filter.addEventListener("input", paint);
    box.appendChild(filter);
    box.appendChild(listEl);
    paint();
    return {
      collect: function(){ return {picked: picked.slice().sort()}; }
    };
  };
}
RENDER.logview = linePicker("log");
RENDER.spot = linePicker("spot");

/* ---------- graders ---------- */
var GRADER = {};
function itemLists(ex){ return ex; }

GRADER.qcm = function(ex, ans){
  var picked = ans.picked;
  var ok = picked !== null && picked !== undefined && ex.data.options[picked] && ex.data.options[picked].correct;
  var correctText = "";
  ex.data.options.forEach(function(o){ if(o.correct){ correctText = o.t; } });
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: correctText,
    correctWhy: (function(){ var w=""; ex.data.options.forEach(function(o){ if(o.correct){ w = o.why||""; } }); return w; })()};
};

GRADER.multi = function(ex, ans){
  var sel = ans.sel || [];
  var c=0,w=0, right=[],wrong=[],missed=[];
  ex.data.options.forEach(function(o, oi){
    var chosen = sel.indexOf(oi) >= 0;
    if(o.correct){ if(chosen){ c++; right.push({label:o.t, why:o.why||""}); } else { missed.push({label:o.t, why:o.why||""}); } }
    else if(chosen){ w++; wrong.push({label:o.t, why:o.why||""}); }
  });
  return {c:c, w:w, t:right.length+missed.length, select:true, right:right, wrong:wrong, missed:missed};
};

GRADER.match = function(ex, ans){
  var zones = ex.data.zones;
  var flat = [];
  zones.forEach(function(z, zi){ z.items.forEach(function(it){ flat.push({t:it.t, why:it.why||"", zi:zi}); }); });
  var c=0, right=[],wrong=[],missed=[];
  flat.forEach(function(it, i){
    var p = ans.place[i];
    if(p === it.zi){ c++; right.push({label:it.t, why:it.why || "Correctly placed in \u201C" + zones[it.zi].label + "\u201D."}); }
    else if(typeof p === "number" && p >= 0){ wrong.push({label:it.t, why:"You placed it in \u201C" + zones[p].label + "\u201D. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
    else { missed.push({label:it.t, why:"You left it in the bank. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
  });
  return {c:c, w:0, t:flat.length, select:false, right:right, wrong:wrong, missed:missed};
};

function seqGrader(ex, ans){
  var n = ex.data.items.length;
  var c=0, right=[],wrong=[],missed=[];
  for(var p=0;p<n;p++){
    var id = ans.seq[p];
    if(typeof id !== "number" || id < 0 || id >= n){
      missed.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."});
      continue;
    }
    if(id === p){ c++; right.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."}); }
    else { wrong.push({label: ex.data.items[id].t, why:"You put it at position " + (p+1) + ". It belongs at position " + (id+1) + ". " + (ex.data.items[id].why || "")}); }
  }
  return {c:c, w:0, t:n, select:false, right:right, wrong:wrong, missed:missed};
}
GRADER.order = seqGrader;
GRADER.rank = seqGrader;

GRADER.fill = function(ex, ans){
  var slots = ex.data.slots;
  var why = ex.data.slotWhy || slots.map(function(){ return ""; });
  var c=0, right=[],wrong=[],missed=[];
  slots.forEach(function(s, i){
    var f = ans.filled[i];
    if(f === s){ c++; right.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
    else if(f){ wrong.push({label:"Blank " + (i+1) + ": you chose \u201C" + f + "\u201D", why:"The correct word is \u201C" + s + "\u201D. " + why[i]}); }
    else { missed.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
  });
  return {c:c, w:0, t:slots.length, select:false, right:right, wrong:wrong, missed:missed};
};

function pickGrader(ex, ans){
  var pick = ex.data.pick;
  if(ex.data.multi){
    var sel = ans.picked || [];
    var c=0,w=0, right=[],wrong=[],missed=[];
    pick.forEach(function(i){ if(sel.indexOf(i) >= 0){ c++; right.push({label:ex.data.lines[i], why:ex.data.lineWhy ? ex.data.lineWhy[pick.indexOf(i)] || "" : ""}); } else { missed.push({label:ex.data.lines[i], why:"This line is part of the answer." + (ex.data.lineWhy ? " " + (ex.data.lineWhy[pick.indexOf(i)] || "") : "")}); } });
    sel.forEach(function(i){ if(pick.indexOf(i) < 0){ w++; wrong.push({label:ex.data.lines[i], why:ex.data.wrongWhy && ex.data.wrongWhy[i] ? ex.data.wrongWhy[i] : "This line does not answer the question."}); } });
    return {c:c, w:w, t:pick.length, select:true, right:right, wrong:wrong, missed:missed};
  }
  var ok = ans.picked && ans.picked.length === 1 && ans.picked[0] === pick[0];
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: ex.data.lines[pick[0]],
    correctWhy: ex.data.lineWhy ? (ex.data.lineWhy[0] || "") : ""};
}
GRADER.logview = pickGrader;
GRADER.spot = pickGrader;

GRADER.triage = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.alerts.forEach(function(a, i){
    var ch = ans.choice[i];
    var label = "Alert " + (i+1) + (a.tag ? " (" + a.tag + ")" : "") + " \u2192 " + ex.data.actions[a.correct];
    if(ch === a.correct){ c++; right.push({label:label, why:a.why || ""}); }
    else if(ch !== null && ch !== undefined){ wrong.push({label:"Alert " + (i+1) + ": you chose \u201C" + ex.data.actions[ch] + "\u201D", why:"Correct: \u201C" + ex.data.actions[a.correct] + "\u201D. " + (a.why || "")}); }
    else { missed.push({label:label, why:a.why || ""}); }
  });
  return {c:c, w:0, t:ex.data.alerts.length, select:false, right:right, wrong:wrong, missed:missed};
};

GRADER.term = function(ex, ans){
  var d = ex.data;
  var cmd = normCmdMatch(ans.cmd);
  var c=0, w=0, forb=[], missReq=[];
  (d.required||[]).forEach(function(r){ if(new RegExp(r,"i").test(cmd)){ c++; } else { missReq.push(r); } });
  (d.forbidden||[]).forEach(function(f){ if(new RegExp(f.re,"i").test(cmd)){ w++; forb.push(f); } });
  return {c:c, w:w, t:(d.required||[]).length, select:true,
    term:{cmd:ans.cmd, canonical:d.canonical, parts:d.parts||[], forb:forb, missReq:missReq, matched: c === (d.required||[]).length && w === 0},
    right:[], wrong:[], missed:[]};
};

GRADER.branch = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.steps.forEach(function(s, i){
    var chosen = ans.sel[i];
    var correctIdx = -1;
    s.options.forEach(function(o, oi){ if(o.correct){ correctIdx = oi; } });
    var correctText = correctIdx >= 0 ? s.options[correctIdx].t : "";
    var correctWhy = correctIdx >= 0 ? (s.options[correctIdx].why || "") : "";
    if(chosen === correctIdx){ c++; right.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
    else if(chosen !== null && chosen !== undefined){
      wrong.push({label:"Step " + (i+1) + ": you chose \u201C" + s.options[chosen].t + "\u201D",
        why:"Correct: \u201C" + correctText + "\u201D. " + correctWhy + (s.options[chosen].why ? " Your pick: " + s.options[chosen].why : "")});
    }
    else { missed.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
  });
  return {c:c, w:0, t:ex.data.steps.length, select:false, right:right, wrong:wrong, missed:missed};
};

/* ---------- feedback ---------- */
function statusOf(pts){
  if(pts === 100){ return STATUS.correct; }
  if(pts >= 1){ return STATUS.partial; }
  return STATUS.incorrect;
}
function renderFeedbackInto(ex, g, reenter){
  var old = document.querySelector(".fb");
  if(old){ old.parentNode.removeChild(old); }
  var stt = statusOf(g.points);
