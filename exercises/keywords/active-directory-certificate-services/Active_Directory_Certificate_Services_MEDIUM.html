/* ---------- graders ---------- */
var GRADER = {};
function itemLists(ex){ return ex; }

GRADER.qcm = function(ex, ans){
  var picked = ans.picked;
  var ok = picked !== null && picked !== undefined && ex.data.options[picked] && ex.data.options[picked].correct;
  var correctText = "";
  ex.data.options.forEach(function(o){ if(o.correct){ correctText = o.t; } });
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: correctText,
    correctWhy: (function(){ var w=""; ex.data.options.forEach(function(o){ if(o.correct){ w = o.why||""; } }); return w; })()};
};

GRADER.multi = function(ex, ans){
  var sel = ans.sel || [];
  var c=0,w=0, right=[],wrong=[],missed=[];
  ex.data.options.forEach(function(o, oi){
    var chosen = sel.indexOf(oi) >= 0;
    if(o.correct){ if(chosen){ c++; right.push({label:o.t, why:o.why||""}); } else { missed.push({label:o.t, why:o.why||""}); } }
    else if(chosen){ w++; wrong.push({label:o.t, why:o.why||""}); }
  });
  return {c:c, w:w, t:right.length+missed.length, select:true, right:right, wrong:wrong, missed:missed};
};

GRADER.match = function(ex, ans){
  var zones = ex.data.zones;
  var flat = [];
  zones.forEach(function(z, zi){ z.items.forEach(function(it){ flat.push({t:it.t, why:it.why||"", zi:zi}); }); });
  var c=0, right=[],wrong=[],missed=[];
  flat.forEach(function(it, i){
    var p = ans.place[i];
    if(p === it.zi){ c++; right.push({label:it.t, why:it.why || "Correctly placed in \u201C" + zones[it.zi].label + "\u201D."}); }
    else if(typeof p === "number" && p >= 0){ wrong.push({label:it.t, why:"You placed it in \u201C" + zones[p].label + "\u201D. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
    else { missed.push({label:it.t, why:"You left it in the bank. It belongs in \u201C" + zones[it.zi].label + "\u201D. " + it.why}); }
  });
  return {c:c, w:0, t:flat.length, select:false, right:right, wrong:wrong, missed:missed};
};

function seqGrader(ex, ans){
  var n = ex.data.items.length;
  var c=0, right=[],wrong=[],missed=[];
  for(var p=0;p<n;p++){
    var id = ans.seq[p];
    if(typeof id !== "number" || id < 0 || id >= n){
      missed.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."});
      continue;
    }
    if(id === p){ c++; right.push({label:"Position " + (p+1) + ": " + ex.data.items[p].t, why:ex.data.items[p].why || "Correct position."}); }
    else { wrong.push({label: ex.data.items[id].t, why:"You put it at position " + (p+1) + ". It belongs at position " + (id+1) + ". " + (ex.data.items[id].why || "")}); }
  }
  return {c:c, w:0, t:n, select:false, right:right, wrong:wrong, missed:missed};
}
GRADER.order = seqGrader;
GRADER.rank = seqGrader;

GRADER.fill = function(ex, ans){
  var slots = ex.data.slots;
  var why = ex.data.slotWhy || slots.map(function(){ return ""; });
  var c=0, right=[],wrong=[],missed=[];
  slots.forEach(function(s, i){
    var f = ans.filled[i];
    if(f === s){ c++; right.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
    else if(f){ wrong.push({label:"Blank " + (i+1) + ": you chose \u201C" + f + "\u201D", why:"The correct word is \u201C" + s + "\u201D. " + why[i]}); }
    else { missed.push({label:"Blank " + (i+1) + ": " + s, why:why[i]}); }
  });
  return {c:c, w:0, t:slots.length, select:false, right:right, wrong:wrong, missed:missed};
};

function pickGrader(ex, ans){
  var pick = ex.data.pick;
  if(ex.data.multi){
    var sel = ans.picked || [];
    var c=0,w=0, right=[],wrong=[],missed=[];
    pick.forEach(function(i){ if(sel.indexOf(i) >= 0){ c++; right.push({label:ex.data.lines[i], why:ex.data.lineWhy ? ex.data.lineWhy[pick.indexOf(i)] || "" : ""}); } else { missed.push({label:ex.data.lines[i], why:"This line is part of the answer." + (ex.data.lineWhy ? " " + (ex.data.lineWhy[pick.indexOf(i)] || "") : "")}); } });
    sel.forEach(function(i){ if(pick.indexOf(i) < 0){ w++; wrong.push({label:ex.data.lines[i], why:ex.data.wrongWhy && ex.data.wrongWhy[i] ? ex.data.wrongWhy[i] : "This line does not answer the question."}); } });
    return {c:c, w:w, t:pick.length, select:true, right:right, wrong:wrong, missed:missed};
  }
  var ok = ans.picked && ans.picked.length === 1 && ans.picked[0] === pick[0];
  return {c: ok?1:0, w:0, t:1, select:false, single:true,
    correctText: ex.data.lines[pick[0]],
    correctWhy: ex.data.lineWhy ? (ex.data.lineWhy[0] || "") : ""};
}
GRADER.logview = pickGrader;
GRADER.spot = pickGrader;

GRADER.triage = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.alerts.forEach(function(a, i){
    var ch = ans.choice[i];
    var label = "Alert " + (i+1) + (a.tag ? " (" + a.tag + ")" : "") + " \u2192 " + ex.data.actions[a.correct];
    if(ch === a.correct){ c++; right.push({label:label, why:a.why || ""}); }
    else if(ch !== null && ch !== undefined){ wrong.push({label:"Alert " + (i+1) + ": you chose \u201C" + ex.data.actions[ch] + "\u201D", why:"Correct: \u201C" + ex.data.actions[a.correct] + "\u201D. " + (a.why || "")}); }
    else { missed.push({label:label, why:a.why || ""}); }
  });
  return {c:c, w:0, t:ex.data.alerts.length, select:false, right:right, wrong:wrong, missed:missed};
};

GRADER.term = function(ex, ans){
  var d = ex.data;
  var cmd = normCmdMatch(ans.cmd);
  var c=0, w=0, forb=[], missReq=[];
  (d.required||[]).forEach(function(r){ if(new RegExp(r,"i").test(cmd)){ c++; } else { missReq.push(r); } });
  (d.forbidden||[]).forEach(function(f){ if(new RegExp(f.re,"i").test(cmd)){ w++; forb.push(f); } });
  return {c:c, w:w, t:(d.required||[]).length, select:true,
    term:{cmd:ans.cmd, canonical:d.canonical, parts:d.parts||[], forb:forb, missReq:missReq, matched: c === (d.required||[]).length && w === 0},
    right:[], wrong:[], missed:[]};
};

GRADER.branch = function(ex, ans){
  var c=0, right=[],wrong=[],missed=[];
  ex.data.steps.forEach(function(s, i){
    var chosen = ans.sel[i];
    var correctIdx = -1;
    s.options.forEach(function(o, oi){ if(o.correct){ correctIdx = oi; } });
    var correctText = correctIdx >= 0 ? s.options[correctIdx].t : "";
    var correctWhy = correctIdx >= 0 ? (s.options[correctIdx].why || "") : "";
    if(chosen === correctIdx){ c++; right.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
    else if(chosen !== null && chosen !== undefined){
      wrong.push({label:"Step " + (i+1) + ": you chose \u201C" + s.options[chosen].t + "\u201D",
        why:"Correct: \u201C" + correctText + "\u201D. " + correctWhy + (s.options[chosen].why ? " Your pick: " + s.options[chosen].why : "")});
    }
    else { missed.push({label:"Step " + (i+1) + ": " + correctText, why:correctWhy}); }
  });
  return {c:c, w:0, t:ex.data.steps.length, select:false, right:right, wrong:wrong, missed:missed};
};

/* ---------- feedback ---------- */
function statusOf(pts){
  if(pts === 100){ return STATUS.correct; }
  if(pts >= 1){ return STATUS.partial; }
  return STATUS.incorrect;
}
function renderFeedbackInto(ex, g, reenter){
  var old = document.querySelector(".fb");
  if(old){ old.parentNode.removeChild(old); }
  var stt = statusOf(g.points);
  var sec = h("section","card fb " + stt.cls);
  var head = h("div","fbhead");
  head.appendChild(h("span","cicon", stt.icon));
  head.appendChild(h("span",null, stt.word));
  sec.appendChild(head);
  sec.appendChild(h("div","fbpts", "You earned " + g.points + " out of 100 points on this exercise."));
  if(g.term){
    var t = g.term;
    sec.appendChild(h("div","smallnote","Canonical command:"));
    sec.appendChild(codeBlock(t.canonical, true));
    var ul = h("ul",null);
    t.parts.forEach(function(p){ var li = h("li",null); var c = h("code",null,p.text); li.appendChild(c); li.appendChild(document.createTextNode(" \u2014 " + p.why)); ul.appendChild(li); });
    sec.appendChild(ul);
    if(t.forb.length){
      var dw = h("div","fblist");
      dw.appendChild(h("div","lt lt-bad","Close but dangerous \u2014 teaching moment"));
      t.forb.forEach(function(f){
        dw.appendChild(h("div",null,"\u26A0 " + f.why));
      });
      sec.appendChild(dw);
    }
    if(t.matched && t.forb.length === 0){
      sec.appendChild(h("div","smallnote","Your command contains every required part and nothing forbidden."));
    }
  } else if(g.single){
    sec.appendChild(h("div","smallnote","Correct answer: " + g.correctText));
    if(g.correctWhy){ sec.appendChild(h("p",null,g.correctWhy)); }
  } else {
    function block(title, items, cls){
      if(!items.length){ return; }
      var d = h("div","fblist");
      d.appendChild(h("div","lt " + cls, title));
      var ul = h("ul",null);
      items.forEach(function(it){ var li = h("li",null); li.appendChild(document.createTextNode(it.label + (it.why ? " \u2014 " + it.why : ""))); ul.appendChild(li); });
      d.appendChild(ul);
      sec.appendChild(d);
    }
    block("What you got right", g.right, "lt-good");
    block("What you got wrong", g.wrong, "lt-bad");
    block("What you missed", g.missed, "lt-miss");
    if(g.points >= 1 && g.points <= 99){
      sec.appendChild(h("div","encourage","Partial credit is intentional. In real cybersecurity work, getting some things right and some wrong is normal. The exam rewards the parts you got right."));
    }
  }
  if(ex.explain){ sec.appendChild(h("p",null, ex.explain)); }
  if(ex.study){ sec.appendChild(h("div","study", "What to study next: " + ex.study)); }
  var foot = document.querySelector(".foot");
  if(foot && foot.parentNode){ foot.parentNode.insertBefore(sec, foot); }
  else { $("stage").appendChild(sec); }
  $("btn-check").disabled = true;
  $("btn-next").disabled = false;
}

/* ---------- review skipped screen ---------- */
function openReview(){
  if(skippedCount() === 0 || st.phase === "results"){ return; }
  st.phase = "review";
  st.timer.auto = false;   /* opening the review screen releases the auto-pause */
  stopCountdown();
  clearStage();
  var stage = $("stage");
  var sec = h("section","card");
  sec.appendChild(h("div","h2","\u26A0 Review skipped exercises"));
  sec.appendChild(h("p",null,"These exercises are skipped and not answered. You can return to each one as many times as you need, as long as the timer has not ended. If you finish the exam without answering them, they are excluded from the score: they add nothing to your points and nothing to the maximum."));
  var list = h("div",null);
  Object.keys(st.skipped).forEach(function(k){
    if(st.graded[k]){ return; }
    var ex = E.exercises[k];
    var it = h("div","revitem");
    var ri = h("div","ri");
    ri.appendChild(h("div","rt", ex.title));
    ri.appendChild(h("div","rs", ex.theme + " \u2014 " + ex.scenario.summary));
    it.appendChild(ri);
    var b = h("button","btn primary","Answer this"); b.type="button";
    b.addEventListener("click", function(){ st.phase = "exam"; st.fromReview = true; showExercise(parseInt(k,10)); });
    it.appendChild(b);
    list.appendChild(it);
  });
  sec.appendChild(list);
  var foot = h("div","foot");
  var back = h("button","btn","\u2190 Back to the exam"); back.type="button";
  back.addEventListener("click", function(){ st.phase = "exam"; st.fromReview = false; showExercise(st.order[st.pos]); });
  var fin = h("button","btn danger","Finish exam \u2014 leave " + skippedCount() + " unanswered (excluded)"); fin.type="button";
  fin.addEventListener("click", function(){ endExam("submit"); });
  foot.appendChild(back); foot.appendChild(fin);
  sec.appendChild(foot);
  stage.appendChild(sec);
  updateHeader();
  window.scrollTo(0,0);
}

/* ---------- results ---------- */
function endExam(reason){
  if(st.finished){ return; }
  st.finished = true;
  st.phase = "results";
  stopCountdown();
  st.timer.manual = false;
  renderResults(reason);
}
function renderResults(reason){
  clearStage();
  var stage = $("stage");
  var earned = 0, poss = 0, nFull = 0, nPart = 0, nNo = 0, nSkip = 0;
  Object.keys(st.graded).forEach(function(k){
    var p = st.graded[k].points;
    earned += p; poss += 100;
    if(p === 100){ nFull++; } else if(p >= 1){ nPart++; } else { nNo++; }
  });
  var totalEx = E.exercises.length;
  var nSkippedLeft = totalEx - Object.keys(st.graded).length;
  var percent = poss > 0 ? Math.round(earned / poss * 100) : 0;
  var passed = percent >= E.meta.passMark;

  var sec = h("section","card");
  sec.appendChild(h("div","h2","\u25B6 Final results" + (reason === "time" ? " \u2014 time is over" : "")));
  var ring = h("div","ring"); ring.style.setProperty("--pct", String(percent));
  var rin = h("div","in");
  rin.appendChild(h("div","pctv", percent + "%"));
  rin.appendChild(h("div",null,"pass mark " + E.meta.passMark + "%"));
  ring.appendChild(rin);
  sec.appendChild(ring);
  if(passed){
    var pp = h("div","passpanel");
    pp.appendChild(h("div","fbhead",null));
    pp.querySelector(".fbhead").textContent = "\u2713 PASS \u2014 well done";
    pp.appendChild(h("p",null,"You reached " + percent + "% (" + earned + " of " + poss + " points over answered exercises). This is at or above the " + E.meta.passMark + "% pass mark of this " + E.sevLabel + " exam."));
    pp.appendChild(h("p",null,"Breakdown: " + nFull + " fully correct, " + nPart + " partially correct, " + nNo + " fully incorrect, " + nSkippedLeft + " not answered (excluded)."));
    sec.appendChild(pp);
  } else {
    var fp = h("div","failpanel");
    fp.appendChild(h("div","fbhead",null));
    fp.querySelector(".fbhead").textContent = "\u2717 NOT PASSED \u2014 you must retake this exam";
    fp.appendChild(h("p",null,"You reached " + percent + "% (" + earned + " of " + poss + " points over answered exercises). The pass mark is " + E.meta.passMark + "%."));
    fp.appendChild(h("p",null,"Breakdown: " + nFull + " fully correct, " + nPart + " partially correct, " + nNo + " fully incorrect, " + nSkippedLeft + " not answered (excluded)."));
    sec.appendChild(fp);
  }
  var grid = h("div","statgrid");
  function stat(n, l, cls){
    var s = h("div","stat"); var nv = h("div","n " + (cls||""), String(n)); s.appendChild(nv); s.appendChild(h("div","l",l)); return s;
  }
  grid.appendChild(stat(earned + " / " + poss, "points earned / possible (answered only)"));
  grid.appendChild(stat(nFull, "fully correct (\u2713 100 points)", "st-ok"));
  grid.appendChild(stat(nPart, "partially correct (\u25D0 1\u201399 points)", "st-part"));
  grid.appendChild(stat(nNo, "fully incorrect (\u2717 0 points)", "st-no"));
  grid.appendChild(stat(nSkippedLeft, "skipped and never answered (\u26A0 excluded)", "st-skip"));
  sec.appendChild(grid);

  /* per-theme breakdown */
  var themes = {};
  Object.keys(st.graded).forEach(function(k){
    var ex = E.exercises[k];
    if(!themes[ex.theme]){ themes[ex.theme] = {e:0, p:0, n:0}; }
    themes[ex.theme].e += st.graded[k].points;
    themes[ex.theme].p += 100;
    themes[ex.theme].n += 1;
  });
  var tt = h("table","themetable");
  var tr1 = h("tr",null);
  ["Theme","Answered","Points earned","Points possible"].forEach(function(x){ var th = h("th",null,x); tr1.appendChild(th); });
  tt.appendChild(tr1);
  Object.keys(themes).sort().forEach(function(name){
    var t = themes[name];
    var tr = h("tr",null);
    [name, String(t.n), t.e + " / " + t.p, String(t.p)].forEach(function(x){ tr.appendChild(h("td",null,x)); });
    tt.appendChild(tr);
  });
  sec.appendChild(h("div","h2","Per-theme breakdown (answered exercises only)"));
  sec.appendChild(tt);
  stage.appendChild(sec);

  /* detailed report */
  var rep = h("section","card");
  rep.appendChild(h("div","h2","Detailed report \u2014 every exercise"));
  st.order.forEach(function(k, i){
    var ex = E.exercises[k];
    var g = st.graded[k];
    var item = h("div","repitem");
    var hd = h("div","rephd");
    hd.setAttribute("role","button"); hd.setAttribute("tabindex","0");
    hd.appendChild(h("span",null,(i+1) + "."));
    hd.appendChild(h("span","rp", ex.title));
    if(g){
      var stt = statusOf(g.points);
      var chip = h("span","stchip " + (stt === STATUS.correct ? "st-ok" : stt === STATUS.partial ? "st-part" : "st-no"), stt.icon + " " + g.points + "/100");
      hd.appendChild(chip);
    } else {
      hd.appendChild(h("span","stchip st-skip","\u26A0 Not answered \u2014 excluded from score"));
    }
    hd.appendChild(h("span","rs", ex.theme));
    var bd = h("div","repbd");
    if(g){
      if(g.term){
        bd.appendChild(h("div","smallnote","Canonical command:"));
        bd.appendChild(codeBlock(g.term.canonical, true));
        var ul2 = h("ul",null);
        g.term.parts.forEach(function(p){ var li = h("li",null); var c = h("code",null,p.text); li.appendChild(c); li.appendChild(document.createTextNode(" \u2014 " + p.why)); ul2.appendChild(li); });
        bd.appendChild(ul2);
      } else if(g.single){
        bd.appendChild(h("div",null,"Correct answer: " + g.correctText));
        if(g.correctWhy){ bd.appendChild(h("p",null,g.correctWhy)); }
      } else {
        [["Right:", g.right, "lt-good"],["Wrong:", g.wrong, "lt-bad"],["Missed:", g.missed, "lt-miss"]].forEach(function(trio){
          if(trio[1].length){
            var lt = h("div","lt " + trio[2], trio[0]);
            bd.appendChild(lt);
            var ul3 = h("ul",null);
            trio[1].forEach(function(it){ var li = h("li",null); li.textContent = it.label + (it.why ? " \u2014 " + it.why : ""); ul3.appendChild(li); });
            bd.appendChild(ul3);
          }
        });
      }
      if(ex.explain){ bd.appendChild(h("p",null,ex.explain)); }
      if(ex.study){ bd.appendChild(h("div","study","What to study next: " + ex.study)); }
    } else {
      bd.appendChild(h("p",null,"You skipped this exercise and never answered it. It is excluded from both your points and the maximum."));
      try{
        var eg = GRADER[ex.type](ex, emptyAnsFor(ex.type));
        if(eg.single && eg.correctText){ bd.appendChild(h("div",null,"Correct answer: " + eg.correctText)); if(eg.correctWhy){ bd.appendChild(h("p",null,eg.correctWhy)); } }
        if(eg.term && eg.term.canonical){ bd.appendChild(h("div","smallnote","Canonical command:")); bd.appendChild(codeBlock(eg.term.canonical, true)); }
        if(eg.missed && eg.missed.length && !eg.single){
          var lt = h("div","lt lt-miss","Correct items:");
          bd.appendChild(lt);
          var uls = h("ul",null);
          eg.missed.forEach(function(it2){ var li2 = h("li",null); li2.textContent = it2.label + (it2.why ? " \u2014 " + it2.why : ""); uls.appendChild(li2); });
          bd.appendChild(uls);
        }
      }catch(e2){}
      if(ex.explain){ bd.appendChild(h("p",null,ex.explain)); }
      if(ex.study){ bd.appendChild(h("div","study","What to study next: " + ex.study)); }
    }
    item.appendChild(hd);
    item.appendChild(bd);
    function toggle(){ item.classList.toggle("open"); }
    hd.addEventListener("click", toggle);
    hd.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
    rep.appendChild(item);
  });
  stage.appendChild(rep);

  var foot = h("div","foot");
  var rt = h("button","btn primary","\u21BA Retake exam"); rt.type="button";
  rt.addEventListener("click", retake);
  foot.appendChild(rt);
  stage.appendChild(foot);

  if(st.user){ sec.insertBefore(h("div","smallnote","Candidate: " + st.user), sec.firstChild); }
  updateHeader();
  window.scrollTo(0,0);
  if(!st.reported){
    st.reported = true;
    reportScore(earned, poss);
  }
}

function reportScore(pointsEarned, pointsPossible){
  var percent = pointsPossible > 0 ? Math.round((pointsEarned / pointsPossible) * 100) : 0;
  try{
    parent.postMessage({
      type: "CYBERPULSE_SCORE",
      topicId: E.meta.topicId,
      batch: E.meta.batch,
      score: pointsEarned,
      total: pointsPossible,
      percent: percent,
      passed: percent >= E.meta.passMark
    }, location.origin);
  }catch(e){ /* opened directly, not inside the site: nothing to report to */ }
}

/* ---------- retake ---------- */
function emptyAnsFor(type){
  switch(type){
    case "qcm": return {picked:null};
    case "multi": return {sel:[]};
    case "match": return {place:[]};
    case "order": case "rank": return {seq:[]};
    case "fill": return {filled:[]};
    case "logview": case "spot": return {picked:[]};
    case "triage": return {choice:[]};
    case "term": return {cmd:""};
    case "branch": return {sel:[]};
  }
  return {};
}
function retake(){
  st.graded = {}; st.ans = {}; st.hint = {}; st.skipped = {};
  st.fromReview = false; st.reported = false; st.finished = false;
  st.timer.left = st.timer.total; st.timer.manual = false; st.timer.auto = false;
  st.order = shuffle(E.exercises.map(function(_,i){ return i; }));
  st.pos = 0;
  $("overlay").classList.add("hidden");
  startExam();
}

/* ---------- intro ---------- */
function renderIntro(){
  st.phase = "intro";
  clearStage();
  var stage = $("stage");
  var sec = h("section","card");
  var head = h("div",null);
  var badge = h("span","badge sev-"+E.sevKey, E.sevLabel);

   ["\u2611 " + E.exercises.length + " exercises, 100 points each"],

      var ul = h("ul","rules");
      block.list.forEach(function(x){ ul.appendChild(h("li",null,x)); });
      sec.appendChild(ul);
    }
  });
  sec.appendChild(h("div","h2","Keywords covered in this topic (all four severity tiers)"));
  E.themes.forEach(function(t){
    var tb = h("div","themebox");
    tb.appendChild(h("div","th", t[0]));
    var cs = h("div","concepts");

    tb.appendChild(cs);
    sec.appendChild(tb);
  });
  var sb = h("button","btn go bigstart","\u25B6 Start the exam"); sb.type="button";
  sb.addEventListener("click", startExam);
  sec.appendChild(sb);
  stage.appendChild(sec);
  updateHeader();
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
function startExam(){
  if(!st.order.length){
    st.order = shuffle(E.exercises.map(function(_,i){ return i; }));
    st.pos = 0;
  }
  st.phase = "exam";
  showExercise(st.order[st.pos]);
}

window.addEventListener("message", function(event){
  if(!event.data){ return; }
  if(event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT"){ return; }
  try{
    if(event.data.username){ st.user = String(event.data.username); }
  }catch(e){}
});

document.addEventListener("DOMContentLoaded", function(){
  buildHeader();
  buildOverlay();
  renderIntro();
});
})();
