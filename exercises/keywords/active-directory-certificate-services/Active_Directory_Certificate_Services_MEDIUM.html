<style>

:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#111a2c; --panel2:#0d1524; --line:#22304a;
  --txt:#e6edf7; --mut:#a8b3c7; --blue:#4da3ff; --amber:#ffb454; --green:#3ddc97;
  --orange:#ff8a4c; --red:#ff5c72; --grey:#9aa7b8; --cyan:#5fd4e6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 20% -10%, #12203a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt);
  font:16px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:1000px;margin:0 auto;padding:0 14px 60px;}
.hidden{display:none !important;}
/* ---------- sticky exam header ---------- */
.bar{
  position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  background:rgba(13,21,36,.96);border:1px solid var(--line);border-radius:0 0 12px 12px;
  padding:10px 12px;margin:0 -14px 14px;backdrop-filter:blur(4px);
}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bar .spacer{flex:1 1 auto;}
.badge{
  display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;
  letter-spacing:.4px;color:#08101e;border:1px solid rgba(255,255,255,.25);
}
.sev-easy{background:var(--green);}
.sev-medium{background:var(--amber);}
.sev-hard{background:var(--orange);}
.sev-xhard{background:var(--red);}
.counter{font-weight:700;font-size:15px;}
.timerbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;}
.timerbox .tval{font-weight:700;font-size:16px;}
.tmode{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);}
.tmode-run{color:#0a1a12;background:var(--green);}
.tmode-manual{color:#1d1405;background:var(--amber);}
.tmode-auto{color:#0a1626;background:var(--cyan);}
.tmode-ready{color:var(--mut);}
.scorebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;}
.btn{
  min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;cursor:pointer;
  background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:600;font-size:14.5px;
}
.btn:hover:not(:disabled){border-color:var(--blue);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04101f;}
.btn.go{background:var(--green);border-color:var(--green);color:#04140c;}
.btn.warn{border-color:var(--amber);color:var(--amber);}
.btn.danger{border-color:var(--red);color:var(--red);}
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
/* ---------- cards & the three contract blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
.cardhead{
  display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1.2px;font-size:14px;
  text-transform:uppercase;margin-bottom:10px;
}
.cicon{display:inline-flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--line);background:var(--panel2);}
.scen{border-left:5px solid var(--blue);background:linear-gradient(180deg,#101c33,#111a2c);}
.scenhead{color:var(--blue);}
.qblock{border-left:5px solid var(--amber);background:linear-gradient(180deg,#1d1a10,#111a2c);}
.qblock .cardhead{color:var(--amber);}
.ansblock{border-left:5px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);}
.ansblock .cardhead{color:var(--green);}
.qtext{font-weight:700;font-size:17px;}
.smallnote{color:var(--mut);font-size:14px;margin:4px 0 10px;}
.divider{height:1px;background:var(--line);margin:14px 0;border:0;}
.art{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
.art-label{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;}
.art p{margin:6px 0;}
pre.code{
  font:14.5px/1.5 Consolas,"Courier New",monospace;background:#0a111f;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;overflow-x:auto;margin:6px 0;color:#d7e3f4;white-space:pre;
}
.collapsebtn{margin-left:auto;min-height:44px;padding:4px 12px;border-radius:8px;font-size:12.5px;}
.scensummary{color:var(--mut);font-size:13.5px;font-style:italic;}
/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:48px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  color:var(--txt);font-size:15.5px;cursor:pointer;
}
.opt:hover{border-color:var(--blue);}
.opt.sel{border-color:var(--green);background:#10241c;}
.opt .optlbl{font-weight:800;color:var(--cyan);flex:0 0 auto;}
.opt .opttxt{flex:1;}
.opt.picked-good{border-color:var(--green);}
.opt.picked-bad{border-color:var(--red);}
.opt.show-good{border-color:var(--green);}
/* ---------- drag & drop / matching ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.chip{
  min-height:44px;padding:8px 14px;border-radius:10px;background:#182540;
  border:1px solid var(--line);cursor:grab;font-size:14.5px;color:var(--txt);
}
.chip.held{border-color:var(--amber);background:#2a2413;}
.chip.used{opacity:.35;cursor:default;}
.zonewrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.zonerow{display:grid;grid-template-columns:minmax(140px,240px) 1fr;gap:8px;align-items:stretch;}
.zonelabel{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;}
.zone{
  min-height:52px;border:1.5px dashed #33486e;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;background:#0c1424;
}
.zone.over{border-color:var(--amber);}
.zone .chip{cursor:pointer;}
/* ---------- ordering / ranking ---------- */
.seq{display:flex;flex-direction:column;gap:6px;}
.seqrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;}
.seqrow .pos{flex:0 0 34px;text-align:center;font-weight:800;color:var(--cyan);}
.seqrow .txt{flex:1;font-size:15px;}
.seqrow .mv{min-height:44px;min-width:44px;padding:4px 8px;border-radius:8px;}
/* ---------- fill in the blank ---------- */
.filltext{font-size:16px;line-height:2;}
.slot{
  display:inline-block;min-width:120px;min-height:38px;border:1.5px dashed #33486e;border-radius:8px;
  background:#0c1424;color:var(--cyan);font-weight:700;padding:4px 10px;margin:0 4px;vertical-align:middle;cursor:pointer;
}
.slot.filled{border-style:solid;border-color:var(--green);}
.slot.over{border-color:var(--amber);}
/* ---------- log viewer ---------- */
.filterbox{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:8px 12px;font-size:14.5px;margin-bottom:8px;}
.loglines{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0a111f;}
.logline{
  display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #16223a;cursor:pointer;
  font:14px/1.5 Consolas,"Courier New",monospace;align-items:flex-start;
}
.logline:hover{background:#101b30;}
.logline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
.logline .ln{color:#5b6b85;flex:0 0 auto;min-width:26px;}
.t-stamp{color:var(--amber);}
.t-eid{color:var(--cyan);font-weight:700;}
.t-acct{color:#b7c9ff;}
/* ---------- spot the line ---------- */
.spotlines{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.spotline{
  display:block;width:100%;text-align:left;background:#0a111f;border:0;border-bottom:1px solid #16223a;
  color:#d7e3f4;font:14.5px/1.5 Consolas,"Courier New",monospace;padding:9px 12px;cursor:pointer;white-space:pre-wrap;
}
.spotline:hover{background:#101b30;}
.spotline.sel{background:#12314a;box-shadow:inset 3px 0 0 var(--cyan);}
/* ---------- terminal ---------- */
.term{background:#050a14;border:1px solid var(--line);border-radius:10px;padding:10px;}
.termout{
  font:14px/1.55 Consolas,"Courier New",monospace;color:#c9d7ea;max-height:260px;overflow:auto;
  white-space:pre-wrap;margin:0 0 8px;
}
.termrow{display:flex;align-items:center;gap:8px;}
.termprompt{font:14.5px Consolas,"Courier New",monospace;color:var(--green);white-space:nowrap;}
.termin{flex:1;background:transparent;border:0;border-bottom:1px solid #33486e;color:#e6f7ff;
  font:14.5px Consolas,"Courier New",monospace;min-height:38px;}
.support{background:#101c33;border:1px solid #243a5e;border-radius:10px;padding:10px 12px;margin:8px 0;}
.support .t{font-weight:800;color:var(--cyan);font-size:13px;letter-spacing:.6px;text-transform:uppercase;}
.countdown{display:inline-block;background:#2a1116;border:1px solid var(--red);color:var(--red);
  font-weight:800;border-radius:8px;padding:4px 10px;margin:6px 0;}
/* ---------- triage ---------- */
.alertcard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:10px;padding:10px 12px;margin:10px 0;}
.alertcard .atitle{font-weight:800;color:var(--red);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.alertcard .abody{font-size:15px;margin:6px 0 10px;}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.act{
  min-height:44px;border-radius:10px;background:#0c1424;border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;font-size:14px;cursor:pointer;text-align:left;
}
.act:hover{border-color:var(--blue);}
.act.sel{border-color:var(--green);background:#10241c;font-weight:700;}
/* ---------- branching steps ---------- */
.stepchip{display:inline-block;background:#1a2a46;border:1px solid var(--line);color:var(--cyan);
  font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 12px;letter-spacing:.8px;margin-bottom:6px;}
.stepnarr{color:var(--mut);font-size:14.5px;margin:2px 0 8px;}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
.fb-correct{border-left:6px solid var(--green);}
.fb-partial{border-left:6px solid var(--amber);}
.fb-incorrect{border-left:6px solid var(--red);}
.fbhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
.fb-correct .fbhead{color:var(--green);}
.fb-partial .fbhead{color:var(--amber);}
.fb-incorrect .fbhead{color:var(--red);}
.fbpts{font-weight:700;color:var(--txt);margin:6px 0;}
.fblist{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;}
.fblist .lt{font-weight:800;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
.lt-good{color:var(--green);} .lt-bad{color:var(--red);} .lt-miss{color:var(--amber);}
.fblist li{margin:6px 0 6px 18px;font-size:15px;}
.study{background:#0f2033;border:1px solid #1d3a5f;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px;}
.encourage{color:var(--mut);font-style:italic;margin-top:8px;font-size:14.5px;}
.copywrap{position:relative;}
.copybtn{position:absolute;top:6px;right:6px;min-height:44px;padding:3px 10px;border-radius:8px;font-size:12px;}
/* ---------- intro / review / results ---------- */
.herotitle{font-size:26px;font-weight:800;margin:10px 0 4px;}
.metchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.mchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600;}
.h2{font-size:18px;font-weight:800;margin:18px 0 6px;color:var(--cyan);}
.themebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;}
.themebox .th{font-weight:800;color:var(--amber);margin-bottom:6px;}
.concepts{display:flex;flex-wrap:wrap;gap:6px;}
.cpt{background:#0c1424;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mut);}
.rules li{margin:6px 0;}
.bigstart{width:100%;min-height:54px;font-size:17px;margin-top:14px;}
.revitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin:8px 0;}
.revitem .ri{flex:1;}
.revitem .rt{font-weight:700;}
.revitem .rs{color:var(--mut);font-size:13.5px;}
.ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--green) calc(var(--pct)*1%), #1c2942 0);margin:10px auto;}
.ring .in{width:130px;height:130px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring .pctv{font-size:30px;font-weight:800;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.stat .n{font-size:22px;font-weight:800;}
.stat .l{color:var(--mut);font-size:13px;}
.passpanel{border:1px solid var(--green);background:linear-gradient(180deg,#0f2018,#111a2c);border-radius:14px;
  padding:16px;text-align:center;margin:12px 0;}
.failpanel{border:1px solid var(--red);background:linear-gradient(180deg,#241016,#111a2c);border-radius:14px;
  padding:16px;text-align:center;margin:12px 0;}
.themetable{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;}
.themetable th,.themetable td{border:1px solid var(--line);padding:7px 10px;text-align:left;}
.themetable th{background:var(--panel2);color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
.repitem{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel);}
.rephd{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap;}
.rephd .rp{font-weight:700;}
.rephd .rs{color:var(--mut);font-size:13px;}
.stchip{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;border:1px solid var(--line);}
.st-ok{background:#0f2a1c;color:var(--green);border-color:#1d5c3d;}
.st-part{background:#2b2310;color:var(--amber);border-color:#6b5423;}
.st-no{background:#2a1218;color:var(--red);border-color:#6b2330;}
.st-skip{background:#1c2130;color:var(--grey);}
.repbd{border-top:1px solid var(--line);padding:12px 14px;display:none;}
.repitem.open .repbd{display:block;}
/* ---------- pause overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,16,.94);z-index:80;display:flex;align-items:center;justify-content:center;}
.ovbox{text-align:center;background:var(--panel);border:1px solid var(--amber);border-radius:16px;padding:30px 40px;max-width:440px;}
.ovbox .big{font-size:22px;font-weight:800;color:var(--amber);margin-bottom:8px;}
/* ---------- footer actions ---------- */
.foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.hintpanel{background:#221d0e;border:1px solid #6b5423;border-radius:10px;padding:10px 12px;margin:10px 0;color:#ffe2ae;font-size:14.5px;}
@media (max-width:760px){
  .bar{padding:8px;}
  .zonerow{grid-template-columns:1fr;}
  .herotitle{font-size:21px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important;}
}

</style>

<script>
var EXAM = {"title": "Active Directory Certificate Services — MEDIUM", "sevKey": "medium", "sevLabel": "MEDIUM", "timerSeconds": 1920, "terminalForgive": true, "themes": [["PKI Foundations", ["Certification Authority (CA)", "Root CA / offline root", "Subordinate (issuing) CA", "Enterprise CA vs Standalone CA", "Chain of trust", "AIA (Authority Information Access)", "CRL / Delta CRL / OCSP", "ntAuthCertificates", "Cert Publishers"]], ["Templates & Enrollment", ["Certificate templates", "EKU (Extended Key Usage)", "SAN (Subject Alternative Name)", "ENROLLEE_SUPPLIES_SUBJECT", "Autoenrollment (GPO)", "Web enrollment (/certsrv)", "CEP / CES", "Enrollment Agent", "CA roles: ManageCA / ManageCertificates", "EDITF_ATTRIBUTESUBJECTALTNAME_REQUIRE"]], ["Attack Paths (ESC)", ["ESC1 - template SAN abuse", "ESC2 - Any Purpose / no EKU", "ESC3 - enrollment agent abuse", "ESC4 - template write rights", "ESC5 - PKI object ACLs", "ESC6 - CA-wide SAN flag", "ESC7 - ManageCA / ManageCertificates abuse", "ESC8 - NTLM relay to enrollment endpoints", "ESC9 / ESC10 - weak certificate mapping", "Pass-the-certificate", "UnPAC-the-hash", "Shadow Credentials (msDS-KeyCredentialLink)", "Certificate theft (DPAPI / LSASS)", "Golden certificate"]], ["Tools & Commands", ["certutil", "certreq", "Certmgr.msc / Certlm.msc", "Certipy", "Certify", "Rubeus", "ForgeCert", "Mimikatz", "Whisker"]], ["Detection & Logging", ["Event 4886 / 4887 / 4888 (issued / approved / denied)", "Event 4870 (revoked)", "Event 4882 (CA backup)", "Event 4889 / 4890 (CA service start / stop)", "Event 4898 / 4899 (template change)", "Event 4768 (Kerberos PKINIT)", "Event 4771", "Sysmon process events", "CA audit policy"]], ["Hardening & Operations", ["Template ACL review", "Remove ENROLLEE_SUPPLIES_SUBJECT", "Clear CA EditFlags (ESC6)", "Strong certificate mapping", "Disable NTLM on enrollment endpoints", "EPA / channel binding", "Role separation", "CA backup / restore", "Key archival", "Renewal vs re-enrollment", "Revocation handling", "GPO autoenrollment policy", "PKI documentation / compliance"]]], "intro": [{"h2": "What is Active Directory Certificate Services (AD CS)?", "paras": ["AD CS is a role for Windows Server. It is Microsoft's built-in PKI. PKI means Public Key Infrastructure. A PKI makes, signs, checks and cancels digital certificates. A certificate is like a digital ID card. It proves that a user, a computer or a service is really who it claims to be.", "Imagine a big office building. The receptionist gives a plastic badge to every worker and visitor. The guards trust the badge because the receptionist signed it. In a Windows domain, the CA (Certification Authority) is that receptionist. AD CS is the whole badge office: the printer, the rules, the records and the cancel list."]}, {"h2": "Where you will meet AD CS in real work", "paras": ["AD CS touches many cybersecurity jobs. Here are the main ones:"], "list": ["Security engineers run and harden the CA servers. They create templates and keep the PKI healthy.", "SOC analysts watch certificate events on a shift. They look for strange certificate requests and strange logons.", "Incident responders investigate attacks that use certificates. They decide what to contain and what to keep as evidence.", "GRC teams write PKI policies and check that the rules are followed. They produce documents like template reviews and risk reports.", "Red teams test AD CS, because attackers love it: one unsafe template or one stolen CA key can let someone sign in as anybody, with no password needed."]}, {"h2": "What people do with it every day", "paras": ["Day to day, the people around a CA do a small set of repeating tasks:"], "list": ["They create and update certificate templates (the forms that describe how certificates are made).", "They approve or deny certificate requests.", "They renew certificates before they expire, and revoke (cancel) certificates that are lost or stolen.", "They publish revocation lists (CRLs) and keep CA backups.", "They write everything down for audits: policies, runbooks and incident reports."]}, {"h2": "The tools you will see", "paras": ["On Windows you will use built-in tools like Certutil, Certreq, Certmgr.msc and Certlm.msc. Security teams also use Certipy and Certify to find unsafe settings, Rubeus to work with Kerberos tickets, and Mimikatz or Whisker in attack simulations. Command tasks in this exam run in a safe fake shell, so you can practise without any risk."]}, {"h2": "The risks AD CS must control", "paras": ["Certificates often replace passwords. So certificate attacks are like password attacks, but much quieter. The classic unsafe patterns have names like ESC1 to ESC10 from well-known research. Examples: a template that lets a requester type any name, a CA-wide flag that accepts any subject, or an NTLM relay to the enrollment website. If attackers steal the CA private key, they can forge certificates for years (a golden certificate).", "This exam teaches you to spot these patterns, to see them in logs, and to fix them."]}, {"h2": "How scoring works (please read)", "list": ["Every exercise is worth 100 points. Your percentage is your points divided by the points of the exercises you actually answered.", "Some exercises have several parts (for example drag-and-drop slots or select-all answers). You get part of the points for the parts you get right.", "In select-all exercises, every wrong pick cancels one right pick.", "In slot exercises (matching, ordering, fill-the-blank, triage, branching), each correct slot gives its own share of the points. A wrong slot only loses its own share.", "The Hint button shows a nudge, never the answer. It costs 10% of that one exercise's points.", "Skip moves an exercise to a review pool without showing the answer. You can go back as long as the timer runs. If you never answer a skipped exercise, it is excluded from the score: it adds nothing to your points and nothing to the maximum.", "The live score in the header always shows points earned out of points possible, over the exercises you have actually answered."]}, {"h2": "How the timer works", "list": ["You have a total time for this file (shown in the chips above).", "The Pause button stops the timer and hides the exercise. Press Resume when you are ready.", "When you press Check, the timer also stops, so you can read the explanation for free. Nothing is hidden while you read.", "The timer starts again when you press Next.", "The timer area always shows its state: running, paused by you, or paused for feedback."]}, {"h2": "What this file tests and how hard it is", "paras": ["This is the MEDIUM file. Every exercise combines exactly two connected ideas: for example “read the template, then pick the control”. The goal is stated, but the path is not — you must decide what to look at first. Wrong options are plausible; only one survives both steps.", "Standard acronyms (EKU, SAN, ESC numbers) appear after a first plain-word explanation. Hints narrow the direction; they never give the answer."]}, {"h2": "Exercise types in this file", "paras": ["This file mixes many interactive formats — not just multiple choice:"], "list": ["Log analysis in a filterable log viewer", "Single-choice questions with tricky distractors", "Spot-the-mistake (click the wrong line)", "Drag-and-drop matching (cards onto zones)", "Terminal emulator tasks (safe fake shell)", "Timeline ordering (put steps in order)", "SOC alert-queue triage with consequences", "Fill-in-the-blank with a shuffled word bank", "Branching scenarios and dual red/blue perspectives", "Select-all-that-apply questions with partial credit"]}], "meta": {"topicId": "active-directory-certificate-services", "batch": 2, "title": "Active Directory Certificate Services — MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 32, "passMark": 70}, "exercises": [{"id": "M01", "type": "logview", "theme": "Detection & Logging", "title": "Two lines that tell one story", "scenario": {"summary": "Did anything use a certificate to sign in?", "blocks": [{"label": "Context", "prose": "You are on the SOC morning shift. The SIEM shows six lines from DC-01 and CA-01. Your lead asks: “Did anything in here actually use a certificate to sign in?”"}, {"label": "ARTEFACT 1 — SIEM export, this morning", "code": "08:09:30  FS-01   Event 4663  A handle to an object was requested.\n08:10:15  CA-01   Event 4886  Certificate issued. Requester: CORP\\LT-1140$  Template: WorkstationAuthentication\n08:11:44  CA-01   Event 4886  Certificate issued. Requester: CORP\\svc-backup  Template: BackupOps-Auth  Serial: 1f000000a4\n08:12:01  DC-01   Event 4768  A Kerberos authentication ticket (TGT) was requested. Account: CORP\\svc-backup  Pre-auth type: 15 (PKINIT)\n08:12:01  DC-01   Event 4768  A Kerberos authentication ticket (TGT) was requested. Account: CORP\\jdoe  Pre-auth type: 2 (password)\n08:12:02  DC-01   Event 4624  An account successfully logged on. Account: CORP\\jdoe  Logon type: 2"}]}, "question": "Select the two lines that together show a certificate being used for a sign-in.", "hint": "PKINIT is the Kerberos logon type that uses certificates. Find its event, then find the issuance that matches the same account.", "data": {"multi": true, "lines": ["08:09:30  FS-01   Event 4663  A handle to an object was requested.", "08:10:15  CA-01   Event 4886  Certificate issued. Requester: CORP\\LT-1140$  Template: WorkstationAuthentication", "08:11:44  CA-01   Event 4886  Certificate issued. Requester: CORP\\svc-backup  Template: BackupOps-Auth  Serial: 1f000000a4", "08:12:01  DC-01   Event 4768  A Kerberos authentication ticket (TGT) was requested. Account: CORP\\svc-backup  Pre-auth type: 15 (PKINIT)", "08:12:01  DC-01   Event 4768  A Kerberos authentication ticket (TGT) was requested. Account: CORP\\jdoe  Pre-auth type: 2 (password)", "08:12:02  DC-01   Event 4624  An account successfully logged on. Account: CORP\\jdoe  Logon type: 2"], "pick": [2, 3], "lineWhy": ["The 4886 line proves CORP\\svc-backup received a certificate from template BackupOps-Auth.", "Pre-auth type 15 is PKINIT: Kerberos logon with a certificate. The account matches the issuance one line above."], "wrongWhy": {"0": "A file access event says nothing about certificates.", "1": "This issuance is for a computer account that never logs on with it here.", "4": "Pre-auth type 2 is a password logon — no certificate involved.", "5": "A normal logon event does not show certificate use by itself."}}, "explain": "Certificate logons leave a two-line footprint: the CA issues a certificate (4886), and shortly after, the domain controller logs a TGT request with pre-auth type 15 — PKINIT — for the same account. Reading both lines together is the daily bread of SOC analysts hunting certificate abuse. Pre-auth type 2 is the classic password path and does not involve certificates.", "study": "Remember the pair: 4886 issuance + 4768 PKINIT with the same account name."}, {"id": "M02", "type": "qcm", "theme": "Attack Paths (ESC)", "title": "The template that trusts everyone", "scenario": {"summary": "One template stands out in the review", "blocks": [{"label": "Context", "prose": "You review templates on CORP-CA-01. One template stands out, because any domain user may enroll from it."}, {"label": "ARTEFACT 1 — Template card: OfflineJoin-Auth", "code": "Template name:        OfflineJoin-Auth\nEKU:                  Client Authentication\nSubject name flag:    ENROLLEE_SUPPLIES_SUBJECT\nEnrollment rights:    CORP\\Domain Users"}]}, "question": "What is the main risk of this template?", "hint": "Follow the two facts together: who may enroll, and who types the subject name.", "data": {"options": [{"t": "Any domain user can request a certificate for any name, even a Domain Admin", "correct": true, "why": "Caller-chosen subject + Client Authentication + broad enrollment rights = the ESC1 pattern."}, {"t": "Domain users must first ask an administrator before they can renew this certificate", "correct": false, "why": "Renewal rules are not shown, and nothing here forces an approval step."}, {"t": "The CA will detect the risk and refuse to publish the template to the domain", "correct": false, "why": "The CA happily publishes unsafe templates. It does not police them."}, {"t": "Users can only ever request certificates for their own computer accounts", "correct": false, "why": "ENROLLEE_SUPPLIES_SUBJECT is exactly what removes that restriction."}]}, "explain": "Read the two facts as one sentence: “who may ask” (Domain Users) times “who writes the name” (the requester, via ENROLLEE_SUPPLIES_SUBJECT) times “what the result can do” (Client Authentication). Any user can then hold a valid certificate that claims to be an administrator. This is the famous ESC1 pattern, and it is entirely a configuration problem.", "study": "Learn the ESC1 recipe: Client Authentication EKU + caller-chosen subject + weak enrollment rights."}, {"id": "M03", "type": "spot", "theme": "Templates & Enrollment", "title": "Find the line that opens the door", "scenario": {"summary": "A template dump with one bad line", "blocks": [{"label": "ARTEFACT 1 — Template dump: EncryptingTeam-Auth", "code": "Template common name:        EncryptingTeam-Auth\nEKU:                         Client Authentication\nValidity:                    1 year\nmsPKI-Certificate-Name-Flag: ENROLLEE_SUPPLIES_SUBJECT\nAutoenrollment:              Allowed\nOwner:                       CORP\\EncryptingTeam-Admins"}]}, "question": "Click the one line that makes this Client Authentication template dangerous when broad groups can enroll.", "hint": "You are looking for the flag about who types the subject name — not the validity or the owner.", "data": {"multi": false, "lines": ["Template common name:        EncryptingTeam-Auth", "EKU:                         Client Authentication", "Validity:                    1 year", "msPKI-Certificate-Name-Flag: ENROLLEE_SUPPLIES_SUBJECT", "Autoenrollment:              Allowed", "Owner:                       CORP\\EncryptingTeam-Admins"], "pick": [3], "lineWhy": ["The name flag decides who controls the subject. ENROLLEE_SUPPLIES_SUBJECT hands that control to the requester."]}, "explain": "Validity periods, autoenrollment and owners are normal template furniture. The dangerous line is the name flag: ENROLLEE_SUPPLIES_SUBJECT lets the requester choose whose name the certificate carries. Combined with Client Authentication and broad enrollment rights, that is the ESC1 door. Auditors search for this exact attribute name in every template dump.", "study": "Practise skimming template dumps for msPKI-Certificate-Name-Flag first, EKU second, enrollment rights third."}, {"id": "M04", "type": "match", "theme": "Attack Paths (ESC)", "title": "Know the ESC names", "scenario": {"summary": "Four famous AD CS abuse patterns", "blocks": [{"label": "Context", "prose": "In the incident channel, people keep saying “this looks like ESC-something”. Your lead pins four sentences from the research and asks you to label them."}]}, "question": "Drag each card onto the ESC number it describes.", "hint": "These numbers come from the well-known “Certified Pre-Owned” research on AD CS abuse. ESC1 is the one about the subject name.", "data": {"zones": [{"label": "ESC1", "items": [{"t": "A template lets the requester type any subject name, and the certificate allows logon", "why": "Caller-chosen subject + authentication EKU + weak enrollment rights."}]}, {"label": "ESC2", "items": [{"t": "A template has no EKU limit — “Any Purpose” or an empty EKU", "why": "Without an EKU limit, the certificate works for almost anything."}]}, {"label": "ESC3", "items": [{"t": "A template lets you enroll on behalf of somebody else", "why": "Enrollment Agent templates let one person request certificates for others."}]}, {"label": "ESC4", "items": [{"t": "A low-privilege group may change the template itself", "why": "Write rights on a template let an attacker turn it into an ESC1 template."}]}]}, "explain": "The ESC list is the shared vocabulary of AD CS attacks. ESC1 is the caller-chosen subject. ESC2 removes usage limits. ESC3 abuses enrollment agents. ESC4 abuses write access to templates. Later numbers cover CA-level flags (ESC6), CA roles (ESC7) and NTLM relay to enrollment endpoints (ESC8). Naming a finding precisely makes the fix obvious.", "study": "Read the one-page summaries of ESC1 to ESC8 and keep the list next to you in audits."}, {"id": "M05", "type": "term", "theme": "Tools & Commands", "title": "Find unsafe templates (Certipy)", "scenario": {"summary": "Linux box, Certipy installed, normal account", "blocks": [{"label": "Context", "prose": "Your team gives you a Linux box. The Certipy tool is installed. You hold a normal domain account: jdoe / “Spring2024!”. The domain controller is 10[.]10[.]20[.]15. Your lead says: “List the certificate templates, and mark the unsafe ones.”"}]}, "question": "Type the Certipy command that lists templates and flags the unsafe ones, then press Enter.", "hint": "You want the action that only reads and reports — not the one that requests anything.", "data": {"prompt": "analyst@lab:~$ ", "banner": "Simulation shell on the Linux lab box. Nothing real is executed.", "canonical": "certipy find -u jdoe@corp.local -p 'Spring2024!' -dc-ip 10[.]10[.]20[.]15 -vulnerable", "required": ["\\bcertipy\\b", "\\bfind\\b", "-vulnerable\\b"], "forbidden": [{"re": "\\breq\\b", "why": "certipy req would request a real certificate. That changes state on the CA and is not needed to audit."}, {"re": "\\bforge\\b", "why": "forge is not a Certipy action here — and fabricating data is never part of an audit."}], "parts": [{"text": "certipy find", "why": "enumerates AD CS: CAs, templates and their settings"}, {"text": "-u / -p", "why": "your normal domain account for the LDAP query"}, {"text": "-dc-ip", "why": "which domain controller to query"}, {"text": "-vulnerable", "why": "marks the templates with unsafe settings in the output"}]}, "explain": "Certipy find is the standard enumeration step. It reads CAs and templates from LDAP and, with -vulnerable, marks the ones matching known ESC patterns. The near-miss command certipy req would actually request a certificate — a state change you must not do during a read-only audit. Enumeration first, action later, always with a change ticket.", "study": "Compare Certipy (Linux) and Certify (Windows) for the same enumeration task."}, {"id": "M06", "type": "order", "theme": "Hardening & Operations", "title": "The enrollment journey", "scenario": {"summary": "From request to renewal", "blocks": [{"label": "Context", "prose": "You must explain the enrollment flow to a new colleague. The five steps are shuffled below."}]}, "question": "Put the five steps of the enrollment flow in order, from first to last.", "hint": "The certificate store comes after issuance. Renewal is the last stop.", "data": {"items": [{"t": "The user or computer asks the CA for a certificate (enrollment request)", "why": "A request is built from a template and signed with the requester's key pair."}, {"t": "The CA checks the request against the template: EKU, subject rules and enrollment rights", "why": "The CA enforces the template before anything is signed."}, {"t": "If the rules pass, the CA signs and issues the certificate", "why": "The CA's signature is what makes the certificate trustworthy."}, {"t": "The certificate is placed in the user's or computer's certificate store", "why": "Stores: CurrentUser and LocalMachine, seen in Certmgr.msc / Certlm.msc."}, {"t": "Autoenrollment later renews it before it expires", "why": "Renewal re-runs the flow with the same template, without user clicks."}]}, "explain": "Enrollment is a pipeline: request, template check, issuance, storage, renewal. Two of these steps are where security lives: the template check (who may request what) and the store (who holds the private key). When you audit, you walk this pipeline and look for shortcuts, such as templates that skip meaningful checks.", "study": "Follow one real certificate through this pipeline in your lab."}, {"id": "M07", "type": "match", "theme": "Hardening & Operations", "title": "Who may do what on the CA", "scenario": {"summary": "CA roles and rights", "blocks": [{"label": "Context", "prose": "During a role-separation review you must confirm that each CA role maps to the right capability."}]}, "question": "Drag each card onto the CA role it describes.", "hint": "Three names talk about people roles. “Cert Publishers” is a group account that does a publishing job.", "data": {"zones": [{"label": "CA Administrator", "items": [{"t": "Full control over the CA, including its settings and officer rights", "why": "ManageCA: can change the CA's configuration itself."}]}, {"label": "Certificate Manager", "items": [{"t": "May approve, deny, revoke and manage pending requests", "why": "ManageCertificates: runs the daily request queue."}]}, {"label": "Enrollment Agent", "items": [{"t": "May request certificates on behalf of other users", "why": "Enrollment agents enroll for others — ESC3 when abused."}]}, {"label": "Auditor", "items": [{"t": "May read the CA's audit and security logs", "why": "Auditors read, they do not change."}]}, {"label": "Cert Publishers", "items": [{"t": "Publishes certificates and CRLs into Active Directory", "why": "A system group that keeps AD in sync with the CA."}]}]}, "explain": "Role separation is a hardening control: the person who configures the CA (CA Administrator, ManageCA) should not be the person who approves requests (Certificate Manager, ManageCertificates). When a helpdesk group quietly holds ManageCertificates — as in ESC7 — it can approve dangerous pending requests. Auditors compare the CA security descriptor against this map.", "study": "Dump a CA's security descriptor and map every ACE to one of these roles."}, {"id": "M08", "type": "triage", "theme": "Detection & Logging", "title": "SOC queue: certificate alerts", "scenario": {"summary": "Three alerts, three correct plays", "blocks": [{"label": "Context", "prose": "Morning SOC queue. Three certificate-related alerts. Choose the correct response for each."}]}, "question": "Pick the correct response for every alert.", "hint": "Big waves from many computers are usually autoenrollment. One odd subject name is the red flag.", "data": {"actions": ["Close — normal autoenrollment wave", "Investigate — possible certificate impersonation", "Investigate — a template was modified"], "alerts": [{"tag": "Alert A", "body": "08:55 — 42 events 4886 in 3 minutes. Requesters: 42 different computer accounts. Template: WorkstationAuthentication. All subjects match their requesters.", "correct": 0, "why": "A burst of computer certificates that match their requesters is the normal autoenrollment wave."}, {"tag": "Alert B", "body": "03:12 — Event 4886. Requester: CORP\\svc-print. Template: UserAuth-Flex. Subject: CORP\\A-Administrator. svc-print has never enrolled before.", "correct": 1, "why": "A service account enrolled a certificate with an administrator's name. That is impersonation until proven otherwise."}, {"tag": "Alert C", "body": "02:58 — Event 4899. Template “UserAuth-Flex” settings were changed. Actor: CORP\\helpdesk1. No change ticket exists.", "correct": 2, "why": "Template changes rewrite the rules of future certificates. With no ticket, they must be reviewed."}]}, "explain": "Triage is about baselines. Computers requesting their own certificates in bulk: normal. One account requesting a certificate for a name it does not own: abnormal. Template changes: always reviewed, because a template change can quietly create an ESC1 condition. Three alerts, three different plays.", "study": "Build a small cheat sheet: which 4886 patterns are normal in your domain, and which never are."}, {"id": "M09", "type": "qcm", "theme": "Attack Paths (ESC)", "title": "Any Purpose, any problem", "scenario": {"summary": "A template with no usage limits", "blocks": [{"label": "Context", "prose": "Another template in the same review worries you for a different reason."}, {"label": "ARTEFACT 1 — Template card: Vault-Any", "code": "Template name:        Vault-Any\nEKU:                  None (Any Purpose)\nEnrollment rights:    CORP\\Domain Users"}]}, "question": "Why does an “Any Purpose” template with Domain Users enrollment rights worry you?", "hint": "This is the ESC2 pattern: no EKU limit means almost no usage limits.", "data": {"options": [{"t": "The certificate fits almost any job — including logon and code signing", "correct": true, "why": "No EKU limit means Windows accepts it wherever a certificate fits, including logons."}, {"t": "The certificate only works for one narrow task, which keeps it harmless", "correct": false, "why": "It is the opposite: with no EKU restriction, it fits every job."}, {"t": "The CA automatically deletes this kind of certificate again after 24 hours", "correct": false, "why": "Nothing here sets a lifetime; certificates normally live for months."}, {"t": "Only administrators can ever request, hold or use such a certificate", "correct": false, "why": "Enrollment rights say Domain Users — every domain user can hold one."}]}, "explain": "An EKU list is a whitelist of jobs. “Any Purpose” (or an empty EKU) is the same as no whitelist: the certificate is accepted for logons, signing, encryption — whatever fits. This is the ESC2 pattern. A Domain Users enrollment right turns it into a universal credential for everyone, which is why EKU-less templates are treated like ESC1's cousins.", "study": "Compare ESC1 (subject abuse) and ESC2 (no usage limit) with one template each."}, {"id": "M10", "type": "fill", "theme": "Hardening & Operations", "title": "Template hardening policy", "scenario": {"summary": "Complete the PKI policy sentences", "blocks": [{"label": "Context", "prose": "GRC asks you to complete policy PKI-04 before the review board meets."}]}, "question": "Drag a word from the bank into each blank.", "hint": "One slot is a group name, one is a flag, one is the real-time revocation protocol, one is a person.", "data": {"text": "Policy PKI-04: Enrollment rights on sensitive templates must never include {0}. The flag {1} must be removed unless a documented process needs it. Clients check revocation from the CRL, or in real time with {2}. Requests for administrator certificates require {3} approval.", "slots": ["Domain Users", "ENROLLEE_SUPPLIES_SUBJECT", "OCSP", "manager"], "slotWhy": ["Broad groups like Domain Users are the enrollment side of the ESC1 recipe.", "ENROLLEE_SUPPLIES_SUBJECT lets the requester pick the subject; it needs a documented exception.", "OCSP answers revocation questions in real time; the CRL is the scheduled list.", "Manager approval adds a human gate for high-value certificates."], "bank": ["Domain Users", "ENROLLEE_SUPPLIES_SUBJECT", "OCSP", "manager", "NTLM", "DHCP", "DNS"]}, "explain": "Good PKI policies attack the same three surfaces you audit: enrollment rights (narrow them), subject control (no caller-chosen names without exception), and revocation visibility (CRL plus OCSP). Human approval for admin certificates closes the gap that pure configuration leaves open.", "study": "Draft the one-sentence exception rule your own team would need for ENROLLEE_SUPPLIES_SUBJECT."}, {"id": "M11", "type": "branch", "theme": "Attack Paths (ESC)", "title": "One template, two views", "scenario": {"summary": "The same template from blue and red eyes", "blocks": [{"label": "Context", "prose": "Template “UserAuth-Flex”: EKU Client Authentication, flag ENROLLEE_SUPPLIES_SUBJECT, and CORP\\Domain Users may enroll. The CA is trusted for logon (its certificate is in ntAuthCertificates)."}]}, "question": "Answer both steps — first as the blue team, then as the red team.", "hint": "Blue: the template is the law. Red: the SAN is where you write someone else's name.", "data": {"steps": [{"label": "BLUE TEAM VIEW", "narration": "You are the SOC analyst. You see svc-print enroll a UserAuth-Flex certificate with subject CORP\\A-Administrator.", "question": "What do you check first to confirm abuse?", "options": [{"t": "The template's EKU and name flags — can callers pick subjects?", "correct": true, "why": "The template decides if a caller-chosen subject is legal. That is the heart of ESC1."}, {"t": "svc-print's mailbox size, its quota and its recent email activity", "correct": false, "why": "Mailbox data cannot tell you whether a certificate request was legal."}, {"t": "The CA's free disk space and its average CPU load this week", "correct": false, "why": "Disk space never explains an impersonation."}, {"t": "The backup schedule of the CA and the date of the last restore", "correct": false, "why": "Backups matter for recovery, not for this decision."}]}, {"label": "RED TEAM VIEW", "narration": "You are the attacker with a normal account and this template available.", "question": "What do you request to become a Domain Admin?", "options": [{"t": "A Client Authentication certificate with SAN = CORP\\A-Administrator, then log on with it (PKINIT)", "correct": true, "why": "Caller-chosen subject plus authentication EKU equals a valid credential for any name (pass-the-certificate)."}, {"t": "A WebServer certificate for your own laptop — it would only ever prove the laptop's own name", "correct": false, "why": "A server certificate for your laptop proves nothing about an admin."}, {"t": "A brand-new CA certificate for yourself — the CA would refuse it, and it would not even help anyway", "correct": false, "why": "You cannot request CA certificates — and that is not how the abuse works."}, {"t": "A certificate with your own normal account name, which only ever proves that you are yourself", "correct": false, "why": "That is a normal, useless-to-attacker certificate with your own name."}]}]}, "explain": "Same template, two views. Blue checks whether the template legally allows a caller-chosen subject; red uses exactly that allowance to write an administrator's name into the SAN and then exchange the certificate for a TGT (pass-the-certificate). When blue and red agree on the template's meaning, findings stop being debatable.", "study": "Write the two-view summary for ESC3: what blue checks, what red requests."}, {"id": "M12", "type": "logview", "theme": "Detection & Logging", "title": "One request needs attention", "scenario": {"summary": "Seven issuances on a quiet night", "blocks": [{"label": "Context", "prose": "02:00 on CORP-CA-01. The night is quiet and the CA log shows seven issuances. Six look alike."}, {"label": "ARTEFACT 1 — CA issuance log extract", "code": "01:59:40  4886  Requester: CORP\\LT-1010$  Template: WorkstationAuthentication\n02:03:11  4886  Requester: CORP\\LT-1044$  Template: WorkstationAuthentication\n02:14:02  4886  Requester: CORP\\helpdesk1  Template: EscrowAgent  Subject: CORP\\A-Administrator\n02:15:47  4886  Requester: CORP\\LT-1088$  Template: WorkstationAuthentication\n02:22:05  4886  Requester: CORP\\WS-2222$  Template: WorkstationAuthentication\n02:31:12  4886  Requester: CORP\\LT-1091$  Template: WorkstationAuthentication\n02:40:59  4886  Requester: CORP\\LT-1102$  Template: WorkstationAuthentication"}]}, "question": "Click the certificate request that does not fit the pattern.", "hint": "Five lines look like a normal night of autoenrollment. Ask who enrolled, and for whom.", "data": {"multi": false, "lines": ["01:59:40  4886  Requester: CORP\\LT-1010$  Template: WorkstationAuthentication", "02:03:11  4886  Requester: CORP\\LT-1044$  Template: WorkstationAuthentication", "02:14:02  4886  Requester: CORP\\helpdesk1  Template: EscrowAgent  Subject: CORP\\A-Administrator", "02:15:47  4886  Requester: CORP\\LT-1088$  Template: WorkstationAuthentication", "02:22:05  4886  Requester: CORP\\WS-2222$  Template: WorkstationAuthentication", "02:31:12  4886  Requester: CORP\\LT-1091$  Template: WorkstationAuthentication", "02:40:59  4886  Requester: CORP\\LT-1102$  Templ   var g = GRADER[ex.type](ex, ans);

  if(g.t <= 0){ pts = 0; }

  else { pts = Math.floor(g.c / g.t * 100); }

  st.graded[st.cur] = g;

  var stage = $("stage");
  stage.appendChild(buildScenario(ex));
  stage.appendChild(buildQuestion(ex));
  stage.appendChild(buildAnswer(ex));
  if(st.hint[key] && !st.graded[key]){
    var hp = h("div","hintpanel","\u24D8 Hint (costs 10% of this exercise's points): " + ex.hint);
    stage.querySelector(".ansblock").appendChild(hp);
  }
  var foot = h("div","foot");
  var bc = h("button","btn go","\u2713 Check answer"); bc.type="button"; bc.id="btn-check";
  bc.addEventListener("click", checkAnswer);
  var bn = h("button","btn primary","\u25B8 Next exercise"); bn.type="button"; bn.id="btn-next";
  bn.addEventListener("click", nextAnswer);
  foot.appendChild(bc); foot.appendChild(bn);
  stage.appendChild(foot);
  if(st.graded[key]){ renderFeedbackInto(ex, st.graded[key], true); }
  bn.disabled = !st.graded[key];
  updateHeader();
  window.scrollTo(0,0);
}
/* per-exercise countdown (EXTREMELY HARD terminal tasks) */
function startCountdown(ex, box){
  if(!ex.data || !ex.data.timerSeconds || !box){ return; }
  stopCountdown();
  st.cdLeft = ex.data.timerSeconds;
  var cd = h("div","countdown"); cd.id = "excd";
  box.insertBefore(cd, box.children[1] || null);
  function paint(){
    cd.textContent = "\u23F1 Reduced time limit for this terminal task: " + st.cdLeft + "s remaining. When it reaches 0, your command is graded as typed.";
  }
  paint();
  st.cd = setInterval(function(){
    if(st.timer.manual){ return; }
    st.cdLeft -= 1;
    if(st.cdLeft <= 0){
      stopCountdown();
      checkAnswer(true);   /* grade as typed, even when the command is empty */
      return;
    }
    paint();
  }, 1000);
}
function stopCountdown(){ if(st.cd){ clearInterval(st.cd); st.cd = null; } }

RENDER.match = function(ex, box){
  var zones = ex.data.zones;
  var flat = [];
  zones.forEach(function(z, zi){ z.items.forEach(function(it){ flat.push({t:it.t, why:it.why||"", zi:zi}); }); });
  var order = shuffle(flat.map(function(_,i){ return i; }));
  var place = [];
  flat.forEach(function(_,i){ place[i] = -1; });
  var held = null;
  box.appendChild(h("div","smallnote","Drag each card onto the zone where it belongs. You can also click a card, then click a zone. Click a placed card to send it back."));
  var bank = h("div","bank"); bank.id = "bank";
  var zoneEls = [];
  var wrap = h("div","zonewrap");
  zones.forEach(function(z, zi){
    var row = h("div","zonerow");
    var lab = h("div","zonelabel", z.label);
    var zone = h("div","zone"); zone.dataset.zi = zi;
    zone.setAttribute("role","button");
    zone.setAttribute("tabindex","0");
    zone.setAttribute("aria-label","Drop zone: "+z.label+". Select a card first, then press Enter here to place it.");
    zone.addEventListener("dragover", function(e){ e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop", function(e){
      e.preventDefault(); zone.classList.remove("over");
      var id = e.dataTransfer.getData("text/plain");
      if(id !== ""){ placeItem(parseInt(id,10), zi); }
    });
    function zoneActivate(){
      if(held !== null){ placeItem(held, zi); held = null; clearHeld(); }
    }
    zone.addEventListener("click", zoneActivate);
    zone.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); zoneActivate(); } });
    row.appendChild(lab); row.appendChild(zone);
    wrap.appendChild(row);
    zoneEls.push(zone);
  });
  function clearHeld(){
    Array.prototype.forEach.call(bank.children, function(c){ c.classList.remove("held"); });
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(c){ c.classList.remove("held"); });
  }
  var chipEls = [];
  function placeItem(id, zi){
    if(st.graded[st.cur]){ return; }
    place[id] = zi;
    var el = chipEls[id];
    zoneEls[zi].appendChild(el);
    el.classList.remove("held");
  }
  function backToBank(id){
    if(st.graded[st.cur]){ return; }
    place[id] = -1;
    bank.appendChild(chipEls[id]);
  }
  order.forEach(function(id, n){
    var el = makeChip(flat[id].t, true);
    el.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(id)); });
    el.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(place[id] >= 0){ backToBank(id); return; }
      if(held === id){ held = null; clearHeld(); return; }
      held = id; clearHeld(); el.classList.add("held");
    });
    chipEls[id] = el;
    bank.appendChild(el);
  });
  box.appendChild(bank);
  box.appendChild(wrap);
  return {
    collect: function(){ return {place: place.slice()}; }
  };
};

function seqRenderer(kind){
  return function(ex, box){
    var items = ex.data.items;
    var cur = shuffle(items.map(function(_,i){ return i; }));
    var note = kind === "rank"
      ? "Position 1 is the most severe. Use the arrows to move items."
      : "Put the steps in order. Use the arrows to move items.";
    box.appendChild(h("div","smallnote",note));
    var listEl = h("div","seq");
    function paint(){
      listEl.innerHTML = "";
      cur.forEach(function(id, pos){
        var row = h("div","seqrow");
        row.setAttribute("draggable","true");
        row.appendChild(h("span","pos", String(pos+1)));
        row.appendChild(h("span","txt", items[id].t));
        var up = h("button","btn mv","\u2191"); up.type="button"; up.setAttribute("aria-label","Move up");
        var dn = h("button","btn mv","\u2193"); dn.type="button"; dn.setAttribute("aria-label","Move down");
        up.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === 0){ return; }
          var t = cur[pos-1]; cur[pos-1] = cur[pos]; cur[pos] = t; paint();
        });
        dn.addEventListener("click", function(){
          if(st.graded[st.cur] || pos === cur.length-1){ return; }
          var t = cur[pos+1]; cur[pos+1] = cur[pos]; cur[pos] = t; paint();
        });
        row.appendChild(up); row.appendChild(dn);
        row.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
        row.addEventListener("dragover", function(e){ e.preventDefault(); });
        row.addEventListener("drop", function(e){
          e.preventDefault();
          if(st.graded[st.cur]){ return; }
          var from = parseInt(e.dataTransfer.getData("text/plain"),10);
          if(isNaN(from) || from === pos){ return; }
          var moved = cur.splice(from,1)[0];
          cur.splice(pos,0,moved);
          paint();
        });
        listEl.appendChild(row);
      });
    }
    paint();
    box.appendChild(listEl);
    return {
      collect: function(){ return {seq: cur.slice()}; }
    };
  };
}

RENDER.fill = function(ex, box){
  var slots = ex.data.slots;
  var bankWords = ex.data.bank.map(function(w){ return w; });
  var shuffled = shuffle(bankWords);
  var filled = slots.map(function(){ return null; });
  var held = null;
  box.appendChild(h("div","smallnote","Pick a word from the bank and drop it into a blank. Click a filled blank to put the word back. The bank is shuffled and contains extra words."));
  var textEl = h("div","filltext");
  var bankEl = h("div","bank");
  var text = ex.data.text;
  var parts = text.split(/\{(\d+)\}/);
  function makeBankChip(word){
    var c = makeChip(word, true);
    c.dataset.word = word;
    c.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", word); });
    c.addEventListener("click", function(){
      if(st.graded[st.cur]){ return; }
      if(held === word){ held = null; c.classList.remove("held"); return; }
      held = word;
      Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
      c.classList.add("held");
    });
    return c;
  }
  function placeWord(si, word){
    if(filled[si] !== null){ bankEl.appendChild(makeBankChip(filled[si])); }
    filled[si] = word;
    held = null;
    Array.prototype.forEach.call(bankEl.children, function(x){ x.classList.remove("held"); });
    var old = bankEl.querySelector('[data-word="' + word.replace(/"/g,"\\\"") + '"]');
    if(old){ bankEl.removeChild(old); }
    paintText();
  }
  function paintText(){
    textEl.innerHTML = "";
    parts.forEach(function(p, i){
      if(i % 2 === 0){ textEl.appendChild(document.createTextNode(p)); return; }
      (function(si){
        var slot = h("button","slot"); slot.type="button";
        slot.textContent = filled[si] === null ? "blank " + (si+1) : filled[si];
        if(filled[si] !== null){ slot.classList.add("filled"); }
        slot.setAttribute("aria-label","Blank "+(si+1));
        slot.addEventListener("click", function(){
          if(st.graded[st.cur]){ return; }
          if(filled[si] !== null){
            bankEl.appendChild(makeBankChip(filled[si]));
            filled[si] = null; paintText();
          } else if(held !== null){
            placeWord(si, held);
          }
        });
        slot.addEventListener("dragover", function(e){ e.preventDefault(); slot.classList.add("over"); });
        slot.addEventListener("dragleave", function(){ slot.classList.remove("over"); });
        slot.addEventListener("drop", function(e){
          e.preventDefault(); slot.classList.remove("over");
          if(st.graded[st.cur]){ return; }
          var w = e.dataTransfer.getData("text/plain");
          if(w && bankEl.querySelector('[data-word="' + w.replace(/"/g,"\\\"") + '"]')){ placeWord(si, w); }
        });
        textEl.appendChild(slot);
      })(parseInt(p,10));
    });
  }
  shuffled.forEach(function(w){ bankEl.appendChild(makeBankChip(w)); });
  box.appendChild(textEl);
  box.appendChild(h("div","smallnote","Word bank (shuffled):"));
  box.appendChild(bankEl);
  paintText();
  return {
    collect: function(){ return {filled: filled.slice()}; }
  };
};

function linePicker(kind){
  return function(ex, box){
    var multi = !!ex.data.multi;
    if(multi){
      box.appendChild(h("div","smallnote","Select all the lines that apply, then press Check."));
    } else {
      box.appendChild(h("div","smallnote","Click the one line that answers the question, then press Check."));
    }
    var filter = h("input","filterbox");
    filter.type = "text";

    filter.setAttribute("aria-label","Filter log lines");
    var picked = [];
    var listEl = h("div", kind === "log" ? "loglines" : "spotlines");
    function rowClick(i){
      if(st.graded[st.cur]){ return; }
      if(multi){
        var p = picked.indexOf(i);
        if(p >= 0){ picked.splice(p,1); } else { picked.push(i); }
        paint();
      } else {
        picked = [i];
        paint();
      }
    }
    function paint(){
      listEl.innerHTML = "";
      ex.data.lines.forEach(function(line, i){
        if(filter.value && String(line).toLowerCase().indexOf(filter.value.toLowerCase()) < 0){ return; }
        if(kind === "log"){
          var row = h("div","logline");
          row.setAttribute("role","button"); row.setAttribute("tabindex","0");
          row.appendChild(h("span","ln", String(i+1)));
          var body = h("span",null,""); body.innerHTML = hlLog(line);
          row.appendChild(body);
          if(picked.indexOf(i) >= 0){ row.classList.add("sel"); }
          row.addEventListener("click", function(){ rowClick(i); });
          row.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); rowClick(i); } });
          listEl.appendChild(row);
        } else {
          var b = h("button","spotline"); b.type="button";
          b.textContent = line;
          if(picked.indexOf(i) >= 0){ b.classList.add("sel"); }
          b.addEventListener("click", function(){ rowClick(i); });
          listEl.appendChild(b);
        }
      });
      if(!listEl.children.length){
        listEl.appendChild(h("div","logline","(no lines match the filter)"));
      }
    }
    filter.addEventListener("input", paint);
    box.appendChild(filter);
    box.appendChild(listEl);
    paint();
    return {
      collect: function(){ return {picked: picked.slice().sort()}; }
    };
  };
}
