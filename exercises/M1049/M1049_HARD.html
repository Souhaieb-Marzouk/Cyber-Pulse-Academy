    "<p><strong>How the control works.</strong> Antimalware engines use two main ideas. <strong>Signatures</strong> are fingerprints of known malware files. They are fast and exact, but they only work for threats somebody already captured. <strong>Heuristics</strong> (and machine learning) look for suspicious traits — strange code structure, packing, odd behaviour — so they can catch brand-new files. Modern products add: <strong>real-time (on-access) scanning</strong>, which checks every file the moment it is opened, written, or downloaded; <strong>cloud reputation lookups</strong>, which ask the vendor in real time; <strong>script inspection (AMSI on Windows)</strong>, which reads script content even when it runs from memory; <strong>quarantine</strong>, a locked area where caught files cannot run; <strong>tamper protection</strong>, which stops attackers from switching the engine off; <strong>automatic signature updates</strong>; <strong>exclusions</strong>, paths or processes the scanner skips (needed for some software, but each one is a small hole); and <strong>central management</strong>, one console that pushes policy to every endpoint.</p>",

    "</ul>",
    "<p><strong>What it mitigates — and what it cannot do.</strong> The M1049 page in ATT&CK lists techniques it addresses, such as user execution of malicious files (T1204.002), scripting interpreter abuse (T1059, including PowerShell T1059.001), obfuscated or packed files (T1027), tool downloads (T1105), mshta-style proxy execution (T1218.005), and deobfuscation (T1140). But antivirus is not magic. Code that runs <strong>only in memory</strong> (T1620 reflective loading) never becomes a file to scan. A stolen <strong>admin account</strong> can disable or tamper with the engine (T1562.001). Packed or obfuscated files can hide from signatures until heuristics catch up. Every <strong>exclusion</strong> is a small blind spot an attacker can use. That is why teams pair M1049 with behaviour-based EDR, privileged access management, and a good policy.</p>"

    { t: "Endpoint behaviour monitoring that watches process and memory actions", slot: 0 },
    { t: "Remove standing local admin and grant just-in-time elevation", slot: 0 },
    { t: "Install a second antimalware engine on the same host", slot: 1 },

</script>
<script>
/* ============================================================
   CyberPulseAcademy — M1049 practice exam engine (vanilla JS)
   Shared by all four severity files; data comes from window.EXAM_*.
   The assembler wraps engine parts 1-3 in a single IIFE scope.
   ============================================================ */

/* ---------------- config from the data script ---------------- */
var CFG = window.EXAM_CFG;
var INTRO = window.EXAM_INTRO;
var EXS = window.EXAM_EXERCISES;

/* ---------------- tiny DOM helpers ---------------- */
function byId(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function btn(label, cls, handler) {
  var b = el('button', cls, label);
  b.type = 'button';
  b.addEventListener('click', handler);
  return b;
}
function shuffled(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function clockFmt(sec) { return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
function one(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function pctOf(sum, n) { return n > 0 ? Math.round((sum / n) * 100) : 0; }

/* ---------------- scoring: credit = max(0, (H - W) / N) ---------------- */
function scoreExercise(selected, correct) {
  var ok = {};
  var i;
  for (i = 0; i < correct.length; i++) ok[correct[i]] = true;
  var H = 0, W = 0;
  for (i = 0; i < selected.length; i++) {
    if (ok[selected[i]]) H++; else W++;
  }
  var N = correct.length;
  if (N === 0) return 1;
  var c = (H - W) / N;
  if (c < 0) c = 0;
  if (c > 1) c = 1;
  return c;
}
function itemBreakdown(selected, correct) {
  var selMap = {}, corMap = {}, out = [], i;
  for (i = 0; i < selected.length; i++) selMap[selected[i]] = true;
  for (i = 0; i < correct.length; i++) {
    corMap[correct[i]] = true;
    out.push({ key: correct[i], status: selMap[correct[i]] ? 'correct' : 'missed' });
  }
  for (i = 0; i < selected.length; i++) {
    if (!corMap[selected[i]]) out.push({ key: selected[i], status: 'wrong' });
  }
  return out;
}

/* ---------------- global state ---------------- */
var T = {
  state: 'IDLE', remaining: 0, prev: null, stamp: 0,
  manualSec: 0, autoSec: 0, tick: null
};
var S = {
  order: [], pos: 0, idx: -1,
  answered: {}, skipped: {}, hintUsed: {},
  creditSum: 0, answeredCount: 0,
  mode: 'sequence', checked: false, reported: false,
  started: false, counterOverride: null
};
var W = null;           /* current widget controller */
var SCREEN = 'intro';   /* intro | exam | review | results */
var lastResult = null;
var handshakeName = '';

/* ---------------- timer state machine ----------------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
   Check  -> PAUSED_AUTO_CHECK (before feedback renders)
   Next   -> RUNNING (or ENDED at the end)
   Pause  -> PAUSED_MANUAL (exercise hidden); Resume -> previous state
   Skip / Hint -> no state change (timer keeps running)
------------------------------------------------------- */
function setState(next) {
  var now = Date.now();
  if (T.state === 'PAUSED_MANUAL') T.manualSec += (now - T.stamp) / 1000;
  else if (T.state === 'PAUSED_AUTO_CHECK') T.autoSec += (now - T.stamp) / 1000;
  T.state = next;
  T.stamp = now;
  paintHeader();
}
function startTicker() {
  if (T.tick) clearInterval(T.tick);
  T.tick = setInterval(function () {
    if (T.state !== 'RUNNING') return;
    T.remaining -= 1;
    paintHeader();
    if (T.remaining <= 0) { T.remaining = 0; onTimeout(); }
  }, 1000);
}
function stopTicker() {
  if (T.tick) { clearInterval(T.tick); T.tick = null; }
}
function onTimeout() {
  setState('ENDED');
  stopTicker();
  showResults();
}

/* ---------------- persistent header ---------------- */
function buildHeader(counterText) {
  var hdr = el('div', 'hdr'); hdr.id = 'hdr';
  var l = el('div', 'hdr-l');
  var cnt = el('span', 'hdr-count', counterText || ''); cnt.id = 'hdr-count';
  l.appendChild(cnt);
  l.appendChild(el('span', 'badge badge-' + CFG.sevClass, CFG.severityLabel));
  hdr.appendChild(l);
  var r = el('div', 'hdr-r');
  var ts = el('span', 'tstate', ''); ts.id = 'hdr-tstate';
  var tc = el('span', 'tclock', ''); tc.id = 'hdr-tclock';
  var sc = el('span', 'score', ''); sc.id = 'hdr-score';
  var bh = btn('Hint', 'btn btn-ghost', onHint); bh.id = 'btn-hint';
  var bp = btn('Pause', 'btn btn-ghost', onPauseToggle); bp.id = 'btn-pause';
  var bs = btn('Skip', 'btn btn-ghost', onSkip); bs.id = 'btn-skip';
  r.appendChild(ts); r.appendChild(tc); r.appendChild(sc);
  r.appendChild(bh); r.appendChild(bp); r.appendChild(bs);
  hdr.appendChild(r);
  S.counterOverride = counterText || null;
  paintHeader();
  return hdr;
}
function paintHeader() {
  var cnt = byId('hdr-count');
  if (!cnt) return;
  if (S.counterOverride) cnt.textContent = S.counterOverride;
  else if (SCREEN === 'review') cnt.textContent = 'Review skipped — ' + Object.keys(S.skipped).length + ' left';
  else cnt.textContent = 'Exercise ' + Math.min(S.pos + 1, S.order.length) + ' of ' + S.order.length;
  var map = {
    IDLE: ['Ready', 't-idle'],
    RUNNING: ['▶ Running', 't-run'],
    PAUSED_MANUAL: ['⏸ PAUSED — manual (press Resume)', 't-pm'],
    PAUSED_AUTO_CHECK: ['⏸ PAUSED — reviewing feedback (resumes on Next)', 't-pa'],
    ENDED: ['⏹ Ended', 't-end']
  };
  var m = map[T.state] || map.IDLE;
  var ts = byId('hdr-tstate');
  if (ts) { ts.textContent = m[0]; ts.className = 'tstate ' + m[1]; }
  var tc = byId('hdr-tclock');
  if (tc) tc.textContent = clockFmt(T.remaining);
  var sc = byId('hdr-score');
  if (sc) sc.textContent = one(S.creditSum) + ' / ' + S.answeredCount + ' · ' + pctOf(S.creditSum, S.answeredCount) + '%';
  var bh = byId('btn-hint'), bs = byId('btn-skip');
  if (bh) bh.disabled = S.checked || !!S.hintUsed[S.idx];
  if (bs) bs.disabled = S.checked;
}

/* ---------------- flash + hint ---------------- */
var flashTimer = null;
function flash(msg) {
  var f = byId('flash');
  if (!f) return;
  f.textContent = '';
  f.appendChild(el('p', 'flmsg', msg));
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function () {
    var ff = byId('flash');
    if (ff) ff.textContent = '';
  }, 4000);
}
function onHint() {
  if (S.checked || SCREEN !== 'exam') return;
  if (S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx] = true;
  var hb = byId('hintbox');
  if (hb) {
    hb.textContent = '';
    hb.appendChild(el('div', null, EXS[S.idx].hint));
    hb.style.display = '';
  }
  paintHeader();
  /* Hint never changes the timer state; the clock keeps running. */
}

/* ---------------- manual pause ---------------- */
function onPauseToggle() {
  if (T.state === 'PAUSED_MANUAL') {
    hidePauseOverlay();
    setState(T.prev || 'RUNNING');
    return;
  }
  if (T.state !== 'RUNNING' && T.state !== 'PAUSED_AUTO_CHECK') return;
  T.prev = T.state;
  setState('PAUSED_MANUAL');
  showPauseOverlay();
}
function showPauseOverlay() {
  hidePauseOverlay();
  var ov = el('div', 'pauseov'); ov.id = 'pauseov';
  var card = el('div', 'pausecard');
  card.appendChild(el('div', 'ptitle', '⏸ PAUSED — manual break'));
  card.appendChild(el('p', null, 'The exercise is hidden while you pause. The timer is stopped. Press Resume when you are ready to continue.'));
  card.appendChild(btn('Resume', 'btn btn-primary btn-big', onPauseToggle));
  ov.appendChild(card);
  document.body.appendChild(ov);
}
function hidePauseOverlay() {
  var ov = byId('pauseov');
  if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
}

/* ---------------- skip ---------------- */
function onSkip() {
  if (S.checked || SCREEN !== 'exam') return;
  S.skipped[S.idx] = true;
  if (S.mode === 'review') { renderReview(); return; }
  S.pos += 1;
  if (S.pos < S.order.length) renderExamScreen(null);
  else finishAttempt();
  /* Skip never stops the timer and never reveals the answer. */
}

/* ============================================================
   Engine part 2 — interactive answer widgets.
   Each builder returns a controller:
   { node, getSelected(), correctKeys(), correctDisplay(),
     itemsFor(sel), keyLabel(key), lock(), ready(), solve() }
   ============================================================ */

var WIDGETS = {
  qcm: function (ex) { return buildChoice(ex, false); },
  multi: function (ex) { return buildChoice(ex, true); },
  match: buildMatch,
  dnd: buildDnd,
  order: function (ex) { return buildOrder(ex, false); },
  rank: function (ex) { return buildOrder(ex, true); },
  fill: buildFill,
  lines: buildLines,
  triage: buildTriage,
  branch: buildBranch
};

function breakdownFor(sel, correct, labelFn) {
  var items = itemBreakdown(sel, correct), i;
  for (i = 0; i < items.length; i++) {
    items[i].label = labelFn ? labelFn(items[i].key) : items[i].key;
  }
  return items;
}

/* ---------- single-choice and multi-choice ---------- */
function buildChoice(ex, multi) {
  var opts = shuffled(ex.opts);
  var sel = {};
  var locked = false;
  var node = el('div', 'opts');
  var rows = [];
  opts.forEach(function (o) {
    var row = el('button', 'opt');
    row.type = 'button';
    row.setAttribute('aria-pressed', 'false');
    row.appendChild(el('span', null, o.t));
    row.addEventListener('click', function () {
      if (locked) return;
      if (multi) {
        sel[o.t] = !sel[o.t];
        row.classList.toggle('sel', !!sel[o.t]);
        row.setAttribute('aria-pressed', sel[o.t] ? 'true' : 'false');
      } else {
        sel = {};
        sel[o.t] = true;
        rows.forEach(function (r) { r.classList.remove('sel'); r.setAttribute('aria-pressed', 'false'); });
        row.classList.add('sel');
        row.setAttribute('aria-pressed', 'true');
      }
    });
    rows.push(row);
    node.appendChild(row);
  });
  return {
    node: node,
    getSelected: function () {
      var out = [], i;
      for (i = 0; i < opts.length; i++) if (sel[opts[i].t]) out.push(opts[i].t);
      return out;
    },
    correctKeys: function () {
      return opts.filter(function (o) { return o.ok; }).map(function (o) { return o.t; });
    },
    correctDisplay: function () {
      return opts.filter(function (o) { return o.ok; }).map(function (o) { return o.t; });
    },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), null); },
    keyLabel: function (k) { return k; },
    lock: function () { locked = true; rows.forEach(function (r) { r.disabled = true; }); },
    ready: function () { return true; },
    solve: function () {
      sel = {};
      opts.forEach(function (o, k) {
        sel[o.t] = !!o.ok;
        rows[k].classList.toggle('sel', !!o.ok);
        rows[k].setAttribute('aria-pressed', o.ok ? 'true' : 'false');
      });
    }
  };
}

/* ---------- matching (click left, then right) ---------- */
function buildMatch(ex) {
  var rights = shuffled(ex.pairs.map(function (p) { return p.r; }));
  var assign = [];
  var i;
  for (i = 0; i < ex.pairs.length; i++) assign.push(null);
  var selLeft = -1;
  var locked = false;
  var chips = {}, slotEls = [], rows = [];
  var wrap = el('div', 'matchwrap');
  var leftCol = el('div', 'matchcol');
  var rightCol = el('div', 'matchcol');
  rightCol.appendChild(el('div', 'banknote', 'Matches — click a left item first, then one of these.'));
  ex.pairs.forEach(function (p, idx) {
    var row = el('div', 'pairrow');
    row.setAttribute('tabindex', '-1');
    var lab = el('span', 'mlabel', p.l);
    var slot = el('button', 'mslot', '— choose —');
    slot.type = 'button';
    slot.addEventListener('click', function () {
      if (locked) return;
      if (assign[idx] !== null) {
        chips[assign[idx]].classList.remove('used');
        assign[idx] = null;
        slot.textContent = '— choose —';
        slot.classList.remove('filled');
      } else {
        selLeft = (selLeft === idx ? -1 : idx);
        rows.forEach(function (r, k) { r.classList.toggle('sel', k === selLeft); });
      }
    });
    row.appendChild(lab);
    row.appendChild(slot);
    rows.push(row);
    slotEls.push(slot);
    leftCol.appendChild(row);
  });
  rights.forEach(function (r) {
    var chip = btn(r, 'chip', function () {
      if (locked) return;
      if (assign.indexOf(r) >= 0) return;
      if (selLeft < 0) { flash('First click a left item, then click its match here.'); return; }
      var t = selLeft;
      if (assign[t] !== null) chips[assign[t]].classList.remove('used');
      assign[t] = r;
      slotEls[t].textContent = r;
      slotEls[t].classList.add('filled');
      chip.classList.add('used');
      selLeft = -1;
      rows.forEach(function (rr) { rr.classList.remove('sel'); });
    });
    chips[r] = chip;
    rightCol.appendChild(chip);
  });
  wrap.appendChild(leftCol);
  wrap.appendChild(rightCol);
  return {
    node: wrap,
    getSelected: function () {
      var out = [];
      ex.pairs.forEach(function (p, k) { if (assign[k] !== null) out.push(p.l + ' → ' + assign[k]); });
      return out;
    },
    correctKeys: function () { return ex.pairs.map(function (p) { return p.l + ' → ' + p.r; }); },
    correctDisplay: function () { return ex.pairs.map(function (p) { return p.l + ' → ' + p.r; }); },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), null); },
    keyLabel: function (k) { return k; },
    lock: function () {
      locked = true;
      slotEls.forEach(function (sl) { sl.disabled = true; });
      Object.keys(chips).forEach(function (k) { chips[k].disabled = true; });
    },
    ready: function () { return true; },
    solve: function () {
      ex.pairs.forEach(function (p, k) {
        if (assign[k] !== null) chips[assign[k]].classList.remove('used');
        assign[k] = p.r;
        chips[p.r].classList.add('used');
        slotEls[k].textContent = p.r;
        slotEls[k].classList.add('filled');
      });
    }
  };
}

/* ---------- drag & drop into slots (pointer drag + tap-to-place) ---------- */
function attachDrag(chip, itemText, slots, onDrop) {
  var startX = 0, startY = 0, dragging = false, ghost = null;
  chip.addEventListener('pointerdown', function (ev) {
    startX = ev.clientX; startY = ev.clientY; dragging = false;
    function move(e) {
      if (!dragging && (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6)) {
        dragging = true;
        ghost = chip.cloneNode(true);
        ghost.className = 'chip ghost';
        document.body.appendChild(ghost);
      }
      if (dragging && ghost) {
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
      }
    }
    function up(e) {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      if (dragging) {
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
        var tgt = document.elementFromPoint(e.clientX, e.clientY);
        var node = tgt, slotIdx = -1;
        while (node) {
          if (node.getAttribute) {
            var ds = node.getAttribute('data-slot');
            if (ds !== null && ds !== undefined && ds !== '') { slotIdx = parseInt(ds, 10); break; }
          }
          node = node.parentNode;
        }
        if (slotIdx >= 0) onDrop(itemText, slotIdx);
        ev.preventDefault();
      }
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}

function buildDnd(ex) {
  var locked = false;
  var slotOf = {}, itemEls = {}, slotEls = [];
  var Wsel = null;
  var wrap = el('div', 'dndwrap');
  wrap.appendChild(el('p', 'ansnote', 'Drag an item into a slot, or click the item and then the slot. Click a placed item to take it back.'));
  var slotsRow = el('div', 'dndslots');
  ex.slots.forEach(function (s, i) {
    var d = el('div', 'slot');
    d.setAttribute('role', 'button');
    d.setAttribute('tabindex', '0');
    d.setAttribute('data-slot', String(i));
    d.appendChild(el('div', 'slotname', s));
    var holder = el('div', 'slothold');
    d.appendChild(holder);
    d.__holder = holder;
    function placeHere() {
      if (locked || Wsel === null) return;
      place(Wsel, i);
      Wsel = null;
      Object.keys(itemEls).forEach(function (k) { itemEls[k].classList.remove('selchip'); });
    }
    d.addEventListener('click', placeHere);
    d.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); placeHere(); }
    });
    slotEls.push(d);
    slotsRow.appendChild(d);
  });
  var bank = el('div', 'chipbank');
  ex.items.forEach(function (it) { slotOf[it.t] = -1; });
  shuffled(ex.items.map(function (it) { return it.t; })).forEach(function (t) {
    var chip = el('button', 'chip', t);
    chip.type = 'button';
    chip.addEventListener('click', function () {
      if (locked) return;
      if (slotOf[t] >= 0) { returnToBank(t); return; }
      Wsel = (Wsel === t ? null : t);
      Object.keys(itemEls).forEach(function (k) { itemEls[k].classList.remove('selchip'); });
      if (Wsel === t) chip.classList.add('selchip');
    });
    itemEls[t] = chip;
    bank.appendChild(chip);
    attachDrag(chip, t, slotEls, function (itemText, slotIndex) {
      if (locked) return;
      place(itemText, slotIndex);
    });
  });
  function returnToBank(t) {
    var idx = slotOf[t];
    if (idx >= 0) {
      var hold = slotEls[idx].__holder;
      if (itemEls[t].parentNode === hold && hold.removeChild) hold.removeChild(itemEls[t]);
      bank.appendChild(itemEls[t]);
      slotEls[idx].classList.remove('filled');
      slotOf[t] = -1;
    }
  }
  function place(t, si) {
    if (slotOf[t] >= 0) returnToBank(t);
    slotOf[t] = si;
    slotEls[si].__holder.appendChild(itemEls[t]);
    slotEls[si].classList.add('filled');
  }
  wrap.appendChild(slotsRow);
  wrap.appendChild(el('div', 'banknote', 'Item bank:'));
  wrap.appendChild(bank);
  return {
    node: wrap,
    getSelected: function () {
      var out = [], i;
      for (i = 0; i < ex.items.length; i++) {
        if (slotOf[ex.items[i].t] >= 0) out.push(ex.items[i].t + ' → ' + ex.slots[slotOf[ex.items[i].t]]);
      }
      return out;
    },
    correctKeys: function () { return ex.items.map(function (it) { return it.t + ' → ' + ex.slots[it.slot]; }); },
    correctDisplay: function () { return ex.items.map(function (it) { return it.t + ' → ' + ex.slots[it.slot]; }); },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), null); },
    keyLabel: function (k) { return k; },
    lock: function () { locked = true; Object.keys(itemEls).forEach(function (k) { itemEls[k].disabled = true; }); },
    ready: function () { return true; },
    solve: function () {
      ex.items.forEach(function (it) { returnToBank(it.t); });
      ex.items.forEach(function (it) { place(it.t, it.slot); });
    }
  };
}

/* ---------- ordering / ranking ---------- */
function buildOrder(ex, isRank) {
  var locked = false;
  var cur = shuffled(ex.items);
  var list = el('ol', 'ordlist');
  var wrap = el('div');
  wrap.appendChild(el('p', 'ansnote', isRank
    ? 'Rank the items: position 1 = do first / most urgent. Use the arrows or drag a row.'
    : 'Put the steps in the right order, first at the top. Use the arrows or drag a row.'));
  function render() {
    list.textContent = '';
    cur.forEach(function (t, i) {
      var li = el('li', 'orditem');
      li.setAttribute('data-pos', String(i));
      li.appendChild(el('span', 'ordnum', isRank ? ('Rank ' + (i + 1)) : ('Step ' + (i + 1))));
      li.appendChild(el('span', 'ordtext', t));
      var ctr = el('span', 'ordbtns');
      ctr.appendChild(btn('▲', 'mini', function () {
        if (locked || i === 0) return;
        var tmp = cur[i - 1]; cur[i - 1] = cur[i]; cur[i] = tmp;
        render();
      }));
      ctr.appendChild(btn('▼', 'mini', function () {
        if (locked || i === cur.length - 1) return;
        var tmp = cur[i + 1]; cur[i + 1] = cur[i]; cur[i] = tmp;
        render();
      }));
      li.appendChild(ctr);
      list.appendChild(li);
      attachOrderDrag(li, i);
    });
  }
  function attachOrderDrag(li, fromIdx) {
    var startY = 0, dragging = false;
    li.addEventListener('pointerdown', function (ev) {
      if (ev.target && ev.target.tagName === 'BUTTON') return;
      startY = ev.clientY; dragging = false;
      function move(e) {
        if (!dragging && Math.abs(e.clientY - startY) > 8) dragging = true;
      }
      function up(e) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        if (!dragging) return;
        var tgt = document.elementFromPoint(e.clientX, e.clientY);
        var node = tgt, toIdx = -1;
        while (node) {
          if (node.getAttribute && node.getAttribute('data-pos') !== null && node.getAttribute('data-pos') !== undefined && node.getAttribute('data-pos') !== '') {
            toIdx = parseInt(node.getAttribute('data-pos'), 10);
            break;
          }
          node = node.parentNode;
        }
        if (toIdx >= 0 && toIdx !== fromIdx) {
          var moving = cur.splice(fromIdx, 1)[0];
          cur.splice(toIdx, 0, moving);
          render();
        }
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }
  render();
  wrap.appendChild(list);
  return {
    node: wrap,
    getSelected: function () {
      var out = [], i;
      for (i = 0; i < cur.length; i++) out.push(i + '|' + cur[i]);
      return out;
    },
    correctKeys: function () {
      return ex.items.map(function (t, i) { return i + '|' + t; });
    },
    correctDisplay: function () {
      return ex.items.map(function (t, i) { return (isRank ? 'Rank ' : 'Position ') + (i + 1) + ' — ' + t; });
    },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), function (k) { var p = k.split('|'); return (isRank ? 'Rank ' : 'Position ') + (parseInt(p[0], 10) + 1) + ' — ' + p[1]; }); },
    keyLabel: function (k) { var p = k.split('|'); return (isRank ? 'Rank ' : 'Position ') + (parseInt(p[0], 10) + 1) + ' — ' + p[1]; },
    lock: function () { locked = true; },
    ready: function () { return true; },
    solve: function () { cur = ex.items.slice(); render(); }
  };
}

/* ---------- fill in the blanks ---------- */
function buildFill(ex) {
  var locked = false;
  var nBlanks = ex.answers.length;
  var filled = [], i;
  for (i = 0; i < nBlanks; i++) filled.push(null);
  var chips = {}, blanks = [];
  var selectedBlank = -1;
  var wrap = el('div');
  wrap.appendChild(el('p', 'ansnote', 'Click a word, then a blank — or click a blank first, then a word. Click a filled blank to empty it.'));
  var para = el('p', 'filltext');
  var parts = ex.text.split(/\{(\d+)\}/);
  var fragm = document.createDocumentFragment();
  for (i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      if (parts[i]) fragm.appendChild(el('span', null, parts[i]));
    } else {
      var b = parseInt(parts[i], 10);
      var blank = el('button', 'blank', '____ ' + (b + 1) + ' ____');
      blank.type = 'button';
      (function (bidx, bEl) {
        bEl.addEventListener('click', function () {
          if (locked) return;
          if (filled[bidx]) {
            chips[filled[bidx]].classList.remove('used');
            filled[bidx] = null;
            bEl.textContent = '____ ' + (bidx + 1) + ' ____';
            bEl.classList.remove('filledblank');
            if (selectedBlank === bidx) selectedBlank = -1;
          } else {
            /* select this blank; the next word clicked goes into it */
            selectedBlank = (selectedBlank === bidx ? -1 : bidx);
            blanks.forEach(function (bb, k) { bb.classList.toggle('sel', k === selectedBlank); });
          }
        });
      })(b, blank);
      blanks[b] = blank;
      fragm.appendChild(blank);
    }
  }
  para.appendChild(fragm);
  wrap.appendChild(para);
  var bank = el('div', 'chipbank');
  shuffled(ex.bank).forEach(function (w) {
    var chip = btn(w, 'chip', function () {
      if (locked) return;
      if (filled.indexOf(w) >= 0) return;
      var target = -1, k;
      if (selectedBlank >= 0 && filled[selectedBlank] === null) {
        target = selectedBlank;              /* blank was clicked first */
      } else {
        for (k = 0; k < filled.length; k++) if (filled[k] === null) { target = k; break; }
      }
      if (target < 0) { flash('All blanks are filled. Click a filled blank to change it.'); return; }
      filled[target] = w;
      blanks[target].textContent = w;
      blanks[target].classList.add('filledblank');
      blanks[target].classList.remove('sel');
      selectedBlank = -1;
      blanks.forEach(function (bb) { bb.classList.remove('sel'); });
      chip.classList.add('used');
    });
    chips[w] = chip;
    bank.appendChild(chip);
  });
  wrap.appendChild(el('div', 'banknote', 'Word bank:'));
  wrap.appendChild(bank);
  function clearOne(idx) {
    if (filled[idx]) {
      chips[filled[idx]].classList.remove('used');
      filled[idx] = null;
      blanks[idx].textContent = '____ ' + (idx + 1) + ' ____';
      blanks[idx].classList.remove('filledblank');
    }
    if (selectedBlank === idx) selectedBlank = -1;
  }
  return {
    node: wrap,
    getSelected: function () {
      var out = [], k;
      for (k = 0; k < filled.length; k++) if (filled[k]) out.push('b' + k + ':' + filled[k]);
      return out;
    },
    correctKeys: function () { return ex.answers.map(function (w, k) { return 'b' + k + ':' + w; }); },
    correctDisplay: function () { return ex.answers.map(function (w, k) { return 'Blank ' + (k + 1) + ' — ' + w; }); },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), function (k) { var p = k.split(':'); return 'Blank ' + (parseInt(p[0].slice(1), 10) + 1) + ' — ' + p[1]; }); },
    keyLabel: function (k) { var p = k.split(':'); return 'Blank ' + (parseInt(p[0].slice(1), 10) + 1) + ' — ' + p[1]; },
    lock: function () { locked = true; Object.keys(chips).forEach(function (k) { chips[k].disabled = true; }); blanks.forEach(function (b) { b.disabled = true; }); },
    ready: function () { return true; },
    solve: function () {
      for (var k = 0; k < nBlanks; k++) clearOne(k);
      ex.answers.forEach(function (w, k) {
        filled[k] = w;
        blanks[k].textContent = w;
        blanks[k].classList.add('filledblank');
        if (chips[w]) chips[w].classList.add('used');
      });
    }
  };
}

/* ---------- clickable log lines ---------- */
function buildLines(ex) {
  var locked = false;
  var sel = {}, rowEls = [];
  var node = el('div', 'lines');
  ex.lines.forEach(function (ln, i) {
    var row = el('div', 'ln');
    row.setAttribute('role', 'checkbox');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-checked', 'false');
    row.appendChild(el('span', 'lnno', String(i + 1)));
    row.appendChild(el('span', 'lntext', ln.t));
    function toggle() {
      if (locked) return;
      sel[i] = !sel[i];
      row.classList.toggle('sel', !!sel[i]);
      row.setAttribute('aria-checked', sel[i] ? 'true' : 'false');
    }
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
    });
    rowEls.push(row);
    node.appendChild(row);
  });
  return {
    node: node,
    getSelected: function () {
      var out = [], i;
      for (i = 0; i < ex.lines.length; i++) if (sel[i]) out.push('L' + i);
      return out;
    },
    correctKeys: function () {
      var out = [], i;
      for (i = 0; i < ex.lines.length; i++) if (ex.lines[i].ok) out.push('L' + i);
      return out;
    },
    correctDisplay: function () {
      var out = [], i;
      for (i = 0; i < ex.lines.length; i++) if (ex.lines[i].ok) out.push('Line ' + (i + 1));
      return out;
    },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), function (k) { return 'Line ' + (parseInt(k.slice(1), 10) + 1); }); },
    keyLabel: function (k) { return 'Line ' + (parseInt(k.slice(1), 10) + 1); },
    lock: function () { locked = true; },
    ready: function () { return true; },
    solve: function () {
      ex.lines.forEach(function (ln, i) {
        sel[i] = !!ln.ok;
        rowEls[i].classList.toggle('sel', !!ln.ok);
        rowEls[i].setAttribute('aria-checked', ln.ok ? 'true' : 'false');
      });
    }
  };
}

/* ---------- SOC alert triage queue ---------- */
function buildTriage(ex) {
  var locked = false;
  var choice = [], segMaps = [];
  var node = el('div', 'triage');
  ex.alerts.forEach(function (a, i) {
    choice.push(null);
    var card = el('div', 'tcard');
    card.appendChild(el('div', 'ttitle', a.title));
    card.appendChild(el('div', 'tmeta', a.meta));
    var seg = el('div', 'seg');
    var map = {};
    ex.actions.forEach(function (act) {
      var b = btn(act, 'segbtn', function () {
        if (locked) return;
        choice[i] = act;
        Object.keys(map).forEach(function (k) { map[k].classList.remove('sel'); });
        b.classList.add('sel');
      });
      map[act] = b;
      seg.appendChild(b);
    });
    segMaps.push(map);
    card.appendChild(seg);
    node.appendChild(card);
  });
  return {
    node: node,
    getSelected: function () {
      var out = [], i;
      for (i = 0; i < ex.alerts.length; i++) if (choice[i]) out.push(i + ':' + choice[i]);
      return out;
    },
    correctKeys: function () { return ex.alerts.map(function (a, i) { return i + ':' + a.correct; }); },
    correctDisplay: function () { return ex.alerts.map(function (a, i) { return 'Alert ' + (i + 1) + ' — ' + a.correct; }); },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), function (k) { var p = k.split(':'); return 'Alert ' + (parseInt(p[0], 10) + 1) + ' — ' + p[1]; }); },
    keyLabel: function (k) { var p = k.split(':'); return 'Alert ' + (parseInt(p[0], 10) + 1) + ' — ' + p[1]; },
    lock: function () {
      locked = true;
      segMaps.forEach(function (m) { Object.keys(m).forEach(function (k) { m[k].disabled = true; }); });
    },
    ready: function () { return true; },
    solve: function () {
      ex.alerts.forEach(function (a, i) {
        choice[i] = a.correct;
        Object.keys(segMaps[i]).forEach(function (k) { segMaps[i][k].classList.remove('sel'); });
        segMaps[i][a.correct].classList.add('sel');
      });
    }
  };
}

/* ---------- branching decision scenario ---------- */
function buildBranch(ex, ctx) {
  var locked = false;
  var stepIdx = 0;
  var picks = [];
  var ansNode = el('div', 'opts');
  function renderStep() {
    ctx.questionBody.textContent = '';
    ctx.questionBody.appendChild(el('span', 'stepbadge', 'STEP ' + (Math.min(stepIdx, ex.steps.length - 1) + 1) + ' OF ' + ex.steps.length));
    ctx.questionBody.appendChild(el('p', 'stepq', ex.steps[Math.min(stepIdx, ex.steps.length - 1)].q));
    ansNode.textContent = '';
    if (stepIdx >= ex.steps.length) return;
    ex.steps[stepIdx].opts.forEach(function (o) {
      var row = el('button', 'opt');
      row.type = 'button';
      row.setAttribute('aria-pressed', 'false');
      row.appendChild(el('span', null, o.t));
      row.addEventListener('click', function () {
        if (locked) return;
        picks[stepIdx] = o.t;
        Array.prototype.forEach.call(ansNode.children, function (c) { c.classList.remove('sel'); });
        row.classList.add('sel');
        row.setAttribute('aria-pressed', 'true');
        if (stepIdx < ex.steps.length - 1) {
          stepIdx += 1;
          setTimeout(renderStep, 350); /* intermediate step: timer keeps running */
        } else {
          ctx.onBranchFinal();
        }
      });
      ansNode.appendChild(row);
    });
  }
  renderStep();
  return {
    node: ansNode,
    getSelected: function () {
      var out = [], k;
      for (k = 0; k < picks.length; k++) if (picks[k]) out.push('s' + k + ':' + picks[k]);
      return out;
    },
    correctKeys: function () {
      return ex.steps.map(function (st, k) {
        var okOpt = st.opts.filter(function (o) { return o.ok; })[0];
        return 's' + k + ':' + okOpt.t;
      });
    },
    correctDisplay: function () {
      return ex.steps.map(function (st, k) {
        var okOpt = st.opts.filter(function (o) { return o.ok; })[0];
        return 'Step ' + (k + 1) + ' — ' + okOpt.t;
      });
    },
    itemsFor: function (s) { return breakdownFor(s, this.correctKeys(), function (k) { var p = k.split(':'); return 'Step ' + (parseInt(p[0].slice(1), 10) + 1) + ' — ' + p[1]; }); },
    keyLabel: function (k) { var p = k.split(':'); return 'Step ' + (parseInt(p[0].slice(1), 10) + 1) + ' — ' + p[1]; },
    lock: function () { locked = true; },
    ready: function () { return picks.length === ex.steps.length && picks.indexOf(undefined) === -1; },
    solve: function () {
      picks = ex.steps.map(function (st) {
        return st.opts.filter(function (o) { return o.ok; })[0].t;
      });
      stepIdx = ex.steps.length;
    }
  };
}

   Engine part 3 — exercise rendering, grading flow, screens,
   results, website integration, boot.

/* ---------------- scenario / question / answer blocks ---------------- */
function buildScenario(ex) {
  var blk = el('section', 'blk blk-scen');
  var h = el('div', 'blk-h');

  });

function renderExerciseInto(card, idx, isReview) {
  var ex = EXS[idx];
  S.idx = idx;
  S.checked = false;
  W = null;
  lastResult = null;
  card.textContent = '';
  var tr = el('div', 'extitlerow');
  tr.appendChild(el('h2', 'extitle', ex.id + ' — ' + ex.title));
  if (isReview) tr.appendChild(el('span', 'revtag', 'RETURNED FROM SKIP POOL'));
  card.appendChild(tr);
  card.appendChild(buildScenario(ex));

  var qblk = el('section', 'blk blk-q');
  var qh = el('div', 'blk-h');
  qh.appendChild(el('span', 'blkword', 'QUESTION'));
  qblk.appendChild(qh);
  var qb = el('div', 'blk-b'); qb.id = 'qbody';
  qb.appendChild(el('p', 'qtext', ex.q));
  qblk.appendChild(qb);
  card.appendChild(qblk);

  var hintbox = el('div', 'hintbox'); hintbox.id = 'hintbox';
  hintbox.style.display = 'none';
  card.appendChild(hintbox);

  var abl = el('section', 'blk blk-ans');
  var ah = el('div', 'blk-h');
  ah.appendChild(el('span', 'blkword', 'YOUR ANSWER'));
  abl.appendChild(ah);

  abl.appendChild(awrap);
  card.appendChild(abl);

  var ctx = {
    questionBody: qb,
    onBranchFinal: function () { var cb = byId('btn-check'); if (cb) cb.style.display = ''; }
  };
  var w = (ex.type === 'branch') ? WIDGETS.branch(ex, ctx) : WIDGETS[ex.type](ex);
  W = w;
  awrap.appendChild(w.node);

  var fl = el('div', 'flash'); fl.id = 'flash';
  card.appendChild(fl);
  var fbw = el('div'); fbw.id = 'fbwrap';
  card.appendChild(fbw);

  var foot = el('div', 'foot');
  var checkB = btn('Check answer', 'btn btn-primary', onCheck);
  checkB.id = 'btn-check';
  var nextB = btn(nextLabel(), 'btn btn-ok', onNext);
  nextB.id = 'btn-next';
  nextB.style.display = 'none';
  foot.appendChild(checkB);
  foot.appendChild(nextB);
  card.appendChild(foot);
  if (ex.type === 'branch') checkB.style.display = 'none';
  paintHeader();
}

function nextLabel() {
  if (S.mode === 'review') return 'Next';
  if (S.pos >= S.order.length - 1 && Object.keys(S.skipped).length === 0) return 'Final Submit';
  if (S.pos >= S.order.length - 1) return 'Finish';
  return 'Next exercise';
}

/* ---------------- check / next / finish ---------------- */
function onCheck() {
  if (S.checked || !W || SCREEN !== 'exam') return;
  var sel = W.getSelected();
  if (!sel.length) { flash('Choose or place an answer first.'); return; }
  if (W.ready && !W.ready()) { flash('Answer every step first.'); return; }
  setState('PAUSED_AUTO_CHECK'); /* first action: timer stops before feedback renders */
  var base = scoreExercise(sel, W.correctKeys());
  var credit = S.hintUsed[S.idx] ? Math.max(0, base - 0.1) : base;
  credit = Math.round(credit * 1000) / 1000;
  var okMap = {}, Hn = 0, Wn = 0, i;
  var correctKeys = W.correctKeys();
  for (i = 0; i < correctKeys.length; i++) okMap[correctKeys[i]] = true;
  for (i = 0; i < sel.length; i++) { if (okMap[sel[i]]) Hn++; else Wn++; }
  lastResult = { H: Hn, W: Wn, N: correctKeys.length, sel: sel };
  S.creditSum += credit;
  S.answeredCount += 1;
  S.answered[S.idx] = credit;
  delete S.skipped[S.idx];
  S.checked = true;
  if (W.lock) W.lock();
  var cb = byId('btn-check'); if (cb) cb.style.display = 'none';
  var nb = byId('btn-next'); if (nb) { nb.textContent = nextLabel(); nb.style.display = ''; }
  renderFeedback(credit, W);
  paintHeader();
}

function onNext() {
  if (!S.checked) return;
  if (S.mode === 'review') {
    if (Object.keys(S.skipped).length === 0) showResults();
    else {
      /* Returning to the review-skipped screen resumes the timer (spec:
         the auto-pause ends when the learner returns to that screen). */
      if (T.state === 'PAUSED_AUTO_CHECK') setState('RUNNING');
      renderReview();
    }
    return;
  }
  S.pos += 1;
  if (S.pos < S.order.length) {
    setState('RUNNING');
    renderExamScreen(null);
  } else {
    finishAttempt();
  }
}

function finishAttempt() {
  var pool = Object.keys(S.skipped);
  if (pool.length > 0 && T.remaining > 0 && T.state !== 'ENDED') {
    if (T.state === 'PAUSED_AUTO_CHECK') setState('RUNNING');
    renderReview();
  } else {
    showResults();
  }
}

/* ---------------- feedback ---------------- */
function renderFeedback(credit, w) {
  var fb = byId('fbwrap');
  if (!fb) return;
  fb.textContent = '';
  var ex = EXS[S.idx];
  var r = lastResult;
  var head, cls;
  if (credit >= 0.999) { head = '✓ CORRECT'; cls = 'fb-ok'; }
  else if (credit > 0) { head = '± PARTIALLY CORRECT'; cls = 'fb-part'; }
  else { head = '✗ INCORRECT'; cls = 'fb-no'; }
  var box = el('div', 'fb ' + cls);
  box.appendChild(el('div', 'fb-h', head));
  var isMulti = r.N > 1;
  if (isMulti) {
    var line = 'Credit ' + credit.toFixed(2) + ' — ' + r.H + ' of ' + r.N + ' correct items picked, ' + r.W + ' wrong picked.';
    if (S.hintUsed[S.idx]) line += ' Hint used: −0.10.';
    box.appendChild(el('p', 'fb-credit', line));
    var items = w.itemsFor(r.sel);
    var ul = el('ul', 'fb-items');
    items.forEach(function (it) {
      var li = el('li', 'fbi fbi-' + it.status);
      var ic = it.status === 'correct' ? '✓ Correct' : (it.status === 'wrong' ? '✗ Wrong' : '○ Missed');
      li.appendChild(el('span', 'fbi-ic', ic));
      li.appendChild(el('span', 'fbi-lb', w.keyLabel(it.key)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
  } else {
    var singleLine = 'Credit ' + credit.toFixed(2) + (S.hintUsed[S.idx] ? ' (hint used: −0.10)' : '') + '.';
    box.appendChild(el('p', 'fb-credit', singleLine));
  }
  box.appendChild(el('div', 'fb-sub', 'Correct answer:'));
  var ca = el('ul', 'fb-correct');
  w.correctDisplay().forEach(function (c) { ca.appendChild(el('li', null, c)); });
  box.appendChild(ca);
  box.appendChild(el('div', 'fb-sub', 'Why:'));
  box.appendChild(el('p', 'fb-explain', ex.explain));
  if (credit < 0.999 && ex.study) {
    box.appendChild(el('p', 'fb-study', 'Study next: ' + ex.study));
  }
  fb.appendChild(box);
}

/* ---------------- screens ---------------- */
function renderExamScreen(reviewIdx) {
  SCREEN = 'exam';

function paintGreet() {
  var g = byId('greet');
  if (!g) return;
  g.textContent = handshakeName
    ? ('Welcome, ' + handshakeName + '! Read the short guide below, then press Start.')
    : 'Read the short guide below, then press Start.';
}

/* ---------------- run control ---------------- */
function resetAll() {
  S.order = shuffled(EXS.map(function (_, i) { return i; }));
  S.pos = 0; S.idx = -1;
  S.answered = {}; S.skipped = {}; S.hintUsed = {};
  S.creditSum = 0; S.answeredCount = 0;
  S.mode = 'sequence'; S.checked = false; S.reported = false;
  T.state = 'IDLE'; T.remaining = CFG.timerSeconds;
  T.manualSec = 0; T.autoSec = 0; T.prev = null;
}
function startExam() {
  resetAll();
  S.started = true;
  startTicker();
  setState('RUNNING');
  renderExamScreen(null);
}
function retake() {
  resetAll();
  startTicker();
  setState('RUNNING');
  renderExamScreen(null);
}

/* ---------------- results ---------------- */
function showResults() {
  SCREEN = 'results';
  S.mode = 'sequence';
  setState('ENDED');
  stopTicker();
  hidePauseOverlay();
  var app = byId('app');
  app.textContent = '';
  var answered = S.answeredCount;
  var percent = pctOf(S.creditSum, answered);
  var full = 0, part = 0, zero = 0, partSum = 0, k;
  for (k in S.answered) {
    if (Object.prototype.hasOwnProperty.call(S.answered, k)) {
      var c = S.answered[k];
      if (c >= 0.999) full++;
      else if (c > 0) { part++; partSum += c; }
      else zero++;
    }
  }
  var skippedCount = EXS.length - answered;

  var root = el('div');
  root.appendChild(el('h1', null, 'Results — ' + CFG.title));
  var ban = el('div', 'resbanner ' + (percent >= CFG.passMark ? 'pass' : 'fail'));
  ban.appendChild(el('div', 'reslabel', percent >= CFG.passMark ? 'PASS' : 'FAIL — retake required'));
  ban.appendChild(el('div', 'resbig', one(S.creditSum) + ' / ' + answered + '  ·  ' + percent + '%'));
  ban.appendChild(el('p', null, answered === 0
    ? 'No exercise was answered, so the score is 0%.'
    : ('Score over answered exercises only. Pass mark: ' + CFG.passMark + '%.')));
  root.appendChild(ban);

  var card = el('div', 'excard');
  card.appendChild(el('h2', null, 'Score breakdown'));
  var bl = el('ul', 'breaklist');
  bl.appendChild(el('li', null, '✓ Fully correct: ' + full));
  bl.appendChild(el('li', null, part > 0
    ? ('± Partially correct: ' + part + ' (average partial credit ' + (Math.round((partSum / part) * 100) / 100).toFixed(2) + ')')
    : '± Partially correct: 0'));
  bl.appendChild(el('li', null, '✗ Fully incorrect: ' + zero));
  bl.appendChild(el('li', null, '⚠ Skipped and never answered (excluded from score): ' + skippedCount));
  card.appendChild(bl);
  card.appendChild(el('p', 'mut', 'Time used ' + clockFmt(CFG.timerSeconds - T.remaining) + ' of ' + clockFmt(CFG.timerSeconds)
    + ' · manual pause ' + clockFmt(Math.round(T.manualSec))
    + ' · feedback review ' + clockFmt(Math.round(T.autoSec))));

  var tbl = el('table', 'restable');
  var thead = el('thead');
  var hrow = el('tr');
  ['Exercise', 'Result', 'Credit'].forEach(function (h) { hrow.appendChild(el('th', null, h)); });
  thead.appendChild(hrow);
  tbl.appendChild(thead);
  var tbody = el('tbody');
  EXS.forEach(function (ex, i) {
    var tr = el('tr');
    tr.appendChild(el('td', null, ex.id + ' — ' + ex.title));
    var st, cl;
    if (S.answered[i] === undefined) { st = '⚠ NOT ANSWERED — EXCLUDED'; cl = 'fbi-missed'; }
    else if (S.answered[i] >= 0.999) { st = '✓ CORRECT'; cl = 'fbi-correct'; }
    else if (S.answered[i] > 0) { st = '± PARTIALLY CORRECT'; cl = ''; }
    else { st = '✗ INCORRECT'; cl = 'fbi-wrong'; }
    var td2 = el('td', cl, st);
    tr.appendChild(td2);
    tr.appendChild(el('td', null, S.answered[i] === undefined ? '—' : S.answered[i].toFixed(2)));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  card.appendChild(tbl);
  root.appendChild(card);

  if (percent >= CFG.passMark) {
    var cert = el('div', 'cert');
    cert.appendChild(el('h3', null, 'CERTIFICATE OF COMPLETION'));
    cert.appendChild(el('p', null, 'MITRE ATT&CK topic M1049 — Antivirus/Antimalware · ' + CFG.severityLabel + ' tier'));
    cert.appendChild(el('p', 'certname', 'Awarded to: ' + (handshakeName || 'Candidate')));
    cert.appendChild(el('p', null, 'Final score ' + percent + '% · pass mark ' + CFG.passMark + '% · ' + INTRO.tierLine));
    root.appendChild(cert);
  }

  var sw = el('div', 'startwrap');
  sw.appendChild(btn(percent >= CFG.passMark ? 'Retake exam' : 'Retake Exam', 'btn btn-primary btn-big', function () { retake(); }));
  root.appendChild(sw);
  app.appendChild(root);

  if (!S.reported) {
    S.reported = true;
    reportScore(S.creditSum, S.answeredCount);
  }
}

/* ---------------- website integration ---------------- */
/* Report once per attempt, at the results screen. The fractional credit sum
   and the answered count are rounded only here, and the on-screen percent is
   computed from the same values, so learner and site never disagree. */
function reportScore(creditSum, answeredCount) {
  var percent = answeredCount > 0
    ? Math.round((creditSum / answeredCount) * 100)
    : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      batch: CFG.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) {
    /* Opened directly in a browser, not inside the site: nothing to report to. */
  }
}

/* Theme: this file ships DARK by default and also carries a light theme, so
   the site handshake may switch. 'dark' (or anything else) keeps the default. */
function applyTheme(theme) {
  try {
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  } catch (e) { /* very old engines: keep the default dark theme */ }
}

window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  handshakeName = (typeof event.data.username === 'string') ? event.data.username : '';
  if (typeof event.data.theme === 'string') applyTheme(event.data.theme);
  paintGreet();
});

/* ---------------- boot ---------------- */
function boot() { renderIntro(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ---------------- test hook (harmless in production) ---------------- */
window.__exam = {
  start: startExam,
  retake: retake,
  screen: function () { return SCREEN; },
  state: function () { return S; },
  time: T,
  hint: onHint,
  skip: onSkip,
  pause: onPauseToggle,
  next: onNext,
  solveAndCheck: function () { if (W && W.solve && !S.checked) { W.solve(); onCheck(); } },
  reviewAnswer: openReviewExercise,
  finish: finishAttempt,
  showResultsDirect: showResults,
  current: function () { return W; }
};

</script>
