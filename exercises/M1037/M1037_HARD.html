<script>
window.EXAM_CONFIG = {"topicId":"m1037","batch":3,"difficulty":"hard","severityLabel":"HARD","objectId":"M1037","objectName":"Filter Network Traffic","objectType":"Mitigation (ATT&CK Enterprise)","examTitle":"M1037 Filter Network Traffic \u2014 HARD practice exam","durationSec":2700,"estimatedMinutes":45,"passMark":70,"questionCount":16,"learner":""};
window.INTRO_CONTENT = {"about":"\n<p><b>M1037 is called Filter Network Traffic.</b> In MITRE ATT&amp;CK it is a <b>Mitigation</b>.\nA mitigation is the opposite of an attack: it is a defence that stops or slows known attack techniques.\nATT&amp;CK lists attacks as techniques with IDs like T1090. It lists defences as mitigations with IDs like M1037.</p>\n\n<p><b>What does it mean in practice?</b> M1037 says: use network appliances (firewalls, proxies) and endpoint\nsoftware to <b>filter</b> traffic in three directions. <b>Ingress</b> filtering checks traffic coming <i>into</i> your\nnetwork. <b>Egress</b> filtering checks traffic <i>leaving</i> your network. <b>Lateral</b> filtering checks traffic\nmoving <i>inside</i> your network, between systems. The filter compares each connection against rules. A rule can\nlook at the port (for example TCP 445), the protocol (for example SMB), the IP address, or the domain name.</p>\n\n<p><b>Imagine a big office building.</b> The network is the building. The firewall is the guard at the door.\nThe guard works from a rule list: which doors may open, which visitors may pass, and which rooms they may enter.\nThe guard also stops people from carrying boxes out of the building (data theft is called exfiltration) and stops\nan outsider from whispering secret instructions to someone inside (that secret channel is called C2, short for\ncommand and control). MITRE also lists M1037 for the two big floods, T1498 and T1499. A flood attack (also called\nDoS, short for Denial of Service) sends so much traffic that a service stops working. Here the filter drops the\nflood traffic upstream, before it can drown the service.</p>\n\n<h3>Where you will meet M1037 in real work</h3>\n<ul>\n<li><b>SOC analyst (monitoring team):</b> you read firewall and proxy logs every shift. Lines with\n<span style=\"font-family:monospace\">DENY</span> show what the filter stopped. Many denies from one host can be a real attack.</li>\n<li><b>Firewall / network administrator:</b> you write the rules, test them, and deploy them through a change process.\nYou also remove old rules that are too permissive.</li>\n<li><b>Incident responder (IR):</b> when a host is compromised, you quickly add a deny rule to cut the attacker's\nchannel. This is containment with M1037.</li>\n<li><b>Detection engineer:</b> you build alerts from denied-flow logs, for example when one host makes many\ndenied connections in a short time.</li>\n<li><b>Threat intel analyst (CTI):</b> you map attacker behaviour, for example <span style=\"font-family:monospace\">T1090 Proxy</span>\nor <span style=\"font-family:monospace\">T1572 Protocol Tunneling</span>, to the controls that stop it, and M1037 is one of the main ones.</li>\n<li><b>GRC analyst:</b> you prove the control exists. You map M1037 to frameworks: NIST CSF (PR.PT-4, PR.AC-5),\nCIS Controls (Control 9, and 4.4/4.5/13.4 in v8), and ISO 27001 (A.8.20 to A.8.22).</li>\n<li><b>Cloud engineer:</b> you use security groups and IP allowlists. ATT&amp;CK lists this same idea for cloud\ndata theft (T1530, T1537) and for the cloud metadata API (T1552.005).</li>\n</ul>\n\n<h3>The five measures of M1037</h3>\n<ul>\n<li><b>Ingress traffic filtering:</b> only trusted sources may reach public servers. Limit SSH (22) and RDP (3389) to known IP ranges.</li>\n<li><b>Egress traffic filtering:</b> block outbound traffic to bad destinations so C2 and stolen data cannot leave.</li>\n<li><b>Protocol-based filtering:</b> allow only needed protocols; block abused ones like Telnet or old SMBv1 (EternalBlue).</li>\n<li><b>Network segmentation:</b> split the network into zones and filter the traffic between zones.</li>\n<li><b>Application layer filtering:</b> use proxies or a WAF to inspect web traffic and block attacks like SQL injection.</li>\n</ul>\n\n<p><b>Tools you will see:</b> perimeter firewalls and NGFW, host firewalls (Windows Defender Firewall, iptables on\nLinux), web proxies, WAFs, router ACLs, switch features (DHCP snooping, Dynamic ARP Inspection, port security),\nand cloud security groups.</p>\n","howto":"<p><b>This is the HARD tier (tier 3 of 4).</b> Two or three ideas interact, and at least one plausible shortcut leads to a wrong answer. Expect near-miss options that are correct in a different context but wrong here. Some scenarios look alarming but are benign, and some look benign but are not.</p><p><b>Exercise types in this tier:</b> log triage with traps, decision-tree incidents, matching, drag-and-drop sorting, detection-word drafting, prioritisation, rule-order audits, one guided fake-terminal configuration task and single-choice questions.</p><p><b>Timer:</b> 45 minutes in total. The clock runs only while you work, never while you read feedback.</p>","rules":"\n<ul>\n<li><b>Passing score: 70%.</b> Your score is the sum of exercise credits, divided by the number of exercises you answered.</li>\n<li><b>16 exercises</b> of log triage with traps, decision-tree incidents, matching, drag-and-drop sorting, detection-word drafting, prioritisation, rule-order audits, one guided fake-terminal configuration task and single-choice questions.</li>\n<li><b>Timer: 45 minutes</b> for this tier. The clock runs only while you work.</li>\n<li><b>Partial credit:</b> many exercises have more than one right item. Each right item adds credit; each wrong\nitem subtracts. The formula is <span style=\"font-family:monospace\">max(0, (H \u2212 W) / N)</span>. H is the items you got right,\nW the wrong ones you chose, N the total right items. Selecting everything is worth zero, not full marks.</li>\n<li><b>Hint:</b> one hint per exercise. It costs 10% of that exercise's credit. A partial answer after a hint still earns partial credit.</li>\n<li><b>Check auto-pause:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you\nwant. Nothing is lost. The timer starts again only when you press <b>Next</b> (or Final Submit on the last exercise).</li>\n<li><b>Manual pause:</b> the Pause button stops the clock and hides the exercise. Resume brings it back.</li>\n<li><b>Skip:</b> every exercise has Skip. Skipped exercises wait in a review pool. Before the end you can open them\nagain and answer, as often as you like, while the timer runs. If you submit with skipped exercises left, they are\nsimply excluded from the score \u2014 no penalty, no points.</li>\n<li><b>Retake:</b> if you fail, the Retake button resets everything and shuffles questions and answers again.</li>\n</ul>\n"};

y mappings","keywords":["NIST CSF PR.PT-4","NIST CSF PR.AC-5","CIS Control 9 (ports, protocols, services)","CIS v8 4.4 / 4.5 (firewalls on servers / devices)","CIS v8 13.4 (application layer filtering)","ISO 27001 A.8.20-A.8.22","egress filtering policy","exception register"]},{"icon":"\ud83d\udce1","name":"Detection support & telemetry","keywords":["firewall DENY logs","proxy logs","NetFlow","blocked-flow analysis","Network Traffic Flow data source","alerting on denied spikes","tuning with asset data"]}];
window.EXERCISES = [{"id":"H01","type":"clickline","title":"Triage the DENY pile","summary":"Firewall DENY log \u2014 click every line that smells like C2","scenario":[{"label":"ARTEFACT 1 \u2014 Firewall DENY log (24h sample, egress)","kind":"log","filter":true,"body":"00:03:11 DENY TCP 10[.]44[.]1[.]55:52001 -> 203[.]0[.]113[.]77:443  rule EG-01\n00:04:12 DENY TCP 10[.]44[.]1[.]55:52019 -> 203[.]0[.]113[.]77:443  rule EG-01\n04:00:09 DENY TCP 10[.]44[.]3[.]20:54401 -> 23[.]55[.]14[.]10:443   rule EG-01\n08:00:10 DENY TCP 10[.]44[.]3[.]20:55022 -> 23[.]55[.]14[.]10:443   rule EG-01\n12:02:44 DENY UDP 10[.]44[.]7[.]100:40051 -> 10[.]44[.]9[.]1:53    rule SEG-04\n12:02:45 DENY UDP 10[.]44[.]7[.]100:40055 -> 10[.]44[.]9[.]1:53    rule SEG-04"},{"label":"ARTEFACT 2 \u2014 Asset & ticket context","kind":"prose","body":"<ul><li><b>10[.]44[.]1[.]55</b> \u2014 workstation, sales, flagged yesterday for phishing email.</li><li><b>10[.]44[.]3[.]20</b> \u2014 build server; OS and vendor-agent updates run every 4 hours; vendor range 23[.]55[.]14[.]0/24 is allowlisted in the change register.</li><li><b>10[.]44[.]7[.]100</b> \u2014 approved vulnerability scanner (ticket VM-881); DNS to the corporate resolver was temporarily segmented off.</li><li><b>203[.]0[.]113[.]77</b> \u2014 uncategorised, first seen 2 days ago, not in any register.</li></ul>"}],"question":"Click every DENY line whose pattern matches likely C2 beaconing rather than a registered activity (two lines).","data":{"lines":["00:03:11 DENY TCP 10[.]44[.]1[.]55:52001 -> 203[.]0[.]113[.]77:443  rule EG-01","00:04:12 DENY TCP 10[.]44[.]1[.]55:52019 -> 203[.]0[.]113[.]77:443  rule EG-01","04:00:09 DENY TCP 10[.]44[.]3[.]20:54401 -> 23[.]55[.]14[.]10:443   rule EG-01","08:00:10 DENY TCP 10[.]44[.]3[.]20:55022 -> 23[.]55[.]14[.]10:443   rule EG-01","12:02:44 DENY UDP 10[.]44[.]7[.]100:40051 -> 10[.]44[.]9[.]1:53    rule SEG-04","12:02:45 DENY UDP 10[.]44[.]7[.]100:40055 -> 10[.]44[.]9[.]1:53    rule SEG-04"],"correct":[0,1],"multi":true},"hint":"Two sources look routine because they are registered somewhere \u2014 check artefact 2 before you click anything.","explain":"<p><b>Lines 1\u20132 are the C2 pattern:</b> one flagged workstation, one uncategorised external IP, tight ~60-second cadence, on the allowed-but-blocked 443 path \u2014 the filter is rejecting beacon retries (T1071.001-style). The other lines look similar but are registered: the build server's <b>4-hour cadence to the vendor update range</b> is change-controlled (looks alarming, is benign), and the scanner's <b>DENY to the internal resolver</b> is a temporary segmentation ticket (looks odd, is documented). The lesson: cadence plus context beats keyword matching \u2014 exactly why M1037's deny logs must be read against asset data.</p>","study":"separating beacon patterns from registered noise in firewall deny logs.","concepts":["M1037","T1071.001","firewall DENY logs","false positives"]},{"id":"H02","type":"qcm","title":"Design the finance egress policy","summary":"Two-step design decision for a new segment","scenario":[{"label":"ARTEFACT 1 \u2014 Project brief","kind":"prose","body":"<p>The finance VLAN (10[.]20[.]8[.]0/24) is being rebuilt. Requirements: workstations need web access (all business web apps go through the corporate proxy), file transfer to two partner hosts, and nothing else has ever been requested. You own the egress rule set.</p>"}],"question":"Which rule design best implements M1037 for this segment?","data":{"options":[{"id":"a1","t":"Deny by default; allow 443 only to the proxy; allow 22 only to the two partner IPs; log denies"},{"id":"a2","t":"Allow 80 and 443 outbound to any destination; deny everything else"},{"id":"a3","t":"Filter inbound traffic hard; leave outbound open so nothing breaks"},{"id":"a4","t":"Allow everything, but block ten known-bad IP addresses on top"}],"correct":["a1"]},"hint":"The business told you exactly which destinations exist. A design that ignores requirements is either too open or guesswork.","explain":"<p>The requirements enumerate the whole business need: web <b>through the proxy</b>, SFTP to <b>two named partners</b>. Allow-listing exactly those flows (and logging the rest) is the M1037 pattern \u2014 deny-by-default, conditions on every rule. '80/443 to any' lets any compromised finance host reach any C2 on the standard ports \u2014 the exact gap the proxy model closes. 'Inbound only' ignores that stolen data leaves outbound (T1048, T1537). 'Block ten bad IPs' is a blocklist racing a carousel of new infrastructure \u2014 the page's allow/block list guidance under T1090 works best for <i>known-bad</i>, never as the only design.</p>","study":"egress design: allowlists from business requirements, deny-by-default, logging.","concepts":["M1037","egress policy","T1090"]},{"id":"H03","type":"tree","title":"The admin session that wasn't","summary":"Suspected T1572 tunnel over an allowed port \u2014 3 decision steps","scenario":[{"label":"ARTEFACT 1 \u2014 EDR alert on WS-ENG-22","kind":"prose","body":"<p>EDR flags a long-lived <span style='font-family:monospace'>ssh.exe</span> started by the user from a temp folder, with argument <span style='font-family:monospace'>-R 8443:internal-db:5432 admin@203[.]0[.]113[.]44</span>. The user is a junior developer, not an admin.</p>"},{"label":"ARTEFACT 2 \u2014 Firewall log (egress)","kind":"log","filter":true,"body":"2026-10-07 14:02:01 ALLOW TCP 10[.]20[.]6[.]22:51904 -> 203[.]0[.]113[.]44:22 (matched: 'DevOps SSH allow')\n2026-10-07 14:02:01 ESTABLISHED session 10[.]20[.]6[.]22 <-> 203[.]0[.]113[.]44:22 duration 04:11:07 (open)"},{"label":"ARTEFACT 3 \u2014 Rulebase excerpt","kind":"code","body":"12 permit tcp 10[.]20[.]6[.]0/24 any eq 22   ! 'DevOps SSH allow' \u2014 owner: infra team"}],"question":"Decide in three steps: read the evidence, contain with the least aggressive effective action, then choose the durable fix.","data":{"steps":[{"q":"Step 1 \u2014 What does the evidence show?","options":[{"id":"b1","t":"Protocol tunneling (T1572): an SSH remote forward rides an allowed SSH rule to expose the internal DB"},{"id":"b2","t":"Routine DevOps administration: a legit engineer fixing the database"},{"id":"b3","t":"VNC remote control on port 5900"},{"id":"b4","t":"DNS exfiltration through the resolver"}],"correct":"b1","artefactLabel":"ARTEFACT 1 \u2014 EDR alert"},{"q":"Step 2 \u2014 Choose the immediate containment action (least aggressive that still works).","options":[{"id":"b5","t":"Add a targeted temporary deny for WS-ENG-22 to 203[.]0[.]113[.]44:22; leave the host running"},{"id":"b6","t":"Power off the workstation immediately to freeze all activity"},{"id":"b7","t":"Flush the entire perimeter rule set to stop everything"},{"id":"b8","t":"Take no action: SSH is encrypted, so nothing can be done"}],"correct":"b5","artefactLabel":"ARTEFACT 2 \u2014 Firewall log"},{"q":"Step 3 \u2014 Choose the durable filtering fix.","options":[{"id":"b9","t":"Scope rule 12 to the actual jump hosts and approved destinations; deny direct SSH from user subnets"},{"id":"b10","t":"Block TCP 22 outbound for the whole company"},{"id":"b11","t":"No rule change; just ask developers to be careful"}],"correct":"b9","artefactLabel":"ARTEFACT 3 \u2014 Rulebase excerpt"}]},"hint":"Step 1: the -R flag asks the remote (attacker-side) SSH server to open a door back into your network. Step 2: two options destroy evidence or business activity. Step 3: the rule is fine in concept but too broad in scope.","explain":"<p><b>Step 1:</b> <span style='font-family:monospace'>ssh -R 8443:internal-db:5432</span> asks the attacker's server (203[.]0[.]113[.]44) to listen on its own port 8443; anyone connecting there is tunneled through the allowed SSH session back to the internal database \u2014 classic <b>T1572 Protocol Tunneling</b>, which M1037 addresses by filtering traffic to untrusted destinations. It looks like normal DevOps SSH (rule 12 allows it), but a junior dev from a temp folder is not normal. <b>Step 2:</b> a targeted deny cuts the tunnel while keeping the host up for forensics; powering off destroys volatile evidence, flushing the rulebase causes an outage, and 'encrypted, nothing to do' is false \u2014 the flow itself is visible. <b>Step 3:</b> the durable fix scopes the SSH allow to real jump hosts and approved destinations; a company-wide TCP 22 block would break legitimate operations, and awareness is not a filter.</p>","study":"detecting and containing T1572 tunneling through allowed ports; least-aggressive containment.","concepts":["M1037","T1572","least-aggressive action","rule scoping"]},{"id":"H04","type":"match","title":"Right filter, right technique","summary":"Match five techniques to their best filtering use","scenario":[{"label":"ARTEFACT 1 \u2014 Control mapping session, M1037 page on screen","kind":"prose","body":"<p>The network security architect puts five technique cards on the left and five filtering-use cards on the right, all paraphrased from the M1037 page. 'Each use was written for exactly one technique,' she says.</p>"}],"question":"Match each technique to the filtering use written for it.","data":{"pairs":[{"left":"T1090.003 \u2014 Multi-hop Proxy","right":"Block list traffic to known anonymity networks and C2 infrastructure"},{"left":"T1095 \u2014 Non-Application Layer Protocol","right":"Filter protocols that have no reason to cross the network boundary"},{"left":"T1048.003 \u2014 Exfil Over Unencrypted Non-C2 Protocol","right":"Dedicated servers only: let just DNS servers speak DNS on the right ports"},{"left":"T1190 \u2014 Exploit Public-Facing Application","right":"Restrict outbound traffic from public-facing servers so the foothold cannot phone home"},{"left":"T1218.012 \u2014 System Binary Proxy Execution: Verclsid","right":"Modify host firewall rules to prevent egress from verclsid.exe"}]},"hint":"Read the artefact names closely: one is about anonymity networks, one about protocols crossing the boundary, one about dedicated DNS servers, one about servers that face the internet, one names a specific binary.","explain":"<p>Each match mirrors the M1037 page. <b>T1090.003</b>: allow/block lists against anonymity networks and C2 infrastructure (with the honest caveat that domain fronting can bypass it). <b>T1095</b>: boundary filters stop protocols that need not cross \u2014 and in ESXi, restrict guest access to VMCI where unused. <b>T1048.003</b>: proxies plus dedicated servers for DNS, so only the resolvers speak DNS \u2014 starving ad-hoc exfil channels. <b>T1190</b>: the exploit itself may land, but outbound restriction stops the post-exploit verification and control. <b>T1218.012</b>: a host-firewall rule targeting <span style='font-family:monospace'>verclsid.exe</span> egress. The pattern: match the rule to the technique's actual traffic signature.</p>","study":"the Use column of M1037's techniques table for T1090.003, T1095, T1048.003, T1190, T1218.012.","concepts":["M1037","T1090.003","T1095","T1048.003","T1190","T1218.012"]},{"id":"H05","type":"clickline","title":"One rule ruins the block","summary":"iptables rule-order audit \u2014 click the culprit","scenario":[{"label":"ARTEFACT 1 \u2014 Perimeter Linux firewall, iptables egress chain (evaluated top to bottom)","kind":"code","body":":EGRESS - [0:0]\n-A EGRESS -m state --state ESTABLISHED,RELATED -j ACCEPT\n-A EGRESS -s 10[.]20[.]0[.]0/16 -p tcp -m multiport --dports 80,443 -j ACCEPT\n-A EGRESS -s 198[.]51[.]100[.]23 -j DROP        ! block known C2 host\n-A EGRESS -s 10[.]20[.]0[.]0/16 -p udp --dport 53 -d 10[.]20[.]9[.]1 -j ACCEPT\n-A EGRESS -j LOG --log-prefix 'EGRESS-DROP '\n-A EGRESS -j DROP"},{"label":"ARTEFACT 2 \u2014 Incident note","kind":"prose","body":"<p>IR confirms beaconing from several workstations to <b>198[.]51[.]100[.]23</b> on TCP 443 \u2014 yet the firewall's counters show the DROP rule for that host has matched <b>zero packets</b>. The deny is in the file, the service reloaded fine. Something about the rule order is wrong.</p>"}],"question":"Click the one rule that makes the C2 block ineffective.","data":{"lines":[":EGRESS - [0:0]","-A EGRESS -m state --state ESTABLISHED,RELATED -j ACCEPT","-A EGRESS -s 10[.]20[.]0[.]0/16 -p tcp -m multiport --dports 80,443 -j ACCEPT","-A EGRESS -s 198[.]51[.]100[.]23 -j DROP        ! block known C2 host","-A EGRESS -s 10[.]20[.]0[.]0/16 -p udp --dport 53 -d 10[.]20[.]9[.]1 -j ACCEPT","-A EGRESS -j LOG --log-prefix 'EGRESS-DROP '","-A EGRESS -j DROP"],"correct":[2],"multi":false},"hint":"Rules are evaluated strictly top to bottom and the first match wins. Ask which rule a workstation's new TCP 443 connection to the C2 host meets first \u2014 and where the DROP sits relative to it.","explain":"<p>Line 3 \u2014 <span style='font-family:monospace'>-s 10[.]20[.]0[.]0/16 -p tcp --dports 80,443 -j ACCEPT</span> \u2014 sits <b>above</b> the C2 DROP and matches every workstation connection to TCP 443, including the beacons to 198[.]51[.]100[.]23. iptables evaluates top-down and first match wins, so the beacons are accepted by the broad web rule and the targeted DROP below it never sees a packet \u2014 which is exactly why its counter reads zero while IR confirms live beaconing. The intended order is: targeted DROP first, then the broad accepts. The other rules are fine in themselves \u2014 the state rule is normal practice and would be a plausible suspect (long-lived sessions established before a block can slip past it), but for <i>new</i> connection attempts the broad ACCEPT is the culprit here. The LOG and final DROP are good practice, and the DNS accept is scoped. This is why M1037 programmes pair rule review with a check of <b>rule order</b> \u2014 a correct rule in the wrong place is a hole. (The fix: move the DROP above the accepts, reload, and re-test the counters.)</p>","study":"first-match rule evaluation; ordering targeted drops before broad accepts.","concepts":["M1037","rule order","iptables"]},{"id":"H06","type":"qcm","title":"ISO 27001:2022 mapping","summary":"Two-step framework mapping to Annex A controls","scenario":[{"label":"ARTEFACT 1 \u2014 ISMS control mapping sheet","kind":"prose","body":"<p>The ISMS manager maps the traffic-filtering practice (firewalls, ACLs, segmentation support) into ISO/IEC 27001:2022 Annex A. Four candidate control groupings are on the table; only one matches.</p>"}],"question":"Which Annex A grouping matches M1037's filtering practice, and why?","data":{"options":[{"id":"i1","t":"A.8.20 Networks security + A.8.22 Segregation of networks"},{"id":"i2","t":"A.8.12 Data leakage prevention"},{"id":"i3","t":"A.8.16 Monitoring activities"},{"id":"i4","t":"A.5.23 Information security for cloud services"}],"correct":["i1"]},"hint":"First decide what filtering is (securing and controlling networks), then pick the Annex A theme that says exactly that.","explain":"<p><b>A.8.20</b> ('networks and network devices are secured, managed and controlled') and <b>A.8.22</b> ('information is segregated... and traffic is controlled between them') are the natural home of M1037 \u2014 filtering rules and zone-boundary controls; <b>A.8.21</b> (security of network services) supports them. A.8.12 is DLP tooling, A.8.16 is the detective monitoring around the filter (deny-log alerts), and A.5.23 is cloud governance, not traffic filtering. Real-world task: this mapping row is what the ISMS manager shows the certification auditor as evidence for the M1037 practice.</p>","study":"ISO 27001:2022 Annex A.8.20, A.8.21, A.8.22 as mappings for M1037.","concepts":["M1037","ISO 27001","GRC"]},{"id":"H07","type":"blank","title":"Word the deny-spike analytic","summary":"Detection-engineering wording \u2014 four values","scenario":[{"label":"ARTEFACT 1 \u2014 Meeting note, whiteboard photo transcription","kind":"prose","body":"<p>The SOC lead dictates the alert logic for denied-flow spikes; the note-taker misses four values. 'Keep it simple \u2014 we alert on behaviour, not on single lines,' she says.</p>"}],"question":"Place the four missing values into the analytic description.","data":{"text":"Alert FW-SPIKE-01: fire when one {{1}} IP address produces more than {{2}} denied flows within {{3}} minutes, heading to a {{4}} destination port for that asset group.","bank":[{"id":"j1","t":"source"},{"id":"j2","t":"20"},{"id":"j3","t":"10"},{"id":"j4","t":"rare"}],"answers":{"1":"j1","2":"j2","3":"j3","4":"j4"}},"hint":"The alert watches one sender's behaviour over a short window; 'rare' is judged against what that asset group normally touches.","explain":"<p>The analytic reads: one <b>source</b> IP, more than <b>20</b> denied flows, within <b>10</b> minutes, to a port <b>rare</b> for that asset group. Every element matters: per-source avoids alerting on one busy subnet; the window keeps it operational; 'rare for the asset group' is what makes it fire on a workstation hitting SSH-elsewhere while ignoring the mail cluster's normal outbound SMTP. This is M1037's detection support in practice \u2014 the filter's DENY logs (Network Traffic Flow) become a behavioural signal, and asset-context tuning is what keeps false positives survivable.</p>","study":"writing deny-spike analytics on firewall telemetry; tuning with asset context.","concepts":["M1037","firewall DENY logs","detection support"]},{"id":"H08","type":"multi","title":"What still slips through?","summary":"Coverage-gap check on a strict proxy-only egress design","scenario":[{"label":"ARTEFACT 1 \u2014 Current egress design, user VLANs","kind":"code","body":"EGRESS (user VLANs):\n  allow tcp any -> proxy-corp:3128          (authenticated proxy)\n  allow udp any -> 10[.]20[.]9[.]1 eq 53          (internal resolvers only)\n  deny ip any any log"},{"label":"ARTEFACT 2 \u2014 Proxy policy","kind":"prose","body":"<p>The authenticated proxy passes HTTPS to broad web categories; it does not yet decrypt. Direct outbound is impossible: everything must ride the proxy or the resolvers.</p>"}],"question":"Select the two adversary behaviours that can still reach the internet through this design.","data":{"options":[{"id":"k1","t":"C2 hidden inside allowed HTTPS sessions to compromised web infrastructure"},{"id":"k2","t":"Fronting C2 through popular CDN domains to hide the real destination"},{"id":"k3","t":"Exfiltration over outbound FTP to an attacker server"},{"id":"k4","t":"Direct RDP from the internet into a user workstation"}],"correct":["k1","k2"]},"hint":"Two behaviours ride exactly what the design must allow (encrypted web through the proxy). The other two need channels this design never opens.","explain":"<p><b>k1</b> and <b>k2</b> ride the allowed path: HTTPS through the proxy to 'normal' web destinations \u2014 the page itself notes under T1090 that domain-fronting circumvents this kind of blocking, and an undecrypting proxy cannot see inside TLS. That is the honest residual risk of the design, and it is why M1037 pairs with application-layer inspection. <b>k3</b> (FTP) needs a direct outbound channel the design denies, and <b>k4</b> is an inbound path \u2014 also denied; M1037's ingress measure blocks unsolicited RDP 3389 from the internet. Gap analysis like this decides what to fund next (decrypting proxy, SNI filtering, DNS-layer controls).</p>","study":"coverage-gap reasoning: residual risk when egress rides a proxy without decryption.","concepts":["M1037","T1090","T1071.001","coverage gap","T1190"]},{"id":"H09","type":"terminal","title":"Write the egress block rule (Windows)","summary":"Legacy service phones out on TCP 4444 \u2014 write the firewall rule","scenario":[{"label":"ARTEFACT 1 \u2014 Change ticket CHG-2210 (approved, emergency)","kind":"prose","body":"<p><b>Environment:</b> Windows Server 2019, <span style='font-family:monospace'>cmd.exe</span> only (PowerShell is blocked by GPO on this box). You hold an administrator prompt on the server itself. <b>Goal:</b> the legacy reporting service on this server must stop calling out on TCP 4444 (confirmed C2 port). Outbound blocking for this server is not yet configured anywhere else; do it locally, outbound direction, block, protocol TCP, port 4444. Give the rule a short descriptive name.</p>"},{"label":"ARTEFACT 2 \u2014 Reverse-shell evidence (for context)","kind":"log","filter":true,"body":"EDR netconn: svchost-legacy.exe  -> 198[.]51[.]100[.]87:4444  repeated every 30s"}],"question":"In the shell below, type the command that adds the outbound block rule, then press Check.","data":{"prompt":"C:\\Windows\\system32>","banner":"Microsoft Windows Server 2019 (build 17763)  -- administrator: cmd.exe -- (PowerShell blocked by GPO)","simTool":"netsh","simOut":["Ok.",""],"canonical":"netsh advfirewall firewall add rule name=\"Block Legacy Egress 4444\" dir=out action=block protocol=TCP localport=4444","elements":[{"name":"tool: netsh (the built-in firewall CLI)","re":"\\bnetsh\\b","why":"on this box only cmd is allowed; netsh advfirewall is the built-in firewall CLI"},{"name":"context: advfirewall firewall","re":"advfirewall\\s+firewall","why":"the Windows Firewall object model lives under 'netsh advfirewall firewall'"},{"name":"verb: add rule","re":"add\\s+rule","why":"you are creating a new rule, not showing or deleting"},{"name":"direction: dir=out","re":"dir\\s*=\\s*out","why":"the service calls OUT to the C2 \u2014 direction must be outbound"},{"name":"action: action=block","re":"action\\s*=\\s*block","why":"the goal is to block, not allow"},{"name":"protocol: protocol=TCP","re":"protocol\\s*=\\s*tcp","why":"the C2 channel is TCP 4444"},{"name":"port: localport=4444","re":"localport\\s*=\\s*4444","why":"only this port, so nothing else breaks"}],"wrong":[{"name":"dir=in (would block the wrong direction)","re":"dir\\s*=\\s*in(?!t)","danger":false},{"name":"action=allow (would legalise the C2 channel)","re":"action\\s*=\\s*allow","danger":true},{"name":"delete rule (removes protections instead of adding)","re":"delete\\s+rule","danger":true}],"dangerWarn":"This command would have allowed the C2 channel or removed existing protection instead of blocking it. Read the ticket again: dir=out, action=block."},"hint":"This is an outbound rule, not inbound \u2014 set the direction explicitly, and make the action 'block', not 'allow'.","explain":"<p>The canonical command is:</p><pre class='code'>netsh advfirewall firewall add rule name=\"Block Legacy Egress 4444\" dir=out action=block protocol=TCP localport=4444</pre><p><b>netsh advfirewall firewall</b> addresses Windows Firewall; <b>add rule</b> creates a new one; <b>dir=out</b> scopes it to egress (the C2 flows out); <b>action=block</b> drops matches; <b>protocol=TCP localport=4444</b> pins it to the one abused port. This is M1037's host-firewall measure as a real configuration task: a scoped, named, reversible rule \u2014 not an uninstalled service, not a sledgehammer. A rule with <span style='font-family:monospace'>action=allow</span> or the wrong direction would have been worse than doing nothing.</p>","study":"host-based egress filtering on Windows via netsh advfirewall (dir, action, protocol, localport).","concepts":["M1037","host firewall","T1071"]},{"id":"H10","type":"qcm","title":"Go-live broke operations","summary":"Rollback decision \u2014 least aggressive correct action","scenario":[{"label":"ARTEFACT 1 \u2014 War-room chat, 08:07","kind":"prose","body":"<p><b>08:02</b> New egress ruleset pushed to the warehouse segment. <b>08:04</b> Scanner guns offline; inventory system cannot reach its vendor cloud on a port nobody documented. <b>08:05</b> Warehouse lead: 'Every minute costs us about two thousand euros.' <b>08:07</b> You have the previous ruleset file in the change ticket, tested last week.</p>"}],"question":"Which action do you take right now?","data":{"options":[{"id":"m1","t":"Roll back to the tested previous ruleset via emergency change, then fix and reschedule"},{"id":"m2","t":"Add 'permit ip any any' at the top so everything passes while you investigate"},{"id":"m3","t":"Leave the rules broken and debug live until the exact missing port is found"},{"id":"m4","t":"Disable the firewall between the warehouse and the core network"}],"correct":["m1"]},"hint":"One option restores the last known-good state in minutes. Two of the others trade an outage for a wider outage, and one is not an action at all.","explain":"<p>The least aggressive action that restores service is the <b>tested rollback</b> through an emergency change \u2014 known state, minutes, auditable. 'Permit ip any any' restores traffic by silently deleting the M1037 control for the whole segment (and stays forgotten for months); disabling a firewall is worse. Debugging live while operations bleed is not stewardship of business impact. Every mature filtering programme keeps a tested rollback path for exactly this moment \u2014 the cost of skipping that rehearsal shows up here.</p>","study":"emergency rollback for filtering changes; keeping business impact bounded.","concepts":["M1037","change management","rollback"]},{"id":"H11","type":"categorize","title":"Place every control at its enforcement point","summary":"Six controls to three enforcement layers","scenario":[{"label":"ARTEFACT 1 \u2014 Network diagram legend (simplified)","kind":"prose","body":"<p>Zones: <b>Internet</b> \u2014 <b>Perimeter</b> \u2014 <b>Segments</b> (office VLANs, server VLANs) \u2014 <b>Hosts</b>. The architect asks you to place six planned filtering controls on the layer where each belongs.</p>"},{"label":"ARTEFACT 2 \u2014 Control shortlist","kind":"prose","body":"<ol><li>CDN/scrubbing service absorbing volumetric floods before they arrive</li><li>Border NGFW deny for unsolicited inbound SMB 445</li><li>Firewall between office and server VLANs limiting RPC to named servers</li><li>Dynamic ARP Inspection on access switches (DHCP snooping bound to ports)</li><li>Host firewall blocking workstation-to-workstation SMB</li><li>Endpoint agent rule stopping Telnet egress from servers</li></ol>"}],"question":"Drag each control to the enforcement layer where it belongs.","data":{"buckets":[{"id":"q1","name":"Perimeter (upstream / border)"},{"id":"q2","name":"Between segments"},{"id":"q3","name":"On the host"}],"items":[{"id":"v1","t":"CDN scrubbing of volumetric DoS floods","bucket":"q1"},{"id":"v2","t":"Border NGFW deny for inbound SMB 445","bucket":"q1"},{"id":"v3","t":"Inter-VLAN firewall limiting RPC to named servers","bucket":"q2"},{"id":"v4","t":"Dynamic ARP Inspection bound to switch ports","bucket":"q2"},{"id":"v5","t":"Host firewall blocking peer-to-peer SMB","bucket":"q3"},{"id":"v6","t":"Endpoint rule stopping Telnet egress from servers","bucket":"q3"}]},"hint":"Ask each control: does it act before traffic reaches the company, between two internal zones, or inside the machine itself?","explain":"<p><b>Perimeter:</b> ATT&amp;CK's M1037 use for T1498 (direct network floods T1498.001, reflection amplification T1498.002, and the endpoint DoS family T1499) says volumetric floods must be absorbed upstream \u2014 CDN/ISP scrubbing; the border NGFW's inbound 445 deny stops SMB reaching the estate at all. <b>Between segments:</b> the inter-VLAN firewall limits lateral protocols (the RPC restriction), and Dynamic ARP Inspection with DHCP snooping defends the segment's L2 \u2014 both live on the path between zones. <b>On the host:</b> host-firewall SMB blocking (the T1021.002/T1570 use) and an endpoint Telnet-egress rule run inside the machine. M1037 spans all three layers; placing each control where its traffic actually flows is the design skill.</p>","study":"enforcement layers of M1037: upstream/border, inter-segment, host.","concepts":["M1037","T1498","T1499","T1557.002","T1021.002","T1570","enforcement points"]},{"id":"H12","type":"qcm","title":"40,000 deny lines a day","summary":"Tuning decision \u2014 reduce noise without losing signal","scenario":[{"label":"ARTEFACT 1 \u2014 SOC metrics email","kind":"prose","body":"<p>Since the strict egress policy shipped, the firewall emits ~40,000 DENY lines per day. Analysts ignore them all. The security manager wants the noise down but refuses to lose the signal that caught last month's beacon case.</p>"}],"question":"Which move reduces the noise while keeping the detection value of the DENY stream?","data":{"options":[{"id":"n1","t":"Group denies by source and destination, whitelist confirmed business sources, alert on the rest"},{"id":"n2","t":"Stop logging denied traffic; the deny counter is enough"},{"id":"n3","t":"Delete the rules that generate most of the denies"},{"id":"n4","t":"Create an alert on every single DENY line so nothing is missed"}],"correct":["n1"]},"hint":"The noise has structure: most of it comes from a handful of legitimate sources hitting the new rules. Two options destroy signal, one multiplies it.","explain":"<p>DENY logs are M1037's detection goldmine, so deleting them (n2) or deleting the rules (n3, which re-opens the flows) destroys the very signal that caught the beacon. Alerting per line (n4) buries analysts under 40k alerts. The workable path is behavioural: aggregate by <b>source/destination</b>, confirm the few business sources that legitimately trip the rules, register their scoped exceptions, and alert on what remains anomalous \u2014 same pattern as analytic FW-SPIKE-01. Tuning the stream keeps the control preventive <i>and</i> its telemetry usable.</p>","study":"tuning deny-log telemetry: aggregation, exception handling, behavioural alerts.","concepts":["M1037","telemetry tuning","firewall DENY logs"]},{"id":"H13","type":"match","title":"Evidence to technique","summary":"Match six traffic artefacts to their techniques","scenario":[{"label":"ARTEFACT 1 \u2014 Six findings from the week's triage","kind":"prose","body":"<p>Six findings wait for ATT&amp;CK tagging before the weekly report. Match each to the technique its traffic pattern evidences (all six are on the M1037 page).</p>"},{"label":"ARTEFACT 2 \u2014 The findings","kind":"log","filter":true,"body":"F1: ALLOW TCP 10[.]30[.]2[.]8:49901 -> 91[.]132[.]9[.]4:443, session 6h, single flow, bytes up 4.1 GB\nF2: DENY UDP 10[.]44[.]8[.]12:53001 -> 8[.]8[.]8[.]8:53 (host has no business with public resolvers; 60k queries/hr)\nF3: 10[.]44[.]9[.]7 accepting connection relays from unknown internet peers\nF4: workstation WIN-221 opens ADMIN$ on file server via TCP 445, out of hours\nF5: DENY TCP 10[.]44[.]2[.]66:50101 -> 45[.]60[.]11[.]9:21 FTP, host normally talks HTTPS only\nF6: host firewall ALLOW: BITS job 'transfer' pulling a payload from an unapproved external host"}],"question":"Match each finding (F1\u2013F6) to the technique it evidences.","data":{"pairs":[{"left":"F1 \u2014 six-hour single flow, 4.1 GB out","right":"T1572 \u2014 Protocol Tunneling"},{"left":"F2 \u2014 60k queries/hour to a public resolver","right":"T1071.004 \u2014 Application Layer Protocol: DNS"},{"left":"F3 \u2014 host relays strangers' connections","right":"T1090 \u2014 Proxy"},{"left":"F4 \u2014 out-of-hours ADMIN$ over 445","right":"T1021.002 \u2014 SMB/Windows Admin Shares"},{"left":"F5 \u2014 bulk transfer attempt over FTP 21","right":"T1048.003 \u2014 Exfil Over Unencrypted Non-C2 Protocol"},{"left":"F6 \u2014 BITS job pulling a payload from an unapproved host","right":"T1197 \u2014 BITS Jobs"}]},"hint":"Read each pattern: a long tunnel, a DNS channel, a relay, an admin share, an FTP bulk attempt, a background-transfer service. One pair per behaviour.","explain":"<p><b>F1</b>: one enormous long-lived flow is the tunnel signature (T1572 \u2014 and M1037's answer is filtering traffic to untrusted destinations). <b>F2</b>: mass queries to a non-approved resolver ride DNS as a channel (T1071.004; the page's fix is filtering DNS to known-bad domains and resolving through on-premise servers). <b>F3</b>: a machine relaying third-party connections is a proxy (T1090; block lists against known C2/anonymity infrastructure). <b>F4</b>: ADMIN$ over 445 is admin-share lateral movement (T1021.002; host-firewall SMB restriction). <b>F5</b>: bulk FTP from an HTTPS-only host is unencrypted non-C2 exfiltration (T1048.003 \u2014 the unencrypted member of the T1048 family; the page's fix is proxies plus dedicated servers for such services). <b>F6</b>: a BITS job moving a payload from an unapproved host is exactly T1197; the page says to modify network and/or host firewall rules so only legitimate BITS traffic is allowed. Same deny-log discipline as always \u2014 but now each pattern earns its ATT&amp;CK tag.</p>","study":"traffic-pattern signatures of T1572, T1071.004, T1090, T1021.002, T1048.003, T1197 and the filtering use for each.","concepts":["M1037","T1572","T1071.004","T1090","T1021.002","T1048.003","T1197"]},{"id":"H14","type":"categorize","title":"True scope vs common misconception","summary":"Five claims about M1037 \u2014 sort them","scenario":[{"label":"ARTEFACT 1 \u2014 Vendor pitch bingo card","kind":"prose","body":"<p>A sales deck and an ATT&amp;CK printout sit side by side. Five claims about M1037 are on the table \u2014 the architect asks you to sort honest scope from sales fiction.</p>"}],"question":"Drag each claim to the right card: true scope of M1037, or misconception.","data":{"buckets":[{"id":"w1","name":"TRUE \u2014 matches M1037's scope"},{"id":"w2","name":"MISCONCEPTION \u2014 not what M1037 does"}],"items":[{"id":"x1","t":"It is preventive: it stops flows before delivery","bucket":"w1"},{"id":"x2","t":"It covers ingress, egress and lateral traffic","bucket":"w1"},{"id":"x3","t":"Its blocked-flow logs feed later detections","bucket":"w1"},{"id":"x4","t":"It guarantees encrypted C2 is stopped","bucket":"w2"},{"id":"x5","t":"It tells you who the attacker was","bucket":"w2"}]},"hint":"The page describes a traffic filter with three directions. Anything promising certainty or attribution is selling something else.","explain":"<p><b>True:</b> M1037 is preventive (drops happen before delivery), spans all three directions (ATT&amp;CK: 'ingress, egress, and lateral network traffic'), and its reject/deny telemetry feeds the detection programme. <b>Misconception:</b> encrypted C2 inside allowed TLS is precisely its documented residual risk (hence the application-layer measure, and even that has limits), and no network filter produces attribution \u2014 identity of an operator comes from intelligence work, not from a drop counter. Keeping scope claims honest is what makes the control's KPIs meaningful.</p>","study":"M1037 scope: preventive, three traffic directions, telemetry value; not attribution, not a TLS guarantee.","concepts":["M1037","control category","attribution"]},{"id":"H15","type":"order","title":"First egress filtering programme","summary":"Roll-out plan \u2014 order five phases","scenario":[{"label":"ARTEFACT 1 \u2014 Programme plan, phases shuffled","kind":"prose","body":"<p>The network team won budget for company-wide egress filtering (M1037) for the first time. The five phases of the plan arrived shuffled from the consultant.</p>"},{"label":"ARTEFACT 2 \u2014 The five phases","kind":"prose","body":"<ol><li>Pilot on one low-risk segment with allowlists in monitor-then-enforce mode</li><li>Inventory business applications and their required flows</li><li>Widen enforcement segment by segment, keeping the rollback path warm</li><li>Watch deny logs during pilot, fix missing flows, update the allowlists</li><li>Build role-based allowlists from the inventory (per segment, per server role)</li></ol>"}],"question":"Order the five phases from first to last.","data":{"items":[{"id":"y1","t":"Pilot on one low-risk segment (monitor-then-enforce)"},{"id":"y2","t":"Inventory business applications and their required flows"},{"id":"y3","t":"Widen enforcement segment by segment, rollback kept warm"},{"id":"y4","t":"Watch pilot deny logs, fix missing flows, update allowlists"},{"id":"y5","t":"Build role-based allowlists from the inventory"}],"correctOrder":["y2","y5","y1","y4","y3"]},"hint":"You cannot allowlist what you never inventoried, and you never widen enforcement before the pilot taught you its gaps.","explain":"<p>The safe order: <b>inventory</b> \u2192 <b>allowlists per role</b> \u2192 <b>pilot</b> (monitor-then-enforce on one segment) \u2192 <b>tune from deny logs</b> (pilot rejections are free lessons) \u2192 <b>widen with rollback warm</b>. Inverting any two steps hurts: enforcing before inventory breaks unknown apps (the H10 scenario at scale), and widening before tuning multiplies false positives across every segment at once. This is the standard M1037 roll-out pattern \u2014 inventory-driven allowlists, piloted, tuned, then widened.</p>","study":"egress filtering roll-out: inventory, allowlists, pilot, tune, widen.","concepts":["M1037","egress policy","roll-out"]},{"id":"H16","type":"qcm","title":"Prove the filter enforced","summary":"Two-step evidence question \u2014 which artefact proves enforcement","scenario":[{"label":"ARTEFACT 1 \u2014 Auditor's request","kind":"prose","body":"<p>After a test where the team 'verified the C2 block works', the auditor asks: <i>'Show me the artefact that proves the filter itself enforced the block \u2014 not just that something happened on the network.'</i></p>"},{"label":"ARTEFACT 2 \u2014 Four candidate artefacts from the test","kind":"prose","body":"<ol><li>Firewall log: <span style='font-family:monospace'>DENY TCP 10[.]20[.]1[.]9:51122 -> 203[.]0[.]113[.]77:443 rule EG-01</span> at the exact test minute</li><li>EDR log: process <span style='font-family:monospace'>beacon-sim.exe</span> started on the test host</li><li>AV log: a test file was quarantined on the test host</li><li>Proxy log: the test user's session appears with category 'uncategorised'</li></ol>"}],"question":"Which artefact proves the network filter itself enforced the block?","data":{"options":[{"id":"z1","t":"The firewall DENY line matching rule EG-01 at test time"},{"id":"z2","t":"The EDR process-start record for beacon-sim.exe"},{"id":"z3","t":"The AV quarantine record on the test host"},{"id":"z4","t":"The proxy log entry showing an uncategorised session"}],"correct":["z1"]},"hint":"Two steps: decide which device owns the enforcement, then pick the record that only that device can write.","explain":"<p>Only the enforcing device can write proof of enforcement: a <b>firewall DENY line naming the rule</b> is the filter's own testimony that it dropped the flow (and which rule matched). The EDR record proves a process ran, the AV record proves a file was quarantined, the proxy entry proves a session was seen \u2014 none of them is the network filter acting. This distinction matters in audits and incidents alike: M1037 lives at firewalls, proxies, ACLs and host firewalls, so its evidence lives in their logs.</p>","study":"control evidence: enforcement logs from the enforcing device.","concepts":["M1037","firewall DENY logs","GRC"]}];
(function () {
  'use strict';
  var CFG = window.EXAM_CONFIG;
  var EXS = window.EXERCISES;
  var INTRO = window.INTRO_CONTENT;
  var THEMES = window.THEMES;

  /* ---------------- utils ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var r = a.slice(); var i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  /* ---------------- syntax highlighting for logs ---------------- */
  function hlLog(raw) {
    var out = esc(raw);
    out = out.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g, '<span class="tok-ip">$1</span>');
    out = out.replace(/(^\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/gm, '<span class="tok-time">$1</span>');
    out = out.replace(/\b(DENY|REJECT|DROP|BLOCK|DENIED|blocked|flushed)\b/g, '<span class="tok-act a-deny">$1</span>');
    out = out.replace(/\b(ALLOW|PERMIT|ACCEPT|ALLOWED|allowed|established)\b/g, '<span class="tok-act a-allow">$1</span>');
    out = out.replace(/\b(TCP|UDP|ICMP|SMB|SSH|DNS|HTTP|HTTPS|FTP|SMTP|RDP|Telnet|SNMP|LLMNR|NetBIOS|VNC|BITS)\b/g, '<span class="tok-proto">$1</span>');
    out = out.replace(/:(\d{2,5})\b/g, ':<span class="tok-port">$1</span>');
    return out;
  }
  function renderArtefact(a) {
    var wrap = el('div', 'artefact');
    var lab = el('div', 'a-label');
    lab.innerHTML = '<span>' + esc(a.label) + '</span>';
    if (a.filter) {
      var fb = el('span', 'filterbox');
      fb.innerHTML = '<label for="flt_' + fltCount + '" style="font-size:12px">Filter:</label>';
      var inp = document.createElement('input');
      inp.type = 'text'; inp.id = 'flt_' + fltCount; inp.placeholder = 'type to filter lines';
      inp.setAttribute('aria-label', 'Filter log lines');
      fb.appendChild(inp);
      lab.appendChild(fb);
      (function (inputRef) {
        inputRef.addEventListener('input', function () {
          var q = inputRef.value.toLowerCase();
          var lines = wrap.querySelectorAll('pre.log .lline');
          for (var i = 0; i < lines.length; i++) {
            lines[i].style.display = (!q || lines[i].textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
          }
        });
      })(inp);
      fltCount++;
    }
    wrap.appendChild(lab);
    var body = el('div', 'a-body ' + (a.kind === 'log' ? 'logbody' : 'prose'));
    if (a.kind === 'log') {
      var pre = el('pre', 'log');
      var lines = String(a.body).split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        html += '<span class="lline" style="display:block">' + (hlLog(lines[i]) || '&nbsp;') + '</span>';
      }
      pre.innerHTML = html;
      body.appendChild(pre);
    } else if (a.kind === 'code') {
      var pc = el('pre', 'code');
      pc.innerHTML = esc(a.body);
      body.appendChild(pc);
    } else {
      body.innerHTML = '<div>' + a.body + '</div>';
    }
    wrap.appendChild(body);
    return wrap;
  }
  var fltCount = 0;

  /* ---------------- timer state machine ----------------
     States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
     Check      -> PAUSED_AUTO_CHECK (before feedback renders)
     Next       -> RUNNING (or ENDED via Final Submit on last)
     Skip/Hint  -> state unchanged (timer keeps running)
     Pause      -> PAUSED_MANUAL (hides exercise); Resume returns to prior state
  ------------------------------------------------------ */
  var T = { state: 'RUNNING', remaining: CFG.durationSec, accManual: 0, accAuto: 0, last: Date.now(), exDeadline: null };
  function setState(s) { T.state = s; renderHeader(); }
  function tick() {
    var now = Date.now(); var d = (now - T.last) / 1000; T.last = now;
    if (phase === 'intro') { return; } /* the clock only runs once the exam starts */
    if (T.state === 'PAUSED_MANUAL') { T.accManual += d; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { T.accAuto += d; }
    else if (T.state === 'RUNNING') {
      T.remaining -= d;
      if (T.exDeadline !== null) {
        T.exDeadline -= d;
        renderExTimer();
        if (T.exDeadline <= 0) { autoCheckTerminal(); }
      }
      if (T.remaining <= 0) { T.remaining = 0; timerEnded(); }
    }
    renderTimer();
  }
  function renderTimer() {
    var chip = $('timerChip'); if (!chip) return;
    var st, cls;
    if (T.state === 'RUNNING') { st = 'RUNNING'; cls = 'st-running'; }
    else if (T.state === 'PAUSED_MANUAL') { st = 'PAUSED — manual (press Resume)'; cls = 'st-paused-manual'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { st = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'st-paused-auto-check'; }
    else { st = 'ENDED'; cls = 'st-ended'; }
    chip.innerHTML = '<span>' + (T.state === 'PAUSED_MANUAL' || T.state === 'PAUSED_AUTO_CHECK' ? '\u23F8' : '\u23F1') + '</span><span class="tstate ' + cls + '">' + st + '</span><span id="tval">' + fmtTime(T.remaining) + '</span>';
  }
  function renderExTimer() {
    var c = $('exTimerChip'); if (!c) return;
    if (T.exDeadline === null) { c.classList.add('hidden'); return; }
    c.classList.remove('hidden');
    c.innerHTML = '\u23F1 sub-task time left: <b>' + Math.max(0, Math.ceil(T.exDeadline)) + 's</b>';
  }

  /* ---------------- attempt state ---------------- */
  var attempt = 0;
  var order = [];            /* exercise copies in attempt order */
  var idx = 0;
  var credits = {};          /* exId -> credit */
  var skipped = {};          /* exId -> true (skipped, unanswered) */
  var hintUsed = {};
  var current = null;
  var phase = 'intro';
  var fromReview = false;
  var reportedForAttempt = -1;
  var answerWidgets = {};    /* per-type live answer data */

  function makeAttemptCopies() {
    order = EXS.map(function (e) { return JSON.parse(JSON.stringify(e)); });
    for (var i = 0; i < order.length; i++) { preShuffle(order[i]); }
    order = shuffle(order);
  }
  function preShuffle(e) {
    var d = e.data;
    if (d.options) d.options = shuffle(d.options);
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.items && d.correctOrder) d.display = shuffle(d.items);
    if (d.pairs) d.rightOpts = shuffle(d.pairs.map(function (p) { return p.right; }));
    if (d.steps) { for (var j = 0; j < d.steps.length; j++) d.steps[j].options = shuffle(d.steps[j].options); }
    if (d.type === 'terminal') { d.elements = shuffle(d.elements); }
  }

  /* ---------------- scoring core ---------------- */
  /* scoreItems: H = correct items selected, W = wrong items selected, N = total correct items
     credit = max(0, (H - W) / N)   (partial-credit contract) */
  function scoreItems(selectedIds, correctIds) {
    var N = correctIds.length;
    var H = 0, W = 0;
    var sel = selectedIds || [];
    for (var i = 0; i < sel.length; i++) {
      if (correctIds.indexOf(sel[i]) !== -1) H++; else W++;
    }
    return { N: N, H: H, W: W, credit: N === 0 ? 1 : Math.max(0, (H - W) / N) };
  }

  /* ---------------- app shell ---------------- */
  var app;
  function boot() {
    app = $('app');
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d) return;
      if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
        if (d.username) { CFG.learner = d.username; var g = $('greetLine'); if (g) g.textContent = 'Welcome, ' + d.username + '. You can start when ready.'; }
      }
    });
    renderIntro();
    setInterval(tick, 250);
  }

  function renderIntro() {
    phase = 'intro';
    T.state = 'RUNNING'; /* timer idle until exam starts; tick guard: phase check */
    var hdr = $('xheader'); if (hdr) hdr.classList.add('hidden');
    app.innerHTML = '';
    var w = el('div', 'intro');
    var sevChip = '<span class="chip sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + ' tier ' + CFG.batch + ' of 4</span>';
    w.innerHTML = '<h1>' + esc(CFG.examTitle) + '</h1>' +
      '<p class="subtitle">MITRE ATT&amp;CK practice certification &middot; topic ' + esc(CFG.topicId.toUpperCase()) + ' &middot; ' + esc(CFG.objectType) + '</p>' +
      '<div class="meta-chips">' + sevChip +
      '<span class="chip">' + CFG.questionCount + ' exercises</span>' +
      '<span class="chip">' + CFG.estimatedMinutes + ' minutes</span>' +
      '<span class="chip">Pass mark: ' + CFG.passMark + '%</span></div>' +
      '<p id="greetLine" style="font-weight:600">' + (CFG.learner ? 'Welcome, ' + esc(CFG.learner) + '.' : '') + ' You will practise one ATT&amp;CK object from many angles. Read the short lesson below first.</p>';

    var p1 = el('div', 'panel');
    p1.innerHTML = '<h2><span aria-hidden="true">\uD83D\uDCD8</span> About ' + esc(CFG.objectId) + ' — ' + esc(CFG.objectName) + '</h2>' + INTRO.about;
    w.appendChild(p1);

    var p2 = el('div', 'panel');
    p2.innerHTML = '<h2><span aria-hidden="true">\uD83E\uDDD0</span> Keywords covered in this tier</h2>' +
      '<p style="font-size:14px;color:var(--muted)">These are the ATT&amp;CK ideas behind the exercises. The four tiers of this topic share the same object; each tier exercises them at its own depth.</p>' +
      renderThemes();
    w.appendChild(p2);

    var p3 = el('div', 'panel');
    p3.innerHTML = '<h2><span aria-hidden="true">\uD83C\uDFAF</span> How this exam works</h2>' + INTRO.howto;
    w.appendChild(p3);

    var p4 = el('div', 'panel');
    p4.innerHTML = '<h2><span aria-hidden="true">\u2696\uFE0F</span> Rules in plain words</h2>' + INTRO.rules;
    w.appendChild(p4);

    var startBtn = el('button', 'primary', 'Start the exam');
    startBtn.id = 'startBtn';
    startBtn.style.fontSize = '17px';
    startBtn.style.padding = '12px 30px';
    startBtn.addEventListener('click', startExam);
    var sb = el('div', 'panel'); sb.style.textAlign = 'center';
    sb.appendChild(startBtn);
    w.appendChild(sb);
    app.appendChild(w);
  }

  function renderThemes() {
    var h = '';
    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      h += '<div class="theme-block"><div class="theme-name"><span aria-hidden="true">' + t.icon + '</span> ' + esc(t.name) + '</div>';
      for (var j = 0; j < t.keywords.length; j++) { h += '<span class="kw">' + esc(t.keywords[j]) + '</span>'; }
      h += '</div>';
    }
    return h;
  }


  /* ---------------- exam flow ---------------- */
  function startExam() {
    attempt++;
    credits = {}; skipped = {}; hintUsed = {};
    idx = 0; reportedForAttempt = -1; fromReview = false;
    T.remaining = CFG.durationSec; T.accManual = 0; T.accAuto = 0; T.exDeadline = null; T.last = Date.now();
    makeAttemptCopies();
    phase = 'exam';
    var hdr = $('xheader'); if (hdr) hdr.classList.remove('hidden');
    setState('RUNNING');
    renderExercise(order[idx]);
  }

  function renderHeader() {
    var h = $('xheader'); if (!h) return;
    var score = scoreLine();
    var pauseBtn = T.state === 'PAUSED_MANUAL'
      ? '<button class="hbtn" id="pauseBtn" aria-label="Resume exam">\u25B6 Resume</button>'
      : '<button class="hbtn" id="pauseBtn" aria-label="Pause exam">\u23F8 Pause</button>';
    var counterTxt = phase === 'review' ? 'Review skipped'
      : phase === 'results' ? 'Results'
      : 'Exercise ' + Math.min(idx + 1, order.length) + ' of ' + order.length;
    h.innerHTML =
      '<span class="counter">' + counterTxt + '</span>' +
      '<span class="sev-badge sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + '</span>' +
      '<span class="timer-chip" id="timerChip"></span>' +
      '<span class="score-chip" aria-label="Live score">\u2605 <span id="liveScore">' + score + '</span></span>' +
      '<span class="spacer"></span>' +
      (phase === 'exam' && !answeredCurrent() ? '<button class="hbtn" id="hintBtn" aria-label="Show one hint">\uD83D\uDCA1 Hint</button>' : '') +
      (phase === 'exam' ? '<button class="hbtn" id="skipBtn" aria-label="Skip exercise">\u23ED Skip</button>' : '') +
      pauseBtn;
    renderTimer();
    bindHeader();
  }
  function bindHeader() {
    var b;
    b = $('pauseBtn'); if (b) b.addEventListener('click', onPauseToggle);
    b = $('hintBtn'); if (b) b.addEventListener('click', onHint);
    b = $('skipBtn'); if (b) b.addEventListener('click', onSkip);
  }
  function answeredCurrent() { return current && credits[current.id] !== undefined; }
  function scoreLine() {
    var n = 0, s = 0;
    for (var k in credits) { n++; s += credits[k]; }
    if (n === 0) return '0.0 / 0 (—%)';
    return round1(s) + ' / ' + n + ' (' + Math.round(s / n * 100) + '%)';
  }
  function updateScore() { var ls = $('liveScore'); if (ls) ls.textContent = scoreLine(); }

  function onPauseToggle() {
    if (phase !== 'exam' && phase !== 'review') return;
    if (T.state === 'PAUSED_MANUAL') {
      setState(T.prevState || 'RUNNING');
      var veil = $('pauseVeil'); if (veil) veil.remove();
    } else {
      T.prevState = T.state;
      setState('PAUSED_MANUAL');
      showPauseVeil();
    }
  }
  function showPauseVeil() {
    var veil = $('pauseVeil');
    if (!veil) {
      veil = el('div', '');
      veil.id = 'pauseVeil';
      veil.style.cssText = 'position:fixed;inset:0;background:rgba(15,28,51,.93);z-index:100;display:flex;align-items:center;justify-content:center;color:#e8eefb;text-align:center;padding:20px';
      veil.innerHTML = '<div><div style="font-size:40px" aria-hidden="true">\u23F8</div><div style="font-size:20px;font-weight:800;margin-top:8px">PAUSED — manual break</div><p style="max-width:420px;color:#c4d2ec">The exercise is hidden so you cannot read it while the clock is stopped. Press Resume to continue.</p></div>';
      veil.addEventListener('click', onPauseToggle);
      document.body.appendChild(veil);
    }
  }

  function onHint() {
    if (!current || hintUsed[current.id] || answeredCurrent()) return;
    hintUsed[current.id] = true;
    var box = $('hintBox');
    if (box) { box.innerHTML = '<b>Hint:</b> ' + esc(current.hint); box.classList.remove('hidden'); }
    var hb = $('hintBtn'); if (hb) { hb.disabled = true; hb.title = 'Hint already used for this exercise'; }
  }

  function onSkip() {
    if (!current || answeredCurrent()) return;
    skipped[current.id] = true;
    T.exDeadline = null;
    if (fromReview) { fromReview = false; gotoReview(); return; }
    if (idx < order.length - 1) { idx++; setState('RUNNING'); renderExercise(order[idx]); }
    else { gotoReview(); }
  }

  function gotoReview() {
    phase = 'review';
    T.exDeadline = null;
    if (T.state !== 'ENDED') setState('RUNNING');
    renderReview();
  }

  function renderReview() {
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');
    var ids = [];
    for (var k in skipped) { if (credits[k] === undefined) ids.push(k); }
    var h = '<div class="block"><div class="block-head"><span class="bicon">\uD83D\uDDC9</span> REVIEW SKIPPED EXERCISES</div><div class="block-body">';
    if (ids.length === 0) {
      h += '<p>You have answered or re-checked every exercise. Nothing is waiting here.</p>';
    } else {
      h += '<p>These exercises are still unanswered. Skipped-and-unanswered exercises are <b>excluded from your score</b>. You can answer them now, as many times as you like, until the timer ends. Or submit and leave them out.</p>';
    }
    h += '</div></div>';
    w.innerHTML = h;
    var list = el('div', 'reviewlist');
    for (var i = 0; i < ids.length; i++) {
      (function (id) {
        var ex = order.filter(function (o) { return o.id === id; })[0];
        if (!ex) return;
        var row = el('div', 'reviewrow');
        row.innerHTML = '<span class="rt"><b>' + esc(id) + '</b> — ' + esc(ex.summary) + '</span>';
        var btn = el('button', 'primary', 'Answer now');
        btn.addEventListener('click', function () {
          phase = 'exam';
          fromReview = true;
          idx = order.indexOf(ex);
          setState('RUNNING');
          renderExercise(ex);
        });
        row.appendChild(btn);
        list.appendChild(row);
      })(ids[i]);
    }
    w.appendChild(list);
    var act = el('div', 'actionrow');
    var sub = el('button', 'primary', 'Submit exam and see results');
    sub.addEventListener('click', finalSubmit);
    act.appendChild(sub);
    w.appendChild(act);
    app.appendChild(w);
  }

  /* ---------------- exercise rendering ---------------- */
  function renderExercise(ex) {
    current = ex;
    answerWidgets = {};
    fltCount = 0;
    /* reduced per-exercise timer (EXTREMELY HARD terminal only) */
    T.exDeadline = ex.perExerciseTimer ? ex.perExerciseTimer : null;
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');

    /* header block: severity + title */
    w.appendChild(el('div', '', '<h2 style="margin:8px 0 0;color:var(--head)">' + esc(ex.id) + ' — ' + esc(ex.title) + '</h2>'));

    /* SCENARIO block (collapsible when long) */
    var scen = el('div', 'block scenario');
    var shead = el('div', 'block-head');
    shead.innerHTML = '<span class="bicon">\uD83D\uDCCB</span> SCENARIO';
    scen.appendChild(shead);
    var panels = ex.scenario;
    var totalLen = 0;
    for (var sl = 0; sl < panels.length; sl++) { totalLen += String(panels[sl].body || '').length; }
    var collapsed = totalLen > 420;
    var sbody = el('div', 'block-body');
    for (var i = 0; i < panels.length; i++) sbody.appendChild(renderArtefact(panels[i]));
    if (collapsed) {
      var sum = el('button', 'scen-summary');
      sum.type = 'button';
      sum.innerHTML = '<span class="caret" aria-hidden="true">\u25BC</span><span>' + esc(ex.summary) + '</span><span style="margin-left:auto;font-weight:400">(tap to collapse / expand the scenario)</span>';
      sum.setAttribute('aria-expanded', 'true');
      sum.addEventListener('click', function () {
        var open = sbody.style.display !== 'none';
        sbody.style.display = open ? 'none' : '';
        sum.setAttribute('aria-expanded', open ? 'false' : 'true');
        scen.classList.toggle('scen-collapsed', open);
      });
      scen.appendChild(sum);
      scen.appendChild(sbody);
    } else {
      scen.appendChild(sbody);
    }
    w.appendChild(scen);

    /* QUESTION block */
    var q = el('div', 'block question');
    q.innerHTML = '<div class="block-head"><span class="bicon">\u2753</span> QUESTION</div><div class="block-body"><p class="qtext">' + ex.question + '</p></div>';
    w.appendChild(q);

    /* YOUR ANSWER block */
    var a = el('div', 'block answer');
    a.innerHTML = '<div class="block-head"><span class="bicon">\u270D\uFE0F</span> YOUR ANSWER</div>';
    var abody = el('div', 'block-body');
    abody.id = 'answerBody';
    var hintBox = el('div', 'warnbox hidden');
    hintBox.id = 'hintBox';
    abody.appendChild(hintBox);
    if (T.exDeadline !== null) { var etc = el('div', 'warnbox'); etc.id = 'exTimerChip'; abody.appendChild(etc); renderExTimer(); }
    buildWidget(abody, ex);
    var act = el('div', 'actionrow');
    var chk = el('button', 'primary', 'Check');
    chk.id = 'checkBtn';
    chk.addEventListener('click', onCheck);
    act.appendChild(chk);
    var hintNote = el('span', '', '<span style="font-size:12.5px;color:var(--muted)">Check stops the timer so you can read the feedback without pressure. The clock starts again on Next.</span>');
    act.appendChild(hintNote);
    abody.appendChild(act);
    a.appendChild(abody);
    w.appendChild(a);

    /* feedback + next area */
    var fb = el('div', '');
    fb.id = 'feedbackArea';
    w.appendChild(fb);

    app.appendChild(w);
    if (hintUsed[ex.id]) { hintBox.innerHTML = '<b>Hint:</b> ' + esc(ex.hint); hintBox.classList.remove('hidden'); }
  }

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') buildChoice(root, ex);
    else if (ex.type === 'match') buildMatch(root, ex);
    else if (ex.type === 'categorize') buildDnd(root, ex);
    else if (ex.type === 'blank') buildBlank(root, ex);
    else if (ex.type === 'order') buildOrder(root, ex);
    else if (ex.type === 'tree') buildTree(root, ex);
    else if (ex.type === 'clickline') buildClick(root, ex);
    else if (ex.type === 'terminal') buildTerminal(root, ex);
  }

  function buildChoice(root, ex) {
    var d = ex.data;
    var multi = ex.type === 'multi';
    var wrap = el('div', '');
    wrap.setAttribute('role', 'group');
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    answerWidgets.choice = { selected: {}, multi: multi };
    for (var i = 0; i < d.options.length; i++) {
      (function (oi) {
        var lab = el('label', 'opt');
        var input = document.createElement('input');
        input.type = multi ? 'checkbox' : 'radio';
        input.name = 'opt_' + ex.id;
        input.value = oi.id;
        input.addEventListener('change', function () {
          if (multi) {
            if (input.checked) answerWidgets.choice.selected[oi.id] = true;
            else delete answerWidgets.choice.selected[oi.id];
            lab.classList.toggle('selected', input.checked);
          } else {
            answerWidgets.choice.selected = {};
            answerWidgets.choice.selected[oi.id] = true;
            var labs = wrap.querySelectorAll('.opt');
            for (var k = 0; k < labs.length; k++) labs[k].classList.remove('selected');
            lab.classList.add('selected');
          }
        });
        lab.appendChild(input);
        lab.appendChild(el('span', 'olabel', labels[i] + '.'));
        lab.appendChild(el('span', '', '<span>' + esc(oi.t) + '</span>'));
        wrap.appendChild(lab);
      })(d.options[i]);
    }
    root.appendChild(wrap);
  }

  function buildMatch(root, ex) {
    var d = ex.data;
    answerWidgets.match = {};
    for (var i = 0; i < d.pairs.length; i++) {
      (function (p) {
        var row = el('div', 'matchrow');
        row.appendChild(el('div', 'mleft', esc(p.left)));
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Match for: ' + p.left);
        sel.appendChild(new Option('— choose the match —', ''));
        for (var j = 0; j < d.rightOpts.length; j++) sel.appendChild(new Option(d.rightOpts[j], d.rightOpts[j]));
        sel.addEventListener('change', function () { answerWidgets.match[p.left] = sel.value || null; });
        row.appendChild(sel);
        answerWidgets.match[p.left] = null;
        row.dataset.left = p.left;
        root.appendChild(row);
      })(d.pairs[i]);
    }
  }

  function buildDnd(root, ex) {
    var d = ex.data;
    var w = el('div', 'dnd-wrap');
    var bankWrap = el('div', '');
    bankWrap.appendChild(el('div', 'bank-label', 'ITEMS — drag each item, or tap it then tap a bucket'));
    var bank = el('div', 'itembank');
    bank.id = 'bank_' + ex.id;
    bankWrap.appendChild(bank);
    answerWidgets.dnd = { placed: {}, picked: null };
    var items = shuffle(d.items);
    for (var i = 0; i < items.length; i++) { bank.appendChild(makeDItem(items[i])); }
    var buckets = el('div', 'buckets');
    for (var b = 0; b < d.buckets.length; b++) {
      (function (bk) {
        var box = el('div', 'bucket');
        box.dataset.bucket = bk.id;
        box.innerHTML = '<h4><span aria-hidden="true">\uD83D\uDCE5</span> ' + esc(bk.name) + '</h4><div class="b-drop"></div>';
        box.addEventListener('dragover', function (ev) { ev.preventDefault(); box.classList.add('b-over'); });
        box.addEventListener('dragleave', function () { box.classList.remove('b-over'); });
        box.addEventListener('drop', function (ev) {
          ev.preventDefault(); box.classList.remove('b-over');
          var id = ev.dataTransfer.getData('text/plain');
          placeItem(id, bk.id);
        });
        box.addEventListener('click', function () {
          if (answerWidgets.dnd.picked) { placeItem(answerWidgets.dnd.picked, bk.id); }
        });
        buckets.appendChild(box);
      })(d.buckets[b]);
    }
    function makeDItem(it) {
      var di = el('div', 'ditem');
      di.textContent = it.t;
      di.draggable = true; di.dataset.item = it.id; di.id = 'it_' + it.id;
      di.setAttribute('tabindex', '0');
      di.setAttribute('role', 'button');
      di.setAttribute('aria-label', 'Item: ' + it.t + '. Press Enter to pick up, then choose a bucket button below.');
      di.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', it.id); di.classList.add('dragging'); });
      di.addEventListener('dragend', function () { di.classList.remove('dragging'); });
      di.addEventListener('click', function () {
        if (di.classList.contains('locked')) return;
        var was = di.classList.contains('picked');
        var all = document.querySelectorAll('.ditem.picked');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('picked');
        if (!was) { di.classList.add('picked'); answerWidgets.dnd.picked = it.id; }
        else answerWidgets.dnd.picked = null;
      });
      return di;
    }
    function placeItem(id, bucketId) {
      if (!id || answerWidgets.dnd.placed[id] !== undefined) return;
      var di = $('it_' + id); if (!di) return;
      var box = buckets.querySelector('.bucket[data-bucket="' + bucketId + '"] .b-drop');
      if (!box) return;
      di.classList.remove('picked');
      box.appendChild(di);
      answerWidgets.dnd.placed[id] = bucketId;
      answerWidgets.dnd.picked = null;
    }
    w.appendChild(bankWrap);
    w.appendChild(buckets);
    root.appendChild(w);
  }

  function buildBlank(root, ex) {
    var d = ex.data;
    answerWidgets.blank = {};
    var slotsWrap = el('div', 'slots');
    var html = '';
    var text = d.text;
    var parts = text.split(/\{\{(\d+)\}\}/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var n = parts[i];
        html += '<span class="slot" data-slot="' + n + '" tabindex="0" role="button" aria-label="Blank ' + n + ', tap to clear"><span class="sv">&nbsp;</span></span>';
      } else {
        html += esc(parts[i]);
      }
    }
    slotsWrap.innerHTML = html;
    root.appendChild(slotsWrap);
    var slots = slotsWrap.querySelectorAll('.slot');
    var focusSlot = null;
    for (var s = 0; s < slots.length; s++) {
      (function (sl) {
        sl.addEventListener('click', function () {
          if (sl.dataset.token) { /* filled: return token */
            delete answerWidgets.blank[sl.dataset.slot];
            var tk = $('tk_' + sl.dataset.token);
            if (tk) { tk.classList.remove('used'); }
            sl.dataset.token = ''; sl.querySelector('.sv').innerHTML = '&nbsp;'; sl.classList.remove('filled');
          }
          focusSlot = sl.dataset.slot;
        });
      })(slots[s]);
    }
    var lbl = el('div', 'bank-label', 'WORD BANK — tap a word to put it in the last-chosen empty blank (or the next free one)');
    root.appendChild(lbl);
    var bank = el('div', 'bank');
    for (var b = 0; b < d.bank.length; b++) {
      (function (tk) {
        var bt = el('button', 'btoken');
        bt.type = 'button'; bt.id = 'tk_' + tk.id; bt.textContent = tk.t;
        bt.addEventListener('click', function () {
          if (bt.classList.contains('used')) return;
          var target = null;
          if (focusSlot && !answerWidgets.blank[focusSlot]) target = focusSlot;
          if (!target) {
            for (var k = 0; k < slots.length; k++) {
              if (!answerWidgets.blank[slots[k].dataset.slot]) { target = slots[k].dataset.slot; break; }
            }
          }
          if (!target) return;
          answerWidgets.blank[target] = tk.id;
          var slp = slotsWrap.querySelector('.slot[data-slot="' + target + '"]');
          slp.dataset.token = tk.id;
          slp.querySelector('.sv').textContent = tk.t;
          slp.classList.add('filled');
          bt.classList.add('used');
        });
        bank.appendChild(bt);
      })(d.bank[b]);
    }
    root.appendChild(bank);
  }

  function buildOrder(root, ex) {
    var d = ex.data;
    answerWidgets.order = { seq: d.display.map(function (it) { return it.id; }) };
    var list = el('div', 'orderlist');
    list.id = 'orderList';
    function redraw() {
      list.innerHTML = '';
      var seq = answerWidgets.order.seq;
      for (var i = 0; i < seq.length; i++) {
        (function (pos, id) {
          var it = d.display.filter(function (x) { return x.id === id; })[0];
          var row = el('div', 'oline');
          row.draggable = true; row.dataset.pos = pos;
          row.innerHTML = '<span class="onum">' + (pos + 1) + '</span><span class="otext">' + esc(it.t) + '</span>';
          var btns = el('span', 'obtns');
          var up = el('button', '', '\u2191'); up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          var dn = el('button', '', '\u2193'); dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          up.addEventListener('click', function () { swap(pos, -1); });
          dn.addEventListener('click', function () { swap(pos, 1); });
          btns.appendChild(up); btns.appendChild(dn);
          row.appendChild(btns);
          row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(pos)); row.classList.add('dragging'); });
          row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
          row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
          row.addEventListener('drop', function (ev) {
            ev.preventDefault();
            var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
            var to = parseInt(row.dataset.pos, 10);
            if (isNaN(from) || isNaN(to) || from === to) return;
            var s = answerWidgets.order.seq;
            var mv = s.splice(from, 1)[0];
            s.splice(to, 0, mv);
            redraw();
          });
          list.appendChild(row);
        })(i, seq[i]);
      }
    }
    function swap(pos, dir) {
      var s = answerWidgets.order.seq;
      var to = pos + dir;
      if (to < 0 || to >= s.length) return;
      var t = s[pos]; s[pos] = s[to]; s[to] = t;
      redraw();
    }
    redraw();
    root.appendChild(list);
    root.appendChild(el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Use the arrows or drag the rows. First row = rank 1.</span>'));
  }

  function buildTree(root, ex) {
    var d = ex.data;
    answerWidgets.tree = { step: 0, picks: {} };
    var holder = el('div', '');
    holder.id = 'treeHolder';
    root.appendChild(holder);
    var nextBtn = el('button', 'primary', 'Confirm and go to the next step');
    nextBtn.id = 'treeNextBtn';
    nextBtn.disabled = true;
    nextBtn.addEventListener('click', function () {
      var st = d.steps[answerWidgets.tree.step];
      var pick = answerWidgets.tree.picks[answerWidgets.tree.step];
      if (!pick) return;
      answerWidgets.tree.step++;
      nextBtn.disabled = true;
      drawStep();
    });
    root.appendChild(nextBtn);
    function drawStep() {
      holder.innerHTML = '';
      var si = answerWidgets.tree.step;
      if (si >= d.steps.length) {
        nextBtn.disabled = true; nextBtn.classList.add('hidden');
        var done = el('div', 'tree-recorded', '\u2705 All steps answered. Press Check to see how you did.');
        holder.appendChild(done);
        return;
      }
      var st = d.steps[si];
      var box = el('div', 'tree-step');
      box.innerHTML = '<span class="step-tag">STEP ' + (si + 1) + ' OF ' + d.steps.length + '</span>';
      if (st.artefactLabel) box.innerHTML += '<p style="font-size:13px;color:var(--muted);margin:4px 0">Re-read artefact: <b>' + esc(st.artefactLabel) + '</b> above if you need it.</p>';
      box.innerHTML += '<p class="step-q">' + st.q + '</p>';
      var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
      for (var i = 0; i < st.options.length; i++) {
        (function (oi, k) {
          var lab = el('label', 'opt');
          lab.innerHTML = '<input type="radio" name="tree_' + si + '" value="' + oi.id + '"><span class="olabel">' + labels[k] + '.</span><span>' + esc(oi.t) + '</span>';
          var input = lab.querySelector('input');
          input.addEventListener('change', function () {
            answerWidgets.tree.picks[si] = oi.id;
            nextBtn.disabled = false;
          });
          box.appendChild(lab);
        })(st.options[i], i);
      }
      holder.appendChild(box);
    }
    drawStep();
  }

  function buildClick(root, ex) {
    var d = ex.data;
    answerWidgets.click = {};
    var wrap = el('div', 'clicklines');
    for (var i = 0; i < d.lines.length; i++) {
      (function (li, k) {
        var row = el('div', 'cline');
        row.setAttribute('tabindex', '0');
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', 'Log line ' + (k + 1) + '. Press Enter to select.');
        row.innerHTML = '<span class="cnum">' + (k + 1) + '</span><span>' + hlLog(li) + '</span>';
        row.addEventListener('click', function () {
          if (row.classList.contains('locked')) return;
          if (!ex.data.multi) {
            var all = wrap.querySelectorAll('.cline.selected');
