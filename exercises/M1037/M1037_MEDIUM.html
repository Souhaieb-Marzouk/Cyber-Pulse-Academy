<script>
window.EXAM_CONFIG = {"topicId":"m1037","batch":2,"difficulty":"medium","severityLabel":"MEDIUM","objectId":"M1037","objectName":"Filter Network Traffic","objectType":"Mitigation (ATT&CK Enterprise)","examTitle":"M1037 Filter Network Traffic \u2014 MEDIUM practice exam","durationSec":2100,"estimatedMinutes":35,"passMark":70,"questionCount":16,"learner":""};
window.INTRO_CONTENT = {"about":"\n<p><b>M1037 is called Filter Network Traffic.</b> In MITRE ATT&amp;CK it is a <b>Mitigation</b>.\nA mitigation is the opposite of an attack: it is a defence that stops or slows known attack techniques.\nATT&amp;CK lists attacks as techniques with IDs like T1090. It lists defences as mitigations with IDs like M1037.</p>\n\n<p><b>What does it mean in practice?</b> M1037 says: use network appliances (firewalls, proxies) and endpoint\nsoftware to <b>filter</b> traffic in three directions. <b>Ingress</b> filtering checks traffic coming <i>into</i> your\nnetwork. <b>Egress</b> filtering checks traffic <i>leaving</i> your network. <b>Lateral</b> filtering checks traffic\nmoving <i>inside</i> your network, between systems. The filter compares each connection against rules. A rule can\nlook at the port (for example TCP 445), the protocol (for example SMB), the IP address, or the domain name.</p>\n\n<p><b>Imagine a big office building.</b> The network is the building. The firewall is the guard at the door.\nThe guard works from a rule list: which doors may open, which visitors may pass, and which rooms they may enter.\nThe guard also stops people from carrying boxes out of the building (data theft is called exfiltration) and stops\nan outsider from whispering secret instructions to someone inside (that secret channel is called C2, short for\ncommand and control). MITRE also lists M1037 for the two big floods, T1498 and T1499. A flood attack (also called\nDoS, short for Denial of Service) sends so much traffic that a service stops working. Here the filter drops the\nflood traffic upstream, before it can drown the service.</p>\n\n<h3>Where you will meet M1037 in real work</h3>\n<ul>\n<li><b>SOC analyst (monitoring team):</b> you read firewall and proxy logs every shift. Lines with\n<span style=\"font-family:monospace\">DENY</span> show what the filter stopped. Many denies from one host can be a real attack.</li>\n<li><b>Firewall / network administrator:</b> you write the rules, test them, and deploy them through a change process.\nYou also remove old rules that are too permissive.</li>\n<li><b>Incident responder (IR):</b> when a host is compromised, you quickly add a deny rule to cut the attacker's\nchannel. This is containment with M1037.</li>\n<li><b>Detection engineer:</b> you build alerts from denied-flow logs, for example when one host makes many\ndenied connections in a short time.</li>\n<li><b>Threat intel analyst (CTI):</b> you map attacker behaviour, for example <span style=\"font-family:monospace\">T1090 Proxy</span>\nor <span style=\"font-family:monospace\">T1572 Protocol Tunneling</span>, to the controls that stop it, and M1037 is one of the main ones.</li>\n<li><b>GRC analyst:</b> you prove the control exists. You map M1037 to frameworks: NIST CSF (PR.PT-4, PR.AC-5),\nCIS Controls (Control 9, and 4.4/4.5/13.4 in v8), and ISO 27001 (A.8.20 to A.8.22).</li>\n<li><b>Cloud engineer:</b> you use security groups and IP allowlists. ATT&amp;CK lists this same idea for cloud\ndata theft (T1530, T1537) and for the cloud metadata API (T1552.005).</li>\n</ul>\n\n<h3>The five measures of M1037</h3>\n<ul>\n<li><b>Ingress traffic filtering:</b> only trusted sources may reach public servers. Limit SSH (22) and RDP (3389) to known IP ranges.</li>\n<li><b>Egress traffic filtering:</b> block outbound traffic to bad destinations so C2 and stolen data cannot leave.</li>\n<li><b>Protocol-based filtering:</b> allow only needed protocols; block abused ones like Telnet or old SMBv1 (EternalBlue).</li>\n<li><b>Network segmentation:</b> split the network into zones and filter the traffic between zones.</li>\n<li><b>Application layer filtering:</b> use proxies or a WAF to inspect web traffic and block attacks like SQL injection.</li>\n</ul>\n\n<p><b>Tools you will see:</b> perimeter firewalls and NGFW, host firewalls (Windows Defender Firewall, iptables on\nLinux), web proxies, WAFs, router ACLs, switch features (DHCP snooping, Dynamic ARP Inspection, port security),\nand cloud security groups.</p>\n","howto":"<p><b>This is the MEDIUM tier (tier 2 of 4).</b> Each exercise connects two ideas, for example recognise the technique, then choose the control that fits it. Scenarios are a bit longer and you must decide yourself what to look at first. Wrong answers fail for one specific, explainable reason.</p><p><b>Exercise types in this tier:</b> multi-select mapping, matching, decision-tree scenarios, drag-and-drop sorting, policy and config drafting (fill-in-the-blank), timeline ordering, log/rule auditing and single-choice questions.</p><p><b>Timer:</b> 35 minutes in total. The clock runs only while you work, never while you read feedback.</p>","rules":"\n<ul>\n<li><b>Passing score: 70%.</b> Your score is the sum of exercise credits, divided by the number of exercises you answered.</li>\n<li><b>16 exercises</b> of multi-select mapping, matching, decision-tree scenarios, drag-and-drop sorting, policy and config drafting (fill-in-the-blank), timeline ordering, log/rule auditing and single-choice questions.</li>\n<li><b>Timer: 35 minutes</b> for this tier. The clock runs only while you work.</li>\n<li><b>Partial credit:</b> many exercises have more than one right item. Each right item adds credit; each wrong\nitem subtracts. The formula is <span style=\"font-family:monospace\">max(0, (H \u2212 W) / N)</span>. H is the items you got right,\nW the wrong ones you chose, N the total right items. Selecting everything is worth zero, not full marks.</li>\n<li><b>Hint:</b> one hint per exercise. It costs 10% of that exercise's credit. A partial answer after a hint still earns partial credit.</li>\n<li><b>Check auto-pause:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you\nwant. Nothing is lost. The timer starts again only when you press <b>Next</b> (or Final Submit on the last exercise).</li>\n<li><b>Manual pause:</b> the Pause button stops the clock and hides the exercise. Resume brings it back.</li>\n<li><b>Skip:</b> every exercise has Skip. Skipped exercises wait in a review pool. Before the end you can open them\nagain and answer, as often as you like, while the timer runs. If you submit with skipped exercises left, they are\nsimply excluded from the score \u2014 no penalty, no points.</li>\n<li><b>Retake:</b> if you fail, the Retake button resets everything and shuffles questions and answers again.</li>\n</ul>\n"};
window.THEMES = [{"icon":"\ud83d\udee1","name":"Mitigation identity & scope","keywords":["M1037","Filter Network Traffic","Mitigation object (Enterprise)","ingress filtering","egress filtering","lateral traffic filtering","protocol-based filtering","firewall rules","predefined conditions (ports, protocols, IPs, domains)"]},{"icon":"\ud83c\udfaf","name":"Techniques addressed by M1037","keywords":["T1557 Adversary-in-the-Middle (+.001/.002/.003)","T1071 Application Layer Protocol (+.001-.005)","T1090 Proxy (+.003 Multi-hop)","T1095 Non-Application Layer Protocol","T1572 Protocol Tunneling","T1048 Exfiltration Over Alternative Protocol (+.001-.003)","T1190 Exploit Public-Facing Application","T1105 Ingress Tool Transfer","T1570 Lateral Tool Transfer","T1219 Remote Access Tools (+.002)","T1021.002 SMB/Admin Shares","T1021.005 VNC","T1218 System Binary Proxy Execution (+.012)","T1205 Traffic Signaling (+.001 Port Knocking)","T1187 Forced Authentication","T1197 BITS Jobs","T1530 Data from Cloud Storage","T1537 Transfer Data to Cloud Account","T1602 Data from Configuration Repository (+.001/.002)","T1498/T1499 Network & Endpoint DoS","T1599 Network Boundary Bridging (+.001)","T1552.005 Cloud Instance Metadata API"]},{"icon":"\ud83d\udd0c","name":"Enforcement points & tools","keywords":["perimeter firewall / NGFW","host firewall (Windows Defender Firewall, iptables)","web proxy","WAF (web application firewall)","router ACLs","switch controls (DHCP snooping, Dynamic ARP Inspection, port security)","cloud security groups & IP allowlisting","CDN / upstream DoS scrubbing","stateful firewall"]},{"icon":"\u2699","name":"Control design & trade-offs","keywords":["preventive control","deny-by-default","allowlist vs blocklist","rule order (first match wins)","rule sprawl & exceptions","encrypted-traffic limits (L4 cannot read inside TLS)","domain fronting circumvention","false positives vs business apps","change management","rollback"]},{"icon":"\ud83d\udcd0","name":"Framework & policy mappings","keywords":["NIST CSF PR.PT-4","NIST CSF PR.AC-5","CIS Control 9 (ports, protocols, services)","CIS v8 4.4 / 4.5 (firewalls on servers / devices)","CIS v8 13.4 (application layer filtering)","ISO 27001 A.8.20-A.8.22","egress filtering policy","exception register"]},{"icon":"\ud83d\udce1","name":"Detection support & telemetry","keywords":["firewall DENY logs","proxy logs","NetFlow","blocked-flow analysis","Network Traffic Flow data source","alerting on denied spikes","tuning with asset data"]}];
window.EXERCISES = [{"id":"M01","type":"multi","title":"Build the covered-technique list","summary":"ATT&CK mapping \u2014 pick the four real entries","scenario":[{"label":"ARTEFACT 1 \u2014 CTI task list","kind":"prose","body":"<p>The CTI lead sends a task: <i>'We are building a control-coverage sheet for M1037. From the shortlist below, keep only the techniques that the ATT&amp;CK M1037 page really addresses. Delete the rest.'</i></p>"}],"question":"Select every technique that the ATT&CK M1037 page lists as addressed (four are correct).","data":{"options":[{"id":"a1","t":"T1090 \u2014 Proxy"},{"id":"a2","t":"T1572 \u2014 Protocol Tunneling"},{"id":"a3","t":"T1071.004 \u2014 Application Layer Protocol: DNS"},{"id":"a4","t":"T1557 \u2014 Adversary-in-the-Middle"},{"id":"a5","t":"T1003 \u2014 OS Credential Dumping"},{"id":"a6","t":"T1486 \u2014 Data Encrypted for Impact"}],"correct":["a1","a2","a3","a4"]},"hint":"Two of the wrong ones happen entirely inside the endpoint or destroy data locally \u2014 traffic never crosses a filter you control.","explain":"<p>The M1037 page lists <b>T1090 Proxy</b> (block lists stop proxy and C2 infrastructure), <b>T1572 Protocol Tunneling</b> (filter traffic to untrusted destinations), <b>T1071.004 DNS</b> (filter DNS to known-bad domains, resolve via on-premise servers) and <b>T1557 Adversary-in-the-Middle</b> (block legacy protocols that enable AiTM). <b>T1003</b> dumps passwords from memory and <b>T1486</b> encrypts files for ransom \u2014 both stay inside the machine, so a network filter cannot address them, and ATT&amp;CK does not list them under M1037.</p>","study":"the techniques-addressed table of the M1037 ATT&CK page.","concepts":["M1037","T1090","T1572","T1071.004","T1557","T1003","T1486"]},{"id":"M02","type":"match","title":"How filtering answers each technique","summary":"Technique \u2192 the filtering use ATT&CK prescribes","scenario":[{"label":"ARTEFACT 1 \u2014 Control-design workshop board","kind":"prose","body":"<p>In a workshop, the detection engineer lists seven techniques from the M1037 page and asks the room to match each to the filtering measure ATT&amp;CK prescribes for it. The uses are jumbled on the right.</p>"}],"question":"Match each technique to the filtering use that ATT&CK prescribes for it.","data":{"pairs":[{"left":"T1557.001 \u2014 Name Resolution Poisoning and SMB Relay","right":"Block LLMNR/NetBIOS/mDNS traffic and enable SMB Signing"},{"left":"T1071.001 \u2014 Web Protocols","right":"Allow outbound web from servers only to approved destinations"},{"left":"T1187 \u2014 Forced Authentication","right":"Block SMB ports 139/445 and WebDAV from leaving the network"},{"left":"T1021.005 \u2014 VNC","right":"Filter or block VNC default ports 5900, 5800 and 5500"},{"left":"T1071.003 \u2014 Mail Protocols","right":"Let only trusted mail servers send outbound SMTP/IMAP/POP3"},{"left":"T1105 \u2014 Ingress Tool Transfer","right":"Block downloads from servers to unapproved external destinations"},{"left":"T1219.002 \u2014 Remote Desktop Software","right":"Limit outgoing traffic to the sites and services remote-access software uses"}]},"hint":"Each right side names the exact port family or protocol of its technique \u2014 LLMNR for poisoning, 5900 for VNC, SMTP for mail, downloads for tool transfer, remote-access sites for remote desktop.","explain":"<p>These matches come straight from the M1037 page: for <b>T1557.001</b> it says use host-based security software to block LLMNR/NetBIOS/mDNS and enable SMB Signing to stop NTLMv2 relay; for <b>T1071.001</b> restrict outbound HTTP/HTTPS from critical servers to approved destinations; for <b>T1187</b> block SMB 139/445 and WebDAV at the egress; for <b>T1021.005</b> filter VNC ports 5900/5800/5500; for <b>T1071.003</b> let only trusted mail servers speak outbound email protocols; for <b>T1105</b> block downloads from compromised systems to unapproved destinations; for <b>T1219.002</b> configure firewalls, application firewalls and proxies so outgoing traffic only reaches the sites and services remote-access software uses. The pattern: each technique has a characteristic traffic signature, and the rule targets exactly that signature.</p>","study":"the Use column of the M1037 techniques table.","concepts":["M1037","T1557.001","T1071.001","T1187","T1021.005","T1071.003","T1105","T1219.002"]},{"id":"M03","type":"qcm","title":"Upgrade to application layer filtering","summary":"TLS-blind L4 filter \u2192 what M1037 measure helps next","scenario":[{"label":"ARTEFACT 1 \u2014 Firewall report","kind":"log","filter":true,"body":"EGRESS POLICY: allow tcp any -> any eq 443\nLOG SUMMARY (30 days): 412 outbound 443 flows to uncategorised hosts\nINCIDENT NOTE: malware on FIN-WS-14 used HTTPS to reach C2 inside the allowed 443"}],"question":"Given that the port-level filter cannot see inside TLS, which M1037 measure fits the team's next step?","data":{"options":[{"id":"b1","t":"Application layer filtering: route web through a proxy/WAF that can check destinations"},{"id":"b2","t":"Add more allowed ports to the egress rule, for example 8443 and 8080"},{"id":"b3","t":"Move the filter from the perimeter onto every single host only"},{"id":"b4","t":"Disable HTTPS inside the company so everything is visible"}],"correct":["b1"]},"hint":"Two steps: first admit that a port filter cannot read the encrypted content; then pick the M1037 measure that was designed for content-level control.","explain":"<p>Step one: the log shows the problem \u2014 the malware rode an <b>allowed</b> port, so port-level filtering was satisfied. Step two: M1037's <b>application layer filtering</b> measure exists exactly for this: proxies or WAFs inspect and control HTTP/S traffic (destination categories, SNI, and \u2014 where policy allows \u2014 decrypted content). Adding ports makes the hole bigger, host-only filtering loses the network vantage point, and disabling HTTPS is not realistic.</p>","study":"M1037's application layer filtering measure (proxy, WAF) vs plain port filtering.","concepts":["M1037","T1071.001","application layer filtering","TLS limits"]},{"id":"M04","type":"categorize","title":"Preventive filter vs detective use of its logs","summary":"Sort six activities: prevention vs detection support","scenario":[{"label":"ARTEFACT 1 \u2014 Team standup notes","kind":"prose","body":"<p>The SOC lead splits the filtering workstream into two work piles: <b>the filter acting</b> (it stops traffic) and <b>the filter's logs being used</b> (they reveal attempts). She reads six activities from the backlog. The piles got mixed up on the board.</p>"}],"question":"Drag each activity to the right pile: the filter preventing, or its logs feeding detection.","data":{"buckets":[{"id":"c1","name":"Filter prevents (control acts)"},{"id":"c2","name":"Logs feed detection (control is observed)"}],"items":[{"id":"u1","t":"Firewall drops traffic to a known-bad IP","bucket":"c1"},{"id":"u2","t":"SOC reviews DENY logs and finds beacon attempts","bucket":"c2"},{"id":"u3","t":"Proxy blocks a known-bad domain","bucket":"c1"},{"id":"u4","t":"Analyst builds an alert from denied-flow spikes","bucket":"c2"},{"id":"u5","t":"Switch blocks a rogue DHCP server port","bucket":"c1"},{"id":"u6","t":"Dashboard tracks denied-connection trends by host","bucket":"c2"}]},"hint":"Ask for each card: is something being stopped right now, or is a record of stopped attempts being studied?","explain":"<p>M1037 is a <b>preventive</b> control \u2014 drops, blocks and port security act before delivery (left pile). But every blocked attempt also writes a log line, and those DENY logs are a data source for detection: beacon patterns, spikes, and trends all come from studying what the filter stopped (right pile). The switch blocking a rogue DHCP server is prevention too \u2014 ATT&amp;CK's uses for the AiTM sub-techniques T1557.002 and T1557.003 name DHCP Snooping and Dynamic ARP Inspection on switches. Strong programmes do both: prevent, then learn from the rejections.</p>","study":"preventive action vs detection support from DENY logs (Network Traffic Flow data source).","concepts":["M1037","T1557.003","firewall DENY logs","control category"]},{"id":"M05","type":"blank","title":"Draft the egress filtering policy","summary":"Policy drafting \u2014 four keywords to place","scenario":[{"label":"ARTEFACT 1 \u2014 Draft policy v0.3, gaps marked","kind":"prose","body":"<p>The security manager drafts the company's first egress filtering standard for M1037. Four keywords fell out of the draft \u2014 put them back so the policy reads correctly.</p>"}],"question":"Place the four words so the policy paragraph is complete and correct.","data":{"text":"Policy EG-01: The default action for outbound traffic is {{1}}. Only {{2}} business destinations on {{3}} ports may pass. All {{4}} events are logged and reviewed weekly.","bank":[{"id":"g1","t":"deny"},{"id":"g2","t":"approved"},{"id":"g3","t":"required"},{"id":"g4","t":"blocked"}],"answers":{"1":"g1","2":"g2","3":"g3","4":"g4"}},"hint":"Two of the words are near-twins ('deny' and 'blocked') \u2014 only one fits each blank. Default first, then what may pass, then what gets logged.","explain":"<p>A strong egress policy mirrors the M1037 design: <b>deny</b> by default; <b>approved</b> destinations only; on <b>required</b> ports only (the principle of least privilege applied to traffic); and every <b>blocked</b> event logged, because those logs are how the SOC later spots attack attempts. 'Deny' names the default posture, 'blocked' names the recorded events \u2014 swapping them would mangle the meaning.</p>","study":"writing an egress filtering policy: default deny, allowlists, required ports, blocked-event logging.","concepts":["M1037","egress policy","deny-by-default"]},{"id":"M06","type":"order","title":"The life of a firewall rule change","summary":"Change management \u2014 order five steps","scenario":[{"label":"ARTEFACT 1 \u2014 Email from the change manager","kind":"prose","body":"<p><i>'The auditor asked how a firewall rule change flows through our process. Please order the five steps below exactly as our M1037 workstream runs them.'</i></p><p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>\u2022 Deploy to the firewall in the approved window<br>\u2022 Verify the rule works and document it in the rulebase register<br>\u2022 Security reviews the risk of the requested flow<br>\u2022 Requester submits the need: source, destination, port, business reason<br>\u2022 Change board approves and schedules a maintenance window</p>"}],"question":"Order the five steps from first to last.","data":{"items":[{"id":"s1","t":"Deploy to the firewall in the approved window"},{"id":"s2","t":"Verify the rule works and document it in the rulebase register"},{"id":"s3","t":"Security reviews the risk of the requested flow"},{"id":"s4","t":"Requester submits the need: source, destination, port, business reason"},{"id":"s5","t":"Change board approves and schedules a maintenance window"}],"correctOrder":["s4","s3","s5","s1","s2"]},"hint":"Follow one request through time: what must exist before a risk can be reviewed, and what happens after approval?","explain":"<p>The flow is: <b>request</b> (with source, destination, port and reason) \u2192 <b>risk review</b> (security checks the flow) \u2192 <b>approval and scheduling</b> \u2192 <b>deployment</b> \u2192 <b>verification and documentation</b>. Verification comes last on purpose: a rule that was deployed but never tested is how broken egress policies and silent failures appear. The register entry at the end is what an auditor reads as evidence that the M1037 control is operated, not just bought.</p>","study":"firewall change management: request, review, approve, deploy, verify and document.","concepts":["M1037","change management","GRC"]},{"id":"M07","type":"tree","title":"The rule that lets everything out","summary":"Legacy any-any egress rule \u2014 classify, then act","scenario":[{"label":"ARTEFACT 1 \u2014 Rulebase excerpt (egress, first match wins)","kind":"code","body":"10 permit tcp 10[.]20[.]0[.]0/16 any eq 443\n20 permit ip 10[.]20[.]0[.]0/16 any        ! legacy rule from 2019, owner left\n30 deny ip any any log"},{"label":"ARTEFACT 2 \u2014 Firewall log, one line","kind":"log","filter":false,"body":"2026-10-07 03:11:52 ALLOW TCP 10[.]20[.]4[.]31:49881 -> 45[.]33[.]32[.]156:8443  (matched rule 20)"}],"question":"Work the two steps: first classify the finding, then choose the correct response.","data":{"steps":[{"q":"Step 1 \u2014 What does this combination of rulebase and log line actually show?","options":[{"id":"t1","t":"A legacy over-permissive rule is letting odd egress traffic pass"},{"id":"t2","t":"A normal user browsing the web on port 8443"},{"id":"t3","t":"An inbound attack from the internet"},{"id":"t4","t":"A DNS configuration problem"}],"correct":"t1","artefactLabel":"ARTEFACT 1 \u2014 Rulebase excerpt"},{"q":"Step 2 \u2014 What is the correct next step for the filtering team?","options":[{"id":"t5","t":"Via change process, remove the any-any rule and allow only needed destinations"},{"id":"t6","t":"Delete every rule on the firewall and start from an empty rulebase"},{"id":"t7","t":"Ignore it, port 8443 is rarely used anyway"},{"id":"t8","t":"Turn off logging so the firewall runs faster"}],"correct":"t5","artefactLabel":"ARTEFACT 1 \u2014 Rulebase excerpt"}]},"hint":"For step 1, read which rule the log line says was matched. For step 2, remember the change process and least privilege.","explain":"<p><b>Step 1:</b> the log line says the flow <b>matched rule 20</b> \u2014 the 2019 'permit ip any' legacy rule. So an unknown external host on an odd port (8443) was allowed out. That is over-permissive egress, not normal browsing and not an inbound attack (the arrow points outward). <b>Step 2:</b> the fix keeps the M1037 design tight: remove the legacy rule through the <b>change process</b> and allow only needed destinations (deny-by-default). Deleting the whole rulebase would break the business, 'rarely used' is not evidence, and less logging makes everything worse.</p>","study":"finding and removing over-permissive legacy rules; deny-by-default egress.","concepts":["M1037","rule order","least privilege","change management"]},{"id":"M08","type":"qcm","title":"Map M1037 in NIST CSF","summary":"GRC mapping \u2014 two steps to the right subcategory","scenario":[{"label":"ARTEFACT 1 \u2014 GRC worksheet","kind":"prose","body":"<p>A GRC analyst fills the control register. Column A: 'M1037 Filter Network Traffic \u2014 firewalls and proxies enforce which traffic may flow'. Column B: the matching NIST Cybersecurity Framework entry. She must pick it from four candidates.</p>"}],"question":"Which NIST CSF subcategory fits M1037 best, and why?","data":{"options":[{"id":"n1","t":"PR.PT-4 \u2014 communications and control networks are protected"},{"id":"n2","t":"DE.CM-1 \u2014 the network is monitored to detect events"},{"id":"n3","t":"ID.RA-1 \u2014 vulnerabilities are identified and recorded"},{"id":"n4","t":"RC.RP-1 \u2014 the recovery plan is executed after an incident"}],"correct":["n1"]},"hint":"Two steps: decide whether filtering Protects, Detects, Identifies or Recovers \u2014 then take the matching subcategory.","explain":"<p>Filtering <b>protects</b>: it stops unwanted traffic rather than watching or repairing. In NIST CSF the Protect function holds <b>PR.PT-4</b> \u2014 'communications and control networks are protected' \u2014 which is the classic anchor for M1037; <b>PR.AC-5</b> (network integrity through segmentation) is its close neighbour for the segmentation measure. DE.CM-1 is detective (monitoring the filter's logs), ID.RA-1 is about finding vulnerabilities, and RC.RP-1 is recovery. Real-world task: this is exactly the mapping a GRC analyst writes into the control register to evidence M1037.</p>","study":"NIST CSF mappings for M1037: PR.PT-4 and PR.AC-5 (Protect function).","concepts":["M1037","NIST CSF","GRC"]},{"id":"M09","type":"clickline","title":"Spot the rule that breaks least privilege","summary":"Rulebase audit \u2014 one rule violates the design","scenario":[{"label":"ARTEFACT 1 \u2014 Router ACL excerpt (egress, first match wins)","kind":"code","body":"1  permit tcp 10[.]20[.]0[.]0/16 any eq 443     ! users -> approved proxy\n2  permit tcp 10[.]20[.]0[.]0/16 any eq 80      ! users -> approved proxy\n3  permit ip 10[.]20[.]5[.]0/24 10[.]21[.]0[.]0/16    ! 'temporary' lab bridge, 2023\n4  permit tcp host 10[.]30[.]1[.]10 host 10[.]21[.]9[.]20 eq 5432   ! app -> db, scoped\n5  deny tcp any any eq 23 log             ! no Telnet out\n6  deny ip any any log                    ! default deny"}],"question":"Click the one rule that violates the least-privilege egress design.","data":{"lines":["1  permit tcp 10[.]20[.]0[.]0/16 any eq 443     ! users -> approved proxy","2  permit tcp 10[.]20[.]0[.]0/16 any eq 80      ! users -> approved proxy","3  permit ip 10[.]20[.]5[.]0/24 10[.]21[.]0[.]0/16    ! 'temporary' lab bridge, 2023","4  permit tcp host 10[.]30[.]1[.]10 host 10[.]21[.]9[.]20 eq 5432   ! app -> db, scoped","5  deny tcp any any eq 23 log             ! no Telnet out","6  deny ip any any log                    ! default deny"],"correct":[2],"multi":false},"hint":"Compare how much each permit rule allows. One rule has no ports and no service at all \u2014 any protocol, any port.","explain":"<p>Rule 3 permits <b>IP any</b> between a whole lab subnet and a whole internal /16 \u2014 every protocol, every port, no service named. Every other rule is scoped: named ports (443, 80, 5432), named hosts, or explicit denies. M1037's whole point is filtering on predefined conditions; 'permit ip any any' has none. A compromised lab host could reach anything in 10[.]21[.]0[.]0/16 \u2014 including SMB (T1021.002) or database ports \u2014 and this rule also defeats the point of the default deny at line 6. Real-world task: this is exactly what a quarterly rulebase recertification is supposed to catch.</p>","study":"least privilege in firewall rules: scope every rule by source, destination, protocol and port.","concepts":["M1037","least privilege","T1021.002"]},{"id":"M10","type":"multi","title":"Know the limits","summary":"Limitations \u2014 pick the three true ones","scenario":[{"label":"ARTEFACT 1 \u2014 CISO question in the monthly review","kind":"prose","body":"<p>The CISO reads the M1037 page and asks: <i>'Before we fund more filtering, tell me honestly what this control cannot do.'</i> The team lists five claims; three are true limitations.</p>"}],"question":"Select the three statements that are true limitations of M1037.","data":{"options":[{"id":"l1","t":"A port filter cannot read inside encrypted TLS connections"},{"id":"l2","t":"Rule sets grow exceptions over time and drift from the design"},{"id":"l3","t":"IP block lists can be bypassed, for example by domain fronting"},{"id":"l4","t":"It stops every attack on its own without any other control"},{"id":"l5","t":"It keeps working when the server it protects is powered off"}],"correct":["l1","l2","l3"]},"hint":"A limitation is something the control genuinely cannot do. Two claims promise magic \u2014 controls never promise magic.","explain":"<p>All three true limitations come from the ATT&amp;CK text and practice. <b>TLS</b>: an L4 filter sees only the outside of the connection. <b>Rule drift</b>: every 'temporary' exception outlives its owner, so rulesets need recertification. <b>Domain fronting</b>: the M1037 page says so explicitly under T1090 \u2014 'this kind of blocking may be circumvented by other techniques like Domain Fronting'. The other two claims are the opposite of limitations: no single control stops everything, and a powered-off server needs no network control at all.</p>","study":"M1037 limitations: TLS blindness, rule sprawl, domain-fronting circumvention.","concepts":["M1037","T1090","TLS limits","rule sprawl"]},{"id":"M11","type":"match","title":"Map the control in CIS Controls v8","summary":"CIS mapping \u2014 three safeguards","scenario":[{"label":"ARTEFACT 1 \u2014 Audit finding, closing evidence requested","kind":"prose","body":"<p>The auditor writes: <i>'Show me where your firewall filtering practice sits in CIS Controls v8. Match each safeguard number to what it requires.'</i></p>"}],"question":"Match each CIS v8 safeguard to what it requires.","data":{"pairs":[{"left":"CIS v8 4.4","right":"Implement and manage a firewall on servers"},{"left":"CIS v8 4.5","right":"Implement and manage a firewall on end-user devices"},{"left":"CIS v8 13.4","right":"Perform application layer filtering"}]},"hint":"4.x safeguards are about configuration of enterprise assets \u2014 one for servers, one for laptops. 13.x is the network monitoring and defense control.","explain":"<p>CIS Controls v8 spreads the M1037 idea across safeguards: <b>4.4</b> \u2014 implement and manage a firewall on servers; <b>4.5</b> \u2014 the same on end-user devices (the two 'host firewall' halves); and <b>13.4</b> \u2014 perform application layer filtering, which matches M1037's proxy/WAF measure. In the older CIS v7 the same idea lived mostly in Control 9, 'Limitation and Control of Network Ports, Protocols, and Services'. Real-world task: this is the sentence a GRC analyst writes to close the auditor's finding.</p>","study":"CIS Controls v8 4.4, 4.5 and 13.4; CIS v7 Control 9.","concepts":["M1037","CIS Controls","GRC"]},{"id":"M12","type":"qcm","title":"A legitimate flow got blocked","summary":"False positive \u2014 the scoped exception","scenario":[{"label":"ARTEFACT 1 \u2014 Ticket #4471","kind":"prose","body":"<p><b>Ticket #4471 (finance):</b> Since the new egress filter went live, the nightly SFTP upload to the payroll partner fails. The partner's server is <span style='font-family:monospace'>sftp[.]payroll-partner[.]example</span> at 198[.]51[.]100[.]44, TCP 22. Everything else works.</p>"},{"label":"ARTEFACT 2 \u2014 Firewall log","kind":"log","filter":true,"body":"2026-10-06 23:00:04 DENY TCP 10[.]20[.]7[.]12:51022 -> 198[.]51[.]100[.]44:22  (policy EG-01, default deny)"}],"question":"Which response fixes finance's problem without weakening the M1037 design?","data":{"options":[{"id":"e1","t":"Scoped allow rule: that one source to that one partner IP on TCP 22, logged"},{"id":"e2","t":"Allow TCP 22 outbound to the whole internet so partners never break again"},{"id":"e3","t":"Turn off egress filtering for the finance subnet entirely"},{"id":"e4","t":"Ask the partner to move their SFTP service to port 445"}],"correct":["e1"]},"hint":"Two steps: identify the smallest traffic set that fixes the job, then keep the logging that proves the exception is controlled.","explain":"<p>The block is the M1037 control working as designed \u2014 SFTP to an external host was simply never allow-listed. The proportionate fix is a <b>scoped exception</b>: one source host, one destination IP, one port (TCP 22), with logging so the exception stays visible in the exception register. This mirrors the M1037 page's own guidance for file-transfer protocols (T1071.002): filter outbound FTP/SFTP from sensitive systems, allowing transfers only to trusted, known IP addresses. Opening TCP 22 to the internet re-opens the door M1037 closes (credential theft, T1105-style tool movement), exempting a whole subnet removes the control, and port 445 is SMB \u2014 the opposite of a sensible SFTP choice.</p>","study":"handling false positives: scoped, logged exceptions instead of broad rules.","concepts":["M1037","T1071.002","exceptions","change management"]},{"id":"M13","type":"blank","title":"Complete the cloud security group rule","summary":"Config drafting \u2014 three values","scenario":[{"label":"ARTEFACT 1 \u2014 Cloud change ticket CLD-220","kind":"prose","body":"<p>Cloud engineer note: <i>'App subnet 10[.]40[.]2[.]0/24 may reach the corporate proxy 10[.]40[.]9[.]20 for web egress. Everything else from the app subnet must stay shut. Fill the three values in the rule.'</i></p>"}],"question":"Place the three missing values into the security-group rule.","data":{"text":"Rule SG-EG-01: allow {{1}} from 10[.]40[.]2[.]0/24 to 10[.]40[.]9[.]20 on port {{2}} ; final rule: {{3}} all other traffic from the app subnet.","bank":[{"id":"h1","t":"TCP"},{"id":"h2","t":"443"},{"id":"h3","t":"deny"},{"id":"h4","t":"UDP"},{"id":"h5","t":"22"}],"answers":{"1":"h1","2":"h2","3":"h3"}},"hint":"Web egress to a proxy is HTTPS. Two bank words are decoys for the wrong protocol and the wrong port.","explain":"<p>HTTPS is <b>TCP 443</b>, so the allow rule names protocol TCP and port 443, pinned to the proxy IP \u2014 exactly M1037's egress measure, expressed as a cloud security group (ATT&amp;CK mentions cloud IP allowlisting for T1530). The final <b>deny</b> is what makes the allow meaningful: without it, other traffic from the app subnet would ride unfiltered paths. TCP/22 is SSH and UDP is not used by HTTPS \u2014 classic near-miss values.</p>","study":"translating an egress policy into security-group rules: protocol, port, final deny.","concepts":["M1037","cloud security groups","T1530"]},{"id":"M14","type":"order","title":"Rank the response to a denied-beacon pattern","summary":"Prioritisation \u2014 four actions in the right order","scenario":[{"label":"ARTEFACT 1 \u2014 Morning SOC summary","kind":"log","filter":true,"body":"07:58 DENY TCP 10[.]44[.]1[.]55:52001 -> 203[.]0[.]113[.]77:443\n07:59 DENY TCP 10[.]44[.]1[.]55:52015 -> 203[.]0[.]113[.]77:443\n08:00 DENY TCP 10[.]44[.]1[.]55:52044 -> 203[.]0[.]113[.]77:443\n08:01 DENY TCP 10[.]44[.]1[.]55:52077 -> 203[.]0[.]113[.]77:443\n(pattern: one host, one destination, roughly every 60 seconds)"}],"question":"Order the four response actions from first to last.","data":{"items":[{"id":"r1","t":"Validate the host is not running a known business app that talks to that destination"},{"id":"r2","t":"Block the destination IP at the perimeter firewall"},{"id":"r3","t":"Raise an incident ticket with the log evidence attached"},{"id":"r4","t":"After the incident, review similar hosts and add a lasting filtering rule"}],"correctOrder":["r1","r2","r3","r4"]},"hint":"First make sure it is really bad (60-second beacons to one IP usually are), then stop it, then record it, then make the fix permanent.","explain":"<p>A fixed ~60-second cycle from one host to one external IP is a textbook beacon pattern \u2014 but good practice still <b>validates first</b> (one misconfigured business app causes many false alarms). Then <b>contain</b>: the perimeter deny exists precisely for this moment. Then <b>record</b> the incident with evidence. Then <b>harden</b>: check peer hosts for the same pattern and make the rule permanent. Skipping validation risks breaking a business app; skipping the durable fix means the same ticket returns next month.</p>","study":"deny-log triage: validate, contain, record, harden.","concepts":["M1037","firewall DENY logs","incident response"]},{"id":"M15","type":"match","title":"Which log adds which knowledge","summary":"Telemetry \u2014 four sources to their value","scenario":[{"label":"ARTEFACT 1 \u2014 Detection engineering backlog","kind":"prose","body":"<p>The detection engineer plans what the filtering programme can feed the SOC. Four log sources are on the left, four descriptions of what they reveal are jumbled on the right.</p>"}],"question":"Match each log source to what it adds to the filtering programme.","data":{"pairs":[{"left":"Firewall DENY logs","right":"Exactly which flows the filter stopped, and when"},{"left":"Proxy logs","right":"Which web destinations users and hosts actually reached"},{"left":"NetFlow records","right":"Who talked to whom, on which ports, and how much"},{"left":"DNS logs","right":"Which names the hosts resolved before connecting"}]},"hint":"One source sees stopped flows, one sees web destinations, one sees pure traffic patterns, one sees name lookups.","explain":"<p><b>DENY logs</b> are the filter's own output \u2014 the direct M1037 telemetry (blocked flow, timestamp, rule matched). <b>Proxy logs</b> show web destinations even when the filter allowed them \u2014 the application-layer view of the same measure. <b>NetFlow</b> summarises connections (pairs, ports, volumes) without content \u2014 ideal for spotting beacon periodicity. <b>DNS logs</b> show which names preceded connections \u2014 often the earliest hint of a bad destination. Together they let the SOC both prove M1037 works and find what slipped past it.</p>","study":"telemetry that supports filtering: DENY logs, proxy logs, NetFlow, DNS logs.","concepts":["M1037","telemetry","NetFlow","DNS logs"]},{"id":"M16","type":"match","title":"M1037 or its neighbours?","summary":"Related mitigations \u2014 match each to its mechanism","scenario":[{"label":"ARTEFACT 1 \u2014 Architecture review slide","kind":"prose","body":"<p>The architect shows four mitigation IDs that all 'sound like networking' and asks the room to keep them apart. 'Same neighbourhood, different jobs,' she says.</p>"}],"question":"Match each mitigation to its primary mechanism.","data":{"pairs":[{"left":"M1037 \u2014 Filter Network Traffic","right":"Rules at firewalls and proxies decide which flows pass"},{"left":"M1031 \u2014 Network Intrusion Prevention","right":"Signature-based products block or alert on known attack patterns"},{"left":"M1030 \u2014 Network Segmentation","right":"The network is split into zones to limit movement"},{"left":"M1035 \u2014 Limit Access to Resource Over Network","right":"Only named users or systems may reach a network resource"}]},"hint":"One filters flows, one matches attack signatures, one draws zone borders, one guards a single resource's reachability.","explain":"<p><b>M1037</b> enforces per-flow rules (ports, protocols, IPs, domains) at firewalls and proxies. <b>M1031</b> is a different mechanism \u2014 a product matching traffic against attack signatures and acting on them. <b>M1030</b> draws the zone borders; M1037 is one of the tools that then polices traffic <i>between</i> zones (ATT&amp;CK lists segmentation itself as a measure of M1037). <b>M1035</b> decides who may reach a resource at all \u2014 a resource-level access decision, not a traffic rule. Knowing the neighbours keeps your control register honest \u2014 each ID earns its own row.</p>","study":"telling M1037 apart from M1031, M1030 and M1035.","concepts":["M1037","M1031","M1030","M1035"]}];
(function () {
  'use strict';
  var CFG = window.EXAM_CONFIG;
  var EXS = window.EXERCISES;
  var INTRO = window.INTRO_CONTENT;
  var THEMES = window.THEMES;

  /* ---------------- utils ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var r = a.slice(); var i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  /* ---------------- syntax highlighting for logs ---------------- */
  function hlLog(raw) {
    var out = esc(raw);
    out = out.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g, '<span class="tok-ip">$1</span>');
    out = out.replace(/(^\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/gm, '<span class="tok-time">$1</span>');
    out = out.replace(/\b(DENY|REJECT|DROP|BLOCK|DENIED|blocked|flushed)\b/g, '<span class="tok-act a-deny">$1</span>');
    out = out.replace(/\b(ALLOW|PERMIT|ACCEPT|ALLOWED|allowed|established)\b/g, '<span class="tok-act a-allow">$1</span>');
    out = out.replace(/\b(TCP|UDP|ICMP|SMB|SSH|DNS|HTTP|HTTPS|FTP|SMTP|RDP|Telnet|SNMP|LLMNR|NetBIOS|VNC|BITS)\b/g, '<span class="tok-proto">$1</span>');
    out = out.replace(/:(\d{2,5})\b/g, ':<span class="tok-port">$1</span>');
    return out;
  }
  function renderArtefact(a) {
    var wrap = el('div', 'artefact');
    var lab = el('div', 'a-label');
    lab.innerHTML = '<span>' + esc(a.label) + '</span>';
    if (a.filter) {
      var fb = el('span', 'filterbox');
      fb.innerHTML = '<label for="flt_' + fltCount + '" style="font-size:12px">Filter:</label>';
      var inp = document.createElement('input');
      inp.type = 'text'; inp.id = 'flt_' + fltCount; inp.placeholder = 'type to filter lines';
      inp.setAttribute('aria-label', 'Filter log lines');
      fb.appendChild(inp);
      lab.appendChild(fb);
      (function (inputRef) {
        inputRef.addEventListener('input', function () {
          var q = inputRef.value.toLowerCase();
          var lines = wrap.querySelectorAll('pre.log .lline');
          for (var i = 0; i < lines.length; i++) {
            lines[i].style.display = (!q || lines[i].textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
          }
        });
      })(inp);
      fltCount++;
    }
    wrap.appendChild(lab);
    var body = el('div', 'a-body ' + (a.kind === 'log' ? 'logbody' : 'prose'));
    if (a.kind === 'log') {
      var pre = el('pre', 'log');
      var lines = String(a.body).split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        html += '<span class="lline" style="display:block">' + (hlLog(lines[i]) || '&nbsp;') + '</span>';
      }
      pre.innerHTML = html;
      body.appendChild(pre);
    } else if (a.kind === 'code') {
      var pc = el('pre', 'code');
      pc.innerHTML = esc(a.body);
      body.appendChild(pc);
    } else {
      body.innerHTML = '<div>' + a.body + '</div>';
    }
    wrap.appendChild(body);
    return wrap;
  }
  var fltCount = 0;

  /* ---------------- timer state machine ----------------
     States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
     Check      -> PAUSED_AUTO_CHECK (before feedback renders)
     Next       -> RUNNING (or ENDED via Final Submit on last)
     Skip/Hint  -> state unchanged (timer keeps running)
     Pause      -> PAUSED_MANUAL (hides exercise); Resume returns to prior state
  ------------------------------------------------------ */
  var T = { state: 'RUNNING', remaining: CFG.durationSec, accManual: 0, accAuto: 0, last: Date.now(), exDeadline: null };
  function setState(s) { T.state = s; renderHeader(); }
  function tick() {
    var now = Date.now(); var d = (now - T.last) / 1000; T.last = now;
    if (phase === 'intro') { return; } /* the clock only runs once the exam starts */
    if (T.state === 'PAUSED_MANUAL') { T.accManual += d; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { T.accAuto += d; }
    else if (T.state === 'RUNNING') {
      T.remaining -= d;
      if (T.exDeadline !== null) {
        T.exDeadline -= d;
        renderExTimer();
        if (T.exDeadline <= 0) { autoCheckTerminal(); }
      }
      if (T.remaining <= 0) { T.remaining = 0; timerEnded(); }
    }
    renderTimer();
  }
  function renderTimer() {
    var chip = $('timerChip'); if (!chip) return;
    var st, cls;
    if (T.state === 'RUNNING') { st = 'RUNNING'; cls = 'st-running'; }
    else if (T.state === 'PAUSED_MANUAL') { st = 'PAUSED — manual (press Resume)'; cls = 'st-paused-manual'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { st = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'st-paused-auto-check'; }
    else { st = 'ENDED'; cls = 'st-ended'; }
    chip.innerHTML = '<span>' + (T.state === 'PAUSED_MANUAL' || T.state === 'PAUSED_AUTO_CHECK' ? '\u23F8' : '\u23F1') + '</span><span class="tstate ' + cls + '">' + st + '</span><span id="tval">' + fmtTime(T.remaining) + '</span>';
  }
  function renderExTimer() {
    var c = $('exTimerChip'); if (!c) return;
    if (T.exDeadline === null) { c.classList.add('hidden'); return; }
    c.classList.remove('hidden');
    c.innerHTML = '\u23F1 sub-task time left: <b>' + Math.max(0, Math.ceil(T.exDeadline)) + 's</b>';
  }

  /* ---------------- attempt state ---------------- */
  var attempt = 0;
  var order = [];            /* exercise copies in attempt order */
  var idx = 0;
  var credits = {};          /* exId -> credit */
  var skipped = {};          /* exId -> true (skipped, unanswered) */
  var hintUsed = {};
  var current = null;
  var phase = 'intro';
  var fromReview = false;
  var reportedForAttempt = -1;
  var answerWidgets = {};    /* per-type live answer data */

  function makeAttemptCopies() {
    order = EXS.map(function (e) { return JSON.parse(JSON.stringify(e)); });
    for (var i = 0; i < order.length; i++) { preShuffle(order[i]); }
    order = shuffle(order);
  }
  function preShuffle(e) {
    var d = e.data;
    if (d.options) d.options = shuffle(d.options);
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.items && d.correctOrder) d.display = shuffle(d.items);
    if (d.pairs) d.rightOpts = shuffle(d.pairs.map(function (p) { return p.right; }));
    if (d.steps) { for (var j = 0; j < d.steps.length; j++) d.steps[j].options = shuffle(d.steps[j].options); }
    if (d.type === 'terminal') { d.elements = shuffle(d.elements); }
  }

  /* ---------------- scoring core ---------------- */
  /* scoreItems: H = correct items selected, W = wrong items selected, N = total correct items
     credit = max(0, (H - W) / N)   (partial-credit contract) */
  function scoreItems(selectedIds, correctIds) {
    var N = correctIds.length;
    var H = 0, W = 0;
    var sel = selectedIds || [];
    for (var i = 0; i < sel.length; i++) {
      if (correctIds.indexOf(sel[i]) !== -1) H++; else W++;
    }
    return { N: N, H: H, W: W, credit: N === 0 ? 1 : Math.max(0, (H - W) / N) };
  }

  /* ---------------- app shell ---------------- */
  var app;
  function boot() {
    app = $('app');
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d) return;
      if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
        if (d.username) { CFG.learner = d.username; var g = $('greetLine'); if (g) g.textContent = 'Welcome, ' + d.username + '. You can start when ready.'; }
      }
    });
    renderIntro();
    setInterval(tick, 250);
  }

  function renderIntro() {
    phase = 'intro';
    T.state = 'RUNNING'; /* timer idle until exam starts; tick guard: phase check */
    var hdr = $('xheader'); if (hdr) hdr.classList.add('hidden');
    app.innerHTML = '';
    var w = el('div', 'intro');
    var sevChip = '<span class="chip sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + ' tier ' + CFG.batch + ' of 4</span>';
    w.innerHTML = '<h1>' + esc(CFG.examTitle) + '</h1>' +
      '<p class="subtitle">MITRE ATT&amp;CK practice certification &middot; topic ' + esc(CFG.topicId.toUpperCase()) + ' &middot; ' + esc(CFG.objectType) + '</p>' +
      '<div class="meta-chips">' + sevChip +
      '<span class="chip">' + CFG.questionCount + ' exercises</span>' +
      '<span class="chip">' + CFG.estimatedMinutes + ' minutes</span>' +
      '<span class="chip">Pass mark: ' + CFG.passMark + '%</span></div>' +
      '<p id="greetLine" style="font-weight:600">' + (CFG.learner ? 'Welcome, ' + esc(CFG.learner) + '.' : '') + ' You will practise one ATT&amp;CK object from many angles. Read the short lesson below first.</p>';

    var p1 = el('div', 'panel');
    p1.innerHTML = '<h2><span aria-hidden="true">\uD83D\uDCD8</span> About ' + esc(CFG.objectId) + ' — ' + esc(CFG.objectName) + '</h2>' + INTRO.about;
    w.appendChild(p1);

    var p2 = el('div', 'panel');
    p2.innerHTML = '<h2><span aria-hidden="true">\uD83E\uDDD0</span> Keywords covered in this tier</h2>' +
      '<p style="font-size:14px;color:var(--muted)">These are the ATT&amp;CK ideas behind the exercises. The four tiers of this topic share the same object; each tier exercises them at its own depth.</p>' +
      renderThemes();
    w.appendChild(p2);

    var p3 = el('div', 'panel');
    p3.innerHTML = '<h2><span aria-hidden="true">\uD83C\uDFAF</span> How this exam works</h2>' + INTRO.howto;
    w.appendChild(p3);

    var p4 = el('div', 'panel');
    p4.innerHTML = '<h2><span aria-hidden="true">\u2696\uFE0F</span> Rules in plain words</h2>' + INTRO.rules;
    w.appendChild(p4);

    var startBtn = el('button', 'primary', 'Start the exam');
    startBtn.id = 'startBtn';
    startBtn.style.fontSize = '17px';
    startBtn.style.padding = '12px 30px';
    startBtn.addEventListener('click', startExam);
    var sb = el('div', 'panel'); sb.style.textAlign = 'center';
    sb.appendChild(startBtn);
    w.appendChild(sb);
    app.appendChild(w);
  }

  function renderThemes() {
    var h = '';
    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      h += '<div class="theme-block"><div class="theme-name"><span aria-hidden="true">' + t.icon + '</span> ' + esc(t.name) + '</div>';
      for (var j = 0; j < t.keywords.length; j++) { h += '<span class="kw">' + esc(t.keywords[j]) + '</span>'; }
      h += '</div>';
    }
    return h;
  }


  /* ---------------- exam flow ---------------- */
  function startExam() {
    attempt++;
    credits = {}; skipped = {}; hintUsed = {};
    idx = 0; reportedForAttempt = -1; fromReview = false;
    T.remaining = CFG.durationSec; T.accManual = 0; T.accAuto = 0; T.exDeadline = null; T.last = Date.now();
    makeAttemptCopies();
    phase = 'exam';
    var hdr = $('xheader'); if (hdr) hdr.classList.remove('hidden');
    setState('RUNNING');
    renderExercise(order[idx]);
  }

  function renderHeader() {
    var h = $('xheader'); if (!h) return;
    var score = scoreLine();
    var pauseBtn = T.state === 'PAUSED_MANUAL'
      ? '<button class="hbtn" id="pauseBtn" aria-label="Resume exam">\u25B6 Resume</button>'
      : '<button class="hbtn" id="pauseBtn" aria-label="Pause exam">\u23F8 Pause</button>';
    var counterTxt = phase === 'review' ? 'Review skipped'
      : phase === 'results' ? 'Results'
      : 'Exercise ' + Math.min(idx + 1, order.length) + ' of ' + order.length;
    h.innerHTML =
      '<span class="counter">' + counterTxt + '</span>' +
      '<span class="sev-badge sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + '</span>' +
      '<span class="timer-chip" id="timerChip"></span>' +
      '<span class="score-chip" aria-label="Live score">\u2605 <span id="liveScore">' + score + '</span></span>' +
      '<span class="spacer"></span>' +
      (phase === 'exam' && !answeredCurrent() ? '<button class="hbtn" id="hintBtn" aria-label="Show one hint">\uD83D\uDCA1 Hint</button>' : '') +
      (phase === 'exam' ? '<button class="hbtn" id="skipBtn" aria-label="Skip exercise">\u23ED Skip</button>' : '') +
      pauseBtn;
    renderTimer();
    bindHeader();
  }
  function bindHeader() {
    var b;
    b = $('pauseBtn'); if (b) b.addEventListener('click', onPauseToggle);
    b = $('hintBtn'); if (b) b.addEventListener('click', onHint);
    b = $('skipBtn'); if (b) b.addEventListener('click', onSkip);
  }
  function answeredCurrent() { return current && credits[current.id] !== undefined; }
  function scoreLine() {
    var n = 0, s = 0;
    for (var k in credits) { n++; s += credits[k]; }
    if (n === 0) return '0.0 / 0 (—%)';
    return round1(s) + ' / ' + n + ' (' + Math.round(s / n * 100) + '%)';
  }
  function updateScore() { var ls = $('liveScore'); if (ls) ls.textContent = scoreLine(); }

  function onPauseToggle() {
    if (phase !== 'exam' && phase !== 'review') return;
    if (T.state === 'PAUSED_MANUAL') {
      setState(T.prevState || 'RUNNING');
      var veil = $('pauseVeil'); if (veil) veil.remove();
    } else {
      T.prevState = T.state;
      setState('PAUSED_MANUAL');
      showPauseVeil();
    }
  }
  function showPauseVeil() {
    var veil = $('pauseVeil');
    if (!veil) {
      veil = el('div', '');
      veil.id = 'pauseVeil';
      veil.style.cssText = 'position:fixed;inset:0;background:rgba(15,28,51,.93);z-index:100;display:flex;align-items:center;justify-content:center;color:#e8eefb;text-align:center;padding:20px';
      veil.innerHTML = '<div><div style="font-size:40px" aria-hidden="true">\u23F8</div><div style="font-size:20px;font-weight:800;margin-top:8px">PAUSED — manual break</div><p style="max-width:420px;color:#c4d2ec">The exercise is hidden so you cannot read it while the clock is stopped. Press Resume to continue.</p></div>';
      veil.addEventListener('click', onPauseToggle);
      document.body.appendChild(veil);
    }
  }

  function onHint() {
    if (!current || hintUsed[current.id] || answeredCurrent()) return;
    hintUsed[current.id] = true;
    var box = $('hintBox');
    if (box) { box.innerHTML = '<b>Hint:</b> ' + esc(current.hint); box.classList.remove('hidden'); }
    var hb = $('hintBtn'); if (hb) { hb.disabled = true; hb.title = 'Hint already used for this exercise'; }
  }

  function onSkip() {
    if (!current || answeredCurrent()) return;
    skipped[current.id] = true;
    T.exDeadline = null;
    if (fromReview) { fromReview = false; gotoReview(); return; }
    if (idx < order.length - 1) { idx++; setState('RUNNING'); renderExercise(order[idx]); }
    else { gotoReview(); }
  }

  function gotoReview() {
    phase = 'review';
    T.exDeadline = null;
    if (T.state !== 'ENDED') setState('RUNNING');
    renderReview();
  }

  function renderReview() {
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');
    var ids = [];
    for (var k in skipped) { if (credits[k] === undefined) ids.push(k); }
    var h = '<div class="block"><div class="block-head"><span class="bicon">\uD83D\uDDC9</span> REVIEW SKIPPED EXERCISES</div><div class="block-body">';
    if (ids.length === 0) {
      h += '<p>You have answered or re-checked every exercise. Nothing is waiting here.</p>';
    } else {
      h += '<p>These exercises are still unanswered. Skipped-and-unanswered exercises are <b>excluded from your score</b>. You can answer them now, as many times as you like, until the timer ends. Or submit and leave them out.</p>';
    }
    h += '</div></div>';
    w.innerHTML = h;
    var list = el('div', 'reviewlist');
    for (var i = 0; i < ids.length; i++) {
      (function (id) {
        var ex = order.filter(function (o) { return o.id === id; })[0];
        if (!ex) return;
        var row = el('div', 'reviewrow');
        row.innerHTML = '<span class="rt"><b>' + esc(id) + '</b> — ' + esc(ex.summary) + '</span>';
        var btn = el('button', 'primary', 'Answer now');
        btn.addEventListener('click', function () {
          phase = 'exam';
          fromReview = true;
          idx = order.indexOf(ex);
          setState('RUNNING');
          renderExercise(ex);
        });
        row.appendChild(btn);
        list.appendChild(row);
      })(ids[i]);
    }
    w.appendChild(list);
    var act = el('div', 'actionrow');
    var sub = el('button', 'primary', 'Submit exam and see results');
    sub.addEventListener('click', finalSubmit);
    act.appendChild(sub);
    w.appendChild(act);
    app.appendChild(w);
  }

  /* ---------------- exercise rendering ---------------- */
  function renderExercise(ex) {
    current = ex;
    answerWidgets = {};
    fltCount = 0;
    /* reduced per-exercise timer (EXTREMELY HARD terminal only) */
    T.exDeadline = ex.perExerciseTimer ? ex.perExerciseTimer : null;
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');

    /* header block: severity + title */
    w.appendChild(el('div', '', '<h2 style="margin:8px 0 0;color:var(--head)">' + esc(ex.id) + ' — ' + esc(ex.title) + '</h2>'));

    /* SCENARIO block (collapsible when long) */
    var scen = el('div', 'block scenario');
    var shead = el('div', 'block-head');
    shead.innerHTML = '<span class="bicon">\uD83D\uDCCB</span> SCENARIO';
    scen.appendChild(shead);
    var panels = ex.scenario;
    var totalLen = 0;
    for (var sl = 0; sl < panels.length; sl++) { totalLen += String(panels[sl].body || '').length; }
    var collapsed = totalLen > 420;
    var sbody = el('div', 'block-body');
    for (var i = 0; i < panels.length; i++) sbody.appendChild(renderArtefact(panels[i]));
    if (collapsed) {
      var sum = el('button', 'scen-summary');
      sum.type = 'button';
      sum.innerHTML = '<span class="caret" aria-hidden="true">\u25BC</span><span>' + esc(ex.summary) + '</span><span style="margin-left:auto;font-weight:400">(tap to collapse / expand the scenario)</span>';
      sum.setAttribute('aria-expanded', 'true');
      sum.addEventListener('click', function () {
        var open = sbody.style.display !== 'none';
        sbody.style.display = open ? 'none' : '';
        sum.setAttribute('aria-expanded', open ? 'false' : 'true');
        scen.classList.toggle('scen-collapsed', open);
      });
      scen.appendChild(sum);
      scen.appendChild(sbody);
    } else {
      scen.appendChild(sbody);
    }
    w.appendChild(scen);

    /* QUESTION block */
    var q = el('div', 'block question');
    q.innerHTML = '<div class="block-head"><span class="bicon">\u2753</span> QUESTION</div><div class="block-body"><p class="qtext">' + ex.question + '</p></div>';
    w.appendChild(q);

    /* YOUR ANSWER block */
    var a = el('div', 'block answer');
    a.innerHTML = '<div class="block-head"><span class="bicon">\u270D\uFE0F</span> YOUR ANSWER</div>';
    var abody = el('div', 'block-body');
    abody.id = 'answerBody';
    var hintBox = el('div', 'warnbox hidden');
    hintBox.id = 'hintBox';
    abody.appendChild(hintBox);
    if (T.exDeadline !== null) { var etc = el('div', 'warnbox'); etc.id = 'exTimerChip'; abody.appendChild(etc); renderExTimer(); }
    buildWidget(abody, ex);
    var act = el('div', 'actionrow');
    var chk = el('button', 'primary', 'Check');
    chk.id = 'checkBtn';
    chk.addEventListener('click', onCheck);
    act.appendChild(chk);
    var hintNote = el('span', '', '<span style="font-size:12.5px;color:var(--muted)">Check stops the timer so you can read the feedback without pressure. The clock starts again on Next.</span>');
    act.appendChild(hintNote);
    abody.appendChild(act);
    a.appendChild(abody);
    w.appendChild(a);

    /* feedback + next area */
    var fb = el('div', '');
    fb.id = 'feedbackArea';
    w.appendChild(fb);

    app.appendChild(w);
    if (hintUsed[ex.id]) { hintBox.innerHTML = '<b>Hint:</b> ' + esc(ex.hint); hintBox.classList.remove('hidden'); }
  }

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') buildChoice(root, ex);
    else if (ex.type === 'match') buildMatch(root, ex);
    else if (ex.type === 'categorize') buildDnd(root, ex);
    else if (ex.type === 'blank') buildBlank(root, ex);
    else if (ex.type === 'order') buildOrder(root, ex);
    else if (ex.type === 'tree') buildTree(root, ex);
    else if (ex.type === 'clickline') buildClick(root, ex);
    else if (ex.type === 'terminal') buildTerminal(root, ex);
  }

  function buildChoice(root, ex) {
    var d = ex.data;
    var multi = ex.type === 'multi';
    var wrap = el('div', '');
    wrap.setAttribute('role', 'group');
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    answerWidgets.choice = { selected: {}, multi: multi };
    for (var i = 0; i < d.options.length; i++) {
      (function (oi) {
        var lab = el('label', 'opt');
        var input = document.createElement('input');
        input.type = multi ? 'checkbox' : 'radio';
        input.name = 'opt_' + ex.id;
        input.value = oi.id;
        input.addEventListener('change', function () {
          if (multi) {
            if (input.checked) answerWidgets.choice.selected[oi.id] = true;
            else delete answerWidgets.choice.selected[oi.id];
            lab.classList.toggle('selected', input.checked);
          } else {
            answerWidgets.choice.selected = {};
            answerWidgets.choice.selected[oi.id] = true;
            var labs = wrap.querySelectorAll('.opt');
            for (var k = 0; k < labs.length; k++) labs[k].classList.remove('selected');
            lab.classList.add('selected');
          }
        });
        lab.appendChild(input);
        lab.appendChild(el('span', 'olabel', labels[i] + '.'));
        lab.appendChild(el('span', '', '<span>' + esc(oi.t) + '</span>'));
        wrap.appendChild(lab);
      })(d.options[i]);
    }
    root.appendChild(wrap);
  }

  function buildMatch(root, ex) {
    var d = ex.data;
    answerWidgets.match = {};
    for (var i = 0; i < d.pairs.length; i++) {
      (function (p) {
        var row = el('div', 'matchrow');
        row.appendChild(el('div', 'mleft', esc(p.left)));
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Match for: ' + p.left);
        sel.appendChild(new Option('— choose the match —', ''));
        for (var j = 0; j < d.rightOpts.length; j++) sel.appendChild(new Option(d.rightOpts[j], d.rightOpts[j]));
        sel.addEventListener('change', function () { answerWidgets.match[p.left] = sel.value || null; });
        row.appendChild(sel);
        answerWidgets.match[p.left] = null;
        row.dataset.left = p.left;
        root.appendChild(row);
      })(d.pairs[i]);
    }
  }

  function buildDnd(root, ex) {
    var d = ex.data;
    var w = el('div', 'dnd-wrap');
    var bankWrap = el('div', '');
    bankWrap.appendChild(el('div', 'bank-label', 'ITEMS — drag each item, or tap it then tap a bucket'));
    var bank = el('div', 'itembank');
    bank.id = 'bank_' + ex.id;
    bankWrap.appendChild(bank);
    answerWidgets.dnd = { placed: {}, picked: null };
    var items = shuffle(d.items);
    for (var i = 0; i < items.length; i++) { bank.appendChild(makeDItem(items[i])); }
    var buckets = el('div', 'buckets');
    for (var b = 0; b < d.buckets.length; b++) {
      (function (bk) {
        var box = el('div', 'bucket');
        box.dataset.bucket = bk.id;
        box.innerHTML = '<h4><span aria-hidden="true">\uD83D\uDCE5</span> ' + esc(bk.name) + '</h4><div class="b-drop"></div>';
        box.addEventListener('dragover', function (ev) { ev.preventDefault(); box.classList.add('b-over'); });
        box.addEventListener('dragleave', function () { box.classList.remove('b-over'); });
        box.addEventListener('drop', function (ev) {
          ev.preventDefault(); box.classList.remove('b-over');
          var id = ev.dataTransfer.getData('text/plain');
          placeItem(id, bk.id);
        });
        box.addEventListener('click', function () {
          if (answerWidgets.dnd.picked) { placeItem(answerWidgets.dnd.picked, bk.id); }
        });
        buckets.appendChild(box);
      })(d.buckets[b]);
    }
    function makeDItem(it) {
      var di = el('div', 'ditem');
      di.textContent = it.t;
      di.draggable = true; di.dataset.item = it.id; di.id = 'it_' + it.id;
      di.setAttribute('tabindex', '0');
      di.setAttribute('role', 'button');
      di.setAttribute('aria-label', 'Item: ' + it.t + '. Press Enter to pick up, then choose a bucket button below.');
      di.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', it.id); di.classList.add('dragging'); });
      di.addEventListener('dragend', function () { di.classList.remove('dragging'); });
      di.addEventListener('click', function () {
        if (di.classList.contains('locked')) return;
        var was = di.classList.contains('picked');
        var all = document.querySelectorAll('.ditem.picked');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('picked');
        if (!was) { di.classList.add('picked'); answerWidgets.dnd.picked = it.id; }
        else answerWidgets.dnd.picked = null;
      });
      return di;
    }
    function placeItem(id, bucketId) {
      if (!id || answerWidgets.dnd.placed[id] !== undefined) return;
      var di = $('it_' + id); if (!di) return;
      var box = buckets.querySelector('.bucket[data-bucket="' + bucketId + '"] .b-drop');
      if (!box) return;
      di.classList.remove('picked');
      box.appendChild(di);
      answerWidgets.dnd.placed[id] = bucketId;
      answerWidgets.dnd.picked = null;
    }
    w.appendChild(bankWrap);
    w.appendChild(buckets);
    root.appendChild(w);
  }

  function buildBlank(root, ex) {
    var d = ex.data;
    answerWidgets.blank = {};
    var slotsWrap = el('div', 'slots');
    var html = '';
    var text = d.text;
    var parts = text.split(/\{\{(\d+)\}\}/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var n = parts[i];
        html += '<span class="slot" data-slot="' + n + '" tabindex="0" role="button" aria-label="Blank ' + n + ', tap to clear"><span class="sv">&nbsp;</span></span>';
      } else {
        html += esc(parts[i]);
      }
    }
    slotsWrap.innerHTML = html;
    root.appendChild(slotsWrap);
    var slots = slotsWrap.querySelectorAll('.slot');
    var focusSlot = null;
    for (var s = 0; s < slots.length; s++) {
      (function (sl) {
        sl.addEventListener('click', function () {
          if (sl.dataset.token) { /* filled: return token */
            delete answerWidgets.blank[sl.dataset.slot];
            var tk = $('tk_' + sl.dataset.token);
            if (tk) { tk.classList.remove('used'); }
            sl.dataset.token = ''; sl.querySelector('.sv').innerHTML = '&nbsp;'; sl.classList.remove('filled');
          }
          focusSlot = sl.dataset.slot;
        });
      })(slots[s]);
    }
    var lbl = el('div', 'bank-label', 'WORD BANK — tap a word to put it in the last-chosen empty blank (or the next free one)');
    root.appendChild(lbl);
    var bank = el('div', 'bank');
    for (var b = 0; b < d.bank.length; b++) {
      (function (tk) {
        var bt = el('button', 'btoken');
        bt.type = 'button'; bt.id = 'tk_' + tk.id; bt.textContent = tk.t;
        bt.addEventListener('click', function () {
          if (bt.classList.contains('used')) return;
          var target = null;
          if (focusSlot && !answerWidgets.blank[focusSlot]) target = focusSlot;
          if (!target) {
            for (var k = 0; k < slots.length; k++) {
              if (!answerWidgets.blank[slots[k].dataset.slot]) { target = slots[k].dataset.slot; break; }
            }
          }
          if (!target) return;
          answerWidgets.blank[target] = tk.id;
          var slp = slotsWrap.querySelector('.slot[data-slot="' + target + '"]');
          slp.dataset.token = tk.id;
          slp.querySelector('.sv').textContent = tk.t;
          slp.classList.add('filled');
          bt.classList.add('used');
        });
        bank.appendChild(bt);
      })(d.bank[b]);
    }
    root.appendChild(bank);
  }

  function buildOrder(root, ex) {
    var d = ex.data;
    answerWidgets.order = { seq: d.display.map(function (it) { return it.id; }) };
    var list = el('div', 'orderlist');
    list.id = 'orderList';
    function redraw() {
      list.innerHTML = '';
      var seq = answerWidgets.order.seq;
      for (var i = 0; i < seq.length; i++) {
        (function (pos, id) {
          var it = d.display.filter(function (x) { return x.id === id; })[0];
          var row = el('div', 'oline');
          row.draggable = true; row.dataset.pos = pos;
          row.innerHTML = '<span class="onum">' + (pos + 1) + '</span><span class="otext">' + esc(it.t) + '</span>';
          var btns = el('span', 'obtns');
          var up = el('button', '', '\u2191'); up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          var dn = el('button', '', '\u2193'); dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          up.addEventListener('click', function () { swap(pos, -1); });
          dn.addEventListener('click', function () { swap(pos, 1); });
          btns.appendChild(up); btns.appendChild(dn);
          row.appendChild(btns);
          row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(pos)); row.classList.add('dragging'); });
          row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
          row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
          row.addEventListener('drop', function (ev) {
            ev.preventDefault();
            var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
            var to = parseInt(row.dataset.pos, 10);
            if (isNaN(from) || isNaN(to) || from === to) return;
            var s = answerWidgets.order.seq;
            var mv = s.splice(from, 1)[0];
            s.splice(to, 0, mv);
            redraw();
          });
          list.appendChild(row);
        })(i, seq[i]);
      }
    }
    function swap(pos, dir) {
      var s = answerWidgets.order.seq;
      var to = pos + dir;
      if (to < 0 || to >= s.length) return;
      var t = s[pos]; s[pos] = s[to]; s[to] = t;
      redraw();
    }
    redraw();
    root.appendChild(list);
    root.appendChild(el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Use the arrows or drag the rows. First row = rank 1.</span>'));
  }

  function buildTree(root, ex) {
    var d = ex.data;
    answerWidgets.tree = { step: 0, picks: {} };
    var holder = el('div', '');
    holder.id = 'treeHolder';
    root.appendChild(holder);
    var nextBtn = el('button', 'primary', 'Confirm and go to the next step');
    nextBtn.id = 'treeNextBtn';
    nextBtn.disabled = true;
    nextBtn.addEventListener('click', function () {
      var st = d.steps[answerWidgets.tree.step];
      var pick = answerWidgets.tree.picks[answerWidgets.tree.step];
      if (!pick) return;
      answerWidgets.tree.step++;
      nextBtn.disabled = true;
      drawStep();
    });
    root.appendChild(nextBtn);
    function drawStep() {
      holder.innerHTML = '';
      var si = answerWidgets.tree.step;
      if (si >= d.steps.length) {
        nextBtn.disabled = true; nextBtn.classList.add('hidden');
        var done = el('div', 'tree-recorded', '\u2705 All steps answered. Press Check to see how you did.');
        holder.appendChild(done);
        return;
      }
      var st = d.steps[si];
      var box = el('div', 'tree-step');
      box.innerHTML = '<span class="step-tag">STEP ' + (si + 1) + ' OF ' + d.steps.length + '</span>';
      if (st.artefactLabel) box.innerHTML += '<p style="font-size:13px;color:var(--muted);margin:4px 0">Re-read artefact: <b>' + esc(st.artefactLabel) + '</b> above if you need it.</p>';
      box.innerHTML += '<p class="step-q">' + st.q + '</p>';
      var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
      for (var i = 0; i < st.options.length; i++) {
        (function (oi, k) {
          var lab = el('label', 'opt');
          lab.innerHTML = '<input type="radio" name="tree_' + si + '" value="' + oi.id + '"><span class="olabel">' + labels[k] + '.</span><span>' + esc(oi.t) + '</span>';
          var input = lab.querySelector('input');
          input.addEventListener('change', function () {
            answerWidgets.tree.picks[si] = oi.id;
            nextBtn.disabled = false;
          });
          box.appendChild(lab);
        })(st.options[i], i);
      }
      holder.appendChild(box);
    }
    drawStep();
  }

  function buildClick(root, ex) {
    var d = ex.data;
    answerWidgets.click = {};
    var wrap = el('div', 'clicklines');
    for (var i = 0; i < d.lines.length; i++) {
      (function (li, k) {
        var row = el('div', 'cline');
        row.setAttribute('tabindex', '0');
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', 'Log line ' + (k + 1) + '. Press Enter to select.');
        row.innerHTML = '<span class="cnum">' + (k + 1) + '</span><span>' + hlLog(li) + '</span>';
        row.addEventListener('click', function () {
          if (row.classList.contains('locked')) return;
          if (!ex.data.multi) {
            var all = wrap.querySelectorAll('.cline.selected');
            for (var z = 0; z < all.length; z++) all[z].classList.remove('selected');
            answerWidgets.click = {};
          }
          row.classList.toggle('selected');
          if (row.classList.contains('selected')) answerWidgets.click[k] = true;
          else delete answerWidgets.click[k];
        });
        row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
        wrap.appendChild(row);
      })(d.lines[i], i);
    }
    root.appendChild(wrap);
  }

  function buildTerminal(root, ex) {
    var d = ex.data;
    answerWidgets.term = { value: '' };
    var term = el('div', 'term');
    var scroll = el('div', 'term-scroll');
    scroll.id = 'termScroll';
    var start = '<div class="term-line">Last login: ' + new Date().toUTCString() + ' from 10[.]20[.]1[.]9</div>';
    if (d.banner) start += '<div class="term-line">' + esc(d.banner) + '</div>';
    scroll.innerHTML = start;
    term.appendChild(scroll);
    var inputRow = el('div', 'term-input');
    inputRow.innerHTML = '<span class="tprompt">' + esc(d.prompt) + '</span>';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.setAttribute('aria-label', 'Command line input');
    inp.addEventListener('input', function () { answerWidgets.term.value = inp.value; });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { runLine(); }
    });
    function runLine() {
      var v = inp.value;
      scroll.innerHTML += '<div class="term-line"><span style="color:#8ff0a9">' + esc(d.prompt) + '</span> ' + esc(v) + '</div>';
      var tv = v.trim();
      if (tv) {
        var first = tv.split(/\s+/)[0].toLowerCase();
        if (d.simTool && first === d.simTool) {
          var out = d.simOut || [];
          for (var oi = 0; oi < out.length; oi++) {
            scroll.innerHTML += '<div class="term-line" style="color:#9fb3d1">' + esc(out[oi]) + '</div>';
          }
        } else {
          scroll.innerHTML += '<div class="term-line" style="color:#ff8f8f">sh: ' + esc(first) + ': command not found (simulation)</div>';
        }
      }
      answerWidgets.term.value = v;
      inp.value = '';
      scroll.scrollTop = scroll.scrollHeight;
    }
    inputRow.appendChild(inp);
    term.appendChild(inputRow);
    root.appendChild(term);
    var note = el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Simulation only — nothing real is executed. Press Enter to echo the line, then Check to grade it. Typos in spacing or case are forgiven; wrong flags are not (this is the ' + esc(CFG.severityLabel) + ' tier).</span>');
    root.appendChild(note);
  }

  window.__enginePart = 2;


  /* ---------------- grading ---------------- */
  function collectAnswer(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') return Object.keys(answerWidgets.choice.selected);
    if (ex.type === 'match') {
      var m = answerWidgets.match, out = [];
      for (var k in m) { if (m[k]) out.push(k + '=>' + m[k]); }
      return out;
    }
    if (ex.type === 'categorize') {
      var p = answerWidgets.dnd.placed, arr = [];
      for (var k2 in p) arr.push(k2 + '=>' + p[k2]);
      return arr;
    }
    if (ex.type === 'blank') {
      var b = answerWidgets.blank, arr2 = [];
      for (var k3 in b) arr2.push(k3 + '=>' + b[k3]);
      return arr2;
    }
    if (ex.type === 'order') {
      return answerWidgets.order.seq.map(function (id, i) { return i + '=>' + id; });
    }
    if (ex.type === 'tree') {
      var picks = answerWidgets.tree.picks, arr3 = [];
      for (var k4 in picks) arr3.push(k4 + '=>' + picks[k4]);
      return arr3;
    }
    if (ex.type === 'clickline') return Object.keys(answerWidgets.click);
    if (ex.type === 'terminal') return [answerWidgets.term.value || ''];
    return [];
  }

  function gradeExercise(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') {
      var correct = d.options.filter(function (o) { return d.correct.indexOf(o.id) !== -1; }).map(function (o) { return o.id; });
      var r = scoreItems(collectAnswer(ex), correct);
      return { r: r, items: optionItems(ex, d, r) };
    }
    if (ex.type === 'match') {
      var sel = collectAnswer(ex);
      var correctPairs = d.pairs.map(function (p) { return p.left + '=>' + p.right; });
      var r2 = scoreItems(sel, correctPairs);
      var items2 = [];
      var given = {};
      for (var i = 0; i < sel.length; i++) { var kv = sel[i].split('=>'); given[kv[0]] = kv[1]; }
      for (var j = 0; j < d.pairs.length; j++) {
        var p = d.pairs[j];
        if (given[p.left] === undefined) items2.push({ st: 'miss', label: p.left + ' → ' + p.right });
        else if (given[p.left] === p.right) items2.push({ st: 'ok', label: p.left + ' → ' + p.right });
        else items2.push({ st: 'no', label: p.left + ' (you chose: ' + given[p.left] + '; right: ' + p.right + ')' });
      }
      return { r: r2, items: items2 };
    }
    if (ex.type === 'categorize') {
      var placed = answerWidgets.dnd.placed;
      var N = d.items.length, H = 0, W = 0;
      var items3 = [];
      var bucketName = {};
      for (var b = 0; b < d.buckets.length; b++) bucketName[d.buckets[b].id] = d.buckets[b].name;
      for (var k = 0; k < d.items.length; k++) {
        var it = d.items[k];
        if (placed[it.id] === undefined) { items3.push({ st: 'miss', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else if (placed[it.id] === it.bucket) { H++; items3.push({ st: 'ok', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else { W++; items3.push({ st: 'no', label: it.t + ' (you put it in ' + bucketName[placed[it.id]] + '; it belongs in ' + bucketName[it.bucket] + ')' }); }
      }
      return { r: { N: N, H: H, W: W, credit: Math.max(0, (H - W) / N) }, items: items3 };
    }
    if (ex.type === 'blank') {
      var filled = answerWidgets.blank;
      var N4 = Object.keys(d.answers).length, H4 = 0, W4 = 0;
      var items4 = [];
      var bankTxt = {};
      for (var z = 0; z < d.bank.length; z++) bankTxt[d.bank[z].id] = d.bank[z].t;
      for (var sn in d.answers) {
        var want = d.answers[sn];
        var got = filled[sn];
        if (got === undefined) items4.push({ st: 'miss', label: 'Blank ' + sn + ': ' + bankTxt[want] });
