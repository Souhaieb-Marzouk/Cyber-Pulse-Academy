<script>
window.EXAM_CONFIG = {"topicId":"m1037","batch":1,"difficulty":"easy","severityLabel":"EASY","objectId":"M1037","objectName":"Filter Network Traffic","objectType":"Mitigation (ATT&CK Enterprise)","examTitle":"M1037 Filter Network Traffic \u2014 EASY practice exam","durationSec":1500,"estimatedMinutes":25,"passMark":70,"questionCount":15,"learner":""};
window.INTRO_CONTENT = {"about":"\n<p><b>M1037 is called Filter Network Traffic.</b> In MITRE ATT&amp;CK it is a <b>Mitigation</b>.\nA mitigation is the opposite of an attack: it is a defence that stops or slows known attack techniques.\nATT&amp;CK lists attacks as techniques with IDs like T1090. It lists defences as mitigations with IDs like M1037.</p>\n\n<p><b>What does it mean in practice?</b> M1037 says: use network appliances (firewalls, proxies) and endpoint\nsoftware to <b>filter</b> traffic in three directions. <b>Ingress</b> filtering checks traffic coming <i>into</i> your\nnetwork. <b>Egress</b> filtering checks traffic <i>leaving</i> your network. <b>Lateral</b> filtering checks traffic\nmoving <i>inside</i> your network, between systems. The filter compares each connection against rules. A rule can\nlook at the port (for example TCP 445), the protocol (for example SMB), the IP address, or the domain name.</p>\n\n<p><b>Imagine a big office building.</b> The network is the building. The firewall is the guard at the door.\nThe guard works from a rule list: which doors may open, which visitors may pass, and which rooms they may enter.\nThe guard also stops people from carrying boxes out of the building (data theft is called exfiltration) and stops\nan outsider from whispering secret instructions to someone inside (that secret channel is called C2, short for\ncommand and control). MITRE also lists M1037 for the two big floods, T1498 and T1499. A flood attack (also called\nDoS, short for Denial of Service) sends so much traffic that a service stops working. Here the filter drops the\nflood traffic upstream, before it can drown the service.</p>\n\n<h3>Where you will meet M1037 in real work</h3>\n<ul>\n<li><b>SOC analyst (monitoring team):</b> you read firewall and proxy logs every shift. Lines with\n<span style=\"font-family:monospace\">DENY</span> show what the filter stopped. Many denies from one host can be a real attack.</li>\n<li><b>Firewall / network administrator:</b> you write the rules, test them, and deploy them through a change process.\nYou also remove old rules that are too permissive.</li>\n<li><b>Incident responder (IR):</b> when a host is compromised, you quickly add a deny rule to cut the attacker's\nchannel. This is containment with M1037.</li>\n<li><b>Detection engineer:</b> you build alerts from denied-flow logs, for example when one host makes many\ndenied connections in a short time.</li>\n<li><b>Threat intel analyst (CTI):</b> you map attacker behaviour, for example <span style=\"font-family:monospace\">T1090 Proxy</span>\nor <span style=\"font-family:monospace\">T1572 Protocol Tunneling</span>, to the controls that stop it, and M1037 is one of the main ones.</li>\n<li><b>GRC analyst:</b> you prove the control exists. You map M1037 to frameworks: NIST CSF (PR.PT-4, PR.AC-5),\nCIS Controls (Control 9, and 4.4/4.5/13.4 in v8), and ISO 27001 (A.8.20 to A.8.22).</li>\n<li><b>Cloud engineer:</b> you use security groups and IP allowlists. ATT&amp;CK lists this same idea for cloud\ndata theft (T1530, T1537) and for the cloud metadata API (T1552.005).</li>\n</ul>\n\n<h3>The five measures of M1037</h3>\n<ul>\n<li><b>Ingress traffic filtering:</b> only trusted sources may reach public servers. Limit SSH (22) and RDP (3389) to known IP ranges.</li>\n<li><b>Egress traffic filtering:</b> block outbound traffic to bad destinations so C2 and stolen data cannot leave.</li>\n<li><b>Protocol-based filtering:</b> allow only needed protocols; block abused ones like Telnet or old SMBv1 (EternalBlue).</li>\n<li><b>Network segmentation:</b> split the network into zones and filter the traffic between zones.</li>\n<li><b>Application layer filtering:</b> use proxies or a WAF to inspect web traffic and block attacks like SQL injection.</li>\n</ul>\n\n<p><b>Tools you will see:</b> perimeter firewalls and NGFW, host firewalls (Windows Defender Firewall, iptables on\nLinux), web proxies, WAFs, router ACLs, switch features (DHCP snooping, Dynamic ARP Inspection, port security),\nand cloud security groups.</p>\n","howto":"<p><b>This is the EASY tier (tier 1 of 4).</b> Each exercise tests exactly one idea. Scenarios are short. The text guides you: it tells you what to look at. Wrong answers are clearly weaker once you know the concept. If you read the lesson above, you can recover with a hint.</p><p><b>Exercise types in this tier:</b> single-choice, multi-select, matching, drag-and-drop sorting, fill-in-the-blank, timeline ordering and log-line clicking exercises.</p><p><b>Timer:</b> 25 minutes in total. The clock runs only while you work, never while you read feedback.</p>","rules":"\n<ul>\n<li><b>Passing score: 70%.</b> Your score is the sum of exercise credits, divided by the number of exercises you answered.</li>\n<li><b>15 exercises</b> of single-choice, multi-select, matching, drag-and-drop sorting, fill-in-the-blank, timeline ordering and log-line clicking exercises.</li>\n<li><b>Timer: 25 minutes</b> for this tier. The clock runs only while you work.</li>\n<li><b>Partial credit:</b> many exercises have more than one right item. Each right item adds credit; each wrong\nitem subtracts. The formula is <span style=\"font-family:monospace\">max(0, (H \u2212 W) / N)</span>. H is the items you got right,\nW the wrong ones you chose, N the total right items. Selecting everything is worth zero, not full marks.</li>\n<li><b>Hint:</b> one hint per exercise. It costs 10% of that exercise's credit. A partial answer after a hint still earns partial credit.</li>\n<li><b>Check auto-pause:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you\nwant. Nothing is lost. The timer starts again only when you press <b>Next</b> (or Final Submit on the last exercise).</li>\n<li><b>Manual pause:</b> the Pause button stops the clock and hides the exercise. Resume brings it back.</li>\n<li><b>Skip:</b> every exercise has Skip. Skipped exercises wait in a review pool. Before the end you can open them\nagain and answer, as often as you like, while the timer runs. If you submit with skipped exercises left, they are\nsimply excluded from the score \u2014 no penalty, no points.</li>\n<li><b>Retake:</b> if you fail, the Retake button resets everything and shuffles questions and answers again.</li>\n</ul>\n"};
window.THEMES = [{"icon":"\ud83d\udee1","name":"Mitigation identity & scope","keywords":["M1037","Filter Network Traffic","Mitigation object (Enterprise)","ingress filtering","egress filtering","lateral traffic filtering","protocol-based filtering","firewall rules","predefined conditions (ports, protocols, IPs, domains)"]},{"icon":"\ud83c\udfaf","name":"Techniques addressed by M1037","keywords":["T1557 Adversary-in-the-Middle (+.001/.002/.003)","T1071 Application Layer Protocol (+.001-.005)","T1090 Proxy (+.003 Multi-hop)","T1095 Non-Application Layer Protocol","T1572 Protocol Tunneling","T1048 Exfiltration Over Alternative Protocol (+.001-.003)","T1190 Exploit Public-Facing Application","T1105 Ingress Tool Transfer","T1570 Lateral Tool Transfer","T1219 Remote Access Tools (+.002)","T1021.002 SMB/Admin Shares","T1021.005 VNC","T1218 System Binary Proxy Execution (+.012)","T1205 Traffic Signaling (+.001 Port Knocking)","T1187 Forced Authentication","T1197 BITS Jobs","T1530 Data from Cloud Storage","T1537 Transfer Data to Cloud Account","T1602 Data from Configuration Repository (+.001/.002)","T1498/T1499 Network & Endpoint DoS","T1599 Network Boundary Bridging (+.001)","T1552.005 Cloud Instance Metadata API"]},{"icon":"\ud83d\udd0c","name":"Enforcement points & tools","keywords":["perimeter firewall / NGFW","host firewall (Windows Defender Firewall, iptables)","web proxy","WAF (web application firewall)","router ACLs","switch controls (DHCP snooping, Dynamic ARP Inspection, port security)","cloud security groups & IP allowlisting","CDN / upstream DoS scrubbing","stateful firewall"]},{"icon":"\u2699","name":"Control design & trade-offs","keywords":["preventive control","deny-by-default","allowlist vs blocklist","rule order (first match wins)","rule sprawl & exceptions","encrypted-traffic limits (L4 cannot read inside TLS)","domain fronting circumvention","false positives vs business apps","change management","rollback"]},{"icon":"\ud83d\udcd0","name":"Framework & policy mappings","keywords":["NIST CSF PR.PT-4","NIST CSF PR.AC-5","CIS Control 9 (ports, protocols, services)","CIS v8 4.4 / 4.5 (firewalls on servers / devices)","CIS v8 13.4 (application layer filtering)","ISO 27001 A.8.20-A.8.22","egress filtering policy","exception register"]},{"icon":"\ud83d\udce1","name":"Detection support & telemetry","keywords":["firewall DENY logs","proxy logs","NetFlow","blocked-flow analysis","Network Traffic Flow data source","alerting on denied spikes","tuning with asset data"]}];
window.EXERCISES = [{"id":"E01","type":"qcm","title":"Name that mitigation","summary":"ATT&CK excerpt \u2014 one mitigation ID to name","scenario":[{"label":"ARTEFACT 1 \u2014 ATT&CK excerpt","kind":"prose","body":"<p>An excerpt from the MITRE ATT&amp;CK website, Enterprise list of mitigations:</p><p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>Employ network appliances and endpoint software to filter ingress, egress, and lateral network traffic. This includes protocol-based filtering, enforcing firewall rules, and blocking or restricting traffic based on predefined conditions to limit adversary movement and data exfiltration.</p>"}],"question":"Which mitigation does this ATT&CK text describe?","data":{"options":[{"id":"a1","t":"M1030 \u2014 Network Segmentation"},{"id":"a2","t":"M1037 \u2014 Filter Network Traffic"},{"id":"a3","t":"M1031 \u2014 Network Intrusion Prevention"},{"id":"a4","t":"M1042 \u2014 Disable or Remove Feature or Program"}],"correct":["a2"]},"hint":"The text is about filtering traffic with firewall rules. Look for the mitigation whose name says exactly that.","explain":"<p>The text says <b>filter</b> ingress, egress and lateral traffic with <b>firewall rules</b>. That is the definition of <b>M1037 \u2014 Filter Network Traffic</b>. M1030 Network Segmentation is about splitting the network into zones. M1031 Network Intrusion Prevention is a product that matches attack signatures. M1042 is about turning off unneeded features. All four are real mitigations, but only one matches this text.</p>","study":"the names of common ATT&CK network mitigations (M1030, M1031, M1037).","concepts":["M1037","M1030","M1031","M1042"]},{"id":"E02","type":"multi","title":"What a filter rule can look at","summary":"Filter rule criteria \u2014 pick every real criterion","scenario":[{"label":"ARTEFACT 1 \u2014 Ticket #1088 (helpdesk)","kind":"prose","body":"<p>A new firewall was installed. The IT manager asks: <i>'What can the filter rules actually check on a connection?'</i></p>"}],"question":"Select every item that a traffic filter rule can use to decide (three are correct).","data":{"options":[{"id":"b1","t":"Port numbers, for example TCP 445"},{"id":"b2","t":"Protocols, for example SMB or Telnet"},{"id":"b3","t":"IP addresses, for example 203[.]0[.]113[.]5"},{"id":"b4","t":"The size of the computer's hard disk"},{"id":"b5","t":"The keyboard layout of the user"}],"correct":["b1","b2","b3"]},"hint":"ATT&CK says filtering uses predefined conditions such as ports, protocols, IP addresses and domains.","explain":"<p>ATT&amp;CK describes M1037 as blocking traffic 'based on predefined conditions'. Those conditions are network facts: <b>ports</b>, <b>protocols</b>, <b>IP addresses</b> and <b>domains</b>. The filter sees network traffic, so it checks network facts. The hard disk size and the keyboard layout are properties of the computer, not of the traffic, so a network filter never looks at them.</p>","study":"the predefined conditions a traffic filter checks (ports, protocols, IPs, domains).","concepts":["M1037","filter criteria"]},{"id":"E03","type":"blank","title":"Which kind of control is this?","summary":"Control category \u2014 one word to complete","scenario":[{"label":"ARTEFACT 1 \u2014 GRC note","kind":"prose","body":"<p>A GRC analyst is filling a control form. She writes: <i>'A firewall filter stops bad traffic before it ever reaches the server. The bad connection never happens.'</i></p>"}],"question":"Complete the sentence with the missing word: a filter that stops the attack before it happens is a ___ control.","data":{"text":"Filtering stops the bad connection before it happens. That makes M1037 a {{1}} control, not one that only watches or repairs.","bank":[{"id":"w1","t":"preventive"},{"id":"w2","t":"detective"},{"id":"w3","t":"corrective"},{"id":"w4","t":"administrative"}],"answers":{"1":"w1"}},"hint":"The attack is stopped before it happens. Words that mean 'before' point to the right category.","explain":"<p>Controls come in families. <b>Preventive</b> controls stop the action. <b>Detective</b> controls only see and report the action. <b>Corrective</b> controls fix things afterwards. A firewall drop happens before the traffic arrives, so M1037 is preventive. It also helps detection later (its DENY logs feed alerts), but its main job on the ATT&amp;CK page is stopping the traffic.</p>","study":"control families: preventive, detective, corrective.","concepts":["M1037","control category"]},{"id":"E04","type":"categorize","title":"Where does the filter live?","summary":"Host vs network filtering \u2014 sort six tools","scenario":[{"label":"ARTEFACT 1 \u2014 Memo from the network team","kind":"prose","body":"<p>ATT&amp;CK says M1037 uses 'network appliances and endpoint software'. A junior asks: <i>'Which of our tools sits on the host itself, and which sits on the network between hosts?'</i></p>"}],"question":"Drag every tool to the right place: on the host, or on the network.","data":{"buckets":[{"id":"k1","name":"On the host itself"},{"id":"k2","name":"On the network between hosts"}],"items":[{"id":"i1","t":"Windows Defender Firewall on a laptop","bucket":"k1"},{"id":"i2","t":"iptables on a Linux web server","bucket":"k1"},{"id":"i3","t":"Endpoint security software on a PC","bucket":"k1"},{"id":"i4","t":"Perimeter NGFW at the internet border","bucket":"k2"},{"id":"i5","t":"Web proxy at the egress point","bucket":"k2"},{"id":"i6","t":"Switch port security on an access switch","bucket":"k2"}]},"hint":"Ask yourself: does the tool run inside the computer's own system, or between computers?","explain":"<p>ATT&amp;CK names two homes for this mitigation: <b>endpoint software</b> and <b>network appliances</b>. Windows Defender Firewall, iptables and endpoint agents run inside one machine, so they are host tools. A perimeter NGFW, a web proxy and switch port security sit on the path between machines, so they are network tools. Both places can filter traffic; good programmes use both.</p>","study":"the enforcement points of M1037: host software vs network appliances.","concepts":["M1037","enforcement points"]},{"id":"E05","type":"qcm","title":"Which technique does M1037 help stop?","summary":"One ATT&CK technique matched to its mitigation","scenario":[{"label":"ARTEFACT 1 \u2014 Threat intel card","kind":"prose","body":"<p>The CTI team writes: <i>'The attacker sends victims' web traffic through a machine they own, to hide and steal data. ATT&amp;CK calls this behaviour T1090 Proxy. It is listed under mitigation M1037.'</i></p>"}],"question":"Which technique is named on the M1037 ATT&CK page as addressed by traffic filtering?","data":{"options":[{"id":"c1","t":"T1090 \u2014 Proxy"},{"id":"c2","t":"T1003 \u2014 OS Credential Dumping"},{"id":"c3","t":"T1114 \u2014 Email Collection"},{"id":"c4","t":"T1555 \u2014 Credentials from Password Stores"}],"correct":["c1"]},"hint":"The intel card already names it. Which option is that technique?","explain":"<p><b>T1090 Proxy</b> is on the M1037 page: block lists can stop traffic to known proxy and C2 machines. The other three techniques happen <i>inside</i> the computer (reading passwords, reading mailboxes). A network filter cannot see those actions, so ATT&amp;CK does not list them under M1037.</p>","study":"which techniques the M1037 page lists (proxy, tunneling, exfiltration over alternative protocol...).","concepts":["M1037","T1090"]},{"id":"E06","type":"blank","title":"In or out?","summary":"Ingress vs egress \u2014 one word","scenario":[{"label":"ARTEFACT 1 \u2014 Classroom note","kind":"prose","body":"<p>The trainer writes two lines on the whiteboard and rubs one word out:</p><p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>Egress filtering controls traffic that LEAVES the network.<br>Ingress filtering controls traffic that ______ the network.</p>"}],"question":"Put the missing word back into the trainer's note.","data":{"text":"Egress filtering controls traffic that leaves the network. Ingress filtering controls traffic that {{1}} the network.","bank":[{"id":"v1","t":"enters"},{"id":"v2","t":"leaves"},{"id":"v3","t":"encrypts"},{"id":"v4","t":"copies"}],"answers":{"1":"v1"}},"hint":"Egress = going out. The other direction has its own word.","explain":"<p><b>Egress</b> means going out. <b>Ingress</b> means coming in. ATT&amp;CK lists both as measures of M1037: filter what leaves (to stop stolen data and C2) and filter what enters (for example, limit SSH and RDP to trusted IP ranges). 'Encrypts' and 'copies' are not directions, so they cannot fit.</p>","study":"the meaning of ingress and egress traffic filtering.","concepts":["M1037","ingress","egress"]},{"id":"E07","type":"qcm","title":"Why do defenders filter traffic?","summary":"Main purpose of M1037","scenario":[{"label":"ARTEFACT 1 \u2014 A new colleague asks","kind":"prose","body":"<p>A new colleague asks you at lunch: <i>'I keep hearing about egress filtering. Why do companies bother with it?'</i></p>"}],"question":"What is the main security reason a company filters its outbound network traffic?","data":{"options":[{"id":"d1","t":"To stop malware calling home and data sneaking out"},{"id":"d2","t":"To make the internet connection faster for users"},{"id":"d3","t":"To avoid buying antivirus software for PCs"},{"id":"d4","t":"To find missing updates on the servers"}],"correct":["d1"]},"hint":"ATT&CK lists egress filtering under M1037 to prevent C2 and data exfiltration. C2 means the attacker's control channel.","explain":"<p>The M1037 page says egress filtering blocks outbound traffic 'to prevent data exfiltration and command-and-control (C2) communications'. Malware that steals data must send it over the network; the filter is the gate. Filtering can add a little speed control, but speed is not a security goal, and it does not replace antivirus or patching.</p>","study":"the risks M1037 addresses: C2 (T1071) and exfiltration (T1048).","concepts":["M1037","T1071","T1048"]},{"id":"E08","type":"match","title":"Match the rule condition to an example","summary":"Filter criteria \u2014 four small matches","scenario":[{"label":"ARTEFACT 1 \u2014 Rule writing practice sheet","kind":"prose","body":"<p>A trainer hands out a practice sheet. Left column: the condition a rule can check. Right column: jumbled examples from a real rulebase. Match each condition to its example.</p>"}],"question":"Match each filter condition on the left with its correct example on the right.","data":{"pairs":[{"left":"Port","right":"TCP 445"},{"left":"Protocol","right":"SMB"},{"left":"IP address","right":"198[.]51[.]100[.]7"},{"left":"Domain","right":"bad-site[.]example"}]},"hint":"One example is a number with a protocol name, one is a protocol word, one looks like four numbers, one looks like a website name.","explain":"<p>A <b>port</b> is written as a number after a protocol, like TCP 445 (the file-sharing port). A <b>protocol</b> is the language of the traffic, like SMB. An <b>IP address</b> is four numbers with dots \u2014 here written with [.] so it cannot be clicked by mistake. A <b>domain</b> is a name like bad-site[.]example. These four are exactly the 'predefined conditions' ATT&amp;CK names for M1037.</p>","study":"reading firewall rule conditions: port, protocol, IP, domain.","concepts":["M1037","filter criteria"]},{"id":"E09","type":"match","title":"Read a firewall log line","summary":"Log fields \u2014 four small matches","scenario":[{"label":"ARTEFACT 1 \u2014 One firewall log line","kind":"log","filter":true,"body":"2026-10-07 09:14:02 DENY TCP 10[.]2[.]1[.]8:52111 -> 10[.]2[.]9[.]4:3389"},{"label":"ARTEFACT 2 \u2014 Field list","kind":"prose","body":"<p>The four fields the SOC coach asks about: <span style='font-family:monospace'>DENY</span>, <span style='font-family:monospace'>10[.]2[.]1[.]8</span>, <span style='font-family:monospace'>3389</span>, <span style='font-family:monospace'>TCP</span>.</p>"}],"question":"Match each field of the log line to what it means.","data":{"pairs":[{"left":"DENY","right":"the filter blocked the connection"},{"left":"10[.]2[.]1[.]8","right":"the inside host that sent the traffic"},{"left":"3389","right":"the RDP port on the target machine"},{"left":"TCP","right":"the transport protocol used"}]},"hint":"One word is the action, one number is a famous Windows remote-desktop port, four numbers are an address, one word is a protocol.","explain":"<p>Firewall logs read like a sentence. The <b>action</b> (DENY) says the filter dropped it \u2014 this log line only exists because M1037 was enforced. The first IP is the <b>source</b> (the sender). The number after the second colon is the <b>port</b>; 3389 is RDP, which ATT&amp;CK's M1037 page mentions for ingress filtering. TCP is the <b>protocol</b>. Once you can read these fields, every exercise about filtering logs gets easier.</p>","study":"reading firewall log fields: action, source IP, port, protocol.","concepts":["M1037","firewall logs","RDP 3389"]},{"id":"E10","type":"order","title":"A new rule, the right way","summary":"Change process \u2014 order three steps","scenario":[{"label":"ARTEFACT 1 \u2014 Sticky note on the firewall console","kind":"prose","body":"<p>Someone wrote the three steps of adding a firewall rule on a sticky note, but the order is lost:</p><p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>\u2022 Deploy the rule on the firewall and test it<br>\u2022 Write the rule request with a clear business reason<br>\u2022 Get approval through the change process</p>"}],"question":"Put the three steps in the order a real firewall team works.","data":{"items":[{"id":"o1","t":"Deploy the rule on the firewall and test it"},{"id":"o2","t":"Write the rule request with a clear business reason"},{"id":"o3","t":"Get approval through the change process"}],"correctOrder":["o2","o3","o1"]},"hint":"You cannot approve something that was never written, and you never deploy before approval.","explain":"<p>Real firewall teams follow a change process: first the <b>request</b> with a reason, then the <b>approval</b>, then the <b>deployment</b> and test. Deploying first is how networks end up with dozens of unknown 'temporary' rules. This order also gives you a paper trail \u2014 a GRC analyst needs it to prove the M1037 control is managed, not just installed.</p>","study":"the change process for firewall rules: request, approve, deploy, document.","concepts":["M1037","change management"]},{"id":"E11","type":"match","title":"What kind of ATT&CK object is it?","summary":"ATT&CK data model \u2014 four IDs to four object types","scenario":[{"label":"ARTEFACT 1 \u2014 ATT&CK IDs on a whiteboard","kind":"prose","body":"<p>The trainer wrote four ATT&amp;CK IDs on the board: <span style='font-family:monospace'>M1037</span>, <span style='font-family:monospace'>T1090</span>, <span style='font-family:monospace'>TA0008</span>, <span style='font-family:monospace'>G0007</span>. 'Connect each to its object type,' she says.</p>"}],"question":"Match each ATT&CK ID to its object type.","data":{"pairs":[{"left":"M1037","right":"Mitigation"},{"left":"T1090","right":"Technique"},{"left":"TA0008","right":"Tactic"},{"left":"G0007","right":"Group (threat actor)"}]},"hint":"In ATT&CK, T-numbers are things attackers do, M-numbers are defences, TA-numbers are attacker goals, G-numbers are attacker gangs.","explain":"<p>ATT&amp;CK has object types you can recognise from the ID. <b>T</b> numbers are <b>techniques</b> (attacker actions, like T1090 Proxy). <b>TA</b> numbers are <b>tactics</b> (attacker goals, TA0008 is Lateral Movement). <b>G</b> numbers are <b>groups</b> (real threat actors, G0007 is APT28). <b>M</b> numbers are <b>mitigations</b> (defences, like our M1037). Knowing the type tells you how to use the page: a mitigation page lists the techniques it helps stop.</p>","study":"the ATT&CK data model: technique, sub-technique, tactic, mitigation, group.","concepts":["M1037","T1090","TA0008","G0007","ATT&CK data model"]},{"id":"E12","type":"categorize","title":"Allow or block?","summary":"Six traffic decisions \u2014 allow vs block","scenario":[{"label":"ARTEFACT 1 \u2014 Six traffic decisions from a rule review","kind":"prose","body":"<p>You sit with the firewall admin. She reads six traffic cases out loud. 'Allow or block?' she asks each time.</p><p style='font-size:13.5px;color:#5a6b85'>Remember the M1037 measures: limit SSH (22) and RDP (3389) to trusted ranges; block abused protocols like Telnet; block traffic to unknown destinations.</p>"}],"question":"Drag each case into Allow or Block.","data":{"buckets":[{"id":"p1","name":"ALLOW (normal, expected)"},{"id":"p2","name":"BLOCK (risky or unexpected)"}],"items":[{"id":"t1","t":"Web server answers TCP 443 to the company proxy","bucket":"p1"},{"id":"t2","t":"Engineer reaches RDP 3389 from the office IP range","bucket":"p1"},{"id":"t3","t":"PC downloads an update from the approved vendor site","bucket":"p1"},{"id":"t4","t":"Internet host connects to TCP 445 on a user PC","bucket":"p2"},{"id":"t5","t":"Server sends Telnet 23 traffic to the internet","bucket":"p2"},{"id":"t6","t":"Server connects to an unknown IP on TCP 4444","bucket":"p2"}]},"hint":"RDP from the office range is exactly what ATT&CK's ingress example allows. Telnet and unknown 4444 are what it blocks.","explain":"<p>ATT&amp;CK's ingress measure limits <b>RDP 3389 to specific IP ranges</b> \u2014 the office range is such a range, so it is allowed. Web to the proxy and updates from the vendor site are normal business. An <b>internet host touching TCP 445</b> (SMB) is a classic attack path \u2014 the M1037 page even suggests blocking SMB 139/445 at the boundary for forced-authentication attacks. <b>Telnet</b> is an old protocol ATT&amp;CK names as commonly abused, and <b>TCP 4444 to an unknown IP</b> is a well-known malware port. Those three get blocked.</p>","study":"which traffic M1037 allows vs blocks: RDP/SSH scoping, SMB 445, Telnet, unknown ports.","concepts":["M1037","T1187","T1021.002","protocol-based filtering"]},{"id":"E13","type":"blank","title":"Deny by default","summary":"Default rule \u2014 one word","scenario":[{"label":"ARTEFACT 1 \u2014 Excerpt from the egress policy","kind":"prose","body":"<p>The policy says: <i>'The filter starts from a safe position. Anything that no rule explicitly permits must be dropped.'</i> One word is missing in the rulebase line below.</p><p style='font-family:monospace;background:#f4f6fb;padding:8px 10px;border-radius:6px'>! last line of the rulebase:<br>deny ip any any  &nbsp;# traffic that matched no ______ rule is dropped here</p>"}],"question":"Complete the comment: traffic that matched no ___ rule is dropped by the final deny line.","data":{"text":"The last line of the rulebase is 'deny ip any any'. It drops traffic that matched no {{1}} rule before it.","bank":[{"id":"x1","t":"allow"},{"id":"x2","t":"deny"},{"id":"x3","t":"log"},{"id":"x4","t":"nat"}],"answers":{"1":"x1"}},"hint":"The final line denies everything else. Which earlier rules decide what is left over?","explain":"<p>This is <b>deny by default</b>: the final 'deny any any' catches everything, so only traffic that an earlier <b>allow</b> rule accepted gets through. Firewalls read rules top-down and stop at the first match. This design is why egress filtering under M1037 works: nothing leaves unless a rule says it may. If the missing word were 'deny', the sentence would make no sense \u2014 deny rules never let traffic reach the last line.</p>","study":"deny-by-default design and first-match rule processing.","concepts":["M1037","deny-by-default","rule order"]},{"id":"E14","type":"qcm","title":"What the filter can and cannot see","summary":"Encrypted traffic \u2014 one guided limitation","scenario":[{"label":"ARTEFACT 1 \u2014 Question from the service desk","kind":"prose","body":"<p>An analyst watches a filter handle a connection to an outside HTTPS website. He asks: <i>'The traffic is encrypted. What can the filter still do with it?'</i></p>"}],"question":"What can a simple port-based filter still do with encrypted HTTPS traffic, and what can it not do?","data":{"options":[{"id":"f1","t":"It can allow or block the connection, but cannot read the hidden content"},{"id":"f2","t":"It can read all the content inside the HTTPS connection"},{"id":"f3","t":"It cannot allow or block HTTPS traffic at all"},{"id":"f4","t":"It automatically turns HTTPS into plain HTTP"}],"correct":["f1"]},"hint":"The filter always sees the outside of the letter (who, where, which port) \u2014 but not the letter inside.","explain":"<p>A simple filter works on the <b>outside</b> of the connection: source, destination, port, protocol. Encryption hides the <b>inside</b> (the words), so the filter can still allow or block the connection \u2014 for example by IP or domain \u2014 but it cannot read the content. That is why M1037 also lists <b>application layer filtering</b>: proxies or WAFs that may decrypt web traffic where policy allows, so the content can be checked too.</p>","study":"what L4 filtering sees vs what application layer filtering (proxy/WAF) adds.","concepts":["M1037","application layer filtering","TLS limits"]},{"id":"E15","type":"clickline","title":"Click the blocked connection","summary":"Three log lines \u2014 click the DENY","scenario":[{"label":"ARTEFACT 1 \u2014 Firewall log, three lines","kind":"log","filter":true,"body":"2026-10-07 09:02:11 ALLOW TCP 10[.]2[.]3[.]5:49122 -> 10[.]2[.]9[.]10:443 proxy-web01\n2026-10-07 09:02:19 DENY TCP 10[.]2[.]1[.]8:52111 -> 198[.]51[.]100[.]7:4444\n2026-10-07 09:02:25 ALLOW UDP 10[.]2[.]3[.]5:53333 -> 10[.]2[.]9[.]1:53 dns-internal"}],"question":"Look at the action word in each line, then click the line where the filter blocked the traffic.","data":{"lines":["2026-10-07 09:02:11 ALLOW TCP 10[.]2[.]3[.]5:49122 -> 10[.]2[.]9[.]10:443 proxy-web01","2026-10-07 09:02:19 DENY TCP 10[.]2[.]1[.]8:52111 -> 198[.]51[.]100[.]7:4444","2026-10-07 09:02:25 ALLOW UDP 10[.]2[.]3[.]5:53333 -> 10[.]2[.]9[.]1:53 dns-internal"],"correct":[1],"multi":false},"hint":"Two lines say ALLOW. One word means the filter stopped the connection.","explain":"<p>Line 2 says <b>DENY</b> \u2014 that is M1037 at work: the filter dropped a connection from an inside host to an outside address on port 4444. Lines 1 and 3 say <b>ALLOW</b>; the filter let them pass (web to the proxy, DNS to the internal resolver). Reading the action word is the first habit of log triage: it immediately tells you what the filter did, not just what happened.</p>","study":"firewall log actions: ALLOW vs DENY.","concepts":["M1037","firewall logs","T1071"]}];
(function () {
  'use strict';
  var CFG = window.EXAM_CONFIG;
  var EXS = window.EXERCISES;
  var INTRO = window.INTRO_CONTENT;
  var THEMES = window.THEMES;

  /* ---------------- utils ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var r = a.slice(); var i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  /* ---------------- syntax highlighting for logs ---------------- */
  function hlLog(raw) {
    var out = esc(raw);
    out = out.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g, '<span class="tok-ip">$1</span>');
    out = out.replace(/(^\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/gm, '<span class="tok-time">$1</span>');
    out = out.replace(/\b(DENY|REJECT|DROP|BLOCK|DENIED|blocked|flushed)\b/g, '<span class="tok-act a-deny">$1</span>');
    out = out.replace(/\b(ALLOW|PERMIT|ACCEPT|ALLOWED|allowed|established)\b/g, '<span class="tok-act a-allow">$1</span>');
    out = out.replace(/\b(TCP|UDP|ICMP|SMB|SSH|DNS|HTTP|HTTPS|FTP|SMTP|RDP|Telnet|SNMP|LLMNR|NetBIOS|VNC|BITS)\b/g, '<span class="tok-proto">$1</span>');
    out = out.replace(/:(\d{2,5})\b/g, ':<span class="tok-port">$1</span>');
    return out;
  }
  function renderArtefact(a) {
    var wrap = el('div', 'artefact');
    var lab = el('div', 'a-label');
    lab.innerHTML = '<span>' + esc(a.label) + '</span>';
    if (a.filter) {
      var fb = el('span', 'filterbox');
      fb.innerHTML = '<label for="flt_' + fltCount + '" style="font-size:12px">Filter:</label>';
      var inp = document.createElement('input');
      inp.type = 'text'; inp.id = 'flt_' + fltCount; inp.placeholder = 'type to filter lines';
      inp.setAttribute('aria-label', 'Filter log lines');
      fb.appendChild(inp);
      lab.appendChild(fb);
      (function (inputRef) {
        inputRef.addEventListener('input', function () {
          var q = inputRef.value.toLowerCase();
          var lines = wrap.querySelectorAll('pre.log .lline');
          for (var i = 0; i < lines.length; i++) {
            lines[i].style.display = (!q || lines[i].textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
          }
        });
      })(inp);
      fltCount++;
    }
    wrap.appendChild(lab);
    var body = el('div', 'a-body ' + (a.kind === 'log' ? 'logbody' : 'prose'));
    if (a.kind === 'log') {
      var pre = el('pre', 'log');
      var lines = String(a.body).split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        html += '<span class="lline" style="display:block">' + (hlLog(lines[i]) || '&nbsp;') + '</span>';
      }
      pre.innerHTML = html;
      body.appendChild(pre);
    } else if (a.kind === 'code') {
      var pc = el('pre', 'code');
      pc.innerHTML = esc(a.body);
      body.appendChild(pc);
    } else {
      body.innerHTML = '<div>' + a.body + '</div>';
    }
    wrap.appendChild(body);
    return wrap;
  }
  var fltCount = 0;

  /* ---------------- timer state machine ----------------
     States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
     Check      -> PAUSED_AUTO_CHECK (before feedback renders)
     Next       -> RUNNING (or ENDED via Final Submit on last)
     Skip/Hint  -> state unchanged (timer keeps running)
     Pause      -> PAUSED_MANUAL (hides exercise); Resume returns to prior state
  ------------------------------------------------------ */
  var T = { state: 'RUNNING', remaining: CFG.durationSec, accManual: 0, accAuto: 0, last: Date.now(), exDeadline: null };
  function setState(s) { T.state = s; renderHeader(); }
  function tick() {
    var now = Date.now(); var d = (now - T.last) / 1000; T.last = now;
    if (phase === 'intro') { return; } /* the clock only runs once the exam starts */
    if (T.state === 'PAUSED_MANUAL') { T.accManual += d; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { T.accAuto += d; }
    else if (T.state === 'RUNNING') {
      T.remaining -= d;
      if (T.exDeadline !== null) {
        T.exDeadline -= d;
        renderExTimer();
        if (T.exDeadline <= 0) { autoCheckTerminal(); }
      }
      if (T.remaining <= 0) { T.remaining = 0; timerEnded(); }
    }
    renderTimer();
  }
  function renderTimer() {
    var chip = $('timerChip'); if (!chip) return;
    var st, cls;
    if (T.state === 'RUNNING') { st = 'RUNNING'; cls = 'st-running'; }
    else if (T.state === 'PAUSED_MANUAL') { st = 'PAUSED — manual (press Resume)'; cls = 'st-paused-manual'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { st = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'st-paused-auto-check'; }
    else { st = 'ENDED'; cls = 'st-ended'; }
    chip.innerHTML = '<span>' + (T.state === 'PAUSED_MANUAL' || T.state === 'PAUSED_AUTO_CHECK' ? '\u23F8' : '\u23F1') + '</span><span class="tstate ' + cls + '">' + st + '</span><span id="tval">' + fmtTime(T.remaining) + '</span>';
  }
  function renderExTimer() {
    var c = $('exTimerChip'); if (!c) return;
    if (T.exDeadline === null) { c.classList.add('hidden'); return; }
    c.classList.remove('hidden');
    c.innerHTML = '\u23F1 sub-task time left: <b>' + Math.max(0, Math.ceil(T.exDeadline)) + 's</b>';
  }

  /* ---------------- attempt state ---------------- */
  var attempt = 0;
  var order = [];            /* exercise copies in attempt order */
  var idx = 0;
  var credits = {};          /* exId -> credit */
  var skipped = {};          /* exId -> true (skipped, unanswered) */
  var hintUsed = {};
  var current = null;
  var phase = 'intro';
  var fromReview = false;
  var reportedForAttempt = -1;
  var answerWidgets = {};    /* per-type live answer data */

  function makeAttemptCopies() {
    order = EXS.map(function (e) { return JSON.parse(JSON.stringify(e)); });
    for (var i = 0; i < order.length; i++) { preShuffle(order[i]); }
    order = shuffle(order);
  }
  function preShuffle(e) {
    var d = e.data;
    if (d.options) d.options = shuffle(d.options);
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.items && d.correctOrder) d.display = shuffle(d.items);
    if (d.pairs) d.rightOpts = shuffle(d.pairs.map(function (p) { return p.right; }));
    if (d.steps) { for (var j = 0; j < d.steps.length; j++) d.steps[j].options = shuffle(d.steps[j].options); }
    if (d.type === 'terminal') { d.elements = shuffle(d.elements); }
  }

  /* ---------------- scoring core ---------------- */
  /* scoreItems: H = correct items selected, W = wrong items selected, N = total correct items
     credit = max(0, (H - W) / N)   (partial-credit contract) */
  function scoreItems(selectedIds, correctIds) {
    var N = correctIds.length;
    var H = 0, W = 0;
    var sel = selectedIds || [];
    for (var i = 0; i < sel.length; i++) {
      if (correctIds.indexOf(sel[i]) !== -1) H++; else W++;
    }
    return { N: N, H: H, W: W, credit: N === 0 ? 1 : Math.max(0, (H - W) / N) };
  }

  /* ---------------- app shell ---------------- */
  var app;
  function boot() {
    app = $('app');
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d) return;
      if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
        if (d.username) { CFG.learner = d.username; var g = $('greetLine'); if (g) g.textContent = 'Welcome, ' + d.username + '. You can start when ready.'; }
      }
    });
    renderIntro();
    setInterval(tick, 250);
  }

  function renderIntro() {
    phase = 'intro';
    T.state = 'RUNNING'; /* timer idle until exam starts; tick guard: phase check */
    var hdr = $('xheader'); if (hdr) hdr.classList.add('hidden');
    app.innerHTML = '';
    var w = el('div', 'intro');
    var sevChip = '<span class="chip sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + ' tier ' + CFG.batch + ' of 4</span>';
    w.innerHTML = '<h1>' + esc(CFG.examTitle) + '</h1>' +
      '<p class="subtitle">MITRE ATT&amp;CK practice certification &middot; topic ' + esc(CFG.topicId.toUpperCase()) + ' &middot; ' + esc(CFG.objectType) + '</p>' +
      '<div class="meta-chips">' + sevChip +
      '<span class="chip">' + CFG.questionCount + ' exercises</span>' +
      '<span class="chip">' + CFG.estimatedMinutes + ' minutes</span>' +
      '<span class="chip">Pass mark: ' + CFG.passMark + '%</span></div>' +
      '<p id="greetLine" style="font-weight:600">' + (CFG.learner ? 'Welcome, ' + esc(CFG.learner) + '.' : '') + ' You will practise one ATT&amp;CK object from many angles. Read the short lesson below first.</p>';

    var p1 = el('div', 'panel');
    p1.innerHTML = '<h2><span aria-hidden="true">\uD83D\uDCD8</span> About ' + esc(CFG.objectId) + ' — ' + esc(CFG.objectName) + '</h2>' + INTRO.about;
    w.appendChild(p1);

    var p2 = el('div', 'panel');
    p2.innerHTML = '<h2><span aria-hidden="true">\uD83E\uDDD0</span> Keywords covered in this tier</h2>' +
      '<p style="font-size:14px;color:var(--muted)">These are the ATT&amp;CK ideas behind the exercises. The four tiers of this topic share the same object; each tier exercises them at its own depth.</p>' +
      renderThemes();
    w.appendChild(p2);

    var p3 = el('div', 'panel');
    p3.innerHTML = '<h2><span aria-hidden="true">\uD83C\uDFAF</span> How this exam works</h2>' + INTRO.howto;
    w.appendChild(p3);

    var p4 = el('div', 'panel');
    p4.innerHTML = '<h2><span aria-hidden="true">\u2696\uFE0F</span> Rules in plain words</h2>' + INTRO.rules;
    w.appendChild(p4);

    var startBtn = el('button', 'primary', 'Start the exam');
    startBtn.id = 'startBtn';
    startBtn.style.fontSize = '17px';
    startBtn.style.padding = '12px 30px';
    startBtn.addEventListener('click', startExam);
    var sb = el('div', 'panel'); sb.style.textAlign = 'center';
    sb.appendChild(startBtn);
    w.appendChild(sb);
    app.appendChild(w);
  }

  function renderThemes() {
    var h = '';
    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      h += '<div class="theme-block"><div class="theme-name"><span aria-hidden="true">' + t.icon + '</span> ' + esc(t.name) + '</div>';
      for (var j = 0; j < t.keywords.length; j++) { h += '<span class="kw">' + esc(t.keywords[j]) + '</span>'; }
      h += '</div>';
    }
    return h;
  }


  /* ---------------- exam flow ---------------- */
  function startExam() {
    attempt++;
    credits = {}; skipped = {}; hintUsed = {};
    idx = 0; reportedForAttempt = -1; fromReview = false;
    T.remaining = CFG.durationSec; T.accManual = 0; T.accAuto = 0; T.exDeadline = null; T.last = Date.now();
    makeAttemptCopies();
    phase = 'exam';
    var hdr = $('xheader'); if (hdr) hdr.classList.remove('hidden');
    setState('RUNNING');
    renderExercise(order[idx]);
  }

  function renderHeader() {
    var h = $('xheader'); if (!h) return;
    var score = scoreLine();
    var pauseBtn = T.state === 'PAUSED_MANUAL'
      ? '<button class="hbtn" id="pauseBtn" aria-label="Resume exam">\u25B6 Resume</button>'
      : '<button class="hbtn" id="pauseBtn" aria-label="Pause exam">\u23F8 Pause</button>';
    var counterTxt = phase === 'review' ? 'Review skipped'
      : phase === 'results' ? 'Results'
      : 'Exercise ' + Math.min(idx + 1, order.length) + ' of ' + order.length;
    h.innerHTML =
      '<span class="counter">' + counterTxt + '</span>' +
      '<span class="sev-badge sev-' + CFG.difficulty + '">' + esc(CFG.severityLabel) + '</span>' +
      '<span class="timer-chip" id="timerChip"></span>' +
      '<span class="score-chip" aria-label="Live score">\u2605 <span id="liveScore">' + score + '</span></span>' +
      '<span class="spacer"></span>' +
      (phase === 'exam' && !answeredCurrent() ? '<button class="hbtn" id="hintBtn" aria-label="Show one hint">\uD83D\uDCA1 Hint</button>' : '') +
      (phase === 'exam' ? '<button class="hbtn" id="skipBtn" aria-label="Skip exercise">\u23ED Skip</button>' : '') +
      pauseBtn;
    renderTimer();
    bindHeader();
  }
  function bindHeader() {
    var b;
    b = $('pauseBtn'); if (b) b.addEventListener('click', onPauseToggle);
    b = $('hintBtn'); if (b) b.addEventListener('click', onHint);
    b = $('skipBtn'); if (b) b.addEventListener('click', onSkip);
  }
  function answeredCurrent() { return current && credits[current.id] !== undefined; }
  function scoreLine() {
    var n = 0, s = 0;
    for (var k in credits) { n++; s += credits[k]; }
    if (n === 0) return '0.0 / 0 (—%)';
    return round1(s) + ' / ' + n + ' (' + Math.round(s / n * 100) + '%)';
  }
  function updateScore() { var ls = $('liveScore'); if (ls) ls.textContent = scoreLine(); }

  function onPauseToggle() {
    if (phase !== 'exam' && phase !== 'review') return;
    if (T.state === 'PAUSED_MANUAL') {
      setState(T.prevState || 'RUNNING');
      var veil = $('pauseVeil'); if (veil) veil.remove();
    } else {
      T.prevState = T.state;
      setState('PAUSED_MANUAL');
      showPauseVeil();
    }
  }
  function showPauseVeil() {
    var veil = $('pauseVeil');
    if (!veil) {
      veil = el('div', '');
      veil.id = 'pauseVeil';
      veil.style.cssText = 'position:fixed;inset:0;background:rgba(15,28,51,.93);z-index:100;display:flex;align-items:center;justify-content:center;color:#e8eefb;text-align:center;padding:20px';
      veil.innerHTML = '<div><div style="font-size:40px" aria-hidden="true">\u23F8</div><div style="font-size:20px;font-weight:800;margin-top:8px">PAUSED — manual break</div><p style="max-width:420px;color:#c4d2ec">The exercise is hidden so you cannot read it while the clock is stopped. Press Resume to continue.</p></div>';
      veil.addEventListener('click', onPauseToggle);
      document.body.appendChild(veil);
    }
  }

  function onHint() {
    if (!current || hintUsed[current.id] || answeredCurrent()) return;
    hintUsed[current.id] = true;
    var box = $('hintBox');
    if (box) { box.innerHTML = '<b>Hint:</b> ' + esc(current.hint); box.classList.remove('hidden'); }
    var hb = $('hintBtn'); if (hb) { hb.disabled = true; hb.title = 'Hint already used for this exercise'; }
  }

  function onSkip() {
    if (!current || answeredCurrent()) return;
    skipped[current.id] = true;
    T.exDeadline = null;
    if (fromReview) { fromReview = false; gotoReview(); return; }
    if (idx < order.length - 1) { idx++; setState('RUNNING'); renderExercise(order[idx]); }
    else { gotoReview(); }
  }

  function gotoReview() {
    phase = 'review';
    T.exDeadline = null;
    if (T.state !== 'ENDED') setState('RUNNING');
    renderReview();
  }

  function renderReview() {
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');
    var ids = [];
    for (var k in skipped) { if (credits[k] === undefined) ids.push(k); }
    var h = '<div class="block"><div class="block-head"><span class="bicon">\uD83D\uDDC9</span> REVIEW SKIPPED EXERCISES</div><div class="block-body">';
    if (ids.length === 0) {
      h += '<p>You have answered or re-checked every exercise. Nothing is waiting here.</p>';
    } else {
      h += '<p>These exercises are still unanswered. Skipped-and-unanswered exercises are <b>excluded from your score</b>. You can answer them now, as many times as you like, until the timer ends. Or submit and leave them out.</p>';
    }
    h += '</div></div>';
    w.innerHTML = h;
    var list = el('div', 'reviewlist');
    for (var i = 0; i < ids.length; i++) {
      (function (id) {
        var ex = order.filter(function (o) { return o.id === id; })[0];
        if (!ex) return;
        var row = el('div', 'reviewrow');
        row.innerHTML = '<span class="rt"><b>' + esc(id) + '</b> — ' + esc(ex.summary) + '</span>';
        var btn = el('button', 'primary', 'Answer now');
        btn.addEventListener('click', function () {
          phase = 'exam';
          fromReview = true;
          idx = order.indexOf(ex);
          setState('RUNNING');
          renderExercise(ex);
        });
        row.appendChild(btn);
        list.appendChild(row);
      })(ids[i]);
    }
    w.appendChild(list);
    var act = el('div', 'actionrow');
    var sub = el('button', 'primary', 'Submit exam and see results');
    sub.addEventListener('click', finalSubmit);
    act.appendChild(sub);
    w.appendChild(act);
    app.appendChild(w);
  }

  /* ---------------- exercise rendering ---------------- */
  function renderExercise(ex) {
    current = ex;
    answerWidgets = {};
    fltCount = 0;
    /* reduced per-exercise timer (EXTREMELY HARD terminal only) */
    T.exDeadline = ex.perExerciseTimer ? ex.perExerciseTimer : null;
    app.innerHTML = '';
    renderHeader();
    var w = el('div', 'exam');

    /* header block: severity + title */
    w.appendChild(el('div', '', '<h2 style="margin:8px 0 0;color:var(--head)">' + esc(ex.id) + ' — ' + esc(ex.title) + '</h2>'));

    /* SCENARIO block (collapsible when long) */
    var scen = el('div', 'block scenario');
    var shead = el('div', 'block-head');
    shead.innerHTML = '<span class="bicon">\uD83D\uDCCB</span> SCENARIO';
    scen.appendChild(shead);
    var panels = ex.scenario;
    var totalLen = 0;
    for (var sl = 0; sl < panels.length; sl++) { totalLen += String(panels[sl].body || '').length; }
    var collapsed = totalLen > 420;
    var sbody = el('div', 'block-body');
    for (var i = 0; i < panels.length; i++) sbody.appendChild(renderArtefact(panels[i]));
    if (collapsed) {
      var sum = el('button', 'scen-summary');
      sum.type = 'button';
      sum.innerHTML = '<span class="caret" aria-hidden="true">\u25BC</span><span>' + esc(ex.summary) + '</span><span style="margin-left:auto;font-weight:400">(tap to collapse / expand the scenario)</span>';
      sum.setAttribute('aria-expanded', 'true');
      sum.addEventListener('click', function () {
        var open = sbody.style.display !== 'none';
        sbody.style.display = open ? 'none' : '';
        sum.setAttribute('aria-expanded', open ? 'false' : 'true');
        scen.classList.toggle('scen-collapsed', open);
      });
      scen.appendChild(sum);
      scen.appendChild(sbody);
    } else {
      scen.appendChild(sbody);
    }
    w.appendChild(scen);

    /* QUESTION block */
    var q = el('div', 'block question');
    q.innerHTML = '<div class="block-head"><span class="bicon">\u2753</span> QUESTION</div><div class="block-body"><p class="qtext">' + ex.question + '</p></div>';
    w.appendChild(q);

    /* YOUR ANSWER block */
    var a = el('div', 'block answer');
    a.innerHTML = '<div class="block-head"><span class="bicon">\u270D\uFE0F</span> YOUR ANSWER</div>';
    var abody = el('div', 'block-body');
    abody.id = 'answerBody';
    var hintBox = el('div', 'warnbox hidden');
    hintBox.id = 'hintBox';
    abody.appendChild(hintBox);
    if (T.exDeadline !== null) { var etc = el('div', 'warnbox'); etc.id = 'exTimerChip'; abody.appendChild(etc); renderExTimer(); }
    buildWidget(abody, ex);
    var act = el('div', 'actionrow');
    var chk = el('button', 'primary', 'Check');
    chk.id = 'checkBtn';
    chk.addEventListener('click', onCheck);
    act.appendChild(chk);
    var hintNote = el('span', '', '<span style="font-size:12.5px;color:var(--muted)">Check stops the timer so you can read the feedback without pressure. The clock starts again on Next.</span>');
    act.appendChild(hintNote);
    abody.appendChild(act);
    a.appendChild(abody);
    w.appendChild(a);

    /* feedback + next area */
    var fb = el('div', '');
    fb.id = 'feedbackArea';
    w.appendChild(fb);

    app.appendChild(w);
    if (hintUsed[ex.id]) { hintBox.innerHTML = '<b>Hint:</b> ' + esc(ex.hint); hintBox.classList.remove('hidden'); }
  }

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') buildChoice(root, ex);
    else if (ex.type === 'match') buildMatch(root, ex);
    else if (ex.type === 'categorize') buildDnd(root, ex);
    else if (ex.type === 'blank') buildBlank(root, ex);
    else if (ex.type === 'order') buildOrder(root, ex);
    else if (ex.type === 'tree') buildTree(root, ex);
    else if (ex.type === 'clickline') buildClick(root, ex);
    else if (ex.type === 'terminal') buildTerminal(root, ex);
  }

  function buildChoice(root, ex) {
    var d = ex.data;
    var multi = ex.type === 'multi';
    var wrap = el('div', '');
    wrap.setAttribute('role', 'group');
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    answerWidgets.choice = { selected: {}, multi: multi };
    for (var i = 0; i < d.options.length; i++) {
      (function (oi) {
        var lab = el('label', 'opt');
        var input = document.createElement('input');
        input.type = multi ? 'checkbox' : 'radio';
        input.name = 'opt_' + ex.id;
        input.value = oi.id;
        input.addEventListener('change', function () {
          if (multi) {
            if (input.checked) answerWidgets.choice.selected[oi.id] = true;
            else delete answerWidgets.choice.selected[oi.id];
            lab.classList.toggle('selected', input.checked);
          } else {
            answerWidgets.choice.selected = {};
            answerWidgets.choice.selected[oi.id] = true;
            var labs = wrap.querySelectorAll('.opt');
            for (var k = 0; k < labs.length; k++) labs[k].classList.remove('selected');
            lab.classList.add('selected');
          }
        });
        lab.appendChild(input);
        lab.appendChild(el('span', 'olabel', labels[i] + '.'));
        lab.appendChild(el('span', '', '<span>' + esc(oi.t) + '</span>'));
        wrap.appendChild(lab);
      })(d.options[i]);
    }
    root.appendChild(wrap);
  }

  function buildMatch(root, ex) {
    var d = ex.data;
    answerWidgets.match = {};
    for (var i = 0; i < d.pairs.length; i++) {
      (function (p) {
        var row = el('div', 'matchrow');
        row.appendChild(el('div', 'mleft', esc(p.left)));
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Match for: ' + p.left);
        sel.appendChild(new Option('— choose the match —', ''));
        for (var j = 0; j < d.rightOpts.length; j++) sel.appendChild(new Option(d.rightOpts[j], d.rightOpts[j]));
        sel.addEventListener('change', function () { answerWidgets.match[p.left] = sel.value || null; });
        row.appendChild(sel);
        answerWidgets.match[p.left] = null;
        row.dataset.left = p.left;
        root.appendChild(row);
      })(d.pairs[i]);
    }
  }

  function buildDnd(root, ex) {
    var d = ex.data;
    var w = el('div', 'dnd-wrap');
    var bankWrap = el('div', '');
    bankWrap.appendChild(el('div', 'bank-label', 'ITEMS — drag each item, or tap it then tap a bucket'));
    var bank = el('div', 'itembank');
    bank.id = 'bank_' + ex.id;
    bankWrap.appendChild(bank);
    answerWidgets.dnd = { placed: {}, picked: null };
    var items = shuffle(d.items);
    for (var i = 0; i < items.length; i++) { bank.appendChild(makeDItem(items[i])); }
    var buckets = el('div', 'buckets');
    for (var b = 0; b < d.buckets.length; b++) {
      (function (bk) {
        var box = el('div', 'bucket');
        box.dataset.bucket = bk.id;
        box.innerHTML = '<h4><span aria-hidden="true">\uD83D\uDCE5</span> ' + esc(bk.name) + '</h4><div class="b-drop"></div>';
        box.addEventListener('dragover', function (ev) { ev.preventDefault(); box.classList.add('b-over'); });
        box.addEventListener('dragleave', function () { box.classList.remove('b-over'); });
        box.addEventListener('drop', function (ev) {
          ev.preventDefault(); box.classList.remove('b-over');
          var id = ev.dataTransfer.getData('text/plain');
          placeItem(id, bk.id);
        });
        box.addEventListener('click', function () {
          if (answerWidgets.dnd.picked) { placeItem(answerWidgets.dnd.picked, bk.id); }
        });
        buckets.appendChild(box);
      })(d.buckets[b]);
    }
    function makeDItem(it) {
      var di = el('div', 'ditem');
      di.textContent = it.t;
      di.draggable = true; di.dataset.item = it.id; di.id = 'it_' + it.id;
      di.setAttribute('tabindex', '0');
      di.setAttribute('role', 'button');
      di.setAttribute('aria-label', 'Item: ' + it.t + '. Press Enter to pick up, then choose a bucket button below.');
      di.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', it.id); di.classList.add('dragging'); });
      di.addEventListener('dragend', function () { di.classList.remove('dragging'); });
      di.addEventListener('click', function () {
        if (di.classList.contains('locked')) return;
        var was = di.classList.contains('picked');
        var all = document.querySelectorAll('.ditem.picked');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('picked');
        if (!was) { di.classList.add('picked'); answerWidgets.dnd.picked = it.id; }
        else answerWidgets.dnd.picked = null;
      });
      return di;
    }
    function placeItem(id, bucketId) {
      if (!id || answerWidgets.dnd.placed[id] !== undefined) return;
      var di = $('it_' + id); if (!di) return;
      var box = buckets.querySelector('.bucket[data-bucket="' + bucketId + '"] .b-drop');
      if (!box) return;
      di.classList.remove('picked');
      box.appendChild(di);
      answerWidgets.dnd.placed[id] = bucketId;
      answerWidgets.dnd.picked = null;
    }
    w.appendChild(bankWrap);
    w.appendChild(buckets);
    root.appendChild(w);
  }

  function buildBlank(root, ex) {
    var d = ex.data;
    answerWidgets.blank = {};
    var slotsWrap = el('div', 'slots');
    var html = '';
    var text = d.text;
    var parts = text.split(/\{\{(\d+)\}\}/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var n = parts[i];
        html += '<span class="slot" data-slot="' + n + '" tabindex="0" role="button" aria-label="Blank ' + n + ', tap to clear"><span class="sv">&nbsp;</span></span>';
      } else {
        html += esc(parts[i]);
      }
    }
    slotsWrap.innerHTML = html;
    root.appendChild(slotsWrap);
    var slots = slotsWrap.querySelectorAll('.slot');
    var focusSlot = null;
    for (var s = 0; s < slots.length; s++) {
      (function (sl) {
        sl.addEventListener('click', function () {
          if (sl.dataset.token) { /* filled: return token */
            delete answerWidgets.blank[sl.dataset.slot];
            var tk = $('tk_' + sl.dataset.token);
            if (tk) { tk.classList.remove('used'); }
            sl.dataset.token = ''; sl.querySelector('.sv').innerHTML = '&nbsp;'; sl.classList.remove('filled');
          }
          focusSlot = sl.dataset.slot;
        });
      })(slots[s]);
    }
    var lbl = el('div', 'bank-label', 'WORD BANK — tap a word to put it in the last-chosen empty blank (or the next free one)');
    root.appendChild(lbl);
    var bank = el('div', 'bank');
    for (var b = 0; b < d.bank.length; b++) {
      (function (tk) {
        var bt = el('button', 'btoken');
        bt.type = 'button'; bt.id = 'tk_' + tk.id; bt.textContent = tk.t;
        bt.addEventListener('click', function () {
          if (bt.classList.contains('used')) return;
          var target = null;
          if (focusSlot && !answerWidgets.blank[focusSlot]) target = focusSlot;
          if (!target) {
            for (var k = 0; k < slots.length; k++) {
              if (!answerWidgets.blank[slots[k].dataset.slot]) { target = slots[k].dataset.slot; break; }
            }
          }
          if (!target) return;
          answerWidgets.blank[target] = tk.id;
          var slp = slotsWrap.querySelector('.slot[data-slot="' + target + '"]');
          slp.dataset.token = tk.id;
          slp.querySelector('.sv').textContent = tk.t;
          slp.classList.add('filled');
          bt.classList.add('used');
        });
        bank.appendChild(bt);
      })(d.bank[b]);
    }
    root.appendChild(bank);
  }

  function buildOrder(root, ex) {
    var d = ex.data;
    answerWidgets.order = { seq: d.display.map(function (it) { return it.id; }) };
    var list = el('div', 'orderlist');
    list.id = 'orderList';
    function redraw() {
      list.innerHTML = '';
      var seq = answerWidgets.order.seq;
      for (var i = 0; i < seq.length; i++) {
        (function (pos, id) {
          var it = d.display.filter(function (x) { return x.id === id; })[0];
          var row = el('div', 'oline');
          row.draggable = true; row.dataset.pos = pos;
          row.innerHTML = '<span class="onum">' + (pos + 1) + '</span><span class="otext">' + esc(it.t) + '</span>';
          var btns = el('span', 'obtns');
          var up = el('button', '', '\u2191'); up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          var dn = el('button', '', '\u2193'); dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          up.addEventListener('click', function () { swap(pos, -1); });
          dn.addEventListener('click', function () { swap(pos, 1); });
          btns.appendChild(up); btns.appendChild(dn);
          row.appendChild(btns);
          row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(pos)); row.classList.add('dragging'); });
          row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
          row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
          row.addEventListener('drop', function (ev) {
            ev.preventDefault();
            var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
            var to = parseInt(row.dataset.pos, 10);
            if (isNaN(from) || isNaN(to) || from === to) return;
            var s = answerWidgets.order.seq;
            var mv = s.splice(from, 1)[0];
            s.splice(to, 0, mv);
            redraw();
          });
          list.appendChild(row);
        })(i, seq[i]);
      }
    }
    function swap(pos, dir) {
      var s = answerWidgets.order.seq;
      var to = pos + dir;
      if (to < 0 || to >= s.length) return;
      var t = s[pos]; s[pos] = s[to]; s[to] = t;
      redraw();
    }
    redraw();
    root.appendChild(list);
    root.appendChild(el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Use the arrows or drag the rows. First row = rank 1.</span>'));
  }

  function buildTree(root, ex) {
    var d = ex.data;
    answerWidgets.tree = { step: 0, picks: {} };
    var holder = el('div', '');
    holder.id = 'treeHolder';
    root.appendChild(holder);
    var nextBtn = el('button', 'primary', 'Confirm and go to the next step');
    nextBtn.id = 'treeNextBtn';
    nextBtn.disabled = true;
    nextBtn.addEventListener('click', function () {
      var st = d.steps[answerWidgets.tree.step];
      var pick = answerWidgets.tree.picks[answerWidgets.tree.step];
      if (!pick) return;
      answerWidgets.tree.step++;
      nextBtn.disabled = true;
      drawStep();
    });
    root.appendChild(nextBtn);
    function drawStep() {
      holder.innerHTML = '';
      var si = answerWidgets.tree.step;
      if (si >= d.steps.length) {
        nextBtn.disabled = true; nextBtn.classList.add('hidden');
        var done = el('div', 'tree-recorded', '\u2705 All steps answered. Press Check to see how you did.');
        holder.appendChild(done);
        return;
      }
      var st = d.steps[si];
      var box = el('div', 'tree-step');
      box.innerHTML = '<span class="step-tag">STEP ' + (si + 1) + ' OF ' + d.steps.length + '</span>';
      if (st.artefactLabel) box.innerHTML += '<p style="font-size:13px;color:var(--muted);margin:4px 0">Re-read artefact: <b>' + esc(st.artefactLabel) + '</b> above if you need it.</p>';
      box.innerHTML += '<p class="step-q">' + st.q + '</p>';
      var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
      for (var i = 0; i < st.options.length; i++) {
        (function (oi, k) {
          var lab = el('label', 'opt');
          lab.innerHTML = '<input type="radio" name="tree_' + si + '" value="' + oi.id + '"><span class="olabel">' + labels[k] + '.</span><span>' + esc(oi.t) + '</span>';
          var input = lab.querySelector('input');
          input.addEventListener('change', function () {
            answerWidgets.tree.picks[si] = oi.id;
            nextBtn.disabled = false;
          });
          box.appendChild(lab);
        })(st.options[i], i);
      }
      holder.appendChild(box);
    }
    drawStep();
  }

  function buildClick(root, ex) {
    var d = ex.data;
    answerWidgets.click = {};
    var wrap = el('div', 'clicklines');
    for (var i = 0; i < d.lines.length; i++) {
      (function (li, k) {
        var row = el('div', 'cline');
        row.setAttribute('tabindex', '0');
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', 'Log line ' + (k + 1) + '. Press Enter to select.');
        row.innerHTML = '<span class="cnum">' + (k + 1) + '</span><span>' + hlLog(li) + '</span>';
        row.addEventListener('click', function () {
          if (row.classList.contains('locked')) return;
          if (!ex.data.multi) {
            var all = wrap.querySelectorAll('.cline.selected');
            for (var z = 0; z < all.length; z++) all[z].classList.remove('selected');
            answerWidgets.click = {};
          }
          row.classList.toggle('selected');
          if (row.classList.contains('selected')) answerWidgets.click[k] = true;
          else delete answerWidgets.click[k];
        });
        row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
        wrap.appendChild(row);
      })(d.lines[i], i);
    }
    root.appendChild(wrap);
  }

  function buildTerminal(root, ex) {
    var d = ex.data;
    answerWidgets.term = { value: '' };
    var term = el('div', 'term');
    var scroll = el('div', 'term-scroll');
    scroll.id = 'termScroll';
    var start = '<div class="term-line">Last login: ' + new Date().toUTCString() + ' from 10[.]20[.]1[.]9</div>';
    if (d.banner) start += '<div class="term-line">' + esc(d.banner) + '</div>';
    scroll.innerHTML = start;
    term.appendChild(scroll);
    var inputRow = el('div', 'term-input');
    inputRow.innerHTML = '<span class="tprompt">' + esc(d.prompt) + '</span>';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.setAttribute('aria-label', 'Command line input');
    inp.addEventListener('input', function () { answerWidgets.term.value = inp.value; });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { runLine(); }
    });
    function runLine() {
      var v = inp.value;
      scroll.innerHTML += '<div class="term-line"><span style="color:#8ff0a9">' + esc(d.prompt) + '</span> ' + esc(v) + '</div>';
      var tv = v.trim();
      if (tv) {
        var first = tv.split(/\s+/)[0].toLowerCase();
        if (d.simTool && first === d.simTool) {
          var out = d.simOut || [];
          for (var oi = 0; oi < out.length; oi++) {
            scroll.innerHTML += '<div class="term-line" style="color:#9fb3d1">' + esc(out[oi]) + '</div>';
          }
        } else {
          scroll.innerHTML += '<div class="term-line" style="color:#ff8f8f">sh: ' + esc(first) + ': command not found (simulation)</div>';
        }
      }
      answerWidgets.term.value = v;
      inp.value = '';
      scroll.scrollTop = scroll.scrollHeight;
    }
    inputRow.appendChild(inp);
    term.appendChild(inputRow);
    root.appendChild(term);
    var note = el('p', '', '<span style="font-size:12.5px;color:var(--muted)">Simulation only — nothing real is executed. Press Enter to echo the line, then Check to grade it. Typos in spacing or case are forgiven; wrong flags are not (this is the ' + esc(CFG.severityLabel) + ' tier).</span>');
    root.appendChild(note);
  }

  window.__enginePart = 2;


  /* ---------------- grading ---------------- */
  function collectAnswer(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') return Object.keys(answerWidgets.choice.selected);
    if (ex.type === 'match') {
      var m = answerWidgets.match, out = [];
      for (var k in m) { if (m[k]) out.push(k + '=>' + m[k]); }
      return out;
    }
    if (ex.type === 'categorize') {
      var p = answerWidgets.dnd.placed, arr = [];
      for (var k2 in p) arr.push(k2 + '=>' + p[k2]);
      return arr;
    }
    if (ex.type === 'blank') {
      var b = answerWidgets.blank, arr2 = [];
      for (var k3 in b) arr2.push(k3 + '=>' + b[k3]);
      return arr2;
    }
    if (ex.type === 'order') {
      return answerWidgets.order.seq.map(function (id, i) { return i + '=>' + id; });
    }
    if (ex.type === 'tree') {
      var picks = answerWidgets.tree.picks, arr3 = [];
      for (var k4 in picks) arr3.push(k4 + '=>' + picks[k4]);
      return arr3;
    }
    if (ex.type === 'clickline') return Object.keys(answerWidgets.click);
    if (ex.type === 'terminal') return [answerWidgets.term.value || ''];
    return [];
  }

  function gradeExercise(ex) {
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') {
      var correct = d.options.filter(function (o) { return d.correct.indexOf(o.id) !== -1; }).map(function (o) { return o.id; });
      var r = scoreItems(collectAnswer(ex), correct);
      return { r: r, items: optionItems(ex, d, r) };
    }
    if (ex.type === 'match') {
      var sel = collectAnswer(ex);
      var correctPairs = d.pairs.map(function (p) { return p.left + '=>' + p.right; });
      var r2 = scoreItems(sel, correctPairs);
      var items2 = [];
      var given = {};
      for (var i = 0; i < sel.length; i++) { var kv = sel[i].split('=>'); given[kv[0]] = kv[1]; }
      for (var j = 0; j < d.pairs.length; j++) {
        var p = d.pairs[j];
        if (given[p.left] === undefined) items2.push({ st: 'miss', label: p.left + ' → ' + p.right });
        else if (given[p.left] === p.right) items2.push({ st: 'ok', label: p.left + ' → ' + p.right });
        else items2.push({ st: 'no', label: p.left + ' (you chose: ' + given[p.left] + '; right: ' + p.right + ')' });
      }
      return { r: r2, items: items2 };
    }
    if (ex.type === 'categorize') {
      var placed = answerWidgets.dnd.placed;
      var N = d.items.length, H = 0, W = 0;
      var items3 = [];
      var bucketName = {};
      for (var b = 0; b < d.buckets.length; b++) bucketName[d.buckets[b].id] = d.buckets[b].name;
      for (var k = 0; k < d.items.length; k++) {
        var it = d.items[k];
        if (placed[it.id] === undefined) { items3.push({ st: 'miss', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else if (placed[it.id] === it.bucket) { H++; items3.push({ st: 'ok', label: it.t + ' → ' + bucketName[it.bucket] }); }
        else { W++; items3.push({ st: 'no', label: it.t + ' (you put it in ' + bucketName[placed[it.id]] + '; it belongs in ' + bucketName[it.bucket] + ')' }); }
      }
      return { r: { N: N, H: H, W: W, credit: Math.max(0, (H - W) / N) }, items: items3 };
    }
    if (ex.type === 'blank') {
      var filled = answerWidgets.blank;
      var N4 = Object.keys(d.answers).length, H4 = 0, W4 = 0;
      var items4 = [];
      var bankTxt = {};
      for (var z = 0; z < d.bank.length; z++) bankTxt[d.bank[z].id] = d.bank[z].t;
      for (var sn in d.answers) {
        var want = d.answers[sn];
        var got = filled[sn];
        if (got === undefined) items4.push({ st: 'miss', label: 'Blank ' + sn + ': ' + bankTxt[want] });
        else if (got === want) { H4++; items4.push({ st: 'ok', label: 'Blank ' + sn + ': ' + bankTxt[want] }); }
        else { W4++; items4.push({ st: 'no', label: 'Blank ' + sn + ': you wrote "' + bankTxt[got] + '", right is "' + bankTxt[want] + '"' }); }
      }
      return { r: { N: N4, H: H4, W: W4, credit: Math.max(0, (H4 - W4) / N4) }, items: items4 };
    }
    if (ex.type === 'order') {
      var seq = answerWidgets.order.seq;
      var N5 = seq.length, H5 = 0, W5 = 0;
      var items5 = [];
      var txt5 = {};
      for (var t5 = 0; t5 < d.items.length; t5++) txt5[d.items[t5].id] = d.items[t5].t;
      for (var pos = 0; pos < seq.length; pos++) {
        if (seq[pos] === d.correctOrder[pos]) { H5++; items5.push({ st: 'ok', label: 'Position ' + (pos + 1) + ': ' + txt5[seq[pos]] }); }
        else { W5++; items5.push({ st: 'no', label: 'Position ' + (pos + 1) + ': you put "' + txt5[seq[pos]] + '", right is "' + txt5[d.correctOrder[pos]] + '"' }); }
      }
      return { r: { N: N5, H: H5, W: W5, credit: Math.max(0, (H5 - W5) / N5) }, items: items5 };
    }
    if (ex.type === 'tree') {
      var picks = answerWidgets.tree.picks;
      var N6 = d.steps.length, H6 = 0, W6 = 0;
      var items6 = [];
      for (var si = 0; si < d.steps.length; si++) {
        var st = d.steps[si];
        var optTxt = {};
        for (var oi = 0; oi < st.options.length; oi++) optTxt[st.options[oi].id] = st.options[oi].t;
        var pick = picks[si];
        if (pick === undefined) items6.push({ st: 'miss', label: 'Step ' + (si + 1) + ': ' + optTxt[st.correct] });
        else if (pick === st.correct) { H6++; items6.push({ st: 'ok', label: 'Step ' + (si + 1) + ': ' + optTxt[st.correct] }); }
        else { W6++; items6.push({ st: 'no', label: 'Step ' + (si + 1) + ': you chose "' + optTxt[pick] + '"; right is "' + optTxt[st.correct] + '"' }); }
      }
      return { r: { N: N6, H: H6, W: W6, credit: Math.max(0, (H6 - W6) / N6) }, items: items6 };
    }
    if (ex.type === 'clickline') {
      var clicked = Object.keys(answerWidgets.click).map(Number);
      var r7 = scoreItems(clicked, d.correct);
      var items7 = [];
      for (var li = 0; li < d.lines.length; li++) {
        var isC = d.correct.indexOf(li) !== -1;
        var wasClicked = clicked.indexOf(li) !== -1;
        if (isC && wasClicked) items7.push({ st: 'ok', label: 'Line ' + (li + 1) });
        else if (!isC && wasClicked) items7.push({ st: 'no', label: 'Line ' + (li + 1) + ' (selected, but it is normal traffic)' });
        else if (isC && !wasClicked) items7.push({ st: 'miss', label: 'Line ' + (li + 1) + ' (this one was suspicious — you did not select it)' });
      }
      return { r: r7, items: items7 };
    }
    if (ex.type === 'terminal') {
      return gradeTerminal(ex);
    }
    return { r: { N: 1, H: 0, W: 0, credit: 0 }, items: [] };
  }

  function optionItems(ex, d, r) {
    var items = [];
    var labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    for (var i = 0; i < d.options.length; i++) {
      var o = d.options[i];
      var isC = d.correct.indexOf(o.id) !== -1;
      var wasSel = answerWidgets.choice.selected[o.id] === true;
      if (isC && wasSel) items.push({ st: 'ok', label: labels[i] + '. ' + o.t });
      else if (!isC && wasSel) items.push({ st: 'no', label: labels[i] + '. ' + o.t });
      else if (isC && !wasSel) items.push({ st: 'miss', label: labels[i] + '. ' + o.t });
    }
    return items;
  }

  function gradeTerminal(ex) {
    var d = ex.data;
    var norm = ' ' + (answerWidgets.term.value || '').toLowerCase().replace(/\s+/g, ' ').trim() + ' ';
    var H = 0, W = 0;
    var items = [];
    for (var i = 0; i < d.elements.length; i++) {
      var e = d.elements[i];
      var re = new RegExp(e.re, 'i');
      if (re.test(norm)) { H++; items.push({ st: 'ok', label: e.name }); }
      else items.push({ st: 'miss', label: e.name });
    }
    var dangerHit = false;
    for (var j = 0; j < (d.wrong || []).length; j++) {
      var wg = d.wrong[j];
      var re2 = new RegExp(wg.re, 'i');
      if (re2.test(norm)) { W++; dangerHit = dangerHit || !!wg.danger; items.push({ st: 'no', label: wg.name }); }
    }
    return { r: { N: d.elements.length, H: H, W: W, credit: Math.max(0, (H - W) / d.elements.length) }, items: items, danger: dangerHit, typed: (answerWidgets.term.value || '').trim() };
  }

  /* ---------------- check / next / submit ---------------- */
  function onCheck() {
    if (!current || answeredCurrent()) return;
    /* MANDATORY: Check first sets the auto-pause state, then renders feedback. */
    T.exDeadline = null;
    setState('PAUSED_AUTO_CHECK');
    var ex = current;
    var res = gradeExercise(ex);
    var credit = res.r.credit;
    if (hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
    credits[ex.id] = credit;
    if (skipped[ex.id]) delete skipped[ex.id];
    lockWidgets(ex);
    renderFeedback(ex, res, credit);
    updateScore();
    renderHeader();
  }

  function autoCheckTerminal() {
    /* reduced per-exercise timer expired: grade whatever is typed (possibly nothing) */
    if (!current || answeredCurrent()) return;
    onCheck();
  }

  function lockWidgets(ex) {
    var ans = $('answerBody');
    if (!ans) return;
    var els = ans.querySelectorAll('input,select,button,label.opt,div.cline,div.oline,div.ditem,span.slot,.btoken');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (e.tagName === 'INPUT' || e.tagName === 'SELECT') { e.disabled = true; }
      if (e.classList) { e.classList.add('locked'); e.style.pointerEvents = 'none'; }
    }
    var chk = $('checkBtn'); if (chk) chk.disabled = true;
  }

  function renderFeedback(ex, res, credit) {
    var area = $('feedbackArea'); if (!area) return;
    var full = credit >= 0.999;
    var zero = credit <= 0.0001;
    var cls = full ? 'f-correct' : (zero ? 'f-wrong' : 'f-partial');
    var label = full ? '\u2705 CORRECT' : (zero ? '\u274C INCORRECT' : '\u2714 PARTIALLY CORRECT');
    var fb = el('div', 'feedback ' + cls);
    var multi = res.r.N > 1;
    var head = '<div class="fb-head"><span>' + label + '</span></div>';
    var body = '<div class="fb-body">';
    if (multi) {
      body += '<div class="fb-credit">credit ' + credit.toFixed(2) + ' — ' + res.r.H + '/' + res.r.N + ' items correct' + (res.r.W ? ', ' + res.r.W + ' wrong' : '') + ' &middot; formula: max(0, (H − W) / N) = max(0, (' + res.r.H + ' − ' + res.r.W + ') / ' + res.r.N + ')' + (hintUsed[ex.id] ? ' &middot; hint used: −0.10' : '') + '</div>';
    } else if (hintUsed[ex.id]) {
      body += '<div class="fb-credit">hint used: credit reduced by 0.10</div>';
    }
    if (multi) {
      body += '<ul class="itemfb">';
      for (var i = 0; i < res.items.length; i++) {
        var it = res.items[i];
        var ic = it.st === 'ok' ? '<span class="ic i-ok">\u2713</span><span style="font-weight:700;color:#15803d">Correct</span>'
          : it.st === 'no' ? '<span class="ic i-no">\u2717</span><span style="font-weight:700;color:#b91c1c">Wrong</span>'
            : '<span class="ic i-miss">\u25CB</span><span style="font-weight:700;color:#b45309">Missed</span>';
        body += '<li>' + ic + ' <span>' + esc(it.label) + '</span></li>';
      }
      body += '</ul>';
    }
    if (ex.type === 'terminal') {
      body += terminalFeedback(ex, res);
    }
    body += '<div class="explain">' + ex.explain + (ex.type === 'qcm' || ex.type === 'multi' ? singleAnswerText(ex) : '') + '</div>';
    body += '<p class="study">What to study: ' + esc(ex.study) + '</p>';
    body += '</div>';
    fb.innerHTML = head + body;
    area.innerHTML = '';
    area.appendChild(fb);

    /* next / final submit */
    var act = el('div', 'actionrow');
    var isLast = idx >= order.length - 1;
    var nx = el('button', 'primary', isLast ? 'Final Submit' : 'Next \u2192');
    nx.id = 'nextBtn';
    nx.addEventListener('click', function () {
