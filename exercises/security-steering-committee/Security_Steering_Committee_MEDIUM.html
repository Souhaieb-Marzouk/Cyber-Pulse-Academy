<style>

.block{border:1px solid var(--line);border-radius:14px;margin:.75rem 0;overflow:hidden;background:#0c1729}

.termwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.7rem;align-items:start}

  font:inherit;font-size:.85rem;cursor:pointer}
.chipbtn.cur{outline:2px solid var(--acc);outline-offset:1px}
.chipbtn.good{background:#0d3320;border-color:var(--ok)}
.chipbtn.bad{background:#33121a;border-color:var(--bad)}
.chipbtn.skip{background:#33280a;border-color:var(--skip)}
.legend{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem}

/* ---------- review skipped ---------- */
.skipList{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.skipList li{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--skip);background:#1a1508;border-radius:10px;padding:.6rem .8rem}

/* ---------- results ---------- */
.resulthead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cert{border:2px solid var(--acc);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1rem;
  background:linear-gradient(135deg,#0b1f36,#141033);text-align:center}
.cert .ct{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert .cn{font-size:1.5rem;font-weight:800;margin:.3rem 0}
.cert .cs{font-size:1rem;color:#cfe2ff}
.bars{display:grid;gap:.5rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:200px 1fr 90px;gap:.6rem;align-items:center;font-size:.85rem}
@media (max-width:640px){.bar{grid-template-columns:130px 1fr 70px}}
.bar .track{height:10px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.report{display:grid;gap:.8rem;margin-top:.7rem}
.rep{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;background:#0b1525}
.rep.good{border-left:4px solid var(--ok)} .rep.bad{border-left:4px solid var(--bad)} .rep.na{border-left:4px solid var(--skip)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#0b1525}
.stat .n{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- pause overlay ---------- */
body.paused #stage{filter:blur(14px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:#050a12cc;backdrop-filter:blur(3px);padding:1rem}
.pausepanel{max-width:520px;border:1px solid var(--acc);border-radius:16px;background:#0b1525;padding:1.2rem 1.3rem;text-align:center}

@media (max-width:600px){
  body{font-size:15px}
  .qtitle{font-size:1.05rem}
  .bigscore{font-size:2.2rem}
}

</style>
</head>

<script>
var EXAM = {"keyword": "Security Steering Committee", "severity": "MEDIUM", "sevClass": "medium", "passScore": 70, "minutes": 40, "intro_blurb": "Intermediate level. Each exercise mixes two ideas: a standard and a record, a metric and a decision, an incident and an escalation. Distractors are plausible, so read the artefact carefully.", "sev_text": "MEDIUM - Intermediate. Most exercises need two steps: first read the artefact correctly, then apply a governance rule. The wrong answers are close to the right one and often contain a true statement used in the wrong place. A careful student who studied the explanation above can pass this file.", "topicId": "security-steering-committee", "batch": 2, "difficulty": "medium", "questionCount": 13, "estimatedMinutes": 40};
var EXERCISES = [{"id": "MED-03", "type": "classify", "theme": "Compliance, Audit & Standards", "title": "Map the agenda to the NIST CSF 2.0 Govern function", "brief": "Board paper · “Govern” mapping for the annual report", "scenario": "<p>The company reports its security programme against the NIST Cybersecurity Framework 2.0. The Govern function has six categories, and the auditor wants every agenda item labelled. You must show where each item belongs. The annual report is due to the board on 5 October, and the external auditor will reconcile your labels with the meeting minutes.</p>", "artefacts": [{"label": "ARTEFACT 1 — mapping method note (annual report extract)", "kind": "doc", "title": "board-paper-GOV-mapping.docx", "meta": "annual report · section 4.2 · draft v3", "lines": ["## Section 4.2 - how the mapping was made", "Each agenda item carries one Govern category label only.", "The auditor samples five items per quarter and checks the label against the minutes.", "Deadline: draft to the audit committee on 30 September."]}], "prompt": "Drag each agenda item into the correct Govern category.", "buckets": ["GV.OC — organisational context", "GV.RM — risk management strategy", "GV.RR — roles, responsibilities, authorities", "GV.PO — policy", "GV.OV — oversight", "GV.SC — supply chain risk management"], "items": [{"text": "The strategy must support the new online shop that the business plans for next year", "bucket": "GV.OC — organisational context"}, {"text": "The committee sets the limit: no more than four hours of downtime for the payment service", "bucket": "GV.RM — risk management strategy"}, {"text": "The charter states that the CISO owns the programme and the CFO owns the cyber insurance decision", "bucket": "GV.RR — roles, responsibilities, authorities"}, {"text": "The committee approves the new access control policy", "bucket": "GV.PO — policy"}, {"text": "The committee reviews the KRI dashboard every quarter and questions the two red indicators", "bucket": "GV.OV — oversight"}, {"text": "The committee approves the new rule for checking suppliers before they receive customer data", "bucket": "GV.SC — supply chain risk management"}], "explain": "The Govern function is about direction and supervision, not about tools. GV.OC covers the mission, the stakeholders and the legal context of the company. GV.RM is the risk management strategy, which includes appetite and tolerance. GV.RR assigns roles, responsibilities and authorities. GV.PO is the set of policies. GV.OV is oversight: reviewing results and holding people accountable. GV.SC covers suppliers and partners.", "tip": "Ask one question per item: context, limits, who, rules, checking, or suppliers.", "hint": "Two categories look similar: GV.RM sets the limits, GV.OV checks whether the limits are respected."}, {"id": "MED-04", "type": "fill", "theme": "Enterprise Risk Management", "title": "Write the risk acceptance memo", "brief": "Memo to the committee · RISK-311 · legacy reporting server", "scenario": "<p>The committee will decide on RISK-311 next week. You must complete the memo with the four words that make it auditable. The risk owner is the head of Group Reporting, and she needs the draft before the pack is locked. The internal auditor keeps every acceptance memo in the audit file, so the wording matters.</p>", "artefacts": [{"label": "ARTEFACT 1 — memo request from the committee secretary (committee mailbox)", "kind": "email", "title": "email-RISK-311-memo-request.eml", "meta": "committee mailbox · 6 October 2025 08:12", "lines": ["Subject: RISK-311 memo for the 14 October committee", "The memo must be in the pack 48 hours before the meeting.", "Use the standard template and attach the risk register extract.", "The board tolerance for the reporting service is already recorded as 8."]}], "prompt": "Complete the memo.", "text": "The [[0]] risk of RISK-311 is 16. After the compensating controls are applied, the [[1]] risk falls to 9, which is still above the tolerance of 8 that the board set for the reporting service. The memo must therefore name the risk [[2]] and a review [[3]].", "blanks": ["inherent", "residual", "owner", "date"], "bank": ["residual", "owner", "inherent", "date", "budget", "auditor"], "explain": "The inherent risk is the score before the controls. The residual risk is the score that remains after the controls are applied. A risk acceptance memo is not auditable unless it names the <b>owner</b> who carries the risk. It must also name the <b>date</b> when the committee will look at the risk again. The two scores show the committee how much the controls really change. The two names show who is accountable and when the decision expires.", "tip": "Inherent = before controls. Residual = after controls. Owner = who is accountable. Date = when the decision expires.", "hint": "Two blanks are scores — one before the controls, one after. Two blanks are the accountability fields an auditor looks for."}, {"id": "MED-05", "type": "multi", "theme": "Compliance, Audit & Standards", "title": "What a valid exception must contain", "brief": "Exception request EXC-88 · access review on the legacy ERP", "scenario": "<p>An engineer asks for an exception to a policy requirement on the legacy ERP. The internal auditor will look at this record next month. The GRC platform will not add an exception to the committee agenda until the request is complete. The request sits with you because the engineer's manager is on leave until 6 October.</p>", "artefacts": [{"label": "ARTEFACT 1 — exception request from the ERP engineer (service desk)", "kind": "email", "title": "email-EXC-88-request.eml", "meta": "service desk · 22 September 2025 09:41", "lines": ["Subject: Exception request EXC-88 — access review on the legacy ERP", "The ERP cannot produce a full user list, so the quarterly review is manual.", "We need this to keep working until the replacement goes live in Q2.", "My manager agrees and can confirm it by phone if that helps."]}], "prompt": "Select every element that the exception record must contain before the committee can approve it.", "options": ["An expiry date after which the exception stops being valid.", "A written risk acceptance decision for the risk it creates.", "A link to the risk in the risk register.", "A description of the compensating control that reduces the risk.", "A verbal agreement from the team manager of the affected system.", "The wording “valid until further notice”, with no expiry date at all.", "An exemption from internal audit for the affected system and its records.", "A named owner for the exception."], "correct": [0, 1, 2, 3, 7], "explain": "A security exception is a temporary permission to work differently from the policy. To survive an audit, the record needs five things. It needs an owner, an expiry date, a written risk acceptance, a link to the risk register and a compensating control. A verbal agreement leaves no evidence behind. The phrase “valid until further notice” is a permanent policy change in disguise. An exemption from internal audit destroys the independent check the company needs.", "tip": "Every exception is a small risk acceptance: owner, expiry, decision, register link, compensating control.", "hint": "Five options are documents or dates. Three options remove evidence, remove the expiry, or remove independent checking."}, {"id": "MED-06", "type": "mcq", "theme": "Enterprise Risk Management", "title": "Who may accept a risk above appetite?", "brief": "Risk mailbox · request from the retail business unit", "scenario": "<p>A risk scored 17 (high) stays open and there is no compensating control yet. The business wants to continue and accept the risk for six months. The risk appetite statement says that risks scored 15 and above may not be accepted by a single business unit. The retail director needs an answer before the trading meeting on 15 October, and the register shows the score has been 17 for eleven weeks.</p>", "artefacts": [{"label": "ARTEFACT 1 — risk acceptance request from the retail business unit (risk mailbox)", "kind": "email", "title": "email-RISK-407-acceptance.eml", "meta": "risk mailbox · 2 October 2025 16:05", "lines": ["Subject: Request to accept RISK-407 for six months — retail business unit", "No compensating control is in place yet; the vendor fix is due in Q2.", "The unit needs the checkout service running through the peak season.", "Please confirm who signs this off, because we need an answer this week."]}], "prompt": "Who can accept this risk, and how?", "options": ["Internal audit, because it checks that all risk decisions are respected.", "The Security Steering Committee, with a documented decision and a review date.", "The business risk owner, because the business owns and understands the risk.", "The CISO alone, because security owns the risk register and the controls."], "correct": [1], "explain": "The owner of a risk is always the business, but the <b>authority to accept</b> it depends on the level of the risk. Above appetite, the decision moves up to the body that owns the appetite. That body is the committee. The decision must be documented, and it needs a review date. The CISO may score the risk and give advice. Internal audit may check the decision later. Neither of them can accept business risk.", "tip": "Owning a risk and being allowed to accept it are two different things.", "hint": "Ask who sets the appetite in the first place. The same body decides when the appetite is exceeded."}, {"id": "MED-07", "type": "terminal", "theme": "Operational Integration", "title": "Manage the exception before it expires", "brief": "Exception register · EXC-91 · 30 days to expiry", "scenario": "<p>EXC-91 for the legacy reporting server expires in 30 days. You must prepare the file for the committee: find the exceptions that expire soon, extend this one properly, and show its approval trail. The committee meets tomorrow at 09:00, and the item was added to the agenda late this afternoon. The chair wants one printed page with the expiry position, the linked risk and the person who accepted it last year.</p>", "prompt": "Type the command for each step in the terminal. The steps are listed one by one beside the terminal.", "objective": "Prepare EXC-91 so the committee can decide on it tomorrow.", "artefacts": [{"label": "ARTEFACT 1 — charter extract on exceptions (governance handbook)", "kind": "doc", "title": "charter-section-6-3-exceptions.txt", "meta": "governance handbook · section 6.3", "lines": ["## 6.3 Exceptions and renewals", "Every exception names a linked risk and an expiry date.", "The committee renews any exception that leaves risk above appetite.", "The decision is filed in the DEC-2025 series within five working days."]}, {"label": "ARTEFACT 2 — agenda note from the committee secretary (committee mailbox)", "kind": "email", "title": "email-EXC-91-agenda-note.eml", "meta": "committee mailbox · 13 August 2025 17:40", "lines": ["Subject: EXC-91 added to tomorrow's 09:00 agenda", "Internal audit will be in the room for this item.", "Please send the expiry position and the approval trail tonight."]}], "console": "grc exception register", "consoleMode": "read-write session (changes stay staged until they are approved)", "outputSample": "EXC-91 legacy reporting server | expires 2025-08-14 | owner Group Reporting | linked risk RISK-311\nEXC-91 trail: 2024-08-15 approved by SSC (DEC-2024-077) | 2025-02-20 reviewed, unchanged", "steps": [{"goal": "Find the exceptions that are about to expire, so the committee can see them in time.", "accept": ["^grc\\s+exceptions?\\s+list\\s+--expiring\\s+30d?$", "^grc\\s+exceptions?\\s+list\\s+--expiring\\s+30d?\\s+--format\\s+table$"], "out": "EXC-91 legacy reporting server | expires 2025-08-14 | owner Group Reporting | linked risk RISK-311\nEXC-84 backup tapes | expires 2025-08-29 | owner Infrastructure | linked risk RISK-219", "err": "That command does not list the exceptions that expire soon. You need the exceptions object and an expiry window, not the whole register."}, {"goal": "Stage an extension of EXC-91 to 31 December 2025 and link it to the risk it creates, so the committee can approve it tomorrow.", "accept": ["^grc\\s+exceptions?\\s+extend\\s+exc-91\\s+--until\\s+2025-12-31\\s+--risk\\s+risk-311\\s+--stage$", "^grc\\s+exceptions?\\s+extend\\s+exc-91\\s+--stage\\s+--until\\s+2025-12-31\\s+--risk\\s+risk-311$", "^grc\\s+exceptions?\\s+extend\\s+exc-91\\s+--risk\\s+risk-311\\s+--until\\s+2025-12-31\\s+--stage$"], "out": "EXC-91 staged extension to 2025-12-31 | linked risk RISK-311 | status: STAGED, not effective until the SSC approves it (risk above appetite)", "err": "That does not stage an extension. The tool needs the record, the new date, the linked risk and the option that keeps the change staged."}, {"goal": "Show the approval history of EXC-91, because the auditor wants to know who accepted it before.", "accept": ["^grc\\s+exceptions?\\s+trail\\s+exc-91$", "^grc\\s+exceptions?\\s+show\\s+exc-91\\s+--trail$"], "out": "EXC-91 trail: 2024-08-15 approved by SSC (DEC-2024-077) | 2025-02-20 reviewed, unchanged | 2025-08-14 next review due", "err": "That command does not show the approval history of one exception. Think of the word for the path a record has taken."}], "canonical": [{"cmd": "grc exceptions list --expiring 30", "parts": ["grc — the governance tool", "exceptions — the object", "list — read only, no change", "--expiring 30 — only the records that expire within 30 days"]}, {"cmd": "grc exceptions extend EXC-91 --until 2025-12-31 --risk RISK-311 --stage", "parts": ["exceptions extend — prepare a change to the expiry of one exception", "EXC-91 — the record you are working on", "--until 2025-12-31 — the new expiry date", "--risk RISK-311 — the risk the exception creates, so the two registers stay aligned", "--stage — keep the change staged: an analyst prepares it, only the committee can make it effective"]}, {"cmd": "grc exceptions trail EXC-91", "parts": ["trail — show the recorded approval history of one record, oldest first", "EXC-91 — the exception the auditor asked about"]}], "explain": "An exception is a temporary permission to work differently from the policy. It needs an expiry date, a link to the risk it creates and a recorded approval. The tool answers each goal with a different verb. <code>list</code> reads a group, <code>extend</code> prepares a change to one date, and <code>trail</code> shows the history. The <code>--stage</code> option matters. It keeps the change staged, so the record is prepared but not effective. The analyst prepares, and only the committee can make it effective, because the linked risk sits above appetite. The tool can record an exception, but it cannot accept a risk for you.", "tip": "An exception without an expiry date is a permanent policy change in disguise. And an analyst stages, never approves.", "hint": "You need the exceptions object every time, and the option that limits the output to records that are about to expire."}, {"id": "MED-08", "type": "match", "theme": "Metrics, KPIs & KRIs", "title": "Match each indicator with what it tells you", "brief": "Q2 metrics pack · definitions page", "scenario": "<p>The new business owner on the committee says the dashboard has too many numbers and she does not know what each one means. You must match every indicator with its meaning. The pack goes out on 24 July, one day before the meeting. She has asked for a one-line meaning next to each number, in plain words.</p>", "artefacts": [{"label": "ARTEFACT 1 — committee dashboard extract (metrics pack)", "kind": "table", "title": "dashboard-Q2-snapshot.csv", "meta": "metrics pack · committee dashboard", "head": ["Indicator", "Q2", "Q1", "Trend"], "rows": [["Patch SLA compliance", "94%", "91%", "up"], ["Phishing simulation failure rate", "11%", "7%", "up"], ["MTTD (mean time to detect)", "6 h", "9 h", "down"], ["Critical vulnerabilities past SLA", "18", "9", "up"]]}], "prompt": "Match each indicator with what it measures.", "pairs": [{"left": "Patch SLA compliance", "right": "The share of systems patched inside the time the policy allows"}, {"left": "MTTD (mean time to detect)", "right": "The average time from the first trace of an attack to its detection"}, {"left": "Phishing simulation failure rate", "right": "The share of employees who clicked the fake email in the last campaign"}, {"left": "Control testing pass rate", "right": "The share of tested controls that worked as designed"}, {"left": "Exception volume trend", "right": "The number of open exceptions over time, showing if temporary waivers are piling up"}, {"left": "Critical vulnerabilities past SLA", "right": "The share of serious unpatched weaknesses that stayed open too long"}], "explain": "Every number on the dashboard answers a different question. It is a mistake to call them all the same thing. A <b>KPI</b> (key performance indicator) is a performance measurement. It shows whether the work is done well. A <b>KRI</b> (key risk indicator) is a risk measurement. It shows how much exposure remains. <b>Patch SLA compliance</b>, <b>control testing pass rate</b> and <b>MTTD</b> are performance measures. <b>Phishing simulation failure rate</b>, <b>exception volume trend</b> and <b>critical vulnerabilities past SLA</b> are risk measures. A board pack needs both kinds. Performance can look good while exposure grows.", "tip": "For each number, decide: does it show work done well (KPI) or exposure growing (KRI)?", "hint": "For each number ask one question: does it show the work we did, or the exposure we still carry?"}, {"id": "MED-09", "type": "branch", "theme": "Operational Integration", "title": "Escalate a critical vulnerability the right way", "brief": "Alert VULN-2025-3391 · internet-facing VPN · public exploit available", "scenario": "<p>At 09:10 the scanner reports a critical flaw in the internet-facing VPN gateway. A working exploit is public. About 4,000 remote workers use this gateway. A change freeze is running and the next committee meeting is in 19 days.</p>", "artefacts": [{"label": "ARTEFACT 1 — vulnerability alert (vulnerability management platform)", "kind": "log", "title": "vuln-alert-VULN-2025-3391.txt", "meta": "vulnerability management platform · filter enabled", "lines": [["CRIT", "VULN-2025-3391 | CVSS 9.8 | asset: vpn-gw-01 10[.]20[.]4[.]11 (vpn[.]corp[.]example) | exploitable: YES | exploit public since 2025-09-28"], ["WARN", "Reference: hxxp://research[.]example[.]org/advisories/3391 (defanged, do not click)"], ["WARN", "Compensating option: restrict management interface to 10[.]20[.]9[.]0/28 and disable the legacy portal"], ["INFO", "4,120 active sessions | 2 administrator accounts with tokens issued in the last 30 days | internet-facing since 2021"]]}], "prompt": "Work through the decision path. Only one option at each step is defensible.", "nodes": [{"text": "<b>Decision 1.</b> What do you do in the next hour?", "options": [{"t": "Do nothing until the vendor publishes a second patch, because the first patch broke a feature last year.", "ok": false, "why": "A past incident is a reason to test and monitor closely — not a reason to stay exposed with a public exploit."}, {"t": "Start the emergency change process: isolate or patch the gateway now and inform the CISO.", "ok": true, "why": "A public exploit against an internet-facing service is an operational emergency. Emergency change procedures exist exactly for this, and the CISO must know immediately."}, {"t": "Wait for the change advisory board in five days, because a change freeze is running.", "ok": false, "why": "A change freeze never cancels an active exploitation risk. Five days leaves 4,000 users behind a known-vulnerable gateway."}]}, {"text": "<b>Decision 2.</b> How does the committee hear about this?", "options": [{"t": "Inform the committee chair now, add the item to the next meeting and send a written update in between.", "ok": true, "why": "Charters normally let the chair be informed immediately and require the item to be brought to the committee. Governance does not mean waiting for a monthly meeting when exposure is high."}, {"t": "Do nothing: the committee only deals with risks above appetite, and this is a technical issue.", "ok": false, "why": "This affects thousands of users and possibly customers. The committee must be able to decide about resources and about informing the board."}, {"t": "Send a short message in the internal chat channel so that everyone sees it.", "ok": false, "why": "A chat message is not an escalation. There is no decision, no owner and no record an auditor or regulator would accept."}]}, {"text": "<b>Decision 3.</b> The patch breaks a business feature and the permanent fix needs six weeks. What do you propose?", "options": [{"t": "Ask the committee to accept the remaining risk with a documented compensating control and an expiry date.", "ok": true, "why": "This is the correct governance route: a written decision, a compensating control, an owner and an expiry date that forces the topic back on the agenda."}, {"t": "Leave the gateway unpatched and do not document it, because the feature is business critical.", "ok": false, "why": "This is silent risk acceptance. Nobody decides, nobody records, and the company discovers the risk during an audit or an incident."}, {"t": "Turn the feature off permanently and tell the business afterwards.", "ok": false, "why": "Removing a business capability without a decision is not a security control — it is an unmanaged business impact."}]}], "explain": "This is the normal flow for an urgent item: contain first, then escalate to the chair. After that, bring the residual decision to the committee with documented options. The committee is not a monthly ceremony. The charter gives the chair the power to act between meetings and to call an extraordinary meeting.", "tip": "Order of operations: contain, inform, then decide with a document. Never let urgency turn into silent risk acceptance.", "hint": "At each step, ask what has to happen before anything else can be decided."}, {"id": "MED-10", "type": "rank", "theme": "Enterprise Risk Management", "title": "Rank the remediation list for the committee", "brief": "Quarterly remediation pack · five open items · money for two", "scenario": "<p>The committee has money for two items this quarter. Its written rule for this pack is: items with <b>high regulatory exposure</b> come first; then everything else in order of the risk score. You must rank the five items from the highest priority (top) to the lowest. The pack closes on 30 September, and the chair wants the ranking in the pre-read. The risk team has already confirmed the scores and the duties in the table.</p>", "artefacts": [{"label": "ARTEFACT 1 — quarterly remediation pack (risk team export)", "kind": "table", "title": "remediation-pack-Q3.csv", "meta": "risk team export · 25 September 2025", "head": ["Item", "Likelihood (1-5)", "Impact (1-5)", "Risk score (likelihood x impact)", "Regulatory exposure"], "rows": [["R1 Unpatched internet-facing VPN (public exploit)", "5", "5", "25", "High - notification duty if breached"], ["R2 No multi-factor authentication on admin accounts", "4", "5", "20", "Medium"], ["R3 Backups not tested for 14 months", "3", "4", "12", "High - recovery duty for customer data"], ["R4 Excessive admin rights on the finance system", "4", "3", "12", "Medium"], ["R5 Security awareness training overdue for 40 staff", "3", "3", "9", "Low"]]}], "prompt": "Drag the five items into priority order (highest priority on top).", "items": ["R1 Unpatched internet-facing VPN (public exploit)", "R3 Backups not tested for 14 months", "R2 No multi-factor authentication on admin accounts", "R4 Excessive admin rights on the finance system", "R5 Security awareness training overdue for 40 staff"], "explain": "The rule has two steps, and the first one overrides the score. High regulatory exposure comes first: R1 carries a notification duty and R3 carries a recovery duty for customer data. Only then are the rest ranked by risk score: R2 is 20, R4 is 12 and R5 is 9. The trap is a pure score ranking, which would put R2 above R3. R3 carries a legal duty, so it goes first. Reading the rule before the numbers is the whole exercise.", "tip": "Apply the rule in order: duty first, score second. Multiply likelihood by impact only when the rule asks for it.", "hint": "Do not start with the scores. Start with the rule: which two items carry a legal duty?"}, {"id": "MED-11", "type": "classify", "theme": "Governance & Oversight", "title": "Send every question to the right forum", "brief": "Governance calendar · five forums, six questions", "scenario": "<p>Business teams keep sending questions to the wrong forum and every meeting is overloaded. The committee asks you to route six questions correctly. The next steering committee meeting is on 6 November, and the chair wants an agenda with only the decisions that belong to that body. Anything sent to the wrong forum will be returned with a note.</p>", "artefacts": [{"label": "ARTEFACT 1 — forum schedule (PMO governance calendar)", "kind": "doc", "title": "governance-calendar-Q4.txt", "meta": "PMO · forum schedule · Q4 2025", "lines": ["## Forum schedule - Q4 2025", "Security Steering Committee - monthly, first Thursday.", "Change advisory board - weekly, Tuesday.", "Architecture review board - fortnightly, Wednesday.", "SOC handover - daily; audit committee - quarterly."]}], "prompt": "Drag each question into the forum that must decide it.", "buckets": ["Security Steering Committee", "Change advisory board (CAB)", "Security architecture review board", "SOC (operations)", "Audit committee"], "items": [{"text": "Approve the three-year security strategy and the investment plan", "bucket": "Security Steering Committee"}, {"text": "Accept a risk above appetite for six months", "bucket": "Security Steering Committee"}, {"text": "Approve a firewall rule change for the new online shop", "bucket": "Change advisory board (CAB)"}, {"text": "Choose the encryption standard for the new payment service", "bucket": "Security architecture review board"}, {"text": "Close a false positive alert on a workstation", "bucket": "SOC (operations)"}, {"text": "Review the external auditor's findings on financial reporting controls", "bucket": "Audit committee"}], "explain": "Every forum has a different decision right. The steering committee decides strategy, budget and risk above appetite. The CAB decides changes to production. The architecture board decides technical standards and designs. The SOC handles detection and response. The audit committee belongs to the board, and it reviews audit findings and financial reporting controls. Sending an item to the wrong forum is a governance defect. The decision comes late, comes weak, or is taken twice.", "tip": "Learn one word per forum: strategy and risk, change, design, operations, audit.", "hint": "Only two items belong to the steering committee: one about direction and money, one about risk above appetite."}, {"id": "MED-12", "type": "mcq", "theme": "Strategy, Budget & Planning", "title": "Make the funding case in business language", "brief": "Board paper · request for a privileged access management tool", "scenario": "<p>You must argue for a privileged access management tool in front of the committee. The room contains the CFO, the CIO, a business owner and the CISO. Your old slide lists technical features only, and the CFO said last time: <i>“I still do not know what this buys us.”</i> The meeting is on Thursday at 14:00 and the paper must fit on one page. The pre-read goes out to the members on Wednesday morning.</p>", "artefacts": [{"label": "ARTEFACT 1 — open audit findings on privileged access (audit tracker)", "kind": "table", "title": "audit-findings-privileged-access.csv", "meta": "internal audit tracker · September 2025", "head": ["Finding", "Systems affected", "Status"], "rows": [["Standing admin rights never reviewed", "14 servers", "open since 2023"], ["Admin actions not logged centrally", "9 servers", "open"], ["Shared administrator accounts in use", "4 systems", "open"]]}], "prompt": "Which argument is the strongest for this audience?", "options": ["It reduces the number of open audit findings on privileged access, by an amount that we still have to measure properly before we commit.", "It removes standing admin rights, the cause of our last two incidents: loss falls from EUR 900,000 to EUR 300,000 a year, for EUR 120,000.", "It supports session recording, credential vaulting and just-in-time elevation with approval workflows for admins.", "It is the market leader in the quadrant and all our competitors have already deployed it in the last two years."], "correct": [1], "explain": "Executives approve money for outcomes they can compare: risk reduced, loss avoided, cost and obligations met. The strongest argument gives the loss figures, from EUR 900,000 down to EUR 300,000 a year. It also gives the real cause of past incidents and the price of EUR 120,000. A list of product features does not answer the CFO's question. A popularity argument is not evidence. A benefit described as “an amount we still have to measure” is not a benefit yet. A business case does not remove technical detail. It translates that detail into money, obligation and risk.", "tip": "In a board paper, translate every feature into avoided loss, avoided fine, or an obligation the company must meet.", "hint": "One option contains numbers, a cause and a price. The other three describe the product, the market or an unknown quantity."}, {"id": "MED-13", "type": "rank", "theme": "Compliance, Audit & Standards", "title": "Rank the exceptions the committee must renew first", "brief": "Exception register review · four records · agenda freeze tomorrow 09:00", "scenario": "<p>Four exceptions must be reviewed at the next meeting. The committee's written rule is: first the exceptions with <b>no compensating control</b>; then the exceptions whose linked risk has a score of <b>15 or more</b>, ordered by the shortest time to expiry; then all the others, also by the shortest time to expiry. The agenda freezes tomorrow at 09:00, and the chair wants the order before then. Two of the four owners have asked to move their item down the list, and the secretary will not accept that.</p>", "artefacts": [{"label": "ARTEFACT 1 — exception register review (GRC platform export)", "kind": "table", "title": "exception-register-2025-10.csv", "meta": "GRC platform export · October 2025", "head": ["Exception", "Linked risk score (likelihood x impact)", "Expires in", "Compensating control", "Owner"], "rows": [["EXC-77 legacy CRM", "12", "12 days", "Manual approval of every change", "CRM team"], ["EXC-81 backup tapes", "16", "45 days", "Weekly restore test", "Infrastructure"], ["EXC-88 legacy ERP access review", "9", "6 days", "Monthly sample review", "Finance"], ["EXC-92 supplier portal", "18", "30 days", "None", "Procurement"]]}], "prompt": "Drag the four exceptions into review order (the one to review first on top).", "items": ["EXC-92 supplier portal", "EXC-81 backup tapes", "EXC-88 legacy ERP access review", "EXC-77 legacy CRM"], "explain": "Apply the rule in order, band by band. First band — no compensating control: EXC-92, whose score is also 18. Second band — score 15 or more with a control: EXC-81 at 16. Third band — everyone else, by the shortest time to expiry: EXC-88 in 6 days, then EXC-77 in 12 days. The first trap is sorting by the date alone. EXC-88 expires first, but the rule puts the uncontrolled exception ahead of it. The second trap is treating the risk score as the only signal. EXC-77 scores 12 and EXC-88 scores 9, but both sit in the last band, so the date decides between them.", "tip": "Apply the bands in order, and use the date only inside a band. Read the rule before you look at the numbers.", "hint": "First find the exception with no compensating control. Then split the rest by the score of 15, and only then use the dates."}, {"id": "MED-01", "type": "log", "theme": "Compliance, Audit & Standards", "title": "The management review is missing one required input", "brief": "ISMS management review MR-2025-Q1 · ISO/IEC 27001 clause 9.3.2 · ISMS = information security management system", "scenario": "<p>You are the GRC analyst who prepares the ISMS management review. The chair is the CISO, and she wants the input pack finished by Thursday 17:00. The pack is locked 48 hours before the meeting, so the members can read it in advance. The certification auditor will read this record in March, and internal audit keeps a copy of it.</p>", "artefacts": [{"label": "ARTEFACT 1 — management review input record (ISMS shared drive)", "kind": "log", "title": "MR-2025-Q1-input-record.txt", "meta": "ISMS shared drive · filter enabled", "lines": [["INFO", "MR-2025-Q1 input record | ISO/IEC 27001:2022 clause 9.3.2 | chair: CISO"], ["INFO", "Input a - actions from previous reviews: 7 of 8 closed, ACT-90 open (due 2025-04-30)"], ["INFO", "Input b - changes in external and internal issues: new data protection law; two cloud regions; service desk outsourced"], ["INFO", "Input c - changes in needs and expectations of interested parties: two customers require an annual security questionnaire; new regulator guidance"], ["INFO", "Input d - performance feedback with trends: 9 of 11 indicators green, 2 amber; audit A-2025-02 closed with one minor nonconformity"], ["INFO", "Input f - risk assessment and treatment status: register v12, 11 of 14 treatments on track, 3 delayed"], ["INFO", "Input g - opportunities for continual improvement: 5 suggestions received, 3 accepted"], ["WARN", "Note: resource needs were discussed and recorded as a decision of the review, not as an input."], ["WARN", "Secretary note: the customer survey and the regulator letter were discussed after the meeting, not recorded here."]]}], "prompt": "Which input that ISO/IEC 27001:2022 clause 9.3.2 requires is missing from this record?", "options": ["Feedback from interested parties, for example the customer survey and the regulator letter.", "The results of both the internal and the external audits of the information security management system.", "The status of the corrective actions that came out of the previous management reviews.", "The adequacy of the people, the tools and the budget allocated to the security team."], "correct": [0], "explain": "Clause 9.3.2 lists the inputs that the review must receive. This record holds the status of earlier actions, changes in internal and external issues, and changes in what interested parties expect. It also holds performance feedback with trends, including the audit results. The risk assessment and the improvement opportunities are there too. <b>Feedback from interested parties</b> is missing. The customer survey and the regulator letter were discussed, but the note says nobody recorded them. So the record is incomplete for the auditor. Two traps: resource needs are a <b>decision that comes out of</b> the review, not an input to it. Also, a talk after the meeting does not fill an input.", "tip": "Learn the clause 9.3.2 input list, then match each recorded line to one label. An input that was discussed but not recorded does not exist for the auditor.", "hint": "Read the header first: it names the clause and the version. Then tick off every label of that clause list, one by one."}, {"id": "MED-02", "type": "order", "theme": "Strategy, Budget & Planning", "title": "Build the yearly security strategy approval flow", "brief": "Programme cycle 2026 · you own the governance calendar", "scenario": "<p>The CISO asks you to write the governance calendar that turns business needs into an approved security strategy. The committee meets on 12 November, and the board paper is due ten working days before that date. Last year the calendar was published late and two planning cycles slipped. Your draft must follow the yearly cycle the charter sets for the programme.</p>", "artefacts": [{"label": "ARTEFACT 1 — email from the committee secretary (committee mailbox)", "kind": "email", "title": "email-2025-10-14-calendar.eml", "meta": "committee mailbox · request · 14 October 2025 08:12", "lines": ["Subject: Governance calendar 2026 — draft needed by 24 October", "The board paper goes out ten working days before the 12 November meeting.", "Please circulate the draft flow to the CISO and the CFO first.", "The charter asks for the same yearly cycle as last year, with costs and named owners."]}], "prompt": "Put the seven steps in the correct order (first step on top).", "items": ["Collect the business drivers: new markets, new products and regulatory changes for next year.", "Assess the current risk posture: top risks, control gaps and open audit findings.", "Draft the strategy and the roadmap with costs, owners and target dates.", "Prepare the business case: cost, benefit and the risk reduced by each initiative.", "The committee reviews, challenges and approves the strategy and its budget.", "Communicate the approved strategy to all teams and add it to team objectives.", "Track progress every quarter against the KPIs and re-plan when a KRI turns red."], "explain": "Strategy work starts with the business, not with technology. That alignment with the business drivers is the first step. You collect the drivers first, then the current risk picture, then the plan. Next comes the money argument, then the approval, then communication, and tracking last. If you write the roadmap before the drivers, the plan will not survive the first question in the meeting.", "tip": "Business first, risk second, plan third, money fourth, approval fifth, communication sixth, tracking last.", "hint": "The first step is not about security tools. It is about what the business wants to do next year."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Security Steering Committee</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Intermediate level. Each exercise mixes two ideas: a standard and a record, a metric and a decision, an incident and an escalation. Distractors are plausible, so read the artefact carefully.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev medium\">MEDIUM</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">70% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">40 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">13 exercises · 130 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Meet the Security Steering Committee</h2>\n  <p class=\"sub\">The keyword you are about to master, explained in plain words: short sentences, common words, no jargon.</p>\n  <p>A <b>Security Steering Committee</b> (we shorten it to <b>SSC</b>) is a small group of senior\n  leaders who meet to make decisions about security. They do not fix servers and they do not watch\n  alerts. They decide three big things: <b>how much risk the company accepts</b>, <b>which security\n  projects get money</b>, and <b>which security rules become official</b>.</p>\n  <p>Imagine you are a new analyst. One day your manager asks you to write a one-page paper about a\n  risk that nobody wants to own. That paper goes to the SSC. In the meeting, leaders ask questions,\n  then they decide. Your paper is the input; their decision is the output. This is how security work\n  gets priority, budget and owners.</p>\n\n  <h3>Who sits at the table?</h3>\n  <ul class=\"tight\">\n    <li><b>The CISO</b> (Chief Information Security Officer) — the senior leader for security.</li>\n    <li><b>The CIO</b> (information technology) and often the <b>CFO</b> (money).</li>\n    <li><b>A risk leader</b> (chief risk officer) and <b>a legal adviser</b> (general counsel).</li>\n    <li><b>Business leaders</b> who own the systems and the data.</li>\n    <li><b>Internal audit</b> usually attends as an observer, because it must stay independent.</li>\n    <li><b>Experts</b> such as a SOC lead or a penetration tester are invited to explain a topic.</li>\n  </ul>\n\n  <h3>What happens in a normal month?</h3>\n  <ul class=\"tight\">\n    <li>It reads a report about the <b>top risks</b> (the risk register) and checks who owns each risk.</li>\n    <li>It looks at <b>numbers</b> called KPIs and KRIs — simple measurements that show if security is getting\n    better or worse (for example: how fast patches are installed, or how many people click a fake email).</li>\n    <li>It <b>approves policies and standards</b>, and the security budget and roadmap.</li>\n    <li>It signs off when a business wants to keep a known risk. This is called <b>risk acceptance</b>.</li>\n    <li>It writes every decision in the <b>minutes</b> (the official record), with an owner and a due date.</li>\n  </ul>\n\n  <h3>Where you will meet this keyword at work</h3>\n  <ul class=\"tight\">\n    <li><b>SOC and incident response:</b> when a major incident happens, the committee is informed. It decides\n    about money, priority, and what the board must be told. Small alerts never reach it.</li>\n    <li><b>Risk and GRC analysts:</b> they prepare the risk register, the risk appetite statement, the exception\n    requests, the KPI/KRI dashboard and the board pack.</li>\n    <li><b>Compliance and audit:</b> the committee approves policies, reviews audit findings and holds the\n    <b>management review</b> that standards such as ISO/IEC 27001 clause 9.3 require from top management.\n    It is where leaders show that they take responsibility.</li>\n    <li><b>Engineering and cloud teams:</b> architects bring design decisions that need money or that change the\n    level of risk, for example moving a service to a new cloud provider.</li>\n    <li><b>Red team and penetration testers:</b> their technical report stays with the engineers, but the\n    important findings and the fixes are summarised for the committee.</li>\n    <li><b>Legal, privacy and regulators:</b> the committee approves how the company answers regulators and\n    customers, for example after a data breach.</li>\n  </ul>\n\n  <h3>The documents you will handle</h3>\n  <p>The <b>charter</b> (also called terms of reference: it says why the committee exists, who is on it and\n  what it may decide), the <b>agenda</b>, the <b>minutes</b>, the <b>action log</b>, the <b>risk register</b>,\n  the <b>exception register</b>, the <b>KPI/KRI dashboard</b> and the <b>board report</b>.</p>\n\n  <h3>The tools you will use</h3>\n  <p>You will work in a <b>GRC platform</b> (governance, risk and compliance software that stores risks,\n  exceptions and decisions), in the <b>ticketing tool</b> (for example ServiceNow or Jira), in the\n  <b>dashboard</b> that shows the KPIs and KRIs, in the <b>shared drive</b> that holds the charters and the\n  minutes, and in <b>spreadsheets</b> for the board pack. Nothing exotic: the committee lives on documents,\n  numbers and records.</p>\n\n  <h3>The risks it exists to control</h3>\n  <p>Risk that nobody owns, risk that is hidden because nobody reports it, money spent on the wrong things,\n  rules that are broken, fines from regulators, and slow decisions that leave the company exposed\n  for a long time.</p>\n\n  <p class=\"muted\">In one sentence: security work needs one place where business leaders and security leaders\n  decide together. That place is the Security Steering Committee.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">Four rules, one severity level, no surprises. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b>, the exercise is correct only if every decision was right on the first try.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>70%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>40 minutes</b>.</li>\n        <li>The countdown, the live score, the hint and the skip button are always visible in the header at the top.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n        \n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Branching decision scenario — each choice unlocks the next step</li><li>Drag each card into the correct box</li><li>Drag the items to rank them by priority</li><li>Drag the steps into the right order</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log or document analysis with a coloured viewer and a filter box</li><li>Match each item to the right answer</li><li>Multi-select question — several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Every exercise uses the same three blocks, in the same order: <b>SCENARIO</b> (blue),\n      <b>QUESTION</b> (amber) and <b>YOUR ANSWER</b> (green), with the feedback block below them. Long scenarios can be\n      collapsed with <b>Hide scenario</b>. Some exercises ask you to drag cards — with a mouse, or on a tablet by\n      selecting a card and then selecting the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>artefact</b> — the file, log, meeting record or dashboard shown inside the exercise.</li>\n        <li><b>distractor</b> — a wrong answer that looks reasonable. It tests real understanding.</li>\n        <li><b>near-miss answer</b> — a wrong answer that is almost right, usually a true statement used in the wrong place.</li>\n        <li><b>time-boxed</b> — limited to a fixed period, with an end date.</li>\n        <li><b>concentration risk</b> — depending too much on one supplier, one system or one person.</li>\n        <li><b>ISMS</b> — information security management system: the rules, roles and records that manage security.</li>\n        <li><b>ITGC</b> — IT general controls: the basic access, change and operations controls that financial reporting depends on.</li>\n        <li><b>SOX</b> — the US law on financial reporting controls. <b>PCI DSS</b> — the card payment security standard.\n            <b>SOC 2</b> — an independent report on a provider's controls.</li>\n        <li><b>DORA and NIS2</b> — EU rules for the financial sector and for essential services. Both put duties on the management body.</li>\n        <li><b>KPI and KRI</b> — performance and risk measurements. <b>SIEM</b> — the platform that collects and relates security logs.</li>\n        <li><b>DPIA / transfer impact assessment</b> — checks required before using personal data in a risky or foreign context.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev medium\">MEDIUM</span>\n      </p>\n      <p class=\"muted small\">MEDIUM - Intermediate. Most exercises need two steps: first read the artefact correctly, then apply a governance rule. The wrong answers are close to the right one and often contain a true statement used in the wrong place. A careful student who studied the explanation above can pass this file.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests</h4><p class=\"muted small\">The complete concept map of the keyword <b>Security Steering Committee</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Governance & Oversight</h4><div class=\"tags\"><span class=\"tag\">security governance</span><span class=\"tag\">charter / terms of reference</span><span class=\"tag\">meeting cadence</span><span class=\"tag\">quorum</span><span class=\"tag\">minutes as the official record</span><span class=\"tag\">action log</span><span class=\"tag\">decision log</span><span class=\"tag\">escalation path</span><span class=\"tag\">delegation of authority</span><span class=\"tag\">committee chair and secretary</span><span class=\"tag\">voting member and invited expert (no vote)</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Strategy, Budget & Planning</h4><div class=\"tags\"><span class=\"tag\">security strategy</span><span class=\"tag\">security roadmap</span><span class=\"tag\">security programme budget</span><span class=\"tag\">funding and resource decisions</span><span class=\"tag\">business case</span><span class=\"tag\">cost, avoided loss and benefit</span><span class=\"tag\">security architecture review board</span><span class=\"tag\">alignment with business drivers</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Enterprise Risk Management</h4><div class=\"tags\"><span class=\"tag\">risk register</span><span class=\"tag\">risk appetite</span><span class=\"tag\">risk tolerance</span><span class=\"tag\">risk treatment (mitigate, transfer, avoid, accept)</span><span class=\"tag\">inherent risk and residual risk</span><span class=\"tag\">risk score (likelihood x impact)</span><span class=\"tag\">risk owner</span><span class=\"tag\">risk acceptance request</span><span class=\"tag\">acceptance expiry and review date</span><span class=\"tag\">compensating controls</span><span class=\"tag\">supplier and concentration risk</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Metrics, KPIs & KRIs</h4><div class=\"tags\"><span class=\"tag\">KPI (key performance indicator)</span><span class=\"tag\">KRI (key risk indicator)</span><span class=\"tag\">MTTD (mean time to detect)</span><span class=\"tag\">patch SLA compliance</span><span class=\"tag\">phishing simulation failure rate</span><span class=\"tag\">control testing pass rate</span><span class=\"tag\">exception volume</span><span class=\"tag\">trend reporting</span><span class=\"tag\">red / amber / green thresholds</span><span class=\"tag\">board reporting pack</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Compliance, Audit & Standards</h4><div class=\"tags\"><span class=\"tag\">ISO/IEC 27001 clause 9.3 (management review)</span><span class=\"tag\">NIST CSF 2.0 Govern function (GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC)</span><span class=\"tag\">PCI DSS requirement 12.4</span><span class=\"tag\">SOC 2 CC1.2 (control environment)</span><span class=\"tag\">SOX ITGC and material weakness</span><span class=\"tag\">GDPR accountability and 72-hour breach notification</span><span class=\"tag\">DORA (management body responsibility for ICT risk)</span><span class=\"tag\">NIS2 (management body approval and accountability)</span><span class=\"tag\">internal audit and audit committee</span><span class=\"tag\">nonconformity and observation</span><span class=\"tag\">management response</span><span class=\"tag\">remediation limits and tracking</span><span class=\"tag\">evidence and record retention</span><span class=\"tag\">exception register</span><span class=\"tag\">policy approval and review cycle</span></div></div><div class=\"theme\"><h4>Roles & Stakeholders</h4><div class=\"tags\"><span class=\"tag\">CISO</span><span class=\"tag\">CIO</span><span class=\"tag\">CFO</span><span class=\"tag\">CRO (chief risk officer)</span><span class=\"tag\">legal counsel</span><span class=\"tag\">DPO / privacy officer</span><span class=\"tag\">internal audit observer</span><span class=\"tag\">business risk owner</span><span class=\"tag\">service owner</span><span class=\"tag\">invited expert with no vote</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Operational Integration</h4><div class=\"tags\"><span class=\"tag\">major incident escalation to the committee</span><span class=\"tag\">crisis management (incident bridge)</span><span class=\"tag\">post-incident review</span><span class=\"tag\">change advisory board (CAB) interface</span><span class=\"tag\">security exception and waiver</span><span class=\"tag\">project security gates</span><span class=\"tag\">vendor onboarding approval</span><span class=\"tag\">M&A due diligence</span><span class=\"tag\">cloud migration governance</span><span class=\"tag\">security awareness programme approval</span></div></div><div class=\"theme\"><h4>Assurance & Continuous Improvement</h4><div class=\"tags\"><span class=\"tag\">management review inputs and outputs</span><span class=\"tag\">internal audit programme</span><span class=\"tag\">supplier audit reports (SOC 2) and penetration tests</span><span class=\"tag\">control design and operating effectiveness</span><span class=\"tag\">continual improvement</span><span class=\"tag\">regulatory notification duty</span><span class=\"tag\">governance failures (no quorum, no minutes, silent risk acceptance)</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit — defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> — written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise — including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Security Steering Committee - standalone certification exam engine
   Vanilla JS. No libraries, no external requests.
   Layout contract: every exercise renders SCENARIO / QUESTION / YOUR ANSWER
   as three labelled blocks, with the feedback block below them.
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false,
         scenCollapsed:{}, reported:false, reviewing:false, focusTarget:null};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g, ''); }
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function flash(msg){
  var f = $('#flashBox');
  if(!f){ return; }
  f.textContent = msg;
  f.style.display='block';
}
function scrollTop(){ try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._exLeft = x.timeLimit || 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'grc-suite 4.2 - governance console')+' - session started</div>',
              '<div class="to">Type the command for the current step, then press Enter. Nothing is executed for real.</div>'];
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.scenCollapsed = {};
  S.reported = false;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
  updateExTimer();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
  exTick();
}
function exTick(){
  if(S.paused || S.done || !S.started){ return; }
  /* the time box of every open time-boxed exercise runs, even if the student
     navigates to another exercise in the meantime */
  S.pool.forEach(function(x){
    if(!x.timeLimit){ return; }
    var r = S.res[x.id];
    if(r && (r.status !== 'skipped' || r.timedout)){ return; }
    if(x._exLeft <= 0){ return; }
    x._exLeft--;
    if(x._exLeft <= 0){ expireExercise(x); }
  });
  updateExTimer();
}
function updateExTimer(){
  var el = $('#exTimer');
  if(!el){ return; }
  var x = S.pool[S.idx];
  if(!x || !x.timeLimit){ return; }
  el.textContent = '⏱ ' + fmt(x._exLeft) + ' left for this exercise';
  el.className = 'exTimer' + (x._exLeft <= 60 ? ' low' : '');
}
function expireExercise(x){
  S.res[x.id] = {status:'skipped', earned:0, given:null, hints:S.hints[x.id]||0, timedout:true};
  if(S.skipped.indexOf(x.id) < 0){ S.skipped.push(x.id); }
  if(S.pool[S.idx] === x){
    renderExam();
    flash('⏱ The time box for this exercise is over. It is closed now and excluded from the score.');
  } else {
    updateHUD();
  }
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.setAttribute('role','dialog');
    ov.setAttribute('aria-modal','true');
    ov.setAttribute('aria-label','Timer paused');
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">Both the exam countdown and the time box of a single exercise are stopped.</p>'+
      '<button class="btn primary" id="resumeBtn" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
    var stg = $('#stage');
    if(stg){
      stg.setAttribute('aria-hidden','true');
      try{ stg.inert = true; }catch(e){}
    }
    var rb = $('#resumeBtn');
    if(rb && rb.focus){ try{ rb.focus(); }catch(e){} }
  } else {
    ov.style.display = 'none';
    ov.removeAttribute('aria-modal');
    var stg2 = $('#stage');
    if(stg2){
      stg2.removeAttribute('aria-hidden');
      try{ stg2.inert = false; }catch(e){}
    }
  }
  updateHUD();
  updateExTimer();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill2 = sc.parentNode;
      if(pill2 && pill2.classList){
        pill2.classList.remove('bump');
        void pill2.offsetWidth;
        pill2.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg');
  if(pr){
    pr.style.width = pct + '%';
    pr.setAttribute('aria-valuenow', String(pct));
  }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn');
  if(pb){
    pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause';
    pb.disabled = S.done || !S.started;
  }
  var cn = $('#hudCount');
  if(cn){
    cn.textContent = S.done ? 'Results and detailed report'
                    : S.reviewing ? 'Review skipped exercises'
                    : (S.started && S.pool.length) ? ('Exercise ' + (S.idx+1) + ' of ' + S.pool.length)
                    : 'Exam briefing';
  }
  var x = S.pool[S.idx];
  var r = x ? S.res[x.id] : null;
  var locked = !S.started || S.done || S.reviewing || !x || (r && (r.status !== 'skipped' || r.timedout));
  var ht = $('#hintTop');
  if(ht){
    var used = x && S.hints[x.id];
    ht.disabled = !!locked || !!used;
    ht.textContent = used ? '💡 Hint used' : '💡 Hint −10%';
  }
  var stp = $('#skipTop');
  if(stp){ stp.disabled = !!locked; }
}

/* --------------------------- layout: artefacts ------------------------- */
function artefactBody(a){
  var h = '';
  if(a.kind==='log'){
    h += '<input class="logfilter" aria-label="Filter the log lines" placeholder="filter lines (like Kibana / Splunk) ..." oninput="filterLog(this)" />';
    h += '<div class="logbox">';
    (a.lines||[]).forEach(function(ln){
      var lv = ln[0]||'', txt = ln[1]||'';
      h += '<div class="logline lvline-'+esc(lv)+'" data-t="'+esc((lv+' '+txt).toLowerCase())+'">';
      if(lv){ h += '<span class="lv lv-'+esc(lv)+'">'+esc(lv)+'</span>'; }
      h += esc(txt)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='table'){
    h += '<input class="logfilter" aria-label="Filter the table rows" placeholder="filter rows (like a governance dashboard) ..." oninput="filterRows(this)" />';
    h += '<table class="art"><thead><tr>';
    (a.head||[]).forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    (a.rows||[]).forEach(function(r){
      h += '<tr data-t="'+esc(r.join(' ').toLowerCase())+'">';
      r.forEach(function(c){ h += '<td>'+esc(c)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table>';
  } else if(a.kind==='email'){
    h += '<div class="emailbody">';
    (a.lines||[]).forEach(function(ln,i){
      h += '<div class="'+(i===0?'subj':'')+'">'+esc(ln)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='doc' || a.kind==='minutes' || a.kind==='config'){
    h += '<div class="docbody">';
    (a.lines||[]).forEach(function(ln){
      var cls = (String(ln).indexOf('##')===0) ? 'h' : '';
      h += '<div class="'+cls+'">'+esc(String(ln).replace(/^##\s*/,''))+'</div>';
    });
    h += '</div>';
  } else {
    (a.lines||[]).forEach(function(ln){ h += '<div class="logline">'+esc(ln)+'</div>'; });
  }
  return h;
}
function artefactList(x){
  if(x.artefacts && x.artefacts.length){ return x.artefacts; }
  if(x.artifact){ return [x.artifact]; }
  return [];
}
function artefactsHTML(x){
  var list = artefactList(x);
  var h = '';
  list.forEach(function(a, i){
    var label = a.label || ('ARTEFACT ' + (i+1) + ' — ' + (a.title || a.kind || 'evidence'));
    h += '<div class="artpanel" role="group" aria-label="'+esc(label)+'">';
    h += '<div class="alabel">'+esc(label)+'</div>';
    h += '<div class="abody">'+artefactBody(a)+'</div>';
    h += '</div>';
  });
  return h;
}
function filterLog(inp){
  var q = inp.value.toLowerCase().trim();
  var box = inp.parentNode.querySelector('.logbox') || inp.parentNode;
  $$('.logline', box).forEach(function(el){
    var hit = !q || (el.getAttribute('data-t')||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
}
function filterRows(inp){
  var q = inp.value.toLowerCase().trim();
  var table = inp.parentNode.querySelector('table.art');
  if(!table){ return; }
  $$('tbody tr', table).forEach(function(tr){
    var hit = !q || (tr.getAttribute('data-t')||'').indexOf(q) >= 0;
    tr.style.display = hit ? '' : 'none';
  });
}

/* ------------------------------ layout blocks -------------------------- */
function sevPill(){
  return '<span class="sev '+EXAM.sevClass+'">'+esc(EXAM.severity)+'</span>';
}
function blockHead(cls, icon, label, right){
  return '<div class="bhead '+cls+'"><span class="bhl"><span class="ic" aria-hidden="true">'+icon+'</span> '+label+'</span>'+
         (right || '') + '</div>';
}
function scenarioBlock(x){
  var collapsed = !!S.scenCollapsed[x.id];
  var summary = esc(x.brief || x.title);
  var h = '<section class="block scenario'+(collapsed?' collapsed':'')+'" id="scen-'+esc(x.id)+'" aria-label="Scenario">';
  h += blockHead('blue', '▤', 'SCENARIO',
        '<button type="button" class="collapsebtn" aria-expanded="'+(collapsed?'false':'true')+'" '+
        'onclick="toggleScenario(\''+esc(x.id)+'\')">'+(collapsed?'Show scenario':'Hide scenario')+'</button>');
  h += '<div class="bbody">';
  if(x.brief){ h += '<div class="brief">'+esc(x.brief)+'</div>'; }
  if(x.scenario){ h += '<div class="scenario">'+x.scenario+'</div>'; }
  if(x.objective){ h += '<div class="objline"><b>Objective:</b> '+esc(x.objective)+'</div>'; }
  h += artefactsHTML(x);
  if(x.timeLimit){
    h += '<div class="timelimitNote">⏱ <b>Time-boxed exercise:</b> this exercise has its own '+
