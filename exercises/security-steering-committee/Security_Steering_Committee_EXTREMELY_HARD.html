<script>
var EXAM = {"keyword": "Security Steering Committee", "severity": "EXTREMELY HARD", "sevClass": "xhard", "passScore": 70, "minutes": 75, "intro_blurb": "Expert level. Long or ambiguous scenarios, several clocks running at the same time, chain reasoning across standards, and answers that look almost right. This mirrors a senior analyst, senior incident responder or senior governance engineer decision.", "sev_text": "EXTREMELY HARD - Expert. Several exercises chain three or four concepts and give you signals that pull in different directions. You will meet a legal deadline against a production stop, an audit opinion against a failing metric, and a delegation matrix that changes when a control fails. The pass mark of 70% is the site default; the difficulty comes from the reasoning, not from the threshold.", "topicId": "security-steering-committee", "batch": 4, "difficulty": "extremely-hard", "questionCount": 13, "estimatedMinutes": 75};
var EXERCISES = [{"id": "XH-10", "type": "mcq", "theme": "Governance & Oversight", "title": "Three failures at once — what do you fix first?", "brief": "Internal audit GI-2025-04 · committee effectiveness review", "scenario": "<p>The review found three failures in one committee: (1) the chair cancelled three of four meetings and decisions were taken by email without a quorum; (2) two accepted risks have no owner and no review date; (3) the minutes for the last two meetings were never written. The regulator has now asked the company to prove that each risk acceptance was validly decided.</p>", "artefacts": [{"label": "ARTEFACT 1 — internal audit findings list", "kind": "table", "title": "GI-2025-04-findings.csv", "meta": "internal audit committee effectiveness review", "head": ["Ref", "Finding", "Evidence"], "rows": [["F-1", "Three of four scheduled meetings were cancelled or lacked a quorum", "meeting register"], ["F-2", "Decisions were taken by email without a quorum", "mailbox review"], ["F-3", "Two accepted risks have no owner", "risk register extract"], ["F-4", "Two accepted risks have no review date", "risk register extract"], ["F-5", "Minutes for the last two meetings were never written", "secretariat file"], ["F-6", "The committee room booking system was replaced in March", "facilities note"]]}, {"label": "ARTEFACT 2 — committee meeting register", "kind": "table", "title": "committee-meeting-register-2025.csv", "meta": "company secretariat register", "head": ["Meeting", "Date", "Members present", "Quorum required", "Decision recorded"], "rows": [["M1", "2025-02-11", "6", "5", "Minutes approved"], ["M2", "2025-04-08", "3", "5", "Four decisions recorded as approved by email"], ["M3", "2025-06-10", "Cancelled", "5", "Two decisions recorded as approved by email"], ["M4", "2025-09-09", "Not recorded", "5", "No minutes produced"]]}, {"label": "ARTEFACT 3 — mailbox thread on approval by email", "kind": "email", "title": "budget-approval-by-email.txt", "meta": "committee chair mailbox", "lines": ["RE: budget approval and risk decision - decision by email", "From: committee chair", "To: committee distribution list", "We are short of a quorum today, so please reply with your approval by email.", "I will record the four items as approved unless I hear an objection by 17:00.", "Reply from member A: fine by me.", "Reply from member B: I cannot support item 3, please record my objection.", "Housekeeping: the new meeting room access code is on the intranet page."]}, {"label": "ARTEFACT 4 — request for information from the regulator", "kind": "doc", "title": "RFI-2025-77.txt", "meta": "regulatory affairs file", "lines": ["## Request for information RFI-2025-77", "The authority asks the company to demonstrate that each risk acceptance was validly decided.", "Please provide the constitution of the body that took each decision and the quorum at the time.", "Please also provide the written record of each decision.", "Separate question: please send your complaints handling procedure.", "Response due in 14 days."]}], "prompt": "Which failure must be corrected first, and why?", "options": ["The decisions taken without a quorum, because they are challengeable and validity is tested first.", "The missing minutes, because the company cannot prove that any of the decisions was taken.", "The risks without an owner, because unowned risk grows faster than any other governance problem.", "The cancelled meetings, because a committee that never meets cannot supervise anything at all."], "correct": [0], "explain": "The regulator's request sets the priority. The company must prove that each risk acceptance was <b>validly decided</b>. A decision taken by a body without a quorum is not a valid decision. So every acceptance, budget and approval from those meetings has no basis. That cannot be repaired by writing documents later. It must be retaken by a properly constituted meeting. The missing minutes and the cancelled meetings are serious symptoms. Unowned risks are a real exposure too. But each of those can be repaired after the fact. Minutes can be reconstructed and approved. Meetings can restart. Owners can be assigned.", "tip": "Start from what the regulator (or the auditor) is actually asking you to prove, then find the failure that cannot be repaired after the fact.", "hint": "Think about what a decision needs in order to exist at all, before thinking about how it is recorded."}, {"id": "XH-11", "type": "branch", "theme": "Enterprise Risk Management", "title": "The cloud provider fails its audit 60 days before renewal", "brief": "Supplier review · CloudCore · SOC 2 report: qualified opinion", "scenario": "<p>The company's main cloud provider delivers the order platform and holds 120,000 customer records. Its new SOC 2 report has a qualified opinion on change management and access control, with no remediation timeline. The contract renews in 60 days, the exit plan has never been tested, and a regulator asked about concentration risk last quarter.</p>", "artefacts": [{"label": "ARTEFACT 1 — SOC 2 report summary for CloudCore", "kind": "doc", "title": "cloudcore-soc2-summary.txt", "meta": "assurance library, supplier report summary", "lines": ["## SOC 2 Type II report summary - CloudCore, period 2024-07-01 to 2025-06-30", "Opinion: qualified.", "Qualified areas: change management and access control.", "Reason given: the auditor could not obtain sufficient evidence that changes were approved.", "Remediation timeline: not stated in the report.", "Bridge letter: issued without a date of effect.", "## Prior report, period 2023-07-01 to 2024-06-30", "Opinion: unqualified. No exceptions noted."]}, {"label": "ARTEFACT 2 — contract terms extract", "kind": "doc", "title": "msa-cloudcore-key-terms.txt", "meta": "procurement contract file", "lines": ["## Master services agreement - key terms (extract)", "Renewal date: 60 days from today; the term then renews automatically for 24 months.", "Termination for convenience: 90 days written notice.", "Right to audit: not present in the current agreement.", "Evidence delivery duty: not present in the current agreement.", "Subcontractor disclosure: limited to a list provided at signature in 2021.", "Service credits: capped at 10% of the monthly fee."]}, {"label": "ARTEFACT 3 — supplier register row for CloudCore", "kind": "table", "title": "critical-supplier-register-cloudcore.csv", "meta": "supplier risk register", "head": ["Item", "Value", "Source", "Note"], "rows": [["Criticality", "Critical", "business impact analysis 2024", "The order platform cannot be served without it"], ["Customer records held", "120,000", "data inventory", "Order and delivery data"], ["Exit plan", "Written in 2022", "resilience team", "Test date not recorded; never tested"], ["Concentration", "Single provider for the order platform", "risk register", "A regulator asked about this last quarter"], ["Named owner for the supplier relationship", "Not recorded", "procurement", "Vacant since the previous owner left in July"], ["Insurance certificate", "Expires 2026-03-31", "procurement", "Routine renewal, no security finding"]]}, {"label": "ARTEFACT 4 — mailbox item from regulatory affairs", "kind": "email", "title": "regulator-concentration-question.txt", "meta": "regulatory affairs mailbox", "lines": ["RE: CloudCore qualification - question from the regulator", "From: head of regulatory affairs", "To: group CISO", "The regulator asked how concentration risk is governed, not how the provider is certified.", "The question sits in their outsourcing and operational resilience section.", "The answer is due in the quarterly meeting pack, in the sections they have specified.", "Separate matter: the card scheme fee review is due next month.", "Please send your draft before the quarterly meeting."]}], "prompt": "Work through the decision path. Only one option at each step survives the constraints.", "nodes": [{"text": "<b>Decision 1.</b> What does the committee do with 60 days on the clock?", "options": [{"t": "Terminate the contract at renewal and migrate the whole platform to another provider within 60 days.", "ok": false, "why": "A forced migration of the order platform in 60 days creates a bigger availability and data risk than the qualified opinion."}, {"t": "Do nothing for now: the provider is certified, and the auditor's qualification is only about its internal process.", "ok": false, "why": "A qualified opinion means the auditor could not confirm the controls. Ignoring it is silent risk acceptance and contradicts the regulator's earlier question."}, {"t": "Keep the service running, start an urgent supplier assessment with a remediation plan and an expiry-linked exception.", "ok": true, "why": "An immediate exit is not realistic in 60 days and would create a major outage risk. The defensible route is a documented exception with hard milestones, plus an assessment that produces evidence."}]}, {"text": "<b>Decision 2.</b> The provider refuses to share evidence and offers only a summary letter.", "options": [{"t": "Accept the summary letter instead, because the provider is far too large for us to influence at all.", "ok": false, "why": "Accepting a letter leaves the company unable to demonstrate due diligence for a critical supplier."}, {"t": "Ask the provider's account manager to send the evidence informally by email to the team.", "ok": false, "why": "Informal evidence is not auditable and may break data protection rules."}, {"t": "Make access to evidence a condition of renewal, with right-to-audit and subcontractor disclosure clauses.", "ok": true, "why": "Contractual levers are the practical control here: the right to audit, evidence delivery duties and subcontractor transparency are exactly what regulators expect for critical providers."}]}, {"text": "<b>Decision 3.</b> The business unit proposes to accept the risk for 12 months without conditions.", "options": [{"t": "Grant a 6-month acceptance with compensating controls, monthly evidence and an explicit escalation trigger.", "ok": true, "why": "A time-boxed acceptance with measurable conditions keeps the decision reversible and gives the committee a hard checkpoint."}, {"t": "Grant the 12 months as proposed, because a migration would cost the business far more than the risk.", "ok": false, "why": "Twelve months without conditions hides the concentration risk for a full year and provides no checkpoint."}, {"t": "Refuse any kind of acceptance and require a full exit within 60 days, whatever the cost may be.", "ok": false, "why": "Refusing without an alternative creates an outage risk that the committee has not accepted."}]}, {"text": "<b>Decision 4.</b> The regulator asks how concentration risk is governed. What must the answer contain?", "options": [{"t": "The incident history of each provider, together with the number of open support tickets.", "ok": false, "why": "Operational history is not governance evidence for concentration risk."}, {"t": "The register of critical providers, the acceptance with its expiry, the tested exit plan and the named owners.", "ok": true, "why": "Concentration risk answers need a register, a decision, a tested exit plan and named owners — the four elements regulators check."}, {"t": "The list of the providers, their certifications, and the date of the most recent security review.", "ok": false, "why": "Certifications alone do not answer concentration: they say nothing about dependence, exit or ownership."}]}], "explain": "Concentration risk is a governance problem before it is a technical one. Nobody can replace a critical provider in 60 days. The contract also needs 90 days of notice to terminate. So the correct route is a time-boxed acceptance with compensating controls. It also needs contractual evidence duties and a tested exit plan. The regulator's question is answered with four artefacts. They are the register of critical providers, the acceptance decision with an expiry, the exit plan with a test date, and named owners. Every wrong option is a real temptation. Exit too fast, accept too long, or accept a weaker form of evidence.", "tip": "For critical suppliers remember four artefacts: register, acceptance with expiry, tested exit plan, named owners.", "hint": "For each option, ask what the committee is committing to and when it could change its mind."}, {"id": "XH-12", "type": "log", "theme": "Enterprise Risk Management", "title": "Does this KRI reopen an accepted risk?", "brief": "Risk register extract · RISK-410 accepted until 2025-12-31 · monthly check", "scenario": "<p>RISK-410 was accepted by the committee with an expiry of 31 December 2025. The acceptance was based on one assumption: the new identity platform would be live by September, so the compensating control would be needed for four months only. The committee must now decide whether the risk must be re-opened before the expiry.</p>", "artefacts": [{"label": "ARTEFACT 1 — risk decision record for RISK-410", "kind": "table", "title": "risk-record-RISK-410.csv", "meta": "risk register record export", "head": ["Field", "Value", "Note"], "rows": [["Risk id", "RISK-410", "Privileged access on the legacy order platform"], ["Decision date", "2025-02-11", "Approved with a compensating control"], ["Expiry", "2025-12-31", "A maximum period, not a fixed term"], ["Assumption recorded", "Identity platform live by September 2025", "The control was meant to be needed for four months only"], ["Review date", "Not recorded", "The field is empty in the record"], ["Risk owner", "Group Services", "The owner changed role in August 2025"], ["Charter rule", "A material change must be re-decided within 30 days", "Charter v6, section 4.7"]]}, {"label": "ARTEFACT 2 — monthly check for October 2025", "kind": "table", "title": "RISK-410-monthly-check-2025-10.csv", "meta": "risk register monthly check", "head": ["Item", "Baseline at acceptance", "Now (October)", "Note"], "rows": [["Identity platform go-live", "September 2025 (assumption)", "March 2026 (forecast)", "Vendor integration delayed twice"], ["Compensating control: manual approval for admin changes", "Operating, 100% of changes", "Operating, 94% of changes", "6% of changes rushed during two incidents"], ["KRI: unauthorised privileged changes", "Tolerance <= 2 per month", "5 in September, 4 in October", "Escalation threshold: 4 or more per month"], ["Risk owner", "Group Services", "Group Services", "Owner changed role in August; no replacement named"], ["Decision expiry", "2025-12-31", "2025-12-31", "Charter: a material change must be re-decided within 30 days"]]}, {"label": "ARTEFACT 3 — programme status note for the identity platform", "kind": "doc", "title": "identity-platform-status-october.txt", "meta": "programme management office status note", "lines": ["## Identity platform programme - status note, October 2025", "Design and build: complete.", "Vendor integration: delayed twice, now forecast for March 2026.", "Pilot with 200 users: not scheduled.", "## Related programmes (not this platform)", "Data warehouse migration: on track for November 2025.", "Workforce planning tool: go-live December 2025."]}, {"label": "ARTEFACT 4 — indicator collector log for privileged changes", "kind": "log", "title": "kri-collector-privileged-changes.log", "meta": "risk monitoring collector", "lines": [["INFO", "Run 2025-08-01: unauthorised privileged changes = value not recorded (collector offline)"], ["OK", "Run 2025-09-01: unauthorised privileged changes = 5 (escalation threshold 4)"], ["OK", "Run 2025-10-01: unauthorised privileged changes = 4"], ["INFO", "Control sample 2025-10-12: 94% of admin changes approved before execution"], ["INFO", "Indicator: antivirus agent coverage 99.2% (weekly operations report)"], ["WARN", "Collector outage on 2025-08-01 lasted three days; cause not recorded"]]}], "prompt": "What must the committee conclude?", "options": ["The risk must be re-opened now: the assumption failed and the KRI is over its threshold.", "The risk can wait until the expiry date, because the acceptance remains valid through December.", "Only the owner vacancy must be handled, because the compensating control still operates at 94%.", "The KRI is not relevant here, because it measures privileged changes and not the platform delay."], "correct": [0], "explain": "An accepted risk rests on the assumptions written into the decision. Here the main assumption has failed. The identity platform was meant to be live by September 2025, and it has moved to March 2026. The KRI has reached or passed its escalation threshold. There were 5 unauthorised privileged changes in September and 4 in October, against a threshold of 4. Also, 6% of privileged changes bypassed the compensating control during two incidents. That is exactly the situation the control was meant to prevent. On top of that, the risk has had no owner since August. Any one of these is a material change. Together they trigger the charter rule that requires a new decision within 30 days. An expiry date is a maximum, not a promise to wait. The committee must re-open the risk as soon as the basis of the decision changes.", "tip": "Compare the current facts with the assumptions recorded at acceptance. When they differ materially, re-decide immediately.", "hint": "Read the baseline column and the “now” column side by side, then check the charter line about material change."}, {"id": "XH-13", "type": "classify", "theme": "Operational Integration", "title": "The same intrusion, seen from both sides", "brief": "Twin review TR-2025-06 · order platform cluster · 02:14–02:31 · two contradicting signals", "scenario": "<p>The twin review puts the blue team and the red team in the same room. Both read the same evidence, and both are asked one question: which of these observations belongs to <b>detection</b> (what the blue team could have seen) and which belongs to <b>attacker progression</b> (what the red team would do next)?</p><p>Two signals contradict each other, and the room has to agree on which one wins. The container runtime reports that the compromised pod was killed at 02:14. The service account token from that pod was used by a different pod at 02:31. The cluster clock on one node is 90 seconds behind, which nobody can explain.</p>", "artefacts": [{"label": "ARTEFACT 1 — container runtime audit log for node-3 and node-5", "kind": "log", "title": "container-runtime-audit-0214-0232.log", "meta": "cluster container runtime audit", "lines": [["INFO", "02:13 pod orders-api-7f9c scheduled on node-3"], ["CRIT", "02:14 container orders-api-7f9c killed by the runtime; reason: policy violation"], ["INFO", "02:14 pod orders-api-7f9c removed from the node"], ["WARN", "02:15 audit collector restart on node-3; log gap until 02:29, entries not recovered"], ["INFO", "02:20 node-7 reports a reporting job configured in the wrong timezone"], ["INFO", "02:31 pod orders-sync-2b41 starts on node-5"], ["INFO", "02:31 token subject system:serviceaccount:orders:api-sa used by pod orders-sync-2b41"], ["INFO", "02:32 outbound DNS request to 10[.]244[.]1[.]53 from the cluster subnet"]]}, {"label": "ARTEFACT 2 — Kubernetes API audit extract", "kind": "table", "title": "kube-api-audit-0231.csv", "meta": "cluster API audit log", "head": ["Time", "Verb", "Subject", "Source pod", "Note"], "rows": [["02:31", "create selfsubjectaccessreview", "system:serviceaccount:orders:api-sa", "orders-sync-2b41", "User agent not recorded"], ["02:31", "list secrets", "system:serviceaccount:orders:api-sa", "orders-sync-2b41", "Denied by policy"], ["02:32", "get nodes", "system:serviceaccount:orders:api-sa", "orders-sync-2b41", "Allowed"], ["02:18", "patch deployment", "system:serviceaccount:platform:deploy-sa", "deploy-runner-1", "Scheduled platform release, unrelated to the incident"]]}, {"label": "ARTEFACT 3 — node clock status report", "kind": "table", "title": "node-clock-status.csv", "meta": "cluster node inventory", "head": ["Node", "Clock offset", "Last sync", "Note"], "rows": [["node-3", "90 seconds behind", "2025-06-11", "Cause not recorded; owner unknown"], ["node-5", "Within 10 milliseconds", "2025-06-11", "Synchronised"], ["node-7", "Correct", "2025-06-11", "Reporting job configured in the wrong timezone (cosmetic)"]]}, {"label": "ARTEFACT 4 — twin review bridge notes", "kind": "minutes", "title": "twin-review-TR-2025-06-notes.txt", "meta": "twin review TR-2025-06 bridge notes, 02:14 to 02:45", "lines": ["## Twin review TR-2025-06 - bridge notes", "02:14 the runtime reports the compromised pod killed on node-3.", "02:16 the blue team confirms no alerts after the kill message.", "02:31 a different pod presents the same service account token.", "02:38 the red team states the credential was still usable after the kill.", "The room notes a 90-second clock difference on one node, which nobody can explain.", "Reminder: the change freeze runs until Friday."]}], "prompt": "Sort every observation onto the side of the operation it belongs to.", "buckets": ["Blue team — what you would detect", "Red team — what you would do next"], "items": [{"text": "A pod that mounts the host filesystem, seen in the container runtime audit log", "bucket": "Blue team — what you would detect"}, {"text": "The service account token of a pod used for the first time by a different pod", "bucket": "Blue team — what you would detect"}, {"text": "An outbound DNS request to an unfamiliar resolver coming from the cluster subnet", "bucket": "Blue team — what you would detect"}, {"text": "Two privileged containers starting on the same node less than a minute apart", "bucket": "Blue team — what you would detect"}, {"text": "Read the mounted token and ask the API server which permissions it carries", "bucket": "Red team — what you would do next"}, {"text": "Ask the instance metadata service for the node role credentials", "bucket": "Red team — what you would do next"}, {"text": "Schedule the next workload onto a node whose runtime is two versions behind", "bucket": "Red team — what you would do next"}, {"text": "Start a second pod to keep access after the first one is removed", "bucket": "Red team — what you would do next"}], "explain": "Every event in this list is one action seen from two sides. A pod mounting the host filesystem is a detection for the blue team. It is also a step towards escape for the red team. The token used by another pod is a detection. Reading that token to enumerate permissions is the next attacker move. The contradiction resolves in favour of the later signal. The runtime message at 02:14 proves only that <b>one container died</b>. The token use at 02:31 proves that the attacker still had a usable credential afterwards. A detection signal that describes the end of a process is weaker evidence. A later signal that shows the credential still working is stronger. The 90-second clock difference is not enough to explain a 17-minute gap. So it cannot be used to dismiss the second signal. It only tells you which node's timestamps to treat with care.", "tip": "When two signals contradict each other, ask which one proves capability and which one only proves an event happened.", "hint": "The constraint you may have missed: a kill message describes a process, not the credential. Think about what the later signal proves that the earlier one cannot."}, {"id": "XH-01", "type": "branch", "theme": "Operational Integration", "title": "Three clocks, one committee", "brief": "Major incident MI-2025-11 · 02:40 CET · group crisis bridge", "scenario": "<p>Ransomware has spread from a plant network into the group data lake. The attacker has published 4 GB of sample data on hxxp://leak[.]example[.]net/northwind (defanged, do not visit). The subsidiary CEO refuses to cut the plant network, because the production line would stop for at least 12 hours. The insurer's hotline says the policy requires written notification within 24 hours of discovery. The privacy officer confirms that personal data is in the published sample. The board meets in 30 hours. Engineering cannot yet confirm whether the attacker still has access through a backup service account.</p>", "artefacts": [{"label": "ARTEFACT 1 — crisis bridge notes for major incident MI-2025-11", "kind": "minutes", "title": "bridge-notes-MI-2025-11.txt", "meta": "group crisis bridge, audio recorded, 02:40 CET", "lines": ["## 02:40 CISO opens the bridge", "Present: group CISO office, plant IT lead, legal, privacy officer, insurer hotline on hold", "Plant network 10[.]40[.]2[.]0/24 is still reachable from the compromised segment", "Attacker access not confirmed as removed; the backup service account is still enabled", "Plant CEO states that a production stop of 12 hours is not acceptable", "## 02:52 Decisions taken on the bridge", "Containment of the group data lake segment: approved", "Containment of the plant segment: deferred pending a business decision", "## 03:05 Other business on the bridge", "Facilities report a chiller alarm in hall B; no link to the incident", "Secretary note: the firewall change ticket number for the 02:52 action was not recorded"]}, {"label": "ARTEFACT 2 — cyber insurance clause on notification", "kind": "doc", "title": "policy-GL-CY-2024-clause-7.txt", "meta": "group cyber policy GL-CY-2024, insurer wording", "lines": ["## Clause 7.3 Notification of a cyber event", "Written notification within 24 hours of discovery of the event.", "Notification may be given on the facts then known, and updated as the investigation proceeds.", "Late notification may void cover for the affected claim.", "## Clause 7.9 Extortion payment sub-limit", "The sub-limit is EUR 250,000 per event.", "## Clause 7.11 Travel and personal device cover", "Portable devices are covered only when the loss is reported to the police."]}, {"label": "ARTEFACT 3 — incident dashboard extract for MI-2025-11", "kind": "table", "title": "incident-dashboard-MI-2025-11.csv", "meta": "group incident dashboard", "head": ["Item", "Value", "Source", "Note"], "rows": [["Personal data in the published sample", "4 GB published, categories unknown", "privacy officer", "Data mapping not finished; record types not yet listed"], ["Attacker access removed", "Not confirmed", "incident response", "Backup service account still enabled"], ["Discovery time", "02:12 CET (alert) or 23:55 CET (backup log line)", "two sources disagree", "The 23:55 line has no timezone and no host name"], ["Insurance notification sent", "No", "risk office", "Draft prepared, not yet sent"], ["Regulatory notification sent", "No", "legal", "72-hour clock runs from discovery"], ["Unrelated KRI: phishing simulation click rate", "6.1%", "awareness platform", "Target 8%; no link to this incident"]]}, {"label": "ARTEFACT 4 — insurer hotline mailbox item", "kind": "email", "title": "insurer-hotline-MI-2025-11.txt", "meta": "insurer duty manager mailbox, received 02:58 CET", "lines": ["RE: MI-2025-11 - notification under group policy GL-CY-2024", "From: insurer hotline duty manager", "To: group CISO office", "The 24-hour window runs from the moment your company discovered the event.", "A first notice on known facts is accepted and can be updated as the investigation proceeds.", "Loss estimate: not recorded in this thread, to follow with the forensic report.", "Please quote the group policy number GL-CY-2024 on every communication.", "Separate matter: your 2024 claim CN-2024-1188 for a stolen laptop stays open with the adjuster."]}], "prompt": "Work through the decision path. Each option is defensible on its surface; only one holds when you check all three clocks.", "nodes": [{"text": "<b>Decision 1.</b> The plant network is still reachable from the compromised segment and the plant CEO refuses isolation.", "options": [{"t": "Isolate the plant immediately without escalation, because containment always wins over production pressure.", "ok": false, "why": "Containment is the priority, but an unmanaged production stop creates a business risk that nobody has accepted. That decision belongs above the responders."}, {"t": "Escalate to the CISO and the group CEO for an immediate decision, and propose isolation with a manual production fallback.", "ok": true, "why": "The conflict is between production and containment, so it must be decided by the level that owns both risks — not by the response team and not by one plant manager. Offering a fallback makes the decision possible in minutes."}, {"t": "Accept the plant manager's decision for now and continue the containment work on the other network segments only.", "ok": false, "why": "The attacker keeps a path into production and back into the group. A response that leaves the entry point open cannot be certified as contained."}]}, {"text": "<b>Decision 2.</b> The insurer requires written notification within 24 hours and the forensic picture is still incomplete. The plant has just been isolated; the attacker's access is not confirmed as removed.", "options": [{"t": "Let the plant's own lawyer send the notification when the plant decides, because the loss is local to it.", "ok": false, "why": "The policy is a group policy. The notification duty and the risk of losing cover sit with the group."}, {"t": "Send the insurer the written notification now with the known facts and update it as the investigation proceeds.", "ok": true, "why": "A contractual deadline can be met with known facts. Late notification can void the cover; the content can always be updated later."}, {"t": "Wait for the forensic report first, because an incomplete notification could weaken the insurance claim.", "ok": false, "why": "Missing the notification window is the bigger claim risk, and insurers expect phased reporting on live incidents."}]}, {"text": "<b>Decision 3.</b> The 72-hour privacy clock ends in 9 hours and 4 GB of personal data is already public. Legal proposes a general description; the privacy officer wants to wait for the full data mapping.", "options": [{"t": "Wait for the full data mapping, because an inaccurate notification exposes the company to claims.", "ok": false, "why": "Missing the deadline is a separate and clearer violation than an imprecise first notification."}, {"t": "Inform the regulator's call centre verbally and record it in the incident log.", "ok": false, "why": "A verbal contact is not the formal notification and does not stop the deadline."}, {"t": "Notify within the deadline with the known categories of data and people, and commit to a follow-up description.", "ok": true, "why": "The duty is to notify within 72 hours of awareness with the information then available. A documented follow-up is normal and keeps the company compliant."}]}, {"text": "<b>Decision 4.</b> The board meets in 30 hours and the committee must send one page.", "options": [{"t": "A short note saying the incident is contained, to avoid unnecessary concern until the investigation is complete.", "ok": false, "why": "Declaring containment before it is confirmed misleads the board and destroys trust when the facts change."}, {"t": "Timeline, impact, decisions taken with owners, open questions, and the two decisions needed from the board.", "ok": true, "why": "A board paper on a live incident must be decision-ready: facts, decisions already taken, unknowns stated as unknowns, and explicit asks. It also states the regulatory and insurance position."}, {"t": "A technical appendix with the indicators of compromise and the containment commands, so the board understands the attack.", "ok": false, "why": "Technical detail is not what the board decides on. It hides the asks and the uncertainties."}]}], "explain": "Three clocks run at the same time. <b>Containment</b> is the first: the attacker still has a path into production. <b>The insurance window</b> is the second: written notice within 24 hours of discovery. <b>The privacy clock</b> is the third: 72 hours, and it ends in 9 hours. Senior judgement means separating two things. Decide now what cannot wait. Isolate the plant, and let the group CEO own the production trade-off. Report now what can be reported with incomplete facts. The insurer and the regulator accept a first notice that is updated later. The board gets the unknowns stated as unknowns. Notice the pattern in every correct option. Escalate the contested trade-off. Meet the external deadline with the facts you have. Tell the board plainly what you still do not know.", "tip": "Name each clock out loud, then decide which one forces action in the next hour.", "hint": "Name the clock that each decision is really about, then ask whether the company is allowed to wait for it."}, {"id": "XH-02", "type": "log", "theme": "Assurance & Continuous Improvement", "title": "The control is effective on paper and failing in the dashboard", "brief": "Evidence review · privileged access control · Q1-Q2 2025", "scenario": "<p>The certification auditor tested a sample in February and found the privileged access control effective. The KRI dashboard shows the same control failing from March. The committee must decide what to conclude and what to ask for.</p>", "artefacts": [{"label": "ARTEFACT 1 — independent audit test A-2025-01 (February 2025)", "kind": "table", "title": "audit-test-A-2025-01.csv", "meta": "certification auditor working paper", "head": ["Test", "Sample", "Result", "Note"], "rows": [["Privileged access review", "25 of 25 accounts reviewed", "Effective", "Design and operation tested on accounts granted before December 2024"], ["Population actually covered by the test", "Accounts granted before December 2024", "n/a", "Accounts created from the HR feed after December 2024 were not in the sample"]]}, {"label": "ARTEFACT 2 — KRI dashboard extract (March to May 2025)", "kind": "table", "title": "kri-privileged-access-2025.csv", "meta": "assurance pack dashboard", "head": ["Indicator", "Period", "Value", "Note"], "rows": [["Privileged accounts reviewed on time", "March 2025", "91%", "Below tolerance (98%)"], ["Privileged accounts reviewed on time", "April 2025", "89%", "Second consecutive month below tolerance"], ["Privileged accounts reviewed on time", "May 2025", "84%", "Below escalation threshold (85%)"], ["Security patching within 14 days", "May 2025", "96%", "A different control; above its tolerance"]]}, {"label": "ARTEFACT 3 — change and control history", "kind": "table", "title": "control-change-history.csv", "meta": "change management system and control library", "head": ["Change", "Date", "Status", "Note"], "rows": [["HR system go-live", "March 2025", "Completed", "Leaver data now arrives three weeks late"], ["Change record CHG-2025-0311", "March 2025", "Closed", "Implementation time not recorded; approver field empty"], ["Office Wi-Fi controller firmware", "March 2025", "Completed", "No change to access management"], ["Control description", "Version 4 (2023)", "Current", "Quarterly review of privileged accounts; does not mention the HR feed or the new system"]]}, {"label": "ARTEFACT 4 — mailbox item from the control owner", "kind": "email", "title": "leaver-review-backlog.txt", "meta": "identity operations mailbox", "lines": ["RE: leaver accounts - Q2 backlog and review dates", "From: control owner, identity operations", "To: assurance team", "Since March the review is done by hand from a spreadsheet export.", "The old HR report listed start and leave dates; the new one has no date column at all.", "Number of leavers reviewed late this quarter: unknown, the export cannot be aged.", "Separate request: the audit action on backup tape rotation sits with the platform team, not with us.", "Happy to walk through the working file on the next call."]}], "prompt": "What must the committee conclude?", "options": ["The control is effective, because the independent audit test found no exception at all in February.", "The control is ineffective by design, so the February audit result has to be withdrawn completely.", "The KRI must be wrong, because an automated monthly measure cannot replace a sample-based audit test.", "The control stopped operating effectively after the HR change, and its design no longer fits."], "correct": [3], "explain": "Two pieces of evidence answer two different questions. The February audit test asks whether the control was designed well and was working then. It tested 25 accounts and found no exception. The KRI asks whether the control is working now, every month, on every account. It shows 91% in March, 89% in April and 84% in May. The tolerance is 98% and the escalation threshold is 85%. Operation degraded from March onwards. That is exactly when the new HR system went live and leaver data began arriving three weeks late. The sample also covered only accounts granted before December 2024. So the control was effective in February and is not operating effectively now. Its design no longer covers the new data flow, because the description does not mention the HR feed. Withdrawing the audit result would be wrong. Nothing was wrong with the February evidence. Distinguishing design effectiveness from operating effectiveness is the core of assurance work.", "tip": "Ask two questions for every control: is the design right, and is it working now? A sample and a KRI answer them differently.", "hint": "Read the change log line again. Nothing in February was wrong; something changed in March."}, {"id": "XH-03", "type": "rank", "theme": "Strategy, Budget & Planning", "title": "Spend the last 400,000 where it reduces the most risk", "brief": "Budget review · cut of 35% · five initiatives", "scenario": "<p>The 2026 security budget of EUR 615,000 must be cut by 35%, which leaves about EUR 400,000. The programme office proposed five initiatives, costing EUR 690,000 in total. The committee's funding rule is written in the charter: initiatives that prevent an appetite breach or a regulatory failure are mandatory; inside each group, initiatives are ranked by risk reduction per EUR 100,000 spent; anything left unfunded needs a compensating control and a documented decision.</p>", "artefacts": [{"label": "ARTEFACT 1 — 2026 initiative shortlist", "kind": "table", "title": "initiative-shortlist-2026.csv", "meta": "security programme office (amounts in EUR)", "head": ["Initiative", "Cost", "Risk reduction (residual score points)", "Regulatory requirement", "If skipped"], "rows": [["I1 Replace the unsupported VPN concentrator", "150,000", "6", "No", "Appetite breached: payment downtime limit exceeded"], ["I2 Automated leaver account removal", "80,000", "3", "Yes - open audit finding on access removal", "Major audit finding stays open past its target"], ["I3 Privileged access management rollout", "180,000", "5", "No", "Two high risks stay above appetite"], ["I4 Security awareness refresh", "60,000", "2", "No", "Phishing failure rate likely to rise again"], ["I5 Data centre flood protection", "220,000", "4", "Yes - recovery duty for customer data", "Recovery duty cannot be demonstrated"]]}, {"label": "ARTEFACT 2 — charter extract on funding rules", "kind": "doc", "title": "charter-v6-section-6-funding.txt", "meta": "group security charter, version 6", "lines": ["## Section 6 - funding rules for the security portfolio", "6.1 Initiatives that prevent an appetite breach or a regulatory failure are mandatory.", "6.2 Inside each group, initiatives are ranked by risk reduction per EUR 100,000 spent.", "6.3 Any initiative left unfunded needs a compensating control and a documented decision.", "## Section 9 - committee business (not a funding rule)", "9.4 Minutes are approved at the next meeting and published within ten working days.", "9.5 The committee reports to the board risk committee twice a year."]}, {"label": "ARTEFACT 3 — risk dashboard extract supporting the shortlist", "kind": "table", "title": "risk-dashboard-2026-shortlist.csv", "meta": "enterprise risk dashboard", "head": ["Item", "Value", "Owner", "Note"], "rows": [["I1 residual risk if skipped", "Appetite breach", "payments", "Payment downtime limit would be exceeded"], ["I3 residual risk if skipped", "Two risks above appetite", "infrastructure", "Residual scores 17 and 18"], ["I5 recovery test", "Test date not recorded", "data centre", "Recovery duty cannot be demonstrated without a test"], ["I4 phishing failure rate", "11%", "awareness", "Tolerance is 15%; the initiative is a refresh, not a breach response"], ["I6 office move security survey", "EUR 40,000, 1 point", "facilities", "Not on the 2026 shortlist; funded from the property budget"]]}, {"label": "ARTEFACT 4 — mailbox item from the finance business partner", "kind": "email", "title": "budget-2026-cut-confirmed.txt", "meta": "finance mailbox", "lines": ["RE: 2026 security budget - 35% cut confirmed", "From: finance business partner", "To: security programme office", "The 2026 security envelope is EUR 615,000 before the cut and about EUR 400,000 after it.", "The EUR 690,000 shortlist is therefore over the envelope by EUR 290,000.", "The appetite figures for payment downtime sit in annex B, which is not attached to this thread.", "Separate capital item: the laptop refresh request of EUR 320,000 goes to the property board.", "Please send the committee paper by Thursday."]}], "prompt": "Drag the five initiatives into funding priority order (highest priority on top).", "items": ["I1 Replace the unsupported VPN concentrator", "I2 Automated leaver account removal", "I3 Privileged access management rollout", "I5 Data centre flood protection", "I4 Security awareness refresh"], "explain": "Compute risk reduction for each EUR 100,000 spent. I1 gives 6 divided by 1.5, which is 4.0. I2 gives 3 divided by 0.8, which is 3.75. I4 gives 2 divided by 0.6, which is 3.3. I3 gives 5 divided by 1.8, which is 2.8. I5 gives 4 divided by 2.2, which is 1.8. By ratio alone the order would be I1, I2, I4, I3, I5. But the charter puts the mandatory initiatives first. Four of the five are mandatory: I1, I2, I3 and I5. Each one prevents an appetite breach or a regulatory failure. I4 is useful but optional, so it goes last. Its ratio of 3.3 beats I3 at 2.8 and I5 at 1.8, and that does not change the order. With EUR 400,000 the committee can fund I1 and I2, which cost EUR 230,000. Then it must decide about I3 and I5. The choices are partial funding, deferral with a compensating control, or a documented risk decision. Avoid two mistakes. Do not rank by cost. Do not let a cheap optional item overtake an obligation.", "tip": "Apply the rule in order: obligations first, then the ratio. Compute the ratio before you argue.", "hint": "Divide the risk reduction by the cost in units of 100,000. Then ask which initiatives are obligations, not options."}, {"id": "XH-04", "type": "multi", "theme": "Operational Integration", "title": "Conditions to impose before the acquisition is signed", "brief": "Deal room · target “Northwind Logistics” · 9 days to signature", "scenario": "<p>The committee must give the deal team a short list of conditions for the acquisition, and the deal team signs in <b>nine days</b>. Due diligence found: no security certifications, one unpatched internet-facing warehouse portal, personal data of 120,000 customers, and no incident response plan. The target stores that customer data on a platform hosted outside the EEA and uses a support subcontractor in another country.</p>", "artefacts": [{"label": "ARTEFACT 1 — technical and privacy due diligence findings", "kind": "table", "title": "dd-findings-northwind-logistics.csv", "meta": "deal room due diligence tracker", "head": ["Finding", "Detail", "Verified by", "Status"], "rows": [["Security certifications", "None held", "deal team", "Confirmed with the target"], ["Internet-facing warehouse portal", "Unpatched; last update date not recorded", "technical due diligence", "Remediation window offered: next quarter"], ["Personal data", "120,000 customer records", "privacy workstream", "Confirmed"], ["Incident response plan", "None", "deal team", "Target declined to share its incident history"], ["Hosting location", "Outside the EEA", "technical due diligence", "Support subcontractor in a second country"], ["Transfer impact assessment", "Not on file", "privacy workstream", "Not started"], ["Warehouse forklift fleet telematics", "Vendor contract expires 2026", "commercial workstream", "Renewal handled by operations"]]}, {"label": "ARTEFACT 2 — deal timetable extract", "kind": "doc", "title": "deal-timetable-northwind.txt", "meta": "deal team tracker, day count confirmed with the bank", "lines": ["## Timetable to signature", "Day 9 from today: signature of the share purchase agreement.", "Conditions can be agreed and performed before signature.", "Obligations that only make sense for the combined group can only start after closing.", "Day 4: brand and marketing briefing for the combined group.", "Day 6: the acquisition paper goes to the board risk committee.", "Day 7: signing ceremony venue confirmed."]}, {"label": "ARTEFACT 3 — reply from the target's technology lead", "kind": "email", "title": "target-reply-security-questions.txt", "meta": "deal room question and answer log", "lines": ["RE: Northwind Logistics - security questions before signature", "From: target technology lead", "To: deal team security workstream", "We hold no security certifications and we do not plan to certify before closing.", "The warehouse portal patch is scheduled for next quarter and we cannot bring it forward.", "We would rather not disclose our incident history at this stage.", "Our support subcontractor works from another country and hosts the customer platform.", "Number of customer records: 120,000, as already provided."]}, {"label": "ARTEFACT 4 — data flow register extract for the target", "kind": "table", "title": "data-flow-register-northwind.csv", "meta": "group privacy office register", "head": ["Data flow", "Volume", "Location", "Assessment", "Note"], "rows": [["Customer order data", "120,000 records", "Platform hosted outside the EEA", "Transfer impact assessment not on file", "Subcontractor support from a second country"], ["Employee payroll", "1,400 records", "Group data centre", "Assessment complete", "No cross-border transfer"], ["Warehouse telematics", "Not recorded", "Vendor cloud", "Not assessed", "Operations-owned, out of scope for this deal"]]}], "prompt": "Select every condition the committee must impose before signature.", "options": ["A stand-alone security risk assessment of the target, with the top risks priced into the deal.", "Contractual security and privacy warranties, with a notification duty for breaches found later.", "An integration plan with security gates, owners and a deadline after the closing date.", "A transfer impact assessment for the customer data that will move across borders.", "Interim compensating controls for the unpatched warehouse portal, effective before closing.", "Replacing the target's entire IT department before the integration starts.", "A full penetration test of every application in the target before signature.", "Moving the target's customer data into the group data lake immediately after the signature is given."], "correct": [0, 1, 2, 3, 4], "explain": "Due diligence conditions must be actionable before signature and realistic in nine days. Five conditions qualify. The first is a security risk assessment of the target, with the top risks priced into the deal. The second is contractual security and privacy warranties, with a duty to notify breaches found later. The third is an integration plan with security gates, owners and a deadline after closing. The fourth is a transfer impact assessment. That is the check that asks whether personal data may lawfully be moved to another country. Here the customer data sits outside the EEA and a subcontractor supports it from another country. The fifth is interim compensating controls for the unpatched warehouse portal, effective before closing. Three items fail. Replacing a whole IT department is not a security control. A full penetration test of every application cannot be finished in nine days, so it belongs to integration. Moving personal data into the group data lake straight after signature is exactly what the transfer assessment exists to control.", "tip": "Ask two questions for each condition: can it be agreed or done before signature, and does it change the risk?", "hint": "For each condition, ask two questions: can it be agreed or done before signature, and does it change the risk?"}, {"id": "XH-05", "type": "fill", "theme": "Strategy, Budget & Planning", "title": "Write the wording the board will hold you to", "brief": "Board paper SEC-2025-11 · security chapter · final review", "scenario": "<p>The chair rejected the previous draft twice. It said the board had “outsourced” its accountability, and it said the board “acknowledged” a risk instead of “accepting” it. One duty was also described as transferred when it must not be. You must complete the final version.</p>", "artefacts": [{"label": "ARTEFACT 1 — chair mark-up on draft SEC-2025-11 version 2", "kind": "doc", "title": "SEC-2025-11-chair-markup.txt", "meta": "company secretary file, tracked comments", "lines": ["## Comments on the security chapter of draft SEC-2025-11", "Replace the sentence that describes the board as acknowledging the risk.", "The board takes the formal decision itself, so use the decision word, not a passive acknowledgement.", "Delete the sentence that says the board has given away its accountability for ICT risk.", "Accountability stays with the board; only the authority to act can move to a committee.", "Keep the sentence about independent confirmation, because the audit committee owns that.", "## Layout comments (not part of the wording)", "Use the group font and keep the chapter under two pages."]}, {"label": "ARTEFACT 2 — charter extract on accountability and authority", "kind": "doc", "title": "charter-v6-section-3-accountability.txt", "meta": "group security charter, version 6", "lines": ["## Section 3 - accountability and authority", "3.1 The board remains accountable for ICT risk and for the risk it decides to carry.", "3.2 The board may give a committee the authority to act on its behalf.", "3.3 The accountability itself never moves away from the board.", "3.4 The committee asks the board for a formal decision when a control limit cannot be met.", "## Section 11 - paper quality (not about accountability)", "11.2 Every paper names a decision owner and a review date."]}, {"label": "ARTEFACT 3 — independent confirmation map", "kind": "table", "title": "independent-confirmation-map-2025.csv", "meta": "audit committee secretariat", "head": ["Control area", "Who confirms it independently", "Method", "Frequency"], "rows": [["Identity and access", "Internal audit", "Sample testing", "Annual"], ["Change management", "External auditor", "IT general control testing", "Annual"], ["Risk decisions", "Audit committee", "Review of the decision log", "Quarterly"], ["Physical security", "Not assigned", "Not recorded", "Not scheduled"]]}, {"label": "ARTEFACT 4 — mailbox item from the committee chair", "kind": "email", "title": "SEC-2025-11-final-wording.txt", "meta": "committee chair mailbox", "lines": ["RE: SEC-2025-11 - final wording before the board pack closes", "From: committee chair", "To: company secretary", "I will not sign a paper that describes a risk decision the board did not take.", "Where a limit cannot be met, the paper asks the board for a decision, not for a note.", "The minute reference for the March decision is not recorded in the pack, so please add it.", "Separate item: the travel policy review is on the same agenda and needs no security input.", "Send the final text by 17:00."]}], "prompt": "Complete the board paper with the exact governance words.", "text": "This paper reports on matters that are [[0]] to the group's results. Where a control limit cannot be met, the committee asks the board for a formal risk [[1]]. The committee's authority comes from the charter; the board has not [[2]] its accountability for ICT risk, and the [[3]] of that risk rests with the audit committee's independent testing.", "blanks": ["material", "acceptance", "delegated", "assurance"], "bank": ["acceptance", "material", "delegated", "assurance", "tolerance", "waived"], "explain": "<b>Material</b> means important enough to change a decision or to require disclosure. <b>Acceptance</b> is the formal decision to keep a risk above the limit. <b>Delegated</b> means transferred to another body that has the authority to act. Accountability for ICT risk cannot be delegated away. That is why the sentence is negative: has not delegated. <b>Assurance</b> is the independent confirmation that controls work. It is a different thing from accountability, and that is exactly why it sits with the audit committee.", "tip": "Learn the pairs: material / immaterial, acceptance / acknowledgement, delegated / accountable, assurance / accountability.", "hint": "One blank is about importance, one is a formal decision, one is about transferring authority (in the negative), one is independent confirmation."}, {"id": "XH-06", "type": "match", "theme": "Governance & Oversight", "title": "Route six decisions using the delegation matrix", "brief": "Delegation matrix v6 · thresholds by residual risk score", "scenario": "<p>The charter sets delegated authority by residual risk score: up to 8 the business risk owner decides; 9 to 14 the CISO decides and reports to the committee; 15 to 19 the steering committee decides; 20 and above the board risk committee decides. You must route six requests.</p>", "artefacts": [{"label": "ARTEFACT 1 — delegation matrix version 6", "kind": "table", "title": "delegation-matrix-v6.csv", "meta": "group security charter, annex 1", "head": ["Residual risk score", "Decision authority", "Reporting duty", "Effective from"], "rows": [["0 to 8", "Business risk owner", "Log in the risk register", "Charter v6, 1 January 2025"], ["9 to 14", "CISO", "Report to the steering committee", "Charter v6, 1 January 2025"], ["15 to 19", "Security Steering Committee", "Report to the board risk committee", "Charter v6, 1 January 2025"], ["20 and above", "Board risk committee", "Disclose in the quarterly risk report", "Charter v6, 1 January 2025"]]}, {"label": "ARTEFACT 2 — risk decision log extract", "kind": "table", "title": "risk-decision-log-extract.csv", "meta": "risk register, exported 2025-11-05", "head": ["Risk id", "Score at first decision", "Change since", "Current score", "Note"], "rows": [["RISK-212", "6", "None", "6", "Accepted for 12 months by the service owner"], ["RISK-318", "12", "Compensating control added", "12", "Re-scored by the risk analyst after the control was added"], ["RISK-402", "19", "Compensating control failed", "Not re-recorded in this log", "See the meeting record of 2025-11-04"], ["RISK-509", "22", "None", "22", "Customer identity data; board risk committee paper prepared"], ["RISK-541", "14", "Supplier certificate expired", "14", "Certificate expiry date not recorded by the supplier"], ["RISK-117", "17", "None", "17", "Internet-facing service"]]}, {"label": "ARTEFACT 3 — meeting record extract for 2025-11-04", "kind": "minutes", "title": "committee-record-2025-11-04.txt", "meta": "Security Steering Committee minutes", "lines": ["## Meeting record - Security Steering Committee, 2025-11-04", "Item 4: RISK-402 was first decided at a residual score of 19.", "Item 5: the compensating control for RISK-402 failed on 2025-10-28.", "The risk analyst re-scored RISK-402 at 21 on 2025-11-04.", "The secretary asked whether the decision moves; the chair confirmed that it does.", "Item 6: the canteen lease renewal was noted; no security decision was required.", "Item 7: next meeting 2025-12-02."]}, {"label": "ARTEFACT 4 — mailbox request from a business risk owner", "kind": "email", "title": "risk-402-keep-current-approval.txt", "meta": "business risk owner mailbox", "lines": ["RE: RISK-402 - request to keep the current approval", "From: business risk owner, order services", "To: committee secretary", "The control that failed is being rebuilt and will be back within three weeks.", "In my view the score stays at 19 and nothing has changed, so the existing approval holds.", "The certificate for RISK-541 expires on a date we have not recorded.", "Can we treat both items as administrative updates rather than new decisions?"]}], "prompt": "Match each request with the authority that must decide it.", "pairs": [{"left": "Risk score 6, accepted for 12 months by the service owner", "right": "Business risk owner (score in the 0-8 band)"}, {"left": "Risk score 12 after a compensating control was added", "right": "CISO, reported to the committee (score in the 9-14 band)"}, {"left": "Risk score 17 on an internet-facing service", "right": "Security Steering Committee (score in the 15-19 band)"}, {"left": "Risk score 22 on customer identity data", "right": "Board risk committee (score in the 20+ band)"}, {"left": "Risk score 19 raised to 21 after the compensating control failed", "right": "Board risk committee (the band changed after the control failed)"}, {"left": "Risk score 14 for a supplier with an expired certificate", "right": "CISO, reported to the committee (the score stays in the 9-14 band)"}], "explain": "The matrix is a table of numbers, and governance work is often careful reading. Read the score, then land in exactly one band. A score of 6 is in the 0-8 band, so the business risk owner decides. Scores of 12 and 14 are in the 9-14 band, so the CISO decides and reports to the committee. A score of 17 is in the 15-19 band, so the steering committee decides. A score of 22 is in the 20+ band, so the board risk committee decides. The trap is the request whose score moved. It was 19 when the committee first decided. When the compensating control failed, the residual score became 21. That moves the decision to the board risk committee. Authority follows the current score, not the score at the first decision.", "tip": "Re-check authority every time the residual score changes. A failed control moves the decision level.", "hint": "Read every row twice: once for the score, once for what happened to the score since it was first recorded."}, {"id": "XH-07", "type": "terminal", "theme": "Assurance & Continuous Improvement", "title": "Evidence that will survive scrutiny", "brief": "Legal request L-2025-31 · governance workstation ws-grc-02 · 10 minutes", "scenario": "<p>Legal needs to prove <b>when</b> the risk acceptance for RISK-410 was recorded and <b>who</b> changed it afterwards. The record lives in a SQLite database on this workstation, and the committee database service is <b>still running</b>. The audit trail is complete only while the file is untouched: opening it read-write, compacting it or dumping over it can create or rewrite the rollback journal and change the timestamps that are the whole point of the exercise.</p><p>Three signals disagree, and you will have to say which one wins. The acceptance record says <i>review: none</i>. The KRI shows a review happened in March. The application log and the journal file timestamps are 40 minutes apart, which the platform team explains as a clock skew introduced during a migration.</p><p>You are on the workstation with a bash shell and write access to <code>/evidence</code>. Installed and on the PATH: <code>sha256sum</code>, <code>sqlite3</code>, the governance toolkit, <code>cp</code>, <code>strings</code> and the usual core utilities. A colleague has already opened the database once today with a command they cannot remember. The CISO wants the answer in ten minutes, and the lawyers have said twice: <i>“nothing we produce may alter the original.”</i></p>", "artefacts": [{"label": "ARTEFACT 1 — legal request L-2025-31 intake note", "kind": "doc", "title": "legal-request-L-2025-31.txt", "meta": "legal counsel file", "lines": ["## Legal request L-2025-31 - intake note", "Question 1: when was the risk decision for RISK-410 recorded?", "Question 2: who changed that record afterwards?", "Source system: SQLite record set at /var/lib/gov/gov.db on workstation ws-grc-02.", "Service state at intake: the committee database service is running and writing.", "Fingerprints from the earlier examination: not recorded.", "The original may not be altered; extracts are attached on a copy basis only."]}, {"label": "ARTEFACT 2 — platform team note on clock behaviour", "kind": "doc", "title": "clock-skew-note-2025-11.txt", "meta": "platform engineering note", "lines": ["## Clock behaviour during the November migration", "The migration of 2025-11-03 introduced a skew of about 40 minutes on part of the fleet.", "The exact list of affected nodes was not recorded.", "Application log timestamps come from the service clock.", "File timestamps come from the storage controller on the array.", "Separate fix: the print server time service was restarted the same week."]}, {"label": "ARTEFACT 3 — monitoring return for risk decisions", "kind": "table", "title": "risk-review-monitoring-return.csv", "meta": "risk office spreadsheet", "head": ["Item", "Value", "Source", "Note"], "rows": [["Review field in the record set", "none", "risk_acceptance table", "The field exists and is empty for RISK-410"], ["Reviews recorded in the March return", "1", "risk office spreadsheet", "The spreadsheet is not linked to the record set"], ["Date the March review was performed", "Not recorded", "risk office", "The return shows the month only"], ["KRI: patch compliance", "96%", "vulnerability platform", "No link to this request"]]}, {"label": "ARTEFACT 4 — database service log for the workstation", "kind": "log", "title": "gov-db-service-ws-grc-02.log", "meta": "governance workstation system log", "lines": [["INFO", "03:11 interactive client opened /var/lib/gov/gov.db read-write; command not recorded"], ["INFO", "03:12 session closed; no statement text was written to this log"], ["WARN", "Log gap: no entries between 03:13 and 04:19; collector restart, cause not recorded"], ["INFO", "04:20 backup job completed for /var/lib/gov/hr.db (a different record set)"], ["INFO", "05:58 gov-db service started on ws-grc-02"], ["INFO", "05:58 rollback journal /var/lib/gov/gov.db-journal present, 12,288 bytes"]]}], "prompt": "Type the command for each step in the terminal. The objective of each step is listed one by one beside the terminal.", "objective": "Preserve volatile state, then answer the legal question without altering the original record.", "timeLimit": 300, "console": "governance workstation ws-grc-02", "consoleMode": "read-only records, write access to /evidence", "outputSample": "a1c9...73f2  /var/lib/gov/gov.db\nb70e...9d41  /var/lib/gov/gov.db-journal", "steps": [{"goal": "Preserve the volatile state first: record the fingerprints of the live database and its journal into /evidence.", "accept": ["^sha256sum\\s+/var/lib/gov/gov\\.db\\s+/var/lib/gov/gov\\.db-journal\\s*>\\s*/evidence/hashes\\.txt$", "^sha256sum\\s+/var/lib/gov/gov\\.db-journal\\s+/var/lib/gov/gov\\.db\\s*>\\s*/evidence/hashes\\.txt$"], "out": "a1c9...73f2  /var/lib/gov/gov.db\nb70e...9d41  /var/lib/gov/gov.db-journal\n(fingerprints written to /evidence/hashes.txt)", "err": "That does not fingerprint both files into /evidence. Fingerprints come before any read of the content.", "danger": [["^(rm|mv|shred)\\b", "That deletes or moves the original database or journal. The evidence would be gone and the request would fail — the safe path is to hash first and never touch the original."], ["^cp\\s+/var/lib/gov/gov\\.db\\s+/var/lib/gov/gov\\.db$", "That copies the live database onto itself while the service is writing to it. On a live system that can tear the file."]]}, {"goal": "List the tables of the database without altering it in any way.", "accept": ["^sqlite3\\s+-readonly\\s+('?file:/var/lib/gov/gov\\.db\\?mode=ro'?|/var/lib/gov/gov\\.db)\\s+\\.tables$", "^sqlite3\\s+('?file:/var/lib/gov/gov\\.db\\?mode=ro'?)\\s+\\.tables$", "^sqlite3\\s+--readonly\\s+('?file:/var/lib/gov/gov\\.db\\?mode=ro'?|/var/lib/gov/gov\\.db)\\s+\\.tables$"], "out": "risk_acceptance  decisions  attendance  audit_journal  suppliers", "err": "That does not list the tables in read-only mode. The database must be opened so that it cannot be written.", "danger": [["^sqlite3\\s+/var/lib/gov/gov\\.db\\s+\\.tables$", "This opens the database read-write. Even listing tables can create or modify the rollback journal and change the timestamps. Add -readonly, or use the file:…?mode=ro URI."], ["\\b(vacuum|reindex|analyze)\\b", "That rewrites the database file. It is exactly the operation that destroys the timeline you were asked to prove."], ["^gov\\s+db\\s+compact", "The toolkit's compact command rewrites the database. Convenient, and fatal for this request."]]}, {"goal": "Answer the legal question: put the recording date and the recording user of RISK-410 into a file the lawyers can attach.", "accept": ["^sqlite3\\s+(-readonly\\s+|--readonly\\s+)?('?file:/var/lib/gov/gov\\.db\\?mode=ro'?|/var/lib/gov/gov\\.db)\\s+['\\\"]?select\\s+(accepted_on\\s*,\\s*recorded_by|recorded_by\\s*,\\s*accepted_on|\\*)\\s+from\\s+risk_acceptance\\s+where\\s+risk_id\\s*=\\s*'?risk-410'?\\s*;?['\\\"]?\\s*>\\s*/evidence/risk-410\\.txt$"], "out": "2025-02-11|j.moreau\n(1 row written to /evidence/risk-410.txt)", "err": "That does not write the recording date and user of RISK-410 into /evidence/risk-410.txt.", "danger": [["^sqlite3\\s+(-readonly\\s+|--readonly\\s+)?('?file:/var/lib/gov/gov\\.db\\?mode=ro'?|/var/lib/gov/gov\\.db)\\s+['\\\"]?(update|delete|insert)", "That writes to the live record set. You would be changing the very evidence you were asked to protect."], ["\\.dump\\b.*>\\s*/var/lib/gov/gov\\.db", "That dumps the database over itself: total loss of the original."]]}, {"goal": "Add the new extract to the same fingerprints file, without destroying the fingerprints you already recorded.", "accept": ["^sha256sum\\s+/evidence/risk-410\\.txt\\s*>>\\s*/evidence/hashes\\.txt$"], "out": "c4d1...08ab  /evidence/risk-410.txt\n(added to /evidence/hashes.txt — the two earlier fingerprints are still there)", "err": "That does not add the new fingerprint to the file that already holds the earlier ones.", "danger": [["^sha256sum\\s+/evidence/risk-410\\.txt\\s*>\\s*/evidence/hashes\\.txt$", "A single > overwrites the file. The two fingerprints from the first step would be lost, and with them the proof that the database was untouched when you started."]]}], "canonical": [{"cmd": "sha256sum /var/lib/gov/gov.db /var/lib/gov/gov.db-journal > /evidence/hashes.txt", "parts": ["sha256sum — the fingerprint tool", "the two files — the live database and its rollback journal", "> /evidence/hashes.txt — write the fingerprints into the folder you own (never into the record set)"]}, {"cmd": "sqlite3 -readonly /var/lib/gov/gov.db .tables", "parts": ["sqlite3 — the SQL client", "-readonly — the flag that opens the database so that it cannot be written", "/var/lib/gov/gov.db — the live database (the file:…?mode=ro URI does the same job)", ".tables — list the tables, and nothing else"]}, {"cmd": "sqlite3 -readonly /var/lib/gov/gov.db \"SELECT accepted_on, recorded_by FROM risk_acceptance WHERE risk_id='RISK-410';\" > /evidence/risk-410.txt", "parts": ["SELECT accepted_on, recorded_by — exactly the two facts legal asked for", "FROM risk_acceptance — the table that holds acceptances", "WHERE risk_id='RISK-410' — one risk, not the whole table", "> /evidence/risk-410.txt — the extract the lawyers can attach"]}, {"cmd": "sha256sum /evidence/risk-410.txt >> /evidence/hashes.txt", "parts": [">> — append, so the two fingerprints from the first step survive", "sha256sum /evidence/risk-410.txt — fingerprint the extract you produced"]}], "dangerNote": "Two commands look right and are not. <code>sqlite3 /var/lib/gov/gov.db .tables</code> (without <code>-readonly</code>) opens the database read-write: it can create or rewrite the rollback journal and move the timestamps, which is the evidence itself. <code>sha256sum /evidence/risk-410.txt > /evidence/hashes.txt</code> uses a single <code>&gt;</code> and silently replaces the earlier fingerprints; the append <code>&gt;&gt;</code> keeps both.", "explain": "This is the case where the widely used habit is the wrong answer. Opening a database to look at it is normal practice. So is piping a dump into a file. On a live or forensic record set, that habit changes the timeline you were asked to prove. So the sequence is fixed. Fingerprint first. Read read-only. Write only into <code>/evidence</code>. Append rather than overwrite. <code>-readonly</code> or the <code>file:…?mode=ro</code> URI both make the client refuse every write.<br><br>The three conflicting signals resolve like this. The acceptance record says <i>review: none</i>. The KRI says a review happened in March. The record wins for what was recorded. The KRI wins for what was done. A review that was performed but never written into the record is a documentation defect. It is not proof that the review happened. The 40-minute gap between the journal and the application log is explained clock skew. It cannot carry the legal argument on its own. It only matters when it is compared with a fingerprint taken now.", "tip": "On a live or forensic record set, the first command you type should protect the evidence, not read it. Append, do not overwrite.", "hint": "Remember the constraint you may have missed: the record set is live and the service is still writing to it, so anything that opens it read-write — or replaces a file it already produced — costs you the evidence."}, {"id": "XH-08", "type": "classify", "theme": "Assurance & Continuous Improvement", "title": "Eight symptoms, four root causes", "brief": "Post-incident governance review GI-2025-02 · accepted risk RISK-410", "scenario": "<p>A risk accepted by the committee was never monitored. The review board collected eight observations and wants each one classified into one of four root causes, so that the corrective actions hit the real problem.</p>", "artefacts": [{"label": "ARTEFACT 1 — review board observation list", "kind": "table", "title": "GI-2025-02-observations.csv", "meta": "post-incident governance review", "head": ["Ref", "Observation", "Source"], "rows": [["OBS-01", "No review date field exists in the decision record", "record layout review"], ["OBS-02", "The charter is silent on who may extend a risk decision when the committee does not meet", "charter review"], ["OBS-03", "The review date existed but was never added to a meeting agenda", "agenda pack review"], ["OBS-04", "The KRI required by the decision was never set up in the monitoring tool", "tool configuration review"], ["OBS-05", "The committee dashboard did not list the accepted risks at all", "dashboard review"], ["OBS-06", "The monthly pack showed green while the underlying indicator was amber", "pack review"], ["OBS-07", "A business director extended the risk decision alone", "meeting record review"], ["OBS-08", "The exception was renewed twice by the account manager who raised it", "decision log review"], ["OBS-09", "The review board started 20 minutes late", "meeting record review"], ["OBS-10", "The offsite venue for the review board changed twice", "secretariat note"]]}, {"label": "ARTEFACT 2 — record layout for RISK-410", "kind": "doc", "title": "risk-record-RISK-410.txt", "meta": "risk register record layout", "lines": ["## Risk decision record RISK-410 (extract)", "Risk: unmonitored privileged access on the legacy order platform.", "Decision date: 2025-02-11.", "Expiry: 2025-12-31.", "Review date: the field does not exist in this record layout.", "Owner: not recorded.", "Monitoring indicator required: yes, one KRI.", "## Related populated fields", "Wording recorded at the decision: approved with a compensating control."]}, {"label": "ARTEFACT 3 — meeting record for 2025-08-19", "kind": "minutes", "title": "committee-record-2025-08-19.txt", "meta": "Security Steering Committee minutes", "lines": ["## Meeting record - Security Steering Committee, 2025-08-19", "Item 3: the extension of RISK-410 was raised by the business director.", "The committee did not take a decision; the item was carried to the next meeting.", "The next meeting was cancelled and the extension was applied by the business director alone.", "Item 4: the annual offsite venue was agreed; no risk decisions were required.", "Item 5: the review date reminder process was noted as needing an owner."]}, {"label": "ARTEFACT 4 — monitoring tool indicator catalogue", "kind": "doc", "title": "kri-catalogue-extract.yaml", "meta": "monitoring tool catalogue, last changed 2025-06-30", "lines": ["## monitoring-tool/kri-catalogue.yaml (excerpt)", "kri: privileged-change-rate", "  owner: infrastructure", "  state: enabled", "  used_by: monthly committee pack", "kri: antivirus-agent-coverage", "  owner: endpoint team", "  state: enabled", "  used_by: endpoint operations weekly report, not the committee", "## no entry exists for risk-410", "## catalogue change reason for 2025-06-30: not recorded"]}], "prompt": "Drag each observation into the root cause it belongs to.", "buckets": ["Design gap", "Operating gap", "Reporting gap", "Authority gap"], "items": [{"text": "The risk acceptance record has no review date field, so nobody could enter one", "bucket": "Design gap"}, {"text": "The charter does not say who may extend an accepted risk when the committee does not meet", "bucket": "Design gap"}, {"text": "The review date existed but the secretary never added it to the meeting agenda", "bucket": "Operating gap"}, {"text": "The acceptance required a KRI, but nobody ever configured it in the monitoring tool", "bucket": "Operating gap"}, {"text": "The dashboard sent to the committee did not include the accepted risks at all", "bucket": "Reporting gap"}, {"text": "The monthly pack showed the risk as green although the underlying indicator was amber", "bucket": "Reporting gap"}, {"text": "A business director extended the risk acceptance alone, without the committee", "bucket": "Authority gap"}, {"text": "The exception was renewed twice by the account manager who raised it", "bucket": "Authority gap"}], "explain": "The four root causes are different in nature. A <b>design gap</b> means the field, rule or control does not exist, or is incomplete. An <b>operating gap</b> means the rule exists but people did not perform it. A <b>reporting gap</b> means the information existed but was missing from the pack, or was wrong. An <b>authority gap</b> means somebody acted above their decision rights. Corrective actions only work when the root cause is named correctly. An agenda reminder will never fix a missing field.", "tip": "Ask four questions in order: does the rule exist, was it followed, was the result visible, and did the right person decide?", "hint": "Two observations are about missing rules or fields, two about work not performed, two about information, two about decision rights."}, {"id": "XH-09", "type": "order", "theme": "Compliance, Audit & Standards", "title": "Order the material weakness process against the filing calendar", "brief": "ITGC deficiency D-2025-03 · change management · filing in 46 days", "scenario": "<p>An ITGC deficiency in change management is being evaluated. ITGC means the basic IT controls — access, change and operations — that financial reporting depends on, and in the United States the reporting law behind them is SOX. If the deficiency becomes a material weakness, the timeline is fixed by the reporting calendar. You must order the process.</p>", "artefacts": [{"label": "ARTEFACT 1 — deficiency record D-2025-03", "kind": "doc", "title": "deficiency-record-D-2025-03.txt", "meta": "internal audit deficiency file", "lines": ["## Deficiency record D-2025-03 (change management)", "Raised: 2025-09-29 by internal audit.", "Description: three emergency changes were deployed without evidence of approval.", "Test of operating effectiveness: exception rate 12% against a 5% threshold.", "Management severity conclusion: not yet documented.", "Compensating controls in place: none recorded.", "Owner named at the time of raising: not recorded."]}, {"label": "ARTEFACT 2 — reporting calendar extract", "kind": "table", "title": "reporting-calendar-2025.csv", "meta": "group finance calendar", "head": ["Date", "Event", "Owner", "Note"], "rows": [["2025-10-31", "Third quarter close", "finance", "Figures locked for the filing"], ["2025-11-18", "Audit committee meeting", "company secretary", "Remediation status is on the agenda"], ["2025-11-25", "Filing window opens", "finance", "46 days from the deficiency date"], ["2025-12-09", "Filing deadline", "finance", "Date fixed by the listing rules"], ["2025-11-05", "Car park barrier replacement", "facilities", "Unrelated project milestone"]]}, {"label": "ARTEFACT 3 — information request from the external auditor", "kind": "email", "title": "D-2025-03-auditor-request.txt", "meta": "external audit mailbox", "lines": ["RE: D-2025-03 - information request before the November audit committee", "From: external audit manager", "To: group financial controller", "Please send management's documented conclusion on the severity of D-2025-03.", "We will form our own conclusion on the deficiency; your document is one input among others.", "We also need the remediation plan and the evidence for any compensating controls.", "Our re-testing can only start once the permanent fix is in place.", "Separate request: the lease accounting sample for the property audit."]}, {"label": "ARTEFACT 4 — remediation tracker", "kind": "table", "title": "remediation-tracker-D-2025-03.csv", "meta": "group finance remediation tracker", "head": ["Action", "Owner", "Due", "Evidence", "Status"], "rows": [["Permanent change approval workflow", "IT change manager", "2025-11-14", "Screenshots of the workflow", "In progress"], ["Compensating control: weekly change review", "IT operations
