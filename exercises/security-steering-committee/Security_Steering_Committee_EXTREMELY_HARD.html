oves the plan before the wording is finalised. Management and the auditor conclude separately.", "hint": "Nothing can be planned before both evaluations are done, and nothing can be concluded before the auditor re-tests."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Security Steering Committee</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Expert level. Long or ambiguous scenarios, several clocks running at the same time, chain reasoning across standards, and answers that look almost right. This mirrors a senior analyst, senior incident responder or senior governance engineer decision.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev xhard\">EXTREMELY HARD</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">70% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">75 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">13 exercises · 130 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Meet the Security Steering Committee</h2>\n  <p class=\"sub\">The keyword you are about to master, explained in plain words: short sentences, common words, no jargon.</p>\n  <p>A <b>Security Steering Committee</b> (we shorten it to <b>SSC</b>) is a small group of senior\n  leaders who meet to make decisions about security. They do not fix servers and they do not watch\n  alerts. They decide three big things: <b>how much risk the company accepts</b>, <b>which security\n  projects get money</b>, and <b>which security rules become official</b>.</p>\n  <p>Imagine you are a new analyst. One day your manager asks you to write a one-page paper about a\n  risk that nobody wants to own. That paper goes to the SSC. In the meeting, leaders ask questions,\n  then they decide. Your paper is the input; their decision is the output. This is how security work\n  gets priority, budget and owners.</p>\n\n  <h3>Who sits at the table?</h3>\n  <ul class=\"tight\">\n    <li><b>The CISO</b> (Chief Information Security Officer) — the senior leader for security.</li>\n    <li><b>The CIO</b> (information technology) and often the <b>CFO</b> (money).</li>\n    <li><b>A risk leader</b> (chief risk officer) and <b>a legal adviser</b> (general counsel).</li>\n    <li><b>Business leaders</b> who own the systems and the data.</li>\n    <li><b>Internal audit</b> usually attends as an observer, because it must stay independent.</li>\n    <li><b>Experts</b> such as a SOC lead or a penetration tester are invited to explain a topic.</li>\n  </ul>\n\n  <h3>What happens in a normal month?</h3>\n  <ul class=\"tight\">\n    <li>It reads a report about the <b>top risks</b> (the risk register) and checks who owns each risk.</li>\n    <li>It looks at <b>numbers</b> called KPIs and KRIs — simple measurements that show if security is getting\n    better or worse (for example: how fast patches are installed, or how many people click a fake email).</li>\n    <li>It <b>approves policies and standards</b>, and the security budget and roadmap.</li>\n    <li>It signs off when a business wants to keep a known risk. This is called <b>risk acceptance</b>.</li>\n    <li>It writes every decision in the <b>minutes</b> (the official record), with an owner and a due date.</li>\n  </ul>\n\n  <h3>Where you will meet this keyword at work</h3>\n  <ul class=\"tight\">\n    <li><b>SOC and incident response:</b> when a major incident happens, the committee is informed. It decides\n    about money, priority, and what the board must be told. Small alerts never reach it.</li>\n    <li><b>Risk and GRC analysts:</b> they prepare the risk register, the risk appetite statement, the exception\n    requests, the KPI/KRI dashboard and the board pack.</li>\n    <li><b>Compliance and audit:</b> the committee approves policies, reviews audit findings and holds the\n    <b>management review</b> that standards such as ISO/IEC 27001 clause 9.3 require from top management.\n    It is where leaders show that they take responsibility.</li>\n    <li><b>Engineering and cloud teams:</b> architects bring design decisions that need money or that change the\n    level of risk, for example moving a service to a new cloud provider.</li>\n    <li><b>Red team and penetration testers:</b> their technical report stays with the engineers, but the\n    important findings and the fixes are summarised for the committee.</li>\n    <li><b>Legal, privacy and regulators:</b> the committee approves how the company answers regulators and\n    customers, for example after a data breach.</li>\n  </ul>\n\n  <h3>The documents you will handle</h3>\n  <p>The <b>charter</b> (also called terms of reference: it says why the committee exists, who is on it and\n  what it may decide), the <b>agenda</b>, the <b>minutes</b>, the <b>action log</b>, the <b>risk register</b>,\n  the <b>exception register</b>, the <b>KPI/KRI dashboard</b> and the <b>board report</b>.</p>\n\n  <h3>The tools you will use</h3>\n  <p>You will work in a <b>GRC platform</b> (governance, risk and compliance software that stores risks,\n  exceptions and decisions), in the <b>ticketing tool</b> (for example ServiceNow or Jira), in the\n  <b>dashboard</b> that shows the KPIs and KRIs, in the <b>shared drive</b> that holds the charters and the\n  minutes, and in <b>spreadsheets</b> for the board pack. Nothing exotic: the committee lives on documents,\n  numbers and records.</p>\n\n  <h3>The risks it exists to control</h3>\n  <p>Risk that nobody owns, risk that is hidden because nobody reports it, money spent on the wrong things,\n  rules that are broken, fines from regulators, and slow decisions that leave the company exposed\n  for a long time.</p>\n\n  <p class=\"muted\">In one sentence: security work needs one place where business leaders and security leaders\n  decide together. That place is the Security Steering Committee.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">Four rules, one severity level, no surprises. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b>, the exercise is correct only if every decision was right on the first try.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>70%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>75 minutes</b>.</li>\n        <li>The countdown, the live score, the hint and the skip button are always visible in the header at the top.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n        <li>One exercise in this file is <b>time-boxed</b>: it has its own short countdown beside the QUESTION header, and the exam timer keeps running at the same time.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Branching decision scenario — each choice unlocks the next step</li><li>Drag each card into the correct box</li><li>Drag the items to rank them by priority</li><li>Drag the steps into the right order</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log or document analysis with a coloured viewer and a filter box</li><li>Match each item to the right answer</li><li>Multi-select question — several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Every exercise uses the same three blocks, in the same order: <b>SCENARIO</b> (blue),\n      <b>QUESTION</b> (amber) and <b>YOUR ANSWER</b> (green), with the feedback block below them. Long scenarios can be\n      collapsed with <b>Hide scenario</b>. Some exercises ask you to drag cards — with a mouse, or on a tablet by\n      selecting a card and then selecting the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>artefact</b> — the file, log, meeting record or dashboard shown inside the exercise.</li>\n        <li><b>distractor</b> — a wrong answer that looks reasonable. It tests real understanding.</li>\n        <li><b>near-miss answer</b> — a wrong answer that is almost right, usually a true statement used in the wrong place.</li>\n        <li><b>time-boxed</b> — limited to a fixed period, with an end date.</li>\n        <li><b>concentration risk</b> — depending too much on one supplier, one system or one person.</li>\n        <li><b>ISMS</b> — information security management system: the rules, roles and records that manage security.</li>\n        <li><b>ITGC</b> — IT general controls: the basic access, change and operations controls that financial reporting depends on.</li>\n        <li><b>SOX</b> — the US law on financial reporting controls. <b>PCI DSS</b> — the card payment security standard.\n            <b>SOC 2</b> — an independent report on a provider's controls.</li>\n        <li><b>DORA and NIS2</b> — EU rules for the financial sector and for essential services. Both put duties on the management body.</li>\n        <li><b>KPI and KRI</b> — performance and risk measurements. <b>SIEM</b> — the platform that collects and relates security logs.</li>\n        <li><b>DPIA / transfer impact assessment</b> — checks required before using personal data in a risky or foreign context.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev xhard\">EXTREMELY HARD</span>\n      </p>\n      <p class=\"muted small\">EXTREMELY HARD - Expert. Several exercises chain three or four concepts and give you signals that pull in different directions. You will meet a legal deadline against a production stop, an audit opinion against a failing metric, and a delegation matrix that changes when a control fails. The pass mark of 70% is the site default; the difficulty comes from the reasoning, not from the threshold.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests</h4><p class=\"muted small\">The complete concept map of the keyword <b>Security Steering Committee</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Governance & Oversight</h4><div class=\"tags\"><span class=\"tag\">security governance</span><span class=\"tag\">charter / terms of reference</span><span class=\"tag\">meeting cadence</span><span class=\"tag\">quorum</span><span class=\"tag\">minutes as the official record</span><span class=\"tag\">action log</span><span class=\"tag\">decision log</span><span class=\"tag\">escalation path</span><span class=\"tag\">delegation of authority</span><span class=\"tag\">committee chair and secretary</span><span class=\"tag\">voting member and invited expert (no vote)</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Strategy, Budget & Planning</h4><div class=\"tags\"><span class=\"tag\">security strategy</span><span class=\"tag\">security roadmap</span><span class=\"tag\">security programme budget</span><span class=\"tag\">funding and resource decisions</span><span class=\"tag\">business case</span><span class=\"tag\">cost, avoided loss and benefit</span><span class=\"tag\">security architecture review board</span><span class=\"tag\">alignment with business drivers</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Enterprise Risk Management</h4><div class=\"tags\"><span class=\"tag\">risk register</span><span class=\"tag\">risk appetite</span><span class=\"tag\">risk tolerance</span><span class=\"tag\">risk treatment (mitigate, transfer, avoid, accept)</span><span class=\"tag\">inherent risk and residual risk</span><span class=\"tag\">risk score (likelihood x impact)</span><span class=\"tag\">risk owner</span><span class=\"tag\">risk acceptance request</span><span class=\"tag\">acceptance expiry and review date</span><span class=\"tag\">compensating controls</span><span class=\"tag\">supplier and concentration risk</span></div></div><div class=\"theme\"><h4>Metrics, KPIs & KRIs</h4><div class=\"tags\"><span class=\"tag\">KPI (key performance indicator)</span><span class=\"tag\">KRI (key risk indicator)</span><span class=\"tag\">MTTD (mean time to detect)</span><span class=\"tag\">patch SLA compliance</span><span class=\"tag\">phishing simulation failure rate</span><span class=\"tag\">control testing pass rate</span><span class=\"tag\">exception volume</span><span class=\"tag\">trend reporting</span><span class=\"tag\">red / amber / green thresholds</span><span class=\"tag\">board reporting pack</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Compliance, Audit & Standards</h4><div class=\"tags\"><span class=\"tag\">ISO/IEC 27001 clause 9.3 (management review)</span><span class=\"tag\">NIST CSF 2.0 Govern function (GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC)</span><span class=\"tag\">PCI DSS requirement 12.4</span><span class=\"tag\">SOC 2 CC1.2 (control environment)</span><span class=\"tag\">SOX ITGC and material weakness</span><span class=\"tag\">GDPR accountability and 72-hour breach notification</span><span class=\"tag\">DORA (management body responsibility for ICT risk)</span><span class=\"tag\">NIS2 (management body approval and accountability)</span><span class=\"tag\">internal audit and audit committee</span><span class=\"tag\">nonconformity and observation</span><span class=\"tag\">management response</span><span class=\"tag\">remediation limits and tracking</span><span class=\"tag\">evidence and record retention</span><span class=\"tag\">exception register</span><span class=\"tag\">policy approval and review cycle</span></div></div><div class=\"theme\"><h4>Roles & Stakeholders</h4><div class=\"tags\"><span class=\"tag\">CISO</span><span class=\"tag\">CIO</span><span class=\"tag\">CFO</span><span class=\"tag\">CRO (chief risk officer)</span><span class=\"tag\">legal counsel</span><span class=\"tag\">DPO / privacy officer</span><span class=\"tag\">internal audit observer</span><span class=\"tag\">business risk owner</span><span class=\"tag\">service owner</span><span class=\"tag\">invited expert with no vote</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Operational Integration</h4><div class=\"tags\"><span class=\"tag\">major incident escalation to the committee</span><span class=\"tag\">crisis management (incident bridge)</span><span class=\"tag\">post-incident review</span><span class=\"tag\">change advisory board (CAB) interface</span><span class=\"tag\">security exception and waiver</span><span class=\"tag\">project security gates</span><span class=\"tag\">vendor onboarding approval</span><span class=\"tag\">M&A due diligence</span><span class=\"tag\">cloud migration governance</span><span class=\"tag\">security awareness programme approval</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Assurance & Continuous Improvement</h4><div class=\"tags\"><span class=\"tag\">management review inputs and outputs</span><span class=\"tag\">internal audit programme</span><span class=\"tag\">supplier audit reports (SOC 2) and penetration tests</span><span class=\"tag\">control design and operating effectiveness</span><span class=\"tag\">continual improvement</span><span class=\"tag\">regulatory notification duty</span><span class=\"tag\">governance failures (no quorum, no minutes, silent risk acceptance)</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit — defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> — written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise — including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Security Steering Committee - standalone certification exam engine
   Vanilla JS. No libraries, no external requests.
   Layout contract: every exercise renders SCENARIO / QUESTION / YOUR ANSWER
   as three labelled blocks, with the feedback block below them.
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false,
         scenCollapsed:{}, reported:false, reviewing:false, focusTarget:null};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g, ''); }
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function flash(msg){
  var f = $('#flashBox');
  if(!f){ return; }
  f.textContent = msg;
  f.style.display='block';
}
function scrollTop(){ try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._exLeft = x.timeLimit || 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'grc-suite 4.2 - governance console')+' - session started</div>',
              '<div class="to">Type the command for the current step, then press Enter. Nothing is executed for real.</div>'];
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.scenCollapsed = {};
  S.reported = false;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
  updateExTimer();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
  exTick();
}
function exTick(){
  if(S.paused || S.done || !S.started){ return; }
  /* the time box of every open time-boxed exercise runs, even if the student
     navigates to another exercise in the meantime */
  S.pool.forEach(function(x){
    if(!x.timeLimit){ return; }
    var r = S.res[x.id];
    if(r && (r.status !== 'skipped' || r.timedout)){ return; }
    if(x._exLeft <= 0){ return; }
    x._exLeft--;
    if(x._exLeft <= 0){ expireExercise(x); }
  });
  updateExTimer();
}
function updateExTimer(){
  var el = $('#exTimer');
  if(!el){ return; }
  var x = S.pool[S.idx];
  if(!x || !x.timeLimit){ return; }
  el.textContent = '⏱ ' + fmt(x._exLeft) + ' left for this exercise';
  el.className = 'exTimer' + (x._exLeft <= 60 ? ' low' : '');
}
function expireExercise(x){
  S.res[x.id] = {status:'skipped', earned:0, given:null, hints:S.hints[x.id]||0, timedout:true};
  if(S.skipped.indexOf(x.id) < 0){ S.skipped.push(x.id); }
  if(S.pool[S.idx] === x){
    renderExam();
    flash('⏱ The time box for this exercise is over. It is closed now and excluded from the score.');
  } else {
    updateHUD();
  }
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.setAttribute('role','dialog');
    ov.setAttribute('aria-modal','true');
    ov.setAttribute('aria-label','Timer paused');
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">Both the exam countdown and the time box of a single exercise are stopped.</p>'+
      '<button class="btn primary" id="resumeBtn" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
    var stg = $('#stage');
    if(stg){
      stg.setAttribute('aria-hidden','true');
      try{ stg.inert = true; }catch(e){}
    }
    var rb = $('#resumeBtn');
    if(rb && rb.focus){ try{ rb.focus(); }catch(e){} }
  } else {
    ov.style.display = 'none';
    ov.removeAttribute('aria-modal');
    var stg2 = $('#stage');
    if(stg2){
      stg2.removeAttribute('aria-hidden');
      try{ stg2.inert = false; }catch(e){}
    }
  }
  updateHUD();
  updateExTimer();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill2 = sc.parentNode;
      if(pill2 && pill2.classList){
        pill2.classList.remove('bump');
        void pill2.offsetWidth;
        pill2.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg');
  if(pr){
    pr.style.width = pct + '%';
    pr.setAttribute('aria-valuenow', String(pct));
  }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn');
  if(pb){
    pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause';
    pb.disabled = S.done || !S.started;
  }
  var cn = $('#hudCount');
  if(cn){
    cn.textContent = S.done ? 'Results and detailed report'
                    : S.reviewing ? 'Review skipped exercises'
                    : (S.started && S.pool.length) ? ('Exercise ' + (S.idx+1) + ' of ' + S.pool.length)
                    : 'Exam briefing';
  }
  var x = S.pool[S.idx];
  var r = x ? S.res[x.id] : null;
  var locked = !S.started || S.done || S.reviewing || !x || (r && (r.status !== 'skipped' || r.timedout));
  var ht = $('#hintTop');
  if(ht){
    var used = x && S.hints[x.id];
    ht.disabled = !!locked || !!used;
    ht.textContent = used ? '💡 Hint used' : '💡 Hint −10%';
  }
  var stp = $('#skipTop');
  if(stp){ stp.disabled = !!locked; }
}

/* --------------------------- layout: artefacts ------------------------- */
function artefactBody(a){
  var h = '';
  if(a.kind==='log'){
    h += '<input class="logfilter" aria-label="Filter the log lines" placeholder="filter lines (like Kibana / Splunk) ..." oninput="filterLog(this)" />';
    h += '<div class="logbox">';
    (a.lines||[]).forEach(function(ln){
      var lv = ln[0]||'', txt = ln[1]||'';
      h += '<div class="logline lvline-'+esc(lv)+'" data-t="'+esc((lv+' '+txt).toLowerCase())+'">';
      if(lv){ h += '<span class="lv lv-'+esc(lv)+'">'+esc(lv)+'</span>'; }
      h += esc(txt)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='table'){
    h += '<input class="logfilter" aria-label="Filter the table rows" placeholder="filter rows (like a governance dashboard) ..." oninput="filterRows(this)" />';
    h += '<table class="art"><thead><tr>';
    (a.head||[]).forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    (a.rows||[]).forEach(function(r){
      h += '<tr data-t="'+esc(r.join(' ').toLowerCase())+'">';
      r.forEach(function(c){ h += '<td>'+esc(c)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table>';
  } else if(a.kind==='email'){
    h += '<div class="emailbody">';
    (a.lines||[]).forEach(function(ln,i){
      h += '<div class="'+(i===0?'subj':'')+'">'+esc(ln)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='doc' || a.kind==='minutes' || a.kind==='config'){
    h += '<div class="docbody">';
    (a.lines||[]).forEach(function(ln){
      var cls = (String(ln).indexOf('##')===0) ? 'h' : '';
      h += '<div class="'+cls+'">'+esc(String(ln).replace(/^##\s*/,''))+'</div>';
    });
    h += '</div>';
  } else {
    (a.lines||[]).forEach(function(ln){ h += '<div class="logline">'+esc(ln)+'</div>'; });
  }
  return h;
}
function artefactList(x){
  if(x.artefacts && x.artefacts.length){ return x.artefacts; }
  if(x.artifact){ return [x.artifact]; }
  return [];
}
function artefactsHTML(x){
  var list = artefactList(x);
  var h = '';
  list.forEach(function(a, i){
    var label = a.label || ('ARTEFACT ' + (i+1) + ' — ' + (a.title || a.kind || 'evidence'));
    h += '<div class="artpanel" role="group" aria-label="'+esc(label)+'">';
    h += '<div class="alabel">'+esc(label)+'</div>';
    h += '<div class="abody">'+artefactBody(a)+'</div>';
    h += '</div>';
  });
  return h;
}
function filterLog(inp){
  var q = inp.value.toLowerCase().trim();
  var box = inp.parentNode.querySelector('.logbox') || inp.parentNode;
  $$('.logline', box).forEach(function(el){
    var hit = !q || (el.getAttribute('data-t')||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
}
function filterRows(inp){
  var q = inp.value.toLowerCase().trim();
  var table = inp.parentNode.querySelector('table.art');
  if(!table){ return; }
  $$('tbody tr', table).forEach(function(tr){
    var hit = !q || (tr.getAttribute('data-t')||'').indexOf(q) >= 0;
    tr.style.display = hit ? '' : 'none';
  });
}

/* ------------------------------ layout blocks -------------------------- */
function sevPill(){
  return '<span class="sev '+EXAM.sevClass+'">'+esc(EXAM.severity)+'</span>';
}
function blockHead(cls, icon, label, right){
  return '<div class="bhead '+cls+'"><span class="bhl"><span class="ic" aria-hidden="true">'+icon+'</span> '+label+'</span>'+
         (right || '') + '</div>';
}
function scenarioBlock(x){
  var collapsed = !!S.scenCollapsed[x.id];
  var summary = esc(x.brief || x.title);
  var h = '<section class="block scenario'+(collapsed?' collapsed':'')+'" id="scen-'+esc(x.id)+'" aria-label="Scenario">';
  h += blockHead('blue', '▤', 'SCENARIO',
        '<button type="button" class="collapsebtn" aria-expanded="'+(collapsed?'false':'true')+'" '+
        'onclick="toggleScenario(\''+esc(x.id)+'\')">'+(collapsed?'Show scenario':'Hide scenario')+'</button>');
  h += '<div class="bbody">';
  if(x.brief){ h += '<div class="brief">'+esc(x.brief)+'</div>'; }
  if(x.scenario){ h += '<div class="scenario">'+x.scenario+'</div>'; }
  if(x.objective){ h += '<div class="objline"><b>Objective:</b> '+esc(x.objective)+'</div>'; }
  h += artefactsHTML(x);
  if(x.timeLimit){
    h += '<div class="timelimitNote">⏱ <b>Time-boxed exercise:</b> this exercise has its own '+
         Math.round(x.timeLimit/60)+'-minute countdown, shown next to the QUESTION header. '+
         'The exam timer keeps running as well.</div>';
  }
  h += '</div>';
  h += '<div class="bsummary">'+summary+' — collapsed</div>';
  h += '</section>';
  return h;
}
function toggleScenario(id){
  S.scenCollapsed[id] = !S.scenCollapsed[id];
  var el = $('#scen-'+id);
  if(!el){ return; }
  el.classList.toggle('collapsed', !!S.scenCollapsed[id]);
  var btn = el.querySelector('.collapsebtn');
  if(btn){
    btn.textContent = S.scenCollapsed[id] ? 'Show scenario' : 'Hide scenario';
    btn.setAttribute('aria-expanded', S.scenCollapsed[id] ? 'false' : 'true');
  }
}
function questionBlock(x){
  var right = '';
  if(x.timeLimit){ right = '<span class="exTimer" id="exTimer" role="timer">⏱ '+fmt(x._exLeft)+' left for this exercise</span>'; }
  else if(x.type==='branch'){ right = '<span class="badge">STEP '+Math.min(x._node+1, x.nodes.length)+' OF '+x.nodes.length+'</span>'; }
  var h = '<section class="block question" aria-label="Question">';
  h += blockHead('amber', '❓', 'QUESTION', right);
  h += '<div class="bbody">';
  if(x.type==='branch'){
    var n = x.nodes[x._node];
    h += '<p class="qtext">'+(n ? esc(stripTags(n.text).replace(/^Decision\s*\d+\.\s*/i,'')) : 'Decision path complete. Click Check answer.')+'</p>';
  } else if(x.type==='terminal'){
    h += '<p class="qtext" id="termGoal">Loading the current step ...</p>';
  } else {
    h += '<p class="qtext">'+esc(x.prompt)+'</p>';
  }
  h += '</div></section>';
  return h;
}
function actionsHTML(x){
  return '<div class="qactions">'+
       '<button type="button" class="btn primary" onclick="submitAnswer()">Check answer</button>'+
       '<button type="button" class="btn ghost" onclick="showHint()" id="hintBtn"'+(x._hint ? ' disabled' : '')+'>'+
         (x._hint ? '💡 Hint used' : '💡 Hint −10% of this exercise')+'</button>'+
       '<button type="button" class="btn warn" onclick="skipCurrent()" id="skipBtn">⤼ Skip exercise</button>'+
       '</div>';
}
function answerBlock(x){
  var r = S.res[x.id];
  var locked = !!(r && (r.status !== 'skipped' || r.timedout));
  var h = '<section class="block answer" aria-label="Your answer">';
  h += blockHead('green', '✎', 'YOUR ANSWER');
  h += '<div class="bbody">';
  if(locked){
    h += staticHTML(x, r);
  } else {
    if(r && r.status === 'skipped'){
      h += '<div class="tip" style="border-left-color:var(--skip);background:#1a1508">'+
           '<b>⚠ Skipped exercise.</b> It is in your review pool. Answer it now, or skip it again and return later from the review screen.</div>';
    }
    if(x.type==='mcq'||x.type==='multi'||x.type==='log'){ h += optHTML(x); }
    else if(x.type==='order'||x.type==='rank'){ h += sortHTML(x); }
    else if(x.type==='classify'){ h += classifyHTML(x); }
    else if(x.type==='fill'){ h += fillHTML(x); }
    else if(x.type==='match'){ h += matchHTML(x); }
    else if(x.type==='terminal'){ h += termHTML(x); }
    else if(x.type==='branch'){ h += branchHTML(x); }
    h += actionsHTML(x);
  }
  h += '<div class="hintbox" id="hintBox" style="display:none"></div>';
  h += '<div class="flash" id="flashBox" style="display:none" role="status"></div>';
  h += '</div></section>';
  return h;
}
function canonicalHTML(x){
  if(!x.canonical || !x.canonical.length){ return ''; }
  var h = '<div class="canonical"><h4>Canonical command(s) — copy them</h4>';
  x.canonical.forEach(function(c){
    h += '<pre class="cmd"><code>'+esc(c.cmd)+'</code></pre>';
    if(c.parts && c.parts.length){
      h += '<ul class="cmdparts">';
      c.parts.forEach(function(p){ h += '<li>'+esc(p)+'</li>'; });
      h += '</ul>';
    }
  });
  if(x.dangerNote){ h += '<div class="tip" style="border-left-color:var(--bad);background:#2a0f12"><b>Dangerous near miss:</b> '+x.dangerNote+'</div>'; }
  return h + '</div>';
}
function feedbackBlock(x, r){
  if(!r){ return ''; }
  var cls, icon, word;
  if(r.status === 'correct'){ cls='ok'; icon='✔'; word='CORRECT'; }
  else if(r.status === 'wrong'){ cls='bad'; icon='✗'; word='INCORRECT'; }
  else { cls='na'; icon='⚠'; word='NOT ANSWERED — EXCLUDED'; }
  var h = '<section class="fb '+cls+'" id="feedback" tabindex="-1" aria-label="Feedback">';
  h += '<div class="fbhead"><span class="bhl"><span class="ic" aria-hidden="true">'+icon+'</span> '+word+'</span>';
  if(r.status !== 'skipped'){ h += '<span class="fpts">'+r.earned+' / '+MAXPTS+' pts</span>'; }
  h += '</div><div class="fbbody">';
  if(r.status === 'skipped'){
    h += '<p class="muted"><b>Not answered — excluded from score.</b> '+
         (r.timedout ? 'The time box of this exercise ended before you answered it. ' : 'You skipped this exercise and did not come back to it. ')+
         'It did not count as right or wrong, and its points were not added to the total possible points.</p>';
  } else {
    h += '<div class="ansline"><div><span class="lbl">Your answer</span>'+esc(yourText(x, r.given))+'</div>'+
         '<div><span class="lbl">Correct answer</span>'+esc(correctText(x))+'</div></div>';
  }
  h += '<p class="exp">'+x.explain+'</p>';
  if(x.type === 'terminal'){ h += canonicalHTML(x); }
  if(r.status !== 'correct' && x.tip){ h += '<div class="tip"><b>What to study:</b> '+x.tip+'</div>'; }
  if(r.penalty && r.status === 'correct'){ h += '<div class="tip" style="border-left-color:var(--warn);background:#2a2008">'+
      '<b>Points lost:</b> −'+r.penalty+' (−'+r.hints+' from hints, −'+r.wrongCmds+' from wrong commands).</div>'; }
  h += '</div></section>';
  return h;
}
function sidePanel(){
  var h = '<aside class="side card"><h3>Exercise map</h3><div class="chips">';
  S.pool.forEach(function(x,i){
    var r = S.res[x.id], c = 'chipbtn';
    if(i===S.idx){ c += ' cur'; }
    if(r && r.status==='correct'){ c += ' good'; }
    else if(r && r.status==='wrong'){ c += ' bad'; }
    else if(S.skipped.indexOf(x.id) >= 0){ c += ' skip'; }
    h += '<button type="button" class="'+c+'" onclick="gotoIdx('+i+')" title="'+esc(x.title)+'">'+(i+1)+'</button>';
  });
  h += '</div>';
  h += '<div class="legend">'+
       '<span><i style="background:var(--ok)"></i>answered and correct</span>'+
       '<span><i style="background:var(--bad)"></i>answered and wrong</span>'+
       '<span><i style="background:var(--skip)"></i>skipped (in review pool)</span>'+
       '<span><i style="background:#101d33;border:1px solid #2c4266"></i>not answered yet</span>'+
       '</div>';
  h += '<div class="qactions" style="flex-direction:column">';
  h += '<button type="button" class="btn small" onclick="finishFlow()">Review skipped &amp; finish</button>';
  h += '<button type="button" class="btn small ghost" onclick="togglePause()">'+(S.paused?'Resume timer':'Pause timer')+'</button>';
  h += '</div>';
  h += '<p class="muted small" style="margin-top:.6rem">Passing score: <b>'+EXAM.passScore+'%</b> of the answered exercises. '+
       'Skipped exercises that stay unanswered are excluded from the score.</p>';
  return h + '</aside>';
}

/* ------------------------ interactive answer widgets ------------------- */
function optHTML(x){
  var multi = (x.correct && x.correct.length>1) || x.type==='multi';
  var h = '<div class="opts" role="group" aria-label="Answer options">';
  x._opts.forEach(function(o,i){
    h += '<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="'+esc(x.id)+'" value="'+i+'">'+
         '<span class="mk">'+String.fromCharCode(65+i)+'.</span><span class="otxt">'+esc(o.t)+'</span></label>';
  });
  h += '</div>' + (multi ? '<p class="muted small">Select every correct answer (more than one).</p>' : '');
  return h;
}
function sortHTML(x){
  var h = '<ul class="sortlist" id="sort-'+esc(x.id)+'">';
  x._display.forEach(function(t){
    h += '<li draggable="true"><span class="grip" aria-hidden="true">⠿</span><span class="txt">'+esc(t)+'</span>'+
         '<span class="mv"><button type="button" class="mvbtn" aria-label="Move up" onclick="moveItem(this,-1)">▲</button>'+
         '<button type="button" class="mvbtn" aria-label="Move down" onclick="moveItem(this,1)">▼</button></span></li>';
  });
  h += '</ul>';
  h += '<p class="muted small">Drag the rows (or use ▲ ▼) '+
       (x.type==='rank' ? 'to rank them from the highest priority (top) to the lowest (bottom).'
                        : 'to put them in the correct order (first step on top).')+'</p>';
  return h;
}
function classifyHTML(x){
  var h = '<div class="bank" id="bank-'+esc(x.id)+'">';
  x._items.forEach(function(it,i){
    h += '<button type="button" class="chip" draggable="true" data-t="'+esc(it.text)+'" data-i="'+i+'" onclick="pickChip(this)">'+esc(it.text)+'</button>';
  });
  h += '</div>';
  h += '<p class="muted small">Drag each card into a box below, or select a card and then select a box (keyboard: Tab to the card, then Enter).</p>';
  h += '<div class="buckets">';
  x.buckets.forEach(function(b){
    h += '<div class="bucket" data-b="'+esc(b)+'" ondragover="dragOver(event,this)" ondragleave="dragLeave(this)" ondrop="dropChip(event,this)">'+
         '<h4>'+esc(b)+'</h4><div class="drop" role="group" aria-label="'+esc(b)+'" tabindex="0" onclick="dropPicked(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();dropPicked(this);}"></div></div>';
  });
  return h + '</div>';
}
function fillHTML(x){
  var parts = String(x.text).split(/\[\[(\d+)\]\]/);
  var h = '<div class="filltext">';
  parts.forEach(function(p){
    if(/^\d+$/.test(p)){
      h += '<button type="button" class="slot empty" data-i="'+p+'" aria-label="Blank '+p+'" onclick="dropPicked(this)" ondragover="dragOver(event,this)" ondrop="dropChip(event,this)">'+
           '<span class="ph">…</span></button>';
    } else {
      h += esc(p);
    }
  });
  h += '</div><div class="bank" id="bank-'+esc(x.id)+'">';
  x._bank.forEach(function(w){
    h += '<button type="button" class="chip" draggable="true" data-t="'+esc(w)+'" onclick="pickChip(this)">'+esc(w)+'</button>';
  });
  h += '</div><p class="muted small">Select a word, then select a blank. Select a filled blank to send the word back.</p>';
  return h;
}
function matchHTML(x){
  var h = '<table class="match"><tbody>';
  x.pairs.forEach(function(p,i){
    h += '<tr id="mrow-'+esc(x.id)+'-'+i+'"><td class="l">'+esc(p.left)+'</td><td>'+
         '<select aria-label="Answer for '+esc(p.left)+'" data-left="'+esc(p.left)+'"><option value="">-- choose --</option>';
    x._pool.forEach(function(r){ h += '<option value="'+esc(r)+'">'+esc(r)+'</option>'; });
    h += '</select></td></tr>';
  });
  return h + '</tbody></table>';
}
function syntaxPanel(x){
  var s = x.syntax;
  if(!s){ return ''; }
  var h = '<div class="syntaxpanel"><h5>Syntax reminder</h5>';
  h += '<p><b>Tool:</b> '+esc(s.tool)+'</p>';
  h += '<p class="muted small">'+esc(s.what)+'</p>';
  h += '<p><b>Shape:</b> <code>'+esc(s.shape)+'</code></p>';
  if(s.options && s.options.length){
    h += '<ul class="tight small">';
    s.options.forEach(function(o){ h += '<li><code>'+esc(o[0])+'</code> — '+esc(o[1])+'</li>'; });
    h += '</ul>';
  }

  }

}

/* ------------------------------ drag helpers --------------------------- */
var DRAGGED = null, PICKED = null;
function enableDrag(){
  $$('.chip[draggable="true"]').forEach(function(c){
    c.addEventListener('dragstart', function(e){
      DRAGGED = c;
      try{ e.dataTransfer.setData('text/plain', c.getAttribute('data-t')); }catch(err){}
      c.style.opacity = .5;
    });
    c.addEventListener('dragend', function(){ c.style.opacity = 1; DRAGGED = null; });
  });
  $$('.sortlist li').forEach(function(li){
    li.addEventListener('dragstart', function(e){
      DRAGGED = li; li.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain','x'); }catch(err){}
    });
    li.addEventListener('dragend', function(){ li.classList.remove('dragging'); DRAGGED = null; });
    li.addEventListener('dragover', function(e){ e.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', function(){ li.classList.remove('over'); });
    li.addEventListener('drop', function(e){
      e.preventDefault(); li.classList.remove('over');
      if(DRAGGED && DRAGGED !== li && DRAGGED.parentNode === li.parentNode){
        var nodes = Array.prototype.slice.call(li.parentNode.children);
        if(nodes.indexOf(DRAGGED) < nodes.indexOf(li)){ li.parentNode.insertBefore(DRAGGED, li.nextSibling); }
        else { li.parentNode.insertBefore(DRAGGED, li); }
      }
    });
  });
}
function moveItem(btn, dir){
  var li = btn.closest('li');
  if(!li){ return; }
  var sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
  if(!sib){ return; }
  if(dir < 0){ li.parentNode.insertBefore(li, sib); }
  else { li.parentNode.insertBefore(sib, li); }
  try{ btn.focus(); }catch(e){}
}
function pickChip(chip){
  if(chip.classList.contains('placed')){ returnToBank(chip); return; }
  if(PICKED === chip){ chip.classList.remove('sel'); PICKED = null; return; }
  if(PICKED){ PICKED.classList.remove('sel'); }
  PICKED = chip;
  chip.classList.add('sel');
}
function returnToBank(chip){
  var bank = $('.bank');
  var old = chip.parentNode;
  if(bank){ bank.appendChild(chip); chip.classList.remove('placed'); }
  if(old && old.classList && old.classList.contains('slot')){
    old.classList.remove('filled');
    old.classList.add('empty');
    old.innerHTML = '<span class="ph">…</span>';
  }
}
function dragOver(e, el){ e.preventDefault(); el.classList.add('hot'); }
function dragLeave(el){ el.classList.remove('hot'); }
function dropChip(e, el){
  e.preventDefault(); el.classList.remove('hot');
  placeChip(DRAGGED, el);
  DRAGGED = null; PICKED = null;
}
function placeChip(chip, el){
  if(!chip || !el){ return; }
  var target = el.classList.contains('bucket') ? $('.drop', el) : el;
  if(!target){ return; }
  if(target.classList.contains('slot')){
    var old = target.querySelector('.chip');
    if(old && old !== chip){ returnToBank(old); }
    target.innerHTML = '';
    target.classList.add('filled');
    target.classList.remove('empty');
  }
  target.appendChild(chip);
  chip.classList.add('placed');
  chip.classList.remove('sel');
}
function dropPicked(el){
  if(!PICKED){ return; }
  var chip = PICKED;
  PICKED = null;
  placeChip(chip, el);
}


/* ------------------------------ read answers --------------------------- */
function readAnswer(x){
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    var sel = $$('input[name="'+x.id+'"]:checked').map(function(i){ return parseInt(i.value,10); });
    if(!sel.length){ return {ok:false, msg:'Choose an answer first.'}; }
    return {ok:true, value:sel};
  }
  if(x.type==='order'||x.type==='rank'){
    var v = $$('#sort-'+x.id+' .txt').map(function(e){ return e.textContent; });
    if(v.length !== x.items.length){ return {ok:false, msg:'Something went wrong with the list.'}; }
    return {ok:true, value:v};
  }
  if(x.type==='classify'){
    var map = {}, placed = 0;
    $$('.bucket').forEach(function(b){
      var bn = b.getAttribute('data-b');
      $$('.drop .chip', b).forEach(function(c){ map[c.getAttribute('data-t')] = bn; placed++; });
    });
    if(placed < x._items.length){ return {ok:false, msg:'Place every card in a box first ('+placed+'/'+x._items.length+' placed).'}; }
    return {ok:true, value:map};
  }
  if(x.type==='fill'){
    var words = [];
    $$('.slot').forEach(function(s){
      var c = s.querySelector('.chip');
      words.push(c ? c.getAttribute('data-t') : '');
    });
    if(words.indexOf('') >= 0){ return {ok:false, msg:'Fill every blank first.'}; }
    return {ok:true, value:words};
  }
  if(x.type==='match'){
    var m = {}, empty = 0;
    $$('table.match select').forEach(function(s){
      if(!s.value){ empty++; }
      m[s.getAttribute('data-left')] = s.value;
    });
    if(empty){ return {ok:false, msg:'Choose a value for every line ('+empty+' left empty).'}; }
    return {ok:true, value:m};
  }
  if(x.type==='terminal'){
    if(x._step < x.steps.length){ return {ok:false, msg:'Complete every command step first ('+x._step+'/'+x.steps.length+' done).'}; }
    return {ok:true, value:{steps:x.steps.length, wrong:x._wrong}};
  }
  if(x.type==='branch'){
    if(x._node < x.nodes.length){ return {ok:false, msg:'Finish the decision path first.'}; }
    return {ok:true, value:{firstTry:x._firstTry, wrong:x._wrongPicks}};
  }
  return {ok:false, msg:'Unknown exercise type.'};
}

/* -------------------------------- scoring ------------------------------ */
function scoreAnswer(x, v){
  if(x.type==='mcq'||x.type==='log'){
    return {correct: v.length===1 && x._opts[v[0]].ok};
  }
  if(x.type==='multi'){
    var chosenOk = v.every(function(i){ return x._opts[i].ok; });
    var allOk = x._opts.filter(function(o){ return o.ok; }).length === v.length;
    return {correct: chosenOk && allOk};
  }
  if(x.type==='order'||x.type==='rank'){
    var same = v.length === x.items.length && v.every(function(t,i){ return t === x.items[i]; });
    return {correct:same};
  }
  if(x.type==='classify'){
    var ok = x._items.every(function(it){ return v[it.text] === it.bucket; });
    return {correct:ok};
  }
  if(x.type==='fill'){
    var okf = x.blanks.every(function(b,i){ return v[i] === b; });
    return {correct:okf};
  }
  if(x.type==='match'){
    var okm = x.pairs.every(function(p){ return v[p.left] === p.right; });
    return {correct:okm};
  }
  if(x.type==='terminal'){ return {correct:true}; }
  if(x.type==='branch'){ return {correct: v.firstTry === true}; }
  return {correct:false};
}
function submitAnswer(){
  var x = S.pool[S.idx];
  var r = S.res[x.id];
  if(r && (r.status !== 'skipped' || r.timedout)){ return; }
  var got = readAnswer(x);
  if(!got.ok){ flash(got.msg); return; }
  var sc = scoreAnswer(x, got.value);
  var used = S.hints[x.id] || 0;
  /* terminal exercises: every wrong command costs 1 point (10% of the exercise), like a hint */
  var wrongCmds = (x.type === 'terminal') ? Math.min(MAXPTS, x._wrong || 0) : 0;
  var penalty = used*HINTCOST + wrongCmds;
  var earned = sc.correct ? Math.max(0, MAXPTS - penalty) : 0;
  S.res[x.id] = {status: sc.correct ? 'correct':'wrong', earned:earned, given:got.value,
                 hints:used, penalty:penalty, wrongCmds:wrongCmds};
  var k = S.skipped.indexOf(x.id);
  if(k >= 0){ S.skipped.splice(k,1); }
  S.focusTarget = 'feedback';
  renderExam();
  scrollTop();
}
function showHint(){
  var x = S.pool[S.idx];
  if(!x){ return; }
  var box = $('#hintBox');
  if(!box){ return; }
  if(S.hints[x.id]){
    box.style.display='block';
    box.innerHTML = '<b>Hint already used.</b> '+x.hint;
    return;
  }
  S.hints[x.id] = 1;
  x._hint = 1;
  box.style.display = 'block';
  box.innerHTML = '<b>Hint (−10% of this exercise):</b> '+x.hint+
                  '<div class="muted small" style="margin-top:.3rem">A hint does not give the answer. It only points you to the right area.</div>';
  var b = $('#hintBtn'); if(b){ b.disabled = true; b.textContent = '💡 Hint used'; }
  var bt = $('#hintTop'); if(bt){ bt.disabled = true; bt.textContent = '💡 Hint used'; }
  updateHUD();
}
function skipCurrent(){
  var x = S.pool[S.idx];
  var r = S.res[x.id];
  if(r && (r.status !== 'skipped' || r.timedout)){ return; }
  S.res[x.id] = {status:'skipped', earned:0, given:null, hints:S.hints[x.id]||0};
  if(S.skipped.indexOf(x.id) < 0){ S.skipped.push(x.id); }
  var nxt = nextPendingIndex(S.idx+1);
  if(nxt >= 0){ S.idx = nxt; }
  renderExam();
  scrollTop();
}
function nextPendingIndex(from){
  for(var i=from;i<S.pool.length;i++){
    var r = S.res[S.pool[i].id];
    if(!r || r.status==='skipped'){ return i; }
  }
  for(var j=0;j<from && j<S.pool.length;j++){
    var r2 = S.res[S.pool[j].id];
    if(!r2 || r2.status==='skipped'){ return j; }
  }
  return -1;
}
function nextPending(){
  var n = nextPendingIndex(S.idx+1);
  if(n >= 0){ gotoIdx(n); } else { finishFlow(); }
}
function gotoIdx(i){
  if(i<0 || i>=S.pool.length){ return; }
  S.idx = i; renderExam(); scrollTop();
}

/* ---------------------------- answer rendering ------------------------- */
function correctText(x){
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    return x._opts.filter(function(o){ return o.ok; }).map(function(o){ return o.t; }).join(' | ');
  }
  if(x.type==='order'||x.type==='rank'){ return x.items.join(' → '); }
  if(x.type==='classify'){
    return x._items.map(function(it){ return it.text+' → '+it.bucket; }).join(' · ');
  }
  if(x.type==='fill'){ return x.blanks.join(' | '); }
  if(x.type==='match'){ return x.pairs.map(function(p){ return p.left+' → '+p.right; }).join(' · '); }
  if(x.type==='terminal'){ return 'Every command step completed ('+x.steps.length+'/'+x.steps.length+').'; }
  if(x.type==='branch'){ return 'Every decision taken correctly on the first try.'; }
  return '';
}
function yourText(x, v){
  if(!v){ return '(nothing)'; }
  if(x.type==='mcq'||x.type==='multi'||x.type==='log'){
    return v.map(function(i){ return x._opts[i] ? x._opts[i].t : '?'; }).join(' | ');
  }
  if(x.type==='order'||x.type==='rank'){ return v.join(' → '); }
  if(x.type==='classify'){
    return x._items.map(function(it){ return it.text+' → '+(v[it.text]||'not placed'); }).join(' · ');
  }
  if(x.type==='fill'){ return v.join(' | '); }
  if(x.type==='match'){
    return x.pairs.map(function(p){ return p.left+' → '+(v[p.left]||'not chosen'); }).join(' · ');
  }
  if(x.type==='terminal'){ return 'Commands completed: '+v.steps+', wrong commands typed: '+v.wrong+'.'; }
  if(x.type==='branch'){ return v.firstTry ? 'All decisions correct on the first try.' :
      'The path was finished, but '+v.wrong+' decision(s) were wrong before you found the right one.'; }
  return '';
}
function staticHTML(x, r){

  if(x.type==='order'||x.type==='rank'){

  }

      mr += '<tr class="'+(mine === p.right ? 'ok' : 'bad')+'"><td>'+esc(p.left)+'</td><td>'+esc(mine)+'</td><td>'+esc(p.right)+'</td></tr>';
    });

  }

           '<div><span class="lbl">Correct words</span>'+esc(x.blanks.join(' | '))+'</div></div>';

/* ------------------------------- terminal ------------------------------ */
function normaliseCmd(cmd){
  var s = String(cmd||'').trim();
  s = s.replace(/^\$\s*/, '');                 /* a pasted shell prompt */
  s = s.replace(/\s+/g, ' ');                  /* collapse spaces */
  s = s.replace(/\s*=\s*/g, '=');              /* --flag = value -> --flag=value */
  s = s.replace(/(--[a-z0-9-]+)=/g, '$1 ');    /* --flag=value -> --flag value */
  s = s.replace(/\s*(>>|>)\s*/g, ' $1 ');      /* >> must be normalised before > */
  s = s.replace(/\s*\/\s*$/, '');              /* a trailing slash */
  return s.toLowerCase().trim();
}
function wireTerminal(x){
  var inp = $('#termIn');
  if(!inp){ return; }
  inp.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){
      var cmd = inp.value;
      inp.value = '';
      runTerm(x, cmd.trim());
    }
  });
  try{ inp.focus(); }catch(e){}
}
function runTerm(x, cmd){
  if(!cmd){ return; }
  x._log.push('<div class="tl"><span class="tp">analyst@ws:~$</span> '+esc(cmd)+'</div>');
  if(x._step >= x.steps.length){
    x._log.push('<div class="to">Every required command is already done. Click “Check answer”.</div>');
  } else {
    var st = x.steps[x._step];
    var norm = normaliseCmd(cmd);
    var hit = false;
    (st.accept||[]).forEach(function(rx){
      try{ if(new RegExp(rx,'i').test(norm)){ hit = true; } }catch(e){}
    });
    if(hit){
      x._log.push('<div class="to okout">'+st.out+'</div>');
      x._step++;
    } else {
      x._wrong++;
      var danger = '';
      (st.danger||[]).forEach(function(d){
        try{ if(new RegExp(d[0],'i').test(norm)){ danger = d[1]; } }catch(e){}
      });
      x._log.push('<div class="to errout">'+esc(danger || st.err || 'This command does not do what this step needs.')+'</div>');
      if(danger){ x._log.push('<div class="to">It still counts as a wrong command: −1 point. Re-read the objective and try again.</div>'); }
    }
  }
  paintTerm(x);
}
function paintTerm(x){
  var box = $('#termOut');
  if(box){ box.innerHTML = (x._log||[]).join(''); box.scrollTop = box.scrollHeight; }
  var g = $('#termGoal');
  if(g){
    if(x._step >= x.steps.length){
      g.innerHTML = '<b>All steps done.</b> Click “Check answer” to score this exercise.';
    } else {
      var st = x.steps[x._step];
      g.innerHTML = '<b>Step '+(x._step+1)+' of '+x.steps.length+':</b> '+esc(st.goal);
    }
  }
}

/* --------------------------------- branch ------------------------------ */
function branchPick(i){
  var x = S.pool[S.idx];
  if(x.type !== 'branch' || x._node >= x.nodes.length){ return; }
  var n = x.nodes[x._node];
  var o = n.options[i];
  var fb = $('#bfb');
  if(!fb){ return; }
  if(o.ok){
    fb.className = 'bfb okfb';
    fb.innerHTML = '<b>✔ Good decision.</b> '+(o.why||'')+' <button type="button" class="btn small primary" onclick="branchNext()">Continue ▸</button>';
  } else {
    x._firstTry = false;
    x._wrongPicks++;
    fb.className = 'bfb badfb';
    fb.innerHTML = '<b>✗ This choice creates a governance problem.</b> '+(o.why||'')+' Try another option.';
    var btns = $$('.bopt');
    if(btns[i]){ btns[i].disabled = true; btns[i].classList.add('dead'); }
  }
}
function branchNext(){
  var x = S.pool[S.idx];
  x._node++;
  renderExam();
  scrollTop();
}

function finishFlow(){

  showResults();
}
function renderReviewSkipped(){

  h += '<p class="muted small">If you submit the exam while an exercise is still unanswered, that exercise is '+

  S.skipped.forEach(function(id){

    h += '<li><div><b>Exercise '+(i+1)+' — '+esc(x.title)+'</b>'+
         '<div class="muted small">'+esc(x.theme)+' · '+esc(String(x.type).toUpperCase())+
         (closed ? ' · ⏱ time box over, this one is closed' : '')+'</div></div>'+
         (closed
            ? '<span class="badge" style="border-color:var(--skip);color:var(--skip)">⚠ Closed — excluded from score</span>'
            : '<button type="button" class="btn" onclick="gotoIdx('+i+')">Return to this exercise</button>')+
         '</li>';
  });
  h += '</ul>';
  h += '<div class="qactions"><button type="button" class="btn primary" onclick="showResults()">Submit exam and exclude unanswered</button>'+
       '<button type="button" class="btn ghost" onclick="backToExam()">Back to the exercises</button></div></div>';
  $('#stage').innerHTML = h;
  updateHUD();
  scrollTop();
}
function backToExam(){
  var n = nextPendingIndex(0);
  if(n < 0){ n = 0; }
  gotoIdx(n);
}

/* --------------------------- website integration ----------------------- */
/* One report per completed attempt, sent at the results screen only.
   score / total are points over the exercises that were actually answered:
   a skipped-and-never-answered exercise is in neither number, exactly as in
   the final score shown on screen, so percent and passed always agree. */
function reportScore(earned, possible){
  var percent = possible ? Math.round((earned/possible)*100) : 0;
  try{
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: earned,
      total: possible,
      percent: percent,
      passed: percent >= EXAM.passScore
    }, location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* --------------------------------- results ----------------------------- */
function showResults(){
  S.done = true;
  S.reviewing = false;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display = 'none'; }
  var st = stats();
  var pct = st.possible ? Math.round((st.earned/st.possible)*100) : 0;
  var pass = st.answered > 0 && pct >= EXAM.passScore;
  if(!S.reported){
    S.reported = true;
    reportScore(st.earned, st.possible);
  }

  var h = '<div class="card"><div class="resulthead">';
  h += '<div><h1 style="margin-bottom:.2rem">Final result — '+esc(EXAM.keyword)+' '+sevPill()+'</h1>'+
       '<p class="muted">'+esc(EXAM.severity)+' practice exam · passing score '+EXAM.passScore+'% of the answered exercises</p>'+
       (S.timeover ? '<p class="warn"><b>⚠ Time is over.</b> The exam was submitted automatically.</p>' : '')+
       '<p class="'+(pass?'ok':'bad')+'" style="font-size:1.2rem;font-weight:800">'+(pass?'✔ PASS':'✗ FAIL')+'</p></div>';
  h += '<div style="text-align:right"><div class="bigscore '+(pass?'pass':'fail')+'">'+pct+'%</div>'+
       '<div class="muted small">'+st.earned+' / '+st.possible+' points</div></div>';
  h += '</div>';

  h += '<div class="statgrid">'+
       '<div class="stat"><div class="n ok">'+st.correct+'</div><div class="k">Answered correctly</div></div>'+
       '<div class="stat"><div class="n bad">'+st.wrong+'</div><div class="k">Answered incorrectly</div></div>'+
       '<div class="stat"><div class="n" style="color:var(--skip)">'+st.skipped+'</div><div class="k">Skipped, not answered (excluded)</div></div>'+
       '<div class="stat"><div class="n">'+st.answered+' / '+st.total+'</div><div class="k">Exercises counted in the score</div></div>'+
       '</div>';

  h += themeBars();

  if(pass){
    h += '<div class="cert"><div class="ct">Certificate of completion</div>'+
         '<div class="cn">'+esc(EXAM.keyword)+' — '+esc(EXAM.severity)+'</div>'+
         '<div class="cs">Score: '+pct+'% ('+st.earned+' / '+st.possible+' points) · Threshold: '+EXAM.passScore+'%</div>'+
         '<div class="muted small" style="margin-top:.4rem">Issued '+new Date().toLocaleString()+' · Standalone certification exam · Practical governance simulation</div></div>';
  } else {
    h += '<div class="tip" style="border-left-color:var(--bad);background:#2a0f12;margin-top:1rem">'+
         '<b>✗ You did not reach the threshold.</b> Read every explanation below, look at the “what to study” notes, then retake the exam. '+
         'The questions and the answer choices are shuffled again at every attempt.</div>';
  }
  h += '<div class="qactions"><button type="button" class="btn primary" onclick="retake()">Retake exam (reshuffled)</button>'+
       '<button type="button" class="btn ghost" onclick="gotoReport()">Go to the detailed report</button></div>';
  h += '</div>';

  h += '<div class="card"><h2>Detailed report — every exercise explained</h2>'+
       '<p class="muted small">Correct answers are shown in green with ✔, wrong answers in red with ✗, and exercises you never '+
       'answered in amber with ⚠. They are also listed in the report.</p><div class="report">';
  S.pool.forEach(function(x,i){
    var r = S.res[x.id];
    var cls = 'rep', status, badgeColor = 'var(--skip)';
    if(r && r.status === 'correct'){ cls += ' good'; status = '✔ Correct'; badgeColor = 'var(--ok)'; }
    else if(r && r.status === 'wrong'){ cls += ' bad'; status = '✗ Incorrect'; badgeColor = 'var(--bad)'; }
    else { cls += ' na'; status = '⚠ Not answered — excluded from score'; }
    h += '<div class="'+cls+'">';
    h += '<div class="rhead"><b>Exercise '+(i+1)+' — '+esc(x.title)+'</b>'+
         '<span class="badge" style="border-color:'+badgeColor+';color:'+badgeColor+'">'+status+'</span></div>';
    h += '<div class="muted small" style="margin:.25rem 0 .5rem">'+esc(x.theme)+' · '+esc(String(x.type).toUpperCase())+
         (r && r.status!=='skipped' ? ' · '+r.earned+' / '+MAXPTS+' pts'+
            (r.penalty ? ' (−'+r.penalty+' pts: '+(r.hints?'hint ':'')+(r.wrongCmds?'wrong commands':'')+')' : '') : '')+'</div>';
    if(r && r.status !== 'skipped'){
      h += '<div class="ansline"><div><span class="lbl">Your answer</span>'+esc(yourText(x, r.given))+'</div>'+
           '<div><span class="lbl">Correct answer</span>'+esc(correctText(x))+'</div></div>';
    } else {
      h += '<p class="muted"><b>⚠ Not answered — excluded from score.</b> This exercise did not count as right or wrong, '+
           'and its points were not added to the total possible points.</p>';
    }
    h += '<p class="exp">'+x.explain+'</p>';
    if(x.type === 'terminal'){ h += canonicalHTML(x); }
    if(r && r.status !== 'correct' && x.tip){ h += '<div class="tip" style="border-left-color:var(--warn);background:#2a2008">'+
         '<b>What to study:</b> '+x.tip+'</div>'; }
    h += '</div>';
  });
  h += '</div></div>';

  $('#stage').innerHTML = h;
  updateHUD();
  scrollTop();
}
function themeBars(){
  var themes = {}, order = [];
  S.pool.forEach(function(x){
    if(!themes[x.theme]){ themes[x.theme] = {correct:0, answered:0, total:0}; order.push(x.theme); }
    themes[x.theme].total++;
    var r = S.res[x.id];
    if(r && r.status !== 'skipped'){ themes[x.theme].answered++; if(r.status==='correct'){ themes[x.theme].correct++; } }
  });
  var h = '<h3 style="margin-top:1rem">Result by theme</h3><div class="bars">';
  order.forEach(function(t){
    var v = themes[t];
    var pc = v.answered ? Math.round((v.correct/v.answered)*100) : 0;
    h += '<div class="bar"><span>'+esc(t)+'</span><span class="track"><span class="fill" style="width:'+pc+'%"></span></span>'+
         '<span class="muted small">'+v.correct+'/'+v.answered+' ('+pc+'%)</span></div>';
  });
  return h + '</div>';
}
function retake(){
  S.tid && clearInterval(S.tid);
  S.tid = null;
  startExam();
}
function gotoReport(){
  var cards = $$('.card');
  if(cards.length > 1){
    try{ cards[1].scrollIntoView({behavior:'smooth'}); }catch(e){ cards[1].scrollIntoView(); }
  }
}

/* ------------------------- site handshake (optional) ------------------- */
window.addEventListener('message', function (event) {
  if (!event.data || typeof event.data !== 'object') { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  /* The learner's name may be shown; the theme is ignored because this exam
     ships a single dark theme, and the exam never requires this message. */
  if (event.data.username) {
    S.learner = String(event.data.username).slice(0, 40);
    var g = document.getElementById('whoami');
    if (g) { g.textContent = 'Learner: ' + S.learner; }
  }
});

/* ---------------------------------- boot ------------------------------- */
function boot(){
  $('#stage').innerHTML = INTRO_HTML;
  $('#hudTime').textContent = fmt(EXAM.minutes*60);
  var sev = $('#sevBadge');
  if(sev){ sev.className = 'sev ' + EXAM.sevClass; }
  updateHUD();
}
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.started && !S.done){ togglePause(); }
});
document.addEventListener('DOMContentLoaded', boot);

</script>
