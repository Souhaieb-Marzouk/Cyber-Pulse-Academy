<script>window.__INTRO__={"examTitle": "DET0489 — EASY practice exam", "learn": ["Welcome! In this exam you will master DET0489 — a MITRE ATT&CK Detection Strategy. A Detection Strategy is ATT&CK's recipe for catching one specific attack behaviour: it says what the attacker does, which logs you need to collect, and the logic that turns those logs into an alert.", "The behaviour it watches is Parent PID Spoofing (T1134.004), a sub-technique of T1134 Access Token Manipulation. In Windows, every process has a parent — the process that started it. Security tools use this family tree to tell good activity from bad. Parent PID Spoofing lies about the parent: the attacker makes a dangerous program look like it was started by a trusted one, for example explorer.exe. The trick uses Windows APIs named UpdateProcThreadAttribute and CreateProcess with EXTENDED_STARTUPINFO. The result: the true parent and the reported parent disagree — a mismatch — and finding that mismatch is exactly what DET0489 does.", "Where will you use this at work? SOC analysts triage the alerts it raises. Detection engineers turn the strategy into SIEM or EDR rules and tune it. Threat hunters use its data sources — Security event 4688, the ETW kernel process channel, and Sysmon lineage. Incident responders use it to prove an attacker evaded controls. GRC analysts map it to mitigations such as M1040 Behavior Prevention on Endpoint and M1026 Privileged Account Management.", "Your tools are the ones you already know: the SIEM, Sysmon, Event Viewer and the EDR console. Your deliverables are detection rules, tuning notes, alert runbooks and incident findings. The risk it addresses is real: attackers hide their tools from parent-child rules and use forged SYSTEM parents like lsass.exe or services.exe to climb privileges. In this EASY exam you will build the foundations: the object itself, the attack trick, the three telemetry sources, and the basics of allow-listing and first response. Along the way you will meet your first false positives — benign tools such as consent.exe that can fire the alert — and you will see what the strategy covers and where its coverage ends."], "keywords": [{"g": "The object itself", "items": ["Detection Strategy (ATT&CK object type)", "DET0489", "Analytics AN1351 (Windows)", "ID prefixes: DET, T, AN, M, G, TA"]}, {"g": "The behaviour it detects", "items": ["T1134.004 Parent PID Spoofing", "T1134 Access Token Manipulation (parent technique)", "Defense Evasion tactic", "true parent vs reported parent", "forged lineage", "UpdateProcThreadAttribute + CreateProcess chain"]}, {"g": "Telemetry you will meet", "items": ["DC0032 Process Creation — WinEventLog:Security, EventCode=4688", "DC0021 OS API Execution — etw:Microsoft-Windows-Kernel-Process", "DC0034 Process Metadata — true-vs-reported PPID", "Creator Process ID / Name fields"]}, {"g": "Expected spoofers, controls & response basics", "items": ["AllowedSpoofers allow-list", "consent.exe and UAC", "M1040 Behavior Prevention on Endpoint", "M1026 Privileged Account Management", "first triage steps"]}], "how": ["Passing score: 70%. A PASS means you master the EASY building blocks of DET0489. A FAIL means you should re-read the intro screen and the feedback you received, then retake the exam.", "Exercise types in this file: single-choice questions, matching pairs, a word-bank completion, drag & drop categories, step ordering, log reading with a filter box, clickable mismatch pairs, and alert dispositions.", "Timer: you have 25 minutes. The Pause button stops the timer and hides the exercise so you can take a real break. The moment you press Check, the timer also stops automatically — you can study the feedback for as long as you like, and it starts again when you press Next.", "Partial credit: exercises with several correct items give partial credit. Each correct item adds, each wrong item subtracts: credit = (H − W) / N, never below zero. If you select everything to be safe, you score zero. A hint costs 10% of that exercise's credit, and you may use one hint per exercise.", "Skip: the Skip button moves an exercise to a review pool without revealing the answer. Before you finish, you can return to any skipped exercise while the timer has time left. Skipped exercises that are never answered are excluded from the score — they do not count as correct, wrong, or possible points."]};window.__EX__=[{"id": "e1", "type": "qcm", "title": "What kind of ATT&CK object is DET0489?", "summary": "The DET0489 page header — what object type is it?", "scenario": {"paras": ["You open the ATT&CK page for DET0489. The page title reads: Behavior-chain detection for T1134.004 Access Token Manipulation: Parent PID Spoofing (Windows).", "A colleague asks you what kind of ATT&CK object this page is. The ID starts with DET, and the page describes how to catch an attack behaviour, not how to stop it or who did it."]}, "question": "What type of ATT&CK object is DET0489?", "hint": "The ID starts with DET. It teaches you how to detect a behaviour — not how to prevent it or profile an actor.", "options": [{"k": "A", "t": "A Detection Strategy — a page that describes how to detect one attack behaviour"}, {"k": "B", "t": "A Mitigation — a control that removes or reduces a risk"}, {"k": "C", "t": "A Group — a profile of one threat actor"}, {"k": "D", "t": "A Tactic — an adversary goal such as Defense Evasion"}], "answer": ["A"], "whys": {"A": "DET marks a Detection Strategy: it groups the data sources and the analytics logic a defender needs to detect one technique."}, "whyNots": {"B": "Mitigations carry IDs like M1040. They describe controls, not detection logic.", "C": "Groups carry IDs like G0007. They profile threat actors, not detections.", "D": "Tactics carry IDs like TA0004. They are adversary goals, not detection pages."}, "explanation": "DET0489 is a Detection Strategy. In ATT&CK, a Detection Strategy says: here is the behaviour to watch, here are the log sources you need, and here is the logic (the analytics) that turns those logs into an alert. Mitigations, Groups and Tactics are different ATT&CK object types with different ID prefixes (M, G, TA).", "study": "Re-read the first paragraph of the intro screen — it explains what a Detection Strategy is."}, {"id": "e2", "type": "match", "title": "Match the ATT&CK IDs to their names", "summary": "Four IDs from a SOC briefing: T1134.004, T1134, DET0489, AN1351", "scenario": {"paras": ["In a SOC briefing slide you see four ATT&CK IDs used together. Your lead asks you to name each one.", "Two IDs start with T (techniques). One starts with DET (the detection strategy). One starts with AN (the concrete analytics for Windows)."]}, "question": "Match each ATT&CK ID to the name it belongs to.", "hint": "Two IDs name behaviours (T = technique). One names the detection strategy. One names the Windows analytics that implements it.", "pairs": [{"l": "T1134.004", "r": "Parent PID Spoofing (the sub-technique)", "why": "T1134.004 is the sub-technique that describes forging the parent of a new process."}, {"l": "T1134", "r": "Access Token Manipulation (the parent technique)", "why": "T1134 is the parent technique; T1134.004 sits under it."}, {"l": "DET0489", "r": "The Detection Strategy watching that sub-technique", "why": "DET0489 is the detection strategy page for T1134.004."}, {"l": "AN1351", "r": "The Windows analytics implementing the strategy", "why": "AN1351 is the concrete analytic listed on the DET0489 page for Windows."}], "explanation": "The four objects connect like this: T1134.004 (Parent PID Spoofing) is a sub-technique of T1134 (Access Token Manipulation). DET0489 is the Detection Strategy that watches it, and AN1351 is the Windows analytics that implements that strategy. ATT&CK IDs encode the object type in the prefix: T for techniques, DET for detection strategies, AN for analytics.", "study": "The intro screen section on the object itself lists all four IDs."}, {"id": "e3", "type": "fill", "title": "Complete the spoofing sentence", "summary": "Two blanks: the attacker changes the parent; the analytic looks for a mismatch", "scenario": {"paras": ["You are writing a short note for newcomers. Complete the two missing words using the word bank.", "In Windows, every new process has a parent — the process that started it. An attacker can lie about that parent, and DET0489 looks for the lie."]}, "question": "Fill both blanks to complete the sentence correctly.", "hint": "Think of a family tree: which process LOOKS like it started the child, and what do we call it when the records do not agree?", "fill": {"text": "In a parent PID spoofing attack, the attacker chooses the {0} parent of a new process. The analytic then looks for a {1} between the true parent and the reported parent.", "answers": ["reported", "mismatch"], "bank": ["reported", "mismatch", "password", "firewall", "antivirus", "folder"], "whys": ["The reported parent is the fake claim the attacker makes; the true parent is what the kernel really used.", "A mismatch is the disagreement between the true parent and the reported parent — the core signal of DET0489."]}, "explanation": "The attacker changes the reported parent so lineage tools see a trusted process. The kernel, however, records the true parent somewhere else. When the true parent and the reported parent do not agree, that disagreement is called a mismatch — and finding that mismatch is exactly what DET0489 does.", "study": "The What you will learn here section explains true parent versus reported parent."}, {"id": "e4", "type": "qcm", "title": "Which tactic does Parent PID Spoofing serve?", "summary": "T1134.004 in the ATT&CK matrix", "scenario": {"paras": ["You are explaining T1134.004 to a new colleague using the ATT&CK matrix. The sub-technique sits in a column that is all about staying hidden and getting around controls.", "Spoofing the parent makes a dangerous process look normal, so tools that watch process relationships are misled."]}, "question": "Which tactic does Parent PID Spoofing mainly belong to?", "hint": "The goal is to hide what the process really is — to get around defensive rules.", "options": [{"k": "A", "t": "Defense Evasion — staying hidden and bypassing controls"}, {"k": "B", "t": "Reconnaissance — gathering information about the target"}, {"k": "C", "t": "Initial Access — getting the first foothold inside"}, {"k": "D", "t": "Exfiltration — stealing data out of the network"}], "answer": ["A"], "whys": {"A": "Parent PID Spoofing lives under Defense Evasion: its whole purpose is to defeat lineage-based detection and parent-child rules."}, "whyNots": {"B": "Reconnaissance happens before malware runs on a host; it does not need parent spoofing.", "C": "Initial Access is about the first entry (phishing, exploits). Spoofing a parent happens after code already runs.", "D": "Exfiltration is about moving data out. It has no link to process lineage lies."}, "explanation": "T1134.004 sits in the Defense Evasion tactic. By faking the parent, the attacker hides the true origin of a process, which defeats parent-child detection rules and process-block policies. ATT&CK also links it to Privilege Escalation, because a forged parent can be a SYSTEM process — but the main tactic is Defense Evasion.", "study": "The intro screen paragraph about the behaviour and its tactic."}, {"id": "e5", "type": "dnd", "title": "Sort the log evidence into the three data components", "summary": "Three evidence snippets → DC0032, DC0021, DC0034", "scenario": {"paras": ["DET0489 needs three kinds of telemetry, called data components. Here is what each one means:", "• DC0032 Process Creation — a record that a new process started (Security event 4688).", "• DC0021 OS API Execution — a record of the Windows API call that forges the parent (ETW kernel channel).", "• DC0034 Process Metadata — the kernel's own record of the true parent versus the reported PPID."]}, "question": "Drag each evidence snippet onto the data component it belongs to.", "hint": "Match the words: creation = a process started; API execution = the forging call itself; metadata = the true-vs-reported parent record.", "slots": [{"id": "s1", "label": "DC0032 — Process Creation"}, {"id": "s2", "label": "DC0021 — OS API Execution"}, {"id": "s3", "label": "DC0034 — Process Metadata"}], "items": [{"k": "i1", "t": "WinEventLog:Security EventCode=4688 — a new process has been created"}, {"k": "i2", "t": "etw kernel: api_call=UpdateProcThreadAttribute (PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)"}, {"k": "i3", "t": "etw kernel: process_start — EventHeader true parent vs reported PPID"}], "map": {"i1": "s1", "i2": "s2", "i3": "s3"}, "whys": {"i1": "Event 4688 in the Security log is the classic Process Creation record (DC0032).", "i2": "The UpdateProcThreadAttribute call is the forging API — that is OS API Execution (DC0021).", "i3": "The kernel record of true parent versus reported PPID is Process Metadata (DC0034)."}, "explanation": "DET0489's Log Sources table names exactly these three pairs: Process Creation (DC0032) from WinEventLog:Security with EventCode=4688, OS API Execution (DC0021) from the etw:Microsoft-Windows-Kernel-Process channel showing the UpdateProcThreadAttribute call, and Process Metadata (DC0034) from the same ETW channel showing the true parent next to the reported PPID. Knowing which source answers which question is the first skill of a detection engineer.", "study": "The Telemetry group in the Keywords covered section."}, {"id": "e6", "type": "logview", "title": "Read the 4688 event: who is the creator?", "summary": "One Security 4688 event on WIN-WKS042", "filter": true, "scenario": {"paras": ["Your SIEM shows one Security event 4688 (a new process was created) from a workstation. Look at the fields."], "arts": [{"label": "ARTEFACT 1 — WinEventLog:Security, EventCode=4688", "lines": ["Time: 2026-10-12 08:14:22 UTC   Host: WIN-WKS042   EventCode=4688", "NewProcessName: C:\\Users\\jmoreau\\AppData\\Local\\Temp\\svhost.exe", "NewProcessId: 0x1B4C", "CreatorProcessName: C:\\Windows\\explorer.exe", "CreatorProcessId: 0x0F3C", "TokenElevationType: 3 (limited)"]}]}, "question": "Which field names the process that supposedly started the new process?", "hint": "Creator means the parent in this event. Read the field names one by one.", "answer": {"kind": "single", "options": [{"k": "A", "t": "CreatorProcessName — C:\\Windows\\explorer.exe"}, {"k": "B", "t": "NewProcessName — the Temp svhost.exe path"}, {"k": "C", "t": "TokenElevationType — 3 (limited)"}, {"k": "D", "t": "Host — WIN-WKS042"}], "answer": ["A"], "whys": {"A": "The Creator Process fields describe the parent that the event reports. DET0489 compares exactly this against the true parent from other sources."}, "whyNots": {"B": "NewProcessName is the child that was started, not its parent.", "C": "TokenElevationType describes the token privilege level, not the lineage.", "D": "The Host field names the computer, not a process."}}, "explanation": "In a 4688 event, the Creator Process ID and Creator Process Name fields carry the reported parent — the claim made by whoever started the process. DET0489 takes this claim and compares it with the true parent recorded elsewhere (ETW and Sysmon). When they disagree, that is one mismatch vote. Here the event claims explorer.exe started a Temp binary named svhost.exe — a name that imitates the real svchost.exe, which is worth noting even in an EASY exercise.", "study": "The exercise on the three data components — and the note about 4688 in the intro."}, {"id": "e7", "type": "qcm", "title": "What disagreement does the analytic look for?", "summary": "Two facts about PID 0x1B4C from two sources", "scenario": {"paras": ["Your SIEM shows two facts about the same new process (PID 0x1B4C):", "Fact 1 — the ETW kernel record says the true parent is an unknown Temp binary.", "Fact 2 — the Security 4688 event says the creator is explorer.exe."]}, "question": "What does DET0489 look for when it compares these two facts?", "hint": "Same process, two different parents — which single word describes that situation?", "options": [{"k": "A", "t": "A mismatch between the true parent and the reported parent"}, {"k": "B", "t": "A password change on the same host"}, {"k": "C", "t": "A new user logon outside working hours"}, {"k": "D", "t": "A firewall rule that was modified"}], "answer": ["A"], "whys": {"A": "The analytic cross-checks lineage from more than one source. When the kernel-observed true parent and the reported creator do not agree, that mismatch is the core signal."}, "whyNots": {"B": "Passwords play no role in process lineage.", "C": "Logon times matter for other detections, not for parent lineage.", "D": "Firewall changes are network events; this strategy watches process parentage."}, "explanation": "DET0489 is built on one simple idea: the attacker can change what one log says, but not what every source says. The kernel-level records (ETW, Sysmon) show the true parent. The 4688 event shows the reported creator. When those two disagree, the lineage has been forged — that is the mismatch the analytics counts before alerting.", "study": "The sentence you completed earlier: true parent versus reported parent."}, {"id": "e8", "type": "order", "title": "Put the spoofing chain in order", "summary": "Four API steps from the DET0489 description", "scenario": {"paras": ["The DET0489 description names the attacker's API steps: choose a parent, set the attribute, start the process with EXTENDED_STARTUPINFO_PRESENT / StartupInfoEx, and the child is born with a forged lineage.", "You must rebuild that chain in the right order for a detection-engineering document."]}, "question": "Order the four steps from first (top) to last (bottom).", "hint": "Pick the parent first, set the attribute second, start the process third. The forged lineage is the result, not an action.", "seq": {"items": [{"k": "k1", "t": "The attacker picks a parent process to impersonate (for example explorer.exe or a SYSTEM process)"}, {"k": "k2", "t": "The attacker process calls UpdateProcThreadAttribute with PROC_THREAD_ATTRIBUTE_PARENT_PROCESS"}, {"k": "k3", "t": "The attacker calls CreateProcess with EXTENDED_STARTUPINFO_PRESENT / StartupInfoEx"}, {"k": "k4", "t": "The new process starts with a forged parent in its lineage"}], "correct": ["k1", "k2", "k3", "k4"], "whys": {"k1": "You must decide which parent to fake before you can reference it.", "k2": "UpdateProcThreadAttribute writes the chosen parent into the process attribute list.", "k3": "CreateProcess (or CreateProcessAsUserW) is then called with EXTENDED_STARTUPINFO_PRESENT so the attribute list is used.", "k4": "The forged lineage is the outcome that all three telemetry sources then disagree about."}}, "explanation": "This is the chain from the DET0489 page: a process explicitly forges its parent using EXTENDED_STARTUPINFO plus PROC_THREAD_ATTRIBUTE_PARENT_PROCESS (UpdateProcThreadAttribute → CreateProcess[A/W]/CreateProcessAsUserW), which results in mismatched lineage across the telemetry sources. A behavior-chain detection watches these steps in order — which is why the strategy is called behavior-chain detection.", "study": "The intro screen paragraph that names UpdateProcThreadAttribute and CreateProcess."}, {"id": "e9", "type": "qcm", "title": "Why is consent.exe expected here?", "summary": "A DET0489 alert whose spoofer is consent.exe during a UAC prompt", "scenario": {"paras": ["DET0489 fires with spoofer = consent.exe on a user workstation. The alert arrived while the user was installing approved software and Windows showed the usual UAC prompt.", "Your lead points at the strategy's AllowedSpoofers element, described on the page as: legitimate binaries that commonly use StartupInfoEx/PPID assignment (for example consent.exe, svchost.exe during UAC)."]}, "question": "What is the most likely explanation for this alert?", "hint": "The page itself names consent.exe as a normal user of this Windows feature.", "options": [{"k": "A", "t": "Windows UAC legitimately uses consent.exe with PPID assignment, so this is expected"}, {"k": "B", "t": "The workstation is certainly infected by malware"}, {"k": "C", "t": "The SIEM clock is wrong and shifted the events"}, {"k": "D", "t": "consent.exe is always malware on every Windows host"}], "answer": ["A"], "whys": {"A": "consent.exe is the UAC consent window. It legitimately uses StartupInfoEx/PPID assignment, which is why the strategy ships an allow-list."}, "whyNots": {"B": "A known legitimate pattern during a UAC prompt is not, by itself, evidence of infection.", "C": "Clock drift does not change which binary called the API.", "D": "consent.exe is a signed Windows component; it is not malware."}, "explanation": "Some Windows features genuinely assign a new PPID. UAC's consent.exe is the classic example, and the DET0489 page lists it (with svchost.exe during UAC) in the AllowedSpoofers mutable element. Allow-listing keeps the analytic quiet for normal Windows behaviour. Expected does not mean always safe: the same binary in a strange context deserves a check — but this scenario is the textbook legitimate case.", "study": "The AllowedSpoofers entry in the Keywords covered section."}, {"id": "e10", "type": "multi", "title": "Which two channels does the strategy name?", "summary": "Building the DET0489 query — pick the two log channels", "scenario": {"paras": ["You are building the DET0489 query in your SIEM. The Log Sources table on the strategy page names the channels you must collect.", "Five channels are proposed below. Exactly two appear in that table."]}, "question": "Select the two channels that appear in the Log Sources table.", "hint": "One is the classic Security event log; the other is the ETW kernel process channel.", "options": [{"k": "A", "t": "WinEventLog:Security"}, {"k": "B", "t": "etw:Microsoft-Windows-Kernel-Process"}, {"k": "C", "t": "Microsoft-Windows-PowerShell/Operational"}, {"k": "D", "t": "Application"}, {"k": "E", "t": "Microsoft-Windows-Windows Defender/Operational"}], "answer": ["A", "B"], "whys": {"A": "The table pairs Process Creation (DC0032) with WinEventLog:Security, EventCode=4688.", "B": "The table pairs OS API Execution (DC0021) and Process Metadata (DC0034) with etw:Microsoft-Windows-Kernel-Process."}, "whyNots": {"C": "PowerShell logs are useful for other detections but are not named by this strategy.", "D": "The Application channel holds application events, not process lineage.", "E": "Defender logs antivirus events; they are not a source for this analytic."}, "explanation": "DET0489's Log Sources table names two channels: WinEventLog:Security for Process Creation (DC0032, EventCode=4688) and etw:Microsoft-Windows-Kernel-Process for both OS API Execution (DC0021) and Process Metadata (DC0034). If your collection misses either channel, one of the lineage votes disappears and the analytic grows blind spots.", "study": "The three data components from the drag & drop exercise earlier."}, {"id": "e11", "type": "logview", "title": "Find the TRUE parent in the ETW event", "summary": "One ETW kernel process_start event", "filter": true, "scenario": {"paras": ["The ETW kernel channel records its own view of the new process. Read the event below and find the true parent."], "arts": [{"label": "ARTEFACT 1 — etw:Microsoft-Windows-Kernel-Process, process_start", "lines": ["Time: 2026-10-12 08:14:22 UTC", "pid: 0x1B4C   image: C:\\Users\\jmoreau\\AppData\\Local\\Temp\\svhost.exe", "EventHeader.ProcessId (true parent): 0x2A10 (unknown Temp binary)", "Reported PPID (from 4688): 0x0F3C (explorer.exe)"]}]}, "question": "Which value is the TRUE parent according to this ETW event?", "hint": "The word true marks the real one. The other parent is only a claim.", "answer": {"kind": "single", "options": [{"k": "A", "t": "0x2A10 — the unknown Temp binary"}, {"k": "B", "t": "0x0F3C — explorer.exe"}, {"k": "C", "t": "0x1B4C — the new process itself"}, {"k": "D", "t": "4688 — the Security event number"}], "answer": ["A"], "whys": {"A": "EventHeader.ProcessId is the kernel's own record of the real parent. The kernel cannot be fooled by the API trick that changes the reported value."}, "whyNots": {"B": "0x0F3C (explorer.exe) is the reported PPID — the claim, not the truth.", "C": "0x1B4C is the new child process, not its parent.", "D": "4688 is an event code, not a process identifier."}}, "explanation": "The kernel records the true parent in EventHeader.ProcessId no matter what the caller claimed. The reported PPID in the 4688 event (explorer.exe, 0x0F3C) is only the claim written by the spoofing call. DET0489 uses this true-versus-reported gap as one of its mismatch sources. When the true parent is an unknown Temp binary, the risk level climbs sharply.", "study": "The Process Metadata (DC0034) entry in the Keywords covered section."}, {"id": "e12", "type": "match", "title": "Match the mitigation IDs to their names", "summary": "Two controls from the technique's mitigation table", "scenario": {"paras": ["The mitigation table linked to T1134.004 lists two ATT&CK mitigations that help against this behaviour.", "Match each ID to its name."]}, "question": "Match each mitigation ID to the control it names.", "hint": "M1040 is about endpoint behaviour blocking. M1026 is about who holds powerful accounts.", "pairs": [{"l": "M1040", "r": "Behavior Prevention on Endpoint", "why": "EDR-style controls that block suspicious behaviour patterns such as parent forging."}, {"l": "M1026", "r": "Privileged Account Management", "why": "Limiting powerful accounts reduces the reach of token and parent manipulation."}], "explanation": "M1040 (Behavior Prevention on Endpoint) is the control class that can block the forging behaviour itself — modern EDR products watch for UpdateProcThreadAttribute parent tricks. M1026 (Privileged Account Management) shrinks the prize: with fewer privileged accounts and tighter service rights, a forged SYSTEM parent buys the attacker much less. Detection (DET0489) and these mitigations work together as defence in depth.", "study": "The Mitigations entries in the Keywords covered section."}, {"id": "e13", "type": "spot", "title": "Click every pair that shows a mismatch", "summary": "Four lineage pairs — true parent vs reported creator", "scenario": {"paras": ["Below are four lineage pairs. Each pair shows the TRUE parent (kernel view) and the REPORTED creator (4688 view) for one process."], "arts": [{"label": "ARTEFACT 1 — Lineage pairs (true parent | reported creator)", "lines": ["Pair A:  true=C:\\Windows\\explorer.exe    reported=C:\\Windows\\explorer.exe", "Pair B:  true=C:\\Temp\\ppid_tool.exe      reported=C:\\Windows\\explorer.exe", "Pair C:  true=C:\\Windows\\System32\\services.exe  reported=C:\\Windows\\System32\\services.exe", "Pair D:  true=C:\\Temp\\svc.exe            reported=C:\\Windows\\System32\\lsass.exe"]}]}, "question": "Select every pair that shows a mismatch between true parent and reported creator.", "hint": "A pair matches when both sides name the same process. Two pairs here disagree.", "spot": {"lines": ["Pair A:  true=explorer.exe      reported=explorer.exe", "Pair B:  true=ppid_tool.exe     reported=explorer.exe", "Pair C:  true=services.exe      reported=services.exe", "Pair D:  true=Temp svc.exe      reported=lsass.exe"], "bad": [1, 3], "whys": {"1": "The true parent is a Temp tool but the report claims explorer.exe — a forged lineage, exactly the mismatch DET0489 counts.", "3": "The true parent is a Temp binary while the report claims lsass.exe — a forged lineage toward a SYSTEM process, the most dangerous pattern."}}, "explanation": "Pairs B and D name two different parents per process — the true one (kernel) and the claimed one (4688) disagree. That disagreement is the raw signal DET0489 counts across its sources. Pairs A and C agree, so they are normal lineage. Notice that Pair D also forges a SensitiveParent (lsass.exe), which would push the severity up.", "study": "The mismatch idea from the sentence you completed earlier."}, {"id": "e14", "type": "qcm", "title": "First step when DET0489 fires", "summary": "You are on call; a lineage-mismatch alert arrives", "scenario": {"paras": ["You are the on-call SOC analyst. DET0489 just fired on a workstation: the alert shows a lineage mismatch between the true parent and the reported creator.", "Several response options are on the table."]}, "question": "What should you check first?", "hint": "Verify before you escalate — and remember the allow-list.", "options": [{"k": "A", "t": "Confirm the mismatch across the sources and check whether the spoofer is allow-listed"}, {"k": "B", "t": "Power off the workstation immediately to stop the attack"}, {"k": "C", "t": "Delete the alert so the queue stays clean"}, {"k": "D", "t": "Email the whole company that a breach is in progress"}], "answer": ["A"], "whys": {"A": "First confirm the signal (compare the three lineage sources) and rule out known legitimate spoofers such as consent.exe. Then escalate with facts."}, "whyNots": {"B": "Powering off destroys volatile evidence and is far too aggressive before verification.", "C": "Deleting alerts hides attacks and breaks the audit trail.", "D": "Company-wide messaging without verification spreads panic and is not your call alone."}, "explanation": "Good triage follows the evidence: compare the true parent (ETW, Sysmon) with the reported creator (4688), count the mismatched sources, and check the AllowedSpoofers list — consent.exe during a UAC prompt is normal, a Temp binary is not. Only after verification do you escalate or contain. This proportionate first step is the same in every SOC that runs DET0489.", "study": "The first-response basics in the Keywords covered section."}, {"id": "e15", "type": "queue", "title": "Choose the disposition for each alert", "summary": "Two alerts — one allow-listed, one not", "scenario": {"paras": ["Two DET0489 alerts are waiting in your queue. Cho <script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var INTRO=window.__INTRO__;
var EXS=window.__EX__;
var SEVMAP={easy:['EASY','sev-easy'],medium:['MEDIUM','sev-medium'],hard:['HARD','sev-hard'],'extremely-hard':['EXTREMELY HARD','sev-extreme']};
var SEVWORD=SEVMAP[META.difficulty][0];
var SEVCLS=SEVMAP[META.difficulty][1];
var PASS=META.passMark||70;
var app=document.getElementById('app');

/* ---------- tiny DOM helpers ---------- */
function h(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
function txt(t,c,s){var e=h(t,c);e.textContent=(s===undefined||s===null)?'':String(s);return e;}
function btn(cls,s,fn){var b=txt('button','btn'+(cls?' '+cls:''),s);b.type='button';b.addEventListener('click',fn);return b;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){n=Math.max(0,n|0);return (n<10?'0':'')+n;}
function fmt(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function inArr(a,x){return a.indexOf(x)>=0;}
function normq(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}

/* ---------- state ---------- */
var S={view:'intro',order:[],pos:0,ts:'IDLE',left:(META.estimatedMinutes||30)*60,
credits:{},checked:{},skipped:{},hintUsed:{},hintOpen:{},st:{},_lastG:{},
reviewing:false,reported:false,manualMs:0,autoMs:0,pauseAt:0,pauseKind:null,underAuto:false,user:null};
function cur(){return S.order[S.pos];}
function st(i){if(i===undefined)i=cur();if(!S.st[i])S.st[i]={};return S.st[i];}
function answeredCount(){var n=0,k;for(k in S.checked)n++;return n;}
function skippedList(){var o=[],i;for(i=0;i<S.order.length;i++){var ix=S.order[i];if(S.skipped[ix]&&!S.checked[ix])o.push(ix);}return o;}
function scoreNow(){var a=answeredCount(),cs=0,k;for(k in S.credits)if(S.checked[k])cs+=S.credits[k];return{cs:cs,a:a,pct:a?Math.round(cs/a*100):0};}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- pause bookkeeping ---------- */
function enterPause(kind){S.pauseAt=Date.now();S.pauseKind=kind;}
function leavePause(){if(!S.pauseKind)return;var d=Date.now()-S.pauseAt;if(S.pauseKind==='manual')S.manualMs+=d;else S.autoMs+=d;S.pauseKind=null;}

/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
setInterval(function(){
  if(S.ts==='RUNNING'){S.left--;if(S.left<=0){S.left=0;updateHdrBits();endTimer();}else{updateHdrBits();}}
},1000);
function endTimer(){
  if(S.ts==='ENDED')return;
  S.ts='ENDED';
  if(S.view==='exam'||S.view==='review'){finish();}
}
function togglePause(){
  if(S.ts==='RUNNING'){S.ts='PAUSED_MANUAL';enterPause('manual');render();}
  else if(S.ts==='PAUSED_MANUAL'){leavePause();if(S.underAuto){S.ts='PAUSED_AUTO_CHECK';enterPause('auto');}else{S.ts='RUNNING';}render();}
  else if(S.ts==='PAUSED_AUTO_CHECK'){leavePause();S.underAuto=true;S.ts='PAUSED_MANUAL';enterPause('manual');render();}
}

/* ---------- root render ---------- */
function render(){
  app.textContent='';
  if(S.view==='intro')renderIntro();
  else if(S.view==='exam')renderExam();
  else if(S.view==='review')renderReview();
  else if(S.view==='results')renderResults();
  updateHdrBits();
}

/* ---------- INTRO SCREEN: exactly four sections ---------- */
function renderIntro(){
  var w=h('div');
  var hero=h('section','card intro-hero');
  hero.appendChild(txt('h1','intro-title',INTRO.examTitle));
  var facts=h('ul','facts');
  function fact(l,v){var li=h('li','fact');li.appendChild(txt('span','flab',l));li.appendChild(txt('span','fval',v));facts.appendChild(li);}
  fact('ATT&CK object','DET0489 — Behavior-chain detection for T1134.004 Access Token Manipulation: Parent PID Spoofing (Windows)');
  var li=h('li','fact');li.appendChild(txt('span','flab','Severity'));
  var sb=h('span','badge '+SEVCLS);sb.appendChild(txt('span','bico','◈'));sb.appendChild(txt('span',null,SEVWORD));li.appendChild(sb);facts.appendChild(li);
  fact('Object type','Detection Strategy (Enterprise domain) — analytics AN1351, technique detected: T1134.004');
  fact('Exercises in this exam',String(EXS.length));
  fact('Estimated time',META.estimatedMinutes+' minutes of focused work');
  fact('Timer budget','one countdown of '+META.estimatedMinutes+':00 for the whole attempt — pausing parks it, it never adds time');
  fact('Pass mark',PASS+'%');
  hero.appendChild(facts);
  w.appendChild(hero);

  var sec2=h('section','card');
  sec2.appendChild(txt('h2','sec-title','📚 What you will learn here'));
  INTRO.learn.forEach(function(p){sec2.appendChild(txt('p','body-p',p));});
  w.appendChild(sec2);

  var sec3=h('section','card');
  sec3.appendChild(txt('h2','sec-title','🔑 Keywords covered in this exam'));
  INTRO.keywords.forEach(function(g){
    var gh=h('div','kw-group');
    gh.appendChild(txt('h3','kw-title',g.g));
    var chips=h('div','kw-chips');
    g.items.forEach(function(it){chips.appendChild(txt('span','kw-chip',it));});
    gh.appendChild(chips);
    sec3.appendChild(gh);
  });
  w.appendChild(sec3);

  var sec4=h('section','card');
  sec4.appendChild(txt('h2','sec-title','🧭 How this exam works'));
  INTRO.how.forEach(function(p){sec4.appendChild(txt('p','body-p',p));});
  var startRow=h('div','center');
  startRow.appendChild(btn('primary big','▶ Start the exam',start));
  sec4.appendChild(startRow);
  w.appendChild(sec4);
  app.appendChild(w);
}

/* ---------- sticky exam header ---------- */
function buildHeader(){
  var hd=h('header','hdr');
  var left=h('div','hdr-left');
  left.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  left.appendChild(b);
  if(S.reviewing)left.appendChild(txt('span','review-chip','⏵ returning to a skipped exercise'));
  hd.appendChild(left);
  var mid=h('div','hdr-mid');
  mid.appendChild(txt('span','excount','Exercise '+(S.pos+1)+' of '+S.order.length));
  mid.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  mid.appendChild(txt('span','tstate','')).id='hdState';
  mid.appendChild(txt('span','tmono score','')).id='hdScore';
  hd.appendChild(mid);
  var right=h('div','hdr-right');
  var hb=btn('ghost','💡 Hint'+(S.hintUsed[cur()]?' (used)':' (−10%)'),useHint);
  hb.disabled=S.hintUsed[cur()]||S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(hb);
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.addEventListener('click',togglePause);
  right.appendChild(pb);
  var kb=btn('ghost','⤼ Skip',skipEx);
  kb.disabled=S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(kb);
  hd.appendChild(right);
  return hd;
}
function buildProgress(){var p=h('div','progress');var i=h('i');p.appendChild(i);return p;}
function updateHdrBits(){
  var t=document.getElementById('hdTime');
  if(t)t.textContent='⏱ '+fmt(S.left);
  var stn=document.getElementById('hdState');
  if(stn){
    var map={RUNNING:['▶ RUNNING',''],PAUSED_MANUAL:['⏸ PAUSED — manual (press Resume)','paused'],PAUSED_AUTO_CHECK:['⏳ CHECKING — timer parked for feedback (Next resumes)','checking'],ENDED:['■ ENDED','ended'],IDLE:['—','']};
    var m=map[S.ts]||['',''];
    stn.textContent=m[0];stn.className='tstate '+m[1];
  }
  var sc=document.getElementById('hdScore');
  if(sc){var s2=scoreNow();sc.textContent='★ '+s2.cs.toFixed(1)+' / '+s2.a+' · '+s2.pct+'%';}
  var pb=document.getElementById('hdPause');
  if(pb){pb.textContent=(S.ts==='PAUSED_MANUAL')?'▶ Resume':'⏸ Pause';pb.disabled=(S.ts==='ENDED'||S.ts==='IDLE');}
  var pr=document.querySelector('.progress i');
  if(pr&&S.order.length){var done=answeredCount();pr.style.width=Math.max(2,Math.round(done/S.order.length*100))+'%';}
}

/* ---------- scenario & question blocks (identical across every exercise) ---------- */
function renderArt(a,ex){
  var art=h('div','art');
  art.appendChild(txt('div','alabel',a.label));
  if(ex.type==='logview'&&ex.filter!==false){
    var fb=h('div','filterbox');
    fb.appendChild(txt('span','flab2','filter:'));
    var inp=document.createElement('input');inp.type='text';
    inp.placeholder='type to filter lines…';
    inp.setAttribute('aria-label','Filter log lines');
    fb.appendChild(inp);
    var cnt=txt('span','flab2','');fb.appendChild(cnt);
    art.appendChild(fb);
    inp.addEventListener('input',function(){
      var q=inp.value.toLowerCase();var vis=0,all=0;
      var rows=art.querySelectorAll('.apre .row');
      for(var i=0;i<rows.length;i++){
        var hit=!q||rows[i].textContent.toLowerCase().indexOf(q)>=0;
        rows[i].classList.toggle('hide',!hit);if(hit)vis++;all++;
      }
      cnt.textContent=vis+'/'+all+' lines';
    });
  }
  var pre=h('div','apre');
  (a.lines||[]).forEach(function(ln){
    var r=h('div','row');
    r.appendChild(hl(ln));
    pre.appendChild(r);
  });
  art.appendChild(pre);
  return art;
}
function renderScenario(ex){
  var sc=h('section','block');
  var hd=h('div','bhead scenario');
  hd.appendChild(txt('span','bico','▣'));
  hd.appendChild(txt('span','bword','SCENARIO'));
  hd.appendChild(txt('span','spacer'));
  if(ex.summary)hd.appendChild(txt('span','sum',ex.summary));
  var tg=btn('ghost tiny','Collapse',function(){
    var body=sc.querySelector('.bbody');
    var willCollapse=!sc.classList.contains('collapsed');
    sc.classList.toggle('collapsed',willCollapse);
    tg.textContent=willCollapse?'Expand':'Collapse';
    tg.setAttribute('aria-expanded',willCollapse?'false':'true');
  });
  tg.setAttribute('aria-expanded','true');
  hd.appendChild(tg);
  sc.appendChild(hd);
  var body=h('div','bbody');
  (ex.scenario.paras||[]).forEach(function(p){body.appendChild(txt('p','body-p',p));});
  (ex.scenario.arts||[]).forEach(function(a){body.appendChild(renderArt(a,ex));});
  sc.appendChild(body);
  return sc;
}
function renderQuestion(ex){
  var q=h('section','block');
  var hd=h('div','bhead question');
  hd.appendChild(txt('span','bico','◈'));
  hd.appendChild(txt('span','bword','QUESTION'));
  q.appendChild(hd);
  var body=h('div','bbody');
  body.appendChild(txt('p','bquestion',ex.question));
  if(S.hintUsed[cur()]&&S.hintOpen[cur()]){
    var hp=h('div','hintbox');
    hp.appendChild(txt('span','hlab','💡 Hint (−10% of this exercise credit): '));
    hp.appendChild(txt('span',null,ex.hint));
    body.appendChild(hp);
  }
  q.appendChild(body);
  return q;
}

/* ---------- log-line syntax highlighting ---------- */
function hl(line){
  var root=h('span');
  var parts=String(line).split(/("[^"]*")/);
  for(var pi=0;pi<parts.length;pi++){
    var p=parts[pi];
    if(p==='')continue;
    if(pi%2===1){root.appendChild(txt('span','lg-s',p));continue;}
    var toks=p.split(/(\s+)/);
    for(var ti=0;ti<toks.length;ti++){
      var t=toks[ti];
      if(t==='')continue;
      if(/^\s+$/.test(t)){root.appendChild(document.createTextNode(t));continue;}
      var m=t.match(/^([A-Za-z_][\w.\-]*)(=)(.*)$/);
      if(m){root.appendChild(txt('span','lg-k',m[1]+m[2]));root.appendChild(txt('span','lg-v',m[3]));continue;}
      if(/^\d{4}-\d{2}-\d{2}/.test(t)||/^\d{2}:\d{2}:\d{2}/.test(t)){root.appendChild(txt('span','lg-t',t));continue;}
      root.appendChild(txt('span','lg-v',t));
    }
  }
  return root;
}

/* ---------- YOUR ANSWER block: one renderer per exercise type ---------- */
function renderAnswer(ex){
  var a=h('section','block');
  var hd=h('div','bhead answer');
  hd.appendChild(txt('span','bico','✎'));
  hd.appendChild(txt('span','bword','YOUR ANSWER'));
  a.appendChild(hd);
  var body=h('div','bbody');
  var s=st();
  var kind=ex.type;
  if(kind==='qcm'||kind==='multi'||kind==='logview')renderChoice(body,ex);
  else if(kind==='match')renderMatch(body,ex);
  else if(kind==='dnd')renderDnd(body,ex);
  else if(kind==='order'||kind==='rank')renderSeq(body,ex);
  else if(kind==='fill')renderFill(body,ex);
  else if(kind==='queue')renderQueue(body,ex);
  else if(kind==='branch')renderBranch(body,ex);
  else if(kind==='spot')renderSpot(body,ex);
  else if(kind==='query')renderQuery(body,ex);
  a.appendChild(body);
  return a;
}
function choiceSrc(ex){return ex.type==='logview'?ex.answer:ex;}
function isMulti(ex){return ex.type==='multi'||(ex.type==='logview'&&ex.answer.kind==='multi');}
function renderChoice(host,ex){
  var src=choiceSrc(ex);
  var s=st();
  if(!s.sel)s.sel=[];
  if(!s._opts)s._opts=shuffle(src.options);
  s._opts.forEach(function(o){
    var b=h('button','opt');b.type='button';
    b.appendChild(txt('span','olab',o.k+'.'));
    b.appendChild(txt('span','otext',o.t));
    if(inArr(s.sel,o.k))b.classList.add('sel');
    b.addEventListener('click',function(){
      if(S.checked[cur()])return;
      if(isMulti(ex)){
        if(inArr(s.sel,o.k))s.sel=s.sel.filter(function(x){return x!==o.k;});
        else s.sel.push(o.k);
      }else{s.sel=[o.k];}
      b.classList.toggle('sel',inArr(s.sel,o.k));
      updateCheckEnabled();
    });
    host.appendChild(b);
  });
}
function renderMatch(host,ex){
  var s=st();
  if(!s.m)s.m={};
  if(!s._r)s._r=shuffle(ex.pairs.map(function(q){return q.r;}));
  ex.pairs.forEach(function(p,i){
    var row=h('div','matchrow');
    row.appendChild(txt('span','mlab',p.l));
    var sel=document.createElement('select');
    sel.setAttribute('aria-label','Match for '+p.l);
    var ph=txt('option','','— choose —');ph.value='';sel.appendChild(ph);
    s._r.forEach(function(r){var o=txt('option','',r);o.value=r;if(s.m[i]===r)o.selected=true;sel.appendChild(o);});
    sel.addEventListener('change',function(){s.m[i]=sel.value;updateCheckEnabled();});
    row.appendChild(sel);
    host.appendChild(row);
  });
}
function renderDnd(host,ex){
  var s=st();
  if(!s.pl)s.pl={};
  if(!s._bank)s._bank=shuffle(ex.items.map(function(i){return i.k;}));
  var bank=h('div','bank');
  bank.appendChild(txt('p','blab','Item bank — drag an item onto a zone, or click an item and then click a zone. Click a placed item to send it back.'));
  var any=false;
  s._bank.forEach(function(k){
    if(s.pl[k])return;
    any=true;
    bank.appendChild(dndChip(ex,s,k));
  });
  if(!any)bank.appendChild(txt('p','blab','Bank is empty — all items are placed.'));
  host.appendChild(bank);
  var zones=h('div','zones');
  ex.slots.forEach(function(sl){
    var z=h('div','slot');
    z.dataset.slot=sl.id;
    z.setAttribute('tabindex','0');
    z.setAttribute('role','group');
    z.setAttribute('aria-label','Drop zone: '+sl.label);
    z.appendChild(txt('div','slab',sl.label));
    Object.keys(s.pl).forEach(function(k){
      if(s.pl[k]===sl.id){var c=dndChip(ex,s,k);c.classList.add('placed');z.appendChild(c);}
    });
    z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(e){
      e.preventDefault();z.classList.remove('over');
      var k=e.dataTransfer.getData('text/plain');
      if(k&&!S.checked[cur()]){placeDnd(ex,s,k,sl.id);rerender();}
    });
    z.addEventListener('click',function(){if(s._picked&&!S.checked[cur()]){placeDnd(ex,s,s._picked,sl.id);rerender();}});
    zones.appendChild(z);
  });
  host.appendChild(zones);
}
function dndChip(ex,s,k){
  var it=null;
  for(var i=0;i<ex.items.length;i++)if(ex.items[i].k===k)it=ex.items[i];
  var c=txt('button','chip',it.t);c.type='button';
  c.draggable=!S.checked[cur()];
  if(s._picked===k)c.classList.add('picked');
  c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',k);});
  c.addEventListener('click',function(e){
    e.stopPropagation();
    if(S.checked[cur()])return;
    if(s.pl[k]){delete s.pl[k];s._bank.push(k);rerender();return;}
    s._picked=(s._picked===k)?null:k;
    rerender();
  });
  return c;
}
function placeDnd(ex,s,k,slot){
  s.pl[k]=slot;s._picked=null;
  var bi=s._bank.indexOf(k);if(bi>=0)s._bank.splice(bi,1);
}
function renderSeq(host,ex){
  var s=st();
  if(!s.seq)s.seq=[];
  if(!s._bank)s._bank=shuffle(ex.seq.items.map(function(i){return i.k;}));
  if(ex.type==='rank'&&ex.seq.note)host.appendChild(txt('p','blab',ex.seq.note));
  var bank=h('div','bank');
  bank.appendChild(txt('p','blab','Item bank — click an item to put it into the next free position, or drag it. Click a placed item to remove it.'));
  var any=false;
  s._bank.forEach(function(k){
    if(inArr(s.seq,k))return;
    any=true;
    bank.appendChild(seqChip(ex,s,k));
  });
  if(!any)bank.appendChild(txt('p','blab','Bank is empty — all items are placed.'));
  host.appendChild(bank);
  var list=h('div','seqlist');
  ex.seq.correct.forEach(function(_,i){
    var slot=h('div','seqslot');
    slot.appendChild(txt('span','seqnum',String(i+1)));
    if(s.seq[i]){var ch=seqChip(ex,s,s.seq[i]);ch.classList.add('placed');slot.appendChild(ch);}
    slot.addEventListener('click',function(){
      if(S.checked[cur()])return;
      if(s.seq[i]){s._bank.push(s.seq[i]);s.seq.splice(i,1);rerender();}
      else if(s._picked&&!inArr(s.seq,s._picked)){
        s.seq.splice(i,0,s._picked);
        var bi=s._bank.indexOf(s._picked);if(bi>=0)s._bank.splice(bi,1);
        s._picked=null;rerender();
      }
    });
    list.appendChild(slot);
  });
  host.appendChild(list);
}
function seqChip(ex,s,k){
  var it=null;
  for(var i=0;i<ex.seq.items.length;i++)if(ex.seq.items[i].k===k)it=ex.seq.items[i];
  var c=txt('button','chip',it.t);c.type='button';
  c.draggable=!S.checked[cur()];
  if(s._picked===k)c.classList.add('picked');
  c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',k);});
  c.addEventListener('click',function(e){
    e.stopPropagation();
    if(S.checked[cur()])return;
    var pos=s.seq.indexOf(k);
    if(pos>=0){s.seq.splice(pos,1);s._bank.push(k);rerender();return;}
    var free=s.seq.length;
    if(free<ex.seq.correct.length){
      s.seq.splice(free,0,k);
      var bi=s._bank.indexOf(k);if(bi>=0)s._bank.splice(bi,1);
      s._picked=null;rerender();
    }
  });
  return c;
}
function renderFill(host,ex){
  var s=st();
  if(!s.f)s.f={};

  var t=h('p','filltext');

    (function(idx){

        s._tgt=idx;
        if(s._pick){s.f[idx]=s._pick;var bi=s._bank.indexOf(s._pick);if(bi>=0)s._bank.splice(bi,1);s._pick=null;s._tgt=null;}
        rerender();
      });
      t.appendChild(b);
    })(parseInt(parts[i],10));

  host.appendChild(t);
  var bank=h('div','bank');
  bank.appendChild(txt('p','blab','Word bank — click a word to fill the selected blank, or the first empty blank. Click a filled blank to empty it.'));
  s._bank.forEach(function(w){
    var c=txt('button','chip',w);c.type='button';
    if(s._pick===w)c.classList.add('picked');
    c.addEventListener('click',function(){
      if(S.checked[cur()])return;
      s._pick=(s._pick===w)?null:w;
      var tgt=(s._tgt!==undefined&&s._tgt!==null&&s.f[s._tgt]===undefined)?s._tgt:fillFirstEmpty(ex,s);
      if(s._pick&&tgt!==null&&tgt!==undefined){
        s.f[tgt]=w;

      }
      rerender();
    });
    bank.appendChild(c);
  });
  host.appendChild(bank);
}

/* ---------- Check enablement ---------- */
function hasInteraction(ex){
  var s=st(cur());
  switch(ex.type){
    case 'qcm':case 'multi':case 'logview':return !!(s.sel&&s.sel.length>0);
    case 'match':return !!(s.m&&Object.keys(s.m).length>0);
    case 'dnd':return !!(s.pl&&Object.keys(s.pl).length>0);
    case 'order':case 'rank':return !!(s.seq&&s.seq.length>0);
    case 'fill':return !!(s.f&&Object.keys(s.f).length>0);
    case 'queue':return !!(s.q&&Object.keys(s.q).length>0);
    case 'spot':return !!(s.sp&&s.sp.length>0);
    case 'query':return !!((s.qt||'').trim());
    case 'branch':return false;
  }
  return false;
}
function updateCheckEnabled(){
  var c=document.getElementById('checkBtn');
  if(c)c.disabled=!hasInteraction(EXS[cur()]);
}

/* ---------- grading (partial credit: max(0,(H-W)/N), hint −0.10 after) ---------- */
function gradeCurrent(){
  var i=cur(),ex=EXS[i],s=st(i),g;
  if(ex.type==='qcm'||ex.type==='multi'||ex.type==='logview')g=gradeChoice(ex,s);
  else if(ex.type==='match')g=gradeMatch(ex,s);
  else if(ex.type==='dnd')g=gradeDnd(ex,s);
  else if(ex.type==='order'||ex.type==='rank')g=gradeSeq(ex,s);
  else if(ex.type==='fill')g=gradeFill(ex,s);
  else if(ex.type==='queue')g=gradeQueue(ex,s);
  else if(ex.type==='branch')g=gradeBranch(ex,s);
  else if(ex.type==='spot')g=gradeSpot(ex,s);
  else if(ex.type==='query')g=gradeQuery(ex,s);
  var N=g.N||1,H=g.H||0,W=g.W||0;
  var credit=Math.max(0,(H-W)/N);
  if(S.hintUsed[i])credit=Math.max(0,credit-0.10);
  g.credit=credit;
  return g;
}
function gradeChoice(ex,s){
  var src=choiceSrc(ex);
  var ans=src.answer,opts=src.options;
  var sel=s.sel||[];
  var byk={};opts.forEach(function(o){byk[o.k]=o;});
  var N=ans.length,H=0,W=0,rows=[];
  ans.forEach(function(k){
    var o=byk[k];
    if(inArr(sel,k)){H++;rows.push({state:'ok',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});}
    else rows.push({state:'miss',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});
  });
  sel.forEach(function(k){
    if(!inArr(ans,k)){
      W++;
      var o=byk[k];
      rows.push({state:'no',label:o.k+'. '+o.t,why:(src.whyNots&&src.whyNots[k])||'This option is not part of the correct answer here.'});
    }
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeMatch(ex,s){
  var N=ex.pairs.length,H=0,W=0,rows=[];
  ex.pairs.forEach(function(p,i){
    var c=s.m?s.m[i]:undefined;
    if(c===p.r){H++;rows.push({state:'ok',label:p.l+' → '+p.r,why:p.why||''});}
    else if(c){W++;rows.push({state:'no',label:p.l+' → '+c,why:'Correct pair: '+p.l+' → '+p.r+'. '+(p.why||'')});}
    else rows.push({state:'miss',label:p.l+' → '+p.r,why:p.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeDnd(ex,s){
  var N=ex.items.length,H=0,W=0,rows=[];
  ex.items.forEach(function(it){
    var placed=s.pl?s.pl[it.k]:undefined;
    var right=ex.map[it.k];
    if(placed===right){H++;rows.push({state:'ok',label:it.t+' → '+slotLabel(ex,right),why:(ex.whys&&ex.whys[it.k])||''});}
    else if(placed){W++;rows.push({state:'no',label:it.t+' → '+slotLabel(ex,placed),why:'Correct zone: '+slotLabel(ex,right)+'. '+(ex.whys&&ex.whys[it.k]||'')});}
    else rows.push({state:'miss',label:it.t+' (belongs in '+slotLabel(ex,right)+')',why:(ex.whys&&ex.whys[it.k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function slotLabel(ex,id){
  for(var i=0;i<ex.slots.length;i++)if(ex.slots[i].id===id)return ex.slots[i].label;
  return id;
}
function gradeSeq(ex,s){
  var corr=ex.seq.correct,N=corr.length,H=0,W=0,rows=[];
  var labels={};
  ex.seq.items.forEach(function(it){labels[it.k]=it.t;});
  corr.forEach(function(k,i){
    var placed=s.seq?s.seq[i]:undefined;
    if(placed===k){H++;rows.push({state:'ok',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});}
    else if(placed){W++;rows.push({state:'no',label:'Position '+(i+1)+': '+labels[placed],why:'Correct item for position '+(i+1)+': '+labels[k]+'. '+(ex.seq.whys&&ex.seq.whys[k]||'')});}
    else rows.push({state:'miss',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeFill(ex,s){
  var N=ex.fill.answers.length,H=0,W=0,rows=[];
  ex.fill.answers.forEach(function(w,i){
    var f=s.f?s.f[i]:undefined;
    if(f===w){H++;rows.push({state:'ok',label:'Blank '+(i+1)+': '+w,why:(ex.fill.whys&&ex.fill.whys[i])||''});}
    else if(f){W++;rows.push({state:'no',label:'Blank '+(i+1)+': you wrote "'+f+'"',why:'Correct word: '+w+'. '+(ex.fill.whys&&ex.fill.whys[i]||'')});}
    else rows.push({state:'miss',label:'Blank '+(i+1)+': '+w,why:(ex.fill.whys&&ex.fill.whys[i])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeQueue(ex,s){
  var N=ex.queue.rows.length,H=0,W=0,rows=[];
  ex.queue.rows.forEach(function(r,i){
    var c=s.q?s.q[i]:undefined;
    if(c===r.answer){H++;rows.push({state:'ok',label:r.label+': '+c,why:r.why||''});}
    else if(c){W++;rows.push({state:'no',label:r.label+': you chose "'+c+'"',why:'Correct: '+r.answer+'. '+(r.why||'')});}
    else rows.push({state:'miss',label:r.label+': '+r.answer,why:r.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeBranch(ex,s){
  var steps=ex.branch.steps,N=steps.length,H=0,W=0,rows=[];
  steps.forEach(function(sp,i){
    var a=s.b?s.b.ans[i]:undefined;
    if(a===sp.answer){H++;rows.push({state:'ok',label:'Step '+(i+1)+': '+a,why:sp.why||''});}
    else if(a){W++;rows.push({state:'no',label:'Step '+(i+1)+': you chose "'+a+'"',why:'Correct: '+sp.answer+'. '+(sp.why||'')});}
    else rows.push({state:'miss',label:'Step '+(i+1)+': '+sp.answer,why:sp.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeSpot(ex,s){
  var bad=ex.spot.bad,N=bad.length,H=0,W=0,rows=[];
  var sel=s.sp||[];
  bad.forEach(function(i){
    if(inArr(sel,i)){H++;rows.push({state:'ok',label:ex.spot.lines[i],why:(ex.spot.whys&&ex.spot.whys[i])||''});}
    else rows.push({state:'miss',label:ex.spot.lines[i],why:(ex.spot.whys&&ex.spot.whys[i])||''});
  });
  sel.forEach(function(i){
    if(!inArr(bad,i)){W++;rows.push({state:'no',label:ex.spot.lines[i],why:'This line is correct — selecting it is a false positive.'});}
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeQuery(ex,s){
  var text=normq(s.qt||'');
  var N=ex.query.elements.length,H=0,W=0,rows=[];
  function test(arr){for(var i=0;i<arr.length;i++){try{if(new RegExp(arr[i],'i').test(text))return true;}catch(e){}}return false;}
  ex.query.elements.forEach(function(e2){
    var hit=e2.all?e2.all.every(function(r){try{return new RegExp(r,'i').test(text);}catch(err){return false;}}):test(e2.any);
    if(hit){H++;rows.push({state:'ok',label:e2.desc,why:'Present in your query.'});}
    else rows.push({state:'miss',label:e2.desc,why:'Not found in your query.'});
  });
  (ex.query.forbidden||[]).forEach(function(f2){
    if(test(f2.any)){W++;rows.push({state:'no',label:f2.desc,why:f2.why||'This does not belong in a detection query.'});}
  });
  return {N:N,H:H,W:W,rows:rows,canonical:ex.query.canonical,notes:ex.query.notes};
}

/* ---------- exam flow ---------- */
function start(){
  S.view='exam';
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pos=0;S.left=(META.estimatedMinutes||30)*60;S.ts='RUNNING';
  S.credits={};S.checked={};S.skipped={};S.hintUsed={};S.hintOpen={};S.st={};S._lastG={};
  S.reviewing=false;S.reported=false;S.manualMs=0;S.autoMs=0;S.pauseKind=null;S.underAuto=false;S._resAnim=false;
  render();window.scrollTo(0,0);
}
function useHint(){
  var i=cur();
  if(S.ts!=='RUNNING')return;
  if(S.checked[i]||S.hintUsed[i])return;
  S.hintUsed[i]=true;S.hintOpen[i]=true;
  rerender();
}
function doCheck(branchFinal){
  var i=cur(),ex=EXS[i];
  if(S.checked[i])return;
  if(!branchFinal&&!hasInteraction(ex))return;
  var g=gradeCurrent();
  S._lastG[i]=g;
  S.checked[i]=true;
  S.credits[i]=g.credit;
  S.ts='PAUSED_AUTO_CHECK';
  S.underAuto=true;
  enterPause('auto');
  render();
  var fb=document.getElementById('fbhost');
  if(fb)fb.scrollIntoView({block:'nearest'});
}
function goNext(){
  leavePause();S.underAuto=false;S.ts='RUNNING';
  S.pos++;render();window.scrollTo(0,0);
}
function skipEx(){
  if(S.ts!=='RUNNING')return;
  if(S.checked[cur()])return;
  S.skipped[cur()]=true;
  if(S.reviewing){S.reviewing=false;S.view='review';S.ts='RUNNING';render();window.scrollTo(0,0);return;}
  leavePause();
  if(S.pos>=S.order.length-1){finalSubmit();}
  else{S.pos++;render();window.scrollTo(0,0);}
}
function finalSubmit(){
  leavePause();S.underAuto=false;
  var sl=skippedList();
  if(sl.length&&S.ts!=='ENDED'){S.ts='RUNNING';S.view='review';render();window.scrollTo(0,0);}
  else finish();
}
function finish(){
  leavePause();S.underAuto=false;
  if(S.ts!=='ENDED')S.ts='ENDED';
  S.view='results';
  render();
}

/* ---------- review-skipped screen ---------- */
function renderReview(){
  var w=h('div');
  var hd=h('header','hdr');
  hd.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  hd.appendChild(b);
  hd.appendChild(txt('span','excount','Review — '+skippedList().length+' skipped to answer'));
  hd.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  hd.appendChild(txt('span','tstate','')).id='hdState';
  hd.appendChild(txt('span','tmono score','')).id='hdScore';
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.setAttribute('aria-label','Pause the timer');pb.addEventListener('click',togglePause);
  hd.appendChild(pb);
  w.appendChild(hd);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','⚠ Review skipped exercises'));
  card.appendChild(txt('p','body-p','These exercises are skipped and still unanswered. You may return to any of them and answer while the timer has time left. If you finish the exam now, skipped-and-never-answered exercises are excluded from the score: they do not count as correct, wrong, or possible points.'));
  var sl=skippedList();
  sl.forEach(function(ix){
    var ex=EXS[ix];
    var row=h('div','qrow');
    var lab=h('div','qopts');
    lab.appendChild(txt('span','skchip','⚠ Skipped'));
    lab.appendChild(txt('span','sknum','Exercise '+(S.order.indexOf(ix)+1)+' of '+S.order.length));
    lab.appendChild(txt('span','sktitle',ex.title));
    row.appendChild(lab);
    row.appendChild(btn('primary','Return and answer',function(){
      S.reviewing=true;
      S.pos=S.order.indexOf(ix);
      S.view='exam';
      S.ts='RUNNING';
      render();window.scrollTo(0,0);
    }));
    card.appendChild(row);
  });
  if(!sl.length)card.appendChild(txt('p','body-p','Nothing is skipped — you can finish.'));
  var f=h('div','footer');
  f.appendChild(btn('primary big','⏏ Finish exam',finish));
  card.appendChild(f);
  w.appendChild(card);
  app.appendChild(w);
}

/* ---------- results screen ---------- */
function renderResults(){
  var f=finalNumbers();
  var pass=f.passed;
  var w=h('div');
  var hero=h('section','card result-hero '+(pass?'pass':'fail'));
  hero.appendChild(txt('div','res-ico',pass?'✓':'✗'));
  hero.appendChild(txt('h1','res-title',pass?'✓ PASS':'✗ FAIL'));
  hero.appendChild(txt('p','res-sub',pass
    ?'Certificate-style result — you mastered the '+SEVWORD+' level of DET0489 (Parent PID Spoofing detection).'
    :'Not yet — the '+SEVWORD+' level of DET0489 needs '+PASS+'% or more. Review the intro and the feedback you received, then retake.'));
  var rs=txt('div','res-score','…');rs.id='resScore';hero.appendChild(rs);
  hero.appendChild(txt('p','res-note','Pass mark '+PASS+'% — score computed over answered exercises only (skipped-and-never-answered are excluded). Raw fractional credit: '+f.raw.toFixed(2)+' — posted score rounded to '+f.score+'.'));
  w.appendChild(hero);
  if(!S._resAnim){S._resAnim=true;animateScore(rs,f);}
  else{rs.textContent=f.score+' / '+f.total+' · '+f.percent+'%';}
  var full=0,part=0,zero=0,partSum=0,k;
  for(k in S.checked){var c=S.credits[k];if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
  var grid=h('div','statgrid');
  function stat(cls,ico,label,val){var s2=h('div','stat '+cls);s2.appendChild(txt('div','big',ico+' '+val));s2.appendChild(txt('div','slab',label));return s2;}
  grid.appendChild(stat('ok','✓','Fully correct',String(full)));
  grid.appendChild(stat('part','✓','Partially correct'+(part?' — avg '+(partSum/part).toFixed(2)+' credit':''),String(part)));
  grid.appendChild(stat('no','✗','Fully incorrect',String(zero)));
  grid.appendChild(stat('skip','⚠','Skipped — excluded',String(skippedList().length)));
  var budget=(META.estimatedMinutes||30)*60;
  var active=Math.max(0,Math.round((budget-S.left)-(S.manualMs+S.autoMs)/1000));
  grid.appendChild(stat('run','▶','Time answering (timer running)',fmt(active)));
  grid.appendChild(stat('pause','⏸','Time paused manually',fmt(Math.round(S.manualMs/1000))));
  grid.appendChild(stat('pause','⏸','Time paused for feedback',fmt(Math.round(S.autoMs/1000))));
  w.appendChild(grid);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','Your answers'));
  S.order.forEach(function(ix,i){
    var ex=EXS[ix];
    var chip,stateCls;
    if(!S.checked[ix]){chip='⚠ SKIPPED — EXCLUDED';stateCls='skip';}
    else{
      var c=S.credits[ix];
      if(c>=1){chip='✓ CORRECT';stateCls='ok';}
      else if(c>0){chip='✓ PARTIALLY CORRECT — '+c.toFixed(2);stateCls='part';}
      else{chip='✗ INCORRECT';stateCls='no';}
    }
    var r=h('div','rrow');
    var ln=h('div','rline '+stateCls);
    ln.appendChild(txt('span','rlab',(i+1)+'. '+ex.title));
    ln.appendChild(txt('span','rchip',chip));
    r.appendChild(ln);
    card.appendChild(r);
  });
  w.appendChild(card);
  var f=h('div','center');
  f.appendChild(btn(pass?'ghost':'primary big','↻ Retake Exam',start));
  w.appendChild(f);
  app.appendChild(w);
}

/* ---------- site contract: score report + handshake ---------- */
function finalNumbers(){
  var s2=scoreNow();
  var score=Math.round(s2.cs); /* the fractional sum is rounded only here, once per attempt */
  var percent=s2.a>0?Math.round(score/s2.a*100):0;
  return{score:score,total:s2.a,percent:percent,passed:percent>=PASS,raw:s2.cs};
}
function reportOnce(){
  if(S.reported)return;
  S.reported=true;
  var f=finalNumbers();
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:f.score,
      total:f.total,
      percent:f.percent,
      passed:f.passed
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function animateScore(el,f){
  var fin=f.score+' / '+f.total+' · '+f.percent+'%';
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce||f.total===0){el.textContent=fin;setTimeout(reportOnce,80);return;}
  var t0=null,dur=1100;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(f.score*eased)+' / '+f.total+' · '+Math.round(f.percent*eased)+'%';
    if(p<1)requestAnimationFrame(step);
    else{el.textContent=fin;setTimeout(reportOnce,300);}
  }
  requestAnimationFrame(step);
}
window.addEventListener('message',function(ev){
  if(!ev.data)return;
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT')return;
  S.user={username:ev.data.username||'',country:ev.data.country||'',locale:ev.data.locale||''};
  /* theme field is always 'dark' — this file is dark-only by contract; nothing to switch. */
});

render();
})();
</script>
