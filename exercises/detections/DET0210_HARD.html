'use strict';
var EXAM = {"topicId": "det0210", "batch": 3, "difficulty": "hard", "passMark": 70, "minutes": 18, "attckId": "DET0210", "objectType": "detection-strategy", "objectLabel": "Detection Strategy", "title": "Abuse of Domain Accounts", "severityWord": "HARD", "intro": {"learn": ["DET0210 is a <b>Detection Strategy</b> object in MITRE ATT&amp;CK for <b>abuse of valid domain accounts</b> (technique T1078.002, Domain Accounts). It bundles four platform analytics — AN0590 (Windows), AN0591 (Linux), AN0592 (macOS), AN0593 (ESXi) — under one detection intent, with log sources, data components, and nine mutable elements across them.", "In this exam you will work like a senior detection engineer. You will judge raw logon sequences (<code>4624</code>, <code>4625</code>, <code>4768</code>, <code>4769</code>, Sysmon <code>1</code>/<code>3</code>/<code>22</code>) and separate impossible travel from VPN noise. You will tune the mutable elements — TimeWindow, UserContext, LogonType, HostnameScope, AccountDomain, UserLocation, LogonMethod, AccountType, LoginInterface — without blinding the rule.", "You will also explain coverage gaps (missing log forwarding, missing Sysmon, hosts without sssd), walk the triage workflow of an AN0590 alert end to end, and connect the detection to lateral movement with valid accounts. Some options are deliberately <b>half true</b> — read every word."], "keywords": ["impossible travel", "geo-velocity", "VPN allowlist", "LogonType 2 / 5 / 10", "Tier-0 scoping", "HostnameScope", "AccountDomain", "vpxuser", "LoginInterface", "hostd.log", "4768 + 4624 correlation", "lateral movement", "Sysmon 1 / 3 / 22", "time-zone baselines", "alert triage", "tuning review", "4625 failed logons"], "how": ["<b>Goal:</b> answer at least 70% correctly. That is the pass mark. Partial credit applies to multi-select and drag-and-drop exercises: correct picks minus wrong picks, divided by the number of correct items, never below zero.", "<b>Exercise types:</b> single choice, multi-select (the question tells you how many are correct), drag-and-drop matching, and one ordering task (tap items into the correct sequence). In this file some wrong options are <b>near misses</b> — statements that are half right. Read them twice.", "<b>Timer:</b> you have 18 minutes (18:00). The timer runs while you answer. When you press <b>Check</b>, the timer stops by itself (an auto-pause) while you read the feedback. Press <b>Next</b> and the timer runs again. You can also pause the timer yourself with the <b>Pause</b> button.", "<b>Hints:</b> every exercise has one hint. It only points at the concept — it will not give you the answer. A hint costs 0.15 of the credit for that exercise.", "<b>Skipping:</b> you can skip an exercise with the Skip button. The timer keeps running. At the end you get a chance to review the skipped exercises. Skipped exercises that you never answer do not count in your score or your total.", "<b>Long scenarios:</b> the SCENARIO box folds open and closed with a click on its title. In this file most scenarios are long — open them first.", "At the end you will see your result, and the result is sent to the training platform."]}, "exercises": [{"kind": "single", "long": true, "scenario": "<p>Your SIEM shows three 4624 events for the account <code>j.wilson</code> within 21 minutes:</p><div class='mono'><span class='tok-num'>4624</span>  j.wilson  LogonType:<span class='tok-num'>2</span>   09:12  <span class='tok-path'>10[.]20[.]4[.]15</span>   NYC-WS-114\n<span class='tok-num'>4624</span>  j.wilson  LogonType:<span class='tok-num'>10</span>  09:31  <span class='tok-path'>198.51.100.7</span>  LON-RDS-02\n<span class='tok-num'>4624</span>  j.wilson  LogonType:<span class='tok-num'>10</span>  09:33  <span class='tok-path'>203.0.113.9</span>   TYO-RDS-01</div><p>There are no 4625 failures, and no burst of 4769 requests. NYC, London and Tokyo are the geolocations of the three source IPs. The London and Tokyo addresses are not your VPN egress.</p>", "question": "Which judgment is the strongest?", "options": ["The pattern matches the core case of AN0590 — the same valid account in sessions that are too far apart in space and time; escalate after the VPN check", "It can never be an attack, because far-apart logons are always VPN egress", "It is password spraying, because three logons means three guesses", "It is Kerberoasting, because remote sessions need service tickets"], "correct": [0], "explain": "<p><b>A is correct.</b> Three logons for one account, two continents apart within two minutes, is physically impossible travel — the defining 'simultaneous sessions from geographically distant locations' case of AN0590. The VPN check is still prudent (one line of bookkeeping), but the escalation path is set.</p><p><b>B is a near miss</b> — it starts like a real caution ('verify VPN first') but the word <i>never</i> makes it wrong: the addresses are explicitly not your VPN egress, and blanket assumptions both miss attacks and excuse you from looking.</p><p><b>C is wrong</b> because password spraying shows many <code>4625</code> failures across many accounts — there are none here. <b>D is wrong</b> because Kerberoasting is a burst of <code>4769</code> requests with weak encryption on the DC; remote logons (LogonType 10) do not imply it.</p>", "hint": "Distance divided by time — what would a plane need to do?"}, {"kind": "multi", "long": false, "scenario": "<p>You lead a tuning session for AN0590 in a global company with offices on three continents, a large VPN fleet, and ~200 service accounts. Four of the six proposed moves below are sound; two would damage the detection.</p>", "question": "Which four tuning moves are sound for AN0590? <b>Select 4.</b>", "options": ["Scope UserContext to sensitive accounts first — Domain Admins and business-critical service accounts", "Shape TimeWindow to the real shift patterns of your teams, including other time zones", "Separate LogonType 5 (service) logons of reviewed service accounts into a lower-priority rule", "Keep the geographic-impossible check, but allowlist your own VPN egress addresses", "Drop event 4625 from the telemetry so the Security stream gets smaller", "Remove Sysmon events 3 and 22 to save space"], "correct": [0, 1, 2, 3], "explain": "<p><b>A, B, C and D are correct.</b> A focuses the loudest signal (sensitive accounts) first — that is the UserContext element. B makes off-hours match reality across time zones — the TimeWindow element. C separates robot noise from human risk using LogonType. D keeps the impossible-travel check alive while removing your own infrastructure from it — a targeted allowlist, not a blind eye.</p><p><b>E is a near miss</b> — 'smaller stream' sounds responsible, but 4625 failures are the evidence base for spray and lockout patterns; removing them blinds more than AN0590. <b>F is a near miss</b> — those two Sysmon codes are the analytic's only view of Network Connection Creation (DC0082); removing them deletes a whole coverage area.</p>", "hint": "Four moves sharpen the focus. Two moves delete coverage. Which is which?"}, {"kind": "single", "long": true, "scenario": "<p>After AN0591 goes live on your Linux fleet, it creates about 3,000 alerts per day. Drill-down shows one pattern: a monitoring agent authenticates with a dedicated domain account (<code>svc_monitoring</code>) via <code>pam_authenticate</code> against every server every 5 minutes. The agent is documented and required. AN0591's mutable elements are <b>HostnameScope</b> (filter to high-value systems) and <b>AccountDomain</b> (trusted vs external domains).</p>", "question": "What is the best fix using the analytic's own mutable elements?", "options": ["Use HostnameScope to focus the analytic on high-value domain-joined servers, and baseline the monitoring account as expected behavior", "Turn AN0591 off completely and rely on EDR alone", "Ignore all Linux alerts during business hours", "Move the monitoring agent to macOS so the macOS analytic catches it instead"], "correct": [0], "explain": "<p><b>A is correct.</b> HostnameScope narrows the detection to the servers where a domain-logon anomaly actually matters. Together with baselining the documented monitoring account, the noise disappears while real coverage stays on the systems that count.</p><p><b>B is a near miss</b> — turning the analytic off does remove noise, but it also removes the only domain-logon view on Linux; that is the opposite of tuning. <b>C is wrong</b> because business hours are exactly when attackers work, and a blind window is a gift to them. <b>D is wrong</b> — moving a Linux monitoring agent to macOS changes nothing about the Linux noise and breaks the monitoring's purpose.</p>", "hint": "The analytic offers exactly two dials: which hosts, which domain."}, {"kind": "drag", "long": false, "scenario": "<p>Each analytic of DET0210 declares its own log sources. Getting source-to-analytic mapping right decides which agent you deploy where.</p>", "question": "Match each log source to the analytic that uses it.", "zones": ["AN0590 (Windows)", "AN0591 (Linux)", "AN0592 (macOS)", "AN0593 (ESXi)"], "bank": ["WinEventLog:Security (4624, 4625, 4768, 4769)", "auditd:SYSCALL (pam_authenticate, sshd)", "macos:unifiedlog (Authentication predicate)", "esxi:vpxd and esxi:hostd"], "solution": [0, 1, 2, 3], "explain": "<p><b>WinEventLog:Security → AN0590</b> — Windows logon session metadata. <b>auditd:SYSCALL → AN0591</b> — Linux authentication syscalls via sssd/sshd. <b>macos:unifiedlog → AN0592</b> — macOS authentication messages from the unified log. <b>esxi:vpxd/hostd → AN0593</b> — ESXi host logins including vpxuser and management-plane access.</p><p>The classic swap is auditd vs unifiedlog: auditd is the Linux kernel audit system (SYSCALL records), while the unified log is Apple's single logging store read with <code>log show</code>.</p>", "hint": "Kernel audit belongs to Linux; one logging store belongs to macOS."}, {"kind": "single", "long": true, "scenario": "<p>In <code>vpxd.log</code> on an ESXi host you find a login of the domain user account <code>dev_bot</code> over <b>SSH</b> at 03:40 local time. SSH on your ESXi hosts is disabled by default and enabled only during approved maintenance. AN0593's mutable element <b>LoginInterface</b> is described as: 'Distinguish interactive UI login from API or SSH access.'</p>", "question": "Why does AN0593 pay attention to the LoginInterface (UI vs API vs SSH)?", "options": ["SSH access to ESXi is rare and powerful, so the login path changes how urgent the alert is", "Because SSH logins are not written to any log, so they must be inferred", "Because API logins cannot be recorded by ESXi", "Because vpxd.log only stores mouse clicks and UI sessions"], "correct": [0], "explain": "<p><b>A is correct.</b> The same credential reaching an ESXi host through the UI, an API, or SSH implies very different capability and very different normality. SSH on a hypervisor is both uncommon and high-privilege — so LoginInterface turns one 'login' into three very different risk judgments.</p><p><b>B is wrong</b> — SSH logins on ESXi land in <code>hostd.log</code>/<code>vpxd.log</code>; that is how this scenario was seen at all. <b>C is wrong</b> — API logins are recorded too (vCenter and host APIs log their sessions). <b>D is wrong</b> — vpxd.log records management-plane sessions of all kinds, not just UI clicks.</p>", "hint": "Same door, three doorbells — which doorbell rings during normal operations?"}, {"kind": "multi", "long": false, "scenario": "<p>AN0590 is enabled on the domain controllers. The team confirms the analytic logic works — but analysts see almost nothing for <b>workstation</b> logons. Five explanations are proposed; three are real collection gaps, two are not gaps at all.</p>", "question": "Which three gaps can explain the missing workstation telemetry for AN0590? <b>Select 3.</b>", "options": ["Workstation Security events are not forwarded to the SIEM", "Sysmon is not installed on the workstations, so there are no process and network events", "The Security log on workstations rolls over quickly, so events are gone before collection", "Event 4624 exists in Windows by default on every workstation", "The company uses Kerberos for authentication"], "correct": [0, 1, 2], "explain": "<p><b>A, B and C are correct.</b> Detection coverage breaks at collection: if Security events are never forwarded (A), AN0590 never sees them; without Sysmon the analytic's Process Creation and Network Connection Creation sources stay empty (B); and fast log rollover destroys events before the forwarder reads them (C).</p><p><b>D is not a gap</b> — 4624 being logged by default is a fact in favor of coverage, not against it; the gap would be in shipping it somewhere. <b>E is not a gap</b> — Kerberos is the normal domain protocol here; 4768/4769 exist precisely because of it.</p>", "hint": "Ask where the event dies: never written, never shipped, or gone too fast."}, {"kind": "single", "long": true, "scenario": "<p>During a server audit you find that several Linux servers were joined to a <b>look-alike domain</b> — they answer to a similar-sounding name instead of your trusted corporate domain. Users can still authenticate, but these hosts are effectively outside your real domain boundary. AN0591's mutable element <b>AccountDomain</b> is described as: 'Identify trusted domains versus external or misconfigured domains.'</p>", "question": "Which mutable element of AN0591 is designed to catch this?", "options": ["AccountDomain — it separates trusted domains from external or misconfigured ones", "TimeWindow", "LoginInterface", "UserLocation"], "correct": [0], "explain": "<p><b>A is correct.</b> AccountDomain compares the domain that the authentication claims against the domains your team marked as trusted. A look-alike or misconfigured domain stands out exactly there.</p><p><b>B is wrong</b> — TimeWindow shapes hours, not domain identity. <b>C is wrong</b> — LoginInterface belongs to AN0593 (ESXi) and shapes access path, not domain trust. <b>D is wrong</b> — UserLocation belongs to AN0592 (macOS) and is about geography, not domain names.</p>", "hint": "The problem is the domain's name — pick the element that judges names."}, {"kind": "single", "long": false, "scenario": "<p>AN0590's description includes 'simultaneous sessions from geographically distant locations'. Junior analysts ask why this specific pattern is treated as a strong signal.</p>", "question": "Why is 'simultaneous sessions from geographically distant locations' such a strong signal?", "options": ["A person cannot be in two far-apart places at once, so the valid account is probably used by two parties", "Because geographically close logins are always attacks", "Because distant servers respond faster", "Because Kerberos tickets expire over long distances"], "correct": [0], "explain": "<p><b>A is correct.</b> Two live sessions for the same valid account, too far apart to travel between, means the credential (or an authenticated session) exists in two hands. That is the essence of valid-account abuse: the password check passes because the credential is real.</p><p><b>B is wrong</b> — closeness proves nothing in either direction. <b>C is wrong</b> — latency is a network property, not a risk signal here. <b>D is wrong</b> — ticket expiry depends on time and policy, not kilometers.</p>", "hint": "Physics is the detector: nobody is in Tokyo and Paris at the same minute."}, {"kind": "order", "long": false, "scenario": "<p>An AN0590 alert lands in the queue: one account, three hosts, one hour, off-hours. The on-call analyst needs a repeatable order of work — from cheap verification to expensive action.</p>", "question": "Put the triage steps of an AN0590 alert in the best order.", "items": ["Check the pattern: how many hosts, which LogonType, how far apart are the sessions?", "If nothing explains it: escalate and contain (disable the account or reset the password).", "Confirm the time window: is it really off-hours in the account's local time zone?", "Ask the account owner or check change tickets for planned work.", "Enrich the source: is the IP a corporate VPN egress, a mobile network, or an unknown network?"], "correctOrder": [2, 4, 0, 3, 1], "explain": "<p><b>1 — Time window:</b> many 'off-hours' alerts die at the first step, because the server's clock and the user's time zone disagree. <b>2 — Source enrichment:</b> one VPN-egress lookup removes the most common false positive. <b>3 — Pattern check:</b> hosts, LogonType, and spacing decide how strong the multi-host signal really is. <b>4 — Human check:</b> the owner or the change tickets turn 'unusual' into 'planned' — or not. <b>5 — Escalate and contain:</b> only when steps 1–4 leave the behavior unexplained does containment make sense.</p><p>Wrong orders usually act before verifying (expensive false alarms) or verify forever without acting (real damage). The rule: cheapest verification first, irreversible action last.</p>", "hint": "Clocks first, action last — and the human question before the big hammer."}, {"kind": "single", "long": false, "scenario": "<p>In AN0593's description, ESXi logins get extra attention when they involve <code>vpxuser</code> or accounts with unexpected group memberships.</p>", "question": "What is vpxuser on an ESXi host?", "options": ["The special account vCenter uses to manage the ESXi host — logins by it, or accounts behaving like it, at odd times are notable", "The name of the ESXi built-in firewall", "A Kerberos protocol version used by vSphere", "The macOS login window in virtual machines"], "correct": [0], "explain": "<p><b>A is correct.</b> <code>vpxuser</code> is the service account vCenter uses to administer ESXi hosts. Its logins are normally machine-paced and vCenter-sourced. A human session, a new source, or odd hours for <code>vpxuser</code> — or for a domain account with unexpected group memberships — is a high-value signal for AN0593.</p><p><b>B is wrong</b> — it is an account, not a firewall. <b>C is wrong</b> — Kerberos versions have nothing to do with vpxuser. <b>D is wrong</b> — macOS is a different analytic (AN0592) and a different world.</p>", "hint": "It starts with vpx — who else talks to vCenter?"}, {"kind": "multi", "long": false, "scenario": "<p>You are building a 'valid account lateral movement' hunt and want AN0590's telemetry to carry the argument. Five candidate patterns are on the table; three describe multi-host movement, two describe something else.</p>", "question": "Which three patterns best show lateral movement with valid accounts (not misuse on one host)? <b>Select 3.</b>", "options": ["The same account receives 4624 logons on many servers within minutes", "sshd / pam authentication chains appear across several Linux servers in sequence", "Sysmon 3 connections from a fresh logon reach many internal targets in a row", "Many 4625 failures hit one account on one host", "One user changes their own password once"], "correct": [0, 1, 2], "explain": "<p><b>A, B and C are correct.</b> All three are <i>movement</i> shapes: repeated successful logons of one identity across a host set (Windows), a walk of authentication events across Linux servers, or a fresh session opening many internal connections right after logon — the network footprint of someone touring the network with a valid account.</p><p><b>D is wrong</b> — a failure burst on <i>one</i> host is password guessing, a different behavior with its own detections; it shows no movement at all. <b>E is wrong</b> — a single self-service password change is routine hygiene, not movement.</p>", "hint": "Movement needs at least two places — count the places in each answer."}, {"kind": "single", "long": true, "scenario": "<p>Your company runs a 24/7 NOC with staff on three continents. The AN0590 TimeWindow was left with the default: 19:00–07:00 counts as off-hours for everyone. Two weeks later the alert queue is dominated by NOC night-shift logons.</p>", "question": "What is happening, and what is the right fix?", "options": ["The default window mislabels normal night work as off-hours; tune TimeWindow per region or per role", "Nothing; time zones do not matter for logon analysis", "The detection has stopped reading the Security log", "Kerberos tickets now expire faster for NOC staff"], "correct": [0], "explain": "<p><b>A is correct.</b> 'Off-hours' is only meaningful relative to the account's real schedule. A global NOC has no global night — so the single default TimeWindow manufactures false positives at industrial scale. Region- or role-shaped windows (the whole point of the mutable element) fix the label, not the staff.</p><p><b>B is wrong</b> — time zones are exactly what makes a single global window wrong. <b>C is wrong</b> — the analytic reads the log fine; it is judging with the wrong clock. <b>D is wrong</b> — ticket lifetime is a Kerberos policy, untouched by any of this.</p>", "hint": "Someone's midnight is someone else's mid-morning."}, {"kind": "single", "long": false, "scenario": "<p>An investigator has both the domain controller's Security log and the target host's Security log open, looking at the same account. Events <code>4768</code> and <code>4624</code> both appear, minutes apart.</p>", "question": "How do 4768 and 4624 work together in an investigation?", "options": ["4768 shows the domain authentication at the DC; 4624 shows the logon at the target host — together they map the authentication path", "They are the same event with two different names", "4768 replaces 4624 on the weekend", "4624 is only generated on macOS"], "correct": [0], "explain": "<p><b>A is correct.</b> The two events are two stops of one journey: <code>4768</code> at the DC proves the account authenticated to the domain (TGT request); <code>4624</code> at the target proves a logon session opened there. Pairing them — same account, plausible time gap — draws the path from 'entered the domain' to 'touched this machine'. A 4768 without any following 4624 is also meaningful: a ticket was asked but no door opened.</p><p><b>B is wrong</b> — different hosts, different meanings, different roles. <b>C is wrong</b> — calendars do not change event IDs. <b>D is wrong</b> — 4624 is a Windows event; macOS has no Security log.</p>", "hint": "One event at the ticket office, one at the door."}, {"kind": "multi", "long": false, "scenario": "<p>A detection engineer changes AN0592's tuning (macOS): UserLocation thresholds and LogonMethod expectations. A colleague asks what belongs in the review before the change ships. Three of the five proposals are correct review steps.</p>", "question": "Which three review steps are correct for an AN0592 tuning change? <b>Select 3.</b>", "options": ["Check the quality of the UserLocation data — for example shared VPN addresses that collapse many users into one place", "Confirm the LogonMethod expectations: which GUI and which SSH logons are normal for your Mac fleet", "Watch the false-positive rate for some days after the change", "Delete all mobile accounts from the macOS devices", "Turn off unified logging to keep the log volume small"], "correct": [0, 1, 2], "explain": "<p><b>A, B and C are correct.</b> A validates the input: if Geo-IP/VPN data is coarse or shared, every distance judgment built on it is shaky. B validates the baseline: LogonMethod tuning is only as good as the inventory of normal GUI vs SSH access. C closes the loop: a tuning change is an experiment, and the FP rate is its measurement.</p><p><b>D is wrong</b> — deleting mobile accounts is an identity change that breaks users, not a tuning review step. <b>E is a near miss</b> — 'smaller volume' sounds appealing, but AN0592 has exactly one log source (the unified log); switching it off removes the analytic's eyes entirely.</p>", "hint": "Good reviews check the input, the baseline, and the result."}, {"kind": "single", "long": true, "scenario": "<p>An attacker is on a Linux server. They never touch any domain account: they escalate with a stolen local password and use <code>su</code> to move between local users. All their activity stays on this one host. AN0591 (Linux) is enabled with correct sssd/winbind telemetry.</p>", "question": "Does DET0210 catch this activity?", "options": ["No — the strategy watches domain account abuse; local-account misuse on one host needs another detection", "Yes — auditd records every Linux action, so the analytic fires", "Yes — but only if the attacker uses SSH", "No — because DET0210 only covers macOS and ESXi"], "correct": [0], "explain": "<p><b>A is correct.</b> Every analytic in DET0210 has the same subject: <i>domain</i> accounts (T1078.002). Local privilege abuse with <code>su</code> produces no domain-logon anomaly, so AN0591 stays silent — that activity belongs to host-level detections (auditd rules, EDR), which is a different object's job.</p><p><b>B is a near miss</b> — it is true that auditd records the syscalls; it is false that AN0591 fires, because the analytic's subject is domain logons via sssd/winbind, not 'every action'. <b>C is wrong</b> — the access path changes nothing for a purely local move. <b>D is wrong</b> — Linux <i>is</i> covered (AN0591); it just covers domain activity.</p>", "hint": "The strategy's subject is one word: domain."}]};

  return { phase:'INTRO', idx:0, timeLeft: EXAM.minutes * 60, score:0, timeUp:false,
           pauseAcc:{ manual:0, autoCheck:0 }, pauseEnter:0, pauseUnder:null, pauseFrom:null,

function $(id){ return document.getElementById(id); }
function cur(){ return S.exercises[S.idx]; }
function curEx(){ return EXAM.exercises[S.idx]; }

function fmt(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60), r = s%60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function fmtDur(s){ s = Math.round(s); if (s < 60) return s + ' s';

/* ---------- timer: state machine with RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED ---------- */
setInterval(function(){
  var now = Date.now();
  if (lastTick && S){
    var dt = (now - lastTick) / 1000;
    if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
      S.timeLeft -= dt;
      if (S.timeLeft <= 0){ S.timeLeft = 0; lastTick = now; finishByTimeout(); return; }
    }
  }
  lastTick = now;
  if (S && S.phase !== 'INTRO') renderTimerChip();
}, 250);

function togglePause(){
  if (!S || S.phase === 'INTRO' || S.phase === 'ENDED') return;
  if (S.phase === 'PAUSED_MANUAL'){
    S.pauseAcc.manual += (Date.now() - S.pauseEnter) / 1000;
    S.phase = (S.pauseUnder === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : (S.pauseFrom || 'RUNNING');
    S.pauseUnder = null;
    S.pauseEnter = (S.phase === 'PAUSED_AUTO_CHECK') ? Date.now() : 0;
  } else if (S.phase === 'PAUSED_AUTO_CHECK'){
    S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
    S.pauseUnder = 'PAUSED_AUTO_CHECK';
    S.pauseEnter = Date.now();
    S.phase = 'PAUSED_MANUAL';
  } else {
    S.pauseEnter = Date.now();
    S.pauseUnder = null;
    S.pauseFrom = S.phase; /* RUNNING or REVIEW — Resume returns here */
    S.phase = 'PAUSED_MANUAL';
  }
  renderAll(false);
}

/* ---------- grading: partial credit max(0,(H-W)/N), hint penalty clamped at zero ---------- */
function hasAnswer(ex, s){
  if (ex.kind === 'single') return s.selection !== null && s.selection !== undefined;
  if (ex.kind === 'multi') return !!(s.selection && s.selection.length > 0);
  if (ex.kind === 'drag'){ for (var k in s.placement){ if (s.placement[k] !== null && s.placement[k] !== undefined) return true; } return false; }
  if (ex.kind === 'order') return s.seq.length === ex.correctOrder.length;
  return false;
}

function grade(s, ex){
  var items = [], raw = 0, N, H, W, i, isC, picked;
  if (ex.kind === 'single'){
    raw = (s.selection === ex.correct[0]) ? 1 : 0;
    for (i = 0; i < ex.options.length; i++){
      if (i === s.selection) items.push({ state: raw ? 'correct' : 'wrong', text: letter(i) + ' — ' + ex.options[i] });
      else if (i === ex.correct[0] && !raw) items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] });
    }
  } else if (ex.kind === 'multi'){
    N = ex.correct.length; H = 0; W = 0;
    for (i = 0; i < ex.options.length; i++){
      picked = s.selection.indexOf(i) >= 0; isC = ex.correct.indexOf(i) >= 0;
      if (picked && isC){ H++; items.push({ state:'correct', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (picked && !isC){ W++; items.push({ state:'wrong', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (!picked && isC){ items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'drag'){
    N = ex.solution.length; H = 0; W = 0;
    for (i = 0; i < N; i++){
      var at = s.placement[i];
      if (at === ex.solution[i]){ H++; items.push({ state:'correct', text: ex.bank[i] + ' → ' + ex.zones[at] }); }
      else if (at === null || at === undefined){ items.push({ state:'missed', text: ex.bank[i] + ' — correct box: ' + ex.zones[ex.solution[i]] + ' (you did not place it)' }); }
      else { W++; items.push({ state:'wrong', text: ex.bank[i] + ' — you put it in ' + ex.zones[at] + ', correct is ' + ex.zones[ex.solution[i]] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'order'){
    N = ex.correctOrder.length; H = 0; W = 0;
    for (var pos = 0; pos < N; pos++){
      var got = s.seq[pos], want = ex.correctOrder[pos];
      if (got === want){ H++; items.push({ state:'correct', text: 'Position ' + (pos+1) + ': ' + ex.items[got] }); }
      else if (got === null || got === undefined){ items.push({ state:'missed', text: 'Position ' + (pos+1) + ' — correct: ' + ex.items[want] }); }
      else { W++; items.push({ state:'wrong', text: 'Position ' + (pos+1) + ': you put ' + ex.items[got] + ', correct is ' + ex.items[want] }); }
    }
    raw = Math.max(0, (H - W) / N);
  }
  s.raw = raw;
  s.credit = Math.max(0, raw - s.hints * HINT_PENALTY);
  s.answered = true;
  s.status = 'answered';
  s.feedbackItems = items;
  S.score += s.credit; /* float accumulator */
}

/* ---------- flow: Check / Next / Skip / Hint / review / finish ---------- */
function onCheck(){
  if (!S || blocked()) return;
  var s = cur(), ex = curEx();
  if (s.answered) return;
  if (!hasAnswer(ex, s)){ nudge('Select an answer first.'); return; }
  S.phase = 'PAUSED_AUTO_CHECK'; /* auto-pause happens BEFORE feedback is rendered */
  S.pauseEnter = Date.now();
  grade(s, ex);
  renderAll(false);
}
function onNext(){
  if (!S || S.phase !== 'PAUSED_AUTO_CHECK') return;
  S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
  S.pauseEnter = 0;
  S.phase = 'RUNNING'; /* Next restarts the timer */
  advance();
}
function advance(){
  var s = cur();
  if (s && s.fromReview){ s.fromReview = false; S.phase = 'REVIEW'; renderAll(true); return; }
  S.idx++;
  if (S.idx < S.exercises.length) renderAll(true);
  else startReviewOrFinish();
}
function startReviewOrFinish(){
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered'){ startReview(); return; }
  }
  finish();
}
function startReview(){ S.phase = 'REVIEW'; renderAll(true); }
function onSkip(){
  if (!S || blocked()) return;
  var s = cur();
  if (s.answered) return;
  s.status = 'skipped'; /* Skip never pauses the timer */
  advance();
}
function onHint(){
  if (!S || blocked()) return;
  var s = cur();
  if (!s || s.answered || s.hintShown) return;
  s.hintShown = true;
  s.hints = 1; /* Hint never pauses the timer */
  renderAll(false);
}
function reviewAnswer(i){
  if (!S || S.phase !== 'REVIEW') return;
  S.idx = i;
  S.exercises[i].fromReview = true;
  S.phase = 'RUNNING';
  renderAll(true);
}
function finishByTimeout(){
  if (!S || S.phase === 'ENDED') return;
  S.timeUp = true;
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') S.exercises[i].status = 'skipped';
  }
  finish();
}
function finish(){
  if (!S || S.phase === 'ENDED') return;
  S.phase = 'ENDED';
  var answered = 0, fullC = 0, partC = 0, partSum = 0, zeroC = 0, skipped = 0;
  for (var i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i];
    if (s.status === 'answered'){
      answered++;
      if (s.credit >= 0.999) fullC++;
      else if (s.credit > 0.0001){ partC++; partSum += s.credit; }
      else zeroC++;
    } else skipped++;
  }
  var scoreInt = Math.round(S.score);
  var percent = answered > 0 ? Math.round(scoreInt * 100 / answered) : 0;
  S.final = { scoreInt: scoreInt, total: answered, percent: percent, passed: percent >= EXAM.passMark,
              fullC: fullC, partC: partC, partAvg: partC ? (partSum / partC) : 0,
              zeroC: zeroC, skipped: skipped };
  renderAll(true);
  animateScore();
  var stateRef = S; /* snapshot: a retake must never hijack this report */
  setTimeout(function(){ postReport(stateRef); }, 1400); /* post once, after the score animation has settled */
}
function animateScore(){
  var el = $('score-big'); if (!el) return;
  var t0 = null, dur = 900;
  function step(ts){
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    el.textContent = String(Math.round(S.final.scoreInt * p));
    var bar = $('score-bar');
    if (bar) bar.style.width = (S.final.percent * p) + '%';
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function postReport(sRef){
  var st = sRef || S;
  if (!st || st.posted || !st.final) return;
  st.posted = true;
  var f = st.final;
  var payload = { type:'CYBERPULSE_SCORE', topicId: EXAM.topicId, batch: EXAM.batch,
                  difficulty: EXAM.difficulty, attckId: EXAM.attckId, objectType: EXAM.objectType,
                  score: f.scoreInt, total: f.total, percent: f.percent, passed: f.passed,
                  passMark: EXAM.passMark,
                  timeSpentSec: Math.round(EXAM.minutes * 60 - Math.max(0, st.timeLeft)),
                  pauseSec: { manual: Math.round(st.pauseAcc.manual), autoCheck: Math.round(st.pauseAcc.autoCheck) } };
  try {
    var target = (window.parent && window.parent !== window) ? window.parent : window;
    target.postMessage(payload, window.location.origin);
  } catch (e) { /* reporting must never break the exam */ }
  var note = $('post-note');
  if (note) note.textContent = '✓ Result reported to the training platform.';
}
function retake(){
  S = freshState(); /* new attempt: the score report may be posted again, once */
  renderAll(true);
  window.scrollTo(0, 0);
}
function startExam(){
  if (!S) return;
  S.phase = 'RUNNING';
  S.pauseEnter = 0;
  lastTick = Date.now();
  renderAll(true);
  window.scrollTo(0, 0);
}

/* ---------- answer interactions (no auto-pause on any intermediate confirmation) ---------- */
function pick(i){ if (!S || blocked()) return; var s = cur(); if (s.answered) return; s.selection = i; renderBody(false); }
function toggleMulti(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (!s.selection) s.selection = [];
  var p = s.selection.indexOf(i);
  if (p >= 0) s.selection.splice(p, 1); else s.selection.push(i);
  renderBody(false);
}
function chipClick(ii){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var placed = s.placement[ii];
  if (placed !== null && placed !== undefined){ delete s.placement[ii]; s.activeChip = null; }
  else s.activeChip = (s.activeChip === ii) ? null : ii;
  renderBody(false);
}
function zoneClick(zi){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.activeChip === null || s.activeChip === undefined){ nudge('Pick an item first, then choose a box.'); return; }
  s.placement[s.activeChip] = zi;
  s.activeChip = null;
  renderBody(false);
}
function dragStart(ev, ii){
  var s = cur();
  if (!S || s.answered){ if (ev) ev.preventDefault(); return; }
  s.activeChip = ii;
  try { ev.dataTransfer.setData('text/plain', String(ii)); } catch (e) {}
}
function dropPlace(ev, zi){
  ev.preventDefault();
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var ii = parseInt(ev.dataTransfer.getData('text/plain'), 10);
  if (isNaN(ii)) ii = s.activeChip;
  if (ii === null || ii === undefined || isNaN(ii)) return;
  s.placement[ii] = zi;
  s.activeChip = null;
  renderBody(false);
}
function zoneClear(ev, zi){
  if (ev && ev.stopPropagation) ev.stopPropagation(); /* do not bubble into the zone click */
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  for (var k in s.placement){ if (s.placement[k] === zi) delete s.placement[k]; }
  renderBody(false);
}
function seqAdd(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.seq.indexOf(i) >= 0) return;
  s.seq.push(i);
  renderBody(false);
}
function seqRemove(pos){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  s.seq.splice(pos, 1);
  renderBody(false);
}
function scnToggle(open){ if (S && cur()) cur().scnOpen = open; }
function nudge(msg){
  var t = $('toast'); if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(function(){ t.className = 'toast'; }, 1800);
}

/* ---------- rendering ---------- */
function renderAll(top){ renderHeader(); renderBody(top); }
function renderBody(top){
  var y = top ? 0 : (window.scrollY || 0);
  var m = $('main'); if (!m) return;
  if (S.phase === 'INTRO') m.innerHTML = introHTML();
  else if (S.phase === 'RUNNING' || S.phase === 'PAUSED_MANUAL' || S.phase === 'PAUSED_AUTO_CHECK') m.innerHTML = exerciseHTML();
  else if (S.phase === 'REVIEW') m.innerHTML = reviewHTML();
  else m.innerHTML = resultsHTML();
  window.scrollTo(0, y);
}
function renderTimerChip(){
  var el = $('hd-timer'); if (!el) return;
  var cls = 'chip chip-time', txt = '';
  if (S.phase === 'INTRO'){ txt = '⏱ Ready · ' + fmt(S.timeLeft); }
  else if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
    var low = S.timeLeft <= EXAM.minutes * 60 * 0.2;
    txt = (low ? '⚠ ' : '▶ ') + 'Running · ' + fmt(S.timeLeft);
    if (low) cls += ' chip-low';
  }
  else if (S.phase === 'PAUSED_MANUAL'){ txt = '⏸ Paused · ' + fmt(S.timeLeft); cls += ' chip-paused'; }
  else if (S.phase === 'PAUSED_AUTO_CHECK'){ txt = '⏳ Checking · ' + fmt(S.timeLeft); cls += ' chip-checking'; }
  else { txt = '⏹ Ended · ' + fmt(S.timeLeft); cls += ' chip-ended'; }
  el.className = cls;
  el.textContent = txt;
}
function renderHeader(){
  var N = S.exercises.length;
  var cnt = $('hd-counter');
  if (S.phase === 'INTRO') cnt.textContent = 'Ready';
  else if (S.phase === 'ENDED') cnt.textContent = 'Completed';
  else cnt.textContent = 'Exercise ' + (S.idx + 1) + ' / ' + N;
  $('hd-score').textContent = 'Score ' + S.score.toFixed(2);
  var canAct = !blocked();
  var s = (S.phase === 'ENDED' || S.phase === 'INTRO') ? null : cur();
  var hb = $('btn-hint'), sb = $('btn-skip'), pb = $('btn-pause');
  hb.disabled = !(canAct && s && !s.answered && !s.hintShown);
  sb.disabled = !(canAct && s && !s.answered);
  pb.disabled = (S.phase === 'INTRO' || S.phase === 'ENDED');
  pb.textContent = (S.phase === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  renderTimerChip();
}

function introHTML(){
  var I = EXAM.intro, h = '', i;
  h += '<section class="hero">'
    + '<div class="hero-kicker">MITRE ATT&amp;CK · ' + EXAM.objectLabel + ' · ' + EXAM.attckId + '</div>'
    + '<h1>' + EXAM.title + ' — Knowledge Exam</h1>'
    + '<div class="hero-chips">'
    + '<span class="chip">' + EXAM.exercises.length + ' exercises</span>'
    + '<span class="badge badge-' + EXAM.difficulty + '">' + EXAM.severityWord + '</span>'
    + '<span class="chip">Estimated time: ' + EXAM.minutes + ' min</span>'
    + '<span class="chip">Timer budget: ' + fmt(EXAM.minutes * 60) + '</span>'
    + '<span class="chip">Pass mark: ' + EXAM.passMark + '%</span>'
    + '</div></section>';
  h += '<section class="intro-sec"><h2>What you will learn here</h2>';
  for (i = 0; i < I.learn.length; i++) h += '<p>' + I.learn[i] + '</p>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Keywords covered in this exam</h2><div class="kw-chips">';
  for (i = 0; i < I.keywords.length; i++) h += '<span class="kw">' + I.keywords[i] + '</span>';
  h += '</div></section>';
  h += '<section class="intro-sec"><h2>How this exam works</h2><ol class="how-list">';
  for (i = 0; i < I.how.length; i++) h += '<li>' + I.how[i] + '</li>';
  h += '</ol><div class="start-wrap"><button class="btn btn-primary btn-start" onclick="startExam()">▶ Start the exam</button></div></section>';
  return h;
}

function answerHTML(s, ex){
  var h = '', i;
  if (ex.kind === 'single' || ex.kind === 'multi'){
    if (ex.kind === 'multi') h += '<div class="multi-note">Select all that apply — ' + ex.correct.length + ' options are correct. Correct picks add credit, wrong picks remove credit.</div>';
    h += '<div class="options">';
    for (i = 0; i < ex.options.length; i++){
      var sel = (ex.kind === 'single') ? (s.selection === i) : !!(s.selection && s.selection.indexOf(i) >= 0);
      h += '<button type="button" class="opt' + (sel ? ' opt-sel' : '') + '" onclick="' + (ex.kind === 'single' ? 'pick(' : 'toggleMulti(') + i + ')">'
        + (ex.kind === 'multi' ? '<span class="opt-box">' + (sel ? '✓' : '') + '</span>' : '')
        + '<span class="opt-key">' + letter(i) + '</span><span class="opt-text">' + ex.options[i] + '</span></button>';
    }
    h += '</div>';
  } else if (ex.kind === 'drag'){
    h += '<div class="multi-note">Pick an item, then pick a box. You can also drag the items. Items you never place score as missed.</div>';
    h += '<div class="dz-layout"><div class="bank">';
    for (i = 0; i < ex.bank.length; i++){
      if (s.placement[i] === null || s.placement[i] === undefined){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" draggable="true" ondragstart="dragStart(event,' + i + ')" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
      }
    }
    h += '</div><div class="zones">';
    for (var z = 0; z < ex.zones.length; z++){
      h += '<div class="dz' + (s.activeChip !== null && s.activeChip !== undefined ? ' dz-armed' : '') + '" onclick="zoneClick(' + z + ')" ondragover="event.preventDefault()" ondrop="dropPlace(event,' + z + ')">'
        + '<div class="dz-head"><span>' + ex.zones[z] + '</span><button type="button" class="dz-clear" onclick="zoneClear(event,' + z + ')">clear</button></div>';
      for (i = 0; i < ex.bank.length; i++){
        if (s.placement[i] === z){
          h += '<button type="button" class="chipd" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
        }
      }
      h += '</div>';
    }
    h += '</div></div>';
  } else if (ex.kind === 'order'){
    h += '<div class="multi-note">Tap the items in the correct order, first to last. Tap an item in your sequence to remove it again.</div>';
    h += '<div class="seq-layout"><div class="bank">';
    for (i = 0; i < ex.items.length; i++){
      if (s.seq.indexOf(i) < 0){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" onclick="seqAdd(' + i + ')">' + ex.items[i] + '</button>';
      }
    }
    h += '</div><div class="seq"><div class="block-label lbl-neutral">YOUR ORDER</div>';
    for (var p = 0; p < ex.items.length; p++){
      if (p < s.seq.length){
        h += '<button type="button" class="seq-item" onclick="seqRemove(' + p + ')"><span class="seq-num">' + (p + 1) + '</span><span>' + ex.items[s.seq[p]] + '</span></button>';
      } else {
        h += '<div class="seq-slot">Position ' + (p + 1) + ' — not filled yet</div>';
      }
    }
    h += '</div></div>';
  }
  return h;
}

function exerciseHTML(){
  var s = cur(), ex = curEx(), h = '';
  if (S.phase === 'PAUSED_MANUAL') h += '<div class="banner banner-pause">⏸ Paused — the timer is stopped. Press the Pause button again (▶ Resume) to continue.</div>';
  if (S.phase === 'PAUSED_AUTO_CHECK') h += '<div class="banner banner-check">⏳ Checking — the timer is stopped while you read this feedback. Press Next to continue.</div>';
  h += '<section class="block block-scenario"><details class="scn"' + (s.scnOpen ? ' open' : '') + ' ontoggle="scnToggle(this.open)">'
    + '<summary><span class="block-label lbl-blue">SCENARIO</span><span class="scn-hint">click to open or close</span></summary>'
    + '<div class="scn-body">' + ex.scenario + '</div></details></section>';
  h += '<section class="block block-question"><div class="block-label lbl-amber">QUESTION</div><div class="q-text">' + ex.question + '</div></section>';
  h += '<section class="block block-answer"><div class="block-label lbl-green">YOUR ANSWER</div>' + answerHTML(s, ex) + '</section>';
  if (s.hintShown && !s.answered){
    h += '<div class="hintbox"><span class="hint-tag">HINT · COSTS 0.15 CREDIT</span><br>' + ex.hint + '</div>';
  }
  h += '<div class="actions">';
  if (!s.answered){
    h += '<button class="btn btn-primary"' + (blocked() ? ' disabled' : '') + ' onclick="onCheck()">Check</button>';
  } else {
    var last = (S.idx === S.exercises.length - 1);
    h += '<button class="btn btn-primary"' + (S.phase === 'PAUSED_MANUAL' ? ' disabled' : '') + ' onclick="onNext()">'
      + (s.fromReview ? '↩ Back to review' : (last ? 'Final Submit ▸' : 'Next ▸')) + '</button>';
  }
  h += '</div>';
  if (s.answered) h += feedbackHTML(s, ex);
  return h;
}

function feedbackHTML(s, ex){
  var good = s.credit >= 0.999, zero = s.credit <= 0.0001;
  var cls = good ? 'fb-good' : (zero ? 'fb-bad' : 'fb-part');
  var chip = good ? '<span class="statechip st-correct">✓ Correct</span>'
    : (zero ? '<span class="statechip st-wrong">✗ Incorrect</span>'
    : '<span class="statechip st-part">✓ Partially correct</span>');
  var h = '<section class="feedback ' + cls + '"><div class="fb-head">' + chip
    + '<span class="fb-credit">Credit ' + s.credit.toFixed(2) + ' / 1.00</span>'
    + (s.hints ? '<span class="fb-penalty">includes −' + (s.hints * HINT_PENALTY).toFixed(2) + ' hint penalty</span>' : '')
    + '</div>';
  if (s.feedbackItems.length){
    h += '<ul class="fb-items">';
    for (var i = 0; i < s.feedbackItems.length; i++){
      var it = s.feedbackItems[i];
      var mark = it.state === 'correct' ? '✓ Correct' : (it.state === 'wrong' ? '✗ Wrong' : '○ Missed');
      h += '<li class="it-' + it.state + '"><span class="it-mark">' + mark + '</span><span class="it-text">' + it.text + '</span></li>';
    }
    h += '</ul>';
  }
  h += '<div class="fb-explain"><div class="block-label lbl-neutral">WHY</div>' + ex.explain + '</div></section>';
  return h;
}

function reviewHTML(){
  var h = '', pend = [], i;
  for (i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') pend.push(i);
  }
  h += '<section class="intro-sec"><h2>⚠ Review skipped exercises</h2>'
    + '<p>You have ' + pend.length + ' exercise' + (pend.length === 1 ? '' : 's') + ' without an answer. You can answer ' + (pend.length === 1 ? 'it' : 'them') + ' now — the timer keeps running. Anything you never answer will not count in your score or your total.</p></section>';
  for (i = 0; i < pend.length; i++){
    h += '<div class="rev-row"><span class="rev-num">Exercise ' + (pend[i] + 1) + '</span>'
      + '<button class="btn" onclick="reviewAnswer(' + pend[i] + ')">Answer now</button></div>';
  }
  h += '<div class="actions"><button class="btn btn-primary" onclick="finish()">Finish &amp; see results ▸</button></div>';
  return h;
}

function resultsHTML(){
  var f = S.final, h = '', i;
  h += '<section class="intro-sec"><div class="fb-head">'
    + '<span class="statechip st-end">⏹ Exam complete</span>'
    + (S.timeUp ? '<span class="statechip st-wrong">⚠ Time ran out</span>' : '')
    + (f.passed ? '<span class="statechip st-correct">✓ Passed</span>' : '<span class="statechip st-wrong">✗ Not passed</span>')
    + '</div>';
  h += '<div class="score-wrap"><div class="score-big" id="score-big">0</div>'
    + '<div class="score-of">points / ' + f.total + ' answered</div>'
    + '<div class="bar"><div class="bar-fill" id="score-bar" style="width:0%"></div></div>'
    + '<div class="score-pct"><span>' + f.percent + '%</span>'
    + '<span class="pass-note">Pass mark ' + EXAM.passMark + '% · final percent uses the same rounded score</span></div></div>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Result breakdown</h2>'
    + '<div class="cat-row cat-good"><span>✓ Fully correct</span><span class="cat-n">' + f.fullC + '</span></div>'
    + '<div class="cat-row cat-part"><span>✓ Partially correct — average partial credit ' + f.partAvg.toFixed(2) + '</span><span class="cat-n">' + f.partC + '</span></div>'
    + '<div class="cat-row cat-bad"><span>✗ Fully incorrect</span><span class="cat-n">' + f.zeroC + '</span></div>'
    + '<div class="cat-row cat-skip"><span>⚠ Skipped and never answered — excluded from score and total</span><span class="cat-n">' + f.skipped + '</span></div>'
    + '<div class="pause-log">⏸ Time paused manually: ' + fmtDur(S.pauseAcc.manual) + '</div>'
    + '<div class="pause-log">⏳ Time paused while checking: ' + fmtDur(S.pauseAcc.autoCheck) + '</div>'
    + '<div class="pause-log">Time used: ' + fmt(EXAM.minutes * 60 - Math.max(0, S.timeLeft)) + ' of the ' + fmt(EXAM.minutes * 60) + ' budget</div>'
    + '</section>';
  h += '<section class="intro-sec"><h2>Every exercise</h2><div class="sum-list">';
  for (i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i], word;
    if (s.status === 'answered'){
      if (s.credit >= 0.999) word = '<span class="it-correct" style="color:var(--correct)">✓ Correct</span>';
      else if (s.credit > 0.0001) word = '<span style="color:var(--warn)">✓ Partially correct</span>';
      else word = '<span style="color:var(--wrong)">✗ Incorrect</span>';
    } else word = '<span style="color:var(--warn)">⚠ Skipped</span>';
    h += '<div class="sum-row"><span>Exercise ' + (i + 1) + '</span><span>' + word + ' · ' + (s.status === 'answered' ? s.credit.toFixed(2) : '0.00') + ' credit</span></div>';
  }
  h += '</div></section>';
  h += '<div class="actions"><button class="btn btn-primary" onclick="retake()">↺ Retake the exam</button></div>';
  h += '<div id="post-note" class="post-note"></div>';
  return h;
}

/* ---------- handshake: accept CYBERPULSE_INIT and CYBERMASTERY_INIT; theme field is ignored (dark only) ---------- */
window.addEventListener('message', function(ev){
  try {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT'){ HANDSHAKE = d; }
  } catch (e) { /* a broken handshake must not break the exam */ }
});

function initExam(){
  S = freshState();
  renderAll(true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initExam);
else initExam();

</script>
</body>
</html>
