<script>window.__EXAM__={"intro":{"title":"DET0120 — MEDIUM practice exam","idname":"DET0120 — Account Access Removal via Multi-Platform Audit Correlation (detects T1531 — Account Access Removal)","learn":["This exam trains the <b>detection strategy DET0120<\/b>, one level deeper than the basics. A detection strategy in MITRE ATT&amp;CK is a set of analytics — small detection rules — that together watch for one technique. DET0120 watches <b>T1531 Account Access Removal<\/b>: an attacker deletes, locks, or changes accounts so real users cannot log in. That is an <b>Impact<\/b> tactic behaviour with an <b>Availability<\/b> damage type.","The strategy bundles <b>six analytics<\/b>: <b>AN0334<\/b> for Windows (Security events 4723/4724/4740 joined with Sysmon process lineage), <b>AN0335<\/b> for Linux (auditd records of passwd, userdel, chage with <b>auid != root<\/b>, plus remote logins), <b>AN0336<\/b> for macOS (dscl and sysadminctl in the unified log), <b>AN0337<\/b> for ESXi (esxcli account removal in hostd, logins in vpxa), <b>AN0338<\/b> for Microsoft 365 (Remove-Mailbox and Set-Mailbox joined with sign-in risk), and <b>AN0339<\/b> for SaaS identity like Okta (lifecycle events with bulk thresholds).","At this level you will do what a SOC analyst and a detection engineer really do: read two artefacts and connect them, check whether an analytic would actually fire, pick the right mutable element to tune, and spot the mistake in a draft rule. You will also see how the ransomware context gives these alerts weight — groups like Akira remove admin accounts before encryption to slow down the response.","Every exercise asks you to combine <b>two ideas<\/b> — for example, recognise the analytic <i>and<\/i> choose its tuning field. Read both artefacts before answering; the answer is rarely in one of them alone."],"themes":[{"name":"Correlation logic of the analytics","items":["<b>AN0334<\/b>: account-modification events (4723/4724/4740) joined with Sysmon process lineage","<b>AN0335<\/b>: auditd SYSCALL with <b>auid != root<\/b> correlated with remote authentication (NSM:Connections)","<b>AN0336<\/b>: dscl / sysadminctl commands with anomalous ancestry or sudo","<b>AN0337<\/b>: hostd RemoveUser correlated with vpxa login from unexpected IP","<b>AN0338<\/b>: Remove-Mailbox / Set-Mailbox joined with anomalous sign-in location or MFA bypass","<b>AN0339<\/b>: Okta user.lifecycle.* events with BulkActionThreshold"]},{"name":"Log channels and data components","items":["Channels: WinEventLog:Security, WinEventLog:Sysmon, auditd:SYSCALL, macos:unifiedlog, esxi:hostd, esxi:vpxa, m365:unified, m365:signinlogs, saas:okta","Components: DC0002 (authentication), DC0009 (deletion), DC0010 (modification), DC0032 (process creation), DC0064 (command execution)"]},{"name":"Mutable elements and tuning","items":["UserContext, TimeWindow, ParentProcessName (AN0334)","NonRootUIDThreshold, ExecPath (AN0335) · CommandLinePattern, AnomalousUserFlag (AN0336)","RemoteUserRole, ExpectedIPs (AN0337) · RoleAssignment, GeoThreshold (AN0338)","BulkActionThreshold, SessionDeviceType (AN0339)","Tuning workflow, false-positive triage, alert prioritisation"]},{"name":"Technique context","items":["T1531 facts: no sub-techniques, Availability impact, many platforms","Ransomware relevance: Akira deletes admin accounts before encryption"]}],"how":["<b>Passing score.<\/b> You pass with <b>70% or more<\/b>. Each exercise combines two ideas; if you miss one, read the item-by-item feedback.","<b>Exercises.<\/b> This file has <b>15 exercises<\/b>: select-all questions, a log reader, branching decisions, matching, drag and drop, ordering, fill-in-the-blank, and alert prioritisation.","<b>Timer.<\/b> You have <b>30 minutes<\/b>. Pressing <b>Pause<\/b> hides the exercise and stops the timer until you press Resume. Pressing <b>Check<\/b> also stops the timer (auto-pause) so you can study the feedback; it resumes when you press <b>Next<\/b>.","<b>Partial credit.<\/b> Multi-item exercises score each item: credit = (correct − wrong) ÷ total. Guessing everything gives zero, not partial marks.","<b>Hints and skipping.<\/b> One hint per exercise costs 10% of that exercise’s credit. Skip moves an exercise to the review pool; you can answer it later while time remains. Never-answered exercises are excluded from the score."],"types":["Select-all (partial credit)","Matching pairs","Branching decision","Drag & drop","Multiple choice (single answer)","Timeline ordering","Fill-in-the-blank"]},"ex":[{"id":"m01","type":"multi","title":"Does the Windows correlation fire?","sc":[{"label":"ARTEFACT 1 — Windows Security event","log":["2026-10-13 02:47:11  DC01  EventCode=4724  SubjectUserName=j.smith  TargetUserName=svc_sql  WorkstationName=WKS-231","2026-10-13 02:47:12  DC01  EventCode=4724  SubjectUserName=j.smith  TargetUserName=svc_adm2  WorkstationName=WKS-231"]},{"label":"ARTEFACT 2 — Sysmon process creation (EventCode=1)","log":["2026-10-13 02:47:09  WKS-231  powershell.exe (parent: explorer.exe)  cmdline: -enc SQBFAFgA...  user: CORP\\j.smith","2026-10-13 02:47:10  WKS-231  net.exe (parent: powershell.exe)  cmdline: net user svc_adm2 Df9!xq2  user: CORP\\j.smith"]},{"label":"Context","text":"j.smith is a standard sales user — no admin role. The nightly IT admin change window is 02:00–05:00, but UserContext tuning on this SIEM allowlists only Helpdesk and Domain Admins."}],"q":"Select every statement that correctly explains why AN0334 raises an alert here.","options":[{"t":"Account-modification events (4724) exist for two targets","why":"Correct — the DC0010 half of the correlation is present: two password resets recorded on the Security channel."},{"t":"Process lineage is anomalous: explorer → powershell → net.exe","why":"Correct — ParentProcessName logic: an interactive user session spawning PowerShell which spawns net.exe is the exact lineage the analytic flags."},{"t":"The actor is a non-admin user (UserContext)","why":"Correct — UserContext tuning expects Helpdesk or Domain Admins; a sales user resetting service passwords is out of profile."},{"t":"The actions happened inside the maintenance window, so nothing fires","why":"Wrong — TimeWindow is one of several conditions; the other two (lineage, user context) independently justify the alert."},{"t":"Sysmon EventCode=1 is required for the lineage half, and it is present","why":"Correct — the DC0010/DC0032 join needs Sysmon process-creation events; artefact 2 shows them."},{"t":"The password reset targeted a service account, which is always ignored","why":"Wrong — targeting svc_* accounts makes it worse, not ignorable; nothing in AN0334 excludes service-account targets."}],"correct":[0,1,2,4],"hint":"Check the three mutable ideas one by one: what happened, from which process lineage, and by whom.","explain":"All four selected statements are part of why the analytic fires: the <b>DC0010<\/b> events (4724 resets), the <b>DC0032<\/b> lineage (explorer → powershell → net.exe, the ParentProcessName pattern), the <b>UserContext<\/b> violation (a sales user), and the presence of the Sysmon EventCode=1 join. The maintenance window does not save the actor — TimeWindow is an OR-side condition with lineage and user context, and a sales user with an encoded PowerShell payload is out of every profile. In a real SOC this double event is a high-confidence indicator that a workstation was compromised and is being used to reshape access.","study":"AN0334 correlation: DC0010 + DC0032, and the mutable elements UserContext, TimeWindow, ParentProcessName."},{"id":"m02","type":"match","title":"Which channel feeds which analytic","sc":[{"label":"Reference — DET0120 log source tables","text":"Each analytic lists the channels it reads. You are wiring the SIEM inputs for DET0120 and must map analytic → primary channel."}],"q":"Match each analytic to the log channel that carries its core signal.","lefts":[{"t":"AN0334 — Windows account modification","r":0,"why":"AN0334 reads User Account Modification (DC0010) from WinEventLog:Security (4723/4724/4740)."},{"t":"AN0335 — Linux account changes","r":1,"why":"AN0335 reads the SYSCALL records of passwd/userdel/chage from auditd:SYSCALL."},{"t":"AN0336 — macOS user changes","r":2,"why":"AN0336 reads dscl / sysadminctl commands from the macos:unifiedlog."},{"t":"AN0337 — ESXi account deletion","r":3,"why":"AN0337 reads method=RemoveUser and esxcli invocations from esxi:hostd."},{"t":"AN0338 — M365 mailbox account actions","r":4,"why":"AN0338 reads Remove-Mailbox / Set-Mailbox from the m365:unified UnifiedAuditLog channel."},{"t":"AN0339 — SaaS account lifecycle","r":5,"why":"AN0339 reads user.lifecycle.* events from the saas:okta channel."}],"rights":[{"t":"WinEventLog:Security"},{"t":"auditd:SYSCALL"},{"t":"macos:unifiedlog"},{"t":"esxi:hostd"},{"t":"m365:unified"},{"t":"saas:okta"}],"hint":"One channel per platform family: Windows audit, Linux audit, Mac unified log, hypervisor, cloud audit, SaaS identity.","explain":"The mapping is the wiring plan for DET0120: <b>WinEventLog:Security<\/b> → AN0334, <b>auditd:SYSCALL<\/b> → AN0335, <b>macos:unifiedlog<\/b> → AN0336, <b>esxi:hostd<\/b> → AN0337, <b>m365:unified<\/b> → AN0338, <b>saas:okta<\/b> → AN0339. Note that several analytics also need a <i>second<\/i> channel for correlation (Sysmon for AN0334, NSM or sign-in logs for the others) — this exercise pins the primary one. A detection engineer uses exactly this mapping to build the ingestion checklist; a missing channel means the analytic runs half-blind.","study":"The “Log Sources” table of each DET0120 analytic — data component, channel, and filter."},{"id":"m03","type":"branch","title":"Linux branch: does the chain complete?","sc":[{"label":"ARTEFACT 1 — auditd:SYSCALL","log":["type=SYSCALL exe=\"/usr/sbin/userdel\" auid=1002 uid=1002 tty=pts/0 res=success","type=USER_ACCT pid=11802 exe=\"/usr/sbin/userdel\" acct=\"jenkins-old\" res=failed"]},{"label":"ARTEFACT 2 — NSM:Connections","log":["2026-10-13 21:03:52 accepted publickey for user deploy from remote IP 203[.]0[.]113[.]45 → shell session opened","2026-10-13 21:04:10 same session: /usr/sbin/userdel executed, auid=1002 (deploy, non-root)"]},{"label":"Context","text":"AN0335: “Password changes or account deletions via passwd, userdel, or chage preceded by interactive shell or remote command execution from non-privileged accounts.” deploy is a service account that normally only runs CI jobs — it never holds interactive shells."}],"q":"Work through the three triage steps for this possible AN0335 alert.","steps":[{"q":"STEP 1 — Does the auditd record satisfy the “non-privileged” condition of AN0335?","options":[{"t":"Yes — auid=1002 is not root, so NonRootUIDThreshold passes","why":"Correct — the analytic requires auid != root; auid=1002 (the deploy service account) satisfies NonRootUIDThreshold."},{"t":"No — only uid matters, and uid=1002 equals auid","why":"Wrong — the analytic is written on the audit ID (auid), which survives sudo and identifies the original human or service identity."},{"t":"No — res=failed means nothing happened","why":"Wrong — the SYSCALL itself succeeded (res=success); the failed line is a later lookup for the already-removed account."}],"answer":0},{"q":"STEP 2 — What does the NSM:Connections artefact add to the chain?","options":[{"t":"It proves a remote, interactive session preceded the deletion","why":"Correct — DC0002 correlation: an accepted publickey login opened a shell, and the deletion followed in that session."},{"t":"Nothing — network logs never join with auditd","why":"Wrong — the analytic explicitly correlates the DC0002 authentication event with the DC0032 process event."},{"t":"It shows the attacker brute-forced the password","why":"Wrong — the log shows an accepted public key, not failed password attempts."}],"answer":0},{"q":"STEP 3 — What is the right verdict and next step?","options":[{"t":"AN0335 fires: a non-privileged, remote session deleted an account — investigate the deploy account","why":"Correct — both halves of the analytic are satisfied and the actor is out of profile; treat the deploy account as compromised until proven otherwise."},{"t":"No alert: jenkins-old was probably an old account","why":"Wrong — the target being old does not matter; the analytic fires on the actor and the preceding access."},{"t":"No alert: service accounts are allowed to delete users","why":"Wrong — this service account never runs interactive shells; its allowance is for CI jobs, exactly what NonRootUIDThreshold tuning excludes."}],"answer":0}],"hint":"Step 1: read the auid field. Step 2: what kind of session came before the deletion? Step 3: both halves together.","explain":"The chain completes: <b>auid=1002<\/b> satisfies NonRootUIDThreshold (auid is the audit identity — it stays the real user even when sudo is involved); the <b>NSM:Connections<\/b> record (DC0002) proves a remote interactive session immediately preceded the deletion; and the actor — a CI service account — is far outside its normal behaviour. That is AN0335 firing end to end. The failed USER_ACCT line is a red herring: after userdel succeeds, follow-up lookups for the removed account fail. In practice, a service account suddenly opening interactive shells is itself a compromise signal worth escalating on its own.","study":"AN0335 correlation: auditd SYSCALL (auid != root) + DC0002 remote authentication; NonRootUIDThreshold."},{"id":"m04","type":"dnd","title":"What does each mutable element tune?","sc":[{"label":"Reference — mutable elements tables","text":"The DET0120 page lists a “Mutable Elements” table for every analytic. Each element is one dial the detection engineer can turn. Place each element on what it actually tunes."}],"q":"Drag each mutable element onto the question it answers.","zones":[{"t":"WHO is allowed to act"},{"t":"WHEN actions are expected"},{"t":"WHICH process lineage is suspicious"},{"t":"HOW MANY actions in a short period"},{"t":"WHERE the sign-in came from"},{"t":"WHICH device started the session"}],"items":[{"t":"UserContext (AN0334)","zone":0,"why":"UserContext defines which accounts may perform account operations (Domain Admins vs local users)."},{"t":"TimeWindow (AN0334)","zone":1,"why":"TimeWindow restricts alerting to actions outside maintenance windows."},{"t":"ParentProcessName (AN0334)","zone":2,"why":"ParentProcessName flags suspicious lineage such as powershell.exe launching net.exe."},{"t":"BulkActionThreshold (AN0339)","zone":3,"why":"BulkActionThreshold triggers when several deletions or suspensions happen within a short period."},{"t":"GeoThreshold (AN0338)","zone":4,"why":"GeoThreshold triggers on unusual geographic login sources."},{"t":"SessionDeviceType (AN0339)","zone":5,"why":"SessionDeviceType alerts when removals come from unfamiliar administrative session contexts."}],"hint":"Read each zone as a question word: who, when, which process, how many, where, which device.","explain":"Mutable elements are the tuning dials, and each answers one question: <b>UserContext<\/b> — who may act; <b>TimeWindow<\/b> — when; <b>ParentProcessName<\/b> — from which process lineage; <b>BulkActionThreshold<\/b> — how many actions in how long; <b>GeoThreshold<\/b> — where the sign-in originated; <b>SessionDeviceType<\/b> — from which kind of session or device. The other analytics add their own: NonRootUIDThreshold and ExecPath (AN0335), CommandLinePattern and AnomalousUserFlag (AN0336), RemoteUserRole and ExpectedIPs (AN0337), RoleAssignment (AN0338). When an analytic is too noisy or too quiet, you tune these — not the technique.","study":"The “Mutable Elements” tables across all six DET0120 analytics."},{"id":"m05","type":"qcm","title":"M365: which two components must join?","sc":[{"label":"Analytic card AN0338 (Office Suite)","text":"“O365 UnifiedAuditLog entries for Remove-Mailbox or Set-Mailbox with account disable or delete actions correlated with suspicious login locations or MFA bypass.”<br>Log sources: m365:unified (User Account Deletion, DC0009) and m365:signinlogs (User Account Authentication, DC0002)."}],"q":"Which pair of data components does AN0338 correlate?","options":[{"t":"DC0009 (account deletion) + DC0002 (account authentication)","why":"Correct — the mailbox action is DC0009, and the suspicious-location / MFA-bypass half comes from sign-in logs, DC0002."},{"t":"DC0032 (process creation) + DC0010 (account modification)","why":"That pair belongs to the Windows analytic AN0334, not to the cloud mailbox analytic."},{"t":"DC0009 (account deletion) + DC0064 (command execution)","why":"DC0064 records commands like dscl on macOS; M365 sign-in risk is DC0002."},{"t":"DC0002 (account authentication) + DC0032 (process creation)","why":"DC0032 is endpoint telemetry; AN0338 joins the mailbox action with the sign-in, not with a process."}],"answer":0,"hint":"One component carries the mailbox action, the other carries the risky sign-in.","explain":"AN0338 joins <b>DC0009<\/b> (User Account Deletion — the Remove-Mailbox / Set-Mailbox disable-or-delete actions in the UnifiedAuditLog) with <b>DC0002<\/b> (User Account Authentication — sign-in logs showing anomalous locations or MFA bypass). The power of the analytic is the join: an admin action from a session that itself looks stolen is the classic cloud account-takeover pattern. Its mutable elements follow the same split: RoleAssignment tunes who may legitimately run these cmdlets, GeoThreshold tunes what counts as an unusual location.","study":"AN0338 log sources (m365:unified, m365:signinlogs) and its mutable elements RoleAssignment and GeoThreshold."},{"id":"m06","type":"multi","title":"Spot the mistakes in the draft rule","sc":[{"label":"Draft SIEM rule (pseudo-logic) for AN0334","code":"index=win_sec EventCode=4724\n| join host [search index=sysmon EventCode=1 Image=*net.exe]\n| where _time BETWEEN (22:00, 06:00)   /* alert inside the window */\n| where SubjectUserName IN (\"Helpdesk*\",\"Domain Admins\")\n| stats count by TargetUserName\n| where count > 0"}],"q":"Select the two mistakes that break the analytic’s intent.","options":[{"t":"The time filter is inverted — it alerts inside the maintenance window instead of outside it","why":"Correct — TimeWindow means “alert only on actions outside of IT admin change windows”; this draft does the opposite."},{"t":"The user filter allowlists exactly the expected actors — it should exclude them instead","why":"Correct — UserContext tuning looks for unexpected actors; filtering FOR Helpdesk and Domain Admins hides the very anomaly the analytic hunts."},{"t":"The join on host is wrong — it must join on the domain controller only","why":"Wrong — joining on host is a defensible engineering choice; the two real mistakes are the inverted window and the allowlist."},{"t":"Using EventCode=4724 alone misses 4723 and 4740","why":"Wrong for this question — narrowing to 4724 reduces coverage but does not invert the analytic’s intent; the two structural mistakes are the window and the allowlist."},{"t":"The stats command is illegal in this SIEM","why":"Wrong — the aggregation itself is ordinary SIEM syntax and not what breaks the intent."}],"correct":[0,1],"hint":"Read the two comments against the mutable elements: TimeWindow and UserContext. What should each line really do?","explain":"The two intent-breaking mistakes: <b>(1) inverted TimeWindow<\/b> — the analytic must alert outside the admin change window, but the draft restricts alerting to inside it, which buries real attacks in the noisiest period for helpdesk activity; <b>(2) inverted UserContext<\/b> — allowlisting Helpdesk and Domain Admins filters out the expected actors and would only ever alert on them, the exact opposite of detecting a non-admin acting like one. The other options are engineering choices, not logic inversions. When reviewing someone’s rule, always check its conditions against the mutable-element tables first.","study":"AN0334 mutable elements: TimeWindow (“outside of maintenance windows”) and UserContext (“non-admin users”)."},{"id":"m07","type":"order","title":"Order the tuning workflow","sc":[{"label":"Change ticket DET-0012","text":"“Deploy AN0334 for the finance domain. Expected: ~40 helpdesk resets per night inside the 02:00–05:00 window. Goal: catch resets from unexpected users or lineages without drowning the queue.”"}],"q":"Put the five tuning steps in the order a detection engineer should run them.","seq":[{"t":"Collect a baseline: what normal account activity looks like","why":"You cannot tune thresholds before you know the normal volume and actors — the baseline comes first."},{"t":"Set TimeWindow to the documented maintenance window","why":"With the baseline known, encode the agreed change window so in-window resets stop alerting."},{"t":"Set UserContext to the allowlist of expected actors","why":"Next encode who may act: helpdesk groups and admins, so unexpected actors surface."},{"t":"Validate with benign tests: a scripted helpdesk reset inside the window","why":"Before going live, replay or simulate a known-benign reset and confirm the rule stays silent."},{"t":"Deploy and review first-week alerts with the SOC","why":"Ship it, then tune again based on the first real alerts — the loop closes with live review."}],"hint":"You cannot set dials before measuring; you must not deploy before a dry run.","explain":"The order is: <b>baseline → TimeWindow → UserContext → benign validation → deploy and review<\/b>. Tuning is a workflow, not a one-off: the baseline tells you what “normal” means (40 resets/night here), then the two AN0334 mutable elements (TimeWindow, UserContext) encode the environment, then a dry run proves the rule is quiet on benign work, and only then does it go live — followed by a review loop with the analysts who inherit its alerts. Skipping the validation step is how SOCs end up with a rule that floods the queue on day one and gets disabled in week two.","study":"Detection engineering workflow: baseline, tune mutable elements, validate, deploy, review."},{"id":"m08","type":"multi","title":"ESXi: the two channels that complete the chain","sc":[{"label":"ARTEFACT 1 — esxi:vpxa (authentication)","log":["2026-10-13 04:31:07 vpxa  Login as user root from IP 203[.]0[.]113[.]9  role: Administrator  session=52ab…","2026-10-13 04:31:09 vpxa  note: source IP not in expected admin range (expected: 10[.]0[.]0[.]0/24 mgmt)"]},{"label":"ARTEFACT 2 — esxi:hostd (account deletion)","log":["2026-10-13 04:32:15 hostd  method=RemoveUser  userName=bkp-admin  invoked via vSphere API session=52ab…","2026-10-13 04:32:16 hostd  esxcli equivalent: system account remove --id bkp-admin"]},{"label":"Context","text":"AN0337: “Invocation of esxcli ‘system account remove’ from vCLI, SSH, or vSphere API with anomalous user access or outside maintenance windows.” Mutable elements: RemoteUserRole, ExpectedIPs. No maintenance window is open at 04:31."}],"q":"Select every statement that is true for this pair of artefacts.","options":[{"t":"hostd shows the DC0009 deletion signal (RemoveUser)","why":"Correct — method=RemoveUser and the esxcli equivalent are exactly the User Account Deletion evidence AN0337 needs."},{"t":"vpxa shows the DC0002 signal: a login from an IP outside ExpectedIPs","why":"Correct — the analytic correlates the deletion with authentication from an unexpected IP or role."},{"t":"The action ran inside the maintenance window, so it is benign","why":"Wrong — no window is open at 04:31; and an out-of-range source IP is suspicious on its own."},{"t":"A Viewer role performing the removal would also be anomalous (RemoteUserRole)","why":"Correct — RemoteUserRole exists because removal by a non-admin role (e.g. Viewer) should be impossible and is a strong signal."},{"t":"The two artefacts join on the API session, which is the correlation key","why":"Correct — both lines carry session=52ab…, the shared key that ties the login to the deletion."},{"t":"ExpectedIPs can be tuned so the mgmt range stops alerting","why":"Correct — that is exactly what the ExpectedIPs mutable element is for; here the IP is outside it, so the alert stands."}],"correct":[0,1,3,4,5],"hint":"Five statements are true. Check the session IDs, the IP range, the role, and the window.","explain":"The chain is complete: <b>hostd<\/b> records the RemoveUser method (DC0009), <b>vpxa<\/b> records the preceding login from an IP outside ExpectedIPs (DC0002), the two join on the vSphere <b>session id<\/b>, and no maintenance window excuses it — five true statements. The role point matters too: RemoteUserRole exists because a Viewer (or other non-admin role) invoking a removal is a strong anomaly, often a sign of stolen or mis-scoped credentials. ESXi is a favourite target for ransomware crews precisely because it hosts every VM at once; the DET0120 ESXi analytic exists because defenders cannot afford a blind spot there.","study":"AN0337: esxi:hostd + esxi:vpxa correlation, mutable elements RemoteUserRole and ExpectedIPs."},{"id":"m09","type":"qcm","title":"Okta storm: which dial fired?","sc":[{"label":"saas:okta events — one minute window","log":["21:14:02 user.lifecycle.deactivate  actor=adm_integration  target=maria.k","21:14:05 user.lifecycle.deactivate  actor=adm_integration  target=tomas.r","21:14:09 user.lifecycle.suspend     actor=adm_integration  target=dana.p","… (14 deactivations and suspensions total between 21:14:02 and 21:18:40)"]}],"q":"Fourteen lifecycle actions in under five minutes, all by one admin identity. Which mutable element of AN0339 turns this into an alert?","options":[{"t":"BulkActionThreshold","why":"Correct — BulkActionThreshold triggers when multiple account deletion, deactivation, or suspension actions occur within a short period."},{"t":"GeoThreshold","why":"GeoThreshold belongs to AN0338 (M365 sign-in geography), not to the SaaS analytic."},{"t":"SessionDeviceType","why":"SessionDeviceType alerts on unfamiliar administrative session contexts — relevant, but the volume signal here is the bulk threshold."},{"t":"NonRootUIDThreshold","why":"NonRootUIDThreshold is the Linux AN0335 element about auid — unrelated to Okta."}],"answer":0,"hint":"The question is about volume in a short period. Which dial counts actions?","explain":"<b>BulkActionThreshold<\/b> is the dial that counts: AN0339 raises an alert when multiple account-removal actions (deactivate, suspend, delete.initiated, delete.completed) land within a short period. Fourteen actions in under five minutes trips any sane threshold. A detection engineer tunes this number against the offboarding baseline — big companies legitimately disable dozens of accounts on a Friday, which is why the threshold is mutable rather than fixed. When the volume signal and an unfamiliar session context (SessionDeviceType) appear together, confidence rises sharply.","study":"AN0339 mutable elements: BulkActionThreshold and SessionDeviceType."},{"id":"m10","type":"blank","title":"The Linux audit condition","sc":[{"label":"Analytic card AN0335 — filter column","text":"auditd:SYSCALL — “SYSCALL record where exe contains passwd/userdel/chage and <b>auid ____ root<\/b>”.<br>Mutable element NonRootUIDThreshold: “Alert only if auid != root or expected service account.”"}],"q":"Fill the blank with the comparison the analytic uses.","words":["!=","==",">=","like"],"text":"AN0335 alerts when the audit ID is not root: auid ____ root.","blanks":[{"accept":["!=","not equal","not ="],"why":"The filter is auid != root — a non-root audit identity is the suspicious condition."}],"hint":"The alert should fire for NON-root actors. Which comparison keeps root out?","explain":"The condition is <b>auid != root<\/b> — alert when the acting audit identity is not root. auid (the audit user ID) is the login identity that stays attached to a session even after sudo, which is why the analytic trusts it over uid. If root itself runs userdel, that is a different (and rarer) story; what AN0335 hunts is a <i>non-privileged<\/i> account deleting users or changing passwords, usually right after a remote login. The mutable element NonRootUIDThreshold also lets you allowlist expected service accounts so CI or automation jobs do not flood the queue.","study":"AN0335 filter: auid != root, and the NonRootUIDThreshold mutable element."},{"id":"m11","type":"order","title":"Prioritise the queue","sc":[{"label":"Monday 08:05 — four DET0120 alerts waiting","text":"Your shift starts with four alerts. Company context: ransomware pressure is high; ESXi hosts and Okta are crown jewels; the offboarding team is not running this week."}],"q":"Rank the four alerts from most urgent (position 1) to least urgent (position 4).","seq":[{"t":"AN0339: 12 Okta deactivations in 3 minutes from an unfamiliar admin session device","why":"Mass removal + unfamiliar session at an identity provider that gates every other system — highest urgency."},{"t":"AN0337: esxcli system account remove executed from an IP outside ExpectedIPs","why":"Hypervisor account removal from an untrusted IP — the host layer attackers touch just before ransomware."},{"t":"AN0334: one 4724 reset by j.smith via powershell → net.exe lineage at 02:11 (outside window)","why":"Single but anomalous Windows reset — a workstation compromise indicator; important, less blast radius than identity layers."},{"t":"AN0335: passwd run by auid=root in a scheduled config-management run","why":"Root running passwd from automation matches its known pattern — lowest urgency, likely benign."}],"hint":"Think blast radius: identity provider first, hypervisor second, one endpoint third, pattern-matched automation last.","explain":"A good order: <b>1)<\/b> the Okta bulk deactivation from an unfamiliar device — identity is the master key, and SessionDeviceType plus volume both scream; <b>2)<\/b> the ESXi removal from outside ExpectedIPs — hypervisor compromise multiplies everything else; <b>3)<\/b> the single anomalous Windows reset — real signal (non-admin, odd lineage, outside window) but small blast radius; <b>4)<\/b> root’s passwd run from config management — matches its schedule and actor. Prioritisation blends the analytic’s confidence signals with business context, which is exactly what senior SOC work adds on top of the rule.","study":"Alert prioritisation across DET0120 analytics using mutable signals (SessionDeviceType, ExpectedIPs, UserContext)."},{"id":"m12","type":"match","title":"What does each data component record?","sc":[{"label":"Reference — ATT&CK data components used by DET0120","text":"Data components are standard kinds of telemetry. DET0120 uses five. Match each ID to what it records."}],"q":"Match each data component to the evidence it records.","lefts":[{"t":"DC0002","r":2,"why":"DC0002 is User Account Authentication — logons, sign-ins, accepted keys."},{"t":"DC0009","r":3,"why":"DC0009 is User Account Deletion — RemoveUser, Remove-Mailbox, account removals."},{"t":"DC0010","r":0,"why":"DC0010 is User Account Modification — resets, disables, suspensions, 4723/4724/4740."},{"t":"DC0032","r":1,"why":"DC0032 is Process Creation — Sysmon EventCode=1 and auditd SYSCALL execs."},{"t":"DC0064","r":4,"why":"DC0064 is Command Execution — commands like dscl or sysadminctl in the macOS unified log."}],"rights":[{"t":"A user account was modified (reset, disable, suspend)"},{"t":"A process was created on a host"},{"t":"A user authenticated (logon, sign-in, key accepted)"},{"t":"A user account was deleted"},{"t":"A specific command was executed"}],"hint":"Two are close cousins: modification is broader than deletion. Authentication is about proving identity.","explain":"The five components: <b>DC0010<\/b> User Account Modification (resets, disables, suspensions — the 4723/4724/4740 events and Okta lifecycle actions), <b>DC0032<\/b> Process Creation (Sysmon EID 1, auditd SYSCALL), <b>DC0002<\/b> User Account Authentication (logons and sign-ins), <b>DC0009<\/b> User Account Deletion (RemoveUser, Remove-Mailbox), <b>DC0064<\/b> Command Execution (dscl / sysadminctl lines). Every analytic in DET0120 is written as a join across these components — e.g. AN0334 = DC0010 + DC0032. Naming the component is how detection engineers communicate what telemetry a rule depends on.","study":"ATT&amp;CK data components DC0002, DC0009, DC0010, DC0032, DC0064."},{"id":"m13","type":"branch","title":"macOS branch: new admin, new tool","sc":[{"label":"ARTEFACT 1 — macos:unifiedlog (command execution)","log":["22:41:18  sysadminctl --deleteUser accts-intern  actor: admin2  tty: ttys002","22:41:19  note: command matches CommandLinePattern (sysadminctl --deleteUser)"]},{"label":"ARTEFACT 2 — macos:unifiedlog (authentication)","log":["22:38:02  authentication: sudo session opened for admin2  (first sudo ever recorded for this account)","22:38:03  note: admin2 created 2 days ago; not seen in prior admin activity"]},{"label":"Context","text":"AN0336: “Execution of dscl or sysadminctl commands to disable, delete, or modify users combined with anomalous process ancestry or terminal session launch.” Mutable elements: CommandLinePattern, AnomalousUserFlag."}],"q":"Take the three triage steps for this macOS pair.","steps":[{"q":"STEP 1 — Which command pattern does artefact 1 match?","options":[{"t":"sysadminctl --deleteUser — one of the two patterns AN0336 watches","why":"Correct — the analytic watches “dscl . delete” and “sysadminctl --deleteUser” in the unified log (DC0064)."},{"t":"dscl . delete","why":"Wrong — the artefact shows sysadminctl, not dscl; both are watched but only one appears here."},{"t":"Neither — sysadminctl is not in the analytic","why":"Wrong — sysadminctl --deleteUser is explicitly named in the AN0336 logic."}],"answer":0},{"q":"STEP 2 — What does the authentication artefact add?","options":[{"t":"AnomalousUserFlag context: a brand-new admin performing its first sudo right before the removal","why":"Correct — AnomalousUserFlag is about new or rarely seen users performing user removal."},{"t":"Nothing — sudo and user management are unrelated","why":"Wrong — the analytic explicitly combines the command with anomalous authentication or session launch."},{"t":"Proof the Mac was restarted","why":"Wrong — nothing in the artefacts mentions a reboot."}],"answer":0},{"q":"STEP 3 — Verdict?","options":[{"t":"AN0336 fires: command pattern + anomalous new admin — treat as suspected compromise of the Mac","why":"Correct — both halves of the analytic are satisfied; a two-day-old admin account deleting users is a textbook anomaly."},{"t":"Benign: new admins are created all the time","why":"Wrong — the combination (first sudo, then immediate deletion) is precisely what the correlation exists to catch."},{"t":"No alert: sysadminctl does not write to the unified log","why":"Wrong — the analytic is built on macos:unifiedlog precisely because these commands do land there."}],"answer":0}],"hint":"Step 1: name the exact pattern. Step 2: what is unusual about admin2? Step 3: combine the two halves.","explain":"<b>Step 1:<\/b> the command matches <b>sysadminctl --deleteUser<\/b>, one of the two CommandLinePattern targets (the other is “dscl . delete”). <b>Step 2:<\/b> the sudo record supplies the AnomalousUserFlag half — admin2 is two days old and had never used sudo before immediately deleting a user. <b>Step 3:<\/b> the analytic fires, and the verdict is suspected compromise. On macOS, attacker tooling frequently lives in the terminal, so a fresh admin account going straight to account surgery is a high-confidence signal. Real work note: your next steps would be scoping other new admins and checking MDM for what installed admin2.","study":"AN0336: CommandLinePattern and AnomalousUserFlag; correlation of command execution with authentication."},{"id":"m14","type":"multi","title":"Facts about the strategy and the technique","sc":[{"label":"Review card","text":"You are briefing a new teammate about DET0120 and T1531. Some statements below are true, some are not."}],"q":"Select every TRUE statement.","options":[{"t":"T1531 has no sub-techniques","why":"Correct — the ATT&amp;CK technique page states “No sub-techniques”; all account-removal behaviour sits in the parent."},{"t":"T1531’s impact type is Availability","why":"Correct — the technique is an Impact-tactic technique with the Availability impact type."},{"t":"DET0120 covers SaaS platforms and ESXi, not just endpoints","why":"Correct — the strategy spans Windows, Linux, macOS, ESXi, Office Suite, and SaaS."},{"t":"T1531 has three sub-techniques for cloud, hypervisor, and SaaS","why":"Wrong — there are no sub-techniques at all under T1531."},{"t":"MITRE lists easy preventive mitigations for T1531","why":"Wrong — ATT&amp;CK notes this technique “cannot be easily mitigated with preventive controls since it is based on the abuse of system features”, which is why detection matters."},{"t":"Removing account access is an Impact-tactic behaviour","why":"Correct — T1531 sits in the Impact tactic (TA0040)."}],"correct":[0,1,2,5],"hint":"The T1531 page has one “no” fact and one “cannot easily” fact that the wrong options contradict.","explain":"True: <b>no sub-techniques<\/b>, <b>Availability impact<\/b>, <b>multi-platform coverage including ESXi and SaaS<\/b>, and <b>Impact-tactic membership<\/b>. The two false ones are common traps: people assume cloud/hypervisor variants exist as sub-techniques (they do not — DET0120’s analytics are where platform nuance lives), and people assume a preventive control exists (“just forbid account deletion”). ATT&amp;CK is explicit: the technique abuses normal system features, so prevention is weak and <i>detection is the control<\/i>. That fact is your best argument when asking for telemetry budget in a detection-engineering roadmap.","study":"The T1531 technique page: sub-techniques, tactic, impact type, platforms, mitigation note."},{"id":"m15","type":"qcm","title":"Why does AN0335 need the authentication half?","sc":[{"label":"Design discussion","text":"A junior engineer asks: “AN0335 could just alert on userdel. Why does it also require that the deletion was preceded by an interactive shell or remote command execution (DC0002 — NSM:Connections)?”"}],"q":"What is the best answer?","options":[{"t":"Because the correlation separates an attacker’s remote action from routine automated jobs","why":"Correct — requiring a preceding interactive/remote session ties the removal to a live operator, cutting benign automation noise."},{"t":"Because NSM logs are cheaper than auditd logs","why":"Cost is not the analytic’s logic — the join exists for detection quality, not billing."},{"t":"Because userdel only works over SSH","why":"Wrong — userdel works locally too; the point is the preceding access pattern, not the transport."},{"t":"Because NSM:Connections records the deleted account name","why":"Wrong — connection logs do not know account names; the analytic uses them for the access context."}],"answer":0,"hint":"Think about what a lone userdel event looks like on a server fleet at 02:00 versus a userdel right after a fresh remote login.","explain":"The authentication half is the <i>correlation that makes the rule meaningful<\/i>: a userdel fired by a config-management run at 02:00 is normal fleet noise, but a userdel that follows a freshly accepted remote key for a non-privileged user is a live operator doing account surgery. Requiring the DC0002 event converts “a binary ran” into “a remote, non-privileged session performed account removal” — which is exactly the AN0335 wording (“preceded by interactive shell or remote command execution”). This is the general shape of every analytic in DET0120: a platform-specific account action, joined with a session or process context that says a human-controlled foothold did it.","study":"The AN0335 description: “preceded by interactive shell or remote command execution” — the correlation’s purpose."}],"timerSec":1800};</script>
<script>
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EX=window.__EXAM__;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim().replace(/[’']/g,String.fromCharCode(39));}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var SEVKEY={easy:'--sev-easy',medium:'--sev-medium',hard:'--sev-hard','extremely-hard':'--sev-extreme'};

var SEVCLS={easy:'easy',medium:'medium',hard:'hard','extremely-hard':'extreme'};
var S={phase:'intro',ord:[],i:0,sum:0,ans:0,marks:{},checked:{},hint:{},answers:{},skip:{},
state:'IDLE',remain:0,int:null,manMs:0,fbMs:0,pStart:0,pKind:'',priorState:null,
reported:false,fromReview:false,started:false};
function fmtT(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function scoreExercise(sel,corr){var cs={},i;for(i=0;i<corr.length;i++)cs[corr[i]]=1;
var H=0,W=0;for(i=0;i<sel.length;i++){if(cs[sel[i]])H++;else W++;}var N=corr.length;
return {N:N,H:H,W:W,credit:Math.max(0,(H-W)/N)};}
var view=document.getElementById('view');
function clearView(){view.innerHTML='';window.scrollTo(0,0);}
/* ---------- header ---------- */
function renderHeader(){
 var h=document.getElementById('hdrinner');
 var n=S.ord.length||EX.ex.length,pos=S.ord.length?Math.min(S.i+1,S.ord.length):'—';
 var sc=S.ans>0?Math.round(S.sum/S.ans*100):0;
 var stTxt={IDLE:'⏱ READY',RUNNING:'▶ RUNNING',PAUSED_MANUAL:'⏸ PAUSED — manual (press Resume)',
  PAUSED_AUTO_CHECK:'⏸ PAUSED — reviewing feedback (resumes on Next)',ENDED:'■ ENDED'}[S.state]||'⏱ READY';
 var stCls={RUNNING:'run',PAUSED_MANUAL:'pause',PAUSED_AUTO_CHECK:'pause',ENDED:'end'}[S.state]||'';
 h.innerHTML='<div class="hrow">'
 +'<span class="hchip">Exercise <b id="expos">'+pos+'</b> of <b>'+n+'</b></span>'

 +'<span class="tstate '+stCls+'" role="status"><span class="mono" id="tclock">'+fmtT(S.remain)+'</span> '+stTxt+'</span>'

 +'</div><div id="pbar"><div id="pfill"></div></div>';
 document.getElementById('btnHint').onclick=useHint;
 document.getElementById('btnPause').onclick=manualPause;
 document.getElementById('btnSkip').onclick=skipEx;
 updateProgress();
}
function updateProgress(){
 var f=document.getElementById('pfill');if(!f)return;
 var done=0,i;for(i in S.checked)if(S.checked[i])done++;
 var pct=S.ord.length?Math.round(done/S.ord.length*100):0;f.style.width=pct+'%';
}

function setTimerState(st){S.state=st;renderHeaderClock();}
function renderHeaderClock(){renderHeaderSilent();}
function renderHeaderSilent(){
 var h=document.getElementById('hdrinner');if(!h)return;
 var stTxt={IDLE:'⏱ READY',RUNNING:'▶ RUNNING',PAUSED_MANUAL:'⏸ PAUSED — manual (press Resume)',
  PAUSED_AUTO_CHECK:'⏸ PAUSED — reviewing feedback (resumes on Next)',ENDED:'■ ENDED'}[S.state];
 var stCls={RUNNING:'run',PAUSED_MANUAL:'pause',PAUSED_AUTO_CHECK:'pause',ENDED:'end'}[S.state]||'';
 var tEl=document.querySelector('.tstate');
 if(tEl){tEl.className='tstate '+stCls;tEl.innerHTML='<span class="mono">'+fmtT(S.remain)+'</span> '+stTxt;}
 renderHeaderScoreOnly();
}
function renderHeaderScoreOnly(){
 var chips=document.querySelectorAll('.hchip');
 for(var k=0;k<chips.length;k++){
  var m=chips[k].innerHTML.match(/Score/);
  if(m){var sc=S.ans>0?Math.round(S.sum/S.ans*100):0;
   chips[k].innerHTML='Score <b>'+S.sum.toFixed(1)+' / '+S.ans+'</b> <span class="muted">('+sc+'%)</span>';}
 }
}
function tick(){
 if(S.state!=='RUNNING')return;
 S.remain--;
 if(S.remain<=0){S.remain=0;setTimerState('ENDED');stopInt();finalize(true);return;}
 var c=document.getElementById('tclock');if(c)c.textContent=fmtT(S.remain);
}

function renderIntro(){
 S.phase='intro';clearView();
 var it=EX.intro;
 var w=document.createElement('div');w.className='wrap';
 var html='<div class="card">'
 +'<h1>'+esc(it.title)+'</h1>'

 +'<div class="fact"><div class="fl">EXERCISES IN THIS FILE</div><div class="fv">'+EX.ex.length+' exercises</div></div>'
 +'<div class="fact"><div class="fl">ESTIMATED TIME</div><div class="fv">about '+META.estimatedMinutes+' minutes</div></div>'
 +'<div class="fact"><div class="fl">TIMER BUDGET</div><div class="fv">'+fmtT(S.remain)+' countdown</div></div>'
 +'<div class="fact"><div class="fl">PASS MARK</div><div class="fv">70% — PASS at 70% or more</div></div>'
 +'</div></div>';
 html+='<div class="card"><h2>What you will learn here</h2>';
 for(var i=0;i<it.learn.length;i++)html+='<p>'+it.learn[i]+'</p>';
 html+='</div>';
 html+='<div class="card"><h2>Keywords covered in this exam</h2>';
 for(i=0;i<it.themes.length;i++){var th=it.themes[i];
  html+='<div class="theme"><h4>'+esc(th.name)+'</h4><ul>';
  for(var j=0;j<th.items.length;j++)html+='<li>'+th.items[j]+'</li>';
  html+='</ul></div>';
 }
 html+='</div>';
 html+='<div class="card"><h2>How this exam works</h2>';
 for(i=0;i<it.how.length;i++)html+='<p>'+it.how[i]+'</p>';
 html+='<h3>Exercise types used in this file</h3><div class="kv">';
 for(i=0;i<it.types.length;i++)html+='<span>'+esc(it.types[i])+'</span>';
 html+='</div>';
 html+='<div class="actions"><button class="primary" id="btnStart">▶ Start the exam</button>'
 +'<span class="note">Timer starts when you press Start.</span></div></div>';
 w.innerHTML=html;view.appendChild(w);
 document.getElementById('btnStart').onclick=startExam;
}
/* ---------- exam flow ---------- */
function startExam(){
 S.started=true;S.phase='exam';S.sum=0;S.marks={};S.checked={};S.hint={};S.answers={};S.skip={};
 S.i=0;S.fromReview=false;S.reported=false;S.manMs=0;S.fbMs=0;S.pKind='';
 S.ord=shuffle(EX.ex.map(function(e,k){return k;}));
 S.remain=EX.timerSec;setTimerState('RUNNING');startInt();
 renderHeader();renderExercise(S.ord[0],false);
}
function curExIdx(){return S.ord[Math.min(S.i,S.ord.length-1)];}
function skippedList(){var a=[],i;for(i=0;i<S.ord.length;i++){if(S.skip[S.ord[i]]&&!S.checked[S.ord[i]])a.push(S.ord[i]);}return a;}
function nextExercise(){
 if(S.state==='PAUSED_AUTO_CHECK'){S.fbMs+=Date.now()-S.pStart;S.pKind='';}
 if(S.fromReview){setTimerState('RUNNING');startInt();renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){setTimerState('RUNNING');startInt();renderReview();return;}
  finalize(false);return;
 }
 setTimerState('RUNNING');startInt();
 renderExercise(S.ord[S.i],false);
}
function skipEx(){
 if(S.phase!=='exam')return;
 var k=curExIdx();
 if(!S.checked[k])S.skip[k]=true;
 nextRawSkip();
}
function nextRawSkip(){
 if(S.fromReview){renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){renderReview();return;}
  finalize(false);return;
 }
 renderExercise(S.ord[S.i],false);
}
function manualPause(){
 if(S.state!=='RUNNING'&&S.state!=='PAUSED_AUTO_CHECK')return;
 S.priorState=S.state;S.pStart=Date.now();S.pKind='manual';
 setTimerState('PAUSED_MANUAL');stopInt();
 var ov=el('div','overlay');
 ov.innerHTML='<div class="ot">⏸ PAUSED — manual</div>'
 +'<p class="muted">The exercise is hidden while you take a break. The timer is stopped.</p>'
 +'<button class="primary" id="btnResume">▶ Resume</button>';
 document.body.appendChild(ov);
 document.getElementById('btnResume').onclick=function(){
  S.manMs+=Date.now()-S.pStart;document.body.removeChild(ov);
  if(S.priorState==='PAUSED_AUTO_CHECK'){S.pStart=Date.now();S.pKind='feedback';}
  setTimerState(S.priorState||'RUNNING');
  if(S.state==='RUNNING')startInt();
 };
}
function useHint(){
 if(S.phase!=='exam')return;
 var k=curExIdx(),ex=EX.ex[k];
 if(S.checked[k]||S.hint[k])return;
 S.hint[k]=true;
 var box=document.getElementById('hintbox');
 if(!box){box=el('div','hintbox');box.id='hintbox';
  box.innerHTML='<div class="ht">💡 HINT (one per exercise — costs 10% of this exercise credit)</div><div id="hinttxt"></div>';
  var ans=document.getElementById('ansblk');if(ans)ans.parentNode.insertBefore(box,ans);
 }
 document.getElementById('hinttxt').textContent=ex.hint;
}
/* ---------- rendering one exercise ---------- */
var CUR={k:-1,collect:null};
function renderExercise(k,fromReview){
 clearView();S.fromReview=fromReview;CUR.k=k;
 var ex=EX.ex[k];S.answers[k]=S.answers[k]||null;
 var posEl=document.getElementById('expos');
 if(posEl)posEl.textContent=String(S.ord.indexOf(k)+1);
 var w=el('div','wrap');
 var scHtml='';
 for(var a=0;a<ex.sc.length;a++){var art=ex.sc[a];
  scHtml+='<div class="art"><div class="art-label">'+esc(art.label)+'</div>';
  if(art.text)scHtml+='<p>'+art.text+'</p>';
  if(art.code)scHtml+='<pre>'+esc(art.code)+'</pre>';
  if(art.log){scHtml+='<div class="logbox"><input class="logfilter" id="logflt'+a+'" placeholder="filter log lines (case-insensitive)…" aria-label="Filter log lines"><table class="logtbl"><tbody id="logtb'+a+'">';
   for(var L=0;L<art.log.length;L++){
    scHtml+='<tr data-s="'+esc(art.log[L].toLowerCase())+'">'+fmtLogRow(art.log[L])+'</tr>';
   }
   scHtml+='</tbody></table></div>';
  }
  scHtml+='</div>';
 }
 var pos=S.ord.indexOf(k)+1;
 var scWords=0,a2;
 for(a2=0;a2<ex.sc.length;a2++){var sa=ex.sc[a2];
  if(sa.text)scWords+=sa.text.replace(/<[^>]*>/g,' ').split(/\s+/).filter(Boolean).length;
  if(sa.code)scWords+=sa.code.split(/\s+/).filter(Boolean).length;
  if(sa.log)scWords+=sa.log.join(' ').split(/\s+/).filter(Boolean).length;}
 var isHardTier=(META.difficulty==='hard'||META.difficulty==='extremely-hard');
 var collapsible=isHardTier&&(scWords>90||ex.sc.length>=3);
 var scSum='';
 if(collapsible){var s0=ex.sc[0];var sTxt=(s0.text||s0.code||(s0.log?s0.log.join(' '):'')||'');
  sTxt=sTxt.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  scSum=esc((s0.label||'Scenario')+' — '+sTxt.slice(0,90)+(sTxt.length>90?'…':'')+' · collapsed');}
 var head='<div class="card" id="excard">'
 +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'
 +'<span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +(S.fromReview?'<span class="muted small">returned from skipped pool</span>':'')
 +'<span class="muted small" style="margin-left:auto">'+esc(ex.title)+'</span></div>'
 +'<div class="blk scenario"><div class="blk-h blue">📋 SCENARIO'
 +(collapsible?'<button type="button" class="scbtn" id="scbtn" aria-expanded="true">▾ Collapse</button>':'')+'</div>'
 +'<div class="blk-b" id="scbody">'+scHtml+'</div>'
 +(collapsible?'<div class="sc-sum" id="scsum" style="display:none">'+scSum+'</div>':'')+'</div>'
 +'<div class="blk"><div class="blk-h amber">❓ QUESTION</div><div class="blk-b" id="qblk"><p class="qtext">'+ex.q+'</p></div></div>'
 +'<div class="blk" id="ansblk"><div class="blk-h green">✍️ YOUR ANSWER</div><div class="blk-b" id="ansarea"></div></div>'
 +'<div id="fbhost"></div>'
 +'<div class="actions" id="actrow">'
 +'<button class="primary" id="btnCheck">✓ Check</button>'
 +'<button id="btnNext" style="display:none"></button>'
 +'<span class="note" id="actnote"></span></div>'

/* ---------- grading ---------- */
function grade(ex,got){
 var rows=[],N=0,H=0,W=0;
 var i;
 if(ex.type==='qcm'){
  N=1;var sel=got.sel[0];var ok=sel===ex.answer;
  if(ok)H++;else if(sel>=0)W++;
  rows.push({s:ok?'ok':'bad',t:'You selected: '+ex.options[sel].t,
   why:ok?ex.options[ex.answer].why:ex.options[sel].why});
  if(!ok)rows.push({s:'miss',t:'Correct answer: '+ex.options[ex.answer].t,why:ex.options[ex.answer].why});
 }
 else if(ex.type==='multi'){
  var corrIdx=ex.correct;
  N=corrIdx.length;
  var selMap={};for(i=0;i<got.sel.length;i++)selMap[got.sel[i]]=1;
  for(i=0;i<corrIdx.length;i++){
   if(selMap[corrIdx[i]]){H++;rows.push({s:'ok',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});}
   else rows.push({s:'miss',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});
  }
  for(i=0;i<got.sel.length;i++){
   var s=got.sel[i];var isCorr=false;
   for(var c=0;c<corrIdx.length;c++)if(corrIdx[c]===s)isCorr=true;
   if(!isCorr){W++;rows.push({s:'bad',t:ex.options[s].t,why:ex.options[s].why});}
  }
 }
 else if(ex.type==='match'){
  N=ex.lefts.length;
  for(i=0;i<ex.lefts.length;i++){
   var okM=got.vals[i]===ex.lefts[i].r;
   if(okM)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okM?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.lefts[i].t+' → '+(got.vals[i]>=0?ex.rights[got.vals[i]].t:'no answer'),
    why:ex.lefts[i].why});
  }
 }
 else if(ex.type==='dnd'){
  N=ex.items.length;
  for(i=0;i<ex.items.length;i++){
   var okD=got.vals[i]===ex.items[i].zone;
   if(okD)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okD?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.items[i].t+' → '+(got.vals[i]>=0?ex.zones[got.vals[i]].t:'not placed'),
    why:ex.items[i].why});
  }
 }
 else if(ex.type==='order'){
  N=ex.seq.length;
  for(i=0;i<ex.seq.length;i++){
   var okO=got.vals[i]===i+1;
   if(okO)H++;else if(got.vals[i]>0)W++;
   rows.push({s:okO?'ok':(got.vals[i]>0?'bad':'miss'),
    t:'“'+ex.seq[i].t+'” correct position: '+(i+1)+(got.vals[i]>0?' — you chose '+got.vals[i]:' — no position chosen'),
    why:ex.seq[i].why});
  }
 }
 else if(ex.type==='triage'){
  N=ex.rows.length;
  for(i=0;i<ex.rows.length;i++){
   var okT=got.vals[i]===ex.rows[i].c;
   if(okT)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okT?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.rows[i].t+' → your verdict: '+(got.vals[i]>=0?ex.labels[got.vals[i]]:'none'),
    why:ex.rows[i].why});
  }
 }
 else if(ex.type==='blank'){
  N=ex.blanks.length;
  for(i=0;i<ex.blanks.length;i++){
   var v=norm(got.vals[i]);
   var okB=false;for(var a=0;a<ex.blanks[i].accept.length;a++)if(v===norm(ex.blanks[i].accept[a]))okB=true;
   if(okB)H++;else if(v.length>0)W++;
   rows.push({s:okB?'ok':(v.length>0?'bad':'miss'),
    t:'Blank '+(i+1)+': your answer “'+(got.vals[i]||'')+'” — expected “'+ex.blanks[i].accept[0]+'”',
    why:ex.blanks[i].why});
  }
 }
 else if(ex.type==='branch'){
  N=ex.steps.length;
  for(i=0;i<ex.steps.length;i++){
   var okS=got.sel[i]===ex.steps[i].answer;
   if(okS)H++;else W++;
   rows.push({s:okS?'ok':'bad',
    t:'Step '+(i+1)+': you chose “'+ex.steps[i].options[got.sel[i]].t+'”',
    why:okS?ex.steps[i].options[got.sel[i]].why:(ex.steps[i].options[got.sel[i]].why+' Correct: '+ex.steps[i].options[ex.steps[i].answer].t+' — '+ex.steps[i].options[ex.steps[i].answer].why)});
  }
 }
 else if(ex.type==='query'){
  var q=norm(got.text);
  N=ex.elements.length;
  var missList=[];var dgr=null;
  for(i=0;i<ex.elements.length;i++){
   var okQ=false;
   for(var p=0;p<ex.elements[i].any.length;p++){
    if(q.indexOf(norm(ex.elements[i].any[p]))>=0){okQ=true;break;}
   }
   if(okQ)H++;else{missList.push(ex.elements[i]);rows.push({s:'miss',t:'Missing element: '+ex.elements[i].t,why:ex.elements[i].why});}
  }
  if(ex.forbidden){
   for(i=0;i<ex.forbidden.length;i++){
    if(q.indexOf(norm(ex.forbidden[i].t))>=0){W++;rows.push({s:'bad',t:'Harmful element found: '+ex.forbidden[i].t,why:ex.forbidden[i].why});}
   }
  }
  if(missList.length===0)rows.unshift({s:'ok',t:'All required elements present in the query.',why:''});
  if(ex.danger){
   for(i=0;i<ex.danger.length;i++){
    if(q.indexOf(norm(ex.danger[i]))>=0)dgr=ex.dangerNote||'Your query contains a state-changing or destructive element.';
   }
  }
  var credit=Math.max(0,(H-W)/N);
  return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:dgr,credit:credit};
 }
 var credit=Math.max(0,(H-W)/N);
 if(ex.type==='qcm')credit=credit>0?1:0;
 return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:null,credit:credit};
}

function renderReview(){
 clearView();
 var pend=skippedList();
 var w=el('div','wrap');
 var h='<div class="card"><h2>Review skipped exercises</h2>';
 if(pend.length===0){
  h+='<p class="muted">⚠ No skipped exercises left. You can submit now.</p>';
 }else{
  h+='<p class="muted">You skipped '+pend.length+' exercise(s). You can go back and answer them while the timer still runs. A skipped-and-never-answered exercise is excluded from your score.</p>';
  for(var i=0;i<pend.length;i++){
   var ex=EX.ex[pend[i]];
   h+='<div class="skipcard"><span class="st">⚠ Skipped</span><span class="sd">'+esc(ex.title)+'</span>'
   +'<button data-k="'+pend[i]+'" class="ansbtn">Answer it</button></div>';
  }
 }
 h+='<div class="actions"><button class="primary" id="btnFinal">⏭ Submit exam</button>'
 +'<span class="note">Submitting excludes anything still unanswered.</span></div></div>';
 w.innerHTML=h;view.appendChild(w);
 var btns=w.querySelectorAll('.ansbtn');
 for(var b=0;b<btns.length;b++){
  (function(k){btns[b].onclick=function(){renderExercise(k,true);};})(parseInt(btns[b].getAttribute('data-k'),10));
 }
 document.getElementById('btnFinal').onclick=function(){finalize(false);};
}
/* ---------- results ---------- */
function finalize(byTimeout){
 stopInt();
 if(S.state!=='ENDED')setTimerState('ENDED');
 clearView();
 var full=0,part=0,zero=0,partSum=0,answered=0,i;
 for(i=0;i<EX.ex.length;i++){
  if(S.checked[i]){answered++;var c=S.marks[i];
   if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
 }
 var skipped=EX.ex.length-answered;
 var sum=0;for(i=0;i<EX.ex.length;i++)if(S.checked[i])sum+=S.marks[i];
 var pct=answered>0?Math.round(sum/answered*100):0;
 var pass=pct>=70;
 var w=el('div','wrap');
 var manS=Math.round(S.manMs/1000),fbS=Math.round(S.fbMs/1000);
 var h='<div class="card"><h1>Results — '+esc(META.title)+'</h1>'
 +'<div class="kv"><span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +'<span>Answered: '+answered+' of '+EX.ex.length+'</span>'
 +(byTimeout?'<span>⏱ Time ran out — unanswered exercises were excluded</span>':'')+'</div>'
 +'<div class="bigres">'
 +'<div class="res ok"><div class="rn">'+full+'</div><div class="rl">✓ Fully correct</div></div>'
 +'<div class="res part"><div class="rn">'+part+'</div><div class="rl">✓ Partially correct'+(part>0?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'
 +'<div class="res bad"><div class="rn">'+zero+'</div><div class="rl">✗ Fully incorrect</div></div>'
 +'<div class="res skip"><div class="rn">'+skipped+'</div><div class="rl">⚠ Skipped — excluded</div></div>'
 +'</div>'
 +'<p style="font-size:20px"><b>Final score: '+sum.toFixed(1)+' / '+answered+'</b> — '+pct+'% (pass mark 70%)</p>'
 +'<div class="verdict '+(pass?'pass':'fail')+'"><div class="vt">'+(pass?'✓ PASS':'✗ FAIL')+'</div>'
 +'<p>'+(pass?'Well done. You reached the pass mark for this severity.':'You must retake this exam to reach 70%. Review the explanations, then press Retake Exam.')+'</p></div>'
 +'<p class="small muted">Time accounting: '+fmtT(manS)+' paused manually (breaks) · '+fmtT(fbS)+' reviewing feedback (auto-pause after Check).</p>'
 +'<div class="actions"><button class="primary" id="btnRetake">↻ Retake Exam</button></div></div>';
 w.innerHTML=h;view.appendChild(w);
 document.getElementById('btnRetake').onclick=function(){startExam();};
 reportScore(sum,answered);
}
function reportScore(creditSum,answeredCount){
 if(S.reported)return;S.reported=true;
 var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 window.__learner={username:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
});
/* ---------- boot ---------- */
S.remain=EX.timerSec;
renderHeader();
renderIntro();
</script>
</body>
</html>
