    s:{sum:'Night shift, 02:40. Two Sysmon events from FIN-WS-22 arrived one second apart.',

         '02:40:11  EventCode=1   Image: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe  CommandLine: powershell.exe -nop -w hidden -enc SQBFAFgA  ProcessGuid: {7A5B18C2-4E11-6836-2C01-00000000C400}',
         '02:40:12  EventCode=13  EventType: SetValue  TargetObject: HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveUpdater  Details: "powershell.exe -nop -w hidden -enc SQBFAFgA"  Image: …\\powershell.exe  ProcessGuid: {7A5B18C2-4E11-6836-2C01-00000000C400}']}]},
    q:'Which statement matches the behaviour chain that analytic AN0781 looks for?',
    opts:[['A hidden PowerShell process wrote a Run key, and both events share one ProcessGuid',1],['msiexec.exe installed software and wrote its own Run entry, which is allowlisted',0],['Only a process started; no registry value was changed at all',0],['The wallpaper value was edited by explorer.exe during logon',0]],
    x:'<p>AN0781 wants the chain: an abnormal registry write <strong>linked to the process that made it</strong>. Here a hidden PowerShell (EventCode=1) writes a Run key (EventCode=13) <strong>one second later with the same ProcessGuid</strong> — one process, both events. That is exactly the behaviour. The other options describe a trusted installer (allowlisted), a half chain with no registry write, and a value the analytic does not watch.</p>',
    h:'Compare the ProcessGuid values across the two events.' },

  { t:'qmul', multiEl:true,
    s:{sum:'You are documenting which EventCode=13 fields the analytic actually uses.',
       blocks:[{label:'ARTEFACT 1 — EventCode=13 event', kind:'log', lines:[
         'EventCode=13  EventType: SetValue  TargetObject: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Sync  Details: "C:\\Users\\akeranen\\AppData\\Roaming\\tool.exe"  Image: C:\\Windows\\Temp\\stage2.exe  ProcessGuid: {7A5B18C2-4E11-6836-2C01-00000000C410}  User: FIN-WS-22\\akeranen']}]},
    q:'Select the three fields that DET0280 needs from this event.',
    opts:[['TargetObject — the key path that was changed',1],['Image — the program that performed the write',1],['Details — the value that was written',1],['QueryName — a DNS name requested by the host',0],['SourceIp — the remote address of a connection',0],['Initiated — the direction of a network session',0]],
    x:'<p>From a registry event the analytic needs <strong>TargetObject</strong> (does the key match the watched patterns?), <strong>Image</strong> (who wrote — is it in the ParentProcessAllowList, is it signed?), and <strong>Details</strong> (what value was planted — often a program path). QueryName, SourceIp and Initiated are fields of network events (EventCode=3), not registry events.</p>',
    h:'Two fields describe the write, one field describes the writer. The rest are network fields.' },

  { t:'match', multiEl:true,
    s:{sum:'The analytic names four ways an attacker can reach the registry. Match each path to its typical tool.',
       blocks:[{label:'ARTEFACT 1 — Analytic excerpt', kind:'text',
         body:['“…abnormal registry modifications via CLI, PowerShell, WMI, or direct API calls…”']}]},
    q:'Match each execution path to the tool or call you would see in the logs.',
    pairs:[['CLI path','reg.exe add HKCU\\…\\Run'],['PowerShell path','Set-ItemProperty on a Run key'],['WMI path','StdRegProv methods via Invoke-CimMethod'],['Direct API path','RegSetValueEx called from custom code']],
    x:'<p><strong>CLI</strong> means the old command line — reg.exe is the classic registry CLI tool. <strong>PowerShell</strong> has its own cmdlets, and Set-ItemProperty is the one that writes values. <strong>WMI</strong> exposes the registry through the StdRegProv class; an attacker can call it remotely or locally with Invoke-CimMethod. <strong>Direct API</strong> means the program calls Windows functions like RegSetValueEx itself — no tool in the command line, only the process in the Image field. DET0280 watches all four, which is why blocking one tool alone is never enough.</p>',
    h:'One is a built-in cmdlet, one is a class of the WMI service, one is a Windows function, one is a small EXE.' },

  { t:'log', multiEl:false,
    s:{sum:'Queue: ticket #51208 says “possible registry persistence on FIN-WS-22”. Use the filter, then pick the event.',
       blocks:[{label:'ARTEFACT 1 — Sysmon slice (FIN-WS-22, 02:3x–02:4x)', kind:'log', lines:[
         '02:31:02  EventCode=1   Image: …\\explorer.exe  CommandLine: explorer.exe /load',
         '02:36:44  EventCode=13  TargetObject: HKCU\\Control Panel\\Desktop\\Wallpaper  Image: …\\explorer.exe',
         '02:40:12  EventCode=13  TargetObject: HKCU\\…\\CurrentVersion\\Run\\OneDriveUpdater  Image: …\\powershell.exe',
         '02:41:03  EventCode=13  TargetObject: HKLM\\…\\CurrentVersion\\Run\\TeamsMachine  Image: …\\msiexec.exe',
         '02:44:20  EventCode=1   Image: …\\svchost.exe  CommandLine: svchost.exe -k netsvcs',
         '02:47:59  EventCode=3   Image: …\\msedge.exe  DestinationHostname: portal.contoso[.]example',
         '02:52:15  EventCode=13  TargetObject: HKLM\\…\\Session Manager\\SafeDllSearchMode  Image: …\\wmic.exe']}]},
    q:'Click the event that shows PowerShell writing a Run key.',
    lines:[
      '02:31:02  EventCode=1   Image: …\\explorer.exe  CommandLine: explorer.exe /load',
      '02:36:44  EventCode=13  TargetObject: HKCU\\Control Panel\\Desktop\\Wallpaper  Image: …\\explorer.exe',
      '02:40:12  EventCode=13  TargetObject: HKCU\\…\\CurrentVersion\\Run\\OneDriveUpdater  Image: …\\powershell.exe',
      '02:41:03  EventCode=13  TargetObject: HKLM\\…\\CurrentVersion\\Run\\TeamsMachine  Image: …\\msiexec.exe',
      '02:44:20  EventCode=1   Image: …\\svchost.exe  CommandLine: svchost.exe -k netsvcs',
      '02:47:59  EventCode=3   Image: …\\msedge.exe  DestinationHostname: portal.contoso[.]example',
      '02:52:15  EventCode=13  TargetObject: HKLM\\…\\Session Manager\\SafeDllSearchMode  Image: …\\wmic.exe'],
    target:2, targetText:'Line 3 — EventCode=13, Run key, written by powershell.exe',
    x:'<p>Line 3 has all three marks at once: <strong>EventCode=13</strong> (registry write), a <strong>Run key</strong> in TargetObject (persistence family), and <strong>powershell.exe</strong> as the writer. The other EventCode=13 lines are a wallpaper change (not watched), a Teams install by msiexec (a normal, allowlisted installer), and a SafeDllSearchMode change by wmic (watched, but not PowerShell and not a Run key). Typing <em>EventCode=13</em> or <em>Run</em> in the filter box narrows the list to two lines, and <em>powershell</em> picks the winner.</p>',
    h:'Try the filter with EventCode=13, then look at Image.' },

  { t:'drop', multiEl:true,
    s:{sum:'Three adversary goals, six edits. Classify each edit.',
       blocks:[{label:'ARTEFACT 1 — Analytic excerpt', kind:'text',
         body:['“…especially targeting persistence, privilege escalation, or defense evasion keys…” Examples: Notify/Userinit/Startup edits, disabling SafeDllSearchMode, service ImagePath changes.']}]},
    q:'Drag each registry edit onto the goal it mainly serves.',
    zones:['Persistence','Privilege escalation','Defense evasion'],
    items:[['Edit HKCU\\…\\Run',0],['Edit Winlogon\\Userinit',0],['Change Services\\…\\ImagePath',1],['Set SafeDllSearchMode to 0',2],['Set DisableAntiSpyware to 1',2],['Re-add a Notify value',0]],
    x:'<p><strong>Persistence</strong> edits make programs start on their own: the Run key, Userinit, and the (old but real) Notify value. <strong>Privilege escalation</strong> aims at code running with higher rights: a service ImagePath change can make Windows start the attacker’s file as a powerful service. <strong>Defense evasion</strong> edits weaken protections without starting anything: SafeDllSearchMode off changes how libraries are found, and DisableAntiSpyware tries to switch off the antivirus.</p>',
    h:'Two zones are about starting programs; one zone is about weakening Windows or its defenses.' },

  { t:'fill', multiEl:true,
    s:{sum:'A detection engineer wrote a tuning note after a quiet week. Fill in the element names.',
       blocks:[{label:'ARTEFACT 1 — Tuning note (draft)', kind:'text',
         body:['Tuning note, week 23: too many false positives from installers. We added regedit.exe and msiexec.exe to the ____(1)____, widened the ____(2)____ to 10 minutes, and kept the ____(3)____ focused on Run, Services and Winlogon keys. SignatureCheck stays on. — D.Eng team']}]},
    q:'Pick the right element for each gap.',
    parts:['We added regedit.exe and msiexec.exe to the ',{b:0},', widened the ',{b:1},' to 10 minutes, and kept the ',{b:2},' focused on Run, Services and Winlogon keys.'],
    bank:['ParentProcessAllowList','TimeWindow','RegistryKeyPathPatterns','SignatureCheck','TargetObject'],
    x:'<p>Trust tools go into the <strong>ParentProcessAllowList</strong> (it filters known safe writers), time distance is the <strong>TimeWindow</strong>, and the list of watched keys is the <strong>RegistryKeyPathPatterns</strong>. SignatureCheck was left on, so it is not one of the changed settings, and TargetObject is a log field, not a tuning element. This is exactly the note a detection engineer writes after tuning the analytic in a real SOC.</p>',
    h:'One element filters tools, one is measured in minutes, one lists keys.' },

  { t:'branch', multiEl:true,
    s:{sum:'02:40 alert on FIN-WS-22: unsigned PowerShell from %TEMP% wrote an HKLM Run key. Work the triage.',
       blocks:[{label:'ARTEFACT 1 — Alert context', kind:'text',
         body:['Alert: AN0781 matched. Writer: powershell.exe (unsigned, launched from C:\\Users\\akeranen\\AppData\\Local\\Temp). Key: HKLM\\…\\CurrentVersion\\Run\\OneDriveUpdater. TimeWindow: 5 minutes. SignatureCheck: flagged.']}]},
    q:'Take the two triage decisions in order.',
    steps:[
      { q:'The alert is open in front of you. What do you do first?', opts:[
        ['Pull the EventCode=1 event of the writing process and check its command line and parent',1],
        ['Close the alert — PowerShell writes Run keys all the time',0],
        ['Reimage FIN-WS-22 immediately',0]]},
      { q:'The EventCode=1 event shows: -nop -w hidden -enc, parent is winword.exe, launched from %TEMP%. What is your decision?', opts:[
        ['Escalate as a likely T1112 persistence attempt and start incident response steps',1],
        ['Mark it benign because Word is a signed application',0],
        ['Delete the Run value and close the ticket without notes',0]]}
    ],
    x:'<p>Step 1: the analytic already gave you the write; the missing piece is <strong>the process behind it</strong> — its command line and its parent. Closing or reimaging skip that step for no reason. Step 2: the context is now damning — an encoded and hidden PowerShell, born from winword.exe (a document opened the payload), running from %TEMP%, planting an HKLM Run key. That is a classic T1112 persistence chain, so you <strong>escalate</strong>. Word being signed does not clean up its child, and deleting one value would both destroy evidence and leave the rest of the chain alive.</p>',
    h:'First understand the writer. Then weigh hidden + encoded + odd parent together.' },

  { t:'order', multiEl:true,
    s:{sum:'Your team lead asks you to write down the standard triage flow for a DET0280 alert.',
       blocks:[{label:'ARTEFACT 1 — Flow fragments on the whiteboard', kind:'text',
         body:['[A] Decide: escalate to IR or file a tuning request. [B] Check whether the key matches the RegistryKeyPathPatterns. [C] Look for a service restart or new process inside the TimeWindow. [D] Identify the writing process: Image, signature, parent-child lineage.']}]},
    q:'Put the four steps in the order a SOC analyst should work them.',
    items:['Check whether the key matches the RegistryKeyPathPatterns','Identify the writing process: Image, signature, parent-child lineage','Look for a service restart or new process inside the TimeWindow','Decide: escalate to IR or file a tuning request'],
    x:'<p>The flow follows the chain itself. First you confirm the <strong>key is in scope</strong> (otherwise it may be a pattern problem). Then you identify the <strong>writer</strong> — who, signed or not, born from whom. Then you look for the <strong>follow-up execution</strong> inside the TimeWindow, because that is what turns a lonely write into a live chain. Only then do you <strong>decide</strong>, with all three facts on the table, whether this is IR work or a tuning request. Deciding first would be guessing.</p>',
    h:'Scope → writer → follow-up → decision.' },

  { t:'qcm', multiEl:false,
    s:{sum:'A quiz from the detection engineering guild: which of these edits is defense evasion rather than persistence?',
       blocks:[{label:'ARTEFACT 1 — Candidate edits', kind:'log', lines:[
         'A. HKCU\\…\\CurrentVersion\\Run\\Sync  → "C:\\Users\\…\\tool.exe"',
         'B. HKLM\\…\\Session Manager\\SafeDllSearchMode → 0',
         'C. HKLM\\…\\Winlogon\\Userinit → userinit.exe, evil.exe',
         'D. HKLM\\…\\Notify\\SecretLogon → evil.dll']}]},
    q:'Which edit weakens a protection without starting anything by itself?',
    opts:[['B — turning SafeDllSearchMode off',1],['A — adding a Run entry',0],['C — appending a program to Userinit',0],['D — registering a Notify DLL',0]],
    x:'<p><strong>SafeDllSearchMode = 0</strong> changes how Windows searches for program libraries (DLLs). Nothing starts because of it — but the next time a real program loads a library, Windows may pick up an attacker’s file first. That is textbook defense evasion. Run, Userinit and Notify all cause code to <strong>run</strong>, which is persistence.</p>',
    h:'One of these four does not launch anything on its own.' },

  { t:'log', multiEl:false,
    s:{sum:'Same log slice as ticket #51208, but now the question is about the allowlist.',
       blocks:[{label:'ARTEFACT 1 — Sysmon slice (FIN-WS-22)', kind:'log', lines:[
         '02:40:12  EventCode=13  TargetObject: HKCU\\…\\Run\\OneDriveUpdater  Image: …\\powershell.exe  Signed: false',
         '02:41:03  EventCode=13  TargetObject: HKLM\\…\\Run\\TeamsMachine  Image: C:\\Windows\\System32\\msiexec.exe  Signed: true  Company: Microsoft Corporation',
         '02:52:15  EventCode=13  TargetObject: HKLM\\…\\SafeDllSearchMode  Image: …\\wmic.exe  Signed: true',
         '02:55:40  EventCode=13  TargetObject: HKCU\\…\\Run\\BackupTool  Image: C:\\Windows\\Temp\\b.exe  Signed: false']}]},
    q:'Click the event the ParentProcessAllowList would most likely filter out as a safe write.',
    lines:[
      '02:40:12  EventCode=13  TargetObject: HKCU\\…\\Run\\OneDriveUpdater  Image: …\\powershell.exe  Signed: false',
      '02:41:03  EventCode=13  TargetObject: HKLM\\…\\Run\\TeamsMachine  Image: C:\\Windows\\System32\\msiexec.exe  Signed: true  Company: Microsoft Corporation',
      '02:52:15  EventCode=13  TargetObject: HKLM\\…\\SafeDllSearchMode  Image: …\\wmic.exe  Signed: true',
      '02:55:40  EventCode=13  TargetObject: HKCU\\…\\Run\\BackupTool  Image: C:\\Windows\\Temp\\b.exe  Signed: false'],
    target:1, targetText:'Line 2 — msiexec.exe, signed Microsoft installer writing during a normal install',
    x:'<p>The ParentProcessAllowList holds <strong>legitimate registry tools</strong> — the page names regedit.exe and msiexec.exe as examples. Line 2 is a signed Microsoft installer (msiexec.exe) writing a Run entry during a software install: a known safe pattern that creates noise. The other three are unsigned writers or odd tools touching watched keys — those must stay in view. Filtering line 2 keeps the alert queue calm without hiding any real threat.</p>',
    h:'Which writer is a trusted, signed installer doing an ordinary install job?' },

  { t:'qmul', multiEl:true,
    s:{sum:'A junior asks: why is DET0280 “behaviour-based” and not just a long watchlist of keys?',
       blocks:[{label:'ARTEFACT 1 — Two candidate designs', kind:'text',
         body:['Design A: alert when any of 500 important keys is written, by anyone, at any time. Design B (DET0280): alert when an abnormal writer touches important keys AND something executes nearby in time.']}]},
    q:'Select the two reasons that make the behaviour-based design (B) better.',
    opts:[['It links the write to the writing process and its trust level',1],['It correlates the write with nearby process or service execution',1],['It fires on every write to any registry key on the host',0],['It depends on one fixed key path that never changes',0],['It needs a kernel debugger attached to the host',0]],
    x:'<p>Design B adds two signals that a plain watchlist lacks. First, it judges <strong>the writer</strong> — its Image, its signature, its parent-child line — so a signed installer and a hidden PowerShell are not treated the same. Second, it waits for <strong>nearby execution</strong> in the TimeWindow, so a value that actually starts something stands out. “Fires on every write” and “one fixed key” describe the noisy Design A, and a kernel debugger is not part of this strategy at all.</p>',
    h:'Look at what B checks beyond the key path itself.' },

  { t:'drop', multiEl:true,
    s:{sum:'You are testing the tuned analytic against last night’s events. Which would fire?',
       blocks:[{label:'ARTEFACT 1 — Tuned settings', kind:'text',
         body:['Patterns: Run, RunOnce, Services ImagePath, Winlogon, SafeDllSearchMode. AllowList: regedit.exe, msiexec.exe, SCCM client. TimeWindow: 5 min. SignatureCheck: on.']}]},
    q:'Drag each event into the right bucket.',
    zones:['Suspicious chain — fires','Filtered or not watched — stays quiet'],
    items:[['reg.exe (unsigned) adds an HKLM Run value',0],['powershell.exe writes Winlogon\\Userinit',0],['wmic.exe (from %TEMP% parent) zeroes SafeDllSearchMode',0],['msiexec.exe (signed, allowlisted) writes a Run entry during install',1],['SCCM client pushes a Run entry for a new agent',1],['explorer.exe changes the desktop wallpaper value',1]],
    x:'<p>The analytic fires when an <strong>abnormal writer</strong> touches a <strong>watched key</strong>. reg.exe, PowerShell on Userinit, and a %TEMP%-born wmic on SafeDllSearchMode are all abnormal writers on watched keys — three suspicious chains. msiexec and the SCCM client are trusted tools from the allowlist doing normal jobs, and the wallpaper key is not in the patterns at all — those three stay quiet. This is exactly the balance a detection engineer tunes for.</p>',
    h:'Two questions per item: is the writer trusted, and is the key watched?' },

  { t:'match', multiEl:true,
    s:{sum:'Telemetry drill before the shift: match each Sysmon event code to its meaning.',
       blocks:[{label:'ARTEFACT 1 — Log source table', kind:'table', header:true,
         rows:[['Channel','Events'],
               ['WinEventLog:Sysmon','EventCode=13, 14 for registry; EventCode=1 for processes']]}]},
    q:'Match each event code to what it records.',
    pairs:[['EventCode=13','A registry value was set or changed'],['EventCode=14','A registry key was renamed'],['EventCode=1','A process started'],['EventCode=3','A network connection happened']],
    x:'<p>Sysmon 13 is the registry <strong>value set</strong> — the workhorse event of DET0280. Sysmon 14 is a <strong>key rename</strong>, which attackers use to disguise a change (rename a key so a guard looks at the old path). Sysmon 1 is <strong>process creation</strong> — the writer’s identity card. Sysmon 3 is a <strong>network connection</strong>: useful in other detections, but not part of this strategy’s two data components.</p>',
    h:'Two codes are registry events, one is a process event, one is a network event.' },

  { t:'fill', multiEl:true,
    s:{sum:'You are drafting the intel summary line for ticket #51208. Fill the gaps.',
       blocks:[{label:'ARTEFACT 1 — Draft sentence', kind:'text',
         body:['FIN-WS-22: powershell.exe modified an HKCU Run value at 02:40:12 (Sysmon EventCode=____(1)____); the correlated process creation event (Sysmon EventCode=____(2)____) used an encoded command. Behaviour matches analytic ____(3)____ for technique ____(4)____.']}]},
    q:'Complete the summary with the two event codes, the analytic ID and the technique ID.',
    parts:['powershell.exe modified an HKCU Run value (Sysmon EventCode=',{b:0},'); the correlated process creation event (Sysmon EventCode=',{b:1},') used an encoded command. Behaviour matches analytic ',{b:2},' for technique ',{b:3},'.'],
    bank:['13','1','AN0781','T1112','T1059','DET0280'],
    x:'<p>The registry write is <strong>EventCode=13</strong>, the process creation is <strong>EventCode=1</strong>, the analytic on the DET0280 page is <strong>AN0781</strong>, and the technique it detects is <strong>T1112 — Modify Registry</strong>. T1059 is the scripting technique (real, but not the one this strategy detects), and DET0280 is the strategy, not the technique — the sentence needs the analytic ID there. Writing summaries with exact IDs like this is the daily paperwork of a CTI or SOC analyst.</p>',
    h:'Two numbers, one AN, one T. T1059 is the trap — it is the scripting technique, not the registry one.' },

  { t:'qcm', multiEl:false,
    s:{sum:'TimeWindow maths on the whiteboard: the element is set to 5 minutes.',
       blocks:[{label:'ARTEFACT 1 — Two timestamps', kind:'log', lines:[
         '03:14:07  EventCode=13  TargetObject: HKLM\\…\\Run\\Sync  Image: …\\reg.exe',
         '03:22:30  EventCode=1   Image: …\\svchost.exe -k netsvcs (service restart)']}]},
    q:'The TimeWindow is 5 minutes. Does the “nearby execution” part of the chain apply here?',
    opts:[['No — the service restart is more than 5 minutes after the write',1],['Yes — both events happened during the same night',0],['Yes — a service restart always matches, whatever the time',0],['No — because reg.exe is in the allowlist',0]],
    x:'<p>The write is at 03:14:07 and the service restart at 03:22:30 — that is <strong>8 minutes 23 seconds</strong> apart, outside the 5-minute TimeWindow. The correlation element links only events that are close in time, so this restart does not complete the chain (the write itself can still be suspicious on its own). “Same night” is far too loose, and the allowlist question is irrelevant here — reg.exe is not on the list anyway.</p>',
    h:'Subtract the timestamps and compare with 5 minutes.' },

  { t:'log', multiEl:false,
    s:{sum:'A colleague’s first draft of the DET0280 logic contains one clear mistake. Find it.',
       blocks:[{label:'ARTEFACT 1 — Draft pseudo-rule (detection engineering review)', kind:'log', lines:[
         'RULE registry_persistence_dryrun  SOURCE WinEventLog:Sysmon',
         '  IF EventCode=1 AND Image ENDSWITH "powershell.exe" THEN mark candidate_writer',
         '  IF EventCode=1 AND CommandLine CONTAINS "-enc" THEN mark encoded_writer',
         '  IF EventCode=11 THEN mark registry_modified          -- registry watcher',
         '  IF EventCode=13 THEN mark registry_modified',
         '  IF registry_modified AND candidate_writer WITHIN TimeWindow THEN alert DET0280-chain']}]},
    q:'Click the rule line that would break the registry detection.',
    lines:[
      'RULE registry_persistence_dryrun  SOURCE WinEventLog:Sysmon',
      '  IF EventCode=1 AND Image ENDSWITH "powershell.exe" THEN mark candidate_writer',
      '  IF EventCode=1 AND CommandLine CONTAINS "-enc" THEN mark encoded_writer',
      '  IF EventCode=11 THEN mark registry_modified          -- registry watcher',
      '  IF EventCode=13 THEN mark registry_modified',
      '  IF registry_modified AND candidate_writer WITHIN TimeWindow THEN alert DET0280-chain'],
    target:3, targetText:'Line 4 — EventCode=11 is a file stream event, not a registry event',
    x:'<p>Line 4 is the bug: Sysmon <strong>EventCode=11 is FileCreate</strong> (a file was created), and EventCode=15 is the stream-hash event — neither is a registry event. The writer logic (EventCode=1) and the registry logic (EventCode=13) in the other lines are correct, and the final correlation matches the DET0280 idea. A rule built like this would flag file writes instead of registry writes, so the whole chain would misfire. Reading event codes precisely is half of detection engineering.</p>',
    h:'One line uses an event code that belongs to files, not to the registry.' }
];

var $ = function(sel){ return document.querySelector(sel); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtTime(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* scoring: max(0,(H-W)/N) */
function scoreExercise(H, W, N){ if (N <= 0) return 0; return Math.max(0, (H - W) / N); }

/* ---------- log syntax highlight ---------- */
var HL_RX = /(EventCode\s*=\s*\d+)|(EventID\s*=\s*\d+)|(\b\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?\b)|(\b\d{2}:\d{2}:\d{2}\b)|((?:HKLM|HKCU|HKU|HKCR)\\[^\s",;)]*)|("(?:[^"\\]|\\.)*")|(\b(?:reg\.exe|reg\.add|regedit(?:\.exe)?|powershell(?:\.exe)?|pwsh|cmd\.exe|wmic(?:\.exe)?|msiexec(?:\.exe)?|rundll32(?:\.exe)?|svchost(?:\.exe)?|winword(?:\.exe)?|excel(?:\.exe)?|outlook(?:\.exe)?|explorer\.exe|schtasks(?:\.exe)?|sc\.exe|psexec|wscript(?:\.exe)?|cscript(?:\.exe)?|mshta(?:\.exe)?|Set-ItemProperty|New-ItemProperty|Remove-ItemProperty|Invoke-CimMethod|Register-ScheduledTask)\b)|(\b(?:TargetObject|Details|EventType|Image|ParentImage|ProcessGuid|ProcessId|CommandLine|User|UtcTime|Hashes|Company|Signature|Signed|EventRecordID|Computer|Channel|ServiceName|ImagePath|QueryName|DestinationHostname|SourceIp|LogonId|IntegrityLevel|ParentProcessGuid|Product)\b(?=\s*:))/gi;
function hlLine(raw){
  var out = '', last = 0, m;
  HL_RX.lastIndex = 0;
  while ((m = HL_RX.exec(raw)) !== null){
    out += esc(raw.slice(last, m.index));
    var tok = m[0], cls = 'hl-op';
    if (m[1] || m[2]) cls = 'hl-ev';
    else if (m[3] || m[4]) cls = 'hl-ts';
    else if (m[5]) cls = 'hl-reg';
    else if (m[6]) cls = 'hl-str';
    else if (m[7]) cls = 'hl-op';
    else if (m[8]) cls = 'hl-fn';
    out += '<span class="' + cls + '">' + esc(tok) + '</span>';
    last = m.index + tok.length;
  }
  out += esc(raw.slice(last));
  return out;
}
function logLineHtml(raw, ln){ return '<span class="ln">' + ln + '</span><span class="lt">' + hlLine(raw) + '</span>'; }

/* ---------- artefact & scenario rendering ---------- */
function renderBlock(blk){
  var a = el('div', 'artefact');
  a.appendChild(el('h4', null, esc(blk.label)));
  var body = el('div', 'a-body');
  if (blk.kind === 'text'){
    var paras = Array.isArray(blk.body) ? blk.body : [blk.body];
    paras.forEach(function(p){ var pe = el('p'); pe.innerHTML = p; body.appendChild(pe); });
  } else if (blk.kind === 'log'){
    var lg = el('div', 'logview');
    var lines = el('div', 'loglines');
    blk.lines.forEach(function(L, i){
      var row = el('div', 'logline static');
      row.innerHTML = logLineHtml(L, i + 1);
      lines.appendChild(row);
    });
    lg.appendChild(lines);
    body.appendChild(lg);
  } else if (blk.kind === 'table'){
    var t = el('table', 't');
    (blk.rows || []).forEach(function(r, ri){
      var tr = el('tr');
      r.forEach(function(c, ci){
        var cell = el(ri === 0 && blk.header !== false ? 'th' : 'td');
        cell.innerHTML = ci > 0 && ri > 0 ? c : esc(c);
        tr.appendChild(cell);
      });
      t.appendChild(tr);
    });
    body.appendChild(t);
  }
  a.appendChild(body);
  return a;
}
function renderScenario(ex){
  var blk = el('div', 'blk scenario');
  blk.appendChild(el('h3', null, '<span aria-hidden="true">🕵️</span> Scenario'));
  var body = el('div', 'blk-body');

  (ex.s.blocks || []).forEach(function(b){ body.appendChild(renderBlock(b)); });
  blk.appendChild(body);
  return blk;
}
function collapser(blkEl, summaryText){
  var head = blkEl.querySelector('h3');
  var btn = el('button', 'btn ghost small', '⌃ Collapse');
  btn.style.marginLeft = 'auto'; btn.style.minHeight = '30px'; btn.setAttribute('aria-expanded', 'true');
  var sum = el('span', 'small-note', esc(summaryText));
  sum.style.display = 'none'; sum.style.marginLeft = 'auto';
  head.appendChild(btn);
  var bodyEl = blkEl.querySelector('.blk-body');
  btn.addEventListener('click', function(){
    var open = bodyEl.style.display !== 'none';
    bodyEl.style.display = open ? 'none' : '';

    btn.setAttribute('aria-expanded', String(!open));
    sum.style.display = open ? 'inline' : 'none';

}

/* ---------- widget state ---------- */
function anyAnswer(ex, st){
  var d = st.data;
  switch (ex.t){
    case 'qcm': case 'qmul': return d.sel && d.sel.length > 0;
    case 'match': return d.pairs && Object.keys(d.pairs).length > 0;
    case 'drop': return d.placed && Object.keys(d.placed).length > 0;
    case 'order': case 'rank': return d.order && d.order.length > 0 && !sameOrder(d.order, d.shuffled);
    case 'fill': return d.slotVals && d.slotVals.some(function(x){ return x !== undefined && x !== null; });
    case 'log': return d.pick !== undefined && d.pick !== null;
    case 'branch': return (d.choices || []).length > 0;
    case 'term': return !!(d.cmd && d.cmd.trim().length > 0);
  }
  return false;
}
function sameOrder(a, b){ if (!a || !b || a.length !== b.length) return false; for (var i = 0; i < a.length; i++){ if (a[i] !== b[i]) return false; } return true; }

/* ---------- timer state machine ---------- */
var Timer = {
  set: function(state){
    S.timer.state = state;
    if (state === 'PAUSED_MANUAL' || state === 'PAUSED_AUTO_CHECK') S.timer.pauseStart = Date.now();
    renderExamBar();
  },
  start: function(){
    S.timer.remaining = TIMER_BUDGET;
    Timer.set('RUNNING');
    clearInterval(S.timer.int);
    S.timer.int = setInterval(Timer.tick, 1000);
    renderExamBar();   /* show the full budget first; the first tick fires one second later */
  },
  tick: function(){
    if (S.timer.state !== 'RUNNING') return;
    S.timer.remaining--;
    if (S.timer.remaining <= 0){ S.timer.remaining = 0; Timer.end(); return; }
    var tEl = $('#timerdisp');
    if (tEl) tEl.textContent = fmtTime(S.timer.remaining);
  },
  resumeFromAuto: function(){
    if (S.timer.state !== 'PAUSED_AUTO_CHECK') return;
    S.timer.autoTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
    Timer.set('RUNNING');
  },
  resumeFromManual: function(){
    if (S.timer.state !== 'PAUSED_MANUAL') return;
    S.timer.manualTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
    /* return to the state before manual pause: auto-check if feedback open, else running */
    var backToAuto = S.cur && S.cur.feedbackOpen;
    Timer.set(backToAuto ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    closePauseOverlay();
  },
  end: function(){
    clearInterval(S.timer.int);
    Timer.set('ENDED');
    finalizeExam(true);
  },
  stop: function(){ clearInterval(S.timer.int); }
};

    '<button class="btn small" id="btnpause">⏸ Pause</button>' +

function updateProgress(){
  var total = S.queue.length;
  var done = Object.keys(S.answered).length + Object.keys(S.skipped).length;
  var pctg = total ? Math.round(done / total * 100) : 0;
  $('#progressfill').style.width = pctg + '%';
}
function curKey(){ return S.queue[S.idx] ? S.queue[S.idx].i : -1; }
function updateScore(){

  var sEl = $('#livescore');
  if (sEl) sEl.innerHTML = '<span>' + S.creditSum.toFixed(1) + '</span><small>/ ' + S.answeredCount + ' (' + pct + '%)</small>';

/* ---------- manual pause overlay ---------- */
function onPauseManual(){
  if (S.timer.state === 'ENDED') return;
  /* bank the auto-check time accumulated before the manual pause, so the
     results screen logs the full time spent in each pause state */
  if (S.timer.state === 'PAUSED_AUTO_CHECK'){
    S.timer.autoTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  }
  Timer.set('PAUSED_MANUAL');
  var ov = el('div', 'pauseoverlay');
  ov.id = 'pauseov';
  ov.innerHTML = '<div class="big">⏸ PAUSED — manual</div>' +
    '<p class="small-note">The exercise is hidden while you take a break. The timer is stopped.</p>' +
    '<button class="btn primary" id="btnresume">▶ Resume</button>';
  $('#overlayhost').appendChild(ov);
  $('#btnresume').onclick = Timer.resumeFromManual;
}
function closePauseOverlay(){ var ov = $('#pauseov'); if (ov) ov.parentNode.removeChild(ov); }

/* --- qcm / qmul --- */
function wQCM(ex, st, multi){
  var d = st.data; if (!d.sel) d.sel = [];
  if (!d.shuffledOpts) d.shuffledOpts = shuffle(ex.opts.map(function(o, i){ return { t: o[0], ok: o[1] === 1, i: i }; }));
  var wrap = el('div', 'opts');
  wrap.setAttribute('role', multi ? 'group' : 'radiogroup');
  wrap.setAttribute('aria-label', 'Answer options');
  var letters = 'ABCDEFGH';
  d.shuffledOpts.forEach(function(o, oi){
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="key">' + letters[oi] + '.</span><span class="txt">' + esc(o.t) + '</span><span class="sel-tag" hidden>● Selected</span>';
    b.onclick = function(){
      if (st.locked) return;
      if (!multi){ d.sel = [oi]; }
      else {
        var at = d.sel.indexOf(oi);
        if (at >= 0) d.sel.splice(at, 1); else d.sel.push(oi);
      }
      Array.prototype.forEach.call(wrap.children, function(c, ci){
        var on = d.sel.indexOf(ci) >= 0;
        c.setAttribute('aria-pressed', String(on));
        c.querySelector('.sel-tag').hidden = !on;
      });
      $('#btncheck').disabled = d.sel.length === 0;
    };
    wrap.appendChild(b);
  });
  return wrap;
}
function gQCM(ex, st, multi){
  var sel = st.data.sel, sh = st.data.shuffledOpts;
  var N = multi ? sh.filter(function(o){ return o.ok; }).length : 1;
  var H = 0, W = 0, items = [];
  sh.forEach(function(o, oi){
    var wasSel = sel.indexOf(oi) >= 0;
    if (multi){
      if (o.ok && wasSel){ H++; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W++; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok && !wasSel){ items.push({ label: o.t, status: 'missed' }); }
    } else {
      if (o.ok && wasSel){ H = 1; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W = 1; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok){ items.push({ label: o.t, status: 'missed' }); }
    }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- match --- */
function wMatch(ex, st){
  var d = st.data; if (!d.pairs) d.pairs = {};
  if (!d.shuffledRights) d.shuffledRights = shuffle(ex.pairs.map(function(p, i){ return { t: p[1], i: i }; }));
  var rights = d.shuffledRights;
  var wrap = el('div', 'match');
  var leftCol = el('div', 'mcol'), rightCol = el('div', 'mcol');
  var pickedLeft = null;
  var rightsByI = {};
  rights.forEach(function(r){ rightsByI[r.i] = r; });
  ex.pairs.forEach(function(p, i){
    var b = el('button', 'mitem'); b.type = 'button';
    b.innerHTML = '<span class="pairno"></span> ' + esc(p[0]);
    b.setAttribute('aria-label', 'Item: ' + p[0]);
    b.onclick = function(){
      if (st.locked) return;
      Array.prototype.forEach.call(leftCol.children, function(c){ c.classList.remove('picked'); });
      pickedLeft = i; b.classList.add('picked');
    };
    leftCol.appendChild(b);
  });
  rights.forEach(function(r){
    var b = el('button', 'mitem'); b.type = 'button';
    b.innerHTML = esc(r.t);
    b.setAttribute('aria-label', 'Match option: ' + r.t);
    b.onclick = function(){
      if (st.locked || pickedLeft === null) return;
      for (var k in d.pairs){ if (d.pairs[k] === r.i) delete d.pairs[k]; }
      d.pairs[pickedLeft] = r.i;
      pickedLeft = null;
      refresh();
    };
    rightCol.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(leftCol.children, function(c, ci){
      c.classList.remove('picked');
      var pid = d.pairs[ci];
      c.querySelector('.pairno').textContent = pid === undefined ? '— unpaired' : '✓ → ' + rightsByI[pid].t;
    });
    $('#btncheck').disabled = Object.keys(d.pairs).length === 0;
  }
  refresh();
  wrap.appendChild(leftCol); wrap.appendChild(rightCol);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Click an item on the left, then click its partner on the right. Click again to change.'));
  return holder;
}
function gMatch(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.pairs.length, items = [];
  ex.pairs.forEach(function(p, i){
    var chosen = d.pairs[i];
    if (chosen === undefined) items.push({ label: p[0] + ' → ' + p[1], status: 'missed' });
    else if (chosen === i){ H++; items.push({ label: p[0] + ' → ' + p[1], status: 'correct' }); }
    else { W++; items.push({ label: p[0] + ' → ' + ex.pairs[chosen][1] + ' (wrong partner)', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- drop --- */
function wDrop(ex, st){
  var d = st.data; if (!d.placed) d.placed = {};
  if (!d.shuffledItems) d.shuffledItems = shuffle(ex.items.map(function(it, i){ return { t: it[0], z: it[1], i: i }; }));
  var items = d.shuffledItems;
  var single = ex.zones.length < 2;
  var wrap = el('div', 'dropwrap' + (single ? ' single' : ''));
  var bank = el('div', 'bank');
  bank.setAttribute('role', 'group'); bank.setAttribute('aria-label', 'Item bank');
  var zones = el('div', 'zones');
  var zoneEls = [];
  ex.zones.forEach(function(z, zi){
    var zEl = el('div', 'zone');
    zEl.appendChild(el('h4', null, '<span aria-hidden="true">🗂</span> ' + esc(z)));
    var slot = el('div', 'zslot'); slot.dataset.z = zi;
    zEl.appendChild(slot);
    zones.appendChild(zEl); zoneEls.push(slot);
  });
  function chipEl(it){
    var c = el('button', 'chip'); c.type = 'button';
    c.innerHTML = '<span aria-hidden="true">⬚</span> ' + esc(it.t);
    c.setAttribute('aria-label', 'Item: ' + it.t);
    c.onclick = function(){
      if (st.locked) return;
      var was = c.classList.contains('picked');
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      if (was){ d.picked = null; return; }
      c.classList.add('picked'); d.picked = it.i;
    };
    c.addEventListener('pointerdown', function(ev){
      if (st.locked) return;
      ev.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      c.classList.add('picked'); d.picked = it.i;
      var g = el('div', 'chip dragghost', c.innerHTML); document.body.appendChild(g);
      function mv(e){ g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
      function up(e){
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
        var t = document.elementFromPoint(e.clientX, e.clientY);
        var zslot = t && t.closest ? t.closest('.zslot') : null;
        if (zslot && !st.locked) place(it.i, parseInt(zslot.dataset.z, 10));
        if (g.parentNode) g.parentNode.removeChild(g);
      }
      mv(ev);
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
    });
    return c;
  }
  function place(ii, zi){ d.placed[ii] = zi; d.picked = null; refresh(); }
  function refresh(){
    bank.innerHTML = '';
    items.forEach(function(it){ if (d.placed[it.i] === undefined) bank.appendChild(chipEl(it)); });
    if (!bank.children.length) bank.innerHTML = '<span class="small-note">All items placed — click a placed item to return it.</span>';
    zoneEls.forEach(function(slot, zi){
      slot.innerHTML = '';
      items.forEach(function(it){
        if (d.placed[it.i] === zi){
          var c = chipEl(it);
          c.onclick = function(){ if (!st.locked){ delete d.placed[it.i]; d.picked = null; refresh(); } };
          slot.appendChild(c);
        }
      });
    });
    $('#btncheck').disabled = Object.keys(d.placed).length === 0;
  }
  refresh();
  wrap.appendChild(bank); wrap.appendChild(zones);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Drag an item into a zone, or click the item and then click a zone. Click a placed item to send it back.'));
  return holder;
}
function gDrop(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  ex.items.forEach(function(it, i){
    var placedAt = d.placed[i];
    if (placedAt === undefined) items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'missed' });
    else if (placedAt === it[1]){ H++; items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'correct' }); }
    else { W++; items.push({ label: it[0] + ' → ' + ex.zones[placedAt] + ' (wrong zone)', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- order / rank --- */
function wOrder(ex, st, isRank){
  var d = st.data;
  if (!d.shuffled) d.shuffled = shuffle(ex.items.map(function(t, i){ return { t: t, i: i }; }));
  if (!d.order) d.order = d.shuffled.slice();
  var list = el('div', 'orderlist');
  list.setAttribute('aria-label', isRank ? 'Priority list' : 'Ordered list');
  function render(){
    list.innerHTML = '';
    d.order.forEach(function(it, pos){
      var row = el('div', 'orow');
      row.setAttribute('aria-label', 'Position ' + (pos + 1) + ': ' + it.t);
      row.innerHTML = '<span class="rank">' + (isRank ? '#' : (pos + 1) + '.') + '</span><span class="txt">' + esc(it.t) + '</span>';
      var mv = el('span', 'mv');
      var up = el('button', 'btn small', '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
      var dn = el('button', 'btn small', '↓'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
      up.disabled = pos === 0; dn.disabled = pos === d.order.length - 1;
      up.onclick = function(){ if (st.locked) return; var t = d.order[pos - 1]; d.order[pos - 1] = d.order[pos]; d.order[pos] = t; render(); };
      dn.onclick = function(){ if (st.locked) return; var t = d.order[pos + 1]; d.order[pos + 1] = d.order[pos]; d.order[pos] = t; render(); };
      mv.appendChild(up); mv.appendChild(dn);
      row.appendChild(mv);
      row.addEventListener('pointerdown', function(ev){
        if (st.locked || (ev.target.closest && ev.target.closest('button'))) return;
        ev.preventDefault();
        var g = el('div', 'chip dragghost', esc(it.t)); document.body.appendChild(g);
        function mv2(e){
          g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
          var rows = Array.prototype.slice.call(list.children);
          var idx = rows.length;
          for (var ri = 0; ri < rows.length; ri++){ var b = rows[ri].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2){ idx = ri; break; } }
          var from = d.order.indexOf(it);
          if (idx > from) idx--;
          if (idx !== from && idx >= 0){ d.order.splice(from, 1); d.order.splice(idx, 0, it); render(); }
        }
        function up2(){ document.removeEventListener('pointermove', mv2); document.removeEventListener('pointerup', up2); if (g.parentNode) g.parentNode.removeChild(g); }
        mv2(ev);
        document.addEventListener('pointermove', mv2);
        document.addEventListener('pointerup', up2);
      });
      list.appendChild(row);
    });
    $('#btncheck').disabled = sameOrder(d.order, d.shuffled);
  }
  render();
  var holder = el('div');
  holder.appendChild(list);
  holder.appendChild(el('p', 'mhint', (isRank ? 'Rank from most urgent (top) to least urgent (bottom). ' : 'Put the steps in the correct order. ') + 'Use drag or the ↑ ↓ buttons.'));
  return holder;
}
function gOrder(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  d.order.forEach(function(it, pos){
    if (it.i === pos){ H++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t, status: 'correct' }); }
    else { W++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t + ' — correct here: ' + ex.items[pos], status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- fill (word bank → blanks); parts: string | {b: bankIndex} --- */
function wFill(ex, st){
  var d = st.data;
  if (!d.slotVals) d.slotVals = ex.parts.filter(function(p){ return typeof p === 'object'; }).map(function(){ return null; });
  if (!d.shuffledBank) d.shuffledBank = shuffle(ex.bank.map(function(w, i){ return { w: w, i: i }; }));
  var bank = d.shuffledBank;
  var wrap = el('div');
  var textEl = el('p', 'filltext');
  var slots = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p === 'string'){
      var sp = el('span'); sp.textContent = p; textEl.appendChild(sp);
    } else {
      var si = slotIdx++;
      var s = el('button', 'slot'); s.type = 'button';
      s.textContent = '___';
      s.setAttribute('aria-label', 'Blank ' + (si + 1) + ', choose a word');
      s.onclick = function(){
        if (st.locked) return;
        if (d.slotVals[si] !== null && d.picked == null){ d.slotVals[si] = null; render(); return; }
        if (d.picked != null){
          for (var k = 0; k < d.slotVals.length; k++){ if (d.slotVals[k] === d.picked) d.slotVals[k] = null; }
          d.slotVals[si] = d.picked; d.picked = null; render();
        }
      };
      slots[si] = s; textEl.appendChild(s);
    }
  });
  var bankRow = el('div', 'bankrow');
  bankRow.setAttribute('role', 'group'); bankRow.setAttribute('aria-label', 'Word bank');
  function render(){
    slots.forEach(function(s, si){
      var v = d.slotVals[si];
      if (v == null){ s.textContent = '___'; s.classList.remove('filled'); }
      else { s.textContent = bank[v].w; s.classList.add('filled'); }
    });
    bankRow.innerHTML = '';
    bank.forEach(function(b, bi){
      if (d.slotVals.indexOf(bi) >= 0) return;
      var c = el('button', 'chip'); c.type = 'button'; c.textContent = b.w;
      c.setAttribute('aria-label', 'Word: ' + b.w);
      c.onclick = function(){
        if (st.locked) return;
        var was = c.classList.contains('picked');
        Array.prototype.forEach.call(bankRow.children, function(x){ x.classList.remove('picked'); });
        if (was){ d.picked = null; return; }
        c.classList.add('picked'); d.picked = bi;
      };
      bankRow.appendChild(c);
    });
    $('#btncheck').disabled = d.slotVals.every(function(x){ return x == null; });
  }
  render();
  wrap.appendChild(textEl); wrap.appendChild(bankRow);
  wrap.appendChild(el('p', 'mhint', 'Click a word, then click a blank. Click a filled blank to empty it. Distractor words do not belong anywhere.'));
  return wrap;
}
function gFill(ex, st){
  var d = st.data, H = 0, W = 0, N = 0, items = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p !== 'object') return;
    var si = slotIdx++; N++;
    var expected = ex.bank[p.b];
    var chosen = d.slotVals[si];
    if (chosen == null) items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'missed' });
    else if (d.shuffledBank[chosen].i === p.b){ H++; items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'correct' }); }
    else { W++; items.push({ label: 'Blank ' + N + ': placed "' + d.shuffledBank[chosen].w + '" (correct: ' + expected + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- log viewer (click a line, or click a line then a field) --- */
function wLog(ex, st){
  var d = st.data; if (d.pick === undefined) d.pick = null;
  var wrap = el('div');
  var lv = el('div', 'logview');
  var bar = el('div', 'logbar');

  var linesEl = el('div', 'loglines');

  ex.lines.forEach(function(L, i){
    var b = el('button', 'logline'); b.type = 'button';
    b.innerHTML = logLineHtml(L, i + 1);
    b.setAttribute('aria-label', 'Log line ' + (i + 1) + ': ' + L);
    b.dataset.raw = L;
    b.onclick = function(){

}
function gLog(ex, st){
  var ok = st.data.pick === ex.target;
  return { H: ok ? 1 : 0, W: ok ? 0 : 1, N: 1,
    items: [{ label: ex.targetText || ('Line ' + (ex.target + 1)), status: ok ? 'correct' : 'wrong' }] };
}

/* --- branch (decision tree; graded on final step) --- */
function wBranch(ex, st){
  var d = st.data;
  if (!d.choices) d.choices = [];
  var wrap = el('div');
  var stepHost = el('div');
  wrap.appendChild(stepHost);
  var stepNote = el('p', 'mhint', '');
  wrap.appendChild(stepNote);
  function renderStep(){
    var si = d.choices.length;
    if (si >= ex.steps.length) return;
    var step = ex.steps[si];
    stepHost.innerHTML = '';
    var tag = el('p', 'small-note', 'STEP ' + (si + 1) + ' OF ' + ex.steps.length);
    tag.style.fontWeight = '700';
    stepHost.appendChild(tag);
    stepHost.appendChild(el('p', null, '<strong>' + esc(step.q) + '</strong>'));
    var opts = el('div', 'opts');
    var letters = 'ABCD';
    shuffle(step.opts).forEach(function(o, oi){
      var b = el('button', 'opt'); b.type = 'button';
      b.innerHTML = '<span class="key">' + letters[oi] + '.</span><span class="txt">' + esc(o[0]) + '</span>';
      b.onclick = function(){
        d.choices.push(o[0]);
        renderStep();
      };
      opts.appendChild(b);
    });
    stepHost.appendChild(opts);
    stepNote.textContent = si === 0
      ? 'Intermediate steps do not pause the timer and do not reveal right or wrong. Only the final step is graded.'
      : 'The timer keeps running between steps.';
  }
  renderStep();
  return wrap;
}
function wBranchReady(ex, st){ return st.data.choices.length >= ex.steps.length; }
function gBranch(ex, st){
  var H = 0, W = 0, N = ex.steps.length, items = [];
  ex.steps.forEach(function(step, i){
    var chosen = st.data.choices[i];
    var correct = step.opts.filter(function(o){ return o[1] === 1; })[0][0];
    if (chosen === correct){ H++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen, status: 'correct' }); }
    else { W++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen + ' (better: ' + correct + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- terminal (query editor) --- */
function wTerm(ex, st){
  var d = st.data;
  var wrap = el('div', 'term');
  wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Query editor (simulation only)');
  var head = el('div', 'thead', '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> ' + esc(ex.env || 'query editor — simulation only, nothing is executed'));
  var body = el('div', 'tbody');
  var line = el('div', 'promptline');
  line.appendChild(el('span', 'prompt', esc(ex.prompt || 'query>')));
  var inp = el('input'); inp.type = 'text'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Query input');
  inp.value = d.cmd || '';
  inp.addEventListener('input', function(){ d.cmd = inp.value; $('#btncheck').disabled = !d.cmd || !d.cmd.trim(); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !$('#btncheck').disabled){ e.preventDefault(); onCheck(); } });
  line.appendChild(inp);
  body.appendChild(line);
  var out = el('div', 'tout'); out.id = 'termout';
  out.textContent = d.ran ? '— press Check to grade your query —' : 'Waiting for your query…';
  body.appendChild(out);
  wrap.appendChild(head); wrap.appendChild(body);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Type the query into the editor, then press Check. Grading looks at the elements your query contains.'));
  setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 60);
  return holder;
}
function normQuery(q){
  return String(q || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/["']/g, '');
}
function gTerm(ex, st){
  var q = normQuery(st.data.cmd);
  var H = 0, W = 0, N = ex.elements.length, items = [];
  ex.elements.forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ H++; items.push({ label: 'Element: ' + e[1], status: 'correct' }); }
    else items.push({ label: 'Element: ' + e[1], status: 'missed' });
  });
  (ex.wrong || []).forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ W++; items.push({ label: 'Element: ' + e[1], status: 'wrong' }); }
  });
  var dangerous = (ex.dangerous || []).filter(function(e){ return new RegExp(e[0], 'i').test(q); }).map(function(e){ return e[1]; });
  return { H: H, W: W, N: N, items: items, dangerous: dangerous };
}

/* ================= EXERCISE FLOW ================= */
var GRADERS = {
  qcm: function(ex, st){ return gQCM(ex, st, false); },
  qmul: function(ex, st){ return gQCM(ex, st, true); },
  match: gMatch, drop: gDrop, order: gOrder, rank: gOrder, fill: gFill, log: gLog,
  branch: gBranch, term: gTerm
};
var RENDERERS = {
  qcm: function(ex, st){ return wQCM(ex, st, false); },
  qmul: function(ex, st){ return wQCM(ex, st, true); },
  match: wMatch, drop: wDrop, order: function(ex, st){ return wOrder(ex, st, false); },
  rank: function(ex, st){ return wOrder(ex, st, true); },
  fill: wFill, log: wLog, branch: wBranch, term: wTerm
};
var TYPE_LABELS = { qcm: 'Multiple choice', qmul: 'Multiple select', match: 'Matching', drop: 'Drag & drop',
  order: 'Ordering', rank: 'Prioritising', fill: 'Fill the blanks', log: 'Log analysis', branch: 'Decision tree', term: 'Query editor' };

function isBranchReady(ex, st){ return ex.t === 'branch' ? wBranchReady(ex, st) : true; }

function renderExercise(){
  var ex = EXERCISES[S.queue[S.idx].i];
  S.cur = { ex: ex, st: { data: {}, locked: false }, feedbackOpen: false };
  var host = $('#exercisehost');
  host.innerHTML = '';
  host.appendChild(el('p', 'small-note', 'Exercise type: ' + TYPE_LABELS[ex.t] + (ex.multiEl ? ' · multi-item, scored with partial credit' : '')));
  var sc = renderScenario(ex);
  if (ex.s.sum) collapser(sc, ex.s.sum);
  host.appendChild(sc);
  host.appendChild(renderQuestion(ex));
  host.appendChild(answerShell());
  /* widget is built after the shell is mounted so it can reach #btncheck */
  var widget = RENDERERS[ex.t](ex, S.cur.st);
  $('#widgetslot').appendChild(widget);
  $('#btncheck').onclick = onCheck;
  /* branch: enable check only when all steps answered */
  if (ex.t === 'branch'){
    var poll = setInterval(function(){
      var b = $('#btncheck');
      if (!b || !S.cur || S.cur.ex !== ex){ clearInterval(poll); return; }
      b.disabled = !wBranchReady(ex, S.cur.st) || S.cur.st.locked;
    }, 300);
  }
  renderExamBar();
  var fb = $('#fbhost'); if (fb) fb.remove();
}

function onCheck(){
  if (!S.cur || S.cur.st.locked) return;          /* already checked */
  if (S.answered[curKey()]) return;               /* double-fire guard */
  if (S.timer.state === 'ENDED') return;          /* time is over */
  var ex = S.cur.ex, st = S.cur.st;
  if (!anyAnswer(ex, st) || (ex.t === 'branch' && !wBranchReady(ex, st))) return;
  /* 1. timer: Check-triggered auto-pause FIRST (spec) */
  if (S.timer.state === 'RUNNING') Timer.set('PAUSED_AUTO_CHECK');
  /* 2. grade */
  st.locked = true;
  var g = GRADERS[ex.t](ex, st);
  var credit = scoreExercise(g.H, g.W, g.N);
  if (S.hintUsed[curKey()]) credit = Math.max(0, credit - 0.10);
  var k = curKey();
  S.answered[k] = true;
  S.credits[k] = credit;
  S.creditSum += credit; S.answeredCount++;
  renderFeedback(ex, g, credit);
  if (ex.t === 'term'){
    var ti = document.querySelector('#widgetslot input');
    if (ti) ti.disabled = true;
  }
  updateScore(); updateProgress(); renderExamBar();
  S.cur.feedbackOpen = true;
  $('#btncheck').disabled = true;
  var fb = $('#fbblk'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function optRow(label, status, clsOverride){
  var map = { correct: ['✓', 'Correct', 'st-correct'], wrong: ['✗', 'Wrong', 'st-wrong'], missed: ['○', 'Missed', 'st-missed'], info: ['ℹ', 'Note', 'st-info'] };
  var m = map[status] || map.info;
  var r = el('div', 'irow ' + (clsOverride || m[2]));
  r.innerHTML = '<span class="st" aria-label="' + m[1] + '"><span aria-hidden="true">' + m[0] + '</span><span class="word">' + m[1] + '</span></span><span>' + label + '</span>';
  return r;
}

function renderFeedback(ex, g, credit){
  var host = $('#exercisehost');
  var fb = el('div', 'blk feedback');
  fb.id = 'fbblk';
  var full = credit >= 0.999, zero = credit <= 0.001;
  var cls = full ? '' : (zero ? ' f-incorrect' : ' f-partial');
  fb.className = 'blk feedback' + cls;
  var label = full ? 'CORRECT' : (zero ? 'INCORRECT' : 'PARTIALLY CORRECT');
  var icon = full ? '✓' : (zero ? '✗' : '✓');
  var creditLine = 'credit ' + credit.toFixed(2) + ' — ' + g.H + '/' + g.N + ' items' +
    (S.hintUsed[curKey()] ? ' · includes −0.10 hint penalty' : '');
  fb.appendChild(el('h3', null, '<span aria-hidden="true">' + icon + '</span> ' + label +

        document.body.appendChild(ta); ta.select();

    };
    body.appendChild(el('p', null, '<strong>Canonical query:</strong>'));
    body.appendChild(cb);
    if (ex.out){
      var ob = el('div', 'codeblock'); ob.textContent = ex.out;

  /* correct answer statement for single-answer types */
  if ((ex.t === 'qcm' || ex.t === 'log') && !full){
    var corr = ex.t === 'qcm' ? ex.opts.filter(function(o){ return o[1] === 1; }).map(function(o){ return o[0]; }).join(', ') : (ex.targetText || ('line ' + (ex.target + 1)));

  nxt.onclick = onNext;
  nav.appendChild(nxt);
  var autoNote = el('span', 'badge state-paused', '<span aria-hidden="true">⏸</span> Timer paused — reviewing feedback. It resumes when you press ' + (last ? 'Finish' : 'Next') + '.');
  nav.appendChild(autoNote);
  body.appendChild(nav);
  fb.appendChild(body);
  host.appendChild(fb);
}
function studyAnchor(ex){
  var map = { qcm: 'detection logic', qmul: 'detection logic', match: 'telemetry and log sources', drop: 'what the strategy watches',
    order: 'behaviour chain', rank: 'alert triage', fill: 'mutable elements', log: 'log sources', branch: 'alert triage', term: 'detection engineering' };
  return map[ex.t] || 'detection strategy';
}

function onNext(){
  Timer.resumeFromAuto();          /* PAUSED_AUTO_CHECK -> RUNNING (records duration) */
  /* advance to the next UNANSWERED exercise — after returning from the
     skipped pool, the next slot in the queue may already be answered */
  do { S.idx++; } while (S.idx < S.queue.length && S.answered[S.queue[S.idx].i]);
  if (S.idx >= S.queue.length){ openReviewSkipped(true); return; }
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onSkip(){
  if (S.answered[curKey()]) return;
  S.skipped[curKey()] = true;
  S.breakItems[curKey()] = true;
  if (S.idx >= S.queue.length - 1){ openReviewSkipped(true); return; }
  S.idx++;
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= REVIEW SKIPPED ================= */
function openReviewSkipped(fromFlow){
  Timer.resumeFromAuto();            /* never sit in the review pool while the auto-pause is active */
  if (S.cur) S.cur.feedbackOpen = false;
  var keys = Object.keys(S.skipped).filter(function(k){ return !S.answered[k]; });
  var host = $('#exercisehost');
  host.innerHTML = '';
  var blk = el('div', 'blk');
  blk.appendChild(el('h3', null, '<span aria-hidden="true">⚠</span> Review skipped exercises'));
  var body = el('div', 'blk-body');
  if (!keys.length){
    body.appendChild(el('p', null, 'No skipped exercises are waiting. You can submit your final results.'));
  } else {
    body.appendChild(el('p', null, 'These exercises were skipped without an answer. They are <strong>excluded from your score</strong> unless you answer them now. You can return to them as many times as you need while the timer is running.'));
    keys.forEach(function(k){
      var ex = EXERCISES[parseInt(k, 10)];
      var row = el('div', 'skipitem');
      row.innerHTML = '<span class="badge state-skipped"><span aria-hidden="true">⚠</span> Skipped</span><span class="sq">' + esc(ex.s.sum || ex.q) + '</span>';
      var canAnswer = S.timer.state !== 'ENDED';
      var btn = el('button', 'btn small primary', '↩ Answer this');
      btn.disabled = !canAnswer;
      btn.title = canAnswer ? 'Return to this exercise (timer keeps running)' : 'The timer has ended — this exercise stays excluded';
      btn.onclick = function(){
        S.idx = S.queue.findIndex(function(q){ return q.i === parseInt(k, 10); });
        delete S.skipped[k];
        Timer.resumeFromAuto();
        if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK' && S.timer.state !== 'ENDED') Timer.set('RUNNING');
        renderExercise();
        window.scrollTo({ top: 0 });
      };
      row.appendChild(btn);
      body.appendChild(row);
    });
  }
  var nav = el('div', 'startrow');
  var sub = el('button', 'btn primary', '⏹ Submit final results');
  sub.onclick = function(){ finalizeExam(false); };
  nav.appendChild(sub);
  var back = el('button', 'btn ghost', '◀ Back to exam');
  back.onclick = function(){
    if (S.timer.state === 'ENDED'){ finalizeExam(false); return; }
    var nextIdx = S.queue.findIndex(function(q){ return !S.answered[q.i]; });
    if (nextIdx === -1){ openReviewSkipped(true); return; }
    S.idx = nextIdx;
    renderExercise();
    window.scrollTo({ top: 0 });
  };
  nav.appendChild(back);
  body.appendChild(nav);
  blk.appendChild(body);
  host.appendChild(blk);
  window.scrollTo({ top: 0 });
  renderExamBar();
}

/* ================= RESULTS ================= */
function finalizeExam(auto){
  /* bank any open pause segment so both pause totals are complete */
  if (S.timer.state === 'PAUSED_MANUAL'){
    S.timer.manualTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  } else if (S.timer.state === 'PAUSED_AUTO_CHECK'){
    S.timer.autoTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  }
  Timer.stop();
  Timer.set('ENDED');
  /* never-answered exercises are excluded (skipped pool) */
  S.queue.forEach(function(q){ if (!S.answered[q.i]) S.skipped[q.i] = true; });
  var fully = 0, partial = 0, partialCredits = 0, incorrect = 0, skippedN = 0;
  Object.keys(S.answered).forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.999) fully++;
    else if (c > 0.001){ partial++; partialCredits += c; }
    else incorrect++;
  });
  Object.keys(S.skipped).forEach(function(k){ if (!S.answered[k]) skippedN++; });
  var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
  var passed = pct >= INTRO.passMark;
  var host = $('#view-results');
  host.innerHTML = '';
  var card = el('div', 'card intro-strip');
  card.appendChild(el('h2', null, esc(INTRO.objId) + ' — ' + esc(INTRO.sev) + ' exam results'));
  var panel = el('div', passed ? 'passpanel' : 'failpanel');
  panel.innerHTML = '<div class="t">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>' +
    '<div class="pct">' + pct + '%</div>' +
    '<p class="small-note">' + S.creditSum.toFixed(1) + ' credit points over ' + S.answeredCount + ' answered exercise' + (S.answeredCount === 1 ? '' : 's') +
    ' · pass mark ' + INTRO.passMark + '%' +
    (auto ? ' · time ran out — unanswered exercises were excluded' : '') + '</p>' +
    '<p>' + (passed
      ? 'Well done. You showed solid command of the ' + esc(INTRO.objId) + ' detection strategy at this level. Move on to the next severity when you feel ready.'
      : 'Not this time. Study the feedback you collected during the exam, then press Retake — the exercises will be shuffled.') + '</p>';
  card.appendChild(panel);
  var grid = el('div', 'resgrid');
  function rbox(num, lbl, cls){
    var b = el('div', 'resbox');
    b.innerHTML = '<div class="num">' + num + '</div><div class="lbl ' + (cls || '') + '">' + lbl + '</div>';
    return b;
  }
  grid.appendChild(rbox(fully, '<span aria-hidden="true">✓</span> Fully correct', 'state-correct'));
  grid.appendChild(rbox(partial + (partial ? ' <small>(avg ' + (partialCredits / partial).toFixed(2) + ')</small>' : ''), '<span aria-hidden="true">✓</span> Partially correct', 'state-partial'));
  grid.appendChild(rbox(incorrect, '<span aria-hidden="true">✗</span> Fully incorrect', 'state-incorrect'));
  grid.appendChild(rbox(skippedN + (skippedN ? ' <small>(excluded)</small>' : ''), '<span aria-hidden="true">⚠</span> Skipped — excluded', 'state-skipped'));
  card.appendChild(grid);
  card.appendChild(el('p', null, '<strong>Time</strong>: ' + fmtTime(TIMER_BUDGET - S.timer.remaining) + ' on the clock · ' +
    'paused ' + fmtTime(S.timer.manualTotal) + ' for manual breaks · paused ' + fmtTime(S.timer.autoTotal) + ' while reviewing feedback.'));
  var nav = el('div', 'startrow');
  var rt = el('button', 'btn primary', '↻ Retake exam');
  rt.onclick = retake;
  nav.appendChild(rt);
  card.appendChild(nav);
  host.appendChild(card);
  $('#view-exam').classList.add('hidden');
  $('#view-intro').classList.add('hidden');
  host.classList.remove('hidden');
  window.scrollTo({ top: 0 });
  reportScore(S.creditSum, S.answeredCount);
}

function retake(){
  S.queue = []; S.idx = 0; S.answered = {}; S.credits = {}; S.hintUsed = {}; S.skipped = {};
  S.creditSum = 0; S.answeredCount = 0; S.reported = false; S.cur = null;
  S.breakItems = {};
  S.timer.manualTotal = 0; S.timer.autoTotal = 0; S.timer.pauseStart = 0;
  $('#view-results').classList.add('hidden');
  $('#view-exam').classList.remove('hidden');
  startExam();
}

/* ================= SITE INTEGRATION ================= */
/* Receives the fractional sum and the answered count; rounding happens only
   here, once per attempt, and the on-screen percent uses the same formula. */
function reportScore(sum, count){
  if (S.reported) return;
  S.reported = true;
  var percent = count > 0 ? Math.round((sum / count) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: INTRO.topicId,
      batch: INTRO.batch,
      score: Math.round(sum),
      total: count,
      percent: percent,
      passed: percent >= INTRO.passMark
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user.username = event.data.username || '';
  S.user.country = event.data.country || '';
  S.user.locale = event.data.locale || '';
  S.user.topicId = event.data.topicId || '';
  S.user.batch = (typeof event.data.batch === 'number') ? event.data.batch : null;
  if (!$('#view-intro').classList.contains('hidden')) renderIntro();
});

/* ================= INTRO ================= */
function renderIntro(){
  var v = $('#view-intro');
  v.innerHTML = '';
  var strip = el('div', 'card intro-strip');
  strip.appendChild(el('h1', null, esc(INTRO.title)));
  strip.appendChild(el('p', 'objline', '<strong>' + esc(INTRO.objId) + ' — ' + esc(INTRO.objName) + '</strong> · MITRE ATT&CK ' + esc(INTRO.objType)));
  var row = el('div', 'badgerow');
  row.innerHTML =
    '<span class="badge sev"><span class="dot" aria-hidden="true"></span> ' + esc(INTRO.sev) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🧩</span> ' + INTRO.count + ' exercises</span>' +
    '<span class="badge"><span aria-hidden="true">⏱</span> Estimated time: ' + INTRO.minutes + ' min</span>' +
    '<span class="badge"><span aria-hidden="true">⏳</span> Timer budget: ' + fmtTime(INTRO.minutes * 60) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🎯</span> Pass mark: ' + INTRO.passMark + '%</span>' +
    (S.user.username ? '<span class="badge"><span aria-hidden="true">👤</span> ' + esc(S.user.username) + '</span>' : '');
  strip.appendChild(row);
  v.appendChild(strip);

  var learn = el('div', 'card');
  learn.appendChild(el('h2', null, 'What you will learn here'));
  INTRO.learn.forEach(function(p){
    var pe = el('p'); pe.innerHTML = p; learn.appendChild(pe);
  });
  v.appendChild(learn);

  var kw = el('div', 'card');
  kw.appendChild(el('h2', null, 'Keywords covered in this exam'));
  INTRO.keywords.forEach(function(th){
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var chips = el('div', 'chips');
    th.items.forEach(function(it){ chips.appendChild(el('span', 'kchip', esc(it))); });
    t.appendChild(chips);
    kw.appendChild(t);
  });
  v.appendChild(kw);

  var how = el('div', 'card');
  how.appendChild(el('h2', null, 'How this exam works'));
  var ul = el('ul', 'rules');
  INTRO.how.forEach(function(r){ var li = el('li'); li.innerHTML = r; ul.appendChild(li); });
  how.appendChild(ul);
  var startrow = el('div', 'startrow');
  var start = el('button', 'btn primary', '▶ Start the exam');
  start.id = 'btnstart';
  startrow.appendChild(start);
  startrow.appendChild(el('span', 'small-note', 'The exercises arrive in a random order. Good luck, analyst.'));
  how.appendChild(startrow);
  v.appendChild(how);
  start.onclick = function(){
    $('#view-intro').classList.add('hidden');
    $('#view-exam').classList.remove('hidden');
    startExam();
  };
}

/* ================= INIT ================= */
function startExam(){
  S.queue = shuffle(EXERCISES.map(function(ex, i){ return { i: i }; }));
  S.idx = 0;
  Timer.start();
  renderExercise();
}
renderIntro();

</script>
