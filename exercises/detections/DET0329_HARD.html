/* ================= FEEDBACK ================= */
function feedHTML(ex,res){
  var cls,hicon,hlabel;
  if(res.credit>=0.9999){cls='ok';hicon='&#10003;';hlabel='CORRECT';}
  else if(res.credit>0){cls='part';hicon='&#10003;';hlabel='PARTIALLY CORRECT';}
  else{cls='bad';hicon='&#10007;';hlabel='INCORRECT';}
  var multi=res.items&&res.items.length>1;
  var h='<div class="feed '+cls+'" role="status"><div class="feed-h"><span aria-hidden="true">'+hicon+'</span><span>'+hlabel+'</span></div><div class="feed-b">';
  if(multi){
    h+='<div class="creditline">&#10003; Credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.hintApplied?', after hint penalty (-0.10)':'')+'</div>';
  }else{
    h+='<div class="creditline">Credit '+res.credit.toFixed(2)+(res.hintApplied?' after hint penalty (-0.10)':'')+'</div>';
  }
  if(multi){
    h+='<div class="itms">';
    for(var i=0;i<res.items.length;i++){
      var it=res.items[i];
      var st=it.status;
      var ic2=st==='correct'?'&#10003;':(st==='wrong'?'&#10007;':'&#96725;');
      var w=st==='correct'?'Correct':(st==='wrong'?'Wrong':'Missed');
      h+='<div class="itm '+st+'"><span class="ic" aria-hidden="true">'+ic2+'</span><span><b>'+w+'</b> — '+esc(it.label)+(it.why?'<div class="why">'+esc(it.why)+'</div>':'')+'</span></div>';
    }
    h+='</div>';
  }
  if(res.correctSummary){h+='<div class="explain"><b>Correct answer:</b> '+res.correctSummary+'</div>';}
  if(res.canonical){h+='<div class="canon"><div class="art"><span class="art-lab mono">CANONICAL ANSWER (copyable)</span><div class="art-b"><pre id="canonblk">'+esc(res.canonical)+'</pre></div></div>'
    +'<button class="btn small" type="button" data-copy="1">Copy</button></div>';}
  h+='<div class="explain">'+esc(ex.explanation)+'</div>';
  if(res.credit<0.9999&&ex.study){h+='<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>';}
  h+='</div></div>';
  return h;
}
function bindCopy(root){
  var b=root.querySelector('[data-copy]');
  if(b){
    b.addEventListener('click',function(){
      var txt=$('canonblk').textContent;
      try{navigator.clipboard.writeText(txt);}catch(e){
        var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
        ta.select();try{document.execCommand('copy');}catch(e2){}document.body.removeChild(ta);
      }
      b.textContent='Copied ✓';
      setTimeout(function(){b.textContent='Copy';},1600);
    });
  }
}
function lockAll(root){
  var els=root.querySelectorAll('.opt,.chip,select,textarea');
  for(var i=0;i<els.length;i++){els[i].classList.add('locked');els[i].disabled=true;}
  var mvs=root.querySelectorAll('.mv button');
  for(var j=0;j<mvs.length;j++){mvs[j].disabled=true;}
}

/* ================= OPTIONS (qcm / spot / multi) ================= */
function renderOpts(ex,selArr,multi){
  var shuffled=ex._shufOpts||(ex._shufOpts=shuffle(ex.options.map(function(o,i){return {o:o,i:i};})));
  var h='<div class="opts" id="optlist">';
  for(var i=0;i<shuffled.length;i++){
    var k=letters(i);
    var isSel=selArr.indexOf(shuffled[i].i)>=0;
    h+='<button type="button" class="opt'+(isSel?' sel':'')+'" data-opt="'+i+'" aria-pressed="'+(isSel?'true':'false')+'">'
      +'<span class="opt-k" aria-hidden="true">'+k+'.</span><span>'+esc(shuffled[i].o.t)+'</span></button>';
  }
  h+='</div>';
  if(multi){h+='<div class="small dim" style="margin-top:8px">Select all that apply, then press Check. Partial credit applies.</div>';}
  return h;
}
function gradeOpts(ex,sel,multi){
  var okIdx=[],N=0,H=0,W=0,items=[];
  for(var i=0;i<ex.options.length;i++){if(ex.options[i].ok){okIdx.push(i);N++;}}
  for(var j=0;j<sel.length;j++){
    var sj=sel[j];if(sj==null){continue;}
    if(okIdx.indexOf(sj)>=0){H++;items.push({status:'correct',label:ex.options[sj].t.slice(0,90)});}
    else{W++;items.push({status:'wrong',label:ex.options[sj].t.slice(0,90),why:'Not part of the correct answer.'});}
  }
  for(var k=0;k<okIdx.length;k++){
    if(sel.indexOf(okIdx[k])<0){items.push({status:'missed',label:ex.options[okIdx[k]].t.slice(0,90),why:'This belongs in the correct answer.'});}
  }
  var corr=okIdx.map(function(i){return ex.options[i].t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:multi?items:null,correctSummary:esc(corr)};
}

/* ================= MATCH ================= */
function renderMatch(ex){
  var shufR=ex._shufR||(ex._shufR=shuffle(ex.right.slice()));
  var saved=S.answers[ex.id]||{};
  var h='';
  for(var i=0;i<ex.left.length;i++){
    var L=ex.left[i];
    var cur=saved[L.id]||'';
    h+='<div class="pair"><div class="pt">'+esc(L.t)+'</div><div><select class="pair-sel" data-pair="'+L.id+'" aria-label="Match for '+esc(L.t)+'">'
      +'<option value="">— choose the match —</option>';
    for(var j=0;j<shufR.length;j++){
      h+='<option value="'+shufR[j].id+'"'+(cur===shufR[j].id?' selected':'')+'>'+esc(shufR[j].t)+'</option>';
    }
    h+='</select></div></div>';
  }
  h+='<div class="small dim">Pick one match for each row.</div>';
  return h;
}
function gradeMatch(ex,ans){
  var N=ex.left.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var L=ex.left[i];
    var chosen=ans[L.id]||'';
    if(!chosen){items.push({status:'missed',label:L.t,why:'Correct match: '+byId(ex.right,L.match).t});}
    else if(chosen===L.match){H++;items.push({status:'correct',label:L.t});}
    else{W++;items.push({status:'wrong',label:L.t+' → '+byId(ex.right,chosen).t,why:'Correct match: '+byId(ex.right,L.match).t});}
  }
  var corr=ex.left.map(function(L){return L.t+' → '+byId(ex.right,L.match).t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(corr)};
}

/* ================= DRAG & DROP (item -> zone map) ================= */
function renderDND(ex){
  var placed=S.answers[ex.id]||{};
  var shufItems=ex._shufItems||(ex._shufItems=shuffle(ex.items.slice()));
  var h='<div class="dnd"><div class="zones">';
  for(var i=0;i<ex.zones.length;i++){
    var z=ex.zones[i];
    h+='<div class="zone" data-zone="'+z.id+'"><div class="zone-t">'+esc(z.t)+'</div><div class="zone-items">';
    for(var k=0;k<shufItems.length;k++){
      var it=shufItems[k];
      if(placed[it.id]===z.id){
        h+='<div class="chip" draggable="true" data-item="'+it.id+'" tabindex="0" role="button" aria-label="'+esc(it.t)+', placed. Click to return to bank.">'+esc(it.t)+'</div>';
      }
    }
    h+='</div></div>';
  }
  h+='</div><div class="bank"><div class="bank-t">ITEM BANK</div><div class="bank-items">';
  for(var k2=0;k2<shufItems.length;k2++){
    var it2=shufItems[k2];
    if(!placed[it2.id]){
      h+='<div class="chip" draggable="true" data-item="'+it2.id+'" tabindex="0" role="button" aria-label="'+esc(it2.t)+'. Click to pick up, then click a zone.">'+esc(it2.t)+'</div>';
    }
  }
  h+='</div></div></div>'
   +'<div class="small dim" style="margin-top:8px">Drag a chip into a zone, or click a chip (it shows “picked”) and then click a zone. Click a placed chip to send it back to the bank.</div>';

}
function gradeDND(ex){
  var N=ex.items.length,H=0,W=0,items=[];
  var placed=S.answers[ex.id]||{};
  var zoneName={};for(var z=0;z<ex.zones.length;z++){zoneName[ex.zones[z].id]=ex.zones[z].t;}
  for(var i=0;i<N;i++){
    var it=ex.items[i];var got=placed[it.id]||'';
    if(!got){items.push({status:'missed',label:it.t,why:'Belongs in: '+zoneName[it.zone]});}
    else if(got===it.zone){H++;items.push({status:'correct',label:it.t+' → '+zoneName[it.zone]});}
    else{W++;items.push({status:'wrong',label:it.t+' → '+zoneName[got],why:'Correct zone: '+zoneName[it.zone]});}
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,
    correctSummary:esc(ex.items.map(function(it){return it.t+' → '+zoneName[it.zone];}).join(' • '))};
}

/* ================= ORDER / TIMELINE ================= */
function renderOrder(ex){
  var disp=S.answers[ex.id];
  if(!disp||disp.length!==ex.items.length){
    disp=ex._shufOrder||(ex._shufOrder=shuffle(ex.items.map(function(i){return i.id;})));
  }
  S.answers[ex.id]=disp.slice();

  for(var i=0;i<disp.length;i++){
    var it=byId(ex.items,disp[i]);
    h+='<div class="orow" data-oid="'+it.id+'" draggable="true"><span class="pos">'+(i+1)+'</span><span class="ot">'+esc(it.t)+'</span>'
      +'<span class="mv"><button type="button" data-up="'+it.id+'" aria-label="Move up">&#8593;</button><button type="button" data-down="'+it.id+'" aria-label="Move down">&#8595;</button></span></div>';
  }
  h+='</div><div class="small dim" style="margin-top:8px">Use the arrows (or drag rows) to put the items in the right order.</div>';
  return h;
}
function gradeOrder(ex){
  var disp=S.answers[ex.id]||[];
  var N=ex.items.length,H=0,W=0,items=[];
  var correct=ex.correct;
  for(var i=0;i<N;i++){
    var got=disp[i];
    var it=byId(ex.items,got);
    var label=it?it.t:'?';
    if(got===correct[i]){H++;items.push({status:'correct',label:'Position '+(i+1)+': '+label});}
    else{W++;items.push({status:'wrong',label:'Position '+(i+1)+': '+label,why:'Correct here: '+byId(ex.items,correct[i]).t});}
  }
  var corr=correct.map(function(id,j){return (j+1)+'. '+byId(ex.items,id).t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(corr)};
}

function gradeFill(ex,ans){

/* ================= LOG VIEWER ================= */
function renderLogview(ex){
  return '<div class="logbox"><div class="logbar"><span aria-hidden="true" style="color:var(--accent-blue)">&#128269;</span>'
    +'<input type="text" id="logfilter" placeholder="Filter lines (text match)…" aria-label="Filter log lines">'

}
function drawLog(ex,filter){
  var box=$('loglines');if(!box){return;}
  var f=(filter||'').toLowerCase();
  var shown=0,h='';
  for(var i=0;i<ex.log.length;i++){
    var line=ex.log[i];
    if(f&&line.toLowerCase().indexOf(f)<0){continue;}
    shown++;
    h+='<pre><span class="ln-no">'+String(i+1).padStart(3,'0')+'</span>'+hl(line)+'</pre>';
  }
  if(shown===0){h='<pre><span class="ln-no">000</span><span class="tk-c"># no lines match this filter</span></pre>';}
  box.innerHTML=h;
  var cnt=$('logcnt');if(cnt){cnt.textContent=shown+' / '+ex.log.length+' lines';}
}

/* ================= QUERY EDITOR ================= */
function renderQuery(ex){
  var saved=S.answers[ex.id]||'';
  return '<div class="qed"><div class="qed-bar"><span class="prompt mono">'+esc(ex.editorPrompt||'search')+'</span>'
    +'<span class="small dim">'+esc(ex.editorNote||'Type your query, then press Check.')+'</span></div>'
    +'<textarea id="qinput" spellcheck="false" aria-label="Query editor" placeholder="'+esc(ex.placeholder||'')+'">'+esc(saved)+'</textarea></div>'
    +(ex.syntaxPanel?'<div class="art" style="margin-top:10px"><span class="art-lab mono">SYNTAX PANEL — available sources &amp; fields</span><div class="art-b"><pre>'+hl(ex.syntaxPanel)+'</pre></div></div>':'');
}
function normQuery(q){
  return String(q||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/\s*=\s*/g,'=');
}
function gradeQuery(ex){
  var q=normQuery($('qinput')?$('qinput').value:(S.answers[ex.id]||''));
  var N=ex.elements.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var el=ex.elements[i];
    var re=new RegExp(el.re,'i');
    if(re.test(q)){H++;items.push({status:'correct',label:el.label});}
    else{items.push({status:'missed',label:el.label,why:el.why});}
  }
  if(ex.bad){
    for(var j=0;j<ex.bad.length;j++){
      var bd=ex.bad[j];
      var re2=new RegExp(bd.re,'i');
      if(re2.test(q)){W++;items.push({status:'wrong',label:bd.label,why:bd.why});}
    }
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,canonical:ex.canonical,
    correctSummary:'Every required element is listed above and shown in the canonical query below.'};
}

/* ================= MAIN RENDER ================= */
function decisionBind(ex){
  var root=document.getElementById('exbody');
  var st=S.dec[ex.id];
  var opts=root.querySelectorAll('[data-dopt]');
  for(var o=0;o<opts.length;o++){
    opts[o].addEventListener('click',function(ev){
      var b=ev.currentTarget;
      var i=parseInt(b.getAttribute('data-dopt'),10);
      st.answers[st.step]=i;
      var sibs=b.parentElement.querySelectorAll('.opt');
      for(var x=0;x<sibs.length;x++){sibs[x].classList.remove('sel');sibs[x].setAttribute('aria-pressed','false');}
      b.classList.add('sel');b.setAttribute('aria-pressed','true');
    });
  }
}
function decisionAdvance(ex,checkBtn){
  var st=S.dec[ex.id];
  if(st.answers[st.step]==null){flash('Choose an option for this step first.');return false;}
  st.step++;
  var root=document.getElementById('exbody');
  var ab=root.querySelector('.blk.answer .blk-b');
  ab.innerHTML=renderDecision(ex);
  decisionBind(ex);
  checkBtn.innerHTML='&#10003; Check (final step)';
  return true;
}
function wireOrder(ex){
  var root=document.getElementById('exbody');
  function move(id,dir){
    var arr=S.answers[ex.id];
    var i=arr.indexOf(id);var j=i+dir;
    if(i<0||j<0||j>=arr.length)return;
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
    var body=root.querySelector('.blk.answer .blk-b');
    body.innerHTML=renderOrder(ex);wireOrder(ex);
  }
  var rows=root.querySelectorAll('.orow');
  for(var i=0;i<rows.length;i++){
    (function(row){
      var id=row.getAttribute('data-oid');
      row.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',id);});
      row.addEventListener('dragover',function(ev){ev.preventDefault();row.classList.add('dragover');});
      row.addEventListener('dragleave',function(){row.classList.remove('dragover');});
      row.addEventListener('drop',function(ev){
        ev.preventDefault();row.classList.remove('dragover');
        var src=ev.dataTransfer.getData('text/plain');
        var arr=S.answers[ex.id];
        var si=arr.indexOf(src),ti=arr.indexOf(id);
        if(si<0||ti<0||si===ti)return;
        arr.splice(si,1);arr.splice(ti,0,src);
        var body=root.querySelector('.blk.answer .blk-b');
        body.innerHTML=renderOrder(ex);wireOrder(ex);
      });
    })(rows[i]);
  }
  var ups=root.querySelectorAll('[data-up]');
  for(var u=0;u<ups.length;u++){ups[u].addEventListener('click',function(ev){move(ev.currentTarget.getAttribute('data-up'),-1);});}
  var downs=root.querySelectorAll('[data-down]');
  for(var d=0;d<downs.length;d++){downs[d].addEventListener('click',function(ev){move(ev.currentTarget.getAttribute('data-down'),1);});}
}
function wireDND(ex){
  var root=document.getElementById('exbody');
  var picked=null;
  function refreshDND(){
    var body=root.querySelector('.blk.answer .blk-b');
    body.innerHTML=renderDND(ex);
    wireDND(ex);
  }
  function placeItem(itemId,zoneId){
    var st=S.answers[ex.id]||{};
    st[itemId]=(zoneId==='__bank')?'':zoneId;
    S.answers[ex.id]=st;
    refreshDND();
  }
  var chips=root.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){
    (function(chip){
      var id=chip.getAttribute('data-item');
      chip.addEventListener('click',function(){
        if(chip.closest('.zone')){placeItem(id,'__bank');return;}
        var was=chip.classList.contains('picked');
        var all=root.querySelectorAll('.chip.picked');
        for(var k=0;k<all.length;k++){all[k].classList.remove('picked');var pw=all[k].querySelector('.pickword');if(pw)pw.remove();}
        if(!was){chip.classList.add('picked');var w=document.createElement('span');w.className='pickword';w.textContent='picked';chip.appendChild(w);picked=id;}
        else{picked=null;}
      });
      chip.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',id);chip.classList.add('dragging');});
      chip.addEventListener('dragend',function(){chip.classList.remove('dragging');});
    })(chips[i]);
  }
  var zones=root.querySelectorAll('.zone');
  for(var j=0;j<zones.length;j++){
    (function(zone){
      zone.addEventListener('click',function(){
        if(!picked){return;}
        placeItem(picked,zone.getAttribute('data-zone'));picked=null;
      });
      zone.addEventListener('dragover',function(ev){ev.preventDefault();zone.classList.add('over');});
      zone.addEventListener('dragleave',function(){zone.classList.remove('over');});
      zone.addEventListener('drop',function(ev){
        ev.preventDefault();zone.classList.remove('over');
        placeItem(ev.dataTransfer.getData('text/plain'),zone.getAttribute('data-zone'));
      });
    })(zones[j]);
  }
}

function renderExercise(ex){
  var root=$('exbody');
  CURSEL=[];
  var already=!!S.answeredFlags[ex.id];
  var answer='';
  switch(ex.type){
    case 'qcm': case 'spot':
      answer=renderOpts(ex,already&&S.results[ex.id]?gradeOptsSel(ex):[],false);break;
    case 'multi':
      answer=renderOpts(ex,already?(S.answers[ex.id]||[]):[],true);break;
    case 'match':answer=renderMatch(ex);break;
    case 'dnd':answer=renderDND(ex);break;
    case 'order':answer=renderOrder(ex);break;
    case 'fill':answer=renderFill(ex);break;
    case 'logview':
      answer=renderLogview(ex)+renderOpts(ex,already?(S.answers[ex.id]!=null?[S.answers[ex.id]]:[]):[],false);break;
    case 'query':answer=renderQuery(ex);break;
    case 'decision':answer=renderDecision(ex);break;
    case 'triage':answer=renderTriage(ex);break;
    default:answer='<p>Unsupported type.</p>';
  }
  var collapsedDefault=null;
  if(S.reviewMode){collapsedDefault=false;}
  root.innerHTML=scenarioBlock(ex,collapsedDefault)+questionBlock(ex)+answerBlock(answer);
  bindScenarioToggle(root);

  if(ex.type==='logview'){
    drawLog(ex,'');
    $('logfilter').addEventListener('input',function(e){drawLog(ex,e.target.value);});
  }
  if(ex.type==='dnd'){wireDND(ex);}
  if(ex.type==='order'){wireOrder(ex);}
  if(ex.type==='decision'){decisionBind(ex);}

  /* ---- actions ---- */
  var act=document.createElement('div');
  act.id='exactions';act.style.marginTop='14px';
  var checkBtn=document.createElement('button');
  checkBtn.type='button';checkBtn.className='btn green';checkBtn.id='checkbtn';
  var last=!S.reviewMode&&isLastPosition();
  if(ex.type==='decision'&&!(already&&S.results[ex.id])){
    var st=S.dec[ex.id];
    checkBtn.innerHTML=(st.step===ex.steps.length-1)?'&#10003; Check (final step)':'Confirm step &#8594;';
  }else{
    checkBtn.innerHTML='&#10003; Check'+(last?' &amp; finish':'');
  }
  act.appendChild(checkBtn);
  root.appendChild(act);
  var hintPanel=document.createElement('div');
  hintPanel.id='hintpanel';hintPanel.className='hintp hidden';
  root.appendChild(hintPanel);
  var nav=document.createElement('div');nav.id='exnav';nav.style.marginTop='12px';
  root.appendChild(nav);

  $('hintbtn').disabled=!!S.hintUsed[ex.id];
  if(S.hintUsed[ex.id]){
    hintPanel.classList.remove('hidden');
    hintPanel.innerHTML='<div class="ht"><span aria-hidden="true">&#128161;</span><span>HINT (used — credit reduced by 0.10)</span></div><div>'+esc(ex.hint)+'</div>';
  }
  $('skipbtn').disabled=!!S.answeredFlags[ex.id];

  /* option clicks (qcm/spot/multi/logview) */
  var optlist=root.querySelector('#optlist');
  if(optlist&&ex._shufOpts){
    var shuf=ex._shufOpts;
    optlist.addEventListener('click',function(ev){
      var b=ev.target.closest('.opt');
      if(!b||b.classList.contains('locked'))return;
      var pos=parseInt(b.getAttribute('data-opt'),10);
      var orig=shuf[pos].i;
      if(ex.type==='multi'){
        var k=CURSEL.indexOf(orig);
        if(k>=0){CURSEL.splice(k,1);}else{CURSEL.push(orig);}
        b.classList.toggle('sel',k<0);
        b.setAttribute('aria-pressed',k<0?'true':'false');
      }else{
        CURSEL=[orig];
        var all=optlist.querySelectorAll('.opt');
        for(var x=0;x<all.length;x++){all[x].classList.remove('sel');all[x].setAttribute('aria-pressed','false');}
        b.classList.add('sel');b.setAttribute('aria-pressed','true');
      }
    });
  }

  /* change events (match/fill/triage) */
  root.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.classList&&t.classList.contains('pair-sel')){
      var id=t.getAttribute('data-pair');
      S.answers[ex.id]=S.answers[ex.id]||{};
      S.answers[ex.id][id]=t.value;
    }else if(t.classList&&t.classList.contains('fill-sel')){
      var bi=parseInt(t.getAttribute('data-blank'),10);
      S.answers[ex.id]=S.answers[ex.id]||[];
      S.answers[ex.id][bi]=t.value;
    }else if(t.closest&&t.closest('.asel')){
      var al=t.closest('.asel').getAttribute('data-al');
      S.answers[ex.id]=S.answers[ex.id]||{};
      S.answers[ex.id][al]=parseInt(t.value,10);
      var labs=t.closest('.asel').querySelectorAll('label');
      for(var li=0;li<labs.length;li++){labs[li].classList.toggle('on',labs[li].querySelector('input').checked);}
    }
  });

  /* already answered → locked view with feedback */
  if(already){
    lockAll(root);
    checkBtn.style.display='none';
    var res=S.results[ex.id]||{credit:S.answered[ex.id]||0,items:null,H:0,N:1};
    var fbw=document.createElement('div');
    fbw.innerHTML=feedHTML(ex,res);
    root.insertBefore(fbw.firstChild,$('exnav'));
    bindCopy(root);
    renderNavAfterCheck(ex);
    updateHeader();
    return;
  }

  /* check / step confirm */
  checkBtn.addEventListener('click',function(){
    if(ex.type==='decision'&&S.dec[ex.id].step<ex.steps.length-1){
      if(decisionAdvance(ex,checkBtn)){
        S.answers[ex.id]=S.dec[ex.id].answers;
      }
      return;
    }
    doCheck(ex);
  });
  updateHeader();
}
function gradeOptsSel(ex){
  /* restore selection for locked re-render (single types) */
  var r=S.results[ex.id];
  return (r&&r.sel&&r.sel.length)?[r.sel[0]]:[];
}
function flash(msg){
  var t=$('toast');
  t.innerHTML='&#9888; '+esc(msg);
  t.classList.remove('hidden');
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){t.classList.add('hidden');},3000);
}

/* ================= GRADING DISPATCH ================= */
function doCheck(ex){
  var res;
  switch(ex.type){
    case 'qcm': case 'spot': case 'logview':
      if(CURSEL.length===0){flash('Select an option, then press Check.');return;}
      res=gradeOpts(ex,CURSEL,false);
      S.answers[ex.id]=CURSEL[0];
      break;
    case 'multi':
      if(CURSEL.length===0){flash('Select at least one option, then press Check.');return;}
      res=gradeOpts(ex,CURSEL,true);
      S.answers[ex.id]=CURSEL.slice();
      break;
    case 'match':{
      var ans=S.answers[ex.id]||{};
      var any=false;for(var k in ans){if(ans.hasOwnProperty(k)&&ans[k]){any=true;break;}}
      if(!any){flash('Match at least one item, then press Check.');return;}
      res=gradeMatch(ex,ans);break;}
    case 'dnd':{
      var p=S.answers[ex.id]||{};var anyp=false;
      for(var pk in p){if(p.hasOwnProperty(pk)&&p[pk]){anyp=true;break;}}
      if(!anyp){flash('Place the items into zones, then press Check.');return;}
      res=gradeDND(ex);break;}
    case 'order':
      res=gradeOrder(ex);break;
    case 'fill':{
      var f=S.answers[ex.id]||[];var anyf=false;
      for(var fi=0;fi<f.length;fi++){if(f[fi]){anyf=true;break;}}
      if(!anyf){flash('Fill at least one blank, then press Check.');return;}
      res=gradeFill(ex,f);break;}
    case 'query':{
      var qv=$('qinput')?$('qinput').value:'';
      if(!qv.trim()){flash('Type your query, then press Check.');return;}
      S.answers[ex.id]=qv;
      res=gradeQuery(ex);break;}
    case 'decision':{
      var st=S.dec[ex.id];
      if(st.answers[st.step]==null){flash('Choose an option for the final step.');return;}
      var N=ex.steps.length,H=0,W=0,items=[];
      for(var i=0;i<N;i++){
        var got=st.answers[i];var okIdx=0;
        for(var g=0;g<ex.steps[i].options.length;g++){if(ex.steps[i].options[g].ok){okIdx=g;break;}}
        if(got==null){items.push({status:'missed',label:'Step '+(i+1),why:'Correct: '+ex.steps[i].options[okIdx].t.slice(0,90)});}
        else if(got===okIdx){H++;items.push({status:'correct',label:'Step '+(i+1)+': '+ex.steps[i].options[okIdx].t.slice(0,90)});}
        else{W++;items.push({status:'wrong',label:'Step '+(i+1)+': '+ex.steps[i].options[got].t.slice(0,90),why:'Correct: '+ex.steps[i].options[okIdx].t.slice(0,90)});}
      }
      res={credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,
        correctSummary:esc(ex.steps.map(function(s,ix){var oi=0;for(var g2=0;g2<s.options.length;g2++){if(s.options[g2].ok){oi=g2;break;}}return 'Step '+(ix+1)+': '+s.options[oi].t;}).join(' • '))};
      break;}
    case 'triage':{
      var ta=S.answers[ex.id]||{};
      var N2=ex.alerts.length,H2=0,W2=0,items2=[];
      for(var a=0;a<N2;a++){
        var got2=ta[a];var okIdx2=0;
        for(var g3=0;g3<ex.alerts[a].options.length;g3++){if(ex.alerts[a].options[g3].ok){okIdx2=g3;break;}}
        if(got2==null){items2.push({status:'missed',label:ex.alerts[a].title,why:'Correct action: '+ex.alerts[a].options[okIdx2].t.slice(0,90)});}
        else if(got2===okIdx2){H2++;items2.push({status:'correct',label:ex.alerts[a].title+' → '+ex.alerts[a].options[okIdx2].t.slice(0,70)});}
        else{W2++;items2.push({status:'wrong',label:ex.alerts[a].title+' → '+ex.alerts[a].options[got2].t.slice(0,70),why:'Correct action: '+ex.alerts[a].options[okIdx2].t.slice(0,90)});}
      }
      res={credit:scoreExercise(H2,W2,N2),H:H2,W:W2,N:N2,items:items2,
        correctSummary:esc(ex.alerts.map(function(al,ix){var oi=0;for(var g4=0;g4<al.options.length;g4++){if(al.options[g4].ok){oi=g4;break;}}return al.title+' → '+al.options[oi].t;}).join(' • '))};
      break;}
    default:
      return;
  }
  afterCheckCommon(ex,res);
  res.sel=CURSEL.slice();
  S.results[ex.id]=res;
  /* mark good/bad on options for choice types */
  if((ex.type==='qcm'||ex.type==='spot'||ex.type==='multi'||ex.type==='logview')&&ex._shufOpts){
    var optlist=$('optlist');
    if(optlist){
      var shuf=ex._shufOpts;
      var btns=optlist.querySelectorAll('.opt');
      for(var b2=0;b2<btns.length;b2++){
        var origIdx=shuf[parseInt(btns[b2].getAttribute('data-opt'),10)].i;
        if(ex.options[origIdx].ok){btns[b2].classList.add('good');}
        else if(CURSEL.indexOf(origIdx)>=0){btns[b2].classList.add('bad');}
      }
    }
  }
  var cb=$('checkbtn');if(cb){cb.style.display='none';}
  lockAll($('exbody'));
  var fbw=document.createElement('div');
  fbw.innerHTML=feedHTML(ex,res);
  var nav=$('exnav');
  $('exbody').insertBefore(fbw.firstChild,nav);
  bindCopy($('exbody'));
  renderNavAfterCheck(ex);
  updateHeader();
  var fb=document.querySelector('.feed');
  if(fb&&fb.scrollIntoView){fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

  $('pausebtn').addEventListener('click',togglePause);
  $('resumebtn').addEventListener('click',togglePause);
  $('hintbtn').addEventListener('click',useHint);
  $('skipbtn').addEventListener('click',skipCurrent);
  renderIntro();
  updateHeader();
})();

</script>
