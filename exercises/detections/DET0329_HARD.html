<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints of the palette above (single source of truth) */
  --bg-hover:#182238;
  --bg-hover-2:#223154;
  --bg-chip:#1b2a4a;
  --bg-page-96:rgba(11,16,32,.96);
  --bg-page-ov:rgba(11,16,32,.97);
  --tint-blue-05:rgba(90,169,255,.045);
  --tint-blue-07:rgba(90,169,255,.07);
  --tint-blue-08:rgba(90,169,255,.08);
  --tint-blue-10:rgba(90,169,255,.10);
  --tint-amber-07:rgba(255,180,84,.07);
  --tint-amber-08:rgba(255,180,84,.08);
  --tint-amber-12:rgba(255,180,84,.12);
  --tint-amber-28:rgba(255,180,84,.28);
  --tint-amber-40:rgba(255,180,84,.40);
  --tint-amber-45:rgba(255,180,84,.45);
  --tint-green-07:rgba(87,211,140,.07);
  --tint-green-08:rgba(87,211,140,.08);
  --tint-red-07:rgba(255,107,107,.07);
  --tint-red-08:rgba(255,107,107,.08);
  --tint-grey-08:rgba(169,180,208,.08);
  --tint-white-02:rgba(255,255,255,.02);
  --sheen:rgba(255,255,255,.22);
  --btn-p1:#1d3a6b;--btn-p2:#17325e;--btn-pb:#2e5ea8;
  --btn-ph1:#234a8c;--btn-ph2:#1c3f77;
  --btn-g1:#14522f;--btn-g2:#124826;--btn-gb:#2c7a4b;
  --btn-gh1:#19653b;--btn-gh2:#175a30;
  --danger-border:#7a2e2e;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,code,pre{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
a{color:var(--accent-blue)}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
/* ---------- header strip ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--bg-page-96);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
}
.hdr-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hdr .cell{display:flex;align-items:center;gap:6px;min-height:34px}
.hdr .lab{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hdr .val{font-weight:700;font-size:15px}
.hdr .score-sum{color:var(--text-primary);font-weight:800}
.hdr .mono{font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:999px;
  padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;
  background:var(--bg-surface);min-height:28px;
}
.badge .dot{width:9px;height:9px;border-radius:50%}
.sev-easy{color:var(--sev-easy)}.sev-easy .dot{background:var(--sev-easy)}
.sev-medium{color:var(--sev-medium)}.sev-medium .dot{background:var(--sev-medium)}
.sev-hard{color:var(--sev-hard)}.sev-hard .dot{background:var(--sev-hard)}
.sev-extreme{color:var(--sev-extreme)}.sev-extreme .dot{background:var(--sev-extreme)}
.tstate{font-weight:700;font-size:13px}
.tstate.run{color:var(--accent-blue)}
.tstate.pman,.tstate.pauto{color:var(--state-paused)}
.tstate.end{color:var(--state-skipped)}
/* ---------- progress bar ---------- */
.bar{
  position:relative;height:6px;background:var(--bg-surface-2);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.bar-fill{
  height:100%;width:0%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--accent-blue),var(--sev-col,var(--accent-green)));
  transition:width .5s ease;
  position:relative;overflow:hidden;
}
.bar-fill::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 3.2s linear infinite;
}
@keyframes sheen{to{left:120%}}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--bg-surface);color:var(--text-primary);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--btn-p1),var(--btn-p2));border-color:var(--btn-pb)}
.btn.primary:hover{background:linear-gradient(135deg,var(--btn-ph1),var(--btn-ph2))}
.btn.green{background:linear-gradient(135deg,var(--btn-g1),var(--btn-g2));border-color:var(--btn-gb)}
.btn.green:hover{background:linear-gradient(135deg,var(--btn-gh1),var(--btn-gh2))}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger-border);color:var(--state-incorrect)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:4px 12px;font-size:13px}
/* ---------- cards & blocks ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px 18px;
  margin:14px 0;
}
.blk{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.blk-h{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.blk.scenario{border-left-color:var(--accent-blue)}
.blk.scenario .blk-h{color:var(--accent-blue);background:var(--tint-blue-08)}
.blk.question{border-left-color:var(--accent-amber)}
.blk.question .blk-h{color:var(--accent-amber);background:var(--tint-amber-08)}
.blk.answer{border-left-color:var(--accent-green)}
.blk.answer .blk-h{color:var(--accent-green);background:var(--tint-green-08)}
.blk-b{padding:14px 16px;background:var(--bg-surface)}
.blk.scenario .blk-b{background:linear-gradient(0deg,var(--tint-blue-05),var(--tint-blue-05)),var(--bg-surface)}
.qtext{font-weight:700;font-size:16.5px;margin:0}
.sc-sum{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:8px 14px;font-size:13px;cursor:pointer;min-height:44px;
}
.sc-sum:hover{color:var(--text-primary)}
.sc-sum .caret{margin-left:auto;transition:transform .2s ease}
.sc-sum[aria-expanded="true"] .caret{transform:rotate(90deg)}
.sc-body{padding:12px 16px 16px}
.sc-body p{margin:.4em 0 1em}
/* ---------- artefacts ---------- */
.art{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  margin:10px 0;
  overflow:hidden;
}
.art-lab{
  display:block;padding:6px 12px;
  color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.06em;
  border-bottom:1px solid var(--border);
  background:var(--tint-white-02);
}
.art-b{padding:10px 12px;overflow-x:auto}
.art-b.plain{font-size:15px}
.art-b pre{margin:0;font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre}
/* ---------- syntax highlight tokens ---------- */
.tk-k{color:var(--accent-blue);font-weight:700}
.tk-s{color:var(--accent-amber)}
.tk-n{color:var(--accent-green)}
.tk-i{color:var(--state-paused)}
.tk-c{color:var(--text-secondary);font-style:italic}
.tk-w{color:var(--state-incorrect);font-weight:700}
/* ---------- log viewer ---------- */
.logbox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.logbar input{
  flex:1;background:var(--bg-page);border:1px solid var(--border);color:var(--text-mono);
  border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;
}
.logbar .cnt{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.loglines{max-height:320px;overflow:auto;padding:8px 10px}
.loglines pre{margin:0;font-size:14px;line-height:1.55;color:var(--text-mono);white-space:pre;overflow-x:auto}
.loglines .ln-no{color:var(--text-secondary);opacity:.7;margin-right:10px}
.loglines mark{background:var(--tint-amber-28);color:var(--text-primary);border-radius:2px;padding:0 1px}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text-primary);cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;min-height:44px;
  transition:background .12s ease,border-color .12s ease;
}
.opt:hover{background:var(--bg-hover)}
.opt .opt-k{
  flex:0 0 auto;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-chip);border:1px solid var(--border);
  font-weight:800;font-size:13px;color:var(--text-secondary);
}
.opt.sel{border-color:var(--accent-blue);background:var(--tint-blue-10);box-shadow:inset 3px 0 0 var(--accent-blue)}
.opt.sel .opt-k{background:var(--accent-blue);color:var(--bg-page);border-color:var(--accent-blue)}
.opt.sel::after{content:"Selected";margin-left:auto;color:var(--accent-blue);font-size:12px;font-weight:800;white-space:nowrap;padding-top:3px}
.opt.good{border-color:var(--state-correct)}
.opt.bad{border-color:var(--state-incorrect)}
.opt.locked{cursor:default;pointer-events:none}
/* ---------- drag & drop ---------- */
.dnd{display:grid;grid-template-columns:1fr 300px;gap:14px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-content:start}
.zone{
  background:var(--bg-surface-2);border:1.5px dashed var(--border);border-radius:8px;
  padding:10px;min-height:74px;display:flex;flex-direction:column;gap:8px;
}
.zone.over{border-color:var(--accent-green);background:var(--tint-green-07)}
.zone-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.bank{
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start;
}
.bank-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.chip{
  background:var(--bg-chip);border:1px solid var(--border);border-radius:7px;
  padding:9px 12px;font-size:14.5px;cursor:grab;user-select:none;min-height:44px;
  display:flex;align-items:center;gap:8px;
}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--accent-blue);box-shadow:inset 3px 0 0 var(--accent-blue)}
.chip .pickword{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent-blue);text-transform:uppercase}
.chip.dragging{opacity:.55}
.zone .chip{cursor:grab}
/* ---------- order / rank ---------- */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:48px;
}
.orow.dragover{border-color:var(--accent-green)}
.orow .pos{
  flex:0 0 30px;height:30px;border-radius:6px;background:var(--bg-chip);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-secondary);
}
.orow .ot{flex:1;font-size:15px}
.orow .mv{display:flex;gap:6px}
.mv button{
  min-width:44px;min-height:44px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg-hover);color:var(--text-primary);font-size:16px;cursor:pointer;font-weight:800;
}
.mv button:hover{background:var(--bg-hover-2)}
/* ---------- match / fill ---------- */
.pair{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1.2fr);gap:10px;align-items:center;margin-bottom:10px}
.pair .pt{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:44px;display:flex;align-items:center}
select.fill-sel,select.pair-sel{
  background:var(--bg-page);color:var(--text-mono);border:1px solid var(--border);
  border-radius:6px;padding:9px 10px;font-size:14px;min-height:44px;max-width:100%;
}
.filltext{font-size:16px;line-height:2.05}
.filltext select{margin:0 3px}
.bankchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bankchips .chip{cursor:default;min-height:44px;padding:6px 10px;font-size:13.5px}
/* ---------- query editor ---------- */
.qed{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qed-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.qed-bar .prompt{color:var(--accent-green);font-weight:800;font-size:13px}
.qed textarea{
  width:100%;min-height:110px;background:transparent;border:none;color:var(--text-mono);
  font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;
}
.qed textarea:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px}
.copyrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
/* ---------- decision steps ---------- */
.stepbadge{
  display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber-12);
  color:var(--accent-amber);border:1px solid var(--tint-amber-40);
  border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:800;letter-spacing:.05em;margin-bottom:8px;
}
/* ---------- triage queue ---------- */
.alertq{display:flex;flex-direction:column;gap:12px}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.alert-card .at{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-card .at .prio{font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;padding:1px 7px;color:var(--text-secondary)}
.alert-card .ab{color:var(--text-secondary);font-size:14px;margin:6px 0 10px}
.alert-card .asel{display:flex;flex-wrap:wrap;gap:8px}
.asel label{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;
  background:var(--bg-page);padding:8px 12px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.asel label:hover{background:var(--bg-hover)}
.asel input{accent-color:var(--accent-blue)}
.asel label.on{border-color:var(--accent-blue);background:var(--tint-blue-10)}
/* ---------- hint ---------- */
.hintp{
  border:1px solid var(--tint-amber-45);border-left:3px solid var(--accent-amber);
  background:var(--tint-amber-07);border-radius:8px;padding:10px 14px;margin:12px 0;
  color:var(--text-primary);font-size:15px;
}
.hintp .ht{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
/* ---------- feedback ---------- */
.feed{border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.feed-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.feed.ok{border-left-color:var(--state-correct)}
.feed.ok .feed-h{color:var(--state-correct);background:var(--tint-green-08)}
.feed.part{border-left-color:var(--state-partial)}
.feed.part .feed-h{color:var(--state-partial);background:var(--tint-amber-08)}
.feed.bad{border-left-color:var(--state-incorrect)}
.feed.bad .feed-h{color:var(--state-incorrect);background:var(--tint-red-08)}
.feed.skipf{border-left-color:var(--state-skipped)}
.feed.skipf .feed-h{color:var(--state-skipped);background:var(--tint-grey-08)}
.feed-b{padding:12px 16px}
.creditline{font-weight:800;margin:2px 0 10px;font-size:14.5px}
.itms{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.itm{display:flex;gap:9px;align-items:flex-start;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px}
.itm .ic{font-weight:800;flex:0 0 auto}
.itm.correct{color:var(--state-correct)}
.itm.wrong{color:var(--state-incorrect)}
.itm.missed{color:var(--state-skipped)}
.itm .why{color:var(--text-secondary);font-size:13.5px}
.feed .explain{font-size:15px;margin:8px 0}
.feed .study{
  margin-top:10px;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;
  color:var(--text-secondary);font-size:14px;
}
.feed .study b{color:var(--accent-amber)}
.canon{margin-top:10px}
/* ---------- paused overlay ---------- */
.pauseov{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:var(--bg-page-ov);
}
.pauseov .pcard{
  background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);
  padding:26px 34px;text-align:center;color:var(--state-paused);box-shadow:var(--shadow);max-width:440px;
}
.pauseov .pcard .big{font-size:20px;font-weight:800;margin:10px 0 6px}
.pauseov .pcard .sub{color:var(--text-secondary);font-size:14px;margin-bottom:16px}
/* ---------- intro ---------- */
.intro-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.intro-head .t{font-size:20px;font-weight:800;flex:1 1 320px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px}
.facts .f{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary)}
.facts .f b{color:var(--text-primary)}
.kw-theme{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--bg-surface-2)}
.kw-theme .kt{color:var(--accent-blue);font-weight:800;font-size:13.5px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kw-items{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.kw-items .chip{cursor:default;min-height:44px;padding:4px 11px;font-size:13px;background:var(--tint-blue-07)}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{
  position:relative;padding:7px 0 7px 4px;font-size:15px;color:var(--text-primary);
  border-bottom:1px dashed var(--border);
}
.rules li:last-child{border-bottom:none}
.rules li .ric{color:var(--accent-green);font-weight:800;margin-right:7px}
.center{display:flex;justify-content:center;margin-top:18px}
/* ---------- review / results ---------- */
.skiprow{display:flex;align-items:center;gap:12px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0}
.skiprow .st{flex:1;font-size:14.5px}

.pstat{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;color:var(--text-secondary);font-size:13.5px;margin-top:8px}
.hidden{display:none !important}
.dim{color:var(--text-secondary)}
.small{font-size:13px}
footer.note{max-width:980px;margin:0 auto;padding:0 16px 26px;color:var(--text-secondary);font-size:12.5px;text-align:center}

var INTRO = {"learn": ["This HARD exam trains the judgement part of working with DET0329, the ATT&CK detection strategy for T1490 — Inhibit System Recovery. At this level the pattern is no longer enough: the same vssadmin or diskshadow command can be a ransomware pre-encryption step or a documented maintenance task. The difference hides in the parent process, the change ticket, the timing, and the tuning of the analytic's mutable elements.", "You will correlate two to four artefacts at a time — Sysmon records, tickets, CloudTrail events, hostd logs — and defend your call. You will tune mutable elements such as ParentProcessContext, CommandLinePattern, CommandSequenceWindow, TargetVMNames, and UserAgent without destroying coverage. You will also reason about what DET0329 does NOT see: commandless shadow deletion through COM interfaces, and platforms like macOS and Containers that no analytic covers.", "Why does this matter in real work? Because T1490 alerts are rare but catastrophic when missed. Ransomware crews — Akira, Black Basta, BlackCat and others — delete shadow copies and backup catalogs right before encryption. A false negative means a full rebuild and days of downtime; a false positive storm means the team stops trusting the analytic. The detection engineer's job is to hold both risks at once, and the SOC analyst's job is to ask the one question that separates attack from maintenance.", "The hardest habit at this level is choosing the least aggressive correct action: preserving hostd logs before touching the ESXi host, verifying a ticket's author before trusting it, and protecting backups before isolating anything. One exercise in this file is a query editor: you will write the SIEM search behind AN0933 yourself, the way a detection engineer does.", "Every explanation still speaks plain English. Read each artefact panel carefully — at HARD level, the obvious answer is wrong in about one exercise out of three."], "keywords": [{"theme": "Analytics and platforms", "items": ["AN0933 Windows", "AN0934 Linux", "AN0935 ESXi", "AN0936 Network devices", "AN0937 IaaS"]}, {"theme": "Mutable elements and tuning", "items": ["TimeWindow", "CommandLinePattern", "ParentProcessContext", "ShellProcessUser", "TargetVMNames", "CommandSequenceWindow", "UserPrivilegeLevel", "UserAgent", "ResourceType", "WatchedFilePaths"]}, {"theme": "Near-miss command discrimination", "items": ["vssadmin list vs delete", "resize shadowstorage UNBOUNDED", "wmic shadowcopy delete", "bcdedit bootstatuspolicy", "REAgentC /disable"]}, {"theme": "Multi-artefact correlation", "items": ["Sysmon EventCode=1 chains", "Microsoft-Windows-Backup catalog events", "System log VSS service events", "change tickets", "esxi:hostd sessions", "AWS:CloudTrail sequences"]}, {"theme": "Coverage and gaps", "items": ["COM-based shadow deletion (no command line)", "macOS not covered", "Containers not covered", "compensating detections"]}, {"theme": "Query and rule engineering", "items": ["index=sysmon EventCode=1", "destructive flag patterns", "utility + argument pairing", "Sysmon vs Security log event codes"]}], "rules": ["The pass mark is 70%, computed over the exercises you answered with Check.", "Exercise types in this file: an alert queue, a filtered log viewer, drag & drop, matching, fill-in-the-blank, ordering, a decision tree, spot-the-mistake, a SIEM query editor (one), and a few multiple-choice questions.", "The timer counts down from 50 minutes. Manual Pause hides the exercise and stops the timer; Resume brings it back.", "Check auto-pauses the timer so you can study the feedback without pressure; it resumes on Next.", "Multi-answer exercises use partial credit: (correct − wrong) / total. Selecting everything scores zero.", "One hint per exercise costs 10% of that exercise's credit.", "Skip sends an exercise to the review pool; you can return before submitting. Unanswered skipped exercises are excluded from the score."]};
var EXERCISES = [{"id": "H01", "type": "triage", "title": "Triage the Monday 02:00 queue", "summary": "Four T1490-shaped alerts, four different calls", "scenario": "Monday morning, you inherit four alerts that all touch recovery features. Each one fires the pattern, but the calls differ. The near-misses are deliberate: one command looks destructive but deletes nothing, one looks routine but has no ticket, one has a ticket, and one is automation. Read every detail before choosing.", "question": "Choose the correct action for each of the four alerts.", "hint": "Check what the arguments actually do first; then check who ran it, when, and whether a written change covers it.", "explanation": "Alert A: 'resize shadowstorage /maxsize=UNBOUNDED' removes the size cap but deletes no shadow copy — UNBOUNDED grows the allowed storage, so it is benign; close with a note. Alert B: silent catalog deletion at 02:11 with no ticket and no maintenance window is a textbook AN0933 hit — escalate. Alert C: REAgentC.exe /disable with WinRE removal written into approved change CHG-2145 (lab golden-image refresh, 22:00–23:00) — the ticket covers exactly this action, so verify the ticket, then close as planned. Alert D: DeleteSnapshot of one dev VM by the documented automation identity on retention day — close as legitimate automation. The trap is A: it shares the 'vssadmin + scary word' look of an attack but the argument cannot delete anything.", "study": "Compare resize (changes the cap) with delete (removes the copies). The verb decides.", "alerts": [{"title": "ALERT-A — SRV-FS-05 — vssadmin resize shadowstorage UNBOUNDED", "prio": "MEDIUM", "body": "At 01:40 the backup agent's updater ran: vssadmin resize shadowstorage /for=C: /on=C: /maxsize=UNBOUNDED. Documented installer behaviour of the new agent version. No shadow copy was deleted.", "options": [{"t": "Close — resize with UNBOUNDED deletes nothing; noted installer behaviour", "ok": true}, {"t": "Escalate — any vssadmin write action is an attack", "ok": false}, {"t": "Isolate SRV-FS-05 immediately", "ok": false}]}, {"title": "ALERT-B — SRV-FS-02 — wbadmin delete catalog -quiet", "prio": "HIGH", "body": "At 02:11, wbadmin deleted the backup catalog silently. No change ticket, no maintenance window, parent is cmd.exe spawned by an unknown service.", "options": [{"t": "Escalate — destructive, unexplained, outside any window", "ok": true}, {"t": "Close — wbadmin is a native tool", "ok": false}, {"t": "Close — it is only a catalog, backups are intact", "ok": false}]}, {"title": "ALERT-C — LAB-WS-7 — REAgentC.exe /disable", "prio": "MEDIUM", "body": "A technician ran REAgentC.exe /disable at 22:20 inside approved change CHG-2145 (lab golden-image refresh, 22:00–23:00). The change text explicitly says WinRE is removed from the new image.", "options": [{"t": "Close — planned change verified against CHG-2145", "ok": true}, {"t": "Escalate — REAgentC is always an attack", "ok": false}, {"t": "Ignore the alert without checking the ticket", "ok": false}]}, {"title": "ALERT-D — AWS — DeleteSnapshot dev-vm-14 by snapshot-janitor", "prio": "LOW", "body": "CloudTrail shows DeleteSnapshot on one dev VM by the documented 'snapshot-janitor' automation identity, on the scheduled retention day.", "options": [{"t": "Close — legitimate automation on the retention schedule", "ok": true}, {"t": "Escalate — snapshots were deleted in the cloud", "ok": false}, {"t": "Revoke all cloud keys", "ok": false}]}]}, {"id": "H02", "type": "logview", "title": "Ticket #4471 says backup job — do you believe it?", "summary": "Sysmon + ticket + System log together", "scenario": "Friday 15:42. AN0933 fires on APP-WS-21: diskshadow ran 'delete shadows all' from PowerShell. The analyst who closed a similar alert last month left ticket #4471 in the notes, claiming 'backup verification job'. You have the Sysmon record, the ticket text, and the System log. Use the filter box if needed. Remember: a ticket proves nothing by itself — check who the parent is and what the ticket actually covers.", "question": "What is the correct handling of this alert?", "hint": "Backup products run diskshadow from their own agent binary. Which parent does the Sysmon record show? And does the ticket mention APP-WS-21 at all?", "explanation": "The correct call is escalate and verify the ticket's origin. The parent is PowerShell spawned by WINWORD.EXE — no legitimate backup product spawns diskshadow through a Word document, and real backup jobs name their agent binary as parent. Ticket #4471 is vague, does not name this host, and was opened by a contractor account two days ago — an attacker with stolen credentials can open tickets too (this is a known social-engineering trick). Closing because 'a ticket exists' or 'the tool is native' are the near-misses; rebooting destroys volatile evidence. The ParentProcessContext element exists to encode the expected parent chain — and WINWORD → powershell → diskshadow is not it.", "study": "Parent chain + ticket verification beats ticket existence. Attackers file tickets too.", "artefacts": [{"label": "ARTEFACT 1 — Ticket #4471 (opened 2 days ago by contractor 'jdev-ltd')", "mono": false, "body": "Title: Backup verification activities this month. Details: Various backup verification jobs will run on several servers. No host list attached. Approver field empty."}], "log": ["15:42:10 Sysmon EventCode=1 WINWORD.EXE -> powershell.exe", "15:42:10 Sysmon EventCode=1 powershell.exe -> diskshadow.exe \"delete shadows all\"", "15:42:31 System 7036 VSS service stopped", "15:42:36 System 7036 SwPrv service stopped", "15:43:02 Sysmon EventCode=1 powershell.exe -> whoami.exe"], "options": [{"t": "Escalate — parent chain is wrong for a backup job and the ticket does not cover this host", "ok": true}, {"t": "Close — ticket #4471 mentions backup verification", "ok": false}, {"t": "Close — diskshadow is a native Windows tool", "ok": false}, {"t": "Reboot APP-WS-21 to stop the activity", "ok": false}]}, {"id": "H03", "type": "dnd", "title": "Which mutable element fixes which false-positive problem?", "summary": "Six tuning problems, six knobs", "scenario": "The detection backlog has six tuning problems, one per analytic. Each problem needs exactly one mutable element of DET0329. Match them. Wrong knob choices create new gaps instead of fixing noise — that is what makes this mapping worth memorising.", "question": "Drag each problem onto the mutable element that solves it.", "hint": "Four of the six zone names literally describe the problem they solve. For the rest, match the noun in each problem — burst, variant, chain, accounts, VMs, tool identity — to the element that owns it.", "explanation": "The matches follow the mutable element descriptions on the DET0329 page: a burst of registry changes must be grouped over a short interval → TimeWindow; new flag spellings like -delete need pattern updates → CommandLinePattern; a known agent spawning diskshadow is a parent-chain allow-list case → ParentProcessContext; watching only root/sudo on Linux is ShellProcessUser; scoping ESXi alerts to critical VM names is TargetVMNames; and separating the vendor backup tool from unknown cloud clients is UserAgent. Note what is NOT here: deleting utilities from the list or disabling analytics — tuning adjusts the edges, it never removes the core behaviour.", "study": "Ten elements, one sentence each — recite them from the DET0329 page.", "zones": [{"id": "Z1", "t": "TimeWindow"}, {"id": "Z2", "t": "CommandLinePattern"}, {"id": "Z3", "t": "ParentProcessContext"}, {"id": "Z4", "t": "ShellProcessUser"}, {"id": "Z5", "t": "TargetVMNames"}, {"id": "Z6", "t": "UserAgent"}], "items": [{"id": "I1", "t": "Six registry changes in two minutes should count as one burst", "zone": "Z1"}, {"id": "I2", "t": "A variant tool uses -delete instead of /delete for shadows", "zone": "Z2"}, {"id": "I3", "t": "The backup suite runs diskshadow from its own agent every night", "zone": "Z3"}, {"id": "I4", "t": "Only root and sudo accounts should matter on the Linux hosts", "zone": "Z4"}, {"id": "I5", "t": "Snapshot cleanup alerts fire for 200 lab VMs nobody protects", "zone": "Z5"}, {"id": "I6", "t": "The vendor backup tool is flagged as an unknown cloud client", "zone": "Z6"}]}, {"id": "H04", "type": "qcm", "title": "REAgentC /disable on fifty thin clients — in scope?", "summary": "Disable-recovery via REAgentC", "scenario": "A desktop engineer pushes a disk-cleanup script to 50 thin clients. The script runs REAgentC.exe /disable to 'free the recovery partition'. AN0933 alerts on the first host. The engineer argues: 'REAgentC only manages WinRE, and WinRE is not a backup — the analytic is misfiring.'", "question": "Is this behaviour in scope of AN0933, and does the engineer's argument hold?", "hint": "Read the AN0933 description again: delete shadow copies, DISABLE RECOVERY, or remove backup catalogs. What does /disable do to WinRE?", "explanation": "It is in scope and fires: REAgentC is one of the six utilities in the AN0933 list, and /disable turns off WinRE — the Windows Recovery Environment — which is exactly a 'disable recovery' action. The engineer's argument fails because T1490 is not only about backups: it covers disabling the features that repair a corrupted system, and WinRE is one of them. The correct handling is to stop the mass deployment, verify with the desktop team, and re-enable with 'reagentc /enable' (the MITRE M1028 guidance) — not to tune the analytic away.", "study": "M1028 (Operating System Configuration): keep WinRE enabled with reagentc /enable.", "options": [{"t": "In scope — /disable disables WinRE, a recovery feature; it fires", "ok": true}, {"t": "Out of scope — REAgentC never touches recovery", "ok": false}, {"t": "Out of scope — only shadow copies count as recovery", "ok": false}, {"t": "In scope, but it must not fire for admins", "ok": false}]}, {"id": "H05", "type": "decision", "title": "Three-step call: 40 snapshots removed on a Friday", "summary": "hostd evidence, pattern deviation, least regret", "scenario": "15:42 Friday. esxi:hostd on cluster PROD-CL-01 shows vim-cmd vmsvc/snapshot.removeall executed for 40 production VMs in one session. The storage team points at ticket STOR-882 'quarterly snapshot cleanup'. Work the three steps and choose the least-regret actions.", "question": "Make the correct call in all three steps.", "hint": "Step 1: compare the session against the documented cleanup pattern. Step 2: the schedule and scope both deviate. Step 3: what preserves evidence and stops more deletion without destroying anything?", "explanation": "Step 1: first compare the session against the documented pattern (TargetVMNames scope, schedule, source account) — not reboot, not log deletion. Step 2: cleanup normally touches 3–5 lab VMs on Sundays at 02:00 under the service account; today 40 production VMs were hit on a Friday at 15:42 from an admin session — both scope and schedule deviate, so 'ticket exists' is the trap; treat it as suspect. Step 3: the least-regret actions are preserving hostd logs off-host, escalating, and freezing snapshot deletion via vCenter permissions — rebooting hides evidence and running removeall again destroys more. The AN0935 TargetVMNames element is precisely the scope control that makes deviations like this visible.", "study": "Pattern = scope + schedule + actor. A deviation in one dimension is noise; in two, it is a signal.", "steps": [{"question": "Step 1: your first move with the hostd session and ticket STOR-882?", "options": [{"t": "Compare scope, schedule and account against the documented cleanup pattern", "ok": true}, {"t": "Reboot the ESXi host to stop the session", "ok": false}, {"t": "Archive the alert — a ticket exists", "ok": false}]}, {"lead": "The documented cleanup: 3–5 lab VMs, Sundays 02:00, service account. Today: 40 production VMs, Friday 15:42, admin session.", "question": "Step 2: what does this deviation mean?", "options": [{"t": "Both scope and schedule deviate — treat as suspect despite the ticket", "ok": true}, {"t": "Nothing — a ticket makes any scope acceptable", "ok": false}, {"t": "It is fine because 15:42 is close enough to 02:00", "ok": false}]}, {"lead": "You treat the session as suspect. The deletions are ongoing.", "question": "Step 3: which action set has the least regret?", "options": [{"t": "Preserve hostd logs off-host, escalate, freeze snapshot deletion via permissions", "ok": true}, {"t": "Reboot the host immediately", "ok": false}, {"t": "Run snapshot.removeall again to confirm reproducibility", "ok": false}]}]}, {"id": "H06", "type": "spot", "title": "Spot the line that misses the wmic variant", "summary": "CommandLinePattern word order", "scenario": "A purple-team test ran 'wmic shadowcopy delete' on a host, but AN0933 did not alert. The vssadmin and wbadmin variants alert fine. The rule draft below has four numbered lines; one line's pattern only matches the diskshadow/vssadmin word order and misses the wmic one. Find it.", "question": "Which line number contains the mistake?", "hint": "Line 1 lists the right utilities. Compare 'delete shadows' with 'shadowcopy delete' — which line only knows one order?", "explanation": "Line 3 is the mistake: its pattern matches 'delete shadows' (vssadmin/diskshadow order) but not 'shadowcopy delete' (the wmic word order), so wmic-based deletion sails through. The AN0933 CommandLinePattern element exists exactly to tune for such variants — the DET0329 page names /all, /quiet and -delete as examples of flags to catch, and real operators reorder words. Lines 1, 2 and 4 are correct (utility list, EventCode=1 source, quiet-flag coverage). A missing variant is a silent gap: the analytic looks healthy in dashboards while one whole family of commands evades it.", "study": "Test CommandLinePattern with all observed word orders: 'delete shadows', 'shadowcopy delete', 'delete catalog'.", "artefacts": [{"label": "ARTEFACT 1 — AN0933 rule draft", "mono": true, "body": "1  process_name IN (vssadmin.exe, wbadmin.exe, diskshadow.exe, bcdedit.exe, REAgentC.exe, wmic.exe)\n2  source=WinEventLog:Sysmon EventCode=1\n3  cmdline MATCHES (delete shadows|delete catalog|recoveryenabled)\n4  cmdline MATCHES (/quiet|-quiet|/all)"}], "options": [{"t": "Line 1", "ok": false}, {"t": "Line 2", "ok": false}, {"t": "Line 3", "ok": true}, {"t": "Line 4", "ok": false}]}, {"id": "H07", "type": "fill", "title": "Complete the AN0936 network-device logic", "summary": "erase, format, reload — in sequence", "scenario": "The AN0936 analytic for network devices has a precise trigger shape. Your SIEM colleague asks you to say it in one sentence before she builds the sequence matcher. Fill the four blanks from the word bank — two distractors are near-misses that would break the logic.", "question": "Fill the four blanks using the word bank.", "hint": "Three commands, one order, a short time frame, and a specific kind of session. 'Idle' and 'standard' are the traps.", "explanation": "The completed logic: AN0936 fires when erase, format and reload appear in immediate sequence from a privileged AAA session. Every word matters: the three commands together mean 'wipe the file system and reboot the device' (the network-device flavour of T1490); 'immediate sequence' and the CommandSequenceWindow element make sure the commands are causally linked, not weeks apart; and 'privileged AAA session' (UserPrivilegeLevel) keeps helpdesk-level commands from firing the analytic. Dropping 'privileged' or 'immediate' would flood the queue with routine device work.", "study": "AN0936 = erase → format → reload, immediate, privileged AAA. Mutable: CommandSequenceWindow, UserPrivilegeLevel.", "parts": ["AN0936 fires when erase, ", " and ", " appear in immediate ", " from a ", " AAA session."], "bank": ["format", "reload", "sequence", "privileged", "idle", "standard"], "answers": ["format", "reload", "sequence", "privileged"]}, {"id": "H08", "type": "match", "title": "Match each command to the correct verdict", "summary": "Fires, or does not fire — and why", "scenario": "Four commands from this week's telemetry, four verdicts. Two of them are classic near-misses: one is read-only, one lacks its destructive argument. The other two are destructive T1490 actions with different targets. Match each command to its verdict under AN0933's logic.", "question": "Match each command to the verdict that AN0933 would produce.", "hint": "'list' never destroys. An interactive shell opened with no subcommand logged has no argument to match. bcdedit with ignoreallfailures disables repair-on-failure — that is 'disable recovery'.", "explanation": "'vssadmin list shadows' is read-only — AN0933 does not fire (the near-miss: it contains vssadmin). 'diskshadow' with no logged subcommand has no destructive argument — no fire (the second near-miss). 'wmic shadowcopy delete' deletes shadow copies through WMI — fires. 'bcdedit /set {default} bootstatuspolicy ignoreallfailures' tells Windows to ignore failed boots instead of repairing — a disable-recovery action — fires, and blocking it is why M1038 (System Integrity Protection) and M1028 (Operating System Configuration) matter for this technique. The pattern is always utility + argument: one without the other is not T1490 behaviour.", "study": "Recite: vssadmin delete fires, vssadmin list does not; diskshadow needs its 'delete shadows all' script line.", "left": [{"id": "L1", "t": "vssadmin list shadows", "match": "R1"}, {"id": "L2", "t": "diskshadow (interactive shell opened, no subcommand logged)", "match": "R2"}, {"id": "L3", "t": "wmic shadowcopy delete", "match": "R3"}, {"id": "L4", "t": "bcdedit /set {default} bootstatuspolicy ignoreallfailures", "match": "R4"}], "right": [{"id": "R1", "t": "Read-only listing — does not fire"}, {"id": "R2", "t": "No destructive argument logged — does not fire on its own"}, {"id": "R3", "t": "Fires — shadow deletion through WMI"}, {"id": "R4", "t": "Fires — disables automatic repair on boot failures"}]}, {"id": "H09", "type": "query", "title": "Query editor: build the AN0933 base search", "summary": "From analytic logic to SIEM search", "scenario": "You own AN0933 now. The environment: Splunk-style search over index=sysmon (Windows Sysmon data), fields: EventCode, process_name (called Image), CommandLine (called cmdline). The objective: select process-creation events where one of the six recovery utilities runs with a destructive argument (deleting shadows or catalogs, or disabling recovery). No syntax panel this time — you get the objective and the environment, nothing else. The normaliser ignores case and extra spaces; it checks that your search contains every required element.", "question": "Type a search that contains all four required elements, then press Check.", "hint": "The four elements: the index, the process-creation event code, the utility family, and the destructive verb family.", "explanation": "The canonical search is: index=sysmon EventCode=1 (vssadmin OR wbadmin OR diskshadow OR bcdedit OR REAgentC OR wmic) (\"delete shadows\" OR \"delete catalog\" OR \"shadowcopy delete\" OR recoveryenabled OR bootstatuspolicy). Element by element: index=sysmon selects the right data source; EventCode=1 keeps only process-creation records (DC0032); the utility group covers the six native tools from the AN0933 list; the destructive group covers the watched actions (shadow deletion, catalog removal, recovery disabling). Avoid the traps: EventCode=13 is registry modification, 4688 belongs to the Security log, and format/erase belong to the network-device analytic AN0936, not to Windows process chains.", "study": "Every analytic search needs: source filter + event type + actor set + behaviour pattern.", "editorPrompt": "search", "editorNote": "Splunk-style. Case-insensitive check of required elements.", "placeholder": "index=sysmon EventCode=1 ...", "elements": [{"re": "index\\s*=\\s*sysmon", "label": "Searches index=sysmon", "why": "The Sysmon index is the Windows data source for process chains."}, {"re": "eventcode\\s*=\\s*1\\b", "label": "Filters EventCode=1 (process creation)", "why": "AN0933 watches process chains, which arrive as Sysmon EventCode=1 (DC0032)."}, {"re": "(vssadmin|wbadmin|diskshadow|bcdedit|reagentc|wmic)", "label": "Includes the recovery utility family", "why": "At least one of the six AN0933 utilities must be named."}, {"re": "(delete|recoveryenabled|bootstatuspolicy|shadowcopy)", "label": "Includes the destructive-action pattern", "why": "Utility alone is not enough — the destructive verb or recovery-disable keyword must be present."}], "bad": [{"re": "(format|reload)", "label": "Uses network-device commands (format/reload)", "why": "erase/format/reload belong to AN0936, not to Windows process chains."}, {"re": "eventcode\\s*=\\s*13\\b", "label": "Filters EventCode=13 as the process event", "why": "13 is registry modification; process creation is EventCode=1."}, {"re": "(hostd|cloudtrail|auditd)", "label": "Queries a non-Windows source", "why": "AN0933 runs on WinEventLog:Sysmon data only."}], "canonical": "index=sysmon EventCode=1 (vssadmin OR wbadmin OR diskshadow OR bcdedit OR REAgentC OR wmic)\n(\"delete shadows\" OR \"delete catalog\" OR \"shadowcopy delete\" OR recoveryenabled OR bootstatuspolicy)"}, {"id": "H10", "type": "order", "title": "Reconstruct the wbadmin incident for the report", "summary": "Five steps, timestamps lost in the export", "scenario": "After containing the incident on SRV-DB-02 you write the report's timeline. The SIEM export lost its timestamp column, so the order must come from causality alone: staging happens before execution, a destructive command before the event that proves its effect, and the last recovery path is closed last. Five observed steps from two sources are below — put them in the order the attacker performed them.", "question": "Order the five observed steps from first to last.", "hint": "Two of the five records are reactions, not actions — the catalog event and the service stop both follow commands that caused them.", "explanation": "The causal order: (1) a new scheduled task 'WinBackupMgmt' is created — staging always comes first, because the task is what later runs the destructive command; (2) the task launches cmd.exe, which runs wbadmin delete catalog -quiet — the first destructive command; (3) Microsoft-Windows-Backup records the catalog deletion — the effect that proves the command landed (the DC0040 outcome record); (4) the System log shows the VSS service entering stopped state after a net stop — a secondary effect that removes the shadow subsystem while the attacker still holds the host; (5) bcdedit /set {default} bootstatuspolicy ignoreallfailures — disabling boot repair as the final hardening step. Reading reactions as actions is the classic ordering mistake: the catalog event and the service stop cannot precede the commands that caused them. This staging → execution → effect → secondary effect → hardening shape is what IR uses to hunt the same chain on other hosts.", "study": "Staging → command → effect → secondary effect → hardening: that order repeats across T1490 incidents.", "items": [{"id": "O1", "t": "A new scheduled task 'WinBackupMgmt' is created (Sysmon EC=1)"}, {"id": "O2", "t": "cmd.exe runs wbadmin delete catalog -quiet (Sysmon EC=1)"}, {"id": "O3", "t": "Backup catalog deletion recorded (Microsoft-Windows-Backup)"}, {"id": "O4", "t": "VSS service enters stopped state after a net stop (System log)"}, {"id": "O5", "t": "bcdedit /set {default} bootstatuspolicy ignoreallfailures (Sysmon EC=1)"}], "correct": ["O1", "O2", "O3", "O4", "O5"]}, {"id": "H11", "type": "multi", "title": "Select the true coverage gaps of DET0329", "summary": "What the strategy cannot see", "scenario": "A red-team after-action report says three attacks 'evaded DET0329 as designed'. The detection review must separate the TRUE gaps of the strategy from statements that are simply wrong about what the analytics cover. Select every true gap statement.", "question": "Select all statements that describe a real coverage gap of DET0329.", "hint": "One gap is about a deletion method that never produces a command line. Two gaps are platforms. Three options describe things the analytics actually DO cover.", "explanation": "True gaps: (1) shadow deletion through the COM interface IVssBackupComponents (used by the Diavol family) never spawns a command line, so the AN0933 CommandLinePattern cannot see it — a compensating detection must watch the VSS service or API activity instead; (2) macOS has no analytic in DET0329; (3) Containers have no analytic either, although the T1490 technique page lists them. The false statements: ESXi snapshot removal IS covered (AN0935 via hostd), auditd:SYSCALL DOES feed AN0934, and DeleteBucket IS visible to AN0937 through DC0022 Cloud Storage Deletion. Knowing the gaps is what turns a detection review into compensating controls instead of false confidence.", "study": "For every gap, name a compensating control: API/activity monitoring for COM, EDR coverage for macOS, runtime monitoring for containers.", "options": [{"t": "COM-based shadow deletion (IVssBackupComponents) leaves no command line to match", "ok": true}, {"t": "macOS systems have no analytic in DET0329", "ok": true}, {"t": "Containers have no analytic in DET0329", "ok": true}, {"t": "ESXi snapshot removal is not covered by any analytic", "ok": false}, {"t": "auditd:SYSCALL does not feed the Linux analytic", "ok": false}, {"t": "DeleteBucket calls are invisible to the cloud analytic", "ok": false}]}, {"id": "H12", "type": "qcm", "title": "Does the AN0936 sequence fire with this timing?", "summary": "CommandSequenceWindow arithmetic", "scenario": "On core switch SW-CORE-01, an AAA session with privilege 15 runs: erase at 10:04:00, format at 10:07:00, reload at 10:13:00. Your AN0936 deployment uses CommandSequenceWindow = 5 minutes between erase and reload to establish causality. A colleague says: 'Erase and format are within 5 minutes, so it fires.'", "question": "Does the analytic fire as configured?", "hint": "The window is defined between which two commands? Count from erase to reload.", "explanation": "It does not fire as configured: the CommandSequenceWindow is the time between the erase and the reload command, and here that gap is 9 minutes — beyond the 5-minute window — so the causality link fails. The colleague's near-miss counts erase→format (3 minutes), but the analytic defines causality across the whole wipe-and-reboot sequence. The right engineering response is not to force a match but to review the window: 9 minutes may be legitimate on a large device, so tune CommandSequenceWindow deliberately (and document it) rather than assuming the analytic is broken.", "study": "CommandSequenceWindow = erase → reload. The DET0329 page defines it as the causality clock of AN0936.", "options": [{"t": "No — erase-to-reload is 9 minutes, outside the 5-minute window", "ok": true}, {"t": "Yes — erase and format are within 5 minutes", "ok": false}, {"t": "Yes — privileged AAA sessions always fire the analytic", "ok": false}, {"t": "No — format must come before erase", "ok": false}]}, {"id": "H13", "type": "logview", "title": "One tune to cut the chattr noise without losing coverage", "summary": "auditd chattr false positives", "scenario": "Since the new snapshot-cleanup script deployed, AN0934 fires hourly: the script runs chattr +i on /var/snapshots paths as the NON-ROOT service account 'svc-snap'. Real attacks on these hosts run as root. The queue is flooded. Filter the auditd sample to see the pattern, then choose the single tune that cuts the noise while keeping coverage of true attacks.", "question": "Which single tuning change is correct?", "hint": "The benign script and a real attacker differ in one field the analytic can watch: the user. Which mutable element tunes users?", "explanation": "The correct tune is ShellProcessUser: restrict the chattr watch to root/sudo users. The benign script runs as svc-snap (non-root), so the restriction removes the hourly noise, while a real attacker — who needs privileges to damage recovery files — runs as root or sudo and still fires. The near-misses all burn coverage: removing chattr from the watched commands blinds you to immutability abuse (a documented T1494/AN0934 behaviour), narrowing WatchedFilePaths to /boot/efi only loses /etc/systemd and fstab coverage, and disabling CONFIG_CHANGE removes the deletion events entirely.", "study": "ShellProcessUser restricts the Linux watch by account — the cleanest FP lever when privilege separates good from bad.", "log": ["2026-09-28T09:00:01Z DB-LNX-07 auditd SYSCALL exe=/usr/bin/chattr op=\"+i\" path=/var/snapshots/lvm0 user=svc-snap", "2026-09-28T10:00:02Z DB-LNX-07 auditd SYSCALL exe=/usr/bin/chattr op=\"+i\" path=/var/snapshots/lvm0 user=svc-snap", "2026-09-28T10:00:03Z DB-LNX-07 auditd SYSCALL exe=/usr/bin/rm path=/var/snapshots/tmp/lck user=svc-snap", "2026-09-28T11:14:55Z DB-LNX-07 auditd SYSCALL exe=/usr/bin/sudo user=svc-snap cmd=\"chattr +i /etc/fstab\" (denied)", "2026-09-28T02:11:07Z DB-LNX-07 auditd SYSCALL exe=/usr/bin/chattr op=\"+i\" path=/boot/efi user=root"], "options": [{"t": "Restrict ShellProcessUser to root/sudo accounts", "ok": true}, {"t": "Remove chattr from the watched command list", "ok": false}, {"t": "Narrow WatchedFilePaths to /boot/efi only", "ok": false}, {"t": "Stop collecting auditd:CONFIG_CHANGE", "ok": false}]}, {"id": "H14", "type": "qcm", "title": "The weekly diskshadow runbook — least aggressive correct action", "summary": "Alarming-looking but benign", "scenario": "Every Wednesday 13:00, the storage team's documented runbook runs a diskshadow script from the storage agent (parent C:\\Program Files\\StoreGuard\\sgagent.exe) on two file servers. AN0933 fires weekly and the team is annoyed. Some colleagues want hard measures. The runbook is verified, signed, and in the CMDB.", "question": "Which action is the least aggressive correct one?", "hint": "The behaviour is verified benign and stable in time and parent. What removes ONLY this pattern from the queue?", "explanation": "The least aggressive correct action is allow-listing the sgagent → diskshadow parent chain in ParentProcessContext for the two servers and the scheduled time. It removes exactly the documented pattern and nothing else: any diskshadow from powershell, cmd, or Office documents still alerts. Isolating the servers every Wednesday is absurd and harmful; disabling VSS to stop the alerts destroys a recovery feature the company needs; and 'close every diskshadow alert manually forever' wastes analyst time and normalises ignoring the analytic. Tuning exists to encode verified truth, not to silence warnings.", "study": "Least aggressive = narrowest change that encodes the verified benign pattern.", "options": [{"t": "Allow-list the sgagent parent chain and schedule in ParentProcessContext", "ok": true}, {"t": "Isolate both file servers every Wednesday", "ok": false}, {"t": "Disable the VSS service to stop the alerts", "ok": false}, {"t": "Mark every diskshadow alert as closed automatically", "ok": false}]}, {"id": "H15", "type": "triage", "title": "Costs attached: choose with the business in mind", "summary": "Three alerts, three cost levels", "scenario": "Three alerts, each with a business cost attached to a wrong move. Alert 1 hits a domain controller during the board-meeting morning. Alert 2 is a confirmed cloud destruction chain. Alert 3 is a lab switch. Aggressive actions cost money and trust; passive actions can lose the incident. Choose correctly.", "question": "Choose the correct action for each of the three alerts.", "hint": "Verify cheaply before expensive moves on critical hosts; move fast when destruction is confirmed; and never skip verification even when the context looks silly.", "explanation": "Alert 1: on a DC during a board morning, the correct action is verify read-only (confirm the parent chain, check the ticket, alert IR) and prepare isolation with communications ready — isolating instantly can interrupt authentication org-wide, and closing risks the incident. Alert 2: destruction is CONFIRMED (DeleteVolume on the production vault plus TerminateInstances) — declare a major incident and engage the cloud team immediately; waiting or treating it as lifecycle is the expensive mistake here. Alert 3: erase on a lab switch in a training week — verify the AAA user and the lab exercise record first; the near-miss is escalating as an attack without checking the trivially available context.", "study": "Confirmed destruction = act. Unconfirmed pattern on critical host = verify cheap, prepare, communicate.", "alerts": [{"title": "ALERT-1 — DC-02 — vssadmin delete shadows /all /quiet", "prio": "HIGH", "body": "Board-meeting morning. Parent chain is unusual (powershell from a scheduled task created last night). Isolating DC-02 interrupts branch-office authentication for about 40 minutes.", "options": [{"t": "Verify read-only now, alert IR, prepare isolation with comms ready", "ok": true}, {"t": "Isolate DC-02 immediately without any check", "ok": false}, {"t": "Close — DCs run shadow cleanup daily", "ok": false}]}, {"title": "ALERT-2 — AWS — DeleteVolume on prod vault + TerminateInstances", "prio": "CRITICAL", "body": "CloudTrail confirms DeleteVolume against the production backup vault and TerminateInstances on two database servers, from an identity that also suspended versioning 6 minutes earlier. Destruction is confirmed, not suspected.", "options": [{"t": "Declare a major incident and engage the cloud team now", "ok": true}, {"t": "Treat as storage lifecycle noise", "ok": false}, {"t": "Wait for the next business day to escalate", "ok": false}]}, {"title": "ALERT-3 — SW-LAB-3 — erase started by intern account", "prio": "LOW", "body": "'erase' ran on lab switch SW-LAB-3 from an intern's AAA account during training week. The lab is isolated from production.", "options": [{"t": "Verify the AAA session and the training exercise record first", "ok": true}, {"t": "Escalate as a full security incident immediately", "ok": false}, {"t": "Ignore — interns cannot do damage anywhere", "ok": false}]}]}, {"id": "H16", "type": "qcm", "title": "The auto-close rule that attackers learned to love", "summary": "Best practice that failed", "scenario": "To cut the queue, the team introduced a rule: 'Close every AN0933 alert whose host has an open change ticket.' It worked for six months. Then an incident review found that an attacker with stolen credentials had opened a generic ticket ('routine server maintenance') two days before running wbadmin delete catalog -quiet on three file servers. The rule auto-closed all three alerts.", "question": "What is the core lesson for the tuning policy?", "hint": "The ticket existed and was even true in wording. What did the rule never check about the ticket?", "explanation": "The lesson: a ticket's existence is not verification — the tuning policy must check the ticket's scope (which hosts, which hosts' recovery features), author, and approval, and destructive-pattern alerts should require human review regardless of ticket presence. The attacker did not need to hack the ticketing system; opening a vague ticket is trivial with valid credentials. The near-miss lessons ('never trust tickets', 'never tune') overshoot: tickets remain valuable context, and tuning remains necessary — the rule failed because it outsourced verification to a field attackers can write.", "study": "Verify scope + author + approval. Destructive T1490 patterns always get human eyes.", "options": [{"t": "Ticket presence is not verification — check scope, author, approval, and keep human review", "ok": true}, {"t": "Tickets are useless — never open or read them", "ok": false}, {"t": "All tuning is dangerous — disable every allow-list", "ok": false}, {"t": "Only workstations need T1490 alerts", "ok": false}]}];

/* ================= UTILITIES ================= */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmt2(x){return (Math.round(x*100)/100).toFixed(2);}
function $(id){return document.getElementById(id);}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function letters(n){var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';return L.charAt(n%26);}

/* Partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

  phase:'intro',          /* intro | exam | review | results */
  manualPauseStart:null,
  order:[],               /* shuffled exercise indices */
  cur:0,                  /* position in order */
  answered:{},            /* exId -> credit (float) */
  answeredFlags:{},       /* exId -> true (checked) */
  autoPauseStart:null,
  skipped:[],             /* exIds currently in skipped pool */
  everSkipped:{},         /* exId -> true */
  hintUsed:{},            /* exId -> true */
  reviewed:false,         /* visited review screen at end */
  reviewMode:null,        /* exId being answered from review */
  reported:false,
  manualPauseTotal:0,     /* seconds */
  autoPauseTotal:0,       /* seconds */
  user:{name:'',country:'',locale:'en'}
};

var TIMER = {
  total: META.timerSeconds,
  remaining: META.timerSeconds,
  state:'IDLE',           /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  interval:null,
  perEx:0,                /* per-exercise remaining (EXTREMELY HARD query only) */
  perExTotal:0
};

function timerSet(st){
  TIMER.state=st;
  var el=$('tstate');
  if(el){
    var map={
      IDLE:['&#96;','READY','end'],
      RUNNING:['&#9654;','RUNNING','run'],
      PAUSED_MANUAL:['&#10073;&#10073;','PAUSED — manual (press Resume)','pman'],
      PAUSED_AUTO_CHECK:['&#10073;&#10073;','PAUSED — reviewing feedback (resumes on Next)','pauto'],
      ENDED:['&#9632;','ENDED','end']
    };
    var m=map[st]||map.IDLE;
    el.className='tstate '+m[2];
    el.innerHTML='<span aria-hidden="true">'+m[0]+'</span> <span>'+m[1]+'</span>';
    el.setAttribute('aria-label','Timer state: '+m[1]);
  }
}
function timerStartTicks(){
  if(TIMER.interval){return;}
  TIMER.interval=setInterval(function(){
    if(TIMER.state!=='RUNNING'){return;}
    TIMER.remaining-=1;
    if(TIMER.perExTotal>0 && !$('exwrap').classList.contains('hidden')){
      TIMER.perEx=Math.max(0,TIMER.perEx-1);
      var pe=$('perextime');
      if(pe){pe.textContent=fmtClock(TIMER.perEx);}
      if(TIMER.perEx===0){onPerExExpired();}
    }
    if(TIMER.remaining<=0){
      TIMER.remaining=0;
      timerEnded();
    }
    updateHeader();
  },1000);
}
function timerEnded(){
  clearInterval(TIMER.interval);TIMER.interval=null;
  timerSet('ENDED');
  finishExam(true);
}
function updateHeader(){
  $('tclock').textContent=fmtClock(TIMER.remaining);
  var sum=0,cnt=0;
  for(var k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];cnt++;}}
  $('scoreval').innerHTML='<span class="score-sum">'+fmt1(sum)+'</span> <span class="dim">/ '+cnt+'</span>';
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  $('scorepct').textContent=pct+'%';
  var done=S.cur;
  if(S.phase==='review'||S.phase==='results'){done=S.order.length;}
  $('barfill').style.width=Math.round(100*Math.min(1,done/S.order.length))+'%';
}

function setSeverity(sev){
  var b=$('sevbadge');
  var cls={'easy':'sev-easy','medium':'sev-medium','hard':'sev-hard','extremely-hard':'sev-extreme'}[sev]||'sev-easy';
  var word={'easy':'EASY','medium':'MEDIUM','hard':'HARD','extremely-hard':'EXTREMELY HARD'}[sev]||sev;
  b.className='badge '+cls;
  b.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+word+'</span>';
  document.documentElement.style.setProperty('--sev-col',
    {'easy':'var(--sev-easy)','medium':'var(--sev-medium)','hard':'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'}[sev]);
  var b2=$('sevbadge2');
  if(b2){b2.className='badge '+cls;b2.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+word+'</span>';}
}

/* ================= EXAM FLOW ================= */
function startExam(){
  S.phase='exam';S.cur=0;S.order=[];
  var idx=[];for(var i=0;i<EXERCISES.length;i++){idx.push(i);}
  S.order=shuffle(idx);
  S.answered={};S.answeredFlags={};S.skipped=[];S.everSkipped={};S.hintUsed={};
  S.reviewed=false;S.reviewMode=null;S.reported=false;
  S.manualPauseTotal=0;S.autoPauseTotal=0;S.autoPauseStart=null;S.manualPauseStart=null;
  S.answers={};S.results={};S.dec={};CURSEL=[];
  for(var r=0;r<EXERCISES.length;r++){
    delete EXERCISES[r]._shufOpts;delete EXERCISES[r]._shufR;
    delete EXERCISES[r]._shufItems;delete EXERCISES[r]._shufOrder;delete EXERCISES[r]._shufBank;
  }
  TIMER.total=META.timerSeconds;TIMER.remaining=META.timerSeconds;
  timerSet('RUNNING');timerStartTicks();
  $('intro').classList.add('hidden');
  $('results').classList.add('hidden');
  $('review').classList.add('hidden');
  $('exam').classList.remove('hidden');
  $('hdrbar').classList.remove('hidden');
  $('bar').classList.remove('hidden');
  renderCurrent();
}
function currentExercise(){
  if(S.reviewMode){return byId(EXERCISES,S.reviewMode);}
  return EXERCISES[S.order[S.cur]];
}
function isLastPosition(){
  return S.cur>=S.order.length-1;
}
function renderCurrent(){
  var ex=currentExercise();
  if(!ex){finishExam(false);return;}
  var posLabel=S.reviewMode?('Reviewing a skipped exercise'):(S.reviewed?'Review skipped':'Exercise '+(S.cur+1)+' of '+S.order.length);
  $('excount').textContent=posLabel;
  var per='';
  if(ex.perTimeSec && !S.answeredFlags[ex.id]){
    TIMER.perEx=ex.perTimeSec;TIMER.perExTotal=ex.perTimeSec;
    per='<div class="small dim" style="margin-top:6px">&#9201; This exercise has its own reduced timer: <b id="perextime" class="mono">'+fmtClock(TIMER.perEx)+'</b> ('+Math.round(ex.perTimeSec/60)+' min). It stops while feedback is open and resumes on Next.</div>';
  }else{TIMER.perExTotal=0;TIMER.perEx=0;}
  $('exwrap').innerHTML='<div class="card">'+per+'<div id="exbody"></div></div>';
  renderExercise(ex);
  updateHeader();
}
function onPerExExpired(){
  if(TIMER.perExTotal===0){return;}
  TIMER.perExTotal=0;TIMER.perEx=0;
  var ex=currentExercise();
  if(ex && !S.answeredFlags[ex.id]){
    if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
    toastSkipped(ex);
    if(S.reviewMode){exitReview();}else{advanceNext(false);}
  }
}
function toastSkipped(ex){
  var t=$('toast');
  t.innerHTML='<span class="sicon">&#9888; Skipped</span> — “'+esc(ex.title)+'” moved to the skipped pool. You can return to it before you submit.';
  t.classList.remove('hidden');
  clearTimeout(toastSkipped._t);
  toastSkipped._t=setTimeout(function(){t.classList.add('hidden');},4200);
}

/* Manual pause */
function togglePause(){
  if(S.phase!=='exam'&&S.phase!=='review'){return;} /* no manual pause on intro/results */
  var ov=$('pauseov');
  if(TIMER.state==='PAUSED_MANUAL'){
    ov.classList.add('hidden');
    if(S.manualPauseStart){S.manualPauseTotal+=Math.round((Date.now()-S.manualPauseStart)/1000);S.manualPauseStart=null;}
    if(S.pausedFrom==='PAUSED_AUTO_CHECK'){timerSet('PAUSED_AUTO_CHECK');}
    else{timerSet('RUNNING');}
    S.pausedFrom=null;
  }else{
    if(TIMER.state==='ENDED'){return;} /* too late to pause */
    S.pausedFrom=TIMER.state==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':null;
    S.manualPauseStart=Date.now();
    timerSet('PAUSED_MANUAL');
    ov.classList.remove('hidden');
  }
}

/* Hint */
function useHint(){
  var ex=currentExercise();
  if(!ex||S.hintUsed[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var hp=$('hintpanel');
  hp.classList.remove('hidden');
  hp.innerHTML='<div class="ht"><span aria-hidden="true">&#128161;</span><span>HINT — costs 10% of this exercise credit</span></div><div>'+esc(ex.hint)+'</div>';
  $('hintbtn').disabled=true;
}

/* Skip */
function skipCurrent(){
  var ex=currentExercise();
  if(!ex||S.answeredFlags[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  S.everSkipped[ex.id]=true;
  if(S.reviewMode){exitReview();}
  else{advanceNext(false);}
}

/* Advance to next exercise or review/results */
function advanceNext(afterCheck){
  S.reviewMode=null;
  S.cur++;
  if(S.cur>=S.order.length){
    maybeReview();
    return;
  }
  renderCurrent();
}
function maybeReview(){
  if(S.skipped.length>0 && TIMER.remaining>0 && TIMER.state!=='ENDED'){
    showReview();
  }else{
    finishExam(false);
  }
}
function showReview(){
  S.phase='review';
  $('exam').classList.add('hidden');
  $('review').classList.remove('hidden');
  var html='<div class="card"><h2 style="font-size:18px;margin:2px 0 8px"><span aria-hidden="true">&#9888;</span> Review skipped exercises</h2>'
    +'<p class="dim" style="margin:4px 0 12px">These exercises were skipped and not answered. You can go back to any of them now and answer it, as long as the timer has not ended. If you submit now, skipped exercises are excluded from your score — they do not count as correct or wrong.</p>';
  for(var i=0;i<S.skipped.length;i++){
    var ex=byId(EXERCISES,S.skipped[i]);
    html+='<div class="skiprow"><span class="sicon" aria-hidden="true">&#9888;</span>'
      +'<span class="st">Skipped — '+esc(ex.title)+'</span>'
      +'<button class="btn small" data-ans="'+esc(ex.id)+'" type="button">Answer</button></div>';
  }
  html+='</div><div class="center" style="gap:12px;flex-wrap:wrap">'
    +'<button class="btn" id="backbtn" type="button">&#8592; Back to the exam</button>'
    +'<button class="btn primary" id="submitanyway" type="button">Submit anyway — '+S.skipped.length+' will be excluded</button></div>';
  $('review').innerHTML=html;
  $('backbtn').addEventListener('click',function(){
    S.phase='exam';
    $('review').classList.add('hidden');
    $('exam').classList.remove('hidden');
    S.cur=Math.min(S.cur,S.order.length-1);
    renderCurrent();
  });
  $('submitanyway').addEventListener('click',function(){finishExam(false);});
  var btns=$('review').querySelectorAll('[data-ans]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click',function(ev){
      S.reviewMode=ev.currentTarget.getAttribute('data-ans');
      S.phase='exam';
      $('review').classList.add('hidden');
      $('exam').classList.remove('hidden');
      renderCurrent();
    });
  }
}
function exitReview(){
  S.reviewMode=null;
  showReview();
}

/* ================= FEEDBACK + NAV ================= */
function afterCheckCommon(ex,res){
  var credit=res.credit;
  if(S.hintUsed[ex.id]){credit=Math.max(0,credit-0.10);res.hintApplied=true;}
  res.credit=credit;
  S.answered[ex.id]=credit;
  S.answeredFlags[ex.id]=true;
  var pos=S.skipped.indexOf(ex.id);
  if(pos>=0){S.skipped.splice(pos,1);}
  /* Check-triggered auto-pause (state machine transition) */
  if(TIMER.state==='RUNNING'){S.autoPauseStart=Date.now();}
  if(TIMER.state!=='ENDED'){timerSet('PAUSED_AUTO_CHECK');}
  updateHeader();
}
function renderNavAfterCheck(ex){
  var nav=$('exnav');
  nav.innerHTML='';
  var last=!S.reviewMode && isLastPosition();
  var next=document.createElement('button');
  next.type='button';
  next.className='btn primary';
  next.innerHTML=S.reviewMode
    ?'&#8592; Back to skipped list'
    :(last?'Final Submit &#8594;':'Next exercise &#8594;');
  next.addEventListener('click',function(){
    if(TIMER.state==='PAUSED_AUTO_CHECK'||TIMER.state==='RUNNING'){
      if(TIMER.state==='PAUSED_AUTO_CHECK'&&S.autoPauseStart){
        S.autoPauseTotal+=Math.round((Date.now()-S.autoPauseStart)/1000);S.autoPauseStart=null;
      }
      if(TIMER.state!=='ENDED'){timerSet('RUNNING');}
    }
    if(S.reviewMode){exitReview();}
    else if(isLastPosition()){maybeReview();}
    else{advanceNext(true);}
  });
  nav.appendChild(next);
}

/* ================= FINISH + RESULTS ================= */
function finishExam(byTimeout){
  clearInterval(TIMER.interval);TIMER.interval=null;
  if(TIMER.state!=='ENDED'){timerSet('ENDED');}
  S.phase='results';
  $('exam').classList.add('hidden');
  $('review').classList.add('hidden');
  $('pauseov').classList.add('hidden');
  var results=computeResults();
  renderResults(results,byTimeout);
  $('results').classList.remove('hidden');
  if(!S.reported){reportScore(results);S.reported=true;}
  window.scrollTo(0,0);
}
function computeResults(){
  var sum=0,cnt=0,full=0,part=0,bad=0,partSum=0;
  for(var i=0;i<EXERCISES.length;i++){
    var id=EXERCISES[i].id;
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];sum+=c;cnt++;
      if(c>=0.9999){full++;}
      else if(c>0){part++;partSum+=c;}
      else{bad++;}
    }
  }
  var skippedNow=0;
  for(var j=0;j<EXERCISES.length;j++){
    var id2=EXERCISES[j].id;
    if(!S.answered.hasOwnProperty(id2)){skippedNow++;}
  }
  var percent=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,full:full,part:part,partAvg:part>0?partSum/part:0,bad:bad,skipped:skippedNow,percent:percent};
}
function renderResults(r,byTimeout){
  var passed=r.percent>=META.passMark && r.cnt>0;
  $('results').innerHTML=''
    +'<div class="card">'
    +'<div class="bigscore">'+fmt1(r.sum)+' <span class="pc">/ '+r.cnt+'</span></div>'
    +'<div style="text-align:center" class="dim">final score over answered exercises &middot; <b style="color:var(--text-primary)">'+r.percent+'%</b> (pass mark '+META.passMark+'%)</div>'
    +'<div class="resgrid">'
    +'<div class="rescard ok"><div class="rn">'+r.full+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Fully correct</span></div></div>'
    +'<div class="rescard part"><div class="rn">'+r.part+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Partially correct'+(r.part>0?' — avg '+fmt2(r.partAvg):'')+'</span></div></div>'
    +'<div class="rescard bad"><div class="rn">'+r.bad+'</div><div class="rl"><span aria-hidden="true">&#10007;</span><span>Fully incorrect</span></div></div>'
    +'<div class="rescard skipc"><div class="rn">'+r.skipped+'</div><div class="rl"><span aria-hidden="true">&#9888;</span><span>Skipped — excluded</span></div></div>'
    +'</div>'
    +(byTimeout?'<p class="small dim" style="text-align:center">The timer ended, so any exercises that were not answered were excluded from the score.</p>':'')
    +'<div class="pstat"><span>&#9201; Time paused manually: <b>'+fmtClock(S.manualPauseTotal)+'</b></span>'
    +'<span>&#10073;&#10073; Time reviewing feedback: <b>'+fmtClock(S.autoPauseTotal)+'</b></span></div>'
    +'<div class="passpanel '+(passed?'okp':'failp')+'">'
    +'<div class="pt">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'
    +'<div class="ps">'+(passed
      ?'Well done. You reached the pass mark of '+META.passMark+'% on this severity. Keep going with the next difficulty level of this topic.'
      :'You must retake this exam to reach the '+META.passMark+'% pass mark. Review the feedback you collected, then press Retake Exam — the exercise order and answer choices will be shuffled.')+'</div>'
    +'</div>'
    +'<div class="center"><button class="btn primary" id="retakebtn" type="button">&#8635; Retake Exam</button></div>'
    +'</div>';
  $('retakebtn').addEventListener('click',function(){
    $('results').classList.add('hidden');
    renderIntro();
    window.scrollTo(0,0);
  });
}
/* Site score report — exactly once per attempt, at results screen */
function reportScore(r){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(r.sum),
      total:r.cnt,
      percent:r.percent,
      passed:r.percent>=META.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}

/* ================= SITE HANDSHAKE ================= */
window.addEventListener('message',function(event){
  if(!event.data){return;}
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT'){return;}
  try{
    if(event.data.username){S.user.name=String(event.data.username).slice(0,40);}
    if(event.data.country){S.user.country=String(event.data.country).slice(0,2);}
    if(event.data.locale){S.user.locale=String(event.data.locale).slice(0,10);}
    if(S.phase==='intro'){renderIntro();}
  }catch(e){}
});


/* ================= ANSWER / RESULT STORAGE ================= */
S.answers={};S.results={};S.dec={};
var CURSEL=[]; /* current exercise selected option indexes (original option indexes) */

/* ================= SYNTAX HIGHLIGHT (single-pass, safe) ================= */
var HL_RE=new RegExp(
  '(\\d{1,3}(?:\\[\\.\\]){3}\\d{1,3})'+
  '|(&quot;[^&\\n]*&quot;)'+
  '|(\\bEventCode\\s*=\\s*\\d+)'+
  '|(\\b(?:vssadmin|wbadmin|diskshadow|bcdedit|reagentc|wmic|chattr|shred|vim-cmd|esxi|hostd|auditd|sysmon|cloudtrail|powershell|cmd)\\b)'+
  '|(\\b(?:delete|remove|removeall|erase|format|reload|shadowcopy|shadows|catalog|recoveryenabled|disable|snapshot|rescue\\.target|fstab|bootstatuspolicy)\\b)'+
  '|(#[^\\n<]*)'+
  '|(\\b\\d+\\b)','gi');
function hl(text){
  var e=esc(text);
  return e.replace(HL_RE,function(m,ip,str,ec,kw,verb,com,num){
    if(ip){return '<span class="tk-i">'+ip+'</span>';}
    if(str){return '<span class="tk-s">'+str+'</span>';}
    if(ec){return '<span class="tk-k">'+ec+'</span>';}
    if(kw){return '<span class="tk-k">'+kw+'</span>';}
    if(verb){return '<span class="tk-w">'+verb+'</span>';}
    if(com){return '<span class="tk-c">'+com+'</span>';}
    if(num){return '<span class="tk-n">'+num+'</span>';}
    return m;
  });
}

/* ================= BLOCK BUILDERS ================= */
function artefactHTML(a){
  return '<div class="art"><span class="art-lab mono">'+esc(a.label)+'</span><div class="art-b'+(a.mono?'':' plain')+'">'
    +(a.mono?'<pre>'+hl(a.body)+'</pre>':esc(a.body))+'</div></div>';
}
function scenarioBlock(ex,collapsedDefault){
  var totalLen=ex.scenario.length+((ex.artefacts||[]).map(function(a){return a.body;}).join('').length);
  var long=totalLen>420;
  var openDefault=collapsedDefault!=null?collapsedDefault:(long?false:true);
  var arts=(ex.artefacts||[]).map(artefactHTML).join('');
  var sum=esc(ex.summary||ex.title);
  var paras=ex.scenario.split('\n\n').map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
  return '<div class="blk scenario" id="blk-scenario">'
    +'<button type="button" class="sc-sum" aria-expanded="'+(openDefault?'true':'false')+'" data-toggle="1">'
    +'<span aria-hidden="true" style="color:var(--accent-blue)">&#128203;</span><span>SCENARIO</span>'
    +'<span class="dim"> — '+sum+'</span><span class="caret" aria-hidden="true">&#9654;</span></button>'
    +'<div class="sc-body'+(openDefault?'':' hidden')+'"><div>'+paras+arts+'</div></div></div>';
}
function questionBlock(ex){
  return '<div class="blk question"><div class="blk-h"><span aria-hidden="true">&#10067;</span><span>QUESTION</span></div>'
    +'<div class="blk-b"><p class="qtext">'+esc(ex.question)+'</p></div></div>';
}
function answerBlock(inner){
  return '<div class="blk answer"><div class="blk-h"><span aria-hidden="true">&#9997;</span><span>YOUR ANSWER</span></div>'
    +'<div class="blk-b">'+inner+'</div></div>';
}
function bindScenarioToggle(root){
  var btn=root.querySelector('[data-toggle]');
  if(btn){
    btn.addEventListener('click',function(){
      var body=btn.parentElement.querySelector('.sc-body');
      var open=body.classList.toggle('hidden')===false;
