<script>window.__INTRO__={"examTitle": "DET0489 — EXTREMELY HARD practice exam", "learn": ["This is the expert tier of DET0489 — the MITRE ATT&CK Detection Strategy for Parent PID Spoofing (T1134.004, sub-technique of T1134 Access Token Manipulation). Every scenario here chains three or more concepts, plants genuinely conflicting signals, and asks you to make the call a senior analyst, senior detection engineer, or incident commander would make — under pressure, with costs attached.", "You will sit in the chair where this strategy lives at the highest level: a morning where 13 alerts half-match a change record; a SIEM implementation where the join key decides whether the rule ever fires; a queue where the quietest host is the scariest; a tuning edit three weeks ago that switched the analytic off; a boundary dispute over what 'mismatches tolerated before alerting' means at exactly two votes; and the CISO asking whether the controls make the detection redundant.", "The artefacts include realistic noise and deliberate gaps: irrelevant log lines, missing telemetry, claims that cannot be verified. The correct answers sometimes cost real money (a quarter-end delay), sometimes reject a widely quoted best practice (restart-to-clear-state), and sometimes the right action is to verify rather than act. False positives at this level wear expert disguises — a legal change window, a legitimate tool name used in the wrong context — and the most dangerous coverage gaps are the ones a tuning edit created on purpose. Confidence language matters: say what the evidence proves, nothing more.", "One exercise is a detection query editor — DET0489's implementation is genuinely a correlation query, so you will assemble it from its building blocks (sources, join key, mismatch comparison, window, allow-list exclusion). Take your time with the artefacts; the timer is generous, and Check stops it while you study the feedback."], "keywords": [{"g": "Senior correlation decisions", "items": ["contradictory signals (documented change vs live spoof)", "tolerance-boundary semantics (tolerated BEFORE alerting)", "evidence strength vs host criticality", "noisy artefact sets and incomplete telemetry", "severity vs confidence vs context"]}, {"g": "Tuning failure modes", "items": ["wildcard allow-list blind spots", "allow-list name abuse (right name, wrong context)", "evasion via other Native API paths", "what a tuning change silently switches off"]}, {"g": "Operations under pressure", "items": ["containment with real business cost (quarter-end delay)", "evidence preservation vs cleanup best practices", "CISO reporting language — proven facts only", "response modes: act / verify fast / suppress with documentation"]}, {"g": "Coverage & resilience", "items": ["missing ETW telemetry (DC0021/DC0034 gap on legacy servers)", "compensating detections and residual-risk wording", "covered vs not-covered behaviours (token-manipulation siblings)", "degraded chains: two of three votes still disagree"]}, {"g": "Engineering & controls", "items": ["correlation query building blocks (two sources, join key, mismatch inequality, window, allow-list exclusion)", "lineage roles: kernel truth, Sysmon anchor, claimed creator, forging primitive", "limits of M1040 Behavior Prevention on Endpoint and M1026 Privileged Account Management", "defense-in-depth: prevention reduces, detection witnesses"]}], "how": ["Passing score: 70%. A PASS means you can chain concepts, resolve conflicting signals and defend senior decisions on DET0489 — the expert bar. A FAIL means you should re-read every feedback item you missed, then retake.", "Exercise types in this file: a four-step branching incident, a detection query editor, correlation log triage with a filter box, response ranking, multi-select action sets, an executive summary completion, a find-the-blind-spot config review, a tolerance-boundary ruling, role matching, and an alert-queue mode assignment.", "Timer: you have 45 minutes. The Pause button stops the timer and hides the exercise. Pressing Check (or confirming the final step of a branch) stops the timer automatically — study the feedback as long as you need; it resumes on Next or on the next branch step.", "Partial credit: multi-item exercises score credit = (H − W) / N — correct items add, wrong items subtract, never below zero. Selecting everything scores zero. A hint only restates a constraint you may have missed; it never names the answer, and it costs 10% of that exercise's credit. One hint per exercise.", "Skip: skipped exercises go to a review pool without revealing answers. Return to them any time while the timer runs; skipped-and-never-answered exercises are excluded from the final score."]};window.__EX__=[{"id": "x1", "type": "branch", "title": "The alert burst that half-matches a change record", "summary": "13 hosts, one documented deploy, one outlier", "scenario": {"paras": ["08:55. Twelve DET0489 chain alerts in fifteen minutes, all naming the same spoofer. Then a thirteenth alert that does not fit. The artefacts below are all you have.", "Work the incident. Each step is a senior call with real consequences."], "arts": [{"label": "ARTEFACT 1 — Alert burst (08:55–09:10)", "lines": ["12 hosts (workstations): spoofer C:\\ProgramData\\Ops\\deploysvc.exe, fake parent services.exe, mismatch 1 of 3"]}, {"label": "ARTEFACT 2 — Change calendar", "lines": ["08:45 — Change #4471: MDM provisioning agent deploy (deploysvc.exe, signed, vendor ABC) to all workstations"]}, {"label": "ARTEFACT 3 — ETW sample (WKS-220)", "lines": ["api_call=UpdateProcThreadAttribute  caller=deploysvc.exe  target_parent=services.exe", "child: agent installer — documented vendor behaviour per Change #4471"]}, {"label": "ARTEFACT 4 — The outlier", "lines": ["Host SRV-FIN-03 (finance reporting server, no change assigned): spoofer C:\\Windows\\Temp\\wuaupd.exe, fake parent lsass.exe, mismatch 3 of 3"]}]}, "question": "Make the right senior call at each of the four steps.", "hint": "Verification first, containment where the evidence is strongest, and a public statement that only claims what the evidence supports.", "branch": {"steps": [{"text": "Two signals conflict: a signed, documented agent explains 12 alerts; SRV-FIN-03 matches no change record and shows maximum mismatch evidence.", "q": "Step 1 — What do you declare?", "options": ["Split the case: 12 alerts treated as suspected-provisioning pending verification; SRV-FIN-03 opened as a live possible T1134.004 incident", "Declare a mass breach across all 13 hosts and page every team", "Close all 13 alerts as provisioning noise"], "answer": "Split the case: 12 alerts treated as suspected-provisioning pending verification; SRV-FIN-03 opened as a live possible T1134.004 incident", "why": "One explanation covers twelve alerts; the outlier matches nothing and carries the strongest evidence. Splitting costs nothing and handles both worlds."}, {"text": "Before you close the 12, someone asks how sure you are that deploysvc.exe is really the vendor binary.", "q": "Step 2 — Which single check protects you from a name-spoof?", "options": ["Verify deploysvc.exe's signature chain and hash against the vendor package and Change #4471", "Trust the change calendar — IT wrote it, that is enough", "Rename the binary on every host to break the pattern"], "answer": "Verify deploysvc.exe's signature chain and hash against the vendor package and Change #4471", "why": "Change records describe intent, not identity. Only a hash/signature comparison proves the binary on disk is the one the change approved."}, {"text": "SRV-FIN-03: unknown spoofer, forged lsass.exe parent, mismatch 3 of 3. It is quarter-end close; the finance team is running reports on that server.", "q": "Step 3 — Action with cost?", "options": ["Isolate SRV-FIN-03 now (accepting quarter-end reporting delay) after capturing memory and logs", "Wait until quarter-end closes to avoid business impact", "Restart the server to clear the spoofed process"], "answer": "Isolate SRV-FIN-03 now (accepting quarter-end reporting delay) after capturing memory and logs", "why": "A forged lsass.exe parent with full mismatch evidence on a finance server outranks reporting delay; capture first so the evidence survives the isolation."}, {"text": "The CISO needs a three-line statement for the executive channel.", "q": "Step 4 — Which statement is defensible?", "options": ["Confirmed behavior-chain detection of T1134.004 on one server, contained; 12 correlated alerts attributed to approved Change #4471 after hash verification; monitoring continues", "Thirteen hosts compromised by a nation-state actor", "A false alarm occurred; nothing happened anywhere"], "answer": "Confirmed behavior-chain detection of T1134.004 on one server, contained; 12 correlated alerts attributed to approved Change #4471 after hash verification; monitoring continues", "why": "It states the proven behaviour, the verified benign explanation, and the residual posture — no speculation, no minimisation."}]}, "explanation": "The senior pattern in four moves: (1) resolve the contradiction by splitting the cases — an explanation that covers 12 alerts is probable, the 13th alert matches nothing and carries three mismatch votes; (2) verify identity, not paperwork — a hash check separates the vendor binary from a name-spoof riding a legitimate change window; (3) accept real cost when stakes demand it — quarter-end delay hurts, but a forged lsass.exe parent on the finance server hurts more, and capturing memory first keeps the case prosecutable; (4) report exactly what is proven. Every wrong option either over-claims (mass breach, nation-state) or under-claims (noise, nothing happened) — both destroy credibility.", "study": "The operations-under-pressure keyword group — contradictory signals and cost acceptance."}, {"id": "x2", "type": "query", "title": "Assemble the correlation query (detection editor)", "summary": "Write the DET0489 chain as one query", "scenario": {"paras": ["Your SIEM team is implementing DET0489 / AN1351. Write the correlation query in the editor below — pseudocode is fine, the dialect is not graded.", "The grader checks the six building blocks of the behavior chain. It also flags destructive operations."]}, "question": "Assemble the correlation query so every required building block is present.", "hint": "Six blocks: two sources (Security 4688 and the ETW kernel api_call), one join on the child identity, one mismatch comparison, one time window, one allow-list exclusion.", "query": {"placeholder": "e.g.  SecurityEvent | where EventID == 4688 | join kind=inner (...) on $left.NewProcessId == $right.ChildProcessId | where ...", "elements": [{"desc": "Pulls Security 4688 process creation events (the DC0032 leg)", "any": ["4688", "wineventlog", "securityevent", "security log"]}, {"desc": "Pulls the ETW kernel api_call leg (UpdateProcThreadAttribute / kernel process)", "any": ["updateprocthreadattribute", "kernel-process", "kernelprocess", "kernel_process", "etw"]}, {"desc": "Joins the two legs on the new/child process identity (NOT the forged creator)", "all": ["join", "(newprocessid|new_process_id|childpid|child_pid|childid|newpid)"]}, {"desc": "Compares true parent vs creator with an INEQUALITY (the mismatch vote)", "all": ["(true|eventheader|kernel)", "(!=|<>|mismatch|inequal|not equal|differs)"]}, {"desc": "Applies the 5–10 minute correlation TimeWindow", "any": ["timewindow", "time window", "within", "between", "window", "5min", "10min", "5 min", "10 min", "5m", "10m", "minutes"]}, {"desc": "Excludes AllowedSpoofers (allow-list / consent.exe suppression)", "any": ["allowedspoofers", "allow list", "allowlist", "allow-list", "not in", "exclud", "consent"]}], "forbidden": [{"any": ["delete from", "drop table", "truncate", "clear-log", "wevtutil cl", "del /", "rm -rf"], "desc": "Destructive data operation", "why": "A detection query is read-only analytics. Operations that delete, truncate or clear data destroy evidence and are never part of detection logic."}], "canonical": ["let win = 10m;", "SecurityEvent                          // DC0032 — Process Creation", "| where EventID == 4688", "| join kind=inner (", "    EtwKernelProcess                   // DC0021 — OS API Execution", "    | where ApiCall == \"UpdateProcThreadAttribute\"", "      and Attribute == \"PROC_THREAD_ATTRIBUTE_PARENT_PROCESS\"", "  ) on $left.NewProcessId == $right.ChildProcessId", "| where TrueParentImage != CreatorProcessName        // the mismatch vote", "| where (EventTime - AttrTime) <= win                // TimeWindow (5–10 min)", "| where not(NewProcessName in~ (AllowedSpoofers))    // allow-list exclusion", "| project TimeGenerated, Computer, NewProcessName,", "          CreatorProcessName, TrueParentImage"], "notes": ["Source legs: 4688 gives the creation record and the claimed creator; the ETW kernel channel gives the forging call and the true parent.", "Join key: the child's identity — never the creator field, which is the value the attack corrupts.", "The inequality is the heart of the analytic: equal parents are healthy lineage, different parents are the mismatch vote.", "The window keeps the two legs one behaviour; the allow-list keeps consent.exe and reviewed agents quiet.", "A near-miss: writing == instead of != yields a rule that alerts on healthy processes and stays silent on spoofs — a silent total failure."]}, "explanation": "The canonical query chains exactly what the strategy page describes. The two sources mirror the Log Sources table (DC0032 via WinEventLog:Security EventCode=4688; DC0021 via the etw:Microsoft-Windows-Kernel-Process api_call). The join rides the child process identity because the creator field is attacker-controlled in a spoof — joining on it blinds the rule. The inequality implements the mismatch vote; the window implements TimeWindow (5–10 minutes default); the exclusion implements AllowedSpoofers. Note the near-miss: swapping to == produces a plausible-looking rule that fires on healthy lineage and never on attacks — the quietest way to fail.", "study": "The engineering & controls keyword group — query building blocks."}, {"id": "x3", "type": "logview", "title": "Act on the alert queue with holes in the telemetry", "summary": "Strong evidence, missing telemetry, and a calm UAC alert", "filter": true, "scenario": {"paras": ["09:02. Four alerts, one queue, and two hosts with telemetry problems. Decide where you act FIRST — containment, not paperwork."], "arts": [{"label": "ARTEFACT 1 — Alert queue (09:02)", "lines": ["[1] WKS-77:  chain confirmed, mismatch 3 of 3, spoofer C:\\Temp\\msmpeng_.exe (imitates Defender's msmpeng.exe), fake parent services.exe", "[2] WKS-12:  chain confirmed, mismatch 1 of 3, spoofer consent.exe (logged UAC 08:58, approved VPN install)", "[3] SRV-DB-01: chain PARTIAL — 4688 claims creator=lsass.exe; ETW kernel channel NOT deployed on this host; Sysmon down for 3 weeks", "[4] WKS-77 (second alert): fake parent wininit.exe, mismatch 2 of 3, same spoofer C:\\Temp\\msmpeng_.exe"]}]}, "question": "Select the two hosts where you act FIRST.", "hint": "One host has maximum evidence twice. One host is critical with a telemetry hole — silence there is not safety. The UAC alert is the calm one.", "answer": {"kind": "multi", "options": [{"k": "A", "t": "WKS-77 — two confirmed chain alerts, a Defender-imitating Temp spoofer, two different SensitiveParents"}, {"k": "B", "t": "WKS-12 — the allow-listed consent.exe UAC case"}, {"k": "C", "t": "SRV-DB-01 — a critical server claiming lsass.exe as creator with no telemetry to verify it"}], "answer": ["A", "C"], "whys": {"A": "Two confirmed alerts with maximum mismatch evidence, an impersonating spoofer name, and forged SensitiveParents — the clearest live threat in the queue.", "C": "You cannot verify the claim, but a database server whose 4688 events claim lsass.exe as creator is unacceptable risk on a critical role: contain while restoring telemetry. Missing witnesses on a critical host is action grounds, not comfort."}, "whyNots": {"B": "consent.exe in a logged UAC context is the documented allow-listed pattern — it can wait."}}, "explanation": "Evidence strength and host criticality are separate axes, and senior triage reads both. WKS-77 is the strongest evidence in the queue — twice — with a spoofer name engineered to survive casual review (msmpeng_ instead of msmpeng) and two SensitiveParents forged. SRV-DB-01 is the harder call: the chain is unverifiable (no ETW, Sysmon down), but a critical server claiming lsass.exe lineage gets containment plus immediate telemetry restoration — absence of telemetry is a risk amplifier, not an alibi. WKS-12 can wait: allow-listed, documented, single vote.", "study": "The coverage & resilience keyword group — incomplete telemetry decisions."}, {"id": "x4", "type": "qcm", "title": "Two signals collide on DC-04 — which wins?", "summary": "SensitiveParent auto-escalation vs allow-list context vs weak evidence", "scenario": {"paras": ["Alert on DC-04: fake parent lsass.exe (SensitiveParents — auto-escalate by design), spoofer svchost.exe (on AllowedSpoofers for UAC broker context), mismatch count 1 of 3 with LineageMismatchTolerance = 1 (one mismatch is still tolerated).", "Severity says one thing, evidence says another, and context muddies both. Your first ACTION decides the next hour."]}, "question": "Which reading is correct for your first action?", "hint": "Auto-escalation sets SEVERITY, not the response. Tolerance maths and allow-list context shape CONFIDENCE. Separate the two dials.", "options": [{"k": "A", "t": "Keep severity high (sensitive parent), treat the chain as unconfirmed, and verify the svchost context plus the two missing lineage votes before containment"}, {"k": "B", "t": "Auto-close — svchost.exe is on the allow-list, and the allow-list always wins"}, {"k": "C", "t": "Immediately take DC-04 offline — a forged lsass.exe parent is never survivable"}, {"k": "D", "t": "Lower the severity — a mismatch count below the tolerance is noise, full stop"}], "answer": ["A"], "whys": {"A": "The strategy's design separates severity (SensitiveParents auto-escalate) from confirmation (evidence at or above tolerance). UAC context on a domain controller is itself suspicious — a DC has no console UAC — so verification is the proportionate first move."}, "whyNots": {"B": "Allow-list entries carry context; a DC should never run console UAC, so the svchost.exe hit needs its context checked, not trusted.", "C": "Taking a production DC offline on one below-tolerance vote is a self-inflicted outage — the cost is real and the evidence does not justify it yet.", "D": "Severity and evidence are different dials: the sensitive parent keeps severity high even while the chain awaits confirmation."}, "explanation": "This is the collision the strategy was designed to produce: three dials pointing different ways. SensitiveParents auto-escalation is a severity rule — lsass.exe is worth maximum attention by definition. LineageMismatchTolerance is a confirmation rule — one mismatch at tolerance 1 is not yet a proven chain. AllowedSpoofers is a context rule — svchost.exe is legitimate during UAC, and a domain controller has no interactive UAC, which makes the context claim itself suspicious. The senior answer holds all three: severity stays high, confirmation waits for the missing votes, and the first action is verification (plus checking why a UAC-context binary is alive on a DC at all).", "study": "The senior correlation decisions keyword — severity vs confidence vs context."}, {"id": "x5", "type": "rank", "title": "Rank five alerts into response order", "summary": "Evidence, stakes, business context and noise in one queue", "scenario": {"paras": ["Quarter-end close is running on the finance estate. Rank these five DET0489 alerts into response order — position 1 is acted on first.", "One alert has maximum evidence on a critical server mid-close. One has thin evidence on a DC. One has strong evidence and a low-stakes parent. One is a strong workstation hit. One is allow-listed UAC."]}, "question": "Rank the alerts from most urgent (1) to least urgent (5).", "hint": "Full evidence on the finance server first; strong workstation hit second; thin DC evidence is verify-fast, not contain-blind; the plain-evidence hit follows; allow-listed UAC is last.", "seq": {"note": "1 = act now, 5 = act last.", "items": [{"k": "a", "t": "A — SRV-FIN-03: fake parent lsass.exe, mismatch 3 of 3, unknown spoofer, quarter-end close running"}, {"k": "b", "t": "B — DC-02: fake parent services.exe, mismatch 1 of 3 (below tolerance), spoofer unknown"}, {"k": "c", "t": "C — WKS-310: fake parent wininit.exe, mismatch 2 of 3, unknown spoofer"}, {"k": "d", "t": "D — WKS-88: fake parent explorer.exe, mismatch 3 of 3, Temp spoofer"}, {"k": "e", "t": "E — WKS-12: fake parent explorer.exe, consent.exe in a logged UAC context, mismatch 1 of 3"}], "correct": ["a", "c", "b", "d", "e"], "whys": {"a": "Maximum evidence on a critical server — containment now, and the business delay is the accepted cost of being right.", "c": "A SensitiveParent (wininit.exe) with above-tolerance evidence on a workstation — clear and urgent, right behind the finance server.", "b": "A DC is the highest-stakes host, but one below-tolerance vote is thin: verify fast, contain only on confirmation — it cannot outrank confirmed spoofs.", "d": "Maximum evidence of a real spoof, but the forged parent is only explorer.exe — serious, scheduled next.", "e": "Allow-listed UAC noise — the routine close that waits for everyone."}}, "explanation": "Five dials at once: evidence strength, host criticality, parent sensitivity, business context, and allow-list status. A wins on evidence plus stakes — and its quarter-end timing is the cost you accept, not a reason to wait. C is a clean above-tolerance SensitiveParent hit. B is the deliberate trade: the DC matters most, but containment on one thin vote would be acting below the evidence bar — so it gets fast verification, not a blind outage. D has proof but a low-stakes parent. E is noise. If your order differs, check whether you let stakes override evidence where the evidence was not confirmed.", "study": "The operations-under-pressure keyword group — response modes."}, {"id": "x6", "type": "multi", "title": "Three correct actions right now", "summary": "Confirmed compromise — and two best practices that are wrong here", "scenario": {"paras": ["SRV-FIN-03 is confirmed: the spoofer runs under a service account, a forged lsass.exe parent is verified by three mismatch votes. Leadership wants action NOW; the storage team warns a VM snapshot will take 20 minutes.", "Six actions are proposed. Exactly three are correct for this moment."]}, "question": "Select the three actions that are correct RIGHT NOW.", "hint": "Two options destroy evidence; one tips the actor off. Preservation, containment, and identity control are the trio.", "options": [{"k": "A", "t": "Isolate the host at the network level (keep power on) to cut C2 while preserving volatile memory"}, {"k": "B", "t": "Capture the ETW and Security logs plus memory before any restart or snapshot completes"}, {"k": "C", "t": "Restart the host to clear the spoofed process state — a standard cleanup practice"}, {"k": "D", "t": "Kill the parent process tree immediately to stop the spoofer"}, {"k": "E", "t": "Delete the spoofer binary so nothing further can execute"}, {"k": "F", "t": "Disable the compromised service account after recording its rights and sessions"}], "answer": ["A", "B", "F"], "whys": {"A": "Network-level isolation with power kept on stops the actor while preserving every volatile artefact your case needs.", "B": "Memory and ETW state hold the spoofing evidence; capturing before any restart or snapshot finishes protects the case.", "F": "Disabling the identity (after recording rights and sessions) cuts persistence without tipping off or destroying context."}, "whyNots": {"C": "Restarting is the widely quoted cleanup best practice that is wrong here — it wipes the volatile memory that proves the case.", "D": "Killing the tree destroys the live context and warns the actor something is known.", "E": "Deleting the binary destroys the single best forensic artefact — hash, config, and attribution all live in it."}, "explanation": "Under pressure, the trio that survives scrutiny is: contain the network (not the power), capture the volatile truth, and cut the identity. The trap options are all plausible-sounding classics: 'restart to clear state' is a genuine best practice — for unimportant workstations, not for evidence-bearing servers; 'kill the tree' and 'delete the binary' feel decisive but hand the actor a warning while erasing the proof. When leadership wants visible action, the defensible visible action is isolation plus capture plus identity control.", "study": "The operations-under-pressure keyword — evidence preservation vs cleanup best practices."}, {"id": "x7", "type": "fill", "title": "Complete the executive summary", "summary": "Four blanks for the board-ready paragraph", "scenario": {"paras": ["Your board summary must explain the detection and the incident in plain language. Fill the four blanks from the word bank.", "Two bank words are decoys that belong to entirely different topics."]}, "question": "Fill the four blanks correctly.", "hint": "Four ideas: chained logic, parent records, the highest Windows privilege, and the tactic that follows hiding.", "fill": {"text": "DET0489 is a {0} control: it links the parent-forging API call to the resulting process and checks {1} across independent Windows sources. On SRV-FIN-03 the attacker forged a {2} parent (lsass.exe) to reach {3} after hiding from our parent-child rules.", "answers": ["behavior-chain", "lineage", "SYSTEM", "Privilege Escalation"], "bank": ["behavior-chain", "lineage", "SYSTEM", "Privilege Escalation", "firewall", "encryption", "Reconnaissance", "single-event"], "whys": ["behavior-chain is the strategy's defining property — linked steps, not one event.", "lineage is the parent record set the strategy cross-checks across witnesses.", "SYSTEM is the privilege level whose forged parent (lsass.exe) makes the alert critical.", "Privilege Escalation is the tactic the forged SYSTEM parent serves, after the Defense Evasion of hiding."]}, "explanation": "The summary compresses everything this exam covers into two sentences: what the detection is (a behavior-chain that checks lineage across witnesses — not a single-event rule), and what happened (a forged SYSTEM parent serving Privilege Escalation after the evasion). The decoy words belong to other worlds — firewalls and encryption are different controls, Reconnaissance is a different tactic, and single-event is precisely what this strategy refuses to be.", "study": "Your own intro screen — the summary only rewords it."}, {"id": "x8", "type": "spot", "title": "Click the line that opens the blind spot", "summary": "One tuning edit defeated the whole analytic", "scenario": {"paras": ["Three weeks after go-live, someone 'fixed' the alert noise by editing the allow-list. Yesterday a real spoof ran silently for six hours. Find the line that did it."], "arts": [{"label": "ARTEFACT 1 — analytic config (current)", "lines": ["[AllowedSpoofers]", "  consent.exe        — UAC consent (interactive workstations)", "  svchost.exe        — UAC broker context", "  deploysvc.exe      — MDM provisioning agent (approved Change #4471)", "  *.exe              — temporary blanket, added to stop the alert noise", "[SensitiveParents]", "  lsass.exe, services.exe, wininit.exe"]}]}, "question": "Click the config line that created the blind spot.", "hint": "One line matches every binary on every host — and suppression runs before the mismatch logic.", "spot": {"lines": ["[AllowedSpoofers]", "  consent.exe        — UAC consent (interactive workstations)", "  svchost.exe        — UAC broker context", "  deploysvc.exe      — MDM provisioning agent (approved Change #4471)", "  *.exe              — temporary blanket, added to stop the alert noise", "[SensitiveParents]", "  lsass.exe, services.exe, wininit.exe"], "bad": [4], "whys": {"4": "A wildcard allow-list entry (*.exe) matches every binary on every host. Allow-list suppression runs before alerting, so no spoof can ever reach the mismatch logic — the analytic is switched off while looking switched on."}}, "explanation": "The wildcard converts the analytic's strongest feature — three lineage witnesses — into decoration: suppression happens before the mismatch count is even consulted. Every entry above it is scoped (a name plus a documented context); the blanket entry is scoped to nothing. The correct fixes for noisy alerts are the ones you practised in HARD: measure, then scope allow-list entries to account and host, or adjust the tolerance with data. A tuning change that hides every alert is not tuning — it is deprecation with extra steps.", "study": "The tuning failure modes keyword — wildcard allow-list blind spots."}, {"id": "x9", "type": "qcm", "title": "The evasion that threatens the chain itself", "summary": "Actors read your detection blog post. What breaks DET0489?", "scenario": {"paras": ["Your SOC publishes that DET0489 catches UpdateProcThreadAttribute-based parent spoofing. Months later, red-team findings suggest actors adapted.", "The strategy's chain has three links: the watched API call, the process creation, and the lineage votes. One adaptation attacks the chain's first link directly — the page itself anticipates it in the words 'or other Native API paths'."]}, "question": "Which adaptation most directly threatens THIS strategy's api_call coverage?", "hint": "The chain needs the watched API evidence in the watched channels. What if the forging call never appears there at all?", "options": [{"k": "A", "t": "Calling native APIs (an NtCreateUserProcess path with the parent attribute set in-kernel) that never surface the UpdateProcThreadAttribute/CreateProcess* pattern in the watched channels"}, {"k": "B", "t": "Renaming the payload from cmd_clone.exe to notepad_helper.exe"}, {"k": "C", "t": "Switching the payload from cmd.exe to powershell.exe"}, {"k": "D", "t": "Running the spoofing activity only at 3 a.m. local time"}], "answer": ["A"], "whys": {"A": "The strategy anchors its first link on specific API paths and channels. Native API paths that set the parent attribute below the watched layer remove that anchor entirely — the page's phrase 'or other Native API paths' admits the family is bigger than the two watched calls."}, "whyNots": {"B": "A rename changes no API evidence and no lineage — the mismatch votes still fire.", "C": "The child image is irrelevant to the chain; the parents and the calls are what it watches.", "D": "The analytic has no time-of-day logic; quiet hours change nothing."}, "explanation": "Know your detection's load-bearing wall. DET0489's api_call link depends on specific watched channels (the ETW kernel process channel's api_call evidence); native paths that set the parent attribute without producing that evidence cut the first link. The good news is structural: the other two links — kernel-observed true parent and the Sysmon lineage anchor — still vote on the mismatch even when the api_call leg is missing, which is why the strategy counts mismatched sources rather than requiring one signature. The honest posture: monitor for chain detections, and keep compensating detection on the lineage legs for exactly this evasion.", "study": "The tuning failure modes keyword — evasion via other Native API paths."}, {"id": "x10", "type": "queue", "title": "Assign a response mode to each situation", "summary": "Act / verify-then-act / suppress-with-paperwork", "scenario": {"paras": ["You are the SOC lead. Four situations, three possible modes per row: Act now (accept the cost), Verify fast then act, Suppress and document.", "The queue includes a confirmed finance-server spoof, a below-tolerance DC vote, a double workstation hit, and the aftermath of a verified change."]}, "question": "Pick the correct response mode for each row.", "hint": "Confirmed maximum evidence acts now. Below-tolerance evidence verifies first. Verified change noise gets suppressed — with a paper trail.", "queue": {"rows": [{"label": "R1 — SRV-FIN-03", "text": "Confirmed 3 of 3 mismatch, forged lsass.exe parent, spoofer under a service account.", "options": ["Act now (accept the cost)", "Verify fast then act", "Suppress and document"], "answer": "Act now (accept the cost)", "why": "Maximum evidence on a critical host: containment starts now and the business cost (quarter-end delay) is accepted."}, {"label": "R2 — DC-04", "text": "svchost.exe claimed lsass.exe lineage, mismatch 1 of 3, tolerance 1 — below confirmation bar.", "options": ["Act now (accept the cost)", "Verify fast then act", "Suppress and document"], "answer": "Verify fast then act", "why": "A DC deserves urgency, but acting below the evidence bar on a production DC is its own incident: verify the two missing votes within minutes, then act."}, {"label": "R3 — WKS-77", "text": "Second confirmed alert today: forged wininit.exe parent, 2 of 3 mismatch, same Temp spoofer.", "options": ["Act now (accept the cost)", "Verify fast then act", "Suppress and document"], "answer": "Act now (accept the cost)", "why": "Two confirmed alerts with a SensitiveParent forged — isolate the workstation; the cost (a user's machine) is trivial against the risk."}, {"label": "R4 — 12 deploysvc alerts", "text": "Hash-verified against approved Change #4471; signature chain matches the vendor package.", "options": ["Act now (accept the cost)", "Verify fast then act", "Suppress and document"], "answer": "Suppress and document", "why": "Verified benign by hash and change record: suppress with documentation so the tuning story survives audit."}]}, "explanation": "Response modes exist so escalation is a policy, not a mood. Act now is for confirmed evidence on costly stakes — the finance server and the double workstation hit. Verify fast then act is for high stakes with thin evidence — the DC gets minutes, not a blind outage. Suppress and document is for verified noise — and the documentation is not bureaucracy: it is the proof, at the next audit, that the suppression was evidence-based. Note what is absent: no row earns 'wait and see'. DET0489 alerts either earn verification or action — never neglect.", "study": "The operations-under-pressure keyword — response modes."}, {"id": "x11", "type": "logview", "title": "The tolerance boundary — read the config like a lawyer", "summary": "Two mismatch votes against a tolerance of two", "filter": true, "scenario": {"paras": ["A boundary dispute in the detection channel: two engineers disagree on whether a specific process alerts. Read the config and the votes, then rule on it.", "The LineageMismatchTolerance element is defined on the strategy page as the number of mismatched sources tolerated before alerting."], "arts": [{"label": "ARTEFACT 1 — analytic config", "lines": ["LineageMismatchTolerance = 2   (mismatches tolerated before alerting)"]}, {"label": "ARTEFACT 2 — lineage votes for process 0x0B40 (C:\\Temp\\cleaner.exe)", "lines": ["ETW EventHeader.ProcessId (true parent): C:\\Temp\\pack.exe       → MISMATCH vs reported", "Security 4688 Creator Process Name:      C:\\Windows\\explorer.exe  → the reported claim", "Sysmon ParentProcessGuid resolves to:    C:\\Temp\\pack.exe       → MISMATCH vs reported", "Tally: 2 of 3 sources mismatch the reported claim"]}]}, "question": "With tolerance = 2, does the analytic alert on this process?", "hint": "Read the config line as a sentence: HOW MANY mismatches are tolerated BEFORE alerting? Is two 'more than two'?", "answer": {"kind": "single", "options": [{"k": "A", "t": "No — two mismatches are still tolerated; alerting needs MORE than two (the third vote)"}, {"k": "B", "t": "Yes — reaching the tolerance number is enough to alert"}, {"k": "C", "t": "Yes — because explorer.exe is involved in the claim"}, {"k": "D", "t": "No — because Sysmon is the only mismatching source"}], "answer": ["A"], "whys": {"A": "Tolerance 2 means exactly two mismatched sources are tolerated. At 2 of 3 the analytic stays quiet by design; the third vote mismatching pushes past tolerance and alerts."}, "whyNots": {"B": "That reading would make the tolerance a trigger, not a tolerance — the page's wording says tolerated before alerting.", "C": "explorer.exe is the claimed claim-side value, not a trigger.", "D": "Both ETW and Sysmon mismatch the claim — and the reason is the boundary, not the count of tools."}}, "explanation": "Boundary semantics decide real alerts. 'Mismatches tolerated before alerting' means the analytic fires when the mismatch count EXCEEDS the tolerance: at tolerance 2, two votes stay silent, three alert. Your artefact showed exactly 2 of 3 — no alert, by design, however uncomfortable that feels. The senior lesson is procedural: boundary behaviour like this must be written into your tuning documentation (and your tests), because 'at tolerance vs over tolerance' is precisely the kind of ambiguity that splits teams. If your SOC reads the element the other way, tune it, test it, and document it — deliberately.", "study": "The senior correlation decisions keyword — tolerance-boundary semantics."}, {"id": "x12", "type": "match", "title": "Match each artefact to its role in the lineage check", "summary": "Two witnesses of reality, one carrier of claims, one manipulator", "scenario": {"paras": ["You are teaching the lineage model to new detection engineers. Four artefacts, four distinct roles in the mismatch logic.", "Two record reality, one carries a claim, one changes reality."]}, "question": "Match each artefact to the role it plays in the lineage check.", "hint": "Kernel and Sysmon observe. The 4688 creator field reports what it was told. The attribute call is the forgery itself.", "pairs": [{"l": "ETW EventHeader.ProcessId", "r": "The TRUE parent as recorded by the kernel", "why": "The kernel header carries the actual parent at birth — it cannot be talked out of the truth by the caller."}, {"l": "Security 4688 Creator Process ID/Name", "r": "The CLAIMED creator of the new process", "why": "These fields carry the (possibly forged) claim — the value the attack controls."}, {"l": "Sysmon ParentProcessGuid", "r": "The lineage anchor that resolves to the real parent", "why": "Sysmon resolves the GUID against its own observed process table — a second witness of reality."}, {"l": "UpdateProcThreadAttribute (PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)", "r": "The forging primitive that sets the fake parent", "why": "This is the manipulation itself — the API call that writes the lie into the new process."}], "explanation": "The lineage model has four chairs: two witnesses of reality (the kernel's EventHeader.ProcessId and Sysmon's ParentProcessGuid), one carrier of claims (the 4688 Creator fields — accurate for honest callers, forged otherwise), and one manipulator (UpdateProcThreadAttribute, the call that writes the fake parent). DET0489's mismatch logic pits the witnesses against the claim and counts the disagreements; the api_call leg corroborates the manipulation when the channels see it. An attacker who fools the claim still faces two witnesses — which is exactly why the strategy counts mismatched sources.", "study": "The engineering & controls keyword — lineage roles."}, {"id": "x13", "type": "qcm", "title": "'Can we retire the detection if we deploy the controls?'", "summary": "The CISO question about M1040 and M1026", "scenario": {"paras": ["CISO, budget review: 'If we deploy M1040 Behavior Prevention on Endpoint everywhere and finish the M1026 Privileged Account Management rollout, can we retire this DET0489 detection and its tuning work?'", "You owe an honest, defensible answer."]}, "question": "What is the honest answer?", "hint": "Defense-in-depth: every control has limits, and the strategy page pairs mitigations WITH detections — not instead of them.", "options": [{"k": "A", "t": "No — M1040 and M1026 reduce likelihood and impact, but native API paths and control bypasses remain; detection stays necessary as the witness and the assurance layer"}, {"k": "B", "t": "Yes — prevention with those controls is total, and the detection becomes redundant"}, {"k": "C", "t": "Yes — once an EDR is installed, detection of anything is obsolete"}, {"k": "D", "t": "No — but only because M1026 blocks consent.exe, and we need consent.exe"}], "answer": ["A"], "whys": {"A": "Mitigations reduce the attack surface; they do not close it. Kernel/native paths, misconfigurations and product gaps mean some spoofs get through — the detection remains the mechanism that sees them, measures coverage, and provides assurance."}, "whyNots": {"B": "'Total prevention' is not a claim any control vendor or framework will underwrite.", "C": "An EDR is itself a detection-and-prevention product — retiring detection logic because an EDR exists inverts how the tooling works.", "D": "M1026 manages privileged accounts; it does not uninstall Windows components."}, "explanation": "The controls and the detection answer different questions. M1040 blocks the behaviour where the endpoint product recognises it — coverage depends on vendor logic and version, and the page's own phrase 'or other Native API paths' marks a family the watched channels may not see. M1026 shrinks the prize: fewer reachable SYSTEM parents, less privilege to inherit. Neither tells you, after the fact, whether someone tried — DET0489 does. Retiring it would blind the SOC to the exact behaviour the controls sometimes miss, and would destroy your ability to measure whether the controls are working. Prevention reduces; detection witnesses; retirement of the witness is how organisations learn about bypasses from the newspapers.", "study": "The engineering & controls keyword — limits of prevention, defense-in-depth."}, {"id": "x14", "type": "branch", "title": "The six-month telemetry gap", "summary": "40 legacy servers, no ETW — design the bridge", "scenario": {"paras": ["The ETW kernel channel (DC0021/DC0034) cannot be deployed on 40 legacy application servers for six months — vendor certification blocks the agent update. The api_call leg of DET0489 is unavailable there.", "GRC needs a decision, a compensating control, and honest paperwork. Three calls."]}, "question": "Make the right call at each step.", "hint": "Count the votes that remain, design a compensating pair of eyes, then write the risk the way an auditor can use it.", "branch": {"steps": [{"text": "The api_call leg is missing on 40 servers. 4688 forwarding exists; Sysmon 2.x runs on all of them.", "q": "Step 1 — What is the honest residual coverage?", "options": ["Two lineage votes remain (4688 claim vs Sysmon anchor) — partial chain, degraded api_call corroboration", "Zero coverage — without ETW the strategy does nothing", "Full coverage — Sysmon alone is the whole strategy"], "answer": "Two lineage votes remain (4688 claim vs Sysmon anchor) — partial chain, degraded api_call corroboration", "why": "The mismatch logic needs witnesses, not the full set: 4688 carries the claim, Sysmon's ParentProcessGuid anchors reality — two of three votes survive."}, {"text": "You must design the compensating detection for the six months.", "q": "Step 2 — Which compensating design is strongest?", "options": ["Hunt implausible 4688 creator-to-child pairs (Temp-to-SYSTEM, office-to-shell after blocks) joined to Sysmon GUID mismatch alerts", "Nothing can compensate for a missing telemetry leg", "Weekly antivirus scans and hope"], "answer": "Hunt implausible 4688 creator-to-child pairs (Temp-to-SYSTEM, office-to-shell after blocks) joined to Sysmon GUID mismatch alerts", "why": "The two surviving votes still catch the signature pattern — claimed SYSTEM parents and impossible creators — when a hunt pairs them deliberately."}, {"text": "GRC asks how to phrase the exception in the risk register.", "q": "Step 3 — Which wording is defensible?", "options": ["Compensating detections active; residual risk: forged-parent api_call evidence unavailable; remediation scheduled within six months", "Fully compliant — no gap exists", "Risk accepted indefinitely without compensating controls"], "answer": "Compensating detections active; residual risk: forged-parent api_call evidence unavailable; remediation scheduled within six months", "why": "It states the control, the specific residual risk, and a dated remediation — the three things an auditor needs to accept an exception."}]}, "explanation": "Coverage engineering is vote arithmetic plus honest paperwork. Step 1: the chain degrades gracefully — two of three lineage votes (the 4688 claim and the Sysmon anchor) still disagree on real spoofs, so coverage is partial, not zero. Step 2: compensating detection exploits exactly those two votes — implausible creator pairs joined to GUID mismatches reproduce most of the analytic's value without the api_call leg. Step 3: the register entry names the control, the precise residual (no api_call evidence), and a dated fix. 'Fully compliant' would be a finding; 'accepted forever' would be a worse one.", "study": "The coverage & resilience keyword — compensating detections and residual-risk wording."}, {"id": "x15", "type": "dnd", "title": "Covered by DET0489 — or owned by another object?", "summary": "Six behaviours, two buckets", "scenario": {"paras": ["Your detection catalogue review needs a precise boundary for DET0489. It watches PARENT forging that shows up as lineage disagreement on Windows — nothing else.", "Sort the six behaviours: covered by DET0489, or owned by other ATT&CK objects and detections?"]}, "question": "Drag each behaviour to the correct bucket.", "hint": "DET0489 watches parent forging that produces lineage disagreement. Token tricks change the caller's identity, not the parent; normal-lineage spawns belong to other detections.", "slots": [{"id": "s1", "label": "Covered by DET0489"}, {"id": "s2", "label": "NOT covered — other objects own it"}], "items": [{"k": "i1", "t": "Forging a parent via UpdateProcThreadAttribute + CreateProcess* on Windows"}, {"k": "i2", "t": "Impersonating a user by building a new token in memory (MakeToken-style token manipulation)"}, {"k": "i3", "t": "Creating a process under a different token with CreateProcessWithTokenW"}, {"k": "i4", "t": "Spoofing a parent with CreateProcessAsUserW so the lineage sources disagree"}, {"k": "i5", "t": "A forged-parent chain using another Native API path that still yields true-vs-reported mismatch"}, {"k": "i6", "t": "PowerShell spawning from WINWORD.EXE with normal, unmodified lineage (blocked by policy)"}], "map": {"i1": "s1", "i2": "s2", "i3": "s2", "i4": "s1", "i5": "s1", "i6": "s2"}, "whys": {"i1": "The textbook chain the strategy page describes — covered.", "i2": "Token manipulation changes WHO the caller pretends to be, not WHO the parent is — the T1134 token siblings own it.", "i3": "CreateProcessWithTokenW is the alternate-token creation pattern — a token behaviour, not parent forging.", "i4": "The page names CreateProcessAsUserW among the forging calls — covered.", "i5": "The page's 'or other Native API paths' clause: any forging path that produces the lineage mismatch is in scope.", "i6": "Normal lineage with no forging produces no mismatch — that is a parent-child policy story, owned by other detections."}, "explanation": "The boundary is precise: DET0489 covers parent forging that surfaces as lineage disagreement — the two API chains the page names (UpdateProcThreadAttribute/CreateProcess*, and CreateProcessAsUserW) plus its own 'other Native API paths' clause. The token-manipulation siblings under T1134 (MakeToken-style impersonation, CreateProcessWithTokenW) change the caller's identity, not the parent — they need their own detections. And a plain Office-to-shell spawn with honest lineage is a parent-child policy case, not a forging case. Writing this boundary into the catalogue is what stops both false confidence ('DET0489 covers everything') and false gaps ('nothing covers token abuse').", "study": "The coverage & resilience keyword — covered vs not-covered behaviours."}];</script>
<script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var INTRO=window.__INTRO__;
var EXS=window.__EX__;
var SEVMAP={easy:['EASY','sev-easy'],medium:['MEDIUM','sev-medium'],hard:['HARD','sev-hard'],'extremely-hard':['EXTREMELY HARD','sev-extreme']};
var SEVWORD=SEVMAP[META.difficulty][0];
var SEVCLS=SEVMAP[META.difficulty][1];
var PASS=META.passMark||70;
var app=document.getElementById('app');

/* ---------- tiny DOM helpers ---------- */
function h(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
function txt(t,c,s){var e=h(t,c);e.textContent=(s===undefined||s===null)?'':String(s);return e;}
function btn(cls,s,fn){var b=txt('button','btn'+(cls?' '+cls:''),s);b.type='button';b.addEventListener('click',fn);return b;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){n=Math.max(0,n|0);return (n<10?'0':'')+n;}
function fmt(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function inArr(a,x){return a.indexOf(x)>=0;}
function normq(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}

/* ---------- state ---------- */
var S={view:'intro',order:[],pos:0,ts:'IDLE',left:(META.estimatedMinutes||30)*60,
credits:{},checked:{},skipped:{},hintUsed:{},hintOpen:{},st:{},_lastG:{},
reviewing:false,reported:false,manualMs:0,autoMs:0,pauseAt:0,pauseKind:null,underAuto:false,user:null};
function cur(){return S.order[S.pos];}
function st(i){if(i===undefined)i=cur();if(!S.st[i])S.st[i]={};return S.st[i];}
function answeredCount(){var n=0,k;for(k in S.checked)n++;return n;}
function skippedList(){var o=[],i;for(i=0;i<S.order.length;i++){var ix=S.order[i];if(S.skipped[ix]&&!S.checked[ix])o.push(ix);}return o;}
function scoreNow(){var a=answeredCount(),cs=0,k;for(k in S.credits)if(S.checked[k])cs+=S.credits[k];return{cs:cs,a:a,pct:a?Math.round(cs/a*100):0};}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- pause bookkeeping ---------- */
function enterPause(kind){S.pauseAt=Date.now();S.pauseKind=kind;}
function leavePause(){if(!S.pauseKind)return;var d=Date.now()-S.pauseAt;if(S.pauseKind==='manual')S.manualMs+=d;else S.autoMs+=d;S.pauseKind=null;}

/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
setInterval(function(){
  if(S.ts==='RUNNING'){S.left--;if(S.left<=0){S.left=0;updateHdrBits();endTimer();}else{updateHdrBits();}}
},1000);
function endTimer(){
  if(S.ts==='ENDED')return;
  S.ts='ENDED';
  if(S.view==='exam'||S.view==='review'){finish();}
}
function togglePause(){
  if(S.ts==='RUNNING'){S.ts='PAUSED_MANUAL';enterPause('manual');render();}
  else if(S.ts==='PAUSED_MANUAL'){leavePause();if(S.underAuto){S.ts='PAUSED_AUTO_CHECK';enterPause('auto');}else{S.ts='RUNNING';}render();}
  else if(S.ts==='PAUSED_AUTO_CHECK'){leavePause();S.underAuto=true;S.ts='PAUSED_MANUAL';enterPause('manual');render();}
}

/* ---------- root render ---------- */
function render(){
  app.textContent='';
  if(S.view==='intro')renderIntro();
  else if(S.view==='exam')renderExam();
  else if(S.view==='review')renderReview();
  else if(S.view==='results')renderResults();
  updateHdrBits();
}

/* ---------- INTRO SCREEN: exactly four sections ---------- */
function renderIntro(){
  var w=h('div');
  var hero=h('section','card intro-hero');
  hero.appendChild(txt('h1','intro-title',INTRO.examTitle));
  var facts=h('ul','facts');
  function fact(l,v){var li=h('li','fact');li.appendChild(txt('span','flab',l));li.appendChild(txt('span','fval',v));facts.appendChild(li);}
  fact('ATT&CK object','DET0489 — Behavior-chain detection for T1134.004 Access Token Manipulation: Parent PID Spoofing (Windows)');
  var li=h('li','fact');li.appendChild(txt('span','flab','Severity'));
  var sb=h('span','badge '+SEVCLS);sb.appendChild(txt('span','bico','◈'));sb.appendChild(txt('span',null,SEVWORD));li.appendChild(sb);facts.appendChild(li);
  fact('Object type','Detection Strategy (Enterprise domain) — analytics AN1351, technique detected: T1134.004');
  fact('Exercises in this exam',String(EXS.length));
  fact('Estimated time',META.estimatedMinutes+' minutes of focused work');
  fact('Timer budget','one countdown of '+META.estimatedMinutes+':00 for the whole attempt — pausing parks it, it never adds time');
  fact('Pass mark',PASS+'%');
  hero.appendChild(facts);
  w.appendChild(hero);

  var sec2=h('section','card');
  sec2.appendChild(txt('h2','sec-title','📚 What you will learn here'));
  INTRO.learn.forEach(function(p){sec2.appendChild(txt('p','body-p',p));});
  w.appendChild(sec2);

  var sec3=h('section','card');
  sec3.appendChild(txt('h2','sec-title','🔑 Keywords covered in this exam'));
  INTRO.keywords.forEach(function(g){
    var gh=h('div','kw-group');
    gh.appendChild(txt('h3','kw-title',g.g));
    var chips=h('div','kw-chips');
    g.items.forEach(function(it){chips.appendChild(txt('span','kw-chip',it));});
    gh.appendChild(chips);
    sec3.appendChild(gh);
  });
  w.appendChild(sec3);

  var sec4=h('section','card');
  sec4.appendChild(txt('h2','sec-title','🧭 How this exam works'));
  INTRO.how.forEach(function(p){sec4.appendChild(txt('p','body-p',p));});
  var startRow=h('div','center');
  startRow.appendChild(btn('primary big','▶ Start the exam',start));
  sec4.appendChild(startRow);
  w.appendChild(sec4);
  app.appendChild(w);
}

/* ---------- sticky exam header ---------- */
function buildHeader(){
  var hd=h('header','hdr');
  var left=h('div','hdr-left');
  left.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  left.appendChild(b);
  if(S.reviewing)left.appendChild(txt('span','review-chip','⏵ returning to a skipped exercise'));
  hd.appendChild(left);
  var mid=h('div','hdr-mid');
  mid.appendChild(txt('span','excount','Exercise '+(S.pos+1)+' of '+S.order.length));
  mid.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  mid.appendChild(txt('span','tstate','')).id='hdState';
  mid.appendChild(txt('span','tmono score','')).id='hdScore';
  hd.appendChild(mid);
  var right=h('div','hdr-right');
  var hb=btn('ghost','💡 Hint'+(S.hintUsed[cur()]?' (used)':' (−10%)'),useHint);
  hb.disabled=S.hintUsed[cur()]||S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(hb);
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.addEventListener('click',togglePause);
  right.appendChild(pb);
  var kb=btn('ghost','⤼ Skip',skipEx);
  kb.disabled=S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(kb);
  hd.appendChild(right);
  return hd;
}
function buildProgress(){var p=h('div','progress');var i=h('i');p.appendChild(i);return p;}
function updateHdrBits(){
  var t=document.getElementById('hdTime');
  if(t)t.textContent='⏱ '+fmt(S.left);
  var stn=document.getElementById('hdState');
  if(stn){
    var map={RUNNING:['▶ RUNNING',''],PAUSED_MANUAL:['⏸ PAUSED — manual (press Resume)','paused'],PAUSED_AUTO_CHECK:['⏳ CHECKING — timer parked for feedback (Next resumes)','checking'],ENDED:['■ ENDED','ended'],IDLE:['—','']};
    var m=map[S.ts]||['',''];
    stn.textContent=m[0];stn.className='tstate '+m[1];
  }
  var sc=document.getElementById('hdScore');
  if(sc){var s2=scoreNow();sc.textContent='★ '+s2.cs.toFixed(1)+' / '+s2.a+' · '+s2.pct+'%';}
  var pb=document.getElementById('hdPause');
  if(pb){pb.textContent=(S.ts==='PAUSED_MANUAL')?'▶ Resume':'⏸ Pause';pb.disabled=(S.ts==='ENDED'||S.ts==='IDLE');}
  var pr=document.querySelector('.progress i');
  if(pr&&S.order.length){var done=answeredCount();pr.style.width=Math.max(2,Math.round(done/S.order.length*100))+'%';}
}

/* ---------- scenario & question blocks (identical across every exercise) ---------- */
function renderArt(a,ex){
  var art=h('div','art');
  art.appendChild(txt('div','alabel',a.label));
  if(ex.type==='logview'&&ex.filter!==false){
    var fb=h('div','filterbox');

/* ---------- log-line syntax highlighting ---------- */
function hl(line){
  var root=h('span');
  var parts=String(line).split(/("[^"]*")/);
  for(var pi=0;pi<parts.length;pi++){
    var p=parts[pi];
    if(p==='')continue;
    if(pi%2===1){root.appendChild(txt('span','lg-s',p));continue;}
    var toks=p.split(/(\s+)/);
    for(var ti=0;ti<toks.length;ti++){
      var t=toks[ti];
      if(t==='')continue;
      if(/^\s+$/.test(t)){root.appendChild(document.createTextNode(t));continue;}
      var m=t.match(/^([A-Za-z_][\w.\-]*)(=)(.*)$/);
      if(m){root.appendChild(txt('span','lg-k',m[1]+m[2]));root.appendChild(txt('span','lg-v',m[3]));continue;}
      if(/^\d{4}-\d{2}-\d{2}/.test(t)||/^\d{2}:\d{2}:\d{2}/.test(t)){root.appendChild(txt('span','lg-t',t));continue;}
      root.appendChild(txt('span','lg-v',t));
    }
  }
  return root;
}

function dndChip(ex,s,k){

function seqChip(ex,s,k){

  var c=txt('button','chip',it.t);c.type='button';

    if(S.checked[cur()])return;
    var pos=s.seq.indexOf(k);

    var free=s.seq.length;
    if(free<ex.seq.correct.length){
      s.seq.splice(free,0,k);
      var bi=s._bank.indexOf(k);if(bi>=0)s._bank.splice(bi,1);
      s._picked=null;rerender();

  });

/* ---------- Check enablement ---------- */
function hasInteraction(ex){
  var s=st(cur());
  switch(ex.type){
    case 'qcm':case 'multi':case 'logview':return !!(s.sel&&s.sel.length>0);
    case 'match':return !!(s.m&&Object.keys(s.m).length>0);
    case 'dnd':return !!(s.pl&&Object.keys(s.pl).length>0);
    case 'order':case 'rank':return !!(s.seq&&s.seq.length>0);
    case 'fill':return !!(s.f&&Object.keys(s.f).length>0);
    case 'queue':return !!(s.q&&Object.keys(s.q).length>0);
    case 'spot':return !!(s.sp&&s.sp.length>0);
    case 'query':return !!((s.qt||'').trim());
    case 'branch':return false;
  }
  return false;
}
function updateCheckEnabled(){
  var c=document.getElementById('checkBtn');
  if(c)c.disabled=!hasInteraction(EXS[cur()]);
}

/* ---------- grading (partial credit: max(0,(H-W)/N), hint −0.10 after) ---------- */
function gradeCurrent(){
  var i=cur(),ex=EXS[i],s=st(i),g;
  if(ex.type==='qcm'||ex.type==='multi'||ex.type==='logview')g=gradeChoice(ex,s);
  else if(ex.type==='match')g=gradeMatch(ex,s);
  else if(ex.type==='dnd')g=gradeDnd(ex,s);
  else if(ex.type==='order'||ex.type==='rank')g=gradeSeq(ex,s);
  else if(ex.type==='fill')g=gradeFill(ex,s);
  else if(ex.type==='queue')g=gradeQueue(ex,s);
  else if(ex.type==='branch')g=gradeBranch(ex,s);
  else if(ex.type==='spot')g=gradeSpot(ex,s);
  else if(ex.type==='query')g=gradeQuery(ex,s);
  var N=g.N||1,H=g.H||0,W=g.W||0;
  var credit=Math.max(0,(H-W)/N);
  if(S.hintUsed[i])credit=Math.max(0,credit-0.10);
  g.credit=credit;
  return g;
}
function gradeChoice(ex,s){
  var src=choiceSrc(ex);
  var ans=src.answer,opts=src.options;
  var sel=s.sel||[];
  var byk={};opts.forEach(function(o){byk[o.k]=o;});
  var N=ans.length,H=0,W=0,rows=[];
  ans.forEach(function(k){
    var o=byk[k];
    if(inArr(sel,k)){H++;rows.push({state:'ok',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});}
    else rows.push({state:'miss',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});
  });
  sel.forEach(function(k){
    if(!inArr(ans,k)){
      W++;
      var o=byk[k];
      rows.push({state:'no',label:o.k+'. '+o.t,why:(src.whyNots&&src.whyNots[k])||'This option is not part of the correct answer here.'});
    }
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeMatch(ex,s){
  var N=ex.pairs.length,H=0,W=0,rows=[];
  ex.pairs.forEach(function(p,i){
    var c=s.m?s.m[i]:undefined;
    if(c===p.r){H++;rows.push({state:'ok',label:p.l+' → '+p.r,why:p.why||''});}
    else if(c){W++;rows.push({state:'no',label:p.l+' → '+c,why:'Correct pair: '+p.l+' → '+p.r+'. '+(p.why||'')});}
    else rows.push({state:'miss',label:p.l+' → '+p.r,why:p.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeDnd(ex,s){
  var N=ex.items.length,H=0,W=0,rows=[];
  ex.items.forEach(function(it){
    var placed=s.pl?s.pl[it.k]:undefined;
    var right=ex.map[it.k];
    if(placed===right){H++;rows.push({state:'ok',label:it.t+' → '+slotLabel(ex,right),why:(ex.whys&&ex.whys[it.k])||''});}
    else if(placed){W++;rows.push({state:'no',label:it.t+' → '+slotLabel(ex,placed),why:'Correct zone: '+slotLabel(ex,right)+'. '+(ex.whys&&ex.whys[it.k]||'')});}
    else rows.push({state:'miss',label:it.t+' (belongs in '+slotLabel(ex,right)+')',why:(ex.whys&&ex.whys[it.k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function slotLabel(ex,id){
  for(var i=0;i<ex.slots.length;i++)if(ex.slots[i].id===id)return ex.slots[i].label;
  return id;
}
function gradeSeq(ex,s){
  var corr=ex.seq.correct,N=corr.length,H=0,W=0,rows=[];
  var labels={};
  ex.seq.items.forEach(function(it){labels[it.k]=it.t;});
  corr.forEach(function(k,i){
    var placed=s.seq?s.seq[i]:undefined;
    if(placed===k){H++;rows.push({state:'ok',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});}
    else if(placed){W++;rows.push({state:'no',label:'Position '+(i+1)+': '+labels[placed],why:'Correct item for position '+(i+1)+': '+labels[k]+'. '+(ex.seq.whys&&ex.seq.whys[k]||'')});}
    else rows.push({state:'miss',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeFill(ex,s){
  var N=ex.fill.answers.length,H=0,W=0,rows=[];
  ex.fill.answers.forEach(function(w,i){
    var f=s.f?s.f[i]:undefined;
    if(f===w){H++;rows.push({state:'ok',label:'Blank '+(i+1)+': '+w,why:(ex.fill.whys&&ex.fill.whys[i])||''});}
    else if(f){W++;rows.push({state:'no',label:'Blank '+(i+1)+': you wrote "'+f+'"',why:'Correct word: '+w+'. '+(ex.fill.whys&&ex.fill.whys[i]||'')});}
    else rows.push({state:'miss',label:'Blank '+(i+1)+': '+w,why:(ex.fill.whys&&ex.fill.whys[i])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeQueue(ex,s){
  var N=ex.queue.rows.length,H=0,W=0,rows=[];
  ex.queue.rows.forEach(function(r,i){
    var c=s.q?s.q[i]:undefined;
    if(c===r.answer){H++;rows.push({state:'ok',label:r.label+': '+c,why:r.why||''});}
    else if(c){W++;rows.push({state:'no',label:r.label+': you chose "'+c+'"',why:'Correct: '+r.answer+'. '+(r.why||'')});}
    else rows.push({state:'miss',label:r.label+': '+r.answer,why:r.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeBranch(ex,s){
  var steps=ex.branch.steps,N=steps.length,H=0,W=0,rows=[];
  steps.forEach(function(sp,i){
    var a=s.b?s.b.ans[i]:undefined;
    if(a===sp.answer){H++;rows.push({state:'ok',label:'Step '+(i+1)+': '+a,why:sp.why||''});}
    else if(a){W++;rows.push({state:'no',label:'Step '+(i+1)+': you chose "'+a+'"',why:'Correct: '+sp.answer+'. '+(sp.why||'')});}
    else rows.push({state:'miss',label:'Step '+(i+1)+': '+sp.answer,why:sp.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeSpot(ex,s){
  var bad=ex.spot.bad,N=bad.length,H=0,W=0,rows=[];
  var sel=s.sp||[];
  bad.forEach(function(i){
    if(inArr(sel,i)){H++;rows.push({state:'ok',label:ex.spot.lines[i],why:(ex.spot.whys&&ex.spot.whys[i])||''});}
    else rows.push({state:'miss',label:ex.spot.lines[i],why:(ex.spot.whys&&ex.spot.whys[i])||''});
  });
  sel.forEach(function(i){
    if(!inArr(bad,i)){W++;rows.push({state:'no',label:ex.spot.lines[i],why:'This line is correct — selecting it is a false positive.'});}
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeQuery(ex,s){
  var text=normq(s.qt||'');
  var N=ex.query.elements.length,H=0,W=0,rows=[];
  function test(arr){for(var i=0;i<arr.length;i++){try{if(new RegExp(arr[i],'i').test(text))return true;}catch(e){}}return false;}
  ex.query.elements.forEach(function(e2){
    var hit=e2.all?e2.all.every(function(r){try{return new RegExp(r,'i').test(text);}catch(err){return false;}}):test(e2.any);
    if(hit){H++;rows.push({state:'ok',label:e2.desc,why:'Present in your query.'});}
    else rows.push({state:'miss',label:e2.desc,why:'Not found in your query.'});
  });
  (ex.query.forbidden||[]).forEach(function(f2){
    if(test(f2.any)){W++;rows.push({state:'no',label:f2.desc,why:f2.why||'This does not belong in a detection query.'});}
  });
  return {N:N,H:H,W:W,rows:rows,canonical:ex.query.canonical,notes:ex.query.notes};
}

/* ---------- feedback block ---------- */
function renderFeedback(host,ex,g){
  var fbx=h('div','feedback');
  var cls=g.credit>=1?'fb-ok':(g.credit>0?'fb-part':'fb-no');
  fbx.classList.add(cls);
  var head=g.credit>=1?'✓ CORRECT':(g.credit>0?'✓ PARTIALLY CORRECT — credit '+g.credit.toFixed(2):'✗ INCORRECT');
  fbx.appendChild(txt('div','fb-head '+cls,head));
  if(g.N>1){
    fbx.appendChild(txt('div','fb-credit','Partial credit: ('+g.H+' correct − '+g.W+' wrong) / '+g.N+' items = '+g.credit.toFixed(2)+(S.hintUsed[cur()]?' — hint penalty −0.10 applied':'')));
  }else if(S.hintUsed[cur()]){
    fbx.appendChild(txt('div','fb-credit','Single item: base credit '+Math.max(0,(g.H-g.W)/Math.max(1,g.N)).toFixed(2)+' — hint penalty −0.10 applied → '+g.credit.toFixed(2)));
  }
  var ul=h('ul','fb-rows');
  g.rows.forEach(function(r){
    var ic=(r.state==='ok')?'✓ Correct — ':(r.state==='no')?'✗ Wrong — ':'○ Missed — ';
    ul.appendChild(txt('li','fb-row '+r.state,ic+r.label+(r.why?' — '+r.why:'')));
  });
  fbx.appendChild(ul);
  fbx.appendChild(txt('p','fb-expl',ex.explanation));
  if(g.credit<1&&ex.study)fbx.appendChild(txt('p','fb-study','What to study next: '+ex.study));
  if(g.canonical){
    var cb=h('div','art canon');
    cb.appendChild(txt('div','alabel','Canonical query — copyable reference'));
    var pre=h('div','apre');
    g.canonical.forEach(function(ln){var r=h('div','row');r.appendChild(hl(ln));pre.appendChild(r);});
    cb.appendChild(pre);
    fbx.appendChild(cb);
    (g.notes||[]).forEach(function(nt){fbx.appendChild(txt('p','fb-note','▸ '+nt));});
  }
  host.appendChild(fbx);
}

/* ---------- footer buttons ---------- */
function footerButtons(ex,checked){
  var f=h('div','footer');
  if(checked){
    if(S.reviewing){
      f.appendChild(btn('primary','↩ Back to skipped list',function(){
        leavePause();S.underAuto=false;S.reviewing=false;S.view='review';S.ts='RUNNING';render();window.scrollTo(0,0);
      }));
      f.appendChild(txt('span','fnote','Timer resumed when you returned here — Check paused it again while you study this feedback.'));
    }else if(S.pos===S.order.length-1){
      f.appendChild(btn('primary','⏏ Final Submit',finalSubmit));
      f.appendChild(txt('span','fnote','Timer resumes on Final Submit — skipped exercises are reviewed before scoring.'));
    }else{
      f.appendChild(btn('primary','Next ▶',goNext));
      f.appendChild(txt('span','fnote','Timer paused while you review — it resumes on Next.'));
    }
  }else{
    if(ex.type!=='branch'){
      var c=btn('primary','✓ Check',function(){doCheck(false);});
      c.id='checkBtn';
      c.disabled=!hasInteraction(ex);

      f.appendChild(txt('span','fnote','Answer the exercise, then press Check. Checking pauses the timer so you can read the feedback without pressure.'));
    }else{
      f.appendChild(txt('span','fnote','Work through the steps above. The timer pauses automatically after the final step.'));
    }
  }
  return f;
}

/* ---------- exam view ---------- */
function renderExam(){
  if(S.ts==='PAUSED_MANUAL'){
    var w0=h('div');
    w0.appendChild(buildHeader());
    var p=h('section','card paused-panel');
    p.appendChild(txt('div','pp-ico','⏸'));
    p.appendChild(txt('h2','pp-t','⏸ PAUSED — manual (press Resume)'));
    p.appendChild(txt('p','body-p',S.underAuto
      ?'You pressed Pause while reading feedback. The timer is stopped. Press Resume to return to that feedback — the Next button restarts the timer.'
      :'The exercise is hidden so you cannot read or answer it while paused. The timer is stopped. Press Resume to continue where you were.'));
    p.appendChild(btn('primary big','▶ Resume',togglePause));
    w0.appendChild(p);
    app.appendChild(w0);
    return;
  }
  var w=h('div');
  w.appendChild(buildHeader());
  w.appendChild(buildProgress());
  var ex=EXS[cur()];
  var card=h('div');
  card.appendChild(renderScenario(ex));
  card.appendChild(renderQuestion(ex));
  card.appendChild(renderAnswer(ex));
  var fb=h('div');
  fb.id='fbhost';
  fb.setAttribute('aria-live','polite');
  card.appendChild(fb);
  card.appendChild(footerButtons(ex,!!S.checked[cur()]));
  w.appendChild(card);
  app.appendChild(w);
  if(S.checked[cur()]&&S._lastG[cur()])renderFeedback(fb,ex,S._lastG[cur()]);
}

/* ---------- exam flow ---------- */
function start(){
  S.view='exam';
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pos=0;S.left=(META.estimatedMinutes||30)*60;S.ts='RUNNING';
  S.credits={};S.checked={};S.skipped={};S.hintUsed={};S.hintOpen={};S.st={};S._lastG={};
  S.reviewing=false;S.reported=false;S.manualMs=0;S.autoMs=0;S.pauseKind=null;S.underAuto=false;S._resAnim=false;
  render();window.scrollTo(0,0);
}
function useHint(){
  var i=cur();
  if(S.ts!=='RUNNING')return;
  if(S.checked[i]||S.hintUsed[i])return;
  S.hintUsed[i]=true;S.hintOpen[i]=true;
  rerender();
}
function doCheck(branchFinal){
  var i=cur(),ex=EXS[i];
  if(S.checked[i])return;
  if(!branchFinal&&!hasInteraction(ex))return;
  var g=gradeCurrent();
  S._lastG[i]=g;
  S.checked[i]=true;
  S.credits[i]=g.credit;
  S.ts='PAUSED_AUTO_CHECK';
  S.underAuto=true;
  enterPause('auto');
  render();
  var fb=document.getElementById('fbhost');
  if(fb)fb.scrollIntoView({block:'nearest'});
}
function goNext(){
  leavePause();S.underAuto=false;S.ts='RUNNING';
  S.pos++;render();window.scrollTo(0,0);
}
function skipEx(){
  if(S.ts!=='RUNNING')return;
  if(S.checked[cur()])return;
  S.skipped[cur()]=true;
  if(S.reviewing){S.reviewing=false;S.view='review';S.ts='RUNNING';render();window.scrollTo(0,0);return;}
  leavePause();
  if(S.pos>=S.order.length-1){finalSubmit();}
  else{S.pos++;render();window.scrollTo(0,0);}
}
function finalSubmit(){
  leavePause();S.underAuto=false;
  var sl=skippedList();
  if(sl.length&&S.ts!=='ENDED'){S.ts='RUNNING';S.view='review';render();window.scrollTo(0,0);}
  else finish();
}
function finish(){
  leavePause();S.underAuto=false;
  if(S.ts!=='ENDED')S.ts='ENDED';
  S.view='results';
  render();
}

/* ---------- review-skipped screen ---------- */
function renderReview(){
  var w=h('div');
  var hd=h('header','hdr');
  hd.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  hd.appendChild(b);
  hd.appendChild(txt('span','excount','Review — '+skippedList().length+' skipped to answer'));
  hd.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  hd.appendChild(txt('span','tstate','')).id='hdState';
  hd.appendChild(txt('span','tmono score','')).id='hdScore';
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.setAttribute('aria-label','Pause the timer');pb.addEventListener('click',togglePause);
  hd.appendChild(pb);
  w.appendChild(hd);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','⚠ Review skipped exercises'));
  card.appendChild(txt('p','body-p','These exercises are skipped and still unanswered. You may return to any of them and answer while the timer has time left. If you finish the exam now, skipped-and-never-answered exercises are excluded from the score: they do not count as correct, wrong, or possible points.'));
  var sl=skippedList();
  sl.forEach(function(ix){
    var ex=EXS[ix];
    var row=h('div','qrow');
    var lab=h('div','qopts');
    lab.appendChild(txt('span','skchip','⚠ Skipped'));
    lab.appendChild(txt('span','sknum','Exercise '+(S.order.indexOf(ix)+1)+' of '+S.order.length));
    lab.appendChild(txt('span','sktitle',ex.title));
    row.appendChild(lab);
    row.appendChild(btn('primary','Return and answer',function(){
      S.reviewing=true;
      S.pos=S.order.indexOf(ix);
      S.view='exam';
      S.ts='RUNNING';
      render();window.scrollTo(0,0);
    }));
    card.appendChild(row);
  });
  if(!sl.length)card.appendChild(txt('p','body-p','Nothing is skipped — you can finish.'));
  var f=h('div','footer');
  f.appendChild(btn('primary big','⏏ Finish exam',finish));
  card.appendChild(f);
  w.appendChild(card);
  app.appendChild(w);
}

/* ---------- results screen ---------- */
function renderResults(){
  var f=finalNumbers();
  var pass=f.passed;
  var w=h('div');
  var hero=h('section','card result-hero '+(pass?'pass':'fail'));
  hero.appendChild(txt('div','res-ico',pass?'✓':'✗'));
  hero.appendChild(txt('h1','res-title',pass?'✓ PASS':'✗ FAIL'));
  hero.appendChild(txt('p','res-sub',pass
    ?'Certificate-style result — you mastered the '+SEVWORD+' level of DET0489 (Parent PID Spoofing detection).'
    :'Not yet — the '+SEVWORD+' level of DET0489 needs '+PASS+'% or more. Review the intro and the feedback you received, then retake.'));
  var rs=txt('div','res-score','…');rs.id='resScore';hero.appendChild(rs);
  hero.appendChild(txt('p','res-note','Pass mark '+PASS+'% — score computed over answered exercises only (skipped-and-never-answered are excluded). Raw fractional credit: '+f.raw.toFixed(2)+' — posted score rounded to '+f.score+'.'));
  w.appendChild(hero);
  if(!S._resAnim){S._resAnim=true;animateScore(rs,f);}
  else{rs.textContent=f.score+' / '+f.total+' · '+f.percent+'%';}
  var full=0,part=0,zero=0,partSum=0,k;
  for(k in S.checked){var c=S.credits[k];if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
  var grid=h('div','statgrid');
  function stat(cls,ico,label,val){var s2=h('div','stat '+cls);s2.appendChild(txt('div','big',ico+' '+val));s2.appendChild(txt('div','slab',label));return s2;}
  grid.appendChild(stat('ok','✓','Fully correct',String(full)));
  grid.appendChild(stat('part','✓','Partially correct'+(part?' — avg '+(partSum/part).toFixed(2)+' credit':''),String(part)));
  grid.appendChild(stat('no','✗','Fully incorrect',String(zero)));
  grid.appendChild(stat('skip','⚠','Skipped — excluded',String(skippedList().length)));
  var budget=(META.estimatedMinutes||30)*60;
  var active=Math.max(0,Math.round((budget-S.left)-(S.manualMs+S.autoMs)/1000));
  grid.appendChild(stat('run','▶','Time answering (timer running)',fmt(active)));
  grid.appendChild(stat('pause','⏸','Time paused manually',fmt(Math.round(S.manualMs/1000))));
  grid.appendChild(stat('pause','⏸','Time paused for feedback',fmt(Math.round(S.autoMs/1000))));
  w.appendChild(grid);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','Your answers'));
  S.order.forEach(function(ix,i){
    var ex=EXS[ix];
    var chip,stateCls;
    if(!S.checked[ix]){chip='⚠ SKIPPED — EXCLUDED';stateCls='skip';}
    else{
      var c=S.credits[ix];
      if(c>=1){chip='✓ CORRECT';stateCls='ok';}
      else if(c>0){chip='✓ PARTIALLY CORRECT — '+c.toFixed(2);stateCls='part';}
      else{chip='✗ INCORRECT';stateCls='no';}
    }
    var r=h('div','rrow');
    var ln=h('div','rline '+stateCls);
    ln.appendChild(txt('span','rlab',(i+1)+'. '+ex.title));
    ln.appendChild(txt('span','rchip',chip));
    r.appendChild(ln);
    card.appendChild(r);
  });
  w.appendChild(card);
  var f=h('div','center');
  f.appendChild(btn(pass?'ghost':'primary big','↻ Retake Exam',start));
  w.appendChild(f);
  app.appendChild(w);
}

/* ---------- site contract: score report + handshake ---------- */
function finalNumbers(){
  var s2=scoreNow();
  var score=Math.round(s2.cs); /* the fractional sum is rounded only here, once per attempt */
  var percent=s2.a>0?Math.round(score/s2.a*100):0;
  return{score:score,total:s2.a,percent:percent,passed:percent>=PASS,raw:s2.cs};
}
function reportOnce(){
  if(S.reported)return;
  S.reported=true;
  var f=finalNumbers();
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:f.score,
      total:f.total,
      percent:f.percent,
      passed:f.passed
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function animateScore(el,f){
  var fin=f.score+' / '+f.total+' · '+f.percent+'%';
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce||f.total===0){el.textContent=fin;setTimeout(reportOnce,80);return;}
  var t0=null,dur=1100;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(f.score*eased)+' / '+f.total+' · '+Math.round(f.percent*eased)+'%';
    if(p<1)requestAnimationFrame(step);
    else{el.textContent=fin;setTimeout(reportOnce,300);}
  }
  requestAnimationFrame(step);
}
window.addEventListener('message',function(ev){
  if(!ev.data)return;
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT')return;
  S.user={username:ev.data.username||'',country:ev.data.country||'',locale:ev.data.locale||''};
  /* theme field is always 'dark' — this file is dark-only by contract; nothing to switch. */
});

render();
})();

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
