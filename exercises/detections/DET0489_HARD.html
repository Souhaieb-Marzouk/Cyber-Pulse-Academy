<script>window.__INTRO__={"examTitle": "DET0489 — HARD practice exam", "learn": ["This is the HARD tier of DET0489 — the MITRE ATT&CK Detection Strategy for Parent PID Spoofing (T1134.004, sub-technique of T1134 Access Token Manipulation). At this level the questions stop being definitional. You will correlate artefacts across the three lineage witnesses (ETW EventHeader ProcessId, Security 4688 Creator Process ID/Name, Sysmon ParentProcessGuid), respect the strategy's Mutable Elements (TimeWindow, AllowedSpoofers, ParentPrivilegeDeltaThreshold, LineageMismatchTolerance, SensitiveParents), and — above all — discriminate between answers that are almost right.", "The scenarios mirror senior work: correlation windows that expire, allow-list entries used in the wrong context, SIEM rules that join on attacker-controlled fields, alerts where the least aggressive action is the correct one, and tuning changes that look wise but open blind spots. Every distractor is technically defensible somewhere — your job is to be right HERE, using the strategy's own logic. That includes weighing false positives against missed detections: a quieter rule is not always a better rule if the silence is a coverage gap.", "In real work this is the material of detection engineers (join keys, normalisation, coverage honesty), senior SOC analysts (proportionate response, escalation with business cost), and threat hunters (compensating hunts where telemetry is missing). The mitigations M1040 Behavior Prevention on Endpoint and M1026 Privileged Account Management appear as response options — with their limits.", "Use the artefact panels and the log filter. Measure time gaps. Count mismatch votes. Then answer. The hints remove one wrong path each — they never name the concept."], "keywords": [{"g": "Correlation edge cases", "items": ["TimeWindow gaps (5–10 minutes)", "mismatch votes vs LineageMismatchTolerance", "join-key choice (child identity, not the forged creator)", "three lineage votes: ETW EventHeader ProcessId, 4688 Creator Process ID/Name, Sysmon ParentProcessGuid"]}, {"g": "Tuning without blind spots", "items": ["LineageMismatchTolerance changes with measurement", "scoped AllowedSpoofers entry (name + context)", "normalised name (and case)", "what NOT to tune (witnesses, SensitiveParents)"]}, {"g": "Traps & false positives", "items": ["allow-list abuse in the wrong context (consent.exe on a server)", "the signed provisioning agent whose lineage agrees (false positive)", "benign alerts that are attacks", "alarming events that are benign"]}, {"g": "Response & controls", "items": ["least-aggressive proportionate response", "evidence preservation before containment", "M1040 Behavior Prevention on Endpoint", "M1026 Privileged Account Management", "escalation with business cost (domain controllers)"]}, {"g": "Engineering & tooling", "items": ["SIEM rule bugs (logic inversion, wrong join)", "4688-only coverage gaps and compensating hunts", "Office-to-shell bypass case", "prove a parent-child policy bypass"]}], "how": ["Passing score: 70%. A PASS means you can discriminate between near-miss answers on DET0489 and justify your choice — the HARD bar. A FAIL means you should re-read the feedback items you missed, then retake.", "Exercise types in this file: correlation log triage with a filter box, ranking by urgency, multi-select tuning and escalation sets, a branching DC escalation, report drafting with keyword insertion, find-the-bug rule lines, drag & drop sorting, and single-choice questions with near-miss distractors.", "Timer: you have 40 minutes — the artefact reading takes real time. The Pause button stops the timer and hides the exercise. Pressing Check stops the timer automatically so you can study the feedback; it resumes on Next.", "Partial credit: multi-item exercises score credit = (H − W) / N — correct items add, wrong items subtract, never below zero. Selecting everything scores zero. A hint costs 10% of that exercise's credit; one hint per exercise. Hints at this level only remove a wrong path.", "Skip: skipped exercises go to a review pool without revealing answers. Return to them any time while the timer runs; skipped-and-never-answered exercises are excluded from the final score."]};window.__EX__=[{"id": "h1", "type": "logview", "title": "Correlation edge: the chain grew cold", "summary": "API call and process creation 13 minutes apart", "filter": true, "scenario": {"paras": ["The DET0489 chain needs the UpdateProcThreadAttribute call and the resulting process creation to correlate. Your analytic config uses the page defaults. Measure the gap before you answer."], "arts": [{"label": "ARTEFACT 1 — etw kernel process (api_call)", "lines": ["07:58:03  caller=C:\\Tools\\buildagent.exe  api_call=UpdateProcThreadAttribute  attr=PROC_THREAD_ATTRIBUTE_PARENT_PROCESS  target_parent=explorer.exe"]}, {"label": "ARTEFACT 2 — WinEventLog:Security (4688)", "lines": ["08:11:41  NewProcess: C:\\Tools\\buildagent_child.exe (0x0C40)   Creator: C:\\Windows\\explorer.exe (0x0F3C)"]}, {"label": "ARTEFACT 3 — analytic config", "lines": ["TimeWindow = 5–10 minutes (default)", "LineageMismatchTolerance = 1", "AllowedSpoofers = consent.exe, svchost.exe"]}]}, "question": "Will the DET0489 chain alert on this pair under the default TimeWindow?", "hint": "Measure the gap between 07:58:03 and 08:11:41 first. The chain only counts inside the window — nothing else matters if the link is gone.", "answer": {"kind": "single", "options": [{"k": "A", "t": "No — the 13m38s gap exceeds the default 5–10 minute correlation window, so the chain does not match"}, {"k": "B", "t": "Yes — any lineage mismatch fires regardless of when the events happened"}, {"k": "C", "t": "Yes — because the spoofer buildagent.exe is not on the allow-list"}, {"k": "D", "t": "No — buildagent.exe is allow-listed, so the chain is suppressed"}], "answer": ["A"], "whys": {"A": "07:58:03 to 08:11:41 is 13 minutes 38 seconds. The chain correlation window (5–10 minutes by default) has expired, so the two events never join into one behaviour chain."}, "whyNots": {"B": "The TimeWindow exists precisely to stop distant events being joined; a mismatch alone cannot fire after expiry.", "C": "The allow-list is only consulted for candidates that already correlate — this pair never does.", "D": "buildagent.exe is not on the allow-list in Artefact 3 — and that is not why the chain stays silent anyway."}}, "explanation": "The TimeWindow is the glue of the behavior chain: UpdateProcThreadAttribute and the resulting CreateProcess must land within the correlation window (default 5–10 minutes) to be one behaviour. At 13m38s the glue has dried out — the analytic will not join them, so no DET0489 alert fires from this pair. Near-miss reasoning: the spoofer is not allow-listed and the lineage does look forged, but time kills the correlation first. The right follow-up is a hunt for the child process as a standalone anomaly, not a wait for an alert that will never come.", "study": "The TimeWindow row in the tuning cheat-sheet — and what expires with it."}, {"id": "h2", "type": "qcm", "title": "Allow-list trap: the right name in the wrong place", "summary": "consent.exe on a file server with no interactive session", "scenario": {"paras": ["Alert on SERVER-FS01 (a file server): spoofer = consent.exe, forged parent = lsass.exe, mismatch 2 of 3. Your teammate wants to close it: 'consent.exe is on the AllowedSpoofers list — allow-list wins.'", "Context: SERVER-FS01 has no interactive users and no UAC prompts — nobody is logged on at the console."]}, "question": "What is the right call?", "hint": "An allow-list entry matches a binary name AND its expected context. Where does consent.exe normally live?", "options": [{"k": "A", "t": "Investigate — consent.exe is allow-listed for interactive UAC use, and a file server with no console session should never run it"}, {"k": "B", "t": "Close it — the allow-list suppresses every consent.exe hit by design"}, {"k": "C", "t": "Reboot the server — that clears any spoofed process state"}, {"k": "D", "t": "Add lsass.exe to AllowedSpoofers so this pattern stops alerting"}], "answer": ["A"], "whys": {"A": "Allow-list entries carry an expected context: consent.exe belongs to interactive UAC prompts. The same binary on a headless file server means name imitation or abuse — that is an investigate, not a close."}, "whyNots": {"B": "Blind allow-list matching is exactly how context-blind tuning creates blind spots.", "C": "Rebooting destroys volatile evidence and fixes nothing.", "D": "Adding lsass.exe to the allow-list suppresses the most dangerous spoof pattern the analytic exists to catch."}, "explanation": "This is the classic allow-list trap: the page lists consent.exe and svchost.exe during UAC as legitimate spoofers — the 'during UAC' part is the context. A file server with no interactive session has no UAC to consent to, so a consent.exe image there is either renamed malware or a living-off-the-land abuse. Verify the binary signature and path, check who spawned it, and treat the forged lsass.exe parent (a SensitiveParent) as the escalation driver it is.", "study": "The scoped allow-list idea — a name is not a context."}, {"id": "h3", "type": "spot", "title": "Find the join that blinds the rule", "summary": "A correlation rule joining on the wrong field", "scenario": {"paras": ["A detection engineer wrote a DET0489 correlation rule. One join choice makes the rule blind exactly when a real spoof happens — because it joins on a field the attacker controls.", "Read each line and think about which 4688 field the forging call corrupts."], "arts": [{"label": "ARTEFACT 1 — correlation rule draft", "lines": ["1 | from etw:Microsoft-Windows-Kernel-Process where api_call = \"UpdateProcThreadAttribute\"", "2 | from WinEventLog:Security where EventCode = 4688", "3 | join on caller_pid == creator_process_id", "4 | where true_parent_name != creator_name (normalised)", "5 | within TimeWindow 10 minutes per host"]}]}, "question": "Click the line whose join choice blinds the rule during real spoofs.", "hint": "In a spoof, which 4688 field is already corrupted — the forged value? Would you join on it?", "spot": {"lines": ["| from etw:Microsoft-Windows-Kernel-Process where api_call = \"UpdateProcThreadAttribute\"", "| from WinEventLog:Security where EventCode = 4688", "| join on caller_pid == creator_process_id", "| where true_parent_name != creator_name (normalised)", "| within TimeWindow 10 minutes per host"], "bad": [2], "whys": {"2": "creator_process_id in 4688 is the FORGED value — the very field the attack rewrites. Joining the ETW caller to it means the join only ever succeeds for legitimate processes: every real spoof drops out of the rule exactly when it matters. The stable join key is the new (child) process identity, which both sources observe."}}, "explanation": "The whole point of T1134.004 is to corrupt the creator fields that 4688 reports. Joining the ETW api_call to creator_process_id therefore joins on attacker-controlled data: real spoofs never match (their creator field points at the fake parent), so the rule goes quiet precisely during attacks — the worst failure mode a detection can have. The robust join is on the new/child process identity, which both the ETW record and the 4688 event observe, leaving the comparison of parents to line 4.", "study": "The lineage cross-check row — which witnesses can the attacker fool, and which not?"}, {"id": "h4", "type": "queue", "title": "Four alerts, four dispositions", "summary": "Apply context, tolerance and sensitivity under time pressure", "scenario": {"paras": ["Your tuning: LineageMismatchTolerance = 1 (alert when more than one source mismatches); AllowedSpoofers = consent.exe (UAC context), svchost.exe (UAC broker context), and the signed MDM agent after CAB review; SensitiveParents = lsass.exe, services.exe, wininit.exe.", "Four alerts are queued. Options per row: Close, Investigate, Escalate high."]}, "question": "Set the correct disposition for each alert.", "hint": "For each row ask three questions in order: allow-list context? evidence above tolerance? SensitiveParent involved?", "queue": {"rows": [{"label": "R1 — SRV-DC03", "text": "spoofer=svchost.exe (no UAC activity possible on a DC), fake parent wininit.exe, mismatch 2 of 3 (tolerance 1).", "options": ["Close", "Investigate", "Escalate high"], "answer": "Escalate high", "why": "svchost.exe is allow-listed only in UAC broker context — a domain controller has none — and wininit.exe is a SensitiveParent with evidence above tolerance."}, {"label": "R2 — WKS-2291", "text": "spoofer=consent.exe during a logged UAC prompt at 09:00, approved software install, mismatch 1 of 3.", "options": ["Close", "Investigate", "Escalate high"], "answer": "Close", "why": "The documented UAC context, an allow-listed binary, and a mismatch count within tolerance — the textbook close with a note."}, {"label": "R3 — WKS-0817", "text": "spoofer=C:\\Users\\pub\\AppData\\Local\\Temp\\p.exe, fake parent explorer.exe, mismatch 3 of 3.", "options": ["Close", "Investigate", "Escalate high"], "answer": "Investigate", "why": "An unknown Temp spoofer with maximum mismatch evidence is a real spoof, but the forged parent is not sensitive — investigate first."}, {"label": "R4 — SRV-APP02", "text": "spoofer=signed MDM agent (allow-listed after CAB review), fake parent services.exe, mismatch 1 of 3, change record matches.", "options": ["Close", "Investigate", "Escalate high"], "answer": "Close", "why": "The agent is allow-listed after review, the parent claim matches its documented installer behaviour, and the mismatch count is within tolerance."}]}, "explanation": "Four rows, the full triage matrix. R1: an allow-list name outside its context plus a SensitiveParent plus above-tolerance evidence — escalate high; the allow-list never overrides context. R2 and R4 are allow-listed binaries in their documented contexts with tolerance-level evidence — close with notes. R3 is a genuine unknown spoofer with all three sources disagreeing, but explorer.exe is not sensitive — a solid investigate. Notice how evidence strength (mismatch count) and stakes (which parent) must BOTH be read before you pick a row's action.", "study": "The false-positive profile and SensitiveParents keywords."}, {"id": "h5", "type": "qcm", "title": "The proportionate response", "summary": "One mismatch, no sensitive parent — pick the least aggressive correct action", "scenario": {"paras": ["Alert: mismatch 1 of 3 (tolerance 1 — borderline), spoofer not allow-listed, fake parent explorer.exe, single workstation, no other signals.", "The options on the table range from watching to full isolation."]}, "question": "Which action is proportionate right now?", "hint": "One mismatch at the tolerance edge, no sensitive parent — match the response weight to the evidence weight.", "options": [{"k": "A", "t": "Pull the host's ETW, 4688 and Sysmon context and hunt the spoofer binary hash across the estate"}, {"k": "B", "t": "Isolate the workstation and start a full forensic image"}, {"k": "C", "t": "Block explorer.exe from spawning any child processes estate-wide"}, {"k": "D", "t": "Take no action — a single mismatch is never worth a second look"}], "answer": ["A"], "whys": {"A": "Collecting the full local context and hunting the hash costs minutes, preserves evidence, and scales the answer up or down — the proportionate move at the evidence edge."}, "whyNots": {"B": "Isolation plus imaging is a heavy cost for a borderline signal; it burns trust and hours you may need elsewhere.", "C": "Blocking explorer.exe children estate-wide breaks normal Windows usage — wildly disproportionate.", "D": "A not-allow-listed spoofer forging lineage is a real signal; ignoring it hands the attacker quiet time."}, "explanation": "HARD reality: most DET0489 alerts sit between 'obviously fine' and 'obviously malicious', and the response must be weighted. Here the evidence is thin (one mismatch vote at the tolerance edge, benign parent), so the least aggressive correct action wins: gather the complete local picture and hunt the spoofer's hash — if it exists elsewhere, the story changes immediately. Isolation, mass blocking, and ignoring are all wrong for the same reason: they do not match the evidence.", "study": "The response & controls keyword — proportionality."}, {"id": "h6", "type": "dnd", "title": "Sort five artefacts into their data components", "summary": "4688, Sysmon, and the two ETW legs", "scenario": {"paras": ["You are documenting which artefact feeds which DET0489 data component. Three components are in play: DC0032 Process Creation, DC0021 OS API Execution, DC0034 Process Metadata.", "Five artefacts are waiting. Sort them."]}, "question": "Drag each artefact onto the data component it feeds.", "hint": "Creation = a process started. API execution = the forging call itself. Metadata = the kernel's own parent bookkeeping.", "slots": [{"id": "s1", "label": "DC0032 — Process Creation"}, {"id": "s2", "label": "DC0021 — OS API Execution"}, {"id": "s3", "label": "DC0034 — Process Metadata"}], "items": [{"k": "i1", "t": "WinEventLog:Security 4688 — NewProcessName and CreatorProcessName fields"}, {"k": "i2", "t": "Sysmon Event 1 — ProcessGuid and ParentProcessGuid pair"}, {"k": "i3", "t": "etw kernel — api_call=UpdateProcThreadAttribute (PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)"}, {"k": "i4", "t": "etw kernel — CreateProcessAsUserW invoked with EXTENDED_STARTUPINFO_PRESENT"}, {"k": "i5", "t": "etw kernel — process_start with EventHeader true parent vs reported PPID"}], "map": {"i1": "s1", "i2": "s1", "i3": "s2", "i4": "s2", "i5": "s3"}, "whys": {"i1": "4688 is the canonical Process Creation record — DC0032.", "i2": "Sysmon Event 1 also records a process being created — it feeds the creation component with GUID lineage.", "i3": "The attribute-setting call is the forging primitive itself — OS API Execution, DC0021.", "i4": "The CreateProcessAsUserW call with the extended flag is the other half of the API leg — DC0021.", "i5": "The kernel's own parent bookkeeping at birth — Process Metadata, DC0034."}, "explanation": "Two artefacts feed Process Creation (4688's fields and Sysmon Event 1 — both record that a process started), two feed OS API Execution (UpdateProcThreadAttribute and the flagged CreateProcessAsUserW — the two calls of the forging chain), and one feeds Process Metadata (the kernel's true-vs-reported record). The same Sysmon event that 'counts' as creation also carries the GUID that resolves the true parent — sources can vote on more than one component, which is exactly what makes the chain resilient.", "study": "The three data components from the EASY exam — now with the Sysmon leg added."}, {"id": "h7", "type": "rank", "title": "Rank four alerts by response urgency", "summary": "Sensitive parents, evidence strength, allow-listed noise", "scenario": {"paras": ["Four DET0489 alerts arrived during your shift. Rank them from most urgent (position 1) to least urgent (position 4).", "Remember the strategy's own logic: SensitiveParents auto-escalate, evidence strength comes from the mismatch count, and allow-listed UAC noise is the bottom of any queue."]}, "question": "Rank the alerts from most to least urgent.", "hint": "Both SYSTEM-parent alerts outrank the plain-evidence one; between them, stronger evidence wins. The allow-listed UAC alert is last.", "seq": {"note": "1 = respond first, 4 = respond last.", "items": [{"k": "a", "t": "A — fake parent lsass.exe (SYSTEM), unknown Temp spoofer, mismatch 2 of 3"}, {"k": "b", "t": "B — fake parent explorer.exe, unknown Temp spoofer, mismatch 3 of 3"}, {"k": "c", "t": "C — fake parent services.exe (SYSTEM) on a domain controller, unknown spoofer, mismatch 1 of 3"}, {"k": "d", "t": "D — fake parent explorer.exe, spoofer consent.exe in a logged UAC context, mismatch 1 of 3"}], "correct": ["a", "c", "b", "d"], "whys": {"a": "SYSTEM parent (SensitiveParents auto-escalation) plus solid evidence — the top of the queue.", "c": "A SYSTEM parent on a domain controller is the highest-stakes host; the thin evidence (1 of 3) makes it verify-fast, but it cannot wait behind the others.", "b": "Maximum evidence of a real spoof, but the forged parent is only explorer.exe — serious, not critical.", "d": "Allow-listed spoofer in its documented UAC context — the quietest item; a routine close with a note."}}, "explanation": "The ranking exercise mirrors a real SOC decision: stakes first, evidence second. A and C both forge SensitiveParents (lsass.exe, services.exe), so the strategy auto-escalates them above everything else — and C's host (a domain controller) keeps it at position two despite thin evidence, because the cost of being wrong on a DC is enormous. B has the strongest raw evidence but the lowest stakes. D is allow-listed UAC noise. When your queue disagrees with this order, it is usually because stakes were weighed after evidence — flip that order.", "study": "The SensitiveParents and ParentPrivilegeDeltaThreshold keywords."}, {"id": "h8", "type": "multi", "title": "Tune the noise down without opening blind spots", "summary": "Three correct tuning changes out of seven proposals", "scenario": {"paras": ["Your DET0489 analytic is too noisy: 40 alerts a day, 90% traced to normal UAC and a provisioning agent. Leadership wants the noise cut in half — without hiding real attacks.", "Seven proposals are on the table. Exactly three are sound."]}, "question": "Select the three tuning changes that reduce noise WITHOUT creating blind spots.", "hint": "A sound change suppresses known-good context or strengthens a comparison. It never removes a mismatch vote and never hides a sensitive parent.", "options": [{"k": "A", "t": "Raise LineageMismatchTolerance from 0 to 1 after measuring normal mismatch noise"}, {"k": "B", "t": "Allow-list the signed provisioning agent only for its service account and its target hosts"}, {"k": "C", "t": "Normalise paths before comparing creator names (case, short paths, system roots)"}, {"k": "D", "t": "Add lsass.exe to AllowedSpoofers to silence the SYSTEM-parent alerts"}, {"k": "E", "t": "Set the TimeWindow to 30 seconds so distant events can never correlate"}, {"k": "F", "t": "Drop the 4688 source entirely — ETW is enough"}, {"k": "G", "t": "Set LineageMismatchTolerance to 3 so only full disagreement alerts"}], "answer": ["A", "B", "C"], "whys": {"A": "One tolerated mismatch absorbs single-source noise (like benign PPID use) while two- and three-vote spoofs still fire — a measured, reversible change.", "B": "Scoped allow-listing (account + hosts) suppresses the documented agent behaviour and nothing else.", "C": "Path normalisation removes false mismatches caused by formatting (explorer.exe vs C:\\Windows\\explorer.exe) instead of real disagreement."}, "whyNots": {"D": "lsass.exe is the crown jewel of SensitiveParents — allow-listing it hides the most dangerous spoof pattern.", "E": "A 30-second window breaks the chain for slow chains — real spoofs would stop correlating.", "F": "Dropping 4688 removes one of the three lineage votes and the creation record the chain needs.", "G": "Tolerance 3 means almost nothing ever fires — the analytic goes quiet on real attacks too."}, "explanation": "Sound tuning either suppresses verified-good context (B), absorbs measured single-vote noise (A), or fixes comparison bugs (C). Every rejected proposal removes a defence: allow-listing lsass.exe hides the exact SensitiveParent pattern, a 30-second window breaks slow chains, dropping 4688 deletes a witness, and tolerance 3 turns the analytic off in practice. The tuning rule of thumb: change context decisions freely, change evidence decisions only with measurement.", "study": "The tuning-without-blind-spots keyword group."}, {"id": "h9", "type": "qcm", "title": "Looks alarming, is benign: the signed provisioning agent", "summary": "An api_call signature hit that is actually documented behaviour", "scenario": {"paras": ["ETW shows UpdateProcThreadAttribute (PROC_THREAD_ATTRIBUTE_PARENT_PROCESS) from C:\\ProgramData\\Vendor\\Agent\\provisioning.exe — your MDM vendor's signed provisioning step — followed by CreateProcess with a chosen parent.", "Crucially: the lineage sources AGREE (mismatch 0 of 3), because the agent documents that it picks its child's parent, and the agent is allow-listed after CAB review."]}, "question": "Why is this NOT a DET0489 hit?", "hint": "DET0489 is a chain: the api_call alone is not enough. What about the mismatch — and the context?", "options": [{"k": "A", "t": "The lineage sources agree (mismatch 0 of 3) and the caller is a documented, allow-listed provisioning agent"}, {"k": "B", "t": "Any UpdateProcThreadAttribute call always fires the analytic"}, {"k": "C", "t": "Signed binaries can never be spoofers, so they are ignored"}, {"k": "D", "t": "It happened outside office hours, so it cannot be an attack"}], "answer": ["A"], "whys": {"A": "The api_call is necessary but not sufficient: the strategy needs implausible lineage across sources. Here the kernel, 4688 and Sysmon all agree, and the caller is a reviewed allow-listed agent."}, "whyNots": {"B": "If the call alone fired, every UAC prompt would be an incident — the chain exists to prevent exactly that.", "C": "Signature is one signal, not a pardon; the reasoning here is the agreement of lineage plus documented context.", "D": "Time of day is not part of this analytic's logic at all."}, "explanation": "Two independent reasons clear this alert, and both matter. First, the evidence: DET0489's core signal is disagreement between the lineage witnesses — with 0 of 3 mismatching, the chain's decisive link is missing, because a legitimately behaving agent produces agreeing sources. Second, the context: the caller is signed, documented, and allow-listed after review. An unsigned binary with the same api_call and agreeing sources would still deserve a look — context decides, signature alone never does.", "study": "The false-positive profile keyword and the scoped allow-list idea."}, {"id": "h10", "type": "branch", "title": "Escalate a domain controller alert with cost awareness", "summary": "Three decisions under business pressure", "scenario": {"paras": ["09:40. DET0489 escalated on DC-02: an unknown service child forged a services.exe parent, mismatch 2 of 3 (tolerance 1). Markets are open; the DC serves 12,000 users.", "Make the three calls in order — each has a cost."]}, "question": "Choose correctly at each step.", "hint": "Evidence preservation beats speed; containment on a DC needs a plan; confidence language must match the evidence.", "branch": {"steps": [{"text": "The escalated alert is confirmed by two lineage votes. You have seconds to choose the first move.", "q": "Step 1 — First move?", "options": ["Snapshot the ETW and Security logs, then apply a narrow containment plan for DC-02", "Immediately power off DC-02 to stop everything", "Clear the Security log to see whether the actor repeats"], "answer": "Snapshot the ETW and Security logs, then apply a narrow containment plan for DC-02", "why": "On a domain controller, unplanned power-off is an outage; clearing logs destroys evidence. Capture first, then contain narrowly."}, {"text": "The log snapshot is secured. The spoofer binary ran under a service account with local admin rights.", "q": "Step 2 — Containment choice?", "options": ["Isolate DC-02 from the network (keep it powered) and start incident response", "Delete the service account and carry on", "Watch it silently for 24 hours"], "answer": "Isolate DC-02 from the network (keep it powered) and start incident response", "why": "Network isolation keeps memory and processes alive for forensics while cutting the actor off; deleting the account tips them off and loses context."}, {"text": "The CISO asks: can we state that the attacker used parent PID spoofing to evade our parent-child rules?", "q": "Step 3 — What do you answer?", "options": ["Yes — the forged services.exe parent with multi-source mismatch matches T1134.004; confidence moderate-high pending binary analysis", "No — nothing can be said because one source was missing", "Yes — and we are certain it is APT41 specifically"], "answer": "Yes — the forged services.exe parent with multi-source mismatch matches T1134.004; confidence moderate-high pending binary analysis", "why": "Two lineage votes prove the behaviour; attribution to a named group needs far more than one spoofing event."}]}, "explanation": "A DC alert is where DET0489 meets reality. Step 1: capture before you contain — a domain controller going dark unannounced is a business incident of its own. Step 2: network isolation with power kept on preserves the volatile state your report depends on; deleting the account is attacker alarm bell number one. Step 3: say exactly what the evidence supports — the behaviour (T1134.004) is proven by two mismatch votes; attributing it to a named group from one event is not defensible. Cost-aware, evidence-first, honest confidence: that is the senior pattern.", "study": "The response & controls keyword group — evidence preservation and proportionality."}, {"id": "h11", "type": "fill", "title": "Draft the CTI report sentence", "summary": "Four keyword blanks for the weekly report", "scenario": {"paras": ["Your weekly threat report needs one precise sentence about a confirmed DET0489 detection. Fill the four blanks from the word bank — the words are ATT&CK identifiers and strategy vocabulary.", "Bank words you do not use are decoys."]}, "question": "Fill the four blanks correctly.", "hint": "One technique ID, one SensitiveParent, one tactic name, one tuning list.", "fill": {"text": "The SOC confirmed {0} Parent PID Spoofing when a Temp binary forged {1} as its parent. The behaviour primarily serves {2}, with escalation potential toward SYSTEM. The spoofer was absent from the {3} list.", "answers": ["T1134.004", "lsass.exe", <script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var INTRO=window.__INTRO__;
var EXS=window.__EX__;
var SEVMAP={easy:['EASY','sev-easy'],medium:['MEDIUM','sev-medium'],hard:['HARD','sev-hard'],'extremely-hard':['EXTREMELY HARD','sev-extreme']};
var SEVWORD=SEVMAP[META.difficulty][0];
var SEVCLS=SEVMAP[META.difficulty][1];
var PASS=META.passMark||70;
var app=document.getElementById('app');

/* ---------- tiny DOM helpers ---------- */
function h(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
function txt(t,c,s){var e=h(t,c);e.textContent=(s===undefined||s===null)?'':String(s);return e;}
function btn(cls,s,fn){var b=txt('button','btn'+(cls?' '+cls:''),s);b.type='button';b.addEventListener('click',fn);return b;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){n=Math.max(0,n|0);return (n<10?'0':'')+n;}
function fmt(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function inArr(a,x){return a.indexOf(x)>=0;}
function normq(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}

/* ---------- state ---------- */
var S={view:'intro',order:[],pos:0,ts:'IDLE',left:(META.estimatedMinutes||30)*60,
credits:{},checked:{},skipped:{},hintUsed:{},hintOpen:{},st:{},_lastG:{},
reviewing:false,reported:false,manualMs:0,autoMs:0,pauseAt:0,pauseKind:null,underAuto:false,user:null};
function cur(){return S.order[S.pos];}
function st(i){if(i===undefined)i=cur();if(!S.st[i])S.st[i]={};return S.st[i];}
function answeredCount(){var n=0,k;for(k in S.checked)n++;return n;}
function skippedList(){var o=[],i;for(i=0;i<S.order.length;i++){var ix=S.order[i];if(S.skipped[ix]&&!S.checked[ix])o.push(ix);}return o;}
function scoreNow(){var a=answeredCount(),cs=0,k;for(k in S.credits)if(S.checked[k])cs+=S.credits[k];return{cs:cs,a:a,pct:a?Math.round(cs/a*100):0};}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- pause bookkeeping ---------- */
function enterPause(kind){S.pauseAt=Date.now();S.pauseKind=kind;}
function leavePause(){if(!S.pauseKind)return;var d=Date.now()-S.pauseAt;if(S.pauseKind==='manual')S.manualMs+=d;else S.autoMs+=d;S.pauseKind=null;}

/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
setInterval(function(){
  if(S.ts==='RUNNING'){S.left--;if(S.left<=0){S.left=0;updateHdrBits();endTimer();}else{updateHdrBits();}}
},1000);
function endTimer(){
  if(S.ts==='ENDED')return;
  S.ts='ENDED';
  if(S.view==='exam'||S.view==='review'){finish();}
}
function togglePause(){
  if(S.ts==='RUNNING'){S.ts='PAUSED_MANUAL';enterPause('manual');render();}
  else if(S.ts==='PAUSED_MANUAL'){leavePause();if(S.underAuto){S.ts='PAUSED_AUTO_CHECK';enterPause('auto');}else{S.ts='RUNNING';}render();}
  else if(S.ts==='PAUSED_AUTO_CHECK'){leavePause();S.underAuto=true;S.ts='PAUSED_MANUAL';enterPause('manual');render();}
}

/* ---------- root render ---------- */
function render(){
  app.textContent='';
  if(S.view==='intro')renderIntro();
  else if(S.view==='exam')renderExam();
  else if(S.view==='review')renderReview();
  else if(S.view==='results')renderResults();
  updateHdrBits();
}

/* ---------- INTRO SCREEN: exactly four sections ---------- */
function renderIntro(){
  var w=h('div');
  var hero=h('section','card intro-hero');
  hero.appendChild(txt('h1','intro-title',INTRO.examTitle));
  var facts=h('ul','facts');
  function fact(l,v){var li=h('li','fact');li.appendChild(txt('span','flab',l));li.appendChild(txt('span','fval',v));facts.appendChild(li);}
  fact('ATT&CK object','DET0489 — Behavior-chain detection for T1134.004 Access Token Manipulation: Parent PID Spoofing (Windows)');
  var li=h('li','fact');li.appendChild(txt('span','flab','Severity'));
  var sb=h('span','badge '+SEVCLS);sb.appendChild(txt('span','bico','◈'));sb.appendChild(txt('span',null,SEVWORD));li.appendChild(sb);facts.appendChild(li);
  fact('Object type','Detection Strategy (Enterprise domain) — analytics AN1351, technique detected: T1134.004');
  fact('Exercises in this exam',String(EXS.length));
  fact('Estimated time',META.estimatedMinutes+' minutes of focused work');
  fact('Timer budget','one countdown of '+META.estimatedMinutes+':00 for the whole attempt — pausing parks it, it never adds time');
  fact('Pass mark',PASS+'%');
  hero.appendChild(facts);
  w.appendChild(hero);

  var sec2=h('section','card');
  sec2.appendChild(txt('h2','sec-title','📚 What you will learn here'));
  INTRO.learn.forEach(function(p){sec2.appendChild(txt('p','body-p',p));});
  w.appendChild(sec2);

  var sec3=h('section','card');
  sec3.appendChild(txt('h2','sec-title','🔑 Keywords covered in this exam'));
  INTRO.keywords.forEach(function(g){
    var gh=h('div','kw-group');
    gh.appendChild(txt('h3','kw-title',g.g));
    var chips=h('div','kw-chips');
    g.items.forEach(function(it){chips.appendChild(txt('span','kw-chip',it));});
    gh.appendChild(chips);
    sec3.appendChild(gh);
  });
  w.appendChild(sec3);

  var sec4=h('section','card');
  sec4.appendChild(txt('h2','sec-title','🧭 How this exam works'));
  INTRO.how.forEach(function(p){sec4.appendChild(txt('p','body-p',p));});
  var startRow=h('div','center');
  startRow.appendChild(btn('primary big','▶ Start the exam',start));
  sec4.appendChild(startRow);
  w.appendChild(sec4);
  app.appendChild(w);
}

/* ---------- sticky exam header ---------- */
function buildHeader(){
  var hd=h('header','hdr');
  var left=h('div','hdr-left');
  left.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  left.appendChild(b);
  if(S.reviewing)left.appendChild(txt('span','review-chip','⏵ returning to a skipped exercise'));
  hd.appendChild(left);
  var mid=h('div','hdr-mid');
  mid.appendChild(txt('span','excount','Exercise '+(S.pos+1)+' of '+S.order.length));
  mid.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  mid.appendChild(txt('span','tstate','')).id='hdState';
  mid.appendChild(txt('span','tmono score','')).id='hdScore';
  hd.appendChild(mid);
  var right=h('div','hdr-right');
  var hb=btn('ghost','💡 Hint'+(S.hintUsed[cur()]?' (used)':' (−10%)'),useHint);
  hb.disabled=S.hintUsed[cur()]||S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(hb);
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.addEventListener('click',togglePause);
  right.appendChild(pb);
  var kb=btn('ghost','⤼ Skip',skipEx);
  kb.disabled=S.checked[cur()]||S.ts==='PAUSED_MANUAL';
  right.appendChild(kb);
  hd.appendChild(right);
  return hd;
}
function buildProgress(){var p=h('div','progress');var i=h('i');p.appendChild(i);return p;}
function updateHdrBits(){
  var t=document.getElementById('hdTime');
  if(t)t.textContent='⏱ '+fmt(S.left);
  var stn=document.getElementById('hdState');
  if(stn){
    var map={RUNNING:['▶ RUNNING',''],PAUSED_MANUAL:['⏸ PAUSED — manual (press Resume)','paused'],PAUSED_AUTO_CHECK:['⏳ CHECKING — timer parked for feedback (Next resumes)','checking'],ENDED:['■ ENDED','ended'],IDLE:['—','']};
    var m=map[S.ts]||['',''];
    stn.textContent=m[0];stn.className='tstate '+m[1];
  }
  var sc=document.getElementById('hdScore');
  if(sc){var s2=scoreNow();sc.textContent='★ '+s2.cs.toFixed(1)+' / '+s2.a+' · '+s2.pct+'%';}
  var pb=document.getElementById('hdPause');
  if(pb){pb.textContent=(S.ts==='PAUSED_MANUAL')?'▶ Resume':'⏸ Pause';pb.disabled=(S.ts==='ENDED'||S.ts==='IDLE');}
  var pr=document.querySelector('.progress i');
  if(pr&&S.order.length){var done=answeredCount();pr.style.width=Math.max(2,Math.round(done/S.order.length*100))+'%';}
}

/* ---------- scenario & question blocks (identical across every exercise) ---------- */
function renderArt(a,ex){
  var art=h('div','art');
  art.appendChild(txt('div','alabel',a.label));
  if(ex.type==='logview'&&ex.filter!==false){
    var fb=h('div','filterbox');
    fb.appendChild(txt('span','flab2','filter:'));
    var inp=document.createElement('input');inp.type='text';
    inp.placeholder='type to filter lines…';
    inp.setAttribute('aria-label','Filter log lines');
    fb.appendChild(inp);
    var cnt=txt('span','flab2','');fb.appendChild(cnt);
    art.appendChild(fb);
    inp.addEventListener('input',function(){
      var q=inp.value.toLowerCase();var vis=0,all=0;
      var rows=art.querySelectorAll('.apre .row');
      for(var i=0;i<rows.length;i++){
        var hit=!q||rows[i].textContent.toLowerCase().indexOf(q)>=0;
        rows[i].classList.toggle('hide',!hit);if(hit)vis++;all++;
      }
      cnt.textContent=vis+'/'+all+' lines';
    });
  }
  var pre=h('div','apre');
  (a.lines||[]).forEach(function(ln){
    var r=h('div','row');
    r.appendChild(hl(ln));
    pre.appendChild(r);
  });
  art.appendChild(pre);
  return art;
}
function renderScenario(ex){
  var sc=h('section','block');
  var hd=h('div','bhead scenario');
  hd.appendChild(txt('span','bico','▣'));
  hd.appendChild(txt('span','bword','SCENARIO'));
  hd.appendChild(txt('span','spacer'));
  if(ex.summary)hd.appendChild(txt('span','sum',ex.summary));
  var tg=btn('ghost tiny','Collapse',function(){
    var body=sc.querySelector('.bbody');
    var willCollapse=!sc.classList.contains('collapsed');
    sc.classList.toggle('collapsed',willCollapse);
    tg.textContent=willCollapse?'Expand':'Collapse';
    tg.setAttribute('aria-expanded',willCollapse?'false':'true');
  });
  tg.setAttribute('aria-expanded','true');
  hd.appendChild(tg);
  sc.appendChild(hd);
  var body=h('div','bbody');
  (ex.scenario.paras||[]).forEach(function(p){body.appendChild(txt('p','body-p',p));});
  (ex.scenario.arts||[]).forEach(function(a){body.appendChild(renderArt(a,ex));});
  sc.appendChild(body);
  return sc;
}
function renderQuestion(ex){
  var q=h('section','block');
  var hd=h('div','bhead question');
  hd.appendChild(txt('span','bico','◈'));
  hd.appendChild(txt('span','bword','QUESTION'));
  q.appendChild(hd);
  var body=h('div','bbody');
  body.appendChild(txt('p','bquestion',ex.question));
  if(S.hintUsed[cur()]&&S.hintOpen[cur()]){
    var hp=h('div','hintbox');
    hp.appendChild(txt('span','hlab','💡 Hint (−10% of this exercise credit): '));
    hp.appendChild(txt('span',null,ex.hint));
    body.appendChild(hp);
  }
  q.appendChild(body);
  return q;
}

/* ---------- log-line syntax highlighting ---------- */
function hl(line){
  var root=h('span');
  var parts=String(line).split(/("[^"]*")/);
  for(var pi=0;pi<parts.length;pi++){
    var p=parts[pi];
    if(p==='')continue;
    if(pi%2===1){root.appendChild(txt('span','lg-s',p));continue;}
    var toks=p.split(/(\s+)/);
    for(var ti=0;ti<toks.length;ti++){
      var t=toks[ti];
      if(t==='')continue;
      if(/^\s+$/.test(t)){root.appendChild(document.createTextNode(t));continue;}
      var m=t.match(/^([A-Za-z_][\w.\-]*)(=)(.*)$/);
      if(m){root.appendChild(txt('span','lg-k',m[1]+m[2]));root.appendChild(txt('span','lg-v',m[3]));continue;}
      if(/^\d{4}-\d{2}-\d{2}/.test(t)||/^\d{2}:\d{2}:\d{2}/.test(t)){root.appendChild(txt('span','lg-t',t));continue;}
      root.appendChild(txt('span','lg-v',t));
    }
  }
  return root;
}

/* ---------- YOUR ANSWER block: one renderer per exercise type ---------- */
function renderAnswer(ex){
  var a=h('section','block');

  hd.appendChild(txt('span','bword','YOUR ANSWER'));

function choiceSrc(ex){return ex.type==='logview'?ex.answer:ex;}
function isMulti(ex){return ex.type==='multi'||(ex.type==='logview'&&ex.answer.kind==='multi');}
function renderChoice(host,ex){

function renderDnd(host,ex){

function dndChip(ex,s,k){
  var it=null;

  var c=txt('button','chip',it.t);c.type='button';

  if(s._picked===k)c.classList.add('picked');

    e.stopPropagation();
    if(S.checked[cur()])return;
    if(s.pl[k]){delete s.pl[k];s._bank.push(k);rerender();return;}
    s._picked=(s._picked===k)?null:k;

  });
  return c;
}
function placeDnd(ex,s,k,slot){

function renderSeq(host,ex){

function seqChip(ex,s,k){
  var it=null;
  for(var i=0;i<ex.seq.items.length;i++)if(ex.seq.items[i].k===k)it=ex.seq.items[i];
  var c=txt('button','chip',it.t);c.type='button';
  c.draggable=!S.checked[cur()];
  if(s._picked===k)c.classList.add('picked');
  c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',k);});
  c.addEventListener('click',function(e){
    e.stopPropagation();
    if(S.checked[cur()])return;
    var pos=s.seq.indexOf(k);
    if(pos>=0){s.seq.splice(pos,1);s._bank.push(k);rerender();return;}
    var free=s.seq.length;
    if(free<ex.seq.correct.length){
      s.seq.splice(free,0,k);
      var bi=s._bank.indexOf(k);if(bi>=0)s._bank.splice(bi,1);
      s._picked=null;rerender();
    }
  });
  return c;
}
function renderFill(host,ex){

    bank.appendChild(c);

  host.appendChild(bank);
}

/* ---------- Check enablement ---------- */
function hasInteraction(ex){
  var s=st(cur());
  switch(ex.type){
    case 'qcm':case 'multi':case 'logview':return !!(s.sel&&s.sel.length>0);
    case 'match':return !!(s.m&&Object.keys(s.m).length>0);
    case 'dnd':return !!(s.pl&&Object.keys(s.pl).length>0);
    case 'order':case 'rank':return !!(s.seq&&s.seq.length>0);
    case 'fill':return !!(s.f&&Object.keys(s.f).length>0);
    case 'queue':return !!(s.q&&Object.keys(s.q).length>0);
    case 'spot':return !!(s.sp&&s.sp.length>0);
    case 'query':return !!((s.qt||'').trim());
    case 'branch':return false;
  }
  return false;
}
function updateCheckEnabled(){
  var c=document.getElementById('checkBtn');
  if(c)c.disabled=!hasInteraction(EXS[cur()]);
}

/* ---------- grading (partial credit: max(0,(H-W)/N), hint −0.10 after) ---------- */
function gradeCurrent(){
  var i=cur(),ex=EXS[i],s=st(i),g;
  if(ex.type==='qcm'||ex.type==='multi'||ex.type==='logview')g=gradeChoice(ex,s);
  else if(ex.type==='match')g=gradeMatch(ex,s);
  else if(ex.type==='dnd')g=gradeDnd(ex,s);
  else if(ex.type==='order'||ex.type==='rank')g=gradeSeq(ex,s);
  else if(ex.type==='fill')g=gradeFill(ex,s);
  else if(ex.type==='queue')g=gradeQueue(ex,s);
  else if(ex.type==='branch')g=gradeBranch(ex,s);
  else if(ex.type==='spot')g=gradeSpot(ex,s);
  else if(ex.type==='query')g=gradeQuery(ex,s);
  var N=g.N||1,H=g.H||0,W=g.W||0;
  var credit=Math.max(0,(H-W)/N);
  if(S.hintUsed[i])credit=Math.max(0,credit-0.10);
  g.credit=credit;
  return g;
}
function gradeChoice(ex,s){
  var src=choiceSrc(ex);
  var ans=src.answer,opts=src.options;
  var sel=s.sel||[];
  var byk={};opts.forEach(function(o){byk[o.k]=o;});
  var N=ans.length,H=0,W=0,rows=[];
  ans.forEach(function(k){
    var o=byk[k];
    if(inArr(sel,k)){H++;rows.push({state:'ok',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});}
    else rows.push({state:'miss',label:o.k+'. '+o.t,why:(src.whys&&src.whys[k])||''});
  });
  sel.forEach(function(k){
    if(!inArr(ans,k)){
      W++;
      var o=byk[k];
      rows.push({state:'no',label:o.k+'. '+o.t,why:(src.whyNots&&src.whyNots[k])||'This option is not part of the correct answer here.'});
    }
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeMatch(ex,s){
  var N=ex.pairs.length,H=0,W=0,rows=[];
  ex.pairs.forEach(function(p,i){
    var c=s.m?s.m[i]:undefined;
    if(c===p.r){H++;rows.push({state:'ok',label:p.l+' → '+p.r,why:p.why||''});}
    else if(c){W++;rows.push({state:'no',label:p.l+' → '+c,why:'Correct pair: '+p.l+' → '+p.r+'. '+(p.why||'')});}
    else rows.push({state:'miss',label:p.l+' → '+p.r,why:p.why||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeDnd(ex,s){
  var N=ex.items.length,H=0,W=0,rows=[];
  ex.items.forEach(function(it){
    var placed=s.pl?s.pl[it.k]:undefined;
    var right=ex.map[it.k];
    if(placed===right){H++;rows.push({state:'ok',label:it.t+' → '+slotLabel(ex,right),why:(ex.whys&&ex.whys[it.k])||''});}
    else if(placed){W++;rows.push({state:'no',label:it.t+' → '+slotLabel(ex,placed),why:'Correct zone: '+slotLabel(ex,right)+'. '+(ex.whys&&ex.whys[it.k]||'')});}
    else rows.push({state:'miss',label:it.t+' (belongs in '+slotLabel(ex,right)+')',why:(ex.whys&&ex.whys[it.k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function slotLabel(ex,id){
  for(var i=0;i<ex.slots.length;i++)if(ex.slots[i].id===id)return ex.slots[i].label;
  return id;
}
function gradeSeq(ex,s){
  var corr=ex.seq.correct,N=corr.length,H=0,W=0,rows=[];
  var labels={};
  ex.seq.items.forEach(function(it){labels[it.k]=it.t;});
  corr.forEach(function(k,i){
    var placed=s.seq?s.seq[i]:undefined;
    if(placed===k){H++;rows.push({state:'ok',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});}
    else if(placed){W++;rows.push({state:'no',label:'Position '+(i+1)+': '+labels[placed],why:'Correct item for position '+(i+1)+': '+labels[k]+'. '+(ex.seq.whys&&ex.seq.whys[k]||'')});}
    else rows.push({state:'miss',label:'Position '+(i+1)+': '+labels[k],why:(ex.seq.whys&&ex.seq.whys[k])||''});
  });
  return {N:N,H:H,W:W,rows:rows};
}
function gradeFill(ex,s){
  var N=ex.fill.answers.length,H=0,W=0,rows=[];
  ex.fill.answers.forEach(function(w,i){
    var f=s.f?s.f[i]:undefined;
    if(f===w){H++;rows.push({state:'ok',label:'Blank '+(i+1)+': '+w,why:(ex.fill.whys&&ex.fill.whys[i])||''});}
    else if(f){W++;rows.push({state:'no',label:'Blank '+(i+1)+': you wrote "'+f+'"',why:'Correct word: '+w+'. '+(ex.fill.whys&&ex.fill.whys[i]||'')});}

}
function gradeQueue(ex,s){

  ex.queue.rows.forEach(function(r,i){

    else rows.push({state:'miss',label:r.label+': '+r.answer,why:r.why||''});

function gradeBranch(ex,s){

  steps.forEach(function(sp,i){

    if(a===sp.answer){H++;rows.push({state:'ok',label:'Step '+(i+1)+': '+a,why:sp.why||''});}

    else rows.push({state:'miss',label:'Step '+(i+1)+': '+sp.answer,why:sp.why||''});

function gradeSpot(ex,s){

  bad.forEach(function(i){

}
function gradeQuery(ex,s){
  var text=normq(s.qt||'');
  var N=ex.query.elements.length,H=0,W=0,rows=[];
  function test(arr){for(var i=0;i<arr.length;i++){try{if(new RegExp(arr[i],'i').test(text))return true;}catch(e){}}return false;}
  ex.query.elements.forEach(function(e2){
    var hit=e2.all?e2.all.every(function(r){try{return new RegExp(r,'i').test(text);}catch(err){return false;}}):test(e2.any);
    if(hit){H++;rows.push({state:'ok',label:e2.desc,why:'Present in your query.'});}
    else rows.push({state:'miss',label:e2.desc,why:'Not found in your query.'});
  });
  (ex.query.forbidden||[]).forEach(function(f2){
    if(test(f2.any)){W++;rows.push({state:'no',label:f2.desc,why:f2.why||'This does not belong in a detection query.'});}
  });
  return {N:N,H:H,W:W,rows:rows,canonical:ex.query.canonical,notes:ex.query.notes};
}

/* ---------- feedback block ---------- */
function renderFeedback(host,ex,g){
  var fbx=h('div','feedback');
  var cls=g.credit>=1?'fb-ok':(g.credit>0?'fb-part':'fb-no');
  fbx.classList.add(cls);
  var head=g.credit>=1?'✓ CORRECT':(g.credit>0?'✓ PARTIALLY CORRECT — credit '+g.credit.toFixed(2):'✗ INCORRECT');
  fbx.appendChild(txt('div','fb-head '+cls,head));
  if(g.N>1){
    fbx.appendChild(txt('div','fb-credit','Partial credit: ('+g.H+' correct − '+g.W+' wrong) / '+g.N+' items = '+g.credit.toFixed(2)+(S.hintUsed[cur()]?' — hint penalty −0.10 applied':'')));
  }else if(S.hintUsed[cur()]){
    fbx.appendChild(txt('div','fb-credit','Single item: base credit '+Math.max(0,(g.H-g.W)/Math.max(1,g.N)).toFixed(2)+' — hint penalty −0.10 applied → '+g.credit.toFixed(2)));
  }
  var ul=h('ul','fb-rows');
  g.rows.forEach(function(r){
    var ic=(r.state==='ok')?'✓ Correct — ':(r.state==='no')?'✗ Wrong — ':'○ Missed — ';
    ul.appendChild(txt('li','fb-row '+r.state,ic+r.label+(r.why?' — '+r.why:'')));
  });
  fbx.appendChild(ul);
  fbx.appendChild(txt('p','fb-expl',ex.explanation));
  if(g.credit<1&&ex.study)fbx.appendChild(txt('p','fb-study','What to study next: '+ex.study));
  if(g.canonical){
    var cb=h('div','art canon');
    cb.appendChild(txt('div','alabel','Canonical query — copyable reference'));
    var pre=h('div','apre');
    g.canonical.forEach(function(ln){var r=h('div','row');r.appendChild(hl(ln));pre.appendChild(r);});
    cb.appendChild(pre);
    fbx.appendChild(cb);
    (g.notes||[]).forEach(function(nt){fbx.appendChild(txt('p','fb-note','▸ '+nt));});
  }
  host.appendChild(fbx);
}

/* ---------- footer buttons ---------- */
function footerButtons(ex,checked){
  var f=h('div','footer');
  if(checked){
    if(S.reviewing){
      f.appendChild(btn('primary','↩ Back to skipped list',function(){
        leavePause();S.underAuto=false;S.reviewing=false;S.view='review';S.ts='RUNNING';render();window.scrollTo(0,0);
      }));
      f.appendChild(txt('span','fnote','Timer resumed when you returned here — Check paused it again while you study this feedback.'));
    }else if(S.pos===S.order.length-1){
      f.appendChild(btn('primary','⏏ Final Submit',finalSubmit));
      f.appendChild(txt('span','fnote','Timer resumes on Final Submit — skipped exercises are reviewed before scoring.'));
    }else{
      f.appendChild(btn('primary','Next ▶',goNext));
      f.appendChild(txt('span','fnote','Timer paused while you review — it resumes on Next.'));
    }
  }else{
    if(ex.type!=='branch'){
      var c=btn('primary','✓ Check',function(){doCheck(false);});
      c.id='checkBtn';
      c.disabled=!hasInteraction(ex);
      f.appendChild(c);
      f.appendChild(txt('span','fnote','Answer the exercise, then press Check. Checking pauses the timer so you can read the feedback without pressure.'));
    }else{
      f.appendChild(txt('span','fnote','Work through the steps above. The timer pauses automatically after the final step.'));
    }
  }
  return f;
}

/* ---------- exam view ---------- */
function renderExam(){
  if(S.ts==='PAUSED_MANUAL'){
    var w0=h('div');
    w0.appendChild(buildHeader());
    var p=h('section','card paused-panel');
    p.appendChild(txt('div','pp-ico','⏸'));
    p.appendChild(txt('h2','pp-t','⏸ PAUSED — manual (press Resume)'));
    p.appendChild(txt('p','body-p',S.underAuto
      ?'You pressed Pause while reading feedback. The timer is stopped. Press Resume to return to that feedback — the Next button restarts the timer.'
      :'The exercise is hidden so you cannot read or answer it while paused. The timer is stopped. Press Resume to continue where you were.'));
    p.appendChild(btn('primary big','▶ Resume',togglePause));
    w0.appendChild(p);
    app.appendChild(w0);
    return;
  }
  var w=h('div');
  w.appendChild(buildHeader());
  w.appendChild(buildProgress());
  var ex=EXS[cur()];
  var card=h('div');
  card.appendChild(renderScenario(ex));
  card.appendChild(renderQuestion(ex));
  card.appendChild(renderAnswer(ex));
  var fb=h('div');
  fb.id='fbhost';
  fb.setAttribute('aria-live','polite');
  card.appendChild(fb);
  card.appendChild(footerButtons(ex,!!S.checked[cur()]));
  w.appendChild(card);
  app.appendChild(w);
  if(S.checked[cur()]&&S._lastG[cur()])renderFeedback(fb,ex,S._lastG[cur()]);
}

/* ---------- exam flow ---------- */
function start(){
  S.view='exam';
  S.order=shuffle(EXS.map(function(_,i){return i;}));
  S.pos=0;S.left=(META.estimatedMinutes||30)*60;S.ts='RUNNING';
  S.credits={};S.checked={};S.skipped={};S.hintUsed={};S.hintOpen={};S.st={};S._lastG={};
  S.reviewing=false;S.reported=false;S.manualMs=0;S.autoMs=0;S.pauseKind=null;S.underAuto=false;S._resAnim=false;
  render();window.scrollTo(0,0);
}
function useHint(){
  var i=cur();
  if(S.ts!=='RUNNING')return;
  if(S.checked[i]||S.hintUsed[i])return;
  S.hintUsed[i]=true;S.hintOpen[i]=true;
  rerender();
}
function doCheck(branchFinal){
  var i=cur(),ex=EXS[i];
  if(S.checked[i])return;
  if(!branchFinal&&!hasInteraction(ex))return;
  var g=gradeCurrent();
  S._lastG[i]=g;
  S.checked[i]=true;
  S.credits[i]=g.credit;
  S.ts='PAUSED_AUTO_CHECK';
  S.underAuto=true;
  enterPause('auto');
  render();
  var fb=document.getElementById('fbhost');
  if(fb)fb.scrollIntoView({block:'nearest'});
}
function goNext(){
  leavePause();S.underAuto=false;S.ts='RUNNING';
  S.pos++;render();window.scrollTo(0,0);
}
function skipEx(){
  if(S.ts!=='RUNNING')return;
  if(S.checked[cur()])return;
  S.skipped[cur()]=true;
  if(S.reviewing){S.reviewing=false;S.view='review';S.ts='RUNNING';render();window.scrollTo(0,0);return;}
  leavePause();
  if(S.pos>=S.order.length-1){finalSubmit();}
  else{S.pos++;render();window.scrollTo(0,0);}
}
function finalSubmit(){
  leavePause();S.underAuto=false;
  var sl=skippedList();
  if(sl.length&&S.ts!=='ENDED'){S.ts='RUNNING';S.view='review';render();window.scrollTo(0,0);}
  else finish();
}
function finish(){
  leavePause();S.underAuto=false;
  if(S.ts!=='ENDED')S.ts='ENDED';
  S.view='results';
  render();
}

/* ---------- review-skipped screen ---------- */
function renderReview(){
  var w=h('div');
  var hd=h('header','hdr');
  hd.appendChild(txt('span','brand','DET0489'));
  var b=h('span','badge '+SEVCLS);b.appendChild(txt('span','bico','◈'));b.appendChild(txt('span',null,SEVWORD));
  hd.appendChild(b);
  hd.appendChild(txt('span','excount','Review — '+skippedList().length+' skipped to answer'));
  hd.appendChild(txt('span','tmono','⏱ ')).id='hdTime';
  hd.appendChild(txt('span','tstate','')).id='hdState';
  hd.appendChild(txt('span','tmono score','')).id='hdScore';
  var pb=h('button','btn warn');pb.type='button';pb.id='hdPause';pb.setAttribute('aria-label','Pause the timer');pb.addEventListener('click',togglePause);
  hd.appendChild(pb);
  w.appendChild(hd);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','⚠ Review skipped exercises'));
  card.appendChild(txt('p','body-p','These exercises are skipped and still unanswered. You may return to any of them and answer while the timer has time left. If you finish the exam now, skipped-and-never-answered exercises are excluded from the score: they do not count as correct, wrong, or possible points.'));
  var sl=skippedList();
  sl.forEach(function(ix){
    var ex=EXS[ix];
    var row=h('div','qrow');
    var lab=h('div','qopts');
    lab.appendChild(txt('span','skchip','⚠ Skipped'));
    lab.appendChild(txt('span','sknum','Exercise '+(S.order.indexOf(ix)+1)+' of '+S.order.length));
    lab.appendChild(txt('span','sktitle',ex.title));
    row.appendChild(lab);
    row.appendChild(btn('primary','Return and answer',function(){
      S.reviewing=true;
      S.pos=S.order.indexOf(ix);
      S.view='exam';
      S.ts='RUNNING';
      render();window.scrollTo(0,0);
    }));
    card.appendChild(row);
  });
  if(!sl.length)card.appendChild(txt('p','body-p','Nothing is skipped — you can finish.'));
  var f=h('div','footer');
  f.appendChild(btn('primary big','⏏ Finish exam',finish));
  card.appendChild(f);
  w.appendChild(card);
  app.appendChild(w);
}

/* ---------- results screen ---------- */
function renderResults(){
  var f=finalNumbers();
  var pass=f.passed;
  var w=h('div');
  var hero=h('section','card result-hero '+(pass?'pass':'fail'));
  hero.appendChild(txt('div','res-ico',pass?'✓':'✗'));
  hero.appendChild(txt('h1','res-title',pass?'✓ PASS':'✗ FAIL'));
  hero.appendChild(txt('p','res-sub',pass
    ?'Certificate-style result — you mastered the '+SEVWORD+' level of DET0489 (Parent PID Spoofing detection).'
    :'Not yet — the '+SEVWORD+' level of DET0489 needs '+PASS+'% or more. Review the intro and the feedback you received, then retake.'));
  var rs=txt('div','res-score','…');rs.id='resScore';hero.appendChild(rs);
  hero.appendChild(txt('p','res-note','Pass mark '+PASS+'% — score computed over answered exercises only (skipped-and-never-answered are excluded). Raw fractional credit: '+f.raw.toFixed(2)+' — posted score rounded to '+f.score+'.'));
  w.appendChild(hero);
  if(!S._resAnim){S._resAnim=true;animateScore(rs,f);}
  else{rs.textContent=f.score+' / '+f.total+' · '+f.percent+'%';}
  var full=0,part=0,zero=0,partSum=0,k;
  for(k in S.checked){var c=S.credits[k];if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
  var grid=h('div','statgrid');
  function stat(cls,ico,label,val){var s2=h('div','stat '+cls);s2.appendChild(txt('div','big',ico+' '+val));s2.appendChild(txt('div','slab',label));return s2;}
  grid.appendChild(stat('ok','✓','Fully correct',String(full)));
  grid.appendChild(stat('part','✓','Partially correct'+(part?' — avg '+(partSum/part).toFixed(2)+' credit':''),String(part)));
  grid.appendChild(stat('no','✗','Fully incorrect',String(zero)));
  grid.appendChild(stat('skip','⚠','Skipped — excluded',String(skippedList().length)));
  var budget=(META.estimatedMinutes||30)*60;
  var active=Math.max(0,Math.round((budget-S.left)-(S.manualMs+S.autoMs)/1000));
  grid.appendChild(stat('run','▶','Time answering (timer running)',fmt(active)));
  grid.appendChild(stat('pause','⏸','Time paused manually',fmt(Math.round(S.manualMs/1000))));
  grid.appendChild(stat('pause','⏸','Time paused for feedback',fmt(Math.round(S.autoMs/1000))));
  w.appendChild(grid);
  var card=h('section','card');
  card.appendChild(txt('h2','sec-title','Your answers'));
  S.order.forEach(function(ix,i){
    var ex=EXS[ix];
    var chip,stateCls;
    if(!S.checked[ix]){chip='⚠ SKIPPED — EXCLUDED';stateCls='skip';}
    else{
      var c=S.credits[ix];
      if(c>=1){chip='✓ CORRECT';stateCls='ok';}
      else if(c>0){chip='✓ PARTIALLY CORRECT — '+c.toFixed(2);stateCls='part';}
      else{chip='✗ INCORRECT';stateCls='no';}
    }
    var r=h('div','rrow');
    var ln=h('div','rline '+stateCls);
    ln.appendChild(txt('span','rlab',(i+1)+'. '+ex.title));
    ln.appendChild(txt('span','rchip',chip));
    r.appendChild(ln);
    card.appendChild(r);
  });
  w.appendChild(card);
  var f=h('div','center');
  f.appendChild(btn(pass?'ghost':'primary big','↻ Retake Exam',start));
  w.appendChild(f);
  app.appendChild(w);
}

/* ---------- site contract: score report + handshake ---------- */
function finalNumbers(){
  var s2=scoreNow();
  var score=Math.round(s2.cs); /* the fractional sum is rounded only here, once per attempt */
  var percent=s2.a>0?Math.round(score/s2.a*100):0;
  return{score:score,total:s2.a,percent:percent,passed:percent>=PASS,raw:s2.cs};
}
function reportOnce(){
  if(S.reported)return;
  S.reported=true;
  var f=finalNumbers();
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:f.score,
      total:f.total,
      percent:f.percent,
      passed:f.passed
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function animateScore(el,f){
  var fin=f.score+' / '+f.total+' · '+f.percent+'%';
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce||f.total===0){el.textContent=fin;setTimeout(reportOnce,80);return;}
  var t0=null,dur=1100;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(f.score*eased)+' / '+f.total+' · '+Math.round(f.percent*eased)+'%';
    if(p<1)requestAnimationFrame(step);
    else{el.textContent=fin;setTimeout(reportOnce,300);}
  }
  requestAnimationFrame(step);
}
window.addEventListener('message',function(ev){
  if(!ev.data)return;
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT')return;
  S.user={username:ev.data.username||'',country:ev.data.country||'',locale:ev.data.locale||''};
  /* theme field is always 'dark' — this file is dark-only by contract; nothing to switch. */
});

render();
})();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
