g feedback, resumes on Next) \u2014 study the feedback as long as you need.", "<b>Partial credit:<\/b> (right \u2212 wrong) \u00f7 parts on every multi-part exercise. Wrong picks subtract \u2014 never select everything to be safe.", "<b>Hints:<\/b> one per exercise, \u221210% of that exercise's credit. HARD hints remove one wrong path; they never name the answer.", "<b>Skipping:<\/b> free. The review-skipped pool is available until the timer ends.", "Press Start. Read the artefacts first, options second \u2014 the order matters at this level."]}, "exercises": [{"id": "H01", "type": "qcm", "label": "Log-viewer triage: name the suspect", "summary": "10-line mixed log with filter box \u2014 which process is the T1134.001 suspect and why?", "scenario": " Tuesday morning, host <span class=\"mono\">WKS-412<\/span>. AN1324 fired. You open the SIEM log-viewer, pull everything for the host in the window, and get ten mixed lines. Use the <b>filter box<\/b> (try: <span class=\"mono\">api_call<\/span>, <span class=\"mono\">4688<\/span>, <span class=\"mono\">services.exe<\/span>) to cut the noise, then decide.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Log viewer: host WKS-412, 09:30\u201309:45 (filterable)", "body": "<input class=\"logfilter\" id=\"lvFilter1\" type=\"text\" placeholder=\"filter lines\u2026 (try: api_call, 4688, services.exe)\"><div class=\"codeblock\" id=\"lv1\"><div class=\"logline\">09:31:02 <span class=\"n\">4688<\/span> User: CORP\\jsmith \u2014 CommandLine: <span class=\"s\">rundll32.exe shell32.dll,Control_RunDLL<\/span><\/div><div class=\"logline\">09:32:10 <span class=\"n\">Sysmon10<\/span> SourceImage: <span class=\"s\">C:\\Windows\\System32\\services.exe<\/span> \u2192 TargetImage: lsass.exe<\/div><div class=\"logline\">09:33:41 <span class=\"n\">4688<\/span> User: CORP\\svc_sql \u2014 CommandLine: <span class=\"s\">runas /user:CORP\\sqladmin &quot;C:\\Users\\Public\\updater.exe&quot;<\/span><\/div><div class=\"logline\">09:34:02 <span class=\"n\">ETW<\/span> api_call=<span class=\"f\">DuplicateTokenEx<\/span> caller: C:\\Users\\Public\\updater.exe<\/div><div class=\"logline\">09:34:09 <span class=\"n\">Sysmon10<\/span> SourceImage: C:\\Users\\Public\\updater.exe \u2192 TargetImage: <span class=\"s\">explorer.exe<\/span><\/div><div class=\"logline\">09:34:15 <span class=\"n\">ETW<\/span> api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span> caller: C:\\Users\\Public\\updater.exe<\/div><div class=\"logline\">09:35:00 <span class=\"n\">4688<\/span> Print Spooler restarted (service control) <span class=\"c\">// noise<\/span><\/div><div class=\"logline\">09:36:30 <span class=\"n\">4688<\/span> User: CORP\\jsmith \u2014 Teams update <span class=\"c\">// noise<\/span><\/div><div class=\"logline\">09:37:12 <span class=\"n\">4688<\/span> new process with SubjectUserName: <span class=\"s\">CORP\\sqladmin<\/span> (impersonated context)<\/div><div class=\"logline\">09:38:20 <span class=\"n\">Sysmon10<\/span> SourceImage: services.exe \u2192 TargetImage: winlogon.exe <span class=\"c\">// whitelist<\/span><\/div><\/div>"}], "question": "Which process is the T1134.001 suspect, and which artefacts seal the chain?", "hint": "One line is a whitelisted token duplicator; one is command-line noise. Find who called BOTH token APIs after the runas.", "explanation": "The suspect is <b>C:\\Users\\Public\\updater.exe<\/b>: it was launched through <span class=\"mono\">runas<\/span> (4688, 09:33:41), called <b>DuplicateTokenEx<\/b> then <b>ImpersonateLoggedOnUser<\/b> (ETW, 09:34), reached toward explorer.exe with a Sysmon 10 handle-open, and a later 4688 shows a process running as <b>CORP\\sqladmin<\/b> \u2014 the full chain. services.exe lines are whitelisted noise; rundll32/Teams/spooler lines are activity noise; explorer.exe is the <i>victim side<\/i> of a handle, not the actor. Filtering by <span class=\"mono\">api_call<\/span> makes the chain pop out in one move.", "study": "Correlating three feeds by process path: who acts, who is acted upon.", "options": ["services.exe \u2014 it opened handles to lsass.exe and winlogon.exe", "rundll32.exe \u2014 it appears twice in the window", "explorer.exe \u2014 it was the target of a handle-open event", "C:\\Users\\Public\\updater.exe \u2014 it called DuplicateTokenEx and ImpersonateLoggedOnUser right after the runas"], "correct": 3}, {"id": "H02", "type": "bins", "label": "True positive or benign?", "summary": "Sort 4 alert summaries into Likely benign / Likely true positive.", "scenario": "Four AN1324 alerts wait in the queue. You have the environment context for each. Sort them before the shift meeting \u2014 each one has a reason, and two of them are traps.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Environment notes", "body": "<div class=\"codeblock\"><span class=\"c\">// AllowedSystemProcesses: services.exe, vsssvc.exe (VSS backup), inv-agent.exe (not yet added)<\/span>\n<span class=\"c\">// UserContextFilter: CORP\\svc_backup (documented nightly runas, approved tickets)<\/span>\n<span class=\"c\">// ParentProcessAnomalyThreshold: fires on office-app \u2192 runas lineages<\/span><\/div>"}], "question": "Sort each alert into Likely benign or Likely true positive.", "hint": "Whitelisted process \u2192 benign. Filtered account with ticket \u2192 benign. Unknown script in %TEMP% \u2192 malignant. Office app parent \u2192 look twice.", "explanation": "<b>srv-backup-01 (vsssvc.exe)<\/b>: the VSS backup service is whitelisted in AllowedSystemProcesses \u2014 benign. <b>wks-sales-12 (wscript.exe in %TEMP%)<\/b>: a script in a user-writable folder calling ImpersonateLoggedOnUser 20 seconds after a runas event is the chain in its worst costume \u2014 true positive. <b>app-05 (SQL service account runas with approved ticket)<\/b>: covered by UserContextFilter with documentation \u2014 benign. <b>dc-01 (child of winword.exe calling DuplicateTokenEx)<\/b>: an Office application spawning anything that then duplicates tokens is exactly what ParentProcessAnomalyThreshold exists to score \u2014 true positive until proven otherwise. Note how both 'benign' cases cite a mutable element by name: that is the tuning working.", "study": "How each mutable element maps to one class of false positives.", "chips": ["srv-backup-01: vsssvc.exe duplicated a token; vsssvc.exe is in AllowedSystemProcesses", "wks-sales-12: wscript.exe in %TEMP% called ImpersonateLoggedOnUser 20s after a 4688 runas", "app-05: SQL service account runas with approved ticket; covered by UserContextFilter", "dc-01: unknown child of winword.exe called DuplicateTokenEx; lineage rule fires"], "bins": [{"label": "Likely benign (tuning covers it)", "accept": [0, 2]}, {"label": "Likely true positive (escalate)", "accept": [1, 3]}]}, {"id": "H03", "type": "qcm", "label": "Least-aggressive tuning under pressure", "summary": "New inventory agent floods AN1324 \u2014 pick the tuning that keeps detection strength.", "scenario": "After a company-wide rollout, the new inventory agent (<span class=\"mono\">inv-agent.exe<\/span>) legitimately calls <span class=\"mono\">SetThreadToken<\/span> on every workstation every hour. AN1324 alerts exploded from 3/day to 900/day. The CISO wants the noise gone <b>without weakening detection of real token theft<\/b>, and wants the fix today.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Impact numbers", "body": "<div class=\"codeblock\">Mon: 3 alerts \u00b7 Tue: 3 \u00b7 Wed (rollout): <span class=\"k\">912<\/span> \u00b7 Thu: <span class=\"k\">897<\/span>\n<span class=\"c\">// caller every time: C:\\Program Files\\Inventory\\inv-agent.exe \u2014 signed, deployed by IT<\/span>\n<span class=\"c\">// AllowedSystemProcesses currently: services.exe, vsssvc.exe<\/span><\/div>"}], "question": "Which response keeps detection strength AND fixes the noise?", "hint": "Two options 'solve' the noise by destroying capability. One solves it narrowly. One is the least aggressive of all and is correct.", "explanation": "The least-aggressive, capability-preserving fix is adding <b>inv-agent.exe to AllowedSystemProcesses<\/b> \u2014 one process, one entry, and the analytic still catches every other caller of SetThreadToken. Removing ETW:Token fleet-wide or disabling AN1324 destroys the detection's core capability to please one noisy agent. Setting UserContextFilter to accept <i>all<\/i> accounts is overbroad: it would also suppress the account-based signal the analytic needs. This is the exact decision a detection engineer makes on rollout day.", "study": "Least-aggressive principle in detection tuning: narrowest change that restores signal.", "options": ["Remove the ETW:Token source fleet-wide until the agent is rewritten", "Add inv-agent.exe to AllowedSystemProcesses and keep everything else unchanged", "Set UserContextFilter to accept ALL service and admin accounts", "Disable AN1324 until the vendor ships a quieter agent"], "correct": 1}, {"id": "H04", "type": "spotline", "label": "Review the correlation rule", "summary": "Rule hardcodes ONE whitelisted process \u2014 click the flawed line.", "scenario": "Your teammate migrated the AN1324 rule to a new SIEM. Five lines. One line silently breaks correctness in a way that will burn them in a month. Click it.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Migrated rule", "body": "<div class=\"codeblock\"><span class=\"n\">1<\/span>  index=win_sec EventCode=4688 AND CommandLine LIKE \"%runas%\"\n<span class=\"n\">2<\/span>  | join host within 5m [ search index=etw_token api_call IN (\"DuplicateToken\",\"DuplicateTokenEx\") ]\n<span class=\"n\">3<\/span>  | join host within 5m [ search index=etw_token api_call IN (\"ImpersonateLoggedOnUser\",\"SetThreadToken\") ]\n<span class=\"n\">4<\/span>  | where NOT process_name IN (\"services.exe\")\n<span class=\"n\">5<\/span>  | alert \"AN1324 chain detected\"<\/div>"}], "question": "Which line is flawed, and why will it burn them?", "hint": "Open the mutable-elements panel: AllowedSystemProcesses is not a single value. What happens to every OTHER whitelisted process?", "explanation": "Line 4 is the flaw: <b>AllowedSystemProcesses is a mutable LIST<\/b> (today: services.exe and vsssvc.exe; tomorrow: an agent). Hardcoding only services.exe means every other whitelisted process keeps generating false positives \u2014 the exact noise the whitelist exists to stop. Lines 2\u20133 correctly split the four-API watchlist across both ETW joins, and line 1 is a standard stage-one filter. The rule will 'work' in review and then slowly drown the team as new legitimate token duplicators appear.", "study": "Mutable elements as configuration, not literals \u2014 never hardcode a whitelist in a rule.", "lines": ["index=win_sec EventCode=4688 AND CommandLine LIKE \"%runas%\"", "| join host within 5m [ search index=etw_token api_call IN (\"DuplicateToken\",\"DuplicateTokenEx\") ]", "| join host within 5m [ search index=etw_token api_call IN (\"ImpersonateLoggedOnUser\",\"SetThreadToken\") ]", "| where NOT process_name IN (\"services.exe\")", "| alert \"AN1324 chain detected\""], "flaw": 3}, {"id": "H05", "type": "bins", "label": "Coverage gap audit", "summary": "Servers: 4688 only; workstations: full stack \u2014 sort 4 behaviours into Detectable now / Gap.", "scenario": "Coverage audit time. Current telemetry: <b>servers<\/b> \u2014 WinEventLog:Security (4688) only; <b>workstations<\/b> \u2014 4688 + Sysmon (EventCode=10) + ETW:Token. The hunter lead asks you to sort four behaviours into what the SOC can detect <i>today<\/i> versus what is a <i>gap<\/i> needing compensating controls.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Telemetry matrix", "body": "<div class=\"codeblock\">            4688   Sysmon10   ETW:Token\nservers     [x]      [ ]        [ ]\nworkstns    [x]      [x]        [x]<\/div>"}], "question": "Sort each behaviour into Detectable now or Gap.", "hint": "A behaviour is detectable where the feed that records it is deployed. Check the matrix row by row.", "explanation": "Detectable now: <b>runas executions on servers<\/b> (4688 records the command line, and servers have it) and <b>process handle opens on workstations<\/b> (Sysmon 10 is deployed there). Gaps: <b>DuplicateTokenEx API calls on servers<\/b> and <b>ImpersonateLoggedOnUser API calls on servers<\/b> \u2014 both live in ETW:Token, which servers do not stream; the analytic's core chain cannot complete there. Compensating controls to propose: deploy ETW:Token forwarding on servers, or at minimum alert on 4688 runas lineages on servers as a partial signal. This audit is a standard detection-engineering deliverable.", "study": "Coverage = behaviour \u00d7 feed \u00d7 where the feed is deployed.", "chips": ["runas executions on servers", "DuplicateTokenEx API calls on servers", "Process handle opens on workstations", "ImpersonateLoggedOnUser API calls on servers"], "bins": [{"label": "Detectable now", "accept": [0, 2]}, {"label": "Gap (needs compensating control)", "accept": [1, 3]}]}, {"id": "H06", "type": "qcm", "label": "Looks benign, is alarming", "summary": "svc_backup does an interactive runas at 03:40 outside its pattern \u2014 best-supported conclusion?", "scenario": "Tuesday 03:40. AN1324 fires on <span class=\"mono\">WKS-OPS-2<\/span>: 4688 shows <b>SubjectUserName CORP\\svc_backup<\/b> running <span class=\"mono\">runas /user:CORP\\sqladmin powershell.exe<\/span>, and 55 seconds later ETW:Token shows <b>ImpersonateLoggedOnUser<\/b> from powershell.exe. svc_backup normally runs scheduled jobs from a service host \u2014 it has <i>never<\/i> done an interactive runas from a workstation. No ticket tonight. The nightly backup job completed cleanly three hours earlier. Your teammate says: <i>\"service account, must be noise, close it.\"<\/i>", "artefacts": [{"label": "ARTEFACT 1 \u2014 Chain (SIEM)", "body": "<div class=\"codeblock\">03:40:12 <span class=\"n\">4688<\/span>  SubjectUserName: CORP\\svc_backup  CommandLine: <span class=\"s\">runas /user:CORP\\sqladmin powershell.exe<\/span>\n03:41:07 <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span>  caller: powershell.exe\n<span class=\"c\">// TimeWindow=5m \u2713   UserContextFilter: svc_backup IS listed (nightly maintenance)<\/span><\/div>"}, {"label": "ARTEFACT 2 \u2014 Pattern baseline", "body": "<div class=\"codeblock\">normal svc_backup: scheduled job from SRV-BK-01, service host parent, no interactive sessions\nlast 90 days: 0 interactive runas events for svc_backup\ntonight: interactive runas from WKS-OPS-2, no ticket, backup job already done 3h ago<\/div>"}], "question": "What is the best-supported conclusion?", "hint": "The allow-list trusts the ACCOUNT for its documented pattern. Tonight's behaviour matches no documented pattern. Who wins?", "explanation": "<b>Likely true positive \u2014 escalate.<\/b> UserContextFilter lists svc_backup for its <i>documented<\/i> pattern (nightly scheduled maintenance from the backup server). Tonight breaks every dimension of that pattern: interactive session, workstation parent, no ticket, no backup window, impersonation of sqladmin. A allow-list is a statement about a pattern, not a blanket pardon for the account \u2014 the deviation is the alarm. 'Service account = noise' is exactly the trap this analytic's designers expected. The teachable takeaway: filters cover patterns, deviations reopen the case.", "study": "UserContextFilter semantics: pattern-scoped trust, not account-wide trust.", "options": ["False positive \u2014 the account is in UserContextFilter, so the analytic should never alert on it", "Benign admin habit \u2014 sqladmin does this every night, close it", "Undetectable \u2014 ETW:Token cannot see interactive sessions", "Likely true positive \u2014 the account acted far outside its documented pattern; escalate to IR"], "correct": 3}, {"id": "H07", "type": "order", "label": "Timeline with clock skew", "summary": "One host's clock runs 3 minutes fast \u2014 normalise, then order 5 events.", "scenario": "Incident reconstruction on ticket <span class=\"mono\">#7731<\/span>. One wrinkle: host <span class=\"mono\">WKS-31<\/span>'s clock runs <b>3 minutes FAST<\/b>; the SIEM normalises its events to true time. Events logged by WKS-31 must be read at (logged time \u2212 3 minutes). Order the five events <b>by true time<\/b>.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Raw events (note the source!)", "body": "<div class=\"codeblock\">[A] 13:02:03  <span class=\"c\">(SIEM log)<\/span>      4688 runas /user:CORP\\sqladmin cmd.exe, parent: WINWORD.EXE\n[B] 13:05:21  <span class=\"c\">(WKS-31, ETW)<\/span> api_call=<span class=\"f\">DuplicateTokenEx<\/span> caller: cmd.exe\n[C] 13:05:40  <span class=\"c\">(WKS-31, ETW)<\/span> api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span> caller: cmd.exe\n[D] 13:04:00  <span class=\"c\">(SIEM log)<\/span>      4688 net.exe session enumeration under CORP\\sqladmin context\n[E] 13:06:00  <span class=\"c\">(SIEM log)<\/span>      AN1324 alert opens ticket #7731<\/div>"}, {"label": "ARTEFACT 2 \u2014 The wrinkle", "body": "<div class=\"codeblock\"><span class=\"k\">WKS-31 clock: +3 minutes fast.<\/span>  True time = logged time \u2212 3m for WKS-31 events.\n<span class=\"c\">// naive sorting by logged time WILL get this wrong<\/span><\/div>"}], "question": "Order the five events by TRUE time (earliest first).", "hint": "First normalise B and C to 13:02:21 and 13:02:40, then re-sort everything.", "explanation": "Normalise the WKS-31 events first: B becomes <b>13:02:21<\/b> and C becomes <b>13:02:40<\/b>. True order: (1) A 13:02:03 runas (notably with an Office parent \u2014 lineage anomaly), (2) B 13:02:21 DuplicateTokenEx, (3) C 13:02:40 ImpersonateLoggedOnUser, (4) D 13:04:00 net.exe used the stolen context, (5) E 13:06:00 the alert. Naively sorting raw times puts D first and produces a chain that 'starts with the attacker already acting' \u2014 a subtle but classic forensic mistake. Clock skew is why serious teams record source and clock health per feed.", "study": "Normalising timestamps across sources before correlating a chain.", "order": ["[A] 13:02:03 (SIEM) 4688 runas, parent WINWORD.EXE", "[B] true 13:02:21 (WKS-31\u22123m) DuplicateTokenEx", "[C] true 13:02:40 (WKS-31\u22123m) ImpersonateLoggedOnUser", "[D] 13:04:00 (SIEM) net.exe under sqladmin context", "[E] 13:06:00 (SIEM) AN1324 alert opens ticket #7731"]}, {"id": "H08", "type": "match", "label": "Procedure examples: who did what", "summary": "Match Tarrask / APT28 / REvil / Cobalt Strike to their documented token behaviour.", "scenario": "CTI briefing prep. The deck quotes the ATT&amp;CK procedure examples for T1134.001. Match each actor to its documented behaviour \u2014 these exact pairs appear in the technique page.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Actors in scope", "body": "<div class=\"codeblock\"><span class=\"k\">Tarrask<\/span>   <span class=\"k\">APT28<\/span>   <span class=\"k\">REvil<\/span>   <span class=\"k\">Cobalt Strike<\/span><\/div>"}], "question": "Match each actor to its documented T1134.001 behaviour.", "hint": "One exploits CVE-2015-1701 for SYSTEM; one hides from the SYSTEM desktop by taking the explorer.exe user; one wants lsass.exe permissions; one is a red-team staple that steals tokens from exiting processes.", "explanation": "<b>Tarrask<\/b> leverages token theft to obtain lsass.exe security permissions. <b>APT28<\/b> used CVE-2015-1701 to access the SYSTEM token and copy it into its own process (privilege escalation). <b>REvil<\/b> obtained the token of the user who launched explorer.exe \u2014 deliberately avoiding the SYSTEM user's desktop to stay quiet. <b>Cobalt Strike<\/b> can steal access tokens from exiting processes \u2014 a core red-team feature. Quoting real procedures like these is what makes a CTI briefing concrete.", "study": "The Procedure Examples table on the T1134.001 ATT&amp;CK page.", "pairs": [["Tarrask", "Leverages token theft to obtain lsass.exe security permissions"], ["APT28", "Used CVE-2015-1701 to copy the SYSTEM token into its own process"], ["REvil", "Took the explorer.exe user's token to avoid touching the SYSTEM desktop"], ["Cobalt Strike", "Steals access tokens from exiting processes"]]}, {"id": "H09", "type": "qcm", "label": "lsass handle: theft or dumping?", "summary": "lsass.exe handle (GrantedAccess 0x1400) + later ImpersonateLoggedOnUser \u2014 which behaviour does the COMBINATION prove?", "scenario": "Two events, 40 seconds apart, host <span class=\"mono\">FIN-APP-9<\/span>: Sysmon 10 shows <span class=\"mono\">updater.exe<\/span> opening <b>lsass.exe<\/b> with GrantedAccess <span class=\"mono\">0x1400<\/span>; then ETW:Token shows <span class=\"mono\">api_call=ImpersonateLoggedOnUser<\/span> from updater.exe. Your teammate shouts <i>\"Mimikatz! credential dumping!\"<\/i> and wants to reimage. Slow down.", "artefacts": [{"label": "ARTEFACT 1 \u2014 The two events", "body": "<div class=\"codeblock\">11:20:03 <span class=\"n\">Sysmon10<\/span>  SourceImage: C:\\Users\\Public\\updater.exe \u2192 TargetImage: <span class=\"s\">C:\\Windows\\system32\\lsass.exe<\/span>  GrantedAccess: <span class=\"n\">0x1400<\/span>\n11:20:43 <span class=\"n\">ETW<\/span>       api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span>  caller: C:\\Users\\Public\\updater.exe\n<span class=\"c\">// 0x1400 = QUERY_LIMITED_INFORMATION | QUERY_INFORMATION \u2014 query access only, no VM_READ (0x10), no memory reading<\/span><\/div>"}], "question": "Which behaviour does the COMBINED evidence most support?", "hint": "GrantedAccess 0x1400 carries only query rights \u2014 no VM_READ, so reading memory is not on the menu. What does the SECOND event prove the process did with its access?", "explanation": "The combination most supports <b>token impersonation (T1134.001)<\/b>: the follow-up <b>ImpersonateLoggedOnUser<\/b> call shows what updater.exe used its access <i>for<\/i> \u2014 acting as another user \u2014 which is the chain the analytic \">// CFO is travelling; accounting close is NEXT week, not today<\/span><\/div>"}], "question": "Answer all three steps (two blue, one red) and Check.", "hint": "Blue: contain cheaply and prove movement with an artefact that shows the stolen identity being USED. Red: which behaviour lives entirely OUTSIDE this analytic's chain?", "explanation": "<b>Step 1:<\/b> the least-aggressive containment that actually stops reuse is disabling the CFO's interactive logon and isolating WKS-44; deleting logs destroys evidence, reimaging destroys volatile evidence, and 'the CFO always does this' is contradicted by the artefacts. <b>Step 2:<\/b> movement <i>beyond<\/i> the CFO account is proven by a 4688 event showing tooling running <i>under CORP\\cfo context after the impersonation<\/i> \u2014 the identity in use. <b>Step 3 (red):<\/b> AN1324's chain is runas + duplication/assignment of an EXISTING token; an operation that instead makes a <i>new<\/i> token (T1134.003 behaviour, no runas) simply never enters this chain \u2014 a coverage gap the blue team should close with a sibling detection. That is a real purple-team debrief conversation.", "study": "Containment order, identity-use artefacts, and T1134.003 as a coverage gap for this analytic.", "steps": [{"context": "Friday evening. The chain is complete; the CFO is unreachable by design (flying).", "question": "First containment action?", "options": ["Disable CORP\\cfo interactive logon and isolate WKS-44", "Delete the 4688 events so the attacker cannot see what we know", "Reimage WKS-44 immediately, memory never matters", "Do nothing \u2014 the CFO probably runs macros like this"], "correct": 0}, {"context": "IR asks: 'prove the attacker moved BEYOND just holding the token.'", "question": "Which artefact proves movement beyond the CFO account?", "options": ["A 4688 event showing net.exe running under CORP\\cfo context after the impersonation", "The excel.exe parent process alone", "A failed ping from the firewall", "The CFO's ists last.", "order": ["[A] DC-01 \u2014 unknown binary, full chain, no allow-list", "[C] APP-SRV-3 \u2014 complete chain on the payment gateway", "[D] WKS-12 \u2014 complete chain on a departed user's workstation", "[B] WKS-88 \u2014 services.exe whitelist hit"]}, {"id": "H15", "type": "bins", "label": "Map the controls", "summary": "Sort 4 control actions into M1026 / M1018 / Detection-not-mitigation.", "scenario": "Your GRC partner is mapping token-theft controls for the quarterly review. Sort each action into its ATT&amp;CK mitigation \u2014 or flag it as a detection action instead.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Mitigation card (from the technique page)", "body": "<div class=\"codeblock\"><span class=\"k\">M1026 Privileged Account Management<\/span>\n  \u2014 limit who can 'Create a token object' (GPO user right)\n  \u2014 define who can 'Replace a process level token' (GPO user right)\n<span class=\"k\">M1018 User Account Management<\/span>\n  \u2014 the attacker needs admin already; apply least privilege everywhere<\/div>"}], "question": "Sort each action into its mitigation \u2014 or into the detection bin.", "hint": "Two actions are GPO user rights on token creation/replacement. One is the general least-privilege posture. One collects telemetry.", "explanation": "Both GPO user rights \u2014 restricting <b>'Create a token object'<\/b> and <b>'Replace a process level token'<\/b> \u2014 belong to <b>M1026 Privileged Account Management<\/b>: they directly limit who can mint or swap process tokens. The organisation-wide least-privilege posture is <b>M1018 User Account Management<\/b>. Deploying ETW:Token collection is a <i>detection<\/i> action \u2014 valuable, but it detects rather than prevents, which is why GRC reviews keep the two categories separate. The mapping is a standard GRC deliverable against the technique page.", "study": "M1026 vs M1018 on the T1134.001 page, and the mitigation/detection boundary.", "chips": ["Restrict the 'Create a token object' user right via GPO", "Restrict the 'Replace a process level token' user right via GPO", "Least privilege: users do not get local admin by default", "Deploy ETW:Token collection on all workstations"], "bins": [{"label": "M1026 Privileged Account Management", "accept": [0, 1]}, {"label": "M1018 User Account Management", "accept": [2]}, {"label": "Detection action, not a mitigation", "accept": [3]}]}]};
const META = DATA.meta;
/* Map the platform difficulty tier to the severity class — 'extremely-hard'
   must land on the .sev-extreme palette class. Set at load so the intro
   screen badge already shows the correct severity colour. */
const SEVCLASS = ({easy:'sev-easy', medium:'sev-medium', hard:'sev-hard', 'extremely-hard':'sev-extreme'})[META.difficulty] || 'sev-easy';
document.body.className = SEVCLASS;

/* ================= tiny helpers ================= */
const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function fmt(s){ s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
/* Reusable partial-credit scoring function (platform contract):
   credit = max(0, (H - W) / N) — H correct items, W wrong items, N correct items. */
function scoreExercise(selectedItems, correctItems){
  const cs = new Set(correctItems); let H = 0, W = 0;
  (selectedItems || []).forEach(v => { if (cs.has(v)) H++; else W++; });
  const N = Math.max(1, correctItems.length);
  return Math.max(0, (H - W) / N);
}

/* ================= state ================= */
const S = {
  view:'intro', order:[], pos:0, R:[], pool:[], inReview:false,
  remaining:0, tstate:'RUNNING', prevState:null, manualSec:0, autoSec:0,
  creditSum:0, answered:0, reported:false, user:'', country:'', locale:'en'
};
let tick = null;

function initExam(){
  S.order = shuffle(DATA.exercises.map((_,i)=>i));
  S.R = DATA.exercises.map(()=>({answered:false, skipped:false, hintUsed:false, credit:0}));
  S.pos = 0; S.pool = []; S.inReview = false;
  S.remaining = META.timerMinutes*60; S.tstate='RUNNING'; S.prevState=null;
  S.manualSec=0; S.autoSec=0; S.creditSum=0; S.answered=0; S.reported=false;
  document.body.className = SEVCLASS;
}
function cur(){ const oi = S.order[S.pos]; return { ex: DATA.exercises[oi], rt: S.R[oi], oi }; }

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
function setT(st){ S.tstate = st; updHud(); }
function startTick(){
  if(tick) clearInterval(tick);
  tick = setInterval(()=>{
    if(S.tstate==='RUNNING'){
      S.remaining--;
      if(S.remaining<=0){ S.remaining=0; setT('ENDED'); updHud(); finishExam(); return; }
    } else if(S.tstate==='PAUSED_MANUAL'){ S.manualSec++; }
    else if(S.tstate==='PAUSED_AUTO_CHECK'){ S.autoSec++; }
    updHud();
  }, 1000);
}
function tstateInfo(){
  switch(S.tstate){
    case 'RUNNING': return {cls:'run', txt:'▶ RUNNING'};
    case 'PAUSED_MANUAL': return {cls:'man', txt:'⏸ PAUSED — manual (press Resume)'};
    case 'PAUSED_AUTO_CHECK': return {cls:'aut', txt:'⏸ PAUSED — reviewing feedback (resumes on Next)'};
    default: return {cls:'end', txt:'■ ENDED'};
  }
}

/* ================= HUD ================= */
function updHud(){
  const t = tstateInfo();
  const cnt = $('#hudCnt'); if(cnt){ cnt.textContent = (S.view==='exam' && S.order.length) ? ('Exercise ' + (S.pos+1) + ' of ' + S.order.length) : ''; }
  const el = $('#hudTimer'); if(el){ el.textContent = fmt(S.remaining); }
  const st = $('#hudTState'); if(st){ st.textContent = t.txt; st.className = 'tstate ' + t.cls; }
  const sc = $('#hudScore');
  if(sc){ sc.innerHTML = S.answered>0
      ? 'Score <b>' + (Math.round(S.creditSum*10)/10) + '</b> / ' + S.answered + ' · ' + Math.round((S.creditSum/S.answered)*100) + '%'
      : 'Score <b>0.0</b> / 0 · —'; }
  const pf = $('#pfill'); if(pf){ pf.style.width = Math.round(((S.pos)/(S.order.length))*100) + '%'; }
  const hintB = $('#hudHint'), skipB = $('#hudSkip'), pauseB = $('#hudPause');
  if(hintB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } hintB.disabled = !rt || rt.hintUsed || rt.answered; }
  if(skipB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } skipB.disabled = !rt || rt.answered; }
  if(pauseB){ pauseB.disabled = (S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK'); }
}

/* ================= views ================= */
function render(){
  if(S.view==='intro') renderIntro();
  else if(S.view==='exam') renderExamShell();
  else if(S.view==='review') renderReview();
  else if(S.view==='results') renderResults();
}

  $('#hudPause').addEventListener('click', manualPause);
  $('#hudHint').addEventListener('click', useHint);
  $('#hudSkip').addEventListener('click', skipEx);
  renderExercise();
}

function renderExercise(){
  const { ex, rt } = cur();
  updHud();
  const box = $('#exWrap');
  box.innerHTML =
    '<section class="blk blk-scenario" id="blkScen">' +
      '<div class="blk-h">▣ SCENARIO<button class="coll-btn" id="collBtn" type="button">▾ Collapse</button></div>' +
      '<div class="coll-sum">' + (ex.summary||'Scenario collapsed') + '</div>' +
      '<div class="blk-b">' + (ex.scenario||'') + (ex.artefacts||[]).map(a=>
        '<div class="artefact"><div class="artefact-l">' + a.label + '</div><div class="artefact-b">' + a.body + '</div></div>').join('') +
      '</div>' +
    '</section>' +
    '<section class="blk blk-question"><div class="blk-h">◈ QUESTION</div><div class="blk-b"><p class="q-text">' + ex.question + '</p></div></section>' +
    '<section class="blk blk-answer"><div class="blk-h">◆ YOUR ANSWER</div><div class="blk-b" id="wbox"></div>' +
      '<div class="blk-b" id="chkHost" style="border-top:1px dashed var(--border)"></div></section>' +
    '<div id="fbHost"></div>' +
    '<div class="hintbox hidden" id="hintBox"><span class="ht">💡 HINT</span><br>' + ex.hint + '</div>';
  $('#collBtn').addEventListener('click', ()=>{
    const b = $('#blkScen'); b.classList.toggle('collapsed');
    $('#collBtn').textContent = b.classList.contains('collapsed') ? '▴ Expand' : '▾ Collapse';
  });
  renderWidget(ex, rt, $('#wbox'));
  $('#chkHost').innerHTML =
    '<div class="navrow" style="margin-top:0"><button class="btn btn-pri" id="btnCheck" style="min-width:180px">✓ Check answer</button>' +
    '<span class="small dim">Checking stops the clock so you can study the feedback without pressure — press Next when ready.</span></div>';
  $('#btnCheck').addEventListener('click', onCheck);
  /* wire any log-viewer filter boxes inside this exercise's artefacts */
  $$('.logfilter', box).forEach(inp=>{
    const host = inp.closest('.artefact-b');
    const lines = $$('.logline', host);
    inp.addEventListener('input', ()=>{
      const q = inp.value.trim().toLowerCase();
      lines.forEach(l=>{ l.style.display = (!q || l.textContent.toLowerCase().indexOf(q)>=0) ? '' : 'none'; });
    });
  });
  updHud();
  window.scrollTo(0,0);
}

function useHint(){
  const { rt } = cur();
  if(rt.hintUsed || rt.answered) return;
  rt.hintUsed = true;
  $('#hintBox').classList.remove('hidden');
  updHud();
}

function skipEx(){
  const { rt } = cur();
  if(rt.answered) return;
  rt.skipped = true;
  if(!S.pool.includes(S.order[S.pos])) S.pool.push(S.order[S.pos]);
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){ S.inReview=false; S.view='review'; renderReview(); return; }
  advance();
}

function advance(){
  if(S.pos < S.order.length-1){ S.pos++; renderExercise(); return; }
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
  else finishExam();
}

/* ----- shared drag & drop engine (pointer events: mouse + touch; click-to-place fallback)
   Implemented as a global singleton: the window-level pointermove/pointerup
   listeners are attached exactly ONCE and dispatch to the currently active drag
   context. Re-rendering an exercise only swaps DND.ctx, so no listener ever
   accumulates across exercises. ----- */
const DND = { drag:null, sel:null, ctx:null, wired:false };
function enableDnD(root, opts){
  DND.ctx = { root, opts };
  DND.sel = null; DND.drag = null;
  if(!DND.wired){
    DND.wired = true;
    window.addEventListener('pointermove', dndMove);
    window.addEventListener('pointerup', dndUp);
  }
  root.addEventListener('pointerdown', e=>{
    const o = DND.ctx.opts;
    const chip = e.target.closest(o.chips); if(!chip || chip.classList.contains('static')) return;
    if(e.target.closest('button.up') || e.target.closest('button.dn')) return;
    DND.drag = { chip, x:e.clientX, y:e.clientY, moved:false, ghost:null };
  });
  root.addEventListener('click', e=>{
    const o = DND.ctx.opts;
    const tgt = e.target.closest(o.targets);
    if(tgt && DND.sel){ o.onDrop(DND.sel, tgt); DND.sel.classList.remove('selchip'); DND.sel = null; }
  });
}
function dndMove(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(!d.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y) > 7){
    d.moved = true;
    const g = d.chip.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g;
    d.chip.classList.add('dragging');
  }
  if(d.moved){
    d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) tgt.classList.add('drop-hi');
  }
}
function dndUp(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(d.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) o.onDrop(d.chip, tgt);
    if(d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
  } else {
    if(d.chip.dataset.placed==='1'){ o.onReturn(d.chip); }
    else if(DND.sel===d.chip){ DND.sel.classList.remove('selchip'); DND.sel=null; }
    else { if(DND.sel) DND.sel.classList.remove('selchip'); DND.sel = d.chip; d.chip.classList.add('selchip'); }
  }
  DND.drag = null;
}

/* ----- drag chips into slots (1 chip per slot) ----- */
WIDGETS.slots = function(ex, rt, box){
  rt.place = ex.slots.map(()=>-1);
  const chips = shuffle(ex.items.map((_,i)=>i));
  box.innerHTML =
    '<div class="dd">' +
      '<div class="dd-bank"><h4>ITEM BANK — drag a card into a slot (or tap card then slot; tap a placed card to send it back)</h4><div id="bankW">' +
        chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.items[ci]+'</button>').join('') +
      '</div></div>' +
      '<div class="dd-slots"><h4>DROP SLOTS</h4>' +
        ex.slots.map((s,i)=>'<div class="slot drop"><div class="slot-l">'+s.label+'</div><div class="slot-w" data-i="'+i+'"></div></div>').join('') +
      '</div>' +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, slotW){
    const ci = +chipEl.dataset.c, si = +slotW.dataset.i;
    if(rt.place[si] >= 0){
      const old = $('.chip[data-c="'+rt.place[si]+'"]', slotW);
      if(old){ old.dataset.placed='0'; bankW.appendChild(old); }
    }
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    rt.place[si] = ci; chipEl.dataset.placed='1'; slotW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c;
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.slot-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.slots.forEach((s,i)=>{
      const ci = rt.place[i];
      correct.push(i+'::'+ex.items.indexOf(s.correct));
      if(ci<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — slot "'+s.label+'" stayed empty. Correct: '+s.correct}); }
      else {
        selected.push(i+'::'+ci);
        const ok = ex.items[ci]===s.correct;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+ex.items[ci]+'" in "'+s.label+'"'});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.slots.map(s=>s.label+' ← '+s.correct).join(';  ') };
  };
};

/* ----- drag chips into bins ----- */
WIDGETS.bins = function(ex, rt, box){
  rt.assign = ex.chips.map(()=>-1);
  const chips = shuffle(ex.chips.map((_,i)=>i));
  box.innerHTML =
    '<div class="bank"><span class="bank-t">Drag each card into the right bin (or tap card then bin; tap a placed card to send it back).</span><div id="bankW">' +
      chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.chips[ci]+'</button>').join('') + '</div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px">' +
      ex.bins.map((b,i)=>'<div class="bin drop"><div class="bin-h">'+b.label+'</div><div class="bin-w" data-i="'+i+'"></div></div>').join('') +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, binW){
    const ci = +chipEl.dataset.c, bi = +binW.dataset.i;
    rt.assign[ci] = bi; chipEl.dataset.placed='1'; binW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c; rt.assign[ci] = -1; chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.bin-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.chips.forEach((c,i)=>{
      const bi = rt.assign[i];
      const cbi = ex.bins.findIndex(b=>b.accept.indexOf(i)>=0);
      correct.push(i+'::'+cbi);
      if(bi<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — "'+c+'" was left unsorted. Correct bin: '+ex.bins[cbi].label}); }
      else {
        selected.push(i+'::'+bi);
        const ok = bi===cbi;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+c+'" → '+(ok?ex.bins[bi].label:'placed in "'+ex.bins[bi].label+'" (correct: '+ex.bins[cbi].label+')')});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.chips.map((c,i)=>'"'+c+'" → '+ex.bins[ex.bins.findIndex(b=>b.accept.indexOf(i)>=0)].label).join(';  ') };
  };
};

/* ----- ordering / ranking ----- */
WIDGETS.order = function(ex, rt, box){
  let seq = shuffle(ex.order.map((_,i)=>i));
  if(ex.order.length>2 && seq.every((v,p)=>v===p)) seq = shuffle(seq);
  rt.seq = seq;
  function draw(){
    box.innerHTML = '<div class="bank"><span class="bank-t">Drag rows to reorder (or use ▲▼). Position 1 goes first.</span></div><div id="olist">' +
      seq.map((oi,p)=>'<div class="orow drop" data-i="'+oi+'"><span class="onum">'+(p+1)+'</span>' +
        '<span class="mv"><button type="button" class="up" aria-label="Move up">▲</button><button type="button" class="dn" aria-label="Move down">▼</button></span>' +
        '<span class="otext">'+ex.order[oi]+'</span></div>').join('') + '</div>';
    const ol = $('#olist', box);
    $$('.up', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i>0){ [seq[i-1],seq[i]]=[seq[i],seq[i-1]]; draw(); }
    }));
    $$('.dn', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i<seq.length-1){ [seq[i+1],seq[i]]=[seq[i],seq[i+1]]; draw(); }
    }));
    enableDnD(ol, {
      chips:'.orow', targets:'.orow',
      onDrop:(chipEl, tgt)=>{
        if(chipEl===tgt) return;
        const ci = seq.indexOf(+chipEl.dataset.i);
        seq.splice(ci,1);
        const ti = seq.indexOf(+tgt.dataset.i);
        seq.splice(ci < ti ? ti+1 : ti, 0, +chipEl.dataset.i);
        draw();
      },
      onReturn:()=>{}
    });
  }
  draw();
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    seq.forEach((oi,p)=>{
      selected.push(p+'::'+oi); correct.push(p+'::'+p);
      const ok = oi===p;
      rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'position '+(p+1)+': "'+ex.order[oi]+'"'+(ok?'':' (correct: "'+ex.order[p]+'")')});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.order.map((o,i)=>(i+1)+'. '+o).join('   ') };
  };
};

/* ================= check / feedback / next ================= */
function onCheck(){
  const { ex, rt } = cur();
  if(rt.answered) return;
  const res = rt.grade();
  let credit = res.credit;
  if(rt.hintUsed) credit = Math.max(0, credit - 0.10);
  rt.credit = credit; rt.answered = true;
  S.creditSum += credit; S.answered += 1;
  if(S.pool.includes(S.order[S.pos])) S.pool = S.pool.filter(x=>x!==S.order[S.pos]);
  /* Check-triggered auto-pause: stop the clock the moment Check is pressed. */
  if(S.tstate==='RUNNING') setT('PAUSED_AUTO_CHECK');
  $('#wbox').classList.add('locked');
  $$('select', $('#wbox')).forEach(s=>s.disabled=true);
  $$('button', $('#wbox')).forEach(b=>b.disabled=true);
  const bc = $('#btnCheck'); if(bc){ bc.disabled = true; }
  const isMulti = res.multi;
  let label, cls;
  if(credit>=1){ label='✓ CORRECT'; cls='fb-ok'; }
  else if(credit>0){ label='✓ PARTIALLY CORRECT'; cls='fb-part'; }
  else { label='✗ INCORRECT'; cls='fb-bad'; }
  const pendingLeft = S.pool.filter(oi=>!S.R[oi].answered).length;
  const last = !S.inReview && S.pos===S.order.length-1 && pendingLeft===0;
  const nextLabel = S.inReview ? '↩ Back to skipped list' : (last ? '⏱ Final Submit' : 'Next exercise →');
  const itemsTxt = isMulti ? '<div class="fb-cred">credit ' + (Math.round(credit*100)/100).toFixed(2) + ' — computed as (right − wrong) ÷ items</div>' : '';
  $('#fbHost').innerHTML =
    '<section class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>' +
      (isMulti && credit>0 && credit<1 ? '<span class="small dim">per-item breakdown below</span>':'') + '</div>' +
    '<div class="fb-b">' + itemsTxt +
      '<div class="fb-rows">' + res.rows.map(r=>'<div class="r-'+r.s+'">'+r.t+'</div>').join('') + '</div>' +
      '<div class="fb-correct"><b style="color:var(--state-correct)">✓ Model answer:</b> ' + res.correct + '</div>' +
      (rt.hintUsed ? '<div class="small dim" style="margin-top:6px">Includes the −0.10 hint penalty.</div>' : '') +
      '<p class="fb-exp">' + ex.explanation + '</p>' +
      (credit<1 && ex.study ? '<div class="fb-study"><b style="color:var(--accent-amber)">What to study:</b> ' + ex.study + '</div>' : '') +
      '<div class="navrow"><button class="btn btn-pri" id="btnNext">'+nextLabel+'</button></div>' +
    '</div></section>';
  $('#btnNext').addEventListener('click', onNext);
  $('#btnNext').focus();
  updHud();
}

function onNext(){
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){
    const pending = S.pool.filter(oi=>!S.R[oi].answered);
    if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
    else finishExam();
    return;
  }
  advance();
}

function manualPause(){
  if(S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK') return;
  S.prevState = S.tstate;
  setT('PAUSED_MANUAL');
  $('#ov').style.display = 'flex';
  $('#ovResume').focus();
}
function resumePause(){
  setT(S.prevState || 'RUNNING');
  S.prevState = null;
  $('#ov').style.display = 'none';
}

/* ================= review skipped ================= */
function renderReview(){
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  $('#app').innerHTML =
    '<header class="hud">' +
      '<span class="badge">' + META.severity + '</span>' +
      '<div class="timerbox"><span class="timer" id="hudTimer"></span><span class="tstate run" id="hudTState"></span></div>' +
      '<span class="scorebox" id="hudScore"></span><span class="sp"></span>' +
      '<button class="btn btn-warn" id="hudPause">⏸ Pause</button>' +
    '</header>' +
    '<div class="progress"><div class="progress-fill" id="pfill"></div></div>' +
    '<div class="wrap">' +
      '<section class="blk blk-scenario"><div class="blk-h">⚠ REVIEW SKIPPED EXERCISES</div><div class="blk-b">' +
        '<p class="dim">You have ' + pending.length + ' skipped exercise(s). You can return to each one and answer it, as many times as you need, while the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</p>' +
        pending.map(oi=>'<div class="rv-item"><span class="warn">⚠ Skipped</span><span style="flex:1">' + DATA.exercises[oi].label + '</span>' +
          '<button class="btn btn-pri" data-oi="'+oi+'">Answer now</button></div>').join('') +
        '<div class="navrow"><button class="btn btn-pri" id="btnFinish">⏱ Finish exam &amp; see results</button></div>' +
      '</div></section>' +
    '</div>';
  $('#hudPause').addEventListener('click', manualPause);
  $('#btnFinish').addEventListener('click', finishExam);
  $$('button[data-oi]').forEach(b=>b.addEventListener('click', ()=>{
    S.pos = S.order.indexOf(+b.dataset.oi); S.inReview = true; S.view='exam'; renderExamShell();
  }));
  updHud();
  window.scrollTo(0,0);
}

/* ================= results ================= */
function finishExam(){
  setT('ENDED');
  if(tick){ clearInterval(tick); tick=null; }
  S.view='results';
  renderResults();
}
function renderResults(){
  let full=0, part=0, zero=0, skipped=0, partSum=0;
  DATA.exercises.forEach((ex,i)=>{
    const rt = S.R[i];
    if(rt.answered){
      if(rt.credit>=1) full++;
      else if(rt.credit>0){ part++; partSum+=rt.credit; }
      else zero++;
    } else skipped++;
  });
  const answered = S.answered;
  const percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  const passed = percent >= META.passMark;
  const sumR = Math.round(S.creditSum*10)/10;
  const avgPart = part>0 ? (Math.round(partSum/part*100)/100).toFixed(2) : '—';
  $('#app').innerHTML =
    '<div class="wrap">' +
      '<section class="card hero"><h1>' + META.id + ' — ' + META.severity + ' — Results</h1>' +
        '<p class="obj">Score over answered exercises only: <b class="mono" style="color:var(--text-primary)">' + sumR + ' / ' + answered + '</b> · <b class="mono" style="color:var(--text-primary)">' + percent + '%</b> · pass mark ' + META.passMark + '%</p>' +
      '</section>' +
      '<div class="res-grid">' +
        '<div class="res ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct (credit 1.0)</div></div>' +
        '<div class="res part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct (avg '+avgPart+')</div></div>' +
        '<div class="res bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect (credit 0)</div></div>' +
        '<div class="res skip"><div class="num">'+skipped+'</div><div class="lab">⚠ Skipped — excluded from score</div></div>' +
      '</div>' +
      '<div class="verdict '+(passed?'pass':'fail')+'">' +
        (passed
          ? '<h2>✓ PASS</h2><p>You reached ' + percent + '% (threshold ' + META.passMark + '%). Certificate-level performance on ' + META.id + ' at ' + META.severity + ' severity. Take the next severity file when you are ready.</p>'
          : '<h2>✗ FAIL</h2><p>You reached ' + percent + '%, below the ' + META.passMark + '% pass mark. You must retake this exam. Review the explanations you saw during the attempt, then press Retake — exercises and options are shuffled again.</p>') +
        '<div class="navrow"><button class="btn btn-pri" id="btnRetake" style="min-width:200px">↻ Retake exam</button></div>' +
      '</div>' +
      '<p class="pausetime">⏸ Manual pause time: ' + fmt(S.manualSec) + ' · ⏸ Feedback review time (auto-pause): ' + fmt(S.autoSec) + '</p>' +
    '</div>';
  $('#btnRetake').addEventListener('click', ()=>{
    initExam(); S.view='exam'; render(); startTick();
  });
  reportScore();
  window.scrollTo(0,0);
}

/* ================= website integration ================= */
function reportScore(){
  if(S.reported) return; S.reported = true;
  const answeredCount = S.answered;
  const percent = answeredCount>0 ? Math.round((S.creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score: Math.round(S.creditSum), total: answeredCount,
      percent: percent, passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* opened directly rather than inside the site — nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.user = event.data.username || S.user;
  S.country = event.data.country || S.country;
  S.locale = event.data.locale || S.locale;
  /* theme field is always 'dark' — the exam is dark-only by contract, so nothing to switch */
});

/* ================= resume overlay wiring ================= */
$('#ovResume').addEventListener('click', resumePause);

/* ================= go ================= */
render();
</script>
</body>
</html>
