var INTRO = {"html": "\n<div class=\"intro-head\">\n  <h1>DET0397 — HARD practice exam</h1>\n  <div class=\"obj\">MITRE ATT&amp;CK Detection Strategy <b>DET0397</b> — Automated Exfiltration Detection Strategy<br>\n  Detects: <b>T1020 — Automated Exfiltration</b> (Tactic: Exfiltration) · Enterprise domain</div>\n  <span class=\"badge hard\" role=\"img\" aria-label=\"Severity HARD\">HARD</span>\n  <span id=\"intro-greet\" style=\"margin-left:10px;color:var(--text-secondary);font-size:.92rem\"></span>\n  <div class=\"facts\" style=\"margin-top:12px\">\n    <span class=\"fact\">Exercises: <b>15</b></span>\n    <span class=\"fact\">Estimated time: <b>60 min</b></span>\n    <span class=\"fact\">Timer budget: <b>60 min</b></span>\n    <span class=\"fact\">Pass mark: <b>70%</b></span>\n    <span class=\"fact\">Scoring: <b>partial credit</b></span>\n  </div>\n</div>\n<div class=\"card\">\n  <h2>What you will learn here</h2>\n  <p>Hello! In this exam you will learn about <b>DET0397</b>, the <b>Automated Exfiltration Detection Strategy</b> from the MITRE ATT&amp;CK framework.</p><p>First, what is a <b>detection strategy</b>? In ATT&amp;CK, a detection strategy is a plan that tells defenders <i>how</i> to notice one attacker behaviour. It says which logs to collect, what pattern to look for, and which parts you can tune for your own company. DET0397 watches for <b>T1020 — Automated Exfiltration</b>. That is when malware sends stolen data out by itself, again and again, without a human typing anything. The data often leaves in small pieces, on a schedule, so it looks quiet and normal.</p><p>Who uses this in real work? <b>Detection engineers</b> build the rules. <b>SOC analysts</b> get the alerts and decide if they are real. <b>Threat hunters</b> search old logs for the same pattern. <b>Incident responders</b> use it to see what data left a hacked host. <b>CTI analysts</b> connect the pattern to known groups. The tools are a SIEM, EDR on computers, and network flow sensors.</p><p>Why does it matter? If data leaves your network silently, the damage is often found months later. This detection gives you an early alarm.</p><p>You will meet this object in: alert triage queues, detection rule reviews, threat-hunt notes, tuning meetings, and incident reports. The risks it addresses are silent data theft, long-dwell breaches, and lost customer data.</p><p>This HARD file gives you near-miss answers. Two options may both look right; only one is right <b>here</b>.\n</div>\n<div class=\"card\">\n  <h2>Keywords covered in this exam</h2>\n  <div class='kw-theme'>The detection object and ATT&CK position</div><div class='chips'><span class='chip'>T1020.001 Traffic Mirroring gap</span><span class='chip'>Exfiltration-stage chain (collection → staging → automation → T1020)</span></div><div class='kw-theme'>Data sources and telemetry</div><div class='chips'><span class='chip'>unified log exec + network + launchd (DC0001/DC0032/DC0082)</span><span class='chip'>Sysmon 3/11</span><span class='chip'>4688 + task XML</span></div><div class='kw-theme'>Analytics and detection logic</div><div class='chips'><span class='chip'>per-program linkage</span><span class='chip'>partial-period evaluation</span><span class='chip'>LOLBin (certutil) automation pattern</span></div><div class='kw-theme'>Tuning and mutable elements</div><div class='chips'><span class='chip'>DestinationIP allowlist</span><span class='chip'>UserContext scoping</span><span class='chip'>TimeWindow widening</span><span class='chip'>LaunchInterval</span></div><div class='kw-theme'>False positives and baselines</div><div class='chips'><span class='chip'>backup look-alike in odd path</span><span class='chip'>signed sync client</span><span class='chip'>staging writes in temp</span></div><div class='kw-theme'>Detection engineering practice</div><div class='chips'><span class='chip'>correlation-key debugging</span><span class='chip'>evidence-preserving containment</span><span class='chip'>verdict discipline (tune/escalate/insufficient)</span></div><div class='kw-theme'>Real-world procedures and threat actors</div><div class='chips'><span class='chip'>S0090 Rover</span><span class='chip'>G0094 Kimsuky</span><span class='chip'>S0538 Crutch</span><span class='chip'>S0377 Ebury</span></div><div class='kw-theme'>Coverage gaps and compensating detections</div><div class='chips'><span class='chip'>network devices outside host analytics</span><span class='chip'>compensating network-side coverage</span></div>\n</div>\n<div class=\"card\">\n  <h2>How this exam works</h2>\n  <ul class=\"rules\">\n      <li class=\"r-pass\"><b>Pass mark: 70%.</b> Your score is computed only over exercises you actually answered.\n        PASS means you showed solid control of this severity. FAIL means you should read the explanations and retake.</li>\n      <li class=\"r-info\"><b>Exercise types in this file:</b> log analysis, branching decisions, matching, ranking, ordering, drag-and-drop, fill-in-the-blank.</li>\n      <li class=\"r-timer\"><b>Timer:</b> you have <b>60 minutes</b> (estimated effort: about 60 minutes).\n        The timer has two kinds of pause. The <b>Pause button</b> is a manual break: the exercise hides and the timer stops.\n        Pressing <b>Check</b> also stops the timer automatically so you can read the feedback for as long as you want —\n        it resumes only when you press <b>Next</b> (or Final Submit on the last exercise). Skipping and hints never pause the timer.</li>\n      <li class=\"r-part\"><b>Partial credit:</b> exercises with several correct items give <b>partial credit</b>:\n        credit = max(0, (right − wrong) / total items). Selecting everything “to be safe” gives zero.\n        One hint per exercise costs −0.10 of that exercise's credit.</li>\n      <li class=\"r-skip\"><b>Skip:</b> you can skip any exercise and return to skipped ones before you finish.\n        Skipped-and-never-answered exercises are simply excluded from the score. The exam ends with a\n        “Review skipped exercises” screen while the timer is still running.</li>\n    \n  </ul>\n  <div style=\"margin-top:16px\"><button class=\"btn primary\" id=\"btnStart\" style=\"min-width:180px\">▶ Start the exam</button></div>\n</div>\n"};
var EX = [{"id": "h01", "type": "logs", "theme": "False positives and baselines", "title": "The backup that lives in the wrong folder", "collapsedSummary": "SRV-APP-05 hourly uploads — verdict and action.", "scenario": "AN1113 fired on SRV-APP-05: one external destination, hourly, for six cycles. The time window is 10 minutes. The queue auto-label says “high” because the process path looks unusual. Two artefacts below. Decide the verdict and the action.", "artefacts": [{"label": "ARTEFACT 1 — process side (WinEventLog:Security 4688)", "logs": ["07:00:02 EventCode=4688 host=SRV-APP-05 NewProcessName=C:\\Users\\Public\\bup\\bup-agent.exe user=svc_bup TaskName=\\BupHourly", "08:00:02 EventCode=4688 host=SRV-APP-05 NewProcessName=C:\\Users\\Public\\bup\\bup-agent.exe user=svc_bup TaskName=\\BupHourly"]}, {"label": "ARTEFACT 2 — network side (Sysmon EventCode 3)", "logs": ["07:00:09 EventCode=3 host=SRV-APP-05 Image=C:\\Users\\Public\\bup\\bup-agent.exe DestinationIp=198[.]51[.]100[.]210 DestinationPort=443 bytes_out=850000000", "08:00:09 EventCode=3 host=SRV-APP-05 Image=C:\\Users\\Public\\bup\\bup-agent.exe DestinationIp=198[.]51[.]100[.]210 DestinationPort=443 bytes_out=850000000"]}], "question": "What is the best verdict and action for this alert?", "sub": {"mode": "qcm", "prompt": "Pick the one option a senior analyst would defend.", "options": [{"id": "a", "text": "Verify with the backup owner, then tune DestinationIP for the vendor range — the service account and task name fit an approved job"}, {"id": "b", "text": "Declare ransomware exfiltration and isolate the host — code in C:\\Users\\Public is always malware"}, {"id": "c", "text": "Tune away every hourly pattern from now on — hourly jobs are never attacker behaviour"}, {"id": "d", "text": "Escalate to IR immediately without any destination check — volume alone proves theft"}]}, "correct": ["a"], "explanation": "The alarming part (binary under C:\\Users\\Public) is real hygiene weakness, but it is not the decision driver. The decisive signals are: a stable task name, a dedicated service account, a constant hourly cadence, one fixed destination, and ~850 MB each run — the profile of a scheduled backup product. The professional move is one verification call (who owns this job?), then a DestinationIP allowlist for the vendor range. Option C over-tunes and would blind you to a real hourly exfil; B and D skip verification and burn IR time on a known-good job.", "study": "Reading intent from task name, service account, cadence and destination before judging path cosmetics.", "hint": "The path is ugly, but look at who runs the job, how steady the pattern is, and where it goes."}, {"id": "h02", "type": "branch", "theme": "Analytics and detection logic", "title": "The 60-second LaunchDaemon", "collapsedSummary": "mac-design-02 beacons every 60 s — three verification steps.", "scenario": "AN1115 fired on mac-design-02. The alert claims a LaunchDaemon makes an outbound connection every 60 seconds to 203[.]0[.]113[.]90:8443. LaunchInterval on your instance is 120 seconds — the alert fired because the observed interval is HALF the tuned one.", "question": "Work the three steps in order.", "steps": [{"context": "Your first clue must come from the host, not the alert card.", "question": "STEP 1 — Where do you confirm the repeating task exists?", "options": [{"id": "a", "text": "In the launchd/cron records (DC0001) and the unified log exec events"}, {"id": "b", "text": "In the Windows Security log of the same host"}, {"id": "c", "text": "In the firewall vendor's marketing documents"}, {"id": "d", "text": "Nowhere — LaunchDaemons leave no records"}], "correct": "a", "ack": "Right: on macOS the scheduled-job evidence lives in launchd/cron records plus unified log exec entries."}, {"context": "The job exists: com.apple.updatekit (unsigned, in /Library/LaunchDaemons).", "question": "STEP 2 — Which detail makes the network half conclusive?", "options": [{"id": "a", "text": "Unified log network entries tying the SAME program to each periodic connection"}, {"id": "b", "text": "The destination port 8443 being unusual, on its own"}, {"id": "c", "text": "The user's design apps also using the network"}, {"id": "d", "text": "The total bytes: any number above 1 MB proves exfiltration"}], "correct": "a", "ack": "Correct: per-program linkage of exec → connection is what turns “traffic exists” into “this job does the traffic”."}, {"context": "Every 60 s, one connection, ~2 MB out, for 40 cycles. The binary is unsigned and new.", "question": "STEP 3 — Decide.", "options": [{"id": "a", "text": "Escalate to IR as suspected automated exfiltration; propose containment after evidence capture"}, {"id": "b", "text": "Tune LaunchInterval to 60 s to silence the alert and move on"}, {"id": "c", "text": "Close it — the name “com.apple.updatekit” means Apple software"}, {"id": "d", "text": "Wait for 100 more cycles to be certain"}], "correct": "a", "ack": "Escalation it is. An unsigned fake-Apple daemon beaming data every minute is a T1020 candidate — do not tune it away."}], "explanation": "Step 1: on macOS, the scheduled half of the story lives in launchd/cron records (DC0001) and unified-log exec entries (DC0032). Step 2: the conclusive network half needs the unified log to tie the same program to each periodic connection (DC0082) — a weird port or a byte count alone proves nothing. Step 3: an unsigned binary pretending to be Apple, beaming ~80 MB in 40 minutes, is a textbook AN1115 true positive. Tuning LaunchInterval to 60 s would silence a real detection — tuning exists for false positives, not for inconvenient truths.", "study": "AN1115's three sources and why per-program linkage beats single-signal reasoning.", "hint": "Step 2: which artefact ties a specific program to each connection? Step 3: who benefits from silencing this alert?"}, {"id": "h03", "type": "multi", "theme": "Data sources and telemetry", "title": "Stock the macOS pipeline", "collapsedSummary": "Select every source AN1115 needs (partial credit).", "scenario": "You are onboarding macOS telemetry for AN1115. The DET0397 page lists what the analytic reads. Select every source it actually requires — nothing more, nothing less.", "question": "Select ALL log sources AN1115 depends on.", "options": [{"id": "a", "text": "macos:unifiedlog — process: exec (DC0032)"}, {"id": "b", "text": "WinEventLog:Security — EventCode=4688"}, {"id": "c", "text": "macos:unifiedlog — network (DC0082)"}, {"id": "d", "text": "auditd:SYSCALL — execve"}, {"id": "e", "text": "macos:cron / launchd — scheduled job creation (DC0001)"}, {"id": "f", "text": "NSM:Flow — outbound connections"}], "correct": ["a", "c", "e"], "explanation": "AN1115 is the macOS analytic: it reads the unified log for process executions (a) and network activity (c), plus cron/launchd scheduled-job records (e). The Windows Security log (b) and Linux auditd (d) belong to AN1113 and AN1114. NSM flow (f) is an AN1114 source on Linux — useful telemetry generally, but not part of AN1115's recipe. Picking extra sources costs budget without adding coverage for this analytic.", "study": "The AN1115 Log Sources table: two unified-log components plus cron/launchd.", "hint": "Filter the six options by one question: is this macOS-native telemetry?"}, {"id": "h04", "type": "logs", "theme": "Detection engineering practice", "title": "One line breaks the rule", "collapsedSummary": "Find the line that defeats AN1113's logic.", "scenario": "A colleague deployed this AN1113 implementation in the SIEM. It has produced strange results: true positives are missed and unrelated hosts get chained together. Read the rule and find the broken line.", "artefacts": [{"label": "ARTEFACT 1 — deployed rule (pseudo-SPL, line numbers added)", "pre": "L1  index=wineventlog EventCode=4688\nL2    | join dest_ip [ search index=sysmon EventCode=3 ]\nL3    | stats count by host, dest_ip, PID\nL4    | where count >= 2\nL5    | bin _time span=5m as TimeWindow\nL6  | search NOT dest_ip IN (trusted_ranges)"}], "question": "Which line breaks the intended AN1113 logic, and why?", "sub": {"mode": "qcm", "prompt": "Pick the one line whose flaw explains the symptoms.", "options": [{"id": "a", "text": "L2 — joining on destination IP instead of the process identity chains unrelated programs together"}, {"id": "b", "text": "L5 — a 5-minute window is far too long for any correlation"}, {"id": "c", "text": "L4 — count >= 2 is impossibly high for any real exfiltration"}, {"id": "d", "text": "L1 — EventCode 4688 never appears on real networks"}]}, "correct": ["a"], "explanation": "L2 is the wound. AN1113's join must link a process creation event to the connection made by that SAME process — the process identity (PID / process name). Joining on dest_ip says “anything that started, and anything that went to this IP, are one story”: two unrelated programs sharing a destination get fused, and a real uploader that shares an IP with a browser vanishes into someone else's chain. L5's 5-minute window is exactly the tuned value DET0397 suggests, L4's >= 2 repeats is a sane floor, and L1 is the required source. The symptom list (missed TPs + false chains) points straight at the join key.", "study": "Correlation keys: process identity (PID), not destination IP, is what AN1113 joins on.", "hint": "Ask for each line: does it answer “which program did the talking?”"}, {"id": "h05", "type": "match", "theme": "Real-world procedures and threat actors", "title": "Four procedures, four fingerprints", "collapsedSummary": "Match each T1020 procedure to its tell.", "scenario": "You brief the hunt team with four T1020 procedure examples from ATT&CK. Match each to the behaviour fingerprint your hunts should look for.", "question": "Match each procedure to its fingerprint.", "left": [{"id": "l1", "text": "S0090 Rover"}, {"id": "l2", "text": "G0094 Kimsuky"}, {"id": "l3", "text": "S0538 Crutch"}, {"id": "l4", "text": "S0377 Ebury"}], "right": [{"id": "r1", "text": "Sends collected files to C2 every 60 minutes by extension list", "short": "hourly extension sweep"}, {"id": "r2", "text": "Script runs every 10 minutes after checking staged filenames", "short": "10-min staged-file check"}, {"id": "r3", "text": "Automatically uploads stolen files to a cloud storage service", "short": "auto cloud upload"}, {"id": "r4", "text": "Sends credential data via UDP to an IP hidden in a DNS TXT record", "short": "UDP to DNS-TXT IP"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "Four real T1020 procedures, four shapes: Rover sweeps drives by extension list and reports hourly; Kimsuky's script wakes every 10 minutes and only ships when pre-named staged files exist; Crutch pushes stolen files to cloud storage automatically (which also drags in web-service exfiltration techniques); Ebury is the exotic one — credentials leave over UDP to an address the malware reads from a DNS TXT record, so the destination can change without a code update. Each still leaves the AN1114/AN1113 signature: an automated process making repeated outbound transfers.", "study": "Procedure Examples on the T1020 page: Rover, Kimsuky, Crutch, Ebury.", "hint": "One is hourly, one is 10-minute, one is cloud storage, one hides its destination in DNS."}, {"id": "h06", "type": "qcm", "theme": "Coverage gaps and compensating detections", "title": "The gap in the strategy", "collapsedSummary": "Which behaviour do the three analytics NOT see?", "scenario": "Your CISO asks what DET0397 does not cover. The estate: Windows workstations, Linux servers, macOS laptops, plus a fleet of routers and switches that nobody instrumented.", "question": "Which behaviour falls outside what AN1113/AN1114/AN1115 can see?", "options": [{"id": "a", "text": "Traffic mirroring abuse on routers redirecting flows to the attacker (T1020.001)"}, {"id": "b", "text": "A cron daemon on Linux uploading archives every 15 minutes"}, {"id": "c", "text": "A LaunchAgent on macOS beaconing with collected files"}, {"id": "d", "text": "A Windows scheduled task sending staged documents hourly"}], "correct": ["a"], "explanation": "The three analytics are host-centric: Windows (AN1113), Linux (AN1114), macOS (AN1115). Routers and switches run none of those log sources, so abuse of traffic mirroring on them — T1020.001, where a network device is made to copy flows to the attacker — is invisible to this strategy. The other three options are precisely the per-platform patterns the three analytics exist for. Closing the gap needs compensating coverage: device configuration monitoring and flow analytics on the network-equipment side.", "study": "T1020.001 (Traffic Mirroring) and why host-centric analytics miss network-device abuse.", "hint": "Which option happens on a box that produces none of the three analytics' log sources?"}, {"id": "h07", "type": "rank", "theme": "Detection engineering practice", "title": "End of shift: rank what remains", "collapsedSummary": "Four AN1114-flavoured alerts — rank by response priority.", "scenario": "Four alerts remain before handover. Rank them 1-4 by response priority. Context: build farm runs CI agents under service accounts; the finance NAS is internal; “fresh VPS” means an IP first seen in your telemetry 40 minutes ago.", "question": "Rank the alerts from highest to lowest priority.", "items": [{"id": "i1", "text": "A: cron on db-lin-03 (prod DB) → unknown fresh VPS, every 10 min, root-owned script in /dev/shm"}, {"id": "i2", "text": "B: cron on build-lin-07 (CI) → vendor artifact store, every 20 min, svc_ci account"}, {"id": "i3", "text": "C: cron on backup-lin-02 → finance NAS internal IP, nightly 01:00, svc_bup account"}, {"id": "i4", "text": "D: one manual rsync by admin from scratch-lin-11 to the same internal NAS, once"}], "order": ["i1", "i2", "i3", "i4"], "explanation": "A is the fire: production database, root-owned script in a memory-only folder, 10-minute repeats to an infrastructure that appeared 40 minutes ago — treat as active T1020. B is automated and repeating, but the destination is a known vendor artifact store under a proper CI account: verify, then allowlist. C is the classic approved nightly backup to an internal NAS: a tuning case, not an incident. D is not automated at all — one manual transfer by a known admin to internal storage; policy may care, but this detection's logic does not. Automation + repeat + destination novelty + account context is the ranking grid.", "study": "Prioritising AN1114 alerts: asset role, automation, account, destination novelty.", "hint": "Score each on four axes: how critical is the host, does it repeat, who runs it, how new is the destination?"}, {"id": "h08", "type": "match", "theme": "Tuning and mutable elements", "title": "Prescribe the right knob", "collapsedSummary": "Three noisy patterns — pick the element that fixes each without losing TPs.", "scenario": "The AN1113 instance is loud but the detection lead forbids blunting true-positive coverage. For each noise pattern, prescribe the ONE mutable element (or decision) that fixes it cleanly.", "question": "Match each noise pattern to the cleanest remedy.", "left": [{"id": "l1", "text": "Approved vendor backup IP fills the alert queue"}, {"id": "l2", "text": "Alerts mix service accounts and human users' ad-hoc sync tools"}, {"id": "l3", "text": "A 4-hour telemetry cycle escapes the current 5-minute grouping and re-alerts each cycle"}], "right": [{"id": "r1", "text": "DestinationIP — allowlist the known trusted destination", "short": "DestinationIP allowlist"}, {"id": "r2", "text": "UserContext — scope the analytic to the accounts automation is expected from", "short": "UserContext scope"}, {"id": "r3", "text": "TimeWindow — widen the grouping window to contain the full cycle", "short": "TimeWindow widen"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3"}, "explanation": "Noise about WHO sends (approved vendor) is a destination problem — DestinationIP allowlist. Noise about WHO is allowed to automate (service vs user) is an account-scope problem — UserContext, exactly what AN1114's mutable element exists for; the same scoping idea is what you implement on the Windows side. Noise about WHEN repeats group together is a window problem — widen TimeWindow so the full 4-hour cycle counts as one aggregated pattern instead of four separate alerts. Each fix keeps the core join intact, so true positives survive.", "study": "Mapping noise type to mutable element: destination → DestinationIP, actor → UserContext, grouping → TimeWindow.", "hint": "Classify each noise: is it about where, who, or when?"}, {"id": "h09", "type": "qcm", "theme": "Real-world procedures and threat actors", "title": "The destination that changes by itself", "collapsedSummary": "Ebury-style UDP send to a DNS-TXT-derived IP — what is true for detection?", "scenario": "On web-lin-04, a daemon sends small UDP packets every 30 minutes. Before each send, it resolves an attacker domain and reads the destination IP from the DNS TXT record — the Ebury pattern. The IP rotates every few days. Your AN1114 instance filters nothing on DestinationIP.", "question": "Which statement about detecting this with AN1114 logic is TRUE?", "options": [{"id": "a", "text": "It still correlates — the daemon repeats inside the window — but the rotating destination must be handled by monitoring, not by a static allowlist"}, {"id": "b", "text": "It cannot fire — AN1114 only detects TCP uploads to fixed IPs"}, {"id": "c", "text": "It fires only if you allowlist the rotating IP first"}, {"id": "d", "text": "DNS lookups make it invisible — AN1114 cannot see anything DNS-related"}], "correct": ["a"], "explanation": "The core pattern survives: a background daemon, repeating on a clock, pushing data out — auditd shows the execve, flow telemetry shows the sends. What changes is the destination half: because the IP rotates, allowlisting “the bad IP” is meaningless, and the usual trusted-destination tuning does not apply — nothing about it is trusted. The right handling is operational: alert on the repeats (as AN1114 does), then let responders track the rotating destination via the DNS query trail. B is wrong (flow telemetry is protocol-agnostic), C inverts the logic, and D confuses “uses DNS for configuration” with “is invisible”.", "study": "S0377 Ebury's DNS-TXT destination trick, and what it changes for destination-based tuning.", "hint": "Separate the two halves: does the repeat still exist, and what does rotation do to the destination knob?"}, {"id": "h10", "type": "order", "theme": "Detection engineering practice", "title": "Stop the leak without destroying the case", "collapsedSummary": "Order the response to a confirmed live exfil.", "scenario": "AN1113 confirmed true: a scheduled task on WKS-legal-03 has shipped ~2 GB to an unknown VPS in the last hour and is still sending. Legal says these documents matter for an ongoing case. Order the response.", "question": "Order the response moves so the evidence survives: first move on top.", "items": [{"id": "i1", "text": "Start perimeter packet capture for the destination and snapshot the SIEM event set"}, {"id": "i2", "text": "Preserve host evidence: process lineage, task XML, script hash — before touching anything"}, {"id": "i3", "text": "Block egress to the destination and disable the scheduled task"}, {"id": "i4", "text": "Isolate the workstation and open the IR case with the captured evidence"}], "order": ["i1", "i2", "i3", "i4"], "explanation": "The tempting shortcut — block first, ask questions later — is the trap: once you cut the egress, you also freeze the chance to record the full session and lose live proof of what else was sent. Evidence first (capture + SIEM snapshot, then host artifacts), then stop the bleeding (block destination, kill the task), then isolate and open the case. The least-aggressive step is never the first step here — the first step is the reversible one: watching and recording.", "study": "Evidence-preserving containment order for live automated exfiltration.", "hint": "Which action, done first, is irreversible and destroys information you will want later?"}, {"id": "h11", "type": "match", "theme": "False positives and baselines", "title": "Three macOS alerts, three verdicts", "collapsedSummary": "Verdict matrix: benign-tune / escalate / insufficient data.", "scenario": "Three AN1115 alerts await triage. Your job: give each the right verdict label. “Insufficient data” is a real answer when the artefacts cannot support any decision yet.", "question": "Match each alert to its verdict.", "left": [{"id": "l1", "text": "Alert 1: design team's signed sync client uploads its own project bucket every 90 s"}, {"id": "l2", "text": "Alert 2: unsigned LaunchDaemon in /Library/LaunchDaemons, execs every 60 s, sends to a residential IP"}, {"id": "l3", "text": "Alert 3: exec events every 5 min for “worker” — no network entries collected for this host"}], "right": [{"id": "r1", "text": "Benign after verification — tune destination/interval, keep coverage", "short": "benign — tune"}, {"id": "r2", "text": "Escalate — every signal is wrong at once", "short": "escalate"}, {"id": "r3", "text": "Insufficient data — collect the missing half before deciding", "short": "insufficient data"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3"}, "explanation": "Alert 1: signed vendor client, its own approved bucket, steady cadence — benign once the bucket owner confirms; tune, do not disable. Alert 2: unsigned, system-level LaunchDaemon, machine-speed beacon, residential destination — every axis fails at once; escalate. Alert 3 is the professional trick: with no network half collected, AN1115's logic cannot even be evaluated — the right verdict is “insufficient data, go collect DC0082 events”, not a guess in either direction. Deciding without the missing half is how false escalations are born.", "study": "Verdict discipline: benign-tune vs escalate vs insufficient data — and what ev /* ===== helpers ===== */
function $(s){return document.querySelector(s)}
function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){s=Math.max(0,s|0);var m=(s/60)|0,r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1)}

/* ===== scoring engine (partial credit) ===== */
function scoreExercise(sel, correct){
  var N=correct.length||1,H=0,W=0,i;
  for(i=0;i<sel.length;i++){ if(correct.indexOf(sel[i])>=0){H++;} else {W++;} }
  return Math.max(0,(H-W)/N);
}

/* ===== state ===== */
var S=null, TID=null, PROFILE={username:'',country:'',locale:'en'};
function startTicker(){ if(TID)clearInterval(TID); TID=setInterval(tTick,1000); }
var EXBYID={}; EX.forEach(function(e){EXBYID[e.id]=e});

function newAttempt(){
  S={order:shuffle(EX.map(function(e,i){return i})),pos:0,status:{},credit:{},hintUsed:{},
     cur:null,fromReview:false,tState:'RUNNING',left:TIMER_BUDGET,started:false,
     pauseAcc:{manual:0,auto:0},reported:false,finished:false,ans:{}};
  EX.forEach(prepEx);
}
/* per-attempt shuffle of option lists, word banks, match columns, order rows */
function prepEx(ex){
  if(ex.options) ex._opts=shuffle(ex.options);
  if(ex.sub&&ex.sub.options) ex.sub._opts=shuffle(ex.sub.options);
  if(ex.left) ex._left=ex.left.slice();
  if(ex.right) ex._right=shuffle(ex.right).map(function(r){return {id:r.id,text:r.text,short:(r.short||r.text)}});
  if(ex.bank) ex._bank=shuffle(ex.bank);
  if(ex.items) ex._items=shuffle(ex.items);
}
var TIMER_BUDGET = META.timerSeconds;

/* ===== timer state machine ===== */
function tSet(state){
  if(S){ S.tState=state; }
  renderHeader();
}
function tTick(){
  if(!S||S.finished||!S.started) return;
  if(S.tState==='RUNNING'){
    if(S.tState==='RUNNING'){ S.left--;
      if(S.left<=0){S.left=0;S.tState='ENDED';renderHeader();onTimeEnd();return;}
    }
    renderHeader();
  } else if(S.tState==='PAUSED_MANUAL'){ S.pauseAcc.manual++; }
  else if(S.tState==='PAUSED_AUTO_CHECK'){ S.pauseAcc.auto++; }
}
function timerChip(){
  var cls=S.tState==='RUNNING'?'t-running':(S.tState==='PAUSED_MANUAL'?'t-manual':(S.tState==='PAUSED_AUTO_CHECK'?'t-auto':'t-ended'));
  var icon=S.tState==='RUNNING'?'\u25B6':(S.tState==='ENDED'?'\u23F1':'\u23F8');
  var word=S.tState==='RUNNING'?'RUNNING':(S.tState==='PAUSED_MANUAL'?'PAUSED \u2014 manual (press Resume)':(S.tState==='PAUSED_AUTO_CHECK'?'PAUSED \u2014 reviewing feedback (resumes on Next)':'ENDED'));
  return '<span class="hchip '+cls+'" role="status" aria-label="Timer '+esc(word)+'"><span aria-hidden="true">'+icon+'</span><span class="mono" id="tval">'+fmtTime(S.left)+'</span><span class="tword">'+esc(word)+'</span></span>';
}

/* ===== views ===== */
function showView(id){
  $all('.view').forEach(function(v){v.classList.remove('active')});
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ===== header ===== */
function sevBadge(){
  return '<span class="badge '+META.difficulty+'" role="img" aria-label="Severity '+esc(META.sevName)+'">'+esc(META.sevName)+'</span>';
}
function answeredStats(){
  var ids=Object.keys(S.status).filter(function(k){return S.status[k]==='answered'});
  var sum=0; ids.forEach(function(k){sum+=S.credit[k]});
  return {count:ids.length,sum:sum,ids:ids};
}
function renderHeader(){
  var h='';
  var total=S.order.length;
  var done=Object.keys(S.status).length;
  var st=answeredStats();
  var label=S.cur?(S.status[S.cur.id]==='answered'?'Progress '+done+' / '+total:('Exercise '+Math.min(done+1,total)+' of '+total)):('Progress '+done+' / '+total);
  h+='<div class="hchip"><b>'+esc(label)+'</b></div>';
  h+=sevBadge();
  h+='<div class="grow"></div>';
  h+=timerChip();
  h+='<span class="hchip" aria-label="Live score"><span aria-hidden="true">\u2605</span> Score <b class="mono">'+fmt1(st.sum)+' / '+st.count+'</b>'+(st.count>0?' <b class="mono">('+Math.round(st.sum/st.count*100)+'%)</b>':'')+'</span>';
  h+='<button class="hbtn" id="btnHint" aria-label="Hint (costs 10 percent of this exercise)">\uD83D\uDCA1 Hint</button>';
  h+='<button class="hbtn" id="btnSkip" aria-label="Skip this exercise">\u26A0 Skip</button>';
  h+='<button class="hbtn" id="btnPause" aria-label="Pause timer and hide exercise"'+(S.finished?' disabled':'')+'>\u23F8 Pause</button>';
  $('#topbar').innerHTML=h;
  var pb=$('#pbar-i'); if(pb) pb.style.width=(total?(done/total*100):0)+'%';
  $('#btnHint').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered'||S.hintUsed[S.cur.id];
  $('#btnSkip').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered';
  $('#btnHint').onclick=function(){doHint()};
  $('#btnSkip').onclick=function(){doSkip()};
  $('#btnPause').onclick=function(){doManualPause()};
}

/* ===== intro ===== */
function renderIntro(){
  $('#intro-body').innerHTML=INTRO.html;
  $('#btnStart').onclick=function(){
    if(!S||S.finished){newAttempt();}
    S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');
    goToPos(0);
  };
  if(PROFILE.username){$('#intro-greet').innerHTML='Analyst on duty: <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'');}
}

/* ===== exercise rendering ===== */
function curEx(){return S.order[S.pos]!==undefined?EX[S.order[S.pos]]:null}

function goToPos(pos,fromReview){
  S.pos=pos; S.cur=curEx(); S.fromReview=!!fromReview;
  if(!S.cur){finishFlow();return;}
  if(S.tState==='ENDED'){/* timer over: nothing to answer */}
  renderExercise();
  renderHeader();
}
function scenHTML(ex){
  var arts=ex.artefacts||[];
  var body='';
  if(ex.scenario) body+='<div class="scenario-text scenario-hideable">'+esc(ex.scenario)+'</div>';
  arts.forEach(function(a,i){
    var lbl=(a.label&&/^ARTEFACT/i.test(a.label))?a.label:('ARTEFACT '+(i+1)+' \u2014 '+(a.label||'evidence'));
    body+='<div class="artefact scenario-hideable"><div class="a-label">'+esc(lbl)+'</div><div class="a-body">';
    if(a.logs){ body+=logPanel(a.logs,a.filter!==false); }
    else if(a.pre){ body+='<pre class="log-line" style="max-height:260px;overflow:auto">'+hlBlock(a.pre)+'</pre>'; }
    else { body+='<div class="scenario-text">'+esc(a.text)+'</div>'; }
    body+='</div></div>';
  });
  var sum=ex.collapsedSummary||'Scenario collapsed \u2014 expand to re-read';
  return '<div class="block b-scenario" id="scenBlock">'+
    '<div class="block-h"><span aria-hidden="true">\u25A4</span> SCENARIO <span class="sp"></span>'+
    '<button class="collapse-btn" id="btnCollapse" aria-label="Collapse or expand scenario">Collapse \u25BE</button></div>'+
    '<div class="scen-summary">'+esc(sum)+'</div>'+
    '<div class="block-body">'+body+'</div></div>';
}
function blockQ(ex){
  return '<div class="block b-question"><div class="block-h"><span aria-hidden="true">\u2753</span> QUESTION</div>'+
    '<div class="block-body"><p class="qtext">'+esc(ex.question)+'</p>'+(ex.qnote?'<p class="muted" style="color:var(--text-secondary);font-size:.92rem;margin:6px 0 0">'+esc(ex.qnote)+'</p>':'')+'</div></div>';
}
function renderExercise(){
  var ex=S.cur;
  var card=$('#excard');
  var sev=META.sevName;
  var html='';
  html+='<span class="theme-chip">\u25C6 '+esc(ex.theme)+'</span>';
  html+=scenHTML(ex);
  html+=blockQ(ex);
  html+='<div class="block b-answer"><div class="block-h"><span aria-hidden="true">\u270E</span> YOUR ANSWER</div><div class="block-body" id="ansbody"></div></div>';
  html+='<div id="fbwrap"></div>';
  html+='<div class="actionrow" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnCheck" disabled>\u2713 Check</button>'+
    '<button class="btn hidden" id="btnNext">\u2192 Next</button>'+
    '</div>';
  card.innerHTML=html;
  $('#btnCollapse').onclick=function(){var b=$('#scenBlock');b.classList.toggle('scen-collapsed');this.textContent=b.classList.contains('scen-collapsed')?'Expand \u25B8':'Collapse \u25BE';};
  renderWidget(ex);
  wireLogFilter();
  var chk=$('#btnCheck');
  chk.onclick=function(){doCheck()};
  if(S.status[ex.id]==='answered'){
    /* returning view of answered exercise not possible in flow; guarded */
  }
}
function setAnswerReady(ok){var b=$('#btnCheck');if(b)b.disabled=!ok}

/* ---- widget: qcm / multi ---- */
function wChoice(ex,mode){
  var multi=mode==='multi';
  var opts=ex._opts||ex.options||[];
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">'+(multi?'Select all options that apply. Partial credit applies.':'Choose the one best option.')+'</p><div class="opts">';
  opts.forEach(function(o,i){
    html+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="false"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
  });
  html+='</div>';
  $('#ansbody').innerHTML=html;
  var sel=[];
  $all('#ansbody .opt').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      if(multi){
        var k=sel.indexOf(id);
        if(k>=0){sel.splice(k,1);b.classList.remove('sel');b.setAttribute('aria-checked','false');}
        else{sel.push(id);b.classList.add('sel');b.setAttribute('aria-checked','true');}
      }else{
        sel=[id];
        $all('#ansbody .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
      }
      setAnswerReady(sel.length>0);
    };
  });
  return {collect:function(){return sel.slice()}};
}

/* ---- widget: match ---- */
function wMatch(ex){
  var lefts=ex._left,rights=ex._right;
  var pairs={}; var pickedL=null;
  function letter(i){return String.fromCharCode(65+i)}
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick one item on the left, then its partner on the right. Click a paired left item again to clear it.</p>'+
    '<div class="matchwrap"><div class="mcol"><div class="mhead">Items</div>';
  lefts.forEach(function(l,i){
    html+='<button type="button" class="mitem left" data-side="L" data-id="'+esc(l.id)+'"><span class="ol">'+letter(i)+'.</span><span>'+esc(l.text)+'</span><span class="pairtag" aria-hidden="true"></span></button>';
  });
  html+='</div><div class="mcol"><div class="mhead">Destinations / matches</div>';
  rights.forEach(function(r){
    html+='<button type="button" class="mitem right" data-side="R" data-id="'+esc(r.id)+'"><span>'+esc(r.text)+'</span></button>';
  });
  html+='</div></div>';
  $('#ansbody').innerHTML=html;
  function refresh(){
    var complete=true;
    $all('#ansbody .mitem.left').forEach(function(b){
      var id=b.getAttribute('data-id');
      var tag=b.querySelector('.pairtag');
      if(pairs[id]){tag.textContent='\u2192 '+rights.filter(function(r){return r.id===pairs[id]})[0].short;complete=false;}
      else{tag.textContent='';complete=false;}
    });
    var leftCount=$all('#ansbody .mitem.left').length;
    var paired=Object.keys(pairs).length;
    setAnswerReady(paired===leftCount);
  }
  $all('#ansbody .mitem').forEach(function(b){
    b.onclick=function(){
      var side=b.getAttribute('data-side'),id=b.getAttribute('data-id');
      if(side==='L'){
        if(pairs[id]){delete pairs[id];b.classList.remove('picked');refresh();return;}
        pickedL=id;
        $all('#ansbody .mitem.left').forEach(function(x){x.classList.remove('picked')});
        b.classList.add('picked');
      }else{
        if(!pickedL)return;
        pairs[pickedL]=id;
        $all('#ansbody .mitem.left').forEach(function(x){if(x.getAttribute('data-id')===pickedL)x.classList.remove('picked')});
        pickedL=null;refresh();
      }
    };
  });
  refresh();setAnswerReady(false);
  return {collect:function(){return Object.keys(pairs).map(function(l){return l+'>'+pairs[l]})},pairs:pairs};
}

/* ---- widget: dnd (bank -> slots) ---- */
function wDnD(ex){
  var bank=ex._bank.slice(), placed={}, picked=null, dragId=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Drag each item into the right slot (or pick an item, then pick a slot).</p>'+
    '<div class="bank" id="bank"></div><div class="slots" id="slots"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" draggable="true" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bank').innerHTML=bh;
    var sh='';
    ex.slots.forEach(function(s){
      var v=placed[s.id];
      sh+='<div class="slot" data-s="'+esc(s.id)+'" role="button" tabindex="0" aria-label="Slot: '+esc(s.label)+'"><span class="s-label">'+esc(s.label)+'</span>'+(v?'<span class="s-val">'+esc(v)+'</span>':'<span class="s-fill">drop here</span>')+'</div>';
    });
    $('#slots').innerHTML=sh;
    wire();
  }
  function place(w,sid){
    Object.keys(placed).forEach(function(k){if(placed[k]===w)delete placed[k]});
    placed[sid]=w;picked=null;draw();
    setAnswerReady(Object.keys(placed).length===ex.slots.length);
  }
  function wire(){
    $all('#bank .bitem').forEach(function(b){
      b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};
      b.ondragstart=function(ev){dragId=b.getAttribute('data-w');b.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}};
      b.ondragend=function(){b.classList.remove('dragging')};
    });
    $all('#slots .slot').forEach(function(s){
      var sid=s.getAttribute('data-s');
      s.onclick=function(){if(picked)place(picked,sid);};
      s.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&picked){ev.preventDefault();place(picked,sid);}};
      s.ondragover=function(ev){ev.preventDefault();s.classList.add('over')};
      s.ondragleave=function(){s.classList.remove('over')};
      s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var w=dragId||ev.dataTransfer.getData('text/plain');if(w)place(w,sid);};
    });
  }
  draw();setAnswerReady(false);
  return {collect:function(){return ex.slots.map(function(s){var v=placed[s.id];return v?(s.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: fib ---- */
function wFib(ex){
  var blanks=ex.blanks; /* [{id,label}] */
  var bank=ex._bank.slice(), placed={}, picked=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick a word from the bank, then pick a blank. Click a filled blank to clear it.</p>'+
    '<div class="blankline" id="bl-line">'+ex.sentenceHtml+'</div><div class="bank" id="bl-bank"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bl-bank').innerHTML=bh;
    $all('#bl-bank .bitem').forEach(function(b){b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};});
    $all('#ansbody .blank').forEach(function(b){
      var id=b.getAttribute('data-id');
      if(placed[id]){b.textContent=placed[id];b.classList.remove('empty');}
      else{b.textContent='blank '+id.replace('b','');b.classList.add('empty');}
      b.onclick=function(){
        if(placed[id]){delete placed[id];draw();refresh();return;}
        if(picked){placed[id]=picked;picked=null;draw();refresh();}
      };
      b.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.onclick();}};
    });
  }
  function refresh(){setAnswerReady(Object.keys(placed).length===blanks.length);}
  draw();refresh();setAnswerReady(false);
  return {collect:function(){return blanks.map(function(b){var v=placed[b.id];return v?(b.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: order / rank ---- */
function wOrder(ex){
  var items=ex._items.slice(); /* current order of {id,text} */
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Put the items in the right order: use the arrows or drag rows.</p><div class="ordlist" id="ord"></div>';
  $('#ansbody').innerHTML=html;
  var dragIdx=null;
  function draw(){
    var h='';items.forEach(function(it,i){
      h+='<div class="orditem" draggable="true" data-i="'+i+'"><span class="pos">'+(i+1)+'.</span><button class="move" data-d="-1" data-i="'+i+'" aria-label="Move up">\u25B2</button><button class="move" data-d="1" data-i="'+i+'" aria-label="Move down">\u25BC</button><span>'+esc(it.text)+'</span><span class="handle" aria-hidden="true">\u2261</span></div>';
    });
    $('#ord').innerHTML=h;wire();setAnswerReady(items.length===ex._items.length);
  }
  function move(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;draw();}
  function wire(){
    $all('#ord .move').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();move(parseInt(b.getAttribute('data-i'),10),parseInt(b.getAttribute('data-d'),10));};});
    $all('#ord .orditem').forEach(function(row){
      row.ondragstart=function(ev){dragIdx=parseInt(row.getAttribute('data-i'),10);try{ev.dataTransfer.setData('text/plain','x')}catch(e){}};
      row.ondragover=function(ev){ev.preventDefault();row.style.borderColor='var(--accent-green)'};
      row.ondragleave=function(){row.style.borderColor=''};
      row.ondrop=function(ev){ev.preventDefault();row.style.borderColor='';var to=parseInt(row.getAttribute('data-i'),10);if(dragIdx===null||isNaN(to))return;var it=items.splice(dragIdx,1)[0];items.splice(to,0,it);dragIdx=null;draw();};
    });
  }
  draw();
  return {collect:function(){return items.map(function(it){return it.id})}};
}

/* ---- widget: logs + sub answer ---- */
function wLogs(ex){

/* ---- widget: branch ---- */
function wBranch(ex){
  var steps=ex.steps,i=0,choices=[];
  $('#ansbody').innerHTML='<div id="br-log"></div><div id="br-cur"></div>';
  function drawStep(){
    if(i>=steps.length){
      $('#br-cur').innerHTML='<div class="stepdone"><b>All '+steps.length+' steps recorded.</b> Press Check to grade the whole chain.</div>';
      setAnswerReady(true);return;
    }
    var st=steps[i];
    var h='<span class="stepchip">STEP '+(i+1)+' OF '+steps.length+'</span>';
    if(st.context)h+='<p class="stepctx">'+esc(st.context)+'</p>';
    h+='<div class="opts">';
    st.options.forEach(function(o,j){
      h+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="radio" aria-checked="false"><span class="ol">'+String.fromCharCode(65+j)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
    });
    h+='</div><div style="margin-top:10px"><button class="btn" id="br-next" disabled>\u2192 Confirm step '+(i+1)+'</button></div>';
    $('#br-cur').innerHTML=h;
    var pick=null;
    $all('#br-cur .opt').forEach(function(b){
      b.onclick=function(){pick=b.getAttribute('data-id');
        $all('#br-cur .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
        var nx=$('#br-next');if(nx)nx.disabled=false;};
    });
    $('#br-next').onclick=function(){
      if(i>=steps.length||pick===null)return;
      choices.push(pick);
      $('#br-log').insertAdjacentHTML('beforeend','<div class="stepdone"><b>Step '+(i+1)+' recorded.</b> '+esc(steps[i].ack||'Answer noted. The timer keeps running.')+'</div>');
      i++;drawStep();
    };
    setAnswerReady(false);
  }
  drawStep();
  return {collect:function(){return choices.slice()}};
}

/* ===== render dispatch ===== */
function renderWidget(ex){
  var w=null;
  if(ex.type==='qcm'){w=wChoice(ex,'qcm');}
  else if(ex.type==='multi'){w=wChoice(ex,'multi');}
  else if(ex.type==='match'){w=wMatch(ex);}
  else if(ex.type==='dnd'){w=wDnD(ex);}
  else if(ex.type==='fib'){w=wFib(ex);}
  else if(ex.type==='order'||ex.type==='rank'){w=wOrder(ex);}
  else if(ex.type==='logs'){w=wLogs(ex);}
  else if(ex.type==='branch'){w=wBranch(ex);}
  else if(ex.type==='term'){w=wTerm(ex);}
  S._w=w;
}

/* ===== log rendering + highlighting ===== */
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlLine(line){
  var e=esc(line);
  var re=/(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}\b)|([A-Za-z_][\w.]*)(=)(&quot;.*?&quot;|"[^"]*"|\S+)|(&quot;[^&]*&quot;|"[^"]*")|(?:^|\s)((?:[A-Z]:\\|\/(?:usr|etc|var|opt|home|tmp)\/)[^\s"]+)/g;
  var out='',last=0,m;
  function span(cls,txt){return '<span class="'+cls+'">'+txt+'</span>'}
  while((m=re.exec(e))!==null){
    out+=e.slice(last,m.index);
    if(m[1]){out+=span('tk-ts',m[1]);}
    else if(m[2]){out+=span('tk-ip',m[2]);}
    else if(m[3]){out+=span('tk-key',m[3])+'='+span(/^(EventCode|EventID|eventid|id|ID)$/.test(m[3])?'tk-str':'tk-val',m[5]);}
    else if(m[6]){out+=span('tk-str',m[6]);}
    else if(m[7]){out+=span('tk-path',m[7]);}
    last=re.lastIndex;
  }
  out+=e.slice(last);
  return out;
}
function hlBlock(text){
  return String(text).split('\n').map(function(l){return hlLine(l)}).join('\n');
}
function logPanel(lines,withFilter){
  var h='<div class="logpanel">';
  if(withFilter){
    h+='<div class="logtools"><input type="text" id="logfilter" placeholder="Filter lines (e.g. 4688, an IP, a user)" aria-label="Filter log lines"><span class="cnt" id="logcnt"></span></div>';
  }
  h+='<pre class="loglines" id="loglines">';
  lines.forEach(function(l){h+='<code class="log-line" data-raw="'+esc(l)+'">'+hlLine(l)+'</code>'});
  h+='</pre></div>';
  return h;
}
function wireLogFilter(){
  var inp=$('#logfilter');if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),shown=0,all=0;
    $all('#loglines .log-line').forEach(function(c){
      all++;var raw=(c.getAttribute('data-raw')||'').toLowerCase();
      var ok=!q||raw.indexOf(q)>=0;
      c.classList.toggle('hidden',!ok);if(ok)shown++;
    });
    var cnt=$('#logcnt');if(cnt)cnt.textContent='showing '+shown+' of '+all+' lines';
  });
}

/* ===== grading ===== */
function grade(ex){
  var w=S._w, sel=w.collect(), out={credit:0,rows:[],correctDisplay:'',extra:''};
  var optText=function(id,list){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].text}return id};
  if(ex.type==='qcm'||ex.type==='logs'){
    var correct=ex.correct;
    var ok=sel.length===1&&correct.indexOf(sel[0])>=0;
    out.credit=scoreExercise(ok?sel:[],correct);
    out.correctDisplay=optText(correct[0],(ex.options||ex.sub.options));
  } else if(ex.type==='multi'){
    var c=ex.correct,N=c.length,H=0,W=0;
    var rows=[];
    c.forEach(function(id){
      var got=sel.indexOf(id)>=0;
      if(got){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:optText(id,ex.options)});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:optText(id,ex.options)});}
    });
    sel.forEach(function(id){
      if(c.indexOf(id)<0){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:optText(id,ex.options)});}
    });
    out.credit=scoreExercise(sel,c);out.rows=rows;
  } else if(ex.type==='match'){
    var pairs=w.pairs||{};var N=Object.keys(ex.pairs).length,H=0,W=0,rows=[];
    var gotPairs=[],wantPairs=[];
    Object.keys(ex.pairs).forEach(function(l){
      var want=ex.pairs[l],got=pairs[l];
      var lt=optText(l,ex.left),rt=optText(want,ex.right);
      wantPairs.push(l+'>'+want);
      if(got){gotPairs.push(l+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lt+' \u2192 '+rt});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lt+' \u2192 you chose: '+optText(got,ex.right)+' \u2014 correct: '+rt});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lt+' \u2192 correct: '+rt});}
    });
    out.credit=scoreExercise(gotPairs,wantPairs);out.rows=rows;
  } else if(ex.type==='dnd'||ex.type==='fib'){
    var placed=w.placed||{};var sol=ex.solution;var N=Object.keys(sol).length,H=0,W=0,rows=[];
    var gotFills=[],wantFills=[];
    Object.keys(sol).forEach(function(slotId){
      var want=sol[slotId],got=placed[slotId];
      var lbl=(ex.slots||ex.blanks).filter(function(s){return s.id===slotId})[0];
      var lblT=lbl?(lbl.label||('blank '+slotId)):slotId;
      wantFills.push(slotId+'>'+want);
      if(got){gotFills.push(slotId+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lblT+': '+want});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lblT+': you placed \u201C'+got+'\u201D \u2014 correct: '+want});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lblT+': correct: '+want});}
    });
    out.credit=scoreExercise(gotFills,wantFills);out.rows=rows;
    out.correctDisplay=Object.keys(sol).map(function(k){return sol[k]}).join(', ');
  } else if(ex.type==='order'||ex.type==='rank'){
    var want=ex.order,N=want.length,H=0,W=0,rows=[];
    var gotPos=[],wantPos=[];
    for(var i=0;i<N;i++){
      var it=optText(sel[i],ex._items),okp=sel[i]===want[i];
      gotPos.push(i+'>'+sel[i]);wantPos.push(i+'>'+want[i]);
      var posTxt='Position '+(i+1)+': '+(okp?it:(optText(want[i],ex._items)+' (you placed: '+it+')'));
      if(okp){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:posTxt});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:posTxt});}
    }
    out.credit=scoreExercise(gotPos,wantPos);out.rows=rows;
    out.correctDisplay=want.map(function(id,ix){return (ix+1)+'. '+optText(id,ex._items)}).join('  ');
  } else if(ex.type==='branch'){
    var N=ex.steps.length,H=0,W=0,rows=[];
    var gotSteps=[],wantSteps=[];
    ex.steps.forEach(function(st,ix){
      var got=sel[ix],okc=got===st.correct;
      gotSteps.push(ix+'>'+got);wantSteps.push(ix+'>'+st.correct);
      if(okc){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:'Step '+(ix+1)+': '+optText(st.correct,st.options)});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:'Step '+(ix+1)+': you chose \u201C'+optText(got,st.options)+'\u201D \u2014 best: '+optText(st.correct,st.options)});}
    });
    out.credit=scoreExercise(gotSteps,wantSteps);out.rows=rows;
  } else if(ex.type==='term'){
    var raw=(w.raw?w.raw():sel[0]||'').toLowerCase().replace(/\s+/g,' ').trim();
    var N=ex.elements.length,H=0,W=0,rows=[];
    var gotEls=[],wantEls=[];
    ex.elements.forEach(function(el,ei){
      var hit=false;
      if(el.re){hit=(new RegExp(el.re,'i')).test(raw);}
      else if(el.inc){hit=raw.indexOf(el.inc.toLowerCase())>=0;}
      if(el.danger){
        if(hit){W++;gotEls.push('d'+ei);rows.push({st:'wrong',ic:'\u2717',w:'DANGEROUS \u2014 NEAR MISS',t:el.label});}
      } else {
        wantEls.push('e'+ei);
        if(hit){H++;gotEls.push('e'+ei);rows.push({st:'correct',ic:'\u2713',w:'Correct',t:el.label});}
        else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:el.label});}
      }
    });
    out.credit=scoreExercise(gotEls,wantEls);out.rows=rows;
    out.correctDisplay=ex.expected;
    out.extra='<div class="canon" role="figure" aria-label="Expected query">'+esc(ex.expected)+'</div>';
  }
  if(S.hintUsed[ex.id])out.credit=Math.max(0,out.credit-0.10);
  return out;
}

/* ===== check / next / skip / hint / pause ===== */
function doHint(){
  if(!S.cur||S.hintUsed[S.cur.id])return;
  S.hintUsed[S.cur.id]=true;
  var ex=S.cur;
  if(!$('#hintbox')){
    $('#fbwrap').insertAdjacentHTML('beforebegin','<div class="hintbox" id="hintbox"><span class="h">\uD83D\uDCA1 Hint</span> \u2014 '+esc(ex.hint)+'</div>');
  }
  renderHeader();
}
function markAnswered(ex,credit){
  S.status[ex.id]='answered';S.credit[ex.id]=credit;
}
function feedbackHTML(ex,g){
  var cls,nh;
  if(g.credit>=0.999){cls='f-correct';nh='<span aria-hidden="true">\u2713</span> CORRECT';}
  else if(g.credit>0){cls='f-partial';nh='<span aria-hidden="true">\u2713</span> PARTIALLY CORRECT';}
  else{cls='f-wrong';nh='<span aria-hidden="true">\u2717</span> INCORRECT';}
  var N=0;
  if(ex.type==='multi')N=ex.correct.length;
  else if(ex.type==='match')N=Object.keys(ex.pairs).length;
  else if(ex.type==='dnd'||ex.type==='fib')N=Object.keys(ex.solution).length;
  else if(ex.type==='order'||ex.type==='rank')N=ex.order.length;
  else if(ex.type==='branch')N=ex.steps.length;
  else if(ex.type==='term')N=ex.elements.length;
  var creditLine='';
  if(N>1||ex.type==='term'){
    var hCount=0;g.rows.forEach(function(r){if(r.st==='correct')hCount++});
    creditLine='<div class="credit-line">credit '+ (Math.round(g.credit*100)/100) +' \u2014 '+hCount+'/'+N+' items'+(S.hintUsed[ex.id]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  } else if(S.hintUsed[ex.id]){
    creditLine='<div class="credit-line">credit '+(Math.round(g.credit*100)/100)+' (includes \u22120.10 hint penalty)</div>';
  }
  var rows='';g.rows.forEach(function(r){
    rows+='<div class="itrow st-'+r.st+'"><span class="ic" aria-hidden="true">'+r.ic+'</span><span><b>'+r.w+'</b> \u2014 '+esc(r.t)+'</span></div>';
  });
  var corr=g.correctDisplay?(' <div class="expl"><b>Correct answer:</b> '+esc(g.correctDisplay)+'</div>'):'';
  return '<div class="block b-feedback '+cls+'" role="status"><div class="block-h">'+nh+(N>1?'':'')+'</div><div class="block-body">'+
    creditLine+
    (rows?'<div class="items">'+rows+'</div>':'')+
    corr+g.extra+
    '<div class="expl">'+esc(ex.explanation)+'</div>'+
    '<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>'+
    '</div></div>';
}
function doCheck(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  var ex=S.cur;
  /* Check-triggered auto-pause FIRST (state machine), then feedback */
  tSet('PAUSED_AUTO_CHECK');
  var g=grade(ex);
  markAnswered(ex,g.credit);
  var btn=$('#btnCheck');if(btn)btn.classList.add('hidden');
  $('#fbwrap').innerHTML=feedbackHTML(ex,g);
  /* lock answer widget */
  $all('#ansbody button, #ansbody input, #ansbody [role="button"]').forEach(function(b){
    b.disabled=true;b.classList.add('locked');
  });
  $all('#ansbody .term input').forEach(function(b){b.disabled=true});
  var nb=$('#btnNext');
  nb.classList.remove('hidden');
  var morePending=S.order.some(function(ix,i){return i>S.pos&&S.status[EX[ix].id]!=='answered'});
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(morePending){nb.textContent='\u2192 Next';}
  else if(anySkipped){nb.textContent='\u26A0 Review skipped \u2192';}
  else{nb.textContent='\u23E9 Final Submit';}
  nb.onclick=function(){onNext()};
  $('#btnNext').focus();
  renderHeader();
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){tSet('RUNNING');}
  if(S.fromReview){
    var anyLeft=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
    if(anyLeft&&S.tState!=='ENDED'){goReview();}else{showResults();}
    return;
  }
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doSkip(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  S.status[S.cur.id]='skipped';
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doManualPause(){
  if(!S.cur||S.finished)return;
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S._prevT=S.tState;tSet('PAUSED_MANUAL');
    $('#btnPause').disabled=true;
    /* viewport-fixed overlay + full-content blur, so manual pause works the same
       from the exam view and from the review-skipped view */
    var d=document.createElement('div');d.className='overlay-msg fixed';d.id='ovl';
    d.innerHTML='<b>\u23F8 PAUSED \u2014 manual</b><br>The exercise is hidden while you pause.<br>Your break time is recorded in the results report.<br><br><button class="btn primary" id="btnResume">\u25B6 Resume</button>';
    document.body.appendChild(d);
    var wr=document.querySelector('.wrap');if(wr)wr.classList.add('blur-lock');
    $('#btnResume').onclick=function(){
      tSet(S._prevT||'RUNNING');
      var o=$('#ovl');if(o)o.remove();
      var wr2=document.querySelector('.wrap');if(wr2)wr2.classList.remove('blur-lock');
      renderHeader();
    };
  }
}
function finishFlow(){
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(anySkipped&&S.tState!=='ENDED'){goReview();return;}
  showResults();
}
/* ===== review skipped ===== */
function goReview(){
  var list=S.order.filter(function(ix){return S.status[EX[ix].id]==='skipped'});
  var h='<div class="card"><h2>\u26A0 Review skipped exercises</h2>'+
    '<p class="muted" style="color:var(--text-secondary)">You skipped '+list.length+' exercise(s). You can go back and answer them now, as long as the timer has not ended. If you submit with skipped exercises left, they are excluded from the score.</p>';
  list.forEach(function(ix){
    var ex=EX[ix];
    h+='<div class="revitem"><span class="sk" role="img" aria-label="Skipped">\u26A0 Skipped</span><span class="t">'+esc(ex.title||ex.question)+'</span><button class="btn" data-id="'+esc(ex.id)+'" aria-label="Answer skipped exercise">Answer</button></div>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnFinish">\u23E9 Submit exam now</button></div></div>';
  $('#review-body').innerHTML=h;
  $all('#review-body .revitem button').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      var idx=S.order.indexOf(EX.indexOf(EXBYID[id]));
      showView('#view-exam');
      goToPos(idx,true);
    };
  });
  $('#btnFinish').onclick=function(){showResults()};
  showView('#view-review');
}
/* ===== time end ===== */
function onTimeEnd(){
  if(S.finished)return;
  showResults(true);
}
/* ===== results ===== */
function showResults(timeOver){
  if(S.finished)return;
  S.finished=true;
  S.tState='ENDED';
  renderHeader();
  clearInterval(TID);
  var st=answeredStats();
  var count=st.count,sum=st.sum;
  var percent=count>0?Math.round(sum/count*100):0;
  var passed=percent>=70;
  var fully=0,partial=0,partialAvg=0,wrong=0,skipped=0,psum=0;
  S.order.forEach(function(ix){
    var ex=EX[ix],stt=S.status[ex.id];
    if(stt==='answered'){
      var c=S.credit[ex.id];
      if(c>=0.999)fully++;else if(c>0){partial++;psum+=c;}else wrong++;
    } else skipped++;
  });
  if(partial>0)partialAvg=psum/partial;
  /* report to site: exactly once per attempt, at results */
  if(!S.reported){
    S.reported=true;
    reportScore(sum,count,percent,passed);
  }
  var h='<div class="card"><h2>Final results</h2>'+
    '<div class="bigscore">'+fmt1(sum)+' / '+count+'  <span style="font-size:1.4rem;color:var(--text-secondary)">('+percent+'%)</span></div>'+
    '<p class="muted" style="color:var(--text-secondary)">Score computed only over answered exercises. Pass mark: 70%.</p>'+
    (timeOver?'<p style="color:var(--state-paused)">\u23F1 Time ended \u2014 unanswered exercises were excluded.</p>':'')+
    '<div class="cert '+(passed?'':'fail')+'" role="status">'+
    '<div class="cpass">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'+
    '<div class="csub">'+(passed?'Certificate-worthy performance on this severity.':'You must retake this exam. Review the explanations, then try again \u2014 questions and options will be reshuffled.')+'</div>'+
    '</div>'+
    '<div class="brk">'+
    '<div class="brkrow b-correct"><span class="ic">\u2713</span> Fully correct <span class="n">'+fully+'</span></div>'+
    '<div class="brkrow b-partial"><span class="ic">\u2713</span> Partially correct '+(partial>0?('(avg credit '+ (Math.round(partialAvg*100)/100) +')'):'')+' <span class="n">'+partial+'</span></div>'+
    '<div class="brkrow b-wrong"><span class="ic">\u2717</span> Fully incorrect <span class="n">'+wrong+'</span></div>'+
    '<div class="brkrow b-skipped"><span class="ic">\u26A0</span> Skipped \u2014 excluded from score <span class="n">'+skipped+'</span></div>'+
    '</div>';
  /* per-theme mini progress */
  var themes={};
  S.order.forEach(function(ix){var ex=EX[ix];themes[ex.theme]=themes[ex.theme]||{a:0,t:0};
    themes[ex.theme].t++;if(S.status[ex.id]==='answered')themes[ex.theme].a++;});
  var mt='<div class="mini-themes">';
  Object.keys(themes).forEach(function(t){mt+='<span class="mt">'+esc(t)+': <b>'+themes[t].a+'/'+themes[t].t+'</b></span>'});
  mt+='</div>';
  h+=mt;
  h+='<p class="kv">Time paused manually: <b>'+fmtTime(S.pauseAcc.manual)+'</b> \u00B7 Time paused reviewing feedback: <b>'+fmtTime(S.pauseAcc.auto)+'</b></p>';
  if(PROFILE.username)h+='<p class="kv">Attempt by <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'')+'</p>';
  h+='<div style="margin-top:14px"><button class="btn green" id="btnRetake">\u21BA Retake exam</button></div>';
  h+='</div>';
  $('#results-body').innerHTML=h;
  $('#btnRetake').onclick=function(){
    newAttempt();S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');goToPos(0);
  };
  showView('#view-results');
}
/* ===== site integration ===== */
function reportScore(creditSum,answeredCount,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  PROFILE.username=event.data.username||'';
  PROFILE.country=event.data.country||'';
  PROFILE.locale=event.data.locale||'en';
  /* theme field is always 'dark'; files are dark-only by contract, nothing to switch */
});

/* ===== boot ===== */
function boot(){
  newAttempt();
  renderIntro();
  showView('#view-intro');
}
document.addEventListener('DOMContentLoaded',boot);
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
