         '06:14:02  EventCode=13  TargetObject: HKLM\\…\\Run\\SyncHelper  Image: C:\\Windows\\Temp\\s.exe  Signed: false  Parent: …\\schtasks.exe',
         '06:15:20  EventCode=1   Image: …\\svchost.exe -k netsvcs  (no EventCode=13 nearby)',
         '06:16:44  EventCode=13  TargetObject: HKCU\\Control Panel\\Desktop\\Wallpaper  Image: …\\explorer.exe']}]},
    q:'Which write does AN0781 raise as part of a suspicious chain?',
    opts:[['SyncHelper — unsigned, from Temp, born of schtasks, on a Run key',1],['VpnAssistant — the SCCM client writing a Run entry',0],['The svchost.exe start with no registry write nearby',0],['The wallpaper change by explorer.exe',0]],
    x:'<p>AN0781 needs an <strong>abnormal writer on a watched key</strong>. SyncHelper hits everything at once: unsigned binary, Temp path, schtasks parent (a sneaky lineage — attackers use scheduled tasks to respawn writers) and a Run key. VpnAssistant is the allowlisted SCCM client doing a planned push — abnormal-looking, but trusted, which is exactly why the allowlist exists. svchost starting alone is half a chain (no write), and the wallpaper key is not in the patterns. The tempting shortcuts all fail on one missing element.</p>',
    h:'Three options each fail on ONE missing element: trusted writer, no write, unwatched key.' },

  { t:'log', multiEl:false,
    s:{sum:'An alarming Run-key write lands in the queue at 06:31 — but check the change calendar before you escalate.',
       blocks:[
         {label:'ARTEFACT 1 — Sysmon slice (JUMP-PROD-01)', kind:'log', lines:[
           '06:31:10  EventCode=13  TargetObject: HKLM\\…\\Run\\SecureVpn  Image: …\\SCCM\\CcmExec.exe  Signed: true  Company: ContosoIT',
           '06:31:08  EventCode=1   Image: …\\SCCM\\CcmExec.exe  CommandLine: CcmExec.exe -push SecureVpn.msi',
           '06:31:12  EventCode=1   Image: C:\\Windows\\System32\\msiexec.exe  CommandLine: msiexec /i SecureVpn.msi /qn']},
         {label:'ARTEFACT 2 — Ticket #60117 (change window)', kind:'text',
         body:['Change #CH-2291 approved 05:00–08:00: “VPN client 4.2 rollout to jump hosts via SCCM.” Requested by network team; CAB-approved. No other changes scheduled.']},
         {label:'ARTEFACT 3 — EDR quick verdict', kind:'text',
         body:['CcmExec.exe: signed ContosoIT. SecureVpn.msi: signed, distributed on internal share. No detections on the installer file.']}]},
    q:'Click the log line that looks like the suspicious chain but is actually explained as planned change noise.',
    lines:[
      '06:31:10  EventCode=13  TargetObject: HKLM\\…\\Run\\SecureVpn  Image: …\\SCCM\\CcmExec.exe  Signed: true  Company: ContosoIT',
      '06:31:08  EventCode=1   Image: …\\SCCM\\CcmExec.exe  CommandLine: CcmExec.exe -push SecureVpn.msi',
      '06:31:12  EventCode=1   Image: C:\\Windows\\System32\\msiexec.exe  CommandLine: msiexec /i SecureVpn.msi /qn'],
    target:0, targetText:'Line 1 — the SCCM client Run-key write, explained by change #CH-2291',
    x:'<p>Line 1 has the shape of a real catch — a <strong>Run key write</strong> — and alone it would look alarming. But the writer is the <strong>allowlisted, signed SCCM client</strong>, the ticket shows an <strong>approved VPN rollout in exactly that window</strong>, and the EDR verdict is clean. This is the classic “looks alarming, is benign” case: the analytic’s allowlist plus the change calendar resolve it. Escalating without checking the change window burns analyst trust; closing without noting the change number loses the audit trail — cite #CH-2291 in the ticket.</p>',
    h:'Match the writer against the allowlist, then the time against artefact 2.' },

  { t:'drop', multiEl:true,
    s:{sum:'Coverage review: which T1112 behaviours does AN0781 actually cover with Sysmon 13/14 + 1, and which need a compensating detection?',
       blocks:[{label:'ARTEFACT 1 — Behaviour list from the T1112 page and your environment notes', kind:'text',
         body:['Behaviours seen in the estate: (a) reg.exe Run-key add, (b) PowerShell Userinit edit, (c) WMI StdRegProv service-ImagePath edit, (d) direct-API SetValue on SafeDllSearchMode, (e) remote-registry write from another host, (f) registry write while Sysmon was stopped for maintenance.']}]},
    q:'Drag each behaviour into the right bucket.',
    zones:['AN0781 covers it','Needs a compensating detection'],
    items:[['reg.exe Run-key add (local)',0],['PowerShell Userinit edit (local)',0],['WMI StdRegProv ImagePath edit (local)',0],['Direct-API SetValue on SafeDllSearchMode (local)',0],['Remote-registry write from another host',1],['Write made while Sysmon was stopped',1]],
    x:'<p>For <strong>local</strong> writes, the chain works: Sysmon 13/14 records the write on the host, Sysmon 1 records the local writer — whatever path it used (CLI, PowerShell, WMI or API). The two gaps are structural. A <strong>remote</strong> registry write never produces a local EventCode=1 for the attacker’s tool, so the writer half of the chain is missing — you need registry auditing (Security 4657) on targets or Sysmon correlation with the source host. A write while <strong>Sysmon is stopped</strong> produces no telemetry at all — compensate with log-gap alerts on the Sysmon service itself.</p>',
    h:'The chain needs both halves on the same host. Where does a half go missing?' },

  { t:'qcm', multiEl:false,
    s:{sum:'Confirmed: an unsigned PowerShell from %TEMP% rewrote Winlogon\\Userinit on JUMP-PROD-01 — a production jump server used by 40 admins. The CISO asks for your first move.',
       blocks:[{label:'ARTEFACT 1 — Situation snapshot', kind:'text',
         body:['Writer: powershell.exe (unsigned, %TEMP%, parent winword.exe). Key: HKLM\\…\\Winlogon\\Userinit. Chain complete: a new process ran 40 s later. Host: production jump server; 40 active admin sessions; no confirmations of further spread.']}]},
    q:'What is the correct first move?',
    opts:[['Isolate the host from the network and escalate to IR, preserving evidence',1],['Reimage the server immediately to be safe',0],['Kill the powershell.exe process and keep the server online',0],['Wait 24 hours and watch for more alerts before acting',0]],
    x:'<p>The least aggressive action that still stops the bleeding is <strong>network isolation plus IR escalation</strong>: the chain is confirmed on a high-value host, but isolation preserves memory and disk evidence for the responders and protects the 40 admin sessions. Reimaging destroys every artefact you will need tomorrow. Killing the writer alone leaves the Userinit persistence alive and tips off the operator, who may trigger a destructive next stage. Waiting 24 hours on a confirmed chain on a jump host is not containment — it is exposure.</p>',
    h:'Pick the option that stops spread AND keeps evidence.' },

  { t:'match', multiEl:true,
    s:{sum:'The IR lead asks: “if the attacker edits this key, what can they actually enable?” Map each edit to the ATT&CK technique it feeds.',
       blocks:[{label:'ARTEFACT 1 — Edits seen across the estate', kind:'log', lines:[
         'HKLM\\…\\CurrentVersion\\Run  → new value pointing at attacker EXE',
         'HKLM\\…\\Winlogon\\Userinit  → "userinit.exe, evil.exe"',
         'HKLM\\…\\Control\\Lsa\\Security Packages → attacker DLL',
         'HKLM\\…\\Services\\svc\\ImagePath → attacker EXE path',
         'HKLM\\…\\Session Manager\\SafeDllSearchMode → 0']}]},
    q:'Match each edit to the technique it enables.',
    pairs:[['Run key value','T1547.001 — Registry Run Keys / Startup Folder'],['Userinit edit','T1547.004 — Winlogon Helper DLL'],['Security Packages entry','T1547.002 — Authentication Package'],['Services ImagePath','T1543.003 — Windows Service'],['SafeDllSearchMode = 0','T1574.001 — DLL Search Order Hijacking (setup)']],
    x:'<p>Each key family is a door to a different ATT&CK technique. The <strong>Run key</strong> is T1547.001, the classic autostart. <strong>Userinit</strong> is a Winlogon helper — T1547.004. The <strong>LSA Security Packages</strong> key loads its DLL at boot — that is T1547.002, the authentication-package trick, a different logon doorway that also lives in the registry. A <strong>service ImagePath</strong> creates or redirects a Windows service — T1543.003, and it usually runs as SYSTEM, which is why it is privilege escalation. <strong>SafeDllSearchMode = 0</strong> starts no process itself; it prepares T1574.001 DLL search-order hijacking. DET0280 is the T1112 net that catches all of these writes at the moment they are made.</p>',
    h:'Three of the five are T1547-family (boot or logon autostart). One is a service, one prepares library hijacking.' },

  { t:'term', multiEl:true,
    s:{sum:'You are onboarding DET0280 into the SIEM. Write the query that lists candidate registry persistence writes.',
       blocks:[{label:'ARTEFACT 1 — Environment', kind:'text',
         body:['SIEM: generic pipe-style search over index=sysmon. You need: the Sysmon channel, registry value-set events only (not renames, not processes), and only writes whose key path points at Run or RunOnce autostart keys. One line, no pipeline stages needed.']}]},
    q:'Type the query into the editor, then press Check.',
    env:'SIEM search console — simulation only, nothing is executed',
    prompt:'search>',
    canon:'index=sysmon source=WinEventLog:Sysmon EventCode=13 TargetObject="*\\Run*"',
    out:'17 events matched  (top writer: powershell.exe — 9; msiexec.exe — 5; reg.exe — 3)',
    elements:[['eventcode\\s*=\\s*13','filters EventCode=13 (registry value set)'],['targetobject','constrains the registry key path'],['run','targets Run / RunOnce autostart keys'],['source\\s*=\\s*wineventlog:sysmon|wineventlog:sysmon','reads the WinEventLog:Sysmon channel']],
    wrong:[['eventcode\\s*=\\s*1(?!3|4)','uses EventCode=1 (process) as the registry source'],['eventcode\\s*=\\s*14','uses EventCode=14 (rename) where value-set was asked']],
    dangerous:[['\\|\\s*delete|\\|\\s*remove','destructive pipe stage in a search query']],
    x:'<p>The canonical query filters the <strong>WinEventLog:Sysmon</strong> channel, keeps only <strong>EventCode=13</strong> (value set — renames are 14), and constrains <strong>TargetObject</strong> to paths containing Run, which catches both Run and RunOnce. EventCode=1 would give you processes, not registry writes, and EventCode=14 gives renames — both plausible near-misses. The pipe-style query stays read-only; a delete stage has no place in a detection search. This is the exact query shape a detection engineer ships on day one of an AN0781 rollout.</p>',
    h:'Channel, event code, key path — three constraints in one line.' },

  { t:'branch', multiEl:true,
    s:{sum:'09:58. CTX-FARM-07 (citrix server, 60 users): Sysmon shows winword.exe spawning reg.exe, which wrote an HKCU Run key. Three artefacts disagree about the user.',
       blocks:[{label:'ARTEFACT 1 — Sysmon (CTX-FARM-07)', kind:'log', lines:[
         '09:56:41  EventCode=1  Image: …\\winword.exe  User: CTX\\u2231  CommandLine: winword.exe /q /n "handover-notes.docm"',
         '09:56:55  EventCode=1  Image: …\\reg.exe  Parent: …\\winword.exe  User: CTX\\u2231  CommandLine: reg add HKCU\\…\\Run /v SyncSvc /d "\\\\fileshare\\s.exe"',
         '09:56:56  EventCode=13 TargetObject: HKCU\\…\\Run\\SyncSvc  Image: …\\reg.exe  User: CTX\\u2231']},
         {label:'ARTEFACT 2 — Helpdesk note', kind:'text',
         body:['User u2231 opened "handover-notes.docm" from an external mail download at 09:56. User says: "I only opened a document."']},
         {label:'ARTEFACT 3 — Asset note', kind:'text',
         body:['CTX-FARM-07: shared citrix host. Macro blocking policy: set to "warn" (not block) for this farm since March.']}]},
    q:'Take the three responder decisions in order.',
    steps:[
      { q:'Which artefact carries the strongest evidence right now?', opts:[
        ['The Sysmon chain: document → reg.exe → Run key, all one user',1],
        ['The helpdesk note, because users know what they clicked',0],
        ['The asset note, because policy state explains everything',0]]},
      { q:'What does the parent-child line winword.exe → reg.exe tell you?', opts:[
        ['The document itself reached out and changed the registry — macro code ran',1],
        ['reg.exe always starts from winword.exe on citrix hosts',0],
        ['The user typed the reg command manually',0]]},
      { q:'CISO: "60 users on that host — decide now." Least aggressive correct action?', opts:[
        ['Log off u2231 and hold the session image for IR; keep the farm online',1],
        ['Reboot the whole citrix farm immediately',0],
        ['Delete the Run value and let u2231 continue working',0]]}
    ],
    x:'<p>Step 1: the <strong>Sysmon chain</strong> is machine evidence with one ProcessGuid line and a user attached — the helpdesk note is colour, the asset note is context. Step 2: reg.exe does not normally have winword.exe as a parent; a document process spawning a registry writer means <strong>macro code executed</strong> — the “warn” macro policy let it through. Step 3: on a shared farm, the least aggressive action that contains the case is to <strong>end the affected session and preserve its image</strong>: no farm-wide reboot (60 users lose work for one session’s incident), no surgical delete (evidence gone, chain may respawn). This is the judgement call a senior IR analyst makes under pressure.</p>',
    h:'Trust machines over people for facts; then contain the smallest unit that holds the threat.' },

  { t:'rank', multiEl:true,
    s:{sum:'Your queue after the 06:00 push — five DET0280 alerts. Rank them for triage.',
       blocks:[{label:'ARTEFACT 1 — Alert list', kind:'text',
         body:['A. Unsigned powershell.exe (%TEMP%) wrote Winlogon\\Userinit — chain completed 40 s later.',
               'B. msiexec.exe (signed, allowlisted) wrote a Run entry during an approved install.',
               'C. wmic.exe (parent: cmd.exe from %TEMP%) set SafeDllSearchMode = 0.',
               'D. SCCM client wrote a Run entry for the approved VPN rollout.',
               'E. reg.exe (signed, but parent = winword.exe) added an HKCU Run value.']}]},
    q:'Rank from most urgent (top) to least urgent (bottom).',
    items:['A — unsigned PowerShell wrote Userinit, chain completed','C — wmic from a Temp-born cmd zeroed SafeDllSearchMode','E — signed reg.exe with a winword parent added a Run value','B — allowlisted msiexec wrote during an approved install','D — SCCM client wrote the approved VPN rollout entry'],
    x:'<p><strong>A</strong> first: unsigned writer + Winlogon + a completed chain is a live persistence event. <strong>C</strong> next: no execution yet, but a Temp-born process weakening library search is a preparation step — catch it before the next stage. <strong>E</strong> third: the writer is signed but the parent (winword) is wrong for reg.exe — suspicious, needs one lookup. <strong>B</strong> and <strong>D</strong> are allowlisted, signed writers inside approved changes: routine noise, confirm against the change calendar and close. A detection engineer’s tuning relies on analysts ranking exactly this way.</p>',
    h:'Completed chains beat preparations; preparations beat odd lineage; allowlisted writers last.' },

  { t:'fill', multiEl:true,
    s:{sum:'You are writing the on-call runbook page for DET0280. Fill in the element names.',
       blocks:[{label:'ARTEFACT 1 — Runbook draft', kind:'text',
         body:['When ____(1)____ flags an unsigned or oddly-parented writer, the on-call analyst first checks whether the writer sits in the ____(2)____; trusted tools are documented there. Next, confirm the write and the follow-up execution fall inside the ____(3)____. If the key family is missing from ____(4)____, file a tuning request instead of escalating. — DE team']}]},
    q:'Complete the runbook with the four element names.',
    parts:['When ',{b:0},' flags an unsigned or oddly-parented writer, first check whether the writer sits in the ',{b:1},'. Next, confirm the write and the follow-up execution fall inside the ',{b:2},'. If the key family is missing from ',{b:3},', file a tuning request instead of escalating.'],
    bank:['SignatureCheck','ParentProcessAllowList','TimeWindow','RegistryKeyPathPatterns','TargetObject','AN0781'],
    x:'<p>The runbook walks the elements in the order the analyst meets them. <strong>SignatureCheck</strong> raises the trust flag. The <strong>ParentProcessAllowList</strong> answers “is this writer a documented trusted tool?”. The <strong>TimeWindow</strong> decides whether the write and the nearby execution belong to one chain. The <strong>RegistryKeyPathPatterns</strong> decides whether the key is even in scope — a missing family is a tuning request, not an incident. TargetObject is a log field and AN0781 is the analytic itself; neither is a tuning element.</p>',
    h:'Flag → trust list → time → key scope.' },

  { t:'qcm', multiEl:false,
    s:{sum:'Two writes from one host look similar in a key-path report. One should worry you much more.',
       blocks:[{label:'ARTEFACT 1 — Two EventCode=13 lines', kind:'log', lines:[
         '07:02:11  EventCode=13  TargetObject: HKLM\\…\\Run\\BootSync  Image: C:\\Windows\\System32\\svchost.exe  Signed: true  Parent: …\\services.exe',
         '07:04:56  EventCode=13  TargetObject: HKLM\\…\\Services\\BackupSvc\\ImagePath  Image: C:\\Windows\\System32\\msiexec.exe  Signed: true  (install in progress)']}]},
    q:'Which line deserves the escalation, and why?',
    opts:[['The svchost.exe Run-key write — a normal svchost does not write Run keys',1],['The msiexec.exe ImagePath write — service keys are always more sensitive',0],['Both equally — both touch watched key families',0],['Neither — both writers are signed Microsoft binaries',0]],
    x:'<p>The <strong>svchost.exe</strong> line is the alarming one. Svchost is a shared Windows service host; a legitimate svchost instance does not write Run keys, so this smells like process masquerading or injection — <strong>benign-looking writer, alarming behaviour</strong>. The msiexec line is the mirror image: service keys ARE sensitive, but a signed installer mid-install editing ImagePath is the normal way software registers a service — <strong>alarming-looking artefact, benign behaviour</strong>. Signature alone proves neither; lineage and context decide. This discrimination is exactly what AN0781’s ParentProcessAllowList and SignatureCheck elements encode.</p>',
    h:'Ask what each writer normally does — then invert it.' },

  { t:'qmul', multiEl:true,
    s:{sum:'FP review: last week AN0781 raised 214 alerts; 203 were installers and GPO pushes. Choose the changes that cut noise WITHOUT losing real catches.',
       blocks:[{label:'ARTEFACT 1 — Current settings & proposal list', kind:'text',
         body:['Settings: patterns = Run, Services, Winlogon, SafeDllSearchMode. AllowList = regedit.exe, msiexec.exe. TimeWindow = 5 min. SignatureCheck = on.',
               'Proposals: (a) remove EventCode=1 collection; (b) watch every registry key on the host; (c) auto-annotate and quiet writes that match an approved change-calendar entry by an allowlisted writer; (d) disable SignatureCheck to catch more; (e) keep RegistryKeyPathPatterns focused on the keys your threat model names; (f) raise TimeWindow to 24 hours.']}]},
    q:'Select the two proposals that reduce false positives without dropping true positives.',
    opts:[['(c) quiet the writes an approved change calendar explains from an allowlisted writer',1],['(e) keep RegistryKeyPathPatterns focused on the keys your threat model names',1],['(a) remove EventCode=1 collection to kill the correlation noise',0],['(b) watch every registry key so nothing is missed',0],['(d) disable SignatureCheck so unsigned writers are not needed as a signal',0],['(f) widen the TimeWindow to 24 hours',0]],
    x:'<p><strong>(c)</strong> attacks the actual noise source: the 203 FPs were installers and GPO pushes, and those arrive with an approved change entry. When the writer is allowlisted <em>and</em> the calendar explains the write, quieting it costs nothing — a real attacker write never matches an approved change, so no true positive is lost. <strong>(e)</strong> keeps the key scope tied to your threat model, so random settings keys never alert. The rest all cut true coverage: <strong>(a)</strong> destroys the writer half of the chain (the detection dies), <strong>(b)</strong> drowns you in every settings change, <strong>(d)</strong> throws away the trust signal that separates installers from hidden PowerShell, and <strong>(f)</strong> lets unrelated events merge into fake chains. Tuning is subtraction with proof, not blind cuts.</p>',
    h:'One proposal adds a second source of context; one tightens the scope. The other four break or drown the chain.' },

  { t:'order', multiEl:true,
    s:{sum:'You are rolling AN0781 into a new subsidiary. Put the rollout steps in order.',
       blocks:[{label:'ARTEFACT 1 — Rollout cards', kind:'text',
         body:['[A] Measure: run in alert-only mode for two weeks; tune allowlist and patterns from the FP report.',
               '[B] Collect: deploy Sysmon with registry-event and process-creation logging to all endpoints.',
               '[C] Scope: define RegistryKeyPathPatterns from the subsidiary’s software and threat model.',
               '[D] Calibrate: set TimeWindow, ParentProcessAllowList and SignatureCheck with the platform team.']}]},
    q:'Put the four rollout steps in the correct order.',
    items:['Collect: deploy Sysmon with registry-event and process-creation logging','Scope: define RegistryKeyPathPatterns from software and threat model','Calibrate: set TimeWindow, ParentProcessAllowList and SignatureCheck','Measure: alert-only mode, tune from the FP report'],
    x:'<p>No telemetry, no detection — <strong>collect</strong> first. Then <strong>scope</strong>: the patterns must reflect the subsidiary’s actual software, or the allowlist will chase the wrong installers. Then <strong>calibrate</strong> the trust and time elements against that scope. Only after that <strong>measure</strong> in alert-only mode and tune from data. Reversing the order — say, calibrating before telemetry exists — means tuning guesses, and guessing is how FPs survive to production.</p>',
    h:'Telemetry → scope → knobs → proof.' },

  { t:'log', multiEl:false,
    s:{sum:'A colleague’s draft correlation rule has exactly one broken line. Find it before it ships.',
       blocks:[{label:'ARTEFACT 1 — Draft correlation rule (detection engineering review)', kind:'log', lines:[
         'RULE det0280_chain_v2  SOURCE WinEventLog:Sysmon',
         '  LET writer = SELECT Image, ProcessGuid FROM events WHERE EventCode=13',
         '  LET runner = SELECT Image, ProcessGuid FROM events WHERE EventCode=1',
         '  MATCH writer.ProcessGuid = runner.ProcessGuid WITHIN TimeWindow',
         '  MATCH writer.ProcessGuid = runner.ParentProcessGuid OR writer.ProcessGuid = runner.ProcessGuid',
         '  WHEN SignatureCheck(writer.Image) = unsigned AND writer.TargetObject MATCHES patterns THEN alert']}]},
    q:'Click the line whose logic would break the chain match.',
    lines:[
      'RULE det0280_chain_v2  SOURCE WinEventLog:Sysmon',
      '  LET writer = SELECT Image, ProcessGuid FROM events WHERE EventCode=13',
      '  LET runner = SELECT Image, ProcessGuid FROM events WHERE EventCode=1',
      '  MATCH writer.ProcessGuid = runner.ProcessGuid WITHIN TimeWindow',
      '  MATCH writer.ProcessGuid = runner.ParentProcessGuid OR writer.ProcessGuid = runner.ProcessGuid',
      '  WHEN SignatureCheck(writer.Image) = unsigned AND writer.TargetObject MATCHES patterns THEN alert'],
    target:3, targetText:'Line 4 — a hard equality on ProcessGuid alone drops the parent-child case it doubles',
    x:'<p>Line 4 is the bug. The chain does not always have the <strong>same</strong> process for write and follow-up: the writer may be the parent of the process that runs (line 5 already covers both cases with an OR). A hard, standalone equality forces ProcessGuid to match exactly on both sides, so any chain where the follow-up is a <strong>child</strong> of the writer silently stops matching. The other lines are fine: 13 for the write, 1 for processes, and the trust + pattern check in the last line mirrors SignatureCheck and RegistryKeyPathPatterns. Reviewing a rule line by line like this is standard detection-engineering peer review.</p>',
    h:'Compare line 4 and line 5 — one of them makes the other impossible.' },

  { t:'qcm', multiEl:false,
    s:{sum:'Platform team proposal: “Let’s just block reg.exe with an application control policy — problem solved, no detection needed.”',
       blocks:[{label:'ARTEFACT 1 — Proposal memo', kind:'text',
         body:['Memo: block reg.exe via AppLocker on all endpoints. Expected result: T1112 impossible. Detection budget can move elsewhere. — Platform team']}]},
    q:'Why is the proposal wrong?',
    opts:[['PowerShell, WMI and direct API calls reach the registry without reg.exe',1],['reg.exe is only used by attackers, so blocking it is safe and complete',0],['AppLocker cannot block any Microsoft-signed binary',0],['Blocking reg.exe would also disable the Sysmon service',0]],
    x:'<p>The analytic itself names <strong>four paths</strong>: CLI, PowerShell, WMI and direct API. Blocking reg.exe closes exactly one of them; Set-ItemProperty, StdRegProv and RegSetValueEx keep working untouched. So prevention must be layered, and the detection (DET0280) stays necessary — in fact it becomes MORE important, because it watches the behaviour, not one tool. AppLocker certainly can block signed binaries by rule, and Sysmon does not depend on reg.exe. “One tool, one fix” is the trap; behaviour-based thinking is the cure.</p>',
    h:'Count the paths the analytic names — how many did the memo close?' },

  { t:'match', multiEl:true,
    s:{sum:'New-analyst induction: match each artefact in the DET0280 workflow to what it contributes.',
       blocks:[{label:'ARTEFACT 1 — Workflow artefacts', kind:'text',
         body:['Sysmon EventCode=13 line · Sysmon EventCode=1 line · Change calendar entry · EDR verdict for the writer · Deep Procmon trace of the writer']}]},
    q:'Match each artefact to its contribution.',
    pairs:[['EventCode=13 line','Proof that the registry write happened, and where'],['EventCode=1 line','Identity and lineage of the writing process'],['Change calendar entry','Explains installer noise as planned change'],['EDR verdict for the writer','Trust signal feeding the SignatureCheck decision'],['Procmon trace','Deep-dive proof of which registry API path was used']],
    x:'<p>Every artefact answers one question in the workflow. The <strong>13</strong> line proves the write and names the key. The <strong>1</strong> line gives the writer and its parent — the behaviour half. The <strong>change calendar</strong> explains why trusted tools wrote during a window. The <strong>EDR verdict</strong> adds a trust signal on top of signature checks. The <strong>Procmon trace</strong> is the deep-dive tool: it shows the actual RegSetValueEx-style calls when you must prove the API path. Together they turn a single alert into a defensible triage story.</p>',
    h:'Two artefacts are log events, three are context you fetch around them.' },

  { t:'drop', multiEl:true,
    s:{sum:'Gap of the quarter: remote-registry writes (attacker on HOST-A writing keys on HOST-B). What helps close it?',
       blocks:[{label:'ARTEFACT 1 — Gap note', kind:'text',
         body:['On remote writes, HOST-B shows the registry change but not the attacker’s process (no local EventCode=1 for the remote tool). Proposed compensations: (a) enable registry auditing (Security 4657) on targets; (b) collect and correlate Sysmon from the source host too; (c) monitor RemoteRegistry service starts; (d) disable EventCode=1 collection on targets; (e) watch only HKCU keys; (f) rely on the wallpaper change events.']}]},
    q:'Drag each proposal into the right bucket.',
    zones:['Helps close the gap','Does not help'],
    items:[['Enable Security 4657 registry auditing on target hosts',0],['Correlate Sysmon telemetry from the source host',0],['Monitor RemoteRegistry service starts',0],['Disable EventCode=1 collection on the targets',1],['Watch only HKCU keys to reduce volume',1],['Count on wallpaper-change events as the signal',1]],
    x:'<p>The gap is a <strong>missing writer half</strong> on the target. Security <strong>4657</strong> gives you native registry audit events on the target even without Sysmon — a real compensating control. <strong>Source-host correlation</strong> restores the writer: the attacker’s process lives there, and its ProcessGuid story joins across hosts. Watching <strong>RemoteRegistry</strong> service starts catches the classic remote-registry access pattern. The failures are obvious once said aloud: <strong>(d)</strong> removes the very process telemetry the chain needs, <strong>(e)</strong> narrows keys instead of fixing attribution, and <strong>(f)</strong> is an unwatched key family. Coverage reasoning = find the missing half, then fetch it.</p>',

var HL_RX = /(EventCode\s*=\s*\d+)|(EventID\s*=\s*\d+)|(\b\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?\b)|(\b\d{2}:\d{2}:\d{2}\b)|((?:HKLM|HKCU|HKU|HKCR)\\[^\s",;)]*)|("(?:[^"\\]|\\.)*")|(\b(?:reg\.exe|reg\.add|regedit(?:\.exe)?|powershell(?:\.exe)?|pwsh|cmd\.exe|wmic(?:\.exe)?|msiexec(?:\.exe)?|rundll32(?:\.exe)?|svchost(?:\.exe)?|winword(?:\.exe)?|excel(?:\.exe)?|outlook(?:\.exe)?|explorer\.exe|schtasks(?:\.exe)?|sc\.exe|psexec|wscript(?:\.exe)?|cscript(?:\.exe)?|mshta(?:\.exe)?|Set-ItemProperty|New-ItemProperty|Remove-ItemProperty|Invoke-CimMethod|Register-ScheduledTask)\b)|(\b(?:TargetObject|Details|EventType|Image|ParentImage|ProcessGuid|ProcessId|CommandLine|User|UtcTime|Hashes|Company|Signature|Signed|EventRecordID|Computer|Channel|ServiceName|ImagePath|QueryName|DestinationHostname|SourceIp|LogonId|IntegrityLevel|ParentProcessGuid|Product)\b(?=\s*:))/gi;
function hlLine(raw){
  var out = '', last = 0, m;
  HL_RX.lastIndex = 0;
  while ((m = HL_RX.exec(raw)) !== null){
    out += esc(raw.slice(last, m.index));
    var tok = m[0], cls = 'hl-op';
    if (m[1] || m[2]) cls = 'hl-ev';
    else if (m[3] || m[4]) cls = 'hl-ts';

    out += '<span class="' + cls + '">' + esc(tok) + '</span>';
    last = m.index + tok.length;
  }

}

      }
      Array.prototype.forEach.call(wrap.children, function(c, ci){

        c.setAttribute('aria-pressed', String(on));
        c.querySelector('.sel-tag').hidden = !on;

}
function gQCM(ex, st, multi){
  var sel = st.data.sel, sh = st.data.shuffledOpts;
  var N = multi ? sh.filter(function(o){ return o.ok; }).length : 1;
  var H = 0, W = 0, items = [];
  sh.forEach(function(o, oi){
    var wasSel = sel.indexOf(oi) >= 0;
    if (multi){
      if (o.ok && wasSel){ H++; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W++; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok && !wasSel){ items.push({ label: o.t, status: 'missed' }); }
    } else {
      if (o.ok && wasSel){ H = 1; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W = 1; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok){ items.push({ label: o.t, status: 'missed' }); }
    }
  });
  return { H: H, W: W, N: N, items: items };
}

function gMatch(ex, st){

  });

}

function wDrop(ex, st){
  var d = st.data; if (!d.placed) d.placed = {};
  if (!d.shuffledItems) d.shuffledItems = shuffle(ex.items.map(function(it, i){ return { t: it[0], z: it[1], i: i }; }));
  var items = d.shuffledItems;
  var single = ex.zones.length < 2;
  var wrap = el('div', 'dropwrap' + (single ? ' single' : ''));
  var bank = el('div', 'bank');
  bank.setAttribute('role', 'group'); bank.setAttribute('aria-label', 'Item bank');
  var zones = el('div', 'zones');
  var zoneEls = [];
  ex.zones.forEach(function(z, zi){
    var zEl = el('div', 'zone');
    zEl.appendChild(el('h4', null, '<span aria-hidden="true">🗂</span> ' + esc(z)));
    var slot = el('div', 'zslot'); slot.dataset.z = zi;
    zEl.appendChild(slot);
    zones.appendChild(zEl); zoneEls.push(slot);
  });
  function chipEl(it){
    var c = el('button', 'chip'); c.type = 'button';
    c.innerHTML = '<span aria-hidden="true">⬚</span> ' + esc(it.t);
    c.setAttribute('aria-label', 'Item: ' + it.t);
    c.onclick = function(){
      if (st.locked) return;
      var was = c.classList.contains('picked');
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      if (was){ d.picked = null; return; }
      c.classList.add('picked'); d.picked = it.i;
    };
    c.addEventListener('pointerdown', function(ev){
      if (st.locked) return;
      ev.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      c.classList.add('picked'); d.picked = it.i;
      var g = el('div', 'chip dragghost', c.innerHTML); document.body.appendChild(g);
      function mv(e){ g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
      function up(e){
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
        var t = document.elementFromPoint(e.clientX, e.clientY);
        var zslot = t && t.closest ? t.closest('.zslot') : null;
        if (zslot && !st.locked) place(it.i, parseInt(zslot.dataset.z, 10));
        if (g.parentNode) g.parentNode.removeChild(g);
      }
      mv(ev);
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
    });
    return c;
  }
  function place(ii, zi){ d.placed[ii] = zi; d.picked = null; refresh(); }
  function refresh(){
    bank.innerHTML = '';
    items.forEach(function(it){ if (d.placed[it.i] === undefined) bank.appendChild(chipEl(it)); });
    if (!bank.children.length) bank.innerHTML = '<span class="small-note">All items placed — click a placed item to return it.</span>';
    zoneEls.forEach(function(slot, zi){
      slot.innerHTML = '';
      items.forEach(function(it){
        if (d.placed[it.i] === zi){
          var c = chipEl(it);
          c.onclick = function(){ if (!st.locked){ delete d.placed[it.i]; d.picked = null; refresh(); } };
          slot.appendChild(c);
        }
      });
    });
    $('#btncheck').disabled = Object.keys(d.placed).length === 0;
  }
  refresh();
  wrap.appendChild(bank); wrap.appendChild(zones);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Drag an item into a zone, or click the item and then click a zone. Click a placed item to send it back.'));
  return holder;
}
function gDrop(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  ex.items.forEach(function(it, i){
    var placedAt = d.placed[i];
    if (placedAt === undefined) items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'missed' });
    else if (placedAt === it[1]){ H++; items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'correct' }); }
    else { W++; items.push({ label: it[0] + ' → ' + ex.zones[placedAt] + ' (wrong zone)', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- order / rank --- */
function wOrder(ex, st, isRank){
  var d = st.data;
  if (!d.shuffled) d.shuffled = shuffle(ex.items.map(function(t, i){ return { t: t, i: i }; }));
  if (!d.order) d.order = d.shuffled.slice();
  var list = el('div', 'orderlist');
  list.setAttribute('aria-label', isRank ? 'Priority list' : 'Ordered list');
  function render(){
    list.innerHTML = '';
    d.order.forEach(function(it, pos){
      var row = el('div', 'orow');
      row.setAttribute('aria-label', 'Position ' + (pos + 1) + ': ' + it.t);
      row.innerHTML = '<span class="rank">' + (isRank ? '#' : (pos + 1) + '.') + '</span><span class="txt">' + esc(it.t) + '</span>';
      var mv = el('span', 'mv');
      var up = el('button', 'btn small', '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
      var dn = el('button', 'btn small', '↓'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
      up.disabled = pos === 0; dn.disabled = pos === d.order.length - 1;
      up.onclick = function(){ if (st.locked) return; var t = d.order[pos - 1]; d.order[pos - 1] = d.order[pos]; d.order[pos] = t; render(); };
      dn.onclick = function(){ if (st.locked) return; var t = d.order[pos + 1]; d.order[pos + 1] = d.order[pos]; d.order[pos] = t; render(); };
      mv.appendChild(up); mv.appendChild(dn);
      row.appendChild(mv);
      row.addEventListener('pointerdown', function(ev){
        if (st.locked || (ev.target.closest && ev.target.closest('button'))) return;
        ev.preventDefault();
        var g = el('div', 'chip dragghost', esc(it.t)); document.body.appendChild(g);
        function mv2(e){
          g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
          var rows = Array.prototype.slice.call(list.children);
          var idx = rows.length;
          for (var ri = 0; ri < rows.length; ri++){ var b = rows[ri].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2){ idx = ri; break; } }
          var from = d.order.indexOf(it);
          if (idx > from) idx--;
          if (idx !== from && idx >= 0){ d.order.splice(from, 1); d.order.splice(idx, 0, it); render(); }
        }
        function up2(){ document.removeEventListener('pointermove', mv2); document.removeEventListener('pointerup', up2); if (g.parentNode) g.parentNode.removeChild(g); }
        mv2(ev);
        document.addEventListener('pointermove', mv2);
        document.addEventListener('pointerup', up2);
      });
      list.appendChild(row);
    });
    $('#btncheck').disabled = sameOrder(d.order, d.shuffled);
  }
  render();
  var holder = el('div');
  holder.appendChild(list);
  holder.appendChild(el('p', 'mhint', (isRank ? 'Rank from most urgent (top) to least urgent (bottom). ' : 'Put the steps in the correct order. ') + 'Use drag or the ↑ ↓ buttons.'));
  return holder;
}
function gOrder(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  d.order.forEach(function(it, pos){
    if (it.i === pos){ H++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t, status: 'correct' }); }
    else { W++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t + ' — correct here: ' + ex.items[pos], status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- fill (word bank → blanks); parts: string | {b: bankIndex} --- */
function wFill(ex, st){
  var d = st.data;
  if (!d.slotVals) d.slotVals = ex.parts.filter(function(p){ return typeof p === 'object'; }).map(function(){ return null; });
  if (!d.shuffledBank) d.shuffledBank = shuffle(ex.bank.map(function(w, i){ return { w: w, i: i }; }));
  var bank = d.shuffledBank;
  var wrap = el('div');
  var textEl = el('p', 'filltext');
  var slots = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p === 'string'){
      var sp = el('span'); sp.textContent = p; textEl.appendChild(sp);
    } else {
      var si = slotIdx++;
      var s = el('button', 'slot'); s.type = 'button';
      s.textContent = '___';
      s.setAttribute('aria-label', 'Blank ' + (si + 1) + ', choose a word');
      s.onclick = function(){
        if (st.locked) return;
        if (d.slotVals[si] !== null && d.picked == null){ d.slotVals[si] = null; render(); return; }
        if (d.picked != null){
          for (var k = 0; k < d.slotVals.length; k++){ if (d.slotVals[k] === d.picked) d.slotVals[k] = null; }
          d.slotVals[si] = d.picked; d.picked = null; render();
        }
      };
      slots[si] = s; textEl.appendChild(s);
    }
  });
  var bankRow = el('div', 'bankrow');
  bankRow.setAttribute('role', 'group'); bankRow.setAttribute('aria-label', 'Word bank');
  function render(){
    slots.forEach(function(s, si){
      var v = d.slotVals[si];
      if (v == null){ s.textContent = '___'; s.classList.remove('filled'); }
      else { s.textContent = bank[v].w; s.classList.add('filled'); }
    });
    bankRow.innerHTML = '';
    bank.forEach(function(b, bi){
      if (d.slotVals.indexOf(bi) >= 0) return;
      var c = el('button', 'chip'); c.type = 'button'; c.textContent = b.w;
      c.setAttribute('aria-label', 'Word: ' + b.w);
      c.onclick = function(){
        if (st.locked) return;
        var was = c.classList.contains('picked');
        Array.prototype.forEach.call(bankRow.children, function(x){ x.classList.remove('picked'); });
        if (was){ d.picked = null; return; }
        c.classList.add('picked'); d.picked = bi;
      };
      bankRow.appendChild(c);
    });
    $('#btncheck').disabled = d.slotVals.every(function(x){ return x == null; });
  }
  render();
  wrap.appendChild(textEl); wrap.appendChild(bankRow);
  wrap.appendChild(el('p', 'mhint', 'Click a word, then click a blank. Click a filled blank to empty it. Distractor words do not belong anywhere.'));
  return wrap;
}
function gFill(ex, st){
  var d = st.data, H = 0, W = 0, N = 0, items = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p !== 'object') return;
    var si = slotIdx++; N++;
    var expected = ex.bank[p.b];
    var chosen = d.slotVals[si];
    if (chosen == null) items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'missed' });
    else if (d.shuffledBank[chosen].i === p.b){ H++; items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'correct' }); }
    else { W++; items.push({ label: 'Blank ' + N + ': placed "' + d.shuffledBank[chosen].w + '" (correct: ' + expected + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- log viewer (click a line, or click a line then a field) --- */
function wLog(ex, st){
  var d = st.data; if (d.pick === undefined) d.pick = null;
  var wrap = el('div');
  var lv = el('div', 'logview');
  var bar = el('div', 'logbar');
  var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Filter lines… (e.g. EventCode=13)';
  inp.setAttribute('aria-label', 'Filter log lines');
  var cnt = el('span', 'cnt');
  bar.appendChild(el('span', null, '🔎')); bar.appendChild(inp); bar.appendChild(cnt);
  var linesEl = el('div', 'loglines');
  lv.appendChild(bar); lv.appendChild(linesEl);
  var lineBtns = [];
  ex.lines.forEach(function(L, i){
    var b = el('button', 'logline'); b.type = 'button';
    b.innerHTML = logLineHtml(L, i + 1);
    b.setAttribute('aria-label', 'Log line ' + (i + 1) + ': ' + L);
    b.dataset.raw = L;
    b.onclick = function(){
      if (st.locked) return;
      d.pick = i;
      lineBtns.forEach(function(x, xi){ x.setAttribute('aria-pressed', String(xi === i)); });
      $('#btncheck').disabled = false;
    };
    lineBtns.push(b);
  });
  function applyFilter(){
    var q = inp.value.trim().toLowerCase();
    var shown = 0;
    lineBtns.forEach(function(b){
      var on = !q || b.dataset.raw.toLowerCase().indexOf(q) >= 0;
      b.style.display = on ? '' : 'none';
      if (on) shown++;
    });
    cnt.textContent = shown + ' / ' + lineBtns.length + ' lines';
  }
  inp.addEventListener('input', applyFilter);
  applyFilter();
  lineBtns.forEach(function(bn){ linesEl.appendChild(bn); });
  wrap.appendChild(lv);
  wrap.appendChild(el('p', 'mhint', 'Click the one line that answers the question. Use the filter box to narrow the view.'));
  return wrap;
}
function gLog(ex, st){
  var ok = st.data.pick === ex.target;
  return { H: ok ? 1 : 0, W: ok ? 0 : 1, N: 1,
    items: [{ label: ex.targetText || ('Line ' + (ex.target + 1)), status: ok ? 'correct' : 'wrong' }] };
}

/* --- branch (decision tree; graded on final step) --- */
function wBranch(ex, st){
  var d = st.data;
  if (!d.choices) d.choices = [];
  var wrap = el('div');
  var stepHost = el('div');
  wrap.appendChild(stepHost);
  var stepNote = el('p', 'mhint', '');
  wrap.appendChild(stepNote);
  function renderStep(){
    var si = d.choices.length;
    if (si >= ex.steps.length) return;
    var step = ex.steps[si];
    stepHost.innerHTML = '';
    var tag = el('p', 'small-note', 'STEP ' + (si + 1) + ' OF ' + ex.steps.length);
    tag.style.fontWeight = '700';
    stepHost.appendChild(tag);
    stepHost.appendChild(el('p', null, '<strong>' + esc(step.q) + '</strong>'));
    var opts = el('div', 'opts');
    var letters = 'ABCD';
    shuffle(step.opts).forEach(function(o, oi){
      var b = el('button', 'opt'); b.type = 'button';
      b.innerHTML = '<span class="key">' + letters[oi] + '.</span><span class="txt">' + esc(o[0]) + '</span>';
      b.onclick = function(){
        d.choices.push(o[0]);
        renderStep();
      };
      opts.appendChild(b);
    });
    stepHost.appendChild(opts);
    stepNote.textContent = si === 0
      ? 'Intermediate steps do not pause the timer and do not reveal right or wrong. Only the final step is graded.'
      : 'The timer keeps running between steps.';
  }
  renderStep();
  return wrap;
}
function wBranchReady(ex, st){ return st.data.choices.length >= ex.steps.length; }
function gBranch(ex, st){
  var H = 0, W = 0, N = ex.steps.length, items = [];
  ex.steps.forEach(function(step, i){
    var chosen = st.data.choices[i];
    var correct = step.opts.filter(function(o){ return o[1] === 1; })[0][0];
    if (chosen === correct){ H++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen, status: 'correct' }); }
    else { W++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen + ' (better: ' + correct + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- terminal (query editor) --- */
function wTerm(ex, st){
  var d = st.data;
  var wrap = el('div', 'term');
  wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Query editor (simulation only)');
  var head = el('div', 'thead', '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> ' + esc(ex.env || 'query editor — simulation only, nothing is executed'));
  var body = el('div', 'tbody');
  var line = el('div', 'promptline');
  line.appendChild(el('span', 'prompt', esc(ex.prompt || 'query>')));
  var inp = el('input'); inp.type = 'text'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Query input');
  inp.value = d.cmd || '';
  inp.addEventListener('input', function(){ d.cmd = inp.value; $('#btncheck').disabled = !d.cmd || !d.cmd.trim(); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !$('#btncheck').disabled){ e.preventDefault(); onCheck(); } });
  line.appendChild(inp);
  body.appendChild(line);
  var out = el('div', 'tout'); out.id = 'termout';
  out.textContent = d.ran ? '— press Check to grade your query —' : 'Waiting for your query…';
  body.appendChild(out);
  wrap.appendChild(head); wrap.appendChild(body);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Type the query into the editor, then press Check. Grading looks at the elements your query contains.'));
  setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 60);
  return holder;
}
function normQuery(q){
  return String(q || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/["']/g, '');
}
function gTerm(ex, st){
  var q = normQuery(st.data.cmd);
  var H = 0, W = 0, N = ex.elements.length, items = [];
  ex.elements.forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ H++; items.push({ label: 'Element: ' + e[1], status: 'correct' }); }
    else items.push({ label: 'Element: ' + e[1], status: 'missed' });
  });
  (ex.wrong || []).forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ W++; items.push({ label: 'Element: ' + e[1], status: 'wrong' }); }
  });
  var dangerous = (ex.dangerous || []).filter(function(e){ return new RegExp(e[0], 'i').test(q); }).map(function(e){ return e[1]; });
  return { H: H, W: W, N: N, items: items, dangerous: dangerous };
}

/* ================= EXERCISE FLOW ================= */
var GRADERS = {
  qcm: function(ex, st){ return gQCM(ex, st, false); },
  qmul: function(ex, st){ return gQCM(ex, st, true); },
  match: gMatch, drop: gDrop, order: gOrder, rank: gOrder, fill: gFill, log: gLog,
  branch: gBranch, term: gTerm
};
var RENDERERS = {
  qcm: function(ex, st){ return wQCM(ex, st, false); },
  qmul: function(ex, st){ return wQCM(ex, st, true); },
  match: wMatch, drop: wDrop, order: function(ex, st){ return wOrder(ex, st, false); },
  rank: function(ex, st){ return wOrder(ex, st, true); },
  fill: wFill, log: wLog, branch: wBranch, term: wTerm
};
var TYPE_LABELS = { qcm: 'Multiple choice', qmul: 'Multiple select', match: 'Matching', drop: 'Drag & drop',
  order: 'Ordering', rank: 'Prioritising', fill: 'Fill the blanks', log: 'Log analysis', branch: 'Decision tree', term: 'Query editor' };

function isBranchReady(ex, st){ return ex.t === 'branch' ? wBranchReady(ex, st) : true; }

function renderExercise(){
  var ex = EXERCISES[S.queue[S.idx].i];
  S.cur = { ex: ex, st: { data: {}, locked: false }, feedbackOpen: false };
  var host = $('#exercisehost');
  host.innerHTML = '';
  host.appendChild(el('p', 'small-note', 'Exercise type: ' + TYPE_LABELS[ex.t] + (ex.multiEl ? ' · multi-item, scored with partial credit' : '')));
  var sc = renderScenario(ex);
  if (ex.s.sum) collapser(sc, ex.s.sum);
  host.appendChild(sc);
  host.appendChild(renderQuestion(ex));
  host.appendChild(answerShell());
  /* widget is built after the shell is mounted so it can reach #btncheck */
  var widget = RENDERERS[ex.t](ex, S.cur.st);
  $('#widgetslot').appendChild(widget);
  $('#btncheck').onclick = onCheck;
  /* branch: enable check only when all steps answered */
  if (ex.t === 'branch'){
    var poll = setInterval(function(){
      var b = $('#btncheck');
      if (!b || !S.cur || S.cur.ex !== ex){ clearInterval(poll); return; }
      b.disabled = !wBranchReady(ex, S.cur.st) || S.cur.st.locked;
    }, 300);
  }
  renderExamBar();
  var fb = $('#fbhost'); if (fb) fb.remove();
}

function onCheck(){
  if (!S.cur || S.cur.st.locked) return;          /* already checked */
  if (S.answered[curKey()]) return;               /* double-fire guard */
  if (S.timer.state === 'ENDED') return;          /* time is over */
  var ex = S.cur.ex, st = S.cur.st;
  if (!anyAnswer(ex, st) || (ex.t === 'branch' && !wBranchReady(ex, st))) return;
  /* 1. timer: Check-triggered auto-pause FIRST (spec) */
  if (S.timer.state === 'RUNNING') Timer.set('PAUSED_AUTO_CHECK');
  /* 2. grade */
  st.locked = true;
  var g = GRADERS[ex.t](ex, st);
  var credit = scoreExercise(g.H, g.W, g.N);
  if (S.hintUsed[curKey()]) credit = Math.max(0, credit - 0.10);
  var k = curKey();
  S.answered[k] = true;
  S.credits[k] = credit;
  S.creditSum += credit; S.answeredCount++;
  renderFeedback(ex, g, credit);
  if (ex.t === 'term'){
    var ti = document.querySelector('#widgetslot input');
    if (ti) ti.disabled = true;
  }
  updateScore(); updateProgress(); renderExamBar();
  S.cur.feedbackOpen = true;
  $('#btncheck').disabled = true;
  var fb = $('#fbblk'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function optRow(label, status, clsOverride){
  var map = { correct: ['✓', 'Correct', 'st-correct'], wrong: ['✗', 'Wrong', 'st-wrong'], missed: ['○', 'Missed', 'st-missed'], info: ['ℹ', 'Note', 'st-info'] };
  var m = map[status] || map.info;
  var r = el('div', 'irow ' + (clsOverride || m[2]));
  r.innerHTML = '<span class="st" aria-label="' + m[1] + '"><span aria-hidden="true">' + m[0] + '</span><span class="word">' + m[1] + '</span></span><span>' + label + '</span>';
  return r;
}

function renderFeedback(ex, g, credit){
  var host = $('#exercisehost');
  var fb = el('div', 'blk feedback');
  fb.id = 'fbblk';
  var full = credit >= 0.999, zero = credit <= 0.001;
  var cls = full ? '' : (zero ? ' f-incorrect' : ' f-partial');
  fb.className = 'blk feedback' + cls;
  var label = full ? 'CORRECT' : (zero ? 'INCORRECT' : 'PARTIALLY CORRECT');
  var icon = full ? '✓' : (zero ? '✗' : '✓');
  var creditLine = 'credit ' + credit.toFixed(2) + ' — ' + g.H + '/' + g.N + ' items' +
    (S.hintUsed[curKey()] ? ' · includes −0.10 hint penalty' : '');
  fb.appendChild(el('h3', null, '<span aria-hidden="true">' + icon + '</span> ' + label +
    ' <span class="fb-credit">(' + esc(creditLine) + ')</span>'));
  var body = el('div', 'blk-body');
  if (g.dangerous && g.dangerous.length){
    var dw = el('div', 'irow st-wrong');
    dw.innerHTML = '<span class="st"><span aria-hidden="true">✗</span><span class="word">Dangerous — near miss</span></span><span>' + g.dangerous.map(esc).join(' ') + '</span>';
    body.appendChild(dw);
  }
  if (g.items && g.items.length){
    var rows = el('div', 'itemrows');
    g.items.forEach(function(it){ rows.appendChild(optRow(esc(it.label), it.status)); });
    body.appendChild(rows);
  }
  if (ex.t === 'term'){
    var cb = el('div', 'codeblock');
    cb.innerHTML = '<button class="btn small copybtn" type="button">Copy</button>' + esc(ex.canon);
    cb.querySelector('.copybtn').onclick = function(){
      try {
        var ta = document.createElement('textarea'); ta.value = ex.canon;
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        this.textContent = 'Copied ✓';
      } catch (e) { this.textContent = 'Select & copy manually'; }
    };
    body.appendChild(el('p', null, '<strong>Canonical query:</strong>'));
    body.appendChild(cb);
    if (ex.out){
      var ob = el('div', 'codeblock'); ob.textContent = ex.out;
      body.appendChild(el('p', null, '<strong>Output shape you would see:</strong>'));
      body.appendChild(ob);
    }
  }
  var xp = el('div');
  xp.innerHTML = ex.x;
  body.appendChild(xp);
  if (!full) body.appendChild(el('p', null, '<span class="small-note">📌 What to study: re-read the “' + esc(studyAnchor(ex)) + '” idea in the intro section “What you will learn here”, then retake later.</span>'));
  /* correct answer statement for single-answer types */
  if ((ex.t === 'qcm' || ex.t === 'log') && !full){
    var corr = ex.t === 'qcm' ? ex.opts.filter(function(o){ return o[1] === 1; }).map(function(o){ return o[0]; }).join(', ') : (ex.targetText || ('line ' + (ex.target + 1)));
    body.appendChild(el('p', null, '<strong>The correct answer:</strong> ' + esc(corr)));
  }
  /* nav buttons */
  var nav = el('div', 'startrow');
  var last = S.idx >= S.queue.length - 1;
  var nxt = el('button', 'btn primary', last ? '⏹ Finish exam' : 'Next ▶');
  nxt.id = 'btnnext';
  nxt.onclick = onNext;
  nav.appendChild(nxt);
  var autoNote = el('span', 'badge state-paused', '<span aria-hidden="true">⏸</span> Timer paused — reviewing feedback. It resumes when you press ' + (last ? 'Finish' : 'Next') + '.');
  nav.appendChild(autoNote);
  body.appendChild(nav);
  fb.appendChild(body);
  host.appendChild(fb);
}
function studyAnchor(ex){
  var map = { qcm: 'detection logic', qmul: 'detection logic', match: 'telemetry and log sources', drop: 'what the strategy watches',
    order: 'behaviour chain', rank: 'alert triage', fill: 'mutable elements', log: 'log sources', branch: 'alert triage', term: 'detection engineering' };
  return map[ex.t] || 'detection strategy';
}

function onNext(){
  Timer.resumeFromAuto();          /* PAUSED_AUTO_CHECK -> RUNNING (records duration) */
  /* advance to the next UNANSWERED exercise — after returning from the
     skipped pool, the next slot in the queue may already be answered */
  do { S.idx++; } while (S.idx < S.queue.length && S.answered[S.queue[S.idx].i]);
  if (S.idx >= S.queue.length){ openReviewSkipped(true); return; }
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onSkip(){
  if (S.answered[curKey()]) return;
  S.skipped[curKey()] = true;
  S.breakItems[curKey()] = true;
  if (S.idx >= S.queue.length - 1){ openReviewSkipped(true); return; }
  S.idx++;
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= REVIEW SKIPPED ================= */
function openReviewSkipped(fromFlow){
  Timer.resumeFromAuto();            /* never sit in the review pool while the auto-pause is active */
  if (S.cur) S.cur.feedbackOpen = false;
  var keys = Object.keys(S.skipped).filter(function(k){ return !S.answered[k]; });
  var host = $('#exercisehost');
  host.innerHTML = '';
  var blk = el('div', 'blk');
  blk.appendChild(el('h3', null, '<span aria-hidden="true">⚠</span> Review skipped exercises'));
  var body = el('div', 'blk-body');
  if (!keys.length){
    body.appendChild(el('p', null, 'No skipped exercises are waiting. You can submit your final results.'));
  } else {
    body.appendChild(el('p', null, 'These exercises were skipped without an answer. They are <strong>excluded from your score</strong> unless you answer them now. You can return to them as many times as you need while the timer is running.'));
    keys.forEach(function(k){
      var ex = EXERCISES[parseInt(k, 10)];
      var row = el('div', 'skipitem');
      row.innerHTML = '<span class="badge state-skipped"><span aria-hidden="true">⚠</span> Skipped</span><span class="sq">' + esc(ex.s.sum || ex.q) + '</span>';
      var canAnswer = S.timer.state !== 'ENDED';
      var btn = el('button', 'btn small primary', '↩ Answer this');
      btn.disabled = !canAnswer;
      btn.title = canAnswer ? 'Return to this exercise (timer keeps running)' : 'The timer has ended — this exercise stays excluded';
      btn.onclick = function(){
        S.idx = S.queue.findIndex(function(q){ return q.i === parseInt(k, 10); });
        delete S.skipped[k];
        Timer.resumeFromAuto();
        if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK' && S.timer.state !== 'ENDED') Timer.set('RUNNING');
        renderExercise();
        window.scrollTo({ top: 0 });
      };
      row.appendChild(btn);
      body.appendChild(row);
    });
  }
  var nav = el('div', 'startrow');
  var sub = el('button', 'btn primary', '⏹ Submit final results');
  sub.onclick = function(){ finalizeExam(false); };
  nav.appendChild(sub);
  var back = el('button', 'btn ghost', '◀ Back to exam');
  back.onclick = function(){
    if (S.timer.state === 'ENDED'){ finalizeExam(false); return; }
    var nextIdx = S.queue.findIndex(function(q){ return !S.answered[q.i]; });
    if (nextIdx === -1){ openReviewSkipped(true); return; }
    S.idx = nextIdx;
    renderExercise();
    window.scrollTo({ top: 0 });
  };
  nav.appendChild(back);
  body.appendChild(nav);
  blk.appendChild(body);
  host.appendChild(blk);
  window.scrollTo({ top: 0 });
  renderExamBar();
}

/* ================= RESULTS ================= */
function finalizeExam(auto){
  /* bank any open pause segment so both pause totals are complete */
  if (S.timer.state === 'PAUSED_MANUAL'){
    S.timer.manualTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  } else if (S.timer.state === 'PAUSED_AUTO_CHECK'){
    S.timer.autoTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  }
  Timer.stop();
  Timer.set('ENDED');
  /* never-answered exercises are excluded (skipped pool) */
  S.queue.forEach(function(q){ if (!S.answered[q.i]) S.skipped[q.i] = true; });
  var fully = 0, partial = 0, partialCredits = 0, incorrect = 0, skippedN = 0;
  Object.keys(S.answered).forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.999) fully++;
    else if (c > 0.001){ partial++; partialCredits += c; }
    else incorrect++;
  });
  Object.keys(S.skipped).forEach(function(k){ if (!S.answered[k]) skippedN++; });
  var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
  var passed = pct >= INTRO.passMark;
  var host = $('#view-results');
  host.innerHTML = '';
  var card = el('div', 'card intro-strip');
  card.appendChild(el('h2', null, esc(INTRO.objId) + ' — ' + esc(INTRO.sev) + ' exam results'));
  var panel = el('div', passed ? 'passpanel' : 'failpanel');
  panel.innerHTML = '<div class="t">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>' +
    '<div class="pct">' + pct + '%</div>' +
    '<p class="small-note">' + S.creditSum.toFixed(1) + ' credit points over ' + S.answeredCount + ' answered exercise' + (S.answeredCount === 1 ? '' : 's') +
    ' · pass mark ' + INTRO.passMark + '%' +
    (auto ? ' · time ran out — unanswered exercises were excluded' : '') + '</p>' +
    '<p>' + (passed
      ? 'Well done. You showed solid command of the ' + esc(INTRO.objId) + ' detection strategy at this level. Move on to the next severity when you feel ready.'
      : 'Not this time. Study the feedback you collected during the exam, then press Retake — the exercises will be shuffled.') + '</p>';
  card.appendChild(panel);
  var grid = el('div', 'resgrid');
  function rbox(num, lbl, cls){
    var b = el('div', 'resbox');
    b.innerHTML = '<div class="num">' + num + '</div><div class="lbl ' + (cls || '') + '">' + lbl + '</div>';
    return b;
  }
  grid.appendChild(rbox(fully, '<span aria-hidden="true">✓</span> Fully correct', 'state-correct'));
  grid.appendChild(rbox(partial + (partial ? ' <small>(avg ' + (partialCredits / partial).toFixed(2) + ')</small>' : ''), '<span aria-hidden="true">✓</span> Partially correct', 'state-partial'));
  grid.appendChild(rbox(incorrect, '<span aria-hidden="true">✗</span> Fully incorrect', 'state-incorrect'));
  grid.appendChild(rbox(skippedN + (skippedN ? ' <small>(excluded)</small>' : ''), '<span aria-hidden="true">⚠</span> Skipped — excluded', 'state-skipped'));
  card.appendChild(grid);
  card.appendChild(el('p', null, '<strong>Time</strong>: ' + fmtTime(TIMER_BUDGET - S.timer.remaining) + ' on the clock · ' +
    'paused ' + fmtTime(S.timer.manualTotal) + ' for manual breaks · paused ' + fmtTime(S.timer.autoTotal) + ' while reviewing feedback.'));
  var nav = el('div', 'startrow');
  var rt = el('button', 'btn primary', '↻ Retake exam');
  rt.onclick = retake;
  nav.appendChild(rt);
  card.appendChild(nav);
  host.appendChild(card);
  $('#view-exam').classList.add('hidden');
  $('#view-intro').classList.add('hidden');
  host.classList.remove('hidden');
  window.scrollTo({ top: 0 });
  reportScore(S.creditSum, S.answeredCount);
}

function retake(){
  S.queue = []; S.idx = 0; S.answered = {}; S.credits = {}; S.hintUsed = {}; S.skipped = {};
  S.creditSum = 0; S.answeredCount = 0; S.reported = false; S.cur = null;
  S.breakItems = {};
  S.timer.manualTotal = 0; S.timer.autoTotal = 0; S.timer.pauseStart = 0;
  $('#view-results').classList.add('hidden');
  $('#view-exam').classList.remove('hidden');
  startExam();
}

/* ================= SITE INTEGRATION ================= */
/* Receives the fractional sum and the answered count; rounding happens only
   here, once per attempt, and the on-screen percent uses the same formula. */
function reportScore(sum, count){
  if (S.reported) return;
  S.reported = true;
  var percent = count > 0 ? Math.round((sum / count) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: INTRO.topicId,
      batch: INTRO.batch,
      score: Math.round(sum),
      total: count,
      percent: percent,
      passed: percent >= INTRO.passMark
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user.username = event.data.username || '';
  S.user.country = event.data.country || '';
  S.user.locale = event.data.locale || '';
  S.user.topicId = event.data.topicId || '';
  S.user.batch = (typeof event.data.batch === 'number') ? event.data.batch : null;
  if (!$('#view-intro').classList.contains('hidden')) renderIntro();
});

/* ================= INTRO ================= */
function renderIntro(){
  var v = $('#view-intro');
  v.innerHTML = '';
  var strip = el('div', 'card intro-strip');
  strip.appendChild(el('h1', null, esc(INTRO.title)));
  strip.appendChild(el('p', 'objline', '<strong>' + esc(INTRO.objId) + ' — ' + esc(INTRO.objName) + '</strong> · MITRE ATT&CK ' + esc(INTRO.objType)));
  var row = el('div', 'badgerow');
  row.innerHTML =
    '<span class="badge sev"><span class="dot" aria-hidden="true"></span> ' + esc(INTRO.sev) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🧩</span> ' + INTRO.count + ' exercises</span>' +
    '<span class="badge"><span aria-hidden="true">⏱</span> Estimated time: ' + INTRO.minutes + ' min</span>' +
    '<span class="badge"><span aria-hidden="true">⏳</span> Timer budget: ' + fmtTime(INTRO.minutes * 60) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🎯</span> Pass mark: ' + INTRO.passMark + '%</span>' +
    (S.user.username ? '<span class="badge"><span aria-hidden="true">👤</span> ' + esc(S.user.username) + '</span>' : '');
  strip.appendChild(row);
  v.appendChild(strip);

  var learn = el('div', 'card');
  learn.appendChild(el('h2', null, 'What you will learn here'));
  INTRO.learn.forEach(function(p){
    var pe = el('p'); pe.innerHTML = p; learn.appendChild(pe);
  });
  v.appendChild(learn);

  var kw = el('div', 'card');
  kw.appendChild(el('h2', null, 'Keywords covered in this exam'));
  INTRO.keywords.forEach(function(th){
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var chips = el('div', 'chips');
    th.items.forEach(function(it){ chips.appendChild(el('span', 'kchip', esc(it))); });
    t.appendChild(chips);
    kw.appendChild(t);
  });
  v.appendChild(kw);

  var how = el('div', 'card');
  how.appendChild(el('h2', null, 'How this exam works'));
  var ul = el('ul', 'rules');
  INTRO.how.forEach(function(r){ var li = el('li'); li.innerHTML = r; ul.appendChild(li); });
  how.appendChild(ul);
  var startrow = el('div', 'startrow');
  var start = el('button', 'btn primary', '▶ Start the exam');
  start.id = 'btnstart';
  startrow.appendChild(start);
  startrow.appendChild(el('span', 'small-note', 'The exercises arrive in a random order. Good luck, analyst.'));
  how.appendChild(startrow);
  v.appendChild(how);
  start.onclick = function(){
    $('#view-intro').classList.add('hidden');
    $('#view-exam').classList.remove('hidden');
    startExam();
  };
}

/* ================= INIT ================= */
function startExam(){
  S.queue = shuffle(EXERCISES.map(function(ex, i){ return { i: i }; }));
  S.idx = 0;
  Timer.start();
  renderExercise();
}
renderIntro();

</script>
