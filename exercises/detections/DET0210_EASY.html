<script>
'use strict';
var EXAM = {"topicId": "det0210", "batch": 1, "difficulty": "easy", "passMark": 70, "minutes": 12, "attckId": "DET0210", "objectType": "detection-strategy", "objectLabel": "Detection Strategy", "title": "Abuse of Domain Accounts", "severityWord": "EASY", "intro": {"learn": ["DET0210 is a <b>Detection Strategy</b> object in MITRE ATT&amp;CK. A Detection Strategy describes how a security team can notice one attacker behavior. This strategy watches for <b>abuse of domain accounts</b>, which ATT&amp;CK tracks as technique T1078.002 (Domain Accounts).", "Attackers often steal or guess a real, valid username and password. Then they log in like a normal user. There is no malware to catch, so the defense is to notice <b>strange logon behavior</b>: the same account on many computers, logons at unusual hours, or sessions from two far-apart places at the same time.", "In this exam you will practice the real work around this detection. You will read simple Windows logon events (<code>4624</code>, <code>4625</code>, <code>4768</code>, <code>4769</code>) and Sysmon events. You will learn which platforms the strategy covers (Windows, Linux, macOS, and ESXi). You will see what a <b>false positive</b> is — normal work that looks suspicious. And you will learn how teams <b>tune</b> the detection with mutable elements so it stays useful."], "keywords": ["Detection Strategy", "T1078.002 Domain Accounts", "Valid Accounts", "EventCode 4624", "EventCode 4625", "EventCode 4768", "EventCode 4769", "Sysmon EventCode 1", "Sysmon EventCode 3", "WinEventLog:Security", "WinEventLog:Sysmon", "AN0590 (Windows)", "AN0593 (ESXi)", "vpxd.log", "false positive", "mutable element", "tuning"], "how": ["<b>Goal:</b> answer at least 70% correctly. That is the pass mark. You can earn part of the score on some exercises, so small mistakes still count for something.", "<b>Exercise types:</b> single choice (one correct answer), multi-select (several correct answers), and drag-and-drop (move items into the right boxes). For multi-select and drag-and-drop, correct picks add credit and wrong picks remove credit. The credit is the correct picks minus the wrong picks, divided by the number of correct items, and it never goes below zero.", "<b>Timer:</b> you have 12 minutes (12:00). The timer runs while you answer. When you press <b>Check</b>, the timer stops by itself (an auto-pause) while you read the feedback. Press <b>Next</b> and the timer runs again. You can also pause the timer yourself with the <b>Pause</b> button.", "<b>Hints:</b> every exercise has one hint. A hint costs 0.15 of the credit for that exercise.", "<b>Skipping:</b> you can skip an exercise with the Skip button. The timer keeps running. At the end you get a chance to review the skipped exercises. Skipped exercises that you never answer do not count in your score or your total.", "<b>Long scenarios:</b> some scenario boxes can be folded open and closed with a click on the SCENARIO title.", "At the end you will see your result, and the result is sent to the training platform."]}, "exercises": [{"kind": "single", "long": false, "scenario": "<p>Your team turns on MITRE ATT&amp;CK Detection Strategy DET0210. Its name is <b>Abuse of Domain Accounts</b>.</p>", "question": "What behavior does this detection strategy watch for?", "options": ["Attackers using real, valid domain account credentials in unusual ways", "A virus copying itself to every USB stick it finds", "A firewall rule that blocks all web traffic", "A printer that shares its configuration on the network"], "correct": [0], "explain": "<p><b>A is correct.</b> DET0210 watches logon behavior with valid domain accounts — for example the same account on many computers, logons at strange hours, or sessions from far-apart places at the same time.</p><p><b>B is wrong</b> because this strategy is not about malware spreading on USB sticks. <b>C is wrong</b> because it is not about firewall rules. <b>D is wrong</b> because printers are not part of this detection.</p>", "hint": "The name says it: abuse of <b>domain accounts</b>."}, {"kind": "single", "long": false, "scenario": "<p>The DET0210 page on the ATT&amp;CK website lists the technique it detects.</p>", "question": "Which ATT&amp;CK technique does DET0210 detect?", "options": ["T1078.002 — Domain Accounts", "T1078.001 — Default Accounts", "T1078.003 — Local Accounts", "T1078.004 — Cloud Accounts"], "correct": [0], "explain": "<p><b>A is correct.</b> DET0210 detects <b>T1078.002 — Domain Accounts</b>, a sub-technique of T1078 (Valid Accounts). Domain accounts are the identities that a company's Active Directory gives to employees — they work on many computers at once, so abusing one opens many doors.</p><p><b>B is wrong</b> because T1078.001 is Default Accounts — factory passwords that ship with devices. <b>C is wrong</b> because T1078.003 is Local Accounts — identities that live on one machine only. <b>D is wrong</b> because T1078.004 is Cloud Accounts — identities in cloud services. DET0210 is only about the domain kind.</p>", "hint": "It is the sub-technique with the number .002."}, {"kind": "single", "long": false, "scenario": "<p>A new analyst asks what kind of ATT&amp;CK object DET0210 is.</p>", "question": "What kind of ATT&amp;CK object is DET0210?", "options": ["A Detection Strategy", "A Technique", "A Group (a threat actor)", "A Mitigation"], "correct": [0], "explain": "<p><b>A is correct.</b> DET0210 is a <b>Detection Strategy</b> — a plan for how to notice one attacker behavior. It groups platform-specific analytics (AN0590 to AN0593) under one intent.</p><p><b>B is wrong</b> because T1078.002 is the technique; DET0210 detects it. <b>C is wrong</b> because groups are threat actors with IDs like G0016. <b>D is wrong</b> because mitigations are ways to prevent or stop a technique, with IDs like M10xx.</p>", "hint": "The object type is in the name: Detection Strategy."}, {"kind": "multi", "long": false, "scenario": "<p>AN0590 is the Windows analytic inside DET0210. It looks at Windows logon events and profiles normal behavior first.</p>", "question": "Which two logon patterns does the strategy look for? <b>Select 2.</b>", "options": ["The same valid account logging in on many computers in a short time", "Sessions from two far-apart places at the same time", "A user changing their own desktop wallpaper", "A user printing a document twice"], "correct": [0, 1], "explain": "<p><b>A and B are correct.</b> The strategy description names exactly these patterns: suspicious logon behavior across <b>multiple hosts</b>, and <b>simultaneous sessions from geographically distant locations</b> (a person cannot travel that fast).</p><p><b>C and D are wrong</b> because changing a wallpaper or printing documents is not logon behavior at all — this strategy only reads logon and related telemetry.</p>", "hint": "Think about <b>where</b> and <b>when</b> the logons happen, not what the user does on the screen."}, {"kind": "single", "long": false, "scenario": "<p>AN0590 reads the Windows Security log. Analysts see four event codes there again and again: <span class='tok-num'>4624</span>, <span class='tok-num'>4625</span>, <span class='tok-num'>4768</span>, and <span class='tok-num'>4769</span>.</p>", "question": "Which event code marks a <b>successful logon</b>?", "options": ["4624", "4625", "4768", "1102"], "correct": [0], "explain": "<p><b>A is correct.</b> Event <code>4624</code> is a successful logon in the Windows Security log.</p><p><b>B is wrong</b> because <code>4625</code> is a <b>failed</b> logon. <b>C is wrong</b> because <code>4768</code> is a Kerberos ticket request (a TGT request), not the logon itself. <b>D is wrong</b> because <code>1102</code> means the audit log was cleared — a different event with a very different meaning.</p>", "hint": "4625 fails, 4624 succeeds."}, {"kind": "single", "long": false, "scenario": "<p>The AN0590 analytic lists its log sources. Two Windows channels appear: <code>WinEventLog:Security</code> and <code>WinEventLog:Sysmon</code>.</p>", "question": "Which log channel carries events 4624, 4625, 4768 and 4769 for AN0590?", "options": ["WinEventLog:Security", "WinEventLog:Sysmon", "linux:syslog", "esxi:hostd"], "correct": [0], "explain": "<p><b>A is correct.</b> The Windows <b>Security</b> log carries the logon events 4624, 4625, 4768 and 4769.</p><p><b>B is wrong</b> because Sysmon carries process creation (EventCode 1) and network events (EventCode 3 and 22), not Windows logon events. <b>C and D are wrong</b> because linux:syslog and esxi:hostd belong to other platforms in this strategy.</p>", "hint": "Windows logon events live in the Security log."}, {"kind": "single", "long": false, "scenario": "<p>AN0590 also reads Sysmon telemetry. One of the Sysmon event codes it uses is <span class='tok-num'>EventCode=1</span>.</p>", "question": "In Sysmon, what does EventCode=1 mean?", "options": ["A new process was started", "A network connection was made", "A DNS name was asked for", "A driver was loaded"], "correct": [0], "explain": "<p><b>A is correct.</b> Sysmon EventCode <code>1</code> is <b>process creation</b> — it shows what program was started, and by which account.</p><p><b>B is wrong</b> because a network connection is Sysmon EventCode <code>3</code>. <b>C is wrong</b> because a DNS query is EventCode <code>22</code>. <b>D is wrong</b> because driver loading is a different Sysmon event (EventCode 6) that this analytic does not use.</p>", "hint": "Sysmon 1 watches programs as they start."}, {"kind": "single", "long": false, "scenario": "<p>DET0210 has four analytics: AN0590, AN0591, AN0592, and AN0593. Each one covers a different platform.</p>", "question": "Which platform does analytic AN0593 cover?", "options": ["VMware ESXi hosts", "Windows laptops", "macOS laptops", "Linux servers"], "correct": [0], "explain": "<p><b>A is correct.</b> AN0593 covers logins to <b>VMware ESXi / vSphere</b> hosts with domain accounts. This platform matters a lot: an attacker who reaches the hypervisor can touch every virtual machine on it.</p><p><b>B is wrong</b> because Windows is AN0590. <b>C is wrong</b> because macOS is AN0592. <b>D is wrong</b> because Linux is AN0591. Remember the order: Windows, Linux, macOS, ESXi.</p>", "hint": "AN0593 is the last of the four — the virtualization platform."}, {"kind": "single", "long": false, "scenario": "<p>For AN0593, the strategy lists ESXi log files as log sources. One of them is <span class='tok-path'>/var/log/vmware/vpxd.log</span>.</p>", "question": "Which log file shows domain logins on an ESXi host for AN0593?", "options": ["/var/log/vmware/vpxd.log", "/var/log/auth.log", "Security.evtx", "the macOS unified log"], "correct": [0], "explain": "<p><b>A is correct.</b> ESXi domain logins are recorded in <code>vpxd.log</code> (and <code>hostd.log</code>) on the ESXi host.</p><p><b>B is wrong</b> because <code>/var/log/auth.log</code> is a classic <b>Linux</b> log file, not ESXi. <b>C is wrong</b> because <code>Security.evtx</code> is the Windows Security log. <b>D is wrong</b> because the unified log belongs to macOS.</p>", "hint": "Look for the log path with vmware in it."}, {"kind": "single", "long": false, "scenario": "<p>An attacker steals the password of a domain admin. At 3 a.m. the attacker simply logs in with that valid account. No malware is installed.</p>", "question": "Does the attacker need malware for this login to work?", "options": ["No — a valid password lets them log in like any normal user", "Yes — they must infect the laptop first", "Yes — they must break the firewall first", "Only on weekends"], "correct": [0], "explain": "<p><b>A is correct.</b> With valid domain credentials the login works like any normal login. The system sees a real user with a real password. This is exactly why DET0210 exists: valid account abuse looks normal to antivirus and firewalls, so we must watch the <b>behavior</b> around the logons.</p><p><b>B is wrong</b> because no infection is needed to ategy, what is a mutable element?", "options": ["A field that your team can change (tune) to fit your environment", "A password that expires every month", "A log file that deletes itself after a week", "A hacker group that changes its name"], "correct": [0], "explain": "<p><b>A is correct.</b> A mutable element is a <b>tunable field</b> of the analytic. For example, TimeWindow controls which hours count as off-hours, and UserContext controls which accounts matter most. Your team sets these values to match your organization.</p><p><b>B is wrong</b> because password expiry is an account policy, not part of this analytic. <b>C is wrong</b> because log retention is a logging setting. <b>D is wrong</b> because hacker groups have nothing to do with mutable elements.</p>", "hint": "Mutable means changeable — the analytic asks you to set it."}, {"kind": "single", "long": false, "scenario": "<p>An alert says: j.harper logged in at 02:00. Checking the history, you see that j.harper is a backup operator who logs in every night at 02:00 from the same building, as part of the backup plan.</p>", "question": "What is the most likely judgment for this alert?", "options": ["Likely a false positive — this matches the normal work pattern of this account", "Certainly an attacker — any logon at 02:00 is an attack", "A printer error", "A Kerberos ticket problem"], "correct": [0], "explain": "<p><b>A is correct.</b> Off-hours alone is not proof. This account does the same thing every night from the same place, and the work is planned. That is the definition of a <b>false positive</b>: the alert fired, but the behavior is normal for this environment.</p><p><b>B is wrong</b> because the hour alone never proves an attack — context decides. <b>C and D are wrong</b> because printers and Kerberos have nothing to do with this logon pattern.</p>", "hint": "Same user, same time, same place, every night — is that new behavior?"}, {"kind": "single", "long": false, "scenario": "<p>After one week, the var HINT_PENALTY = 0.15;
var HANDSHAKE = null;
var S = null;
var lastTick = 0;
var nudgeTimer = null;

function freshState(){
  var exs = [];
  for (var i = 0; i < EXAM.exercises.length; i++){
    exs.push({ status:'pending', credit:0, raw:0, hints:0, hintShown:false, answered:false,
               selection:null, placement:{}, seq:[], activeChip:null,
               scnOpen:!EXAM.exercises[i].long, fromReview:false, feedbackItems:[] });
  }
  return { phase:'INTRO', idx:0, timeLeft: EXAM.minutes * 60, score:0, timeUp:false,
           pauseAcc:{ manual:0, autoCheck:0 }, pauseEnter:0, pauseUnder:null, pauseFrom:null,
           posted:false, final:null, exercises:exs };
}
function $(id){ return document.getElementById(id); }
function cur(){ return S.exercises[S.idx]; }
function curEx(){ return EXAM.exercises[S.idx]; }
function blocked(){ return S.phase !== 'RUNNING' && S.phase !== 'REVIEW'; }
function letter(i){ return 'ABCDEFGH'.charAt(i); }
function fmt(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60), r = s%60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function fmtDur(s){ s = Math.round(s); if (s < 60) return s + ' s';
  var m = Math.floor(s/60), r = s%60; return m + ' m ' + r + ' s'; }

/* ---------- timer: state machine with RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED ---------- */
setInterval(function(){
  var now = Date.now();
  if (lastTick && S){
    var dt = (now - lastTick) / 1000;
    if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
      S.timeLeft -= dt;
      if (S.timeLeft <= 0){ S.timeLeft = 0; lastTick = now; finishByTimeout(); return; }
    }
  }
  lastTick = now;
  if (S && S.phase !== 'INTRO') renderTimerChip();
}, 250);

function togglePause(){
  if (!S || S.phase === 'INTRO' || S.phase === 'ENDED') return;
  if (S.phase === 'PAUSED_MANUAL'){
    S.pauseAcc.manual += (Date.now() - S.pauseEnter) / 1000;
    S.phase = (S.pauseUnder === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : (S.pauseFrom || 'RUNNING');
    S.pauseUnder = null;
    S.pauseEnter = (S.phase === 'PAUSED_AUTO_CHECK') ? Date.now() : 0;
  } else if (S.phase === 'PAUSED_AUTO_CHECK'){
    S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
    S.pauseUnder = 'PAUSED_AUTO_CHECK';
    S.pauseEnter = Date.now();
    S.phase = 'PAUSED_MANUAL';
  } else {
    S.pauseEnter = Date.now();
    S.pauseUnder = null;
    S.pauseFrom = S.phase; /* RUNNING or REVIEW — Resume returns here */
    S.phase = 'PAUSED_MANUAL';
  }
  renderAll(false);
}

/* ---------- grading: partial credit max(0,(H-W)/N), hint penalty clamped at zero ---------- */
function hasAnswer(ex, s){
  if (ex.kind === 'single') return s.selection !== null && s.selection !== undefined;
  if (ex.kind === 'multi') return !!(s.selection && s.selection.length > 0);
  if (ex.kind === 'drag'){ for (var k in s.placement){ if (s.placement[k] !== null && s.placement[k] !== undefined) return true; } return false; }
  if (ex.kind === 'order') return s.seq.length === ex.correctOrder.length;
  return false;
}

function grade(s, ex){
  var items = [], raw = 0, N, H, W, i, isC, picked;
  if (ex.kind === 'single'){
    raw = (s.selection === ex.correct[0]) ? 1 : 0;
    for (i = 0; i < ex.options.length; i++){
      if (i === s.selection) items.push({ state: raw ? 'correct' : 'wrong', text: letter(i) + ' — ' + ex.options[i] });
      else if (i === ex.correct[0] && !raw) items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] });
    }
  } else if (ex.kind === 'multi'){
    N = ex.correct.length; H = 0; W = 0;
    for (i = 0; i < ex.options.length; i++){
      picked = s.selection.indexOf(i) >= 0; isC = ex.correct.indexOf(i) >= 0;
      if (picked && isC){ H++; items.push({ state:'correct', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (picked && !isC){ W++; items.push({ state:'wrong', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (!picked && isC){ items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'drag'){
    N = ex.solution.length; H = 0; W = 0;
    for (i = 0; i < N; i++){
      var at = s.placement[i];
      if (at === ex.solution[i]){ H++; items.push({ state:'correct', text: ex.bank[i] + ' → ' + ex.zones[at] }); }
      else if (at === null || at === undefined){ items.push({ state:'missed', text: ex.bank[i] + ' — correct box: ' + ex.zones[ex.solution[i]] + ' (you did not place it)' }); }
      else { W++; items.push({ state:'wrong', text: ex.bank[i] + ' — you put it in ' + ex.zones[at] + ', correct is ' + ex.zones[ex.solution[i]] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'order'){
    N = ex.correctOrder.length; H = 0; W = 0;
    for (var pos = 0; pos < N; pos++){
      var got = s.seq[pos], want = ex.correctOrder[pos];
      if (got === want){ H++; items.push({ state:'correct', text: 'Position ' + (pos+1) + ': ' + ex.items[got] }); }
      else if (got === null || got === undefined){ items.push({ state:'missed', text: 'Position ' + (pos+1) + ' — correct: ' + ex.items[want] }); }
      else { W++; items.push({ state:'wrong', text: 'Position ' + (pos+1) + ': you put ' + ex.items[got] + ', correct is ' + ex.items[want] }); }
    }
    raw = Math.max(0, (H - W) / N);
  }
  s.raw = raw;
  s.credit = Math.max(0, raw - s.hints * HINT_PENALTY);
  s.answered = true;
  s.status = 'answered';
  s.feedbackItems = items;
  S.score += s.credit; /* float accumulator */
}

/* ---------- flow: Check / Next / Skip / Hint / review / finish ---------- */
function onCheck(){
  if (!S || blocked()) return;
  var s = cur(), ex = curEx();
  if (s.answered) return;
  if (!hasAnswer(ex, s)){ nudge('Select an answer first.'); return; }
  S.phase = 'PAUSED_AUTO_CHECK'; /* auto-pause happens BEFORE feedback is rendered */
  S.pauseEnter = Date.now();
  grade(s, ex);
  renderAll(false);
}
function onNext(){
  if (!S || S.phase !== 'PAUSED_AUTO_CHECK') return;
  S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
  S.pauseEnter = 0;
  S.phase = 'RUNNING'; /* Next restarts the timer */
  advance();
}
function advance(){
  var s = cur();
  if (s && s.fromReview){ s.fromReview = false; S.phase = 'REVIEW'; renderAll(true); return; }
  S.idx++;
  if (S.idx < S.exercises.length) renderAll(true);
  else startReviewOrFinish();
}
function startReviewOrFinish(){
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered'){ startReview(); return; }
  }
  finish();
}
function startReview(){ S.phase = 'REVIEW'; renderAll(true); }
function onSkip(){
  if (!S || blocked()) return;
  var s = cur();
  if (s.answered) return;
  s.status = 'skipped'; /* Skip never pauses the timer */
  advance();
}
function onHint(){
  if (!S || blocked()) return;
  var s = cur();
  if (!s || s.answered || s.hintShown) return;
  s.hintShown = true;
  s.hints = 1; /* Hint never pauses the timer */
  renderAll(false);
}
function reviewAnswer(i){
  if (!S || S.phase !== 'REVIEW') return;
  S.idx = i;
  S.exercises[i].fromReview = true;
  S.phase = 'RUNNING';
  renderAll(true);
}
function finishByTimeout(){
  if (!S || S.phase === 'ENDED') return;
  S.timeUp = true;
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') S.exercises[i].status = 'skipped';
  }
  finish();
}
function finish(){
  if (!S || S.phase === 'ENDED') return;
  S.phase = 'ENDED';
  var answered = 0, fullC = 0, partC = 0, partSum = 0, zeroC = 0, skipped = 0;
  for (var i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i];
    if (s.status === 'answered'){
      answered++;
      if (s.credit >= 0.999) fullC++;
      else if (s.credit > 0.0001){ partC++; partSum += s.credit; }
      else zeroC++;
    } else skipped++;
  }
  var scoreInt = Math.round(S.score);
  var percent = answered > 0 ? Math.round(scoreInt * 100 / answered) : 0;
  S.final = { scoreInt: scoreInt, total: answered, percent: percent, passed: percent >= EXAM.passMark,
              fullC: fullC, partC: partC, partAvg: partC ? (partSum / partC) : 0,
              zeroC: zeroC, skipped: skipped };
  renderAll(true);
  animateScore();
  var stateRef = S; /* snapshot: a retake must never hijack this report */
  setTimeout(function(){ postReport(stateRef); }, 1400); /* post once, after the score animation has settled */
}
function animateScore(){
  var el = $('score-big'); if (!el) return;
  var t0 = null, dur = 900;
  function step(ts){
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    el.textContent = String(Math.round(S.final.scoreInt * p));
    var bar = $('score-bar');
    if (bar) bar.style.width = (S.final.percent * p) + '%';
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function postReport(sRef){
  var st = sRef || S;
  if (!st || st.posted || !st.final) return;
  st.posted = true;
  var f = st.final;
  var payload = { type:'CYBERPULSE_SCORE', topicId: EXAM.topicId, batch: EXAM.batch,
                  difficulty: EXAM.difficulty, attckId: EXAM.attckId, objectType: EXAM.objectType,
                  score: f.scoreInt, total: f.total, percent: f.percent, passed: f.passed,
                  passMark: EXAM.passMark,
                  timeSpentSec: Math.round(EXAM.minutes * 60 - Math.max(0, st.timeLeft)),
                  pauseSec: { manual: Math.round(st.pauseAcc.manual), autoCheck: Math.round(st.pauseAcc.autoCheck) } };
  try {
    var target = (window.parent && window.parent !== window) ? window.parent : window;
    target.postMessage(payload, window.location.origin);
  } catch (e) { /* reporting must never break the exam */ }
  var note = $('post-note');
  if (note) note.textContent = '✓ Result reported to the training platform.';
}
function retake(){
  S = freshState(); /* new attempt: the score report may be posted again, once */
  renderAll(true);
  window.scrollTo(0, 0);
}
function startExam(){
  if (!S) return;
  S.phase = 'RUNNING';
  S.pauseEnter = 0;
  lastTick = Date.now();
  renderAll(true);
  window.scrollTo(0, 0);
}

/* ---------- answer interactions (no auto-pause on any intermediate confirmation) ---------- */
function pick(i){ if (!S || blocked()) return; var s = cur(); if (s.answered) return; s.selection = i; renderBody(false); }
function toggleMulti(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (!s.selection) s.selection = [];
  var p = s.selection.indexOf(i);
  if (p >= 0) s.selection.splice(p, 1); else s.selection.push(i);
  renderBody(false);
}
function chipClick(ii){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var placed = s.placement[ii];
  if (placed !== null && placed !== undefined){ delete s.placement[ii]; s.activeChip = null; }
  else s.activeChip = (s.activeChip === ii) ? null : ii;
  renderBody(false);
}
function zoneClick(zi){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.activeChip === null || s.activeChip === undefined){ nudge('Pick an item first, then choose a box.'); return; }
  s.placement[s.activeChip] = zi;
  s.activeChip = null;
  renderBody(false);
}
function dragStart(ev, ii){
  var s = cur();
  if (!S || s.answered){ if (ev) ev.preventDefault(); return; }
  s.activeChip = ii;
  try { ev.dataTransfer.setData('text/plain', String(ii)); } catch (e) {}
}
function dropPlace(ev, zi){
  ev.preventDefault();
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var ii = parseInt(ev.dataTransfer.getData('text/plain'), 10);
  if (isNaN(ii)) ii = s.activeChip;
  if (ii === null || ii === undefined || isNaN(ii)) return;
  s.placement[ii] = zi;
  s.activeChip = null;
  renderBody(false);
}
function zoneClear(ev, zi){
  if (ev && ev.stopPropagation) ev.stopPropagation(); /* do not bubble into the zone click */
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  for (var k in s.placement){ if (s.placement[k] === zi) delete s.placement[k]; }
  renderBody(false);
}
function seqAdd(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.seq.indexOf(i) >= 0) return;
  s.seq.push(i);
  renderBody(false);
}
function seqRemove(pos){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  s.seq.splice(pos, 1);
  renderBody(false);
}
function scnToggle(open){ if (S && cur()) cur().scnOpen = open; }
function nudge(msg){
  var t = $('toast'); if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(function(){ t.className = 'toast'; }, 1800);
}

/* ---------- rendering ---------- */
function renderAll(top){ renderHeader(); renderBody(top); }
function renderBody(top){
  var y = top ? 0 : (window.scrollY || 0);
  var m = $('main'); if (!m) return;
  if (S.phase === 'INTRO') m.innerHTML = introHTML();
  else if (S.phase === 'RUNNING' || S.phase === 'PAUSED_MANUAL' || S.phase === 'PAUSED_AUTO_CHECK') m.innerHTML = exerciseHTML();
  else if (S.phase === 'REVIEW') m.innerHTML = reviewHTML();
  else m.innerHTML = resultsHTML();
  window.scrollTo(0, y);
}
function renderTimerChip(){
  var el = $('hd-timer'); if (!el) return;
  var cls = 'chip chip-time', txt = '';
  if (S.phase === 'INTRO'){ txt = '⏱ Ready · ' + fmt(S.timeLeft); }
  else if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
    var low = S.timeLeft <= EXAM.minutes * 60 * 0.2;
    txt = (low ? '⚠ ' : '▶ ') + 'Running · ' + fmt(S.timeLeft);
    if (low) cls += ' chip-low';
  }
  else if (S.phase === 'PAUSED_MANUAL'){ txt = '⏸ Paused · ' + fmt(S.timeLeft); cls += ' chip-paused'; }
  else if (S.phase === 'PAUSED_AUTO_CHECK'){ txt = '⏳ Checking · ' + fmt(S.timeLeft); cls += ' chip-checking'; }
  else { txt = '⏹ Ended · ' + fmt(S.timeLeft); cls += ' chip-ended'; }
  el.className = cls;
  el.textContent = txt;
}
function renderHeader(){
  var N = S.exercises.length;
  var cnt = $('hd-counter');
  if (S.phase === 'INTRO') cnt.textContent = 'Ready';
  else if (S.phase === 'ENDED') cnt.textContent = 'Completed';
  else cnt.textContent = 'Exercise ' + (S.idx + 1) + ' / ' + N;
  $('hd-score').textContent = 'Score ' + S.score.toFixed(2);
  var canAct = !blocked();
  var s = (S.phase === 'ENDED' || S.phase === 'INTRO') ? null : cur();
  var hb = $('btn-hint'), sb = $('btn-skip'), pb = $('btn-pause');
  hb.disabled = !(canAct && s && !s.answered && !s.hintShown);
  sb.disabled = !(canAct && s && !s.answered);
  pb.disabled = (S.phase === 'INTRO' || S.phase === 'ENDED');
  pb.textContent = (S.phase === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  renderTimerChip();
}

function introHTML(){
  var I = EXAM.intro, h = '', i;
  h += '<section class="hero">'
    + '<div class="hero-kicker">MITRE ATT&amp;CK · ' + EXAM.objectLabel + ' · ' + EXAM.attckId + '</div>'
    + '<h1>' + EXAM.title + ' — Knowledge Exam</h1>'
    + '<div class="hero-chips">'
    + '<span class="chip">' + EXAM.exercises.length + ' exercises</span>'
    + '<span class="badge badge-' + EXAM.difficulty + '">' + EXAM.severityWord + '</span>'
    + '<span class="chip">Estimated time: ' + EXAM.minutes + ' min</span>'
    + '<span class="chip">Timer budget: ' + fmt(EXAM.minutes * 60) + '</span>'
    + '<span class="chip">Pass mark: ' + EXAM.passMark + '%</span>'
    + '</div></section>';
  h += '<section class="intro-sec"><h2>What you will learn here</h2>';
  for (i = 0; i < I.learn.length; i++) h += '<p>' + I.learn[i] + '</p>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Keywords covered in this exam</h2><div class="kw-chips">';
  for (i = 0; i < I.keywords.length; i++) h += '<span class="kw">' + I.keywords[i] + '</span>';
  h += '</div></section>';
  h += '<section class="intro-sec"><h2>How this exam works</h2><ol class="how-list">';
  for (i = 0; i < I.how.length; i++) h += '<li>' + I.how[i] + '</li>';
  h += '</ol><div class="start-wrap"><button class="btn btn-primary btn-start" onclick="startExam()">▶ Start the exam</button></div></section>';
  return h;
}

function answerHTML(s, ex){
  var h = '', i;
  if (ex.kind === 'single' || ex.kind === 'multi'){
    if (ex.kind === 'multi') h += '<div class="multi-note">Select all that apply — ' + ex.correct.length + ' options are correct. Correct picks add credit, wrong picks remove credit.</div>';
    h += '<div class="options">';
    for (i = 0; i < ex.options.length; i++){
      var sel = (ex.kind === 'single') ? (s.selection === i) : !!(s.selection && s.selection.indexOf(i) >= 0);
      h += '<button type="button" class="opt' + (sel ? ' opt-sel' : '') + '" onclick="' + (ex.kind === 'single' ? 'pick(' : 'toggleMulti(') + i + ')">'
        + (ex.kind === 'multi' ? '<span class="opt-box">' + (sel ? '✓' : '') + '</span>' : '')
        + '<span class="opt-key">' + letter(i) + '</span><span class="opt-text">' + ex.options[i] + '</span></button>';
    }
    h += '</div>';
  } else if (ex.kind === 'drag'){
    h += '<div class="multi-note">Pick an item, then pick a box. You can also drag the items. Items you never place score as missed.</div>';
    h += '<div class="dz-layout"><div class="bank">';
    for (i = 0; i < ex.bank.length; i++){
      if (s.placement[i] === null || s.placement[i] === undefined){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" draggable="true" ondragstart="dragStart(event,' + i + ')" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
      }
    }
    h += '</div><div class="zones">';
    for (var z = 0; z < ex.zones.length; z++){
      h += '<div class="dz' + (s.activeChip !== null && s.activeChip !== undefined ? ' dz-armed' : '') + '" onclick="zoneClick(' + z + ')" ondragover="event.preventDefault()" ondrop="dropPlace(event,' + z + ')">'
        + '<div class="dz-head"><span>' + ex.zones[z] + '</span><button type="button" class="dz-clear" onclick="zoneClear(event,' + z + ')">clear</button></div>';
      for (i = 0; i < ex.bank.length; i++){
        if (s.placement[i] === z){
          h += '<button type="button" class="chipd" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
        }
      }
      h += '</div>';
    }
    h += '</div></div>';
  } else if (ex.kind === 'order'){
    h += '<div class="multi-note">Tap the items in the correct order, first to last. Tap an item in your sequence to remove it again.</div>';
    h += '<div class="seq-layout"><div class="bank">';
    for (i = 0; i < ex.items.length; i++){
      if (s.seq.indexOf(i) < 0){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" onclick="seqAdd(' + i + ')">' + ex.items[i] + '</button>';
      }
    }
    h += '</div><div class="seq"><div class="block-label lbl-neutral">YOUR ORDER</div>';
    for (var p = 0; p < ex.items.length; p++){
      if (p < s.seq.length){
        h += '<button type="button" class="seq-item" onclick="seqRemove(' + p + ')"><span class="seq-num">' + (p + 1) + '</span><span>' + ex.items[s.seq[p]] + '</span></button>';
      } else {
        h += '<div class="seq-slot">Position ' + (p + 1) + ' — not filled yet</div>';
      }
    }
    h += '</div></div>';
  }
  return h;
}

function exerciseHTML(){
  var s = cur(), ex = curEx(), h = '';
  if (S.phase === 'PAUSED_MANUAL') h += '<div class="banner banner-pause">⏸ Paused — the timer is stopped. Press the Pause button again (▶ Resume) to continue.</div>';
  if (S.phase === 'PAUSED_AUTO_CHECK') h += '<div class="banner banner-check">⏳ Checking — the timer is stopped while you read this feedback. Press Next to continue.</div>';
  h += '<section class="block block-scenario"><details class="scn"' + (s.scnOpen ? ' open' : '') + ' ontoggle="scnToggle(this.open)">'
    + '<summary><span class="block-label lbl-blue">SCENARIO</span><span class="scn-hint">click to open or close</span></summary>'
    + '<div class="scn-body">' + ex.scenario + '</div></details></section>';
  h += '<section class="block block-question"><div class="block-label lbl-amber">QUESTION</div><div class="q-text">' + ex.question + '</div></section>';
  h += '<section class="block block-answer"><div class="block-label lbl-green">YOUR ANSWER</div>' + answerHTML(s, ex) + '</section>';
  if (s.hintShown && !s.answered){
    h += '<div class="hintbox"><span class="hint-tag">HINT · COSTS 0.15 CREDIT</span><br>' + ex.hint + '</div>';
  }
  h += '<div class="actions">';
  if (!s.answered){
    h += '<button class="btn btn-primary"' + (blocked() ? ' disabled' : '') + ' onclick="onCheck()">Check</button>';
  } else {
    var last = (S.idx === S.exercises.length - 1);
    h += '<button class="btn btn-primary"' + (S.phase === 'PAUSED_MANUAL' ? ' disabled' : '') + ' onclick="onNext()">'
      + (s.fromReview ? '↩ Back to review' : (last ? 'Final Submit ▸' : 'Next ▸')) + '</button>';
  }
  h += '</div>';
  if (s.answered) h += feedbackHTML(s, ex);
  return h;
}

function feedbackHTML(s, ex){
  var good = s.credit >= 0.999, zero = s.credit <= 0.0001;
  var cls = good ? 'fb-good' : (zero ? 'fb-bad' : 'fb-part');
  var chip = good ? '<span class="statechip st-correct">✓ Correct</span>'
    : (zero ? '<span class="statechip st-wrong">✗ Incorrect</span>'
    : '<span class="statechip st-part">✓ Partially correct</span>');
  var h = '<section class="feedback ' + cls + '"><div class="fb-head">' + chip
    + '<span class="fb-credit">Credit ' + s.credit.toFixed(2) + ' / 1.00</span>'
    + (s.hints ? '<span class="fb-penalty">includes −' + (s.hints * HINT_PENALTY).toFixed(2) + ' hint penalty</span>' : '')
    + '</div>';
  if (s.feedbackItems.length){
    h += '<ul class="fb-items">';
    for (var i = 0; i < s.feedbackItems.length; i++){
      var it = s.feedbackItems[i];
      var mark = it.state === 'correct' ? '✓ Correct' : (it.state === 'wrong' ? '✗ Wrong' : '○ Missed');
      h += '<li class="it-' + it.state + '"><span class="it-mark">' + mark + '</span><span class="it-text">' + it.text + '</span></li>';
    }
    h += '</ul>';
  }
  h += '<div class="fb-explain"><div class="block-label lbl-neutral">WHY</div>' + ex.explain + '</div></section>';
  return h;
}

function reviewHTML(){
  var h = '', pend = [], i;
  for (i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') pend.push(i);
  }
  h += '<section class="intro-sec"><h2>⚠ Review skipped exercises</h2>'
    + '<p>You have ' + pend.length + ' exercise' + (pend.length === 1 ? '' : 's') + ' without an answer. You can answer ' + (pend.length === 1 ? 'it' : 'them') + ' now — the timer keeps running. Anything you never answer will not count in your score or your total.</p></section>';
  for (i = 0; i < pend.length; i++){
    h += '<div class="rev-row"><span class="rev-num">Exercise ' + (pend[i] + 1) + '</span>'
      + '<button class="btn" onclick="reviewAnswer(' + pend[i] + ')">Answer now</button></div>';
  }
  h += '<div class="actions"><button class="btn btn-primary" onclick="finish()">Finish &amp; see results ▸</button></div>';
  return h;
}

function resultsHTML(){
  var f = S.final, h = '', i;
  h += '<section class="intro-sec"><div class="fb-head">'
    + '<span class="statechip st-end">⏹ Exam complete</span>'
    + (S.timeUp ? '<span class="statechip st-wrong">⚠ Time ran out</span>' : '')
    + (f.passed ? '<span class="statechip st-correct">✓ Passed</span>' : '<span class="statechip st-wrong">✗ Not passed</span>')
    + '</div>';
  h += '<div class="score-wrap"><div class="score-big" id="score-big">0</div>'
    + '<div class="score-of">points / ' + f.total + ' answered</div>'
    + '<div class="bar"><div class="bar-fill" id="score-bar" style="width:0%"></div></div>'
    + '<div class="score-pct"><span>' + f.percent + '%</span>'
    + '<span class="pass-note">Pass mark ' + EXAM.passMark + '% · final percent uses the same rounded score</span></div></div>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Result breakdown</h2>'
    + '<div class="cat-row cat-good"><span>✓ Fully correct</span><span class="cat-n">' + f.fullC + '</span></div>'
    + '<div class="cat-row cat-part"><span>✓ Partially correct — average partial credit ' + f.partAvg.toFixed(2) + '</span><span class="cat-n">' + f.partC + '</span></div>'
    + '<div class="cat-row cat-bad"><span>✗ Fully incorrect</span><span class="cat-n">' + f.zeroC + '</span></div>'
    + '<div class="cat-row cat-skip"><span>⚠ Skipped and never answered — excluded from score and total</span><span class="cat-n">' + f.skipped + '</span></div>'
    + '<div class="pause-log">⏸ Time paused manually: ' + fmtDur(S.pauseAcc.manual) + '</div>'
    + '<div class="pause-log">⏳ Time paused while checking: ' + fmtDur(S.pauseAcc.autoCheck) + '</div>'
    + '<div class="pause-log">Time used: ' + fmt(EXAM.minutes * 60 - Math.max(0, S.timeLeft)) + ' of the ' + fmt(EXAM.minutes * 60) + ' budget</div>'
    + '</section>';
  h += '<section class="intro-sec"><h2>Every exercise</h2><div class="sum-list">';
  for (i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i], word;
    if (s.status === 'answered'){
      if (s.credit >= 0.999) word = '<span class="it-correct" style="color:var(--correct)">✓ Correct</span>';
      else if (s.credit > 0.0001) word = '<span style="color:var(--warn)">✓ Partially correct</span>';
      else word = '<span style="color:var(--wrong)">✗ Incorrect</span>';
    } else word = '<span style="color:var(--warn)">⚠ Skipped</span>';
    h += '<div class="sum-row"><span>Exercise ' + (i + 1) + '</span><span>' + word + ' · ' + (s.status === 'answered' ? s.credit.toFixed(2) : '0.00') + ' credit</span></div>';
  }
  h += '</div></section>';
  h += '<div class="actions"><button class="btn btn-primary" onclick="retake()">↺ Retake the exam</button></div>';
  h += '<div id="post-note" class="post-note"></div>';
  return h;
}

/* ---------- handshake: accept CYBERPULSE_INIT and CYBERMASTERY_INIT; theme field is ignored (dark only) ---------- */
window.addEventListener('message', function(ev){
  try {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT'){ HANDSHAKE = d; }
  } catch (e) { /* a broken handshake must not break the exam */ }
});

function initExam(){
  S = freshState();
  renderAll(true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initExam);
else initExam();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
