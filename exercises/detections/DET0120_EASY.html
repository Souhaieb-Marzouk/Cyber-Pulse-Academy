<script>window.__EXAM__={"intro":{"title":"DET0120 — EASY practice exam","idname":"DET0120 — Account Access Removal via Multi-Platform Audit Correlation (detects T1531 — Account Access Removal)","learn":["Welcome! This exam is about one MITRE ATT&amp;CK object: the <b>detection strategy DET0120<\/b>. A detection strategy is a plan that tells defenders <i>what to watch<\/i> so they can see an attacker’s move. DET0120 watches for <b>Account Access Removal<\/b>, the technique with ID <b>T1531<\/b>. That technique means an attacker deletes, locks, or changes accounts so real users cannot log in any more. It belongs to the <b>Impact<\/b> tactic, and its harm type is <b>Availability<\/b> — it breaks access instead of stealing data.","DET0120 is special because it does not watch only one system. It bundles <b>six small rules, called analytics<\/b>, one for each platform: <b>Windows (AN0334), Linux (AN0335), macOS (AN0336), ESXi servers (AN0337), Microsoft 365 (AN0338), and SaaS apps like Okta (AN0339)<\/b>. Each analytic reads the logs of its platform. A log is a line of text that a computer writes about what happened. When the right lines appear together, an alert is raised.","You will meet this object in many real jobs. A <b>SOC analyst<\/b> (the person watching alerts) triages these alerts during a shift. A <b>detection engineer<\/b> builds and tunes the rules in a SIEM — the big tool that collects logs. A <b>threat hunter<\/b> searches the logs for attacks that no rule caught. An <b>incident responder<\/b> uses these alerts during an attack. A <b>CTI analyst<\/b> reports that groups like <b>Akira<\/b> delete admin accounts right before they launch ransomware. The risk this object covers is simple and serious: if an attacker removes your accounts, your team cannot log in to stop them.","Every exercise here has one small idea, short sentences, and a hint if you need one. Look at the artefact, read the question, and pick the answer. By the end you will know what DET0120 is, which analytic watches which platform, and which log lines matter."],"themes":[{"name":"The detection strategy and its technique","items":["<b>DET0120<\/b> — a detection strategy in the ATT&amp;CK Enterprise domain","<b>T1531 Account Access Removal<\/b> — delete, lock, or change credentials to block access","<b>Impact tactic<\/b> and <b>Availability<\/b> impact type","No sub-techniques; platforms: Windows, Linux, macOS, ESXi, Office Suite, SaaS"]},{"name":"The six analytics and their platforms","items":["<b>AN0334<\/b> Windows · <b>AN0335<\/b> Linux · <b>AN0336<\/b> macOS","<b>AN0337<\/b> ESXi · <b>AN0338<\/b> Office Suite (M365) · <b>AN0339<\/b> SaaS (Okta)"]},{"name":"Log sources and data components","items":["<b>DC0010<\/b> User Account Modification, <b>DC0032<\/b> Process Creation","<b>WinEventLog:Security<\/b> event codes <b>4723 / 4724 / 4740<\/b>","<b>userdel<\/b> on Linux, <b>dscl<\/b> on macOS, <b>esxcli<\/b> on ESXi","Okta lifecycle events like <b>user.lifecycle.deactivate<\/b>","<b>DC0009<\/b>, <b>DC0002<\/b>, <b>DC0064<\/b> — the other data components used"]},{"name":"Tuning words and SOC work","items":["<b>Mutable element<\/b> — a part of an analytic you can tune (like a time window)","Benign vs suspicious — the first skill of alert triage","How an Account Access Removal attack looks on a timeline (Akira-style)"]}],"how":["<b>Passing score.<\/b> You pass with <b>70% or more<\/b>. A PASS means you know the foundations of DET0120. A FAIL means you should read the explanations again and retake the exam.","<b>Exercises.<\/b> This file has <b>15 short exercises<\/b>. Each one tests exactly one idea. You will see multiple choice, matching, drag and drop, fill-in-the-blank, timeline ordering, and simple triage.","<b>Timer.<\/b> You have <b>25 minutes<\/b>. The timer runs while you answer. Press <b>Pause<\/b> for a real break — the exercise hides and the timer stops until you press Resume. When you press <b>Check<\/b>, the timer also stops so you can read the feedback with no pressure; it starts again only when you press <b>Next<\/b>.","<b>Partial credit.<\/b> Some exercises have more than one item (for example four log lines to judge). Each correct item scores its share, and a wrong item takes its share away. The formula is (correct − wrong) ÷ total, so selecting everything to be safe gives zero.","<b>Hints and skipping.<\/b> You can open <b>one hint<\/b> per exercise; it costs 10% of that exercise’s credit. You can <b>Skip<\/b> any exercise at any time — skipped exercises go to a review pool, and you can return to them while the timer runs. Anything you never answer is simply excluded from the score."],"types":["Multiple choice (single answer)","Drag & drop","Fill-in-the-blank","Select-all (partial credit)","Matching pairs","Timeline ordering","Scenario triage"]},"ex":[{"id":"e01","type":"qcm","title":"Object type of DET0120","sc":[{"label":"ATT&CK page header","text":"You open the ATT&amp;CK page for <b>DET0120 — Account Access Removal via Multi-Platform Audit Correlation<\/b>. The page groups six analytics (AN0334 to AN0339) under one entry."}],"q":"In MITRE ATT&amp;CK, what kind of object is DET0120?","options":[{"t":"A Group — a profile of a threat actor","why":"A Group (like G0007) profiles an adversary. DET0120 does not profile anyone; it tells defenders what to watch."},{"t":"A Detection Strategy — a plan for detecting one technique","why":"Correct. DET0120 collects six analytics whose job is to detect technique T1531."},{"t":"A Mitigation — a control that blocks an attack","why":"A Mitigation prevents an attack. DET0120 only detects it after it happens."},{"t":"A Tactic — the goal of an attack phase","why":"A Tactic is an attacker goal, like Impact. DET0120 is a defensive object, not an attacker goal."}],"answer":1,"hint":"The name of the object type is written in the page header: it starts with “Detection”.","explain":"DET0120 is a <b>Detection Strategy<\/b>. In ATT&amp;CK, a detection strategy bundles one or more analytics (concrete detection rules) that together watch for one technique. Here the six analytics all watch for T1531 Account Access Removal on different platforms. Detection strategies sit in the “Defenses” side of ATT&amp;CK — they are built by detection engineers and consumed by SOC analysts, which is why you will meet them in SIEM work, alert triage, and threat-hunting notes.","study":"ATT&amp;CK object types: Technique, Tactic, Mitigation, Group, and Detection Strategy — and what each one is for."},{"id":"e02","type":"qcm","title":"What T1531 does","sc":[{"label":"Ticket #2210 — from the service desk","text":"“This morning three users called: they could not log in. We checked: their accounts still exist, but the passwords were changed overnight. Nobody on our team changed them.”"}],"q":"A password change nobody requested is one behaviour of technique T1531. What does T1531 call this behaviour?","options":[{"t":"Account Access Removal — access to accounts is taken away","why":"Correct. Changing credentials, deleting, or locking accounts all remove access for real users — that is T1531."},{"t":"Data Encrypted for Impact — files are locked","why":"Encryption locks files, not logins. T1486 is a different Impact technique."},{"t":"Valid Accounts — using accounts that exist","why":"Valid Accounts (T1078) is about logging in with someone’s account. T1531 is about breaking access to accounts."},{"t":"Account Manipulation — adding rights to an account","why":"T1098 adds or keeps access. T1531 is the opposite: it removes access."}],"answer":0,"hint":"The technique name says what happens to access to the account.","explain":"T1531 <b>Account Access Removal<\/b> covers any move that stops legitimate users from using their accounts: deleting accounts, locking them, changing their passwords, or revoking their app permissions. The ticket describes exactly that — passwords changed overnight, so staff lost access. ATT&amp;CK lists it under the <b>Impact<\/b> tactic with an <b>Availability<\/b> impact type, because the damage is to access, not to data confidentiality. Attackers use it to lock defenders out, often right before ransomware detonates.","study":"The T1531 technique description — delete, lock, or change credentials to block access."},{"id":"e03","type":"dnd","title":"Which analytic watches which platform","sc":[{"label":"DET0120 overview","text":"DET0120 has six analytics. Each analytic watches one platform and reads that platform’s logs. Place each analytic on the platform it watches."}],"q":"Drag each analytic ID onto the platform it covers.","zones":[{"t":"Windows"},{"t":"Linux"},{"t":"macOS"},{"t":"ESXi"},{"t":"Office Suite (M365)"},{"t":"SaaS (Okta)"}],"items":[{"t":"AN0334","zone":0,"why":"AN0334 reads Windows Security and Sysmon logs."},{"t":"AN0335","zone":1,"why":"AN0335 reads Linux auditd records for passwd, userdel, and chage."},{"t":"AN0336","zone":2,"why":"AN0336 reads the macOS unified log for dscl and sysadminctl commands."},{"t":"AN0337","zone":3,"why":"AN0337 watches the ESXi hostd log for esxcli account removal."},{"t":"AN0338","zone":4,"why":"AN0338 reads the Microsoft 365 Unified Audit Log for mailbox account changes."},{"t":"AN0339","zone":5,"why":"AN0339 reads SaaS identity logs such as the Okta channel."}],"hint":"Follow the order of the ATT&amp;CK page: Windows, Linux, macOS, ESXi, Office Suite, SaaS.","explain":"One detection strategy, six platforms. <b>AN0334<\/b> covers Windows, <b>AN0335<\/b> Linux, <b>AN0336<\/b> macOS, <b>AN0337<\/b> the ESXi hypervisor, <b>AN0338<\/b> Microsoft 365, and <b>AN0339<\/b> SaaS platforms such as Okta, Salesforce, or Zoom. This wide coverage matters because an attacker can remove access at many layers: a laptop, a server, the hypervisor that hosts all servers, or the cloud identity that signs everyone in. In your SOC, knowing which analytic covers which platform tells you instantly where an alert came from.","study":"The DET0120 analytics table — one analytic per platform: Windows, Linux, macOS, ESXi, Office Suite, SaaS."},{"id":"e04","type":"blank","title":"The tactic behind T1531","sc":[{"label":"ATT&CK matrix excerpt","text":"You show a colleague the ATT&amp;CK Enterprise matrix. T1531 Account Access Removal sits in one tactic column only. Its impact type on the technique page is listed as <b>Availability<\/b>."}],"q":"Fill the blank with the name of the tactic that holds T1531.","words":["Impact","Persistence","Credential Access","Defense Evasion"],"text":"T1531 Account Access Removal belongs to the ____ tactic, and its damage type is Availability.","blanks":[{"accept":["Impact"],"why":"T1531 sits in the Impact tactic (TA0040): the attacker’s goal is to damage what the organisation can do."}],"hint":"Which tactic column holds techniques whose damage type is “Availability”?","explain":"T1531 belongs to the <b>Impact<\/b> tactic (TA0040). Impact techniques damage a system’s availability, integrity, or the organisation’s ability to work. The technique page labels its impact type as <b>Availability<\/b>: accounts are deleted, locked, or their passwords changed, so legitimate users cannot log in. Knowing the tactic helps you explain an alert in business words: “this alert means someone is trying to take the service down or lock the staff out”, not “this is espionage”.","study":"The Impact tactic (TA0040) and the Availability impact type of T1531."},{"id":"e05","type":"multi","title":"Windows event codes of AN0334","sc":[{"label":"Analytic card AN0334 (Windows)","text":"“Correlated user account modification (reset, disable, deletion) events with anomalous process lineage, especially outside of IT admin change windows or by non-admin users.”<br>The analytic’s log source table lists three event codes from <b>WinEventLog:Security<\/b> for the User Account Modification data component (DC0010)."}],"q":"Select the three Windows Security event codes that AN0334 watches.","options":[{"t":"4723 — password change attempt","why":"Correct. 4723 is logged when someone tries to change their own password; it is one of the account-modification codes AN0334 watches."},{"t":"4724 — password reset by an administrator","why":"Correct. 4724 is logged when an authority resets another account’s password; AN0334 watches it."},{"t":"4740 — a user account was locked out","why":"Correct. 4740 is the lockout event; AN0334 watches it because lockouts also remove access."},{"t":"4624 — a successful logon","why":"4624 is a logon event. It proves someone logged in, but it is not an account-modification code in AN0334’s list."},{"t":"7045 — a new service was installed","why":"7045 belongs to service creation, not to account modification. It is a useful event, but not for this analytic."}],"correct":[0,1,2],"hint":"Look at the analytic card: the three codes all describe a change to an account, not a logon.","explain":"AN0334’s log source table lists <b>EventCode=4723, 4724, 4740<\/b> from WinEventLog:Security: password change attempt (4723), password reset by an authority (4724), and account lockout (4740). All three mean “access to an account changed or was blocked”, which is the behaviour of T1531. 4624 (logon) and 7045 (service install) are valuable Windows events, but they belong to other detection strategies. Reading the exact event codes of an analytic is the first thing a detection engineer checks when tuning it.","study":"The AN0334 log source table — User Account Modification (DC0010), EventCode=4723, 4724, 4740."},{"id":"e06","type":"blank","title":"The channel of AN0334","sc":[{"label":"Analytic card AN0334 (Windows)","text":"Log source table:<br>• Data component: User Account Modification (DC0010) — Channel: <b>WinEventLog:______<\/b>, EventCode=4723, 4724, 4740<br>• Data component: Process Creation (DC0032) — Channel: WinEventLog:Sysmon, EventCode=1"}],"q":"Fill the blank: which Windows log channel holds events 4723, 4724, and 4740?","words":["Security","Sysmon","System","Application"],"text":"AN0334 reads account-modification events from WinEventLog:____ , and process-creation events from WinEventLog:Sysmon.","blanks":[{"accept":["Security"],"why":"Windows Security Auditing writes 4723/4724/4740 to the Security channel — that is where AN0334 reads them."}],"hint":"On Windows, account auditing events go to one classic channel whose name is also a word for “safety”.","explain":"The channel is <b>WinEventLog:Security<\/b>. Windows writes all account-audit events — including 4723 (password change attempt), 4724 (password reset), and 4740 (lockout) — to the Security log when “Audit User Account Management” is enabled. The analytic correlates those events with Sysmon process-creation events (EventCode=1), which live in a different channel. If your SIEM does not ingest the Security channel, AN0334 cannot see half of what it needs — that is a detection gap, not a tuning problem.","study":"Windows log channels: Security vs Sysmon — and why AN0334 needs both."},{"id":"e07","type":"blank","title":"The Linux tool that deletes users","sc":[{"label":"Analytic card AN0335 (Linux)","text":"“Password changes or account deletions via ‘passwd’, ‘userdel’, or ‘chage’ preceded by interactive shell or remote command execution from non-privileged accounts.”<br>auditd records the syscall with the program name in the <b>exe<\/b> field."}],"q":"Fill the blank with the name of the Linux command that DELETES a user account.","words":["userdel","passwd","chage","sudo"],"text":"On Linux, the command ____ removes a user account, and AN0335 alerts when it runs with a non-root audit ID.","blanks":[{"accept":["userdel"],"why":"userdel deletes an account; AN0335 watches its exe value in auditd SYSCALL records."}],"hint":"Two of the words change or age a password. Only one deletes the whole account.","explain":"The command is <b>userdel<\/b>. The Linux analytic AN0335 watches three programs in auditd syscall records: <b>passwd<\/b> (change a password), <b>chage<\/b> (change password ageing settings), and <b>userdel<\/b> (delete the account). It raises an alert when such a program runs with <b>auid != root<\/b> — meaning a non-root user did it — especially right after a remote login. Remember the mapping: passwd = change password, chage = change expiry, userdel = delete user.","study":"The three Linux binaries of AN0335: passwd, chage, userdel — and what each one does."},{"id":"e08","type":"match","title":"Match each tool to its platform","sc":[{"label":"Quick reference from the DET0120 page","text":"Each analytic names the programs that appear in its logic. Match each program to the platform where its analytic runs."}],"q":"Match each tool to the platform covered by its analytic.","lefts":[{"t":"net.exe (password changes)","r":0,"why":"net.exe is a Windows command; DEADWOOD malware used it to change passwords — that is the Windows analytic AN0334."},{"t":"userdel","r":1,"why":"userdel is the Linux account-deletion binary watched by AN0335."},{"t":"dscl","r":2,"why":"dscl (Directory Service command line) is the macOS directory tool watched by AN0336."},{"t":"esxcli","r":3,"why":"esxcli is the ESXi management CLI; “esxcli system account remove” is watched by AN0337."}],"rights":[{"t":"Windows (AN0334)"},{"t":"Linux (AN0335)"},{"t":"macOS (AN0336)"},{"t":"ESXi (AN0337)"}],"hint":"Think about where each command exists: one is .exe, one is a directory tool on a Mac, one manages a hypervisor.","explain":"Tool ↔ platform mapping is how analysts read unfamiliar alerts fast. <b>net.exe<\/b> only exists on Windows (the DEADWOOD malware used it to randomise passwords). <b>userdel<\/b> is a Linux binary. <b>dscl<\/b> is macOS’s directory-service tool (AN0336 also watches <b>sysadminctl<\/b>). <b>esxcli<\/b> is the ESXi hypervisor CLI — its “system account remove” call is the ESXi analytic’s core signal. If you see one of these tools in a log, you instantly know which analytic and which platform to check.","study":"Procedure examples of T1531 (net.exe on Windows) and the tool names inside AN0335, AN0336, AN0337."},{"id":"e09","type":"qcm","title":"First log line: does the analytic care?","sc":[{"label":"Windows Security log — one line","text":"<span class=\"mono\">2026-10-13 03:12:44 &nbsp;EventCode=4724 &nbsp;SubjectUserName=Helpdesk1 &nbsp;TargetUserName=vendora &nbsp;ComputerName=DC01<\/span><br><br>Your change calendar says: “IT admin change window: every night 02:00–05:00. Helpdesk resets are expected.”"}],"q":"AN0334 only alerts for resets outside the maintenance window (TimeWindow) or by unexpected users. Does this line make AN0334 alert?","options":[{"t":"Yes — 4724 is always an alert","why":"AN0334 has a mutable TimeWindow element: resets inside the agreed window by expected staff are not alerted."},{"t":"No — it is inside the window and by the expected helpdesk user","why":"Correct. Both mutable checks pass: the time is inside the maintenance window and Helpdesk1 is an expected actor."},{"t":"No — resets never appear in the Security log","why":"They do: 4724 is exactly the password-reset event in the Security channel."},{"t":"Yes — because the target is a vendor account","why":"The vendor account is a target, not an actor. The analytic cares about who performed the change and when."}],"answer":1,"hint":"Read the two mutable ideas in the question: time window and user context. Then check the log line.","explain":"<b>No alert.<\/b> AN0334 has a <b>TimeWindow<\/b> mutable element (“alert only on actions outside of IT admin change windows”) and a <b>UserContext<\/b> element (which accounts are expected to make changes). The line shows a 4724 reset by <b>Helpdesk1<\/b> at 03:12 — inside the agreed 02:00–05:00 window, by the team that is supposed to do it. That is benign background noise. This is the most common verdict in a SOC: most account events are normal work, and the analytic exists to find the rare ones that are not.","study":"The AN0334 mutable elements TimeWindow and UserContext — what they tune."},{"id":"e10","type":"order","title":"How an Akira-style attack unfolds","sc":[{"label":"CTI note — abbreviated","text":"“Ransomware operators such as <b>Akira<\/b> have been observed deleting administrator accounts in victim networks <i>prior to encryption<\/i>. The removal of admin access slows the response while the ransomware runs.”"}],"q":"Put the four steps of this Akira-style attack in the order they happen.","seq":[{"t":"Attacker gains admin rights on the network","why":"The attacker must already hold enough privilege to manage accounts — that access comes first."},{"t":"Admin accounts are deleted (T1531)","why":"With admin rights, the attacker removes the accounts defenders would use — the Account Access Removal step."},{"t":"Users are logged off","why":"Active sessions are cut so the lock-out takes effect immediately — the technique description mentions logging users off."},{"t":"Ransomware detonates and encrypts","why":"With defenders locked out, the encryption phase runs with the least interference — this is why Akira removes accounts first."}],"hint":"The attacker needs the keys before they can lock the doors. What must happen before the deletion?","explain":"The order is: <b>1)<\/b> gain admin rights, <b>2)<\/b> delete admin accounts (T1531), <b>3)<\/b> log users off, <b>4)<\/b> detonate ransomware. ATT&amp;CK’s T1531 description says adversaries may delete, lock, or change credentials and “may also subsequently log off and/or perform a System Shutdown/Reboot”. The CTI note adds the “prior to encryption” timing. For a SOC analyst this ordering is the value of the detection: seeing account removal <i>before<\/i> encryption gives you a short but real window to act.","study":"T1531 procedure examples (Akira deletes administrator accounts prior to encryption) and the technique description."},{"id":"e11","type":"blank","title":"The tuning word of ATT&CK detections","sc":[{"label":"Vocabulary card","text":"“Every analytic lists <b>mutable elements<\/b> — fields like UserContext, TimeWindow, or GeoThreshold. Each one is a setting your team can change so the rule fits your environment.”"}],"q":"Fill the blank with the word the DET0120 page uses for a tunable part of an analytic.","words":["mutable","static","random","secret"],"text":"A setting you can tune — like the maintenance window — is called a ____ element of the analytic.","blanks":[{"accept":["mutable"],"why":"“Mutable” means changeable — the DET0120 page lists each analytic’s mutable elements in its own table."}],"hint":"Which word means “able to be changed”?","explain":"The word is <b>mutable<\/b> — “changeable”. Each analytic in DET0120 has a small table of mutable elements: AN0334 has UserContext, TimeWindow, and ParentProcessName; AN0339 has BulkActionThreshold and SessionDeviceType; and so on. These are the dials a detection engineer turns when tuning the rule for one customer: which accounts may act, when changes are allowed, how many actions in a short period are too many. When someone asks “why did this rule fire?”, the answer is usually found in its mutable elements.","study":"The “Mutable Elements” tables on the DET0120 page."},{"id":"e12","type":"blank","title":"The Okta event name","sc":[{"label":"Analytic card AN0339 (SaaS)","text":"Channel <b>saas:okta<\/b> — User Account Modification (DC0010). Watched event types:<br>• user.lifecycle.<b>deactivate<\/b><br>• user.lifecycle.suspend<br>• user.lifecycle.delete.initiated<br>• user.lifecycle.delete.completed"}],"q":"Fill the blank to complete the Okta event that means an account was switched off.","words":["deactivate","activate","login","export"],"text":"When Okta turns an account off, it writes the event user.lifecycle.____ — one of the four events AN0339 watches.","blanks":[{"accept":["deactivate"],"why":"user.lifecycle.deactivate is the Okta “account switched off” event in the AN0339 channel list."}],"hint":"The event name is the opposite of “activate”.","explain":"The event is <b>user.lifecycle.deactivate<\/b>. The AN0339 channel <b>saas:okta<\/b> watches four lifecycle events: deactivate (switch the account off), suspend, delete.initiated, and delete.completed. Together they cover every way access can be removed in Okta, which is what T1531 looks like in a SaaS identity provider. Data component DC0010 (User Account Modification) carries them. Learning these event names helps you read Okta logs at speed during triage — you can spot a deactivate storm in seconds.","study":"The AN0339 log source table — the four user.lifecycle.* events on the saas:okta channel."},{"id":"e13","type":"qcm","title":"Which data component carries process creation?","sc":[{"label":"DET0120 log source excerpt (AN0334)","text":"| Data component | Channel | Filter |<br>| User Account Modification (DC0010) | WinEventLog:Security | EventCode=4723, 4724, 4740 |<br>| Process Creation (____) | WinEventLog:Sysmon | EventCode=1 |"}],"q":"Which data component ID does AN0334 use for process creation events?","options":[{"t":"DC0032 — Process Creation","why":"Correct. DC0032 is the Process Creation data component; Sysmon EventCode=1 is its Windows channel here."},{"t":"DC0009 — User Account Deletion","why":"DC0009 records account deletions — the ESXi and M365 analytics use it, not the process part of AN0334."},{"t":"DC0002 — User Account Authentication","why":"DC0002 records logons and sign-ins. Useful for correlation in other analytics, but not the process component."},{"t":"DC0064 — Command Execution","why":"DC0064 records commands (the macOS analytic uses it). Process creation on Windows here is DC0032."}],"answer":0,"hint":"The row already names the component in words: “Process Creation”. Find its ID.","explain":"The component is <b>DC0032 — Process Creation<\/b>. ATT&amp;CK data components are standard “kinds of evidence”: DC0010 user account modification, DC0009 user account deletion, DC0002 user account authentication, DC0064 command execution, DC0032 process creation. AN0334 joins DC0010 events (the account change) with DC0032 events (the program that ran at that moment) to judge the process lineage. Knowing these IDs by heart makes ATT&amp;CK detection pages much faster to read.","study":"ATT&amp;CK data components used by DET0120: DC0002, DC0009, DC0010, DC0032, DC0064."},{"id":"e14","type":"triage","title":"Benign or suspicious? First shift on the queue","sc":[{"label":"Your queue — four one-line events","text":"Each line shows: actor, action, when. Your change calendar: admin window 02:00–05:00 nightly. Offboarding team runs a scheduled script every Friday 18:00 with ticket CHG-7741."}],"q":"Give each line a verdict: Benign (normal work) or Needs review (does not fit the pattern).","labels":["Benign","Needs review"],"rows":[{"t":"Helpdesk3 resets a password (4724) at 03:40 — inside the admin window","c":0,"why":"Inside the maintenance window by expected staff — the TimeWindow and UserContext checks pass, so this is normal work."},{"t":"User salesmgr runs net.exe to reset two passwords at 03:47, launched from cmd.exe","c":1,"why":"A sales manager has no reason to reset passwords, and net.exe from an interactive shell is exactly the anomalous lineage AN0334 looks for."},{"t":"CHG-7741 script disables 12 accounts (4725) at Friday 18:01","c":0,"why":"The scheduled, ticketed offboarding run matches its known pattern — benign, though worth watching for volume changes."},{"t":"Unknown account del-old-backup is deleted at 14:22 by a user never seen before","c":1,"why":"An unseen actor deleting an account outside any window is the simplest suspicious pattern — needs review."}],"hint":"Two checks decide here: is the actor expected, and is the time inside the window?","explain":"Verdicts: <b>Benign<\/b> — helpdesk reset inside the window; <b>Needs review<\/b> — salesmgr using net.exe from an interactive shell (anomalous process lineage + unexpected UserContext); <b>Benign<\/b> — the ticketed offboarding script at its usual time; <b>Needs review<\/b> — an unknown actor deleting an account outside the window. This is exactly how AN0334 thinks: it correlates <i>who<\/i> acted, <i>when<\/i>, and <i>from which process<\/i>. Getting these four verdicts right means you understand the analytic’s two main ideas — time window and user context.","study":"The AN0334 logic: correlation of account events with process lineage, time window, and user context."},{"id":"e15","type":"qcm","title":"The impact type","sc":[{"label":"Technique page excerpt","text":"“T1531 Account Access Removal — Tactic: Impact. Impact Type: Availability. Platforms: ESXi, IaaS, Linux, Office Suite, SaaS, Windows, macOS.”"}],"q":"Which impact type does T1531 have?","options":[{"t":"Availability","why":"Correct. Removing access to accounts hits availability: users and admins cannot log in to work or to respond."},{"t":"Confidentiality","why":"Confidentiality means secret data exposure. T1531 hides nothing — it blocks access."},{"t":"Integrity","why":"Integrity means unauthorised changes to data. Changing a password changes access, not the data itself."},{"t":"Privilege Escalation","why":"That is a tactic goal (TA0004), not an impact type listed on the T1531 page."}],"answer":0,"hint":"Ask: what does an organisation lose when nobody can log in?","explain":"The impact type is <b>Availability<\/b>. When accounts are deleted, locked, or their credentials changed, legitimate users — including the response team — lose the ability to work and to fight back. That is why ransomware crews like Akira remove admin accounts before encryption: the lock-out buys them time. The full platform list (Windows, Linux, macOS, ESXi, Office Suite, SaaS, IaaS) explains why the detection strategy needs six analytics instead of one.","study":"The T1531 page header — Impact tactic and Availability impact type."}],"timerSec":1500};</script>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim().replace(/[’']/g,String.fromCharCode(39));}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

state:'IDLE',remain:0,int:null,manMs:0,fbMs:0,pStart:0,pKind:'',priorState:null,
reported:false,fromReview:false,started:false};
function fmtT(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}

var H=0,W=0;for(i=0;i<sel.length;i++){if(cs[sel[i]])H++;else W++;}var N=corr.length;
return {N:N,H:H,W:W,credit:Math.max(0,(H-W)/N)};}

/* ---------- header ---------- */
function renderHeader(){

function startExam(){
 S.started=true;S.phase='exam';S.sum=0;S.marks={};S.checked={};S.hint={};S.answers={};S.skip={};
 S.i=0;S.fromReview=false;S.reported=false;S.manMs=0;S.fbMs=0;S.pKind='';
 S.ord=shuffle(EX.ex.map(function(e,k){return k;}));
 S.remain=EX.timerSec;setTimerState('RUNNING');startInt();

}
function curExIdx(){return S.ord[Math.min(S.i,S.ord.length-1)];}
function skippedList(){var a=[],i;for(i=0;i<S.ord.length;i++){if(S.skip[S.ord[i]]&&!S.checked[S.ord[i]])a.push(S.ord[i]);}return a;}
function nextExercise(){
 if(S.state==='PAUSED_AUTO_CHECK'){S.fbMs+=Date.now()-S.pStart;S.pKind='';}
 if(S.fromReview){setTimerState('RUNNING');startInt();renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){setTimerState('RUNNING');startInt();renderReview();return;}
  finalize(false);return;
 }
 setTimerState('RUNNING');startInt();
 renderExercise(S.ord[S.i],false);
}
function skipEx(){
 if(S.phase!=='exam')return;
 var k=curExIdx();
 if(!S.checked[k])S.skip[k]=true;
 nextRawSkip();
}
function nextRawSkip(){
 if(S.fromReview){renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){renderReview();return;}
  finalize(false);return;
 }
 renderExercise(S.ord[S.i],false);
}

  if(S.priorState==='PAUSED_AUTO_CHECK'){S.pStart=Date.now();S.pKind='feedback';}

function onCheck(ex,k){

 document.getElementById('actnote').textContent='';

 var credit=res.credit;
 if(S.hint[k])credit=Math.max(0,credit-0.10);
 S.checked[k]=true;S.marks[k]=credit;S.answers[k]=got;
 S.sum=0;var c=0,i;for(i in S.checked)if(S.checked[i]){S.sum+=S.marks[i];c++;}
 S.ans=c;
 if(S.state==='RUNNING'){S.pStart=Date.now();S.pKind='feedback';setTimerState('PAUSED_AUTO_CHECK');stopInt();}

function optRow(labelTxt,body,idx,multi,sel){

var PICK={};
function pick(idx,btn,multi){
 var ex=EX.ex[CUR.k];
 if(S.checked[CUR.k])return;
 if(ex.type==='qcm'||ex.type==='branch'){
  PICK.cur=idx;
  var opts=document.querySelectorAll('#ansarea .opt');
  for(var i=0;i<opts.length;i++){opts[i].classList.remove('sel');opts[i].setAttribute('aria-pressed','false');}

function wQcm(ex){

function wMulti(ex){

function wMatch(ex){
 var w=el('div');

 for(var r=0;r<ex.lefts.length;r++){

  })(zoneEls[z0]);
 }
 render();
 w.appendChild(el('p','note','Drag each item into a zone — or click an item, then click its zone. Click a placed item to send it back.'));
 w.appendChild(bank);w.appendChild(zwrap);
 return{el:w,collect:function(){
  var vals=[];for(var i=0;i<ex.items.length;i++)vals.push(place[i]==null?-1:place[i]);
  var any=vals.some(function(v){return v>=0;});
  return{vals:vals,empty:!any};
 }};
}
function wOrder(ex){
 var w=el('div');
 var sels=[];
 var rows=ex.seq.map(function(s,i){return{i:i,t:s.t};});
 rows=shuffle(rows);
 for(var r=0;r<rows.length;r++){

 }
 return{el:w,collect:function(){

 }};
}

   var b=document.createElement('button');
   (function(bb,rr,ll){

     if(S.checked[CUR.k])return;

 }
 return{el:w,collect:function(){

 }};

function wBlank(ex){
 var w=el('div');
 var bank=el('div','bank');
 var words=shuffle(ex.words.slice());
 for(var i=0;i<words.length;i++){
  var c=el('span','chip');c.textContent=words[i];
  (function(wd,ch){ch.addEventListener('click',function(){
   if(S.checked[CUR.k])return;
   var ins=w.querySelectorAll('input.blank');
   for(var q=0;q<ins.length;q++){if(!ins[q].value){ins[q].value=wd;break;}}
  });})(words[i],c);
  bank.appendChild(c);
 }
 var html=ex.text;
 var parts=html.split('____');
 var holder=el('div');
 holder.innerHTML=parts[0];
 var inputs=[];
 for(var b=1;b<parts.length;b++){
  var inp=document.createElement('input');inp.className='blank';
  inp.setAttribute('aria-label','Blank '+(b));
  holder.appendChild(inp);inputs.push(inp);
  holder.appendChild(document.createTextNode(''));
  var sp=el('span');sp.innerHTML=parts[b];
  holder.appendChild(sp);
 }
 w.appendChild(holder);
 w.appendChild(el('p','note','Type your answers, or click a word from the bank to fill a blank.'));
 w.appendChild(bank);
 return{el:w,collect:function(){
  var vals=[];for(var i=0;i<inputs.length;i++)vals.push(inputs[i].value);
  var any=vals.some(function(v){return v&&v.trim().length>0;});
  return{vals:vals,empty:!any};
 }};
}
function wBranch(ex){
 PICK={cur:null};ex._step=0;ex._picks=[];
 var w=el('div');
 var head=el('div','steps','STEP 1 OF '+ex.steps.length);
 var done=el('div');
 var area=el('div');
 w.appendChild(head);w.appendChild(done);w.appendChild(area);
 function renderStep(){
  head.textContent='STEP '+(ex._step+1)+' OF '+ex.steps.length;
  area.innerHTML='';
  var st=ex.steps[ex._step];
  var q=el('p','qtext',esc(st.q));
  area.appendChild(q);
  var L=['A','B','C','D','E','F'];
  for(var i=0;i<st.options.length;i++){
   var btn=document.createElement('button');
   (function(oi,b2){
    b2.className='opt';b2.type='button';
    b2.innerHTML='<span class="olab">'+esc(L[oi])+'</span><span style="flex:1">'+esc(st.options[oi].t)+'</span>';
    b2.onclick=function(){
     if(S.checked[CUR.k])return;
     ex._picks[ex._step]=oi;
     done.innerHTML='<div class="stepdone">Step '+(ex._step+1)+' recorded: <b>'+esc(st.options[oi].t)+'</b></div>';
     if(ex._step<ex.steps.length-1){ex._step++;renderStep();}
     else{done.innerHTML+='<div class="stepdone">All steps recorded — press Check to grade the whole chain.</div>';}
    };
   })(i,btn);
   area.appendChild(btn);
  }
 }
 renderStep();
 return{el:w,collect:function(){
  var sel=[];for(var i=0;i<ex.steps.length;i++){if(ex._picks[i]==null)return{empty:true};sel.push(ex._picks[i]);}
  return{sel:sel};
 }};
}
function wQuery(ex){
 var w=el('div');
 w.appendChild(el('p','note',esc(ex.prompt||'Type your query in the editor below, then press Check.')));
 var ta=document.createElement('textarea');ta.className='qry';
 ta.setAttribute('aria-label','Query editor');
 if(ex.template)ta.value=ex.template;
 w.appendChild(ta);
 return{el:w,collect:function(){return{text:ta.value,empty:ta.value.trim().length===0};}};
}
/* ---------- grading ---------- */
function grade(ex,got){
 var rows=[],N=0,H=0,W=0;
 var i;
 if(ex.type==='qcm'){
  N=1;var sel=got.sel[0];var ok=sel===ex.answer;
  if(ok)H++;else if(sel>=0)W++;
  rows.push({s:ok?'ok':'bad',t:'You selected: '+ex.options[sel].t,
   why:ok?ex.options[ex.answer].why:ex.options[sel].why});
  if(!ok)rows.push({s:'miss',t:'Correct answer: '+ex.options[ex.answer].t,why:ex.options[ex.answer].why});
 }
 else if(ex.type==='multi'){
  var corrIdx=ex.correct;
  N=corrIdx.length;
  var selMap={};for(i=0;i<got.sel.length;i++)selMap[got.sel[i]]=1;
  for(i=0;i<corrIdx.length;i++){
   if(selMap[corrIdx[i]]){H++;rows.push({s:'ok',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});}
   else rows.push({s:'miss',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});
  }
  for(i=0;i<got.sel.length;i++){
   var s=got.sel[i];var isCorr=false;
   for(var c=0;c<corrIdx.length;c++)if(corrIdx[c]===s)isCorr=true;
   if(!isCorr){W++;rows.push({s:'bad',t:ex.options[s].t,why:ex.options[s].why});}
  }
 }
 else if(ex.type==='match'){
  N=ex.lefts.length;
  for(i=0;i<ex.lefts.length;i++){
   var okM=got.vals[i]===ex.lefts[i].r;
   if(okM)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okM?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.lefts[i].t+' → '+(got.vals[i]>=0?ex.rights[got.vals[i]].t:'no answer'),
    why:ex.lefts[i].why});
  }
 }
 else if(ex.type==='dnd'){
  N=ex.items.length;
  for(i=0;i<ex.items.length;i++){
   var okD=got.vals[i]===ex.items[i].zone;
   if(okD)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okD?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.items[i].t+' → '+(got.vals[i]>=0?ex.zones[got.vals[i]].t:'not placed'),
    why:ex.items[i].why});
  }
 }
 else if(ex.type==='order'){
  N=ex.seq.length;
  for(i=0;i<ex.seq.length;i++){
   var okO=got.vals[i]===i+1;
   if(okO)H++;else if(got.vals[i]>0)W++;
   rows.push({s:okO?'ok':(got.vals[i]>0?'bad':'miss'),
    t:'“'+ex.seq[i].t+'” correct position: '+(i+1)+(got.vals[i]>0?' — you chose '+got.vals[i]:' — no position chosen'),
    why:ex.seq[i].why});
  }
 }
 else if(ex.type==='triage'){
  N=ex.rows.length;
  for(i=0;i<ex.rows.length;i++){
   var okT=got.vals[i]===ex.rows[i].c;
   if(okT)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okT?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.rows[i].t+' → your verdict: '+(got.vals[i]>=0?ex.labels[got.vals[i]]:'none'),
    why:ex.rows[i].why});
  }
 }
 else if(ex.type==='blank'){
  N=ex.blanks.length;
  for(i=0;i<ex.blanks.length;i++){
   var v=norm(got.vals[i]);
   var okB=false;for(var a=0;a<ex.blanks[i].accept.length;a++)if(v===norm(ex.blanks[i].accept[a]))okB=true;
   if(okB)H++;else if(v.length>0)W++;
   rows.push({s:okB?'ok':(v.length>0?'bad':'miss'),
    t:'Blank '+(i+1)+': your answer “'+(got.vals[i]||'')+'” — expected “'+ex.blanks[i].accept[0]+'”',
    why:ex.blanks[i].why});
  }
 }
 else if(ex.type==='branch'){
  N=ex.steps.length;
  for(i=0;i<ex.steps.length;i++){
   var okS=got.sel[i]===ex.steps[i].answer;
   if(okS)H++;else W++;
   rows.push({s:okS?'ok':'bad',
    t:'Step '+(i+1)+': you chose “'+ex.steps[i].options[got.sel[i]].t+'”',
    why:okS?ex.steps[i].options[got.sel[i]].why:(ex.steps[i].options[got.sel[i]].why+' Correct: '+ex.steps[i].options[ex.steps[i].answer].t+' — '+ex.steps[i].options[ex.steps[i].answer].why)});
  }
 }
 else if(ex.type==='query'){
  var q=norm(got.text);
  N=ex.elements.length;
  var missList=[];var dgr=null;
  for(i=0;i<ex.elements.length;i++){
   var okQ=false;
   for(var p=0;p<ex.elements[i].any.length;p++){
    if(q.indexOf(norm(ex.elements[i].any[p]))>=0){okQ=true;break;}
   }
   if(okQ)H++;else{missList.push(ex.elements[i]);rows.push({s:'miss',t:'Missing element: '+ex.elements[i].t,why:ex.elements[i].why});}
  }
  if(ex.forbidden){
   for(i=0;i<ex.forbidden.length;i++){
    if(q.indexOf(norm(ex.forbidden[i].t))>=0){W++;rows.push({s:'bad',t:'Harmful element found: '+ex.forbidden[i].t,why:ex.forbidden[i].why});}
   }
  }
  if(missList.length===0)rows.unshift({s:'ok',t:'All required elements present in the query.',why:''});
  if(ex.danger){
   for(i=0;i<ex.danger.length;i++){
    if(q.indexOf(norm(ex.danger[i]))>=0)dgr=ex.dangerNote||'Your query contains a state-changing or destructive element.';
   }
  }
  var credit=Math.max(0,(H-W)/N);
  return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:dgr,credit:credit};
 }
 var credit=Math.max(0,(H-W)/N);
 if(ex.type==='qcm')credit=credit>0?1:0;
 return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:null,credit:credit};
}
/* ---------- review skipped ---------- */
function renderReview(){
 clearView();
 var pend=skippedList();
 var w=el('div','wrap');
 var h='<div class="card"><h2>Review skipped exercises</h2>';
 if(pend.length===0){
  h+='<p class="muted">⚠ No skipped exercises left. You can submit now.</p>';
 }else{
  h+='<p class="muted">You skipped '+pend.length+' exercise(s). You can go back and answer them while the timer still runs. A skipped-and-never-answered exercise is excluded from your score.</p>';
  for(var i=0;i<pend.length;i++){
   var ex=EX.ex[pend[i]];
   h+='<div class="skipcard"><span class="st">⚠ Skipped</span><span class="sd">'+esc(ex.title)+'</span>'
   +'<button data-k="'+pend[i]+'" class="ansbtn">Answer it</button></div>';
  }
 }
 h+='<div class="actions"><button class="primary" id="btnFinal">⏭ Submit exam</button>'
 +'<span class="note">Submitting excludes anything still unanswered.</span></div></div>';
 w.innerHTML=h;view.appendChild(w);
 var btns=w.querySelectorAll('.ansbtn');
 for(var b=0;b<btns.length;b++){
  (function(k){btns[b].onclick=function(){renderExercise(k,true);};})(parseInt(btns[b].getAttribute('data-k'),10));
 }
 document.getElementById('btnFinal').onclick=function(){finalize(false);};
}
/* ---------- results ---------- */
function finalize(byTimeout){
 stopInt();
 if(S.state!=='ENDED')setTimerState('ENDED');
 clearView();
 var full=0,part=0,zero=0,partSum=0,answered=0,i;
 for(i=0;i<EX.ex.length;i++){
  if(S.checked[i]){answered++;var c=S.marks[i];
   if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
 }
 var skipped=EX.ex.length-answered;
 var sum=0;for(i=0;i<EX.ex.length;i++)if(S.checked[i])sum+=S.marks[i];
 var pct=answered>0?Math.round(sum/answered*100):0;
 var pass=pct>=70;
 var w=el('div','wrap');
 var manS=Math.round(S.manMs/1000),fbS=Math.round(S.fbMs/1000);
 var h='<div class="card"><h1>Results — '+esc(META.title)+'</h1>'
 +'<div class="kv"><span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +'<span>Answered: '+answered+' of '+EX.ex.length+'</span>'
 +(byTimeout?'<span>⏱ Time ran out — unanswered exercises were excluded</span>':'')+'</div>'
 +'<div class="bigres">'
 +'<div class="res ok"><div class="rn">'+full+'</div><div class="rl">✓ Fully correct</div></div>'
 +'<div class="res part"><div class="rn">'+part+'</div><div class="rl">✓ Partially correct'+(part>0?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'
 +'<div class="res bad"><div class="rn">'+zero+'</div><div class="rl">✗ Fully incorrect</div></div>'
 +'<div class="res skip"><div class="rn">'+skipped+'</div><div class="rl">⚠ Skipped — excluded</div></div>'
 +'</div>'
 +'<p style="font-size:20px"><b>Final score: '+sum.toFixed(1)+' / '+answered+'</b> — '+pct+'% (pass mark 70%)</p>'
 +'<div class="verdict '+(pass?'pass':'fail')+'"><div class="vt">'+(pass?'✓ PASS':'✗ FAIL')+'</div>'
 +'<p>'+(pass?'Well done. You reached the pass mark for this severity.':'You must retake this exam to reach 70%. Review the explanations, then press Retake Exam.')+'</p></div>'
 +'<p class="small muted">Time accounting: '+fmtT(manS)+' paused manually (breaks) · '+fmtT(fbS)+' reviewing feedback (auto-pause after Check).</p>'
 +'<div class="actions"><button class="primary" id="btnRetake">↻ Retake Exam</button></div></div>';
 w.innerHTML=h;view.appendChild(w);
 document.getElementById('btnRetake').onclick=function(){startExam();};
 reportScore(sum,answered);
}
function reportScore(creditSum,answeredCount){
 if(S.reported)return;S.reported=true;
 var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 window.__learner={username:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
});
/* ---------- boot ---------- */
S.remain=EX.timerSec;
renderHeader();
renderIntro();
