<script>window.__EXAM__={"intro":{"title":"DET0120 — EXTREMELY HARD practice exam","idname":"DET0120 — Account Access Removal via Multi-Platform Audit Correlation (detects T1531 — Account Access Removal)","learn":["This is the expert tier for the <b>detection strategy DET0120<\/b>, the ATT&amp;CK plan that watches for <b>T1531 Account Access Removal<\/b> — adversaries deleting, locking, or re-credentialing accounts to cut off legitimate access. The technique sits in the <b>Impact<\/b> tactic with an <b>Availability<\/b> impact type, spans Windows, Linux, macOS, ESXi, Microsoft 365, and SaaS, and is a documented pre-ransomware behaviour: <b>Akira<\/b> deletes administrator accounts before encryption. ATT&amp;CK is explicit that the technique cannot be easily prevented, because it abuses normal administrative features — so detection <i>is<\/i> the control, and the six analytics (AN0334–AN0339) are that control made concrete.","These fifteen exercises mirror senior decisions, not flashcards. You will weigh <b>four or more artefacts<\/b> at once — Windows Security and Sysmon, auditd, ESXi hostd/vpxa, M365 UnifiedAuditLog and sign-in risk, Okta lifecycle events — under incident pressure with noise, missing telemetry, and stakeholders demanding an answer in minutes. Several scenarios contain <b>two signals that contradict each other<\/b>; you must decide which one wins and say why. Several have a correct answer that costs something — downtime, a delayed payroll run, evidence you must not overwrite — and at least one where the best move is to <i>gather more evidence<\/i> rather than act.","The wrong options are drawn from real SOC habits: auto-restoring deleted accounts, disabling a noisy analytic mid-incident, mass-disabling production services, rebuilding a host before its logs are exported. Each is defensible in some world. Your job is to notice which world the artefacts describe — and to accept the price of the right call in this one.","Hints here only restate a constraint you may have missed. The explanations after Check are where the learning compounds — take the auto-pause."],"themes":[{"name":"Chained correlation across platforms","items":["One actor, many layers: Windows 4724 lineage + Okta bulk lifecycle + ESXi RemoveUser + M365 Set-Mailbox in one campaign","AN0334 under noise: the one lineage-true reset inside a benign storm","AN0337: role anomaly vs expected IP — which signal wins and why","AN0338/AN0339: audit-log action vs sign-in geography; bulk thresholds vs offboarding runs"]},{"name":"Tuning without gutting coverage","items":["Allowed-list changes that keep the analytic alive (UserContext, TimeWindow, ExpectedIPs, BulkActionThreshold exceptions)","Coverage-destroying “tuning”: removing ParentProcessName, raising thresholds absurdly, dropping DC0002 correlation","The mid-incident rule: never disable the only telemetry for the technique you are fighting"]},{"name":"Evidence, cost, and senior calls","items":["Evidence preservation order when the attacker is still live","Accepting real cost: freezing IdP admin changes during payroll week","“Do nothing yet”: closing a benign reset and keeping a watch, instead of escalating noise","Attribution discipline: TTP overlap vs confirmation (Akira-style playbook, net.exe, insider alternatives)"]},{"name":"Detection engineering under fire","items":["Writing the AN0339 bulk-deletion correlation in the query editor (one query-editor exercise)","Turning stakeholder language (“evidence that survives scrutiny”) into query and containment choices"]}],"how":["<b>Passing score.<\/b> You pass with <b>70% or more<\/b>. Feedback explains which world each near-miss belongs to — read it even when you pass.","<b>Exercises.<\/b> This file has <b>15 exercises<\/b>: multi-artefact chains, branching conflicts with real cost, a noisy log reader, ranking, select-all judgement calls, and one query-editor task.","<b>Timer.<\/b> You have <b>45 minutes<\/b>. <b>Pause<\/b> hides the exercise and stops the clock for a genuine break; <b>Check<\/b> auto-pauses the clock so feedback can be studied without pressure; the clock resumes on <b>Next<\/b>.","<b>Partial credit.<\/b> Multi-item exercises score per item with credit = (correct − wrong) ÷ total. Selecting everything scores zero — commit to your reasoning.","<b>Hints and skipping.<\/b> One hint per exercise (−10% of that exercise’s credit) restates a constraint; it never names the answer. Skipped exercises wait in a review pool while the timer runs; never-answered exercises are excluded from the score."],"types":["Branching decision","Multiple choice (single answer)","Select-all (partial credit)","Timeline ordering","Query editor"]},"ex":[{"id":"x01","type":"branch","title":"The 10-minute answer for the CISO","sc":[{"label":"ARTEFACT 1 — WinEventLog:Security + Sysmon (DC01, 00:11–00:19)","log":["00:11:02  EventCode=4724 ×6  SubjectUserName=adm_integration  TargetUserName=adm-01…adm-06  WorkstationName=SRV-OPS","00:11:04  Sysmon EID1: explorer.exe → powershell.exe → net.exe (user: CORP\\adm_integration, SRV-OPS)"]},{"label":"ARTEFACT 2 — saas:okta (00:14)","log":["00:14:21  user.lifecycle.deactivate ×9  actor=adm_integration (new admin session, device type unknown-to-tenant)","00:14:22  BulkActionThreshold note: 9 actions / 40s — threshold exceeded"]},{"label":"ARTEFACT 3 — esxi:hostd + vpxa (00:16)","log":["00:16:40  hostd method=RemoveUser userName=bkp-admin via vSphere API session=9f2c…","00:16:38  vpxa login as svc-automation from 203[.]0[.]113[.]71 (outside ExpectedIPs) role Administrator"]},{"label":"ARTEFACT 4 — m365:signinlogs","log":["00:09:55  sign-in adm_integration  IP 203[.]0[.]113[.]71  geo: unlisted ASN  MFA: satisfied (push approved)","00:09:56  GeoThreshold note: new ASN for this identity; session device unfamiliar"]},{"label":"Noise and gaps","text":"Print-spooler restarts on SRV-OPS (unrelated). The Okta audit export job is broken this week (incomplete info). CTI: Akira deletes admin accounts prior to encryption. The CISO: “Is this one campaign? I need a decision in 10 minutes.”"}],"q":"Walk the four decision steps you would actually take in the next ten minutes.","steps":[{"q":"STEP 1 — One campaign or separate events? What is the strongest linkage?","options":[{"t":"One campaign: the same actor identity (adm_integration) and the same source IP (203[.]0[.]113[.]71) tie Windows, Okta, and M365; the ESXi session follows minutes later","why":"Correct — actor identity + IP + 5-minute sequencing across three platforms is the linkage; the spooler noise is decoration."},{"t":"Separate coincidences — the platforms are unrelated","why":"Wrong — the shared identity and IP across artefacts 1, 2, and 4, with the hypervisor hit 5 minutes later, is not coincidence-grade."},{"t":"Cannot say anything until the broken Okta export is fixed","why":"Wrong — the export gap limits scope, but the linkage stands on what already arrived; waiting wastes the 10 minutes."}],"answer":0},{"q":"STEP 2 — Which artefact is the noise, and which is the gap?","options":[{"t":"Spooler restarts are noise; the broken Okta export is the gap","why":"Correct — classify each explicitly: noise does not change the story, the gap limits how far scope can be confirmed."},{"t":"The Sysmon lineage is the noise","why":"Wrong — explorer → powershell → net.exe under the actor is the core Windows signal."},{"t":"There is no gap — everything needed arrived","why":"Wrong — the export outage means full Okta scope (how many accounts, which admins) is unconfirmed."}],"answer":0},{"q":"STEP 3 — What do you recommend in the 10-minute window?","options":[{"t":"Declare a major incident: freeze privileged sessions and IdP admin changes, preserve ESXi/Okta logs, mobilise IR — before touching accounts","why":"Correct — with a live multi-platform actor, evidence-preserving containment and mobilisation beat repair; deletion may precede encryption."},{"t":"Restore the six Windows admin accounts first so leadership can work","why":"Wrong — early restoration is state change before preservation, and the actor is live: T1531 removals repeat cheaply."},{"t":"Isolate SRV-OPS and call it contained","why":"Wrong — the actor’s access lives in identity and the hypervisor layer, not on one workstation; isolating one host is theatre."}],"answer":0},{"q":"STEP 4 — How do you phrase the residual risk to the CISO?","options":[{"t":"“Scope is incomplete — Okta export is broken. We act on evidence in hand and backfill scope; treat encryption as a live risk given the TTP match.”","why":"Correct — honest, decision-ready framing: act now, state the gap, name the worst case from CTI."},{"t":"“We are certain it is Akira; nothing else needed.”","why":"Wrong — TTP overlap justifies urgency, not certainty; attribution overreach is its own incident."},{"t":"“Risk is low because MFA was satisfied.”","why":"Wrong — a push-approved MFA session from a new ASN is precisely the takeover pattern; the artefacts contradict the claim."}],"answer":0}],"hint":"The constraint you may have missed: the actor identity and source IP repeat across artefacts — and the export job limits scope, not the verdict.","explain":"The linkage: <b>adm_integration<\/b> and <b>203[.]0[.]113[.]71<\/b> appear in the Windows resets (4724 ×6 with explorer → powershell → net.exe lineage), the Okta bulk deactivations, and the M365 sign-in; the ESXi RemoveUser lands five minutes later from the same IP under svc-automation. That is one campaign across four layers. The spooler restarts are noise; the broken export is the stated gap. The 10-minute recommendation is evidence-preserving containment: freeze privileged sessions and IdP admin changes, export ESXi and Okta logs, mobilise IR — restoration waits. Framing matters at this level: state what is confirmed, what is gapped, and name the worst case (pre-encryption sweep) without claiming attribution certainty.","study":"Cross-platform campaign linkage via DET0120 analytics; evidence-preserving containment before repair."},{"id":"x02","type":"qcm","title":"Two signals contradict: which wins?","sc":[{"label":"Signal A — m365:unified (audit of the action itself)","log":["08:03:12  operation=Set-Mailbox  actor=admin.b@corp  action=disable account  device: CORP-LAP-44 (compliant)"]},{"label":"Signal B — m365:signinlogs (context of the session)","log":["07:58:40  sign-in admin.b@corp  geo: Dublin → 23:40 prior day geo: Singapore  (flagged: impossible travel, 9h apart)","07:58:41  MFA: satisfied (push approved on enrolled device)"]},{"label":"Artefact 3 — identity team","text":"“admin.b was offboarded from Exchange-Admins at 16:40 yesterday. RoleAssignment check: the actor held no delegated admin role at action time.”"}],"q":"The sign-in geo is flagged impossible-travel, yet the audit action came from a compliant device. Which signal wins, and why?","options":[{"t":"The audit action wins: Set-Mailbox disable is confirmed admin activity by a de-scoped actor — treat as compromise; the geo flag only shapes the story","why":"Correct — the action itself is the confirmed fact; geo anomalies explain how, and their absence (compliant device) does not un-authorise the actor."},{"t":"The geo signal wins: without impossible travel there is no compromise","why":"Near-miss — geography-first thinking; but the actor lost the admin role, so a spotless session still performed an unauthorised action."},{"t":"Neither: MFA satisfied plus compliant device proves legitimacy","why":"Near-miss — the takeover pattern that defeats this reasoning is a stolen enrolled device with an approved push; artefact 3 breaks the tie."},{"t":"Both are equally weighted and cancel out","why":"Near-miss — signals do not “cancel”; the audit log records what happened, telemetry records context, and authorisation is checked against RoleAssignment."}],"answer":0,"hint":"One artefact records what was done; the others describe how the session looked. Which one answers “was this authorised?”","explain":"The <b>audit action wins<\/b>: Set-Mailbox disable is a recorded fact performed by an actor whose RoleAssignment was revoked hours earlier — that is unauthorised admin activity regardless of session hygiene. The impossible-travel flag would have strengthened the story, but its absence proves nothing: the modern cloud-takeover pattern is exactly a stolen compliant device with a push-approved MFA, which renders geo signals quiet while the action is rogue. Signals are not peers to be averaged — the analytic hierarchy is: confirmed action → authorisation state (RoleAssignment) → session context (geo/MFA). This ordering is what AN0338 encodes, and mis-ordering it is how real teams dismiss live takeovers.","study":"AN0338 signal hierarchy: action (DC0009) → authorisation (RoleAssignment) → session risk (GeoThreshold, MFA)."},{"id":"x03","type":"branch","title":"Rebuild now, or evidence first?","sc":[{"label":"ARTEFACT 1 — esxi:hostd","log":["01:22:09  hostd method=RemoveUser userName=infra-adm2 via SSH session (TSM-SSH enabled 01:19)","01:22:10  prior 48h: three more RemoveUser events, all outside maintenance windows"]},{"label":"ARTEFACT 2 — vpxa / hostd auth","log":["01:18:55  SSH login root from 198[.]51[.]100[.]87 (outside ExpectedIPs 10[.]0[.]0[.]0/24)","01:19:02  TSM-SSH service started via DCU (direct console) — physical/console or KVM access suspected"]},{"label":"Stakeholder demand","text":"VP Infrastructure, 01:25: “That host hosts payroll. Rebuild it from the golden image <b>now<\/b> and we are done. We do not need forensics theatre.” Legal, 01:26: “If customer data was touched we will need evidence that survives scrutiny.”"}],"q":"Resolve the three steps of the 01:30 decision.","steps":[{"q":"STEP 1 — What does “rebuild now” destroy that cannot be recovered afterwards?","options":[{"t":"Host-local evidence: hostd/vpxa logs, SSH session artifacts, the DCU console trail — the record of what the attacker did","why":"Correct — golden-image rebuild wipes the host’s own logs; the 48h RemoveUser history and console-access evidence die with it."},{"t":"Nothing — SIEM already holds everything","why":"Wrong — TSM-SSH console activity and local hostd retention are exactly what is not guaranteed to be shipped off-host."},{"t":"Only the attacker’s foothold","why":"Wrong — it also destroys your ability to prove scope later; foothold removal is achievable without the wipe."}],"answer":0},{"q":"STEP 2 — What is the correct 01:30 sequence?","options":[{"t":"Export and hash hostd/vpxa and DCU logs off-box → disable TSM-SSH → revoke sessions and rotate creds → then rebuild under change control","why":"Correct — preservation in minutes, then cut access, then the rebuild the VP wants — order satisfies both stakeholders."},{"t":"Rebuild first; export logs from the golden image afterwards","why":"Wrong — the golden image never contained the incident logs; exporting afterwards exports nothing."},{"t":"Do nothing until morning — evidence preservation needs the forensics vendor on-site","why":"Wrong — export-and-hash is a 10-minute on-call task; waiting leaves the attacker’s SSH path live all night."}],"answer":0},{"q":"STEP 3 — Legal’s phrase “evidence that survives scrutiny” translates to which practice here?","options":[{"t":"Hashed exports with chain-of-custody notes, timestamps, and the responder’s identity recorded","why":"Correct — scrutiny means provenance: hashes, custody notes, timestamps, and who touched what."},{"t":"Screenshots of the logs pasted into the ticket","why":"Wrong — screenshots lack hashes and custody; they fail scrutiny precisely when it matters."},{"t":"Letting the SIEM retention policy handle it — no extra work needed","why":"Wrong — retention covers what was shipped; host-local artefacts and console access are outside its guarantee."}],"answer":0}],"hint":"The constraint the VP skipped: the golden image never contained this week’s logs. What dies with the rebuild?","explain":"“Rebuild now” is the widely-recommended reflex that is <b>wrong in this world<\/b>: the rebuild wipes host-local evidence — 48 hours of RemoveUser history, SSH session artefacts, the DCU console trail that suggests physical/KVM access. The sequence that satisfies both stakeholders takes minutes: export+hash <b>→<\/b> disable TSM-SSH <b>→<\/b> revoke and rotate <b>→<\/b> rebuild under change control. Legal’s “survives scrutiny” is not theatre — it is hashes, custody notes, timestamps, and identity. Accepting the VP’s framing wholesale trades a provable incident for an unprovable guess; refusing it wholesale leaves a live SSH path. The senior call is the ordered one, and it is fast.","study":"AN0337 incident evidence: hostd/vpxa export, TSM-SSH state, chain of custody before rebuild."},{"id":"x04","type":"multi","title":"Tune without gutting: choose the three that keep coverage","sc":[{"label":"Context — noisy month on AN0334/AN0339","text":"AN0334 alerts 60×/week (helpdesk resets with benign lineage). AN0339 alerts on every Friday offboarding. Leadership demands “make it stop” without losing the technique. Six proposed changes are on the table."}],"q":"Select the three changes that reduce noise <b>without<\/b> destroying the analytic’s ability to detect T1531.","options":[{"t":"Narrow AN0337 ExpectedIPs to the documented 10[.]0[.]0[.]0/24 management range","why":"Correct — tightens an allowlist to documented reality; nothing legitimate is removed, precision rises."},{"t":"Add a UserContext exception for the ticketed offboarding automation identity, scoped to its change window","why":"Correct — scoped exception for a documented actor/window kills the Friday noise while all other actors stay covered."},{"t":"Raise BulkActionThreshold to 500 so offboarding never alerts again","why":"Wrong — a real attacker sweeping 60 accounts (Akira-scale pre-encryption) becomes invisible; the threshold stops meaning anything."},{"t":"Remove the ParentProcessName condition so any reset by any user alerts","why":"Wrong — that inverts precision into recall-noise; the lineage check is the analytic’s ability to tell script from human-operated tooling."},{"t":"Keep ParentProcessName but expand UserContext allowlist to include only ticketed helpdesk identities inside their shift window","why":"Correct — the lineage check survives, the actor exception is documented and time-boxed: coverage holds, noise drops."},{"t":"Drop the DC0002 (authentication) correlation from AN0335 to simplify the rule","why":"Wrong — without the preceding-access half, benign automation and remote operator sessions look identical; the analytic loses its discriminating power."}],"correct":[0,1,4],"hint":"For each option ask: does a documented, scoped exception remain, or does a whole condition disappear?","explain":"The three that keep coverage share a shape — <b>scoped, documented, reversible exceptions<\/b>: ExpectedIPs to the real management range; a ticketed, time-boxed offboarding exception; and a helpdesk-identity exception that preserves the ParentProcessName lineage check. The three that gut coverage also share a shape: a <i>condition disappears<\/i>. BulkActionThreshold at 500 hides exactly the sweep sizes that matter; removing the lineage check converts precision into a raw event feed; dropping DC0002 from AN0335 erases the difference between an automation job and a live remote operator. When leadership says “make it stop”, the senior answer reduces noise by scoping exceptions — never by deleting the conditions that make the technique detectable.","study":"Tuning vs coverage: scoped exceptions (UserContext, ExpectedIPs, BulkActionThreshold) vs condition removal."},{"id":"x05","type":"multi","title":"One hit in the noise: Windows, 03:47","sc":[{"label":"ARTEFACT — DC01 Security + WKS telemetry, 03:30–04:00 (excerpt)","log":["03:31:10  EventCode=4724  SubjectUserName=Helpdesk4  TargetUserName=user-rm9   (ticket #8812, in-window)","03:38:44  EventCode=7045  service SpoolerDR restart on SRV-APP2 (known cleanup job)","03:41:02  EventCode=4740  TargetUserName=svc-report (cached-credential race after rotation)","03:47:19  EventCode=4724  SubjectUserName=salesmgr  TargetUserName=adm-backup2","03:47:20  Sysmon EID1 (WKS-77): explorer.exe → cmd.exe → net.exe user adm-backup2 (user: CORP\\salesmgr)","03:52:00  EventCode=4724  SubjectUserName=Helpdesk2  TargetUserName=user-lk3   (ticket #8813, in-window)"]},{"label":"Context","text":"Maintenance window 02:00–05:00. Helpdesk resets are ticketed. salesmgr: regional sales manager, never held admin tooling, no ticket references adm-backup2. adm-backup2 is a dormant secondary admin account, last used 8 months ago."}],"q":"Select every statement the artefact set supports.","options":[{"t":"The 03:47 pair is the hit: non-admin actor, interactive cmd → net lineage, admin-target reset, no ticket","why":"Correct — every AN0334 condition points one way; the dormant secondary-admin target raises the stakes further."},{"t":"The 4740 and 7045 lines are noise tied to other documented processes","why":"Correct — the lockout is rotation fallout and the spooler restart is the known cleanup job: realistic noise that must be classified and skipped."},{"t":"The helpdesk lines are benign: ticketed resets by expected actors inside the window","why":"Correct — ticketed, in-window, expected UserContext: the analytic must stay silent on exactly these."},{"t":"The 03:47 reset is benign because the window is open","why":"Wrong — the window forgives documented actors; a sales manager resetting a secondary admin from an interactive shell is out of profile in every dimension."},{"t":"Next step: verify the dormant adm-backup2 usage and scope what else salesmgr touched — before disabling anything","why":"Correct — evidence-first scoping on the actor and the target; disabling is a contain decision that follows, not leads."},{"t":"Next step: reset all admin passwords fleet-wide immediately","why":"Wrong — fleet-wide credential resets are the disproportionate reflex: massive disruption, and it also destroys the state you need for scoping."}],"correct":[0,1,2,4],"hint":"Classify all six lines first (noise / benign / hit). The window excuses documented actors only.","explain":"Six lines, three verdicts. <b>Noise:<\/b> the 4740 (rotation fallout) and the 7045 (documented cleanup job). <b>Benign:<\/b> both ticketed helpdesk resets — expected actors, in-window. <b>Hit:<\/b> 03:47 — a sales manager with no admin tooling history resetting a <i>dormant secondary admin account<\/i> via interactive cmd.exe → net.exe, unticketed. That is AN0334’s full profile: UserContext violation + ParentProcessName lineage + unexplained target. The correct next step is scoping (what else did salesmgr touch; has adm-backup2 been used since) before containment. Fleet-wide password resets are the cost-laden reflex the scenario prices out: maximal disruption, destroyed state, and the attacker — who is on WKS-77, not in AD — watches you do it.","study":"AN0334 triage discipline: classify every line (noise/benign/hit) before acting on the hit."},{"id":"x06","type":"qcm","title":"The “best practice” that is wrong here","sc":[{"label":"Incident state","text":"AN0339 detected 24 Okta deactivations by an unfamiliar admin session. The attacker session is believed terminated. The response runbook includes the industry-standard line: “restore deleted accounts from backup ASAP to restore business function.” Backup restore of all 24 accounts takes ~40 minutes and rewrites account state. CTI: pre-encryption sweeps often repeat; the adversary may hold a second admin session you have not found."}],"q":"Why is “restore from backup ASAP” the wrong call <i>in this specific context<\/i>?","options":[{"t":"It rewrites live evidence and re-creates the very accounts an attacker holding a second session will simply delete again","why":"Correct — restoration destroys the deletion-state you are investigating and re-enters the adversary’s target list while their access may persist."},{"t":"Restores never interact with investigations","why":"Wrong — restores overwrite directory state, which is the evidence base for scoping what the attacker touched."},{"t":"Backups are immutable, so nothing is lost","why":"Near-miss — immutability protects the backup copy; it says nothing about corrupting the live state the investigation needs."},{"t":"Restoration is fine as long as it happens after the incident is closed","why":"Near-miss — defensible in a contained, scoped incident; here the sweep pattern and a possible second session make timing the core risk."}],"answer":0,"hint":"The constraint the runbook line ignores: the adversary may still hold access, and the directory state is your evidence.","explain":"“Restore ASAP” is a reasonable default for accidents — an overzealous script, an HR mistake. It is the wrong call when <b>the removal may be adversary-controlled and repeatable<\/b>: restoration rewrites the exact state you are scoping, and if a second admin session survives, you have rebuilt the target list for a second sweep. The senior sequence: export Okta audit logs → hunt for surviving admin sessions → monitor re-deletion attempts (a live tripwire) → then restore deliberately, scoped and ticketed. Generalising the lesson: runbook defaults encode <i>one<\/i> world; detection-strategy telemetry tells you which world you are in. When the artefacts say “attacker-controlled”, the best practice changes.","study":"T1531 post-removal behaviour: repeatable sweeps as a monitoring opportunity before restoration."},{"id":"x07","type":"branch","title":"macOS with a hole in the telemetry","sc":[{"label":"ARTEFACT 1 — macos:unifiedlog (DES-K-12, design studio)","log":["19:41:02  sysadminctl --deleteUser studio-intern  actor: admin2  tty ttys001","19:41:03  dscl . delete /Users/studio-intern  (same actor, seconds later)"]},{"label":"ARTEFACT 2 — authentication context","log":["19:38:55  first-ever sudo for admin2 (account created 2 days ago)","19:38:56  session from device MAC not present in MDM inventory"]},{"label":"Gaps and noise","text":"This studio Mac is not enrolled in MDM (acquired last month, enrollment pending) — no EDR telemetry, no software inventory. Two other new local admins exist on other studio machines (names unknown to the SOC). Creative leadership: “do not touch the studio machines tonight, render farm is running.”"}],"q":"Resolve the four steps.","steps":[{"q":"STEP 1 — What does the artefact pair establish?","options":[{"t":"AN0336 profile: delete-verb commands (sysadminctl + dscl) by a two-day-old admin performing its first sudo, from a device unknown to MDM","why":"Correct — both watched patterns plus the AnomalousUserFlag half; the unmanaged device compounds it."},{"t":"Benign — designers manage their own machines","why":"Wrong — the actor profile (new admin, first sudo, unknown device) contradicts any documented self-management practice."},{"t":"Inconclusive without EDR, so treat as benign","why":"Wrong — absence of EDR limits scope, not the verdict; the unified-log evidence stands on its own."}],"answer":0},{"q":"STEP 2 — The render-farm constraint forbids touching studio machines tonight. What is the correct containment posture?","options":[{"t":"Network-contain the one suspect Mac (deny-new / quarantine VLAN) without powering it down, preserving volatile logs","why":"Correct — cuts the actor’s reach while preserving evidence and the render farm; it is the least aggressive real containment available."},{"t":"Reboot all studio Macs to clear sessions","why":"Wrong — destroys volatile evidence, disrupts the render farm, and does not remove the local admin."},{"t":"Ignore until MDM enrollment completes next week","why":"Wrong — a live account-removal actor with local admin on an unmanaged machine is not a next-week problem."}],"answer":0},{"q":"STEP 3 — Which hunt closes the biggest open question tonight?","options":[{"t":"Enumerate all local admins created in the last 14 days across studio machines (via the one telemetry source you have: unified logs shipped centrally)","why":"Correct — the scenario hands you two unknown sibling admins; bounding the actor-set is the highest-value missing fact."},{"t":"Wait for MDM to populate software inventory","why":"Wrong — days away; the local-admin enumeration is available tonight from centralised unified logs."},{"t":"Disable all local admin accounts fleet-wide","why":"Wrong — disproportionate, breaks studio workflows, and the render-farm constraint already prices it out."}],"answer":0},{"q":"STEP 4 — How do you record the residual gap?","options":[{"t":"“MDM/EDR blind spot on unmanaged studio Macs — AN0336 relies on unified logs only; enrollment flagged as corrective action.”","why":"Correct — name the telemetry gap, its effect on the analytic, and the corrective action: that is a professional record."},{"t":"“No telemetry issues noted.”","why":"Wrong — the unmanaged-device hole is material; omitting it misleads the next responder."},{"t":"“Studio machines are exempt from detection coverage.”","why":"Wrong — an exemption is a policy decision; documenting the gap is the engineering truth either way."}],"answer":0}],"hint":"Constraint: you cannot touch the machines tonight — but one telemetry source is still shipping. Which question can it answer tonight?","explain":"The pair establishes the full AN0336 profile: <b>delete-verb<\/b> commands (both watched patterns) by a <b>two-day-old admin on first-ever sudo<\/b> from a device MDM has never seen. Containment must respect the render-farm constraint, so the correct posture is network-level quarantine of one host — not reboots, not fleet actions. The highest-value hunt available <i>tonight<\/i> is enumerating the last two weeks of local-admin creations from the centrally shipped unified logs, because the scenario states sibling admins exist and are unnamed. And the professional record names the telemetry hole (“MDM blind spot — analytic runs on unified logs alone”) with a corrective action. Senior work on partial telemetry is exactly this: contain what you can, hunt what the one source still answers, document the rest.","study":"AN0336 on partially managed fleets: unified-log-only coverage, quarantine vs power actions, gap documentation."},{"id":"x08","type":"order","title":"Preserve the evidence while the attacker is live","sc":[{"label":"Incident state (02:10)","text":"Confirmed multi-platform account-removal campaign (Windows + Okta + ESXi). The adversary session on the IdP is believed still active. The SIEM retention hold can be applied remotely; Okta admin console is reachable; ESXi hosts ship logs centrally but hostd local files persist 24h. The on-call lead: “order it — nothing destructive first.”"}],"q":"Order the five actions from first to last.","seq":[{"t":"Apply SIEM retention hold / legal hold on all relevant indexes","why":"Remote, read-only, and stops the 24h local-rotation problem from eating the record while you work."},{"t":"Export and hash the ESXi hostd/vpxa logs off-box","why":"Host-local files are the artifact class retention may not fully cover — get them out and hashed early."},{"t":"Export the Okta admin audit log (system log) for the campaign window","why":"Identity-provider actions are the campaign spine; capture them in immutable case storage."},{"t":"Snapshot current account/admin-role state in AD, Okta, and vCenter to the case file","why":"A frozen picture of “who exists now” that later restoration and scope reviews will be diffed against."},{"t":"Execute containment (terminate sessions, freeze IdP admin changes, rotate exposed creds)","why":"Only after preservation: containment changes state, and state changes are exactly what must not precede evidence capture."}],"hint":"Two constraints drive the order: remote-first for anything that races retention, and no state change until preservation is done.","explain":"The order encodes two constraints. <b>Race retention remotely first:<\/b> the retention hold is one API call and stops the clock; ESXi hostd files rotate in 24h, so they are exported and hashed immediately after. <b>Capture the spine, then freeze the picture:<\/b> Okta’s system log is the campaign’s narrative; the account/role snapshot is the baseline every later diff (what did the attacker add, remove, re-scope) is run against. <b>Containment comes last<\/b> — not because it matters less, but because it mutates state, and mutating state before preservation is the error that makes incidents unprovable. When the adversary is live, minutes matter, which is why every step here is chosen to be minutes-fast and read-only until the last one.","study":"Evidence-first incident sequencing under a live adversary across identity, hypervisor, and endpoint layers."},{"id":"x14","type":"query","title":"Query editor: the bulk-deletion correlation","sc":[{"label":"Task from the incident commander","text":"“Give me a read-only query that pairs Okta lifecycle deactivate/delete events with their actor session, counts them per actor per 5-minute bucket, and flags buckets at or above 5 actions — excluding the documented offboarding runner (OKTA-CI-01) and its ticketed window. Nothing destructive.”"}],"q":"Type the query: Okta lifecycle deactivate/delete events, per-actor 5-minute bucket count, threshold ≥5, excluding the documented offboarding runner device.","prompt":"Editor notes: SPL/KQL-style syntax is fine. Graded elements: the lifecycle event names (deactivate and/or delete), the actor grouping, a 5-minute bucket, the ≥5 threshold expression, and an exclusion referencing the OKTA-CI-01 runner. Read-only queries only.","template":"sourcetype=okta  event_type= ","elements":[{"t":"Okta lifecycle events named (user.lifecycle.deactivate and/or delete variants)","any":["lifecycle.deactivate","lifecycle.delete","deactivate","delete.initiated","delete.completed"],"why":"The DC0010 events on the saas:okta channel are the raw material of the bulk detection."},{"t":"Per-actor grouping (by actor / stats by actor)","any":["by actor","group by actor","stats count by","by  actor","groupby actor"],"why":"BulkActionThreshold is per administrative identity — counting without grouping counts the platform, not the actor."},{"t":"Time bucket (5m / bin span=5m / tumbling window)","any":["5m","span=5m","bin ","tumblingwindow","5 minute"],"why":"“Within a short period” is operationalised as a bucket; 5 minutes matches the tasking."},{"t":"Threshold ≥5 (where count >= 5 / filter)","any":[">= 5",">=5",">= 5","count >= ","ge 5"],"why":"The threshold expression is the dial; omitting it leaves the query as raw counting."},{"t":"Exclusion of the documented runner (OKTA-CI-01 / offboarding exception)","any":["okta-ci-01","okta_ci_01","ci-01","offboard"],"why":"Without the scoped exception, every quarterly offboarding re-trips the alert — the exclusion is part of the detection, not a nice-to-have."}],"forbidden":[{"t":"state-changing or destructive operations","why":"Read-only analytics only — the incident commander asked for a lens, not a weapon."}],"danger":["| delete","rm -","remove ","update set","drop ","deactivate user","disable user"],"dangerNote":"Your query contains a state-changing element — a detection query must never mutate the IdP or the pipeline.","canon":"sourcetype=okta event_type IN (user.lifecycle.deactivate, user.lifecycle.delete.initiated, user.lifecycle.delete.completed)\n| bucket _time span=5m\n| stats count by actor, session_device, _time\n| where count >= 5 AND session_device != \"OKTA-CI-01\"\n| table _time, actor, session_device, count","hint":"Restating the tasking: five ingredients — event names, actor grouping, the 5-minute bucket, the ≥5 dial, and the runner exclusion.","explain":"The canonical query decomposes exactly into the five graded elements: the <b>lifecycle event set<\/b> (DC0010 on saas:okta), <b>per-actor grouping<\/b> (BulkActionThreshold is a property of an acting identity, not of the platform), the <b>5-minute bucket<\/b> (“short period” made computable), the <b>≥5 threshold<\/b> (the dial itself), and the <b>scoped runner exclusion<\/b> (OKTA-CI-01, documented and ticketed — without it the quarterly offboarding re-trips the rule). Any destructive keyword is flagged as a dangerous near-miss: a “detection” query that mutates the IdP is the pipeline-hazard anti-pattern. Note how the mutable-element vocabulary (BulkActionThreshold, SessionDeviceType) maps one-to-one onto query clauses — that mapping is the craft of turning an ATT&amp;CK analytic into working telemetry.","study":"Translating AN0339’s BulkActionThreshold + SessionDeviceType into a read-only SIEM correlation query."},{"id":"x09","type":"qcm","title":"The discipline of “do nothing yet”","sc":[{"label":"Queue item — 14:22","log":["EventCode=4724  SubjectUserName=Helpdesk3  TargetUserName=user-fr7  WorkstationName=HDP-02","Time: 14:22 (outside window). Sysmon (HDP-02): helpdesk portal (browser) → no console activity. Ticket #9031 matches target and time."]},{"label":"Context","text":"AN0334 fired because the reset happened outside the 02:00–05:00 window. Everything else aligns: expected actor (helpdesk shift), ticketed request, benign lineage (browser portal, no net.exe/powershell). The queue has 40 other items. A colleague: “outside-window resets are policy violations — escalate to the CISO every time.”"}],"q":"What is the correct disposition, and the discipline it demonstrates?","options":[{"t":"Close as benign with a note; add a weekly outside-window-helpdesk metric to the tuning review instead of escalating single events","why":"Correct — the analytic’s conditions identify a policy deviation, not an intrusion; the scalable answer is a metric, not CISO pages."},{"t":"Escalate to the CISO — any outside-window reset is an incident","why":"Near-miss — defensible in a zero-trust-everything world; here every condition except the clock is benign, and CISO paging on ticketed resets burns the credibility DET0120 alerts need."},{"t":"Disable the TimeWindow condition so outside-window resets stop alerting","why":"Near-miss — the opposite failure: the window deviation is real signal mass; removing the condition blinds the analytic to unticketed daytime resets."},{"t":"Skip investigating — any helpdesk activity is always benign","why":"Near-miss — the blanket-trust inversion; the same line with cmd.exe lineage would be the incident."}],"answer":0,"hint":"The constraint: “escalate everything” and “alert nothing” are both wholesale answers. What does a scoped one look like?","explain":"The disposition is <b>close as benign, with the deviation captured as a metric<\/b>. Every AN0334 condition except TimeWindow is satisfied and evidenced: expected actor, matching ticket, benign portal lineage. Escalating every outside-window reset to the CISO is the reflex that destroys an analytic’s credibility — alert fatigue is a security control failure, and T1531 detection depends on analysts still trusting AN0334. The opposite reflex (deleting the TimeWindow condition) removes real signal: an unticketed daytime reset from an interactive lineage must still alert. The senior discipline: <i>scope the response to what the artefacts prove<\/i> — a policy deviation here — and fix classes of noise with tuning reviews, not with per-event escalations. “Do nothing yet” is a decision, made deliberately and documented.","study":"AN0334 benign-disposition discipline: scoped verdicts, tuning-review metrics, and alert-credibility economics."},{"id":"x10","type":"branch","title":"Offboarding mask: separate the two streams","sc":[{"label":"ARTEFACT 1 — saas:okta, 18:00–18:12","log":["18:00:04  user.lifecycle.suspend ×60  actor=okta-offboard-svc  session device: OKTA-CI-01 (known automation runner)","18:00:05  change ticket CHG-8123 referenced (scheduled quarterly offboarding, 60 planned)"]},{"label":"ARTEFACT 2 — saas:okta, 18:15–18:16","log":["18:15:41  user.lifecycle.deactivate ×5  actor=okta-offboard-svc  session device: UNKNOWN-DEVICE-TYPE (never seen)","18:15:42  the 5 targets: payroll-admin, fin-svc-2, hr-admin-1, legacy-bkp, audit-x (none on the CHG-8123 list)"]},{"label":"Context","text":"AN0339 BulkActionThreshold fired on both streams. HR confirms 60 planned. The 5 extra targets include the payroll admin identity, and payroll processing runs tonight. Okta support queue response time: 4+ hours."}],"q":"Resolve the three steps.","steps":[{"q":"STEP 1 — How do the two streams differ in profile?","options":[{"t":"Stream 1 matches the documented automation profile (device, actor, ticket, count); stream 2 shares the actor but not the device, count, or target list","why":"Correct — the shared actor identity is the mask; device type, off-list targets, and timing break stream 2 out of profile."},{"t":"Both are the same event — 65 planned deactivations","why":"Wrong — CHG-8123 lists 60; the extra 5 are off-list and target privileged identities."},{"t":"Stream 2 is benign because the actor identity is the same","why":"Wrong — a compromised automation credential reuses the legitimate actor; SessionDeviceType exists precisely to catch the session change."}],"answer":0},{"q":"STEP 2 — Which mutable element separates the streams in the analytic’s own terms?","options":[{"t":"SessionDeviceType: the unknown device type on stream 2 is the flagged administrative-session anomaly","why":"Correct — AN0339 alerts when removals come from unfamiliar administrative session contexts; that is the separating signal."},{"t":"GeoThreshold — the extra 5 came from a different country","why":"Wrong — no geo data appears in the artefacts; do not import facts the artefacts do not contain."},{"t":"NonRootUIDThreshold","why":"Wrong — that is the Linux AN0335 element, irrelevant to Okta streams."}],"answer":0},{"q":"STEP 3 — Tonight, with payroll running, what is the correct action set?","options":[{"t":"Treat stream 2 as incident: preserve Okta logs, watch the 5 privileged targets, freeze changes to those 5 identities, and alert the payroll owner — without halting payroll","why":"Correct — scoped freeze and monitoring protect the named targets while payroll runs; halting payroll is the cost the scenario prices out."},{"t":"Halt payroll until all 5 accounts are restored","why":"Wrong — the accounts were deactivated, not corrupted; a scoped freeze protects them without the business cost."},{"t":"Treat both streams as one scheduled offboarding","why":"Wrong — the off-list privileged targets and unknown session device are the anomaly; merging the streams is the mask’s purpose."}],"answer":0}],"hint":"The mask: one actor identity covers two sessions. Which mutable element sees through it — and which 5 names make it urgent?","explain":"The two streams share an <b>actor<\/b> and differ everywhere else: documented device, ticketed list, and expected count on stream 1; unknown session device, off-list privileged targets, and off-schedule timing on stream 2. The mutable element that separates them is <b>SessionDeviceType<\/b> — AN0339 alerts on removals from unfamiliar administrative session contexts, which is exactly the compromised-automation-credential pattern (a stolen runner credential reuses the legitimate actor identity). The correct action set protects the named crown jewels — preserve logs, watch and freeze changes on the five privileged identities, alert the payroll owner — <i>without<\/i> halting payroll, which the scenario prices out. Campaigns hide inside legitimate bulk work; the session attributes are where they show.","study":"AN0339: BulkActionThreshold vs SessionDeviceType — separating legitimate bulk work from masked adversary action."},{"id":"x11","type":"multi","title":"Attribution discipline under pressure","sc":[{"label":"CTI pack — excerpt","text":"“Akira deletes administrator accounts prior to encryption. DEADWOOD changes local and domain passwords via net.exe to random strings and terminates winlogon.exe. LAPSUS$ removed global admin accounts to lock an organisation out. LockerGoga and MegaCortex change passwords and log users off.”"},{"label":"Your incident","text":"Windows: net.exe password randomisation on 6 admin accounts from an interactive lineage; admin accounts deleted in Okta and ESXi; no encryption observed yet; no clearnet infrastructure overlap with known Akira ops; one departed contractor had admin rights until last month."}],"q":"Select every statement that is defensible as written.","options":[{"t":"The TTP pattern (admin removal pre-encryption window, net.exe randomisation) is consistent with an Akira-style ransomware playbook","why":"Correct — TTP-level consistency is a legitimate statement; it drives urgency without claiming identity."},{"t":"This is confirmed Akira activity","why":"Wrong — no infrastructure overlap and no encryption observed; confirmation requires more than TTP overlap, and overstating it misdirects response."},{"t":"The removal of admin accounts directly serves a disruption objective regardless of which actor performs it","why":"Correct — the technique’s purpose (blocking response) holds independently of attribution; that is why DET0120 exists."},{"t":"A malicious-insider hypothesis remains open given the departed contractor’s access","why":"Correct — alternative hypotheses with standing access are exactly what evidence-based discipline keeps alive until excluded."},{"t":"Attribution questions can wait until after containment scoping — the response is the same either way at this stage","why":"Correct — containment decisions key on behaviour and blast radius, not on naming the actor; sequencing attribution after scoping is sound."},{"t":"Because net.exe appears in DEADWOOD reporting, this is DEADWOOD","why":"Wrong — single-tool matching is the classic attribution error; net.exe is universal Windows tooling, which is why T1531 procedure examples cite several unrelated actors using it."}],"correct":[0,2,3,4],"hint":"Two statements claim identity from thin evidence; two others confuse a tool with a group. Which statements survive?","explain":"Four survive. <b>Playbook-level consistency<\/b> is defensible and useful (it sets urgency and the pre-encryption hypothesis). <b>Technique-purpose independence<\/b> holds regardless of actor — admin removal blocks response, full stop. <b>The insider alternative stays open<\/b>: a departed contractor with standing admin rights is a hypothesis the evidence cannot exclude, and excluding it (token revocation history, source-device checks) is a scoping task, not a hunch. <b>Attribution sequencing<\/b> is sound: containment keys on behaviour and blast radius. The failures are the two identity claims — “confirmed Akira” from TTP overlap alone, and “this is DEADWOOD” from a single universal tool (net.exe appears in multiple groups’ T1531 procedure examples precisely because it is ordinary). Attribution discipline is a detection-strategy skill: DET0120 tells you <i>what<\/i> happened; who did it needs more world.","study":"T1531 procedure examples (Akira, DEADWOOD, LAPSUS$, LockerGoga, MegaCortex) and TTP-overlap vs confirmation."},{"id":"x12","type":"qcm","title":"Do not silence the alarm mid-fire","sc":[{"label":"Incident state","text":"Hour 2 of the multi-platform campaign. AN0334 has produced 14 alerts; 13 are benign helpdesk noise, 1 was the campaign hit that opened the case. The IT director, mid-call: “Turn that rule off until the incident is over — my team cannot work with the noise.” The SOC lead asks you to decide."}],"q":"What is the correct decision and reasoning?","options":[{"t":"Keep AN0334 live; apply a temporary, ticketed exception for the helpdesk identities’ in-window resets — the rule is the only Windows coverage for the technique you are fighting","why":"Correct — scoped noise reduction preserves the detection surface; disabling it mid-campaign blinds you to the attacker’s next Windows move."},{"t":"Disable AN0334 until the incident closes — the noise is real and the incident is already found","why":"Near-miss — defensible only if another Windows T1531 coverage existed; it does not, and campaigns iterate — the next reset wave is your tripwire."},{"t":"Disable all DET0120 analytics to quiet the boards","why":"Near-miss — same error multiplied across platforms; defensible in no world except “the attacker also wants this”."},{"t":"Leave everything as is and tell the director to endure it","why":"Near-miss — the coverage instinct is right but the response dismisses a real operational problem; the tuning lever exists precisely for this."}],"answer":0,"hint":"The constraint: no other analytic covers Windows account-modification lineage. Which lever reduces noise without reducing coverage?","explain":"<b>Keep the analytic; scope the noise.<\/b> AN0334 is the strategy’s only Windows coverage — disabling it mid-campaign removes the tripwire for the attacker’s next reset wave, and campaigns iterate. The 13 benign alerts have a shape (helpdesk identities, in-window, portal lineage), which is exactly what a temporary, ticketed UserContext/TimeWindow exception absorbs — the same scoped-exception discipline as the tuning exercise, applied under fire. “Turn it off” and “endure it” are both wholesale answers; the senior move is the scoped one, communicated to the director with the reasoning. The general law: during an incident involving technique X, you do not disable the analytics that detect X — you reshape their exceptions around documented benign work and keep the weapon pointed at the adversary.","study":"Mid-incident tuning: scoped exceptions vs analytic disablement; coverage preservation under operational pressure."},{"id":"x13","type":"qcm","title":"ESXi: the role that should not exist","sc":[{"label":"ARTEFACT 1 — esxi:vpxa","log":["02:55:11  login as svc-legacy-token from 10[.]0[.]0[.]41 (inside ExpectedIPs)  role: Viewer  session=77a1…"]},{"label":"ARTEFACT 2 — esxi:hostd","log":["02:57:39  hostd method=RemoveUser userName=vpxa_mgmt via vSphere API session=77a1…","02:57:40  authorization note: svc-legacy-token holds role Viewer; RemoveUser requires Administrator"]},{"label":"Context","text":"The IP is expected; the role is not. A Viewer cannot remove users — the action succeeded anyway, which implies the token’s effective rights exceed its assigned role (stale privileged token, orphaned service credential, or API authorization bypass). No maintenance window is open."}],"q":"Which signal wins and what does it imply for the immediate next step?","options":[{"t":"The role anomaly wins: expected IPs tell you where, not who — a Viewer performing RemoveUser implies over-privileged or bypassed credentials; rotate/revoke that token now","why":"Correct — authorization is the security boundary; the IP condition passing is exactly why this pattern survives naive tuning, and the live token must die before analysis continues."},{"t":"The IP wins: the source is inside ExpectedIPs, so the action is trusted","why":"Near-miss — the IP allowlist exists to flag unexpected sources, not to bless unexpected actions from expected ones; role is the boundary that was crossed."},{"t":"Neither: the RemoveUser target (vpxa_mgmt) suggests system housekeeping","why":"Near-miss — removing the vpxa service identity is the opposite of housekeeping; it is how one disables hypervisor management telemetry before deeper action."},{"t":"Escalate to the vendor before touching anything","why":"Near-miss — vendor engagement is fine later; a live over-privileged token mid-campaign is revoked first, investigated second."}],"answer":0,"hint":"The constraint: both conditions of AN0337 are being tested — one passes, one fails. Which one is the security boundary?","explain":"<b>The role anomaly wins.<\/b> ExpectedIPs answers “where from”; RemoteUserRole answers “what was authorised”. A Viewer removing users — with the action succeeding — means the credential’s effective rights exceed its assignment: a stale token, an orphaned service credential, or a bypass. The IP passing is precisely why this pattern evades naive tuning, and why AN0337 carries both elements. The target makes it worse: <b>vpxa_mgmt<\/b> is the management-agent identity — removing it is how an attacker degrades hypervisor telemetry before deeper action, which is “looks like housekeeping” but is the alarming case. The next step is immediate: revoke/rotate the token, then forensics. The lesson generalises: when one correlation condition passes and the other fails in an impossible direction, trust the authorization failure.","study":"AN0337 dual conditions (ExpectedIPs, RemoteUserRole) and telemetry-degradation via service-identity removal."},{"id":"x15","type":"branch","title":"Endgame: freeze the IdP during payroll week","sc":[{"label":"ARTEFACT 1 — saas:okta (03:04)","log":["03:04:11  admin role granted: new admin svc-okta2  actor: emergency-reset-svc  device: UNKNOWN-DEVICE-TYPE","03:04:13  user.lifecycle.deactivate ×3  actor: svc-okta2 (first actions of the new admin)"]},{"label":"ARTEFACT 2 — m365:signinlogs + helpdesk","log":["03:02:50  sign-in svc-okta2  MFA: satisfied (push approved)  device: unknown-browser  geo: unlisted ASN","03:03:30  helpdesk ticket #9177: “user reports MFA push they did not approve — 03:01”"]},{"label":"Stakeholder state","text":"Payroll processes Thursday 06:00 from the same IdP. The change-freeze policy allows an emergency freeze only with CISO sign-off. Attacker sessions believed live. The board wants “no disruption to payroll at any cost.” The CISO is on a plane for 40 minutes; the deputy can sign if you document the cost acceptance."}],"q":"Resolve the four steps.","steps":[{"q":"STEP 1 — What do the MFA contradiction and the new admin together establish?","options":[{"t":"IdP control compromise: a push was approved at 03:01 that no user made, and two minutes later a new admin exists and is acting","why":"Correct — the disapproved push plus immediate privileged creation is the takeover chain; the artefacts corroborate each other."},{"t":"A fat-fingered helpdesk change with an unrelated MFA complaint","why":"Wrong — the timing (03:01 push → 03:02 sign-in → 03:04 admin grant) and the unknown device make coincidence implausible."},{"t":"Nothing — MFA was satisfied, so the session is legitimate","why":"Wrong — “satisfied” is the problem: someone approved a push they did not authorise; MFA-satisfied is not MFA-legitimate."}],"answer":0},{"q":"STEP 2 — The board says “no disruption to payroll at any cost.” Which cost does the correct action actually accept?","options":[{"t":"Freezing IdP admin changes until the actor is evicted — payroll itself is unaffected, but emergency admin work (new hires, resets) is delayed","why":"Correct — freeze admin changes, not authentication: payroll runs, emergency admin tasks queue, and the cost is documented and accepted."},{"t":"Nothing — no cost is acceptable, so no freeze","why":"Wrong — the attacker is minting admins; a live IdP compromise is the bigger payroll risk than a change freeze."},{"t":"Shutting the IdP down until 06:00","why":"Wrong — that <i>is<\/i> the payroll disruption the board priced out; authentication freeze and admin-change freeze are different dials."}],"answer":0},{"q":"STEP 3 — The CISO is unreachable for 40 minutes. What is the correct governance move?","options":[{"t":"Deputy signs the emergency freeze now with the cost-acceptance documented; the CISO ratifies on landing","why":"Correct — the policy provides the path; documenting cost acceptance is exactly what the deputy sign-off exists for."},{"t":"Wait for the CISO — a freeze without their signature is a violation","why":"Wrong — the policy anticipates absence; waiting 40 minutes with a live admin-minting actor is the actual violation of duty."},{"t":"Act without any sign-off — incidents override policy","why":"Wrong — governance exists for this moment; undocumented unilateral freezes create the next incident (audit, legal)."}],"answer":0},{"q":"STEP 4 — Which two actions complete the eviction once the freeze is in place?","options":[{"t":"Revoke all sessions for emergency-reset-svc and svc-okta2, and rotate the emergency-reset-svc credential — then hunt how the push was approved","why":"Correct — kill the minted admin’s access and the minting credential, then chase the approval path (SIM-swap, fatigue, stolen device) as the open question."},{"t":"Delete svc-okta2 only — the emergency-reset-svc was probably legitimate","why":"Wrong — the minting identity is the compromise origin; leaving it live re-mints admins the moment you look away."},{"t":"Wait for the attacker to act again to confirm scope before touching sessions","why":"Wrong — with a freeze in place, waiting only benefits the adversary; the artefacts already justify eviction."}],"answer":0}],"hint":"Restating constraints: MFA-satisfied is not MFA-legitimate; “admin-change freeze” and “authentication freeze” are different dials; the deputy path exists in policy.","explain":"The chain establishes an <b>IdP control compromise<\/b>: a push approved at 03:01 that its owner denies, a sign-in from an unknown device on an unlisted ASN at 03:02, and a minted admin (<b>svc-okta2<\/b>) executing deactivations at 03:04. The board’s “no disruption to payroll” is satisfied by choosing the right dial: freeze <i>admin changes<\/i>, not <i>authentication<\/i> — payroll runs, emergency admin work queues, the cost is documented. Governance is part of the technique here: the deputy sign-off with cost acceptance is the policy’s designed path, and waiting for a plane is dereliction, while acting unilaterally creates the audit incident. Eviction kills both the minted admin and the <b>minting credential<\/b> (emergency-reset-svc) — leaving either re-creates the attacker — and the open hunt is <i>how the push was approved<\/i>: SIM swap, push fatigue, or a stolen device. This is the endgame DET0120 exists to buy you time for.","study":"IdP compromise response: admin-change freeze vs authentication freeze, emergency governance, eviction of minted identities."}],"timerSec":2700};</script>

 var w=el('div');
 var rows=[];
 for(var r=0;r<ex.rows.length;r++){
  var row=el('div','trow');
  var t=el('div','tl');t.innerHTML=esc(ex.rows[r].t);
  var seg=el('div','segrow');
  var btns=[];
  for(var l=0;l<ex.labels.length;l++){
   var b=document.createElement('button');
   (function(bb,rr,ll){
    bb.className='seg';bb.type='button';bb.textContent=ex.labels[ll];
    bb.onclick=function(){
     if(S.checked[CUR.k])return;
     rows[rr]=ll;
     for(var q=0;q<btns.length;q++){btns[q].classList.remove('sel');btns[q].setAttribute('aria-pressed','false');}
     bb.classList.add('sel');bb.setAttribute('aria-pressed','true');
    };
   })(b,r,l);
   btns.push(b);
   seg.appendChild(b);
  }
  row.appendChild(t);row.appendChild(seg);w.appendChild(row);
 }
 return{el:w,collect:function(){
  var vals=[],any=false;
  for(var i=0;i<ex.rows.length;i++){vals.push(rows[i]==null?-1:rows[i]);if(rows[i]!=null)any=true;}
  return{vals:vals,empty:!any};
 }};
}
function wBlank(ex){
 var w=el('div');
 var bank=el('div','bank');
 var words=shuffle(ex.words.slice());
 for(var i=0;i<words.length;i++){
  var c=el('span','chip');c.textContent=words[i];
  (function(wd,ch){ch.addEventListener('click',function(){
   if(S.checked[CUR.k])return;
   var ins=w.querySelectorAll('input.blank');
   for(var q=0;q<ins.length;q++){if(!ins[q].value){ins[q].value=wd;break;}}
  });})(words[i],c);
  bank.appendChild(c);
 }
 var html=ex.text;
 var parts=html.split('____');
 var holder=el('div');
 holder.innerHTML=parts[0];
 var inputs=[];
 for(var b=1;b<parts.length;b++){
  var inp=document.createElement('input');inp.className='blank';
  inp.setAttribute('aria-label','Blank '+(b));
  holder.appendChild(inp);inputs.push(inp);
  holder.appendChild(document.createTextNode(''));
  var sp=el('span');sp.innerHTML=parts[b];
  holder.appendChild(sp);
 }
 w.appendChild(holder);
 w.appendChild(el('p','note','Type your answers, or click a word from the bank to fill a blank.'));
 w.appendChild(bank);
 return{el:w,collect:function(){
  var vals=[];for(var i=0;i<inputs.length;i++)vals.push(inputs[i].value);
  var any=vals.some(function(v){return v&&v.trim().length>0;});
  return{vals:vals,empty:!any};
 }};
}
function wBranch(ex){
 PICK={cur:null};ex._step=0;ex._picks=[];
 var w=el('div');
 var head=el('div','steps','STEP 1 OF '+ex.steps.length);
 var done=el('div');
 var area=el('div');
 w.appendChild(head);w.appendChild(done);w.appendChild(area);
 function renderStep(){
  head.textContent='STEP '+(ex._step+1)+' OF '+ex.steps.length;
  area.innerHTML='';
  var st=ex.steps[ex._step];
  var q=el('p','qtext',esc(st.q));
  area.appendChild(q);
  var L=['A','B','C','D','E','F'];
  for(var i=0;i<st.options.length;i++){
   var btn=document.createElement('button');
   (function(oi,b2){
    b2.className='opt';b2.type='button';
    b2.innerHTML='<span class="olab">'+esc(L[oi])+'</span><span style="flex:1">'+esc(st.options[oi].t)+'</span>';
    b2.onclick=function(){
     if(S.checked[CUR.k])return;
     ex._picks[ex._step]=oi;
     done.innerHTML='<div class="stepdone">Step '+(ex._step+1)+' recorded: <b>'+esc(st.options[oi].t)+'</b></div>';
     if(ex._step<ex.steps.length-1){ex._step++;renderStep();}
     else{done.innerHTML+='<div class="stepdone">All steps recorded — press Check to grade the whole chain.</div>';}
    };
   })(i,btn);
   area.appendChild(btn);
  }
 }
 renderStep();
 return{el:w,collect:function(){
  var sel=[];for(var i=0;i<ex.steps.length;i++){if(ex._picks[i]==null)return{empty:true};sel.push(ex._picks[i]);}
  return{sel:sel};
 }};
}
function wQuery(ex){
 var w=el('div');
 w.appendChild(el('p','note',esc(ex.prompt||'Type your query in the editor below, then press Check.')));
 var ta=document.createElement('textarea');ta.className='qry';
 ta.setAttribute('aria-label','Query editor');
 if(ex.template)ta.value=ex.template;
 w.appendChild(ta);
 return{el:w,collect:function(){return{text:ta.value,empty:ta.value.trim().length===0};}};
}
/* ---------- grading ---------- */
function grade(ex,got){
 var rows=[],N=0,H=0,W=0;
 var i;
 if(ex.type==='qcm'){
  N=1;var sel=got.sel[0];var ok=sel===ex.answer;
  if(ok)H++;else if(sel>=0)W++;
  rows.push({s:ok?'ok':'bad',t:'You selected: '+ex.options[sel].t,
   why:ok?ex.options[ex.answer].why:ex.options[sel].why});
  if(!ok)rows.push({s:'miss',t:'Correct answer: '+ex.options[ex.answer].t,why:ex.options[ex.answer].why});
 }
 else if(ex.type==='multi'){
  var corrIdx=ex.correct;
  N=corrIdx.length;
  var selMap={};for(i=0;i<got.sel.length;i++)selMap[got.sel[i]]=1;
  for(i=0;i<corrIdx.length;i++){
   if(selMap[corrIdx[i]]){H++;rows.push({s:'ok',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});}
   else rows.push({s:'miss',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});
  }
  for(i=0;i<got.sel.length;i++){
   var s=got.sel[i];var isCorr=false;
   for(var c=0;c<corrIdx.length;c++)if(corrIdx[c]===s)isCorr=true;
   if(!isCorr){W++;rows.push({s:'bad',t:ex.options[s].t,why:ex.options[s].why});}
  }
 }
 else if(ex.type==='match'){
  N=ex.lefts.length;
  for(i=0;i<ex.lefts.length;i++){
   var okM=got.vals[i]===ex.lefts[i].r;
   if(okM)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okM?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.lefts[i].t+' → '+(got.vals[i]>=0?ex.rights[got.vals[i]].t:'no answer'),
    why:ex.lefts[i].why});
  }
 }
 else if(ex.type==='dnd'){
  N=ex.items.length;
  for(i=0;i<ex.items.length;i++){
   var okD=got.vals[i]===ex.items[i].zone;
   if(okD)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okD?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.items[i].t+' → '+(got.vals[i]>=0?ex.zones[got.vals[i]].t:'not placed'),
    why:ex.items[i].why});
  }
 }
 else if(ex.type==='order'){
  N=ex.seq.length;
  for(i=0;i<ex.seq.length;i++){
   var okO=got.vals[i]===i+1;
   if(okO)H++;else if(got.vals[i]>0)W++;
   rows.push({s:okO?'ok':(got.vals[i]>0?'bad':'miss'),
    t:'“'+ex.seq[i].t+'” correct position: '+(i+1)+(got.vals[i]>0?' — you chose '+got.vals[i]:' — no position chosen'),
    why:ex.seq[i].why});
  }
 }
 else if(ex.type==='triage'){
  N=ex.rows.length;
  for(i=0;i<ex.rows.length;i++){
   var okT=got.vals[i]===ex.rows[i].c;
   if(okT)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okT?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.rows[i].t+' → your verdict: '+(got.vals[i]>=0?ex.labels[got.vals[i]]:'none'),
    why:ex.rows[i].why});
  }
 }
 else if(ex.type==='blank'){
  N=ex.blanks.length;
  for(i=0;i<ex.blanks.length;i++){
   var v=norm(got.vals[i]);
   var okB=false;for(var a=0;a<ex.blanks[i].accept.length;a++)if(v===norm(ex.blanks[i].accept[a]))okB=true;
   if(okB)H++;else if(v.length>0)W++;
   rows.push({s:okB?'ok':(v.length>0?'bad':'miss'),
    t:'Blank '+(i+1)+': your answer “'+(got.vals[i]||'')+'” — expected “'+ex.blanks[i].accept[0]+'”',
    why:ex.blanks[i].why});
  }
 }
 else if(ex.type==='branch'){
  N=ex.steps.length;
  for(i=0;i<ex.steps.length;i++){
   var okS=got.sel[i]===ex.steps[i].answer;
   if(okS)H++;else W++;
   rows.push({s:okS?'ok':'bad',
    t:'Step '+(i+1)+': you chose “'+ex.steps[i].options[got.sel[i]].t+'”',
    why:okS?ex.steps[i].options[got.sel[i]].why:(ex.steps[i].options[got.sel[i]].why+' Correct: '+ex.steps[i].options[ex.steps[i].answer].t+' — '+ex.steps[i].options[ex.steps[i].answer].why)});
  }
 }
 else if(ex.type==='query'){
  var q=norm(got.text);
  N=ex.elements.length;
  var missList=[];var dgr=null;
  for(i=0;i<ex.elements.length;i++){
   var okQ=false;
   for(var p=0;p<ex.elements[i].any.length;p++){
    if(q.indexOf(norm(ex.elements[i].any[p]))>=0){okQ=true;break;}
   }
   if(okQ)H++;else{missList.push(ex.elements[i]);rows.push({s:'miss',t:'Missing element: '+ex.elements[i].t,why:ex.elements[i].why});}
  }
  if(ex.forbidden){
   for(i=0;i<ex.forbidden.length;i++){
    if(q.indexOf(norm(ex.forbidden[i].t))>=0){W++;rows.push({s:'bad',t:'Harmful element found: '+ex.forbidden[i].t,why:ex.forbidden[i].why});}
   }
  }
  if(missList.length===0)rows.unshift({s:'ok',t:'All required elements present in the query.',why:''});
  if(ex.danger){
   for(i=0;i<ex.danger.length;i++){
    if(q.indexOf(norm(ex.danger[i]))>=0)dgr=ex.dangerNote||'Your query contains a state-changing or destructive element.';
   }
  }
  var credit=Math.max(0,(H-W)/N);
  return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:dgr,credit:credit};
 }
 var credit=Math.max(0,(H-W)/N);
 if(ex.type==='qcm')credit=credit>0?1:0;
 return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:null,credit:credit};
}
/* ---------- review skipped ---------- */
function renderReview(){
 clearView();
 var pend=skippedList();
 var w=el('div','wrap');
 var h='<div class="card"><h2>Review skipped exercises</h2>';
 if(pend.length===0){
  h+='<p class="muted">⚠ No skipped exercises left. You can submit now.</p>';
 }else{
  h+='<p class="muted">You skipped '+pend.length+' exercise(s). You can go back and answer them while the timer still runs. A skipped-and-never-answered exercise is excluded from your score.</p>';
  for(var i=0;i<pend.length;i++){
   var ex=EX.ex[pend[i]];
   h+='<div class="skipcard"><span class="st">⚠ Skipped</span><span class="sd">'+esc(ex.title)+'</span>'
   +'<button data-k="'+pend[i]+'" class="ansbtn">Answer it</button></div>';
  }
 }
 h+='<div class="actions"><button class="primary" id="btnFinal">⏭ Submit exam</button>'
 +'<span class="note">Submitting excludes anything still unanswered.</span></div></div>';
 w.innerHTML=h;view.appendChild(w);
 var btns=w.querySelectorAll('.ansbtn');
 for(var b=0;b<btns.length;b++){
  (function(k){btns[b].onclick=function(){renderExercise(k,true);};})(parseInt(btns[b].getAttribute('data-k'),10));
 }
 document.getElementById('btnFinal').onclick=function(){finalize(false);};
}
/* ---------- results ---------- */
function finalize(byTimeout){
 stopInt();
 if(S.state!=='ENDED')setTimerState('ENDED');
 clearView();
 var full=0,part=0,zero=0,partSum=0,answered=0,i;
 for(i=0;i<EX.ex.length;i++){
  if(S.checked[i]){answered++;var c=S.marks[i];
   if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
 }
 var skipped=EX.ex.length-answered;
 var sum=0;for(i=0;i<EX.ex.length;i++)if(S.checked[i])sum+=S.marks[i];
 var pct=answered>0?Math.round(sum/answered*100):0;
 var pass=pct>=70;
 var w=el('div','wrap');
 var manS=Math.round(S.manMs/1000),fbS=Math.round(S.fbMs/1000);
 var h='<div class="card"><h1>Results — '+esc(META.title)+'</h1>'
 +'<div class="kv"><span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +'<span>Answered: '+answered+' of '+EX.ex.length+'</span>'
 +(byTimeout?'<span>⏱ Time ran out — unanswered exercises were excluded</span>':'')+'</div>'
 +'<div class="bigres">'
 +'<div class="res ok"><div class="rn">'+full+'</div><div class="rl">✓ Fully correct</div></div>'
 +'<div class="res part"><div class="rn">'+part+'</div><div class="rl">✓ Partially correct'+(part>0?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'
 +'<div class="res bad"><div class="rn">'+zero+'</div><div class="rl">✗ Fully incorrect</div></div>'
 +'<div class="res skip"><div class="rn">'+skipped+'</div><div class="rl">⚠ Skipped — excluded</div></div>'
 +'</div>'
 +'<p style="font-size:20px"><b>Final score: '+sum.toFixed(1)+' / '+answered+'</b> — '+pct+'% (pass mark 70%)</p>'
 +'<div class="verdict '+(pass?'pass':'fail')+'"><div class="vt">'+(pass?'✓ PASS':'✗ FAIL')+'</div>'
 +'<p>'+(pass?'Well done. You reached the pass mark for this severity.':'You must retake this exam to reach 70%. Review the explanations, then press Retake Exam.')+'</p></div>'
 +'<p class="small muted">Time accounting: '+fmtT(manS)+' paused manually (breaks) · '+fmtT(fbS)+' reviewing feedback (auto-pause after Check).</p>'
 +'<div class="actions"><button class="primary" id="btnRetake">↻ Retake Exam</button></div></div>';
 w.innerHTML=h;view.appendChild(w);
 document.getElementById('btnRetake').onclick=function(){startExam();};
 reportScore(sum,answered);
}
function reportScore(creditSum,answeredCount){
 if(S.reported)return;S.reported=true;
 var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 window.__learner={username:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
});
/* ---------- boot ---------- */
S.remain=EX.timerSec;
renderHeader();
renderIntro();
</script>
