window.INTRO = {
  learn: "<p>This exam takes the next step with <b>DET0537</b>, the MITRE ATT&amp;CK Detection Strategy for <b>supply chain attacks on software</b> (technique <b>T1195 — Supply Chain Compromise</b>). You already know the three-step story — tamper, install, first-run. Here you learn to <b>read the telemetry</b> that proves each step and to <b>tune the strategy</b> so it stays useful in a real SOC.</p>"

/* ---------------- timer ---------------- */
setInterval(function(){
  if(G.view!=='exam') return;
  if(G.tstate==='RUNNING'){ G.remain--; if(G.remain<=0){G.remain=0;endByTimeout();} }
  else if(G.tstate==='PAUSED_MANUAL'){ G.pauseManualSec++; }
  else if(G.tstate==='PAUSED_AUTO_CHECK'){ G.pauseAutoSec++; }
  var t=document.getElementById('hTimer'); if(t) t.textContent=fmtT(G.remain);
},1000);
function manualPause(){
  if(G.tstate==='RUNNING'||G.tstate==='PAUSED_AUTO_CHECK'){
    G.pausedFrom=G.tstate; G.tstate='PAUSED_MANUAL'; updHeader();
    var ov=document.createElement('div'); ov.className='overlay'; ov.id='pauseOv';
    ov.innerHTML='<div class="pcard card"><div class="bigpause">⏸</div><div class="ptit">⏸ PAUSED — manual</div><p class="psub">The exercise is hidden so you cannot read or answer it while paused. Your break is not counted against the timer.</p><button class="btn primary" id="resumeBtn">▶ Resume</button></div>';
    document.body.appendChild(ov);
    document.getElementById('resumeBtn').addEventListener('click',function(){
      G.tstate=G.pausedFrom||'RUNNING'; G.pausedFrom=null;
      var o=document.getElementById('pauseOv'); if(o) o.parentNode.removeChild(o); updHeader();
    });
  }
}
function endByTimeout(){
  if(G.tstate==='ENDED') return;
  G.tstate='ENDED'; G.timedOut=true; updHeader(); renderResults();
}
/* ---------------- navigation ---------------- */
function renderCurrent(){
  var idx=G.reviewOf!=null? G.reviewOf : G.cur;
  renderExercise(idx, G.reviewOf!=null);
}
function doHint(){
  var i=G.order[G.reviewOf!=null?G.reviewOf:G.cur];
  if(G.done[i]||G.hint[i]) return;
  var ex=EX[i];
  if(!ex.hint) return;
  G.hint[i]=true;

  if(box){box.innerHTML='<span class="hlab">◆ Hint (−10% of this exercise credit)</span>'+esc(ex.hint);box.style.display='block';}
}
function doSkip(){
  if(G.reviewOf!=null) return;
  var i=G.cur;
  if(G.done[i]) return;
  if(G.skipped.indexOf(i)<0) G.skipped.push(i);
  nextUnanswered();
}
function nextUnanswered(){
  for(var k=G.cur+1;k<EX.length;k++){ if(!G.done[G.order[k]]){G.cur=k;renderCurrent();updHeader();return;} }
  for(var k2=0;k2<EX.length;k2++){ if(!G.done[G.order[k2]]){G.cur=k2;renderCurrent();updHeader();return;} }
  openReview();
}
function advanceAfterCheck(){
  if(G.reviewOf!=null){ openReview(); return; }
  if(G.cur>=EX.length-1){
    if(G.skipped.length>0){ openReview(); } else { renderResults(); }
  } else { G.cur++; renderCurrent(); updHeader(); }
}
/* ---------------- scenario / blocks ---------------- */
var LOGREG = {}; var logkeyCounter = 0;
function artefactHTML(a){
  var body;

  }

}
function hydrateLogs(root){
  var els=root.querySelectorAll('[data-logkey]');
  for(var i=0;i<els.length;i++){ els[i].appendChild(buildLogPanel(LOGREG[els[i].getAttribute('data-logkey')])); }

function buildLogPanel(lines){
  var d=document.createElement('div'); d.className='logpanel';
  var f=document.createElement('div'); f.className='logfilter';
  f.innerHTML='<span class="c small">filter:</span>';
  var inp=document.createElement('input'); inp.type='text'; inp.placeholder='type to filter log lines (e.g. EventCode, host, domain)';
  var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=lines.length+' / '+lines.length+' lines';
  f.appendChild(inp); f.appendChild(cnt);
  var box=document.createElement('div'); box.className='loglines';
  function draw(){
    var q=inp.value.toLowerCase(); box.innerHTML=''; var n=0;
    for(var i=0;i<lines.length;i++){
      if(q && lines[i].toLowerCase().indexOf(q)<0) continue;
      n++;
      var s=document.createElement('span'); s.className='logline'; s.innerHTML=hlLog(lines[i]);
      box.appendChild(s);
    }

  }
  inp.addEventListener('input',draw); draw();
  d.appendChild(f); d.appendChild(box); return d;

/* ---------------- runtime prep ---------------- */
function resign(arr){
  return sh(arr.map(function(t,j){return {t:t,orig:j};})).map(function(o,pos){return {k:String.fromCharCode(65+pos),t:o.t,orig:o.orig};});
}
function rt(i){
  var ex=EX[G.order[i]];
  if(ex._rt) return ex._rt;
  var v={touched:false};
  var k=ex.type;
  if(k==='qcm'||(k==='log'&&ex.answer.kind==='qcm')){
    v.opts=resign(ex.options); v.sel=null;
  } else if(k==='clickline'||(k==='log'&&ex.answer.kind==='click')){
    v.sel=null;
  } else if(k==='qcmmulti'){
    v.opts=resign(ex.options); v.sel=[];
  } else if(k==='match'){
    v.rights=sh(ex.pairs.map(function(p,j){return j;}));
    v.assign={};
  } else if(k==='dnd'){
    v.items=sh(ex.items.map(function(it,j){return j;}));
    v.placed={};
  } else if(k==='order'){
    v.seq=sh(ex.items.map(function(_,j){return j;}));
  } else if(k==='fill'){
    v.bank=sh(ex.bank.slice());
    v.slots=[];
    for(var s=0;s<ex.slots.length;s++){v.slots.push(null);}
    v.selSlot=0;
  } else if(k==='branch'){
    v.steps=ex.steps.map(function(st){return {opts:resign(st.options)};});
    v.step=0; v.sels={};
  } else if(k==='query'){
    v.text='';
  } else if(k==='log'&&ex.answer.kind==='click'){
    v.sel=null;
  }
  ex._rt=v; return v;
}

function buildBtns(ex,v,review){
  var row=document.getElementById('btnRow'); row.innerHTML='';

function idxOf(review){ return review? G.reviewOf : G.cur; }
function mkBtn(txt,cls,fn){var b=document.createElement('button');b.className=cls;b.innerHTML=txt;b.addEventListener('click',fn);return b;}
function resumeAfterCheck(){ if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';} advanceAfterCheck(); }
/* ---------------- widgets ---------------- */
function buildWidget(ex,v){
  var area=document.getElementById('ansArea'); area.innerHTML='';
  var k=ex.type;
  if(k==='qcm'||k==='qcmmulti'||(k==='log'&&ex.answer.kind==='qcm')){ buildOptions(area,ex,v,k==='qcmmulti'); }
  else if(k==='match'){ buildMatch(area,ex,v); }
  else if(k==='dnd'){ buildDnd(area,ex,v); }
  else if(k==='order'){ buildOrder(area,ex,v); }
  else if(k==='fill'){ buildFill(area,ex,v); }
  else if(k==='clickline'||(k==='log'&&ex.answer.kind==='click')){ buildClick(area,ex,v,k==='log'? ex.answer.lines : ex.lines); }
  else if(k==='branch'){ buildBranch(area,ex,v); }
  else if(k==='query'){ buildQuery(area,ex,v); }
}
function logPanel(ex){ return buildLogPanel(ex.log.lines); }
function buildOptions(area,ex,v,multi){
  var box=document.createElement('div'); box.className='opts';
  var w = ex.type==='log'? ex.answer : ex;
  v.opts.forEach(function(o){
    var b=document.createElement('button'); b.type='button'; b.className='opt'; b.setAttribute('role',multi?'checkbox':'radio');
    b.innerHTML='<span class="opt-k">'+o.k+'.</span><span>'+esc(o.t)+'</span>';
    b.addEventListener('click',function(){
      if(G.done[G.order[idxOf(G.reviewOf!=null)]]) return;
      v.touched=true;

        var p=v.sel.indexOf(o.k);
        if(p>=0){v.sel.splice(p,1);b.classList.remove('sel');b.setAttribute('aria-checked','false');}
        else{v.sel.push(o.k);b.classList.add('sel');b.setAttribute('aria-checked','true');}

function buildClick(area,ex,v,lines){

function buildMatch(area,ex,v){

function buildDnd(area,ex,v){

function buildFill(area,ex,v){

    parts.forEach(function(p,i){
      sent.appendChild(document.createTextNode(p));
      if(i<ex.slots.length){
        (function(si){
          var sp=document.createElement('span'); sp.className='slot'+(v.slots[si]!=null?' filled':'')+(v.selSlot===si?' sel':'');
          sp.innerHTML='<span class="slot-v">'+(v.slots[si]!=null?esc(v.slots[si]):'…')+'</span>';
          sp.setAttribute('role','button'); sp.setAttribute('tabindex','0');
          function pick(){ if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
            if(v.slots[si]!=null){ var w=v.slots[si]; v.bank.push(w); v.slots[si]=null; } /* return the word to the bank (bank order is shuffled, so append is safe) */
            v.selSlot=si; redrawSent(); redrawBank(); }
          sp.addEventListener('click',pick);
          sp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
          sent.appendChild(sp);
        })(i);
      }
    });
  }
  function redrawBank(){
    bank.innerHTML='';
    if(v.bank.length===0){ bank.innerHTML='<span class="small mut">Word bank empty — every word is placed.</span>'; }
    v.bank.forEach(function(w,wi){
      var c=document.createElement('button'); c.className='chip'; c.innerHTML=esc(w);
      c.addEventListener('click',function(){
        if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
        var si=(v.selSlot!=null&&v.slots[v.selSlot]==null)?v.selSlot:v.slots.indexOf(null);
        if(si<0) return;
        v.slots[si]=w; v.bank.splice(wi,1); v.touched=true; v.selSlot=(si+1<ex.slots.length)?si+1:null;
        redrawSent(); redrawBank();
        var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=false;
      });
      bank.appendChild(c);
    });
  }
  redrawSent(); redrawBank();
}
function buildBranch(area,ex,v){
  var box=document.createElement('div');
  var st=ex.steps[v.step];
  var opts=document.createElement('div'); opts.className='opts';
  v.steps[v.step].opts.forEach(function(o){
    var b=document.createElement('button'); b.type='button'; b.className='opt';
    b.innerHTML='<span class="opt-k">'+o.k+'.</span><span>'+esc(o.t)+'</span>';
    b.addEventListener('click',function(){
      if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
      v.sels[v.step]=o.k; v.touched=true;
      var all=opts.querySelectorAll('.opt');
      for(var i=0;i<all.length;i++){all[i].classList.remove('sel');}
      b.classList.add('sel');
      var cb=document.getElementById('checkBtn'); if(cb){cb.disabled=false;cb.innerHTML=(v.step===ex.steps.length-1)?'✓ Check final answer':'✓ Save step & continue';}
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);
  area.appendChild(box);
}
function branchAdvance(ex,v){
  if(v.step<ex.steps.length-1){
    v.step++;
    document.getElementById('stepChip').textContent='STEP '+(v.step+1)+' OF '+ex.steps.length;
    document.getElementById('qText').textContent=ex.steps[v.step].question;
    var area=document.getElementById('ansArea'); area.innerHTML='';
    buildBranch(area,ex,v);
    var cb=document.getElementById('checkBtn'); if(cb){cb.disabled=(v.sels[v.step]==null);cb.innerHTML='✓ Save step & continue';}
  } else {
    onCheckFinal(ex,v,false);
  }
}
function buildQuery(area,ex,v){
  var p=document.createElement('div'); p.className='qprompt'; p.textContent=ex.query.prompt||'query editor — read-only investigation only';
  area.appendChild(p);
  var ta=document.createElement('textarea'); ta.className='qeditor'; ta.spellcheck=false;
  ta.placeholder=ex.query.placeholder||'type your query…';
  ta.setAttribute('aria-label','Query editor');
  ta.addEventListener('input',function(){ v.text=ta.value; v.touched=v.text.trim().length>0;
    var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=!v.touched; });
  area.appendChild(ta);
  if(ex.query.syntaxHint){
    var hnt=document.createElement('div'); hnt.className='canon'; hnt.innerHTML='<span class="lab">Syntax reminder (different example — do not copy)</span><code>'+esc(ex.query.syntaxHint)+'</code>';
    area.appendChild(hnt);
  }
}
/* ---------------- grading ---------------- */
function onCheck(ex,v,review){
  if(ex.type==='branch' && v.step<ex.steps.length-1){ branchAdvance(ex,v); return; }
  onCheckFinal(ex,v,review);
}
function scoreEC(H,W,N){ return clamp01((H-W)/N); }
function onCheckFinal(ex,v,review){
  var i=G.order[idxOf(review)];
  if(G.done[i]!=null) return;
  if(G.tstate==='RUNNING'){ G.tstate='PAUSED_AUTO_CHECK'; updHeader(); }
  var g=grade(ex,v);
  var credit=g.credit;
  if(G.hint[i]) credit=clamp01(credit-0.10);
  G.done[i]=credit;
  G.answered++; G.creditSum+=credit;
  if(credit>=0.999){G.stats.full++;} else if(credit>0){G.stats.partial++;G.stats.partialSum+=credit;} else {G.stats.zero++;}
  updHeader(); /* live score must move the moment Check is pressed, before Next */
  if(G.reviewOf!=null){
    var p=G.skipped.indexOf(G.reviewOf);
    if(p>=0) G.skipped.splice(p,1);
  }
  renderFeedback(ex,g,credit);
  var row=document.getElementById('btnRow'); row.innerHTML='';
  var nx;
  if(review){ nx=mkBtn('↩ Back to Review','btn primary',function(){ if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';} openReview(); }); }
  else if(idxOf(false)>=EX.length-1){ nx=mkBtn('⏹ Final Submit','btn primary',function(){ if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';} if(G.skipped.length>0){openReview();}else{renderResults();} }); }
  else { nx=mkBtn('▶ Next','btn primary',function(){ resumeAfterCheck(); }); }
  row.appendChild(nx);
  var wa=document.getElementById('ansArea');
  wa.style.pointerEvents='none'; wa.style.opacity='.85';
  var cb=document.getElementById('checkBtn'); if(cb){cb.parentNode.removeChild(cb);}
}
function grade(ex,v){
  var k=ex.type, rows=[], credit=0, H=0,W=0,N=1;
  if(k==='qcm'||(k==='log'&&ex.answer.kind==='qcm')){
    var w=ex.type==='log'? ex.answer:ex;
    var correctKey=null, correctTxt='';
    v.opts.forEach(function(o){ if(o.orig===w.correct){correctKey=o.k;correctTxt=o.t;} });
    credit=(v.sel!=null && v.sel===correctKey)?1:0;
    if(v.sel==null){ rows.push({state:'missed',label:'○ Missed',note:'No answer selected.'}); }
    N=1;
    return {credit:credit,rows:rows,correctText:correctTxt};
  }
  if(k==='clickline'||(k==='log'&&ex.answer.kind==='click')){
    var w2=ex.type==='log'? ex.answer:ex;
    credit=(v.sel===w2.correct)?1:0;
    if(v.sel==null) rows.push({state:'missed',label:'○ Missed',note:'No line selected.'});
    return {credit:credit,rows:rows};
  }
  if(k==='qcmmulti'){
    N=ex.correct.length; H=0;W=0;
    v.opts.forEach(function(o){
      var inC=ex.correct.indexOf(o.orig)>=0;
      var inS=v.sel.indexOf(o.k)>=0;
      if(inC&&inS){H++;rows.push({state:'correct',label:'✓ Correct',note:o.t});}
      else if(inC&&!inS){rows.push({state:'missed',label:'○ Missed',note:o.t});}
      else if(!inC&&inS){W++;rows.push({state:'wrong',label:'✗ Wrong',note:o.t});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='match'){
    N=ex.pairs.length; H=0;W=0;
    ex.pairs.forEach(function(p,i){
      var a=v.assign[i];
      if(a==null){rows.push({state:'missed',label:'○ Missed',note:p.left+' — correct match: '+p.right});}
      else if(a===i||(a!=null&&ex.pairs[a].right===p.right)){H++;rows.push({state:'correct',label:'✓ Correct',note:p.left+' → '+p.right});} /* text match: duplicate right answers stay fair */
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:p.left+' → '+ex.pairs[a].right+' (correct: '+p.right+')'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='dnd'){
    N=ex.items.length; H=0;W=0;
    ex.items.forEach(function(it,i){
      var p=v.placed[i];
      if(p==null){rows.push({state:'missed',label:'○ Missed',note:it.text+' — belongs in: '+ex.zones[it.zone]});}
      else if(p===it.zone){H++;rows.push({state:'correct',label:'✓ Correct',note:it.text+' → '+ex.zones[it.zone]});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:it.text+' placed in '+ex.zones[p]+' (correct: '+ex.zones[it.zone]+')'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='order'){
    N=ex.items.length; H=0;W=0;
    v.seq.forEach(function(ii,pos){
      if(ii===pos){H++;rows.push({state:'correct',label:'✓ Correct',note:'Position '+(pos+1)+': '+ex.items[ii]});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Position '+(pos+1)+': you put "'+ex.items[ii]+'", correct: "'+ex.items[pos]+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='fill'){
    N=ex.slots.length; H=0;W=0;
    ex.slots.forEach(function(s,i){
      var got=v.slots[i];
      if(got==null){rows.push({state:'missed',label:'○ Missed',note:'Blank '+(i+1)+' — correct: '+s});}
      else if(got===s){H++;rows.push({state:'correct',label:'✓ Correct',note:'Blank '+(i+1)+': '+s});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Blank '+(i+1)+': you used "'+got+'", correct: "'+s+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='branch'){
    N=ex.steps.length; H=0;W=0;
    ex.steps.forEach(function(st,si){
      var sel=v.sels[si], selTxt='';
      v.steps[si].opts.forEach(function(o){ if(o.k===sel) selTxt=o.t; });
      var corrKey=null, corrTxt='';
      v.steps[si].opts.forEach(function(o){ if(o.orig===st.correct){corrKey=o.k;corrTxt=o.t;} });
      if(sel==null){rows.push({state:'missed',label:'○ Missed',note:'Step '+(si+1)+' — correct: '+corrTxt});}
      else if(sel===corrKey){H++;rows.push({state:'correct',label:'✓ Correct',note:'Step '+(si+1)+': '+selTxt});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Step '+(si+1)+': you chose "'+selTxt+'", correct: "'+corrTxt+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='query'){
    var q=ex.query; N=q.required.length; H=0;W=0;
    var norm=(v.text||'').toLowerCase();
    q.required.forEach(function(r){
      if(r.re.test(norm)){H++;rows.push({state:'correct',label:'✓ Correct',note:r.name});}
      else {rows.push({state:'missed',label:'○ Missed',note:r.name});}
    });
    (q.forbidden||[]).forEach(function(f){
      if(f.re.test(norm)){W++;rows.push({state:'wrong',label:'✗ Wrong — dangerous / out of scope',note:f.name});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows,canon:q.canonical,output:q.output};
  }
  return {credit:0,rows:rows};
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex,g,credit){
  var fb=document.getElementById('fbArea');
  var h='';
  var cls,lab;
  if(credit>=0.999){cls='fb-correct';lab='✓ CORRECT';}
  else if(credit>0){cls='fb-partial';lab='✓ PARTIALLY CORRECT';}
  else {cls='fb-incorrect';lab='✗ INCORRECT';}
  h+='<div class="feedback '+cls+'" role="status"><p class="fb-h">'+lab+'</p>';
  if(g.rows.length>0){
    h+='<p class="fb-credit">credit '+credit.toFixed(2)+' — computed as max(0, (H − W) / N) with a −0.10 penalty'+(G.hint[G.order[idxOf(G.reviewOf!=null)]]?' applied (hint used)':' (no hint)')+'.</p>';
    g.rows.forEach(function(r){ h+='<div class="itemrow st-'+r.state+'"><span class="ic">'+r.label+'</span><span class="note">'+esc(r.note)+'</span></div>'; });
  } else {
    h+='<p class="fb-credit">credit '+credit.toFixed(2)+(G.hint[G.order[idxOf(G.reviewOf!=null)]]?' — includes the −0.10 hint penalty.':'')+'</p>';
  }
  if(g.canon){ h+='<div class="canon"><span class="lab">✓ Canonical answer — copyable</span><code>'+esc(g.canon)+'</code></div>'; }
  if(g.output){ h+='<div class="canon"><span class="lab">Expected output shape once it runs</span><code>'+esc(g.output)+'</code></div>'; }
  h+='<div class="fb-exp"><span class="lab">Why — plain words</span>'+ex.explanation+'</div>';
  if(ex.study){ h+='<div class="fb-exp"><span class="lab">What to study</span>'+esc(ex.study)+'</div>'; }
  h+='</div>';
  fb.innerHTML=h;
}
/* ---------------- review skipped ---------------- */
function openReview(){
  G.reviewOf=null;
  var wrap=document.getElementById('exWrap');
  var h='<div class="card"><h2 class="sec-h">⚠ Review skipped exercises</h2>';
  h+='<p class="mut">These exercises were skipped and not answered. You may return to each one and answer it as many times as you need, while the timer is running. If you submit while any are still unanswered, they are excluded from the score.</p>';
  if(G.skipped.length===0){
    h+='<p class="mut">All skipped exercises have been answered.</p>';
  } else {
    G.skipped.forEach(function(i){
      var ex=EX[G.order[i]];
      h+='<div class="skrow"><span class="skic">⚠ Skipped</span><span class="skt">'+esc(ex.summary)+'</span><button class="btn" data-i="'+i+'">✎ Answer</button></div>';
    });
  }
  h+='<div class="btnrow"><button class="btn primary" id="submitAll">⏹ Submit Exam</button></div></div>';
  wrap.innerHTML=h; updHeader();
  var btns=wrap.querySelectorAll('.skrow button');
  for(var b=0;b<btns.length;b++){
    (function(btn){ btn.addEventListener('click',function(){ G.reviewOf=parseInt(btn.getAttribute('data-i'),10); renderExercise(G.reviewOf,true); window.scrollTo(0,0); }); })(btns[b]);
  }
  document.getElementById('submitAll').addEventListener('click',function(){
    if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';}
    renderResults();
  });
  window.scrollTo(0,0);
}
/* ---------------- results ---------------- */
function renderResults(){
  G.tstate='ENDED';
  var answered=G.answered;
  var pct = answered>0? Math.round(G.creditSum/answered*100):0;
  var passed = pct>=CFG.passMark;
  var avgPart = G.stats.partial>0? (G.stats.partialSum/G.stats.partial):0;
  var h='<div class="wrap" style="padding-top:22px">';
  h+=passed? '<div class="passpanel"><p class="vh">✓ PASS</p><p class="mut">You reached the pass mark of '+CFG.passMark+'%. Certificate-style success — well done.</p></div>'
           : '<div class="failpanel"><p class="vh">✗ FAIL</p><p class="mut">You did not reach the pass mark of '+CFG.passMark+'%. You must retake this exam. Study the explanations, then press Retake Exam.</p></div>';
  h+='<div class="card"><h2 class="sec-h">Final results — '+esc(CFG.title)+'</h2>';
  h+='<p style="font-size:22px;margin:6px 0"><b>'+(Math.round(G.creditSum*10)/10).toFixed(1)+' / '+answered+'</b> <span class="mut">('+pct+'%, rounded from partial credits)</span></p>';
  if(G.timedOut) h+='<p class="mut">⏹ The timer ended — unanswered exercises were excluded.</p>';
  h+='<div class="statgrid">';
  h+='<div class="stat"><div class="n st-correct">✓ '+G.stats.full+'</div><div class="d">Fully correct</div></div>';
  h+='<div class="stat"><div class="n st-partial">✓ '+G.stats.partial+'</div><div class="d">Partially correct'+(G.stats.partial>0?' — avg credit '+avgPart.toFixed(2):'')+'</div></div>';
  h+='<div class="stat"><div class="n st-incorrect">✗ '+G.stats.zero+'</div><div class="d">Fully incorrect</div></div>';
  h+='<div class="stat"><div class="n st-skipped">⚠ '+G.skipped.length+'</div><div class="d">Skipped — excluded</div></div>';
  h+='</div>';
  h+='<p class="pausedlog">⏸ Time paused manually: '+fmtT(G.pauseManualSec)+' — ⏸ Time paused for feedback review: '+fmtT(G.pauseAutoSec)+' — ⏹ Final timer state: ENDED</p>';
  if(G.skipped.length>0){
    h+='<p class="small mut">Skipped and never answered (excluded from both score and total):</p>';
    G.skipped.forEach(function(i){ h+='<div class="skrow"><span class="skic">⚠ Skipped</span><span class="skt">'+esc(EX[G.order[i]].summary)+'</span></div>'; });
  }
  h+='<div class="btnrow"><button class="btn primary" id="retakeBtn">↻ Retake Exam</button></div>';
  h+='</div></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
  reportScore(answered,pct,passed);
  document.getElementById('retakeBtn').addEventListener('click',startExam);
}
function reportScore(answered,percent,passed){
  if(G.reported) return; G.reported=true;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE', topicId:CFG.topicId, batch:CFG.batch,
      score:Math.round(G.creditSum), total:answered, percent:percent, passed:passed}, location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  G.username=event.data.username||'';
  G.country=event.data.country||'';
  G.locale=event.data.locale||'';
  /* theme is always 'dark' — the file is dark-only by contract; nothing to switch. */
});
renderIntro();

})();

</script>
