<script>window.__EXAM__={"intro":{"title":"DET0120 — HARD practice exam","idname":"DET0120 — Account Access Removal via Multi-Platform Audit Correlation (detects T1531 — Account Access Removal)","learn":["This is the HARD tier for the <b>detection strategy DET0120<\/b> — the ATT&amp;CK plan that watches for <b>T1531 Account Access Removal<\/b>, an attacker deleting, locking, or re-credentialing accounts so legitimate users lose access. The technique belongs to the <b>Impact<\/b> tactic with an <b>Availability<\/b> impact type, and it runs on Windows, Linux, macOS, ESXi, Microsoft 365, and SaaS — which is why the strategy carries six analytics (AN0334 to AN0339).","At this level the exercises stop handing you the answer. You will correlate <b>two to four artefacts<\/b> — Windows Security and Sysmon logs, auditd records, ESXi hostd/vpxa pairs, M365 UnifiedAuditLog with sign-in risk, Okta lifecycle events — and decide what actually matters. Some scenarios look alarming but are benign automation. Some look routine but are the real intrusion. In several, two answers are technically defensible and only one is correct <i>here<\/i> — you must justify, not recall.","This is the work of a senior SOC analyst and a detection engineer under pressure: reading a SIEM rule and finding the inverted condition, tuning ExpectedIPs without blinding the analytic, choosing the least aggressive containment that still preserves evidence, and writing the detection query itself in the query editor. The ransomware context is present throughout — Akira-style crews delete administrator accounts before encryption, so these alerts often arrive minutes before the real detonation.","Expect near-miss answers. Ask of every option: <i>defensible in which world — and is that this world?<\/i>"],"themes":[{"name":"Correlation under noise","items":["AN0334: 4724/4740 storms vs a single lineage-true reset — which one is the hit","AN0335: auid=0 automation vs auid=1005 remote userdel — the shortcut that misleads","AN0336: dscl . -read (benign lookup) vs dscl . delete (the pattern)","AN0337: hostd RemoveUser joined with vpxa role and IP anomalies","AN0338: Remove-Mailbox with impossible travel — and VPN egress that breaks the story","AN0339: partial SaaS coverage — what the Okta channel does and does not see"]},{"name":"Detection engineering judgement","items":["Reading SIEM joins: keys, time proximity, and near-miss fields","Tuning review: inverted TimeWindow, permissive ExpectedIPs, wrong RemoteUserRole","Coverage-gap reasoning across the six analytics","Writing the AN0334 query in the query editor (one query-editor exercise)"]},{"name":"Response and evidence","items":["Least-aggressive containment that preserves evidence","Evidence-first ordering of response steps on ESXi","Detection build order under ransomware pressure (Akira TTP overlap)"]}],"how":["<b>Passing score.<\/b> You pass with <b>70% or more<\/b>. Wrong options here are often defensible elsewhere — the feedback explains which world each one belongs to.","<b>Exercises.<\/b> This file has <b>15 exercises<\/b>: multi-artefact select-all, a log reader with filter, branching conflicts, drag and drop, ordering, ranking, fill-in-the-blank, and one query-editor task.","<b>Timer.<\/b> You have <b>40 minutes<\/b>. <b>Pause<\/b> hides the exercise and stops the clock for a real break; <b>Check<\/b> auto-pauses the clock so you can study feedback without pressure; both resume as described on screen.","<b>Partial credit.<\/b> Multi-item exercises use credit = (correct − wrong) ÷ total, item by item. Selecting everything scores zero.","<b>Hints and skipping.<\/b> One hint per exercise (−10% of that exercise’s credit) removes one wrong path — it never names the answer. Skipped exercises wait in a review pool you can revisit while the timer runs; never-answered exercises are excluded from the score."],"types":["Select-all (partial credit)","Drag & drop","Branching decision","Multiple choice (single answer)","Timeline ordering","Fill-in-the-blank","Query editor"]},"ex":[{"id":"h01","type":"multi","title":"Night shift: two storms and one quiet reset","sc":[{"label":"ARTEFACT 1 — WinEventLog:Security (excerpt of 40 events)","log":["03:02:01  EventCode=4724  SubjectUserName=svc_backup  TargetUserName=rot_pw_01  (pattern repeats ×40, 03:02–03:09)","03:05:33  EventCode=4740  TargetUserName=rot_pw_07  (lockout during the same run)"]},{"label":"ARTEFACT 2 — Sysmon EventCode=1 for svc_backup activity","log":["03:01:58  schtasks.exe → pwrotate.ps1  (signed, parent: services.exe, run: nightly rotation job)","03:02:02  pwrotate.ps1 → net.exe user rot_pw_01 /domain  (scripted loop, host: UTIL-01)"]},{"label":"ARTEFACT 3 — the quiet one","log":["03:12:44  EventCode=4724  SubjectUserName=Helpdesk2  TargetUserName=vendora  WorkstationName=VPN-JUMP-3","03:12:45  Sysmon: Helpdesk2 session → cmd.exe → net.exe (Helpdesk2 has one prior login, 22 days ago, from a different host)"]},{"label":"Context","text":"The IT admin change window is 02:00–05:00. Nightly password rotation by svc_backup is documented in runbook RB-77. Helpdesk2 is a real helpdesk identity, but it has never worked from VPN-JUMP-3 and the ticket queue shows no reset request for vendora."}],"q":"Select every statement the three artefacts support.","options":[{"t":"The svc_backup 4724 storm is benign: documented rotation, correct lineage, inside the window","why":"Correct — signed scheduled task from services.exe, runbook RB-77, window respected: alarming in volume, benign in fact."},{"t":"The quiet 4724 reset is the hit: expected actor, but wrong host, no ticket, and fresh lineage","why":"Correct — looks routine at one line, but UserContext context (never from that host), the absent ticket, and cmd.exe → net.exe make it the anomaly."},{"t":"The 4740 lockout proves ransomware is running","why":"Wrong — the lockout belongs to the rotation loop (a rotated password raced a cached credential); it is noise here."},{"t":"AN0334 fires on the quiet reset through the ParentProcessName and UserContext conditions","why":"Correct — interactive helpdesk session spawning net.exe matches the lineage check, and the unexplained host matches the user-context check."},{"t":"Because the storm is inside the window, TimeWindow tuning should be removed so storms alert too","why":"Wrong — that tuning change would flood the queue every night and blind analysts to real hits; the window is doing its job."},{"t":"Both the storm and the quiet reset should be treated as T1531 candidate incidents","why":"Wrong — only the quiet reset is out of profile; treating documented automation as an incident wastes the response capacity T1531 attackers count on."}],"correct":[0,1,3],"hint":"Volume is not a signal here — read the lineage and the context of each actor instead.","explain":"This is the classic hard night: the <b>40-event storm is the benign one<\/b> (signed scheduled rotation, documented lineage services.exe → schtasks → pwrotate.ps1 → net.exe, inside RB-77 and the window), while the <b>single quiet reset is the real candidate<\/b> — an expected actor on an unexpected host, no ticket, and an interactive cmd.exe → net.exe lineage. AN0334 fires on the quiet one through ParentProcessName and UserContext. The 4740 lockout is a rotation artefact. The lesson that generalises: judge lineage and context, not volume — and never “fix” a working TimeWindow because a benign storm annoys you.","study":"AN0334 conditions (ParentProcessName, UserContext, TimeWindow) evaluated on a noisy real night."},{"id":"h02","type":"dnd","title":"Route each line to its analytic","sc":[{"label":"Mixed log fragments from one SIEM search","text":"An engineer searched all channels for account-related lines. Each line belongs to exactly one DET0120 analytic. Route them."}],"q":"Drag each log line onto the analytic that covers it.","zones":[{"t":"AN0334 — Windows"},{"t":"AN0335 — Linux"},{"t":"AN0336 — macOS"},{"t":"AN0337 — ESXi"},{"t":"AN0338 — M365"},{"t":"AN0339 — SaaS"}],"items":[{"t":"Security 4724 SubjectUserName=j.smith TargetUserName=svc_sql","zone":0,"why":"A Windows Security account-modification event — the DC0010 half of AN0334."},{"t":"auditd SYSCALL exe=\"/usr/sbin/userdel\" auid=1005","zone":1,"why":"A Linux auditd record matching the passwd/userdel/chage filter of AN0335."},{"t":"macos:unifiedlog command: dscl . delete /Users/bkp-adm","zone":2,"why":"The macOS unified log carrying a dscl delete — the DC0064 half of AN0336."},{"t":"esxi:hostd method=RemoveUser userName=bkp-admin via vSphere API","zone":3,"why":"hostd RemoveUser is the core deletion signal of AN0337."},{"t":"m365:unified operation=Remove-Mailbox userId=finance-hr@corp","zone":4,"why":"Remove-Mailbox in the UnifiedAuditLog is the AN0338 signal."},{"t":"saas:okta user.lifecycle.delete.completed target=zkelly","zone":5,"why":"An Okta lifecycle event is the AN0339 channel."}],"hint":"Each line names its channel. Six channels, six analytics — one each.","explain":"Routing by channel and action: <b>4724 → AN0334<\/b> (Windows Security), <b>auditd userdel → AN0335<\/b>, <b>dscl . delete → AN0336<\/b> (macOS unified log, DC0064), <b>hostd RemoveUser → AN0337<\/b>, <b>Remove-Mailbox → AN0338<\/b> (m365:unified), <b>user.lifecycle.delete.completed → AN0339<\/b> (saas:okta). Fast routing matters in real incidents: when one SIEM search returns fragments from six platforms, the analyst who instantly maps line → analytic knows within seconds which hosts, tenants, and identity providers are losing accounts — and whether one actor is sweeping them all, which is the Akira-style pattern worth fearing.","study":"The log source tables of all six DET0120 analytics."},{"id":"h03","type":"branch","title":"M365 conflict: which signal wins?","sc":[{"label":"ARTEFACT 1 — m365:unified (UnifiedAuditLog)","log":["09:14:02  operation=Set-Mailbox  actor=admin.b@corp  action=disable account  device: CORP-LAP-44 (compliant, enrolled)","09:14:05  note: RoleAssignment check — admin.b removed from Exchange-Admins group YESTERDAY 16:40"]},{"label":"ARTEFACT 2 — m365:signinlogs","log":["09:12:40  sign-in admin.b@corp  IP 198[.]51[.]100[.]23  geo: Dublin (usual)  MFA: satisfied  device: CORP-LAP-44","09:12:41  GeoThreshold note: geo matches baseline — no travel anomaly on this session"]},{"label":"Context","text":"RoleAssignment mutable element: “Determine if operation was delegated to expected admin group.” Yesterday 16:40 the identity team offboarded admin.b’s group membership pending an internal move; HR confirms the move, and states his account “should already be locked by now”. No maintenance window covers Exchange changes."}],"q":"Resolve the three steps of this conflicting-signal case.","steps":[{"q":"STEP 1 — The sign-in half looks clean (usual geo, compliant device, MFA). Does that clear the mailbox action?","options":[{"t":"No — the sign-in half only proves the session was healthy, not that the action was authorised","why":"Correct — GeoThreshold passing means the location signal is quiet; it says nothing about whether the actor still held the right to act."},{"t":"Yes — a clean sign-in clears the whole chain","why":"Wrong — that is the shortcut the scenario baits: a healthy session from a stolen compliant device looks identical to a legitimate one."},{"t":"Yes — because MFA was satisfied","why":"Wrong — MFA-bypass is one trigger, but its absence does not authorise the action; authorisation lives in RoleAssignment."}],"answer":0},{"q":"STEP 2 — Which artefact is decisive for AN0338 firing?","options":[{"t":"The RoleAssignment finding: the actor was removed from the expected admin group before acting","why":"Correct — RoleAssignment is the mutable element that answers “was this delegated to an expected admin?”; it fails here."},{"t":"The Dublin geo, because GeoThreshold is listed first","why":"Wrong — GeoThreshold passed; it is not the decisive artefact."},{"t":"The device compliance record","why":"Wrong — compliance is context, not authorisation."}],"answer":0},{"q":"STEP 3 — What is the right next move?","options":[{"t":"Treat as unauthorised account disablement: re-enable nothing, open an incident, and verify who re-scoped the account","why":"Correct — an offboarded admin performing admin actions is exactly the anomaly; the least-wrong move is to investigate and confirm scope before touching state."},{"t":"Re-enable the mailbox immediately to restore service","why":"Wrong — state-changing “repair” before scope confirmation can destroy the evidence of a live account takeover."},{"t":"Close as benign — HR expected the account to be locked anyway","why":"Wrong — expected lockout makes the live admin action <i>more<\/i> suspicious, not less."}],"answer":0}],"hint":"Step 1: a clean session is necessary, never sufficient. Step 2: which mutable element speaks about authorisation? Step 3: preserve before you repair.","explain":"The winning signal is <b>RoleAssignment<\/b>: the actor’s admin membership was revoked the day before, yet a Set-Mailbox disable landed from a perfectly healthy session — usual geo (GeoThreshold quiet), compliant device, satisfied MFA. The branch point that sinks most analysts: a clean sign-in half feels exonerating, but it only proves the session was healthy, and stolen compliant-device sessions look exactly like this. The correct move is the least aggressive evidence-preserving one: incident, scope check, and identity-team verification — not an instant re-enable. Note how AN0338 is designed for precisely this: the analytic fires when the action and the session do not corroborate each other.","study":"AN0338 mutable elements (RoleAssignment, GeoThreshold) and evidence-first response to cloud admin anomalies."},{"id":"h04","type":"qcm","title":"Choose the join, not the keyword","sc":[{"label":"Design review — AN0334 in the SIEM","text":"Account-modification events (4723/4724/4740) live on DC01; Sysmon process events live on the workstations that issued remote resets. The engineer proposes four ways to correlate them."}],"q":"Which correlation design best implements AN0334 without drowning in false positives?","options":[{"t":"Join each account event to a Sysmon process event on the actor’s host within a short time window, then inspect lineage","why":"Correct — actor-host + time proximity + lineage inspection is the defensible implementation of “correlated with anomalous process lineage”."},{"t":"Join on TargetUserName = process owner, so the reset target must own the spawning process","why":"Near-miss — tempting symmetry, but the actor (SubjectUserName), not the target, owns the process; this join almost never matches and silently kills the analytic."},{"t":"Alert on every 4723/4724/4740 and skip the process join to keep coverage complete","why":"Near-miss — maximum coverage, zero precision: it turns the analytic into a raw event feed and floods the queue."},{"t":"Use Sysmon EventCode=2 (file creation time changed) instead of EventCode=1 to reduce noise","why":"Near-miss — EventCode=2 is a real, quieter event, but it does not carry process lineage; only EventCode=1 does."}],"answer":0,"hint":"Ask of each design: which field identifies the actor, and which event class actually carries lineage?","explain":"The defensible design is the <b>actor-side join with time proximity and lineage<\/b>: SubjectUserName’s host produces the Sysmon EventCode=1 record, and powershell → net.exe style ancestry is what AN0334’s ParentProcessName element describes. Each wrong option is a real-world trap: joining on the <b>target’s<\/b> identity looks elegant and matches almost nothing (the target never owns the spawning process); dropping the join maximises recall but destroys the analytic’s point; and EventCode=2 is a genuine quiet alternative that simply does not carry lineage. In detection engineering, the join key and the event class are where analytics live or die — keyword-level edits come later.","study":"AN0334 correlation requirements: DC0010 + DC0032 (Sysmon EventCode=1), actor identity, time proximity."},{"id":"h05","type":"multi","title":"Tuning review: find the three errors","sc":[{"label":"Deployed tuning for AN0337 (ESXi)","code":"ExpectedIPs = 0[.]0[.]0[.]0/0        # \"accept any admin source\"\nRemoteUserRole = Viewer             # \"role that should never remove accounts\"\nTimeWindow       = 02:00-05:00       # \"alert only DURING these hours\"\njoin: hostd.RemoveUser + vpxa.login on session id"},{"label":"Environment facts","text":"ESXi management is restricted to the 10[.]0[.]0[.]0/24 range. The change policy defines a nightly maintenance window 02:00–05:00 during which host changes are <i>expected and must not alert<\/i>. Administrative roles on this vCenter: Administrator and Infra-Admin; Viewer is read-only."}],"q":"Select the three tuning errors that break or invert AN0337’s intent.","options":[{"t":"ExpectedIPs = 0[.]0[.]0[.]0/0 makes every source “expected”, so the IP anomaly can never fire","why":"Correct — the catch-all allowlist blinds the ExpectedIPs element; it should list the 10[.]0[.]0[.]0/24 management range."},{"t":"TimeWindow is inverted: alerting during the maintenance window instead of outside it","why":"Correct — the comment says “alert only DURING these hours”, which buries alerts in the noisiest period and silences out-of-window attacks."},{"t":"RemoteUserRole should cover privileged roles too — restricting the watch to Viewer misses an Administrator gone rogue","why":"Correct — a rogue or stolen Administrator role is the common case; watching only Viewer inverts the risk model."},{"t":"The join on session id is wrong; hostd and vpxa cannot be correlated","why":"Wrong — the session-id join is exactly how the two channels are meant to correlate."},{"t":"Using RemoteUserRole at all is pointless","why":"Wrong — role is a mutable element of AN0337 precisely because out-of-profile roles are a core signal."}],"correct":[0,1,2],"hint":"Compare each line to the environment facts: the real mgmt range, the meaning of the window, and the real admin roles.","explain":"Three errors, each a classic: <b>(1) 0[.]0[.]0[.]0/0 in ExpectedIPs<\/b> — an allow-everything allowlist disables the IP condition while looking like a configuration; <b>(2) inverted TimeWindow<\/b> — alerting during the quiet window instead of outside it both drowns analysts in scheduled work and hides out-of-window attacks; <b>(3) role mis-scope<\/b> — watching only Viewer misses stolen Administrator credentials, the far likelier path. The session-id join is correct as-is. Tuning reviews that compare each line against documented environment facts (ranges, windows, role inventories) catch inversions that a syntax check never will.","study":"AN0337 mutable elements (ExpectedIPs, RemoteUserRole) and correct TimeWindow semantics."},{"id":"h06","type":"qcm","title":"Linux: which line actually matches?","sc":[{"label":"ARTEFACT — auditd:SYSCALL (two records, same host)","log":["01:57:03  type=SYSCALL exe=\"/usr/bin/chage\" auid=0  uid=0  pp pid=4411 (parent: chef-client run, scheduled)","02:03:41  type=SYSCALL exe=\"/usr/sbin/userdel\" auid=1005 uid=0 tty=pts/1  (preceding: accepted publickey for user opsmaint from 198[.]51[.]100[.]77)"]},{"label":"Context","text":"AN0335 watches passwd/userdel/chage where <b>auid != root<\/b>, preceded by interactive shell or remote command execution. NonRootUIDThreshold allowlists only the config-management service account (auid=0 via chef). opsmaint is a break-glass account, inactive for 14 months."}],"q":"Which record makes AN0335 fire, and why does the other one not?","options":[{"t":"The 02:03:41 userdel fires: non-root auid, remote session immediately before; the chage is root via allowlisted automation","why":"Correct — the userdel satisfies both the auid condition and the preceding-access condition; the root chage matches the allowlisted automation profile."},{"t":"The 01:57:03 chage fires because chage is in the watched binary list","why":"Near-miss — chage is watched, but auid=0 with the allowlisted automation parent puts it in the exclusion, not the alert."},{"t":"Both fire — any watched binary is enough","why":"Near-miss — the binary list is necessary, never sufficient; the auid and access conditions gate the alert."},{"t":"Neither fires — uid=0 on the second record means root did it","why":"Near-miss — the classic shortcut: uid=0 (post-sudo privilege) but auid=1005 (the real login identity); the analytic trusts auid."}],"answer":0,"hint":"The shortcut is to read uid. The analytic reads a different field — and checks what preceded the command.","explain":"The <b>userdel at 02:03:41<\/b> is the hit: auid=1005 is non-root, and an accepted public key for a dormant break-glass account immediately precedes the deletion — the full AN0335 chain. The chage stays silent: auid=0 via the scheduled chef run is exactly what NonRootUIDThreshold allowlists. The tempting shortcut is <b>uid<\/b>: the userdel ran with uid=0 (sudo elevation), but auid preserves the original login identity, which is why the analytic is written on auid. And the 14-month-dormant opsmaint account suddenly doing remote account surgery is a compromise signature in its own right — hunt for what else that key touched.","study":"AN0335: auid vs uid, NonRootUIDThreshold allowlisting, and the DC0002 preceding-access correlation."},{"id":"h07","type":"multi","title":"Coverage gap: what AN0339 does not see","sc":[{"label":"ARTEFACT — AN0339 log source table","text":"| Data component | Channel | Filter |<br>| User Account Modification (DC0010) | saas:okta | user.lifecycle.deactivate / suspend / delete.initiated / delete.completed |<br><br>AN0339 logic names “SaaS platforms such as Okta, Salesforce, or Zoom”. Only the Okta channel is listed."}],"q":"Select every statement that is true about this analytic’s coverage.","options":[{"t":"Salesforce and Zoom are named in the logic but have no channel in the table — coverage is Okta-only as shipped","why":"Correct — the “such as” phrasing names the platform family; the shipped table wires only saas:okta."},{"t":"Adding DC0009 or DC0002 sources for Salesforce and Zoom would close part of the gap","why":"Correct — the same data components exist for other SaaS; wiring their audit channels extends the analytic without changing its logic."},{"t":"Assuming Okta logs cover M365 sign-ins is wrong — they are different channels and tenants","why":"Correct — saas:okta and m365:signinlogs are distinct sources; assuming one covers the other creates a silent blind spot."},{"t":"AN0339 as shipped covers every SaaS application equally","why":"Wrong — only the Okta channel is wired; claiming parity across SaaS is exactly the assumption this table punishes."},{"t":"The gap is acceptable to ignore because Okta is the only identity provider in use","why":"Wrong as a general claim — it is only acceptable if the environment truly has no other SaaS with removable accounts; the table itself cannot prove that."}],"correct":[0,1,2],"hint":"Read the table twice: what the logic sentence promises, and what the channel column actually delivers.","explain":"The shipped analytic covers <b>Okta only<\/b>: Salesforce and Zoom appear in the logic sentence but no channels carry them, so deactivations there are invisible to AN0339. The honest engineering responses: wire the equivalent audit channels for the other SaaS (the data components — DC0009/DC0010 for changes, DC0002 for the sessions doing them — generalise cleanly), and document the residual gap until then. Two traps die here: “Okta logs will show M365 sign-ins” (different tenant, different channel) and “coverage is equal because the logic says SaaS”. Coverage-gap reasoning of this kind is a standard detection-engineering deliverable — and a favourite audit finding.","study":"AN0339 log sources vs its stated platform logic; coverage-gap documentation."},{"id":"h08","type":"order","title":"ESXi response, evidence first","sc":[{"label":"Incident note","text":"AN0337 fired: bkp-admin removed via vSphere API from an IP outside ExpectedIPs, role Administrator, no window. vCenter is still reachable. The on-call lead demands actions in the correct order — “nothing that destroys evidence”."}],"q":"Order the five response actions from first to last.","seq":[{"t":"Export and hash the hostd and vpxa logs off the host","why":"Log files live on the possibly-tampered host — get them off and hashed before anything changes."},{"t":"Snapshot the current account and role state (esxcli account list, role list) into the case file","why":"You need a frozen picture of what exists now to compare against later — cheap, read-only, evidence-building."},{"t":"Escalate with the evidence to the incident commander for a contain decision","why":"Containment on the hypervisor layer has business cost (VM impact), so the decision is escalated with evidence in hand."},{"t":"Revoke the session and rotate the compromised credentials","why":"Only after preservation: kill the attacker’s live access without rewriting the logs you still needed."},{"t":"Rebuild or restore the affected account state per the change process","why":"Remediation comes last — after evidence, snapshot, decision, and revocation, under change control."}],"hint":"Two read-only actions come before anything that changes state; the decision to contain is made by a human, with evidence.","explain":"Evidence-safe order: <b>export+hash → snapshot state → escalate with evidence → revoke sessions/rotate creds → rebuild<\/b>. The ordering rule that generalises: read-only preservation before any state change, and the contain decision goes to the incident commander <i>with<\/i> evidence because hypervisor containment (host isolation, vCenter lockdown) carries real VM-availability cost. Revocation precedes rebuild so the attacker cannot re-delete while you repair — a documented T1531 follow-up pattern. Teams that rebuild first routinely discover afterwards that they cannot prove which accounts existed, which the same attacker (or the same audit) will ask about.","study":"AN0337 incident handling: evidence preservation before state change on the hypervisor."},{"id":"h09","type":"branch","title":"Windows conflict: the lockout storm","sc":[{"label":"ARTEFACT 1 — WinEventLog:Security (10 minutes)","log":["04:41–04:51  EventCode=4740  TargetUserName=svc-sql1, svc-sql2, svc-app1, svc-app2 … (8 lockouts, cycle repeating)","04:44:12  EventCode=4723  SubjectUserName=adm-riley  TargetUserName=adm-riley  (self password change attempt, once)"]},{"label":"ARTEFACT 2 — Sysmon EventCode=1 (same period)","log":["04:41:02  WKS-88: explorer.exe → cmd.exe → net.exe (user: CORP\\adm-riley)  — one invocation only","04:41:05  svc-sql1 lockout follows (bad-password storm against DC from WKS-88, no admin action taken)"]},{"label":"Context","text":"adm-riley is a domain admin who logged on interactively to WKS-88 this morning. No maintenance window is open. The SOC queue labels the 4740 storm “possible brute force — possible T1531”. A senior suggests immediately disabling all eight service accounts “to be safe”."}],"q":"Resolve the three steps.","steps":[{"q":"STEP 1 — What does the artefact pair say the lockout storm is?","options":[{"t":"A bad-password storm from WKS-88 after the admin’s single self-change attempt — a side effect, not the attack","why":"Correct — the storm follows the credential change as cached credentials fail; no admin action deletes or disables anything."},{"t":"A brute-force campaign against the service accounts","why":"Wrong — the source is an internal workstation in an admin session, not an external spraying pattern; the timing is tied to the self-change."},{"t":"Proof that ransomware is executing on WKS-88","why":"Wrong — nothing in the artefacts shows encryption or malware execution; this is credential fallout."}],"answer":0},{"q":"STEP 2 — Which single line is the T1531-relevant candidate?","options":[{"t":"The 4723 self-change attempt by adm-riley with the cmd → net lineage","why":"Correct — the only account-<i>modification<\/i> behaviour present, with an interactive lineage AN0334 correlates."},{"t":"The 4740 lockouts themselves","why":"Wrong — lockouts are the DC0010 signal class, but here they are consequences, not the modification to investigate."},{"t":"None — no line qualifies","why":"Wrong — the 4723 with lineage is exactly what AN0334 exists to surface, even when it turns out authorised."}],"answer":0},{"q":"STEP 3 — Which action is correct?","options":[{"t":"Do not mass-disable the service accounts; verify the admin’s change with adm-riley out-of-band and keep the storm on a watch","why":"Correct — the least aggressive correct action: mass-disabling eight production services causes an outage and destroys the password state the investigation needs."},{"t":"Disable all eight service accounts immediately “to be safe”","why":"Wrong — that is the offered aggressive trap: production impact now, evidence loss (credential state) included, and the storm was a side effect."},{"t":"Close everything as benign without touching anything","why":"Wrong — the 4723 with fresh lineage still needs the one-question verification; closing without it is the opposite error."}],"answer":0}],"hint":"Step 1: what changed on WKS-88 first? Step 2: modification vs consequence. Step 3: the least aggressive option that still answers one question.","explain":"The artefacts resolve it: the <b>lockout storm is fallout<\/b> — an admin’s self-service password change at 04:44 broke cached credentials, and the services began failing. The T1531-relevant line is the <b>4723 with the interactive net.exe lineage<\/b>, which AN0334 correlates and which needs exactly one verification: “adm-riley, did you change your password on WKS-88?” — asked out-of-band. Mass-disabling eight production accounts is the aggressive trap: real outage, destroyed credential state, and zero investigative gain. This is the HARD-tier shape: the loudest artefact is the benign one, the quiet one carries the question, and the correct action is the least aggressive one that still answers it.","study":"AN0334 triage: modification events vs lockout fallout; least-aggressive verification."},{"id":"h10","type":"qcm","title":"macOS near-miss: read vs delete","sc":[{"label":"Two macos:unifiedlog lines","log":["line 1:  dscl . -read /Users/bkp-adm  (actor: auditd-svc, scheduled compliance scan)","line 2:  dscl . delete /Users/bkp-adm  (actor: newadmin2, tty ttys003, 6 minutes after first-ever sudo)"]},{"label":"Context","text":"AN0336 watches “dscl . delete” and “sysadminctl --deleteUser” combined with anomalous ancestry or session launch. CommandLinePattern tuning matches the command <i>verb<\/i>, not the binary alone."}],"q":"Which line matches the AN0336 CommandLinePattern, and why?","options":[{"t":"Line 2 — the verb is “delete”; line 1 is a read that the pattern correctly ignores","why":"Correct — the pattern keys on the delete verb; -read is an audit lookup that fires for every compliance scan otherwise."},{"t":"Line 1 — any dscl invocation matches, and it runs from a service account","why":"Near-miss — binary-only matching is the trap; it would alert on every scheduled scan and bury the real deletion."},{"t":"Both — dscl is always anomalous on macOS","why":"Near-miss — dscl is the standard directory tool; the analytic keys on destructive verbs plus anomalous session context."},{"t":"Neither — only sysadminctl counts","why":"Near-miss — sysadminctl --deleteUser is the other watched pattern, but dscl . delete is explicitly named too."}],"answer":0,"hint":"The analytic names a verb, not just a binary. Which line performs that verb?","explain":"<b>Line 2<\/b> matches: <b>dscl . delete<\/b> is the destructive verb the CommandLinePattern keys on, and the session context (first-ever sudo minutes before) supplies the anomalous-launch half. Line 1 is <b>dscl . -read<\/b> — a directory read used by scheduled compliance tooling; matching on the binary alone would alert on every scan run and make the analytic unusable. The other near-misses are real-world arguments you will hear (“any dscl is suspicious”, “only sysadminctl matters”) — each is defensible in some tuning debate, but the analytic as written keys on the verb plus context. Verb-level matching plus session anomaly is what keeps macOS coverage precise.","study":"AN0336 CommandLinePattern: the delete verb in dscl and sysadminctl, with anomalous session context."},{"id":"h11","type":"blank","title":"Complete the AN0338 rule sentence","sc":[{"label":"Redacted analytic card","text":"“O365 UnifiedAuditLog entries for Remove-Mailbox or Set-Mailbox with account disable or delete actions correlated with anomalous ____ ____ or ____ ____.”<br>Word bank (use one word per blank): <b>sign-in<\/b>, <b>location<\/b>, <b>MFA<\/b>, <b>bypass<\/b>, <b>mailbox<\/b>, <b>quota<\/b>."}],"q":"Fill the four blanks to complete the AN0338 logic sentence.","words":["sign-in","location","MFA","bypass","mailbox","quota"],"text":"Remove-Mailbox or Set-Mailbox disable-or-delete actions correlated with anomalous ____ ____ or ____ ____.","blanks":[{"accept":["sign-in","sign in","signin"],"why":"The first pair is “sign-in location” — the GeoThreshold half of the correlation."},{"accept":["location","geo","geography"],"why":"…“sign-in location”, tuned by GeoThreshold against the actor’s baseline geography."},{"accept":["MFA","mfa"],"why":"The second pair is “MFA bypass” — the authentication-control failure that often precedes cloud account takeover."},{"accept":["bypass","by pass"],"why":"…“MFA bypass”: the action landed on a session that defeated or skipped the second factor."}],"hint":"Two pairs: one is about geography, one is about the second authentication factor.","explain":"The completed sentence: <b>“…correlated with anomalous sign-in location or MFA bypass.”<\/b> Those are the two cloud session anomalies AN0338 joins with the mailbox actions: an impossible or unusual <b>sign-in location<\/b> (tuned via GeoThreshold) and an <b>MFA bypass<\/b> — a session that reached the admin cmdlet without properly satisfying the second factor. The word bank’s “mailbox” and “quota” are the decoys: mailbox quota alerts belong to capacity monitoring, not to account-removal detection. Being able to recite the join in one sentence is how detection engineers hand rules to SOC teams without losing the logic.","study":"The AN0338 description and its two correlation halves (GeoThreshold; MFA bypass)."},{"id":"h12","type":"order","title":"Build order under ransomware pressure","sc":[{"label":"Roadmap meeting — 30 minutes","text":"CTI briefing: “Akira deletes administrator accounts prior to encryption.” You can build only four DET0120-related detections this quarter, in order. Environment: 400 Windows endpoints, 30 Linux servers, 12 ESXi hosts, M365 tenant, Okta as IdP. The ESXi hosts have no central log shipping yet; Okta logs are already centralised."}],"q":"Rank the four build items from first (position 1) to last (position 4).","seq":[{"t":"Ship AN0339 (Okta bulk + SessionDeviceType) — logs are already centralised","why":"Identity-first and fastest to value: the telemetry already exists, and bulk removal at the IdP gates everything else."},{"t":"Ship AN0337 (ESXi RemoveUser + vpxa) together with host log shipping","why":"The stated blind spot and the Akira-relevant layer; build the pipeline and the analytic as one item."},{"t":"Ship AN0334 (Windows 4723/4724/4740 + Sysmon lineage)","why":"Wide endpoint coverage where T1531 and its net.exe lineage first show — high value, existing Sysmon telemetry."},{"t":"Ship AN0335 (Linux auditd chain)","why":"Valuable, but a smaller fleet and slower exploit path than identity, hypervisor, or Windows in this threat model."}],"hint":"Value = threat relevance × (how fast telemetry can be live). What already ships logs today?","explain":"A defensible order given the briefing: <b>AN0339 → AN0337 → AN0334 → AN0335<\/b>. Rule one of roadmap triage: an analytic without telemetry is a wish, so Okta (logs already central, identity is the master key, SessionDeviceType + BulkActionThreshold both map to Akira-style pre-encryption sweeps) ships first. ESXi second — it is the named blind spot and the classic pre-ransomware battleground, but it needs the log pipeline built alongside. Windows third (huge fleet, existing Sysmon, net.exe lineage matches the TTP), Linux last (small fleet, slower attack path). Your order may differ with different facts — the skill being tested is arguing the order from threat × telemetry, not memorising one.","study":"Detection build prioritisation: threat relevance × telemetry readiness, using the six DET0120 analytics."},{"id":"h13","type":"qcm","title":"Impossible travel that isn’t — what do you check first?","sc":[{"label":"ARTEFACT 1 — m365:signinlogs","log":["22:31:07  sign-in finance-hr@corp  geo: Oslo, NO  device: unknown-browser","22:42:15  sign-in finance-hr@corp  geo: Lagos, NG  device: unknown-browser  (flagged: impossible travel)"]},{"label":"ARTEFACT 2 — m365:unified","log":["22:44:50  operation=Remove-Mailbox  actor=finance-hr@corp  target=finance-intern-mailbox"]},{"label":"Context","text":"The company’s VPN egress for the Nordics sits in Oslo. The SOC playbook says: before escalating identity alerts, verify whether any session rides corporate VPN. No asset inventory ties “unknown-browser” to a managed device, and the mailbox target was an intern who left last week."}],"q":"What should you check first, before declaring a compromised account?","options":[{"t":"Whether the Oslo session is the corporate VPN egress — which would collapse the “impossible travel” flag","why":"Correct — the playbook and the incomplete device data both point there: one VPN check can turn two “locations” into one actor and change the whole story."},{"t":"Escalate immediately as a confirmed account takeover","why":"Near-miss — defensible when telemetry is complete; here the scenario hands you a specific unresolved ambiguity to check first."},{"t":"Ignore the alert because the target was a departed intern","why":"Near-miss — target irrelevance does not clear the actor; an attacker testing mailbox-level access often starts with low-value targets."},{"t":"Block the Lagos IP range at the firewall","why":"Near-miss — a real option in some worlds, but it changes state, does not resolve the identity question, and may destroy the session evidence."}],"answer":0,"hint":"The playbook exists for this exact artefact pattern, and one fact is explicitly missing about the first session.","explain":"The correct first move is the <b>VPN egress check<\/b>: if the Oslo session is corporate VPN, the “impossible travel” collapses into one actor switching networks — and the Lagos session becomes the anomaly to chase alone. The scenario deliberately leaves “unknown-browser” unresolved, and the playbook names the verification. The other options are defensible in other worlds: escalating instantly is right when telemetry is complete; ignoring on target-irrelevance is the classic under-reaction (attackers probe with low-value mailboxes first); blocking the IP is a state change that buys nothing evidentially. HARD-tier work is resolving ambiguity in the right order — identity questions before network blocks.","study":"AN0338 GeoThreshold in context: VPN egress baselining before escalation."},{"id":"h14","type":"query","title":"Query editor: implement the AN0334 filter","sc":[{"label":"Task from the detection lead","text":"“Write the search that returns AN0334’s account-modification events on the Security channel, excluding the nightly maintenance window 22:00–06:00. Keep it simple: source, event codes, and the time exclusion. Do not add destructive commands.”"}],"q":"Type a search query that returns the AN0334 account events from WinEventLog:Security for codes 4723, 4724, 4740, excluding the 22:00–06:00 maintenance window.","prompt":"Editor notes: any SIEM-style syntax is fine (SPL/KQL-ish). Your query must show: the Security channel, the three event codes (or a set of them), and an exclusion of the maintenance window. Do not include state-changing or delete operations.","template":"index=win EventCode= ","elements":[{"t":"Security channel (WinEventLog:Security or “Security”)","any":["wineventlog:security","win_sec","source security","logname security","security"],"why":"The analytic reads the Windows Security channel — without it you are not looking at DC0010 events."},{"t":"EventCode 4723 / 4724 / 4740 (the account-modification set)","any":["4723","4724","4740","eventcode in (4723","eventcode=4723"],"why":"The three codes are the analytic’s DC0010 filter; at least the reset code must appear."},{"t":"Time-window exclusion (NOT / outside / except + window expression)","any":["not between","outside","earliest=-","not 22:00","!= 22:00","exclude","date_hour"],"why":"TimeWindow semantics: alert outside the maintenance window, so the query must express the exclusion."}],"forbidden":[{"t":"| delete / rm / remove-style state change","why":"Detection queries read data; anything that deletes or modifies state is forbidden in this editor."}],"danger":["| delete","rm -","remove ","update set","drop "],"dangerNote":"Your query contains a state-changing or destructive element — in a real SOC pipeline this would risk destroying log data.","canon":"index=win_sec EventCode IN (4723,4724,4740)\n| search NOT date_hour>=22 OR date_hour<6\n| table _time, EventCode, SubjectUserName, TargetUserName, host","hint":"One line per requirement: channel, codes, exclusion. This is a read-only query — no state changes.","explain":"The canonical search: <code>index=win_sec EventCode IN (4723,4724,4740)<\/code> selects DC0010 account events from the Security channel; the NOT clause excludes the 22:00–06:00 maintenance window, implementing TimeWindow; the table projection returns the fields analysts triage on (actor, target, host, time). Your query scored per element: channel, code set, and the exclusion expression — each is one graded item, and any destructive keyword (| delete, rm, drop) is flagged as a dangerous near-miss because a “detection” query that changes state is a pipeline hazard, not a shortcut. Note the read-only discipline: in every SIEM, the person who writes delete-pipes into scheduled searches gets a very personal incident.","study":"Translating an ATT&amp;CK analytic into a read-only SIEM search: channel + filter + time semantics."},{"id":"h15","type":"qcm","title":"Least aggressive correct action","sc":[{"label":"Confirmed scenario","text":"AN0339 fired: 30 Okta deactivations in 4 minutes, initiated from an unfamiliar administrative session device type. Identity team confirms no offboarding run is scheduled. Okta admins can still log in; the attacker session may still be live. The CISO asks: “contain it — but we run payroll from this tenant tonight.”"}],"q":"Which action contains the incident with the least acceptable damage?","options":[{"t":"Terminate the suspect admin sessions and require re-auth with step-up MFA for all admin roles","why":"Correct — kills the live removal path, preserves tenant function for payroll, and evidence (log export) can happen in parallel."},{"t":"Delete the attacker’s accounts and restore the 30 deactivated accounts from backup immediately","why":"Near-miss — “restore everything” changes state before evidence export and does not close the attacker’s live session; the removals will likely repeat."},{"t":"Shut down the entire SaaS tenant until morning","why":"Near-miss — full containment, disproportionate cost: it guarantees payroll failure and is the aggressive option the CISO explicitly priced."},{"t":"Disable the AN0339 analytic to stop the alert noise while you investigate","why":"Near-miss — it silences the only SaaS visibility you have; defensible only as satire, which is why it is here."}],"answer":0,"hint":"One option kills the attacker’s access without killing payroll. The others either keep the door open or burn the building.","explain":"<b>Session termination + step-up MFA for admins<\/b> is the least aggressive action that actually contains: it removes the live removal path (the sessions), keeps the tenant running for payroll, and pairs with an immediate Okta audit-log export for evidence. Restoring accounts first leaves the attacker active — T1531 removals are cheap to repeat, and early restoration destroys the state you are investigating. A full tenant shutdown is the disproportionate option the CISO priced out. And disabling the analytic is the anti-answer: it removes your only SaaS telemetry mid-incident. The general rule: containment should cut the attacker’s access, not the organisation’s — and never the detection.","study":"Containment trade-offs for SaaS identity incidents detected by AN0339."}],"timerSec":2400};</script>
<script>
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EX=window.__EXAM__;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim().replace(/[’']/g,String.fromCharCode(39));}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var SEVKEY={easy:'--sev-easy',medium:'--sev-medium',hard:'--sev-hard','extremely-hard':'--sev-extreme'};
var SEVWORD={easy:'EASY',medium:'MEDIUM',hard:'HARD','extremely-hard':'EXTREMELY HARD'};
var SEVCLS={easy:'easy',medium:'medium',hard:'hard','extremely-hard':'extreme'};
var S={phase:'intro',ord:[],i:0,sum:0,ans:0,marks:{},checked:{},hint:{},answers:{},skip:{},
state:'IDLE',remain:0,int:null,manMs:0,fbMs:0,pStart:0,pKind:'',priorState:null,
reported:false,fromReview:false,started:false};
function fmtT(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function scoreExercise(sel,corr){var cs={},i;for(i=0;i<corr.length;i++)cs[corr[i]]=1;
var H=0,W=0;for(i=0;i<sel.length;i++){if(cs[sel[i]])H++;else W++;}var N=corr.length;
return {N:N,H:H,W:W,credit:Math.max(0,(H-W)/N)};}
var view=document.getElementById('view');
function clearView(){view.innerHTML='';window.scrollTo(0,0);}
/* ---------- header ---------- */
function renderHeader(){
 var h=document.getElementById('hdrinner');
 var n=S.ord.length||EX.ex.length,pos=S.ord.length?Math.min(S.i+1,S.ord.length):'—';
 var sc=S.ans>0?Math.round(S.sum/S.ans*100):0;
 var stTxt={IDLE:'⏱ READY',RUNNING:'▶ RUNNING',PAUSED_MANUAL:'⏸ PAUSED — manual (press Resume)',
  PAUSED_AUTO_CHECK:'⏸ PAUSED — reviewing feedback (resumes on Next)',ENDED:'■ ENDED'}[S.state]||'⏱ READY';
 var stCls={RUNNING:'run',PAUSED_MANUAL:'pause',PAUSED_AUTO_CHECK:'pause',ENDED:'end'}[S.state]||'';
 h.innerHTML='<div class="hrow">'
 +'<span class="hchip">Exercise <b id="expos">'+pos+'</b> of <b>'+n+'</b></span>'
 +'<span class="badge '+SEVCLS[META.difficulty]+'" aria-label="Severity '+SEVWORD[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +'<span class="tstate '+stCls+'" role="status"><span class="mono" id="tclock">'+fmtT(S.remain)+'</span> '+stTxt+'</span>'
 +'<span class="hchip">Score <b>'+S.sum.toFixed(1)+' / '+S.ans+'</b> <span class="muted">('+sc+'%)</span></span>'
 +'<span style="flex:1"></span>'
 +'<button id="btnHint" class="ghost" title="One hint per exercise (−10% of this exercise credit)">💡 Hint</button>'
 +'<button id="btnPause" class="ghost">⏸ Pause</button>'
 +'<button id="btnSkip" class="ghost">⚠ Skip</button>'
 +'</div><div id="pbar"><div id="pfill"></div></div>';
 document.getElementById('btnHint').onclick=useHint;
 document.getElementById('btnPause').onclick=manualPause;
 document.getElementById('btnSkip').onclick=skipEx;
 updateProgress();
}
function updateProgress(){
 var f=document.getElementById('pfill');if(!f)return;
 var done=0,i;for(i in S.checked)if(S.checked[i])done++;
 var pct=S.ord.length?Math.round(done/S.ord.length*100):0;f.style.width=pct+'%';
}
/* ---------- timer ---------- */
function setTimerState(st){S.state=st;renderHeaderClock();}
function renderHeaderClock(){renderHeaderSilent();}
function renderHeaderSilent(){
 var h=document.getElementById('hdrinner');if(!h)return;
 var stTxt={IDLE:'⏱ READY',RUNNING:'▶ RUNNING',PAUSED_MANUAL:'⏸ PAUSED — manual (press Resume)',
  PAUSED_AUTO_CHECK:'⏸ PAUSED — reviewing feedback (resumes on Next)',ENDED:'■ ENDED'}[S.state];
 var stCls={RUNNING:'run',PAUSED_MANUAL:'pause',PAUSED_AUTO_CHECK:'pause',ENDED:'end'}[S.state]||'';
 var tEl=document.querySelector('.tstate');
 if(tEl){tEl.className='tstate '+stCls;tEl.innerHTML='<span class="mono">'+fmtT(S.remain)+'</span> '+stTxt;}
 renderHeaderScoreOnly();
}
function renderHeaderScoreOnly(){
 var chips=document.querySelectorAll('.hchip');
 for(var k=0;k<chips.length;k++){
  var m=chips[k].innerHTML.match(/Score/);
  if(m){var sc=S.ans>0?Math.round(S.sum/S.ans*100):0;
   chips[k].innerHTML='Score <b>'+S.sum.toFixed(1)+' / '+S.ans+'</b> <span class="muted">('+sc+'%)</span>';}
 }
}
function tick(){
 if(S.state!=='RUNNING')return;
 S.remain--;
 if(S.remain<=0){S.remain=0;setTimerState('ENDED');stopInt();finalize(true);return;}
 var c=document.getElementById('tclock');if(c)c.textContent=fmtT(S.remain);
}
function startInt(){stopInt();S.int=setInterval(tick,1000);}
function stopInt(){if(S.int){clearInterval(S.int);S.int=null;}}
/* ---------- intro ---------- */
function renderIntro(){
 S.phase='intro';clearView();
 var it=EX.intro;
 var w=document.createElement('div');w.className='wrap';
 var html='<div class="card">'
 +'<h1>'+esc(it.title)+'</h1>'
 +'<p class="muted" style="margin-top:0">'+esc(it.idname)+'</p>'
 +'<div class="kv"><span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span></div>'
 +'<div class="intro-facts">'
 +'<div class="fact"><div class="fl">EXERCISES IN THIS FILE</div><div class="fv">'+EX.ex.length+' exercises</div></div>'
 +'<div class="fact"><div class="fl">ESTIMATED TIME</div><div class="fv">about '+META.estimatedMinutes+' minutes</div></div>'
 +'<div class="fact"><div class="fl">TIMER BUDGET</div><div class="fv">'+fmtT(S.remain)+' countdown</div></div>'
 +'<div class="fact"><div class="fl">PASS MARK</div><div class="fv">70% — PASS at 70% or more</div></div>'
 +'</div></div>';
 html+='<div class="card"><h2>What you will learn here</h2>';
 for(var i=0;i<it.learn.length;i++)html+='<p>'+it.learn[i]+'</p>';
 html+='</div>';
 html+='<div class="card"><h2>Keywords covered in this exam</h2>';
 for(i=0;i<it.themes.length;i++){var th=it.themes[i];
  html+='<div class="theme"><h4>'+esc(th.name)+'</h4><ul>';
  for(var j=0;j<th.items.length;j++)html+='<li>'+th.items[j]+'</li>';
  html+='</ul></div>';
 }
 html+='</div>';
 html+='<div class="card"><h2>How this exam works</h2>';
 for(i=0;i<it.how.length;i++)html+='<p>'+it.how[i]+'</p>';
 html+='<h3>Exercise types used in this file</h3><div class="kv">';
 for(i=0;i<it.types.length;i++)html+='<span>'+esc(it.types[i])+'</span>';
 html+='</div>';
 html+='<div class="actions"><button class="primary" id="btnStart">▶ Start the exam</button>'
 +'<span class="note">Timer starts when you press Start.</span></div></div>';
 w.innerHTML=html;view.appendChild(w);
 document.getElementById('btnStart').onclick=startExam;
}
/* ---------- exam flow ---------- */
function startExam(){
 S.started=true;S.phase='exam';S.sum=0;S.marks={};S.checked={};S.hint={};S.answers={};S.skip={};
 S.i=0;S.fromReview=false;S.reported=false;S.manMs=0;S.fbMs=0;S.pKind='';
 S.ord=shuffle(EX.ex.map(function(e,k){return k;}));
 S.remain=EX.timerSec;setTimerState('RUNNING');startInt();
 renderHeader();renderExercise(S.ord[0],false);
}
function curExIdx(){return S.ord[Math.min(S.i,S.ord.length-1)];}
function skippedList(){var a=[],i;for(i=0;i<S.ord.length;i++){if(S.skip[S.ord[i]]&&!S.checked[S.ord[i]])a.push(S.ord[i]);}return a;}
function nextExercise(){
 if(S.state==='PAUSED_AUTO_CHECK'){S.fbMs+=Date.now()-S.pStart;S.pKind='';}
 if(S.fromReview){setTimerState('RUNNING');startInt();renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){setTimerState('RUNNING');startInt();renderReview();return;}
  finalize(false);return;
 }
 setTimerState('RUNNING');startInt();
 renderExercise(S.ord[S.i],false);
}
function skipEx(){
 if(S.phase!=='exam')return;
 var k=curExIdx();
 if(!S.checked[k])S.skip[k]=true;
 nextRawSkip();
}
function nextRawSkip(){
 if(S.fromReview){renderReview();return;}
 S.i++;
 while(S.i<S.ord.length&&S.checked[S.ord[S.i]])S.i++;
 var pend=skippedList();
 if(S.i>=S.ord.length){
  if(pend.length>0&&S.state!=='ENDED'){renderReview();return;}
  finalize(false);return;
 }
 renderExercise(S.ord[S.i],false);
}
function manualPause(){
 if(S.state!=='RUNNING'&&S.state!=='PAUSED_AUTO_CHECK')return;
 S.priorState=S.state;S.pStart=Date.now();S.pKind='manual';
 setTimerState('PAUSED_MANUAL');stopInt();
 var ov=el('div','overlay');
 ov.innerHTML='<div class="ot">⏸ PAUSED — manual</div>'
 +'<p class="muted">The exercise is hidden while you take a break. The timer is stopped.</p>'
 +'<button class="primary" id="btnResume">▶ Resume</button>';
 document.body.appendChild(ov);
 document.getElementById('btnResume').onclick=function(){
  S.manMs+=Date.now()-S.pStart;document.body.removeChild(ov);
  if(S.priorState==='PAUSED_AUTO_CHECK'){S.pStart=Date.now();S.pKind='feedback';}
  setTimerState(S.priorState||'RUNNING');
  if(S.state==='RUNNING')startInt();
 };
}
function useHint(){
 if(S.phase!=='exam')return;
 var k=curExIdx(),ex=EX.ex[k];
 if(S.checked[k]||S.hint[k])return;
 S.hint[k]=true;
 var box=document.getElementById('hintbox');
 if(!box){box=el('div','hintbox');box.id='hintbox';
  box.innerHTML='<div class="ht">💡 HINT (one per exercise — costs 10% of this exercise credit)</div><div id="hinttxt"></div>';
  var ans=document.getElementById('ansblk');if(ans)ans.parentNode.insertBefore(box,ans);
 }
 document.getElementById('hinttxt').textContent=ex.hint;
}
/* ---------- rendering one exercise ---------- */
var CUR={k:-1,collect:null};
function renderExercise(k,fromReview){
 clearView();S.fromReview=fromReview;CUR.k=k;
 var ex=EX.ex[k];S.answers[k]=S.answers[k]||null;
 var posEl=document.getElementById('expos');
 if(posEl)posEl.textContent=String(S.ord.indexOf(k)+1);

/* ---------- grading ---------- */
function grade(ex,got){
 var rows=[],N=0,H=0,W=0;
 var i;
 if(ex.type==='qcm'){
  N=1;var sel=got.sel[0];var ok=sel===ex.answer;
  if(ok)H++;else if(sel>=0)W++;
  rows.push({s:ok?'ok':'bad',t:'You selected: '+ex.options[sel].t,
   why:ok?ex.options[ex.answer].why:ex.options[sel].why});
  if(!ok)rows.push({s:'miss',t:'Correct answer: '+ex.options[ex.answer].t,why:ex.options[ex.answer].why});
 }
 else if(ex.type==='multi'){
  var corrIdx=ex.correct;
  N=corrIdx.length;
  var selMap={};for(i=0;i<got.sel.length;i++)selMap[got.sel[i]]=1;
  for(i=0;i<corrIdx.length;i++){
   if(selMap[corrIdx[i]]){H++;rows.push({s:'ok',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});}
   else rows.push({s:'miss',t:ex.options[corrIdx[i]].t,why:ex.options[corrIdx[i]].why});
  }
  for(i=0;i<got.sel.length;i++){
   var s=got.sel[i];var isCorr=false;
   for(var c=0;c<corrIdx.length;c++)if(corrIdx[c]===s)isCorr=true;
   if(!isCorr){W++;rows.push({s:'bad',t:ex.options[s].t,why:ex.options[s].why});}
  }
 }
 else if(ex.type==='match'){
  N=ex.lefts.length;
  for(i=0;i<ex.lefts.length;i++){
   var okM=got.vals[i]===ex.lefts[i].r;
   if(okM)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okM?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.lefts[i].t+' → '+(got.vals[i]>=0?ex.rights[got.vals[i]].t:'no answer'),
    why:ex.lefts[i].why});
  }
 }
 else if(ex.type==='dnd'){
  N=ex.items.length;
  for(i=0;i<ex.items.length;i++){
   var okD=got.vals[i]===ex.items[i].zone;
   if(okD)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okD?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.items[i].t+' → '+(got.vals[i]>=0?ex.zones[got.vals[i]].t:'not placed'),
    why:ex.items[i].why});
  }
 }
 else if(ex.type==='order'){
  N=ex.seq.length;
  for(i=0;i<ex.seq.length;i++){
   var okO=got.vals[i]===i+1;
   if(okO)H++;else if(got.vals[i]>0)W++;
   rows.push({s:okO?'ok':(got.vals[i]>0?'bad':'miss'),
    t:'“'+ex.seq[i].t+'” correct position: '+(i+1)+(got.vals[i]>0?' — you chose '+got.vals[i]:' — no position chosen'),
    why:ex.seq[i].why});
  }
 }
 else if(ex.type==='triage'){
  N=ex.rows.length;
  for(i=0;i<ex.rows.length;i++){
   var okT=got.vals[i]===ex.rows[i].c;
   if(okT)H++;else if(got.vals[i]>=0)W++;
   rows.push({s:okT?'ok':(got.vals[i]>=0?'bad':'miss'),
    t:ex.rows[i].t+' → your verdict: '+(got.vals[i]>=0?ex.labels[got.vals[i]]:'none'),
    why:ex.rows[i].why});
  }
 }
 else if(ex.type==='blank'){
  N=ex.blanks.length;
  for(i=0;i<ex.blanks.length;i++){
   var v=norm(got.vals[i]);
   var okB=false;for(var a=0;a<ex.blanks[i].accept.length;a++)if(v===norm(ex.blanks[i].accept[a]))okB=true;
   if(okB)H++;else if(v.length>0)W++;
   rows.push({s:okB?'ok':(v.length>0?'bad':'miss'),
    t:'Blank '+(i+1)+': your answer “'+(got.vals[i]||'')+'” — expected “'+ex.blanks[i].accept[0]+'”',
    why:ex.blanks[i].why});
  }
 }
 else if(ex.type==='branch'){
  N=ex.steps.length;
  for(i=0;i<ex.steps.length;i++){
   var okS=got.sel[i]===ex.steps[i].answer;
   if(okS)H++;else W++;
   rows.push({s:okS?'ok':'bad',
    t:'Step '+(i+1)+': you chose “'+ex.steps[i].options[got.sel[i]].t+'”',
    why:okS?ex.steps[i].options[got.sel[i]].why:(ex.steps[i].options[got.sel[i]].why+' Correct: '+ex.steps[i].options[ex.steps[i].answer].t+' — '+ex.steps[i].options[ex.steps[i].answer].why)});
  }
 }
 else if(ex.type==='query'){
  var q=norm(got.text);
  N=ex.elements.length;
  var missList=[];var dgr=null;
  for(i=0;i<ex.elements.length;i++){
   var okQ=false;
   for(var p=0;p<ex.elements[i].any.length;p++){
    if(q.indexOf(norm(ex.elements[i].any[p]))>=0){okQ=true;break;}
   }
   if(okQ)H++;else{missList.push(ex.elements[i]);rows.push({s:'miss',t:'Missing element: '+ex.elements[i].t,why:ex.elements[i].why});}
  }
  if(ex.forbidden){
   for(i=0;i<ex.forbidden.length;i++){
    if(q.indexOf(norm(ex.forbidden[i].t))>=0){W++;rows.push({s:'bad',t:'Harmful element found: '+ex.forbidden[i].t,why:ex.forbidden[i].why});}
   }
  }
  if(missList.length===0)rows.unshift({s:'ok',t:'All required elements present in the query.',why:''});
  if(ex.danger){
   for(i=0;i<ex.danger.length;i++){
    if(q.indexOf(norm(ex.danger[i]))>=0)dgr=ex.dangerNote||'Your query contains a state-changing or destructive element.';
   }
  }
  var credit=Math.max(0,(H-W)/N);
  return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:dgr,credit:credit};
 }
 var credit=Math.max(0,(H-W)/N);
 if(ex.type==='qcm')credit=credit>0?1:0;
 return{N:N,H:H,W:W,rows:rows,explain:ex.explain,canon:ex.canon||null,danger:null,credit:credit};
}
/* ---------- review skipped ---------- */
function renderReview(){
 clearView();
 var pend=skippedList();
 var w=el('div','wrap');
 var h='<div class="card"><h2>Review skipped exercises</h2>';
 if(pend.length===0){
  h+='<p class="muted">⚠ No skipped exercises left. You can submit now.</p>';
 }else{
  h+='<p class="muted">You skipped '+pend.length+' exercise(s). You can go back and answer them while the timer still runs. A skipped-and-never-answered exercise is excluded from your score.</p>';
  for(var i=0;i<pend.length;i++){
   var ex=EX.ex[pend[i]];
   h+='<div class="skipcard"><span class="st">⚠ Skipped</span><span class="sd">'+esc(ex.title)+'</span>'
   +'<button data-k="'+pend[i]+'" class="ansbtn">Answer it</button></div>';
  }
 }
 h+='<div class="actions"><button class="primary" id="btnFinal">⏭ Submit exam</button>'
 +'<span class="note">Submitting excludes anything still unanswered.</span></div></div>';
 w.innerHTML=h;view.appendChild(w);
 var btns=w.querySelectorAll('.ansbtn');
 for(var b=0;b<btns.length;b++){
  (function(k){btns[b].onclick=function(){renderExercise(k,true);};})(parseInt(btns[b].getAttribute('data-k'),10));
 }
 document.getElementById('btnFinal').onclick=function(){finalize(false);};
}
/* ---------- results ---------- */
function finalize(byTimeout){
 stopInt();
 if(S.state!=='ENDED')setTimerState('ENDED');
 clearView();
 var full=0,part=0,zero=0,partSum=0,answered=0,i;
 for(i=0;i<EX.ex.length;i++){
  if(S.checked[i]){answered++;var c=S.marks[i];
   if(c>=1)full++;else if(c>0){part++;partSum+=c;}else zero++;}
 }
 var skipped=EX.ex.length-answered;
 var sum=0;for(i=0;i<EX.ex.length;i++)if(S.checked[i])sum+=S.marks[i];
 var pct=answered>0?Math.round(sum/answered*100):0;
 var pass=pct>=70;
 var w=el('div','wrap');
 var manS=Math.round(S.manMs/1000),fbS=Math.round(S.fbMs/1000);
 var h='<div class="card"><h1>Results — '+esc(META.title)+'</h1>'
 +'<div class="kv"><span class="badge '+SEVCLS[META.difficulty]+'">'+SEVWORD[META.difficulty]+'</span>'
 +'<span>Answered: '+answered+' of '+EX.ex.length+'</span>'
 +(byTimeout?'<span>⏱ Time ran out — unanswered exercises were excluded</span>':'')+'</div>'
 +'<div class="bigres">'
 +'<div class="res ok"><div class="rn">'+full+'</div><div class="rl">✓ Fully correct</div></div>'
 +'<div class="res part"><div class="rn">'+part+'</div><div class="rl">✓ Partially correct'+(part>0?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'
 +'<div class="res bad"><div class="rn">'+zero+'</div><div class="rl">✗ Fully incorrect</div></div>'
 +'<div class="res skip"><div class="rn">'+skipped+'</div><div class="rl">⚠ Skipped — excluded</div></div>'
 +'</div>'
 +'<p style="font-size:20px"><b>Final score: '+sum.toFixed(1)+' / '+answered+'</b> — '+pct+'% (pass mark 70%)</p>'
 +'<div class="verdict '+(pass?'pass':'fail')+'"><div class="vt">'+(pass?'✓ PASS':'✗ FAIL')+'</div>'
 +'<p>'+(pass?'Well done. You reached the pass mark for this severity.':'You must retake this exam to reach 70%. Review the explanations, then press Retake Exam.')+'</p></div>'
 +'<p class="small muted">Time accounting: '+fmtT(manS)+' paused manually (breaks) · '+fmtT(fbS)+' reviewing feedback (auto-pause after Check).</p>'
 +'<div class="actions"><button class="primary" id="btnRetake">↻ Retake Exam</button></div></div>';
 w.innerHTML=h;view.appendChild(w);
 document.getElementById('btnRetake').onclick=function(){startExam();};
 reportScore(sum,answered);
}
function reportScore(creditSum,answeredCount){
 if(S.reported)return;S.reported=true;
 var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 window.__learner={username:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
});
/* ---------- boot ---------- */
S.remain=EX.timerSec;
renderHeader();
renderIntro();
</script>
