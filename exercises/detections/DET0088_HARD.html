<script id="cm-data" type="application/json">{"meta": {"topicId": "det0088", "batch": 3, "title": "DET0088 Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002) — HARD", "difficulty": "hard", "questionCount": 15, "estimatedMinutes": 40, "passMark": 70, "objectId": "DET0088", "objectName": "Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002)"}, "sev": "HARD", "passMark": 70, "timerSeconds": 2400, "intro": {"learn": "<p>This exam trains <strong>DET0088</strong>, the ATT&amp;CK <strong>Detection Strategy</strong> that detects <strong>Backup Software Discovery (T1518.002)</strong> through command-line, registry, and process inspection on Windows (AN0240), Linux (AN0241), and macOS (AN0242).</p>\n<p>At <strong>HARD</strong> level the questions stop being friendly. Scenarios give you several artefacts that must be read together, and at least two answers will look defensible &mdash; only one survives when you apply the analytic logic precisely. You will separate Sysmon event 13 from 14, auditd SYSCALL from PATH, and backup-software discovery from its nearest neighbours (T1518.001 Security Software Discovery, T1007 System Service Discovery). You will also face the two classic triage traps: the <em>alarming-looking</em> command that is a documented routine, and the <em>quiet</em> event that is actually the first step of Inhibit System Recovery (T1490).</p>\n<p>This mirrors real work for a <strong>SOC analyst</strong> deciding whether to escalate, a <strong>detection engineer</strong> tuning <strong>UserContextScope</strong> and <strong>BackupConfigPaths</strong> without blinding the rule, and an <strong>incident responder</strong> choosing the least aggressive verified action. The mitigation story matters too: ATT&amp;CK notes this technique cannot be cleanly prevented because it abuses built-in system features &mdash; so detection quality <em>is</em> your control.</p>", "keywords": [{"group": "Event and channel precision", "items": ["Windows Security EID 4688 vs Sysmon EID 1", "Sysmon EID 13 (value set) vs 14 (object rename)", "Sysmon EID 11 file creation", "auditd:SYSCALL execve vs auditd:PATH file access", "macos:unifiedlog process and file events"]}, {"group": "Near-miss technique mapping", "items": ["T1518.002 vs T1518.001 Security Software Discovery", "T1007 System Service Discovery", "T1012 Query Registry", "T1490 Inhibit System Recovery follow-on"]}, {"group": "Tuning trade-offs", "items": ["KnownBackupVendors keyword design", "UserContextScope: interactive vs service accounts", "SuspiciousParentProcesses lineage", "BackupConfigPaths precision vs keyword-anywhere"]}, {"group": "Triage under ambiguity", "items": ["Routine admin enumeration vs adversary discovery", "Change windows and documented exceptions", "Corroboration before escalation"]}, {"group": "Response and coverage", "items": ["Least-aggressive verified action", "Hunt T1490-adjacent artefacts (vssadmin, bcdedit)", "Coverage gaps when Sysmon or 4688 auditing is missing"]}], "how": "<ul>\n<li><strong>Pass mark:</strong> 70%. Partial credit applies to every multi-item exercise: credit = (H &minus; W) / N.</li>\n<li><strong>Exercise types in this file:</strong> multiple choice, multi-select with partial credit, per-line log triage, two- and three-step decisions, ranking, matching, fill-in, and click-the-line lineage selection.</li>\n<li><strong>Timer:</strong> 40 minutes for 15 exercises. Scenarios are longer here &mdash; use the scenario panel's collapse control after reading. <strong>Check</strong> auto-pauses the timer while you study feedback; it resumes on <strong>Next</strong>.</li>\n<li><strong>Hints and skips:</strong> one hint per exercise costs 10% of that exercise's credit; HARD hints only remove one wrong path. Skip is free; skipped-and-never-answered exercises are excluded and reviewable while time remains.</li>\n</ul>\n<p>Press <strong>Start exam</strong> when you are ready.</p>"}, "exercises": [{"id": "H01", "type": "qcm", "summary": "Sysmon 13 vs 14 for the registry source", "scenario": [{"label": "ARTEFACT 1 — Sysmon config review ticket", "kind": "prose", "text": "Ticket DET-2260: \"Confirm which Sysmon registry events AN0240 consumes before we tighten the config.\" You open the AN0240 log-source card: channel WinEventLog:Sysmon, EventCode=13, 14, data component Windows Registry Key Modification (DC0063)."}, {"label": "ARTEFACT 2 — Sample events from the lab host", "kind": "mono", "lines": ["EventCode=13  EventType=SetValue      TargetObject: HKLM\\SOFTWARE\\Veeam\\Agent\\LastUpdate", "EventCode=14  EventType=RenameKey      TargetObject: HKLM\\SOFTWARE\\Acronis\\TempKey -> HKLM\\SOFTWARE\\Acronis\\Agent"]}], "question": "Which pairing correctly describes what EventCode 13 and 14 record?", "hint": "One of the two numbers is about renaming a key, not about changing a value.", "explain": "<p>Sysmon <strong>EID 13 records a registry value being set</strong>; <strong>EID 14 records a registry object being renamed</strong>. AN0240 consumes both under DC0063 because backup-software registry paths can be touched either way. Swapping the two is the classic near-miss; process creation (EID 1 / 4688) and file creation (EID 11) belong to the other two data components on the same card.</p>", "options": ["13 = registry object renamed; 14 = registry value set", "13 = registry value set; 14 = registry object renamed", "13 = process created; 14 = registry value set", "13 = value deleted; 14 = value read"], "answer": 1}, {"id": "H02", "type": "triage", "summary": "Assign four lines to the right analytic", "scenario": [{"label": "ARTEFACT 1 — Cross-platform log pull (use the filter box)", "kind": "mono", "lines": []}], "question": "Assign each highlighted line to the single DET0088 analytic that consumes it.", "hint": "The channel identifies the platform first; only then read the command. auditd PATH is file access, not execution.", "explain": "<p><strong>Line 1:</strong> 4688 on the Windows Security log with a vendor filter &mdash; <strong>AN0240</strong>. <strong>Line 2:</strong> auditd SYSCALL execve running find against vendor paths &mdash; <strong>AN0241</strong>. <strong>Line 3:</strong> unifiedlog showing system_profiler filtered to a mac backup product &mdash; <strong>AN0242</strong>. <strong>Line 4:</strong> auditd PATH recording a read of <code>/opt/veeam/config.ini</code> &mdash; file access on Linux, so <strong>AN0241</strong> again (DC0055), not AN0240 just because the vendor is Veeam, and not AN0242 just because it is file access.</p>", "log": [{"t": "WinEventLog:Security 4688 | tasklist | findstr /i \"acronis\" | host WS-118", "flag": true, "correct": 0}, {"t": "auditd:SYSCALL execve | user=svc-mon | find /opt -iname \"*veeam*\" | host BK-LIN-02", "flag": true, "correct": 1}, {"t": "macos:unifiedlog | Terminal -> system_profiler SPApplicationsDataType | grep -i \"Carbon Copy\" | host MAC-3", "flag": true, "correct": 2}, {"t": "auditd:PATH | open,read | /opt/veeam/config.ini | user=svc-mon | host BK-LIN-02", "flag": true, "correct": 1}, {"t": "macos:unifiedlog | backupd snapshot completed | host MAC-3", "flag": false, "correct": 2}, {"t": "WinEventLog:Sysmon 11 | TargetFilename: C:\\Temp\\inv.txt | host WS-118", "flag": false, "correct": 0}], "verdictOptions": ["AN0240", "AN0241", "AN0242"]}, {"id": "H03", "type": "decision", "summary": "Veeam-SVC alert on the backup server itself", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-5512", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "User: CORP\\VEEAM_SVC  Host: BK-01", "ParentImage: C:\\Windows\\System32\\cmd.exe  (scheduled job chk_veeam.cmd)", "CommandLine: sc query state= all | findstr /i veeam"]}, {"label": "ARTEFACT 2 — Host and change context", "kind": "prose", "text": "BK-01 is the Veeam server itself. Change ticket CHG-2287: \"backup job schedule change, validation this weekend\", owned by the backup team."}], "question": "Work the three steps, then press Check.", "hint": "Read the host name and the change ticket before you judge; the least aggressive verified action wins.", "explain": "<p><strong>Step 1:</strong> the behaviour matches AN0240 &mdash; service enumeration filtered to a backup vendor, from a shell parent; service accounts are not excluded by the analytic, they are a UserContextScope tuning note. <strong>Step 2:</strong> the strongest relaxing context is the host plus the owned change ticket &mdash; routine validation on the Veeam server itself. <strong>Step 3:</strong> the correct action is documenting the routine and keeping a tuning exception; isolating BK-01 or disabling VEEAM_SVC would break backups for an explained event.</p>", "steps": [{"q": "Per AN0240, does the event match the watched behaviour?", "opts": ["Yes — vendor-filtered service enumeration from a shell parent", "No — service accounts are always excluded from AN0240", "Only if Sysmon EID 13 is also present"], "ans": 0, "why": "The analytic matches on behaviour; UserContextScope is tuning guidance, not an exclusion rule."}, {"q": "Which context most reduces concern?", "opts": ["The command is short", "The host is the Veeam server and CHG-2287 explains the run", "The event uses 4688 instead of Sysmon"], "ans": 1, "why": "Expected host plus owned, scheduled change is the classic documented-routine pattern."}, {"q": "Best action?", "opts": ["Isolate BK-01 from the network", "Disable VEEAM_SVC pending investigation", "Document as routine with a tuning exception for the change window"], "ans": 2, "why": "Least aggressive verified action: the context is verifiable and expected; keep visibility, add an exception note."}]}, {"id": "H04", "type": "linepick", "summary": "macOS: click the line AN0242 would flag", "scenario": [{"label": "ARTEFACT 1 — macos:unifiedlog pull, host MAC-3", "kind": "mono", "lines": []}], "question": "Click the ONE line that AN0242 would flag for backup-software discovery.", "hint": "GUI use by the backup product itself is normal; a Terminal session reading its configuration is not.", "explain": "<p>The flagged line is <strong>Terminal reading the Carbon Copy Cloner preference domain</strong> (<code>defaults read com.bombich.ccc</code>): an interactive shell session inspecting a backup product’s configuration matches AN0242’s discovery profile (Terminal session plus backup-software settings access). The Time Machine daemon’s own snapshot work and a user opening the Time Machine app are the product doing its job; the Safari download is noise.</p>", "lines": [{"t": "backupd: scheduled snapshot verification completed", "c": false}, {"t": "bash (Terminal): defaults read com.bombich.ccc", "c": true}, {"t": "Finder: /Applications/Time Machine.app opened by user", "c": false}, {"t": "backupd: copying 4.2 GB to backup volume", "c": false}, {"t": "Safari: download finished (release notes.pdf)", "c": false}], "pick": 1}, {"id": "H05", "type": "qcm", "summary": "Nightly grep on the Linux backup host", "scenario": [{"label": "ARTEFACT 1 — auditd SYSCALL event", "kind": "mono", "lines": ["auditd:SYSCALL execve  02:00:03", "user=backupops  ppid=cron", "cmd=bash -c \"grep -ri veeam /opt/veeam/config.ini\"", "host=BK-LIN-01 (backup server)"]}, {"label": "ARTEFACT 2 — Asset note", "kind": "prose", "text": "backupops owns BK-LIN-01. A nightly integrity job runs at 02:00 from cron and greps the Veeam agent config, as documented in the runbook."}], "question": "What is the best assessment?", "hint": "Matching the behaviour and judging the context are two different steps — do both, in that order.", "explain": "<p>The behaviour <strong>does match AN0241</strong>: grep over Veeam configuration is exactly the watched pattern, so \"does not match\" answers are wrong. But <strong>matching is not maliciousness</strong>: the context (documented nightly cron job, owning account, backup host) makes this a routine administrative read. The correct call is \"matches, but context indicates routine work\" &mdash; a tuning exception, not an escalation.</p>", "options": ["It does not match AN0241 because cron is not a shell", "It matches AN0241 and is malicious because it touches Veeam paths", "It matches AN0242 because grep is a mac tool", "It matches AN0241, but the documented context indicates routine admin work"], "answer": 3}, {"id": "H06", "type": "multi", "summary": "Which telemetry gaps blind AN0240", "scenario": [{"label": "ARTEFACT 1 — Coverage review", "kind": "prose", "text": "A Windows host produced zero AN0240 hits for a month, and the purple team suspects blind spots. Review which gaps would actually blind the analytic on that host."}], "question": "Select the TWO telemetry gaps that would blind AN0240 on a Windows host.", "hint": "AN0240’s sources are Windows-only: the Security log and Sysmon.", "explain": "<p>AN0240 needs <strong>4688 process creation with command lines</strong> and <strong>Sysmon 13/14 and 11</strong>. If 4688 auditing (or its command-line content) is disabled, the analytic cannot see discovery commands; if <strong>Sysmon is not deployed</strong>, registry (DC0063) and file-creation (DC0039) telemetry vanish. auditd is Linux-only and unifiedlog is macOS-only, so they are irrelevant here; antivirus is not a required source for this analytic.</p>", "options": ["4688 process auditing is disabled (or command-line content is not captured)", "Sysmon is not deployed, so EID 13/14 and 11 are absent", "auditd is not installed on the host", "The macOS unified log rotated early", "The host has no antivirus product installed"], "answers": [0, 1]}, {"id": "H07", "type": "fill", "summary": "SIEM logic skeleton with the mutable elements", "scenario": [{"label": "ARTEFACT 1 — Draft AN0240 implementation note", "kind": "prose", "text": "Your detection engineer drafts the SIEM logic in plain sentences and asks you to fill the three gaps with the correct AN0240 element names and values."}], "question": "Fill the three blanks.", "hint": "Vendor list, parent class, user scope — the three AN0240 mutable elements, in that order.", "explain": "<p>The rule skeleton maps one-to-one to the AN0240 card: match command lines against the <strong>KnownBackupVendors</strong> list; require the parent to look like a <strong>scripting tool</strong> (SuspiciousParentProcesses: PowerShell, cmd, interpreters, LOLBins); and let <strong>UserContextScope</strong> keep service accounts out of the alert path. Getting any of the three wrong either floods the queue or blinds the rule.</p>", "template": "Fire when EventCode=4688 CommandLine matches the {0} list, ParentImage looks like a {1}, and {2} keeps routine service accounts out of scope.", "blanks": ["KnownBackupVendors", "scripting tool", "UserContextScope"], "bank": ["KnownBackupVendors", "scripting tool", "UserContextScope", "BackupConfigPaths", "DNS server", "printer driver"]}, {"id": "H08", "type": "order", "summary": "Response order after confirmed discovery on a DC", "scenario": [{"label": "ARTEFACT 1 — Confirmed incident note", "kind": "prose", "text": "AN0240 caught an attacker-run <code>reg query</code> for Veeam on DC-02; the account is confirmed compromised. The IR lead asks for the response sequence."}], "question": "Drag the four actions into the correct order (first action on top).", "hint": "Volatile evidence first; destructive rebuild comes last.", "explain": "<p>Order: <strong>(1) contain the account</strong> &mdash; disable and reset it while volatile evidence still exists; <strong>(2) hunt T1490-adjacent commands</strong> (vssadmin delete shadows, bcdedit /set recoveryenabled no) because backup discovery on a DC telegraphs recovery destruction; <strong>(3) alert the IR lead and the backup administrator</strong> so the backup estate is protected and watched; <strong>(4) reimage later</strong>, after forensics &mdash; rebuilding first destroys evidence and stops the hunt.</p>", "rankLabel": "Order the response actions (1 = first).", "items": ["Disable and reset the compromised account, preserving volatile evidence", "Hunt vssadmin delete shadows and bcdedit recoveryenabled no across hosts", "Alert the IR lead and the backup administrator to protect the backup estate", "Reimage DC-02 after forensic collection is complete"], "correct": [0, 1, 2, 3]}, {"id": "H09", "type": "qcm", "summary": "Weekly admin scan looks alarming", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-5590", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "User: CORP\\bkadmin  Host: WK-ADM-02 (admin workstation)", "ParentImage: explorer.exe (interactive)", "CommandLine: tasklist /svc | findstr /i \"veeam\""]}, {"label": "ARTEFACT 2 — Corroboration", "kind": "prose", "text": "Ticket CHG-2214: \"weekly backup capacity review\", owned by the backup team. bkadmin is in BACKUP_ADMINS. The command runs every Tuesday 10:00 and matches the runbook."}], "question": "What is the best action?", "hint": "The context is verifiable and expected — what does a mature playbook say about documented routines?", "explain": "<p>This is the \"looks alarming, is routine\" trap. The command is textbook AN0240 behaviour, but every context element corroborates a <strong>documented, scheduled, owned</strong> task: the change ticket, the group membership, the fixed schedule. The correct action is to <strong>close as known routine and add a tuning note</strong> for the window. Isolating the workstation or disabling an admin account for an explained weekly scan is disproportionate; deleting the task breaks a legitimate process.</p>", "options": ["Isolate WK-ADM-02 immediately and page the IR lead", "Disable the bkadmin account pending investigation", "Close as known routine and add a tuning note for the change window", "Delete the scheduled task and rerun the scan"], "answer": 2}, {"id": "H10", "type": "match", "summary": "Match artefacts to the mutable elements they tune", "scenario": [{"label": "ARTEFACT 1 — Tuning inputs collected from three platforms", "kind": "prose", "text": "Five tuning inputs came out of a purple-team day. Each one belongs to one mutable element of one analytic."}], "question": "Match each tuning input to the element it belongs to.", "hint": "Two of the five elements belong to the Linux analytic; the two macOS entries differ in what they scope.", "explain": "<p><strong>Veeam, Acronis, CrashPlan</strong> feed <strong>KnownBackupVendors</strong> (AN0240). <strong>cron, bash, python3</strong> in lineage feed <strong>ToolchainScope</strong> (AN0241) &mdash; the shells and interpreters attacker scripts use. <strong>/etc/rsnapshot.conf and /opt/veeam/config.ini</strong> feed <strong>BackupConfigPaths</strong> (AN0241). <strong>Preference plists</strong> feed <strong>KnownAppPlistPaths</strong> (AN0242), while the <strong>install bundle location</strong> belongs to <strong>InstallLocationScope</strong> (AN0242) &mdash; the directories where mac backup tools live. Mixing the Linux file paths with the macOS entries, or the two macOS elements with each other, is the designed near-miss.</p>", "pairs": [["The names Veeam, Acronis, CrashPlan", "KnownBackupVendors (AN0240)"], ["cron, bash, python3 seen in parent chains", "ToolchainScope (AN0241)"], ["/etc/rsnapshot.conf, /opt/veeam/config.ini", "BackupConfigPaths (AN0241)"], ["Preference plists under ~/Library/Preferences", "KnownAppPlistPaths (AN0242)"], ["Install bundles under /Applications", "InstallLocationScope (AN0242)"]]}, {"id": "H11", "type": "multi", "summary": "Select the recovery-destruction chain", "scenario": [{"label": "ARTEFACT 1 — Host FS-11 timeline (one evening)", "kind": "mono", "lines": ["T+00  powershell: reg query \"HKLM\\SOFTWARE\\Veeam\"", "T+04  vssadmin delete shadows /all /quiet", "T+07  bcdedit /set recoveryenabled no", "T+09  whoami /priv", "T+12  net user helpdesk1 /add", "T+15  7z a C:\\Windows\\Temp\\bk.7z D:\\Finance"]}], "question": "Select the THREE artefacts that form the backup-discovery to recovery-destruction chain.", "hint": "The chain is: find the backups, then make sure recovery is impossible. Generic recon and staging sit outside it.", "explain": "<p>The chain is <strong>reg query for Veeam</strong> (T1518.002 discovery) &rarr; <strong>vssadmin delete shadows</strong> and <strong>bcdedit recoveryenabled no</strong> (T1490 Inhibit System Recovery). <code>whoami /priv</code> is generic privilege checking, <code>net user /add</code> is persistence, and the 7z archive is collection/staging &mdash; all defensible activities in other chains, but not this one.</p>", "options": ["powershell: reg query \"HKLM\\SOFTWARE\\Veeam\"", "vssadmin delete shadows /all /quiet", "bcdedit /set recoveryenabled no", "whoami /priv", "net user helpdesk1 /add", "7z archive of D:\\Finance"], "answers": [0, 1, 2]}, {"id": "H12", "type": "fill", "summary": "Map a Linux file-read to component, channel, analytic", "scenario": [{"label": "ARTEFACT 1 — auditd event", "kind": "mono", "lines": ["auditd:PATH  open,read  /opt/veeam/config.ini", "user=www-data  ppid=python3  (script /tmp/x.sh)", "host=WEB-03"]}], "question": "Fill the three blanks to route the event.", "hint": "PATH records file access; SYSCALL records execve. Then pick the channel and the analytic.", "explain": "<p>A file read arrives through <strong>File Access (DC0055)</strong> on channel <strong>auditd:PATH</strong>, and belongs to <strong>AN0241</strong>, the Linux analytic. Choosing auditd:SYSCALL would be the execution-telemetry near-miss; AN0240 would be the vendor-name near-miss; AN0242 is macOS-only.</p>", "template": "This file read arrives via the {0} data component on channel {1}, and belongs to analytic {2}.", "blanks": ["File Access (DC0055)", "auditd:PATH", "AN0241"], "bank": ["File Access (DC0055)", "Process Creation (DC0032)", "auditd:PATH", "auditd:SYSCALL", "AN0240", "AN0241", "AN0242"]}, {"id": "H13", "type": "decision", "summary": "Intern workstation runs an Acronis query", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-5603", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "User: CORP\\intern.mlee  Host: INT-07", "ParentImage: C:\\Windows\\System32\\wscript.exe", "CommandLine: wscript.exe \\\\ITFS\\onboarding\\check_software.vbs  (queries HKLM\\SOFTWARE\\Acronis)"]}, {"label": "ARTEFACT 2 — Context", "kind": "prose", "text": "intern.mlee started on Monday. The IT onboarding runbook includes check_software.vbs, which inventories installed software from the IT file share. No other signals on the host."}], "question": "Work the two steps, then press Check.", "hint": "Read the parent and the runbook — then pick the least aggressive verified step.", "explain": "<p><strong>Step 1:</strong> the lineage (wscript running a known IT onboarding script from the IT share) explains the Acronis query &mdash; likely benign, but verify rather than assume. <strong>Step 2:</strong> the least aggressive verified action is contacting IT to confirm the script and noting the allow-list entry. Reimaging a laptop or declaring a confirmed intrusion on this evidence would be disproportionate; \"any vendor query is an attack\" ignores context.</p>", "steps": [{"q": "Is this likely adversary backup discovery?", "opts": ["Yes — any vendor query is an attack", "Likely no — IT onboarding lineage explains it; verify with IT", "It can never be decided"], "ans": 1, "why": "Benign lineage plus a runbook match outweighs the raw behaviour; verification is still required."}, {"q": "What is the right action?", "opts": ["Reimage INT-07 and re-onboard the intern", "Escalate to the CISO as a confirmed intrusion", "Contact IT to confirm the script and record a tuning note"], "ans": 2, "why": "Least aggressive verified action: confirm the script, document the exception, keep monitoring."}]}, {"id": "H14", "type": "linepick", "summary": "Click the two lineage lines AN0240 flags", "scenario": [{"label": "ARTEFACT 1 — Six 4688 parent-child pairs (one estate, one day)", "kind": "mono", "lines": []}], "question": "Click the TWO lines whose parent-child lineage SuspiciousParentProcesses would flag for backup discovery.", "hint": "Scripting hosts and Office apps spawning shells — not the backup product doing its job, and not normal system pairs.", "explain": "<p>The two flagged lines: <strong>winword.exe spawning cmd.exe with tasklist filtered to veeam</strong> (Office-to-shell, vendor keyword) and <strong>wscript.exe spawning reg query for Acronis</strong> (script host, vendor registry query). explorer to notepad and services to svchost are normal pairs, and the backup product’s own robocopy job is the software doing its job &mdash; none of the three is discovery.</p>", "lines": [{"t": "explorer.exe -> notepad.exe C:\\Users\\me\\notes.txt", "c": false}, {"t": "winword.exe -> cmd.exe /c tasklist | findstr /i veeam", "c": true}, {"t": "services.exe -> svchost.exe -k netsvcs", "c": false}, {"t": "backupexec.exe -> robocopy job BK-2025 (backup product)", "c": false}, {"t": "wscript.exe -> cmd.exe /c reg query \"HKLM\\SOFTWARE\\Acronis\"", "c": true}], "pick": 2}, {"id": "H15", "type": "qcm", "summary": "The tempting wrong label", "scenario": [{"label": "ARTEFACT 1 — Ticket comment", "kind": "prose", "text": "A colleague closed an alert: \"reg query against Veeam keys — labelled T1518.001 Security Software Discovery.\" Your lead asks whether the label is right."}], "question": "Which nearby technique is the most tempting WRONG label for a backup-product query, and why is it wrong?", "hint": "Backup software is not exactly \"security software\" in ATT&CK’s split — it has its own sub-technique.", "explain": "<p><strong>T1518.001 Security Software Discovery</strong> covers AV, EDR, and firewall tooling &mdash; not backup products. Backup software has its own sub-technique, <strong>T1518.002</strong>, which is what DET0088 detects. T1007 (System Service Discovery) and T1012 (Query Registry) describe fragments of the behaviour, and T1087 is account discovery — defensible-looking, but the vendor-specific purpose makes T1518.002 the correct label.</p>", "options": ["T1518.001 Security Software Discovery — it covers AV/EDR, not backup products", "T1007 System Service Discovery — services are never part of backup discovery", "T1012 Query Registry — registry queries are always T1012, never T1518.002", "T1087 Account Discovery — backup products store accounts"], "answer": 0}]}</script>

    '<span class="chip">&#129513; Exercises in this file: '+EXAM.exercises.length+'</span>'+
    '<span class="chip">&#9201; Estimated time: '+m.estimatedMinutes+' min</span>'+
    '<span class="chip">&#9203; Timer budget: '+fmtTime(EXAM.timerSeconds)+'</span>'+
    '<span class="chip">&#127937; Pass mark: '+EXAM.passMark+'%</span>';
  $('introLearn').innerHTML = EXAM.intro.learn;
  var kw = $('introKeywords'); kw.innerHTML='';
  EXAM.intro.keywords.forEach(function(g){
    var d = el('div','kw-group');
    d.appendChild(el('h3',null,esc(g.group)));
    var w = el('div','kw-items');
    g.items.forEach(function(it){ w.appendChild(el('span','kw',esc(it))); });
    d.appendChild(w);
    kw.appendChild(d);
  });
  $('introHow').innerHTML = EXAM.intro.how;
}
function show(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){
    $(s).hidden = (s!==id);
  });
  window.scrollTo(0,0);
}

/* ---------------- state ---------------- */
function freshState(){
  return {
    order: shuffle(EXAM.exercises),
    idx: 0,
    credits: {},
    answered: {},
    skipped: [],
    hintUsed: {},
    widget: null,
    timer: {state:'RUNNING', left: EXAM.timerSeconds, total: EXAM.timerSeconds},
    pausedFrom: null,
    phase: 'exam',
    pauseManualSec: 0,
    pauseFeedbackSec: 0,
    reported: false
  };
}
function startExam(){
  S = freshState();
  $('hintBtn').disabled = false;
  show('scr-exam');
  renderExercise();
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- timer ---------------- */
function setTimerState(st){
  if(!S){return;}
  if(S.timer.state==='ENDED' && st!=='ENDED'){return;}
  S.timer.state = st;
  renderTimer();
}
function renderTimer(){
  if(!S){return;}
  var chip = $('timerChip');
  var t = S.timer;
  var cls='t-run', txt='';
  if(t.state==='RUNNING'){cls='t-run'; txt='&#9201; RUNNING &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_MANUAL'){cls='t-pause'; txt='&#9208; PAUSED &mdash; manual (press Resume) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_AUTO_CHECK'){cls='t-pause'; txt='&#9208; PAUSED &mdash; reviewing feedback (resumes on Next) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else {cls='t-end'; txt='&#9209; ENDED &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  chip.className='chip '+cls;
  chip.innerHTML = txt;
  chip.setAttribute('aria-label','Timer state: '+t.state);
  $('pauseBtn').disabled = !(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK');
}
function tick(){
  if(!S || (S.phase!=='exam' && S.phase!=='review')){return;}
  if(S.timer.state==='RUNNING'){
    S.timer.left--;
    if(S.timer.left<=0){ S.timer.left=0; renderTimer(); forceFinish(); return; }
  } else if(S.timer.state==='PAUSED_MANUAL'){ S.pauseManualSec++; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ S.pauseFeedbackSec++; }
  renderTimer();
}
function forceFinish(){
  setTimerState('ENDED');
  showResults();
}

/* ---------------- header widgets ---------------- */
function updateScore(){
  var a = answeredCount(), s = creditSum();
  var pct = a>0 ? Math.round(s/a*100) : 0;
  $('scoreChip').innerHTML = '&#127942; Score <strong class="mono">'+fmt1(s)+'</strong> / '+a+' <span class="muted">('+pct+'%)</span>';
}
function updateProgress(){
  var p = Math.round(answeredCount()/EXAM.exercises.length*100);
  $('progressFill').style.width = p+'%';
  $('progressFill').setAttribute('aria-valuenow', p);
}
function updateCheckState(){
  if(!S || !S.widget){return;}
  /* disabled only when the widget defines ready() and it returns false */
  $('checkBtn').disabled = !!(S.widget.ready && !S.widget.ready());
}

/* ---------------- exercise rendering ---------------- */
function nextUnanswered(from){
  var n = S.order.length;
  for(var k=1;k<=n;k++){
    var i = (from+k)%n;
    var id = idOf(i);
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ return i; }
  }
  return -1;
}
function renderExercise(){
  var ex = cur();
  S.phase='exam';
  $('exCounter').textContent = 'Exercise '+(S.idx+1)+' of '+S.order.length;
  var sev = $('sevBadge');
  sev.className = 'chip '+SEVCLASS[EXAM.sev];
  sev.textContent = EXAM.sev;
  sev.setAttribute('aria-label','Severity '+EXAM.sev);
  $('scenSummary').textContent = ex.summary;
  var body = $('scenBody'); body.innerHTML='';
  ex.scenario.forEach(function(b){
    var wrap = el('div','artefact');
    wrap.appendChild(el('div','artefact-label',esc(b.label)));
    if(b.kind==='mono'){
      var pre = el('pre','mono'); pre.textContent = b.lines.join('\n');
      wrap.appendChild(pre);
    } else {
      var pr = el('div','prose'); pr.innerHTML = b.text;
      wrap.appendChild(pr);
    }
    body.appendChild(wrap);
  });
  $('scenBody').hidden=false;
  $('scenHead').setAttribute('aria-expanded','true');
  $('scenToggleHint').innerHTML='&#9660; collapse';
  $('qText').innerHTML = ex.question;
  Array.prototype.forEach.call(document.querySelectorAll('.hintbox'), function(x){ if(x.parentNode){x.parentNode.removeChild(x);} });
  var aa = $('answerArea'); aa.innerHTML='';
  S.widget = WIDGETS[ex.type](ex, aa, updateCheckState);
  $('feedbackBlock').hidden = true; $('feedbackBlock').innerHTML='';
  $('checkBtn').hidden = false;
  updateCheckState();
  $('nextBtn').hidden = true; $('finishBtn').hidden = true;
  $('hintBtn').disabled = !!S.hintUsed[ex.id];
  $('skipBtn').disabled = !!S.answered[ex.id];
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- feedback ---------------- */
var ROWMETA = {
  ok:{ic:'&#10003;',st:'Correct'},
  bad:{ic:'&#10007;',st:'Wrong'},
  miss:{ic:'&#9675;',st:'Missed'}
};
function renderFeedback(ex, g, credit){
  var fb = $('feedbackBlock');
  fb.hidden = false;
  var head, cls;
  if(credit>=1){head='&#10003; CORRECT'; cls='ok';}
  else if(credit>0){head='&#10003; PARTIALLY CORRECT &mdash; credit '+credit.toFixed(2); cls='part';}
  else {head='&#10007; INCORRECT'; cls='bad';}
  var h = '<div class="fb-head '+cls+'">'+head+'</div>';
  if(g.N>1){
    h += '<div class="muted">credit '+credit.toFixed(2)+' &mdash; '+g.H+'/'+g.N+' correct items, formula (H &minus; W) / N = ('+g.H+' &minus; '+g.W+') / '+g.N+'</div>';
  }
  if(ex.type==='qcm' && credit<1){
    h += '<div class="fb-row ok"><span class="ic">&#10003;</span><span class="st">Correct</span><span>Answer: <strong>'+esc(ex.options[ex.answer])+'</strong></span></div>';
  }
  if(g.rows && g.rows.length){
    h += '<div class="fb-rows">';
    g.rows.forEach(function(r){
      var m = ROWMETA[r.state];
      h += '<div class="fb-row '+r.state+'"><span class="ic">'+m.ic+'</span><span class="st">'+m.st+'</span><span>'+r.label+(r.note?' &mdash; <span class="muted">'+esc(r.note)+'</span>':'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose" style="margin-top:8px">'+ex.explain+'</div>';
  if(S.hintUsed[ex.id]){
    h += '<div class="hintbox"><span class="hw">&#128161; Hint was used:</span> &minus;10% was applied to this exercise\u2019s credit.</div>';
  }
  var study = ex.study || 'Re-read the explanation above and the matching part of the intro section \u201cWhat you will learn here\u201d, then try the exercise again on a retake.';
  h += '<div class="prose muted" style="margin-top:6px"><strong>What to study:</strong> '+study+'</div>';
  fb.innerHTML = h;
  fb.className = 'feedback f-'+(cls==='ok'?'ok':(cls==='part'?'part':'bad'));
}

/* ---------------- check / next / skip / hint / pause ---------------- */
function onCheck(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit-0.10); credit = Math.round(credit*100)/100; }
  S.credits[ex.id] = credit;
  S.answered[ex.id] = true;
  var si = S.skipped.indexOf(ex.id);
  if(si>=0){ S.skipped.splice(si,1); }
  S.widget.lock();
  setTimerState('PAUSED_AUTO_CHECK');
  renderFeedback(ex, g, credit);
  $('checkBtn').hidden = true;
  var last = nextUnanswered(S.idx)===-1;
  $('nextBtn').hidden = false;
  $('finishBtn').hidden = !last;
  $('skipBtn').disabled = true;
  updateScore(); updateProgress();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  if(S._fromReview && S.answered[idOf(S.idx)]){ S._fromReview=false; showReview(); return; }
  S.idx = n; S._fromReview=false;
  renderExercise();
}
function onSkip(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){ S.skipped.push(ex.id); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  S.idx = n;
  renderExercise();
}
function onHint(){
  var ex = cur();
  if(S.hintUsed[ex.id] || S.answered[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var old = document.querySelectorAll('.hintbox.live');
  Array.prototype.forEach.call(old,function(x){x.parentNode.removeChild(x);});
  var box = el('div','hintbox live');
  box.innerHTML = '<span class="hw">&#128161; HINT (&minus;10% of this exercise\u2019s credit):</span> '+esc(ex.hint);
  $('answerArea').parentNode.insertBefore(box, $('answerArea'));
  $('hintBtn').disabled = true;
}
function onPause(){
  if(!S || S.phase!=='exam'){return;}
  if(S.timer.state==='RUNNING' || S.timer.state==='PAUSED_AUTO_CHECK'){
    S.pausedFrom = S.timer.state;
    setTimerState('PAUSED_MANUAL');
    $('pausedOverlay').hidden=false;
  }
}
function onResume(){
  setTimerState(S.pausedFrom || 'RUNNING');
  S.pausedFrom=null;
  $('pausedOverlay').hidden=true;
}

/* ---------------- finish / review / results ---------------- */
function finishAttempt(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  if(S.skipped.length>0){ showReview(); } else { showResults(); }
}
function showReview(){
  S.phase='review';
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  show('scr-review');
  $('reviewIntro').innerHTML = 'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it while the timer is still running. If you submit now, skipped exercises are <strong>excluded</strong> from the score (they count neither as correct nor as wrong).';
  var list = $('reviewList'); list.innerHTML='';
  S.skipped.forEach(function(id,i){
    var ex = null;
    S.order.forEach(function(o){ if(o.id===id){ex=o;} });
    var row = el('div','review-row');
    row.innerHTML = '<span><span class="warnword">&#9888; Skipped</span> &mdash; '+esc(ex.summary)+'</span>';
    var b = el('button','btn small primary','Answer &#9654;');
    b.addEventListener('click', function(){
      S._fromReview=true;
      for(var k=0;k<S.order.length;k++){ if(S.order[k].id===id){ S.idx=k; break; } }
      show('scr-exam');
      renderExercise();
    });
    row.appendChild(b);
    list.appendChild(row);
  });
}
function showResults(){
  S.phase='results';
  setTimerState('ENDED');
  show('scr-results');
  var ids = Object.keys(S.credits);
  var answered = ids.length;
  var sum=0, full=0, part=0, zero=0, partSum=0;
  ids.forEach(function(id){var c=S.credits[id]; sum+=c; if(c>=1){full++;} else if(c>0){part++; partSum+=c;} else {zero++;}});
  var skippedNever = EXAM.exercises.length - answered;
  var pct = answered>0 ? Math.round(sum/answered*100) : 0;
  var passed = pct >= EXAM.passMark;
  var vp = $('verdictPanel');
  if(passed){
    vp.className='card verdict-pass';
    vp.innerHTML = '<div class="bigword">&#10003; PASS</div><p>You reached <strong>'+pct+'%</strong> (pass mark '+EXAM.passMark+'%). Well done &mdash; you demonstrated working knowledge of '+esc(EXAM.meta.objectId)+' &mdash; '+esc(EXAM.meta.objectName)+' at '+esc(EXAM.sev)+' level.</p>';
  } else {
    vp.className='card verdict-fail';
    vp.innerHTML = '<div class="bigword">&#10007; FAIL</div><p>You reached <strong>'+pct+'%</strong>, below the '+EXAM.passMark+'% pass mark. You must retake this exam. Review the explanations, then press Retake.</p>';
  }
  var avgPart = part>0 ? (partSum/part) : 0;
  $('resultsBreakdown').innerHTML =
    '<h2>Score breakdown</h2>'+
    '<div class="res-line ok"><span>&#10003; Fully correct</span><span class="st">'+full+'</span></div>'+
    '<div class="res-line part"><span>&#10003; Partially correct</span><span class="st">'+part+(part>0?' <span class="muted">(avg '+avgPart.toFixed(2)+')</span>':'')+'</span></div>'+
    '<div class="res-line bad"><span>&#10007; Fully incorrect</span><span class="st">'+zero+'</span></div>'+
    '<div class="res-line skip"><span>&#9888; Skipped or unanswered &mdash; excluded</span><span class="st">'+skippedNever+'</span></div>'+
    '<div class="res-line"><span><strong>Total score</strong></span><span class="st"><strong class="mono">'+fmt1(sum)+' / '+answered+'</strong> &mdash; <strong>'+pct+'%</strong></span></div>';
  $('resultsMeta').innerHTML =
    '<h2>How your time was spent</h2>'+
    '<div class="res-line"><span>Time paused manually (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseManualSec)+'</span></div>'+
    '<div class="res-line"><span>Time paused for feedback review (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseFeedbackSec)+'</span></div>'+
    '<div class="res-line"><span>Time left on the clock</span><span class="st mono">'+fmtTime(S.timer.left)+'</span></div>';
  reportScore(sum, answered, pct, passed);
}
function reportScore(creditSum, answeredCount, pct, passed){
  if(S.reported){return;}
  S.reported = true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.meta.topicId,
      batch: EXAM.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: pct,
      passed: passed
    }, location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}

/* ---------------- interactive widgets ---------------- */
var WIDGETS = {};

WIDGETS.qcm = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = -1;
  var wrap = el('div');
  perm.forEach(function(oi, pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} sel = oi; refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = (parseInt(b.dataset.oi,10) === sel);
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return sel>=0; },
    grade:function(){ return {H:(sel===ex.answer?1:0), W:0, N:1, rows:[]}; },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        b.disabled=true;
        var oi=parseInt(b.dataset.oi,10);
        if(oi===ex.answer){b.classList.add('ok');}
        if(oi===sel && sel!==ex.answer){b.classList.add('bad');}
      });
    }
  };
};

WIDGETS.multi = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = {};
  var wrap = el('div');
  perm.forEach(function(oi,pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} if(sel[oi]){delete sel[oi];} else {sel[oi]=true;} refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = !!sel[parseInt(b.dataset.oi,10)];
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length>0; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.options.forEach(function(o,i){
        var picked = !!sel[i], correct = ex.answers.indexOf(i)>=0;
        if(correct && picked){ H++; rows.push({state:'ok', label:o}); }
        else if(correct && !picked){ rows.push({state:'miss', label:o}); }
        else if(!correct && picked){ W++; rows.push({state:'bad', label:o}); }
      });
      return {H:H, W:W, N:ex.answers.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        var oi=parseInt(b.dataset.oi,10);
        if(ex.answers.indexOf(oi)>=0){ b.classList.add('ok'); b.classList.remove('sel'); }
        else if(sel[oi]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.match = function(ex, area, onChange){
  var rights = shuffle(ex.pairs.map(function(p){return p[1];}));
  var chosen = {};
  var wrap = el('div');
  ex.pairs.forEach(function(p,i){
    var row = el('div','pairrow');
    var left = el('div','left', esc(p[0]));
    var s = el('select','ans');
    var opt0 = el('option',null,'&mdash; match &mdash;'); opt0.value='';
    s.appendChild(opt0);
    rights.forEach(function(r){ var o=el('option',null,esc(r)); o.value=r; s.appendChild(o); });
    s.addEventListener('change', function(){ if(s.disabled){return;} chosen[i]=s.value; if(onChange){onChange();} });
    row.appendChild(left); row.appendChild(s);
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.pairs.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.pairs.forEach(function(p,i){
        var got = chosen[i];
        if(got && got===p[1]){ H++; rows.push({state:'ok', label:p[0]+' &rarr; '+esc(p[1])}); }
        else if(got){ W++; rows.push({state:'bad', label:p[0]+' &rarr; '+esc(got), note:'correct: '+p[1]}); }
        else { rows.push({state:'miss', label:p[0], note:'no match chosen; correct: '+p[1]}); }
      });
      return {H:H, W:W, N:ex.pairs.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s,i){
        s.disabled=true;
        if(s.value===ex.pairs[i][1]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.dnd = function(ex, area, onChange){
  var itemPerm = shuffle(ex.items.map(function(it,i){return i;}));
  var placed = {};   /* itemIndex -> slotId */
  var selItem = -1;
  var wrap = el('div');
  var pool = el('div','pool');
  var slotsBox = el('div');
  var slotEls = {};
  ex.slots.forEach(function(sl){
    var s = el('div','slot');
    s.dataset.slot = sl.id;
    s.setAttribute('role','button');
    s.tabIndex = 0;
    s.appendChild(el('span','slot-label', esc(sl.label)));
    var holder = el('div','slot-holder');
    s.appendChild(holder);
    slotEls[sl.id] = s;
    function placeIfSel(){
      if(selItem>=0 && placed[selItem]===undefined){
        placed[selItem]=sl.id; selItem=-1; render();
      }
    }
    s.addEventListener('click', placeIfSel);
    s.addEventListener('keypress', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); placeIfSel(); } });
    s.addEventListener('dragover', function(ev){ ev.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('over'); });
    s.addEventListener('drop', function(ev){ ev.preventDefault(); s.classList.remove('over'); placeIfSel(); });
    slotsBox.appendChild(s);
  });
  function render(){
    pool.innerHTML='';
    itemPerm.forEach(function(i){
      if(placed[i]!==undefined){return;}
      var c = el('button','itemchip', esc(ex.items[i].label));
      c.type='button';
      c.draggable = true;
      if(selItem===i){c.classList.add('sel');}
      c.addEventListener('click', function(){ selItem = (selItem===i?-1:i); render(); });
      c.addEventListener('dragstart', function(ev){ selItem=i; c.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain', String(i));}catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
      pool.appendChild(c);
    });
    ex.slots.forEach(function(sl){
      var holder = slotEls[sl.id].querySelector('.slot-holder');
      holder.innerHTML='';
      itemPerm.forEach(function(i){
        if(placed[i]!==sl.id){return;}
        var p = el('button','placed', esc(ex.items[i].label)+' <span aria-hidden="true">&times;</span>');
        p.type='button';
        p.title='Click to remove back to the bank';
        p.addEventListener('click', function(ev){ ev.stopPropagation(); delete placed[i]; render(); });
        holder.appendChild(p);
      });
    });
    if(onChange){onChange();}
  }
  render();
  wrap.appendChild(pool); wrap.appendChild(slotsBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.items.length;k++){ if(placed[k]===undefined){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.items.forEach(function(it,i){
        var at = placed[i];
        if(at && at===it.slot){ H++; rows.push({state:'ok', label:it.label+' &rarr; '+esc(slotName(it.slot))}); }
        else if(at){ W++; rows.push({state:'bad', label:it.label, note:'placed in '+slotName(at)+'; correct: '+slotName(it.slot)}); }
        else { rows.push({state:'miss', label:it.label, note:'not placed; correct: '+slotName(it.slot)}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
    }
  };
  function slotName(id){
    var n = id;
    ex.slots.forEach(function(s){ if(s.id===id){n=s.label;} });
    return String(n);
  }
};

WIDGETS.order = function(ex, area){
  var isRank = !!ex.rankLabel;
  var ord = shuffle(ex.items.map(function(o,i){return i;}));
  var wrap = el('div');
  var list = el('ul','orderlist');
  function render(){
    list.innerHTML='';
    ord.forEach(function(ii,pos){
      var li = el('li','orderrow');
      li.draggable = true;
      li.dataset.pos = String(pos);
      li.appendChild(el('span','pos', isRank ? ('#'+(pos+1)) : String(pos+1)+'.' ));
      li.appendChild(el('span','txt', esc(ex.items[ii])));
      var mv = el('span','mvbtns');
      var up = el('button',null,'&uarr;'); up.type='button'; up.title='Move up';
      up.addEventListener('click', function(){ if(up.disabled){return;} if(pos>0){var t=ord[pos-1];ord[pos-1]=ord[pos];ord[pos]=t;render();} });
      var dn = el('button',null,'&darr;'); dn.type='button'; dn.title='Move down';
      dn.addEventListener('click', function(){ if(dn.disabled){return;} if(pos<ord.length-1){var t=ord[pos+1];ord[pos+1]=ord[pos];ord[pos]=t;render();} });
      mv.appendChild(up); mv.appendChild(dn);
      li.appendChild(mv);
      li.addEventListener('dragstart', function(ev){ DRAGPOS = pos; try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} });
      li.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      li.addEventListener('drop', function(ev){ ev.preventDefault(); if(DRAGPOS<0||DRAGPOS===pos){return;} var m=ord.splice(DRAGPOS,1)[0]; ord.splice(pos,0,m); DRAGPOS=-1; render(); });
      list.appendChild(li);
    });
  }
  var DRAGPOS = -1;
  render();
  if(isRank){ area.appendChild(el('p','muted', esc(ex.rankLabel))); }
  wrap.appendChild(list);
  area.appendChild(wrap);
  return {
    grade:function(){
      var H=0,W=0,rows=[];
      ord.forEach(function(ii,pos){
        if(ii===ex.correct[pos]){ H++; rows.push({state:'ok', label:'Position '+(pos+1)+': '+esc(ex.items[ii])}); }
        else { W++; rows.push({state:'bad', label:'Position '+(pos+1)+': '+esc(ex.items[ii]), note:'correct here: '+esc(ex.items[ex.correct[pos]])}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.orderrow'), function(li){ li.draggable=false; });
    }
  };
};

WIDGETS.fill = function(ex, area, onChange){
  var bank = shuffle(ex.bank.slice());
  var chosen = {};
  var wrap = el('div','prose');
  var parts = ex.template.split(/\{(\d+)\}/g);
  var line = el('div');
  for(var k=0;k<parts.length;k++){
    if(k%2===0){ line.appendChild(document.createTextNode(parts[k])); }
    else {
      (function(){
        var bi = parseInt(parts[k],10);
        var s = el('select','ans');
        var o0 = el('option',null,'&mdash; choose &mdash;'); o0.value='';
        s.appendChild(o0);
        bank.forEach(function(w){ var o=el('option',null,esc(w)); o.value=w; s.appendChild(o); });
        s.addEventListener('change', function(){ if(s.disabled){return;} chosen[bi]=s.value; if(onChange){onChange();} });
        s.dataset.blank = String(bi);
        line.appendChild(s);
      })();
    }
  }
  wrap.appendChild(line);
  var bw = el('div','kw-items'); 
  bw.appendChild(el('span','kw','Word bank:'));
  bank.forEach(function(w){ bw.appendChild(el('span','kw',esc(w))); });
  area.appendChild(wrap); area.appendChild(bw);
  return {
    ready:function(){
      for(var k=0;k<ex.blanks.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.blanks.forEach(function(b,i){
        var got = chosen[i];
        if(got && got===b){ H++; rows.push({state:'ok', label:'Blank '+(i+1)+': '+esc(b)}); }
        else if(got){ W++; rows.push({state:'bad', label:'Blank '+(i+1)+': '+esc(got), note:'correct: '+b}); }
        else { rows.push({state:'miss', label:'Blank '+(i+1)+': no answer', note:'correct: '+b}); }
      });
      return {H:H, W:W, N:ex.blanks.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s){
        s.disabled=true;
        var bi=parseInt(s.dataset.blank,10);
        if(s.value===ex.blanks[bi]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.linepick = function(ex, area, onChange){
  var pickN = ex.pick || 1;
  var sel = {};
  var wrap = el('div');
  ex.lines.forEach(function(L,i){
    var b = el('button','linepick');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.textContent = L.t;
    b.addEventListener('click', function(){
      if(b.disabled){return;}
      if(sel[i]){ delete sel[i]; }
      else {
        if(pickN===1){ sel={}; }
        else {
          var cnt = Object.keys(sel).length;
          if(cnt>=pickN){ return; }
        }
        sel[i]=true;
      }
      refresh();
    });
    b.dataset.li=String(i);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
      var on = !!sel[parseInt(b.dataset.li,10)];
      b.classList.toggle('sel',on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
    if(onChange){onChange();}
  }
  if(pickN>1){ area.appendChild(el('p','muted','Select exactly '+pickN+' lines, then press Check.')); }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length===pickN; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.lines.forEach(function(L,i){
        var c=!!L.c, p=!!sel[i];
        if(c && p){ H++; rows.push({state:'ok', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(c && !p){ rows.push({state:'miss', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(!c && p){ W++; rows.push({state:'bad', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
      });
      return {H:H, W:W, N:ex.lines.filter(function(L){return !!L.c;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
        var i=parseInt(b.dataset.li,10);
        if(ex.lines[i].c){ b.classList.add('ok'); }
        else if(sel[i]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.triage = function(ex, area, onChange){
  var chosen = {};
  var wrap = el('div');
  var tools = el('div','logtools');
  var inp = el('input');
  inp.type='text'; inp.placeholder='Filter log lines (case-insensitive substring)';
  inp.setAttribute('aria-label','Filter log lines');
  tools.appendChild(inp);
  var logBox = el('div');
  var rowEls = [];
  ex.log.forEach(function(L,i){
    var row = el('div','artefact');
    var pre = el('pre','mono'); pre.textContent = L.t;
    row.appendChild(pre);
    if(L.flag){
      var v = el('div','verdicts');
      ex.verdictOptions.forEach(function(vo,vi){
        var vb = el('button',null, esc(vo));
        vb.type='button';
        vb.setAttribute('aria-pressed','false');
        vb.addEventListener('click', function(){
          if(vb.disabled){return;}
          chosen[i]=vi; 
          Array.prototype.forEach.call(v.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
          vb.setAttribute('aria-pressed','true');
          if(onChange){onChange();}
        });
        vb.dataset.vi=String(vi);
        v.appendChild(vb);
      });
      row.appendChild(v);
    }
    rowEls.push({row:row, text:L.t});
    logBox.appendChild(row);
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rowEls.forEach(function(r){ r.row.style.display = (r.text.toLowerCase().indexOf(q)>=0)?'':'none'; });
  });
  wrap.appendChild(tools); wrap.appendChild(logBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      var ok=true;
      ex.log.forEach(function(L,i){ if(L.flag && chosen[i]===undefined){ ok=false; } });
      return ok;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.log.forEach(function(L,i){
        if(!L.flag){return;}
        var got = chosen[i];
        var correctTxt = ex.verdictOptions[L.correct];
        if(got!==undefined && got===L.correct){ H++; rows.push({state:'ok', label:short(L.t), note:ex.verdictOptions[got]}); }
        else if(got!==undefined){ W++; rows.push({state:'bad', label:short(L.t), note:'you chose: '+ex.verdictOptions[got]+'; correct: '+correctTxt}); }
        else { rows.push({state:'miss', label:short(L.t), note:'no verdict; correct: '+correctTxt}); }
      });
      return {H:H, W:W, N:ex.log.filter(function(L){return L.flag;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){
        var v = b.parentNode;
        var rowB = v.parentNode;
        var idx = rowEls.map(function(r){return r.row;}).indexOf(rowB);
        if(idx>=0 && chosen[idx]!==undefined && parseInt(b.dataset.vi,10)===chosen[idx]){
          if(chosen[idx]===ex.log[idx].correct){ b.style.borderColor='var(--state-correct)'; }
          else { b.style.borderColor='var(--state-incorrect)'; }
        }
      });
      inp.disabled=true;
    }
  };
  function short(t){ return esc(t.length>60?t.slice(0,60)+'\u2026':t); }
};

WIDGETS.decision = function(ex, area, onChange){
  var choices = [];
  var curStep = 0;
  var wrap = el('div');
  function renderStep(){
    var step = ex.steps[curStep];
    var box = el('div');
    box.appendChild(el('span','stepbadge','STEP '+(curStep+1)+' OF '+ex.steps.length));
    box.appendChild(el('p','prose', esc(step.q)));
    var perm = shuffle(step.opts.map(function(o,i){return i;}));
    var sel = -1;
    var confirmBtn = el('button','btn small primary','Confirm step &#9654;');
    confirmBtn.type='button';
    confirmBtn.disabled = true;
    perm.forEach(function(oi,pos){
      var b = el('button','opt');
      b.type='button';
      b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(step.opts[oi])+'</span>';
      b.addEventListener('click', function(){
        if(b.disabled){return;}
        sel=oi;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        confirmBtn.disabled=false;
      });
      box.appendChild(b);
    });
    box.appendChild(confirmBtn);
    confirmBtn.addEventListener('click', function(){
      if(confirmBtn.disabled){return;}
      choices[curStep]=sel;
      disableAll(box);
      confirmBtn.disabled=true;
      curStep++;
      if(curStep>=ex.steps.length){
        if(onChange){onChange();}
      } else { renderStep(); }
    });
    wrap.appendChild(box);
  }
  renderStep();
  area.appendChild(wrap);
  return {
    ready:function(){ return curStep>=ex.steps.length; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.steps.forEach(function(st,i){
        var got = choices[i];
        if(got===st.ans){ H++; rows.push({state:'ok', label:'Step '+(i+1), note:st.why}); }
        else { W++; rows.push({state:'bad', label:'Step '+(i+1), note:'correct: '+st.opts[st.ans]+'. '+st.why}); }
      });
      return {H:H, W:W, N:ex.steps.length, rows:rows};
    },
    lock:function(){ }
  };
};

function boot(){
  renderIntro();
  $('startBtn').addEventListener('click', startExam);
  $('checkBtn').addEventListener('click', onCheck);
  $('nextBtn').addEventListener('click', onNext);
  $('skipBtn').addEventListener('click', onSkip);
  $('hintBtn').addEventListener('click', onHint);
  $('pauseBtn').addEventListener('click', onPause);
  $('resumeBtn').addEventListener('click', onResume);
  $('finishBtn').addEventListener('click', finishAttempt);
  $('reviewSubmit').addEventListener('click', function(){ showResults(); });
  $('retakeBtn').addEventListener('click', function(){ startExam(); });
  $('scenHead').addEventListener('click', function(){
    var b=$('scenBody');
    b.hidden = !b.hidden;
    var open = !b.hidden;
    $('scenHead').setAttribute('aria-expanded', open?'true':'false');
    $('scenToggleHint').innerHTML = open ? '&#9660; collapse' : '&#9654; expand';
  });
  setInterval(tick, 1000);
  window.addEventListener('message', function(event){
    if(!event.data){return;}
    if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){return;}
    /* Handshake accepted: username, country, locale, topicId, batch are consumed.
       theme is always dark; this file is dark-only, so appearance does not change. */
    window.__cmHandshake = event.data;
  });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
