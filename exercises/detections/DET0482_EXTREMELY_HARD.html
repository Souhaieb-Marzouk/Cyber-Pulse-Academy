const DATA = {"meta": {"topicId": "det0482", "batch": 4, "title": "DET0482 Behavior-chain detection for T1134.001 Token Impersonation/Theft \u2014 EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 60, "timerMinutes": 60, "passMark": 70, "id": "DET0482", "severity": "EXTREMELY HARD"}, "header": {"objectName": "Behavior-chain detection for T1134.001 Access Token Manipulation: Token Impersonation/Theft on Windows"}, "intro": {"heading": "DET0482 \u2014 EXTREMELY HARD practice exam", "learn": ["This is the senior tier. <b>DET0482<\/b> correlates a behavior chain for <b>T1134.001 Token Impersonation/Theft<\/b>: a suspicious command line (runas) or in-memory API invocation \u2192 token handle duplication or thread token assignment (DuplicateTokenEx, ImpersonateLoggedOnUser, SetThreadToken) \u2192 a process assuming the impersonated user's context. You will now make the calls a <b>senior analyst, senior IR lead, or principal detection engineer<\/b> makes when signals contradict, stakes are real, and every option has a cost.", "The four mutable elements are your levers, and at this level each is a trade-off: <b>AllowedSystemProcesses<\/b> (whitelist processes \u2014 and over-whitelisting is how detections go blind), <b>UserContextFilter<\/b> (trust accounts for documented patterns \u2014 but a blanket trust is exactly what a patient adversary hopes you will grant), <b>TimeWindow<\/b> (wider catches slower chains and more noise), <b>ParentProcessAnomalyThreshold<\/b> (lineage scoring \u2014 the office-document-spawning-runas pattern this analytic was built to score).", "Real work this mirrors: briefing a CISO who needs a decision in ten minutes; choosing between isolation (downtime) and evidence preservation; discovering the token telemetry pipeline silently died and the dashboard still glows green; writing an executive brief with ATT&amp;CK IDs verbatim; arguing attribution for APT28 with an intelligence-officer's discipline \u2014 supporting evidence versus weak evidence, probability rather than proof.", "Expect: four-plus artefacts per case, at least one piece of realistic noise, at least one gap you must reason around, and correct answers that sometimes mean <i>do nothing yet<\/i> or <i>accept real cost<\/i>. Explanations stay plain-English. Take your sixty minutes \u2014 the clock stops on every Check, so use the pauses to actually think."], "keywords": [{"theme": "Senior triage under pressure", "items": ["Conflicting signals: allow-list vs lineage anomaly", "Costly containment on a domain controller", "Do-nothing-yet discipline", "Evidence preservation vs speed"]}, {"theme": "Mutable-element strategy", "items": ["Over-broad UserContextFilter as an adversary gift", "AllowedSystemProcesses vs emerging agents", "TimeWindow trade-offs", "ParentProcessAnomalyThreshold tuning"]}, {"theme": "Detection engineering at scale", "items": ["Correlation rule rewrite with policy hooks", "Pipeline health vs green dashboards", "Telemetry matrix and partial/gap bins", "Fleet-wide hunting after containment"]}, {"theme": "Attribution & CTI", "items": ["APT28 indicator weighting (CVE-2015-1701, targeting)", "Shared-API evidence is weak evidence", "Executive briefing with verbatim IDs (DET0482 / AN1324 / M1026)"]}, {"theme": "Sub-technique discrimination", "items": ["T1134.001 impersonate existing token", "T1134.002 Create Process with Token", "T1134.003 Make and Impersonate Token", "T1134.005 SID-History Injection"]}, {"theme": "Response sequencing", "items": ["Volatile evidence before reboot", "Account disable vs credential rotation", "Business-impact-ranked actions"]}], "how": ["<b>Pass mark: 70%<\/b> over answered exercises only. Skipped-and-never-answered exercises are excluded from both numerator and denominator.", "<b>Exercise types in this file:<\/b> conflict-resolution questions, costly-decision questions, an intrusion timeline with noise, coverage-matrix bins, a correlation rewrite with blanks, a four-step branching incident tree, attribution confidence bins, tuning trade-off matching, an executive-brief keyword fill, a playbook review, sub-technique discrimination slots, a pipeline-health question, and a response-sequencing rank.", "<b>Timer: 60:00.<\/b> \u25b6 RUNNING while it counts. <b>Pause<\/b> = manual break, exercise hidden. <b>Check<\/b> = the clock stops (\u23f8 PAUSED \u2014 reviewing feedback, resumes on Next) \u2014 think about the feedback as long as you need; that is the whole point of the auto-pause.", "<b>Partial credit:<\/b> (right \u2212 wrong) \u00f7 parts everywhere it applies. The hint costs 10% of the exercise's credit and only restates a constraint you may have missed \u2014 it will not rescue you.", "<b>Skipping:<\/b> free and reversible \u2014 the review pool stays open until the timer ends.", "Press Start. At this tier, read the artefacts, form your own conclusion, and only then look at the options."]}, "exercises": [{"id": "X01", "type": "qcm", "label": "Two signals contradict \u2014 which wins?", "summary": "Allow-listed account with anomalous office-app lineage \u2014 which signal wins and why?", "scenario": "Friday 21:14, host <span class=\"mono\">APP-11<\/span>. The AN1324 alert is open and two signals point in opposite directions. The account is allow-listed; the lineage is anomalous. You must state which signal wins and defend it to the IR lead in the morning.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Chain (SIEM)", "body": "<div class=\"codeblock\">21:12:40 <span class=\"n\">4688<\/span>  SubjectUserName: <span class=\"s\">CORP\\svc_sql<\/span>  CommandLine: <span class=\"s\">runas /user:CORP\\sqladmin cmd.exe<\/span>\n21:13:05 <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">DuplicateTokenEx<\/span>  caller: cmd.exe\n21:13:22 <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span> caller: cmd.exe\n<span class=\"c\">// Sysmon parent of cmd.exe: WINWORD.EXE<\/span><\/div>"}, {"label": "ARTEFACT 2 \u2014 Configuration & ticket ledger", "body": "<div class=\"codeblock\"><span class=\"k\">UserContextFilter:<\/span> CORP\\svc_sql listed \u2014 'nightly ETL maintenance impersonation'\n<span class=\"k\">ParentProcessAnomalyThreshold:<\/span> fires on office-app \u2192 runas lineages (it FIRED)\n<span class=\"k\">Ticket ledger:<\/span> nightly ETL job scheduled 23:00 \u2014 nothing at 21:12, no ticket\n<span class=\"c\">// svc_sql is a service account; it has no mail client, no Office license<\/span><\/div>"}], "question": "Which signal wins, and why?", "hint": "The allow-list speaks for the ACCOUNT's documented pattern. The lineage speaks about THIS execution. Read both artefacts again with that in mind.", "explanation": "The <b>lineage anomaly wins<\/b>. UserContextFilter grants pattern-scoped trust to svc_sql's <i>documented<\/i> behaviour (nightly ETL at 23:00 from its service host). Tonight's execution breaks the pattern on every axis: 21:12 not 23:00, an Office parent on a host where svc_sql has no Office license, an off-schedule impersonation of sqladmin. ParentProcessAnomalyThreshold exists precisely to catch the shape the filter cannot see \u2014 that is why DET0482 carries both elements. Allow-lists answer 'is this account usually like this?'; lineage answers 'is THIS event like this?' \u2014 and this event is not. The ticket ledger (empty at 21:12) seals it.", "study": "Pattern-scoped trust vs event-scoped evidence; why the analytic carries both a filter and a lineage threshold.", "options": ["Allow-list wins \u2014 any event from a filtered account is suppressible by design", "The ticket wins \u2014 approved accounts may impersonate at any hour", "Lineage anomaly wins \u2014 the filter covers the account's documented pattern, not this off-pattern execution; the threshold fired for exactly this shape", "Neither \u2014 mark informational and close; two sources disagree, so no action is possible"], "correct": 2}, {"id": "X02", "type": "qcm", "label": "Ten minutes on DC-02", "summary": "Confirmed chain on a domain controller mid-morning \u2014 accept the costly correct action.", "scenario": "11:07, Tuesday. IR confirmed a complete AN1324 chain on <b>DC-02<\/b>, a domain controller: runas \u2192 DuplicateTokenEx \u2192 ImpersonateLoggedOnUser, executed by an unknown binary from a temp path, impersonating <b>CORP\\domain-admin-2<\/b>. 40,000 users authenticate through DC-02. Isolation means real outage; the CISO needs a decision in ten minutes and asks you, the senior analyst on call.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Situation board", "body": "<div class=\"codeblock\"><span class=\"k\">Host:<\/span> DC-02 (domain controller, one of two)\n<span class=\"k\">Chain:<\/span> complete \u2014 unknown binary, temp path, impersonating a domain admin\n<span class=\"k\">Impact if isolated:<\/span> authentication fails over to DC-01; VPN and file shares degrade ~20\u201340 min\n<span class=\"k\">Attacker position:<\/span> in-memory, active NOW, holding a domain-admin identity<\/div>"}, {"label": "ARTEFACT 2 \u2014 Standing guidance", "body": "<div class=\"codeblock\"><span class=\"c\">// IR policy: on a confirmed intrusion into a tier-0 asset, containment may accept business impact.<\/span>\n<span class=\"c\">// Volatile data (memory) should be captured before any reboot, never instead of containment.<\/span><\/div>"}], "question": "What do you advise the CISO to do?", "hint": "The attacker is holding a domain-admin identity RIGHT NOW. Which options leave them holding it?", "explanation": "Advise <b>immediate isolation of DC-02 and accept the outage<\/b> \u2014 a confirmed tier-0 compromise with an in-memory adversary holding a domain-admin identity outranks 20\u201340 minutes of degraded authentication, and IR policy explicitly permits business impact here. Waiting for the maintenance window hands the adversary twelve free hours as a domain admin; rebooting 'to clean it' both destroys the volatile memory evidence and fails to remove persistence; email-and-monitor is not containment. If the failover health check allows it, capture memory during the isolation window \u2014 but containment itself is not negotiable. This is the decision the 'accept real cost' trap trains you for.", "study": "Tier-0 containment policy and volatile-evidence handling under time pressure.", "options": ["Isolate DC-02 now and accept the authentication outage; capture memory within the isolation window if failover health allows", "Wait for tonight's maintenance window to isolate outside business hours", "Reboot DC-02 immediately to clear the intrusion from memory", "Email the IT distribution list, mark the alert high, and monitor for now"], "correct": 0}, {"id": "X03", "type": "qcm", "label": "When best practice is the wrong answer", "summary": "'Add all service accounts to the filter' would whitelist the impersonated identity \u2014 choose correctly.", "scenario": "Context: after last quarter's alert flood, a senior colleague proposes the 'standard fix' \u2014 <b>add ALL service accounts to UserContextFilter<\/b>. New intelligence says the adversary you face <i>specifically<\/i> impersonates <span class=\"mono\">CORP\\svc_sql<\/span> in every observed intrusion, and rides exactly the noise-fatigue such blanket filters create.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Intel summary", "body": "<div class=\"codeblock\"><span class=\"k\">Adversary pattern:<\/span> intrusions use compromised service accounts to runas into a powerful account; noise storms follow every hit\n<span class=\"k\">Current UserContextFilter:<\/span> 6 vetted accounts with documented impersonation need\n<span class=\"k\">Proposed:<\/span> +214 accounts (all service accounts) \u2014 one line, silences the flood<\/div>"}, {"label": "ARTEFACT 2 \u2014 The catch", "body": "<div class=\"codeblock\"><span class=\"c\">// svc_sql is a service account. The proposal whitelists the exact identity the adversary impersonates.<\/span><\/div>"}], "question": "What is the correct move?", "hint": "The 'best practice' would blind the analytic to the one account pattern your intelligence says matters. What is the narrow alternative?", "explanation": "Correct: <b>vet and add only accounts with a documented impersonation need; handle residual noise case-by-case<\/b>. The blanket proposal would put <b>svc_sql<\/b> \u2014 the exact identity the adversary impersonates \u2014 inside the trust boundary, handing them a permanent blind spot, which is why the widely-used 'filter all service accounts' best practice is wrong in this specific context. Removing the filter entirely re-creates the flood with no defence, and a 1-hour TimeWindow is unrelated to account noise. Tuning is a security decision, not a convenience decision.", "study": "UserContextFilter as an attack surface; pattern-scoped trust over blanket trust.", "options": ["Follow the standard practice \u2014 add all service accounts to UserContextFilter", "Remove UserContextFilter entirely so nothing is trusted", "Vet and add only accounts with a documented impersonation need; tune residual noise case-by-case", "Set TimeWindow to 1 hour so noise spreads out and looks smaller"], "correct": 2}, {"id": "X04", "type": "order", "label": "Intrusion timeline with noise", "summary": "Order 6 real chain events; two noise lines live in the artefacts, not in the cards.", "scenario": "Case <span class=\"mono\">#9917<\/span>, host <span class=\"mono\">FIN-WS-8<\/span>. Six artefact lines below are the intrusion. Note the <b>two noise lines<\/b> in the panels (printer restart, Teams update) \u2014 they are realistic, they are real, and they are irrelevant. Order the six <b>chain events<\/b> by time.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Raw pull (contains noise)", "body": "<div class=\"codeblock\">09:11:58  <span class=\"n\">4688<\/span>  Print Spooler restarted <span class=\"c\">// NOISE \u2014 ignore<\/span>\n09:12:07  <span class=\"n\">4688<\/span>  ParentProcessName: WINWORD.EXE \u2192 NewProcessName: cmd.exe  <span class=\"c\">// lineage anomaly<\/span>\n09:12:40  <span class=\"n\">4688<\/span>  CommandLine: <span class=\"s\">runas /user:CORP\\sqladmin cmd.exe<\/span>\n09:13:05  <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">DuplicateTokenEx<\/span>  caller: cmd.exe\n09:13:22  <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span>  caller: cmd.exe\n09:14:01  <span class=\"n\">4688<\/span>  net.exe group enumeration under CORP\\sqladmin context\n09:15:30  <span class=\"n\">4688<\/span>  Teams auto-update completed <span class=\"c\">// NOISE \u2014 ignore<\/span>\n09:16:30  <span class=\"k\">AN1324 alert opens ticket #9917<\/span><\/div>"}], "question": "Order the six chain events from earliest to latest (noise lines are not in the cards).", "hint": "The chain is: document spawns shell, shell runs runas, token copied, thread impersonates, identity used, alert raised.", "explanation": "Order: (1) <b>WINWORD.EXE spawns cmd.exe<\/b> \u2014 the lineage anomaly that started everything; (2) <b>runas /user:CORP\\sqladmin<\/b> \u2014 command execution, chain link one; (3) <b>DuplicateTokenEx<\/b> \u2014 duplication; (4) <b>ImpersonateLoggedOnUser<\/b> \u2014 the thread assumes the stolen context; (5) <b>net.exe enumeration under the sqladmin context<\/b> \u2014 the attacker uses the identity; (6) <b>the alert opens ticket #9917<\/b>. The printer and Teams lines are exactly the noise a senior analyst must park without letting them break the chain \u2014 note they sit either side of the attack and neither touches the chain's processes.", "study": "Reading a raw pull end-to-end: chain first, noise parked, lineage recorded.", "order": ["09:12:07 \u2014 WINWORD.EXE spawns cmd.exe (lineage anomaly)", "09:12:40 \u2014 runas /user:CORP\\sqladmin cmd.exe (4688)", "09:13:05 \u2014 DuplicateTokenEx via ETW:Token", "09:13:22 \u2014 ImpersonateLoggedOnUser via ETW:Token", "09:14:01 \u2014 net.exe enumeration under CORP\\sqladmin context", "09:16:30 \u2014 AN1324 alert opens ticket #9917"]}, {"id": "X05", "type": "bins", "label": "Telemetry matrix: three bins", "summary": "Servers 4688-only, workstations full, DCs 4688+Sysmon \u2014 sort 5 behaviours into Detectable / Partial / Gap.", "scenario": "You are presenting the DET0482 coverage posture to the architecture board. Matrix: <b>servers<\/b> \u2014 4688 only; <b>workstations<\/b> \u2014 4688 + Sysmon + ETW:Token; <b>domain controllers<\/b> \u2014 4688 + Sysmon (ETW:Token pending a change freeze). Sort the five behaviours.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Telemetry matrix", "body": "<div class=\"codeblock\">              4688   Sysmon10   ETW:Token\nservers       [x]      [ ]        [ ]\nworkstns      [x]      [x]        [x]\ndomain ctrls  [x]      [x]        [ ] <span class=\"c\">// change freeze until next quarter<\/span><\/div>"}, {"label": "ARTEFACT 2 \u2014 Definitions for the board", "body": "<div class=\"codeblock\"><span class=\"k\">Detectable now<\/span> \u2014 the feeds that record this behaviour are deployed on that asset class\n<span class=\"k\">Partial<\/span> \u2014 some links visible, the full AN1324 chain cannot complete\n<span class=\"k\">Gap<\/span> \u2014 the recording feed is absent entirely<\/div>"}], "question": "Sort each behaviour into Detectable now / Partial / Gap.", "hint": "Judge each card on the asset class named in the card, not on the best case anywhere in the fleet.", "explanation": "<b>runas executions on servers<\/b> \u2014 Detectable now (4688 captures the command line there). <b>Token API calls on workstations<\/b> \u2014 Detectable now (ETW:Token deployed). <b>Process handle opens on DCs<\/b> \u2014 Detectable now (Sysmon is on the DCs). <b>Token API calls on servers<\/b> \u2014 Gap (no Sysmon, no ETW there; the behaviour simply produces no telemetry). <b>Full AN1324 chain on servers<\/b> \u2014 Partial: 4688 shows link one (and link four if the context switch is visible), but the duplication/impersonation middle cannot be observed, so the analytic cannot confirm. Boards fund telemetry when Partial/Gap rows have owners and dates \u2014 bring both.", "study": "Coverage posture language: Detectable / Partial / Gap, tied to the telemetry matrix.", "chips": ["runas executions on servers", "Token API calls on workstations", "Process handle opens on domain controllers", "Token API calls on servers", "Full AN1324 chain confirmation on servers"], "bins": [{"label": "Detectable now", "accept": [0, 1, 2]}, {"label": "Partial (chain cannot complete)", "accept": [4]}, {"label": "Gap (no recording feed)", "accept": [3]}]}, {"id": "X06", "type": "fillblank", "label": "Correlation rewrite with policy hooks", "summary": "Complete the rewritten rule: 4 blanks, each disambiguated by its comment.", "scenario": "The principal engineer rewrote the AN1324 correlation so every hardcoded value became a policy hook ($TimeWindow, $AllowedSystemProcesses, $UserContextFilter). Four literals remain, each marked with a comment. Fill them.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Rewritten rule", "body": "<div class=\"codeblock\">index=win_sec EventCode={{0}} CommandLine LIKE \"%{{1}}%\"\n| join host within {{2}}\n  [ search index=etw_token api_call=\"{{3}}\" ]\n| where NOT process_name IN ($AllowedSystemProcesses)\n| where NOT user IN ($UserContextFilter)\n| alert \"AN1324 chain \u2014 duplication stage\"\n\n<span class=\"c\">// {{0}}: the Windows event code for process creation<\/span>\n<span class=\"c\">// {{1}}: the suspicious execution pattern AN1324 names<\/span>\n<span class=\"c\">// {{2}}: the AN1324 example gap between chain steps<\/span>\n<span class=\"c\">// {{3}}: the duplication-stage API AN1324 lists<\/span><\/div>"}], "question": "Fill all four blanks. Each comment pins exactly one value.", "hint": "Read each comment as a definition. 'Duplication-stage' is not 'impersonation-stage'.", "explanation": "<b>4688<\/b> is the process-creation event code (1102 is log-clearing, 4624 is logon, 10 is Sysmon). <b>runas<\/b> is the execution pattern AN1324 names in its description. <b>5m<\/b> is the analytic's example TimeWindow. <b>DuplicateTokenEx<\/b> is the duplication-stage API \u2014 ImpersonateLoggedOnUser is the impersonation stage and SetThreadToken the assignment stage, so the comment rules both out. Notice the real engineering lesson: the rule trusts policy hooks, not literals, so the next whitelist change does not require touching this code.", "study": "Policy hooks vs literals; which API belongs to which chain stage.", "text": "index=win_sec EventCode={{0}} CommandLine LIKE \"%{{1}}%\" | join host within {{2}} [ search index=etw_token api_call=\"{{3}}\" ]", "blanks": ["4688", "runas", "5m", "DuplicateTokenEx"], "bank": ["4688", "runas", "5m", "DuplicateTokenEx", "1102", "10", "whoami", "60m", "ImpersonateLoggedOnUser"]}, {"id": "X07", "type": "tree", "label": "Four-step branching incident", "summary": "4-step tree: cheapest discriminator \u2192 classify \u2192 containment with cost \u2192 best detection improvement.", "scenario": "Monday 08:55. AN1324 fired on <span class=\"mono\">APP-07<\/span> (invoicing app server). Chain: cmd.exe (parent: winword.exe) \u2192 runas /user:CORP\\svc_sql cmd.exe \u2192 DuplicateTokenEx \u2192 ImpersonateLoggedOnUser. UserContextFilter lists svc_sql (nightly 23:00 ETL only). ParentProcessAnomalyThreshold fired. No ticket exists for anything at 08:55. You are the senior on call; each step below depends on the previous one.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Situation", "body": "<div class=\"codeblock\">08:55:10 <span class=\"n\">4688<\/span>  WINWORD.EXE \u2192 cmd.exe \u2192 runas /user:CORP\\svc_sql cmd.exe\n08:55:41 <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">DuplicateTokenEx<\/span>  caller: cmd.exe\n08:55:59 <span class=\"n\">ETW<\/span>   api_call=<span class=\"f\">ImpersonateLoggedOnUser<\/span> caller: cmd.exe\n<span class=\"c\">// svc_sql documented pattern: nightly ETL 23:00, service-host parent, no Office parent ever<\/span>\n<span class=\"c\">// APP-07 runs the invoicing application; finance wants zero downtime this week<\/span><\/div>"}], "question": "Answer all four steps in order and Check.", "hint": "Step 1: the cheapest artefact that separates 'ops noise' from 'intrusion' is documentation. Step 3: containment may cost something \u2014 pick the action that stops the adversary and can be defended. Step 4: the best improvement targets the pattern that fired, without whitelisting the impersonated identity.", "explanation": "<b>Step 1:<\/b> pull the change/ticket ledger for svc_sql \u2014 it is the cheapest artefact that separates maintenance noise from intrusion; router configs and desktop icons cannot. <b>Step 2:<\/b> the ledger shows nothing scheduled \u2014 with an Office parent (impossible for svc_sql's pattern) the case is an intrusion until proven otherwise; 'benign by definition' is how filters get exploited. <b>Step 3:<\/b> disable svc_sql interactive use and isolate APP-07 with finance warned of the 20-minute invoicing impact \u2014 it stops the adversary and the cost is declared; deleting token logs destroys evidence, waiting burns hours as a domain-adjacent identity is held, and subnet reimaging is disproportionate. <b>Step 4:<\/b> add the lineage rule (office-app \u2192 runas, regardless of account filters) \u2014 it targets the exact shape that fired; blanket service-account filtering re-creates the X03 trap, and TimeWindow tweaks do nothing about lineage.", "study": "Escalation discipline: cheapest discriminator first; declared-cost containment; pattern-targeted detection improvements.", "steps": [{"context": "You have five minutes before the daily stand-up. One artefact will tell you the most.", "question": "Which artefact do you pull first?", "options": ["The change/ticket ledger for svc_sql jobs around 08:55", "The router configuration for APP-07's VLAN", "The binary's file icon and version info", "This week's weather forecast (for the ops calendar)"], "correct": 0}, {"context": "The ledger shows nothing scheduled for svc_sql at 08:55, ever. The Office parent contradicts every documented pattern.", "question": "Classify the case.", "options": ["Benign maintenance \u2014 filters exist for a reason", "Duplicate ticket \u2014 someone will file it later", "Suspicious \u2014 treat as an intrusion until proven otherwise", "False positive by definition \u2014 the account is allow-listed"], "correct": 2}, {"context": "Containment time. Finance declares: invoicing downtime is tolerable IF declared and bounded.", "question": "Which containment do you order?", "options": ["Delete the ETW:Token logs to reduce the noise while you work", "Disable svc_sql interactive use and isolate APP-07, finance warned of ~20-minute impact", "Wait until the weekend to act, keep monitoring quietly", "Reimage the entire APP subnet this afternoon"], "correct": 1}, {"context": "Containment holds. The post-incident review asks for one detection improvement.", "question": "Which improvement is BEST?", "options": ["Add all service accounts to UserContextFilter so this alert class disappears", "Add a lineage rule: office-app parent spawning runas scores as anomalous regardless of account filters", "Disable the ETW:Token source on app servers", "Extend TimeWindow to 24 hours"], "correct": 1}]}, {"id": "X08", "type": "bins", "label": "Attribution: weigh the evidence", "summary": "Sort 5 evidence items into Supports APT28 / Weak-or-neutral.", "scenario": "CTI desk. A ministry intrusion shows token manipulation. An officer asks: <i>\"Is this APT28?\"<\/i> You answer like a professional: weigh each item, state confidence, never oversell. Sort the five evidence items.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Evidence pull", "body": "<div class=\"codeblock\">[1] Dropper contains a CVE-2015-1701 exploit \u2014 used by APT28 to copy the SYSTEM token\n[2] Victim: a European energy ministry \u2014 fits APT28's known strategic targeting\n[3] Implant uses ImpersonateLoggedOnUser / SetThreadToken \u2014 APIs documented across MANY actors\n[4] Commodity Emotet loader present in the same network \u2014 a criminal, unaffiliated profile\n[5] Russian-language build metadata in the dropper \u2014 trivially faked, low forensic value<\/div>"}, {"label": "ARTEFACT 2 \u2014 Analyst's rule of thumb", "body": "<div class=\"codeblock\"><span class=\"c\">// Unique TTPs and strategic targeting support attribution.<\/span>\n<span class=\"c\">// Shared tooling/API usage is weak. Commodity overlap confuses. Metadata is noise.<\/span><\/div>"}], "question": "Sort each item into Supports APT28 attribution or Weak / neutral evidence.", "hint": "Ask per item: could twelve other actors have left exactly this, word for word?", "explanation": "<b>Supports:<\/b> the <b>CVE-2015-1701<\/b> exploit chain is a documented APT28 TTP (their SYSTEM-token copy technique) and the <b>European energy ministry targeting<\/b> matches their strategic profile \u2014 uniqueness and intent, the two strong currencies of attribution. <b>Weak/neutral:<\/b> ImpersonateLoggedOnUser/SetThreadToken are shared by dozens of actors (Tarrask, FIN8's BADHATCH, Emotet \u2014 all documented on the technique page); a commodity Emotet loader actively confuses the picture (criminal ecosystems rent to anyone); build metadata is trivially faked. Professional attribution is a probability with named supporting evidence \u2014 never a vibe.", "study": "Attribution weighting: unique TTPs and targeting vs shared APIs, commodity overlap, metadata.", "chips": ["CVE-2015-1701 exploit in the dropper \u2014 documented APT28 SYSTEM-token technique", "Victim is a European energy ministry \u2014 fits APT28 strategic targeting", "Implant calls ImpersonateLoggedOnUser / SetThreadToken \u2014 APIs many actors share", "Commodity Emotet loader present \u2014 a criminal, unaffiliated profile", "Russian-language build metadata \u2014 trivially faked, low value"], "bins": [{"label": "Supports APT28 attribution", "accept": [0, 1]}, {"label": "Weak or neutral evidence", "accept": [2, 3, 4]}]}, {"id": "X09", "type": "match", "label": "Match the noise to the lever", "summary": "4 noise situations \u2192 the tuning lever each one needs.", "scenario": "Post-incident hardening week. Four noise situations surfaced; for each, name the lever (mutable element or rule change) that fixes it <i>without<\/i> weakening the analytic.", "artefacts": [{"label": "ARTEFACT 1 \u2014 The four situations", "body": "<div class=\"codeblock\">[a] A signed backup agent legitimately duplicates tokens hourly\n[b] Approved admin runas activity floods the queue nightly\n[c] Real chains where the API call and the impersonated process sit 6 minutes apart are missed (policy cap: 5m)\n[d] Office-app parents spawning runas are not being scored at all<\/div>"}], "question": "Match each situation to its correct lever.", "hint": "One lever per situation, no repeats: a process whitelist, an account filter, a wider window, a more sensitive lineage rule.", "explanation": "<b>[a]<\/b> is a known process doing a known-good token operation \u2192 <b>AllowedSystemProcesses entry<\/b>. <b>[b]<\/b> is a known account with a documented pattern \u2192 <b>UserContextFilter entry<\/b>. <b>[c]<\/b> is a genuine TimeWindow problem \u2192 <b>raise TimeWindow<\/b> (policy-approved, e.g. to 10 minutes) \u2014 wider windows cost some noise, so declare it. <b>[d]<\/b> is the lineage knob asleep \u2192 <b>lower ParentProcessAnomalyThreshold / add the lineage rule<\/b>. Matching the noise class to the lever is the difference between tuning and knob-twiddling; the wrong lever never fixes the noise and often blinds the analytic.", "study": "One noise class, one lever: process \u2192 whitelist, account \u2192 filter, gap \u2192 window, lineage \u2192 threshold.", "pairs": [["[a] Signed backup agent duplicates tokens hourly", "AllowedSystemProcesses entry for the agent"], ["[b] Approved admin runas floods the queue nightly", "UserContextFilter entry for those accounts"], ["[c] Genuine chains 6 minutes apart are missed", "Raise TimeWindow (policy-approved change)"], ["[d] Office-app parents spawning runas go unscored", "Lower ParentProcessAnomalyThreshold / add the lineage rule"]]}, {"id": "X10", "type": "qcm", "label": "Do nothing yet", "summary": "Chain complete on an intern workstation during red-team season \u2014 hold containment, verify first.", "scenario": "Wednesday 15:20. A complete AN1324 chain fired on <span class=\"mono\">WKS-77<\/span> \u2014 an intern's workstation. The intern, when asked, cheerfully admits to 'trying stuff they found online'. Same week: the authorised red-team exercise is running, and the ticket ledger is half-updated (three of five planned tests have tickets). Nobody can say whose test this was. Legal wants the device untouched until they weigh in; the CISO wants the intern 'dealt with'.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Ambiguity board", "body": "<div class=\"codeblock\"><span class=\"k\">Evidence for 'intern fooling around':<\/span> confession, no exfiltration observed, low-value host\n<span class=\"k\">Evidence for 'red-team test':<\/span> exercise week, 2 of 5 tests lack tickets, techniques match red-team style\n<span class=\"k\">Evidence against closure:<\/span> the intern cannot explain HOW they learned the technique\n<span class=\"k\">Constraints:<\/span> legal hold request pending; CISO pressure real but not binding<\/div>"}], "question": "What do you do RIGHT NOW?", "hint": "Two facts are unverified and cheap to verify. Aggressive containment has a cost; so does premature closure. What do senior analysts do with unverified-but-checkable facts?", "explanation": "Correct: <b>confirm with the red-team lead and the intern's manager, hold containment actions, keep monitoring<\/b> \u2014 the two open facts (whose test? what did the intern actually learn?) are checkable within the hour, and both outcomes change your next move. Immediate isolation and CISO paging has real cost (legal hold conflict, intern's career) for an unverified case; closing it permanently bakes an unverified assumption into the record; wiping the device destroys evidence legal explicitly wants. 'Gather the missing evidence before acting' is not indecision \u2014 it is the discipline that separates senior analysts from reactive ones.", "study": "Decision-making with checkable ambiguity: verify-first, monitor-always, escalate-on-fact.", "options": ["Immediately isolate WKS-77, page the CISO, and suspend the intern", "Close as a false positive \u2014 the intern confessed, case documented as student error", "Wipe WKS-77 now so the intern cannot continue \u2014 evidence can be re-created", "Confirm with the red-team lead and the intern's manager, hold containment, keep monitoring"], "correct": 3}, {"id": "X11", "type": "fillblank", "label": "Executive brief, verbatim IDs", "summary": "Fill 4 ATT&amp;CK IDs/API names in the exec brief \u2014 verbatim or it fails review.", "scenario": "The CISO's brief goes to the board at 16:00. The review rule: ATT&amp;CK identifiers verbatim, no paraphrase. Four blanks remain.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Brief (paragraph 2)", "body": "<div class=\"codeblock\"><span class=\"c\">// Review rule: IDs verbatim. The brief covers alert #A-2211 (APP-07, case #9917).<\/span><\/div>"}, {"label": "ARTEFACT 2 \u2014 Facts for the brief", "body": "<div class=\"codeblock\"><span class=\"k\">Behaviour:<\/span> impersonation of an EXISTING token (not creation, not new-process-with-token)\n<span class=\"k\">Detection source:<\/span> the DET0482 strategy, its analytic AN1324\n<span class=\"k\">Preventive gap found:<\/span> 'Replace a process level token' right over-granted \u2192 that mitigation family<\/div>"}], "question": "Fill the four blanks with the verbatim identifiers.", "hint": "Behaviours are T-numbers; detections are DET-numbers; analytics are AN-numbers; the privileged-account mitigation is M1026.", "explanation": "The behaviour is <b>T1134.001<\/b> (Token Impersonation/Theft \u2014 impersonating an <i>existing<\/i> token, not T1134.002's new-process behaviour). The detection that caught it is strategy <b>DET0482<\/b>, inside which the correlating analytic is <b>AN1324<\/b>. The preventive gap \u2014 an over-granted 'Replace a process level token' right \u2014 maps to <b>M1026 Privileged Account Management<\/b>, the mitigation that owns those token rights. Boards see hundreds of numbers; verbatim IDs are how a brief survives audit.", "study": "The ID system: T / DET / AN / M namespaces and what each names.", "text": "Alert #A-2211 maps to ATT&amp;CK {{0}} (Token Impersonation/Theft). Detection came from strategy {{1}}, analytic {{2}}. The preventive gap \u2014 an over-granted 'Replace a process level token' right \u2014 belongs to mitigation {{3}} (Privileged Account Management).", "blanks": ["T1134.001", "DET0482", "AN1324", "M1026"], "bank": ["T1134.001", "DET0482", "AN1324", "M1026", "T1134.002", "DET0001", "AN9999", "M1018"]}, {"id": "X12", "type": "spotline", "label": "Playbook review: worst line", "summary": "Five playbook lines; click the line that would cause the most damage.", "scenario": "The SOC playbook for AN1324 alerts is in annual review. Five lines below. One would cause the most damage if followed during a real incident. Click it.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Playbook draft v3.1", "body": "<div class=\"codeblock\"><span class=\"n\">1<\/span>  On any AN1324 alert: first check UserContextFilter and AllowedSystemProcesses.\n<span class=\"n\">2<\/span>  Correlate the chain within the policy TimeWindow before classifying.\n<span class=\"n\">3<\/span>  Auto-isolate the host on EVERY alert, before any checks, no exceptions.\n<span class=\"n\">4<\/span>  Review all four mutable elements quarterly under change control.\n<span class=\"n\">5<\/span>  Record disposition and tuning decisions in the case file for audit.<\/div>"}], "question": "Which line would cause the most damage?", "hint": "Line 1 is triage hygiene; 2, 4, 5 are discipline. One line converts every false positive into a production outage.", "explanation": "Line 3 is the worst: <b>auto-isolating on every alert before any checks<\/b> turns every whitelist hit (services.exe, a backup agent, an approved runas) into a production outage, burns analyst trust in the playbook, and \u2014 with the allow-lists unchecked first (line 1's own order) \u2014 isolates hosts the analytic was designed to suppress. It also tips off an active adversary on unverified chains, which costs you stealth. Lines 1, 2, 4, 5 are exactly the discipline a mature playbook carries. Aggression is not rigour; sequencing is.", "study": "Playbook ordering: suppress-and-verify before contain; containment on verified chains.", "lines": ["On any AN1324 alert: first check UserContextFilter and AllowedSystemProcesses.", "Correlate the chain within the policy TimeWindow before classifying.", "Auto-isolate the host on EVERY alert, before any checks, no exceptions.", "Review all four mutable elements quarterly under change control.", "Record disposition and tuning decisions in the case file for audit."], "flaw": 2}, {"id": "X13", "type": "slots", "label": "Sibling discrimination under fire", "summary": "4 behaviour descriptions \u2192 the correct T1134.x sub-technique each one describes.", "scenario": "A malware report mixed four T1134 behaviours into one paragraph and the review failed. As the ATT&amp;CK editor on call, sort each behaviour description into the sub-technique it actually describes. The distinctions are load-bearing \u2014 detection strategies are scoped per sub-technique.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Sub-technique one-liners", "body": "<div class=\"codeblock\"><span class=\"k\">T1134.001<\/span> duplicate an EXISTING token, then impersonate it on this process/thread\n<span class=\"k\">T1134.002<\/span> start a NEW process using a duplicated token (CreateProcessWithTokenW / AsUserW)\n<span class=\"k\">T1134.003<\/span> MAKE a new token (e.g. NtFilterToken), then impersonate it\n<span class=\"k\">T1134.005<\/span> inject extra SIDs into a token's SID-History<\/div>"}, {"label": "ARTEFACT 2 \u2014 Report sentences (one per behaviour)", "body": "<div class=\"codeblock\">[i] 'implant called ImpersonateLoggedOnUser to act as the logged-on finance director's existing context'\n[ii] 'tool used CreateProcessWithTokenW to launch its payload as the service account'\n[iii] 'malware built a fresh restricted token with NtFilterToken and adopted it to bypass UAC (as FinFisher does)'\n[iv] 'implant added enterprise SIDs into its token history to masquerade as an old identity'<\/div>"}], "question": "Drag each behaviour description onto the sub-technique it describes.", "hint": "Existing vs new token decides between .001 and .003; a NEW process decides .002; SID history is .005.", "explanation": "<b>[i] \u2192 T1134.001<\/b>: an existing context, impersonated on the spot \u2014 this is the behaviour DET0482 detects. <b>[ii] \u2192 T1134.002<\/b>: CreateProcessWithTokenW starts a <i>new<\/i> process with the duplicated token. <b>[iii] \u2192 T1134.003<\/b>: a fresh token made via NtFilterToken (the FinFisher UAC-bypass pattern) \u2014 nothing was stolen, it was minted. <b>[iv] \u2192 T1134.005<\/b>: SID-History injection masquerades through added SIDs, not through a borrowed token. Precision here is why ATT&amp;CK splits T1134 at all: each behaviour needs its own detection strategy and its own telemetry.", "study": "The T1134 sub-technique boundaries: steal-and-impersonate / new process / new token / SID history.", "items": ["[i] ImpersonateLoggedOnUser acting as a logged-on user's EXISTING context", "[ii] CreateProcessWithTokenW launching a NEW process as the service account", "[iii] NtFilterToken MINTS a fresh token, then it is adopted (UAC bypass)", "[iv] Extra SIDs injected into a token's SID-History to masquerade"], "slots": [{"label": "T1134.001 Token Impersonation/Theft", "correct": "[i] ImpersonateLoggedOnUser acting as a logged-on user's EXISTING context"}, {"label": "T1134.002 Create Process with Token", "correct": "[ii] CreateProcessWithTokenW launching a NEW process as the service account"}, {"label": "T1134.003 Make and Impersonate Token", "correct": "[iii] NtFilterToken MINTS a fresh token, then it is adopted (UAC bypass)"}, {"label": "T1134.005 SID-History Injection", "correct": "[iv] Extra SIDs injected into a token's SID-History to masquerade"}]}, {"id": "X14", "type": "qcm", "label": "The green dashboard that lies", "summary": "ETW:Token forwarder dead 45 min; dashboard green; exec asks 'are we clean?'", "scenario": "16:40. The exec dashboard shows <b>'ETW:Token: 0 events in 45 min'<\/b> with a green check \u2014 no alerts, nothing anomalous. Then the pipeline health ticket lands: the ETW:Token forwarder on the server estate <b>died 45 minutes ago<\/b>. The CEO's chief of staff, mid-briefing, asks you directly: <i>'So we're clean on token theft for the last hour?'<\/i>", "artefacts": [{"label": "ARTEFACT 1 \u2014 The two signals", "body": "<div class=\"codeblock\"><span class=\"k\">Signal A (dashboard):<\/span> '0 token API events in 45 min' \u2014 rendered GREEN (no alerts)\n<span class=\"k\">Signal B (pipeline health):<\/span> ETW:Token forwarder on servers DOWN since 15:55\n<span class=\"c\">// The window in question produced no telemetry at all.<\/span><\/div>"}], "question": "What do you answer?", "hint": "Signal A is not evidence of calm; it is evidence of silence. What does an empty feed actually prove?", "explanation": "You answer: <b>no \u2014 absence of events from a dead pipeline proves nothing; restore telemetry, then re-assess the window<\/b>. A green zero on a dead feed is the classic health-vs-security conflation: the dashboard read 'no alerts' as 'all quiet', but for 45 minutes the analytic's ETW:Token leg was blind, so the 09:12-style chains you drilled earlier would have been invisible. 'Token theft cannot happen anymore' is not a sentence a professional utters, and deleting the dashboard removes the very tool that must tell the truth once fixed. This is why pipeline health monitoring belongs INSIDE detection engineering, not beside it.", "study": "Telemetry health vs alert counts; absence of evidence vs evidence of absence.", "options": ["Yes \u2014 zero events means zero activity, sign off the hour as clean", "No \u2014 the pipeline was dead: absence of events proves nothing; restore telemetry first, then re-assess the window", "Token theft can no longer occur on this estate, so the hour is clean by definition", "Delete the dashboard so it cannot mislead anyone again"], "correct": 1}, {"id": "X15", "type": "order", "label": "Sequence the response", "summary": "Rank 4 response actions for a confirmed chain on FIN-SRV-1 \u2014 evidence, impact, and a destructive decoy.", "scenario": "Confirmed complete AN1324 chain on <span class=\"mono\">FIN-SRV-1<\/span>, the finance file server (monthly close in three days). Attacker impersonated <span class=\"mono\">CORP\\sqladmin<\/span>; the identity may still be in use; nothing is contained yet. Sequence the four actions: <b>1 = do first<\/b>.", "artefacts": [{"label": "ARTEFACT 1 \u2014 The four candidate actions", "body": "<div class=\"codeblock\">[a] Capture volatile memory and EDR-isolate FIN-SRV-1\n[b] Disable CORP\\sqladmin interactive use and rotate its credentials\n[c] Force-restart FIN-SRV-1 to 'wash the attacker out of memory'\n[d] Hunt the same chain fleet-wide (ETW + 4688) to scope the intrusion\n<span class=\"c\">// constraints: memory dies on reboot; the identity may be reused the moment you look away; scope is unknown<\/span><\/div>"}], "question": "Drag into response order (1 = first).", "hint": "Evidence dies on reboot; an uncontained identity keeps working while you hunt; the destructive option goes last, if at all.", "explanation": "1st: <b>[a] capture memory + isolate<\/b> \u2014 volatile evidence (the in-memory token theft) survives only until reboot, and isolation stops the active use in one motion. 2nd: <b>[b] disable and rotate sqladmin<\/b> \u2014 cut off identity reuse while the hunt runs. 3rd: <b>[d] fleet-wide hunt<\/b> \u2014 scope the intrusion with the hot analytic while the compromised host is already contained. 4th (last, and only on purpose): <b>[c] the reboot<\/b> \u2014 it destroys the very evidence step one preserved, solves nothing (in-memory theft returns via whatever persistence exists), and belongs at the end of a forensic plan if it appears at all. Sequencing IS the senior skill: the same four actions in the wrong order lose the case.", "study": "Response sequencing: evidence, identity, scope, and destructive actions last.", "order": ["[a] Capture volatile memory and EDR-isolate FIN-SRV-1", "[b] Disable CORP\\sqladmin interactive use and rotate credentials", "[d] Hunt the same chain fleet-wide (ETW + 4688) to scope", "[c] Force-restart FIN-SRV-1 to 'wash out' memory"]}]};
const META = DATA.meta;
/* Map the platform difficulty tier to the severity class — 'extremely-hard'
   must land on the .sev-extreme palette class. Set at load so the intro
   screen badge already shows the correct severity colour. */
const SEVCLASS = ({easy:'sev-easy', medium:'sev-medium', hard:'sev-hard', 'extremely-hard':'sev-extreme'})[META.difficulty] || 'sev-easy';
document.body.className = SEVCLASS;

/* ================= tiny helpers ================= */
const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function fmt(s){ s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
/* Reusable partial-credit scoring function (platform contract):
   credit = max(0, (H - W) / N) — H correct items, W wrong items, N correct items. */
function scoreExercise(selectedItems, correctItems){
  const cs = new Set(correctItems); let H = 0, W = 0;
  (selectedItems || []).forEach(v => { if (cs.has(v)) H++; else W++; });
  const N = Math.max(1, correctItems.length);
  return Math.max(0, (H - W) / N);
}

/* ================= state ================= */
const S = {
  view:'intro', order:[], pos:0, R:[], pool:[], inReview:false,
  remaining:0, tstate:'RUNNING', prevState:null, manualSec:0, autoSec:0,
  creditSum:0, answered:0, reported:false, user:'', country:'', locale:'en'
};
let tick = null;

function initExam(){
  S.order = shuffle(DATA.exercises.map((_,i)=>i));
  S.R = DATA.exercises.map(()=>({answered:false, skipped:false, hintUsed:false, credit:0}));
  S.pos = 0; S.pool = []; S.inReview = false;
  S.remaining = META.timerMinutes*60; S.tstate='RUNNING'; S.prevState=null;
  S.manualSec=0; S.autoSec=0; S.creditSum=0; S.answered=0; S.reported=false;
  document.body.className = SEVCLASS;
}
function cur(){ const oi = S.order[S.pos]; return { ex: DATA.exercises[oi], rt: S.R[oi], oi }; }

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
function setT(st){ S.tstate = st; updHud(); }
function startTick(){
  if(tick) clearInterval(tick);
  tick = setInterval(()=>{
    if(S.tstate==='RUNNING'){
      S.remaining--;
      if(S.remaining<=0){ S.remaining=0; setT('ENDED'); updHud(); finishExam(); return; }
    } else if(S.tstate==='PAUSED_MANUAL'){ S.manualSec++; }
    else if(S.tstate==='PAUSED_AUTO_CHECK'){ S.autoSec++; }
    updHud();
  }, 1000);
}
function tstateInfo(){
  switch(S.tstate){
    case 'RUNNING': return {cls:'run', txt:'▶ RUNNING'};
    case 'PAUSED_MANUAL': return {cls:'man', txt:'⏸ PAUSED — manual (press Resume)'};
    case 'PAUSED_AUTO_CHECK': return {cls:'aut', txt:'⏸ PAUSED — reviewing feedback (resumes on Next)'};
    default: return {cls:'end', txt:'■ ENDED'};
  }
}

/* ================= HUD ================= */
function updHud(){
  const t = tstateInfo();
  const cnt = $('#hudCnt'); if(cnt){ cnt.textContent = (S.view==='exam' && S.order.length) ? ('Exercise ' + (S.pos+1) + ' of ' + S.order.length) : ''; }
  const el = $('#hudTimer'); if(el){ el.textContent = fmt(S.remaining); }
  const st = $('#hudTState'); if(st){ st.textContent = t.txt; st.className = 'tstate ' + t.cls; }
  const sc = $('#hudScore');
  if(sc){ sc.innerHTML = S.answered>0
      ? 'Score <b>' + (Math.round(S.creditSum*10)/10) + '</b> / ' + S.answered + ' · ' + Math.round((S.creditSum/S.answered)*100) + '%'
      : 'Score <b>0.0</b> / 0 · —'; }
  const pf = $('#pfill'); if(pf){ pf.style.width = Math.round(((S.pos)/(S.order.length))*100) + '%'; }
  const hintB = $('#hudHint'), skipB = $('#hudSkip'), pauseB = $('#hudPause');
  if(hintB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } hintB.disabled = !rt || rt.hintUsed || rt.answered; }
  if(skipB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } skipB.disabled = !rt || rt.answered; }
  if(pauseB){ pauseB.disabled = (S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK'); }
}

/* ================= views ================= */
function render(){
  if(S.view==='intro') renderIntro();
  else if(S.view==='exam') renderExamShell();
  else if(S.view==='review') renderReview();
  else if(S.view==='results') renderResults();
}

  $('#collBtn').addEventListener('click', ()=>{

    '<span class="small dim">Checking stops the clock so you can study the feedback without pressure — press Next when ready.</span></div>';
  $('#btnCheck').addEventListener('click', onCheck);
  /* wire any log-viewer filter boxes inside this exercise's artefacts */
  $$('.logfilter', box).forEach(inp=>{
    const host = inp.closest('.artefact-b');
    const lines = $$('.logline', host);
    inp.addEventListener('input', ()=>{
      const q = inp.value.trim().toLowerCase();
      lines.forEach(l=>{ l.style.display = (!q || l.textContent.toLowerCase().indexOf(q)>=0) ? '' : 'none'; });
    });

function useHint(){
  const { rt } = cur();
  if(rt.hintUsed || rt.answered) return;
  rt.hintUsed = true;
  $('#hintBox').classList.remove('hidden');
  updHud();
}

function skipEx(){
  const { rt } = cur();
  if(rt.answered) return;
  rt.skipped = true;
  if(!S.pool.includes(S.order[S.pos])) S.pool.push(S.order[S.pos]);
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){ S.inReview=false; S.view='review'; renderReview(); return; }
  advance();
}

function advance(){
  if(S.pos < S.order.length-1){ S.pos++; renderExercise(); return; }
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
  else finishExam();
}

/* ----- shared drag & drop engine (pointer events: mouse + touch; click-to-place fallback)
   Implemented as a global singleton: the window-level pointermove/pointerup
   listeners are attached exactly ONCE and dispatch to the currently active drag
   context. Re-rendering an exercise only swaps DND.ctx, so no listener ever
   accumulates across exercises. ----- */
const DND = { drag:null, sel:null, ctx:null, wired:false };
function enableDnD(root, opts){
  DND.ctx = { root, opts };
  DND.sel = null; DND.drag = null;
  if(!DND.wired){
    DND.wired = true;
    window.addEventListener('pointermove', dndMove);
    window.addEventListener('pointerup', dndUp);
  }
  root.addEventListener('pointerdown', e=>{
    const o = DND.ctx.opts;
    const chip = e.target.closest(o.chips); if(!chip || chip.classList.contains('static')) return;
    if(e.target.closest('button.up') || e.target.closest('button.dn')) return;
    DND.drag = { chip, x:e.clientX, y:e.clientY, moved:false, ghost:null };
  });
  root.addEventListener('click', e=>{
    const o = DND.ctx.opts;
    const tgt = e.target.closest(o.targets);
    if(tgt && DND.sel){ o.onDrop(DND.sel, tgt); DND.sel.classList.remove('selchip'); DND.sel = null; }
  });
}
function dndMove(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(!d.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y) > 7){
    d.moved = true;
    const g = d.chip.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g;
    d.chip.classList.add('dragging');
  }
  if(d.moved){
    d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) tgt.classList.add('drop-hi');
  }
}
function dndUp(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(d.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) o.onDrop(d.chip, tgt);
    if(d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
  } else {
    if(d.chip.dataset.placed==='1'){ o.onReturn(d.chip); }
    else if(DND.sel===d.chip){ DND.sel.classList.remove('selchip'); DND.sel=null; }
    else { if(DND.sel) DND.sel.classList.remove('selchip'); DND.sel = d.chip; d.chip.classList.add('selchip'); }
  }
  DND.drag = null;
}

/* ----- drag chips into slots (1 chip per slot) ----- */
WIDGETS.slots = function(ex, rt, box){
  rt.place = ex.slots.map(()=>-1);
  const chips = shuffle(ex.items.map((_,i)=>i));
  box.innerHTML =
    '<div class="dd">' +
      '<div class="dd-bank"><h4>ITEM BANK — drag a card into a slot (or tap card then slot; tap a placed card to send it back)</h4><div id="bankW">' +
        chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.items[ci]+'</button>').join('') +
      '</div></div>' +
      '<div class="dd-slots"><h4>DROP SLOTS</h4>' +
        ex.slots.map((s,i)=>'<div class="slot drop"><div class="slot-l">'+s.label+'</div><div class="slot-w" data-i="'+i+'"></div></div>').join('') +
      '</div>' +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, slotW){
    const ci = +chipEl.dataset.c, si = +slotW.dataset.i;
    if(rt.place[si] >= 0){
      const old = $('.chip[data-c="'+rt.place[si]+'"]', slotW);
      if(old){ old.dataset.placed='0'; bankW.appendChild(old); }
    }
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    rt.place[si] = ci; chipEl.dataset.placed='1'; slotW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c;
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.slot-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.slots.forEach((s,i)=>{
      const ci = rt.place[i];
      correct.push(i+'::'+ex.items.indexOf(s.correct));
      if(ci<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — slot "'+s.label+'" stayed empty. Correct: '+s.correct}); }
      else {
        selected.push(i+'::'+ci);
        const ok = ex.items[ci]===s.correct;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+ex.items[ci]+'" in "'+s.label+'"'});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.slots.map(s=>s.label+' ← '+s.correct).join(';  ') };
  };
};

/* ----- drag chips into bins ----- */
WIDGETS.bins = function(ex, rt, box){
  rt.assign = ex.chips.map(()=>-1);
  const chips = shuffle(ex.chips.map((_,i)=>i));
  box.innerHTML =
    '<div class="bank"><span class="bank-t">Drag each card into the right bin (or tap card then bin; tap a placed card to send it back).</span><div id="bankW">' +
      chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.chips[ci]+'</button>').join('') + '</div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px">' +
      ex.bins.map((b,i)=>'<div class="bin drop"><div class="bin-h">'+b.label+'</div><div class="bin-w" data-i="'+i+'"></div></div>').join('') +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, binW){
    const ci = +chipEl.dataset.c, bi = +binW.dataset.i;
    rt.assign[ci] = bi; chipEl.dataset.placed='1'; binW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c; rt.assign[ci] = -1; chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.bin-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.chips.forEach((c,i)=>{
      const bi = rt.assign[i];
      const cbi = ex.bins.findIndex(b=>b.accept.indexOf(i)>=0);
      correct.push(i+'::'+cbi);
      if(bi<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — "'+c+'" was left unsorted. Correct bin: '+ex.bins[cbi].label}); }
      else {
        selected.push(i+'::'+bi);
        const ok = bi===cbi;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+c+'" → '+(ok?ex.bins[bi].label:'placed in "'+ex.bins[bi].label+'" (correct: '+ex.bins[cbi].label+')')});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.chips.map((c,i)=>'"'+c+'" → '+ex.bins[ex.bins.findIndex(b=>b.accept.indexOf(i)>=0)].label).join(';  ') };
  };
};

/* ----- ordering / ranking ----- */
WIDGETS.order = function(ex, rt, box){
  let seq = shuffle(ex.order.map((_,i)=>i));
  if(ex.order.length>2 && seq.every((v,p)=>v===p)) seq = shuffle(seq);
  rt.seq = seq;
  function draw(){
    box.innerHTML = '<div class="bank"><span class="bank-t">Drag rows to reorder (or use ▲▼). Position 1 goes first.</span></div><div id="olist">' +
      seq.map((oi,p)=>'<div class="orow drop" data-i="'+oi+'"><span class="onum">'+(p+1)+'</span>' +
        '<span class="mv"><button type="button" class="up" aria-label="Move up">▲</button><button type="button" class="dn" aria-label="Move down">▼</button></span>' +
        '<span class="otext">'+ex.order[oi]+'</span></div>').join('') + '</div>';
    const ol = $('#olist', box);
    $$('.up', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i>0){ [seq[i-1],seq[i]]=[seq[i],seq[i-1]]; draw(); }
    }));
    $$('.dn', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i<seq.length-1){ [seq[i+1],seq[i]]=[seq[i],seq[i+1]]; draw(); }
    }));
    enableDnD(ol, {
      chips:'.orow', targets:'.orow',
      onDrop:(chipEl, tgt)=>{
        if(chipEl===tgt) return;
        const ci = seq.indexOf(+chipEl.dataset.i);
        seq.splice(ci,1);
        const ti = seq.indexOf(+tgt.dataset.i);
        seq.splice(ci < ti ? ti+1 : ti, 0, +chipEl.dataset.i);
        draw();
      },
      onReturn:()=>{}
    });
  }
  draw();
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    seq.forEach((oi,p)=>{
      selected.push(p+'::'+oi); correct.push(p+'::'+p);
      const ok = oi===p;
      rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'position '+(p+1)+': "'+ex.order[oi]+'"'+(ok?'':' (correct: "'+ex.order[p]+'")')});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.order.map((o,i)=>(i+1)+'. '+o).join('   ') };
  };
};

/* ----- multi-step decision tree ----- */
WIDGETS.tree = function(ex, rt, box){
  rt.stepSel = ex.steps.map(()=>-1);
  box.innerHTML = ex.steps.map((st,si)=>{
    const perm = shuffle(st.options.map((_,i)=>i));
    return '<div class="step"><div class="step-h">STEP '+(si+1)+' OF '+ex.steps.length+'</div>' +
      (st.context?'<div class="step-c">'+st.context+'</div>':'') +
      '<div class="step-q">'+st.question+'</div>' +
      '<div class="opts" data-step="'+si+'">' + perm.map((oi,k)=>
        '<button type="button" class="opt" data-v="'+oi+'"><span class="opt-l">'+optLetters(k)+'.</span><span>'+st.options[oi]+'</span></button>').join('') +
      '</div></div>';
  }).join('');
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    const si = +b.closest('.opts').dataset.step;
    rt.stepSel[si] = +b.dataset.v;
    $$('.opts[data-step="'+si+'"] .opt', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.steps.forEach((st,si)=>{
      const v = rt.stepSel[si];
      selected.push(si+'::'+v); correct.push(si+'::'+st.correct);
      const ok = v===st.correct;
      rows.push({s: ok?'ok':(v<0?'miss':'bad'),
        t:(ok?'✓ Correct — ':'✗ Wrong — ')+'STEP '+(si+1)+': '+(v<0?'○ Missed — nothing chosen':'you chose: '+st.options[v])});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.steps.map((st,si)=>'Step '+(si+1)+': '+st.options[st.correct]).join('   ') };
  };
};

/* ================= check / feedback / next ================= */
function onCheck(){
  const { ex, rt } = cur();
  if(rt.answered) return;
  const res = rt.grade();
  let credit = res.credit;
  if(rt.hintUsed) credit = Math.max(0, credit - 0.10);
  rt.credit = credit; rt.answered = true;
  S.creditSum += credit; S.answered += 1;
  if(S.pool.includes(S.order[S.pos])) S.pool = S.pool.filter(x=>x!==S.order[S.pos]);
  /* Check-triggered auto-pause: stop the clock the moment Check is pressed. */
  if(S.tstate==='RUNNING') setT('PAUSED_AUTO_CHECK');
  $('#wbox').classList.add('locked');
  $$('select', $('#wbox')).forEach(s=>s.disabled=true);
  $$('button', $('#wbox')).forEach(b=>b.disabled=true);
  const bc = $('#btnCheck'); if(bc){ bc.disabled = true; }
  const isMulti = res.multi;
  let label, cls;
  if(credit>=1){ label='✓ CORRECT'; cls='fb-ok'; }
  else if(credit>0){ label='✓ PARTIALLY CORRECT'; cls='fb-part'; }
  else { label='✗ INCORRECT'; cls='fb-bad'; }
  const pendingLeft = S.pool.filter(oi=>!S.R[oi].answered).length;
  const last = !S.inReview && S.pos===S.order.length-1 && pendingLeft===0;
  const nextLabel = S.inReview ? '↩ Back to skipped list' : (last ? '⏱ Final Submit' : 'Next exercise →');
  const itemsTxt = isMulti ? '<div class="fb-cred">credit ' + (Math.round(credit*100)/100).toFixed(2) + ' — computed as (right − wrong) ÷ items</div>' : '';
  $('#fbHost').innerHTML =
    '<section class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>' +
      (isMulti && credit>0 && credit<1 ? '<span class="small dim">per-item breakdown below</span>':'') + '</div>' +
    '<div class="fb-b">' + itemsTxt +
      '<div class="fb-rows">' + res.rows.map(r=>'<div class="r-'+r.s+'">'+r.t+'</div>').join('') + '</div>' +
      '<div class="fb-correct"><b style="color:var(--state-correct)">✓ Model answer:</b> ' + res.correct + '</div>' +
      (rt.hintUsed ? '<div class="small dim" style="margin-top:6px">Includes the −0.10 hint penalty.</div>' : '') +
      '<p class="fb-exp">' + ex.explanation + '</p>' +
      (credit<1 && ex.study ? '<div class="fb-study"><b style="color:var(--accent-amber)">What to study:</b> ' + ex.study + '</div>' : '') +
      '<div class="navrow"><button class="btn btn-pri" id="btnNext">'+nextLabel+'</button></div>' +
    '</div></section>';
  $('#btnNext').addEventListener('click', onNext);
  $('#btnNext').focus();
  updHud();
}

function onNext(){
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){
    const pending = S.pool.filter(oi=>!S.R[oi].answered);
    if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
    else finishExam();
    return;
  }
  advance();
}

function manualPause(){
  if(S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK') return;
  S.prevState = S.tstate;
  setT('PAUSED_MANUAL');
  $('#ov').style.display = 'flex';
  $('#ovResume').focus();
}
function resumePause(){
  setT(S.prevState || 'RUNNING');
  S.prevState = null;
  $('#ov').style.display = 'none';
}

/* ================= review skipped ================= */
function renderReview(){
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  $('#app').innerHTML =
    '<header class="hud">' +
      '<span class="badge">' + META.severity + '</span>' +
      '<div class="timerbox"><span class="timer" id="hudTimer"></span><span class="tstate run" id="hudTState"></span></div>' +
      '<span class="scorebox" id="hudScore"></span><span class="sp"></span>' +
      '<button class="btn btn-warn" id="hudPause">⏸ Pause</button>' +
    '</header>' +
    '<div class="progress"><div class="progress-fill" id="pfill"></div></div>' +
    '<div class="wrap">' +
      '<section class="blk blk-scenario"><div class="blk-h">⚠ REVIEW SKIPPED EXERCISES</div><div class="blk-b">' +
        '<p class="dim">You have ' + pending.length + ' skipped exercise(s). You can return to each one and answer it, as many times as you need, while the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</p>' +
        pending.map(oi=>'<div class="rv-item"><span class="warn">⚠ Skipped</span><span style="flex:1">' + DATA.exercises[oi].label + '</span>' +
          '<button class="btn btn-pri" data-oi="'+oi+'">Answer now</button></div>').join('') +
        '<div class="navrow"><button class="btn btn-pri" id="btnFinish">⏱ Finish exam &amp; see results</button></div>' +
      '</div></section>' +
    '</div>';
  $('#hudPause').addEventListener('click', manualPause);
  $('#btnFinish').addEventListener('click', finishExam);
  $$('button[data-oi]').forEach(b=>b.addEventListener('click', ()=>{
    S.pos = S.order.indexOf(+b.dataset.oi); S.inReview = true; S.view='exam'; renderExamShell();
  }));
  updHud();
  window.scrollTo(0,0);
}

/* ================= results ================= */
function finishExam(){
  setT('ENDED');
  if(tick){ clearInterval(tick); tick=null; }
  S.view='results';
  renderResults();
}
function renderResults(){
  let full=0, part=0, zero=0, skipped=0, partSum=0;
  DATA.exercises.forEach((ex,i)=>{
    const rt = S.R[i];
    if(rt.answered){
      if(rt.credit>=1) full++;
      else if(rt.credit>0){ part++; partSum+=rt.credit; }
      else zero++;
    } else skipped++;
  });
  const answered = S.answered;
  const percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  const passed = percent >= META.passMark;
  const sumR = Math.round(S.creditSum*10)/10;
  const avgPart = part>0 ? (Math.round(partSum/part*100)/100).toFixed(2) : '—';
  $('#app').innerHTML =
    '<div class="wrap">' +
      '<section class="card hero"><h1>' + META.id + ' — ' + META.severity + ' — Results</h1>' +
        '<p class="obj">Score over answered exercises only: <b class="mono" style="color:var(--text-primary)">' + sumR + ' / ' + answered + '</b> · <b class="mono" style="color:var(--text-primary)">' + percent + '%</b> · pass mark ' + META.passMark + '%</p>' +
      '</section>' +
      '<div class="res-grid">' +
        '<div class="res ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct (credit 1.0)</div></div>' +
        '<div class="res part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct (avg '+avgPart+')</div></div>' +
        '<div class="res bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect (credit 0)</div></div>' +
        '<div class="res skip"><div class="num">'+skipped+'</div><div class="lab">⚠ Skipped — excluded from score</div></div>' +
      '</div>' +
      '<div class="verdict '+(passed?'pass':'fail')+'">' +
        (passed
          ? '<h2>✓ PASS</h2><p>You reached ' + percent + '% (threshold ' + META.passMark + '%). Certificate-level performance on ' + META.id + ' at ' + META.severity + ' severity. Take the next severity file when you are ready.</p>'
          : '<h2>✗ FAIL</h2><p>You reached ' + percent + '%, below the ' + META.passMark + '% pass mark. You must retake this exam. Review the explanations you saw during the attempt, then press Retake — exercises and options are shuffled again.</p>') +
        '<div class="navrow"><button class="btn btn-pri" id="btnRetake" style="min-width:200px">↻ Retake exam</button></div>' +
      '</div>' +
      '<p class="pausetime">⏸ Manual pause time: ' + fmt(S.manualSec) + ' · ⏸ Feedback review time (auto-pause): ' + fmt(S.autoSec) + '</p>' +
    '</div>';
  $('#btnRetake').addEventListener('click', ()=>{
    initExam(); S.view='exam'; render(); startTick();
  });
  reportScore();
  window.scrollTo(0,0);
}

/* ================= website integration ================= */
function reportScore(){
  if(S.reported) return; S.reported = true;
  const answeredCount = S.answered;
  const percent = answeredCount>0 ? Math.round((S.creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score: Math.round(S.creditSum), total: answeredCount,
      percent: percent, passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* opened directly rather than inside the site — nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.user = event.data.username || S.user;
  S.country = event.data.country || S.country;
  S.locale = event.data.locale || S.locale;
  /* theme field is always 'dark' — the exam is dark-only by contract, so nothing to switch */
});

/* ================= resume overlay wiring ================= */
$('#ovResume').addEventListener('click', resumePause);

/* ================= go ================= */
render();
</script>
</body>
</html>
