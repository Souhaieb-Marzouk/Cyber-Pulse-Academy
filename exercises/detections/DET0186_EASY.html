}

function updateButtons(){
  var ctl = S._ctl;
  var bCheck = $('btn-check');
  if (!ctl || !bCheck) return;
  if (ctl.mode === 'branch-step'){
    bCheck.innerHTML = 'Continue &rarr;';
    bCheck.disabled = !ctl.canCheck();
  } else {
    bCheck.innerHTML = 'Check answer';
    bCheck.disabled = !ctl.canCheck();
  }
  var ex = exerciseByIdx(S.current);
  var bHint = $('btn-hint');
  if (bHint && ex){
    bHint.disabled = !!S.hintUsed[ex.id] || !!S.answered[S.current];
  }
  var bSkip = $('btn-skip');
  if (bSkip){
    bSkip.disabled = !!S.answered[S.current];
  }
}

function useHint(ex){
  if (S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id] = true;
  var b = $('btn-hint'); if (b) b.disabled = true;
  var area = $('exercise-area');
  var panel = el('div','hint-panel','<span class="h-ico" aria-hidden="true">&#128161; HINT</span> &mdash; ' + ex.hint);
  var sc = area.querySelector('.blk-scenario .blk-body');
  if (sc){ sc.appendChild(panel); }
  panel.setAttribute('role','note');
  updateButtons();
}

function skipCurrent(){
  if (S.answered[S.current]) return;
  if (S.skippedPool.indexOf(S.current) === -1) S.skippedPool.push(S.current);
  renderHeader();
  if (S.fromReview){
    openReview(false);
    return;
  }
  /* move forward only: next exercise that is neither answered nor visited */
  var next = nextUnvisitedUnanswered(true);
  if (next === -1){
    if (S.skippedPool.length > 0){ openReview(false); }
    else { finishExam(); }
    return;
  }
  S.current = next;
  S.fromReview = false;
  renderExercise(next);
}

function checkCurrent(){
  var ctl = S._ctl;
  if (!ctl || !ctl.canCheck()) return;
  var ex = exerciseByIdx(S.current);
  if (ctl.mode === 'branch-step'){
    /* intermediate step: advance scenario, timer keeps running */
    ctl.advance();
    updateButtons();
    return;
  }
  var res = ctl.grade();
  var credit = scoreExercise(res.H, res.W, res.N);
  if (S.hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
  credit = Math.max(0, Math.min(1, credit));
  S.answered[S.current] = true;
  S.credits[S.current] = credit;
  S.creditSum += credit;
  S.answeredCount += 1;
  /* remove from skipped pool if present */
  var sp = S.skippedPool.indexOf(S.current);
  if (sp !== -1) S.skippedPool.splice(sp,1);

  /* mandatory check-triggered auto-pause */
  timerSetState('PAUSED_AUTO_CHECK');

  ctl.disable();
  renderFeedback(ex, res, credit);
  renderHeader();
  updateButtons();  /* hint + skip become disabled once the exercise is answered */
  var bCheck = $('btn-check'); if (bCheck) bCheck.style.display = 'none';
  var bNext = $('btn-next');
  if (bNext){
    bNext.style.display = 'inline-flex';
    bNext.innerHTML = (S.fromReview ? 'Back to skipped list &rarr;' : (lastUnansweredAfter(S.current) ? 'Final Submit &rarr;' : 'Next exercise &rarr;'));
    bNext.setAttribute('aria-label','The timer is paused while you review. Press to continue.');
  }
}

function lastUnansweredAfter(idx){
  for (var k=0;k<S.order.length;k++){
    var i = S.order[k];
    if (i!==idx && !S.answered[i]) return false;
  }
  return true;
}

function nextFromCheck(){
  /* resume timer from auto-pause */
  if (T.state === 'PAUSED_AUTO_CHECK'){ timerSetState('RUNNING'); }
  if (S.fromReview){ openReview(false); return; }
  goNextUnanswered();
}

function renderFeedback(ex, res, credit){
  var fb = $('ex-feedback');
  fb.style.display = 'block';
  fb.className = 'fb ' + labelFor(credit).cls;
  fb.innerHTML = '';
  var L = labelFor(credit);
  var h = el('div','fb-h','<span aria-hidden="true">'+L.ico+'</span> '+L.word+
    (credit>0&&credit<1 ? ' &mdash; credit <span class="fb-credit">'+credit.toFixed(2)+'</span>' : ''));
  fb.appendChild(h);
  var body = el('div','fb-body');
  if (res.N > 1 || (res.rows && res.rows.length > 1)){
    body.appendChild(el('p',null,'Score for this exercise: <span class="fb-credit">('+res.H+' &minus; '+res.W+') / '+res.N+' = '+
      scoreExercise(res.H,res.W,res.N).toFixed(2)+'</span>'+
      (S.hintUsed[ex.id] ? ' before the hint penalty &minus;0.10' : '')+
      ' &rarr; credit <span class="fb-credit">'+credit.toFixed(2)+'</span>'));
  }
  if (res.rows && res.rows.length){
    var rows = el('div','item-rows');
    res.rows.forEach(function(r){
      var cls = r.state==='ok' ? 'ir-ok' : (r.state==='bad' ? 'ir-bad' : 'ir-miss');
      var ico = r.state==='ok' ? '&#10003;' : (r.state==='bad' ? '&#10007;' : '&#9675;');
      var word = r.state==='ok' ? 'Correct' : (r.state==='bad' ? 'Wrong' : 'Missed');
      rows.appendChild(el('div','item-row '+cls,'<span class="ir-ico" aria-hidden="true">'+ico+'</span><span><b>'+word+'</b> &mdash; '+r.text+'</span>'));
    });
    body.appendChild(rows);
  }
  body.appendChild(el('div',null,'<b>Why:</b> '+ex.explain));
  if (credit < 1 && ex.study){
    body.appendChild(el('div','study-ptr','<b>What to study:</b> '+esc(ex.study)));
  }
  fb.appendChild(body);
}

/* ============================ header ============================ */
function renderHeader(){
  var pct = S.answeredCount>0 ? Math.round((S.creditSum/S.answeredCount)*100) : 0;
  var sc = $('h-score');
  if (sc) sc.innerHTML = '<span class="sum">'+S.creditSum.toFixed(1)+'</span> / '+S.answeredCount+' &nbsp;('+pct+'%)';
  var pf = $('progress-fill');
  if (pf) pf.style.width = Math.round(100*S.answeredCount/EX.length)+'%';
  var sk = $('h-skip-pool');
  if (sk){
    if (S.skippedPool.length>0 && S.started && !S.resultsShown){
      sk.style.display = 'inline-flex';
      sk.innerHTML = '<span aria-hidden="true">&#9888;</span> Skipped ('+S.skippedPool.length+')';
    } else { sk.style.display = 'none'; }
  }
  var t = $('h-timer'); if (t) t.textContent = fmtTime(T.remaining);
  var st = $('h-tstate'); if (st) renderTimerState(st);
}

/* ============================ review skipped ============================ */
function openReview(timeUp){
  S.reviewing = true;
  var v = $('review');
  var list = $('review-list');
  list.innerHTML = '';
  var head = $('review-note');
  if (S.skippedPool.length === 0){
    head.innerHTML = 'No skipped exercises remain. You can finish the exam.';
  } else {
    head.innerHTML = timeUp
      ? 'Time is up. You can no longer answer skipped exercises. They stay excluded from the score.'
      : 'These exercises are skipped. You can go back to each one and answer it, as long as the timer has not ended. If you finish with skipped exercises left, they are excluded from the score.';
  }
  S.skippedPool.forEach(function(idx){
    var ex = exerciseByIdx(idx);
    var row = el('div','rev-item');
    row.appendChild(el('span','rev-badge','<span aria-hidden="true">&#9888;</span> Skipped'));
    row.appendChild(el('span','r-title','Exercise '+posOf(idx)+' of '+EX.length+' &mdash; '+ex.title));
    var b = el('button','btn h-btn','Answer');
    b.disabled = timeUp;
    b.addEventListener('click', function(){
      S.current = idx; S.fromReview = true;
      show('exam');
      renderExercise(idx);
    });
    row.appendChild(b);
    list.appendChild(row);
  });
  var fs = $('review-submit');
  fs.disabled = false;
  show('review');
  renderHeader();
}

function backToExam(){
  /* always return to the exam view first; the review screen must never stay
     visible once the learner asked to go back */
  show('exam');
  if (S.current>=0 && !S.answered[S.current]){
    renderExercise(S.current);
  } else {
    goNextUnanswered();
  }
}

function finishExam(){
  if (S.skippedPool.length>0){ openReview(false); return; }
  showResults();
}

/* ============================ results ============================ */
function showResults(){
  timerSetState('ENDED');
  S.resultsShown = true;
  /* anything never answered counts as skipped-and-never-answered (excluded from the score) */
  if (S.current >= 0 && !S.answered[S.current] && S.skippedPool.indexOf(S.current) === -1){
    S.skippedPool.push(S.current);
  }
  var answered = S.answeredCount;
  var percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  var passed = percent >= META.passMark;
  var full=0, part=0, zero=0, skippedN=EX.length-answered, partSum=0;
  Object.keys(S.credits).forEach(function(k){
    var c = S.credits[k];
    if (c>=1) full++;
    else if (c>0){ part++; partSum+=c; }
    else zero++;
  });
  var hero = $('res-hero');
  hero.className = 'result-hero ' + (passed?'pass':'fail');
  hero.innerHTML = passed
    ? '<div class="r-ico" aria-hidden="true">&#10003;</div><h1>PASS &mdash; exam passed</h1><p class="muted">You reached the pass mark of '+META.passMark+'%. Well done.</p>'
    : '<div class="r-ico" aria-hidden="true">&#10007;</div><h1>FAIL &mdash; retake the exam</h1><p class="muted">You needed '+META.passMark+'% or more. Review the feedback and try again.</p>';
  $('res-score').innerHTML = '<span class="score-big">'+S.creditSum.toFixed(1)+' / '+answered+'</span><br><span class="muted">Final score: <b>'+percent+'%</b> &mdash; pass mark '+META.passMark+'%</span>';
  var avgPart = part>0 ? (partSum/part) : 0;
  $('res-stats').innerHTML =
    stat('s-ok','&#10003;','Fully correct', full, '')+
    stat('s-part','&#10003;','Partially correct', part, part>0 ? ' &mdash; avg '+avgPart.toFixed(2) : '')+
    stat('s-bad','&#10007;','Fully incorrect', zero, '')+
    stat('s-skip','&#9888;','Skipped &mdash; excluded', skippedN, '');
  var used = META.timerSeconds - T.remaining;
  $('res-time').innerHTML =
    '<div class="stat"><div class="s-num mono">'+fmtTime(used)+'</div><div class="s-label">Time used of '+fmtTime(META.timerSeconds)+' budget</div></div>'+
    '<div class="stat"><div class="s-num mono">'+Math.round(S.pauseManualTotal/1000)+'s</div><div class="s-label">Time paused manually (&#9208; manual breaks)</div></div>'+
    '<div class="stat"><div class="s-num mono">'+Math.round(S.pauseAutoTotal/1000)+'s</div><div class="s-label">Time paused reviewing feedback (&#9208; Check pauses)</div></div>';
  $('res-candidate').textContent = S.learner ? ('Candidate: '+S.learner) : '';
  show('results');
  reportScore(S.creditSum, answered);
  renderHeader();
}
function stat(cls, ico, label, n, extra){
  return '<div class="stat"><div class="s-num '+cls+'">'+n+'</div><div class="s-label '+cls+'"><span aria-hidden="true">'+ico+'</span> '+label+extra+'</div></div>';
}

function reportScore(creditSum, answeredCount){
  if (S.reported) return;
  S.reported = true;
  var percent = answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* opened directly, nothing to report to */ }
}

function retake(){
  S.started=false; S.resultsShown=false; S.reported=false;
  startExam();
}

/* ============================ widgets ============================ */
function mkOptRow(label, text, onPick, selectedTxt){
  var b = el('button','opt');
  b.type='button';
  b.innerHTML = '<span class="opt-k">'+esc(label)+'</span><span class="opt-t">'+text+'</span><span class="opt-state"></span>';
  b.addEventListener('click', function(){ onPick(b); });
  return b;
}
function setOptState(btn, txt){ btn.querySelector('.opt-state').innerHTML = txt||''; }

var WIDGETS = {

  /* -------- single-answer multiple choice -------- */
  qcm: function(ex, holder, opts){
    var options = (opts || ex.options);
    var state = { picked:-1, done:false };
    var rows = options.map(function(o,i){
      var r = mkOptRow(String.fromCharCode(65+i)+'.', o.t, function(btn){
        if (state.done) return;
        state.picked = i;
        rows.forEach(function(x){ x.classList.remove('selected'); setOptState(x,''); });
        btn.classList.add('selected'); setOptState(btn,'&#9679; Selected');
        fire();
      });
      holder.appendChild(r); return r;
    });
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done && state.picked>=0; },
      grade: function(){
        var ok = options[state.picked].correct;
        var rowsF = [];
        options.forEach(function(o,i){
          if (o.correct) rowsF.push({state: (i===state.picked?'ok':'miss'), text: o.t+(o.why? ' &mdash; '+o.why:'')});
        });
        if (!ok) rowsF.push({state:'bad', text:'You chose: '+options[state.picked].t+(options[state.picked].whyBad? ' &mdash; '+options[state.picked].whyBad:'')});
        return {H: ok?1:0, W: ok?0:1, N:1, rows: rowsF};
      },
      disable: function(){ state.done=true; rows.forEach(function(r){ r.disabled=true; }); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- multi-select with partial credit -------- */
  multi: function(ex, holder){
    var options = ex.options;
    var state = { sel:{}, done:false };
    var rows = options.map(function(o,i){
      var r = mkOptRow(String.fromCharCode(65+i)+'.', o.t, function(btn){
        if (state.done) return;
        state.sel[i] = !state.sel[i];
        if (state.sel[i]){ btn.classList.add('selected'); setOptState(btn,'&#9679; Selected'); }
        else { btn.classList.remove('selected'); setOptState(btn,''); }
        fire();
      });
      holder.appendChild(r); return r;
    });
    function anySel(){ return Object.keys(state.sel).some(function(k){ return state.sel[k]; }); }
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done && anySel(); },
      grade: function(){
        var N=0,H=0,W=0, rowsF=[];
        options.forEach(function(o,i){
          if (o.correct){
            N++;
            if (state.sel[i]){ H++; rowsF.push({state:'ok', text: o.t+(o.why? ' &mdash; '+o.why:'')}); }
            else rowsF.push({state:'miss', text: o.t+(o.why? ' &mdash; '+o.why:'')});
          } else if (state.sel[i]){
            W++; rowsF.push({state:'bad', text: o.t+(o.whyBad? ' &mdash; '+o.whyBad:'')});
          }
        });
        return {H:H, W:W, N:N, rows:rowsF};
      },
      disable: function(){ state.done=true; rows.forEach(function(r){ r.disabled=true; }); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- matching pairs (click left, then right) -------- */
  match: function(ex, holder){
    var left = ex.pairs.left, right = ex.pairs.right, map = ex.pairs.map;
    var rightOrder = shuffledDifferent(right.map(function(_,i){return i;}));
    var state = { pair:{}, activeL:-1, done:false };
    var g = el('div','match-grid');
    var colL = el('div','match-col','<h4>Items</h4>');
    var colR = el('div','match-col','<h4>Matches</h4>');
    g.appendChild(colL); g.appendChild(colR); holder.appendChild(g);
    var rowsL=[], rowsR=[];
    left.forEach(function(t,i){
      var b = el('button','mitem','<span>'+t+'</span><span class="pair-tag"></span>');
      b.addEventListener('click', function(){
        if (state.done) return;
        if (state.pair[i] !== undefined){ /* unpair */
          state.pair[i] = undefined;
          b.classList.remove('paired');
          b.querySelector('.pair-tag').innerHTML='';
          fire(); return;
        }
        state.activeL = i;
        rowsL.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
      });
      colL.appendChild(b); rowsL.push(b);
    });
    rightOrder.forEach(function(ri){
      var b = el('button','mitem','<span>'+right[ri]+'</span>');
      b.addEventListener('click', function(){
        if (state.done || state.activeL<0) return;
        /* if this right item already used by another left, unpair that one */
        Object.keys(state.pair).forEach(function(k){
          if (state.pair[k]===ri){ state.pair[k]=undefined; rowsL[k].classList.remove('paired'); rowsL[k].querySelector('.pair-tag').textContent=''; }
        });
        state.pair[state.activeL]=ri;
        rowsL[state.activeL].classList.add('paired');
        rowsL[state.activeL].querySelector('.pair-tag').innerHTML = '&#8596; '+String.fromCharCode(65+rightOrder.indexOf(ri));
        rowsL[state.activeL].classList.remove('active');
        state.activeL=-1;
        fire();
      });
      colR.appendChild(b); rowsR.push(b);
    });
    function allPaired(){
      for (var i=0;i<left.length;i++){ if (state.pair[i]===undefined) return false; }
      return true;
    }
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done && allPaired(); },
      grade: function(){
        var H=0,W=0, rowsF=[];
        left.forEach(function(t,i){
          var picked = state.pair[i];
          var ok = picked===map[i];
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: t+' &rarr; '+right[picked]+(ok? '':(' &mdash; correct match: '+right[map[i]]))});
        });
        return {H:H,W:W,N:left.length,rows:rowsF};
      },
      disable: function(){ state.done=true; rowsL.concat(rowsR).forEach(function(b){ b.disabled=true; }); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- categorize items into bins -------- */
  cats: function(ex, holder){
    var bins = ex.bins, items = ex.items;
    var itemOrder = shuffle(items.map(function(_,i){return i;}));
    var state = { place:{}, activeI:-1, done:false };
    var bank = el('div',null,'<h4 style="margin:2px 0 6px;color:var(--text-secondary);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;">Drag items &mdash; or click an item, then click a box</h4>');
    var bankChips = el('div','bank'); bank.appendChild(bankChips);
    holder.appendChild(bank);
    var chipEls = {};
    itemOrder.forEach(function(ii){
      var c = el('button','bank-chip', items[ii].t);
      c.draggable = true;
      c.addEventListener('dragstart', function(ev){ state.activeI = ii; try{ev.dataTransfer.setData('text/plain', String(ii));}catch(e){} });
      c.addEventListener('click', function(){
        if (state.done) return;
        if (state.place[ii]!==undefined){ /* remove back to bank */
          var b = state.place[ii]; state.place[ii]=undefined;
          binChipEls[b].removeChild(chipEls[ii]);
          bankChips.appendChild(chipEls[ii]);
          chipEls[ii].classList.remove('used');
          fire(); return;
        }
        state.activeI = ii;
        Object.keys(chipEls).forEach(function(k){ chipEls[k].classList.remove('active'); });
        chipEls[ii].classList.add('active');
      });
      bankChips.appendChild(c); chipEls[ii]=c;
    });
    var binWrap = el('div','bins'); holder.appendChild(binWrap);
    var binEls=[], binChipEls=[];
    bins.forEach(function(bn,bi){
      var d = el('div','bin','<h4>'+bn.name+'</h4><div class="bin-drop"><span class="bin-empty">drop here</span></div>');
      d.addEventListener('dragover', function(ev){ ev.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
      d.addEventListener('drop', function(ev){ ev.preventDefault(); d.classList.remove('over'); if(state.activeI>=0&&!state.done){ place(state.activeI, bi); } });
      d.addEventListener('click', function(){ if(state.activeI>=0&&!state.done){ place(state.activeI, bi); } });
      binWrap.appendChild(d); binEls.push(d); binChipEls.push(d.querySelector('.bin-drop'));
    });
    function place(ii, bi){
      if (state.place[ii]!==undefined){
        var ob = state.place[ii];
        binChipEls[ob].removeChild(chipEls[ii]);
      } else {
        bankChips.removeChild(chipEls[ii]);
      }
      state.place[ii]=bi;
      chipEls[ii].classList.remove('active','used');
      binChipEls[bi].appendChild(chipEls[ii]);
      state.activeI=-1;
      fire();
    }
    function allPlaced(){ for(var i=0;i<items.length;i++){ if(state.place[i]===undefined) return false; } return true; }
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done && allPlaced(); },
      grade: function(){
        var H=0,W=0,rowsF=[];
        items.forEach(function(it,i){
          var ok = state.place[i]===it.bin;
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: it.t+' &rarr; you placed it in &ldquo;'+bins[state.place[i]].name+'&rdquo;'+(ok?'':(' &mdash; it belongs in &ldquo;'+bins[it.bin].name+'&rdquo;'))});
        });
        return {H:H,W:W,N:items.length,rows:rowsF};
      },
      disable: function(){ state.done=true; Object.keys(chipEls).forEach(function(k){ chipEls[k].disabled=true; }); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- fill in the blanks from a word bank -------- */
  fill: function(ex, holder){
    var f = ex.fill;
    var state = { vals:{}, activeB:-1, done:false };
    var textEl = el('div',null);
    var blankEls = [];
    var html = '';
    f.segments.forEach(function(seg,i){
      html += seg;
      if (i < f.answers.length){
        html += '<button type="button" class="blank" data-b="'+i+'" aria-label="Blank '+(i+1)+'. Click, then pick a word.">_____</button>';
      }
    });
    textEl.innerHTML = html;
    holder.appendChild(textEl);
    f.answers.forEach(function(_,i){
      var be = textEl.querySelector('[data-b="'+i+'"]');
      be.addEventListener('click', function(){
        if (state.done) return;
        if (state.vals[i]){ /* clear */
          bankEls[state.vals[i]].classList.remove('used');
          state.vals[i]=undefined; be.textContent='_____'; be.classList.remove('filled');
          fire(); return;
        }
        state.activeB = i;
        blankEls.forEach(function(x){ x.classList.remove('active'); });
        be.classList.add('active');
      });
      blankEls.push(be);
    });
    var bank = el('div',null,'<h4 style="margin:12px 0 6px;color:var(--text-secondary);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;">Word bank (shuffled)</h4>');
    var bankChips = el('div','bank'); bank.appendChild(bankChips); holder.appendChild(bank);
    var bankOrder = shuffle(f.bank.map(function(_,i){return i;}));
    var bankEls=[];
    bankOrder.forEach(function(bi){
      var word = f.bank[bi];
      var c = el('button','bank-chip', word);
      c.addEventListener('click', function(){
        if (state.done || state.activeB<0 || c.classList.contains('used')) return;
        if (state.vals[state.activeB]!==undefined){
          bankEls[state.vals[state.activeB]].classList.remove('used');
        }
        state.vals[state.activeB]=bi;
        c.classList.add('used');
        var be = blankEls[state.activeB];
        be.textContent = word; be.classList.add('filled'); be.classList.remove('active');
        state.activeB=-1;
        fire();
      });
      bankChips.appendChild(c); bankEls.push(c);
    });
    function allFilled(){ for(var i=0;i<f.answers.length;i++){ if(state.vals[i]===undefined) return false; } return true; }
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    function matches(i){
      var word = f.bank[state.vals[i]];
      var acc = (f.accept && f.accept[i]) || [f.answers[i]];
      return acc.some(function(a){ return norm(a)===norm(word); });
    }
    var ctl = {
      canCheck: function(){ return !state.done && allFilled(); },
      grade: function(){
        var H=0,W=0,rowsF=[];
        f.answers.forEach(function(ans,i){
          var ok = matches(i);
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: 'Blank '+(i+1)+': you wrote &ldquo;'+f.bank[state.vals[i]]+'&rdquo;. Expected: &ldquo;'+ans+'&rdquo;.'});
        });
        return {H:H,W:W,N:f.answers.length,rows:rowsF};
      },
      disable: function(){ state.done=true; bankEls.concat(blankEls).forEach(function(b){ b.disabled=true; }); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- ordering / ranking -------- */
  order: function(ex, holder){
    var isRank = ex.type==='rank';
    var correct = ex.order.items; /* stored in correct order */
    var disp = shuffledDifferent(correct.map(function(_,i){return i;}));
    var state = { done:false };
    var list = el('div','ord-list'); holder.appendChild(list);
    if (isRank && ex.order.rankLabels){
      holder.insertBefore(el('p','muted small', esc(ex.order.rankLabels)), list);
    }
    function render(){
      list.innerHTML='';
      disp.forEach(function(itemIdx, pos){
        var row = el('div','ord-item');
        row.draggable = true;
        row.innerHTML = '<span class="rank-no">'+(pos+1)+'</span><span class="ord-t">'+correct[itemIdx]+'</span>';
        var btns = el('div','ord-btns');
        var up = el('button',null,'&uarr;'); up.type='button'; up.setAttribute('aria-label','Move item up');
        up.addEventListener('click', function(){ if(state.done)return; if(pos>0){ var t=disp[pos-1]; disp[pos-1]=disp[pos]; disp[pos]=t; render(); fire(); } });
        var dn = el('button',null,'&darr;'); dn.type='button'; dn.setAttribute('aria-label','Move item down');
        dn.addEventListener('click', function(){ if(state.done)return; if(pos<disp.length-1){ var t=disp[pos+1]; disp[pos+1]=disp[pos]; disp[pos]=t; render(); fire(); } });
        btns.appendChild(up); btns.appendChild(dn);
        row.appendChild(btns);
        row.addEventListener('dragstart', function(ev){ dragFrom=pos; row.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} });
        row.addEventListener('dragover', function(ev){ ev.preventDefault(); });
        row.addEventListener('drop', function(ev){ ev.preventDefault(); if(dragFrom>=0&&dragFrom!==pos){ var it=disp.splice(dragFrom,1)[0]; disp.splice(pos,0,it); render(); fire(); } dragFrom=-1; });
        row.addEventListener('dragend', function(){ row.classList.remove('dragging'); });
        list.appendChild(row);
      });
    }
    var dragFrom=-1;
    render();
    function fire(){ if (ctl.onChange) ctl.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done; },
      grade: function(){
        var H=0,W=0,rowsF=[];
        disp.forEach(function(itemIdx,pos){
          var ok = itemIdx===pos;
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: '&ldquo;'+correct[itemIdx]+'&rdquo; is in position '+(pos+1)+(isRank?' of the ranking':' of the sequence')+(ok?'':(' &mdash; correct position '+(itemIdx+1)))});
        });
        return {H:H,W:W,N:disp.length,rows:rowsF};
      },
      disable: function(){ state.done=true; Array.prototype.forEach.call(list.querySelectorAll('button'),function(b){b.disabled=true;}); },
      onChange: null, mode:'single'
    };
    return ctl;
  },

  /* -------- alert triage queue -------- */
  triage: function(ex, holder){
    var acts = ex.triage.actions, alerts = ex.triage.alerts;
    var state = { pick:{}, done:false };
    var ctlRef = {};
    alerts.forEach(function(a,ai){
      var card = el('div','alert-card');
      card.innerHTML = '<div class="a-title"><span class="a-id">ALERT '+(ai+1)+'</span>'+a.title+'</div><div class="muted small">'+a.body+'</div>';
      var rowA = el('div','actions');
      var actBtns=[];
      acts.forEach(function(an,bi){
        var b = el('button','act', an);
        b.addEventListener('click', function(){
          if (state.done) return;
          state.pick[ai]=bi;
          actBtns.forEach(function(x){ x.classList.remove('picked'); x.setAttribute('aria-pressed','false'); });
          b.classList.add('picked'); b.setAttribute('aria-pressed','true');
          fire();
        });
        rowA.appendChild(b); actBtns.push(b);
      });
      card.appendChild(rowA); holder.appendChild(card);
    });
    function allPicked(){ for(var i=0;i<alerts.length;i++){ if(state.pick[i]===undefined) return false; } return true; }
    function fire(){ if (ctlRef.onChange) ctlRef.onChange(); }
    var ctl = {
      canCheck: function(){ return !state.done && allPicked(); },
      grade: function(){
        var H=0,W=0,rowsF=[];
        alerts.forEach(function(a,i){
          var ok = state.pick[i]===a.correct;
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: 'Alert '+(i+1)+' ('+a.title+'): you chose &ldquo;'+acts[state.pick[i]]+'&rdquo;. '+a.why});
        });
        return {H:H,W:W,N:alerts.length,rows:rowsF};
      },
      disable: function(){ state.done=true; Array.prototype.forEach.call(holder.querySelectorAll('button'),function(b){b.disabled=true;}); },
      onChange: null, mode:'single'
    };
    ctlRef.onChange = function(){ if (ctl.onChange) ctl.onChange(); };
    return ctl;
  },

  /* -------- log viewer with filter box -------- */
  logview: function(ex, holder){
    var lv = ex.logview;
    var state = { picked:-1, done:false };
    var box = el('div','logview');
    var bar = el('div','lv-bar');
    var inp = el('input'); inp.type='text'; inp.placeholder = lv.filterHint || 'Type to filter lines...';
    inp.setAttribute('aria-label','Filter the log lines');
    var count = el('span','lv-count','');
    bar.appendChild(inp); bar.appendChild(count); box.appendChild(bar);
    var linesBox = el('div','lv-lines');
    box.appendChild(linesBox); holder.appendChild(box);
    function renderLines(){
      var q = norm(inp.value);
      linesBox.innerHTML='';
      var shown=0;
      lv.lines.forEach(function(l){
        if (q && norm(l).indexOf(q)===-1) return;
        shown++;
        linesBox.appendChild(el('span','lv-line', hlMono(l)));
      });
      count.textContent = shown+' / '+lv.lines.length+' lines';
    }
    inp.addEventListener('input', renderLines);
    renderLines();
    holder.appendChild(el('div',null,'<h4 style="margin:14px 0 2px;color:var(--text-secondary);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;">Answer</h4>'));
    var ansHolder = el('div'); holder.appendChild(ansHolder);
    var qcmCtl = WIDGETS.qcm(ex, ansHolder, lv.options);
    var ctl = {
      canCheck: function(){ return qcmCtl.canCheck(); },
      grade: function(){ return qcmCtl.grade(); },
      disable: function(){ qcmCtl.disable(); inp.disabled=true; },
      onChange: null, mode:'single'
    };
    var fire = function(){ if (ctl.onChange) ctl.onChange(); };
    qcmCtl.onChange = fire;
    return ctl;
  },

  /* -------- branching decision path -------- */
  branch: function(ex, holder){
    var br = ex.branch;
    var state = { step:0, picks:[], done:false };
    var ctlRef = {};
    var stepScenario = $('blk-scenario').querySelector('.blk-body');
    var qBody = $('blk-question').querySelector('.blk-body');
    var ansHolder = holder;
    function renderStep(){
      var stp = br.steps[state.step];
      /* scenario continuation */
      var cont = stepScenario.querySelector('.step-cont');
      if (cont) cont.remove();
      cont = el('div','art step-cont');
      cont.appendChild(el('span','art-label','WHAT HAPPENS NEXT &mdash; STEP '+(state.step+1)));
      cont.appendChild(el('div','art-body', stp.scenario));
      stepScenario.appendChild(cont);
      /* question */
      var chip = qBody.querySelector('.step-chip');
      if (chip) chip.textContent = 'STEP '+(state.step+1)+' OF '+br.steps.length;
      var qt = qBody.querySelector('.q-text');
      qt.innerHTML = stp.question;
      /* options */
      ansHolder.innerHTML='';
      state.picked = -1;
      var rows=[];
      stp.options.forEach(function(o,i){
        var b = mkOptRow(String.fromCharCode(65+i)+'.', o, function(btn){
          if (state.done) return;
          state.picked = i;
          rows.forEach(function(x){ x.classList.remove('selected'); setOptState(x,''); });
          btn.classList.add('selected'); setOptState(btn,'&#9679; Selected');
          fire();
        });
        ansHolder.appendChild(b); rows.push(b);
      });
      state._rows = rows;
    }
    function fire(){ if (ctlRef.onChange) ctlRef.onChange(); }
    renderStep();
    var ctl = {
      canCheck: function(){ return !state.done && state.picked>=0; },
      mode: (state.step < br.steps.length-1) ? 'branch-step' : 'single',
      advance: function(){
        state.picks[state.step] = state.picked;
        state.step++;
        renderStep();
        ctl.mode = (state.step < br.steps.length-1) ? 'branch-step' : 'single';
        if (ctl.mode==='single'){ var bc=$('btn-check'); if(bc) bc.innerHTML='Check answer'; }
      },
      grade: function(){
        state.picks[state.step] = state.picked;
        var H=0,W=0,rowsF=[];
        br.steps.forEach(function(stp,i){
          var pick = state.picks[i];
          var ok = pick===stp.correct;
          if (ok) H++; else W++;
          rowsF.push({state: ok?'ok':'bad', text: 'Step '+(i+1)+': you chose &ldquo;'+stp.options[pick]+'&rdquo;. '+stp.why});
        });
        return {H:H,W:W,N:br.steps.length,rows:rowsF};
      },
      disable: function(){ state.done=true; (state._rows||[]).forEach(function(b){ b.disabled=true; }); },
      onChange: null
    };
    ctlRef.onChange = function(){ if (ctl.onChange) ctl.onChange(); };
    return ctl;
  }
};
WIDGETS.rank = WIDGETS.order; /* rank shares the ordering widget, with rank badges */

/* ============================ init ============================ */
function init(){
  document.body.setAttribute('data-sev', META.difficulty);
  initIntro();
  var bPause = $('btn-pause');
  if (bPause) bPause.addEventListener('click', manualPause);
  var bResume = $('btn-resume');
  if (bResume) bResume.addEventListener('click', manualResume);
  var bHint = $('btn-hint');
  if (bHint) bHint.addEventListener('click', function(){ if (S.current>=0) useHint(exerciseByIdx(S.current)); });
  var bSk2 = $('btn-skip');
  if (bSk2) bSk2.addEventListener('click', skipCurrent);
  var bSk = $('h-skip-pool');
  if (bSk) bSk.addEventListener('click', function(){ if(!S.resultsShown) openReview(false); });
  var bFs = $('review-submit');
  if (bFs) bFs.addEventListener('click', function(){
    if (T.state==='PAUSED_AUTO_CHECK'){ timerSetState('RUNNING'); }
    showResults();
  });
  var bBack = $('review-back');
  if (bBack) bBack.addEventListener('click', backToExam);
  var bRt = $('btn-retake');
  if (bRt) bRt.addEventListener('click', retake);
  timerInit();
  renderHeader();
}

function manualPause(){
  if (T.state==='RUNNING' || T.state==='PAUSED_AUTO_CHECK'){
    T.prev = T.state;
    timerSetState('PAUSED_MANUAL');
    $('exercise-area').style.display='none';
    $('pause-overlay').style.display='block';
  }
}
function manualResume(){
  if (T.state!=='PAUSED_MANUAL') return;
  $('pause-overlay').style.display='none';
  $('exercise-area').style.display='block';
  timerSetState(T.prev==='PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}

/* handshake */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  if (event.data.username) { S.learner = String(event.data.username); }
});

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else { init(); }
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
