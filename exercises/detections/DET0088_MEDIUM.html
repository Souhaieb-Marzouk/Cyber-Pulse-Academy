<script id="cm-data" type="application/json">{"meta": {"topicId": "det0088", "batch": 2, "title": "DET0088 Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002) — MEDIUM", "difficulty": "medium", "questionCount": 15, "estimatedMinutes": 30, "passMark": 70, "objectId": "DET0088", "objectName": "Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002)"}, "sev": "MEDIUM", "passMark": 70, "timerSeconds": 1800, "intro": {"learn": "<p>This exam trains <strong>DET0088</strong>, the ATT&amp;CK <strong>Detection Strategy</strong> for <strong>Backup Software Discovery (T1518.002)</strong>. A detection strategy is a documented plan that tells defenders how to see one attacker behaviour. Here the behaviour is: an attacker lists or reads the backup software and its configuration on Windows, Linux, or macOS hosts.</p>\n<p>Why does that matter in real work? Backup products such as Veeam, Acronis, or CrashPlan often run with powerful service accounts, and they are the target attackers must neutralise before ransomware. At the <strong>MEDIUM</strong> level you combine two ideas at once: you read a log line <em>and</em> decide which analytic (AN0240 Windows, AN0241 Linux, AN0242 macOS) covers it; you see a suspicious command <em>and</em> apply a tuning element such as <strong>UserContextScope</strong> or <strong>SuspiciousParentProcesses</strong>.</p>\n<p>You will practise the daily tasks of a <strong>SOC analyst</strong> (triage with context), a <strong>detection engineer</strong> (map log channels to analytics, tune with the mutable elements), and a <strong>CTI analyst</strong> (name the technique correctly in a report). The artefacts are realistic: 4688 process creation events, Sysmon registry and file events, auditd lines, and the macOS unified log. Every exercise gives you what you need &mdash; you only have to connect the two halves.</p>", "keywords": [{"group": "Analytics and platforms", "items": ["AN0240 — Windows", "AN0241 — Linux", "AN0242 — macOS", "One analytic per operating system"]}, {"group": "Detection logic", "items": ["Backup vendor keywords in command lines", "Parent-child process lineage", "Scripting tools and LOLBins", "Service, directory, and registry enumeration"]}, {"group": "Data components and channels", "items": ["DC0032 Process Creation — WinEventLog:Security EID 4688", "DC0063 Registry Key Modification — Sysmon EID 13/14", "DC0039 File Creation — Sysmon EID 11", "auditd:SYSCALL (execve)", "macos:unifiedlog"]}, {"group": "Mutable elements (tuning)", "items": ["KnownBackupVendors", "UserContextScope", "SuspiciousParentProcesses"]}, {"group": "False positives and why backups matter", "items": ["Admins legitimately query backup software", "Service accounts vs interactive users", "Backup services run privileged", "Follow-on: Inhibit System Recovery (T1490)"]}], "how": "<ul>\n<li><strong>Pass mark:</strong> 70%. Partial credit applies: multi-item exercises give (H &minus; W) / N of the point.</li>\n<li><strong>Exercise types in this file:</strong> multiple choice, multi-select with partial credit, matching, drag and drop, word-bank fill-in, log triage with a filter box, alert ranking, and a two-step decision.</li>\n<li><strong>Timer:</strong> 30 minutes for 15 exercises. The <strong>Pause</strong> button hides the exercise and stops the timer. Pressing <strong>Check</strong> auto-pauses the timer while you study the feedback; it resumes on <strong>Next</strong>.</li>\n<li><strong>Hints and skips:</strong> one hint per exercise costs 10% of that exercise's credit. Skip is free; skipped-and-never-answered exercises are excluded from the score, and you may return to them while time remains.</li>\n</ul>\n<p>Press <strong>Start exam</strong> when you are ready.</p>"}, "exercises": [{"id": "M01", "type": "qcm", "summary": "Route one 4688 event to the right analytic", "scenario": [{"label": "ARTEFACT 1 — SIEM event", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "NewProcessName: C:\\Windows\\System32\\reg.exe", "CommandLine: reg query \"HKLM\\SOFTWARE\\Veeam\"", "User: CORP\\jsmith   Host: WS-4417"]}], "question": "Which DET0088 analytic consumes this event?", "hint": "Match the log channel to the platform first, then to the analytic.", "explain": "<p>The channel is <strong>WinEventLog:Security</strong> with event 4688 &mdash; that is <strong>Windows</strong> process creation telemetry. Windows telemetry belongs to <strong>AN0240</strong>. AN0241 consumes auditd (Linux) and AN0242 consumes the macOS unified log, so neither fits. The vendor keyword Veeam in the command line is exactly what AN0240 looks for.</p>", "options": ["AN0242 (macOS)", "AN0240 (Windows)", "AN0241 (Linux)", "None — 4688 is not in DET0088"], "answer": 1}, {"id": "M02", "type": "multi", "summary": "Pick the three signals AN0240 uses", "scenario": [{"label": "ARTEFACT 1 — Windows Security log, event 4688", "kind": "mono", "lines": ["EventCode=4688", "NewProcessName: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "CommandLine: powershell.exe -c \"Get-WmiObject Win32_Product | Where-Object {$_.Name -like '*Veeam*'}\"", "ParentImage: C:\\Windows\\System32\\cmd.exe", "User: CORP\\jsmith (interactive)  Host: WS-4417"]}], "question": "Select the THREE signals in this event that AN0240’s logic uses.", "hint": "Count the fields the analytic names: command line, parent, vendor.", "explain": "<p>AN0240 fires on backup-vendor keywords in command lines, on lineage through scripting tools, and on enumeration behaviour. Here all three are present: the <strong>Veeam</strong> keyword, <strong>PowerShell</strong> as the process, and <strong>WMI enumeration</strong> of installed software. The event has no destination IP, no file hash field used by the analytic, and the channel is WinEventLog:Security, not Sysmon.</p>", "options": ["The command line contains the vendor name Veeam", "The process is PowerShell, a scripting tool", "The command enumerates installed software via WMI", "The event contains a destination IP address", "The event contains a binary file hash", "The channel is WinEventLog:Sysmon"], "answers": [0, 1, 2]}, {"id": "M03", "type": "dnd", "summary": "Map each log channel to its analytic", "scenario": [{"label": "ARTEFACT 1 — Three channels from your log shipper", "kind": "prose", "text": "Your log shipper delivers three channels to the SIEM. Each channel feeds exactly one DET0088 analytic. Route them."}], "question": "Drag each log channel onto the analytic that reads it.", "hint": "4688 is Windows Security; SYSCALL is auditd; unifiedlog is Apple.", "explain": "<p><strong>WinEventLog:Security (4688)</strong> is Windows process creation &mdash; AN0240. <strong>auditd:SYSCALL with execve</strong> records program executions on Linux &mdash; AN0241. <strong>macos:unifiedlog</strong> is the Apple system log &mdash; AN0242. Routing channels correctly is the first check a detection engineer does when an analytic produces no alerts at all.</p>", "slots": [{"id": "a", "label": "AN0240 (Windows)"}, {"id": "b", "label": "AN0241 (Linux)"}, {"id": "c", "label": "AN0242 (macOS)"}], "items": [{"id": "i1", "label": "WinEventLog:Security EID 4688", "slot": "a"}, {"id": "i2", "label": "auditd:SYSCALL (execve)", "slot": "b"}, {"id": "i3", "label": "macos:unifiedlog", "slot": "c"}]}, {"id": "M04", "type": "fill", "summary": "Tune AN0240 with the three mutable elements", "scenario": [{"label": "ARTEFACT 1 — Tuning ticket DET-2214", "kind": "prose", "text": "Ticket: \"AN0240 fires too often on our admin jump hosts. Tune it using the three mutable elements from the ATT&amp;CK page.\" Complete the tuning summary for the ticket."}], "question": "Fill the three blanks with the tuning terms.", "hint": "The three mutable elements on the AN0240 card are the words you need: focus, parents, vendors.", "explain": "<p>The AN0240 card names three mutable elements. <strong>UserContextScope</strong>: focus on low-privilege or interactive users, not service accounts (backup jobs legitimately run as service accounts). <strong>SuspiciousParentProcesses</strong>: flag scripting tools such as PowerShell and cmd.exe as parents. <strong>KnownBackupVendors</strong>: keep the vendor list current so new products are matched. Filling any of the three wrongly weakens the rule in a different way.</p>", "template": "Focus UserContextScope on {0} user contexts instead of service accounts, set SuspiciousParentProcesses to flag {1} parents such as PowerShell or cmd.exe, and keep the {2} list current with new backup products.", "blanks": ["low-privilege", "scripting tools", "KnownBackupVendors"], "bank": ["low-privilege", "domain-admin", "scripting tools", "printer drivers", "KnownBackupVendors", "UserContextScope"]}, {"id": "M05", "type": "qcm", "summary": "Linux find by a web-service user", "scenario": [{"label": "ARTEFACT 1 — auditd SYSCALL line, host WEB-03", "kind": "mono", "lines": ["auditd:SYSCALL  execve", "user=www-data  ppid=python3", "cmd=find /etc /opt /var -iname \"*backup*\"", "host=WEB-03 (public web server)"]}], "question": "Which statement is the best assessment?", "hint": "First ask which OS produced the event, then read the user and the parent.", "explain": "<p>The event comes from <strong>auditd on Linux</strong>, so the analytic is <strong>AN0241</strong>. It matches the behaviour: find sweeping system directories for backup keywords. It is suspicious because <strong>www-data is a web-service user</strong> &mdash; it should never hunt for backups &mdash; and the parent is <strong>python3</strong>, an interpreter. AN0240 is Windows and AN0242 is macOS, so both are wrong; and find is exactly one of the tools AN0241 watches.</p>", "options": ["AN0241 — matches; suspicious because www-data plus an interpreter parent hunts backups", "AN0240 — matches; reg-style discovery is visible in auditd too", "AN0242 — matches; find also runs on macOS", "None — find is never watched by DET0088"], "answer": 0}, {"id": "M06", "type": "match", "summary": "Four Linux commands and what they reveal", "scenario": [{"label": "ARTEFACT 1 — AN0241 hunt notes", "kind": "prose", "text": "AN0241 watches CLI tools that reveal backup agents or their configuration. Know what each command tells the attacker."}], "question": "Match each command to what it reveals about backups.", "hint": "One command asks the package database; another asks systemd; one reads process lists; one searches files.", "explain": "<p><strong>dpkg -l | grep -i veeam</strong> asks the package database whether Veeam is installed. <strong>systemctl list-units | grep -i backup</strong> lists running services, where backup agents appear. <strong>ps aux | grep -i duplicity</strong> shows running processes. <strong>grep -r backup /etc/</strong> finds configuration files by content. AN0241 watches all four classes: package, service, process, and file.</p>", "pairs": [["dpkg -l | grep -i veeam", "installed backup packages"], ["systemctl list-units | grep -i backup", "running backup services"], ["ps aux | grep -i duplicity", "running backup processes"], ["grep -r backup /etc/", "backup config file paths"]]}, {"id": "M07", "type": "triage", "summary": "Triage four highlighted 4688 lines against AN0240", "scenario": [{"label": "ARTEFACT 1 — SIEM log panel (use the filter box)", "kind": "mono", "lines": []}], "question": "For each highlighted row decide: does the line match AN0240’s watched behaviour (backup-software discovery on Windows)?", "hint": "A generic command without a backup vendor name is not what AN0240 targets.", "explain": "<p><strong>Row 1 matches:</strong> reg query reads the Veeam registry key &mdash; vendor keyword plus registry enumeration. <strong>Row 2 does not:</strong> tasklist /svc lists services but names no backup vendor; by itself it is generic. <strong>Row 4 does not:</strong> net group enumerates domain admins &mdash; account discovery, not backup discovery. <strong>Row 6 does not:</strong> netstat shows network state. Rows 3 and 5 are the labelled examples of matching behaviour: a WMI query filtered to Acronis, and a Sysmon registry event on a Veeam key.</p>", "log": [{"t": "4688 | reg query \"HKLM\\SOFTWARE\\Veeam\" | user=jsmith | WS-4417", "flag": true, "correct": 0}, {"t": "4688 | tasklist /svc | user=jsmith | WS-4417", "flag": true, "correct": 1}, {"t": "4688 | Get-WmiObject Win32_Product | ? Name -like \"*Acronis*\" | user=adm-rkay", "flag": false, "correct": 0}, {"t": "4688 | net group \"Domain Admins\" /domain | user=jsmith", "flag": true, "correct": 1}, {"t": "Sysmon 13 | EventType=SetValue | TargetObject: HKLM\\SOFTWARE\\Veeam\\Agent\\LastUpdate | img: veeamservice.exe", "flag": false, "correct": 0}, {"t": "4688 | netstat -ano | user=svc_scan", "flag": true, "correct": 1}], "verdictOptions": ["Matches AN0240", "Does not match"]}, {"id": "M08", "type": "multi", "summary": "Why backup discovery comes before impact", "scenario": [{"label": "ARTEFACT 1 — CTI briefing slide", "kind": "prose", "text": "Slide title: \"Backup Software Discovery is a ransomware precursor.\" Two bullet points are missing. Pick the two that belong on the slide."}], "question": "Select the TWO reasons backup software discovery often comes just before ransomware impact.", "hint": "Think about the attacker’s next step: Inhibit System Recovery (T1490).", "explain": "<p>Backups reduce the attacker’s leverage, so finding them is step one of stopping them (<strong>T1490 Inhibit System Recovery</strong>). Backup services also <strong>run with high privileges and hold credentials</strong>, which attackers can reuse. Backups do not change boot order, do not encrypt DNS, and do not block the internet &mdash; those are filler.</p>", "options": ["Backups reduce ransomware leverage, so attackers locate them first", "Backup services often run privileged and hold reusable credentials", "Backups change the boot order of the server", "Backup tools encrypt DNS traffic by default", "Backup software always blocks internet access"], "answers": [0, 1]}, {"id": "M09", "type": "decision", "summary": "Two-step triage of a Veeam registry alert", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-4471", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "User: CORP\\jsmith (interactive)  Host: WS-4417", "ParentImage: C:\\Windows\\System32\\cmd.exe  (spawned from update.bat)", "CommandLine: reg query \"HKLM\\SOFTWARE\\Veeam\""]}, {"label": "ARTEFACT 2 — Context", "kind": "prose", "text": "jsmith is a finance user, not an admin. No other alerts on this host today."}], "question": "Work the two triage steps, then press Check.", "hint": "AN0240 wants vendor keywords plus parent-child lineage; then verify the human context before deciding.", "explain": "<p><strong>Step 1:</strong> the event fits AN0240 &mdash; a reg query against a backup vendor key, launched from a shell parent; 4688 does show command lines, and auditd is Linux-only. <strong>Step 2:</strong> the correct next action is to verify the user’s role and what launched the .bat; reimaging without evidence is destructive, and closing without checks loses a possible true positive.</p>", "steps": [{"q": "Does this event fit AN0240’s watched behaviour?", "opts": ["Yes — vendor registry query from a shell parent, visible in 4688", "No — 4688 cannot contain registry queries", "No — registry events need auditd on Linux"], "ans": 0, "why": "4688 records the full command line, and the query names a backup vendor with a shell parent — the AN0240 pattern."}, {"q": "What is the best next action?", "opts": ["Reimage WS-4417 immediately", "Check jsmith’s role and what launched update.bat, then decide", "Close as false positive without any check"], "ans": 1, "why": "A finance user querying Veeam from a batch file needs verification — context first, action second."}]}, {"id": "M10", "type": "qcm", "summary": "What Sysmon EID 13 records", "scenario": [{"label": "ARTEFACT 1 — AN0240 log sources card", "kind": "mono", "lines": ["Data Component: Windows Registry Key Modification (DC0063)", "Channel: WinEventLog:Sysmon  EventCode=13, 14"]}], "question": "What does Sysmon EventCode 13 record?", "hint": "One of the four options is about the registry; only one is about changing a value.", "explain": "<p>Sysmon <strong>EID 13 records a registry value being set (changed)</strong>; EID 14 records a registry object rename. Together they feed DC0063, the registry component AN0240 uses for backup-software registry paths. Process creation is EID 1 (or 4688 in the Security log, DC0032), file creation is EID 11 (DC0039), and network connections are EID 3.</p>", "options": ["A process was created", "A network connection started", "A registry value was set (changed)", "A file was created"], "answer": 2}, {"id": "M11", "type": "fill", "summary": "UserContextScope in one sentence", "scenario": [{"label": "ARTEFACT 1 — Detection-engineering glossary task", "kind": "prose", "text": "You are documenting AN0240’s mutable elements for your team wiki. Complete the UserContextScope entry."}], "question": "Fill the two blanks.", "hint": "Backup jobs normally run as service accounts — that is the context to filter away.", "explain": "<p><strong>UserContextScope</strong> focuses the analytic on low-privilege or interactive user contexts, and away from <strong>service accounts</strong>. The reason: backup services legitimately run as service accounts all day, so queries from those accounts are expected noise, while an interactive low-privilege user poking at backup software is unusual and worth alerting on.</p>", "template": "UserContextScope tells AN0240 to focus on {0} user contexts rather than {1} accounts.", "blanks": ["low-privilege or interactive", "service"], "bank": ["low-privilege or interactive", "service", "administrator", "disabled", "machine"]}, {"id": "M12", "type": "order", "summary": "Rank four backup-discovery alerts", "scenario": [{"label": "ARTEFACT 1 — Monday morning queue", "kind": "prose", "text": "Four DET0088 alerts wait in the queue. Rank them so the most likely true positive gets worked first."}], "question": "Drag to rank from 1 (work first) to 4 (work last).", "hint": "Vendor keyword plus unusual lineage beats a generic listing; documented routine context is lowest.", "explain": "<p><strong>1 — DC-01, brand-new service account running reg query acronis:</strong> critical host, never-seen identity, vendor keyword. <strong>2 — HR workstation, winword spawning cmd with tasklist filtered to veeam:</strong> Office-to-shell lineage is a classic intrusion path with a vendor keyword. <strong>3 — admin workstation, Get-ChildItem without a vendor name:</strong> generic listing, no backup keyword. <strong>4 — backupadmin weekly script on BK-01:</strong> routine and expected on the backup host itself.</p>", "rankLabel": "Rank by likelihood of a true backup-discovery event (1 = highest).", "items": ["DC-01: brand-new service account runs reg query acronis", "HR workstation: winword spawns cmd, tasklist filtered to veeam", "Admin workstation: Get-ChildItem of Program Files, no vendor name", "BK-01: backupadmin runs the weekly report script"], "correct": [0, 1, 2, 3]}, {"id": "M13", "type": "qcm", "summary": "The classic SuspiciousParentProcesses example", "scenario": [{"label": "ARTEFACT 1 — Wiki stub", "kind": "prose", "text": "Your wiki page on AN0240 says: \"SuspiciousParentProcesses flags execution from scripting tools, interpreters, or LOLBins.\" A picture of the classic parent-child chain is missing."}], "question": "Which parent-child chain is the classic AN0240 suspicious example?", "hint": "Scripting hosts and Office apps launching shells is the pattern; system pairs are not.", "explain": "<p><strong>winword.exe spawning cmd.exe that runs discovery syntax</strong> is the textbook suspicious lineage: an Office document launched a shell, which then enumerated &mdash; exactly what <strong>SuspiciousParentProcesses</strong> exists to flag. The other three pairs (explorer to notepad, services to svchost, winlogon to userinit) are normal Windows behaviour.</p>", "options": ["services.exe spawns svchost.exe -k netsvcs", "winword.exe spawns cmd.exe running discovery syntax", "winlogon.exe spawns userinit.exe", "explorer.exe spawns notepad.exe"], "answer": 1}, {"id": "M14", "type": "multi", "summary": "Two problems with a keyword-only rule", "scenario": [{"label": "ARTEFACT 1 — Chat message from a colleague", "kind": "prose", "text": "Colleague: \"Simplify AN0240 — just alert on ANY command line containing the word backup. One keyword, done.\" Your lead asks you to review the proposal."}], "question": "Select the TWO main problems with this design.", "hint": "Two failure directions: too many alerts, and missed vendor names.", "explain": "<p>A keyword-anywhere rule <strong>floods analysts</strong> with benign matches &mdash; backup jobs, scripts, and file paths legitimately contain the word everywhere. It also <strong>misses vendor-named discovery</strong>: <code>reg query HKLM\\SOFTWARE\\Veeam</code> never says \"backup\". The other options are wrong: 4688 does log command lines, registry key paths can be keyword-matched, and AN0240 is a Windows analytic.</p>", "options": ["It floods analysts with benign matches from jobs, scripts, and paths", "It misses vendor-named discovery that never says \"backup\"", "Command lines are never logged on Windows", "Registry events cannot be keyword-matched at all", "AN0240 only runs on macOS"], "answers": [0, 1]}, {"id": "M15", "type": "fill", "summary": "Name the objects in a CTI report", "scenario": [{"label": "ARTEFACT 1 — Draft CTI report", "kind": "prose", "text": "You draft the executive summary. The ATT&amp;CK names must be exact &mdash; the customer’s detection team will copy the IDs into their tooling."}], "question": "Fill the three blanks with the correct ATT&CK terms.", "hint": "The technique ID starts with T1518; the tactic is where attackers look around; the telemetry is process creation.", "explain": "<p>The report must name <strong>T1518.002 (Backup Software Discovery)</strong>, place it in the <strong>Discovery</strong> tactic, and cite <strong>process creation</strong> telemetry &mdash; the 4688 events that carried the discovery commands. T1490 is the follow-on impact technique, not this behaviour; Impact is the wrong tactic; DNS logs are not what carried it.</p>", "template": "During the intrusion the actor enumerated backup software (ATT&CK {0}), a {1}-tactic behaviour, visible in {2} telemetry from the affected host.", "blanks": ["T1518.002", "Discovery", "process creation"], "bank": ["T1518.002", "T1490", "Discovery", "Impact", "process creation", "DNS query logs"]}]}</script>
<script>
(function(){
'use strict';
var EXAM = JSON.parse(document.getElementById('cm-data').textContent);
var LETTERS = ['A','B','C','D','E','F','G'];
var SEVCLASS = {'EASY':'sev-easy','MEDIUM':'sev-medium','HARD':'sev-hard','EXTREMELY HARD':'sev-extreme'};
function $(id){return document.getElementById(id);}
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function scoreExercise(H,W,N){ if(N<=0){return 0;} var c=(H-W)/N; if(c<0){c=0;} if(c>1){c=1;} return Math.round(c*100)/100; }
function disableAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('button,select,input'),function(x){x.disabled=true;});
}
var S = null;
function cur(){return S.order[S.idx];}
function idOf(i){return S.order[i].id;}
function answeredCount(){return Object.keys(S.credits).length;}
function creditSum(){var s=0;Object.keys(S.credits).forEach(function(k){s+=S.credits[k];});return s;}

/* ---------------- intro ---------------- */
function renderIntro(){
  var m = EXAM.meta;
  $('introTitle').textContent = m.title;
  $('introObject').innerHTML = '<span class="chip">&#129520; ATT&amp;CK Detection Strategy '+esc(m.objectId)+' &mdash; '+esc(m.objectName)+'</span>'+
    '<span class="chip sev '+SEVCLASS[EXAM.sev]+'">Severity: '+esc(EXAM.sev)+'</span>';
  $('introFacts').innerHTML =
    '<span class="chip">&#129513; Exercises in this file: '+EXAM.exercises.length+'</span>'+
    '<span class="chip">&#9201; Estimated time: '+m.estimatedMinutes+' min</span>'+
    '<span class="chip">&#9203; Timer budget: '+fmtTime(EXAM.timerSeconds)+'</span>'+
    '<span class="chip">&#127937; Pass mark: '+EXAM.passMark+'%</span>';
  $('introLearn').innerHTML = EXAM.intro.learn;
  var kw = $('introKeywords'); kw.innerHTML='';
  EXAM.intro.keywords.forEach(function(g){
    var d = el('div','kw-group');
    d.appendChild(el('h3',null,esc(g.group)));
    var w = el('div','kw-items');
    g.items.forEach(function(it){ w.appendChild(el('span','kw',esc(it))); });
    d.appendChild(w);
    kw.appendChild(d);
  });
  $('introHow').innerHTML = EXAM.intro.how;
}
function show(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){
    $(s).hidden = (s!==id);
  });
  window.scrollTo(0,0);
}

/* ---------------- state ---------------- */
function freshState(){
  return {
    order: shuffle(EXAM.exercises),
    idx: 0,
    credits: {},
    answered: {},
    skipped: [],
    hintUsed: {},
    widget: null,
    timer: {state:'RUNNING', left: EXAM.timerSeconds, total: EXAM.timerSeconds},
    pausedFrom: null,
    phase: 'exam',
    pauseManualSec: 0,
    pauseFeedbackSec: 0,
    reported: false
  };
}
function startExam(){
  S = freshState();
  $('hintBtn').disabled = false;
  show('scr-exam');
  renderExercise();
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- timer ---------------- */
function setTimerState(st){
  if(!S){return;}
  if(S.timer.state==='ENDED' && st!=='ENDED'){return;}
  S.timer.state = st;
  renderTimer();
}
function renderTimer(){
  if(!S){return;}
  var chip = $('timerChip');
  var t = S.timer;
  var cls='t-run', txt='';
  if(t.state==='RUNNING'){cls='t-run'; txt='&#9201; RUNNING &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_MANUAL'){cls='t-pause'; txt='&#9208; PAUSED &mdash; manual (press Resume) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_AUTO_CHECK'){cls='t-pause'; txt='&#9208; PAUSED &mdash; reviewing feedback (resumes on Next) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else {cls='t-end'; txt='&#9209; ENDED &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  chip.className='chip '+cls;
  chip.innerHTML = txt;
  chip.setAttribute('aria-label','Timer state: '+t.state);
  $('pauseBtn').disabled = !(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK');
}
function tick(){
  if(!S || (S.phase!=='exam' && S.phase!=='review')){return;}
  if(S.timer.state==='RUNNING'){
    S.timer.left--;
    if(S.timer.left<=0){ S.timer.left=0; renderTimer(); forceFinish(); return; }
  } else if(S.timer.state==='PAUSED_MANUAL'){ S.pauseManualSec++; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ S.pauseFeedbackSec++; }
  renderTimer();
}
function forceFinish(){
  setTimerState('ENDED');
  showResults();
}

/* ---------------- header widgets ---------------- */
function updateScore(){
  var a = answeredCount(), s = creditSum();
  var pct = a>0 ? Math.round(s/a*100) : 0;
  $('scoreChip').innerHTML = '&#127942; Score <strong class="mono">'+fmt1(s)+'</strong> / '+a+' <span class="muted">('+pct+'%)</span>';
}
function updateProgress(){
  var p = Math.round(answeredCount()/EXAM.exercises.length*100);
  $('progressFill').style.width = p+'%';
  $('progressFill').setAttribute('aria-valuenow', p);
}
function updateCheckState(){
  if(!S || !S.widget){return;}
  /* disabled only when the widget defines ready() and it returns false */
  $('checkBtn').disabled = !!(S.widget.ready && !S.widget.ready());
}

/* ---------------- exercise rendering ---------------- */
function nextUnanswered(from){
  var n = S.order.length;
  for(var k=1;k<=n;k++){
    var i = (from+k)%n;
    var id = idOf(i);
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ return i; }
  }
  return -1;
}
function renderExercise(){
  var ex = cur();
  S.phase='exam';
  $('exCounter').textContent = 'Exercise '+(S.idx+1)+' of '+S.order.length;
  var sev = $('sevBadge');
  sev.className = 'chip '+SEVCLASS[EXAM.sev];
  sev.textContent = EXAM.sev;
  sev.setAttribute('aria-label','Severity '+EXAM.sev);
  $('scenSummary').textContent = ex.summary;
  var body = $('scenBody'); body.innerHTML='';
  ex.scenario.forEach(function(b){
    var wrap = el('div','artefact');
    wrap.appendChild(el('div','artefact-label',esc(b.label)));
    if(b.kind==='mono'){
      var pre = el('pre','mono'); pre.textContent = b.lines.join('\n');
      wrap.appendChild(pre);
    } else {
      var pr = el('div','prose'); pr.innerHTML = b.text;
      wrap.appendChild(pr);
    }
    body.appendChild(wrap);
  });
  $('scenBody').hidden=false;
  $('scenHead').setAttribute('aria-expanded','true');
  $('scenToggleHint').innerHTML='&#9660; collapse';
  $('qText').innerHTML = ex.question;
  Array.prototype.forEach.call(document.querySelectorAll('.hintbox'), function(x){ if(x.parentNode){x.parentNode.removeChild(x);} });
  var aa = $('answerArea'); aa.innerHTML='';
  S.widget = WIDGETS[ex.type](ex, aa, updateCheckState);
  $('feedbackBlock').hidden = true; $('feedbackBlock').innerHTML='';
  $('checkBtn').hidden = false;
  updateCheckState();
  $('nextBtn').hidden = true; $('finishBtn').hidden = true;
  $('hintBtn').disabled = !!S.hintUsed[ex.id];
  $('skipBtn').disabled = !!S.answered[ex.id];
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- feedback ---------------- */
var ROWMETA = {
  ok:{ic:'&#10003;',st:'Correct'},
  bad:{ic:'&#10007;',st:'Wrong'},
  miss:{ic:'&#9675;',st:'Missed'}
};
function renderFeedback(ex, g, credit){
  var fb = $('feedbackBlock');
  fb.hidden = false;
  var head, cls;
  if(credit>=1){head='&#10003; CORRECT'; cls='ok';}
  else if(credit>0){head='&#10003; PARTIALLY CORRECT &mdash; credit '+credit.toFixed(2); cls='part';}
  else {head='&#10007; INCORRECT'; cls='bad';}
  var h = '<div class="fb-head '+cls+'">'+head+'</div>';
  if(g.N>1){
    h += '<div class="muted">credit '+credit.toFixed(2)+' &mdash; '+g.H+'/'+g.N+' correct items, formula (H &minus; W) / N = ('+g.H+' &minus; '+g.W+') / '+g.N+'</div>';
  }
  if(ex.type==='qcm' && credit<1){
    h += '<div class="fb-row ok"><span class="ic">&#10003;</span><span class="st">Correct</span><span>Answer: <strong>'+esc(ex.options[ex.answer])+'</strong></span></div>';
  }
  if(g.rows && g.rows.length){
    h += '<div class="fb-rows">';
    g.rows.forEach(function(r){
      var m = ROWMETA[r.state];
      h += '<div class="fb-row '+r.state+'"><span class="ic">'+m.ic+'</span><span class="st">'+m.st+'</span><span>'+r.label+(r.note?' &mdash; <span class="muted">'+esc(r.note)+'</span>':'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose" style="margin-top:8px">'+ex.explain+'</div>';
  if(S.hintUsed[ex.id]){
    h += '<div class="hintbox"><span class="hw">&#128161; Hint was used:</span> &minus;10% was applied to this exercise\u2019s credit.</div>';
  }
  var study = ex.study || 'Re-read the explanation above and the matching part of the intro section \u201cWhat you will learn here\u201d, then try the exercise again on a retake.';
  h += '<div class="prose muted" style="margin-top:6px"><strong>What to study:</strong> '+study+'</div>';
  fb.innerHTML = h;
  fb.className = 'feedback f-'+(cls==='ok'?'ok':(cls==='part'?'part':'bad'));
}

/* ---------------- check / next / skip / hint / pause ---------------- */
function onCheck(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit-0.10); credit = Math.round(credit*100)/100; }
  S.credits[ex.id] = credit;
  S.answered[ex.id] = true;
  var si = S.skipped.indexOf(ex.id);
  if(si>=0){ S.skipped.splice(si,1); }
  S.widget.lock();
  setTimerState('PAUSED_AUTO_CHECK');
  renderFeedback(ex, g, credit);
  $('checkBtn').hidden = true;
  var last = nextUnanswered(S.idx)===-1;
  $('nextBtn').hidden = false;
  $('finishBtn').hidden = !last;
  $('skipBtn').disabled = true;
  updateScore(); updateProgress();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  if(S._fromReview && S.answered[idOf(S.idx)]){ S._fromReview=false; showReview(); return; }
  S.idx = n; S._fromReview=false;
  renderExercise();
}
function onSkip(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){ S.skipped.push(ex.id); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  S.idx = n;
  renderExercise();
}
function onHint(){
  var ex = cur();
  if(S.hintUsed[ex.id] || S.answered[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var old = document.querySelectorAll('.hintbox.live');
  Array.prototype.forEach.call(old,function(x){x.parentNode.removeChild(x);});
  var box = el('div','hintbox live');
  box.innerHTML = '<span class="hw">&#128161; HINT (&minus;10% of this exercise\u2019s credit):</span> '+esc(ex.hint);
  $('answerArea').parentNode.insertBefore(box, $('answerArea'));
  $('hintBtn').disabled = true;
}
function onPause(){
  if(!S || S.phase!=='exam'){return;}
  if(S.timer.state==='RUNNING' || S.timer.state==='PAUSED_AUTO_CHECK'){
    S.pausedFrom = S.timer.state;
    setTimerState('PAUSED_MANUAL');
    $('pausedOverlay').hidden=false;
  }
}
function onResume(){
  setTimerState(S.pausedFrom || 'RUNNING');
  S.pausedFrom=null;
  $('pausedOverlay').hidden=true;
}

/* ---------------- finish / review / results ---------------- */
function finishAttempt(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  if(S.skipped.length>0){ showReview(); } else { showResults(); }
}
function showReview(){
  S.phase='review';
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  show('scr-review');
  $('reviewIntro').innerHTML = 'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it while the timer is still running. If you submit now, skipped exercises are <strong>excluded</strong> from the score (they count neither as correct nor as wrong).';
  var list = $('reviewList'); list.innerHTML='';
  S.skipped.forEach(function(id,i){
    var ex = null;
    S.order.forEach(function(o){ if(o.id===id){ex=o;} });
    var row = el('div','review-row');
    row.innerHTML = '<span><span class="warnword">&#9888; Skipped</span> &mdash; '+esc(ex.summary)+'</span>';
    var b = el('button','btn small primary','Answer &#9654;');
    b.addEventListener('click', function(){
      S._fromReview=true;
      for(var k=0;k<S.order.length;k++){ if(S.order[k].id===id){ S.idx=k; break; } }
      show('scr-exam');
      renderExercise();
    });
    row.appendChild(b);
    list.appendChild(row);
  });
}
function showResults(){
  S.phase='results';
  setTimerState('ENDED');
  show('scr-results');
  var ids = Object.keys(S.credits);
  var answered = ids.length;
  var sum=0, full=0, part=0, zero=0, partSum=0;
  ids.forEach(function(id){var c=S.credits[id]; sum+=c; if(c>=1){full++;} else if(c>0){part++; partSum+=c;} else {zero++;}});
  var skippedNever = EXAM.exercises.length - answered;
  var pct = answered>0 ? Math.round(sum/answered*100) : 0;
  var passed = pct >= EXAM.passMark;
  var vp = $('verdictPanel');
  if(passed){
    vp.className='card verdict-pass';
    vp.innerHTML = '<div class="bigword">&#10003; PASS</div><p>You reached <strong>'+pct+'%</strong> (pass mark '+EXAM.passMark+'%). Well done &mdash; you demonstrated working knowledge of '+esc(EXAM.meta.objectId)+' &mdash; '+esc(EXAM.meta.objectName)+' at '+esc(EXAM.sev)+' level.</p>';
  } else {
    vp.className='card verdict-fail';
    vp.innerHTML = '<div class="bigword">&#10007; FAIL</div><p>You reached <strong>'+pct+'%</strong>, below the '+EXAM.passMark+'% pass mark. You must retake this exam. Review the explanations, then press Retake.</p>';
  }
  var avgPart = part>0 ? (partSum/part) : 0;
  $('resultsBreakdown').innerHTML =
    '<h2>Score breakdown</h2>'+
    '<div class="res-line ok"><span>&#10003; Fully correct</span><span class="st">'+full+'</span></div>'+
    '<div class="res-line part"><span>&#10003; Partially correct</span><span class="st">'+part+(part>0?' <span class="muted">(avg '+avgPart.toFixed(2)+')</span>':'')+'</span></div>'+
    '<div class="res-line bad"><span>&#10007; Fully incorrect</span><span class="st">'+zero+'</span></div>'+
    '<div class="res-line skip"><span>&#9888; Skipped or unanswered &mdash; excluded</span><span class="st">'+skippedNever+'</span></div>'+
    '<div class="res-line"><span><strong>Total score</strong></span><span class="st"><strong class="mono">'+fmt1(sum)+' / '+answered+'</strong> &mdash; <strong>'+pct+'%</strong></span></div>';
  $('resultsMeta').innerHTML =
    '<h2>How your time was spent</h2>'+
    '<div class="res-line"><span>Time paused manually (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseManualSec)+'</span></div>'+
    '<div class="res-line"><span>Time paused for feedback review (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseFeedbackSec)+'</span></div>'+
    '<div class="res-line"><span>Time left on the clock</span><span class="st mono">'+fmtTime(S.timer.left)+'</span></div>';
  reportScore(sum, answered, pct, passed);
}
function reportScore(creditSum, answeredCount, pct, passed){
  if(S.reported){return;}
  S.reported = true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.meta.topicId,
      batch: EXAM.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: pct,
      passed: passed
    }, location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}

/* ---------------- interactive widgets ---------------- */
var WIDGETS = {};

WIDGETS.qcm = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = -1;
  var wrap = el('div');
  perm.forEach(function(oi, pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} sel = oi; refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = (parseInt(b.dataset.oi,10) === sel);
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return sel>=0; },
    grade:function(){ return {H:(sel===ex.answer?1:0), W:0, N:1, rows:[]}; },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        b.disabled=true;
        var oi=parseInt(b.dataset.oi,10);
        if(oi===ex.answer){b.classList.add('ok');}
        if(oi===sel && sel!==ex.answer){b.classList.add('bad');}
      });
    }
  };
};

WIDGETS.multi = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = {};
  var wrap = el('div');
  perm.forEach(function(oi,pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} if(sel[oi]){delete sel[oi];} else {sel[oi]=true;} refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = !!sel[parseInt(b.dataset.oi,10)];
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length>0; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.options.forEach(function(o,i){
        var picked = !!sel[i], correct = ex.answers.indexOf(i)>=0;
        if(correct && picked){ H++; rows.push({state:'ok', label:o}); }
        else if(correct && !picked){ rows.push({state:'miss', label:o}); }
        else if(!correct && picked){ W++; rows.push({state:'bad', label:o}); }
      });
      return {H:H, W:W, N:ex.answers.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        var oi=parseInt(b.dataset.oi,10);
        if(ex.answers.indexOf(oi)>=0){ b.classList.add('ok'); b.classList.remove('sel'); }
        else if(sel[oi]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.match = function(ex, area, onChange){
  var rights = shuffle(ex.pairs.map(function(p){return p[1];}));
  var chosen = {};
  var wrap = el('div');
  ex.pairs.forEach(function(p,i){
    var row = el('div','pairrow');
    var left = el('div','left', esc(p[0]));
    var s = el('select','ans');
    var opt0 = el('option',null,'&mdash; match &mdash;'); opt0.value='';
    s.appendChild(opt0);
    rights.forEach(function(r){ var o=el('option',null,esc(r)); o.value=r; s.appendChild(o); });
    s.addEventListener('change', function(){ if(s.disabled){return;} chosen[i]=s.value; if(onChange){onChange();} });
    row.appendChild(left); row.appendChild(s);
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.pairs.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.pairs.forEach(function(p,i){
        var got = chosen[i];
        if(got && got===p[1]){ H++; rows.push({state:'ok', label:p[0]+' &rarr; '+esc(p[1])}); }
        else if(got){ W++; rows.push({state:'bad', label:p[0]+' &rarr; '+esc(got), note:'correct: '+p[1]}); }
        else { rows.push({state:'miss', label:p[0], note:'no match chosen; correct: '+p[1]}); }
      });
      return {H:H, W:W, N:ex.pairs.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s,i){
        s.disabled=true;
        if(s.value===ex.pairs[i][1]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.dnd = function(ex, area, onChange){
  var itemPerm = shuffle(ex.items.map(function(it,i){return i;}));
  var placed = {};   /* itemIndex -> slotId */
  var selItem = -1;
  var wrap = el('div');
  var pool = el('div','pool');
  var slotsBox = el('div');
  var slotEls = {};
  ex.slots.forEach(function(sl){
    var s = el('div','slot');
    s.dataset.slot = sl.id;
    s.setAttribute('role','button');
    s.tabIndex = 0;
    s.appendChild(el('span','slot-label', esc(sl.label)));
    var holder = el('div','slot-holder');
    s.appendChild(holder);
    slotEls[sl.id] = s;
    function placeIfSel(){
      if(selItem>=0 && placed[selItem]===undefined){
        placed[selItem]=sl.id; selItem=-1; render();
      }
    }
    s.addEventListener('click', placeIfSel);
    s.addEventListener('keypress', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); placeIfSel(); } });
    s.addEventListener('dragover', function(ev){ ev.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('over'); });
    s.addEventListener('drop', function(ev){ ev.preventDefault(); s.classList.remove('over'); placeIfSel(); });
    slotsBox.appendChild(s);
  });
  function render(){
    pool.innerHTML='';
    itemPerm.forEach(function(i){
      if(placed[i]!==undefined){return;}
      var c = el('button','itemchip', esc(ex.items[i].label));
      c.type='button';
      c.draggable = true;
      if(selItem===i){c.classList.add('sel');}
      c.addEventListener('click', function(){ selItem = (selItem===i?-1:i); render(); });
      c.addEventListener('dragstart', function(ev){ selItem=i; c.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain', String(i));}catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
      pool.appendChild(c);
    });
    ex.slots.forEach(function(sl){
      var holder = slotEls[sl.id].querySelector('.slot-holder');
      holder.innerHTML='';
      itemPerm.forEach(function(i){
        if(placed[i]!==sl.id){return;}
        var p = el('button','placed', esc(ex.items[i].label)+' <span aria-hidden="true">&times;</span>');
        p.type='button';
        p.title='Click to remove back to the bank';
        p.addEventListener('click', function(ev){ ev.stopPropagation(); delete placed[i]; render(); });
        holder.appendChild(p);
      });
    });
    if(onChange){onChange();}
  }
  render();
  wrap.appendChild(pool); wrap.appendChild(slotsBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.items.length;k++){ if(placed[k]===undefined){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.items.forEach(function(it,i){
        var at = placed[i];
        if(at && at===it.slot){ H++; rows.push({state:'ok', label:it.label+' &rarr; '+esc(slotName(it.slot))}); }
        else if(at){ W++; rows.push({state:'bad', label:it.label, note:'placed in '+slotName(at)+'; correct: '+slotName(it.slot)}); }
        else { rows.push({state:'miss', label:it.label, note:'not placed; correct: '+slotName(it.slot)}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
    }
  };
  function slotName(id){
    var n = id;
    ex.slots.forEach(function(s){ if(s.id===id){n=s.label;} });
    return String(n);
  }
};

WIDGETS.order = function(ex, area){
  var isRank = !!ex.rankLabel;
  var ord = shuffle(ex.items.map(function(o,i){return i;}));
  var wrap = el('div');
  var list = el('ul','orderlist');
  function render(){
    list.innerHTML='';
    ord.forEach(function(ii,pos){
      var li = el('li','orderrow');
      li.draggable = true;
      li.dataset.pos = String(pos);
      li.appendChild(el('span','pos', isRank ? ('#'+(pos+1)) : String(pos+1)+'.' ));
      li.appendChild(el('span','txt', esc(ex.items[ii])));
      var mv = el('span','mvbtns');
      var up = el('button',null,'&uarr;'); up.type='button'; up.title='Move up';
      up.addEventListener('click', function(){ if(up.disabled){return;} if(pos>0){var t=ord[pos-1];ord[pos-1]=ord[pos];ord[pos]=t;render();} });
      var dn = el('button',null,'&darr;'); dn.type='button'; dn.title='Move down';
      dn.addEventListener('click', function(){ if(dn.disabled){return;} if(pos<ord.length-1){var t=ord[pos+1];ord[pos+1]=ord[pos];ord[pos]=t;render();} });
      mv.appendChild(up); mv.appendChild(dn);
      li.appendChild(mv);
      li.addEventListener('dragstart', function(ev){ DRAGPOS = pos; try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} });
      li.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      li.addEventListener('drop', function(ev){ ev.preventDefault(); if(DRAGPOS<0||DRAGPOS===pos){return;} var m=ord.splice(DRAGPOS,1)[0]; ord.splice(pos,0,m); DRAGPOS=-1; render(); });
      list.appendChild(li);
    });
  }
  var DRAGPOS = -1;
  render();
  if(isRank){ area.appendChild(el('p','muted', esc(ex.rankLabel))); }
  wrap.appendChild(list);
  area.appendChild(wrap);
  return {
    grade:function(){
      var H=0,W=0,rows=[];
      ord.forEach(function(ii,pos){
        if(ii===ex.correct[pos]){ H++; rows.push({state:'ok', label:'Position '+(pos+1)+': '+esc(ex.items[ii])}); }
        else { W++; rows.push({state:'bad', label:'Position '+(pos+1)+': '+esc(ex.items[ii]), note:'correct here: '+esc(ex.items[ex.correct[pos]])}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.orderrow'), function(li){ li.draggable=false; });
    }
  };
};

WIDGETS.fill = function(ex, area, onChange){
  var bank = shuffle(ex.bank.slice());
  var chosen = {};
  var wrap = el('div','prose');
  var parts = ex.template.split(/\{(\d+)\}/g);
  var line = el('div');
  for(var k=0;k<parts.length;k++){
    if(k%2===0){ line.appendChild(document.createTextNode(parts[k])); }
    else {
      (function(){
        var bi = parseInt(parts[k],10);
        var s = el('select','ans');
        var o0 = el('option',null,'&mdash; choose &mdash;'); o0.value='';
        s.appendChild(o0);
        bank.forEach(function(w){ var o=el('option',null,esc(w)); o.value=w; s.appendChild(o); });
        s.addEventListener('change', function(){ if(s.disabled){return;} chosen[bi]=s.value; if(onChange){onChange();} });
        s.dataset.blank = String(bi);
        line.appendChild(s);
      })();
    }
  }
  wrap.appendChild(line);
  var bw = el('div','kw-items'); 
  bw.appendChild(el('span','kw','Word bank:'));
  bank.forEach(function(w){ bw.appendChild(el('span','kw',esc(w))); });
  area.appendChild(wrap); area.appendChild(bw);
  return {
    ready:function(){
      for(var k=0;k<ex.blanks.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.blanks.forEach(function(b,i){
        var got = chosen[i];
        if(got && got===b){ H++; rows.push({state:'ok', label:'Blank '+(i+1)+': '+esc(b)}); }
        else if(got){ W++; rows.push({state:'bad', label:'Blank '+(i+1)+': '+esc(got), note:'correct: '+b}); }
        else { rows.push({state:'miss', label:'Blank '+(i+1)+': no answer', note:'correct: '+b}); }
      });
      return {H:H, W:W, N:ex.blanks.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s){
        s.disabled=true;
        var bi=parseInt(s.dataset.blank,10);
        if(s.value===ex.blanks[bi]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.linepick = function(ex, area, onChange){
  var pickN = ex.pick || 1;
  var sel = {};
  var wrap = el('div');
  ex.lines.forEach(function(L,i){
    var b = el('button','linepick');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.textContent = L.t;
    b.addEventListener('click', function(){
      if(b.disabled){return;}
      if(sel[i]){ delete sel[i]; }
      else {
        if(pickN===1){ sel={}; }
        else {
          var cnt = Object.keys(sel).length;
          if(cnt>=pickN){ return; }
        }
        sel[i]=true;
      }
      refresh();
    });
    b.dataset.li=String(i);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
      var on = !!sel[parseInt(b.dataset.li,10)];
      b.classList.toggle('sel',on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
    if(onChange){onChange();}
  }
  if(pickN>1){ area.appendChild(el('p','muted','Select exactly '+pickN+' lines, then press Check.')); }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length===pickN; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.lines.forEach(function(L,i){
        var c=!!L.c, p=!!sel[i];
        if(c && p){ H++; rows.push({state:'ok', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(c && !p){ rows.push({state:'miss', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(!c && p){ W++; rows.push({state:'bad', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
      });
      return {H:H, W:W, N:ex.lines.filter(function(L){return !!L.c;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
        var i=parseInt(b.dataset.li,10);
        if(ex.lines[i].c){ b.classList.add('ok'); }
        else if(sel[i]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.triage = function(ex, area, onChange){
  var chosen = {};
  var wrap = el('div');
  var tools = el('div','logtools');
  var inp = el('input');
  inp.type='text'; inp.placeholder='Filter log lines (case-insensitive substring)';
  inp.setAttribute('aria-label','Filter log lines');
  tools.appendChild(inp);
  var logBox = el('div');
  var rowEls = [];
  ex.log.forEach(function(L,i){
    var row = el('div','artefact');
    var pre = el('pre','mono'); pre.textContent = L.t;
    row.appendChild(pre);
    if(L.flag){
      var v = el('div','verdicts');
      ex.verdictOptions.forEach(function(vo,vi){
        var vb = el('button',null, esc(vo));
        vb.type='button';
        vb.setAttribute('aria-pressed','false');
        vb.addEventListener('click', function(){
          if(vb.disabled){return;}
          chosen[i]=vi; 
          Array.prototype.forEach.call(v.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
          vb.setAttribute('aria-pressed','true');
          if(onChange){onChange();}
        });
        vb.dataset.vi=String(vi);
        v.appendChild(vb);
      });
      row.appendChild(v);
    }
    rowEls.push({row:row, text:L.t});
    logBox.appendChild(row);
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rowEls.forEach(function(r){ r.row.style.display = (r.text.toLowerCase().indexOf(q)>=0)?'':'none'; });
  });
  wrap.appendChild(tools); wrap.appendChild(logBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      var ok=true;
      ex.log.forEach(function(L,i){ if(L.flag && chosen[i]===undefined){ ok=false; } });
      return ok;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.log.forEach(function(L,i){
        if(!L.flag){return;}
        var got = chosen[i];
        var correctTxt = ex.verdictOptions[L.correct];
        if(got!==undefined && got===L.correct){ H++; rows.push({state:'ok', label:short(L.t), note:ex.verdictOptions[got]}); }
        else if(got!==undefined){ W++; rows.push({state:'bad', label:short(L.t), note:'you chose: '+ex.verdictOptions[got]+'; correct: '+correctTxt}); }
        else { rows.push({state:'miss', label:short(L.t), note:'no verdict; correct: '+correctTxt}); }
      });
      return {H:H, W:W, N:ex.log.filter(function(L){return L.flag;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){
        var v = b.parentNode;
        var rowB = v.parentNode;
        var idx = rowEls.map(function(r){return r.row;}).indexOf(rowB);
        if(idx>=0 && chosen[idx]!==undefined && parseInt(b.dataset.vi,10)===chosen[idx]){
          if(chosen[idx]===ex.log[idx].correct){ b.style.borderColor='var(--state-correct)'; }
          else { b.style.borderColor='var(--state-incorrect)'; }
        }
      });
      inp.disabled=true;
    }
  };
  function short(t){ return esc(t.length>60?t.slice(0,60)+'\u2026':t); }
};

WIDGETS.decision = function(ex, area, onChange){
  var choices = [];
  var curStep = 0;
  var wrap = el('div');
  function renderStep(){
    var step = ex.steps[curStep];
    var box = el('div');
    box.appendChild(el('span','stepbadge','STEP '+(curStep+1)+' OF '+ex.steps.length));
    box.appendChild(el('p','prose', esc(step.q)));
    var perm = shuffle(step.opts.map(function(o,i){return i;}));
    var sel = -1;
    var confirmBtn = el('button','btn small primary','Confirm step &#9654;');
    confirmBtn.type='button';
    confirmBtn.disabled = true;
    perm.forEach(function(oi,pos){
      var b = el('button','opt');
      b.type='button';
      b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(step.opts[oi])+'</span>';
      b.addEventListener('click', function(){
        if(b.disabled){return;}
        sel=oi;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        confirmBtn.disabled=false;
      });
      box.appendChild(b);
    });
    box.appendChild(confirmBtn);
    confirmBtn.addEventListener('click', function(){
      if(confirmBtn.disabled){return;}
      choices[curStep]=sel;
      disableAll(box);
      confirmBtn.disabled=true;
      curStep++;
      if(curStep>=ex.steps.length){
        if(onChange){onChange();}
      } else { renderStep(); }
    });
    wrap.appendChild(box);
  }
  renderStep();
  area.appendChild(wrap);
  return {
    ready:function(){ return curStep>=ex.steps.length; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.steps.forEach(function(st,i){
        var got = choices[i];
        if(got===st.ans){ H++; rows.push({state:'ok', label:'Step '+(i+1), note:st.why}); }
        else { W++; rows.push({state:'bad', label:'Step '+(i+1), note:'correct: '+st.opts[st.ans]+'. '+st.why}); }
      });
      return {H:H, W:W, N:ex.steps.length, rows:rows};
    },
    lock:function(){ }
  };
};

/* ---------------- boot ---------------- */
function boot(){
  renderIntro();
  $('startBtn').addEventListener('click', startExam);
  $('checkBtn').addEventListener('click', onCheck);
  $('nextBtn').addEventListener('click', onNext);
  $('skipBtn').addEventListener('click', onSkip);
  $('hintBtn').addEventListener('click', onHint);
  $('pauseBtn').addEventListener('click', onPause);
  $('resumeBtn').addEventListener('click', onResume);
  $('finishBtn').addEventListener('click', finishAttempt);
  $('reviewSubmit').addEventListener('click', function(){ showResults(); });
  $('retakeBtn').addEventListener('click', function(){ startExam(); });
  $('scenHead').addEventListener('click', function(){
    var b=$('scenBody');
    b.hidden = !b.hidden;
    var open = !b.hidden;
    $('scenHead').setAttribute('aria-expanded', open?'true':'false');
    $('scenToggleHint').innerHTML = open ? '&#9660; collapse' : '&#9654; expand';
  });
  setInterval(tick, 1000);
  window.addEventListener('message', function(event){
    if(!event.data){return;}
    if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){return;}
    /* Handshake accepted: username, country, locale, topicId, batch are consumed.
       theme is always dark; this file is dark-only, so appearance does not change. */
    window.__cmHandshake = event.data;
  });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
