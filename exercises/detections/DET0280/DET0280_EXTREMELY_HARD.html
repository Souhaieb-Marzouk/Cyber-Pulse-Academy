         {label:'ARTEFACT 1 — Sysmon (EX-WKS-31)', kind:'log', lines:[
           '11:42:03  EventCode=1   Image: …\\winword.exe  User: EX\\cfoster  CommandLine: winword.exe /q "Q4_report.docm"  Parent: …\\outlook.exe',
           '11:42:19  EventCode=1   Image: C:\\Windows\\System32\\rundll32.exe  Parent: …\\winword.exe  CommandLine: rundll32.exe shell32.dll,Control_RunDLL',
           '11:42:25  EventCode=13  TargetObject: HKCU\\…\\Run\\OneDriveStamp  Image: C:\\Windows\\System32\\rundll32.exe  Signed: true (Microsoft)  Details: "\\\\filesrv\\lib\\stamp.dll"']},
         {label:'ARTEFACT 2 — Two analyst opinions (chat)', kind:'text',
         body:['Ana: "Writer is signed Microsoft — SignatureCheck passes, allowlist behaviour, close it."',
               'Bruno: "Signature of the TOOL does not clean the line of the CHAIN: doc from mail → rundll32 → Run key pointing at a file share. Chain wins."']}]},
    q:'Which opinion should win, and why?',
    opts:[['Bruno — the chain context outweighs the tool signature; a signed rundll32 was abused',1],['Ana — the writer is signed, so the write is trusted by definition',0],['Neither — ask the CFO what she opened before deciding',0],['Both — mark the alert as medium and move on',0]],
    x:'<p>When signals conflict, the <strong>behaviour chain outranks one field</strong>. AN0781 is behaviour-based precisely because trust in the tool is not trust in the act: rundll32.exe is signed by Microsoft and still one of the most abused launchers on Windows. The lineage here is damning: a document arriving from mail spawned rundll32, which wrote a Run key pointing at a file-share DLL. A signature passing SignatureCheck only removes ONE suspicion; it does not erase the parent-child line or the share path in Details. “Ask the user” is corroboration, not evidence, and “medium and move on” is not a decision. Bruno wins.</p>',
    h:'Which signal would still be true if the binary had been unsigned? Which one depends on a single field?' },

  { t:'branch', multiEl:true,
    s:{sum:'12:10. War room. The EX-WKS-31 chain is confirmed. Four decisions stand between you and the 12:30 CISO call.',
       blocks:[
         {label:'ARTEFACT 1 — Situation board', kind:'text',
         body:['Confirmed: docm → rundll32 → HKCU Run key (stamp.dll on \\\\filesrv). 2 more workstations show the same Run value. \\\\filesrv share is production (finance docs). Change calendar: no approved changes for EX-* hosts. Legal: litigation hold active — evidence must survive scrutiny. CFO offline until 14:00.']},
         {label:'ARTEFACT 2 — Element states', kind:'text',
         body:['AllowList: regedit.exe, msiexec.exe, SCCM client. TimeWindow: 5 min. SignatureCheck: on (rundll32 passes it). Patterns: Run, Services, Winlogon, SafeDllSearchMode.']}]},
    q:'Take the four senior decisions in order.',
    steps:[
      { q:'A SCCM push is writing Run keys on three hosts at 12:14, mid-incident. What do you do with those alerts?', opts:[
        ['Correlate them against change #CH-2303 and separate them from the incident timeline',1],
        ['Merge them into the incident — more alerts means more attackers',0],
        ['Disable the analytic until the incident closes',0]]},
      { q:'SignatureCheck passed for rundll32.exe. What does that actually tell the room?', opts:[
        ['Only that the binary is signed — the chain and the share path still carry the suspicion',1],
        ['That the write was performed by Windows itself and is safe',0],
        ['That SignatureCheck is broken and must be disabled',0]]},
      { q:'The share \\\\filesrv is production. Hunting stamp.dll there risks user-visible slowdowns. What is the call?', opts:[
        ['Take a read-only snapshot/copy of the share metadata first, then hunt copies of stamp.dll',1],
        ['Delete stamp.dll from the share immediately',0],
        ['Leave the share alone entirely and hope for the best',0]]},
      { q:'For the 12:30 report line, what do you state?', opts:[
        ['Confirmed T1112 persistence on 3 hosts via Rundll32 chain; containment on EX-WKS-31 done; share sweep in progress with legal hold respected',1],
        ['Minor registry noise on one workstation, no action needed',0],
        ['Full domain compromise confirmed — shut everything down',0]]}
    ],
    x:'<p>Step 1: coincident noise is normal; the discipline is to <strong>correlate with the change record</strong> and keep timelines clean — merging noise inflates scope, disabling the analytic blinds you mid-incident. Step 2: SignatureCheck passing says exactly one thing — the binary is signed; it does not launder the chain. Step 3: the cost-aware move is <strong>read-only preservation first</strong>: a snapshot respects the litigation hold, then hunting copies cannot destroy evidence. Deleting the DLL destroys evidence and alerts the operator. Step 4: the report states confirmed facts, actions taken, and work in progress — no inflation, no minimisation. That is the senior register: precise, costed, defensible.</p>',
    h:'Noise is separated, trust is scoped, evidence is preserved before action, reporting is factual.' },

  { t:'term', multiEl:true,
    s:{sum:'You must now hunt the whole estate for the same chain. Write the correlation query.',
       blocks:[{label:'ARTEFACT 1 — Hunt brief', kind:'text',
         body:['Join registry writes (EventCode=13) with process starts (EventCode=1) on ProcessGuid, keep pairs within the TimeWindow (180 seconds), and restrict to Run-key paths. Index: sysmon. Pipe-style syntax. Order: writes on the left, correlated processes on the right.']}]},
    q:'Type the correlation query, then press Check.',
    env:'SIEM search console — simulation only, nothing is executed',
    prompt:'search>',
    canon:'index=sysmon EventCode=13 TargetObject="*\\Run*" | join ProcessGuid [search index=sysmon EventCode=1] | where delta(write_time, start_time) <= 180s',
    out:'6 matches across 4 hosts — EX-WKS-31, EX-WKS-17, FIN-DC-02, FS-ARCHIVE-01 (writers: rundll32.exe ×4, wmic.exe ×2)',
    elements:[['eventcode\\s*=\\s*13','left side: registry write events (13)'],['eventcode\\s*=\\s*1\\b','right side: process creation events (1)'],['processguid','joins the two sides on ProcessGuid'],['180|timewindow|<=\\s*\\d+\\s*s|delta','applies the TimeWindow bound'],['run','restricts key paths to Run']],
    wrong:[['join\\s+host|join\\s+computer','joins on the host field instead of the process identity']],
    dangerous:[['\\|\\s*delete|\\|\\s*remove|outputremove','destructive stage in a hunt query']],
    x:'<p>The hunt has four moving parts and each element of the query is one of them: <strong>EventCode=13</strong> as the left side (the write), <strong>EventCode=1</strong> as the right side (the writer or its child), the <strong>ProcessGuid join</strong> that stitches one process story together (not the host — hosts are shared, processes are not), and the <strong>TimeWindow bound</strong> that keeps only near-in-time pairs. The Run-path restriction keeps the sweep on persistence keys. The output shows why this matters: the same chain on four hosts, two different writer tools — a pattern no single-host alert would reveal. The result line is read-only hunting: no delete, no remove.</p>',
    h:'Five elements: two event codes, one join field, one time bound, one key pattern.' },

  { t:'log', multiEl:false,
    s:{sum:'FIN-DC-02 (domain controller) raised a DET0280 alert at 12:26. Four artefacts on the board. One line in the log decides the case.',
       blocks:[
         {label:'ARTEFACT 1 — Sysmon (FIN-DC-02)', kind:'log', lines:[
           '12:26:04  EventCode=13  TargetObject: HKLM\\…\\Services\\DFSSvc\\ImagePath  Image: …\\rundll32.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FIN-DC-02',
           '12:26:02  EventCode=1   Image: …\\rundll32.exe  Parent: …\\wmiprvse.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FIN-DC-02',
           '12:25:59  EventCode=1   Image: …\\wmiprvse.exe  CommandLine: WMI service host  Computer: FIN-DC-02',
           '12:26:06  EventCode=13  TargetObject: HKLM\\…\\Services\\DFSSvc\\ImagePath  Image: …\\rundll32.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FS-ARCHIVE-01']},
         {label:'ARTEFACT 2 — Ticket #77410', kind:'text',
         body:['Alert claims FIN-DC-02 service ImagePath tampering. On-call: “DCs are sacred — if this is real we escalate to P1 immediately.”']},
         {label:'ARTEFACT 3 — EDR note', kind:'text',
         body:['FS-ARCHIVE-01: EDR agent not installed (gap host). FIN-DC-02: EDR healthy, no service tamper events of its own at 12:26.']},
         {label:'ARTEFACT 4 — Change calendar', kind:'text',
         body:['No changes approved for FIN-DC-02 or FS-ARCHIVE-01 today. DFSSvc untouched by any rollout.']}]},
    q:'Click the log line that resolves the contradiction between artefacts.',
    lines:[
      '12:26:04  EventCode=13  TargetObject: HKLM\\…\\Services\\DFSSvc\\ImagePath  Image: …\\rundll32.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FIN-DC-02',
      '12:26:02  EventCode=1   Image: …\\rundll32.exe  Parent: …\\wmiprvse.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FIN-DC-02',
      '12:25:59  EventCode=1   Image: …\\wmiprvse.exe  CommandLine: WMI service host  Computer: FIN-DC-02',
      '12:26:06  EventCode=13  TargetObject: HKLM\\…\\Services\\DFSSvc\\ImagePath  Image: …\\rundll32.exe  ProcessGuid: {91C4-2A11-0000AA01}  Computer: FS-ARCHIVE-01'],
    target:3, targetText:'Line 4 — the same ProcessGuid tagged with a different Computer: the write really belongs to FS-ARCHIVE-01',
    x:'<p>One ProcessGuid cannot live on two hosts. Line 4 repeats the DFSSvc write with the <strong>same ProcessGuid</strong> but <strong>Computer: FS-ARCHIVE-01</strong> — the DC attribution is a forwarding/normalisation flaw (the archive host forwards through the DC’s collector, and the field got rewritten). That also explains artefact 3: the archive host has no EDR, so nothing there could contradict the mislabel. The DC is clean; the real incident is on FS-ARCHIVE-01, a gap host with no EDR — which is exactly where WMI-borne rundll32 would operate unseen. This is why senior analysts re-read raw lines before declaring a P1 on a domain controller.</p>',
    h:'Look for an impossible pair of values across the four lines.' },

  { t:'rank', multiEl:true,
    s:{sum:'12:31. Six open items, one senior analyst. Rank the triage order.',
       blocks:[{label:'ARTEFACT 1 — The board', kind:'text',
         body:['A. FS-ARCHIVE-01: confirmed DFSSvc ImagePath tampering via WMI → rundll32. Host has no EDR. Finance file server.',
               'B. EX-WKS-31: contained at 12:15 (session held). Run value removed from autostart view but disk artefacts pending.',
               'C. Three SCCM Run-key writes at 12:14 matching change #CH-2303.',
               'D. EX-WKS-17 and EX-WKS-22: same stamp.dll Run value, sessions still live.',
               'E. FIN-DC-02: the mislabeled alert — reopened pending attribution fix.',
               'F. Wallpaper-change burst on the Citrix farm, 40 events, all explorer.exe.']}]},
    q:'Rank from first (top) to last (bottom).',
    items:['D — two live sessions still carrying the stamp.dll persistence','A — confirmed tampering on the unmonitored finance server','B — contained workstation awaiting disk forensics','E — DC alert pending attribution fix and ticket correction','F — wallpaper burst, explorer.exe, unwatched keys','C — SCCM writes matching the approved change'],
    x:'<p>Live compromise beats contained compromise, which beats paperwork. <strong>D</strong> first: two users are one logon away from their persistence executing — and they are still working. <strong>A</strong> next: a confirmed, unmonitored finance server with service tampering is the deepest foothold; containment is harder, so it starts now. <strong>B</strong> is already contained — it needs forensics, not panic. <strong>E</strong> is process hygiene: fix the attribution, correct the ticket, so the DC stays trusted. <strong>F</strong> is unwatched-key noise; <strong>C</strong> is allowlisted, approved change activity — last. Note how the ranking never uses “scary key name” alone: state and exposure decide.</p>',
    h:'Live exposure → deep foothold → pending work → hygiene → noise → approved change.' },

  { t:'qmul', multiEl:true,
    s:{sum:'FP storm review with hard numbers. The tuning board needs exactly two changes that pay for themselves.',
       blocks:[{label:'ARTEFACT 1 — 30-day numbers', kind:'text',
         body:['Total AN0781 alerts: 1,204. True positives: 7 (all involved unsigned or odd-lineage writers). False positives: 1,197 — 940 signed installers not on the allowlist; 210 GPO pushes; 47 service-pack writes by trusted tools. TimeWindow = 5 min (no FP involved a second event beyond 90 s). SignatureCheck = on. Patterns include Run, Services, Winlogon, SafeDllSearchMode.',
               'Options: (a) extend ParentProcessAllowList with the 940-writer set after verification; (b) remove EventCode=1 collection; (c) watch all registry keys; (d) disable SignatureCheck; (e) widen TimeWindow to 24 h; (f) move alerting to “chain-only” mode (write + nearby execution) with write-only alerts downgraded to ticket queue.']}]},
    q:'Select the two options that cut noise without losing true positives.',
    opts:[['(a) verify and allowlist the 940 signed-install writers',1],['(f) chain-only alerting, write-only downgraded',1],['(b) remove EventCode=1 collection',0],['(c) watch all registry keys',0],['(d) disable SignatureCheck',0],['(e) widen TimeWindow to 24 hours',0]],
    x:'<p>The data answers for you. <strong>(a)</strong> removes 940 FPs whose writers are verified-trusted — the exact job of the ParentProcessAllowList. <strong>(f)</strong> matches how all 7 true positives actually looked (write + nearby execution) while demoting lonely writes to a quieter queue — no true positive needed write-only alerting. The rest damage the detection: <strong>(b)</strong> kills the writer half of every chain, <strong>(c)</strong> adds thousands of settings-key FPs, <strong>(d)</strong> removes the trust signal that separates the 7 catches from the noise, and <strong>(e)</strong> merges unrelated events into false chains (the data even shows nothing real needed more than 90 s). Tuning from numbers, not vibes.</p>',
    h:'Count how each option interacts with the 7 true positives.' },

  { t:'match', multiEl:true,
    s:{sum:'Stakeholder map: each artefact of the DET0280 program has a natural owner. Match them.',
       blocks:[{label:'ARTEFACT 1 — artefacts and teams', kind:'text',
         body:['AN0781 logic + tuning changes · Behaviour-chain evidence package (logs, timeline, images) · Report: “Which actors used T1112 this quarter” · Control-mapping evidence for auditors']}]},
    q:'Match each artefact to the team that owns it.',
    pairs:[['AN0781 logic + tuning changes','Detection engineering'],['Behaviour-chain evidence package','Incident response'],['“Actors using T1112” quarterly report','Cyber threat intelligence'],['Control-mapping evidence','GRC / compliance']],
    x:'<p>Artefacts follow their consumers. <strong>Detection engineering</strong> owns the analytic and its mutable elements — they tune it. <strong>Incident response</strong> owns the evidence package: the chain is their case file, and the litigation hold made preservation their duty. <strong>CTI</strong> owns the actor view: who else used T1112 like this, which campaign matches, what to hunt next. <strong>GRC</strong> owns the mapping: the detection strategy is evidence that a control exists and works — auditors ask for exactly this. One strategy, four customers.</p>',
    h:'Who reads it on a normal Tuesday? That is the owner.' },

  { t:'qcm', multiEl:false,
    s:{sum:'A junior proposes the “obvious” fix for every DET0280 hit: “auto-delete the Run value the moment the alert fires. Best practice, right?”',
       blocks:[{label:'ARTEFACT 1 — Proposal', kind:'text',
         body:['SOAR playbook: on every DET0280 alert, automatically delete the written registry value and close the alert as “remediated”.']}]},
    q:'Why is the playbook wrong for this incident?',
    opts:[['It destroys evidence, leaves every other persistence alive, and tips off the operator',1],['It works — deleting the value removes the attacker from the host',0],['It is fine as long as the value is deleted within the TimeWindow',0],['It is wrong only because SOAR cannot call the registry API',0]],
    x:'<p>Three independent reasons, all fatal. <strong>Evidence:</strong> under a litigation hold, the value and its writer are artefacts; auto-deletion is spoliation. <strong>Coverage:</strong> the chain you saw is one persistence of several — attackers routinely plant Run keys AND services AND scheduled tasks; deleting one value changes nothing about the rest, and the follow-up execution may already be scheduled. <strong>Warning:</strong> the operator watches the host; a silent deletion tells them a detection exists, and their next stage will avoid it. The senior alternative: preserve, hunt for the siblings, contain deliberately. “Best practice” applied without context is how evidence dies.</p>',
    h:'Three reasons — evidence, coverage, warning. Which ones does the proposal break?' },

  { t:'fill', multiEl:true,
    s:{sum:'13:00. You owe the CISO a five-line summary. Fill in the exact terms.',
       blocks:[{label:'ARTEFACT 1 — Summary draft', kind:'text',
         body:['EX-WKS-31 and two peers: a document-spawned rundll32 chain modified Run keys — a ____(1)____ matching analytic AN0781 for technique ____(2)____. All writes and follow-up executions fell inside the configured ____(3)____, which is why the alerts carried high confidence. DET0280 catches local chains; the unmonitored FS-ARCHIVE-01 shows why we fund ____(4)____ for gap hosts.']}]},
    q:'Complete the summary with the four exact terms.',
    parts:['a document-spawned rundll32 chain modified Run keys — a ',{b:0},' matching analytic AN0781 for technique ',{b:1},'. All writes and follow-up executions fell inside the configured ',{b:2},', which is why the alerts carried high confidence. DET0280 catches local chains; the unmonitored FS-ARCHIVE-01 shows why we fund ',{b:3},' for gap hosts.'],
    bank:['behavior chain','T1112','TimeWindow','compensating detections','T1059','ParentProcessAllowList'],
    x:'<p>The executive summary uses the strategy’s own vocabulary, precisely. The observed pattern is a <strong>behavior chain</strong> (that is what AN0781 detects). The technique is <strong>T1112 — Modify Registry</strong> (T1059 is scripting — the chain used a script engine, but the technique caught is the registry one). The confidence came from the <strong>TimeWindow</strong> binding write and execution into one story. And the funding line lands on <strong>compensating detections</strong> for gap hosts — the exact term GRC and the CISO expect for coverage holes. One-word precision is what makes a summary defensible.</p>',
    h:'Chain, technique ID, time element, and the funding word for coverage holes.' },

  { t:'drop', multiEl:true,
    s:{sum:'Architecture review: which telemetry feeds DET0280 directly, which is compensating, and which is unrelated?',
       blocks:[{label:'ARTEFACT 1 — Telemetry inventory', kind:'text',
         body:['Sysmon EventCode=13 · Sysmon EventCode=14 · Sysmon EventCode=1 · Security 4657 (registry audit) · EDR registry-write events · RemoteRegistry service-start monitoring · Sysmon EventCode=3 (network) · Sysmon EventCode=15 (ADS hash) · DNS query logs']}]},
    q:'Drag each source into the right bucket.',
    zones:['DET0280 primary telemetry','Compensating / adjacent telemetry','Not registry telemetry'],
    items:[['Sysmon EventCode=13',0],['Sysmon EventCode=14',0],['Sysmon EventCode=1',0],['Security 4657 registry audit',1],['EDR registry-write events',1],['RemoteRegistry service-start monitoring',1],['Sysmon EventCode=3 (network)',2],['Sysmon EventCode=15 (ADS hash)',2],['DNS query logs',2]],
    x:'<p><strong>Primary</strong> is exactly what the DET0280 page lists: DC0063 via Sysmon 13 and 14, plus DC0032 via Sysmon 1. <strong>Compensating/adjacent</strong> sources fill the gaps you found in coverage reviews: Security 4657 where Sysmon is absent, EDR registry events where Sysmon cannot run, and RemoteRegistry monitoring for the remote-write gap. <strong>Not registry telemetry</strong>: network connections (3), alternate-data-stream hashes (15), and DNS — all useful elsewhere, none of them registry writes. Precision here is what stops “we collect everything” arguments from hiding “we collect nothing that matters”.</p>',
    h:'The page names two data components. Everything else is support or noise.' },

  { t:'order', multiEl:true,
    s:{sum:'Legal hold is active on FS-ARCHIVE-01. Sequence the response so evidence survives scrutiny.',
       blocks:[{label:'ARTEFACT 1 — Response cards', kind:'text',
         body:['[A] Capture volatile memory of FS-ARCHIVE-01.',
               '[B] Present findings and the remediation plan for legal sign-off.',
               '[C] Take a forensic disk image (bit-locked) of the server.',
               '[D] Validate the chain artefacts: ProcessGuid story, ImagePath before/after, WMI origin.',
               '[E] Only after sign-off: restore clean ImagePath, remove persistence, patch the EDR gap.']}]},
    q:'Put the five steps in the correct order.',
    items:['Capture volatile memory of FS-ARCHIVE-01','Take a forensic disk image (bit-locked) of the server','Validate the chain artefacts: ProcessGuid story, ImagePath before/after, WMI origin','Present findings and the remediation plan for legal sign-off','Only after sign-off: restore clean ImagePath, remove persistence, patch the EDR gap'],
    x:'<p>Volatility order rules the day: <strong>memory first</strong> (it dies on reboot), then the <strong>disk image</strong> (state of record). Then — before anything changes — <strong>validate the artefacts</strong>: the ProcessGuid chain, the before/after of the ImagePath, the WMI origin; this is what makes the story defensible. Then <strong>legal sign-off</strong>, because under a hold, remediation without approval risks spoliation claims. Only then <strong>remediate</strong>: restore the ImagePath, remove persistence, and close the EDR gap that let this happen. Every swap in this order has a named cost — that is why the order is the answer.</p>',
    h:'Things that die first get collected first; things that change need permission first.' },

  { t:'log', multiEl:false,
    s:{sum:'One more attribution drill before the CISO call. The collector rewrites Computer fields for gap hosts — find the line that proves the second host is genuinely hit.',
       blocks:[{label:'ARTEFACT 1 — Correlated Sysmon export (collector view)', kind:'log', lines:[
         '12:26:02  EventCode=1   ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-17  Image: …\\rundll32.exe',
         '12:26:04  EventCode=13  ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-17  TargetObject: HKCU\\…\\Run\\OneDriveStamp',
         '12:26:05  EventCode=13  ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-22  TargetObject: HKCU\\…\\Run\\OneDriveStamp',
         '12:26:07  EventCode=1   ProcessGuid: {B7D2-11F0-0000C202}  Computer: EX-WKS-22  Image: …\\rundll32.exe',
         '12:26:09  EventCode=13  ProcessGuid: {B7D2-11F0-0000C202}  Computer: EX-WKS-22  TargetObject: HKCU\\…\\Run\\OneDriveStamp']}]},
    q:'Click the line that proves EX-WKS-22 is genuinely compromised by its own chain — not just a mislabel of EX-WKS-17 activity.',
    lines:[
      '12:26:02  EventCode=1   ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-17  Image: …\\rundll32.exe',
      '12:26:04  EventCode=13  ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-17  TargetObject: HKCU\\…\\Run\\OneDriveStamp',
      '12:26:05  EventCode=13  ProcessGuid: {B7D2-11F0-0000C201}  Computer: EX-WKS-22  TargetObject: HKCU\\…\\Run\\OneDriveStamp',
      '12:26:07  EventCode=1   ProcessGuid: {B7D2-11F0-0000C202}  Computer: EX-WKS-22  Image: …\\rundll32.exe',
      '12:26:09  EventCode=13  ProcessGuid: {B7D2-11F0-0000C202}  Computer: EX-WKS-22  TargetObject: HKCU\\…\\Run\\OneDriveStamp'],
    target:4, targetText:'Line 5 — ProcessGuid C202 was born on EX-WKS-22 (line 4) and wrote the Run value there: a second, independent chain',
    x:'<p>Line 3 is the trap: it repeats ProcessGuid C201 with a different Computer field, but C201 belongs to the EX-WKS-17 process (lines 1–2 agree) — so line 3 is a forwarded duplicate with a rewritten Computer field, not a third compromise. The proof that EX-WKS-22 is genuinely hit is <strong>line 5</strong>: ProcessGuid <strong>C202</strong> is a separate process, born on EX-WKS-22 itself (line 4, EventCode=1), and line 5 shows that same process writing the Run value there. Two ProcessGuid chains, two genuinely compromised hosts — while the alarming “third” write was only a collector flaw. Attribution by ProcessGuid, confirmed against the birth event, is what keeps the CISO scope at two hosts instead of three.</p>',
    h:'A genuine chain owns a birth event. Follow each ProcessGuid back to the EventCode=1 that created it.' },

  { t:'qcm', multiEl:false,
    s:{sum:'14:05. A last oddity: an ALLOWLISTED tool (msiexec.exe, signed) wrote HKLM\\…\\Services\\LanmanServer\\Parameters — not a key family it ever touches. The server has no EDR. CISO asks: contain now?',
       blocks:[{label:'ARTEFACT 1 — Facts', kind:'text',
         body:['Writer: msiexec.exe (signed, allowlisted). Key: Services\\LanmanServer\\Parameters (service-hardening family; not in any approved change). No install in progress (no msi in change records). Host: FS-ARCHIVE-01 — no EDR, Sysmon only. No follow-up execution seen yet within the TimeWindow.']}]},
    q:'What is the senior call?',
    opts:[['Do not contain yet — raise monitoring, correlate from the source side, and verify the writer’s lineage before touching a production server',1],['Isolate the server immediately — allowlisted tools never write anything odd',0],['Close it — the writer is on the allowlist, so the write is trusted',0],['Delete the written value remotely and keep monitoring',0]],
    x:'<p>This is the “gather more evidence” call. The signal is real: an allowlisted writer touching a family it never touches, with no install in progress — the allowlist says nothing about <em>what</em> was written, only <em>who</em> usually writes. But containment has a real cost (production file server, active hold) and the follow-up half of the chain has not fired yet. The senior move: <strong>raise monitoring on the host and its siblings, pull lineage from the source side (WMI logs, sign-in records), verify the msiexec binary on disk</strong> — then decide. Immediate isolation risks the business for an unconfirmed chain; closing trusts a list over a behaviour; remote deletion destroys evidence again. Confidence is built, not assumed.</p>',
    h:'The allowlist answers “who”, not “what”. The chain is half-finished. What buys certainty at least cost?' },

  { t:'qmul', multiEl:true,
    s:{sum:'Before the 14:30 review: which information gaps actually change the decisions on the board?',
       blocks:[{label:'ARTEFACT 1 — Known unknowns', kind:'text',
         body:['(a) FS-ARCHIVE-01 has no EDR (Sysmon only). (b) The WMI origin host of the rundll32 parent is unidentified. (c) A GPO change pushed at 11:00 is not yet in the change calendar. (d) EX-WKS-31 user was on leave last week. (e) The wallpaper burst happened on the Citrix farm. (f) The collector rewrites Computer fields when forwarding from gap hosts.']}]},

/* ---------- log syntax highlight ---------- */
var HL_RX = /(EventCode\s*=\s*\d+)|(EventID\s*=\s*\d+)|(\b\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?\b)|(\b\d{2}:\d{2}:\d{2}\b)|((?:HKLM|HKCU|HKU|HKCR)\\[^\s",;)]*)|("(?:[^"\\]|\\.)*")|(\b(?:reg\.exe|reg\.add|regedit(?:\.exe)?|powershell(?:\.exe)?|pwsh|cmd\.exe|wmic(?:\.exe)?|msiexec(?:\.exe)?|rundll32(?:\.exe)?|svchost(?:\.exe)?|winword(?:\.exe)?|excel(?:\.exe)?|outlook(?:\.exe)?|explorer\.exe|schtasks(?:\.exe)?|sc\.exe|psexec|wscript(?:\.exe)?|cscript(?:\.exe)?|mshta(?:\.exe)?|Set-ItemProperty|New-ItemProperty|Remove-ItemProperty|Invoke-CimMethod|Register-ScheduledTask)\b)|(\b(?:TargetObject|Details|EventType|Image|ParentImage|ProcessGuid|ProcessId|CommandLine|User|UtcTime|Hashes|Company|Signature|Signed|EventRecordID|Computer|Channel|ServiceName|ImagePath|QueryName|DestinationHostname|SourceIp|LogonId|IntegrityLevel|ParentProcessGuid|Product)\b(?=\s*:))/gi;
function hlLine(raw){
  var out = '', last = 0, m;
  HL_RX.lastIndex = 0;
  while ((m = HL_RX.exec(raw)) !== null){
    out += esc(raw.slice(last, m.index));
    var tok = m[0], cls = 'hl-op';
    if (m[1] || m[2]) cls = 'hl-ev';
    else if (m[3] || m[4]) cls = 'hl-ts';
    else if (m[5]) cls = 'hl-reg';
    else if (m[6]) cls = 'hl-str';
    else if (m[7]) cls = 'hl-op';
    else if (m[8]) cls = 'hl-fn';
    out += '<span class="' + cls + '">' + esc(tok) + '</span>';
    last = m.index + tok.length;
  }
  out += esc(raw.slice(last));
  return out;
}
function logLineHtml(raw, ln){ return '<span class="ln">' + ln + '</span><span class="lt">' + hlLine(raw) + '</span>'; }

/* --- qcm / qmul --- */
function wQCM(ex, st, multi){
  var d = st.data; if (!d.sel) d.sel = [];
  if (!d.shuffledOpts) d.shuffledOpts = shuffle(ex.opts.map(function(o, i){ return { t: o[0], ok: o[1] === 1, i: i }; }));
  var wrap = el('div', 'opts');
  wrap.setAttribute('role', multi ? 'group' : 'radiogroup');
  wrap.setAttribute('aria-label', 'Answer options');
  var letters = 'ABCDEFGH';
  d.shuffledOpts.forEach(function(o, oi){
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="key">' + letters[oi] + '.</span><span class="txt">' + esc(o.t) + '</span><span class="sel-tag" hidden>● Selected</span>';
    b.onclick = function(){
      if (st.locked) return;
      if (!multi){ d.sel = [oi]; }
      else {
        var at = d.sel.indexOf(oi);
        if (at >= 0) d.sel.splice(at, 1); else d.sel.push(oi);
      }
      Array.prototype.forEach.call(wrap.children, function(c, ci){
        var on = d.sel.indexOf(ci) >= 0;
        c.setAttribute('aria-pressed', String(on));
        c.querySelector('.sel-tag').hidden = !on;
      });
      $('#btncheck').disabled = d.sel.length === 0;
    };
    wrap.appendChild(b);
  });
  return wrap;
}
function gQCM(ex, st, multi){
  var sel = st.data.sel, sh = st.data.shuffledOpts;
  var N = multi ? sh.filter(function(o){ return o.ok; }).length : 1;
  var H = 0, W = 0, items = [];
  sh.forEach(function(o, oi){
    var wasSel = sel.indexOf(oi) >= 0;
    if (multi){
      if (o.ok && wasSel){ H++; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W++; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok && !wasSel){ items.push({ label: o.t, status: 'missed' }); }
    } else {
      if (o.ok && wasSel){ H = 1; items.push({ label: o.t, status: 'correct' }); }
      else if (!o.ok && wasSel){ W = 1; items.push({ label: o.t, status: 'wrong' }); }
      else if (o.ok){ items.push({ label: o.t, status: 'missed' }); }
    }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- match --- */
function wMatch(ex, st){
  var d = st.data; if (!d.pairs) d.pairs = {};
  if (!d.shuffledRights) d.shuffledRights = shuffle(ex.pairs.map(function(p, i){ return { t: p[1], i: i }; }));
  var rights = d.shuffledRights;
  var wrap = el('div', 'match');
  var leftCol = el('div', 'mcol'), rightCol = el('div', 'mcol');
  var pickedLeft = null;
  var rightsByI = {};
  rights.forEach(function(r){ rightsByI[r.i] = r; });
  ex.pairs.forEach(function(p, i){
    var b = el('button', 'mitem'); b.type = 'button';
    b.innerHTML = '<span class="pairno"></span> ' + esc(p[0]);
    b.setAttribute('aria-label', 'Item: ' + p[0]);
    b.onclick = function(){
      if (st.locked) return;
      Array.prototype.forEach.call(leftCol.children, function(c){ c.classList.remove('picked'); });
      pickedLeft = i; b.classList.add('picked');
    };
    leftCol.appendChild(b);
  });
  rights.forEach(function(r){
    var b = el('button', 'mitem'); b.type = 'button';
    b.innerHTML = esc(r.t);
    b.setAttribute('aria-label', 'Match option: ' + r.t);
    b.onclick = function(){
      if (st.locked || pickedLeft === null) return;
      for (var k in d.pairs){ if (d.pairs[k] === r.i) delete d.pairs[k]; }
      d.pairs[pickedLeft] = r.i;
      pickedLeft = null;
      refresh();
    };
    rightCol.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(leftCol.children, function(c, ci){
      c.classList.remove('picked');
      var pid = d.pairs[ci];
      c.querySelector('.pairno').textContent = pid === undefined ? '— unpaired' : '✓ → ' + rightsByI[pid].t;
    });
    $('#btncheck').disabled = Object.keys(d.pairs).length === 0;
  }
  refresh();
  wrap.appendChild(leftCol); wrap.appendChild(rightCol);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Click an item on the left, then click its partner on the right. Click again to change.'));
  return holder;
}
function gMatch(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.pairs.length, items = [];
  ex.pairs.forEach(function(p, i){
    var chosen = d.pairs[i];
    if (chosen === undefined) items.push({ label: p[0] + ' → ' + p[1], status: 'missed' });
    else if (chosen === i){ H++; items.push({ label: p[0] + ' → ' + p[1], status: 'correct' }); }
    else { W++; items.push({ label: p[0] + ' → ' + ex.pairs[chosen][1] + ' (wrong partner)', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- drop --- */
function wDrop(ex, st){
  var d = st.data; if (!d.placed) d.placed = {};
  if (!d.shuffledItems) d.shuffledItems = shuffle(ex.items.map(function(it, i){ return { t: it[0], z: it[1], i: i }; }));
  var items = d.shuffledItems;
  var single = ex.zones.length < 2;
  var wrap = el('div', 'dropwrap' + (single ? ' single' : ''));
  var bank = el('div', 'bank');
  bank.setAttribute('role', 'group'); bank.setAttribute('aria-label', 'Item bank');
  var zones = el('div', 'zones');
  var zoneEls = [];
  ex.zones.forEach(function(z, zi){
    var zEl = el('div', 'zone');
    zEl.appendChild(el('h4', null, '<span aria-hidden="true">🗂</span> ' + esc(z)));
    var slot = el('div', 'zslot'); slot.dataset.z = zi;
    zEl.appendChild(slot);
    zones.appendChild(zEl); zoneEls.push(slot);
  });
  function chipEl(it){
    var c = el('button', 'chip'); c.type = 'button';
    c.innerHTML = '<span aria-hidden="true">⬚</span> ' + esc(it.t);
    c.setAttribute('aria-label', 'Item: ' + it.t);
    c.onclick = function(){
      if (st.locked) return;
      var was = c.classList.contains('picked');
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      if (was){ d.picked = null; return; }
      c.classList.add('picked'); d.picked = it.i;
    };
    c.addEventListener('pointerdown', function(ev){
      if (st.locked) return;
      ev.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('.chip.picked'), function(x){ x.classList.remove('picked'); });
      c.classList.add('picked'); d.picked = it.i;
      var g = el('div', 'chip dragghost', c.innerHTML); document.body.appendChild(g);
      function mv(e){ g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
      function up(e){
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
        var t = document.elementFromPoint(e.clientX, e.clientY);
        var zslot = t && t.closest ? t.closest('.zslot') : null;
        if (zslot && !st.locked) place(it.i, parseInt(zslot.dataset.z, 10));
        if (g.parentNode) g.parentNode.removeChild(g);
      }
      mv(ev);
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
    });
    return c;
  }
  function place(ii, zi){ d.placed[ii] = zi; d.picked = null; refresh(); }
  function refresh(){
    bank.innerHTML = '';
    items.forEach(function(it){ if (d.placed[it.i] === undefined) bank.appendChild(chipEl(it)); });
    if (!bank.children.length) bank.innerHTML = '<span class="small-note">All items placed — click a placed item to return it.</span>';
    zoneEls.forEach(function(slot, zi){
      slot.innerHTML = '';
      items.forEach(function(it){
        if (d.placed[it.i] === zi){
          var c = chipEl(it);
          c.onclick = function(){ if (!st.locked){ delete d.placed[it.i]; d.picked = null; refresh(); } };
          slot.appendChild(c);
        }
      });
    });
    $('#btncheck').disabled = Object.keys(d.placed).length === 0;
  }
  refresh();
  wrap.appendChild(bank); wrap.appendChild(zones);
  var holder = el('div');
  holder.appendChild(wrap);
  holder.appendChild(el('p', 'mhint', 'Drag an item into a zone, or click the item and then click a zone. Click a placed item to send it back.'));
  return holder;
}
function gDrop(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  ex.items.forEach(function(it, i){
    var placedAt = d.placed[i];
    if (placedAt === undefined) items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'missed' });
    else if (placedAt === it[1]){ H++; items.push({ label: it[0] + ' → ' + ex.zones[it[1]], status: 'correct' }); }
    else { W++; items.push({ label: it[0] + ' → ' + ex.zones[placedAt] + ' (wrong zone)', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- order / rank --- */
function wOrder(ex, st, isRank){
  var d = st.data;
  if (!d.shuffled) d.shuffled = shuffle(ex.items.map(function(t, i){ return { t: t, i: i }; }));
  if (!d.order) d.order = d.shuffled.slice();
  var list = el('div', 'orderlist');
  list.setAttribute('aria-label', isRank ? 'Priority list' : 'Ordered list');
  function render(){
    list.innerHTML = '';
    d.order.forEach(function(it, pos){
      var row = el('div', 'orow');
      row.setAttribute('aria-label', 'Position ' + (pos + 1) + ': ' + it.t);
      row.innerHTML = '<span class="rank">' + (isRank ? '#' : (pos + 1) + '.') + '</span><span class="txt">' + esc(it.t) + '</span>';
      var mv = el('span', 'mv');
      var up = el('button', 'btn small', '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
      var dn = el('button', 'btn small', '↓'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down');
      up.disabled = pos === 0; dn.disabled = pos === d.order.length - 1;
      up.onclick = function(){ if (st.locked) return; var t = d.order[pos - 1]; d.order[pos - 1] = d.order[pos]; d.order[pos] = t; render(); };
      dn.onclick = function(){ if (st.locked) return; var t = d.order[pos + 1]; d.order[pos + 1] = d.order[pos]; d.order[pos] = t; render(); };
      mv.appendChild(up); mv.appendChild(dn);
      row.appendChild(mv);
      row.addEventListener('pointerdown', function(ev){
        if (st.locked || (ev.target.closest && ev.target.closest('button'))) return;
        ev.preventDefault();
        var g = el('div', 'chip dragghost', esc(it.t)); document.body.appendChild(g);
        function mv2(e){
          g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
          var rows = Array.prototype.slice.call(list.children);
          var idx = rows.length;
          for (var ri = 0; ri < rows.length; ri++){ var b = rows[ri].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2){ idx = ri; break; } }
          var from = d.order.indexOf(it);
          if (idx > from) idx--;
          if (idx !== from && idx >= 0){ d.order.splice(from, 1); d.order.splice(idx, 0, it); render(); }
        }
        function up2(){ document.removeEventListener('pointermove', mv2); document.removeEventListener('pointerup', up2); if (g.parentNode) g.parentNode.removeChild(g); }
        mv2(ev);
        document.addEventListener('pointermove', mv2);
        document.addEventListener('pointerup', up2);
      });
      list.appendChild(row);
    });
    $('#btncheck').disabled = sameOrder(d.order, d.shuffled);
  }
  render();
  var holder = el('div');
  holder.appendChild(list);
  holder.appendChild(el('p', 'mhint', (isRank ? 'Rank from most urgent (top) to least urgent (bottom). ' : 'Put the steps in the correct order. ') + 'Use drag or the ↑ ↓ buttons.'));
  return holder;
}
function gOrder(ex, st){
  var d = st.data, H = 0, W = 0, N = ex.items.length, items = [];
  d.order.forEach(function(it, pos){
    if (it.i === pos){ H++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t, status: 'correct' }); }
    else { W++; items.push({ label: 'Position ' + (pos + 1) + ': ' + it.t + ' — correct here: ' + ex.items[pos], status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- fill (word bank → blanks); parts: string | {b: bankIndex} --- */
function wFill(ex, st){
  var d = st.data;
  if (!d.slotVals) d.slotVals = ex.parts.filter(function(p){ return typeof p === 'object'; }).map(function(){ return null; });
  if (!d.shuffledBank) d.shuffledBank = shuffle(ex.bank.map(function(w, i){ return { w: w, i: i }; }));
  var bank = d.shuffledBank;
  var wrap = el('div');
  var textEl = el('p', 'filltext');
  var slots = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p === 'string'){
      var sp = el('span'); sp.textContent = p; textEl.appendChild(sp);
    } else {
      var si = slotIdx++;
      var s = el('button', 'slot'); s.type = 'button';
      s.textContent = '___';
      s.setAttribute('aria-label', 'Blank ' + (si + 1) + ', choose a word');
      s.onclick = function(){
        if (st.locked) return;
        if (d.slotVals[si] !== null && d.picked == null){ d.slotVals[si] = null; render(); return; }
        if (d.picked != null){
          for (var k = 0; k < d.slotVals.length; k++){ if (d.slotVals[k] === d.picked) d.slotVals[k] = null; }
          d.slotVals[si] = d.picked; d.picked = null; render();
        }
      };
      slots[si] = s; textEl.appendChild(s);
    }
  });
  var bankRow = el('div', 'bankrow');
  bankRow.setAttribute('role', 'group'); bankRow.setAttribute('aria-label', 'Word bank');
  function render(){
    slots.forEach(function(s, si){
      var v = d.slotVals[si];
      if (v == null){ s.textContent = '___'; s.classList.remove('filled'); }
      else { s.textContent = bank[v].w; s.classList.add('filled'); }
    });
    bankRow.innerHTML = '';
    bank.forEach(function(b, bi){
      if (d.slotVals.indexOf(bi) >= 0) return;
      var c = el('button', 'chip'); c.type = 'button'; c.textContent = b.w;
      c.setAttribute('aria-label', 'Word: ' + b.w);
      c.onclick = function(){
        if (st.locked) return;
        var was = c.classList.contains('picked');
        Array.prototype.forEach.call(bankRow.children, function(x){ x.classList.remove('picked'); });
        if (was){ d.picked = null; return; }
        c.classList.add('picked'); d.picked = bi;
      };
      bankRow.appendChild(c);
    });
    $('#btncheck').disabled = d.slotVals.every(function(x){ return x == null; });
  }
  render();
  wrap.appendChild(textEl); wrap.appendChild(bankRow);
  wrap.appendChild(el('p', 'mhint', 'Click a word, then click a blank. Click a filled blank to empty it. Distractor words do not belong anywhere.'));
  return wrap;
}
function gFill(ex, st){
  var d = st.data, H = 0, W = 0, N = 0, items = [];
  var slotIdx = 0;
  ex.parts.forEach(function(p){
    if (typeof p !== 'object') return;
    var si = slotIdx++; N++;
    var expected = ex.bank[p.b];
    var chosen = d.slotVals[si];
    if (chosen == null) items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'missed' });
    else if (d.shuffledBank[chosen].i === p.b){ H++; items.push({ label: 'Blank ' + N + ' → ' + expected, status: 'correct' }); }
    else { W++; items.push({ label: 'Blank ' + N + ': placed "' + d.shuffledBank[chosen].w + '" (correct: ' + expected + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- branch (decision tree; graded on final step) --- */
function wBranch(ex, st){
  var d = st.data;
  if (!d.choices) d.choices = [];
  var wrap = el('div');
  var stepHost = el('div');
  wrap.appendChild(stepHost);
  var stepNote = el('p', 'mhint', '');
  wrap.appendChild(stepNote);
  function renderStep(){
    var si = d.choices.length;
    if (si >= ex.steps.length) return;
    var step = ex.steps[si];
    stepHost.innerHTML = '';
    var tag = el('p', 'small-note', 'STEP ' + (si + 1) + ' OF ' + ex.steps.length);
    tag.style.fontWeight = '700';
    stepHost.appendChild(tag);
    stepHost.appendChild(el('p', null, '<strong>' + esc(step.q) + '</strong>'));
    var opts = el('div', 'opts');
    var letters = 'ABCD';
    shuffle(step.opts).forEach(function(o, oi){
      var b = el('button', 'opt'); b.type = 'button';
      b.innerHTML = '<span class="key">' + letters[oi] + '.</span><span class="txt">' + esc(o[0]) + '</span>';
      b.onclick = function(){
        d.choices.push(o[0]);
        renderStep();
      };
      opts.appendChild(b);
    });
    stepHost.appendChild(opts);
    stepNote.textContent = si === 0
      ? 'Intermediate steps do not pause the timer and do not reveal right or wrong. Only the final step is graded.'
      : 'The timer keeps running between steps.';
  }
  renderStep();
  return wrap;
}
function wBranchReady(ex, st){ return st.data.choices.length >= ex.steps.length; }
function gBranch(ex, st){
  var H = 0, W = 0, N = ex.steps.length, items = [];
  ex.steps.forEach(function(step, i){
    var chosen = st.data.choices[i];
    var correct = step.opts.filter(function(o){ return o[1] === 1; })[0][0];
    if (chosen === correct){ H++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen, status: 'correct' }); }
    else { W++; items.push({ label: 'Step ' + (i + 1) + ': ' + chosen + ' (better: ' + correct + ')', status: 'wrong' }); }
  });
  return { H: H, W: W, N: N, items: items };
}

/* --- terminal (query editor) --- */
function wTerm(ex, st){
  var d = st.data;
  var wrap = el('div', 'term');
  wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Query editor (simulation only)');
  var head = el('div', 'thead', '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> ' + esc(ex.env || 'query editor — simulation only, nothing is executed'));
  var body = el('div', 'tbody');
  var line = el('div', 'promptline');
  line.appendChild(el('span', 'prompt', esc(ex.prompt || 'query>')));

  inp.setAttribute('aria-label', 'Query input');
  inp.value = d.cmd || '';
  inp.addEventListener('input', function(){ d.cmd = inp.value; $('#btncheck').disabled = !d.cmd || !d.cmd.trim(); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !$('#btncheck').disabled){ e.preventDefault(); onCheck(); } });
  line.appendChild(inp);
  body.appendChild(line);
  var out = el('div', 'tout'); out.id = 'termout';
  out.textContent = d.ran ? '— press Check to grade your query —' : 'Waiting for your query…';
  body.appendChild(out);

function normQuery(q){
  return String(q || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/["']/g, '');
}
function gTerm(ex, st){
  var q = normQuery(st.data.cmd);
  var H = 0, W = 0, N = ex.elements.length, items = [];
  ex.elements.forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ H++; items.push({ label: 'Element: ' + e[1], status: 'correct' }); }
    else items.push({ label: 'Element: ' + e[1], status: 'missed' });
  });
  (ex.wrong || []).forEach(function(e){
    var re = new RegExp(e[0], 'i');
    if (re.test(q)){ W++; items.push({ label: 'Element: ' + e[1], status: 'wrong' }); }
  });
  var dangerous = (ex.dangerous || []).filter(function(e){ return new RegExp(e[0], 'i').test(q); }).map(function(e){ return e[1]; });
  return { H: H, W: W, N: N, items: items, dangerous: dangerous };
}

/* ================= EXERCISE FLOW ================= */
var GRADERS = {
  qcm: function(ex, st){ return gQCM(ex, st, false); },
  qmul: function(ex, st){ return gQCM(ex, st, true); },
  match: gMatch, drop: gDrop, order: gOrder, rank: gOrder, fill: gFill, log: gLog,
  branch: gBranch, term: gTerm
};
var RENDERERS = {
  qcm: function(ex, st){ return wQCM(ex, st, false); },
  qmul: function(ex, st){ return wQCM(ex, st, true); },
  match: wMatch, drop: wDrop, order: function(ex, st){ return wOrder(ex, st, false); },
  rank: function(ex, st){ return wOrder(ex, st, true); },
  fill: wFill, log: wLog, branch: wBranch, term: wTerm
};
var TYPE_LABELS = { qcm: 'Multiple choice', qmul: 'Multiple select', match: 'Matching', drop: 'Drag & drop',
  order: 'Ordering', rank: 'Prioritising', fill: 'Fill the blanks', log: 'Log analysis', branch: 'Decision tree', term: 'Query editor' };

function isBranchReady(ex, st){ return ex.t === 'branch' ? wBranchReady(ex, st) : true; }

function renderExercise(){
  var ex = EXERCISES[S.queue[S.idx].i];
  S.cur = { ex: ex, st: { data: {}, locked: false }, feedbackOpen: false };
  var host = $('#exercisehost');
  host.innerHTML = '';
  host.appendChild(el('p', 'small-note', 'Exercise type: ' + TYPE_LABELS[ex.t] + (ex.multiEl ? ' · multi-item, scored with partial credit' : '')));
  var sc = renderScenario(ex);
  if (ex.s.sum) collapser(sc, ex.s.sum);
  host.appendChild(sc);
  host.appendChild(renderQuestion(ex));
  host.appendChild(answerShell());
  /* widget is built after the shell is mounted so it can reach #btncheck */
  var widget = RENDERERS[ex.t](ex, S.cur.st);
  $('#widgetslot').appendChild(widget);
  $('#btncheck').onclick = onCheck;
  /* branch: enable check only when all steps answered */
  if (ex.t === 'branch'){
    var poll = setInterval(function(){
      var b = $('#btncheck');
      if (!b || !S.cur || S.cur.ex !== ex){ clearInterval(poll); return; }
      b.disabled = !wBranchReady(ex, S.cur.st) || S.cur.st.locked;
    }, 300);
  }
  renderExamBar();
  var fb = $('#fbhost'); if (fb) fb.remove();
}

function onCheck(){
  if (!S.cur || S.cur.st.locked) return;          /* already checked */
  if (S.answered[curKey()]) return;               /* double-fire guard */
  if (S.timer.state === 'ENDED') return;          /* time is over */
  var ex = S.cur.ex, st = S.cur.st;
  if (!anyAnswer(ex, st) || (ex.t === 'branch' && !wBranchReady(ex, st))) return;
  /* 1. timer: Check-triggered auto-pause FIRST (spec) */
  if (S.timer.state === 'RUNNING') Timer.set('PAUSED_AUTO_CHECK');
  /* 2. grade */
  st.locked = true;
  var g = GRADERS[ex.t](ex, st);
  var credit = scoreExercise(g.H, g.W, g.N);
  if (S.hintUsed[curKey()]) credit = Math.max(0, credit - 0.10);
  var k = curKey();
  S.answered[k] = true;
  S.credits[k] = credit;
  S.creditSum += credit; S.answeredCount++;
  renderFeedback(ex, g, credit);
  if (ex.t === 'term'){
    var ti = document.querySelector('#widgetslot input');
    if (ti) ti.disabled = true;
  }
  updateScore(); updateProgress(); renderExamBar();
  S.cur.feedbackOpen = true;
  $('#btncheck').disabled = true;
  var fb = $('#fbblk'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function optRow(label, status, clsOverride){
  var map = { correct: ['✓', 'Correct', 'st-correct'], wrong: ['✗', 'Wrong', 'st-wrong'], missed: ['○', 'Missed', 'st-missed'], info: ['ℹ', 'Note', 'st-info'] };
  var m = map[status] || map.info;
  var r = el('div', 'irow ' + (clsOverride || m[2]));
  r.innerHTML = '<span class="st" aria-label="' + m[1] + '"><span aria-hidden="true">' + m[0] + '</span><span class="word">' + m[1] + '</span></span><span>' + label + '</span>';
  return r;
}

function renderFeedback(ex, g, credit){
  var host = $('#exercisehost');
  var fb = el('div', 'blk feedback');
  fb.id = 'fbblk';
  var full = credit >= 0.999, zero = credit <= 0.001;
  var cls = full ? '' : (zero ? ' f-incorrect' : ' f-partial');
  fb.className = 'blk feedback' + cls;
  var label = full ? 'CORRECT' : (zero ? 'INCORRECT' : 'PARTIALLY CORRECT');
  var icon = full ? '✓' : (zero ? '✗' : '✓');
  var creditLine = 'credit ' + credit.toFixed(2) + ' — ' + g.H + '/' + g.N + ' items' +
    (S.hintUsed[curKey()] ? ' · includes −0.10 hint penalty' : '');
  fb.appendChild(el('h3', null, '<span aria-hidden="true">' + icon + '</span> ' + label +
    ' <span class="fb-credit">(' + esc(creditLine) + ')</span>'));
  var body = el('div', 'blk-body');
  if (g.dangerous && g.dangerous.length){
    var dw = el('div', 'irow st-wrong');
    dw.innerHTML = '<span class="st"><span aria-hidden="true">✗</span><span class="word">Dangerous — near miss</span></span><span>' + g.dangerous.map(esc).join(' ') + '</span>';
    body.appendChild(dw);
  }
  if (g.items && g.items.length){
    var rows = el('div', 'itemrows');
    g.items.forEach(function(it){ rows.appendChild(optRow(esc(it.label), it.status)); });
    body.appendChild(rows);
  }
  if (ex.t === 'term'){
    var cb = el('div', 'codeblock');
    cb.innerHTML = '<button class="btn small copybtn" type="button">Copy</button>' + esc(ex.canon);
    cb.querySelector('.copybtn').onclick = function(){
      try {
        var ta = document.createElement('textarea'); ta.value = ex.canon;
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        this.textContent = 'Copied ✓';
      } catch (e) { this.textContent = 'Select & copy manually'; }
    };
    body.appendChild(el('p', null, '<strong>Canonical query:</strong>'));
    body.appendChild(cb);
    if (ex.out){
      var ob = el('div', 'codeblock'); ob.textContent = ex.out;
      body.appendChild(el('p', null, '<strong>Output shape you would see:</strong>'));
      body.appendChild(ob);
    }
  }
  var xp = el('div');
  xp.innerHTML = ex.x;
  body.appendChild(xp);
  if (!full) body.appendChild(el('p', null, '<span class="small-note">📌 What to study: re-read the “' + esc(studyAnchor(ex)) + '” idea in the intro section “What you will learn here”, then retake later.</span>'));
  /* correct answer statement for single-answer types */
  if ((ex.t === 'qcm' || ex.t === 'log') && !full){
    var corr = ex.t === 'qcm' ? ex.opts.filter(function(o){ return o[1] === 1; }).map(function(o){ return o[0]; }).join(', ') : (ex.targetText || ('line ' + (ex.target + 1)));
    body.appendChild(el('p', null, '<strong>The correct answer:</strong> ' + esc(corr)));
  }
  /* nav buttons */
  var nav = el('div', 'startrow');
  var last = S.idx >= S.queue.length - 1;
  var nxt = el('button', 'btn primary', last ? '⏹ Finish exam' : 'Next ▶');
  nxt.id = 'btnnext';
  nxt.onclick = onNext;
  nav.appendChild(nxt);
  var autoNote = el('span', 'badge state-paused', '<span aria-hidden="true">⏸</span> Timer paused — reviewing feedback. It resumes when you press ' + (last ? 'Finish' : 'Next') + '.');
  nav.appendChild(autoNote);
  body.appendChild(nav);
  fb.appendChild(body);
  host.appendChild(fb);
}
function studyAnchor(ex){
  var map = { qcm: 'detection logic', qmul: 'detection logic', match: 'telemetry and log sources', drop: 'what the strategy watches',
    order: 'behaviour chain', rank: 'alert triage', fill: 'mutable elements', log: 'log sources', branch: 'alert triage', term: 'detection engineering' };
  return map[ex.t] || 'detection strategy';
}

function onNext(){
  Timer.resumeFromAuto();          /* PAUSED_AUTO_CHECK -> RUNNING (records duration) */
  /* advance to the next UNANSWERED exercise — after returning from the
     skipped pool, the next slot in the queue may already be answered */
  do { S.idx++; } while (S.idx < S.queue.length && S.answered[S.queue[S.idx].i]);
  if (S.idx >= S.queue.length){ openReviewSkipped(true); return; }
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onSkip(){
  if (S.answered[curKey()]) return;
  S.skipped[curKey()] = true;
  S.breakItems[curKey()] = true;
  if (S.idx >= S.queue.length - 1){ openReviewSkipped(true); return; }
  S.idx++;
  renderExercise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= REVIEW SKIPPED ================= */
function openReviewSkipped(fromFlow){
  Timer.resumeFromAuto();            /* never sit in the review pool while the auto-pause is active */
  if (S.cur) S.cur.feedbackOpen = false;
  var keys = Object.keys(S.skipped).filter(function(k){ return !S.answered[k]; });
  var host = $('#exercisehost');
  host.innerHTML = '';
  var blk = el('div', 'blk');
  blk.appendChild(el('h3', null, '<span aria-hidden="true">⚠</span> Review skipped exercises'));
  var body = el('div', 'blk-body');
  if (!keys.length){
    body.appendChild(el('p', null, 'No skipped exercises are waiting. You can submit your final results.'));
  } else {
    body.appendChild(el('p', null, 'These exercises were skipped without an answer. They are <strong>excluded from your score</strong> unless you answer them now. You can return to them as many times as you need while the timer is running.'));
    keys.forEach(function(k){
      var ex = EXERCISES[parseInt(k, 10)];
      var row = el('div', 'skipitem');
      row.innerHTML = '<span class="badge state-skipped"><span aria-hidden="true">⚠</span> Skipped</span><span class="sq">' + esc(ex.s.sum || ex.q) + '</span>';
      var canAnswer = S.timer.state !== 'ENDED';
      var btn = el('button', 'btn small primary', '↩ Answer this');
      btn.disabled = !canAnswer;
      btn.title = canAnswer ? 'Return to this exercise (timer keeps running)' : 'The timer has ended — this exercise stays excluded';
      btn.onclick = function(){
        S.idx = S.queue.findIndex(function(q){ return q.i === parseInt(k, 10); });
        delete S.skipped[k];
        Timer.resumeFromAuto();
        if (S.timer.state !== 'RUNNING' && S.timer.state !== 'PAUSED_AUTO_CHECK' && S.timer.state !== 'ENDED') Timer.set('RUNNING');
        renderExercise();
        window.scrollTo({ top: 0 });
      };
      row.appendChild(btn);
      body.appendChild(row);
    });
  }
  var nav = el('div', 'startrow');
  var sub = el('button', 'btn primary', '⏹ Submit final results');
  sub.onclick = function(){ finalizeExam(false); };
  nav.appendChild(sub);
  var back = el('button', 'btn ghost', '◀ Back to exam');
  back.onclick = function(){
    if (S.timer.state === 'ENDED'){ finalizeExam(false); return; }
    var nextIdx = S.queue.findIndex(function(q){ return !S.answered[q.i]; });
    if (nextIdx === -1){ openReviewSkipped(true); return; }
    S.idx = nextIdx;
    renderExercise();
    window.scrollTo({ top: 0 });
  };
  nav.appendChild(back);
  body.appendChild(nav);
  blk.appendChild(body);
  host.appendChild(blk);
  window.scrollTo({ top: 0 });
  renderExamBar();
}

/* ================= RESULTS ================= */
function finalizeExam(auto){
  /* bank any open pause segment so both pause totals are complete */
  if (S.timer.state === 'PAUSED_MANUAL'){
    S.timer.manualTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  } else if (S.timer.state === 'PAUSED_AUTO_CHECK'){
    S.timer.autoTotal += Math.round((Date.now() - S.timer.pauseStart) / 1000);
  }
  Timer.stop();
  Timer.set('ENDED');
  /* never-answered exercises are excluded (skipped pool) */
  S.queue.forEach(function(q){ if (!S.answered[q.i]) S.skipped[q.i] = true; });
  var fully = 0, partial = 0, partialCredits = 0, incorrect = 0, skippedN = 0;
  Object.keys(S.answered).forEach(function(k){
    var c = S.credits[k];
    if (c >= 0.999) fully++;
    else if (c > 0.001){ partial++; partialCredits += c; }
    else incorrect++;
  });
  Object.keys(S.skipped).forEach(function(k){ if (!S.answered[k]) skippedN++; });
  var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
  var passed = pct >= INTRO.passMark;
  var host = $('#view-results');
  host.innerHTML = '';
  var card = el('div', 'card intro-strip');
  card.appendChild(el('h2', null, esc(INTRO.objId) + ' — ' + esc(INTRO.sev) + ' exam results'));
  var panel = el('div', passed ? 'passpanel' : 'failpanel');
  panel.innerHTML = '<div class="t">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>' +
    '<div class="pct">' + pct + '%</div>' +
    '<p class="small-note">' + S.creditSum.toFixed(1) + ' credit points over ' + S.answeredCount + ' answered exercise' + (S.answeredCount === 1 ? '' : 's') +
    ' · pass mark ' + INTRO.passMark + '%' +
    (auto ? ' · time ran out — unanswered exercises were excluded' : '') + '</p>' +
    '<p>' + (passed
      ? 'Well done. You showed solid command of the ' + esc(INTRO.objId) + ' detection strategy at this level. Move on to the next severity when you feel ready.'
      : 'Not this time. Study the feedback you collected during the exam, then press Retake — the exercises will be shuffled.') + '</p>';
  card.appendChild(panel);
  var grid = el('div', 'resgrid');
  function rbox(num, lbl, cls){
    var b = el('div', 'resbox');
    b.innerHTML = '<div class="num">' + num + '</div><div class="lbl ' + (cls || '') + '">' + lbl + '</div>';
    return b;
  }
  grid.appendChild(rbox(fully, '<span aria-hidden="true">✓</span> Fully correct', 'state-correct'));
  grid.appendChild(rbox(partial + (partial ? ' <small>(avg ' + (partialCredits / partial).toFixed(2) + ')</small>' : ''), '<span aria-hidden="true">✓</span> Partially correct', 'state-partial'));
  grid.appendChild(rbox(incorrect, '<span aria-hidden="true">✗</span> Fully incorrect', 'state-incorrect'));
  grid.appendChild(rbox(skippedN + (skippedN ? ' <small>(excluded)</small>' : ''), '<span aria-hidden="true">⚠</span> Skipped — excluded', 'state-skipped'));
  card.appendChild(grid);
  card.appendChild(el('p', null, '<strong>Time</strong>: ' + fmtTime(TIMER_BUDGET - S.timer.remaining) + ' on the clock · ' +
    'paused ' + fmtTime(S.timer.manualTotal) + ' for manual breaks · paused ' + fmtTime(S.timer.autoTotal) + ' while reviewing feedback.'));
  var nav = el('div', 'startrow');
  var rt = el('button', 'btn primary', '↻ Retake exam');
  rt.onclick = retake;
  nav.appendChild(rt);
  card.appendChild(nav);
  host.appendChild(card);
  $('#view-exam').classList.add('hidden');
  $('#view-intro').classList.add('hidden');
  host.classList.remove('hidden');
  window.scrollTo({ top: 0 });
  reportScore(S.creditSum, S.answeredCount);
}

function retake(){
  S.queue = []; S.idx = 0; S.answered = {}; S.credits = {}; S.hintUsed = {}; S.skipped = {};
  S.creditSum = 0; S.answeredCount = 0; S.reported = false; S.cur = null;
  S.breakItems = {};
  S.timer.manualTotal = 0; S.timer.autoTotal = 0; S.timer.pauseStart = 0;
  $('#view-results').classList.add('hidden');
  $('#view-exam').classList.remove('hidden');
  startExam();
}

/* ================= SITE INTEGRATION ================= */
/* Receives the fractional sum and the answered count; rounding happens only
   here, once per attempt, and the on-screen percent uses the same formula. */
function reportScore(sum, count){
  if (S.reported) return;
  S.reported = true;
  var percent = count > 0 ? Math.round((sum / count) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: INTRO.topicId,
      batch: INTRO.batch,
      score: Math.round(sum),
      total: count,
      percent: percent,
      passed: percent >= INTRO.passMark
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user.username = event.data.username || '';
  S.user.country = event.data.country || '';
  S.user.locale = event.data.locale || '';
  S.user.topicId = event.data.topicId || '';
  S.user.batch = (typeof event.data.batch === 'number') ? event.data.batch : null;
  if (!$('#view-intro').classList.contains('hidden')) renderIntro();
});

/* ================= INTRO ================= */
function renderIntro(){
  var v = $('#view-intro');
  v.innerHTML = '';
  var strip = el('div', 'card intro-strip');
  strip.appendChild(el('h1', null, esc(INTRO.title)));
  strip.appendChild(el('p', 'objline', '<strong>' + esc(INTRO.objId) + ' — ' + esc(INTRO.objName) + '</strong> · MITRE ATT&CK ' + esc(INTRO.objType)));
  var row = el('div', 'badgerow');
  row.innerHTML =
    '<span class="badge sev"><span class="dot" aria-hidden="true"></span> ' + esc(INTRO.sev) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🧩</span> ' + INTRO.count + ' exercises</span>' +
    '<span class="badge"><span aria-hidden="true">⏱</span> Estimated time: ' + INTRO.minutes + ' min</span>' +
    '<span class="badge"><span aria-hidden="true">⏳</span> Timer budget: ' + fmtTime(INTRO.minutes * 60) + '</span>' +
    '<span class="badge"><span aria-hidden="true">🎯</span> Pass mark: ' + INTRO.passMark + '%</span>' +
    (S.user.username ? '<span class="badge"><span aria-hidden="true">👤</span> ' + esc(S.user.username) + '</span>' : '');
  strip.appendChild(row);
  v.appendChild(strip);

  var learn = el('div', 'card');
  learn.appendChild(el('h2', null, 'What you will learn here'));
  INTRO.learn.forEach(function(p){
    var pe = el('p'); pe.innerHTML = p; learn.appendChild(pe);
  });
  v.appendChild(learn);

  var kw = el('div', 'card');
  kw.appendChild(el('h2', null, 'Keywords covered in this exam'));
  INTRO.keywords.forEach(function(th){
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var chips = el('div', 'chips');
    th.items.forEach(function(it){ chips.appendChild(el('span', 'kchip', esc(it))); });
    t.appendChild(chips);
    kw.appendChild(t);
  });
  v.appendChild(kw);

  var how = el('div', 'card');
  how.appendChild(el('h2', null, 'How this exam works'));
  var ul = el('ul', 'rules');
  INTRO.how.forEach(function(r){ var li = el('li'); li.innerHTML = r; ul.appendChild(li); });
  how.appendChild(ul);
  var startrow = el('div', 'startrow');
  var start = el('button', 'btn primary', '▶ Start the exam');
  start.id = 'btnstart';
  startrow.appendChild(start);
  startrow.appendChild(el('span', 'small-note', 'The exercises arrive in a random order. Good luck, analyst.'));
  how.appendChild(startrow);
  v.appendChild(how);
  start.onclick = function(){
    $('#view-intro').classList.add('hidden');
    $('#view-exam').classList.remove('hidden');
    startExam();
  };
}

/* ================= INIT ================= */
function startExam(){
  S.queue = shuffle(EXERCISES.map(function(ex, i){ return { i: i }; }));
  S.idx = 0;
  Timer.start();
  renderExercise();
}
renderIntro();

</script>
