<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints of the palette above (single source of truth) */
  --bg-hover:#182238;
  --bg-hover-2:#223154;
  --bg-chip:#1b2a4a;
  --bg-page-96:rgba(11,16,32,.96);
  --bg-page-ov:rgba(11,16,32,.97);
  --tint-blue-05:rgba(90,169,255,.045);
  --tint-blue-07:rgba(90,169,255,.07);
  --tint-blue-08:rgba(90,169,255,.08);
  --tint-blue-10:rgba(90,169,255,.10);
  --tint-amber-07:rgba(255,180,84,.07);
  --tint-amber-08:rgba(255,180,84,.08);
  --tint-amber-12:rgba(255,180,84,.12);
  --tint-amber-28:rgba(255,180,84,.28);
  --tint-amber-40:rgba(255,180,84,.40);
  --tint-amber-45:rgba(255,180,84,.45);
  --tint-green-07:rgba(87,211,140,.07);
  --tint-green-08:rgba(87,211,140,.08);
  --tint-red-07:rgba(255,107,107,.07);
  --tint-red-08:rgba(255,107,107,.08);
  --tint-grey-08:rgba(169,180,208,.08);
  --tint-white-02:rgba(255,255,255,.02);
  --sheen:rgba(255,255,255,.22);
  --btn-p1:#1d3a6b;--btn-p2:#17325e;--btn-pb:#2e5ea8;
  --btn-ph1:#234a8c;--btn-ph2:#1c3f77;
  --btn-g1:#14522f;--btn-g2:#124826;--btn-gb:#2c7a4b;
  --btn-gh1:#19653b;--btn-gh2:#175a30;
  --danger-border:#7a2e2e;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,code,pre{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
a{color:var(--accent-blue)}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
/* ---------- header strip ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--bg-page-96);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
}
.hdr-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hdr .cell{display:flex;align-items:center;gap:6px;min-height:34px}
.hdr .lab{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hdr .val{font-weight:700;font-size:15px}
.hdr .score-sum{color:var(--text-primary);font-weight:800}
.hdr .mono{font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:999px;
  padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;
  background:var(--bg-surface);min-height:28px;
}
.badge .dot{width:9px;height:9px;border-radius:50%}
.sev-easy{color:var(--sev-easy)}.sev-easy .dot{background:var(--sev-easy)}
.sev-medium{color:var(--sev-medium)}.sev-medium .dot{background:var(--sev-medium)}
.sev-hard{color:var(--sev-hard)}.sev-hard .dot{background:var(--sev-hard)}
.sev-extreme{color:var(--sev-extreme)}.sev-extreme .dot{background:var(--sev-extreme)}
.tstate{font-weight:700;font-size:13px}
.tstate.run{color:var(--accent-blue)}
.tstate.pman,.tstate.pauto{color:var(--state-paused)}
.tstate.end{color:var(--state-skipped)}
/* ---------- progress bar ---------- */
.bar{
  position:relative;height:6px;background:var(--bg-surface-2);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.bar-fill{
  height:100%;width:0%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--accent-blue),var(--sev-col,var(--accent-green)));
  transition:width .5s ease;
  position:relative;overflow:hidden;
}
.bar-fill::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 3.2s linear infinite;
}
@keyframes sheen{to{left:120%}}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--bg-surface);color:var(--text-primary);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--btn-p1),var(--btn-p2));border-color:var(--btn-pb)}
.btn.primary:hover{background:linear-gradient(135deg,var(--btn-ph1),var(--btn-ph2))}
.btn.green{background:linear-gradient(135deg,var(--btn-g1),var(--btn-g2));border-color:var(--btn-gb)}
.btn.green:hover{background:linear-gradient(135deg,var(--btn-gh1),var(--btn-gh2))}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger-border);color:var(--state-incorrect)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:4px 12px;font-size:13px}
/* ---------- cards & blocks ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px 18px;
  margin:14px 0;
}
.blk{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.blk-h{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.blk.scenario{border-left-color:var(--accent-blue)}
.blk.scenario .blk-h{color:var(--accent-blue);background:var(--tint-blue-08)}
.blk.question{border-left-color:var(--accent-amber)}
.blk.question .blk-h{color:var(--accent-amber);background:var(--tint-amber-08)}
.blk.answer{border-left-color:var(--accent-green)}
.blk.answer .blk-h{color:var(--accent-green);background:var(--tint-green-08)}
.blk-b{padding:14px 16px;background:var(--bg-surface)}
.blk.scenario .blk-b{background:linear-gradient(0deg,var(--tint-blue-05),var(--tint-blue-05)),var(--bg-surface)}
.qtext{font-weight:700;font-size:16.5px;margin:0}
.sc-sum{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:8px 14px;font-size:13px;cursor:pointer;min-height:44px;
}
.sc-sum:hover{color:var(--text-primary)}
.sc-sum .caret{margin-left:auto;transition:transform .2s ease}
.sc-sum[aria-expanded="true"] .caret{transform:rotate(90deg)}
.sc-body{padding:12px 16px 16px}
.sc-body p{margin:.4em 0 1em}
/* ---------- artefacts ---------- */
.art{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  margin:10px 0;
  overflow:hidden;
}
.art-lab{
  display:block;padding:6px 12px;
  color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.06em;
  border-bottom:1px solid var(--border);
  background:var(--tint-white-02);
}
.art-b{padding:10px 12px;overflow-x:auto}
.art-b.plain{font-size:15px}
.art-b pre{margin:0;font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre}
/* ---------- syntax highlight tokens ---------- */
.tk-k{color:var(--accent-blue);font-weight:700}
.tk-s{color:var(--accent-amber)}
.tk-n{color:var(--accent-green)}
.tk-i{color:var(--state-paused)}
.tk-c{color:var(--text-secondary);font-style:italic}
.tk-w{color:var(--state-incorrect);font-weight:700}
/* ---------- log viewer ---------- */
.logbox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.logbar input{
  flex:1;background:var(--bg-page);border:1px solid var(--border);color:var(--text-mono);
  border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;
}
.logbar .cnt{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.loglines{max-height:320px;overflow:auto;padding:8px 10px}
.loglines pre{margin:0;font-size:14px;line-height:1.55;color:var(--text-mono);white-space:pre;overflow-x:auto}
.loglines .ln-no{color:var(--text-secondary);opacity:.7;margin-right:10px}
.loglines mark{background:var(--tint-amber-28);color:var(--text-primary);border-radius:2px;padding:0 1px}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text-primary);cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;min-height:44px;
  transition:background .12s ease,border-color .12s ease;
}
.opt:hover{background:var(--bg-hover)}
.opt .opt-k{
  flex:0 0 auto;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-chip);border:1px solid var(--border);
  font-weight:800;font-size:13px;color:var(--text-secondary);
}
.opt.sel{border-color:var(--accent-blue);background:var(--tint-blue-10);box-shadow:inset 3px 0 0 var(--accent-blue)}
.opt.sel .opt-k{background:var(--accent-blue);color:var(--bg-page);border-color:var(--accent-blue)}
.opt.sel::after{content:"Selected";margin-left:auto;color:var(--accent-blue);font-size:12px;font-weight:800;white-space:nowrap;padding-top:3px}
.opt.good{border-color:var(--state-correct)}
.opt.bad{border-color:var(--state-incorrect)}
.opt.locked{cursor:default;pointer-events:none}
/* ---------- drag & drop ---------- */
.dnd{display:grid;grid-template-columns:1fr 300px;gap:14px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-content:start}
.zone{
  background:var(--bg-surface-2);border:1.5px dashed var(--border);border-radius:8px;
  padding:10px;min-height:74px;display:flex;flex-direction:column;gap:8px;
}
.zone.over{border-color:var(--accent-green);background:var(--tint-green-07)}
.zone-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.bank{
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start;
}
.bank-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.chip{
  background:var(--bg-chip);border:1px solid var(--border);border-radius:7px;
  padding:9px 12px;font-size:14.5px;cursor:grab;user-select:none;min-height:44px;
  display:flex;align-items:center;gap:8px;
}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--accent-blue);box-shadow:inset 3px 0 0 var(--accent-blue)}
.chip .pickword{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent-blue);text-transform:uppercase}
.chip.dragging{opacity:.55}
.zone .chip{cursor:grab}
/* ---------- order / rank ---------- */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:48px;
}
.orow.dragover{border-color:var(--accent-green)}
.orow .pos{
  flex:0 0 30px;height:30px;border-radius:6px;background:var(--bg-chip);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-secondary);
}
.orow .ot{flex:1;font-size:15px}
.orow .mv{display:flex;gap:6px}
.mv button{
  min-width:44px;min-height:44px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg-hover);color:var(--text-primary);font-size:16px;cursor:pointer;font-weight:800;
}
.mv button:hover{background:var(--bg-hover-2)}
/* ---------- match / fill ---------- */
.pair{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1.2fr);gap:10px;align-items:center;margin-bottom:10px}
.pair .pt{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:44px;display:flex;align-items:center}
select.fill-sel,select.pair-sel{
  background:var(--bg-page);color:var(--text-mono);border:1px solid var(--border);
  border-radius:6px;padding:9px 10px;font-size:14px;min-height:44px;max-width:100%;
}
.filltext{font-size:16px;line-height:2.05}
.filltext select{margin:0 3px}
.bankchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bankchips .chip{cursor:default;min-height:44px;padding:6px 10px;font-size:13.5px}
/* ---------- query editor ---------- */
.qed{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qed-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.qed-bar .prompt{color:var(--accent-green);font-weight:800;font-size:13px}
.qed textarea{
  width:100%;min-height:110px;background:transparent;border:none;color:var(--text-mono);
  font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;
}
.qed textarea:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px}
.copyrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
/* ---------- decision steps ---------- */
.stepbadge{
  display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber-12);
  color:var(--accent-amber);border:1px solid var(--tint-amber-40);
  border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:800;letter-spacing:.05em;margin-bottom:8px;
}
/* ---------- triage queue ---------- */
.alertq{display:flex;flex-direction:column;gap:12px}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.alert-card .at{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-card .at .prio{font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;padding:1px 7px;color:var(--text-secondary)}
.alert-card .ab{color:var(--text-secondary);font-size:14px;margin:6px 0 10px}
.alert-card .asel{display:flex;flex-wrap:wrap;gap:8px}
.asel label{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;
  background:var(--bg-page);padding:8px 12px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.asel label:hover{background:var(--bg-hover)}
.asel input{accent-color:var(--accent-blue)}
.asel label.on{border-color:var(--accent-blue);background:var(--tint-blue-10)}
/* ---------- hint ---------- */
.hintp{
  border:1px solid var(--tint-amber-45);border-left:3px solid var(--accent-amber);
  background:var(--tint-amber-07);border-radius:8px;padding:10px 14px;margin:12px 0;
  color:var(--text-primary);font-size:15px;
}
.hintp .ht{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
/* ---------- feedback ---------- */
.feed{border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.feed-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.feed.ok{border-left-color:var(--state-correct)}
.feed.ok .feed-h{color:var(--state-correct);background:var(--tint-green-08)}
.feed.part{border-left-color:var(--state-partial)}
.feed.part .feed-h{color:var(--state-partial);background:var(--tint-amber-08)}
.feed.bad{border-left-color:var(--state-incorrect)}
.feed.bad .feed-h{color:var(--state-incorrect);background:var(--tint-red-08)}
.feed.skipf{border-left-color:var(--state-skipped)}
.feed.skipf .feed-h{color:var(--state-skipped);background:var(--tint-grey-08)}
.feed-b{padding:12px 16px}
.creditline{font-weight:800;margin:2px 0 10px;font-size:14.5px}
.itms{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.itm{display:flex;gap:9px;align-items:flex-start;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px}
.itm .ic{font-weight:800;flex:0 0 auto}
.itm.correct{color:var(--state-correct)}
.itm.wrong{color:var(--state-incorrect)}
.itm.missed{color:var(--state-skipped)}
.itm .why{color:var(--text-secondary);font-size:13.5px}
.feed .explain{font-size:15px;margin:8px 0}
.feed .study{
  margin-top:10px;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;
  color:var(--text-secondary);font-size:14px;
}
.feed .study b{color:var(--accent-amber)}
.canon{margin-top:10px}
/* ---------- paused overlay ---------- */
.pauseov{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:var(--bg-page-ov);
}
.pauseov .pcard{
  background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);
  padding:26px 34px;text-align:center;color:var(--state-paused);box-shadow:var(--shadow);max-width:440px;
}
.pauseov .pcard .big{font-size:20px;font-weight:800;margin:10px 0 6px}
.pauseov .pcard .sub{color:var(--text-secondary);font-size:14px;margin-bottom:16px}
/* ---------- intro ---------- */
.intro-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.intro-head .t{font-size:20px;font-weight:800;flex:1 1 320px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px}
.facts .f{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary)}
.facts .f b{color:var(--text-primary)}
.kw-theme{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--bg-surface-2)}
.kw-theme .kt{color:var(--accent-blue);font-weight:800;font-size:13.5px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kw-items{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.kw-items .chip{cursor:default;min-height:44px;padding:4px 11px;font-size:13px;background:var(--tint-blue-07)}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{
  position:relative;padding:7px 0 7px 4px;font-size:15px;color:var(--text-primary);
  border-bottom:1px dashed var(--border);
}
.rules li:last-child{border-bottom:none}
.rules li .ric{color:var(--accent-green);font-weight:800;margin-right:7px}
.center{display:flex;justify-content:center;margin-top:18px}
/* ---------- review / results ---------- */
.skiprow{display:flex;align-items:center;gap:12px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0}
.skiprow .st{flex:1;font-size:14.5px}
.skiprow .sicon{color:var(--state-skipped);font-weight:800}

var META = {"topicId": "det0329", "batch": 1, "title": "DET0329 Behavioral Detection for T1490 — Inhibit System Recovery — EASY", "difficulty": "easy", "questionCount": 16, "estimatedMinutes": 30, "passMark": 70, "pageTitle": "DET0329 — EASY practice exam", "objectId": "DET0329", "objectName": "Behavioral Detection for T1490 — Inhibit System Recovery", "objectType": "Detection Strategy / Analytic", "timerSeconds": 1800};
var INTRO = {"learn": ["Welcome! In this practice exam you will learn about DET0329, a detection strategy from the MITRE ATT&CK framework. A detection strategy is a plan that tells defenders which data to collect and which behaviour in that data means an attacker technique is happening. DET0329 watches for one specific technique: T1490 — Inhibit System Recovery.", "What is T1490? Imagine an attacker gets into a company computer. The computer has safety nets: restore points, shadow copies (automatic file snapshots Windows keeps), backup catalogs, and a repair mode. T1490 is when the attacker deletes or turns off these safety nets, usually right before ransomware encrypts files. If the safety nets are gone, the victim cannot restore files for free, so the attacker has more power.", "DET0329 is a Detection Strategy / Analytic object in ATT&CK. Its role is to describe HOW to detect T1490 behaviour. It contains five analytics: AN0933 for Windows, AN0934 for Linux, AN0935 for ESXi (a server that runs virtual machines), AN0936 for network devices, and AN0937 for cloud (IaaS) environments. Each analytic says which log sources to read and what patterns to look for.", "Who uses this object in real work? SOC analysts see its alerts during shift and triage them. Detection engineers build and tune these analytics in the SIEM (the big log-search tool). Threat hunters use the same logic to search logs when there is no alert. Incident responders check backup health when they suspect ransomware. CTI analysts explain the technique in reports. GRC analysts and control owners make sure backups exist and are protected.", "The risks it addresses are big: ransomware groups like Akira, BlackCat, and Conti delete shadow copies and backup catalogs before they encrypt data. If a company detects this behaviour early, it can protect its backups and stop a disaster. In this exam you will learn the utility names, the log sources, the platforms, and the basic decisions an analyst makes when this alert fires."], "keywords": [{"theme": "The detected technique", "items": ["T1490 — Inhibit System Recovery", "Impact tactic", "Availability impact", "Ransomware preparation step"]}, {"theme": "Analytics by platform", "items": ["AN0933 — Windows", "AN0934 — Linux", "AN0935 — ESXi", "AN0936 — Network devices", "AN0937 — IaaS (cloud)"]}, {"theme": "Utilities the Windows analytic watches", "items": ["vssadmin", "wbadmin", "diskshadow", "bcdedit", "REAgentC", "wmic"]}, {"theme": "Log sources", "items": ["WinEventLog:Sysmon EventCode=1", "Microsoft-Windows-Backup", "System log", "auditd:SYSCALL", "esxi:hostd", "networkdevice:syslog", "AWS:CloudTrail"]}, {"theme": "Data components", "items": ["DC0032 Process Creation", "DC0040 File Deletion", "DC0041 Service Metadata", "DC0063 Registry Key Modification", "DC0064 Command Execution", "DC0049 Snapshot Deletion", "DC0022 Cloud Storage Deletion"]}, {"theme": "Basic triage ideas", "items": ["Confirm the alert", "Check the change ticket", "Escalate to IR", "Protect the backups"]}], "rules": ["The pass mark is 70%. You pass if your final score is 70% or more over the exercises you actually answered.", "Exercise types in this file: matching, drag & drop, fill-in-the-blank, a log viewer, spot-the-mistake, an alert queue, and a few multiple-choice questions.", "The timer counts down from 30 minutes. Press Pause to take a break — the exercise is hidden and the timer stops until you press Resume.", "When you press Check, the timer stops automatically so you can read the feedback without stress. It starts again when you press Next.", "Exercises with several correct items give partial credit. Wrong picks subtract from right picks, so selecting everything is not a good idea.", "A hint costs 10% of that exercise's credit. You can use one hint per exercise.", "You can skip any exercise with the Skip button. Before you finish, you will get a screen to go back to skipped exercises. Skipped exercises that stay unanswered are excluded from the score."]};
var EXERCISES = [{"id": "E01", "type": "match", "title": "Match each platform to its DET0329 analytic", "summary": "Five analytics, five platforms", "scenario": "DET0329 is one detection strategy, but attackers hit different kinds of systems. So the strategy has one analytic per platform. Each analytic has its own ID and its own log sources. Look at the ATT&CK page of DET0329: the Analytics table lists AN0933 to AN0937, one per row, with the platform name next to it.\n\nYour team lead asks you to memorise this mapping before your first shift, because alerts carry the analytic ID, and you must know instantly which platform an alert is about.", "question": "Match each analytic ID to the platform it covers.", "hint": "AN0933 is the first one and covers the most common desktop and server operating system. The last one, AN0937, is about cloud API calls.", "explanation": "AN0933 covers Windows, AN0934 covers Linux, AN0935 covers ESXi (the hypervisor that runs virtual machines), AN0936 covers network devices, and AN0937 covers IaaS cloud environments. This mapping is the first thing to remember about DET0329: one strategy, five platform analytics. When an alert says AN0935, you know immediately that something deleted VM snapshots on an ESXi host.", "study": "Re-read the Analytics table on the DET0329 page: five rows, five platforms.", "left": [{"id": "L1", "t": "AN0933", "match": "R1"}, {"id": "L2", "t": "AN0934", "match": "R2"}, {"id": "L3", "t": "AN0935", "match": "R3"}, {"id": "L4", "t": "AN0936", "match": "R4"}, {"id": "L5", "t": "AN0937", "match": "R5"}], "right": [{"id": "R1", "t": "Windows"}, {"id": "R2", "t": "Linux"}, {"id": "R3", "t": "ESXi"}, {"id": "R4", "t": "Network devices"}, {"id": "R5", "t": "IaaS (cloud)"}]}, {"id": "E02", "type": "qcm", "title": "Which technique does DET0329 detect?", "summary": "The strategy page names one technique", "scenario": "You open the ATT&CK page for detection strategy DET0329. At the top, next to the strategy ID and version, there is a line called Technique Detected. Your mentor tells you: always read that line first, because it anchors the whole strategy — every analytic inside it exists to catch behaviour of that one technique.", "question": "Which technique does DET0329 detect?", "hint": "The technique is about destroying the safety nets that let a victim restore a system.", "explanation": "DET0329 detects T1490 — Inhibit System Recovery. The strategy page names it directly in the Technique Detected line. T1486 is Data Encrypted for Impact (the encryption itself), T1070 is Indicator Removal, and T1499 is Endpoint Denial of Service. Those are neighbouring Impact-tactic techniques, but DET0329 is built only for T1490 behaviour: deleting or disabling the features that help a system recover.", "study": "Learn the neighbours too: T1486, T1499, and T1490 all sit in the Impact tactic but describe different behaviours.", "options": [{"t": "T1490 — Inhibit System Recovery", "ok": true}, {"t": "T1486 — Data Encrypted for Impact", "ok": false}, {"t": "T1070 — Indicator Removal on Host", "ok": false}, {"t": "T1499 — Endpoint Denial of Service", "ok": false}]}, {"id": "E03", "type": "fill", "title": "Complete the summary sentence about DET0329", "summary": "One sentence, four keywords", "scenario": "A colleague from the help desk asks you what you are studying. You want to answer with one clear sentence. You write it on a sticky note, but four words are missing. Use the word bank to complete the sentence so it is correct.", "question": "Fill the four blanks using the word bank.", "hint": "The tactic name is the same one that holds ransomware techniques. The last blank is the thing victims lose when backups are deleted.", "explanation": "The correct sentence reads: DET0329 is a detection strategy for technique T1490 (Inhibit System Recovery). T1490 sits in the Impact tactic. Attackers use it to stop the recovery of systems. Every blank comes straight from the strategy page: the ID, the technique ID, the tactic, and the goal (blocking recovery). Saying it in one sentence is a skill — managers often ask you to explain an alert in plain words.", "study": "Practise saying the full name: DET0329 detects T1490 — Inhibit System Recovery, an Impact-tactic technique.", "parts": ["DET0329 is a detection strategy for technique ", " (Inhibit System Recovery). This technique sits in the ", " tactic. Attackers use it to stop the ", " of corrupted or encrypted systems."], "bank": ["Impact", "recovery", "T1490", "defense evasion", "encryption", "TA0001"], "answers": ["T1490", "Impact", "recovery"]}, {"id": "E04", "type": "dnd", "title": "Sort the utilities by the platform they are watched on", "summary": "Native utilities per analytic", "scenario": "The AN0933 analytic for Windows watches native utilities such as vssadmin, wbadmin, diskshadow, bcdedit, REAgentC, and wmic when they run with arguments that delete shadow copies, disable recovery, or remove backup catalogs. Other analytics watch tools on other platforms: AN0934 watches Linux shell tools, AN0935 watches the ESXi command vim-cmd, AN0936 watches erase, format and reload on network devices, and AN0937 watches cloud API calls like DeleteSnapshot.\n\nSort each utility below into the platform where its analytic watches it.", "question": "Drag each utility to the platform where DET0329 watches it.", "hint": "vim-cmd only exists on ESXi hosts. chattr and shred are Linux file tools. DeleteSnapshot is a cloud API call, not a shell command.", "explanation": "vssadmin, wbadmin, and bcdedit are Windows utilities watched by AN0933. chattr and shred are Linux tools watched by AN0934 (chattr can make files immutable to block snapshot auto-recovery, shred destroys file content). vim-cmd is the ESXi command watched by AN0935 (it can run vmsvc/snapshot.removeall). The AWS API call DeleteSnapshot is watched by AN0937 in cloud logs. Knowing the platform of each utility tells you which analytic will fire and which log will hold the evidence.", "study": "AN0933 utility list: vssadmin, wbadmin, diskshadow, bcdedit, REAgentC, wmic.", "zones": [{"id": "Z1", "t": "Windows (AN0933)"}, {"id": "Z2", "t": "Linux (AN0934)"}, {"id": "Z3", "t": "ESXi (AN0935)"}, {"id": "Z4", "t": "IaaS cloud (AN0937)"}], "items": [{"id": "I1", "t": "vssadmin", "zone": "Z1"}, {"id": "I2", "t": "wbadmin", "zone": "Z1"}, {"id": "I3", "t": "bcdedit", "zone": "Z1"}, {"id": "I4", "t": "chattr", "zone": "Z2"}, {"id": "I5", "t": "shred", "zone": "Z2"}, {"id": "I6", "t": "vim-cmd", "zone": "Z3"}, {"id": "I7", "t": "DeleteSnapshot API call", "zone": "Z4"}]}, {"id": "E05", "type": "qcm", "title": "Which tactic does T1490 belong to?", "summary": "Find the tactic column", "scenario": "The ATT&CK matrix is a grid: tactics are the columns (they are the adversary goals), and techniques are the cells (they are the ways to reach the goal). During a team meeting someone asks where T1490 lives in the matrix. You open the T1490 page and look at the metadata block.", "question": "Which tactic does T1490 — Inhibit System Recovery belong to?", "hint": "The goal of deleting backups is to hurt the availability of data — to make it unusable or unrestorable.", "explanation": "T1490 belongs to the Impact tactic. The Impact tactic collects techniques that manipulate, interrupt, or destroy an organisation's systems and data. The T1490 page also says the Impact Type is Availability. Defense Evasion is about hiding from security tools, Collection is about stealing data, and Execution is about running code — deleting recovery features serves none of those goals directly; it maximises damage.", "study": "In the matrix, look at the Impact column and find T1490 near T1486 (Data Encrypted for Impact).", "options": [{"t": "Impact", "ok": true}, {"t": "Defense Evasion", "ok": false}, {"t": "Collection", "ok": false}, {"t": "Execution", "ok": false}]}, {"id": "E06", "type": "logview", "title": "Does AN0933 fire on this Sysmon event?", "summary": "One log line, one decision", "scenario": "It is your first SOC shift. A small alert queue shows a new event from host FIN-WS-04. The AN0933 analytic looks for process creation events (Sysmon EventCode=1) where a native recovery utility runs with arguments that delete shadow copies, disable recovery, or remove backup catalogs. Look at the log line in the viewer below. You can use the filter box to search it, like in a real SIEM.", "question": "Look at the Sysmon line. Does the AN0933 logic fire, and why?", "hint": "Read the utility name first, then read its arguments. Does it delete something, or only look at something?", "explanation": "The line shows vssadmin.exe running with 'delete shadows /all /quiet'. This is exactly the pattern AN0933 watches on Windows: the native utility vssadmin plus arguments that delete shadow copies. So yes, the analytic fires. If the line had been 'vssadmin list shadows' (only reading a list), the logic would not fire, because nothing is deleted or disabled. Reading the utility and its arguments together is the core habit for this analytic.", "study": "Compare: vssadmin list shadows (read-only, no fire) vs vssadmin delete shadows /all /quiet (destructive, fires).", "log": ["2026-09-14T02:11:39Z FIN-WS-04 Sysmon EventCode=1 User=CORP\\jmalley", "Image=C:\\Windows\\System32\\vssadmin.exe CommandLine=\"vssadmin delete shadows /all /quiet\"", "ParentImage=C:\\Windows\\System32\\cmd.exe ProcessGuid={4dc1f2a0-7e11} Hashes=SHA256=9E11A0"], "options": [{"t": "Yes — vssadmin runs with arguments that delete shadow copies", "ok": true}, {"t": "No — vssadmin is only reading a list of shadow copies", "ok": false}, {"t": "No — Sysmon EventCode=1 is the wrong event for process starts", "ok": false}, {"t": "Yes — but only because the user is an administrator", "ok": false}]}, {"id": "E07", "type": "match", "title": "Match each recovery feature to its plain meaning", "summary": "Know what the safety nets are", "scenario": "Alerts about T1490 name the features the attacker destroys. To triage well, you must know what each feature is, in plain words. Match each feature to its meaning. Imagine explaining them to a new colleague who has never seen a Windows server.", "question": "Match each feature to the description that explains it in plain words.", "hint": "A catalog is a list of backups, not the backup itself. WinRE is the repair environment that starts when Windows cannot start normally.", "explanation": "Shadow copies are automatic file snapshots Windows keeps so users can restore earlier versions. The backup catalog is the list of backups Windows Backup has made (deleting it makes existing backups hard to use). WinRE is the Windows Recovery Environment, a small repair system outside normal Windows; REAgentC can disable it. Automatic repair (boot status policy) is the feature that tries to fix boot problems; bcdedit can turn it off. These four safety nets are exactly what T1490 destroys.", "study": "Repeat the four safety nets: shadow copies, backup catalog, WinRE, automatic repair.", "left": [{"id": "L1", "t": "Shadow copies", "match": "R2"}, {"id": "L2", "t": "Backup catalog", "match": "R4"}, {"id": "L3", "t": "WinRE (Windows Recovery Environment)", "match": "R1"}, {"id": "L4", "t": "Automatic repair (boot status policy)", "match": "R3"}], "right": [{"id": "R1", "t": "A separate repair system that starts when Windows cannot boot"}, {"id": "R2", "t": "Automatic file snapshots Windows keeps for restoring earlier versions"}, {"id": "R3", "t": "A boot feature that tries to fix startup problems by itself"}, {"id": "R4", "t": "The list of backups that Windows Backup has recorded"}]}, {"id": "E08", "type": "spot", "title": "Spot the wrong line in the analytic config", "summary": "One channel is wrong", "scenario": "A junior detection engineer wrote this config for the Windows part of AN0933. Each line has a line number. One line points at the wrong log channel for its data component. The other lines match the DET0329 page: process creation comes from Sysmon EventCode=1, registry key modification from Sysmon EventCode=13 or 14, and backup catalog deletion from the Microsoft-Windows-Backup channel.", "question": "Which line number contains the mistake?", "hint": "Line 1 is correct: process creation really is Sysmon EventCode=1. Check where backup catalog deletion events really arrive.", "explanation": "Line 2 is the mistake: backup catalog deletion (data component DC0040 — File Deletion) arrives in the Microsoft-Windows-Backup channel, not in the Security channel. Line 1 is right (Sysmon EventCode=1 is process creation, DC0032). Line 3 is right (registry modification, DC0063, is Sysmon EventCode=13/14). Line 4 is right (service stop events belong in the System log, DC0041). Pointing the analytic at the wrong channel means it would never see catalog deletions, so real attacks would be missed.", "study": "DET0329 log sources for AN0933: Sysmon (EC=1, EC=13/14), Microsoft-Windows-Backup, System.", "artefacts": [{"label": "ARTEFACT 1 — analytic config draft", "mono": true, "body": "# AN0933-Windows config draft\n1  watch channel=WinEventLog:Sysmon        for=EventCode=1   -> DC0032 Process Creation\n2  watch channel=WinEventLog:Security      for=catalog delete-> DC0040 File Deletion\n3  watch channel=WinEventLog:Sysmon        for=EventCode=13,14 -> DC0063 Registry Key Modification\n4  watch channel=WinEventLog:System        for=service stopped -> DC0041 Service Metadata"}], "options": [{"t": "Line 1", "ok": false}, {"t": "Line 2", "ok": true}, {"t": "Line 3", "ok": false}, {"t": "Line 4", "ok": false}]}, {"id": "E09", "type": "multi", "title": "Which commands would AN0933 watch for?", "summary": "Pick the two destructive commands", "scenario": "AN0933 (Windows) fires on native utilities used with arguments that delete shadow copies, disable recovery, or remove backup catalogs. Read-only or network commands do not match. Below are four commands seen on different workstations this week. Two of them match the destructive pattern; two do not.", "question": "Select the two commands that match what AN0933 watches for.", "hint": "One command deletes shadow copies silently. One turns off automatic recovery in the boot configuration. The other two only read information.", "explanation": "The two matching commands are 'vssadmin delete shadows /all /quiet' (deletes all shadow copies silently) and 'bcdedit /set {default} recoveryenabled no' (disables automatic recovery — a disable-recovery action). 'ipconfig /all' only shows network settings, and 'netstat -ano' only lists connections and ports; neither touches recovery features, so AN0933 ignores them. This is why the analytic pairs the utility name with its arguments instead of firing on the utility alone.", "study": "The pattern is utility + destructive argument. Utility alone is not enough.", "options": [{"t": "vssadmin delete shadows /all /quiet", "ok": true}, {"t": "bcdedit /set {default} recoveryenabled no", "ok": true}, {"t": "ipconfig /all", "ok": false}, {"t": "netstat -ano", "ok": false}]}, {"id": "E10", "type": "dnd", "title": "Sort the log sources by platform", "summary": "Each platform has its own logs", "scenario": "Each DET0329 analytic reads different logs. Before you can tune or triage, you must know where each analytic collects its data. The DET0329 page lists, per analytic: Sysmon for Windows process chains, auditd for Linux commands and config changes, the hostd log for ESXi, syslog for network devices, and CloudTrail for AWS cloud API calls.", "question": "Drag each log source to the platform it belongs to.", "hint": "auditd is the Linux audit daemon. hostd is the ESXi management service. CloudTrail records AWS API calls.", "explanation": "WinEventLog:Sysmon belongs to Windows (AN0933). auditd:SYSCALL belongs to Linux (AN0934). esxi:hostd belongs to ESXi (AN0935, which watches snapshot deletion). networkdevice:syslog belongs to network devices (AN0936, watching erase/format/reload). AWS:CloudTrail belongs to IaaS (AN0937, watching snapshot and storage deletion API calls). If the source that feeds an analytic is not on-boarded into the SIEM, that analytic is blind — a common coverage gap found in detection reviews.", "study": "Say each pair out loud: Windows-Sysmon, Linux-auditd, ESXi-hostd, Network-syslog, Cloud-CloudTrail.", "zones": [{"id": "Z1", "t": "Windows (AN0933)"}, {"id": "Z2", "t": "Linux (AN0934)"}, {"id": "Z3", "t": "ESXi (AN0935)"}, {"id": "Z4", "t": "Network devices (AN0936)"}, {"id": "Z5", "t": "IaaS cloud (AN0937)"}], "items": [{"id": "I1", "t": "WinEventLog:Sysmon", "zone": "Z1"}, {"id": "I2", "t": "auditd:SYSCALL", "zone": "Z2"}, {"id": "I3", "t": "esxi:hostd", "zone": "Z3"}, {"id": "I4", "t": "networkdevice:syslog", "zone": "Z4"}, {"id": "I5", "t": "AWS:CloudTrail", "zone": "Z5"}]}, {"id": "E11", "type": "qcm", "title": "Why do ransomware groups delete shadow copies first?", "summary": "The attacker goal behind T1490", "scenario": "During onboarding you watch a recorded briefing about ransomware incidents. The presenter says: 'Almost every Windows ransomware case we investigated in the last three years had a shadow-copy deletion step shortly before encryption.' The slide lists Akira, BlackCat, and Conti as examples of groups seen doing it.", "question": "Why do ransomware groups delete shadow copies before encrypting files?", "hint": "Think about what the victim would do if the shadow copies still existed after encryption.", "explanation": "They delete shadow copies so victims cannot restore their files for free, which increases the pressure to pay the ransom. Shadow copies are free, built-in restore points; if they survive, encryption loses most of its power. It does not make encryption faster, does not hide the malware, and has nothing to do with disk space — it removes the victim's cheapest recovery option. This attacker goal is exactly what DET0329 is built to catch in time to protect the backups.", "study": "Read the T1490 description: inhibiting recovery augments the effects of Data Encrypted for Impact.", "options": [{"t": "So victims cannot restore their files for free", "ok": true}, {"t": "To make the encryption step run faster", "ok": false}, {"t": "To hide their malware from antivirus tools", "ok": false}, {"t": "To free disk space for the encrypted files", "ok": false}]}, {"id": "E12", "type": "match", "title": "Match each Windows utility to what it removes or disables", "summary": "Six native utilities of AN0933", "scenario": "AN0933 fires only when a watched utility is used for a watched action. To triage fast, connect each utility to its destructive job. These are all native Windows tools, which is why attackers like them: no malware file is needed, so the actions look like normal administration.", "question": "Match each utility to the destructive action it performs.", "hint": "wbadmin is the Windows Backup administrator tool, so its destructive action touches the backup catalog. bcdedit edits boot configuration.", "explanation": "vssadmin deletes shadow copies (delete shadows /all /quiet). wbadmin deletes the backup catalog (delete catalog -quiet). bcdedit disables automatic recovery (recoveryenabled no or a boot status policy that ignores failures). REAgentC can disable WinRE, the recovery environment. wmic can delete shadow copies through WMI (wmic shadowcopy delete), and diskshadow can also delete all shadow copies from its script shell. All six are in the AN0933 utility list on the DET0329 page.", "study": "Memorise the six: vssadmin, wbadmin, bcdedit, REAgentC, wmic, diskshadow.", "left": [{"id": "L1", "t": "vssadmin", "match": "R1"}, {"id": "L2", "t": "wbadmin", "match": "R4"}, {"id": "L3", "t": "bcdedit", "match": "R3"}, {"id": "L4", "t": "REAgentC", "match": "R2"}, {"id": "L5", "t": "wmic", "match": "R5"}], "right": [{"id": "R1", "t": "Deletes volume shadow copies"}, {"id": "R2", "t": "Disables the Windows recovery environment (WinRE)"}, {"id": "R3", "t": "Disables automatic repai /* ================= UTILITIES ================= */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmt2(x){return (Math.round(x*100)/100).toFixed(2);}
function $(id){return document.getElementById(id);}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function letters(n){var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';return L.charAt(n%26);}

/* Partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= STATE ================= */
var S = {
  phase:'intro',          /* intro | exam | review | results */
  manualPauseStart:null,
  order:[],               /* shuffled exercise indices */
  cur:0,                  /* position in order */
  answered:{},            /* exId -> credit (float) */
  answeredFlags:{},       /* exId -> true (checked) */
  autoPauseStart:null,
  skipped:[],             /* exIds currently in skipped pool */
  everSkipped:{},         /* exId -> true */
  hintUsed:{},            /* exId -> true */
  reviewed:false,         /* visited review screen at end */
  reviewMode:null,        /* exId being answered from review */
  reported:false,
  manualPauseTotal:0,     /* seconds */
  autoPauseTotal:0,       /* seconds */
  user:{name:'',country:'',locale:'en'}
};

var TIMER = {
  total: META.timerSeconds,
  remaining: META.timerSeconds,
  state:'IDLE',           /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  interval:null,
  perEx:0,                /* per-exercise remaining (EXTREMELY HARD query only) */
  perExTotal:0
};

function timerSet(st){
  TIMER.state=st;
  var el=$('tstate');
  if(el){
    var map={
      IDLE:['&#96;','READY','end'],
      RUNNING:['&#9654;','RUNNING','run'],
      PAUSED_MANUAL:['&#10073;&#10073;','PAUSED — manual (press Resume)','pman'],
      PAUSED_AUTO_CHECK:['&#10073;&#10073;','PAUSED — reviewing feedback (resumes on Next)','pauto'],
      ENDED:['&#9632;','ENDED','end']
    };
    var m=map[st]||map.IDLE;
    el.className='tstate '+m[2];
    el.innerHTML='<span aria-hidden="true">'+m[0]+'</span> <span>'+m[1]+'</span>';
    el.setAttribute('aria-label','Timer state: '+m[1]);
  }
}
function timerStartTicks(){
  if(TIMER.interval){return;}
  TIMER.interval=setInterval(function(){
    if(TIMER.state!=='RUNNING'){return;}
    TIMER.remaining-=1;
    if(TIMER.perExTotal>0 && !$('exwrap').classList.contains('hidden')){
      TIMER.perEx=Math.max(0,TIMER.perEx-1);
      var pe=$('perextime');
      if(pe){pe.textContent=fmtClock(TIMER.perEx);}
      if(TIMER.perEx===0){onPerExExpired();}
    }
    if(TIMER.remaining<=0){
      TIMER.remaining=0;
      timerEnded();
    }
    updateHeader();
  },1000);
}
function timerEnded(){
  clearInterval(TIMER.interval);TIMER.interval=null;
  timerSet('ENDED');
  finishExam(true);
}
function updateHeader(){
  $('tclock').textContent=fmtClock(TIMER.remaining);
  var sum=0,cnt=0;
  for(var k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];cnt++;}}
  $('scoreval').innerHTML='<span class="score-sum">'+fmt1(sum)+'</span> <span class="dim">/ '+cnt+'</span>';
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  $('scorepct').textContent=pct+'%';
  var done=S.cur;
  if(S.phase==='review'||S.phase==='results'){done=S.order.length;}
  $('barfill').style.width=Math.round(100*Math.min(1,done/S.order.length))+'%';
}

  b.className='badge '+cls;

    {'easy':'var(--sev-easy)','medium':'var(--sev-medium)','hard':'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'}[sev]);
  var b2=$('sevbadge2');
  if(b2){b2.className='badge '+cls;b2.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+word+'</span>';}
}

/* ================= EXAM FLOW ================= */
function startExam(){
  S.phase='exam';S.cur=0;S.order=[];
  var idx=[];for(var i=0;i<EXERCISES.length;i++){idx.push(i);}
  S.order=shuffle(idx);
  S.answered={};S.answeredFlags={};S.skipped=[];S.everSkipped={};S.hintUsed={};
  S.reviewed=false;S.reviewMode=null;S.reported=false;
  S.manualPauseTotal=0;S.autoPauseTotal=0;S.autoPauseStart=null;S.manualPauseStart=null;
  S.answers={};S.results={};S.dec={};CURSEL=[];
  for(var r=0;r<EXERCISES.length;r++){
    delete EXERCISES[r]._shufOpts;delete EXERCISES[r]._shufR;
    delete EXERCISES[r]._shufItems;delete EXERCISES[r]._shufOrder;delete EXERCISES[r]._shufBank;
  }
  TIMER.total=META.timerSeconds;TIMER.remaining=META.timerSeconds;
  timerSet('RUNNING');timerStartTicks();
  $('intro').classList.add('hidden');
  $('results').classList.add('hidden');
  $('review').classList.add('hidden');
  $('exam').classList.remove('hidden');
  $('hdrbar').classList.remove('hidden');
  $('bar').classList.remove('hidden');
  renderCurrent();
}
function currentExercise(){
  if(S.reviewMode){return byId(EXERCISES,S.reviewMode);}
  return EXERCISES[S.order[S.cur]];
}
function isLastPosition(){
  return S.cur>=S.order.length-1;
}
function renderCurrent(){
  var ex=currentExercise();
  if(!ex){finishExam(false);return;}
  var posLabel=S.reviewMode?('Reviewing a skipped exercise'):(S.reviewed?'Review skipped':'Exercise '+(S.cur+1)+' of '+S.order.length);
  $('excount').textContent=posLabel;
  var per='';
  if(ex.perTimeSec && !S.answeredFlags[ex.id]){
    TIMER.perEx=ex.perTimeSec;TIMER.perExTotal=ex.perTimeSec;
    per='<div class="small dim" style="margin-top:6px">&#9201; This exercise has its own reduced timer: <b id="perextime" class="mono">'+fmtClock(TIMER.perEx)+'</b> ('+Math.round(ex.perTimeSec/60)+' min). It stops while feedback is open and resumes on Next.</div>';
  }else{TIMER.perExTotal=0;TIMER.perEx=0;}
  $('exwrap').innerHTML='<div class="card">'+per+'<div id="exbody"></div></div>';
  renderExercise(ex);
  updateHeader();
}
function onPerExExpired(){
  if(TIMER.perExTotal===0){return;}
  TIMER.perExTotal=0;TIMER.perEx=0;
  var ex=currentExercise();
  if(ex && !S.answeredFlags[ex.id]){
    if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
    toastSkipped(ex);
    if(S.reviewMode){exitReview();}else{advanceNext(false);}
  }
}
function toastSkipped(ex){
  var t=$('toast');
  t.innerHTML='<span class="sicon">&#9888; Skipped</span> — “'+esc(ex.title)+'” moved to the skipped pool. You can return to it before you submit.';
  t.classList.remove('hidden');
  clearTimeout(toastSkipped._t);
  toastSkipped._t=setTimeout(function(){t.classList.add('hidden');},4200);
}

/* Manual pause */
function togglePause(){
  if(S.phase!=='exam'&&S.phase!=='review'){return;} /* no manual pause on intro/results */
  var ov=$('pauseov');
  if(TIMER.state==='PAUSED_MANUAL'){
    ov.classList.add('hidden');
    if(S.manualPauseStart){S.manualPauseTotal+=Math.round((Date.now()-S.manualPauseStart)/1000);S.manualPauseStart=null;}
    if(S.pausedFrom==='PAUSED_AUTO_CHECK'){timerSet('PAUSED_AUTO_CHECK');}
    else{timerSet('RUNNING');}
    S.pausedFrom=null;
  }else{
    if(TIMER.state==='ENDED'){return;} /* too late to pause */
    S.pausedFrom=TIMER.state==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':null;
    S.manualPauseStart=Date.now();
    timerSet('PAUSED_MANUAL');
    ov.classList.remove('hidden');
  }
}

/* Hint */
function useHint(){
  var ex=currentExercise();
  if(!ex||S.hintUsed[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var hp=$('hintpanel');
  hp.classList.remove('hidden');
  hp.innerHTML='<div class="ht"><span aria-hidden="true">&#128161;</span><span>HINT — costs 10% of this exercise credit</span></div><div>'+esc(ex.hint)+'</div>';
  $('hintbtn').disabled=true;
}

/* Skip */
function skipCurrent(){
  var ex=currentExercise();
  if(!ex||S.answeredFlags[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  S.everSkipped[ex.id]=true;
  if(S.reviewMode){exitReview();}
  else{advanceNext(false);}
}

/* Advance to next exercise or review/results */
function advanceNext(afterCheck){
  S.reviewMode=null;
  S.cur++;
  if(S.cur>=S.order.length){
    maybeReview();
    return;
  }
  renderCurrent();
}
function maybeReview(){
  if(S.skipped.length>0 && TIMER.remaining>0 && TIMER.state!=='ENDED'){
    showReview();
  }else{
    finishExam(false);
  }
}
function showReview(){
  S.phase='review';
  $('exam').classList.add('hidden');
  $('review').classList.remove('hidden');
  var html='<div class="card"><h2 style="font-size:18px;margin:2px 0 8px"><span aria-hidden="true">&#9888;</span> Review skipped exercises</h2>'
    +'<p class="dim" style="margin:4px 0 12px">These exercises were skipped and not answered. You can go back to any of them now and answer it, as long as the timer has not ended. If you submit now, skipped exercises are excluded from your score — they do not count as correct or wrong.</p>';
  for(var i=0;i<S.skipped.length;i++){
    var ex=byId(EXERCISES,S.skipped[i]);
    html+='<div class="skiprow"><span class="sicon" aria-hidden="true">&#9888;</span>'
      +'<span class="st">Skipped — '+esc(ex.title)+'</span>'
      +'<button class="btn small" data-ans="'+esc(ex.id)+'" type="button">Answer</button></div>';
  }
  html+='</div><div class="center" style="gap:12px;flex-wrap:wrap">'

/* ================= FEEDBACK + NAV ================= */
function afterCheckCommon(ex,res){
  var credit=res.credit;
  if(S.hintUsed[ex.id]){credit=Math.max(0,credit-0.10);res.hintApplied=true;}
  res.credit=credit;
  S.answered[ex.id]=credit;
  S.answeredFlags[ex.id]=true;
  var pos=S.skipped.indexOf(ex.id);
  if(pos>=0){S.skipped.splice(pos,1);}
  /* Check-triggered auto-pause (state machine transition) */
  if(TIMER.state==='RUNNING'){S.autoPauseStart=Date.now();}
  if(TIMER.state!=='ENDED'){timerSet('PAUSED_AUTO_CHECK');}
  updateHeader();
}
function renderNavAfterCheck(ex){
  var nav=$('exnav');
  nav.innerHTML='';
  var last=!S.reviewMode && isLastPosition();
  var next=document.createElement('button');
  next.type='button';
  next.className='btn primary';
  next.innerHTML=S.reviewMode
    ?'&#8592; Back to skipped list'
    :(last?'Final Submit &#8594;':'Next exercise &#8594;');
  next.addEventListener('click',function(){
    if(TIMER.state==='PAUSED_AUTO_CHECK'||TIMER.state==='RUNNING'){
      if(TIMER.state==='PAUSED_AUTO_CHECK'&&S.autoPauseStart){
        S.autoPauseTotal+=Math.round((Date.now()-S.autoPauseStart)/1000);S.autoPauseStart=null;
      }
      if(TIMER.state!=='ENDED'){timerSet('RUNNING');}
    }
    if(S.reviewMode){exitReview();}
    else if(isLastPosition()){maybeReview();}
    else{advanceNext(true);}
  });
  nav.appendChild(next);
}

/* ================= FINISH + RESULTS ================= */
function finishExam(byTimeout){
  clearInterval(TIMER.interval);TIMER.interval=null;
  if(TIMER.state!=='ENDED'){timerSet('ENDED');}
  S.phase='results';
  $('exam').classList.add('hidden');
  $('review').classList.add('hidden');
  $('pauseov').classList.add('hidden');
  var results=computeResults();
  renderResults(results,byTimeout);
  $('results').classList.remove('hidden');
  if(!S.reported){reportScore(results);S.reported=true;}
  window.scrollTo(0,0);
}
function computeResults(){
  var sum=0,cnt=0,full=0,part=0,bad=0,partSum=0;
  for(var i=0;i<EXERCISES.length;i++){
    var id=EXERCISES[i].id;
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];sum+=c;cnt++;
      if(c>=0.9999){full++;}
      else if(c>0){part++;partSum+=c;}
      else{bad++;}
    }
  }
  var skippedNow=0;
  for(var j=0;j<EXERCISES.length;j++){
    var id2=EXERCISES[j].id;
    if(!S.answered.hasOwnProperty(id2)){skippedNow++;}
  }
  var percent=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,full:full,part:part,partAvg:part>0?partSum/part:0,bad:bad,skipped:skippedNow,percent:percent};
}
function renderResults(r,byTimeout){
  var passed=r.percent>=META.passMark && r.cnt>0;
  $('results').innerHTML=''
    +'<div class="card">'
    +'<div class="bigscore">'+fmt1(r.sum)+' <span class="pc">/ '+r.cnt+'</span></div>'
    +'<div style="text-align:center" class="dim">final score over answered exercises &middot; <b style="color:var(--text-primary)">'+r.percent+'%</b> (pass mark '+META.passMark+'%)</div>'
    +'<div class="resgrid">'
    +'<div class="rescard ok"><div class="rn">'+r.full+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Fully correct</span></div></div>'
    +'<div class="rescard part"><div class="rn">'+r.part+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Partially correct'+(r.part>0?' — avg '+fmt2(r.partAvg):'')+'</span></div></div>'
    +'<div class="rescard bad"><div class="rn">'+r.bad+'</div><div class="rl"><span aria-hidden="true">&#10007;</span><span>Fully incorrect</span></div></div>'
    +'<div class="rescard skipc"><div class="rn">'+r.skipped+'</div><div class="rl"><span aria-hidden="true">&#9888;</span><span>Skipped — excluded</span></div></div>'
    +'</div>'
    +(byTimeout?'<p class="small dim" style="text-align:center">The timer ended, so any exercises that were not answered were excluded from the score.</p>':'')
    +'<div class="pstat"><span>&#9201; Time paused manually: <b>'+fmtClock(S.manualPauseTotal)+'</b></span>'
    +'<span>&#10073;&#10073; Time reviewing feedback: <b>'+fmtClock(S.autoPauseTotal)+'</b></span></div>'
    +'<div class="passpanel '+(passed?'okp':'failp')+'">'
    +'<div class="pt">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'
    +'<div class="ps">'+(passed
      ?'Well done. You reached the pass mark of '+META.passMark+'% on this severity. Keep going with the next difficulty level of this topic.'
      :'You must retake this exam to reach the '+META.passMark+'% pass mark. Review the feedback you collected, then press Retake Exam — the exercise order and answer choices will be shuffled.')+'</div>'
    +'</div>'

  $('retakebtn').addEventListener('click',function(){

/* ================= SYNTAX HIGHLIGHT (single-pass, safe) ================= */
var HL_RE=new RegExp(
  '(\\d{1,3}(?:\\[\\.\\]){3}\\d{1,3})'+
  '|(&quot;[^&\\n]*&quot;)'+
  '|(\\bEventCode\\s*=\\s*\\d+)'+
  '|(\\b(?:vssadmin|wbadmin|diskshadow|bcdedit|reagentc|wmic|chattr|shred|vim-cmd|esxi|hostd|auditd|sysmon|cloudtrail|powershell|cmd)\\b)'+
  '|(\\b(?:delete|remove|removeall|erase|format|reload|shadowcopy|shadows|catalog|recoveryenabled|disable|snapshot|rescue\\.target|fstab|bootstatuspolicy)\\b)'+
  '|(#[^\\n<]*)'+
  '|(\\b\\d+\\b)','gi');
function hl(text){
  var e=esc(text);
  return e.replace(HL_RE,function(m,ip,str,ec,kw,verb,com,num){
    if(ip){return '<span class="tk-i">'+ip+'</span>';}
    if(str){return '<span class="tk-s">'+str+'</span>';}
    if(ec){return '<span class="tk-k">'+ec+'</span>';}
    if(kw){return '<span class="tk-k">'+kw+'</span>';}
    if(verb){return '<span class="tk-w">'+verb+'</span>';}
    if(com){return '<span class="tk-c">'+com+'</span>';}
    if(num){return '<span class="tk-n">'+num+'</span>';}
    return m;
  });
}

function gradeOpts(ex,sel,multi){
  var okIdx=[],N=0,H=0,W=0,items=[];
  for(var i=0;i<ex.options.length;i++){if(ex.options[i].ok){okIdx.push(i);N++;}}
  for(var j=0;j<sel.length;j++){
    var sj=sel[j];if(sj==null){continue;}
    if(okIdx.indexOf(sj)>=0){H++;items.push({status:'correct',label:ex.options[sj].t.slice(0,90)});}
    else{W++;items.push({status:'wrong',label:ex.options[sj].t.slice(0,90),why:'Not part of the correct answer.'});}
  }
  for(var k=0;k<okIdx.length;k++){
    if(sel.indexOf(okIdx[k])<0){items.push({status:'missed',label:ex.options[okIdx[k]].t.slice(0,90),why:'This belongs in the correct answer.'});}
  }
  var corr=okIdx.map(function(i){return ex.options[i].t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:multi?items:null,correctSummary:esc(corr)};
}

function gradeMatch(ex,ans){
  var N=ex.left.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var L=ex.left[i];

    else{W++;items.push({status:'wrong',label:L.t+' → '+byId(ex.right,chosen).t,why:'Correct match: '+byId(ex.right,L.match).t});}
  }
  var corr=ex.left.map(function(L){return L.t+' → '+byId(ex.right,L.match).t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(corr)};
}

function gradeDND(ex){

}
function gradeFill(ex,ans){
  var N=ex.answers.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var got=(ans&&ans[i])||'';
    if(!got){items.push({status:'missed',label:'Blank '+(i+1),why:'Correct: '+ex.answers[i]});}
    else if(got===ex.answers[i]){H++;items.push({status:'correct',label:'Blank '+(i+1)+': '+got});}
    else{W++;items.push({status:'wrong',label:'Blank '+(i+1)+': '+got,why:'Correct: '+ex.answers[i]});}
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(ex.answers.join(' • '))};
}

/* ================= LOG VIEWER ================= */
function renderLogview(ex){
  return '<div class="logbox"><div class="logbar"><span aria-hidden="true" style="color:var(--accent-blue)">&#128269;</span>'
    +'<input type="text" id="logfilter" placeholder="Filter lines (text match)…" aria-label="Filter log lines">'
    +'<span class="cnt" id="logcnt"></span></div><div class="loglines" id="loglines"></div></div>'
    +'<div class="small dim" style="margin:8px 0 10px">Use the filter box like a SIEM search bar. It does not affect scoring.</div>';
}
function drawLog(ex,filter){
  var box=$('loglines');if(!box){return;}
  var f=(filter||'').toLowerCase();
  var shown=0,h='';
  for(var i=0;i<ex.log.length;i++){
    var line=ex.log[i];
    if(f&&line.toLowerCase().indexOf(f)<0){continue;}
    shown++;
    h+='<pre><span class="ln-no">'+String(i+1).padStart(3,'0')+'</span>'+hl(line)+'</pre>';
  }
  if(shown===0){h='<pre><span class="ln-no">000</span><span class="tk-c"># no lines match this filter</span></pre>';}
  box.innerHTML=h;
  var cnt=$('logcnt');if(cnt){cnt.textContent=shown+' / '+ex.log.length+' lines';}
}

/* ================= QUERY EDITOR ================= */
function renderQuery(ex){
  var saved=S.answers[ex.id]||'';
  return '<div class="qed"><div class="qed-bar"><span class="prompt mono">'+esc(ex.editorPrompt||'search')+'</span>'
    +'<span class="small dim">'+esc(ex.editorNote||'Type your query, then press Check.')+'</span></div>'
    +'<textarea id="qinput" spellcheck="false" aria-label="Query editor" placeholder="'+esc(ex.placeholder||'')+'">'+esc(saved)+'</textarea></div>'
    +(ex.syntaxPanel?'<div class="art" style="margin-top:10px"><span class="art-lab mono">SYNTAX PANEL — available sources &amp; fields</span><div class="art-b"><pre>'+hl(ex.syntaxPanel)+'</pre></div></div>':'');
}
function normQuery(q){
  return String(q||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/\s*=\s*/g,'=');
}
function gradeQuery(ex){
  var q=normQuery($('qinput')?$('qinput').value:(S.answers[ex.id]||''));
  var N=ex.elements.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var el=ex.elements[i];
    var re=new RegExp(el.re,'i');
    if(re.test(q)){H++;items.push({status:'correct',label:el.label});}
    else{items.push({status:'missed',label:el.label,why:el.why});}
  }
  if(ex.bad){
    for(var j=0;j<ex.bad.length;j++){
      var bd=ex.bad[j];
      var re2=new RegExp(bd.re,'i');
      if(re2.test(q)){W++;items.push({status:'wrong',label:bd.label,why:bd.why});}
    }
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,canonical:ex.canonical,
    correctSummary:'Every required element is listed above and shown in the canonical query below.'};
}

/* ================= DECISION TREE ================= */
function renderDecision(ex){
  var st=S.dec[ex.id]||(S.dec[ex.id]={step:0,answers:{}});
  var h='<div class="stepbadge">STEP '+(st.step+1)+' OF '+ex.steps.length+'</div>';
  var step=ex.steps[st.step];
  if(st.step>0&&step.lead){h+='<p style="margin:4px 0 10px">'+esc(step.lead)+'</p>';}
  h+='<p class="small dim" style="margin:2px 0 8px">'+esc(step.question)+'</p><div class="opts">';
  for(var i=0;i<step.options.length;i++){
    var sel=st.answers[st.step]===i;
    h+='<button type="button" class="opt'+(sel?' sel':'')+'" data-dopt="'+i+'" aria-pressed="'+(sel?'true':'false')+'">'
      +'<span class="opt-k" aria-hidden="true">'+letters(i)+'.</span><span>'+esc(step.options[i].t)+'</span></button>';
  }
  h+='</div>';
  return h;
}

/* ================= TRIAGE QUEUE ================= */
function renderTriage(ex){
  var saved=S.answers[ex.id]||{};
  var h='<div class="alertq">';
  for(var i=0;i<ex.alerts.length;i++){
    var a=ex.alerts[i];
    h+='<div class="alert-card"><div class="at"><span aria-hidden="true" style="color:var(--accent-amber)">&#128680;</span><span>'+esc(a.title)+'</span><span class="prio">'+esc(a.prio||'ALERT')+'</span></div>'
      +'<div class="ab">'+esc(a.body)+'</div><div class="asel" data-al="'+i+'">';
    for(var j=0;j<a.options.length;j++){
      var on=saved[i]===j;
      h+='<label class="'+(on?'on':'')+'"><input type="radio" name="al'+i+'" value="'+j+'"'+(on?' checked':'')+'> '+esc(a.options[j].t)+'</label>';
    }
    h+='</div></div>';
  }
  h+='</div><div class="small dim" style="margin-top:8px">Choose one action per alert, then press Check once. Each alert is scored as one item (partial credit).</div>';
  return h;
}

/* ================= MAIN RENDER ================= */
function decisionBind(ex){
  var root=document.getElementById('exbody');
  var st=S.dec[ex.id];
  var opts=root.querySelectorAll('[data-dopt]');
  for(var o=0;o<opts.length;o++){
    opts[o].addEventListener('click',function(ev){
      var b=ev.currentTarget;
      var i=parseInt(b.getAttribute('data-dopt'),10);
      st.answers[st.step]=i;
      var sibs=b.parentElement.querySelectorAll('.opt');
      for(var x=0;x<sibs.length;x++){sibs[x].classList.remove('sel');sibs[x].setAttribute('aria-pressed','false');}
      b.classList.add('sel');b.setAttribute('aria-pressed','true');
    });
  }
}
function decisionAdvance(ex,checkBtn){
  var st=S.dec[ex.id];
  if(st.answers[st.step]==null){flash('Choose an option for this step first.');return false;}
  st.step++;
  var root=document.getElementById('exbody');
  var ab=root.querySelector('.blk.answer .blk-b');
  ab.innerHTML=renderDecision(ex);
  decisionBind(ex);
  checkBtn.innerHTML='&#10003; Check (final step)';
  return true;
}
function wireOrder(ex){
  var root=document.getElementById('exbody');
  function move(id,dir){
    var arr=S.answers[ex.id];
    var i=arr.indexOf(id);var j=i+dir;
    if(i<0||j<0||j>=arr.length)return;
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
    var body=root.querySelector('.blk.answer .blk-b');
    body.innerHTML=renderOrder(ex);wireOrder(ex);
  }
  var rows=root.querySelectorAll('.orow');
  for(var i=0;i<rows.length;i++){
    (function(row){
      var id=row.getAttribute('data-oid');
      row.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',id);});
      row.addEventListener('dragover',function(ev){ev.preventDefault();row.classList.add('dragover');});
      row.addEventListener('dragleave',function(){row.classList.remove('dragover');});
      row.addEventListener('drop',function(ev){
        ev.preventDefault();row.classList.remove('dragover');
        var src=ev.dataTransfer.getData('text/plain');
        var arr=S.answers[ex.id];
        var si=arr.indexOf(src),ti=arr.indexOf(id);
        if(si<0||ti<0||si===ti)return;
        arr.splice(si,1);arr.splice(ti,0,src);
        var body=root.querySelector('.blk.answer .blk-b');
        body.innerHTML=renderOrder(ex);wireOrder(ex);
      });
    })(rows[i]);
  }
  var ups=root.querySelectorAll('[data-up]');
  for(var u=0;u<ups.length;u++){ups[u].addEventListener('click',function(ev){move(ev.currentTarget.getAttribute('data-up'),-1);});}
  var downs=root.querySelectorAll('[data-down]');
  for(var d=0;d<downs.length;d++){downs[d].addEventListener('click',function(ev){move(ev.currentTarget.getAttribute('data-down'),1);});}
}
function wireDND(ex){
  var root=document.getElementById('exbody');
  var picked=null;
  function refreshDND(){
    var body=root.querySelector('.blk.answer .blk-b');
    body.innerHTML=renderDND(ex);
    wireDND(ex);
  }
  function placeItem(itemId,zoneId){
    var st=S.answers[ex.id]||{};
    st[itemId]=(zoneId==='__bank')?'':zoneId;
    S.answers[ex.id]=st;
    refreshDND();
  }
  var chips=root.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){
    (function(chip){
      var id=chip.getAttribute('data-item');
      chip.addEventListener('click',function(){
        if(chip.closest('.zone')){placeItem(id,'__bank');return;}
        var was=chip.classList.contains('picked');
        var all=root.querySelectorAll('.chip.picked');
        for(var k=0;k<all.length;k++){all[k].classList.remove('picked');var pw=all[k].querySelector('.pickword');if(pw)pw.remove();}
        if(!was){chip.classList.add('picked');var w=document.createElement('span');w.className='pickword';w.textContent='picked';chip.appendChild(w);picked=id;}
        else{picked=null;}
      });
      chip.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',id);chip.classList.add('dragging');});
      chip.addEventListener('dragend',function(){chip.classList.remove('dragging');});
    })(chips[i]);
  }
  var zones=root.querySelectorAll('.zone');
  for(var j=0;j<zones.length;j++){
    (function(zone){
      zone.addEventListener('click',function(){
        if(!picked){return;}
        placeItem(picked,zone.getAttribute('data-zone'));picked=null;
      });
      zone.addEventListener('dragover',function(ev){ev.preventDefault();zone.classList.add('over');});
      zone.addEventListener('dragleave',function(){zone.classList.remove('over');});
      zone.addEventListener('drop',function(ev){
        ev.preventDefault();zone.classList.remove('over');
        placeItem(ev.dataTransfer.getData('text/plain'),zone.getAttribute('data-zone'));
      });
    })(zones[j]);
  }
}

function renderExercise(ex){
  var root=$('exbody');
  CURSEL=[];
  var already=!!S.answeredFlags[ex.id];
  var answer='';
  switch(ex.type){
    case 'qcm': case 'spot':
      answer=renderOpts(ex,already&&S.results[ex.id]?gradeOptsSel(ex):[],false);break;
    case 'multi':
      answer=renderOpts(ex,already?(S.answers[ex.id]||[]):[],true);break;
    case 'match':answer=renderMatch(ex);break;
    case 'dnd':answer=renderDND(ex);break;
    case 'order':answer=renderOrder(ex);break;
    case 'fill':answer=renderFill(ex);break;
    case 'logview':
      answer=renderLogview(ex)+renderOpts(ex,already?(S.answers[ex.id]!=null?[S.answers[ex.id]]:[]):[],false);break;
    case 'query':answer=renderQuery(ex);break;
    case 'decision':answer=renderDecision(ex);break;
    case 'triage':answer=renderTriage(ex);break;
    default:answer='<p>Unsupported type.</p>';
  }
  var collapsedDefault=null;
  if(S.reviewMode){collapsedDefault=false;}
  root.innerHTML=scenarioBlock(ex,collapsedDefault)+questionBlock(ex)+answerBlock(answer);
  bindScenarioToggle(root);

  if(ex.type==='logview'){
    drawLog(ex,'');
    $('logfilter').addEventListener('input',function(e){drawLog(ex,e.target.value);});
  }
  if(ex.type==='dnd'){wireDND(ex);}
  if(ex.type==='order'){wireOrder(ex);}
  if(ex.type==='decision'){decisionBind(ex);}

  /* ---- actions ---- */
  var act=document.createElement('div');
  act.id='exactions';act.style.marginTop='14px';
  var checkBtn=document.createElement('button');
  checkBtn.type='button';checkBtn.className='btn green';checkBtn.id='checkbtn';
  var last=!S.reviewMode&&isLastPosition();
  if(ex.type==='decision'&&!(already&&S.results[ex.id])){
    var st=S.dec[ex.id];
    checkBtn.innerHTML=(st.step===ex.steps.length-1)?'&#10003; Check (final step)':'Confirm step &#8594;';
  }else{
    checkBtn.innerHTML='&#10003; Check'+(last?' &amp; finish':'');
  }
  act.appendChild(checkBtn);
  root.appendChild(act);
  var hintPanel=document.createElement('div');
  hintPanel.id='hintpanel';hintPanel.className='hintp hidden';
  root.appendChild(hintPanel);
  var nav=document.createElement('div');nav.id='exnav';nav.style.marginTop='12px';
  root.appendChild(nav);

  $('hintbtn').disabled=!!S.hintUsed[ex.id];
  if(S.hintUsed[ex.id]){
    hintPanel.classList.remove('hidden');
    hintPanel.innerHTML='<div class="ht"><span aria-hidden="true">&#128161;</span><span>HINT (used — credit reduced by 0.10)</span></div><div>'+esc(ex.hint)+'</div>';
  }
  $('skipbtn').disabled=!!S.answeredFlags[ex.id];

  /* option clicks (qcm/spot/multi/logview) */
  var optlist=root.querySelector('#optlist');
  if(optlist&&ex._shufOpts){
    var shuf=ex._shufOpts;
    optlist.addEventListener('click',function(ev){
      var b=ev.target.closest('.opt');
      if(!b||b.classList.contains('locked'))return;
      var pos=parseInt(b.getAttribute('data-opt'),10);
      var orig=shuf[pos].i;
      if(ex.type==='multi'){
        var k=CURSEL.indexOf(orig);
        if(k>=0){CURSEL.splice(k,1);}else{CURSEL.push(orig);}
        b.classList.toggle('sel',k<0);
        b.setAttribute('aria-pressed',k<0?'true':'false');
      }else{
        CURSEL=[orig];
        var all=optlist.querySelectorAll('.opt');
        for(var x=0;x<all.length;x++){all[x].classList.remove('sel');all[x].setAttribute('aria-pressed','false');}
        b.classList.add('sel');b.setAttribute('aria-pressed','true');
      }
    });
  }

  /* change events (match/fill/triage) */
  root.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.classList&&t.classList.contains('pair-sel')){
      var id=t.getAttribute('data-pair');
      S.answers[ex.id]=S.answers[ex.id]||{};
      S.answers[ex.id][id]=t.value;
    }else if(t.classList&&t.classList.contains('fill-sel')){
      var bi=parseInt(t.getAttribute('data-blank'),10);
      S.answers[ex.id]=S.answers[ex.id]||[];
      S.answers[ex.id][bi]=t.value;
    }else if(t.closest&&t.closest('.asel')){
      var al=t.closest('.asel').getAttribute('data-al');
      S.answers[ex.id]=S.answers[ex.id]||{};
      S.answers[ex.id][al]=parseInt(t.value,10);
      var labs=t.closest('.asel').querySelectorAll('label');
      for(var li=0;li<labs.length;li++){labs[li].classList.toggle('on',labs[li].querySelector('input').checked);}
    }
  });

  /* already answered → locked view with feedback */
  if(already){
    lockAll(root);
    checkBtn.style.display='none';
    var res=S.results[ex.id]||{credit:S.answered[ex.id]||0,items:null,H:0,N:1};
    var fbw=document.createElement('div');
    fbw.innerHTML=feedHTML(ex,res);
    root.insertBefore(fbw.firstChild,$('exnav'));
    bindCopy(root);
    renderNavAfterCheck(ex);
    updateHeader();
    return;
  }

  /* check / step confirm */
  checkBtn.addEventListener('click',function(){
    if(ex.type==='decision'&&S.dec[ex.id].step<ex.steps.length-1){
      if(decisionAdvance(ex,checkBtn)){
        S.answers[ex.id]=S.dec[ex.id].answers;
      }
      return;
    }
    doCheck(ex);
  });
  updateHeader();
}
function gradeOptsSel(ex){
  /* restore selection for locked re-render (single types) */
  var r=S.results[ex.id];
  return (r&&r.sel&&r.sel.length)?[r.sel[0]]:[];
}
function flash(msg){
  var t=$('toast');
  t.innerHTML='&#9888; '+esc(msg);
  t.classList.remove('hidden');
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){t.classList.add('hidden');},3000);
}

/* ================= GRADING DISPATCH ================= */
function doCheck(ex){
  var res;
  switch(ex.type){
    case 'qcm': case 'spot': case 'logview':
      if(CURSEL.length===0){flash('Select an option, then press Check.');return;}
      res=gradeOpts(ex,CURSEL,false);
      S.answers[ex.id]=CURSEL[0];
      break;
    case 'multi':
      if(CURSEL.length===0){flash('Select at least one option, then press Check.');return;}
      res=gradeOpts(ex,CURSEL,true);
      S.answers[ex.id]=CURSEL.slice();
      break;
    case 'match':{
      var ans=S.answers[ex.id]||{};
      var any=false;for(var k in ans){if(ans.hasOwnProperty(k)&&ans[k]){any=true;break;}}
      if(!any){flash('Match at least one item, then press Check.');return;}
      res=gradeMatch(ex,ans);break;}
    case 'dnd':{
      var p=S.answers[ex.id]||{};var anyp=false;
      for(var pk in p){if(p.hasOwnProperty(pk)&&p[pk]){anyp=true;break;}}
      if(!anyp){flash('Place the items into zones, then press Check.');return;}
      res=gradeDND(ex);break;}
    case 'order':
      res=gradeOrder(ex);break;
    case 'fill':{
      var f=S.answers[ex.id]||[];var anyf=false;
      for(var fi=0;fi<f.length;fi++){if(f[fi]){anyf=true;break;}}
      if(!anyf){flash('Fill at least one blank, then press Check.');return;}
      res=gradeFill(ex,f);break;}
    case 'query':{
      var qv=$('qinput')?$('qinput').value:'';
      if(!qv.trim()){flash('Type your query, then press Check.');return;}
      S.answers[ex.id]=qv;
      res=gradeQuery(ex);break;}
    case 'decision':{
      var st=S.dec[ex.id];
      if(st.answers[st.step]==null){flash('Choose an option for the final step.');return;}
      var N=ex.steps.length,H=0,W=0,items=[];
      for(var i=0;i<N;i++){
        var got=st.answers[i];var okIdx=0;
        for(var g=0;g<ex.steps[i].options.length;g++){if(ex.steps[i].options[g].ok){okIdx=g;break;}}
        if(got==null){items.push({status:'missed',label:'Step '+(i+1),why:'Correct: '+ex.steps[i].options[okIdx].t.slice(0,90)});}
        else if(got===okIdx){H++;items.push({status:'correct',label:'Step '+(i+1)+': '+ex.steps[i].options[okIdx].t.slice(0,90)});}
        else{W++;items.push({status:'wrong',label:'Step '+(i+1)+': '+ex.steps[i].options[got].t.slice(0,90),why:'Correct: '+ex.steps[i].options[okIdx].t.slice(0,90)});}
      }
      res={credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,
        correctSummary:esc(ex.steps.map(function(s,ix){var oi=0;for(var g2=0;g2<s.options.length;g2++){if(s.options[g2].ok){oi=g2;break;}}return 'Step '+(ix+1)+': '+s.options[oi].t;}).join(' • '))};
      break;}
    case 'triage':{
      var ta=S.answers[ex.id]||{};
      var N2=ex.alerts.length,H2=0,W2=0,items2=[];
      for(var a=0;a<N2;a++){
        var got2=ta[a];var okIdx2=0;
        for(var g3=0;g3<ex.alerts[a].options.length;g3++){if(ex.alerts[a].options[g3].ok){okIdx2=g3;break;}}
        if(got2==null){items2.push({status:'missed',label:ex.alerts[a].title,why:'Correct action: '+ex.alerts[a].options[okIdx2].t.slice(0,90)});}
        else if(got2===okIdx2){H2++;items2.push({status:'correct',label:ex.alerts[a].title+' → '+ex.alerts[a].options[okIdx2].t.slice(0,70)});}
        else{W2++;items2.push({status:'wrong',label:ex.alerts[a].title+' → '+ex.alerts[a].options[got2].t.slice(0,70),why:'Correct action: '+ex.alerts[a].options[okIdx2].t.slice(0,90)});}
      }
      res={credit:scoreExercise(H2,W2,N2),H:H2,W:W2,N:N2,items:items2,
        correctSummary:esc(ex.alerts.map(function(al,ix){var oi=0;for(var g4=0;g4<al.options.length;g4++){if(al.options[g4].ok){oi=g4;break;}}return al.title+' → '+al.options[oi].t;}).join(' • '))};
      break;}
    default:
      return;
  }
  afterCheckCommon(ex,res);
  res.sel=CURSEL.slice();
  S.results[ex.id]=res;
  /* mark good/bad on options for choice types */
  if((ex.type==='qcm'||ex.type==='spot'||ex.type==='multi'||ex.type==='logview')&&ex._shufOpts){
    var optlist=$('optlist');
    if(optlist){
      var shuf=ex._shufOpts;
      var btns=optlist.querySelectorAll('.opt');
      for(var b2=0;b2<btns.length;b2++){
        var origIdx=shuf[parseInt(btns[b2].getAttribute('data-opt'),10)].i;
        if(ex.options[origIdx].ok){btns[b2].classList.add('good');}
        else if(CURSEL.indexOf(origIdx)>=0){btns[b2].classList.add('bad');}
      }
    }
  }
  var cb=$('checkbtn');if(cb){cb.style.display='none';}
  lockAll($('exbody'));
  var fbw=document.createElement('div');
  fbw.innerHTML=feedHTML(ex,res);
  var nav=$('exnav');
  $('exbody').insertBefore(fbw.firstChild,nav);
  bindCopy($('exbody'));
  renderNavAfterCheck(ex);
  updateHeader();
  var fb=document.querySelector('.feed');
  if(fb&&fb.scrollIntoView){fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

  $('pausebtn').addEventListener('click',togglePause);
  $('resumebtn').addEventListener('click',togglePause);
  $('hintbtn').addEventListener('click',useHint);
  $('skipbtn').addEventListener('click',skipCurrent);
  renderIntro();
  updateHeader();
})();

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
