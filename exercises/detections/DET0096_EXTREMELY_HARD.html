  /* ---------- exam flow ---------- */
  function startExam() {
    resetRun();
    show('exam');
    S.idx = 0;
    S.mode = 'normal';
    renderExercise();
  }
  function resetRun() {
    S.order = shuffle(DATA.exercises.map(function (e) { return e.id; }));
    S.idx = 0; S.credits = {}; S.answered = {}; S.skipped = []; S.hintUsed = {};
    S.sel = {}; S.branch = {}; S.reported = false; S.timeUpNotice = false;
    S.remaining = DATA.timerSeconds;
    S.prevTState = null; S.hidden = false;
    S.pauseTotals = { manual: 0, auto: 0 };
    leavePause();
    setTState('RUNNING');
  }
  function currentEx() {
    if (S.mode === 'review-return') { return S.reviewEx ? EX[S.reviewEx] : null; }
    if (S.idx >= 0 && S.idx < S.order.length) { return EX[S.order[S.idx]]; }
    return null;
  }

  function renderExercise() {
    var ex = currentEx();
    if (!ex) { afterExam(); return; }
    var stage = $('#stage');
    stage.innerHTML = '';
    var holder = el('div', 'stageposition');
    holder.id = 'stageinner';
    stage.appendChild(holder);
    holder.appendChild(buildCard(ex));
    renderHeader();
    holder.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
    renderPauseUI();
  }

  function buildCard(ex) {
    var wrap = el('div');
    var head = el('div', null, '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="chip">' + esc(ex.concept) + '</span>' +
      '<span class="chip">' + esc(TYPE_NAMES[ex.type] || 'Exercise') + '</span></div>');
    wrap.appendChild(head);

    /* SCENARIO block */
    var sc = el('div', 'block scenario');
    var collapsible = !!ex.collapsible;
    var scHead = el('div', 'bhead', '<span class="bic">\uD83D\uDCC4</span> SCENARIO');
    sc.appendChild(scHead);
    var body = el('div', 'bbody');
    (ex.scenario.paras || []).forEach(function (p) { body.appendChild(el('p', null, p)); });
    (ex.scenario.artefacts || []).forEach(function (a) {
      var art = el('div', 'artefact');
      art.appendChild(el('span', 'alabel', esc(a.label)));
      var pre = el('pre');
      pre.innerHTML = a.lines.map(hl).join('\n');
      art.appendChild(pre);
      body.appendChild(art);
    });
    sc.appendChild(body);
    if (collapsible) {
      var colBtn = el('button', 'collapser', '\u25B4 Collapse scenario \u2014 ' + esc(ex.summary));
      colBtn.addEventListener('click', function () {
        var open = body.style.display !== 'none';
        body.style.display = open ? 'none' : '';
        colBtn.innerHTML = open ? '\u25B2 Scenario collapsed \u2014 ' + esc(ex.summary) : '\u25B4 Collapse scenario \u2014 ' + esc(ex.summary);
      });
      sc.appendChild(el('div', 'bbody', '')).appendChild(colBtn);
      if (ex.startCollapsed) { body.style.display = 'none'; colBtn.innerHTML = '\u25B2 Scenario collapsed \u2014 ' + esc(ex.summary); }
    }
    wrap.appendChild(sc);

    /* QUESTION block */
    var q = el('div', 'block question');
    q.appendChild(el('div', 'bhead', '<span class="bic">\u2753</span> QUESTION'));
    q.appendChild(el('div', 'bbody', '<p class="question-text">' + esc(ex.question) + '</p>'));
    wrap.appendChild(q);

    /* YOUR ANSWER block */
    var a = el('div', 'block answer');
    a.appendChild(el('div', 'bhead', '<span class="bic">\u270D</span> YOUR ANSWER'));
    var ab = el('div', 'bbody');
    ab.appendChild(buildWidget(ex));
    var act = el('div', 'actions');
    if (ex.type === 'branch') {
      /* branch renders its own step button; a final Check is added at last step */
    } else {
      var chk = el('button', 'abtn check', 'Check answer');
      chk.id = 'btncheck';
      chk.addEventListener('click', function () { doCheck(ex); });
      act.appendChild(chk);
    }
    a.appendChild(ab);
    a.appendChild(act);
    wrap.appendChild(a);

    var fbSlot = el('div');
    fbSlot.id = 'fbslot';
    wrap.appendChild(fbSlot);
    return wrap;
  }

  /* ---------- widgets per exercise type ---------- */
  var TYPE_NAMES = {
    qcm: 'Single-choice question', multi: 'Multi-select \u00B7 partial credit',
    match: 'Matching \u00B7 partial credit', order: 'Ordering \u00B7 partial credit',
    dragdrop: 'Drag & drop \u00B7 partial credit', fill: 'Fill in the blanks \u00B7 partial credit',
    clicklines: 'Log analysis \u00B7 partial credit', branch: 'Decision walkthrough \u00B7 partial credit',
    query: 'Query editor \u00B7 partial credit'
  };

  function buildWidget(ex) {
    switch (ex.type) {
      case 'qcm': return widgetQcm(ex);
      case 'multi': return widgetMulti(ex);
      case 'match': return widgetMatch(ex);
      case 'order': return widgetOrder(ex);
      case 'dragdrop': return widgetDragDrop(ex);
      case 'fill': return widgetFill(ex);
      case 'clicklines': return widgetClickLines(ex);
      case 'branch': return widgetBranch(ex);
      case 'query': return widgetQuery(ex);
    }
    return el('div', null, 'Unsupported exercise type.');
  }

  /* --- qcm --- */
  function widgetQcm(ex) {
    var box = el('div');
    var opts = ex.options.map(function (o, i) { return { t: o.t, correct: !!o.correct, i: i }; });
    opts = shuffle(opts);
    S.sel[ex.id] = { picked: -1, opts: opts };
    opts.forEach(function (o, pos) {
      var b = el('button', 'opt', '<span class="olabel">' + letters(pos) + '</span><span>' + esc(o.t) + '</span><span class="omark hidden">\u25CF Selected</span>');
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.addEventListener('click', function () {
        if (S.answered[ex.id]) { return; }
        S.sel[ex.id].picked = o.i;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (n) {
          n.classList.remove('selected'); n.setAttribute('aria-checked', 'false');
          n.querySelector('.omark').classList.add('hidden');
        });
        b.classList.add('selected'); b.setAttribute('aria-checked', 'true');
        b.querySelector('.omark').classList.remove('hidden');
      });
      box.appendChild(b);
    });
    return box;
  }

  /* --- multi --- */
  function widgetMulti(ex) {
    var box = el('div');
    var opts = ex.options.map(function (o, i) { return { t: o.t, correct: !!o.correct, i: i }; });
    opts = shuffle(opts);
    S.sel[ex.id] = { picks: {}, opts: opts };
    opts.forEach(function (o, pos) {
      var b = el('button', 'opt', '<span class="olabel">' + letters(pos) + '</span><span>' + esc(o.t) + '</span><span class="omark hidden">\u2713 Selected</span>');
      b.setAttribute('role', 'checkbox');
      b.setAttribute('aria-checked', 'false');
      b.addEventListener('click', function () {
        if (S.answered[ex.id]) { return; }
        var on = b.classList.toggle('selected');
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.querySelector('.omark').classList.toggle('hidden', !on);
        S.sel[ex.id].picks[o.i] = on;
      });
      box.appendChild(b);
    });
    box.appendChild(el('p', 'dnd-note', 'Select all statements that apply. Wrong selections subtract from your score (max(0, (H \u2212 W) / N)).'));
    return box;
  }

  /* --- match --- */
  function widgetMatch(ex) {
    var box = el('div');
    var rights = shuffle(ex.rights);
    S.sel[ex.id] = { picks: {} };
    ex.lefts.forEach(function (L, li) {
      var row = el('div', 'match-row');
      row.appendChild(el('span', 'mlabel', '<span class="olabel">' + letters(li) + '</span> ' + esc(L)));
      var sel = el('select');
      sel.appendChild(el('option', null, '\u2014 choose the match \u2014'));
      rights.forEach(function (r) {
        var o = el('option', null, esc(r));
        o.value = r;
        sel.appendChild(o);
      });
      sel.setAttribute('aria-label', 'Match for: ' + L);
      sel.addEventListener('change', function () { S.sel[ex.id].picks[L] = sel.value || ''; });
      row.appendChild(sel);
      box.appendChild(row);
    });
    return box;
  }

  /* --- order --- */
  function widgetOrder(ex) {
    var box = el('div');
    var items = shuffle(ex.items);
    S.sel[ex.id] = { order: items.slice() };
    var ol = el('ol', 'order-list');
    ol.id = 'olist-' + ex.id;
    function redraw() {
      ol.innerHTML = '';
      S.sel[ex.id].order.forEach(function (it, i) {
        var li = el('li');
        li.setAttribute('draggable', 'true');
        li.appendChild(el('span', 'posnum', String(i + 1)));
        li.appendChild(el('span', 'otext', esc(it)));
        var mv = el('span', 'mv');
        var up = el('button', null, '\u2191'); up.setAttribute('aria-label', 'Move up: ' + it);
        up.addEventListener('click', function () {
          var a = S.sel[ex.id].order;
          if (i > 0) { var t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; redraw(); }
        });
        var dn = el('button', null, '\u2193'); dn.setAttribute('aria-label', 'Move down: ' + it);
        dn.addEventListener('click', function () {
          var a = S.sel[ex.id].order;
          if (i < a.length - 1) { var t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; redraw(); }
        });
        mv.appendChild(up); mv.appendChild(dn);
        li.appendChild(mv);
        li.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(i)); });
        li.addEventListener('dragover', function (ev) { ev.preventDefault(); li.classList.add('dragover'); });
        li.addEventListener('dragleave', function () { li.classList.remove('dragover'); });
        li.addEventListener('drop', function (ev) {
          ev.preventDefault(); li.classList.remove('dragover');
          var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
          if (isNaN(from) || from === i) { return; }
          var a = S.sel[ex.id].order;
          var moved = a.splice(from, 1)[0];
          a.splice(i, 0, moved);
          redraw();
        });
        ol.appendChild(li);
      });
    }
    redraw();
    box.appendChild(ol);
    box.appendChild(el('p', 'dnd-note', 'Use the arrows or drag the rows. The first row is step 1.'));
    return box;
  }

  /* --- dragdrop --- */
  function widgetDragDrop(ex) {
    var box = el('div');
    var items = shuffle(ex.items);
    S.sel[ex.id] = { placed: {} }; /* itemId -> zoneId ('__bank' when unplaced) */
    var board = el('div', 'dnd-board');
    var bank = el('div', 'bank');
    bank.setAttribute('data-zone', '__bank');
    bank.appendChild(el('div', 'zname', '\uD83D\uDDC2 Item bank \u2014 drag each item to a zone (or click item, then click a zone)'));
    var blist = el('div', 'zlist'); bank.appendChild(blist);
    var zones = el('div', 'dnd-zones');
    var zoneEls = {};
    ex.zones.forEach(function (z) {
      var zd = el('div', 'dnd-zone');
      zd.setAttribute('data-zone', z.id);
      zd.appendChild(el('div', 'zname', esc(z.label)));
      var zl = el('div', 'zlist'); zd.appendChild(zl);
      zones.appendChild(zd);
      zoneEls[z.id] = zd;
    });
    function placeDrop(zoneId) { return function (ev) { ev.preventDefault(); ev.stopPropagation(); if (S.pickedItem) { moveItem(S.pickedItem, zoneId); clearPick(); } }; }
    function moveItem(itemId, zoneId) {
      var it = EXITEMS[ex.id][itemId];
      var cur = S.sel[ex.id].placed[itemId] || '__bank';
      if (cur === zoneId) { return; }
      var node = document.getElementById('itm-' + itemId);
      if (!node) { return; }
      S.sel[ex.id].placed[itemId] = zoneId;
      if (zoneId === '__bank') { blist.appendChild(node); }
      else { zoneEls[zoneId].querySelector('.zlist').appendChild(node); }
    }
    var EXITEMS = {};
    EXITEMS[ex.id] = {};
    items.forEach(function (it) {
      EXITEMS[ex.id][it.id] = it;
      var b = el('button', 'dnd-item', esc(it.label));
      b.id = 'itm-' + it.id;
      b.setAttribute('draggable', 'true');
      b.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', it.id); S.pickedItem = it.id; });
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (S.pickedItem === it.id) { clearPick(); return; }
        clearPick();
        S.pickedItem = it.id;
        b.classList.add('picked');
      });
      blist.appendChild(b);
    });
    function clearPick() {
      S.pickedItem = null;
      Array.prototype.forEach.call(box.querySelectorAll('.dnd-item'), function (n) { n.classList.remove('picked'); });
    }
    [bank].concat(Object.keys(zoneEls).map(function (k) { return zoneEls[k]; })).forEach(function (z) {
      z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('dragover'); });
      z.addEventListener('dragleave', function () { z.classList.remove('dragover'); });
      z.addEventListener('drop', function (ev) {
        ev.preventDefault(); z.classList.remove('dragover');
        var id = ev.dataTransfer.getData('text/plain');
        if (id && EXITEMS[ex.id][id]) { moveItem(id, z.getAttribute('data-zone')); clearPick(); }
      });
      z.addEventListener('click', function () { if (S.pickedItem) { moveItem(S.pickedItem, z.getAttribute('data-zone')); clearPick(); } });
    });
    board.appendChild(bank);
    board.appendChild(zones);
    box.appendChild(board);
    return box;
  }

  /* --- fill --- */
  function widgetFill(ex) {
    var box = el('div');
    S.sel[ex.id] = { vals: {} };
    var bl = el('div', 'blanks');
    ex.blanks.forEach(function (B, i) {
      var row = el('div', 'blank-line');
      row.innerHTML = '<strong>Blank ' + (i + 1) + '.</strong> ' + esc(B.prompt) + ' ';
      if (B.bank) {
        var sel = el('select', 'blank-sel');
        sel.appendChild(el('option', null, '\u2014 choose a word \u2014'));
        shuffle(B.bank).forEach(function (w) { var o = el('option', null, esc(w)); o.value = w; sel.appendChild(o); });
        sel.setAttribute('aria-label', 'Blank ' + (i + 1));
        sel.addEventListener('change', function () { S.sel[ex.id].vals[i] = sel.value || ''; });
        row.appendChild(sel);
      } else {
        var inp = el('input', 'blank-in');
        inp.type = 'text';
        inp.setAttribute('aria-label', 'Blank ' + (i + 1));
        inp.placeholder = B.placeholder || 'type here';
        inp.addEventListener('input', function () { S.sel[ex.id].vals[i] = inp.value; });
        row.appendChild(inp);
      }
      bl.appendChild(row);
    });
    box.appendChild(bl);
    if (ex.bankWords) {
      var bw = el('div', 'bankwords');
      bw.appendChild(el('div', 'zname', 'Word bank (shuffled):'));
      var chips = el('div', 'chips');
      shuffle(ex.bankWords).forEach(function (w) { chips.appendChild(el('span', 'chip mono', esc(w))); });
      bw.appendChild(chips);
      box.appendChild(bw);
    }
    return box;
  }

  /* --- clicklines --- */
  function widgetClickLines(ex) {
    var box = el('div');
    S.sel[ex.id] = { picked: {} };
    if (ex.filter) {
      var f = el('input', 'filterbox');
      f.type = 'text';
      f.placeholder = 'Filter lines (case-insensitive, like a SIEM search box)';
      f.setAttribute('aria-label', 'Filter log lines');
      box.appendChild(f);
      f.addEventListener('input', function () {
        var q = f.value.toLowerCase();
        Array.prototype.forEach.call(box.querySelectorAll('.line'), function (n) {
          n.style.display = (!q || n.getAttribute('data-raw').toLowerCase().indexOf(q) >= 0) ? '' : 'none';
        });
      });
    }
    var wrap = el('div', 'lines');
    ex.lines.forEach(function (L) {
      var b = el('button', 'line');
      b.setAttribute('data-raw', L.t);
      b.innerHTML = '<span class="pickmark hidden">\u2713</span>' + hl(L.t);
      b.addEventListener('click', function () {
        if (S.answered[ex.id]) { return; }
        if (ex.maxSelect === 1) {
          S.sel[ex.id].picked = {};
          Array.prototype.forEach.call(wrap.querySelectorAll('.line'), function (n) {
            n.classList.remove('selected'); n.querySelector('.pickmark').classList.add('hidden');
          });
          S.sel[ex.id].picked[L.i] = true;
          b.classList.add('selected');
          b.querySelector('.pickmark').classList.remove('hidden');
        } else {
          var on = !S.sel[ex.id].picked[L.i];
          if (on) {
            var count = Object.keys(S.sel[ex.id].picked).length;
            if (ex.maxSelect && count >= ex.maxSelect) { return; }
            S.sel[ex.id].picked[L.i] = true;
            b.classList.add('selected');
            b.querySelector('.pickmark').classList.remove('hidden');
          } else {
            delete S.sel[ex.id].picked[L.i];
            b.classList.remove('selected');
            b.querySelector('.pickmark').classList.add('hidden');
          }
        }
      });
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
    box.appendChild(el('p', 'dnd-note', ex.maxSelect === 1 ? 'Click the one line that answers the question.' :
      'Click ' + (ex.maxSelect ? 'up to ' + ex.maxSelect : 'all') + ' lines. Wrong selections subtract from your score.'));
    return box;
  }

  /* --- branch --- */
  function widgetBranch(ex) {
    var box = el('div');
    if (!S.branch[ex.id]) { S.branch[ex.id] = { step: 0, picks: [] }; }
    renderBranchStep(ex, box);
    return box;
  }
  function renderBranchStep(ex, box) {
    box.innerHTML = '';
    var st = S.branch[ex.id];
    var step = ex.steps[st.step];
    box.appendChild(el('div', 'bstep', 'STEP ' + (st.step + 1) + ' OF ' + ex.steps.length));
    box.appendChild(el('div', 'breadcrumb', 'Answer each step and confirm. The timer keeps running between steps. Only the final check pauses it.'));
    box.appendChild(el('div', 'bstepq', esc(step.q)));
    var opts = shuffle(step.options.map(function (o, i) { return { t: o.t, correct: !!o.correct, i: i }; }));
    var chosen = st.picks[st.step];
    opts.forEach(function (o, pos) {
      var b = el('button', 'opt', '<span class="olabel">' + letters(pos) + '</span><span>' + esc(o.t) + '</span><span class="omark hidden">\u25CF Selected</span>');
      if (chosen === o.i) { b.classList.add('selected'); b.querySelector('.omark').classList.remove('hidden'); }
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (n) {
          n.classList.remove('selected'); n.querySelector('.omark').classList.add('hidden');
        });
        b.classList.add('selected'); b.querySelector('.omark').classList.remove('hidden');
        st.picks[st.step] = o.i;
        S.branchSel = o.i;
        var ab = box.querySelector('.actions .abtn');
        if (ab) { ab.disabled = false; }
      });
      box.appendChild(b);
    });
    var act = el('div', 'actions');
    var last = st.step === ex.steps.length - 1;
    var btn = el('button', last ? 'abtn check' : 'abtn next', last ? 'Check answers (final step)' : 'Confirm step & continue');
    btn.disabled = (st.picks[st.step] === undefined);
    btn.addEventListener('click', function () {
      if (st.picks[st.step] === undefined) { return; }
      if (!last) {
        st.step += 1;
        renderBranchStep(ex, box);
      } else {
        doCheck(ex);
      }
    });
    act.appendChild(btn);
    box.appendChild(act);
  }

  /* --- query editor --- */
  function widgetQuery(ex) {
    var box = el('div');
    S.sel[ex.id] = { text: '' };
    var shell = el('div', 'shell');
    var out = el('div', 'shell-out mono');
    out.appendChild(el('div', 'echo t-noise', esc(ex.shellBanner || 'Query editor ready.')));
    var inline = el('div', 'shell-in');
    inline.appendChild(el('span', 'prompt', esc(ex.prompt || 'query>')));
    var inp = el('input');
    inp.type = 'text';
    inp.setAttribute('aria-label', 'Query input');
    inp.spellcheck = false;
    inp.addEventListener('input', function () { S.sel[ex.id].text = inp.value; });
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); echoLine(); } });
    inline.appendChild(inp);
    shell.appendChild(out); shell.appendChild(inline);
    box.appendChild(shell);
    if (ex.queryHint) { box.appendChild(el('div', 'shell-hint', esc(ex.queryHint))); }
    function echoLine() {
      var v = inp.value.trim();
      if (v) { out.appendChild(el('div', 'echo', esc(ex.prompt || 'query>') + ' ' + esc(v))); out.scrollTop = out.scrollHeight; }
    }
    S.queryEcho = echoLine;
    return box;
  }

  /* ---------- grading ---------- */
  function doCheck(ex) {
    if (S.answered[ex.id]) { return; }
    var res = grade(ex);
    var credit = res.credit;
    if (S.hintUsed[ex.id]) { credit = Math.max(0, credit - 0.10); }
    S.credits[ex.id] = credit;
    S.answered[ex.id] = true;
    if (ex.type === 'query' && S.queryEcho) { S.queryEcho(); }
    /* Check-triggered auto-pause */
    if (S.tState === 'RUNNING') {
      enterPause('auto');
      setTState('PAUSED_AUTO_CHECK');
    }
    renderFeedback(ex, res, credit);
    renderHeader();
    var chk = $('#btncheck');
    if (chk) { chk.disabled = true; chk.classList.add('hidden'); }
    var actRow = $('#stageinner .actions');
    if (actRow) {
      var nx = el('button', 'abtn next', (isLastMain() && S.mode === 'normal') ? 'Final Submit \u2192' : (S.mode === 'review-return' ? 'Return to review \u2192' : 'Next exercise \u2192'));
      nx.addEventListener('click', goNext);
      actRow.appendChild(nx);
    }
    var fb = $('#fbslot .feedback');
    if (fb) { fb.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }
  }

  function isLastMain() {
    return S.mode === 'normal' && S.idx >= S.order.length - 1;
  }

  function grade(ex) {
    var out = { credit: 0, items: [], extra: null };
    switch (ex.type) {
      case 'qcm': {
        var picked = S.sel[ex.id].picked;
        var correctIdx = -1;
        ex.options.forEach(function (o, i) { if (o.correct) { correctIdx = i; } });
        var ok = picked === correctIdx;
        out.credit = ok ? 1 : 0;
        out.items = [{ label: ex.options[correctIdx].t, status: ok ? 'ok' : (picked === -1 ? 'miss' : 'bad') }];
        break;
      }
      case 'multi': {
        var picks = S.sel[ex.id].picks || {};
        var H = 0, W = 0, N = 0;
        ex.options.forEach(function (o, i) {
          var selOn = !!picks[i];
          if (o.correct) {
            N += 1;
            if (selOn) { H += 1; out.items.push({ label: o.t, status: 'ok', why: (o.note || '') }); }
            else { out.items.push({ label: o.t, status: 'miss', why: (o.note || '') }); }
          } else if (selOn) {
            W += 1;
            out.items.push({ label: o.t, status: 'bad', why: (o.note || '') });
          }
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'match': {
        var picks = S.sel[ex.id].picks || {};
        var H = 0, W = 0, N = ex.lefts.length;
        ex.lefts.forEach(function (L) {
          var right = ex.pairs[L];
          var got = picks[L] || '';
          if (got && got === right) { H += 1; out.items.push({ label: L + ' \u2192 ' + right, status: 'ok', why: (ex.notes && ex.notes[L]) || '' }); }
          else if (got && got !== right) { W += 1; out.items.push({ label: L + ' \u2192 ' + got, status: 'bad', why: 'Correct match: ' + right + '. ' + ((ex.notes && ex.notes[L]) || '') }); }
          else { out.items.push({ label: L + ' \u2192 (no answer)', status: 'miss', why: 'Correct match: ' + right + '. ' + ((ex.notes && ex.notes[L]) || '') }); }
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'order': {
        var cur = S.sel[ex.id].order;
        var H = 0, W = 0, N = cur.length;
        cur.forEach(function (it, i) {
          var correctPos = ex.items.indexOf(it);
          var ok = correctPos === i;
          if (ok) { H += 1; } else { W += 1; }
          out.items.push({ label: 'Position ' + (i + 1) + ': ' + it, status: ok ? 'ok' : 'bad', why: ok ? 'This is step ' + (correctPos + 1) + ' of the chain.' : 'This belongs at step ' + (correctPos + 1) + ', not step ' + (i + 1) + '.' });
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'dragdrop': {
        var placed = S.sel[ex.id].placed || {};
        var H = 0, W = 0, N = ex.items.length;
        ex.items.forEach(function (it) {
          var where = placed[it.id] || '__bank';
          if (where === it.zone) { H += 1; out.items.push({ label: it.label + ' \u2192 ' + zoneLabel(ex, it.zone), status: 'ok', why: (it.note || '') }); }
          else if (where === '__bank') { out.items.push({ label: it.label + ' \u2192 left in bank', status: 'miss', why: 'Belongs in: ' + zoneLabel(ex, it.zone) + '. ' + (it.note || '') }); }
          else { W += 1; out.items.push({ label: it.label + ' \u2192 ' + zoneLabel(ex, where), status: 'bad', why: 'Belongs in: ' + zoneLabel(ex, it.zone) + '. ' + (it.note || '') }); }
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'fill': {
        var vals = S.sel[ex.id].vals || {};
        var H = 0, W = 0, N = ex.blanks.length;
        ex.blanks.forEach(function (B, i) {
          var raw = vals[i] || '';
          var v = B.bank ? raw : normText(raw);
          var acc = (B.accept || []).map(function (a) { return B.bank ? a : normText(a); });
          if (!raw.trim()) { out.items.push({ label: 'Blank ' + (i + 1) + ': ' + B.prompt, status: 'miss', why: 'Expected: ' + (B.display || B.accept[0]) + '. ' + (B.note || '') }); }
          else if (acc.indexOf(v) >= 0) { H += 1; out.items.push({ label: 'Blank ' + (i + 1) + ': ' + B.prompt + ' \u2192 ' + raw.trim(), status: 'ok', why: (B.note || '') }); }
          else { W += 1; out.items.push({ label: 'Blank ' + (i + 1) + ': ' + B.prompt + ' \u2192 ' + raw.trim(), status: 'bad', why: 'Expected: ' + (B.display || B.accept[0]) + '. ' + (B.note || '') }); }
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'clicklines': {
        var picked = S.sel[ex.id].picked || {};
        var H = 0, W = 0, N = 0;
        ex.lines.forEach(function (L) {
          if (L.correct) {
            N += 1;
            if (picked[L.i]) { H += 1; out.items.push({ label: shortLine(L.t), status: 'ok', why: (L.note || '') }); }
            else { out.items.push({ label: shortLine(L.t), status: 'miss', why: (L.note || '') }); }
          } else if (picked[L.i]) {
            W += 1;
            out.items.push({ label: shortLine(L.t), status: 'bad', why: (L.note || 'This line is not part of the answer.') });
          }
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'branch': {
        var st = S.branch[ex.id];
        var H = 0, W = 0, N = ex.steps.length;
        ex.steps.forEach(function (step, i) {
          var pick = st.picks[i];
          var correctIdx = -1;
          step.options.forEach(function (o, oi) { if (o.correct) { correctIdx = oi; } });
          var ok = pick === correctIdx;
          if (ok) { H += 1; } else if (pick !== undefined) { W += 1; }
          out.items.push({
            label: 'Step ' + (i + 1) + ': ' + (ok ? step.options[correctIdx].t : (pick !== undefined ? step.options[pick].t : '(no answer)')),
            status: ok ? 'ok' : (pick !== undefined ? 'bad' : 'miss'),
            why: step.note || ''
          });
        });
        out.credit = scoreExercise(H, W, N);
        break;
      }
      case 'query': {
        var raw = S.sel[ex.id].text || '';
        var v = normText(raw);
        var H = 0, W = 0, N = ex.elements.length;
        var wrongHits = [];
        ex.elements.forEach(function (E) {
          var hit = (E.any || []).some(function (re) { return re.test(v); });
          if (hit) { H += 1; out.items.push({ label: E.label, status: 'ok', why: E.note || '' }); }
          else { out.items.push({ label: E.label, status: (v ? 'miss' : 'miss'), why: E.note || '' }); }
        });
        (ex.wrongAny || []).forEach(function (w) {
          if (w.re.test(v)) { W += 1; wrongHits.push(w.label); }
        });
        out.credit = scoreExercise(H, W, N);
        out.extra = { kind: 'query', canonical: ex.canonical, wrongHits: wrongHits, dangerousHit: (ex.dangerous || []).some(function (D) { return D.re.test(v); }) };
        break;
      }
    }
    return out;
  }

  function shortLine(t) {
    t = String(t);
    if (t.length > 90) { t = t.slice(0, 88) + '\u2026'; }
    return t;
  }
  function zoneLabel(ex, zid) {
    var z = ex.zones.filter(function (z) { return z.id === zid; })[0];
    return z ? z.label : zid;
  }

  /* ---------- feedback ---------- */
  function renderFeedback(ex, res, credit) {
    var slot = $('#fbslot');
    slot.innerHTML = '';
    var cls, label, icon;
    if (credit >= 1) { cls = 'st-correct'; label = 'CORRECT'; icon = '\u2713'; }
    else if (credit > 0) { cls = 'st-partial'; label = 'PARTIALLY CORRECT'; icon = '\u2713'; }
    else { cls = 'st-incorrect'; label = 'INCORRECT'; icon = '\u2717'; }
    var fb = el('div', 'feedback ' + cls);
    /* every multi-answer exercise must show its fractional credit; a single-answer
       exercise shows it only when a hint penalty changed the raw 0/1 result */
    var showCredit = ex.type !== 'qcm' || S.hintUsed[ex.id];
    var creditLine = showCredit
      ? '<span class="fcredit">credit ' + (Math.round(credit * 100) / 100).toFixed(2) + (S.hintUsed[ex.id] ? ' (includes \u22120.10 hint penalty)' : '') + '</span>'
      : '';
    fb.appendChild(el('div', 'fhead', '<span>' + icon + ' ' + label + '</span>' + creditLine));
    var body = el('div', 'fbody');

    if (res.extra && res.extra.kind === 'query') {
      if (res.extra.dangerousHit) {
        body.appendChild(el('div', 'danger-note', '\u2717 DANGEROUS \u2014 NEAR MISS: your input matches a pattern that would change state or destroy evidence instead of only reading. In a real SOC this is the difference between an investigation and an incident.'));
      }
      if (res.extra.wrongHits.length) {
        body.appendChild(el('div', null, '<p style="color:var(--state-incorrect);font-weight:700;margin:6px 0">\u2717 Wrong element(s) detected: ' + esc(res.extra.wrongHits.join('; ')) + '</p>'));
      }
      var cb = el('div', 'codeblock');
      cb.appendChild(el('span', 'alabel', 'Canonical query'));
      var pre = el('pre'); pre.innerHTML = hl(res.extra.canonical);
      cb.appendChild(pre);
      var cp = el('button', 'abtn ghost', 'Copy canonical query');
      cp.addEventListener('click', function () {
        try {
          navigator.clipboard.writeText(res.extra.canonical);
          cp.textContent = 'Copied \u2713';
          setTimeout(function () { cp.textContent = 'Copy canonical query'; }, 1500);
        } catch (e) { cp.textContent = 'Copy not available'; }
      });
      cb.appendChild(el('div', 'bbody', '')).appendChild(cp);
      body.appendChild(cb);
    }

    if (res.items.length) {
      res.items.forEach(function (it) {
        var st = it.status === 'ok' ? ['ok', '\u2713 Correct'] : it.status === 'bad' ? ['bad', '\u2717 Wrong'] : ['miss', '\u25CB Missed'];
        var row = el('div', 'itemrow ' + st[0], '<span class="istatus">' + st[1] + '</span><span style="flex:1 1 220px">' + esc(it.label) + '</span>' +
          (it.why ? '<span class="iwhy">' + esc(it.why) + '</span>' : ''));
        body.appendChild(row);
      });
    }
    var expl = el('div', 'fexplain');
    expl.innerHTML = '<h3 style="margin:8px 0">Why</h3>' + ex.explain.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    body.appendChild(expl);
    if (ex.study) {
      body.appendChild(el('div', 'fstudy', '<span class="sk">What to study:</span> ' + esc(ex.study)));
    }
    fb.appendChild(body);
    slot.appendChild(fb);
  }

  /* ---------- navigation ---------- */
  function goNext() {
    leavePause();
    if (S.mode === 'review-return') {
      S.mode = 'normal'; S.reviewEx = null;
      setTState('RUNNING'); /* timer resumes at the review-skipped screen */
      showReview();
      return;
    }
    setTState('RUNNING');
    S.idx += 1;
    if (S.idx >= S.order.length) { afterExam(); return; }
    renderExercise();
  }
  function skipCurrent() {
    var ex = currentEx();
    if (!ex || S.answered[ex.id]) { return; }
    if (S.mode === 'review-return') { showReview(); return; }
    if (S.skipped.indexOf(ex.id) < 0) { S.skipped.push(ex.id); }
    S.idx += 1;
    if (S.idx >= S.order.length) { afterExam(); return; }
    renderExercise();
  }
  function afterExam() {
    var openSkips = S.skipped.filter(function (id) { return !S.answered[id]; });
    if (openSkips.length > 0 && S.tState !== 'ENDED') {
      showReview();
    } else {
      if (openSkips.length > 0) { S.timeUpNotice = true; }
      goResults();
    }
  }
  function showReview() {
    show('review');
    var root = $('#reviewview');
    root.innerHTML = '';
    var card = el('div', 'card');
    card.innerHTML = '<h2>Review skipped exercises</h2>' +
      '<p>You skipped ' + S.skipped.filter(function (id) { return !S.answered[id]; }).length +
      ' exercise(s). You can answer them now while the timer is still running. You may return to this screen as many times as you need.</p>';
    var ul = el('ul', 'revlist');
    S.skipped.forEach(function (id) {
      var ex = EX[id];
      var li = el('li');
      var answered = !!S.answered[id];
      li.innerHTML = '<span class="rmark">' + (answered ? '\u2713 Answered' : '\u26A0 Skipped') + '</span>' +
        '<span class="rtext"><strong>' + esc(ex.summary) + '</strong><br><span class="rid">' + esc(ex.concept) + '</span></span>';
      var b = el('button', 'abtn', answered ? 'Review your answer' : 'Answer now');
      b.disabled = answered || S.tState === 'ENDED';
      b.addEventListener('click', function () {
        S.mode = 'review-return';
        S.reviewEx = id;
        show('exam');
        renderReviewExercise(ex);
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    if (S.tState === 'ENDED') {
      card.appendChild(el('p', null, '<strong style="color:var(--state-incorrect)">\u25A0 Time is up.</strong> Unanswered skipped exercises are excluded from the score.'));
    }
    var actions = el('div', 'actions');
    var sub = el('button', 'abtn check', 'Submit exam \u2192');
    sub.addEventListener('click', function () { leavePause(); goResults(); });
    actions.appendChild(sub);
    card.appendChild(actions);
    root.appendChild(card);
  }
  function renderReviewExercise(ex) {
    var stage = $('#stage');
    stage.innerHTML = '';
    var holder = el('div', 'stageposition');
    holder.id = 'stageinner';
    stage.appendChild(holder);
    holder.appendChild(buildCard(ex));
    renderHeader();
    holder.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
    renderPauseUI();
  }

  /* ---------- results ---------- */
  function goResults() {
    setTState('ENDED'); /* the attempt is over; no more ticks on the results screen */
    show('results');
    var answeredIds = Object.keys(S.answered).filter(function (k) { return S.answered[k]; });
    var sum = 0, fully = 0, partial = 0, incorrect = 0, partialCreditSum = 0;
    answeredIds.forEach(function (id) {
      var c = S.credits[id] || 0;
      sum += c;
      if (c >= 1) { fully += 1; }
      else if (c > 0) { partial += 1; partialCreditSum += c; }
      else { incorrect += 1; }
    });
    var skippedOpen = S.skipped.filter(function (id) { return !S.answered[id]; }).length;
    var pct = answeredIds.length > 0 ? Math.round((sum / answeredIds.length) * 100) : 0;
    var passed = pct >= DATA.passMark;

    var root = $('#resultsview');
    root.innerHTML = '';
    var card = el('div', 'card');
    if (S.timeUpNotice) {
      card.appendChild(el('p', null, '<strong style="color:var(--state-incorrect)">\u25A0 Time is up.</strong> Exercises you never answered are excluded from the score.'));
    }
    card.appendChild(el('div', null, '<div class="finalpct" style="color:' + (passed ? 'var(--state-correct)' : 'var(--state-incorrect)') + '">' + pct + '%</div>' +
      '<div style="color:var(--text-secondary)">' + (Math.round(sum * 10) / 10).toFixed(1) + ' credit points over ' + answeredIds.length + ' answered exercise(s) \u00B7 pass mark ' + DATA.passMark + '%</div>'));
    var grid = el('div', 'scoregrid');
    [['ok', '\u2713 ' + fully, 'Fully correct'],
     ['pt', '\u2713 ' + partial + (partial > 0 ? ' <small>(avg ' + (Math.round((partialCreditSum / partial) * 100) / 100).toFixed(2) + ')</small>' : ''), 'Partially correct'],
     ['bad', '\u2717 ' + incorrect, 'Fully incorrect'],
     ['skip', '\u26A0 ' + skippedOpen, 'Skipped \u2014 excluded']].forEach(function (d) {
      grid.appendChild(el('div', 'scorecard ' + d[0], '<div class="num">' + d[1] + '</div><div class="cap">' + d[2] + '</div>'));
    });
    card.appendChild(grid);
    var cert = el('div', 'cert' + (passed ? '' : ' fail'));
    cert.innerHTML = passed
      ? '<div class="chead">\u2713 PASS</div><p>Certificate panel \u2014 you reached ' + pct + '%, above the ' + DATA.passMark + '% pass mark for ' + esc(DATA.objectId) + ' at ' + esc(DATA.severity) + ' level. You can read account-manipulation telemetry, pick the right analytic, and explain why it fired.</p>'
      : '<div class="chead">\u2717 FAIL</div><p>You reached ' + pct + '%, below the ' + DATA.passMark + '% pass mark. Review the explanations above, then retake the exam \u2014 the exercises and answers will be shuffled.</p>';
    card.appendChild(cert);
    var mins = function (s) { return Math.round(s / 60); };
    card.appendChild(el('div', 'timelog', 'Timer budget used: ' + fmtMMSS(DATA.timerSeconds - S.remaining) + ' of ' + fmtMMSS(DATA.timerSeconds) +
      ' \u00B7 paused manually: ' + mins(S.pauseTotals.manual) + ' min \u00B7 paused for feedback review: ' + mins(S.pauseTotals.auto) + ' min'));
    var actions = el('div', 'actions');
    var rt = el('button', 'bigbtn retake', '\u21BA Retake exam');
    rt.addEventListener('click', function () {
      leavePause();
      renderIntro();
      show('intro');
    });
    actions.appendChild(rt);
    card.appendChild(actions);
    root.appendChild(card);

    /* report exactly once per attempt, at the results screen */
    if (!S.reported) {
      S.reported = true;
      reportScore(sum, answeredIds.length);
    }
  }

  /* ---------- pause overlay ---------- */
  function renderPauseUI() {
    var holder = $('#stageinner');
    var old = document.getElementById('pauseveil');
    if (old) { old.remove(); }
    if (S.hidden && holder) {
      var veil = el('div', 'pauseveil');
      veil.id = 'pauseveil';
      veil.innerHTML = '<div class="inner">\u23F8 PAUSED \u2014 manual<small>The exercise is hidden. Press Resume to continue.</small>' +
        '<div style="margin-top:14px"><button class="abtn next" id="btnresume">\u25B6 Resume</button></div></div>';
      holder.appendChild(veil);
      $('#btnresume').addEventListener('click', manualResume);
    }
    var bp = $('#btnpause');
    if (bp) { bp.textContent = S.hidden ? '\u25B6 Resume' : '\u23F8 Pause'; }
  }

  /* ---------- header actions ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    $('#btnhint').addEventListener('click', function () {
      var ex = currentEx();
      if (!ex || S.answered[ex.id] || S.hintUsed[ex.id]) { return; }
      S.hintUsed[ex.id] = true;
      var ab = $('#stageinner .block.answer .bbody');
      if (ab) {
        var hp = el('div', 'hintpanel', '<div class="htitle">\u25D4 Hint \u2014 this costs 10% of this exercise\u2019s credit</div><p style="margin:6px 0 0">' + esc(ex.hint) + '</p>');
        ab.insertBefore(hp, ab.querySelector('.actions'));
      }
      renderHeader();
    });
    $('#btnskip').addEventListener('click', skipCurrent);
    $('#btnpause').addEventListener('click', manualPause);
    renderIntro();
    show('intro');
    renderHeader();
  });
})();

</script>
</body>
</html>
