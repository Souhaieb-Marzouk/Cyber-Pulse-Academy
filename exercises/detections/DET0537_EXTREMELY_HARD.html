+ "<p><b>Where this is used at work:</b> senior SOC and IR leads make exactly these calls during poisoned-update incidents — the SolarWinds-style and CCleaner-style moments of the industry — and detection engineers who own DET0537 make them at 02:00 with partial data. The skills: evidence discipline, reversibility, proportionality, and knowing which widely used best practice is wrong <b>here</b>.</p>"
+ "<p><b>Why it matters:</b> at this tier, the wrong call costs evidence, downtime or the attacker's silence. The right call often feels unheroic: watch, verify, contain narrowly, preserve everything.</p>",
  keywords: [
    {theme:"Senior-level correlation", items:["Full chain with noise: unrelated signed updates mixed in","Ordering discipline: install must precede first-run inside TimeWindow","First-seen egress as an optional stage-3 signal","Per-host correlation despite fleet-wide noise","Sources in play: Sysmon EC1/7/11, CodeIntegrity verdicts (DC0059), auditd, journald:package, unifiedlog PackageKit (DC0059), osquery processes (DC0032), EndpointSecurity writes (DC0061), NSM:Flow (DC0078)"]},
    {theme:"Conflicting signals and gaps", items:["TrustedPublishers allow-list vs certificate revocation data","TI feed reputation vs internal recollection of a CDN","Missing CDN logs (collector outage) — gaps are not proof","Stage-1-only ambiguity at 02:00 — watch, do not swing"]},
    {theme:"Response with real costs", items:["Isolate one host vs fleet-wide actions — proportionality","Preserve volatile evidence before containment","No-state-change orders and read-only queries","Hold communications until scope is known"]},
    {theme:"Strategy ownership", items:["Mutable elements exercised here: TimeWindow, TrustedPublishers, ApprovedRepos, PathScope, MinBinarySize, TrustedDMGs, RiskScoreThreshold","Risk scoring: path + signer + reputation features","Coverage: T1195.001 / T1195.002 / T1195.003 and pre-release gaps","Hardening backlog ranked by risk reduction per effort"]}

{ id:"x02", type:"qcm",
  summary:"Allow-list vs certificate revocation — which signal wins?",
  scenario:[{label:"ARTEFACT 1 — The conflict", kind:"code", body:"secgate.dll is signed by 'Meridian Software Ltd' — a publisher\nON TrustedPublishers. Your CTI note: that exact certificate was\nREVOKED 6 days ago. Egress destination is first-seen.\nYour tuning doc: 'TrustedPublishers suppress stage-1 signer alerts.'"}],
  question:"Two signals conflict: the signer allow-list and the revocation report. Which wins, and why?",
  hint:"What was the allow-list built for — normal updates, or revoked certificates?",
  options:["Revocation plus the stage signals win — an allow-list is a tuning aid, not a truth oracle; suppress nothing","The allow-list wins — a signature from a listed publisher means trusted, in every situation, always","Only the file hash matters — ignore the signer story and the egress destination entirely here","Only egress reputation matters — the signer and allow-list story is irrelevant to this decision"],
  correct:0,
  explanation:"Allow-lists exist to cut noise from <b>expected</b> updates. When the certificate is <b>revoked</b> — and stage 2 and 3 also fired — the allow-list's assumption ('this publisher is safe') no longer holds. Treat it as one input among many: alert, and add revocation checking to the tuning so the list self-corrects. Blindly trusting the list or any single signal is how signed-but-stolen update chains sailed past SOCs in real incidents.",
  study:"Add 'allow-list inputs expire' to your tuning doctrine — revocation, vendor changes, expired certs." },

{ id:"x04", type:"qcm",
  summary:"Proportionate response when scope is exactly one host",
  scenario:[{label:"ARTEFACT 1 — Scope result", kind:"code", body:"1 of 400 developer hosts shows the full chain (DEV-288).\nThe binary: a corrupted SIGNED updater from a reseller mirror.\nDev management: any fleet-wide action costs a full sprint day."}],
  question:"Which action is proportionate AND defensible?",

  study:"Write the proportionality rule you will follow: response radius = evidence radius, plus a margin." },

{ id:"x03", type:"query",
  summary:"One query allowed — and it must not change state",
  scenario:[{label:"ARTEFACT 1 — Order from the CISO", kind:"code", body:"'No host changes until evidence is preserved.'\nYou may run ONE query. Tool palette offers two saved macros:\n  (a) read-only correlation hunt\n  (b) 'remediate' macro — quarantines every file it finds\nMemory and disk on the affected host are uncollected."}],
  question:"Build the query you will actually run: EventCode=11 followed within 2 hours by EventCode=1 or 7, aggregated per host — strictly read-only.",
  hint:"The CISO said 'no host changes'. Every state-changing verb is off the table.",
  query:{
    prompt:"query editor — read-only investigation only (state changes are forbidden in this phase)",
    placeholder:"index=… | …",
    syntaxHint:"index=proxy url=updates[.]example | stats count by client_ip   (shape example on other data)",
    required:[
      {name:"correlates file creation (EventCode=11) with run-time events (1 or 7)", re:/eventcode\s*=\s*11|filecreate/},
      {name:"2-hour window (2h / 7200 / 120m / maxspan)", re:/2h|7200|120m|maxspan/},
      {name:"per-host aggregation (stats by host)", re:/by\s+host|stats[^\n]*host/},
      {name:"read-only investigation verbs (search/select/where/transaction/stats)", re:/search|select|where|transaction|stats/}
    ],
    forbidden:[
      {name:"state-changing verbs (quarantine/delete/purge/drop/clean/rm) — evidence-destroying", re:/quarantine|delete|purge|drop|clean|\brm\b/}
    ],
    canonical:"index=sysmon EventCode=11 OR EventCode=1 OR EventCode=7\n| transaction host maxspan=2h\n| where EventCode=11 AND (EventCode=1 OR EventCode=7) AND samepath\n| stats count by host\n# read-only. quarantine/delete macros are FORBIDDEN until evidence is preserved.",
    output:"host        chain_hits   first_write   last_event\nDEV-104     3            02:11:40      02:13:55\nDEV-219     1            02:31:02      02:31:44"
  },
  explanation:"The command was the easy part; the judgement was the test. The <b>remediation macro quarantines files while memory and disk are uncollected</b> — a DANGEROUS near miss: it destroys volatile evidence and changes host state against an explicit order. The read-only correlation query answers the scope question without touching anything. Senior analysts know when NOT to run the powerful tool.",
  study:"Before any response action, ask: what evidence dies if I run this?" },

{ id:"x08", type:"order",

  items:["Freeze and preserve: capture memory and volatile state on the affected hosts","Scope quietly: hunt the repo hash and egress domain fleet-wide (read-only)","Cut command and control: block the egress destination at the proxy","Isolate the affected hosts from the network","Rebuild affected systems from verified-clean sources with hashes checked","Close the loop: tune DET0537, update allow-lists, and write the lessons"],

  summary:"Find the dangerous line in the production rule",
  scenario:[{label:"ARTEFACT 1 — AN1482 production rule (simplified)", kind:"code", body:"P1  source: macos:unifiedlog — PackageKit install verdicts\nP2  source: macos:osquery — process events\nP3  source: macos:endpointsecurity — file write/rename\nP4  correlate install -> first run per DEVICE within TimeWindow=2h\nP5  on alert: auto-delete the Mach-O and clear quarantine flags\nP6  alert route: SOC queue, severity by RiskScoreThreshold"}],

"P3  source: macos:endpointsecurity — file write/rename",

    right.appendChild(c);
  });
  w.appendChild(left); w.appendChild(right); area.appendChild(w);
  var tip=document.createElement('p'); tip.className='small mut'; tip.textContent='Click an item on the left, then click the match on the right. Assigned items are struck out.';
  area.appendChild(tip);
}
function buildDnd(area,ex,v){
  var bank=document.createElement('div'); bank.className='bank'; bank.id='dndBank';
  v.items.forEach(function(ii){
    if(v.placed[ii]!=null && v.placed[ii]>=0) return;
    var c=document.createElement('button'); c.className='chip'; c.draggable=true; c.innerHTML=esc(ex.items[ii].text);
    c.addEventListener('click',function(){ if(G.done[G.order[idxOf(G.reviewOf!=null)]])return; v.selItem=ii;
      var all=bank.querySelectorAll('.chip'); for(var z=0;z<all.length;z++){all[z].classList.remove('sel');} c.classList.add('sel'); });
    c.addEventListener('dragstart',function(e){ v.selItem=ii; try{e.dataTransfer.setData('text/plain',String(ii));}catch(err){} });
    c.id='chip_'+ii;
    bank.appendChild(c);
  });
  if(bank.children.length===0) bank.innerHTML='<span class="small mut">All items placed.</span>';
  area.appendChild(bank);
  var tip=document.createElement('p'); tip.className='small mut'; tip.textContent='Drag an item into a zone, or click the item then click a zone. Click a placed item to take it back.';
  area.appendChild(tip);
  var zg=document.createElement('div'); zg.className='zones';
  ex.zones.forEach(function(zn,zi){
    var z=document.createElement('div'); z.className='zone'; z.id='zone_'+zi;
    var zh=document.createElement('div'); zh.className='zone-h'; zh.textContent=zn; z.appendChild(zh);
    z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    function place(){
      if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
      if(v.selItem==null) return;
      v.placed[v.selItem]=zi; v.touched=true; v.selItem=null;
      var cb=document.getElementById('checkBtn'); if(cb) cb.disabled=false;
      rebuildDnd(area,ex,v);
    }
    z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');place();});
    z.addEventListener('click',function(e){ if(e.target!==z&&e.target!==zh)return; place(); });
    zg.appendChild(z);
  });
  area.appendChild(zg);
  redrawPlaced(ex,v);
}
function redrawPlaced(ex,v){
  ex.zones.forEach(function(zn,zi){
    var z=document.getElementById('zone_'+zi); if(!z)return;
    var zh=z.querySelector('.zone-h'); z.innerHTML=''; z.appendChild(zh);
    Object.keys(v.placed).forEach(function(ii){
      if(v.placed[ii]!==zi) return;
      var idx=parseInt(ii,10);
      var c=document.createElement('button'); c.className='chip'; c.innerHTML=esc(ex.items[idx].text);
      c.title='Click to remove';
      c.addEventListener('click',function(ev){ ev.stopPropagation();
        if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
        delete v.placed[ii]; rebuildDnd(document.getElementById('ansArea'),ex,v);
      });
      z.appendChild(c);
    });
  });
}
function rebuildDnd(area,ex,v){
  area.innerHTML=''; buildDnd(area,ex,v);

}
function buildOrder(area,ex,v){

  area.appendChild(lab);
  var list=document.createElement('div'); list.className='orderlist'; list.id='ordList';
  area.appendChild(list);

function redrawOrder(ex,v){
  var list=document.getElementById('ordList'); list.innerHTML='';
  v.seq.forEach(function(ii,pos){
    var row=document.createElement('div'); row.className='orditem'; row.draggable=true;
    row.innerHTML='<span class="ord-pos">'+(pos+1)+'</span><span class="ord-t">'+esc(ex.items[ii])+'</span>';
    var btns=document.createElement('div'); btns.className='ordbtns';
    var up=mkBtn('▲','ghost',function(){ if(pos===0)return; var t=v.seq[pos-1];v.seq[pos-1]=v.seq[pos];v.seq[pos]=t; v.touched=true; redrawOrder(ex,v); var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=false;});
    var dn=mkBtn('▼','ghost',function(){ if(pos===v.seq.length-1)return; var t=v.seq[pos+1];v.seq[pos+1]=v.seq[pos];v.seq[pos]=t; v.touched=true; redrawOrder(ex,v); var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=false;});
    up.className=''; dn.className=''; up.style.width='44px'; dn.style.width='44px';
    btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
    row.addEventListener('dragstart',function(e){ v.dragFrom=pos; try{e.dataTransfer.setData('text/plain',String(pos));}catch(err){} });
    row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('dragover');});
    row.addEventListener('dragleave',function(){row.classList.remove('dragover');});
    row.addEventListener('drop',function(e){ e.preventDefault();row.classList.remove('dragover');
      var from=(v.dragFrom!=null)?v.dragFrom:parseInt(e.dataTransfer.getData('text/plain'),10);
      if(isNaN(from))return;
      var it=v.seq.splice(from,1)[0]; v.seq.splice(pos,0,it); v.dragFrom=null; v.touched=true;
      redrawOrder(ex,v); var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=false;
    });
    list.appendChild(row);
  });
}
function buildFill(area,ex,v){
  var lab=document.createElement('p'); lab.className='small mut'; lab.textContent='Click a word from the bank, then click a blank to fill it. Click a filled blank to clear it.';
  area.appendChild(lab);
  var sent=document.createElement('div'); sent.className='fill-sent'; area.appendChild(sent);
  var bank=document.createElement('div'); bank.className='bank'; area.appendChild(bank);
  function redrawSent(){
    sent.innerHTML='';
    var parts=ex.text.split('{}');
    parts.forEach(function(p,i){
      sent.appendChild(document.createTextNode(p));
      if(i<ex.slots.length){
        (function(si){
          var sp=document.createElement('span'); sp.className='slot'+(v.slots[si]!=null?' filled':'')+(v.selSlot===si?' sel':'');
          sp.innerHTML='<span class="slot-v">'+(v.slots[si]!=null?esc(v.slots[si]):'…')+'</span>';
          sp.setAttribute('role','button'); sp.setAttribute('tabindex','0');
          function pick(){ if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
            if(v.slots[si]!=null){ var w=v.slots[si]; v.bank.push(w); v.slots[si]=null; } /* return the word to the bank (bank order is shuffled, so append is safe) */
            v.selSlot=si; redrawSent(); redrawBank(); }
          sp.addEventListener('click',pick);
          sp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
          sent.appendChild(sp);
        })(i);
      }
    });
  }
  function redrawBank(){
    bank.innerHTML='';
    if(v.bank.length===0){ bank.innerHTML='<span class="small mut">Word bank empty — every word is placed.</span>'; }
    v.bank.forEach(function(w,wi){
      var c=document.createElement('button'); c.className='chip'; c.innerHTML=esc(w);
      c.addEventListener('click',function(){
        if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
        var si=(v.selSlot!=null&&v.slots[v.selSlot]==null)?v.selSlot:v.slots.indexOf(null);
        if(si<0) return;
        v.slots[si]=w; v.bank.splice(wi,1); v.touched=true; v.selSlot=(si+1<ex.slots.length)?si+1:null;
        redrawSent(); redrawBank();
        var cb=document.getElementById('checkBtn'); if(cb)cb.disabled=false;
      });
      bank.appendChild(c);
    });
  }
  redrawSent(); redrawBank();
}
function buildBranch(area,ex,v){
  var box=document.createElement('div');
  var st=ex.steps[v.step];
  var opts=document.createElement('div'); opts.className='opts';
  v.steps[v.step].opts.forEach(function(o){
    var b=document.createElement('button'); b.type='button'; b.className='opt';
    b.innerHTML='<span class="opt-k">'+o.k+'.</span><span>'+esc(o.t)+'</span>';
    b.addEventListener('click',function(){
      if(G.done[G.order[idxOf(G.reviewOf!=null)]])return;
      v.sels[v.step]=o.k; v.touched=true;
      var all=opts.querySelectorAll('.opt');
      for(var i=0;i<all.length;i++){all[i].classList.remove('sel');}
      b.classList.add('sel');
      var cb=document.getElementById('checkBtn'); if(cb){cb.disabled=false;cb.innerHTML=(v.step===ex.steps.length-1)?'✓ Check final answer':'✓ Save step & continue';}
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);
  area.appendChild(box);
}
function branchAdvance(ex,v){
  if(v.step<ex.steps.length-1){
    v.step++;

    buildBranch(area,ex,v);
    var cb=document.getElementById('checkBtn'); if(cb){cb.disabled=(v.sels[v.step]==null);cb.innerHTML='✓ Save step & continue';}

function buildQuery(area,ex,v){
  var p=document.createElement('div'); p.className='qprompt'; p.textContent=ex.query.prompt||'query editor — read-only investigation only';
  area.appendChild(p);

    area.appendChild(hnt);
  }

/* ---------------- grading ---------------- */
function onCheck(ex,v,review){
  if(ex.type==='branch' && v.step<ex.steps.length-1){ branchAdvance(ex,v); return; }
  onCheckFinal(ex,v,review);
}
function scoreEC(H,W,N){ return clamp01((H-W)/N); }
function onCheckFinal(ex,v,review){
  var i=G.order[idxOf(review)];
  if(G.done[i]!=null) return;
  if(G.tstate==='RUNNING'){ G.tstate='PAUSED_AUTO_CHECK'; updHeader(); }
  var g=grade(ex,v);
  var credit=g.credit;
  if(G.hint[i]) credit=clamp01(credit-0.10);
  G.done[i]=credit;
  G.answered++; G.creditSum+=credit;
  if(credit>=0.999){G.stats.full++;} else if(credit>0){G.stats.partial++;G.stats.partialSum+=credit;} else {G.stats.zero++;}
  updHeader(); /* live score must move the moment Check is pressed, before Next */
  if(G.reviewOf!=null){
    var p=G.skipped.indexOf(G.reviewOf);
    if(p>=0) G.skipped.splice(p,1);
  }
  renderFeedback(ex,g,credit);
  var row=document.getElementById('btnRow'); row.innerHTML='';
  var nx;
  if(review){ nx=mkBtn('↩ Back to Review','btn primary',function(){ if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';} openReview(); }); }
  else if(idxOf(false)>=EX.length-1){ nx=mkBtn('⏹ Final Submit','btn primary',function(){ if(G.tstate==='PAUSED_AUTO_CHECK'){G.tstate='RUNNING';} if(G.skipped.length>0){openReview();}else{renderResults();} }); }
  else { nx=mkBtn('▶ Next','btn primary',function(){ resumeAfterCheck(); }); }
  row.appendChild(nx);
  var wa=document.getElementById('ansArea');
  wa.style.pointerEvents='none'; wa.style.opacity='.85';
  var cb=document.getElementById('checkBtn'); if(cb){cb.parentNode.removeChild(cb);}
}
function grade(ex,v){
  var k=ex.type, rows=[], credit=0, H=0,W=0,N=1;
  if(k==='qcm'||(k==='log'&&ex.answer.kind==='qcm')){
    var w=ex.type==='log'? ex.answer:ex;
    var correctKey=null, correctTxt='';
    v.opts.forEach(function(o){ if(o.orig===w.correct){correctKey=o.k;correctTxt=o.t;} });
    credit=(v.sel!=null && v.sel===correctKey)?1:0;
    if(v.sel==null){ rows.push({state:'missed',label:'○ Missed',note:'No answer selected.'}); }
    N=1;
    return {credit:credit,rows:rows,correctText:correctTxt};
  }
  if(k==='clickline'||(k==='log'&&ex.answer.kind==='click')){
    var w2=ex.type==='log'? ex.answer:ex;
    credit=(v.sel===w2.correct)?1:0;
    if(v.sel==null) rows.push({state:'missed',label:'○ Missed',note:'No line selected.'});
    return {credit:credit,rows:rows};
  }
  if(k==='qcmmulti'){
    N=ex.correct.length; H=0;W=0;
    v.opts.forEach(function(o){
      var inC=ex.correct.indexOf(o.orig)>=0;
      var inS=v.sel.indexOf(o.k)>=0;
      if(inC&&inS){H++;rows.push({state:'correct',label:'✓ Correct',note:o.t});}
      else if(inC&&!inS){rows.push({state:'missed',label:'○ Missed',note:o.t});}
      else if(!inC&&inS){W++;rows.push({state:'wrong',label:'✗ Wrong',note:o.t});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='match'){
    N=ex.pairs.length; H=0;W=0;
    ex.pairs.forEach(function(p,i){
      var a=v.assign[i];
      if(a==null){rows.push({state:'missed',label:'○ Missed',note:p.left+' — correct match: '+p.right});}
      else if(a===i||(a!=null&&ex.pairs[a].right===p.right)){H++;rows.push({state:'correct',label:'✓ Correct',note:p.left+' → '+p.right});} /* text match: duplicate right answers stay fair */
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:p.left+' → '+ex.pairs[a].right+' (correct: '+p.right+')'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='dnd'){
    N=ex.items.length; H=0;W=0;
    ex.items.forEach(function(it,i){
      var p=v.placed[i];
      if(p==null){rows.push({state:'missed',label:'○ Missed',note:it.text+' — belongs in: '+ex.zones[it.zone]});}
      else if(p===it.zone){H++;rows.push({state:'correct',label:'✓ Correct',note:it.text+' → '+ex.zones[it.zone]});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:it.text+' placed in '+ex.zones[p]+' (correct: '+ex.zones[it.zone]+')'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='order'){
    N=ex.items.length; H=0;W=0;
    v.seq.forEach(function(ii,pos){
      if(ii===pos){H++;rows.push({state:'correct',label:'✓ Correct',note:'Position '+(pos+1)+': '+ex.items[ii]});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Position '+(pos+1)+': you put "'+ex.items[ii]+'", correct: "'+ex.items[pos]+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='fill'){
    N=ex.slots.length; H=0;W=0;
    ex.slots.forEach(function(s,i){
      var got=v.slots[i];
      if(got==null){rows.push({state:'missed',label:'○ Missed',note:'Blank '+(i+1)+' — correct: '+s});}
      else if(got===s){H++;rows.push({state:'correct',label:'✓ Correct',note:'Blank '+(i+1)+': '+s});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Blank '+(i+1)+': you used "'+got+'", correct: "'+s+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='branch'){
    N=ex.steps.length; H=0;W=0;
    ex.steps.forEach(function(st,si){
      var sel=v.sels[si], selTxt='';
      v.steps[si].opts.forEach(function(o){ if(o.k===sel) selTxt=o.t; });
      var corrKey=null, corrTxt='';
      v.steps[si].opts.forEach(function(o){ if(o.orig===st.correct){corrKey=o.k;corrTxt=o.t;} });
      if(sel==null){rows.push({state:'missed',label:'○ Missed',note:'Step '+(si+1)+' — correct: '+corrTxt});}
      else if(sel===corrKey){H++;rows.push({state:'correct',label:'✓ Correct',note:'Step '+(si+1)+': '+selTxt});}
      else {W++;rows.push({state:'wrong',label:'✗ Wrong',note:'Step '+(si+1)+': you chose "'+selTxt+'", correct: "'+corrTxt+'"'});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows};
  }
  if(k==='query'){
    var q=ex.query; N=q.required.length; H=0;W=0;
    var norm=(v.text||'').toLowerCase();
    q.required.forEach(function(r){
      if(r.re.test(norm)){H++;rows.push({state:'correct',label:'✓ Correct',note:r.name});}
      else {rows.push({state:'missed',label:'○ Missed',note:r.name});}
    });
    (q.forbidden||[]).forEach(function(f){
      if(f.re.test(norm)){W++;rows.push({state:'wrong',label:'✗ Wrong — dangerous / out of scope',note:f.name});}
    });
    credit=scoreEC(H,W,N);
    return {credit:credit,rows:rows,canon:q.canonical,output:q.output};
  }
  return {credit:0,rows:rows};
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex,g,credit){
  var fb=document.getElementById('fbArea');
  var h='';
  var cls,lab;
  if(credit>=0.999){cls='fb-correct';lab='✓ CORRECT';}
  else if(credit>0){cls='fb-partial';lab='✓ PARTIALLY CORRECT';}
  else {cls='fb-incorrect';lab='✗ INCORRECT';}
  h+='<div class="feedback '+cls+'" role="status"><p class="fb-h">'+lab+'</p>';
  if(g.rows.length>0){
    h+='<p class="fb-credit">credit '+credit.toFixed(2)+' — computed as max(0, (H − W) / N) with a −0.10 penalty'+(G.hint[G.order[idxOf(G.reviewOf!=null)]]?' applied (hint used)':' (no hint)')+'.</p>';
    g.rows.forEach(function(r){ h+='<div class="itemrow st-'+r.state+'"><span class="ic">'+r.label+'</span><span class="note">'+esc(r.note)+'</span></div>'; });
  } else {
    h+='<p class="fb-credit">credit '+credit.toFixed(2)+(G.hint[G.order[idxOf(G.reviewOf!=null)]]?' — includes the −0.10 hint penalty.':'')+'</p>';
  }
  if(g.canon){ h+='<div class="canon"><span class="lab">✓ Canonical answer — copyable</span><code>'+esc(g.canon)+'</code></div>'; }
  if(g.output){ h+='<div class="canon"><span class="lab">Expected output shape once it runs</span><code>'+esc(g.output)+'</code></div>'; }
  h+='<div class="fb-exp"><span class="lab">Why — plain words</span>'+ex.explanation+'</div>';
  if(ex.study){ h+='<div class="fb-exp"><span class="lab">What to study</span>'+esc(ex.study)+'</div>'; }
  h+='</div>';
  fb.innerHTML=h;
}
/* ---------------- review skipped ---------------- */
function openReview(){
  G.reviewOf=null;
  var wrap=document.getElementById('exWrap');
  var h='<div class="card"><h2 class="sec-h">⚠ Review skipped exercises</h2>';
  h+='<p class="mut">These exercises were skipped and not answered. You may return to each one and answer it as many times as you need, while the timer is running. If you submit while any are still unanswered, they are excluded from the score.</p>';

    h+='<p class="mut">All skipped exercises have been answered.</p>';
  } else {
    G.skipped.forEach(function(i){
      var ex=EX[G.order[i]];
      h+='<div class="skrow"><span class="skic">⚠ Skipped</span><span class="skt">'+esc(ex.summary)+'</span><button class="btn" data-i="'+i+'">✎ Answer</button></div>';
    });
  }
  h+='<div class="btnrow"><button class="btn primary" id="submitAll">⏹ Submit Exam</button></div></div>';
  wrap.innerHTML=h; updHeader();
  var btns=wrap.querySelectorAll('.skrow button');
  for(var b=0;b<btns.length;b++){

/* ---------------- results ---------------- */
function renderResults(){
  G.tstate='ENDED';
  var answered=G.answered;
  var pct = answered>0? Math.round(G.creditSum/answered*100):0;
  var passed = pct>=CFG.passMark;
  var avgPart = G.stats.partial>0? (G.stats.partialSum/G.stats.partial):0;
  var h='<div class="wrap" style="padding-top:22px">';
  h+=passed? '<div class="passpanel"><p class="vh">✓ PASS</p><p class="mut">You reached the pass mark of '+CFG.passMark+'%. Certificate-style success — well done.</p></div>'
           : '<div class="failpanel"><p class="vh">✗ FAIL</p><p class="mut">You did not reach the pass mark of '+CFG.passMark+'%. You must retake this exam. Study the explanations, then press Retake Exam.</p></div>';
  h+='<div class="card"><h2 class="sec-h">Final results — '+esc(CFG.title)+'</h2>';
  h+='<p style="font-size:22px;margin:6px 0"><b>'+(Math.round(G.creditSum*10)/10).toFixed(1)+' / '+answered+'</b> <span class="mut">('+pct+'%, rounded from partial credits)</span></p>';
  if(G.timedOut) h+='<p class="mut">⏹ The timer ended — unanswered exercises were excluded.</p>';
  h+='<div class="statgrid">';
  h+='<div class="stat"><div class="n st-correct">✓ '+G.stats.full+'</div><div class="d">Fully correct</div></div>';
  h+='<div class="stat"><div class="n st-partial">✓ '+G.stats.partial+'</div><div class="d">Partially correct'+(G.stats.partial>0?' — avg credit '+avgPart.toFixed(2):'')+'</div></div>';
  h+='<div class="stat"><div class="n st-incorrect">✗ '+G.stats.zero+'</div><div class="d">Fully incorrect</div></div>';
  h+='<div class="stat"><div class="n st-skipped">⚠ '+G.skipped.length+'</div><div class="d">Skipped — excluded</div></div>';
  h+='</div>';
  h+='<p class="pausedlog">⏸ Time paused manually: '+fmtT(G.pauseManualSec)+' — ⏸ Time paused for feedback review: '+fmtT(G.pauseAutoSec)+' — ⏹ Final timer state: ENDED</p>';
  if(G.skipped.length>0){
    h+='<p class="small mut">Skipped and never answered (excluded from both score and total):</p>';
    G.skipped.forEach(function(i){ h+='<div class="skrow"><span class="skic">⚠ Skipped</span><span class="skt">'+esc(EX[G.order[i]].summary)+'</span></div>'; });
  }
  h+='<div class="btnrow"><button class="btn primary" id="retakeBtn">↻ Retake Exam</button></div>';
  h+='</div></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
  reportScore(answered,pct,passed);
  document.getElementById('retakeBtn').addEventListener('click',startExam);
}
function reportScore(answered,percent,passed){
  if(G.reported) return; G.reported=true;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE', topicId:CFG.topicId, batch:CFG.batch,
      score:Math.round(G.creditSum), total:answered, percent:percent, passed:passed}, location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  G.username=event.data.username||'';
  G.country=event.data.country||'';
  G.locale=event.data.locale||'';
  /* theme is always 'dark' — the file is dark-only by contract; nothing to switch. */
});
renderIntro();

})();

</script>
</body>
