<script id="cm-data" type="application/json">{"meta": {"topicId": "det0088", "batch": 4, "title": "DET0088 Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002) — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 55, "passMark": 70, "objectId": "DET0088", "objectName": "Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002)"}, "sev": "EXTREMELY HARD", "passMark": 70, "timerSeconds": 3300, "intro": {"learn": "<p>This exam trains <strong>DET0088</strong>, the ATT&amp;CK <strong>Detection Strategy</strong> for <strong>Backup Software Discovery (T1518.002)</strong>, across its three analytics: AN0240 (Windows), AN0241 (Linux), AN0242 (macOS).</p>\n<p>At <strong>EXTREMELY HARD</strong> level you make the calls a senior analyst makes. Scenarios chain three or more concepts: a discovery query leads to credential access on the backup server, then to Inhibit System Recovery (T1490), then to a containment decision with a real business cost. Signals will contradict each other &mdash; a service account that has never been interactive, a plausible user claim you cannot verify, an alert flood that hides one real event. Artefact sets include realistic noise and deliberate gaps; you must reason around what is missing, not only react to what is present.</p>\n<p>Expect the senior refrains: at least one answer is <em>gather more evidence</em>; at least one correct action has a price you must consciously accept (backup SLA, web downtime, evidence preservation); and at least one widely used \"best practice\" is the wrong move in this specific context. The mitigation framing is fixed by ATT&amp;CK: this technique abuses built-in system features, so prevention is not realistic &mdash; detection, tuning, and response quality are your controls. This is the register of IR leads, senior detection engineers, and CTI briefers; everything tested here was built from the DET0088 object and its immediate ATT&amp;CK neighbourhood.</p>", "keywords": [{"group": "Multi-stage chains", "items": ["T1518.002 discovery → T1490 Inhibit System Recovery", "T1485 Data Destruction / T1486 Data Encrypted for Impact context", "Credential access on backup servers (T1003 pattern)", "Staging and exfil prep after config access"]}, {"group": "Conflicting signals", "items": ["Service account never seen interactive", "Unverifiable user claims vs telemetry", "Interactive, low-privilege contexts as the flagged profile", "Alert floods hiding one real event"]}, {"group": "Tuning at scale", "items": ["BackupConfigPaths precision vs keyword-anywhere", "KnownBackupVendors growth after M&A", "SuspiciousParentProcesses: Office and script hosts", "Alert fatigue as a detection risk"]}, {"group": "Coverage and compensating controls", "items": ["4688-only deployments and missing Sysmon telemetry", "DC0063 / DC0039 blind spots", "Layered tuning with a monthly review"]}, {"group": "Senior decisions", "items": ["Gather-evidence-before-declaration verdicts", "Containment with accepted business cost", "Evidence preservation vs destructive response", "Detection strategy vs mitigation expectations"]}], "how": "<ul>\n<li><strong>Pass mark:</strong> 70%. Partial credit applies to every multi-item exercise: credit = (H &minus; W) / N.</li>\n<li><strong>Exercise types in this file:</strong> multi-step decisions (up to 4 steps), multi-select with partial credit, ranked triage queues, matching, fill-in, artefact-line selection, and single-answer calls under pressure.</li>\n<li><strong>Timer:</strong> 55 minutes for 15 exercises. Scenarios are long by design &mdash; collapse the scenario panel after reading; the one-line summary stays visible. <strong>Check</strong> auto-pauses the timer while you study feedback; it resumes on <strong>Next</strong>.</li>\n<li><strong>Hints and skips:</strong> one hint per exercise costs 10% of that exercise's credit; hints here only restate a constraint, never the answer. Skip is free; skipped-and-never-answered exercises are excluded and reviewable while time remains.</li>\n</ul>\n<p>Press <strong>Start exam</strong> when you are ready.</p>"}, "exercises": [{"id": "X01", "type": "decision", "summary": "Full incident: discovery, service logons, SLA pressure", "scenario": [{"label": "ARTEFACT 1 — 4688 on FIN-WS-12", "kind": "mono", "lines": ["User: CORP\\jsmith (finance)", "ParentImage: C:\\Windows\\System32\\winword.exe", "CommandLine: powershell.exe -enc SQBFAFgAIAAo...", "Decoded: Get-WmiObject Win32_Product | Where {$_.Name -match \"Veeam|Acronis\"}"]}, {"label": "ARTEFACT 2 — BK-01 (Veeam server) events, same morning", "kind": "mono", "lines": ["4624 logon type 3: VEEAM_SVC from 10[.]0[.]9[.]44 (first time this source)", "4732: VEEAM_SVC added to local Administrators on BK-01"]}, {"label": "ARTEFACT 3 — Proxy record", "kind": "mono", "lines": ["winword.exe on FIN-WS-12 retrieved hxxp://cdn-updates[.]example:443 22 min before the 4688"]}, {"label": "ARTEFACT 4 — Business context (CMO to SOC)", "kind": "prose", "text": "Monthly financial close runs today. Last successful backup: 6 hours ago. The CFO wants zero backup disruption during close."}], "question": "Make the three calls the incident commander needs, then press Check.", "hint": "The SLA line is a constraint, not an answer. Isolation is not the only containment lever.", "explain": "<p><strong>Stage:</strong> post-foothold discovery of the backup estate &mdash; macro-borne PowerShell enumerating backup products, followed by the service account logging on from a new source and elevating on BK-01. <strong>First hunt priority:</strong> T1490 artefacts (vssadmin delete shadows, wbadmin delete catalog, bcdedit recoveryenabled no), because backup discovery followed by service-account elevation telegraphs recovery destruction &mdash; not printer or VPN trivia, and not waiting. <strong>Containment:</strong> disable and reset VEEAM_SVC while keeping the backup service running under a monitored account &mdash; it answers the new-source logons without taking backups down during the close. Isolating BK-01 would honour the letter of \"contain\" but break the backup SLA the CFO named; doing nothing risks the estate; deleting job history destroys evidence.</p>", "steps": [{"q": "What stage is the intrusion in?", "opts": ["Initial access — the macro is still delivering", "Post-foothold discovery of the backup estate, with service-account escalation", "Impact — backups are already destroyed", "Benign inventory scan by IT"], "ans": 1, "why": "Discovery plus first-time logon source plus local-admin elevation is mid-intrusion preparation, before impact."}, {"q": "What is the first hunt priority?", "opts": ["Print server logs for the week", "T1490 artefacts: vssadmin delete shadows, wbadmin delete catalog, bcdedit recoveryenabled no", "VPN logs only — the rest can wait 24 hours"], "ans": 1, "why": "Backup discovery plus privileged escalation on the Veeam server is the classic pre-T1490 sequence; hunt the destruction commands now."}, {"q": "Which containment respects the SLA constraint?", "opts": ["Isolate BK-01 from the network immediately", "Disable and reset VEEAM_SVC, keep the backup service running under a monitored account", "Do nothing until the close finishes", "Delete the Veeam job history to hide it from the attacker"], "ans": 1, "why": "Killing the compromised credential answers the observed abuse; full isolation would breach the stated backup SLA, and deleting history destroys evidence."}]}, {"id": "X02", "type": "qcm", "summary": "The signal that separates adversary from admin", "scenario": [{"label": "ARTEFACT 1 — Burst of 4688 events, 40 hosts, 10 minutes", "kind": "prose", "text": "Half the commands contain the word \"backup\"; half do not. Some ran outside business hours; several belong to IT-OU admins. You must name the single strongest discriminator for adversary backup discovery."}], "question": "Which signal best separates adversary backup discovery from admin enumeration in this burst?", "hint": "Which signal do the mutable elements emphasise — content, timing, or lineage?", "explain": "<p>The mutable elements exist because content, timing, and org-unit membership are all weak: admins say \"backup\" constantly, work off-hours, and sit in IT. The discriminator is <strong>lineage</strong> &mdash; an Office document or script host spawning a shell that queries vendor names is the SuspiciousParentProcesses profile, and it is exactly what a legitimate admin console run does not look like.</p>", "options": ["The command contains the word backup", "The query runs outside 09:00-17:00", "The user belongs to the IT organisational unit", "An Office document or script host spawns the shell that queries vendor names"], "answer": 3}, {"id": "X03", "type": "multi", "summary": "Consequences of a 4688-only deployment", "scenario": [{"label": "ARTEFACT 1 — Purple-team report extract", "kind": "prose", "text": "Finding: \"AN0240 is deployed across the Windows fleet with WinEventLog:Security (4688, command-line content enabled) only. Sysmon is absent. All Linux and macOS hosts run their full AN0241/AN0242 sources.\" Select the three true consequences for Windows coverage."}], "question": "Select the THREE true consequences of this deployment.", "hint": "Check each AN0240 data component and which channel provides it — then discard statements about platforms the finding already excludes.", "explain": "<p>With Sysmon absent: <strong>DC0063 registry telemetry (Sysmon 13/14) is missing</strong> and <strong>DC0039 file-creation telemetry (Sysmon 11) is missing</strong> &mdash; both are AN0240 sources that only Sysmon provides. <strong>4688 with command-line content still feeds DC0032</strong>, so command-based discovery remains visible. The Linux and macOS claims contradict the report’s own premise, and 4688 does not deliver registry value-set events by itself.</p>", "options": ["Registry-key telemetry (DC0063 via Sysmon 13/14) is missing", "File-creation telemetry (DC0039 via Sysmon 11) is missing", "Process-creation command lines still feed AN0240 via 4688", "Linux analytics lose full coverage because Sysmon is absent", "4688 alone provides registry value-set events", "Command-line content must come from Sysmon only"], "answers": [0, 1, 2]}, {"id": "X04", "type": "qcm", "summary": "The zero-FP proposal that blinds the rule", "scenario": [{"label": "ARTEFACT 1 — SOC governance meeting", "kind": "prose", "text": "SOC lead: \"AN0240 false positives all trace to admin accounts. Exclude every IT-admin account from the analytic entirely — zero FPs, done.\" You must explain why that fails in this context."}], "question": "Why is wholesale exclusion of IT-admin accounts wrong for AN0240?", "hint": "Who runs discovery after they have already owned an admin account?", "explain": "<p>Compromised admin credentials are one of the most common real paths to backup discovery &mdash; attackers run exactly this recon <em>as</em> admins. <strong>UserContextScope</strong> asks for context-aware tuning (focus on low-privilege/interactive contexts, let corroborated routine flows through), not blindness. Wholesale exclusion manufactures a blind spot at the highest-value privilege level; the other options either ignore FP cost or contradict the element’s purpose.</p>", "options": ["FPs never matter for discovery analytics", "Compromised admin accounts are a common real path, and the element calls for context-based tuning, not blindness", "Service accounts are the only identities that matter on Windows", "Vendor lists should be removed instead of user scopes"], "answer": 1}, {"id": "X05", "type": "decision", "summary": "AN0241 fires 40 times a day", "scenario": [{"label": "ARTEFACT 1 — Tuning report", "kind": "mono", "lines": ["AN0241 volume: ~40 alerts/day, 95% sampled as backup-admin scripts", "Rule change 12 days ago: keyword \"backup\" matched anywhere under /var", "Real incident 3 weeks ago: nearly buried in the same queue (post-incident review)"]}, {"label": "ARTEFACT 2 — Current match sample", "kind": "mono", "lines": ["bash -c \"grep -r backup /var/log/backups/jobs.log\"  (job runner, every 15 min)", "python3 /opt/monitor/check_disk.py --include backup  (monitoring, hourly)", "find /var/tmp -iname \"*backup*\"  (unknown user, 02:14, first seen)"]}], "question": "Make the two engineering calls, then press Check.", "hint": "Precision on paths beats keyword-anywhere; keep a second detection layer for what the narrowing gives up.", "explain": "<p><strong>Root cause:</strong> keyword-anywhere over /var was the mistake; the fix is <strong>BackupConfigPaths</strong> &mdash; match the real backup config paths (/etc/rsnapshot.conf, /opt/veeam/config.ini, agent dirs), not the word. <strong>Trade-off:</strong> narrowing means a renamed or relocated agent may be missed, so keep the vendor-keyword layer and review monthly; deleting the analytic or alerting on everything both repeat the incident-review failure. Note the third sample line: an unknown user at 02:14 is precisely what the tuned rule must keep catching.</p>", "steps": [{"q": "Which mutable element fixes the root cause?", "opts": ["BackupConfigPaths — narrow matches to real backup config paths", "KnownBackupVendors — it is the Windows vendor list", "InstallLocationScope — it is the macOS element", "Remove all tuning and alert on everything"], "ans": 0, "why": "The volume comes from matching the word backup across /var; BackupConfigPaths restores path precision on Linux."}, {"q": "Which trade-off statement is acceptable to sign off?", "opts": ["Narrow to config paths, keep the vendor-keyword layer, review monthly", "Accept 40/day — alert fatigue is a myth", "Delete the analytic until it can be rewritten"], "ans": 0, "why": "Layered tuning with a scheduled review keeps the unknown-user class visible while killing the job-runner noise."}]}, {"id": "X06", "type": "multi", "summary": "Next hunts after backup-server credential abuse", "scenario": [{"label": "ARTEFACT 1 — Situation", "kind": "prose", "text": "VEEAM_SVC was used interactively from 185[.]220[.]101[.]45 &mdash; a source BK-01 has never seen. AN0240 caught <code>reg query</code> against Veeam keys minutes earlier. Credentials on the backup server are suspected stolen. The IR lead wants the two highest-value next hunts."}], "question": "Select the TWO highest-value next hunts.", "hint": "What do attackers take from backup servers, and what do they break afterwards?", "explain": "<p>Backup servers hold <strong>credentials worth stealing</strong> (T1003-style LSASS access, credential dumps) and are the springboard to <strong>T1490 recovery destruction</strong> across the estate &mdash; those are the two hunts. Reimaging every DC is premature and destructive, and emailing staff is communications, not hunting. Blocking a single TOR-exit IP is a control tweak, not a hunt, and it evaporates with the next exit node.</p>", "options": ["Hunt T1003-style credential access on BK-01 and any new use of backup-admin credentials", "Hunt T1490-adjacent commands (vssadmin, wbadmin, bcdedit) across the estate", "Reimage all domain controllers now", "Email all staff about backup hygiene"], "answers": [0, 1]}, {"id": "X07", "type": "qcm", "summary": "03:12 on a DBA laptop: claim versus telemetry", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-5721", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688  03:12", "User: CORP\\dthomas (interactive, local admin on own laptop)", "ParentImage: explorer.exe -> powershell.exe", "CommandLine: reg query \"HKLM\\SOFTWARE\\Veeam\"  Host: LAP-DBA-2"]}, {"label": "ARTEFACT 2 — Corroboration pull", "kind": "prose", "text": "dthomas is a database administrator with no backup role. Asked at 09:00, dthomas says: \"testing a migration project\" — no ticket exists. Proxy history: the laptop resolved a known-malicious domain eight days ago. No other EDR signals since."}], "question": "Which statement is the correct senior call?", "hint": "UserContextScope flags interactive low-privilege contexts — it does not bless them. Which signal wins, and why?", "explain": "<p>The interactive context does <strong>not</strong> make this benign &mdash; UserContextScope flags interactive low-privilege contexts as the interesting class. An unverifiable claim plus a prior malicious-domain contact on the same host plus a role mismatch outweighs the absence of other EDR signals: <strong>escalate as suspected true positive pending verification</strong>. Accepting the claim closes a likely-compromised laptop; declaring an incident without any check is equally wrong; and 03:12 interactive shells are not scheduled jobs.</p>", "options": ["Interactive context means benign per UserContextScope — close it", "The claim is unverifiable and the host has malicious-contact history: escalate as suspected true positive pending verification", "DBAs never touch Veeam, so declare a major incident immediately, no checks", "Auto-close: 03:12 activity is always scheduled work"], "answer": 1}, {"id": "X08", "type": "order", "summary": "Rank the five-alert queue", "scenario": [{"label": "ARTEFACT 1 — Monday 08:30 queue, two analysts free", "kind": "mono", "lines": ["A  DC-02: cmd -> reg query acronis; ACRO_SVC never seen interactive before", "B  MAC-3: Terminal -> mdfind \"Time Machine\"; first Terminal use on host", "C  WEB-03: www-data -> python3 -> find /etc -iname \"*backup*\"", "D  WS-4417: explorer -> powershell Get-ChildItem Program Files (no vendor name)", "E  BK-01: backupadmin weekly console action inside change window CHG-2301"]}], "question": "Drag to rank from 1 (work first) to 5 (work last).", "hint": "New context plus vendor keyword plus critical host first; routine and keyword-less last.", "explain": "<p><strong>1 — A:</strong> critical host, vendor keyword, service account breaking its expected pattern. <strong>2 — B:</strong> first-ever Terminal use plus backup-product search on macOS &mdash; new-behaviour signal. <strong>3 — C:</strong> low-privilege web user sweeping for backups via an interpreter &mdash; suspicious, but a public web host usually holds no backup estate. <strong>4 — D:</strong> generic listing, no vendor keyword. <strong>5 — E:</strong> documented routine by the owning admin inside a change window.</p>", "rankLabel": "Rank by true-positive likelihood (1 = highest).", "items": ["A — DC-02: cmd reg query acronis, new-interactive ACRO_SVC", "B — MAC-3: first Terminal use, mdfind \"Time Machine\"", "C — WEB-03: www-data via python3 sweeps /etc for backup", "D — WS-4417: powershell lists Program Files, no vendor name", "E — BK-01: backupadmin weekly console action, CHG-2301"], "correct": [0, 1, 2, 3, 4]}, {"id": "X09", "type": "qcm", "summary": "One event on a shared jump host", "scenario": [{"label": "ARTEFACT 1 — Alert DET0088-5798, 22:47", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "Host: JUMP-01 (shared by three administrators)", "CommandLine: reg query \"HKLM\\SOFTWARE\\Acronis\"", "User: CORP\\adm-hfrost"]}, {"label": "ARTEFACT 2 — What you do NOT have", "kind": "prose", "text": "EDR shows no other activity. RBAC and concurrent-session data are not yet pulled. No change ticket matches. The incident commander demands an immediate major-incident declaration."}], "question": "What is the defensible next move?", "hint": "The evidence is one event deep — what would you want in hand before you sign your name to a major incident?", "explain": "<p>One query on a shared host with no corroborating data is not enough to declare, and not enough to close. The defensible move is to <strong>pull parent lineage, concurrent sessions, and change records</strong> &mdash; the declaration either lands in minutes with evidence behind it, or the alert dies quietly. Declaring now burns credibility and triggers the costliest response path; closing now gambles a possible intrusion; wiping JUMP-01 destroys the shared host’s evidence and everyone’s session history.</p>", "options": ["Declare a major incident immediately — the commander is waiting", "Hold the declaration: pull parent lineage, concurrent sessions and change records for JUMP-01 first", "Close as false positive immediately — shared hosts are noise", "Wipe JUMP-01 to be safe"], "answer": 1}, {"id": "X10", "type": "fill", "summary": "Tuning sentence after an acquisition", "scenario": [{"label": "ARTEFACT 1 — Detection-engineering review note", "kind": "prose", "text": "After the merger, a new backup product appeared on 300 hosts, and two Office-macro incidents showed lineage AN0240 missed. Complete the review sentence with the exact elements and values."}], "question": "Fill the three blanks.", "hint": "Two Windows script hosts cover the macro lineage; one mutable element holds vendor names.", "explain": "<p><strong>SuspiciousParentProcesses</strong> should list <strong>powershell.exe</strong> and <strong>wscript.exe</strong> &mdash; the two script hosts behind both macro incidents &mdash; while <strong>KnownBackupVendors</strong> must gain the acquired vendor, or 300 hosts silently leave analytic coverage. chrome.exe is not a script host, InstallLocationScope is macOS, and mdfind is a discovery tool, not a tuning element here.</p>", "template": "SuspiciousParentProcesses should list {0} and {1} so Office-macro lineage is caught, while {2} must gain the vendor acquired in the merger.", "blanks": ["powershell.exe", "wscript.exe", "KnownBackupVendors"], "bank": ["powershell.exe", "wscript.exe", "KnownBackupVendors", "chrome.exe", "InstallLocationScope", "mdfind"]}, {"id": "X11", "type": "linepick", "summary": "Four chain artefacts hiding in the noise", "scenario": [{"label": "ARTEFACT 1 — Incident workspace, seven artefacts", "kind": "mono", "lines": []}], "question": "Click the FOUR artefacts relevant to the backup-discovery to impact chain.", "hint": "Printer queues and application updates do not touch the backup estate.", "explain": "<p>The chain artefacts: <strong>powershell reg query for Veeam</strong> (the discovery itself), the <strong>VEEAM_SVC logon from a first-time source</strong> (credential abuse on the backup server), the <strong>scheduled task writing into the Veeam directory</strong> (persistence inside the backup estate), and <strong>vssadmin delete shadows</strong> (recovery destruction &mdash; T1490). The print failure, the geo-typical VPN login, and the Teams update are realistic noise with no backup relevance.</p>", "lines": [{"t": "4688 FIN-WS-12: powershell -> reg query \"HKLM\\SOFTWARE\\Veeam\"", "c": true}, {"t": "Print server PR-2: job #9981 failed, tray empty", "c": false}, {"t": "BK-01: VEEAM_SVC logon from 10[.]0[.]9[.]44 (first time this source)", "c": true}, {"t": "VPN: dthomas geo-login from usual city, known device", "c": false}, {"t": "BK-01: new scheduled task \"HealthCheck\" writing to C:\\Veeam\\scripts", "c": true}, {"t": "WS-77: Teams client updated to build 25187", "c": false}, {"t": "BK-01: vssadmin delete shadows /all /quiet", "c": true}], "pick": 4}, {"id": "X12", "type": "match", "summary": "Match each proposed fix to why it fails", "scenario": [{"label": "ARTEFACT 1 — CISO demand", "kind": "prose", "text": "CISO: \"I want a firewall rule that stops backup discovery. Give me the control set by Friday.\" The ATT&CK page states the plain fact: this technique cannot be easily mitigated with preventive controls because it abuses system features. Match each proposal to its failure reason."}], "question": "Match each proposed fix to the reason it fails.", "hint": "One breaks admin work and misses the other tools; one addresses CVEs, not behaviour; one is not even possible.", "explain": "<p><strong>Blocking PowerShell everywhere</strong> breaks administration and misses the same discovery via cmd, reg, WMI, or bash &mdash; the analytic exists precisely because built-in tools are everywhere. <strong>Patching only the Veeam server</strong> addresses vulnerabilities, not the T1518.002 behaviour, which needs no vulnerability at all. <strong>Disabling the Windows registry</strong> is not possible &mdash; it is core to the operating system. The honest control set is detection quality (DET0088), tuning, and response readiness.</p>", "pairs": [["Block PowerShell enterprise-wide", "Breaks admin work; discovery also runs via cmd, reg, and WMI"], ["Patch only the Veeam server", "Patching helps CVEs, not a behaviour that needs none"], ["Disable the Windows registry", "Not possible — the registry is core to the OS"]]}, {"id": "X13", "type": "decision", "summary": "Linux web server: sweep, config read, staging", "scenario": [{"label": "ARTEFACT 1 — AN0241 hits on WEB-03", "kind": "mono", "lines": ["14:02 auditd SYSCALL execve | www-data -> python3 (/tmp/x.sh) | find /opt -iname \"*veeam*\"", "14:11 auditd PATH open,read | /opt/veeam/config.ini | www-data", "14:26 file created: /dev/shm/etc.tar.gz (owner www-data)", "Service: storefront up, revenue traffic normal"]}, {"label": "ARTEFACT 2 — Host role", "kind": "prose", "text": "WEB-03 fronts the online store. /opt/veeam holds a Veeam agent for the store database backups. /dev/shm is memory-backed and cleared on reboot."}], "question": "Work the four steps, then press Check.", "hint": "Deleting the archive destroys evidence; watching longer risks the data. Weigh both against the storefront.", "explain": "<p><strong>Step 1:</strong> the sweep matches AN0241 with a hostile profile &mdash; low-privilege web user, interpreter parent, vendor path. <strong>Step 2:</strong> the forward hunt is config reads and archive creation, which artefact 2 then confirms. <strong>Step 3:</strong> <code>/dev/shm/etc.tar.gz</code> is staging &mdash; memory-backed, reboot-cleared, classic exfil prep &mdash; so escalate. <strong>Step 4:</strong> isolate WEB-03, accepting storefront downtime as the price of stopping exfil, and preserve the archive for forensics. Deleting the tar.gz destroys the best evidence; keeping the site live risks the data leaving; reimaging first destroys volatile evidence and the session context.</p>", "steps": [{"q": "Classify the 14:02 sweep.", "opts": ["Match — low-privilege web user plus interpreter sweeping vendor paths", "Benign — backup jobs sweep every night", "Hardware error"], "ans": 0, "why": "www-data has no business hunting the Veeam agent; the python3 parent from /tmp is interpreter lineage."}, {"q": "Forward hunt?", "opts": ["Check DHCP lease logs", "Look for backup-config reads and archive creation next", "Nothing — wait for more alerts"], "ans": 1, "why": "After a sweep, the analytic’s own second source (DC0055 file access) is the natural next place to look."}, {"q": "Interpret /dev/shm/etc.tar.gz.", "opts": ["Normal web cache output", "Backup job output", "Staging — possible exfil prep; escalate"], "ans": 2, "why": "A memory-backed archive of configuration, owned by the compromised user, is staging behaviour."}, {"q": "Response, given the storefront revenue constraint?", "opts": ["Isolate WEB-03 now and preserve /dev/shm artefacts, accepting downtime", "Delete the tar.gz and keep serving", "Keep serving and watch for another hour", "Reimage first, investigate later"], "ans": 0, "why": "Containment with an accepted, conscious business cost — and evidence preserved rather than destroyed."}]}, {"id": "X14", "type": "multi", "summary": "Why backup servers are high-value targets", "scenario": [{"label": "ARTEFACT 1 — CTI briefing prep", "kind": "prose", "text": "You brief new analysts on why DET0088’s target class matters. Three facts belong in the briefing; three do not."}], "question": "Select the THREE facts that make backup servers high-value targets worth the DET0088 watch.", "hint": "Think privilege, credentials, and the attacker’s leverage over recovery.", "explain": "<p>Backup software commonly runs with <strong>high-privilege service rights</strong>; backup servers <strong>store credentials</strong> used across the estate; and destroying or encrypting backups <strong>removes the main recovery path</strong>, which is what turns ransomware into maximum pressure (T1490, with T1485 Data Destruction and T1486 Data Encrypted for Impact nearby). The other three statements are false or nonsensical: backup servers do hold logs, agents absolutely can be enumerated from the CLI (that is the technique), and AN0240 is a Windows analytic.</p>", "options": ["Backup software commonly runs with high-privilege service rights", "Backup servers store credentials used across the estate", "Destroying backups removes the main recovery path, raising ransom pressure", "Backup servers never hold logs", "Backup agents cannot be enumerated from the CLI", "AN0240 requires macOS"], "answers": [0, 1, 2]}, {"id": "X15", "type": "match", "summary": "Capstone: artefacts to ATT&CK objects", "scenario": [{"label": "ARTEFACT 1 — End-of-engagement mapping board", "kind": "prose", "text": "Four artefacts from the engagement need their ATT&amp;CK objects before the report ships. Two belong to this detection strategy’s analytics; two are the follow-on techniques it exists to foresee."}], "question": "Match each artefact to its ATT&CK object.", "hint": "Two artefacts map to this strategy’s analytics; one breaks recovery; one steals credentials.", "explain": "<p><code>reg query</code> against Veeam keys in a 4688 event is <strong>DET0088 / AN0240</strong> (Windows command-and-registry discovery). <code>find /etc</code> for backup names in auditd execve telemetry is <strong>DET0088 / AN0241</strong> (Linux CLI discovery). <code>vssadmin delete shadows</code> is <strong>T1490 Inhibit System Recovery</strong> &mdash; the impact this detection exists to foresee. Credential dumping on the backup server is <strong>T1003 OS Credential Dumping</strong> &mdash; the monetisation step between discovery and destruction.</p>", "pairs": [["4688: reg query \"HKLM\\SOFTWARE\\Veeam\"", "DET0088 / AN0240 (this detection strategy)"], ["auditd execve: find /etc -iname \"*backup*\"", "DET0088 / AN0241 (this detection strategy)"], ["vssadmin delete shadows /all /quiet", "T1490 Inhibit System Recovery"], ["Credential dumping on the backup server", "T1003 OS Credential Dumping"]]}]}</script>

var SEVCLASS = {'EASY':'sev-easy','MEDIUM':'sev-medium','HARD':'sev-hard','EXTREMELY HARD':'sev-extreme'};
function $(id){return document.getElementById(id);}
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function scoreExercise(H,W,N){ if(N<=0){return 0;} var c=(H-W)/N; if(c<0){c=0;} if(c>1){c=1;} return Math.round(c*100)/100; }
function disableAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('button,select,input'),function(x){x.disabled=true;});
}
var S = null;
function cur(){return S.order[S.idx];}
function idOf(i){return S.order[i].id;}
function answeredCount(){return Object.keys(S.credits).length;}
function creditSum(){var s=0;Object.keys(S.credits).forEach(function(k){s+=S.credits[k];});return s;}

/* ---------------- intro ---------------- */
function renderIntro(){
  var m = EXAM.meta;
  $('introTitle').textContent = m.title;
  $('introObject').innerHTML = '<span class="chip">&#129520; ATT&amp;CK Detection Strategy '+esc(m.objectId)+' &mdash; '+esc(m.objectName)+'</span>'+
    '<span class="chip sev '+SEVCLASS[EXAM.sev]+'">Severity: '+esc(EXAM.sev)+'</span>';
  $('introFacts').innerHTML =
    '<span class="chip">&#129513; Exercises in this file: '+EXAM.exercises.length+'</span>'+
    '<span class="chip">&#9201; Estimated time: '+m.estimatedMinutes+' min</span>'+
    '<span class="chip">&#9203; Timer budget: '+fmtTime(EXAM.timerSeconds)+'</span>'+
    '<span class="chip">&#127937; Pass mark: '+EXAM.passMark+'%</span>';
  $('introLearn').innerHTML = EXAM.intro.learn;
  var kw = $('introKeywords'); kw.innerHTML='';
  EXAM.intro.keywords.forEach(function(g){
    var d = el('div','kw-group');
    d.appendChild(el('h3',null,esc(g.group)));
    var w = el('div','kw-items');
    g.items.forEach(function(it){ w.appendChild(el('span','kw',esc(it))); });
    d.appendChild(w);
    kw.appendChild(d);
  });
  $('introHow').innerHTML = EXAM.intro.how;
}
function show(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){
    $(s).hidden = (s!==id);
  });
  window.scrollTo(0,0);
}

/* ---------------- state ---------------- */
function freshState(){
  return {
    order: shuffle(EXAM.exercises),
    idx: 0,
    credits: {},
    answered: {},
    skipped: [],
    hintUsed: {},
    widget: null,
    timer: {state:'RUNNING', left: EXAM.timerSeconds, total: EXAM.timerSeconds},
    pausedFrom: null,
    phase: 'exam',
    pauseManualSec: 0,
    pauseFeedbackSec: 0,
    reported: false
  };
}
function startExam(){
  S = freshState();
  $('hintBtn').disabled = false;
  show('scr-exam');
  renderExercise();
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- timer ---------------- */
function setTimerState(st){
  if(!S){return;}
  if(S.timer.state==='ENDED' && st!=='ENDED'){return;}
  S.timer.state = st;
  renderTimer();
}
function renderTimer(){
  if(!S){return;}
  var chip = $('timerChip');
  var t = S.timer;
  var cls='t-run', txt='';
  if(t.state==='RUNNING'){cls='t-run'; txt='&#9201; RUNNING &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_MANUAL'){cls='t-pause'; txt='&#9208; PAUSED &mdash; manual (press Resume) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_AUTO_CHECK'){cls='t-pause'; txt='&#9208; PAUSED &mdash; reviewing feedback (resumes on Next) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else {cls='t-end'; txt='&#9209; ENDED &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  chip.className='chip '+cls;
  chip.innerHTML = txt;
  chip.setAttribute('aria-label','Timer state: '+t.state);
  $('pauseBtn').disabled = !(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK');
}
function tick(){
  if(!S || (S.phase!=='exam' && S.phase!=='review')){return;}
  if(S.timer.state==='RUNNING'){
    S.timer.left--;
    if(S.timer.left<=0){ S.timer.left=0; renderTimer(); forceFinish(); return; }
  } else if(S.timer.state==='PAUSED_MANUAL'){ S.pauseManualSec++; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ S.pauseFeedbackSec++; }
  renderTimer();
}
function forceFinish(){
  setTimerState('ENDED');
  showResults();
}

/* ---------------- header widgets ---------------- */
function updateScore(){
  var a = answeredCount(), s = creditSum();
  var pct = a>0 ? Math.round(s/a*100) : 0;
  $('scoreChip').innerHTML = '&#127942; Score <strong class="mono">'+fmt1(s)+'</strong> / '+a+' <span class="muted">('+pct+'%)</span>';
}
function updateProgress(){
  var p = Math.round(answeredCount()/EXAM.exercises.length*100);
  $('progressFill').style.width = p+'%';
  $('progressFill').setAttribute('aria-valuenow', p);
}
function updateCheckState(){
  if(!S || !S.widget){return;}
  /* disabled only when the widget defines ready() and it returns false */
  $('checkBtn').disabled = !!(S.widget.ready && !S.widget.ready());
}

/* ---------------- exercise rendering ---------------- */
function nextUnanswered(from){
  var n = S.order.length;
  for(var k=1;k<=n;k++){
    var i = (from+k)%n;
    var id = idOf(i);
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ return i; }
  }
  return -1;
}
function renderExercise(){
  var ex = cur();
  S.phase='exam';
  $('exCounter').textContent = 'Exercise '+(S.idx+1)+' of '+S.order.length;
  var sev = $('sevBadge');
  sev.className = 'chip '+SEVCLASS[EXAM.sev];
  sev.textContent = EXAM.sev;
  sev.setAttribute('aria-label','Severity '+EXAM.sev);
  $('scenSummary').textContent = ex.summary;
  var body = $('scenBody'); body.innerHTML='';
  ex.scenario.forEach(function(b){
    var wrap = el('div','artefact');
    wrap.appendChild(el('div','artefact-label',esc(b.label)));
    if(b.kind==='mono'){
      var pre = el('pre','mono'); pre.textContent = b.lines.join('\n');
      wrap.appendChild(pre);
    } else {
      var pr = el('div','prose'); pr.innerHTML = b.text;
      wrap.appendChild(pr);
    }
    body.appendChild(wrap);
  });
  $('scenBody').hidden=false;
  $('scenHead').setAttribute('aria-expanded','true');
  $('scenToggleHint').innerHTML='&#9660; collapse';
  $('qText').innerHTML = ex.question;
  Array.prototype.forEach.call(document.querySelectorAll('.hintbox'), function(x){ if(x.parentNode){x.parentNode.removeChild(x);} });
  var aa = $('answerArea'); aa.innerHTML='';
  S.widget = WIDGETS[ex.type](ex, aa, updateCheckState);
  $('feedbackBlock').hidden = true; $('feedbackBlock').innerHTML='';
  $('checkBtn').hidden = false;
  updateCheckState();
  $('nextBtn').hidden = true; $('finishBtn').hidden = true;
  $('hintBtn').disabled = !!S.hintUsed[ex.id];
  $('skipBtn').disabled = !!S.answered[ex.id];
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- feedback ---------------- */
var ROWMETA = {
  ok:{ic:'&#10003;',st:'Correct'},
  bad:{ic:'&#10007;',st:'Wrong'},
  miss:{ic:'&#9675;',st:'Missed'}
};
function renderFeedback(ex, g, credit){
  var fb = $('feedbackBlock');
  fb.hidden = false;
  var head, cls;
  if(credit>=1){head='&#10003; CORRECT'; cls='ok';}
  else if(credit>0){head='&#10003; PARTIALLY CORRECT &mdash; credit '+credit.toFixed(2); cls='part';}
  else {head='&#10007; INCORRECT'; cls='bad';}
  var h = '<div class="fb-head '+cls+'">'+head+'</div>';
  if(g.N>1){
    h += '<div class="muted">credit '+credit.toFixed(2)+' &mdash; '+g.H+'/'+g.N+' correct items, formula (H &minus; W) / N = ('+g.H+' &minus; '+g.W+') / '+g.N+'</div>';
  }
  if(ex.type==='qcm' && credit<1){
    h += '<div class="fb-row ok"><span class="ic">&#10003;</span><span class="st">Correct</span><span>Answer: <strong>'+esc(ex.options[ex.answer])+'</strong></span></div>';
  }
  if(g.rows && g.rows.length){
    h += '<div class="fb-rows">';
    g.rows.forEach(function(r){
      var m = ROWMETA[r.state];
      h += '<div class="fb-row '+r.state+'"><span class="ic">'+m.ic+'</span><span class="st">'+m.st+'</span><span>'+r.label+(r.note?' &mdash; <span class="muted">'+esc(r.note)+'</span>':'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose" style="margin-top:8px">'+ex.explain+'</div>';
  if(S.hintUsed[ex.id]){
    h += '<div class="hintbox"><span class="hw">&#128161; Hint was used:</span> &minus;10% was applied to this exercise\u2019s credit.</div>';
  }
  var study = ex.study || 'Re-read the explanation above and the matching part of the intro section \u201cWhat you will learn here\u201d, then try the exercise again on a retake.';
  h += '<div class="prose muted" style="margin-top:6px"><strong>What to study:</strong> '+study+'</div>';
  fb.innerHTML = h;
  fb.className = 'feedback f-'+(cls==='ok'?'ok':(cls==='part'?'part':'bad'));
}

/* ---------------- check / next / skip / hint / pause ---------------- */
function onCheck(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit-0.10); credit = Math.round(credit*100)/100; }
  S.credits[ex.id] = credit;
  S.answered[ex.id] = true;
  var si = S.skipped.indexOf(ex.id);
  if(si>=0){ S.skipped.splice(si,1); }
  S.widget.lock();
  setTimerState('PAUSED_AUTO_CHECK');
  renderFeedback(ex, g, credit);
  $('checkBtn').hidden = true;
  var last = nextUnanswered(S.idx)===-1;
  $('nextBtn').hidden = false;
  $('finishBtn').hidden = !last;
  $('skipBtn').disabled = true;
  updateScore(); updateProgress();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  if(S._fromReview && S.answered[idOf(S.idx)]){ S._fromReview=false; showReview(); return; }
  S.idx = n; S._fromReview=false;
  renderExercise();
}
function onSkip(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){ S.skipped.push(ex.id); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  S.idx = n;
  renderExercise();
}
function onHint(){
  var ex = cur();
  if(S.hintUsed[ex.id] || S.answered[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var old = document.querySelectorAll('.hintbox.live');
  Array.prototype.forEach.call(old,function(x){x.parentNode.removeChild(x);});
  var box = el('div','hintbox live');
  box.innerHTML = '<span class="hw">&#128161; HINT (&minus;10% of this exercise\u2019s credit):</span> '+esc(ex.hint);
  $('answerArea').parentNode.insertBefore(box, $('answerArea'));
  $('hintBtn').disabled = true;
}
function onPause(){
  if(!S || S.phase!=='exam'){return;}
  if(S.timer.state==='RUNNING' || S.timer.state==='PAUSED_AUTO_CHECK'){
    S.pausedFrom = S.timer.state;
    setTimerState('PAUSED_MANUAL');
    $('pausedOverlay').hidden=false;
  }
}
function onResume(){
  setTimerState(S.pausedFrom || 'RUNNING');
  S.pausedFrom=null;
  $('pausedOverlay').hidden=true;
}

/* ---------------- finish / review / results ---------------- */
function finishAttempt(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  if(S.skipped.length>0){ showReview(); } else { showResults(); }
}
function showReview(){
  S.phase='review';
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  show('scr-review');
  $('reviewIntro').innerHTML = 'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it while the timer is still running. If you submit now, skipped exercises are <strong>excluded</strong> from the score (they count neither as correct nor as wrong).';
  var list = $('reviewList'); list.innerHTML='';
  S.skipped.forEach(function(id,i){
    var ex = null;
    S.order.forEach(function(o){ if(o.id===id){ex=o;} });
    var row = el('div','review-row');
    row.innerHTML = '<span><span class="warnword">&#9888; Skipped</span> &mdash; '+esc(ex.summary)+'</span>';
    var b = el('button','btn small primary','Answer &#9654;');
    b.addEventListener('click', function(){
      S._fromReview=true;
      for(var k=0;k<S.order.length;k++){ if(S.order[k].id===id){ S.idx=k; break; } }
      show('scr-exam');
      renderExercise();
    });
    row.appendChild(b);
    list.appendChild(row);
  });
}
function showResults(){
  S.phase='results';
  setTimerState('ENDED');
  show('scr-results');
  var ids = Object.keys(S.credits);
  var answered = ids.length;
  var sum=0, full=0, part=0, zero=0, partSum=0;
  ids.forEach(function(id){var c=S.credits[id]; sum+=c; if(c>=1){full++;} else if(c>0){part++; partSum+=c;} else {zero++;}});
  var skippedNever = EXAM.exercises.length - answered;
  var pct = answered>0 ? Math.round(sum/answered*100) : 0;
  var passed = pct >= EXAM.passMark;
  var vp = $('verdictPanel');
  if(passed){
    vp.className='card verdict-pass';
    vp.innerHTML = '<div class="bigword">&#10003; PASS</div><p>You reached <strong>'+pct+'%</strong> (pass mark '+EXAM.passMark+'%). Well done &mdash; you demonstrated working knowledge of '+esc(EXAM.meta.objectId)+' &mdash; '+esc(EXAM.meta.objectName)+' at '+esc(EXAM.sev)+' level.</p>';
  } else {
    vp.className='card verdict-fail';
    vp.innerHTML = '<div class="bigword">&#10007; FAIL</div><p>You reached <strong>'+pct+'%</strong>, below the '+EXAM.passMark+'% pass mark. You must retake this exam. Review the explanations, then press Retake.</p>';
  }
  var avgPart = part>0 ? (partSum/part) : 0;
  $('resultsBreakdown').innerHTML =
    '<h2>Score breakdown</h2>'+
    '<div class="res-line ok"><span>&#10003; Fully correct</span><span class="st">'+full+'</span></div>'+
    '<div class="res-line part"><span>&#10003; Partially correct</span><span class="st">'+part+(part>0?' <span class="muted">(avg '+avgPart.toFixed(2)+')</span>':'')+'</span></div>'+
    '<div class="res-line bad"><span>&#10007; Fully incorrect</span><span class="st">'+zero+'</span></div>'+
    '<div class="res-line skip"><span>&#9888; Skipped or unanswered &mdash; excluded</span><span class="st">'+skippedNever+'</span></div>'+
    '<div class="res-line"><span><strong>Total score</strong></span><span class="st"><strong class="mono">'+fmt1(sum)+' / '+answered+'</strong> &mdash; <strong>'+pct+'%</strong></span></div>';
  $('resultsMeta').innerHTML =
    '<h2>How your time was spent</h2>'+
    '<div class="res-line"><span>Time paused manually (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseManualSec)+'</span></div>'+
    '<div class="res-line"><span>Time paused for feedback review (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseFeedbackSec)+'</span></div>'+
    '<div class="res-line"><span>Time left on the clock</span><span class="st mono">'+fmtTime(S.timer.left)+'</span></div>';
  reportScore(sum, answered, pct, passed);
}
function reportScore(creditSum, answeredCount, pct, passed){
  if(S.reported){return;}
  S.reported = true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.meta.topicId,
      batch: EXAM.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: pct,
      passed: passed
    }, location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}

/* ---------------- interactive widgets ---------------- */
var WIDGETS = {};

WIDGETS.qcm = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = -1;
  var wrap = el('div');
  perm.forEach(function(oi, pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} sel = oi; refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = (parseInt(b.dataset.oi,10) === sel);
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return sel>=0; },
    grade:function(){ return {H:(sel===ex.answer?1:0), W:0, N:1, rows:[]}; },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        b.disabled=true;
        var oi=parseInt(b.dataset.oi,10);
        if(oi===ex.answer){b.classList.add('ok');}
        if(oi===sel && sel!==ex.answer){b.classList.add('bad');}
      });
    }
  };
};

WIDGETS.multi = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = {};
  var wrap = el('div');
  perm.forEach(function(oi,pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} if(sel[oi]){delete sel[oi];} else {sel[oi]=true;} refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = !!sel[parseInt(b.dataset.oi,10)];
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length>0; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.options.forEach(function(o,i){
        var picked = !!sel[i], correct = ex.answers.indexOf(i)>=0;
        if(correct && picked){ H++; rows.push({state:'ok', label:o}); }
        else if(correct && !picked){ rows.push({state:'miss', label:o}); }
        else if(!correct && picked){ W++; rows.push({state:'bad', label:o}); }
      });
      return {H:H, W:W, N:ex.answers.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        var oi=parseInt(b.dataset.oi,10);
        if(ex.answers.indexOf(oi)>=0){ b.classList.add('ok'); b.classList.remove('sel'); }
        else if(sel[oi]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.match = function(ex, area, onChange){
  var rights = shuffle(ex.pairs.map(function(p){return p[1];}));
  var chosen = {};
  var wrap = el('div');
  ex.pairs.forEach(function(p,i){
    var row = el('div','pairrow');
    var left = el('div','left', esc(p[0]));
    var s = el('select','ans');
    var opt0 = el('option',null,'&mdash; match &mdash;'); opt0.value='';
    s.appendChild(opt0);
    rights.forEach(function(r){ var o=el('option',null,esc(r)); o.value=r; s.appendChild(o); });
    s.addEventListener('change', function(){ if(s.disabled){return;} chosen[i]=s.value; if(onChange){onChange();} });
    row.appendChild(left); row.appendChild(s);
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.pairs.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.pairs.forEach(function(p,i){
        var got = chosen[i];
        if(got && got===p[1]){ H++; rows.push({state:'ok', label:p[0]+' &rarr; '+esc(p[1])}); }
        else if(got){ W++; rows.push({state:'bad', label:p[0]+' &rarr; '+esc(got), note:'correct: '+p[1]}); }
        else { rows.push({state:'miss', label:p[0], note:'no match chosen; correct: '+p[1]}); }
      });
      return {H:H, W:W, N:ex.pairs.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s,i){
        s.disabled=true;
        if(s.value===ex.pairs[i][1]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.dnd = function(ex, area, onChange){
  var itemPerm = shuffle(ex.items.map(function(it,i){return i;}));
  var placed = {};   /* itemIndex -> slotId */
  var selItem = -1;
  var wrap = el('div');
  var pool = el('div','pool');
  var slotsBox = el('div');
  var slotEls = {};
  ex.slots.forEach(function(sl){
    var s = el('div','slot');
    s.dataset.slot = sl.id;
    s.setAttribute('role','button');
    s.tabIndex = 0;
    s.appendChild(el('span','slot-label', esc(sl.label)));
    var holder = el('div','slot-holder');
    s.appendChild(holder);
    slotEls[sl.id] = s;
    function placeIfSel(){
      if(selItem>=0 && placed[selItem]===undefined){
        placed[selItem]=sl.id; selItem=-1; render();
      }
    }
    s.addEventListener('click', placeIfSel);
    s.addEventListener('keypress', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); placeIfSel(); } });
    s.addEventListener('dragover', function(ev){ ev.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('over'); });
    s.addEventListener('drop', function(ev){ ev.preventDefault(); s.classList.remove('over'); placeIfSel(); });
    slotsBox.appendChild(s);
  });
  function render(){
    pool.innerHTML='';
    itemPerm.forEach(function(i){
      if(placed[i]!==undefined){return;}
      var c = el('button','itemchip', esc(ex.items[i].label));
      c.type='button';
      c.draggable = true;
      if(selItem===i){c.classList.add('sel');}
      c.addEventListener('click', function(){ selItem = (selItem===i?-1:i); render(); });
      c.addEventListener('dragstart', function(ev){ selItem=i; c.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain', String(i));}catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
      pool.appendChild(c);
    });
    ex.slots.forEach(function(sl){
      var holder = slotEls[sl.id].querySelector('.slot-holder');
      holder.innerHTML='';
      itemPerm.forEach(function(i){
        if(placed[i]!==sl.id){return;}
        var p = el('button','placed', esc(ex.items[i].label)+' <span aria-hidden="true">&times;</span>');
        p.type='button';
        p.title='Click to remove back to the bank';
        p.addEventListener('click', function(ev){ ev.stopPropagation(); delete placed[i]; render(); });
        holder.appendChild(p);
      });
    });
    if(onChange){onChange();}
  }
  render();
  wrap.appendChild(pool); wrap.appendChild(slotsBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.items.length;k++){ if(placed[k]===undefined){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.items.forEach(function(it,i){
        var at = placed[i];
        if(at && at===it.slot){ H++; rows.push({state:'ok', label:it.label+' &rarr; '+esc(slotName(it.slot))}); }
        else if(at){ W++; rows.push({state:'bad', label:it.label, note:'placed in '+slotName(at)+'; correct: '+slotName(it.slot)}); }
        else { rows.push({state:'miss', label:it.label, note:'not placed; correct: '+slotName(it.slot)}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
    }
  };
  function slotName(id){
    var n = id;
    ex.slots.forEach(function(s){ if(s.id===id){n=s.label;} });
    return String(n);
  }
};

WIDGETS.order = function(ex, area){
  var isRank = !!ex.rankLabel;
  var ord = shuffle(ex.items.map(function(o,i){return i;}));
  var wrap = el('div');
  var list = el('ul','orderlist');
  function render(){
    list.innerHTML='';
    ord.forEach(function(ii,pos){
      var li = el('li','orderrow');
      li.draggable = true;
      li.dataset.pos = String(pos);
      li.appendChild(el('span','pos', isRank ? ('#'+(pos+1)) : String(pos+1)+'.' ));
      li.appendChild(el('span','txt', esc(ex.items[ii])));
      var mv = el('span','mvbtns');
      var up = el('button',null,'&uarr;'); up.type='button'; up.title='Move up';
      up.addEventListener('click', function(){ if(up.disabled){return;} if(pos>0){var t=ord[pos-1];ord[pos-1]=ord[pos];ord[pos]=t;render();} });
      var dn = el('button',null,'&darr;'); dn.type='button'; dn.title='Move down';
      dn.addEventListener('click', function(){ if(dn.disabled){return;} if(pos<ord.length-1){var t=ord[pos+1];ord[pos+1]=ord[pos];ord[pos]=t;render();} });
      mv.appendChild(up); mv.appendChild(dn);
      li.appendChild(mv);
      li.addEventListener('dragstart', function(ev){ DRAGPOS = pos; try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} });
      li.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      li.addEventListener('drop', function(ev){ ev.preventDefault(); if(DRAGPOS<0||DRAGPOS===pos){return;} var m=ord.splice(DRAGPOS,1)[0]; ord.splice(pos,0,m); DRAGPOS=-1; render(); });
      list.appendChild(li);
    });
  }
  var DRAGPOS = -1;
  render();
  if(isRank){ area.appendChild(el('p','muted', esc(ex.rankLabel))); }
  wrap.appendChild(list);
  area.appendChild(wrap);
  return {
    grade:function(){
      var H=0,W=0,rows=[];
      ord.forEach(function(ii,pos){
        if(ii===ex.correct[pos]){ H++; rows.push({state:'ok', label:'Position '+(pos+1)+': '+esc(ex.items[ii])}); }
        else { W++; rows.push({state:'bad', label:'Position '+(pos+1)+': '+esc(ex.items[ii]), note:'correct here: '+esc(ex.items[ex.correct[pos]])}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.orderrow'), function(li){ li.draggable=false; });
    }
  };
};

WIDGETS.fill = function(ex, area, onChange){
  var bank = shuffle(ex.bank.slice());
  var chosen = {};
  var wrap = el('div','prose');
  var parts = ex.template.split(/\{(\d+)\}/g);
  var line = el('div');
  for(var k=0;k<parts.length;k++){
    if(k%2===0){ line.appendChild(document.createTextNode(parts[k])); }
    else {
      (function(){
        var bi = parseInt(parts[k],10);
        var s = el('select','ans');
        var o0 = el('option',null,'&mdash; choose &mdash;'); o0.value='';
        s.appendChild(o0);
        bank.forEach(function(w){ var o=el('option',null,esc(w)); o.value=w; s.appendChild(o); });
        s.addEventListener('change', function(){ if(s.disabled){return;} chosen[bi]=s.value; if(onChange){onChange();} });
        s.dataset.blank = String(bi);
        line.appendChild(s);
      })();
    }
  }
  wrap.appendChild(line);
  var bw = el('div','kw-items'); 
  bw.appendChild(el('span','kw','Word bank:'));
  bank.forEach(function(w){ bw.appendChild(el('span','kw',esc(w))); });
  area.appendChild(wrap); area.appendChild(bw);
  return {
    ready:function(){
      for(var k=0;k<ex.blanks.length;k++){ if(!chosen[k]){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.blanks.forEach(function(b,i){
        var got = chosen[i];
        if(got && got===b){ H++; rows.push({state:'ok', label:'Blank '+(i+1)+': '+esc(b)}); }
        else if(got){ W++; rows.push({state:'bad', label:'Blank '+(i+1)+': '+esc(got), note:'correct: '+b}); }
        else { rows.push({state:'miss', label:'Blank '+(i+1)+': no answer', note:'correct: '+b}); }
      });
      return {H:H, W:W, N:ex.blanks.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('select'), function(s){
        s.disabled=true;
        var bi=parseInt(s.dataset.blank,10);
        if(s.value===ex.blanks[bi]){ s.style.borderColor='var(--state-correct)'; }
        else { s.style.borderColor='var(--state-incorrect)'; }
      });
    }
  };
};

WIDGETS.linepick = function(ex, area, onChange){
  var pickN = ex.pick || 1;
  var sel = {};
  var wrap = el('div');
  ex.lines.forEach(function(L,i){
    var b = el('button','linepick');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.textContent = L.t;
    b.addEventListener('click', function(){
      if(b.disabled){return;}
      if(sel[i]){ delete sel[i]; }
      else {
        if(pickN===1){ sel={}; }
        else {
          var cnt = Object.keys(sel).length;
          if(cnt>=pickN){ return; }
        }
        sel[i]=true;
      }
      refresh();
    });
    b.dataset.li=String(i);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
      var on = !!sel[parseInt(b.dataset.li,10)];
      b.classList.toggle('sel',on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
    if(onChange){onChange();}
  }
  if(pickN>1){ area.appendChild(el('p','muted','Select exactly '+pickN+' lines, then press Check.')); }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length===pickN; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.lines.forEach(function(L,i){
        var c=!!L.c, p=!!sel[i];
        if(c && p){ H++; rows.push({state:'ok', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(c && !p){ rows.push({state:'miss', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(!c && p){ W++; rows.push({state:'bad', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
      });
      return {H:H, W:W, N:ex.lines.filter(function(L){return !!L.c;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
        var i=parseInt(b.dataset.li,10);
        if(ex.lines[i].c){ b.classList.add('ok'); }
        else if(sel[i]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.triage = function(ex, area, onChange){
  var chosen = {};
  var wrap = el('div');
  var tools = el('div','logtools');
  var inp = el('input');
  inp.type='text'; inp.placeholder='Filter log lines (case-insensitive substring)';
  inp.setAttribute('aria-label','Filter log lines');
  tools.appendChild(inp);
  var logBox = el('div');
  var rowEls = [];
  ex.log.forEach(function(L,i){
    var row = el('div','artefact');
    var pre = el('pre','mono'); pre.textContent = L.t;
    row.appendChild(pre);
    if(L.flag){
      var v = el('div','verdicts');
      ex.verdictOptions.forEach(function(vo,vi){
        var vb = el('button',null, esc(vo));
        vb.type='button';
        vb.setAttribute('aria-pressed','false');
        vb.addEventListener('click', function(){
          if(vb.disabled){return;}
          chosen[i]=vi; 
          Array.prototype.forEach.call(v.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
          vb.setAttribute('aria-pressed','true');
          if(onChange){onChange();}
        });
        vb.dataset.vi=String(vi);
        v.appendChild(vb);
      });
      row.appendChild(v);
    }
    rowEls.push({row:row, text:L.t});
    logBox.appendChild(row);
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rowEls.forEach(function(r){ r.row.style.display = (r.text.toLowerCase().indexOf(q)>=0)?'':'none'; });
  });
  wrap.appendChild(tools); wrap.appendChild(logBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      var ok=true;
      ex.log.forEach(function(L,i){ if(L.flag && chosen[i]===undefined){ ok=false; } });
      return ok;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.log.forEach(function(L,i){
        if(!L.flag){return;}
        var got = chosen[i];
        var correctTxt = ex.verdictOptions[L.correct];
        if(got!==undefined && got===L.correct){ H++; rows.push({state:'ok', label:short(L.t), note:ex.verdictOptions[got]}); }
        else if(got!==undefined){ W++; rows.push({state:'bad', label:short(L.t), note:'you chose: '+ex.verdictOptions[got]+'; correct: '+correctTxt}); }
        else { rows.push({state:'miss', label:short(L.t), note:'no verdict; correct: '+correctTxt}); }
      });
      return {H:H, W:W, N:ex.log.filter(function(L){return L.flag;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){
        var v = b.parentNode;
        var rowB = v.parentNode;
        var idx = rowEls.map(function(r){return r.row;}).indexOf(rowB);
        if(idx>=0 && chosen[idx]!==undefined && parseInt(b.dataset.vi,10)===chosen[idx]){
          if(chosen[idx]===ex.log[idx].correct){ b.style.borderColor='var(--state-correct)'; }
          else { b.style.borderColor='var(--state-incorrect)'; }
        }
      });
      inp.disabled=true;
    }
  };
  function short(t){ return esc(t.length>60?t.slice(0,60)+'\u2026':t); }
};

WIDGETS.decision = function(ex, area, onChange){
  var choices = [];
  var curStep = 0;
  var wrap = el('div');
  function renderStep(){
    var step = ex.steps[curStep];
    var box = el('div');
    box.appendChild(el('span','stepbadge','STEP '+(curStep+1)+' OF '+ex.steps.length));
    box.appendChild(el('p','prose', esc(step.q)));
    var perm = shuffle(step.opts.map(function(o,i){return i;}));
    var sel = -1;
    var confirmBtn = el('button','btn small primary','Confirm step &#9654;');
    confirmBtn.type='button';
    confirmBtn.disabled = true;
    perm.forEach(function(oi,pos){
      var b = el('button','opt');
      b.type='button';
      b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(step.opts[oi])+'</span>';
      b.addEventListener('click', function(){
        if(b.disabled){return;}
        sel=oi;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        confirmBtn.disabled=false;
      });
      box.appendChild(b);
    });
    box.appendChild(confirmBtn);
    confirmBtn.addEventListener('click', function(){
      if(confirmBtn.disabled){return;}
      choices[curStep]=sel;
      disableAll(box);
      confirmBtn.disabled=true;
      curStep++;
      if(curStep>=ex.steps.length){
        if(onChange){onChange();}
      } else { renderStep(); }
    });
    wrap.appendChild(box);
  }
  renderStep();
  area.appendChild(wrap);
  return {
    ready:function(){ return curStep>=ex.steps.length; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.steps.forEach(function(st,i){
        var got = choices[i];
        if(got===st.ans){ H++; rows.push({state:'ok', label:'Step '+(i+1), note:st.why}); }
        else { W++; rows.push({state:'bad', label:'Step '+(i+1), note:'correct: '+st.opts[st.ans]+'. '+st.why}); }
      });
      return {H:H, W:W, N:ex.steps.length, rows:rows};
    },
    lock:function(){ }
  };
};

function boot(){
  renderIntro();
  $('startBtn').addEventListener('click', startExam);
  $('checkBtn').addEventListener('click', onCheck);
  $('nextBtn').addEventListener('click', onNext);
  $('skipBtn').addEventListener('click', onSkip);
  $('hintBtn').addEventListener('click', onHint);
  $('pauseBtn').addEventListener('click', onPause);
  $('resumeBtn').addEventListener('click', onResume);
  $('finishBtn').addEventListener('click', finishAttempt);
  $('reviewSubmit').addEventListener('click', function(){ showResults(); });
  $('retakeBtn').addEventListener('click', function(){ startExam(); });
  $('scenHead').addEventListener('click', function(){
    var b=$('scenBody');
    b.hidden = !b.hidden;
    var open = !b.hidden;
    $('scenHead').setAttribute('aria-expanded', open?'true':'false');
    $('scenToggleHint').innerHTML = open ? '&#9660; collapse' : '&#9654; expand';
  });
  setInterval(tick, 1000);
  window.addEventListener('message', function(event){
    if(!event.data){return;}
    if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){return;}
    /* Handshake accepted: username, country, locale, topicId, batch are consumed.
       theme is always dark; this file is dark-only, so appearance does not change. */
    window.__cmHandshake = event.data;
  });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
