var INTRO = {"html": "\n<div class=\"intro-head\">\n  <h1>DET0397 — EASY practice exam</h1>\n  <div class=\"obj\">MITRE ATT&amp;CK Detection Strategy <b>DET0397</b> — Automated Exfiltration Detection Strategy<br>\n  Detects: <b>T1020 — Automated Exfiltration</b> (Tactic: Exfiltration) · Enterprise domain</div>\n  <span class=\"badge easy\" role=\"img\" aria-label=\"Severity EASY\">EASY</span>\n  <span id=\"intro-greet\" style=\"margin-left:10px;color:var(--text-secondary);font-size:.92rem\"></span>\n  <div class=\"facts\" style=\"margin-top:12px\">\n    <span class=\"fact\">Exercises: <b>16</b></span>\n    <span class=\"fact\">Estimated time: <b>30 min</b></span>\n    <span class=\"fact\">Timer budget: <b>30 min</b></span>\n    <span class=\"fact\">Pass mark: <b>70%</b></span>\n    <span class=\"fact\">Scoring: <b>partial credit</b></span>\n  </div>\n</div>\n<div class=\"card\">\n  <h2>What you will learn here</h2>\n  <p>Hello! In this exam you will learn about <b>DET0397</b>, the <b>Automated Exfiltration Detection Strategy</b> from the MITRE ATT&amp;CK framework.</p><p>First, what is a <b>detection strategy</b>? In ATT&amp;CK, a detection strategy is a plan that tells defenders <i>how</i> to notice one attacker behaviour. It says which logs to collect, what pattern to look for, and which parts you can tune for your own company. DET0397 watches for <b>T1020 — Automated Exfiltration</b>. That is when malware sends stolen data out by itself, again and again, without a human typing anything. The data often leaves in small pieces, on a schedule, so it looks quiet and normal.</p><p>Who uses this in real work? <b>Detection engineers</b> build the rules. <b>SOC analysts</b> get the alerts and decide if they are real. <b>Threat hunters</b> search old logs for the same pattern. <b>Incident responders</b> use it to see what data left a hacked host. <b>CTI analysts</b> connect the pattern to known groups. The tools are a SIEM, EDR on computers, and network flow sensors.</p><p>Why does it matter? If data leaves your network silently, the damage is often found months later. This detection gives you an early alarm.</p><p>You will meet this object in: alert triage queues, detection rule reviews, threat-hunt notes, tuning meetings, and incident reports. The risks it addresses are silent data theft, long-dwell breaches, and lost customer data.</p><p>This EASY file builds your foundation. Every exercise tests <b>one small idea</b> and guides you.\n</div>\n<div class=\"card\">\n  <h2>Keywords covered in this exam</h2>\n  <div class='kw-theme'>The detection object and ATT&CK position</div><div class='chips'><span class='chip'>DET0397 (detection strategy object)</span><span class='chip'>T1020 Automated Exfiltration</span><span class='chip'>Exfiltration tactic</span><span class='chip'>ATT&CK matrix position</span></div><div class='kw-theme'>Data sources and telemetry</div><div class='chips'><span class='chip'>DC0032 Process Creation</span><span class='chip'>DC0082 Network Connection Creation</span><span class='chip'>DC0001 Scheduled Job Creation</span><span class='chip'>WinEventLog:Security 4688</span><span class='chip'>Sysmon EventCode 3 and 22</span><span class='chip'>auditd SYSCALL execve</span><span class='chip'>macOS unified log</span><span class='chip'>cron / launchd</span></div><div class='kw-theme'>Analytics and detection logic</div><div class='chips'><span class='chip'>AN1113 / AN1114 / AN1115</span><span class='chip'>periodicity</span><span class='chip'>process + network correlation</span></div><div class='kw-theme'>Tuning and mutable elements</div><div class='chips'><span class='chip'>mutable elements</span><span class='chip'>TimeWindow</span><span class='chip'>DestinationIP</span></div><div class='kw-theme'>False positives and baselines</div><div class='chips'><span class='chip'>false positives from approved destinations</span><span class='chip'>trusted-destination allowlisting</span></div><div class='kw-theme'>Real-world procedures and threat actors</div><div class='chips'><span class='chip'>Kimsuky — 10-minute exfil script (T1020 procedure)</span></div><div class='kw-theme'>Coverage gaps and compensating detections</div><div class='chips'><span class='chip'>collection gaps = blind spots</span></div>\n</div>\n<div class=\"card\">\n  <h2>How this exam works</h2>\n  <ul class=\"rules\">\n      <li class=\"r-pass\"><b>Pass mark: 70%.</b> Your score is computed only over exercises you actually answered.\n        PASS means you showed solid control of this severity. FAIL means you should read the explanations and retake.</li>\n      <li class=\"r-info\"><b>Exercise types in this file:</b> multiple choice, matching, drag-and-drop, fill-in-the-blank, ordering.</li>\n      <li class=\"r-timer\"><b>Timer:</b> you have <b>30 minutes</b> (estimated effort: about 30 minutes).\n        The timer has two kinds of pause. The <b>Pause button</b> is a manual break: the exercise hides and the timer stops.\n        Pressing <b>Check</b> also stops the timer automatically so you can read the feedback for as long as you want —\n        it resumes only when you press <b>Next</b> (or Final Submit on the last exercise). Skipping and hints never pause the timer.</li>\n      <li class=\"r-part\"><b>Partial credit:</b> exercises with several correct items give <b>partial credit</b>:\n        credit = max(0, (right − wrong) / total items). Selecting everything “to be safe” gives zero.\n        One hint per exercise costs −0.10 of that exercise's credit.</li>\n      <li class=\"r-skip\"><b>Skip:</b> you can skip any exercise and return to skipped ones before you finish.\n        Skipped-and-never-answered exercises are simply excluded from the score. The exam ends with a\n        “Review skipped exercises” screen while the timer is still running.</li>\n    \n  </ul>\n  <div style=\"margin-top:16px\"><button class=\"btn primary\" id=\"btnStart\" style=\"min-width:180px\">▶ Start the exam</button></div>\n</div>\n"};
var EX = [{"id": "e01", "type": "qcm", "theme": "The detection object and ATT&CK position", "title": "What DET0397 watches for", "collapsedSummary": "Intro ticket: what does DET0397 watch for?", "scenario": "You start as a junior SOC analyst. Your team lead sends you a short message: “Read our new analytic card. It is called DET0397, the Automated Exfiltration Detection Strategy from MITRE ATT&CK. Tell me what it watches for.”", "question": "What does DET0397 watch for?", "options": [{"id": "a", "text": "Data that malware sends out by itself, again and again"}, {"id": "b", "text": "Passwords typed on the login screen"}, {"id": "c", "text": "Antivirus software being switched off"}, {"id": "d", "text": "Phishing emails arriving in the mail gateway"}], "correct": ["a"], "explanation": "DET0397 is the detection strategy for T1020 — Automated Exfiltration. “Exfiltration” means data leaving your network without permission. “Automated” means the malware does it by itself, on a loop, with no human typing anything. The other answers are real attack behaviours too, but they belong to other ATT&CK techniques, not to this detection.", "study": "The ATT&CK page for T1020 (Automated Exfiltration) and its Detection Strategy DET0397.", "hint": "The name has two parts: “automated” (the tool works alone) and “exfiltration” (data leaves)."}, {"id": "e02", "type": "qcm", "theme": "The detection object and ATT&CK position", "title": "Which tactic T1020 belongs to", "collapsedSummary": "Matrix excerpt: find the tactic column for T1020.", "artefacts": [{"label": "ATT&CK matrix excerpt", "pre": "Enterprise Matrix (excerpt)\n  Collection ............ T1074 Data Staged\n  Command and Control ... T1071 Application Layer Protocol\n  Exfiltration .......... T1020 Automated Exfiltration\n                          T1029 Scheduled Transfer\n  Impact ................ T1486 Data Encrypted for Impact"}], "question": "Look at the tactic column that holds T1020. Which tactic is it?", "options": [{"id": "a", "text": "Collection"}, {"id": "b", "text": "Command and Control"}, {"id": "c", "text": "Exfiltration"}, {"id": "d", "text": "Impact"}], "correct": ["c"], "explanation": "T1020 lives in the Exfiltration tactic. A tactic is the attacker's goal. Here the goal is clear: stolen data must leave the network. Collection happens earlier (gathering the files). Command and Control is about talking to the attacker's server. Impact is about damaging you. When data leaves, the goal is Exfiltration.", "study": "The ATT&CK tactic “TA0010 Exfiltration” and where T1020 sits inside it.", "hint": "Ask yourself: what is the attacker's goal when data leaves the network?"}, {"id": "e03", "type": "match", "theme": "Analytics and detection logic", "title": "The three analytics and their platforms", "collapsedSummary": "Match each analytic (AN1113/1114/1115) to its operating system.", "scenario": "DET0397 has three analytics, one per operating system. Your detection engineer taped three cards on the wall with the analytic IDs. Match each analytic to the operating system it watches.", "question": "Match each analytic to its platform.", "left": [{"id": "l1", "text": "AN1113"}, {"id": "l2", "text": "AN1114"}, {"id": "l3", "text": "AN1115"}], "right": [{"id": "r1", "text": "Windows", "short": "Windows"}, {"id": "r2", "text": "Linux", "short": "Linux"}, {"id": "r3", "text": "macOS", "short": "macOS"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3"}, "explanation": "AN1113 is the Windows analytic. It reads Windows event logs. AN1114 is the Linux analytic; it reads auditd and network flow data. AN1115 is the macOS analytic; it reads the macOS unified log and launchd/cron records. One behaviour, three platforms — that is why the strategy has three analytics.", "study": "The Analytics table on the DET0397 page: one analytic per platform.", "hint": "Count them in order: Windows first, then Linux, then macOS."}, {"id": "e04", "type": "qcm", "theme": "Data sources and telemetry", "title": "Windows process creation event", "collapsedSummary": "One Windows Security log line — which event ID is it?", "artefacts": [{"label": "ARTEFACT 1 — WinEventLog:Security (one line)", "pre": "2026-05-11 03:04:59  EventCode=4688  NewProcessName=C:\\Windows\\System32\\schtasks.exe  TokenElevationType=%%1936  ProcessCreationTime=2026-05-11T03:04:59"}], "question": "AN1113 needs “process creation” events from the Windows Security log. Which EventCode in this line is the process creation event?", "options": [{"id": "a", "text": "EventCode 4688"}, {"id": "b", "text": "EventCode 4624"}, {"id": "c", "text": "EventCode 7045"}, {"id": "d", "text": "EventCode 1102"}], "correct": ["a"], "explanation": "Windows writes EventCode 4688 every time a new process starts, when process auditing is on. AN1113 uses these events to see that a program (for example schtasks.exe starting a task) exists. 4624 is a logon, 7045 is a new service install, and 1102 is the audit log being cleared. They are useful logs, but they are not process creation.", "study": "Windows Security event 4688 (process creation), a data source behind DC0032.", "hint": "Look at the field called EventCode in the artefact, then match the number to “a process started”."}, {"id": "e05", "type": "dnd", "theme": "Data sources and telemetry", "title": "Sysmon event 3 vs event 22", "collapsedSummary": "Two Sysmon event cards to their meanings.", "scenario": "AN1113 also reads the Sysmon log. Sysmon writes numbered events. Two of them matter here: EventCode 3 and EventCode 22. Drag each event card to the sentence that describes it.", "question": "Place each Sysmon event under the correct meaning.", "bank": ["EventCode 3", "EventCode 22"], "slots": [{"id": "s1", "label": "A program opens a network connection →"}, {"id": "s2", "label": "A program asks a DNS name (like evil[.]example) →"}], "solution": {"s1": "EventCode 3", "s2": "EventCode 22"}, "explanation": "Sysmon EventCode 3 is “Network connection”: a process opened a TCP or UDP connection, and the log shows the destination IP and port. Sysmon EventCode 22 is “DNS query”: a process resolved a name. AN1113 can use both (the DET0397 page lists EventCode=3, 22 under Network Connection Creation). A DNS query often happens just before the connection.", "study": "Sysmon EventCode 3 (network connection) and 22 (DNS query) under DC0082 Network Connection Creation.", "hint": "One event is about talking to an address; the other is about looking up a name first."}, {"id": "e06", "type": "fib", "theme": "Data sources and telemetry", "title": "The Linux program-start source", "collapsedSummary": "Fill the missing log source for Linux program starts.", "scenario": "On Linux, AN1114 needs to know when a background script starts running. The DET0397 page names the log source. Complete the sentence with the missing word.", "question": "Fill the blank with the correct log source.", "sentence": "On Linux, AN1114 reads {b0} :SYSCALL events with the call execve to see that a program started.", "blanks": [{"id": "b0"}], "distractors": ["sysmon", "firewalld", "cron"], "explanation": "auditd is the Linux audit daemon. When a program runs, auditd can log a SYSCALL event for execve (the system call that starts a program). AN1114 uses these events as the “process creation” half of the correlation. Sysmon does not run on Linux here, firewalld is a firewall, and cron is the scheduler — useful, but it is not the SYSCALL source named in DET0397.", "study": "auditd SYSCALL execve logging as the Linux Process Creation source (DC0032).", "hint": "It is the Linux audit daemon — its name starts with “audit”.", "sentenceHtml": "On Linux, AN1114 reads <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> :SYSCALL events with the call execve to see that a program started.", "solution": {"b0": "auditd"}, "bank": ["auditd", "sysmon", "firewalld", "cron"]}, {"id": "e07", "type": "dnd", "theme": "Data sources and telemetry", "title": "The three ATT&CK data components", "collapsedSummary": "Drag each data component to what it records.", "scenario": "ATT&CK groups raw events into “data components”. DET0397 uses three of them. Drag each component name to the sentence that describes what it records.", "question": "Place each data component under its meaning.", "bank": ["DC0032 Process Creation", "DC0082 Network Connection Creation", "DC0001 Scheduled Job Creation"], "slots": [{"id": "s1", "label": "A new program starts running →"}, {"id": "s2", "label": "A program opens a connection to another system →"}, {"id": "s3", "label": "A new scheduled task, cron job or launchd job is registered →"}], "solution": {"s1": "DC0032 Process Creation", "s2": "DC0082 Network Connection Creation", "s3": "DC0001 Scheduled Job Creation"}, "explanation": "DC0032 (Process Creation) is the “something started” event. DC0082 (Network Connection Creation) is the “something talked out” event. DC0001 (Scheduled Job Creation) is the “a repeatable job was registered” event — AN1115 uses it for macOS cron/launchd. AN1113 and AN1114 correlate the first two; AN1115 also reads the third. Data components are the bridge between raw logs and analytics.", "study": "ATT&CK data components DC0032, DC0082 and DC0001 on the DET0397 page.", "hint": "Match the words: process = program starts; network = connection; scheduled job = timer registered."}, {"id": "e08", "type": "qcm", "theme": "Analytics and detection logic", "title": "Once, or many times?", "collapsedSummary": "Does AN1113 care about one upload or a repeating pattern?", "scenario": "Two things happened on WKS-ACC-07 today:\n• At 14:10, the browser uploaded one file to a personal cloud drive. One single upload.\n• Between 09:00 and 11:00, a small backup script sent data to the same outside server every 5 minutes.", "question": "Which one matches what AN1113 looks for?", "options": [{"id": "a", "text": "The one single browser upload at 14:10"}, {"id": "b", "text": "The script that sent data every 5 minutes"}, {"id": "c", "text": "Both match exactly the same way"}, {"id": "d", "text": "Neither one can ever match"}], "correct": ["b"], "explanation": "AN1113 looks for a repeating pattern: a tool or script that sends data out again and again inside a time window (for example every 5 minutes). That is the “automated” part of automated exfiltration. A single upload may still be a policy problem, but it is not the repeating behaviour this analytic was built to catch.", "study": "The AN1113 description: “periodically transmitting data… using scheduled tasks or background processes”.", "hint": "The key word on the DET0397 page is “periodically”. Which action repeats?"}, {"id": "e09", "type": "fib", "theme": "Analytics and detection logic", "title": "The two halves of the correlation", "collapsedSummary": "Fill the two missing words in the correlation sentence.", "scenario": "Your mentor explains AN1113 with one sentence: the analytic needs two kinds of events, seen close together in time. Fill the two blanks with the right words.", "question": "Fill both blanks: name the two event families AN1113 joins.", "sentence": "AN1113 joins {b0} creation events (a program started) with {b1} connection creation events (the program talked out).", "blanks": [{"id": "b0"}, {"id": "b1"}], "distractors": ["printer", "keyboard"], "explanation": "The detection is a join of two event families: process creation (DC0032) and network connection creation (DC0082). The join answer is usually the process identity (like a PID or process name), and the time window keeps the two halves close together. “Process” and “network” are the two data components named by DET0397.", "study": "DC0032 + DC0082 correlation, the core pattern of AN1113 and AN1114.", "hint": "One half is a program starting; the other half is that program talking to the outside.", "sentenceHtml": "AN1113 joins <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> creation events (a program started) with <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> connection creation events (the program talked out).", "solution": {"b0": "process", "b1": "network"}, "bank": ["process", "network", "printer", "keyboard"]}, {"id": "e10", "type": "qcm", "theme": "Tuning and mutable elements", "title": "What is a mutable element?", "collapsedSummary": "Definition check: what does “mutable element” mean?", "scenario": "In a tuning meeting, the detection engineer says: “Each analytic lists its mutable elements. TimeWindow and DestinationIP are the mutable elements of AN1113.” A new colleague asks what the words mean.", "question": "What is a “mutable element” in an ATT&CK analytic?", "options": [{"id": "a", "text": "A setting that each SOC can tune for its own network"}, {"id": "b", "text": "A password the analytic needs to run"}, {"id": "c", "text": "The name of the log file on disk"}, {"id": "d", "text": "A tool the attacker uses to stay hidden"}], "correct": ["a"], "explanation": "“Mutable” means “changeable”. A mutable element is a part of the analytic logic that your team is expected to adjust — like a time window or a list of trusted destinations. ATT&CK publishes the logic; the mutable elements are the knobs. Every company tunes them to its own environment to lower false positives without losing true positives.", "study": "The “Mutable Elements” tables on the DET0397 page (TimeWindow, DestinationIP, and friends).", "hint": "The word “mutable” comes from “mutate” — to change. Who changes it, and why?"}, {"id": "e11", "type": "fib", "theme": "Tuning and mutable elements", "title": "What DestinationIP tuning does", "collapsedSummary": "Fill the missing word about the DestinationIP knob.", "scenario": "Your company's backup software talks every night to its vendor's cloud. The SOC does not want an alert for that. The detection engineer tunes the DestinationIP mutable element. Complete the sentence.", "question": "Fill the blank with the missing word.", "sentence": "DestinationIP can be tuned to filter out {b0} destinations so the analytic does not alert on them.", "blanks": [{"id": "b0"}], "distractors": ["malicious", "random", "external"], "explanation": "The DET0397 page says DestinationIP “can be tuned to filter known internal or trusted destinations”. You list destinations your business already trusts (like the backup vendor), and the analytic stops alerting on them. It does not block anything — it only shapes which events match. Malicious and random destinations must stay in scope, or you would blind the detection.", "study": "The DestinationIP mutable element of AN1113 and how allowlists reduce false positives.", "hint": "The knob removes noise. You only remove noise for destinations you already trust.", "sentenceHtml": "DestinationIP can be tuned to filter out <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> destinations so the analytic does not alert on them.", "solution": {"b0": "trusted"}, "bank": ["trusted", "malicious", "random", "external"]}, {"id": "e12", "type": "order", "theme": "Analytics and detection logic", "title": "First start, then talk", "collapsedSummary": "Order the two correlated events.", "scenario": "A scheduled task runs a small uploader. The analytic sees two events for the same process. Put them in the order they appear in time.", "question": "Order the two correlated events: which happens first?", "items": [{"id": "i1", "text": "Process creation: schtasks.exe starts the uploader (EventCode 4688)"}, {"id": "i2", "text": "Network connection: the uploader connects to 203[.]0[.]113[.]44:443 (Sysmon EventCode 3)"}], "order": ["i1", "i2"], "explanation": "A program must start before it can talk. So the process creation event comes first, and the network connection event follows. The analytic joins the two on the process identity inside the time window. In real logs the gap can be seconds — that is why the two sources must have correct, synchronised clocks.", "study": "Event ordering in correlations: process creation (DC0032) before network connection (DC0082).", "hint": "What must happen first: a program running, or that program making a connection?"}, {"id": "e13", "type": "fib", "theme": "Real-world procedures and threat actors", "title": "A real group using automated exfiltration", "collapsedSummary": "ATT&CK procedure excerpt — fill the two numbers and words.", "artefacts": [{"label": "ARTEFACT 1 — ATT&CK procedure example (excerpt, T1020)", "pre": "ID: G0094\nName: Kimsuky\nProcedure: Kimsuky has exfiltrated data to C2 servers using an automated script\nthat executes every 10 minutes and, after successful checks for the presence\nof pre-designated staged filenames, sends the files out."}], "question": "Fill the two blanks with the missing details from the excerpt.", "sentence": "Kimsuky's script repeats every {b0} minutes, and it sends files only after attacker-chosen {b1} filenames appear.", "blanks": [{"id": "b0"}, {"id": "b1"}], "distractors": ["sixty", "system"], "explanation": "This is a real T1020 procedure from the ATT&CK page: an automated script, a fixed repeat time (every 10 minutes), and a check for staged files before sending. It is exactly the behaviour AN1113-style logic is built to catch: repeats inside a time window, tied to a background process. Real groups use this technique, which is why defenders build this detection.", "study": "The Procedure Examples table on the T1020 page (for example G0094 Kimsuky, S0090 Rover).", "hint": "One blank is a number from the excerpt; the other describes files waiting in a folder before the send.", "sentenceHtml": "Kimsuky's script repeats every <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> minutes, and it sends files only after attacker-chosen <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> filenames appear.", "solution": {"b0": "ten", "b1": "staged"}, "bank": ["ten", "staged", "sixty", "system"]}, {"id": "e14", "type": "match", "theme": "Data sources and telemetry", "title": "The macOS sources of AN1115", "collapsedSummary": "Match each macOS source to what it records.", "scenario": "AN1115 watches macOS. It reads three kinds of records. Match each record source to what it tells you.", "question": "Match each macOS source to its meaning.", "left": [{"id": "l1", "text": "macos:unifiedlog — process: exec"}, {"id": "l2", "text": "macos:unifiedlog — network"}, {"id": "l3", "text": "macos:cron / launchd"}], "right": [{"id": "r1", "text": "A program started", "short": "a program started"}, {"id": "r2", "text": "A program made a connection", "short": "a connection was made"}, {"id": "r3", "text": "A scheduled job exists or was created", "short": "a scheduled job"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3"}, "explanation": "The macOS unified log records process executions (process: exec) and network activity. The cron and launchd records cover scheduled jobs — LaunchAgents and LaunchDaemons are the macOS way of running things on a timer. AN1115 combines all three to see: a scheduled job exists, its program runs, and that program connects outside, again and again.", "study": "The three macOS log sources listed under AN1115 (unified log + cron/launchd, DC0032, DC0082, DC0001).", "hint": "Think of the same two halves as Windows — start and connect — plus the scheduler."}, {"id": "e15", "type": "dnd", "theme": "Tuning and mutable elements", "title": "The two knobs of AN1113", "collapsedSummary": "Drag each knob to the effect it has.", "scenario": "AN1113 has exactly two mutable elements. Drag each one to the sentence that describes what it changes.", "question": "Place each mutable element under its effect.", "bank": ["TimeWindow", "DestinationIP"], "slots": [{"id": "s1", "label": "How long the analytic groups repeated activity (for example every 5 minutes) →"}, {"id": "s2", "label": "Which destination addresses are ignored because they are trusted →"}], "solution": {"s1": "TimeWindow", "s2": "DestinationIP"}, "explanation": "TimeWindow is the time bucket: the analytic looks for repeats of the behaviour inside this window, for example one connection every 5 minutes. DestinationIP is the scope filter: it removes trusted destinations from the match. One knob changes “when”, the other changes “where”. Tuning them is the everyday job of a detection engineer.", "study": "The two mutable elements of AN1113: TimeWindow and DestinationIP.", "hint": "One knob is about time; the other is about addresses."}, {"id": "e16", "type": "fib", "theme": "Coverage gaps and compensating detections", "title": "The Mac that sends no logs", "collapsedSummary": "Coverage check: the Mac that sends no logs.", "scenario": "A design-team Mac is infected with an uploader. But this Mac was never onboarded: it sends no unified-log records to the SIEM. Your teammate asks: “Does AN1115 catch this Mac?” Complete the rule-of-thumb sentence.", "question": "Fill the blank with the missing log source.", "sentence": "AN1115 can only see a Mac's periodic uploads if the Mac sends {b0} records — a computer that sends no logs is a blind spot.", "blanks": [{"id": "b0"}], "distractors": ["registry", "firewall log"], "explanation": "A detection can only read logs it receives. AN1115 reads the macOS unified log (process execs and network activity) plus cron/launchd records. If a Mac sends none of them, the analytic is blind — no tuning can fix a missing log source. The fix is onboarding: enable unified-log collection, and the coverage gap closes. “No logs, no detection” is the first coverage rule.", "study": "Coverage depends on collection: AN1115 is blind on any Mac without unified-log onboarding.", "hint": "It is the same macOS source you matched earlier — the one that records program starts and network activity.", "sentenceHtml": "AN1115 can only see a Mac's periodic uploads if the Mac sends <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> records — a computer that sends no logs is a blind spot.", "solution": {"b0": "unified log"}, "bank": ["unified log", "registry", "firewall log"]}];

function $(s){return document.querySelector(s)}
function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){s=Math.max(0,s|0);var m=(s/60)|0,r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1)}

/* ===== scoring engine (partial credit) ===== */
function scoreExercise(sel, correct){
  var N=correct.length||1,H=0,W=0,i;
  for(i=0;i<sel.length;i++){ if(correct.indexOf(sel[i])>=0){H++;} else {W++;} }
  return Math.max(0,(H-W)/N);
}

/* ===== state ===== */
var S=null, TID=null, PROFILE={username:'',country:'',locale:'en'};
function startTicker(){ if(TID)clearInterval(TID); TID=setInterval(tTick,1000); }
var EXBYID={}; EX.forEach(function(e){EXBYID[e.id]=e});

function newAttempt(){
  S={order:shuffle(EX.map(function(e,i){return i})),pos:0,status:{},credit:{},hintUsed:{},
     cur:null,fromReview:false,tState:'RUNNING',left:TIMER_BUDGET,started:false,
     pauseAcc:{manual:0,auto:0},reported:false,finished:false,ans:{}};
  EX.forEach(prepEx);
}
/* per-attempt shuffle of option lists, word banks, match columns, order rows */
function prepEx(ex){
  if(ex.options) ex._opts=shuffle(ex.options);
  if(ex.sub&&ex.sub.options) ex.sub._opts=shuffle(ex.sub.options);
  if(ex.left) ex._left=ex.left.slice();
  if(ex.right) ex._right=shuffle(ex.right).map(function(r){return {id:r.id,text:r.text,short:(r.short||r.text)}});
  if(ex.bank) ex._bank=shuffle(ex.bank);
  if(ex.items) ex._items=shuffle(ex.items);
}
var TIMER_BUDGET = META.timerSeconds;

/* ===== timer state machine ===== */
function tSet(state){
  if(S){ S.tState=state; }
  renderHeader();
}
function tTick(){
  if(!S||S.finished||!S.started) return;
  if(S.tState==='RUNNING'){
    if(S.tState==='RUNNING'){ S.left--;
      if(S.left<=0){S.left=0;S.tState='ENDED';renderHeader();onTimeEnd();return;}
    }
    renderHeader();
  } else if(S.tState==='PAUSED_MANUAL'){ S.pauseAcc.manual++; }
  else if(S.tState==='PAUSED_AUTO_CHECK'){ S.pauseAcc.auto++; }
}
function timerChip(){
  var cls=S.tState==='RUNNING'?'t-running':(S.tState==='PAUSED_MANUAL'?'t-manual':(S.tState==='PAUSED_AUTO_CHECK'?'t-auto':'t-ended'));
  var icon=S.tState==='RUNNING'?'\u25B6':(S.tState==='ENDED'?'\u23F1':'\u23F8');
  var word=S.tState==='RUNNING'?'RUNNING':(S.tState==='PAUSED_MANUAL'?'PAUSED \u2014 manual (press Resume)':(S.tState==='PAUSED_AUTO_CHECK'?'PAUSED \u2014 reviewing feedback (resumes on Next)':'ENDED'));
  return '<span class="hchip '+cls+'" role="status" aria-label="Timer '+esc(word)+'"><span aria-hidden="true">'+icon+'</span><span class="mono" id="tval">'+fmtTime(S.left)+'</span><span class="tword">'+esc(word)+'</span></span>';
}

/* ===== views ===== */
function showView(id){
  $all('.view').forEach(function(v){v.classList.remove('active')});
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ===== header ===== */
function sevBadge(){
  return '<span class="badge '+META.difficulty+'" role="img" aria-label="Severity '+esc(META.sevName)+'">'+esc(META.sevName)+'</span>';
}
function answeredStats(){
  var ids=Object.keys(S.status).filter(function(k){return S.status[k]==='answered'});
  var sum=0; ids.forEach(function(k){sum+=S.credit[k]});
  return {count:ids.length,sum:sum,ids:ids};
}
function renderHeader(){
  var h='';
  var total=S.order.length;
  var done=Object.keys(S.status).length;
  var st=answeredStats();
  var label=S.cur?(S.status[S.cur.id]==='answered'?'Progress '+done+' / '+total:('Exercise '+Math.min(done+1,total)+' of '+total)):('Progress '+done+' / '+total);
  h+='<div class="hchip"><b>'+esc(label)+'</b></div>';
  h+=sevBadge();
  h+='<div class="grow"></div>';
  h+=timerChip();
  h+='<span class="hchip" aria-label="Live score"><span aria-hidden="true">\u2605</span> Score <b class="mono">'+fmt1(st.sum)+' / '+st.count+'</b>'+(st.count>0?' <b class="mono">('+Math.round(st.sum/st.count*100)+'%)</b>':'')+'</span>';
  h+='<button class="hbtn" id="btnHint" aria-label="Hint (costs 10 percent of this exercise)">\uD83D\uDCA1 Hint</button>';
  h+='<button class="hbtn" id="btnSkip" aria-label="Skip this exercise">\u26A0 Skip</button>';
  h+='<button class="hbtn" id="btnPause" aria-label="Pause timer and hide exercise"'+(S.finished?' disabled':'')+'>\u23F8 Pause</button>';
  $('#topbar').innerHTML=h;
  var pb=$('#pbar-i'); if(pb) pb.style.width=(total?(done/total*100):0)+'%';
  $('#btnHint').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered'||S.hintUsed[S.cur.id];
  $('#btnSkip').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered';
  $('#btnHint').onclick=function(){doHint()};
  $('#btnSkip').onclick=function(){doSkip()};
  $('#btnPause').onclick=function(){doManualPause()};
}

/* ===== intro ===== */
function renderIntro(){
  $('#intro-body').innerHTML=INTRO.html;
  $('#btnStart').onclick=function(){

}

/* ===== exercise rendering ===== */
function curEx(){return S.order[S.pos]!==undefined?EX[S.order[S.pos]]:null}

function goToPos(pos,fromReview){
  S.pos=pos; S.cur=curEx(); S.fromReview=!!fromReview;
  if(!S.cur){finishFlow();return;}
  if(S.tState==='ENDED'){/* timer over: nothing to answer */}
  renderExercise();
  renderHeader();
}
function scenHTML(ex){
  var arts=ex.artefacts||[];
  var body='';
  if(ex.scenario) body+='<div class="scenario-text scenario-hideable">'+esc(ex.scenario)+'</div>';
  arts.forEach(function(a,i){
    var lbl=(a.label&&/^ARTEFACT/i.test(a.label))?a.label:('ARTEFACT '+(i+1)+' \u2014 '+(a.label||'evidence'));
    body+='<div class="artefact scenario-hideable"><div class="a-label">'+esc(lbl)+'</div><div class="a-body">';
    if(a.logs){ body+=logPanel(a.logs,a.filter!==false); }
    else if(a.pre){ body+='<pre class="log-line" style="max-height:260px;overflow:auto">'+hlBlock(a.pre)+'</pre>'; }
    else { body+='<div class="scenario-text">'+esc(a.text)+'</div>'; }
    body+='</div></div>';
  });
  var sum=ex.collapsedSummary||'Scenario collapsed \u2014 expand to re-read';
  return '<div class="block b-scenario" id="scenBlock">'+
    '<div class="block-h"><span aria-hidden="true">\u25A4</span> SCENARIO <span class="sp"></span>'+
    '<button class="collapse-btn" id="btnCollapse" aria-label="Collapse or expand scenario">Collapse \u25BE</button></div>'+
    '<div class="scen-summary">'+esc(sum)+'</div>'+
    '<div class="block-body">'+body+'</div></div>';
}
function blockQ(ex){

    '<div class="block-body"><p class="qtext">'+esc(ex.question)+'</p>'+(ex.qnote?'<p class="muted" style="color:var(--text-secondary);font-size:.92rem;margin:6px 0 0">'+esc(ex.qnote)+'</p>':'')+'</div></div>';
}

  renderWidget(ex);
  wireLogFilter();

  chk.onclick=function(){doCheck()};

    /* returning view of answered exercise not possible in flow; guarded */
  }

function setAnswerReady(ok){var b=$('#btnCheck');if(b)b.disabled=!ok}

/* ---- widget: qcm / multi ---- */
function wChoice(ex,mode){
  var multi=mode==='multi';
  var opts=ex._opts||ex.options||[];
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">'+(multi?'Select all options that apply. Partial credit applies.':'Choose the one best option.')+'</p><div class="opts">';
  opts.forEach(function(o,i){
    html+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="false"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
  });
  html+='</div>';
  $('#ansbody').innerHTML=html;
  var sel=[];
  $all('#ansbody .opt').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      if(multi){
        var k=sel.indexOf(id);
        if(k>=0){sel.splice(k,1);b.classList.remove('sel');b.setAttribute('aria-checked','false');}
        else{sel.push(id);b.classList.add('sel');b.setAttribute('aria-checked','true');}
      }else{
        sel=[id];
        $all('#ansbody .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
      }
      setAnswerReady(sel.length>0);
    };
  });
  return {collect:function(){return sel.slice()}};
}

/* ---- widget: match ---- */
function wMatch(ex){
  var lefts=ex._left,rights=ex._right;
  var pairs={}; var pickedL=null;
  function letter(i){return String.fromCharCode(65+i)}
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick one item on the left, then its partner on the right. Click a paired left item again to clear it.</p>'+
    '<div class="matchwrap"><div class="mcol"><div class="mhead">Items</div>';
  lefts.forEach(function(l,i){
    html+='<button type="button" class="mitem left" data-side="L" data-id="'+esc(l.id)+'"><span class="ol">'+letter(i)+'.</span><span>'+esc(l.text)+'</span><span class="pairtag" aria-hidden="true"></span></button>';
  });
  html+='</div><div class="mcol"><div class="mhead">Destinations / matches</div>';
  rights.forEach(function(r){
    html+='<button type="button" class="mitem right" data-side="R" data-id="'+esc(r.id)+'"><span>'+esc(r.text)+'</span></button>';
  });
  html+='</div></div>';
  $('#ansbody').innerHTML=html;
  function refresh(){
    var complete=true;
    $all('#ansbody .mitem.left').forEach(function(b){
      var id=b.getAttribute('data-id');
      var tag=b.querySelector('.pairtag');
      if(pairs[id]){tag.textContent='\u2192 '+rights.filter(function(r){return r.id===pairs[id]})[0].short;complete=false;}
      else{tag.textContent='';complete=false;}
    });
    var leftCount=$all('#ansbody .mitem.left').length;
    var paired=Object.keys(pairs).length;
    setAnswerReady(paired===leftCount);
  }
  $all('#ansbody .mitem').forEach(function(b){
    b.onclick=function(){
      var side=b.getAttribute('data-side'),id=b.getAttribute('data-id');
      if(side==='L'){
        if(pairs[id]){delete pairs[id];b.classList.remove('picked');refresh();return;}
        pickedL=id;
        $all('#ansbody .mitem.left').forEach(function(x){x.classList.remove('picked')});
        b.classList.add('picked');
      }else{
        if(!pickedL)return;
        pairs[pickedL]=id;
        $all('#ansbody .mitem.left').forEach(function(x){if(x.getAttribute('data-id')===pickedL)x.classList.remove('picked')});
        pickedL=null;refresh();
      }
    };
  });
  refresh();setAnswerReady(false);
  return {collect:function(){return Object.keys(pairs).map(function(l){return l+'>'+pairs[l]})},pairs:pairs};
}

/* ---- widget: dnd (bank -> slots) ---- */
function wDnD(ex){
  var bank=ex._bank.slice(), placed={}, picked=null, dragId=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Drag each item into the right slot (or pick an item, then pick a slot).</p>'+
    '<div class="bank" id="bank"></div><div class="slots" id="slots"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" draggable="true" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bank').innerHTML=bh;
    var sh='';
    ex.slots.forEach(function(s){
      var v=placed[s.id];
      sh+='<div class="slot" data-s="'+esc(s.id)+'" role="button" tabindex="0" aria-label="Slot: '+esc(s.label)+'"><span class="s-label">'+esc(s.label)+'</span>'+(v?'<span class="s-val">'+esc(v)+'</span>':'<span class="s-fill">drop here</span>')+'</div>';
    });
    $('#slots').innerHTML=sh;
    wire();
  }
  function place(w,sid){
    Object.keys(placed).forEach(function(k){if(placed[k]===w)delete placed[k]});
    placed[sid]=w;picked=null;draw();
    setAnswerReady(Object.keys(placed).length===ex.slots.length);
  }
  function wire(){
    $all('#bank .bitem').forEach(function(b){
      b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};
      b.ondragstart=function(ev){dragId=b.getAttribute('data-w');b.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}};
      b.ondragend=function(){b.classList.remove('dragging')};
    });
    $all('#slots .slot').forEach(function(s){
      var sid=s.getAttribute('data-s');
      s.onclick=function(){if(picked)place(picked,sid);};
      s.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&picked){ev.preventDefault();place(picked,sid);}};
      s.ondragover=function(ev){ev.preventDefault();s.classList.add('over')};
      s.ondragleave=function(){s.classList.remove('over')};
      s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var w=dragId||ev.dataTransfer.getData('text/plain');if(w)place(w,sid);};
    });
  }
  draw();setAnswerReady(false);
  return {collect:function(){return ex.slots.map(function(s){var v=placed[s.id];return v?(s.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: fib ---- */
function wFib(ex){
  var blanks=ex.blanks; /* [{id,label}] */
  var bank=ex._bank.slice(), placed={}, picked=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick a word from the bank, then pick a blank. Click a filled blank to clear it.</p>'+
    '<div class="blankline" id="bl-line">'+ex.sentenceHtml+'</div><div class="bank" id="bl-bank"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bl-bank').innerHTML=bh;
    $all('#bl-bank .bitem').forEach(function(b){b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};});
    $all('#ansbody .blank').forEach(function(b){
      var id=b.getAttribute('data-id');
      if(placed[id]){b.textContent=placed[id];b.classList.remove('empty');}
      else{b.textContent='blank '+id.replace('b','');b.classList.add('empty');}
      b.onclick=function(){
        if(placed[id]){delete placed[id];draw();refresh();return;}
        if(picked){placed[id]=picked;picked=null;draw();refresh();}
      };
      b.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.onclick();}};
    });
  }
  function refresh(){setAnswerReady(Object.keys(placed).length===blanks.length);}
  draw();refresh();setAnswerReady(false);
  return {collect:function(){return blanks.map(function(b){var v=placed[b.id];return v?(b.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: order / rank ---- */
function wOrder(ex){
  var items=ex._items.slice(); /* current order of {id,text} */
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Put the items in the right order: use the arrows or drag rows.</p><div class="ordlist" id="ord"></div>';
  $('#ansbody').innerHTML=html;
  var dragIdx=null;
  function draw(){
    var h='';items.forEach(function(it,i){
      h+='<div class="orditem" draggable="true" data-i="'+i+'"><span class="pos">'+(i+1)+'.</span><button class="move" data-d="-1" data-i="'+i+'" aria-label="Move up">\u25B2</button><button class="move" data-d="1" data-i="'+i+'" aria-label="Move down">\u25BC</button><span>'+esc(it.text)+'</span><span class="handle" aria-hidden="true">\u2261</span></div>';
    });
    $('#ord').innerHTML=h;wire();setAnswerReady(items.length===ex._items.length);
  }
  function move(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;draw();}
  function wire(){
    $all('#ord .move').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();move(parseInt(b.getAttribute('data-i'),10),parseInt(b.getAttribute('data-d'),10));};});
    $all('#ord .orditem').forEach(function(row){
      row.ondragstart=function(ev){dragIdx=parseInt(row.getAttribute('data-i'),10);try{ev.dataTransfer.setData('text/plain','x')}catch(e){}};
      row.ondragover=function(ev){ev.preventDefault();row.style.borderColor='var(--accent-green)'};
      row.ondragleave=function(){row.style.borderColor=''};
      row.ondrop=function(ev){ev.preventDefault();row.style.borderColor='';var to=parseInt(row.getAttribute('data-i'),10);if(dragIdx===null||isNaN(to))return;var it=items.splice(dragIdx,1)[0];items.splice(to,0,it);dragIdx=null;draw();};
    });
  }
  draw();
  return {collect:function(){return items.map(function(it){return it.id})}};
}

/* ---- widget: branch ---- */
function wBranch(ex){
  var steps=ex.steps,i=0,choices=[];
  $('#ansbody').innerHTML='<div id="br-log"></div><div id="br-cur"></div>';
  function drawStep(){
    if(i>=steps.length){
      $('#br-cur').innerHTML='<div class="stepdone"><b>All '+steps.length+' steps recorded.</b> Press Check to grade the whole chain.</div>';
      setAnswerReady(true);return;
    }
    var st=steps[i];
    var h='<span class="stepchip">STEP '+(i+1)+' OF '+steps.length+'</span>';
    if(st.context)h+='<p class="stepctx">'+esc(st.context)+'</p>';
    h+='<div class="opts">';
    st.options.forEach(function(o,j){
      h+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="radio" aria-checked="false"><span class="ol">'+String.fromCharCode(65+j)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
    });
    h+='</div><div style="margin-top:10px"><button class="btn" id="br-next" disabled>\u2192 Confirm step '+(i+1)+'</button></div>';
    $('#br-cur').innerHTML=h;
    var pick=null;
    $all('#br-cur .opt').forEach(function(b){
      b.onclick=function(){pick=b.getAttribute('data-id');
        $all('#br-cur .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
        var nx=$('#br-next');if(nx)nx.disabled=false;};
    });
    $('#br-next').onclick=function(){
      if(i>=steps.length||pick===null)return;
      choices.push(pick);
      $('#br-log').insertAdjacentHTML('beforeend','<div class="stepdone"><b>Step '+(i+1)+' recorded.</b> '+esc(steps[i].ack||'Answer noted. The timer keeps running.')+'</div>');
      i++;drawStep();
    };
    setAnswerReady(false);
  }
  drawStep();
  return {collect:function(){return choices.slice()}};
}

/* ---- widget: term (query editor) ---- */
function wTerm(ex){
  var html='<div class="term"><div class="scroller" id="tm-out"><div class="tline"><span class="prompt">'+esc(ex.prompt||'query&gt;')+'</span> '+esc(ex.banner||'Type your query, then press Run.')+'</div></div>'+
    '<div class="trow"><span class="prompt" aria-hidden="true">'+esc(ex.prompt||'query&gt;')+'</span>'+
    '<input id="tm-in" type="text" autocomplete="off" spellcheck="false" aria-label="Query input" placeholder="'+esc(ex.placeholder||'')+'">'+
    '<button class="btn run" id="tm-run" aria-label="Run query">\u25B6 Run</button></div></div>'+
    (ex.syntaxNote?'<p class="kv" style="margin-top:8px">'+esc(ex.syntaxNote)+'</p>':'');
  $('#ansbody').innerHTML=html;
  var val='';
  $('#tm-in').addEventListener('input',function(){val=this.value;setAnswerReady(val.trim().length>0)});
  $('#tm-in').addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();$('#tm-run').click();}});
  $('#tm-run').onclick=function(){
    var v=$('#tm-in').value;
    $('#tm-out').insertAdjacentHTML('beforeend','<div class="tline"><span class="prompt">'+esc(ex.prompt||'query&gt;')+'</span> '+esc(v)+'</div>');
    $('#tm-out').insertAdjacentHTML('beforeend','<div class="tline" style="color:var(--text-secondary)">'+esc(ex.echo||'[simulated] query accepted for grading \u2014 press Check')+'</div>');
    var sc=$('#tm-out').parentNode.querySelector('.scroller');sc.scrollTop=sc.scrollHeight;
    setAnswerReady($('#tm-in').value.trim().length>0);
  };
  return {collect:function(){return [$('#tm-in').value.trim()]},raw:function(){return $('#tm-in').value}};
}

/* ===== render dispatch ===== */
function renderWidget(ex){
  var w=null;
  if(ex.type==='qcm'){w=wChoice(ex,'qcm');}
  else if(ex.type==='multi'){w=wChoice(ex,'multi');}
  else if(ex.type==='match'){w=wMatch(ex);}
  else if(ex.type==='dnd'){w=wDnD(ex);}
  else if(ex.type==='fib'){w=wFib(ex);}
  else if(ex.type==='order'||ex.type==='rank'){w=wOrder(ex);}
  else if(ex.type==='logs'){w=wLogs(ex);}
  else if(ex.type==='branch'){w=wBranch(ex);}
  else if(ex.type==='term'){w=wTerm(ex);}
  S._w=w;
}

/* ===== log rendering + highlighting ===== */
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlLine(line){
  var e=esc(line);
  var re=/(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}\b)|([A-Za-z_][\w.]*)(=)(&quot;.*?&quot;|"[^"]*"|\S+)|(&quot;[^&]*&quot;|"[^"]*")|(?:^|\s)((?:[A-Z]:\\|\/(?:usr|etc|var|opt|home|tmp)\/)[^\s"]+)/g;
  var out='',last=0,m;
  function span(cls,txt){return '<span class="'+cls+'">'+txt+'</span>'}
  while((m=re.exec(e))!==null){
    out+=e.slice(last,m.index);
    if(m[1]){out+=span('tk-ts',m[1]);}
    else if(m[2]){out+=span('tk-ip',m[2]);}
    else if(m[3]){out+=span('tk-key',m[3])+'='+span(/^(EventCode|EventID|eventid|id|ID)$/.test(m[3])?'tk-str':'tk-val',m[5]);}
    else if(m[6]){out+=span('tk-str',m[6]);}
    else if(m[7]){out+=span('tk-path',m[7]);}
    last=re.lastIndex;
  }
  out+=e.slice(last);
  return out;
}
function hlBlock(text){
  return String(text).split('\n').map(function(l){return hlLine(l)}).join('\n');
}
function logPanel(lines,withFilter){
  var h='<div class="logpanel">';
  if(withFilter){
    h+='<div class="logtools"><input type="text" id="logfilter" placeholder="Filter lines (e.g. 4688, an IP, a user)" aria-label="Filter log lines"><span class="cnt" id="logcnt"></span></div>';
  }
  h+='<pre class="loglines" id="loglines">';
  lines.forEach(function(l){h+='<code class="log-line" data-raw="'+esc(l)+'">'+hlLine(l)+'</code>'});
  h+='</pre></div>';
  return h;
}
function wireLogFilter(){
  var inp=$('#logfilter');if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),shown=0,all=0;
    $all('#loglines .log-line').forEach(function(c){
      all++;var raw=(c.getAttribute('data-raw')||'').toLowerCase();
      var ok=!q||raw.indexOf(q)>=0;
      c.classList.toggle('hidden',!ok);if(ok)shown++;
    });
    var cnt=$('#logcnt');if(cnt)cnt.textContent='showing '+shown+' of '+all+' lines';
  });
}

/* ===== grading ===== */
function grade(ex){
  var w=S._w, sel=w.collect(), out={credit:0,rows:[],correctDisplay:'',extra:''};
  var optText=function(id,list){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].text}return id};
  if(ex.type==='qcm'||ex.type==='logs'){
    var correct=ex.correct;
    var ok=sel.length===1&&correct.indexOf(sel[0])>=0;
    out.credit=scoreExercise(ok?sel:[],correct);
    out.correctDisplay=optText(correct[0],(ex.options||ex.sub.options));
  } else if(ex.type==='multi'){
    var c=ex.correct,N=c.length,H=0,W=0;
    var rows=[];
    c.forEach(function(id){
      var got=sel.indexOf(id)>=0;
      if(got){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:optText(id,ex.options)});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:optText(id,ex.options)});}
    });
    sel.forEach(function(id){
      if(c.indexOf(id)<0){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:optText(id,ex.options)});}
    });
    out.credit=scoreExercise(sel,c);out.rows=rows;
  } else if(ex.type==='match'){
    var pairs=w.pairs||{};var N=Object.keys(ex.pairs).length,H=0,W=0,rows=[];
    var gotPairs=[],wantPairs=[];
    Object.keys(ex.pairs).forEach(function(l){
      var want=ex.pairs[l],got=pairs[l];
      var lt=optText(l,ex.left),rt=optText(want,ex.right);
      wantPairs.push(l+'>'+want);
      if(got){gotPairs.push(l+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lt+' \u2192 '+rt});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lt+' \u2192 you chose: '+optText(got,ex.right)+' \u2014 correct: '+rt});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lt+' \u2192 correct: '+rt});}
    });
    out.credit=scoreExercise(gotPairs,wantPairs);out.rows=rows;
  } else if(ex.type==='dnd'||ex.type==='fib'){
    var placed=w.placed||{};var sol=ex.solution;var N=Object.keys(sol).length,H=0,W=0,rows=[];
    var gotFills=[],wantFills=[];
    Object.keys(sol).forEach(function(slotId){
      var want=sol[slotId],got=placed[slotId];
      var lbl=(ex.slots||ex.blanks).filter(function(s){return s.id===slotId})[0];
      var lblT=lbl?(lbl.label||('blank '+slotId)):slotId;
      wantFills.push(slotId+'>'+want);
      if(got){gotFills.push(slotId+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lblT+': '+want});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lblT+': you placed \u201C'+got+'\u201D \u2014 correct: '+want});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lblT+': correct: '+want});}
    });
    out.credit=scoreExercise(gotFills,wantFills);out.rows=rows;
    out.correctDisplay=Object.keys(sol).map(function(k){return sol[k]}).join(', ');
  } else if(ex.type==='order'||ex.type==='rank'){
    var want=ex.order,N=want.length,H=0,W=0,rows=[];
    var gotPos=[],wantPos=[];
    for(var i=0;i<N;i++){
      var it=optText(sel[i],ex._items),okp=sel[i]===want[i];
      gotPos.push(i+'>'+sel[i]);wantPos.push(i+'>'+want[i]);
      var posTxt='Position '+(i+1)+': '+(okp?it:(optText(want[i],ex._items)+' (you placed: '+it+')'));
      if(okp){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:posTxt});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:posTxt});}
    }
    out.credit=scoreExercise(gotPos,wantPos);out.rows=rows;
    out.correctDisplay=want.map(function(id,ix){return (ix+1)+'. '+optText(id,ex._items)}).join('  ');
  } else if(ex.type==='branch'){
    var N=ex.steps.length,H=0,W=0,rows=[];
    var gotSteps=[],wantSteps=[];
    ex.steps.forEach(function(st,ix){
      var got=sel[ix],okc=got===st.correct;
      gotSteps.push(ix+'>'+got);wantSteps.push(ix+'>'+st.correct);
      if(okc){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:'Step '+(ix+1)+': '+optText(st.correct,st.options)});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:'Step '+(ix+1)+': you chose \u201C'+optText(got,st.options)+'\u201D \u2014 best: '+optText(st.correct,st.options)});}
    });
    out.credit=scoreExercise(gotSteps,wantSteps);out.rows=rows;
  } else if(ex.type==='term'){
    var raw=(w.raw?w.raw():sel[0]||'').toLowerCase().replace(/\s+/g,' ').trim();
    var N=ex.elements.length,H=0,W=0,rows=[];
    var gotEls=[],wantEls=[];
    ex.elements.forEach(function(el,ei){
      var hit=false;
      if(el.re){hit=(new RegExp(el.re,'i')).test(raw);}
      else if(el.inc){hit=raw.indexOf(el.inc.toLowerCase())>=0;}
      if(el.danger){
        if(hit){W++;gotEls.push('d'+ei);rows.push({st:'wrong',ic:'\u2717',w:'DANGEROUS \u2014 NEAR MISS',t:el.label});}
      } else {
        wantEls.push('e'+ei);
        if(hit){H++;gotEls.push('e'+ei);rows.push({st:'correct',ic:'\u2713',w:'Correct',t:el.label});}
        else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:el.label});}
      }
    });
    out.credit=scoreExercise(gotEls,wantEls);out.rows=rows;
    out.correctDisplay=ex.expected;
    out.extra='<div class="canon" role="figure" aria-label="Expected query">'+esc(ex.expected)+'</div>';
  }
  if(S.hintUsed[ex.id])out.credit=Math.max(0,out.credit-0.10);
  return out;
}

/* ===== check / next / skip / hint / pause ===== */
function doHint(){
  if(!S.cur||S.hintUsed[S.cur.id])return;
  S.hintUsed[S.cur.id]=true;
  var ex=S.cur;
  if(!$('#hintbox')){
    $('#fbwrap').insertAdjacentHTML('beforebegin','<div class="hintbox" id="hintbox"><span class="h">\uD83D\uDCA1 Hint</span> \u2014 '+esc(ex.hint)+'</div>');
  }
  renderHeader();
}
function markAnswered(ex,credit){
  S.status[ex.id]='answered';S.credit[ex.id]=credit;
}
function feedbackHTML(ex,g){
  var cls,nh;
  if(g.credit>=0.999){cls='f-correct';nh='<span aria-hidden="true">\u2713</span> CORRECT';}
  else if(g.credit>0){cls='f-partial';nh='<span aria-hidden="true">\u2713</span> PARTIALLY CORRECT';}
  else{cls='f-wrong';nh='<span aria-hidden="true">\u2717</span> INCORRECT';}
  var N=0;
  if(ex.type==='multi')N=ex.correct.length;
  else if(ex.type==='match')N=Object.keys(ex.pairs).length;
  else if(ex.type==='dnd'||ex.type==='fib')N=Object.keys(ex.solution).length;
  else if(ex.type==='order'||ex.type==='rank')N=ex.order.length;
  else if(ex.type==='branch')N=ex.steps.length;
  else if(ex.type==='term')N=ex.elements.length;
  var creditLine='';
  if(N>1||ex.type==='term'){
    var hCount=0;g.rows.forEach(function(r){if(r.st==='correct')hCount++});
    creditLine='<div class="credit-line">credit '+ (Math.round(g.credit*100)/100) +' \u2014 '+hCount+'/'+N+' items'+(S.hintUsed[ex.id]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  } else if(S.hintUsed[ex.id]){
    creditLine='<div class="credit-line">credit '+(Math.round(g.credit*100)/100)+' (includes \u22120.10 hint penalty)</div>';
  }
  var rows='';g.rows.forEach(function(r){
    rows+='<div class="itrow st-'+r.st+'"><span class="ic" aria-hidden="true">'+r.ic+'</span><span><b>'+r.w+'</b> \u2014 '+esc(r.t)+'</span></div>';
  });
  var corr=g.correctDisplay?(' <div class="expl"><b>Correct answer:</b> '+esc(g.correctDisplay)+'</div>'):'';
  return '<div class="block b-feedback '+cls+'" role="status"><div class="block-h">'+nh+(N>1?'':'')+'</div><div class="block-body">'+
    creditLine+
    (rows?'<div class="items">'+rows+'</div>':'')+
    corr+g.extra+
    '<div class="expl">'+esc(ex.explanation)+'</div>'+
    '<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>'+
    '</div></div>';
}
function doCheck(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  var ex=S.cur;
  /* Check-triggered auto-pause FIRST (state machine), then feedback */
  tSet('PAUSED_AUTO_CHECK');
  var g=grade(ex);
  markAnswered(ex,g.credit);
  var btn=$('#btnCheck');if(btn)btn.classList.add('hidden');
  $('#fbwrap').innerHTML=feedbackHTML(ex,g);
  /* lock answer widget */
  $all('#ansbody button, #ansbody input, #ansbody [role="button"]').forEach(function(b){
    b.disabled=true;b.classList.add('locked');
  });
  $all('#ansbody .term input').forEach(function(b){b.disabled=true});
  var nb=$('#btnNext');
  nb.classList.remove('hidden');
  var morePending=S.order.some(function(ix,i){return i>S.pos&&S.status[EX[ix].id]!=='answered'});
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(morePending){nb.textContent='\u2192 Next';}
  else if(anySkipped){nb.textContent='\u26A0 Review skipped \u2192';}
  else{nb.textContent='\u23E9 Final Submit';}
  nb.onclick=function(){onNext()};
  $('#btnNext').focus();
  renderHeader();
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){tSet('RUNNING');}
  if(S.fromReview){
    var anyLeft=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
    if(anyLeft&&S.tState!=='ENDED'){goReview();}else{showResults();}
    return;
  }
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doSkip(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  S.status[S.cur.id]='skipped';
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doManualPause(){
  if(!S.cur||S.finished)return;
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S._prevT=S.tState;tSet('PAUSED_MANUAL');
    $('#btnPause').disabled=true;
    /* viewport-fixed overlay + full-content blur, so manual pause works the same
       from the exam view and from the review-skipped view */
    var d=document.createElement('div');d.className='overlay-msg fixed';d.id='ovl';
    d.innerHTML='<b>\u23F8 PAUSED \u2014 manual</b><br>The exercise is hidden while you pause.<br>Your break time is recorded in the results report.<br><br><button class="btn primary" id="btnResume">\u25B6 Resume</button>';
    document.body.appendChild(d);
    var wr=document.querySelector('.wrap');if(wr)wr.classList.add('blur-lock');
    $('#btnResume').onclick=function(){
      tSet(S._prevT||'RUNNING');
      var o=$('#ovl');if(o)o.remove();
      var wr2=document.querySelector('.wrap');if(wr2)wr2.classList.remove('blur-lock');
      renderHeader();
    };
  }
}
function finishFlow(){
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(anySkipped&&S.tState!=='ENDED'){goReview();return;}
  showResults();
}
/* ===== review skipped ===== */
function goReview(){
  var list=S.order.filter(function(ix){return S.status[EX[ix].id]==='skipped'});
  var h='<div class="card"><h2>\u26A0 Review skipped exercises</h2>'+
    '<p class="muted" style="color:var(--text-secondary)">You skipped '+list.length+' exercise(s). You can go back and answer them now, as long as the timer has not ended. If you submit with skipped exercises left, they are excluded from the score.</p>';
  list.forEach(function(ix){
    var ex=EX[ix];
    h+='<div class="revitem"><span class="sk" role="img" aria-label="Skipped">\u26A0 Skipped</span><span class="t">'+esc(ex.title||ex.question)+'</span><button class="btn" data-id="'+esc(ex.id)+'" aria-label="Answer skipped exercise">Answer</button></div>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnFinish">\u23E9 Submit exam now</button></div></div>';
  $('#review-body').innerHTML=h;
  $all('#review-body .revitem button').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      var idx=S.order.indexOf(EX.indexOf(EXBYID[id]));
      showView('#view-exam');
      goToPos(idx,true);
    };
  });
  $('#btnFinish').onclick=function(){showResults()};
  showView('#view-review');
}
/* ===== time end ===== */
function onTimeEnd(){
  if(S.finished)return;
  showResults(true);
}
/* ===== results ===== */
function showResults(timeOver){
  if(S.finished)return;
  S.finished=true;
  S.tState='ENDED';
  renderHeader();
  clearInterval(TID);
  var st=answeredStats();
  var count=st.count,sum=st.sum;
  var percent=count>0?Math.round(sum/count*100):0;
  var passed=percent>=70;
  var fully=0,partial=0,partialAvg=0,wrong=0,skipped=0,psum=0;
  S.order.forEach(function(ix){
    var ex=EX[ix],stt=S.status[ex.id];
    if(stt==='answered'){
      var c=S.credit[ex.id];
      if(c>=0.999)fully++;else if(c>0){partial++;psum+=c;}else wrong++;
    } else skipped++;
  });
  if(partial>0)partialAvg=psum/partial;
  /* report to site: exactly once per attempt, at results */
  if(!S.reported){
    S.reported=true;
    reportScore(sum,count,percent,passed);
  }
  var h='<div class="card"><h2>Final results</h2>'+
    '<div class="bigscore">'+fmt1(sum)+' / '+count+'  <span style="font-size:1.4rem;color:var(--text-secondary)">('+percent+'%)</span></div>'+
    '<p class="muted" style="color:var(--text-secondary)">Score computed only over answered exercises. Pass mark: 70%.</p>'+
    (timeOver?'<p style="color:var(--state-paused)">\u23F1 Time ended \u2014 unanswered exercises were excluded.</p>':'')+
    '<div class="cert '+(passed?'':'fail')+'" role="status">'+
    '<div class="cpass">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'+
    '<div class="csub">'+(passed?'Certificate-worthy performance on this severity.':'You must retake this exam. Review the explanations, then try again \u2014 questions and options will be reshuffled.')+'</div>'+
    '</div>'+
    '<div class="brk">'+
    '<div class="brkrow b-correct"><span class="ic">\u2713</span> Fully correct <span class="n">'+fully+'</span></div>'+
    '<div class="brkrow b-partial"><span class="ic">\u2713</span> Partially correct '+(partial>0?('(avg credit '+ (Math.round(partialAvg*100)/100) +')'):'')+' <span class="n">'+partial+'</span></div>'+
    '<div class="brkrow b-wrong"><span class="ic">\u2717</span> Fully incorrect <span class="n">'+wrong+'</span></div>'+
    '<div class="brkrow b-skipped"><span class="ic">\u26A0</span> Skipped \u2014 excluded from score <span class="n">'+skipped+'</span></div>'+
    '</div>';
  /* per-theme mini progress */
  var themes={};
  S.order.forEach(function(ix){var ex=EX[ix];themes[ex.theme]=themes[ex.theme]||{a:0,t:0};
    themes[ex.theme].t++;if(S.status[ex.id]==='answered')themes[ex.theme].a++;});
  var mt='<div class="mini-themes">';
  Object.keys(themes).forEach(function(t){mt+='<span class="mt">'+esc(t)+': <b>'+themes[t].a+'/'+themes[t].t+'</b></span>'});
  mt+='</div>';
  h+=mt;
  h+='<p class="kv">Time paused manually: <b>'+fmtTime(S.pauseAcc.manual)+'</b> \u00B7 Time paused reviewing feedback: <b>'+fmtTime(S.pauseAcc.auto)+'</b></p>';
  if(PROFILE.username)h+='<p class="kv">Attempt by <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'')+'</p>';
  h+='<div style="margin-top:14px"><button class="btn green" id="btnRetake">\u21BA Retake exam</button></div>';
  h+='</div>';
  $('#results-body').innerHTML=h;
  $('#btnRetake').onclick=function(){
    newAttempt();S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');goToPos(0);
  };
  showView('#view-results');
}
/* ===== site integration ===== */
function reportScore(creditSum,answeredCount,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  PROFILE.username=event.data.username||'';
  PROFILE.country=event.data.country||'';
  PROFILE.locale=event.data.locale||'en';
  /* theme field is always 'dark'; files are dark-only by contract, nothing to switch */
});

/* ===== boot ===== */
function boot(){
  newAttempt();
  renderIntro();
  showView('#view-intro');
}
document.addEventListener('DOMContentLoaded',boot);
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
