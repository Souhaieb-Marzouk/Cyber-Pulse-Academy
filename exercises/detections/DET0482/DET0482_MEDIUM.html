const META = DATA.meta;
/* Map the platform difficulty tier to the severity class — 'extremely-hard'
   must land on the .sev-extreme palette class. Set at load so the intro
   screen badge already shows the correct severity colour. */
const SEVCLASS = ({easy:'sev-easy', medium:'sev-medium', hard:'sev-hard', 'extremely-hard':'sev-extreme'})[META.difficulty] || 'sev-easy';
document.body.className = SEVCLASS;

/* ================= tiny helpers ================= */
const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function fmt(s){ s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
/* Reusable partial-credit scoring function (platform contract):
   credit = max(0, (H - W) / N) — H correct items, W wrong items, N correct items. */
function scoreExercise(selectedItems, correctItems){
  const cs = new Set(correctItems); let H = 0, W = 0;
  (selectedItems || []).forEach(v => { if (cs.has(v)) H++; else W++; });
  const N = Math.max(1, correctItems.length);
  return Math.max(0, (H - W) / N);
}

/* ================= state ================= */
const S = {
  view:'intro', order:[], pos:0, R:[], pool:[], inReview:false,
  remaining:0, tstate:'RUNNING', prevState:null, manualSec:0, autoSec:0,
  creditSum:0, answered:0, reported:false, user:'', country:'', locale:'en'
};
let tick = null;

function initExam(){
  S.order = shuffle(DATA.exercises.map((_,i)=>i));
  S.R = DATA.exercises.map(()=>({answered:false, skipped:false, hintUsed:false, credit:0}));
  S.pos = 0; S.pool = []; S.inReview = false;
  S.remaining = META.timerMinutes*60; S.tstate='RUNNING'; S.prevState=null;
  S.manualSec=0; S.autoSec=0; S.creditSum=0; S.answered=0; S.reported=false;
  document.body.className = SEVCLASS;
}
function cur(){ const oi = S.order[S.pos]; return { ex: DATA.exercises[oi], rt: S.R[oi], oi }; }

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
function setT(st){ S.tstate = st; updHud(); }
function startTick(){
  if(tick) clearInterval(tick);
  tick = setInterval(()=>{
    if(S.tstate==='RUNNING'){
      S.remaining--;
      if(S.remaining<=0){ S.remaining=0; setT('ENDED'); updHud(); finishExam(); return; }
    } else if(S.tstate==='PAUSED_MANUAL'){ S.manualSec++; }
    else if(S.tstate==='PAUSED_AUTO_CHECK'){ S.autoSec++; }
    updHud();
  }, 1000);
}
function tstateInfo(){
  switch(S.tstate){
    case 'RUNNING': return {cls:'run', txt:'▶ RUNNING'};
    case 'PAUSED_MANUAL': return {cls:'man', txt:'⏸ PAUSED — manual (press Resume)'};
    case 'PAUSED_AUTO_CHECK': return {cls:'aut', txt:'⏸ PAUSED — reviewing feedback (resumes on Next)'};
    default: return {cls:'end', txt:'■ ENDED'};
  }
}

/* ================= HUD ================= */
function updHud(){
  const t = tstateInfo();
  const cnt = $('#hudCnt'); if(cnt){ cnt.textContent = (S.view==='exam' && S.order.length) ? ('Exercise ' + (S.pos+1) + ' of ' + S.order.length) : ''; }
  const el = $('#hudTimer'); if(el){ el.textContent = fmt(S.remaining); }
  const st = $('#hudTState'); if(st){ st.textContent = t.txt; st.className = 'tstate ' + t.cls; }
  const sc = $('#hudScore');
  if(sc){ sc.innerHTML = S.answered>0
      ? 'Score <b>' + (Math.round(S.creditSum*10)/10) + '</b> / ' + S.answered + ' · ' + Math.round((S.creditSum/S.answered)*100) + '%'
      : 'Score <b>0.0</b> / 0 · —'; }
  const pf = $('#pfill'); if(pf){ pf.style.width = Math.round(((S.pos)/(S.order.length))*100) + '%'; }
  const hintB = $('#hudHint'), skipB = $('#hudSkip'), pauseB = $('#hudPause');
  if(hintB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } hintB.disabled = !rt || rt.hintUsed || rt.answered; }
  if(skipB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } skipB.disabled = !rt || rt.answered; }
  if(pauseB){ pauseB.disabled = (S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK'); }
}

/* ================= views ================= */
function render(){
  if(S.view==='intro') renderIntro();
  else if(S.view==='exam') renderExamShell();
  else if(S.view==='review') renderReview();
  else if(S.view==='results') renderResults();
}

/* ---------- intro (exactly four sections) ---------- */
function renderIntro(){
  S.view='intro';
  const facts =
    '<div class="fact"><b>EXERCISES</b>' + DATA.exercises.length + ' in this exam</div>' +
    '<div class="fact"><b>ESTIMATED TIME</b>' + META.estimatedMinutes + ' minutes</div>' +
    '<div class="fact"><b>TIMER BUDGET</b>' + fmt(META.timerMinutes*60) + ' countdown</div>' +
    '<div class="fact"><b>PASS MARK</b>' + META.passMark + '%</div>';
  const kw = DATA.intro.keywords.map(k =>
    '<div class="kw"><h4>' + k.theme + '</h4><ul>' + k.items.map(i=>'<li>'+i+'</li>').join('') + '</ul></div>').join('');
  const how = DATA.intro.how.map(h=>'<li>'+h+'</li>').join('');
  $('#app').innerHTML =
  '<div class="wrap">' +
    '<section class="card hero">' +
      '<h1>' + DATA.intro.heading + '</h1>' +
      '<p class="obj mono">' + META.id + ' — ' + DATA.header.objectName + '</p>' +
      '<p class="obj"><span class="badge">' + META.severity + '</span> &nbsp;MITRE ATT&amp;CK object type: <b>Detection Strategy / Analytic</b></p>' +
      '<div class="factrow">' + facts + '</div>' +
    '</section>' +
    '<section class="blk blk-scenario"><div class="blk-h">▣ SECTION 1 — What you will learn here</div><div class="blk-b">' +
      DATA.intro.learn.map(p=>'<p>'+p+'</p>').join('') +
    '</div></section>' +
    '<section class="blk blk-question"><div class="blk-h">◈ SECTION 2 — Keywords covered in this exam</div><div class="blk-b">' +
      '<div class="kw-grid">' + kw + '</div>' +
    '</div></section>' +
    '<section class="blk blk-answer"><div class="blk-h">◆ SECTION 3 — How this exam works</div><div class="blk-b">' +
      '<ul class="howlist">' + how + '</ul>' +
    '</div>' +
    '<div class="startrow"><button class="btn btn-pri" id="btnStart" style="min-width:220px">▶ Start the exam</button></div>' +
    '</section>' +
  '</div>';
  $('#btnStart').addEventListener('click', ()=>{ initExam(); S.view='exam'; render(); startTick(); });

/* ---------- exam shell + one exercise ---------- */
function renderExamShell(){
  $('#app').innerHTML =
    '<header class="hud">' +
      '<span class="cnt" id="hudCnt"></span>' +
      '<span class="badge">' + META.severity + '</span>' +
      '<div class="timerbox"><span class="timer" id="hudTimer"></span><span class="tstate run" id="hudTState"></span></div>' +
      '<span class="scorebox" id="hudScore"></span>' +
      '<span class="sp"></span>' +
      '<button class="btn btn-warn" id="hudPause" title="Take a break — hides the exercise and stops the timer">⏸ Pause</button>' +
      '<button class="btn" id="hudHint" title="One hint per exercise: costs 10% of this exercise credit">💡 Hint −10%</button>' +
      '<button class="btn btn-ghost" id="hudSkip" title="Move this exercise to the skipped pool — no penalty">⚠ Skip</button>' +
    '</header>' +
    '<div class="progress"><div class="progress-fill" id="pfill"></div></div>' +
    '<div class="wrap" id="exWrap"></div>';
  $('#hudPause').addEventListener('click', manualPause);
  $('#hudHint').addEventListener('click', useHint);
  $('#hudSkip').addEventListener('click', skipEx);
  renderExercise();
}

function renderExercise(){
  const { ex, rt } = cur();
  updHud();
  const box = $('#exWrap');
  box.innerHTML =
    '<section class="blk blk-scenario" id="blkScen">' +
      '<div class="blk-h">▣ SCENARIO<button class="coll-btn" id="collBtn" type="button">▾ Collapse</button></div>' +
      '<div class="coll-sum">' + (ex.summary||'Scenario collapsed') + '</div>' +
      '<div class="blk-b">' + (ex.scenario||'') + (ex.artefacts||[]).map(a=>
        '<div class="artefact"><div class="artefact-l">' + a.label + '</div><div class="artefact-b">' + a.body + '</div></div>').join('') +
      '</div>' +
    '</section>' +
    '<section class="blk blk-question"><div class="blk-h">◈ QUESTION</div><div class="blk-b"><p class="q-text">' + ex.question + '</p></div></section>' +
    '<section class="blk blk-answer"><div class="blk-h">◆ YOUR ANSWER</div><div class="blk-b" id="wbox"></div>' +
      '<div class="blk-b" id="chkHost" style="border-top:1px dashed var(--border)"></div></section>' +
    '<div id="fbHost"></div>' +
    '<div class="hintbox hidden" id="hintBox"><span class="ht">💡 HINT</span><br>' + ex.hint + '</div>';
  $('#collBtn').addEventListener('click', ()=>{
    const b = $('#blkScen'); b.classList.toggle('collapsed');
    $('#collBtn').textContent = b.classList.contains('collapsed') ? '▴ Expand' : '▾ Collapse';
  });
  renderWidget(ex, rt, $('#wbox'));
  $('#chkHost').innerHTML =
    '<div class="navrow" style="margin-top:0"><button class="btn btn-pri" id="btnCheck" style="min-width:180px">✓ Check answer</button>' +
    '<span class="small dim">Checking stops the clock so you can study the feedback without pressure — press Next when ready.</span></div>';
  $('#btnCheck').addEventListener('click', onCheck);
  /* wire any log-viewer filter boxes inside this exercise's artefacts */
  $$('.logfilter', box).forEach(inp=>{
    const host = inp.closest('.artefact-b');
    const lines = $$('.logline', host);
    inp.addEventListener('input', ()=>{
      const q = inp.value.trim().toLowerCase();
      lines.forEach(l=>{ l.style.display = (!q || l.textContent.toLowerCase().indexOf(q)>=0) ? '' : 'none'; });
    });
  });
  updHud();
  window.scrollTo(0,0);
}

function useHint(){
  const { rt } = cur();
  if(rt.hintUsed || rt.answered) return;
  rt.hintUsed = true;
  $('#hintBox').classList.remove('hidden');
  updHud();
}

function skipEx(){
  const { rt } = cur();
  if(rt.answered) return;
  rt.skipped = true;
  if(!S.pool.includes(S.order[S.pos])) S.pool.push(S.order[S.pos]);
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){ S.inReview=false; S.view='review'; renderReview(); return; }
  advance();
}

function advance(){
  if(S.pos < S.order.length-1){ S.pos++; renderExercise(); return; }
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
  else finishExam();
}

/* ================= widget renderers ================= */
function optLetters(k){ return ['A','B','C','D','E','F'][k]; }

function renderWidget(ex, rt, box){
  box.classList.remove('locked');
  WIDGETS[ex.type](ex, rt, box);
}

const WIDGETS = {};

/* ----- QCM (single answer) ----- */
WIDGETS.qcm = function(ex, rt, box){
  const perm = shuffle(ex.options.map((_,i)=>i));
  box.innerHTML = '<div class="opts">' + perm.map((oi,k)=>
    '<button type="button" class="opt" data-v="'+oi+'"><span class="opt-l">'+optLetters(k)+'.</span><span>'+ex.options[oi]+'</span></button>').join('') + '</div>';
  let sel = -1;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    sel = +b.dataset.v;
    $$('.opt', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  rt.grade = ()=>{
    const ok = sel===ex.correct;
    const credit = scoreExercise(sel<0?[]:[String(sel)], [String(ex.correct)]);
    return { credit, multi:false,

/* ----- shared drag & drop engine (pointer events: mouse + touch; click-to-place fallback)
   Implemented as a global singleton: the window-level pointermove/pointerup
   listeners are attached exactly ONCE and dispatch to the currently active drag
   context. Re-rendering an exercise only swaps DND.ctx, so no listener ever
   accumulates across exercises. ----- */
const DND = { drag:null, sel:null, ctx:null, wired:false };
function enableDnD(root, opts){
  DND.ctx = { root, opts };
  DND.sel = null; DND.drag = null;
  if(!DND.wired){
    DND.wired = true;
    window.addEventListener('pointermove', dndMove);
    window.addEventListener('pointerup', dndUp);
  }
  root.addEventListener('pointerdown', e=>{
    const o = DND.ctx.opts;
    const chip = e.target.closest(o.chips); if(!chip || chip.classList.contains('static')) return;
    if(e.target.closest('button.up') || e.target.closest('button.dn')) return;
    DND.drag = { chip, x:e.clientX, y:e.clientY, moved:false, ghost:null };
  });
  root.addEventListener('click', e=>{
    const o = DND.ctx.opts;
    const tgt = e.target.closest(o.targets);
    if(tgt && DND.sel){ o.onDrop(DND.sel, tgt); DND.sel.classList.remove('selchip'); DND.sel = null; }
  });
}
function dndMove(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(!d.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y) > 7){
    d.moved = true;
    const g = d.chip.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g;
    d.chip.classList.add('dragging');
  }
  if(d.moved){
    d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) tgt.classList.add('drop-hi');
  }
}
function dndUp(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(d.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) o.onDrop(d.chip, tgt);
    if(d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
  } else {
    if(d.chip.dataset.placed==='1'){ o.onReturn(d.chip); }
    else if(DND.sel===d.chip){ DND.sel.classList.remove('selchip'); DND.sel=null; }
    else { if(DND.sel) DND.sel.classList.remove('selchip'); DND.sel = d.chip; d.chip.classList.add('selchip'); }
  }
  DND.drag = null;
}

/* ----- drag chips into slots (1 chip per slot) ----- */
WIDGETS.slots = function(ex, rt, box){
  rt.place = ex.slots.map(()=>-1);
  const chips = shuffle(ex.items.map((_,i)=>i));
  box.innerHTML =
    '<div class="dd">' +
      '<div class="dd-bank"><h4>ITEM BANK — drag a card into a slot (or tap card then slot; tap a placed card to send it back)</h4><div id="bankW">' +
        chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.items[ci]+'</button>').join('') +
      '</div></div>' +
      '<div class="dd-slots"><h4>DROP SLOTS</h4>' +
        ex.slots.map((s,i)=>'<div class="slot drop"><div class="slot-l">'+s.label+'</div><div class="slot-w" data-i="'+i+'"></div></div>').join('') +
      '</div>' +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, slotW){
    const ci = +chipEl.dataset.c, si = +slotW.dataset.i;
    if(rt.place[si] >= 0){
      const old = $('.chip[data-c="'+rt.place[si]+'"]', slotW);
      if(old){ old.dataset.placed='0'; bankW.appendChild(old); }
    }
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    rt.place[si] = ci; chipEl.dataset.placed='1'; slotW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c;
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.slot-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.slots.forEach((s,i)=>{
      const ci = rt.place[i];
      correct.push(i+'::'+ex.items.indexOf(s.correct));
      if(ci<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — slot "'+s.label+'" stayed empty. Correct: '+s.correct}); }
      else {
        selected.push(i+'::'+ci);
        const ok = ex.items[ci]===s.correct;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+ex.items[ci]+'" in "'+s.label+'"'});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.slots.map(s=>s.label+' ← '+s.correct).join(';  ') };
  };
};

/* ----- drag chips into bins ----- */
WIDGETS.bins = function(ex, rt, box){
  rt.assign = ex.chips.map(()=>-1);
  const chips = shuffle(ex.chips.map((_,i)=>i));
  box.innerHTML =
    '<div class="bank"><span class="bank-t">Drag each card into the right bin (or tap card then bin; tap a placed card to send it back).</span><div id="bankW">' +
      chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.chips[ci]+'</button>').join('') + '</div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px">' +
      ex.bins.map((b,i)=>'<div class="bin drop"><div class="bin-h">'+b.label+'</div><div class="bin-w" data-i="'+i+'"></div></div>').join('') +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, binW){
    const ci = +chipEl.dataset.c, bi = +binW.dataset.i;
    rt.assign[ci] = bi; chipEl.dataset.placed='1'; binW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c; rt.assign[ci] = -1; chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.bin-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.chips.forEach((c,i)=>{
      const bi = rt.assign[i];
      const cbi = ex.bins.findIndex(b=>b.accept.indexOf(i)>=0);
      correct.push(i+'::'+cbi);
      if(bi<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — "'+c+'" was left unsorted. Correct bin: '+ex.bins[cbi].label}); }
      else {
        selected.push(i+'::'+bi);
        const ok = bi===cbi;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+c+'" → '+(ok?ex.bins[bi].label:'placed in "'+ex.bins[bi].label+'" (correct: '+ex.bins[cbi].label+')')});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.chips.map((c,i)=>'"'+c+'" → '+ex.bins[ex.bins.findIndex(b=>b.accept.indexOf(i)>=0)].label).join(';  ') };
  };
};

/* ----- ordering / ranking ----- */
WIDGETS.order = function(ex, rt, box){
  let seq = shuffle(ex.order.map((_,i)=>i));
  if(ex.order.length>2 && seq.every((v,p)=>v===p)) seq = shuffle(seq);
  rt.seq = seq;
  function draw(){
    box.innerHTML = '<div class="bank"><span class="bank-t">Drag rows to reorder (or use ▲▼). Position 1 goes first.</span></div><div id="olist">' +
      seq.map((oi,p)=>'<div class="orow drop" data-i="'+oi+'"><span class="onum">'+(p+1)+'</span>' +
        '<span class="mv"><button type="button" class="up" aria-label="Move up">▲</button><button type="button" class="dn" aria-label="Move down">▼</button></span>' +
        '<span class="otext">'+ex.order[oi]+'</span></div>').join('') + '</div>';
    const ol = $('#olist', box);
    $$('.up', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i>0){ [seq[i-1],seq[i]]=[seq[i],seq[i-1]]; draw(); }
    }));
    $$('.dn', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i<seq.length-1){ [seq[i+1],seq[i]]=[seq[i],seq[i+1]]; draw(); }
    }));
    enableDnD(ol, {
      chips:'.orow', targets:'.orow',
      onDrop:(chipEl, tgt)=>{
        if(chipEl===tgt) return;
        const ci = seq.indexOf(+chipEl.dataset.i);
        seq.splice(ci,1);
        const ti = seq.indexOf(+tgt.dataset.i);
        seq.splice(ci < ti ? ti+1 : ti, 0, +chipEl.dataset.i);
        draw();
      },
      onReturn:()=>{}
    });
  }
  draw();
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    seq.forEach((oi,p)=>{
      selected.push(p+'::'+oi); correct.push(p+'::'+p);
      const ok = oi===p;
      rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'position '+(p+1)+': "'+ex.order[oi]+'"'+(ok?'':' (correct: "'+ex.order[p]+'")')});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.order.map((o,i)=>(i+1)+'. '+o).join('   ') };
  };
};

/* ================= check / feedback / next ================= */
function onCheck(){
  const { ex, rt } = cur();
  if(rt.answered) return;
  const res = rt.grade();
  let credit = res.credit;
  if(rt.hintUsed) credit = Math.max(0, credit - 0.10);
  rt.credit = credit; rt.answered = true;
  S.creditSum += credit; S.answered += 1;
  if(S.pool.includes(S.order[S.pos])) S.pool = S.pool.filter(x=>x!==S.order[S.pos]);
  /* Check-triggered auto-pause: stop the clock the moment Check is pressed. */
  if(S.tstate==='RUNNING') setT('PAUSED_AUTO_CHECK');
  $('#wbox').classList.add('locked');
  $$('select', $('#wbox')).forEach(s=>s.disabled=true);
  $$('button', $('#wbox')).forEach(b=>b.disabled=true);
  const bc = $('#btnCheck'); if(bc){ bc.disabled = true; }
  const isMulti = res.multi;
  let label, cls;
  if(credit>=1){ label='✓ CORRECT'; cls='fb-ok'; }
  else if(credit>0){ label='✓ PARTIALLY CORRECT'; cls='fb-part'; }
  else { label='✗ INCORRECT'; cls='fb-bad'; }
  const pendingLeft = S.pool.filter(oi=>!S.R[oi].answered).length;
  const last = !S.inReview && S.pos===S.order.length-1 && pendingLeft===0;
  const nextLabel = S.inReview ? '↩ Back to skipped list' : (last ? '⏱ Final Submit' : 'Next exercise →');
  const itemsTxt = isMulti ? '<div class="fb-cred">credit ' + (Math.round(credit*100)/100).toFixed(2) + ' — computed as (right − wrong) ÷ items</div>' : '';
  $('#fbHost').innerHTML =
    '<section class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>' +
      (isMulti && credit>0 && credit<1 ? '<span class="small dim">per-item breakdown below</span>':'') + '</div>' +
    '<div class="fb-b">' + itemsTxt +
      '<div class="fb-rows">' + res.rows.map(r=>'<div class="r-'+r.s+'">'+r.t+'</div>').join('') + '</div>' +
      '<div class="fb-correct"><b style="color:var(--state-correct)">✓ Model answer:</b> ' + res.correct + '</div>' +
      (rt.hintUsed ? '<div class="small dim" style="margin-top:6px">Includes the −0.10 hint penalty.</div>' : '') +
      '<p class="fb-exp">' + ex.explanation + '</p>' +
      (credit<1 && ex.study ? '<div class="fb-study"><b style="color:var(--accent-amber)">What to study:</b> ' + ex.study + '</div>' : '') +
      '<div class="navrow"><button class="btn btn-pri" id="btnNext">'+nextLabel+'</button></div>' +
    '</div></section>';
  $('#btnNext').addEventListener('click', onNext);
  $('#btnNext').focus();
  updHud();
}

function onNext(){
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){
    const pending = S.pool.filter(oi=>!S.R[oi].answered);
    if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
    else finishExam();
    return;
  }
  advance();
}

function manualPause(){
  if(S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK') return;
  S.prevState = S.tstate;
  setT('PAUSED_MANUAL');
  $('#ov').style.display = 'flex';
  $('#ovResume').focus();
}
function resumePause(){
  setT(S.prevState || 'RUNNING');
  S.prevState = null;
  $('#ov').style.display = 'none';
}

/* ================= review skipped ================= */
function renderReview(){
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  $('#app').innerHTML =
    '<header class="hud">' +
      '<span class="badge">' + META.severity + '</span>' +
      '<div class="timerbox"><span class="timer" id="hudTimer"></span><span class="tstate run" id="hudTState"></span></div>' +
      '<span class="scorebox" id="hudScore"></span><span class="sp"></span>' +
      '<button class="btn btn-warn" id="hudPause">⏸ Pause</button>' +
    '</header>' +
    '<div class="progress"><div class="progress-fill" id="pfill"></div></div>' +
    '<div class="wrap">' +
      '<section class="blk blk-scenario"><div class="blk-h">⚠ REVIEW SKIPPED EXERCISES</div><div class="blk-b">' +
        '<p class="dim">You have ' + pending.length + ' skipped exercise(s). You can return to each one and answer it, as many times as you need, while the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</p>' +
        pending.map(oi=>'<div class="rv-item"><span class="warn">⚠ Skipped</span><span style="flex:1">' + DATA.exercises[oi].label + '</span>' +
          '<button class="btn btn-pri" data-oi="'+oi+'">Answer now</button></div>').join('') +
        '<div class="navrow"><button class="btn btn-pri" id="btnFinish">⏱ Finish exam &amp; see results</button></div>' +
      '</div></section>' +
    '</div>';
  $('#hudPause').addEventListener('click', manualPause);
  $('#btnFinish').addEventListener('click', finishExam);
  $$('button[data-oi]').forEach(b=>b.addEventListener('click', ()=>{
    S.pos = S.order.indexOf(+b.dataset.oi); S.inReview = true; S.view='exam'; renderExamShell();
  }));
  updHud();
  window.scrollTo(0,0);
}

/* ================= results ================= */
function finishExam(){
  setT('ENDED');
  if(tick){ clearInterval(tick); tick=null; }
  S.view='results';
  renderResults();
}
function renderResults(){
  let full=0, part=0, zero=0, skipped=0, partSum=0;
  DATA.exercises.forEach((ex,i)=>{
    const rt = S.R[i];
    if(rt.answered){
      if(rt.credit>=1) full++;
      else if(rt.credit>0){ part++; partSum+=rt.credit; }
      else zero++;
    } else skipped++;
  });
  const answered = S.answered;
  const percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  const passed = percent >= META.passMark;
  const sumR = Math.round(S.creditSum*10)/10;
  const avgPart = part>0 ? (Math.round(partSum/part*100)/100).toFixed(2) : '—';
  $('#app').innerHTML =
    '<div class="wrap">' +
      '<section class="card hero"><h1>' + META.id + ' — ' + META.severity + ' — Results</h1>' +
        '<p class="obj">Score over answered exercises only: <b class="mono" style="color:var(--text-primary)">' + sumR + ' / ' + answered + '</b> · <b class="mono" style="color:var(--text-primary)">' + percent + '%</b> · pass mark ' + META.passMark + '%</p>' +
      '</section>' +
      '<div class="res-grid">' +
        '<div class="res ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct (credit 1.0)</div></div>' +
        '<div class="res part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct (avg '+avgPart+')</div></div>' +
        '<div class="res bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect (credit 0)</div></div>' +
        '<div class="res skip"><div class="num">'+skipped+'</div><div class="lab">⚠ Skipped — excluded from score</div></div>' +
      '</div>' +
      '<div class="verdict '+(passed?'pass':'fail')+'">' +
        (passed
          ? '<h2>✓ PASS</h2><p>You reached ' + percent + '% (threshold ' + META.passMark + '%). Certificate-level performance on ' + META.id + ' at ' + META.severity + ' severity. Take the next severity file when you are ready.</p>'
          : '<h2>✗ FAIL</h2><p>You reached ' + percent + '%, below the ' + META.passMark + '% pass mark. You must retake this exam. Review the explanations you saw during the attempt, then press Retake — exercises and options are shuffled again.</p>') +
        '<div class="navrow"><button class="btn btn-pri" id="btnRetake" style="min-width:200px">↻ Retake exam</button></div>' +
      '</div>' +
      '<p class="pausetime">⏸ Manual pause time: ' + fmt(S.manualSec) + ' · ⏸ Feedback review time (auto-pause): ' + fmt(S.autoSec) + '</p>' +
    '</div>';
  $('#btnRetake').addEventListener('click', ()=>{
    initExam(); S.view='exam'; render(); startTick();
  });
  reportScore();
  window.scrollTo(0,0);
}

/* ================= website integration ================= */
function reportScore(){
  if(S.reported) return; S.reported = true;
  const answeredCount = S.answered;
  const percent = answeredCount>0 ? Math.round((S.creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score: Math.round(S.creditSum), total: answeredCount,
      percent: percent, passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* opened directly rather than inside the site — nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.user = event.data.username || S.user;
  S.country = event.data.country || S.country;
  S.locale = event.data.locale || S.locale;
  /* theme field is always 'dark' — the exam is dark-only by contract, so nothing to switch */
});

/* ================= resume overlay wiring ================= */
$('#ovResume').addEventListener('click', resumePause);

/* ================= go ================= */
render();
</script>
</body>
