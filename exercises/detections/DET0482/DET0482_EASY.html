const DATA = {"meta": {"topicId": "det0482", "batch": 1, "title": "DET0482 Behavior-chain detection for T1134.001 Token Impersonation/Theft \u2014 EASY", "difficulty": "easy", "questionCount": 15, "estimatedMinutes": 30, "timerMinutes": 30, "passMark": 70, "id": "DET0482", "severity": "EASY"}, "header": {"objectName": "Behavior-chain detection for T1134.001 Access Token Manipulation: Token Impersonation/Theft on Windows"}, "intro": {"heading": "DET0482 \u2014 EASY practice exam", "learn": ["Welcome! This exam teaches you <b>DET0482<\/b>, a <b>Detection Strategy<\/b> in the MITRE ATT&amp;CK framework. Imagine ATT&amp;CK as a big library of attacker behaviours. A <b>Technique<\/b> is one behaviour. A <b>Detection Strategy<\/b> is a plan for catching that behaviour in logs. DET0482 is the plan for catching one Windows behaviour: <b>T1134.001 \u2014 Token Impersonation/Theft<\/b>.", "What is a token? When you log in to Windows, Windows gives your session a small digital pass called an <b>access token<\/b>. The pass says who you are and what you may do. <b>Token Impersonation/Theft<\/b> means an attacker copies someone else's pass and then acts as that person. This helps the attacker gain more power (Privilege Escalation) and stay hidden (Stealth).", "Who uses DET0482 in real work? <b>SOC analysts<\/b> see its alerts during triage shifts. <b>Detection engineers<\/b> build and tune the rule. <b>Threat hunters<\/b> use its logic to search old logs. <b>Incident responders<\/b> use its chain to understand what an attacker did. <b>Threat-intel analysts<\/b> mention it in reports about groups such as APT28, Cobalt Strike operators, or Tarrask.", "Which tools carry the data? The <b>SIEM<\/b> (the log platform) collects three feeds: <b>Windows Security event 4688<\/b> (new process created), <b>Sysmon event 10<\/b> (one process opens another process), and <b>ETW:Token<\/b> (Windows telling us which token API calls happen). The rule inside DET0482 is called analytic <b>AN1324<\/b>, and it links these feeds together in a short chain.", "Why does this matter? If token theft is not caught, an attacker can quietly become an admin, a service account, or the CFO. Learning this object gives you a skill you will use in almost every Windows investigation. Take the exam, read every explanation, and you will master the basics in about 30 minutes."], "keywords": [{"theme": "The detection strategy", "items": ["DET0482 \u2014 Detection Strategy", "Analytic AN1324", "Behavior-chain detection", "Technique detected: T1134.001 Token Impersonation/Theft", "Platform: Windows", "Domain: Enterprise"]}, {"theme": "The attack chain", "items": ["Suspicious command-line execution (runas)", "Token duplication", "Thread token assignment", "Process acting as the impersonated user", "Tactics: Stealth, Privilege Escalation"]}, {"theme": "Token APIs watched", "items": ["DuplicateToken / DuplicateTokenEx \u2014 copy an existing token", "ImpersonateLoggedOnUser \u2014 thread acts as the copied user", "SetThreadToken \u2014 assign the copied token to a thread"]}, {"theme": "Data sources & telemetry", "items": ["DC0032 Process Creation \u2014 WinEventLog:Security, EventCode=4688", "DC0035 Process Access \u2014 WinEventLog:Sysmon, EventCode=10", "DC0021 OS API Execution \u2014 ETW:Token"]}, {"theme": "Tuning basics (mutable elements)", "items": ["TimeWindow \u2014 gap allowed between chain steps (e.g. 5m)", "AllowedSystemProcesses \u2014 whitelist of legit token duplicators (e.g. services.exe)", "UserContextFilter \u2014 filters legit service/admin impersonation"]}, {"theme": "Where it sits in ATT&amp;CK", "items": ["Parent technique: T1134 Access Token Manipulation", "Sibling: T1134.002 Create Process with Token", "Sibling: T1134.003 Make and Impersonate Token", "Mitigations: M1026 Privileged Account Management, M1018 User Account Management"]}], "how": ["<b>Pass mark: 70%.<\/b> PASS means you score at least 70% of the exercises you actually answer. FAIL means you should retake it (a Retake button appears at the end).", "<b>Exercise types in this file:<\/b> single-choice questions, matching, fill-in-the-blank with a word bank, drag-and-drop into slots, true/false sorting, timeline ordering, find-the-wrong-line, and click-the-artefact-part.", "<b>Timer:<\/b> a 30:00 countdown runs while the timer shows \u25b6 RUNNING. The <b>Pause<\/b> button stops it and hides the exercise (a real break). Pressing <b>Check<\/b> also stops the clock automatically \u2014 the timer shows \u23f8 PAUSED \u2014 reviewing feedback (resumes on Next) and you can study the feedback as long as you like. The clock only moves again when you press Next.", "<b>Partial credit:<\/b> some exercises have several right parts. You earn (right \u2212 wrong) \u00f7 parts for those, never below zero. Fully-right single-answer exercises score 1.0.", "<b>Hints:<\/b> one hint per exercise, and it costs 10% of that exercise's credit. The hint points at the concept so you can still recover.", "<b>Skipping:<\/b> every exercise has a Skip button. Skipped exercises go to a pool. Before you finish, a review screen lets you return to them as often as you want while time remains. Skipped-and-never-answered exercises are excluded from the score \u2014 they count neither for you nor against you.", "<b>Ready?<\/b> Press Start when you are. Good luck \u2014 read each scenario twice before answering."]}, "exercises": [{"id": "E01", "type": "qcm", "label": "What does DET0482 detect?", "summary": "New analyst reads the DET0482 card in the wiki \u2014 what behaviour does it detect?", "scenario": "You are a new SOC analyst. Your team wiki has a card for every detection the SIEM runs. Today you read the card for <span class=\"mono\">DET0482<\/span>.", "artefacts": [{"label": "ARTEFACT 1 \u2014 ATT&amp;CK excerpt (team wiki card)", "body": "<div class=\"codeblock\"><span class=\"k\">Detection Strategy:<\/span> DET0482\n<span class=\"k\">Name:<\/span> Behavior-chain detection for T1134.001 Access Token Manipulation: Token Impersonation/Theft on Windows\n<span class=\"k\">Technique detected:<\/span> T1134.001 \u2014 Token Impersonation/Theft\n<span class=\"k\">Platform:<\/span> Windows   <span class=\"k\">Domain:<\/span> Enterprise<\/div>"}], "question": "Which behaviour does DET0482 watch for?", "hint": "This is about tokens \u2014 the digital passes that prove who you are on Windows. The name of the technique is in the artefact.", "explanation": "DET0482 is a Detection Strategy, and its whole job is to catch <b>T1134.001 Token Impersonation/Theft<\/b>: an attacker copies an access token that already belongs to another user, then acts as that user. The other options describe different behaviours (password dumping, account creation, network noise) that belong to other techniques and other detections.", "study": "Re-read the intro section 'What you will learn here', especially the part about access tokens.", "options": ["Stealing password hashes from the memory of the LSASS process", "Duplicating another user's existing access token and acting as that user", "Creating brand-new local user accounts on a Windows server", "Sending noisy network traffic to distract the blue team"], "correct": 1, "explanationExtra": ""}, {"id": "E02", "type": "match", "label": "Match the token APIs to their jobs", "summary": "Match runas, DuplicateTokenEx, ImpersonateLoggedOnUser, SetThreadToken to what each does.", "scenario": "The analytic AN1324 inside DET0482 links <b>commands<\/b> and <b>Windows API calls<\/b>. An API call is a request a program makes to Windows so Windows does something for it. Look at the four actors below and what the DET0482 page says about them.", "artefacts": [{"label": "ARTEFACT 1 \u2014 From the analytic description", "body": "<div class=\"codeblock\"><span class=\"c\">// AN1324 correlates suspicious command-line executions (e.g., runas) with API calls<\/span>\n<span class=\"c\">// to DuplicateToken, DuplicateTokenEx, ImpersonateLoggedOnUser, or SetThreadToken.<\/span><\/div>"}], "question": "Match each actor to the job it does in the token chain.", "hint": "Two actors copy or hand over tokens, one makes a thread act as another user, and one is a command-line program that starts a process as another user.", "explanation": "<b>runas<\/b> is the command-line tool that starts a program as another user \u2014 that is why the analytic watches for it in command lines. <b>DuplicateTokenEx<\/b> copies an existing access token. <b>ImpersonateLoggedOnUser<\/b> makes the calling thread act with the copied user's security context. <b>SetThreadToken<\/b> assigns the copied token to a thread. Together they form the chain: run \u2192 copy \u2192 impersonate.", "study": "The four names in the ARTEFACT line. Two are APIs that copy or assign, one is the command tool.", "pairs": [["<span class=\"mono\">runas<\/span> (command line)", "Starts a program as another user from the command line"], ["<span class=\"mono\">DuplicateTokenEx<\/span> (API call)", "Copies an existing access token"], ["<span class=\"mono\">ImpersonateLoggedOnUser<\/span> (API call)", "Makes the calling thread act as the copied user"], ["<span class=\"mono\">SetThreadToken<\/span> (API call)", "Assigns the copied token to a thread"]]}, {"id": "E03", "type": "fillblank", "label": "First link of the chain: which log?", "summary": "Complete the sentence: the Security log and EventCode 4688.", "scenario": "Your SIEM collects Windows logs. The first link of the DET0482 chain is a <b>process creation event<\/b> \u2014 the event Windows writes when a new program starts. Look at the real event below.", "artefacts": [{"label": "ARTEFACT 1 \u2014 WinEventLog (one line)", "body": "<div class=\"codeblock\"><span class=\"n\">EventCode=4688<\/span>  <span class=\"k\">A new process has been created.<\/span>\nNewProcessName: <span class=\"s\">C:\\Windows\\System32\\cmd.exe<\/span>\nCommandLine: <span class=\"s\">runas /user:CORP\\sqladmin cmd.exe<\/span><\/div>"}], "question": "Complete the sentence with words from the bank.", "hint": "The event is called a Security event, and its number is right there in the artefact.", "explanation": "The first chain link comes from the <b>WinEventLog:Security<\/b> channel, and the event that shows a new process is <b>EventCode=4688<\/b> (Process Creation, data component DC0032). Sysmon and System are different channels, 1102 is the log-cleared event, and 21 is a Sysmon driver event \u2014 none of them is the process-creation event the chain starts with.", "study": "Data component DC0032 Process Creation: channel WinEventLog:Security, EventCode=4688.", "text": "The first link of the DET0482 chain comes from the {{0}} log channel, and the event that shows a new process was created is EventCode {{1}}.", "blanks": ["Security", "4688"], "bank": ["Security", "4688", "Sysmon", "1102", "System", "21"]}, {"id": "E04", "type": "qcm", "label": "What does Sysmon EventCode=10 give us?", "summary": "Colleague explains Sysmon event 10 \u2014 which data component is it?", "scenario": "A colleague tells you: <i>\"Sysmon is a Windows add-on that records extra security events with more detail than the normal Security log. For DET0482 we use its <span class=\"mono\">EventCode=10<\/span>.\"<\/i>", "artefacts": [{"label": "ARTEFACT 1 \u2014 Sysmon event 10 (shortened)", "body": "<div class=\"codeblock\"><span class=\"n\">EventCode=10<\/span> <span class=\"k\">Process Access<\/span>\nSourceImage: <span class=\"s\">C:\\Users\\public\\tool.exe<\/span>   \u2192   TargetImage: <span class=\"s\">C:\\Windows\\explorer.exe<\/span>\n<span class=\"c\">(one process opened a handle to another process)<\/span><\/div>"}], "question": "Which data component does Sysmon EventCode=10 provide to DET0482?", "hint": "Look at the event name in the artefact, then match it to the DET0482 log-source list.", "explanation": "Sysmon EventCode=10 is <b>Process Access<\/b>: one process opening a <i>handle<\/i> (a kind of key) to another process. In DET0482's log-source table that is data component <b>DC0035 Process Access<\/b>, collected from WinEventLog:Sysmon. OS API Execution comes from ETW:Token, and File Modification or Scheduled Job are unrelated components the analytic does not use.", "study": "Data component DC0035 Process Access \u2014 WinEventLog:Sysmon, EventCode=10.", "options": ["OS API Execution \u2014 the token API calls a program makes", "File Modification \u2014 which files a program changes on disk", "Scheduled Job \u2014 which tasks are queued for later", "Process Access \u2014 one process opening a handle to another process"], "correct": 3}, {"id": "E05", "type": "slots", "label": "Send each event to its log source", "summary": "Drag three event cards to WinEventLog:Security, WinEventLog:Sysmon, ETW:Token.", "scenario": "A detection engineer must know where each kind of event lives before building DET0482. Three event cards arrived from three feeds. Look at each card, then send it to the log source that records that kind of event.", "artefacts": [], "question": "Drag each event card to the log source that records it.", "hint": "EventCode 4688 lives in the Security log, EventCode 10 in Sysmon, and token API calls stream through ETW:Token.", "explanation": "<b>EventCode=4688<\/b> (a new process starts) is recorded in <b>WinEventLog:Security<\/b>. <b>EventCode=10<\/b> (a process opens another process's handle) is recorded in <b>WinEventLog:Sysmon<\/b>. <b>api_call=ImpersonateLoggedOnUser<\/b> is a token API call, so it streams through <b>ETW:Token<\/b> (data component DC0021 OS API Execution). These three sources are exactly the three feeds AN1324 correlates.", "study": "Memorise the three feeds: Security 4688, Sysmon 10, ETW:Token api_call.", "items": ["EventCode=4688 \u2014 a new process starts", "EventCode=10 \u2014 a process opens another's handle", "api_call=ImpersonateLoggedOnUser"], "slots": [{"label": "WinEventLog:Security", "correct": "EventCode=4688 \u2014 a new process starts"}, {"label": "WinEventLog:Sysmon", "correct": "EventCode=10 \u2014 a process opens another's handle"}, {"label": "ETW:Token", "correct": "api_call=ImpersonateLoggedOnUser"}]}, {"id": "E06", "type": "order", "label": "Put the attack chain in order", "summary": "Order the three chain steps: command execution \u2192 token duplication \u2192 impersonated context.", "scenario": "AN1324 looks for a short chain of steps, not one lonely event. Read the three steps below and put them in the order they happen on a real machine.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Chain summary from the analytic", "body": "<div class=\"codeblock\"><span class=\"c\">// chain: initial command execution or in-memory API invocation<\/span>\n<span class=\"c\">//   \u2192 token handle duplication or thread token assignment<\/span>\n<span class=\"c\">//   \u2192 a new or existing process assuming the impersonated user's context<\/span><\/div>"}], "question": "Put the three chain steps in the order they happen.", "hint": "First something runs, then the token is copied, then a process acts as the copied user.", "explanation": "The chain always runs in this order: (1) a <b>command execution<\/b> such as <span class=\"mono\">runas<\/span> (or an in-memory API invocation), (2) the attacker's program <b>duplicates an existing token<\/b> with an API such as DuplicateTokenEx, (3) a process <b>assumes the impersonated user's context<\/b> \u2014 it now acts as that user. DET0482 fires only when it sees this chain linked together inside the TimeWindow.", "study": "The three chain stages in the analytic description.", "order": ["A suspicious command line runs (for example runas)", "The attacker's program duplicates an existing token", "A process now acts as the impersonated user"]}, {"id": "E07", "type": "spotline", "label": "Find the wrong sentence", "summary": "Team-wiki summary has one wrong sentence \u2014 click it.", "scenario": "A new teammate wrote three sentences about DET0482 for the team wiki. Two are right. One is wrong. Click the wrong sentence.", "artefacts": [], "question": "Which sentence is wrong?", "hint": "Think about the operating system DET0482 is built for. One platform only.", "explanation": "Line 3 is wrong: DET0482 is a <b>Windows-only<\/b> detection (its platform field says Windows). Linux has no WinEventLog:Security, no Sysmon, and no ETW:Token \u2014 those feeds exist only on Windows. Lines 1 and 2 are both true: the strategy targets the Windows platform and correlates Security, Sysmon, and ETW:Token events.", "study": "The Platform field of DET0482: Windows.", "lines": ["DET0482 is a detection strategy for the Windows platform.", "It uses events from the Security, Sysmon, and ETW:Token sources.", "It also watches Linux auditd logs for token theft."], "flaw": 2}, {"id": "E08", "type": "bins", "label": "True or false for DET0482", "summary": "Sort three statements into TRUE / FALSE bins about DET0482.", "scenario": "Quick self-check before your first shift with this detection. Sort each statement into the right bin.", "artefacts": [], "question": "Sort each statement into TRUE for DET0482 or FALSE for DET0482.", "hint": "Remember: Windows only, and it links a runas-style command line with token API calls such as DuplicateTokenEx.", "explanation": "TRUE statements: AN1324 really does <b>correlate a runas-style command line with token API calls<\/b>, and it really watches <b>DuplicateTokenEx<\/b> (the analytic lists DuplicateToken, DuplicateTokenEx, ImpersonateLoggedOnUser, SetThreadToken). FALSE: there is no macOS collection anywhere in this strategy \u2014 its platform is Windows only.", "study": "The analytic description of AN1324 and the Platform field.", "chips": ["It correlates a runas command line with token API calls.", "It collects its own logs on macOS.", "It watches for DuplicateTokenEx calls."], "bins": [{"label": "\u2713 TRUE for DET0482", "accept": [0, 2]}, {"label": "\u2717 FALSE for DET0482", "accept": [1]}]}, {"id": "E09", "type": "qcm", "label": "What does TimeWindow control?", "summary": "Mutable element TimeWindow (e.g. 5m) \u2014 what does it define?", "scenario": "AN1324 has changeable settings that ATT&amp;CK calls <b>mutable elements<\/b> \u2014 knobs a detection engineer may turn. One knob is <span class=\"mono\">TimeWindow<\/span> (for example 5 minutes). Look at the knob panel.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Mutable elements (excerpt)", "body": "<div class=\"codeblock\"><span class=\"k\">TimeWindow<\/span> \u2014 time interval between the API call and the subsequent impersonated process (e.g., 5m)\n<span class=\"k\">AllowedSystemProcesses<\/span> \u2014 whitelist of known processes that legitimately duplicate tokens (e.g., services.exe)<\/div>"}], "question": "What does the TimeWindow knob define?", "hint": "The chain has steps that happen one after another. This knob decides how far apart two steps may still be counted as linked.", "explanation": "<b>TimeWindow<\/b> is the maximum gap the analytic allows between two chain steps \u2014 for example between the token API call and the impersonated process appearing. If they are further apart than that (5 minutes in the example), the analytic no longer links them. Log retention, analyst review time, and password rules are unrelated settings.", "study": "Mutable elements of DET0482, starting with TimeWindow.", "options": ["How long the SOC keeps the logs before deleting them", "How often analysts must review old alerts", "The maximum time between the API call and the impersonated process", "The time a user has to type a password at login"], "correct": 2}, {"id": "E10", "type": "fillblank", "label": "Name the two whitelist knobs", "summary": "Fill in AllowedSystemProcesses and UserContextFilter.", "scenario": "Two more knobs from the mutable-elements panel. Read the two sentences and pick the right knob names from the bank.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Mutable elements (full list)", "body": "<div class=\"codeblock\"><span class=\"k\">AllowedSystemProcesses<\/span> \u2014 whitelist of known processes that legitimately duplicate tokens\n<span class=\"k\">TimeWindow<\/span> \u2014 interval between API call and impersonated process (e.g., 5m)\n<span class=\"k\">UserContextFilter<\/span> \u2014 filter for service or admin accounts doing legitimate impersonation\n<span class=\"k\">ParentProcessAnomalyThreshold<\/span> \u2014 threshold for parent-child lineage anomalies<\/div>"}], "question": "Complete the two sentences with knob names from the bank.", "hint": "One knob is about <i>processes<\/i> allowed to duplicate tokens; the other is about <i>accounts<\/i> doing impersonation for good reasons.", "explanation": "Processes that are <i>allowed<\/i> to duplicate tokens (like the Windows core process services.exe) belong in <b>AllowedSystemProcesses<\/b>. Accounts (service or admin) that impersonate for honest reasons are handled by <b>UserContextFilter<\/b>. TimeWindow measures time gaps, and ParentProcessAnomalyThreshold scores odd parent-child lineages \u2014 neither fits these sentences.", "study": "All four mutable elements and what each one tunes.", "text": "Processes that are allowed to duplicate tokens are listed in {{0}}. Accounts that impersonate other users for good reasons are handled by {{1}}.", "blanks": ["AllowedSystemProcesses", "UserContextFilter"], "bank": ["AllowedSystemProcesses", "UserContextFilter", "TimeWindow", "ParentProcessAnomalyThreshold"]}, {"id": "E11", "type": "qcm", "label": "The services.exe whitelist case", "summary": "Alert on services.exe duplicating a token \u2014 what should the engineer do?", "scenario": "An alert fires because <span class=\"mono\">services.exe<\/span> duplicated a token. services.exe is a core Windows program that is <i>supposed<\/i> to duplicate tokens \u2014 the mutable-elements panel even names it as an example. The detection engineer must decide what to do.", "artefacts": [{"label": "ARTEFACT 1 \u2014 Alert excerpt", "body": "<div class=\"codeblock\"><span class=\"n\">Alert<\/span> AN1324 \u2014 token duplication observed\n<span class=\"k\">process:<\/span> C:\\Windows\\System32\\services.exe\n<span class=\"c\">// note: services.exe is a known legit token duplicator<\/span><\/div>"}], "question": "What should the detection engineer do with services.exe?", "hint": "There is a knob whose whole purpose is to list processes that legitimately duplicate tokens.", "explanation": "The right move is to add services.exe to <b>AllowedSystemProcesses<\/b> \u2014 that is the whitelist the mutable element exists for, so future alerts from this known-good process stop. Deleting the ETW:Token feed or disabling the whole analytic would blind the SOC to real token theft, and rebooting servers does nothing at all. This is the first, gentle step of detection tuning.", "study": "The AllowedSystemProcesses mutable element and why whitelists keep detections clean.", "options": ["Add services.exe to AllowedSystemProcesses so these alerts stop", "Delete the ETW:Token log source to silence the alert", "Disable the whole DET0482 analytic for good", "Reboot the server every morning as a workaround"], "correct": 0}, {"id": "E12", "type": "match", "label": "Name that data component", "summary": "Match Process Creation / Process Access / OS API Execution to DC0032 / DC0035 / DC0021.", "scenario": "ATT&amp;CK gives every detection data component an ID. DET0482 uses three of them. Match each component name to its ID.", "artefacts": [{"label": "ARTEFACT 1 \u2014 DET0482 log-source table (IDs hidden)", "body": "<div class=\"codeblock\"><span class=\"k\">Process Creation<\/span>  \u2014 WinEventLog:Security \u2014 EventCode=4688\n<span class=\"k\">Process Access<\/span>     \u2014 WinEventLog:Sysmon \u2014 EventCode=10\n<span class=\"k\">OS API Execution<\/span>   \u2014 ETW:Token \u2014 api_call: DuplicateTokenEx, ImpersonateLoggedOnUser, SetThreadToken<\/div>"}], "question": "Match each data component name to its ATT&a const META = DATA.meta;
/* Map the platform difficulty tier to the severity class — 'extremely-hard'
   must land on the .sev-extreme palette class. Set at load so the intro
   screen badge already shows the correct severity colour. */
const SEVCLASS = ({easy:'sev-easy', medium:'sev-medium', hard:'sev-hard', 'extremely-hard':'sev-extreme'})[META.difficulty] || 'sev-easy';
document.body.className = SEVCLASS;

/* ================= tiny helpers ================= */
const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function fmt(s){ s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
/* Reusable partial-credit scoring function (platform contract):
   credit = max(0, (H - W) / N) — H correct items, W wrong items, N correct items. */
function scoreExercise(selectedItems, correctItems){
  const cs = new Set(correctItems); let H = 0, W = 0;
  (selectedItems || []).forEach(v => { if (cs.has(v)) H++; else W++; });
  const N = Math.max(1, correctItems.length);
  return Math.max(0, (H - W) / N);
}

/* ================= state ================= */
const S = {
  view:'intro', order:[], pos:0, R:[], pool:[], inReview:false,
  remaining:0, tstate:'RUNNING', prevState:null, manualSec:0, autoSec:0,
  creditSum:0, answered:0, reported:false, user:'', country:'', locale:'en'
};
let tick = null;

function initExam(){
  S.order = shuffle(DATA.exercises.map((_,i)=>i));
  S.R = DATA.exercises.map(()=>({answered:false, skipped:false, hintUsed:false, credit:0}));
  S.pos = 0; S.pool = []; S.inReview = false;
  S.remaining = META.timerMinutes*60; S.tstate='RUNNING'; S.prevState=null;
  S.manualSec=0; S.autoSec=0; S.creditSum=0; S.answered=0; S.reported=false;
  document.body.className = SEVCLASS;
}
function cur(){ const oi = S.order[S.pos]; return { ex: DATA.exercises[oi], rt: S.R[oi], oi }; }

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
function setT(st){ S.tstate = st; updHud(); }
function startTick(){
  if(tick) clearInterval(tick);
  tick = setInterval(()=>{
    if(S.tstate==='RUNNING'){
      S.remaining--;
      if(S.remaining<=0){ S.remaining=0; setT('ENDED'); updHud(); finishExam(); return; }
    } else if(S.tstate==='PAUSED_MANUAL'){ S.manualSec++; }
    else if(S.tstate==='PAUSED_AUTO_CHECK'){ S.autoSec++; }
    updHud();
  }, 1000);
}
function tstateInfo(){
  switch(S.tstate){
    case 'RUNNING': return {cls:'run', txt:'▶ RUNNING'};
    case 'PAUSED_MANUAL': return {cls:'man', txt:'⏸ PAUSED — manual (press Resume)'};
    case 'PAUSED_AUTO_CHECK': return {cls:'aut', txt:'⏸ PAUSED — reviewing feedback (resumes on Next)'};
    default: return {cls:'end', txt:'■ ENDED'};
  }
}

/* ================= HUD ================= */
function updHud(){
  const t = tstateInfo();
  const cnt = $('#hudCnt'); if(cnt){ cnt.textContent = (S.view==='exam' && S.order.length) ? ('Exercise ' + (S.pos+1) + ' of ' + S.order.length) : ''; }
  const el = $('#hudTimer'); if(el){ el.textContent = fmt(S.remaining); }
  const st = $('#hudTState'); if(st){ st.textContent = t.txt; st.className = 'tstate ' + t.cls; }
  const sc = $('#hudScore');
  if(sc){ sc.innerHTML = S.answered>0
      ? 'Score <b>' + (Math.round(S.creditSum*10)/10) + '</b> / ' + S.answered + ' · ' + Math.round((S.creditSum/S.answered)*100) + '%'
      : 'Score <b>0.0</b> / 0 · —'; }
  const pf = $('#pfill'); if(pf){ pf.style.width = Math.round(((S.pos)/(S.order.length))*100) + '%'; }
  const hintB = $('#hudHint'), skipB = $('#hudSkip'), pauseB = $('#hudPause');
  if(hintB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } hintB.disabled = !rt || rt.hintUsed || rt.answered; }
  if(skipB){ let rt=null; if(S.view==='exam'){ const oi=S.order[S.pos]; rt=S.R[oi]; } skipB.disabled = !rt || rt.answered; }
  if(pauseB){ pauseB.disabled = (S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK'); }
}

/* ================= views ================= */
function render(){
  if(S.view==='intro') renderIntro();
  else if(S.view==='exam') renderExamShell();
  else if(S.view==='review') renderReview();
  else if(S.view==='results') renderResults();
}

    '<span class="small dim">Checking stops the clock so you can study the feedback without pressure — press Next when ready.</span></div>';
  $('#btnCheck').addEventListener('click', onCheck);
  /* wire any log-viewer filter boxes inside this exercise's artefacts */
  $$('.logfilter', box).forEach(inp=>{
    const host = inp.closest('.artefact-b');
    const lines = $$('.logline', host);
    inp.addEventListener('input', ()=>{
      const q = inp.value.trim().toLowerCase();
      lines.forEach(l=>{ l.style.display = (!q || l.textContent.toLowerCase().indexOf(q)>=0) ? '' : 'none'; });
    });

function useHint(){
  const { rt } = cur();
  if(rt.hintUsed || rt.answered) return;
  rt.hintUsed = true;
  $('#hintBox').classList.remove('hidden');
  updHud();
}

function skipEx(){
  const { rt } = cur();
  if(rt.answered) return;
  rt.skipped = true;
  if(!S.pool.includes(S.order[S.pos])) S.pool.push(S.order[S.pos]);
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){ S.inReview=false; S.view='review'; renderReview(); return; }
  advance();
}

function advance(){
  if(S.pos < S.order.length-1){ S.pos++; renderExercise(); return; }
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
  else finishExam();
}

/* ================= widget renderers ================= */
function optLetters(k){ return ['A','B','C','D','E','F'][k]; }

function renderWidget(ex, rt, box){
  box.classList.remove('locked');
  WIDGETS[ex.type](ex, rt, box);
}

const WIDGETS = {};

/* ----- QCM (single answer) ----- */
WIDGETS.qcm = function(ex, rt, box){
  const perm = shuffle(ex.options.map((_,i)=>i));
  box.innerHTML = '<div class="opts">' + perm.map((oi,k)=>
    '<button type="button" class="opt" data-v="'+oi+'"><span class="opt-l">'+optLetters(k)+'.</span><span>'+ex.options[oi]+'</span></button>').join('') + '</div>';
  let sel = -1;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    sel = +b.dataset.v;
    $$('.opt', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  rt.grade = ()=>{
    const ok = sel===ex.correct;
    const credit = scoreExercise(sel<0?[]:[String(sel)], [String(ex.correct)]);
    return { credit, multi:false,
      rows:[{s: ok?'ok':'bad', t: (ok?'✓ Correct — ':'✗ Incorrect — you chose: ') + (sel<0?'(nothing selected)':ex.options[sel])}],
      correct: ex.options[ex.correct] };
  };
};

/* ----- matching ----- */
WIDGETS.match = function(ex, rt, box){
  const rights = shuffle(ex.pairs.map(p=>p[1]));
  box.innerHTML = '<div class="bank"><span class="bank-t">Choose the right match for each item — the dropdown order is shuffled.</span></div>' +
    ex.pairs.map((p,i)=>
      '<div class="mrow"><div class="mleft">'+p[0]+'</div>' +
      '<select data-i="'+i+'" aria-label="Match for item '+(i+1)+'"><option value="">— choose —</option>' +
      rights.map(r=>'<option value="'+r.replace(/"/g,'&quot;')+'">'+r+'</option>').join('') +
      '</select></div>').join('');
  const sels = $$('select', box);
  rt.grade = ()=>{
    const selected = [], correct = [], rows = [];
    ex.pairs.forEach((p,i)=>{
      const v = sels[i].value;
      selected.push(i+'::'+v); correct.push(i+'::'+p[1]);
      const ok = v===p[1];
      rows.push({s: ok?'ok':(v?'bad':'miss'),
        t: (ok ? '✓ Correct — ' : '✗ Wrong — ') + p[0] + ' → ' +
           (ok ? '"'+v+'"'
               : (v ? '"'+v+'" — correct: "'+p[1]+'"'
                    : '○ Missed — nothing chosen; correct: "'+p[1]+'"'))});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.pairs.map(p=>p[0]+' → '+p[1]).join(';  ') };
  };
};

/* ----- fill in the blanks ----- */
WIDGETS.fillblank = function(ex, rt, box){
  const bank = shuffle(ex.bank.slice());
  const parts = ex.text.split(/\{\{(\d+)\}\}/);
  let html = '<div class="bank"><span class="bank-t">WORD BANK — shuffled, some words are decoys. Pick one word per blank.</span></div>' +
    '<div class="bank">' + bank.map(w=>'<span class="chip static" style="cursor:default">'+w+'</span>').join('') + '</div>';
  html += '<p class="fb-sent">' + parts.map((p,k)=>{
    if(k%2===1) return '<select class="fb-sel" data-b="'+p+'" aria-label="Blank '+(Math.ceil(k/2))+'"><option value="">— ? —</option>' +
      bank.map(w=>'<option value="'+w.replace(/"/g,'&quot;')+'">'+w+'</option>').join('') + '</select>';
    return p;
  }).join('') + '</p>';
  box.innerHTML = html;
  const sels = $$('select.fb-sel', box);
  rt.grade = ()=>{
    const selected = [], correct = [], rows = [];
    ex.blanks.forEach((b,i)=>{
      const v = sels[i].value;
      selected.push(i+'::'+v); correct.push(i+'::'+b);
      const ok = v===b;
      rows.push({s: ok?'ok':(v?'bad':'miss'),
        t: (ok ? '✓ Correct — ' : '✗ Wrong — ') + 'blank '+(i+1)+': ' +
           (ok ? '"'+b+'"'
               : (v ? '"'+v+'" is not it. Correct: "'+b+'"'
                    : '○ Missed. Correct: "'+b+'"'))});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.blanks.join(',  ') };
  };
};

/* ----- shared drag & drop engine (pointer events: mouse + touch; click-to-place fallback)
   Implemented as a global singleton: the window-level pointermove/pointerup
   listeners are attached exactly ONCE and dispatch to the currently active drag
   context. Re-rendering an exercise only swaps DND.ctx, so no listener ever
   accumulates across exercises. ----- */
const DND = { drag:null, sel:null, ctx:null, wired:false };
function enableDnD(root, opts){
  DND.ctx = { root, opts };
  DND.sel = null; DND.drag = null;
  if(!DND.wired){
    DND.wired = true;
    window.addEventListener('pointermove', dndMove);
    window.addEventListener('pointerup', dndUp);
  }
  root.addEventListener('pointerdown', e=>{
    const o = DND.ctx.opts;
    const chip = e.target.closest(o.chips); if(!chip || chip.classList.contains('static')) return;
    if(e.target.closest('button.up') || e.target.closest('button.dn')) return;
    DND.drag = { chip, x:e.clientX, y:e.clientY, moved:false, ghost:null };
  });
  root.addEventListener('click', e=>{
    const o = DND.ctx.opts;
    const tgt = e.target.closest(o.targets);
    if(tgt && DND.sel){ o.onDrop(DND.sel, tgt); DND.sel.classList.remove('selchip'); DND.sel = null; }
  });
}
function dndMove(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(!d.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y) > 7){
    d.moved = true;
    const g = d.chip.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g;
    d.chip.classList.add('dragging');
  }
  if(d.moved){
    d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) tgt.classList.add('drop-hi');
  }
}
function dndUp(e){
  const d = DND.drag; if(!d || !DND.ctx) return;
  const o = DND.ctx.opts, r = DND.ctx.root;
  if(d.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest(o.targets);
    if(tgt) o.onDrop(d.chip, tgt);
    if(d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    $$('.drop-hi', r).forEach(t=>t.classList.remove('drop-hi'));
  } else {
    if(d.chip.dataset.placed==='1'){ o.onReturn(d.chip); }
    else if(DND.sel===d.chip){ DND.sel.classList.remove('selchip'); DND.sel=null; }
    else { if(DND.sel) DND.sel.classList.remove('selchip'); DND.sel = d.chip; d.chip.classList.add('selchip'); }
  }
  DND.drag = null;
}

/* ----- drag chips into slots (1 chip per slot) ----- */
WIDGETS.slots = function(ex, rt, box){
  rt.place = ex.slots.map(()=>-1);
  const chips = shuffle(ex.items.map((_,i)=>i));
  box.innerHTML =
    '<div class="dd">' +
      '<div class="dd-bank"><h4>ITEM BANK — drag a card into a slot (or tap card then slot; tap a placed card to send it back)</h4><div id="bankW">' +
        chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.items[ci]+'</button>').join('') +
      '</div></div>' +
      '<div class="dd-slots"><h4>DROP SLOTS</h4>' +
        ex.slots.map((s,i)=>'<div class="slot drop"><div class="slot-l">'+s.label+'</div><div class="slot-w" data-i="'+i+'"></div></div>').join('') +
      '</div>' +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, slotW){
    const ci = +chipEl.dataset.c, si = +slotW.dataset.i;
    if(rt.place[si] >= 0){
      const old = $('.chip[data-c="'+rt.place[si]+'"]', slotW);
      if(old){ old.dataset.placed='0'; bankW.appendChild(old); }
    }
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    rt.place[si] = ci; chipEl.dataset.placed='1'; slotW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c;
    rt.place.forEach((v,k)=>{ if(v===ci) rt.place[k]=-1; });
    chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.slot-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.slots.forEach((s,i)=>{
      const ci = rt.place[i];
      correct.push(i+'::'+ex.items.indexOf(s.correct));
      if(ci<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — slot "'+s.label+'" stayed empty. Correct: '+s.correct}); }
      else {
        selected.push(i+'::'+ci);
        const ok = ex.items[ci]===s.correct;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+ex.items[ci]+'" in "'+s.label+'"'});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.slots.map(s=>s.label+' ← '+s.correct).join(';  ') };
  };
};

/* ----- drag chips into bins ----- */
WIDGETS.bins = function(ex, rt, box){
  rt.assign = ex.chips.map(()=>-1);
  const chips = shuffle(ex.chips.map((_,i)=>i));
  box.innerHTML =
    '<div class="bank"><span class="bank-t">Drag each card into the right bin (or tap card then bin; tap a placed card to send it back).</span><div id="bankW">' +
      chips.map(ci=>'<button type="button" class="chip" data-c="'+ci+'">'+ex.chips[ci]+'</button>').join('') + '</div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px">' +
      ex.bins.map((b,i)=>'<div class="bin drop"><div class="bin-h">'+b.label+'</div><div class="bin-w" data-i="'+i+'"></div></div>').join('') +
    '</div>';
  const bankW = $('#bankW', box);
  function place(chipEl, binW){
    const ci = +chipEl.dataset.c, bi = +binW.dataset.i;
    rt.assign[ci] = bi; chipEl.dataset.placed='1'; binW.appendChild(chipEl);
  }
  function ret(chipEl){
    const ci = +chipEl.dataset.c; rt.assign[ci] = -1; chipEl.dataset.placed='0'; bankW.appendChild(chipEl);
  }
  enableDnD(box, { chips:'.chip', targets:'.bin-w', onDrop:place, onReturn:ret });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.chips.forEach((c,i)=>{
      const bi = rt.assign[i];
      const cbi = ex.bins.findIndex(b=>b.accept.indexOf(i)>=0);
      correct.push(i+'::'+cbi);
      if(bi<0){ selected.push(i+'::'); rows.push({s:'miss', t:'○ Missed — "'+c+'" was left unsorted. Correct bin: '+ex.bins[cbi].label}); }
      else {
        selected.push(i+'::'+bi);
        const ok = bi===cbi;
        rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+c+'" → '+(ok?ex.bins[bi].label:'placed in "'+ex.bins[bi].label+'" (correct: '+ex.bins[cbi].label+')')});
      }
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.chips.map((c,i)=>'"'+c+'" → '+ex.bins[ex.bins.findIndex(b=>b.accept.indexOf(i)>=0)].label).join(';  ') };
  };
};

/* ----- ordering / ranking ----- */
WIDGETS.order = function(ex, rt, box){
  let seq = shuffle(ex.order.map((_,i)=>i));
  if(ex.order.length>2 && seq.every((v,p)=>v===p)) seq = shuffle(seq);
  rt.seq = seq;
  function draw(){
    box.innerHTML = '<div class="bank"><span class="bank-t">Drag rows to reorder (or use ▲▼). Position 1 goes first.</span></div><div id="olist">' +
      seq.map((oi,p)=>'<div class="orow drop" data-i="'+oi+'"><span class="onum">'+(p+1)+'</span>' +
        '<span class="mv"><button type="button" class="up" aria-label="Move up">▲</button><button type="button" class="dn" aria-label="Move down">▼</button></span>' +
        '<span class="otext">'+ex.order[oi]+'</span></div>').join('') + '</div>';
    const ol = $('#olist', box);
    $$('.up', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i>0){ [seq[i-1],seq[i]]=[seq[i],seq[i-1]]; draw(); }
    }));
    $$('.dn', ol).forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      const row = b.closest('.orow'); const i = seq.indexOf(+row.dataset.i);
      if(i<seq.length-1){ [seq[i+1],seq[i]]=[seq[i],seq[i+1]]; draw(); }
    }));
    enableDnD(ol, {
      chips:'.orow', targets:'.orow',
      onDrop:(chipEl, tgt)=>{
        if(chipEl===tgt) return;
        const ci = seq.indexOf(+chipEl.dataset.i);
        seq.splice(ci,1);
        const ti = seq.indexOf(+tgt.dataset.i);
        seq.splice(ci < ti ? ti+1 : ti, 0, +chipEl.dataset.i);
        draw();
      },
      onReturn:()=>{}
    });
  }
  draw();
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    seq.forEach((oi,p)=>{
      selected.push(p+'::'+oi); correct.push(p+'::'+p);
      const ok = oi===p;
      rows.push({s: ok?'ok':'bad', t:(ok?'✓ Correct — ':'✗ Wrong — ')+'position '+(p+1)+': "'+ex.order[oi]+'"'+(ok?'':' (correct: "'+ex.order[p]+'")')});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows, correct: ex.order.map((o,i)=>(i+1)+'. '+o).join('   ') };
  };
};

/* ----- spot the wrong line ----- */
WIDGETS.spotline = function(ex, rt, box){
  box.innerHTML = '<div class="bank"><span class="bank-t">Click the ONE line that is wrong.</span></div><div class="lines">' +
    ex.lines.map((l,i)=>'<button type="button" class="linebtn" data-i="'+i+'"><span class="lnum">'+(i+1)+'</span><span>'+l+'</span></button>').join('') + '</div>';
  let sel = -1;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.linebtn'); if(!b) return;
    sel = +b.dataset.i; $$('.linebtn', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  rt.grade = ()=>{
    const ok = sel===ex.flaw;
    return { credit: scoreExercise(sel<0?[]:[String(sel)],[String(ex.flaw)]), multi:false,
      rows:[{s: sel<0?'miss':(ok?'ok':'bad'), t: sel<0 ? '○ Missed — nothing selected' : (ok?'✓ Correct — ':'✗ Wrong — ')+'line '+(sel+1)}],
      correct: 'The wrong line is line '+(ex.flaw+1)+': '+ex.lines[ex.flaw] };
  };
};

/* ----- click the artefact element (keyboard-operable: tabindex + Enter/Space) ----- */
WIDGETS.clickfield = function(ex, rt, box){
  box.innerHTML = '<div class="bank"><span class="bank-t">Click the part of the artefact that answers the question.</span></div><div class="cf">' +
    ex.segments.map((sg,i)=>'<span class="cfspan" data-i="'+i+'" tabindex="0" role="button" aria-label="Segment '+(i+1)+'">'+sg.t+'</span>'+(sg.gap?' ':'')).join('') + '</div>';
  let sel = -1;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.cfspan'); if(!b) return;
    sel = +b.dataset.i; $$('.cfspan', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  box.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const b = e.target.closest('.cfspan'); if(!b) return;
    e.preventDefault(); b.click();
  });
  rt.grade = ()=>{
    const okIdx = ex.segments.findIndex(s=>s.ok);
    const ok = sel===okIdx;
    return { credit: scoreExercise(sel<0?[]:[String(sel)],[String(okIdx)]), multi:false,
      rows:[{s: sel<0?'miss':(ok?'ok':'bad'), t: sel<0?'○ Missed — nothing selected':(ok?'✓ Correct — ':'✗ Wrong — ')+'"'+(ex.segments[sel]?ex.segments[sel].t:'')+'"'}],
      correct: 'Correct element: "'+ex.segments[okIdx].t+'"' };
  };
};

/* ----- multi-step decision tree ----- */
WIDGETS.tree = function(ex, rt, box){
  rt.stepSel = ex.steps.map(()=>-1);
  box.innerHTML = ex.steps.map((st,si)=>{
    const perm = shuffle(st.options.map((_,i)=>i));
    return '<div class="step"><div class="step-h">STEP '+(si+1)+' OF '+ex.steps.length+'</div>' +
      (st.context?'<div class="step-c">'+st.context+'</div>':'') +
      '<div class="step-q">'+st.question+'</div>' +
      '<div class="opts" data-step="'+si+'">' + perm.map((oi,k)=>
        '<button type="button" class="opt" data-v="'+oi+'"><span class="opt-l">'+optLetters(k)+'.</span><span>'+st.options[oi]+'</span></button>').join('') +
      '</div></div>';
  }).join('');
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    const si = +b.closest('.opts').dataset.step;
    rt.stepSel[si] = +b.dataset.v;
    $$('.opts[data-step="'+si+'"] .opt', box).forEach(o=>o.classList.toggle('sel', o===b));
  });
  rt.grade = ()=>{
    const selected=[], correct=[], rows=[];
    ex.steps.forEach((st,si)=>{
      const v = rt.stepSel[si];
      selected.push(si+'::'+v); correct.push(si+'::'+st.correct);
      const ok = v===st.correct;
      rows.push({s: ok?'ok':(v<0?'miss':'bad'),
        t:(ok?'✓ Correct — ':'✗ Wrong — ')+'STEP '+(si+1)+': '+(v<0?'○ Missed — nothing chosen':'you chose: '+st.options[v])});
    });
    return { credit: scoreExercise(selected, correct), multi:true, rows,
      correct: ex.steps.map((st,si)=>'Step '+(si+1)+': '+st.options[st.correct]).join('   ') };
  };
};

/* ================= check / feedback / next ================= */
function onCheck(){
  const { ex, rt } = cur();
  if(rt.answered) return;
  const res = rt.grade();
  let credit = res.credit;
  if(rt.hintUsed) credit = Math.max(0, credit - 0.10);
  rt.credit = credit; rt.answered = true;
  S.creditSum += credit; S.answered += 1;
  if(S.pool.includes(S.order[S.pos])) S.pool = S.pool.filter(x=>x!==S.order[S.pos]);
  /* Check-triggered auto-pause: stop the clock the moment Check is pressed. */
  if(S.tstate==='RUNNING') setT('PAUSED_AUTO_CHECK');
  $('#wbox').classList.add('locked');
  $$('select', $('#wbox')).forEach(s=>s.disabled=true);
  $$('button', $('#wbox')).forEach(b=>b.disabled=true);
  const bc = $('#btnCheck'); if(bc){ bc.disabled = true; }
  const isMulti = res.multi;
  let label, cls;
  if(credit>=1){ label='✓ CORRECT'; cls='fb-ok'; }
  else if(credit>0){ label='✓ PARTIALLY CORRECT'; cls='fb-part'; }
  else { label='✗ INCORRECT'; cls='fb-bad'; }
  const pendingLeft = S.pool.filter(oi=>!S.R[oi].answered).length;
  const last = !S.inReview && S.pos===S.order.length-1 && pendingLeft===0;
  const nextLabel = S.inReview ? '↩ Back to skipped list' : (last ? '⏱ Final Submit' : 'Next exercise →');
  const itemsTxt = isMulti ? '<div class="fb-cred">credit ' + (Math.round(credit*100)/100).toFixed(2) + ' — computed as (right − wrong) ÷ items</div>' : '';
  $('#fbHost').innerHTML =
    '<section class="fb '+cls+'"><div class="fb-h"><span>'+label+'</span>' +
      (isMulti && credit>0 && credit<1 ? '<span class="small dim">per-item breakdown below</span>':'') + '</div>' +
    '<div class="fb-b">' + itemsTxt +
      '<div class="fb-rows">' + res.rows.map(r=>'<div class="r-'+r.s+'">'+r.t+'</div>').join('') + '</div>' +
      '<div class="fb-correct"><b style="color:var(--state-correct)">✓ Model answer:</b> ' + res.correct + '</div>' +
      (rt.hintUsed ? '<div class="small dim" style="margin-top:6px">Includes the −0.10 hint penalty.</div>' : '') +
      '<p class="fb-exp">' + ex.explanation + '</p>' +
      (credit<1 && ex.study ? '<div class="fb-study"><b style="color:var(--accent-amber)">What to study:</b> ' + ex.study + '</div>' : '') +
      '<div class="navrow"><button class="btn btn-pri" id="btnNext">'+nextLabel+'</button></div>' +
    '</div></section>';
  $('#btnNext').addEventListener('click', onNext);
  $('#btnNext').focus();
  updHud();
}

function onNext(){
  if(S.tstate==='PAUSED_AUTO_CHECK') setT('RUNNING');
  if(S.inReview){
    const pending = S.pool.filter(oi=>!S.R[oi].answered);
    if(pending.length && S.tstate!=='ENDED'){ S.view='review'; renderReview(); }
    else finishExam();
    return;
  }
  advance();
}

function manualPause(){
  if(S.tstate!=='RUNNING' && S.tstate!=='PAUSED_AUTO_CHECK') return;
  S.prevState = S.tstate;
  setT('PAUSED_MANUAL');
  $('#ov').style.display = 'flex';
  $('#ovResume').focus();
}
function resumePause(){
  setT(S.prevState || 'RUNNING');
  S.prevState = null;
  $('#ov').style.display = 'none';
}

/* ================= review skipped ================= */
function renderReview(){
  const pending = S.pool.filter(oi=>!S.R[oi].answered);
  $('#app').innerHTML =
    '<header class="hud">' +
      '<span class="badge">' + META.severity + '</span>' +
      '<div class="timerbox"><span class="timer" id="hudTimer"></span><span class="tstate run" id="hudTState"></span></div>' +
      '<span class="scorebox" id="hudScore"></span><span class="sp"></span>' +
      '<button class="btn btn-warn" id="hudPause">⏸ Pause</button>' +
    '</header>' +
    '<div class="progress"><div class="progress-fill" id="pfill"></div></div>' +
    '<div class="wrap">' +
      '<section class="blk blk-scenario"><div class="blk-h">⚠ REVIEW SKIPPED EXERCISES</div><div class="blk-b">' +
        '<p class="dim">You have ' + pending.length + ' skipped exercise(s). You can return to each one and answer it, as many times as you need, while the timer has not ended. Skipped-and-never-answered exercises are excluded from the score.</p>' +
        pending.map(oi=>'<div class="rv-item"><span class="warn">⚠ Skipped</span><span style="flex:1">' + DATA.exercises[oi].label + '</span>' +
          '<button class="btn btn-pri" data-oi="'+oi+'">Answer now</button></div>').join('') +
        '<div class="navrow"><button class="btn btn-pri" id="btnFinish">⏱ Finish exam &amp; see results</button></div>' +
      '</div></section>' +
    '</div>';
  $('#hudPause').addEventListener('click', manualPause);
  $('#btnFinish').addEventListener('click', finishExam);
  $$('button[data-oi]').forEach(b=>b.addEventListener('click', ()=>{
    S.pos = S.order.indexOf(+b.dataset.oi); S.inReview = true; S.view='exam'; renderExamShell();
  }));
  updHud();
  window.scrollTo(0,0);
}

/* ================= results ================= */
function finishExam(){
  setT('ENDED');
  if(tick){ clearInterval(tick); tick=null; }
  S.view='results';
  renderResults();
}
function renderResults(){
  let full=0, part=0, zero=0, skipped=0, partSum=0;
  DATA.exercises.forEach((ex,i)=>{
    const rt = S.R[i];
    if(rt.answered){
      if(rt.credit>=1) full++;
      else if(rt.credit>0){ part++; partSum+=rt.credit; }
      else zero++;
    } else skipped++;
  });
  const answered = S.answered;
  const percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  const passed = percent >= META.passMark;
  const sumR = Math.round(S.creditSum*10)/10;
  const avgPart = part>0 ? (Math.round(partSum/part*100)/100).toFixed(2) : '—';
  $('#app').innerHTML =
    '<div class="wrap">' +
      '<section class="card hero"><h1>' + META.id + ' — ' + META.severity + ' — Results</h1>' +
        '<p class="obj">Score over answered exercises only: <b class="mono" style="color:var(--text-primary)">' + sumR + ' / ' + answered + '</b> · <b class="mono" style="color:var(--text-primary)">' + percent + '%</b> · pass mark ' + META.passMark + '%</p>' +
      '</section>' +
      '<div class="res-grid">' +
        '<div class="res ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct (credit 1.0)</div></div>' +
        '<div class="res part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct (avg '+avgPart+')</div></div>' +
        '<div class="res bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect (credit 0)</div></div>' +
        '<div class="res skip"><div class="num">'+skipped+'</div><div class="lab">⚠ Skipped — excluded from score</div></div>' +
      '</div>' +
      '<div class="verdict '+(passed?'pass':'fail')+'">' +
        (passed
          ? '<h2>✓ PASS</h2><p>You reached ' + percent + '% (threshold ' + META.passMark + '%). Certificate-level performance on ' + META.id + ' at ' + META.severity + ' severity. Take the next severity file when you are ready.</p>'
          : '<h2>✗ FAIL</h2><p>You reached ' + percent + '%, below the ' + META.passMark + '% pass mark. You must retake this exam. Review the explanations you saw during the attempt, then press Retake — exercises and options are shuffled again.</p>') +
        '<div class="navrow"><button class="btn btn-pri" id="btnRetake" style="min-width:200px">↻ Retake exam</button></div>' +
      '</div>' +
      '<p class="pausetime">⏸ Manual pause time: ' + fmt(S.manualSec) + ' · ⏸ Feedback review time (auto-pause): ' + fmt(S.autoSec) + '</p>' +
    '</div>';
  $('#btnRetake').addEventListener('click', ()=>{
    initExam(); S.view='exam'; render(); startTick();
  });
  reportScore();
  window.scrollTo(0,0);
}

/* ================= website integration ================= */
function reportScore(){
  if(S.reported) return; S.reported = true;
  const answeredCount = S.answered;
  const percent = answeredCount>0 ? Math.round((S.creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE', topicId:META.topicId, batch:META.batch,
      score: Math.round(S.creditSum), total: answeredCount,
      percent: percent, passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* opened directly rather than inside the site — nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.user = event.data.username || S.user;
  S.country = event.data.country || S.country;
  S.locale = event.data.locale || S.locale;
  /* theme field is always 'dark' — the exam is dark-only by contract, so nothing to switch */
});

/* ================= resume overlay wiring ================= */
$('#ovResume').addEventListener('click', resumePause);

/* ================= go ================= */
render();
</script>
