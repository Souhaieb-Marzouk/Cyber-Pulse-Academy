<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints of the palette above (single source of truth) */
  --bg-hover:#182238;
  --bg-hover-2:#223154;
  --bg-chip:#1b2a4a;
  --bg-page-96:rgba(11,16,32,.96);
  --bg-page-ov:rgba(11,16,32,.97);
  --tint-blue-05:rgba(90,169,255,.045);
  --tint-blue-07:rgba(90,169,255,.07);
  --tint-blue-08:rgba(90,169,255,.08);
  --tint-blue-10:rgba(90,169,255,.10);
  --tint-amber-07:rgba(255,180,84,.07);
  --tint-amber-08:rgba(255,180,84,.08);
  --tint-amber-12:rgba(255,180,84,.12);
  --tint-amber-28:rgba(255,180,84,.28);
  --tint-amber-40:rgba(255,180,84,.40);
  --tint-amber-45:rgba(255,180,84,.45);
  --tint-green-07:rgba(87,211,140,.07);
  --tint-green-08:rgba(87,211,140,.08);
  --tint-red-07:rgba(255,107,107,.07);
  --tint-red-08:rgba(255,107,107,.08);
  --tint-grey-08:rgba(169,180,208,.08);
  --tint-white-02:rgba(255,255,255,.02);
  --sheen:rgba(255,255,255,.22);
  --btn-p1:#1d3a6b;--btn-p2:#17325e;--btn-pb:#2e5ea8;
  --btn-ph1:#234a8c;--btn-ph2:#1c3f77;
  --btn-g1:#14522f;--btn-g2:#124826;--btn-gb:#2c7a4b;
  --btn-gh1:#19653b;--btn-gh2:#175a30;
  --danger-border:#7a2e2e;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,code,pre{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
a{color:var(--accent-blue)}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
/* ---------- header strip ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--bg-page-96);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
}
.hdr-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hdr .cell{display:flex;align-items:center;gap:6px;min-height:34px}
.hdr .lab{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hdr .val{font-weight:700;font-size:15px}
.hdr .score-sum{color:var(--text-primary);font-weight:800}
.hdr .mono{font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:999px;
  padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;
  background:var(--bg-surface);min-height:28px;
}
.badge .dot{width:9px;height:9px;border-radius:50%}
.sev-easy{color:var(--sev-easy)}.sev-easy .dot{background:var(--sev-easy)}
.sev-medium{color:var(--sev-medium)}.sev-medium .dot{background:var(--sev-medium)}
.sev-hard{color:var(--sev-hard)}.sev-hard .dot{background:var(--sev-hard)}
.sev-extreme{color:var(--sev-extreme)}.sev-extreme .dot{background:var(--sev-extreme)}
.tstate{font-weight:700;font-size:13px}
.tstate.run{color:var(--accent-blue)}
.tstate.pman,.tstate.pauto{color:var(--state-paused)}
.tstate.end{color:var(--state-skipped)}
/* ---------- progress bar ---------- */
.bar{
  position:relative;height:6px;background:var(--bg-surface-2);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.bar-fill{
  height:100%;width:0%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--accent-blue),var(--sev-col,var(--accent-green)));
  transition:width .5s ease;
  position:relative;overflow:hidden;
}
.bar-fill::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 3.2s linear infinite;
}
@keyframes sheen{to{left:120%}}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--bg-surface);color:var(--text-primary);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--btn-p1),var(--btn-p2));border-color:var(--btn-pb)}
.btn.primary:hover{background:linear-gradient(135deg,var(--btn-ph1),var(--btn-ph2))}
.btn.green{background:linear-gradient(135deg,var(--btn-g1),var(--btn-g2));border-color:var(--btn-gb)}
.btn.green:hover{background:linear-gradient(135deg,var(--btn-gh1),var(--btn-gh2))}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger-border);color:var(--state-incorrect)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:4px 12px;font-size:13px}
/* ---------- cards & blocks ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px 18px;
  margin:14px 0;
}
.blk{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.blk-h{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.blk.scenario{border-left-color:var(--accent-blue)}
.blk.scenario .blk-h{color:var(--accent-blue);background:var(--tint-blue-08)}
.blk.question{border-left-color:var(--accent-amber)}
.blk.question .blk-h{color:var(--accent-amber);background:var(--tint-amber-08)}
.blk.answer{border-left-color:var(--accent-green)}
.blk.answer .blk-h{color:var(--accent-green);background:var(--tint-green-08)}
.blk-b{padding:14px 16px;background:var(--bg-surface)}
.blk.scenario .blk-b{background:linear-gradient(0deg,var(--tint-blue-05),var(--tint-blue-05)),var(--bg-surface)}
.qtext{font-weight:700;font-size:16.5px;margin:0}
.sc-sum{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:8px 14px;font-size:13px;cursor:pointer;min-height:44px;
}
.sc-sum:hover{color:var(--text-primary)}
.sc-sum .caret{margin-left:auto;transition:transform .2s ease}
.sc-sum[aria-expanded="true"] .caret{transform:rotate(90deg)}
.sc-body{padding:12px 16px 16px}
.sc-body p{margin:.4em 0 1em}
/* ---------- artefacts ---------- */
.art{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  margin:10px 0;
  overflow:hidden;
}
.art-lab{
  display:block;padding:6px 12px;
  color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.06em;
  border-bottom:1px solid var(--border);
  background:var(--tint-white-02);
}
.art-b{padding:10px 12px;overflow-x:auto}
.art-b.plain{font-size:15px}
.art-b pre{margin:0;font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre}
/* ---------- syntax highlight tokens ---------- */
.tk-k{color:var(--accent-blue);font-weight:700}
.tk-s{color:var(--accent-amber)}
.tk-n{color:var(--accent-green)}
.tk-i{color:var(--state-paused)}
.tk-c{color:var(--text-secondary);font-style:italic}
.tk-w{color:var(--state-incorrect);font-weight:700}
/* ---------- log viewer ---------- */
.logbox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.logbar input{
  flex:1;background:var(--bg-page);border:1px solid var(--border);color:var(--text-mono);
  border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;
}
.logbar .cnt{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.loglines{max-height:320px;overflow:auto;padding:8px 10px}
.loglines pre{margin:0;font-size:14px;line-height:1.55;color:var(--text-mono);white-space:pre;overflow-x:auto}
.loglines .ln-no{color:var(--text-secondary);opacity:.7;margin-right:10px}
.loglines mark{background:var(--tint-amber-28);color:var(--text-primary);border-radius:2px;padding:0 1px}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text-primary);cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;min-height:44px;
  transition:background .12s ease,border-color .12s ease;
}
.opt:hover{background:var(--bg-hover)}
.opt .opt-k{
  flex:0 0 auto;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-chip);border:1px solid var(--border);
  font-weight:800;font-size:13px;color:var(--text-secondary);
}
.opt.sel{border-color:var(--accent-blue);background:var(--tint-blue-10);box-shadow:inset 3px 0 0 var(--accent-blue)}
.opt.sel .opt-k{background:var(--accent-blue);color:var(--bg-page);border-color:var(--accent-blue)}
.opt.sel::after{content:"Selected";margin-left:auto;color:var(--accent-blue);font-size:12px;font-weight:800;white-space:nowrap;padding-top:3px}
.opt.good{border-color:var(--state-correct)}
.opt.bad{border-color:var(--state-incorrect)}
.opt.locked{cursor:default;pointer-events:none}
/* ---------- drag & drop ---------- */
.dnd{display:grid;grid-template-columns:1fr 300px;gap:14px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-content:start}
.zone{
  background:var(--bg-surface-2);border:1.5px dashed var(--border);border-radius:8px;
  padding:10px;min-height:74px;display:flex;flex-direction:column;gap:8px;
}
.zone.over{border-color:var(--accent-green);background:var(--tint-green-07)}
.zone-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.bank{
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start;
}
.bank-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.chip{
  background:var(--bg-chip);border:1px solid var(--border);border-radius:7px;
  padding:9px 12px;font-size:14.5px;cursor:grab;user-select:none;min-height:44px;
  display:flex;align-items:center;gap:8px;
}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--accent-blue);box-shadow:inset 3px 0 0 var(--accent-blue)}
.chip .pickword{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent-blue);text-transform:uppercase}
.chip.dragging{opacity:.55}
.zone .chip{cursor:grab}
/* ---------- order / rank ---------- */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:48px;
}
.orow.dragover{border-color:var(--accent-green)}
.orow .pos{
  flex:0 0 30px;height:30px;border-radius:6px;background:var(--bg-chip);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-secondary);
}
.orow .ot{flex:1;font-size:15px}
.orow .mv{display:flex;gap:6px}
.mv button{
  min-width:44px;min-height:44px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg-hover);color:var(--text-primary);font-size:16px;cursor:pointer;font-weight:800;
}
.mv button:hover{background:var(--bg-hover-2)}
/* ---------- match / fill ---------- */
.pair{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1.2fr);gap:10px;align-items:center;margin-bottom:10px}
.pair .pt{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:44px;display:flex;align-items:center}
select.fill-sel,select.pair-sel{
  background:var(--bg-page);color:var(--text-mono);border:1px solid var(--border);
  border-radius:6px;padding:9px 10px;font-size:14px;min-height:44px;max-width:100%;
}
.filltext{font-size:16px;line-height:2.05}
.filltext select{margin:0 3px}
.bankchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bankchips .chip{cursor:default;min-height:44px;padding:6px 10px;font-size:13.5px}
/* ---------- query editor ---------- */
.qed{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qed-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.qed-bar .prompt{color:var(--accent-green);font-weight:800;font-size:13px}
.qed textarea{
  width:100%;min-height:110px;background:transparent;border:none;color:var(--text-mono);
  font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;
}
.qed textarea:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px}
.copyrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
/* ---------- decision steps ---------- */
.stepbadge{
  display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber-12);
  color:var(--accent-amber);border:1px solid var(--tint-amber-40);
  border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:800;letter-spacing:.05em;margin-bottom:8px;
}
/* ---------- triage queue ---------- */
.alertq{display:flex;flex-direction:column;gap:12px}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.alert-card .at{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-card .at .prio{font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;padding:1px 7px;color:var(--text-secondary)}
.alert-card .ab{color:var(--text-secondary);font-size:14px;margin:6px 0 10px}
.alert-card .asel{display:flex;flex-wrap:wrap;gap:8px}
.asel label{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;
  background:var(--bg-page);padding:8px 12px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.asel label:hover{background:var(--bg-hover)}
.asel input{accent-color:var(--accent-blue)}
.asel label.on{border-color:var(--accent-blue);background:var(--tint-blue-10)}
/* ---------- hint ---------- */
.hintp{
  border:1px solid var(--tint-amber-45);border-left:3px solid var(--accent-amber);
  background:var(--tint-amber-07);border-radius:8px;padding:10px 14px;margin:12px 0;
  color:var(--text-primary);font-size:15px;
}
.hintp .ht{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
/* ---------- feedback ---------- */
.feed{border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.feed-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.feed.ok{border-left-color:var(--state-correct)}
.feed.ok .feed-h{color:var(--state-correct);background:var(--tint-green-08)}
.feed.part{border-left-color:var(--state-partial)}
.feed.part .feed-h{color:var(--state-partial);background:var(--tint-amber-08)}
.feed.bad{border-left-color:var(--state-incorrect)}
.feed.bad .feed-h{color:var(--state-incorrect);background:var(--tint-red-08)}
.feed.skipf{border-left-color:var(--state-skipped)}
.feed.skipf .feed-h{color:var(--state-skipped);background:var(--tint-grey-08)}
.feed-b{padding:12px 16px}
.creditline{font-weight:800;margin:2px 0 10px;font-size:14.5px}
.itms{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.itm{display:flex;gap:9px;align-items:flex-start;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px}
.itm .ic{font-weight:800;flex:0 0 auto}
.itm.correct{color:var(--state-correct)}
.itm.wrong{color:var(--state-incorrect)}
.itm.missed{color:var(--state-skipped)}
.itm .why{color:var(--text-secondary);font-size:13.5px}
.feed .explain{font-size:15px;margin:8px 0}
.feed .study{
  margin-top:10px;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;
  color:var(--text-secondary);font-size:14px;
}
.feed .study b{color:var(--accent-amber)}
.canon{margin-top:10px}
/* ---------- paused overlay ---------- */
.pauseov{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:var(--bg-page-ov);
}
.pauseov .pcard{
  background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);
  padding:26px 34px;text-align:center;color:var(--state-paused);box-shadow:var(--shadow);max-width:440px;
}
.pauseov .pcard .big{font-size:20px;font-weight:800;margin:10px 0 6px}
.pauseov .pcard .sub{color:var(--text-secondary);font-size:14px;margin-bottom:16px}
/* ---------- intro ---------- */
.intro-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.intro-head .t{font-size:20px;font-weight:800;flex:1 1 320px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px}
.facts .f{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary)}
.facts .f b{color:var(--text-primary)}
.kw-theme{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--bg-surface-2)}
.kw-theme .kt{color:var(--accent-blue);font-weight:800;font-size:13.5px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kw-items{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.kw-items .chip{cursor:default;min-height:44px;padding:4px 11px;font-size:13px;background:var(--tint-blue-07)}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{
  position:relative;padding:7px 0 7px 4px;font-size:15px;color:var(--text-primary);
  border-bottom:1px dashed var(--border);
}
.rules li:last-child{border-bottom:none}
.rules li .ric{color:var(--accent-green);font-weight:800;margin-right:7px}
.center{display:flex;justify-content:center;margin-top:18px}
/* ---------- review / results ---------- */
.skiprow{display:flex;align-items:center;gap:12px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0}
.skiprow .st{flex:1;font-size:14.5px}
.skiprow .sicon{color:var(--state-skipped);font-weight:800}

var META = {"topicId": "det0329", "batch": 2, "title": "DET0329 Behavioral Detection for T1490 — Inhibit System Recovery — MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 40, "passMark": 70, "pageTitle": "DET0329 — MEDIUM practice exam", "objectId": "DET0329", "objectName": "Behavioral Detection for T1490 — Inhibit System Recovery", "objectType": "Detection Strategy / Analytic", "timerSeconds": 2400};
var INTRO = {"learn": ["In this MEDIUM exam you go one step deeper into DET0329, the ATT&CK detection strategy for T1490 — Inhibit System Recovery. You already know the basics: attackers delete or disable recovery features (shadow copies, backup catalogs, repair modes) before they encrypt or destroy data. Now you will connect two ideas at a time, the way a SOC analyst does in real work.", "You will read real-looking log lines and decide whether the AN0933 Windows logic or the AN0934 Linux logic fires. You will map data components (like DC0032 Process Creation) to the channels that carry them (like WinEventLog:Sysmon). You will tune mutable elements — the adjustable fields of each analytic, like TimeWindow or UserAgent — to make alerts more precise without losing coverage.", "This object is used daily by several roles. The detection engineer turns each analytic into a SIEM rule and tunes it. The SOC analyst reads its alerts and checks context before escalating. The threat hunter uses the same logic in scheduled searches. The incident responder verifies which recovery options are still alive on a compromised host. The cloud engineer watches the AN0937 chain in CloudTrail.", "The tools you will meet: Sysmon (Windows telemetry with EventCode 1 for processes and 13/14 for registry changes), the Microsoft-Windows-Backup channel (backup catalog events), auditd on Linux (SYSCALL and CONFIG_CHANGE records), hostd on ESXi, syslog on network devices, and AWS CloudTrail. Everything is defanged for safety: an address like 10[.]0[.]44[.]7 is just an IP address written in a safe way.", "Take your time with each exercise: identify the utility, then the arguments, then the matching analytic and data component, and only then decide. Two-step accuracy is the whole point of this level."], "keywords": [{"theme": "Analytics and platforms", "items": ["AN0933 Windows", "AN0934 Linux", "AN0935 ESXi", "AN0936 Network devices", "AN0937 IaaS"]}, {"theme": "Data components to channels", "items": ["DC0032 → Sysmon EC=1", "DC0063 → Sysmon EC=13/14", "DC0040 → Microsoft-Windows-Backup / auditd:CONFIG_CHANGE", "DC0041 → System log", "DC0064 → auditd:SYSCALL / networkdevice:syslog", "DC0049 → esxi:hostd / AWS:CloudTrail", "DC0022 → AWS:CloudTrail"]}, {"theme": "Mutable elements (tuning)", "items": ["TimeWindow", "CommandLinePattern", "ParentProcessContext", "WatchedFilePaths", "ShellProcessUser", "TargetVMNames", "CommandSequenceWindow", "UserPrivilegeLevel", "UserAgent", "ResourceType"]}, {"theme": "Windows behaviour details", "items": ["vssadmin delete shadows /all /quiet", "wbadmin delete catalog -quiet", "bcdedit recoveryenabled no", "REAgentC /disable", "wmic shadowcopy delete", "powershell → diskshadow chains"]}, {"theme": "Linux and cloud behaviour", "items": ["chattr +i on snapshot paths", "rm of rescue.target", "DeleteSnapshot after policy change", "versioning suspension"]}, {"theme": "Triage and tuning workflow", "items": ["Correlate two sources", "Verify change tickets", "Tune with allow-lists", "Escalate destructive patterns"]}], "rules": ["The pass mark is 70%. Your final percentage is computed only over exercises you answered with Check.", "Exercise types in this file: a log viewer with filter, matching, drag & drop, fill-in-the-blank, ordering, an alert queue, a decision tree, spot-the-mistake, and a few multiple-choice questions.", "The timer counts down from 40 minutes. Manual Pause hides the exercise and stops the timer until you press Resume.", "Pressing Check stops the timer automatically (auto-pause) while you read the feedback. It resumes when you press Next.", "Multi-answer exercises are scored with partial credit: correct picks add, wrong picks subtract. Formula: (correct − wrong) / total items.", "One hint per exercise costs 10% of that exercise's credit.", "Skip moves an exercise to a review pool. Before the exam ends you can return to skipped exercises while the timer runs. Unanswered skipped exercises are excluded from the score."]};
var EXERCISES = [{"id": "M01", "type": "logview", "title": "Which data components do these two events hit?", "summary": "Sysmon process start + backup catalog deletion", "scenario": "Tuesday morning, host SRV-FS-02 (file server). Two telemetry records arrive within four seconds of each other. The AN0933 logic correlates process chains and backup damage on Windows. Each record belongs to a data component of the ATT&CK data model; your SIEM maps records to components before the analytic runs.", "question": "Read both records together. Which pair of data components do they hit?", "hint": "First record: a process was created (utility + arguments). Second record: something was deleted in the backup subsystem.", "explanation": "Record 1 is a process creation (Sysmon EventCode=1) → DC0032 Process Creation. Record 2 is a catalog deletion event in the Microsoft-Windows-Backup channel → DC0040 File Deletion. Together they are the classic AN0933 pair: the destructive process (wbadmin delete catalog -quiet) and the backup damage it caused. DC0063 would need a Sysmon registry event (EventCode=13/14) and DC0049 would need a snapshot deletion record — neither appears here.", "study": "Match event shape to component: process start → DC0032; deletion in backup log → DC0040.", "log": ["2026-09-21T03:47:02Z SRV-FS-02 [Sysmon EventCode=1] Image=C:\\Windows\\System32\\wbadmin.exe CommandLine=\"wbadmin delete catalog -quiet\" ParentImage=C:\\Windows\\System32\\cmd.exe User=CORP\\svc_backup", "2026-09-21T03:47:06Z SRV-FS-02 [Microsoft-Windows-Backup] Event=Backup catalog deleted Reason=Catalog corruption or manual deletion CorrelatedProcess=wbadmin.exe", "2026-09-21T03:51:44Z SRV-FS-02 [Sysmon EventCode=1] Image=C:\\Windows\\System32\\wbadmin.exe CommandLine=\"wbadmin get versions\" ParentImage=C:\\Windows\\System32\\cmd.exe User=CORP\\svc_backup"], "options": [{"t": "DC0032 Process Creation + DC0040 File Deletion", "ok": true}, {"t": "DC0032 Process Creation only", "ok": false}, {"t": "DC0063 Registry Key Modification + DC0049 Snapshot Deletion", "ok": false}, {"t": "DC0041 Service Metadata only", "ok": false}]}, {"id": "M02", "type": "match", "title": "Map data components to their channels", "summary": "Where each component lives", "scenario": "Your detection team keeps a mapping sheet: which data component is carried by which log channel. The sheet is used to check telemetry onboarding before AN0933–AN0937 can run. One channel can carry more than one component, but each row here has one best answer, exactly as listed on the DET0329 page.", "question": "Match each data component to the channel that carries it.", "hint": "Sysmon carries two different components here: processes (EC=1) and registry keys (EC=13/14). The System log carries service metadata.", "explanation": "The mapping follows the DET0329 log source tables: DC0032 Process Creation → WinEventLog:Sysmon EventCode=1; DC0063 Windows Registry Key Modification → Sysmon EventCode=13/14; DC0040 File Deletion → Microsoft-Windows-Backup (Windows) or auditd:CONFIG_CHANGE (Linux); DC0041 Service Metadata → WinEventLog:System; DC0064 Command Execution → auditd:SYSCALL (Linux) or networkdevice:syslog (network); DC0049 Snapshot Deletion → esxi:hostd; DC0022 Cloud Storage Deletion → AWS:CloudTrail. Wrong mappings silently break analytics: if you onboard only Sysmon but the catalog events arrive in the Backup channel, AN0933 half-blindly fires on processes only.", "study": "Redraw the DET0329 log source table from memory as a training drill.", "left": [{"id": "L1", "t": "DC0032 Process Creation", "match": "R1"}, {"id": "L2", "t": "DC0063 Registry Key Modification", "match": "R2"}, {"id": "L3", "t": "DC0040 File Deletion (Windows backup)", "match": "R3"}, {"id": "L4", "t": "DC0041 Service Metadata", "match": "R4"}, {"id": "L5", "t": "DC0049 Snapshot Deletion (ESXi)", "match": "R5"}, {"id": "L6", "t": "DC0022 Cloud Storage Deletion", "match": "R6"}], "right": [{"id": "R1", "t": "WinEventLog:Sysmon EventCode=1"}, {"id": "R2", "t": "WinEventLog:Sysmon EventCode=13,14"}, {"id": "R3", "t": "WinEventLog:Microsoft-Windows-Backup"}, {"id": "R4", "t": "WinEventLog:System"}, {"id": "R5", "t": "esxi:hostd"}, {"id": "R6", "t": "AWS:CloudTrail"}]}, {"id": "M03", "type": "qcm", "title": "Which analytic fires on this Linux command?", "summary": "chattr on a snapshot path", "scenario": "An auditd SYSCALL record from host WEB-LNX-11 shows the command 'chattr +i /var/backups/lvm-snapshots' executed by root. The +i flag makes files immutable, so automatic jobs cannot change or recover them. Your colleague thinks only Windows analytics matter for T1490 and wants to ignore it.", "question": "Which DET0329 analytic covers this behaviour, and does it fire?", "hint": "AN0934 watches shell utilities that block snapshot auto-recovery. Which analytic number is Linux again?", "explanation": "AN0934 (Linux) fires. Its logic watches shell utilities — including chattr — used on recovery directories, snapshot paths, or backup configs, and making snapshots immutable blocks snapshot auto-recovery exactly as the analytic description says. The command runs as root, which also matches the ShellProcessUser element. AN0933 is Windows-only, AN0935 is ESXi-only, and AN0937 is cloud API-only. Ignoring Linux telemetry would leave a real gap: many ransomware crews now wipe recovery files on Linux VMs too.", "study": "AN0934 watches chattr, rm, shred, dd on recovery paths via auditd:SYSCALL.", "options": [{"t": "AN0934 — and it fires (chattr blocking snapshot recovery, run by root)", "ok": true}, {"t": "AN0933 — and it fires (chattr is a native utility)", "ok": false}, {"t": "AN0935 — and it fires (snapshots are involved)", "ok": false}, {"t": "No analytic — T1490 is Windows-only behaviour", "ok": false}]}, {"id": "M04", "type": "fill", "title": "Complete the SIEM search for AN0933", "summary": "From logic to search fields", "scenario": "You are turning the AN0933 description into a SIEM search. The logic: process creation events from Sysmon, where the process is one of the six native utilities, and the arguments delete shadow copies, remove backup catalogs, or disable recovery. Your search language reads like a sentence. Fill the four blanks.", "question": "Fill the four blanks of the SIEM search.", "hint": "Process creation in Sysmon is EventCode 1. The catalog-deleting utility is wbadmin; the silent flag on its catalog command is -quiet.", "explanation": "The completed search: index=sysmon EventCode=1 (vssadmin OR wbadmin) (delete OR recoveryenabled) -quiet-correlated catalog. In plain words: select Sysmon process creation events (EventCode=1), narrow to the destructive utilities (vssadmin, wbadmin), require destructive verbs (delete, recoveryenabled). EventCode=1 is the data source filter, the utility names are the CommandLinePattern core, and the verbs are the destructive-action filter. A search with only EventCode=1 fires on every process — useless. The two-step thinking is: which records carry the behaviour, then which values identify it.", "study": "Every analytic = data source filter + behaviour pattern. Write both explicitly.", "parts": ["index=sysmon EventCode=", " (vssadmin OR ", ") (delete OR ", ") | correlate with backup catalog deletion"], "bank": ["1", "wbadmin", "recoveryenabled", "13", "ipconfig", "list"], "answers": ["1", "wbadmin", "recoveryenabled"]}, {"id": "M05", "type": "order", "title": "Order the response steps after a confirmed AN0933 hit", "summary": "What comes first, second, third", "scenario": "AN0933 fired on a file server and triage confirmed the command was destructive and unexplained. Your playbook lists four steps, but the runbook page fell out of the binder. You know the logic: the attacker deletes local recovery features first and often goes for the real backups next, so whatever you do must not lose evidence and must not leave backups exposed while you work.", "question": "Put the four response steps in the correct order.", "hint": "You cannot recover anything later if evidence is gone — but you also should not freeze the host before the backups are safe. Evidence capture happens after isolation.", "explanation": "Correct order: (1) Verify backup integrity — confirm the real backups and their copies are still intact, because stopping the attacker's next move matters most; (2) Isolate the host — cut its network access so it cannot attack backups or spread; (3) Capture command-line evidence — collect the process chain and command lines while the host is contained; (4) Escalate to IR with the evidence for a formal handover. Protecting recovery capability before everything else is the lesson of T1490: the attacker's whole plan is to remove your restore options.", "study": "Read the T1490 mitigation M1053 (Data Backup): protected, off-system backups are the safety net this ordering defends.", "items": [{"id": "O1", "t": "Verify backup integrity and protect backup infrastructure"}, {"id": "O2", "t": "Isolate the affected host from the network"}, {"id": "O3", "t": "Capture command-line and process evidence"}, {"id": "O4", "t": "Escalate to the incident response team with evidence"}], "correct": ["O1", "O2", "O3", "O4"]}, {"id": "M06", "type": "match", "title": "Match each mutable element to what it tunes", "summary": "The tuning knobs of DET0329", "scenario": "Mutable elements are the adjustable fields of an analytic — the knobs a detection engineer turns to fit the organisation. The DET0329 page lists them per analytic with a one-line description. Your tech lead asks you to own two analytics, so you must know which knob solves which problem.", "question": "Match each mutable element to the problem it tunes.", "hint": "TimeWindow is about speed (rapid changes). TargetVMNames is about scope (which VMs matter). UserAgent is about which tool made a cloud call.", "explanation": "TimeWindow tracks rapid recovery-feature changes over short intervals, so it tunes how fast is 'suspicious'. CommandLinePattern tunes which flags count as destructive (for example /all, /quiet, -delete variants). ParentProcessContext tunes the expected parent-child chains (like powershell spawning diskshadow). ShellProcessUser restricts Linux detection to root or sudo users. TargetVMNames limits ESXi snapshot alerts to critical VMs to cut false positives. UserAgent separates legitimate backup automation from unknown tools in CloudTrail. ResourceType scopes the cloud filter to production images or vaults so lab buckets do not page anyone, and WatchedFilePaths extends the Linux watch to the backup configs and LVM snapshot paths that exist in your estate. Each knob trades noise for coverage — document every change.", "study": "List the ten mutable elements of DET0329 and one sentence each.", "left": [{"id": "L1", "t": "TimeWindow (AN0933)", "match": "R1"}, {"id": "L2", "t": "CommandLinePattern (AN0933)", "match": "R2"}, {"id": "L3", "t": "ParentProcessContext (AN0933)", "match": "R3"}, {"id": "L4", "t": "ShellProcessUser (AN0934)", "match": "R4"}, {"id": "L5", "t": "TargetVMNames (AN0935)", "match": "R5"}, {"id": "L6", "t": "UserAgent (AN0937)", "match": "R6"}, {"id": "L7", "t": "ResourceType (AN0937)", "match": "R7"}, {"id": "L8", "t": "WatchedFilePaths (AN0934)", "match": "R8"}], "right": [{"id": "R1", "t": "How fast repeated recovery-feature changes must happen to count"}, {"id": "R2", "t": "Which argument variants count as destructive flags"}, {"id": "R3", "t": "Which parent-child process chains are expected or suspicious"}, {"id": "R4", "t": "Which Linux accounts (root or sudo) the analytic watches"}, {"id": "R5", "t": "Which VM names matter enough to alert on snapshot deletion"}, {"id": "R6", "t": "Which cloud tool identities are legitimate automation"}, {"id": "R7", "t": "Which cloud resource types (production images, vaults) the filter watches"}, {"id": "R8", "t": "Which Linux backup configs and snapshot paths are watched"}]}, {"id": "M07", "type": "triage", "title": "Triage four AN0933/AN0937 alerts", "summary": "Same pattern, different context", "scenario": "Four alerts wait in the queue. Each one matches the general shape of a T1490 behaviour, but the context differs: change tickets, known automation, hours, and host roles all matter. Choose the correct action for each alert.", "question": "Choose the correct action for each of the four alerts.", "hint": "Two alerts are explained by written plans or known automation. Two are not explained by anything — and one of those ran from a suspicious parent.", "explanation": "Alert A (diskshadow from Word-spawned PowerShell at 02:38, no ticket): escalate — a document spawning PowerShell that then deletes shadows is a classic malicious chain. Alert B (scheduled 02:00 Sunday catalog maintenance, ticket CHG-1902): close as planned. Alert C (DeleteSnapshot by UA 'veeam-cloud-worker' on the retention day): close as legitimate automation — the UserAgent mutable element exists to allow-list exactly this. Alert D (vssadmin delete /all /quiet on the DC at 15:42, no ticket): escalate; a domain controller losing shadow copies outside any window is a pre-encryption indicator. Same pattern, four different calls — context decides.", "study": "Triage = pattern (fires?) + context (explained?) + asset value.", "alerts": [{"title": "ALERT-A — HR-WS-13 — powershell → diskshadow delete shadows all", "prio": "HIGH", "body": "A Word document spawned PowerShell, which ran diskshadow with 'delete shadows all' at 02:38. No change ticket. The user is an accountant.", "options": [{"t": "Escalate — suspicious parent chain, no ticket", "ok": true}, {"t": "Close — diskshadow is a native tool", "ok": false}, {"t": "Close — the user probably clicked a macro by accident", "ok": false}]}, {"title": "ALERT-B — SRV-FS-02 — wbadmin delete catalog (02:00 Sunday)", "prio": "MEDIUM", "body": "Weekly backup catalog maintenance runs every Sunday at 02:00 per ticket CHG-1902. The command matches the maintenance window and the service account.", "options": [{"t": "Close — planned maintenance, verified against CHG-1902", "ok": true}, {"t": "Escalate — catalog deletion is always an attack", "ok": false}, {"t": "Isolate the file server now", "ok": false}]}, {"title": "ALERT-C — AWS — DeleteSnapshot by veeam-cloud-worker", "prio": "LOW", "body": "CloudTrail shows DeleteSnapshot from UserAgent 'veeam-cloud-worker' on the scheduled retention day. This automation identity is documented in the allow-list.", "options": [{"t": "Close — legitimate backup automation (UserAgent allow-list)", "ok": true}, {"t": "Escalate — snapshots were deleted", "ok": false}, {"t": "Disable the backup tool immediately", "ok": false}]}, {"title": "ALERT-D — DC-01 — vssadmin delete shadows /all /quiet at 15:42", "prio": "CRITICAL", "body": "The domain controller ran a silent deletion of all shadow copies at 15:42 on a weekday. No ticket, no maintenance window, no documented task.", "options": [{"t": "Escalate — destructive pattern, unexplained, critical host", "ok": true}, {"t": "Close — the DC cleans shadows regularly", "ok": false}, {"t": "Wait for the next shift to decide", "ok": false}]}]}, {"id": "M08", "type": "multi", "title": "Which telemetry does AN0933 require?", "summary": "Select all required sources", "scenario": "A new site is being onboarded and the project manager asks which log sources the Windows analytic (AN0933) needs. The DET0329 page lists four for AN0933. Selecting everything would waste budget; missing one would create a blind spot. Choose correctly.", "question": "Select all log sources that AN0933 requires.", "hint": "Four sources are AN0933's. The other two belong to other analytics (Linux and ESXi).", "explanation": "AN0933 requires: WinEventLog:Sysmon EventCode=1 (DC0032 process creation), WinEventLog:Microsoft-Windows-Backup (DC0040 catalog deletion), WinEventLog:System (DC0041 service metadata, e.g. recovery-disabled via REAgentC), and Sysmon EventCode=13/14 (DC0063 registry key modification). auditd:SYSCALL belongs to AN0934 (Linux) and esxi:hostd belongs to AN0935 (ESXi) — both are correct for the strategy but not required for the Windows analytic. This distinction matters when you size telemetry budgets per site.", "study": "Four AN0933 sources: Sysmon EC=1, Sysmon EC=13/14, Microsoft-Windows-Backup, System.", "options": [{"t": "WinEventLog:Sysmon EventCode=1", "ok": true}, {"t": "WinEventLog:Microsoft-Windows-Backup", "ok": true}, {"t": "WinEventLog:System", "ok": true}, {"t": "WinEventLog:Sysmon EventCode=13,14", "ok": true}, {"t": "auditd:SYSCALL", "ok": false}, {"t": "esxi:hostd", "ok": false}]}, {"id": "M09", "type": "qcm", "title": "What is the best next step for this CloudTrail chain?", "summary": "Two correlated API calls", "scenario": "In CloudTrail you find two calls from the same session within three minutes: first DisableBackupPolicy on the backup bucket, then DeleteSnapshot on three production volumes at 03:14. The UserAgent is unknown. A colleague says: 'One DeleteSnapshot is noise, close it.'", "question": "What is the best next step?", "hint": "AN0937 fires on the chain: disabling backup protection and then deleting snapshots. What does that chain tell you about intent?", "explanation": "The best step is to correlate both calls and escalate as a suspected AN0937 (T1490) chain. The analytic description is exactly this: API calls disabling snapshot scheduling, backup policies, or versioning, followed by DeleteSnapshot or DeleteVolume operations. The disabling call plus the unknown UserAgent makes intent clear — this is not cleanup. Ignoring a single event can be right sometimes, but here the two events form the pattern. Rebooting or deleting the bucket are destructive reactions with no analysis behind them.", "study": "AN0937 = disable (policy/versioning) + delete (snapshot/volume/bucket). The chain is the alert.", "options": [{"t": "Correlate both calls and escalate as a suspected T1490 chain", "ok": true}, {"t": "Close it — a single DeleteSnapshot is always noise", "ok": false}, {"t": "Reboot the production instance to stop the attacker", "ok": false}, {"t": "Delete the backup bucket so the attacker cannot touch it", "ok": false}]}, {"id": "M10", "type": "decision", "title": "Two-step check: wbadmin on the domain controller", "summary": "Scope first, then verify", "scenario": "An alert fires: DC-01 ran 'wbadmin delete catalog -quiet' at 01:12. You have 30 seconds to decide the first move, then one verification step. Answer both steps of this mini decision tree.", "question": "Make the correct call in both steps.", "hint": "Step 1: which analytic covers wbadmin catalog deletion? Step 2: which log would prove the catalog was really damaged?", "explanation": "Step 1: the behaviour is in scope of AN0933 — wbadmin is one of its six watched utilities and 'delete catalog' is one of its destructive actions. Step 2: the proof lives in the Microsoft-Windows-Backup channel (DC0040), which records catalog deletion or corruption events. Checking the printer spooler or a reboot tells you nothing about the backup subsystem. Scope decision first (which analytic), verification second (which source proves it) — that is the two-step habit this level trains.", "study": "Utility in list + destructive argument = in scope. Then pick the channel that corroborates.", "steps": [{"question": "Step 1: wbadmin delete catalog -quiet — which analytic is in scope here?", "options": [{"t": "AN0933 — wbadmin with catalog-deleting arguments", "ok": true}, {"t": "AN0936 — it looks like a device command", "ok": false}, {"t": "AN0937 — wbadmin is a cloud API", "ok": false}]}, {"lead": "Correct — now verify the impact.", "question": "Step 2: which source best verifies that the catalog was actually deleted?", "options": [{"t": "WinEventLog:Microsoft-Windows-Backup (DC0040 catalog event)", "ok": true}, {"t": "The printer spooler log on DC-01", "ok": false}, {"t": "A forced reboot of DC-01", "ok": false}]}]}, {"id": "M11", "type": "logview", "title /* ================= UTILITIES ================= */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmt2(x){return (Math.round(x*100)/100).toFixed(2);}
function $(id){return document.getElementById(id);}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function letters(n){var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';return L.charAt(n%26);}

/* Partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= STATE ================= */
var S = {
  phase:'intro',          /* intro | exam | review | results */
  manualPauseStart:null,
  order:[],               /* shuffled exercise indices */
  cur:0,                  /* position in order */
  answered:{},            /* exId -> credit (float) */
  answeredFlags:{},       /* exId -> true (checked) */
  autoPauseStart:null,
  skipped:[],             /* exIds currently in skipped pool */
  everSkipped:{},         /* exId -> true */
  hintUsed:{},            /* exId -> true */
  reviewed:false,         /* visited review screen at end */
  reviewMode:null,        /* exId being answered from review */
  reported:false,
  manualPauseTotal:0,     /* seconds */
  autoPauseTotal:0,       /* seconds */
  user:{name:'',country:'',locale:'en'}
};

var TIMER = {
  total: META.timerSeconds,
  remaining: META.timerSeconds,
  state:'IDLE',           /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  interval:null,
  perEx:0,                /* per-exercise remaining (EXTREMELY HARD query only) */
  perExTotal:0
};

function timerSet(st){
  TIMER.state=st;
  var el=$('tstate');
  if(el){
    var map={
      IDLE:['&#96;','READY','end'],
      RUNNING:['&#9654;','RUNNING','run'],
      PAUSED_MANUAL:['&#10073;&#10073;','PAUSED — manual (press Resume)','pman'],
      PAUSED_AUTO_CHECK:['&#10073;&#10073;','PAUSED — reviewing feedback (resumes on Next)','pauto'],
      ENDED:['&#9632;','ENDED','end']
    };
    var m=map[st]||map.IDLE;
    el.className='tstate '+m[2];
    el.innerHTML='<span aria-hidden="true">'+m[0]+'</span> <span>'+m[1]+'</span>';
    el.setAttribute('aria-label','Timer state: '+m[1]);
  }
}
function timerStartTicks(){
  if(TIMER.interval){return;}
  TIMER.interval=setInterval(function(){
    if(TIMER.state!=='RUNNING'){return;}
    TIMER.remaining-=1;
    if(TIMER.perExTotal>0 && !$('exwrap').classList.contains('hidden')){
      TIMER.perEx=Math.max(0,TIMER.perEx-1);
      var pe=$('perextime');
      if(pe){pe.textContent=fmtClock(TIMER.perEx);}
      if(TIMER.perEx===0){onPerExExpired();}
    }
    if(TIMER.remaining<=0){
      TIMER.remaining=0;
      timerEnded();
    }
    updateHeader();
  },1000);
}
function timerEnded(){
  clearInterval(TIMER.interval);TIMER.interval=null;
  timerSet('ENDED');
  finishExam(true);
}
function updateHeader(){
  $('tclock').textContent=fmtClock(TIMER.remaining);
  var sum=0,cnt=0;
  for(var k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];cnt++;}}
  $('scoreval').innerHTML='<span class="score-sum">'+fmt1(sum)+'</span> <span class="dim">/ '+cnt+'</span>';
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  $('scorepct').textContent=pct+'%';
  var done=S.cur;
  if(S.phase==='review'||S.phase==='results'){done=S.order.length;}
  $('barfill').style.width=Math.round(100*Math.min(1,done/S.order.length))+'%';
}

/* ================= NAV / RENDER HELPERS ================= */
function setSeverity(sev){
  var b=$('sevbadge');
  var cls={'easy':'sev-easy','medium':'sev-medium','hard':'sev-hard','extremely-hard':'sev-extreme'}[sev]||'sev-easy';
  var word={'easy':'EASY','medium':'MEDIUM','hard':'HARD','extremely-hard':'EXTREMELY HARD'}[sev]||sev;
  b.className='badge '+cls;
  b.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+word+'</span>';
  document.documentElement.style.setProperty('--sev-col',
    {'easy':'var(--sev-easy)','medium':'var(--sev-medium)','hard':'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'}[sev]);
  var b2=$('sevbadge2');
  if(b2){b2.className='badge '+cls;b2.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+word+'</span>';}
}

/* ================= EXAM FLOW ================= */
function startExam(){
  S.phase='exam';S.cur=0;S.order=[];
  var idx=[];for(var i=0;i<EXERCISES.length;i++){idx.push(i);}
  S.order=shuffle(idx);
  S.answered={};S.answeredFlags={};S.skipped=[];S.everSkipped={};S.hintUsed={};
  S.reviewed=false;S.reviewMode=null;S.reported=false;
  S.manualPauseTotal=0;S.autoPauseTotal=0;S.autoPauseStart=null;S.manualPauseStart=null;
  S.answers={};S.results={};S.dec={};CURSEL=[];
  for(var r=0;r<EXERCISES.length;r++){
    delete EXERCISES[r]._shufOpts;delete EXERCISES[r]._shufR;
    delete EXERCISES[r]._shufItems;delete EXERCISES[r]._shufOrder;delete EXERCISES[r]._shufBank;
  }
  TIMER.total=META.timerSeconds;TIMER.remaining=META.timerSeconds;
  timerSet('RUNNING');timerStartTicks();
  $('intro').classList.add('hidden');
  $('results').classList.add('hidden');
  $('review').classList.add('hidden');
  $('exam').classList.remove('hidden');
  $('hdrbar').classList.remove('hidden');
  $('bar').classList.remove('hidden');
  renderCurrent();
}
function currentExercise(){
  if(S.reviewMode){return byId(EXERCISES,S.reviewMode);}
  return EXERCISES[S.order[S.cur]];
}
function isLastPosition(){
  return S.cur>=S.order.length-1;
}
function renderCurrent(){
  var ex=currentExercise();
  if(!ex){finishExam(false);return;}
  var posLabel=S.reviewMode?('Reviewing a skipped exercise'):(S.reviewed?'Review skipped':'Exercise '+(S.cur+1)+' of '+S.order.length);
  $('excount').textContent=posLabel;
  var per='';
  if(ex.perTimeSec && !S.answeredFlags[ex.id]){
    TIMER.perEx=ex.perTimeSec;TIMER.perExTotal=ex.perTimeSec;
    per='<div class="small dim" style="margin-top:6px">&#9201; This exercise has its own reduced timer: <b id="perextime" class="mono">'+fmtClock(TIMER.perEx)+'</b> ('+Math.round(ex.perTimeSec/60)+' min). It stops while feedback is open and resumes on Next.</div>';
  }else{TIMER.perExTotal=0;TIMER.perEx=0;}
  $('exwrap').innerHTML='<div class="card">'+per+'<div id="exbody"></div></div>';
  renderExercise(ex);
  updateHeader();
}
function onPerExExpired(){
  if(TIMER.perExTotal===0){return;}
  TIMER.perExTotal=0;TIMER.perEx=0;
  var ex=currentExercise();
  if(ex && !S.answeredFlags[ex.id]){
    if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
    toastSkipped(ex);
    if(S.reviewMode){exitReview();}else{advanceNext(false);}
  }
}
function toastSkipped(ex){
  var t=$('toast');
  t.innerHTML='<span class="sicon">&#9888; Skipped</span> — “'+esc(ex.title)+'” moved to the skipped pool. You can return to it before you submit.';
  t.classList.remove('hidden');
  clearTimeout(toastSkipped._t);
  toastSkipped._t=setTimeout(function(){t.classList.add('hidden');},4200);
}

/* Manual pause */
function togglePause(){
  if(S.phase!=='exam'&&S.phase!=='review'){return;} /* no manual pause on intro/results */
  var ov=$('pauseov');
  if(TIMER.state==='PAUSED_MANUAL'){
    ov.classList.add('hidden');
    if(S.manualPauseStart){S.manualPauseTotal+=Math.round((Date.now()-S.manualPauseStart)/1000);S.manualPauseStart=null;}
    if(S.pausedFrom==='PAUSED_AUTO_CHECK'){timerSet('PAUSED_AUTO_CHECK');}
    else{timerSet('RUNNING');}
    S.pausedFrom=null;
  }else{
    if(TIMER.state==='ENDED'){return;} /* too late to pause */
    S.pausedFrom=TIMER.state==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':null;
    S.manualPauseStart=Date.now();
    timerSet('PAUSED_MANUAL');
    ov.classList.remove('hidden');
  }
}

/* Hint */
function useHint(){
  var ex=currentExercise();
  if(!ex||S.hintUsed[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var hp=$('hintpanel');
  hp.classList.remove('hidden');
  hp.innerHTML='<div class="ht"><span aria-hidden="true">&#128161;</span><span>HINT — costs 10% of this exercise credit</span></div><div>'+esc(ex.hint)+'</div>';
  $('hintbtn').disabled=true;
}

/* Skip */
function skipCurrent(){
  var ex=currentExercise();
  if(!ex||S.answeredFlags[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  S.everSkipped[ex.id]=true;
  if(S.reviewMode){exitReview();}
  else{advanceNext(false);}
}

/* Advance to next exercise or review/results */
function advanceNext(afterCheck){
  S.reviewMode=null;
  S.cur++;
  if(S.cur>=S.order.length){
    maybeReview();
    return;
  }
  renderCurrent();
}
function maybeReview(){
  if(S.skipped.length>0 && TIMER.remaining>0 && TIMER.state!=='ENDED'){
    showReview();
  }else{
    finishExam(false);
  }
}
function showReview(){
  S.phase='review';
  $('exam').classList.add('hidden');
  $('review').classList.remove('hidden');
  var html='<div class="card"><h2 style="font-size:18px;margin:2px 0 8px"><span aria-hidden="true">&#9888;</span> Review skipped exercises</h2>'
    +'<p class="dim" style="margin:4px 0 12px">These exercises were skipped and not answered. You can go back to any of them now and answer it, as long as the timer has not ended. If you submit now, skipped exercises are excluded from your score — they do not count as correct or wrong.</p>';
  for(var i=0;i<S.skipped.length;i++){
    var ex=byId(EXERCISES,S.skipped[i]);
    html+='<div class="skiprow"><span class="sicon" aria-hidden="true">&#9888;</span>'
      +'<span class="st">Skipped — '+esc(ex.title)+'</span>'
      +'<button class="btn small" data-ans="'+esc(ex.id)+'" type="button">Answer</button></div>';
  }
  html+='</div><div class="center" style="gap:12px;flex-wrap:wrap">'
    +'<button class="btn" id="backbtn" type="button">&#8592; Back to the exam</button>'
    +'<button class="btn primary" id="submitanyway" type="button">Submit anyway — '+S.skipped.length+' will be excluded</button></div>';
  $('review').innerHTML=html;
  $('backbtn').addEventListener('click',function(){
    S.phase='exam';
    $('review').classList.add('hidden');
    $('exam').classList.remove('hidden');
    S.cur=Math.min(S.cur,S.order.length-1);
    renderCurrent();
  });
  $('submitanyway').addEventListener('click',function(){finishExam(false);});
  var btns=$('review').querySelectorAll('[data-ans]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click',function(ev){
      S.reviewMode=ev.currentTarget.getAttribute('data-ans');
      S.phase='exam';
      $('review').classList.add('hidden');
      $('exam').classList.remove('hidden');
      renderCurrent();
    });
  }
}
function exitReview(){
  S.reviewMode=null;
  showReview();
}

/* ================= FEEDBACK + NAV ================= */
function afterCheckCommon(ex,res){
  var credit=res.credit;
  if(S.hintUsed[ex.id]){credit=Math.max(0,credit-0.10);res.hintApplied=true;}
  res.credit=credit;
  S.answered[ex.id]=credit;
  S.answeredFlags[ex.id]=true;
  var pos=S.skipped.indexOf(ex.id);
  if(pos>=0){S.skipped.splice(pos,1);}
  /* Check-triggered auto-pause (state machine transition) */
  if(TIMER.state==='RUNNING'){S.autoPauseStart=Date.now();}
  if(TIMER.state!=='ENDED'){timerSet('PAUSED_AUTO_CHECK');}
  updateHeader();
}
function renderNavAfterCheck(ex){
  var nav=$('exnav');
  nav.innerHTML='';
  var last=!S.reviewMode && isLastPosition();
  var next=document.createElement('button');
  next.type='button';
  next.className='btn primary';
  next.innerHTML=S.reviewMode
    ?'&#8592; Back to skipped list'
    :(last?'Final Submit &#8594;':'Next exercise &#8594;');
  next.addEventListener('click',function(){
    if(TIMER.state==='PAUSED_AUTO_CHECK'||TIMER.state==='RUNNING'){
      if(TIMER.state==='PAUSED_AUTO_CHECK'&&S.autoPauseStart){
        S.autoPauseTotal+=Math.round((Date.now()-S.autoPauseStart)/1000);S.autoPauseStart=null;
      }
      if(TIMER.state!=='ENDED'){timerSet('RUNNING');}
    }
    if(S.reviewMode){exitReview();}
    else if(isLastPosition()){maybeReview();}
    else{advanceNext(true);}
  });
  nav.appendChild(next);
}

/* ================= FINISH + RESULTS ================= */
function finishExam(byTimeout){
  clearInterval(TIMER.interval);TIMER.interval=null;
  if(TIMER.state!=='ENDED'){timerSet('ENDED');}
  S.phase='results';
  $('exam').classList.add('hidden');
  $('review').classList.add('hidden');
  $('pauseov').classList.add('hidden');
  var results=computeResults();
  renderResults(results,byTimeout);
  $('results').classList.remove('hidden');
  if(!S.reported){reportScore(results);S.reported=true;}
  window.scrollTo(0,0);
}
function computeResults(){
  var sum=0,cnt=0,full=0,part=0,bad=0,partSum=0;
  for(var i=0;i<EXERCISES.length;i++){
    var id=EXERCISES[i].id;
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];sum+=c;cnt++;
      if(c>=0.9999){full++;}
      else if(c>0){part++;partSum+=c;}
      else{bad++;}
    }
  }
  var skippedNow=0;
  for(var j=0;j<EXERCISES.length;j++){
    var id2=EXERCISES[j].id;
    if(!S.answered.hasOwnProperty(id2)){skippedNow++;}
  }
  var percent=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,full:full,part:part,partAvg:part>0?partSum/part:0,bad:bad,skipped:skippedNow,percent:percent};
}
function renderResults(r,byTimeout){
  var passed=r.percent>=META.passMark && r.cnt>0;
  $('results').innerHTML=''
    +'<div class="card">'
    +'<div class="bigscore">'+fmt1(r.sum)+' <span class="pc">/ '+r.cnt+'</span></div>'
    +'<div style="text-align:center" class="dim">final score over answered exercises &middot; <b style="color:var(--text-primary)">'+r.percent+'%</b> (pass mark '+META.passMark+'%)</div>'
    +'<div class="resgrid">'
    +'<div class="rescard ok"><div class="rn">'+r.full+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Fully correct</span></div></div>'
    +'<div class="rescard part"><div class="rn">'+r.part+'</div><div class="rl"><span aria-hidden="true">&#10003;</span><span>Partially correct'+(r.part>0?' — avg '+fmt2(r.partAvg):'')+'</span></div></div>'
    +'<div class="rescard bad"><div class="rn">'+r.bad+'</div><div class="rl"><span aria-hidden="true">&#10007;</span><span>Fully incorrect</span></div></div>'
    +'<div class="rescard skipc"><div class="rn">'+r.skipped+'</div><div class="rl"><span aria-hidden="true">&#9888;</span><span>Skipped — excluded</span></div></div>'
    +'</div>'
    +(byTimeout?'<p class="small dim" style="text-align:center">The timer ended, so any exercises that were not answered were excluded from the score.</p>':'')
    +'<div class="pstat"><span>&#9201; Time paused manually: <b>'+fmtClock(S.manualPauseTotal)+'</b></span>'
    +'<span>&#10073;&#10073; Time reviewing feedback: <b>'+fmtClock(S.autoPauseTotal)+'</b></span></div>'
    +'<div class="passpanel '+(passed?'okp':'failp')+'">'
    +'<div class="pt">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'
    +'<div class="ps">'+(passed
      ?'Well done. You reached the pass mark of '+META.passMark+'% on this severity. Keep going with the next difficulty level of this topic.'
      :'You must retake this exam to reach the '+META.passMark+'% pass mark. Review the feedback you collected, then press Retake Exam — the exercise order and answer choices will be shuffled.')+'</div>'
    +'</div>'
    +'<div class="center"><button class="btn primary" id="retakebtn" type="button">&#8635; Retake Exam</button></div>'
    +'</div>';
  $('retakebtn').addEventListener('click',function(){
    $('results').classList.add('hidden');
    renderIntro();
    window.scrollTo(0,0);
  });
}
/* Site score report — exactly once per attempt, at results screen */
function reportScore(r){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(r.sum),
      total:r.cnt,
      percent:r.percent,
      passed:r.percent>=META.passMark
    },location.origin);

}

/* ================= SYNTAX HIGHLIGHT (single-pass, safe) ================= */
var HL_RE=new RegExp(
  '(\\d{1,3}(?:\\[\\.\\]){3}\\d{1,3})'+
  '|(&quot;[^&\\n]*&quot;)'+
  '|(\\bEventCode\\s*=\\s*\\d+)'+
  '|(\\b(?:vssadmin|wbadmin|diskshadow|bcdedit|reagentc|wmic|chattr|shred|vim-cmd|esxi|hostd|auditd|sysmon|cloudtrail|powershell|cmd)\\b)'+
  '|(\\b(?:delete|remove|removeall|erase|format|reload|shadowcopy|shadows|catalog|recoveryenabled|disable|snapshot|rescue\\.target|fstab|bootstatuspolicy)\\b)'+
  '|(#[^\\n<]*)'+
  '|(\\b\\d+\\b)','gi');
function hl(text){
  var e=esc(text);
  return e.replace(HL_RE,function(m,ip,str,ec,kw,verb,com,num){
    if(ip){return '<span class="tk-i">'+ip+'</span>';}
    if(str){return '<span class="tk-s">'+str+'</span>';}
    if(ec){return '<span class="tk-k">'+ec+'</span>';}
    if(kw){return '<span class="tk-k">'+kw+'</span>';}
    if(verb){return '<span class="tk-w">'+verb+'</span>';}
    if(com){return '<span class="tk-c">'+com+'</span>';}
    if(num){return '<span class="tk-n">'+num+'</span>';}
    return m;
  });
}

/* ================= OPTIONS (qcm / spot / multi) ================= */
function renderOpts(ex,selArr,multi){
  var shuffled=ex._shufOpts||(ex._shufOpts=shuffle(ex.options.map(function(o,i){return {o:o,i:i};})));
  var h='<div class="opts" id="optlist">';
  for(var i=0;i<shuffled.length;i++){
    var k=letters(i);
    var isSel=selArr.indexOf(shuffled[i].i)>=0;

      +'<span class="opt-k" aria-hidden="true">'+k+'.</span><span>'+esc(shuffled[i].o.t)+'</span></button>';
  }
  h+='</div>';
  if(multi){h+='<div class="small dim" style="margin-top:8px">Select all that apply, then press Check. Partial credit applies.</div>';}

function gradeOpts(ex,sel,multi){
  var okIdx=[],N=0,H=0,W=0,items=[];
  for(var i=0;i<ex.options.length;i++){if(ex.options[i].ok){okIdx.push(i);N++;}}
  for(var j=0;j<sel.length;j++){
    var sj=sel[j];if(sj==null){continue;}
    if(okIdx.indexOf(sj)>=0){H++;items.push({status:'correct',label:ex.options[sj].t.slice(0,90)});}
    else{W++;items.push({status:'wrong',label:ex.options[sj].t.slice(0,90),why:'Not part of the correct answer.'});}
  }
  for(var k=0;k<okIdx.length;k++){
    if(sel.indexOf(okIdx[k])<0){items.push({status:'missed',label:ex.options[okIdx[k]].t.slice(0,90),why:'This belongs in the correct answer.'});}
  }
  var corr=okIdx.map(function(i){return ex.options[i].t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:multi?items:null,correctSummary:esc(corr)};
}

  }
  h+='<div class="small dim">Pick one match for each row.</div>';

function gradeMatch(ex,ans){
  var N=ex.left.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var L=ex.left[i];
    var chosen=ans[L.id]||'';
    if(!chosen){items.push({status:'missed',label:L.t,why:'Correct match: '+byId(ex.right,L.match).t});}
    else if(chosen===L.match){H++;items.push({status:'correct',label:L.t});}
    else{W++;items.push({status:'wrong',label:L.t+' → '+byId(ex.right,chosen).t,why:'Correct match: '+byId(ex.right,L.match).t});}
  }
  var corr=ex.left.map(function(L){return L.t+' → '+byId(ex.right,L.match).t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(corr)};
}

function gradeDND(ex){
  var N=ex.items.length,H=0,W=0,items=[];
  var placed=S.answers[ex.id]||{};
  var zoneName={};for(var z=0;z<ex.zones.length;z++){zoneName[ex.zones[z].id]=ex.zones[z].t;}
  for(var i=0;i<N;i++){
    var it=ex.items[i];var got=placed[it.id]||'';
    if(!got){items.push({status:'missed',label:it.t,why:'Belongs in: '+zoneName[it.zone]});}
    else if(got===it.zone){H++;items.push({status:'correct',label:it.t+' → '+zoneName[it.zone]});}
    else{W++;items.push({status:'wrong',label:it.t+' → '+zoneName[got],why:'Correct zone: '+zoneName[it.zone]});}
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,
    correctSummary:esc(ex.items.map(function(it){return it.t+' → '+zoneName[it.zone];}).join(' • '))};
}

/* ================= ORDER / TIMELINE ================= */
function renderOrder(ex){
  var disp=S.answers[ex.id];
  if(!disp||disp.length!==ex.items.length){
    disp=ex._shufOrder||(ex._shufOrder=shuffle(ex.items.map(function(i){return i.id;})));
  }
  S.answers[ex.id]=disp.slice();
  var h='<div class="orderlist" id="orderlist">';
  for(var i=0;i<disp.length;i++){
    var it=byId(ex.items,disp[i]);
    h+='<div class="orow" data-oid="'+it.id+'" draggable="true"><span class="pos">'+(i+1)+'</span><span class="ot">'+esc(it.t)+'</span>'
      +'<span class="mv"><button type="button" data-up="'+it.id+'" aria-label="Move up">&#8593;</button><button type="button" data-down="'+it.id+'" aria-label="Move down">&#8595;</button></span></div>';
  }
  h+='</div><div class="small dim" style="margin-top:8px">Use the arrows (or drag rows) to put the items in the right order.</div>';
  return h;
}
function gradeOrder(ex){
  var disp=S.answers[ex.id]||[];
  var N=ex.items.length,H=0,W=0,items=[];
  var correct=ex.correct;
  for(var i=0;i<N;i++){
    var got=disp[i];
    var it=byId(ex.items,got);
    var label=it?it.t:'?';
    if(got===correct[i]){H++;items.push({status:'correct',label:'Position '+(i+1)+': '+label});}
    else{W++;items.push({status:'wrong',label:'Position '+(i+1)+': '+label,why:'Correct here: '+byId(ex.items,correct[i]).t});}
  }
  var corr=correct.map(function(id,j){return (j+1)+'. '+byId(ex.items,id).t;}).join(' • ');
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(corr)};
}

/* ================= FILL IN THE BLANK ================= */
function renderFill(ex){
  var shufBank=ex._shufBank||(ex._shufBank=shuffle(ex.bank.slice()));
  var saved=S.answers[ex.id]||[];
  var h='<div class="filltext">';
  for(var i=0;i<ex.parts.length;i++){
    h+=esc(ex.parts[i]);
    if(i<ex.parts.length-1){
      var cur=saved[i]||'';
      h+='<select class="fill-sel" data-blank="'+i+'" aria-label="Blank '+(i+1)+'"><option value="">— ? —</option>';
      for(var j=0;j<shufBank.length;j++){
        h+='<option value="'+esc(shufBank[j])+'"'+(cur===shufBank[j]?' selected':'')+'>'+esc(shufBank[j])+'</option>';
      }
      h+='</select>';
    }
  }
  h+='</div><div class="bankchips">';
  for(var k=0;k<shufBank.length;k++){h+='<span class="chip">'+esc(shufBank[k])+'</span>';}
  h+='</div>';
  return h;
}
function gradeFill(ex,ans){
  var N=ex.answers.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var got=(ans&&ans[i])||'';
    if(!got){items.push({status:'missed',label:'Blank '+(i+1),why:'Correct: '+ex.answers[i]});}
    else if(got===ex.answers[i]){H++;items.push({status:'correct',label:'Blank '+(i+1)+': '+got});}
    else{W++;items.push({status:'wrong',label:'Blank '+(i+1)+': '+got,why:'Correct: '+ex.answers[i]});}
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,correctSummary:esc(ex.answers.join(' • '))};
}

/* ================= LOG VIEWER ================= */
function renderLogview(ex){
  return '<div class="logbox"><div class="logbar"><span aria-hidden="true" style="color:var(--accent-blue)">&#128269;</span>'
    +'<input type="text" id="logfilter" placeholder="Filter lines (text match)…" aria-label="Filter log lines">'
    +'<span class="cnt" id="logcnt"></span></div><div class="loglines" id="loglines"></div></div>'
    +'<div class="small dim" style="margin:8px 0 10px">Use the filter box like a SIEM search bar. It does not affect scoring.</div>';
}
function drawLog(ex,filter){
  var box=$('loglines');if(!box){return;}
  var f=(filter||'').toLowerCase();
  var shown=0,h='';
  for(var i=0;i<ex.log.length;i++){
    var line=ex.log[i];
    if(f&&line.toLowerCase().indexOf(f)<0){continue;}
    shown++;
    h+='<pre><span class="ln-no">'+String(i+1).padStart(3,'0')+'</span>'+hl(line)+'</pre>';
  }
  if(shown===0){h='<pre><span class="ln-no">000</span><span class="tk-c"># no lines match this filter</span></pre>';}
  box.innerHTML=h;
  var cnt=$('logcnt');if(cnt){cnt.textContent=shown+' / '+ex.log.length+' lines';}
}

/* ================= QUERY EDITOR ================= */
function renderQuery(ex){
  var saved=S.answers[ex.id]||'';
  return '<div class="qed"><div class="qed-bar"><span class="prompt mono">'+esc(ex.editorPrompt||'search')+'</span>'
    +'<span class="small dim">'+esc(ex.editorNote||'Type your query, then press Check.')+'</span></div>'
    +'<textarea id="qinput" spellcheck="false" aria-label="Query editor" placeholder="'+esc(ex.placeholder||'')+'">'+esc(saved)+'</textarea></div>'
    +(ex.syntaxPanel?'<div class="art" style="margin-top:10px"><span class="art-lab mono">SYNTAX PANEL — available sources &amp; fields</span><div class="art-b"><pre>'+hl(ex.syntaxPanel)+'</pre></div></div>':'');
}
function normQuery(q){
  return String(q||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/\s*=\s*/g,'=');
}
function gradeQuery(ex){
  var q=normQuery($('qinput')?$('qinput').value:(S.answers[ex.id]||''));
  var N=ex.elements.length,H=0,W=0,items=[];
  for(var i=0;i<N;i++){
    var el=ex.elements[i];
    var re=new RegExp(el.re,'i');
    if(re.test(q)){H++;items.push({status:'correct',label:el.label});}
    else{items.push({status:'missed',label:el.label,why:el.why});}
  }
  if(ex.bad){
    for(var j=0;j<ex.bad.length;j++){
      var bd=ex.bad[j];
      var re2=new RegExp(bd.re,'i');
      if(re2.test(q)){W++;items.push({status:'wrong',label:bd.label,why:bd.why});}
    }
  }
  return {credit:scoreExercise(H,W,N),H:H,W:W,N:N,items:items,canonical:ex.canonical,
    correctSummary:'Every required element is listed above and shown in the canonical query below.'};
}

/* ================= DECISION TREE ================= */

  var step=ex.steps[st.step];

  h+='<p class="small dim" style="margin:2px 0 8px">'+esc(step.question)+'</p><div class="opts">';

    var sel=st.answers[st.step]===i;

      +'<span class="opt-k" aria-hidden="true">'+letters(i)+'.</span><span>'+esc(step.options[i].t)+'</span></button>';
  }

}

/* ================= TRIAGE QUEUE ================= */
function renderTriage(ex){
  var saved=S.answers[ex.id]||{};
