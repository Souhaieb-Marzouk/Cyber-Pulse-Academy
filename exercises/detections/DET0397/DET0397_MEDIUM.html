var INTRO = {"html": "\n<div class=\"intro-head\">\n  <h1>DET0397 — MEDIUM practice exam</h1>\n  <div class=\"obj\">MITRE ATT&amp;CK Detection Strategy <b>DET0397</b> — Automated Exfiltration Detection Strategy<br>\n  Detects: <b>T1020 — Automated Exfiltration</b> (Tactic: Exfiltration) · Enterprise domain</div>\n  <span class=\"badge medium\" role=\"img\" aria-label=\"Severity MEDIUM\">MEDIUM</span>\n  <span id=\"intro-greet\" style=\"margin-left:10px;color:var(--text-secondary);font-size:.92rem\"></span>\n  <div class=\"facts\" style=\"margin-top:12px\">\n    <span class=\"fact\">Exercises: <b>17</b></span>\n    <span class=\"fact\">Estimated time: <b>45 min</b></span>\n    <span class=\"fact\">Timer budget: <b>45 min</b></span>\n    <span class=\"fact\">Pass mark: <b>70%</b></span>\n    <span class=\"fact\">Scoring: <b>partial credit</b></span>\n  </div>\n</div>\n<div class=\"card\">\n  <h2>What you will learn here</h2>\n  <p>Hello! In this exam you will learn about <b>DET0397</b>, the <b>Automated Exfiltration Detection Strategy</b> from the MITRE ATT&amp;CK framework.</p><p>First, what is a <b>detection strategy</b>? In ATT&amp;CK, a detection strategy is a plan that tells defenders <i>how</i> to notice one attacker behaviour. It says which logs to collect, what pattern to look for, and which parts you can tune for your own company. DET0397 watches for <b>T1020 — Automated Exfiltration</b>. That is when malware sends stolen data out by itself, again and again, without a human typing anything. The data often leaves in small pieces, on a schedule, so it looks quiet and normal.</p><p>Who uses this in real work? <b>Detection engineers</b> build the rules. <b>SOC analysts</b> get the alerts and decide if they are real. <b>Threat hunters</b> search old logs for the same pattern. <b>Incident responders</b> use it to see what data left a hacked host. <b>CTI analysts</b> connect the pattern to known groups. The tools are a SIEM, EDR on computers, and network flow sensors.</p><p>Why does it matter? If data leaves your network silently, the damage is often found months later. This detection gives you an early alarm.</p><p>You will meet this object in: alert triage queues, detection rule reviews, threat-hunt notes, tuning meetings, and incident reports. The risks it addresses are silent data theft, long-dwell breaches, and lost customer data.</p><p>This MEDIUM file combines <b>two ideas</b> per exercise. You must decide what to look at first.\n</div>\n<div class=\"card\">\n  <h2>Keywords covered in this exam</h2>\n  <div class='kw-theme'>The detection object and ATT&CK position</div><div class='chips'><span class='chip'>T1020 vs T1029 Scheduled Transfer</span><span class='chip'>T1041 Exfiltration Over C2 Channel</span><span class='chip'>T1020.001 Traffic Mirroring</span></div><div class='kw-theme'>Data sources and telemetry</div><div class='chips'><span class='chip'>WinEventLog channels on Windows</span><span class='chip'>auditd:SYSCALL on Linux</span><span class='chip'>NSM:Flow network sensors</span></div><div class='kw-theme'>Analytics and detection logic</div><div class='chips'><span class='chip'>repeats inside the TimeWindow</span><span class='chip'>two-artefact correlation</span><span class='chip'>AN1115 LaunchAgent/LaunchDaemon pattern</span></div><div class='kw-theme'>Tuning and mutable elements</div><div class='chips'><span class='chip'>all six mutable elements</span><span class='chip'>CronJobInterval</span><span class='chip'>UserContext</span><span class='chip'>LaunchInterval</span><span class='chip'>DestinationPort</span><span class='chip'>DestinationIP allowlisting</span></div><div class='kw-theme'>False positives and baselines</div><div class='chips'><span class='chip'>backup agents</span><span class='chip'>update clients</span><span class='chip'>MDM/telemetry agents</span></div><div class='kw-theme'>Detection engineering practice</div><div class='chips'><span class='chip'>SIEM join by PID</span><span class='chip'>triage workflow</span><span class='chip'>ranking alerts</span><span class='chip'>correlation / baseline / tuning / aggregation</span></div><div class='kw-theme'>Real-world procedures and threat actors</div><div class='chips'><span class='chip'>S0090 Rover — hourly automated send (T1020 procedure)</span></div><div class='kw-theme'>Coverage gaps and compensating detections</div><div class='chips'><span class='chip'>coverage map: covered vs blind spot</span><span class='chip'>compensating controls (device-side, physical)</span></div>\n</div>\n<div class=\"card\">\n  <h2>How this exam works</h2>\n  <ul class=\"rules\">\n      <li class=\"r-pass\"><b>Pass mark: 70%.</b> Your score is computed only over exercises you actually answered.\n        PASS means you showed solid control of this severity. FAIL means you should read the explanations and retake.</li>\n      <li class=\"r-info\"><b>Exercise types in this file:</b> multiple choice, log analysis, matching, branching decisions, drag-and-drop, fill-in-the-blank, ordering, ranking.</li>\n      <li class=\"r-timer\"><b>Timer:</b> you have <b>45 minutes</b> (estimated effort: about 45 minutes).\n        The timer has two kinds of pause. The <b>Pause button</b> is a manual break: the exercise hides and the timer stops.\n        Pressing <b>Check</b> also stops the timer automatically so you can read the feedback for as long as you want —\n        it resumes only when you press <b>Next</b> (or Final Submit on the last exercise). Skipping and hints never pause the timer.</li>\n      <li class=\"r-part\"><b>Partial credit:</b> exercises with several correct items give <b>partial credit</b>:\n        credit = max(0, (right − wrong) / total items). Selecting everything “to be safe” gives zero.\n        One hint per exercise costs −0.10 of that exercise's credit.</li>\n      <li class=\"r-skip\"><b>Skip:</b> you can skip any exercise and return to skipped ones before you finish.\n        Skipped-and-never-answered exercises are simply excluded from the score. The exam ends with a\n        “Review skipped exercises” screen while the timer is still running.</li>\n    \n  </ul>\n  <div style=\"margin-top:16px\"><button class=\"btn primary\" id=\"btnStart\" style=\"min-width:180px\">▶ Start the exam</button></div>\n</div>\n"};
var EX = [{"id": "m01", "type": "qcm", "theme": "The detection object and ATT&CK position", "title": "Automated exfiltration or scheduled transfer?", "collapsedSummary": "Two behaviours — pick the correct technique pair.", "scenario": "Your team reviews two incidents.\n• Incident A: a trojan collects documents, then its built-in uploader sends each new file out automatically, right after collection, in a continuous loop.\n• Incident B: an attacker created a cron job that packs one folder and sends it at 02:00 every night. The transfer is batch and strictly on the clock.", "question": "Which mapping of behaviour to ATT&CK technique is correct?", "options": [{"id": "a", "text": "A is T1020; B is T1029"}, {"id": "b", "text": "A is T1029; B is T1020"}, {"id": "c", "text": "Both are T1020"}, {"id": "d", "text": "Both are T1029"}], "correct": ["a"], "explanation": "T1020 (Automated Exfiltration) is when the tooling itself pushes collected data out automatically after collection — the malware's own uploader loop. T1029 (Scheduled Transfer) is when transfers happen on a fixed schedule, like a cron job at 02:00. They overlap in practice (a scheduled loop can be both), and ATT&CK says other exfiltration techniques usually apply alongside T1020 too. Here A is driven by the tool itself, B by the clock.", "study": "T1020 vs T1029 on the ATT&CK matrix, and the overlap note on the T1020 page.", "hint": "Ask: who triggers the send — the malware's own code, or the system clock?"}, {"id": "m02", "type": "logs", "theme": "Analytics and detection logic", "title": "Would AN1113 fire on this host?", "collapsedSummary": "Windows events for WKS-FIN-014 — decide if the correlation fires.", "scenario": "You are on triage. A colleague grouped four events from WKS-FIN-014 (Windows). The TimeWindow on your AN1113 instance is set to 10 minutes.", "artefacts": [{"label": "ARTEFACT 1 — grouped events, WKS-FIN-014", "logs": ["09:04:11 EventCode=4688 host=WKS-FIN-014 NewProcessName=C:\\Windows\\System32\\curl.exe TaskName=\\NightlySync ProcessId=4412 user=svc_reports", "09:04:12 EventCode=3 host=WKS-FIN-014 Image=C:\\Windows\\System32\\curl.exe DestinationIp=203[.]0[.]113[.]50 DestinationPort=443 PID=4412", "09:09:11 EventCode=4688 host=WKS-FIN-014 NewProcessName=C:\\Windows\\System32\\curl.exe TaskName=\\NightlySync ProcessId=4412 user=svc_reports", "09:09:12 EventCode=3 host=WKS-FIN-014 Image=C:\\Windows\\System32\\curl.exe DestinationIp=203[.]0[.]113[.]50 DestinationPort=443 PID=4412"]}], "question": "Will AN1113 fire for this group, and why?", "sub": {"mode": "qcm", "prompt": "Review the artefact, then pick the one correct verdict.", "options": [{"id": "a", "text": "Yes — the same task reappears and creates outbound connections within the window"}, {"id": "b", "text": "No — curl.exe ships with Windows, so it is always trusted"}, {"id": "c", "text": "No — the connections use port 443, and encrypted traffic is out of scope"}, {"id": "d", "text": "Yes — any single connection to an outside IP is enough on its own"}]}, "correct": ["a"], "explanation": "Yes. The pattern repeats: the same scheduled task (\\NightlySync) launches the same signed Windows binary (curl.exe, PID 4412) over and over, and that process opens an outbound connection to the same external IP, twice inside your 10-minute window. That is exactly the “process creation + network connection, repeated” join that AN1113 correlates. A signed Windows tool can still be the exfiltration workhorse — signing proves who built it, not what it was told to send. Port 443 does not exclude anything — most exfiltration hides in normal ports. And one single connection alone is not the trigger; the repeats inside the window are.", "study": "AN1113's correlation shape: repeats of process + connection inside the TimeWindow.", "hint": "Count the pairs in the artefact, then compare the gap between them with the 10-minute window."}, {"id": "m03", "type": "match", "theme": "Tuning and mutable elements", "title": "All six mutable elements", "collapsedSummary": "Match each mutable element to what it tunes.", "scenario": "A new detection engineer joins. You print the DET0397 mutable elements and ask them to map every knob to its effect before their first tuning change.", "question": "Match each mutable element to what it tunes.", "left": [{"id": "l1", "text": "TimeWindow"}, {"id": "l2", "text": "DestinationIP"}, {"id": "l3", "text": "CronJobInterval"}, {"id": "l4", "text": "UserContext"}, {"id": "l5", "text": "LaunchInterval"}, {"id": "l6", "text": "DestinationPort"}], "right": [{"id": "r1", "text": "Windows: how much time groups repeated exfil activity", "short": "Windows time bucket"}, {"id": "r2", "text": "Filter known internal or trusted destinations", "short": "trusted-destination filter"}, {"id": "r3", "text": "Linux: range for recurring cron jobs that make outbound connections", "short": "Linux cron range"}, {"id": "r4", "text": "Linux: scope of accounts — service accounts vs user accounts", "short": "account scope"}, {"id": "r5", "text": "macOS: frequency of recurring task linked to external traffic", "short": "macOS task frequency"}, {"id": "r6", "text": "macOS: port used for detection filtering", "short": "macOS port filter"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4", "l5": "r5", "l6": "r6"}, "explanation": "Each analytic carries its own knobs. AN1113 (Windows): TimeWindow groups repeats, DestinationIP filters trusted addresses. AN1114 (Linux): CronJobInterval bounds the recurring-task window, UserContext narrows the account scope. AN1115 (macOS): LaunchInterval is the task-recurrence frequency, DestinationPort filters by port. Knowing which knob belongs to which platform is the first step of safe tuning.", "study": "The three Mutable Elements tables on the DET0397 page (one per analytic).", "hint": "Group by platform first: two knobs per analytic — one about time, one about scope or filtering."}, {"id": "m04", "type": "branch", "theme": "Detection engineering practice", "title": "Triage an AN1113 alert end to end", "collapsedSummary": "Two-step triage of an AN1113 alert on WKS-FIN-014.", "scenario": "AN1113 fired on WKS-FIN-014: repeated outbound connections inside the time window. You are the assigned SOC analyst. Work the two steps.", "question": "Work through both triage steps.", "steps": [{"context": "The alert shows only the network half: 3 outbound connections to one external IP in 15 minutes.", "question": "STEP 1 — What do you check first?", "options": [{"id": "a", "text": "Pull the matching process creation events and link them by process identity"}, {"id": "b", "text": "Reimage the workstation right away"}, {"id": "c", "text": "Close the alert — outbound HTTPS is normal traffic"}, {"id": "d", "text": "Email all staff to ask who is downloading files"}], "correct": "a", "ack": "Good: the process half of the correlation comes first. Without it you cannot say what is automating the sends."}, {"context": "The process half answers: a scheduled task starts curl.exe every 5 minutes under svc_reports, uploading archives to a personal cloud share outside the company.", "question": "STEP 2 — What is the best next action?", "options": [{"id": "a", "text": "Close as noise — curl.exe is a signed Windows tool"}, {"id": "b", "text": "Escalate as suspected automated exfiltration and hand to IR with the event chain"}, {"id": "c", "text": "Block every outbound connection on the whole subnet"}, {"id": "d", "text": "Wait a week to see if it stops by itself"}], "correct": "b", "ack": "Correct: an automated, repeated, unauthorised copy-out is the exact T1020 pattern. Escalate with the full event chain."}], "explanation": "Step 1: the network events alone do not name the automator; the process creation events do. Joining them by process identity is the first move. Step 2: a scheduled task that repeatedly copies data to a personal cloud destination is automated exfiltration (T1020) until proven otherwise — escalation with the full chain (task → process → connections) is the professional action. The wrong options either ignore real risk or overreact against innocent systems.", "study": "Alert triage for correlation analytics: complete both halves before you decide.", "hint": "Step 1: which events name the automation? Step 2: what does an unauthorised repeated copy-out mean?"}, {"id": "m05", "type": "fib", "theme": "Detection engineering practice", "title": "Complete the correlation rule", "collapsedSummary": "Fill the three missing tokens of the SIEM rule.", "artefacts": [{"label": "ARTEFACT 1 — draft SIEM rule for AN1113 (pseudo-SPL)", "pre": "index=wineventlog EventCode=4688\n| join _______ [ search index=sysmon EventCode=3 dest_ip!=10[.]0[.]0[.]0/8 ]\n| stats count by host, dest_ip\n| where count >= 2\n| eval bucket=_______(5m)      # group repeats\n| filter scope=_______         # exclude trusted destinations"}], "question": "Fill the three blanks so the rule matches AN1113's logic.", "sentence": "The join key between process and connection events is the {b0}, the repeat grouping uses the {b1} mutable element, and the destination filter is the {b2} mutable element.", "blanks": [{"id": "b0"}, {"id": "b1"}, {"id": "b2"}], "distractors": ["hostname", "MAC", "CronJobInterval"], "explanation": "The two halves join on the process identity — the PID is what a Sysmon EventCode 3 line and a process creation line share. Repeats are grouped by the TimeWindow knob. Trusted destinations are removed by the DestinationIP knob. CronJobInterval is real, but it belongs to AN1114 on Linux, not to this Windows rule.", "study": "How AN1113's logic maps to a SIEM rule: join key, time bucket, destination filter.", "hint": "One blank names the shared process handle; the other two are the two AN1113 mutable elements.", "sentenceHtml": "The join key between process and connection events is the <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span>, the repeat grouping uses the <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> mutable element, and the destination filter is the <span class=\"blank empty\" data-id=\"b2\" role=\"button\" tabindex=\"0\" aria-label=\"blank 2, press Enter after picking a word\">blank 2<\/span> mutable element.", "solution": {"b0": "PID", "b1": "TimeWindow", "b2": "DestinationIP"}, "bank": ["PID", "TimeWindow", "DestinationIP", "hostname", "MAC", "CronJobInterval"]}, {"id": "m06", "type": "qcm", "theme": "False positives and baselines", "title": "The nightly backup that keeps alerting", "collapsedSummary": "Backup vendor upload — real threat or tuning task?", "scenario": "Every night at 01:00, the backup agent on SRV-FS-02 uploads archives to the vendor cloud (vendor-backup[.]example). AN1113 keeps firing on it: the pattern is exactly “repeated automated uploads to an external destination”. The backup is approved and expected.", "question": "What is the correct first interpretation and action?", "options": [{"id": "a", "text": "Likely a false positive — tune DestinationIP to exclude the trusted vendor destination"}, {"id": "b", "text": "Likely ransomware — shut down the backup server now"}, {"id": "c", "text": "Disable AN1113 — it clearly does not work"}, {"id": "d", "text": "Allow all external uploads from that server without checking"}], "correct": ["a"], "explanation": "The analytic is doing its job: it cannot know your business context. An approved nightly backup to a known vendor is a classic false positive for “periodic automated outbound transfers”. The professional fix is tuning: add the vendor destination to the DestinationIP filter so the noise stops — while the detection stays armed for unknown destinations. Turning the analytic off or allowing everything would remove coverage you need.", "study": "False-positive handling for AN1113: tune DestinationIP instead of disabling coverage.", "hint": "The pattern is right but the destination is approved. Which knob handles approved destinations?"}, {"id": "m07", "type": "match", "theme": "Data sources and telemetry", "title": "Which channel lives on which platform?", "collapsedSummary": "Four log channels to their homes.", "scenario": "Your SIEM has four onboarding candidates. Before enabling anything, map each channel to where it comes from.", "question": "Match each log channel to the platform it comes from.", "left": [{"id": "l1", "text": "WinEventLog:Security (4688)"}, {"id": "l2", "text": "WinEventLog:Sysmon (3, 22)"}, {"id": "l3", "text": "auditd:SYSCALL (execve)"}, {"id": "l4", "text": "NSM:Flow (outbound connections)"}], "right": [{"id": "r1", "text": "Windows — native security log", "short": "Windows native"}, {"id": "r2", "text": "Windows — Sysmon add-on log", "short": "Windows Sysmon"}, {"id": "r3", "text": "Linux — audit framework", "short": "Linux audit"}, {"id": "r4", "text": "Network sensors — host-independent flow data", "short": "network flow"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "WinEventLog:Security and WinEventLog:Sysmon are both Windows channels — Security is built-in, Sysmon is an installed add-on that writes its own event log. auditd:SYSCALL is the Linux audit framework. NSM:Flow is different: network security monitoring sensors produce it on the wire, not on an endpoint, so it works even for hosts where you cannot install an agent. AN1114 pairs auditd with NSM flow data.", "study": "The Log Sources tables of AN1113 and AN1114 on the DET0397 page.", "hint": "Two channels are Windows; one is Linux; one watches the network instead of a host."}, {"id": "m08", "type": "logs", "theme": "Analytics and detection logic", "title": "Would AN1114 fire on this Linux host?", "collapsedSummary": "auditd + NSM flow on db-lin-03 — decide the verdict.", "scenario": "You hunt on db-lin-03 (Linux). The CronJobInterval on your AN1114 instance is 15 minutes. Read the two artefacts and give the verdict.", "artefacts": [{"label": "ARTEFACT 1 — auditd:SYSCALL (execve), selected lines", "logs": ["02:00:01 type=SYSCALL msg=audit(1778484001.11) exe=\"/opt/scripts/push.sh\" ppid=crond(1279) user=svc_etl res=success", "02:10:01 type=SYSCALL msg=audit(1778484601.22) exe=\"/opt/scripts/push.sh\" ppid=crond(1281) user=svc_etl res=success", "02:20:01 type=SYSCALL msg=audit(1778485201.33) exe=\"/opt/scripts/push.sh\" ppid=crond(1283) user=svc_etl res=success"]}, {"label": "ARTEFACT 2 — NSM:Flow, outbound from db-lin-03", "logs": ["02:00:03 flow src_ip=10[.]0[.]14[.]7:51203 dst_ip=198[.]51[.]100[.]188:443 proto=tcp bytes_out=41200000 proc_hint=push.sh", "02:10:03 flow src_ip=10[.]0[.]14[.]7:51290 dst_ip=198[.]51[.]100[.]188:443 proto=tcp bytes_out=38700000 proc_hint=push.sh", "02:20:03 flow src_ip=10[.]0[.]14[.]7:51345 dst_ip=198[.]51[.]100[.]188:443 proto=tcp bytes_out=39800000 proc_hint=push.sh"]}], "question": "Does AN1114 fire, and why?", "sub": {"mode": "qcm", "prompt": "Pick the one correct verdict for this artefact set.", "options": [{"id": "a", "text": "Yes — a background script repeats outbound transfers inside the interval window"}, {"id": "b", "text": "No — cron jobs are always administrator work"}, {"id": "c", "text": "No — NSM flow data cannot be used for host detections"}, {"id": "d", "text": "Yes — because any execve event is malicious on a database server"}]}, "correct": ["a"], "explanation": "Yes. The two halves line up: auditd shows the same background script (/opt/scripts/push.sh) started by crond every 10 minutes under a service account, and the flow sensor shows that script pushing tens of megabytes out to the same external IP — inside your 15-minute CronJobInterval. That is exactly AN1114's pattern: background scripts transmitting data repeatedly to remote destinations. NSM flow data is a legitimate host-detection source; it just lives on the sensor, not the host.", "study": "AN1114's two sources (auditd execve + NSM Flow) and the CronJobInterval window.", "hint": "Check both artefacts: who starts the script, how often, and what leaves the network."}, {"id": "m09", "type": "multi", "theme": "False positives and baselines", "title": "Which of these are classic false positives?", "collapsedSummary": "Select the benign look-alikes (partial credit).", "scenario": "Your AN1113 instance is noisy. The detection lead asks you to shortlist the look-alikes that are usually benign — the ones to tune around — before touching the rule.", "question": "Select ALL behaviours that are usually benign false positives for a periodic-outbound analytic.", "options": [{"id": "a", "text": "Nightly backup agent uploading archives to its vendor cloud"}, {"id": "b", "text": "Ransomware encrypting local files and dropping a ransom note"}, {"id": "c", "text": "OS update client polling its update service every 4 hours"}, {"id": "d", "text": "A scheduled script uploading files to an unknown personal cloud account"}, {"id": "e", "text": "MDM/telemetry agent sending device health reports at fixed intervals"}], "correct": ["a", "c", "e"], "explanation": "The benign trio: backup agents, update clients, and MDM/telemetry agents all send data out on a fixed rhythm to known business services — they look exactly like automated exfiltration to a pattern that only sees repeats. They are tuning work (DestinationIP allowlists, account scoping), not incidents. The two red items are not look-alikes: ransomware encryption is not a periodic outbound pattern (it is Impact), and an upload to an unknown personal cloud account is exactly the true positive you must keep.", "study": "Common benign periodic-outbound sources: backup, update, telemetry — and what stays suspicious.", "hint": "Ask for each: is the destination a known business service, or something the business never approved?"}, {"id": "m10", "type": "order", "theme": "Detection engineering practice", "title": "The four moves of a clean triage", "collapsedSummary": "Order the analyst workflow for one AN1113 alert.", "scenario": "One AN1113 alert lands in the queue: repeated outbound connections, source unknown yet. Put the analyst workflow in the right order.", "question": "Put the four triage moves in order: which comes first?", "items": [{"id": "i1", "text": "Pull the correlated process events for the connecting process"}, {"id": "i2", "text": "Check the pattern: how often does it repeat, inside which window"}, {"id": "i3", "text": "Check the destination: owner, reputation, business relevance"}, {"id": "i4", "text": "Decide: false positive (tune) or suspected T1020 (escalate to IR)"}], "order": ["i1", "i2", "i3", "i4"], "explanation": "First name the automator (process events), then read the rhythm (repeats and window), then judge the destination, and only then decide. This order keeps the evidence chain tidy: each step feeds the next, and the final decision is written with facts, not feelings. Skipping the destination check is the most common junior mistake — it is what separates a real exfil from the nightly backup.", "study": "A repeatable triage order for correlation alerts: correlate → pattern → destination → decision.", "hint": "You cannot judge a pattern before naming the process, and you cannot decide before judging both."}, {"id": "m11", "type": "fib", "theme": "Analytics and detection logic", "title": "The macOS pattern in one sentence", "collapsedSummary": "Fill the two missing words of the AN1115 pattern.", "scenario": "You write a one-line summary of AN1115 for your team's wiki. Two words are missing; the word bank has them plus two decoys.", "question": "Complete the wiki one-liner: name the two macOS objects.", "sentence": "AN1115 looks for macOS {b0} and {b1} that open periodic external connections, which points to automated data transfer.", "blanks": [{"id": "b0"}, {"id": "b1"}], "distractors": ["TimeCapsules", "Keychains"], "explanation": "LaunchAgents and LaunchDaemons are the macOS mechanisms that start programs automatically — for the current user or for the whole system. Malware that abuses them beacons or uploads on a timer, which is why AN1115 watches exactly these two objects plus their connections. TimeCapsules and Keychains are real macOS things, but they are not what AN1115 reads.", "study": "LaunchAgents / LaunchDaemons as macOS persistence, and AN1115's use of them.", "hint": "Both missing words start with “Launch” — one for user programs, one for system programs.", "sentenceHtml": "AN1115 looks for macOS <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> and <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> that open periodic external connections, which points to automated data transfer.", "solution": {"b0": "LaunchAgents", "b1": "LaunchDaemons"}, "bank": ["LaunchAgents", "LaunchDaemons", "TimeCapsules", "Keychains"]}, {"id": "m12", "type": "rank", "theme": "Detection engineering practice", "title": "Three Linux alerts, one queue", "collapsedSummary": "Rank three AN1114-related alerts by true-positive likelihood.", "scenario": "Three alerts sit in the Linux queue. Rank them by likelihood of being a true automated-exfiltration case (rank 1 = most likely true positive).", "question": "Rank the alerts from most likely to least likely true positive.", "items": [{"id": "i1", "text": "A: crond runs /tmp/.x/push.sh every 10 min as svc_etl; flow shows .csv uploads to a fresh VPS"}, {"id": "i2", "text": "B: crond runs /opt/scripts/db_backup.sh nightly 02:00; flow goes to the internal NAS"}, {"id": "i3", "text": "C: admin ran one scp of a report to a partner SFTP at 16:40, once"}], "order": ["i1", "i2", "i3"], "explanation": "A first: a hidden script in /tmp, a service account, a 10-minute repeat, and uploads to an unknown fresh VPS — every element of AN1114's pattern plus suspicious context. B is a classic approved backup: automated and periodic, but the destination is internal infrastructure, so it is a tuning case, not an incident. C is one manual, one-time transfer by a named admin — not automated at all, so it does not match the detection's logic even if policy might still ask questions about it.", "study": "Ranking exfiltration alerts: automation + repeat + destination reputation + account context.", "hint": "Look at three things per alert: does it repeat, who runs it, and where does the data go?"}, {"id": "m13", "type": "match", "theme": "The detection object and ATT&CK position", "title": "T1020 and its neighbours", "collapsedSummary": "Match each ATT&CK object to its one-line meaning.", "scenario": "In a detection review you must explain four neighbouring ATT&CK objects. Match each to its one-line meaning.", "question": "Match each object to its meaning.", "left": [{"id": "l1", "text": "T1020 Automated Exfiltration"}, {"id": "l2", "text": "T1029 Scheduled Transfer"}, {"id": "l3", "text": "T1041 Exfiltration Over C2 Channel"}, {"id": "l4", "text": "T1020.001 Traffic Mirroring"}], "right": [{"id": "r1", "text": "The tool pushes collected data out by itself", "short": "tool pushes data itself"}, {"id": "r2", "text": "Transfers run on a fixed clock, batch by batch", "short": "fixed-clock batches"}, {"id": "r3", "text": "Stolen data rides the existing C2 channel", "short": "rides the C2 channel"}, {"id": "r4", "text": "A network device copies traffic toward the attacker", "short": "device copies traffic"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "T1020 is about automation after collection. T1029 is about the clock. T1041 is about the road: data leaves inside the same channel the malware uses for commands. T1020.001 is the sub-technique where the adversary abuses traffic mirroring — a native feature of routers and switches — to duplicate flows to infrastructure they control. ATT&CK notes that when T1020 is used, channel techniques like T1041 usually apply alongside it.", "study": "T1020, T1029, T1041 and sub-technique T1020.001 in the Exfiltration tactic.", "hint": "Two are about when (tool vs clock), one about the road, one about a network-device trick."}, {"id": "m14", "type": "fib", "theme": "Tuning and mutable elements", "title": "The macOS knobs by name", "collapsedSummary": "Name the two AN1115 mutable elements.", "scenario": "You document AN1115 tuning for the macOS fleet. The two knob names are missing from the sentence; pick them from the bank (two decoys included).", "question": "Complete the sentence with the two AN1115 mutable elements.", "sentence": "On macOS, {b0} sets how often a task must repeat before it is linked to external traffic, and {b1} filters by the port used.", "blanks": [{"id": "b0"}, {"id": "b1"}], "distractors": ["TimeWindow", "UserContext"], "explanation": "AN1115's two mutable elements are LaunchInterval (the recurrence frequency of the task tied to external communication) and DestinationPort (the port used for detection filtering). TimeWindow and UserContext are real mutable elements too — but of AN1113 and AN1114, not of AN1115. Knob-to-analytic mapping matters when you edit production rules.", "study": "The AN1115 Mutable Elements table: LaunchInterval and DestinationPort.", "hint": "One knob carries “Launch” in its name; the other one carries “Port”.", "sentenceHtml": "On macOS, <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> sets how often a task must repeat before it is linked to external traffic, and <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> filters by the port used.", "solution": {"b0": "LaunchInterval", "b1": "DestinationPort"}, "bank": ["LaunchInterval", "DestinationPort", "TimeWindow", "UserContext"]}, {"id": "m15", "type": "match", "theme": "Detection engineering practice", "title": "Four words every detection engineer uses", "collapsedSummary": "Match each engineering concept to its meaning.", "scenario": "In the tuning meeting these four words fly around. Prove you follow: match each concept to what it means for this detection.", "question": "Match each engineering word to what it means for this detection.", "left": [{"id": "l1", "text": "Correlation"}, {"id": "l2", "text": "Baseline"}, {"id": "l3", "text": "Tuning"}, {"id": "l4", "text": "Aggregation"}], "right": [{"id": "r1", "text": "Joining two event types into one finding", "short": "joining event types"}, {"id": "r2", "text": "Learning what normal traffic looks like first", "short": "what normal looks like"}, {"id": "r3", "text": "Adjusting the mutable elements to cut false positives", "short": "adjusting the knobs"}, {"id": "r4", "text": "Grouping many events into one view or count", "short": "grouping many events"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "Correlation is the heart of AN1113/AN1114: process events joined with connection events. A baseline is the learned picture of normal behaviour — you compare against it to spot the odd repeat. Tuning means changing the mutable elements (windows, filters, scopes). Aggregation is how SIEMs group events (stats count by host, dest_ip) so a hundred flows become one number you can threshold.", "study": "Core detection-engineering vocabulary: correlation, baseline, tuning, aggregation.", "hint": "One word joins, one word learns, one word adjusts, one word groups."}, {"id": "m16", "type": "fib", "theme": "Real-world procedures and threat actors", "title": "Rover's quiet 60-minute rhythm", "collapsedSummary": "ATT&CK software excerpt — fill the cadence.", "artefacts": [{"label": "ARTEFACT 1 — ATT&CK software entry (excerpt, T1020)", "pre": "ID: S0090\nName: Rover\nProcedure (excerpt): Rover automatically searches for files on local drives based\non a predefined list of file extensions and sends them to the command and control\nserver every 60 minutes. It also sends keylogger files and screenshots on a\nregular timeframe."}], "question": "Fill the blank with Rover's exfiltration cadence.", "sentence": "Rover sends collected files to its C2 server every {b0} minutes, on a loop, with no operator present.", "blanks": [{"id": "b0"}], "distractors": ["ten", "five", "ninety"], "explanation": "Rover (S0090) is a clean T1020 example: an automatic file search by extension list, then an automatic send every 60 minutes. Against AN1113-style logic, this is a steady hourly repeat inside any sane TimeWindow — easy to correlate, hard to notice by eye, because sixty minutes is slow enough to hide in normal traffic. “Ten” is Kimsuky's cadence, not Rover's.", "study": "S0090 Rover on the T1020 procedure list — and why slow cadences still correlate.", "hint": "Read the excerpt's number; do not confuse it with Kimsuky's 10-minute script from the EASY exam.", "sentenceHtml": "Rover sends collected files to its C2 server every <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> minutes, on a loop, with no operator present.", "solution": {"b0": "sixty"}, "bank": ["sixty", "ten", "five", "ninety"]}, {"id": "m17", "type": "dnd", "theme": "Coverage gaps and compensating detections", "title": "Covered or blind spot?", "collapsedSummary": "Drag each behaviour to its coverage verdict.", "scenario": "The annual control review asks a simple question about DET0397: which behaviours do the three host-centric analytics actually see? Four behaviours are on the table. Drag each one to the correct coverage verdict.", "question": "Place each behaviour under the correct coverage verdict.", "bank": ["Linux cron daemon pushing archives every 20 minutes", "Malware uploader on a Windows host sending every 30 minutes", "Router traffic mirroring abuse (T1020.001)", "Printed documents carried out of an air-gapped lab"], "slots": [{"id": "s1", "label": "Covered — AN1114 (Linux host telemetry) →"}, {"id": "s2", "label": "Covered — AN1113 (Windows host telemetry) →"}, {"id": "s3", "label": "Blind spot — needs network-device-side coverage →"}, {"id": "s4", "label": "Blind spot — physical path, no network telemetry →"}], "solution": {"s1": "Linux cron daemon pushing archives every 20 minutes", "s2": "Malware uploader on a Windows host sending every 30 minutes", "s3": "Router traffic mirroring abuse (T1020.001)", "s4": "Printed documents carried out of an air-gapped lab"}, "explanation": "The two repeats-on-a-host behaviours land on the analytics built for them: a Linux cron daemon repeating large sends is AN1114's exact pattern (auditd execve + NSM flow), and a Windows malware uploader sending on a loop is AN1113's (4688 + Sysmon 3). The two blind spots share one property: no host-side log source exists. A router doing traffic mirroring (T1020.001) produces none of the three analytics' logs — the compensation is network-device configuration monitoring and device-side flow analytics. Paper leaving an air-gapped lab never touches a network, so no network-telemetry strategy can see it — that needs physical and device controls. Naming the boundary is what makes a coverage claim defensible in the review.", "study": "DET0397's coverage boundary: host-centric network telemetry — and the compensating control per blind spot.", "hint": "Two behaviours repeat on hosts that send logs. For the other two, ask: which log source would ever record them?"}];

/* ===== helpers ===== */
function $(s){return document.querySelector(s)}
function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){s=Math.max(0,s|0);var m=(s/60)|0,r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1)}

/* ===== scoring engine (partial credit) ===== */
function scoreExercise(sel, correct){
  var N=correct.length||1,H=0,W=0,i;
  for(i=0;i<sel.length;i++){ if(correct.indexOf(sel[i])>=0){H++;} else {W++;} }
  return Math.max(0,(H-W)/N);
}

/* ===== state ===== */
var S=null, TID=null, PROFILE={username:'',country:'',locale:'en'};
function startTicker(){ if(TID)clearInterval(TID); TID=setInterval(tTick,1000); }
var EXBYID={}; EX.forEach(function(e){EXBYID[e.id]=e});

function newAttempt(){
  S={order:shuffle(EX.map(function(e,i){return i})),pos:0,status:{},credit:{},hintUsed:{},
     cur:null,fromReview:false,tState:'RUNNING',left:TIMER_BUDGET,started:false,
     pauseAcc:{manual:0,auto:0},reported:false,finished:false,ans:{}};
  EX.forEach(prepEx);
}
/* per-attempt shuffle of option lists, word banks, match columns, order rows */
function prepEx(ex){
  if(ex.options) ex._opts=shuffle(ex.options);
  if(ex.sub&&ex.sub.options) ex.sub._opts=shuffle(ex.sub.options);
  if(ex.left) ex._left=ex.left.slice();
  if(ex.right) ex._right=shuffle(ex.right).map(function(r){return {id:r.id,text:r.text,short:(r.short||r.text)}});
  if(ex.bank) ex._bank=shuffle(ex.bank);
  if(ex.items) ex._items=shuffle(ex.items);
}
var TIMER_BUDGET = META.timerSeconds;

/* ===== timer state machine ===== */
function tSet(state){
  if(S){ S.tState=state; }
  renderHeader();
}
function tTick(){
  if(!S||S.finished||!S.started) return;
  if(S.tState==='RUNNING'){
    if(S.tState==='RUNNING'){ S.left--;
      if(S.left<=0){S.left=0;S.tState='ENDED';renderHeader();onTimeEnd();return;}
    }
    renderHeader();
  } else if(S.tState==='PAUSED_MANUAL'){ S.pauseAcc.manual++; }
  else if(S.tState==='PAUSED_AUTO_CHECK'){ S.pauseAcc.auto++; }
}
function timerChip(){
  var cls=S.tState==='RUNNING'?'t-running':(S.tState==='PAUSED_MANUAL'?'t-manual':(S.tState==='PAUSED_AUTO_CHECK'?'t-auto':'t-ended'));
  var icon=S.tState==='RUNNING'?'\u25B6':(S.tState==='ENDED'?'\u23F1':'\u23F8');
  var word=S.tState==='RUNNING'?'RUNNING':(S.tState==='PAUSED_MANUAL'?'PAUSED \u2014 manual (press Resume)':(S.tState==='PAUSED_AUTO_CHECK'?'PAUSED \u2014 reviewing feedback (resumes on Next)':'ENDED'));
  return '<span class="hchip '+cls+'" role="status" aria-label="Timer '+esc(word)+'"><span aria-hidden="true">'+icon+'</span><span class="mono" id="tval">'+fmtTime(S.left)+'</span><span class="tword">'+esc(word)+'</span></span>';
}

/* ===== views ===== */
function showView(id){
  $all('.view').forEach(function(v){v.classList.remove('active')});
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ===== header ===== */
function sevBadge(){
  return '<span class="badge '+META.difficulty+'" role="img" aria-label="Severity '+esc(META.sevName)+'">'+esc(META.sevName)+'</span>';
}
function answeredStats(){
  var ids=Object.keys(S.status).filter(function(k){return S.status[k]==='answered'});
  var sum=0; ids.forEach(function(k){sum+=S.credit[k]});
  return {count:ids.length,sum:sum,ids:ids};
}
function renderHeader(){
  var h='';
  var total=S.order.length;
  var done=Object.keys(S.status).length;
  var st=answeredStats();
  var label=S.cur?(S.status[S.cur.id]==='answered'?'Progress '+done+' / '+total:('Exercise '+Math.min(done+1,total)+' of '+total)):('Progress '+done+' / '+total);
  h+='<div class="hchip"><b>'+esc(label)+'</b></div>';
  h+=sevBadge();
  h+='<div class="grow"></div>';
  h+=timerChip();
  h+='<span class="hchip" aria-label="Live score"><span aria-hidden="true">\u2605</span> Score <b class="mono">'+fmt1(st.sum)+' / '+st.count+'</b>'+(st.count>0?' <b class="mono">('+Math.round(st.sum/st.count*100)+'%)</b>':'')+'</span>';
  h+='<button class="hbtn" id="btnHint" aria-label="Hint (costs 10 percent of this exercise)">\uD83D\uDCA1 Hint</button>';
  h+='<button class="hbtn" id="btnSkip" aria-label="Skip this exercise">\u26A0 Skip</button>';
  h+='<button class="hbtn" id="btnPause" aria-label="Pause timer and hide exercise"'+(S.finished?' disabled':'')+'>\u23F8 Pause</button>';
  $('#topbar').innerHTML=h;
  var pb=$('#pbar-i'); if(pb) pb.style.width=(total?(done/total*100):0)+'%';
  $('#btnHint').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered'||S.hintUsed[S.cur.id];
  $('#btnSkip').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered';
  $('#btnHint').onclick=function(){doHint()};
  $('#btnSkip').onclick=function(){doSkip()};
  $('#btnPause').onclick=function(){doManualPause()};
}

/* ===== intro ===== */
function renderIntro(){
  $('#intro-body').innerHTML=INTRO.html;
  $('#btnStart').onclick=function(){
    if(!S||S.finished){newAttempt();}
    S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');
    goToPos(0);
  };
  if(PROFILE.username){$('#intro-greet').innerHTML='Analyst on duty: <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'');}
}

/* ===== exercise rendering ===== */
function curEx(){return S.order[S.pos]!==undefined?EX[S.order[S.pos]]:null}

function goToPos(pos,fromReview){
  S.pos=pos; S.cur=curEx(); S.fromReview=!!fromReview;
  if(!S.cur){finishFlow();return;}
  if(S.tState==='ENDED'){/* timer over: nothing to answer */}
  renderExercise();
  renderHeader();
}
function scenHTML(ex){
  var arts=ex.artefacts||[];
  var body='';
  if(ex.scenario) body+='<div class="scenario-text scenario-hideable">'+esc(ex.scenario)+'</div>';
  arts.forEach(function(a,i){
    var lbl=(a.label&&/^ARTEFACT/i.test(a.label))?a.label:('ARTEFACT '+(i+1)+' \u2014 '+(a.label||'evidence'));
    body+='<div class="artefact scenario-hideable"><div class="a-label">'+esc(lbl)+'</div><div class="a-body">';
    if(a.logs){ body+=logPanel(a.logs,a.filter!==false); }
    else if(a.pre){ body+='<pre class="log-line" style="max-height:260px;overflow:auto">'+hlBlock(a.pre)+'</pre>'; }
    else { body+='<div class="scenario-text">'+esc(a.text)+'</div>'; }
    body+='</div></div>';
  });
  var sum=ex.collapsedSummary||'Scenario collapsed \u2014 expand to re-read';
  return '<div class="block b-scenario" id="scenBlock">'+
    '<div class="block-h"><span aria-hidden="true">\u25A4</span> SCENARIO <span class="sp"></span>'+
    '<button class="collapse-btn" id="btnCollapse" aria-label="Collapse or expand scenario">Collapse \u25BE</button></div>'+
    '<div class="scen-summary">'+esc(sum)+'</div>'+
    '<div class="block-body">'+body+'</div></div>';
}
function blockQ(ex){
  return '<div class="block b-question"><div class="block-h"><span aria-hidden="true">\u2753</span> QUESTION</div>'+
    '<div class="block-body"><p class="qtext">'+esc(ex.question)+'</p>'+(ex.qnote?'<p class="muted" style="color:var(--text-secondary);font-size:.92rem;margin:6px 0 0">'+esc(ex.qnote)+'</p>':'')+'</div></div>';
}
function renderExercise(){
  var ex=S.cur;
  var card=$('#excard');
  var sev=META.sevName;
  var html='';
  html+='<span class="theme-chip">\u25C6 '+esc(ex.theme)+'</span>';
  html+=scenHTML(ex);
  html+=blockQ(ex);
  html+='<div class="block b-answer"><div class="block-h"><span aria-hidden="true">\u270E</span> YOUR ANSWER</div><div class="block-body" id="ansbody"></div></div>';
  html+='<div id="fbwrap"></div>';
  html+='<div class="actionrow" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnCheck" disabled>\u2713 Check</button>'+
    '<button class="btn hidden" id="btnNext">\u2192 Next</button>'+
    '</div>';
  card.innerHTML=html;
  $('#btnCollapse').onclick=function(){var b=$('#scenBlock');b.classList.toggle('scen-collapsed');this.textContent=b.classList.contains('scen-collapsed')?'Expand \u25B8':'Collapse \u25BE';};
  renderWidget(ex);
  wireLogFilter();
  var chk=$('#btnCheck');
  chk.onclick=function(){doCheck()};
  if(S.status[ex.id]==='answered'){
    /* returning view of answered exercise not possible in flow; guarded */
  }
}
function setAnswerReady(ok){var b=$('#btnCheck');if(b)b.disabled=!ok}

/* ---- widget: qcm / multi ---- */
function wChoice(ex,mode){
  var multi=mode==='multi';
  var opts=ex._opts||ex.options||[];
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">'+(multi?'Select all options that apply. Partial credit applies.':'Choose the one best option.')+'</p><div class="opts">';
  opts.forEach(function(o,i){
    html+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="false"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
  });
  html+='</div>';
  $('#ansbody').innerHTML=html;
  var sel=[];
  $all('#ansbody .opt').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      if(multi){
        var k=sel.indexOf(id);
        if(k>=0){sel.splice(k,1);b.classList.remove('sel');b.setAttribute('aria-checked','false');}
        else{sel.push(id);b.classList.add('sel');b.setAttribute('aria-checked','true');}
      }else{
        sel=[id];
        $all('#ansbody .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
      }
      setAnswerReady(sel.length>0);
    };
  });
  return {collect:function(){return sel.slice()}};
}

/* ---- widget: match ---- */
function wMatch(ex){
  var lefts=ex._left,rights=ex._right;
  var pairs={}; var pickedL=null;
  function letter(i){return String.fromCharCode(65+i)}
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick one item on the left, then its partner on the right. Click a paired left item again to clear it.</p>'+
    '<div class="matchwrap"><div class="mcol"><div class="mhead">Items</div>';
  lefts.forEach(function(l,i){
    html+='<button type="button" class="mitem left" data-side="L" data-id="'+esc(l.id)+'"><span class="ol">'+letter(i)+'.</span><span>'+esc(l.text)+'</span><span class="pairtag" aria-hidden="true"></span></button>';
  });
  html+='</div><div class="mcol"><div class="mhead">Destinations / matches</div>';
  rights.forEach(function(r){
    html+='<button type="button" class="mitem right" data-side="R" data-id="'+esc(r.id)+'"><span>'+esc(r.text)+'</span></button>';
  });
  html+='</div></div>';
  $('#ansbody').innerHTML=html;
  function refresh(){
    var complete=true;
    $all('#ansbody .mitem.left').forEach(function(b){
      var id=b.getAttribute('data-id');
      var tag=b.querySelector('.pairtag');
      if(pairs[id]){tag.textContent='\u2192 '+rights.filter(function(r){return r.id===pairs[id]})[0].short;complete=false;}
      else{tag.textContent='';complete=false;}
    });
    var leftCount=$all('#ansbody .mitem.left').length;
    var paired=Object.keys(pairs).length;
    setAnswerReady(paired===leftCount);
  }
  $all('#ansbody .mitem').forEach(function(b){
    b.onclick=function(){
      var side=b.getAttribute('data-side'),id=b.getAttribute('data-id');
      if(side==='L'){
        if(pairs[id]){delete pairs[id];b.classList.remove('picked');refresh();return;}
        pickedL=id;
        $all('#ansbody .mitem.left').forEach(function(x){x.classList.remove('picked')});
        b.classList.add('picked');
      }else{
        if(!pickedL)return;
        pairs[pickedL]=id;
        $all('#ansbody .mitem.left').forEach(function(x){if(x.getAttribute('data-id')===pickedL)x.classList.remove('picked')});
        pickedL=null;refresh();
      }
    };
  });
  refresh();setAnswerReady(false);
  return {collect:function(){return Object.keys(pairs).map(function(l){return l+'>'+pairs[l]})},pairs:pairs};
}

/* ---- widget: dnd (bank -> slots) ---- */
function wDnD(ex){
  var bank=ex._bank.slice(), placed={}, picked=null, dragId=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Drag each item into the right slot (or pick an item, then pick a slot).</p>'+
    '<div class="bank" id="bank"></div><div class="slots" id="slots"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" draggable="true" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bank').innerHTML=bh;
    var sh='';
    ex.slots.forEach(function(s){
      var v=placed[s.id];
      sh+='<div class="slot" data-s="'+esc(s.id)+'" role="button" tabindex="0" aria-label="Slot: '+esc(s.label)+'"><span class="s-label">'+esc(s.label)+'</span>'+(v?'<span class="s-val">'+esc(v)+'</span>':'<span class="s-fill">drop here</span>')+'</div>';
    });
    $('#slots').innerHTML=sh;
    wire();
  }
  function place(w,sid){
    Object.keys(placed).forEach(function(k){if(placed[k]===w)delete placed[k]});
    placed[sid]=w;picked=null;draw();
    setAnswerReady(Object.keys(placed).length===ex.slots.length);
  }
  function wire(){
    $all('#bank .bitem').forEach(function(b){
      b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};
      b.ondragstart=function(ev){dragId=b.getAttribute('data-w');b.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}};
      b.ondragend=function(){b.classList.remove('dragging')};
    });
    $all('#slots .slot').forEach(function(s){
      var sid=s.getAttribute('data-s');
      s.onclick=function(){if(picked)place(picked,sid);};
      s.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&picked){ev.preventDefault();place(picked,sid);}};
      s.ondragover=function(ev){ev.preventDefault();s.classList.add('over')};
      s.ondragleave=function(){s.classList.remove('over')};
      s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var w=dragId||ev.dataTransfer.getData('text/plain');if(w)place(w,sid);};
    });
  }
  draw();setAnswerReady(false);
  return {collect:function(){return ex.slots.map(function(s){var v=placed[s.id];return v?(s.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: fib ---- */
function wFib(ex){
  var blanks=ex.blanks; /* [{id,label}] */
  var bank=ex._bank.slice(), placed={}, picked=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick a word from the bank, then pick a blank. Click a filled blank to clear it.</p>'+
    '<div class="blankline" id="bl-line">'+ex.sentenceHtml+'</div><div class="bank" id="bl-bank"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bl-bank').innerHTML=bh;
    $all('#bl-bank .bitem').forEach(function(b){b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};});
    $all('#ansbody .blank').forEach(function(b){
      var id=b.getAttribute('data-id');
      if(placed[id]){b.textContent=placed[id];b.classList.remove('empty');}
      else{b.textContent='blank '+id.replace('b','');b.classList.add('empty');}
      b.onclick=function(){
        if(placed[id]){delete placed[id];draw();refresh();return;}
        if(picked){placed[id]=picked;picked=null;draw();refresh();}
      };
      b.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.onclick();}};
    });
  }
  function refresh(){setAnswerReady(Object.keys(placed).length===blanks.length);}
  draw();refresh();setAnswerReady(false);
  return {collect:function(){return blanks.map(function(b){var v=placed[b.id];return v?(b.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: order / rank ---- */
function wOrder(ex){
  var items=ex._items.slice(); /* current order of {id,text} */
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Put the items in the right order: use the arrows or drag rows.</p><div class="ordlist" id="ord"></div>';
  $('#ansbody').innerHTML=html;
  var dragIdx=null;
  function draw(){
    var h='';items.forEach(function(it,i){
      h+='<div class="orditem" draggable="true" data-i="'+i+'"><span class="pos">'+(i+1)+'.</span><button class="move" data-d="-1" data-i="'+i+'" aria-label="Move up">\u25B2</button><button class="move" data-d="1" data-i="'+i+'" aria-label="Move down">\u25BC</button><span>'+esc(it.text)+'</span><span class="handle" aria-hidden="true">\u2261</span></div>';
    });
    $('#ord').innerHTML=h;wire();setAnswerReady(items.length===ex._items.length);
  }
  function move(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;draw();}
  function wire(){
    $all('#ord .move').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();move(parseInt(b.getAttribute('data-i'),10),parseInt(b.getAttribute('data-d'),10));};});
    $all('#ord .orditem').forEach(function(row){
      row.ondragstart=function(ev){dragIdx=parseInt(row.getAttribute('data-i'),10);try{ev.dataTransfer.setData('text/plain','x')}catch(e){}};
      row.ondragover=function(ev){ev.preventDefault();row.style.borderColor='var(--accent-green)'};
      row.ondragleave=function(){row.style.borderColor=''};
      row.ondrop=function(ev){ev.preventDefault();row.style.borderColor='';var to=parseInt(row.getAttribute('data-i'),10);if(dragIdx===null||isNaN(to))return;var it=items.splice(dragIdx,1)[0];items.splice(to,0,it);dragIdx=null;draw();};
    });
  }
  draw();
  return {collect:function(){return items.map(function(it){return it.id})}};
}

/* ---- widget: logs + sub answer ---- */
function wLogs(ex){
  var sub=ex.sub; /* {mode:'qcm'|'multi', options:[{id,text}], prompt} */
  var html='';
  html+='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">'+esc(sub.prompt||'Review the log panel in the scenario, then answer below.')+'</p><div class="opts">';
  (ex.sub._opts||sub.options).forEach(function(o,i){
    html+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="'+(sub.mode==='multi'?'checkbox':'radio')+'" aria-checked="false"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
  });

      }

/* ---- widget: branch ---- */
function wBranch(ex){
  var steps=ex.steps,i=0,choices=[];
  $('#ansbody').innerHTML='<div id="br-log"></div><div id="br-cur"></div>';
  function drawStep(){
    if(i>=steps.length){
      $('#br-cur').innerHTML='<div class="stepdone"><b>All '+steps.length+' steps recorded.</b> Press Check to grade the whole chain.</div>';
      setAnswerReady(true);return;
    }
    var st=steps[i];
    var h='<span class="stepchip">STEP '+(i+1)+' OF '+steps.length+'</span>';
    if(st.context)h+='<p class="stepctx">'+esc(st.context)+'</p>';
    h+='<div class="opts">';
    st.options.forEach(function(o,j){
      h+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="radio" aria-checked="false"><span class="ol">'+String.fromCharCode(65+j)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
    });
    h+='</div><div style="margin-top:10px"><button class="btn" id="br-next" disabled>\u2192 Confirm step '+(i+1)+'</button></div>';
    $('#br-cur').innerHTML=h;
    var pick=null;
    $all('#br-cur .opt').forEach(function(b){
      b.onclick=function(){pick=b.getAttribute('data-id');
        $all('#br-cur .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
        var nx=$('#br-next');if(nx)nx.disabled=false;};
    });
    $('#br-next').onclick=function(){
      if(i>=steps.length||pick===null)return;
      choices.push(pick);
      $('#br-log').insertAdjacentHTML('beforeend','<div class="stepdone"><b>Step '+(i+1)+' recorded.</b> '+esc(steps[i].ack||'Answer noted. The timer keeps running.')+'</div>');
      i++;drawStep();
    };
    setAnswerReady(false);
  }
  drawStep();
  return {collect:function(){return choices.slice()}};
}

/* ---- widget: term (query editor) ---- */
function wTerm(ex){

/* ===== render dispatch ===== */
function renderWidget(ex){
  var w=null;
  if(ex.type==='qcm'){w=wChoice(ex,'qcm');}
  else if(ex.type==='multi'){w=wChoice(ex,'multi');}
  else if(ex.type==='match'){w=wMatch(ex);}
  else if(ex.type==='dnd'){w=wDnD(ex);}
  else if(ex.type==='fib'){w=wFib(ex);}
  else if(ex.type==='order'||ex.type==='rank'){w=wOrder(ex);}
  else if(ex.type==='logs'){w=wLogs(ex);}
  else if(ex.type==='branch'){w=wBranch(ex);}
  else if(ex.type==='term'){w=wTerm(ex);}
  S._w=w;
}

/* ===== log rendering + highlighting ===== */
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlLine(line){
  var e=esc(line);
  var re=/(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}\b)|([A-Za-z_][\w.]*)(=)(&quot;.*?&quot;|"[^"]*"|\S+)|(&quot;[^&]*&quot;|"[^"]*")|(?:^|\s)((?:[A-Z]:\\|\/(?:usr|etc|var|opt|home|tmp)\/)[^\s"]+)/g;
  var out='',last=0,m;
  function span(cls,txt){return '<span class="'+cls+'">'+txt+'</span>'}
  while((m=re.exec(e))!==null){
    out+=e.slice(last,m.index);
    if(m[1]){out+=span('tk-ts',m[1]);}
    else if(m[2]){out+=span('tk-ip',m[2]);}
    else if(m[3]){out+=span('tk-key',m[3])+'='+span(/^(EventCode|EventID|eventid|id|ID)$/.test(m[3])?'tk-str':'tk-val',m[5]);}
    else if(m[6]){out+=span('tk-str',m[6]);}
    else if(m[7]){out+=span('tk-path',m[7]);}
    last=re.lastIndex;
  }
  out+=e.slice(last);
  return out;
}
function hlBlock(text){
  return String(text).split('\n').map(function(l){return hlLine(l)}).join('\n');
}
function logPanel(lines,withFilter){
  var h='<div class="logpanel">';
  if(withFilter){
    h+='<div class="logtools"><input type="text" id="logfilter" placeholder="Filter lines (e.g. 4688, an IP, a user)" aria-label="Filter log lines"><span class="cnt" id="logcnt"></span></div>';
  }
  h+='<pre class="loglines" id="loglines">';
  lines.forEach(function(l){h+='<code class="log-line" data-raw="'+esc(l)+'">'+hlLine(l)+'</code>'});
  h+='</pre></div>';
  return h;
}
function wireLogFilter(){
  var inp=$('#logfilter');if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),shown=0,all=0;
    $all('#loglines .log-line').forEach(function(c){
      all++;var raw=(c.getAttribute('data-raw')||'').toLowerCase();
      var ok=!q||raw.indexOf(q)>=0;
      c.classList.toggle('hidden',!ok);if(ok)shown++;
    });
    var cnt=$('#logcnt');if(cnt)cnt.textContent='showing '+shown+' of '+all+' lines';
  });
}

/* ===== grading ===== */
function grade(ex){
  var w=S._w, sel=w.collect(), out={credit:0,rows:[],correctDisplay:'',extra:''};
  var optText=function(id,list){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].text}return id};
  if(ex.type==='qcm'||ex.type==='logs'){
    var correct=ex.correct;
    var ok=sel.length===1&&correct.indexOf(sel[0])>=0;
    out.credit=scoreExercise(ok?sel:[],correct);
    out.correctDisplay=optText(correct[0],(ex.options||ex.sub.options));
  } else if(ex.type==='multi'){
    var c=ex.correct,N=c.length,H=0,W=0;
    var rows=[];
    c.forEach(function(id){
      var got=sel.indexOf(id)>=0;
      if(got){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:optText(id,ex.options)});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:optText(id,ex.options)});}
    });
    sel.forEach(function(id){
      if(c.indexOf(id)<0){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:optText(id,ex.options)});}
    });
    out.credit=scoreExercise(sel,c);out.rows=rows;
  } else if(ex.type==='match'){
    var pairs=w.pairs||{};var N=Object.keys(ex.pairs).length,H=0,W=0,rows=[];
    var gotPairs=[],wantPairs=[];
    Object.keys(ex.pairs).forEach(function(l){
      var want=ex.pairs[l],got=pairs[l];
      var lt=optText(l,ex.left),rt=optText(want,ex.right);
      wantPairs.push(l+'>'+want);
      if(got){gotPairs.push(l+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lt+' \u2192 '+rt});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lt+' \u2192 you chose: '+optText(got,ex.right)+' \u2014 correct: '+rt});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lt+' \u2192 correct: '+rt});}
    });
    out.credit=scoreExercise(gotPairs,wantPairs);out.rows=rows;
  } else if(ex.type==='dnd'||ex.type==='fib'){
    var placed=w.placed||{};var sol=ex.solution;var N=Object.keys(sol).length,H=0,W=0,rows=[];
    var gotFills=[],wantFills=[];
    Object.keys(sol).forEach(function(slotId){
      var want=sol[slotId],got=placed[slotId];
      var lbl=(ex.slots||ex.blanks).filter(function(s){return s.id===slotId})[0];
      var lblT=lbl?(lbl.label||('blank '+slotId)):slotId;
      wantFills.push(slotId+'>'+want);
      if(got){gotFills.push(slotId+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lblT+': '+want});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lblT+': you placed \u201C'+got+'\u201D \u2014 correct: '+want});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lblT+': correct: '+want});}
    });
    out.credit=scoreExercise(gotFills,wantFills);out.rows=rows;
    out.correctDisplay=Object.keys(sol).map(function(k){return sol[k]}).join(', ');
  } else if(ex.type==='order'||ex.type==='rank'){
    var want=ex.order,N=want.length,H=0,W=0,rows=[];
    var gotPos=[],wantPos=[];
    for(var i=0;i<N;i++){
      var it=optText(sel[i],ex._items),okp=sel[i]===want[i];
      gotPos.push(i+'>'+sel[i]);wantPos.push(i+'>'+want[i]);
      var posTxt='Position '+(i+1)+': '+(okp?it:(optText(want[i],ex._items)+' (you placed: '+it+')'));
      if(okp){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:posTxt});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:posTxt});}
    }
    out.credit=scoreExercise(gotPos,wantPos);out.rows=rows;
    out.correctDisplay=want.map(function(id,ix){return (ix+1)+'. '+optText(id,ex._items)}).join('  ');
  } else if(ex.type==='branch'){
    var N=ex.steps.length,H=0,W=0,rows=[];
    var gotSteps=[],wantSteps=[];
    ex.steps.forEach(function(st,ix){
      var got=sel[ix],okc=got===st.correct;
      gotSteps.push(ix+'>'+got);wantSteps.push(ix+'>'+st.correct);
      if(okc){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:'Step '+(ix+1)+': '+optText(st.correct,st.options)});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:'Step '+(ix+1)+': you chose \u201C'+optText(got,st.options)+'\u201D \u2014 best: '+optText(st.correct,st.options)});}
    });
    out.credit=scoreExercise(gotSteps,wantSteps);out.rows=rows;
  } else if(ex.type==='term'){
    var raw=(w.raw?w.raw():sel[0]||'').toLowerCase().replace(/\s+/g,' ').trim();
    var N=ex.elements.length,H=0,W=0,rows=[];
    var gotEls=[],wantEls=[];
    ex.elements.forEach(function(el,ei){
      var hit=false;
      if(el.re){hit=(new RegExp(el.re,'i')).test(raw);}
      else if(el.inc){hit=raw.indexOf(el.inc.toLowerCase())>=0;}
      if(el.danger){
        if(hit){W++;gotEls.push('d'+ei);rows.push({st:'wrong',ic:'\u2717',w:'DANGEROUS \u2014 NEAR MISS',t:el.label});}
      } else {
        wantEls.push('e'+ei);
        if(hit){H++;gotEls.push('e'+ei);rows.push({st:'correct',ic:'\u2713',w:'Correct',t:el.label});}
        else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:el.label});}
      }
    });
    out.credit=scoreExercise(gotEls,wantEls);out.rows=rows;
    out.correctDisplay=ex.expected;
    out.extra='<div class="canon" role="figure" aria-label="Expected query">'+esc(ex.expected)+'</div>';
  }
  if(S.hintUsed[ex.id])out.credit=Math.max(0,out.credit-0.10);
  return out;
}

/* ===== check / next / skip / hint / pause ===== */
function doHint(){
  if(!S.cur||S.hintUsed[S.cur.id])return;
  S.hintUsed[S.cur.id]=true;
  var ex=S.cur;
  if(!$('#hintbox')){
    $('#fbwrap').insertAdjacentHTML('beforebegin','<div class="hintbox" id="hintbox"><span class="h">\uD83D\uDCA1 Hint</span> \u2014 '+esc(ex.hint)+'</div>');
  }
  renderHeader();
}
function markAnswered(ex,credit){
  S.status[ex.id]='answered';S.credit[ex.id]=credit;
}
function feedbackHTML(ex,g){
  var cls,nh;
  if(g.credit>=0.999){cls='f-correct';nh='<span aria-hidden="true">\u2713</span> CORRECT';}
  else if(g.credit>0){cls='f-partial';nh='<span aria-hidden="true">\u2713</span> PARTIALLY CORRECT';}
  else{cls='f-wrong';nh='<span aria-hidden="true">\u2717</span> INCORRECT';}
  var N=0;
  if(ex.type==='multi')N=ex.correct.length;
  else if(ex.type==='match')N=Object.keys(ex.pairs).length;
  else if(ex.type==='dnd'||ex.type==='fib')N=Object.keys(ex.solution).length;
  else if(ex.type==='order'||ex.type==='rank')N=ex.order.length;
  else if(ex.type==='branch')N=ex.steps.length;
  else if(ex.type==='term')N=ex.elements.length;
  var creditLine='';
  if(N>1||ex.type==='term'){
    var hCount=0;g.rows.forEach(function(r){if(r.st==='correct')hCount++});
    creditLine='<div class="credit-line">credit '+ (Math.round(g.credit*100)/100) +' \u2014 '+hCount+'/'+N+' items'+(S.hintUsed[ex.id]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  } else if(S.hintUsed[ex.id]){
    creditLine='<div class="credit-line">credit '+(Math.round(g.credit*100)/100)+' (includes \u22120.10 hint penalty)</div>';
  }
  var rows='';g.rows.forEach(function(r){
    rows+='<div class="itrow st-'+r.st+'"><span class="ic" aria-hidden="true">'+r.ic+'</span><span><b>'+r.w+'</b> \u2014 '+esc(r.t)+'</span></div>';
  });
  var corr=g.correctDisplay?(' <div class="expl"><b>Correct answer:</b> '+esc(g.correctDisplay)+'</div>'):'';
  return '<div class="block b-feedback '+cls+'" role="status"><div class="block-h">'+nh+(N>1?'':'')+'</div><div class="block-body">'+
    creditLine+
    (rows?'<div class="items">'+rows+'</div>':'')+
    corr+g.extra+
    '<div class="expl">'+esc(ex.explanation)+'</div>'+
    '<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>'+
    '</div></div>';
}
function doCheck(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  var ex=S.cur;
  /* Check-triggered auto-pause FIRST (state machine), then feedback */
  tSet('PAUSED_AUTO_CHECK');
  var g=grade(ex);
  markAnswered(ex,g.credit);
  var btn=$('#btnCheck');if(btn)btn.classList.add('hidden');
  $('#fbwrap').innerHTML=feedbackHTML(ex,g);
  /* lock answer widget */
  $all('#ansbody button, #ansbody input, #ansbody [role="button"]').forEach(function(b){
    b.disabled=true;b.classList.add('locked');
  });
  $all('#ansbody .term input').forEach(function(b){b.disabled=true});
  var nb=$('#btnNext');
  nb.classList.remove('hidden');
  var morePending=S.order.some(function(ix,i){return i>S.pos&&S.status[EX[ix].id]!=='answered'});
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(morePending){nb.textContent='\u2192 Next';}
  else if(anySkipped){nb.textContent='\u26A0 Review skipped \u2192';}
  else{nb.textContent='\u23E9 Final Submit';}
  nb.onclick=function(){onNext()};
  $('#btnNext').focus();
  renderHeader();
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){tSet('RUNNING');}
  if(S.fromReview){
    var anyLeft=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
    if(anyLeft&&S.tState!=='ENDED'){goReview();}else{showResults();}
    return;
  }
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doSkip(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  S.status[S.cur.id]='skipped';
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doManualPause(){
  if(!S.cur||S.finished)return;
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S._prevT=S.tState;tSet('PAUSED_MANUAL');
    $('#btnPause').disabled=true;
    /* viewport-fixed overlay + full-content blur, so manual pause works the same
       from the exam view and from the review-skipped view */
    var d=document.createElement('div');d.className='overlay-msg fixed';d.id='ovl';
    d.innerHTML='<b>\u23F8 PAUSED \u2014 manual</b><br>The exercise is hidden while you pause.<br>Your break time is recorded in the results report.<br><br><button class="btn primary" id="btnResume">\u25B6 Resume</button>';
    document.body.appendChild(d);
    var wr=document.querySelector('.wrap');if(wr)wr.classList.add('blur-lock');
    $('#btnResume').onclick=function(){
      tSet(S._prevT||'RUNNING');
      var o=$('#ovl');if(o)o.remove();
      var wr2=document.querySelector('.wrap');if(wr2)wr2.classList.remove('blur-lock');
      renderHeader();
    };
  }
}
function finishFlow(){
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(anySkipped&&S.tState!=='ENDED'){goReview();return;}
  showResults();
}
/* ===== review skipped ===== */
function goReview(){
  var list=S.order.filter(function(ix){return S.status[EX[ix].id]==='skipped'});
  var h='<div class="card"><h2>\u26A0 Review skipped exercises</h2>'+
    '<p class="muted" style="color:var(--text-secondary)">You skipped '+list.length+' exercise(s). You can go back and answer them now, as long as the timer has not ended. If you submit with skipped exercises left, they are excluded from the score.</p>';
  list.forEach(function(ix){
    var ex=EX[ix];
    h+='<div class="revitem"><span class="sk" role="img" aria-label="Skipped">\u26A0 Skipped</span><span class="t">'+esc(ex.title||ex.question)+'</span><button class="btn" data-id="'+esc(ex.id)+'" aria-label="Answer skipped exercise">Answer</button></div>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnFinish">\u23E9 Submit exam now</button></div></div>';
  $('#review-body').innerHTML=h;
  $all('#review-body .revitem button').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      var idx=S.order.indexOf(EX.indexOf(EXBYID[id]));
      showView('#view-exam');
      goToPos(idx,true);
    };
  });
  $('#btnFinish').onclick=function(){showResults()};
  showView('#view-review');
}
/* ===== time end ===== */
function onTimeEnd(){
  if(S.finished)return;
  showResults(true);
}
/* ===== results ===== */
function showResults(timeOver){
  if(S.finished)return;
  S.finished=true;
  S.tState='ENDED';
  renderHeader();
  clearInterval(TID);
  var st=answeredStats();
  var count=st.count,sum=st.sum;
  var percent=count>0?Math.round(sum/count*100):0;
  var passed=percent>=70;
  var fully=0,partial=0,partialAvg=0,wrong=0,skipped=0,psum=0;
  S.order.forEach(function(ix){
    var ex=EX[ix],stt=S.status[ex.id];
    if(stt==='answered'){
      var c=S.credit[ex.id];
      if(c>=0.999)fully++;else if(c>0){partial++;psum+=c;}else wrong++;
    } else skipped++;
  });
  if(partial>0)partialAvg=psum/partial;
  /* report to site: exactly once per attempt, at results */
  if(!S.reported){
    S.reported=true;
    reportScore(sum,count,percent,passed);
  }
  var h='<div class="card"><h2>Final results</h2>'+
    '<div class="bigscore">'+fmt1(sum)+' / '+count+'  <span style="font-size:1.4rem;color:var(--text-secondary)">('+percent+'%)</span></div>'+
    '<p class="muted" style="color:var(--text-secondary)">Score computed only over answered exercises. Pass mark: 70%.</p>'+
    (timeOver?'<p style="color:var(--state-paused)">\u23F1 Time ended \u2014 unanswered exercises were excluded.</p>':'')+
    '<div class="cert '+(passed?'':'fail')+'" role="status">'+
    '<div class="cpass">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'+
    '<div class="csub">'+(passed?'Certificate-worthy performance on this severity.':'You must retake this exam. Review the explanations, then try again \u2014 questions and options will be reshuffled.')+'</div>'+
    '</div>'+
    '<div class="brk">'+
    '<div class="brkrow b-correct"><span class="ic">\u2713</span> Fully correct <span class="n">'+fully+'</span></div>'+
    '<div class="brkrow b-partial"><span class="ic">\u2713</span> Partially correct '+(partial>0?('(avg credit '+ (Math.round(partialAvg*100)/100) +')'):'')+' <span class="n">'+partial+'</span></div>'+
    '<div class="brkrow b-wrong"><span class="ic">\u2717</span> Fully incorrect <span class="n">'+wrong+'</span></div>'+
    '<div class="brkrow b-skipped"><span class="ic">\u26A0</span> Skipped \u2014 excluded from score <span class="n">'+skipped+'</span></div>'+
    '</div>';
  /* per-theme mini progress */
  var themes={};
  S.order.forEach(function(ix){var ex=EX[ix];themes[ex.theme]=themes[ex.theme]||{a:0,t:0};
    themes[ex.theme].t++;if(S.status[ex.id]==='answered')themes[ex.theme].a++;});
  var mt='<div class="mini-themes">';
  Object.keys(themes).forEach(function(t){mt+='<span class="mt">'+esc(t)+': <b>'+themes[t].a+'/'+themes[t].t+'</b></span>'});
  mt+='</div>';
  h+=mt;
  h+='<p class="kv">Time paused manually: <b>'+fmtTime(S.pauseAcc.manual)+'</b> \u00B7 Time paused reviewing feedback: <b>'+fmtTime(S.pauseAcc.auto)+'</b></p>';
  if(PROFILE.username)h+='<p class="kv">Attempt by <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'')+'</p>';
  h+='<div style="margin-top:14px"><button class="btn green" id="btnRetake">\u21BA Retake exam</button></div>';
  h+='</div>';
  $('#results-body').innerHTML=h;
  $('#btnRetake').onclick=function(){
    newAttempt();S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');goToPos(0);
  };
  showView('#view-results');
}
/* ===== site integration ===== */
function reportScore(creditSum,answeredCount,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  PROFILE.username=event.data.username||'';
  PROFILE.country=event.data.country||'';
  PROFILE.locale=event.data.locale||'en';
  /* theme field is always 'dark'; files are dark-only by contract, nothing to switch */
});

/* ===== boot ===== */
function boot(){
  newAttempt();
  renderIntro();
  showView('#view-intro');
}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
