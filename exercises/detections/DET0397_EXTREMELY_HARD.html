var INTRO = {"html": "\n<div class=\"intro-head\">\n  <h1>DET0397 — EXTREMELY HARD practice exam</h1>\n  <div class=\"obj\">MITRE ATT&amp;CK Detection Strategy <b>DET0397</b> — Automated Exfiltration Detection Strategy<br>\n  Detects: <b>T1020 — Automated Exfiltration</b> (Tactic: Exfiltration) · Enterprise domain</div>\n  <span class=\"badge extremely-hard\" role=\"img\" aria-label=\"Severity EXTREMELY HARD\">EXTREMELY HARD</span>\n  <span id=\"intro-greet\" style=\"margin-left:10px;color:var(--text-secondary);font-size:.92rem\"></span>\n  <div class=\"facts\" style=\"margin-top:12px\">\n    <span class=\"fact\">Exercises: <b>15</b></span>\n    <span class=\"fact\">Estimated time: <b>75 min</b></span>\n    <span class=\"fact\">Timer budget: <b>75 min</b></span>\n    <span class=\"fact\">Pass mark: <b>70%</b></span>\n    <span class=\"fact\">Scoring: <b>partial credit</b></span>\n  </div>\n</div>\n<div class=\"card\">\n  <h2>What you will learn here</h2>\n  <p>Hello! In this exam you will learn about <b>DET0397</b>, the <b>Automated Exfiltration Detection Strategy</b> from the MITRE ATT&amp;CK framework.</p><p>First, what is a <b>detection strategy</b>? In ATT&amp;CK, a detection strategy is a plan that tells defenders <i>how</i> to notice one attacker behaviour. It says which logs to collect, what pattern to look for, and which parts you can tune for your own company. DET0397 watches for <b>T1020 — Automated Exfiltration</b>. That is when malware sends stolen data out by itself, again and again, without a human typing anything. The data often leaves in small pieces, on a schedule, so it looks quiet and normal.</p><p>Who uses this in real work? <b>Detection engineers</b> build the rules. <b>SOC analysts</b> get the alerts and decide if they are real. <b>Threat hunters</b> search old logs for the same pattern. <b>Incident responders</b> use it to see what data left a hacked host. <b>CTI analysts</b> connect the pattern to known groups. The tools are a SIEM, EDR on computers, and network flow sensors.</p><p>Why does it matter? If data leaves your network silently, the damage is often found months later. This detection gives you an early alarm.</p><p>You will meet this object in: alert triage queues, detection rule reviews, threat-hunt notes, tuning meetings, and incident reports. The risks it addresses are silent data theft, long-dwell breaches, and lost customer data.</p><p>This EXTREMELY HARD file chains <b>three or more ideas</b>, adds noise and conflicting signals, and asks for senior-level decisions.\n</div>\n<div class=\"card\">\n  <h2>Keywords covered in this exam</h2>\n  <div class='kw-theme'>The detection object and ATT&CK position</div><div class='chips'><span class='chip'>T1020.001 / network-device gap</span><span class='chip'>USB air-gap gap (T1052)</span><span class='chip'>SaaS API export gap</span></div><div class='kw-theme'>Data sources and telemetry</div><div class='chips'><span class='chip'>multi-source correlation under noise</span><span class='chip'>Sysmon 3/11/22</span><span class='chip'>4688/4698</span><span class='chip'>unified log + launchd</span></div><div class='kw-theme'>Analytics and detection logic</div><div class='chips'><span class='chip'>conflicting signals (trusted IP vs cadence)</span><span class='chip'>clock skew and backfill</span><span class='chip'>low-and-slow aggregation</span></div><div class='kw-theme'>Tuning and mutable elements</div><div class='chips'><span class='chip'>tuning packages under pressure</span><span class='chip'>TimeWindow discipline</span><span class='chip'>UserContext scoping</span><span class='chip'>DestinationIP allowlists</span></div><div class='kw-theme'>False positives and baselines</div><div class='chips'><span class='chip'>CDN-hosted drop points</span><span class='chip'>intern-created bucket</span><span class='chip'>audited vendor backup</span></div><div class='kw-theme'>Detection engineering practice</div><div class='chips'><span class='chip'>read-only query discipline</span><span class='chip'>estate-wide aggregation pitfall</span><span class='chip'>evidence-first tuning programme</span><span class='chip'>prioritisation under incomplete data</span></div><div class='kw-theme'>Real-world procedures and threat actors</div><div class='chips'><span class='chip'>Kimsuky (staged-filename gating)</span><span class='chip'>Ebury (DNS-TXT destinations)</span></div><div class='kw-theme'>Coverage gaps and compensating detections</div><div class='chips'><span class='chip'>compensating detections per gap</span><span class='chip'>detect-don't-enforce boundary</span></div>\n</div>\n<div class=\"card\">\n  <h2>How this exam works</h2>\n  <ul class=\"rules\">\n      <li class=\"r-pass\"><b>Pass mark: 70%.</b> Your score is computed only over exercises you actually answered.\n        PASS means you showed solid control of this severity. FAIL means you should read the explanations and retake.</li>\n      <li class=\"r-info\"><b>Exercise types in this file:</b> log analysis, branching decisions, a SIEM query editor, matching, ranking, ordering, drag-and-drop, fill-in-the-blank.</li>\n      <li class=\"r-timer\"><b>Timer:</b> you have <b>75 minutes</b> (estimated effort: about 75 minutes).\n        The timer has two kinds of pause. The <b>Pause button</b> is a manual break: the exercise hides and the timer stops.\n        Pressing <b>Check</b> also stops the timer automatically so you can read the feedback for as long as you want —\n        it resumes only when you press <b>Next</b> (or Final Submit on the last exercise). Skipping and hints never pause the timer.</li>\n      <li class=\"r-part\"><b>Partial credit:</b> exercises with several correct items give <b>partial credit</b>:\n        credit = max(0, (right − wrong) / total items). Selecting everything “to be safe” gives zero.\n        One hint per exercise costs −0.10 of that exercise's credit.</li>\n      <li class=\"r-skip\"><b>Skip:</b> you can skip any exercise and return to skipped ones before you finish.\n        Skipped-and-never-answered exercises are simply excluded from the score. The exam ends with a\n        “Review skipped exercises” screen while the timer is still running.</li>\n    \n  </ul>\n  <div style=\"margin-top:16px\"><button class=\"btn primary\" id=\"btnStart\" style=\"min-width:180px\">▶ Start the exam</button></div>\n</div>\n"};
var EX = [{"id": "x01", "type": "logs", "theme": "False positives and baselines", "title": "Trusted IP, machine cadence", "collapsedSummary": "WKS-eng-42 → CDN range, exact 300 s cadence — resolve the conflict.", "scenario": "18:47, Tuesday. The CISO's daily digest flags WKS-eng-42. Two facts fight each other. Fact 1: the destination belongs to a major CDN range your proxy usually trusts. Fact 2: the cadence is machine-perfect — every 300 seconds, including 03:00, from an unsigned binary in Temp. The proxy team warns that blocking the CDN range yesterday broke two internal apps. Decide.", "artefacts": [{"label": "ARTEFACT 1 — Sysmon EventCode 3, WKS-eng-42 (six of 41 cycles)", "logs": ["02:59:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443", "03:04:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443", "03:09:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443", "17:44:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443", "17:49:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443", "17:54:55 EventCode=3 host=WKS-eng-42 Image=C:\\Windows\\Temp\\updater.exe DestinationIp=151[.]101[.]65[.]140 DestinationPort=443"]}], "question": "Which call do you defend to the CISO?", "sub": {"mode": "qcm", "prompt": "One option is the senior answer.", "options": [{"id": "a", "text": "Conflict unresolved — treat as suspected T1020, keep collecting, verify the binary and which CDN tenant it hits before any block"}, {"id": "b", "text": "Close it — the CDN range is on the trusted list, and trusted ranges end the discussion"}, {"id": "c", "text": "Block the whole CDN range now — a 300 s cadence from Temp is proof enough"}, {"id": "d", "text": "Reimage the workstation from the ticket queue and move on — evidence is a formality"}]}, "correct": ["a"], "explanation": "Two signals contradict: the destination is infrastructure the business normally trusts, but the behaviour is automation — 41 machine-perfect cycles from an unsigned Temp binary. Neither signal wins alone: major CDNs also host attacker drop points (same IP, different tenant), and a perfect cadence alone does not name the data. The senior move is to resolve the conflict explicitly: keep the detection running, pull process lineage and the TLS/SNI or host header to see WHICH tenant on that CDN IP is receiving, then decide. B ignores that allowlists are context, not verdicts. C repeats yesterday's outage for no gain and tips off the operator. D destroys the evidence.", "study": "Resolving signal conflicts in AN1113 alerts: destination trust vs behavioural automation.", "hint": "Neither the allowlist nor the cadence can win on its own — what single extra fact would break the tie?"}, {"id": "x02", "type": "branch", "theme": "Detection engineering practice", "title": "The alert on the backup server itself", "collapsedSummary": "SRV-BKP-01 beacons — four decisions under SLA pressure.", "scenario": "21:30. AN1113 fires on SRV-BKP-01 — the corporate backup server. The finance CFO owns the backup SLA: “tonight's 23:00 run must not fail”. The CISO wants scope confirmation. You have four decisions to make before the run.", "question": "Work all four steps.", "steps": [{"context": "The alert names bkp-shadow.exe — not the vendor agent name you know.", "question": "STEP 1 — What establishes whether this is the approved backup stack?", "options": [{"id": "a", "text": "Compare task name, binary signature, owner account and parent process against the approved backup change record"}, {"id": "b", "text": "Trust the server role — backup servers only run backup software"}, {"id": "c", "text": "Ask the vendor by email and wait a day"}, {"id": "d", "text": "Uninstall the vendor agent to see if the traffic stops"}], "correct": "a", "ack": "Correct — the change record is the ground truth for what approved automation looks like on this host."}, {"context": "The change record says vendor agent, daily 01:00, vendor cloud only. A 30-day lookback shows exactly that — until 3 days ago, when bkp-shadow.exe appeared and cadence shifted to every 15 minutes to a different provider.", "question": "STEP 2 — What does the 3-day-old behaviour change tell you?", "options": [{"id": "a", "text": "A recent change on a stable baseline is the strongest signal you have — treat the new pattern as the intrusion and the old one as the baseline"}, {"id": "b", "text": "Nothing — servers change behaviour all the time"}, {"id": "c", "text": "It proves the vendor rotated infrastructure — stand down"}, {"id": "d", "text": "It proves nothing either way — delete the 30-day lookback as irrelevant"}], "correct": "a", "ack": "Right: baseline vs delta is the core of hunting — the analytic fired because the delta exists."}, {"context": "23:00 run is in 90 minutes. The 15-minute cadence is still shipping to the new provider.", "question": "STEP 3 — Protect the SLA AND stop the theft. Which move does both?", "options": [{"id": "a", "text": "Allow only the vendor cloud destination, block the new provider's IPs, disable only the bkp-shadow task — the 23:00 vendor run keeps its path"}, {"id": "b", "text": "Shut the server down until morning — the SLA dies, but so does the theft"}, {"id": "c", "text": "Block nothing — the SLA outranks the incident"}, {"id": "d", "text": "Allow everything from the host for tonight — sort it out tomorrow"}], "correct": "a", "ack": "Surgical: the approved path stays open, the rogue path closes, the SLA holds. The costly trade-off is accepted on purpose, not by accident."}, {"context": "Cadence stopped. The CISO asks what you still need before declaring scope.", "question": "STEP 4 — What is the evidence-critical step before scope can be declared?", "options": [{"id": "a", "text": "Capture what bkp-shadow ran with and what it staged, snapshot the event chain, and hand the timeline to IR before any cleanup"}, {"id": "b", "text": "Delete the task and script immediately — a clean host is a scoped host"}, {"id": "c", "text": "Declare scope from the alert card alone — it fired, so the server is breached"}, {"id": "d", "text": "Wait a week — scope always becomes clear on its own"}], "correct": "a", "ack": "Evidence before cleanup — otherwise scope stays a guess and the report has a hole."}], "explanation": "Step 1: on a server whose whole job is automated sending, identity of the automation is everything — the change record separates the approved sender from the impostor. Step 2: your baseline (daily, vendor-only) versus a 3-day-old delta (every 15 min, new provider) is the strongest signal in the case — deltas on stable servers are how T1020 hides. Step 3 is the costly-action trap: the correct move accepts real business risk on purpose — keep the vendor path open for the SLA, close only the rogue path — instead of the two lazy extremes (kill everything, or allow everything). Step 4: cleanup without evidence capture makes scope undeclarable; the timeline handed to IR is the deliverable.", "study": "Incident decisions where detection, business SLA and evidence preservation collide.", "hint": "Step 3: which option keeps the approved path open? Step 4: what cannot be recovered after deletion?"}, {"id": "x03", "type": "multi", "theme": "Data sources and telemetry", "title": "Twelve lines, one chain", "collapsedSummary": "Select every line that belongs to the AN1113 signal chain.", "scenario": "WKS-cfo-01, 04:00 sweep. Twelve lines, mixed noise. The chain you are building for the IR case: task automation registered → process spawned by it → repeated connections by that process. Select every line that belongs to that chain — and none of the noise. Partial credit applies.", "artefacts": [{"label": "ARTEFACT 1 — merged timeline, WKS-cfo-01 (12 lines)", "logs": ["L1  03:58:02 EventCode=4624 host=WKS-cfo-01 LogonType=7 user=cfo_alice", "L2  04:00:11 EventCode=808  host=WKS-cfo-01 SpoolerStatus=running", "L3  04:01:40 EventCode=4688 host=WKS-cfo-01 NewProcessName=C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe", "L4  04:02:15 EventCode=4698 host=WKS-cfo-01 TaskName=\\WinCacheOpt TaskXml=...powershell -w hidden -enc JABz...", "L5  04:03:00 EventCode=3 host=WKS-cfo-01 Image=...chrome.exe DestinationIp=151[.]101[.]1[.]164:443", "L6  04:05:01 EventCode=4688 host=WKS-cfo-01 NewProcessName=...powershell.exe ParentImage=...wscript.exe CommandLine=powershell -w hidden -enc JABz", "L7  04:05:20 EventCode=22 host=WKS-cfo-01 Image=...powershell.exe QueryName=updatekit-cdn[.]example Result=NXDOMAIN", "L8  04:06:12 EventCode=4688 host=WKS-cfo-01 NewProcessName=...Teams.exe user=cfo_alice", "L9  04:10:01 EventCode=3 host=WKS-cfo-01 Image=...powershell.exe DestinationIp=203[.]0[.]113[.]77:8080", "L10 04:12:44 EventCode=4662 host=WKS-cfo-01 ObjectType=directory user=cfo_alice", "L11 04:15:01 EventCode=3 host=WKS-cfo-01 Image=...powershell.exe DestinationIp=203[.]0[.]113[.]77:8080", "L12 04:16:09 EventCode=4672 host=WKS-cfo-01 user=cfo_alice"]}], "question": "Select ALL lines that belong to the AN1113 signal chain.", "options": [{"id": "a", "text": "L4 — scheduled task \\WinCacheOpt registered with an encoded PowerShell payload"}, {"id": "b", "text": "L3 — chrome.exe process creation"}, {"id": "c", "text": "L6 — powershell.exe spawned by wscript.exe, hidden window, encoded command"}, {"id": "d", "text": "L9 — powershell.exe connects to 203[.]0[.]113[.]77:8080"}, {"id": "e", "text": "L1 — interactive logon for cfo_alice"}, {"id": "f", "text": "L11 — powershell.exe repeats the same connection 5 minutes later"}], "correct": ["a", "c", "d", "f"], "explanation": "The chain needs all four: L4 registers the automation (DC0001 flavour evidence — the task is the clock), L6 is the process the task spawns (DC0032), and L9 + L11 are the repeating connections (DC0082) five minutes apart — the periodicity AN1113 correlates. L3/L5 are the CFO's normal browser — realistic noise that shares nothing but shape with the signal. L1/L10/L12 are context, not chain. L7 is a near-miss: it involves the same PowerShell, but a DNS query with NXDOMAIN is a failed lookup, not a transfer — interesting for the report, not part of the connection evidence.", "study": "Building the full AN1113 chain from a noisy merged timeline: task → process → repeated connections.", "hint": "The chain is: the clock, the worker, and the repeated trips. A failed DNS lookup is not a trip."}, {"id": "x04", "type": "term", "theme": "Detection engineering practice", "title": "Write the read-only hunt query", "collapsedSummary": "SIEM search bar — prove repeated automated uploads without touching evidence.", "scenario": "Legal has put WKS-legal-03 under litigation hold: nothing on it may be modified, and the query you run becomes part of the case file. The CISO wants proof, in one query, of “repeated automated uploads from that host, excluding trusted destinations”. Your role is read-only.", "question": "Write one search-head query that correlates Sysmon 3 with process creation (4688) on PID, aggregates repeats by host and destination, requires at least 3 repeats, and excludes the trusted lookup — without any state-changing command.", "prompt": "search>", "placeholder": "sourcetype=... | ...", "banner": "SIEM search bar — role: read-only analyst. Case: LIT-2026-014.", "echo": "[simulated] search accepted — 3 periodic patterns on 1 host, 1 destination flagged", "syntaxNote": "Pseudo-SPL is fine: sourcetype=..., | join, | stats, | where, | search NOT. Read-only role: state-changing commands are forbidden and logged.", "expected": "sourcetype=sysmon EventCode=3\n| join PID [ search sourcetype=wineventlog EventCode=4688 host=WKS-legal-03 ]\n| stats count, min(_time), max(_time) by host, dest_ip\n| where count >= 3\n| search NOT dest_ip IN (trusted_destinations)", "elements": [{"inc": "eventcode=3", "label": "Selects Sysmon network connection events (EventCode=3)"}, {"inc": "eventcode=4688", "label": "Selects Windows process creation events (EventCode=4688)"}, {"re": "join[^(]*\\[?[^\\]]*pid", "label": "Joins the two halves on the process identity (PID)"}, {"re": "stats\\s+count", "label": "Aggregates repeats with stats count"}, {"re": "count\\s*>=\\s*3", "label": "Requires at least 3 repeats — the periodicity floor"}, {"inc": "trusted", "label": "Excludes trusted destinations (DestinationIP filter)"}, {"inc": "| delete", "danger": true, "label": "Running '| delete' would destroy searchable evidence under litigation hold"}, {"inc": "outputlookup", "danger": true, "label": "Running '| outputlookup' would modify lookup state from a read-only role"}], "explanation": "The query is AN1113 in SIEM form: the Sysmon half selects connections, the 4688 half names the process, the join key is the process identity (PID — the same join key you fixed in the HARD exam), stats counts the repeats per host and destination, count >= 3 encodes the periodicity floor, and the trusted lookup implements the DestinationIP mutable element. Under litigation hold, any state-changing command (‘| delete’, ‘| outputlookup’) is not a shortcut — it is evidence destruction and an audit event. Read-only discipline is part of the answer, not a formality.", "study": "Translating AN1113 into a single SIEM query — and read-only constraints during legal holds.", "hint": "The five building blocks: two event filters, a PID join, a count with a floor of 3, and the trusted exclusion."}, {"id": "x05", "type": "match", "theme": "Real-world procedures and threat actors", "title": "Three evidence rows, three verdicts", "collapsedSummary": "Evidence → attribution assessment, with one confidence killer.", "scenario": "CTI hand-off. Three evidence rows from the hunt. For each, give the assessment a briefing could defend — including the row that WEAKENS attribution.", "question": "Match each evidence row to its assessment.", "left": [{"id": "l1", "text": "Row 1: Windows script exfiltrates every 10 min after checking pre-named staged filenames"}, {"id": "l2", "text": "Row 2: Linux daemon sends credentials via UDP to an IP read from a DNS TXT record"}, {"id": "l3", "text": "Row 3: the same 10-minute script is found on 200 unrelated honeypots with no victim overlap"}], "right": [{"id": "r1", "text": "Consistent with the Kimsuky T1020 procedure (staged-filename gating, 10-min loop)", "short": "matches Kimsuky procedure"}, {"id": "r2", "text": "Matches the Ebury credential-exfil pattern (UDP to DNS-TXT-derived IP)", "short": "matches Ebury pattern"}, {"id": "r3", "text": "Weakens exclusive attribution — wide untargeted spread points at shared tooling", "short": "weakens attribution"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3"}, "explanation": "Row 1 is a Kimsuky fingerprint on the T1020 page: the 10-minute loop plus the staged-filename checks are exactly their documented procedure — supporting (not proving) attribution. Row 2 is Ebury's documented trick: the destination lives in a DNS TXT record, so the send target rotates without a new binary. Row 3 is the confidence killer every briefing must survive: the same script appearing on 200 untargeted honeypots says the tooling is shared or public, so finding it does not mean finding that group. Attribution is argued from TTP overlap PLUS targeting, and hedged when tooling is widespread — never claimed from one artefact.", "study": "Attribution discipline for T1020 evidence: procedure fingerprints vs shared tooling.", "hint": "Two rows strengthen, one row deflates — which one would you least like to admit in the briefing?"}, {"id": "x06", "type": "order", "theme": "Analytics and detection logic", "title": "Rebuild the night in order", "collapsedSummary": "Five events from FIN-ARC-01 — reconstruct the incident timeline.", "scenario": "For the IR report you must reconstruct what happened on FIN-ARC-01 from the collected evidence below, in true time order. Two clocks: the task's registered time and the network's first-seen times. The archive share holds the staged folder.", "artefacts": [{"label": "ARTEFACT 1 — evidence set, FIN-ARC-01 (out of order)", "pre": "E-v: 23:58:40  Sysmon 3    archiver.exe -> 198[.]51[.]100[.]31:443 (repeat #4, ~40 MB out)\nE-i: 23:14:02  4698         task \\ArcShip registered: archiver.exe every 15 min\nE-u: 22:41:33  Sysmon 11    ~300 files written to D:\\arcstage\\ by unknown process\nE-t: 23:13:48  4688         first archiver.exe run, parent svchost (task launch)\nE-r: 22:10:05  Sysmon 3     archiver.exe seen resolving arcship-cdn[.]example (first DNS hit)"}], "question": "Order the evidence items from earliest to latest.", "items": [{"id": "i1", "text": "E-r — first DNS resolution of the drop domain (22:10)"}, {"id": "i2", "text": "E-u — staging folder fills with ~300 files (22:41)"}, {"id": "i3", "text": "E-i — task \\ArcShip registered (23:14:02)"}, {"id": "i4", "text": "E-t — first archiver.exe run by the task (Security log stamps it 23:13:48)"}, {"id": "i5", "text": "E-v — fourth periodic upload completes (23:58)"}], "order": ["i1", "i2", "i3", "i4", "i5"], "explanation": "The true sequence: the binary phones home first (E-r, 22:10 — setup chatter), the staging folder fills (E-u, 22:41 — collection/staging before automation), the task registration lands (E-i, 23:14:02) with its first launch (E-t, logged at 23:13:48 — a 14-second clock skew between the Security and Sysmon sources; the skew is the realistic wrinkle you must reason past, since a task cannot run before it exists), and the periodic uploads continue (E-v). Note the lesson inside the lesson: when two sources disagree by seconds, source clock skew wins the explanation — not “impossible evidence”.", "study": "Timeline reconstruction for T1020 incidents: setup chatter → staging → registration → repeats, plus clock skew.", "hint": "A task cannot be launched before it is registered — when that seems violated, blame the two sources' clocks, and order by sequence."}, {"id": "x07", "type": "qcm", "theme": "Analytics and detection logic", "title": "Flows from a host that cannot flow", "collapsedSummary": "mac-design-02 was isolated 20 minutes before the log window.", "scenario": "mac-design-02 was network-isolated at 14:00 (NAC quarantine, port shut). At 14:22 you review AN1115 evidence: unified-log network entries show the LaunchDaemon connecting to an external IP at 14:05, 14:06, 14:07 — all AFTER the isolation time, per the log timestamps. The sensor team confirmed no outage.", "question": "What is the correct senior read of this evidence?", "options": [{"id": "a", "text": "Post-isolation flows are impossible from that port — verify sensor/agent clock skew and event backfill against the exact isolation timestamp before drawing scope conclusions"}, {"id": "b", "text": "The isolation failed — escalate for an emergency datacentre shutdown"}, {"id": "c", "text": "The analytic is buggy — file a ticket and disable AN1115 fleet-wide"}, {"id": "d", "text": "The LaunchDaemon must be communicating by Wi-Fi — treat scope as confirmed and move to cleanup"}], "correct": ["a"], "explanation": "You are holding an impossible artefact: a quarantined port cannot originate new flows. Before any scope decision, explain the impossibility — the usual suspects are clock skew between the sensor and the NAC platform, or event backfill (delayed delivery of pre-isolation events stamped with older times). The evidence stays valuable: the FLOWS are real T1020 behaviour; the timestamps are what cannot yet be trusted for scope. B catastrophises on unverified data, C throws away coverage over a timestamp puzzle, and D assumes an unproven bypass and would send cleanup ahead of scope — the exact order senior responders refuse.", "study": "Impossible evidence in correlation data: clock skew and backfill before scope calls.", "hint": "The log says the host talked; the port says it could not. Which one is measured, and which one is inferred?"}, {"id": "x08", "type": "qcm", "theme": "Tuning and mutable elements", "title": "Cut 40% noise without losing the quiet ones", "collapsedSummary": "The tuning decision the CISO wants in 10 minutes.", "scenario": "AN1113's FP rate is 40%: three approved vendors and two human-driven sync tools. The CISO gives you 10 minutes to pick the tuning package. Constraint from the hunt team: whatever you choose must keep catching a low-and-slow beacon that fires one connection every 6 hours — that pattern is why this analytic exists.", "question": "Which tuning package do you defend?", "options": [{"id": "a", "text": "Allowlist the three vendor destinations, scope to service accounts, keep the TimeWindow — human sync noise drops, the 6-hour beacon still aggregates"}, {"id": "b", "text": "Raise the repeat threshold to 50 connections — noise disappears at once"}, {"id": "c", "text": "Disable AN1113 for 30 days while the noise is studied"}, {"id": "d", "text": "Block every destination that has ever appeared in an AN1113 alert"}], "correct": ["a"], "explanation": "The package attacks each noise type with its own knob — vendors via DestinationIP, human-driven tools via account scope — while keeping the repeat logic intact. The 6-hour beacon survives: aggregation still counts its repeats, and its destinations are not allowlisted. B is the trap that looks like an industry default: a threshold of 50 makes the analytic blind to exactly the low-and-slow pattern in your constraint — you would silence the alarm to stop the noise. C deletes coverage; D is a business-continuity incident in disguise (it blocks approved destinations the moment they alert).", "study": "Tuning packages that preserve low-and-slow coverage: per-knob fixes, not threshold shocks.", "hint": "Read the constraint again: which option kills the 6-hour beacon instead of the noise?"}, {"id": "x09", "type": "dnd", "theme": "Detection engineering practice", "title": "Three implementation sins, three bills", "collapsedSummary": "Different flaws from the HARD set — match each to its bill.", "scenario": "Architecture review, three production implementations of DET0397 analytics. Each flaw below is real in your estate. For each, name the bill the team pays.", "question": "Drag each implementation sin to the bill the team pays.", "bank": ["Sin A: correlation has no time window — events from the same host ever, in any order, join", "Sin B: aggregation is estate-wide — one count across ALL hosts", "Sin C: the analytic blocks the destination directly in the rule"], "slots": [{"id": "s1", "label": "A task registered Monday joins a browser connection from Friday; periodicity is meaningless →"}, {"id": "s2", "label": "One noisy host's 500 connections are averaged into silence for the single quiet beacon on another host →"}, {"id": "s3", "label": "The detection itself cuts business flows and destroys the evidence before triage →"}], "solution": {"s1": "Sin A: correlation has no time window — events from the same host ever, in any order, join", "s2": "Sin B: aggregation is estate-wide — one count across ALL hosts", "s3": "Sin C: the analytic blocks the destination directly in the rule"}, "explanation": "Sin A pays in correctness: without the TimeWindow, the join loses its meaning — periodicity IS the detection, and “same host, any time, any order” is not periodicity. Sin B pays in visibility: estate-wide averaging is how one loud host hides one quiet beacon — aggregate per host and per destination, then threshold. Sin C pays twice at once: a detection's job is to signal, not to enforce — blocking inside the rule breaks approved flows with no verification step AND burns the live evidence before triage can see it. Analytics detect; enforcement lives elsewhere.", "study": "Implementation discipline for DET0397 analytics: windowed joins, per-host aggregation, detect-don't-enforce.", "hint": "One sin is about time, one about where the count is taken, one about what a detection is allowed to do."}, {"id": "x10", "type": "multi", "theme": "Coverage gaps and compensating detections", "title": "Where the three analytics are blind", "collapsedSummary": "Select every behaviour DET0397 cannot see (partial credit).", "scenario": "Gap assessment for the annual control review. DET0397 = AN1113 (Windows) + AN1114 (Linux) + AN1115 (macOS), all host-centric. Select every behaviour the strategy CANNOT see. Compensation candidates exist for each — name them in the review, not here.", "question": "Select ALL behaviours outside DET0397's coverage.", "options": [{"id": "a", "text": "Traffic mirroring abuse on routers/switches (T1020.001) with no host involved"}, {"id": "b", "text": "A LaunchDaemon on macOS beaming archives every 90 seconds"}, {"id": "c", "text": "Exfiltration over USB from an air-gapped host — no network at all"}, {"id": "d", "text": "A Windows scheduled task uploading staged files hourly to an unknown VPS"}, {"id": "e", "text": "Bulk export via a SaaS application's API (attacker queries the cloud app directly, no endpoint touched)"}, {"id": "f", "text": "A cron daemon on Linux pushing archives to a remote IP every 20 minutes"}], "correct": ["a", "c", "e"], "explanation": "Three blind spots: (a) network-device mirroring — no host logs exist for AN1113/1114/1115 to read; (c) air-gapped USB exfiltration — no network telemetry can exist on a path that has none (that is T1052 territory, physical medium); (e) SaaS API export — the data leaves the cloud provider's perimeter without ever traversing an instrumented endpoint. The other three are exactly the per-platform patterns the three analytics catch. Compensations for the gaps: network-device config monitoring and flow analytics for (a), media/endpoint controls for (c), and cloud-side audit-log analytics for (e) — each a different strategy, none part of DET0397.", "study": "DET0397's coverage boundary: host-centric network telemetry only — and the compensating strategies per gap.", "hint": "For each option ask: which host log source would fire? If none exists, it is a gap."}, {"id": "x11", "type": "match", "theme": "Tuning and mutable elements", "title": "Four proposals, four verdicts", "collapsedSummary": "The tuning committee's four ideas — rate them.", "scenario": "Tuning committee, four proposals for AN1113. Rate each: safe tuning, or a coverage killer. One proposal hides a widely-used best practice that is wrong for this estate.", "question": "Rate each tuning proposal: safe, risky, or a coverage killer?", "left": [{"id": "l1", "text": "Proposal 1: allowlist the audited vendor backup destination"}, {"id": "l2", "text": "Proposal 2: “block everything that ever alerts” as standing policy — the popular “zero trust egress” shortcut"}, {"id": "l3", "text": "Proposal 3: shorten TimeWindow from 10 min to 60 s"}, {"id": "l4", "text": "Proposal 4: scope UserContext to service accounts, with a documented exception list"}], "right": [{"id": "r1", "text": "Safe — removes approved noise, coverage intact", "short": "safe"}, {"id": "r2", "text": "Coverage killer — enforcement bolted onto detection; breaks approved flows and burns evidence", "short": "coverage killer"}, {"id": "r3", "text": "Risky — sparse 6-hour beacons fall outside; the low-and-slow case dies", "short": "kills low-and-slow"}, {"id": "r4", "text": "Mostly safe — watch the documented exceptions (user-scheduled tasks)", "short": "mostly safe"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "Proposal 1 is textbook safe tuning: an audited, approved destination leaves the alert queue, and nothing else changes. Proposal 2 is the best-practice trap: “block everything that alerts” sounds decisive, but it welds enforcement onto a detection — approved flows break with no verification, and every future alert destroys its own evidence before a human looks. Proposal 3 looks rigorous but quietly kills sparse beacons: a 6-hour cadence never repeats inside a 60-second window, so the one pattern the analytic exists for stops aggregating. Proposal 4 is right with one discipline: the exception list is a living document, not a favour.", "study": "Tuning verdicts: allowlists yes, enforcement no, window shrinking with care, scoping with exceptions.", "hint": "One proposal uses a detection to enforce — that is the category error."}, {"id": "x12", "type": "rank", "theme": "Detection engineering practice", "title": "The 08:00 queue with holes in it", "collapsedSummary": "Four AN1113 alerts, incomplete data — rank by response priority.", "scenario": "08:00. Four AN1113 alerts, all missing some data. Context: DC01 is a domain controller; the build farm runs prod CI; “fresh VPS” = first seen 45 minutes ago; the design S3 bucket was created yesterday by an intern. Rank by response priority.", "question": "Rank the 08:00 queue: which alert do you work first?", "items": [{"id": "i1", "text": "A: DC01 — task \\HealthSync every 5 min → fresh VPS; process telemetry NOT yet onboarded"}, {"id": "i2", "text": "B: build-lin-04 (prod CI) → unknown VPS every 10 min; svc_ci account; script in /dev/shm"}, {"id": "i3", "text": "C: wks-design-02 → the design team's new S3 bucket every 90 s; signed client; intern-created bucket"}, {"id": "i4", "text": "D: SRV-BKP-01 → vendor backup IP hourly; audited change record matches"}], "order": ["i1", "i2", "i3", "i4"], "explanation": "A first despite the missing data: a domain controller with 5-minute automation to a 45-minute-old VPS is the worst combination in the estate — asset criticality dominates, and “telemetry not yet onboarded” is a reason to investigate NOW, not later. B follows: production CI, service account, memory-resident script, unknown VPS — strong T1020 shape. C is the verify-first case: signed client, but the bucket is new and intern-created — a one-call verification, not a page. D is audited and matches the change record — tuning queue. The rank survives the holes: priority comes from asset value and destination novelty, and absence of telemetry raises priority rather than lowering it.", "study": "Prioritisation under incomplete data: asset criticality × destination novelty × account context.", "hint": "Missing telemetry on a domain controller is a louder alarm, not a quieter one."}, {"id": "x13", "type": "fib", "theme": "Analytics and detection logic", "title": "Write the verdict the case file needs", "collapsedSummary": "Complete the case-file sentence about post-isolation flows.", "scenario": "The case file for the isolated-host puzzle (mac-design-02) needs one precise sentence. The word bank holds the three missing words plus two decoys.", "question": "Complete the case-file sentence.", "sentence": "Flows timestamped after the isolation moment are treated as {b0} data: first verify {b1} health and clock sources, then {b2} the event timestamps against the exact quarantine time before drawing scope conclusions.", "blanks": [{"id": "b0"}, {"id": "b1"}, {"id": "b2"}], "distractors": ["live", "firewall"], "explanation": "The sentence encodes the professional order of operations for impossible evidence: treat the flows as historical until their timestamps are explained, check the telemetry chain (sensor health, clock sources, backfill), and only then compare timestamps against the quarantine event. “Live” is the decoy that would confirm the impossible — a quarantined port cannot originate new flows, so calling the data live contradicts the control that fired.", "study": "Case-file language for impossible evidence: historical until clocks are verified.", "hint": "The port was shut — so the flows cannot be called what? And whose clock needs checking?", "sentenceHtml": "Flows timestamped after the isolation moment are treated as <span class=\"blank empty\" data-id=\"b0\" role=\"button\" tabindex=\"0\" aria-label=\"blank 0, press Enter after picking a word\">blank 0<\/span> data: first verify <span class=\"blank empty\" data-id=\"b1\" role=\"button\" tabindex=\"0\" aria-label=\"blank 1, press Enter after picking a word\">blank 1<\/span> health and clock sources, then <span class=\"blank empty\" data-id=\"b2\" role=\"button\" tabindex=\"0\" aria-label=\"blank 2, press Enter after picking a word\">blank 2<\/span> the event timestamps against the exact quarantine time before drawing scope conclusions.", "solution": {"b0": "historical", "b1": "sensor", "b2": "compare"}, "bank": ["historical", "sensor", "compare", "live", "firewall"]}, {"id": "x14", "type": "order", "theme": "Detection engineering practice", "title": "The five-week tuning programme", "collapsedSummary": "Order the noise-reduction programme for AN1113.", "scenario": "The CISO approves a tuning programme for AN1113 (40% FP). Order the programme's steps. Constraint: no step may reduce true-positive coverage before the data justifies it.", "question": "Order the five-week programme from data collection to final report.", "items": [{"id": "i1", "text": "Collect 2 weeks of alert data with full context (destination, account, asset)"}, {"id": "i2", "text": "Cluster alerts by destination and account; identify the approved flows"}, {"id": "i3", "text": "Meet data owners (backup, MDM, sync) and record each approved flow"}, {"id": "i4", "text": "Apply allowlists and account scoping from the recorded evidence"}, {"id": "i5", "text": "Measure FP rate and TP coverage for 2 more weeks; report both numbers"}], "order": ["i1", "i2", "i3", "i4", "i5"], "explanation": "The programme works because each step buys the right to do the next: two weeks of data gives you clusters; clusters identify approved flows; data owners confirm them on record; only then do the knobs turn (DestinationIP allowlists, UserContext scoping) — and the final two weeks measure BOTH the FP drop and TP coverage, so the tuning is provably safe. The common failure is starting at step 4: tuning from opinion silences alarms you never verified, and the first low-and-slow beacon you miss pays for the saved fortnight.", "study": "Evidence-first tuning programmes for correlation analytics: data → clusters → owners → knobs → measurement.", "hint": "No knob turns before an owner signs; nothing ships before both numbers are measured."}, {"id": "x15", "type": "match", "theme": "The detection object and ATT&CK position", "title": "The closing map: which analytic, or none", "collapsedSummary": "Four behaviours — assign each to AN1113/1114/1115 or to “none”.", "scenario": "Closing exercise. Four behaviours reach your desk. Assign each to the analytic that catches it — or to “none” when DET0397 is structurally blind to it.", "question": "Match each behaviour to its analytic (or none).", "left": [{"id": "l1", "text": "Windows task-driven uploads every 5 minutes to an unknown VPS"}, {"id": "l2", "text": "Linux cron daemon repeating large sends to a remote IP"}, {"id": "l3", "text": "macOS LaunchDaemon with periodic external connections"}, {"id": "l4", "text": "Files walked out on USB from an air-gapped segment"}], "right": [{"id": "r1", "text": "AN1113 (Windows)", "short": "AN1113"}, {"id": "r2", "text": "AN1114 (Linux)", "short": "AN1114"}, {"id": "r3", "text": "AN1115 (macOS)", "short": "AN1115"}, {"id": "r4", "text": "None — no network telemetry exists on that path", "short": "none of the three"}], "pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}, "explanation": "The map in one glance: AN1113 owns Windows scheduled-task automation, AN1114 owns Linux cron and daemon repeats, AN1115 owns macOS LaunchAgent/LaunchDaemon beacons. The USB walk-out gets “none” — the strategy is built on host + network telemetry, and an air-gapped path has neither; it needs physical-medium controls (T1052 territory), not this strategy. Knowing the boundary is the mark of someone who can defend DET0397's scope in front of an auditor.", "study": "DET0397's per-platform assignment and its structural boundary (no network path → no coverage).", "hint": "Three behaviours map to three platforms. The fourth has no network at all — what does that do to a network-telemetry strategy?"}];

/* ===== helpers ===== */
function $(s){return document.querySelector(s)}
function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){s=Math.max(0,s|0);var m=(s/60)|0,r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1)}

/* ===== scoring engine (partial credit) ===== */
function scoreExercise(sel, correct){
  var N=correct.length||1,H=0,W=0,i;
  for(i=0;i<sel.length;i++){ if(correct.indexOf(sel[i])>=0){H++;} else {W++;} }
  return Math.max(0,(H-W)/N);
}

/* ===== state ===== */
var S=null, TID=null, PROFILE={username:'',country:'',locale:'en'};
function startTicker(){ if(TID)clearInterval(TID); TID=setInterval(tTick,1000); }
var EXBYID={}; EX.forEach(function(e){EXBYID[e.id]=e});

function newAttempt(){
  S={order:shuffle(EX.map(function(e,i){return i})),pos:0,status:{},credit:{},hintUsed:{},
     cur:null,fromReview:false,tState:'RUNNING',left:TIMER_BUDGET,started:false,
     pauseAcc:{manual:0,auto:0},reported:false,finished:false,ans:{}};
  EX.forEach(prepEx);
}
/* per-attempt shuffle of option lists, word banks, match columns, order rows */
function prepEx(ex){
  if(ex.options) ex._opts=shuffle(ex.options);
  if(ex.sub&&ex.sub.options) ex.sub._opts=shuffle(ex.sub.options);
  if(ex.left) ex._left=ex.left.slice();
  if(ex.right) ex._right=shuffle(ex.right).map(function(r){return {id:r.id,text:r.text,short:(r.short||r.text)}});
  if(ex.bank) ex._bank=shuffle(ex.bank);
  if(ex.items) ex._items=shuffle(ex.items);
}
var TIMER_BUDGET = META.timerSeconds;

/* ===== timer state machine ===== */
function tSet(state){
  if(S){ S.tState=state; }
  renderHeader();
}
function tTick(){
  if(!S||S.finished||!S.started) return;
  if(S.tState==='RUNNING'){
    if(S.tState==='RUNNING'){ S.left--;
      if(S.left<=0){S.left=0;S.tState='ENDED';renderHeader();onTimeEnd();return;}
    }
    renderHeader();
  } else if(S.tState==='PAUSED_MANUAL'){ S.pauseAcc.manual++; }
  else if(S.tState==='PAUSED_AUTO_CHECK'){ S.pauseAcc.auto++; }
}
function timerChip(){
  var cls=S.tState==='RUNNING'?'t-running':(S.tState==='PAUSED_MANUAL'?'t-manual':(S.tState==='PAUSED_AUTO_CHECK'?'t-auto':'t-ended'));
  var icon=S.tState==='RUNNING'?'\u25B6':(S.tState==='ENDED'?'\u23F1':'\u23F8');
  var word=S.tState==='RUNNING'?'RUNNING':(S.tState==='PAUSED_MANUAL'?'PAUSED \u2014 manual (press Resume)':(S.tState==='PAUSED_AUTO_CHECK'?'PAUSED \u2014 reviewing feedback (resumes on Next)':'ENDED'));
  return '<span class="hchip '+cls+'" role="status" aria-label="Timer '+esc(word)+'"><span aria-hidden="true">'+icon+'</span><span class="mono" id="tval">'+fmtTime(S.left)+'</span><span class="tword">'+esc(word)+'</span></span>';
}

/* ===== views ===== */
function showView(id){
  $all('.view').forEach(function(v){v.classList.remove('active')});
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ===== header ===== */
function sevBadge(){
  return '<span class="badge '+META.difficulty+'" role="img" aria-label="Severity '+esc(META.sevName)+'">'+esc(META.sevName)+'</span>';
}
function answeredStats(){
  var ids=Object.keys(S.status).filter(function(k){return S.status[k]==='answered'});
  var sum=0; ids.forEach(function(k){sum+=S.credit[k]});
  return {count:ids.length,sum:sum,ids:ids};
}
function renderHeader(){
  var h='';
  var total=S.order.length;
  var done=Object.keys(S.status).length;
  var st=answeredStats();
  var label=S.cur?(S.status[S.cur.id]==='answered'?'Progress '+done+' / '+total:('Exercise '+Math.min(done+1,total)+' of '+total)):('Progress '+done+' / '+total);
  h+='<div class="hchip"><b>'+esc(label)+'</b></div>';
  h+=sevBadge();
  h+='<div class="grow"></div>';
  h+=timerChip();
  h+='<span class="hchip" aria-label="Live score"><span aria-hidden="true">\u2605</span> Score <b class="mono">'+fmt1(st.sum)+' / '+st.count+'</b>'+(st.count>0?' <b class="mono">('+Math.round(st.sum/st.count*100)+'%)</b>':'')+'</span>';
  h+='<button class="hbtn" id="btnHint" aria-label="Hint (costs 10 percent of this exercise)">\uD83D\uDCA1 Hint</button>';
  h+='<button class="hbtn" id="btnSkip" aria-label="Skip this exercise">\u26A0 Skip</button>';
  h+='<button class="hbtn" id="btnPause" aria-label="Pause timer and hide exercise"'+(S.finished?' disabled':'')+'>\u23F8 Pause</button>';
  $('#topbar').innerHTML=h;
  var pb=$('#pbar-i'); if(pb) pb.style.width=(total?(done/total*100):0)+'%';
  $('#btnHint').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered'||S.hintUsed[S.cur.id];
  $('#btnSkip').disabled=S.finished||!S.cur||S.status[S.cur.id]==='answered';
  $('#btnHint').onclick=function(){doHint()};
  $('#btnSkip').onclick=function(){doSkip()};
  $('#btnPause').onclick=function(){doManualPause()};
}

/* ===== intro ===== */
function renderIntro(){
  $('#intro-body').innerHTML=INTRO.html;
  $('#btnStart').onclick=function(){
    if(!S||S.finished){newAttempt();}
    S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');
    goToPos(0);
  };
  if(PROFILE.username){$('#intro-greet').innerHTML='Analyst on duty: <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'');}
}

/* ===== exercise rendering ===== */
function curEx(){return S.order[S.pos]!==undefined?EX[S.order[S.pos]]:null}

function goToPos(pos,fromReview){
  S.pos=pos; S.cur=curEx(); S.fromReview=!!fromReview;
  if(!S.cur){finishFlow();return;}
  if(S.tState==='ENDED'){/* timer over: nothing to answer */}
  renderExercise();
  renderHeader();
}
function scenHTML(ex){
  var arts=ex.artefacts||[];
  var body='';
  if(ex.scenario) body+='<div class="scenario-text scenario-hideable">'+esc(ex.scenario)+'</div>';
  arts.forEach(function(a,i){
    var lbl=(a.label&&/^ARTEFACT/i.test(a.label))?a.label:('ARTEFACT '+(i+1)+' \u2014 '+(a.label||'evidence'));
    body+='<div class="artefact scenario-hideable"><div class="a-label">'+esc(lbl)+'</div><div class="a-body">';
    if(a.logs){ body+=logPanel(a.logs,a.filter!==false); }
    else if(a.pre){ body+='<pre class="log-line" style="max-height:260px;overflow:auto">'+hlBlock(a.pre)+'</pre>'; }
    else { body+='<div class="scenario-text">'+esc(a.text)+'</div>'; }
    body+='</div></div>';
  });
  var sum=ex.collapsedSummary||'Scenario collapsed \u2014 expand to re-read';
  return '<div class="block b-scenario" id="scenBlock">'+
    '<div class="block-h"><span aria-hidden="true">\u25A4</span> SCENARIO <span class="sp"></span>'+
    '<button class="collapse-btn" id="btnCollapse" aria-label="Collapse or expand scenario">Collapse \u25BE</button></div>'+
    '<div class="scen-summary">'+esc(sum)+'</div>'+
    '<div class="block-body">'+body+'</div></div>';
}
function blockQ(ex){
  return '<div class="block b-question"><div class="block-h"><span aria-hidden="true">\u2753</span> QUESTION</div>'+
    '<div class="block-body"><p class="qtext">'+esc(ex.question)+'</p>'+(ex.qnote?'<p class="muted" style="color:var(--text-secondary);font-size:.92rem;margin:6px 0 0">'+esc(ex.qnote)+'</p>':'')+'</div></div>';
}
function renderExercise(){
  var ex=S.cur;
  var card=$('#excard');
  var sev=META.sevName;
  var html='';
  html+='<span class="theme-chip">\u25C6 '+esc(ex.theme)+'</span>';
  html+=scenHTML(ex);
  html+=blockQ(ex);
  html+='<div class="block b-answer"><div class="block-h"><span aria-hidden="true">\u270E</span> YOUR ANSWER</div><div class="block-body" id="ansbody"></div></div>';
  html+='<div id="fbwrap"></div>';
  html+='<div class="actionrow" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnCheck" disabled>\u2713 Check</button>'+
    '<button class="btn hidden" id="btnNext">\u2192 Next</button>'+
    '</div>';
  card.innerHTML=html;
  $('#btnCollapse').onclick=function(){var b=$('#scenBlock');b.classList.toggle('scen-collapsed');this.textContent=b.classList.contains('scen-collapsed')?'Expand \u25B8':'Collapse \u25BE';};
  renderWidget(ex);
  wireLogFilter();
  var chk=$('#btnCheck');
  chk.onclick=function(){doCheck()};
  if(S.status[ex.id]==='answered'){
    /* returning view of answered exercise not possible in flow; guarded */
  }
}
function setAnswerReady(ok){var b=$('#btnCheck');if(b)b.disabled=!ok}

/* ---- widget: qcm / multi ---- */
function wChoice(ex,mode){
  var multi=mode==='multi';
  var opts=ex._opts||ex.options||[];
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">'+(multi?'Select all options that apply. Partial credit applies.':'Choose the one best option.')+'</p><div class="opts">';
  opts.forEach(function(o,i){
    html+='<button type="button" class="opt" data-id="'+esc(o.id)+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="false"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.text)+'</span><span class="mark" aria-hidden="true">\u25CF</span></button>';
  });
  html+='</div>';
  $('#ansbody').innerHTML=html;
  var sel=[];
  $all('#ansbody .opt').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      if(multi){
        var k=sel.indexOf(id);
        if(k>=0){sel.splice(k,1);b.classList.remove('sel');b.setAttribute('aria-checked','false');}
        else{sel.push(id);b.classList.add('sel');b.setAttribute('aria-checked','true');}
      }else{
        sel=[id];
        $all('#ansbody .opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
      }
      setAnswerReady(sel.length>0);
    };
  });
  return {collect:function(){return sel.slice()}};
}

/* ---- widget: match ---- */
function wMatch(ex){
  var lefts=ex._left,rights=ex._right;
  var pairs={}; var pickedL=null;
  function letter(i){return String.fromCharCode(65+i)}
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick one item on the left, then its partner on the right. Click a paired left item again to clear it.</p>'+
    '<div class="matchwrap"><div class="mcol"><div class="mhead">Items</div>';
  lefts.forEach(function(l,i){
    html+='<button type="button" class="mitem left" data-side="L" data-id="'+esc(l.id)+'"><span class="ol">'+letter(i)+'.</span><span>'+esc(l.text)+'</span><span class="pairtag" aria-hidden="true"></span></button>';
  });
  html+='</div><div class="mcol"><div class="mhead">Destinations / matches</div>';
  rights.forEach(function(r){
    html+='<button type="button" class="mitem right" data-side="R" data-id="'+esc(r.id)+'"><span>'+esc(r.text)+'</span></button>';
  });
  html+='</div></div>';
  $('#ansbody').innerHTML=html;
  function refresh(){
    var complete=true;
    $all('#ansbody .mitem.left').forEach(function(b){
      var id=b.getAttribute('data-id');
      var tag=b.querySelector('.pairtag');
      if(pairs[id]){tag.textContent='\u2192 '+rights.filter(function(r){return r.id===pairs[id]})[0].short;complete=false;}
      else{tag.textContent='';complete=false;}
    });
    var leftCount=$all('#ansbody .mitem.left').length;
    var paired=Object.keys(pairs).length;
    setAnswerReady(paired===leftCount);
  }
  $all('#ansbody .mitem').forEach(function(b){
    b.onclick=function(){
      var side=b.getAttribute('data-side'),id=b.getAttribute('data-id');
      if(side==='L'){
        if(pairs[id]){delete pairs[id];b.classList.remove('picked');refresh();return;}
        pickedL=id;
        $all('#ansbody .mitem.left').forEach(function(x){x.classList.remove('picked')});
        b.classList.add('picked');
      }else{
        if(!pickedL)return;
        pairs[pickedL]=id;
        $all('#ansbody .mitem.left').forEach(function(x){if(x.getAttribute('data-id')===pickedL)x.classList.remove('picked')});
        pickedL=null;refresh();
      }
    };
  });
  refresh();setAnswerReady(false);
  return {collect:function(){return Object.keys(pairs).map(function(l){return l+'>'+pairs[l]})},pairs:pairs};
}

/* ---- widget: dnd (bank -> slots) ---- */
function wDnD(ex){
  var bank=ex._bank.slice(), placed={}, picked=null, dragId=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Drag each item into the right slot (or pick an item, then pick a slot).</p>'+
    '<div class="bank" id="bank"></div><div class="slots" id="slots"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" draggable="true" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bank').innerHTML=bh;
    var sh='';
    ex.slots.forEach(function(s){
      var v=placed[s.id];
      sh+='<div class="slot" data-s="'+esc(s.id)+'" role="button" tabindex="0" aria-label="Slot: '+esc(s.label)+'"><span class="s-label">'+esc(s.label)+'</span>'+(v?'<span class="s-val">'+esc(v)+'</span>':'<span class="s-fill">drop here</span>')+'</div>';
    });
    $('#slots').innerHTML=sh;
    wire();
  }
  function place(w,sid){
    Object.keys(placed).forEach(function(k){if(placed[k]===w)delete placed[k]});
    placed[sid]=w;picked=null;draw();
    setAnswerReady(Object.keys(placed).length===ex.slots.length);
  }
  function wire(){
    $all('#bank .bitem').forEach(function(b){
      b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};
      b.ondragstart=function(ev){dragId=b.getAttribute('data-w');b.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}};
      b.ondragend=function(){b.classList.remove('dragging')};
    });
    $all('#slots .slot').forEach(function(s){
      var sid=s.getAttribute('data-s');
      s.onclick=function(){if(picked)place(picked,sid);};
      s.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&picked){ev.preventDefault();place(picked,sid);}};
      s.ondragover=function(ev){ev.preventDefault();s.classList.add('over')};
      s.ondragleave=function(){s.classList.remove('over')};
      s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var w=dragId||ev.dataTransfer.getData('text/plain');if(w)place(w,sid);};
    });
  }
  draw();setAnswerReady(false);
  return {collect:function(){return ex.slots.map(function(s){var v=placed[s.id];return v?(s.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: fib ---- */
function wFib(ex){
  var blanks=ex.blanks; /* [{id,label}] */
  var bank=ex._bank.slice(), placed={}, picked=null;
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Pick a word from the bank, then pick a blank. Click a filled blank to clear it.</p>'+
    '<div class="blankline" id="bl-line">'+ex.sentenceHtml+'</div><div class="bank" id="bl-bank"></div>';
  $('#ansbody').innerHTML=html;
  function draw(){
    var bh='';bank.forEach(function(w){
      var used=Object.keys(placed).some(function(s){return placed[s]===w});
      bh+='<button type="button" class="bitem'+(picked===w?' picked':'')+(used?' ghost':'')+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
    });
    $('#bl-bank').innerHTML=bh;
    $all('#bl-bank .bitem').forEach(function(b){b.onclick=function(){var w=b.getAttribute('data-w');picked=(picked===w?null:w);draw();};});
    $all('#ansbody .blank').forEach(function(b){
      var id=b.getAttribute('data-id');
      if(placed[id]){b.textContent=placed[id];b.classList.remove('empty');}
      else{b.textContent='blank '+id.replace('b','');b.classList.add('empty');}
      b.onclick=function(){
        if(placed[id]){delete placed[id];draw();refresh();return;}
        if(picked){placed[id]=picked;picked=null;draw();refresh();}
      };
      b.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.onclick();}};
    });
  }
  function refresh(){setAnswerReady(Object.keys(placed).length===blanks.length);}
  draw();refresh();setAnswerReady(false);
  return {collect:function(){return blanks.map(function(b){var v=placed[b.id];return v?(b.id+'>'+v):null}).filter(Boolean)},placed:placed};
}

/* ---- widget: order / rank ---- */
function wOrder(ex){
  var items=ex._items.slice(); /* current order of {id,text} */
  var html='<p style="color:var(--text-secondary);font-size:.9rem;margin:0 0 10px">Put the items in the right order: use the arrows or drag rows.</p><div class="ordlist" id="ord"></div>';
  $('#ansbody').innerHTML=html;
  var dragIdx=null;
  function draw(){
    var h='';items.forEach(function(it,i){
      h+='<div class="orditem" draggable="true" data-i="'+i+'"><span class="pos">'+(i+1)+'.</span><button class="move" data-d="-1" data-i="'+i+'" aria-label="Move up">\u25B2</button><button class="move" data-d="1" data-i="'+i+'" aria-label="Move down">\u25BC</button><span>'+esc(it.text)+'</span><span class="handle" aria-hidden="true">\u2261</span></div>';
    });
    $('#ord').innerHTML=h;wire();setAnswerReady(items.length===ex._items.length);
  }
  function move(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;draw();}
  function wire(){
    $all('#ord .move').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();move(parseInt(b.getAttribute('data-i'),10),parseInt(b.getAttribute('data-d'),10));};});
    $all('#ord .orditem').forEach(function(row){
      row.ondragstart=function(ev){dragIdx=parseInt(row.getAttribute('data-i'),10);try{ev.dataTransfer.setData('text/plain','x')}catch(e){}};
      row.ondragover=function(ev){ev.preventDefault();row.style.borderColor='var(--accent-green)'};
      row.ondragleave=function(){row.style.borderColor=''};
      row.ondrop=function(ev){ev.preventDefault();row.style.borderColor='';var to=parseInt(row.getAttribute('data-i'),10);if(dragIdx===null||isNaN(to))return;var it=items.splice(dragIdx,1)[0];items.splice(to,0,it);dragIdx=null;draw();};
    });
  }
  draw();
  return {collect:function(){return items.map(function(it){return it.id})}};
}

}

/* ===== render dispatch ===== */
function renderWidget(ex){
  var w=null;
  if(ex.type==='qcm'){w=wChoice(ex,'qcm');}
  else if(ex.type==='multi'){w=wChoice(ex,'multi');}
  else if(ex.type==='match'){w=wMatch(ex);}
  else if(ex.type==='dnd'){w=wDnD(ex);}
  else if(ex.type==='fib'){w=wFib(ex);}
  else if(ex.type==='order'||ex.type==='rank'){w=wOrder(ex);}
  else if(ex.type==='logs'){w=wLogs(ex);}
  else if(ex.type==='branch'){w=wBranch(ex);}
  else if(ex.type==='term'){w=wTerm(ex);}
  S._w=w;
}

/* ===== log rendering + highlighting ===== */
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlLine(line){
  var e=esc(line);
  var re=/(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}\b)|([A-Za-z_][\w.]*)(=)(&quot;.*?&quot;|"[^"]*"|\S+)|(&quot;[^&]*&quot;|"[^"]*")|(?:^|\s)((?:[A-Z]:\\|\/(?:usr|etc|var|opt|home|tmp)\/)[^\s"]+)/g;
  var out='',last=0,m;
  function span(cls,txt){return '<span class="'+cls+'">'+txt+'</span>'}
  while((m=re.exec(e))!==null){
    out+=e.slice(last,m.index);
    if(m[1]){out+=span('tk-ts',m[1]);}
    else if(m[2]){out+=span('tk-ip',m[2]);}
    else if(m[3]){out+=span('tk-key',m[3])+'='+span(/^(EventCode|EventID|eventid|id|ID)$/.test(m[3])?'tk-str':'tk-val',m[5]);}
    else if(m[6]){out+=span('tk-str',m[6]);}
    else if(m[7]){out+=span('tk-path',m[7]);}
    last=re.lastIndex;
  }
  out+=e.slice(last);
  return out;
}
function hlBlock(text){
  return String(text).split('\n').map(function(l){return hlLine(l)}).join('\n');
}
function logPanel(lines,withFilter){
  var h='<div class="logpanel">';
  if(withFilter){
    h+='<div class="logtools"><input type="text" id="logfilter" placeholder="Filter lines (e.g. 4688, an IP, a user)" aria-label="Filter log lines"><span class="cnt" id="logcnt"></span></div>';
  }
  h+='<pre class="loglines" id="loglines">';
  lines.forEach(function(l){h+='<code class="log-line" data-raw="'+esc(l)+'">'+hlLine(l)+'</code>'});
  h+='</pre></div>';
  return h;
}
function wireLogFilter(){
  var inp=$('#logfilter');if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase(),shown=0,all=0;
    $all('#loglines .log-line').forEach(function(c){
      all++;var raw=(c.getAttribute('data-raw')||'').toLowerCase();
      var ok=!q||raw.indexOf(q)>=0;
      c.classList.toggle('hidden',!ok);if(ok)shown++;
    });
    var cnt=$('#logcnt');if(cnt)cnt.textContent='showing '+shown+' of '+all+' lines';
  });
}

/* ===== grading ===== */
function grade(ex){
  var w=S._w, sel=w.collect(), out={credit:0,rows:[],correctDisplay:'',extra:''};
  var optText=function(id,list){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].text}return id};
  if(ex.type==='qcm'||ex.type==='logs'){
    var correct=ex.correct;
    var ok=sel.length===1&&correct.indexOf(sel[0])>=0;
    out.credit=scoreExercise(ok?sel:[],correct);
    out.correctDisplay=optText(correct[0],(ex.options||ex.sub.options));
  } else if(ex.type==='multi'){
    var c=ex.correct,N=c.length,H=0,W=0;
    var rows=[];
    c.forEach(function(id){
      var got=sel.indexOf(id)>=0;
      if(got){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:optText(id,ex.options)});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:optText(id,ex.options)});}
    });
    sel.forEach(function(id){
      if(c.indexOf(id)<0){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:optText(id,ex.options)});}
    });
    out.credit=scoreExercise(sel,c);out.rows=rows;
  } else if(ex.type==='match'){
    var pairs=w.pairs||{};var N=Object.keys(ex.pairs).length,H=0,W=0,rows=[];
    var gotPairs=[],wantPairs=[];
    Object.keys(ex.pairs).forEach(function(l){
      var want=ex.pairs[l],got=pairs[l];
      var lt=optText(l,ex.left),rt=optText(want,ex.right);
      wantPairs.push(l+'>'+want);
      if(got){gotPairs.push(l+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lt+' \u2192 '+rt});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lt+' \u2192 you chose: '+optText(got,ex.right)+' \u2014 correct: '+rt});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lt+' \u2192 correct: '+rt});}
    });
    out.credit=scoreExercise(gotPairs,wantPairs);out.rows=rows;
  } else if(ex.type==='dnd'||ex.type==='fib'){
    var placed=w.placed||{};var sol=ex.solution;var N=Object.keys(sol).length,H=0,W=0,rows=[];
    var gotFills=[],wantFills=[];
    Object.keys(sol).forEach(function(slotId){
      var want=sol[slotId],got=placed[slotId];
      var lbl=(ex.slots||ex.blanks).filter(function(s){return s.id===slotId})[0];
      var lblT=lbl?(lbl.label||('blank '+slotId)):slotId;
      wantFills.push(slotId+'>'+want);
      if(got){gotFills.push(slotId+'>'+got);}
      if(got===want){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:lblT+': '+want});}
      else if(got){W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:lblT+': you placed \u201C'+got+'\u201D \u2014 correct: '+want});}
      else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:lblT+': correct: '+want});}
    });
    out.credit=scoreExercise(gotFills,wantFills);out.rows=rows;
    out.correctDisplay=Object.keys(sol).map(function(k){return sol[k]}).join(', ');
  } else if(ex.type==='order'||ex.type==='rank'){
    var want=ex.order,N=want.length,H=0,W=0,rows=[];
    var gotPos=[],wantPos=[];
    for(var i=0;i<N;i++){
      var it=optText(sel[i],ex._items),okp=sel[i]===want[i];
      gotPos.push(i+'>'+sel[i]);wantPos.push(i+'>'+want[i]);
      var posTxt='Position '+(i+1)+': '+(okp?it:(optText(want[i],ex._items)+' (you placed: '+it+')'));
      if(okp){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:posTxt});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:posTxt});}
    }
    out.credit=scoreExercise(gotPos,wantPos);out.rows=rows;
    out.correctDisplay=want.map(function(id,ix){return (ix+1)+'. '+optText(id,ex._items)}).join('  ');
  } else if(ex.type==='branch'){
    var N=ex.steps.length,H=0,W=0,rows=[];
    var gotSteps=[],wantSteps=[];
    ex.steps.forEach(function(st,ix){
      var got=sel[ix],okc=got===st.correct;
      gotSteps.push(ix+'>'+got);wantSteps.push(ix+'>'+st.correct);
      if(okc){H++;rows.push({st:'correct',ic:'\u2713',w:'Correct',t:'Step '+(ix+1)+': '+optText(st.correct,st.options)});}
      else{W++;rows.push({st:'wrong',ic:'\u2717',w:'Wrong',t:'Step '+(ix+1)+': you chose \u201C'+optText(got,st.options)+'\u201D \u2014 best: '+optText(st.correct,st.options)});}
    });
    out.credit=scoreExercise(gotSteps,wantSteps);out.rows=rows;
  } else if(ex.type==='term'){
    var raw=(w.raw?w.raw():sel[0]||'').toLowerCase().replace(/\s+/g,' ').trim();
    var N=ex.elements.length,H=0,W=0,rows=[];
    var gotEls=[],wantEls=[];
    ex.elements.forEach(function(el,ei){
      var hit=false;
      if(el.re){hit=(new RegExp(el.re,'i')).test(raw);}
      else if(el.inc){hit=raw.indexOf(el.inc.toLowerCase())>=0;}
      if(el.danger){
        if(hit){W++;gotEls.push('d'+ei);rows.push({st:'wrong',ic:'\u2717',w:'DANGEROUS \u2014 NEAR MISS',t:el.label});}
      } else {
        wantEls.push('e'+ei);
        if(hit){H++;gotEls.push('e'+ei);rows.push({st:'correct',ic:'\u2713',w:'Correct',t:el.label});}
        else{rows.push({st:'missed',ic:'\u25CB',w:'Missed',t:el.label});}
      }
    });
    out.credit=scoreExercise(gotEls,wantEls);out.rows=rows;
    out.correctDisplay=ex.expected;
    out.extra='<div class="canon" role="figure" aria-label="Expected query">'+esc(ex.expected)+'</div>';
  }
  if(S.hintUsed[ex.id])out.credit=Math.max(0,out.credit-0.10);
  return out;
}

/* ===== check / next / skip / hint / pause ===== */
function doHint(){
  if(!S.cur||S.hintUsed[S.cur.id])return;
  S.hintUsed[S.cur.id]=true;
  var ex=S.cur;
  if(!$('#hintbox')){
    $('#fbwrap').insertAdjacentHTML('beforebegin','<div class="hintbox" id="hintbox"><span class="h">\uD83D\uDCA1 Hint</span> \u2014 '+esc(ex.hint)+'</div>');
  }
  renderHeader();
}
function markAnswered(ex,credit){
  S.status[ex.id]='answered';S.credit[ex.id]=credit;
}
function feedbackHTML(ex,g){
  var cls,nh;
  if(g.credit>=0.999){cls='f-correct';nh='<span aria-hidden="true">\u2713</span> CORRECT';}
  else if(g.credit>0){cls='f-partial';nh='<span aria-hidden="true">\u2713</span> PARTIALLY CORRECT';}
  else{cls='f-wrong';nh='<span aria-hidden="true">\u2717</span> INCORRECT';}
  var N=0;
  if(ex.type==='multi')N=ex.correct.length;
  else if(ex.type==='match')N=Object.keys(ex.pairs).length;
  else if(ex.type==='dnd'||ex.type==='fib')N=Object.keys(ex.solution).length;
  else if(ex.type==='order'||ex.type==='rank')N=ex.order.length;
  else if(ex.type==='branch')N=ex.steps.length;
  else if(ex.type==='term')N=ex.elements.length;
  var creditLine='';
  if(N>1||ex.type==='term'){
    var hCount=0;g.rows.forEach(function(r){if(r.st==='correct')hCount++});
    creditLine='<div class="credit-line">credit '+ (Math.round(g.credit*100)/100) +' \u2014 '+hCount+'/'+N+' items'+(S.hintUsed[ex.id]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  } else if(S.hintUsed[ex.id]){
    creditLine='<div class="credit-line">credit '+(Math.round(g.credit*100)/100)+' (includes \u22120.10 hint penalty)</div>';
  }
  var rows='';g.rows.forEach(function(r){
    rows+='<div class="itrow st-'+r.st+'"><span class="ic" aria-hidden="true">'+r.ic+'</span><span><b>'+r.w+'</b> \u2014 '+esc(r.t)+'</span></div>';
  });
  var corr=g.correctDisplay?(' <div class="expl"><b>Correct answer:</b> '+esc(g.correctDisplay)+'</div>'):'';
  return '<div class="block b-feedback '+cls+'" role="status"><div class="block-h">'+nh+(N>1?'':'')+'</div><div class="block-body">'+
    creditLine+
    (rows?'<div class="items">'+rows+'</div>':'')+
    corr+g.extra+
    '<div class="expl">'+esc(ex.explanation)+'</div>'+
    '<div class="study"><b>What to study:</b> '+esc(ex.study)+'</div>'+
    '</div></div>';
}
function doCheck(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  var ex=S.cur;
  /* Check-triggered auto-pause FIRST (state machine), then feedback */
  tSet('PAUSED_AUTO_CHECK');
  var g=grade(ex);
  markAnswered(ex,g.credit);
  var btn=$('#btnCheck');if(btn)btn.classList.add('hidden');
  $('#fbwrap').innerHTML=feedbackHTML(ex,g);
  /* lock answer widget */
  $all('#ansbody button, #ansbody input, #ansbody [role="button"]').forEach(function(b){
    b.disabled=true;b.classList.add('locked');
  });
  $all('#ansbody .term input').forEach(function(b){b.disabled=true});
  var nb=$('#btnNext');
  nb.classList.remove('hidden');
  var morePending=S.order.some(function(ix,i){return i>S.pos&&S.status[EX[ix].id]!=='answered'});
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(morePending){nb.textContent='\u2192 Next';}
  else if(anySkipped){nb.textContent='\u26A0 Review skipped \u2192';}
  else{nb.textContent='\u23E9 Final Submit';}
  nb.onclick=function(){onNext()};
  $('#btnNext').focus();
  renderHeader();
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){tSet('RUNNING');}
  if(S.fromReview){
    var anyLeft=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
    if(anyLeft&&S.tState!=='ENDED'){goReview();}else{showResults();}
    return;
  }
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doSkip(){
  if(!S.cur||S.status[S.cur.id]==='answered')return;
  S.status[S.cur.id]='skipped';
  var next=-1;
  for(var i=S.pos+1;i<S.order.length;i++){if(S.status[EX[S.order[i]].id]!=='answered'){next=i;break}}
  if(next>=0){goToPos(next);return;}
  finishFlow();
}
function doManualPause(){
  if(!S.cur||S.finished)return;
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S._prevT=S.tState;tSet('PAUSED_MANUAL');
    $('#btnPause').disabled=true;
    /* viewport-fixed overlay + full-content blur, so manual pause works the same
       from the exam view and from the review-skipped view */
    var d=document.createElement('div');d.className='overlay-msg fixed';d.id='ovl';
    d.innerHTML='<b>\u23F8 PAUSED \u2014 manual</b><br>The exercise is hidden while you pause.<br>Your break time is recorded in the results report.<br><br><button class="btn primary" id="btnResume">\u25B6 Resume</button>';
    document.body.appendChild(d);
    var wr=document.querySelector('.wrap');if(wr)wr.classList.add('blur-lock');
    $('#btnResume').onclick=function(){
      tSet(S._prevT||'RUNNING');
      var o=$('#ovl');if(o)o.remove();
      var wr2=document.querySelector('.wrap');if(wr2)wr2.classList.remove('blur-lock');
      renderHeader();
    };
  }
}
function finishFlow(){
  var anySkipped=S.order.some(function(ix){return S.status[EX[ix].id]==='skipped'});
  if(anySkipped&&S.tState!=='ENDED'){goReview();return;}
  showResults();
}
/* ===== review skipped ===== */
function goReview(){
  var list=S.order.filter(function(ix){return S.status[EX[ix].id]==='skipped'});
  var h='<div class="card"><h2>\u26A0 Review skipped exercises</h2>'+
    '<p class="muted" style="color:var(--text-secondary)">You skipped '+list.length+' exercise(s). You can go back and answer them now, as long as the timer has not ended. If you submit with skipped exercises left, they are excluded from the score.</p>';
  list.forEach(function(ix){
    var ex=EX[ix];
    h+='<div class="revitem"><span class="sk" role="img" aria-label="Skipped">\u26A0 Skipped</span><span class="t">'+esc(ex.title||ex.question)+'</span><button class="btn" data-id="'+esc(ex.id)+'" aria-label="Answer skipped exercise">Answer</button></div>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
    '<button class="btn primary" id="btnFinish">\u23E9 Submit exam now</button></div></div>';
  $('#review-body').innerHTML=h;
  $all('#review-body .revitem button').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id');
      var idx=S.order.indexOf(EX.indexOf(EXBYID[id]));
      showView('#view-exam');
      goToPos(idx,true);
    };
  });
  $('#btnFinish').onclick=function(){showResults()};
  showView('#view-review');
}
/* ===== time end ===== */
function onTimeEnd(){
  if(S.finished)return;
  showResults(true);
}
/* ===== results ===== */
function showResults(timeOver){
  if(S.finished)return;
  S.finished=true;
  S.tState='ENDED';
  renderHeader();
  clearInterval(TID);
  var st=answeredStats();
  var count=st.count,sum=st.sum;
  var percent=count>0?Math.round(sum/count*100):0;
  var passed=percent>=70;
  var fully=0,partial=0,partialAvg=0,wrong=0,skipped=0,psum=0;
  S.order.forEach(function(ix){
    var ex=EX[ix],stt=S.status[ex.id];
    if(stt==='answered'){
      var c=S.credit[ex.id];
      if(c>=0.999)fully++;else if(c>0){partial++;psum+=c;}else wrong++;
    } else skipped++;
  });
  if(partial>0)partialAvg=psum/partial;
  /* report to site: exactly once per attempt, at results */
  if(!S.reported){
    S.reported=true;
    reportScore(sum,count,percent,passed);
  }
  var h='<div class="card"><h2>Final results</h2>'+
    '<div class="bigscore">'+fmt1(sum)+' / '+count+'  <span style="font-size:1.4rem;color:var(--text-secondary)">('+percent+'%)</span></div>'+
    '<p class="muted" style="color:var(--text-secondary)">Score computed only over answered exercises. Pass mark: 70%.</p>'+
    (timeOver?'<p style="color:var(--state-paused)">\u23F1 Time ended \u2014 unanswered exercises were excluded.</p>':'')+
    '<div class="cert '+(passed?'':'fail')+'" role="status">'+
    '<div class="cpass">'+(passed?'\u2713 PASS':'\u2717 FAIL')+'</div>'+
    '<div class="csub">'+(passed?'Certificate-worthy performance on this severity.':'You must retake this exam. Review the explanations, then try again \u2014 questions and options will be reshuffled.')+'</div>'+
    '</div>'+
    '<div class="brk">'+
    '<div class="brkrow b-correct"><span class="ic">\u2713</span> Fully correct <span class="n">'+fully+'</span></div>'+
    '<div class="brkrow b-partial"><span class="ic">\u2713</span> Partially correct '+(partial>0?('(avg credit '+ (Math.round(partialAvg*100)/100) +')'):'')+' <span class="n">'+partial+'</span></div>'+
    '<div class="brkrow b-wrong"><span class="ic">\u2717</span> Fully incorrect <span class="n">'+wrong+'</span></div>'+
    '<div class="brkrow b-skipped"><span class="ic">\u26A0</span> Skipped \u2014 excluded from score <span class="n">'+skipped+'</span></div>'+
    '</div>';
  /* per-theme mini progress */
  var themes={};
  S.order.forEach(function(ix){var ex=EX[ix];themes[ex.theme]=themes[ex.theme]||{a:0,t:0};
    themes[ex.theme].t++;if(S.status[ex.id]==='answered')themes[ex.theme].a++;});
  var mt='<div class="mini-themes">';
  Object.keys(themes).forEach(function(t){mt+='<span class="mt">'+esc(t)+': <b>'+themes[t].a+'/'+themes[t].t+'</b></span>'});
  mt+='</div>';
  h+=mt;
  h+='<p class="kv">Time paused manually: <b>'+fmtTime(S.pauseAcc.manual)+'</b> \u00B7 Time paused reviewing feedback: <b>'+fmtTime(S.pauseAcc.auto)+'</b></p>';
  if(PROFILE.username)h+='<p class="kv">Attempt by <b>'+esc(PROFILE.username)+'</b>'+(PROFILE.country&&PROFILE.country!=='ZZ'?' ('+esc(PROFILE.country)+')':'')+'</p>';
  h+='<div style="margin-top:14px"><button class="btn green" id="btnRetake">\u21BA Retake exam</button></div>';
  h+='</div>';
  $('#results-body').innerHTML=h;
  $('#btnRetake').onclick=function(){
    newAttempt();S.started=true;
    $('#topbar').style.display='flex';
    startTicker();
    showView('#view-exam');goToPos(0);
  };
  showView('#view-results');
}
/* ===== site integration ===== */
function reportScore(creditSum,answeredCount,percent,passed){
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:passed
    },location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  PROFILE.username=event.data.username||'';
  PROFILE.country=event.data.country||'';
  PROFILE.locale=event.data.locale||'en';
  /* theme field is always 'dark'; files are dark-only by contract, nothing to switch */
});

/* ===== boot ===== */
function boot(){
  newAttempt();
  renderIntro();
  showView('#view-intro');
}
document.addEventListener('DOMContentLoaded',boot);
</script>
