<script>
'use strict';
var EXAM = {"topicId": "det0210", "batch": 2, "difficulty": "medium", "passMark": 70, "minutes": 15, "attckId": "DET0210", "objectType": "detection-strategy", "objectLabel": "Detection Strategy", "title": "Abuse of Domain Accounts", "severityWord": "MEDIUM", "intro": {"learn": ["DET0210 is a <b>Detection Strategy</b> object in MITRE ATT&amp;CK — a plan for noticing one attacker behavior: <b>abuse of valid domain accounts</b> (technique T1078.002, Domain Accounts). Real attackers often need no malware. They log in like normal users, so the defense is to watch the logon behavior itself.", "In this exam you will practice the daily work of a detection engineer. You will map the four analytics to their platforms: <b>AN0590</b> (Windows), <b>AN0591</b> (Linux), <b>AN0592</b> (macOS), and <b>AN0593</b> (ESXi). You will name the log sources: the Windows Security log and Sysmon, <code>auditd</code> with <code>sssd</code>/<code>winbind</code> on Linux, the macOS unified log, and <code>vpxd.log</code>/<code>hostd.log</code> on ESXi.", "You will also separate normal service and VPN behavior from real suspicious logons (false-positive triage), make first tuning decisions with the <b>mutable elements</b> (for example TimeWindow, UserContext, HostnameScope, and LogonType), and learn which data components — Logon Session Metadata, Process Creation, Network Connection Creation, User Account Authentication — sit behind the events."], "keywords": ["AN0590", "AN0591", "AN0592", "AN0593", "sssd", "winbind", "pam_authenticate", "auditd:SYSCALL", "macOS unified log", "log show predicate", "UserLocation", "HostnameScope", "LogonType", "DC0082 Network Connection Creation", "DC0032 Process Creation", "DC0088 Logon Session Metadata", "4768 / 4769 Kerberos", "service accounts", "VPN egress", "false-positive triage"], "how": ["<b>Goal:</b> answer at least 70% correctly. That is the pass mark. Multi-select and drag-and-drop exercises give partial credit, so a half-right answer earns half the credit.", "<b>Exercise types:</b> single choice (one correct answer), multi-select (several correct answers — the question tells you how many), and drag-and-drop (move items into the right boxes). For multi-select and drag-and-drop, the credit is the correct picks minus the wrong picks, divided by the number of correct items, and it never goes below zero.", "<b>Timer:</b> you have 15 minutes (15:00). The timer runs while you answer. When you press <b>Check</b>, the timer stops by itself (an auto-pause) while you read the feedback. Press <b>Next</b> and the timer runs again. You can also pause the timer yourself with the <b>Pause</b> button.", "<b>Hints:</b> every exercise has one hint. A hint costs 0.15 of the credit for that exercise.", "<b>Skipping:</b> you can skip an exercise with the Skip button. The timer keeps running. At the end you get a chance to review the skipped exercises. Skipped exercises that you never answer do not count in your score or your total.", "<b>Long scenarios:</b> some scenario boxes can be folded open and closed with a click on the SCENARIO title.", "At the end you will see your result, and the result is sent to the training platform."]}, "exercises": [{"kind": "single", "long": false, "scenario": "<p>Every night at 01:00, event <span class='tok-num'>4624</span> shows the account <code>svc_backup</code> logging on to 40 servers within 10 minutes, LogonType 2. The backup team confirms <code>svc_backup</code> is their documented job account and the schedule matches.</p>", "question": "What is the most likely explanation for this pattern?", "options": ["A scheduled backup service using its valid account — a false positive for AN0590", "An attacker moving sideways with a stolen admin account", "Password spraying against the domain", "Kerberoasting service tickets on the domain controller"], "correct": [0], "explain": "<p><b>A is correct.</b> The pattern is stable (same hour every night), the account is known and documented, and the schedule matches the job. That is classic service-account behavior — normal, even if it looks like multi-host movement.</p><p><b>B is possible in theory</b>, which is why the analytic fires — but with a confirmed owner and a stable schedule it is not the <i>most likely</i> answer; it would need new signals such as new source hosts or new commands. <b>C is wrong</b> because password spraying shows many <code>4625</code> failures across many accounts, not successful logons. <b>D is wrong</b> because Kerberoasting shows bursts of <code>4769</code> ticket requests with certain encryption types, not 4624 logons on servers.</p>", "hint": "Who owns the account, and does the schedule match a documented job?"}, {"kind": "multi", "long": false, "scenario": "<p>AN0590 scores logon events against a baseline. A single <code>4624</code> event becomes interesting when its details drift away from the baseline. The mutable elements TimeWindow, UserContext, and LogonType shape that judgment.</p>", "question": "Which three details make one 4624 logon more suspicious under AN0590? <b>Select 3.</b>", "options": ["It happened outside the normal working hours (TimeWindow)", "The account is a sensitive account, for example a Domain Admin (UserContext)", "It is an interactive logon on a server where this user never works (LogonType plus host pattern)", "The user account name has five letters", "The event was written by Sysmon instead of the Security log"], "correct": [0, 1, 2], "explain": "<p><b>A, B and C are correct.</b> They map one-to-one to the analytic's mutable elements: <b>TimeWindow</b> (off-hours), <b>UserContext</b> (sensitive accounts like Domain Admins), and <b>LogonType</b> (an interactive logon where only service logons are normal is a drift).</p><p><b>D is wrong</b> because the length of an account name means nothing by itself. <b>E is wrong</b> because which channel wrote the event does not make the logon suspicious — Sysmon and Security simply carry different event types.</p>", "hint": "Match the answers to the three mutable elements: when, who, how."}, {"kind": "single", "long": false, "scenario": "<p>Besides the Security log, AN0590 lists <code>WinEventLog:Sysmon</code> with <span class='tok-num'>EventCode=1</span> (process creation) as a log source, mapped to the data component Process Creation (DC0032).</p>", "question": "Why does AN0590 also read Sysmon EventCode=1 (process creation)?", "options": ["To see what the account ran after logging in — for example lateral movement tools", "To store the user's password for later comparison", "To count failed logons (4625)", "To block dangerous processes automatically"], "correct": [0], "explain": "<p><b>A is correct.</b> The logon event says <i>who came in and when</i>; the process creation event says <i>what they did next</i>. Seeing tools like remote-execution utilities right after a fresh logon makes the alert much stronger.</p><p><b>B is wrong</b> — telemetry never stores passwords. <b>C is wrong</b> because failed logons are event 4625 in the Security log, not Sysmon 1. <b>D is wrong</b> because Sysmon is a logging tool, not a blocking control; detection and prevention are different jobs.</p>", "hint": "A logon is the door opening — what happens right after?"}, {"kind": "single", "long": false, "scenario": "<p>AN0591 is the Linux analytic of DET0210. Its description says it watches domain logons that arrive <b>via sssd or winbind</b>, outside typical patterns.</p>", "question": "On Linux, AN0591 watches domain logons through which two components?", "options": ["sssd and winbind", "systemd and journald", "cron and at", "docker and containerd"], "correct": [0], "explain": "<p><b>A is correct.</b> <code>sssd</code> and <code>winbind</code> are the two classic agents that connect a Linux host to Active Directory. If they are present, the host authenticates domain accounts — and their authentication calls (for example <code>pam_authenticate</code> via <code>auditd</code>) are what AN0591 reads.</p><p><b>B is wrong</b> because systemd and journald handle services and logging, not AD membership. <b>C is wrong</b> because cron and at are job schedulers. <b>D is wrong</b> because docker and containerd run containers.</p>", "hint": "Both names are bridges between Linux and Active Directory."}, {"kind": "single", "long": false, "scenario": "<p>The AN0591 analytic lists two mutable elements: <b>HostnameScope</b> and <b>AccountDomain</b>. The team plans its tuning session.</p>", "question": "What does the mutable element HostnameScope do in AN0591?", "options": ["It limits the detection to chosen systems, for example high-value domain-joined servers", "It changes the user's password", "It renames the Linux servers", "It blocks SSH for all users"], "correct": [0], "explain": "<p><b>A is correct.</b> HostnameScope filters <i>which hosts</i> the analytic cares about. The ATT&amp;CK page describes it as filtering to high-value systems, for example domain-joined servers — that concentrates the alerts where compromise hurts most.</p><p><b>B is wrong</b> because passwords are not part of a detection scope. <b>C is wrong</b> because renaming servers changes nothing about detection logic. <b>D is wrong</b> because blocking SSH is a prevention control, not this analytic's tuning field.</p>", "hint": "Scope answers the question: on which machines do we look?"}, {"kind": "single", "long": false, "scenario": "<p>AN0592 (macOS) lists its log source as <code>macos:unifiedlog</code> with a collection command. Your macOS team must run it on a test laptop to verify the telemetry.</p>", "question": "Which command pulls authentication events from the macOS unified log?", "options": ["log show --predicate 'eventMessage contains \"Authentication\"'", "cat /var/log/auth.log", "eventquerylist security", "show authentication log"], "correct": [0], "explain": "<p><b>A is correct.</b> This is exactly the command on the ATT&amp;CK page: <code>log show</code> reads the unified log, and the <code>--predicate</code> filter keeps only authentication messages.</p><p><b>B is wrong</b> because <code>/var/log/auth.log</code> is a Linux file — macOS does not have it. <b>C is wrong</b> because <code>eventquerylist</code> is not a macOS tool. <b>D is wrong</b> because that syntax belongs to network device CLIs, not macOS.</p>", "hint": "The right answer starts with log show and a --predicate filter."}, {"kind": "multi", "long": false, "scenario": "<p>DET0210 groups four analytics under one intent. Each analytic names its platform in its title on the ATT&amp;CK page.</p>", "question": "Which platforms does DET0210 cover with its own analytic? <b>Select 4.</b>", "options": ["Windows", "Linux", "macOS", "VMware ESXi", "iOS", "ChromeOS"], "correct": [0, 1, 2, 3], "explain": "<p><b>A, B, C and D are correct.</b> One analytic per platform: AN0590 Windows, AN0591 Linux, AN0592 macOS, AN0593 ESXi. That is the whole coverage set of this strategy.</p><p><b>E and F are wrong</b> because iOS and ChromeOS have no analytic here — DET0210 does not cover phones or Chromebooks at all.</p>", "hint": "Think of a datacenter: two desktop systems, one server system, one hypervisor."}, {"kind": "drag", "long": false, "scenario": "<p>The four analytics of DET0210 each carry a platform in their title: AN0590 Windows, AN0591 Linux, AN0592 macOS, AN0593 ESXi.</p>", "question": "Match each analytic to its platform.", "zones": ["Windows", "Linux", "macOS", "VMware ESXi"], "bank": ["AN0590", "AN0591", "AN0592", "AN0593"], "solution": [0, 1, 2, 3], "explain": "<p><b>AN0590 → Windows</b> (Security log and Sysmon), <b>AN0591 → Linux</b> (auditd, sssd/winbind), <b>AN0592 → macOS</b> (unified log, Open Directory and AD plugins), <b>AN0593 → ESXi</b> (vpxd.log and hostd.log).</p><p>A wrong placement usually means mixing up the middle two: Linux (AN0591) is the one with auditd and sssd, macOS (AN0592) is the one with the unified log and mobile accounts.</p>", "hint": "Windows first, then Linux, then macOS, then the hypervisor."}, {"kind": "single", "long": false, "scenario": "<p>The AN0592 table lists the mutable element <b>UserLocation</b> with the description: 'Geo-IP or VPN source context for abnormal remote access.'</p>", "question": "Which context does the UserLocation mutable element use?", "options": ["Geo-IP or VPN source information", "The laptop's battery level", "The macOS version number", "The screen resolution"], "correct": [0], "explain": "<p><b>A is correct.</b> UserLocation is about <i>where the connection comes from</i>: the geographic location of the IP (Geo-IP) and whether it comes through a VPN. That is what makes 'abnormal remote access' judgeable.</p><p><b>B, C and D are wrong</b> because battery, OS version, and screen size say nothing about the user's location.</p>", "hint": "Location needs a map — or a VPN bookkeeping entry."}, {"kind": "single", "long": false, "scenario": "<p>09:00 — a user logs in at the office. 09:20 — the same account logs in from another country. The alert fires. The second IP address belongs to your own company VPN concentrator, and the user often works through it.</p>", "question": "What is the best first step for this alert?", "options": ["Check the VPN records: if the second login came through the company VPN, it is probably a false positive", "Disable the account and start incident response immediately", "Delete the events to keep the statistics clean", "Ignore all geographic alerts from now on"], "correct": [0], "explain": "<p><b>A is correct.</b> The cheapest and fastest check comes first: does the second source belong to your own VPN egress? If yes, the 'far away' login is really your own infrastructure, and the alert collapses into a false positive.</p><p><b>B is wrong</b> because containment before verification hurts the user and the investigation — first verify, then act. <b>C is wrong</b> because deleting telemetry destroys evidence in every direction. <b>D is wrong</b> because one false positive does not make the whole geo check useless; the next one may be real.</p>", "hint": "Verify the cheapest fact first: whose IP is it?"}, {"kind": "single", "long": false, "scenario": "<p>AN0590's mutable element <b>LogonType</b> is described as: 'Distinguish between interactive, service, and network logons.' In Windows terms: type 2 (interactive), type 5 (service), type 3 (network), type 10 (remote interactive).</p>", "question": "Why does AN0590 separate LogonType values?", "options": ["Service logons happen automatically all the time, so they need different rules than human logons", "Because service logons are always attacks", "Because interactive logons are not logged by Windows", "Because network logons only happen on macOS"], "correct": [0], "explain": "<p><b>A is correct.</b> Services log in hundreds of times a day by design. Humans log in a few times. If you judge both with one rule, you either drown in noise or miss humans. Separate LogonType baselines keep both useful.</p><p><b>B is wrong</b> — service logons are normal automation, not attacks by definition. <b>C is wrong</b> because interactive logons produce 4624 events like all others. <b>D is wrong</b> because network logons (type 3) happen on Windows constantly — file shares, for example.</p>", "hint": "A robot and a person should not share one rulebook."}, {"kind": "drag", "long": false, "scenario": "<p>The ATT&amp;CK page lists the mutable elements per analytic. AN0590 (Windows) has TimeWindow, UserContext, and LogonType. AN0591 (Linux) has HostnameScope and AccountDomain.</p>", "question": "Sort each mutable element under the analytic it belongs to.", "zones": ["AN0590 (Windows)", "AN0591 (Linux)"], "bank": ["TimeWindow", "UserContext", "HostnameScope", "AccountDomain"], "solution": [0, 0, 1, 1], "explain": "<p><b>TimeWindow and UserContext belong to AN0590</b> — they shape the Windows analytic's hours and account focus. <b>HostnameScope and AccountDomain belong to AN0591</b> — they focus the Linux analytic on chosen systems and check which domain the account really comes from.</p><p>A swap here usually happens because both analytics talk about 'scope' — but on Windows the scope is about time and people, on Linux it is about machines and domains.</p>", "hint": "Windows tunes time and users; Linux tunes hosts and domains."}, {"kind": "single", "long": false, "scenario": "<p>On the ATT&amp;CK page, AN0590's table shows two Sysmon codes under one data component: <span class='tok-num'>EventCode=3</span> and <span class='tok-num'>EventCode=22</span>, both mapped to <b>Network Connection Creation (DC0082)</b>.</p>", "question": "Under which data component does AN0590 list Sysmon EventCodes 3 and 22?", "options": ["Network Connection Creation (DC0082)", "Process Creation (DC0032)", "Logon Session Metadata (DC0088)", "User Account Authentication (DC0002)"], "correct": [0], "explain": "<p><b>A is correct.</b> Sysmon <code>3</code> is a network connection event and <code>22</code> is a DNS query event — the ATT&amp;CK page groups both under <b>Network Connection Creation (DC0082)</b>, because both describe the host reaching out to the network.</p><p><b>B is wrong</b> because Process Creation is Sysmon EventCode 1 only. <b>C is wrong</b> because Logon Session Metadata comes from the Security log events (4624, 4625, 4768, 4769). <b>D is wrong</b> because User Account Authentication (DC0002) is the data component used by the Linux, macOS, and ESXi analytics — not the Windows one.</p>", "hint": "One of them is literally a network event; the other asks DNS names — both end up on the wire."}, {"kind": "multi", "long": false, "scenario": "<p>Domain controllers log Kerberos activity in the Security log: <span class='tok-num'>4768</span> and <span class='tok-num'>4769</span> are part of AN0590's telemetry (data component Logon Session Metadata, DC0088).</p>", "question": "Which three statements about events 4768 and 4769 are true? <b>Select 3.</b>", "options": ["4768 means a user asked for a Kerberos ticket-granting ticket (TGT)", "4769 means a ticket for one specific service was requested", "They are logged on the domain controller's Security log", "They show the contents of files on network shares", "They appear only on the user's own laptop"], "correct": [0, 1, 2], "explain": "<p><b>A, B and C are correct.</b> <code>4768</code> is the authentication-ticket (TGT) request — the front door of Kerberos. <code>4769</code> is the service-ticket request — the key for one door. Both are written on the <b>domain controller</b>, because the DC is Kerberos's ticket office.</p><p><b>D is wrong</b> because ticket events carry identities and services, never file contents. <b>E is wrong</b> because these events come from the DC, not from the user's laptop.</p>", "hint": "One ticket opens the domain, the other opens one service — and the DC writes both down."}, {"kind": "single", "long": false, "scenario": "<p>Your company's Linux servers are not joined to Active Directory at all. They only have local users, no sssd and no winbind.</p>", "question": "Will AN0591 alert on logons to these servers?", "options": ["No — AN0591 watches domain logons through sssd/winbind; local-only servers give it nothing to see", "Yes — it watches every Linux logon of every kind", "Yes — but only for the root account", "No — because Linux is never covered by DET0210"], "correct": [0], "explain": "<p><b>A is correct.</b> AN0591's subject is <i>domain</i> account usage via sssd or winbind. Without those components the host never produces the telemetry the analytic needs, so domain-logon anomalies cannot be seen there.</p><p><b>B is wrong</b> because the analytic is not a general Linux login watcher. <b>C is wrong</b> because root is a local account — also outside the subject. <b>D is wrong</b> because Linux <i>is</i> covered (AN0591) — just only for domain activity.</p>", "hint": "Coverage follows the telemetry: no sssd, no domain logons, no signal."}]};
var HINT_PENALTY = 0.15;
var HANDSHAKE = null;
var S = null;
var lastTick = 0;
var nudgeTimer = null;

function freshState(){
  var exs = [];
  for (var i = 0; i < EXAM.exercises.length; i++){
    exs.push({ status:'pending', credit:0, raw:0, hints:0, hintShown:false, answered:false,
               selection:null, placement:{}, seq:[], activeChip:null,
               scnOpen:!EXAM.exercises[i].long, fromReview:false, feedbackItems:[] });
  }
  return { phase:'INTRO', idx:0, timeLeft: EXAM.minutes * 60, score:0, timeUp:false,
           pauseAcc:{ manual:0, autoCheck:0 }, pauseEnter:0, pauseUnder:null, pauseFrom:null,
           posted:false, final:null, exercises:exs };
}
function $(id){ return document.getElementById(id); }
function cur(){ return S.exercises[S.idx]; }
function curEx(){ return EXAM.exercises[S.idx]; }
function blocked(){ return S.phase !== 'RUNNING' && S.phase !== 'REVIEW'; }
function letter(i){ return 'ABCDEFGH'.charAt(i); }
function fmt(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60), r = s%60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function fmtDur(s){ s = Math.round(s); if (s < 60) return s + ' s';
  var m = Math.floor(s/60), r = s%60; return m + ' m ' + r + ' s'; }

/* ---------- timer: state machine with RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED ---------- */
setInterval(function(){
  var now = Date.now();
  if (lastTick && S){
    var dt = (now - lastTick) / 1000;
    if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
      S.timeLeft -= dt;
      if (S.timeLeft <= 0){ S.timeLeft = 0; lastTick = now; finishByTimeout(); return; }
    }
  }
  lastTick = now;
  if (S && S.phase !== 'INTRO') renderTimerChip();
}, 250);

function togglePause(){
  if (!S || S.phase === 'INTRO' || S.phase === 'ENDED') return;
  if (S.phase === 'PAUSED_MANUAL'){
    S.pauseAcc.manual += (Date.now() - S.pauseEnter) / 1000;
    S.phase = (S.pauseUnder === 'PAUSED_AUTO_CHECK') ? 'PAUSED_AUTO_CHECK' : (S.pauseFrom || 'RUNNING');
    S.pauseUnder = null;
    S.pauseEnter = (S.phase === 'PAUSED_AUTO_CHECK') ? Date.now() : 0;
  } else if (S.phase === 'PAUSED_AUTO_CHECK'){
    S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
    S.pauseUnder = 'PAUSED_AUTO_CHECK';
    S.pauseEnter = Date.now();
    S.phase = 'PAUSED_MANUAL';
  } else {
    S.pauseEnter = Date.now();
    S.pauseUnder = null;
    S.pauseFrom = S.phase; /* RUNNING or REVIEW — Resume returns here */
    S.phase = 'PAUSED_MANUAL';
  }
  renderAll(false);
}

/* ---------- grading: partial credit max(0,(H-W)/N), hint penalty clamped at zero ---------- */
function hasAnswer(ex, s){
  if (ex.kind === 'single') return s.selection !== null && s.selection !== undefined;
  if (ex.kind === 'multi') return !!(s.selection && s.selection.length > 0);
  if (ex.kind === 'drag'){ for (var k in s.placement){ if (s.placement[k] !== null && s.placement[k] !== undefined) return true; } return false; }
  if (ex.kind === 'order') return s.seq.length === ex.correctOrder.length;
  return false;
}

function grade(s, ex){
  var items = [], raw = 0, N, H, W, i, isC, picked;
  if (ex.kind === 'single'){
    raw = (s.selection === ex.correct[0]) ? 1 : 0;
    for (i = 0; i < ex.options.length; i++){
      if (i === s.selection) items.push({ state: raw ? 'correct' : 'wrong', text: letter(i) + ' — ' + ex.options[i] });
      else if (i === ex.correct[0] && !raw) items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] });
    }
  } else if (ex.kind === 'multi'){
    N = ex.correct.length; H = 0; W = 0;
    for (i = 0; i < ex.options.length; i++){
      picked = s.selection.indexOf(i) >= 0; isC = ex.correct.indexOf(i) >= 0;
      if (picked && isC){ H++; items.push({ state:'correct', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (picked && !isC){ W++; items.push({ state:'wrong', text: letter(i) + ' — ' + ex.options[i] }); }
      else if (!picked && isC){ items.push({ state:'missed', text: letter(i) + ' — ' + ex.options[i] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'drag'){
    N = ex.solution.length; H = 0; W = 0;
    for (i = 0; i < N; i++){
      var at = s.placement[i];
      if (at === ex.solution[i]){ H++; items.push({ state:'correct', text: ex.bank[i] + ' → ' + ex.zones[at] }); }
      else if (at === null || at === undefined){ items.push({ state:'missed', text: ex.bank[i] + ' — correct box: ' + ex.zones[ex.solution[i]] + ' (you did not place it)' }); }
      else { W++; items.push({ state:'wrong', text: ex.bank[i] + ' — you put it in ' + ex.zones[at] + ', correct is ' + ex.zones[ex.solution[i]] }); }
    }
    raw = Math.max(0, (H - W) / N);
  } else if (ex.kind === 'order'){
    N = ex.correctOrder.length; H = 0; W = 0;
    for (var pos = 0; pos < N; pos++){
      var got = s.seq[pos], want = ex.correctOrder[pos];
      if (got === want){ H++; items.push({ state:'correct', text: 'Position ' + (pos+1) + ': ' + ex.items[got] }); }
      else if (got === null || got === undefined){ items.push({ state:'missed', text: 'Position ' + (pos+1) + ' — correct: ' + ex.items[want] }); }
      else { W++; items.push({ state:'wrong', text: 'Position ' + (pos+1) + ': you put ' + ex.items[got] + ', correct is ' + ex.items[want] }); }
    }
    raw = Math.max(0, (H - W) / N);
  }
  s.raw = raw;
  s.credit = Math.max(0, raw - s.hints * HINT_PENALTY);
  s.answered = true;
  s.status = 'answered';
  s.feedbackItems = items;
  S.score += s.credit; /* float accumulator */
}

/* ---------- flow: Check / Next / Skip / Hint / review / finish ---------- */
function onCheck(){
  if (!S || blocked()) return;
  var s = cur(), ex = curEx();
  if (s.answered) return;
  if (!hasAnswer(ex, s)){ nudge('Select an answer first.'); return; }
  S.phase = 'PAUSED_AUTO_CHECK'; /* auto-pause happens BEFORE feedback is rendered */
  S.pauseEnter = Date.now();
  grade(s, ex);
  renderAll(false);
}
function onNext(){
  if (!S || S.phase !== 'PAUSED_AUTO_CHECK') return;
  S.pauseAcc.autoCheck += (Date.now() - S.pauseEnter) / 1000;
  S.pauseEnter = 0;
  S.phase = 'RUNNING'; /* Next restarts the timer */
  advance();
}
function advance(){
  var s = cur();
  if (s && s.fromReview){ s.fromReview = false; S.phase = 'REVIEW'; renderAll(true); return; }
  S.idx++;
  if (S.idx < S.exercises.length) renderAll(true);
  else startReviewOrFinish();
}
function startReviewOrFinish(){
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered'){ startReview(); return; }
  }
  finish();
}
function startReview(){ S.phase = 'REVIEW'; renderAll(true); }
function onSkip(){
  if (!S || blocked()) return;
  var s = cur();
  if (s.answered) return;
  s.status = 'skipped'; /* Skip never pauses the timer */
  advance();
}
function onHint(){
  if (!S || blocked()) return;
  var s = cur();
  if (!s || s.answered || s.hintShown) return;
  s.hintShown = true;
  s.hints = 1; /* Hint never pauses the timer */
  renderAll(false);
}
function reviewAnswer(i){
  if (!S || S.phase !== 'REVIEW') return;
  S.idx = i;
  S.exercises[i].fromReview = true;
  S.phase = 'RUNNING';
  renderAll(true);
}
function finishByTimeout(){
  if (!S || S.phase === 'ENDED') return;
  S.timeUp = true;
  for (var i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') S.exercises[i].status = 'skipped';
  }
  finish();
}
function finish(){
  if (!S || S.phase === 'ENDED') return;
  S.phase = 'ENDED';
  var answered = 0, fullC = 0, partC = 0, partSum = 0, zeroC = 0, skipped = 0;
  for (var i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i];
    if (s.status === 'answered'){
      answered++;
      if (s.credit >= 0.999) fullC++;
      else if (s.credit > 0.0001){ partC++; partSum += s.credit; }
      else zeroC++;
    } else skipped++;
  }
  var scoreInt = Math.round(S.score);
  var percent = answered > 0 ? Math.round(scoreInt * 100 / answered) : 0;
  S.final = { scoreInt: scoreInt, total: answered, percent: percent, passed: percent >= EXAM.passMark,
              fullC: fullC, partC: partC, partAvg: partC ? (partSum / partC) : 0,
              zeroC: zeroC, skipped: skipped };
  renderAll(true);
  animateScore();
  var stateRef = S; /* snapshot: a retake must never hijack this report */
  setTimeout(function(){ postReport(stateRef); }, 1400); /* post once, after the score animation has settled */
}
function animateScore(){
  var el = $('score-big'); if (!el) return;
  var t0 = null, dur = 900;
  function step(ts){
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    el.textContent = String(Math.round(S.final.scoreInt * p));
    var bar = $('score-bar');
    if (bar) bar.style.width = (S.final.percent * p) + '%';
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function postReport(sRef){
  var st = sRef || S;
  if (!st || st.posted || !st.final) return;
  st.posted = true;
  var f = st.final;
  var payload = { type:'CYBERPULSE_SCORE', topicId: EXAM.topicId, batch: EXAM.batch,
                  difficulty: EXAM.difficulty, attckId: EXAM.attckId, objectType: EXAM.objectType,
                  score: f.scoreInt, total: f.total, percent: f.percent, passed: f.passed,
                  passMark: EXAM.passMark,
                  timeSpentSec: Math.round(EXAM.minutes * 60 - Math.max(0, st.timeLeft)),
                  pauseSec: { manual: Math.round(st.pauseAcc.manual), autoCheck: Math.round(st.pauseAcc.autoCheck) } };
  try {
    var target = (window.parent && window.parent !== window) ? window.parent : window;
    target.postMessage(payload, window.location.origin);
  } catch (e) { /* reporting must never break the exam */ }
  var note = $('post-note');
  if (note) note.textContent = '✓ Result reported to the training platform.';
}
function retake(){
  S = freshState(); /* new attempt: the score report may be posted again, once */
  renderAll(true);
  window.scrollTo(0, 0);
}
function startExam(){
  if (!S) return;
  S.phase = 'RUNNING';
  S.pauseEnter = 0;
  lastTick = Date.now();
  renderAll(true);
  window.scrollTo(0, 0);
}

/* ---------- answer interactions (no auto-pause on any intermediate confirmation) ---------- */
function pick(i){ if (!S || blocked()) return; var s = cur(); if (s.answered) return; s.selection = i; renderBody(false); }
function toggleMulti(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (!s.selection) s.selection = [];
  var p = s.selection.indexOf(i);
  if (p >= 0) s.selection.splice(p, 1); else s.selection.push(i);
  renderBody(false);
}
function chipClick(ii){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var placed = s.placement[ii];
  if (placed !== null && placed !== undefined){ delete s.placement[ii]; s.activeChip = null; }
  else s.activeChip = (s.activeChip === ii) ? null : ii;
  renderBody(false);
}
function zoneClick(zi){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.activeChip === null || s.activeChip === undefined){ nudge('Pick an item first, then choose a box.'); return; }
  s.placement[s.activeChip] = zi;
  s.activeChip = null;
  renderBody(false);
}
function dragStart(ev, ii){
  var s = cur();
  if (!S || s.answered){ if (ev) ev.preventDefault(); return; }
  s.activeChip = ii;
  try { ev.dataTransfer.setData('text/plain', String(ii)); } catch (e) {}
}
function dropPlace(ev, zi){
  ev.preventDefault();
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  var ii = parseInt(ev.dataTransfer.getData('text/plain'), 10);
  if (isNaN(ii)) ii = s.activeChip;
  if (ii === null || ii === undefined || isNaN(ii)) return;
  s.placement[ii] = zi;
  s.activeChip = null;
  renderBody(false);
}
function zoneClear(ev, zi){
  if (ev && ev.stopPropagation) ev.stopPropagation(); /* do not bubble into the zone click */
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  for (var k in s.placement){ if (s.placement[k] === zi) delete s.placement[k]; }
  renderBody(false);
}
function seqAdd(i){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  if (s.seq.indexOf(i) >= 0) return;
  s.seq.push(i);
  renderBody(false);
}
function seqRemove(pos){
  if (!S || blocked()) return; var s = cur(); if (s.answered) return;
  s.seq.splice(pos, 1);
  renderBody(false);
}
function scnToggle(open){ if (S && cur()) cur().scnOpen = open; }
function nudge(msg){
  var t = $('toast'); if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(function(){ t.className = 'toast'; }, 1800);
}

/* ---------- rendering ---------- */
function renderAll(top){ renderHeader(); renderBody(top); }
function renderBody(top){
  var y = top ? 0 : (window.scrollY || 0);
  var m = $('main'); if (!m) return;
  if (S.phase === 'INTRO') m.innerHTML = introHTML();
  else if (S.phase === 'RUNNING' || S.phase === 'PAUSED_MANUAL' || S.phase === 'PAUSED_AUTO_CHECK') m.innerHTML = exerciseHTML();
  else if (S.phase === 'REVIEW') m.innerHTML = reviewHTML();
  else m.innerHTML = resultsHTML();
  window.scrollTo(0, y);
}
function renderTimerChip(){
  var el = $('hd-timer'); if (!el) return;
  var cls = 'chip chip-time', txt = '';
  if (S.phase === 'INTRO'){ txt = '⏱ Ready · ' + fmt(S.timeLeft); }
  else if (S.phase === 'RUNNING' || S.phase === 'REVIEW'){
    var low = S.timeLeft <= EXAM.minutes * 60 * 0.2;
    txt = (low ? '⚠ ' : '▶ ') + 'Running · ' + fmt(S.timeLeft);
    if (low) cls += ' chip-low';
  }
  else if (S.phase === 'PAUSED_MANUAL'){ txt = '⏸ Paused · ' + fmt(S.timeLeft); cls += ' chip-paused'; }
  else if (S.phase === 'PAUSED_AUTO_CHECK'){ txt = '⏳ Checking · ' + fmt(S.timeLeft); cls += ' chip-checking'; }
  else { txt = '⏹ Ended · ' + fmt(S.timeLeft); cls += ' chip-ended'; }
  el.className = cls;
  el.textContent = txt;
}
function renderHeader(){
  var N = S.exercises.length;
  var cnt = $('hd-counter');
  if (S.phase === 'INTRO') cnt.textContent = 'Ready';
  else if (S.phase === 'ENDED') cnt.textContent = 'Completed';
  else cnt.textContent = 'Exercise ' + (S.idx + 1) + ' / ' + N;
  $('hd-score').textContent = 'Score ' + S.score.toFixed(2);
  var canAct = !blocked();
  var s = (S.phase === 'ENDED' || S.phase === 'INTRO') ? null : cur();
  var hb = $('btn-hint'), sb = $('btn-skip'), pb = $('btn-pause');
  hb.disabled = !(canAct && s && !s.answered && !s.hintShown);
  sb.disabled = !(canAct && s && !s.answered);
  pb.disabled = (S.phase === 'INTRO' || S.phase === 'ENDED');
  pb.textContent = (S.phase === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  renderTimerChip();
}

function introHTML(){
  var I = EXAM.intro, h = '', i;
  h += '<section class="hero">'
    + '<div class="hero-kicker">MITRE ATT&amp;CK · ' + EXAM.objectLabel + ' · ' + EXAM.attckId + '</div>'
    + '<h1>' + EXAM.title + ' — Knowledge Exam</h1>'
    + '<div class="hero-chips">'
    + '<span class="chip">' + EXAM.exercises.length + ' exercises</span>'
    + '<span class="badge badge-' + EXAM.difficulty + '">' + EXAM.severityWord + '</span>'
    + '<span class="chip">Estimated time: ' + EXAM.minutes + ' min</span>'
    + '<span class="chip">Timer budget: ' + fmt(EXAM.minutes * 60) + '</span>'
    + '<span class="chip">Pass mark: ' + EXAM.passMark + '%</span>'
    + '</div></section>';
  h += '<section class="intro-sec"><h2>What you will learn here</h2>';
  for (i = 0; i < I.learn.length; i++) h += '<p>' + I.learn[i] + '</p>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Keywords covered in this exam</h2><div class="kw-chips">';
  for (i = 0; i < I.keywords.length; i++) h += '<span class="kw">' + I.keywords[i] + '</span>';
  h += '</div></section>';
  h += '<section class="intro-sec"><h2>How this exam works</h2><ol class="how-list">';
  for (i = 0; i < I.how.length; i++) h += '<li>' + I.how[i] + '</li>';
  h += '</ol><div class="start-wrap"><button class="btn btn-primary btn-start" onclick="startExam()">▶ Start the exam</button></div></section>';
  return h;
}

function answerHTML(s, ex){
  var h = '', i;
  if (ex.kind === 'single' || ex.kind === 'multi'){
    if (ex.kind === 'multi') h += '<div class="multi-note">Select all that apply — ' + ex.correct.length + ' options are correct. Correct picks add credit, wrong picks remove credit.</div>';
    h += '<div class="options">';
    for (i = 0; i < ex.options.length; i++){
      var sel = (ex.kind === 'single') ? (s.selection === i) : !!(s.selection && s.selection.indexOf(i) >= 0);
      h += '<button type="button" class="opt' + (sel ? ' opt-sel' : '') + '" onclick="' + (ex.kind === 'single' ? 'pick(' : 'toggleMulti(') + i + ')">'
        + (ex.kind === 'multi' ? '<span class="opt-box">' + (sel ? '✓' : '') + '</span>' : '')
        + '<span class="opt-key">' + letter(i) + '</span><span class="opt-text">' + ex.options[i] + '</span></button>';
    }
    h += '</div>';
  } else if (ex.kind === 'drag'){
    h += '<div class="multi-note">Pick an item, then pick a box. You can also drag the items. Items you never place score as missed.</div>';
    h += '<div class="dz-layout"><div class="bank">';
    for (i = 0; i < ex.bank.length; i++){
      if (s.placement[i] === null || s.placement[i] === undefined){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" draggable="true" ondragstart="dragStart(event,' + i + ')" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
      }
    }
    h += '</div><div class="zones">';
    for (var z = 0; z < ex.zones.length; z++){
      h += '<div class="dz' + (s.activeChip !== null && s.activeChip !== undefined ? ' dz-armed' : '') + '" onclick="zoneClick(' + z + ')" ondragover="event.preventDefault()" ondrop="dropPlace(event,' + z + ')">'
        + '<div class="dz-head"><span>' + ex.zones[z] + '</span><button type="button" class="dz-clear" onclick="zoneClear(event,' + z + ')">clear</button></div>';
      for (i = 0; i < ex.bank.length; i++){
        if (s.placement[i] === z){
          h += '<button type="button" class="chipd" onclick="chipClick(' + i + ')">' + ex.bank[i] + '</button>';
        }
      }
      h += '</div>';
    }
    h += '</div></div>';
  } else if (ex.kind === 'order'){
    h += '<div class="multi-note">Tap the items in the correct order, first to last. Tap an item in your sequence to remove it again.</div>';
    h += '<div class="seq-layout"><div class="bank">';
    for (i = 0; i < ex.items.length; i++){
      if (s.seq.indexOf(i) < 0){
        h += '<button type="button" class="chipd' + (s.activeChip === i ? ' chipd-active' : '') + '" onclick="seqAdd(' + i + ')">' + ex.items[i] + '</button>';
      }
    }
    h += '</div><div class="seq"><div class="block-label lbl-neutral">YOUR ORDER</div>';
    for (var p = 0; p < ex.items.length; p++){
      if (p < s.seq.length){
        h += '<button type="button" class="seq-item" onclick="seqRemove(' + p + ')"><span class="seq-num">' + (p + 1) + '</span><span>' + ex.items[s.seq[p]] + '</span></button>';
      } else {
        h += '<div class="seq-slot">Position ' + (p + 1) + ' — not filled yet</div>';
      }
    }
    h += '</div></div>';
  }
  return h;
}

function exerciseHTML(){
  var s = cur(), ex = curEx(), h = '';
  if (S.phase === 'PAUSED_MANUAL') h += '<div class="banner banner-pause">⏸ Paused — the timer is stopped. Press the Pause button again (▶ Resume) to continue.</div>';
  if (S.phase === 'PAUSED_AUTO_CHECK') h += '<div class="banner banner-check">⏳ Checking — the timer is stopped while you read this feedback. Press Next to continue.</div>';
  h += '<section class="block block-scenario"><details class="scn"' + (s.scnOpen ? ' open' : '') + ' ontoggle="scnToggle(this.open)">'
    + '<summary><span class="block-label lbl-blue">SCENARIO</span><span class="scn-hint">click to open or close</span></summary>'
    + '<div class="scn-body">' + ex.scenario + '</div></details></section>';
  h += '<section class="block block-question"><div class="block-label lbl-amber">QUESTION</div><div class="q-text">' + ex.question + '</div></section>';
  h += '<section class="block block-answer"><div class="block-label lbl-green">YOUR ANSWER</div>' + answerHTML(s, ex) + '</section>';
  if (s.hintShown && !s.answered){
    h += '<div class="hintbox"><span class="hint-tag">HINT · COSTS 0.15 CREDIT</span><br>' + ex.hint + '</div>';
  }
  h += '<div class="actions">';
  if (!s.answered){
    h += '<button class="btn btn-primary"' + (blocked() ? ' disabled' : '') + ' onclick="onCheck()">Check</button>';
  } else {
    var last = (S.idx === S.exercises.length - 1);
    h += '<button class="btn btn-primary"' + (S.phase === 'PAUSED_MANUAL' ? ' disabled' : '') + ' onclick="onNext()">'
      + (s.fromReview ? '↩ Back to review' : (last ? 'Final Submit ▸' : 'Next ▸')) + '</button>';
  }
  h += '</div>';
  if (s.answered) h += feedbackHTML(s, ex);
  return h;
}

function feedbackHTML(s, ex){
  var good = s.credit >= 0.999, zero = s.credit <= 0.0001;
  var cls = good ? 'fb-good' : (zero ? 'fb-bad' : 'fb-part');
  var chip = good ? '<span class="statechip st-correct">✓ Correct</span>'
    : (zero ? '<span class="statechip st-wrong">✗ Incorrect</span>'
    : '<span class="statechip st-part">✓ Partially correct</span>');
  var h = '<section class="feedback ' + cls + '"><div class="fb-head">' + chip
    + '<span class="fb-credit">Credit ' + s.credit.toFixed(2) + ' / 1.00</span>'
    + (s.hints ? '<span class="fb-penalty">includes −' + (s.hints * HINT_PENALTY).toFixed(2) + ' hint penalty</span>' : '')
    + '</div>';
  if (s.feedbackItems.length){
    h += '<ul class="fb-items">';
    for (var i = 0; i < s.feedbackItems.length; i++){
      var it = s.feedbackItems[i];
      var mark = it.state === 'correct' ? '✓ Correct' : (it.state === 'wrong' ? '✗ Wrong' : '○ Missed');
      h += '<li class="it-' + it.state + '"><span class="it-mark">' + mark + '</span><span class="it-text">' + it.text + '</span></li>';
    }
    h += '</ul>';
  }
  h += '<div class="fb-explain"><div class="block-label lbl-neutral">WHY</div>' + ex.explain + '</div></section>';
  return h;
}

function reviewHTML(){
  var h = '', pend = [], i;
  for (i = 0; i < S.exercises.length; i++){
    if (S.exercises[i].status !== 'answered') pend.push(i);
  }
  h += '<section class="intro-sec"><h2>⚠ Review skipped exercises</h2>'
    + '<p>You have ' + pend.length + ' exercise' + (pend.length === 1 ? '' : 's') + ' without an answer. You can answer ' + (pend.length === 1 ? 'it' : 'them') + ' now — the timer keeps running. Anything you never answer will not count in your score or your total.</p></section>';
  for (i = 0; i < pend.length; i++){
    h += '<div class="rev-row"><span class="rev-num">Exercise ' + (pend[i] + 1) + '</span>'
      + '<button class="btn" onclick="reviewAnswer(' + pend[i] + ')">Answer now</button></div>';
  }
  h += '<div class="actions"><button class="btn btn-primary" onclick="finish()">Finish &amp; see results ▸</button></div>';
  return h;
}

function resultsHTML(){
  var f = S.final, h = '', i;
  h += '<section class="intro-sec"><div class="fb-head">'
    + '<span class="statechip st-end">⏹ Exam complete</span>'
    + (S.timeUp ? '<span class="statechip st-wrong">⚠ Time ran out</span>' : '')
    + (f.passed ? '<span class="statechip st-correct">✓ Passed</span>' : '<span class="statechip st-wrong">✗ Not passed</span>')
    + '</div>';
  h += '<div class="score-wrap"><div class="score-big" id="score-big">0</div>'
    + '<div class="score-of">points / ' + f.total + ' answered</div>'
    + '<div class="bar"><div class="bar-fill" id="score-bar" style="width:0%"></div></div>'
    + '<div class="score-pct"><span>' + f.percent + '%</span>'
    + '<span class="pass-note">Pass mark ' + EXAM.passMark + '% · final percent uses the same rounded score</span></div></div>';
  h += '</section>';
  h += '<section class="intro-sec"><h2>Result breakdown</h2>'
    + '<div class="cat-row cat-good"><span>✓ Fully correct</span><span class="cat-n">' + f.fullC + '</span></div>'
    + '<div class="cat-row cat-part"><span>✓ Partially correct — average partial credit ' + f.partAvg.toFixed(2) + '</span><span class="cat-n">' + f.partC + '</span></div>'
    + '<div class="cat-row cat-bad"><span>✗ Fully incorrect</span><span class="cat-n">' + f.zeroC + '</span></div>'
    + '<div class="cat-row cat-skip"><span>⚠ Skipped and never answered — excluded from score and total</span><span class="cat-n">' + f.skipped + '</span></div>'
    + '<div class="pause-log">⏸ Time paused manually: ' + fmtDur(S.pauseAcc.manual) + '</div>'
    + '<div class="pause-log">⏳ Time paused while checking: ' + fmtDur(S.pauseAcc.autoCheck) + '</div>'
    + '<div class="pause-log">Time used: ' + fmt(EXAM.minutes * 60 - Math.max(0, S.timeLeft)) + ' of the ' + fmt(EXAM.minutes * 60) + ' budget</div>'
    + '</section>';
  h += '<section class="intro-sec"><h2>Every exercise</h2><div class="sum-list">';
  for (i = 0; i < S.exercises.length; i++){
    var s = S.exercises[i], word;
    if (s.status === 'answered'){
      if (s.credit >= 0.999) word = '<span class="it-correct" style="color:var(--correct)">✓ Correct</span>';
      else if (s.credit > 0.0001) word = '<span style="color:var(--warn)">✓ Partially correct</span>';
      else word = '<span style="color:var(--wrong)">✗ Incorrect</span>';
    } else word = '<span style="color:var(--warn)">⚠ Skipped</span>';
    h += '<div class="sum-row"><span>Exercise ' + (i + 1) + '</span><span>' + word + ' · ' + (s.status === 'answered' ? s.credit.toFixed(2) : '0.00') + ' credit</span></div>';
  }
  h += '</div></section>';
  h += '<div class="actions"><button class="btn btn-primary" onclick="retake()">↺ Retake the exam</button></div>';
  h += '<div id="post-note" class="post-note"></div>';
  return h;
}

/* ---------- handshake: accept CYBERPULSE_INIT and CYBERMASTERY_INIT; theme field is ignored (dark only) ---------- */
window.addEventListener('message', function(ev){
  try {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT'){ HANDSHAKE = d; }
  } catch (e) { /* a broken handshake must not break the exam */ }
});

function initExam(){
  S = freshState();
  renderAll(true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initExam);
else initExam();

</script>
</body>
</html>
