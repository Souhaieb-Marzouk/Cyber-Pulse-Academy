<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints of the palette above (single source of truth) */
  --bg-hover:#182238;
  --bg-hover-2:#223154;
  --bg-chip:#1b2a4a;
  --bg-page-96:rgba(11,16,32,.96);
  --bg-page-ov:rgba(11,16,32,.97);
  --tint-blue-05:rgba(90,169,255,.045);
  --tint-blue-07:rgba(90,169,255,.07);
  --tint-blue-08:rgba(90,169,255,.08);
  --tint-blue-10:rgba(90,169,255,.10);
  --tint-amber-07:rgba(255,180,84,.07);
  --tint-amber-08:rgba(255,180,84,.08);
  --tint-amber-12:rgba(255,180,84,.12);
  --tint-amber-28:rgba(255,180,84,.28);
  --tint-amber-40:rgba(255,180,84,.40);
  --tint-amber-45:rgba(255,180,84,.45);
  --tint-green-07:rgba(87,211,140,.07);
  --tint-green-08:rgba(87,211,140,.08);
  --tint-red-07:rgba(255,107,107,.07);
  --tint-red-08:rgba(255,107,107,.08);
  --tint-grey-08:rgba(169,180,208,.08);
  --tint-white-02:rgba(255,255,255,.02);
  --sheen:rgba(255,255,255,.22);
  --btn-p1:#1d3a6b;--btn-p2:#17325e;--btn-pb:#2e5ea8;
  --btn-ph1:#234a8c;--btn-ph2:#1c3f77;
  --btn-g1:#14522f;--btn-g2:#124826;--btn-gb:#2c7a4b;
  --btn-gh1:#19653b;--btn-gh2:#175a30;
  --danger-border:#7a2e2e;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,code,pre{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
a{color:var(--accent-blue)}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
/* ---------- header strip ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--bg-page-96);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
}
.hdr-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hdr .cell{display:flex;align-items:center;gap:6px;min-height:34px}
.hdr .lab{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hdr .val{font-weight:700;font-size:15px}
.hdr .score-sum{color:var(--text-primary);font-weight:800}
.hdr .mono{font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:999px;
  padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;
  background:var(--bg-surface);min-height:28px;
}
.badge .dot{width:9px;height:9px;border-radius:50%}
.sev-easy{color:var(--sev-easy)}.sev-easy .dot{background:var(--sev-easy)}
.sev-medium{color:var(--sev-medium)}.sev-medium .dot{background:var(--sev-medium)}
.sev-hard{color:var(--sev-hard)}.sev-hard .dot{background:var(--sev-hard)}
.sev-extreme{color:var(--sev-extreme)}.sev-extreme .dot{background:var(--sev-extreme)}
.tstate{font-weight:700;font-size:13px}
.tstate.run{color:var(--accent-blue)}
.tstate.pman,.tstate.pauto{color:var(--state-paused)}
.tstate.end{color:var(--state-skipped)}
/* ---------- progress bar ---------- */
.bar{
  position:relative;height:6px;background:var(--bg-surface-2);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.bar-fill{
  height:100%;width:0%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--accent-blue),var(--sev-col,var(--accent-green)));
  transition:width .5s ease;
  position:relative;overflow:hidden;
}
.bar-fill::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 3.2s linear infinite;
}
@keyframes sheen{to{left:120%}}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--bg-surface);color:var(--text-primary);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--btn-p1),var(--btn-p2));border-color:var(--btn-pb)}
.btn.primary:hover{background:linear-gradient(135deg,var(--btn-ph1),var(--btn-ph2))}
.btn.green{background:linear-gradient(135deg,var(--btn-g1),var(--btn-g2));border-color:var(--btn-gb)}
.btn.green:hover{background:linear-gradient(135deg,var(--btn-gh1),var(--btn-gh2))}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger-border);color:var(--state-incorrect)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:4px 12px;font-size:13px}
/* ---------- cards & blocks ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px 18px;
  margin:14px 0;
}
.blk{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.blk-h{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.blk.scenario{border-left-color:var(--accent-blue)}
.blk.scenario .blk-h{color:var(--accent-blue);background:var(--tint-blue-08)}
.blk.question{border-left-color:var(--accent-amber)}
.blk.question .blk-h{color:var(--accent-amber);background:var(--tint-amber-08)}
.blk.answer{border-left-color:var(--accent-green)}
.blk.answer .blk-h{color:var(--accent-green);background:var(--tint-green-08)}
.blk-b{padding:14px 16px;background:var(--bg-surface)}
.blk.scenario .blk-b{background:linear-gradient(0deg,var(--tint-blue-05),var(--tint-blue-05)),var(--bg-surface)}
.qtext{font-weight:700;font-size:16.5px;margin:0}
.sc-sum{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:8px 14px;font-size:13px;cursor:pointer;min-height:44px;
}
.sc-sum:hover{color:var(--text-primary)}
.sc-sum .caret{margin-left:auto;transition:transform .2s ease}
.sc-sum[aria-expanded="true"] .caret{transform:rotate(90deg)}
.sc-body{padding:12px 16px 16px}
.sc-body p{margin:.4em 0 1em}
/* ---------- artefacts ---------- */
.art{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  margin:10px 0;
  overflow:hidden;
}
.art-lab{
  display:block;padding:6px 12px;
  color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.06em;
  border-bottom:1px solid var(--border);
  background:var(--tint-white-02);
}
.art-b{padding:10px 12px;overflow-x:auto}
.art-b.plain{font-size:15px}
.art-b pre{margin:0;font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre}
/* ---------- syntax highlight tokens ---------- */
.tk-k{color:var(--accent-blue);font-weight:700}
.tk-s{color:var(--accent-amber)}
.tk-n{color:var(--accent-green)}
.tk-i{color:var(--state-paused)}
.tk-c{color:var(--text-secondary);font-style:italic}
.tk-w{color:var(--state-incorrect);font-weight:700}
/* ---------- log viewer ---------- */
.logbox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.logbar input{
  flex:1;background:var(--bg-page);border:1px solid var(--border);color:var(--text-mono);
  border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;
}
.logbar .cnt{color:var(--text-secondary);font-size:12px;white-space:nowrap}
.loglines{max-height:320px;overflow:auto;padding:8px 10px}
.loglines pre{margin:0;font-size:14px;line-height:1.55;color:var(--text-mono);white-space:pre;overflow-x:auto}
.loglines .ln-no{color:var(--text-secondary);opacity:.7;margin-right:10px}
.loglines mark{background:var(--tint-amber-28);color:var(--text-primary);border-radius:2px;padding:0 1px}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text-primary);cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;min-height:44px;
  transition:background .12s ease,border-color .12s ease;
}
.opt:hover{background:var(--bg-hover)}
.opt .opt-k{
  flex:0 0 auto;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-chip);border:1px solid var(--border);
  font-weight:800;font-size:13px;color:var(--text-secondary);
}
.opt.sel{border-color:var(--accent-blue);background:var(--tint-blue-10);box-shadow:inset 3px 0 0 var(--accent-blue)}
.opt.sel .opt-k{background:var(--accent-blue);color:var(--bg-page);border-color:var(--accent-blue)}
.opt.sel::after{content:"Selected";margin-left:auto;color:var(--accent-blue);font-size:12px;font-weight:800;white-space:nowrap;padding-top:3px}
.opt.good{border-color:var(--state-correct)}
.opt.bad{border-color:var(--state-incorrect)}
.opt.locked{cursor:default;pointer-events:none}
/* ---------- drag & drop ---------- */
.dnd{display:grid;grid-template-columns:1fr 300px;gap:14px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-content:start}
.zone{
  background:var(--bg-surface-2);border:1.5px dashed var(--border);border-radius:8px;
  padding:10px;min-height:74px;display:flex;flex-direction:column;gap:8px;
}
.zone.over{border-color:var(--accent-green);background:var(--tint-green-07)}
.zone-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.bank{
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start;
}
.bank-t{font-size:13px;font-weight:800;color:var(--text-secondary);letter-spacing:.04em}
.chip{
  background:var(--bg-chip);border:1px solid var(--border);border-radius:7px;
  padding:9px 12px;font-size:14.5px;cursor:grab;user-select:none;min-height:44px;
  display:flex;align-items:center;gap:8px;
}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--accent-blue);box-shadow:inset 3px 0 0 var(--accent-blue)}
.chip .pickword{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent-blue);text-transform:uppercase}
.chip.dragging{opacity:.55}
.zone .chip{cursor:grab}
/* ---------- order / rank ---------- */
.orderlist{display:flex;flex-direction:column;gap:8px}
.orow{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:48px;
}
.orow.dragover{border-color:var(--accent-green)}
.orow .pos{
  flex:0 0 30px;height:30px;border-radius:6px;background:var(--bg-chip);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-secondary);
}
.orow .ot{flex:1;font-size:15px}
.orow .mv{display:flex;gap:6px}
.mv button{
  min-width:44px;min-height:44px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg-hover);color:var(--text-primary);font-size:16px;cursor:pointer;font-weight:800;
}
.mv button:hover{background:var(--bg-hover-2)}
/* ---------- match / fill ---------- */
.pair{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1.2fr);gap:10px;align-items:center;margin-bottom:10px}
.pair .pt{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:44px;display:flex;align-items:center}
select.fill-sel,select.pair-sel{
  background:var(--bg-page);color:var(--text-mono);border:1px solid var(--border);
  border-radius:6px;padding:9px 10px;font-size:14px;min-height:44px;max-width:100%;
}
.filltext{font-size:16px;line-height:2.05}
.filltext select{margin:0 3px}
.bankchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bankchips .chip{cursor:default;min-height:44px;padding:6px 10px;font-size:13.5px}
/* ---------- query editor ---------- */
.qed{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qed-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-white-02)}
.qed-bar .prompt{color:var(--accent-green);font-weight:800;font-size:13px}
.qed textarea{
  width:100%;min-height:110px;background:transparent;border:none;color:var(--text-mono);
  font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;
}
.qed textarea:focus-visible{outline:2px solid var(--accent-blue);outline-offset:-2px}
.copyrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
/* ---------- decision steps ---------- */
.stepbadge{
  display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber-12);
  color:var(--accent-amber);border:1px solid var(--tint-amber-40);
  border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:800;letter-spacing:.05em;margin-bottom:8px;
}
/* ---------- triage queue ---------- */
.alertq{display:flex;flex-direction:column;gap:12px}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.alert-card .at{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-card .at .prio{font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;padding:1px 7px;color:var(--text-secondary)}
.alert-card .ab{color:var(--text-secondary);font-size:14px;margin:6px 0 10px}
.alert-card .asel{display:flex;flex-wrap:wrap;gap:8px}
.asel label{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;
  background:var(--bg-page);padding:8px 12px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.asel label:hover{background:var(--bg-hover)}
.asel input{accent-color:var(--accent-blue)}
.asel label.on{border-color:var(--accent-blue);background:var(--tint-blue-10)}
/* ---------- hint ---------- */
.hintp{
  border:1px solid var(--tint-amber-45);border-left:3px solid var(--accent-amber);
  background:var(--tint-amber-07);border-radius:8px;padding:10px 14px;margin:12px 0;
  color:var(--text-primary);font-size:15px;
}
.hintp .ht{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
/* ---------- feedback ---------- */
.feed{border:1px solid var(--border);border-left:3px solid var(--state-correct);border-radius:var(--radius);background:var(--bg-surface);margin:16px 0;overflow:hidden}
.feed-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.feed.ok{border-left-color:var(--state-correct)}
.feed.ok .feed-h{color:var(--state-correct);background:var(--tint-green-08)}
.feed.part{border-left-color:var(--state-partial)}
.feed.part .feed-h{color:var(--state-partial);background:var(--tint-amber-08)}
.feed.bad{border-left-color:var(--state-incorrect)}
.feed.bad .feed-h{color:var(--state-incorrect);background:var(--tint-red-08)}
.feed.skipf{border-left-color:var(--state-skipped)}
.feed.skipf .feed-h{color:var(--state-skipped);background:var(--tint-grey-08)}
.feed-b{padding:12px 16px}
.creditline{font-weight:800;margin:2px 0 10px;font-size:14.5px}
.itms{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.itm{display:flex;gap:9px;align-items:flex-start;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px}
.itm .ic{font-weight:800;flex:0 0 auto}
.itm.correct{color:var(--state-correct)}
.itm.wrong{color:var(--state-incorrect)}
.itm.missed{color:var(--state-skipped)}
.itm .why{color:var(--text-secondary);font-size:13.5px}
.feed .explain{font-size:15px;margin:8px 0}
.feed .study{
  margin-top:10px;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;
  color:var(--text-secondary);font-size:14px;
}
.feed .study b{color:var(--accent-amber)}
.canon{margin-top:10px}
/* ---------- paused overlay ---------- */
.pauseov{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:var(--bg-page-ov);
}
.pauseov .pcard{
  background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);
  padding:26px 34px;text-align:center;color:var(--state-paused);box-shadow:var(--shadow);max-width:440px;
}
.pauseov .pcard .big{font-size:20px;font-weight:800;margin:10px 0 6px}
.pauseov .pcard .sub{color:var(--text-secondary);font-size:14px;margin-bottom:16px}
/* ---------- intro ---------- */
.intro-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.intro-head .t{font-size:20px;font-weight:800;flex:1 1 320px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px}
.facts .f{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary)}
.facts .f b{color:var(--text-primary)}
.kw-theme{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--bg-surface-2)}
.kw-theme .kt{color:var(--accent-blue);font-weight:800;font-size:13.5px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kw-items{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.kw-items .chip{cursor:default;min-height:44px;padding:4px 11px;font-size:13px;background:var(--tint-blue-07)}
.rules{margin:6px 0 0;padding:0;list-style:none}
.rules li{
  position:relative;padding:7px 0 7px 4px;font-size:15px;color:var(--text-primary);
  border-bottom:1px dashed var(--border);
}
.rules li:last-child{border-bottom:none}
.rules li .ric{color:var(--accent-green);font-weight:800;margin-right:7px}
.center{display:flex;justify-content:center;margin-top:18px}
/* ---------- review / results ---------- */
.skiprow{display:flex;align-items:center;gap:12px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0}
.skiprow .st{flex:1;font-size:14.5px}
.skiprow .sicon{color:var(--state-skipped);font-weight:800}

var INTRO = {"learn": ["This is the expert tier of the DET0329 series — the ATT&CK detection strategy for T1490 — Inhibit System Recovery. Here the exercises mirror senior-analyst decisions: multiple platforms at once, signals that contradict each other, incomplete evidence, and actions whose mistakes cost real money. You will be asked not just 'what fired' but 'what wins' — and sometimes the winning move is to gather more evidence instead of acting.", "The scenarios span the whole strategy: AN0933 process chains on Windows, AN0934 Linux recovery-file destruction, AN0935 snapshot removal on ESXi, AN0936 wipe sequences on network devices, and AN0937 cloud chains where backup policies are disabled before snapshots are deleted. You will tune CommandSequenceWindow and UserAgent under pressure, write a CloudTrail hunt query with negations, and defend a coverage matrix that includes what DET0329 cannot see: commandless COM-based shadow deletion, macOS, and Containers.", "Who works at this level? The senior SOC analyst deciding escalation during a live shift, the incident commander sequencing response across platforms, the detection engineer defending tuning decisions in a post-incident review, the threat hunter proving a negative for the CISO, and the CTI analyst writing the report that connects vssadmin deletions to a ransomware playbook. The exercises place you in those chairs directly.", "A warning about this tier: about one correct answer in three is counter-intuitive. Widely shared 'best practices' fail in specific contexts here. Some correct actions carry a real cost — an isolation that interrupts authentication, a query that must not tip off the operator — and you must accept and manage that cost rather than avoid it. Read every artefact; several include realistic noise that points nowhere, and at least one leaves out a fact you must reason around explicitly.", "The timer gives you 60 minutes for 16 exercises. Use the Check auto-pause: every submission buys unlimited feedback-reading time. Manage skips deliberately — unanswered exercises are excluded from the score, but the senior habit is to attempt everything and revisit."], "keywords": [{"theme": "Cross-platform chains", "items": ["AN0933 Windows chains", "AN0935 ESXi snapshot.removeall", "AN0937 disable-then-delete cloud chains", "ransomware pre-encryption stage", "impact assessment"]}, {"theme": "Tuning under pressure", "items": ["CommandSequenceWindow", "UserAgent allow-lists", "TimeWindow bursts", "ResourceType scoping", "ParentProcessContext", "TargetVMNames"]}, {"theme": "Coverage and compensation", "items": ["COM-based shadow deletion gap", "macOS gap", "Containers gap", "compensating detections", "immutable off-site backups"]}, {"theme": "Senior decisions", "items": ["escalate vs act", "gather more evidence", "cost-bearing isolation", "conflicting signal resolution", "attribution caution"]}, {"theme": "Cloud forensics", "items": ["AWS:CloudTrail sequences", "versioning suspension", "DeleteSnapshot / DeleteVolume", "DC0022 Cloud Storage Deletion", "identity correlation"]}, {"theme": "Normalisation engineering", "items": ["case-folding command lines", "flag tokenisation", "cross-source mapping to DC0032/DC0049", "sequence matchers", "identity mapping"]}], "rules": ["The pass mark is 70%, computed over the exercises you answered with Check.", "Exercise types in this file: a decision tree, a filtered log viewer, drag & drop, matching, fill-in-the-blank, ordering, an alert queue, a SIEM query editor (one), spot-the-mistake, and a few multiple-choice questions.", "The timer counts down from 60 minutes. Manual Pause hides the exercise and stops the timer; Resume brings it back.", "Check auto-pauses the timer while you read the feedback; it resumes on Next.", "Multi-answer exercises use partial credit: (correct − wrong) / total. Selecting everything scores zero.", "One hint per exercise costs 10% of that exercise's credit. Hints only restate constraints — they never reveal var EXERCISES = [{"id": "X01", "type": "decision", "title": "Four-step call: the Sunday morning chain", "summary": "CloudTrail + Windows fire together", "scenario": "Sunday 02:14. The on-call phone lights up twice in the same minute. CloudTrail (AN0937): an unknown identity suspended versioning on the backup bucket, then DeleteSnapshot on 12 production volumes at 02:13. Windows (AN0933): three application servers ran vssadmin delete shadows /all /quiet at 02:11, parents are cmd.exe from a scheduled task created at 01:58. The CISO needs a decision in 10 minutes. Work the four steps — each decision depends on how you read the previous one.", "question": "Make the correct call in all four steps.", "hint": "The constraint you may miss: the cloud and Windows events share no identity — the cloud actor is unknown, the Windows task runs as a local service account. Coordination is inferred from timing and target choice, not from a shared username.", "explanation": "Step 1: the combination across platforms is a coordinated T1490 preparation stage — disabling cloud protection while killing local shadow copies is the textbook pre-encryption sequence, and the 1–3 minute spacing proves orchestration. Step 2: the action that protects the organisation most is revoking/suspending the compromised cloud identity's delete permissions and locking the backup bucket (deny-delete SCP + versioning re-enable) — shutting down all VMs causes org-wide downtime without stopping an actor who already holds credentials. Step 3: export CloudTrail logs to a read-only account before the attacker can cover their tracks — evidence preservation beats the comfort of 'we have it in the console'. Step 4: declare a major incident with IR engaged; the window between recovery-inhibition and encryption is typically minutes to hours, and the next move is probably encryption. All four steps chain: misread step 1 as two unrelated glitches and you will under-react everywhere after.", "study": "Pre-encryption windows are short. Protect identities and backups first, VMs second.", "steps": [{"question": "Step 1: what does the cross-platform combination tell you?", "options": [{"t": "A coordinated T1490 preparation stage — likely pre-encryption", "ok": true}, {"t": "Two unrelated glitches that share a timestamp by chance", "ok": false}, {"t": "A backup-product bug propagating through the estate", "ok": false}]}, {"lead": "The CISO asks: 'What do we do in the next ten minutes that protects us most?'", "question": "Step 2: which action protects the organisation most?", "options": [{"t": "Suspend the cloud identity's delete permissions and lock the backup bucket", "ok": true}, {"t": "Shut down every VM in the estate", "ok": false}, {"t": "Email all staff to change their passwords", "ok": false}]}, {"lead": "The bucket is locked. Now the evidence question.", "question": "Step 3: how do you preserve the cloud evidence?", "options": [{"t": "Export CloudTrail logs to a read-only account now", "ok": true}, {"t": "Screenshot the console and move on", "ok": false}, {"t": "Delete the bucket so the attacker finds nothing", "ok": false}]}, {"lead": "Evidence is safe. The CISO wants the severity call.", "question": "Step 4: what is the severity call and next move?", "options": [{"t": "Declare a major incident, engage IR — encryption is likely the next stage", "ok": true}, {"t": "Log it as a low-severity anomaly for Monday review", "ok": false}, {"t": "Pay the ransom preemptively", "ok": false}]}]}, {"id": "X02", "type": "logview", "title": "Lifecycle policy or adversary — resolve the conflict", "summary": "Two deletion patterns in one CloudTrail day", "scenario": "You are reviewing a full day of CloudTrail after an anonymous tip. Two deletion patterns exist. Pattern A runs at 23:00 every day, deletes 30+ expired snapshots across accounts, and its UserAgent matches the documented 's3-lifecycle' service. Pattern B ran once at 14:37, deleted exactly three production-vault snapshots, and 90 seconds earlier an UpdateBackupPolicy call came from an unknown UserAgent from a new IAM role. The tip claims 'mass snapshot deletion = attack'. Use the filter box; the noise is deliberate.", "question": "Which conclusion is correct?", "hint": "The constraint: lifecycle deletions are scheduled, broad, and identity-stable. Ask which pattern correlates with a protection change immediately before it.", "explanation": "Pattern B is the alert; Pattern A is noise. The AN0937 logic is a chain: disabling backup policies or versioning FOLLOWED BY deletion calls. Pattern B has exactly that shape — UpdateBackupPolicy from an unknown UserAgent and a new role, then three targeted prod-vault deletions 90 seconds later. Pattern A is broad, scheduled, identity-stable, and disables nothing first; mass volume alone proves nothing. The tip fails because it pattern-matches on volume of deletions instead of on the disable-then-delete sequence — the same mistake junior analysts make with vssadmin 'list'. Correct handling: freeze the new role's permissions, export the CloudTrail window, and escalate Pattern B only.", "study": "The chain (disable → delete) and the identity (unknown role, unknown UA) beat raw counts.", "log": ["00:03:11 s3-lifecycle UA DeleteSnapshot x34 across accounts (scheduled expiry)", "08:15:02 aws-backup UA UpdateBackupPolicy (documented retention change)", "14:35:27 unknown UA AssumeRole role/prod-ops-tmp-042 (new role, 20 min old)", "14:36:04 unknown UA UpdateBackupPolicy vault/prod-vault-01 (protection weakened)", "14:37:33 unknown UA DeleteSnapshot prod-vault-01 snap-0f11 snap-0f12 snap-0f13", "23:00:00 s3-lifecycle UA DeleteSnapshot x31 across accounts (scheduled expiry)"], "options": [{"t": "Pattern B is the AN0937 chain — freeze the role, export logs, escalate it only", "ok": true}, {"t": "Both patterns are the attack — the tip says mass deletion", "ok": false}, {"t": "Neither — deletion calls without encryption are never attacks", "ok": false}, {"t": "Pattern A is the attack — it deletes far more snapshots", "ok": false}]}, {"id": "X03", "type": "dnd", "title": "Build the coverage matrix", "summary": "Behaviour → analytic, or into the gap", "scenario": "The detection engineering review asks for a one-page coverage matrix of DET0329. Seven observed behaviours from recent threat reports must be mapped to the analytic that covers them — or into the 'Not covered' column with a compensating control. Two behaviours are known gaps: commandless COM-based shadow deletion (IVssBackupComponents, seen in the Diavol family) and macOS Time-Machine destruction. Place all seven.", "question": "Drag each behaviour to the analytic that covers it — or to 'Not covered'.", "hint": "The constraint: five analytics cover five platforms. Anything that never produces a command line, API call, or watched log event on those platforms cannot be covered by this strategy.", "explanation": "The matrix completes as: wbadmin delete catalog → AN0933 (Windows utility list); chattr +i on snapshot paths → AN0934 (Linux recovery tampering); vim-cmd vmsvc/snapshot.removeall → AN0935 (ESXi hostd); erase → format → reload → AN0936 (network sequence); DeleteDBCluster after policy change → AN0937 (cloud chain, DC0022); COM IVssBackupComponents deletion → NOT covered — no command line exists for CommandLinePattern, compensate with VSS service/API monitoring; macOS Time Machine destruction → NOT covered — no macOS analytic exists in the strategy. The matrix is the artefact that justifies compensating detections to the CISO: every 'not covered' row needs an owner and a plan.", "study": "Every coverage matrix row needs: behaviour, covering analytic or gap, compensating control, owner.", "zones": [{"id": "Z1", "t": "AN0933 (Windows)"}, {"id": "Z2", "t": "AN0934 (Linux)"}, {"id": "Z3", "t": "AN0935 (ESXi)"}, {"id": "Z4", "t": "AN0936 (Network)"}, {"id": "Z5", "t": "AN0937 (IaaS)"}, {"id": "Z6", "t": "NOT covered — compensating control needed"}], "items": [{"id": "I1", "t": "wbadmin delete catalog -quiet on a file server", "zone": "Z1"}, {"id": "I2", "t": "chattr +i on LVM snapshot config paths", "zone": "Z2"}, {"id": "I3", "t": "vim-cmd vmsvc/snapshot.removeall in hostd", "zone": "Z3"}, {"id": "I4", "t": "erase → format → reload from privilege-15 AAA", "zone": "Z4"}, {"id": "I5", "t": "DeleteDBCluster after backup-policy change in CloudTrail", "zone": "Z5"}, {"id": "I6", "t": "Shadow deletion via COM IVssBackupComponents (no command line)", "zone": "Z6"}, {"id": "I7", "t": "Time Machine backups destroyed on macOS hosts", "zone": "Z6"}]}, {"id": "X04", "type": "qcm", "title": "The auto-isolate rule that would have failed", "summary": "Best practice meets the backup window", "scenario": "A consultant recommends: 'Auto-isolate any host that executes vssadmin delete commands — speed beats precision.' The team wants to deploy it. One problem: every night 01:00–03:00, the backup suite runs diskshadow and vssadmin delete shadows on 14 backup servers as part of its rotation, documented and agent-parented. During last quarter's incident, the actual attacker ran wbadmin from PowerShell on two application servers at 15:42.", "question": "Why is the auto-isolate best practice wrong here, and what is the better design?", "hint": "The constraint: the estate runs 14 nightly agent-parented deletion jobs by design. What would the rule do at 01:05 tonight?", "explanation": "The rule would auto-isolate 14 backup servers every night — destroying the backup service exactly when an attacker is most likely to strike, and training the team to distrust the alert. The better design keys on context, not on the command alone: auto-isolate only when the parent chain is not the allow-listed backup agent, when the source is outside the change window, or when multiple recovery features are hit together (chained signals — command plus registry change plus catalog deletion). The near-miss 'auto-isolate only application servers' still misses the DC case and still fires on any future backup-suite expansion. Speed and precision must both come from context, not from the command string.", "study": "Containment rules need the same mutable elements as the detection: parent, window, and chained signals.", "options": [{"t": "It would isolate the 14 backup servers nightly — key containment on parent, window, and chained signals instead", "ok": true}, {"t": "It is right — any vssadmin delete justifies instant isolation", "ok": false}, {"t": "Auto-isolate only application servers and nothing else", "ok": false}, {"t": "Never isolate anything for T1490 alerts", "ok": false}]}, {"id": "X05", "type": "triage", "title": "Five alerts, real costs on every wrong move", "summary": "The shift you remember", "scenario": "Ransomware intelligence sharing just flagged a campaign that starts with T1490 behaviour. Five alerts sit in your queue, each with a business cost attached to over-reaction or under-reaction. The CISO is watching the bridge. Choose the correct action for each.", "question": "Choose the correct action for each of the five alerts.", "hint": "The constraint on every row: an allow-list, a ticket, or an identity is only as good as the fact behind it — check whether the referenced thing still exists, still covers this scope, or was reached the normal way.", "explanation": "Alert 1: escalate — the ParentProcessContext allow-list names a parent chain that no longer exists on the host; the agent was decommissioned last month, so something is spoofing a retired identity to inherit its trust (CMDB drift is the signal that turns a benign-looking parent into evidence). Alert 2: preserve before you power off — the wipe is already running, so cutting the session's write access and taking read-only disk snapshots stops the damage AND keeps evidence, while an instant power-off destroys volatile session state and tells you nothing about how the attacker got in. Alert 3: escalate — the role name is allow-listed, but it was reached through the break-glass user without MFA instead of the automation's OIDC path; the authentication path, not the name, is what the trust was granted to. Alert 4: escalate on the behaviour and keep attribution as an unconfirmed assessment — T1490 preparation is actionable regardless of which crew it is, and waiting for attribution burns the only window that matters. Alert 5: verify the ticket's scope really covers chattr on /boot, then close as planned — the near-miss is closing on ticket presence alone. Every call prices both error types.", "study": "Allow-lists, tickets, and identities decay — verify the fact behind the trust before you lean on it.", "alerts": [{"title": "ALERT-1 — SRV-EXEC-04 — vssadmin delete shadows from the retired backup agent", "prio": "HIGH", "body": "02:00 Sunday. Parent: C:\\Program Files\\StoreGuard\\sgagent.exe — the exact parent chain your ParentProcessContext allow-list names. Problem: CMDB and EDR inventory show StoreGuard was uninstalled from this host last month; the nightly job now runs BackupBee. No ticket exists for tonight.", "options": [{"t": "Escalate — the allow-listed parent no longer exists on this host; something is spoofing a retired identity", "ok": true}, {"t": "Close — the parent matches the allow-list, so it is the backup job", "ok": false}, {"t": "Close — 02:00 Sunday is the documented backup window", "ok": false}]}, {"title": "ALERT-2 — SRV-LNX-9 — shred of /etc/fstab backup and dd over /boot/efi by root", "prio": "CRITICAL", "body": "No ticket. Root ran shred on the fstab backup and dd is now writing zeros to /boot/efi. The host runs the payment gateway; the application owner is on the bridge demanding an immediate power-off 'to stop the wipe'. A power-off also destroys volatile evidence and in-memory session state.", "options": [{"t": "Cut the session's write access and snapshot the disks read-only first, then escalate — do not power off yet", "ok": true}, {"t": "Power the host off immediately as the owner demands", "ok": false}, {"t": "Close — fstab backups rotate hourly, nothing is lost", "ok": false}]}, {"title": "ALERT-3 — AWS — DeleteDBCluster on archive-prod by allow-listed role archive-rotator", "prio": "HIGH", "body": "The role IS on the UserAgent allow-list. But CloudTrail shows the role was assumed through the break-glass admin user with MFA skipped — the automation always authenticates through its own OIDC path. The session started 12 minutes before the deletion.", "options": [{"t": "Escalate — the automation identity was reached through the wrong authentication path; freeze the break-glass user and export the session window", "ok": true}, {"t": "Close — the role is on the allow-list, so the deletion is automation", "ok": false}, {"t": "Delete the archive cluster's remaining snapshots so the attacker cannot reach them", "ok": false}]}, {"title": "ALERT-4 — SRV-APP-07 — vssadmin delete shadows from unsigned 'VeeamBackupX.exe' (dropped 20 min ago)", "prio": "HIGH", "body": "The binary name mimics a backup product, is unsigned, and was written to disk 20 minutes before it ran. Threat intel says T1490 followed by T1486 within 30 minutes is the current campaign playbook of a ransomware crew; a partner reported the same binary yesterday. Your CISO asks: 'Is this that group?'", "options": [{"t": "Escalate on the behaviour now; report attribution only as an unconfirmed assessment — it does not change the immediate actions", "ok": true}, {"t": "Hold escalation until attribution is confirmed — it might be a real backup product", "ok": false}, {"t": "Close — backup products are allowed to delete shadow copies", "ok": false}]}, {"title": "ALERT-5 — SRV-LNX-3 — chattr +i /boot by root", "prio": "MEDIUM", "body": "Root ran chattr +i on /boot at 21:58 inside maintenance ticket CHG-2210 (kernel hardening, 21:00–23:00, approved by the platform lead).", "options": [{"t": "Verify ticket scope covers /boot chattr, then close as planned", "ok": true}, {"t": "Close — a ticket exists", "ok": false}, {"t": "Escalate as ransomware preparation", "ok": false}]}]}, {"id": "X06", "type": "query", "title": "Query editor: the CloudTrail hunt with negations", "summary": "Senior query, five required elements", "perTimeSec": 480, "scenario": "Threat-hunt day. Objective, stated at business level: produce evidence, robust enough for the post-incident review, that shows any cloud snapshot/vault deletion that was NOT done by the three documented automation identities AND happened within 30 minutes of a backup-protection change. Environment: Splunk-style search over source=aws:cloudtrail; fields eventName, userAgent, userIdentity; subsearches use square brackets; NOT excludes; earliest sets the time range. The normaliser checks five required elements, case-insensitively, ignoring extra spaces. Warning: one plausible-looking command family (format/erase/reload) belongs to network devices and must NOT appear.", "question": "Write the hunt query containing all five required elements, then press Check.", "hint": "The constraint you might skip: 'not the documented automation' must appear as an exclusion on the userAgent field, and the disable-change correlation must be visible either as a subsearch or as an explicit eventName group.", "explanation": "The canonical query is: source=aws:cloudtrail eventName IN (DeleteSnapshot, DeleteVolume, DeleteDBCluster, DeleteBucket) NOT userAgent IN (\"veeam-cloud-worker\", \"aws-backup\", \"snapshot-janitor\") [search source=aws:cloudtrail eventName IN (PutBackupPolicy, UpdateBackupPolicy, PutBucketVersioning) earliest=-30m] | correlate by userIdentity within 30m. Element by element: the cloud source; the deletion event family (DC0049/DC0022); the negation that removes the three documented automation identities — this is the UserAgent mutable element expressed as a query; the correlation subsearch for protection-weakening calls (the AN0937 chain precondition); and the 30-minute window that bounds causality. The trap: adding format/erase/reload drags network-device behaviour into a cloud query — a sign you pattern-matched instead of reading the environment.", "study": "Senior queries encode the analytic: chain precondition + negation + causal window.", "editorPrompt": "search", "editorNote": "Splunk-style with subsearches. Five required elements, checked case-insensitively.", "placeholder": "source=aws:cloudtrail ... NOT ... [search ...]", "elements": [{"re": "(source\\s*=\\s*aws:cloudtrail|index\\s*=\\s*cloudtrail)", "label": "Queries the CloudTrail source", "why": "Cloud API evidence lives in CloudTrail (AN0937's log source)."}, {"re": "(deletesnapshot|deletevolume|deletedbcluster|deletebucket)", "label": "Includes the deletion event family", "why": "DeleteSnapshot/DeleteVolume/DeleteDBCluster/DeleteBucket are the destructive outcomes (DC0049, DC0022)."}, {"re": "(not\\s*\\(?\\s*useragent|useragent\\s*(!=|not in)|-useragent)", "label": "Negates the documented automation user agents", "why": "The UserAgent mutable element becomes an explicit exclusion of known automation identities."}, {"re": "(putbackuppolicy|updatebackuppolicy|putbucketversioning|versioning|disable)", "label": "Correlates the protection-weakening change", "why": "AN0937 is a chain: disable backup protection first, delete second."}, {"re": "(30m|30 minutes|earliest|window|within)", "label": "Bounds the correlation window", "why": "Causality needs a time frame — 30 minutes per the objective."}], "bad": [{"re": "(format|erase|reload)", "label": "Includes network-device commands", "why": "erase/format/reload belong to AN0936, not to a CloudTrail hunt."}, {"re": "eventcode\\s*=", "label": "Uses host-SIEM fields in a cloud query", "why": "CloudTrail has no EventCode field — that belongs to Sysmon data."}], "canonical": "source=aws:cloudtrail\neventName IN (DeleteSnapshot, DeleteVolume, DeleteDBCluster, DeleteBucket)\nNOT userAgent IN (\"veeam-cloud-worker\", \"aws-backup\", \"snapshot-janitor\")\n[search source=aws:cloudtrail eventName IN (PutBackupPolicy, UpdateBackupPolicy, PutBucketVersioning) earliest=-30m]\n| correlate by userIdentity within 30m"}, {"id": "X07", "type": "order", "title": "Sequence the response when three platforms fire at once", "summary": "Incident commander's ordering", "scenario": "Windows file servers, ESXi hosts, and the cloud backup account all fired within minutes of each other. You are incident commander. Five candidate actions sit in your runbook, but their order decides whether backups survive the hour. Sequencing logic: cheap verifications first, protection of the crown jewels before containment theatre, evidence before the attacker covers tracks, containment before rebuild.", "question": "Put the five actions in the correct order.", "hint": "The constraint: rebuild is last, and evidence export must happen while the attacker's access is being cut — not after the estate is offline.", "explanation": "Correct order: (1) confirm scope read-only across the three platforms — 10 minutes that prevent a mis-scoped containment; (2) protect backup infrastructure — lock snapshots, apply deny-delete permissions on the cloud account, cut the compromised identity; (3) isolate affected hosts — now that backups are safe, containment cannot be punished by data loss; (4) export and preserve cross-platform evidence (CloudTrail, hostd, Sysmon) while systems are frozen; (5) plan and execute rebuild from known-good images. The two classic orderings that fail: isolating first (attackers then destroy backups out of spite) and rebuilding early (destroying evidence and possibly reintroducing the attacker's persistence if images are tainted).", "study": "Sequence = verify → protect → contain → preserve → rebuild.", "items": [{"id": "O1", "t": "Confirm scope read-only across Windows, ESXi, and cloud"}, {"id": "O2", "t": "Protect backup infrastructure: lock snapshots, deny-delete on the cloud account"}, {"id": "O3", "t": "Isolate affected hosts from the network"}, {"id": "O4", "t": "Export and preserve cross-platform evidence"}, {"id": "O5", "t": "Plan and execute rebuild from known-good images"}], "correct": ["O1", "O2", "O3", "O4", "O5"]}, {"id": "X08", "type": "multi", "title": "Adversary or admin mistake — select the signals that decide", "summary": "Resolve the conflicting picture", "scenario": "A file server ran 'vssadmin delete shadows /all /quiet' at 15:42 on a Wednesday. The server owner insists it was a script mistake. The evidence file contains eight observations — some support the adversary hypothesis, some support the mistake hypothesis, one is irrelevant. Select every observation that supports ADVERSARY activity.", "question": "Select all observations that support the adversary hypothesis.", "hint": "The constraint: scheduled work repeats on schedule with stable identity and parent; adversaries improvise, chain, and arrive from unusual parents. Timestamps of a single event are weak alone.", "explanation": "Adversary-supporting: (1) the parent is powershell spawned by WINWORD.EXE — no maintenance chain starts in an Office document; (2) the same minute, bcdedit disabled automatic recovery — one destructive action is noise, a chain of recovery-feature attacks is intent; (3) the task that launched the chain was created 44 minutes earlier by a VPN session from an unusual country — staging behaviour; (4) the local admin account used had its password reset 3 days ago and had never run vssadmin before — a fresh-credential pattern that M1018 (User Account Management) discipline exists to catch. Mistake-supporting (do NOT select): the server's backup agent legitimately deletes shadows monthly — but on the 1st at 02:00 with agent parents, not today; the command matches a 2019 runbook page — but that runbook was retired. Irrelevant: the server's uptime. Four selects, four rejects — partial credit punishes guessing.", "study": "Chained signals and novelty (new parent, new account behaviour) outweigh single-event timestamps.", "options": [{"t": "Parent chain: WINWORD.EXE → powershell.exe → vssadmin.exe", "ok": true}, {"t": "Same minute: bcdedit disabled automatic recovery on the same host", "ok": true}, {"t": "The launching task was created 44 minutes earlier via VPN from an unusual country", "ok": true}, {"t": "The admin account used had never run vssadmin before and was reset 3 days ago", "ok": true}, {"t": "The backup agent deletes shadows monthly on the 1st at 02:00 with agent parents", "ok": false}, {"t": "A retired 2019 runbook contained this exact command", "ok": false}, {"t": "The server has 214 days of uptime", "ok": false}]}, {"id": "X09", "type": "qcm", "title": "hostd says removeall — vCenter says snapshots still there", "summary": "Incomplete information reasoning", "scenario": "hostd on PROD-CL-02 logged vmsvc/snapshot.removeall for 40 VMs. The on-demand vCenter inventory query, run 6 minutes later, shows 31 of the 40 VMs still WITH snapshots intact, 9 with snapshots gone. The disk array reports no abnormal I/O. The executive dashboard already shows 'RANSOMWARE PRE-ENCRYPTION — 40 VMs affected'. You must correct or confirm the dashboard.", "question": "What is the soundest interpretation and action?", "hint": "The constraint: two sources disagree — one logged an attempt, one observed state. Which source is authoritative for what actually happened to each VM?", "explanation": "The sound interpretation: the removeall command was issued broadly but only partially succeeded — current VM state (vCenter inventory + array I/O) is authoritative, not the command log. Nine VMs lost snapshots; 31 did not, possibly due to locks, consolidation status, or the session being cut. The correct action: correct the dashboard to '9 of 40 affected', freeze further deletion on the cluster, and pull per-VM tasks/events from vCenter to learn why the majority resisted — that detail may reveal the attacker's access level or an abort. The near-misses: 'the analytic is wrong' (it correctly logged the ATTEMPT — AN0935 watches behaviour, not outcome) and '40 confirmed wiped' (contradicted by observed state). Behavioural detections log attempts; impact claims need state verification.", "study": "Detections fire on behaviour; impact statements need a state source. Never let a dashboard outrun the evidence.", "options": [{"t": "Attempt partially succeeded — correct to 9 of 40, freeze deletion, pull per-VM task results", "ok": true}, {"t": "The analytic misfired — hostd logs are unreliable", "ok": false}, {"t": "Confirm 40 wiped — the command proves the outcome", "ok": false}, {"t": "Wait for the next inventory sync before any statement", "ok": false}]}, {"id": "X10", "type": "spot", "title": "The junior's tuning change that broke the analytic", "summary": "One line destroyed the meaning", "scenario": "After a noisy week, a junior engineer 'fixed' the AN0933 tuning. Since the change, the analytic still fires — but the review found it now fires on things that are not T1490 and, worse, defines 'rapid' so broadly that the burst logic is meaningless. Four numbered lines of the diff are below; one line is the destructive mistake. Find it.", "question": "Which line number contains the mistake?", "hint": "The constraint: TimeWindow exists to group changes happening in a SHORT interval. Line 1 and line 3 look aggressive but keep the semantics; one line redefines a word.", "explanation": "Line 2 is the mistake: TimeWindow was raised from minutes to 24 hours, which turns 'rapid recovery-feature changes' into 'any changes that day' — the burst semantics the DET0329 page defines for TimeWindow are destroyed, every registry write in a day correlates, and the analytic's precision claim is gone. Line 1 adds -delete to CommandLinePattern (a widening that keeps semantics); line 3 adds a specific parent chain to ParentProcessContext (a scoped allow-list); line 4 keeps Sysmon EventCode=13/14 as the registry source. The lesson: mutable elements have definitions — tuning changes their VALUES, never their meaning. When a value change effectively redefines the element, it is a design change and needs review.", "study": "Tune values, not definitions. TimeWindow = short interval by definition.", "artefacts": [{"label": "ARTEFACT 1 — tuning diff (before → after)", "mono": true, "body": "1  CommandLinePattern: + add \"-delete\" variant to watched destructive flags\n2  TimeWindow: 5 minutes  ->  24 hours   # \"catch slow attacks too\"\n3  ParentProcessContext: + allow-list StoreGuard agent -> diskshadow (weekly window)\n4  registry source: WinEventLog:Sysmon EventCode=13,14 (unchanged)"}], "options": [{"t": "Line 1", "ok": false}, {"t": "Line 2", "ok": true}, {"t": "Line 3", "ok": false}, {"t": "Line 4", "ok": false}]}, {"id": "X11", "type": "fill", "title": "Draft the CTI report sentence", "summary": "Executive wording under scrutiny", "scenario": "You are finalising the CTI report for the board: 'AN0933 would have caught the operator's chain.' Legal wants every technical claim precise. Three blanks carry the weight: the telemetry source, the process chain parent, and the channel that proved the catalog deletion. Choose from the word bank — two distractors are deliberately close.", "question": "Fill the three blanks using the word bank.", "hint": "The constraint: the chain's first visible telemetry was the process creation event; the chain's parent was the interpreter the document spawned; and the outcome proof came from the backup subsystem's own channel.", "explanation": "The completed sentence: 'AN0933 would have caught the operator's vssadmin delete shadows /all /quiet via Sysmon EventCode=1 telemetry, correlating the powershell process chain and the Microsoft-Windows-Backup catalog deletion.' Each blank earns its place: Sysmon EventCode=1 is the DC0032 source that AN0933 actually reads; powershell is the documented parent in this incident (WINWORD spawned it); and Microsoft-Windows-Backup is the channel that carries DC0040 catalog events. 'Registry' and '4688' are the distractors — no registry event was part of this chain, and 4688 belongs to the Security log, not to the Sysmon index AN0933 reads.", "study": "Executives repeat your exact sentence — write each technical claim as if quoted back to you under oath.", "parts": ["AN0933 would have caught the operator's vssadmin delete shadows /all /quiet via ", " telemetry, correlating the ", " process chain and the ", " catalog deletion."], "bank": ["Sysmon EventCode=1", "powershell", "Microsoft-Windows-Backup", "Registry EventCode=13", "4688 Security log", "esxi:hostd"], "answers": ["Sysmon EventCode=1", "powershell", "Microsoft-Windows-Backup"]}, {"id": "X12", "type": "match", "title": "Match each raw telemetry problem to its normalisation fix", "summary": "Detection-engineering plumbing", "scenario": "The AN0933-to-AN0937 pipeline ingests five messy realities. Before any analytic can be reliable, each raw problem needs its normalisation fix. These are the mappings your detection engineers argue about in every onboarding review. Match them.", "question": "Match each raw problem to the normalisation fix that solves it.", "hint": "The constraint: process events from two different Windows sources must land as the same data component; the cloud event name must land as its component; mixed-case command lines defeat exact matching; vendor tools must be identified before negation works.", "explanation": "The fixes: mixed-case command lines ('VSSADMIN Delete Shadows') must be case-folded and flag-tokenised before pattern matching, or CommandLinePattern misses half the variants; EventCode 4688 (Security log) and Sysmon EventCode=1 must both map to DC0032 Process Creation so cross-source correlation works; the vendor 'snapshot-remover' agent string must become a documented UserAgent allow-list entry before any negation logic can exclude it; CloudTrail DeleteSnapshot must map to DC0049 Snapshot Deletion so cloud and ESXi snapshot evidence share one component model; and erase/format sequences need timestamp normalisation to a single clock before the sequence matcher can compute CommandSequenceWindow. Normalisation is why the same analytic can run over different estates.", "study": "Normalise first, detect second — every analytic assumes clean fields.", "left": [{"id": "L1", "t": "Command lines arrive mixed-case with inconsistent flag spacing", "match": "R1"}, {"id": "L2", "t": "Process events come from both Security 4688 and Sysmon EC=1", "match": "R2"}, {"id": "L3", "t": "The vendor 'snapshot-remover' agent appears as an unknown client", "match": "R3"}, {"id": "L4", "t": "CloudTrail DeleteSnapshot must join ESXi snapshot evidence", "match": "R4"}, {"id": "L5", "t": "erase/format arrive with device clocks 3 minutes apart", "match": "R5"}], "right": [{"id": "R1", "t": "Case-fold and tokenise flags before pattern matching"}, {"id": "R2", "t": "Map both sources to DC0032 Process Creation"}, {"id": "R3", "t": "Register it as a UserAgent allow-list entry"}, {"id": "R4", "t": "Map DeleteSnapshot to DC0049 Snapshot Deletion"}, {"id": "R5", "t": "Normalise timestamps to one clock before the sequence matcher"}]}, {"id": "X13", "type": "logview", "title": "Find the real chain in a noisy Sysmon stream", "summary": "Noise, benign lines, and one pre-encryption chain", "scenario": "SRV-WEB-04's morning Sysmon stream contains normal background noise, a benign admin task, and one pre-encryption chain. The on-call flagged 'the wbadmin line' as the whole story. Filter the stream (try 'shadows', 'recoveryenabled', 'Image='), read the parent chains, and answer the state question.", "question": "What is the correct assessment of this stream?", "hint": "The constraint: the benign task and the attacker share utilities but not parents or timing. Count how many DIFFERENT recovery features the suspicious chain touched.", "explanation": "The correct assessment: a pre-encryption chain is in progress and has touched at least three recovery features — (05:14:09) WINWORD-spawned powershell (suspicious parent chain), (05:14:52) diskshadow 'delete shadows all', (05:15:31) registry EventCode=13 setting recoveryenabled to No, (05:16:04) the backup catalog deleted. The 02:00 wbadmin line is benign: agent parent, maintenance window, documented job. Counting features matters: single-feature hits can be maintenance, but three distinct features (shadows, repair config, catalog) from one parent chain is T1490 intent — exactly the correlated-signal logic AN0933 encodes with its TimeWindow burst grouping. The near-miss 'close, the wbadmin explains it' reads the stream backwards.", "study": "Correlated multi-feature hits from one parent chain outrank any single scary line.", "log": ["02:00:01 [Sysmon EC=1] sgagent.exe -> wbadmin.exe \"delete catalog -quiet\" (maintenance window job)", "05:14:09 [Sysmon EC=1] WINWORD.EXE -> powershell.exe -nop -w hidden", "05:14:52 [Sysmon EC=1] powershell.exe -> diskshadow.exe \"delete shadows all\"", "05:15:31 [Sysmon EC=13] HKLM\\BCD00000000 ... recoveryenabled set to 0x0", "05:16:04 [Microsoft-Windows-Backup] Catalog deleted (correlated process: wbadmin.exe via powershell wrapper)", "07:30:00 [Sysmon EC=1] update-agent.exe -> msiexec.exe /qn (nightly patch, benign)", "07:31:12 [Sysmon EC=3] chrome.exe network connect to 203[.]0[.]113[.]9:443 (telemetry, benign)"], "options": [{"t": "Pre-encryption chain in progress — three recovery features hit by one suspicious parent chain", "ok": true}, {"t": "Benign — the wbadmin line is a documented maintenance job", "ok": false}, {"t": "Benign — all utilities are native Windows tools", "ok": false}, {"t": "Isolate the chrome.exe connection — the IP is the real threat", "ok": false}]}, {"id": "X14", "type": "qcm", "title": "The reload that has not happened yet", "summary": "Act on the sequence before completion", "scenario": "22:58. AN0936 telemetry on SW-CORE-01: 'erase' at 22:51, 'format' at 22:54, from privilege-15 AAA session 'netops-svc'. No 'reload' yet. The device is a core switch: a reload drops inter-site links for roughly 8 minutes. The on-call wants to 'wait for reload to confirm' — the previous shift closed a similar alert that way and the device came back fine... because it was a scheduled upgrade. This session has no change ticket.", "question": "What is the correct call?", "hint": "The constraint: erase + format have already destroyed the file system image. The reload only makes the loss visible. Which two facts separate this from last shift's benign case?", "explanation": "The correct call: block or delay the reload (cut the AAA session, apply a control-plane ACL, or schedule an emergency maintenance reload under your own control) while escalating to netops and IR simultaneously. Waiting for the reload 'to confirm' is the trap: erase and format have already wiped the image — the reload adds nothing to the attacker's position but hands them the destruction timing. The two facts that separate this from the benign case: no change ticket, and a service account running an upgrade-shaped command pair it has no reason to run. The near-miss 'shut down the switch remotely' converts an 8-minute risk into a guaranteed outage on your own timing without stopping the actor.", "study": "In sequence analytics, act before the final stage — the last stage is the outcome, not the evidence.", "options": [{"t": "Block/delay the reload and escalate to netops and IR now", "ok": true}, {"t": "Wait for the reload to confirm before acting", "ok": false}, {"t": "Shut down the switch remotely immediately", "ok": false}, {"t": "Close it — the previous identical alert was an upgrade", "ok": false}]}, {"id": "X15", "type": "decision", "title": "The discipline call: evidence first", "summary": "AN0937 fired — but acting now has a price", "scenario": "16:03. AN0937 fires: DisableSnapshotSchedule on ONE non-prod account, UserAgent 'veeam-cloud-worker' (documented automation). Same minute, in a DIFFERENT account: an IAM role assumed from an unusual region. Prod is quiet. The backup admin is on leave. Your access-revocation tooling is global — revoking 'backup automation' pauses every backup job estate-wide for the evening window (the last safe backup window before month-end). Three steps. Senior discipline required.", "question": "Make the correct call in all three steps.", "hint": "The constraint: the two signals live in different accounts with different identities. Global revocation has a real, business-visible cost — and the destructive half of the AN0937 chain has not happened yet.", "explanation": "Step 1: yes, AN0937 fires on the disable call — but the analytic's destructive precondition (a following deletion) is absent so far, and the disable came from the documented automation identity. Step 2: severity is 'verify first' — non-prod scope, known UA, and the IAM signal is in a different account with no shared identity; the correlation is timing-only, which is weak evidence. Step 3: gather more evidence with read-only queries — CloudTrail history for the automation role's recent calls, the unusual-region session's actions, whether any DeleteSnapshot follows within the window — and page the backup automation owner in parallel. Mass revocation now would pause every backup job in the last safe window of the month, a self-inflicted T1490: the organisation would inhibit its own recovery. If a deletion call appears, escalate immediately — the evidence gathering costs minutes, not hours.", "study": "'Do nothing yet' means 'do the cheap confirmations' — never idle. And never let your own response inhibit recovery.", "steps": [{"question": "Step 1: does AN0937 fire, and what is still missing from the chain?", "options": [{"t": "It fires on the disable call; the destructive deletion half is missing so far", "ok": true}, {"t": "It does not fire — scheduled changes never match", "ok": false}, {"t": "It fires and the chain is complete — declare now", "ok": false}]}, {"lead": "The two signals share a minute but not an account or identity.", "question": "Step 2: what is the correct severity stance?", "options": [{"t": "Verify first — non-prod scope, known UA, identity correlation is timing-only", "ok": true}, {"t": "Major incident on the timing correlation alone", "ok": false}, {"t": "Close both — nothing destructive happened", "ok": false}]}, {"lead": "Global revocation would pause every backup job in the month's last safe window.", "question": "Step 3: what do you do?", "options": [{"t": "Read-only evidence gathering now + page the automation owner; escalate if a deletion call appears", "ok": true}, {"t": "Revoke all backup automation globally", "ok": false}, {"t": "Wait until tomorrow's review", "ok": false}]}]}, {"id": "X16", "type": "qcm", "title": "The CISO's question about Windows-only telemetry", "summary": "Strategy-level blind spot", "scenario": "Budget review. The CISO asks: 'We deployed DET0329 telemetry perfectly on all Windows servers. What is the single biggest blind spot we still carry for this strategy?' The T1490 technique page lists Containers, ESXi, IaaS, Linux, Network Devices, Windows, and macOS as platforms; the strategy ships five analytics; the estate runs a large VMware cluster, a growing AWS footprint, and 200 Linux VMs.", "question": "Which answer names the biggest blind spot correctly?", "hint": "The constraint: the strategy's five analytics each depend on their platform's source being deployed. Windows telemetry says nothing about the other four.", "explanation": "The biggest blind spot: every non-Windows platform in the strategy — ESXi, cloud, Linux, network devices — is currently dark, because the four other analytics' sources (hostd, CloudTrail, auditd, device syslog) are not deployed. A ransomware crew that inhibits recovery primarily on ESXi (snapshot.removeall) and in the cloud (vault deletion) would proceed unobserved while the Windows dashboards stay green; modern big-game ransomware hits the hypervisor and the vault first. The near-misses are Windows-internal ('registry-only coverage' — false, Sysmon EC=1 is deployed) or generic ('deploy more RAM'). Strategy-level coverage questions are answered platform by platform, source by source.", "study": "One analytic deployed is not a strategy deployed — coverage is per platform and per source.", "options": [{"t": "The four non-Windows analytics have no telemetry deployed — ESXi, cloud, Linux, and network devices are dark", "ok": true}, {"t": "Windows coverage is registry-only", "ok": false}, {"t": "The strategy cannot ever cover macOS, so it is unusable", "ok": false}, {"t": "Windows servers need more RAM to run Sysmon", "ok": false}]}];

/* ================= UTILITIES ================= */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmt2(x){return (Math.round(x*100)/100).toFixed(2);}
function $(id){return document.getElementById(id);}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function letters(n){var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';return L.charAt(n%26);}

/* Partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= STATE ================= */
var S = {
  phase:'intro',          /* intro | exam | review | results */
  manualPauseStart:null,
  order:[],               /* shuffled exercise indices */
  cur:0,                  /* position in order */
  answered:{},            /* exId -> credit (float) */
  answeredFlags:{},       /* exId -> true (checked) */
  autoPauseStart:null,
  skipped:[],             /* exIds currently in skipped pool */
  everSkipped:{},         /* exId -> true */
  hintUsed:{},            /* exId -> true */
  reviewed:false,         /* visited review screen at end */
  reviewMode:null,        /* exId being answered from review */
  reported:false,
  manualPauseTotal:0,     /* seconds */
  autoPauseTotal:0,       /* seconds */
  user:{name:'',country:'',locale:'en'}
};

var TIMER = {
  total: META.timerSeconds,
  remaining: META.timerSeconds,
  state:'IDLE',           /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  interval:null,
  perEx:0,                /* per-exercise remaining (EXTREMELY HARD query only) */
  perExTotal:0
};

function timerSet(st){
  TIMER.state=st;
  var el=$('tstate');
  if(el){
    var map={
      IDLE:['&#96;','READY','end'],
      RUNNING:['&#9654;','RUNNING','run'],
      PAUSED_MANUAL:['&#10073;&#10073;','PAUSED — manual (press Resume)','pman'],
      PAUSED_AUTO_CHECK:['&#10073;&#10073;','PAUSED — reviewing feedback (resumes on Next)','pauto'],
      ENDED:['&#9632;','ENDED','end']
    };
    var m=map[st]||map.IDLE;
    el.className='tstate '+m[2];
    el.innerHTML='<span aria-hidden="true">'+m[0]+'</span> <span>'+m[1]+'</span>';
    el.setAttribute('aria-label','Timer state: '+m[1]);
  }
}
function timerStartTicks(){
  if(TIMER.interval){return;}
  TIMER.interval=setInterval(function(){
    if(TIMER.state!=='RUNNING'){return;}
    TIMER.remaining-=1;
    if(TIMER.perExTotal>0 && !$('exwrap').classList.contains('hidden')){
      TIMER.perEx=Math.max(0,TIMER.perEx-1);
      var pe=$('perextime');
      if(pe){pe.textContent=fmtClock(TIMER.perEx);}
      if(TIMER.perEx===0){onPerExExpired();}
    }
    if(TIMER.remaining<=0){
      TIMER.remaining=0;
      timerEnded();
    }
    updateHeader();
  },1000);
}
function timerEnded(){
  clearInterval(TIMER.interval);TIMER.interval=null;
  timerSet('ENDED');
  finishExam(true);
}
function updateHeader(){
  $('tclock').textContent=fmtClock(TIMER.remaining);
  var sum=0,cnt=0;
  for(var k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];cnt++;}}
  $('scoreval').innerHTML='<span class="score-sum">'+fmt1(sum)+'</span> <span class="dim">/ '+cnt+'</span>';
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  $('scorepct').textContent=pct+'%';
  var done=S.cur;
  if(S.phase==='review'||S.phase==='results'){done=S.order.length;}
  $('barfill').style.width=Math.round(100*Math.min(1,done/S.order.length))+'%';
}
