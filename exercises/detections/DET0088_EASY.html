<script id="cm-data" type="application/json">{"meta": {"topicId": "det0088", "batch": 1, "title": "DET0088 Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002) — EASY", "difficulty": "easy", "questionCount": 15, "estimatedMinutes": 25, "passMark": 70, "objectId": "DET0088", "objectName": "Backup Software Discovery via CLI, Registry, and Process Inspection (T1518.002)"}, "sev": "EASY", "passMark": 70, "timerSeconds": 1500, "intro": {"learn": "<p>You will learn about <strong>DET0088</strong>, a <strong>Detection Strategy</strong> in the MITRE ATT&amp;CK framework. A detection strategy is a documented plan that says <em>how defenders can see</em> one attacker behaviour. DET0088 watches for <strong>Backup Software Discovery (T1518.002)</strong>, a sub-technique of T1518 Software Discovery, in the <strong>Discovery</strong> tactic.</p>\n<p>Imagine you are an attacker inside a company network. Before you start ransomware, you want to know: does this computer have backup software? Products like Veeam, Acronis, or CrashPlan can bring files back after an attack. So attackers first <em>look</em> for them. That looking is T1518.002.</p>\n<p>In real work, many roles use this object. A <strong>SOC analyst</strong> triages the alerts that DET0088 produces and decides if they are real. A <strong>detection engineer</strong> builds and tunes the three analytics behind it (AN0240, AN0241, AN0242). A <strong>threat hunter</strong> searches logs for the same behaviour before any alert fires. An <strong>incident responder</strong> uses it to predict what the attacker may do next. A <strong>CTI analyst</strong> names this technique in threat-intel reports. The tools involved are simple: SIEM queries, event logs (Windows Security, Sysmon, auditd, the macOS unified log), and EDR consoles.</p>\n<p>In this exam you will learn the basic commands attackers use on Windows, Linux, and macOS, the log sources that record those commands, and the backup products worth watching. You do not need deep experience &mdash; each exercise explains what you need as you go.</p>", "keywords": [{"group": "The ATT&CK objects", "items": ["Detection Strategy DET0088", "Technique T1518.002 — Backup Software Discovery", "Parent technique T1518 — Software Discovery", "Tactic: Discovery", "Analytics AN0240 / AN0241 / AN0242"]}, {"group": "Attacker behaviour", "items": ["Why attackers look for backup software", "Ransomware planning and backups", "Read-only looking, not changing"]}, {"group": "Commands per platform", "items": ["Windows: tasklist, sc query, reg query", "Linux: find, grep, dpkg", "macOS: mdfind, launchctl, system_profiler"]}, {"group": "Backup products to watch", "items": ["Veeam", "Acronis", "CrashPlan", "rsnapshot / duplicity (Linux)", "Time Machine / Carbon Copy Cloner / Backblaze (macOS)"]}, {"group": "Log sources (first look)", "items": ["Windows Security event 4688 — process creation", "Sysmon EID 13/14 — registry key modification", "Sysmon EID 11 — file creation", "auditd on Linux", "unified log on macOS"]}], "how": "<ul>\n<li><strong>Pass mark:</strong> 70%. PASS means you have the basic ideas. FAIL means you should re-read the intro and press Retake.</li>\n<li><strong>Exercise types in this file:</strong> multiple choice, matching pairs, drag and drop, word-bank fill-in, ordering steps, and click-the-log-line.</li>\n<li><strong>Timer:</strong> 25 minutes for 15 exercises. The <strong>Pause</strong> button stops the timer and hides the exercise (a real break). Pressing <strong>Check</strong> also stops the timer automatically while you read the feedback &mdash; it starts again only when you press <strong>Next</strong>.</li>\n<li><strong>Partial credit:</strong> exercises with several items (matching, drag and drop, blanks) give part of the point for each correct item. Wrong items subtract: credit = (H &minus; W) / N.</li>\n<li><strong>Skipped:</strong> you can Skip anything, as many as you need. Before finishing you may return to skipped exercises while time remains. Ones you never answer are simply excluded from the score.</li>\n<li><strong>Hint:</strong> one hint per exercise; it costs 10% of that exercise's credit.</li>\n</ul>\n<p>Press <strong>Start exam</strong> when you are ready.</p>"}, "exercises": [{"id": "E01", "type": "qcm", "summary": "Read about T1518.002 — what the technique means", "scenario": [{"label": "ARTEFACT 1 — Your task for today", "kind": "prose", "text": "You are a new SOC analyst. Your team lead asks you to read the MITRE ATT&amp;CK page for <code>T1518.002</code>. You open it and read the description."}], "question": "What does T1518.002 describe?", "hint": "The word discovery means listing what exists — not deleting or installing.", "explain": "<p>T1518.002 is called <strong>Backup Software Discovery</strong>. It is a child of <strong>T1518 Software Discovery</strong>: the parent covers listing any software, and this sub-technique focuses on backup products. The attacker makes a list of the backup software installed on a system &mdash; for example Veeam or Acronis. Deleting files is a different technique (Data Destruction or Inhibit System Recovery, T1490). Installing software is not discovery either &mdash; discovery only looks and lists.</p>", "options": ["The attacker lists the backup software installed on a system", "The attacker deletes all backup files on the system", "The attacker installs new backup software on the host", "The attacker silently changes backup settings"], "answer": 0, "study": "Read the \"What you will learn here\" section again, then retake."}, {"id": "E02", "type": "qcm", "summary": "Which tactic does read-only looking belong to", "scenario": [{"label": "ARTEFACT 1 — Behaviour note from the shift log", "kind": "prose", "text": "An attacker runs commands on one host. They change nothing. They only want to learn whether backup software exists on that host."}], "question": "Which ATT&CK tactic does this behaviour belong to?", "hint": "When the only goal is to learn something, the tactic name starts with \"Disc\".", "explain": "<p>The tactic <strong>Discovery (TA0007)</strong> covers everything an attacker does to learn about a system: files, users, services, or installed software. Nothing is changed. <strong>Execution</strong> means running their tools, <strong>Collection</strong> means gathering data to steal, and <strong>Impact</strong> means breaking things. Here the attacker only looks, so the answer is Discovery.</p>", "options": ["Execution", "Collection", "Discovery", "Impact"], "answer": 2}, {"id": "E03", "type": "match", "summary": "Match the three analytics to their platforms", "scenario": [{"label": "ARTEFACT 1 — DET0088 fact sheet", "kind": "prose", "text": "DET0088 has three analytics. Each analytic watches a different operating system. Your company uses all three platforms, so you must know which analytic is which."}], "question": "Match each analytic to its platform.", "hint": "AN0241 uses auditd — a Linux logging system. That gives away its platform.", "explain": "<p>DET0088 has one analytic per operating system: <strong>AN0240 watches Windows</strong>, <strong>AN0241 watches Linux</strong>, and <strong>AN0242 watches macOS</strong>. A simple memory hook: 0 = Windows, 1 = Linux, 2 = macOS.</p>", "pairs": [["AN0240", "Windows"], ["AN0241", "Linux"], ["AN0242", "macOS"]]}, {"id": "E04", "type": "dnd", "summary": "Sort three commands to their operating systems", "scenario": [{"label": "ARTEFACT 1 — Three commands seen in logs", "kind": "mono", "lines": ["tasklist", "dpkg -l", "mdfind"]}], "question": "Drag each command onto the platform where it is used.", "hint": "mdfind is the Spotlight search on Apple computers.", "explain": "<p><strong>tasklist</strong> is a Windows command that lists processes. <strong>dpkg</strong> is the Debian/Ubuntu package manager on Linux. <strong>mdfind</strong> is the Spotlight search tool on macOS. Each command only runs on its own platform, so the platform tells you which analytic (AN0240, AN0241, AN0242) can see it.</p>", "slots": [{"id": "win", "label": "Windows (AN0240)"}, {"id": "lin", "label": "Linux (AN0241)"}, {"id": "mac", "label": "macOS (AN0242)"}], "items": [{"id": "i1", "label": "tasklist", "slot": "win"}, {"id": "i2", "label": "dpkg -l", "slot": "lin"}, {"id": "i3", "label": "mdfind", "slot": "mac"}]}, {"id": "E05", "type": "qcm", "summary": "Spot the backup service in a service list", "scenario": [{"label": "ARTEFACT 1 — Service list from one Windows host", "kind": "mono", "lines": ["SERVICE_NAME: OpenSSH Server", "SERVICE_NAME: Veeam Backup Service", "SERVICE_NAME: Spooler", "SERVICE_NAME: W32Time"]}], "question": "Which service name suggests that backup software is installed on this host?", "hint": "One of these names is in the DET0088 vendor examples: Veeam, Acronis, CrashPlan.", "explain": "<p><strong>Veeam Backup Service</strong> names a backup product that DET0088 watches (together with Acronis and CrashPlan). OpenSSH provides remote login, Spooler is the Windows printing service, and W32Time keeps the clock correct &mdash; none of them is backup software.</p>", "options": ["OpenSSH Server", "Veeam Backup Service", "Spooler", "W32Time"], "answer": 1}, {"id": "E06", "type": "fill", "summary": "Read a 4688 event and name the program", "scenario": [{"label": "ARTEFACT 1 — Windows Security log, event 4688", "kind": "mono", "lines": ["WinEventLog:Security  EventCode=4688", "NewProcessName: C:\\Windows\\System32\\reg.exe", "CommandLine: reg query HKLM\\SOFTWARE\\Veeam", "User: CORP\\jsmith"]}], "question": "Complete the sentence about what the event shows.", "hint": "Look at the NewProcessName field in the log line.", "explain": "<p>The <strong>NewProcessName</strong> field shows which program started: <code>reg.exe</code>. The command line also shows it read the registry path of Veeam, a backup vendor. <code>net.exe</code> manages users and shares, <code>ssh.exe</code> is remote login, and <code>mdfind</code> only exists on macOS.</p>", "template": "The process creation event shows that the user ran {0} to read a registry key.", "blanks": ["reg.exe"], "bank": ["reg.exe", "net.exe", "ssh.exe", "mdfind"]}, {"id": "E07", "type": "qcm", "summary": "Why attackers care about backup software", "scenario": [{"label": "ARTEFACT 1 — Message from your CTI team", "kind": "prose", "text": "Your CTI team briefs the class: \"Attackers enumerate backup software early in an intrusion, before any ransomware is deployed.\" A colleague asks why."}], "question": "Why is backup software interesting to an attacker?", "hint": "Think about what stops ransomware from being final.", "explain": "<p>Backups are the last line of defence against ransomware. If the attacker finds and stops them first, victims cannot restore their files, so pressure to pay rises. ATT&amp;CK calls the follow-on step <strong>Inhibit System Recovery (T1490)</strong>. Backups do not make networks faster, backup tools are not malware, and they do not replace passwords.</p>", "options": ["Backups make the network run faster for every user", "Backup tools always contain hidden malware files", "Backups remove the need for any user passwords", "Backups can undo ransomware, so attackers want to stop them"], "answer": 3}, {"id": "E08", "type": "order", "summary": "Order the attacker's simple three-step plan", "scenario": [{"label": "ARTEFACT 1 — Sticky notes from an intrusion rehearsal", "kind": "prose", "text": "A red-teamer wrote the simple plan of a backup-focused attacker on three sticky notes, and dropped them. Put the notes back in order."}], "question": "Drag the three steps into the correct order (first step on top).", "hint": "Look, then learn, then plan. The first step is running the command.", "explain": "<p>The attacker must first <strong>look</strong> (run a discovery command), then <strong>learn</strong> the result (Veeam is installed), and only then <strong>plan</strong> the next step (how to stop the backups). Discovery always comes before the plan it feeds.</p>", "items": ["Look for backup software on the host", "Learn that Veeam is installed", "Plan how to stop the backups"], "correct": [0, 1, 2]}, {"id": "E09", "type": "match", "summary": "Match Windows events to DET0088 data components", "scenario": [{"label": "ARTEFACT 1 — AN0240 log sources card", "kind": "prose", "text": "The AN0240 card on the DET0088 page lists three Windows log sources. Each pairs one event with one data component. Learn the pairs."}], "question": "Match each event to its data component.", "hint": "4688 is the classic process creation event; Sysmon 11 is about new files.", "explain": "<p>Event <strong>4688</strong> in the Windows Security log records every new process &mdash; <strong>Process Creation (DC0032)</strong>. Sysmon events <strong>13 and 14</strong> record registry changes &mdash; <strong>Windows Registry Key Modification (DC0063)</strong>. Sysmon event <strong>11</strong> records new files &mdash; <strong>File Creation (DC0039)</strong>. These three components are the Windows telemetry of DET0088.</p>", "pairs": [["Windows Security EID 4688", "Process Creation (DC0032)"], ["Sysmon EID 13 / 14", "Windows Registry Key Modification (DC0063)"], ["Sysmon EID 11", "File Creation (DC0039)"]]}, {"id": "E10", "type": "fill", "summary": "Complete the Linux search-tool sentence", "scenario": [{"label": "ARTEFACT 1 — AN0241 summary card", "kind": "prose", "text": "AN0241 watches Linux systems. Attackers there use simple search tools to hunt for backup config files such as <code>/etc/rsnapshot.conf</code> or a Veeam agent folder."}], "question": "Complete the sentence with the missing tool name.", "hint": "The missing tool searches inside files for text.", "explain": "<p><strong>grep</strong> searches inside files for a text pattern. Together with <code>find</code>, it is the classic pair attackers use to hunt for backup files and folders on Linux &mdash; for example <code>/etc/rsnapshot.conf</code> or the config of a duplicity job. The auditd service delivers these executions to AN0241 as execve events. <code>chmod</code> changes permissions, <code>kill</code> stops processes, and <code>ping</code> tests network reachability; none of them searches file contents.</p>", "template": "On Linux, AN0241 watches search tools such as find and {0} that hunt for backup configuration files.", "blanks": ["grep"], "bank": ["grep", "chmod", "kill", "ping"]}, {"id": "E11", "type": "fill", "summary": "Which data component sees new files", "scenario": [{"label": "ARTEFACT 1 — One Sysmon line", "kind": "mono", "lines": ["WinEventLog:Sysmon  EventCode=11", "Image: C:\\Windows\\System32\\cmd.exe", "TargetFilename: C:\\Users\\jsmith\\veeam_inventory.txt"]}], "question": "Complete the sentence with the missing word.", "hint": "The file did not exist before this event.", "explain": "<p><strong>File Creation (DC0039)</strong> is the data component that fires when a new file appears on disk; Sysmon event 11 delivers it. A new file named <code>veeam_inventory.txt</code> next to backup-vendor queries is a realistic discovery artefact. Deletion, renaming, and connections are different components that AN0240 does not use here.</p>", "template": "A new file on disk is seen by the File {0} data component (DC0039), delivered by Sysmon event 11.", "blanks": ["Creation"], "bank": ["Creation", "Deletion", "Renaming", "Connection"]}, {"id": "E12", "type": "linepick", "summary": "Click the line that shows backup discovery", "scenario": [{"label": "ARTEFACT 1 — Four process creation lines (one host, one hour)", "kind": "mono", "lines": ["cmd.exe /c sc query state= all | findstr /i \"veeam acronis crashplan\"", "cmd.exe /c ipconfig /all", "cmd.exe /c del %TEMP%\\report.tmp", "cmd.exe /c copy invoice.xlsx D:\\share\\invoice.xlsx"]}], "question": "Click the ONE line that shows backup software discovery.", "hint": "Only one line filters its output for backup vendor names.", "explain": "<p>Only the first line asks about backup products &mdash; it lists all services and filters for <strong>Veeam, Acronis, and CrashPlan</strong>. <code>ipconfig</code> shows network settings, <code>del</code> removes one temporary file, and <code>copy</code> moves a document. None of them looks for backup software, so AN0240 would ignore them.</p>", "lines": [{"t": "cmd.exe /c sc query state= all | findstr /i \"veeam acronis crashplan\"", "c": true}, {"t": "cmd.exe /c ipconfig /all", "c": false}, {"t": "cmd.exe /c del %TEMP%\\report.tmp", "c": false}, {"t": "cmd.exe /c copy invoice.xlsx D:\\share\\invoice.xlsx", "c": false}], "pick": 1}, {"id": "E13", "type": "match", "summary": "Match three Windows tools to their purpose", "scenario": [{"label": "ARTEFACT 1 — Cheat-sheet to memorise", "kind": "prose", "text": "AN0240 watches common Windows commands when they touch backup products. First you must know what each tool does."}], "question": "Match each command to what it does.", "hint": "One tool works with the registry — the place Windows stores settings.", "explain": "<p>Each tool answers a different question. <strong>tasklist</strong> shows which processes run. <strong>reg query</strong> reads registry keys &mdash; the settings store of Windows. <strong>sc query</strong> asks about installed services. AN0240 watches all three when the output or the target names a backup product such as Veeam.</p>", "pairs": [["tasklist", "lists running processes"], ["reg query", "reads registry keys"], ["sc query", "asks about services"]]}, {"id": "E14", "type": "fill", "summary": "Complete the macOS analytic sentence", "scenario": [{"label": "ARTEFACT 1 — AN0242 summary card", "kind": "prose", "text": "AN0242 watches macOS. It sees Terminal usage, Spotlight searches, and reads of backup-software settings files. It looks for products like Time Machine, Carbon Copy Cloner, and Backblaze."}], "question": "Complete the sentence with the two missing terms.", "hint": "One option runs on mac, the other three do not. And one well-known mac backup tool is Carbon Copy Cloner.", "explain": "<p><strong>launchctl</strong> manages background jobs on macOS. <strong>system_profiler</strong> lists installed applications and hardware &mdash; another tool AN0242 watches. <strong>Carbon Copy Cloner</strong> is a well-known mac backup product; AN0242 also watches Backblaze and Time Machine, and it reads the macOS unified log to see these commands and file reads. PowerShell is a Windows tool and <code>apt-get</code> manages packages on Linux &mdash; neither belongs in a macOS sentence.</p>", "template": "On macOS, AN0242 watches tools such as mdfind and {0}, and looks for backup products such as Time Machine or {1}.", "blanks": ["launchctl", "Carbon Copy Cloner"], "bank": ["launchctl", "Carbon Copy Cloner", "PowerShell", "apt-get"]}, {"id": "E15", "type": "order", "summary": "Order your SOC triage steps", "scenario": [{"label": "ARTEFACT 1 — Your first shift", "kind": "prose", "text": "An alert fires. You are the analyst on the console. Put your simple triage steps in the order a junior analyst should follow."}], "question": "Drag the three steps into the correct order (first step on top).", "hint": "You must open the alert before you can read anything.", "explain": "<p>Triage has an order: <strong>open the alert</strong> in the SIEM, <strong>read the evidence</strong> (the command line in the event), then <strong>decide</strong> &mdash; here, escalate because the command queried Veeam, a backup product. Skipping a step loses information; deciding before reading is a classic junior mistake.</p>", "items": ["Open the alert in the SIEM", "Read the command line in the event", "See it queried Veeam and escalate to the team lead"], "correct": [0, 1, 2]}]}</script>
<script>
(function(){
'use strict';
var EXAM = JSON.parse(document.getElementById('cm-data').textContent);
var LETTERS = ['A','B','C','D','E','F','G'];
var SEVCLASS = {'EASY':'sev-easy','MEDIUM':'sev-medium','HARD':'sev-hard','EXTREMELY HARD':'sev-extreme'};
function $(id){return document.getElementById(id);}
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function scoreExercise(H,W,N){ if(N<=0){return 0;} var c=(H-W)/N; if(c<0){c=0;} if(c>1){c=1;} return Math.round(c*100)/100; }
function disableAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('button,select,input'),function(x){x.disabled=true;});
}
var S = null;
function cur(){return S.order[S.idx];}
function idOf(i){return S.order[i].id;}
function answeredCount(){return Object.keys(S.credits).length;}
function creditSum(){var s=0;Object.keys(S.credits).forEach(function(k){s+=S.credits[k];});return s;}

/* ---------------- intro ---------------- */
function renderIntro(){
  var m = EXAM.meta;
  $('introTitle').textContent = m.title;
  $('introObject').innerHTML = '<span class="chip">&#129520; ATT&amp;CK Detection Strategy '+esc(m.objectId)+' &mdash; '+esc(m.objectName)+'</span>'+
    '<span class="chip sev '+SEVCLASS[EXAM.sev]+'">Severity: '+esc(EXAM.sev)+'</span>';
  $('introFacts').innerHTML =
    '<span class="chip">&#129513; Exercises in this file: '+EXAM.exercises.length+'</span>'+
    '<span class="chip">&#9201; Estimated time: '+m.estimatedMinutes+' min</span>'+
    '<span class="chip">&#9203; Timer budget: '+fmtTime(EXAM.timerSeconds)+'</span>'+
    '<span class="chip">&#127937; Pass mark: '+EXAM.passMark+'%</span>';
  $('introLearn').innerHTML = EXAM.intro.learn;
  var kw = $('introKeywords'); kw.innerHTML='';
  EXAM.intro.keywords.forEach(function(g){
    var d = el('div','kw-group');
    d.appendChild(el('h3',null,esc(g.group)));
    var w = el('div','kw-items');
    g.items.forEach(function(it){ w.appendChild(el('span','kw',esc(it))); });
    d.appendChild(w);
    kw.appendChild(d);
  });
  $('introHow').innerHTML = EXAM.intro.how;
}
function show(id){
  ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){
    $(s).hidden = (s!==id);
  });
  window.scrollTo(0,0);
}

/* ---------------- state ---------------- */
function freshState(){
  return {
    order: shuffle(EXAM.exercises),
    idx: 0,
    credits: {},
    answered: {},
    skipped: [],
    hintUsed: {},
    widget: null,
    timer: {state:'RUNNING', left: EXAM.timerSeconds, total: EXAM.timerSeconds},
    pausedFrom: null,
    phase: 'exam',
    pauseManualSec: 0,
    pauseFeedbackSec: 0,
    reported: false
  };
}
function startExam(){
  S = freshState();
  $('hintBtn').disabled = false;
  show('scr-exam');
  renderExercise();
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- timer ---------------- */
function setTimerState(st){
  if(!S){return;}
  if(S.timer.state==='ENDED' && st!=='ENDED'){return;}
  S.timer.state = st;
  renderTimer();
}
function renderTimer(){
  if(!S){return;}
  var chip = $('timerChip');
  var t = S.timer;
  var cls='t-run', txt='';
  if(t.state==='RUNNING'){cls='t-run'; txt='&#9201; RUNNING &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_MANUAL'){cls='t-pause'; txt='&#9208; PAUSED &mdash; manual (press Resume) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else if(t.state==='PAUSED_AUTO_CHECK'){cls='t-pause'; txt='&#9208; PAUSED &mdash; reviewing feedback (resumes on Next) &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  else {cls='t-end'; txt='&#9209; ENDED &mdash; <span class="mono">'+fmtTime(t.left)+'</span>';}
  chip.className='chip '+cls;
  chip.innerHTML = txt;
  chip.setAttribute('aria-label','Timer state: '+t.state);
  $('pauseBtn').disabled = !(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK');
}
function tick(){
  if(!S || (S.phase!=='exam' && S.phase!=='review')){return;}
  if(S.timer.state==='RUNNING'){
    S.timer.left--;
    if(S.timer.left<=0){ S.timer.left=0; renderTimer(); forceFinish(); return; }
  } else if(S.timer.state==='PAUSED_MANUAL'){ S.pauseManualSec++; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ S.pauseFeedbackSec++; }
  renderTimer();
}
function forceFinish(){
  setTimerState('ENDED');
  showResults();
}

/* ---------------- header widgets ---------------- */
function updateScore(){
  var a = answeredCount(), s = creditSum();
  var pct = a>0 ? Math.round(s/a*100) : 0;
  $('scoreChip').innerHTML = '&#127942; Score <strong class="mono">'+fmt1(s)+'</strong> / '+a+' <span class="muted">('+pct+'%)</span>';
}
function updateProgress(){
  var p = Math.round(answeredCount()/EXAM.exercises.length*100);
  $('progressFill').style.width = p+'%';
  $('progressFill').setAttribute('aria-valuenow', p);
}
function updateCheckState(){
  if(!S || !S.widget){return;}
  /* disabled only when the widget defines ready() and it returns false */
  $('checkBtn').disabled = !!(S.widget.ready && !S.widget.ready());
}

/* ---------------- exercise rendering ---------------- */
function nextUnanswered(from){
  var n = S.order.length;
  for(var k=1;k<=n;k++){
    var i = (from+k)%n;
    var id = idOf(i);
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ return i; }
  }
  return -1;
}
function renderExercise(){
  var ex = cur();
  S.phase='exam';
  $('exCounter').textContent = 'Exercise '+(S.idx+1)+' of '+S.order.length;
  var sev = $('sevBadge');
  sev.className = 'chip '+SEVCLASS[EXAM.sev];
  sev.textContent = EXAM.sev;
  sev.setAttribute('aria-label','Severity '+EXAM.sev);
  $('scenSummary').textContent = ex.summary;
  var body = $('scenBody'); body.innerHTML='';
  ex.scenario.forEach(function(b){
    var wrap = el('div','artefact');
    wrap.appendChild(el('div','artefact-label',esc(b.label)));
    if(b.kind==='mono'){
      var pre = el('pre','mono'); pre.textContent = b.lines.join('\n');
      wrap.appendChild(pre);
    } else {
      var pr = el('div','prose'); pr.innerHTML = b.text;
      wrap.appendChild(pr);
    }
    body.appendChild(wrap);
  });
  $('scenBody').hidden=false;
  $('scenHead').setAttribute('aria-expanded','true');
  $('scenToggleHint').innerHTML='&#9660; collapse';
  $('qText').innerHTML = ex.question;
  Array.prototype.forEach.call(document.querySelectorAll('.hintbox'), function(x){ if(x.parentNode){x.parentNode.removeChild(x);} });
  var aa = $('answerArea'); aa.innerHTML='';
  S.widget = WIDGETS[ex.type](ex, aa, updateCheckState);
  $('feedbackBlock').hidden = true; $('feedbackBlock').innerHTML='';
  $('checkBtn').hidden = false;
  updateCheckState();
  $('nextBtn').hidden = true; $('finishBtn').hidden = true;
  $('hintBtn').disabled = !!S.hintUsed[ex.id];
  $('skipBtn').disabled = !!S.answered[ex.id];
  updateScore(); updateProgress(); renderTimer();
}

/* ---------------- feedback ---------------- */
var ROWMETA = {
  ok:{ic:'&#10003;',st:'Correct'},
  bad:{ic:'&#10007;',st:'Wrong'},
  miss:{ic:'&#9675;',st:'Missed'}
};
function renderFeedback(ex, g, credit){
  var fb = $('feedbackBlock');
  fb.hidden = false;
  var head, cls;
  if(credit>=1){head='&#10003; CORRECT'; cls='ok';}
  else if(credit>0){head='&#10003; PARTIALLY CORRECT &mdash; credit '+credit.toFixed(2); cls='part';}
  else {head='&#10007; INCORRECT'; cls='bad';}
  var h = '<div class="fb-head '+cls+'">'+head+'</div>';
  if(g.N>1){
    h += '<div class="muted">credit '+credit.toFixed(2)+' &mdash; '+g.H+'/'+g.N+' correct items, formula (H &minus; W) / N = ('+g.H+' &minus; '+g.W+') / '+g.N+'</div>';
  }
  if(ex.type==='qcm' && credit<1){
    h += '<div class="fb-row ok"><span class="ic">&#10003;</span><span class="st">Correct</span><span>Answer: <strong>'+esc(ex.options[ex.answer])+'</strong></span></div>';
  }
  if(g.rows && g.rows.length){
    h += '<div class="fb-rows">';
    g.rows.forEach(function(r){
      var m = ROWMETA[r.state];
      h += '<div class="fb-row '+r.state+'"><span class="ic">'+m.ic+'</span><span class="st">'+m.st+'</span><span>'+r.label+(r.note?' &mdash; <span class="muted">'+esc(r.note)+'</span>':'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose" style="margin-top:8px">'+ex.explain+'</div>';
  if(S.hintUsed[ex.id]){
    h += '<div class="hintbox"><span class="hw">&#128161; Hint was used:</span> &minus;10% was applied to this exercise\u2019s credit.</div>';
  }
  var study = ex.study || 'Re-read the explanation above and the matching part of the intro section \u201cWhat you will learn here\u201d, then try the exercise again on a retake.';
  h += '<div class="prose muted" style="margin-top:6px"><strong>What to study:</strong> '+study+'</div>';
  fb.innerHTML = h;
  fb.className = 'feedback f-'+(cls==='ok'?'ok':(cls==='part'?'part':'bad'));
}

/* ---------------- check / next / skip / hint / pause ---------------- */
function onCheck(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit-0.10); credit = Math.round(credit*100)/100; }
  S.credits[ex.id] = credit;
  S.answered[ex.id] = true;
  var si = S.skipped.indexOf(ex.id);
  if(si>=0){ S.skipped.splice(si,1); }
  S.widget.lock();
  setTimerState('PAUSED_AUTO_CHECK');
  renderFeedback(ex, g, credit);
  $('checkBtn').hidden = true;
  var last = nextUnanswered(S.idx)===-1;
  $('nextBtn').hidden = false;
  $('finishBtn').hidden = !last;
  $('skipBtn').disabled = true;
  updateScore(); updateProgress();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  if(S._fromReview && S.answered[idOf(S.idx)]){ S._fromReview=false; showReview(); return; }
  S.idx = n; S._fromReview=false;
  renderExercise();
}
function onSkip(){
  var ex = cur();
  if(S.answered[ex.id]){return;}
  if(S.skipped.indexOf(ex.id)<0){ S.skipped.push(ex.id); }
  var n = nextUnanswered(S.idx);
  if(n===-1){ finishAttempt(); return; }
  S.idx = n;
  renderExercise();
}
function onHint(){
  var ex = cur();
  if(S.hintUsed[ex.id] || S.answered[ex.id]){return;}
  S.hintUsed[ex.id]=true;
  var old = document.querySelectorAll('.hintbox.live');
  Array.prototype.forEach.call(old,function(x){x.parentNode.removeChild(x);});
  var box = el('div','hintbox live');
  box.innerHTML = '<span class="hw">&#128161; HINT (&minus;10% of this exercise\u2019s credit):</span> '+esc(ex.hint);
  $('answerArea').parentNode.insertBefore(box, $('answerArea'));
  $('hintBtn').disabled = true;
}
function onPause(){
  if(!S || S.phase!=='exam'){return;}
  if(S.timer.state==='RUNNING' || S.timer.state==='PAUSED_AUTO_CHECK'){
    S.pausedFrom = S.timer.state;
    setTimerState('PAUSED_MANUAL');
    $('pausedOverlay').hidden=false;
  }
}
function onResume(){
  setTimerState(S.pausedFrom || 'RUNNING');
  S.pausedFrom=null;
  $('pausedOverlay').hidden=true;
}

/* ---------------- finish / review / results ---------------- */
function finishAttempt(){
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  if(S.skipped.length>0){ showReview(); } else { showResults(); }
}
function showReview(){
  S.phase='review';
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ setTimerState('RUNNING'); }
  show('scr-review');
  $('reviewIntro').innerHTML = 'You skipped '+S.skipped.length+' exercise(s). You can return to each one and answer it while the timer is still running. If you submit now, skipped exercises are <strong>excluded</strong> from the score (they count neither as correct nor as wrong).';
  var list = $('reviewList'); list.innerHTML='';
  S.skipped.forEach(function(id,i){
    var ex = null;
    S.order.forEach(function(o){ if(o.id===id){ex=o;} });
    var row = el('div','review-row');
    row.innerHTML = '<span><span class="warnword">&#9888; Skipped</span> &mdash; '+esc(ex.summary)+'</span>';
    var b = el('button','btn small primary','Answer &#9654;');
    b.addEventListener('click', function(){
      S._fromReview=true;
      for(var k=0;k<S.order.length;k++){ if(S.order[k].id===id){ S.idx=k; break; } }
      show('scr-exam');
      renderExercise();
    });
    row.appendChild(b);
    list.appendChild(row);
  });
}
function showResults(){
  S.phase='results';
  setTimerState('ENDED');
  show('scr-results');
  var ids = Object.keys(S.credits);
  var answered = ids.length;
  var sum=0, full=0, part=0, zero=0, partSum=0;
  ids.forEach(function(id){var c=S.credits[id]; sum+=c; if(c>=1){full++;} else if(c>0){part++; partSum+=c;} else {zero++;}});
  var skippedNever = EXAM.exercises.length - answered;
  var pct = answered>0 ? Math.round(sum/answered*100) : 0;
  var passed = pct >= EXAM.passMark;
  var vp = $('verdictPanel');
  if(passed){
    vp.className='card verdict-pass';
    vp.innerHTML = '<div class="bigword">&#10003; PASS</div><p>You reached <strong>'+pct+'%</strong> (pass mark '+EXAM.passMark+'%). Well done &mdash; you demonstrated working knowledge of '+esc(EXAM.meta.objectId)+' &mdash; '+esc(EXAM.meta.objectName)+' at '+esc(EXAM.sev)+' level.</p>';
  } else {
    vp.className='card verdict-fail';
    vp.innerHTML = '<div class="bigword">&#10007; FAIL</div><p>You reached <strong>'+pct+'%</strong>, below the '+EXAM.passMark+'% pass mark. You must retake this exam. Review the explanations, then press Retake.</p>';
  }
  var avgPart = part>0 ? (partSum/part) : 0;
  $('resultsBreakdown').innerHTML =
    '<h2>Score breakdown</h2>'+
    '<div class="res-line ok"><span>&#10003; Fully correct</span><span class="st">'+full+'</span></div>'+
    '<div class="res-line part"><span>&#10003; Partially correct</span><span class="st">'+part+(part>0?' <span class="muted">(avg '+avgPart.toFixed(2)+')</span>':'')+'</span></div>'+
    '<div class="res-line bad"><span>&#10007; Fully incorrect</span><span class="st">'+zero+'</span></div>'+
    '<div class="res-line skip"><span>&#9888; Skipped or unanswered &mdash; excluded</span><span class="st">'+skippedNever+'</span></div>'+
    '<div class="res-line"><span><strong>Total score</strong></span><span class="st"><strong class="mono">'+fmt1(sum)+' / '+answered+'</strong> &mdash; <strong>'+pct+'%</strong></span></div>';
  $('resultsMeta').innerHTML =
    '<h2>How your time was spent</h2>'+
    '<div class="res-line"><span>Time paused manually (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseManualSec)+'</span></div>'+
    '<div class="res-line"><span>Time paused for feedback review (&#9208;)</span><span class="st mono">'+fmtTime(S.pauseFeedbackSec)+'</span></div>'+
    '<div class="res-line"><span>Time left on the clock</span><span class="st mono">'+fmtTime(S.timer.left)+'</span></div>';
  reportScore(sum, answered, pct, passed);
}
function reportScore(creditSum, answeredCount, pct, passed){
  if(S.reported){return;}
  S.reported = true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.meta.topicId,
      batch: EXAM.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: pct,
      passed: passed
    }, location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}

/* ---------------- interactive widgets ---------------- */
var WIDGETS = {};

WIDGETS.qcm = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = -1;
  var wrap = el('div');
  perm.forEach(function(oi, pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} sel = oi; refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = (parseInt(b.dataset.oi,10) === sel);
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return sel>=0; },
    grade:function(){ return {H:(sel===ex.answer?1:0), W:0, N:1, rows:[]}; },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        b.disabled=true;
        var oi=parseInt(b.dataset.oi,10);
        if(oi===ex.answer){b.classList.add('ok');}
        if(oi===sel && sel!==ex.answer){b.classList.add('bad');}
      });
    }
  };
};

WIDGETS.multi = function(ex, area, onChange){
  var perm = shuffle(ex.options.map(function(o,i){return i;}));
  var sel = {};
  var wrap = el('div');
  perm.forEach(function(oi,pos){
    var b = el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(ex.options[oi])+'</span>';
    b.addEventListener('click', function(){ if(b.disabled){return;} if(sel[oi]){delete sel[oi];} else {sel[oi]=true;} refresh(); if(onChange){onChange();} });
    b.dataset.oi = String(oi);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
      var on = !!sel[parseInt(b.dataset.oi,10)];
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length>0; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.options.forEach(function(o,i){
        var picked = !!sel[i], correct = ex.answers.indexOf(i)>=0;
        if(correct && picked){ H++; rows.push({state:'ok', label:o}); }
        else if(correct && !picked){ rows.push({state:'miss', label:o}); }
        else if(!correct && picked){ W++; rows.push({state:'bad', label:o}); }
      });
      return {H:H, W:W, N:ex.answers.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(b){
        var oi=parseInt(b.dataset.oi,10);
        if(ex.answers.indexOf(oi)>=0){ b.classList.add('ok'); b.classList.remove('sel'); }
        else if(sel[oi]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.match = function(ex, area, onChange){

WIDGETS.dnd = function(ex, area, onChange){
  var itemPerm = shuffle(ex.items.map(function(it,i){return i;}));
  var placed = {};   /* itemIndex -> slotId */
  var selItem = -1;
  var wrap = el('div');
  var pool = el('div','pool');
  var slotsBox = el('div');
  var slotEls = {};
  ex.slots.forEach(function(sl){
    var s = el('div','slot');
    s.dataset.slot = sl.id;
    s.setAttribute('role','button');
    s.tabIndex = 0;
    s.appendChild(el('span','slot-label', esc(sl.label)));
    var holder = el('div','slot-holder');
    s.appendChild(holder);
    slotEls[sl.id] = s;
    function placeIfSel(){
      if(selItem>=0 && placed[selItem]===undefined){
        placed[selItem]=sl.id; selItem=-1; render();
      }
    }
    s.addEventListener('click', placeIfSel);
    s.addEventListener('keypress', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); placeIfSel(); } });
    s.addEventListener('dragover', function(ev){ ev.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('over'); });
    s.addEventListener('drop', function(ev){ ev.preventDefault(); s.classList.remove('over'); placeIfSel(); });
    slotsBox.appendChild(s);
  });
  function render(){
    pool.innerHTML='';
    itemPerm.forEach(function(i){
      if(placed[i]!==undefined){return;}
      var c = el('button','itemchip', esc(ex.items[i].label));
      c.type='button';
      c.draggable = true;
      if(selItem===i){c.classList.add('sel');}
      c.addEventListener('click', function(){ selItem = (selItem===i?-1:i); render(); });
      c.addEventListener('dragstart', function(ev){ selItem=i; c.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain', String(i));}catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
      pool.appendChild(c);
    });
    ex.slots.forEach(function(sl){
      var holder = slotEls[sl.id].querySelector('.slot-holder');
      holder.innerHTML='';
      itemPerm.forEach(function(i){
        if(placed[i]!==sl.id){return;}
        var p = el('button','placed', esc(ex.items[i].label)+' <span aria-hidden="true">&times;</span>');
        p.type='button';
        p.title='Click to remove back to the bank';
        p.addEventListener('click', function(ev){ ev.stopPropagation(); delete placed[i]; render(); });
        holder.appendChild(p);
      });
    });
    if(onChange){onChange();}
  }
  render();
  wrap.appendChild(pool); wrap.appendChild(slotsBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      for(var k=0;k<ex.items.length;k++){ if(placed[k]===undefined){ return false; } }
      return true;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.items.forEach(function(it,i){
        var at = placed[i];
        if(at && at===it.slot){ H++; rows.push({state:'ok', label:it.label+' &rarr; '+esc(slotName(it.slot))}); }
        else if(at){ W++; rows.push({state:'bad', label:it.label, note:'placed in '+slotName(at)+'; correct: '+slotName(it.slot)}); }
        else { rows.push({state:'miss', label:it.label, note:'not placed; correct: '+slotName(it.slot)}); }
      });
      return {H:H, W:W, N:ex.items.length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled=true; });
    }
  };
  function slotName(id){
    var n = id;
    ex.slots.forEach(function(s){ if(s.id===id){n=s.label;} });
    return String(n);
  }
};

WIDGETS.order = function(ex, area){

      list.appendChild(li);

    lock:function(){

    }

WIDGETS.linepick = function(ex, area, onChange){

  var sel = {};
  var wrap = el('div');
  ex.lines.forEach(function(L,i){
    var b = el('button','linepick');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.textContent = L.t;
    b.addEventListener('click', function(){
      if(b.disabled){return;}
      if(sel[i]){ delete sel[i]; }
      else {
        if(pickN===1){ sel={}; }
        else {
          var cnt = Object.keys(sel).length;
          if(cnt>=pickN){ return; }
        }
        sel[i]=true;
      }
      refresh();
    });
    b.dataset.li=String(i);
    wrap.appendChild(b);
  });
  function refresh(){
    Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
      var on = !!sel[parseInt(b.dataset.li,10)];
      b.classList.toggle('sel',on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
    if(onChange){onChange();}
  }
  if(pickN>1){ area.appendChild(el('p','muted','Select exactly '+pickN+' lines, then press Check.')); }
  area.appendChild(wrap);
  return {
    ready:function(){ return Object.keys(sel).length===pickN; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.lines.forEach(function(L,i){
        var c=!!L.c, p=!!sel[i];
        if(c && p){ H++; rows.push({state:'ok', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(c && !p){ rows.push({state:'miss', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
        else if(!c && p){ W++; rows.push({state:'bad', label:esc(L.t.length>70?L.t.slice(0,70)+'\u2026':L.t)}); }
      });
      return {H:H, W:W, N:ex.lines.filter(function(L){return !!L.c;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.linepick'), function(b){
        var i=parseInt(b.dataset.li,10);
        if(ex.lines[i].c){ b.classList.add('ok'); }
        else if(sel[i]){ b.classList.add('bad'); }
        b.disabled=true;
      });
    }
  };
};

WIDGETS.triage = function(ex, area, onChange){
  var chosen = {};
  var wrap = el('div');
  var tools = el('div','logtools');
  var inp = el('input');
  inp.type='text'; inp.placeholder='Filter log lines (case-insensitive substring)';
  inp.setAttribute('aria-label','Filter log lines');
  tools.appendChild(inp);
  var logBox = el('div');
  var rowEls = [];
  ex.log.forEach(function(L,i){
    var row = el('div','artefact');
    var pre = el('pre','mono'); pre.textContent = L.t;
    row.appendChild(pre);
    if(L.flag){
      var v = el('div','verdicts');
      ex.verdictOptions.forEach(function(vo,vi){
        var vb = el('button',null, esc(vo));
        vb.type='button';
        vb.setAttribute('aria-pressed','false');
        vb.addEventListener('click', function(){
          if(vb.disabled){return;}
          chosen[i]=vi; 
          Array.prototype.forEach.call(v.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
          vb.setAttribute('aria-pressed','true');
          if(onChange){onChange();}
        });
        vb.dataset.vi=String(vi);
        v.appendChild(vb);
      });
      row.appendChild(v);
    }
    rowEls.push({row:row, text:L.t});
    logBox.appendChild(row);
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rowEls.forEach(function(r){ r.row.style.display = (r.text.toLowerCase().indexOf(q)>=0)?'':'none'; });
  });
  wrap.appendChild(tools); wrap.appendChild(logBox);
  area.appendChild(wrap);
  return {
    ready:function(){
      var ok=true;
      ex.log.forEach(function(L,i){ if(L.flag && chosen[i]===undefined){ ok=false; } });
      return ok;
    },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.log.forEach(function(L,i){
        if(!L.flag){return;}
        var got = chosen[i];
        var correctTxt = ex.verdictOptions[L.correct];
        if(got!==undefined && got===L.correct){ H++; rows.push({state:'ok', label:short(L.t), note:ex.verdictOptions[got]}); }
        else if(got!==undefined){ W++; rows.push({state:'bad', label:short(L.t), note:'you chose: '+ex.verdictOptions[got]+'; correct: '+correctTxt}); }
        else { rows.push({state:'miss', label:short(L.t), note:'no verdict; correct: '+correctTxt}); }
      });
      return {H:H, W:W, N:ex.log.filter(function(L){return L.flag;}).length, rows:rows};
    },
    lock:function(){
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){ b.disabled=true; });
      Array.prototype.forEach.call(wrap.querySelectorAll('.verdicts button'), function(b){
        var v = b.parentNode;
        var rowB = v.parentNode;
        var idx = rowEls.map(function(r){return r.row;}).indexOf(rowB);
        if(idx>=0 && chosen[idx]!==undefined && parseInt(b.dataset.vi,10)===chosen[idx]){
          if(chosen[idx]===ex.log[idx].correct){ b.style.borderColor='var(--state-correct)'; }
          else { b.style.borderColor='var(--state-incorrect)'; }
        }
      });
      inp.disabled=true;
    }
  };
  function short(t){ return esc(t.length>60?t.slice(0,60)+'\u2026':t); }
};

WIDGETS.decision = function(ex, area, onChange){
  var choices = [];
  var curStep = 0;
  var wrap = el('div');
  function renderStep(){
    var step = ex.steps[curStep];
    var box = el('div');
    box.appendChild(el('span','stepbadge','STEP '+(curStep+1)+' OF '+ex.steps.length));
    box.appendChild(el('p','prose', esc(step.q)));
    var perm = shuffle(step.opts.map(function(o,i){return i;}));
    var sel = -1;
    var confirmBtn = el('button','btn small primary','Confirm step &#9654;');
    confirmBtn.type='button';
    confirmBtn.disabled = true;
    perm.forEach(function(oi,pos){
      var b = el('button','opt');
      b.type='button';
      b.innerHTML = '<span class="key">'+LETTERS[pos]+'.</span><span>'+esc(step.opts[oi])+'</span>';
      b.addEventListener('click', function(){
        if(b.disabled){return;}
        sel=oi;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        confirmBtn.disabled=false;
      });
      box.appendChild(b);
    });
    box.appendChild(confirmBtn);
    confirmBtn.addEventListener('click', function(){
      if(confirmBtn.disabled){return;}
      choices[curStep]=sel;
      disableAll(box);
      confirmBtn.disabled=true;
      curStep++;
      if(curStep>=ex.steps.length){
        if(onChange){onChange();}
      } else { renderStep(); }
    });
    wrap.appendChild(box);
  }
  renderStep();
  area.appendChild(wrap);
  return {
    ready:function(){ return curStep>=ex.steps.length; },
    grade:function(){
      var H=0,W=0,rows=[];
      ex.steps.forEach(function(st,i){
        var got = choices[i];
        if(got===st.ans){ H++; rows.push({state:'ok', label:'Step '+(i+1), note:st.why}); }
        else { W++; rows.push({state:'bad', label:'Step '+(i+1), note:'correct: '+st.opts[st.ans]+'. '+st.why}); }
      });
      return {H:H, W:W, N:ex.steps.length, rows:rows};
    },
    lock:function(){ }
  };
};

/* ---------------- boot ---------------- */
function boot(){
  renderIntro();
  $('startBtn').addEventListener('click', startExam);
  $('checkBtn').addEventListener('click', onCheck);
  $('nextBtn').addEventListener('click', onNext);
  $('skipBtn').addEventListener('click', onSkip);
  $('hintBtn').addEventListener('click', onHint);
  $('pauseBtn').addEventListener('click', onPause);
  $('resumeBtn').addEventListener('click', onResume);
  $('finishBtn').addEventListener('click', finishAttempt);
  $('reviewSubmit').addEventListener('click', function(){ showResults(); });
  $('retakeBtn').addEventListener('click', function(){ startExam(); });
  $('scenHead').addEventListener('click', function(){
    var b=$('scenBody');
    b.hidden = !b.hidden;
    var open = !b.hidden;
    $('scenHead').setAttribute('aria-expanded', open?'true':'false');
    $('scenToggleHint').innerHTML = open ? '&#9660; collapse' : '&#9654; expand';
  });
  setInterval(tick, 1000);
  window.addEventListener('message', function(event){
    if(!event.data){return;}
    if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){return;}
    /* Handshake accepted: username, country, locale, topicId, batch are consumed.
       theme is always dark; this file is dark-only, so appearance does not change. */
    window.__cmHandshake = event.data;
  });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
