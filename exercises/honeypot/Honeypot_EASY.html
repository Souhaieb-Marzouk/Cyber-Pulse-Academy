<script>
'use strict';
/* CyberPulse Academy — self-contained exam engine, core (part A) */
var TOPIC_ID,BATCH,PASS_MARK,TIME_SECS,SEV_LABEL,EXS,INTRO,THEMES;
var S={order:[],idx:0,recs:{},skipped:[],phase:'intro',tLeft:0,timerId:null,paused:false,reported:false,uname:'',exTimerId:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function txt(s){return String(s).replace(/<[^>]*>/g,'');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function div(cls){var d=document.createElement('div');if(cls)d.className=cls;return d;}
function fmtT(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function ncmd(s){return String(s).replace(/\s+/g,' ').trim().replace(/\[\.\]/g,'.');}
function rec(i){if(!S.recs[i])S.recs[i]={status:'pending',earned:0,hint:false,detail:'',g:null};return S.recs[i];}
function earnedTotal(){var p=0,k;for(k in S.recs){if(S.recs[k].status==='answered')p+=S.recs[k].earned;}return p;}
function updHdr(){if(!S.order.length)return;$('h-count').textContent='Exercise '+(S.idx+1)+' of '+S.order.length;$('h-score').textContent=earnedTotal()+' pts';$('t-min').textContent=fmtT(S.tLeft);$('h-timer').classList.toggle('low',S.tLeft<=60);$('pbar').style.width=Math.round((S.idx+1)/S.order.length*100)+'%';}
function startTimer(){S.tLeft=TIME_SECS;if(S.timerId)clearInterval(S.timerId);S.timerId=setInterval(function(){if(S.paused)return;S.tLeft--;updHdr();if(S.tLeft<=0){clearInterval(S.timerId);timeUp();}},1000);}
function startExTimer(sec,onEnd){stopExTimer();var left=sec;S.exTimerId=setInterval(function(){if(S.paused)return;left--;var e=$('extimer');if(e)e.textContent=fmtT(left);if(left<=0){stopExTimer();onEnd();}},1000);}
function stopExTimer(){if(S.exTimerId){clearInterval(S.exTimerId);S.exTimerId=null;}}
function setPaused(p){if(S.phase!=='exam'&&S.phase!=='review')return;S.paused=p;$('pause-ov').classList.toggle('hidden',!p);}
function timeUp(){stopExTimer();S.paused=false;$('pause-ov').classList.add('hidden');showResults(true);}
function startExam(){S.order=shuf(EXS.map(function(e,i){return i;}));S.idx=0;S.recs={};S.skipped=[];S.reported=false;S.phase='exam';$('scr-intro').classList.add('hidden');$('scr-results').classList.add('hidden');$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');$('hdr').classList.remove('hidden');startTimer();renderCurrent();}
function renderCurrent(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);$('btn-skip').disabled=(r.status==='answered'||r.status==='timedout');$('btn-hint').disabled=(r.status==='answered'||r.status==='timedout'||r.hint);updHdr();renderExercise(ex,ei);window.scrollTo(0,0);}
function nextStep(){if(S.idx<S.order.length-1){S.idx++;renderCurrent();}else{if(S.skipped.length>0){showReview();}else{finishExam();}}}
function skipCur(){var ei=S.order[S.idx],r=rec(ei);if(r.status==='answered'||r.status==='timedout')return;stopExTimer();r.status='skipped';if(S.skipped.indexOf(ei)<0)S.skipped.push(ei);nextStep();}
function hintCur(){var ei=S.order[S.idx],ex=EXS[ei],r=rec(ei);if(r.hint||r.status==='answered'||r.status==='timedout')return;r.hint=true;var hp=$('hintpanel');if(hp){hp.innerHTML='<b>Hint used — this exercise now earns 90% of its points:</b> '+ex.hint;hp.classList.remove('hidden');}$('btn-hint').disabled=true;}
function returnTo(ei){S.phase='exam';$('scr-review').classList.add('hidden');$('scr-exam').classList.remove('hidden');S.idx=S.order.indexOf(ei);renderCurrent();}
function showReview(){S.phase='review';$('scr-exam').classList.add('hidden');$('scr-results').classList.add('hidden');$('hdr').classList.remove('hidden');var rv=$('scr-review');rv.classList.remove('hidden');var h='<div class="introcard"><h1>Review skipped exercises</h1><p>You have skipped <b>'+S.skipped.length+'</b> exercise(s). You may return to any of them and answer it now. You can repeat this as often as you want, until the timer ends or you submit.</p><p>If you submit while an exercise is still unanswered, that exercise is <b>excluded from the score</b>: it does not count as right and does not count as wrong.</p><p>⏱ Time left: <b>'+fmtT(S.tLeft)+'</b></p><div id="skiplist"></div><div class="submitrow"><button class="btn" id="btn-finalsubmit" type="button">Submit exam now</button></div></div>';rv.innerHTML=h;var l=$('skiplist');S.skipped.slice().sort(function(a,b){return S.order.indexOf(a)-S.order.indexOf(b);}).forEach(function(ei){var ex=EXS[ei],d=div('repitem');d.innerHTML='<b>'+esc(ex.title)+'</b> &nbsp;<span class="rs skip">⚠ Skipped — not answered</span><div class="submitrow"><button class="btn sec" type="button">Return to this exercise</button></div>';d.querySelector('button').addEventListener('click',function(){returnTo(ei);});l.appendChild(d);});$('btn-finalsubmit').addEventListener('click',finishExam);window.scrollTo(0,0);}
function finishExam(){stopExTimer();showResults(false);}
function showResults(timedOut){S.phase='results';stopExTimer();$('hdr').classList.add('hidden');$('scr-exam').classList.add('hidden');$('scr-review').classList.add('hidden');var rs=$('scr-results');rs.classList.remove('hidden');
var answered=0,earned=0,full=0,part=0,wrong=0,excl=0;
EXS.forEach(function(ex,i){var r=S.recs[i];if(r&&r.status==='answered'){answered++;earned+=r.earned;if(r.earned>=100){full++;}else if(r.earned>0){part++;}else{wrong++;}}else{excl++;}});
var total=answered,pct=total>0?Math.round(earned/total):0,sc=total>0?Math.round(earned/10)/10:0,passed=(total>0&&pct>=PASS_MARK);
var stats='<div class="statgrid">'
+'<div class="stat"><div class="n">'+full+'</div><div class="lbl">✓ Fully correct</div></div>'
+'<div class="stat"><div class="n">'+part+'</div><div class="lbl">~ Partial credit</div></div>'
+'<div class="stat"><div class="n">'+wrong+'</div><div class="lbl">✗ Incorrect</div></div>'
+'<div class="stat"><div class="n">'+excl+'</div><div class="lbl">⚠ Not answered — excluded</div></div>'
+'</div>';
var hero='<div class="result-hero">'+(passed?'<div class="big" style="color:var(--green)">PASS</div>':'<div class="big" style="color:var(--red)">FAIL</div>')
+'<div class="passline">'+(passed?'Congratulations — you passed the '+SEV_LABEL+' certification exam.':'You did not reach the pass mark of '+PASS_MARK+'%. You must retake this exam.')+'</div>'
+'<div style="font-size:34px;font-weight:900;margin-top:10px">'+pct+'%</div>'
+'<div style="color:var(--dim)">'+sc+' fully-correct equivalent(s) of '+total+' answered — percentage is computed only over what you answered</div>'
+(timedOut?'<p style="color:var(--amber);margin-top:10px">⏱ Time ran out. Exercises you never answered were excluded from the score.</p>':'')

INTRO={
kw:"Honeypot",
h1:"Honeypot — EASY certification exam",
paras:[
"<b>What is a honeypot?</b> Imagine you are a security guard. You want to catch a thief who sneaks into a big office building at night. You cannot watch every room — that is too much work. So you place a shiny, unlocked safe in one hallway. The safe is fake. It holds nothing of value. But when the thief touches it, an alarm rings. A <b>honeypot</b> is that fake safe, built for computer networks. It is a system that looks real and interesting to attackers. It has no real users and no real data. Its only job is to attract attackers, so that defenders can see them.",
"<b>Why is this useful?</b> Normal security tools watch everything and raise many alarms. Most of those alarms are false alarms. A honeypot is different: nobody should ever touch it. So when somebody connects to it, that is almost always a real attacker. This makes honeypot alerts very trustworthy. In this exam you will see why that low false-alarm rate matters, and how one simple log line from a decoy can be worth more than a hundred generic warnings.",
"<b>Who works with honeypots?</b> <b>SOC analysts</b> (the people who watch security alarms all day) receive honeypot alerts and start investigations. <b>Incident responders</b> use honeypot data to understand what an attacker did. <b>Security engineers</b> build, place and maintain the decoys. <b>GRC teams</b> (governance, risk and compliance) check the legal rules, because a honeypot must not break laws. <b>Red teams</b> test the decoys to see if attackers could spot them. <b>Researchers</b> run honeypots to collect new attack samples and publish reports.",
"<b>What will you learn here?</b> This EASY exam covers the foundations, one idea at a time: what a honeypot is, the difference between low-interaction and high-interaction decoys, production versus research use, what a honeynet is, and which well-known tools (Cowrie, Dionaea, Honeyd, OpenCanary) pretend to be which services. You will read your first honeypot alert, decide the next simple step, and type one guided log command. Read each scenario slowly — every question tells you exactly what to look at."
],

EXS=[
{id:"e1",title:"What is the decoy called?",type:"qcm",
scenario:{text:"You start your first week in the SOC. The team lead shows you a server called FS-DECOY-01. It looks like a normal file server. But it has no real users and no real files. Its only job is to attract attackers, so the team can see them."},
question:"What is a system like FS-DECOY-01 called?",
hint:"This is about the fake target that the team set up on purpose.",
answer:{opts:[{t:"A firewall"},{t:"A honeypot",c:true},{t:"A proxy server"},{t:"A backup server"}]},
feedback:{why:"A honeypot is a fake system with no real users. Its only job is to attract attackers, so the team gets a strong signal when someone touches it. A firewall blocks traffic, a proxy forwards it, and a backup server stores copies of data — none of these is a trap set on purpose.",study:"Re-read the exam introduction, first paragraph: the fake safe example."}},
{id:"e2",title:"Match each system to its job",type:"match",
scenario:{text:"Your team lead asks you to sort a short list from the asset inventory. Match each system to the job it actually does."},
question:"Drag each system (or click it, then click a box) into the right job box.",
hint:"Only one of these systems is fake on purpose.",
answer:{zones:[{id:"z1",label:"Decoy system"},{id:"z2",label:"Traffic filter"},{id:"z3",label:"Endpoint protection"},{id:"z4",label:"Data recovery"}],
items:[{id:"i1",t:"Honeypot",zone:"z1"},{id:"i2",t:"Firewall",zone:"z2"},{id:"i3",t:"Antivirus",zone:"z3"},{id:"i4",t:"Backup server",zone:"z4"}]},
feedback:{why:"The honeypot is the only system that exists to attract attackers. The firewall filters traffic, antivirus protects the endpoint, and the backup server exists to restore data. Knowing which box each tool belongs to keeps alert handling calm and fast.",study:"The introduction: who works with honeypots and what each role expects from them."}},
{id:"e3",title:"Low or high interaction?",type:"match",
scenario:{text:"A security engineer plans two honeypots for the lab. She writes six features on a whiteboard. Sort each feature into the right honeypot type."},
question:"Sort the six features into the Low-interaction and High-interaction boxes.",
hint:"Emulated means fake but convincing. A real operating system means the attacker can really type commands.",
answer:{zones:[{id:"low",label:"Low-interaction honeypot"},{id:"high",label:"High-interaction honeypot"}],
items:[{id:"f1",t:"Uses emulated services with scripted answers",zone:"low"},{id:"f2",t:"Small footprint, quick to deploy",zone:"low"},{id:"f3",t:"Fewer ways for an attacker to escape",zone:"low"},{id:"f4",t:"A real operating system the attacker can touch",zone:"high"},{id:"f5",t:"Records every attacker action in deep detail",zone:"high"},{id:"f6",t:"More realistic, but more work to maintain",zone:"high"}]},
feedback:{why:"Low-interaction honeypots fake a few services with scripted replies. They are small, fast to deploy and safer to run. High-interaction honeypots give the attacker a real system to touch, so they capture far more detail — but they need more care, more monitoring and stronger containment.",study:"The trade-off: realism against effort and risk."}},
{id:"e4",title:"Read the honeypot alert",type:"qcm",
scenario:{text:"This alert just appeared on the SOC screen.",artefacts:[{label:"SOC alert",lines:["03:14:07 — honeypot-fs-01 — New connection on port 445 (SMB) from 198[.]51[.]100[.]7","03:14:07 — note: honeypot-fs-01 has no real users and no business purpose"]}]},
question:"What should you think about this alert?",
hint:"Remember: no real user has any reason to connect to this host.",
answer:{opts:[{t:"A normal user made a mistake — close it"},{t:"It is a routine software update — ignore it"},{t:"The monitoring tool is broken — reboot it"},{t:"Someone touched a host nobody should touch — investigate",c:true}]},
feedback:{why:"A honeypot has no real users, so almost every connection to it is suspicious. Port 445 is the Windows file-sharing port, and an outside address touched it. This is exactly the strong, low-noise signal honeypots exist to give. False alarms are rare, so this alert deserves a real look.",study:"The introduction, paragraph two: why honeypot alerts are trustworthy."}},
{id:"e5",title:"Complete the definition",type:"fill",
scenario:{text:"A trainee asks you what a honeypot is. Finish the two sentences for her."},
question:"Pick the right word for each blank.",
hint:"First blank: the name of the fake system. Second blank: what an attacker creates when touching it.",
answer:{template:"A {{0}} is a fake target placed in a network to attract attackers. Because nobody should ever use it, every single {{1}} is worth a closer look.",
bank:["honeypot","connection","firewall","holiday"],correct:[0,1]},
feedback:{why:"The two words that carry this idea are 'honeypot' and 'connection'. The honeypot is the fake target; the connection is what the attacker creates when reaching it. 'Firewall' is a different tool with a different job, and 'holiday' is only a distractor.",study:"Say the definition out loud once — it anchors the whole topic."}},
{id:"e6",title:"Production or research?",type:"qcm",
scenario:{text:"Two organisations run honeypots. A bank places one inside its own network to catch attackers who are already inside. A university runs one on the open internet to collect new attack samples for a study."},
question:"Which pair of labels is correct?",
hint:"Ask yourself: what is the goal — protection of one organisation, or study of attacks in general?",
answer:{opts:[{t:"Bank = production honeypot; university = research honeypot",c:true},{t:"Bank = research honeypot; university = production honeypot"},{t:"Both are research honeypots"},{t:"Both are production honeypots"}]},
feedback:{why:"A production honeypot protects the organisation that runs it — the bank uses it to detect real attacks inside its own network. A research honeypot exists to learn about attacks in general — the university collects samples to study and publish. Same tool, different goal.",study:"The two purposes of decoys: protection versus study."}},
{id:"e7",title:"Find the false statement",type:"qcm",
scenario:{text:"A new colleague says four things about honeypots in the stand-up meeting. One of them is wrong."},
question:"Which statement is false?",
hint:"Think about what a honeypot can and cannot do by itself.",
answer:{opts:[{t:"A honeypot can show you what tools attackers use"},{t:"Almost every connection to a honeypot is worth checking"},{t:"A honeypot alone can stop an attacker from entering the network",c:true},{t:"A honeypot can give an early warning during an attack"}]},
feedback:{why:"A honeypot is a detection and learning tool. It does not block anything by itself. Saying it 'stops attackers from entering' creates a false sense of safety — that is exactly the wrong belief. The other three statements are true benefits of running decoys.",study:"What honeypots do (detect, observe, teach) versus what they do not do (prevent)."}},
{id:"e8",title:"Match the tool to the service",type:"match",
scenario:{text:"You skim a vendor blog about honeypot tools. Match each tool to what it pretends to be or does."},
question:"Place each description under the right tool name.",
hint:"Cowrie and Dionaea both capture attacker activity, but one focuses on shells and the other on malware.",
answer:{zones:[{id:"cowrie",label:"Cowrie"},{id:"dionaea",label:"Dionaea"},{id:"honeyd",label:"Honeyd"},{id:"opencanary",label:"OpenCanary"}],
items:[{id:"t1",t:"Fake SSH and Telnet server that records typed commands",zone:"cowrie"},{id:"t2",t:"Catches malware over services such as SMB",zone:"dionaea"},{id:"t3",t:"Pretends to be many different hosts at once",zone:"honeyd"},{id:"t4",t:"Runs small decoy services and sends simple alerts",zone:"opencanary"}]},
feedback:{why:"Cowrie emulates SSH and Telnet and logs every command the attacker types. Dionaea offers vulnerable services such as SMB and captures the malware dropped onto them. Honeyd can simulate whole networks of fake hosts from one machine. OpenCanary is a light decoy that alerts when its few services are touched.",study:"One-line memory hooks for the four classic tools."}},
{id:"e9",title:"Where should it live?",type:"qcm",
scenario:{text:"Your manager wants to catch attackers who are already inside the company network and moving from computer to computer."},
question:"Where should this honeypot be placed?",
hint:"You want to see lateral movement — attacker movement inside the network.",
answer:{opts:[{t:"Only on the open internet"},{t:"On the CEO's laptop"},{t:"Inside the backup tape safe"},{t:"Inside the internal network",c:true}]},
feedback:{why:"To catch an attacker who is already inside, the decoy must sit where the attacker walks: the internal network. An internet-facing honeypot mostly sees automated scans from outside. A laptop is an endpoint, not a decoy position, and a tape safe is not even on the network.",study:"Placement follows the goal: outside decoys study scanners, inside decoys catch intruders."}},
{id:"e10",title:"Show the log tail",type:"term",
scenario:{text:"The team's SSH honeypot is called Cowrie. It writes its log to /var/log/cowrie/cowrie.log. The team lead says: 'Show me the last 20 lines of that log.' You are on the honeypot host in a normal user shell.",artefacts:[
{label:"Syntax reminder — example uses a different file, do not copy it",lines:["$ tail -n 15 /var/log/auth.log","  tail      = print the end of a file","  -n 15     = show the last 15 lines","  /var/log/auth.log = the file to read"]},
{label:"Expected output shape (example on another file)",lines:["$ tail -n 3 /var/log/cron","Mar 12 09:10:01 lab CRON[412]: session opened for user backup","Mar 12 09:10:01 lab CRON[412]: session closed for user backup","Mar 12 09:15:01 lab CRON[419]: session opened for user backup"]}]},
question:"Type the command that shows the last 20 lines of /var/log/cowrie/cowrie.log.",
hint:"The tool is tail — it shows the end of a file. The option -n sets how many lines to show.",
term:{prompt:"analyst@hp-lab:~$",banner:["Cowrie honeypot host — Ubuntu 22.04 — normal user shell","Log file: /var/log/cowrie/cowrie.log"],
check:function(cmd){var p=cmd.split(" ");if(p[0].toLowerCase()!=="tail")return {kind:"unknown",out:[p[0]+": command not found"]};
var n=10,path=null,i;
for(i=1;i<p.length;i++){var a=p[i],la=a.toLowerCase();
if(la==="-n"){n=parseInt(p[i+1],10);i++;}
else if(la.indexOf("--lines=")===0){n=parseInt(la.slice(8),10);}
else if(/^-n[0-9]+$/i.test(a)){n=parseInt(a.slice(2),10);}
else if(/^-[0-9]+$/.test(a)){n=parseInt(a.slice(1),10);}
else if(a.charAt(0)==="-"){return {kind:"wrong",out:["tail: invalid option — "+a],note:"Unknown option "+a+". For this job you only need the line-count option."};}
else if(path===null){path=a;}
else{return {kind:"wrong",out:["tail: extra argument — "+a],note:"Only one file is needed here."};}}
if(!path)return {kind:"wrong",out:["tail: no file given"],note:"The command must name the log file to read."};
path=path.replace(/\/+$/,"");
if(path!=="/var/log/cowrie/cowrie.log")return {kind:"wrong",out:["tail: cannot open "+path+": No such file or directory"],note:"The path must be exactly /var/log/cowrie/cowrie.log."};
if(n!==20||isNaN(n))return {kind:"wrong",out:["(the last "+n+" lines would appear)"],note:"The team lead asked for the last 20 lines — set the count to 20."};
return {kind:"ok",out:["Mar 11 04:02:11 hp-lab cowrie: New connection from 198[.]51[.]100[.]23:44119","Mar 11 04:03:05 hp-lab cowrie: login attempt root/123456 — FAILED","Mar 11 04:04:10 hp-lab cowrie: login success pi — session 7d2c","Mar 11 04:05:44 hp-lab cowrie: command: uname -a","… (16 more lines)"]};},
canonical:"tail -n 20 /var/log/cowrie/cowrie.log",
parts:["<b>tail</b> — prints the end of a file. It is the standard tool for the newest lines of a growing log.","<b>-n 20</b> — show the last 20 lines. <b>tail -20</b> is a common shortcut for the same thing.","<b>/var/log/cowrie/cowrie.log</b> — the file to read: the Cowrie honeypot log."]},
feedback:{why:"tail is the right tool for the newest lines of a growing log. The -n 20 option limits the output to the last 20 lines, and the path points at the Cowrie log. In real work this is often your first look at what an attacker just did.",study:"tail and its line-count options — you will use them every shift."}},
{id:"e11",title:"Pick the next step",type:"match",
scenario:{text:"A honeypot alert just fired on your screen. The honeypot is an internal decoy server. Something touched its SSH port from an unknown internal address."},

feedback:{why:"The first step after any honeypot alert is to read the details — source address, port, time — and inform the team lead or the on-call analyst. Shutting down a whole network or deleting the honeypot destroys evidence and business value for no reason, and a company-wide password reset is far too heavy for a first signal.",study:"Calm first steps: look, understand, report — escalate later with facts."}}
