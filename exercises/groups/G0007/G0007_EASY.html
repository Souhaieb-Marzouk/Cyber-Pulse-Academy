/* ---------- widget renderers ---------- */
function renderWidget(ex, idx) {
  var t = ex.type;
  if (t === 'qcm') {
    var h = '<div class="opts" id="opts" role="' + (ex.multi ? 'group' : 'radiogroup') + '">';
    var optOrder = ex.shuffledOpts || (ex.shuffledOpts = shuffle(ex.options));
    for (var i = 0; i < optOrder.length; i++) {
      var o = optOrder[i];
      h += '<button type="button" class="opt" data-oid="' + o.id + '"><span class="olabel">' + o.id + '.</span><span>' + esc(o.text) + '</span><span class="sel-ind" aria-hidden="true"></span></button>';
    }
    h += '</div>';
    if (ex.multi) { h += '<p class="subtle" style="margin-top:8px">Select all that apply \u2014 partial credit applies.</p>'; }
    return h;
  }
  if (t === 'dnd') {
    var h2 = '<p class="subtle" style="margin-bottom:6px">Drag each item to a zone (or click an item, then click a zone). Items:</p>';
    h2 += '<div class="bank" id="bank">';
    var itOrder = ex.shuffledItems || (ex.shuffledItems = shuffle(ex.items));
    for (var a = 0; a < itOrder.length; a++) {
      var it = itOrder[a];
      h2 += '<span class="chipitem" draggable="true" data-iid="' + it.id + '" tabindex="0" role="button" aria-label="Item: ' + esc(it.text) + '">' + esc(it.text) + '</span>';
    }
    h2 += '</div><div class="zones" id="zones">';
    for (var z = 0; z < ex.zones.length; z++) {
      var zn = ex.zones[z];
      h2 += '<div class="zone" data-zid="' + zn.id + '" tabindex="0" role="group" aria-label="Drop zone: ' + esc(zn.label) + '"><div class="zlabel"><span aria-hidden="true">\u{1F4E5}</span>' + esc(zn.label) + '</div><div class="zdrop"></div></div>';
    }
    h2 += '</div>';
    return h2;
  }
  if (t === 'match') {
    var h3 = '<p class="subtle" style="margin-bottom:6px">Assign each item on the left to the matching chip on the right (click a slot, then a chip \u2014 or drag).</p>';
    h3 += '<div id="matchrows">';
    var pOrder = ex.shuffledPairs || (ex.shuffledPairs = shuffle(ex.pairs));
    var rOrder = ex.shuffledRights || (ex.shuffledRights = shuffle(ex.pairs.map(function (p, n) { return p.r + '\u0000' + n; })));
    for (var m = 0; m < pOrder.length; m++) {
      var pr = pOrder[m];
      h3 += '<div class="matchrow"><div class="ml">' + esc(pr.l) + '</div><div class="arrow" aria-hidden="true">\u2192</div><div class="mslot" data-lidx="' + m + '" tabindex="0" role="group" aria-label="Slot for ' + esc(pr.l) + '"><span class="mslot-hint subtle">click, then pick a chip</span></div></div>';
    }
    h3 += '</div><div class="bank" id="mbank">';
    for (var r2 = 0; r2 < rOrder.length; r2++) {
      var rt = rOrder[r2].split('\u0000')[0];
      h3 += '<span class="chipitem" draggable="true" data-mval="' + esc(rt) + '" tabindex="0" role="button" aria-label="Option: ' + esc(rt) + '">' + esc(rt) + '</span>';
    }
    h3 += '</div>';
    return h3;
  }
  if (t === 'order') {
    var h4 = '<p class="subtle" style="margin-bottom:6px">Put the steps in the correct order. Use the arrows (or drag rows). Each correctly placed step earns credit.</p>';
    h4 += '<div class="orderlist" id="orderlist">';
    var sOrder = ex.shuffledSteps || (ex.shuffledSteps = shuffle(ex.steps.map(function (_, n) { return n; })));
    for (var s = 0; s < sOrder.length; s++) {
      var si = sOrder[s];
      h4 += '<div class="orow" draggable="true" data-sidx="' + si + '"><span class="posnum">' + (s + 1) + '</span><span class="otext">' + esc(ex.steps[si].text) + '</span><span class="obtns"><button type="button" data-mv="up" aria-label="Move step up">\u2191</button><button type="button" data-mv="down" aria-label="Move step down">\u2193</button></span></div>';
    }
    h4 += '</div>';
    return h4;
  }
  if (t === 'fill') {
    var h5 = '<p class="filltext" id="filltext">';
    var parts = ex.sentence.split('{{');
    for (var p = 0; p < parts.length; p++) {
      var seg = parts[p];
      var bm = seg.match(/^(\w+)}}([\s\S]*)$/);
      if (bm) {
        var bid = bm[1];
        h5 += '<select class="fillselect" data-bid="' + bid + '" aria-label="Blank ' + bid + '"><option value="">\u2014 pick \u2014</option></select>' + esc(bm[2]);
      } else { h5 += esc(seg); }
    }
    h5 += '</p>';
    var bankOpts = ex.shuffledBank || (ex.shuffledBank = shuffle(ex.bank));
    h5 += '<div class="banktitle">WORD BANK (order is random):</div><div class="bank">';
    for (var b = 0; b < bankOpts.length; b++) { h5 += '<span class="chipitem" style="cursor:default">' + esc(bankOpts[b]) + '</span>'; }
    h5 += '</div>';
    return h5;
  }
  if (t === 'branch') {
    return '<div class="opts" id="opts" role="group"></div><div class="stepdone" id="stepdone"></div>';
  }
  return '';
}



/* ---------- widget wiring ---------- */
function wireWidget(ex, idx) {
  var t = ex.type;
  if (t === 'qcm') {
    var opts = document.querySelectorAll('#opts .opt');
    for (var i = 0; i < opts.length; i++) {
      (function (btn) {
        btn.onclick = function () {
          if (btn.classList.contains('locked')) { return; }
          if (ex.multi) {
            btn.classList.toggle('selected');
            var ind = btn.querySelector('.sel-ind');
            if (ind) { ind.textContent = btn.classList.contains('selected') ? '\u2713 selected' : ''; }
          } else {
            for (var j = 0; j < opts.length; j++) { opts[j].classList.remove('selected'); var ix = opts[j].querySelector('.sel-ind'); if (ix) { ix.textContent = ''; } }
            btn.classList.add('selected');
            var ind2 = btn.querySelector('.sel-ind'); if (ind2) { ind2.textContent = '\u2713 selected'; }
          }
        };
      })(opts[i]);
    }
  }
  if (t === 'dnd') { wireDnD(ex); }
  if (t === 'match') { wireMatch(ex); }
  if (t === 'order') { wireOrder(ex); }
  if (t === 'fill') { wireFill(ex); }
  if (t === 'branch') { wireBranch(ex); }
}

/* --- dnd: click-to-place + pointer drag --- */
function wireDnD(ex) {
  var sel = null;
  var chips = document.querySelectorAll('#bank .chipitem');
  var zones = document.querySelectorAll('#zones .zone');
  function placeInZone(chip, zone) {
    if (!chip || !zone) { return; }
    var zdrop = zone.querySelector('.zdrop');
    zdrop.appendChild(chip);
    chip.classList.remove('sel');
    chip.setAttribute('aria-label', 'Item ' + chip.textContent + ' placed in ' + zone.getAttribute('data-zid'));
  }
  for (var i = 0; i < chips.length; i++) {
    (function (chip) {
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        if (chip.classList.contains('used')) { return; }
        if (chip.parentNode.parentNode && chip.parentNode.classList.contains('zdrop')) {
          /* inside a zone: return to bank */
          document.getElementById('bank').appendChild(chip);
          chip.classList.remove('sel');
          return;
        }
        for (var k = 0; k < chips.length; k++) { chips[k].classList.remove('sel'); }
        chip.classList.add('sel'); sel = chip;
      });
      chip.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chip.click(); }
      });
      chip.addEventListener('dragstart', function (e) { chip.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', chip.getAttribute('data-iid')); } catch (err) {} });
      chip.addEventListener('dragend', function () { chip.classList.remove('dragging'); for (var z = 0; z < zones.length; z++) { zones[z].classList.remove('droptarget'); } });
    })(chips[i]);
  }
  for (var z = 0; z < zones.length; z++) {
    (function (zone) {
      zone.addEventListener('click', function () {
        if (sel) { placeInZone(sel, zone); sel = null; }
      });
      zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' && sel) { placeInZone(sel, zone); sel = null; } });
      zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('droptarget'); });
      zone.addEventListener('dragleave', function () { zone.classList.remove('droptarget'); });
      zone.addEventListener('drop', function (e) {
        e.preventDefault(); zone.classList.remove('droptarget');
        var id = e.dataTransfer.getData('text/plain');
        var chip = document.querySelector('#bank .chipitem[data-iid="' + id + '"], .zdrop .chipitem[data-iid="' + id + '"]');
        if (chip) { placeInZone(chip, zone); }
      });
    })(zones[z]);
  }
}

/* --- match --- */
function wireMatch(ex) {
  var selSlot = null;
  var slots = document.querySelectorAll('.mslot');
  var chips = document.querySelectorAll('#mbank .chipitem');
  for (var i = 0; i < slots.length; i++) {
    (function (slot) {
      slot.addEventListener('click', function () {
        for (var k = 0; k < slots.length; k++) { slots[k].style.borderColor = ''; }
        if (slot.querySelector('.chipitem')) { /* occupied: clear it */
          var old = slot.querySelector('.chipitem');
          if (old) { old.classList.remove('used'); document.getElementById('mbank').appendChild(old); }
          slot.classList.remove('filled');
          slot.innerHTML = '<span class="mslot-hint subtle">click, then pick a chip</span>';
          return;
        }
        slot.style.borderColor = 'var(--accent-green)';
        selSlot = slot;
      });
      slot.addEventListener('dragover', function (e) { e.preventDefault(); });
      slot.addEventListener('drop', function (e) {
        e.preventDefault();
        var val = e.dataTransfer.getData('text/plain');
        var chip = document.querySelector('#mbank .chipitem[data-mval="' + CSS.escape(val) + '"]');
        if (chip) { assignChip(slot, chip); }
      });
    })(slots[i]);
  }
  function assignChip(slot, chip) {
    if (chip.classList.contains('used')) { return; }
    var existing = slot.querySelector('.chipitem');
    if (existing) { existing.classList.remove('used'); document.getElementById('mbank').appendChild(existing); }
    slot.innerHTML = '';
    var c2 = chip.cloneNode(true);
    c2.classList.remove('used', 'sel');
    c2.setAttribute('tabindex', '-1');
    slot.appendChild(c2);
    slot.classList.add('filled');
    chip.classList.add('used');
    selSlot = null;
  }
  for (var j = 0; j < chips.length; j++) {
    (function (chip) {
      chip.addEventListener('click', function () {
        if (chip.classList.contains('used')) { return; }
        if (selSlot) { assignChip(selSlot, chip); }
        else {
          var firstEmpty = null;
          for (var k = 0; k < slots.length; k++) { if (!slots[k].querySelector('.chipitem')) { firstEmpty = slots[k]; break; } }
          if (firstEmpty) { assignChip(firstEmpty, chip); }
        }
      });
      chip.addEventListener('dragstart', function (e) { try { e.dataTransfer.setData('text/plain', chip.getAttribute('data-mval')); } catch (err) {} });
    })(chips[j]);
  }
}

/* --- order --- */
function wireOrder(ex) {
  var list = document.getElementById('orderlist');
  function renumber() {
    var rows = list.querySelectorAll('.orow');
    for (var i = 0; i < rows.length; i++) { rows[i].querySelector('.posnum').textContent = (i + 1); }
  }
  function moveRow(row, dir) {
    var rows = Array.prototype.slice.call(list.querySelectorAll('.orow'));
    var i = rows.indexOf(row);
    var j = i + dir;
    if (j < 0 || j >= rows.length) { return; }
    if (dir > 0) { list.insertBefore(row, rows[j].nextSibling); } else { list.insertBefore(row, rows[j]); }
    renumber();
  }
  var btns = list.querySelectorAll('button[data-mv]');
  for (var b = 0; b < btns.length; b++) {
    (function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); moveRow(btn.parentNode.parentNode, btn.getAttribute('data-mv') === 'up' ? -1 : 1); };
    })(btns[b]);
  }
  var rows = list.querySelectorAll('.orow');
  for (var r = 0; r < rows.length; r++) {
    (function (row) {
      row.addEventListener('dragstart', function (e) { row.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', row.getAttribute('data-sidx')); } catch (err) {} });
      row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        var id = e.dataTransfer.getData('text/plain');
        var src = list.querySelector('.orow[data-sidx="' + id + '"]');
        if (src && src !== row) { list.insertBefore(src, row); renumber(); }
      });
    })(rows[r]);
  }
}

/* --- fill --- */
function wireFill(ex) {
  var sels = document.querySelectorAll('.fillselect');
  var bankOpts = ex.shuffledBank || [];
  for (var i = 0; i < sels.length; i++) {
    (function (sel) {
      for (var b = 0; b < bankOpts.length; b++) {
        var op = document.createElement('option');
        op.value = bankOpts[b]; op.textContent = bankOpts[b];
        sel.appendChild(op);
      }
    })(sels[i]);
  }
}

/* --- branch --- */
function wireBranch(ex) {
  S.branchStep = 0;
  S.branchPicks = [];
  renderBranchStep(ex);
}
function renderBranchStep(ex) {
  var step = ex.branch[S.branchStep];
  var box = document.getElementById('opts');
  var h = '';
  for (var i = 0; i < step.options.length; i++) {
    h += '<button type="button" class="opt" data-oid="' + i + '"><span class="olabel">' + String.fromCharCode(65 + i) + '.</span><span>' + esc(step.options[i]) + '</span><span class="sel-ind" aria-hidden="true"></span></button>';
  }
  box.innerHTML = h;
  var opts = box.querySelectorAll('.opt');
  for (var j = 0; j < opts.length; j++) {
    (function (btn) {
      btn.onclick = function () {
        for (var k = 0; k < opts.length; k++) { opts[k].classList.remove('selected'); var ix = opts[k].querySelector('.sel-ind'); if (ix) { ix.textContent = ''; } }
        btn.classList.add('selected');
        var ind = btn.querySelector('.sel-ind'); if (ind) { ind.textContent = '\u2713 selected'; }
      };
    })(opts[j]);
  }
  var badge = document.getElementById('stepbadge');
  if (badge) { badge.textContent = 'STEP ' + (S.branchStep + 1) + ' OF ' + ex.branch.length; }
  var qt = document.getElementById('qtext');
  if (qt) { qt.textContent = ex.branch[S.branchStep].q; }
  var checkBtn = document.getElementById('btn-check');
  if (checkBtn) { checkBtn.textContent = (S.branchStep < ex.branch.length - 1) ? '\u25B6 Confirm step' : '\u2713 Check'; }
}
function branchAdvance(ex, idx) {
  var step = ex.branch[S.branchStep];
  var sel = document.querySelector('#opts .opt.selected');
  var done = document.getElementById('stepdone');
  if (!sel) {
    /* nudge instead of silently doing nothing (no timer pause here) */
    if (done) {
      var nudge = document.createElement('div');
      nudge.innerHTML = '<span class="s-nudge">\u26A0 Pick an option first \u2014 the step is not confirmed yet.</span>';
      done.appendChild(nudge);
    }
    return false;
  }
  var pick = parseInt(sel.getAttribute('data-oid'), 10);
  var ok = pick === step.correct;
  S.branchPicks.push(pick);
  var line = document.createElement('div');
  line.innerHTML = 'STEP ' + (S.branchStep + 1) + ': ' + (ok ? '<span class="s-ok">\u2713 correct</span>' : '<span class="s-no">\u2717 not the best choice</span>') + ' <span class="subtle">' + esc(step.why) + '</span>';
  done.appendChild(line);
  S.branchStep++;
  if (S.branchStep < ex.branch.length) { renderBranchStep(ex); return false; }
  return true;
}

/* ================= grading ================= */
function collectAnswer(ex) {
  var t = ex.type;
  if (t === 'qcm') {
    var sel = [];
    var s = document.querySelectorAll('#opts .opt.selected');
    for (var i = 0; i < s.length; i++) { sel.push(s[i].getAttribute('data-oid')); }
    return sel;
  }
  if (t === 'dnd') {
    var zones = document.querySelectorAll('#zones .zone');
    var map = {};
    for (var z = 0; z < zones.length; z++) {
      var zid = zones[z].getAttribute('data-zid');
      var ch = zones[z].querySelectorAll('.zdrop .chipitem');
      for (var c = 0; c < ch.length; c++) { map[ch[c].getAttribute('data-iid')] = zid; }
    }
    return map;
  }
  if (t === 'match') {
    var slots = document.querySelectorAll('.mslot');
    var arr = [];
    for (var s2 = 0; s2 < slots.length; s2++) {
      var chip = slots[s2].querySelector('.chipitem');
      arr.push(chip ? chip.getAttribute('data-mval') : null);
    }
    return arr;
  }
  if (t === 'order') {
    var rows = document.querySelectorAll('#orderlist .orow');
    var ord = [];
    for (var r = 0; r < rows.length; r++) { ord.push(parseInt(rows[r].getAttribute('data-sidx'), 10)); }
    return ord;
  }
  if (t === 'fill') {
    var sels = document.querySelectorAll('.fillselect');
    var vals = {};
    for (var f = 0; f < sels.length; f++) { vals[sels[f].getAttribute('data-bid')] = sels[f].value; }
    return vals;
  }
  if (t === 'branch') { return S.branchPicks.slice(); }
  return null;
}

function gradeItems(ex, ans) {
  /* returns {N, rows:[{icon,label,text,ok}], credit0}
     rows ok: true (correct pick), false (wrong pick), 'miss' (missed correct item) */
  var t = ex.type, rows = [], N = 0, H = 0, W = 0;
  if (t === 'qcm') {
    var corr = ex.correct;
    if (ex.multi) {
      N = corr.length;
      for (var i = 0; i < ex.options.length; i++) {
        var o = ex.options[i], isC = corr.indexOf(o.id) !== -1, wasSel = ans.indexOf(o.id) !== -1;
        if (isC && wasSel) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: o.text }); }
        else if (!isC && wasSel) { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: o.text }); }
        else if (isC && !wasSel) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: o.text }); }
      }
    } else {
      N = 1;
      var co = null;
      for (var k = 0; k < ex.options.length; k++) { if (ex.options[k].id === corr[0]) { co = ex.options[k]; } }
      if (ans.length === 1 && ans[0] === corr[0]) { H = 1; rows.push({ ok: true, label: '\u2713 Correct', text: co.text }); }
      else if (ans.length === 0) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: co.text }); }
      else {
        W = 1;
        var wsel = null;
        for (var w = 0; w < ex.options.length; w++) { if (ex.options[w].id === ans[0]) { wsel = ex.options[w]; } }
        rows.push({ ok: false, label: '\u2717 Wrong', text: wsel ? wsel.text : '(no answer)' });
        rows.push({ ok: 'miss', label: '\u25CB Missed', text: co.text });
      }
    }
  }
  if (t === 'dnd') {
    N = ex.items.length;
    for (var d = 0; d < ex.items.length; d++) {
      var it = ex.items[d];
      var placed = ans[it.id];
      if (placed === it.zone) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: '"' + it.text + '" \u2192 ' + zoneLabel(ex, it.zone) }); }
      else if (placed === undefined || placed === null) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: '"' + it.text + '" \u2192 ' + zoneLabel(ex, it.zone) }); }
      else { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: '"' + it.text + '" \u2192 ' + zoneLabel(ex, it.zone) }); }
    }
  }
  if (t === 'match') {
    N = ex.pairs.length;
    var pOrder = ex.shuffledPairs || ex.pairs;
    for (var m = 0; m < pOrder.length; m++) {
      var pr = pOrder[m];
      if (ans[m] === pr.r) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: pr.l + ' \u2192 ' + pr.r }); }
      else if (!ans[m]) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: pr.l + ' \u2192 ' + pr.r }); }
      else { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: pr.l + ' \u2192 ' + ans[m] }); }
    }
  }
  if (t === 'order') {
    N = ex.steps.length;
    for (var s = 0; s < ex.steps.length; s++) {
      var pos = ans.indexOf(s);
      if (pos === s) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: 'Step ' + (s + 1) + ': ' + ex.steps[s].text }); }
      else { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: 'Step ' + (s + 1) + ' should be: ' + ex.steps[s].text }); }
    }
  }
  if (t === 'fill') {
    N = ex.blanks.length;
    for (var b = 0; b < ex.blanks.length; b++) {
      var bl = ex.blanks[b];
      var okSet = [bl.correct].concat(bl.accept || []).map(function (s) { return String(s).toLowerCase().trim(); });
      var v = String(ans[bl.id] || '').toLowerCase().trim();
      if (okSet.indexOf(v) !== -1) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: bl.hint + ' \u2192 ' + bl.correct }); }
      else if (!v) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: bl.hint + ' \u2192 ' + bl.correct }); }
      else { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: bl.hint + ' \u2192 ' + bl.correct + ' (you chose: ' + v + ')' }); }
    }
  }
  if (t === 'branch') {
    N = ex.branch.length;
    for (var st = 0; st < ex.branch.length; st++) {
      var bp = ans[st];
      var okb = bp === ex.branch[st].correct;
      if (okb) { H++; rows.push({ ok: true, label: '\u2713 Correct', text: 'Step ' + (st + 1) + ': ' + ex.branch[st].options[bp] }); }
      else if (bp === undefined || bp === null) { rows.push({ ok: 'miss', label: '\u25CB Missed', text: 'Step ' + (st + 1) + ': ' + ex.branch[st].options[ex.branch[st].correct] }); }
      else { W++; rows.push({ ok: false, label: '\u2717 Wrong', text: 'Step ' + (st + 1) + ' best choice: ' + ex.branch[st].options[ex.branch[st].correct] }); }
    }
  }
  var credit0 = scoreExercise(H, N, W);
  return { N: N, rows: rows, credit0: credit0, H: H, W: W };
}

function zoneLabel(ex, zid) {
  for (var i = 0; i < ex.zones.length; i++) { if (ex.zones[i].id === zid) { return ex.zones[i].label; } }
  return zid;
}



/* ================= check flow ================= */
function lockWidget(ex) {
  var els = document.querySelectorAll('#ansbody button, #ansbody input, #ansbody select');
  for (var i = 0; i < els.length; i++) { els[i].disabled = true; els[i].classList.add('locked'); }
  var btns = ['btn-check', 'btn-hint', 'btn-skip', 'btn-hint2', 'btn-skip2'];
  for (var b = 0; b < btns.length; b++) { var el = document.getElementById(btns[b]); if (el) { el.disabled = true; } }
}

function showOptMarks(ex) {
  if (ex.type !== 'qcm') { return; }
  var opts = document.querySelectorAll('#opts .opt');
  for (var i = 0; i < opts.length; i++) {
    var oid = opts[i].getAttribute('data-oid');
    var isC = ex.correct.indexOf(oid) !== -1;
    var isSel = opts[i].classList.contains('selected');
    if (isC) { opts[i].classList.add('correct-show'); }
    if (isSel && !isC) { opts[i].classList.add('wrong-show'); }
  }
}

function feedbackHTML(ex, idx, credit, grade) {
  var lbl, cls, icon;
  if (credit >= 1) { lbl = 'Correct'; cls = 'fb-correct'; icon = '\u2713'; }
  else if (credit > 0) { lbl = 'Partially correct'; cls = 'fb-partial'; icon = '\u2713'; }
  else { lbl = 'Incorrect'; cls = 'fb-incorrect'; icon = '\u2717'; }
  var h = '<div class="feedback ' + cls + '"><div class="fb-head"><span aria-hidden="true">' + icon + '</span> ' + lbl;
  if (grade.N > 1) { h += ' <span class="fb-credit" style="margin-left:auto">credit ' + credit.toFixed(2) + ' \u2014 ' + grade.H + '/' + grade.N + ' items (formula: max(0, (' + grade.H + ' \u2212 ' + grade.W + ') / ' + grade.N + '))' + (S.hintUsed[idx] ? ', \u22120.10 hint' : '') + '</span>'; }
  h += '</div><div class="fb-body">';
  if (grade.N > 1) {
    h += '<div class="itemrows">';
    for (var i = 0; i < grade.rows.length; i++) {
      var r = grade.rows[i];
      var ccls = r.ok === true ? 'i-ok' : (r.ok === false ? 'i-no' : 'i-miss');
      h += '<div class="itemrow ' + ccls + '"><span class="iv">' + r.label + '</span><span>' + esc(r.text) + '</span></div>';
    }
    h += '</div>';
  }
  if (ex.persp) {
    h += '<div class="persp"><div class="pcard red"><div class="pt">\u{1F5E1} Attacker perspective</div>' + ex.persp.red + '</div><div class="pcard blue"><div class="pt">\u{1F6E1} Defender perspective</div>' + ex.persp.blue + '</div></div>';
  }
  h += '<div class="explain" style="margin-top:10px">' + ex.explanation;
  if (credit < 1 && ex.wrongStudy) { h += '<span class="whystudy"><b>What to study:</b> ' + esc(ex.wrongStudy) + '</span>'; }
  h += '</div></div></div>';
  return h;
}

function checkAnswer(ex, idx) {
  if (S.answered[idx]) { return; }
  if (ex.type === 'branch' && S.branchStep < ex.branch.length) {
    var last = branchAdvance(ex, idx);
    if (!last) { return; } /* intermediate step confirmed; timer keeps running (no auto-pause) */
  }
  var ans = collectAnswer(ex);
  if (ex.type === 'qcm' && ans.length === 0) {
    var q = document.getElementById('qtext');
    if (q) { q.textContent = 'Please select an answer first (or press Skip if you want to come back later). ' + (ex.type === 'branch' ? ex.branch[S.branchStep].q : ex.question); }
    return;
  }
  if (ex.type === 'branch' && S.branchStep >= ex.branch.length && S.branchPicks.length < ex.branch.length) { return; }
  var grade = gradeItems(ex, ans);
  var credit = grade.credit0;
  if (S.hintUsed[idx]) { credit = Math.max(0, credit - 0.10); }
  S.credits[idx] = credit;
  S.answered[idx] = { credit: credit };

  lockWidget(ex);
  showOptMarks(ex);
  $('feedbackzone').innerHTML = feedbackHTML(ex, idx, credit, grade);

  /* Check-triggered auto-pause: stop the timer, keep exercise + feedback visible */
  setTimerState(TSTATE.PAUSED_AUTO_CHECK);
  renderHeader();

  /* replace Check with Next / Final Submit */
  var btns = document.getElementById('exbtns');
  var isLastAnswered = true;
  for (var i = 0; i < S.order.length; i++) {
    var j = S.order[i];
    if (!S.answered[j] && S.skipped.indexOf(j) === -1) { isLastAnswered = false; break; }
  }
  var label = (isLastAnswered ? (S.skipped.length > 0 ? '\u23ED Review skipped (' + S.skipped.length + ') then finish' : '\u{1F3C1} Final Submit') : 'Next \u25B6');
  btns.innerHTML = '<button class="btn primary" id="btn-next" aria-label="Next exercise">' + label + '</button>';
  $('btn-next').onclick = function () {
    setTimerState(TSTATE.RUNNING);
    renderHeader();
    goNextOrFinish();
  };
  $('feedbackzone').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ================= review skipped ================= */
function openReview(timeOver) {
  S.phase = 'review';
  var v = $('view');
  var h = '<div class="brandbar"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path class="logo-sw1" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="none" stroke-width="1.6"/></svg><span class="bt"><b>Review skipped exercises</b></span></div><div class="topgrid" aria-hidden="true"></div>';
  h += '<div class="card"><h2>\u26A0 Skipped exercises (' + S.skipped.length + ')</h2>';
  if (timeOver || S.timeLeft <= 0) {
    h += '<p class="subtle" style="margin-bottom:10px">The timer has ended. You can no longer answer skipped exercises \u2014 they will be excluded from the score.</p>';
  } else {
    h += '<p class="subtle" style="margin-bottom:10px">You can return to any skipped exercise and answer it, as many times as you need, until the timer ends. Skipped exercises left unanswered are excluded from the score.</p>';
  }
  h += '<div class="reviewlist">';
  for (var i = 0; i < S.skipped.length; i++) {
    var idx = S.skipped[i];
    var ex = EX[idx];
    var lock = (timeOver || S.timeLeft <= 0);
    h += '<div class="reviewitem"><span class="skbadge" role="img" aria-label="Skipped">\u26A0 Skipped</span><span class="rtitle">' + esc(ex.short || ex.question.slice(0, 90) + '\u2026') + '</span>' +
      (lock ? '' : '<button class="btn primary" data-ret="' + idx + '" aria-label="Return to this exercise">\u21A9 Answer</button>') + '</div>';
  }
  h += '</div><div class="btnrow"><button class="btn green" id="btn-finish2" aria-label="Finish exam and see results">\u{1F3C1} Finish exam (' + S.skipped.length + ' will be excluded)</button></div></div>';
  v.innerHTML = h;
  renderHeader();
  var rbs = document.querySelectorAll('button[data-ret]');
  for (var r = 0; r < rbs.length; r++) {
    (function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute('data-ret'), 10);
        S.skipped = S.skipped.filter(function (x) { return x !== idx; });
        S.cur = S.order.indexOf(idx);
        S.phase = 'exam';
        renderExercise();
      };
    })(rbs[r]);
  }
  $('btn-finish2').onclick = function () { finishExam(); };
}

/* ================= results ================= */
function finishExam() {
  setTimerState(TSTATE.ENDED);
  S.phase = 'results';
  var answered = answeredCount();
  var cSum = creditSum();
  var scoreR = Math.round(cSum);
  var percent = roundedPercent(cSum, answered);
  if (!S.reported) { reportScore(cSum, answered); S.reported = true; }

  var full = 0, part = 0, wrong = 0, partCreditSum = 0;
  var skippedNow = S.skipped.length;
  for (var k in S.credits) {
    var c = S.credits[k];
    if (c >= 1) { full++; }
    else if (c > 0) { part++; partCreditSum += c; }
    else { wrong++; }
  }
  var pass = percent >= 70;
  var v = $('view');
  var h = '<div class="brandbar"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path class="logo-sw1" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="none" stroke-width="1.6"/></svg><span class="bt"><b>Exam results</b> \u2014 ' + esc(META.objectId) + ' ' + esc(sevWord()) + '</span></div><div class="topgrid" aria-hidden="true"></div>';

  h += '<div class="verdict ' + (pass ? 'pass' : 'fail') + '"><div class="vbig">' + (pass ? '\u2713 PASS' : '\u2717 FAIL') + ' \u2014 ' + scoreR + ' / ' + answered + ' (' + percent + '%)</div>';
  h += '<div class="vsub">Raw credit ' + cSum.toFixed(2) + ' over the ' + answered + ' exercise' + (answered === 1 ? '' : 's') + ' you answered. ' + (pass ? 'You reached the 70% pass mark for this certification exam on ' + esc(META.objectId) + '.' : 'You needed 70% over the exercises you answered. Review the feedback topics below and retake the exam \u2014 questions and options are reshuffled on every attempt.') + '</div></div>';

  h += '<div class="resgrid">';
  h += '<div class="rescard ok"><div class="rk">Fully correct</div><div class="rv">' + full + '</div></div>';
  h += '<div class="rescard part"><div class="rk">Partially correct</div><div class="rv">' + part + (part > 0 ? ' <span style="font-size:13px">(avg ' + (partCreditSum / part).toFixed(2) + ')</span>' : '') + '</div></div>';
  h += '<div class="rescard no"><div class="rk">Fully incorrect</div><div class="rv">' + wrong + '</div></div>';
  h += '<div class="rescard skip"><div class="rk">Skipped \u2014 excluded</div><div class="rv">' + skippedNow + '</div></div>';
  h += '</div>';

  h += '<div class="card"><h2>\u23F1 Time spent</h2><div class="timesum">Paused manually (breaks): ' + fmtT(Math.round(S.manualSecs)) + ' &nbsp;\u2022&nbsp; Paused while reading feedback: ' + fmtT(Math.round(S.autoSecs)) + ' &nbsp;\u2022&nbsp; Remaining budget: ' + fmtT(S.timeLeft) + '</div></div>';

  h += '<div class="card"><h2>\u{1F5DE} Your per-exercise results</h2><div class="reviewlist">';
  for (var i = 0; i < S.order.length; i++) {
    var idx = S.order[i];
    var ex = EX[idx];
    var st, cl;
    if (idx in S.credits) {
      var c = S.credits[idx];
      st = (c >= 1 ? '\u2713 Fully correct \u2014 credit ' + c.toFixed(2) : (c > 0 ? '\u2713 Partially correct \u2014 credit ' + c.toFixed(2) : '\u2717 Fully incorrect \u2014 credit 0.00'));
      cl = c >= 1 ? 'ok' : (c > 0 ? 'part' : 'no');
    } else if (S.skipped.indexOf(idx) !== -1) { st = '\u26A0 Skipped \u2014 excluded from score'; cl = 'skip'; }
    else { st = '\u25CB Not answered \u2014 excluded from score'; cl = 'skip'; }
    h += '<div class="reviewitem"><span class="skbadge ' + (cl === 'ok' ? 'st-ok' : cl === 'part' ? 'st-part' : cl === 'no' ? 'st-no' : '') + '">' + st + '</span><span class="rtitle">' + esc(ex.short || '') + '</span></div>';
  }
  h += '</div></div>';

  h += '<div class="btnrow"><button class="btn primary" id="btn-retake" aria-label="Retake the exam">\u21BA Retake Exam</button></div>';
  v.innerHTML = h;
  showExamChrome(false);
  $('btn-retake').onclick = function () {
    S.phase = 'intro';
    renderIntro();
    showExamChrome(false);
    window.scrollTo(0, 0);
  };
  window.scrollTo(0, 0);
}

/* ================= boot ================= */
document.addEventListener('DOMContentLoaded', function () {
  S.budget = META.estimatedMinutes * 60;
  S.timeLeft = S.budget;
  renderIntro();
  showExamChrome(false);
});

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
