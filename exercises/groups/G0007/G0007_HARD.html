<style>

:root {
  /* page + surfaces */
  --bg-page: #0b1020;        --bg-page-rgb: 11 16 32;
  --bg-surface: #121a2e;
  --bg-surface-2: #0f1729;
  --bg-deep: #070d18;
  --bg-hover: #18233d;
  --bg-input: #0a1120;
  --overlay-rgb: 7 10 20;
  --shadow-rgb: 0 0 0;
  --border: #243049;
  /* text */
  --text-primary: #e6ecff;
  --text-secondary: #a9b4d0;
  --text-mono: #c8ffd4;
  /* block accent family (fixed: blue / amber / green) */
  --accent-blue: #5aa9ff;    --accent-blue-rgb: 90 169 255;
  --accent-amber: #ffb454;   --accent-amber-rgb: 255 180 84;
  --accent-green: #57d38c;   --accent-green-rgb: 87 211 140;
  /* state colours */
  --state-correct: #57d38c;
  --state-partial: #ffb454;
  --state-incorrect: #ff6b6b;  --state-incorrect-rgb: 255 107 107;
  --state-skipped: #a9b4d0;
  --state-paused: #9d7bff;     --state-paused-rgb: 157 123 255;
  /* severity badge mapping (green / amber / orange / red) */
  --sev-easy: #57d38c;
  --sev-medium: #ffb454;
  --sev-hard: #ff8a3d;         --sev-hard-rgb: 255 138 61;
  --sev-extreme: #ff6b6b;
  /* monospace syntax highlight palette (dark-theme friendly) */
  --tok-ts: #7fd3ff;
  --tok-str: #e0c9ff;
  --tok-path: #9dd6ff;
  --tok-cve: #ff9d9d;
  --tok-id: #ffd27f;
  --tok-out: #b9c7e8;
  /* light text tints used on gradient buttons */
  --btn-primary-text: #dbeaff;
  --btn-green-text: #d9ffe8;
  --btn-warn-text: #ffe6c2;
  --btn-danger-text: #ffd9d9;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body { padding: 0 0 60px 0; min-height: 100vh; }
.wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
h1, h2, h3 { line-height: 1.25; }
button { font-family: inherit; }
a { color: var(--accent-blue); }
.mono, code, .log-line { font-family: var(--font-mono); }
:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top brand strip ---------- */
.brandbar { display: flex; align-items: center; gap: 10px; padding: 10px 0 2px 0; }
.brandbar .logo { width: 30px; height: 30px; flex: 0 0 auto; }
.logo-sw1 { stroke: var(--accent-blue); }
.logo-sw2 { stroke: var(--accent-green); }
.brandbar .bt { font-weight: 700; letter-spacing: .4px; font-size: 14px; color: var(--text-secondary); }
.brandbar .bt b { color: var(--text-primary); }
.topgrid { height: 3px; border-radius: 2px; margin: 8px 0 18px 0; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green), var(--accent-amber), var(--state-incorrect)); background-size: 300% 100%; animation: sheen 9s linear infinite; }

/* ---------- cards ---------- */
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 14px 0; box-shadow: 0 4px 14px rgb(var(--shadow-rgb) / .35); }
.card h2 { font-size: 18px; margin-bottom: 10px; color: var(--text-primary); }
.card h3 { font-size: 15.5px; margin: 12px 0 6px 0; color: var(--text-primary); }
.subtle { color: var(--text-secondary); font-size: 14px; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; letter-spacing: .6px; border: 1px solid transparent; white-space: nowrap; }
.badge.easy { background: rgb(var(--accent-green-rgb) / .12); color: var(--sev-easy); border-color: rgb(var(--accent-green-rgb) / .5); }
.badge.medium { background: rgb(var(--accent-amber-rgb) / .12); color: var(--sev-medium); border-color: rgb(var(--accent-amber-rgb) / .5); }
.badge.hard { background: rgb(var(--sev-hard-rgb) / .12); color: var(--sev-hard); border-color: rgb(var(--sev-hard-rgb) / .5); }
.badge.extreme { background: rgb(var(--state-incorrect-rgb) / .12); color: var(--sev-extreme); border-color: rgb(var(--state-incorrect-rgb) / .5); }
.badge.idbadge { background: rgb(var(--accent-blue-rgb) / .10); color: var(--accent-blue); border-color: rgb(var(--accent-blue-rgb) / .45); }
.badge.pausedb { background: rgb(var(--state-paused-rgb) / .12); color: var(--state-paused); border-color: rgb(var(--state-paused-rgb) / .5); }

/* ---------- facts strip (intro) ---------- */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.fact { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.fact .k { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; }
.fact .v { color: var(--text-primary); font-weight: 700; font-size: 15px; margin-top: 2px; }

/* ---------- keyword panels ---------- */
.kwgroup { background: var(--bg-surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent-blue); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.kwgroup .kw-title { font-weight: 700; color: var(--accent-blue); font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.kwgroup ul { list-style: none; }
.kwgroup li { padding: 3px 0 3px 18px; position: relative; color: var(--text-primary); font-size: 14.5px; }
.kwgroup li::before { content: "\25B8"; position: absolute; left: 2px; color: var(--text-secondary); }

/* ---------- rules list ---------- */
.rules { list-style: none; }
.rules li { padding: 7px 0 7px 30px; position: relative; border-bottom: 1px dashed var(--border); font-size: 15px; }
.rules li:last-child { border-bottom: none; }
.rules li::before { position: absolute; left: 4px; top: 7px; font-size: 15px; }
.rules li.r-check::before { content: "\25C9"; color: var(--accent-amber); }
.rules li.r-time::before { content: "\23F1"; color: var(--accent-blue); }
.rules li.r-part::before { content: "\25D1"; color: var(--accent-green); }
.rules li.r-skip::before { content: "\26A0"; color: var(--state-skipped); }
.rules li.r-hint::before { content: "\1F4A1"; color: var(--accent-amber); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface-2); color: var(--text-primary); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s ease, transform .05s ease; }
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, rgb(var(--accent-blue-rgb) / .25), rgb(var(--accent-blue-rgb) / .12)); border-color: var(--accent-blue); color: var(--btn-primary-text); }
.btn.primary:hover { background: linear-gradient(135deg, rgb(var(--accent-blue-rgb) / .4), rgb(var(--accent-blue-rgb) / .18)); }
.btn.green { background: linear-gradient(135deg, rgb(var(--accent-green-rgb) / .22), rgb(var(--accent-green-rgb) / .10)); border-color: var(--accent-green); color: var(--btn-green-text); }
.btn.green:hover { background: linear-gradient(135deg, rgb(var(--accent-green-rgb) / .36), rgb(var(--accent-green-rgb) / .16)); }
.btn.warn { border-color: var(--accent-amber); color: var(--btn-warn-text); background: linear-gradient(135deg, rgb(var(--accent-amber-rgb) / .18), rgb(var(--accent-amber-rgb) / .08)); }
.btn.danger { border-color: var(--state-incorrect); color: var(--btn-danger-text); background: linear-gradient(135deg, rgb(var(--state-incorrect-rgb) / .18), rgb(var(--state-incorrect-rgb) / .08)); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* ---------- sticky header ---------- */
.examhead { position: sticky; top: 0; z-index: 50; background: rgb(var(--bg-page-rgb) / .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); padding: 8px 0; }
.examhead .inner { max-width: 980px; margin: 0 auto; padding: 6px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.examhead .counter { font-weight: 700; font-size: 15px; }
.examhead .spacer { flex: 1 1 auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); background: var(--bg-surface-2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.chip.timerchip { font-family: var(--font-mono); font-weight: 700; color: var(--text-primary); min-width: 118px; justify-content: center; }
.chip.timerchip .st-word { color: var(--accent-green); font-family: var(--font-body); font-weight: 700; font-size: 11.5px; letter-spacing: .5px; }
.chip.timerchip.paused .st-word { color: var(--state-paused); }
.chip.timerchip.paused-auto .st-word { color: var(--accent-amber); }
.chip.timerchip.ended .st-word { color: var(--state-incorrect); }
.chip.scorechip { font-family: var(--font-mono); color: var(--text-primary); font-weight: 700; }
.chip.scorechip .pct { color: var(--accent-green); }
.hbtn { min-height: 38px; padding: 6px 14px; font-size: 13.5px; border-radius: 999px; }
.progress-wrap { max-width: 980px; margin: 6px auto 0 auto; padding: 0 18px 4px 18px; }
.progress { height: 7px; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.progress .bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--sev), var(--accent-blue)); background-size: 200% 100%; animation: sheen 6s linear infinite; transition: width .4s ease; }
@keyframes sheen { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

/* ---------- three exercise blocks ---------- */
.block { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; margin: 16px 0; overflow: hidden; box-shadow: 0 4px 14px rgb(var(--shadow-rgb) / .35); }
.block-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13.5px; letter-spacing: 1.4px; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.block-scenario .block-head { color: var(--accent-blue); border-top: 3px solid var(--accent-blue); background: linear-gradient(180deg, rgb(var(--accent-blue-rgb) / .10), transparent); }
.block-question .block-head { color: var(--accent-amber); border-top: 3px solid var(--accent-amber); background: linear-gradient(180deg, rgb(var(--accent-amber-rgb) / .10), transparent); }
.block-answer .block-head { color: var(--accent-green); border-top: 3px solid var(--accent-green); background: linear-gradient(180deg, rgb(var(--accent-green-rgb) / .10), transparent); }
.block-body { padding: 14px 16px; }
.qtext { font-weight: 700; font-size: 16.5px; }
.artefact { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden; }
.artefact .art-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); letter-spacing: .8px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: rgb(var(--accent-blue-rgb) / .06); }
.artefact .art-body { padding: 10px 12px; }
.artefact p { font-size: 14.5px; }
.logwrap { max-height: 340px; overflow: auto; }
.log-line { display: block; font-size: 13.5px; padding: 2px 4px; white-space: pre-wrap; word-break: break-all; color: var(--text-mono); border-radius: 3px; }
.log-line:hover { background: rgb(var(--accent-blue-rgb) / .07); }
.tok-ts { color: var(--tok-ts); }
.tok-ip { color: var(--accent-amber); }
.tok-kw { color: var(--accent-green); font-weight: 700; }
.tok-str { color: var(--tok-str); }
.tok-path { color: var(--tok-path); }
.tok-cve { color: var(--tok-cve); font-weight: 700; }
.tok-id { color: var(--tok-id); font-weight: 700; }
.tok-warn { color: var(--state-incorrect); font-weight: 700; }
.tok-ok { color: var(--state-correct); }
.filterbox { width: 100%; background: var(--bg-page); color: var(--text-mono); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); font-size: 13.5px; margin-top: 8px; }
.collapse-summary { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.collapse-summary .sumline { font-size: 13.5px; color: var(--text-secondary); font-family: var(--font-mono); }
details.scencol > summary { cursor: pointer; list-style: none; }
details.scencol > summary::-webkit-details-marker { display: none; }
details.scencol .togglehint { color: var(--accent-blue); font-size: 12.5px; font-weight: 700; letter-spacing: .5px; }
details.scencol[open] .togglehint .open-txt { display: inline; }
details.scencol:not([open]) .togglehint .open-txt { display: none; }
details.scencol:not([open]) .togglehint .closed-txt { display: inline; }
details.scencol[open] .togglehint .closed-txt { display: none; }

/* ---------- options ---------- */
.opts { display: grid; gap: 10px; margin-top: 6px; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text-primary); font-size: 15px; cursor: pointer; min-height: 44px; transition: background .12s ease, border-color .12s ease; }
.opt:hover { background: var(--bg-hover); }
.opt .olabel { font-family: var(--font-mono); font-weight: 700; color: var(--accent-blue); flex: 0 0 auto; }
.opt.selected { border-color: var(--accent-green); background: rgb(var(--accent-green-rgb) / .10); box-shadow: inset 3px 0 0 var(--accent-green); }
.opt.selected .sel-ind { color: var(--accent-green); }
.opt .sel-ind { margin-left: auto; color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
.opt.correct-show { border-color: var(--state-correct); box-shadow: inset 3px 0 0 var(--state-correct); }
.opt.wrong-show { border-color: var(--state-incorrect); box-shadow: inset 3px 0 0 var(--state-incorrect); }
.opt.locked { cursor: default; opacity: .92; }

/* ---------- drag & drop / match ---------- */
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chipitem { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-surface-2); border: 1px solid var(--accent-blue); color: var(--text-primary); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: grab; user-select: none; min-height: 44px; }
.chipitem.sel { border-color: var(--accent-green); background: rgb(var(--accent-green-rgb) / .12); box-shadow: 0 0 0 2px rgb(var(--accent-green-rgb) / .25); }
.chipitem.used { opacity: .35; cursor: default; }
.chipitem.dragging { position: fixed; z-index: 200; pointer-events: none; box-shadow: 0 8px 22px rgb(var(--shadow-rgb) / .5); transform: rotate(2deg); }
.zones { display: grid; gap: 10px; margin-top: 8px; }
.zone { background: var(--bg-surface-2); border: 2px dashed var(--border); border-radius: 8px; padding: 10px 12px; min-height: 58px; transition: border-color .12s ease, background .12s ease; }
.zone.droptarget { border-color: var(--accent-green); background: rgb(var(--accent-green-rgb) / .08); }
.zone .zlabel { font-weight: 700; font-size: 13.5px; color: var(--accent-amber); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.zone .zdrop { display: flex; flex-wrap: wrap; gap: 6px; }
.zone .zdrop .chipitem { font-size: 12.5px; padding: 4px 10px; min-height: 30px; }
.matchrow { display: grid; grid-template-columns: minmax(160px, 1.1fr) 30px minmax(160px, 1fr); gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.matchrow:last-child { border-bottom: none; }
.matchrow .ml { font-size: 14px; }
.matchrow .arrow { text-align: center; color: var(--text-secondary); }
.matchrow .mslot { min-height: 44px; border: 1.5px dashed var(--border); border-radius: 999px; display: flex; align-items: center; padding: 2px 8px; }
.matchrow .mslot.filled { border-style: solid; border-color: var(--accent-green); }

/* ---------- order ---------- */
.orderlist { display: grid; gap: 8px; margin-top: 8px; }
.orow { display: flex; align-items: center; gap: 10px; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.orow .posnum { font-family: var(--font-mono); font-weight: 700; color: var(--accent-amber); width: 26px; text-align: center; flex: 0 0 auto; }
.orow .otext { flex: 1; font-size: 14px; }
.orow .obtns { display: flex; gap: 4px; }
.orow .obtns button { min-width: 44px; min-height: 44px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary); cursor: pointer; font-size: 14px; }
.orow .obtns button:hover { background: var(--bg-hover); }

/* ---------- fill blanks ---------- */
.filltext { font-size: 15.5px; line-height: 2.05; }
.fillselect { background: var(--bg-page); color: var(--text-mono); border: 1.5px solid var(--accent-amber); border-radius: 6px; padding: 4px 8px; font-family: var(--font-mono); font-size: 14px; margin: 0 4px; min-height: 36px; }
.banktitle { font-size: 13px; color: var(--text-secondary); margin-top: 10px; letter-spacing: .5px; }

/* ---------- branching ---------- */
.stepbadge { display: inline-flex; align-items: center; gap: 6px; background: rgb(var(--accent-amber-rgb) / .12); color: var(--accent-amber); border: 1px solid rgb(var(--accent-amber-rgb) / .5); font-weight: 700; font-size: 12.5px; letter-spacing: 1px; border-radius: 999px; padding: 3px 12px; margin-bottom: 8px; }
.stepdone { color: var(--text-secondary); font-size: 13.5px; margin-top: 4px; }
.stepdone .s-ok { color: var(--state-correct); font-weight: 700; }
.stepdone .s-no { color: var(--state-incorrect); font-weight: 700; }
.stepdone .s-nudge { color: var(--accent-amber); font-weight: 700; }

/* ---------- hint ---------- */
.hintbox { background: rgb(var(--accent-amber-rgb) / .08); border: 1px solid rgb(var(--accent-amber-rgb) / .45); border-left: 3px solid var(--accent-amber); border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 14.5px; }
.hintbox .htitle { color: var(--accent-amber); font-weight: 700; font-size: 13px; letter-spacing: .8px; margin-bottom: 3px; }

/* ---------- feedback ---------- */
.feedback { border-radius: 10px; border: 1px solid var(--border); margin: 16px 0; overflow: hidden; }
.feedback .fb-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-weight: 800; letter-spacing: 1px; font-size: 14.5px; border-bottom: 1px solid var(--border); }
.feedback.fb-correct .fb-head { color: var(--state-correct); background: rgb(var(--accent-green-rgb) / .10); border-top: 3px solid var(--state-correct); }
.feedback.fb-partial .fb-head { color: var(--state-partial); background: rgb(var(--accent-amber-rgb) / .10); border-top: 3px solid var(--state-partial); }
.feedback.fb-incorrect .fb-head { color: var(--state-incorrect); background: rgb(var(--state-incorrect-rgb) / .10); border-top: 3px solid var(--state-incorrect); }
.feedback .fb-body { padding: 12px 16px; background: var(--bg-surface); }
.fb-credit { font-family: var(--font-mono); font-weight: 700; font-size: 14px; margin: 4px 0 10px 0; }
.itemrows { display: grid; gap: 6px; margin: 8px 0 12px 0; }
.itemrow { display: flex; align-items: flex-start; gap: 10px; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 14px; }
.itemrow .iv { font-weight: 700; white-space: nowrap; }
.itemrow.i-ok .iv { color: var(--state-correct); }
.itemrow.i-no .iv { color: var(--state-incorrect); }
.itemrow.i-miss .iv { color: var(--state-skipped); }
.explain { font-size: 14.8px; color: var(--text-primary); }
.explain .whystudy { display: block; margin-top: 10px; padding: 9px 12px; background: rgb(var(--accent-blue-rgb) / .08); border: 1px solid rgb(var(--accent-blue-rgb) / .35); border-left: 3px solid var(--accent-blue); border-radius: 6px; font-size: 14px; }
.explain .whystudy b { color: var(--accent-blue); }
.persp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.persp .pcard { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.persp .pcard .pt { font-weight: 700; margin-bottom: 4px; }
.persp .pcard.red .pt { color: var(--state-incorrect); }
.persp .pcard.blue .pt { color: var(--accent-blue); }
@media (max-width: 700px) { .persp { grid-template-columns: 1fr; } }

/* ---------- paused overlay ---------- */
.pausedoverlay { position: fixed; inset: 0; background: rgb(var(--overlay-rgb) / .9); z-index: 120; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
.pausedoverlay .pbig { font-size: 26px; font-weight: 800; color: var(--state-paused); letter-spacing: 1px; display: flex; gap: 10px; align-items: center; }
.pausedoverlay .psub { color: var(--text-secondary); font-size: 15px; max-width: 480px; }

/* ---------- review skipped ---------- */
.reviewlist { display: grid; gap: 10px; }
.reviewitem { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; flex-wrap: wrap; }
.reviewitem .rtitle { font-size: 14.5px; flex: 1; min-width: 200px; }
.reviewitem .skbadge { display: inline-flex; align-items: center; gap: 6px; color: var(--state-skipped); border: 1px solid var(--border); background: var(--bg-page); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.reviewitem .skbadge.st-ok { color: var(--state-correct); border-color: rgb(var(--accent-green-rgb) / .5); }
.reviewitem .skbadge.st-part { color: var(--state-partial); border-color: rgb(var(--accent-amber-rgb) / .5); }
.reviewitem .skbadge.st-no { color: var(--state-incorrect); border-color: rgb(var(--state-incorrect-rgb) / .5); }

/* ---------- results ---------- */
.resgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
.rescard { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.rescard .rk { color: var(--text-secondary); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; }
.rescard .rv { font-size: 22px; font-weight: 800; margin-top: 3px; font-family: var(--font-mono); }
.rescard.ok .rv { color: var(--state-correct); }
.rescard.part .rv { color: var(--state-partial); }
.rescard.no .rv { color: var(--state-incorrect); }
.rescard.skip .rv { color: var(--state-skipped); }
.verdict { border-radius: 10px; padding: 18px 20px; margin: 16px 0; border: 1px solid; }
.verdict.pass { border-color: var(--state-correct); background: linear-gradient(135deg, rgb(var(--accent-green-rgb) / .14), rgb(var(--accent-green-rgb) / .05)); }
.verdict.fail { border-color: var(--state-incorrect); background: linear-gradient(135deg, rgb(var(--state-incorrect-rgb) / .14), rgb(var(--state-incorrect-rgb) / .05)); }
.verdict .vbig { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.verdict.pass .vbig { color: var(--state-correct); }
.verdict.fail .vbig { color: var(--state-incorrect); }
.verdict .vsub { margin-top: 6px; color: var(--text-secondary); font-size: 14.5px; }
.timesum { font-size: 13.5px; color: var(--text-secondary); margin-top: 8px; font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  .topgrid, .progress .bar { animation: none !important; }
  .btn, .opt, .zone, .chipitem, .progress .bar { transition: none !important; }
}
@media (max-width: 640px) {
  .examhead .inner { gap: 6px 8px; }
  .chip.timerchip { min-width: 0; }
  .wrap { padding: 12px; }
  .card { padding: 14px; }
  .matchrow { grid-template-columns: 1fr 20px 1fr; }
}

window.CM_META = {"topicId": "g0007", "batch": 3, "title": "G0007 APT28 — HARD", "difficulty": "hard", "objectId": "G0007", "objectName": "APT28", "objectType": "Group (Threat Actor)", "part": "", "estimatedMinutes": 45, "passMark": 70};
window.CM_INTRO = {"title": "G0007 (APT28) — HARD practice exam", "subtitle": "Senior-desk level: correlate artefact sets, resist near-miss answers, and make containment calls under uncertainty.", "learn": "<p><b>This is the senior desk.</b> You already know <b>who</b> APT28 (G0007) is — the Russia-linked espionage group attributed to GRU military unit 26165 — and you can map its behaviours to tactics. The object itself is still one ATT&CK <b>Group</b> page — G0007, a named threat actor — with its description, aliases, the Nearest Neighbor campaign entry, its software list and its documented techniques; what changes is how you use it. This exam asks the questions that come <b>after</b> recognition: which of two plausible answers is right <b>here</b>, what a professional incident responder does first, and when the \"obvious\" action is actually the wrong one.</p><p><b>What makes it HARD?</b> Every exercise pits at least two defensible options against each other. You will meet: an attribution call where APT29 shares half the profile; a log set where one alarming line is scheduled maintenance; a containment order where imaging the host destroys the evidence; a proxy log where three techniques are hiding at once; and a captured rundll32 command you must pin to its exact technique family and sub-technique. Keyword-matching will actively betray you here — read the artefacts.</p><p><b>The real work behind it:</b> incident responders sequence containment against evidence loss; detection engineers pick the data source that anchors a reliable alert; CTI analysts phrase attribution with calibrated confidence; and control owners rank mitigations by how much of the APT28 playbook they actually blunt. Every exercise is a miniature version of one of those deliverables — after this exam you should be able to sit in the hot seat for an APT28-suspected incident and defend each decision out loud.</p><p><b>Practical notes:</b> scenarios are longer now, so long ones collapse after you read them — expand and collapse freely. Multi-answer exercises give partial credit. Several exercises show real command lines from documented incidents — reading them carefully is the job; nothing here can execute anything.</p>", "keywords": [{"icon": "🧾", "theme": "Evidence correlation & IR sequencing", "items": ["Process-creation and security event logs (wevtutil cl, cipher /W, vssadmin)", "Volatile evidence first: memory before reimage", "Containment vs evidence preservation trade-offs", "Least-aggressive correct action under pressure"]}, {"icon": "🧪", "theme": "Near-miss discrimination", "items": ["APT28 vs APT29 attribution: shared traits vs decisive traits", "CVE-2020-0688 (APT28-documented Exchange exploit) vs other Exchange CVEs", "Benign maintenance vs attacker clean-up (scheduled vs manual)", "Renamed utilities: WinRAR masquerading (T1036)"]}, {"icon": "🔎", "theme": "Detection anchors & data sources", "items": ["Event ID 1102 (Security log cleared) and wevtutil cl System/Security", "cipher.exe /W:C secure wipe (Disk Content Wipe T1561.001)", "vssadmin shadow-copy access for NTDS.dit dumping (T1006, T1003.003)", "netsh portproxy internal proxying (T1090.001) and Windows host firewall rule edits (T1686.003)"]}, {"icon": "🤖", "theme": "Technique recognition in evidence", "items": ["rundll32 proxy execution (T1218.011) — captured command recognition", "Web shells on OWA (T1505.003), staged archives (T1074.002)", "Router compromise as staging (T1584.008) vs Wi-Fi entry (T1669)", "Exfiltration chunking (T1030), Google Drive channels (T1567)"]}, {"icon": "📋", "theme": "Attribution language & control ranking", "items": ["Confidence levels: moderate vs high, and what earns them", "Close-access operations (Wi-Fi Pineapple, evil twin — T1557.004)", "Ranking mitigations by playbook coverage (MFA, patching, EDR, training)"]}], "types": "near-miss multiple-choice, artefact drag & drop, precision technique-ID fill-ins, containment ordering, mitigation ranking, matching, and branching responses"};
window.CM_EX = [{"id": "h01", "type": "qcm", "collapsible": true, "summary": "Ticket #8841 — embassy network intrusion, attribution call", "short": "Attribute Ticket #8841 with the right confidence", "scenario": "An embassy IT team reported a long-dwell intrusion. Your CTI lead wants a written attribution line for Ticket #8841 in fifteen minutes — defensible, not reckless.", "artefacts": [{"label": "ARTEFACT 1 — Ticket #8841 summary", "kind": "mono", "lines": ["Entry: spearphishing links redirecting to credential-harvest pages; two staff captured.", "Follow-on: valid mailbox logins via Tor; internal portproxy with netsh on one server;", "         net use mapping of an admin share; WinRAR archives staged before upload.", "Timing: attempts clustered ~4 per hour per account across two weeks (spray pattern).", "Targeting: NATO-member foreign ministry; no ransom note; no monetary artefacts."]}, {"label": "ARTEFACT 2 — Profile sheet (public reporting)", "kind": "mono", "lines": ["APT28 (G0007)  : spearphishing for credentials, Tor-routed access, password spray", "                 (~4/h/account), netsh portproxy, admin-share mapping, RAR staging,", "                 GRU unit 26165, NATO/defence/government targeting, espionage.", "APT29 (G0012)  : supply-chain and cloud identity focus, stealthy OAuth abuse,", "                 SVR-attributed, avoids close-access Wi-Fi ops, targets think tanks.", "Common ground  : both Russia-linked, both use valid accounts and living-off-the-land tools."]}], "question": "Which attribution line belongs in the ticket?", "hint": "Strike the two options that argue from shared traits only — then weigh what is decisive in Artefact 2.", "options": [{"id": "A", "text": "APT28, moderate-to-high confidence — TTP set, spray cadence and targeting align with G0007"}, {"id": "B", "text": "APT29, moderate confidence — valid accounts and Tor use match Russian espionage generally"}, {"id": "C", "text": "APT28, high confidence — Tor use proves GRU unit 26165 involvement"}, {"id": "D", "text": "Unattributed — valid-account intrusions cannot ever be attributed"}], "correct": ["A"], "multi": false, "explanation": "The decisive traits point to APT28: the <b>spray cadence of about four attempts per hour per account</b> is documented on the G0007 page almost verbatim, as are netsh portproxying, admin-share mapping, RAR staging and NATO/government targeting. Option B argues from shared traits (valid accounts, Tor) that APT29 also has — that is the near-miss. Option C over-claims: Tor is generic tradecraft, and \"Tor proves GRU\" is not a defensible sentence, which is why confidence stays <b>moderate-to-high</b> rather than high. Option D is false comfort — behaviour-based attribution is standard practice when stated with calibrated confidence.", "wrongStudy": "Practise separating shared traits (Russia, Tor, valid accounts) from decisive traits (spray cadence, targeting, toolchain)."}, {"id": "h02", "type": "dnd", "short": "Classify five event-log lines: attacker evidence vs maintenance", "scenario": "You inherited a host triage from the night shift. Five captured command lines need classification before the 10:00 call. One of them looks terrifying but is scheduled maintenance — do not let it contaminate the incident timeline.", "artefacts": [{"label": "ARTEFACT 1 — Host triage: captured command lines", "kind": "log", "lines": ["L1  02:14:55  SYSTEM  wevtutil cl System  (parent: cmd.exe, no scheduled task)", "L2  02:15:31  SYSTEM  wevtutil cl Security  (parent: cmd.exe, no scheduled task)", "L3  03:00:02  SYSTEM  cleanmgr.exe /sagerun 7  (parent: svchost, TaskName=DailyCleanup)", "L4  03:22:40  ADMIN   cmd.exe /c cipher /W:C   (parent: explorer, interactive)", "L5  03:41:09  ADMIN   vssadmin list shadows → vssadmin create shadow /for=C:  (parent: cmd.exe)"]}], "question": "Drag each line into the correct classification bucket.", "hint": "Check the parent process and whether a scheduler explains the line — two lines are attacker clean-up, one is a wipe, one reaches into shadow copies, one is chores.", "items": [{"id": "i1", "text": "L1/L2 — wevtutil cl System and cl Security (unscheduled)", "zone": "z1"}, {"id": "i2", "text": "L3 — cleanmgr.exe /sagerun 7 via DailyCleanup task", "zone": "z4"}, {"id": "i3", "text": "L4 — cipher /W:C run interactively from explorer", "zone": "z2"}, {"id": "i4", "text": "L5 — vssadmin create shadow /for=C:", "zone": "z3"}], "zones": [{"id": "z1", "label": "Attacker: clearing event logs (T1685.005)"}, {"id": "z2", "label": "Attacker: secure wipe of deleted data (T1561.001)"}, {"id": "z3", "label": "Attacker: shadow-copy access for dumping (T1006)"}, {"id": "z4", "label": "Benign maintenance — exclude from timeline"}], "explanation": "The two <b>wevtutil cl</b> lines match the documented APT28 clean-up commands (wevtutil cl System / cl Security) — log clearing, unscheduled, straight from cmd. <b>cipher /W:C</b> run interactively matches the Nearest Neighbor campaign wipe (overwriting deleted data so recovery tools find nothing). <b>vssadmin create shadow</b> is the NTDS.dit access pattern — shadow copies were the documented route to the Active Directory database. But <b>cleanmgr.exe /sagerun</b> under a registered daily task is Disk Cleanup doing its scheduled chores: alarming to grep, boring to read. Ordering evidence by parent process and scheduler context is what keeps a timeline honest.", "wrongStudy": "Always resolve three questions per command line: what, by whom, scheduled or not?"}, {"id": "h03", "type": "fill", "short": "Name the technique behind the captured rundll32 command", "scenario": "You are in the forensics console attached to the compromised host from Ticket #8841. The captured process-creation record of the loader is preserved below. Your ticket needs the exact ATT&CK mapping: the family and the precise sub-technique.", "artefacts": [{"label": "ARTEFACT 1 — Sysmon EID 1 (process creation, preserved)", "kind": "log", "lines": ["01:44:12  Image: C:\\Windows\\System32\\rundll32.exe", "          CommandLine: rundll32.exe \"C:\\Windows\\twain_64.dll\"", "          ParentImage: C:\\Users\\b.reed\\AppData\\Roaming\\winword.exe chain", "          Hash: 9f2a44c2e5b8...  (matches no known-good catalog)"]}], "question": "Complete the ticket line with the correct technique family and the precise sub-technique.", "hint": "The shell did not run the DLL — rundll32 is the disguise. Which technique family describes using a signed Windows binary this way, and which sub-technique is the rundll32 member?", "sentence": "Ticket line: the captured command rundll32.exe \"C:\\Windows\\twain_64.dll\" maps to technique family {{b1}} — System Binary Proxy Execution — and, at full precision, to the rundll32 sub-technique {{b2}}, the documented CHOPSTICK execution pattern on the G0007 page.", "blanks": [{"id": "b1", "hint": "Technique family", "correct": "T1218"}, {"id": "b2", "hint": "Precise sub-technique", "correct": "T1218.011"}], "bank": ["T1218", "T1218.011", "T1059.001", "T1059.003", "T1202", "T1127"], "explanation": "rundll32.exe is a legitimate Windows utility whose job is loading DLLs — attackers love it because the malicious code never appears as its own process. The captured line matches the documented APT28 procedure: CHOPSTICK executed via rundll32 with a DLL planted as \"C:\\Windows\\twain_64.dll\" (twain is the real scanner-interface folder name, so the file blends in). In ATT&CK this is family <b>T1218 — System Binary Proxy Execution</b>, and at full precision <b>T1218.011 — Rundll32</b>. Picking both words correctly is the whole credit; the family alone is half, because detection engineering needs the precise row. Recognising commands in evidence (not writing offensive ones) is a core responder skill, and the ID is what your detection engineers will search for next.", "wrongStudy": "Learn the proxy-execution family: rundll32 (T1218.011), regsvr32 (T1218.010), msiexec (T1218.007) — and which one the evidence shows."}, {"id": "h04", "type": "dnd", "short": "Pin six behaviours to the right ATT&CK columns", "scenario": "The CTI team is building an APT28 Navigator layer that includes Resource Development — a column juniors always get wrong. Place each behaviour in its true column.", "question": "Drag each behaviour to the tactic column ATT&CK assigns it.", "hint": "Preparing the battlefield happens before access — registered look-alike domains AND compromised nearby network devices are development, not entry; the entry is the Wi-Fi connection that follows. And stealing an OAuth token is credential theft, not execution.", "items": [{"id": "i1", "text": "Registering domains imitating NATO and OSCE sites", "zone": "z1"}, {"id": "i2", "text": "Malicious OAuth apps posing as \"Google Scanner\" to harvest tokens", "zone": "z2"}, {"id": "i3", "text": "Compromising Ubiquiti network devices to act as collection devices", "zone": "z1"}, {"id": "i4", "text": "Changing file extensions on exfiltrated archives", "zone": "z4"}, {"id": "i5", "text": "Splitting exfiltration archives into sub-1MB chunks", "zone": "z5"}, {"id": "i6", "text": "Using a compromised nearby organisation’s router to join the target’s enterprise Wi-Fi", "zone": "z3"}], "zones": [{"id": "z1", "label": "Resource Development"}, {"id": "z2", "label": "Credential Access"}, {"id": "z3", "label": "Initial Access"}, {"id": "z4", "label": "Defense Evasion"}, {"id": "z5", "label": "Exfiltration"}], "explanation": "The tricky rows are the near-misses. Registering NATO/OSCE-imitating domains is preparation that happens <b>before</b> any victim contact → <b>Resource Development</b> (T1583.001) — and so is compromising the Ubiquiti network devices: the page documents that as <b>Compromise Infrastructure: Network Devices (T1584.008)</b>, building capability rather than entering a victim. The actual <b>entry</b> happens later, when a nearby compromised router is used to join the target’s enterprise Wi-Fi → <b>Initial Access</b> (the page documents exploiting Wi-Fi access points for initial access, T1669). The fake OAuth apps (\"Google Defender\", \"Google Scanner\" style) exist to <b>steal tokens</b> → <b>Credential Access</b> (T1528), not execution. Renaming extensions on outgoing files defeats content inspection → <b>Defense Evasion</b> (T1036.005). Sub-1MB chunking is a transfer-size trick → <b>Exfiltration</b> (T1030). Navigator layers built by teams that get these rows right produce fewer false leads during incidents.", "wrongStudy": "Re-read the Resource Development tactics: acquiring domains AND compromising network devices are staging, not entry — the entry is the Wi-Fi connection that follows."}, {"id": "h05", "type": "dnd", "short": "Coverage gap review: which APT28 behaviours slip past the control set?", "scenario": "The org runs: MFA everywhere, email gateway filtering, EDR with credential-theft rules, and disciplined Exchange patching. The risk register asks what still slips through against the documented APT28 playbook.", "question": "Drag each behaviour into Covered or Gap.", "hint": "Ask each behaviour: which of the four controls touches it? If none, it is a gap — physical-proximity and cloud-trust behaviours rarely meet endpoint controls.", "items": [{"id": "i1", "text": "Password spraying cloud portals without MFA enrolled", "zone": "z1"}, {"id": "i2", "text": "Evil-twin Wi-Fi Pineapple close-access capture of staff credentials", "zone": "z2"}, {"id": "i3", "text": "Mimikatz on a workstation", "zone": "z1"}, {"id": "i4", "text": "Exploiting unpatched Exchange (CVE-2020-0688)", "zone": "z1"}, {"id": "i5", "text": "OAuth app abuse stealing mail tokens (T1528)", "zone": "z2"}], "zones": [{"id": "z1", "label": "Covered by current controls"}, {"id": "z2", "label": "Gap — needs a compensating control"}], "explanation": "Two behaviours genuinely slip past this control set. The <b>Wi-Fi Pineapple evil twin</b> is a close-access operation — it never touches your endpoints, so EDR, MFA on your portals and mail filtering are all bystanders; compensations are WPA-Enterprise with certificate validation, rogue-AP detection, and travel hygiene guidance. <b>OAuth app abuse</b> lives in the consent layer of the cloud tenant, invisible to mail filtering and endpoint agents; the compensation is consent-policy governance and cloud audit alerts. The other three map cleanly: spraying hits MFA, Mimikatz hits the EDR credential rules, and the Exchange exploit dies to patching. A coverage-gap statement like this is exactly what a control owner presents at the quarterly review.", "wrongStudy": "For each control you fund, list which documented behaviours it cannot see — then name the compensating control."}, {"id": "h06", "type": "branch", "collapsible": true, "summary": "Ticket #9107 — lab workstation kernel driver alert", "short": "Branching response: unknown kernel driver on a research lab host", "scenario": "EDR raised a high-severity alert on a research lab workstation: an unsigned kernel driver loaded. The lab works on chemistry data. The researcher says \"I install drivers all the time for instruments.\" Work the call in three decisions.", "hint": "Volatile data first, vendor truth second, and never let urgency pick the destructive option.", "branch": [{"q": "STEP 1 — The EDR snapshot shows the driver \"HIDEDRV.sys\" loaded at 02:41 from a user-writable folder. First move?", "options": ["Capture volatile memory from the workstation now, before any reboot", "Reboot the workstation to clear the kernel-level issue", "Uninstall the driver remotely to remove the threat", "Email the researcher to ask whether the driver looks legitimate"], "correct": 0, "why": "Kernel-level implants make reboot a gift to the attacker — memory holds the truth. Pulling RAM preserves the only volatile evidence; uninstalling may fail or tip off; email is not evidence."}, {"q": "STEP 2 — Memory triage finds the driver is signed with a stolen certificate and matches the description of APT28’s HIDEDRV (used with Downdelph). The researcher insists it is for a \"spectrometer\". What now?", "options": ["Treat as suspected APT28: preserve the disk image, keep the host isolated, start scoping other lab hosts", "Accept the researcher’s explanation and downgrade to informational", "Wipe and reimage immediately so the lab keeps working", "Post the certificate hash on social media for help"], "correct": 0, "why": "A stolen-certificate driver matching a documented APT28 family is a strong signal — a user’s assurance is not. Imaging and isolation preserve both evidence and the investigation’s option space; wiping destroys exactly what you need."}, {"q": "STEP 3 — Management demands the lab back online within the hour. Choose the defensible line.", "options": ["Offer a clean loaner device now; keep the compromised host isolated for forensics", "Return the host to the lab but with antivirus scans running", "Give the original host back after a quick file scan, forensics later", "Shut down the whole lab segment until every host is examined"], "correct": 0, "why": "The least aggressive correct action: business continuity via a clean device, evidence intact on the isolated host. AV scans do not defeat kernel implants, and shutting the whole lab is neither necessary nor proportionate yet."}], "explanation": "This is the classic responder triangle: <b>volatile evidence, vendor truth, business pressure</b>. HIDEDRV is documented APT28 tooling on the G0007 page (a driver shipped alongside Downdelph), and kernel implants survive reboots — so memory capture comes first, imaging second, and a clean loaner satisfies the business without touching the evidence. Notice how every wrong option is defensible somewhere: reboots are fine for user-mode malware, researcher trust is fine for known instrument drivers, lab shutdowns are fine with confirmed wormable spread — but in <b>this</b> world, none of those hold.", "wrongStudy": "Rehearse your volatile-data order: RAM → disk image → network logs → then, and only then, remediate."}, {"id": "h07", "type": "order", "short": "Sequence the containment runbook correctly", "scenario": "The intrusion from Ticket #8841 is confirmed. Your CSIRT runbook cards were dropped; re-sequence them. Note: the environment has live APT28-attributed sessions, and two steps can destroy evidence if done early.", "question": "Put the five containment steps in the correct order.", "hint": "Freeze the picture first, cut the attacker’s keys second, close the doors third — and do not reset the world before someone has photographed it.", "steps": [{"text": "Preserve evidence: snapshot mailboxes, export gateway and auth logs"}, {"text": "Revoke sessions and reset credentials for the compromised accounts"}, {"text": "Block the C2 infrastructure at the proxy (coordinated, single window)"}, {"text": "Remove the reGeorg web shell and patch the exploited OWA server"}, {"text": "Hunt backward for the same patterns, then brief stakeholders with confidence levels"}], "explanation": "Ordering is the difference between an investigation and a mess. <b>Preserve first</b>: mailbox snapshots and gateway/auth logs are the case file — revoking sessions before exporting logs burns the evidence the attacker’s own sessions would have confirmed. <b>Then</b> revoke and reset so the stolen credentials die. <b>Then</b> block C2 in one coordinated window — a slow partial block teaches the operator your tempo (they rotate infrastructure, as APT28 does with its proxy chains). Eviction and patching come after the attacker is blind, and the hunt-plus-brief closes the loop. Doing the \"satisfying\" steps early is the trap this exercise trains out of you.", "wrongStudy": "Rehearse: preserve → revoke → block → evict → hunt and brief."}, {"id": "h08", "type": "order", "short": "Rank five mitigations for an APT28-targeted org", "scenario": "You are the control owner for a government-adjacent organisation that matches the APT28 targeting profile. The board funds exactly five improvements this year — rank them by how much of the documented playbook each blunts.", "question": "Rank the five mitigations from most to least playbook coverage.", "hint": "Weight by what the group actually does most: phishing entry, password attacks, server exploitation, credential dumping, then exotic paths.", "steps": [{"text": "Phishing-resistant MFA on all external and privileged access"}, {"text": "Gateway filtering plus attachment detonation for Office/RAR carriers"}, {"text": "Expedited patching SLA for internet-facing infrastructure"}, {"text": "EDR behavioural coverage for credential dumping and proxy execution"}, {"text": "Wi-Fi hardening and rogue-access-point detection for offices"}], "explanation": "The ranking follows the group’s documented frequency. <b>MFA</b> covers the most: spraying, credential reuse and stolen-password entry all die at the front door. <b>Gateway filtering/detonation</b> meets the single most-used entry technique (Office/RAR spearphishing) before a human is fooled. <b>Patching internet-facing servers</b> closes the documented Exchange exploits (CVE-2020-0688, CVE-2020-17144). <b>EDR behavioural rules</b> catch dumping (Mimikatz, ntdsutil) and proxy execution (rundll32) after entry — vital, but later in the chain. <b>Wi-Fi hardening</b> addresses a real but rarer documented path (close-access evil-twin operations) — important for high-risk facilities, lowest average coverage across the playbook. Ranking like this is how GRC teams turn a group page into a budget argument.", "wrongStudy": "Rank controls by frequency × impact on the documented playbook, not by novelty."}, {"id": "h09", "type": "qcm", "short": "Pick the exploit that matches the documented APT28 Exchange intrusions", "scenario": "A scan found the internet-facing Exchange server vulnerable to several historic CVEs. The retrofit patching ticket cites \"the CVE APT28 used\" — pick it from the shortlist.", "question": "Which CVE matches the exploit documented on the APT28 page for Exchange access?", "hint": "Two of the four are Exchange bugs — only one is documented as used by APT28 (G0007); the other belongs to a different actor’s story.", "options": [{"id": "A", "text": "CVE-2020-0688 — Exchange control-panel deserialization flaw"}, {"id": "B", "text": "CVE-2021-34473 — ProxyShell pre-auth RCE chain"}, {"id": "C", "text": "CVE-2017-11882 — Equation Editor memory corruption in Word"}, {"id": "D", "text": "CVE-2024-21412 — Windows SmartScreen bypass"}], "correct": ["A"], "multi": false, "explanation": "The G0007 page documents APT28 using <b>CVE-2020-0688</b> (alongside CVE-2020-17144) to gain execution on vulnerable Microsoft Exchange. ProxyShell (B) was the Hafnium-era Exchange story with different actors — a genuine near-miss because the product and year sound right. Equation Editor (C) is a document-side exploit used for spearphishing payloads by assorted actors, not the server-side access documented here, and the SmartScreen bypass (D) is neither Exchange nor on the page. Patch tickets that cite the wrong CVE mis-scope retroactive hunting: you would search for the wrong request patterns in old IIS logs.", "wrongStudy": "Keep a per-actor exploit list for your top five targeted products — product-proximity is how CVE near-misses win."}, {"id": "h10", "type": "match", "short": "Match four proxy-log patterns to their techniques", "scenario": "One week of proxy logs from the intrusion. Four behaviours hide in it. Map each to the technique your detection engineers should model.", "artefacts": [{"label": "ARTEFACT 1 — Proxy log, week 34 (condensed)", "kind": "log", "lines": ["P1  hourly POST to assets-sync[.]example/api, constant 2210-byte beacons, HTTP/1.1", "P2  uploads to drive-token[.]example OAuth endpoints, 40-60MB archives nightly", "P3  every outbound file split into 47 x 900KB parts over two hours", "P4  internal 10[.]0[.]40[.]11:3389 → 10[.]0[.]40[.]11:8080 portproxy relays to 198[.]51[.]100[.]7"]}], "question": "Match each pattern to the technique it demonstrates.", "hint": "A metronome is C2; a cloud is exfil; a size cap is a transfer trick; a relay inside the perimeter is proxying.", "pairs": [{"l": "P1 — constant-size hourly HTTP beacons", "r": "Application Layer Protocol: Web Protocols (T1071.001)"}, {"l": "P2 — nightly 40-60MB archive uploads to a drive service", "r": "Exfiltration Over Web Service (T1567)"}, {"l": "P3 — files split into sub-1MB parts before transfer", "r": "Exfiltration Over Alternative Protocol / size limits (T1030)"}, {"l": "P4 — netsh portproxy relay on an internal host", "r": "Proxy: Internal Proxy (T1090.001)"}], "explanation": "Detection engineers model behaviour, not bytes. <b>P1</b>: fixed-size hourly POSTs over HTTP are C2 application-layer protocol use — the page notes CHOPSTICK blending HTTP/HTTPS. <b>P2</b>: bulk archives pushed to a cloud drive endpoint is exfiltration over web service — APT28 documented Google Drive use. <b>P3</b>: the sub-1MB split is the documented Data Transfer Size Limits trick, defeating DLP volume thresholds. <b>P4</b>: a netsh portproxy on an internal host is the internal proxy pivot the Nearest Neighbor campaign used — traffic hops through a victim box so the C2 origin disappears. Four patterns, four different rules, one rule-writing afternoon.", "wrongStudy": "For each log pattern you meet, name the technique AND the field that makes a durable detection (host, cadence, size, direction)."}, {"id": "h11", "type": "qcm", "short": "Spot the destructive line in the playbook", "scenario": "A first-draft CSIRT playbook lands for review. One step would destroy evidence if followed literally. The rest are sound.", "artefacts": [{"label": "ARTEFACT 1 — Draft playbook \"APT28-style intrusion\" (extract)", "kind": "mono", "lines": ["R1  On suspected credential compromise: revoke sessions, reset passwords.", "R2  On confirmed web shell: snapshot the server, then remove and patch.", "R3  On detected event-log clearing: reimage the host within one hour.", "R4  On confirmed exfiltration to cloud: preserve tenant audit logs, notify counsel."]}], "question": "Which runbook line is the destructive mistake?", "hint": "One line jumps to the most aggressive action without a preserve step — and the trigger event is itself evidence.", "options": [{"id": "A", "text": "R3 — reimaging on log clearing erases the host before triage"}, {"id": "B", "text": "R1 — revoking sessions tips off the attacker"}, {"id": "C", "text": "R2 — snapshotting before removal wastes the response window"}, {"id": "D", "text": "R4 — involving counsel slows technical containment"}], "correct": ["A"], "multi": false, "explanation": "R3 skips evidence entirely: event-log clearing (documented APT28 clean-up, e.g. wevtutil cl) is the moment the host still holds process, service and memory evidence about <b>what</b> was cleared and <b>why</b>. Reimaging within an hour turns the most informative host into a blank machine. R1 is correct — tipping off an espionage operator is accepted cost once credentials are compromised. R2 has the right order (snapshot, then remove). R4 is textbook: cloud audit logs and legal notification belong together. Playbook reviews exist precisely to catch the one line that trades evidence for a feeling of action.", "wrongStudy": "Audit every runbook line for the pairing: preserve → act. Any line that acts first needs a rewrite."}, {"id": "h12", "type": "match", "short": "Match techniques to their best detection anchor", "scenario": "The detection team asks which data source should anchor each APT28 detection — the one field or event that makes the rule durable, not the one that fires most.", "question": "Match each technique to its best detection anchor.", "hint": "Pick the source that captures the behaviour even when files are renamed: security logs for log clearing, MFT/USN for timestamp edits, DHCP/NPS for Wi-Fi auth, process lineage for proxy execution.", "pairs": [{"l": "Clearing Windows event logs (T1685.005)", "r": "Security log Event ID 1102 / System log service stop events"}, {"l": "Timestomping files (T1070.006)", "r": "USN journal / MFT $STANDARD_INFORMATION vs $FILE_NAME mismatch"}, {"l": "Evil-twin Wi-Fi access (T1557.004)", "r": "Wireless controller / NPS auth logs with new AP and SSID pairs"}, {"l": "rundll32 proxy execution (T1218.011)", "r": "EDR process lineage: rundll32 with anomalous parent and DLL path"}, {"l": "Email delegate permission added (T1098.002)", "r": "Exchange/O365 admin audit: Add-MailboxPermission events"}], "explanation": "Durable detections anchor on the record that cannot be easily faked by renaming a file. Log clearing leaves the <b>1102</b> audit event unless auditing itself is turned off — which is its own alarm. Timestomping edits the friendly timestamps but the <b>USN journal / MFT comparison</b> keeps the truth. Evil-twin access shows up where the Wi-Fi <b>authentication</b> happens: a new AP/SSID pair in NPS logs, not on the laptop. rundll32 abuse is visible in <b>process lineage</b> regardless of the DLL’s disguise. Delegate permissions are admin-plane actions with <b>audit trails</b> that attackers rarely clean. These five anchors are the difference between a dashboard that blinks and a programme that finds APT28.", "wrongStudy": "For each rule you own, write down its anchor event — if you cannot, the rule is decorating a dashboard."}, {"id": "h13", "type": "branch", "collapsible": true, "summary": "Ticket #9344 — odd traffic from network devices", "short": "Branching dual-perspective: compromised network gear as collectors", "scenario": "Netflow shows small, regular uploads from branch-office Ubiquiti devices to an unexplained endpoint, and one device reboots outside its maintenance window. Two hats, one decision chain.", "hint": "First decide what the device became; then decide what the defender watches while the attacker still holds it.", "branch": [{"q": "STEP 1 — From the attacker’s chair: why compromise branch routers instead of laptops?", "options": ["Routers see all branch traffic and are rarely monitored — ideal quiet collectors and proxies", "Routers have more CPU than laptops for cracking passwords", "Router firmware is easier to ransom for quick profit", "Routers bypass the email gateway entirely"], "correct": 0, "why": "Position and blindness: a compromised router is an interception point for credentials and a relay that hides origin. The G0007 page documents APT28 compromising Ubiquiti devices exactly for collection."}, {"q": "STEP 2 — From the defence chair: what is the right watch-and-act line while change control approves a rebuild?", "options": ["Mirror the devices’ traffic, alert on config changes and new port forwards, plan an out-of-band rebuild", "Reboot all routers nightly so implants do not persist", "Block all branch traffic at the firewall until the devices are rebuilt", "Trust the vendor cloud dashboard as the source of truth for device health"], "correct": 0, "why": "Watch the control plane (config changes, port forwards — the page documents firewall rule edits for port-forwarding) while arranging a clean, out-of-band rebuild. Nightly reboots do not touch firmware implants, a full branch block hurts the business, and attacker-controlled dashboards lie."}], "explanation": "Network gear is the blind spot in most APT28 playbooks: the documented Ubiquiti compromise shows the group treating routers as <b>collection devices</b>, not just stepping stones. The red-side logic — position, blindness, relay value — tells you the blue-side obligations: monitor the management plane, alert on configuration deltas (especially port-forward rules like the Nearest Neighbor campaign used), and rebuild from a trusted image out-of-band when change control allows. Two perspectives, one coherent plan — that is what HARD-level thinking looks like.", "wrongStudy": "Add network devices to your threat model: who monitors router config changes today?"}, {"id": "h14", "type": "qcm", "short": "Which benign-looking artefact is the alarm?", "scenario": "Four findings from a workstation sweep. Three are healthy. One is the documented APT28 masquerading trick wearing its least alarming face.", "artefacts": [{"label": "ARTEFACT 1 — Workstation sweep findings", "kind": "mono", "lines": ["F1  C:\\Program Files\\WinRAR\\WinRAR.exe — signed, version matches vendor catalog", "F2  C:\\Users\\b.reed\\AppData\\Roaming\\svchost.exe — 7z console build, renamed, 3 weeks old", "F3  C:\\Windows\\System32\\twain_32.dll — signed Microsoft, catalog matches", "F4  C:\\Windows\\System32\\notepad.exe — signed Microsoft, catalog matches"]}], "question": "Which finding is the alarm, and why?", "hint": "Location and name history matter more than the file type — a system name in a user folder is never healthy.", "options": [{"id": "A", "text": "F2 — an archiver renamed to svchost.exe in a user-writable folder"}, {"id": "B", "text": "F1 — WinRAR itself, because archives were used to exfiltrate"}, {"id": "C", "text": "F3 — twain_32.dll, because APT28 used a twain-named DLL once"}, {"id": "D", "text": "F4 — notepad.exe, because plain text editors can exfiltrate"}], "correct": ["A"], "multi": false, "explanation": "F2 is the documented masquerading pattern: the G0007 page notes APT28 <b>renamed the WinRAR utility to avoid detection</b>, and system-process names (svchost) inside user-writable folders are a classic tell — an archiver has no business wearing a service-host name. F1 is legitimate: having WinRAR installed is normal even though the group (ab)uses archives. F3 is a near-miss trap: APT28 planted a fake <b>twain_64.dll</b>, but this is the genuine signed twain_32 in System32 with a matching catalog — path, name and signature all check out. F4 is healthy by the same logic. This is \"looks benign but is alarming\" in its purest form: the file looks like plumbing until you ask who named it.", "wrongStudy": "Triage file findings on three axes: name vs function, location vs privileges, signature vs catalog."}, {"id": "h15", "type": "fill", "short": "Draft the confidence language for the CTI brief", "scenario": "Your brief on Ticket #8841 goes to the CISO and, later, to the national CERT. The blank phrases are the ones legal will read twice.", "question": "Complete the brief with the professionally correct phrases.", "hint": "One phrase sizes the confidence, one names the tradecraft category, one names the unit — precision beats drama.", "sentence": "We attribute Ticket #8841 to APT28 (G0007) with {{b1}}, based on TTP, cadence and targeting overlap. The victim-facing tradecraft included {{b2}} operations — physically proximate Wi-Fi capture — alongside remote spearphishing. Public reporting links the group to Russian GRU {{b3}}.", "blanks": [{"id": "b1", "hint": "Confidence phrase", "correct": "moderate confidence", "accept": ["moderate-to-high confidence", "moderate to high confidence", "moderate confidence"]}, {"id": "b2", "hint": "Tradecraft category", "correct": "close-access", "accept": ["close access"]}, {"id": "b3", "hint": "GRU element", "correct": "unit 26165", "accept": ["military unit 26165", "26165"]}], "bank": ["moderate confidence", "certainty beyond doubt", "close-access", "far-field", "unit 26165", "unit 74455"], "explanation": "Professional attribution language does three jobs. <b>\"Moderate confidence\"</b> (or moderate-to-high with corroborating partners) tells leadership exactly how much weight the claim carries — \"certainty beyond doubt\" is not a phrase analysts use. <b>\"Close-access\"</b> is the formal term for physically proximate operations like the Wi-Fi Pineapple captures the G0007 page documents (and which the 2018 US indictment described); \"far-field\" is not the term of art. <b>\"Unit 26165\"</b> is the indicted APT28 element — unit 74455 (Sandworm Team) assisted on some operations but is a different unit with a different mission. Legal teams and CERT partners build decisions on exactly these three phrases.", "wrongStudy": "Re-read the group description and the 2018 indictment summary: who, which unit, which tradecraft terms."}];

/* ================= G0007 exam engine — shared ================= */
'use strict';

var META = window.CM_META || {};
var EX = window.CM_EX || [];
var INTRO = window.CM_INTRO || {};

/* ---------- state ---------- */
var S = {
  phase: 'intro',            /* intro | exam | review | results */
  order: [],                 /* shuffled exercise indices */
  cur: 0,                    /* position in order */
  answered: {},              /* idx -> {credit, label} */
  skipped: [],               /* idx list */
  returnedFromReview: false,
  credits: {},               /* idx -> credit float */
  hintUsed: {},              /* idx -> true */
  timeLeft: 0, budget: 0,
  tstate: 'ENDED',           /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  pauseFrom: null,           /* state to return to after manual pause */
  manualSecs: 0, autoSecs: 0, stateSince: null,
  reported: false, attempt: 0,
  lastTick: null
};

/* ---------- tiny helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
/* content-only escape: keeps literal double quotes so the highlighter can
   tokenise quoted strings; safe because it is only used for element text */
function escText(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtT(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s); }
function pct(sum, n) { return n > 0 ? Math.round((sum / n) * 100) : 0; }
/* Percent over the ROUNDED credit sum, so the on-screen percent, the posted
   percent and percent recomputed from the posted score/total always agree. */
function roundedPercent(sum, n) { return n > 0 ? Math.round((Math.round(sum) / n) * 100) : 0; }
function exCount() { return EX.length; }
function currentEx() { return EX[S.order[S.cur]]; }
function answeredCount() { return Object.keys(S.credits).length; }
function creditSum() { var t = 0; for (var k in S.credits) { t += S.credits[k]; } return t; }

/* ---------- partial credit engine (mandatory formula) ---------- */
function scoreExercise(selectedCount, correctCount, wrongCount) {
  var N = correctCount, H = selectedCount, W = wrongCount;
  if (N <= 0) { return 0; }
  return Math.max(0, (H - W) / N);
}

/* ---------- timer state machine ---------- */
var TSTATE = { RUNNING: 'RUNNING', PAUSED_MANUAL: 'PAUSED_MANUAL', PAUSED_AUTO_CHECK: 'PAUSED_AUTO_CHECK', ENDED: 'ENDED' };
function setTimerState(st) {
  /* accumulate time spent in each pause state (results screen logs both) */
  var now = Date.now();
  if (S.stateSince !== null && S.tstate === TSTATE.PAUSED_MANUAL) { S.manualSecs += (now - S.stateSince) / 1000; }
  if (S.stateSince !== null && S.tstate === TSTATE.PAUSED_AUTO_CHECK) { S.autoSecs += (now - S.stateSince) / 1000; }
  S.tstate = st;
  S.stateSince = now;
  var chip = $('timerchip');
  if (!chip) { return; }
  var w = chip.querySelector('.st-word');
  var ic = chip.querySelector('.st-ic');
  chip.classList.remove('paused', 'paused-auto', 'ended');
  if (st === TSTATE.RUNNING) { if (w) { w.textContent = 'Running'; } if (ic) { ic.textContent = '\u25B6'; } }
  else if (st === TSTATE.PAUSED_MANUAL) { chip.classList.add('paused'); if (w) { w.textContent = 'Paused \u2014 manual break (press Resume)'; } if (ic) { ic.textContent = '\u23F8'; } }
  else if (st === TSTATE.PAUSED_AUTO_CHECK) { chip.classList.add('paused-auto'); if (w) { w.textContent = 'Paused \u2014 reading feedback (resumes on Next)'; } if (ic) { ic.textContent = '\u{1F441}\uFE0F'; } }
  else if (st === TSTATE.ENDED) { chip.classList.add('ended'); if (w) { w.textContent = 'Ended'; } if (ic) { ic.textContent = '\u23F1'; } }
}
function tick() {
  /* no timer tick while paused: timeLeft only moves in RUNNING */
  if (S.tstate !== TSTATE.RUNNING) { S.lastTick = null; return; }
  var now = Date.now();
  if (S.lastTick !== null) {
    var dt = Math.round((now - S.lastTick) / 1000);
    if (dt > 0) { S.timeLeft = Math.max(0, S.timeLeft - dt); }
  }
  S.lastTick = now;
  var t = $('timerval');
  if (t) { t.textContent = fmtT(S.timeLeft); }
  if (S.timeLeft <= 0 && S.tstate === TSTATE.RUNNING) {
    setTimerState(TSTATE.ENDED);
    if (S.skipped.length > 0) { openReview(true); }
    else if (S.phase === 'exam') { finishExam(); }
  }
}
setInterval(function () { if (S.phase === 'exam' || S.phase === 'review') { tick(); } }, 500);

/* ---------- header ---------- */
function sevClass() { return META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty; }
function sevWord() { return ({ 'easy': 'EASY', 'medium': 'MEDIUM', 'hard': 'HARD', 'extremely-hard': 'EXTREMELY HARD' })[META.difficulty] || 'EASY'; }
function sevColor() { return ({ 'easy': 'var(--sev-easy)', 'medium': 'var(--sev-medium)', 'hard': 'var(--sev-hard)', 'extremely-hard': 'var(--sev-extreme)' })[META.difficulty] || 'var(--sev-easy)'; }

function renderHeader() {
  var h = $('examhead');
  if (!h) { return; }
  var ex = currentEx();
  var num = (S.cur >= 0 && S.cur < S.order.length) ? (S.cur + 1) : 1;
  var htmlStr = '';
  htmlStr += '<div class="inner">';
  if (S.phase === 'review') { htmlStr += '<span class="counter">Reviewing skipped exercises <span class="mono">(' + S.skipped.length + ')</span> \u2014 timer still running</span>'; }
  else { htmlStr += '<span class="counter">Exercise <span class="mono">' + num + '</span> of ' + exCount() + '</span>'; }
  htmlStr += '<span class="badge ' + sevClass() + '" role="img" aria-label="Severity ' + sevWord() + '">' + sevWord() + '</span>';
  if (META.part) { htmlStr += '<span class="chip">' + esc(META.part) + '</span>'; }
  htmlStr += '<span class="spacer"></span>';
  htmlStr += '<span class="chip timerchip' + (S.tstate === TSTATE.ENDED ? ' ended' : (S.tstate === TSTATE.PAUSED_AUTO_CHECK ? ' paused paused-auto' : (S.tstate === TSTATE.PAUSED_MANUAL ? ' paused' : ''))) + '" id="timerchip" aria-label="Timer state">';
  htmlStr += '<span class="st-ic" aria-hidden="true">\u25B6</span> <span class="mono" id="timerval">' + fmtT(S.timeLeft) + '</span> <span class="st-word">RUNNING</span></span>';
  htmlStr += '<span class="chip scorechip" aria-label="Live score"><span>' + creditSum().toFixed(1) + ' / ' + answeredCount() + '</span> <span class="pct">(' + pct(creditSum(), answeredCount()) + '%)</span></span>';
  htmlStr += '<button class="btn ghost hbtn" id="btn-pause" aria-label="Pause exam">\u23F8 Pause</button>';
  htmlStr += '<button class="btn warn hbtn" id="btn-hint2" aria-label="Use a hint">\u{1F4A1} Hint</button>';
  htmlStr += '<button class="btn ghost hbtn" id="btn-skip2" aria-label="Skip exercise">\u26A0 Skip</button>';
  htmlStr += '</div>';
  h.innerHTML = htmlStr;
  setTimerState(S.tstate); /* re-apply current timer label to freshly built DOM */
  var prog = $('progbar');
  if (prog) { prog.style.width = Math.round((answeredCount() / exCount()) * 100) + '%'; prog.style.setProperty('--sev', sevColor()); }
  wireHeader();
}

function wireHeader() {
  var bp = $('btn-pause'), bh = $('btn-hint2'), bs = $('btn-skip2');
  if (bp) { bp.onclick = manualPause; }
  if (bs) { bs.onclick = skipCurrent; }
  if (bh) { bh.onclick = function () { doHint(); }; }
  var curIdx = S.order[S.cur];
  /* header hint/skip only make sense on an unanswered exercise in the exam phase;
     disabling them here also closes the path that would leak a PAUSED_AUTO_CHECK
     state into the next exercise via the header skip button */
  if (bh && (S.phase !== 'exam' || S.hintUsed[curIdx] || S.answered[curIdx])) { bh.disabled = true; }
  if (bs && (S.phase !== 'exam' || S.answered[curIdx])) { bs.disabled = true; }
}

/* ---------- manual pause ---------- */
function manualPause() {
  if (S.tstate !== TSTATE.RUNNING && S.tstate !== TSTATE.PAUSED_AUTO_CHECK) { return; }
  S.pauseFrom = S.tstate;
  setTimerState(TSTATE.PAUSED_MANUAL);
  var ov = document.createElement('div');
  ov.className = 'pausedoverlay'; ov.id = 'pauseov';
  ov.innerHTML = '<div class="pbig"><span aria-hidden="true">\u23F8</span> Paused \u2014 manual break</div>' +
    '<div class="psub">The exercise is hidden while you are on break. The timer is stopped. Press Resume to continue the exam.</div>' +
    '<button class="btn primary" id="btn-resume" aria-label="Resume exam">\u25B6 Resume</button>';
  document.body.appendChild(ov);
  $('btn-resume').onclick = function () {
    var ovx = $('pauseov'); if (ovx) { ovx.parentNode.removeChild(ovx); }
    setTimerState(S.pauseFrom === TSTATE.PAUSED_AUTO_CHECK ? TSTATE.PAUSED_AUTO_CHECK : TSTATE.RUNNING);
    renderHeader();
  };
}

/* ---------- hint ---------- */
function doHint() {
  if (S.phase !== 'exam') { return; }
  var idx = S.order[S.cur];
  var ex = EX[idx];
  if (!ex || S.hintUsed[idx] || S.answered[idx]) { return; }
  S.hintUsed[idx] = true;
  var box = $('hintbox');
  if (box) {
    box.innerHTML = '<div class="htitle">\u{1F4A1} HINT \u2014 this hint costs 10% of this exercise\u2019s credit</div><div>' + esc(ex.hint) + '</div>';
    box.style.display = 'block';
    box.setAttribute('role', 'note');
  }
  var bh = $('btn-hint'); if (bh) { bh.disabled = true; }
  var bh2 = $('btn-hint2'); if (bh2) { bh2.disabled = true; }
}
