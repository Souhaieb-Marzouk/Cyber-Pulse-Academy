<script>
var EXAM = {"topicId":"t1592.002","topicTitle":"T1592.002 Gather Victim Host Information: Software","batch":2,"sevName":"MEDIUM","sevClass":"sev-medium","difficulty":"medium","passMark":70,"timerSec":2400,"exercises":[{"id":"m1","type":"qcm","title":"Technique AND tactic","scenario":[["art","ARTEFACT 1 — ATT&CK excerpt (adapted)","Adversaries may gather information about the victim's host\nsoftware during targeting. Direct collection includes Active\nScanning such as listening ports, server banners, and user\nagent strings."]],"q":"Identify the sub-technique AND the tactic it belongs to.","hint":"First name the family (host software), then remember when it happens (before access).","expl":"Two connected answers are needed. The artefact mentions **host software** gathered through scanning artefacts such as banners and user agents — that is **T1592.002 Software**. It is pre-compromise behaviour, so the tactic is **Reconnaissance**. T1592.004 is about client software *configurations*; Discovery (TA0007) happens after access; T1082 is the post-compromise look-alike.","study":"Drill the pair: T1592.002 ↔ Reconnaissance. The ID and the tactic travel together.","options":[{"t":"T1592.002 — Software · Reconnaissance","why":"Correct. Host software details via banners and user agents, gathered pre-compromise."},{"t":"T1592.004 — Client Configurations · Reconnaissance","why":"The tactic fits, but the technique does not: the excerpt is about the software inventory, not client configurations."},{"t":"T1592.002 — Software · Discovery","why":"The technique fits, but Discovery happens after the attacker is inside. This gathering is pre-compromise."},{"t":"T1082 — System Information Discovery · Discovery","why":"Both parts are off: T1082 is the post-compromise sibling, not this recon sub-technique."}],"correct":[0]},{"id":"m2","type":"terminal","title":"Read only the headers","scenario":[["p","You are preparing a short recon awareness demo for new joiners (approved, against your own lab site **www[.]target-example[.]com**). Goal: show the class the server's software banner."],["p","You decide to use **curl** (a command-line HTTP client already in the lab image). You only need the response **headers** — not the whole page body."]],"q":"Type the curl command that prints only the response headers of the lab site, then press Enter and Check.","hint":"You want the header block only, so think of the option that switches curl to HEAD mode.","expl":"The canonical command is **curl -sI hxxp://www[.]target-example[.]com**. `-I` switches curl to a HEAD request so only headers come back (that is where `Server: …` lives); `-s` just silences the progress meter. The target is the lab site. **Attacker view:** one request, zero authentication, and the banner hands over name + version — the core T1592.002 pattern. **Defender view:** this is why M1056 recommends suppressing version banners.","study":"Compare with wget --server-response: same headers, different tool.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"analyst@lab","prompt":"analyst@lab:~$","welcome":["# approved lab target: www[.]target-example[.]com"],"tools":["curl","wget","nc","nmap"],"expected":"curl -sI hxxp://www[.]target-example[.]com","outsim":[{"re":"^curl(.*\\s)?(-[a-z]*i|--head)","out":["HTTP/1.1 200 OK","Server: nginx/1.18.0 (Ubuntu)","Content-Type: text/html"]}],"defaultOut":["(the command runs, but you asked for the page body — no header block was shown)"],"elements":[{"re":"^curl","label":"tool: curl","why":"curl is the named HTTP client for this task."},{"re":"(^|\\s)-[a-z]*i|--head","label":"option: -I (HEAD — headers only)","why":"-I/--head asks for headers only, where the Server banner lives."},{"re":"target-example","label":"target: www[.]target-example[.]com","why":"The lab host named in the task."}],"parts":["`curl` — the HTTP client.","`-I` — HEAD request: print response headers only (this is where the software banner is).","`-s` — silent mode; optional polish, not required.","target — the lab site from the task."],"bad":[]}},{"id":"m3","type":"match","title":"Where did that leak from?","scenario":[["p","Your CTI teammate collected four artefacts about one target. Each leaked host software details through a different channel from the ATT&CK page. Match each artefact to its channel."]],"q":"Match every artefact with the channel it leaked through.","help":"Drag a chip into the box beside its artefact (or click chip, then box).","hint":"Ask for each: who produced this text — a server, a scanning tool, a file, or a human writer?","expl":"The page lists the channels: **direct active scanning** (server banners, user agents), and **accessible data sets** (job postings, resumes, invoices). A Server banner comes from the web server's response; an Nmap Scripting Engine user agent is sent *by the scanning tool*; a Producer field sits inside document **metadata**; a job advert is **public text** written by the company. All four feed T1592.002.","study":"Channel thinking: response header, request header, file metadata, public text.","left":["Server: nginx/1.18.0 (in the HTTP response)","User-Agent: Mozilla/5.0 (compatible; Nmap Scripting Engine)","Producer: Microsoft Word 2013 (inside a published PDF)","\"Our SOC team maintains our Splunk SIEM\" (job advert)"],"right":["HTTP response header — active scanning result","HTTP request header sent by the scanning tool itself","document metadata — hidden file details","public data set — text published by the company"],"correct":[0,1,2,3],"chipWhy":{"r0":"A Server header is part of the web server's response, captured by direct scanning.","r1":"The NSE user agent is announced by the scanner in its own requests.","r2":"Producer is a metadata field inside the file, readable after download.","r3":"Job adverts are published by the organisation and readable without any scanning."}},{"id":"m4","type":"tree","title":"Branching triage — PDF hunting","scenario":[["p","**ARTEFACT — web access log extract (firewalled site):**"],["art","ARTEFACT 1 — access log","198[.]51[.]100[.]77 - \"GET /downloads/brochure.pdf\"  200  \"curl/7.68.0\"\n198[.]51[.]100[.]77 - \"GET /files/catalog_v2.docx\"  200  \"curl/7.68.0\"\n198[.]51[.]100[.]77 - \"GET /downloads/terms.pdf\"     200  \"curl/7.68.0\""],["p","One external IP downloaded several documents in 20 minutes using curl. You are the SOC analyst on shift. Work through the triage steps — intermediate steps keep the timer running; only the final Check stops it."]],"q":"Classify the activity, name the technique, and choose the first response.","hint":"Documents from the victim's own website can be read for their hidden details.","expl":"The pattern — one external source pulling every published document with a scripting client — fits **metadata hunting**: the actor wants the software details inside the files, consistent with **T1592.002**. **Attacker view:** each PDF may carry Producer/application fields mapping to CVEs. **Defender view:** the least aggressive first response is to **scrub metadata and monitor the source** (M1056), not to isolate a domain controller — the activity targeted public files only.","study":"Read the \"various ways\" paragraph of the T1592.002 page: file metadata is a named vector.","steps":[{"q":"Step 1 — What is most likely happening?","opts":[{"t":"Collecting documents to read their hidden software details","ok":true,"why":"Pulling many published files with a scripting client fits metadata-based software recon.","out":"You note the files involved and queue a metadata check. The picture so far: quiet, targeted, read-only."},{"t":"A denial-of-service flood against the web server","ok":false,"why":"Three successful small downloads are not volumetric flooding; there is no service degradation in the log.","out":"You page the network team for a DoS that never happened. Twenty minutes later you are back where you started."},{"t":"A brute-force password attack on the login page","ok":false,"why":"No login requests appear in the artefact; the client downloaded documents directly.","out":"You enable account lockouts for an attack that never touched the login page."}]},{"q":"Step 2 — Which ATT&CK technique best fits this behaviour?","opts":[{"t":"T1592.002 — Gather Victim Host Information: Software","ok":true,"why":"Documents from the victim site are read for software metadata; pre-compromise, no access needed.","out":"The ticket now reads: suspected T1592.002 via document metadata."},{"t":"T1110.001 — Password Guessing","ok":false,"why":"Nothing in the artefact shows authentication attempts.","out":"The wrong technique in the ticket sends the responder team in the wrong direction."},{"t":"T1498 — Network Denial of Service","ok":false,"why":"No flood pattern or availability impact is present.","out":"The DoS playbook is opened and immediately closed again; time lost."}]},{"q":"Step 3 — Choose the first response.","opts":[{"t":"Scrub document metadata on the site and monitor the source IP","ok":true,"why":"Least aggressive and directly reduces the technique's value (M1056); keeps normal service running.","out":"The web team strips Producer fields at upload; monitoring stays on 198[.]51[.]100[.]77. Next morning the source is gone."},{"t":"Isolate the domain controller","ok":false,"why":"Disproportionate: public files were read; no internal system is involved.","out":"The DC isolation breaks file shares for two hours. The review board asks hard questions."},{"t":"Delete the log entries to keep the report clean","ok":false,"why":"Never destroy evidence; logs are the record of the event.","out":"The deleted lines are noticed in the weekly audit. Your report is now unsupported."}]}]},{"id":"m5","type":"fill","title":"Complete the CTI note","scenario":[["p","You are writing an intel note. The word bank has the three missing words plus distractors. Click a word, then click a blank."]],"q":"Fill all three blanks correctly.","hint":"Blank 1 and 2 are the two collection artefacts; blank 3 is the tactic name.","expl":"The actor used **server banners** and file **metadata** — the two collection artefacts from the page — and the behaviour lives in the **Reconnaissance** tactic. Firewalls and payroll are not collection artefacts here, and Lateral Movement happens post-compromise.","study":"Banner + metadata + Reconnaissance: say it until it is automatic.","pre":"The actor collected host software details through server ___ and file ___, behaviour catalogued as T1592.002 in the ___ tactic.","bank":["banners","metadata","Reconnaissance","firewalls","payroll","Lateral Movement"],"blanks":[{"accept":["banners"],"why":"Server banners are the response-header artefact named on the ATT&CK page."},{"accept":["metadata"],"why":"File metadata carries the creating-software details (Producer, Application fields)."},{"accept":["reconnaissance"],"why":"T1592.002 sits in Reconnaissance (TA0043), platform PRE."}]},{"id":"m6","type":"qcm","title":"Metadata to CVE","scenario":[["art","ARTEFACT 1 — exiftool output of a brochure from the victim website","Producer        : Microsoft Word 2013\nApplication     : Microsoft Office Word 2013\nCreate Date     : 2015:08:19 14:02:11"]],"q":"What does the attacker infer, and what is the next step?","hint":"The date is old. Old software often has public entries in the weakness database.","expl":"Two steps connect here. **Inference:** the victim used Word 2013 in 2015 — the creating software is old. **Next step:** the page says metadata \"can be cross-referenced with known CVEs to identify potential vectors for exploitation\", so the attacker searches public CVE data and prepares capabilities (T1587/T1588). The date is not a password hint, proves nothing about firewalls, and says nothing about visitor counts.","study":"Metadata → version → CVE lookup → capability development: the chain in one line.","options":[{"t":"Old creating software → search CVEs for an exploit path","why":"Correct. The page explicitly ties metadata versions to CVE cross-referencing."},{"t":"The 2015 date is a hint to the document password","why":"Wrong. Dates are not passwords; nothing supports this."},{"t":"The metadata proves the company firewall is missing","why":"Wrong. Metadata reveals software, not network defences."},{"t":"The file has been downloaded 2015 times so far","why":"Wrong. CreateDate is the file creation time, not a download counter."}],"correct":[0]},{"id":"m7","type":"dnd","title":"Sort the four techniques","scenario":[["p","Four technique chips must go to the right matrix column. Two are pre-compromise (Reconnaissance), two happen after access (Discovery)."]],"q":"Drag each technique chip onto its correct column.","help":"Drag the chips, or click a chip and then click a column.","hint":"Ask per chip: does this need a foothold inside first?","expl":"**Reconnaissance (pre-compromise):** T1592.002 (host software details) and T1595.002 (vulnerability scanning from outside). **Discovery (post-compromise):** T1082 (system information after a foothold) and T1016 (network configuration from inside). The discriminator is *position in the lifecycle*, not the data gathered.","study":"Same data, different phase: T1592.002 outside vs T1082 inside.","zones":[{"id":"z1","label":"Reconnaissance — before access"},{"id":"z2","label":"Discovery — after access"}],"chips":[{"id":"c1","t":"T1592.002 — host software details via banners"},{"id":"c2","t":"T1595.002 — vulnerability scanning of exposed services"},{"id":"c3","t":"T1082 — system info via shell on compromised host"},{"id":"c4","t":"T1016 — local network config on compromised host"}],"correct":{"c1":"z1","c2":"z1","c3":"z2","c4":"z2"},"chipWhy":{"c1":"T1592.002 is a Reconnaissance sub-technique (PRE).","c2":"Vulnerability scanning of exposed services is Active Scanning in Reconnaissance.","c3":"T1082 requires a foothold, so it is Discovery.","c4":"T1016 runs on an inside host, so it is Discovery."}},{"id":"m8","type":"logview","title":"Select the recon lines","scenario":[["p","Ten access-log lines from one morning sit in the viewer. One external IP behaves differently from the rest. Use the filter box (try the IP or \"curl\"), then click every line that shows software-information collection."],["art","ARTEFACT 1 — context note","The site publishes /docs/*.pdf and /docs/*.docx for customers.\nNormal visitors use Chrome, Firefox or Safari user agents."]],"q":"Click every log line that evidences host-software information gathering, then Check.","hint":"Look for a scripting-tool user agent and document downloads from one source.","expl":"Lines 3, 6 and 9 form the pattern: **HEAD request with an Nmap Scripting Engine user agent** (banner/version probing) plus **document downloads with curl** (metadata hunting) from the same external IP — a T1592.002 sequence. Line 4 is the well-known Googlebot crawler (normal); line 5 is a login POST (different technique if anything); the rest is ordinary browsing.","study":"Chains matter: one probe + targeted downloads beats any single line.","logview":{"click":true,"lines":["198[.]51[.]100[.]20 - \"GET /products.html\" 200 \"Mozilla/5.0 (Windows) Chrome/122.0\"","198[.]51[.]100[.]31 - \"GET /pricing\" 200 \"Mozilla/5.0 (Macintosh) Safari/17.0\"","198[.]51[.]100[.]77 - \"HEAD /server-status\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"","66[.]249[.]66[.]1    - \"GET /robots.txt\" 200 \"Mozilla/5.0 (compatible; Googlebot/2.1)\"","198[.]51[.]100[.]44 - \"POST /login\" 302 \"Mozilla/5.0 (Windows) Edge/122.0\"","198[.]51[.]100[.]77 - \"GET /docs/spec_v1.docx\" 200 \"curl/7.68.0\"","198[.]51[.]100[.]31 - \"GET /team.html\" 200 \"Mozilla/5.0 (Macintosh) Safari/17.0\"","198[.]51[.]100[.]20 - \"GET /favicon.ico\" 200 \"Mozilla/5.0 (Windows) Chrome/122.0\"","198[.]51[.]100[.]77 - \"GET /docs/spec_v1.pdf\" 200 \"curl/7.68.0\"","198[.]51[.]100[.]52 - \"GET /contact.html\" 200 \"Mozilla/5.0 (X11; Linux) Firefox/123.0\""],"clickCorrect":[2,5,8],"why":{"0":"Ordinary Chrome browsing of a product page.","1":"Ordinary Safari browsing of pricing.","2":"NSE user agent probing an admin path — classic version/banner recon.","3":"Googlebot is the well-known search crawler; expected noise.","4":"A login POST is not document collection; different concern.","5":"curl pulling a .docx from one external IP — metadata hunting.","6":"Ordinary Safari browsing of the team page.","7":"Favicon fetch — noise.","8":"curl pulling the same document as PDF — metadata hunting again.","9":"Ordinary Firefox browsing."}}},{"id":"m9","type":"multi","title":"Find the two false statements","scenario":[["p","A junior analyst wrote five statements about T1592.002 in the shift handover. Two are false. Click the two **false** statements."]],"q":"Select the two FALSE statements.","hint":"One false statement confuses the lifecycle; the other over-estimates a control.","expl":"Statement B is false because T1592.002 is **pre-compromise** — it happens before any login. Statement D is false because a firewall cannot stop an outsider from *reading* what your servers voluntarily announce; mitigation M1056 is about minimising what you expose, not blocking viewing. A, C and E are true: the tactic, the defensive-tool discovery (antivirus, SIEMs), and metadata leakage are all on the page.","study":"Re-read the M1056 wording: minimise data available to external parties.","options":[{"t":"A. It sits in the Reconnaissance tactic","why":"True. TA0043, platform PRE."},{"t":"B. It happens after the attacker logs into a victim server","why":"False — and this is one to select. After a login it would be Discovery (e.g. T1082), not this sub-technique."},{"t":"C. It can reveal the presence of antivirus products","why":"True. The definition names defensive components such as antivirus and SIEMs."},{"t":"D. A firewall rule can fully prevent outside banner reading","why":"False — and this is the second one to select. Reading a banner needs no blocked port; you reduce exposure instead (M1056)."},{"t":"E. File metadata can leak the software used to create documents","why":"True. Producer/Application fields are exactly this."}],"correct":[1,3]},{"id":"m10","type":"qcm","title":"What next for the attacker?","scenario":[["art","ARTEFACT 1 — banner captured from the target edge","$ curl -sI hxxp://vpn[.]target-example[.]com\nHTTP/1.1 200 OK\nServer: FortiOS 5.6 (Fortinet VPN)"]],"q":"From the attacker perspective, which next step matches ATT&CK logic?","hint":"A VPN appliance is a remote-work door. Which technique opens remote doors?","expl":"The banner reveals an **External Remote Services** surface (a VPN). The attacker's natural next recon/prep step maps to **T1133 External Remote Services** — checking for exposed login, default accounts, or known CVEs of FortiOS 5.6. Ransomware and SAM dumping both require access they do not have yet, and buying a firewall is not an attacker action. **Defender view:** the same banner tells the blue team to patch and hide the appliance version (M1056).","study":"Banners name doors; doors map to T1133 or T1190 depending on evidence.","options":[{"t":"Prepare attempts against the exposed VPN (T1133)","why":"Correct. The banner shows an external remote service; the recon logic points there next."},{"t":"Deploy ransomware across the network now","why":"Wrong. There is no access yet — ransomware needs a foothold first."},{"t":"Dump the SAM database of the domain controller","why":"Wrong. The attacker has no session on any internal host."},{"t":"Buy a newer firewall for the target company","why":"Wrong. Attackers do not buy defences for their targets."}],"correct":[0]},{"id":"m11","type":"rank","title":"Rank the three alerts","scenario":[["p","Three alerts are waiting in the queue. Rank them by how strongly each one indicates **T1592.002** activity."]],"q":"Drag the alerts so Rank 1 = strongest indication of T1592.002.","rankNote":"Rank 1 = strongest indication. Use drag or the arrow buttons.","hint":"Strong = external source + tooling user agent + repeated software-info probing.","expl":"**Rank 1:** repeated HEAD requests with an \"Nmap Scripting Engine\" user agent from one external IP — direct banner/version probing. **Rank 2:** one failed VPN login is a credential event, not host-software recon. **Rank 3:** a Googlebot logo fetch is expected crawler noise. The ranking tests both steps: recognise the artefact, then weigh its indication strength.","study":"Weigh: tooling UA + repetition + external source = strong recon signal.","correct":["ALERT A — 20 HEAD requests in 5 min, UA \"Nmap Scripting Engine\", one external IP","ALERT B — one failed VPN login for a known user from their home IP","ALERT C — one GET /logo.png 200 from a verified search-engine crawler"],"itemWhy":["Tool user agent plus repeated probing is the textbook T1592.002 pattern.","A failed login is credential activity (T1110 family), not host-software recon.","Verified crawler fetching a logo is normal internet noise."]},{"id":"m12","type":"match","title":"Discovered → reaction","scenario":[["p","The attacker's software inventory for one company is complete. For each discovered item, match the reaction an attacker actually plans."]],"q":"Match each discovered item with the attacker reaction.","help":"Drag a chip into the box beside its item (or click chip, then box).","hint":"EDR and SIEM are defences to work around; the old web server is a way in.","expl":"This exercise connects discovery to consequence. **SentinelOne EDR** → evasion planning, because landing a noisy tool alerts it. **Splunk SIEM** → keep noise low, because the SIEM watches logs from everywhere. **Apache 2.4.49** → CVE search, because that exact version has public weaknesses. The other pairings describe actions that do not follow from the discovery.","study":"Defensive tools shape tradecraft; vulnerable versions shape entry plans.","left":["Inventory says: SentinelOne EDR present","Inventory says: Splunk SIEM present","Inventory says: Apache 2.4.49 exposed"],"right":["plan evasion before running any tool","keep activity quiet — expect fast central alerting","search public CVE data for a way in"],"correct":[0,1,2],"chipWhy":{"r0":"Endpoint protection is met with evasion planning, not applause.","r1":"A SIEM correlates logs, so the attacker lowers noise instead of scattering alerts.","r2":"A named old server version maps to public CVEs — the exploitation path."}},{"id":"m13","type":"qcm","title":"Pick the telemetry","scenario":[["p","Detection-engineering question: an actor who is already **inside** a host runs `wmic product get name,version` and `dpkg -l` on two machines. Your team can collect only one new source this quarter."]],"q":"Which telemetry catches this internal enumeration best?","hint":"The evidence lives in the exact command line that was executed.","expl":"Two steps: recognise the behaviour (internal software enumeration commands) and choose the source that records it. **Process command-line parameters** (for example Sysmon Event ID 1) capture the literal command strings. DHCP, badge records, and DNS logs answer other questions and never show `wmic product`.","study":"For command-based recon, command-line telemetry is the anchor source.","options":[{"t":"Process creation events with command-line parameters","why":"Correct. The command string itself is the evidence."},{"t":"DHCP lease tables from the core DHCP servers","why":"Wrong. DHCP records address assignment, not process activity."},{"t":"Door badge records from the office access system","why":"Wrong. Physical access data says nothing about executed commands."},{"t":"DNS query logs from the recursive resolvers","why":"Wrong. DNS shows name lookups, not local enumeration commands."}],"correct":[0]},{"id":"m14","type":"selblank","title":"Draft the SOC weekly report","scenario":[["p","Your lead asks for one precise paragraph for the weekly report. Choose the right term for each dropdown."]],"q":"Complete the report sentence with the three correct terms.","hint":"Term 1 and 2 are the collection artefacts; term 3 is the ATT&CK technique ID.","expl":"The report names the artefacts (**banners**, **metadata**) and the technique (**T1592.002**). M1056 is a mitigation, not a behaviour; TA0001 is Initial Access; invoices and firmware do not fit the described collection.","study":"Write reports with IDs: behaviour first, then the ATT&CK reference.","parts":["During the window, one external host read server ",{"b":0,"o":["banners","invoices","password hashes"]}," and downloaded published documents to inspect their ",{"b":1,"o":["metadata","firmware","keyboard layouts"]},". The behaviour is catalogued as ",{"b":2,"o":["T1592.002","M1056","TA0001"]}," under the Reconnaissance tactic."],"blanks":[0,1,2],"optsFor":{"0":["banners","invoices","password hashes"],"1":["metadata","firmware","keyboard layouts"],"2":["T1592.002","M1056","TA0001"]},"correct":[0,0,0],"why":["Server banners are the response-header artefact that exposed the software.","Metadata inspection is why the documents were downloaded.","T1592.002 is the technique; M1056 is a mitigation and TA0001 is Initial Access."]},{"id":"m15","type":"multi","title":"Sources without scanning","scenario":[["p","The ATT&CK page says software details \"may also be exposed to adversaries via online or other accessible data sets\". A colleague asks which company materials count."]],"q":"Select every source that can expose host software details without any scanning.","hint":"Think: what does the organisation itself publish or misplace?","expl":"The page lists **job postings, network maps, assessment reports, resumes, and purchase invoices** as accessible data sets. Job adverts, staff CVs, and a misconfigured invoice portal all match. Offline encrypted tapes and private phone photos are not accessible data sets — the attacker cannot read them from outside.","study":"Data-set recon needs no packets: your own publications do the work.","options":[{"t":"Job adverts naming the exact SIEM and EDR in use","why":"Correct. Job postings are named on the page; defence tools are often listed in requirements."},{"t":"Staff CVs listing product experience","why":"Correct. Resumes are named on the page as an accessible data set."},{"t":"Purchase invoices readable on a misconfigured portal","why":"Correct. Purchase invoices are named; portals sometimes leak them."},{"t":"Encrypted backup tapes stored offline in a safe","why":"Wrong. Not accessible to an outside actor gathering open data."},{"t":"Private holiday photos kept on an employee phone","why":"Wrong. Private device storage is not a published data set."}],"correct":[0,1,2]},{"id":"m16","type":"qcm","title":"Choose the M1056 control pair","scenario":[["p","Your GRC board asks which existing controls map to mitigation **M1056 Pre-compromise** for T1592.002. The M1056 text: \"minimise the amount and sensitivity of data available to external parties.\""]],"q":"Which control pair best matches M1056 for this technique?","hint":"Both controls must reduce what an outsider can *read* about your software.","expl":"Stripping version banners and scrubbing document metadata directly reduce externally readable software detail — exactly M1056. A SIEM is detective and does not shrink the exposed data; password rotation and honeypots address other techniques; full air-gapping is an extreme architectural choice, not the practical M1056 mapping here.","study":"M1056 asks: what does the outside world learn about us for free?","options":[{"t":"Strip version banners + scrub document metadata","why":"Correct. Both directly minimise externally readable software detail."},{"t":"Install a SIEM + block all USB drives","why":"Wrong. Detective tooling and device control do not reduce public exposure."},{"t":"90-day password rotation + honeypots","why":"Wrong. Neither touches banner or metadata exposure."},{"t":"Full air-gapping + yearly audits","why":"Wrong. Disproportionate, and audits do not minimise the leaked fields."}],"correct":[0]}],"intro":{"tagline":"You know the basics — now combine two ideas per exercise.","about":"\n<p><b>T1592.002 — Software</b> is a <b>sub-technique</b> of <b>T1592 Gather Victim Host Information</b>, in the <b>Reconnaissance</b> tactic, platform <b>PRE</b> (pre-compromise: before the attacker gets in). It describes how adversaries learn which <b>programs</b> run on the victim's hosts: software <b>types and versions</b>, plus the presence of <b>defensive components</b> such as antivirus and SIEMs.</p>\n<p>The ATT&amp;CK page names the main collection ways, and this tier tests them:</p>\n<ul>\n<li><b>Active Scanning</b> — reading listening ports, <b>server banners</b>, and <b>user agent strings</b>.</li>\n<li><b>Phishing for Information</b> — tricking people into revealing details.</li>\n<li><b>Malicious content on compromised sites</b> — scripts that profile visitors (the Andariel and Magic Hound procedure examples do this).</li>\n<li><b>Accessible data sets</b> — job postings, network maps, assessment reports, resumes, purchase invoices.</li>\n<li><b>File metadata</b> — PDFs, DOCs, images and audio can carry software names, versions, configurations and timestamps, which are then cross-referenced with <b>CVEs</b> (public entries for known weaknesses).</li>\n</ul>\n<p>Findings feed other recon (<b>T1593</b> Search Open Websites/Domains, <b>T1597</b> Search Open Technical Databases), resource development (<b>T1587</b> Develop Capabilities, <b>T1588</b> Obtain Capabilities), and initial access (<b>T1133</b> External Remote Services, <b>T1195</b> Supply Chain Compromise). Real users of this technique on the page: <b>Andariel (G0138)</b>, <b>Magic Hound (G0059)</b>, <b>Sandworm Team (G0034)</b>, and the <b>Anthropic AI-orchestrated Campaign (C0062)</b>.</p>\n<p>At work you will meet it as a <b>SOC analyst</b> (triage scanning alerts), <b>CTI analyst</b> (name the technique in reports), <b>detection engineer</b> (run detection strategy <b>DET0888</b> and tune its high false-positive rate), <b>vulnerability manager</b> (prioritise exposed versions), <b>incident responder</b> (read recon as preparation), <b>red teamer</b> (use the same tradecraft in approved tests), and <b>GRC analyst</b> (apply mitigation <b>M1056 Pre-compromise</b> — minimise the data outsiders can reach).</p>\n","keywords":[{"t":"Identity & family","chips":["T1592.002","parent T1592","Reconnaissance TA0043","PRE"]},{"t":"Vectors","chips":["server banners","user agent strings","file metadata","public datasets","compromised-site scripts"]},{"t":"Leads to","chips":["T1593","T1597","T1587","T1588","T1133 External Remote Services","T1195 Supply Chain Compromise"]},{"t":"CTI examples","chips":["G0138 Andariel","G0059 Magic Hound","G0034 Sandworm Team","C0062 Anthropic campaign"]},{"t":"Defense","chips":["M1056 Pre-compromise","DET0888","high false-positive rate","Initial Access focus"]},{"t":"Discriminators","chips":["vs T1082 (post-compromise)","vs T1595.002 Vulnerability Scanning","CVE cross-reference"]}],"how":"\n<p><b>Goal:</b> score at least <b>70%</b> to pass. This is the <b>MEDIUM</b> tier: every exercise connects <b>two ideas</b> (for example: recognise the artefact, then choose the control). The path is not spelled out — you decide what to look at first.</p>\n<p><b>Exercise types:</b> multiple choice, select-all-that-apply, matching, drag-and-drop onto the ATT&amp;CK matrix, ranking, log-viewer triage with a filter box, report drafting with dropdowns, a branching SOC scenario, and one terminal where you choose the right tool options (fake shell — nothing real runs).</p>\n<p><b>Partial credit:</b> multi-item exercises give <b>partial credit</b>: each correct item counts, each wrong selection subtracts one. Formula: (correct − wrong) ÷ items. Selecting everything is always zero.</p>\n<p><b>Check and the timer:</b> pressing <b>Check</b> stops the timer automatically so you can study the feedback without pressure. The timer resumes only on <b>Next</b>. <b>Pause</b> is a normal break and hides the exercise. In the branching scenario, only the final Check stops the timer — intermediate confirmations keep it running.</p>\n<p><b>Hints and skipping:</b> one hint per exercise (−10% of that exercise's credit). Skipped exercises go to a pool you can revisit before the end. Skipped-and-never-answered exercises are excluded from the score.</p>\n<p><b>Retake:</b> failing lets you retake with reshuffled questions and answers.</p>\n"}};

var resultsShown = false;
var widget = null;         /* active widget controller */

/* ---- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---- */
var TS = { RUN:'RUNNING', PM:'PAUSED_MANUAL', PA:'PAUSED_AUTO_CHECK', END:'ENDED' };
var tstate = TS.RUN;
var remain = EXAM.timerSec;
var resumeTarget = TS.RUN;
var manualMark = 0, autoMark = 0;
var pauseManualSec = 0, pauseAutoSec = 0;
var exTimerLeft = 0;       /* reduced per-exercise timer (seconds) */
var ended = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtT(s){ s=Math.max(0,s|0); var m=(s/60)|0, r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pct(x){ return Math.round(x*100); }
/* partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){ if(N<=0){return 0;} return Math.max(0,(H-W)/N); }

/* ============ header rendering ============ */
function stateInfo(){
  if(tstate===TS.RUN)  return {cls:'tstate-run',  ic:'▶', w:'RUNNING'};
  if(tstate===TS.PM)   return {cls:'tstate-pm',   ic:'⏸', w:'PAUSED — manual (press Resume)'};
  if(tstate===TS.PA)   return {cls:'tstate-pa',   ic:'⏸', w:'PAUSED — reviewing feedback (resumes on Next)'};
  return {cls:'tstate-end', ic:'⏹', w:'ENDED'};
}
function renderHeader(){
  var si = stateInfo();
  $('t-clock').textContent = '⏱ '+fmtT(remain);
  var st = $('t-state'); st.textContent = si.ic+' '+si.w; st.className = 'hchip '+si.cls;
  var shown = Math.round(creditSum*10)/10;
  var p = answeredCount>0 ? pct(creditSum/answeredCount) : 0;
  $('t-score').innerHTML = 'Score <b>'+shown.toFixed(1)+' / '+answeredCount+'</b> · '+p+'%';
}
function renderCounter(exIdx){
  $('t-count').innerHTML = 'Exercise <b>'+(ORDERPOS[exIdx]||'-')+' of '+EX.length+'</b>';
  var sev = $('t-sev'); if(sev){ /* severity badge is static per file */ }
}

/* ============ pause logging ============ */
function nowSec(){ return Date.now()/1000; }
function enterAutoPause(){
  if(tstate===TS.END){ return; }
  tstate = TS.PA; autoMark = nowSec(); renderHeader();
}
function leaveAutoPause(){
  if(autoMark>0){ pauseAutoSec += Math.max(0, nowSec()-autoMark); autoMark=0; }
}
function manualPause(){
  if(tstate===TS.RUN){ resumeTarget = TS.RUN; }
  else if(tstate===TS.PA){ resumeTarget = TS.PA; }
  else { return; }
  tstate = TS.PM; manualMark = nowSec();
  renderHeader(); showPauseOverlay();
}
function manualResume(){
  if(manualMark>0){ pauseManualSec += Math.max(0, nowSec()-manualMark); manualMark=0; }
  tstate = resumeTarget;
  hidePauseOverlay(); renderHeader();
}
function showPauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  $('stage').classList.add('hid');
  ov.classList.remove('hid');
}
function hidePauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  ov.classList.add('hid');
  $('stage').classList.remove('hid');
}

/* ============ timer ============ */
function tick(){
  if(tstate!==TS.RUN || ended){ return; }
  remain--;
  if(remain<=0){ remain=0; renderHeader(); timeUp(); return; }
  var c = EX[curEx];
  if(c && c.terminal && c.terminal.timerSec && exTimerLeft>0 && ansState[curEx]!=='answered'){
    exTimerLeft--;
    var chip = $('extimer');
    if(chip){ chip.textContent='⏳ '+fmtT(exTimerLeft)+' left on this console'; }
    if(exTimerLeft<=0){ gradeCurrent(true); }
  }
  renderHeader();
}
function timeUp(){
  if(ended){ return; }
  ended = true; tstate = TS.END; renderHeader();
  finish(true);
}

/* ============ flow ============ */
function buildOrder(){
  ORDER = shuffle(EX.map(function(_,i){ return i; }));
  /* brief contract: the two terminal exercises must never be adjacent in play order */
  for(var guard=0; guard<50; guard++){
    var bad = -1;
    for(var k=0;k<ORDER.length-1;k++){
      if(EX[ORDER[k]].type==='terminal' && EX[ORDER[k+1]].type==='terminal'){ bad=k; break; }
    }
    if(bad<0){ break; }
    var other = -1;
    for(var k2=0;k2<ORDER.length;k2++){
      if(k2!==bad && k2!==bad+1 && EX[ORDER[k2]].type!=='terminal' &&
         (bad+2>=ORDER.length || k2!==bad+2) && (bad-1<0 || k2!==bad-1)){ other=k2; break; }
    }
    if(other<0){ break; }
    var tmp = ORDER[bad+1]; ORDER[bad+1] = ORDER[other]; ORDER[other] = tmp;
  }
  ORDERPOS = {};
  ORDER.forEach(function(exIdx,i){ ORDERPOS[exIdx] = i+1; });
}
function startExam(){
  $('intro').classList.add('hid');
  $('exam').classList.remove('hid');
  buildOrder();
  renderHeader();
  nextUnanswered();
}
function nextUnanswered(){
  fromReview = false; inReview = false;
  var next = null;
  for(var k=0;k<ORDER.length;k++){
    var i = ORDER[k];
    if(!ansState[i]){ next = i; break; }
  }
  if(next===null){
    if(skipPool.length>0){ showReview(); } else { finish(false); }
    return;
  }
  renderExercise(next,false);
}
function showReview(){
  inReview = true; fromReview = false;
  updateHeaderButtons();
  var host = $('stage'); host.innerHTML='';
  var h = '<div class="card skipwrap"><h2>Review skipped exercises</h2>'+
    '<p>You skipped '+skipPool.length+' exercise'+(skipPool.length===1?'':'s')+
    '. You can go back to any of them and answer it now, as long as the timer has not ended. '+
    'Skipped exercises that stay unanswered are excluded from your score — they do not count for or against you.</p><div class="rlist">';
  skipPool.forEach(function(i){
    h += '<div class="ritem"><span class="ic">⚠</span><span>'+esc(EX[i].title)+'</span>'+
         '<button class="btn" data-rev="'+i+'">Answer this one</button></div>';
  });
  h += '</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
       '<button class="btn primary" id="btn-finish">Finish exam</button></div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-rev]'), function(b){
    b.addEventListener('click', function(){
      var i = parseInt(b.getAttribute('data-rev'),10);
      inReview = false; fromReview = true; renderExercise(i,true);
    });
  });
  $('btn-finish').addEventListener('click', function(){ finish(false); });
}

/* ============ exercise rendering ============ */
function fmtText(s){
  var t = esc(s);
  t = t.replace(/`([^`]+)`/g, function(m,a){ return '<code class="inline-code">'+a+'</code>'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, function(m,a){ return '<b>'+a+'</b>'; });
  t = t.replace(/\n/g,'<br>');
  return t;
}
function scenarioHTML(ex){
  var inner = '';
  (ex.scenario||[]).forEach(function(p){
    if(p[0]==='p'){ inner += '<p class="prose">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='art'){
      inner += '<div class="art"><div class="art-h">'+esc(p[1])+'</div><div class="art-b"><div class="mono">'+esc(p[2])+'</div></div></div>';
    }
    else if(p[0]==='note'){ inner += '<p class="small">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='tbl'){
      var rows = p[1]; var t='<table class="tbl">';
      rows.forEach(function(r,ri){ t+='<tr>'; r.forEach(function(c){ t+= (ri===0?'<th>':'<td>')+fmtText(c)+ (ri===0?'</th>':'</td>'); }); t+='</tr>'; });
      inner += t+'</table>';
    }
  });
  if(ex.collapsed){
    return '<details class="artwrap"><summary>📁 SCENARIO — '+esc(ex.summary||'read the scenario')+' (click to expand)</summary><div class="blk-b">'+inner+'</div></details>';
  }
  return '<div class="blk-h">🧾 SCENARIO</div><div class="blk-b">'+inner+'</div>';
}
function renderExercise(i, reviewMode){
  curEx = i;
  var ex = EX[i];
  var host = $('stage');
  var collapsed = !!ex.collapsed;
  var h = '<div class="ex-head"><span class="exnum">Exercise '+(ORDERPOS[i]||'-')+' of '+EX.length+'</span>'+
          '<span class="badge-sev '+EXAM.sevClass+'">'+esc(EXAM.sevName)+'</span>'+
          '<span class="ex-title">'+esc(ex.title)+'</span>'+
          (ex.terminal && ex.terminal.timerSec ? '<span class="exchip" id="extimer">⏳ '+fmtT(ex.terminal.timerSec)+' left on this console</span>':'')+
          '</div>';
  h += '<div class="blk scenario">'+scenarioHTML(ex)+'</div>';
  h += '<div class="blk question"><div class="blk-h">❓ QUESTION</div><div class="blk-b"><p class="qtext">'+fmtText(ex.q)+'</p></div></div>';
  h += '<div class="blk answer"><div class="blk-h">✍️ YOUR ANSWER</div><div class="blk-b" id="ansarea"></div></div>';
  h += '<div id="fbhost"></div>';
  host.innerHTML = h;
  renderCounter(i);
  $('fbhost').innerHTML='';
  widget = makeWidget(ex, $('ansarea'), reviewMode);
  widget.render();
  var bar = document.createElement('div');
  bar.style.cssText='display:flex;gap:10px;margin-top:12px;flex-wrap:wrap';
  bar.innerHTML = (ex.type==='tree'?'':'<button class="btn good" id="btn-check">Check</button>')+
                  (hintUsed[i]?'':'<button class="btn warn" id="btn-hint2">💡 Hint (−10% of this exercise)</button>');
  $('ansarea').appendChild(bar);
  var cb = $('btn-check');
  if(cb){ cb.addEventListener('click', function(){ gradeCurrent(false); }); }
  var hb = $('btn-hint2');
  if(hb){ hb.addEventListener('click', function(){ useHint(); }); }
  if(ex.hint && hintUsed[i]){ /* already used before returning from review */ }
  updateHeaderButtons();
}
function updateHeaderButtons(){
  var inactive = (curEx<0 || inReview || ansState[curEx]==='answered');
  var sk = $('btn-skip');
  if(sk){ sk.disabled = inactive; }
  var pa = $('btn-pause');
  if(pa){ pa.disabled = (tstate===TS.END); }
  var hh = $('btn-hint');
  if(hh){ hh.disabled = (inactive || !!hintUsed[curEx]); }
}
function useHint(){
  var i = curEx, ex = EX[i];
  if(i<0 || !ex || hintUsed[i] || ansState[i]==='answered'){ return; }
  hintUsed[i] = true;
  updateHeaderButtons();
  var fb = $('fbhost');
  var note = document.createElement('div');
  note.className = 'outcome';
  note.innerHTML = '<b>💡 HINT (this exercise will lose 10% of its credit)</b>'+fmtText(ex.hint||'Look again at the scenario and the question.');
  fb.insertBefore(note, fb.firstChild);
  var b2 = $('btn-hint2'); if(b2){ b2.remove(); }
}

/* ============ grading ============ */
function gradeCurrent(autoExpired){
  var i = curEx, ex = EX[i];
  if(ansState[i]==='answered'){ return; }
  /* FIRST action per spec: stop the timer into the auto-check pause state */
  enterAutoPause();
  if(autoExpired){ exTimerLeft = 0; var chip=$('extimer'); if(chip){ chip.textContent='⏳ time on this console has run out'; } }
  var res = widget.grade();            /* {H,W,N,items[],expl?} */
  var credit = scoreExercise(res.H,res.W,res.N);
  if(hintUsed[i]){ credit = Math.max(0, credit - 0.10); }
  ansCredit[i] = credit; ansState[i]='answered'; answeredCount++; creditSum += credit;
  renderFeedback(ex, res, credit, autoExpired);
  renderHeader(); updateHeaderButtons();
  var fbh = $('fbhost');
  if(fbh && fbh.scrollIntoView){ fbh.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function fbLabel(credit){
  if(credit>=0.9999){ return {t:'✓ CORRECT', cls:'ok'}; }
  if(credit>0){ return {t:'◐ PARTIALLY CORRECT', cls:'part'}; }
  return {t:'✗ INCORRECT', cls:'bad'};
}
function renderFeedback(ex, res, credit, autoExpired){
  var L = fbLabel(credit);
  var isMulti = res.N>1;
  var h = '<div class="fb '+L.cls+'"><div class="fb-h">'+L.t+'</div><div class="fb-b">';
  if(hintUsed[curEx]){ h += '<p class="small" style="margin:0 0 8px">💡 Hint was used on this exercise — the 10% credit reduction is already applied below.</p>'; }
  if(isMulti){ h += '<div class="fb-credit">credit '+credit.toFixed(2)+' — '+res.H+'/'+res.N+' items</div>'; }
  if(autoExpired){ h += '<p class="small">⏳ The console timer ran out, so your answer was submitted automatically.</p>'; }
  if(isMulti && res.items && res.items.length){
    h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok' ? '✓' : (it.s==='bad' ? '✗' : '○');
      var cl = it.s==='ok' ? 'ok' : (it.s==='bad' ? 'bad' : 'miss');
      var w  = it.s==='ok' ? 'Correct' : (it.s==='bad' ? 'Wrong' : 'Missed');
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why? ' — '+fmtText(it.why):'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<p class="prose">'+fmtText(res.expl || ex.expl || '')+'</p>';
  if(res.N===1 && res.items && res.items.length){ h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok'?'✓':'✗'; var cl = it.s==='ok'?'ok':'bad'; var w = it.s==='ok'?'Correct':'Wrong';
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why?' — '+fmtText(it.why):'')+'</span></div>';
    }); h += '</div>'; }
  if(ex.type==='terminal'){
    var term = ex.terminal;
    h += '<div class="synpanel"><h4>CANONICAL COMMAND</h4><div class="copyblk"><code class="inline-code" id="canon">'+esc(term.expected)+'</code>'+
         '<button class="copybtn" id="btn-copy">Copy</button></div>'+
         '<p style="margin:.5rem 0 0">Why it is built this way:</p><ul class="small">';
    (term.parts||[]).forEach(function(p){ h += '<li>'+fmtText(p)+'</li>'; });
    (term.bad||[]).forEach(function(bd){ h += '<li>⚠ '+fmtText(bd.why)+'</li>'; });
    h += '</ul></div>';
  }
  if(ex.study){ h += '<div class="study"><b>What to study next:</b> '+fmtText(ex.study)+'</div>'; }
  var isLast = (function(){
    for(var k=0;k<ORDER.length;k++){ var j=ORDER[k]; if(j!==curEx && !ansState[j]){ return false; } }
    return true;
  })();
  var reviewNeeded = skipPool.filter(function(i){ return ansState[i]!=='answered'; }).length>0;
  var nxt = !isLast ? 'Next ▸' : (reviewNeeded ? 'Review skipped ⏭' : 'Final Submit');
  h += '</div></div><div style="margin-top:12px"><button class="btn primary" id="btn-next">'+nxt+'</button></div>';
  $('fbhost').innerHTML = h;
  var cb = $('btn-copy');
  if(cb){ cb.addEventListener('click', function(){
    try{ navigator.clipboard.writeText($('canon').textContent); cb.textContent='Copied ✓'; setTimeout(function(){cb.textContent='Copy';},1500); }
    catch(e){ cb.textContent='Select & copy'; }
  }); }
  $('btn-next').addEventListener('click', function(){
    leaveAutoPause();
    if(tstate!==TS.END){ tstate = TS.RUN; }
    renderHeader();
    widget = null;
    if(fromReview){ fromReview=false; showReview(); }
    else if(isLast){
      if(reviewNeeded){ showReview(); } else { finish(false); }
    }
    else { nextUnanswered(); }
  });
  /* disable answering further */
  var aa = $('ansarea'); if(aa){ aa.classList.add('disabled'); Array.prototype.forEach.call(aa.querySelectorAll('button,input,select'), function(el){ el.disabled=true; }); }
}

/* ============ skip ============ */
function skipCurrent(){
  var i = curEx;
  if(ansState[i]==='answered'){ return; }
  if(ansState[i]!=='skipped'){ ansState[i]='skipped'; skipPool.push(i); }
  widget=null;
  if(fromReview){ fromReview=false; showReview(); return; }
  nextUnanswered();
}

/* ============ results ============ */
function finish(timeRanOut){
  if(resultsShown){ return; }
  resultsShown = true;
  if(timeRanOut){ /* timer already marked ENDED */ } else { ended = true; tstate = TS.END; renderHeader(); }
  hidePauseOverlay();
  var answeredIdx = Object.keys(ansState).filter(function(k){ return ansState[k]==='answered'; }).map(Number);
  var full=0, part=0, zero=0, partSum=0;
  answeredIdx.forEach(function(i){ var c=ansCredit[i]; if(c>=0.9999){full++;} else if(c>0){part++; partSum+=c;} else {zero++;} });
  var skippedLeft = Object.keys(ansState).filter(function(k){ return ansState[k]==='skipped'; }).map(Number);
  var neverTouched = EX.length - answeredIdx.length - skippedLeft.length;
  var pctFinal = answeredIdx.length>0 ? Math.round(creditSum/answeredIdx.length*100) : 0;
  var passed = pctFinal>=EXAM.passMark;
  $('exam').classList.add('hid');
  var r = $('results'); r.classList.remove('hid');
  var h = '<div class="card res"><h2>'+(timeRanOut?'⏹ Time is up — final results':'🏁 Final results')+'</h2>';
  h += '<p class="small">Score is computed only over exercises you actually answered. Skipped-and-unanswered exercises are excluded from the score completely.</p>';
  h += '<div class="score-big">'+(Math.round(creditSum*10)/10).toFixed(1)+' / '+answeredIdx.length+' · '+pctFinal+'%</div>';
  if(passed){
    h += '<div class="cert"><div class="big">✓ PASS — Congratulations!</div>'+
         '<p>You passed the '+esc(EXAM.sevName)+' practice exam for <b>'+esc(EXAM.topicTitle)+'</b> with '+pctFinal+'% (pass mark '+EXAM.passMark+'%).</p>'+
         '<p class="small">Cyber Pulse Academy · MITRE ATT&CK '+esc(EXAM.topicId.toUpperCase())+' · '+esc(EXAM.sevName)+' tier</p></div>';
  } else {
    h += '<div class="fail"><div class="big">✗ FAIL — '+pctFinal+'%</div>'+
         '<p>You need at least '+EXAM.passMark+'% to pass. You must retake this exam.</p>'+
         '<p class="small">Review the explanations you saw after each Check, then try again.</p></div>';
  }
  h += '<div class="res-grid">'+
    '<div class="res-card"><div class="n">'+full+'</div><div class="l">✓ fully correct</div></div>'+
    '<div class="res-card"><div class="n">'+part+'</div><div class="l">◐ partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="res-card"><div class="n">'+zero+'</div><div class="l">✗ fully incorrect</div></div>'+
    '<div class="res-card"><div class="n">'+(skippedLeft.length+neverTouched)+'</div><div class="l">⚠ skipped / unanswered (excluded)</div></div>'+
    '</div>';
  h += '<div class="pauselog">⏱ Time paused manually: <b>'+fmtT(Math.round(pauseManualSec))+'</b> · '+
       '⏸ Time reviewing feedback (auto-pause): <b>'+fmtT(Math.round(pauseAutoSec))+'</b> · '+
       'Time remaining: <b>'+fmtT(remain)+'</b></div>';
  h += '<div class="rlist">';
  ORDER.forEach(function(i){
    var st = ansState[i];
    var ic, tx;
    if(st==='answered'){ var c=ansCredit[i]; ic = c>=0.9999?'✓':(c>0?'◐':'✗'); tx='credit '+c.toFixed(2); }
    else { ic='⚠'; tx='skipped — excluded from score'; }
    h += '<div class="ritem"><span class="ic">'+ic+'</span><span>Exercise '+(ORDERPOS[i])+' — '+esc(EX[i].title)+'</span><span style="margin-left:auto">'+tx+'</span></div>';
  });
  h += '</div><div style="margin-top:16px"><button class="btn primary" id="btn-retake">↺ Retake Exam</button></div></div>';
  r.innerHTML = h;
  $('btn-retake').addEventListener('click', retake);
  reportScore(creditSum, answeredIdx.length);
}
function clearShuffles(){
  EX.forEach(function(ex){
    delete ex._optOrder; delete ex._bank; delete ex._chips; delete ex._shuf; delete ex._timerInit;
    if(ex.steps){ ex.steps.forEach(function(s){ delete s._order; }); }
  });
}
function retake(){
  reported = false; ended = false; tstate = TS.RUN; resultsShown = false;
  remain = EXAM.timerSec; creditSum = 0; answeredCount = 0;
  ansState = {}; ansCredit = {}; hintUsed = {}; skipPool = [];
  pauseManualSec = 0; pauseAutoSec = 0; manualMark = 0; autoMark = 0;
  clearShuffles();
  $('results').classList.add('hid');
  $('exam').classList.remove('hid');
  $('stage').innerHTML='';
  buildOrder(); renderHeader(); nextUnanswered();
}

/* ============ website integration ============ */
function reportScore(cSum, answeredN){
  if(reported){ return; }
  reported = true;
  var percent = answeredN>0 ? Math.round((cSum/answeredN)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(cSum),
      total: answeredN,
      percent: percent,
      passed: percent>=EXAM.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){ return; }
  try{
    if(event.data.username && $('who')){ $('who').textContent = 'Good luck, '+String(event.data.username).slice(0,40)+'!'; }
  }catch(e){}
});


/* ================= WIDGET FACTORY ================= */
function makeWidget(ex, host, reviewMode){
  var w = { ex:ex, host:host, reviewMode:reviewMode };
  var builders = {
    qcm: buildQcm, multi: buildQcm, fill: buildFill, match: buildMatch, dnd: buildDnd,
    order: buildOrderW, rank: buildOrderW, terminal: buildTerminal, logview: buildLogview,
    tree: buildTree, selblank: buildSelblank
  };
  var b = builders[ex.type] || buildQcm;
  w.render = function(){ b(w); };
  w.grade = function(){ return w._grade ? w._grade() : {H:0,W:0,N:1,items:[],expl:ex.expl}; };
  return w;
}
function letters(i){ return 'ABCDEFGH'.charAt(i%8)+'.'; }
function clip(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

/* ---------- QCM / multi-select ---------- */
function buildQcm(w){
  var ex = w.ex, host = w.host;
  if(!ex._optOrder){ ex._optOrder = shuffle(ex.options.map(function(_,i){return i;})); }
  var multi = ex.type==='multi';
  var h = '<div class="opts" role="'+(multi?'group':'radiogroup')+'">';
  ex._optOrder.forEach(function(oi,k){
    h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(ex.options[oi].t)+'</span></button>';
  });
  h += '</div>';
  if(multi){ h += '<p class="small" style="margin-top:8px">Select all that apply, then press Check. Wrong selections subtract from correct ones.</p>'; }
  host.insertAdjacentHTML('afterbegin', h);
  var sel = {};
  Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){
      var i = btn.getAttribute('data-i');
      if(multi){
        sel[i] = !sel[i]; btn.classList.toggle('sel', !!sel[i]);
      } else {
        sel = {}; sel[i] = true;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
      }
    });
  });
  w._grade = function(){
    var chosen = Object.keys(sel).filter(function(k){ return sel[k]; }).map(Number);
    var corr = ex.correct;
    var H=0, W=0, items=[];
    var lab = function(ci){ return letters(ex._optOrder.indexOf(ci))+' '+clip(ex.options[ci].t,90); };
    if(multi){
      corr.forEach(function(ci){
        if(sel[ci]){ H++; items.push({s:'ok', label:lab(ci), why:ex.options[ci].why}); }
        else { items.push({s:'miss', label:lab(ci), why:ex.options[ci].why}); }
      });
      chosen.forEach(function(ci){
        if(corr.indexOf(ci)<0){ W++; items.push({s:'bad', label:lab(ci), why:ex.options[ci].why}); }
      });
      return {H:H, W:W, N:corr.length, items:items, expl:ex.expl};
    }
    var ok = chosen.length===1 && corr.indexOf(chosen[0])>=0;
    if(ok){ H=1; }
    corr.forEach(function(ci){
      items.push({s: ok?'ok':'miss', label:lab(ci), why:ex.options[ci].why});
    });
    if(!ok && chosen.length===1){
      items.push({s:'bad', label:'Your choice: '+lab(chosen[0]), why:ex.options[chosen[0]].why});
    }
    return {H:H, W:W, N:1, items:items, expl:ex.expl};
  };
}

/* ---------- fill-in-the-blank (chips -> inline blanks) ---------- */
function buildFill(w){
  var ex = w.ex, host = w.host;
  if(!ex._bank){ ex._bank = shuffle(ex.bank.slice()); }
  var parts = ex.pre.split('___');
  var h = '<p class="prose">';
  parts.forEach(function(p,i){
    h += fmtText(p);
    if(i<parts.length-1){ h += '<span class="blank" data-b="'+i+'">…</span>'; }
  });
  h += '</p><div class="bank" id="fillbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#fillbank');
  var selChip = null;
  var placed = {};           /* blankIdx -> chip element */
  ex._bank.forEach(function(word){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=word;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    bank.appendChild(c);
  });
  Array.prototype.forEach.call(host.querySelectorAll('.blank'), function(z){
    z.addEventListener('click', function(){
      if(!selChip){ return; }
      var bi = z.getAttribute('data-b');
      if(placed[bi]){ placed[bi].classList.remove('placed'); }
      z.textContent = selChip.textContent;
      placed[bi] = selChip;
      selChip.classList.add('placed'); selChip.classList.remove('sel');
      selChip = null;
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bset,bi){
      var chipEl = placed[bi];
      var got = chipEl ? chipEl.textContent : '';
      var ok = got!=='' && bset.accept.some(function(a){ return a.toLowerCase()===got.toLowerCase(); });
      if(got===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
      else if(ok){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+got, why:bset.why}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+got, why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- shared chip->slot mechanics (match / dnd) ---------- */
function chipSlotWidget(w, cfg){
  var ex = w.ex, host = w.host;
  if(!ex._chips){ ex._chips = shuffle(cfg.chips.slice()); }
  var h = '<p class="small">'+(cfg.help||'Drag a chip into a box, or click a chip and then click a box.')+'</p>';
  h += '<div class="zones" id="zwrap">';
  cfg.zones.forEach(function(z){
    h += '<div class="zone" data-z="'+z.id+'" tabindex="0"><div class="zone-h">'+esc(z.label)+'</div><div class="zslots"></div></div>';
  });
  h += '</div><div class="bank" id="cbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#cbank');
  var selChip = null;
  var placed = {};           /* chipId -> zoneId */
  ex._chips.forEach(function(ch){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'+(ch.code?' code':''); c.textContent=ch.t; c.setAttribute('data-c',ch.id);
    c.draggable = true;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    c.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', ch.id); }catch(e){} selChip=c; c.classList.add('sel'); });
    bank.appendChild(c);
  });
  function dropInto(z, c){
    if(!c || !z){ return; }
    var zid = z.getAttribute('data-z');
    if(c._slot && c._slot.parentNode){ c._slot.parentNode.removeChild(c._slot); }
    var slot = document.createElement('span');
    slot.className='slot chip'+(c.classList.contains('code')?' code':'');
    slot.textContent = c.textContent;
    z.querySelector('.zslots').appendChild(slot);
    c._slot = slot;
    c.classList.add('placed'); c.classList.remove('sel');
    placed[c.getAttribute('data-c')] = zid;
    selChip = null;
  }
  Array.prototype.forEach.call(host.querySelectorAll('.zone'), function(z){
    z.addEventListener('click', function(){ if(selChip){ dropInto(z, selChip); } });
    z.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && selChip){ ev.preventDefault(); dropInto(z, selChip); } });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var cid=''; try{ cid = ev.dataTransfer.getData('text/plain'); }catch(e){}
      var c = bank.querySelector('[data-c="'+cid+'"]') || selChip;
      dropInto(z, c);
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[],N=0;
    cfg.chips.forEach(function(ch){
      var got = placed[ch.id];
      var want = cfg.correct[ch.id];
      var why = (cfg.chipWhy&&cfg.chipWhy[ch.id])||'';
      if(want){
        /* scored item: a chip with a correct home */
        N++;
        if(!got){ items.push({s:'miss', label:ch.t, why:why}); }
        else if(got===want){ H++; items.push({s:'ok', label:ch.t, why:why}); }
        else { W++; items.push({s:'bad', label:ch.t+' → placed in “'+(cfg.zoneName?cfg.zoneName[got]||got:got)+'”', why:why}); }
      } else if(got){
        /* distractor chip with no home: placing it anywhere is a wrong item */
        W++;
        items.push({s:'bad', label:ch.t+' → does not belong in any box', why:why||'This chip is a distractor — it is not part of the correct answer.'});
      }
    });
    if(N===0){ N=1; }
    return {H:H,W:W,N:N,items:items,expl:ex.expl};
  };
}
function buildMatch(w){
  var ex = w.ex;
  var chips = ex.right.map(function(r,i){ return {id:'r'+i, t:r, code:!!ex.code}; });
  var zones = ex.left.map(function(l,i){ return {id:'l'+i, label:l}; });
  /* chip-keyed map: chip rX belongs in zone lY  (grade looks up by chip id) */
  var correct = {}; ex.left.forEach(function(_,i){ correct['r'+ex.correct[i]] = 'l'+i; });
  var zoneName = {}; zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:zones, chips:chips, correct:correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}
function buildDnd(w){
  var ex = w.ex;
  var zoneName = {}; ex.zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:ex.zones, chips:ex.chips, correct:ex.correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}

/* ---------- order / rank ---------- */
function buildOrderW(w){
  var ex = w.ex, host = w.host;
  var ctx = ex.rankNote ? '<p class="small">'+esc(ex.rankNote)+'</p>' : '';
  if(!ex._shuf){ ex._shuf = shuffle(ex.correct.map(function(_,i){return i;})); }
  host.insertAdjacentHTML('afterbegin', ctx+'<div class="olist" id="olist"></div>');
  var list = host.querySelector('#olist');
  function bindAll(){
    Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var p = parseInt(b.getAttribute('data-p'),10);
        move(p, b.getAttribute('data-mv')==='up'? p-1 : p+1);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.oitem'), function(it){
      it.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      it.addEventListener('drop', function(ev){
        ev.preventDefault();
        var from = parseInt(ev.dataTransfer.getData('text/plain'),10);
        var to = parseInt(it.getAttribute('data-p'),10);
        if(!isNaN(from)){ move(from,to); }
      });
    });
  }
  function render(){
    list.innerHTML='';
    ex._shuf.forEach(function(itemIdx,pos){
      var d = document.createElement('div');
      d.className='oitem'; d.draggable=true; d.setAttribute('data-p',String(pos));
      d.innerHTML = '<span class="pos">'+(pos+1)+'</span><span style="flex:1">'+esc(ex.correct[itemIdx])+'</span>'+
        '<span class="obtns"><button type="button" aria-label="move up" data-mv="up" data-p="'+pos+'">▲</button>'+
        '<button type="button" aria-label="move down" data-mv="dn" data-p="'+pos+'">▼</button></span>';
      d.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', String(pos)); }catch(e){} d.classList.add('dragging'); });
      d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
      list.appendChild(d);
    });
    bindAll();
  }
  function move(from,to){
    if(from<0||to<0||from>=ex._shuf.length||to>=ex._shuf.length){ return; }
    var t = ex._shuf[from]; ex._shuf[from]=ex._shuf[to]; ex._shuf[to]=t; render();
  }
  render();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.correct.forEach(function(_,pos){
      var gotIdx = ex._shuf[pos];
      var ok = gotIdx===pos;
      if(ok){ H++; items.push({s:'ok', label:'Position '+(pos+1)+': '+clip(ex.correct[pos],70), why:ex.itemWhy?ex.itemWhy[pos]:''}); }
      else { W++; items.push({s:'bad', label:'Position '+(pos+1)+': you placed “'+clip(ex.correct[gotIdx],60)+'” — expected “'+clip(ex.correct[pos],60)+'”', why:ex.itemWhy?ex.itemWhy[pos]:''}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items,expl:ex.expl};
  };
}

/* ---------- terminal ---------- */
function normCmd(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function buildTerminal(w){
  var ex = w.ex, host = w.host, T = ex.terminal;
  if(!ex._timerInit){ ex._timerInit = true; exTimerLeft = T.timerSec||0; }
  var h = '';
  if(T.outshape){
    h += '<div class="synpanel"><h4>EXPECTED OUTPUT SHAPE</h4><div class="mono">'+esc(T.outshape)+'</div></div>';
  }
  if(T.syntax){
    h += '<div class="synpanel"><h4>SYNTAX REMINDER</h4>';
    h += '<p style="margin:.2rem 0">'+fmtText(T.syntax.shape)+'</p>';
    if(T.syntax.example){ h += '<p style="margin:.2rem 0">Example on a <b>different</b> target: <code class="inline-code">'+esc(T.syntax.example)+'</code></p>'; }
    if(T.syntax.flags && T.syntax.flags.length){ h += '<ul class="small" style="margin:.3rem 0 0 1.2rem">'; T.syntax.flags.forEach(function(f){ h+='<li>'+fmtText(f)+'</li>'; }); h+='</ul>'; }
    h += '</div>';
  }
  h += '<div class="term"><div class="term-h"><span>🖥 '+esc(T.termTitle||'simulation only — nothing real is executed')+'</span><span>'+esc(T.user||'analyst')+'</span></div>'+
       '<div class="term-out" id="tout"></div>'+
       '<div class="term-in"><span class="ps">'+esc(T.prompt||'$')+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="type your command and press Enter"></div></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var out = host.querySelector('#tout'), inp = host.querySelector('#tin');
  var lastCmd = '';
  (T.welcome||[]).forEach(function(l){
    var d=document.createElement('div'); d.textContent=l; out.appendChild(d);
  });
  function run(cmdRaw){
    var d1=document.createElement('div'); d1.textContent=(T.prompt||'$')+' '+cmdRaw; out.appendChild(d1);
    var cmd = normCmd(cmdRaw);
    lastCmd = cmd;
    var first = cmd.split(' ')[0];
    if(cmd===''){ /* nothing typed */ }
    else if(T.tools.indexOf(first)<0){
      var d2=document.createElement('div'); d2.textContent = (first? first+': ' : '')+'command not found';
      d2.style.color='#f0a8a4'; out.appendChild(d2);
    } else {
      var matched = null;
      (T.outsim||[]).some(function(os){ if(os.re && new RegExp(os.re,'i').test(cmd)){ matched = os; return true; } return false; });
      var lines = matched ? matched.out : (T.defaultOut||['(the command runs)']);
      lines.forEach(function(l){ var d3=document.createElement('div'); d3.textContent=l; out.appendChild(d3); });
    }
    out.scrollTop = out.scrollHeight;
  }
  inp.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){ var v=inp.value; inp.value=''; run(v); }
  });
  w._grade = function(){
    var cmd = lastCmd;
    var H=0,W=0,items=[];
    (T.elements||[]).forEach(function(el){
      var ok = new RegExp(el.re,'i').test(cmd);
      if(ok){ H++; items.push({s:'ok', label:el.label, why:el.why}); }
      else { items.push({s:'miss', label:el.label, why:el.why}); }
    });
    (T.bad||[]).forEach(function(bd){
      if(new RegExp(bd.re,'i').test(cmd)){ W++; items.push({s:'bad', label:bd.label, why:bd.why}); }
    });
    return {H:H,W:W,N:(T.elements||[]).length,items:items,expl:ex.expl};
  };
}

/* ---------- log viewer ---------- */
function buildLogview(w){

        else { items.push({s:'miss', label:'Log line '+(ci+1)+' — “'+clip(L.lines[ci],70)+'”', why:'You did not select it. '+(L.why?L.why[ci]:'')}); }
      });
      Object.keys(sel).forEach(function(k){
        var i=parseInt(k,10);
        if(sel[i] && L.clickCorrect.indexOf(i)<0){ W++; items.push({s:'bad', label:'Log line '+(i+1)+' — “'+clip(L.lines[i],70)+'”', why:(L.why&&L.why[i])||'This line does not show the behaviour asked in the question.'}); }
      });
      return {H:H,W:W,N:L.clickCorrect.length,items:items,expl:ex.expl};
    }
    return {H:0,W:0,N:1,items:[],expl:ex.expl};
  };
}

/* ---------- branching decision tree / simulation ---------- */
function buildTree(w){
  var ex = w.ex, host = w.host;
  var step = 0; var chosen = {};
  function renderStep(){
    var n = ex.steps.length;
    var s = ex.steps[step];
    if(!s._order){ s._order = shuffle(s.opts.map(function(_,i){return i;})); }
    var h = '<div><span class="stepchip">STEP '+(step+1)+' OF '+n+'</span></div>'+
            '<p class="prose" style="font-weight:600">'+fmtText(s.q)+'</p><div class="opts">';
    s._order.forEach(function(oi,k){
      h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(s.opts[oi].t)+'</span></button>';
    });
    h += '</div><div id="treeout"></div>';
    host.innerHTML = h;
    Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        var oi = parseInt(btn.getAttribute('data-i'),10);
        chosen[step] = oi;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
        var o = s.opts[oi];
        var last = (step===n-1);
        document.getElementById('treeout').innerHTML =
          '<div class="outcome"><b>RESULT OF YOUR CHOICE</b>'+fmtText(o.out)+'</div>'+
          '<button class="btn '+(last?'good':'primary')+'" id="tstep">'+(last?'Check final answer':'Confirm & continue ▸')+'</button>';
        document.getElementById('tstep').addEventListener('click', function(){
          if(last){ gradeCurrent(false); }
          else { step++; renderStep(); }
        });
      });
    });
  }
  renderStep();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.steps.forEach(function(s,i){
      var oi = chosen[i];
      var o = s.opts[oi];
      var lbl = 'Step '+(i+1)+': '+(o? clip(o.t,80) : '(no choice made)');
      if(o && o.ok){ H++; items.push({s:'ok', label:lbl, why:o.why||''}); }
      else if(o){ W++; items.push({s:'bad', label:lbl, why:o.why||''}); }
      else { items.push({s:'miss', label:lbl, why:''}); }
    });
    return {H:H,W:W,N:ex.steps.length,items:items,expl:ex.expl};
  };
}

    h += '<div class="kw-theme"><h3>'+esc(k.t)+'</h3><div class="kwrow">';
    k.chips.forEach(function(c){ h += '<span class="kw">'+esc(c)+'</span>'; });
    h += '</div></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2>How this exam works</h2>'+I.how+'</div>';
  h += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0">'+
       '<button class="btn primary" id="btn-start" style="font-size:1.05rem;padding:12px 26px">▶ Start the exam</button>'+
       '<span class="small">Timer '+Math.round(EXAM.timerSec/60)+' minutes · '+EX.length+' exercises · pass mark '+EXAM.passMark+'%</span></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}
function boot(){
  $('btn-pause').addEventListener('click', manualPause);
  $('btn-resume').addEventListener('click', manualResume);
  $('btn-skip').addEventListener('click', skipCurrent);
  $('btn-hint').addEventListener('click', useHint);
  renderIntro();
  renderHeader();
  updateHeaderButtons();
  setInterval(tick, 1000);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
