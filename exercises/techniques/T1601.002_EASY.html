<script>
window.EXAM_DATA = {"topicId":"t1601.002","batch":1,"objectID":"T1601.002 — Downgrade System Image (Sub-Technique of T1601 — Modify System Image)","passMark":70,"timerSeconds":1800,"estimatedMinutes":30,"sev":{"key":"easy","label":"EASY"},"intro":{"title":"T1601.002 — EASY practice exam","object":"T1601.002 — Downgrade System Image · Sub-Technique of T1601 — Modify System Image · Tactic: Defense Impairment · Platform: Network Devices · ATT&CK Enterprise, v2.0","learn":"<p>You will learn how attackers <b>downgrade the operating system image of a network device<\/b>, and how defenders catch them. Imagine you are a junior SOC analyst. One night, a branch switch starts running an older, weaker operating system. Who changed it, and how would you know? That is the story of this exam.<\/p><p>This ATT&CK object is a <b>Sub-Technique<\/b>: its ID is T1601.002, and it is a child of T1601 (Modify System Image). A sub-technique is a specific way of doing one bigger thing. Here the specific way is: install an <b>older version<\/b> of the device operating system so the device protects itself less. Older images have weaker encryption ciphers and fewer updated defensive features, and the change takes effect when the device reboots from the replaced image.<\/p><p>In real work you will meet this object everywhere: <b>SOC analysts<\/b> triage image-transfer and reload alerts; <b>network defenders and control owners<\/b> keep approved image baselines and check checksums; <b>threat hunters<\/b> look for the chain — transfer of an older image, boot-variable change, reload; <b>incident responders<\/b> validate device integrity out-of-band; <b>CTI analysts<\/b> explain the technique in reports; <b>red teamers<\/b> use it to show why boot integrity and signed images matter; <b>detection engineers<\/b> turn the ATT&CK detection guidance into SIEM rules; and <b>GRC analysts<\/b> map the mitigations (M1046 Boot Integrity, M1045 Code Signing, M1032 MFA, M1026 Privileged Account Management) to policies. The tools on both sides are simple and real: TFTP/SCP file transfers, IOS commands like <span class=\"mono\">show version<\/span> and <span class=\"mono\">verify /md5<\/span>, syslog, and TACACS+ command logs.<\/p><p>The risk this technique addresses is quiet and serious: a device that <i>looks<\/i> normal but defends itself less, which attackers can then use to weaken encryption or hide. After this exam you will recognise the object, its tactic (Defense Impairment), and the simple signals that give a downgrade away.<\/p>","themes":[{"name":"ATT&CK placement","items":["T1601.002 Downgrade System Image","Parent T1601 Modify System Image","Sibling T1601.001 Patch System Image","Tactic: Defense Impairment","Platform: Network Devices"]},{"name":"What a downgrade does","items":["Older OS image replaces the current one","Weaker encryption ciphers come back","Fewer defensive features survive","Takes effect at the next reload"]},{"name":"Attack chain basics","items":["Fetch older image (TFTP)","Copy into flash storage","Point the boot variable at it","Reload the device"]},{"name":"Defender view","items":["Transfer logs and syslog","Boot-variable configuration checks","Checksum (MD5) verification","Mitigations M1046, M1032, M1026"]}],"how":"<p>This is a <b>certification-style practice exam<\/b>. You need <b>70%<\/b> to pass. Each exercise shows three blocks, always in the same order: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber) and <b>YOUR ANSWER<\/b> (green). After you press Check you see the correct answer and a simple explanation, and the exam explains exactly what to study when you were wrong.<\/p><p><b>Exercise types in this file:<\/b> multiple-choice, matching, drag &amp; drop, fill-in-the-blank, click-to-order, an alert-triage simulation, a log viewer with a filter box, and two guided terminal exercises where you type a real device command.<\/p><p><b>Timer:<\/b> a countdown runs from start to finish (budget shown above). Two things can pause it. <b>Manual Pause<\/b> (the Pause button) stops the timer and hides the exercise — that is your break. <b>Check auto-pause<\/b> stops the timer the moment you press Check, so you can read the feedback as long as you like; the timer resumes only when you press Next. Skip and Hint never pause the timer.<\/p><p><b>Scoring:<\/b> single-answer exercises give full credit or zero. Exercises with several correct items give <b>partial credit<\/b>: credit = max(0, (H − W) / N), so wrong picks subtract. One hint per exercise costs 10% of that exercise's credit.<\/p><p><b>Skipping:<\/b> every exercise has a Skip button. Skipped exercises go to a pool; before you finish you may return to them as often as you like while the timer runs. Skipped-and-never-answered exercises are excluded from the score — they count as neither correct nor wrong. Press Start when you are ready.<\/p>","types":[]},"exercises":[{"id":"e01","type":"mc","summary":"ATT&CK excerpt — name that ID (T1601.002)","scen":{"lead":"You are a new SOC analyst. Your team lead sends you an excerpt from the MITRE ATT&CK framework and asks you to read it before your first network-device shift.","arts":[{"label":"ATT&CK excerpt","body":"<b class=\"t\">ID:<\/b> T1601.002\n<b class=\"t\">Sub-technique of:<\/b> T1601 (Modify System Image)\n<b class=\"t\">Tactic:<\/b> Defense Impairment\n<b class=\"t\">Platforms:<\/b> Network Devices\n\n<b class=\"k\">\"Adversaries may install an older version of the operating\nsystem of a network device to weaken security.\"<\/b>\n— MITRE ATT&CK, technique page T1601.002"}]},"question":"Which technique does the ID <b>T1601.002<\/b> name?","hint":"The excerpt tells you the family: it is a child of T1601, Modify System Image. The page name is printed right next to the ID on the real page.","correct":"<b>T1601.002 — Downgrade System Image<\/b>, a sub-technique of T1601 — Modify System Image, on the Network Devices platform.","expl":"T1601.002 is called <b>Downgrade System Image<\/b>. ATT&CK uses four digits and a dot for sub-techniques, so T1601.002 is a child of T1601 (Modify System Image). The sibling T1601.001 is Patch System Image — a different behaviour. Weaken Encryption (T1600) is a separate technique that a downgrade can enable, and it is not the name of T1601.002. What to study: the ATT&CK ID layout — parent ID, dot, sub-technique number.","items":[{"label":"The technique named T1601.002","note":"The page you read names T1601.002 \"Downgrade System Image\": installing an older OS version on a network device to weaken security."}],"data":{"options":["Patch System Image (T1601.001)","Downgrade System Image (T1601.002)","Weaken Encryption (T1600)","Modify System Image (T1601)"],"correct":1}},{"id":"e02","type":"mc","summary":"Which tactic owns T1601.002?","scen":{"lead":"During a lunch-and-learn, a colleague asks: \"Downgrading a router image — what is the adversary trying to achieve in ATT&CK terms? Which tactic column does T1601.002 sit in?\"","arts":[{"label":"One-line reminder","body":"A <b class=\"k\">tactic<\/b> is the adversary goal; a technique is the way they reach it.\nT1601.002 = install an older device OS image to <b class=\"s\">weaken security<\/b>."}]},"question":"Which ATT&CK tactic does T1601.002 belong to?","hint":"Ask yourself what the adversary gains: a device that defends itself less. Which tactic name matches that goal?","correct":"<b>Defense Impairment<\/b> — the tactic that covers weakening or bypassing the device's own protections.","expl":"T1601.002 sits in the <b>Defense Impairment<\/b> tactic. The goal of this behaviour is not to run code or to steal data directly — it is to make the device protect itself less, by rolling its operating system back to a weaker, older release. Execution is about running code, Reconnaissance is about gathering information first, and Collection is about gathering data. What to study: the difference between a tactic (the goal) and a technique (the method).","items":[{"label":"The tactic of T1601.002","note":"Defense Impairment is the goal column: the downgrade weakens the device's own security posture rather than directly executing commands or collecting data."}],"data":{"options":["Defense Impairment","Execution","Reconnaissance","Collection"],"correct":0}},{"id":"e03","type":"match","summary":"Three words every downgrade story uses","scen":{"lead":"Before you touch a real device, learn three words that appear in every image-downgrade incident report.","arts":[{"label":"Mini glossary context","body":"A network device keeps its operating system (the <b class=\"k\">image<\/b>) in storage.\nA <b class=\"k\">boot variable<\/b> says which file to load at start-up.\nA <b class=\"k\">reload<\/b> restarts the device and applies the change."}]},"question":"Match each term to its plain meaning.","hint":"Think about the life of the change: what the OS file is, what points to it, and what makes it load.","correct":"System image = the device operating system file; Boot variable = the pointer that says which image to load at start-up; Reload = restarting the device so the new setting takes effect.","expl":"These three words describe the whole attack surface of T1601.002: the <b>system image<\/b> is the operating system file in storage, the <b>boot variable<\/b> chooses which image loads at start-up, and a <b>reload<\/b> makes the device actually boot from it. An adversary who controls these three things controls which OS version a device runs. What to study: basic boot flow of an embedded network device.","items":[{"label":"System image","note":"The operating system file the device keeps in flash storage and runs."},{"label":"Boot variable","note":"The stored setting that tells the device which image file to load at start-up."},{"label":"Reload (reboot)","note":"A restart of the device — only after a reload does the new boot variable take effect."}],"data":{"lefts":["System image","Boot variable","Reload (reboot)"],"rights":["The operating system file the device runs","The stored pointer that selects which image loads at start-up","Restarting the device so a changed setting takes effect","An encrypted backup of user passwords"],"correct":[0,1,2]}},{"id":"e04","type":"dnd","summary":"Sort the facts about a downgrade","scen":{"lead":"Your mentor quizzed last week's intake class with four statement cards. Sort them into the two buckets.","arts":[{"label":"Reminder from the ATT&CK page","body":"Downgrading replaces the OS with an <b class=\"k\">older<\/b> release with weaker\nencryption and fewer defensive features. It applies at the <b class=\"k\">next restart<\/b>."}]},"question":"Drag each card to the right bucket.","hint":"Only two cards describe what a downgrade really does. Check the platform and the direction (older, not newer) for the other two.","correct":"A downgrade brings back weaker encryption, and it needs a reload to take effect. It does not install a newer patch, and it does not apply to Windows laptops.","expl":"The ATT&CK page says older releases have <b>weaker encryption ciphers and fewer defensive features<\/b>, and that the change happens when the device restarts. Installing a newer patch is the opposite behaviour (the sibling technique Patch System Image, T1601.001), and Windows laptops are not network devices — the platform for T1601.002 is Network Devices. What to study: what \"older image\" means and where T1601.002 applies.","items":[{"label":"Brings back weaker encryption ciphers","note":"True — older images support weaker ciphers, which is exactly why adversaries downgrade (it can enable Weaken Encryption, T1600).","kind":"d"},{"label":"Takes effect at the next reload","note":"True — the device must boot from the replaced image for the downgrade to apply.","kind":"d"},{"label":"Installs a newer, stronger patch","note":"False — that is patching (T1601.001), the opposite direction of a downgrade.","kind":"d"},{"label":"Only works on Windows laptops","note":"False — the platform is Network Devices (routers, switches, firewalls), not Windows endpoints.","kind":"d"}],"data":{"items":["Brings back weaker encryption ciphers","Takes effect at the next reload","Installs a newer, stronger patch","Only works on Windows laptops"],"zones":[{"name":"What a downgrade does","icon":"✓"},{"name":"What it does NOT do","icon":"✗"}],"correct":[0,0,1,1]}},{"id":"e05","type":"fill","summary":"Complete the downgrade sentence","scen":{"lead":"Fill the incident-note sentence your mentor wrote. Use the shuffled word bank below the sentence.","arts":[{"label":"Word bank (shuffled in the answer area)","body":"boot · reload · image"}]},"question":"Type one word in each blank to complete the note.","hint":"The sentence walks the attack in order: the file, the pointer, the restart.","correct":"\"On an embedded device, the adversary downloads the older <b>image<\/b> file, replaces it in storage, and points the <b>boot<\/b> variable at it. The change applies at the next <b>reload<\/b>.\"","expl":"This is the downgrade mechanic in one sentence, straight from the ATT&CK page: on embedded devices, downgrading typically means downloading the desired older <b>image<\/b>, replacing the OS file in storage, and reconfiguring the device to <b>boot<\/b> from that file at the next restart. The adversary can reload immediately or wait for the next natural restart. What to study: the three-step downgrade flow.","items":[{"label":"Blank 1 — the OS file","note":"The older operating system file is called the image."},{"label":"Blank 2 — the pointer","note":"The boot variable selects which image loads at start-up."},{"label":"Blank 3 — the restart","note":"A reload (reboot) makes the device actually run the replaced image."}],"data":{"text":"On an embedded device, the adversary downloads the older ⟦0⟧ file, replaces it in storage, and points the ⟦1⟧ variable at it. The change applies at the next ⟦2⟧.","blanks":[["image","os image","firmware"],["boot","boot system"],["reload","reboot","restart"]],"bank":["boot","reload","image"]}},{"id":"e06","type":"order","summary":"Put the downgrade steps in order","scen":{"lead":"A training card lists the four steps of a basic image downgrade. They are shuffled below.","arts":[{"label":"Card context","body":"The attacker already has admin access to the device.\nGoal: make the device run an older, weaker image."}]},"question":"Click the four steps in the order an attacker performs them.","hint":"First the file must exist somewhere, then it must be on the device, then pointed to, then loaded.","correct":"1) Fetch the older image from the TFTP server, 2) copy it into device flash storage, 3) change the boot variable to point at it, 4) reload the device.","expl":"The chain on the page's detection guidance is: transfer of an older image first, then alteration of the boot configuration, then a reboot/reload of the device. Each step depends on the previous one — there is nothing to point the boot variable at before the file is on the device, and the variable only takes effect when the device restarts. What to study: the suspicious chain — transfer, boot-config change, reload.","items":[{"label":"Step 1 — fetch the older image","note":"The attacker pulls the old image file from their TFTP server; this transfer is the first telemetry."},{"label":"Step 2 — copy into flash","note":"The file is copied into the device's flash storage so it can be booted."},{"label":"Step 3 — change the boot variable","note":"The boot system variable now points at the older image; this config change is the second telemetry."},{"label":"Step 4 — reload","note":"The reload boots the device into the weaker image; the version string changes."}],"data":{"entries":["Fetch the older image from the TFTP server","Copy the image into the device's flash storage","Point the boot variable at the older image","Reload the device"],"mode":"timeline"}},{"id":"e07","type":"mc","summary":"Attacker view — why downgrade at all?","scen":{"lead":"Attacker perspective exercise. Imagine you are the adversary who already holds admin credentials on a branch router. You can install any image you want.","arts":[{"label":"Your situation","body":"Devices available: one branch router (older model).\nYour goal: run exploits that modern images defend against.\nYour constraint: you want the device itself to help you, not fight you."}]},"question":"From the attacker's perspective, what is the main reason to install an <b>older<\/b> system image?","hint":"Read the ATT&CK description again: older versions have weaker ciphers and fewer updated defensive features.","correct":"Older images have <b>weaker encryption ciphers and fewer updated defensive features<\/b>, so the device stops fighting the attacker.","expl":"From the attacker side, the downgrade removes the device's own protections: older releases support weaker ciphers (which can enable the separate technique Weaken Encryption, T1600) and lack modern hardening. From the defender side, this is why image version and checksum monitoring matter — a version string that goes <i>backwards<\/i> is a strong alarm. What to study: why \"weaker\" helps the adversary, and which telemetry catches it (transfer logs, version strings, checksums).","items":[{"label":"The attacker's motive","note":"The ATT&CK page is explicit: older versions have weaker encryption ciphers and fewer/less updated defensive features."}],"data":{"options":["It gives weaker encryption and fewer defensive features","It makes the device boot faster","It removes the need for admin credentials","It hides the device from the network map"],"correct":0}},{"id":"e08","type":"term","summary":"Terminal: show which OS the device runs","scen":{"lead":"Guided terminal exercise. You are on the console of a branch switch and want to see which operating system it is currently running.","arts":[{"label":"Environment","body":"Device console, privilege level 15. Nothing has changed yet.\nYour goal: display the running OS version."}]},"question":"Type the command that displays the device's current OS version.","hint":"The command starts with the word you use to display things on IOS, followed by what you want to see.","correct":"<b>show version<\/b> — prints the running image name and version string.","expl":"<b>show version<\/b> is the basic, read-only command that prints the running OS and image file. Defenders use its output to spot a version string that went backwards after a reboot — one of the four signals in the page's detection guidance. Attackers run it too, to confirm their downgrade worked. Nothing is changed by this command, so it is always safe. What to study: basic IOS show commands and what each reveals.","items":[{"label":"Uses the display keyword","note":"The command begins with \"show\", the IOS keyword for displaying state.","kind":"need"},{"label":"Asks for the version","note":"The second word is \"version\", which prints the running image and version string.","kind":"need"},{"label":"No state-changing command used","note":"You did not type anything that alters the device — correct, this task only reads.","kind":"forbid"}],"data":{"mode":"free","banner":"br-sw-01 con0: privilege 15 — training simulator — nothing you type changes any real device","prompt":"br-sw-01#","runOut":"Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(58)SE2\nSystem image file is \"flash:c2960-lanbasek9-mz.122-58.SE2.bin\"","syntax":"<b>Command shape:<\/b> <span class=\"mono\">show &lt;what&gt;<\/span> — \"show\" displays state, it never changes it.<br><b>Example on another device:<\/b> <span class=\"mono\">show running-config<\/span> shows the configuration.<br><b>Expected output shape:<\/b> lines starting with \"Cisco IOS Software\" and a line \"System image file is ...\".","elements":[{"kind":"need","re":"\\bshow\\b","label":"Uses the display keyword"},{"kind":"need","re":"\\bversion\\b","label":"Asks for the version"},{"kind":"forbid","re":"\\b(reload|erase|copy|write|conf\\w*)\\b","label":"No state-changing command used"}],"canonical":"show version"}},{"id":"e09","type":"match","summary":"Three mitigations in plain words","scen":{"lead":"Your GRC teammate asks what the ATT&CK mitigations for image downgrades actually mean. Match the three mitigation IDs to their plain meanings.","arts":[{"label":"From the ATT&CK page","body":"M1046 Boot Integrity — cryptographic signing of OS images at boot time\nM1032 Multi-factor Authentication — MFA for user and privileged accounts\nM1026 Privileged Account Management — restrict administrator accounts"}]},"question":"Match each mitigation ID to what it means for a normal worker.","hint":"One is about proving who you are, one is about having few admins, one is about the device checking its own software at start-up.","correct":"M1046 = the device verifies its image at start-up; M1032 = admins prove their identity in two ways; M1026 = only a small, managed set of admin accounts exists.","expl":"The page gives six mitigations; these three are the core ones. <b>M1046 Boot Integrity<\/b> makes a tampered or older unsigned image fail to load. <b>M1032 MFA<\/b> means a stolen password alone is not enough to reach device admin. <b>M1026 Privileged Account Management<\/b> keeps the number of people who can change boot variables tiny and managed. What to study: mitigation IDs and their one-line purpose.","items":[{"label":"M1046 Boot Integrity","note":"The device checks that its boot image is trusted (signed) every time it starts."},{"label":"M1032 Multi-factor Authentication","note":"Admins must prove who they are with a second factor, per vendor best practice (TACACS+/RADIUS environments)."},{"label":"M1026 Privileged Account Management","note":"Administrator accounts are restricted to as few people as possible, with least privilege."}],"data":{"lefts":["M1046 Boot Integrity","M1032 Multi-factor Authentication","M1026 Privileged Account Management"],"rights":["The device verifies its boot image is trusted every start","Admins prove identity with a second check, not just a password","Only a few well-managed admin accounts exist","Every user gets a personal admin account by default"],"correct":[0,1,2]}},{"id":"e10","type":"mc","summary":"Log viewer — which line proves a reload?","scen":{"lead":"You open the log viewer on the monitoring station for branch switch br-sw-01. Use the filter box to search the lines if you need to.","arts":[{"label":"br-sw-01 console + TACACS log","body":"<span class=\"ln\"><b class=\"t\">23:58:02<\/b> %SYS-5-CONFIG_I: Configured from console by admin on vty0<\/span>\n<span class=\"ln\"><b class=\"t\">23:59:47<\/b> TACACS+: cmd=boot system flash:c2960-<b class=\"s\">old-lan image<\/b>.bin user=svc-maint<\/span>\n<span class=\"ln\"><b class=\"t\">00:01:11<\/b> %SYS-5-RELOAD: Reload requested by console<\/span>\n<span class=\"ln\"><b class=\"t\">00:02:35<\/b> %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up<\/span>","filter":true}]},"question":"Which log line proves the device actually <b>restarted<\/b> (reloaded)?","hint":"IOS prints a specific message when someone asks the device to restart. Use the filter to find the word.","correct":"The line <b>%SYS-5-RELOAD: Reload requested<\/b> — that is the device announcing its restart.","expl":"Only the %SYS-5-RELOAD message proves a restart happened. The config line and the TACACS command show <i>intent<\/i> to change what boots, and the link-up line is just an interface coming back after the reload — a normal effect, not the cause. After a reload the device boots whatever the boot variable points at, which is why defenders pair reload messages with a version check. What to study: common IOS syslog messages (%SYS-5-RELOAD vs %SYS-5-CONFIG_I).","items":[{"label":"The reload proof line","note":"%SYS-5-RELOAD is the message IOS emits when the device restarts; the other lines show config changes or normal link state."}],"data":{"options":["23:58:02 %SYS-5-CONFIG_I: Configured from console","23:59:47 TACACS+: cmd=boot system flash:...","00:01:11 %SYS-5-RELOAD: Reload requested by console","00:02:35 %LINK-3-UPDOWN: Interface ... state to up"],"correct":2}},{"id":"e11","type":"dnd","summary":"Where would you see it?","scen":{"lead":"New analysts often mix up <i>logs<\/i> (events a device or server records as they happen) and <i>configuration<\/i> (the stored settings a device keeps). Sort the four cards.","arts":[{"label":"Rule of thumb","body":"Logs = things that <b class=\"k\">happened<\/b>. Configuration = settings that <b class=\"k\">are set<\/b>."}]},"question":"Drag each card to where an analyst would look for it.","hint":"Ask yourself: does the card describe an event, or a stored setting?","correct":"TFTP transfer entry and reload message are events in logs; the boot system line and the NTP server line are stored configuration.","expl":"The TFTP transfer entry and the reload message are <b>events<\/b> — they live in transfer and syslog telemetry. The <b>boot system<\/b> line is a stored setting inside the device configuration, and the NTP server line is ordinary stored configuration too. The detection guidance on the ATT&CK page uses both views: transfers and reloads from logs, boot-variable changes from configuration. What to study: logs vs configuration as data sources.","items":[{"label":"TFTP transfer of oldimage.bin at 03:12","note":"An event recorded by the TFTP server — log telemetry.","kind":"d"},{"label":"boot system flash:oldimage.bin line","note":"A stored setting in the device configuration.","kind":"d"},{"label":"%SYS-5-RELOAD message","note":"An event the device itself logs when it restarts.","kind":"d"},{"label":"ntp server 10[.]22[.]7[.]9 line","note":"A stored, ordinary configuration line — not evidence of a downgrade by itself.","kind":"d"}],"data":{"items":["TFTP transfer of oldimage.bin at 03:12","boot system flash:oldimage.bin line","%SYS-5-RELOAD message","ntp server 10[.]22[.]7[.]9 line"],"zones":[{"name":"Events — found in logs","icon":"≡"},{"name":"Stored settings — found in configuration","icon":"⚙"}],"correct":[0,1,0,1]}},{"id":"e12","type":"fill","summary":"Why old is weak — two blanks","scen":{"lead":"Complete the sentence your team lead put on the whiteboard. Two blanks, one word each.","arts":[{"label":"Whiteboard","body":"Older system images often have weaker ______ and fewer\nupdated ______ features. ← fill me"}]},"question":"Type the two missing words.","hint":"Think about what protects traffic (ciphers) and what protects the device (defences).","correct":"Older images often have weaker <b>encryption<\/b> and fewer updated <b>defensive<\/b> features.","expl":"The ATT&CK description names the two weaknesses: older operating system versions have <b>weaker encryption ciphers<\/b> and, in general, fewer/less updated <b>defensive features<\/b>. Weaker encryption can let an adversary read or alter protected traffic (that is the linked behaviour Weaken Encryption, T1600), and missing defences mean fewer alarms. What to study: the full first sentence of the T1601.002 description.","items":[{"label":"Blank 1 — protection of traffic","note":"Weaker encryption ciphers make protected traffic easier to attack."},{"label":"Blank 2 — protection of the device","note":"Fewer updated defensive features mean the old OS fights back less."}],"data":{"text":"Older system images often have weaker ⟦0⟧ and fewer updated ⟦1⟧ features.","blanks":[["encryption","crypto","ciphers"],["defensive","defense","security"]],"bank":["defensive","encryption"]}},{"id":"e13","type":"selects","summary":"Spot the mistake in the sentence","scen":{"lead":"A trainee wrote this sentence in the shift handover. One dropdown choice is wrong — pick the choice that makes the sentence <b>correct<\/b>.","arts":[{"label":"Trainee sentence","body":"\"I replaced the image file on the device, so the downgrade is\nnow active ⼼0⼻.\" ← choose the ending that is TRUE"}]},"question":"Choose the ending that makes the trainee's sentence correct.","hint":"Copying a file does not run it. What must happen before the device actually boots from the new file?","correct":"The correct ending is \"only after the next reload\" — the replaced image loads at restart.","expl":"On embedded devices the downgrade takes effect when the device <b>boots from the replaced image<\/b>. Copying the file changes nothing until a reload happens (now, or at the next natural restart). This detail matters to defenders too: a device can carry a tampered image for days before it activates, so config changes must be checked even without a reload yet. What to study: when a boot-variable change actually takes effect.","items":[{"label":"The correct ending","note":"The change applies at the next reload — immediately after copying is wrong, and the device never boots an image that is only on the TFTP server."}],"data":{"text":"\"I replaced the image file on the device, so the downgrade is now active {{0}}.\"","slots":[{"opts":["only after the next reload","immediately after copying the file","as soon as the file exists on the TFTP server"],"correct":0}]}},{"id":"e14","type":"flow","summary":"Alert triage — normal or investigate?","scen":{"lead":"Mini SOC queue. You are on triage duty for the network team. Three alerts arrived. For each one, choose the right first call. This is a guided exercise: one idea per alert.","arts":[]},"question":"Decide for each of the three alerts: is it normal, or should it be investigated?","hint":"Normal things have a reason you can point at (a ticket, a schedule). Without that reason, investigate.","correct":"Alert 1 = normal (scheduled backup), Alert 2 = investigate (image transfer with no ticket), Alert 3 = normal (change-approved reboot).","expl":"This is exactly what a SOC analyst does on a network-device queue: match each event to a <b>reason<\/b>. A nightly backup at its usual time, and a reboot with an approved change, are normal. An <b>image transfer with no change ticket<\/b> has no reason to exist — and an image transfer is the first step of a downgrade, so it goes to investigation. Real work note: attackers and defenders both see image transfers; the ticket decides the first call. What to study: alert triage against change records.","items":[{"label":"Alert 1 — nightly config backup, 01:00","note":"Normal: it runs at the documented time from the management server."},{"label":"Alert 2 — TFTP image transfer to br-sw-03, 03:12, no ticket","note":"Investigate: an image transfer with no change record is the first step of a downgrade."},{"label":"Alert 3 — planned reboot of edge-rtr-01, approved change CHG-2201","note":"Normal: approved maintenance activity with a ticket."}],"data":{"steps":[{"scen":"<b>Alert 1 of 3<\/b> — 01:00 nightly config backup from the management server to br-sw-01, as every night.","question":"Normal, or investigate?","opts":["Normal — scheduled, matches the runbook","Investigate — escalate to the network security team"],"correct":0},{"scen":"<b>Alert 2 of 3<\/b> — 03:12 TFTP transfer of file <span class=\"mono\">c2960-old-lan-image.bin<\/span> to br-sw-03. No change ticket exists for tonight.","question":"Normal, or investigate?","opts":["Normal — transfers happen all the time","Investigate — image transfer with no change record"],"correct":1},{"scen":"<b>Alert 3 of 3<\/b> — 04:30 planned reboot of edge-rtr-01, approved change CHG-2201, requested by the network team.","question":"Normal, or investigate?","opts":["Normal — approved maintenance reboot","Investigate — reboots are always hostile"],"correct":0}]}},{"id":"e15","type":"term","summary":"Terminal: list the files in flash","scen":{"lead":"Guided terminal exercise. Before booting anything, you want to see which files actually sit in the switch's flash storage.","arts":[{"label":"Environment","body":"Device console, privilege 15. Training simulator.\nGoal: list the files stored in flash."}]},"question":"Type the command that lists the files in flash storage.","hint":"Use the IOS display keyword, then name the storage location."," /* generic partial-credit scoring: H = selected correct, W = selected wrong, N = total correct */
function scoreExercise(sel, corr){
  var corrSet = {}; for(var i=0;i<corr.length;i++){ corrSet[corr[i]] = true; }
  var H=0, W=0;
  for(var j=0;j<sel.length;j++){ if(corrSet[sel[j]]){ H++; } else { W++; } }
  var N = corr.length; var c = Math.max(0,(H-W)/N);
  return {H:H,W:W,N:N,credit:c};
}

function tTick(){
  var now = Date.now(); var dt = Math.floor((now - T.lastTick)/1000);
  if(dt <= 0){ return; }
  T.lastTick = now;
  if(T.state==='PAUSED_MANUAL'){ S.manualTotal += dt; return; }
  if(T.state==='PAUSED_AUTO_CHECK'){ S.reviewTotal += dt; return; }
  if(T.state!=='RUNNING'){ return; }
  if(S.phase==='review'){ /* timer keeps running in review by design */ }
  T.remain -= dt;
  var cur = curEx();
  if(cur && cur.perEx && !S.checked[cur.id] && (S.phase==='exam')){
    S.perExLeft -= dt;
    if(S.perExLeft <= 0){ S.perExLeft = 0; doCheck(true); }
  }
  if(T.remain <= 0){ T.remain = 0; setState('ENDED'); finishExam(); return; }
  renderHeader();
}

/* per-type widget builders; each returns {node, collect()} */
function buildWidget(ex){
  var D = ex.data, body;
  if(ex.type==='mc'){
    var idxs = shuffle(D.options.map(function(_,i){return i;}));
    var wrap = mk('div','opts'); var sel = -1;
    idxs.forEach(function(oi, pos){

        wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
        r.classList.add('sel'); r.setAttribute('aria-pressed','true'); });

  }

    var idxs2 = shuffle(D.options.map(function(_,i){return i;}));
    var wrap2 = mk('div','opts'); var sel2 = [];

      var r = optRow(letters(pos), D.options[oi], false);
      r.addEventListener('click', function(){

      row.addEventListener('dragend', function(){ row.classList.remove('dragging'); });

    });

    seq.addEventListener('drop', function(e){ e.preventDefault(); seq.classList.remove('over');
      var oi = parseInt(e.dataTransfer.getData('text/plain'),10);

    var undo = mk('button','ghost','\u21B6 Undo last');

      if(last){ placed.pop(); last.remove();
        if(bank.querySelector('.zhint')){ bank.querySelector('.zhint').remove(); }
        bank.appendChild(last); var lb = last; lb.className='bankrow'; lb.setAttribute('draggable','true');
        var posBadge = lb.querySelector('.pos'); if(posBadge){ posBadge.remove(); } }
    });
    body = mk('div',null); body.appendChild(hintp); body.appendChild(seq); body.appendChild(bank);
    var ub = mk('div',null); ub.style.marginTop='8px'; ub.appendChild(undo); body.appendChild(ub);
    return {node:body, collect:function(){ return {placed:placed.slice()}; }};
  }

  }
  if(ex.type==='flow'){
    var wfl = mk('div',null);
    if(!S.flowState[ex.id]){ S.flowState[ex.id] = {step:0, picks:[]}; }
    var fs = S.flowState[ex.id];

    function drawStep(){
      wfl.innerHTML='';

        });

      });

      } else if(fs.picks[fs.step]!==undefined){
        wfl.appendChild(mk('p','exnote','\u2713 Choice recorded \u2014 next step loaded. The timer keeps running between steps.'));
      }
    }

  }
  if(ex.type==='selects'){
    var ws = mk('div',null);
    var htmlS = D.text.replace(/\{\{(\d+)\}\}/g, function(m, i){
      return '<span class="slot"><select class="dd" data-s="'+i+'" aria-label="Gap '+(parseInt(i,10)+1)+'"><option value="">\u2014 choose \u2014</option></select></span>';
    });
    ws.appendChild(mk('p',null,htmlS));
    var sels = ws.querySelectorAll('select');
    D.slots.forEach(function(sl, i){

    });

      var picks = []; var ss = ws.querySelectorAll('select');
      ss.forEach(function(s2){ picks.push(s2.value===''?null:parseInt(s2.value,10)); });

function stripTags(s){ return (''+s).replace(/<[^>]+>/g,''); }

/* ---------------- exercise lifecycle ---------------- */
function renderEx(){
  var ex = curEx(); if(!ex){ toReviewOrResults(); return; }
  S.widget = null;
  S.perExLeft = ex.perEx || 0;
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = (S.returnTo==='review' ? 'Returned skipped \u00B7 ' : '') + 'Exercise '+(S.idx+1)+' of '+S.order.length;
  main.appendChild(scenBlock(ex));
  var qb = mk('section','blk question');
  qb.appendChild(mk('header',null,'<span aria-hidden="true">\u276F</span> QUESTION'));
  qb.appendChild(mk('div','body','<p>'+ex.question+'</p>'));
  main.appendChild(qb);
  var ab = ansBlock(ex.ansNote);
  var w = buildWidget(ex);
  ab.querySelector('.body').appendChild(w.node);
  main.appendChild(ab);
  S.widget = w;
  var acts = mk('div','actions');
  var bh = mk('button','ghost','\u25C6 Hint (\u221210% credit)');
  bh.id='btnHint'; bh.type='button';
  bh.disabled = !!S.hintUsed[ex.id];
  bh.setAttribute('aria-label','Show one hint; costs 10 percent of this exercise credit');
  bh.addEventListener('click', function(){ doHint(ex); });
  var bs = mk('button','ghost','\u26A0 Skip');
  bs.id='btnSkip'; bs.type='button';
  bs.setAttribute('aria-label','Skip this exercise; it goes to the skipped pool without revealing the answer');
  bs.addEventListener('click', skipEx);
  var bc = mk('button','primary','\u2713 Check answer');
  bc.id='btnCheck'; bc.type='button';
  bc.setAttribute('aria-label','Check answer; the timer pauses until you press Next');
  bc.addEventListener('click', function(){ doCheck(false); });
  var bn = mk('button','primary hidden','Next \u25B6');
  bn.id='btnNext'; bn.type='button';
  bn.setAttribute('aria-label','Next exercise; the timer resumes');
  bn.addEventListener('click', nextEx);
  acts.appendChild(bh); acts.appendChild(bs); acts.appendChild(bc); acts.appendChild(bn);
  main.appendChild(acts);
  main.appendChild(mk('div',null,'')).id='fbhost';
  var hb2 = $('#hbtnHint'); var sb2 = $('#hbtnSkip');
  if(hb2){ hb2.classList.remove('hidden'); hb2.disabled = !!S.hintUsed[ex.id]; }
  if(sb2){ sb2.classList.remove('hidden'); sb2.disabled = false; }
  renderHeader();
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
}
function doCheck(auto){
  var ex = curEx();
  if(!ex || S.checked[ex.id]){ return; }
  var res = gradeEx(ex);
  var credit = res.credit;
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit - 0.10); }
  S.credits[ex.id] = credit; S.answered[ex.id] = true; S.checked[ex.id] = true; S.gradeDetail = res;
  S.autoChecked = !!auto;
  var p = S.skippedPool.indexOf(ex.id);
  if(p !== -1){ S.skippedPool.splice(p,1); }
  renderFeedback(ex, res, credit);
  $('#btnCheck').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');
  var hs = $('#hbtnSkip'); if(hs){ hs.classList.add('hidden'); }
  var hh = $('#hbtnHint'); if(hh){ hh.disabled = true; }
  var bn = $('#btnNext');
  bn.textContent = (S.returnTo==='review') ? 'Back to review \u25B6' : ((S.idx === S.order.length-1) ? 'Continue \u25B6' : 'Next \u25B6');
  if(T.state !== 'ENDED'){ setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
}
function skipEx(){
  var ex = curEx(); if(!ex || S.checked[ex.id]){ return; }
  if(S.skippedPool.indexOf(ex.id) === -1){ S.skippedPool.push(ex.id); }
  if(S.returnTo === 'review'){ S.returnTo = null; if(T.state==='PAUSED_AUTO_CHECK'){ setState('RUNNING'); } renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
function nextEx(){
  var ex = curEx();
  if(T.state === 'PAUSED_AUTO_CHECK'){ setState('RUNNING'); }
  if(S.returnTo === 'review'){ S.returnTo = null; renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
/* ---------------- grading per type ---------------- */
function gradeEx(ex){
  var D = ex.data, c = S.widget.collect(), out = {H:0,W:0,N:0,items:[],dangerous:false};
  function mkItems(states){ for(var i=0;i<ex.items.length;i++){ out.items.push({label:ex.items[i].label, note:ex.items[i].note||'', state:states[i]||'miss'}); } }
  if(ex.type==='mc'){
    out.N = 1;
    if(c.sel === D.correct){ out.H = 1; mkItems(['ok']); } else if(c.sel === -1){ mkItems(['miss']); } else { mkItems(['bad']); }
  } else if(ex.type==='mcs'){
    var corr = D.correct; out.N = corr.length;
    var sel = c.sel || [];
    var states = [];
    for(var i=0;i<ex.items.length;i++){
      var wasSel = sel.indexOf(i) !== -1;
      var isCorr = corr.indexOf(i) !== -1;
      if(wasSel && isCorr){ out.H++; states.push('ok'); }
      else if(wasSel && !isCorr){ out.W++; states.push('bad'); }
      else if(!wasSel && isCorr){ states.push('miss'); }
      else { states.push('miss'); }
    }
    mkItems(states);
  } else if(ex.type==='order'){
    out.N = D.entries.length;
    var st2 = [];
    for(var p=0; p<out.N; p++){
      if(p < c.placed.length){
        if(c.placed[p] === p){ out.H++; st2.push('ok'); } else { out.W++; st2.push('bad'); }
      } else { st2.push('miss'); }
    }
    mkItems(st2);
  } else if(ex.type==='match'){
    out.N = D.lefts.length;
    var st3 = [];
    for(var l=0; l<out.N; l++){
      if(c.picks[l] === null){ st3.push('miss'); }
      else if(c.picks[l] === D.correct[l]){ out.H++; st3.push('ok'); }
      else { out.W++; st3.push('bad'); }
    }
    mkItems(st3);
  } else if(ex.type==='fill'){
    out.N = D.blanks.length;
    var st4 = [];
    for(var b=0; b<out.N; b++){
      var v = (c.vals[b]||'');
      if(v.trim()===''){ st4.push('miss'); }
      else {
        var nv = norm(v); var ok = false;
        for(var a=0; a<D.blanks[b].length; a++){ if(nv === norm(D.blanks[b][a])){ ok = true; break; } }
        if(ok){ out.H++; st4.push('ok'); } else { out.W++; st4.push('bad'); }
      }
    }
    mkItems(st4);
  } else if(ex.type==='dnd'){
    out.N = D.items.length;
    var zoneOf = {};
    for(var z=0; z<c.inzone.length; z++){ zoneOf[c.inzone[z].oi] = c.inzone[z].zi; }
    var st5 = [];
    for(var oi=0; oi<out.N; oi++){
      if(zoneOf[oi] === undefined){ st5.push('miss'); }
      else if(zoneOf[oi] === D.correct[oi]){ out.H++; st5.push('ok'); }
      else { out.W++; st5.push('bad'); }
    }
    mkItems(st5);
  } else if(ex.type==='term'){
    var needs = D.elements.filter(function(e){ return e.kind==='need'; });
    var forbids = D.elements.filter(function(e){ return e.kind==='forbid'; });
    out.N = needs.length;
    var txts;
    if(D.mode==='seq'){ txts = c.answers || []; }
    else { txts = [c.input || ''].concat(c.transcript || []); }
    var joined = norm(txts.join(' \u00A6 '));
    var st6 = [];
    for(var nI=0; nI<needs.length; nI++){
      var re = new RegExp(needs[nI].re, 'i');
      var anyHit = false;
      if(D.mode==='seq'){
        /* grade each seq element against its own answer line */
        if(txts[nI] !== undefined && re.test(norm(txts[nI]))){ anyHit = true; }
      } else {
        for(var tI=0; tI<txts.length; tI++){ if(re.test(norm(txts[tI]))){ anyHit = true; break; } }
      }
      if(anyHit){ out.H++; st6.push('ok'); } else { st6.push('miss'); }
    }
    var nI2 = 0, fI2 = 0;
    for(var i7=0; i7<ex.items.length; i7++){
      var itm = ex.items[i7];
      if(itm.kind === 'forbid'){
        var fEl = D.elements.filter(function(e){ return e.kind==='forbid' && e.label===itm.label; })[0];
        var bad = fEl ? new RegExp(fEl.re,'i').test(joined) : false;
        if(bad){ out.W++; }
        out.items.push({label:itm.label, note:itm.note||'', state: bad?'bad':'ok'});
      } else {
        out.items.push({label:itm.label, note:itm.note||'', state: st6[nI2]||'miss'}); nI2++;
      }
    }
    if(D.dangerRe && new RegExp(D.dangerRe.re,'i').test(joined)){ out.dangerous = true; }
  } else if(ex.type==='flow'){
    out.N = D.steps.length;
    var st7 = [];
    for(var sI=0; sI<out.N; sI++){
      var pick = c.picks[sI];
      if(pick === undefined || pick === null){ st7.push('miss'); }
      else if(pick === D.steps[sI].correct){ out.H++; st7.push('ok'); }
      else { out.W++; st7.push('bad'); }
    }
    mkItems(st7);
  } else if(ex.type==='selects'){
    out.N = D.slots.length;
    var st8 = [];
    for(var q=0; q<out.N; q++){
      var pk = c.picks[q];
      if(pk === null || pk === undefined){ st8.push('miss'); }
      else if(pk === D.slots[q].correct){ out.H++; st8.push('ok'); }
      else { out.W++; st8.push('bad'); }
    }
    mkItems(st8);
  }
  var credit = out.N > 0 ? Math.max(0,(out.H-out.W)/out.N) : 0;
  out.credit = credit;
  return out;
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex, res, credit){
  var host = $('#fbhost'); if(!host){ return; }
  host.innerHTML='';
  var cls = credit >= 0.999 ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
  var icon = credit >= 0.999 ? '\u2713' : (credit > 0 ? '\u2713' : '\u2717');
  var word = credit >= 0.999 ? 'CORRECT' : (credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT');
  var fb = mk('section','feedback '+cls);
  var sub = credit >= 0.999 ? '' : (credit > 0 ? ' \u2014 credit '+credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' items' : '');
  var fhd = mk('header',null,'');
  fhd.innerHTML = '<span aria-hidden="true">'+icon+'</span> '+word+sub+
    (S.autoChecked ? ' <span class="exTimerNote">(auto-checked: the per-exercise timer reached zero)</span>' : '');
  fb.appendChild(fhd);
  fb.setAttribute('role','status');
  fb.setAttribute('aria-label', word);
  var body = mk('div','fbody');
  body.appendChild(mk('p','credline','Scoring formula: credit = max(0, (H \u2212 W) / N) = max(0, ('+res.H+' \u2212 '+res.W+') / '+res.N+') = '+credit.toFixed(2)+
    (S.hintUsed[ex.id] ? ' \u00B7 hint used: \u22120.10 applied' : '')));
  if(res.items.length > 0){
    var it = mk('div','items');
    for(var i=0;i<res.items.length;i++){
      var it_ = res.items[i];
      var stTxt = it_.state==='ok' ? '<span class="st">\u2713 Correct</span>' : (it_.state==='bad' ? '<span class="st">\u2717 Wrong</span>' : '<span class="st">\u25CB Missed</span>');
      var row = mk('div','itemrow '+(it_.state==='ok'?'ok':(it_.state==='bad'?'bad':'miss')));
      row.innerHTML = stTxt + '<span><b>'+it_.label+'</b> \u2014 '+it_.note+'</span>';
      it.appendChild(row);
    }
    body.appendChild(it);
  }
  if(res.dangerous){
    var dw = mk('div','itemrow bad');
    dw.innerHTML = '<span class="st">\u2717 DANGEROUS \u2014 NEAR MISS</span><span>'+ex.data.dangerNote+'</span>';
    body.appendChild(dw);
  }
  body.appendChild(mk('div','canon','<span class="clabel">Correct answer</span>'+(ex.correct||'')));
  body.appendChild(mk('p',null,ex.expl));
  fb.appendChild(body);
  host.appendChild(fb);
  fb.scrollIntoView({behavior:(smoothOK()?'smooth':'auto'), block:'nearest'});
}

/* ---------------- results ---------------- */
function finishExam(){
  S.phase = 'results';
  setState('ENDED');
  var hpF = $('#btnPause'); if(hpF){ hpF.classList.add('hidden'); }
  var hbF = $('#hbtnHint'); if(hbF){ hbF.classList.add('hidden'); }
  var sbF = $('#hbtnSkip'); if(sbF){ sbF.classList.add('hidden'); }
  var main = $('#exammain'); if(main){ main.remove(); }
  var sum = 0, cnt = 0, full = 0, part = 0, partSum = 0, zero = 0, skipped = 0;
  S.order.forEach(function(ex){
    if(S.answered[ex.id]){
      cnt++; sum += S.credits[ex.id];
      var cr = S.credits[ex.id];
      if(cr >= 0.999){ full++; } else if(cr > 0){ part++; partSum += cr; } else { zero++; }
    } else if(S.skippedPool.indexOf(ex.id) !== -1 || S.checked[ex.id] !== true){ skipped++; }
  });
  var pct = cnt > 0 ? Math.round((sum/cnt)*100) : 0;
  var passed = pct >= EXAM.passMark;
  var used = EXAM.timerSeconds - T.remain;
  var wrap = mk('main','wrap results'); wrap.id='resmain';
  var v = mk('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML = (passed ? '\u2713 PASS' : '\u2717 FAIL') + ' \u2014 final score '+sum.toFixed(1)+' / '+cnt+' answered \u2014 <span class="big">'+pct+'%</span>';
  var grid = mk('div','resgrid');
  grid.innerHTML =
    '<div class="rescard ok"><div class="n">'+full+'</div><div>\u2713 Fully correct</div></div>'+
    '<div class="rescard part"><div class="n">'+part+'</div><div>\u2713 Partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="rescard bad"><div class="n">'+zero+'</div><div>\u2717 Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="n">'+skipped+'</div><div>\u26A0 Skipped \u2014 excluded</div></div>';
  var info = mk('div','card');
  info.innerHTML = '<p><b>Time used:</b> '+fmtClock(used)+' of '+fmtClock(EXAM.timerSeconds)+' budget \u00B7 <b>Paused manually:</b> '+fmtClock(S.manualTotal)+
    ' \u00B7 <b>Paused for feedback review:</b> '+fmtClock(S.reviewTotal)+'</p>'+
    '<p>Percentage computed over answered exercises only. Pass mark: '+EXAM.passMark+'%. '+(passed ?
    'Well done \u2014 you demonstrated a working command of '+EXAM.objectID+' at this severity.' :
    'You must retake this exam to reach the pass mark. Study the explanations you saw after each Check, then press Retake Exam.')+'</p>';
  var acts = mk('div','actions');
  var rb = mk('button','primary','\u21BA Retake Exam');
  rb.type='button'; rb.setAttribute('aria-label','Retake the exam with reshuffled questions');
  rb.addEventListener('click', retake);
  acts.appendChild(rb);
  wrap.appendChild(v); wrap.appendChild(grid); wrap.appendChild(info); wrap.appendChild(acts);
  $('#app').appendChild(wrap);
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
  if(!S.reported){ S.reported = true; reportScore(sum, cnt); }
}
/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(creditSum*10)/10,
      total: answeredCount,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  } catch(e) { /* opened directly, not inside the site */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  S.user = event.data.username || '';
  S.country = event.data.country || '';
  S.locale = event.data.locale || 'en';
  /* theme field is always 'dark'; the file is dark-only by contract, nothing to toggle */
});
/* ---------------- retake ---------------- */
function retake(){
  var hpR = $('#btnPause'); if(hpR){ hpR.classList.remove('hidden'); }
  S.idx = 0; S.credits = {}; S.answered = {}; S.checked = {}; S.hintUsed = {};
  S.skippedPool = []; S.returnTo = null; S.flowState = {}; S.manualTotal = 0; S.reviewTotal = 0;
  S.reported = false; S.autoChecked = false;
  T.remain = EXAM.timerSeconds; T.state = 'IDLE';
  S.order = shuffle(EXAM.exercises);
  var rm = $('#resmain'); if(rm){ rm.remove(); }
  var em = $('#exammain');
  if(!em){ em = mk('main','wrap'); em.id='exammain'; $('#app').appendChild(em); }
  else { em.innerHTML=''; }
  startTimer();
  renderEx();
}
/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', function(){ renderIntro(); });

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
