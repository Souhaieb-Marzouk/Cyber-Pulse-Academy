window.__EXAM_META__={"topicId": "t1688", "batch": 1, "title": "T1688 — EASY practice exam", "sevWord": "EASY", "difficulty": "easy", "estimatedMinutes": 25, "timerSeconds": 1500, "passMark": 70, "intro": {"title": "T1688 Safe Mode Boot — EASY practice exam", "object": "MITRE ATT&CK object: Technique T1688 — Safe Mode Boot (Enterprise, Windows, tactic Defense Impairment TA0112)", "learnTitle": "What you will learn here", "learn": "<p>You will learn what the ATT&CK technique <b>T1688 — Safe Mode Boot<\/b> is and why attackers use it. Imagine you are a new security analyst. One morning, a computer in your company starts in a strange way: very few programs run, and the security tools are missing. This exam teaches you to recognise that situation.<\/p><p><b>What is this ATT&CK object?<\/b> MITRE ATT&CK is a big catalogue that describes what real attackers do. T1688 is a <b>technique<\/b>: one entry in that catalogue that describes one behaviour — here, restarting a Windows computer in <b>safe mode<\/b> to weaken its defences. Safe mode starts Windows with a limited set of drivers and services. Because of that, security software such as EDR (endpoint detection and response — a tool that watches the computer for attacks) may not start. There are two versions: Safe Mode and Safe Mode with Networking.<\/p><p><b>How does an attacker force it?<\/b> They change the boot configuration (the BCD store, with tools like <span class=\"mono\">bcdedit.exe<\/span>), so the next restart runs in safe mode. They can also add their own programs to the list of services that start in safe mode (the SafeBoot registry keys), or register COM objects that load there.<\/p><p><b>Where will you meet it at work?<\/b> SOC analysts see alerts for boot-configuration changes; incident responders find safe-mode reboots before ransomware damage; threat hunters look for the pattern; detection engineers build rules from the ATT&CK detection strategy DET0116; GRC analysts check that admin rights are limited; red teamers use the same move to test defences. Real ransomware groups such as AvosLocker, Black Basta, LockBit 3.0, Qilin, RansomHub and REvil have used exactly this behaviour.<\/p>", "keywords": [{"theme": "What the technique is", "items": ["T1688::Safe Mode Boot technique", "Safe mode::limited drivers and services", "Safe Mode with Networking::network stays up", "EDR::may not start in safe mode", "TA0112::Defense Impairment tactic"]}, {"theme": "How attackers use it", "items": ["BCD store::boot configuration data", "bcdedit.exe::command-line boot editor", "bootcfg.exe::legacy boot editor", "msconfig.exe::graphical boot options", "SafeBoot registry key::services allowed in safe mode", "COM objects::registered to load in safe mode"]}, {"theme": "Defence and real use", "items": ["M1026::Privileged Account Management", "M1054::Software Configuration", "DET0116::detection strategy for this technique", "T1112::Modify Registry (related)", "Ransomware::often reboots to safe mode before damage"]}], "exTypes": ["<li><b>Exercise types in this file:<\/b> choice questions, matching pairs, drag-and-drop, fill-in-the-blank, click-to-select, ordering, and one guided terminal command in a fake shell.<\/li>"]}};
window.__EXERCISES__=[{"id": "e01", "type": "choice", "title": "What safe mode is", "summary": "Concept — what Windows safe mode actually starts", "perspective": "neutral", "scenario": "<p>Your trainer asks you a warm-up question before you look at any alert. They want to know that you understand what safe mode really is before you meet T1688. Read the definition below and pick the sentence that matches it.<\/p>", "artifacts": [{"label": "Trainer note", "code": "<span class=\"cmt\"># Definition from the ATT&CK page for T1688<\/span>\nsafe mode starts Windows with a limited set of drivers and services"}], "question": "Which sentence correctly describes Windows safe mode?", "options": [{"id": "A", "text": "It starts Windows with only a limited set of drivers and services.", "plain": "limited set of drivers and services", "why": "Correct — safe mode loads the minimum Windows needs, so many extra programs never start."}, {"id": "B", "text": "It starts Windows with every driver and every service, like normal.", "plain": "full normal boot", "why": "Wrong — that is a normal boot. Safe mode deliberately loads fewer drivers and services."}, {"id": "C", "text": "It starts Windows without any user account at all.", "plain": "no user accounts", "why": "Wrong — you still log in with a user account in safe mode; it is the drivers and services that are limited."}, {"id": "D", "text": "It starts Windows only from a USB stick.", "plain": "boot from USB", "why": "Wrong — that is booting from external media. Safe mode is a mode of the Windows installed on the disk."}], "correctId": "A", "hint": "This is about how many drivers and services safe mode loads compared to a normal start.", "explain": "Safe mode starts Windows with a limited set of drivers and services. That is the whole point of the mode: fewer programs run, so problems are easier to fix. T1688 is built on exactly this fact — an attacker uses the limited start so security tools are among the programs that do not run.", "study": "Re-read the first paragraph of the technique description: 'limited set of drivers and services'."}, {"id": "e02", "type": "choice", "title": "The tactic of T1688", "summary": "ATT&CK placement — which tactic owns T1688", "perspective": "defender", "scenario": "<p>You open the ATT&CK page for T1688 during your first week. Your team lead asks: 'Before we map detections, tell me which tactic this technique belongs to.' Look at the table row copied from the page and answer.<\/p>", "artifacts": [{"label": "ATT&CK page excerpt — T1688", "code": "ID:          T1688\nSub-techniques: No sub-techniques\nTactic:       Defense Impairment\nPlatforms:    Windows"}], "question": "Which tactic does technique T1688 belong to?", "options": [{"id": "A", "text": "Defense Impairment (TA0112)", "plain": "Defense Impairment (TA0112)", "why": "Correct — the ATT&CK page lists T1688 under the Defense Impairment tactic."}, {"id": "B", "text": "Initial Access (TA0001)", "plain": "Initial Access (TA0001)", "why": "Wrong — Initial Access is how attackers get in first. T1688 happens later, when defences are already present."}, {"id": "C", "text": "Impact (TA0040)", "plain": "Impact (TA0040)", "why": "Wrong — Impact covers damage like encryption and destruction. Safe mode boot prepares the attack; the tactic here is Defense Impairment."}, {"id": "D", "text": "Command and Control (TA0011)", "plain": "Command and Control (TA0011)", "why": "Wrong — Command and Control is about attacker communication channels, not about disabling defences at boot."}], "correctId": "A", "hint": "Look at the Tactic row in the artefact — it names the answer directly.", "explain": "T1688 belongs to the Defense Impairment tactic (TA0112). A tactic is the attacker's goal. Here the goal is to impair — weaken — the defences, because security tools may not start in safe mode. Defender view: tactics help you group alerts; a boot change alert belongs to the defence-weakening goal, not to getting in or causing damage yet.", "study": "Technique = how; tactic = why. Re-read the Tactic row on the ATT&CK page for T1688."}, {"id": "e03", "type": "dnd", "title": "Two kinds of safe mode", "summary": "Variants — Safe Mode vs Safe Mode with Networking", "perspective": "neutral", "scenario": "<p>The ATT&CK description says: 'There are two versions of safe mode: Safe Mode and Safe Mode with Networking.' Your mentor gives you two cards and two description panels. Drag each card onto the panel that describes it.<\/p>", "artifacts": [{"label": "ATT&CK excerpt", "code": "There are two versions of safe mode:\n  1. Safe Mode\n  2. Safe Mode with Networking\nIt is possible to start additional services after a safe mode boot."}], "question": "Drag each safe-mode variant onto the panel that correctly describes it.", "items": [{"id": "i1", "label": "Safe Mode", "why": "Safe Mode starts with the fewest drivers and services — no network stack."}, {"id": "i2", "label": "Safe Mode with Networking", "why": "This variant adds the network drivers and services so the machine can still talk on the network."}], "buckets": [{"id": "b1", "label": "Fewest drivers, no network", "hint": "The most reduced start.", "accepts": ["i1"]}, {"id": "b2", "label": "Reduced start plus network support", "hint": "Network drivers also load.", "accepts": ["i2"]}], "hint": "The second variant keeps the network working — that is its whole difference.", "explain": "Safe Mode is the most reduced start: only a minimal set of drivers and services. Safe Mode with Networking starts the same small set plus the network drivers. Attackers often prefer the networking variant — for example REvil and Black Basta forced safe mode with networking — because their tools still need to talk to the attacker while the security tools stay off.", "study": "The two safe-mode variants in the technique description, and which one keeps network connectivity."}, {"id": "e04", "type": "match", "title": "Match the tool to its job", "summary": "Tooling — boot editors and the SafeBoot key", "perspective": "neutral", "scenario": "<p>Three names keep appearing in the T1688 material: bcdedit, msconfig and the SafeBoot registry key. Your mentor asks you to match each name to what it does. Click a card on the left, then its partner on the right.<\/p>", "artifacts": [{"label": "Names from the ATT&CK page", "code": "bcdedit.exe   bootcfg.exe   (boot configuration utilities)\nSafeBoot keys (registry values for safe-mode services)\nCOM objects   (may be registered and loaded in safe mode)"}], "question": "Match each item with the sentence that describes its job.", "lefts": [{"id": "l1", "label": "bcdedit.exe", "why": "bcdedit edits the boot configuration data from the command line — it can force the next boot into safe mode."}, {"id": "l2", "label": "msconfig.exe", "why": "msconfig is the graphical tool whose Boot tab can select a safe-mode start."}, {"id": "l3", "label": "SafeBoot registry key", "why": "The SafeBoot key lists the services that are allowed to start in safe mode — attackers add their tools there."}], "rights": [{"id": "r1", "label": "Registry list of services allowed to start in safe mode"}, {"id": "r2", "label": "Command-line editor of boot configuration data"}, {"id": "r3", "label": "Graphical Windows tool with a Boot options tab"}], "correct": {"l1": "r2", "l2": "r3", "l3": "r1"}, "hint": "One of them lives in the registry, one is a command-line tool, one opens a window with tabs.", "explain": "bcdedit.exe edits boot configuration data from the command line; msconfig.exe offers the same boot choices in a window; the SafeBoot registry key lists which services may start in safe mode. All three matter for T1688: the detection strategy DET0116 watches bcdedit and bootcfg use, plus registry persistence under the SafeBoot keys.", "study": "The tools named in the detection strategy AN0323: bcdedit.exe, bootcfg.exe, and the SafeBoot registry keys."}, {"id": "e05", "type": "fill", "title": "Which platform", "summary": "Platform — where T1688 applies", "perspective": "neutral", "scenario": "<p>A colleague from the Linux team asks whether T1688 matters for their servers. You check the platforms row on the ATT&CK page before you answer. Complete the sentence with one value from the word bank.<\/p>", "artifacts": [{"label": "ATT&CK page excerpt — T1688", "code": "ID:        T1688\nTactic:    Defense Impairment\nPlatforms: Windows"}], "question": "Complete the sentence: technique T1688 is defined for the ____ platform.", "segments": [{"t": "txt", "v": "Technique T1688 is defined for the "}, {"t": "blank", "id": "b1", "name": "platform"}, {"t": "txt", "v": " platform, so it does not apply to Linux servers."}], "bank": ["Windows", "Linux", "macOS", "Cloud"], "blanks": [{"id": "b1", "name": "platform", "correct": "Windows", "why": "The Platforms row on the ATT&CK page lists only Windows for T1688."}], "hint": "Safe mode is a way of starting one specific operating system — the one made by Microsoft.", "explain": "T1688 applies to Windows only. Safe mode is a Windows start-up mode, so the technique does not exist on Linux or macOS. That is why your Linux colleague does not need this detection today — although other platforms have their own defence-weakening techniques.", "study": "The Platforms row on the ATT&CK page: Windows."}, {"id": "e06", "type": "click", "title": "Why attackers like it", "summary": "Attacker motivation — find the key phrase in the description", "perspective": "attacker", "scenario": "<p>Your mentor shows you the first sentences of the technique description and asks you to find the one part that explains the attacker's goal. Click that part. Click again to unselect.<\/p>", "artifacts": [], "paragraphs": [{"tokens": [{"v": "Adversaries"}, {"v": "may"}, {"v": "abuse"}, {"v": "Windows"}, {"v": "safe"}, {"v": "mode"}, {"v": "to"}, {"v": "disable"}, {"v": "endpoint"}, {"v": "defenses.", "id": "t1"}, {"v": "Safe"}, {"v": "mode"}, {"v": "starts"}, {"v": "Windows"}, {"v": "with"}, {"v": "a"}, {"v": "limited"}, {"v": "set"}, {"v": "of"}, {"v": "drivers"}, {"v": "and"}, {"v": "services."}, {"v": "Third-party"}, {"v": "security"}, {"v": "software"}, {"v": "such"}, {"v": "as"}, {"v": "EDR"}, {"v": "tools"}, {"v": "may"}, {"v": "not"}, {"v": "start"}, {"v": "after"}, {"v": "booting"}, {"v": "Windows"}, {"v": "in"}, {"v": "safe"}, {"v": "mode.", "id": "t2"}]}], "clickInstruction": "Click the part of the text that explains what the attacker gains. Two decoy phrases are also clickable.", "correctTokens": ["t2"], "tokenInfo": {"t1": {"label": "“to disable endpoint defenses”", "why": "This names the goal, but the question asks for the phrase that explains *why* the trick works — the reason EDR is gone."}, "t2": {"label": "“may not start after booting Windows in safe mode”", "why": "Correct — this is the mechanism: security software does not start in safe mode, which is exactly what the attacker wants."}, "t3": {"label": "“limited set of drivers and services”", "why": "This describes what safe mode is, not directly what the attacker gains from it."}}, "correctId": null, "question": "Click the phrase that best explains what an attacker gains by rebooting into safe mode.", "hint": "Look for the phrase that talks about security software not starting.", "explain": "The phrase 'may not start after booting Windows in safe mode' is the attacker's prize: the EDR and other third-party security software simply is not running. Attacker view: the machine is still Windows, still usable — but blind to the attacker. The decoy 'to disable endpoint defenses' states the intent, while the chosen phrase states the mechanism that makes the intent work.", "study": "The first paragraph of the T1688 description — the sentence about third-party security software."}, {"id": "e07", "type": "choice", "title": "EDR after the reboot", "summary": "Consequence — what happens to EDR in safe mode", "perspective": "defender", "scenario": "<p>You are on your first SOC shift. An EDR agent silently stops reporting after a workstation restarted. Your teammate asks what T1688 says about EDR tools during safe-mode starts.<\/p>", "artifacts": [{"label": "EDR console note", "code": "08:41  WS-115  agent heartbeat lost after reboot\n08:42  last boot flag recorded: SAFE_MODE"}], "question": "What does the technique description say happens to third-party security software such as EDR after a safe-mode boot?", "options": [{"id": "A", "text": "It may not start after booting Windows in safe mode.", "plain": "it may not start", "why": "Correct — that is exactly why attackers use safe mode: the EDR may never come up."}, {"id": "B", "text": "It always starts faster than in a normal boot.", "plain": "starts faster", "why": "Wrong — nothing in the description says EDR starts faster; the opposite is the risk."}, {"id": "C", "text": "It is automatically upgraded before the desktop appears.", "plain": "auto-upgraded", "why": "Wrong — safe mode does not upgrade anything; it starts fewer things."}, {"id": "D", "text": "It moves itself into the BIOS for protection.", "plain": "moves to BIOS", "why": "Wrong — security software does not move into the BIOS. This is invented behaviour."}], "correctId": "A", "hint": "Remember the sentence in the description about third-party security software and safe mode.", "explain": "The description states that third-party security software such as EDR tools may not start after booting Windows in safe mode. Defender view: a missing EDR heartbeat right after a reboot is a signal worth checking, because an attacker may have forced the safe-mode boot on purpose.", "study": "The sentence in the T1688 description about third-party security software not starting in safe mode."}, {"id": "e08", "type": "order", "title": "Three steps of the trick", "summary": "Sequence — how a safe-mode reboot is set up", "perspective": "attacker", "scenario": "<p>An attacker already has admin rights on one workstation. They want the security tools gone at the next restart. Put the three steps of the simple T1688 trick in the order they happen.<\/p>", "artifacts": [{"label": "Facts from the description", "code": "Hosts can be forced into safe mode after the next reboot\nvia modifications to Boot Configuration Data (BCD) stores."}], "question": "Order the steps from first to last.", "items": [{"id": "s1", "label": "Change the boot configuration so the next boot runs in safe mode", "why": "First the attacker modifies the BCD store — for example with bcdedit — to request safe mode."}, {"id": "s2", "label": "The host restarts", "why": "The change only takes effect when the machine reboots."}, {"id": "s3", "label": "Windows starts with a limited set of drivers and services", "why": "After the restart, safe mode loads few drivers and services — and the EDR may be among the missing ones."}], "hint": "First the setting is changed, then the machine must restart, then the limited start happens.", "explain": "The order is: modify the boot configuration, then reboot, then Windows starts in safe mode with few drivers and services. Attacker view: the reboot is the switch that activates the change. Defender view: that is why detection correlates the bcdedit command with the restart that follows it.", "study": "The sentence 'Hosts can be forced into safe mode after the next reboot via modifications to BCD stores'."}, {"id": "e09", "type": "match", "title": "Names and numbers", "summary": "IDs — technique, tactic, related technique", "perspective": "neutral", "scenario": "<p>Reports in your company use ATT&CK IDs, not names. Match each ID to its correct meaning so you can read the reports. Click a card on the left, then its partner on the right.<\/p>", "artifacts": [{"label": "IDs seen in team reports", "code": "T1688    TA0112    T1112"}], "question": "Match each ID with its meaning.", "lefts": [{"id": "l1", "label": "T1688", "why": "T1688 is the technique Safe Mode Boot — the subject of this whole exam."}, {"id": "l2", "label": "TA0112", "why": "TA0112 is the Defense Impairment tactic, the goal the technique serves."}, {"id": "l3", "label": "T1112", "why": "T1112 is Modify Registry — the page references it because safe-mode service registration is a registry change."}], "rights": [{"id": "r1", "label": "Technique: Safe Mode Boot"}, {"id": "r2", "label": "Technique: Modify Registry (cited by the T1688 page)"}, {"id": "r3", "label": "Tactic: Defense Impairment"}], "correct": {"l1": "r1", "l2": "r3", "l3": "r2"}, "hint": "T-numbers are techniques; the TA-number is the tactic.", "explain": "T1688 is the Safe Mode Boot technique; TA0112 is the Defense Impairment tactic that owns it; T1112 is Modify Registry, which the page references because adding safe-mode services is done by editing the registry. Knowing the IDs lets you read ATT&CK-based reports quickly and map alerts to the right objects.", "study": "The IDs on the T1688 page: the technique ID, its tactic, and the referenced Modify Registry technique."}, {"id": "e10", "type": "terminal", "title": "Guided shell — view boot settings", "summary": "Guided terminal — read the boot configuration", "perspective": "defender", "scenario": "<p>You may type commands in a training shell. The tool is already named for you: <span class=\"mono\">bcdedit<\/span> is the command-line boot configuration editor. Your task here only <b>reads<\/b> the boot settings — it changes nothing. Type the command and press Enter, then press Check.<\/p>", "artifacts": [], "question": "Type the bcdedit command that shows the current boot configuration entries.", "canonical": "bcdedit /enum", "prompt": "C:\\trainee&gt;", "banner": "Training shell on a Windows host. Only reads are graded here.", "syntaxPanel": "<pre class=\"code\"><span class=\"kw\">bcdedit<\/span> <span class=\"fl\">/enum<\/span> [store]\n<span class=\"cmt\"># /enum lists entries in the boot configuration store.<\/span>\n<span class=\"cmt\"># Example on a different target (not your task):<\/span>  <span class=\"kw\">bcdedit<\/span> <span class=\"fl\">/enum<\/span> {bootmgr}<\/pre>", "expectedOutput": "Windows Boot Manager\n--------------------\nidentifier              {bootmgr}\n...\nWindows Boot Loader\n-------------------\nidentifier              {current}\ndevice                  partition=C:", "elements": [{"re": "\\bbcdedit\\b", "label": "Tool: bcdedit", "why": "bcdedit is the boot configuration editor — the correct tool here."}, {"re": "/enum", "label": "Read flag: /enum", "why": "/enum lists the entries; it is read-only, which is what you want."}], "dangerous": [{"re": "/set", "label": "state-changing /set", "why": "/set changes the boot configuration — you were asked to view it, not change it."}, {"re": "/deletevalue", "label": "state-changing /deletevalue", "why": "/deletevalue removes a boot setting — destructive for this task."}], "simOutput": ["(simulated) bcdedit /enum output shown in the Expected output shape panel above."], "correctId": null, "hint": "Start with the tool name bcdedit, then add the flag that means 'enumerate'.", "explain": "The command is <span class=\"mono\">bcdedit /enum<\/span>. bcdedit is the boot configuration editor and /enum lists the entries without changing anything. Defender view: reading boot configuration is the safe first step when you suspect a safe-mode trick — always look before you change. The example in the syntax panel used a different store ({bootmgr}) so it could not be copied as-is.", "study": "bcdedit basics: /enum to list, /set to change (state-changing), /deletevalue to remove."}, {"id": "e11", "type": "fill", "title": "Complete the two facts", "summary": "Core facts — limited start, third-party tools", "perspective": "neutral", "scenario": "<p>Your team keeps one shared sentence in its wiki that sums up T1688. Two words are missing. Fill each blank with one value from the shuffled word bank.<\/p>", "artifacts": [], "question": "Complete the wiki sentence with the two missing values.", "segments": [{"t": "txt", "v": "In safe mode, Windows starts with a "}, {"t": "blank", "id": "b1", "name": "adjective"}, {"t": "txt", "v": " set of drivers and services, so "}, {"t": "blank", "id": "b2", "name": "which tools"}, {"t": "txt", "v": " security tools may not start."}], "bank": ["limited", "Third-party", "unlimited", "Every", "fast", "Built-in"], "blanks": [{"id": "b1", "name": "adjective", "correct": "limited", "why": "Safe mode is defined by its limited set of drivers and services."}, {"id": "b2", "name": "which tools", "correct": "Third-party", "why": "The description names third-party security software — tools installed by another company, such as EDR."}], "hint": "First blank: the opposite of 'full'. Second blank: tools made by a company other than Microsoft.", "explain": "The wiki sentence reads: 'In safe mode, Windows starts with a limited set of drivers and services, so third-party security tools may not start.' Those two facts together are the whole foundation of T1688: limited start, and the security tools that vanish because of it.", "study": "The first two sentences of the T1688 description."}, {"id": "e12", "type": "click", "title": "Spot the mistake", "summary": "Spot the mistake — wrong safeboot variant in a script", "perspective": "neutral", "scenario": "<p>A trainee wrote a three-line note about forcing <b>Safe Mode with Networking<\/b>. One command line does not match the stated goal. Click the line that is wrong.<\/p>", "artifacts": [], "paragraphs": [{"tokens": [{"v": "REM", "id": "m1"}, {"v": "Goal:"}, {"v": "boot"}, {"v": "into"}, {"v": "Safe"}, {"v": "Mode"}, {"v": "with", "id": "m2"}, {"v": "Networking"}, {"v": "|"}, {"v": "bcdedit", "id": "m3"}, {"v": "/set", "id": "m4"}, {"v": "{current}", "id": "m5"}, {"v": "safeboot", "id": "m6"}, {"v": "minimal", "id": "m7"}]}, {"tokens": [{"v": "REM"}, {"v": "Then"}, {"v": "restart"}, {"v": "the", "id": "m8"}, {"v": "host", "id": "m9"}]}], "clickInstruction": "Click the single token that makes the command fail the stated goal. Click again to unselect.", "correctTokens": ["m7"], "tokenInfo": {"m7": {"label": "“minimal”", "why": "Correct — minimal selects plain Safe Mode. For Safe Mode with Networking the value must be network."}, "m4": {"label": "“/set”", "why": "/set is the right operation for changing the safeboot value."}, "m6": {"label": "“safeboot”", "why": "safeboot is the correct boot setting name here."}}, "correctId": null, "question": "Click the token that stops the command from achieving 'Safe Mode with Networking'.", "hint": "Two safe-mode variants exist. Which value asks for the one without networking?", "explain": "The value 'minimal' selects plain Safe Mode; the value 'network' selects Safe Mode with Networking. Everything else in the line (bcdedit /set {current} safeboot) is correct. This small difference matters in real cases: Black Basta used 'bcdedit /set safeboot network' precisely because its tooling needed the network in safe mode.", "study": "bcdedit safeboot values: minimal vs network."}, {"id": "e13", "type": "fill", "title": "More services later", "summary": "Detail — additional services after a safe boot", "perspective": "neutral", "scenario": "<p>A teammate believes that once a machine is in safe mode, nothing more can ever be started there. The ATT&CK description says otherwise. Complete the sentence with one word from the bank.<\/p>", "artifacts": [{"label": "ATT&CK excerpt", "code": "It is possible to start additional services\nafter a safe mode boot."}], "question": "Complete the sentence: it is ____ to start additional services after a safe mode boot.", "segments": [{"t": "txt", "v": "It is "}, {"t": "blank", "id": "b1", "name": "possibility"}, {"t": "txt", "v": " to start additional services after a safe mode boot."}], "bank": ["possible", "impossible", "forbidden"], "blanks": [{"id": "b1", "name": "possibility", "correct": "possible", "why": "The description states it is possible to start additional services after a safe mode boot."}], "hint": "The artefact quotes the description word for word.", "explain": "The description says it is possible to start additional services after a safe mode boot. This detail matters twice: defenders must not assume safe mode means total silence, and attackers can bring selected tools up inside safe mode when they need them.", "study": "The sentence about starting additional services after a safe mode boot."}, {"id": "e14", "type": "match", "title": "Who works with T1688", "summary": "Roles at work — who touches this technique", "perspective": "defender", "scenario": "<p>T1688 is not only an SOC topic. Match each role to the task it normally does with this technique. Click a card on the left, then its partner on the right.<\/p>", "artifacts": [], "question": "Match each role to its typical task around safe mode boot abuse.", "lefts": [{"id": "l1", "label": "SOC analyst", "why": "The SOC analyst triages alerts — for example an alert that bcdedit changed the boot configuration."}, {"id": "l2", "label": "Detection engineer", "why": "The detection engineer writes the rule, following the ATT&CK detection strategy DET0116."}, {"id": "l3", "label": "GRC analyst", "why": "The GRC analyst checks the policy side — that admin rights are restricted, which is mitigation M1026."}], "rights": [{"id": "r1", "label": "Checks that admin rights are restricted by policy (M1026)"}, {"id": "r2", "label": "Triages an alert about a boot-configuration change"}, {"id": "r3", "label": "Builds a detection rule from detection strategy DET0116"}], "correct": {"l1": "r2", "l2": "r3", "l3": "r1"}, "hint": "Think daily work: who looks at alerts, who writes rules, who writes policy.", "explain": "The SOC analyst triages live alerts, the detection engineers turn ATT&CK's detection strategy DET0116 into a working rule, and the GRC analyst owns the policy that limits administrator accounts (M1026, Privileged Account Management). T1688 therefore appears in alert queues, detection backlog tickets and policy reviews — not just in /* ---------- timer state machine ---------- */
var T = {
  tick:null,

  stopTick:function(){ if(this.tick){ clearInterval(this.tick); this.tick=null; } },
  onTick:function(){
    if(S.timer.state!=='RUNNING') return;

    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; this.stopTick(); onTimeout(); }
    renderHeader();
  },
  setState:function(st){
    var prev=S.timer.state;
    if(prev===st) return;
    /* close any open pause interval logs */
    var now=Date.now();
    if(prev==='PAUSED_MANUAL'){ S.pauseLog.manualMs+=now-S.pauseLog.pauseStart; }
    if(prev==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoMs+=now-S.pauseLog.autoStart; }
    if(st==='PAUSED_MANUAL'){ S.pauseLog.pauseStart=now; }
    if(st==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoStart=now; }
    S.timer.state=st;
    if(st==='RUNNING'){ T.start(); } else { T.stopTick(); }
    if(st==='ENDED'){ T.stopTick(); }

/* ---------- score report ---------- */
function reportScore(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  S.reported=true;
  try{
    /* opened directly: there is no integrator to report to (self-post would be a no-op
       and would log an origin warning in some engines), so stay silent. */
    if(window.parent && window.parent!==window){
      /* Strict targeting on the real site (https: parent origin === location.origin).
         On opaque/file origins (sandbox, offline preview) strict targeting cannot match,
         so fall back to '*' — there is no cross-origin boundary to protect there. */
      var org=String(location.origin||'');
      var safe=(org && org!=='null' && org.indexOf('file://')!==0)?org:'*';
      parent.postMessage({
        type:'CYBERPULSE_SCORE', topicId:M.topicId, batch:M.batch,
        score:Math.round(creditSum), total:count, percent:percent, passed:percent>=M.passMark
      }, safe);
    }
  }catch(e){ /* opened directly; nothing to report to */ }
}

function nextAfterLast(){
  /* safety net: anything never visited and unanswered joins the review pool */
  S.order.forEach(function(id){
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ S.skipped.push(id); }
  });
  if(S.skipped.length>0){ S.screen='review'; render(); }
  else finishExam();
}
function finishExam(){
  S.timer.state='ENDED'; T.stopTick();
  S.screen='results'; render();
}

/* ---------- exercise renderers ---------- */
function renderExercise(e){
  var body=document.getElementById('exbody');
  body.innerHTML='';
  var card=el('div','card');
  card.setAttribute('data-ex',e.id);
  var already = S.feedbackShown[e.id];
  var sumline=e.summary||e.title;
  var scen='<div class="collhead"><div><h2 style="font-size:16px;letter-spacing:.4px">SCENARIO</h2>'+
    '<div class="sumline">'+esc(sumline)+(already?' &mdash; collapsed':'')+'</div></div>'+
    '<button class="ct" id="colltoggle" aria-expanded="true">Collapse</button></div>'+
    '<div class="collbody" id="collbody">'+e.scenario;
  (e.artifacts||[]).forEach(function(a,i){
    scen+='<div class="artefact"><div class="alabel"><span>ARTEFACT '+(i+1)+' &mdash; '+esc(a.label)+'</span></div><pre class="code">'+a.code+'</pre></div>';
  });
  scen+='</div>';
  card.innerHTML=scen;

  var ab=el('div','block block-question');
  ab.innerHTML='<div class="bh">&#10067; QUESTION</div><div class="qtext">'+e.question+'</div>';
  if(e.hint){
    ab.appendChild(el('div','hintpanel hidden','<div class="hh">&#128161; Hint (one only &mdash; 10% of this exercise credit)</div><div>'+e.hint+'</div>'));
    ab.lastChild.id='hintpanel'; ab.lastChild.setAttribute('aria-hidden','true');
  }
  card.appendChild(ab);

  var answ=el('div','block block-answer');
  answ.innerHTML='<div class="bh">&#9999; YOUR ANSWER</div>';
  var widget=el('div'); widget.id='widget'; answ.appendChild(widget);
  card.appendChild(answ);
  body.appendChild(card);

  /* collapsible behaviour */
  var ctog=card.querySelector('#colltoggle'), cbody=card.querySelector('#collbody');
  ctog.onclick=function(){
    var hid=cbody.classList.toggle('hidden');
    ctog.textContent=hid?'Expand':'Collapse';
    ctog.setAttribute('aria-expanded',hid?'false':'true');
  };

  RENDER[e.type](e,widget);

  /* nav row */
  var nav=el('div','btnrow');
  if(already){
    nav.innerHTML='<button class="btn primary" id="btn-next">'+(S.idx===S.order.length-1?'Final Submit &#10140;':'Next &#10140;')+'</button>';
  }else{
    nav.innerHTML='<button class="btn primary" id="btn-check">&#10003; Check</button>';
  }
  body.appendChild(nav);
  if(already){ bindNext(); } else { document.getElementById('btn-check').onclick=function(){ onCheck(e); }; }
}
function bindNext(){
  var b=document.getElementById('btn-next'); if(!b) return;
  b.onclick=function(){
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    if(S.mode==='review'){
      /* returning from a review answer: back to the review list */
      var cur=curEx();
      if(cur){ var pp=S.skipped.indexOf(cur.id); if(pp>=0){ S.skipped.splice(pp,1); } }
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
      return;
    }
    var last=(S.idx===S.order.length-1);
    if(last){
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
    } else {
      advance(true);
    }
  };
}

function onCheck(e){
  var res=GRADER[e.type](e);
  if(res===null){ /* nothing answered yet: nudge */
    var w=document.getElementById('widget');
    var nudge=w.querySelector('.nudge');
    if(!nudge){ nudge=el('div','small','<span style="color:var(--state-partial)">&#9888;</span> Choose an answer first, then press Check.'); w.insertBefore(nudge,w.firstChild); }
    return;
  }
  var credit=res.credit;
  if(S.hintUsed[e.id]) credit=Math.max(0,credit-0.10);
  credit=Math.round(credit*10000)/10000;
  S.credits[e.id]=credit; S.answered[e.id]=true; S.feedbackShown[e.id]=true;
  S.lastRes[e.id]=res;
  /* CHECK-TRIGGERED AUTO-PAUSE: first action, before rendering feedback */
  if(S.timer.state==='RUNNING'){ T.setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
  renderExercise(e);
  renderFeedback(e,credit,res);
  var zone=document.getElementById('exzone'); if(zone) scrollNow(zone);
}

function renderFeedback(e,credit,res){
  var old=document.getElementById('fbzone'); if(old) old.remove();
  var zone=document.getElementById('exbody');
  var cls,lab,icon;
  if(credit>=0.999){ cls='fb-correct'; lab='CORRECT'; icon='&#10003;'; }
  else if(credit>0){ cls='fb-partial'; lab='PARTIALLY CORRECT'; icon='&#10003;'; }
  else { cls='fb-incorrect'; lab='INCORRECT'; icon='&#10007;'; }
  var fb=el('div','fb '+cls); fb.id='fbzone';
  var head='<div class="fbh"><span>'+icon+'</span> '+lab;
  if(res.n>1) head+=' <span class="credit">credit '+credit.toFixed(2)+' &mdash; '+res.h+' / '+res.n+' items</span>';
  if(res.dangerous) head+=' <span class="pill" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10007; DANGEROUS &mdash; NEAR MISS</span>';
  head+='</div>';
  var rows='';
  (res.rows||[]).forEach(function(r){
    var ic,cl;
    if(r.state==='ok'){ ic='&#10003; Correct'; cl='ic-ok'; }
    else if(r.state==='bad'){ ic='&#10007; Wrong'; cl='ic-bad'; }
    else if(r.state==='miss'){ ic='&#9675; Missed'; cl='ic-miss'; }
    else { ic='&#9679; Info'; cl='ic-part'; }
    rows+='<div class="itemrow"><span class="ic '+cl+'">'+ic+'</span><span><b>'+r.label+'</b>'+(r.why?' &mdash; '+r.why:'')+'</span></div>';
  });
  var study='';
  if(credit<0.999 && e.study) study='<div class="study"><b>What to study:</b> '+e.study+'</div>';
  var canon='';
  if(e.type==='terminal' && e.canonical){
    canon='<div class="artefact"><div class="alabel"><span>CANONICAL COMMAND &mdash; copyable</span>'+
      '<button type="button" class="ct" id="copycanon" aria-label="Copy canonical command">Copy</button></div>'+
      '<pre class="code" id="cmdcanon">'+esc(e.canonical)+'</pre></div>';
  }
  fb.innerHTML=head+canon+rows+'<div class="explain">'+e.explain+'</div>'+study;
  var copyBtn=fb.querySelector('#copycanon');
  if(copyBtn){ copyBtn.onclick=function(){
    var txt=e.canonical;
    try{ navigator.clipboard.writeText(txt); copyBtn.textContent='Copied'; }catch(err){ copyBtn.textContent='Select & copy'; }
    setTimeout(function(){ copyBtn.textContent='Copy'; },1500);
  }; }
  var navzone=zone.querySelector('.btnrow');
  zone.insertBefore(fb,navzone);
}

/* ----- render + grade per type ----- */
var RENDER={}; var GRADER={};

/* choice */
RENDER.choice=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected'); b.setAttribute('aria-pressed','true');
      S.answers[e.id]=oid;
      var n=w.querySelector('.nudge'); if(n) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.choice=function(e){
  var pick=S.answers[e.id];
  if(!pick) return null;
  var ok=(pick===e.correctId);
  var rows=e.options.map(function(o){
    if(o.id===e.correctId) return {label:o.plain,state:ok&&pick===o.id?'ok':'miss',why:o.why};
    if(o.id===pick) return {label:o.plain,state:'bad',why:o.why};
    return null;
  }).filter(Boolean);
  return {credit:ok?1:0,h:ok?1:0,n:1,rows:rows};
};

/* multi */
RENDER.multi=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      var on=b.classList.toggle('selected');
      b.setAttribute('aria-pressed',on?'true':'false');
      var set=S.answers[e.id]||[]; set=on?set.concat([oid]):set.filter(function(x){return x!==oid;});
      S.answers[e.id]=set;
      var n=w.querySelector('.nudge'); if(n&&set.length) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.multi=function(e){
  var pick=S.answers[e.id]; if(!pick||!pick.length) return null;
  var h=0,wr=0,rows=[];
  e.options.forEach(function(o){
    var sel=pick.indexOf(o.id)>=0, corr=e.correctIds.indexOf(o.id)>=0;
    if(sel&&corr){ h++; rows.push({label:o.plain,state:'ok',why:o.why}); }
    else if(sel&&!corr){ wr++; rows.push({label:o.plain,state:'bad',why:o.why}); }
    else if(!sel&&corr){ rows.push({label:o.plain,state:'miss',why:o.why}); }
  });
  return {credit:scoreExercise(h,wr,e.correctIds.length),h:h,n:e.correctIds.length,rows:rows};
};

/* dnd (click-to-place + HTML5 drag) */
RENDER.dnd=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]={placed:{},sel:null};
  var bank=el('div','bank'); bank.id='bank_'+e.id;
  items.forEach(function(iid){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    var d=el('button','ditem'); d.type='button'; d.draggable=true; d.setAttribute('data-iid',iid);
    d.innerHTML='&#8942;&#8942; '+it.label;
    d.onclick=function(){ if(S.feedbackShown[e.id])return;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      d.classList.add('sel'); S.answers[e.id].sel=iid; };
    d.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',iid); d.classList.add('dragging'); };
    d.ondragend=function(){ d.classList.remove('dragging'); };
    bank.appendChild(d);
  });
  w.appendChild(el('div','small muted','Click an item, then click the right panel. You can also drag the items. Return an item with its &times; button.'));
  w.appendChild(bank);
  var bwrap=el('div','buckets');
  e.buckets.forEach(function(b){
    var bd=el('div','bucket'); bd.setAttribute('data-bid',b.id);
    bd.innerHTML='<h5>'+b.label+'</h5>'+(b.hint?'<div class="bhint">'+b.hint+'</div>':'')+'<div class="chips"></div>';
    bd.onclick=function(){
      var sel=S.answers[e.id].sel; if(!sel||S.feedbackShown[e.id]) return;
      place(e,sel,bd); S.answers[e.id].sel=null;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
    };
    bd.ondragover=function(ev){ ev.preventDefault(); bd.classList.add('over'); };
    bd.ondragleave=function(){ bd.classList.remove('over'); };
    bd.ondrop=function(ev){ ev.preventDefault(); bd.classList.remove('over');
      if(S.feedbackShown[e.id])return; place(e,ev.dataTransfer.getData('text/plain'),bd); };
    bwrap.appendChild(bd);
  });
  w.appendChild(bwrap);
  function place(e2,iid,bd){
    if(!iid) return;
    var it=e2.items.filter(function(x){return x.id===iid;})[0];
    var src=document.getElementById('bank_'+e2.id).querySelector('[data-iid="'+iid+'"]');
    if(!src) return; /* already placed: move back to bank first */
    src.remove();
    var chip=el('div','chipx'); chip.setAttribute('data-iid',iid);
    chip.innerHTML='<span>'+it.label+'</span>';
    var x=el('button','','&times;'); x.setAttribute('aria-label','Return item '+iid);
    x.onclick=function(ev){ ev.stopPropagation();
      if(S.feedbackShown[e2.id])return;
      chip.remove(); delete S.answers[e2.id].placed[iid];
      document.getElementById('bank_'+e2.id).appendChild(src);
    };
    chip.appendChild(x); bd.querySelector('.chips').appendChild(chip);
    S.answers[e2.id].placed[iid]=bd.getAttribute('data-bid');
  }
};
GRADER.dnd=function(e){
  var a=S.answers[e.id]||{placed:{}};
  var placedCount=Object.keys(a.placed).length;
  if(placedCount===0) return null;
  var h=0,wr=0,rows=[];
  e.items.forEach(function(it){
    var got=a.placed[it.id];
    var good=e.buckets.filter(function(b){return b.id===got;})[0];
    var goodBucket=good&&good.accepts.indexOf(it.id)>=0;
    if(got&&goodBucket){ h++; rows.push({label:it.label+' &rarr; '+good.label,state:'ok',why:it.why}); }
    else if(got){ wr++; var g2=e.buckets.filter(function(b){return b.id===got;})[0];
      rows.push({label:it.label+' &rarr; '+(g2?g2.label:'?'),state:'bad',why:it.why}); }
    else { rows.push({label:it.label+' (not placed)',state:'miss',why:it.why}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* match */
RENDER.match=function(e,w){
  var rights=shuffle(e.rights.map(function(x){return x.id;}));
  S.answers[e.id]={pairs:{},selLeft:null};
  w.appendChild(el('div','small muted','Click one card on the left, then its partner on the right. Click a made pair to undo it.'));
  var wrap=el('div','matchwrap');
  var lcol=el('div','mcol'), rcol=el('div','mcol');
  e.lefts.forEach(function(l){
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-lid',l.id);
    b.innerHTML='&#9635; '+l.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      lcol.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.answers[e.id].selLeft=l.id;
    };
    lcol.appendChild(b);
  });
  rights.forEach(function(rid){
    var r=e.rights.filter(function(x){return x.id===rid;})[0];
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-rid',rid);
    b.innerHTML=r.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      var lid=S.answers[e.id].selLeft; if(!lid) return;
      var lb=lcol.querySelector('[data-lid="'+lid+'"]');
      lb.classList.remove('sel'); S.answers[e.id].selLeft=null;
      /* if this right card already paired, unpair it */
      var prev=Object.keys(S.answers[e.id].pairs).filter(function(k){return S.answers[e.id].pairs[k]===rid;})[0];
      if(prev!==undefined){ delete S.answers[e.id].pairs[prev]; unpairLine(e,prev); }
      if(S.answers[e.id].pairs[lid]){ unpairLine(e,lid); }
      S.answers[e.id].pairs[lid]=rid;
      var pl=document.getElementById('pairs_'+e.id);
      var line=el('div','pairline'); line.id='pair_'+lid;
      var lt=e.lefts.filter(function(x){return x.id===lid;})[0];
      line.innerHTML='&#8594; <b>'+lt.label+'</b> matched with <b>'+r.label+'</b> <button type="button" style="background:none;border:none;color:var(--text-secondary);cursor:pointer" aria-label="Undo pair">&times;</button>';
      line.querySelector('button').onclick=function(){ if(S.feedbackShown[e.id])return; unpair(e,lid); };
      pl.appendChild(line);
      var n=w.querySelector('.nudge'); if(n&&Object.keys(S.answers[e.id].pairs).length) n.remove();
    };
    rcol.appendChild(b);
  });
  wrap.appendChild(lcol); wrap.appendChild(rcol); w.appendChild(wrap);
  w.appendChild(el('div','','<div id="pairs_'+e.id+'" style="margin-top:10px"></div>'));
  function unpairLine(e2,lid){ var ln=document.getElementById('pair_'+lid); if(ln) ln.remove(); }
  function unpair(e2,lid){ delete S.answers[e2.id].pairs[lid]; unpairLine(e2,lid); }
};
GRADER.match=function(e){
  var a=S.answers[e.id]||{pairs:{}};
  if(Object.keys(a.pairs).length===0) return null;
  var h=0,wr=0,rows=[];
  e.lefts.forEach(function(l){
    var got=a.pairs[l.id];
    var r=got?e.rights.filter(function(x){return x.id===got;})[0]:null;
    if(got&&got===e.correct[l.id]){ h++; rows.push({label:l.label+' &rarr; '+r.label,state:'ok',why:l.why}); }
    else if(got){ wr++; rows.push({label:l.label+' &rarr; '+r.label,state:'bad',why:l.why}); }
    else { rows.push({label:l.label+' (unpaired)',state:'miss',why:l.why}); }
  });
  return {credit:scoreExercise(h,wr,e.lefts.length),h:h,n:e.lefts.length,rows:rows};
};

/* order / rank */
RENDER.order=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]=items;
  w.appendChild(el('div','small muted','Put the items in the right order. Use the arrows or drag an item onto another item.'));
  var list=el('div','orderlist'); list.id='olist_'+e.id;
  w.appendChild(list);
  function draw(){
    list.innerHTML='';
    S.answers[e.id].forEach(function(iid,i){
      var it=e.items.filter(function(x){return x.id===iid;})[0];
      var row=el('div','oitem'); row.draggable=true; row.setAttribute('data-iid',iid);
      row.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt">'+it.label+'</span>'+
        '<span class="mv"><button type="button" data-d="-1" aria-label="Move up">&#9650;</button><button type="button" data-d="1" aria-label="Move down">&#9660;</button></span>';
      row.querySelector('[data-d="-1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,-1); };
      row.querySelector('[data-d="1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,1); };
      row.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',String(i)); };
      row.ondragover=function(ev){ ev.preventDefault(); };
      row.ondrop=function(ev){ ev.preventDefault(); if(S.feedbackShown[e.id])return;
        var from=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(from))return;
        var arr=S.answers[e.id]; var m=arr.splice(from,1)[0]; arr.splice(i,0,m); draw(); };
      list.appendChild(row);
    });
  }
  function move(i,d){
    var arr=S.answers[e.id]; var j=i+d; if(j<0||j>=arr.length) return;
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t; draw();
  }
  draw();
};
GRADER.order=function(e){
  var a=S.answers[e.id]; if(!a||!a.length) return null;
  var h=0,wr=0,rows=[];
  a.forEach(function(iid,pos){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    if(e.items[pos].id===iid){ h++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'ok',why:it.why}); }
    else { wr++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'bad',why:it.why+' (correct here: '+e.items[pos].label+')'}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* fill (typed blanks; graded case-insensitive with whitespace normalised) */
RENDER.fill=function(e,w){
  S.answers[e.id]={};
  var line=el('div','fillline');
  e.segments.forEach(function(seg){
    if(seg.t==='txt'){ line.appendChild(document.createTextNode(seg.v)); }
    else {
      var s=el('input','fillblank'); s.type='text'; s.setAttribute('data-bid',seg.id);
      s.setAttribute('aria-label','Blank '+seg.id+' ('+seg.name+')');
      s.placeholder='type here'; s.autocomplete='off'; s.spellcheck=false;
      s.oninput=function(){ S.answers[e.id][seg.id]=s.value; var n=w.querySelector('.nudge'); if(n&&s.value)n.remove(); };
      line.appendChild(s);
    }
  });
  w.appendChild(line);
  if(e.bank&&e.bank.length){
    w.appendChild(el('div','small muted','Word bank for reference (some entries are decoys): '+e.bank.map(esc).join(' &middot; ')));
  }
};
GRADER.fill=function(e){
  var a=S.answers[e.id]||{};
  var any=e.blanks.some(function(b){ return a[b.id]&&String(a[b.id]).trim()!==''; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.blanks.forEach(function(b){
    var raw=(a[b.id]!==undefined)?String(a[b.id]):'';
    if(raw.trim()&&normText(raw)===normText(b.correct)){ h++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'ok',why:b.why}); }
    else if(raw.trim()){ wr++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'bad',why:b.why+' (correct: '+esc(b.correct)+')'}); }
    else { rows.push({label:'Blank "'+b.name+'" (left empty)',state:'miss',why:b.why}); }
  });
  return {credit:scoreExercise(h,wr,e.blanks.length),h:h,n:e.blanks.length,rows:rows};
};

/* tag (log lines tagged with chips) */
RENDER.tag=function(e,w){
  var lines=shuffle(e.lines.map(function(x){return x.id;}));
  S.answers[e.id]={};
  w.appendChild(el('div','small muted','Give every line the right tag from the buttons on its right. Tags: '+e.tags.map(function(t){return t.label;}).join(' · ')));
  lines.forEach(function(lid){
    var l=e.lines.filter(function(x){return x.id===lid;})[0];
    var row=el('div','tagline');
    row.innerHTML='<code>'+l.text+'</code>';
    var btns=el('div','tagbtns');
    e.tags.forEach(function(t){
      var b=el('button','tagbtn'); b.type='button'; b.textContent=t.label; b.setAttribute('data-t',t.id);
      b.onclick=function(){
        if(S.feedbackShown[e.id])return;
        row.querySelectorAll('.tagbtn').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); S.answers[e.id][lid]=t.id;
        var n=w.querySelector('.nudge'); if(n)n.remove();
      };
      btns.appendChild(b);
    });
    row.appendChild(btns); w.appendChild(row);
  });
};
GRADER.tag=function(e){
  var a=S.answers[e.id]||{};
  var any=e.lines.some(function(l){ return a[l.id]; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.lines.forEach(function(l){
    var got=a[l.id];
    var correctTag=null; e.tags.forEach(function(t){ if(t.accepts.indexOf(l.id)>=0) correctTag=t.id; });
    var correctLabel=correctTag?e.tags.filter(function(t){return t.id===correctTag;})[0].label:'?';
    var gotLabel=got?e.tags.filter(function(t){return t.id===got;})[0].label:'—';
    if(got&&got===correctTag){ h++; rows.push({label:'Line "'+l.short+'": '+gotLabel,state:'ok',why:l.why}); }
    else if(got){ wr++; rows.push({label:'Line "'+l.short+'": '+gotLabel,state:'bad',why:l.why+' (correct: '+correctLabel+')'}); }
    else { rows.push({label:'Line "'+l.short+'" (untagged)',state:'miss',why:l.why}); }
  });
  return {credit:scoreExercise(h,wr,e.lines.length),h:h,n:e.lines.length,rows:rows};
};

/* click (click the meaningful tokens/lines) */
RENDER.click=function(e,w){
  S.answers[e.id]=[];
  if(e.filterable){
    var fwrap=el('div','synpanel');
    fwrap.innerHTML='<div class="sp-h">Log viewer &mdash; filter</div><input id="logfilter" class="ddsel" style="width:100%" type="text" placeholder="type to filter lines (e.g. bcdedit)" aria-label="Filter log lines">';
    w.appendChild(fwrap);
  }
  var wrap=el('div','clickwrap');
  e.paragraphs.forEach(function(p){
    var pel=el('p');
    if(e.filterable){ pel.className='fline'; pel.setAttribute('data-f',(p.line||'')); pel.style.padding='6px 8px'; pel.style.borderBottom='1px dashed var(--border)'; }
    p.tokens.forEach(function(tok){
      var s=el('span','tok'); s.textContent=' '+tok.v+' ';
      s.setAttribute('data-tid',tok.id||'');
      if(tok.id){
        s.onclick=function(){ if(S.feedbackShown[e.id])return;
          var on=s.classList.toggle('sel');
          var set=S.answers[e.id];
          if(on){ if(set.indexOf(tok.id)<0) set.push(tok.id); } else { set=set.filter(function(x){return x!==tok.id;}); }
          S.answers[e.id]=set;
          var n=w.querySelector('.nudge'); if(n&&set.length)n.remove();
        };
      } else { s.style.cursor='default'; }
      pel.appendChild(s);
    });
    wrap.appendChild(pel);
  });
  w.appendChild(wrap);
  w.appendChild(el('div','small muted',e.clickInstruction||'Click the parts that answer the question. Click again to unselect.'));
  if(e.filterable){
    var fi=wrap.ownerDocument.getElementById('logfilter');
    fi.addEventListener('input',function(){
      var q=fi.value.toLowerCase();
      wrap.querySelectorAll('.fline').forEach(function(ln){
        var hay=(ln.getAttribute('data-f')||ln.textContent).toLowerCase();
        ln.style.display=(hay.indexOf(q)>=0)?'':'none';
      });
    });
  }
};
GRADER.click=function(e){
  var a=S.answers[e.id]||[]; if(!a.length) return null;
  var h=0,wr=0,rows=[];
  e.correctTokens.forEach(function(ct){
    var lbl=e.tokenInfo[ct].label, why=e.tokenInfo[ct].why;
    if(a.indexOf(ct)>=0){ h++; rows.push({label:lbl,state:'ok',why:why}); }
    else { rows.push({label:lbl,state:'miss',why:why}); }
  });
  a.forEach(function(t){
    if(e.correctTokens.indexOf(t)<0){
      wr++; rows.push({label:e.tokenInfo[t].label,state:'bad',why:e.tokenInfo[t].why});
    }
  });
  return {credit:scoreExercise(h,wr,e.correctTokens.length),h:h,n:e.correctTokens.length,rows:rows};
};

/* terminal */
RENDER.terminal=function(e,w){
  S.answers[e.id]={last:''};
  if(e.syntaxPanel){
    w.appendChild(el('div','synpanel','<div class="sp-h">Syntax reminder</div>'+e.syntaxPanel));
  }
  if(e.expectedOutput){
    w.appendChild(el('div','synpanel','<div class="sp-h">Expected output shape</div><pre class="code">'+e.expectedOutput+'</pre>'));
  }
  var term=el('div','term');
  term.innerHTML='<div class="tscroll" id="tsc_'+e.id+'"></div>'+
    '<div class="tin"><span class="tprompt">'+e.prompt+'</span><input id="tin_'+e.id+'" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command">'+
    '<button type="button" class="btn ghost" id="run_'+e.id+'" aria-label="Run command">&#9166; Run</button></div>';
  w.appendChild(term);
  var sc=term.querySelector('.tscroll');
  function push(html){ var l=el('div','tline'); l.innerHTML=html; sc.appendChild(l); sc.scrollTop=sc.scrollHeight; }
  push('<span class="cmt">'+esc(e.banner||'Simulation shell. Type the command you judge correct, then press Check to grade it.')+'</span>');
  var inp=term.querySelector('input');
  function run(){
      var v=inp.value; inp.value='';
      push('<span class="tprompt">'+esc(e.prompt)+'</span>'+esc(v));
      S.answers[e.id].last=v;
      var norm=normalise(v);
      var matched=e.dangerous.some(function(d){ return RX(d.re).test(norm); });
      var expected=e.elements.every(function(elx){ return RX(elx.re).test(norm); });
      if(expected){ push('<span class="okv">[simulated] command accepted \u2014 simulated output below.</span>');
        (e.simOutput||[]).forEach(function(o){ push(esc(o)); }); }
      else if(matched){ push('<span class="errv">[simulated] command executed \u2014 WARNING: this changes state on a live system.</span>'); }
      else { push('<span class="errv">command not recognised in this simulation</span>'); }
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ run(); } });
  term.querySelector('#run_'+e.id).addEventListener('click',function(){ run(); });
};
function normalise(cmd){
  return String(cmd).toLowerCase().replace(/\s+/g,' ').trim();
}
function RX(r){
  if(r instanceof RegExp) return r;
  try{ return new RegExp(r,'i'); }catch(e){ return { test:function(){ return false; } }; }
}
GRADER.terminal=function(e){
  var a=S.answers[e.id]||{last:''};
  if(!a.last) return null;
  var norm=normalise(a.last);
  var h=0,wr=0,rows=[];
  e.elements.forEach(function(elx){
    if(RX(elx.re).test(norm)){ h++; rows.push({label:elx.label,state:'ok',why:elx.why}); }
    else { rows.push({label:elx.label,state:'miss',why:elx.why}); }
  });
  e.dangerous.forEach(function(d){
    if(RX(d.re).test(norm)){ wr++; rows.push({label:'DANGEROUS element: '+d.label,state:'bad',why:d.why}); }
  });
  var n=e.elements.length;
  return {credit:scoreExercise(h,wr,n),h:h,n:n,rows:rows,dangerous:wr>0};
};

/* branch (multi-step decision tree) */
RENDER.branch=function(e,w){
  S.answers[e.id]={};
  var holder=el('div');
  w.appendChild(holder);
  e.steps.forEach(function(st,si){
    var sb=el('div','block block-question'); sb.style.margin='10px 0';
    sb.innerHTML='<div class="bh">STEP '+(si+1)+' OF '+e.steps.length+'</div><div class="qtext" style="font-weight:600;font-size:15.5px">'+st.prompt+'</div>';
    var ow=el('div','opts');
    shuffle(st.options.map(function(o){return o.id;})).forEach(function(oid,i){
      var o=st.options.filter(function(x){return x.id===oid;})[0];
      var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
      b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
      b.onclick=function(){
        if(S.feedbackShown[e.id])return;
        ow.querySelectorAll('.opt').forEach(function(x){x.classList.remove('selected'); x.removeAttribute('aria-pressed');});
        b.classList.add('selected'); b.setAttribute('aria-pressed','true');
        S.answers[e.id][st.id]=oid;
        var n=w.querySelector('.nudge'); if(n)n.remove();
      };
      ow.appendChild(b);
    });
    sb.appendChild(ow); holder.appendChild(sb);
  });
};
GRADER.branch=function(e){
  var a=S.answers[e.id]||{};
  var any=e.steps.some(function(s){ return a[s.id]; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.steps.forEach(function(s){
    var got=a[s.id];
    var co=s.options.filter(function(o){return o.id===s.correctId;})[0];
    if(got&&got===s.correctId){ h++; rows.push({label:s.label,state:'ok',why:co.why}); }
    else if(got){ var wo=s.options.filter(function(o){return o.id===got;})[0];
      wr++; rows.push({label:s.label,state:'bad',why:wo.why+' (best action: '+co.why+')'}); }
    else { rows.push({label:s.label+' (not answered)',state:'miss',why:co.why}); }
  });
  return {credit:scoreExercise(h,wr,e.steps.length),h:h,n:e.steps.length,rows:rows};
};

/* ---------- review skipped ---------- */
function renderReview(){
  var list='';
  S.skipped.forEach(function(id){
    var e=exById(id);
    list+='<div class="skipcard"><span class="sk">&#9888; Skipped</span><span class="stit">'+esc(e.title)+'</span>'+
      '<button class="btn" data-ans="'+id+'">Answer now</button></div>';
  });
  app.innerHTML=
  '<div class="exam-head" id="examhead"></div>'+
  '<div class="progress" role="progressbar"><div class="bar" id="progressbar"></div></div>'+
  '<div class="card"><h2>Review skipped exercises</h2>'+
  '<p class="sub">These exercises were skipped. You can return to any of them now and answer it. You can do this as many times as you need while the timer is still running. If you submit now, the exercises below are excluded from the score.</p>'+
  list+
  '<div class="btnrow"><button class="btn primary" id="btn-finish">Final Submit &#10140;</button></div></div>';
  renderHeader();
  app.querySelectorAll('[data-ans]').forEach(function(b){
    b.onclick=function(){
      S.idx=S.order.indexOf(b.getAttribute('data-ans'));
      S.screen='exam'; S.mode='review'; render();
    };
  });
  document.getElementById('btn-finish').onclick=function(){ finishExam(); };
  document.getElementById('btn-hint').disabled=true;
  document.getElementById('btn-skip').disabled=true;
}

/* ---------- results ---------- */
function renderResults(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  var passed=percent>=M.passMark;
  var full=0,partial=0,partialAvg=0,zero=0,skippedN=0;
  answeredIds.forEach(function(id){
    var c=S.credits[id]||0;
    if(c>=0.999) full++;
    else if(c>0){ partial++; partialAvg+=c; }
    else zero++;
  });
  /* skipped-and-never-answered = everything in the running order that has no credit */
  S.order.forEach(function(id){ if(!S.answered[id]) skippedN++; });
  if(partial>0) partialAvg=Math.round((partialAvg/partial)*100)/100;
  if(!S.reported) reportScore();
  app.innerHTML=
  '<div class="card center"><h1>Results &mdash; '+esc(M.title)+'</h1>'+
    '<div class="cert '+(passed?'pass':'fail')+'">'+
      '<div class="cl">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="cs">'+creditSum.toFixed(1)+' / '+count+' ('+percent+'%)</div>'+
      '<div class="sub">Computed only over the '+count+' exercises you answered. Pass mark: '+M.passMark+'%.</div>'+
    '</div>'+
    '<div class="result-grid">'+
      '<div class="rescard"><div class="rk" style="color:var(--state-correct)">&#10003; Fully correct</div><div class="rv">'+full+'</div><div class="rn">credit 1.00 each</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-partial)">&#10003; Partially correct</div><div class="rv">'+partial+'</div><div class="rn">average credit '+(partial>0?partialAvg.toFixed(2):'&mdash;')+'</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-incorrect)">&#10007; Fully incorrect</div><div class="rv">'+zero+'</div><div class="rn">credit 0.00</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-skipped)">&#9888; Skipped &mdash; excluded</div><div class="rv">'+skippedN+'</div><div class="rn">not counted in score</div></div>'+
    '</div>'+
    '<div class="pausestats">'+
      '<span>&#9208; Manual pause time: <b>'+fmtDur(S.pauseLog.manualMs)+'</b></span>'+
      '<span>&#9203; Feedback review time (auto-pause): <b>'+fmtDur(S.pauseLog.autoMs)+'</b></span>'+
      '<span>&#9203; Time left when finished: <b>'+fmtTime(S.timer.remaining)+'</b></span>'+
    '</div>'+
    (passed
      ?'<p class="sub" style="margin-top:14px">You passed. Keep the certificate feeling: revisit any exercise explanation by retaking, or move to the next severity tier of this topic.</p>'
      :'<p class="sub" style="margin-top:14px">You did not reach 70%. Restudy the "What to study" pointers, then retake the exam. Questions and options are shuffled on every attempt.</p>')+
    '<div class="btnrow center"><button class="btn primary" id="btn-retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  document.getElementById('btn-retake').onclick=function(){ startExam(); };
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
render();
/* test/debug handle: introspection for automated QA (contains no scoring logic) */
window.__EXAM_DEBUG__={ S:S, T:T, M:M, EXS:EXS };
})();

</script>
