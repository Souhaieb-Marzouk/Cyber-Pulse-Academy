.intro-sub{color:var(--text-secondary);font-size:15px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:16px}
.fact .fl{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.fact .fv{font-weight:800;font-size:16.5px;margin-top:2px}
.sec-title{font-size:19px;font-weight:800;margin:26px 0 0;padding-left:12px;border-left:4px solid var(--accent-blue)}
.kw-theme{
  border:1px solid var(--border-soft);border-radius:8px;
  background:var(--bg-surface-2);padding:12px 14px;margin-top:12px;
}
.kw-theme .kt{font-weight:800;font-size:14px;color:var(--accent-amber);letter-spacing:.03em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--tint-blue-08);border:1px solid var(--border);
  color:var(--text-primary);border-radius:999px;padding:4px 13px;font-size:13.5px;
}
.rules{margin:10px 0 0;padding-left:22px}
.rules li{margin:7px 0}
.rules .ico{font-weight:800}
/* ---------- pause overlay ---------- */
.pausemask{
  position:fixed;inset:0;background:var(--pausemask-bg);z-index:90;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
}
.pausemask .inner{max-width:520px}
.pausemask .big{font-size:22px;font-weight:800;color:var(--state-paused);margin:12px 0 8px}
.pausemask .sub{color:var(--text-secondary)}
/* ---------- review skipped ---------- */
.sk-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sk-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:12px 14px;
}
.sk-row .sk-ico{color:var(--state-skipped);font-weight:800}
.sk-row .sk-t{flex:1;min-width:200px}
.sk-row .sk-t .n{font-weight:700}
.sk-row .sk-t .d{font-size:13.5px;color:var(--text-secondary)}
/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 30px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono-font);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px}
.res-cell .rc-ico{font-size:20px;font-weight:800}
.res-cell.ok .rc-ico{color:var(--state-correct)}
.res-cell.part .rc-ico{color:var(--state-partial)}
.res-cell.bad .rc-ico{color:var(--state-incorrect)}
.res-cell.skip .rc-ico{color:var(--state-skipped)}
.res-cell .rc-n{font-size:26px;font-weight:800;font-family:var(--mono-font)}
.res-cell .rc-l{font-size:13.5px;color:var(--text-secondary)}
.cert{
  margin-top:18px;border:2px solid var(--state-correct);border-radius:10px;
  background:var(--tint-green-07);padding:20px 22px;text-align:center;
}
.cert.fail{border-color:var(--state-incorrect);background:var(--tint-red-06)}
.cert .c-big{font-size:30px;font-weight:800;color:var(--state-correct)}
.cert.fail .c-big{color:var(--state-incorrect)}
.cert .c-sub{color:var(--text-secondary);margin-top:6px}
.time-report{margin-top:14px;font-size:14px;color:var(--text-secondary)}
.time-report b{color:var(--text-primary)}
.hidden{display:none!important}
.footer-note{margin-top:26px;text-align:center;font-size:12.5px;color:var(--text-secondary)}
@media (max-width:760px){
  .wrap{padding:10px 12px 50px}
  .intro-title{font-size:21px}
  .res-pct{font-size:40px}
  .card{padding:13px 14px}
}

<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1686","batch":2,"title":"T1686 Disable or Modify System Firewall — MEDIUM","difficulty":"medium","questionCount":16,"estimatedMinutes":35,"passMark":70,"sev":"medium","timerSeconds":2100},"introHtml":"\n<div class=\"intro-head\">\n  <h1 class=\"intro-title\">T1686 — MEDIUM practice exam<\/h1>\n  <p class=\"intro-sub\">MITRE ATT&amp;CK object: <b>T1686 — Disable or Modify System Firewall<\/b> (Technique) &middot; Tactic: Defense Impairment (TA0112)<\/p>\n  <div class=\"facts\">\n    <div class=\"fact\"><div class=\"fl\">Severity<\/div><div class=\"fv\"><span class=\"badge sev-medium\">MEDIUM<\/span><\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Exercises in this file<\/div><div class=\"fv\">16<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Estimated time<\/div><div class=\"fv\">35 minutes<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Timer budget<\/div><div class=\"fv\">35:00 countdown<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Pass mark<\/div><div class=\"fv\">70%<\/div><\/div>\n  <\/div>\n<\/div>\n\n<h2 class=\"sec-title\">What you will learn here<\/h2>\n<div class=\"card\">\n  <p class=\"body\">You already know what a firewall does. Now we go one level deeper: how analysts <b>combine two facts<\/b> — a command and its context, a change and its sub-technique, a mitigation and the attack path it blocks. That is the daily work with <b>T1686 — Disable or Modify System Firewall<\/b>.<\/p>\n  <p class=\"body\">This ATT&amp;CK object is a <b>Technique<\/b> in the Defense Impairment tactic (TA0112). It covers disabling or modifying firewalls everywhere they run: <b>T1686.001 Cloud Firewall<\/b> (security groups and cloud rules), <b>T1686.002 Network Device Firewall<\/b> (router and perimeter ACLs), and <b>T1686.003 Windows Host Firewall<\/b> (profiles, rules, services and registry keys in Windows). The parent technique also covers Linux, macOS and ESXi hosts, where tools like iptables, socketfilterfw and esxcli do the same job.<\/p>\n  <p class=\"body\">In real work, a <b>SOC analyst<\/b> decides whether a firewall change is planned admin work or tampering. A <b>detection engineer<\/b> turns the ATT&amp;CK detection strategies (DET0145 with analytics AN0406–AN0410, DET0901, DET0306, DET0424) into SIEM and EDR rules. An <b>incident responder<\/b> captures evidence and reverses the changes. A <b>CTI analyst<\/b> maps procedure examples — Medusa Group, Magic Hound, Pacu, Salt Typhoon — to the right sub-technique. In this file you will practise exactly those two-step judgements, including writing one correct netsh rule yourself in a safe simulated shell.<\/p>\n<\/div>\n\n<h2 class=\"sec-title\">Keywords covered in this exam<\/h2>\n<div class=\"card\">\n  <div class=\"kw-theme\"><div class=\"kt\">Sub-technique discrimination<\/div><div class=\"chips\"><span class=\"chip\">T1686.001 Cloud Firewall<\/span><span class=\"chip\">T1686.002 Network Device Firewall<\/span><span class=\"chip\">T1686.003 Windows Host Firewall<\/span><span class=\"chip\">parent T1686 (Linux, macOS, ESXi)<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Windows commands and services<\/div><div class=\"chips\"><span class=\"chip\">netsh advfirewall firewall add rule<\/span><span class=\"chip\">set rule enable=Yes/No<\/span><span class=\"chip\">mpssvc service<\/span><span class=\"chip\">FirewallPolicy registry<\/span><span class=\"chip\">RDP on TCP 3389<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Cloud and network devices<\/div><div class=\"chips\"><span class=\"chip\">security group ingress 0[.]0[.]0[.]0/0<\/span><span class=\"chip\">AuthorizeSecurityGroupIngress<\/span><span class=\"chip\">Fortigate CLI changes<\/span><span class=\"chip\">ACL modification<\/span><span class=\"chip\">2025 Poland Wiper Attacks<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Detection and telemetry<\/div><div class=\"chips\"><span class=\"chip\">DET0901 / AN2043 correlation<\/span><span class=\"chip\">DET0145 analytics AN0406–AN0410<\/span><span class=\"chip\">process creation of netsh<\/span><span class=\"chip\">registry modification<\/span><span class=\"chip\">service state change<\/span><span class=\"chip\">cloud control-plane logs<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Mitigations and response<\/div><div class=\"chips\"><span class=\"chip\">M1018 User Account Management<\/span><span class=\"chip\">M1024 Restrict Registry Permissions<\/span><span class=\"chip\">M1051 Update Software<\/span><span class=\"chip\">M1047 Audit<\/span><span class=\"chip\">capture evidence before changing<\/span><span class=\"chip\">reverse rogue rules<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Real-world procedures<\/div><div class=\"chips\"><span class=\"chip\">Medusa Group (PsExec, RDP)<\/span><span class=\"chip\">Magic Hound (Terminal Server rule)<\/span><span class=\"chip\">Pacu (GuardDuty allowlist)<\/span><span class=\"chip\">TeamTNT (iptables)<\/span><span class=\"chip\">Salt Typhoon (ACLs)<\/span><span class=\"chip\">BPFDoor (iptables redirect)<\/span><\/div><\/div>\n<\/div>\n\n<h2 class=\"sec-title\">How this exam works<\/h2>\n<div class=\"card\">\n  <ul class=\"rules\">\n    <li><span class=\"ico\">&#10003; Pass mark:<\/span> 70%. Each exercise chains <b>two<\/b> connected ideas — for example, read the artefact, then pick the matching sub-technique or control. Wrong options are wrong for a specific, explainable reason.<\/li>\n    <li><span class=\"ico\">&#9881; Exercise types in this file:<\/span> multi-select with partial credit, SOC alert-queue triage, a branching response scenario, matching, drag-and-drop, fill-in-the-blank reporting, spot-the-mistake, timeline ordering, log analysis, multiple-choice questions, and one interactive terminal where you build a netsh rule.<\/li>\n    <li><span class=\"ico\">&#9201; Timer:<\/span> 35:00 countdown, state <b>&#9654; RUNNING<\/b>. <b>Pause<\/b> = manual break, exercise hidden. <b>Check<\/b> = automatic pause (&#9208; reviewing feedback) so you can study the explanation; the timer restarts only on <b>Next<\/b>.<\/li>\n    <li><span class=\"ico\">&#10100; Partial credit:<\/span> multi-item exercises score max(0, (correct − wrong) / total). Selecting everything scores 0.<\/li>\n    <li><span class=\"ico\">&#128161; Hints:<\/span> one per exercise, −10% of that exercise's credit. Hints narrow the direction; they do not give the answer.<\/li>\n    <li><span class=\"ico\">&#9888; Skip:<\/span> skipping is free and does not stop the timer. Before the exam ends you may review every skipped exercise while the timer runs. Never-answered skipped exercises are excluded from the score.<\/li>\n  <\/ul>\n  <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-primary btn-big\" id=\"btnStart\">&#9654; Start the exam<\/button><\/div>\n<\/div>\n","exercises":[{"id":"M01","type":"multi","title":"Which actions belong to T1686?","summary":"Select every action the technique actually covers","scenario":["You are writing a detection scope note for T1686. A junior analyst listed candidate behaviours from various incidents.","The T1686 card says adversaries disable or modify host-based or network firewalls: turning off profiles, altering existing rules to permit previously blocked ports or protocols, or adding new rules that create covert communication paths."],"question":"Select <b>all<\/b> behaviours that belong inside the T1686 scope note.","hint":"Everything that changes what the firewall permits or whether it runs is in scope. Tools that are not firewalls are not.","options":[{"id":"A","text":"Turning off firewall profiles (Domain, Private, Public)","why":"Correct — disabling profiles is the plainest T1686 action."},{"id":"B","text":"Altering an existing rule so a previously blocked port is now allowed","why":"Correct — modifying the rule set is explicitly in the technique description."},{"id":"C","text":"Adding a new rule that opens a non-standard port for covert traffic","why":"Correct — the description names rules for covert communication paths."},{"id":"D","text":"Uninstalling the antivirus agent from the host","why":"Endpoint protection tampering is a different technique; the firewall is not touched."},{"id":"E","text":"Clearing Windows Security event logs","why":"Log clearing is its own defence-impairment behaviour, not a firewall change."}],"correct":["A","B","C"],"explanation":"T1686 is only about the firewall: its state (profiles), its rules (added or altered), and its ability to filter. A, B and C are the three shapes named in the technique description. Uninstalling antivirus and clearing logs weaken defences too, but they have their own techniques — keeping scopes clean prevents detection gaps and double counting.","study":"Read the T1686 description once more and underline the three verbs: disable, alter, add."},{"id":"M02","type":"qcm","title":"One of these lines is not like the others","summary":"Three commands, one platform mismatch","scenario":["A hunt returned three firewall-related commands from three hosts in one incident."],"artefacts":[{"label":"ARTEFACT 1 — hunt results, three hosts","kind":"log","filter":true,"lines":["HOST-01  netsh advfirewall set allprofiles state off","HOST-02  netsh advfirewall firewall add rule name=\"TS-Open\" dir=in action=allow protocol=TCP localport=3389","HOST-03  esxcli network firewall set --enabled=false"]}],"question":"Two lines map to sub-technique <b>T1686.003<\/b>. Which line does <b>not<\/b> belong to T1686.003, and why?","hint":"First decide which platform each command runs on, then check which sub-technique covers that platform.","options":[{"id":"A","text":"HOST-03 — esxcli runs on ESXi, which the parent technique covers, not the Windows sub-technique.","why":"Correct. T1686.003 is Windows-only; ESXi firewall changes stay under the parent T1686."},{"id":"B","text":"HOST-01 — state off is a service action, not a firewall rule change.","why":"State changes are core T1686.003 behaviour; the platform is the deciding fact, not the action."},{"id":"C","text":"HOST-02 — port 3389 rules belong to a remote-access technique, not T1686.","why":"The action is a Windows firewall rule change, which is exactly T1686.003."},{"id":"D","text":"None — all three lines are T1686.003 because they all weaken filtering.","why":"All weaken defences, but the sub-technique is chosen by platform: ESXi is not Windows."}],"correct":["A"],"explanation":"HOST-01 and HOST-02 use netsh advfirewall on Windows hosts, so both fall under T1686.003 Windows Host Firewall. HOST-03 uses esxcli, the ESXi command line — ESXi firewall tampering sits under the parent technique T1686, which lists ESXi among its platforms. Two-step thinking: read the tool, name the platform, then pick the sub-technique.","study":"Sub-techniques are platform-scoped. Tool first, platform second, sub-technique third."},{"id":"M03","type":"triage","title":"Queue of three firewall changes","summary":"Decide sub-technique or benign for three queued events","scenario":["Morning queue. Three firewall-change events, three different infrastructure layers. Your runbook: map real tampering to the sub-technique of the layer it hit; planned, documented work is benign."],"question":"For each event, choose the correct classification.","hint":"Decide first if the change is planned work or tampering; then match the layer: cloud, network device, or Windows host.","alerts":[{"id":"c1","time":"01:44","source":"AWS CloudTrail (control plane)","text":"AuthorizeSecurityGroupIngress: rule added allowing TCP 445 from 0[.]0[.]0[.]0/0, performed by role deploy-prod outside deployment hours. No ticket matches.","why":"A cloud security-group rule opened to the whole internet by an unexpected role is T1686.001 tampering."},{"id":"c2","time":"02:10","source":"Perimeter firewall syslog","text":"Config commit from 198[.]51[.]100[.]77 (unknown admin session): policy 'Any-Any-Allow' created, previous block policy disabled.","why":"Rule creation and policy disabling on a perimeter device is T1686.002 — the allow-any rule removes network restrictions."},{"id":"c3","time":"09:30","source":"Windows host ACCT-14","text":"Firewall profile change (Domain profile ON, stricter outbound rules) by account g.wilson (IT security) under change CHG-3087, matching the monthly baseline push.","why":"A documented, strengthening change by a known admin is planned work — benign."}],"actions":[{"id":"cloud","label":"T1686.001 — Cloud Firewall tampering"},{"id":"netdev","label":"T1686.002 — Network Device tampering"},{"id":"benign","label":"Benign — planned, documented change"}],"correct":{"c1":"cloud","c2":"netdev","c3":"benign"},"explanation":"Layer decides the sub-technique. The security-group change lives in the cloud control plane (T1686.001). The perimeter config commit lives on a network device (T1686.002). The Windows baseline push is benign because a named owner, a ticket and a strengthening change all line up. Note the extra signals that make c1 and c2 suspicious: unusual source roles and sessions, off-hours timing, and access expansions instead of reductions.","study":"Practise on your own queue: for every firewall change, name the layer, then name the sub-technique — or the ticket."},{"id":"M04","type":"branch","title":"Respond to tampering on APP-02","summary":"Three-step response workflow with outcomes","scenario":["02:37 — EDR on APP-02 shows netsh advfirewall set allprofiles state off run by the interactive session of a service account. The app owner is asleep. You are alone on shift.","Work through the response. Each step has one best answer; later steps assume you chose well."],"question":"Choose the best action for each of the three steps.","hint":"Classic responder order: understand before you touch, capture before you change, then contain precisely.","steps":[{"prompt":"STEP 1 — Your first move on the APP-02 alert?","options":[{"id":"A","text":"Reimage APP-02 immediately to remove any attacker access.","outcome":"Reimaging destroys the volatile evidence you have not collected yet — a costly shortcut.","why":"Destruction of evidence first is wrong; understand, then act."},{"id":"B","text":"Verify scope: check the change database and whether other hosts show the same netsh pattern.","outcome":"Good. The change DB shows no ticket, and two more hosts show the same command — this is a small campaign, not a one-off.","why":"Correct — establish scope and rule out planned work before acting."},{"id":"C","text":"Delete the netsh rule history and restart the firewall to clean up.","outcome":"You just altered the crime scene: process lineage and state are gone.","why":"Never clean before you capture."}],"correct":"B","why":"Scope first: a change ticket could explain everything, and sibling hosts change the whole response plan."},{"prompt":"STEP 2 — Evidence capture on APP-02 (firewall state is OFF right now)?","options":[{"id":"A","text":"Export the current firewall configuration and preserve the EDR process events, then proceed.","outcome":"Evidence secured: rule set, profile state and process lineage are stored in the case file.","why":"Correct — capture the altered state and the process context before changing anything."},{"id":"B","text":"Turn the firewall back on first so the host is protected, then look for evidence.","outcome":"The host is safer, but the altered state was never recorded — the case is weaker now.","why":"Protection without capture loses the proof of what the attacker changed."},{"id":"C","text":"Wait for the malware reverse-engineering report before touching anything.","outcome":"Waiting hours on a lab report while the state sits exposed is not a plan.","why":"Delay has a cost too; capture first, deeper analysis can follow."}],"correct":"A","why":"Capture the tampered state — it proves the T1686 action and guides restoration."},{"prompt":"STEP 3 — Containment choice, with scope = three hosts and the svc account confirmed abused?","options":[{"id":"A","text":"Turn the firewall back on on all three hosts and close the ticket.","outcome":"Firewalls are on, but the abused account still works and can flip them off again in seconds.","why":"Fixing the effect without the cause means the attacker repeats the change."},{"id":"B","text":"Restore firewall state on all three hosts, disable the abused service account, and rotate its credentials.","outcome":"Solid: protection restored and the access the attacker relied on is revoked. Case moves to investigation.","why":"Correct — reverse the change AND remove the access that enabled it."},{"id":"C","text":"Isolate all three hosts from the network for a week until the full forensic report.","outcome":"Safe but very costly — the business loses three production servers for days.","why":"Containment should be proportionate; the precise fix restores service quickly."}],"correct":"B","why":"Pair the defensive reversal with identity revocation — that is what stops a repeat."}],"explanation":"The two-step logic repeats three times: understand then act, capture then change, reverse then revoke. Every chose-otherwise outcome above shows the real cost: evidence lost, attacker persists, or business impact that was never required. This mirrors how responders actually pace a T1686 incident.","study":"Walk the three pairs out loud: scope-act, capture-change, reverse-revoke."},{"id":"M05","type":"terminal","title":"Build the detection-test rule","summary":"Write the netsh command your detection must catch","scenario":["You are a detection engineer. Your new analytic must alert on the exact Magic Hound procedure: an <b>inbound allow rule for RDP on TCP 3389<\/b> named Terminal Server. To test the analytic safely you must reproduce the command in the lab shell below.","The tool is <b>netsh<\/b>. You need an <b>add rule<\/b> action, direction <b>in<\/b>, action <b>allow<\/b>, protocol <b>TCP<\/b>, local port <b>3389<\/b>, and the rule name <b>Terminal Server<\/b>."],"question":"Type the netsh command that adds that inbound allow rule, then run it and press Check.","hint":"The netsh rule commands sit one level deeper than the profile commands: the context word is firewall, and add creates a new rule while set changes an existing one. Assemble the pieces in the order the scenario names them.","terminal":{"title":"DETECT-LAB — simulated cmd.exe (isolated test host)","prompt":"C:\\Users\\deng>","banner":["Detection test lab. Simulation only — nothing real is modified.","Build the command described in the scenario, then press Enter."],"expected":"netsh advfirewall firewall add rule name=\"Terminal Server\" dir=in action=allow protocol=tcp localport=3389","elements":["netsh","advfirewall","firewall","add","rule","dir=in","action=allow","protocol=tcp","localport=3389"],"elWhy":{"netsh":"the Windows network tool that owns firewall changes.","advfirewall":"the advanced firewall context.","firewall":"the firewall rule context inside advfirewall.","add":"the action: create a new rule (not modify an old one).","rule":"the object being added.","dir=in":"inbound — RDP connections arrive at this host.","action=allow":"permit the traffic; block would deny it.","protocol=tcp":"RDP uses TCP, not UDP.","localport=3389":"the RDP listening port from the detection requirement."},"dangerous":["delete","del","set allprofiles state off","disable"],"dangerousMsg":"That command would remove or disable firewall protection instead of adding one test rule.","outputLines":["Ok."],"allowedExtra":["name=\"terminal server\"","name=terminal","server","name=\"terminal"],"genericErr":"Not the required command — compare each required element with what you typed."},"explanation":"The canonical command is netsh advfirewall firewall add rule name=\"Terminal Server\" dir=in action=allow protocol=tcp localport=3389. Each element matters: add creates (set would modify), dir=in is inbound, allow permits, tcp is RDP's protocol, 3389 is its port. Your SIEM rule should anchor on add rule with dir=in action=allow and localport=3389 — exactly what the analytic AN0406 family watches for on Windows.","study":"Rebuild this command from memory twice this week; then write the matching SIEM pseudo-rule: process netsh.exe AND command contains 'add rule' AND 'localport=3389' AND 'dir=in'."},{"id":"M06","type":"match","title":"Procedure examples to sub-techniques","summary":"Map four real procedures to the right sub-technique","scenario":["You are preparing a CTI briefing. Each row below is a real procedure example from the T1686 family of pages. Map each one to the sub-technique (or the parent) it demonstrates."],"question":"Match each procedure to the sub-technique it demonstrates.","hint":"Ask for each: where did the firewall change happen — in the cloud, on a perimeter device, in Windows, or on another platform?","items":[{"id":"p1","label":"Magic Hound adds netsh rule 'Terminal Server' allowing TCP 3389 inbound","why":"A Windows host firewall rule via netsh — T1686.003."},{"id":"p2","label":"APT38 creates firewall exemptions on ports 443, 6443, 8443 and 9443","why":"Exemptions on network-device rule sets — T1686.002."},{"id":"p3","label":"Pacu allowlists IP addresses in AWS GuardDuty to silence alerts","why":"Cloud control-plane change — T1686.001."},{"id":"p4","label":"TeamTNT disables iptables on compromised Linux hosts","why":"Linux iptables sits under the parent technique T1686, which lists Linux."}],"slots":[{"id":"s1","label":"T1686.003 — Windows Host Firewall"},{"id":"s2","label":"T1686.002 — Network Device Firewall"},{"id":"s3","label":"T1686.001 — Cloud Firewall"},{"id":"s4","label":"T1686 parent — other platforms (Linux here)"}],"correct":{"p1":"s1","p2":"s2","p3":"s3","p4":"s4"},"explanation":"The platform of the changed firewall decides the mapping: Windows netsh rules to T1686.003, perimeter device exemptions to T1686.002, cloud control-plane changes to T1686.001, and platform tools outside the three sub-techniques — like Linux iptables — to the parent T1686. In a briefing this mapping tells each infrastructure owner exactly which examples concern them.","study":"Re-read the procedure tables on the T1686 page and keep the platform question in your pocket."},{"id":"M07","type":"dragdrop","title":"Which mitigation blunts which path?","summary":"Drag four controls onto the attack path they block","scenario":["Your GRC board asks: which control actually stops which T1686 path? Four mitigations from the T1686 pages are on the table."],"question":"Drag each mitigation onto the T1686 path it primarily blunts.","hint":"Match the control's mechanism to the attack path's requirement: registry writes need registry permissions, exposed devices need patches, role abuse needs reviews, everything needs least privilege.","items":[{"id":"m1","label":"M1024 — Restrict Registry Permissions","why":"Blocks unauthorised writes to FirewallPolicy keys — the registry path used by ZxShell-style malware."},{"id":"m2","label":"M1051 — Update Software","why":"Patches public-facing network firewalls, blocking the exploit path into T1686.002."},{"id":"m3","label":"M1047 — Audit","why":"Routine reviews of role permissions catch excess rights in cloud IAM — the enabler of T1686.001."},{"id":"m4","label":"M1018 — User Account Management","why":"Least privilege limits who can run netsh or esxcli at all — it blunts every sub-technique."}],"slots":[{"id":"s1","label":"Registry-based profile tampering (T1686.003)"},{"id":"s2","label":"Exploit of an exposed perimeter firewall (T1686.002)"},{"id":"s3","label":"Excess cloud IAM rights changing security groups (T1686.001)"},{"id":"s4","label":"Any sub-technique — it limits who can make changes at all"}],"correct":{"m1":"s1","m2":"s2","m3":"s3","m4":"s4"},"explanation":"Each control maps to a mechanism. M1024 protects the registry where Windows stores firewall state. M1051 patches the perimeter devices that T1686.002 attackers break into. M1047 audits role permissions — the cloud IAM excess that T1686.001 needs. M1018 applies everywhere because every sub-technique needs powerful rights first. Mapping controls to paths like this is what turns an ATT&CK page into a real hardening plan.","study":"For your own environment, write one line per sub-technique: the control that blocks it, and the day it was last verified."},{"id":"M08","type":"fill","title":"CTI report on Medusa Group","summary":"Insert the right keywords into the intelligence report","scenario":["Your CTI team drafts a report on Medusa Group. The report names their firewall behaviour from the T1686 procedure table: PsExec-executed batch scripts that modify firewall settings, and enabled or modified rules to allow RDP connections for lateral movement."],"question":"Complete the report with the four missing keywords.","hint":"Two blanks need an ID (one technique, one tool); the other two need the behaviour words used in the procedure description.","template":"Assessment: Medusa Group uses <b>{{1}}<\/b> to execute batch scripts that modify firewall settings, consistent with technique <b>{{2}}<\/b>. The group enables and modifies rules to allow <b>{{3}}<\/b> traffic, supporting <b>{{4}}<\/b> between hosts. Defenders should alert on remote rule changes and review remote-management exposure.","blanks":[{"id":"1","correct":"PsExec","distractors":["Netcat","Wireshark"],"why":"The procedure names PsExec as the execution vehicle for the batch scripts."},{"id":"2","correct":"T1686","distractors":["T1003","TA0112"],"why":"Modifying firewall settings maps to T1686; T1003 is credential dumping; TA0112 is the tactic."},{"id":"3","correct":"RDP","distractors":["SSH","DNS"],"why":"The procedure description names RDP connections explicitly."},{"id":"4","correct":"lateral movement","distractors":["initial access","exfiltration"],"why":"Opening RDP paths between hosts serves movement inside the network, not the first entry or data theft."}],"explanation":"A clean CTI sentence binds actor, tool, technique and purpose. Medusa Group executed batch scripts with PsExec that modified firewall settings (T1686), enabling RDP for lateral movement. Mixing T1003 or TA0112 into the technique slot would misroute every downstream detection and defence decision, which is why analysts double-check IDs against the ATT&CK page.","study":"Draft one report paragraph per procedure example you read this week, using the actor-tool-technique-purpose pattern."},{"id":"M09","type":"qcm","title":"Why DET0901 correlates two signals","summary":"Understand the design of the Windows detection strategy","scenario":["A colleague asks why detection strategy <b>DET0901 (Detect Windows Firewall)<\/b> does not simply alert on every netsh execution.","Its analytic AN2043 detects processes or users modifying firewall profiles, policies or rules <b>followed by measurable network exposure changes<\/b>, and correlates firewall management execution, registry or policy mutation, service state changes, and subsequent connectivity that is inconsistent with baseline administration."],"question":"What is the main reason DET0901 correlates the management action with a measurable exposure change?","hint":"Think about what a normal administrator's netsh run looks like in the logs, and how often that happens.","options":[{"id":"A","text":"Because admins also run netsh — the correlation separates real exposure changes from routine administration.","why":"Correct. Management actions alone are common and noisy; the exposure change is what makes tampering stand out."},{"id":"B","text":"Because netsh only leaves traces when the firewall actually changes.","why":"netsh logs its runs regardless of effect, so the action alone is not proof."},{"id":"C","text":"Because exposure changes are easier to parse than process events.","why":"Parsing ease is not the design goal; the correlation reduces false positives."},{"id":"D","text":"Because regulation requires two events for every alert.","why":"No such requirement drives the design; it is a precision choice."}],"correct":["A"],"explanation":"Thousands of legitimate firewall commands run daily in a company. A rule that alerts on each one drowns the SOC. DET0901 therefore pairs the management action (netsh, PowerShell, registry, service changes) with the consequence — a measurable change in exposure — and compares both against baseline administration. That is what turns a noisy behaviour into a precise analytic.","study":"For any detection you write, measure how often the triggering action alone happens legitimately. That number decides your correlation."},{"id":"M10","type":"spot","title":"The remediation that opens the door","summary":"Find the line that fights the intent of the change","scenario":["Incident responders believe the attacker used the 'Terminal Server' RDP rule on APP-02 (the Magic Hound procedure). They wrote a cleanup script to CLOSE that path again.","One line in the script does the opposite of the intent."],"question":"Click the <b>one line<\/b> that fights the intent of the remediation.","hint":"The goal is to close RDP. enable=Yes and enable=No have opposite effects on a rule.","code":{"label":"ARTEFACT 1 — proposed remediation script (fragments)","lines":["REM Goal: close the RDP path the attacker opened","netsh advfirewall firewall set rule name=\"Terminal Server\" new enable=Yes","netsh advfirewall firewall set rule name=\"Remote Desktop\" new enable=No","netsh advfirewall set allprofiles state on"]},"correct":["2"],"lineWhy":{"2":"enable=Yes re-enables the rule — it keeps the RDP door open, opposite of the intent.","3":"enable=No disables the named rule — this matches the goal.","4":"Turning profiles back ON restores protection — matches the goal.","1":"A comment line; it does nothing."},"explanation":"Line 2 sets enable=Yes on the Terminal Server rule, which re-activates the very RDP path the responders want closed — a classic near-miss that looks like cleanup. Line 3 correctly uses enable=No. When remediating T1686 changes, read every set rule line as if you were the attacker: does it open or close?","study":"Test remediation scripts on a lab host and verify the rule state with netsh advfirewall show rule name=all before approving them."},{"id":"M11","type":"order","title":"Order the responder's steps","summary":"Sequence the firewall-tampering response","scenario":["You are first responder to a confirmed T1686 change on a file server. Order the five steps of a sound response."],"question":"Drag the five steps into the correct response order.","hint":"Understand, capture, identify the actor, restore, then keep watch. Each step protects the next one.","items":[{"id":"r1","label":"Confirm the change and rule out a change ticket"},{"id":"r2","label":"Capture evidence: export rules, profile state, process events"},{"id":"r3","label":"Identify the account and source host behind the change"},{"id":"r4","label":"Reverse the firewall change and restore the baseline"},{"id":"r5","label":"Add the account and command pattern to monitoring"}],"correct":["r1","r2","r3","r4","r5"],"why":["Understanding first prevents acting on a planned change (M1047 records and ticket checks feed this).","Evidence before changes: the altered state proves the T1686 action.","The actor determines the blast radius: one account, or a stolen admin?","Only with evidence and actor known is it safe to restore the baseline.","Monitoring closes the loop: the same actor or pattern must not repeat unnoticed."],"explanation":"The order protects both the case and the business: confirm before capturing (avoid false alarms), capture before restoring (or the proof is gone), identify before restoring (the attacker may re-run the change), restore before watching (protection first), and watch last so the pattern cannot repeat silently. Skipping a step always shows up later as a gap in the incident report.","study":"Compare this order with your organisation's IR playbook and note where they differ."},{"id":"M12","type":"multi","title":"Cloud control-plane conclusions","summary":"Select every conclusion the two log events support","scenario":["You review cloud control-plane logs after an alert. Two events stand out.","Event 1: role terraform-ci created an ingress rule allowing TCP 443 from 0[.]0[.]0[.]0/0 at 02:11 UTC — outside its usual deployment window.","Event 2: user iam-user-dev authorised an ingress rule allowing TCP 22 from 203[.]0[.]113[.]50 at 02:19 UTC; that user has never touched security groups before."],"question":"Select <b>all<\/b> conclusions that the two events actually support.","hint":"Only claim what the logs show. Two conclusions are solid; the others reach beyond the evidence.","options":[{"id":"A","text":"A security-group rule now allows TCP 443 from any internet source","why":"Correct — the 0[.]0[.]0[.]0/0 source on 443 says exactly that."},{"id":"B","text":"Both identities need review: an off-hours role change and a first-time security-group user","why":"Correct — both events carry identity anomalies worth investigation."},{"id":"C","text":"An EC2 instance was stopped during the same window","why":"No stop event is in the evidence; the logs say nothing about instance state."},{"id":"D","text":"Port 445 was opened to a single internal IP","why":"No 445 rule appears; the events name 443 and 22 only."}],"correct":["A","B"],"explanation":"Discipline in cloud triage means concluding only what the logs prove. The two events do prove an any-source 443 rule and two anomalous identities (analytic AN1188 watches exactly these expansions beyond baselines, correlated with privileged role or API-key activity). Instance stops and SMB port 445 are plausible in other incidents but absent here — selecting them would send responders chasing ghosts.","study":"Practise separating 'what the log says' from 'what could also be true' — write both lists for your next cloud alert."},{"id":"M13","type":"qcm","title":"Platform coverage of T1686","summary":"Recall the platform list, then spot the intruder","scenario":["You scope a detection for T1686 across the estate. The technique card lists its platforms; the cloud sub-technique adds its own."],"question":"Which platform set matches the <b>T1686 technique card<\/b>?","hint":"Five platforms are listed on the card. One wrong option sneaks in a platform that only appears in another technique.","options":[{"id":"A","text":"ESXi, Linux, Network Devices, Windows, macOS","why":"Correct — exactly the five platforms on the T1686 card; IaaS appears only on the T1686.001 sub-technique."},{"id":"B","text":"Windows, Linux, macOS, Containers, Network Devices","why":"Containers are not on the card; ESXi is missing though it is listed."},{"id":"C","text":"Windows, ESXi, IaaS, Network Devices, Linux","why":"IaaS belongs to sub-technique T1686.001, not to the parent card's platform list."},{"id":"D","text":"Windows, Linux, Network Devices, Android, ESXi","why":"Android is a Mobile matrix platform — not on this Enterprise technique."}],"correct":["A"],"explanation":"The T1686 card lists ESXi, Linux, Network Devices, Windows and macOS. The IaaS platform lives on the sub-technique page T1686.001 Cloud Firewall. Knowing exactly which platform list belongs to which card keeps scoping honest: you hunt the right logs on the right systems instead of inventing coverage.","study":"Open the T1686 card and read the platform line slowly; then check which platforms the sub-technique pages add."},{"id":"M14","type":"multi","title":"Telemetry for Windows firewall tampering","summary":"Select the sources analytic AN0406 actually uses","scenario":["You scope telemetry for the Windows part of detection strategy DET0145 (analytic AN0406). It monitors processes executing netsh, PowerShell Set-NetFirewallProfile, or sc stop mpssvc, and registry modifications under HKLM\\SYSTEM\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy."],"question":"Select <b>all<\/b> telemetry sources AN0406 needs on a Windows host.","hint":"Three sources map one-to-one to the behaviours named in the analytic; two others belong to different detections.","options":[{"id":"A","text":"Process creation with command line (netsh, PowerShell, sc)","why":"Correct — the analytic triggers on those exact processes and commands."},{"id":"B","text":"Windows registry key modification events","why":"Correct — FirewallPolicy registry writes are the silent path to the same goal."},{"id":"C","text":"Firewall service state change events (mpssvc)","why":"Correct — stopping the Windows Firewall service is one of the monitored behaviours."},{"id":"D","text":"DNS query logs from the host","why":"DNS shows name resolution, not firewall management — another detection's problem."},{"id":"E","text":"Web proxy access logs","why":"Proxy logs see HTTP requests; they never show a firewall profile changing."}],"correct":["A","B","C"],"explanation":"AN0406 is built on three behaviours, so it needs three matching sources: process-and-command telemetry (netsh, Set-NetFirewallProfile, sc stop mpssvc), registry modification telemetry under FirewallPolicy, and service state telemetry. DNS and proxy logs describe other traffic dimensions entirely — useful elsewhere, blind here. Coverage follows the behaviour list, not the other way round.","study":"For each analytic you own, write its required source list and verify each source actually ships to your SIEM."},{"id":"M15","type":"qcm","title":"The silent registry path","summary":"Why ZxShell preferred the registry over netsh","scenario":["The ZxShell backdoor disabled the firewall by modifying HKLM\\SYSTEM\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\StandardProfile, setting EnableFirewall to 0. A colleague asks why malware would write the registry instead of calling netsh.","Context: many EDR analytics in that era watched process behaviour — especially command-line tools — closely."],"question":"What did the registry path buy the malware author, compared with running netsh?","hint":"Compare what the defender sees: one path creates a visible process with a command line; the other does not.","options":[{"id":"A","text":"It changed the same setting without launching a netsh process, evading process-based detections.","why":"Correct — no netsh process, no command line to match; only registry telemetry would see it."},{"id":"B","text":"The registry change was permanent while netsh changes were not.","why":"Both persist equally; stealth, not persistence, was the gain."},{"id":"C","text":"The registry path worked without administrator rights.","why":"Writing HKLM firewall policy still needs high privileges — the gain was stealth."},{"id":"D","text":"Registry writes are faster than netsh, shortening the attack window measurably.","why":"Speed is irrelevant at this scale; the trade was about visibility."}],"correct":["A"],"explanation":"Both roads lead to the same goal — a profile switched off — but they leave different footprints. netsh appears as a process with a readable command line; a registry write only appears in registry telemetry. The attacker chose the path with fewer watchers. This is exactly why AN0406 monitors BOTH the process side and the registry side: kill the stealth advantage by covering both footprints.","study":"For every command you can name, ask: which non-process artefact achieves the same goal? Cover both in detection."},{"id":"M16","type":"multi","title":"BPFDoor redirect on a Linux host","summary":"Choose the TWO best next actions","scenario":["SOC night shift. A Linux host shows this iptables change, matching the BPFDoor procedure: packets from the attacker are redirected to a shell listening on a high TCP port.","The host is production and business-critical. You have session authority and five minutes of full attention before the queue pulls you away."],"artefacts":[{"label":"ARTEFACT 1 — auditd capture on the host","kind":"log","filter":true,"lines":["22:41:07 iptables -t nat -A PREROUTING -p tcp --dport 42391:43391 -j REDIRECT --to-ports 42424","22:41:07 process httpd (pid 3142) executed iptables as root","22:41:09 accepted tcp 198[.]51[.]100[.]24:51244 -> local 42424"]}],"question":"Select the <b>TWO<\/b> best next actions.","hint":"One action preserves proof, one identifies the actor. The tempting aggressive options both destroy or skip something.","options":[{"id":"A","text":"Capture the current iptables ruleset and the process tree before making changes","why":"Correct — the tampered ruleset and the httpd lineage are the case's core evidence."},{"id":"B","text":"Identify how the web process gained root and who drove it","why":"Correct — the redirect was run by httpd as root, so the privilege path is the investigation."},{"id":"C","text":"Flush all iptables rules immediately to cut the attacker off","why":"Flushing destroys the tampering evidence and may break legitimate rules; capture first."},{"id":"D","text":"Reboot the host to clear the in-memory shell","why":"A reboot wipes volatile state and the listening shell's context before anyone records it."}],"correct":["A","B"],"explanation":"The evidence hierarchy wins: the tampered ruleset and the process lineage (A) prove the T1686-family redirection, and the privilege question (B) explains how a web process ran iptables as root. Flushing (C) feels decisive but erases the artefact you need, and rebooting (D) destroys volatile memory around the shell. Capture, understand, then choose containment with full information.","study":"Adopt a personal rule: no flush, no reboot, no restore before capture. Write it into your runbook."}]};</script>
<script>

(function(){
'use strict';
var DATA=window.__EXAM_DATA__;
var META=DATA.meta, EXS=DATA.exercises;
var SEV=META.sev, SEVCLASS={easy:'sev-easy',medium:'sev-medium',hard:'sev-hard','extremely-hard':'sev-extreme'};
var SEVWORD={easy:'EASY',medium:'MEDIUM',hard:'HARD','extremely-hard':'EXTREMELY HARD'};
var SEVCOL={easy:'var(--sev-easy)',medium:'var(--sev-medium)',hard:'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'};
var TYPE_LABEL={qcm:'Multiple-choice question',multi:'Multi-select with partial credit',triage:'SOC alert-queue triage simulation',branch:'Branching incident-response decision',dragdrop:'Drag-and-drop sorting',order:'Timeline ordering',match:'Matching pairs',fill:'Fill-in-the-blank / report drafting',terminal:'Interactive terminal command',spot:'Spot the mistake'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clock(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
/* ---------------- state ---------------- */
var S={view:'intro',order:[],cur:0,phase:'idle',status:{},answers:{},credits:{},hintUsed:{},
 timer:{state:'ENDED',remaining:0,manualSec:0,autoSec:0,stamp:0},
 sum:0,answered:0,reviewMode:false,reported:false,perExLeft:0,
 user:{name:'',country:'',locale:''},pausePrev:null};
var TX=null; /* current exercise */
var tick=null;
var REDUCED=false;
try{REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){REDUCED=false;}
/* ---------------- timer state machine ---------------- */
function flushPause(){
 if(S.timer.stamp){var d=Math.round((Date.now()-S.timer.stamp)/1000);
  if(S.timer.state==='PAUSED_MANUAL')S.timer.manualSec+=d;
  else if(S.timer.state==='PAUSED_AUTO_CHECK')S.timer.autoSec+=d;
  S.timer.stamp=0;}
}
function tSet(next){
 var cur=S.timer.state;
 if(cur===next)return;
 if(cur==='RUNNING'){}else{flushPause();}
 S.timer.state=next;S.timer.stamp=0;
 if(next!=='RUNNING'&&next!=='ENDED')S.timer.stamp=Date.now();
 renderHeader();
}
function startTicker(){
 if(tick)return;
 tick=setInterval(function(){
  if(S.view==='results'||S.timer.state==='ENDED')return;
  if(S.timer.state==='RUNNING'){
   S.timer.remaining-=1;
   if(TX&&TX.perEx&&S.phase==='idle'&&S.view==='exam'){S.perExLeft=Math.max(0,S.perExLeft-1);renderPerEx();
    if(S.perExLeft===0){doCheck();return;}}
   if(S.timer.remaining<=0){S.timer.remaining=0;renderHeader();finishExam('timeout');return;}
   renderHeader();
  }
 },1000);
}
function startExam(retake){
 if(!retake){S.order=[];}
 S.order=shuffle(EXS.map(function(e,i){return i;}));
 /* keep terminal exercises non-adjacent */
 for(var i=1;i<S.order.length-1;i++){
  if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])||isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
 }
 S.cur=0;S.status={};S.answers={};S.credits={};S.hintUsed={};S.sum=0;S.answered=0;
 S.timer.remaining=META.timerSeconds;S.timer.manualSec=0;S.timer.autoSec=0;S.reported=false;
 S.phase='idle';S.reviewMode=false;S.perExLeft=0;
 tSet('RUNNING');
 S.view='exam';
 $('introView').classList.add('hidden');$('resultsView').classList.add('hidden');$('reviewView').classList.add('hidden');
 $('examView').classList.remove('hidden');$('progressWrap').classList.remove('hidden');
 renderCurrent();
 startTicker();
}
function isTerm(oi){return EXS[oi].type==='terminal';}
function resolvedCount(){var n=0;for(var k in S.status){if(S.status[k])n++;}return n;}
function updateProgress(){
 var tot=EXS.length,done=resolvedCount();
 var p=tot?Math.round(done/tot*100):0;
 var b=$('pbar');b.style.width=p+'%';b.style.background='linear-gradient(90deg,'+SEVCOL[SEV]+',var(--accent-blue))';
}
/* ---------------- header ---------------- */
function renderHeader(){
 $('hEx').textContent=(S.view==='exam')?('Exercise '+(S.cur+1)+' of '+EXS.length):(EXS.length+' exercises');
 var ts=$('hTstate'),st=S.timer.state;
 if(st==='RUNNING'){ts.className='tstate run';ts.textContent='\u25B6 RUNNING';}
 else if(st==='PAUSED_MANUAL'){ts.className='tstate pm';ts.textContent='\u23F8 PAUSED \u2014 manual (press Resume)';}
 else if(st==='PAUSED_AUTO_CHECK'){ts.className='tstate pa';ts.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)';}
 else{ts.className='tstate end';ts.textContent='\u25A0 ENDED';}
 $('hTimer').textContent=clock(Math.max(0,S.timer.remaining));
 var c=S.sum.toFixed(1),pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 $('hScore').innerHTML='<b>'+esc(c)+'</b> / '+S.answered+' \u00B7 '+pct+'%';
 $('btnPause').innerHTML=(st==='PAUSED_MANUAL')?'\u25B6 Resume':'\u23F8 Pause';
 $('hUser').textContent=S.user.name?('Analyst: '+S.user.name+(S.user.country&&S.user.country!=='ZZ'?' \u00B7 '+S.user.country:'')):'';
 updateProgress();
}
function renderPerEx(){
 var el=$('perExChip');if(!el)return;
 el.textContent='\u23F1 Exercise timer: '+clock(S.perExLeft)+' remaining (stops when the main timer pauses)';
 el.classList.toggle('hidden',!(TX&&TX.perEx&&S.phase==='idle'));
}
/* ---------------- rendering helpers ---------------- */
var LOGRX=/(20\d\d-\d\d-\d\d[T ]\d\d:\d\d:\d\d(?:Z)?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}(?:\/\d{1,2})?\b)|("(?:[^"\\]|\\.)*")|(\b(?:allow|allowed|deny|denied|drop|dropped|reject|blocked|block|disabled|disable|enabled|enable|deleted|delete|flush|flushed|permit|failed|success|modified|created|error|critical|warning|state|profiles?|rules?)\b)|(\b\d{2,6}\b)/gi;
function hlLog(line){
 var e=esc(line);
 e=e.replace(LOGRX,function(m,ts,ip,str,kw,num){
  if(ts)return '<span class="ts">'+ts+'</span>';
  if(ip)return '<span class="ip">'+ip+'</span>';
  if(str)return '<span class="str">'+str+'</span>';
  if(kw)return '<span class="kw">'+kw+'</span>';

  ex.options.forEach(function(o){
   var inC=C.indexOf(o.id)>=0,inS=sel.indexOf(o.id)>=0;
   if(inC&&inS){hit++;add(o.text,'ok',o.why||'');}
   else if(inC&&!inS){add(o.text,'miss',o.why||'');}
   else if(!inC&&inS){bad++;add(o.text,'bad',o.why||'This option does not belong in the correct answer.');}

  N=ex.alerts.length;

   var albl=byId(ex.actions,c).label;
   if(g===c){H++;add(a.id+' \u2192 '+albl,'ok',a.why||'');}
   else if(g){W++;add(a.id+' \u2192 '+byId(ex.actions,g).label,'bad',a.why||'');}
   else{add(a.id+' \u2192 '+albl,'miss',a.why||'');}});
 }else if(t==='branch'){
  N=ex.steps.length;
  ex.steps.forEach(function(s,i){var g=ans[i];
   var cl=byId(s.options,s.correct).text;
   if(g===s.correct){H++;add('Step '+(i+1)+': '+cl,'ok',s.why||'');}
   else if(g){W++;add('Step '+(i+1)+': '+byId(s.options,g).text,'bad',s.why||'');}
   else{add('Step '+(i+1)+': '+cl,'miss',s.why||'');}});
 }else if(t==='dragdrop'||t==='match'){
  N=ex.items.length;
  ex.items.forEach(function(it){var c=ex.correct[it.id],g=ans[it.id];
   var cl=byId(ex.slots,c).label;
   if(g===c){H++;add(it.label+' \u2192 '+cl,'ok',it.why||'');}
   else if(g){W++;add(it.label+' \u2192 '+byId(ex.slots,g).label,'bad',it.why||'');}
   else{add(it.label+' \u2192 '+cl,'miss',it.why||'');}});
 }else if(t==='order'){
  N=ex.correct.length;
  ex.correct.forEach(function(cid,i){var g=ans[i];
   var cl=byId(ex.items,cid).label;
   if(g===cid){H++;add('Position '+(i+1)+': '+cl,'ok',(ex.why||[])[i]||'');}
   else if(g){W++;add('Position '+(i+1)+': '+byId(ex.items,g).label,'bad',(ex.why||[])[i]||'');}
   else{add('Position '+(i+1)+': '+cl,'miss',(ex.why||[])[i]||'');}});
 }else if(t==='fill'){
  N=ex.blanks.length;
  ex.blanks.forEach(function(b){var g=ans[b.id];
   if(g===b.correct){H++;add('Blank '+b.id+': '+b.correct,'ok',b.why||'');}
   else if(g){W++;add('Blank '+b.id+': '+g,'bad',b.why||'');}
   else{add('Blank '+b.id+': '+b.correct,'miss',b.why||'');}});

   else{add(lbl,'miss',(ex.lineWhy||{})[lid]||'');}});

 }

 S.phase='idle';S.perExLeft=TX.perEx||0;
 var h='';
 if(S.reviewMode)h+='<div class="card" style="border-color:var(--state-skipped)"><span style="color:var(--state-skipped);font-weight:700">\u26A0 Skipped exercise \u2014 you are back in review mode.</span></div>';
 h+=scenHtml(TX);
 h+='<section class="card blk blk-question"><div class="blk-h"><span class="ic">\u2753</span> QUESTION</div><div class="blk-b"><p class="q-text">'+TX.question+'</p></div></section>';
 h+='<section class="card blk blk-answer"><div class="blk-h"><span class="ic">\u270D\uFE0F</span> YOUR ANSWER</div><div class="blk-b" id="answerArea"></div></section>';
 h+='<div id="perExChip" class="step-chip hidden" style="margin-top:14px"></div>';
 h+='<div id="hintArea"></div><div id="fbArea"></div>';
 h+='<div class="btn-row"><button type="button" class="btn btn-check" id="btnCheck">\u2713 Check</button><button type="button" class="btn btn-danger" id="btnSkip2">\u23ED Skip</button><button type="button" class="btn btn-next hidden" id="btnNext">\u2192 Next</button></div>';
 $('examView').innerHTML=h;
 var area=$('answerArea');
 widget=W[TX.type](TX,area);
 $('colBtn').addEventListener('click',function(){var s=$('blkScen');s.classList.toggle('collapsed');
  this.textContent=s.classList.contains('collapsed')?'\u25B8 Expand':'\u25BE Collapse';});
 $('btnCheck').addEventListener('click',doCheck);
 $('btnSkip2').addEventListener('click',doSkip);
 $('btnNext').addEventListener('click',doNext);
 if(TX.perEx)renderPerEx();
 $('btnHint').disabled=false;
 (TX.artefacts||[]).forEach(function(a,i){
  if(a.kind==='log'&&a.filter){
   var fl=document.querySelector('[data-art="'+i+'"]');
   if(fl)fl.addEventListener('input',function(){
    var q=fl.value.toLowerCase();
    document.querySelectorAll('#art'+i+' .ln').forEach(function(ln){
     ln.classList.toggle('hide',q!==''&&ln.textContent.toLowerCase().indexOf(q)<0);});
   });
  }});
 renderHeader();
}
function doCheck(){
 if(S.phase!=='idle')return;
 var ans=widget.get();
 tSet('PAUSED_AUTO_CHECK'); /* Check-triggered auto-pause, before feedback renders */
 S.phase='checked';
 var g=grade(TX,ans);
 S.answers[TX.id]=ans;S.credits[TX.id]=g.credit;
 if(S.status[TX.id]!=='answered'){S.status[TX.id]='answered';S.sum+=g.credit;S.answered++;}
 markAnswerState(TX,ans);
 var ctrls=$('answerArea').querySelectorAll('input,select,button');
 for(var ci=0;ci<ctrls.length;ci++)ctrls[ci].disabled=true;
 renderFeedback(TX,g);
 $('btnCheck').disabled=true;$('btnSkip2').disabled=true;$('btnHint').disabled=true;
 var nb=$('btnNext');nb.classList.remove('hidden');
 var isLastQueued=(S.cur>=S.order.length-1);
 nb.textContent=S.reviewMode?'\u2192 Back to review':(isLastQueued?'\u2713 Final Submit':'\u2192 Next');
 renderPerEx();renderHeader();
}
function markAnswerState(ex,ans){
 var i,el,all;
 if(ex.type==='qcm'||ex.type==='multi'){
  all=$('answerArea').querySelectorAll('.opt');
  for(i=0;i<all.length;i++){el=all[i];var oid=el.getAttribute('data-oid');
   var inC=ex.correct.indexOf(oid)>=0,inS=ans.indexOf(oid)>=0;
   if(inC){el.insertAdjacentHTML('beforeend','<span class="mk ok">\u2713 Correct</span>');}
   else if(inS){el.insertAdjacentHTML('beforeend','<span class="mk bad">\u2717 Wrong</span>');}}}
 else if(ex.type==='fill'){
  all=$('answerArea').querySelectorAll('select.blank');
  for(i=0;i<all.length;i++){el=all[i];var b=byId(ex.blanks,el.getAttribute('data-bid'));
   if(el.value===b.correct)el.classList.add('ok');else if(el.value)el.classList.add('bad');}}
 else if(ex.type==='spot'){
  all=$('answerArea').querySelectorAll('.optline');
  for(i=0;i<all.length;i++){el=all[i];var lid=el.getAttribute('data-lid');
   if(ex.correct.indexOf(lid)>=0)el.style.outline='2px solid var(--state-correct)';
   else if(ans.indexOf(lid)>=0)el.style.outline='2px solid var(--state-incorrect)';}}
}
function doSkip(){
 if(S.phase!=='idle')return;
 S.status[TX.id]='skipped';
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function doNext(){
 if(S.phase!=='checked')return;
 tSet('RUNNING');
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function advance(){
 if(S.cur>=S.order.length-1){showReview();return;}
 S.cur++;renderCurrent();
}
/* ---------------- review skipped ---------------- */
function showReview(){
 var pending=[];
 S.order.forEach(function(oi,i){var ex=EXS[oi];if(S.status[ex.id]!=='answered'){pending.push({i:i,ex:ex});}});
 var unansweredSkipped=pending.filter(function(p){return S.status[p.ex.id]==='skipped';});
 if(S.timer.remaining<=0||S.timer.state==='ENDED'){finishExam(S.answered>0?'timeout':'timeout');return;}
 if(pending.length===0){finishExam('submit');return;}
 S.view='review';
 $('examView').classList.add('hidden');$('reviewView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:var(--state-skipped)"><span class="ic">\u26A0\uFE0F</span> REVIEW SKIPPED EXERCISES</div><div class="blk-b">';
 h+='<p class="body">You have '+pending.length+' exercise(s) without a final answer. You can go back to any of them while the timer is running, or submit now. Skipped exercises that are never answered are <b>excluded</b> from the score \u2014 they count as neither correct nor wrong.</p>';
 h+='<div class="sk-list">';
 pending.forEach(function(p){
  h+='<div class="sk-row"><span class="sk-ico">\u26A0 Skipped</span><span class="sk-t"><span class="n">'+esc(p.ex.title)+'</span><br><span class="d">'+esc(p.ex.summary||'')+'</span></span><button type="button" class="btn" data-res="'+p.i+'">\u2192 Resume this exercise</button></div>';});
 h+='</div><div class="btn-row"><button type="button" class="btn btn-primary btn-big" id="btnFinalSubmit">\u2713 Submit final results</button></div>';
 h+='</div></section>';
 $('reviewView').innerHTML=h;
 $('reviewView').querySelectorAll('[data-res]').forEach(function(b){
  b.addEventListener('click',function(){
   S.cur=parseInt(b.getAttribute('data-res'),10);S.reviewMode=true;S.view='exam';
   $('reviewView').classList.add('hidden');$('examView').classList.remove('hidden');
   renderCurrent();});});
 $('btnFinalSubmit').addEventListener('click',function(){finishExam('submit');});
 renderHeader();
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex,g){
 var cl,word,ico;
 if(g.credit>=1){cl='fb-correct';word='CORRECT';ico='\u2714';}
 else if(g.credit>0){cl='fb-partial';word='PARTIALLY CORRECT';ico='\u2714';}
 else{cl='fb-incorrect';word='INCORRECT';ico='\u2716';}
 var h='<section class="fb '+cl+'" id="fbBlock"><div class="fb-h"><span>'+ico+'</span> '+word;
 if(g.N>1)h+=' <span class="credit">\u2014 '+Math.round(g.H)+'/'+g.N+' items, credit '+g.credit.toFixed(2)+'</span>';
 h+='</div><div class="fb-b">';
 if(g.dangerous)h+='<div class="study" style="border-color:var(--state-incorrect);background:var(--tint-red-08)"><b style="color:var(--state-incorrect)">\u2717 DANGEROUS \u2014 NEAR MISS:</b> '+esc((ex.terminal&&ex.terminal.dangerousMsg)||'That command would have changed state or destroyed evidence.')+'</div>';
 if(ex.type==='terminal'){
  var t=ex.terminal;
  h+='<div class="canon"><div class="t">Canonical command (you can copy it):</div><pre class="code mono">'+hlCode(t.expected)+'</pre></div>';
  /* per-element breakdown from the graded items: what you got right, missed, or got wrong */
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span><b>'+esc(it.label)+'</b>'+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
  if(t.dangerNote)h+='<div class="study">'+t.dangerNote+'</div>';
 }else if(g.items.length){
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span>'+esc(it.label)+'<span class="why">'+esc(it.why)+'</span></span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
 }
 h+='<p class="body" style="margin-top:12px">'+ex.explanation+'</p>';
 if(ex.perspective){
  h+='<div class="persp">';
  if(ex.perspective.attacker)h+='<div class="red"><b>\u2694 Attacker view:</b> '+ex.perspective.attacker+'</div>';
  if(ex.perspective.defender)h+='<div class="blue"><b>\u{1F6E1} Defender view:</b> '+ex.perspective.defender+'</div>';
  h+='</div>';
 }
 if(g.credit<1&&ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></section>';
 $('fbArea').innerHTML=h;
 var fb=$('fbBlock');if(fb)fb.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
}
/* ---------------- results ---------------- */
function finishExam(reason){
 flushPause();tSet('ENDED');
 var byIdc={ok:0,part:0,bad:0},partSum=0,skippedList=[];
 EXS.forEach(function(ex){
  var st=S.status[ex.id];
  if(st==='answered'){var c=S.credits[ex.id]||0;
   if(c>=1)byIdc.ok++;else if(c>0){byIdc.part++;partSum+=c;}else byIdc.bad++;}
  else{skippedList.push(ex);}
 });
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var passed=pct>=70&&S.answered>0;
 S.view='results';
 $('examView').classList.add('hidden');$('reviewView').classList.add('hidden');$('resultsView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:'+SEVCOL[SEV]+'"><span class="ic">\u{1F4CA}</span> RESULTS \u2014 '+esc(META.title)+'</div><div class="blk-b">';
 h+='<div class="res-head"><div><div class="res-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div><div style="color:var(--text-secondary)">final score \u00B7 '+S.sum.toFixed(1)+' credits / '+S.answered+' answered</div></div></div>';
 h+='<div class="res-grid">';
 h+='<div class="res-cell ok"><div class="rc-ico">\u2714 Fully correct</div><div class="rc-n">'+byIdc.ok+'</div><div class="rc-l">exercises with credit 1.0</div></div>';
 h+='<div class="res-cell part"><div class="rc-ico">\u2714 Partially correct</div><div class="rc-n">'+byIdc.part+'</div><div class="rc-l">'+(byIdc.part?('avg credit '+(partSum/byIdc.part).toFixed(2)):'no partial answers')+'</div></div>';
 h+='<div class="res-cell bad"><div class="rc-ico">\u2716 Fully incorrect</div><div class="rc-n">'+byIdc.bad+'</div><div class="rc-l">credit 0.0</div></div>';
 h+='<div class="res-cell skip"><div class="rc-ico">\u26A0 Skipped \u2014 excluded</div><div class="rc-n">'+skippedList.length+'</div><div class="rc-l">not counted in numerator or denominator</div></div>';
 h+='</div>';
 if(skippedList.length){h+='<p class="body" style="margin-top:12px;color:var(--state-skipped)">\u26A0 Excluded (never answered): '+skippedList.map(function(e){return esc(e.title);}).join(' \u00B7 ')+'</p>';}
 h+='<div class="time-report">Time report \u2014 timer budget: <b>'+Math.round(META.timerSeconds/60)+' min</b> \u00B7 time left: <b>'+clock(S.timer.remaining)+'</b> \u00B7 paused manually: <b>'+clock(S.timer.manualSec)+'</b> \u00B7 paused for feedback review: <b>'+clock(S.timer.autoSec)+'</b> \u00B7 ended by: <b>'+(reason==='timeout'?'timer reached 00:00':'you pressed Submit')+'</b></div>';
 if(passed){
  h+='<div class="cert"><div class="c-big">\u2714 PASS \u2014 Certified: '+esc(META.title)+'</div><div class="c-sub">You reached '+pct+'%, above the 70% pass mark. Strong work: you can read, recognise and respond to this ATT&amp;CK object like a working analyst.</div></div>';
 }else{
  h+='<div class="cert fail"><div class="c-big">\u2716 FAIL \u2014 '+pct+'% (pass mark 70%)</div><div class="c-sub">Not this time. Re-read the intro notes, review the feedback from each exercise, and try again \u2014 every retake reshuffles questions and options.</div></div>';
 }
 h+='<div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnRetake">\u21BB Retake Exam</button></div>';
 h+='</div></section>';
 $('resultsView').innerHTML=h;
 var rb=$('btnRetake');
 if(rb)rb.addEventListener('click',function(){startExam(true);});
 reportScore(S.sum,S.answered,pct,passed);
 renderHeader();
}
function reportScore(creditSum,answeredCount,percent,passed){
 if(S.reported)return;S.reported=true;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
 var d=event.data;if(!d)return;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 S.user={name:d.username||'',country:d.country||'',locale:d.locale||''};
 /* theme field is always 'dark'; this file is dark-only by contract, nothing toggles */
 renderHeader();
});
/* ---------------- pause / hint ---------------- */
function togglePause(){
 if(S.view==='results')return;
 if(S.timer.state==='PAUSED_MANUAL'){
  tSet(S.pausePrev||'RUNNING');S.pausePrev=null;
  var m=$('pauseMask');if(m)m.remove();
 }else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.pausePrev=S.timer.state;tSet('PAUSED_MANUAL');
  var d=document.createElement('div');d.id='pauseMask';d.className='pausemask';
  d.innerHTML='<div class="inner"><div style="font-size:44px">\u23F8</div><div class="big">PAUSED \u2014 manual</div><div class="sub">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</div><div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnResume">\u25B6 Resume</button></div></div>';
  document.body.appendChild(d);
  $('btnResume').addEventListener('click',togglePause);
 }
}
$('btnPause').addEventListener('click',togglePause);
$('btnHint').addEventListener('click',function(){
 if(S.view!=='exam'||S.phase!=='idle'||!TX)return;
 if(S.hintUsed[TX.id])return;
 S.hintUsed[TX.id]=true;
 $('hintArea').innerHTML='<div class="hint-panel"><span class="h-ico">\u{1F4A1} Hint (\u221210% of this exercise\u2019s credit):</span>'+TX.hint+'</div>';
 $('btnHint').disabled=true;});
$('btnSkip').addEventListener('click',function(){if(S.view==='exam'&&S.phase==='idle')doSkip();});
/* ---------------- intro ---------------- */
function renderIntro(){
 $('hSev').textContent=SEVWORD[SEV];
 $('hSev').className='badge '+SEVCLASS[SEV];
 $('introView').innerHTML=DATA.introHtml;
 $('btnStart').addEventListener('click',function(){startExam(false);});
 renderHeader();
}
renderIntro();
})();

</script>
</body>
</html>
