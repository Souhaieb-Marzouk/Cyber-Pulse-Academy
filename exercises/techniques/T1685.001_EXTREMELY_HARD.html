<script>
var EXAM = {"meta": {"title": "T1685.001 Disable or Modify Windows Event Log — EXTREMELY HARD", "objectId": "T1685.001", "objectName": "Disable or Modify Windows Event Log", "objectType": "Sub-Technique", "tactic": "Defense Impairment (TA0112)", "platform": "Windows", "sevClass": "sev-extreme", "sevIcon": "🔴", "sevWord": "EXTREMELY HARD", "estimatedMinutes": 80, "timerSeconds": 4800, "passMark": 70, "topicId": "t1685.001", "batch": 4}, "intro": {"learn": "\n<p class=\"lead\">This is the <b>EXTREMELY HARD<\/b> exam for <b>T1685.001 — Disable or Modify Windows Event Log<\/b>. Every exercise chains three or more concepts, and at least one signal in each scenario will <b>contradict<\/b> another. You are working at senior-incident level: the questions arrive as stakeholder demands, the artefacts contain noise and gaps, and the correct answer sometimes costs real money or says “wait”.<\/p>\n<p>The object, stated once more in plain words: an attacker with sufficient privileges disables or modifies the <b>Windows Event Log<\/b> — the system's note-taking — so that defenders see less. In ATT&amp;CK this is Sub-Technique <b>T1685.001<\/b>, child of <b>T1685 — Disable or Modify Tools<\/b>, serving the <b>Defense Impairment<\/b> tactic (<b>TA0112<\/b>). At this level the technique never appears alone: it rides ahead of credential theft, lateral movement or staging, and it leaves a chain — a service write, a channel flag, an AutoLogger key, a missing window — that you must read <i>across<\/i> sources that do not always agree.<\/p>\n<p>The running scenario is a hospital network: <b>St Aldric Regional Hospital<\/b>, two domain controllers, a patient-facing application server, and a security operations team of six. A domain controller's Security channel has gone dark at 02:14 while the health dashboard insists everything is fine. Legal is engaged. The CISO needs decisions at fixed times. The detection strategy <b>DET0187<\/b> and its analytic <b>AN0535<\/b> were tuned down months ago and must be argued back. Every exercise mirrors a real senior decision: bounding a blind spot with incomplete telemetry, choosing containment that a hospital can actually absorb, deciding what to preserve before anyone reboots anything, and restoring visibility in an order that keeps the evidence intact. The roles you step into or brief are the ones this object touches daily: the <b>SOC analyst<\/b> on the queue, the <b>threat hunter<\/b> sweeping the estate, the <b>incident responder<\/b> running preservation, the <b>CTI analyst<\/b> framing the actor, the <b>red teamer<\/b> whose authorised tests must respect the same controls, the <b>detection engineer<\/b> rebuilding the analytic, and the <b>GRC analyst<\/b> and <b>control owner<\/b> who turn the lesson into policy.<\/p>\n<p>Take the time the Check button gives you. The explanations at this level carry the reasoning of the whole chain — including why the almost-right options fail only <i>here<\/i>.<\/p>\n", "keywords": [{"theme": "Chained evidence and conflicting signals", "items": ["A running service with a disabled <code>Start<\/code> value — the change bites at boot, not now", "A dark local channel while the SIEM still shows events — forwarded telemetry versus local truth", "The health dashboard's word “HEALTHY” versus captured channel config <code>enabled: false<\/code>"]}, {"theme": "Boot-time tampering: the AutoLogger layer", "items": ["<code>HKLM\\SYSTEM\\CurrentControlSet\\Control\\WMI\\Autologger\\EventLog-System|EventLog-Security\\Start<\/code> — whether channels start with the system", "<b>Sysmon 13<\/b> (SetValue) and <b>Sysmon 14<\/b> (key rename) as the artefacts of AutoLogger impairment", "Look-alikes: other products' autologgers (telemetry, diagnostics) disabled for legitimate reasons"]}, {"theme": "Compensating telemetry when channels die", "items": ["What dies with the channel: Security 4688, System 7036, PowerShell 4104", "What survives: Sysmon's own channel, EDR agent telemetry, network sensors, application logs such as IIS"]}, {"theme": "Senior response decisions under pressure", "items": ["Isolation of a live domain controller during hospital admissions — the costed decision", "Evidence preservation before restore: freeze → capture volatile → seal .evtx → then restore", "Chain of custody: who signs, what is hashed, when reimage becomes legal"]}, {"theme": "Detection tuning and coverage gaps", "items": ["AN0535 variants: default, allowlisted, AutoLogger-watching, change-window suppressed", "Mitigation coverage: which controls actually blunt the observed path (<b>M1024<\/b>, <b>M1018<\/b>, <b>M1022<\/b>, <b>M1047<\/b>) and which only sound relevant"]}, {"theme": "What the silence buys the attacker", "items": ["Kill-chain positioning after Defense Impairment: Credential Access (<b>TA0006<\/b>), Lateral Movement (<b>TA0008<\/b>), Collection (<b>TA0009<\/b>), Exfiltration (<b>TA0010<\/b>)"]}], "how": "\n<ul class=\"howlist\">\n<li><b>Goal:<\/b> reach at least <b>70%<\/b>. That is a <span class=\"ok-i\">✓ PASS<\/span>. Below it is a <span class=\"err-i\">✗ FAIL<\/span>, and you can retake the exam.<\/li>\n<li><b>17 exercises at EXTREMELY HARD level.<\/b> Each chains 3+ concepts with at least one ambiguous or conflicting signal to resolve explicitly. Scenarios contain realistic noise and incomplete information; several correct-looking options are right in some other hospital, not this one. At least one answer is “gather more evidence” or “escalate” — take that seriously when you see it. Types: log triage, branching decisions, multi-select evidence, compensating-telemetry maps, CISO memo drafting, coverage sorting, priority ranking, one terminal command executed under a closing change window. The blocks <b style=\"color:var(--accent-blue)\">SCENARIO<\/b>, <b style=\"color:var(--accent-amber)\">QUESTION<\/b> and <b style=\"color:var(--accent-green)\">YOUR ANSWER<\/b> keep their fixed order.<\/li>\n<li><b>Timer:<\/b> this exam gives you <b>80 minutes<\/b>. <b>⏸ Pause<\/b> hides the exercise for a genuine break. <b>✓ Check<\/b> stops the timer automatically while you study the feedback; it resumes only on <b>Next ▶<\/b>. The header always shows which pause is active.<\/li>\n<li><b>Partial credit:<\/b> every multi-item exercise scores <code>max(0, (H − W) / N)<\/code> per item. The terminal command is graded element by element, and destructive near-misses are marked <b>DANGEROUS<\/b> in the feedback — read them even when you passed.<\/li>\n<li><b>Hint:<\/b> 💡 costs 10% of the exercise's credit; at this level it only restates a constraint you may have missed — it never names the answer.<\/li>\n<li><b>Skip:<\/b> ⚠ Skip parks an exercise in a pool you can revisit while time remains; never-answered exercises are excluded from the score.<\/li>\n<li>Press <b>Start<\/b> when ready. Read the artefacts against each other before reading the options.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "x01", "type": "logs", "tag": "The dashboard says HEALTHY", "summary": "STAH-DC01 stream — click every line that proves the impairment persists across reboots while the service shows running", "scenario": [{"prose": "06:55 handover at St Aldric Regional Hospital. The monitoring dashboard's 09:00 check marks <b>STAH-DC01<\/b> “EventLog service: RUNNING — logging HEALTHY”. The night's consolidated stream for that host is below, mixing Windows channels, Sysmon and one manual config capture. The morning's question is precise: which lines <i>together<\/i> prove that logging impairment will <b>persist across reboots<\/b>, dashboard notwithstanding?"}], "question": "Click every line that proves the logging impairment will persist across reboots.", "hint": "The service state today is not the question. Which writes change what happens at boot — and what did the manual capture see?", "logs": {"prompt": "Click every line that proves boot-persistent impairment, then press Check.", "lines": [{"h": "<span class='hl-num'>04:58:12<\/span> System 6005  The Event log service was started. <span class='hl-dim'>(routine boot)<\/span>"}, {"h": "<span class='hl-num'>06:40:02<\/span> Sysmon 13  SetValue  <span class='hl-pth'>Services\\EventLog\\Start<\/span> → <span class='hl-err'>4<\/span>"}, {"h": "<span class='hl-num'>06:41:33<\/span> Sysmon 13  SetValue  <span class='hl-pth'>Control\\WMI\\Autologger\\EventLog-Security\\Start<\/span> → <span class='hl-err'>0<\/span>"}, {"h": "<span class='hl-num'>07:02:44<\/span> System 7035  The <span class='hl-dim'>Spooler<\/span> service entered the stopped state (planned)."}, {"h": "<span class='hl-num'>07:15:09<\/span> Security 4624  An account successfully logged on.  <span class='hl-dim'>STAH\\adm.field<\/span>"}, {"h": "<span class='hl-num'>08:03:31<\/span> Sysmon 1   ProcessCreate  <span class='hl-dim'>wscript.exe scripts\\update.vbs<\/span> (routine)"}, {"h": "<span class='hl-num'>09:00:00<\/span> Dashboard  Health check: EventLog service RUNNING — logging marked <span class='hl-ok'>HEALTHY<\/span>"}, {"h": "<span class='hl-num'>09:12:40<\/span> Config capture (<span class='hl-cmd'>wevtutil sl Security<\/span>): <span class='hl-err'>enabled: false<\/span>"}, {"h": "<span class='hl-num'>09:30:11<\/span> System 7036  The Spooler service entered the running state."}, {"h": "<span class='hl-num'>10:05:17<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Control\\WMI\\Autologger\\Diagtrack-Listener\\Start<\/span> → 0"}, {"h": "<span class='hl-num'>10:44:55<\/span> Security 4688  A new process has been created. <span class='hl-dim'>(routine)<\/span>"}, {"h": "<span class='hl-num'>11:02:03<\/span> Sysmon 13  SetValue  <span class='hl-dim'>...\\CurrentVersion\\Run\\OneDriveStub<\/span>"}], "needles": [1, 2, 7]}, "explain": "Three lines carry the proof. The <code>Start → 4<\/code> write (line 2) pins the EventLog service itself to disabled at the next boot — the dashboard's RUNNING is simply the state <i>before<\/i> the bomb goes off. The AutoLogger <code>EventLog-Security → 0<\/code> write (line 3) stops the Security channel from starting with the system, a second, deeper boot-time impairment that survives even a service repair. And the manual capture at 09:12 (line 8) shows the channel's live configuration <code>enabled: false<\/code> — direct config-level proof that contradicts the dashboard. Everything else is the noise a senior must dismiss: the routine boot message, a Spooler stop/start pair, logons, a script, the Diagtrack autologger (a telemetry product, not an event channel), and registry churn. The conflict resolution the question demands: a service-state dashboard check proves <i>the present<\/i>; boot-time configuration writes and captured channel config prove <i>the future<\/i> — and the future is what the incident owner must fix.", "study": "Compare your monitoring's health checks against boot-time configuration state — which one would have caught this?"}, {"id": "x02", "type": "branch", "tag": "Forwarded, but from where?", "summary": "SIEM still shows STAH-DC01 events after 02:14 — resolve the conflict in four steps", "scenario": [{"prose": "The conflict: STAH-DC01's local Security channel died at 02:14, yet the SIEM still displays Security-channel events tagged STAH-DC01. Counsel needs a defensible statement of what is true. Work the four steps; intermediate steps continue the story, and the final Check grades the whole chain."}], "question": "Choose the best action at each of the four steps.", "hint": "Collector metadata is independent of what the event says about itself. And the hospital keeps running while you decide.", "branch": {"steps": [{"label": "STEP 1 OF 4 — Resolve the conflict", "scen": [{"label": "Two explanations on the table", "html": "<p>(a) The events are real but forwarded from <b>STAH-DC02<\/b> with a mislabelled host field. (b) The local channel never died and the 02:14 evidence is wrong.<\/p>"}], "options": [{"k": "A", "t": "Compare the SIEM events' collector agent IDs and asset records against the raw feed for the 02:14 window."}, {"k": "B", "t": "Assume the attacker spoofed the host field in the events themselves."}, {"k": "C", "t": "Restart forwarding on both domain controllers and see what changes."}], "correct": "A"}, {"label": "STEP 2 OF 4 — What the raw feed shows", "scen": [{"label": "Raw collector feed", "html": "<p>Events tagged “STAH-DC01” carry <b>STAH-DC02's<\/b> agent ID. The events continue without a break after 02:14. No events from the real STAH-DC01 agent since 02:14:07.<\/p>"}], "options": [{"k": "A", "t": "Conclude: the visible events are DC02 mislabelled; DC01's local Security channel is genuinely dark since 02:14:07."}, {"k": "B", "t": "Conclude: DC01's channel is fine — someone edited SIEM tags to fake a story."}, {"k": "C", "t": "Conclude: the attacker is replaying old events into the pipe."}], "correct": "A"}, {"label": "STEP 3 OF 4 — Bounding the blind spot", "scen": [{"label": "Counsel's demand", "html": "<p>Counsel wants the blind spot bounded. Constraint: <b>STAH-DC01 has no Sysmon<\/b>, and its EDR was deployed last week — coverage exists but the start of attacker activity has no direct artefact.<\/p>"}], "options": [{"k": "A", "t": "Bound it as 02:14:07 → now with stated lower confidence, and mark DC01 telemetry as degraded in the record."}, {"k": "B", "t": "State the exact timestamp 02:14:07 as the start of attacker activity with full confidence."}, {"k": "C", "t": "Tell counsel there is no usable evidence at all."}], "correct": "A"}, {"label": "STEP 4 OF 4 — The 12:00 isolation decision", "scen": [{"label": "CISO meeting, 11:55", "html": "<p>Morning admissions peak runs until 13:00. Authentication currently fails over to DC02 without visible errors. The account that ran the tamper commands is already suspended.<\/p>"}], "options": [{"k": "A", "t": "Keep DC01 serving, block and watch the suspect patterns, and put the isolation decision to a 13:05 review with costed options."}, {"k": "B", "t": "Isolate DC01 immediately — a domain controller with dark logging must come off the network at once."}, {"k": "C", "t": "Do nothing further; the account is suspended, so the case is effectively closed."}], "correct": "A"}]}, "explain": "Step 1 resolves the conflict with metadata, not opinion: agent IDs belong to the collector infrastructure and are not carried in the events an attacker can touch. Step 2 accepts the simplest conclusion the evidence supports — mislabelling plus a genuinely dark channel — instead of inventing spoofing or replay. Step 3 is the legal discipline: state what the artefacts bound (channel dark from 02:14:07), state what they cannot (the true start of attacker activity, given no Sysmon), and mark confidence explicitly; overclaiming a timestamp or declaring “no evidence” both destroy credibility. Step 4 is the costed decision the hospital can absorb: DC01 keeps serving during admissions, the suspect patterns are blocked and watched, and isolation goes to review with real costs attached — because an immediate isolation is defensible in a bank, but here it risks patient-facing disruption for containment value the suspended account no longer requires. Escalation with evidence beats reflex.", "study": "Draft the two-paragraph counsel statement: what is bounded, what is not, and why."}, {"id": "x03", "type": "multi", "tag": "What the chain supports", "summary": "Select every conclusion the chained evidence actually supports", "scenario": [{"label": "Evidence chain — STAH-DC01", "html": "<div class='codeblock'>02:14:07  Sysmon 1   wevtutil sl Security /e:false   (admin session)\n06:40:02  Sysmon 13  Services\\EventLog\\Start → 4\n06:41:33  Sysmon 13  Autologger\\EventLog-Security\\Start → 0\n09:12:40  Config capture: Security channel enabled: false\nAll day   EDR healthy; STAH-DC02 unaffected; no 1102 anywhere<\/div>"}, {"label": "ARTEFACT 2 — Coverage note from the platform team (incomplete)", "html": "<p>EDR coverage: DCs <b>partial<\/b> — STAH-DC01 agent deployed last week, version inventory <i>not yet reconciled<\/i>. Sysmon: <i>not deployed on any DC<\/i> (project pending). Ticket SYS-4471 (“ship Sysmon to DCs”) last touched in February. Unrelated noise in the same shift: one DHCP scope failure on STAH-DHCP-03, resolved 04:10.<\/p>"}, {"prose": "The CISO asks what has actually been <b>established<\/b> before the 13:05 review. Select every conclusion the chain supports — no fear, no hope, just the evidence."}], "question": "Select every conclusion the evidence chain supports.", "hint": "Separate what the artefacts prove from what you fear. One option claims clearing happened — check whether any artefact in the chain shows it.", "multi": {"options": [{"k": "A", "t": "The local Security channel has been dark since at least 02:14:07 and is still off."}, {"k": "B", "t": "EDR telemetry remains as partial compensating visibility."}, {"k": "C", "t": "The impairment is configured to persist across reboots at two layers."}, {"k": "D", "t": "The attacker has left the environment."}, {"k": "E", "t": "All hospital logging is gone estate-wide."}, {"k": "F", "t": "The audit log was also cleared, because attackers always clear after disabling."}], "correct": ["A", "B", "C"]}, "explain": "Supported: A — the disable command, the config capture and the absence of any local events since 02:14:07 establish the channel is dark and has been. B — the EDR agent is explicitly healthy and independent of the channel, so its telemetry remains, partial but real. C — the <code>Start=4<\/code> service write and the AutoLogger <code>→ 0<\/code> write are two distinct boot-persistent mechanisms. Not supported: D is hope in the wrong direction — nothing in the chain shows departure, and assumption is how incidents reopen. E is refuted directly: DC02 is unaffected. F is the seductive one: the chain contains <b>no 1102<\/b> and no clearing command; attackers who disable do not always clear, and writing “cleared” into the record without the artefact would hand the defence a credibility problem later. The discipline: conclusions are lists of artefact-backed facts, nothing else.", "study": "Rewrite your last incident summary listing only artefact-backed claims — note what you had to delete."}, {"id": "x04", "type": "match", "tag": "Compensating telemetry", "summary": "Match each attack artefact to the detection layer that still sees it with local channels dark", "scenario": [{"prose": "The 13:05 review needs one map: for each artefact in the attacker's chain, <b>which layer still sees it<\/b> even with STAH-DC01's Windows channels dead. This is the budget argument for the layers you already have — and the one you do not. Read the layer inventory first; two of its rows are incomplete on purpose, because that is what the review will challenge."}, {"label": "ARTEFACT 1 — Detection layer inventory, St Aldric core (status at 12:40)", "html": "<div class='codeblock'>Sysmon ............ WORKSTATIONS only; DCs pending (ticket SYS-4471)\nEDR agent ......... all servers; DC01 deployed last week, version <span class='hl-warn'>NOT verified<\/span>\nNetwork sensors ... DC uplinks + internet edge; server-to-server <span class='hl-warn'>partial<\/span>\nWindows channels .. DC01 Security <span class='hl-err'>DARK<\/span> since 02:14:07\nBackup job ........ nightly, unrelated (noise row — no detection value)<\/div>"}], "question": "Match each artefact to the layer that still sees it.", "hint": "Imagine every Windows channel dead on that host. Process lines, registry writes, wire traffic and account changes must each find a surviving witness.", "match": {"left": [{"k": "L1", "t": "wevtutil sl Security /e:false execution"}, {"k": "L2", "t": "Write to Services\\EventLog\\Start"}, {"k": "L3", "t": "SMB lateral hop using stolen credentials"}, {"k": "L4", "t": "New local administrator account created"}, {"k": "L5", "t": "AutoLogger Start value set to 0"}], "right": [{"k": "R1", "t": "Network flow / sensor on the wire."}, {"k": "R2", "t": "Sysmon / EDR process telemetry."}, {"k": "R3", "t": "Sysmon registry event (SetValue)."}, {"k": "R4", "t": "EDR account-change watchlist."}, {"k": "R5", "t": "Sysmon registry event on the Autologger key."}], "pairs": {"L1": "R2", "L2": "R3", "L3": "R1", "L4": "R4", "L5": "R5"}}, "explain": "The disable command is visible as a <i>process<\/i> — Sysmon/EDR telemetry (R2) — regardless of any channel. The service <code>Start<\/code> write and the AutoLogger write are <i>registry operations<\/i> — Sysmon 13 catches both (R3 and R5, one at <code>Services\\EventLog<\/code>, one under <code>Control\\WMI\\Autologger<\/code>). The SMB lateral hop never touches local logging; it lives on the wire (R1). The new local admin is an account-plane change that EDR watchlists report independently (R4). The map's purpose is strategic: when the 13:05 review asks “what do we actually have while the channels are dark,” the answer is every layer that does not depend on Windows channels — and the gap is everything that does. That is the argument that funds Sysmon deployment on the domain controllers next quarter.", "study": "Mark each layer on your own architecture diagram: dies with channels, or survives."}, {"id": "x05", "type": "fill", "tag": "The 09:00 CISO memo", "summary": "Complete the executive memo with the four missing identifiers and values", "scenario": [{"prose": "The 09:00 memo goes to the CISO and, via her, to the board. Four values are missing — fill them from the case. Two bank entries are decoys that look plausible and are wrong."}, {"label": "ARTEFACT 1 — Draft header, document control (incomplete)", "html": "<div class='codeblock'>TLP:AMBER — STAH incident record, memo 3 of 5\nTo: CISO → Board risk committee (09:00 distribution)\nAuthor: on-call senior (name field <span class='hl-warn'>left blank overnight<\/span>)\nRelated: change STAH-CHG-8891 pending; counsel ref LEG-2214<\/div>"}], "question": "Complete the memo with the four missing values.", "hint": "Three of the four are identifiers you have met; one is the name of the registry value whose tampered state bites at boot.", "fill": {"sentence": "Since 02:14 the local Security channel of STAH-DC01 has been dark. We assess the actor operated under tactic ___ (Defense Impairment), technique T1685.001. Detection strategy ___ fired correctly in the March lab validation but was tuned out afterwards; restoring it is priority one. Legal requires that the ___ channel gap be documented before any restart, because the tampered registry ___ value would otherwise apply at boot and could be mistaken for our own remediation.", "bank": ["TA0112", "DET0187", "Security", "Start", "TA0006", "DET0411", "M1024", "1102"], "blanks": [{"accept": ["ta0112"], "size": 8}, {"accept": ["det0187"], "size": 9}, {"accept": ["security"], "size": 10}, {"accept": ["start"], "size": 8}]}, "explain": "Blank 1 is <b>TA0112<\/b> — Defense Impairment is the tactic; TA0006 (Credential Access) is what the attacker may do <i>next<\/i>, not what they did here. Blank 2 is <b>DET0187<\/b>, the detection strategy for disabled Windows event logs; DET0411 is a real strategy ID but it belongs to a different behaviour (hiding infrastructure), so it must not go in this memo. Blank 3 is the <b>Security<\/b> channel — the thing that went dark, not the System channel and not an event ID. Blank 4 is the <b>Start<\/b> value — the service start type whose tampered state applies at boot. The memo's power is its precision: board readers who cannot parse a registry path can still verify a strategy ID, a channel name and a value name, and legal can anchor “before any restart” to a specific object. Executive communication at this level is identifier hygiene.", "study": "Rewrite the memo from memory with zero decoys selected — then check each ID on the ATT&amp;CK site."}, {"id": "x06", "type": "dnd", "tag": "Coverage review — which controls blunt this path?", "summary": "Sort six candidate controls into 'blunts the observed path' and 'does not address it'", "scenario": [{"prose": "Coverage review with the platform team. Six candidate controls are on the table, four from the ATT&amp;CK mitigation list for T1685.001 and two that sound strong but target different problems. Sort them by whether they actually <b>blunt the observed path<\/b> — admin-session tampering with service, AutoLogger and channel configuration."}, {"label": "ARTEFACT 1 — Candidate control register (pre-review state)", "html": "<div class='codeblock'>ID ..... owner ............ status ........... target path\nM1024 .. platform ......... budgeted ......... registry keys\nM1018 .. IAM .............. policy draft ..... admin population\nM1022 .. storage .......... planned .......... .evtx files\nM1047 .. sec-ops .......... live ............. audit baseline\nM1050 .. endpoint ......... live ............. memory corruption\nM1032 .. IAM .............. live ............. external sign-in\n(owner for the review outcome: <span class='hl-warn'>unassigned<\/span>)<\/div>"}], "question": "Drag every control to the correct bucket.", "hint": "Four of these six come straight from the ATT&amp;CK mitigation list for T1685.001. The other two sound strong but guard different doors.", "dnd": {"buckets": [{"k": "B1", "t": "Blunts the observed path"}, {"k": "B2", "t": "Does not address this path"}], "items": [{"k": "I1", "t": "M1024 Restrict Registry Permissions", "b": "B1"}, {"k": "I2", "t": "M1018 User Account Management", "b": "B1"}, {"k": "I3", "t": "M1022 Restrict File Permissions (.evtx)", "b": "B1"}, {"k": "I4", "t": "M1047 Audit (baseline + verify)", "b": "B1"}, {"k": "I5", "t": "M1050 Exploit Protection", "b": "B2"}, {"k": "I6", "t": "M1032 Multi-factor Authentication", "b": "B2"}]}, "explain": "Blunts the path: <b>M1024<\/b> — ACLs on <code>Services\\EventLog<\/code> and the Autologger keys directly block the observed writes; <b>M1018<\/b> — shrinking and reviewing the admin population removes the sessions this attack needed; <b>M1022<\/b> — file ACLs on the .evtx files protect recorded history from the clearing step that often follows; <b>M1047<\/b> — audit baselines make the policy and config drift visible the morning after. Does not address it: <b>M1050<\/b> Exploit Protection guards against memory-corruption exploitation — there was none; the attacker logged in with admin rights. <b>M1032<\/b> MFA is excellent for account takeover from outside — but the actor was already inside an authorised session, so it changes nothing here. The skill this exercises: mitigation lists are scope claims, not vibes — read what each control actually guards, then match it to the artefacts you saw.", "study": "Open the ATT&amp;CK mitigation references for T1685.001 and confirm the four IDs on the left."}, {"id": "x07", "type": "qcm", "tag": "Best practice, wrong world", "summary": "“Restart the EventLog service immediately” — why is the textbook advice wrong here?", "scenario": [{"label": "The proposal — 08:30", "html": "<div class='codeblock'>From: infrastructure on-call\n“Standard practice for event log issues: restart the EventLog service\n (or reboot the box) to restore logging. Shall I run it on DC01 now?”<\/div>"}, {"label": "The constraints", "html": "<p>Counsel: evidence must survive scrutiny. Legal has not yet seen the config. The <code>Start<\/code> value is still 4; the AutoLogger key is still 0. No forensic capture has run.<\/p>"}, {"prose": "The proposal is genuinely standard practice — for an operations queue, on a host nobody suspects, with nothing to preserve. This is not that world. Choose the response that is correct <i>here<\/i>."}], "question": "Which response is correct for this situation?", "hint": "Legal signed one word this morning: preservation. What does an instant restart do to the tampered configuration and to its evidential value?", "qcm": {"options": [{"k": "A", "t": "Approve the restart — restoring logging fast is always the priority."}, {"k": "B", "t": "Decline for now: capture the tampered config and the .evtx files first, then restore from a known-good session."}, {"k": "C", "t": "Decline permanently — the channels must stay dark until the case closes."}, {"k": "D", "t": "Approve a full reboot instead — a clean restart is always safe."}], "correct": "B"}, "explain": "Correct here is B: capture first, then restore deliberately. The standard advice — restart or reboot to restore logging — is exactly right in an operations world where the cause is a glitch and nothing needs preserving. In this world the tampered configuration <i>is<\/i> primary evidence: restarting the service or rebooting the host applies or partially resets the tampered <code>Start<\/code> and AutoLogger values, destroys the before-state, and makes the blind-spot window's start indefensible in front of counsel. A (speed over everything) and D (reboot is always safe) are the best-practice traps the question is built on — both are right in the other world, both destroy evidence in this one. C is the opposite error: visibility must eventually be restored, and “keep it dark forever” trades permanent operational risk for evidential purity nobody asked for. Sequence: freeze, capture, seal, then restore from a known-good session with every step logged.", "study": "Write the one-line policy that distinguishes 'operations glitch' from 'suspected tampering' before anyone may restore logging."}, {"id": "x08", "type": "multi", "tag": "The price of the right call", "summary": "Isolation of STAH-DC01 is approved — select every real operational cost the decision carries", "scenario": [{"prose": "13:05 review outcome: STAH-DC01 will be network-isolated at 14:00 with authentication failed over to DC02. The CISO wants the decision's costs stated honestly in the record — not minimised, not catastrophised. Select every cost that is <b>real and specific<\/b> to this decision. The runbook extract below is the only dependency information you have; one section is unfinished, which is itself a fact for the record."}, {"label": "ARTEFACT 1 — Isolation runbook extract, 13:40 (incomplete)", "html": "<div class='codeblock'>14:00  quarantine DC01 uplinks (maintain iLO/management VLAN)\n14:02  verify auth failover to DC02 — watch admissions desk logons\n14:05  repoint monitoring connectors ??? <span class='hl-warn'>SECTION UNFINISHED<\/span>\nNote   imaging (PACS) runs on STAH-PACS-01/02 — separate VLANs\nNote   catering POS and guest Wi-Fi: no DC dependency (noise row)<\/div>"}], "question": "Select every real operational cost of the isolation decision.", "hint": "Costs must be real and specific — not apocalypse, not zero. Ask what actually depends on DC01 being on the network.", "multi": {"options": [{"k": "A", "t": "Authentication traffic concentrates on DC02; admission desks may see slower logons at peak."}, {"k": "B", "t": "Management tooling that expects DC01 reachable will fail over or stall until repointed."}, {"k": "C", "t": "The actor, watching service states, may conclude detection is closing in and accelerate or destroy evidence."}, {"k": "D", "t": "All hospital imaging (PACS) stops permanently from 14:00."}, {"k": "E", "t": "Isolation destroys the evidence stored on DC01."}, {"k": "F", "t": "The blind-spot window grows by several days."}], "correct": ["A", "B", "C"]}, "explain": "Real costs: A — auth load moves to DC02 and peak-hour logons may slow; that is the concrete, monitorable impact on admissions. B — management tooling that assumes DC01 is reachable must fail over or be repointed; someone owns that checklist today. C — an attentive actor who is still watching will notice the service state changes and network drops; containment can accelerate them, which is why capture happens <i>before<\/i> isolation where feasible. The refusals: D is catastrophe inflation — imaging depends on its own servers and network paths, not on one DC being isolated; E is simply false — isolation preserves what is stored; power-off and reimage are what destroy; F confuses the blind-spot window (already fixed at its start, 02:14:07) with the restoration delay, which is measured in hours. Honest cost accounting is what makes the next such decision fast: the organisation remembers the costs that were real.", "study": "Draft the one-page cost record for the 14:00 isolation: auth, tooling, adversary reaction — each with an owner."}, {"id": "x09", "type": "qcm", "tag": "One host, two stories", "summary": "EDR names STAH-WKS-231 at 02:14:07; DC01 died the same second — what is defensible?", "scenario": [{"label": "The conflict", "html": "<div class='codeblock'>EDR alert:  wevtutil sl Security /e:false\n            Host field: STAH-WKS-231   Time: 02:14:07\nDC01 fact:  local Security channel silent from 02:14:07\nJunior:     “Same command, same second — the EDR host field must be\n            wrong. It's all one host. Close the WKS-231 alert.”<\/div>"}, {"label": "ARTEFACT 2 — Estate record, 02:00 window", "html": "<p>A workstation build task ran at <b>02:00<\/b> on WKS-231's subnet — all new builds force a time sync at first boot. Agent GUID reconciliation between the EDR console and the asset inventory: <b>not yet run this quarter<\/b>. WKS-231's own local logs: <i>not yet collected<\/i>.<\/p>"}, {"prose": "The junior's reading is one of several. The estate record shows a workstation build task ran at 02:00 on WKS-231's subnet (clock-sync window), and DC01 has no Sysmon to corroborate its own side. What is the defensible position?"}], "question": "Which position is defensible on the current evidence?", "hint": "One second can be shared truth or shared clock. The agent GUID knows which — until it is checked, do not collapse two hosts into one.", "qcm": {"options": [{"k": "A", "t": "Treat both hosts as impacted until agent GUIDs and asset records reconcile; scope to both."}, {"k": "B", "t": "Accept the junior's reading — identical timestamps prove field corruption."}, {"k": "C", "t": "Conclude the attacker replayed events to fake a second host."}, {"k": "D", "t": "Drop the WKS-231 alert — workstations never matter in DC cases."}], "correct": "A"}, "explain": "Defensible is A: with an unverified host field, an explainable clock coincidence and a host that cannot corroborate itself, the honest scope is <b>both<\/b> hosts until the EDR agent GUIDs and asset inventory reconcile the story. B commits the cardinal error — treating an identical timestamp as proof of corruption when a 02:00 clock-sync task makes simultaneity <i>expected<\/i>; it also closes a possibly real second crime scene. C invents replay capability from nothing. D is triage prejudice — workstations are where credential theft lives, and the same command there is not noise. The general law this encodes: when attribution of an artefact to a host is uncertain, <b>scope widens<\/b>, it never narrows; narrowing is what the reconciliation is for, not what fear is for.", "study": "Check how your EDR assigns host fields at ingest, and where the agent GUID lives in the raw feed."}, {"id": "x10", "type": "order", "tag": "Rank under pressure", "summary": "Five workstreams, one morning — rank them by what the senior analyst does first", "scenario": [{"prose": "08:45. Five workstreams are open at once and the morning will not stretch. Rank the five actions by the order a senior analyst actually drives them — the board below is the only shared view of the shift, and two of its rows are unassigned, which is itself a decision you must make in the ranking."}, {"label": "ARTEFACT 1 — 08:45 shift board, St Aldric SOC (incomplete)", "html": "<div class='codeblock'>WS-1  estate sweep ............ owner <span class='hl-warn'>unassigned<\/span> .. not started\nWS-2  preserve 2 confirmed hosts . owner: you ..... clock ticking\nWS-3  inputs for 13:05 review ... owner: IR lead .. due 12:30\nWS-4  DC01 channels still dark .. owner: <span class='hl-warn'>unassigned<\/span> .. pending\nWS-5  re-tune DET0187/AN0535 ... owner: det-eng .... waiting\n(-- coffee rota and fire-drill notices pinned under this row: noise --)<\/div>"}], "question": "Rank the five actions from first to last.", "hint": "You cannot restore what you have not scoped, and you cannot decide without costed options. Paperwork follows scope; tuning follows restoration.", "order": {"items": [{"k": "W1", "t": "Sweep the estate for the tamper pattern (wevtutil, auditpol, sc config on logging)."}, {"k": "W2", "t": "Preserve on confirmed hosts: freeze, capture volatile config, seal .evtx."}, {"k": "W3", "t": "Deliver costed containment options to the 13:05 review."}, {"k": "W4", "t": "Restore visibility on DC01 after capture (channels, Start, AutoLogger)."}, {"k": "W5", "t": "Re-tune DET0187/AN0535 and add the AutoLogger rule."}]}, "explain": "The order is W1 → W2 → W3 → W4 → W5. Scope first (W1): every later decision — how many hosts to preserve, what to tell the review — depends on knowing whether DC01 is one of three or one of thirty. Preservation second (W2): confirmed hosts hold volatile evidence that degrades with every hour and every reboot. Decision support third (W3): the 13:05 review needs costed options built on scope and preserved facts, not on vibes. Restoration fourth (W4): visibility returns <i>after<\/i> capture, on the hosts already preserved — restoring before scoping risks re-tampering going unnoticed on hosts you have not found yet. Tuning last (W5): the analytic fixes land once the estate is quiet enough that the new rule's outputs can be trusted. The ranking's logic is dependency, not urgency: each step's output is the next step's input.", "study": "Rehearse the ranking aloud — dependency order is what interview panels and real mornings both test."}, {"id": "x11", "type": "match", "tag": "Which analytic variant fits?", "summary": "Match four AN0535 variants to the environment each one fits", "scenario": [{"prose": "The detection engineering review must rebuild what March's tuning deleted. Four candidate variants of DET0187's analytic <b>AN0535<\/b> are on the table. Match each variant to the environment it fits — the wrong pairing either drowns the queue or blinds the estate."}, {"label": "ARTEFACT 1 — March tuning review, minutes extract (incomplete)", "html": "<div class='codeblock'>Present: det-eng, SOC lead, platform\nDecisions (March):\n  - analytic simplified to “any admin, any time” → noisy by June\n  - lab validation: base variant only; AutoLogger variant <span class='hl-warn'>never tested<\/span>\n  - per-host suppression request: filed, <span class='hl-warn'>no owner recorded<\/span>\nSide note: ticket queue averages, patch calendar, canteen menu (noise)<\/div>"}], "question": "Match each analytic variant to its fitting environment.", "hint": "Match the tuning to the environment, not to the noise. One environment has few admins and 24×7 eyes; another has scripted nightly maintenance; another saw boot-time tampering; another has fixed patch reboots.", "match": {"left": [{"k": "L1", "t": "Default: alert on any admin, any time."}, {"k": "L2", "t": "Allowlist AuthorizedAdminAccounts + narrow TimeWindow."}, {"k": "L3", "t": "Variant that also watches AutoLogger Start keys."}, {"k": "L4", "t": "Variant with per-host suppression for change windows."}], "right": [{"k": "R1", "t": "24×7 SOC, few admins — alerts are rare and every one is precious."}, {"k": "R2", "t": "Large estate with scripted nightly maintenance by known accounts."}, {"k": "R3", "t": "Estate where boot-time channel tampering was observed."}, {"k": "R4", "t": "Estate with fixed monthly patch reboots that legitimately stop EventLog."}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3", "L4": "R4"}}, "explain": "L1↔R1: with few admins and round-the-clock staffing, the unfiltered default is affordable and catches everything — volume is low by construction. L2↔R2: scripted maintenance by known accounts at known hours is exactly what the allowlist plus a narrow <code>TimeWindow<\/code> describes; everything outside still alerts. L3↔R3: an estate that has actually seen AutoLogger writes needs the variant that watches <code>Autologger\\…\\Start<\/code> — the base service-focused rule misses that layer entirely; this is St Aldric's required variant after this incident. L4↔R4: fixed monthly reboots legitimately stop and start EventLog, so a per-host suppression scoped to the documented windows keeps those nights quiet without touching anything else. The pairing discipline prevents both failure modes: over-tuned variants that hide real attacks, and under-tuned variants that bury them in noise.", "study": "Write the variant table for your own estate: which of the four would you deploy, where?"}, {"id": "x12", "type": "term", "tag": "Terminal — restore, in the right order", "summary": "Capture done, change window open — type the single command that brings the Security channel back", "scenario": [{"label": "State of the incident — 10:05", "html": "<div class='codeblock'>09:58  Evidence captured: .evtx hashed, configs exported, volatile state saved\n10:05  Counsel sign-off: preservation complete, restoration approved\n10:05  Elevated session: KNOWN-GOOD jump host, break-glass account\n10:30  Change window closes\nRule:  no deletions; the registry Start fix belongs to change STAH-CHG-8891\n       (scheduled separately) and must NOT be done here<\/div>"}, {"prose": "One step remains in your hands: bring the <b>Security channel<\/b> of STAH-DC01 back online from the known-good session. Choose the single correct command — the flag matters, the target matters, and everything not in scope must stay untouched. The window closes at 10:30."}], "question": "Type the single command that turns the Security channel back on.", "hint": "One tool, one mode, one target, one flag. The flag you want turns it on — and you are not the registry's owner today.", "term": {"prompt": "PS C:\\> (known-good session, STAH-DC01)", "solution": "wevtutil sl Security /e:true", "output": "OK — the Security channel is now enabled.\n(new events will be recorded immediately)", "elements": [{"re": "wevtutil", "t": "the wevtutil tool"}, {"re": " sl ", "t": "the sl (set-log) mode"}, {"re": "security", "t": "the Security channel as the target"}, {"re": "/e:\\s*true", "t": "the /e:true flag — enable, deliberately"}], "nearMiss": [{"re": "/e:\\s*false", "t": "DANGEROUS — /e:false disables the channel you were sent to restore", "out": "OK — Security channel DISABLED. That is the opposite of your task."}, {"re": " cl |\\bclear\\b", "t": "DANGEROUS — clearing wipes the channel's content; the rule says no deletions", "out": "The Security channel content was cleared. Preservation is void."}, {"re": "sc (config|stop)", "t": "DANGEROUS — the service registry fix belongs to change STAH-CHG-8891, not to this step", "out": "Service configuration touched — out-of-change-window modification recorded."}, {"re": "/e:\\s*enable|/enable", "t": "wrong syntax — the channel flag is /e:true; there is no /enable", "out": "Invalid parameter. Nothing changed."}]}, "explain": "The canonical command is <code>wevtutil sl Security /e:true<\/code>: <b>wevtutil<\/b> is the tool, <b>sl<\/b> (set-log) the mode, <b>Security<\/b> the target channel, and <b>/e:true<\/b> the deliberate enable flag. Every part is graded, and every near-miss is a real-world accident with a name. <code>/e:false<\/code> is the attacker's own direction — disabling under pressure. <code>cl<\/code> clears content and voids the morning's preservation. Touching <code>sc config<\/code> or <code>sc stop<\/code> steps outside your change window and into STAH-CHG-8891's territory — out-of-scope changes on a domain controller are how two change records collide. And <code>/enable<\/code> does not exist; under a closing window, syntax confidence matters. The deeper lesson is the order this command sat in: capture → sign-off → restore — the command is easy; knowing it is the <i>right<\/i> command <i>now<\/i> is the test.", "study": "Practise the wevtutil sl flag set (/e:, /q:, /rt:, /ms:) and mark each read or write before use."}, {"id": "x13", "type": "logs", "tag": "AutoLogger autopsy", "summary": "Nine lines around the Autologger keys — click every write that impairs how event channels start at boot", "scenario": [{"prose": "Deeper forensic pass on STAH-DC01, focused on the boot path. Not every <code>Start<\/code> write is yours, not every Autologger feeds event channels, and one line is the remediation. The question is scoped to one thing: writes that change <b>how event channels start at boot<\/b>."}], "question": "Click every line that impairs how event channels start at boot.", "hint": "Not every Start=0 is yours, and not every autologger feeds event channels. Which two writes decide whether channels come up with the system?", "logs": {"prompt": "Click every line that impairs event channels' boot start, then press Check.", "lines": [{"h": "<span class='hl-num'>02:20:11<\/span> Sysmon 13  SetValue  <span class='hl-pth'>Control\\WMI\\Autologger\\EventLog-System\\Start<\/span> → <span class='hl-err'>0<\/span>"}, {"h": "<span class='hl-num'>02:20:30<\/span> Sysmon 14  <span class='hl-err'>KeyRename<\/span>  <span class='hl-pth'>Autologger\\EventLog-Security<\/span> → <span class='hl-err'>EventLog-Security.bak<\/span>"}, {"h": "<span class='hl-num'>01:58:44<\/span> Sysmon 1   ProcessCreate  <span class='hl-cmd'>wevtutil sl Security /e:false<\/span>"}, {"h": "<span class='hl-num'>02:22:40<\/span> Sysmon 11  FileCreate  <span class='hl-dim'>...\\Autologger\\EventLog-System\\Archive.etl<\/span>"}, {"h": "<span class='hl-num'>02:24:02<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Autologger\\EventLog-System\\FileMax<\/span> → 4"}, {"h": "<span class='hl-num'>02:31:19<\/span> Sysmon 5   ProcessTerminate  <span class='hl-dim'>conhost.exe<\/span>"}, {"h": "<span class='hl-num'>02:33:50<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Autologger\\Diagtrack-Listener\\Start<\/span> → 0"}, {"h": "<span class='hl-num'>03:01:12<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Autologger\\AppModel\\Start<\/span> → 0"}, {"h": "<span class='hl-num'>10:31:05<\/span> Sysmon 13  SetValue  Autologger\\EventLog-System\\Start → 1  <span class='hl-ok'>User: STAH\\svc_gpo-remediate<\/span> <span class='hl-dim'>(ticketed remediation)<\/span>"}], "needles": [0, 1]}, "explain": "Two lines impair the boot path of event channels. Line 1 sets the <code>EventLog-System<\/code> AutoLogger <code>Start<\/code> to 0 — the System channel will not start with the system. Line 2 renames the <code>EventLog-Security<\/code> AutoLogger <i>key<\/i> itself to <code>.bak<\/code> — a subtler disable recorded by Sysmon event 14; a missing or renamed key means the channel simply never autostarts, and a repair that only re-enables the service will not fix it. The near-decoys, deliberately: line 3 is the 01:58 channel <i>disable<\/i> — real tampering, but it lives in the live-channel layer, not the boot path, so under this question's scope it is not an answer. Lines 4–6 are churn (an .etl archive file, a buffer-size value, a process exit). Line 7 disables the Diagtrack telemetry autologger — a different product. Line 8's AppModel autologger likewise feeds nothing that event channels need. Line 9 is the ticketed remediation restoring <code>Start → 1<\/code>. Reading scope precisely is the whole game: same key family, three layers — live channel, boot autostart, other products — and only one of them answers this question.", "study": "Export your domain controllers' Autologger keys and baseline which ones should exist and with which Start values."}, {"id": "x14", "type": "branch", "tag": "The reimage question", "summary": "Counsel, custody and a junior with good intentions — three steps to a defensible reimage", "scenario": [{"prose": "The 16:00 question from infrastructure: “Can we reimage STAH-DC01 tonight?” Counsel, custody and one well-meaning junior stand between you and a clean host. Work the three steps."}], "question": "Choose the best action at each of the three steps.", "hint": "The image is the evidence. What must exist, signed, before the first sector is overwritten?", "branch": {"steps": [{"label": "STEP 1 OF 3 — Tonight's reimage proposal", "scen": [{"label": "Change request", "html": "<p>“DC01 reimaged from gold image tonight 22:00, back in service by 06:00.” No disk image exists yet. EDR history export: not started.<\/p>"}], "options": [{"k": "A", "t": "Preserve first: full disk image plus EDR history export, then reimage on a later window."}, {"k": "B", "t": "Approve as proposed — the gold image is clean, so nothing is lost."}, {"k": "C", "t": "Refuse any reimage until the case closes, however long that takes."}], "correct": "A"}, {"label": "STEP 2 OF 3 — The helpful junior", "scen": [{"label": "During the disk image", "html": "<p>Junior admin: “While we wait — can I clean the tampered registry keys on the live host so it looks normal if the attacker comes back?”<\/p>"}], "options": [{"k": "A", "t": "Stop it: hands off the live host; all work happens on the image, and every access is logged."}, {"k": "B", "t": "Approve — restoring hygiene on a live host is good practice."}, {"k": "C", "t": "Power the host off instead, so nothing can change."}], "correct": "A"}, {"label": "STEP 3 OF 3 — Who signs the custody record", "scen": [{"label": "Custody question", "html": "<p>The disk image and EDR export are complete and hashed. Infrastructure wants the reimage approved tonight.<\/p>"}], "options": [{"k": "A", "t": "IR lead and counsel co-sign the chain-of-custody entry; only then does the reimage proceed."}, {"k": "B", "t": "Any available administrator signs — the hashes are self-evident."}, {"k": "C", "t": "Nobody signs; the imaging tool's own log is sufficient."}], "correct": "A"}]}, "explain": "Step 1: the disk image and EDR export <i>are<\/i> the evidence that survives the reimage; “the gold image is clean” misses the point — what is lost is the compromised host's state, which is the case. Reimaging without preservation is the one truly irreversible mistake available tonight. Step 2: the junior's hygiene instinct is right in operations and wrong in an incident — cleaning the live keys alters evidence mid-collection; all cleaning happens on the image, and access to the live host is logged from now on. Powering off (C) sacrifices volatile state and delays imaging for no evidential gain. Step 3: chain of custody is what makes the image admissible and the timeline defensible — IR lead plus counsel co-sign after hashes are verified; a self-evident hash is not a custody record, and a tool log is not a signature. Only with A signed does the reimage proceed. The order — preserve, protect, sign, then rebuild — is the legal spine of the whole incident.", "study": "Read your organisation's chain-of-custody template and fill it for a hypothetical disk image tonight."}, {"id": "x15", "type": "fill", "tag": "Policy drafting — privileged access", "summary": "Complete the new privileged-access policy sentence with four key values", "scenario": [{"prose": "The incident's policy outcome is a new privileged-access rule. Four blanks carry the teeth: the group being restricted, the control framework behind the reviews, the registry value being watched, and the channel whose configuration is protected. Two bank entries are decoys. The draft's document-control block is below — it is missing an owner, which is exactly the kind of gap the review meeting is meant to close."}, {"label": "ARTEFACT 1 — Policy draft DCS-POL-114, document control (incomplete)", "html": "<div class='codeblock'>Title ....... Privileged Access — Event Logging Protection\nScope ....... all domain controllers and admin workstations\nOwner ....... <span class='hl-warn'>unassigned<\/span> (nominated at today's review)\nReview cycle  quarterly, aligned to M1018 control reviews\nApplies to ... Domain Admins, service accounts with admin rights\nSide notes stapled to the draft: canteen survey, old badge policy (noise)<\/div>"}], "question": "Complete the policy sentence with the four missing values.", "hint": "One blank is a group name, one is a mitigation ID, one is a registry value name, one is a channel name.", "fill": {"sentence": "Members of the ___ group may not modify EventLog service configuration; emergency changes require a ticket and a second approver. All service accounts with admin rights enter quarterly reviews under ___ (User Account Management). Any deviation on the registry ___ value of the EventLog service, or on ___ channel configuration, raises a DET0187 alert inside the standard TimeWindow.", "bank": ["Domain Admins", "M1018", "Start", "Security", "Domain Users", "M1049", "Autocheck", "Application"], "blanks": [{"accept": ["domain admins"], "size": 14}, {"accept": ["m1018"], "size": 8}, {"accept": ["start"], "size": 8}, {"accept": ["security"], "size": 10}]}, "explain": "Blank 1 is <b>Domain Admins<\/b> — the group whose sessions ran every command in this incident; Domain Users would be meaningless as a restriction (they lack the rights anyway). Blank 2 is <b>M1018<\/b>, User Account Management — the mitigation framework the quarterly reviews implement; M1049 (antimalware) is real but belongs to a different problem. Blank 3 is the <b>Start<\/b> value — the single registry value whose tampered state produced the boot-time bomb; Autocheck is a decoy value name. Blank 4 is the <b>Security<\/b> channel — whose configuration changes now alert within the <code>TimeWindow<\/code>. Note what the policy does structurally: it names the population (who), the control (what framework), the objects (which value, which channel) and the detection (which strategy) — the same four anchors every effective control sentence needs. Policy that cannot be detected is decoration; this one lands directly on DET0187's alert path.", "study": "Take one real policy sentence from your organisation and check it against the who / framework / objects / detection anchors."}, {"id": "x16", "type": "dnd", "tag": "Dies with the channel — or survives", "summary": "Sort seven telemetry items into 'dies with the channels' and 'survives channel death'", "scenario": [{"prose": "The final coverage visual for the board pack: the attacker switched off STAH-DC01's <b>Security, System and PowerShell channels live<\/b> (wevtutil /e:false on each) and pinned the service for the next boot — but left the EventLog <i>service<\/i> running and never touched the Sysmon or application layers. Which telemetry goes dark with the switched-off channels and which keeps flowing? Sort all seven items. The boundary is exactly the set of channels the attacker switched off."}, {"label": "ARTEFACT 1 — Channel state capture, STAH-DC01, 11:30", "html": "<div class='codeblock'>wevtutil sl Security   → enabled: <span class='hl-err'>false<\/span>\nwevtutil sl System     → enabled: <span class='hl-err'>false<\/span>\nwevtutil sl PowerShell → enabled: <span class='hl-err'>false<\/span>\nwevtutil sl “Microsoft-Windows-Sysmon/Operational” → enabled: <span class='hl-ok'>true<\/span> (untouched)\nEventLog service       → STATE: 4 RUNNING (Start=4 pending at next boot)\nIIS (on the app server) → text-file access logs, not a Windows channel\nEDR agent + network sensor → independent of Windows channels\n(inventory gap: Application channel state <span class='hl-warn'>not captured<\/span> — irrelevant to this question)<\/div>"}], "question": "Drag every item to the correct bucket.", "hint": "Anything written into the three channels the attacker switched off goes dark. Anything written by a separate service, an agent, a sensor or another product's own subsystem keeps flowing.", "dnd": {"buckets": [{"k": "B1", "t": "Dies with the channels"}, {"k": "B2", "t": "Survives channel death"}], "items": [{"k": "I1", "t": "Security 4688 process creation", "b": "B1"}, {"k": "I2", "t": "System 7036 service running", "b": "B1"}, {"k": "I3", "t": "PowerShell 4104 script block", "b": "B1"}, {"k": "I4", "t": "Sysmon 13 registry SetValue", "b": "B2"}, {"k": "I5", "t": "EDR cloud timeline", "b": "B2"}, {"k": "I6", "t": "Network sensor flow records", "b": "B2"}, {"k": "I7", "t": "IIS access logs", "b": "B2"}]}, "explain": "Dies with the switched-off channels: 4688 (written into Security), 7036 (written into System) and 4104 (written into the PowerShell/Operational channel) — three different channels, one dependency: the attacker switched all three off live, so all three record streams went dark at once. That is the estate-wide blind spot a handful of commands creates. Survives: Sysmon 13 (Sysmon runs as its own service writing to its own channel — the state capture shows the attacker never touched it, a routine attacker oversight), the EDR cloud timeline (agent-to-vendor, no channel dependency), network sensor flows (never touched Windows logging), and IIS access logs (written by the web server's own HTTP subsystem as text files, not through the event pipeline). Note the service nuance the state capture settles: the EventLog <i>service<\/i> is still running — only the three channels are off — so the boundary is exactly the switched-off channels, not the whole machine. The board takeaway in one line: channel telemetry is one basket; resilient visibility means deliberately funding at least two of the survivors on every critical host.", "study": "Mark each host in your estate: how many of the four 'survivor' layers does it actually have?"}, {"id": "x17", "type": "match", "tag": "After the silence", "summary": "Match each attacker next step to the tactic it serves", "scenario": [{"prose": "Closing question for the review. Defense Impairment is never the destination. Match each observed next step in the St Aldric case to the tactic it serves — this is how the report explains <i>why<\/i> the silence mattered. The case excerpt below is the only timeline the team has; one cell is missing, and the noise rows test whether you anchor on behaviour rather than on everything the case file contains."}, {"label": "ARTEFACT 1 — Case summary excerpt, St Aldric (incomplete)", "html": "<div class='codeblock'>02:14  channels dark (T1685.001 — established)\n02:5x  credential dumping attempt on DC01 — <span class='hl-warn'>volume unknown<\/span>\n03:2x  new session on STAH-PAY-01 using a harvested admin cred\n04:0x  patient-records share staged into a compressed archive\n05:1x  outbound transfer to a parked domain — volume <span class='hl-warn'>not yet recovered<\/span>\n(-- cafeteria Wi-Fi audit and badge-system alerts also in the file: noise --)<\/div>"}], "question": "Match each attacker next step to its tactic.", "hint": "Defense Impairment is done. What does the attacker buy with the silence — credentials, movement, data, or a way out?", "match": {"left": [{"k": "L1", "t": "Harvest credential material while audit trails are dark."}, {"k": "L2", "t": "Move to the payment server with the new admin credentials."}, {"k": "L3", "t": "Stage and compress the patient-records share."}, {"k": "L4", "t": "Send the archive to a parked domain."}], "right": [{"k": "R1", "t": "Credential Access (TA0006)"}, {"k": "R2", "t": "Lateral Movement (TA0008)"}, {"k": "R3", "t": "Collection (TA0009)"}, {"k": "R4", "t": "Exfiltration (TA0010)"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3", "L4": "R4"}}, "explain": "Credential harvesting under a dark audit trail is <b>Credential Access (TA0006)<\/b> — the silence's first dividend, since failed logon noise normally exposes this. Moving onward with the harvested credentials is <b>Lateral Movement (TA0008)<\/b>. Staging and compressing a data share is <b>Collection (TA0009)<\/b>. Sending the archive out is <b>Exfiltration (TA0010)<\/b>. The through-line for the report: T1685.001 sits <i>before<\/i> all four as an enabler — it does not steal, move, collect or exfiltrate anything itself; it removes the witnesses that would have flagged each of those steps. That framing is what converts a technical finding into an executive one: the blind-spot window is not an IT metric, it is the attacker's free operating time across the rest of the kill chain. Defend the logging, and you defend everything that comes after it.", "study": "Place your own last incident's steps on the same tactic map and identify which ones the silence enabled."}]};

'use strict';
/* ============================ helpers ============================ */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function scoreExercise(H, W, N){ if (N <= 0) return 0; return Math.max(0, (H - W) / N); }
function fmtTime(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* ============================ state ============================ */
var TSTATE = { RUNNING:'RUNNING', PAUSED_MANUAL:'PAUSED_MANUAL', PAUSED_AUTO_CHECK:'PAUSED_AUTO_CHECK', ENDED:'ENDED' };
var S = {
  screen: 'intro', order: [], idx: 0,
  credits: {}, checked: {}, hintUsed: {}, skipped: [],
  mode: 'normal', reviewFrom: null,
  timeRemain: EXAM.meta.timerSeconds, timerState: TSTATE.RUNNING, prevTimerState: null,
  manualSec: 0, autoSec: 0, reported: false,
  rt: {}, handshake: { username:'', country:'', locale:'en' }
};
var ticker = null;

function total(){ return EXAM.exercises.length; }
function cur(){ return EXAM.exercises[S.order[S.idx]]; }
function answeredCount(){ var n = 0; for (var k in S.checked){ if (S.checked[k]) n++; } return n; }
function creditSum(){ var s = 0; for (var k in S.credits){ s += S.credits[k]; } return s; }

/* ============================ timer FSM ============================ */
function setTimerState(st){
  S.prevTimerState = S.timerState; S.timerState = st; renderTimer();
}
function resumeTimer(){
  if (S.timerState === TSTATE.ENDED) return;
  setTimerState(S.prevTimerState === TSTATE.PAUSED_AUTO_CHECK ? TSTATE.PAUSED_AUTO_CHECK : TSTATE.RUNNING);
}
function startTicker(){
  if (ticker) return;
  ticker = setInterval(function(){
    if (S.screen === 'intro') return;
    if (S.timerState === TSTATE.RUNNING){
      if (S.timeRemain > 0){ S.timeRemain--; renderTimer(); if (S.timeRemain === 0) timeUp(); }
    } else if (S.timerState === TSTATE.PAUSED_MANUAL){ S.manualSec++; }
    else if (S.timerState === TSTATE.PAUSED_AUTO_CHECK){ S.autoSec++; }
  }, 1000);
}
function timeUp(){
  setTimerState(TSTATE.ENDED);
  if (S.screen === 'exam' && !S.checked[S.idx]) { S.skipped.push(S.idx); }
  finishExam();
}
function renderTimer(){
  var tv = $('#tval'); if (tv) tv.textContent = fmtTime(S.timeRemain);
  var ts = $('#tstate'); if (!ts) return;
  var map = {
    RUNNING: ['▶','RUNNING',''],
    PAUSED_MANUAL: ['⏸','PAUSED — manual (press Resume)','paused'],
    PAUSED_AUTO_CHECK: ['⏸','PAUSED — reviewing feedback (resumes on Next)','paused'],
    ENDED: ['⏹','ENDED','ended']
  };
  var m = map[S.timerState] || map.RUNNING;
  ts.innerHTML = m[0] + ' ' + esc(m[1]);
  ts.className = 'tstate ' + m[2];
  var pb = $('#pausebtn');
  if (pb) pb.textContent = (S.timerState === TSTATE.PAUSED_MANUAL) ? '▶ Resume' : '⏸ Pause';
}
function renderScore(){
  var n = answeredCount(), s = creditSum();
  var pct = n > 0 ? Math.round((s / n) * 100) : 0;
  var e = $('#tbscore');
  if (e) e.innerHTML = 'Score <b>' + s.toFixed(1) + '</b> / ' + n + ' · ' + pct + '%';
}

/* ============================ build runtime ============================ */
/* schema normalisation: accept legacy flat qcm shape (options/correct at top level) */
function normalizeEx(ex){
  if (ex.type === 'qcm' && !ex.qcm && ex.options){
    ex.qcm = { options: ex.options, correct: ex.correct };
  }
  return ex;
}
function buildRt(exRaw){
  var ex = normalizeEx(exRaw);
  var rt = { ex: ex };
  if (ex.type === 'qcm'){ rt.opts = shuffle(ex.qcm.options.map(function(o){ return o.k; })); rt.sel = null; }
  if (ex.type === 'multi'){ rt.opts = shuffle(ex.multi.options.map(function(o){ return o.k; })); rt.sel = []; }
  if (ex.type === 'match'){ rt.right = shuffle(ex.match.right.map(function(r){ return r.k; })); rt.pairs = {}; rt.selL = null; }
  if (ex.type === 'dnd'){ rt.items = shuffle(ex.dnd.items.map(function(i){ return i.k; })); rt.place = {}; rt.selChip = null; }
  if (ex.type === 'fill'){ rt.bank = shuffle(ex.fill.bank.slice()); rt.vals = []; }
  if (ex.type === 'order'){ rt.orderKeys = shuffle(ex.order.items.map(function(i){ return i.k; })); rt.selIdx = null; }
  if (ex.type === 'logs'){ rt.sel = []; }
  if (ex.type === 'term'){ rt.ran = false; rt.lastCmd = ''; rt.lastKind = ''; rt.hist = []; }
  if (ex.type === 'branch'){ rt.step = 0; rt.choices = []; rt.optOrders = ex.branch.steps.map(function(st){ return shuffle(st.options.map(function(o){ return o.k; })); }); }
  return rt;
}

/* ============================ intro ============================ */

  I.keywords.forEach(function(kw){

  });
  h += '</section>';

  h += '</section></div>';

/* ============================ header ============================ */
function renderHeader(){
  var m = EXAM.meta;
  var h = '<div class="topbar-in">';
  h += '<span class="sevbadge ' + m.sevClass + ' tb-sev"><span aria-hidden="true">' + m.sevIcon + '</span> ' + esc(m.sevWord) + '</span>';

  $('#pausebtn').addEventListener('click', onPressPause);
  $('#skipbtn').addEventListener('click', onPressSkip);
  $('#skchip').addEventListener('click', function(){ if (S.skipped.length) openReview(); });
  renderTimer(); renderScore(); updateSkChip();
}
function updateSkChip(){
  var c = $('#skchip'); if (!c) return;
  $('#skcount').textContent = S.skipped.length;
  c.classList.toggle('hidden', S.skipped.length === 0);
}
function updateProgress(done){
  var p = Math.round(((done ? S.idx + 1 : S.idx) / total()) * 100);
  var f = $('#pfill'); if (f){ f.style.width = p + '%'; f.parentElement.setAttribute('aria-valuenow', p); }
  var n = $('#exnum'); if (n) n.textContent = (S.idx + 1);
}

/* ============================ exam screen ============================ */
function startExam(){
  S.screen = 'exam'; S.mode = 'normal'; S.idx = 0;
  renderHeader();
  renderExercise();
}
function panelHTML(p){
  if (p.prose != null) return '<p>' + p.prose + '</p>';
  return '<div class="artefact"><div class="alabel">' + esc(p.label) + '</div><div class="abody">' + p.html + '</div></div>';
}
function renderExercise(){
  var ex = cur();
  S.rt = buildRt(ex);
  S.screen = 'exam';
  var wrap = $('#app');
  var h = '';
  h += '<div class="wrap"><div id="exzone" class="pauseveil">';
  h += '<div class="exmeta">Exercise <b>' + (S.idx + 1) + ' of ' + total() + '</b> — <b>' + esc(ex.tag) + '</b>' + (S.mode === 'review' ? ' · <span class="skip-i">⚠ answered from the skipped pool</span>' : '') + '</div>';
  h += '<section class="card excard" aria-label="Exercise">';
  h += '<div class="blk blk-scen" id="scenblk">';
  h += '<div class="blk-h"><span class="bicon" aria-hidden="true">📄</span> SCENARIO <button class="tbtn" id="scentoggle" style="margin-left:auto;min-height:30px;padding:3px 10px;font-size:12px" aria-expanded="true">▾ Collapse</button></div>';
  h += '<div class="ssummary hidden" style="font-size:13.5px;color:var(--text-secondary);margin:-4px 0 6px">' + esc(ex.summary) + '</div>';
  h += '<div class="sbody">' + ex.scenario.map(panelHTML).join('') + '</div>';
  h += '</div>';
  h += '<div class="blk blk-q"><div class="blk-h"><span class="bicon" aria-hidden="true">❓</span> QUESTION</div><div class="qtext">' + ex.question + '</div>';
  h += '<div id="hintzone"></div></div>';
  h += '<div class="blk blk-ans"><div class="blk-h"><span class="bicon" aria-hidden="true">✍</span> YOUR ANSWER</div><div id="answ"></div></div>';
  h += '<div id="fbzone"></div>';
  h += '<div class="navrow">';
  h += '<button class="btn primary" id="checkbtn">✓ Check answer</button>';
  h += '<span class="spacer"></span>';
  h += '<button class="btn" id="backrevbtn" style="display:none">↩ Back to review</button>';
  h += '<button class="btn primary" id="nextbtn" disabled>Next ▶</button>';
  h += '</div></section></div></div>';
  wrap.innerHTML = h;

  $('#scentoggle').addEventListener('click', function(){
    var b = $('.sbody', $('#scenblk')), s = $('.ssummary', $('#scenblk')), t = $('#scentoggle');
    var collapsed = b.classList.toggle('hidden');
    s.classList.toggle('hidden', !collapsed);
    t.textContent = collapsed ? '▸ Expand' : '▾ Collapse';
    t.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  });
  renderWidget(ex, S.rt);
  $('#checkbtn').addEventListener('click', onPressCheck);
  $('#nextbtn').addEventListener('click', onPressNext);
  $('#backrevbtn').addEventListener('click', function(){
    /* Returning to the review screen always resumes the countdown (spec: the
       timer resumes when the learner returns to the review-skipped screen) —
       even if a manual pause was layered on top of the Check auto-pause. */
    if (S.timerState !== TSTATE.ENDED) setTimerState(TSTATE.RUNNING);
    openReview();
  });
  $('#backrevbtn').style.display = (S.mode === 'review') ? '' : 'none';
  $('#skipbtn').disabled = (S.mode === 'review');
  updateSkChip(); updateProgress(S.checked[S.idx]);
  renderScore();
  var nb = $('#nextbtn');
  if (S.idx === total() - 1) nb.innerHTML = 'Final Submit ⏭';
  window.scrollTo(0, 0);
}

/* ============================ widgets ============================ */
function optBtn(key, text, cls){
  return '<button class="qcm-opt ' + (cls || '') + '" data-k="' + esc(key) + '"><span class="okey">' + esc(key) + '.</span><span>' + text + '</span></button>';
}
function renderWidget(ex, rt){
  var z = $('#answ');
  if (ex.type === 'qcm'){
    z.innerHTML = '<div class="msel-hinttext">Choose the one best answer.</div>' + rt.opts.map(function(k){
      var o = ex.qcm.options.filter(function(x){ return x.k === k; })[0];
      return optBtn(o.k, o.t);
    }).join('');
    $$('.qcm-opt', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        rt.sel = b.getAttribute('data-k');
        $$('.qcm-opt', z).forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
  }
  else if (ex.type === 'multi'){
    z.innerHTML = '<div class="msel-hinttext">' + esc(ex.multi.hint || 'Select all that apply. Partial credit applies.') + '</div>' + rt.opts.map(function(k){
      var o = ex.multi.options.filter(function(x){ return x.k === k; })[0];
      return optBtn(o.k, o.t);
    }).join('');
    $$('.qcm-opt', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var k = b.getAttribute('data-k');
        var i = rt.sel.indexOf(k);
        if (i >= 0){ rt.sel.splice(i, 1); b.classList.remove('sel'); }

      });

  else if (ex.type === 'match'){
    var h = '<div class="matchgrid"><div class="mcol"><div class="mcoltitle">ITEMS (click one)</div>';
    ex.match.left.forEach(function(l){
      h += '<button class="mitem" data-lk="' + esc(l.k) + '"><span class="ltext">' + l.t + '</span><span class="ptag" data-ptag="' + esc(l.k) + '"></span></button>';
    });
    h += '</div><div class="mcol"><div class="mcoltitle">MATCHES (click to pair)</div>';
    rt.right.forEach(function(rk){
      var r = ex.match.right.filter(function(x){ return x.k === rk; })[0];
      h += '<button class="mitem" data-rk="' + esc(rk) + '">' + r.t + '</button>';
    });
    h += '</div></div><div class="msel-hinttext">Click an item on the left, then its match on the right. Click a paired item to undo.</div>';
    z.innerHTML = h;
    $$('.mitem[data-lk]', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var lk = b.getAttribute('data-lk');
        if (rt.pairs[lk] != null){ delete rt.pairs[lk]; $('[data-ptag="' + lk + '"]', z).textContent = ''; b.classList.remove('paired'); return; }
        rt.selL = lk;
        $$('.mitem[data-lk]', z).forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
    $$('.mitem[data-rk]', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        if (!rt.selL) return;
        var rk = b.getAttribute('data-rk');
        var lk = rt.selL; rt.selL = null;
        rt.pairs[lk] = rk;
        var lb = $('.mitem[data-lk="' + lk + '"]', z);
        lb.classList.remove('sel'); lb.classList.add('paired');
        var rname = ex.match.right.filter(function(x){ return x.k === rk; })[0].t;
        $('[data-ptag="' + lk + '"]', z).textContent = '↔ ' + rname.replace(/<[^>]*>/g, '').slice(0, 34);
      });
    });
  }
  else if (ex.type === 'dnd'){
    var h2 = '<div class="dndarea"><div class="chipbank" id="chipbank">';
    rt.items.forEach(function(ik){
      var it = ex.dnd.items.filter(function(x){ return x.k === ik; })[0];
      if (!rt.place[ik]) h2 += '<button class="chip" draggable="true" data-ik="' + esc(ik) + '">' + it.t + '</button>';
    });
    h2 += '</div>';
    ex.dnd.buckets.forEach(function(bk){
      h2 += '<div class="bucket" data-bk="' + esc(bk.k) + '"><h4>' + bk.t + '</h4><div class="blist"></div></div>';
    });
    h2 += '</div><div class="msel-hinttext">Drag a chip into a zone, or click a chip then click a zone. Click a placed chip to send it back.</div>';
    z.innerHTML = h2;
    var bank = $('#chipbank', z);
    function chipClick(chip){
      if (S.checked[S.idx]) return;

      }
      rt.selChip = ik;
      $$('.chip', z).forEach(function(c){ c.classList.remove('sel'); });
      chip.classList.add('sel');
    }
    $$('.chip', z).forEach(function(c){
      c.addEventListener('click', function(){ chipClick(c); });
      c.addEventListener('dragstart', function(ev){ rt.selChip = c.getAttribute('data-ik'); c.classList.add('dragging'); try { ev.dataTransfer.setData('text/plain', rt.selChip); } catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
    });
    $$('.bucket', z).forEach(function(bk){
      var bkk = bk.getAttribute('data-bk');
      bk.addEventListener('click', function(ev){
        if (ev.target !== bk && !ev.target.classList.contains('blist') && !ev.target.classList.contains('blist') && ev.target.tagName !== 'H4') return;
        if (S.checked[S.idx] || !rt.selChip) return;
        rt.place[rt.selChip] = bkk;
        var chip = $('.chip[data-ik="' + rt.selChip + '"]', z);
        if (chip){ $('.blist', bk).appendChild(chip); chip.classList.remove('sel'); }
        rt.selChip = null;
      });
      bk.addEventListener('dragover', function(ev){ ev.preventDefault(); bk.classList.add('over'); });
      bk.addEventListener('dragleave', function(){ bk.classList.remove('over'); });
      bk.addEventListener('drop', function(ev){
        ev.preventDefault(); bk.classList.remove('over');
        var ik = rt.selChip; try { ik = ev.dataTransfer.getData('text/plain') || ik; } catch(e){}
        if (!ik || S.checked[S.idx]) return;
        rt.place[ik] = bkk;
        var chip = $('.chip[data-ik="' + ik + '"]', z);
        if (chip){ $('.blist', bk).appendChild(chip); chip.classList.remove('sel', 'dragging'); }

      });

  else if (ex.type === 'fill'){
