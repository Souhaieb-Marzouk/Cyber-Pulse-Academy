<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.008 Direct Cloud VM Connections — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.008","attackName":"Direct Cloud VM Connections","objectType":"sub-technique","severity":"HARD","topicId":"t1021.008","batch":3,"title":"T1021.008 Direct Cloud VM Connections — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":17,"passMark":70,"learn":["T1021.008 is a sub-technique of T1021 (Remote Services) in the MITRE ATT&CK Lateral Movement tactic. It describes how adversaries with valid cloud accounts reach a VM's console or shell through provider-native channels — EC2 Instance Connect, the EC2 Serial Console, SSM Session Manager, GCP serial console and IAP tunnels, and the Azure Serial Console — without ever opening inbound port 22 or 3389 on the guest.","This exam works the bypass implications and the hardening side. Because the provider brokers the session, the guest network path and its firewall are irrelevant; a serial session can run before any guest login exists, and on Windows the SAC command channel runs as SYSTEM. Public reporting documents crews that combined SIM-swapped cloud identities with serial console access to reset root passwords and pivot onward.","SOC analysts and threat hunters compare provider events such as SendSSHPublicKey, SendSerialConsoleSSHPublicKey and setMetadata against guest logs, looking for first-time enablement, out-of-window key pushes and principals that never touched the console before. Incident responders weigh break-glass console use against hostile use with the same telemetry.","Detection engineers anchor rules on MITRE's detection strategy DET0211 and its analytics, joining provider-side pushes with guest-side logins in a small time window, while applying mitigations M1042 (disable or remove the feature) and M1018 (user account management) to shrink the attack surface.","The daily risks: broad connect permissions, serial console left enabled everywhere, and trust placed in in-guest logs alone — which the console path can quietly sidestep. This exam trains judgement on near-miss distractors and evidence that points in two directions at once."],"keywords":[{"theme":"Hardening & Mitigations","items":["M1042 disable or remove feature","M1018 user account management","named IAM connect roles","break-glass dual approval","DET0211 detection strategy"]},{"theme":"Bypass Implications","items":["no inbound 22 or 3389 required","SAC command channel as SYSTEM","root password reset at console","metadata service credential pivoting","out-of-band ttyS0 logins"]},{"theme":"Telemetry & Divergence","items":["SendSSHPublicKey","SendSerialConsoleSSHPublicKey","EIC endpoint source IP vs caller IP","Azure serialPorts/connect activity","no guest network trace for serial sessions"]},{"theme":"Detection Actions","items":["alert on EnableSerialConsoleAccess","key-push spike rules","change-window joins","first-time principal checks","evidence hashing for reports"]}]}</script>

var EXAMS = [{"id":"e01","type":"mcq","title":"Prove the right session type","summary":"Pick the evidence pair that proves Instance Connect.","scenario":"Verdant Grid Utilities is preparing an incident summary. The night window shows several brokered events against instance i-0d93b7a6c5e4f2103: a key push, a Session Manager start, a console output fetch and an attribute change, all within minutes of each other. Legal wants one sentence that proves an EC2 Instance Connect session took place, not another broker path, so the evidence pair must name the push event and the login that followed it.","question":"Which evidence pair proves an EC2 Instance Connect session rather than SSM?","hint":"One event pushes the temporary key; the guest log then accepts it.","explanation":"SendSSHPublicKey followed by an accepted key login is the Instance Connect chain: the push is the API side, the accepted login is the guest side. StartSession with SessionApproved belongs to Systems Manager Session Manager, a different broker. GetConsoleOutput only pulls past boot messages and proves no live session at all, and ModifyInstanceAttribute with a tag change is housekeeping, not connectivity. Picking the wrong pair sends the report down the wrong technique path.","study":"Study the event chains that separate Instance Connect, SSM and serial console sessions.","options":["SendSSHPublicKey at 21:58, key login at 21:59","StartSession at 21:58, SessionApproved later in the trail","GetConsoleOutput at 21:58, boot messages afterwards","ModifyInstanceAttribute at 21:58, a tag change at 21:59"],"correct":0},{"id":"e02","type":"logview","title":"Divergence night on i-0d93","summary":"Read a mixed trail and guest log, then fill the note.","scenario":"The war-room panel shows one night on instance i-0d93b7a6c5e4f2103 at Verdant Grid: CloudTrail rows, guest auth lines, a metadata service query and a serial console root login. The trail's caller address and the guest's recorded source differ, which is exactly the divergence the IR lead wants explained in the note you are about to finish. Filter the sources and read the sequence before you answer.","question":"Complete the incident note with the two values from the log:","hint":"The trail records who pushed; the guest records where the login appeared.","explanation":"The first key push names user/nadia-v as the principal, and the serial session's root login landed on the console device ttyS0. The auditor-bot only reads state, finance-deploy is the role assumed afterwards, and pts/0 belongs to the earlier SSH shell, not the serial path. The guest recording a broker address while the trail names the human is the core divergence of brokered sessions: both rows are true, and only together do they attribute the session.","study":"Study joining CloudTrail principals with guest device names in one timeline.","filterable":true,"log":{"header":["time","source","detail"],"lines":["21:58:40Z  trail  SendSSHPublicKey  principal=user/nadia-v  instance=i-0d93b7a6c5e4f2103  sourceIp=52[.]94[.]76[.]10","21:59:04Z  guest  Accepted publickey for admin-nv from 18[.]206[.]107[.]24 port 44910 ssh2","22:00:11Z  guest  sudo: admin-nv : TTY=pts/1 ; COMMAND=/usr/bin/curl hxxp://169[.]254[.]169[.]254/latest/meta-data/iam/security-credentials/","22:03:26Z  trail  AssumeRole  principal=user/nadia-v  role=finance-deploy","22:05:19Z  trail  SendSerialConsoleSSHPublicKey  principal=user/nadia-v  instance=i-0d93b7a6c5e4f2103  result=success","22:05:44Z  guest  login[8812]: FAILED login on 'ttyS0'","22:06:02Z  guest  login[8830]: ROOT LOGIN on 'ttyS0'","22:09:47Z  guest  useradd: new user: name=svc-patch, UID=1013","22:10:15Z  trail  GetSerialConsoleAccessEnabled  principal=compliance-bot  result=true","22:12:33Z  guest  visudo: svc-patch added to wheel","22:15:02Z  trail  DescribeInstances  principal=user/nadia-v","22:17:28Z  trail  SendSSHPublicKey  principal=user/nadia-v  instance=i-0d93b7a6c5e4f2103  result=success"]},"widget":{"type":"fill","question":"The first key push named principal ___, and the serial root login landed on device ___.","text":"The first key push named principal ___, and the serial root login landed on device ___.","blanks":["nadia-v","ttyS0"],"bank":["nadia-v","ttyS0","compliance-bot","pts/0","finance-deploy","admin-nv"]}},{"id":"e03","type":"terminal","title":"Check the serial console state","summary":"Read the account-level switch without changing anything.","scenario":"Before writing the Verdant Grid incident summary you must confirm whether the account-level serial console switch is on in the region the sessions used. The lab shell only knows read-only cloud CLI calls; state changes, attribute edits and anything destructive would rewrite the very history you are documenting, so they stay out of bounds.","question":"Run the command that reports the account's serial console access state:","hint":"The ec2 sub-command reads the switch; the region flag pins the check to eu-west-1.","explanation":"aws ec2 get-serial-console-access-enabled reads the account-level switch for the chosen region without touching anything — exactly what an evidence review needs. enable-serial-console-access would flip the switch and fabricate new history, and modify-instance-attribute edits the instance itself; both change state during a review. describe-instances lists machines but never answers the switch question.","study":"Study the read-only checks around serial console access and their region scope.","prompt":"responder@ir-bridge:~$","skill":"aws-serial-state-check","knownTools":["aws","jq"],"expected":"aws ec2 get-serial-console-access-enabled --region eu-west-1","elements":[{"label":"the account-level state check","any":["get-serial-console-access-enabled"]},{"label":"the region flag","any":["--region"]},{"label":"the region value","any":["eu-west-1"]}],"forbidden":[{"any":["enable-serial-console-access","modify-instance-attribute"],"why":"Changing state during evidence review fabricates new history and can drop existing hardening."}],"output":["{","  \"SerialConsoleAccessEnabled\": true,","  \"ResponseMetadata\": { \"RequestId\": \"req-1c88f0aa42\" }","}"]},{"id":"e04","type":"decision","title":"Outage break-glass console use","summary":"Benign-looking alarm during a regional outage.","scenario":"04:40 — mid-outage at Verdant Grid, the SRE lead opens the serial console on a SCADA-adjacent VM because the SSM agent crashed and the network path is gone. The console alert fires at high severity, as designed. Ticket INC-88231 exists, the MFA sign-in matches the roster, and the postmortem is already scheduled. Everything says benign — and everything still needs recording.","question":"Work through the three decision steps for the outage console use:","hint":"One path forever silences a useful alarm.","explanation":"Verifying the ticket, identity and outage window first turns a scary alert into a documented event with three independent confirmations. Treating it as documented break-glass while keeping the alert live preserves the control; closing the rule as noise would silence the same alert that must catch a hostile console use next month. Tightening the break-glass role to named users with dual approval improves the control — opening the console to all engineers or removing its logging would recreate the risk the alert defends against.\n\nDefender view: break-glass paths are the highest-value thing to alert on precisely because they must stay rare, ticketed and reviewed; the alarm firing during a real outage is the system working, not a false positive to tune away.","study":"Study break-glass console procedures and alert tuning that keeps rare alarms sharp.","steps":[{"label":"STEP 1 OF 3 — verify","prompt":"Alert: serial console on a SCADA-adjacent VM at 04:40, mid-outage, SSM agent down.","question":"What do you establish first?","options":["Verify ticket, identity and the outage window","Disable the account immediately","Wipe the VM and redeploy from image"],"correct":0,"why":"Ticket, identity and window together separate documented break-glass from anything else."},{"label":"STEP 2 OF 3 — classify","prompt":"The session ran chvt and journalctl only; the postmortem is scheduled.","question":"How is this use classified and handled?","options":["Treat as documented break-glass, keep the alert live","Close the detection rule as noise forever","Escalate to HR about the SRE lead"],"correct":0,"why":"The alert stays sharp because the same signature must catch hostile use later."},{"label":"STEP 3 OF 3 — improve","prompt":"The outage is resolved and the console use is documented.","question":"Which change strengthens the control?","options":["Tighten break-glass to named users with dual approval","Open serial console to all engineers","Remove logging from the break-glass path"],"correct":0,"why":"Named users and dual approval keep the path rare and every use attributable."}]},{"id":"e05","type":"match","title":"Map the ATT&CK anchors","summary":"Match actions to mitigations and detection anchors.","scenario":"You map the ATT&CK page for T1021.008 onto concrete actions for Verdant Grid's cloud estate, so the backlog cites real mitigation and detection identifiers instead of vague promises during the quarterly review. The reviewer will check every identifier against the ATT&CK page itself, so copy the anchors exactly as published rather than from memory.","question":"Match each action to its ATT&CK mitigation or detection anchor:","hint":"Two anchors are mitigation IDs, one is a detection strategy, one is a credential defence.","explanation":"Disabling serial console where unused is M1042, Disable or Remove Feature or Program. Restricting who may connect through IAM is M1018, User Account Management. Alerting on SendSSHPublicKey spikes belongs under the detection strategy DET0211, Detection of Direct VM Console Access via Cloud-Native Methods. Requiring MFA on cloud console accounts defends the Valid Accounts precondition that the whole technique depends on. Citing the wrong anchor makes the control look unfunded and unreviewed.","study":"Study M1042, M1018 and DET0211 as the anchors behind console-access hardening.","pairs":[{"left":"Disable serial console where unused","right":"M1042 Disable or Remove Feature or Program"},{"left":"Restrict who may connect via IAM","right":"M1018 User Account Management"},{"left":"Alert on SendSSHPublicKey spikes","right":"Detection strategy DET0211"},{"left":"Require MFA on cloud console accounts","right":"Valid Accounts defence"}]},{"id":"e06","type":"fill","title":"The divergence sentence","summary":"Complete the note on guest-side blindness.","scenario":"You draft the two-sentence summary that explains, for executives, why the guest's own logs disagreed with the provider's story during the Verdant Grid incident. The note must name the log the console bypasses and the provider endpoint that the SSH-flavoured logins appear to come from.","question":"Complete the divergence note with the two values:","hint":"One blank is a log type; the other is the Instance Connect abbreviation.","explanation":"A serial console session is invisible to the guest's auth log until a login succeeds on the console device, and EC2 Instance Connect logins appear to come from the provider's EIC endpoint address rather than the operator's. The firewall is not what the console bypasses in this sentence — the point is the auth record — and NAT, DNS and sshd name other components entirely. Executives repeat these two facts to auditors, so the wording has to be exact.","study":"Study which guest records a serial console bypass and which address EIC logins carry.","text":"A serial console session is invisible to the guest's ___ log until a login succeeds on the console device, while EC2 Instance Connect logins appear to come from the provider's ___ endpoint.","blanks":["auth","EIC"],"bank":["auth","EIC","firewall","NAT","dns","sshd"]},{"id":"e07","type":"order","title":"The reported console chain","summary":"Order the chain used in public incident reports.","scenario":"Public incident reporting documents crews that obtained cloud logins through SIM-swap account resets, then reached VMs through provider consoles instead of the guest network. You order the chain as reported, so the tabletop exercise at Verdant Grid follows the documented sequence rather than guesswork.","question":"Arrange the reported chain in order:","hint":"Identity first; fresh credentials from the metadata service last.","explanation":"The chain starts with the identity: a SIM-swap reset produces a working cloud login. Enablement follows, because the account-level serial console switch must be on before any console session. The key push then opens the console path, the console login resets a root password, and the fresh credentials come last — querying the metadata service from inside the VM yields role credentials that work beyond the compromised account. Each step is the precondition of the next, which is why breaking step one or two collapses the whole chain.\n\nAttacker view: from the operator's seat, the console route is attractive because it ignores firewall rules and key rotations that would block a network login, and the metadata service turns one foothold into reusable cloud credentials.","study":"Study the identity, enablement, push, login, pivot chain from public reporting.","items":["Obtain a cloud identity through a SIM-swap reset","Enable serial console access on the account","Push a serial console key to the target VM","Log in at the console and reset a root password","Pivot to the metadata service for fresh credentials"]},{"id":"e08","type":"mcq","title":"Trusted face, odd tool","summary":"Alarming-looking use by a well-known principal.","scenario":"The platform lead at Verdant Grid — well known, MFA-protected, normally active in working hours — ran SendSerialConsoleSSHPublicKey against a build VM once and logged out. No ticket exists. In this environment the account-level serial console was disabled, and she enabled it herself three minutes before the push. Nothing else in the trail changed.","question":"Which reading fits the evidence best?","hint":"Identity lowers suspicion; enablement without a ticket still needs follow-up.","explanation":"The evidence reads as legitimate-looking, but the enablement still needs a ticket: a trusted principal using an unusual tool is exactly the pattern that must be confirmed, not waved through or punished. Automatic suspension and a VM wipe punish without evidence and destroy a working build host. Benign by identity alone ignores the un-ticketed enablement, and a trail error is implausible because console key-push events are standard CloudTrail records.","study":"Study enablement-plus-use patterns and ticketless console activity follow-up.","options":["Legitimate-looking, but the enablement still needs a ticket","Automatically malicious — suspend the account and wipe the VM now","Benign by identity alone — no further action required","A trail error, since console keys cannot be pushed at all"],"correct":0},{"id":"e09","type":"logview","title":"Azure console and SAC night","summary":"Count connects and name the console channel.","scenario":"Verdant Grid runs a hybrid estate, so the panel below mixes Azure sign-in rows, Activity Log entries and SAC console output for vm-hmi-04 during one early morning. Two identities appear, and one of them should never touch a serial console at all. Filter on the connect action, read the SAC lines, then finish the triage note.","question":"Complete the triage note with the two values from the log:","hint":"Count every serialPorts/connect row, then read the channel name in the SAC lines.","explanation":"The serialPorts/connect action appears three times, and the last caller was svc-backup — a service account with no business opening a console. ops.rivera's two connects pair with satisfied MFA sign-ins, but svc-backup's connect at 02:52 follows a no-MFA sign-in from a different address, which is the row that turns the note from routine into escalation. The SAC lines name the Windows Special Administration Console, whose cmd channel runs in SYSTEM context — the reason console use on Windows hosts deserves its own rule.","study":"Study SAC command channels and pairing Azure sign-ins with console connects.","filterable":true,"log":{"header":["time","source","detail"],"lines":["02:31:10  SignIn  user=ops.rivera@verdantgrid[.]example  MFA=satisfied  ip=81[.]2[.]69[.]142  result=success","02:31:55  ActivityLog  Microsoft.SerialConsole/serialPorts/connect/action  caller=ops.rivera@verdantgrid[.]example  vm=vm-hmi-04  result=Accepted","02:32:30  SAC  cmd channel opened by console user","02:33:01  SAC  command channel spawned (SYSTEM context)","02:36:45  SignIn  user=svc-backup@verdantgrid[.]example  MFA=none  ip=10[.]30[.]4[.]9  result=success","02:37:20  Defender  Suspicious process: whoami /priv on vm-hmi-04","02:41:02  ActivityLog  Microsoft.SerialConsole/serialPorts/connect/action  caller=ops.rivera@verdantgrid[.]example  vm=vm-hmi-04  result=Accepted","02:41:38  SignIn  user=ops.rivera@verdantgrid[.]example  MFA=satisfied  ip=81[.]2[.]69[.]142  result=success","02:44:12  guest  Security 4624 LogonType=3 user=svc-backup src=10[.]30[.]4[.]31","02:50:00  Defender  Serial console use on vm-hmi-04 — review advised","02:52:41  ActivityLog  Microsoft.SerialConsole/serialPorts/connect/action  caller=svc-backup@verdantgrid[.]example  vm=vm-hmi-04  result=Accepted"]},"widget":{"type":"fill","question":"Serial console connects appear ___ times in the Activity Log, and the last caller was ___.","text":"Serial console connects appear ___ times in the Activity Log, and the last caller was ___.","blanks":["3","svc-backup"],"bank":["3","svc-backup","ops.rivera","2","4"]}},{"id":"e10","type":"multi","title":"Controls that actually cut risk","summary":"Pick the three real mitigations, skip the traps.","scenario":"The Verdant Grid cloud council debates six proposals after the incident review. Three genuinely reduce exposure to direct cloud VM connections, two look defensive but quietly destroy evidence coverage or leave a blind spot, and one is pure convenience. Mark the three that genuinely reduce risk.","question":"Select the three proposals that genuinely reduce risk:","hint":"Shrinking logging or trusting guest logs alone are the traps.","explanation":"Disabling serial console on accounts that never use it, gating console connect rights behind named IAM roles, and alerting on EnableSerialConsoleAccess outside change windows all shrink or watch the real surface. Blocking cloud API logging shrinks the audit surface instead of the attack surface and blinds every future investigation. Trusting only in-guest SSH logs leaves the console path — the one that bypasses those logs — unwatched. Publishing the console URL adds convenience without adding a single control.","study":"Study mitigations that shrink surface versus changes that shrink visibility.","options":["Disable serial console on accounts that never use it","Gate console connect rights behind named IAM roles","Alert on EnableSerialConsoleAccess off change window","Block all cloud API logging to shrink the audit surface","Trust only in-guest SSH logs for console sessions","Publish the console URL for faster access"],"correct":[0,1,2]},{"id":"e11","type":"terminal","title":"Read the project metadata","summary":"Confirm the GCP serial console switch from logs.","scenario":"For the GCP side of the Verdant Grid case you must confirm whether the project-level metadata actually enables the interactive serial console, using a read-only gcloud call. The lab shell knows the standard cloud CLIs; deleting instances or removing metadata keys would rewrite the evidence and destroy the hardening state you are documenting.","question":"Run the command that reads the project's common metadata:","hint":"project-info describe with a format filter prints the metadata items.","explanation":"gcloud compute project-info describe with --project verdant-grid-prod and a --format filter on commonInstanceMetadata.items prints the project metadata, including serial-port-enable, without changing anything. gcloud compute instances delete destroys machines, and remove-metadata for the serial-port-enable key would delete the very setting under review — evidence work never edits the thing it documents.","study":"Study read-only gcloud project-info describe with format filters.","prompt":"responder@ir-bridge:~$","skill":"gcp-audit-metadata","knownTools":["gcloud","jq"],"expected":"gcloud compute project-info describe --project verdant-grid-prod --format='value(commonInstanceMetadata.items)'","elements":[{"label":"the project-info describe command","any":["project-info describe"]},{"label":"the project flag","any":["--project"]},{"label":"the project value","any":["verdant-grid-prod"]},{"label":"the metadata format filter","any":["--format"]}],"forbidden":[{"any":["instances delete","remove-metadata"],"why":"Deleting instances or metadata keys during review destroys evidence and removes hardening."}],"output":["commonInstanceMetadata.items:","serial-port-enable: TRUE","ssh-keys: user1:ssh-rsa AAAAB3Nza...vT9","enable-oslogin: FALSE"]},{"id":"e12","type":"decision","title":"CI runner or quiet intruder?","summary":"One-off serial push inside nightly noise.","scenario":"03:15 — SendSSHPublicKey by role ci-runner from the CI subnet against a staging VM. The trail shows this nightly for deployments, so it is baseline. The same night, a one-off SendSerialConsoleSSHPublicKey from the same role at 03:41 has no ticket, and the console device shows a failed login only, no success. Two signals, opposite readings.","question":"Work through the three decision steps for the CI runner case:","hint":"The nightly pattern is the baseline; the serial push is the one-off to explain.","explanation":"Correlating first keeps the nightly CI traffic in baseline and isolates the serial push as the true anomaly. A compromised runner would have CI job logs naming the pipeline that issued the serial command, so checking those logs before touching the runner avoids burning a shared resource on a maybe. Watching the watchlisted push while asking the pipeline owner and keeping the VM online is proportionate — stopping a staging VM mid-pipeline costs the delivery team real time, and closing the case with no record guarantees the same question returns next week.","study":"Study baselining automation noise and one-off anomalies inside the same role.","steps":[{"label":"STEP 1 OF 3 — separate","prompt":"Nightly ci-runner key pushes at 03:15; one-off serial console push at 03:41.","question":"How do you classify the two signals?","options":["Correlate the nightly pattern, then treat the serial push as the anomaly","Alert on every nightly CI key push","Ignore the serial push as CI noise"],"correct":0,"why":"Baseline explains the nightly pushes; only the serial push lacks a story."},{"label":"STEP 2 OF 3 — attribute","prompt":"The serial push has no ticket and produced a failed login only.","question":"What is the sound next check?","options":["Check CI logs for a job that ran serial console commands","Rebuild the CI runner immediately","Delete the CI role"],"correct":0,"why":"Job logs either name a misconfigured pipeline or expose a compromised runner."},{"label":"STEP 3 OF 3 — act","prompt":"No CI job admits the serial command; the owner is asleep.","question":"Which action fits while facts are thin?","options":["Watchlist the serial push, ask the pipeline owner, keep the VM online","Stop the staging VM mid-pipeline","Mark the case closed with no record"],"correct":0,"why":"A failed login only means nothing succeeded yet; watchlisting keeps the case open cheaply."}]},{"id":"e13","type":"fill","title":"Detection strategy numbers","summary":"Cite the ATT&CK detection strategy precisely.","scenario":"You write the detection brief that connects Verdant Grid's new rules to the MITRE detection strategy for direct VM console access, so the programme is auditable against ATT&CK. The brief needs the strategy identifier and the follow-on guest activity its analytic looks for.","question":"Complete the detection brief with the two values:","hint":"The strategy ID starts with DET; the analytic looks for command execution or its privilege cousin.","explanation":"MITRE's detection strategy for direct VM console access is DET0211, and its analytic looks for cloud-native logins followed by command execution or privilege escalation on the VM. DET0210 is a neighbouring number that belongs to a different strategy, and data deletion is a tactic-flavoured guess rather than what the analytic says. Quoting the real identifier keeps the mapping between your rules and ATT&CK verifiable.","study":"Study DET0211 and its analytic wording on the ATT&CK page.","text":"MITRE's detection strategy for direct VM console access is numbered ___, and its analytic looks for cloud-native logins followed by command execution or ___ on the VM.","blanks":["DET0211","privilege escalation"],"bank":["DET0211","privilege escalation","DET0210","data deletion","T1021.008","network scanning"]},{"id":"e14","type":"match","title":"Label the telemetry patterns","summary":"Match each pattern to its correct meaning.","scenario":"After the incident you label every telemetry pattern on the war-room board so the timeline reads correctly for reviewers who were not in the room. Four patterns need their meaning pinned before the draft goes out.","question":"Match each telemetry pattern to its correct meaning:","hint":"The device name and the source IP tell you which path each row took.","explanation":"A trail key push with no guest 4624 or auth line means the key was pushed but the login never completed. An accepted publickey from the EIC endpoint address means the session entered through Instance Connect. A root login on ttyS0 with zero netflow is an out-of-band serial session — no network, so no flow record. StartSession followed by SSM agent session rows is a brokered shell through Systems Manager. Mislabelling any of these breaks the timeline's credibility.","study":"Study path fingerprints: broker IP, console device, SSM session rows.","pairs":[{"left":"trail key push, guest preauth close","right":"push without completed login"},{"left":"Accepted publickey from EIC endpoint IP","right":"brokered Instance Connect session"},{"left":"ROOT LOGIN on ttyS0, zero netflow","right":"out-of-band serial session"},{"left":"StartSession then SSM agent session rows","right":"brokered shell through SSM"}]},{"id":"e15","type":"mcq","title":"Strongest attribution artefact","summary":"Pick the best evidence for a console login.","scenario":"Legal asks which artefact most strongly attributes the 01:12 serial root login on i-0d93b7a6c5e4f2103. The guest saw no network traffic, the trail names a principal with a source address and timestamp, and the serial websocket flow itself is not retained by the provider, so the panel must weigh what actually exists.","question":"Which artefact attributes the console login most strongly?","hint":"One artefact names a human before any login exists.","explanation":"The trail row naming the principal of the push is the strongest attribution, because it names the human identity that opened the path before any login existed. A netflow record with the EIC endpoint's public IP only shows infrastructure. The guest login line proves a login happened on ttyS0 but not who drove the console, and a CPU spike a minute after login proves nothing about identity at all.","study":"Study attribution strength: provider identity rows versus guest device rows.","options":["The trail row naming the principal of the push","A netflow record with the EIC endpoint's public IP","The guest login line with the ttyS0 device name","The VM's CPU spike a minute after login"],"correct":0},{"id":"e16","type":"order","title":"Build the defensible timeline","summary":"Order the timeline-building steps for the report.","scenario":"You assemble the provider-versus-guest timeline for the Verdant Grid incident report. Evidence handling comes before interpretation, and the finished file must survive scrutiny from both the regulator and the platform team, so sequence the work as a disciplined responder would.","question":"Arrange the timeline-building steps in order:","hint":"Preserve before you interpret; hashing closes the work.","explanation":"Exporting the trail rows for the whole window comes first, because without the complete provider picture nothing can be joined. Hashing and storing both log sets follows immediately, freezing the evidence before any reading. Joining events by timestamp within a two-minute window then builds the merged view. Labelling each session path — network SSH, IAP, SSM or serial — gives the timeline its structure, and flagging the divergence points for the IR lead comes last so the flags cite the frozen evidence.","study":"Study evidence-first timeline work: export, hash, join, label, flag.","items":["Export the trail rows for the whole window first","Hash and store both provider and guest log sets","Join events by timestamp within a two-minute window","Label each session path: SSH, IAP, SSM or serial","Flag the divergence points for the IR lead"]},{"id":"e17","type":"logview","title":"Ticketed week, odd Friday","summary":"Spot the out-of-window serial push.","scenario":"Verdant Grid's change record says serial console enablement was approved under ticket CHG-4012 on Monday morning between 09:00 and 18:00 and reversed under the same ticket on Thursday. The week's trail below also contains routine CI pushes and audit reads. Your tuning note needs the ticket number and the day of the push that sits outside the approved window.","question":"Complete the tuning note with the two values:","hint":"Match the enablement and disablement rows to their ticket, then find the push outside 09:00-18:00.","explanation":"Both the Monday enablement and the Thursday disablement cite ticket CHG-4012, which anchors the approved window. The Friday 02:15 serial console key push by platform/lead-v, followed by a ttyS0 root login two minutes later, sits outside that window and outside working hours — the row the rule should page on. The Tuesday 03:11 push is also out of window but carries the same approved ticket context, and the Wednesday CI push is routine baseline, which is exactly why tuning needs the ticket join rather than raw event counts.","study":"Study joining enablement events to change tickets for window-aware paging.","filterable":true,"log":{"header":["day","time","detail"],"lines":["Mon 09:02  EnableSerialConsoleAccess  principal=platform/lead-v  ticket=CHG-4012","Mon 09:05  GetSerialConsoleAccessEnabled  principal=compliance-bot  result=true","Tue 03:11  SendSerialConsoleSSHPublicKey  principal=platform/lead-v  instance=i-0d93b7a6c5e4f2103  result=failed","Tue 03:12  SendSerialConsoleSSHPublicKey  principal=platform/lead-v  instance=i-0d93b7a6c5e4f2103  result=success","Tue 03:31  guest  login[2201]: FAILED login on 'ttyS0'","Tue 03:34  guest  login[2218]: ROOT LOGIN on 'ttyS0'","Wed 14:20  SendSSHPublicKey  principal=ci-runner  instance=i-0ee11ff22aa33dd44  result=success","Thu 10:44  DisableSerialConsoleAccess  principal=platform/lead-v  ticket=CHG-4012","Fri 02:15  SendSerialConsoleSSHPublicKey  principal=platform/lead-v  instance=i-0d93b7a6c5e4f2103  result=success","Fri 02:16  guest  login[3011]: ROOT LOGIN on 'ttyS0'"]},"widget":{"type":"fill","question":"The enablement and disablement both cite ticket ___, and the out-of-window serial push happened on ___ (day).","text":"The enablement and disablement both cite ticket ___, and the out-of-window serial push happened on ___ (day).","blanks":["CHG-4012","Fri"],"bank":["CHG-4012","Fri","Mon","Tue","Thu","CHG-8823"]}}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });
}
function updateHeader(){
  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */
function renderExercise(){
  var i = curPos();
  var ex = EXAMS[i];
  S.screen = "exam";
  ensureAnswer(ex, i);
  var m = $("main");
  var res = S.checked[i];
  var lock = res != null;
  var collapsed = !lock && wordCount(ex.scenario) > 70;
  var html = '<section class="excard">';
  /* scenario block */
  html += '<div class="blk blk-scenario"><div class="blk-label"><span class="dot"></span>SCENARIO</div>' +
          '<h3 class="ex-title">' + esc(ex.title) + "</h3>";
  if(collapsed && !lock){
    html += '<p class="summary">' + esc(ex.summary) + '</p><button class="showfull" id="btn-showfull" type="button">▸ Show full scenario</button><div class="scen-body hidden" id="scen-full">' + scenInner(ex) + "</div>";
  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";
    html += '<div class="scen-body">' + scenInner(ex) + "</div>";
  }
  html += "</div>";
  /* question block */
  html += '<div class="blk blk-question"><div class="blk-label"><span class="dot"></span>QUESTION</div><p class="q-text">' + esc(ex.question) + "</p></div>";
  /* answer block */
  html += '<div class="blk blk-answer"><div class="blk-label"><span class="dot"></span>YOUR ANSWER</div><div id="ansarea">' + "</div></div>";
  /* hint + feedback slots */
  html += '<div id="hintslot"></div><div id="fbslot"></div>';
  /* actions */
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  html += '<div class="actions">' +
    '<button class="btn btn-primary" id="btn-check" type="button">' + (lock ? "✓ Checked" : "Check answer") + "</button>" +
    '<button class="btn" id="btn-next" type="button"' + (lock ? "" : " disabled") + ">" +
      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +
    "</button>" +
    '<span class="ghost-note" id="actnote"></span>' +
    "</div></section>";
  m.innerHTML = html;
  var ansArea = $("ansarea");
  renderByType(ex, ansArea, i, lock, res);
  /* hint */
  if(S.hintsUsed[i]){
    $("hintslot").innerHTML = hintHTML(ex);
  }
  if(lock){
    renderFeedback(i, res);
  } else {
    $("btn-check").addEventListener("click", onCheck);
    var sf = $("btn-showfull");
    if(sf) sf.addEventListener("click", function(){
      $("scen-full").classList.remove("hidden");
      sf.classList.add("hidden");
    });
  }
  $("btn-next").addEventListener("click", onNext);
  updateHeader();
}
function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);

          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {

          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });

function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;

  for(var z = 0; z < n; z++){

    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){

        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });

        if(!isNaN(r)) assign(z, r);
      });

  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }

        e.dataTransfer.setData("text/plain", String(c));

      });
    })(ci);
  }

function renderOrder(ex, root, ans, lock, res){

        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";

        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;

    var it = ans.seq.splice(from, 1)[0];

  }

}
