RT.fill = {
  render: function(ex, m, i){
    S.rt[i].slots = [];
    S.rt[i].filled = {};
    var parts = ex.text.split('___');
    var wrap = el('div', 'filltext');
    m.appendChild(wrap);
    function redraw(){
      wrap.innerHTML = '';
      parts.forEach(function(p, pi){
        wrap.appendChild(document.createTextNode(p));
        if (pi < parts.length - 1){
          var slot = el('button', 'slot' + (S.rt[i].filled[pi] !== undefined ? ' filled' : '') + (S.rt[i].active === pi ? ' active' : ''));
          slot.type = 'button';
          slot.textContent = S.rt[i].filled[pi] !== undefined ? S.rt[i].filled[pi] : '\u2002___\u2002';
          slot.setAttribute('aria-label', 'Blank ' + (pi + 1) + (S.rt[i].filled[pi] !== undefined ? ': ' + S.rt[i].filled[pi] : ': empty'));
          slot.addEventListener('click', function(){
            if (S.rt[i].locked) { return; }
            S.rt[i].active = pi;
            Array.prototype.forEach.call(wrap.querySelectorAll('.slot'), function(s2, k2){ s2.classList.toggle('active', k2 === pi); });
          });
          wrap.appendChild(slot);
        }
      });
    }
    redraw();
    var bank = el('div', 'bank');
    bank.setAttribute('aria-label', 'Word bank');
    bank.appendChild(el('span', 'small muted', 'Word bank: '));
    var bankSlot = el('span');
    bank.appendChild(bankSlot);
    m.appendChild(bank);
    function drawBank(){
      bankSlot.innerHTML = '';
      var used = Object.keys(S.rt[i].filled).map(function(k){ return S.rt[i].filled[k]; });
      ex.bank.forEach(function(w){
        if (used.indexOf(w) !== -1) { return; }
        var p = el('button', 'pill');
        p.type = 'button';
        p.textContent = w;
        p.addEventListener('click', function(){
          if (S.rt[i].locked) { return; }
          var act = S.rt[i].active;
          if (act === undefined || act === null){ return; }
          var oldW = S.rt[i].filled[act];
          S.rt[i].filled[act] = w;
          if (oldW !== undefined){ /* returned to bank implicitly by redraw */ }
          S.rt[i].active = null;
          drawBank(); redraw();
        });
        bankSlot.appendChild(p);
      });
      if (!bankSlot.children.length){ bankSlot.appendChild(el('span', 'muted small', '(all words placed)')); }
    }
    drawBank();
    m.appendChild(el('p', 'small muted', 'Click a blank, then click a word from the bank. Click a filled blank to clear it. Some words are distractors.'));
    wrap.addEventListener('click', function(ev){
      if (ev.target && ev.target.classList && ev.target.classList.contains('slot') && S.rt[i].filled[Array.prototype.indexOf.call(wrap.querySelectorAll('.slot'), ev.target)] !== undefined){
        var idx = Array.prototype.indexOf.call(wrap.querySelectorAll('.slot'), ev.target);
        if (S.rt[i].locked) { return; }
        delete S.rt[i].filled[idx];
        drawBank(); redraw();
      }
    });
  },
  grade: function(ex, i){
    var filled = S.rt[i].filled;
    var H = 0, W = 0, items = [];
    ex.slots.forEach(function(sl, si){
      var got = filled[si];

      if (got === undefined){ items.push({ st: 'missed', label: 'Blank ' + (si + 1) + ': <b>' + sl.correct + '</b>', note: 'you left it empty' }); }
      else if (okList.indexOf(String(got).toLowerCase()) !== -1){ H++; items.push({ st: 'correct', label: 'Blank ' + (si + 1) + ': <b>' + sl.correct + '</b>', note: 'you placed it' }); }
      else { W++; items.push({ st: 'wrong', label: 'Blank ' + (si + 1) + ': <b>' + sl.correct + '</b>', note: 'you placed "' + got + '"' }); }
    });
    return { H: H, W: W, N: ex.slots.length, items: items };
  },
  lock: function(ex, i){ S.rt[i].locked = true; }
};

    S.rt[i].pairs = {};
    var grid = el('div', 'matchgrid');
    var leftCol = el('div', 'mrow');
    var rightCol = el('div', 'mrow');
    ex.pairs.forEach(function(pr, pi){
      var lb = el('button', 'mitem');
      lb.type = 'button';
      lb.innerHTML = '<span class="pairno" data-left="' + pi + '"></span>' + pr.l;
      lb.addEventListener('click', function(){
        if (S.rt[i].locked) { return; }
        S.rt[i].activeL = pi;
        Array.prototype.forEach.call(leftCol.querySelectorAll('.mitem'), function(x, xi){ x.classList.toggle('active', xi === pi); });
      });
      leftCol.appendChild(lb);
    });
    ex.right.forEach(function(pi){
      var pr = ex.pairs[pi];
      var rb = el('button', 'mitem');
      rb.type = 'button';
      rb.innerHTML = '<span class="pairno" data-right="' + pi + '"></span>' + pr.r;
      rb.addEventListener('click', function(){
        if (S.rt[i].locked) { return; }
        var act = S.rt[i].activeL;
        if (act === undefined || act === null){ return; }
        /* remove previous pairings involving these two */
        Object.keys(S.rt[i].pairs).forEach(function(k){ if (S.rt[i].pairs[k] === pi || Number(k) === act){ delete S.rt[i].pairs[k]; } });
        S.rt[i].pairs[act] = pi;
        S.rt[i].activeL = null;
        redrawPairs();
      });
      rightCol.appendChild(rb);
    });
    function redrawPairs(){
      Array.prototype.forEach.call(grid.querySelectorAll('.mitem'), function(node){
        node.classList.remove('paired', 'active');
        var pn = node.querySelector('.pairno');
        if (pn){ pn.textContent = ''; }
      });
      Object.keys(S.rt[i].pairs).forEach(function(k){
        var l = Number(k), r = S.rt[i].pairs[k], no = l + 1;
        var lnode = leftCol.children[l], rnode = Array.prototype.filter.call(rightCol.children, function(c){ return Number(c.querySelector('.pairno').getAttribute('data-right')) === r; })[0];
        if (lnode){ lnode.classList.add('paired'); lnode.querySelector('.pairno').textContent = no + '.'; }
        if (rnode){ rnode.classList.add('paired'); rnode.querySelector('.pairno').textContent = no + '.'; }
      });
    }
    grid.appendChild(leftCol); grid.appendChild(rightCol);
    m.appendChild(grid);
    m.appendChild(el('p', 'small muted', 'Click an item on the left, then its partner on the right. Click a paired left item again to undo that pair.'));
    S.rt[i].redraw = redrawPairs;
  },
  grade: function(ex, i){
    var made = S.rt[i].pairs, H = 0, W = 0, items = [];
    ex.pairs.forEach(function(pr, pi){
      if (made[pi] === pi){ H++; items.push({ st: 'correct', label: pr.l + ' \u2192 ' + pr.r, note: 'you matched it' }); }
      else if (made[pi] !== undefined){ W++; items.push({ st: 'wrong', label: pr.l + ' \u2192 ' + pr.r, note: 'you paired it with "' + ex.pairs[made[pi]].r + '"' }); }
      else { items.push({ st: 'missed', label: pr.l + ' \u2192 ' + pr.r, note: 'you left it unpaired' }); }
    });
    return { H: H, W: W, N: ex.pairs.length, items: items };
  },
  lock: function(ex, i){ S.rt[i].locked = true; }
};

'use strict';
/* ============ T1601 exam engine — part C: drag, order, terminal, triage, branch ============ */

RT.drag = {
  render: function(ex, m, i){
    S.rt[i].place = {};
    var bank = el('div', 'bank');
    bank.setAttribute('aria-label', 'Item bank — place each item into the right zone');
    bank.appendChild(el('span', 'small muted', 'Items: '));
    var bankSlot = el('span');
    bank.appendChild(bankSlot);
    m.appendChild(bank);
    var zonesWrap = el('div', 'zones');
    var zoneEls = {};
    ex.zones.forEach(function(z){
      var zc = el('div', 'zone');
      zc.setAttribute('data-zone', z.id);
      zc.appendChild(el('h5', null, z.label));
      var list = el('div');
      zc.appendChild(list);
      zoneEls[z.id] = list;
      /* keyboard operability: focus the zone, place the selected chip with Enter/Space */
      zc.setAttribute('tabindex', '0');
      zc.setAttribute('role', 'button');
      zc.setAttribute('aria-label', 'Drop zone: ' + z.label + ' \u2014 to place an item, click or select an item first, then press Enter here');
      zc.addEventListener('keydown', function(ev){
        if (ev.key !== 'Enter' && ev.key !== ' ') { return; }
        ev.preventDefault();
        var sel = S.rt[i].selChip;
        if (sel !== undefined && sel !== null){ place(sel, z.id); }
      });
      zc.addEventListener('dragover', function(ev){ ev.preventDefault(); zc.classList.add('over'); });
      zc.addEventListener('dragleave', function(){ zc.classList.remove('over'); });
      zc.addEventListener('drop', function(ev){
        ev.preventDefault(); zc.classList.remove('over');
        var ci = Number(ev.dataTransfer.getData('text/plain'));
        if (!isNaN(ci)){ place(ci, z.id); }
      });
      zc.addEventListener('click', function(ev){
        if (ev.target !== zc && ev.target.parentNode !== zc && ev.target.parentNode !== list) { return; }
        if (ev.target !== zc && ev.target !== list) { return; }
        var sel = S.rt[i].selChip;
        if (sel !== undefined && sel !== null){ place(sel, z.id); }
      });
      zonesWrap.appendChild(zc);
    });
    m.appendChild(zonesWrap);
    m.appendChild(el('p', 'small muted', 'Drag a chip into a zone — or click a chip and then click a zone. Click the \u2715 on a placed chip to send it back.'));
    function drawBank(){
      bankSlot.innerHTML = '';
      ex.chips.forEach(function(ci){
        if (S.rt[i].place[ci] !== undefined) { return; }
        var p = el('button', 'pill');
        p.type = 'button';
        p.draggable = true;
        p.textContent = ex.items[ci].t;
        p.setAttribute('aria-label', 'Item: ' + ex.items[ci].t);
        p.addEventListener('click', function(){
          if (S.rt[i].locked) { return; }
          S.rt[i].selChip = (S.rt[i].selChip === ci) ? null : ci;
          Array.prototype.forEach.call(bankSlot.querySelectorAll('.pill'), function(x){ x.classList.toggle('selected', Number(x.getAttribute('data-ci')) === S.rt[i].selChip); });
        });
        p.setAttribute('data-ci', String(ci));
        p.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', String(ci)); p.classList.add('dragging'); });
        p.addEventListener('dragend', function(){ p.classList.remove('dragging'); });
        bankSlot.appendChild(p);
      });
      if (!bankSlot.children.length){ bankSlot.appendChild(el('span', 'muted small', '(all items placed)')); }
    }
    function place(ci, zid){
      if (S.rt[i].locked) { return; }
      S.rt[i].place[ci] = zid;
      S.rt[i].selChip = null;
      drawBank();
      Object.keys(zoneEls).forEach(function(k){
        var list = zoneEls[k];
        list.innerHTML = '';
        Object.keys(S.rt[i].place).forEach(function(cik){
          if (S.rt[i].place[cik] !== k) { return; }
          var ci2 = Number(cik);
          var p = el('span', 'pill dropped');
          p.innerHTML = ex.items[ci2].t + ' <span class="rm" role="button" aria-label="Return item to bank" tabindex="0">\u2715</span>';
          p.querySelector('.rm').addEventListener('click', function(){
            if (S.rt[i].locked) { return; }
            delete S.rt[i].place[ci2];
            drawBank(); redrawZones();
          });
          list.appendChild(p);
        });
      });
    }
    function redrawZones(){ Object.keys(zoneEls).forEach(function(k){
        var list = zoneEls[k];
        list.innerHTML = '';
        Object.keys(S.rt[i].place).forEach(function(cik){
          if (S.rt[i].place[cik] !== k) { return; }
          var ci2 = Number(cik);
          var p = el('span', 'pill dropped');
          p.innerHTML = ex.items[ci2].t + ' <span class="rm" role="button" aria-label="Return item to bank" tabindex="0">\u2715</span>';
          p.querySelector('.rm').addEventListener('click', function(){
            if (S.rt[i].locked) { return; }
            delete S.rt[i].place[ci2];
            drawBank(); redrawZones();
          });
          list.appendChild(p);
        });
      });
    }
    drawBank();
    redrawZones();
  },
  grade: function(ex, i){
    var place = S.rt[i].place, H = 0, W = 0, items = [];
    ex.items.forEach(function(it, ii){
      var got = place[ii];
      if (got === it.z){ H++; items.push({ st: 'correct', label: it.t + ' \u2192 ' + zoneLabel(ex, it.z), note: 'right zone' }); }
      else if (got !== undefined){ W++; items.push({ st: 'wrong', label: it.t + ' \u2192 ' + zoneLabel(ex, it.z), note: 'you placed it in "' + zoneLabel(ex, got) + '"' }); }
      else { items.push({ st: 'missed', label: it.t + ' \u2192 ' + zoneLabel(ex, it.z), note: 'you left it unplaced' }); }
    });
    return { H: H, W: W, N: ex.items.length, items: items };
  },
  lock: function(ex, i){ S.rt[i].locked = true; }
};
function zoneLabel(ex, zid){ var z = ex.zones.filter(function(z2){ return z2.id === zid; })[0]; return z ? z.label : zid; }

/* order + rank share one widget */
function renderOrder(ex, m, i, instruction){
  if (!S.rt[i].arr){ S.rt[i].arr = ex.rows.slice(); }
  var list = el('div', 'olist');
  m.appendChild(list);
  m.appendChild(el('p', 'small muted', instruction));
  function draw(){
    list.innerHTML = '';
    S.rt[i].arr.forEach(function(ii, pos){
      var row = el('div', 'orow');
      row.draggable = true;
      row.setAttribute('data-pos', String(pos));
      row.appendChild(el('span', 'pos', String(pos + 1) + '.'));
      row.appendChild(el('span', 'txt', ex.items[ii]));
      var mv = el('span', 'mv');
      var up = el('button', 'btn', '\u25B2'); up.setAttribute('aria-label', 'Move item up');
      up.addEventListener('click', function(){ if (S.rt[i].locked) { return; } if (pos > 0){ var a = S.rt[i].arr; var t = a[pos - 1]; a[pos - 1] = a[pos]; a[pos] = t; draw(); } });
      var dn = el('button', 'btn', '\u25BC'); dn.setAttribute('aria-label', 'Move item down');
      dn.addEventListener('click', function(){ if (S.rt[i].locked) { return; } var a = S.rt[i].arr; if (pos < a.length - 1){ var t = a[pos + 1]; a[pos + 1] = a[pos]; a[pos] = t; draw(); } });
      mv.appendChild(up); mv.appendChild(dn);
      row.appendChild(mv);
      row.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', String(pos)); });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function(){ row.classList.remove('dragover'); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault(); row.classList.remove('dragover');
        var from = Number(ev.dataTransfer.getData('text/plain'));
        var to = Number(row.getAttribute('data-pos'));
        if (isNaN(from) || S.rt[i].locked) { return; }
        var a = S.rt[i].arr;
        var moving = a.splice(from, 1)[0];
        a.splice(to, 0, moving);
        draw();
      });
      list.appendChild(row);
    });
  }
  draw();
}
function gradeOrder(ex, i){
  var arr = S.rt[i].arr, H = 0, W = 0, items = [];
  ex.items.forEach(function(txt, ii){
    var pos = arr.indexOf(ii);
    if (pos === ii){ H++; items.push({ st: 'correct', label: 'Position ' + (ii + 1) + ': <b>' + txt + '</b>', note: 'in the right place' }); }
    else { W++; items.push({ st: 'wrong', label: 'Position ' + (ii + 1) + ': <b>' + txt + '</b>', note: 'you placed it at position ' + (pos + 1) }); }
  });
  return { H: H, W: W, N: ex.items.length, items: items };
}
RT.order = {
  render: function(ex, m, i){ renderOrder(ex, m, i, 'Put the steps into the right order: drag rows, or use the arrow buttons. Position 1 is first.'); },
  grade: function(ex, i){ return gradeOrder(ex, i); },
  lock: function(ex, i){ S.rt[i].locked = true; }
};
RT.rank = {
  render: function(ex, m, i){ renderOrder(ex, m, i, 'Rank the items from most important (position 1) to least important. Drag rows, or use the arrow buttons.'); },
  grade: function(ex, i){ return gradeOrder(ex, i); },
  lock: function(ex, i){ S.rt[i].locked = true; }
};

/* ---------------- terminal emulator ---------------- */
function normCmd(s){
  return String(s || '').toLowerCase().trim().replace(/\s+/g, ' ').replace(/[;]+$/, '').trim();
}
function tokMatch(tokens, whole, pat){
  if (pat.indexOf('eq:') === 0){ return tokens.indexOf(pat.slice(3)) !== -1; }
  if (pat.indexOf('pre:') === 0){ var p = pat.slice(4); return tokens.some(function(t){ return t.indexOf(p) === 0; }); }
  if (pat.indexOf('sub:') === 0){ return whole.indexOf(pat.slice(4)) !== -1; }
  return false;
}
RT.terminal = {
  render: function(ex, m, i){
    S.rt[i].cmd = S.rt[i].cmd || '';
    var t = el('div', 'term');
    t.appendChild(el('div', 'term-head', ex.termTitle || 'device console \u2014 simulation only, nothing here touches a real device'));
    var sc = el('div', 'term-scroll');
    sc.setAttribute('role', 'log');
    sc.setAttribute('aria-live', 'polite');
    (ex.banner || []).forEach(function(b){ sc.appendChild(el('div', null, b)); });
    t.appendChild(sc);
    var row = el('div', 'term-input');
    row.appendChild(el('span', 'prompt', ex.prompt || 'Router#'));
    var inp = el('input');
    inp.type = 'text';
    inp.setAttribute('autocomplete', 'off');
    inp.setAttribute('spellcheck', 'false');
    inp.setAttribute('aria-label', 'Terminal input line');
    if (S.rt[i].cmd){ inp.value = S.rt[i].cmd; }
    inp.addEventListener('input', function(){ S.rt[i].cmd = inp.value; });
    inp.addEventListener('keydown', function(ev){
      if (ev.key !== 'Enter') { return; }
      var c = normCmd(inp.value);
      sc.appendChild(el('div', null, (ex.prompt || 'Router#') + ' ' + c));
      var out = null;
      (ex.replies || []).some(function(r){
        var toks = c.split(' ');
        if (r.any.some(function(p){ return tokMatch(toks, c, p); })){ out = r.out; return true; }
        return false;
      });
      if (out === null){ out = ex.defaultReply || '% Invalid input detected. (Simulated device)'; }
      String(out).split('\n').forEach(function(oline){ sc.appendChild(el('div', null, oline)); });
      sc.scrollTop = sc.scrollHeight;
    });
    row.appendChild(inp);
    t.appendChild(row);
    m.appendChild(t);
    if (ex.syntaxPanel){
      var sp = el('div', 'synpanel');
      sp.innerHTML = '<span class="t">Syntax reminder (example uses a different target on purpose)</span>' + ex.syntaxPanel;
      m.appendChild(sp);
    }
    if (ex.outputShape){
      var os = el('div', 'synpanel');
      os.innerHTML = '<span class="t">Expected output shape</span><pre class="codeblock">' + highlight(ex.outputShape) + '</pre>';
      m.appendChild(os);
    }
    m.appendChild(el('p', 'small muted', 'Type the command, press Enter to see the simulated output, then press Check to grade it. Formatting noise (extra spaces, capitals) is forgiven.'));
    setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 60);
  },
  grade: function(ex, i){
    var whole = normCmd(S.rt[i].cmd);
    var tokens = whole.split(' ').filter(Boolean);
    var H = 0, W = 0, items = [], dangerous = false, extra = [];
    ex.expected.elements.forEach(function(elm){
      var hit = elm.any.some(function(p){ return tokMatch(tokens, whole, p); });
      if (hit){ H++; items.push({ st: 'correct', label: '<span class="mono">' + elm.label + '</span>', note: 'present in your command' }); }
      else { items.push({ st: 'missed', label: '<span class="mono">' + elm.label + '</span>', note: 'missing from your command' }); }
    });
    (ex.expected.wrong || []).forEach(function(wr){
      var hit = wr.any.some(function(p){ return tokMatch(tokens, whole, p); });
      if (hit){
        W++;
        if (wr.dangerous){ dangerous = true; }
        items.push({ st: 'wrong', label: '<span class="mono">' + wr.label + '</span>', note: wr.msg });
      }
    });
    var pre = el('div');
    pre.innerHTML = '<p style="margin:0 0 6px"><b>Canonical command:</b></p><pre class="codeblock">' + ex.expected.canonical + '</pre>';
    var cb = el('button', 'btn copybtn', 'Copy command');
    cb.setAttribute('aria-label', 'Copy the canonical command');
    cb.addEventListener('click', function(){
      try { navigator.clipboard.writeText(ex.expected.canonical).then(function(){ cb.textContent = 'Copied \u2713'; }); }
      catch (e){ cb.textContent = 'Select and copy manually'; }
    });
    pre.appendChild(cb);
    var tbl = el('div');
    tbl.style.marginTop = '8px';
    tbl.appendChild(el('p', 'small muted', 'Part by part:'));
    ex.expected.parts.forEach(function(pt){ tbl.appendChild(itemRow('correct', '<span class="mono">' + pt.k + '</span>', pt.v)); });
    extra.push(pre); extra.push(tbl);
    if (!whole){ items.push({ st: 'wrong', label: 'You submitted an empty command', note: 'type the command before Check' }); }
    return { H: H, W: W, N: ex.expected.elements.length, items: items, dangerous: dangerous, extra: extra };
  },
  lock: function(ex, i){ var inp = document.querySelector('#widget-' + i + ' .term-input input'); if (inp){ inp.disabled = true; } S.rt[i].locked = true; }
};

/* ---------------- alert-queue triage ---------------- */
RT.triage = {
  render: function(ex, m, i){
    S.rt[i].sel = S.rt[i].sel || {};
    ex.alerts.forEach(function(a, ai){
      var c = el('div', 'alertcard');
      var t = el('div', 'atitle');
      t.innerHTML = '<span aria-hidden="true">\uD83D\uDD14</span> ' + a.title;
      c.appendChild(t);
      c.appendChild(el('div', 'ameta', a.meta));
      c.appendChild(el('div', null, a.body));
      var ab = el('div', 'optbox');
      ab.style.marginTop = '8px';
      a.options.forEach(function(o, oi){
        var b = el('button', 'opt');
        b.type = 'button';
        b.innerHTML = '<span class="key">' + String.fromCharCode(65 + oi) + '.</span><span>' + o + '</span><span class="selmark"></span>';
        b.addEventListener('click', function(){
          if (S.rt[i].locked) { return; }
          S.rt[i].sel[ai] = oi;
          Array.prototype.forEach.call(ab.children, function(x, xi){ x.classList.toggle('selected', xi === oi); x.querySelector('.selmark').textContent = xi === oi ? '\u25CF Selected' : ''; });
        });
        ab.appendChild(b);
      });
      c.appendChild(ab);
      m.appendChild(c);
    });
    m.appendChild(el('p', 'small muted', 'Choose one response per alert, then press Check. Each alert is scored as its own item.'));
  },
  grade: function(ex, i){
    var sel = S.rt[i].sel, H = 0, W = 0, items = [];
    ex.alerts.forEach(function(a, ai){
      var got = sel[ai];
      if (got === a.correct){ H++; items.push({ st: 'correct', label: a.title, note: 'right call' }); }
      else if (got !== undefined){ W++; items.push({ st: 'wrong', label: a.title, note: 'better: ' + a.options[a.correct] }); }
      else { items.push({ st: 'missed', label: a.title, note: 'no choice made — right call: ' + a.options[a.correct] }); }
    });
    return { H: H, W: W, N: ex.alerts.length, items: items };
  },
  lock: function(ex, i){ S.rt[i].locked = true; }
};

/* ---------------- branching decision tree ---------------- */
RT.branch = {
  render: function(ex, m, i){
    S.rt[i].step = S.rt[i].step || 0;
    S.rt[i].ans = S.rt[i].ans || [];
    var holder = el('div');
    m.appendChild(holder);
    var chkBtn = $('btn-check');
    function draw(){
      holder.innerHTML = '';
      ex.steps.forEach(function(st, si){
        if (si > S.rt[i].step) { return; }
        var p = el('div', 'branchstep' + (si < S.rt[i].step ? ' done' : ''));
        p.appendChild(el('span', 'stepchip', 'STEP ' + (si + 1) + ' OF ' + ex.steps.length));
        p.appendChild(el('h5', null, st.text));
        var ab = el('div', 'optbox');
        st.options.forEach(function(o, oi){
          var b = el('button', 'opt');
          b.type = 'button';
          b.innerHTML = '<span class="key">' + String.fromCharCode(65 + oi) + '.</span><span>' + o + '</span><span class="selmark"></span>';
          if (si < S.rt[i].step){ b.disabled = true; if (S.rt[i].ans[si] === oi){ b.classList.add('selected'); b.querySelector('.selmark').textContent = '\u25CF chosen'; } }
          b.addEventListener('click', function(){
            if (S.rt[i].locked || si !== S.rt[i].step) { return; }
            S.rt[i].ans[si] = oi;
            Array.prototype.forEach.call(ab.children, function(x, xi){ x.classList.toggle('selected', xi === oi); x.querySelector('.selmark').textContent = xi === oi ? '\u25CF chosen' : ''; });
          });
          ab.appendChild(b);
        });
        p.appendChild(ab);
        if (si === S.rt[i].step){
          var conf = el('button', 'btn', 'Confirm step');
          conf.style.marginTop = '8px';
          conf.setAttribute('aria-label', 'Confirm step \u2014 advances the scenario; the timer keeps running between steps');
          conf.addEventListener('click', function(){
            if (S.rt[i].ans[si] === undefined) { return; }
            S.rt[i].step = si + 1;
            draw();
            if (S.rt[i].step >= ex.steps.length && chkBtn){ chkBtn.disabled = false; }
          });
          p.appendChild(conf);
          p.appendChild(el('p', 'small muted', 'Confirming a step advances the scenario; the timer keeps running. Press Check only after the final step — only that final Check stops the timer.'));
        }
        holder.appendChild(p);
      });
      if (S.rt[i].step >= ex.steps.length){
        holder.appendChild(el('p', 'small muted', 'All steps confirmed. Press Check to grade the full decision chain.'));
      }
    }
    draw();
    if (chkBtn){ chkBtn.disabled = S.rt[i].step < ex.steps.length; }
  },
  grade: function(ex, i){
    var ans = S.rt[i].ans, H = 0, W = 0, items = [];
    ex.steps.forEach(function(st, si){
      var got = ans[si];
      if (got === st.correct){ H++; items.push({ st: 'correct', label: 'Step ' + (si + 1) + ': <b>' + st.options[st.correct] + '</b>', note: st.why }); }
      else if (got !== undefined){ W++; items.push({ st: 'wrong', label: 'Step ' + (si + 1) + ': <b>' + st.options[st.correct] + '</b>', note: 'you chose "' + st.options[got] + '". ' + st.why }); }
      else { items.push({ st: 'missed', label: 'Step ' + (si + 1) + ': <b>' + st.options[st.correct] + '</b>', note: 'no choice recorded' }); }
    });
    return { H: H, W: W, N: ex.steps.length, items: items };
  },
  lock: function(ex, i){ S.rt[i].locked = true; }
};

/* ---------------- boot ---------------- */
(function boot(){
  var sevColor = { 'easy': 'var(--sev-easy)', 'medium': 'var(--sev-medium)', 'hard': 'var(--sev-hard)', 'extremely-hard': 'var(--sev-extreme)' }[CFG.difficulty];

  $('btn-resume').addEventListener('click', doResume);

  renderTimer();
})();
