.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--bg-page);display:flex;align-items:center;justify-content:center;padding:20px}
.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .dnd{grid-template-columns:1fr}
  .matchrow{grid-template-columns:1fr}
  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.004","batch":4,"difficulty":"extremely-hard","severity":"EXTREMELY HARD","passMark":70,"estimatedMinutes":45,"mitreId":"T1553.004","mitreName":"Install Root Certificate","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.004, called Install Root Certificate, a Defense Evasion sub-technique. This is the expert tier: three or more concepts per exercise, at least one signal that contradicts another, and decisions where every option costs something.","The scenario family you will work is a real one. A rogue root that copies the name of your sanctioned TLS-inspection CA appears on three platforms within one hour. The change records say one thing, the CISO says another, and one host cannot be scoped at all because its audit trail has a hole in it.","Nothing here is a lookup. You will weigh a demand with a deadline against a change record with fingerprints, decide what may be touched now and what must stay exactly as it is, and accept the business cost of the actions you choose — including the cost of doing nothing yet.","These are the calls senior people own. Incident responders decide what evidence must survive scrutiny. SOC leads decide what gets escalated instead of executed. Threat hunters work the fleet for changes no rule ever saw. Detection engineers decide which blanket controls would break the very deployments they are meant to protect. GRC owns the MDM and GPO records that say the sanctioned root was supposed to be there.","The documented campaigns behind this sub-technique — HackingTeam's Galileo RCS, FinFisher/FinSpy, Turla's forged Microsoft root, and the Superfish adware — are part of your reasoning toolkit here, because their trade-craft is the reason fingerprint matching and evidence discipline exist.","Hints at this level only restate a constraint you may have missed. They never name the answer."],"keywords":[{"theme":"Conflicting signals","items":["name mimicry vs fingerprint identity","change-record precedence","incomplete audit data","same CN, different keys"]},{"theme":"Cost of action","items":["enterprise TLS-inspection dependency","evidence destroyed by store rebuilds","blanket blocking breaks managed deployments","reboot changes nothing"]},{"theme":"Cross-platform stores","items":["Windows machine Root store","macOS trust settings","Debian ca-certificates bundle","certificate pinning"]},{"theme":"Expert workflow","items":["escalation under time pressure","scoped containment","do-not-touch-yet decisions","documented campaign tradecraft"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can hold this incident end to end and defend every call in the review.","Exercise types in this exam: multiple choice (single answer and select-two or select-three), matching pairs, sorting cards into zones (drag and drop), fill-in-the-blank, a decision-tree scenario, and one timed simulated terminal exercise.","A countdown timer runs for 45 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit, and it restates a constraint only.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all.","The terminal exercise carries its own 4-minute limit, shown on screen when it starts. If the limit runs out, the exercise auto-submits with what you typed. Type the command, press Enter, then press Check — and remember that in this scenario nothing on that host may change."]},"exercises":[{"id":"e01","type":"single","perspective":"neutral","scenario":{"summary":"INC-5317: two roots, one name, two different keys","text":["INC-5317 opens at 03:40 on Monday. WKS-FIN-03 now lists two roots whose subject both read CN=ACME-SSL-Inspect Root CA.","Root A: fingerprint 3F:9C:44:AA:71:D0, installed 02:52:10 by the SCCM client. Root B: fingerprint 8F:2B:44:AA:71:9D, installed 03:11:07 by svc-update.exe from C:\\Windows\\Temp.","The change record CHG-7741 approves exactly one fingerprint for this window: 3F:9C:44:AA:71:D0, deployed by SCCM.","The service desk closed their check with: the name matches the change record, so both roots are sanctioned. Your lead asks whether that reading survives contact with the artefacts."],"artefacts":[{"label":"ARTEFACT 1 — machine Root store (excerpt)","kind":"code","lines":["Cert 0  Subject CN=ACME-SSL-Inspect Root CA  3F:9C:44:AA:71:D0  via ccmexec.exe 02:52","Cert 1  Subject CN=ACME-SSL-Inspect Root CA  8F:2B:44:AA:71:9D  via Temp\\svc-update.exe 03:11"]},{"label":"ARTEFACT 2 — CHG-7741 (approved fingerprint)","kind":"ticket","lines":["Approves exactly: 3F:9C:44:AA:71:D0 (ACME-SSL-Inspect Root CA)","Deployment: SCCM, window Sun 22:00-Mon 04:00, all Windows endpoints"]}]},"question":"Which reading is correct?","options":[{"id":"a","text":"Both roots are sanctioned because the change record names the same CN"},{"id":"b","text":"The fingerprints differ, so only the SCCM-deployed root is sanctioned; the Temp install is a mimic"},{"id":"c","text":"The Temp-deployed root is sanctioned because it arrived inside the approved window"},{"id":"d","text":"Both are rogue, because a store must never hold two roots with one name"}],"correct":["b"],"hint":"The change record lists one fingerprint, not one name; the record never mentions the second installer.","explain":["A subject name is free text that anyone can put in a certificate. CHG-7741 sanctions one fingerprint deployed by one installer, and Root A matches both. Root B shares only the name: different fingerprint, different installer, no record — the working profile of a mimic.","Option a is the service desk's error: a name match proves nothing. Option c falls for the window overlap, but the window sanctions the SCCM deployment, not whatever else happens to install in it. Option d invents a rule that does not exist — name collisions across unrelated roots are unusual but not impossible, and only the fingerprint evidence distinguishes here."]},{"id":"e02","type":"drag","perspective":"defender","scenario":{"summary":"Scope the MDM sweep before anyone touches a store","text":["Before any touch decision, the lead wants the overnight MDM sweep scoped: which of tonight's four questions can the MDM inventory actually answer, and which need evidence the agents cannot provide?","The estate's MDM supervises the Windows and Mac fleets and attests each host's trust payload hourly. Servers and legacy workstations have no agent at all, and MAC-DEV-01's agent has been offline since Friday.","Sort the four questions so the sweep runs once, against the right hosts, with no false confidence.","A question the agents cannot answer goes to the evidence queue — never to a guess."],"artefacts":[{"label":"ARTEFACT 1 — MDM coverage sheet, INC-5317","kind":"code","lines":["supervised, reporting hourly : WKS-FIN-01..38, MAC-FIN-01..22 (trust payload attested)","no agent installed           : DB-LNX-02, legacy kiosk builds","agent offline                : MAC-DEV-01 — last seen Friday 18:04","noise row                    : VPN-POOL-04 — vendor root renewed, vendor-signed, routine"]},{"label":"ARTEFACT 2 — lead's scoping note (bridge, 03:50)","kind":"text","lines":["Sweep once. Query what the agents attest; everything else goes to the","evidence queue with a named source. No question is answered by assumption."]},{"label":"ARTEFACT 3 — auditd excerpt, DB-LNX-02","kind":"log","filter":true,"lines":["03:26:02  PATH name=/usr/local/share/ca-certificates/zz-ops-update.crt op=CREATE","03:26:40  records 03:19-03:41 unavailable — audit log rotated mid-window","03:44:10  bundle hash no longer matches last weekly baseline"]},{"label":"ARTEFACT 4 — weekly baseline sheet (excerpt)","kind":"code","lines":["DB-LNX-02 bundle : last known-good 4c:b2:91:77:0e:5a:d3:18 (2024-05-09)","MAC fleet        : trust payload attested hourly, last sweep 03:00"]}]},"question":"Sort each question into the correct column.","zones":[{"id":"z1","label":"MDM can answer tonight — agent present and reporting","accepts":["i1","i3"]},{"id":"z2","label":"Out of MDM reach — needs another evidence source","accepts":["i2","i4"]}],"items":[{"id":"i1","text":"Which supervised endpoints report the sanctioned inspection root in their trust payload?"},{"id":"i2","text":"Whether MAC-DEV-01's trust settings changed since Friday, with its agent offline?"},{"id":"i3","text":"Which of the SCCM-deployed payloads carry the CHG-7741 fingerprint?"},{"id":"i4","text":"What DB-LNX-02's bundle held before tonight, with no agent on the host?"}],"hint":"The coverage sheet's last column decides; an offline agent is not a reporting agent.","explain":["Questions 1 and 3 are answerable tonight: supervised hosts attest their trust payloads hourly, and the payload is exactly where both the sanctioned root and its approved fingerprint appear. The sweep answers them by query, not by footsteps.","Questions 2 and 4 are out of MDM's reach. An offline agent reports nothing, so MAC-DEV-01's trust state needs an out-of-band check — a local collection under the legal hold, or the host's own logs. DB-LNX-02 has no agent at all; its pre-change bundle state exists only in the weekly baseline and the audit trail, and the rotated window makes the audit trail partial. Scoping the sweep first stops the team from treating 'no answer' as 'no problem'."]},{"id":"e03","type":"match","perspective":"neutral","scenario":{"summary":"Host scoping table for the 09:00 board call","text":["The review board wants the INC-5317 scoping table before the 09:00 call, and the chair rejects any row that claims more than its evidence supports.","Four hosts appear in the case file tonight; each is in a different evidentiary state.","Match each host to the scoping statement its evidence actually supports — no stronger."],"artefacts":[{"label":"ARTEFACT 1 — case-file artefact index, INC-5317","kind":"code","lines":["EX-A  EDR event, WKS-FIN-03    svc-update.exe installed the mimic root at 03:11","EX-B  MDM row, MAC-DEV-01      inventory agent offline since Friday 18:04","EX-C  auditd row, DB-LNX-02    bundle hash differs from weekly baseline","EX-D  openssl dump             suspect file, CA:TRUE, self-signed"]},{"label":"ARTEFACT 2 — MDM trust-store inventory (excerpt)","kind":"code","lines":["WKS-FIN-01..38   OK — matches CHG-7741          (36 identical rows omitted)","VPN-POOL-04      OK — vendor root renewed       (vendor-signed, routine)","DB-LNX-02        NOT MDM-MANAGED                no agent installed","MAC-DEV-01       INVENTORY AGENT OFFLINE        last seen Friday 18:04"]},{"label":"ARTEFACT 3 — containment approval (ticket excerpt)","kind":"ticket","lines":["INC-5317 approval 03:58: rogue root B on WKS-FIN-03 — contained, removal","queued as a controlled change after evidence capture. Owner: IR lead."]},{"label":"ARTEFACT 4 — auditd excerpt, DB-LNX-02","kind":"log","filter":true,"lines":["03:26:02  PATH name=/usr/local/share/ca-certificates/zz-ops-update.crt op=CREATE","03:26:40  records 03:19-03:41 unavailable — audit log rotated mid-window"]}]},"question":"Match each host to the scoping statement its evidence supports.","pairs":[{"left":"WKS-FIN-03","right":"Scoped: rogue root named, installer identified, containment already approved"},{"left":"MAC-DEV-01","right":"Unscoped: attestation offline since Friday; the trust state could be anything"},{"left":"DB-LNX-02","right":"Half-scoped: the store change is proven, the actor is not, pending the rotated logs"},{"left":"VPN-POOL-04","right":"Out of scope: a vendor root renewed on the vendor's own schedule, no incident signal"}],"hint":"Three rows in the inventory answer themselves; the two hosts with agent or audit problems are the ones the wording must be careful about.","explain":["WKS-FIN-03 is the only host with a full chain: the EDR event names the installer, the store diff names the root, and the 03:58 approval covers containment — the strong wording is earned.","MAC-DEV-01 attests nothing while its agent is offline, so any claim about its trust state would be invention; it stays unscoped. DB-LNX-02 sits between the two: the hash mismatch proves the store changed, but the rotated audit window hides the actor, so the honest row is half-scoped. VPN-POOL-04 is the noise row — a vendor root on the vendor's schedule, no signal, out of scope entirely. The chair's rule is exactly this: each row is as strong as its artefact, and no stronger."]},{"id":"e04","type":"blank","perspective":"defender","scenario":{"summary":"Two sentences the incident record still needs","text":["The INC-5317 record must survive legal review, so two sentences must be exact.","Legal sent a preservation instruction at 03:44; the log team has opened a recovery ticket for the rotated window.","Fill both blanks in the record."],"artefacts":[{"label":"ARTEFACT 1 — legal preservation instruction (03:44)","kind":"text","lines":["From legal, 03:44: preserve the trust store, its logs, and the suspect","file exactly as found. Nothing is rebuilt, deleted, or re-typed pending review."]},{"label":"ARTEFACT 2 — record style guide (excerpt)","kind":"text","lines":["Style rule R1: unsupported facts stay unstated until sourced.","Style rule R2: state the preservation status in the record's first line."]},{"label":"ARTEFACT 3 — log-team reply (04:05)","kind":"text","lines":["Records 03:19-03:41 rotated off-host; recovery ticket LOG-8841 opened;","no ETA given until the archive tier answers."]},{"label":"ARTEFACT 4 — evidence register (excerpt)","kind":"code","lines":["suspect file  zz-ops-update.crt : copied, hash recorded","store state   as found, no rebuild","actor         attribution pending LOG-8841"]}]},"question":"Complete the two record sentences.","blanks":[{"before":"From 03:44 the store, its logs, and the suspect file are under ","after":" until the review closes — the record states the preservation status in its first line.","answer":["legal hold","litigation hold","preservation hold","hold"],"hint":"the two-word preservation instruction legal sent at 03:44"},{"before":"The audit gap on DB-LNX-02 means the install actor remains ","after":" until the rotated logs are recovered — state it plainly in the record.","answer":["unknown","unconfirmed"],"hint":"the honest word for a fact you cannot yet support"}],"hint":"One blank names the preservation status legal's instruction creates; the other is the honest word for a fact nobody can support yet.","explain":["The first line names the hold because everything downstream depends on it: with the store, the logs, and the file under legal hold, no rebuild, deletion, or 'cleanup' can touch them without breaking the instruction. The wording matters — a hold is a status with an owner and an end condition, not a mood.","The second sentence is honesty under pressure: with the audit window rotated away, the actor is unknown until LOG-8841 returns the records. A record that overclaims gets picked apart in review; one that states the gap — and names the ticket that will close it — survives scrutiny. Both sentences exist so tomorrow's actions are judged against what was known at 03:44, not against what was hoped."]},{"id":"e05","type":"multi","perspective":"attacker","scenario":{"summary":"The operator's payoff on the payment path","text":["Payment middleware on DB-LNX-02 consumes the system trust store. The zz-ops-update.crt root is installed and the bundle has been rebuilt.","The middleware has no pin list, and the pipeline rebuilds the bundle from the anchors directory on every release train.","For the threat model, state which outcomes the operator has actually purchased. Select the THREE real ones."],"artefacts":[{"label":"ARTEFACT 1 — middleware runbook excerpt, DB-LNX-02","kind":"code","lines":["pay-core 43.2 — reads /etc/ssl/certs/ca-certificates.crt at start","no pin list configured; vendor doc: 'trust follows the operating system bundle'","nightly container rebuild pulls host trust anchors at image build"]},{"label":"ARTEFACT 2 — payment-path observations, rogue window","kind":"log","filter":true,"lines":["terminal app : 4,112 sessions — 0 established to the fake host","pay-core     : 37 sessions to 203[.]0[.]113[.]66 — TLS handshake OK, no warning path","proxy        : decrypted flows logged per CHG-7741 risk annex","printer subsystem renewed its pairing certificate (routine)"]},{"label":"ARTEFACT 3 — anchors directory listing","kind":"code","lines":["zz-ops-update.crt — present since 03:26 — not owned by the package pipeline","ca-certificates.crt — rebuilt 03:41 and 03:44 (two rebuilds tonight)"]},{"label":"ARTEFACT 4 — package pipeline note","kind":"text","lines":["Tonight's release train rebuilds the bundle from the anchors directory as its","last step, by design. Repository signatures are verified separately before install."]}]},"question":"Select the THREE outcomes the operator has enabled on the payment path.","options":[{"id":"a","text":"The middleware now accepts chain certificates the attacker's CA signed"},{"id":"b","text":"The Debian package pipeline installs attacker-signed packages without repo checks"},{"id":"c","text":"Interception of the payment flow runs with no browser-style warning"},{"id":"d","text":"The rogue trust survives the pipeline rebuilds that read the anchors directory"},{"id":"e","text":"Kernel modules now load without signature verification"}],"correct":["a","c","d"],"hint":"Three outcomes follow from what the host now believes about certificates and from what the pipeline rebuilds; two describe mechanisms that never consult this store.","explain":["Option a: the middleware validates chains against the system bundle, so chains the attacker's CA signed now pass. Option c: with no pin list and no browser in the path, interception of the payment flow runs silently — the observations show pay-core completing handshakes to the unknown host with nothing to stop it.","Option d is the persistence twist the runbook makes explicit: the anchors directory still holds zz-ops-update.crt, so every package rebuild and every container build re-imports the rogue trust. Removing it means deleting the anchor file first — a rebuild alone restores the rogue.","Options b and e are decoys from different mechanisms: the Debian pipeline verifies repository signatures separately from TLS trust, so a root install enables no packages, and kernel module loading is governed by module signature checks, not by the certificate store."]},{"id":"e06","type":"drag","perspective":"neutral","scenario":{"summary":"Proposed actions on the war room wall","text":["The war room wall has four proposed actions for INC-5317. Some preserve what the case needs; some destroy it or break the business.","Sort each proposal by its true nature."],"artefacts":[{"label":"ARTEFACT 1 — case-file status, 03:44","kind":"code","lines":["suspect zz-ops-update.crt : copied to case share? NO — copy pending","bundle                    : tampered state intact (hash off baseline)","timeline                  : open — no baseline fingerprint recorded yet","deployment tool           : running fleet-wide; SCCM push scheduled tonight 22:00"]},{"label":"ARTEFACT 2 — auditor's standing question","kind":"text","lines":["Asked at every INC close since the 2023 finding: 'Could you prove what","the store looked like before you touched it?'"]},{"label":"ARTEFACT 3 — scheduled fleet push (change notice)","kind":"ticket","lines":["Tonight 22:00: scheduled fleet push requires the deployment client on all","endpoints. Blocking the binary defers the push and Monday's patches with it."]},{"label":"ARTEFACT 4 — weekly baseline sheet (excerpt)","kind":"code","lines":["DB-LNX-02 bundle : last known-good 4c:b2:91:77:0e:5a:d3:18 (2024-05-09)","current state    : mismatch — tampered bundle still in place, unrecorded"]}]},"question":"Sort each proposed action into the correct column.","zones":[{"id":"z1","label":"Evidence-preserving","accepts":["i1","i3"]},{"id":"z2","label":"State-changing or business-breaking","accepts":["i2","i4"]}],"items":[{"id":"i1","text":"Copy the suspect certificate file into the case share exactly as it is now"},{"id":"i2","text":"Rebuild the trust bundle tonight so the store looks clean for the auditors"},{"id":"i3","text":"Record the sanctioned root's fingerprint from the change record in the timeline"},{"id":"i4","text":"Block the deployment tool's binary fleet-wide tonight as an emergency control"}],"hint":"Anything that rebuilds, deletes, or blocks fleet-wide tonight touches state the case needs untouched.","explain":["Copying the suspect file and recording the sanctioned fingerprint both add to the record without changing the world — evidence-preserving by definition.","Rebuilding the bundle overwrites the tampered state before anyone captured it, which is evidence destruction with a tidy face. The fleet-wide binary block sounds decisive but breaks every managed deployment that legitimately uses that tool tonight, converting one incident into an outage plus an incident."]},{"id":"e07","type":"branch","perspective":"defender","scenario":{"summary":"The CISO's ten-minute demand","text":["The CISO joins the bridge: every root we did not sign, gone in ten minutes, so the store is clean for the auditors.","CHG-7741 says the inspection root belongs there. The reconcile batch runs in two hours through that inspection path.","Answer for the lead, who will execute whatever you say next."]},"question":"Choose the correct option at each step.","branch":{"steps":[{"prompt":"CISO: 'remove every non-Microsoft root in ten minutes.' Your first sentence on the bridge?","options":[{"id":"a","text":"Executing now — removing all third-party roots including the inspection CA"},{"id":"b","text":"Sanctioned under CHG-7741 — blanket removal breaks the batch; give me thirty minutes"},{"id":"c","text":"We will remove roots only on the two workstations and say nothing about the rest"}],"correct":"b","outcome":"The CISO reads the change record and agrees to a scoped list instead of a blanket sweep."},{"prompt":"DB-LNX-02's install actor is unknown and its audit window has a gap. What is defensible?","options":[{"id":"a","text":"Rebuild its trust bundle now so the host is clean before the batch"},{"id":"b","text":"Copy the certificate and hash to evidence; contain the host without store changes"},{"id":"c","text":"Trust it for now because payment must keep running at any cost"}],"correct":"b","outcome":"Evidence is preserved and the host is contained; no store change destroys the actor question before the logs return."},{"prompt":"The auditors want a clean store by morning. What goes in the status update?","options":[{"id":"a","text":"All unknown roots removed; incident closed"},{"id":"b","text":"Rogue contained on named hosts; sanctioned CA untouched by design; removal scheduled"},{"id":"c","text":"Waiting for the attacker to act again before we respond"}],"correct":"b","outcome":"The auditors get a record that shows discipline instead of a store that looks clean and a case that cannot be proven."}],"final":{"question":"Which closing decision will survive the post-incident review?","options":[{"id":"a","text":"Everything not vendor-signed was removed inside the ten minutes, evidence be damned"},{"id":"b","text":"Sanctioned roots stayed; rogue roots contained and queued; the audit gap documented"},{"id":"c","text":"Nothing was touched anywhere and the store is left exactly as found, permanently"}],"correct":["b"]}},"hint":"The removal that satisfies the demand in ten minutes is the same removal that breaks the batch — and the audit gap outranks anyone's patience.","explain":["Every fork here trades speed for defensibility. The change record outranks the demand, the evidence on the unscopable host outranks the cleanup optics, and the status update that names what was deliberately NOT touched is the one the review accepts.","The blanket sweep option breaks the inspection path and destroys the Linux evidence in one move. The do-nothing option leaves a rogue CA trusted with no containment. The defensible line runs between them: contain what is proven, preserve what is not yet understood, and schedule the rest."]},{"id":"e08","type":"match","perspective":"defender","scenario":{"summary":"Why each payment-path component held — or did not","text":["The RFC's residual-risk section must map each component on the payment path to the reason it held or the reason it did not, with no component left unmapped.","Two apps shared the same rogue window and reached opposite verdicts; the sanctioned inspection root sits beside them with a verdict of its own.","Match each component to the reason the record gives."],"artefacts":[{"label":"ARTEFACT 1 — payment-path observations, rogue window","kind":"log","filter":true,"lines":["terminal app : connection to the fake host REJECTED at handshake — no chain consultation logged","pay-core     : 37 sessions to 203[.]0[.]113[.]66 — TLS handshake OK","proxy        : decrypted flows logged per CHG-7741 risk annex","printer subsystem renewed its pairing certificate (routine)"]},{"label":"ARTEFACT 2 — pay-core configuration excerpt","kind":"code","lines":["pin list  : none","trust     : system bundle (/etc/ssl/certs/ca-certificates.crt)","restart   : nightly, container image rebuild"]},{"label":"ARTEFACT 3 — CHG-7741 risk annex (excerpt)","kind":"ticket","lines":["Annex A: business accepts that the inspection proxy reads decrypted TLS","on the reconcile path. Approved fingerprint 3F:9C:44:AA:71:D0."]},{"label":"ARTEFACT 4 — RFC §7 requirement (draft note)","kind":"text","lines":["Section 7 maps every component to why it held or why it did not.","Components left unmapped are returned to the author."]}]},"question":"Match each component to the reason the record gives.","pairs":[{"left":"Payment terminal during the rogue window","right":"Held: the app checks the server certificate itself, so the store's new root never entered its decision"},{"left":"Payment middleware (pay-core)","right":"Failed: it consumes the system bundle with no independent check, so the mimic's chains validated silently"},{"left":"Sanctioned inspection root","right":"By design: the business accepted proxy reads of that path in writing — a risk, not an incident"},{"left":"Mimic sharing the sanctioned root's CN","right":"Not by design: with no record behind it, the same read becomes tampering"}],"hint":"Two components faced the same rogue root and reached opposite verdicts; the other two rows differ by exactly one thing — the record behind the read.","explain":["The terminal rejected the fake host at handshake without consulting the chain: that is an app-level check failing closed, which is why it held while the middleware fell. pay-core reads the system bundle with no pin list, so the mimic's chains validated silently — the 37 sessions in the observations are the receipt.","The inspection root's reads are the accepted trade-off written into CHG-7741's annex — a risk the business owns, not an incident. The mimic has no record, so the identical observation against it is tampering. One document separates a controlled risk from a breach, which is exactly what section 7 must say."]},{"id":"e09","type":"match","perspective":"neutral","scenario":{"summary":"Risk class of the commands in the case-file register","text":["The case file's command register lists four commands seen across INC-5317, each requested by a different team at a different moment.","The auditor's question for each is the same: did it preserve, restore, or destroy case state — or none of those?","Match each command to its risk class so the triage table is honest."],"artefacts":[{"label":"ARTEFACT 1 — case-file command register (INC-5317)","kind":"code","lines":["03:41  openssl x509 -in zz-ops-update.crt -noout -text   (evidence shell, ir@)","03:52  ops proposal: update-ca-certificates --fresh on DB-LNX-02","04:10  pipeline run: update-ca-certificates (plain) — release train, logged","04:30  service desk: certutil -delstore Root on WKS-FIN-03 — pending approval"]},{"label":"ARTEFACT 2 — store state note","kind":"text","lines":["WKS-FIN-03: rogue root still trusted; listing captured 03:44.","DB-LNX-02: bundle tampered; anchor file present."]},{"label":"ARTEFACT 3 — package-pipeline note","kind":"text","lines":["Release-train rebuilds run from the repo with vendor anchors refreshed","first; every run is logged and reversible."]},{"label":"ARTEFACT 4 — auditor's question (verbatim)","kind":"text","lines":["'For each command in the register: did it preserve, restore, or destroy","case state — or none of those?'"]}]},"question":"Match each command to its risk class.","pairs":[{"left":"update-ca-certificates --fresh (ops proposal, 03:52)","right":"Evidence question: rebuilds from scratch and overwrites the tampered bundle the case still needs"},{"left":"update-ca-certificates, plain (pipeline, 04:10)","right":"Routine rebuild: logged, reversible, inside the package pipeline's own schedule"},{"left":"certutil -delstore Root <serial> (service desk, 04:30)","right":"Removal question: after deletion, what the store held is provable only from captured listings"},{"left":"openssl x509 -noout -text (evidence shell, 03:41)","right":"Evidence-safe: reads one file, changes nothing — already on the record"}],"hint":"Same tool, different moment and different mode: the register's timestamps and requesters separate a pipeline's own rebuild from a case-time intervention.","explain":["The --fresh proposal is the dangerous one: it rebuilds from scratch, which overwrites the tampered bundle — and the tampered bundle is the evidence that proves what the attacker left behind. That decision belongs to the case file, not to cleanup optics.","The plain pipeline rebuild is routine: it runs on the release train's schedule, logged and reversible, with vendor anchors refreshed first. The delstore proposal is a removal question — legitimate containment once approved, but after it runs, the store's prior contents are provable only from the captured listings, which is why the 03:44 capture matters. The openssl command is evidence-safe and already executed. One tool family, four different relationships to the case."]},{"id":"e10","type":"single","perspective":"dual","scenario":{"summary":"Ten minutes on the bridge: what do you actually do?","text":["INC-5317, 03:44. Three platforms are implicated within one hour, the CISO is on the bridge with a ten-minute demand, and the auditors arrive in the morning.","You cannot scope MAC-DEV-01 (inventory agent offline since Friday) and you cannot attribute the Linux install (audit gap). The finance reconcile batch runs through the sanctioned inspection path in two hours.","Read the artefacts, then make the call you will defend."],"artefacts":[{"label":"ARTEFACT 1 — EDR process event, WKS-FIN-03","kind":"log","filter":true,"lines":["03:11:07  EventID=1  Image=C:\\Windows\\Temp\\svc-update.exe  User=ACME\\svc_finrep","CommandLine=\"certutil\" -addstore Root C:\\Windows\\Temp\\zz-upd.cer","Cert fingerprint 8F:2B:44:AA:71:9D — subject copies the sanctioned CN"]},{"label":"ARTEFACT 2 — change record CHG-7741","kind":"ticket","lines":["Approves exactly: 3F:9C:44:AA:71:D0 (ACME-SSL-Inspect Root CA)","Deployment: SCCM, window Sun 22:00-Mon 04:00, 40 endpoints, owner network-team@acme[.]example"]},{"label":"ARTEFACT 3 — MDM trust-store inventory (excerpt)","kind":"code","lines":["WKS-FIN-01..38   OK — matches CHG-7741          (36 identical rows omitted)","VPN-POOL-04      OK — vendor root renewed       (vendor-signed, routine)","DB-LNX-02        NOT MDM-MANAGED                no agent installed","MAC-DEV-01       INVENTORY AGENT OFFLINE        last seen Friday 18:04"]},{"label":"ARTEFACT 4 — auditd excerpt, DB-LNX-02","kind":"log","filter":true,"lines":["03:26:02  PATH name=/usr/local/share/ca-certificates/zz-ops-update.crt op=CREATE","03:26:40  records 03:19-03:41 unavailable — audit log rotated mid-window","03:44:10  bundle hash no longer matches last weekly baseline"]},{"label":"ARTEFACT 5 — CISO message on the bridge","kind":"text","lines":["INC-5317: remove every root we did not sign, in the next 10 minutes.","I want a clean store for the auditors. Finance can live with one bad night."]}]},"question":"You have ten minutes. What do you do?","options":[{"id":"a","text":"Remove the ACME-SSL-Inspect root fleet-wide now — it satisfies the demand in one move"},{"id":"b","text":"Freeze evidence, keep the sanctioned CA, mark the unverified hosts, escalate a scoped plan"},{"id":"c","text":"Remove the two rogue roots, close INC-5317 as contained, and let the audit gap become tomorrow's problem"},{"id":"d","text":"Reboot all three hosts before the auditors arrive so the trust changes flush"}],"correct":["b"],"hint":"The demand has a deadline, but two records in the artefacts outrank the deadline — and one host cannot be scoped at all yet.","explain":["Attacker perspective: the operator bought a trusted CA with a copied name, a silent interception position on the middleware path, and a response primed to delete the sanctioned root in a panic — the demand for speed is part of the tradecraft.","Defender perspective: the counter is to change as little as possible while the case is incomplete — evidence frozen, the sanctioned root protected by its change record, the two unscopable hosts marked honestly, and a scoped removal plan escalated with the business impact of every line named.","Option a executes the CISO's exact mistake — it breaks the inspection path the reconcile batch needs and deletes a root the auditors will see in CHG-7741. Option c closes an incident that is not scoped: MAC-DEV-01 has no data and the Linux actor is unknown. Option d is theatre — trust-store changes survive reboots, so it costs the volatile state and buys nothing."]},{"id":"e11","type":"drag","perspective":"defender","scenario":{"summary":"Custody labels for tonight's evidence movement","text":["Three artefacts leave DB-LNX-02 tonight and one record entry is made; legal wants every movement labelled before it enters the case share.","The label decides what may happen to the item afterwards: sealed items stay frozen, working items may be opened, and reference items point at documents instead of the host.","Sort the four movements by the label each must carry."],"artefacts":[{"label":"ARTEFACT 1 — custody label stock (case share)","kind":"code","lines":["SEALED-PRIMARY : collector, time, hash — opening voids the seal","WORKING        : derived-from <seal id> — lab use allowed","REFERENCE      : source <document id> — not an artefact of the host"]},{"label":"ARTEFACT 2 — evidence register, DB-LNX-02","kind":"code","lines":["zz-ops-update.crt — copied 03:47, sha256 recorded","store listing — captured 03:44, pre-change","CHG-7741 fingerprint — quoted from ticket","lab request — one openable copy, logged 04:02"]},{"label":"ARTEFACT 3 — legal note (04:10)","kind":"text","lines":["Primaries are frozen until the review closes; everything else must derive","from a primary and name its source."]},{"label":"ARTEFACT 4 — auditd excerpt, DB-LNX-02","kind":"log","filter":true,"lines":["03:26:02  PATH name=/usr/local/share/ca-certificates/zz-ops-update.crt op=CREATE","03:26:40  records 03:19-03:41 unavailable — audit log rotated mid-window"]}]},"question":"Sort each movement into the correct column.","zones":[{"id":"z1","label":"Sealed primary — frozen, hash on the label","accepts":["i1","i3"]},{"id":"z2","label":"Working copy — lab may open it","accepts":["i2"]},{"id":"z3","label":"Reference — points at records, not at the host","accepts":["i4"]}],"items":[{"id":"i1","text":"The byte-for-byte copy of zz-ops-update.crt, hash written on the label"},{"id":"i2","text":"The second copy the malware lab requested for opening"},{"id":"i3","text":"The 03:44 store listing captured before any change"},{"id":"i4","text":"The approved fingerprint quoted from CHG-7741 into the timeline"}],"hint":"Two items are the host's own state frozen in time; one exists to be opened; one was never on the host at all.","explain":["The byte-for-byte file copy and the pre-change store listing are the host's state frozen in time — both travel as sealed primaries, hash and collector on the label, and nothing opens them until the review closes.","The lab copy exists to be opened, so it travels as a working item carrying the seal id it came from. The fingerprint was never on the host: it is quoted from CHG-7741, so it is reference material that points at a document. Labelling this way is what lets the review answer 'could you prove what the store looked like?' with an artefact instead of a memory."]},{"id":"e12","type":"terminal","perspective":"defender","scenario":{"summary":"Timed terminal: record the suspect certificate without touching anything","text":["INC-5317 evidence shell on DB-LNX-02. The IR lead's instruction is precise: before anyone changes this store, the suspect certificate's details go on the record — version, issuer, subject, validity, extensions.","The audit gap means this file may be the only artefact that names the actor's CA. One team member has already proposed rebuilding the bundle to 'clean up' — that request is refused in writing.","Choose the command that prints the certificate's details while changing nothing on this host. You have four minutes on this exercise; the shell itself stays read-only."]},"question":"Type the read-only command that prints the suspect certificate's details.","terminal":{"prompt":"ir@DB-LNX-02","banner":["Ubuntu 22.04 LTS — INC-5317 evidence shell","read-only triage: nothing you type here may change the host"],"solution":"openssl x509 -in /usr/local/share/ca-certificates/zz-ops-update.crt -noout -text","elements":[{"label":"tool openssl","re":"^openssl( |$)"},{"label":"x509 subcommand","re":"(^| )x509( |$)"},{"label":"-noout (print nothing beyond the request)","re":"(^| )-noout( |$)"},{"label":"-text (full certificate details)","re":"(^| )-text( |$)"},{"label":"suspect file zz-ops-update.crt","re":"zz-ops-update\\.crt( |$)"}],"outputs":[{"re":"openssl x509 .*-noout","lines":["Certificate:","    Data:","        Version: 3 (0x2)","        Serial Number: 1a:4f:9c:02:77:3b","        Signature Algorithm: sha256WithRSAEncryption","        Issuer: CN = ACME-SSL-Inspect Root CA","        Subject: CN = ACME-SSL-Inspect Root CA","        Validity","            Not Before: May 14 03:20:00 2024 GMT","            Not After : May 12 03:20:00 2026 GMT","        X509v3 Basic Constraints: critical","                CA:TRUE"]},{"re":"^sha256sum","lines":["a7f3c1d9e5b244aa71  /usr/local/share/ca-certificates/zz-ops-update.crt"]},{"re":"^openssl$","lines":["openssl: no input file specified — nothing printed"]}],"nearMiss":[{"re":"(^| )update-ca-certificates( |$)","msg":"This rebuilds the trust bundle — it overwrites the tampered state you were ordered to preserve as evidence."},{"re":"(^| )update-ca-trust( |$)","msg":"This rebuilds the RHEL bundle — same evidence problem, and this host is Debian-family anyway."},{"re":"^rm\\s+","msg":"Deleting the file destroys the primary artefact of this case."}],"nearMissSample":"update-ca-certificates --fresh","partialSample":"sha256sum /usr/local/share/ca-certificates/zz-ops-update.crt","timeLimit":240},"hint":"Nothing on this host may change before the evidence copy exists, and the asked-for output is the certificate's details, not its hash.","explain":["The canonical command is openssl x509 -in /usr/local/share/ca-certificates/zz-ops-update.crt -noout -text: the openssl tool, the x509 subcommand, the input file, -noout so nothing beyond the requested details is printed, and -text for the full human-readable dump. It reads one file and changes nothing.","Hashing the file is useful and safe, but a hash is not the details the IR lead asked to record. The rebuild commands are the near miss the war room nearly executed: they overwrite the tampered bundle, and with the audit gap already eating the timeline, the rebuilt store would erase the best remaining evidence. Deleting the file is worse still."]},{"id":"e13","type":"multi","perspective":"defender","scenario":{"summary":"Hardening proposals: which two can actually ship?","text":["Post-incident, four hardening proposals reach the change board. The estate runs SCCM-managed Windows, GPO baselines, MDM-supervised Macs, and a Debian package pipeline that legitimately rebuilds the bundle on every release train.","Select the TWO proposals that can ship without breaking the estate."],"artefacts":[{"label":"ARTEFACT 1 — estate constraints, change board","kind":"text","lines":["SCCM client pushes nightly from its own client paths","Debian pipeline rebuilds the trust bundle on every release train, by design","MDM supervises the Macs; trust payloads attested hourly","Inspection CA carries the CHG-7741 risk annex, business-accepted"]},{"label":"ARTEFACT 2 — proposal owners (agenda excerpt)","kind":"code","lines":["P1 certutil path allow-list      — detection engineering","P2 fleet-wide certutil block     — GRC","P3 trust-write alert outside deploy windows — SOC","P4 remove corporate inspection CA — network"]},{"label":"ARTEFACT 3 — calendars (excerpt)","kind":"code","lines":["release trains : Tue/Thu 21:00 — bundle rebuild is the last step","SCCM push window : nightly 22:00-04:00"]},{"label":"ARTEFACT 4 — chair's instruction","kind":"text","lines":["For each proposal, name the estate fact it depends on. Proposals that","break a named estate fact do not ship."]}]},"question":"Select the TWO proposals that can ship here.","options":[{"id":"a","text":"Allow-list rule: certutil.exe may run only from system and SCCM client paths"},{"id":"b","text":"Fleet-wide block of certutil.exe so no trust tampering can run at all"},{"id":"c","text":"Baseline rule: alert on any trust-store write outside approved deploy windows"},{"id":"d","text":"Remove the corporate inspection CA so attackers cannot copy its name"}],"correct":["a","c"],"hint":"The Debian pipeline legitimately rebuilds the bundle every release train, and SCCM ships through its own client paths — test each proposal against both facts.","explain":["The path allow-list keeps certutil working for the deployments that need it while cutting off the Temp-folder pattern the attacker used, and the deploy-window baseline rule flags trust writes with no record behind them. Both harden without breaking anything sanctioned.","The fleet-wide block is the best practice that is wrong here: SCCM, the package pipeline, and routine admin tooling all break, so the estate pays for the attacker's one trick every single day. Removing the inspection CA hands the business a connectivity problem to solve a naming problem that fingerprint matching already solves."]},{"id":"e14","type":"blank","perspective":"neutral","scenario":{"summary":"Campaign tradecraft in the report's closing section","text":["The INC-5317 report closes by tying the case to the documented campaigns, and the board wants the lessons stated as controls, not history.","The campaign register is attached; the report's two controls already exist in draft.","Complete the two closing sentences."],"artefacts":[{"label":"ARTEFACT 1 — campaign register (closing page)","kind":"code","lines":["Galileo RCS (HackingTeam) — interception kit — root install for silent session reads","FinSpy (FinFisher) — interception kit — root install covered command traffic","Snake (Turla) — forged vendor root — signed its tooling","Superfish (Komodia) — factory-preinstalled adware root — consumer laptops"]},{"label":"ARTEFACT 2 — INC-5317 mapping note","kind":"text","lines":["The mimic copied a sanctioned CN; the install was caught by the store","telemetry; the signing angle never materialised in this case."]},{"label":"ARTEFACT 3 — report controls (draft)","kind":"code","lines":["Control 1 (live)    : alert on unexpected trust-store activity outside deploy windows","Control 2 (proposed): signature-origin checks on binaries, paired with Control 1"]},{"label":"ARTEFACT 4 — board instruction","kind":"text","lines":["'Name the campaign lesson behind each control. History is context; the","lesson is the control.'"]}]},"question":"Complete the two closing sentences.","blanks":[{"before":"Closing lesson one: the interception kits were caught in labs by watching trust-store ","after":" outside approved windows — the report keeps that alert first.","answer":["writes","write","changes","change","activity","installs","install"],"hint":"the plural noun for what the store alert fires on"},{"before":"Closing lesson two: the forged-root kits abused a manufacturer's name for signing, so the second control checks what presents as ","after":" -signed on every host.","answer":["vendor"],"hint":"the word for the manufacturer whose name was forged"}],"hint":"Both lessons are watches: one on what the store accepts, one on what binaries claim about who made them.","explain":["Lesson one is the interception family: Galileo RCS and FinSpy installed roots so fake certificates passed and sessions could be read silently. What caught them — and what caught INC-5317's install — is the watch on trust-store activity outside approved windows, so the report keeps that alert first.","Lesson two is the signing family: a forged manufacturer root made tooling present as trusted-signed. Store watches cannot see that, so the second control pairs the store alert with signature-origin checks. The register's point is that INC-5317 inherited both lessons in one incident: a copied name on an install, and a signature story that would have worked on hosts without the second control."]},{"id":"e15","type":"single","perspective":"defender","scenario":{"summary":"A second conflict: expired-but-recorded vs valid-but-unrecorded","text":["The review board replays the second conflict of INC-5317, this time from the supervised Mac fleet.","MAC-FIN-09 lists a root whose certificate expired in April; its trust entry carries the CHG-7741 annex renewal record. MAC-FIN-12 lists a currently valid vendor root whose fingerprint appears in no local record.","The board asks which finding, if either, is the incident, and wants the reasoning written down."],"artefacts":[{"label":"ARTEFACT 1 — Mac fleet trust excerpt","kind":"code","lines":["MAC-FIN-09  root present, NotAfter 2024-04-30 (EXPIRED)  trust: admin-assigned","            record: CHG-7741 annex A (renewal approved, vendor delivery pending)","MAC-FIN-12  root present, NotAfter 2027-01-14 (valid)    trust: present","            record: none found in MDM export"]},{"label":"ARTEFACT 2 — CHG-7741 annex A (excerpt)","kind":"ticket","lines":["Renewal of the inspection root on supervised Macs: approved. Vendor","delivery pending; the interim root remains in trust settings until replaced."]},{"label":"ARTEFACT 3 — vendor root program note","kind":"text","lines":["Vendor roots arrive on managed Macs through the vendor's own update","channel and may appear without any local record."]},{"label":"ARTEFACT 4 — MDM export note (incomplete)","kind":"text","lines":["MAC-FIN-12's payload attestation arrived 40 minutes late —","window gap 01:30-02:10, export incomplete for that interval."]}]},"question":"Which reading should the board accept?","options":[{"id":"a","text":"MAC-FIN-09 is the incident — expired trust is always tampering"},{"id":"b","text":"MAC-FIN-12 is the incident — a valid root with no record is rogue by definition"},{"id":"c","text":"Neither is proven: verify MAC-FIN-12 against the vendor's published root list; log MAC-FIN-09 as a renewal gap"},{"id":"d","text":"Both are routine — records are optional for vendor roots on managed Macs"}],"correct":["c"],"hint":"Expiry is a property of the certificate; a missing record is a property of the deployment — the two findings fail on different evidence.","explain":["MAC-FIN-09 fails on the certificate property: the root is expired, so it cannot validate anything today. The annex shows the renewal is approved and pending, so it is an operations gap with an owner — not the incident.","MAC-FIN-12 fails on the deployment property: the certificate is valid, but no local record exists. Vendor roots can arrive without local records, and the export gap means the MDM data is incomplete for that interval, so the finding is unproven either way — the fingerprint must be checked against the vendor's published root list before any verdict. Options a and b each promote one property into a rule; option d dissolves a real gap. The board's rule: neither expiry nor a record gap alone decides — the published list does."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');

      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';

    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';

      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;

    }
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};

    S.answeredCount = 0;

    S.reviewList = [];

  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {

  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }

  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });

  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));

    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;

        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +

  function exerciseHtml(ex) {

    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';

  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {
        var cur = a.match ? a.match[i] : '';
        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +
          '<select class="match-sel" data-left="' + i + '" aria-label="Match for: ' + esc(p.left) + '">' +

          '</select></div>';
      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {

      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {

            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +
          '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">' + label + ' 1 is the first position. Use the arrows to reorder.</p>';
    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +

            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {

            }).join('') + '</div></div>';
        }).join('') + '</div></div>';
    } else if (ex.type === 'terminal') {
      if (!a.scroll) {

      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      var stepsTotal = br.steps.length + 1;
      if (st < br.steps.length) {

        inner = '<span class="branch-step">STEP ' + (st + 1) + ' OF ' + stepsTotal + '</span>' +

          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {
            var isSel = a.bsel === o.id;

              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="branch-confirm"><button type="button" class="btn" id="btn-bconfirm" disabled>Confirm step</button></div>' +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      } else {

          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(f.question) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + f.options.map(function (o, i) {
            var isSel = fsel.indexOf(o.id) >= 0;
            return '<button type="button" class="opt" data-foid="' + esc(o.id) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + (!multi && isSel) + '" aria-pressed="' + (multi && isSel) + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          (multi ? '<p class="note">Select all options that apply.</p>' : '') +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      }
    }

      inner += '<div class="hint-panel" role="note"><div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint) + '</div>';
    }
    return '<fieldset class="widget-fs" id="widget-fs">' + inner + '</fieldset>';
  }
  function renderExam() {
    var ex = currentEx();
