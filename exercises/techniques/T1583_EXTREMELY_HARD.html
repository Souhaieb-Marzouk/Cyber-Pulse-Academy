 — renting a\nnetwork of infected devices; <b>.006 Web Services<\/b> — signing up for sites like GitHub, Dropbox or\nTwitter; <b>.007 Serverless<\/b> — using cloud functions such as Cloudflare Workers or AWS Lambda;\n<b>.008 Malvertising<\/b> — buying online adverts that push malware.<\/p>\n<p><b>Why does an attacker do this?<\/b> Own infrastructure gives them: a place to host fake login pages;\na place to stage malware; servers to receive stolen data (command and control); and traffic that blends\nin with normal cloud or web traffic. They can provision it fast, change it fast, and shut it down fast.\nThey can pay with crypto, use free trials, use private WHOIS, or buy an old domain that already looks\ntrustworthy. All of this makes it hard to tie the infrastructure back to a person.<\/p>\n<p><b>Who uses this object in real work?<\/b> Almost every security role touches it:<\/p>\n<ul>\n<li><b>SOC analysts<\/b> see the results: alerts about new or strange domains and fresh servers.<\/li>\n<li><b>CTI analysts<\/b> track which actor bought what, and write reports naming T1583.<\/li>\n<li><b>Detection engineers<\/b> build watches on WHOIS, passive DNS, certificate logs and scan data\n(DET0895 / AN2027 in ATT&amp;CK).<\/li>\n<li><b>Threat hunters and IR<\/b> pivot on infrastructure: domain age, hosting, certificates.<\/li>\n<li><b>Red teamers<\/b> rent the same services for authorised engagements.<\/li>\n<li><b>GRC and control owners<\/b> accept that this phase cannot be stopped directly — ATT&amp;CK lists\nonly <b>M1056 Pre-compromise<\/b> — so controls focus on the follow-on attack.<\/li>\n<\/ul>\n<p><b>Tools and deliverables<\/b> you will meet: WHOIS lookups, passive DNS, certificate transparency\nlogs, internet-scan services, newly-registered-domain feeds, brand monitoring, takedown requests, and\nATT&amp;CK-mapped threat intel reports. <b>The risks it addresses:<\/b> phishing from lookalike domains,\nmalware hosting, C2 servers, and malicious adverts — all built on acquired infrastructure.<\/p>\n", "themes": [{"name": "Technique identity & matrix position", "items": ["T1583 Acquire Infrastructure", "Technique (not a tactic)", "Tactic: Resource Development (TA0042)", "Platforms: PRE", "Siblings: T1584 Compromise Infrastructure, T1588 Obtain Capabilities", "Feeds Phishing (T1566), Drive-by Compromise (T1189), C2 (T1071/T1102), Proxy (T1090)"]}, {"name": "The eight sub-techniques (acquisition targets)", "items": ["T1583.001 Domains", "T1583.002 DNS Server", "T1583.003 Virtual Private Server", "T1583.004 Server", "T1583.005 Botnet", "T1583.006 Web Services", "T1583.007 Serverless", "T1583.008 Malvertising"]}, {"name": "Adversary motivations & trade-offs", "items": ["Blend in with normal traffic", "Rapidly provision / modify / shut down", "Hard to tie back to the attacker", "Free trial periods", "Bulletproof & minimal-KYC hosting", "Aged / expired domain reputation", "Homoglyphs, typosquats, IDN homograph attacks", "Private WHOIS & varied registrars", "Residential proxy services", "Payment in crypto / prepaid cards"]}, {"name": "Telemetry, data sources & detection strategy", "items": ["Detection Strategy DET0895 (analytic AN2027)", "Internet-scan data: listening services, certificates in use, SSL/TLS negotiation features", "DNS registry data", "Logged DNS data", "WHOIS registration data", "Detection focus on follow-on stages (e.g. Command and Control)"]}, {"name": "Mitigations & control limits", "items": ["M1056 Pre-compromise", "No direct preventive control (outside enterprise visibility)", "Newly-registered-domain feeds", "Brand monitoring & takedowns", "Ad blockers against malvertising follow-on", "Aged-domain evasion of age-based blocks"]}, {"name": "Real-world procedure examples", "items": ["Agrius, Contagious Interview, Ember Bear (commercial VPN services)", "Kimsuky (crypto-funded servers)", "Sandworm Team (resellers, email campaign services)", "Star Blizzard (HubSpot, MailerLite)", "Sea Turtle (VPN networks, adversary-in-the-middle DNS)", "APT41 DUST (Cloudflare Workers)", "Mustard Tempest & Raspberry Robin (malvertising)", "APT5 / HAFNIUM / Ke3chang (ORB networks)"]}, {"name": "Attribution & infrastructure intelligence", "items": ["Infrastructure overlap is a weak signal alone", "Shared registrars & privacy services", "Reseller chains blur ownership", "ORB networks raise defender cost", "Confidence language in CTI reporting"]}], "focus": "This tier chains several concepts under pressure: conflicting signals, evidence that survives scrutiny, takedown economics, and senior-level decisions.", "rules": "\n<h2>How this exam works<\/h2>\n<ul>\n<li><b>Goal:<\/b> master <b>T1583 — Acquire Infrastructure<\/b> at the <b>EXTREMELY HARD<\/b> level.\nOptions are deliberately close. At least one correct answer is “gather more evidence” or “accept a real cost”.<\/li>\n<li><b>Questions:<\/b> 16 exercises. <b>Pass mark: 70%.<\/b> <b>Timer: 60 minutes.<\/b><\/li>\n<li><b>Exercise types in this tier:<\/b> a four-step major-incident branch, two shells (a reduced-timer evidence capture and an offline pcap analysis), an alert board, a takedown workflow and dense artefact sets with noise and gaps.<\/li>\n<li><b>Partial credit:<\/b> some exercises have more than one right part. Each right part earns a share\nof the score. Wrong picks subtract from your score. If you select everything, you get 0 for that\nexercise. A partly right answer still earns part of the credit: credit = (H − W) / N.<\/li>\n<li><b>Check stops the clock:<\/b> when you press <b>Check<\/b>, the timer stops by itself. You can read\nthe notes for as long as you want. The timer starts again only when you press <b>Next<\/b>\n(or Final Submit on the last exercise).<\/li>\n<li><b>Manual pause:<\/b> the Pause button stops the timer and hides the exercise. Press Resume to continue.<\/li>\n<li><b>Hint:<\/b> one hint per exercise. It costs 10% of that exercise's credit. Hints never reveal the answer.<\/li>\n<li><b>Skip:<\/b> every exercise has a Skip button. Skipping does not stop the timer and does not show\nthe answer. Before you finish, you get a screen to return to skipped exercises. Skipped exercises you\nnever answer are excluded from the score — they count as neither right nor wrong.<\/li>\n<li><b>Retake:<\/b> if you fail, you can retake the exam. Questions and answer choices are shuffled again.<\/li>\n<li><b>Defanged indicators:<\/b> this lab writes harmful addresses safely, like\n<code>hxxp://evil[.]example<\/code> and <code>45[.]33[.]10[.]7<\/code>. In terminal exercises, type\ndomains the same defanged way.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "x01", "type": "branch", "sum": "Major incident: the aged lookalike VPN portal", "scen": "Monday 08:40, Northwind Logistics. The domain <b>nwind-vpn-portal[.]net<\/b> mirrors your real VPN portal pixel by pixel. It was created 8 days ago — but passive DNS shows it hosted a Canadian trucking blog for the two years <b>before<\/b> that (the actor bought the aged domain). Feed A flags it as malicious. No EDR alert fired anywhere. VPN logs show 3 users typed credentials into it. WHOIS is privacy-protected, so registrant data is unavailable. The CISO needs a decision in 10 minutes.", "arts": [], "q": "Choose the best judgement at each step.", "note": "Answer each step, then press Check on the last step. Intermediate confirms do not stop the timer.", "hint": "Victim-side signals are action-grade; attribution is not; aged history is inherited, not proof; containment is not the end.", "study": "Aged-domain acquisition (T1583.001) inherits reputation; victim-side evidence outranks vendor flags; attribution language follows evidence.", "ex": "<p>Four chained judgements: (1) action rests on what the victim environment shows, not on one vendor opinion; (2) attribution stays behind the evidence line; (3) the conflicting signal resolves through knowledge of <b>how<\/b> the domain was acquired — ATT&amp;CK documents expired domain repurposing; (4) containment leaves two live intelligence tracks open. This is the senior register: decisions with named uncertainty, not certainty performed.<\/p>", "steps": [{"add": null, "q": "Step 1 — What do you tell the CISO right now?", "out": "The CISO authorises victim-side containment; the feed flag is logged as one signal among several.", "opts": [{"i": 0, "o": {"t": "There is an active credential-harvest page aimed at our staff; act on the victim-side signals and treat the feed flag as one signal, not proof", "c": true, "why": ["Victim-side evidence (lookalike + credential submissions) is action-grade; the feed flag alone is not, and the benign history has an innocent-looking alternative explanation you must keep in play."]}}, {"i": 1, "o": {"t": "It must be benign — the domain hosted a real blog for two years", "c": false, "why": ["The blog history is exactly what an aged-domain purchase inherits; benign history does not neutralise the lookalike mirror."]}}, {"i": 2, "o": {"t": "This is APT41, state it in the incident ticket", "c": false, "why": ["No evidence supports that group; premature attribution poisons the record."]}}, {"i": 3, "o": {"t": "Shut down the VPN concentrator entirely", "c": false, "why": ["That stops the whole remote workforce — a cost no current fact justifies."]}}]}, {"add": null, "q": "Step 2 — Legal asks: can the report name the actor?", "out": "The report names the behaviour (T1583.001 acquisition, T1566.002 spearphishing link use) and keeps attribution open.", "opts": [{"i": 0, "o": {"t": "No — record “unknown actor” with the acquisition pattern and confidence limits; attribution needs more evidence", "c": true, "why": ["Aged-domain purchase plus privacy WHOIS leaves the operator unidentified; behaviour is what you can state."]}}, {"i": 1, "o": {"t": "Yes — the feed label is authoritative, print it", "c": false, "why": ["Feed labels are vendor opinions; legal findings built on them collapse under challenge."]}}, {"i": 2, "o": {"t": "Yes — the trucking blog proves a Canadian actor", "c": false, "why": ["Purchased domains carry whatever history they had; the blog predates the actor."]}}]}, {"add": null, "q": "Step 3 — The junior is confused by the two-year benign history. Resolve the conflict: which signal wins?", "out": "The team writes the T1583.001 aged-acquisition note into the case, and the junior updates the hunting playbook.", "opts": [{"i": 0, "o": {"t": "The victim-facing evidence wins: acquired (purchased) domains inherit history by design, so history cannot prove benign intent here", "c": true, "why": ["ATT&amp;CK documents expired/aged domain repurposing under T1583.001; the conflict resolves by understanding the acquisition method, not by ignoring a signal."]}}, {"i": 1, "o": {"t": "The history wins: old domains are trusted, close the case", "c": false, "why": ["That reasoning is the exact gap that makes aged-domain acquisition work."]}}, {"i": 2, "o": {"t": "Both signals cancel out; nothing happened", "c": false, "why": ["Credential submissions against a lookalike do not cancel out."]}}]}, {"add": null, "q": "Step 4 — What remains open after containment?", "out": "Open items: registrar history request, second-stage hunt, re-registration watch on the aged name.", "opts": [{"i": 0, "o": {"t": "Request registrar/WHOIS history, hunt for the second-stage host, and watch for re-registration of the same name", "c": true, "why": ["The acquisition trail and the follow-on infrastructure are the two live tracks; rotation on a valuable aged name is likely."]}}, {"i": 1, "o": {"t": "Nothing — the block closed the case", "c": false, "why": ["The block addresses one host; the actor, the second stage and the aged name remain."]}}, {"i": 2, "o": {"t": "Only the PR statement remains", "c": false, "why": ["Comms matter, but the investigation is not done."]}}]}]}, {"id": "x02", "type": "term", "sum": "Evidence capture under a restraint order", "scen": "Egress gateway, maintenance window. <b>corphelp-portal[.]net<\/b> resolves to <b>45[.]33[.]10[.]7<\/b>. The CISO and legal want <b>evidence that survives scrutiny<\/b>: a record of the DNS conversations on the wire, saved to a file. Two hard constraints from the restraint order: <b>do not contact the adversary systems from production<\/b>, and <b>do not change any firewall rule yet<\/b>. The operator must not learn we noticed. The interface is <b>eth0<\/b>. DNS uses port 53.", "arts": [], "q": "Type the command that passively captures DNS traffic on eth0 to a pcap file, without resolving names.", "note": "Type the command, press Enter (or Run), then press Check. This exercise has its own reduced timer.", "hint": "The constraint kills every active option. What remains is a passive capture tool: interface, no-name-resolution, write-to-file, DNS filter.", "study": "tcpdump flags: -i interface, -n numeric, -w file, filter “port 53”.", "ex": "<p><b>tcpdump -i eth0 -n -w /evidence/dns-gw-20261014.pcap port 53<\/b> is the only family of answers that satisfies both constraints: it listens (passive), keeps names numeric (-n, so the gateway sends no reverse lookups that could alert the operator), and writes evidence to disk (-w) rather than printing it. dig/nslookup/curl actively contact adversary or resolver infrastructure from a production box; firewall changes destroy your own visibility and tell the operator something moved. This is the “expensive” lesson of the tier: the safe command is also the one that produces evidence a court will accept.<\/p>", "term": {"prompt": "root@gw01:~#", "avail": ["tcpdump", "dig", "nslookup", "curl", "wget", "iptables", "tshark"], "canonical": "tcpdump -i eth0 -n -w /evidence/dns-gw-20261014.pcap port 53", "out": {"tcpdump -i eth0 -n -w /evidence/dns-gw-20261014.pcap port 53": "listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n14:02:11.881532 IP 10[.]0[.]0[.]53.41722 > resolver1.isp[.]net.53: 41821+ A? corphelp-portal[.]net. (37)\n14:02:11.902417 IP resolver1.isp[.]net.53 > 10[.]0[.]0[.]53.41722: 41821 1/0/0 A 45[.]33[.]10[.]7 (53)\n14:02:14.110023 IP 10[.]0[.]0[.]58.52119 > resolver1.isp[.]net.53: 41822+ A? corphelp-portal[.]net. (37)", "tcpdump -i any -n -w /evidence/dns-gw-20261014.pcap port 53": "listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n14:02:11.881532 IP 10[.]0[.]0[.]53.41722 > resolver1.isp[.]net.53: 41821+ A? corphelp-portal[.]net. (37)\n14:02:11.902417 IP resolver1.isp[.]net.53 > 10[.]0[.]0[.]53.41722: 41821 1/0/0 A 45[.]33[.]10[.]7 (53)\n14:02:14.110023 IP 10[.]0[.]0[.]58.52119 > resolver1.isp[.]net.53: 41822+ A? corphelp-portal[.]net. (37)", "tcpdump -i eth0 -n port 53": "listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n14:02:11.881532 IP 10[.]0[.]0[.]53.41722 > resolver1.isp[.]net.53: 41821+ A? corphelp-portal[.]net. (37)\n^C  (printed to the terminal only — not saved, not evidence)", "tcpdump -i eth0 port 53": "listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n14:02:11.881532 IP 10[.]0[.]0[.]53.41722 > resolver1.isp[.]net.53: 41821+ A? corphelp-portal[.]net. (37)\n^C  (printed to the terminal only — not saved, not evidence)"}, "elements": [{"re": "(^| )tcpdump( |$)", "name": "tool: tcpdump", "desc": "The passive capture tool — safe under both constraints."}, {"re": "-i +(eth0|any)", "name": "interface: -i eth0", "desc": "Captures on the stated interface (any also acceptable)."}, {"re": "-n", "name": "flag: -n (numeric)", "desc": "No reverse resolution — the gateway must not generate lookups that could tip off the operator."}, {"re": "-w +\\S*pcap", "name": "write: -w /evidence/dns-gw-20261014.pcap", "desc": "Writes the capture to a file: the evidence artefact legal asked for."}, {"re": "port +53", "name": "filter: port 53", "desc": "DNS traffic only."}], "forbidden": [{"re": "(^| )(dig|nslookup|host)( |$)", "name": "dig / nslookup / host", "desc": "These actively query the adversary’s resolver chain from production — direct contact that can tip off the operator and violates the restraint order."}, {"re": "(iptables|ufw|firewall-cmd)", "name": "firewall changes", "desc": "Blocking now destroys your own visibility and signals to the operator that something changed — evidence-destroying in this context."}, {"re": "(curl|wget)( |$)", "name": "curl / wget", "desc": "Fetching the site contacts the adversary infrastructure directly — prohibited by the restraint order."}]}, "terminal": true, "avail": ["tcpdump", "dig", "nslookup", "curl", "wget", "iptables", "tshark"], "perSec": 300}, {"id": "x03", "type": "qcm", "sum": "Two feeds disagree — CISO needs a decision in 10 minutes", "scen": "Feed A lists IP 45[.]33[.]10[.]7 as “C2”. Feed B lists the same IP as a “CDN edge node”. The lookalike domain nwind-help[.]com resolves there; so do two customer portals of a SaaS provider you use. You cannot reach the vendors within 10 minutes.", "arts": [], "q": "Which decision is right?", "note": null, "hint": "The conflict is about the IP, not about the domain aimed at your brand. Match the action to the granularity you can defend.", "study": "Precision under conflicting signals: act at the narrowest confident scope (domain), not the contested one (IP).", "ex": "<p>Two signals contradict at IP level, so IP-level action is the contested ground — and it carries collateral cost. The domain aimed at your brand is not contested at all: fresh, lookalike, privacy-owned. The senior move is the narrowest action that is certainly right, with the contested part escalated for clarification. Blocking the IP “to be safe” is the best-practice failure this exercise is built around.<\/p>", "opts": [{"t": "Block the specific lookalike domain, leave the shared IP unblocked, open a vendor clarification ticket", "c": true, "why": ["Domain-level action stops your threat; IP-level action would break two legitimate customer portals — precision under conflict."]}, {"t": "Block the whole IP at the firewall, accepting brief downtime for the two shared portals", "c": false, "why": ["That also cuts the two legitimate SaaS portals — collateral damage with no added safety for this threat."]}, {"t": "Do nothing — the feeds contradict each other, so no action can be justified right now", "c": false, "why": ["Contradiction does not neutralise the lookalike aimed at your brand."]}, {"t": "Allowlist the IP as probably benign and re-review the whole case next quarter", "c": false, "why": ["Allowlisting the shared IP would silence future alerts on it while the lookalike stays live."]}]}, {"id": "x04", "type": "multi", "sum": "Build the telemetry plan", "scen": "You are the detection engineer. Which telemetry can realistically support detection of <b>acquired infrastructure being used<\/b>, per ATT&amp;CK’s analytic AN2027 for T1583? Select ALL that are viable.", "arts": [], "q": "Select ALL viable telemetry sources.", "note": "Select <b>ALL<\/b> that apply. Partial credit applies.", "hint": "Ask for each: does this source see the attacker’s side, the wire, or the registration records?", "study": "AN2027 sources: internet-scan data, DNS registry data, logged DNS, WHOIS — everything victim-side (EDR, badges) is out of scope for T1583.", "ex": "<p>The viable four are exactly the sources ATT&amp;CK’s analytic names — all of them live <b>outside<\/b> the victim endpoint. The two dead options fail the same test from opposite directions: EDR cannot see attacker-side purchases, and badges cannot see anything digital. Coverage reasoning starts by knowing where each signal physically originates.<\/p>", "opts": [{"t": "Internet-scan data: listening services and certificates on suspicious ranges", "c": true, "why": ["AN2027 names scan data with listening services, certificates in use and SSL/TLS negotiation features."]}, {"t": "WHOIS registration data for fresh acquisitions", "c": true, "why": ["WHOIS is named by AN2027 as the registration-information source."]}, {"t": "DNS registry data / passive DNS", "c": true, "why": ["AN2027 lists DNS registry data among its sources."]}, {"t": "Logged DNS queries from your own resolvers", "c": true, "why": ["AN2027 lists logged DNS data; your resolvers see the follow-on use."]}, {"t": "EDR process logs showing the attacker registering the domain", "c": false, "why": ["Registration happens on the attacker’s side; no EDR on earth sees it."]}, {"t": "Badge access logs", "c": false, "why": ["Physical access data has no relation to internet infrastructure."]}]}, {"id": "x05", "type": "match", "sum": "Procedure examples from the ATT&amp;CK page", "scen": "You brief the CISO with real examples. Match each actor to the acquisition behaviour ATT&amp;CK records for it.", "arts": [], "q": "Match each actor to its recorded behaviour.", "hint": "Money, distance, camouflage, and DNS control — one actor each.", "study": "ATT&amp;CK procedure examples: Kimsuky (crypto/prepaid), Sandworm (resellers), Star Blizzard (marketing platforms), Sea Turtle (AIT DNS = T1583.002).", "ex": "<p>These are the recorded behaviours from the live ATT&amp;CK pages, not folklore. Kimsuky’s payment trail, Sandworm’s reseller distance, Star Blizzard’s legitimate marketing platforms, and Sea Turtle’s adversary-in-the-middle DNS (the T1583.002 sub-technique in action) each map to a different corner of the technique. Real briefings quote them exactly like this.<\/p>", "pairs": [{"l": "Kimsuky", "r": "Purchased hosting servers with virtual currency and prepaid cards", "why": ["Payment hygiene: crypto and prepaid cards break the money trail."]}, {"l": "Sandworm Team", "r": "Leased servers through resellers instead of leasing directly from hosting companies", "why": ["Reseller chains insert distance between actor and provider."]}, {"l": "Star Blizzard", "r": "Used HubSpot and MailerLite marketing platforms to hide the true sender of phishing emails", "why": ["Web-service sign-up (T1583.006) used as sender camouflage."]}, {"l": "Sea Turtle", "r": "Built adversary-in-the-middle DNS servers to impersonate legitimate services and capture credentials", "why": ["Running your own DNS servers is T1583.002."]}]}, {"id": "x06", "type": "qcm", "sum": "The best practice that failed here", "scen": "Your organisation blocks every domain younger than 30 days at mail and proxy. A phishing wave still harvested 14 credentials. The blocked-age list never fired. Autopsy: the phishing domain was 4 years old — bought at an expired-domain auction two weeks before the wave.", "arts": [], "q": "Why did the best practice fail in this specific context?", "note": null, "hint": "The control measured one attribute. Which attribute did the adversary sidestep by shopping differently?", "study": "Best-practice-in-context: age blocks fail against aged-domain acquisition; layer reputation, ASN and cert-age signals.", "ex": "<p>The widely used 30-day rule is a good best practice against fresh registrations — and useless against the documented T1583.001 behaviour of repurposing expired domains. The inherited two years of reputation satisfied the control’s precondition. Widely used practice is not context-free truth: controls must be paired with the acquisition methods they claim to stop.<\/p>", "opts": [{"t": "Age-based blocking assumes fresh registration; the actor acquired an already-aged domain, so the precondition never held", "c": true, "why": ["T1583.001 includes repurposing expired domains whose reputation is inherited — the control measured the wrong attribute."]}, {"t": "The block list processed domains far too slowly, so the wave slipped through the 30-day window unnoticed", "c": false, "why": ["Speed was irrelevant: the domain was never on a “new” list to begin with."]}, {"t": "Domain blocking is illegal in most jurisdictions, so the control never really applied to this case at all", "c": false, "why": ["It is standard practice; legality was never the issue."]}, {"t": "Users had script blockers enabled, which silently disabled the mail gateway’s age checks that morning", "c": false, "why": ["Irrelevant: the harvest happened on a web page the users trusted."]}]}, {"id": "x07", "type": "order", "sum": "Order the evidence-preserving response workflow", "scen": "Legal wants any action against the acquired infrastructure to survive scrutiny. Put the five steps of the response workflow in order.", "arts": [], "q": "Order the five steps from first to last.", "note": "Put the steps in the correct order. Use the arrows or drag the rows.", "hint": "Freeze what you have, write down what it means, involve legal, act, then keep watching.", "study": "Evidence-first response: preserve (hash) → document → legal → takedown → monitor rotation.", "ex": "<p>Preservation comes first because evidence evaporates: logs roll over, servers rotate. Documentation turns preservation into a narrative legal can file. Only then does the takedown request go out — with the evidence attached, not a hunch. The final step acknowledges the reality of acquired infrastructure: rotation is the attacker’s cheapest move, and watching for it costs almost nothing.<\/p>", "items": [{"t": "Preserve the evidence: export logs and pcaps, hash them, store read-only"}, {"t": "Document the infrastructure: WHOIS history, passive DNS, certificate records"}, {"t": "Engage legal and the brand team with the evidence pack"}, {"t": "Request the registrar/host takedown with the documented findings"}, {"t": "Monitor for re-registration and redeployment of the same infrastructure"}]}, {"id": "x08", "type": "term", "sum": "Offline analysis of the captured pcap", "scen": "Later the same day. The evidence file <b>/evidence/dns-gw-20261014.pcap<\/b> (from the capture you made earlier) is mounted read-only on the analysis workstation. Legal wants a clean list: <b>every DNS name that received an answer with an IP<\/b> — query-response records only, de-duplicated, one line per unique name/address pair. The workstation has tshark.", "arts": [], "q": "Type the tshark command that prints unique DNS response name/address pairs from the pcap file.", "note": "Type the command, press Enter (or Run), then press Check.", "hint": "You need: read a file, keep only DNS responses, extract the query-name and answer fields, then de-duplicate.", "study": "tshark: -r reads a file, -Y filters, -T fields -e … extracts, sort -u de-duplicates.", "ex": "<p><b>tshark -r /evidence/dns-gw-20261014.pcap -Y ‘dns.flags.response==1’ -T fields -e dns.qry.name -e dns.a | sort -u<\/b> reads the evidence read-only (-r), keeps only response records (the -Y filter), extracts name and answer address (-T fields -e …), and de-duplicates (sort -u). The output names corphelp-portal[.]net → 45[.]33[.]10[.]7 — the acquired infrastructure, in a form legal can staple to the case. Analysis runs offline: nothing touches the adversary.<\/p>", "term": {"prompt": "analyst@ws:~$", "avail": ["tshark", "tcpdump", "sort", "uniq", "grep", "head"], "canonical": "tshark -r /evidence/dns-gw-20261014.pcap -Y 'dns.flags.response==1' -T fields -e dns.qry.name -e dns.a | sort -u", "out": {"tshark -r /evidence/dns-gw-20261014.pcap -Y 'dns.flags.response==1' -T fields -e dns.qry.name -e dns.a | sort -u": "corphelp-portal[.]net\t45[.]33[.]10[.]7\nresolver1.isp[.]net\t198[.]51[.]100[.]53"}, "elements": [{"re": "(^| )tshark( |$)", "name": "tool: tshark", "desc": "Field-oriented pcap analysis tool present on the workstation."}, {"re": "-r +\\S*pcap", "name": "read: -r /evidence/dns-gw-20261014.pcap", "desc": "Reads the evidence file (offline, read-only)."}, {"re": "dns\\.flags\\.response==1", "name": "filter: dns.flags.response==1", "desc": "Keeps DNS responses only — the pairs legal asked for."}, {"re": "-e +dns\\.qry\\.name", "name": "field: -e dns.qry.name", "desc": "The queried name."}, {"re": "-e +dns\\.a( |$|')", "name": "field: -e dns.a", "desc": "The A-record answer address."}, {"re": "sort +-u", "name": "stage: | sort -u", "desc": "Unique pairs only."}], "forbidden": [{"re": "rm +-rf +/evidence", "name": "rm -rf /evidence", "desc": "Destroys the evidence file — the destructive action this tier warns about."}]}, "terminal": true, "avail": ["tshark", "tcpdump", "sort", "uniq", "grep", "head"]}, {"id": "x09", "type": "triage", "sum": "The campaign board — five calls under pressure", "scen": "Friday 16:50. Five items sit on the campaign board. Decide each one. Background: two of your SaaS customers share one CDN IP with a lookalike domain; the brand team is drafting a customer notice; one item lacks basic facts.", "arts": [], "q": "Choose one call per board item.", "note": "Choose one action per alert, then press Check. Partial credit per alert.", "hint": "Two calls hinge on victim impact, one on precision, one on absence of signal, one on missing facts.", "study": "Senior triage: monitor while benign, escalate on impact, precise scope on shared infrastructure, gather evidence when facts are missing.", "ex": "<p>Five different situations, five different calls — the board refuses one-size-fits-all. Item 3 is the cost-bearing decision (the shared IP), item 5 is the incomplete-information case, and items 1–2 show the same domain at two moments that demand opposite actions. Under (H−W)/N each wrong call cancels a right one, so defensible reasoning beats volume.<\/p>", "alerts": [{"t": "Item 1 — Lookalike domain live, zero interactions, legal still drafting the customer notice", "opts": ["Block and publish a public warning now", "Monitor 48h with alerting while legal prepares", "Escalate to IR", "No action"], "c": 1, "why": "No interaction yet means no victim impact yet: monitoring preserves telemetry while comms prepare — the deliberate-wait call."}, {"t": "Item 2 — Lookalike domain, 14 credential submissions confirmed in VPN logs", "opts": ["Block and publish a public warning now", "Monitor 48h with alerting", "Escalate to IR (block, reset, hunt)", "No action"], "c": 2, "why": "Confirmed credential theft is past the monitoring line: contain accounts, reset, and hunt the second stage."}, {"t": "Item 3 — Aged lookal /* ================= utils ================= */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!=null){e.innerHTML=html;}return e;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function copyTxt(btn,txt){try{navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},1200);},function(){});}catch(e){}}
function hl(text){
  var lines=String(text).split('\n'),out=[];
  for(var i=0;i<lines.length;i++){
    var L=esc(lines[i]);
    L=L.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.Z+-]*)/,'<span class="t-ts">$1</span>');
    L=L.replace(/^(\d{2}:\d{2}:\d{2})/,'<span class="t-ts">$1</span>');
    L=L.replace(/(\d{1,3}\[\.\]){3}\d{1,3}/g,'<span class="t-ip">$&</span>');
    L=L.replace(/([a-z0-9][a-z0-9-]*\[\.\])+(com|net|org|io|ru|cn|su|top|xyz|info|biz|online|shop|site|link|live|app|dev|co|uk|de|fr|nl|is|cc|tv|me|gov|edu|mil)\b/gi,'<span class="t-dom">$&</span>');
    L=L.replace(/hxxps?:\/\/[^\s<"'）)]+/g,'<span class="t-url">$&</span>');
    L=L.replace(/\b(GET|POST|DNS|TXT|TLS|SSL|HTTP|HTTPS|OK|FAILED|query|response|53)\b/g,'<span class="t-kw">$&</span>');
    out.push(L);
  }
  return out.join('\n');
}
function artsHTML(exd){

  var h='';

  return h;
}

/* ================= scoring core (contract) ================= */
/* scoreExercise(selectedItems, correctItems, optTotal) -> credit in [0,1]
   H = |selected & correct|, W = |selected \ correct|, N = optTotal or correct.length
   credit = max(0, (H - W) / N) */
function scoreExercise(selectedItems, correctItems, optTotal){
  var corr={};for(var i=0;i<correctItems.length;i++){corr[correctItems[i]]=true;}
  var H=0,W=0,seen={};
  for(var j=0;j<selectedItems.length;j++){
    var id=selectedItems[j];
    if(seen[id]){continue;}
    seen[id]=true;
    if(corr[id]){H++;}else{W++;}
  }
  var N=(typeof optTotal==='number')?optTotal:correctItems.length;
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED        */
function setState(st){S.tState=st;renderHeader();}
function startTimer(){
  if(S.tick){clearInterval(S.tick);}
  setState('RUNNING');
  S.tick=setInterval(function(){
    if(S.tState!=='RUNNING'){return;}
    S.remaining--;
    if(S.remaining<=0){S.remaining=0;renderHeader();timerEnd();return;}
    renderHeader();
  },1000);
}
function stopTick(){if(S.tick){clearInterval(S.tick);S.tick=null;}}
function pauseAuto(){ /* Check pressed: first action = stop the clock, before feedback renders */
  if(S.tState==='RUNNING'){S.pauseStart=Date.now();setState('PAUSED_AUTO_CHECK');}
}
function pauseManual(){
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S.pauseStart=Date.now();
    S.resumeTo=(S.tState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
    setState('PAUSED_MANUAL');
    showOverlay(true);
  }
}
function resumeManual(){
  if(S.tState!=='PAUSED_MANUAL'){return;}
  var d=Math.max(0,Math.round((Date.now()-S.pauseStart)/1000));
  if(S.resumeTo==='PAUSED_AUTO_CHECK'){S.autoSec+=d;}else{S.manualSec+=d;}
  showOverlay(false);
  setState(S.resumeTo||'RUNNING');
}
function timerEnd(){stopTick();S.tState='ENDED';renderHeader();endExam(true);}

/* per-exercise reduced timer (EXTREMELY HARD terminal only) */
function startPerEx(sec){
  S.perExRemaining=sec;
  if(S.perExHandle){clearInterval(S.perExHandle);}
  S.perExHandle=setInterval(function(){
    if(S.tState!=='RUNNING'||S.perExHandle===null){return;}
    S.perExRemaining--;
    var c=document.getElementById('perx-time');
    if(c){c.textContent=fmtT(Math.max(0,S.perExRemaining));}
    if(S.perExRemaining<=0){stopPerEx();perExExpire();}
  },1000);
}
function stopPerEx(){if(S.perExHandle){clearInterval(S.perExHandle);S.perExHandle=null;}}

function badgeHTML(){return '<span class="badge b-'+SEVK+'">'+esc(SEV)+'</span>';}
function stateChipHTML(){
  var m={
    RUNNING:['▶','Running'],
    PAUSED_MANUAL:['⏸','Paused — manual (press Resume)'],
    PAUSED_AUTO_CHECK:['⏸','PAUSED — reviewing feedback (resumes on Next)'],
    ENDED:['■','Ended']
  }[S.tState]||['■','Ended'];
  return '<span class="chip-state st-'+S.tState+'"><span aria-hidden="true">'+m[0]+'</span>&nbsp;'+m[1]+'</span>';
}
function scoreParts(){
  var n=0,sum=0,k;
  for(k in S.answered){if(S.answered[k]){n++;sum+=S.credit[k];}}
  return {n:n,sum:sum,pct:n?Math.round(sum/n*100):0};
}
function renderHeader(){
  var h=document.getElementById('hdr');
  if(!h){return;}
  var sp=scoreParts();
  document.getElementById('h-count').textContent='Exercise '+(S.cur==null?'—':(S.pos+1))+' of '+S.order.length;
  document.getElementById('h-timer').textContent=fmtT(S.remaining);
  document.getElementById('h-state').innerHTML=stateChipHTML();
  document.getElementById('h-score').textContent=(Math.round(sp.sum*10)/10)+' / '+sp.n+(sp.n?' · '+sp.pct+'%':'');
}

  ovl.innerHTML='<div class="ovl-card"><div style="font-size:34px" aria-hidden="true">⏸</div>'
   +'<div class="big">Paused — manual break</div>'
   +'<p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>'
   +'<button id="btn-resume" class="btn primary" type="button">Resume</button></div>';
  app.appendChild(ovl);
  document.getElementById('btn-hint').addEventListener('click',onHint);
  document.getElementById('btn-pause').addEventListener('click',function(){
    if(S.tState==='PAUSED_MANUAL'){resumeManual();}else{pauseManual();}
    document.getElementById('btn-pause').textContent=(S.tState==='PAUSED_MANUAL')?'Resume':'Pause';
  });
  document.getElementById('btn-resume').addEventListener('click',function(){
    resumeManual();
    document.getElementById('btn-pause').textContent=(S.tState==='PAUSED_MANUAL')?'Resume':'Pause';
  });
  document.getElementById('btn-skip').addEventListener('click',onSkip);
  renderHeader();
}

/* ================= exercise rendering ================= */
var hasAnswer=false, curGrade=null, locked=false;
function effType(exd){return exd.type==='logq'?(exd.widget.type):exd.type;}

function renderExercise(i,fromReview){
  hasAnswer=false;curGrade=null;locked=false;stopPerEx();
  document.getElementById('btn-hint').style.display='';
  document.getElementById('btn-skip').style.display='';
  document.getElementById('btn-pause').style.display='';
  document.getElementById('btn-hint').disabled=!!S.hint[i];
  S.cur=i;
  var exd=DATA.exercises[i];
  var main=document.getElementById('main');
  main.innerHTML='';
  var card=el('div','card');

  /* SCENARIO */
  var sb=el('section','blk blk-scen');
  sb.innerHTML='<div class="blk-h h-scen"><span class="bico" aria-hidden="true">☰</span> SCENARIO'
    +'<button class="tgl" type="button" aria-expanded="true" aria-label="Collapse or expand scenario">▾</button></div>'
    +'<div class="sumline">'+esc(exd.sum)+'</div>'
    +'<div class="blk-b collapsible"><div class="prose">'+exd.scen+'</div>'+artsHTML(exd)+'</div>';
  card.appendChild(sb);
  sb.querySelector('.tgl').addEventListener('click',function(){
    sb.classList.toggle('collapsed');
    this.textContent=sb.classList.contains('collapsed')?'▸':'▾';
    this.setAttribute('aria-expanded',sb.classList.contains('collapsed')?'false':'true');
  });

  /* QUESTION */
  var qb=el('section','blk');
  qb.innerHTML='<div class="blk-h h-q"><span class="bico" aria-hidden="true">?</span> QUESTION</div>'
    +'<div class="blk-b"><b>'+exd.q+'</b>'+(exd.note?'<div class="qnote">'+exd.note+'</div>':'')+'</div>';
  card.appendChild(qb);

  /* YOUR ANSWER */
  var ab=el('section','blk blk-a');
  var abody=el('div','blk-b');
  ab.innerHTML='<div class="blk-h h-a"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>';
  ab.appendChild(abody);
  card.appendChild(ab);

  var api={
    mark:function(){hasAnswer=true;if(btnCheck){btnCheck.disabled=false;}},
    lock:function(){locked=true;}
  };
  var WIDGETS={qcm:WQCM,multi:WMULTI,match:WMATCH,dd:WDD,order:WORDER,fill:WFILL,term:WTERM,branch:WBRANCH,triage:WTRIAGE};
  var gt=effType(exd);
  if(exd.type==='logq'){renderLogPanel(abody,exd);}
  var wbox=el('div','wbox');
  abody.appendChild(wbox);
  var baseGrade=WIDGETS[gt](wbox,exd.type==='logq'?exd.widget:exd,api);
  curGrade=function(){
    var g=baseGrade();
    if(!g.exHTML){g.exHTML=exd.ex;}
    if(g.dangerHTML==null){g.dangerHTML='';}
    return g;
  };

  var hintBox=el('div','hintbox-slot');
  card.appendChild(hintBox);

  var fbzone=el('div','fbzone');
  fbzone.setAttribute('aria-live','polite');
  card.appendChild(fbzone);

  /* nav */
  var nav=el('div','nav');
  var btnCheck=el('button','btn primary','Check');
  btnCheck.type='button';btnCheck.disabled=!hasAnswer; /* sync initial state (widgets may have marked already) */
  var btnNext=el('button','btn danger');btnNext.type='button';btnNext.style.display='none';
  var isLast=(S.pos>=S.order.length-1);
  nav.appendChild(btnCheck);nav.appendChild(btnNext);
  nav.appendChild(el('div','spacer'));
  card.appendChild(nav);
  main.appendChild(card);

  /* per-exercise reduced timer */
  if(exd.perSec&&!fromReview){
    var px=el('div','perx','<span aria-hidden="true">⏱</span> This exercise has its own reduced timer: <span id="perx-time">'+fmtT(exd.perSec)+'</span> — it does not stop the main exam clock. If it runs out, the exercise is excluded.');
    abody.insertBefore(px,wbox);
    startPerEx(exd.perSec);
  }

  btnCheck.addEventListener('click',function(){
    if(!hasAnswer||locked){return;}
    pauseAuto();                       /* first action: stop the clock before feedback */
    var g=curGrade();
    var pen=S.hint[i]?0.10:0;
    var credit=Math.max(0,g.credit-pen);
    S.credit[i]=credit;S.answered[i]=true;
    if(S.reviewReturn){removeFromSkip(i);}
    renderFeedback(fbzone,exd,g,credit,pen);
    lockWidget(abody);
    btnCheck.disabled=true;
    stopPerEx();
    btnNext.textContent=isLast?'Final Submit':'Next exercise';
    btnNext.style.display='';
    btnNext.focus();
    renderHeader();
  });
  btnNext.addEventListener('click',onNext);
  renderHeader();
}
function lockWidget(abody){
  locked=true;
  var list=abody.querySelectorAll('button,input,select');
  for(var i=0;i<list.length;i++){
    var b=list[i];
    if(b.classList.contains('tgl')){continue;}
    b.disabled=true;
  }
}
function removeFromSkip(i){
  var p=S.skip.indexOf(i);
  if(p>=0){S.skip.splice(p,1);}
  delete S.skipSet[i];
}

/* skip / hint / next */
function onSkip(){
  if(locked){return;}
  if(!S.skipSet[S.cur]){S.skip.push(S.cur);S.skipSet[S.cur]=true;}
  S.reviewReturn=false; /* rejoining the main flow: do not bounce back to the review screen later */
  stopPerEx();
  if(S.pos>=S.order.length-1){
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }else{
    S.pos++;renderExercise(S.order[S.pos],false);
  }
}
function onHint(){
  if(S.hint[S.cur]||locked){return;}
  S.hint[S.cur]=true;
  var exd=DATA.exercises[S.cur];
  var hb=document.querySelector('.hintbox-slot');
  if(hb){hb.innerHTML='<div class="hintbox"><b>Hint</b> — '+exd.hint+' <span class="hintcost">(costs 10% of this exercise\'s credit)</span></div>';}
  document.getElementById('btn-hint').disabled=true;
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){setState('RUNNING');}
  /* Next is only reachable after Check (it is hidden until then); if it ever
     fires with the current exercise unanswered, do nothing rather than
     silently abandoning the exercise. */
  if(!S.answered[S.cur]){return;}
  var isLast=(S.pos>=S.order.length-1);
  if(S.reviewReturn){S.reviewReturn=false;screenReview();return;}
  if(!isLast){S.pos++;renderExercise(S.order[S.pos],false);}
  else{
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }
}

/* ================= feedback ================= */
function fbLabel(credit){
  if(credit>=1){return ['ok','✓','CORRECT'];}
  if(credit>0){return ['part','✓','PARTIALLY CORRECT'];}
  return ['bad','✗','INCORRECT'];
}
function renderFeedback(zone,exd,g,credit,pen){
  var L=fbLabel(credit);
  var h='<div class="fb '+L[0]+'"><div class="fb-h"><span aria-hidden="true">'+L[1]+'</span> '+L[2]
    +(pen?'<span class="hintcost">· hint used: −0.10 credit</span>':'')+'</div><div class="fb-b">';
  h+='<div class="fbc">credit '+credit.toFixed(2)+(g.N?' — '+g.H+'/'+g.N+' items · (H − W) / N = ('+g.H+' − '+g.W+') / '+g.N:'')+'</div>';
  if(g.items&&g.items.length){
    h+='<ul class="fb-items">';
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      var ic=it.status==='ok'?'<span class="icook">✓ Correct</span>':it.status==='bad'?'<span class="icbad">✗ Wrong</span>':'<span class="icmiss">○ Missed</span>';
      h+='<li class="'+(it.status==='ok'?'i-ok':it.status==='bad'?'i-bad':'i-miss')+'">'+ic+' — <b>'+it.label+'</b>'+(it.note?'<br>'+it.note:'')+'</li>';
    }
    h+='</ul>';
  }
  if(g.dangerHTML){h+='<div class="danger-note">⚠ '+g.dangerHTML+'</div>';}
  h+='<div class="prose">'+g.exHTML+'</div>';
  h+='<div class="study"><b>What to study:</b> '+exd.study+'</div>';
  h+='</div></div>';
  zone.innerHTML=h;
  if(g.postRender){g.postRender(zone);}
}

/* ================= widgets ================= */
function WQCM(box,exd,api){
  var st={sel:null};
  var opts=exd.opts.map(function(o,i){return {o:o,i:i};});
  opts=shuffle(opts);
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.innerHTML='<span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      st.sel=p.i;
      var all=wrap.querySelectorAll('.opt');
      for(var z=0;z<all.length;z++){all[z].classList.remove('sel');all[z].setAttribute('aria-pressed','false');}
      b.classList.add('sel');b.setAttribute('aria-pressed','true');api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=-1;
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct=i;break;}}
    var selArr=(st.sel==null)?[]:[st.sel];
    var credit=scoreExercise(selArr,[correct],1);
    var items=[];
    exd.opts.forEach(function(o,i){
      if(i===correct){items.push({label:o.t,status:(st.sel===i)?'ok':'miss',note:o.why||''});}
      else if(st.sel===i){items.push({label:o.t,status:'bad',note:o.why||''});}
    });
    return {credit:credit,H:(st.sel===correct?1:0),W:(st.sel!=null&&st.sel!==correct?1:0),N:1,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMULTI(box,exd,api){
  var st={sel:{}};
  var opts=shuffle(exd.opts.map(function(o,i){return {o:o,i:i};}));
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F','G'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="box" aria-hidden="true"></span><span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.addEventListener('click',function(){
      st.sel[p.i]=!st.sel[p.i];
      if(!st.sel[p.i]){delete st.sel[p.i];}
      b.classList.toggle('sel',!!st.sel[p.i]);
      b.setAttribute('aria-pressed',st.sel[p.i]?'true':'false');
      api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=[];
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct.push(i);}}
    var selArr=[];for(var k in st.sel){if(st.sel[k]){selArr.push(parseInt(k,10));}}
    var N=correct.length;
    var corr={};correct.forEach(function(i){corr[i]=true;});
    var H=0,W=0;
    selArr.forEach(function(i){if(corr[i]){H++;}else{W++;}});
    var credit=scoreExercise(selArr,correct,N);
    var items=[];
    exd.opts.forEach(function(o,i){
      var picked=!!st.sel[i];
      if(o.c){items.push({label:o.t,status:picked?'ok':'miss',note:o.why||'This belongs in the answer set.'});}
      else if(picked){items.push({label:o.t,status:'bad',note:o.why||'This does not belong in the answer set.'});}
    });
    return {credit:credit,H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMATCH(box,exd,api){
  var rights=shuffle(exd.pairs.map(function(p){return p.r;}));
  var st={};
  var wrap=el('div');
  exd.pairs.forEach(function(p,i){
    var row=el('div','mrow');
    var selHtml='<select class="selctl" data-i="'+i+'" aria-label="Match for item '+(i+1)+'"><option value="">— choose —</option>';
    rights.forEach(function(r){selHtml+='<option>'+esc(r)+'</option>';});

    row.innerHTML='<div class="mleft">'+esc(p.l)+'</div>'+selHtml;

  });

  return function(){
    var N=exd.pairs.length;
    var corr=[],selArr=[],items=[];
    exd.pairs.forEach(function(p,i){
      corr.push('ok:'+i);

      else if(v===p.r){selArr.push('ok:'+i);items.push({label:p.l+' → '+p.r,status:'ok',note:p.why||''});}
      else{selArr.push('bad:'+i);items.push({label:p.l+' — you chose "'+v+'", correct is "'+p.r+'"',status:'bad',note:p.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WDD(box,exd,api){
  var zones={};exd.zones.forEach(function(z){zones[z.k]=z;});
  var wrap=el('div','ddwrap');
  var bank=el('div','bank');bank.setAttribute('aria-label','Item bank');
  var zg=el('div','zones');
  exd.zones.forEach(function(z){
    var d=el('div','zone');d.setAttribute('data-zone',z.k);
    d.innerHTML='<div class="zone-h">'+esc(z.n)+'</div>';
    d.appendChild(el('div','zone-items'));
    zg.appendChild(d);
  });
  wrap.appendChild(bank);wrap.appendChild(zg);
  box.appendChild(wrap);
  var st={}; /* item index -> zone key or absent */
  function place(chip,zd){
    zd.querySelector('.zone-items').appendChild(chip);
    st[chip.getAttribute('data-i')]=zd.getAttribute('data-zone');
    chip.classList.remove('picked');
    api.mark();
  }
  var picked=null,drag=null;
  function zoneAt(x,y){
    var els=document.elementsFromPoint?document.elementsFromPoint(x,y):[];
    for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains('zone')){return els[i];}}
    return null;
  }
  var ordered=exd.items.map(function(it,i){return {it:it,i:i};});
  var items=shuffle(ordered);
  items.forEach(function(p){
    var c=el('span','chip',esc(p.it.t));
    c.setAttribute('data-i',p.i);
    bank.appendChild(c);
  });
  wrap.addEventListener('pointerdown',function(e){
    var chip=e.target.closest?e.target.closest('.chip'):null;
    if(!chip||locked){return;}
    drag={chip:chip,sx:e.clientX,sy:e.clientY,pid:e.pointerId,ghost:null,moved:false};
    try{chip.setPointerCapture(e.pointerId);}catch(err){}
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&(Math.abs(dx)>7||Math.abs(dy)>7)){
      drag.moved=true;
      var g=drag.chip.cloneNode(true);
      g.className='chip ghost';g.style.width=drag.chip.offsetWidth+'px';
      document.body.appendChild(g);drag.ghost=g;drag.chip.classList.add('src');
    }
    if(drag.moved){
      if(drag.ghost){drag.ghost.style.left=(e.clientX+10)+'px';drag.ghost.style.top=(e.clientY+10)+'px';}
      var z=zoneAt(e.clientX,e.clientY);
      var all=zg.querySelectorAll('.zone.over');
      for(var i=0;i<all.length;i++){all[i].classList.remove('over');}
      if(z){z.classList.add('over');}
      e.preventDefault();
    }
  });
  wrap.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(drag.moved){
      var z=zoneAt(e.clientX,e.clientY);
      var all=zg.querySelectorAll('.zone.over');
      for(var i=0;i<all.length;i++){all[i].classList.remove('over');}
      if(z){place(drag.chip,z);}
      if(drag.ghost){drag.ghost.remove();}
      drag.chip.classList.remove('src');
    }else{
      var ch=drag.chip;
      if(picked===ch){ch.classList.remove('picked');picked=null;}
      else{
        if(picked){picked.classList.remove('picked');}
        if(ch.parentElement&&ch.parentElement.classList&&ch.parentElement.classList.contains('zone-items')){
          bank.appendChild(ch);delete st[ch.getAttribute('data-i')];
        }else{picked=ch;ch.classList.add('picked');}
      }
    }
    drag=null;
  });
  wrap.addEventListener('click',function(e){
    if(!picked||locked){return;}
    var z=e.target.closest?e.target.closest('.zone'):null;
    if(z){place(picked,z);picked.classList.remove('picked');picked=null;}
  });
  return function(){
    var N=exd.items.length;
    var corr=[],selArr=[],items=[];
    exd.items.forEach(function(it,i){
      corr.push('ok:'+i);
      var zname='';
      for(var z=0;z<exd.zones.length;z++){if(exd.zones[z].k===it.z){zname=exd.zones[z].n;break;}}
      var v=st[i]||'';
      if(!v){items.push({label:it.t+' → '+zname,status:'miss',note:it.why||''});}
      else if(v===it.z){selArr.push('ok:'+i);items.push({label:it.t+' → '+zname,status:'ok',note:it.why||''});}
      else{selArr.push('bad:'+i);items.push({label:it.t+' — you placed it in "'+zones[v].n+'", correct is "'+zname+'"',status:'bad',note:it.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WORDER(box,exd,api){
  var st={};
  st.seq=shuffle(exd.items.map(function(_,i){return i;}));
  var wrap=el('div','olist');
  box.appendChild(wrap);
  function draw(){
    wrap.innerHTML='';
    st.seq.forEach(function(i,pos){
      var row=el('div','orow');row.setAttribute('data-i',i);
      row.innerHTML='<span class="onum">'+(pos+1)+'</span><span class="otxt">'+esc(exd.items[i].t)+'</span>'
        +'<span class="obtns"><button class="obtn" type="button" data-mv="-1" aria-label="Move up">↑</button>'
        +'<button class="obtn" type="button" data-mv="1" aria-label="Move down">↓</button></span>';
      wrap.appendChild(row);
    });
  }
  draw();
  api.mark(); /* the initial (shuffled) order is itself a valid submission state */
  wrap.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.obtn'):null;
    if(!b||locked){return;}
    var row=b.closest('.orow');
    var i=st.seq.indexOf(parseInt(row.getAttribute('data-i'),10));
    var d=parseInt(b.getAttribute('data-mv'),10);
    var j=i+d;
    if(j<0||j>=st.seq.length){return;}
    var t=st.seq[i];st.seq[i]=st.seq[j];st.seq[j]=t;
    draw();api.mark();
  });
  var drag=null;
  wrap.addEventListener('pointerdown',function(e){
    if(locked){return;}
    var row=e.target.closest?e.target.closest('.orow'):null;
    if(!row||(e.target.closest&&e.target.closest('.obtn'))){return;}
    drag={row:row,sy:e.clientY,pid:e.pointerId,moved:false};
    try{row.setPointerCapture(e.pointerId);}catch(err){}
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(!drag.moved&&Math.abs(e.clientY-drag.sy)>7){drag.moved=true;drag.row.classList.add('dragging');}
    if(!drag.moved){return;}
    e.preventDefault();
    var rows=wrap.querySelectorAll('.orow');
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(r===drag.row){continue;}
      var rc=r.getBoundingClientRect();
      if(e.clientY>rc.top&&e.clientY<rc.bottom){
        if(e.clientY<rc.top+rc.height/2){wrap.insertBefore(drag.row,r);}
        else{wrap.insertBefore(drag.row,r.nextSibling);}
        break;
      }
    }
  });
  wrap.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(drag.moved){
      drag.row.classList.remove('dragging');
      var newSeq=[];
      var rows=wrap.querySelectorAll('.orow');
      for(var i=0;i<rows.length;i++){newSeq.push(parseInt(rows[i].getAttribute('data-i'),10));}
      st.seq=newSeq;api.mark();
    }
    drag=null;
  });
  return function(){
    var N=exd.items.length;
    var corr=[],selArr=[],items=[];
    st.seq.forEach(function(itemIdx,pos){
      corr.push('ok:'+pos);
      if(itemIdx===pos){selArr.push('ok:'+pos);items.push({label:'Position '+(pos+1)+' — '+exd.items[pos].t,status:'ok'});}
      else{selArr.push('bad:'+pos);items.push({label:'Position '+(pos+1)+' — you put "'+exd.items[itemIdx].t+'", correct is "'+exd.items[pos].t+'"',status:'bad'});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WFILL(box,exd,api){
  var bank=shuffle(exd.bank);
  var st={};
  var wrap=el('div');

  html+='<div class="qnote" style="margin-top:10px"><b>Word bank:</b> '+bank.map(function(w){return '<span class="mchip">'+esc(w)+'</span>';}).join(' ')+'</div>';
  wrap.innerHTML=html;

  wrap.addEventListener('change',function(e){if(e.target.tagName==='SELECT'){st[e.target.getAttribute('data-b')]=e.target.value;api.mark();}});
  return function(){
    var N=0,i;
    for(i=0;i<exd.seg.length;i++){if(typeof exd.seg[i]!=='string'){N++;}}
    var corr=[],selArr=[],items=[];
    var bi=0;
    exd.seg.forEach(function(sg){
      if(typeof sg==='string'){return;}
      corr.push('ok:'+bi);
      var v=st[bi]||'';
      if(!v){items.push({label:'Blank '+(bi+1)+' → "'+sg.a+'"',status:'miss',note:sg.why||''});}
      else if(v===sg.a){selArr.push('ok:'+bi);items.push({label:'Blank '+(bi+1)+' → "'+sg.a+'"',status:'ok',note:sg.why||''});}

function WTERM(box,exd,api){
  var term=el('div','term');
  var out=el('div','term-out');
  var line=el('div','term-line');
  var inp=document.createElement('input');
  inp.className='tin';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','Terminal input');
  var run=el('button','btn mini','Run');run.type='button';
  line.innerHTML='<span class="tp">'+esc(exd.term.prompt)+'</span>';
  line.appendChild(inp);line.appendChild(run);
  term.appendChild(out);term.appendChild(line);
  box.appendChild(term);
  var lastCmd='';
  var norm=function(c){return String(c).toLowerCase().replace(/\s+/g,' ').replace(/[\[\]]/g,'').replace(/['"]/g,'').trim();};
  var outMap={};
  var k;
  if(exd.term.out){for(k in exd.term.out){outMap[norm(k)]=exd.term.out[k];}}
  function echo(cmd,n){
    out.appendChild(el('div','tline','<span class="tp">'+esc(exd.term.prompt)+'</span> '+esc(cmd)+(n!==norm(cmd)?'   <span class="t-ts">[normalised: '+esc(n)+']</span>':'')));
  }
  function puts(txt,cls){
    String(txt).split('\n').forEach(function(l){out.appendChild(el('div','tline'+(cls?' '+cls:''),hl(l)));});
  }
  function runCmd(){
    var v=inp.value;
    if(!v.trim()){return;}
    var n=norm(v);
    echo(v,n);
    if(n==='clear'){out.innerHTML='';}
    else if(n==='pwd'){puts('/home/analyst');}
    else if(n==='ls'||n==='ls -la'||n==='ls -l'){puts('cases   evidence   logs   notes.txt');}
    else if(n==='help'){puts('Commands known in this lab: '+(exd.term.avail||[]).join(', ')+', plus pwd / ls / clear / help.');}
    else if(outMap[n]!=null){
      lastCmd=n;
      puts(outMap[n]);
    }else{
      var tok=v.trim().split(/\s+/)[0];
      out.appendChild(el('div','tline t-err','bash: '+esc(tok)+': command not found (this lab only knows: '+(exd.term.avail||[]).join(', ')+')'));
      lastCmd=n; /* wrong tool attempt is graded too */
    }
    inp.value='';
    out.scrollTop=out.scrollHeight;
    api.mark();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){runCmd();}});
  run.addEventListener('click',runCmd);
  return function(){
    var els=exd.term.elements;
    var forb=exd.term.forbidden||[];
    var N=els.length;
    var corr=[],selArr=[],items=[],danger=[];
    els.forEach(function(e2,i){
      corr.push('ok:'+i);
      var hit=new RegExp(e2.re,'i').test(lastCmd);
      if(hit){selArr.push('ok:'+i);items.push({label:e2.name,status:'ok',note:e2.desc});}
      else{items.push({label:e2.name,status:'miss',note:e2.desc});}
    });
    forb.forEach(function(f){
      if(new RegExp(f.re,'i').test(lastCmd)){
        selArr.push('bad:f'+danger.length);
        items.push({label:f.name,status:'bad',note:f.desc});
        danger.push('<b>'+esc(f.name)+'</b> — '+f.desc);
      }
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    var g={credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:danger.length?danger.join('<br>'):''};
    g.postRender=function(zone){
      var code=el('div');
      code.innerHTML='<div class="qnote" style="margin-top:10px"><b>Canonical command:</b></div><pre class="codeblk">'+esc(exd.term.canonical)+'</pre>';
      var cb=el('button','btn mini','Copy');cb.type='button';
      cb.addEventListener('click',function(){copyTxt(cb,exd.term.canonical);});
      code.appendChild(cb);
      var parts='';
      for(var i=0;i<exd.term.elements.length;i++){parts+='<li><b>'+esc(exd.term.elements[i].name)+'</b> — '+exd.term.elements[i].desc+'</li>';}
      var expl=el('div');
      expl.innerHTML='<ul>'+parts+'</ul>';
      code.appendChild(expl);
      zone.appendChild(code);
    };
    if(!lastCmd){g.exHTML='<p><b>No command was run.</b> In the fake shell, type a command and press Enter (or press Run), then press Check. This attempt scored 0 because no command could be graded.</p>'+exd.ex;}
    return g;
  };
}
function WBRANCH(box,exd,api){
  var st={step:0,picks:[],done:false};
  var wrap=el('div');
  var prog=el('div','qnote','<b>Progress log</b><ul style="margin:6px 0 0;padding-left:20px" id="blog"></ul>');
  var stepBox=el('div');
  wrap.appendChild(prog);wrap.appendChild(stepBox);
  box.appendChild(wrap);
  var blogEl=wrap.querySelector('#blog');
  function renderStep(){
    var k=st.step;
    var s=exd.steps[k];
    stepBox.innerHTML='';
    var head=el('div');
    var opts=s.opts.map(function(o){return o;});
    opts=shuffle(opts);
    var html='<p><span class="stepchip">STEP '+(k+1)+' OF '+exd.steps.length+'</span></p>';
    if(s.add){html+='<div class="prose" style="margin-top:8px">'+s.add+'</div>';}
    html+='<p style="margin-top:10px"><b>'+s.q+'</b></p><div class="opts">';
    var letters=['A','B','C','D'];
    opts.forEach(function(p,i){
      html+='<button class="opt" type="button" data-i="'+p.i+'"><span class="lbl">'+letters[i]+'.</span><span>'+p.o.t+'</span></button>';
    });
    html+='</div><div style="margin-top:10px"><button class="btn primary" type="button" id="bconfirm" disabled>Confirm step</button></div>';
    head.innerHTML=html;
    stepBox.appendChild(head);
    var selIdx=null;
    var bc=stepBox.querySelector('#bconfirm');
    var ob=stepBox.querySelectorAll('.opt');
    for(var i=0;i<ob.length;i++){
      ob[i].addEventListener('click',function(){
        selIdx=parseInt(this.getAttribute('data-i'),10);
        var all=stepBox.querySelectorAll('.opt');
        for(var z=0;z<all.length;z++){all[z].classList.remove('sel');}
        this.classList.add('sel');
        bc.disabled=false;
      });
    }
    bc.addEventListener('click',function(){
      if(selIdx==null){return;}
      st.picks[k]=selIdx;
      var li=document.createElement('li');
      li.textContent=(k+1)+'. '+s.out;
      blogEl.appendChild(li);
      if(k<exd.steps.length-1){st.step++;renderStep();}
      else{st.done=true;stepBox.innerHTML='<div class="qnote">All steps recorded. Press <b>Check</b> to grade the whole decision chain.</div>';api.mark();}
    });
  }
  renderStep();
  return function(){
    var N=exd.steps.length;
    var corr=[],selArr=[],items=[];
    exd.steps.forEach(function(s,i){
      corr.push('ok:'+i);
      var p=st.picks[i];
      var chosen=null;
      if(p!=null){for(var j=0;j<s.opts.length;j++){if(s.opts[j].i===p){chosen=s.opts[j];break;}}}
      var right=null;
      for(var j2=0;j2<s.opts.length;j2++){if(s.opts[j2].o.c){right=s.opts[j2].o;break;}}
      if(p==null){items.push({label:'Step '+(i+1),status:'miss',note:'No choice recorded. Correct was: "'+right.t+'".'});}
      else if(chosen.o.c){selArr.push('ok:'+i);items.push({label:'Step '+(i+1)+' — '+chosen.o.t,status:'ok',note:chosen.o.why||''});}
      else{selArr.push('bad:'+i);items.push({label:'Step '+(i+1)+' — you chose "'+chosen.o.t+'", best is "'+right.t+'"',status:'bad',note:chosen.o.why||right.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}

function startExam(){
  S=freshState();

function buildOrder(){
  var ord=shuffle(DATA.exercises.map(function(_,i){return i;}));
  var isT=function(i){return !!DATA.exercises[i].terminal;};
  var guard=0;
  while(guard++<60){
    var fixed=false;
    for(var k=0;k<ord.length-1;k++){
      if(isT(ord[k])&&isT(ord[k+1])){
        var cut=ord.splice(k+1,1)[0];
        var placed=false;
        for(var t=0;t<40&&!placed;t++){
          var p=Math.floor(Math.random()*(ord.length+1));
          var badB=(p>0&&isT(ord[p-1])&&isT(cut));
          var badA=(p<ord.length&&isT(ord[p])&&isT(cut));
          if(!badB&&!badA){ord.splice(p,0,cut);placed=true;}
        }
        if(!placed){
          if(ord.length&&isT(ord[ord.length-1])&&!isT(ord[0])){ord.unshift(cut);}
          else{ord.push(cut);}
        }
        fixed=true;break;
      }
    }
    if(!fixed){break;}
  }
  S.order=ord;
}

function endExam(byTimeout){
  stopTick();stopPerEx();S.tState='ENDED';
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  document.getElementById('btn-pause').style.display='none';
  var ids=[];
  S.order.forEach(function(i){if(S.answered[i]){ids.push(i);}});
  var sum=0,full=0,part=0,partSum=0,zero=0;
  ids.forEach(function(i){var c=S.credit[i];sum+=c;if(c>=1){full++;}else if(c>0){part++;partSum+=c;}else{zero++;}});
  var answered=ids.length;
  var skipped=DATA.exercises.length-answered;
  var pct=answered?Math.round(sum/answered*100):0;
  var passed=pct>=70;
  if(!S.reported){
    S.reported=true;
    try{
      parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,batch:BATCH,
        score:Math.round(sum),total:answered,percent:pct,passed:passed},location.origin);
    }catch(e){/* opened directly: nothing to report to */}
  }
  var main=document.getElementById('main');
  main.innerHTML='';
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML='<div class="pct">'+pct+'%</div>'
    +'<div style="font-size:19px;font-weight:800">'+(passed?'PASS':'FAIL')+' — '+esc(DATA.meta.title)+'</div>'
    +'<p style="margin:8px 0 0">'+(byTimeout?'The exam timer ended. ':'')+'Score over answered exercises only: '+sum.toFixed(1)+' credits / '+answered+' answered. Pass mark: 70%.</p>';
  main.appendChild(hero);
  if(passed){
    var cert=el('div','cert');
    cert.innerHTML='<b>Certificate of completion</b><br>Topic '+esc(TOPIC)+' — tier '+esc(SEV)
      +'<br>Learner: '+esc(USERNAME||'anonymous learner')
      +'<br>Result: '+pct+'% (pass mark 70%) — '+sum.toFixed(1)+' / '+answered+' credits';
    main.appendChild(cert);
  }else{
    var f=el('div','hero prose');
    f.innerHTML='<p>You did not reach the pass mark of 70%. You must retake this tier. Questions and answers will be shuffled again.</p>';
    main.appendChild(f);
  }
  var grid=el('div','statgrid');
  var rows=[['Fully correct',String(full)],['Partially correct',part?(''+part+' (avg '+(partSum/part).toFixed(2)+')'):'0'],['Fully incorrect',String(zero)],['Skipped — excluded',String(skipped)]];
  for(var i=0;i<rows.length;i++){
    var s=el('div','stat');
    s.innerHTML='<div class="n">'+rows[i][1]+'</div><div class="l">'+rows[i][0]+'</div>';
    grid.appendChild(s);
  }
  main.appendChild(grid);
  var pauseStats=el('div','hero prose');
  pauseStats.innerHTML='<div class="sec-h">How your time was spent</div><ul>'
    +'<li>Time in manual breaks: <b>'+fmtT(S.manualSec)+'</b></li>'
    +'<li>Time reviewing feedback (auto-pause on Check): <b>'+fmtT(S.autoSec)+'</b></li>'
    +'<li>Time left on the exam clock: <b>'+fmtT(S.remaining)+'</b></li></ul>';
  main.appendChild(pauseStats);
  var nav=el('div','nav');
  var rb=el('button','btn primary','Retake exam');rb.type='button';
  rb.addEventListener('click',function(){startExam();});
  nav.appendChild(rb);
  main.appendChild(nav);
  renderHeader();
  window.scrollTo(0,0);
}

    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
