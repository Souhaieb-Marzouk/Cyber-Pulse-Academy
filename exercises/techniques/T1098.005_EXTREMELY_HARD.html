var INTRO = {"title":"T1098.005 — EXTREMELY HARD practice exam","object":"ATT&CK object: T1098.005 — Account Manipulation: Device Registration (a Sub-Technique)","partLabel":"","learn":["This is the <b>EXTREMELY HARD</b> level for <b>T1098.005 — Account Manipulation: Device Registration</b> (Sub-Technique of T1098). You already know the mechanics at every level: an attacker enrolls a device into an MFA system (Duo, Okta) or into <b>Microsoft Entra ID</b> / <b>Microsoft Intune</b>, the device looks trusted, and it can carry a <b>PRT</b> that gives silent single sign-on.","Here the exercises stop being single answers and become <b>senior decisions</b>: several artefacts at once, at least one piece of realistic noise, at least one piece of missing information you must reason around, and signals that genuinely contradict each other. One exercise rewards <b>gathering more evidence instead of acting</b>. Another makes you accept a real business cost. Another shows why a widely recommended best practice is <b>wrong in this specific case</b>.","This mirrors the work of a <b>senior incident responder</b> (containment with evidence discipline), a <b>detection engineering lead</b> (coverage and compensating analytics), a <b>threat intelligence analyst</b> (attribution with stated confidence, using real procedures like APT29's dormant-account MFA enrollment and Scattered Spider's VPN persistence), and the <b>CISO's advisor</b> who has ten minutes to brief the executive room. The reference frame stays the ATT&amp;CK page for T1098.005 — tactics <b>Persistence and Privilege Escalation</b>, platforms <b>Identity Provider, Windows</b>, mitigation <b>M1032</b>, detection strategy <b>DET0036</b>.","There is no shame in failing this file on the first pass — that is what the explanations are for. Read them even after a PASS; the near-misses here are the ones that bite in real incidents."],"keywords":[{"theme":"Chain reasoning & evidence","items":["multi-artefact correlation","irrelevant-but-realistic noise","incomplete information handling","evidence preservation before containment"]},{"theme":"T1098.005 core (expert view)","items":["Device Registration (T1098.005)","PRT value and revocation paths","compliance faking via rogue MDM path","internal spearphishing from trusted devices","service exhaustion flood"]},{"theme":"Senior containment","items":["disable vs delete device object","revoke sessions vs password reset","re-registration risk","business cost acceptance"]},{"theme":"Detection & attribution","items":["DET0036 analytics AN0103/AN0104","confidence levels and their drivers","APT29 (G0016) procedures","Scattered Spider (C0027) VPN persistence","AADInternals (S0677) tooling"]},{"theme":"Framework context","items":["Persistence, Privilege Escalation","T1078 Valid Accounts","T1557 Adversary-in-the-Middle","M1032 Multi-factor Authentication"]}],"how":["<b>Pass mark: 70%</b> over the exercises you answered; skipped-and-never-answered exercises are excluded from both sides.","<b>15 exercises, three or more chained concepts each, with conflicting signals.</b> Types: a five-alert executive triage queue, a ten-line multi-source log correlation, a terminal with an evidence-preservation decision, a branching decision tree with business cost, near-miss and multi-select questions, matching of implications, a senior runbook ordering, and report-blank drafting.","<b>Timer:</b> 50 minutes. <b>⏸ Pause</b> for a real break (exercise hidden); <b>✓ Check</b> stops the timer automatically for unlimited feedback study ('⏸ PAUSED — reviewing feedback', resumes on Next).","<b>Partial credit:</b> every multi-item exercise scores per item: credit = max(0, (H − W) ÷ N). Several answers will look almost right — selecting without deciding subtracts.","<b>Hints:</b> one per exercise, −10% of that exercise's credit. At this level a hint only restates a constraint you may have missed — it never points at the answer.","<b>Skip and review:</b> skipped exercises wait in a review pool; you can answer them until the timer ends. Anything never answered is excluded from the score."]};
var EXERCISES = [{"type":"triage","summary":"Five registration alerts, CISO wants decisions in ten minutes","short":"Executive triage: 5 alerts","scenario":"07:58. The CISO wants triage decisions before the 08:10 stand-up. Five registration-related alerts, mixed quality, one duplicate pair, one service-principal anomaly, one conflicting risk state. Choose the decision you would defend in the meeting.","question":"Choose the defensible decision for each alert.","alerts":[{"title":"A-101: device registered for ceo-assistant@corp","meta":"03:44 · hosting-provider IP · first-ever enrollment · no ticket · sign-in from the device 9 minutes later reading calendar and mail","options":[{"id":"o1","label":"Contain now: disable device, revoke sessions, IR takes the account"},{"id":"o2","label":"Wait for the assistant to confirm by reply email"},{"id":"o3","label":"Close — executives enroll new phones frequently"}],"correct":"o1","why":"Registration AND immediate sensitive use from hostile infrastructure is an active intrusion of a high-value mailbox. Asking the assistant by email may reach the attacker, who owns the mailbox."},{"title":"A-102: device registered for field-tech-14","meta":"17:20 · office IP · the field-ops onboarding wave is scheduled today · ticket WAVE-0917 lists field-tech-14","options":[{"id":"o1","label":"Close as expected with the wave ticket reference"},{"id":"o2","label":"Contain — field staff are rarely targeted, so any event is suspect"},{"id":"o3","label":"Escalate to the detection team to retune the wave"}],"correct":"o1","why":"Ticketed, scheduled, office network — the documented legitimate flow. Containing every wave would break field operations for nothing."},{"title":"A-103: device registered for qa-lead-3","meta":"11:02 · corporate VPN IP · user risk state: high (unfamiliar sign-in properties) · device unknown · user does not respond to the team chat","options":[{"id":"o1","label":"Escalate to IR for out-of-band verification — do not close, do not unilaterally wipe"},{"id":"o2","label":"Close — corporate VPN IP vouches for the user"},{"id":"o3","label":"Wipe the user's assigned laptop immediately"}],"correct":"o1","why":"Two signals conflict: trusted network versus high risk and silence. The scoped, defensible move is IR verification out-of-band — wiping hardware destroys evidence and may target the wrong asset."},{"title":"A-104: device registered by service principal svc-inventory-sync","meta":"any time · principal normally only reads device inventory · now it created a device object · owner attribute set to a contractor","options":[{"id":"o1","label":"Escalate: audit the principal's credentials and app grants — unexpected principal behaviour"},{"id":"o2","label":"Close — inventory sync creates device objects all the time"},{"id":"o3","label":"Delete the contractor's account"}],"correct":"o1","why":"The anomaly is the principal stepping outside its baseline (registering instead of reading). Credential abuse of an over-privileged automation identity is the suspected path — audit, then act."},{"title":"A-105: device registered for a.okafor (duplicate)","meta":"identical event to A-101's device id but 4 hours later · different alert connector","options":[{"id":"o1","label":"Correlate: mark as duplicate of A-101's device and fold into that case"},{"id":"o2","label":"Treat as an independent new incident with its own containment"},{"id":"o3","label":"Close as noise because it duplicates"}],"correct":"o1","why":"Same device id means one incident seen twice — deduplicate into the live case. Opening a second containment track (or closing as noise) both mishandle the correlation duty."}],"hint":"One alert is a scheduled wave, one is a duplicate, one hides an automation anomaly — and the CEO assistant alert is already being used.","explain":"<p>Executive triage is scope-plus-proportionality: <b>A-101</b> contains (active use), <b>A-102</b> closes (documented wave), <b>A-103</b> escalates for out-of-band verification (genuine conflict), <b>A-104</b> audits the automation (principal out of baseline), <b>A-105</b> deduplicates into A-101's case. Note what all five have in common: the decision names <b>why</b> — that is what makes it defensible in the 08:10 stand-up.</p>","study":"prioritisation and deduplication across identity alert sources."},{"type":"term","summary":"Capture the device state so it survives the containment","short":"Terminal: preserve before you contain","scenario":"Live case, host FS-HV-02 — a virtual machine registered to the tenant by an attacker who still holds access. Legal has asked for artifacts that survive scrutiny. Containment (disabling the device object) is approved and will happen the moment you report. One consideration: once containment lands, the local registration state may be altered by the cleanup tooling, and a destructive re-registration wipe must not happen before capture. The regulator will ask what the host said BEFORE containment.","question":"Type the command that captures the device's registration state into a file for evidence, run it, then press Check.","term":{"prompt":"C:\\IR\\FS-HV-02>","banner":["IR session — FS-HV-02 (local admin) — evidence handling in effect","Legal requirement: state must be captured to a file BEFORE containment.","Two plausible commands exist in your head right now; one destroys the artefact."],"canonical":"dsregcmd /status > C:\\IR\\FS-HV-02\\dev-state.txt","elements":[{"reSrc":"dsregcmd","label":"tool: dsregcmd","why":"The built-in tool that reports the device's registration state."},{"reSrc":"/status","label":"mode: /status (read-only)","why":"/status prints the state without changing it — the only safe mode on live evidence."},{"reSrc":">\\s*c:\\\\ir\\\\fs-hv-02\\\\dev-state\\.txt|>\\s*\\S+dev-state\\.txt","label":"redirection: output captured to the IR evidence file","why":"The redirect writes the report to a file that survives containment and later tooling."}],"penalties":[{"reSrc":"/leave","label":"DESTRUCTIVE: /leave","why":"/leave un-registers the device — the artefact legal asked for is gone before anyone reads it."},{"reSrc":"/debug\\b","label":"wrong mode: /debug","why":"/debug enables verbose logging to a log file — it is not the state report, and it does not capture the requested evidence."}],"danger":[{"reSrc":"/leave","msg":"dsregcmd /leave would have un-registered the device — destroying exactly the pre-containment artefact legal demanded, and handing the regulator a gap in the record."}],"parts":[{"k":"dsregcmd /status","v":"prints the full registration state (AzureAdJoined, DeviceId, TenantName, AzureAdPrt) without changing anything"},{"k":"> C:\\IR\\FS-HV-02\\dev-state.txt","v":"redirects that report into a named evidence file under the case folder, timestamped by the filesystem"}]},"hint":"The constraint you may have missed is the word BEFORE — whatever you run must both read the state and leave a copy behind.","explain":"<p>The canonical command is <code class=\"inline\">dsregcmd /status &gt; C:\\IR\\FS-HV-02\\dev-state.txt</code>. Element by element: <b>dsregcmd</b> (the built-in tool), <b>/status</b> (read-only — nothing on the host changes), and the <b>redirect</b> that parks the report in the case folder so it survives containment and cleanup tooling. <b>/leave</b> is the destructive near-miss: it un-registers the device and erases the exact artefact legal wants — the 'DANGEROUS — NEAR MISS' flag exists precisely for this decision. Capture first, contain second; the order is the answer.</p>","study":"evidence preservation before containment on live hosts."},{"type":"logview","summary":"Correlate ten lines into the four that prove rogue registration and use","short":"Ten lines, four prove the chain","scenario":"Case FS-HV-02: ten lines from three sources (tenant audit, EDR, sign-in). Four lines together prove: the device was registered by the attacker, from where, and that the attacker then USED it with device trust. The rest is noise, sibling activity, or a genuine false positive.","question":"Click the four lines that jointly prove rogue registration and its use.","lines":[{"id":"z1","text":"audit  'Register device'  actor=fin-reports@corp  ip=185[.]220[.]101[.]34 (hosting)  deviceId=d-5150  result=success","related":true,"why":"The registration itself, by a service account, from hostile infrastructure."},{"id":"z2","text":"edr  proc  dsregcmd.exe /register  parent=wscript.exe  host=FS-HV-02  user=fin-reports","related":true,"why":"The host-side execution — spawned by a script host, not by IT tooling."},{"id":"z3","text":"signin  user=fin-reports  device=d-5150  mfa='satisfied by device'  ip=185[.]220[.]101[.]34  result=success","related":true,"why":"First device-trusted sign-in from the same hosting IP — the trust is being used."},{"id":"z4","text":"mail  internal spearphishing alert: payroll-themed mail to 61 staff, sent via device session of d-5150","related":true,"why":"The monetisation: intra-organisational mail from the trusted device — exactly the abuse the ATT&CK page names."},{"id":"z5","text":"audit  'Register device'  actor=it-onboarding-svc  ip=192[.]0[.]2[.]10 (office)  deviceId=d-5177  result=success","related":false,"why":"The legitimate onboarding service principal registering a managed device — a true false positive for THIS chain."},{"id":"z6","text":"edr  proc  dsregcmd.exe /status  parent=explorer.exe  host=FS-HV-02","related":false,"why":"Someone (or something) read the state — no mutation, no chain membership."},{"id":"z7","text":"signin  user=fin-reports  device=none  mfa='push'  ip=185[.]220[.]101[.]34  result=blocked","related":false,"why":"A blocked, device-less attempt from the same IP — attacker noise, not the device-trust chain."},{"id":"z8","text":"audit  'Add delegated permission'  actor=fin-reports  target=mailbox finance-shared","related":false,"why":"Sibling Account Manipulation (email delegate) by the same actor — separate finding, not the device chain."},{"id":"z9","text":"edr  proc  Teams.exe → teams.microsoft[.]com  host=FS-HV-02","related":false,"why":"Routine application traffic."},{"id":"z10","text":"audit  'Update device'  device=d-5150  attribute=deviceName  value=FINANCE-PRINT-02","related":false,"why":"A rename that makes the device look like a printer — attacker hygiene. Suspicious, but not one of the four PROOF lines asked for."}],"hint":"Proof = registered (cloud) + registered (host) + used (trust) + monetised (abuse). Two lines share the hostile IP but never touch the device.","explain":"<p>Z1→Z2→Z3→Z4 is the full proof: cloud registration, host execution, device-trusted use, and monetisation via internal spearphishing. Z5 is the <b>true false positive</b> that keeps detections honest (same event, legitimate principal). Z10 — renaming the device to look like infrastructure — is a real find worth its own ticket, but the question asked for the four proof lines; reading the ask precisely is part of the exercise.</p>","study":"multi-source proof chains for T1098.005."},{"type":"qcm","summary":"Two signals contradict: the tenant logs or the HR record?","short":"Which signal wins?","scenario":"The registration for p.moreau came from Amsterdam on a hosting network. Device-trusted sign-ins from Amsterdam followed. HR's travel record says p.moreau is on leave in Japan until the 24th, and p.moreau answered the out-of-band SMS with 'yes it's me, I got a new laptop in Amsterdam'. No laptop was issued by IT — the asset register has none. The CISO needs a decision in ten minutes.","question":"Which reading wins, and what is the action?","options":[{"id":"a","label":"Tenant telemetry + asset absence win: the in-band 'yes' may be the attacker — contain the device, revoke sessions, re-verify by a second channel"},{"id":"b","label":"The user's SMS confirmation wins: close as a self-purchased laptop"},{"id":"c","label":"The HR record wins: impossible — the user is in Japan, so the logs must be duplicated"},{"id":"d","label":"Nothing is conclusive: wait for the user to return on the 24th"}],"correct":["a"],"itemWhy":{"b":"The confirmation arrived on a channel the attacker may control (the mailbox or the device itself). In-band confirmations cannot clear device-trust anomalies.","c":"A 'duplicated log' theory does not explain the PRT-protected device session — logs from the identity plane are authoritative for what happened on it.","d":"Waiting leaves an active, trusted foothold on a privileged mailbox for days."},"hint":"One signal is data the attacker can influence. One signal cannot lie about what happened on the platform. One fact (the asset register) supports the worst case.","explain":"<p><b>Which wins and why:</b> platform telemetry (device object, PRT sign-ins) is authoritative for what happened; the asset register (no laptop issued) corroborates the hostile reading; and the SMS 'yes' is worthless because it travelled over a channel the attacker owns — the classic confirmation trap. Two contradictions resolved, one action remains: contain (disable device, revoke sessions) and re-verify through a second, independent channel. 'Do the logs win or does HR win' is the decision a senior analyst is paid to make.</p><p><b>Attacker view:</b> the operator bet that a believable SMS 'yes' and a quiet enrollment would blend into onboarding noise. <b>Defender view:</b> you win by trusting platform telemetry over user testimony, containing the device object, and re-verifying through a second independent channel — exactly the order this exercise rewards.</p>","study":"signal precedence and in-band confirmation traps."},{"type":"match","summary":"Match each technical fact to the implication it carries","short":"Facts → implications","scenario":"You are writing the technical annex. Four facts are confirmed; each carries exactly one decision-relevant implication. Match them — the annex dies if the implications are swapped.","question":"Match each fact to its implication.","pairs":[{"left":"The device holds a PRT issued before the password reset","right":"resetting the password alone does not evict the attacker","why":"Device-issued tokens do not die with the password — eviction needs the device trust killed or the token revoked."},{"left":"Compliance state was set by a management tenant nobody owns","right":"the compliant-device rule was satisfied by a faked state","why":"An unowned MDM path asserting 'compliant' is how the device rule gets bypassed."},{"left":"Token protection is not enforced for the affected flows","right":"a stolen token can be replayed from anywhere","why":"Without token binding, exported tokens remain usable off-device — revocation must be total."},{"left":"The registration used a legacy authentication flow","right":"the MFA context at enrollment is weak or absent","why":"Legacy flows bypass modern MFA enforcement — the enrollment likely needed only the password."}],"hint":"Each implication answers 'so what?' for the containment or prevention decision.","explain":"<p>These four implications drive the whole case: <b>PRT survives resets</b> (so eviction is device-side, not password-side), <b>compliance can be faked</b> (so the compliant-device rule is not proof of health), <b>no token protection</b> (so revocation must cover replay), and <b>legacy-auth enrollment</b> (so the M1032 control never fired). Writing implications — not restatements — is what makes an annex actionable.</p>","study":"PRT revocation, token protection, and legacy-auth enrollment gaps."},{"type":"dnd","summary":"Drag each containment action onto its true effect","short":"Actions → true effects","scenario":"The war room lists four candidate actions. Match each to the effect it ACTUALLY produces — two of these are commonly believed to do something they do not do.","question":"Drag each action to the effect it produces.","itemsPool":[{"id":"w1","label":"Disable the device object"},{"id":"w2","label":"Revoke the user's sessions / refresh tokens"},{"id":"w3","label":"Reset the user's password"},{"id":"w4","label":"Delete the device object"}],"slots":[{"label":"Kills the device's trusted path and its PRT-based access","accept":["w1"],"why":"Disabling the device is the direct kill for the device foothold — the trust itself stops working."},{"label":"Drops stolen tokens but leaves the device registered and trusted","accept":["w2"],"why":"Revocation clears sessions — the device object and its trust path remain, so it is necessary but not sufficient."},{"label":"Changes factor one only — the device trust survives untouched","accept":["w3"],"why":"The password reset does not touch device trust — the classic 'we reset everything' false comfort."},{"label":"Removes the registration but destroys audit context and can be undone by re-registration","accept":["w4"],"why":"Deletion works physically but costs evidence, and an attacker with the account can simply register again."}],"hint":"Two actions sound like eviction but only change credentials or tokens. One is irreversible and evidence-destructive.","explain":"<p>The containment truth table: <b>disable</b> kills the device path; <b>revoke sessions</b> clears tokens but not the trust; <b>reset password</b> touches neither (the pair most often confused in war rooms); <b>delete</b> removes the object at the cost of evidence and re-registration exposure. The senior sequence is disable + revoke, password reset as hygiene — delete only when the case is closed and the evidence is exported.</p>","study":"true effects of containment actions on device footholds."},{"type":"order","summary":"Order the six-step senior runbook for the rogue-device case","short":"Order the senior runbook","scenario":"The CISO approves your plan for case FS-HV-02. Six steps, ordered so evidence survives, containment lands before the attacker reacts, and the business keeps running. Some orders are defensible — one is correct for THIS case (legal wants pre-containment artefacts, and onboarding runs tomorrow morning).","question":"Click the six steps in execution order (first click = first).","steps":[{"id":"q1","label":"Capture pre-containment artefacts (device state, token logs) to the case folder","why":"Legal's requirement — everything after this step changes the state, so capture comes first."},{"id":"q2","label":"Disable the rogue device object","why":"The precise kill for the foothold — before the attacker pivots further."},{"id":"q3","label":"Revoke the compromised account's sessions and tokens","why":"Drops every stolen token, including any exported off-device."},{"id":"q4","label":"Sweep for sibling persistence: other devices, OAuth grants, delegate permissions","why":"One registration is rarely alone — the actor also touched mailbox delegation; hunt the family."},{"id":"q5","label":"Remediate the account: reset credentials, re-enroll the user's real devices with TAP","why":"Clean re-establishment happens only after the hostile path is dead — TAP avoids the legacy-enrollment gap."},{"id":"q6","label":"Harden before morning onboarding: trusted-location limits and the dormant-account block","why":"Onboarding resumes tomorrow — the window the attacker used closes tonight, without breaking the wave."}],"hint":"Legal's artefacts exist only until step 2. Onboarding breaks only if you harden without scoping. Remediation before hardening leaves the door open; hardening before remediation is fine — but the user must be able to return.","explain":"<p>The order encodes three constraints: <b>evidence before mutation</b> (Q1 → Q2), <b>containment before hunting</b> (Q2/Q3 → Q4 — you stop the bleeding, then map the injury), and <b>remediation before hardening</b> (Q5 → Q6 — the user's clean re-enrollment uses the same flows you are about to restrict, and the dormant-account block plus trusted locations close the door the attacker used before tomorrow's wave). Swap capture and containment and legal loses the case; swap hunting and hardening and either the attacker persists or onboarding breaks.</p>","study":"sequencing containment, remediation and hardening under real constraints."},{"type":"blank","summary":"Complete the executive assessment with the three load-bearing words","short":"Executive assessment blanks","scenario":"The one-paragraph assessment for the board needs exactly three words to be defensible. Fill them from the word bank; spelling matters — this text goes to the regulator.","question":"Complete the three gaps in the assessment.","text":"We assess with [[0]] confidence that T1098.005 Device Registration was used for persistence: the actor enrolled a device, obtained a [[1]] enabling silent single sign-on, and used it for internal mail. We further assess that a password reset alone is [[2]] against this foothold, which is why device-side containment was executed first.","blanks":[{"accept":["high","moderate"],"why":"With registration, use and monetisation all observed, 'high' is the defensible level — 'moderate' is the floor we accept."},{"accept":["PRT","Primary Refresh Token","primary refresh token","prt (primary refresh token)"],"why":"The token that makes the registered device a silent SSO key."},{"accept":["insufficient","ineffective","insufficient.","ineffective."],"why":"The core lesson of this file: credential changes do not evict device trust."}],"hint":"One confidence level, one token name, one judgement word the whole case turns on.","explain":"<p>Board language must carry its own proof: <b>high</b> confidence (three independent observations), the specific mechanism (<b>PRT</b>), and the judgement that justifies the containment order (<b>insufficient</b> password reset). Every word here maps to an artefact in the annex — that is what makes the paragraph survive scrutiny.</p>","study":"writing defensible executive assessments."},{"type":"qcm","multi":true,"summary":"Select the THREE factors that actually drive confidence","short":"What drives confidence?","scenario":"Legal challenges the 'high confidence' wording: which observed factors genuinely support it? Six candidates, exactly three carry real inferential weight.","question":"Select the THREE factors that drive the high-confidence assessment.","options":[{"id":"a","label":"Registration originated from an ASN with no prior business use in this tenant"},{"id":"b","label":"The registration happened outside the tenant's normal business hours"},{"id":"c","label":"No onboarding ticket, wave, or asset record exists for the device"},{"id":"d","label":"The device runs Windows 11 like most managed devices"},{"id":"e","label":"Trusted-device sign-ins began minutes later from the same infrastructure"},{"id":"f","label":"The user's account already had multi-factor authentication enabled"}],"correct":["a","c","e"],"itemWhy":{"b":"Time-of-day shifts by minutes and adds almost nothing — attackers pick convenient hours too.","d":"OS choice is the crowd baseline — it points nowhere.","f":"MFA being enabled is irrelevant once the device path satisfies it — that is the technique's whole point."},"hint":"Confidence drivers must be rare-and-linked to hostile intent. Baseline facts about the device or the clock are not.","explain":"<p>The three real drivers: <b>a</b> (infrastructure the tenant has never used — hostile context), <b>c</b> (the complete absence of any business reason — the negative evidence), and <b>e</b> (immediate use — the registration was monetised, which no onboarding accident does). The rejected three are the classic noise factors: clock time, OS market share, and MFA status — all present in benign enrollments too. Confidence comes from <b>linked anomaly + absence of explanation + observed use</b>, not from scary-looking single facts.</p>","study":"confidence levels and their evidential drivers."},{"type":"tree","summary":"Three-step decision tree where every path has a price","short":"Decision tree: every path costs","scenario":"Case FS-HV-02 at the decision point. Constraints collide: legal wants pre-containment artefacts, the CFO wants the finance VM back, onboarding runs tomorrow, and the attacker still holds a session. Choose the path you would sign your name to.","question":"Work the three steps; the final Check grades your whole path.","tree":{"steps":[{"prompt":"STEP 1. The attacker session is live NOW. Legal demands pre-containment capture; every minute of delay is more attacker time. What runs first?","options":[{"id":"v1a","label":"A time-boxed capture (device state + token logs, minutes not hours), then immediate containment"},{"id":"v1b","label":"Contain immediately — legal's artefacts are recoverable later"},{"id":"v1c","label":"Full forensic image of the VM before any containment action"}],"correct":"v1a","why":"A bounded capture satisfies legal without giving the attacker hours; immediate containment destroys the artefacts, and a full image is hours of attacker time for data you already hold in the cloud plane."},{"prompt":"STEP 2. Containment plan on the table. The finance VM is production — wiping it costs the close process a day. What do you sign?","options":[{"id":"v2a","label":"Disable the device object + revoke sessions; VM keeps running for now"},{"id":"v2b","label":"Disable the device AND take the VM offline — safest technically"},{"id":"v2c","label":"Revoke sessions only; leave the device enabled to avoid finance impact"}],"correct":"v2a","why":"The device trust is the attacker's path — killing it protects the VM while it runs. Taking the VM down accepts a cost you can avoid; revocation-only leaves the trust path alive."},{"prompt":"STEP 3. Midnight check: the re-registration event you feared has NOT occurred, but one new sign-in from an unfamiliar (non-device) session appeared. Action?","options":[{"id":"v3a","label":"Gather more evidence on that session before further containment — one anomalous sign-in is not yet a second foothold"},{"id":"v3b","label":"Disable the user account entirely — zero tolerance"},{"id":"v3c","label":"Close the case — the device was contained, one sign-in is noise"}],"correct":"v3a","why":"This is the 'gather more evidence' step: the containment already covers the device path; an unexplained session deserves correlation (source, app, token type) before heavier actions — account-wide disablement is a real business cost for an ambiguous signal, and closing ignores a live actor."}]},"hint":"Constraint 1: legal's artefacts exist only before containment. Constraint 2: the VM can stay up if you kill the right path. Constraint 3: ambiguous ≠ malicious, and ambiguous ≠ benign.","explain":"<p>The survivable path: <b>time-boxed capture → disable device + revoke sessions → evidence-gathering on the new anomaly</b>. Each wrong branch names a real failure mode: full imaging sacrifices hours to the attacker; revocation-only leaves the trust path; zero-tolerance account disablement buys certainty at a business cost the evidence does not yet justify; closing hands the night back to a live actor. Senior judgement is choosing the cost you can defend — every path costs, and you signed this one.</p>","study":"decision-making under conflicting constraints."},{"type":"match","summary":"Map the case behaviours to their ATT&CK anchors","short":"Case behaviours → ATT&CK IDs","scenario":"The case slide needs one ATT&CK anchor per observed behaviour, mapped at the level the framework actually documents. Two behaviours belong to the T1098 family, one to the access that started it, one to the interception that enabled it.","question":"Match each behaviour to its ATT&CK anchor.","pairs":[{"left":"The attacker enrolled a device into the tenant","right":"T1098.005 — Device Registration","why":"The core behaviour of this case — a device added to an identity platform for persistence."},{"left":"The attacker signed in with valid stolen credentials","right":"T1078 — Valid Accounts","why":"Using compromised credentials to enter is Valid Accounts — the enabler that precedes registration."},{"left":"The phishing kit relayed the MFA prompt in real time","right":"T1557 — Adversary-in-the-Middle","why":"Relaying the second factor through a proxy is AiTM — the reason password+push MFA failed."},{"left":"An extra SSH key appeared on a payroll server","right":"T1098.004 — SSH Authorized Keys","why":"A sibling Account Manipulation sub-technique — tag it separately from the device chain."}],"hint":"Two anchors are T1098 siblings; one is the entry technique; one is the interception technique.","explain":"<p>The slide now shows the full kill chain in ATT&amp;CK language: <b>T1557</b> (AiTM relay) enabled <b>T1078</b> (valid account use), which enabled <b>T1098.005</b> (device registration) — with <b>T1098.004</b> observed as a sibling move on a server. Precision matters: a reader who only sees 'T1098' misses which doors were used, and coverage planning needs the sub-technique granularity.</p>","study":"mapping a full intrusion to ATT&CK technique anchors."},{"type":"qcm","summary":"The recommended control that would NOT have stopped this chain","short":"Best practice fails here","scenario":"Post-incident review. The audit firm recommends: 'Require MFA for device registration — this would have prevented the incident.' You know the registration was performed by an attacker whose AiTM session had ALREADY satisfied MFA interactively, and the enrollment inherited that live session. The room asks you to pressure-test the recommendation.","question":"Which single control would most likely have stopped THIS chain, and why does the audit recommendation fail?","options":[{"id":"a","label":"Phishing-resistant MFA (FIDO2 keys / passkeys) — AiTM cannot relay it, so no stolen session exists to enroll from"},{"id":"b","label":"MFA on registration — it would have fired at the enrollment moment"},{"id":"c","label":"Longer, rotated passwords — credential theft would fail"},{"id":"d","label":"Geo-blocking the hosting ASN — the attacker would lose access"}],"correct":["a"],"itemWhy":{"b":"MFA at registration is satisfied by the very session the attacker already owns — the control fires and passes. It is the right control against password-only enrollment, wrong against AiTM sessions.","c":"The password was never the breaking point — the relayed MFA session was.","d":"ASN blocks are a speed bump; the operator migrates. And the initial access was a phishing page, not the ASN."},"hint":"Ask at which MOMENT each control acts, and what the attacker already holds at that moment.","explain":"<p>This is the 'widely used best practice is wrong here' case: <b>MFA-on-registration</b> is correct guidance from the M1032 family — against attackers enrolling with a bare password. But this attacker held a <b>live, MFA-satisfied session</b> from the AiTM relay, so the enrollment check passed on arrival. The control that breaks the chain at its source is <b>phishing-resistant MFA</b>: FIDO2/passkey ceremonies cannot be relayed, so no attacker-controlled session ever exists to enroll a device from. Layered on top: token protection and device-bound flows. Right control, wrong threat model, failed prevention — the review must say so explicitly.</p>","study":"control efficacy against AiTM versus password-only attackers."},{"type":"logview","summary":"Click the three lines showing device-state manipulation or revival","short":"State manipulation and revival","scenario":"Overnight sweep on the contained tenant. Three of eight lines show an attacker (or a broken process) manipulating device state or reviving a contained registration. Two of them, together, would justify re-containment tonight.","question":"Click the three lines showing device-state manipulation or a revival attempt.","lines":[{"id":"y1","text":"audit  'Update device'  device=d-5150 (disabled)  attribute=accountEnabled  value=true  actor=svc-reporting-legacy","related":true,"why":"A re-enable of the CONTAINED device through a legacy service principal — a revival attempt through automation abuse."},{"id":"y2","text":"mdm  compliance state flipped to compliant  device=d-7741  source=unknown-mdm-tenant  device not enrolled in MDM-CORP","related":true,"why":"Compliance asserted from outside the trusted MDM — the faked-state pattern from the ATT&CK references."},{"id":"y3","text":"audit  'Register device'  actor=field-tech-22  ip=office  deviceId=d-9902 (re-enroll after wipe, ticket WAVE-0917)","related":false,"why":"Ticketed re-enrollment from the office — legitimate, and it is a different device."},{"id":"y4","text":"signin  user=fin-reports  device=d-5150 (disabled)  result=blocked  reason='device disabled'","related":false,"why":"The attacker RETRYING the contained device and failing — good news, not manipulation."},{"id":"y5","text":"edr  proc  dsregcmd.exe /status  parent=ops-agent.exe  host=FS-HV-02","related":false,"why":"The monitoring agent reading state — read-only, and expected on this host."},{"id":"y6","text":"audit  'Add registered owner to device'  device=d-7741  actor=svc-mdm-unknown  owner=fin-reports","related":true,"why":"The unknown MDM principal is binding the compromised account as owner of the faked-compliance device — the two anomalies are one campaign."},{"id":"y7","text":"mail  quarantined: payroll reminder to finance team from external lookalike domain","related":false,"why":"External phish caught by mail security — unrelated to device state."},{"id":"y8","text":"audit  'Update device'  device=d-9902  attribute=deviceName  value='LAP-FT-22-W11'  actor=it-onboarding-svc","related":false,"why":"Naming update during ticketed onboarding — benign."}],"hint":"Two anomalies belong to one campaign (the unknown MDM principal). The third is a contained device being switched back on.","explain":"<p>Y1 is the revival attempt (contained device re-enabled through a legacy principal — re-contain tonight and audit that principal's credentials). Y2 and Y6 are the same campaign from two angles: an unowned MDM tenant flips compliance (Y2) and then binds the compromised account as the device's owner (Y6). Y3 is ticketed and legitimate; Y4 is the containment WORKING. The sweep's value is exactly this: catching the second campaign before it matures.</p>","study":"device-state manipulation and revival patterns."},{"type":"qcm","multi":true,"summary":"Select the TWO factors that legitimately support attribution","short":"Attribution: what supports it?","scenario":"CTI review. The draft report says 'we attribute this to APT29 with moderate confidence'. Supporting evidence on the table: (1) the TTP chain matches the ATT&CK procedure example — device/MFA enrollment into a compromised tenant after password-guessing a dormant account; (2) the hosting ASN relayed infrastructure seen in a prior APT29 operation; (3) the malware was written in English; (4) the actor used generic tools any adversary owns; (5) the event happened on a Monday.","question":"Select the TWO factors that legitimately support the attribution statement.","options":[{"id":"a","label":"The TTP chain matches the documented APT29 procedure, including the dormant-account enrollment detail"},{"id":"b","label":"The hosting ASN overlaps infrastructure attributed to prior APT29 operations"},{"id":"c","label":"The malware's comments are written in fluent English"},{"id":"d","label":"The actor used widely available generic tooling"},{"id":"e","label":"The registration occurred on a Monday, matching the group's known working week"}],"correct":["a","b"],"itemWhy":{"c":"Language of code comments is trivially spoofed and historically unreliable — a known false-attribution driver.","d":"Generic tooling points nowhere; every adversary has it, so it cannot separate APT29 from anyone.","e":"Working-week analysis of this kind is folklore — timezone habits shift and are easily staged."},"hint":"A factor supports attribution only if it separates this actor from the crowd — and survives deliberate staging.","explain":"<p>The two defensible drivers: <b>TTP specificity</b> (the dormant-account MFA-enrollment pattern is documented for APT29 on the ATT&amp;CK page — behaviour is expensive to fake perfectly) and <b>infrastructure overlap</b> (the ASN reuse ties operations together). The rejected three are classic attribution traps: language, generic tooling, and calendar folklore. And note what the report wording does right: <b>moderate confidence</b> — TTP overlap plus infrastructure supports an attribution statement, but shared tools and false-flag operations mean it should never harden to 'high' on these two factors alone.</p>","study":"attribution reasoning and confidence wording."},{"type":"blank","summary":"Complete the closure report's containment rationale","short":"Closure report blanks","scenario":"Case closed. The closure report must explain, in three words, why the containment was designed the way it was — the next responder will read only this paragraph.","question":"Complete the three gaps of the closure report.","text":"The device object was disabled rather than deleted: deletion would have destroyed [[0]] and invited immediate re-registration while the account remained [[1]]. Sessions were revoked in the same action because exported tokens stay valid until revoked. Finally, the password reset alone was kept as hygiene, not eviction, because [[2]] trust does not depend on the password.","blanks":[{"accept":["audit evidence","evidence","audit context","the audit trail"],"why":"Deletion removes the very object your investigation and the regulator need."},{"accept":["compromised","owned","attacker-controlled"],"why":"With the account still compromised, a deleted device can simply be registered again."},{"accept":["device","the device","device."],"why":"The sentence's whole point: device trust is independent of the password."}],"hint":"One thing deletion destroys, one state the account was in, one word for whose trust survives a reset.","explain":"<p>The paragraph teaches the next responder the three senior lessons of this file: <b>deletion destroys evidence</b> (disable instead), an account still <b>compromised</b> makes re-registration trivial (so revocation rides along), and <b>device</b> trust survives password resets (so the reset is hygiene, never eviction). Closure reports that encode reasoning — not just actions — are what turn incidents into organisational memory.</p>","study":"writing closure reports that encode reasoning."}];
'use strict';
/* CyberPulseAcademy exam engine — shared across all T1098.005 severity files.
 * Expects globals: META, INTRO, EXERCISES (injected before this script). */
(function () {
  var $id = function (i) { return document.getElementById(i); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function pct(n) { return Math.round(n * 100); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60);
    m = m % 60;
    var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
    var out = (h > 0 ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
    return out;
  }
  function scoreHW(H, W, N) { return Math.max(0, (H - W) / N); }

  var SEV_CLASS = { 'easy': 'badge-easy', 'medium': 'badge-medium', 'hard': 'badge-hard', 'extremely-hard': 'badge-extreme' };

  var state = {
    screen: 'intro', mode: 'exam', pos: 0, queue: [],
    answered: {}, credits: {}, results: {}, skipped: [], currentIdx: -1,
    usedHint: {}, hintShown: {},
    shuffles: {}, trans: {},
    timer: { state: 'IDLE', remain: 0, total: 0, lastTs: 0, manualMs: 0, autoMs: 0, autoStart: 0, pauseStart: 0 },
    pauseReturn: 'RUNNING', reported: false, user: { name: '', country: '', locale: '' }
  };
  var tickHandle = null;

  /* ---------------- timer state machine ---------------- */
  // States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
  function setTimerState(s) {
    state.timer.state = s;
    if (s === 'RUNNING') { state.timer.lastTs = Date.now(); }
    renderTimerBar();
  }
  function startTimer() {
    state.timer.total = META.estimatedMinutes * 60;
    state.timer.remain = state.timer.total;
    state.timer.manualMs = 0; state.timer.autoMs = 0; state.timer.autoStart = 0;
    setTimerState('RUNNING');
    if (tickHandle) { clearInterval(tickHandle); }
    tickHandle = setInterval(tick, 250);
  }
  function tick() {
    var t = state.timer;
    if (t.state === 'ENDED') { return; }
    var now = Date.now();
    if (t.state !== 'RUNNING') { t.lastTs = now; return; }
    var dt = (now - t.lastTs) / 1000;
    t.lastTs = now;
    t.remain -= dt;
    if (t.remain <= 0) { t.remain = 0; renderTimerBar(); finishExam(true); return; }
    renderTimerBar();
  }
  function renderTimerBar() {
    var t = state.timer;
    $id('timerVal').textContent = fmtTime(t.remain);
    var st = $id('timerState'), box = $id('timerBox');
    var banner = $id('pauseBanner');
    if (t.state === 'RUNNING') {
      st.textContent = '▶ RUNNING'; st.className = 'ts-running';
      box.setAttribute('aria-label', 'Timer running');
      banner.style.display = 'none';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
      document.body.classList.remove('manually-paused');
    } else if (t.state === 'PAUSED_MANUAL') {
      st.textContent = '⏸ PAUSED_MANUAL'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused manually');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — manual (press Resume)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">▶</span> Resume';
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      st.textContent = '⏸ PAUSED_AUTO_CHECK'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused while reviewing feedback');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — reviewing feedback (resumes on Next)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
    } else if (t.state === 'ENDED') {
      st.textContent = '■ ENDED'; st.className = 'ts-ended';
      banner.style.display = 'none';
    } else {
      st.textContent = '— READY'; st.className = 'ts-running';
      banner.style.display = 'none';
    }
  }
  function onPauseBtn() {
    if (state.screen !== 'exam') { return; }
    if (state.timer.state === 'PAUSED_MANUAL') { onResumeBtn(); return; }
    var t = state.timer;
    if (t.state === 'RUNNING') {
      t.pauseStart = Date.now(); state.pauseReturn = 'RUNNING';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
      t.pauseStart = Date.now(); state.pauseReturn = 'PAUSED_AUTO_CHECK';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    }
  }
  function onResumeBtn() {
    var t = state.timer;
    if (t.state !== 'PAUSED_MANUAL') { return; }
    t.manualMs += Date.now() - t.pauseStart; t.pauseStart = 0;
    showPauseCover(false);
    setTimerState(state.pauseReturn || 'RUNNING');
    if ((state.pauseReturn || 'RUNNING') === 'PAUSED_AUTO_CHECK' && !t.autoStart) { t.autoStart = Date.now(); }
    document.body.classList.remove('manually-paused');
  }
  function showPauseCover(on) {
    var c = $id('pauseCover');
    if (!c) { return; }
    if (on) {
      c.classList.remove('hidden');
      c.innerHTML = '<div class="card" style="max-width:520px;margin:60px auto;text-align:center">' +
        '<h2>⏸ PAUSED — manual</h2><p style="color:var(--text-secondary)">The exercise is hidden while you take a break.' +
        ' The countdown is stopped. Press Resume to continue.</p>' +
        '<button class="btn btn-primary" id="resumeBtn2">▶ Resume</button></div>';
      $id('resumeBtn2').addEventListener('click', onResumeBtn);
    } else { c.classList.add('hidden'); c.innerHTML = ''; }
  }

  /* ---------------- scoring core ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    // Mandatory formula: credit = max(0, (H - W) / N)
    var N = correctItems.length, H = 0, W = 0;
    selectedItems.forEach(function (s) { if (correctItems.indexOf(s) >= 0) { H++; } else { W++; } });
    return { N: N, H: H, W: W, credit: scoreHW(H, W, N) };
  }

  /* ---------------- flow ---------------- */
  function startExam() {
    state.screen = 'exam'; state.mode = 'exam';
    state.pos = 0; state.queue = shuffle(EXERCISES.map(function (e, i) { return i; }));
    state.answered = {}; state.credits = {}; state.results = {}; state.skipped = [];
    state.usedHint = {}; state.hintShown = {}; state.shuffles = {}; state.trans = {};
    state.reported = false;
    $id('screen-intro').classList.add('hidden');
    $id('screen-results').classList.add('hidden');
    $id('screen-exam').classList.remove('hidden');
    $id('sevBadge2').className = 'badge ' + SEV_CLASS[META.difficulty];
    $id('sevBadge2').innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('partLabel').textContent = INTRO.partLabel || '';
    startTimer();
    showExercise();
  }
  function sevIcon() { return META.difficulty === 'extremely-hard' ? '◉' : '◆'; }
  function curEx() { return EXERCISES[state.currentIdx]; }
  function processedCount() {
    var a = 0; Object.keys(state.answered).forEach(function (k) { if (state.answered[k]) { a++; } });
    return a + state.skipped.length;
  }
  function updateProgress() {
    var f = $id('progressFill');
    f.style.width = Math.min(100, (processedCount() / EXERCISES.length) * 100) + '%';
  }
  function updateLiveScore() {
    var sum = 0, n = 0;
    Object.keys(state.answered).forEach(function (k) {
      if (state.answered[k]) { sum += state.credits[k]; n++; }
    });
    $id('scoreVal').textContent = (n > 0 ? (Math.round(sum * 10) / 10) + ' / ' + n + ' (' + pct(sum / n) + '%)' : '0 / 0 (—%)');
  }
  function showExercise() {
    var idx = state.queue[state.pos];
    state.currentIdx = idx;
    $id('exCounter').textContent = 'Exercise ' + (state.pos + 1) + ' of ' + EXERCISES.length;
    renderExercise(idx, state.mode === 'review-item');
    updateProgress(); updateLiveScore();
    $id('checkBtn').classList.remove('hidden');
    $id('checkBtn').disabled = true;
    $id('checkBtn').textContent = '✓ Check';
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.remove('hidden');
    $id('hintBtn').classList.remove('hidden');
    $id('hintBtn').disabled = false;
    document.getElementById('exerciseArea').scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function onSkip() {
    if (state.screen !== 'exam' || state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
    var idx = state.currentIdx;
    if (state.skipped.indexOf(idx) < 0) { state.skipped.push(idx); }
    state.currentIdx = -1;
    if (state.mode === 'review-item') { showReview(); return; }
    state.pos++;
    proceedOrFinish(false);
    updateProgress();
  }
  function proceedOrFinish(cameFromCheck) {
    if (state.mode === 'review-item') { showReview(); return; }
    if (state.pos < state.queue.length) {
      showExercise();
    } else {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
    }
  }
  function onCheck() {
    // FIRST action: stop the timer (Check-triggered auto-pause), then grade.
    var t = state.timer;
    if (t.state === 'RUNNING') { t.autoStart = Date.now(); setTimerState('PAUSED_AUTO_CHECK'); }
    var idx = state.currentIdx;
    var res = gradeExercise(curEx(), idx);
    if (state.usedHint[idx]) { res.credit = Math.max(0, res.credit - 0.10); }
    state.answered[idx] = true;
    state.credits[idx] = res.credit;
    state.results[idx] = res;
    var si = state.skipped.indexOf(idx);
    if (si >= 0) { state.skipped.splice(si, 1); }
    renderFeedback(curEx(), idx, res);
    updateLiveScore(); updateProgress();
    $id('checkBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').disabled = true;
    var nb = $id('nextBtn');
    nb.classList.remove('hidden');
    if (state.mode === 'review-item') {
      nb.textContent = '⟲ Back to review (timer resumes)';
    } else if (state.pos >= state.queue.length - 1) {

        if (c) {
          var rc = termRC(ex);
          var dangerHit = null;
          rc.dan.forEach(function (d) { if (d.re.test(c)) { dangerHit = d.d; } });
          var penHit = 0, elHit = 0;
          rc.pens.forEach(function (p) { if (p.re.test(c)) { penHit++; } });
          rc.els.forEach(function (p) { if (p.re.test(c)) { elHit++; } });
          if (dangerHit) {
            sc.textContent += '\n✗ DANGEROUS — NEAR MISS — the simulator blocked this command, nothing was executed.\n' + dangerHit.msg;
          } else if (elHit === rc.els.length && penHit === 0) {
            sc.textContent += '\n' + (ex.term.simOut || '[simulated output — shape only]\nOK — the command completed. No state was changed. Press Check to grade it.');
          } else if (penHit > 0) {
            sc.textContent += '\n(0 result(s) — the command was accepted by the simulator but returns nothing useful here. Press Check to grade it.)';
          } else {
            sc.textContent += '\n(command not recognized in this simulator — nothing was executed. Press Check to grade it.)';
          }
        }
        sc.scrollTop = sc.scrollHeight;
        input.value = '';
        enableCheck();
      }
      $id('termRun').addEventListener('click', run);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(); } });
      input.addEventListener('input', function () { enableCheck(); });
    } else if (ex.type === 'triage') {
      Array.prototype.forEach.call(area.querySelectorAll('[data-tg]'), function (b) {
        b.addEventListener('click', function () {
          var g = b.getAttribute('data-tg'), oid = b.getAttribute('data-toid');
          tr.sel['a' + g] = oid;
          Array.prototype.forEach.call(area.querySelectorAll('[data-tg="' + g + '"]'), function (x) { x.classList.remove('selected'); });
          b.classList.add('selected');
          enableCheck();
        });
      });
    } else if (ex.type === 'logview') {
      var f = $id('logFilter');
      f.addEventListener('input', function () {
        var q = norm(f.value);
        Array.prototype.forEach.call(area.querySelectorAll('.log-line'), function (row) {
          var txt = row.querySelector('.lt').textContent;
          row.style.display = (q === '' || norm(txt).indexOf(q) >= 0) ? '' : 'none';
        });
      });
      Array.prototype.forEach.call(area.querySelectorAll('.log-line'), function (row) {
        function toggle() {
          var lid = row.getAttribute('data-line');
          tr.sel[lid] = !tr.sel[lid];
          row.classList.toggle('selected', !!tr.sel[lid]);
          row.setAttribute('aria-pressed', tr.sel[lid] ? 'true' : 'false');
          var mark = row.querySelector('.log-mark');
          if (tr.sel[lid] && !mark) {
            var m = document.createElement('span'); m.className = 'log-mark'; m.textContent = '● selected'; row.appendChild(m);
          } else if (!tr.sel[lid] && mark) { mark.remove(); }
          enableCheck();
        }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      });
    } else if (ex.type === 'tree') {
      Array.prototype.forEach.call(area.querySelectorAll('[data-treeopt]'), function (b) {
        b.addEventListener('click', function () {
          tr.picks[tr.step] = b.getAttribute('data-treeopt');
          Array.prototype.forEach.call(area.querySelectorAll('[data-treeopt]'), function (x) { x.classList.remove('selected'); });
          b.classList.add('selected');
          $id('treeConfirm').disabled = false;
          if ((tr.step || 0) === ex.tree.steps.length - 1) { enableCheck(); }
        });
      });
      $id('treeConfirm').addEventListener('click', function () {
        var st = tr.step || 0;
        if (!tr.picks[st]) { return; }
        var isLast = st === ex.tree.steps.length - 1;
        if (!isLast) {
          tr.step = st + 1;
          renderExercise(idx, state.mode === 'review-item');
          enableCheck(); // final Check becomes enabled once last step is selected
          $id('checkBtn').disabled = true;
        }
        // On the last step, the outer Check button grades the whole tree (auto-pause applies there only).
      });
    }
  }
  function hasAnyPlacement(ex, tr) {
    return ex.slots.some(function (s, si) { return (tr.slots[si] || []).length > 0; });
  }
  /* ---------------- grading ---------------- */
  function gradeExercise(ex, idx) {
    var tr = state.trans[idx] || { sel: {}, seq: [], picked: null, step: 0, picks: [], slots: [], cmd: '' };
    var t = ex.type, r = { N: 0, H: 0, W: 0, credit: 0, items: [], answerHtml: '', extraHtml: '' };
    if (t === 'qcm') {
      var correctIds = ex.correct;
      var selIds = Object.keys(tr.sel).filter(function (k) { return tr.sel[k]; });
      var s = scoreExercise(selIds, correctIds);
      r.N = s.N; r.H = s.H; r.W = s.W; r.credit = s.credit;
      ex.options.forEach(function (o) {
        var isC = correctIds.indexOf(o.id) >= 0, sel = !!tr.sel[o.id];
        if (isC) {
          r.items.push({ st: sel ? 'c' : 'm', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This is part of the correct answer.' });
        } else if (sel) {
          r.items.push({ st: 'w', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This option is not part of the correct answer.' });
        }
      });
      r.answerHtml = correctIds.map(function (cid) {
        return '<b>' + (ex.options.filter(function (o) { return o.id === cid; })[0] || {}).label + '</b>';
      }).join(' and ');
    } else if (t === 'match') {
      r.N = ex.pairs.length; var H = 0, W = 0;
      ex.pairs.forEach(function (p, i) {
        var sel = tr.sel['m' + i];
        if (!sel) { r.items.push({ st: 'm', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else if (norm(sel) === norm(p.right)) { H++; r.items.push({ st: 'c', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else { W++; r.items.push({ st: 'w', label: strip(p.left) + ' → ' + sel, why: p.why }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.pairs.map(function (p) { return strip(p.left) + ' → <b>' + esc(p.right) + '</b>'; }).join('; ');
    } else if (t === 'blank') {
      r.N = ex.blanks.length; H = 0; W = 0;
      ex.blanks.forEach(function (b, i) {
        var val = norm(tr.sel['b' + i]);
        var ok = b.accept.some(function (a) { return norm(a) === val; });
        if (val === '') { r.items.push({ st: 'm', label: 'Blank ' + (i + 1), why: 'Correct: ' + b.accept[0] + '. ' + b.why }); }
        else if (ok) { H++; r.items.push({ st: 'c', label: 'Blank ' + (i + 1) + ' = ' + val, why: b.why }); }
        else { W++; r.items.push({ st: 'w', label: 'Blank ' + (i + 1) + ' = "' + val + '"', why: b.why + ' Correct: ' + b.accept[0] + '.' }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.blanks.map(function (b, i) { return 'Blank ' + (i + 1) + ': <b>' + esc(b.accept[0]) + '</b>'; }).join('; ');
    } else if (t === 'dnd') {
      r.N = ex.slots.length; H = 0; W = 0;
      ex.slots.forEach(function (s, si) {
        var placed = tr.slots[si] || [];
        if (placed.length === 0) { r.items.push({ st: 'm', label: 'Slot: ' + s.label, why: s.why }); return; }
        placed.forEach(function (iid, k) {
          var it = ex.itemsPool.filter(function (x) { return x.id === iid; })[0];
          var lab = it ? it.label : iid;
          if (k === 0 && s.accept.indexOf(iid) >= 0) { H++; r.items.push({ st: 'c', label: 'Slot "' + s.label + '" ← ' + lab, why: s.why }); }
          else { W++; r.items.push({ st: 'w', label: 'Slot "' + s.label + '" ← ' + lab, why: (s.acceptWrong && s.acceptWrong[iid]) ? s.acceptWrong[iid] : 'This item does not belong in this slot. ' + s.why }); }
        });
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.slots.map(function (s) {
        var labels = s.accept.map(function (aid) {
          var it = ex.itemsPool.filter(function (x) { return x.id === aid; })[0];
          return it ? it.label : aid;
        });
        return '"' + esc(s.label) + '" ← <b>' + esc(labels.join(' / ')) + '</b>';
      }).join('; ');
    } else if (t === 'order') {
      r.N = ex.steps.length; H = 0; W = 0;
      ex.steps.forEach(function (s, i) {
        var got = tr.seq[i];
        if (!got) { r.items.push({ st: 'm', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else if (got === s.id) { H++; r.items.push({ st: 'c', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else {
          W++;
          var it = ex.steps.filter(function (x) { return x.id === got; })[0];
          r.items.push({ st: 'w', label: 'Position ' + (i + 1) + ': you placed "' + (it ? it.label : got) + '"', why: s.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<ol style="margin:4px 0 0 18px;padding:0">' + ex.steps.map(function (s) { return '<li>' + esc(s.label) + '</li>'; }).join('') + '</ol>';
    } else if (t === 'term') {
      var cmd = norm(tr.cmd || '');
      r.N = ex.term.elements.length; H = 0; W = 0;
      var rc = termRC(ex);
      if (cmd === '') {
        ex.term.elements.forEach(function (el) { r.items.push({ st: 'm', label: el.label, why: el.why }); });
      } else {
        rc.els.forEach(function (pair) {
          if (pair.re.test(cmd)) { H++; r.items.push({ st: 'c', label: pair.e.label, why: pair.e.why }); }
          else { r.items.push({ st: 'm', label: pair.e.label, why: pair.e.why }); }
        });
        rc.pens.forEach(function (pair) {
          if (pair.re.test(cmd)) { W++; r.items.push({ st: 'w', label: pair.p.label, why: pair.p.why }); }
        });
      }
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<div class="codeblock mono" style="background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text-mono);font-size:14.5px">' +
        '<span style="color:#7f8db3"># canonical command (copyable)</span>\n' + esc(ex.term.canonical) + '</div>';
      r.extraHtml = '<p style="margin:8px 0 0;color:var(--text-secondary)"><b style="color:var(--text-primary)">Part by part:</b></p><ul style="margin:6px 0 0 18px;padding:0">' +
        ex.term.parts.map(function (p) { return '<li style="margin-bottom:4px"><code class="inline">' + esc(p.k) + '</code> — ' + p.v + '</li>'; }).join('') + '</ul>';
      var dangerHit = null;
      rc.dan.forEach(function (pair) { if (pair.re.test(cmd)) { dangerHit = pair.d; } });
      if (dangerHit) {
        r.extraHtml = '<div class="fb-danger">✗ DANGEROUS — NEAR MISS: ' + dangerHit.msg + '</div>' + r.extraHtml;
      }
    } else if (t === 'triage') {
      r.N = ex.alerts.length; H = 0; W = 0;
      ex.alerts.forEach(function (a, i) {
        var sel = tr.sel['a' + i];
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        if (!sel) { r.items.push({ st: 'm', label: 'Alert ' + (i + 1) + ' — correct: ' + corr.label, why: a.why }); }
        else if (sel === a.correct) { H++; r.items.push({ st: 'c', label: 'Alert ' + (i + 1) + ' — ' + corr.label, why: a.why }); }
        else {
          W++;
          var picked = a.options.filter(function (o) { return o.id === sel; })[0];
          r.items.push({ st: 'w', label: 'Alert ' + (i + 1) + ' — you chose "' + picked.label + '"', why: a.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.alerts.map(function (a, i) {
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        return 'Alert ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    } else if (t === 'logview') {
      var rel = ex.lines.filter(function (l) { return l.related; });
      r.N = rel.length; H = 0; W = 0;
      rel.forEach(function (l, i) {
        var sel = !!tr.sel[l.id];
        if (sel) { H++; r.items.push({ st: 'c', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
        else { r.items.push({ st: 'm', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
      });
      ex.lines.forEach(function (l) {
        if (!l.related && tr.sel[l.id]) {
          W++; r.items.push({ st: 'w', label: 'Line L' + (ex.lines.indexOf(l) + 1) + ' (not evidence)', why: l.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = 'Evidence lines: <b>' + rel.map(function (l) { return 'L' + (ex.lines.indexOf(l) + 1); }).join(', ') + '</b>';
    } else if (t === 'tree') {
      r.N = ex.tree.steps.length; H = 0; W = 0;
      ex.tree.steps.forEach(function (st, i) {
        var got = tr.picks[i];
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        if (!got) { r.items.push({ st: 'm', label: 'Step ' + (i + 1) + ' — correct: ' + corr.label, why: st.why }); }
        else if (got === st.correct) { H++; r.items.push({ st: 'c', label: 'Step ' + (i + 1) + ' — ' + corr.label, why: st.why }); }
        else {
          W++;
          var picked = st.options.filter(function (o) { return o.id === got; })[0];
          r.items.push({ st: 'w', label: 'Step ' + (i + 1) + ' — you chose "' + picked.label + '"', why: st.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.tree.steps.map(function (st, i) {
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        return 'Step ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    }
    return r;
  }
  function strip(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || ''; }
  function termRC(ex) {
    if (!ex._rc) {
      ex._rc = {
        els: (ex.term.elements || []).map(function (e) { return { e: e, re: new RegExp(e.reSrc, 'i') }; }),
        pens: (ex.term.penalties || []).map(function (p) { return { p: p, re: new RegExp(p.reSrc, 'i') }; }),
        dan: (ex.term.danger || []).map(function (d) { return { d: d, re: new RegExp(d.reSrc, 'i') }; })
      };
    }
    return ex._rc;
  }

  /* ---------------- feedback ---------------- */
  function renderFeedback(ex, idx, res) {
    var multi = res.N > 1;
    var cls, word, ic;
    if (res.credit >= 1) { cls = 'fb-correct'; word = 'CORRECT'; ic = '✓'; }
    else if (res.credit > 0) { cls = 'fb-partial'; word = 'PARTIALLY CORRECT'; ic = '✓'; }
    else { cls = 'fb-incorrect'; word = 'INCORRECT'; ic = '✗'; }
    var h = '<div class="feedback" id="feedbackBlock"><div class="fb-head ' + cls + '">' +
      '<span aria-hidden="true" style="font-size:20px">' + ic + '</span> <span>' + word + '</span>' +
      (multi || res.credit < 1 ? '<span class="fb-credit">✓ ' + res.H + '/' + res.N + ' items · credit ' + res.credit.toFixed(2) + '</span>' : '') +
      '</div><div class="fb-b">' +
      '<div class="fb-answer"><b>Correct answer:</b> ' + res.answerHtml + '</div>';
    if (multi) {
      h += '<p style="margin:6px 0 10px;color:var(--text-secondary);font-size:14px">Item-by-item breakdown — credit formula: max(0, (H − W) ÷ N) = max(0, (' + res.H + ' − ' + res.W + ') ÷ ' + res.N + ') = ' + res.credit.toFixed(2) + '</p>';
      h += res.items.map(function (it) {
        var stc = it.st === 'c' ? 'fi-correct' : (it.st === 'w' ? 'fi-wrong' : 'fi-missed');
        var w = it.st === 'c' ? ['✓', 'Correct'] : (it.st === 'w' ? ['✗', 'Wrong'] : ['○', 'Missed']);
        return '<div class="fb-item ' + stc + '"><span class="ic" aria-hidden="true">' + w[0] + '</span>' +
          '<span><span class="word">' + w[1] + '</span> — ' + esc(it.label) + '<span class="why">' + esc(it.why) + '</span></span></div>';
      }).join('');
    }
    h += '<div class="fb-explain">' + ex.explain +
      (res.credit < 1 && ex.study ? '<p class="study">📖 What to study: ' + esc(ex.study) + '</p>' : '') +
      '</div>' + (res.extraHtml || '') + '</div></div>';
    var area = $id('exerciseArea');
    area.insertAdjacentHTML('beforeend', h);
    // disable inputs
    Array.prototype.forEach.call(area.querySelectorAll('.opt, .chip, .slot-drop, [data-seq], [data-unseq], .match-row select, .blank-in, .log-line, .filter-in, [data-treeopt], #treeConfirm, #termRun, .shell-in'), function (el) {
      el.disabled = true;
      el.classList.add('disabled');
      el.style.pointerEvents = 'none';
    });
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    $id('introTitle').textContent = INTRO.title;
    $id('introObject').textContent = INTRO.object;
    var b = $id('sevBadge');
    b.className = 'badge ' + SEV_CLASS[META.difficulty];
    b.innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('introFacts').innerHTML =
      fact('Exercises in this file', String(EXERCISES.length)) +
      fact('Estimated time', META.estimatedMinutes + ' minutes') +
      fact('Timer budget', META.estimatedMinutes + ' min countdown') +
      fact('Pass mark', META.passMark + '%') +
      (INTRO.partLabel ? fact('Batch', INTRO.partLabel) : '');
    $id('learnBody').innerHTML = INTRO.learn.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $id('kwBody').innerHTML = INTRO.keywords.map(function (k) {
      return '<div class="kw-theme"><h3>' + esc(k.theme) + '</h3><ul class="kw-list">' +
        k.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    $id('howBody').innerHTML = '<ul class="how-list">' + INTRO.how.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
  }
  function fact(k, v) { return '<span class="fact"><b>' + esc(k) + ':</b> ' + esc(v) + '</span>'; }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    // theme field is always 'dark' — the file is dark-only, so appearance does not change.
    state.user.name = event.data.username || '';
    state.user.country = event.data.country || '';
    state.user.locale = event.data.locale || 'en';
  });

  /* ---------------- init ---------------- */
  function init() {
    renderIntro();
    renderTimerBar();
    $id('startBtn').addEventListener('click', startExam);
    $id('checkBtn').addEventListener('click', function () {
      if (state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
      onCheck();
    });
    $id('nextBtn').addEventListener('click', onNext);
    $id('skipBtn').addEventListener('click', onSkip);
    $id('hintBtn').addEventListener('click', onHint);
    $id('pauseBtn').addEventListener('click', onPauseBtn);
    $id('retakeBtn').addEventListener('click', onRetake);
    $id('finalSubmitBtn').addEventListener('click', onFinishBtn);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();

</script>
</body>
