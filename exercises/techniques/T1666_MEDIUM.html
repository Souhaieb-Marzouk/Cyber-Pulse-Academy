<script>
/* ===== T1666 — MEDIUM ===== */
var EXAM = {
meta:{topicId:'t1666',batch:2,title:'T1666 Modify Cloud Resource Hierarchy — MEDIUM',difficulty:'medium',questionCount:16,estimatedMinutes:32,passMark:70,sevKey:'medium',sevName:'MEDIUM',objId:'T1666',objName:'Modify Cloud Resource Hierarchy',timerSeconds:2400},
intro:{
learn:'<p>You already know the basics of <b>T1666 — Modify Cloud Resource Hierarchy</b>: attackers change how an IaaS cloud groups its resources so defenses stop covering them. This MEDIUM exam connects that idea to the <b>next step of thinking</b> — reading real audit events and picking the right response.</p><p>This is a <b>Technique</b> object, so you will look at it from both sides. <b>Red side:</b> an attacker with a Global Administrator account, or with <code>organizations:LeaveOrganization</code> rights, chooses a hierarchy move that buys the most freedom. <b>Blue side:</b> you are the analyst who reads the CloudTrail or Azure Activity Log event and decides what it means.</p><p>In real work this exam mirrors: a <b>SOC analyst</b> enriching hierarchy alerts, a <b>detection engineer</b> tuning the DET0155 / AN0442 correlation, a <b>cloud engineer</b> applying the M1054 settings, and an <b>incident responder</b> keeping first-response order under pressure. Everything here is built from the ATT&amp;CK page for T1666: the AWS moves (<code>LeaveOrganization</code>, <code>CreateAccount</code>, <code>MoveAccount</code>), the Azure moves (new subscriptions, subscription hijacking), and the three mitigations (M1018, M1047, M1054).</p>',
keywords:[
{theme:'TTP discrimination',items:['T1666 vs T1685 Disable or Modify Tools','LeaveOrganization consequences (SCPs stop applying)','CreateAccount — payment methods shared, detections may not apply','MoveAccount — policy coverage follows placement']},
{theme:'Detection &amp; telemetry',items:['DET0155 / AN0442 multi-event correlation','Role elevation followed by hierarchy modification','Cloud Service Modification data source','Victim-tenant blind spots after a subscription transfer']},
{theme:'Controls &amp; configuration',items:['M1054 — SCP denying LeaveOrganization (AWS)','M1054 — Azure Policy blocking subscription transfers','M1018 — least privilege on hierarchy rights','M1047 — management account hygiene (no workloads at the top)']},
{theme:'Real-world context',items:['First-response ordering for hierarchy events','Microsoft Threat Intelligence reporting on password-spray to Global Admin chains','CloudTrail event lookup from the CLI']}],
how:'<ul class="howlist"><li><b>Pass mark: 70%.</b> A PASS means you can combine two facts about T1666 and act on them. A FAIL means you should retake this exam.</li><li><b>Exercise types in this file:</b> multiple choice, log analysis with a filter box, multi-select with partial credit, branching decisions, matching, drag-and-drop, fill-in-the-blank from a shuffled bank, an SOC triage queue, ordering, and one terminal command.</li><li><b>Timer:</b> you get a 40 minute countdown. 💡 <b>Hint</b> narrows the direction and costs −10% of that exercise’s credit (one hint per exercise). ⏸ <b>Pause</b> is a real break — the exercise is hidden while you rest.</li><li><b>Check pauses the timer:</b> pressing ✓ Check stops the timer immediately. Read the feedback as long as you like — the timer runs again only on Next. In branching exercises only the final Check grades and pauses.</li><li><b>Partial credit:</b> every multi-item exercise is scored (correct − wrong) ÷ total, so reckless “select everything” answers score zero.</li><li><b>Skipping:</b> ⚠ Skip parks the exercise without revealing the answer. Return to the skipped pool as often as you need while the timer runs; skipped-and-never-answered exercises are excluded from the score.</li><li>Press <b>Start</b> when you are ready.</li></ul>'
},
exercises:[
{id:'m1',type:'multi',summary:'Sunday 02:41 — what does one LeaveOrganization event change?',
scenario:['Sunday, 02:41 UTC. Helvetia Freight’s audit pipeline surfaces one management event. You read it before the morning stand-up.'],
viewer:{label:'CloudTrail management event — org trail',lines:[
'<span class="ld">2026-07-05T02:41:33Z</span> <span class="lk">eventName</span>=<span class="ls">LeaveOrganization</span> <span class="lk">eventSource</span>=<span class="ls">organizations.amazonaws.com</span>',
'<span class="lk">userIdentity</span>=<span class="ls">arn:aws:sts::555555555555:assumed-role/HF-PlatformAdmin/night-runner</span>',
'<span class="lk">eventResult</span>=<span class="ls">success</span> <span class="lk">readOnly</span>=<span class="ls">false</span> <span class="lk">changeType</span>=<span class="ls">hierarchy</span>']},
question:'Select <b>all</b> the true statements about what this event changes.',
options:[
{t:'Service Control Policies stop applying to that account',correct:true,why:'Leaving the organization removes exactly the guardrails that came with it.'},
{t:'The AWS account itself is deleted',why:'Leaving is not deletion — the account keeps existing with all of its resources.'},
{t:'Guardrails inherited from the organization no longer protect it',correct:true,why:'Same fact seen from the defense side: the protections are gone.'},
{t:'The organization-wide trail stops covering that account’s new activity',correct:true,why:'An org trail follows org membership; a severed account falls outside its coverage.'},
{t:'The event also deletes every IAM role in the account',why:'LeaveOrganization touches organization membership only — no IAM objects are deleted.'}],
multiNote:'Three of the five statements are true. Wrong picks subtract credit.',
hint:'Separate “what stops applying” from “what gets destroyed”. Nothing is destroyed here.',
explain:'<code>LeaveOrganization</code> detaches the account: SCPs and guardrails stop applying, and organization-wide logging coverage falls away. Nothing is deleted — the account and its resources live on, which is precisely what makes the move attractive. <b>Attacker view:</b> freedom without destruction. <b>Defender view:</b> DET0155 names this API, and your next investigative step is the principal <code>night-runner</code> — who elevated it, and what runs next.'},

{id:'m2',type:'qcm',summary:'Two alerts, one shift — which one is T1666?',
scenario:['Two alerts arrive from the same shift. Alert 1: the EDR agent on <code>vm-hf-app07</code> stopped reporting. Alert 2: a new subscription appeared under the top management group, created by a Global Administrator account with no change record.'],
question:'Which alert maps to <code>T1666 — Modify Cloud Resource Hierarchy</code>, and why?',
options:[
{t:'Alert 2 — it changes the cloud hierarchy; Alert 1 is T1685 Disable or Modify Tools',correct:true,why:'A new subscription is a hierarchy change; killing an agent is tool tampering under T1685.'},
{t:'Alert 1 — stopping an agent impairs defenses more deeply than a grouping change',why:'Impact is not the mapping criterion. The mapping follows the behaviour: hierarchy versus tools.'},
{t:'Both — every defense impairment is T1666',why:'The tactic holds many techniques. T1666 is the hierarchy one.'},
{t:'Neither — hierarchy changes are routine admin work',why:'A subscription created by a Global Admin with no change record is exactly the T1666 pattern.'}],
hint:'Ask what object each alert touches: a hierarchy container, or a security tool?',
explain:'T1666 modifies <b>hierarchical structures</b> — organizations, management groups, subscriptions, accounts. Stopping an EDR agent breaks a tool, which after ATT&amp;CK v19 is still Defense Impairment — but it is <b>T1685 Disable or Modify Tools</b>, a different technique. Keeping the two apart keeps your coverage dashboards honest.'},

{id:'m3',type:'branch',summary:'From a stolen Global Admin to a clean subscription',
scenario:['Sign-in logs show <code>l.okafor@helvetia-freight[.]example</code>, a Global Administrator, activated the role at 21:58 from an impossible location. The SOC confirmed the account is compromised. You are replaying the attacker’s next decision.'],
question:'Choose the attacker’s move at each step — you are graded on the whole chain at the final Check.',
steps:[
{label:'The attacker’s next hierarchy-level move',text:'The attacker holds a Global Administrator account and wants compute that nobody watches. What is the most likely next move?',
options:[
{t:'Create a brand-new subscription and deploy resources there',correct:true,why:'A new subscription is a fresh area the existing watchers were never pointed at.'},
{t:'Reset every user password in the tenant',why:'Disruptive and loud, and it touches identities — not the hierarchy play.'},
{t:'Delete one resource group under an old subscription',why:'Destructive and noisy; it does not create a clean area to work in.'},
{t:'Register a new look-alike domain name',why:'That is infrastructure acquisition, not a hierarchy modification.'}]},
{label:'Why the move serves the attacker',text:'Now justify it: why does the new subscription help the attacker stay unseen?',
options:[
{t:'It starts clean — detections, baselines and playbooks tuned on the old footprint may not reach it',correct:true,why:'Coverage was built for what existed yesterday; the new subscription is not in it.'},
{t:'It automatically inherits every existing detection rule',why:'The ATT&amp;CK description points the other way: existing detections may not apply.'},
{t:'It hides the Global Admin role assignment',why:'The role assignment stays in the tenant log; the subscription does not hide it.'},
{t:'It refunds the attacker for the victim’s spend',why:'No refund exists; the benefit is weak coverage, not money.'}]}],
hint:'Step 1: the attacker wants somewhere clean to work. Step 2: think about where existing coverage ends.',
explain:'<b>Attacker view:</b> Global Administrator → create subscription → deploy outside the tuned footprint. The chain is exactly what Microsoft Threat Intelligence described in the Peach Sandstorm campaigns: password spray reaching a Global Administrator, then hierarchy-level moves. <b>Defender view:</b> a subscription creation by any Global Admin without a tracked change is your AN0442 trigger — correlate the role activation with the hierarchy modification and the window between them.'},

{id:'m4',type:'qcm',summary:'CreateAccount — which statement is wrong?',
scenario:['A junior re-quoted four “facts” about <code>CreateAccount</code> in the runbook. The ATT&amp;CK excerpt they used reads:'],
artefacts:[{label:'T1666 description — CreateAccount (excerpt)',html:'<p>“…adversaries may call the <code>CreateAccount</code> API in order to create a new account within an AWS Organization. This account will use the <b>same payment methods</b> registered to the payment account but <b>may not be subject</b> to existing detections or Service Control Policies.”</p>'}],
question:'Which statement in their notes is <b>wrong</b>?',
options:[
{t:'“CreateAccount copies every existing SCP onto the new account at creation time”',correct:true,why:'Wrong — the description says the new account may NOT be subject to existing SCPs or detections.'},
{t:'“The new account uses the payment methods registered to the payment account”',why:'Right — billing follows the organization, which is why cost anomalies can still surface abuse.'},
{t:'“CreateAccount builds a new account inside the same AWS Organization”',why:'Right — that is what the API does.'},
{t:'“Existing detections may not cover the new account”',why:'Right — and that is exactly why the attacker wants it.'}],
hint:'Three notes match the excerpt word for word. One note reverses the SCP sentence.',
explain:'The wrong note is the SCP one. <b>CreateAccount</b> adds a fresh member account whose payment rides the organization’s payment methods but whose coverage by tuned detections and SCPs is not guaranteed. <b>Defender view:</b> every legitimate onboarding runbook must therefore attach policies and alerts to new accounts explicitly — otherwise the attacker’s fresh account and your fresh account look identical.'},

{id:'m5',type:'qcm',summary:'MoveAccount — the quiet placement move',
scenario:['At 04:00 a pipeline role called <code>organizations:MoveAccount</code>, moving account <code>555555555555</code> from OU <code>ou-gold-strict</code> (heavy SCP guardrails) to OU <code>ou-sandbox-loose</code> (almost none). Nothing else changed.'],
question:'Why can <code>MoveAccount</code> serve a T1666 goal even though nothing enters or leaves the organization?',
options:[
{t:'SCP coverage follows placement, so the account can land where fewer guardrails apply',correct:true,why:'Policies are inherited by position in the tree — moving the account moves its rule set.'},
{t:'MoveAccount deletes the account’s CloudTrail history',why:'A move changes tree position, not logging.'},
{t:'MoveAccount switches the account to a different payment method',why:'Billing is not touched by a move.'},
{t:'MoveAccount disables MFA for the moved account',why:'MFA lives on identities, not on organizational units.'}],
hint:'Think about inheritance: what does the account inherit from its new place in the tree?',
explain:'Service Control Policies are inherited by placement, so <b>MoveAccount</b> is a guardrail escape without a visible “leave”. This is why DET0155 lists <code>MoveAccount</code> next to <code>LeaveOrganization</code> and <code>CreateAccount</code>. <b>Attacker view:</b> smaller blast radius, quieter logs. <b>Defender view:</b> compare the source and destination OU policy sets on every move event — a strict-to-loose move during an incident window is a signal.'},

{id:'m6',type:'multi',summary:'AN0442 — is this correlation valid?',
scenario:['You are tuning the DET0155 analytic AN0442. Two events and the analytic note are in front of you.'],
artefacts:[
{label:'ARTEFACT 1 — CloudTrail 19:58 UTC',html:'<p><span class="lk">eventName</span>=<span class="ls">AssumeRole</span> → <span class="ls">role/HF-ElevatedAdmin</span><br><span class="lk">principal</span>=<span class="lu">support.j.diaz@helvetia-freight[.]example</span><br><span class="lk">justInTimeTicket</span>=<span class="ls">none</span></p>'},
{label:'ARTEFACT 2 — CloudTrail 20:03 UTC',html:'<p><span class="lk">eventName</span>=<span class="ls">LeaveOrganization</span> · <span class="lk">session</span>=<span class="lu">diaz (HF-ElevatedAdmin)</span> · <span class="lk">eventResult</span>=<span class="ls">success</span></p>'},
{label:'ARTEFACT 3 — analytic note (AN0442)',html:'<p>Correlate administrative role elevation <b>followed by</b> hierarchy modification <b>within a short time window</b>; flag deviation from the organizational baseline.</p>'}],
question:'Which elements make this a valid AN0442-style correlation? <b>Select all.</b>',
options:[
{t:'An administrative role elevation happened first',correct:true,why:'Elevation-then-change is the sequence the analytic demands.'},
{t:'A hierarchy modification followed within a short window',correct:true,why:'Five minutes later, a guardrail-removal API fired — well inside any short window.'},
{t:'Both events trace to the same principal',correct:true,why:'Same user session links the two events into one story.'},
{t:'The five-minute gap is inside the short-time-window rule',correct:true,why:'The window is short by definition; five minutes qualifies.'},
{t:'The events happened near the weekend',why:'Calendar position is not part of the analytic logic — it may raise suspicion, but it is not the rule.'},
{t:'The user’s mailbox sits in another region',why:'Irrelevant to the hierarchy correlation. Noise like this must not enter the rule.'}],
multiNote:'Four of the six statements belong in the rule. Extra picks subtract credit.',
hint:'Strip the story down to the analytic’s three ingredients: elevation first, hierarchy change after, one short window.',
explain:'AN0442 is a <b>sequence rule</b>: administrative role elevation, then a hierarchy modification, inside a short window, tied to one principal. The weekend detail and the mailbox region are real-looking noise — a good detection engineer keeps them out of the logic and in the analyst’s notes instead. That separation is what makes the alert tunable.'},

{id:'m7',type:'drag',summary:'After the transfer — who can still see what?',
scenario:['Ten days ago, subscription <code>hf-mtr-payg-01</code> was transferred from the Helvetia Freight tenant to an external tenant. You are rebuilding visibility. Drag each signal to the side that can still see it.'],
items:['The transfer confirmation event in the tenant activity log','CPU usage of the VMs the attacker deployed afterwards','The billing notice that the subscription left the tenant','Deployment logs of resources created after the transfer'],
buckets:['Still visible on the victim tenant','Only on the owning (adversary) tenant'],
assign:[0,1,0,1],
hint:'The victim keeps the events about the move itself; the attacker keeps the events inside what they now own.',
explain:'After a subscription transfer, the compute runs and logs under the <b>owning tenant</b> — the attacker’s. The victim tenant keeps the transfer event, the billing traces, and whatever preceded the move (like the Global Admin grant). That asymmetry is the whole risk of hijacking: <b>the victim’s logs go quiet exactly when the abuse starts</b>. Compensating visibility lives outside the tenant: billing records and the transfer event itself.'},

{id:'m8',type:'blank',summary:'Write the DET0155 watch-list from memory',
scenario:['Your SIEM lost the DET0155 description in a migration. Rewrite the core sentence from memory.'],
text:'DET0155 watches for calls to APIs such as <code>LeaveOrganization</code>, <code>CreateAccount</code> and <code>{0}</code>, and for Azure <code>{1}</code> transfers. It correlates them with administrative role <code>{2}</code> that happened shortly before.',
bank:['MoveAccount','subscription','elevation','patching','encryption'],
correct:['MoveAccount','subscription','elevation'],
why:['The third hierarchy API on the AWS side.','The Azure asset that can move between tenants.','The event that should precede the hierarchy change inside the short window.'],
hint:'First blank: the third Organizations API — moving an account between OUs. Second: the Azure asset. Third: what precedes the change.',
explain:'The watch-list is exactly four moves — <code>LeaveOrganization</code>, <code>CreateAccount</code>, <code>MoveAccount</code>, and Azure subscription transfers — correlated with a preceding role elevation. If your rebuild differs from the page’s wording, your SIEM rule will silently drift from the ATT&amp;CK detection strategy, which is how coverage gaps are born.'},

{id:'m9',type:'qcm',summary:'Which M1054 setting blocks the hijack move?',
scenario:['After a near-miss on <code>hf-mtr-payg-01</code>, the platform team asks for the one setting that would have blocked the transfer attempt outright.'],
question:'Which <code>M1054</code> software configuration most directly blocks subscription hijacking?',
options:[
{t:'An Azure Policy assigned at the top management group that blocks subscription transfers',correct:true,why:'The page names this exact control: a policy to block subscription transfers in Azure.'},
{t:'A longer password policy for Global Administrators',why:'Good hygiene, but it does not forbid the transfer API.'},
{t:'Turning off activity logging to reduce noise',why:'That removes your only visibility — the opposite of a control.'},
{t:'A larger VM size for the billing database',why:'Compute sizing has no effect on tenant-level transfers.'}],
hint:'M1054 is about configuration that forbids behaviour. Which setting makes the transfer impossible?',
explain:'<b>M1054 Software Configuration</b> on the T1666 page: “In Azure environments, consider setting a policy to block subscription transfers.” Assigned high in the management-group tree, it makes the hijack move fail before any log exists — prevention beats detection here, because post-transfer visibility is largely gone.'},

{id:'m10',type:'match',summary:'Control to the move it stops',
scenario:['The hardening backlog lists four controls. Match each to the adversary move it stops or exposes.'],
lefts:['AWS SCP that denies <code>organizations:LeaveOrganization</code>','Azure Policy that blocks subscription transfers','M1018 — hierarchy rights granted to two engineers only','M1047 — weekly review of objects directly under the org root'],
rights:['Stops the guardrail-removal move','Stops the tenant-transfer move','Shrinks who can even attempt hierarchy changes','Finds unexpected objects near the top'],
correct:[0,1,2,3],
why:['The SCP forbids the exact API.','The policy forbids the exact transfer.','Least privilege reduces the attacker pool.','The review surfaces rogue accounts and subscriptions.'],
hint:'Two controls forbid, one shrinks, one watches.',
explain:'This is the mapping you would put in a control matrix. Two <b>M1054</b> configurations forbid moves outright; <b>M1018</b> shrinks the population that can attempt them; <b>M1047</b> catches what slipped through. The T1666 page names all three mitigations — together they cover attempt, capability and residue.'},

{id:'m11',type:'qcm',summary:'Why the management account must stay empty',
scenario:['The M1047 audit finds the AWS management account running 14 VMs and a small database “temporarily” since March. The cloud team sees no problem.'],
question:'Why does the audit flag this as a T1666-adjacent risk?',
options:[
{t:'The top account should hold no workloads, so real hierarchy changes there blend into daily workload noise',correct:true,why:'A busy top account hides the small set of events that should be the only events.'},
{t:'The management account cannot produce logs at all',why:'It can and does log — the issue is signal, not silence.'},
{t:'Workloads in the top account cost more than elsewhere',why:'Cost is not the risk being flagged.'},
{t:'Databases are forbidden anywhere in AWS',why:'Databases are fine — just not in the management account.'}],
hint:'The audit cares about the baseline of the top account: what should the normal event volume there look like?',
explain:'The T1666 page’s M1047 note is blunt: top-level accounts “should not contain any workloads or resources”. An empty management account has a tiny, predictable event stream — any <code>CreateAccount</code>, <code>LeaveOrganization</code> or policy tampering there stands out immediately. Fill it with workloads and the attacker’s hierarchy move is one needle in a haystack you built yourself.'},

{id:'m12',type:'drag',summary:'Which telemetry feeds DET0155?',
scenario:['You are wiring data sources into the DET0155 rule. Drag each signal to the right place.'],
items:['A LeaveOrganization API call','An Azure subscription transfer between tenants','A stopped EDR agent on a VM','A USB storage device plugged into a laptop'],
buckets:['Cloud Service Modification — hierarchy telemetry','Other data sources'],
assign:[0,0,1,1],
hint:'DET0155 eats hierarchy events only. Everything else belongs to other rules.',
explain:'<b>Cloud Service Modification</b> is the data component behind DET0155: changes to cloud services and structures — org APIs, subscription moves. The EDR event belongs to host telemetry; the USB event belongs to device telemetry. Feeding unrelated sources into a hierarchy rule does not add coverage, it adds false positives — the classic tuning mistake.'},

{id:'m13',type:'triage',summary:'Monday queue — four hierarchy alerts',
scenario:['Monday 08:40. Four alerts wait. Classify each with one decision so the on-call can act.'],
alerts:[
{title:'Alert 1 — CloudTrail 03:12 Sat',body:'<code>LeaveOrganization</code> by role <code>HF-PlatformAdmin</code>, dormant for 8 months, no change ticket.',
options:[{t:'Escalate as suspected T1666',correct:true,why:'Dormant role, weekend, no ticket, guardrail-removal API — the full pattern.'},{t:'Close as routine',why:'Nothing routine here; every fact points the other way.'},{t:'Mark as planned change',why:'There is no change record to plan with.'}]},
{title:'Alert 2 — CloudTrail 04:00 Mon',body:'<code>MoveAccount</code> by role <code>svc-IaC-Pipeline</code> with change record CHG009312 attached.',
options:[{t:'Close as planned change',correct:true,why:'Tracked pipeline, named change record, expected automation principal.'},{t:'Escalate as T1666',why:'The change record and the known pipeline principal make this a planned move.'},{t:'Disable the pipeline',why:'Disabling a healthy pipeline because it did its job is overreaction.'}]},
{title:'Alert 3 — Azure Activity Log',body:'New subscription created by Global Admin <code>svc-finance-ops</code> at 23:47. No change record exists.',
options:[{t:'Escalate as suspected T1666',correct:true,why:'Service principal, off-hours, no ticket, hierarchy change — verify before it becomes compute.'},{t:'Close as routine',why:'The missing change record is exactly what routine does not look like.'},{t:'Wait for month-end',why:'Delaying lets the attacker deploy inside the clean subscription.'}]},
{title:'Alert 4 — Azure Policy events',body:'Policy <code>deny-subscription-transfer</code> assigned at the top management group by the platform team, approval reference attached.',
options:[{t:'Close as planned change',correct:true,why:'It is the M1054 control being deployed — defensive and tracked.'},{t:'Escalate as T1666',why:'The change strengthens the hierarchy rather than escaping it.'},{t:'Archive as unknown',why:'A tracked defensive change deserves a clean close, not “unknown”.'}]}],
hint:'Weigh four facts per alert: tracked change, expected principal, hour, and which direction the hierarchy moved.',
explain:'The queue teaches the triage triangle: <b>change record</b>, <b>expected principal</b>, <b>direction</b>. Alerts 1 and 3 fail all three tests and escalate; Alerts 2 and 4 pass them and close. This is AN0442 thinking applied by hand — and it is exactly what the analytic automates for you at 03:00.'},

{id:'m14',type:'order',summary:'First response to a confirmed LeaveOrganization',
scenario:['The 03:12 Saturday <code>LeaveOrganization</code> is confirmed hostile. Order the first-response steps from first to last.'],
items:['Confirm the event in the audit trail','Snapshot the event evidence for the case file','Check for role elevation shortly before the event','Contact the account owner and the change approver','Propose the SCP or policy fix in the follow-up review'],
hint:'Evidence first, people after, improvements last.',
explain:'Order matters: confirm (is it real?), snapshot (freeze the evidence before anything rotates), correlate elevation (AN0442 in your head), then contact humans, and only last propose the control fix. <b>Defender view:</b> the fix is worthless if the evidence is gone; <b>attacker view:</b> they count on responders patching the SCP before understanding how entry happened.'},

{id:'m15',type:'terminal',summary:'CLI — find every LeaveOrganization call in the event history',
scenario:['You are on the Helvetia Freight security jump host, AWS CLI configured for the audit account. The lead says: “Search the CloudTrail event history for every LeaveOrganization call — from the CLI, not the console.” You know the tool is CloudTrail event lookup; choose the service, the command and the filter yourself.'],
question:'Run the CloudTrail lookup that filters the event history by <code>LeaveOrganization</code>, then press Check.',
prompt:'analyst@hf-sec-jump:~$',
simMatch:'aws cloudtrail lookup-events',
simLines:['Events found: 1','-- eventTime: 2026-07-05T02:41:33Z  eventName: LeaveOrganization  username: night-runner','— end of results —'],
required:[{re:'(^|\\s)aws(\\s|$)',label:'the aws CLI program'},{re:'(^|\\s)cloudtrail(\\s|$)',label:'the cloudtrail service'},{re:'(^|\\s)lookup-events(\\s|$)',label:'the lookup-events command'},{re:'attributekey\\s*=\\s*"?eventname',label:'AttributeKey=EventName (filter on the event name)'},{re:'attributevalue\\s*=\\s*"?leaveorganization',label:'AttributeValue=LeaveOrganization (the DET0155 watch-list API)'}],
wrong:[{re:'attributekey\\s*=\\s*"?username',label:'filtering by Username instead of EventName',why:'Username filters miss org API events recorded under role sessions.'},{re:'\\sdelete|\\sremove',label:'a destructive flag',why:'You are reading history, not changing it.'}],
dangerous:[{re:'delete-trail|stop-logging',label:'a logging-kill switch',why:'Stopping or deleting the trail during an investigation destroys the very evidence you came for.'}],
canonical:'aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=LeaveOrganization',
parts:[{label:'aws cloudtrail',why:'The service that stores the management event history.'},{label:'lookup-events',why:'The read-only history search — no console clicking, repeatable in a runbook.'},{label:'AttributeKey=EventName',why:'You filter on the event name, not on a user.'},{label:'AttributeValue=LeaveOrganization',why:'The exact DET0155 watch-list API.'},{label:'--max-results (optional)',why:'Caps the result page size; harmless to add or omit.'}],
hint:'The tool is cloudtrail, the command is lookup-events, and the filter is a key/value pair whose key is EventName.',
explain:'This is the defender’s side of DET0155: a repeatable CLI search that lists every <code>LeaveOrganization</code> in the retention window. <b>Attacker view:</b> they run <code>LeaveOrganization</code> once and hope you never search for it. <b>Defender view:</b> one command, every occurrence, with timestamps and principals — the base of your case file.'},

{id:'m16',type:'blank',summary:'Finish the incident report sentence',
scenario:['Draft the summary line of case HF-2291 for the weekly report.'],
text:'Case HF-2291 is mapped to <code>T1666</code> under the <code>{0}</code> tactic (TA0112). The adversary modified the cloud <code>{1}</code>, and the subscription <code>{2}</code> to an external tenant is confirmed.',
bank:['Defense Impairment','hierarchy','transfer','Confidentiality','hard drive'],
correct:['Defense Impairment','hierarchy','transfer'],
why:['T1666’s tactic name — the report must carry it for coverage tracking.','The object the technique modifies.','The Azure move that moved the subscription out.'],
hint:'The tactic is the one that breaks defenses; the object is what T1666 modifies; the Azure move has a three-syllable name.',
explain:'Reports feed dashboards, so the tactic word must be <b>Defense Impairment</b> (TA0112), the modified object is the <b>hierarchy</b>, and the confirmed Azure move is the <b>transfer</b>. Mapping precision is not bureaucracy: the site’s coverage reports and the DET0155 rule both key off these exact words.'}
]};

</script>
<script>
'use strict';
/* ============ T1666 dark exam engine (vanilla JS, no external requests) ============ */
var $=function(s){return document.querySelector(s);};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function minLabel(sec){return Math.round(sec/60)+' min';}
var META=EXAM.meta;
function creditLabel(c,N){ if(c>=1)return {cls:'fb-ok',ic:'✓',word:'CORRECT'}; if(c>0)return {cls:'fb-part',ic:'✓',word:'PARTIALLY CORRECT'}; return {cls:'fb-bad',ic:'✗',word:'INCORRECT'}; }

/* ---------------- global attempt state ---------------- */
var S={view:'intro',order:[],idx:0,credits:{},hinted:{},skipped:[],reviewMode:false,
  timer:{state:'RUNNING',remaining:0,prev:'RUNNING'},_int:null,
  pausedManualSec:0,pausedAutoSec:0,reportFired:false,username:''};

function setState(st){ if(S.timer.state===st)return; S.timer.prev=S.timer.state; S.timer.state=st; renderTop(); }
function startTicker(){ if(S._int)clearInterval(S._int); S._int=setInterval(tick,1000); }
function tick(){
  var t=S.timer;
  if(t.state==='RUNNING'){ t.remaining--; if(t.remaining<=0){t.remaining=0;renderTop();endByTimeout();return;} }
  else if(t.state==='PAUSED_MANUAL'){ S.pausedManualSec++; }
  else if(t.state==='PAUSED_AUTO_CHECK'){ S.pausedAutoSec++; }
  renderTop();
}
function endByTimeout(){ setState('ENDED'); if(S._int)clearInterval(S._int); openResults(true); }
function showVeil(on){ $('#pauseVeil').classList.toggle('hidden',!on); }

/* ---------------- score ---------------- */
function scoreExercise(H,W,N){ var c=(H-W)/N; if(c<0)c=0; if(c>1)c=1; return c; }
function liveScore(){
  var sum=0,cnt=0; for(var k in S.credits){ sum+=S.credits[k]; cnt++; }
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,pct:pct};
}
function totalAnswerable(){ return S.order.length; }

/* ---------------- reporting + handshake ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  var o=location.origin||'';
  var realSite=o && o!=='null' && o.indexOf('file:')!==0; /* opened directly on file: -> same-origin target */
  var target=realSite?o:'/'; /* never '*' */
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},target);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(ev){
  var d=ev.data; if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  if(d.username)S.username=d.username;
  /* theme is always 'dark' by contract — the file is dark-only, nothing to switch */
});

/* ---------------- views ---------------- */
function showView(v){
  ['introView','examView','reviewView','resultsView'].forEach(function(id){
    $('#'+id).classList.toggle('hidden',id!==v);
  });
  window.scrollTo(0,0);
}

/* ---------------- top bar ---------------- */
function timerStateLabel(){
  var t=S.timer;
  if(t.state==='RUNNING')return {cls:'t-running',html:'<span class="tstate">▶ RUNNING</span>'};
  if(t.state==='PAUSED_MANUAL')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — manual (press Resume)</span>'};
  if(t.state==='PAUSED_AUTO_CHECK')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'};
  return {cls:'t-ended',html:'<span class="tstate">■ ENDED</span>'};
}
function buildTop(){
  var row=el('div','tb-row');
  row.appendChild(el('span','tb-id',META.objId+' · '+META.objName));
  var sev=el('span','chip sev-badge','◆ '+META.sevName);
  sev.setAttribute('aria-label','Severity '+META.sevName);
  row.appendChild(sev);
  var cnt=el('span','chip','<span class="lbl">Exercise</span> <b id="tbCount">–</b>');
  row.appendChild(cnt);
  var tc=el('span','chip timer-chip','<span class="tval" id="tbTime">–:––</span> <span id="tbState"></span>');
  tc.setAttribute('aria-label','Timer and timer state');
  row.appendChild(tc);
  var sc=el('span','chip score-chip','<span class="lbl">Score</span> <span class="sval" id="tbScore">0.0 / 0</span> <span class="spct" id="tbPct">0%</span>');
  row.appendChild(sc);
  row.appendChild(el('span','spacer'));
  var hb=el('button','btn btn-warn','💡 Hint'); hb.id='tbHint'; hb.setAttribute('aria-label','Show one hint for this exercise (costs 10 percent of its credit)');
  hb.addEventListener('click',onHint); row.appendChild(hb);
  var pb=el('button','btn btn-pause','⏸ Pause'); pb.id='tbPause'; pb.setAttribute('aria-label','Manual pause — hides the exercise and stops the timer');
  pb.addEventListener('click',onPause); row.appendChild(pb);
  var sb=el('button','btn btn-ghost','⚠ Skip'); sb.id='tbSkip'; sb.setAttribute('aria-label','Skip this exercise — move it to the skipped pool');
  sb.addEventListener('click',onSkip); row.appendChild(sb);
  var bar=el('div','pbar','<div class="pbar-track"><div class="pbar-fill" id="pFill"></div></div>');
  $('#topbar').appendChild(row); $('#topbar').appendChild(bar);
}
function renderTop(){
  var tt=timerStateLabel();
  var chip=$('#topbar .timer-chip');
  if(chip){ chip.className='chip timer-chip '+tt.cls; $('#tbTime').textContent=fmtT(S.timer.remaining); $('#tbState').innerHTML=tt.html; }
  var c=$('#tbCount'); if(c)c.textContent=(S.idx+1)+' of '+totalAnswerable();
  var ls=liveScore();
  var s=$('#tbScore'); if(s)s.textContent=ls.sum.toFixed(1)+' / '+ls.cnt;
  var p=$('#tbPct'); if(p)p.textContent=ls.pct+'%';
  var f=$('#pFill'); if(f)f.style.width=Math.round(((S.idx)/Math.max(1,totalAnswerable()))*100)+'%';
  var sk=$('#tbSkip'); if(sk)sk.disabled=(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
  var hb=$('#tbHint'); if(hb)hb.disabled=!!S.hinted[S.order[S.idx]]||(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
}

/* ---------------- intro ---------------- */
function renderIntro(){
  var v=$('#introView'); v.innerHTML='';
  var hero=el('div','intro-hero');
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' practice exam'));
  hero.appendChild(el('p','tb-sub','<b>'+META.objId+' — '+META.objName+'</b> · MITRE ATT&CK Enterprise technique · Tactic: Defense Impairment (TA0112) · Platform: IaaS'));
  var facts=el('div','facts');
  function f(lbl,val){var x=el('span','fact','<span>'+lbl+'</span> <b>'+val+'</b>');facts.appendChild(x);}
  f('Exercises in this file:',META.questionCount);
  f('Estimated time:',minLabel(META.estimatedMinutes));
  f('Timer budget:',minLabel(META.timerSeconds));
  f('Pass mark:',META.passMark+'%');
  f('Severity:',META.sevName+' ◆');
  hero.appendChild(facts);
  v.appendChild(hero);

  var c1=el('div','card');
  c1.appendChild(el('h2',null,'<span class="ic">◈</span> What you will learn here'));
  c1.appendChild(el('div',null,EXAM.intro.learn));
  v.appendChild(c1);

  var c2=el('div','card');
  c2.appendChild(el('h2',null,'<span class="ic">◈</span> Keywords covered in this exam'));
  c2.appendChild(el('p','tb-sub','Every keyword below is exercised by the '+META.questionCount+' interactive tasks in this file.'));
  EXAM.intro.keywords.forEach(function(k){
    var t=el('div','kw-theme');
    t.appendChild(el('h3',null,k.theme));
    var ul=el('ul','kw-items');
    k.items.forEach(function(i){ul.appendChild(el('li',null,i));});
    t.appendChild(ul); c2.appendChild(t);
  });
  v.appendChild(c2);

  var c3=el('div','card');
  c3.appendChild(el('h2',null,'<span class="ic">◈</span> How this exam works'));
  c3.appendChild(el('div',null,EXAM.intro.how));
  var start=el('button','btn btn-go','▶ Start the exam');
  start.style.cssText='margin-top:16px;min-width:220px;min-height:48px;font-weight:700;';
  start.setAttribute('aria-label','Start the exam');
  start.addEventListener('click',startExam);
  c3.appendChild(start);
  v.appendChild(c3);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  resetAttempt();
  showView('examView');
  S.idx=0;
  setState('RUNNING');
  startTicker();
  renderEx();
}
function resetAttempt(){
  S.order=shuffle(EXAM.exercises.map(function(e,i){return i;}));
  S.credits={}; S.hinted={}; S.skipped=[]; S.reviewMode=false; S.reportFired=false;
  S.pausedManualSec=0; S.pausedAutoSec=0;
  S.timer.state='RUNNING'; S.timer.prev='RUNNING'; S.timer.remaining=META.timerSeconds;
  if(S._int)clearInterval(S._int);
  $('#exMain').innerHTML='';
}
function retake(){ startExam(); }

function onHint(){
  var id=S.order[S.idx]; if(id==null||S.hinted[id])return;
  var ex=EXAM.exercises[id]; if(!ex)return;
  S.hinted[id]=true; renderTop();
  var hp=$('#hintPanel');
  if(hp){ hp.classList.remove('hidden'); hp.scrollIntoView({block:'nearest'}); return; }
  var p=el('div','syntax-panel','<h4>💡 Hint — costs 10% of this exercise&rsquo;s credit</h4><div>'+ex.hint+'</div>');
  p.id='hintPanel';
  var ans=$('#ansBlock .block-body'); if(ans)ans.parentNode.insertBefore(p,ans.nextSibling);
}
function onPause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){ setState('PAUSED_MANUAL'); showVeil(true); }
  else if(t.state==='PAUSED_MANUAL'){ setState(t.prev==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); showVeil(false); }
}
function onSkip(){
  var id=S.order[S.idx]; if(id==null)return;
  if(!(id in S.credits)&&S.skipped.indexOf(id)<0)S.skipped.push(id);
  if(S.idx>=totalAnswerable()-1){ showReview(); if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); }
  else { S.idx++; if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); renderEx(); }
}
function onCheck(){
  if(S.timer.state==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); } /* first action: auto-pause */
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  if(id in S.credits)return;
  var g=gradeCurrent(ex);
  var c=scoreExercise(g.H,g.W,g.N);
  if(S.hinted[id])c=Math.max(0,c-0.10);
  S.credits[id]=c;
  renderFeedback(ex,g,c);
  renderTop();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  if(S.reviewMode){ S.reviewMode=false; showReview(); return; }
  if(S.idx>=totalAnswerable()-1){ showReview(); }
  else { S.idx++; renderEx(); }
}
function onFinalSubmit(){
  if(S.timer.state!=='ENDED')setState('ENDED');
  if(S._int)clearInterval(S._int);
  openResults(false);
}

/* ---------------- exercise rendering ---------------- */
function artefactHtml(a,i){
  return '<div class="artefact"><span class="artefact-head">ARTEFACT '+(i+1)+' — '+a.label+'</span><div class="artefact-body">'+a.html+'</div></div>';
}
function renderEx(){
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  var main=$('#exMain'); main.innerHTML='';
  renderTop();
  var rvTag=S.reviewMode?'<span class="chip" style="border-color:var(--state-skipped);color:var(--state-skipped)">⚠ Reviewing a skipped exercise</span>':'';
  var top=el('div',null,rvTag);
  top.style.marginBottom='12px'; main.appendChild(top);

  /* SCENARIO block */
  var sc=el('section','block block-scenario'); sc.id='scenBlock';
  var head=el('div','block-head','<span class="bh-ic">◈</span> SCENARIO');
  var col=el('button','collapser','▾ Collapse');
  col.setAttribute('aria-label','Collapse or expand the scenario panel');
  head.appendChild(col); sc.appendChild(head);
  var sum=el('div','scen-sum','📌 '+ex.summary);
  sc.appendChild(sum);
  var body=el('div','block-body scenario');
  var html='';
  (ex.scenario||[]).forEach(function(p){html+='<p>'+p+'</p>';});
  if(ex.viewer){ html+=viewerHtml(ex.viewer); }
  (ex.artefacts||[]).forEach(function(a,i){ html+=artefactHtml(a,i); });
  body.innerHTML=html;
  sc.appendChild(body);
  main.appendChild(sc);
  wireViewer(body);
  col.addEventListener('click',function(){
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    sum.style.display=open?'block':'none';
    col.textContent=open?'▸ Expand':'▾ Collapse';
  });

  /* QUESTION block */
  var qb=el('section','block block-question');
  qb.appendChild(el('div','block-head','<span class="bh-ic">◈</span> QUESTION'));
  qb.appendChild(el('div','block-body',ex.question));
  main.appendChild(qb);

  /* YOUR ANSWER block */
  var ab=el('section','block block-answer'); ab.id='ansBlock';
  ab.appendChild(el('div','block-head','<span class="bh-ic">◈</span> YOUR ANSWER'));
  var abody=el('div','block-body'); abody.id='ansBody'; ab.appendChild(abody);
  main.appendChild(ab);

  buildWidget(ex,abody);

  /* nav */
  var nav=el('div','exnav'); nav.id='exNav';
  var chk=el('button','btn btn-go','✓ Check'); chk.id='btnCheck';
  chk.setAttribute('aria-label','Check this exercise — the timer pauses for unlimited feedback review');
  chk.addEventListener('click',onCheck); nav.appendChild(chk);
  if(ex.type==='branch'){ chk.disabled=true; } /* multi-step: Check unlocks only after the last step is answered */
  nav.appendChild(el('span','spacer'));
  var nx=el('button','btn btn-primary hidden','Next ▶'); nx.id='btnNext';
  nx.setAttribute('aria-label','Next exercise — the timer resumes');
  nx.addEventListener('click',onNext); nav.appendChild(nx);
  var fin=el('button','btn btn-primary hidden','⏹ Final Submit'); fin.id='btnFinal';
  fin.setAttribute('aria-label','Finish the exam and open the results screen');
  fin.addEventListener('click',onFinalSubmit); nav.appendChild(fin);
  main.appendChild(nav);
  var fn=el('p','footer-note','Press Check to submit and see feedback. The timer pauses automatically while you read the feedback and resumes only when you press Next.');
  main.appendChild(fn);
}

/* ---------------- widget builders ---------------- */
var WIDGETS={};
function buildWidget(ex,host){
  var w=WIDGETS[ex.type];
  if(!w){ host.innerHTML='<p class="fbitem st-bad">Unknown exercise type.</p>'; return; }
  var inst=w.build(ex,host);
  host._grade=inst.grade;
}
/* --- option buttons shared by qcm / multi --- */
function optButton(o,idx,multi){
  var b=el('button','opt','<span class="ol">'+String.fromCharCode(65+idx)+'.</span><span class="ot">'+o.t+'</span>');
  b.type='button'; b._sel=false; b._o=o; b._idx=idx;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){
    if(b.disabled)return;
    if(multi){ b._sel=!b._sel; b.classList.toggle('sel',b._sel); b.setAttribute('aria-pressed',b._sel?'true':'false'); }
    else {
      var host=b.parentNode;
      Array.prototype.forEach.call(host.children,function(c){c._sel=false;c.classList.remove('sel');c.setAttribute('aria-pressed','false');});
      b._sel=true; b.classList.add('sel'); b.setAttribute('aria-pressed','true');
    }
  });
  return b;
}
function lockOptions(host){
  Array.prototype.forEach.call(host.querySelectorAll('button.opt'),function(b){b.disabled=true;});
}
function optGrade(items){
  /* items: [{o, sel}] -> partial credit over correct options */
  var N=0,H=0,W=0,out=[];
  items.forEach(function(it){
    if(it.o.correct)N++;
    if(it.o.correct&&it.sel)H++;
    if(!it.o.correct&&it.sel)W++;
  });
  items.forEach(function(it){
    if(it.o.correct&&it.sel)out.push({t:it.plain,st:'ok',why:it.o.why||'Part of the correct answer.'});
    else if(!it.o.correct&&it.sel)out.push({t:it.plain,st:'bad',why:it.o.why||'Not part of the correct answer.'});
    else if(it.o.correct&&!it.sel)out.push({t:it.plain,st:'miss',why:it.o.why||'You missed this correct item.'});
  });
  if(N===0)N=1;
  return {H:H,W:W,N:N,items:out};
}
function plainOf(o){ var d=el('div',null,o.t); return d.textContent.replace(/\s+/g,' ').trim(); }

WIDGETS.qcm={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,false));
  });
  host.appendChild(box);
  var hint=el('p','dnd-hint','Choose one answer, then press Check.');
  host.appendChild(hint);
  return {grade:function(){
    var sel=null;
    Array.prototype.forEach.call(box.children,function(b){ if(b._sel)sel=b; });
    lockOptions(box);
    var correct=ex.options.filter(function(o){return o.correct;})[0];
    var ok=sel&&sel._o.correct;
    var items=[{t:'Correct answer: '+plainOf(correct),st:ok?'ok':'bad',why:correct.why}];
    return {H:ok?1:0,W:(!ok)?1:0,N:1,items:items};
  }};
}};

WIDGETS.multi={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,true));
  });
  host.appendChild(box);
  host.appendChild(el('p','dnd-hint',ex.multiNote||'Select all answers that apply, then press Check.'));
  return {grade:function(){
    var items=[];
    Array.prototype.forEach.call(box.children,function(b){ if(b._o)items.push({o:b._o,sel:b._sel,plain:plainOf(b._o)}); });
    lockOptions(box);
    return optGrade(items);
  }};
}};

WIDGETS.match={build:function(ex,host){
  var rights=shuffle(ex.rights.map(function(r,i){return {t:r,i:i};}));
  var wrap=el('div');
  var rows=[];
  ex.lefts.forEach(function(l,li){
    var row=el('div','selrow');
    row.appendChild(el('span','sr-l',l));
    var s=el('select'); s.setAttribute('aria-label','Match: '+l);
    var ph=el('option',null,'— choose —'); ph.value=''; s.appendChild(ph);
    rights.forEach(function(r){ var o=el('option',null,r.t); o.value=String(r.i); s.appendChild(o); });
    s._li=li; row.appendChild(s); wrap.appendChild(row); rows.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Pick the matching item for every row, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    rows.forEach(function(s,li){
      var v=s.value; s.disabled=true;
      if(v===''){ items.push({t:ex.lefts[li],st:'miss',why:'Left unanswered. Correct match: '+ex.rights[ex.correct[li]]}); M++; return; }
      if(parseInt(v,10)===ex.correct[li]){ H++; items.push({t:ex.lefts[li],st:'ok',why:ex.why?ex.why[li]:'Correct pair.'}); }
      else { W++; items.push({t:ex.lefts[li],st:'bad',why:'You matched “'+ex.rights[parseInt(v,10)]+'”. Correct match: '+ex.rights[ex.correct[li]]+(ex.why?' — '+ex.why[li]:'')}); }
    });
    var N=ex.lefts.length;
    return {H:H,W:W,N:N,items:items};
  }};
}};
WIDGETS.blank={build:function(ex,host){
  var wrap=el('div','blank-text');
  var parts=ex.text.split(/\{\d\}/);
  var slots=[];
  var html='';
  for(var i=0;i<parts.length;i++){
    html+=parts[i];
    if(i<ex.correct.length){ html+='<select data-b="'+i+'" aria-label="Blank '+(i+1)+'"><option value="">— choose —</option></select>'; }
  }
  wrap.innerHTML=html;
  var bank=shuffle(ex.bank.map(function(b){return b;}));
  Array.prototype.forEach.call(wrap.querySelectorAll('select'),function(s){
    bank.forEach(function(w){ var o=el('option',null,w); o.value=w; s.appendChild(o); });
    slots.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Fill every blank from the shuffled word bank, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    slots.forEach(function(s,i){
      var v=s.value; s.disabled=true;
      if(v===''){ items.push({t:'Blank '+(i+1),st:'miss',why:'Left empty. Correct word: '+ex.correct[i]}); M++; }
      else if(v===ex.correct[i]){ H++; items.push({t:'Blank '+(i+1)+': “'+ex.correct[i]+'”',st:'ok',why:ex.why?ex.why[i]:'This word fits the sentence and the ATT&CK facts.'}); }
      else { W++; items.push({t:'Blank '+(i+1)+': you chose “'+v+'”',st:'bad',why:'Correct word: “'+ex.correct[i]+'”.'+(ex.why?' '+ex.why[i]:'')}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items};
  }};
}};

WIDGETS.order={build:function(ex,host){
  var list=el('div','ordr');
  var cur=shuffle(ex.items.map(function(t,i){return {t:t,i:i};}));
  function draw(){
    list.innerHTML='';
    cur.forEach(function(it,pos){
      var row=el('div','ordr-item');
      row.draggable=true; row._pos=pos;
      row.appendChild(el('span','opos',(pos+1)+'.'));
      row.appendChild(el('span','otxt',it.t));
      var btns=el('span','ordr-btns');
      var up=el('button',null,'↑'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up');
      up.addEventListener('click',function(){ if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;draw();} });
      var dn=el('button',null,'↓'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
      dn.addEventListener('click',function(){ if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;draw();} });
      btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
      row.addEventListener('dragstart',function(ev){ S._dragRow=pos; try{ev.dataTransfer.setData('text/plain','row');}catch(e){} });
      row.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      row.addEventListener('drop',function(ev){ ev.preventDefault();
        var from=S._dragRow; if(from==null||from===pos)return;
        var m=cur.splice(from,1)[0]; cur.splice(pos,0,m); S._dragRow=null; draw();
      });
      list.appendChild(row);
    });
  }
  draw();
  host.appendChild(list);
  host.appendChild(el('p','dnd-hint','Put the items in the correct order: use ↑ / ↓ or drag the rows, then press Check.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    cur.forEach(function(it,pos){
      var ok=it.i===pos;
      if(ok)H++; else W++;
      items.push({t:'Position '+(pos+1)+': '+it.t,st:ok?'ok':'bad',why:ok?'Correct position.':'Expected here: '+ex.items[pos]});
    });
    ex.items.forEach(function(t,pos){
      if(cur[pos].i!==pos){ /* already covered by position rows */ }
    });
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.drag={build:function(ex,host){
  var wrap=el('div','dnd-wrap');
  var bank=el('div','dnd-bank','<h4 style="margin:0 0 6px;font-size:.9em;color:var(--text-secondary)">Item bank</h4>');
  var zones=el('div','dnd-zones');
  var buckets=[];
  ex.buckets.forEach(function(b,bi){
    var z=el('div','dnd-bucket','<h4>⬛ '+b+'</h4>');
    z._bi=bi; zones.appendChild(z); buckets.push(z);
  });
  var picked=null;
  function unassign(it){ if(it._bi!=null){ buckets[it._bi].removeChild(it); it._bi=null; bank.appendChild(it); it.classList.remove('picked'); var a=it.querySelector('.asg'); if(a)a.remove(); } }
  function assign(it,bi){ unassign(it); it._bi=bi; buckets[bi].appendChild(it); it.appendChild(el('span','asg','→ '+ex.buckets[bi])); }
  ex.items.forEach(function(t){
    var it=el('div','dnd-item',t);
    it._bi=null; it._t=t; it.tabIndex=0; it.setAttribute('role','button');
    it.setAttribute('aria-label','Draggable item: '+t+'. Click to pick, then click a zone.');
    function pick(){ if(picked===it){picked.classList.remove('picked');picked=null;return;} if(picked)picked.classList.remove('picked'); picked=it; it.classList.add('picked'); }
    it.addEventListener('click',function(){ if(!it.disabled)pick(); });
    it.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();} });
    it.addEventListener('pointerdown',function(ev){
      if(it.disabled)return;
      it.classList.add('dragging'); pick();
      function move(e){
        buckets.forEach(function(z){ z.classList.toggle('over',pointIn(e,z)); });
      }
      function up(e){
        document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
        it.classList.remove('dragging');
        var zi=-1; buckets.forEach(function(z,i){ if(pointIn(e,z))zi=i; });
        buckets.forEach(function(z){ z.classList.remove('over'); });
        if(zi>=0)assign(it,zi);
      }
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
    bank.appendChild(it);
  });
  function pointIn(ev,node){ var r=node.getBoundingClientRect(); return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; }
  buckets.forEach(function(z){
    z.addEventListener('click',function(){ if(picked){ assign(picked,z._bi); picked.classList.remove('picked'); picked=null; } });
  });
  wrap.appendChild(bank); wrap.appendChild(zones); host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Drag each item into the right zone — or click the item, then click the zone. Click an item again to return it to the bank.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){
      if(it._bi==null){ items.push({t:it._t,st:'miss',why:'Left in the bank. Belongs to: '+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]}); M++; }
    });
    buckets.forEach(function(z,bi){
      Array.prototype.forEach.call(z.querySelectorAll('.dnd-item'),function(it){
        var ok=ex.assign[ex.items.indexOf(it._t)]===bi;
        if(ok)H++; else W++;
        items.push({t:it._t,st:ok?'ok':'bad',why:ok?'Correct zone.':'Placed in “'+ex.buckets[bi]+'”. Belongs in “'+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]+'”.'});
      });
    });
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){it.disabled=true;});
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

/* ---------------- log viewer ---------------- */
function viewerHtml(v){
  var h='<div class="artefact"><span class="artefact-head">LOG VIEWER — '+v.label+'</span><div class="artefact-body">';
  h+='<div class="logv-filter"><span class="flbl">filter</span><input type="text" aria-label="Filter log lines" placeholder="Type to filter lines…"></div>';
  h+='<div class="logv-lines">';
  v.lines.forEach(function(l){ h+='<div class="logline">'+l+'</div>'; });
  h+='</div></div></div>';
  return h;
}
function wireViewer(host){
  var inp=host.querySelector('.logv-filter input');
  if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase();
    host.querySelectorAll('.logv-lines .logline').forEach(function(l){
      l.style.display=l.textContent.toLowerCase().indexOf(q)>=0?'block':'none';
    });
  });
}

WIDGETS.terminal={build:function(ex,host){
  if(ex.timerNote){ var tn=el('div','timer-note','⏱ '+ex.timerNote); host.appendChild(tn); }
  if(ex.syntaxPanel){
    var sp=el('div','syntax-panel','<h4>Syntax reminder</h4>'+ex.syntaxPanel);
    host.appendChild(sp);
  }
  var term=el('div','term');
  term.innerHTML='<div class="term-head"><span class="term-dot"></span><span>'+ (ex.termTitle||'audit shell — simulation only, nothing is really executed') +'</span></div>'+
    '<div class="term-scroll"><div class="term-line lm">'+(ex.shellIntro||'Type your command and press Enter.')+'</div></div>';
  var inrow=el('div','term-in');
  inrow.innerHTML='<span class="pr">'+ex.prompt+'</span>';
  var inp=el('input'); inp.type='text'; inp.setAttribute('aria-label','Terminal input'); inp.autocomplete='off'; inp.spellcheck=false;
  inrow.appendChild(inp); term.appendChild(inrow);
  host.appendChild(term);
  var scroll=term.querySelector('.term-scroll');
  var lastCmd='';
  function norm(c){ return c.replace(/\s+/g,' ').trim(); }
  function run(){
    var v=inp.value; if(!v.trim())return;
    lastCmd=norm(v);
    var line=el('div','term-line'); line.innerHTML='<span class="lm">'+ex.prompt+'</span> '+lastCmd.replace(/</g,'&lt;');
    scroll.appendChild(line);
    var out;
    if(ex.simMatch&&new RegExp(ex.simMatch,'i').test(lastCmd.toLowerCase())) out=ex.simLines;
    else out=['zsh: only read-only audit commands are available in this simulator.'];
    out.forEach(function(o){ scroll.appendChild(el('div','term-line lm',o)); });
    scroll.scrollTop=scroll.scrollHeight;
    inp.value='';
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')run(); });
  var runBtn=el('button','btn','Run ▸'); runBtn.type='button';
  runBtn.style.minHeight='44px'; runBtn.addEventListener('click',run);
  inrow.appendChild(runBtn);
  host.appendChild(el('p','dnd-hint','Run the command you judge correct, then press Check. Your last command is graded.'));
  return {grade:function(){
    inp.disabled=true; runBtn.disabled=true;
    var cmd=(lastCmd||'').toLowerCase().replace(/\s+/g,' ').trim();
    var items=[],dangerHit=null;
    (ex.dangerous||[]).forEach(function(d){ if(new RegExp(d.re,'i').test(cmd))dangerHit=d; });
    var H=0,W=0;
    if(!cmd){ return {H:0,W:0,N:ex.required.length,items:[{t:'No command was run',st:'bad',why:'Type a command in the shell, then press Check.'}],danger:null}; }
    ex.required.forEach(function(r){
      if(new RegExp(r.re,'i').test(cmd)){ H++; items.push({t:'✓ element — '+r.label,st:'ok',why:'Present in your command.'}); }
      else { items.push({t:'○ element — '+r.label,st:'miss',why:'Missing from your command.'}); }
    });
    (ex.wrong||[]).forEach(function(w){
      if(new RegExp(w.re,'i').test(cmd)){ W++; items.push({t:'✗ element — '+w.label,st:'bad',why:w.why||'This element does not belong here.'}); }
    });
    if(dangerHit){ items.unshift({t:'✗ DANGEROUS — NEAR MISS: '+dangerHit.label,st:'bad',why:dangerHit.why}); }
    return {H:H,W:W,N:ex.required.length,items:items,danger:dangerHit};
  }};
}};

WIDGETS.triage={build:function(ex,host){
  var wrap=el('div');
  var sels=[];
  ex.alerts.forEach(function(a,ai){
    var box=el('div','artefact');
    box.innerHTML='<span class="artefact-head">ALERT '+(ai+1)+' — '+a.title+'</span><div class="artefact-body"><p>'+a.body+'</p></div>';
    var row=el('div','selrow');
    var s=el('select'); s.setAttribute('aria-label','Decision for alert '+(ai+1));
    var ph=el('option',null,'— decide —'); ph.value=''; s.appendChild(ph);
    shuffle(a.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
      var o=el('option',null,p.o.t); o.value=String(p.i); s.appendChild(o);
    });
    s._ai=ai; row.appendChild(s); box.appendChild(row); wrap.appendChild(box); sels.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Choose one decision per alert, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    sels.forEach(function(s,ai){
      var v=s.value; s.disabled=true;
      var opts=ex.alerts[ai].options;
      var corr=opts.filter(function(o){return o.correct;})[0];
      if(v===''){ items.push({t:ex.alerts[ai].title,st:'miss',why:'Left undecided. Best call: '+corr.t+' — '+corr.why}); M++; }
      else if(opts[parseInt(v,10)].correct){ H++; items.push({t:ex.alerts[ai].title,st:'ok',why:corr.why}); }
      else { W++; items.push({t:ex.alerts[ai].title+' — you chose “'+opts[parseInt(v,10)].t+'”',st:'bad',why:'Best call: '+corr.t+' — '+corr.why}); }
    });
    return {H:H,W:W,N:ex.alerts.length,items:items};
  }};
}};

WIDGETS.branch={build:function(ex,host){
  var wrap=el('div');
  var picks=[];
  var doneAll=false;
  ex.steps.forEach(function(st,si){
    var box=el('div','artefact');
    box.innerHTML='<span class="artefact-head">STEP '+(si+1)+' OF '+ex.steps.length+' — '+st.label+'</span><div class="artefact-body"><p>'+st.text+'</p></div>';
    if(si>0)box.classList.add('hidden');
    var og=el('div','opts'); og.style.margin='8px 4px';
    var ogLocal=og;
    shuffle(st.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
      var b=optButton(p.o,p.i,false);
      b.addEventListener('click',function(){
        if(b.disabled)return;
        Array.prototype.forEach.call(ogLocal.children,function(c){c.disabled=true;});
        picks[si]={o:b._o,ok:!!b._o.correct};
        var rec=el('div','dnd-hint','<span style="color:var(--accent-green)">✓ Recorded</span> — your choice for step '+(si+1)+' is locked. It is graded together with the other steps when you press Check.');
        box.appendChild(rec);
        if(si+1<ex.steps.length){ ex.steps[si+1]._box.classList.remove('hidden'); }
        else { doneAll=true; var cb2=$('#btnCheck'); if(cb2)cb2.disabled=false; }
      });
      ogLocal.appendChild(b);
    });
    box.appendChild(og);
    st._box=box;
    wrap.appendChild(box);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Answer every step. Only the final Check grades the whole chain and pauses the timer.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    ex.steps.forEach(function(st,si){
      var p=picks[si];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      if(!p){ items.push({t:st.label,st:'miss',why:'Not answered. Correct: '+corr.t}); return; }
      if(p.ok){ H++; items.push({t:st.label,st:'ok',why:corr.why}); }
      else { W++; items.push({t:st.label+' — you chose “'+p.o.plainText+'”',st:'bad',why:'Correct: '+corr.t+' — '+corr.why}); }
    });
    return {H:H,W:W,N:ex.steps.length,items:items};
  }};
}};

/* store plain text of branch options for feedback */
var _origOptButton=optButton;
optButton=function(o,idx,multi){ var b=_origOptButton(o,idx,multi); var d=el('div',null,o.t); o.plainText=d.textContent.replace(/\s+/g,' ').trim(); return b; };

/* ---------------- grading + feedback ---------------- */
function gradeCurrent(ex){
  var host=$('#ansBody');
  return host._grade ? host._grade() : {H:0,W:0,N:1,items:[{t:'No answer',st:'bad',why:''}]};
}
function renderFeedback(ex,g,credit){
  var lab=creditLabel(credit,g.N);
  var fb=el('div','fb '+lab.cls); fb.id='fbBlock';
  var head='<span class="bh-ic">'+lab.ic+'</span> '+lab.word;
  if(g.N>1) head+='<span class="fb-credit"> — credit '+credit.toFixed(2)+' ('+fmtCreditItems(g,credit)+')</span>';
  else head+='<span class="fb-credit"> — credit '+credit.toFixed(2)+'</span>';
  if(S.hinted[S.order[S.idx]]) head+='<span class="fb-credit"> · includes −0.10 hint penalty</span>';
  fb.appendChild(el('div','fb-head',head));
  var body=el('div','fb-body');
  var ul=el('ul','fbitems');
  var ICON={ok:['✓','Correct'],bad:['✗','Wrong'],miss:['○','Missed']};
  g.items.forEach(function(it){
    var st=ICON[it.st]||ICON.miss;
    ul.appendChild(el('li','fbitem st-'+it.st,'<span class="fi-ic">'+st[0]+'</span><span><b>'+st[1]+'</b> — '+it.t+'. <span class="fi-why">'+it.why+'</span></span>'));
  });
  body.appendChild(ul);
  if(g.danger){ body.appendChild(el('div','fb-danger','✗ DANGEROUS — NEAR MISS: your command would change state. In a real incident it could destroy evidence. '+g.danger.why)); }
  if(ex.type==='terminal'&&ex.canonical){
    var c=el('div','canon');
    var ct='<span class="canon-t">✓ Canonical command <button class="collapser" id="cpBtn" aria-label="Copy the canonical command">⧉ Copy</button></span><pre>'+ex.canonical.replace(/</g,'&lt;')+'</pre>';
    c.innerHTML=ct;
    if(ex.parts&&ex.parts.length){
      var pl=el('ul','canon-parts');
      ex.parts.forEach(function(p){ pl.appendChild(el('li',null,'<b>'+p.label+'</b> — '+p.why)); });
      c.appendChild(pl);
    }
    body.appendChild(c);
    var cb=c.querySelector('#cpBtn');
    if(cb)cb.addEventListener('click',function(){
      try{ navigator.clipboard.writeText(ex.canonical); cb.textContent='✓ Copied'; }catch(e){ cb.textContent='Select and copy manually'; }
    });
  }
  body.appendChild(el('div','fb-why','<span class="why-t">Why — in plain words</span>'+ex.explain));
  if(credit<1&&ex.study){ body.appendChild(el('div','study-tip','<b>What to study:</b> '+ex.study)); }
  fb.appendChild(body);
  var nav=$('#exNav');
  nav.parentNode.insertBefore(fb,nav);
  var chk=$('#btnCheck'); if(chk)chk.disabled=true;
  var sk=$('#tbSkip'); if(sk)sk.disabled=true;
  var hb=$('#tbHint'); if(hb)hb.disabled=true;
  var nx=$('#btnNext'), fin=$('#btnFinal');
  var last=(S.idx>=totalAnswerable()-1);
  var skippedLeft=S.skipped.filter(function(id){return !(id in S.credits);}).length;
  if(last){
    if(skippedLeft>0&&S.timer.state!=='ENDED'){ nx.classList.remove('hidden'); }
    else { fin.classList.remove('hidden'); }
  } else { nx.classList.remove('hidden'); }
  fb.scrollIntoView({block:'nearest'});
}
function fmtCreditItems(g,credit){
  var got=0; g.items.forEach(function(it){ if(it.st==='ok')got++; });
  return got+'/'+g.N+' items, credit '+credit.toFixed(2);
}

/* ---------------- review skipped ---------------- */
function showReview(){
  S.reviewMode=false;
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  var v=$('#reviewView'); v.innerHTML='';
  v.appendChild(el('h1',null,'Review skipped exercises'));
  var left=S.skipped.filter(function(id){return !(id in S.credits);});
  var t=S.timer;
  if(t.state==='ENDED'){
    v.appendChild(el('p','tb-sub','⏱ <b style="color:var(--state-incorrect)">■ The timer has ENDED.</b> Unanswered and skipped exercises are excluded from the score.'));
    var b0=el('button','btn btn-primary','⏹ Final Submit'); b0.addEventListener('click',onFinalSubmit); v.appendChild(b0);
    showView('reviewView'); return;
  }
  v.appendChild(el('p','tb-sub','▶ The timer is still RUNNING ('+fmtT(t.remaining)+' left). You can return to every skipped exercise as many times as you need until the timer ends. ⚠ Skipped exercises left unanswered are excluded from the score.'));
  if(left.length===0){
    v.appendChild(el('p',null,'✓ No skipped exercises are waiting. You can submit the exam.'));
  } else {
    left.forEach(function(id){
      var ex=EXAM.exercises[id];
      var it=el('div','rv-item');
      it.innerHTML='<span class="rv-ic">⚠ Skipped</span><span class="rv-t">'+(id+1)+'. '+ex.summary+'</span>';
      var b=el('button','btn btn-go','Answer');
      b.setAttribute('aria-label','Return to skipped exercise: '+ex.summary);
      b.addEventListener('click',function(){ S.reviewMode=true; S.idx=id; showView('examView'); renderEx(); });
      it.appendChild(b); v.appendChild(it);
    });
  }
  var sub=el('button','btn btn-primary','⏹ Final Submit');
  sub.style.marginTop='14px';
  sub.addEventListener('click',onFinalSubmit);
  v.appendChild(sub);
  showView('reviewView');
}

/* ---------------- results ---------------- */
function openResults(timeout){
  setState('ENDED'); if(S._int)clearInterval(S._int); showVeil(false);
  var v=$('#resultsView'); v.innerHTML='';
  var ls=liveScore();
  var answered=ls.cnt, sum=ls.sum;
  var percent=answered>0?Math.round(sum/answered*100):0;
  var passed=percent>=META.passMark;
  var full=0,part=0,partSum=0,bad=0;
  for(var k in S.credits){ var c=S.credits[k]; if(c>=1)full++; else if(c>0){part++;partSum+=c;} else bad++; }
  var skipped=S.order.length-answered;
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' — results'));
  hero.appendChild(el('div','res-big '+(passed?'':''),percent+'%'));
  hero.appendChild(el('p','res-line','✓ '+(passed?'PASS':'✗ FAIL')+' — pass mark is '+META.passMark+'%. Score computed only over answered exercises ('+answered+' of '+S.order.length+').'));
  if(S.username)hero.appendChild(el('p','res-line','Candidate: '+S.username));
  if(timeout)hero.appendChild(el('p','res-line','⏱ The timer ran out. Exercises never answered were excluded from the score.'));
  v.appendChild(hero);
  var grid=el('div','res-grid');
  function cell(cls,n,lbl){ grid.appendChild(el('div','res-cell '+cls,'<div class="rn">'+n+'</div><div class="rl">'+lbl+'</div>')); }
  cell('c-ok',full,'✓ Fully correct');
  cell('c-part',part,'✓ Partially correct'+(part>0?' · avg '+(partSum/part).toFixed(2):''));
  cell('c-bad',bad,'✗ Fully incorrect');
  cell('c-skip',skipped,'⚠ Skipped — excluded');
  v.appendChild(grid);
  var tg=el('div','time-grid');
  function tcell(l,val){ tg.appendChild(el('div','time-cell',l+' <b>'+val+'</b>')); }
  tcell('Time left on the clock:',fmtT(S.timer.remaining));
  tcell('Time paused manually:',fmtT(S.pausedManualSec));
  tcell('Time paused for feedback review:',fmtT(S.pausedAutoSec));
  v.appendChild(tg);
  var ret=el('button','btn btn-go','↻ Retake Exam');
  ret.style.cssText='margin-top:18px;min-width:220px;min-height:48px;font-weight:700;';
  ret.setAttribute('aria-label','Retake the exam — questions and answers are reshuffled');
  ret.addEventListener('click',retake);
  v.appendChild(ret);
  v.appendChild(el('p','footer-note',passed?'✓ PASS — your result was reported to the site (once for this attempt).':'✗ FAIL — retake the exam. On retake, the exercise order and answer choices are shuffled again.'));
  showView('resultsView');
  if(!S.reportFired){ S.reportFired=true; reportScore(sum,answered); }
}

document.body.classList.add('sev-'+META.sevKey);
$('#veilResume').addEventListener('click',onPause);
buildTop();
renderIntro();
showView('introView');
