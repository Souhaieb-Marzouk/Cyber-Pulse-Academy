.res-row .rr-ico { flex: 0 0 1.6em; font-weight: 800; }
.res-row .rr-cred { margin-left: auto; font-family: var(--font-mono); color: var(--text-secondary); }

/* ---------- hint ---------- */
.hintbox { border: 1px solid var(--accent-amber); border-left: 4px solid var(--accent-amber); background: color-mix(in srgb, var(--accent-amber) 8%, var(--bg-surface-2)); border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 10px 0; font-size: 0.93rem; }
.hintbox .hb-label { font-weight: 800; color: var(--accent-amber); }

/* ---------- misc ---------- */
.ex-meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.ex-num { font-family: var(--font-mono); font-weight: 800; color: var(--sev-current); }
.fade-in { animation: fadein 0.25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.tbl th { background: var(--bg-surface-2); color: var(--text-secondary); }
@media (max-width: 640px) { .wrap { padding: 12px 12px; } .block-body { padding: 12px; } body { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) {
  .progress .fill { animation: none; }
  .fade-in { animation: none; }
  * { transition: none !important; }
}

window.EX_DATA = {"meta": {"topicId": "t1547.006", "batch": 3, "title": "T1547.006 Kernel Modules and Extensions — HARD", "difficulty": "hard", "questionCount": 16, "estimatedMinutes": 50, "passMark": 70, "sev": "HARD", "sevWord": "HARD", "objId": "T1547.006", "objName": "Kernel Modules and Extensions", "objType": "Sub-Technique", "examTitle": "T1547.006 — HARD practice exam", "page_title": "T1547.006 — HARD practice exam", "timerMinutes": 55}, "intro": {"learn": ["This is the HARD tier for MITRE ATT&CK T1547.006 — Kernel Modules and Extensions, the sub-technique of T1547 (Boot or Logon Autostart Execution) where attackers put code inside the Linux kernel (Loadable Kernel Modules) or the macOS kernel (kexts). By now you know what the technique is. Here you learn the judgement that separates an experienced analyst from a script-follower: telling near-identical answers apart, spotting the alarm that is actually benign, and catching the quiet thing that is actually a kernel rootkit.", "Real work is rarely one clean fact. It is a stack of artefacts: an lsmod snapshot that disagrees with /sys/module, an auditd record at 03:11, a package database that says 'not mine', a vendor that says 'probably ours'. In this file you will correlate two to four artefacts per exercise, and the obvious answer will be wrong in about a third of them — on purpose. You will meet the four procedure examples ATT&CK lists for this technique: Drovorub (S0502, used by Russian GRU 85th GTsSS per the NSA/FBI advisory), the signed kernel rootkit of Operation CuckooBees (C0012, Winnti tooling), REPTILE (S1219, an LKM rootkit linked to UNC3886 espionage operations) and Skidmap (S0468, crypto-mining rootkit).", "You will also practise the defensive craft: choosing the right verification command (and knowing which near-miss command would have destroyed evidence or broken production), writing auditd rules with the correct architecture filter, mapping the four mitigations (M1049, M1038, M1026, M1018) to the right platform, and sequencing incident response so the memory image is captured before anyone reboots the box.", "Expect professional wording, terse scenarios, and feedback that explains WHY each near-miss is wrong for THIS case and right for some other case. That discrimination — not recall — is the skill this tier builds. Take the time the timer gives you, use the explanation pauses, and read every artefact panel before answering."], "keywords": [{"theme": "Triage discrimination", "items": ["package-owned module vs unowned module", "DKMS/legit driver look-alikes", "benign-but-alarming and alarming-but-benign patterns", "lsmod vs /sys/module count mismatch"]}, {"theme": "Verification tooling", "items": ["rpm -qf (package ownership on RHEL)", "modinfo signer field", "lsmod piped through grep", "rpm -V package verification", "chkrootkit and rkhunter (M1049)"]}, {"theme": "Auditd detection craft", "items": ["arch=b32 vs arch=b64 near-miss", "init_module / finit_module / delete_module syscalls", "-k tag for ausearch", "repeated non-root load attempts (AN1243)"]}, {"theme": "Attribution anchors", "items": ["Drovorub (S0502) — GRU 85th GTsSS, NSA/FBI advisory", "Operation CuckooBees (C0012) — signed kernel rootkit, Winnti", "REPTILE (S1219) — LKM rootkit, UNC3886", "Skidmap (S0468) — mining rootkit"]}, {"theme": "Response discipline", "items": ["volatile evidence before state changes", "why rmmod is usually the wrong first move", "mitigation-to-platform mapping (M1018 macOS, M1038 Linux)", "least-aggressive correct action"]}], "how": ["Pass mark: 70%, computed only over exercises you answered. Skipped-and-never-answered exercises are excluded.", "Exercise types: single choice, multi-select, drag & drop, matching, fill the blank, ordering, one branching decision scenario, a log-viewer analysis, and TWO terminal exercises. The terminals test different skills (package ownership; a read-only pipeline) and sit apart from each other.", "Hard means near-misses: at least two options per exercise are defensible in some other context. Your job is to find the one that is right HERE.", "Partial credit applies to every multi-answer exercise: (correct − wrong) / total. Wrong placements and wrong flags subtract. Read options carefully before committing.", "Timer: 55 minutes, countdown in the header. Pause hides the exercise for a break. Check stops the timer automatically so you can study the feedback without pressure; it resumes on Next.", "One hint per exercise costs 10% of that exercise's credit. Skip freely; the review screen lets you answer skipped items until the timer ends.", "Press Start when you are ready. Read every artefact panel — the devil is in the timestamps."]}, "exercises": [{"id": "h01", "type": "qcm", "title": "The 02:14 kernel module load", "lead": "You are the SOC duty analyst. Alert SIEM-55812 fired on build-runner-05 (RHEL 8): a kernel module load outside business hours. Three artefacts are in the alert envelope. The obvious call is 'compromise' — check the artefacts first.", "scenario": [{"label": "ARTEFACT 1 — auditd record", "kind": "log", "viewer": true, "name": "auditd — build-runner-05", "lines": ["2026-03-19T02:14:03.771Z node=build-runner-05 type=SYSCALL msg=audit(1773900843.771:8841): arch=c000003e syscall=316 success=yes exit=0 a0=3 a1=7ffd ppid=1180 auid=4311 uid=0 euid=0 comm=modprobe exe=/usr/sbin/modprobe key=lkm_watch", "2026-03-19T02:14:03.802Z node=build-runner-05 type=PROCTITLE proctitle=646B6D73 bash", "2026-03-19T02:14:03.810Z node=build-runner-05 type=PATH name=/lib/modules/4.18.0-553.el8.x86_64/extra/vboxdrv.ko"]}, {"label": "ARTEFACT 2 — package query", "kind": "code", "lines": ["# rpm -qf /lib/modules/4.18.0-553.el8.x86_64/extra/vboxdrv.ko", "virtualbox-kmod-7.0.18-1.el8.x86_64"]}, {"label": "ARTEFACT 3 — change ticket CHG-77120", "kind": "prose", "body": "Approved change: install VirtualBox kernel modules on build-runner-05 for the QA automation project. Requested by: qa-team. Window: 2026-03-19 22:00 → 2026-03-20 04:00. Implementation note from qa-team: 'the module builds and loads when the first VM starts, timing depends on queue'."}], "question": "What is the best call for alert SIEM-55812?", "options": [{"t": "Benign: package-owned module, loaded by an approved change; confirm with the QA team and close as expected", "c": true, "why": "All three artefacts line up: package owner, approved change, load mechanism documented."}, {"t": "Malicious: the 02:14 timestamp is outside the change window, so escalate as P1", "c": false, "why": "The window actually covers 22:00–04:00 — 02:14 is INSIDE it. Read the artefact again."}, {"t": "Contain: unload the module with rmmod until the QA team confirms", "c": false, "why": "Unloading a package-owned module breaks the approved work and adds risk without evidence gain."}, {"t": "Harden: allowlist every future module load on this host to silence the alert source", "c": false, "why": "Blanket allowlisting removes the very visibility that caught this load."}], "hint": "Convert the change window into clock time before judging the timestamp. Then check who owns the file.", "expl": "This is the 'looks alarming but is benign' pattern: out-of-hours load + kernel module + root. The package query shows vboxdrv.ko is owned by virtualbox-kmod, the ticket is approved, and — the near-miss — 02:14 IS inside the 22:00–04:00 window. The 'P1 outside window' option is the deliberate trap for people who skim. Defender view: this is exactly what AN1243's baseline-and-provenance logic is for: package ownership plus change context turns a scary alert into a closed ticket in minutes. Attacker view: real operators avoid package-owned files and approved windows — both are hostile terrain for them.", "study": "AN1243 provenance checks — package ownership and change-context correlation"}, {"id": "h02", "type": "multi", "title": "Which indicators actually hold water?", "lead": "You are building the severity matrix for module-load alerts. Some signals are strong; some look technical but mean nothing on their own.", "scenario": [{"label": "Working notes", "kind": "prose", "body": "Five candidate indicators came out of a brainstorm. Mark the ones that genuinely support 'suspect kernel module activity' on a Linux server, and reject the weak ones — no matter how technical they sound."}], "question": "Select every indicator that genuinely supports suspect kernel-module activity.", "options": [{"t": "A .ko file sits in /tmp and insmod was attempted against it by a non-root account", "c": true, "why": "Wrong location plus wrong user: AN1243 flags repeated non-root load attempts, and /tmp is no place for a module."}, {"t": "A loaded module's file is not owned by any installed package", "c": true, "why": "Package provenance is the standard baseline; unowned equals unexplained."}, {"t": "lsmod prints 42 modules while /sys/module contains 43 directories", "c": true, "why": "The count delta means one module is hidden from the user-space view — classic rootkit."}, {"t": "CPU is high during the nightly backup window", "c": false, "why": "Backups are CPU-heavy by design. No kernel linkage."}, {"t": "A new SSH login appeared from the operations network", "c": false, "why": "Routine ops access. It says nothing about kernel modules."}], "hint": "Strong indicators touch the kernel, the module files, or the package baseline. Crowd noise does not.", "expl": "Three strong indicators: non-root load attempts (AN1243 names this exact pattern), unowned module files (provenance), and the lsmod vs /sys/module delta (hiding). The two weak ones are volume and access noise — they correlate with nothing about T1547.006. Building severity on weak indicators burns out your on-call; building it on these three catches both sloppy attackers (who load from /tmp) and careful ones (whose hiding leaves the /sys/module delta).", "study": "AN1243 signal list; lsmod vs /sys/module discrepancy checks"}, {"id": "h03", "type": "drag", "title": "Right check for the right signal", "lead": "Your junior analyst escalates everything to IR 'to be safe'. You are coaching them: each signal has ONE cheapest next check that decides the path.", "scenario": [{"label": "Coaching board", "kind": "prose", "body": "Five signals, five verification moves. Match them. The cheapest decisive check comes before the expensive forensic one — that is how you keep IR queues short."}], "question": "Drag each signal onto the best next check for it.", "bank": [{"id": "i0", "t": "signal: a new module load event fired", "why": "First discriminator for any load: does any package own this file?"}, {"id": "i1", "t": "signal: the module file is not in the package database", "why": "Next: metadata and hash — who signed it, what does it claim to be?"}, {"id": "i2", "t": "signal: modinfo shows signer Unknown and the hash is unknown", "why": "Now it is forensic: capture memory and escalate — assume hostile."}, {"id": "i3", "t": "signal: an approved enterprise kext loaded on macOS", "why": "Compare against the MDM allowlist before anything else."}, {"id": "i4", "t": "signal: kextload attempt was rejected by policy", "why": "Rejected loads are phishing-bucket material: collect the installer, alert the allowlist owner."}], "slots": [{"label": "Check package ownership of the .ko file", "accept": ["i0"]}, {"label": "Check hash and signer with modinfo", "accept": ["i1"]}, {"label": "Capture memory and escalate to IR", "accept": ["i2"]}, {"label": "Verify against the MDM kext allowlist", "accept": ["i3"]}], "hint": "Escalation is the LAST check, not the first. And macOS has its own allowlist path.", "expl": "The escalation ladder: package ownership (seconds) → hash/signer (minutes) → memory capture + IR (hours, only when provenance fails). The macOS rows follow the same logic with the MDM allowlist and, for rejected loads, the phishing bucket — a rejected kextload still tells you someone tried, which is AN1244 signal territory. Junior analysts who escalate at step 0 flood IR; analysts who skip straight to 'wipe it' destroy the evidence IR needs.", "study": "the module triage escalation ladder"}, {"id": "h04", "type": "terminal", "title": "Prove who owns the file (RHEL)", "lead": "RHEL 8 host db-sync-01. A colleague flags /lib/modules/4.18.0-553.el8.x86_64/extra/suspect.ko as 'probably malicious'. Before ANY action, you must prove whether the installed package database knows this file.", "scenario": [{"label": "Environment card", "kind": "prose", "body": "OS: Red Hat Enterprise Linux 8 (rpm-based — there is no dpkg here). You have root. The host is live. Your command must ANSWER 'which package owns this file' — nothing more, nothing destructive. The tool is not named for you: pick it."}, {"label": "Artefact — the file under test", "kind": "code", "lines": ["/lib/modules/4.18.0-553.el8.x86_64/extra/suspect.ko"]}], "question": "Type the one command that prints which installed package (if any) owns suspect.ko, then press Enter and Check.", "term": {"title": "simulated shell — nothing real is executed", "prompt": "[root@db-sync-01 ~]#", "banner": ["RHEL 8.9 (Ootpa) db-sync-01", "Training shell — read-only simulation"], "notFound": "command not found — this host is rpm-based", "simOut": [{"re": "rpm[\\s\\S]*-qf[\\s\\S]*suspect\\.ko", "out": ["file /lib/modules/4.18.0-553.el8.x86_64/extra/suspect.ko is not owned by any package"]}, {"re": "rpm[\\s\\S]*-ql[\\s\\S]*suspect\\.ko", "out": ["package suspect.ko is not installed"]}], "simFail": [{"re": "\\bdpkg\\b", "out": "bash: dpkg: command not found — this host is rpm-based"}, {"re": "\\brpm\\s+(-e|--erase)\\b", "out": "REFUSED in training: package removal is a state change."}], "expect": [{"el": "uses rpm — the RHEL package manager", "re": "\\brpm\\b", "why": "On RHEL, package ownership questions go to rpm."}, {"el": "uses the -qf flag (query file owner)", "re": "-qf", "why": "-qf asks: which package owns THIS file? -ql lists a package's files — the near-miss."}, {"el": "targets the suspect.ko path", "re": "suspect\\.ko", "why": "The query must name the exact file under test."}], "traps": [{"re": "\\brpm\\s+(-e|--erase)\\b", "note": "rpm -e REMOVES a package — a state change during triage."}, {"re": "\\brpm\\s+-ql\\b", "note": "rpm -ql lists files OF a package; it cannot identify the owner of a file. Near-miss flag."}, {"re": "\\bdpkg\\b|\\bdpkg -S\\b", "note": "dpkg belongs to Debian-family hosts; this is RHEL."}], "canonical": "rpm -qf /lib/modules/4.18.0-553.el8.x86_64/extra/suspect.ko", "canonExpl": ["rpm — Red Hat's package manager query tool.", "-qf <file> — 'query file': print the package that owns the given file, or say none does.", "The path — the module file under test. Read-only; the host is not modified.", "Expected answer here: 'not owned by any package' — which upgrades the file's suspicion level."]}, "hint": "Two similar rpm flags exist: one lists a package's files, the other names a file's owner. You need the owner.", "expl": "rpm -qf <path> answers 'which package owns this file' — here: none, which moves the file from 'maybe fine' to 'unexplained kernel code'. The near-misses are real commands people grab under pressure: rpm -ql lists a package's files (needs a package name, not a file), dpkg -S is the Debian equivalent (wrong OS), and rpm -e would erase a package — a triage felony. This ownership check is the provenance step of AN1243 verification and decides whether the next step is 'close ticket' or 'capture memory'.", "study": "rpm -qf vs rpm -ql; package provenance for module files"}, {"id": "h05", "type": "match", "title": "Match the tool to its signature", "lead": "Threat-intel wall exercise. Four entries from the T1547.006 procedure examples table — match each to the one-line signature your team should remember.", "scenario": [{"label": "Procedure examples table (T1547.006)", "kind": "code", "lines": ["S0502  Drovorub              kernel modules to establish persistence", "C0012  Operation CuckooBees  signed kernel rootkit for additional persistence", "S1219  REPTILE               rootkit implemented as a loadable kernel module", "S0468  Skidmap               installs several loadable kernel modules"]}, {"label": "Attribution notes", "kind": "prose", "body": "Drovorub: NSA/FBI advisory, Russian GRU 85th GTsSS. CuckooBees: Cybereason reporting on Winnti techniques. REPTILE: linked to UNC3886 espionage operations. Skidmap: Linux malware using rootkit capabilities to hide a cryptocurrency-mining payload."}], "question": "Match each software entry to its signature line.", "pairs": [{"l": "Drovorub (S0502)", "r": "GRU 85th GTsSS toolset; kernel module persistence that hides processes, files and network activity", "why": "The NSA/FBI advisory's headline: hidden, kernel-based, multi-feature."}, {"l": "Operation CuckooBees (C0012)", "r": "Winnti-linked activity using a signed kernel rootkit for extra persistence", "why": "The distinctive part: they abused a VALID signature."}, {"l": "REPTILE (S1219)", "r": "LKM rootkit linked to UNC3886 espionage operations", "why": "Open-source rootkit lineage, espionage context."}, {"l": "Skidmap (S0468)", "r": "crypto-mining malware that installs several LKMs to hide its miner", "why": "Monetised hiding: the modules protect the miner."}], "hint": "One is state-attributed, one abused signatures, one is espionage open-source, one mines coins.", "expl": "Four different motives, one technique: intelligence (Drovorub, REPTILE/UNC3886), IP theft with surgical stealth (CuckooBees — note the SIGNED rootkit, which defeats naive signature distrust), and money (Skidmap). For detection anchoring: Drovorub teaches netflow-based hunting because it hides from the host; CuckooBees teaches that 'it is signed' is not 'it is safe'; REPTILE teaches public rootkit code reuse; Skidmap teaches that miners plus rootkits come as a bundle. Attribution goes in the report AFTER the evidence — not instead of it.", "study": "the Procedure Examples table on T1547.006 plus its reference set"}, {"id": "h06", "type": "drag", "title": "Mitigations: which platform, which lever", "lead": "You are assigning controls in a hybrid estate: 400 RHEL servers, 900 Mac laptops. The four ATT&CK mitigations do not apply symmetrically.", "scenario": [{"label": "Estate notes", "kind": "prose", "body": "M1049 (rootkit scanners rkhunter/chkrootkit) and M1038 (SELinux, grsecurity MODHARDEN, kernel tuning) are Linux-flavoured on this page. M1018 (MDM kext policy, com.apple.syspolicy.kernel-extension-policy) is macOS-only. M1026 (limit root/privilege separation) is universal."}], "question": "Drag each mitigation onto the platform slice it belongs to.", "bank": [{"id": "i0", "t": "M1018 — MDM kext policy (kernel-extension-policy)", "why": "MDM is the macOS control plane."}, {"id": "i1", "t": "M1038 — SELinux / grsecurity MODHARDEN / kernel tuning", "why": "Linux kernel-level load restriction."}, {"id": "i2", "t": "M1026 — privilege separation, limit root", "why": "Both platforms need root to load; both benefit."}, {"id": "i3", "t": "M1049 — rkhunter / chkrootkit scanning", "why": "Linux rootkit scanners per the ATT&CK page."}], "slots": [{"label": "macOS slice", "accept": ["i0"]}, {"label": "Linux slice", "accept": ["i1", "i3"]}, {"label": "Both platforms", "accept": ["i2"]}], "hint": "MDM only speaks Apple. rkhunter and SELinux only speak Linux. Root is root everywhere.", "expl": "Platform-aware control mapping is what separates a real hardening plan from a wish list: M1018 via MDM on the Mac fleet, M1038 and M1049 on the RHEL estate, and M1026 everywhere because every load needs root. The near-miss is dumping M1038 onto macOS or expecting rkhunter on a Mac — wrong tool, wrong platform. Cost note: M1038's strictest forms (refusing all unsigned loads) break DKMS/third-party drivers, so scope it to the servers that can afford it.", "study": "mitigation-platform fit for T1547.006"}, {"id": "h07", "type": "fill", "title": "The non-root load attempts", "lead": "secure log on app-14 shows a pattern repeating every few minutes. Your analytic template has two blanks describing the AN1243 signal and why it matters.", "scenario": [{"label": "ARTEFACT — /var/log/secure on app-14", "kind": "log", "viewer": true, "name": "app-14 secure log", "lines": ["2026-03-21T01:12:44Z app-14 insmod: load of /tmp/ngg.ko denied for uid=1001(deploy): Operation not permitted", "2026-03-21T01:13:02Z app-14 insmod: load of /tmp/ngg.ko denied for uid=1001(deploy): Operation not permitted", "2026-03-21T01:14:11Z app-14 insmod: load of /tmp/ngg.ko denied for uid=1001(deploy): Operation not permitted", "2026-03-21T01:15:40Z app-14 sudo: deploy : command not allowed ; TTY=pts/1 ; COMMAND=/usr/sbin/insmod /tmp/ngg.ko"]}, {"label": "Template", "kind": "prose", "body": "AN1243 names this signal: repeated module load attempts under ______ users. The denials also prove the account did NOT have ______ privileges."}], "question": "Fill both blanks to complete the detection note.", "sentence": "Repeated module load attempts under {} users — and the denials prove the account lacked {} privileges.", "blanks": [{"accept": "non[- ]?root|unprivileged|nonroot", "disp": "non-root", "why": "AN1243: 'repeated module load attempts under non-root users'."}, {"accept": "root|administrator|admin", "disp": "root", "why": "Only root can load modules; the denial is the control working."}], "hint": "First blank: what AN1243 calls the user class. Second blank: what the 'Operation not permitted' proves was missing.", "expl": "The log shows the deploy account hammering insmod with /tmp/ngg.ko — four denials and a blocked sudo. Blanks: non-root, and root. Two conclusions: the control worked (denied), and the behaviour is hostile (repetition, /tmp path). Attacker view: they were testing how far the account reached — likely pre-escalation. Defender view: this is an AN1243 textbook signal worth a P2 even though nothing loaded; the account needs review, and /tmp should never hold a .ko. The near-miss answer 'root' for blank one fails because the denials literally show it was NOT root.", "study": "AN1243 — repeated load attempts under non-root users"}, {"id": "h08", "type": "qcm", "title": "EDR says clean. Netflow disagrees.", "lead": "prod-app-07. Your EDR console: zero alerts, no new files, lsmod normal. Netflow: every 300 seconds, an encrypted session to 185[.]213[.]154[.]87:443 with a fixed 1.2 KB up / 8 KB down rhythm. The pattern matches the Drovorub C2 profile in the NSA/FBI advisory. Nothing on the host explains it.", "scenario": [{"label": "ARTEFACT 1 — EDR console", "kind": "code", "lines": ["prod-app-07: no detections (7 days)", "no unsigned drivers, no new services, lsmod baseline: match"]}, {"label": "ARTEFACT 2 — netflow extract", "kind": "log", "viewer": true, "name": "netflow — prod-app-07", "lines": ["2026-03-22T03:00:00Z prod-app-07 -> 185[.]213[.]154[.]87:443 tcp up=1208B down=8192B", "2026-03-22T03:05:00Z prod-app-07 -> 185[.]213[.]154[.]87:443 tcp up=1208B down=8192B", "2026-03-22T03:10:00Z prod-app-07 -> 185[.]213[.]154[.]87:443 tcp up=1208B down=8192B"]}, {"label": "ARTEFACT 3 — NSA/FBI Drovorub advisory (excerpt)", "kind": "prose", "body": "Drovorub's kernel module can hide files, processes and network activity from host-based tools. The advisory recommends network flow analysis as a detection method precisely because the host's own view cannot be trusted."}], "question": "What is the most likely explanation?", "options": [{"t": "A kernel module is hiding itself from host tools; the network rhythm is the best evidence you have", "c": true, "why": "Ring-0 hiding blinds EDR and lsmod; independent network telemetry still sees the beacon."}, {"t": "The netflow collector is duplicating records every five minutes", "c": false, "why": "Duplication does not invent a matching C2 profile, fixed sizes and a live destination."}, {"t": "A scheduled software update runs every five minutes", "c": false, "why": "Updates hit vendor endpoints, not a fixed-size beacon to an unrelated IP."}, {"t": "lsmod is complete, so a hidden module is impossible", "c": false, "why": "lsmod reads what the kernel SHOWS it — a rootkit filters exactly that view."}], "hint": "Which of the two sensors — EDR on the host, or netflow outside the host — can a kernel rootkit reach?", "expl": "The alarming thing looks benign (EDR clean) and the quiet thing is the alarm: a hidden kernel module. Drovorub's module hides its network activity from the host, so the ONLY clean view is outside the box — netflow. This is why the NSA/FBI advisory recommends flow analysis against Drovorub. The near-miss 'lsmod is complete' is the trap: hiding from lsmod is the definition of this rootkit class. Next steps: out-of-band verification, memory capture, containment planning — never trust the host's own tools while a Ring-0 suspect stands.", "study": "Drovorub detection via netflow; host-tool blindness under kernel rootkits"}, {"id": "h09", "type": "sim", "title": "Four decisions on prod-db-01", "lead": "prod-db-01: /sys/module holds 43 entries; lsmod prints 42. One module is hiding from user space. You are leading the response; every choice changes the next step.", "scenario": [], "question": "Lead the response. Confirm each step and live with the consequence before the next.", "steps": [{"scen": "Step 1 — The delta is confirmed by two analysts. The host is live and serving.", "q": "First action?", "options": [{"t": "Capture volatile evidence: /proc/modules list and a memory image", "c": true, "why": "The hidden module lives in RAM; evidence before any state change.", "cont": "Memory image secured to the evidence mount. Kernel analysis confirms syscall-table hooking. Good — you have proof that survives anything."}, {"t": "rmmod the 43rd module — it will fail anyway, but try", "c": false, "why": "You touched the system before capturing evidence, and hidden modules often block removal.", "cont": "rmmod: 'Module is in use'. The module noticed the attempt. Some logs went quiet."}, {"t": "Reboot to clear it, then scan", "c": false, "why": "A reboot destroys the memory image — the single most valuable artefact for a rootkit case.", "cont": "The host came up clean-looking. The module loads again at boot — and your proof evaporated."}, {"t": "Ask the database admin to look into it", "c": false, "why": "A kernel rootkit is not a DBA task, and you just tipped off the box's main user.", "cont": "The DBA 'checked quickly' and found nothing. Of course: their tools are blind below the kernel."}]}, {"scen": "Step 2 — Memory analysis shows syscall hooking. On disk, /lib/modules/.../nvme_core.ko was replaced three days ago. The kernel package normally owns nvme_core.ko.", "q": "Next verification?", "options": [{"t": "Compare the on-disk file's hash with the pristine copy from a clean mirror of the same kernel package", "c": true, "why": "Package-vs-disk hash difference proves tampering with a package-owned file.", "cont": "Hashes differ. rpm -V confirms size and digest mismatch on nvme_core.ko. Tampering is now proven, not suspected."}, {"t": "Trust the EDR — it never flagged the file", "c": false, "why": "The kernel is hostile; EDR agents run in user space and can be blinded.", "cont": "You wrote 'EDR clean' in the ticket. The analysts who replaced the file celebrated quietly."}, {"t": "Reinstall the kernel package over the file to fix it", "c": false, "why": "Fixing overwrites your only on-disk specimen — preserve first, repair later.", "cont": "The pristine file replaced the specimen. Now nobody can prove what the implant did."}, {"t": "Compare it with the file on a random other server", "c": false, "why": "Other servers may have different kernel patch levels — that comparison proves nothing either way.", "cont": "The other server runs an older kernel. Your 'difference' is a patch level, not an implant."}]}, {"scen": "Step 3 — Hash mismatch confirmed; the replaced module is signed with an unknown key.", "q": "The escalation decision?", "options": [{"t": "Escalate to IR with the evidence bundle: memory image, hashes, timeline, package diffs", "c": true, "why": "Proven tampering with a signed-file replacement is a full incident.", "cont": "INC-3301 opened at P1. IR schedules containment with the DB team within the hour."}, {"t": "Post the hash on your social feed for crowd help", "c": false, "why": "Unreleased incident details leak scope and tip the operator.", "cont": "Someone tipped the operator. The C2 beacon moved to a new port within minutes."}, {"t": "Wait for the next patch cycle", "c": false, "why": "A rootkit will not respect your patch calendar.", "cont": "Patch Tuesday is nine days out. The module made nine days of backups."}, {"t": "Delete the replaced file and move on", "c": false, "why": "Deleting the specimen destroys the case; the loaded module keeps running regardless.", "cont": "File gone, module still in memory. Legal asks what the implant did — nobody can say."}]}, {"scen": "Step 4 — IR asks what must NOT be run on this host while it stays live.", "q": "Which warning do you give?", "options": [{"t": "No user-space cleanup tools on the compromised kernel — their output cannot be trusted", "c": true, "why": "rkhunter, EDR scans, ls-based hunts all run BELOW the rootkit's control.", "cont": "The team agrees: no in-host scanning. All further evidence comes from memory and network views."}, {"t": "Run rkhunter now to document the rootkit", "c": false, "why": "The advisory's caveat applies: rootkits are designed to evade these scanners — and they run on the untrusted kernel.", "cont": "rkhunter: '0 infected'. The report now contains a false clean bill."}, {"t": "Run a full EDR scan and treat clean as exoneration", "c": false, "why": "Same blindness: an agent in user space answers to a hooked kernel.", "cont": "The scan says clean. Meanwhile the beacon re-keyed its encryption."}, {"t": "Log in as root and browse /lib/modules manually", "c": false, "why": "Interactive enumeration on a rootkit host burns time and can trigger tamper logic.", "cont": "Your ls listing showed a clean directory. The hook had already filtered it."}]}], "hint": "The kernel cannot be trusted to tell the truth about itself — every choice follows from that.", "expl": "The chain: capture volatile state first; prove tampering with package-vs-mirror hashes; escalate with a complete bundle; and never trust in-host tools afterwards. Each wrong branch models a real failure: rmmod alerts the operator, reboot kills the memory image, 'EDR clean' is ring-0 blindness, and rkhunter on a hooked kernel is theatre. Attacker view: they replaced a package-owned module with an unknown-signed one and hooked syscalls — bold, detectable only from outside. Defender view: your power comes from evidence you captured BEFORE touching anything.", "study": "volatile-first response for LKM rootkits; package verification with rpm -V"}, {"id": "h10", "type": "order", "title": "Sequence the rootkit response", "lead": "The on-call playbook page for 'suspected LKM rootkit' lost its numbering. Rebuild the order.", "scenario": [{"label": "Playbook cards", "kind": "prose", "body": "Four actions, one correct order. One of them ('remove the module immediately') is NOT on the card — it was removed after the last post-incident review, and for good reason."}], "question": "Drag the actions into the correct order, first to last.", "bank": [{"id": "i0", "t": "Freeze: stop change activity, keep the host powered on", "why": "State changes (including power-off) destroy the very evidence you came for."}, {"id": "i1", "t": "Capture volatile data: /proc/modules, lsmod, network state to the evidence mount", "why": "Fast, safe, ordered before anything that alters the host."}, {"id": "i2", "t": "Acquire a full memory image", "why": "The rootkit lives in RAM; this is the core specimen."}, {"id": "i3", "t": "Take the host out of production and rebuild from a trusted image", "why": "Only after evidence is secured does containment begin."}], "hint": "Nothing that changes state happens before the last card. The host must stay ON until memory is out.", "expl": "Freeze → volatile capture → memory image → rebuild. The deliberately-missing 'rmmod immediately' failed review because it can alert the implant, crash the host, or both — and it buys nothing that the memory image does not give. Each step also preserves the previous: freezing protects the capture, capturing protects the image, imaging protects the rebuild decision. This is the operational side of 'the kernel is untrusted': you take what you need from it quickly, then stop relying on it.", "study": "the freeze → capture → image → rebuild sequence"}, {"id": "h11", "type": "fill", "title": "Name the second scanner", "lead": "You are writing the M1049 section of the incident report and quote the ATT&CK mitigation text verbatim.", "scenario": [{"label": "ATT&CK mitigation text — M1049", "kind": "prose", "body": "Common tools for detecting Linux rootkits include: rkhunter, ______, although rootkits may be designed to evade certain detection tools."}], "question": "Fill the blank with the second tool name from the mitigation text.", "sentence": "The mitigation text names rkhunter and {} as common Linux rootkit scanners.", "blanks": [{"accept": "chkrootkit|chk[- ]?rootkit", "disp": "chkrootkit", "why": "The M1049 text names rkhunter and chkrootkit."}], "hint": "It starts with 'chk' and says exactly what it hunts.", "expl": "chkrootkit is the second named scanner. The report must also carry the ATT&CK caveat: rootkits may be designed to evade these tools — on a host where the kernel is suspect, a clean scan is not evidence of absence (as you saw in the decision scenario). Scanners belong to the PRESENCE side of the house: quick, cheap checks on hosts you still trust.", "study": "M1049 Antivirus/Antimalware — rkhunter and chkrootkit"}, {"id": "h12", "type": "drag", "title": "What does each artefact actually prove?", "lead": "Report writing time. Four artefacts from the prod-db-01 case; four precise conclusions. Overstating a conclusion gets the report bounced.", "scenario": [{"label": "Conclusions to assign", "kind": "prose", "body": "Each artefact supports exactly one of the four conclusions below — no more, no less."}], "question": "Drag each artefact onto the conclusion it actually proves.", "bank": [{"id": "i0", "t": "/proc/modules lists 43 entries; lsmod prints 42", "why": "A visibility delta between two kernel views — the hidden module conclusion."}, {"id": "i1", "t": "modinfo on the replaced file: signer Unknown", "why": "The file itself is not vendor signed — the unsigned-file conclusion."}, {"id": "i2", "t": "auditd: init_module from an interactive shell at 03:11, auid=4311", "why": "A logged-in human triggered it — the manual-load conclusion."}, {"id": "i3", "t": "rpm -V kernel: nvme_core.ko size and digest mismatch", "why": "A package-owned file was altered — the integrity conclusion."}], "slots": [{"label": "A module hides from user-space tools", "accept": ["i0"]}, {"label": "A module file is not vendor signed", "accept": ["i1"]}, {"label": "A human triggered the load manually", "accept": ["i2"]}, {"label": "A package-owned file was modified", "accept": ["i3"]}], "hint": "Each conclusion names a specific fact: hidden, unsigned, human-timed, or package-tampered. Match the noun.", "expl": "Precision in conclusions keeps reports defensible: the /sys delta proves HIDING (not malice per se), signer Unknown proves UNSIGNED (not malicious), the 03:11 interactive load proves HUMAN action (not a service), and rpm -V proves PACKAGE TAMPERING (the strongest single artefact here). Combining all four is what makes the case; each alone is narrower than it feels. The classic report mistake — writing 'malicious rootkit confirmed' under one artefact — is how findings get thrown out in review.", "study": "evidence-to-conclusion mapping in IR reporting"}, {"id": "h13", "type": "terminal", "title": "One read-only pipeline", "lead": "Ubuntu 22.04, web-02, live triage. You want the module list filtered to anything whose name contains 'dv' — case-insensitive — in a single command line. Read-only only: this host has an active rootkit suspicion, and state changes are off the table.", "scenario": [{"label": "Environment card", "kind": "prose", "body": "Standard Ubuntu userland. The module list comes from lsmod. Text filtering is grep's job. Case-insensitivity is grep's -i. The pipeline must start from the module list — grep alone cannot read it."}], "question": "Type the one-line pipeline that prints only module-list lines containing 'dv' (case-insensitive), then press Enter and Check.", "term": {"title": "simulated shell — nothing real is executed", "prompt": "analyst@web-02:~$", "banner": ["Ubuntu 22.04.4 LTS web-02", "Training shell — read-only simulation"], "notFound": "command not found", "simOut": [{"re": "lsmod[\\s\\S]*grep[\\s\\S]*dv", "out": ["dv_load              16384  3", "nvidia_drm            69632  0"]}], "simFail": [{"re": "^\\s*grep\\s", "out": "grep: no input — grep cannot read the module list by itself"}, {"re": "\\b(rmmod|modprobe\\s+-r)\\b", "out": "REFUSED in training: removal commands change the system."}], "expect": [{"el": "starts from lsmod (the module list)", "re": "^lsmod\\b", "why": "The pipeline's data source is the module list."}, {"el": "pipes into grep", "re": "\\|\\s*grep\\b", "why": "The pipe hands lsmod's output to the filter."}, {"el": "grep runs case-insensitively (-i)", "re": "-i", "why": "The requirement says case-insensitive; -i is the flag."}, {"el": "searches for the string dv", "re": "dv", "why": "The pattern from the task."}], "traps": [{"re": "\\b(rmmod|modprobe\\s+-r)\\b", "note": "Removal commands change the system — this task is read-only."}, {"re": "^\\s*grep\\s", "note": "grep alone has no module data; the pipeline must start from lsmod."}], "canonical": "lsmod | grep -i dv", "canonExpl": ["lsmod — prints the loaded-module table (name, size, used-by).", "| — the pipe: sends that table to the next stage instead of the screen.", "grep -i dv — keeps only lines containing 'dv', matching upper and lower case.", "Read-only end to end: nothing on the host changes."]}, "hint": "Two tools, one pipe: the list producer, then the filter with its case flag.", "expl": "The canonical pipeline is lsmod | grep -i dv. Four graded elements: the producer, the pipe, the -i flag, the pattern. Near-misses: bare grep (no input source), and — the dangerous one — reaching for rmmod/modprobe -r to 'clean' matches on a suspect host, which is a state change and destroys the case. Output here shows dv_load among hits: on this host, that module now goes on the verification list. Pipelines like this are the daily bread of module triage — safe, scriptable, and logged.", "study": "reading module lists with pipelines; read-only discipline on suspect hosts"}, {"id": "h14", "type": "qcm", "title": "The least aggressive correct move", "lead": "prod-db-03 carries an unowned module hwmon_vendor. The database owner says their licensed monitoring agent 'ships kernel components'. The agent's documentation mentions a kernel module. Nothing else on the host is odd. The obvious move — unload it — could crash production.", "scenario": [{"label": "Case facts", "kind": "prose", "body": "Module: hwmon_vendor.ko, loaded 41 days ago, in use. Package DB: not owned. Vendor statement: 'our enterprise agent includes a hardware monitor kernel module'. Documentation: mentions hwmon_vendor.ko and a SHA-256 fingerprint. Load context: installed during a maintenance window with a change ticket."}, {"label": "Reminder — M1049 caveat", "kind": "prose", "body": "ATT&CK's mitigation text notes rootkit scanners may be evaded — and in general, aggressive actions on production kernel code carry their own outage risk."}], "question": "What is the right next move?", "options": [{"t": "Verify the module's hash against the vendor's published fingerprint and file the result in the ticket", "c": true, "why": "A documented fingerprint exists; one safe check resolves the case either way."}, {"t": "rmmod it now — unowned means malicious", "c": false, "why": "'Unowned' plus a named vendor claim equals 'verify', not 'yank'. Unloading kernel code under a live database is how outages are born."}, {"t": "Reboot the host into recovery mode for a clean check", "c": false, "why": "A production database reboot is a business decision, not an analyst's reflex — and the evidence is already on disk."}, {"t": "Disable the auditd rule that raised the noise", "c": false, "why": "Killing telemetry to silence a question is the opposite of an answer."}], "hint": "Someone published a fingerprint for exactly this situation. Aggressive options must earn their risk — this one has a cheap alternative.", "expl": "The least aggressive option is correct: one hash comparison against a vendor-published fingerprint. Real enterprises run vendor kernel modules that packages do not own — unowned is 'unexplained', not 'malicious'. The near-misses all carry real cost for zero information: rmmod risks crashing the DB host, a recovery reboot is downtime, and silencing auditd blinds every future check. When a cheap decisive check exists, aggressive action is always the wrong answer — save the heavy tools for the case where verification fails.", "study": "proportionality in response; vendor fingerprint verification"}, {"id": "h15", "type": "multi", "title": "What the Drovorub advisory supports", "lead": "You are quoting the NSA/FBI Drovorub advisory in a briefing slide. Every line must be defensible against the source.", "scenario": [{"label": "Advisory memory card", "kind": "prose", "body": "Source: joint NSA/FBI advisory, August 2020: 'Russian GRU 85th GTsSS Deploys Previously Undisclosed Drovorub Malware'. Drovorub = client + kernel module + server + agent. The module hides files, processes and network activity; the advisory recommends network flow analysis and signature-based scanning as detection methods, noting host tools can be blinded."}], "question": "Select every statement the advisory supports.", "options": [{"t": "Drovorub includes a Linux kernel module used for persistence", "c": true, "why": "The module is the persistence anchor — and ATT&CK's procedure table cites it for T1547.006."}, {"t": "The kernel module can hide files, processes and network activity", "c": true, "why": "The hiding feature set is the advisory's core warning."}, {"t": "Network flow analysis is a recommended detection method because host tools can be blinded", "c": true, "why": "The advisory's out-of-band detection guidance — independent of the compromised kernel."}, {"t": "Drovorub only works on Windows servers", "c": false, "why": "Drovorub is Linux malware throughout the advisory."}, {"t": "The advisory attributes Drovorub to a financially motivated cybercrime gang", "c": false, "why": "The attribution is to Russian GRU 85th GTsSS — a state actor, not a crime gang."}], "hint": "Three statements restate the advisory; two swap the platform and the sponsor.", "expl": "Droppable facts: Linux kernel module for persistence; hiding of files/processes/network activity; netflow as the out-of-band detection. The swapped facts are the classic briefing errors: calling it Windows (wrong platform — and wrong for this whole technique) and calling it cybercrime (wrong sponsor — the advisory says GRU 85th GTsSS). In a CTI briefing, getting sponsor and platform wrong destroys the credibility of the entire deck — quote the source.", "study": "the NSA/FBI Drovorub advisory — capabilities, attribution, detection guidance"}, {"id": "h16", "type": "qcm", "title": "Spot the mistake in the auditd rule", "lead": "Your fleet is x86_64-only. A colleague shipped the auditd rule below and reports it 'works'. After two weeks: zero module-load events — on a fleet where you KNOW some hosts load modules weekly.", "scenario": [{"label": "ARTEFACT — shipped rule", "kind": "code", "lines": ["-a always,exit -F arch=b32 -S init_module -S finit_module -S delete_module -k lkm_watch"]}, {"label": "Fleet facts", "kind": "prose", "body": "All hosts run x86_64 kernels. No 32-bit userland anywhere. The rule was pushed via your audit configuration management and is active (auditctl -l shows it loaded)."}], "question": "What is the mistake?", "options": [{"t": "The rule filters only the 32-bit syscall architecture (b32); x86_64 loads enter as b64 and are never recorded", "c": true, "why": "On 64-bit kernels, module loads come through the b64 syscall table — the b32 filter misses them."}, {"t": "auditd cannot watch module syscalls at all", "c": false, "why": "It can — init_module/finit_module/delete_module are standard auditd watch targets."}, {"t": "The -k key must be uppercase to be searchable", "c": false, "why": "ausearch -k matches the string exactly as written; case is convention, not a failure."}, {"t": "delete_module is not a real syscall", "c": false, "why": "It is the module-removal syscall — perfectly valid in the rule."}], "hint": "The rule IS active and the syscalls ARE real. Look at the one filter that narrows WHOSE syscalls get recorded.", "expl": "The mistake is arch=b32 on an x86_64-only fleet: 64-bit processes issue 64-bit syscalls, so the b32 filter never matches and the rule silently records nothing. The fix is -F arch=b64 (or shipping both when mixed userland exists). This near-miss family is nasty because the rule loads without error — 'active' and 'working' are different things. Always validate audit rules by firing a test load in a canary host and checking ausearch -k lkm_watch returns it.", "study": "auditd architecture filters — b32 vs b64 on x86_64 fleets"}]};

  /* ---------------- log viewer component ---------------- */

  /* ---------------- timer state machine ---------------- */
  function tSet(next) {
    if (next === T.state) return;
    var now = Date.now();
    if (T.state === "PAUSED_MANUAL") T.manualMs += now - T.pauseStamp;
    if (T.state === "PAUSED_AUTO_CHECK") T.feedbackMs += now - T.pauseStamp;
    if (next === "PAUSED_MANUAL") {
      T.resumeTo = (T.state === "PAUSED_AUTO_CHECK") ? "PAUSED_AUTO_CHECK" : "RUNNING";
      T.pauseStamp = now;
    }
    if (next === "PAUSED_AUTO_CHECK") T.pauseStamp = now;
    if (next === "ENDED") { T.remaining = 0; }
    T.state = next;
    renderTimer();
  }
  function tStart(budget) {
    T.budget = budget; T.remaining = budget;
    T.state = "RUNNING"; T.manualMs = 0; T.feedbackMs = 0;
    if (T.handle) clearInterval(T.handle);
    T.handle = setInterval(function () {
      if (T.state !== "RUNNING") return;
      T.remaining -= 1;
      if (T.remaining <= 0) { T.remaining = 0; renderTimer(); timeUp(); return; }
      renderTimer();
      if (P.handle && P.left > 0) {
        P.left -= 1;
        var pe = currentEx();
        if (pe && pe._perTimerEl) pe._perTimerEl.textContent = "⏱ per-exercise timer: " + fmtT(P.left);
        if (P.left <= 0) { clearInterval(P.handle); P.handle = null; var ce = currentEx(); if (ce && !ce._checked) doCheck(true); }
      }
    }, 1000);
    renderTimer();
  }
  function timeUp() {
    if (S.done) return;
    tSet("ENDED");
    S.times.endTs = Date.now();
    finishExam(true);
  }

  /* ---------------- exam start / navigation ---------------- */
  function buildQueue() {

      if (q[i].type === "terminal" && q[i + 1].type === "terminal") {
        for (var j = 0; j < q.length; j++) {
          if (j !== i && j !== i + 1 && q[j].type !== "terminal" && q[i + 1] && q[j]) {
            var t = q[i + 1]; q[i + 1] = q[j]; q[j] = t; break;

    return q;
  }

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {
    if (ex.type === "qcm" || ex.type === "multi") buildOpts(root, ex);
    else if (ex.type === "drag" || ex.type === "order") buildDnd(root, ex);
    else if (ex.type === "match") buildMatch(root, ex);
    else if (ex.type === "fill") buildFill(root, ex);
    else if (ex.type === "terminal") buildTerm(root, ex);
    else if (ex.type === "sim") buildSim(root, ex);
  }
  function optIds(ex) {
    if (!ex._oid) ex._oid = ex.options.map(function (o, i) { return "o" + i; });
    return ex._oid;
  }
  function buildOpts(root, ex) {
    var ids = optIds(ex);
    if (!ex._order) ex._order = shuffle(ids);
    if (!ex._ans) ex._ans = ex.type === "multi" ? [] : null;
    var box = elx("div", "opts");
    ex._order.forEach(function (oid, k) {
      var o = ex.options[parseInt(oid.slice(1), 10)];
      var b = elx("button", "opt");
      b.type = "button";
      b.setAttribute("data-oid", oid);
      b.innerHTML = '<span class="opt-letter">' + "ABCDEFGH"[k] + '.</span><span>' + esc(o.t) + '</span><span class="selword" aria-hidden="true">● SELECTED</span>';
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        if (ex._checked) return;
        if (ex.type === "multi") {
          var i = ex._ans.indexOf(oid);
          if (i >= 0) { ex._ans.splice(i, 1); b.classList.remove("selected"); b.setAttribute("aria-pressed", "false"); }
          else { ex._ans.push(oid); b.classList.add("selected"); b.setAttribute("aria-pressed", "true"); }
        } else {
          ex._ans = oid;
          $all(".opt", box).forEach(function (x) { x.classList.remove("selected"); x.setAttribute("aria-pressed", "false"); });
          b.classList.add("selected"); b.setAttribute("aria-pressed", "true");
        }
      });
      box.appendChild(b);
    });
    root.appendChild(box);
    if (ex.type === "multi") root.appendChild(elx("p", "small muted", "Select all options that apply. Wrong selections subtract from your score (partial credit)."));
    if (ex._checked) markOpts(ex, box);
  }
  function markOpts(ex, box) {
    var corr = ex.options.map(function (o, i) { return o.c ? "o" + i : null; }).filter(Boolean);
    var corrSet = {};
    corr.forEach(function (c) { corrSet[c] = true; });
    $all(".opt", box).forEach(function (b) {
      var oid = b.getAttribute("data-oid");
      b.disabled = true;
      var chosen = ex.type === "multi" ? ex._ans.indexOf(oid) >= 0 : ex._ans === oid;
      if (corrSet[oid]) b.classList.add("correct-reveal");
      else if (chosen) b.classList.add("wrong-reveal");
      var st = elx("span", "opt-st " + (corrSet[oid] ? "st-correct" : chosen ? "st-incorrect" : ""), "");
      st.textContent = corrSet[oid] ? "✓ Correct answer" : chosen ? "✗ Your pick" : "";
      b.querySelector(".selword").style.display = "none";
      b.appendChild(st);
    });
  }
  function buildDnd(root, ex) {
    if (!ex._order) ex._order = shuffle(ex.bank.map(function (it, i) { return it.id; }));
    if (!ex._ans) { ex._ans = {}; ex._slots = []; }
    var wrap = elx("div", "dnd");
    wrap.appendChild(elx("div", "bank-label", "Item bank — click an item, then click a slot (or drag)"));
    var bank = elx("div", "bank");
    bank.id = "bank-" + ex.id;
    ex._order.forEach(function (iid) {
      var it = ex.bank.filter(function (b) { return b.id === iid; })[0];
      if (placedSomewhere(ex, iid)) return;
      bank.appendChild(makeChip(ex, it, false));
    });
    if (!bank.children.length) bank.appendChild(elx("span", "small muted", "(bank empty — all items placed)"));
    wrap.appendChild(bank);
    var slots = elx("div", "slots");
    var n = ex.type === "order" ? ex.bank.length : ex.slots.length;
    for (var i = 0; i < n; i++) {
      var lbl = ex.type === "order" ? "Position " + (i + 1) : ex.slots[i].label;
      var slot = elx("div", "slot");
      slot.setAttribute("data-slot", String(i));
      slot.setAttribute("role", "button");
      slot.setAttribute("tabindex", "0");
      slot.setAttribute("aria-label", "Slot " + (i + 1) + ": " + lbl);
      slot.appendChild(elx("span", "slot-lbl", esc(lbl)));
      paintSlot(ex, slot, i);
      slot.addEventListener("click", function (ev) {
        if (ex._checked) return;
        if (ev.target && ev.target.classList && ev.target.classList.contains("clearx")) return;
        placeInto(ex, parseInt(this.getAttribute("data-slot"), 10));
      });
      slot.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); this.click(); }
      });
      slot.addEventListener("dragover", function (ev) { ev.preventDefault(); this.classList.add("droptarget"); });
      slot.addEventListener("dragleave", function () { this.classList.remove("droptarget"); });
      slot.addEventListener("drop", function (ev) {
        ev.preventDefault(); this.classList.remove("droptarget");
        var iid = ev.dataTransfer.getData("text/plain");
        if (iid && !ex._checked) { ex._picked = iid; placeInto(ex, parseInt(this.getAttribute("data-slot"), 10)); }
      });
      slots.appendChild(slot);
    }
    wrap.appendChild(slots);
    root.appendChild(wrap);
    root.appendChild(elx("p", "small muted", ex.type === "order" ? "Put the items in the correct order, first to last." : "Fill every slot. Wrong placements subtract from your score (partial credit)."));
    if (ex._checked) revealDnd(ex, slots);
  }
  function placedSomewhere(ex, iid) {
    for (var k in ex._ans) if (ex._ans[k] === iid) return true;

  /* ---------------- grading ---------------- */

      res.credit = scoreExercise({ correct: Hd, wrong: Wd }, n);
      for (var j = 0; j < n; j++) {
        var acc2 = ex.type === "order" ? [ex.bank[j].id] : accList(ex.slots[j]);
        var got2 = ex._ans[j];
        var needTxt = acc2.map(function (aid) { return ex.bank.filter(function (b) { return b.id === aid; })[0].t; }).join(" / ");
        var lbl = ex.type === "order" ? "Position " + (j + 1) : ex.slots[j].label;

        } else if (got2) {
          var gotTxt = ex.bank.filter(function (b) { return b.id === got2; })[0].t;

        var chosenK = ex._ans[i] != null ? parseInt(String(ex._ans[i]).slice(1), 10) : (i === ex._step && ex._pick != null ? parseInt(String(ex._pick).slice(1), 10) : -1);

  /* ---------------- check / feedback / navigation ---------------- */
  function doCheck(auto) {
    var ex = S.disp || currentEx();
    if (!ex || ex._checked) return;
    if (ex.type === "sim" && ex._step < ex.steps.length - 1) return;
    if (ex.type !== "sim") {
      var hasAns = ex.type === "multi" ? ex._ans.length > 0 : ex.type === "fill" ? ex._ans.some(Boolean) : ex.type === "terminal" ? (ex._hist.length > 0 || !!(ex._cur || "").trim()) : (ex.type === "drag" || ex.type === "order") ? Object.keys(ex._ans).length > 0 : ex.type === "match" ? ex._ans.some(Boolean) : !!ex._ans;
      if (!hasAns && !auto) return;
    } else if (!ex._pick && !auto) return;
    /* spec: the Check button must, as its FIRST action, set PAUSED_AUTO_CHECK */
    if (T.state === "RUNNING") tSet("PAUSED_AUTO_CHECK");
    ex._checked = true;
    var g = gradeExercise(ex);
    var raw = g.credit;
    if (S.hintUsed[ex.id]) raw = Math.max(0, raw - 0.10);
    raw = Math.round(raw * 1000) / 1000;
    ex._credit = raw;
    S.credits[ex.id] = raw;
    S.answered[ex.id] = true;
    var si = S.skipped.indexOf(ex);
    if (si >= 0) S.skipped.splice(si, 1);
    renderScore();
    renderFeedback(ex, g, raw);
    var chk = $("#btn-check"); if (chk) chk.disabled = true;
    var nxt = $("#btn-next"); if (nxt) { nxt.style.display = ""; nxt.focus(); }
    var sk = $("#btn-skip"); if (sk) sk.style.display = "none";
    var hb = $("#btn-hint"); if (hb) hb.disabled = true;
    if (P.handle) { P.handle = null; }
    if (S.pos >= S.queue.length - 1 && S.view !== "review") {
      nxt.textContent = S.skipped.length > 0 ? "⚠ Review skipped & finish ▸" : "⏹ Final Submit";
    }
  }
  function labelFor(credit) {
    if (credit >= 0.999) return { t: "✓ CORRECT", cls: "f-correct", col: "st-correct" };
    if (credit > 0) return { t: "✓ PARTIALLY CORRECT", cls: "f-partial", col: "st-partial" };
    return { t: "✗ INCORRECT", cls: "f-incorrect", col: "st-incorrect" };
  }
  function renderFeedback(ex, g, raw, root) {
    if (!g) { g = ex._graded; raw = ex._credit; } else { ex._graded = g; }
    var L = labelFor(raw);
    var fb = elx("div", "feedback " + L.cls);
    var multi = ["multi", "drag", "order", "match", "fill", "terminal", "sim"].indexOf(ex.type) >= 0;
    var fractional = raw > 0 && raw < 0.999;
    fb.appendChild(elx("p", "fb-label " + L.col, L.t + (fractional ? " — credit " + raw.toFixed(2) : "")));
    if (multi || fractional) fb.appendChild(elx("p", "fb-credit", "Credit " + raw.toFixed(2) + (raw >= 0.999 ? " (full)" : " — formula max(0, (H − W) / N)")));
    if (g.dangerous) fb.appendChild(elx("div", "fb-danger", "✗ DANGEROUS — NEAR MISS: " + esc(g.dangerous)));
    var rows = elx("div", "item-rows");
    g.rows.forEach(function (r) {
      rows.appendChild(elx("div", "item-row", '<span class="ir-ico ' + r.cls + '">' + r.ico + '</span><span class="' + r.cls + '"><b>' + r.word + '</b></span><span>' + esc(r.txt) + "</span>"));
    });
    if (g.rows.length) fb.appendChild(rows);
    if (g.canon) {
      fb.appendChild(elx("div", "copyrow", '<button class="copybtn" type="button">Copy command</button>'));
      var cb = elx("div", "codeblock", hlCmd(g.canon));
      fb.appendChild(cb);
      $(".copybtn", fb).addEventListener("click", function () {
        try { navigator.clipboard.writeText(g.canon); this.textContent = "Copied!"; } catch (e) { this.textContent = "Select & copy manually"; }
      });
      (g.canonExpl || []).forEach(function (cx) { fb.appendChild(elx("div", "small", "• " + esc(cx))); });
    }
    fb.appendChild(elx("p", "fb-expl", esc(ex.expl)));
    if (g.correctTxt && !g.rows.length) fb.appendChild(elx("p", "small", esc(g.correctTxt)));
    var st = elx("div", "fb-study", "📚 What to study: " + esc(ex.study));
    fb.appendChild(st);
    var old = $(".feedback", root) || $("#fbwrap .feedback");
    if (old) old.remove();
    var host = (root && root.querySelector("#fbwrap")) || $("#fbwrap");
    host.appendChild(fb);
    var rmReduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    fb.scrollIntoView({ behavior: rmReduce ? "auto" : "smooth", block: "nearest" });
  }
  function goNext() {
    if (T.state === "PAUSED_AUTO_CHECK") tSet("RUNNING");
    S.pos += 1;
    var nextEx = currentEx();
    if (!nextEx) { afterQueue(); return; }
    showCurrent();
  }
  function doSkip() {
    if (S.view === "review") return;
    var ex = currentEx();
    if (!ex || ex._checked) return;
    S.skipped.push(ex);
    S.pos += 1;
    if (!currentEx()) { afterQueue(); return; }
    showCurrent();
  }
  function afterQueue() {
    if (S.skipped.length > 0) { S.view = "review"; renderReview(); }
    else finishExam(false);
  }

  /* ---------------- review skipped ---------------- */
  function renderReview() {
    S.view = "review";
    S.disp = null;
    var sk = $("#tb-skip"); if (sk) sk.style.display = "none";
    var area = $("#exarea");
    if (!area) { renderExamChrome(); area = $("#exarea"); }
    area.innerHTML = "";
    $("#tb-count").textContent = "Review — " + S.skipped.length + " skipped";
    renderProgress();
    var card = elx("div", "fade-in");
    card.appendChild(elx("h2", "", "⚠ Review skipped exercises"));
    card.appendChild(elx("p", "muted", "You skipped " + S.skipped.length + " exercise(s). You can answer them now, as many times as you need, until the timer ends. You can also submit without answering them — skipped-and-never-answered exercises are excluded from your score."));
    var list = elx("div", "review-list");
    S.skipped.forEach(function (ex, i) {
      var it = elx("div", "review-item");
      it.innerHTML = '<span class="st-skipped">⚠</span><span><b>Skipped</b> — ' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + "</span>";
      var b = elx("button", "btn ri-btn", "Answer now ▸");
      b.addEventListener("click", function () { openSkipped(i); });
      it.appendChild(b);
      list.appendChild(it);
    });
    card.appendChild(list);
    var nav = elx("div", "step-nav");
    var fin = elx("button", "btn btn-primary", "⏹ Final Submit");
    fin.addEventListener("click", function () { finishExam(false); });
    nav.appendChild(fin);
    card.appendChild(nav);
    area.appendChild(card);
  }
  function openSkipped(i) {
    var ex = S.skipped[i];
    if (!ex) { renderReview(); return; }
    S.disp = ex;
    var area = $("#exarea");
    area.innerHTML = "";
    syncPerTimer(ex);
    $("#tb-count").textContent = "Review " + (i + 1) + " of " + S.skipped.length;
    var card = buildExerciseCard(ex, (i + 1) + " of " + S.skipped.length, true);
    area.appendChild(card);
    var nxt = $("#btn-next", card);
    var fresh = nxt.cloneNode(false);
    nxt.parentNode.replaceChild(fresh, nxt);
    fresh.textContent = "◂ Back to skipped list";
    fresh.addEventListener("click", function () {
      if (T.state === "PAUSED_AUTO_CHECK") tSet("RUNNING");
      renderReview();
    });
  }

  /* ---------------- results ---------------- */
  function finishExam(fromTimeout) {
    if (S.done && S.reported) return;
    S.done = true;
    S.view = "results";
    if (T.state !== "ENDED") tSet("ENDED");
    S.times.endTs = S.times.endTs || Date.now();
    if (P.handle) P.handle = null;
    var answered = Object.keys(S.credits).length;
    var sum = sumCredits();
    var pct = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    var fully = 0, partly = 0, wrongly = 0;
    Object.keys(S.credits).forEach(function (k) {
      var c = S.credits[k];
      if (c >= 0.999) fully++;
      else if (c > 0) partly++;
      else wrongly++;
    });
    var skippedCount = S.queue.length - answered;
    var app = $("#app");
    app.innerHTML = "";
    var w = elx("div", "wrap fade-in");
    var cert = elx("div", "cert" + (pct >= PASS ? "" : " fail"));
    cert.appendChild(elx("div", "c-title", pct >= PASS ? "✓ PASS" : "✗ FAIL"));
    cert.appendChild(elx("div", "c-pct", pct + "%"));
    cert.appendChild(elx("div", "muted", (pct >= PASS ? "Congratulations — you reached the " + PASS + "% pass mark." : "You did not reach the " + PASS + "% pass mark. Retake the exam to try again.") + " Score computed over the " + answered + " answered exercise(s) only" + (fromTimeout ? " — the timer ended." : ".")));
    w.appendChild(cert);
    var grid = elx("div", "res-grid");
    function cell(num, lbl, cls, extra) {
      var c = elx("div", "res-cell");
      c.innerHTML = '<div class="rc-num ' + cls + '">' + num + '</div><div class="rc-lbl">' + esc(lbl) + (extra ? " — " + esc(extra) : "") + "</div>";
      return c;
    }
    var avgP = partly > 0 ? (Object.keys(S.credits).map(function (k) { return S.credits[k]; }).filter(function (c) { return c > 0 && c < 0.999; })) : [];
    var avg = avgP.length ? (avgP.reduce(function (a, b) { return a + b; }, 0) / avgP.length).toFixed(2) : "0";
    grid.appendChild(cell(fully, "Fully correct", "st-correct", "credit = 1"));
    grid.appendChild(cell(partly, "Partially correct", "st-partial", "avg credit " + avg));
    grid.appendChild(cell(wrongly, "Fully incorrect", "st-incorrect", "credit = 0"));
    grid.appendChild(cell(skippedCount, "Skipped — excluded", "st-skipped", "not counted"));
    w.appendChild(grid);
    var meta = elx("div", "card");
    var usedSec = Math.max(0, Math.round((S.times.endTs - S.times.startTs) / 1000));
    meta.innerHTML =
      '<p><b>Time used:</b> <span class="mono">' + fmtT(Math.min(usedSec, T.budget)) + "</span> of " + fmtT(T.budget) + " budget</p>" +
      '<p><b>⏸ Time paused manually:</b> <span class="mono">' + fmtT(Math.round(T.manualMs / 1000)) + "</span></p>" +
      '<p><b>⏸ Time paused reviewing feedback:</b> <span class="mono">' + fmtT(Math.round(T.feedbackMs / 1000)) + "</span></p>" +
      '<p class="muted small">Hints used: ' + Object.keys(S.hintUsed).length + " (each hint cost 10% of that exercise credit)</p>";
    w.appendChild(meta);
    var listCard = elx("div", "card");
    listCard.appendChild(elx("h2", "", "📋 Exercise review"));
    var list = elx("div", "res-list");
    S.queue.forEach(function (ex) {
      var c = S.credits[ex.id];
      var row = elx("div", "res-row");
      if (c == null) row.innerHTML = '<span class="rr-ico st-skipped">⚠</span><span class="st-skipped"><b>Skipped — excluded</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">not counted</span>';
      else if (c >= 0.999) row.innerHTML = '<span class="rr-ico st-correct">✓</span><span class="st-correct"><b>Fully correct</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">1.0</span>';
      else if (c > 0) row.innerHTML = '<span class="rr-ico st-partial">✓</span><span class="st-partial"><b>Partially correct</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">' + c.toFixed(2) + "</span>";
      else row.innerHTML = '<span class="rr-ico st-incorrect">✗</span><span class="st-incorrect"><b>Fully incorrect</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">0.0</span>';
      list.appendChild(row);
    });
    listCard.appendChild(list);
    w.appendChild(listCard);
    var navc = elx("div", "card start-row");
    var rb = elx("button", "btn btn-primary", "↻ Retake exam");
    rb.addEventListener("click", retake);
    navc.appendChild(rb);
    w.appendChild(navc);
    app.appendChild(w);
    reportScore(sum, answered);
  }

  /* ---------------- site integration (STEP 6) ---------------- */
  function reportScore(creditSum, answeredCount) {
    if (S.reported) return;
    S.reported = true;
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      /* Report only when actually embedded in a site page (http/https same-origin iframe).
         Opened directly (file://, parent === window) there is nothing to report to. */
      if (window.parent && window.parent !== window && /^https?:$/.test(location.protocol)) {
        parent.postMessage({
          type: "CYBERPULSE_SCORE",
          topicId: META.topicId,
          batch: META.batch,
          score: Math.round(creditSum),
          total: answeredCount,
          percent: percent,
          passed: percent >= PASS
        }, location.origin);
      }
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    S.username = event.data.username || "";
    S.country = event.data.country || "";
    S.locale = event.data.locale || "en";
    /* theme field is always 'dark' — this file is dark-only by contract, nothing to switch */
    var chip = $("#learner-chip");
    if (S.username && chip) chip.textContent = "Learner: " + S.username;
  });

  /* ---------------- boot ---------------- */
  document.addEventListener("DOMContentLoaded", function () {
    renderIntro();
  });
})();

</script>
</body>
</html>
