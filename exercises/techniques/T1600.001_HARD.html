<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
  /* derived tints & constants — every rule below consumes variables only */
  --surface-hover:#182238;
  --topbar-bg:rgba(18,26,46,.97);
  --overlay:rgba(11,16,32,.96);
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --shadow-lg:0 8px 22px rgba(0,0,0,.45);
  --sheen:rgba(230,236,255,.35);
  --tint-blue:rgba(90,169,255,.10);
  --tint-blue-strong:rgba(90,169,255,.25);
  --tint-blue-weak:rgba(90,169,255,.12);
  --tint-blue-faint:rgba(90,169,255,.06);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);
  --tint-orange-badge:rgba(255,138,61,.12);
  --tint-red:rgba(255,107,107,.08);
  --tint-red-faint:rgba(255,107,107,.07);
  --tint-red-badge:rgba(255,107,107,.12);
  --tint-red-hero:rgba(255,107,107,.12);
  --tint-purple:rgba(157,123,255,.07);
  --ring-green:0 0 0 2px rgba(87,211,140,.35);
  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;
  --tok-num:#7fd8ff;
  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}
.intro-hero .objline{color:var(--text-secondary);font-size:15px;margin:2px 0}
.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.themebox h4{margin:0 0 8px 0;color:var(--accent-blue);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.themebox ul{margin:0;padding-left:18px;color:var(--text-primary);font-size:14.5px}
.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}
.rulelist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);color:var(--text-primary);font-size:15px;align-items:flex-start}
.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

/* ---------- review & results ---------- */
.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.resultgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1600.001","name":"Weaken Encryption: Reduce Key Space","type":"Sub-Technique","parent":"T1600","tactic":"Defense Impairment (TA0112)","platforms":"Network Devices"},"learn":["This object is a sub-technique. In the MITRE ATT&CK framework, a sub-technique describes one specific way that an attacker can carry out a broader technique. This one belongs to the parent technique T1600, Weaken Encryption. Its job is simple to say: the attacker makes the encryption on a compromised network device weaker, so that cracking the traffic later becomes much cheaper.","Imagine you are a network security engineer at a rail company. Your VPN gateway encrypts traffic with strong, long keys. An attacker who has stolen a management password logs in and changes the key size from thousands of bytes down to a couple of bytes, or swaps a modern cipher for an old, weak one. The device still 'works', so nobody notices — but the attacker can now decrypt everything they capture. That is exactly what T1600.001 describes.","You will meet this object in real work as a SOC analyst (strange crypto config alerts), as a detection engineer (building analytics like ATT&CK detection strategy DET0243 and its analytic AN0681), as an incident responder (deciding how to contain a gateway without destroying evidence), and as a GRC or control owner (writing crypto policy, change control, and backup rules). Tools you will touch: device CLI, configuration archives, firmware records, and traffic analysers that show which ciphers are actually negotiated.","The ATT&CK page for T1600.001 notes that it cannot be easily mitigated with preventive controls, because the attacker abuses normal device features. So defenders lean on configuration change logs, firmware integrity, restricted management access, and traffic analysis. The risks it addresses are unauthorized disclosure of sensitive traffic and follow-on attacks like credential theft. ATT&CK places it in the Defense Impairment tactic (TA0112), on the Network Devices platform. The page references documented attacks on Cisco IOS devices and on legacy devices — old gear with weak defaults is a favourite target."],"kw":["crypto","isakmp","ipsec","transform-set","aes","3des","sha","md5","rsa","tunnel","esp","pre-share","show","write","reload","erase","copy","verify","archive","interface","access-list","permit","deny"],"themes":[{"name":"Adversary behaviour & TTPs","concepts":["downgrade to legacy ciphers","pre-position for decrypting captured traffic","modify key size via Network Device CLI (T1059.008)","pair with Modify System Image (T1601)"]},{"name":"Key space & cipher fundamentals","concepts":["key space","key length in bits and bytes","brute-force cost","legacy vs strong ciphers (3DES vs AES-256)","IKE phase parameters"]},{"name":"Network device CLI & configuration","concepts":["key management files","management access control"]},{"name":"Data sources & telemetry","concepts":["CLI command logs","traffic analysis of negotiated ciphers"]},{"name":"Detection logic & analytics","concepts":["downgraded algorithms","key length parameter changes","disabled strong encryption","legacy cipher usage","correlation of config change + weaker ciphers","confidence level","firmware changes affecting crypto libraries","unexpected key management file updates"]},{"name":"Mitigations & control limits","concepts":["no easy preventive control (abuse of system features)","config integrity monitoring","trusted image verification","change control","restricted management access","configuration backups","management network segmentation"]},{"name":"Framework mappings & real work","concepts":["CIS Control 12 network infrastructure management","IR evidence handling"]},{"name":"Reference cases from the page","concepts":["attacks on Cisco IOS devices (Holmes 2015)","targeting of legacy devices (Santos 2020)"]}],"exercises":[{"id":"T1600-001-H01","type":"logview","title":"Two changes, one real threat","summary":"A scary-looking cipher swap and a bland file update — which one is the T1600.001 indicator?","concepts":["downgrade to legacy ciphers","unexpected key management file updates","key management files","config integrity monitoring","change control"],"perspective":"defender","tags":["trap:alarming-but-benign","trap:benign-but-alarming"],"logTitle":"change-review queue 03:00-04:00 (edge-rtr-01)","filterPlaceholder":"filter change lines...","multi":false,"log":["03:04:11  CHG-2298 (approved, vendor bulletin VB-77)  crypto isakmp policy 10: encryption aes 256 gcm -> aes 128 gcm","03:04:12  CHG-2298 (approved, vendor bulletin VB-77)  crypto isakmp policy 10: group 14 -> group 19","03:41:53  (no ticket)                                 key-management file 'mpki.sock' updated, writer: svc-backup, session from 10[.]20[.]5[.]44","03:42:10  (no ticket)                                 config saved (write memory), writer: svc-backup"],"options":[{"t":"The 03:41 key-management file update from an unticketed session","correct":true,"why":"Correct — unexpected key-management file updates are a listed indicator in analytic AN0681, and this one has no ticket and an odd writer account."},{"t":"The AES-256-GCM to AES-128-GCM swap at 03:04","correct":false,"why":"Alarming at first glance, but AES-128-GCM remains a strong approved cipher and the change is ticketed to a vendor bulletin."},{"t":"The DH group 14 to group 19 move at 03:04","correct":false,"why":"Group 19 (256-bit ECP) is not a weakening versus group 14 — and it belongs to the same approved bulletin."},{"t":"The write memory at 03:42 by itself","correct":false,"why":"A save is bland and routine — but it is the act that made the unticketed change persistent, which is why the preceding line matters."}],"question":"The stakeholder wants the one change that is a genuine T1600.001 precursor. Which is it?","hint":"One change is ticketed to a vendor bulletin; the other is not — check who wrote what, and when.","explain":"Looks-alarming-but-benign: the GCM swap is strong crypto under an approved bulletin. Looks-benign-but-alarming: a 'boring' key-management file write, unticketed, by svc-backup, from an odd host — exactly the 'unexpected updates to key management files' AN0681 flags. The save then made it stick.","study":"Analytic AN0681's indicator list, and how approved change tickets separate signal from noise.","scenario":[{"label":"ARTEFACT 1 — change-review queue 03:00-04:00 (edge-rtr-01)","kind":"text","text":"You are reviewing this export in the SOC log viewer. A scary-looking cipher swap and a bland file update — which one is the T1600.001 indicator? Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-H02","type":"mcq","title":"Contain without breaking the railway","summary":"Pick the least aggressive action that still stops the attacker.","concepts":["management network segmentation","IR evidence handling","restricted management access"],"perspective":"defender","tags":["trap:least-aggressive"],"scenario":[{"label":"ARTEFACT 1 — Situation board","kind":"text","text":"vpn-hub-02 carries the signalling-telemetry tunnel. An unknown session holds management access and changed crypto policy two minutes ago. Trains are moving."}],"question":"Which containment action is correct right now?","options":[{"t":"Cut the management interface into the OOB quarantine VLAN","correct":true,"why":"Correct — isolating management access stops further changes while the tunnel and evidence keep running: least aggressive action that works."},{"t":"Reload the device immediately to purge memory","correct":false,"why":"A reload destroys volatile evidence, drops the tunnel, and the saved weak config simply reloads."},{"t":"Erase the startup config to remove the tampering","correct":false,"why":"Erasing config risks bricking a live gateway and destroys the changed state as evidence."},{"t":"Do nothing until the next change-review meeting","correct":false,"why":"An active unauthorised session will simply finish its work; waiting is not containment."}],"hint":"You need the session gone — but the tunnel, the trains, and the evidence intact.","explain":"Quarantining the management plane stops the attacker at the exact step they depend on (CLI access) while keeping service and evidence. Reload/erase are the aggressive traps: they cost you the case and the railway.","study":"Out-of-band management and quarantine VLANs for compromised network devices."},{"id":"T1600-001-H03","type":"multi","title":"Grade the analytic's confidence","summary":"Which statements about AN0681 confidence are true?","concepts":["correlation of config change + weaker ciphers","confidence level","legacy cipher usage","firmware changes affecting crypto libraries","disabled strong encryption"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — AN0681 (extract)","kind":"text","text":"Suspicious indicators include config changes that downgrade encryption algorithms, key length parameters, or the disabling of strong encryption in favour of legacy ciphers, CLI commands modifying crypto policies, firmware changes affecting crypto libraries, or unexpected updates to key management files. Correlation across device config logs and traffic analysis showing weaker ciphers provides higher confidence."}],"question":"Select every statement the analytic actually supports.","options":[{"t":"A config change alone gives moderate confidence at best","correct":true,"why":"Correct — the analytic says high confidence needs correlation with traffic, so config alone is weaker evidence."},{"t":"Config change plus weaker negotiated ciphers gives higher confidence","correct":true,"why":"Correct — that pairing is literally the correlation AN0681 defines."},{"t":"Legacy ciphers seen on a legacy-only network can be normal, not malicious","correct":true,"why":"Correct — if the fleet only ever spoke 3DES, its presence is baseline, not a downgrade; context changes the read."},{"t":"Any crypto-related log line is by itself proof of T1600.001","correct":false,"why":"Overstated — read-only 'show crypto' lines and approved changes appear constantly; that is why correlation matters."},{"t":"Firmware changes affecting crypto libraries are irrelevant to this analytic","correct":false,"why":"The opposite — the analytic explicitly lists firmware changes affecting crypto libraries as an indicator."}],"hint":"Confidence comes from correlation and context — not from any single line.","explain":"AN0681 rewards correlation (config + traffic) and punishes over-reading single lines. Baseline matters: a legacy cipher is only suspicious where strong crypto used to be.","study":"False-positive control for crypto-change analytics; building a per-device cipher baseline."},{"id":"T1600-001-H04","type":"match","title":"Why the attacker picked each knob","summary":"Three weak parameters and the advantage each gives.","concepts":["legacy vs strong ciphers (3DES vs AES-256)","IKE phase parameters","downgraded algorithms"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker after-action note","kind":"text","text":"'Three changes, three reasons' — the attacker's own summary of what they downgraded on vpn-hub-02 and why."}],"question":"Match each downgraded parameter to the attacker's stated reason.","left":[{"t":"AES-256 → 3DES","match":0,"why":"3DES has a small effective key space — the core of T1600.001."},{"t":"DH group 14 → group 2","match":1,"why":"Group 2 is 1024-bit MODP — a weaker key exchange that is cheaper to break."},{"t":"SHA → MD5","match":2,"why":"MD5 is a broken hash; integrity protection becomes weaker and forgery cheaper."}],"right":[{"t":"Ciphertext becomes breakable offline","why":"A small effective key space is what makes offline brute force practical."},{"t":"Key exchange becomes cheaper to attack","why":"Weak DH groups shrink the search space for the negotiated secret."},{"t":"Integrity protection becomes weak","why":"MD5 collisions make tampering and forgery far easier than SHA-2."}],"hint":"One knob shrinks ciphertext cracking, one shrinks the exchange, one weakens integrity.","explain":"A real downgrade touches all three: cipher (confidentiality), group (key exchange), hash (integrity). Each removal of strength lowers the attacker's total effort — and each is visible in the config diff.","study":"IKE phase 1/2 parameters: encryption algorithm, DH group, and hash choices."},{"id":"T1600-001-H05","type":"terminal","title":"Audit the stored key sizes","summary":"You get only the objective and the environment — pick tool, scope, and target yourself.","concepts":["key length in bits and bytes","CLI command logs"],"perspective":"defender","tags":[],"skill":"unguided-show-selection","scenario":[{"label":"ARTEFACT 1 — Auditor handoff","kind":"text","text":"Objective: confirm the actual RSA public key sizes stored on edge-rtr-01, because a diff hinted one was replaced by a 512-bit key. Environment: IOS-like CLI, privileged mode, read-only audit authorised. The device must not change state in any way."}],"question":"Type the single command that displays the stored RSA public keys and their sizes.","cmd":{"prompt":"edge-rtr-01#","canonical":"show crypto key mypubkey rsa","nearMiss":"clear crypto isakmp","outputs":[{"re":"show crypto (key )?mypubkey( rsa)?","lines":["% Key pair was generated at 03:41:52 UTC Oct 2 2026","Key name: VPN-HUB-02-KEY   Key type: RSA, 512 bits   Exportable: yes","Key name: OLD-GEN-2024     Key type: RSA, 2048 bits  Exportable: no"]}],"unknown":"% Invalid input — that command exists, but it answers a different question.","elements":[{"re":"\\bshow\\b","label":"Read-only 'show' verb","why":"Audits must not change state; 'show' only displays."},{"re":"\\bcrypto\\b","label":"Crypto command family","why":"Key material lives under 'crypto'."},{"re":"\\bkey\\b","label":"The 'key' object","why":"You were asked for key sizes, not sessions."},{"re":"mypubkey","label":"The stored public keys (mypubkey)","why":"Device-held public keys are listed by 'mypubkey'."},{"re":"\\brsa\\b","label":"Scope: rsa","why":"The diff mentioned an RSA key — scope the output."}],"forbidden":[{"re":"\\b(clear|reload|write|erase|copy|conf|configure)\\b","label":"a state-changing or unsuitable command","why":"'clear'/'write'/'erase'/'copy'/'configure' all change state — forbidden in a read-only audit."},{"re":"ipsec sa|isakmp sa","label":"a session-statistics command","why":"'show crypto ipsec sa' or 'isakmp sa' show tunnel counters — a near-miss that never displays key sizes."}]},"hint":"You are auditing stored keys, not live tunnels — one of the 'show crypto …' commands answers exactly this.","explain":"'show crypto key mypubkey rsa' lists each stored RSA key with its size — the output would expose the 512-bit replacement. The tempting near-misses ('ipsec sa', 'isakmp sa') show sessions, not keys, and any 'clear'/'copy'/'write' verb would violate the read-only rule.","study":"The 'show crypto key mypubkey' family and what each 'show crypto …' object displays."},{"id":"T1600-001-H06","type":"mcq","title":"Which alert do you raise first?","summary":"Two analytics fired — the 'obvious' one is not the high-confidence one.","concepts":["correlation of config change + weaker ciphers","confidence level","downgrade to legacy ciphers"],"perspective":"defender","tags":["trap:benign-but-alarming"],"scenario":[{"label":"ARTEFACT 1 — SIEM pair","kind":"text","text":"Alert A: policy 40 (a legacy tunnel to a 1998-era partner gate) renegotiated with 3DES — as it has every night for six years. Alert B: policy 10 (the modern HQ tunnel, AES-256 since 2024) renegotiated with 3DES two minutes after an unticketed config save."}],"question":"Which alert represents a probable T1600.001 downgrade, and why?","options":[{"t":"Alert B — a strong tunnel suddenly negotiating weak crypto after an unticketed save","correct":true,"why":"Correct — a baseline change on a modern tunnel plus an unticketed save is exactly the correlated, high-confidence pattern."},{"t":"Alert A — 3DES always means an attack","correct":false,"why":"Wrong here: policy 40's baseline has been 3DES for six years; no change occurred at all."},{"t":"Both equally — any 3DES in traffic is a downgrade","correct":false,"why":"Only deviation from baseline counts; Alert A matches its own baseline."},{"t":"Neither — renegotiation is always benign","correct":false,"why":"Alert B shows both a config save and a baseline break — ignoring it would miss a live downgrade."}],"hint":"Compare each alert against what that tunnel normally negotiates — and what changed around it.","explain":"Baseline is the trap-breaker: 3DES is benign where it has always been, and damning where AES-256 used to be. Alert B also has the unticketed save as a second correlated signal, which lifts confidence to high.","study":"Per-device crypto baselining and deviation-based alerting (AN0681 in practice)."},{"id":"T1600-001-H07","type":"dnd","title":"Sort the evidence board","summary":"Four artefacts into evidence, ticketed-benign, platform-tampering, or noise.","concepts":["downgrade to legacy ciphers","trusted image verification","no easy preventive control (abuse of system features)","config integrity monitoring"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — IR whiteboard","kind":"text","text":"Case 26-0412, vpn-hub-02. Four artefacts on the board. Ticket CHG-2298 (vendor bulletin VB-77) is the only approved change this week."}],"question":"Drag each artefact to the board column it belongs to.","zones":[{"name":"T1600.001 evidence","accepts":[0],"why":"An unticketed cipher downgrade is the technique itself."},{"name":"Benign — ticketed","accepts":[1],"why":"The GCM migration is covered by the approved vendor bulletin."},{"name":"Platform tampering (T1601)","accepts":[2],"why":"A vendor-mismatched image checksum means the device image was modified."},{"name":"Noise","accepts":[3],"why":"Printer VLAN logs have no crypto relevance whatsoever."}],"bank":[{"t":"policy 10: aes 256 → 3des, no ticket, 03:12","whyMiss":"This is the downgrade with no change record — core T1600.001 evidence."},{"t":"policy 10: aes 256 gcm → aes 128 gcm (CHG-2298)","whyMiss":"Approved, ticketed, still strong crypto — benign."},{"t":"firmware checksum differs from vendor signed value","whyMiss":"Image tampering is T1601, the pair technique often used with key-space reduction."},{"t":"printer-VLAN broadcast storm log entry","whyMiss":"Annoying, but pure noise for this case."}],"hint":"Only one column is for real downgrade evidence; check every artefact against the single approved ticket.","explain":"Sorting forces two skills: matching artefacts to the change register (benign vs evidence) and recognising the paired technique T1601 when the image checksum moves. Noise exists in every case — leave it behind.","study":"Pairing T1600.001 with T1601 Modify System Image in investigations."},{"id":"T1600-001-H08","type":"triage","title":"Change-window review","summary":"Four device events, one expired ticket, one forged writer — classify all.","concepts":["change control","key length parameter changes","management access control","config integrity monitoring"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Change register extract","kind":"text","text":"CHG-2301: approved, window 01:00-03:00, scope: NTP servers on core-sw-01, engineer: p.marchetti. CHG-2302: approved, window 02:00-04:00, scope: cipher migration on edge-rtr-01, engineer: p.marchetti."}],"question":"Classify each observed event against the register.","rows":[{"alert":"02:41 edge-rtr-01: aes 256 gcm → aes 128 gcm","detail":"Matches CHG-2302 scope, in window, writer p.marchetti.","options":["Approved change","T1600.001 indicator","Noise"],"correctIndex":0,"why":"Scope, window, and writer all match the approved ticket — and AES-128-GCM is still strong.","whyNot":{"1":"Nothing here deviates from an approved, non-weakening change.","2":"It is a real, approved change — not background noise."}},{"alert":"03:22 vpn-hub-02: key size 2048 → 512 (writer: p.marchetti)","detail":"vpn-hub-02 is not in any ticket; the real p.marchetti is logged out since 03:05.","options":["Approved change","T1600.001 indicator","Noise"],"correctIndex":1,"why":"Unticketed device, key-length collapse, and an identity conflict (writer still logged out) — the strongest possible downgrade indicator.","whyNot":{"0":"No ticket covers this device, and the writer identity is contradictory.","2":"A key-length collapse is never noise."}},{"alert":"02:15 core-sw-01: NTP server list updated","detail":"Matches CHG-2301 scope, in window.","options":["Approved change","T1600.001 indicator","Noise"],"correctIndex":0,"why":"In-scope, in-window approved work — routine even though it touches a device.","whyNot":{"1":"NTP servers are not encryption parameters — nothing weakened.","2":"It is an approved change, not random noise."}},{"alert":"03:58 vpn-hub-02: 3des enabled on policy 10, writer: 'p.marchetti1'","detail":"Username with a trailing '1' does not exist in IdP; outside all windows.","options":["Approved change","T1600.001 indicator","Noise"],"correctIndex":1,"why":"A lookalike account plus a legacy-cipher enablement outside any window is the technique with an impersonation twist.","whyNot":{"0":"The lookalike identity and the out-of-window timing break every approval condition.","2":"A legacy cipher enablement is precisely the indicator family — not noise."}}],"hint":"Check three things per row: ticket scope, window, and whether the writer identity really existed at that moment.","explain":"Conflicting signals resolve against the register: scope, window, and verified identity. The 512-bit change fails all three, and the 'p.marchetti1' row shows how impersonation rides on routine change noise.","study":"Correlating change tickets with identity-provider session records."},{"id":"T1600-001-H09","type":"fib","title":"Quantify the collapse","summary":"Two numbers turn the downgrade into a reportable measurement.","concepts":["key space","key length in bits and bytes","brute-force cost"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — IR report placeholder","kind":"text","text":"'The symmetric key length was reduced from 2048 bits to {b0} bits. The attacker's search space therefore shrank by 2^{b1} possibilities.' (Subtract the exponents.)"}],"question":"Fill both numbers so the report is mathematically correct.","template":"Key length reduced from 2048 bits to {b0} bits; the search space shrank by 2^{b1}.","blanks":[{"accept":["512"],"why":"The scenario states the new key is 512 bits — the T1600.001 collapse.","whyMiss":"Re-read the artefact: the 'to' value is 512, not 1024 or 2048."},{"accept":["1536"],"why":"2048 − 512 = 1536 — the exponent difference is the factor of shrinkage.","whyMiss":"It is a subtraction of exponents, not the new length: 2048 − 512 = 1536."}],"hint":"First blank is written in the artefact. Second: subtract the two exponents.","explain":"512 bits is the new length; 2^1536 is how many times smaller the search space became. Putting numbers on T1600.001 changes makes the impact undeniable to management.","study":"Key-length arithmetic: why each lost bit halves the attacker's work."},{"id":"T1600-001-H10","type":"mcq","title":"The risk the attacker accepts","summary":"Downgrading is visible in logs — why do attackers still do it?","concepts":["config integrity monitoring","pair with Modify System Image (T1601)","attacks on Cisco IOS devices (Holmes 2015)","targeting of legacy devices (Santos 2020)"],"perspective":"attacker","tags":["trap:best-practice-wrong"],"scenario":[{"label":"ARTEFACT 1 — Threat-discussion prompt","kind":"text","text":"A junior claims attackers would never downgrade crypto on routers because 'config changes are always logged and alerted'. The reference literature on IOS attacks and legacy-device targeting suggests otherwise."}],"question":"Which answer best explains the attacker's real calculus?","options":[{"t":"Many fleets still lack config-diff alerting, and legacy devices log poorly — the risk is often acceptable","correct":true,"why":"Correct — documented attacks on IOS devices and legacy targeting exploit exactly these blind spots."},{"t":"Crypto changes never produce any log line at all","correct":false,"why":"They do — the calculus is about environments that never collect or alert on those logs."},{"t":"Downgrading lets the attacker bypass the vendor's support contract","correct":false,"why":"Support contracts are irrelevant to the attacker's goals."},{"t":"Attackers prefer it because it increases their visibility to the SOC","correct":false,"why":"Attackers avoid visibility; the technique trades stealth risk for decryption leverage."}],"hint":"The trade-off is real — the question is whether the defender side ever looks at the evidence.","explain":"The 'best practice' answer (everyone alerts on config changes) is wrong in many real estates: uncollected syslog, unmonitored legacy devices, no diffing. Documented IOS attack evolution shows attackers bank on exactly that gap.","study":"The two T1600.001 references: IOS attack evolution (2015) and legacy-device targeting (2020)."},{"id":"T1600-001-H11","type":"order","title":"Reconstruct the full chain","summary":"Five steps from stolen credentials to readable captures — including T1601.","concepts":["pair with Modify System Image (T1601)","modify key size via Network Device CLI (T1059.008)","pre-position for decrypting captured traffic","management access control"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Timeline fragments (out of order)","kind":"text","text":"Fragments: 'image checksum deviates from vendor value' · 'TAACS shows login from svc-backup at 02:58' · 'CLI: encryption 3des under policy 10' · 'capture archive starts filling' · 'TACACS: enable 15 granted to svc-backup'."}],"question":"Order the attacker's five steps as they happened.","sequence":["Log in with the stolen svc-backup account (02:58)","Obtain privileged (enable 15) rights","Modify the device image so the change survives reloads (T1601)","Reduce the key space through the device CLI (T1600.001)","Let captures accumulate and decrypt them offline"],"orderWhy":["No credentials, no attack — the TACACS login comes first.","Privilege escalation to enable 15 unlocks the crypto commands.","The image modification (checksum deviation) makes the downgrade persistent.","The CLI change to 3DES is the key-space reduction itself.","The payoff: capture archives become readable offline."],"hint":"Access, then privilege, then persistence, then the crypto change, then the payoff.","explain":"The full chain shows why single-log alerts miss T1600.001: the decisive CLI line is preceded by credential theft and image tampering, and followed only later by readable captures. Correlating all five steps is what gives high confidence.","study":"T1601 Modify System Image as a persistence mechanism for network-device tampering."},{"id":"T1600-001-H12","type":"terminal","title":"Preserve before you restore","summary":"Environment and objective only — save the current state safely first.","concepts":["configuration backups","IR evidence handling","config integrity monitoring"],"perspective":"defender","tags":["trap:real-cost"],"skill":"evidence-preserving-copy","scenario":[{"label":"ARTEFACT 1 — IR bridge (compressed)","kind":"text","text":"Decision: restore the known-good config on vpn-hub-02 in ten minutes. Before that, the current (tampered) running-config must be preserved for forensics. Flash has 64 MB free. Destructive actions are forbidden by the evidence plan."}],"question":"Type the command that preserves the current running configuration to the device's own flash as 'pre-restore-evidence.cfg'.","cmd":{"prompt":"vpn-hub-02#","canonical":"copy running-config flash:pre-restore-evidence.cfg","nearMiss":"copy running-config startup-config","outputs":[{"re":"copy run(ning)?-config flash:pre-restore-evidence\\.cfg","lines":["Destination filename [pre-restore-evidence.cfg]?","Building configuration...","[OK] 4211 bytes copied to flash:pre-restore-evidence.cfg"]}],"unknown":"% Invalid input — the evidence plan forbids anything that alters or destroys state.","elements":[{"re":"\\bcopy\\b","label":"The 'copy' verb (duplicates state)","why":"'copy' preserves; 'write'/'erase'/'reload' destroy or alter."},{"re":"run(ning)?-config","label":"Source: running-config","why":"The tampered live state is the evidence to capture."},{"re":"flash:","label":"Destination: flash:","why":"Flash keeps the copy on-device where the chain of custody starts."},{"re":"pre-restore-evidence\\.cfg","label":"The named evidence file","why":"A deliberate filename keeps the artefact identifiable in the case file."}],"forbidden":[{"re":"\\b(write|erase|reload|conf|configure)\\b","label":"a destructive or state-altering command","why":"'write erase'/'reload'/'configure' alter or destroy the evidence you were told to preserve."},{"re":"copy run(nning)?-config startup","label":"copying into the startup config","why":"Saving the tampered config as the startup config would persist the damage across reloads."}]},"hint":"The verb duplicates state; the destination is flash with the exact filename requested.","explain":"'copy running-config flash:pre-restore-evidence.cfg' snapshots the tampered state without changing behaviour. The DANGEROUS near-miss — 'write erase', 'reload', or copying into startup — would destroy or cement the evidence. Always preserve before restore.","study":"Chain of custody for network-device configs during incident response."},{"id":"T1600-001-H13","type":"logview","title":"Which proposal did the tunnel accept?","summary":"IKE negotiation lines — find the accepted weakened proposal.","concepts":["IKE phase parameters","traffic analysis of negotiated ciphers","legacy cipher usage"],"perspective":"defender","tags":[],"logTitle":"vpn-hub-02 IKE negotiation log (03:14)","filterPlaceholder":"filter proposals...","multi":false,"log":["03:14:01 IKEv2 policy 10 proposal recv: ENCR=AES_GCM_256 PRF=SHA512 DH=group19","03:14:01 IKEv2 policy 10 proposal local: ENCR=AES_GCM_256 PRF=SHA512 DH=group19","03:14:02 IKEv2 policy 10 proposal recv: ENCR=3DES PRF=MD5 DH=group2","03:14:02 IKEv2 policy 10 SELECTED: ENCR=3DES PRF=MD5 DH=group2  (peer-initiated rekey)","03:14:03 CHILD_SA tunnel-id 41 UP, transform ESP: 3DES/MD5/HMAC96"],"options":[{"t":"The SELECTED line accepting 3DES/MD5/group2 on the peer-initiated rekey","correct":true,"why":"Correct — the accepted proposal is what the tunnel actually uses; the recv lines alone are just offers."},{"t":"The first recv line offering AES-GCM-256","correct":false,"why":"An offer is not a selection — that proposal was not chosen, so it is a near-miss."},{"t":"The local proposal line at 03:14:01","correct":false,"why":"Locally proposed is not accepted; the device 'lost' the negotiation deliberately weakened beforehand."},{"t":"The CHILD_SA up line, because it is last","correct":false,"why":"The CHILD_SA line confirms the tunnel came up with the accepted (weak) transform — the selection line is the evidence."}],"question":"Pick the log line that proves the weakened parameters are now in use.","hint":"Offers and acceptances look similar — the keyword in one line decides which proposal wins.","explain":"In IKE logs, 'recv'/'local' lines are proposals and the 'SELECTED' line is the outcome. The SELECTED 3DES/MD5/group2 right after an unticketed save is the traffic-side half of the AN0681 correlation.","study":"Reading IKEv2 negotiation logs: proposals versus the selected transform.","scenario":[{"label":"ARTEFACT 1 — vpn-hub-02 IKE negotiation log (03:14)","kind":"text","text":"You are reviewing this export in the SOC log viewer. IKE negotiation lines — find the accepted weakened proposal. Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-H14","type":"multi","title":"Reach HIGH confidence","summary":"Choose the two artefacts whose pairing reaches the analytic's high-confidence bar.","concepts":["correlation of config change + weaker ciphers","CLI command logs","traffic analysis of negotiated ciphers","confidence level"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case file shelf","kind":"text","text":"Shelf: (1) CLI log 03:12 'encryption 3des' · (2) IKE capture 03:14 SELECTED 3DES/MD5/group2 · (3) HR onboarding spreadsheet · (4) photo of the data centre door · (5) an approved 2025 ticket about wallpapers."}],"question":"Select the two artefacts that together give HIGH confidence of malicious key-space reduction.","options":[{"t":"Artefact 1 — the CLI log line","correct":true,"why":"Correct — it proves the change was typed, when, and by which account."},{"t":"Artefact 2 — the IKE capture","correct":true,"why":"Correct — it proves the effect in traffic; together with (1) this is the exact AN0681 correlation."},{"t":"Artefact 3 — the HR spreadsheet","correct":false,"why":"HR data does not corroborate a device-side crypto change."},{"t":"Artefact 4 — the door photo","correct":false,"why":"A timestamped photo adds context at best; it shows neither change nor effect."},{"t":"Artefact 5 — the wallpaper ticket","correct":false,"why":"Approved but unrelated — including it as evidence would contaminate the case."}],"hint":"One artefact proves the cause, one proves the effect — the analytic pairs exactly those.","explain":"Cause (CLI change) + effect (weak cipher selected in traffic) = high confidence. Everything else is decoration or noise for this determination.","study":"Writing high-confidence determinations: pairing cause and effect artefacts."},{"id":"T1600-001-H15","type":"mcq","title":"Map the control to the framework","summary":"Which CIS Control best anchors network-device change control?","concepts":["CIS Control 12 network infrastructure management","change control","config integrity monitoring"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — GRC note","kind":"text","text":"After the vpn-hub-02 incident, GRC must anchor 'track and review all network-infrastructure configuration changes' to a CIS v8 control for the audit report."}],"question":"Which CIS v8 control is the best anchor?","options":[{"t":"CIS Control 12 — Network Infrastructure Management","correct":true,"why":"Correct — CIS v8 Control 12 covers network device configuration, review, and change management."},{"t":"CIS Control 10 — Malware Defenses","correct":false,"why":"Malware defences do not cover router configuration change control."},{"t":"CIS Control 3 — Data Protection","correct":false,"why":"Data protection is the outcome, not the control that governs device config changes."},{"t":"CIS Control 6 — Access Control Management","correct":false,"why":"Accounts matter, but the asked-for anchor is configuration change management on network gear."}],"hint":"The anchor's name mentions the infrastructure itself, not users or malware.","explain":"CIS v8 Control 12 (Network Infrastructure Management) is the home of device config change control — the process change that would have caught the unticketed downgrade. ISO/IEC 27001 A.8.24 covers the cryptography side.","study":"CIS v8 Control 12 safeguards on configuration review and change management."}],"severityWord":"HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="trirrow"><span class="t-alert">'+esc(r.alert)+'</span><select class="anssel" id="tri-'+ri+'" onchange="pickTriage()" aria-label="Disposition for alert '+(ri+1)+'">'+opts+'</select><span class="t-detail">'+esc(r.detail)+'</span></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');
  return '<li><span class="fi-ico '+cls+'">'+ico+'</span><span><b>'+esc(label)+'</b>'+(note ? '<span class="fi-note">'+esc(note)+'</span>' : '')+'</span></li>';

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
