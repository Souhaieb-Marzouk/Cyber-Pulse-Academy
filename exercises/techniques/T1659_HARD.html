<script>
/* Cyber Pulse Academy exercise engine — MITRE ATT&CK T1659 Content Injection
   Shared vanilla-JS engine for all four difficulty files. No external requests. */
window.ExamEngine=(function(){
'use strict';
/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function words(s){return String(s||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(function(x){return x;}).length;}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
/* ---------------- syntax highlight ---------------- */
var KW=['DNS','HTTP','HTTPS','SMB','FTP','GET','POST','PUT','200','302','404','Content-Type','Content-Length','text/html','application/octet-stream','curl','wget','tcpdump','wscript','cscript','Safari','chrome','firefox','msedge','browser','Exec','exec','payload','update','pcap','AN0992','AN0993','AN0994','DET0349','T1659','T1557','T1189','T1105','M1041','M1021','TA0001','TA0011','Windows','Linux','macOS','GET','vsftpd','wupdate','winupdate','Vary','Server','nginx','apache','IDs','TTL','time','date','GET','http'];
var HL_RE=null;
function buildHL(){
  var seen={},ks=[];
  KW.forEach(function(k){if(!seen[k]){seen[k]=1;ks.push(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));}});
  HL_RE=new RegExp('(&quot;[^&]*&quot;|\'[^\']*\')|(\\b\\d[\\d.]*\\b)|(\\b(?:'+ks.join('|')+')\\b)','g');
}
function hl(line){
  var s=esc(line);
  return s.replace(HL_RE,function(m,str,num,kw){
    if(str)return '<span class="hl-s">'+str+'</span>';
    if(num)return '<span class="hl-n">'+num+'</span>';
    return '<span class="hl-k">'+kw+'</span>';
  });
}
/* ---------------- scoring (partial credit contract) ---------------- */
function scoreExercise(sel,correct){
  var N=correct.length,H=0,W=0,i;
  for(i=0;i<sel.length;i++){if(correct.indexOf(sel[i])>=0)H++;else W++;}
  return Math.max(0,(H-W)/N);
}
/* ---------------- timer state machine ---------------- */
var TS={R:'RUNNING',PM:'PAUSED_MANUAL',PA:'PAUSED_AUTO_CHECK',EN:'ENDED'};
var E={d:null,phase:'intro',inst:[],idx:0,skipped:[],hint:{},report:false,username:'',prev:null,deadLeft:null,timeoutHit:false};
function tState(){return E.timer.state;}
function setTS(st){
  E.timer.state=st;
  var c=$('#hTimer');if(!c)return;
  c.classList.remove('st-run','st-pm','st-pa','st-en');
  var txt='',icon='';
  if(st===TS.R){c.classList.add('st-run');icon='&#9654;';txt='RUNNING';}
  else if(st===TS.PM){c.classList.add('st-pm');icon='&#9208;';txt='PAUSED &mdash; manual (press Resume)';}
  else if(st===TS.PA){c.classList.add('st-pa');icon='&#9208;';txt='PAUSED &mdash; reviewing feedback (resumes on Next)';}
  else{c.classList.add('st-en');icon='&#9635;';txt='ENDED';}
  c.innerHTML='<span class="tdot">'+icon+'</span>&nbsp;'+fmt(E.timer.remaining)+' &middot; '+txt;
}
function tick(){
  if(!E||!E.timer)return;
  if(tState()!==TS.R)return;
  if(E.phase!=='exam'&&E.phase!=='review')return;
  E.timer.remaining--;
  var inst=E.inst[E.idx];
  if(E.phase==='exam'&&E.deadLeft!=null&&inst&&inst.deadline&&!inst.checked){
    E.deadLeft--;
    var d=$('#deadChip');
    if(d)d.innerHTML='&#9201; Exercise timer: <span id="deadVal">'+fmt(E.deadLeft)+'</span> &mdash; stops on Check';
    if(E.deadLeft<=0){autoCheck();}
  }
  if(E.timer.remaining<=0){E.timer.remaining=0;setTS(TS.EN);timeUp();return;}
  setTS(tState());
}
function timeUp(){
  E.timeoutHit=true;
  if(E.phase==='exam'||E.phase==='review'){renderResults(true);}
}
/* ---------------- header ---------------- */
function buildHeader(){
  var h=$('#hdr');
  h.innerHTML='<div class="hdr-in">'+
    '<div class="hdr-brand">'+esc(E.d.brand)+'</div>'+

/* ---------------- exam flow ---------------- */
function startExam(){
  buildInstances();
  E.report=false;
  E.phase='exam';E.idx=0;E.deadLeft=null;
  setTS(TS.R);
  renderExercise();
}
function buildInstances(){
  E.inst=[];E.skipped=[];E.hint={};E.deadLeft=null;E.timeoutHit=false;
  var order=shuffle(E.d.exercises);
  order.forEach(function(ex){
    var inst={ex:ex,type:ex.type,raw:null,checked:false,credit:0,fromReview:false,deadline:ex.deadlineSec||null,checkedWithHint:false};
    prepare(inst);
    E.inst.push(inst);
  });
}
function prepare(inst){
  var ex=inst.ex;
  if(ex.type==='choice'||ex.type==='multi'){
    inst.opts=shuffle(ex.options.map(function(o){return {id:o.id,text:o.text};}));
  }else if(ex.type==='order'){
    inst.disp=shuffle(ex.items.map(function(i){return i.id;}));
  }else if(ex.type==='match'){
    inst.lefts=shuffle(ex.pairs.map(function(p,i){return {id:'L'+i,text:p.l};}));
    inst.rights=shuffle(ex.pairs.map(function(p,i){return {id:'R'+i,text:p.r};}));
    inst.pairMap={};inst.selL=null;
  }else if(ex.type==='drag'){
    inst.bank=shuffle(ex.bank.map(function(b,i){return {id:'B'+i,text:b.text,ok:b.ok,slot:b.slot};}));
    inst.place={};inst.selChip=null;
  }else if(ex.type==='fill'){
    inst.bankOpts=shuffle(ex.bank.slice());
  }else if(ex.type==='branch'){
    inst.stepRaws=[];
    inst.stepOpts=ex.steps.map(function(s){return shuffle(s.options.map(function(o){return {id:o.id,text:o.text};}));});
    inst.cur=0;
  }
}
function curInst(){return E.inst[E.idx];}

function bindLogViewer(root,lg){

/* choice + multi */
function wChoice(inst,box,multi){
  var ex=inst.ex;inst.raw=multi?[]:null;
  if(ex.selectNote)box.appendChild(el('p','small muted',ex.selectNote));
  inst.opts.forEach(function(o){

    b.addEventListener('click',function(){

        if(i>=0){inst.raw.splice(i,1);b.classList.remove('sel');b.setAttribute('aria-pressed','false');}
        else{inst.raw.push(o.id);b.classList.add('sel');b.setAttribute('aria-pressed','true');}
      }else{
        inst.raw=o.id;

        b.classList.add('sel');b.setAttribute('aria-pressed','true');

/* ordering */
function wOrder(inst,box){
  var ex=inst.ex,list=el('ul','ordlist');
  function rowFor(id,idx){
    var item=null;ex.items.forEach(function(it){if(it.id===id)item=it;});
    var li=el('li','ordrow');
    li.innerHTML='<span class="oh" data-h aria-label="Drag handle">&#8801;</span><span class="ordnum">'+(idx+1)+'.</span><span class="ox">'+esc(item.text)+'</span>';
    var up=el('button','oup','&uarr;');up.type='button';up.setAttribute('aria-label','Move up');
    var dn=el('button','odn','&darr;');dn.type='button';dn.setAttribute('aria-label','Move down');
    up.addEventListener('click',function(){if(inst.checked)return;move(id,-1);});
    dn.addEventListener('click',function(){if(inst.checked)return;move(id,1);});
    li.appendChild(up);li.appendChild(dn);
    li.dataset.id=id;
    dragRow(li,function(){draw();});
    return li;
  }
  function move(id,dir){
    var i=inst.disp.indexOf(id),j=i+dir;
    if(j<0||j>=inst.disp.length)return;
    inst.disp.splice(j,0,inst.disp.splice(i,1)[0]);draw();
  }
  function draw(){
    list.innerHTML='';
    list.__owner=inst;
    inst.disp.forEach(function(id,i){list.appendChild(rowFor(id,i));});
  }
  draw();
  box.appendChild(el('p','small muted','Put the steps in the right order. Use the arrows or drag the handle.'));
  box.appendChild(list);
}
function dragRow(li,after){
  var handle=$('[data-h]',li);
  handle.addEventListener('pointerdown',function(ev){
    var cardEl=li.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    ev.preventDefault();
    var list=li.parentNode,rows=Array.prototype.slice.call(list.children);
    var startY=ev.clientY,rect=li.getBoundingClientRect(),offY=startY-rect.top;
    li.classList.add('dragging');
    var ghost=li.cloneNode(true);ghost.className='ghost';ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    function pos(y){
      ghost.style.left=rect.left+'px';ghost.style.top=(y-offY)+'px';
      var target=null;
      rows.forEach(function(r){
        if(r===li)return;
        var rr=r.getBoundingClientRect();
        if(y>rr.top-8&&y<rr.bottom+8)target=r;
      });
      if(target){
        var ti=rows.indexOf(target),ci=rows.indexOf(li);
        if(ti>ci)list.insertBefore(li,target.nextSibling);else list.insertBefore(li,target);
        rows=Array.prototype.slice.call(list.children);
      }
    }
    function mv(e){pos(e.clientY);}
    function up(){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();li.classList.remove('dragging');
      var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});
      var owner=list.__owner||li.closest('.excard').__inst;
      if(owner)owner.disp=ids;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* matching */
function wMatch(inst,box){
  var ex=inst.ex,wrap=el('div','match-wrap');
  var lc=el('div'),rc=el('div');
  lc.innerHTML='<div class="mcol-h">Column 1 &mdash; click an item</div>';

    var b=el('button','mchip');b.type='button';b.dataset.id=l.id;
    b.innerHTML='<span>'+esc(l.text)+'</span><span class="pairout"></span>';
    b.addEventListener('click',function(){
      if(inst.checked)return;
      inst.selL=l.id;
      $all('.mchip',lc).forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
    });

  });
  inst.rights.forEach(function(r){
    var b=el('button','mchip');b.type='button';b.dataset.id=r.id;
    b.innerHTML='<span>'+esc(r.text)+'</span>';
    b.addEventListener('click',function(){
      if(inst.checked||!inst.selL)return;
      for(var k in inst.pairMap){if(inst.pairMap[k]===r.id)delete inst.pairMap[k];}
      inst.pairMap[inst.selL]=r.id;

      }else{b.classList.remove('paired');out.innerHTML='';}
    });
    $all('.mchip',rc).forEach(function(b){
      var used=false;for(var k in inst.pairMap){if(inst.pairMap[k]===b.dataset.id)used=true;}
      b.classList.toggle('paired',used);
    });
  }
  refresh();
  wrap.appendChild(lc);wrap.appendChild(rc);
  box.appendChild(el('p','small muted','Click one item on the left, then its partner on the right. Click again to change.'));
  box.appendChild(wrap);
}
/* drag & drop */
function wDrag(inst,box){
  var ex=inst.ex;
  var bank=el('div','bank');bank.dataset.bank='1';
  var slotCount=ex.slots.length;
  var slots=el('div','slots '+(slotCount>=3?'cols-3':'cols-2'));
  ex.slots.forEach(function(s,i){
    var d=el('div','slot');d.dataset.slot=String(i);
    d.innerHTML='<div class="slot-h">'+esc(s.label)+'</div>';
    slots.appendChild(d);
  });
  function chipEl(item){
    var c=el('button','chip');c.type='button';c.dataset.id=item.id;c.textContent=item.text;
    c.addEventListener('click',function(){
      if(inst.checked)return;
      if(c.parentElement&&c.parentElement.classList.contains('slot'))return; /* slot click handler returns it */
      if(inst.selChip===item.id){inst.selChip=null;c.classList.remove('sel');}
      else{inst.selChip=item.id;$all('.chip',box).forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');}
    });
    dragChip(c,bank,slots,function(){draw();});
    return c;
  }
  function placeItem(itemId,slotIdx){
    for(var k in inst.place){if(inst.place[k]===itemId)delete inst.place[k];}
    inst.place[slotIdx]=itemId;
    inst.selChip=null;
    $all('.chip',box).forEach(function(x){x.classList.remove('sel');});
    draw();
  }
  function findSlotOf(itemId){for(var k in inst.place){if(inst.place[k]===itemId)return k;}return null;}
  function draw(){
    bank.innerHTML='';
    inst.bank.forEach(function(item){
      if(findSlotOf(item.id)!=null)return;
      bank.appendChild(chipEl(item));
    });
    $all('.slot',slots).forEach(function(sd){
      var i=sd.dataset.slot,id=inst.place[i];
      $all('.chip',sd).forEach(function(x){x.remove();});
      if(id){
        var item=null;inst.bank.forEach(function(b){if(b.id===id)item=b;});
        sd.appendChild(chipEl(item));
      }
    });
  }
  slots.addEventListener('click',function(ev){
    if(inst.checked)return;
    var chipBtn=ev.target.closest('.chip');
    var sd=ev.target.closest('.slot');if(!sd)return;
    if(chipBtn&&!inst.selChip){
      for(var k in inst.place){if(inst.place[k]===chipBtn.dataset.id)delete inst.place[k];}
      draw();return;
    }
    if(inst.selChip)placeItem(inst.selChip,sd.dataset.slot);
  });
  bank.addEventListener('click',function(ev){
    if(inst.checked)return;
    if(ev.target===bank&&inst.selChip){
      var sid=findSlotOf(inst.selChip);
      if(sid!=null){delete inst.place[sid];inst.selChip=null;draw();}
    }
  });
  draw();
  box.appendChild(el('p','small muted','Drag each item into a slot, or click the item then the slot. Tap a placed item to send it back.'));
  box.appendChild(bank);box.appendChild(slots);
  inst.__draw=draw;
}
function dragChip(chip,bank,slots,after){
  chip.addEventListener('pointerdown',function(ev){
    var cardEl=chip.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    var inst=cardEl?cardEl.__inst:null;
    ev.preventDefault();
    var rect=chip.getBoundingClientRect(),offX=ev.clientX-rect.left,offY=ev.clientY-rect.top;
    var ghost=chip.cloneNode(true);ghost.className='chip ghost';
    ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    var curSlot=null;
    function mv(e){
      ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(curSlot&&curSlot!==sl)curSlot.classList.remove('over');
      curSlot=sl;if(sl)sl.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();
      if(curSlot)curSlot.classList.remove('over');
      if(!inst||inst.checked){after();return;}
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(sl){
        var i=sl.dataset.slot;
        for(var k in inst.place){if(inst.place[k]===chip.dataset.id)delete inst.place[k];}
        if(inst.place[i]&&inst.place[i]!==chip.dataset.id){delete inst.place[i];}
        inst.place[i]=chip.dataset.id;
      }else{
        var inSlot=chip.parentElement&&chip.parentElement.classList.contains('slot');
        if(inSlot){
          var si=chip.parentElement.dataset.slot;
          if(inst.place[si]===chip.dataset.id)delete inst.place[si];
        }
      }
      inst.selChip=null;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* fill in the blanks */

/* terminal */
function wTerminal(inst,box){

  if(sh.support)box.appendChild(el('div','hintbox',sh.support));
  var term=el('div','term');
  term.innerHTML='<div class="term-out" data-out>'+esc(sh.banner||'')+'</div>'+

    (sh.note?'<div class="term-note">'+sh.note+'</div>':'');
  box.appendChild(term);
  var out=$('[data-out]',term),inp=$('[data-cmd]',term);
  inst.lastCmd=null;inst.ran=false;
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){
      var cmd=inp.value;inp.value='';
      runCmd(inst,out,cmd);
    }
  });
  if(sh.deadlineNote)box.appendChild(el('p','small muted',sh.deadlineNote));

function runCmd(inst,out,cmd){
  var sh=inst.ex.shell;
  out.textContent+='\n'+sh.prompt+cmd+'\n';
  var n=norm(cmd);
  if(!n){out.scrollTop=out.scrollHeight;return;}
  inst.lastCmd=n;inst.ran=true;
  var dangerous=null;
  (sh.forbidden||[]).forEach(function(f){if(f.re.test(n))dangerous=f;});
  var ok=sh.expectRe?sh.expectRe.test(n):true;
  if(dangerous){out.textContent+='\n'+dangerous.out+'\n';}
  else if(ok){out.textContent+='\n'+(sh.out||'(no output)')+'\n';}
  else{
    var tok=n.split(' ')[0];
    out.textContent+='\n'+(sh.errOut||('bash: '+tok+': command not found'))+'\n';
  }
  out.scrollTop=out.scrollHeight;
}

/* Engine part B — grading, feedback, flow, results, integration */
'use strict';
/* ---------------- grading ---------------- */
function grade(inst){
  var ex=inst.ex,res={items:[],detail:'',cls:'bad',label:'INCORRECT',credit0:0};
  if(inst.type==='choice'){
    var correct=[ex.correct];
    res.credit0=scoreExercise(inst.raw?[inst.raw]:[],correct);
    inst.opts.forEach(function(o){
      if(o.id===ex.correct)res.items.push({st:'ok',t:esc(o.text)+' — correct answer'});
      else if(inst.raw===o.id)res.items.push({st:'bad',t:esc(o.text)+' — your choice'});
    });
  }else if(inst.type==='multi'){
    var sel=inst.raw||[];
    res.credit0=scoreExercise(sel,ex.correct);
    inst.opts.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>=0,isS=sel.indexOf(o.id)>=0;
      if(isC&&isS)res.items.push({st:'ok',t:esc(o.text)});
      else if(isC)res.items.push({st:'miss',t:esc(o.text)});
      else if(isS)res.items.push({st:'bad',t:esc(o.text)});
    });
  }else if(inst.type==='order'){
    var arr=inst.disp||[],N=arr.length,H=0,W=0;
    arr.forEach(function(id,i){
      var item='';ex.items.forEach(function(it){if(it.id===id)item=it.text;});
      var good=ex.items[i].id===id;
      if(good){H++;res.items.push({st:'ok',t:'Position '+(i+1)+': '+esc(item)});}
      else{W++;res.items.push({st:'bad',t:'Position '+(i+1)+': '+esc(item)+' — should be: '+esc(ex.items[i].text)});}
    });
    res.credit0=Math.max(0,(H-W)/N);
  }else if(inst.type==='match'){
    var cnt=0,Wm=0,N=ex.pairs.length;
    inst.lefts.forEach(function(l){
      var oi=parseInt(l.id.slice(1),10);
      var chosen=inst.pairMap[l.id];
      if(chosen==='R'+oi){cnt++;res.items.push({st:'ok',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)});}
      else if(chosen){
        Wm++;
        var txt='';inst.rights.forEach(function(r){if(r.id===chosen)txt=r.text;});
        res.items.push({st:'bad',t:esc(ex.pairs[oi].l)+' → '+esc(txt)+' (wrong partner)'});
      }else res.items.push({st:'miss',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)+' (missed)'});
    });
    res.credit0=Math.max(0,(cnt-Wm)/N);
  }else if(inst.type==='drag'){
    var okN=0,Wn=0,N2=ex.slots.length;
    ex.slots.forEach(function(s,i){
      var id=inst.place?inst.place[String(i)]:null;
      var item=null;
      if(id!=null)inst.bank.forEach(function(b){if(b.id===id)item=b;});
      if(item&&item.ok&&String(item.slot)===String(i)){okN++;res.items.push({st:'ok',t:esc(s.label)+': '+esc(item.text)});}
      else if(item){
        Wn++;
        var why=(item.ok&&item.slot!==undefined&&String(item.slot)!==String(i))?' — right idea, wrong slot':' — wrong item here';
        res.items.push({st:'bad',t:esc(s.label)+': '+esc(item.text)+why});
      }
      else{
        var right='';ex.bank.forEach(function(b){if(b.ok&&b.slot===i)right=b.text;});
        res.items.push({st:'miss',t:esc(s.label)+': '+esc(right)+' (missed)'});
      }
    });
    res.credit0=Math.max(0,(okN-Wn)/N2);
  }else if(inst.type==='fill'){
    var vals=inst.raw||[],H2=0,W2=0,N3=ex.answers.length;
    ex.answers.forEach(function(a,i){
      var v=vals[i]||'';
      if(norm(v)===norm(a)){H2++;res.items.push({st:'ok',t:'Blank '+(i+1)+': '+esc(a)});}
      else if(v){W2++;res.items.push({st:'bad',t:'Blank '+(i+1)+': you chose "'+esc(v)+'" — answer is "'+esc(a)+'"'});}
      else res.items.push({st:'miss',t:'Blank '+(i+1)+': '+esc(a)+' (left empty)'});
    });
    res.credit0=Math.max(0,(H2-W2)/N3);
  }else if(inst.type==='terminal'){
    gradeTerminal(inst,res);
  }else if(inst.type==='branch'){
    var N4=ex.steps.length,H3=0,W3=0;
    ex.steps.forEach(function(s,i){
      var got=inst.stepRaws[i];
      if(got===s.correct){H3++;res.items.push({st:'ok',t:'Step '+(i+1)+': '+esc(s.short||'correct')});}
      else{
        if(got)W3++;
        var badTxt='';
        if(got){s.options.forEach(function(o){if(o.id===got)badTxt=o.text;});}
        res.items.push({st:'bad',t:'Step '+(i+1)+': you chose "'+esc(badTxt||'(no answer)')+'" — better: '+esc(s.short||s.correct)});
      }
    });
    res.credit0=Math.max(0,(H3-W3)/N4);
  }
  var used=E.hint[inst.ex.id];
  var credit=Math.max(0,res.credit0-(used?0.10:0));
  inst.credit=credit;
  if(credit>=0.999){res.cls='ok';res.label='CORRECT';}
  else if(credit>0){res.cls='part';res.label='PARTIALLY CORRECT';}
  else{res.cls='bad';res.label='INCORRECT';}
  res.credit=credit;res.hintUsed=used;
  return res;
}
function gradeTerminal(inst,res){
  var sh=inst.ex.shell,els=sh.elements||[];
  var n=inst.lastCmd||'';
  var H=0,W=0;
  els.forEach(function(e){
    if(n&&e.re.test(n)){H++;res.items.push({st:'ok',t:'Element: '+esc(e.label)});}
    else res.items.push({st:'miss',t:'Element: '+esc(e.label)+(n?' (missing)':' (no command run)')});
  });
  var dang=null;
  (sh.forbidden||[]).forEach(function(f){if(n&&f.re.test(n)){W++;dang=f;}});
  if(dang)res.items.push({st:'bad',t:'⚠ '+esc(dang.label)});
  res.credit0=Math.max(0,(H-W)/els.length);
  if(dang)res.detail+='<div class="study">⚠ <b>Close but dangerous:</b> '+dang.warn+'</div>';
  res.detail+='<div class="art canon"><div class="art-l">Canonical command</div>'+
    '<pre class="code" data-canon>'+esc(sh.canon)+'</pre>'+
    '<div class="blk-b"><button type="button" class="btn light copybtn" data-copy>Copy command</button></div></div>'+
    (sh.canonExpl?('<div class="fb-ex">'+sh.canonExpl+'</div>'):'');
}
/* ---------------- check / next / pause / hint / skip ---------------- */
function onCheck(inst,ablk,fbEl,btn){
  var ex=inst.ex;
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(inst.type==='order'){
    var list=$('.ordlist',ablk);
    if(list){var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});inst.disp=ids;}
  }
  if(inst.type==='drag'&&inst.__draw)inst.__draw();
  /* FIRST action: auto-pause before rendering feedback */
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  disableWidget(ablk);
  renderFeedback(inst,res,fbEl);
  updateHeader();
  /* swap button to Next / Final Submit */
  var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
  btn.textContent=last?'Final Submit':'Next &#9654;';
  btn.innerHTML=last?'Final Submit':'Next &#9654;';
  btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  var noteEl=$('.acts .note',ablk);
  if(noteEl)noteEl.textContent=(tState()===TS.PA)?'Timer paused while you study this feedback. Press Next to continue — the timer restarts then.':'';
  syncHeaderButtons();
}
function autoCheck(){
  var inst=curInst();
  if(!inst||inst.checked)return;
  var ablk=ablkOf(inst),fbEl=fbElOf(inst),btn=$('#bCheck');
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  if(ablk)disableWidget(ablk);
  if(fbEl)renderFeedback(inst,res,fbEl);
  updateHeader();
  if(btn){
    var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
    btn.innerHTML=last?'Final Submit':'Next &#9654;';
    btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  }
}
function disableWidget(ablk){
  $all('button, input, select',ablk).forEach(function(x){

}
function markOptions(inst,ablk){
  var ex=inst.ex;
  if(inst.type==='choice'||inst.type==='multi'){
    var opts=$all('.opt',ablk);
    var ids=[];
    inst.opts.forEach(function(o,i){
      var elx=opts[i];

      }else{
        var isC=ex.correct.indexOf(o.id)>=0,isS=(inst.raw||[]).indexOf(o.id)>=0;
        if(isC&&isS)elx.classList.add('state-ok');
        else if(isC)elx.classList.add('state-miss');

      }

function renderFeedback(inst,res,fbEl){
  markOptions(inst,$('.excard .b-answer',$('#stage')));
  var creditTxt='';
  var nItems=0;
  if(inst.type==='multi'||inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill'||inst.type==='terminal'||inst.type==='branch'){
    var N=0;
    if(inst.type==='multi')N=inst.ex.correct.length;
    else if(inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill')N=res.items.length;
    else if(inst.type==='terminal')N=inst.ex.shell.elements.length;
    else if(inst.type==='branch')N=inst.ex.steps.length;
    var itemsRight=0,itemsWrong=0;
    res.items.forEach(function(it){if(it.st==='ok')itemsRight++;else if(it.st==='bad')itemsWrong++;});
    creditTxt='<span class="credit-chip">credit '+res.credit.toFixed(2)+(N?' — '+itemsRight+' correct'+(itemsWrong?', '+itemsWrong+' wrong':'')+' of '+N+' items':'')+'</span>';
  }
  var icon=res.cls==='ok'?'&#10003;':(res.cls==='part'?'&#10003;':'&#10007;');
  var html='<div class="fb-h"><span class="fi" style="font-size:18px">'+icon+'</span><span>'+res.label+'</span>'+creditTxt+
    (res.hintUsed?'<span class="credit-chip">hint used: &minus;10% applied</span>':'')+'</div>';
  html+='<div class="fb-b">';
  if(res.items.length)html+='<ul class="fb-items">'+res.items.map(function(it){
    var ic=it.st==='ok'?'<span class="fi ok">&#10003;</span>':(it.st==='bad'?'<span class="fi bad">&#10007;</span>':'<span class="fi miss">&#9675;</span>');
    var w=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
    return '<li>'+ic+'<span><b>'+w+'</b> — '+it.t+'</span></li>';
  }).join('')+'</ul>';
  html+='<div class="fb-ex">'+inst.ex.explain+'</div>';
  if(res.detail)html+=res.detail;
  html+='</div>';
  fbEl.innerHTML='';
  fbEl.appendChild(el('div','fb '+res.cls,html));
  var cb=$('[data-copy]',fbEl);
  if(cb)cb.addEventListener('click',function(){
    var txt=$('[data-canon]',fbEl).textContent;
    try{navigator.clipboard.writeText(txt);}catch(e){}
    cb.textContent='Copied';
  });
  fbEl.scrollIntoView({behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth',block:'nearest'});
}
function onNext(inst,ablk,fbEl,btn){
  if(tState()===TS.PA){
    if(E.timer.remaining>0)setTS(TS.R);else setTS(TS.EN);
  }
  var fromReview=inst.fromReview;

    inst.fromReview=false;
    renderReview();

  }
  if(E.idx<E.inst.length-1){
    E.idx++;renderExercise();

    var pending=E.skipped.filter(function(i){return !E.inst[i].checked;});

/* ---------------- results ---------------- */
function renderResults(timeout){
  E.phase='results';
  if(tState()!==TS.EN)setTS(TS.EN);
  updateHeader();
  var st=$('#stage');
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skipped=0,i;
  for(i=0;i<E.inst.length;i++){
    var inst=E.inst[i];
    if(inst.checked){answered++;sum+=inst.credit;
      if(inst.credit>=0.999)full++;
      else if(inst.credit>0){part++;partSum+=inst.credit;}
      else zero++;
    }else skipped++;
  }
  var pct=answered>0?Math.round((sum/answered)*100):0;
  var passed=pct>=70;
  var d=E.d;
  var sealSvg='<svg class="c-seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d3f" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="#2a2413" stroke="#b08d3f" stroke-width="2"/><path d="M32 52 L45 65 L70 38" fill="none" stroke="#e0b95c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var panel=passed?

window.EXAM_DATA={
brand:"MITRE ATT&CK · T1659 Content Injection",
meta:{topicId:"t1659",batch:3,title:"T1659 Content Injection — HARD",difficulty:"hard",questionCount:16,estimatedMinutes:40,passMark:70},
severity:"HARD",sevClass:"sev-hard",techniqueId:"T1659",techniqueName:"Content Injection",
timerSeconds:40*60,
intro:{
headline:"T1659 — Content Injection — HARD practice exam",
entityTitle:"About MITRE ATT&CK T1659 — Content Injection",
entityHtml:"<p><b>The object.</b> T1659 is a <b>Technique</b> (no sub-techniques) in MITRE ATT&CK, named <b>Content Injection</b>. It belongs to two tactics: <b>Initial Access</b> (TA0001) and <b>Command and Control</b> (TA0011). Platforms: <b>Linux, Windows, macOS</b>.</p>"+
"<p><b>The behaviour.</b> The attacker does not host a malicious site and wait for victims (the drive-by pattern: Drive-by Target T1608.004 then Drive-by Compromise T1189). The attacker reaches into channels the victim already uses and injects content into the replies. <b>From the middle</b>: in-between the legitimate online client-server communications — similar but distinct from Adversary-in-the-Middle (T1557), which ATT&CK limits to enterprise environments. <b>From the side</b>: an unsolicited fake reply that races the legitimate server's response. Injection often originates in compromised upstream channels — at the <b>ISP level</b>, including abused 'lawful interception' systems. Channels on the page: <b>DNS, HTTP, SMB replies</b>. The same channel later delivers additional payloads (Ingress Tool Transfer, T1105).</p>"+
"<p><b>Detection.</b> Strategy <b>DET0349</b>: <b>AN0992</b> Windows (browser-triggered suspicious file creation — %AppData%, Temp — followed by process execution; correlate network anomalies with local execution), <b>AN0993</b> Linux (curl/wget saving executables or scripts to /tmp or /var/tmp then execution; packet captures and IDS/IPS alerts for injected responses or mismatched content types), <b>AN0994</b> macOS (unified logs; processes spawned from Safari or other browsers immediately loading scripts or executables; drops in ~/Library/Caches or ~/Downloads executing shortly after write).</p>"+
"<p><b>Mitigations.</b> <b>M1041 Encrypt Sensitive Information</b> — encrypt online traffic, e.g. trusted VPNs; note the trade-off: your trust moves to the provider, and encrypted traffic is opaque to your own network inspection. <b>M1021 Restrict Web-Based Content</b> — block download/transfer and execution of potentially uncommon file types.</p>"+
"<p><b>Real cases.</b> <b>MoustachedBouncer</b> (G1019) conducted espionage against foreign diplomats in Belarus through ISP-level content injection into DNS, HTTP and SMB replies, redirecting specifically-targeted victims to a fake Windows Update page; the tool is <b>Disco</b> (S1088). At HARD level you will correlate these facts with artefacts, separate near-miss answers, and pick the least aggressive correct action.</p>",
workHtml:"<ul>"+
"<li><b>SOC analysts (senior):</b> you correlate gateway PCAP, proxy logs, EDR timelines and resolver logs — and defend your conclusion against near-miss explanations.</li>"+
"<li><b>Detection engineers:</b> you map signals to AN0992/0993/0994, know each analytic's false-positive profile, and tune by parent-child chains instead of file names.</li>"+
"<li><b>Incident responders:</b> you preserve volatile evidence (PCAP before failover) and choose read-only triage commands on live systems.</li>"+
"<li><b>CTI analysts:</b> you brief leadership on MoustachedBouncer/Disco without overclaiming attribution.</li>"+
"<li><b>Red and blue teams:</b> one exercise in this file asks you to play both sides of the same injection.</li></ul>",
extraNotes:["<b>Terminal exercises:</b> two fake terminals. No tool is named — you pick the tool, the options and the target. Near-miss flags exist; wrong or dangerous flags are not forgiven.","<b>Traps on purpose:</b> several exercises include an 'alarming but benign' path, a 'benign but alarming' path, and cases where the least aggressive action is the correct one."]
},
keywords:[
{theme:"Technique identity and framework position",items:["T1659 Content Injection","Technique — no sub-techniques","Initial Access (TA0001)","Command and Control (TA0011)","Platforms: Linux, Windows, macOS"]},
{theme:"Injection modes and adversary behaviour",items:["From the middle","From the side (man-on-the-side)","Fake reply races the real one","Unsolicited duplicate responses","Compromised data-transfer channels","Upstream compromise (ISP level)","Lawful interception abuse","vs Drive-by Target (T1608.004) / Drive-by Compromise (T1189)","similar but distinct vs Adversary-in-the-Middle (T1557)"]},
{theme:"Protocols and delivery vectors",items:["DNS replies","HTTP replies","SMB replies","Redirect to malicious download","Fake Windows Update page","Ingress Tool Transfer (T1105)"]},
{theme:"Telemetry and data sources",items:["Browser-triggered file creation","Process execution after write","%AppData% and Temp","/tmp and /var/tmp","curl and wget","PCAP","IDS/IPS alerts","Mismatched content types","macOS unified logs","Safari child processes","~/Library/Caches","~/Downloads"]},
{theme:"Detection strategy and analytics",items:["DET0349","AN0992 (Windows)","AN0993 (Linux)","AN0994 (macOS)","Network-to-host correlation","False-positive profile and tuning","Coverage gaps"]},
{theme:"Mitigations and controls",items:["M1041 Encrypt Sensitive Information (trusted VPNs)","M1021 Restrict Web-Based Content (uncommon file types)","Encryption blinds network inspection","Control trade-offs"]},
{theme:"Real-world examples and attribution",items:["Disco (S1088)","MoustachedBouncer (G1019)","Espionage against foreign diplomats in Belarus","ISP-level lawful-intercept abuse","Fake Windows Update lure","Public reporting, 2023"]}

window.EXAM_DATA.exercises=[
{id:"h01",type:"choice",title:"Where is the injector?",summary:"Duplicate answers with clean enterprise infra.",
scenario:{summary:"The injection did not happen inside your perimeter.",
intro:"<p>You correlate artefacts after a suspicious download on <code>ws-4471</code>. Everything inside the enterprise checks out. The gateway tap shows the client's path.</p>",
artefacts:[{label:"ARTEFACT 1 — Gateway PCAP summary (client path)",code:"DNS  q=A updates[.]vendor-cdn[.]example\n  resp A: 198[.]51[.]100[.]25   ttl=118   (authoritative)\n  resp B: 203[.]0[.]113[.]77    ttl=61    injected 40ms after resp A  (unsolicited)\nHTTP  200 served from 203[.]0[.]113[.]77\n  content-type mismatch; body begins with MZ [PE binary]",light:false},
{label:"ARTEFACT 2 — Enterprise infra checks",code:"resolver 10[.]1[.]0[.]53 : clean logs, no overrides, 90-day config intact\nproxy    10[.]1[.]0[.]80 : no rule edits in 90 days\nws-4471  EDR            : no local DNS tampering, no hosts-file change",light:true}]},
question:"Which conclusion is best supported by the artefacts?",
options:[{id:"A",text:"Injection on the upstream path, outside the enterprise"},{id:"B",text:"The on-prem proxy was reconfigured to inject responses"},{id:"C",text:"Malware on ws-4471 hijacked its own DNS resolution"},{id:"D",text:"The resolver cache was poisoned by another workstation"}],
correct:"A",
hint:"Everything inside the enterprise checks out clean. Ask where resp B must have been written onto the path.",
explain:"<p>Resp B appears on the client's path with a <b>different IP and a much shorter TTL</b> while every enterprise component is clean — the rewrite happened <b>upstream</b>, on the wire, which is T1659 from the middle or side. A reconfigured proxy (B) is contradicted by the proxy's own config history; local malware (C) by the EDR check; resolver poisoning (D) by the resolver logs. Near-miss answers are individually plausible — the artefacts eliminate each one.</p>"},
{id:"h02",type:"multi",title:"Injection vs drive-by",summary:"Select the artefacts that support injection, not drive-by.",
scenario:{summary:"Which artefacts argue against T1189?",
intro:"<p>Same case. A colleague insists this is drive-by compromise (T1189). Select every artefact that supports content injection instead.</p>"},
question:"Which artefacts support content injection rather than drive-by compromise?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"The victim fetched a site it normally uses"},{id:"B",text:"A second, unsolicited reply arrived on the same request"},{id:"C",text:"The second reply's content type did not match its body"},{id:"D",text:"The victim browsed to a brand-new attacker-registered domain"},{id:"E",text:"The payload was staged on attacker infrastructure for victims to visit"}],
correct:["A","B","C"],
hint:"Drive-by needs the victim to come to the attacker's staging. Injection comes to the victim.",
explain:"<p>Injection signatures: a <b>normal destination</b> (A), an <b>unsolicited duplicate reply</b> (B), a <b>content-type mismatch</b> (C). Options D and E describe the drive-by pattern — the victim visiting attacker-staged infrastructure. T1659 inverts that: the attacker reaches into a trusted channel. This distinction is exactly how the ATT&CK description frames the technique against T1608.004 + T1189.</p>"},
{id:"h03",type:"branch",title:"Think-tank incident",summary:"Diplomat-targeted fake update — three decisions.",
scenario:{summary:"Sector-matching targeting, fake update payload executed.",
intro:"<p>Org: a policy think-tank that hosts foreign diplomats — the exact sector MoustachedBouncer targeted in published research. 09:12, ticket <b>#88-104</b>, CISO wants a plan in 30 minutes.</p>",
artefacts:[{label:"ARTEFACT 1 — EDR timeline",code:"09:10:42 chrome.exe  GET hxxp://update-win11[.]example/defender.bin\n09:10:44 file write  C:\\Users\\elena\\AppData\\Local\\Temp\\winupdate.vbs\n09:12:11 wscript.exe ...\\Temp\\winupdate.vbs\n09:12:40 wscript.exe -> 203[.]0[.]113[.]77:80   (beacon)",light:false},
{label:"ARTEFACT 2 — Gateway note",code:"Our own proxy saw no unsolicited response on this flow.\nUpstream provider path was in scope of previous ISP incidents.",light:true}]},
hint:"Volatile network evidence dies first. And match the analytic to the operating system before you quote it.",
steps:[
{q:"Before any containment — what must you collect first?",short:"Preserve PCAP and export the payload first",
 options:[{id:"A",text:"Preserve gateway PCAP and export the dropped payload for analysis"},{id:"B",text:"Reimage the laptop immediately to remove the attacker"},{id:"C",text:"Delete the VBS so no one else can run it"},{id:"D",text:"Wait until the user confirms the page looked odd"}],correct:"A"},
{q:"Which DET0349 analytic applies to this Windows case?",short:"AN0992 (Windows browser write-then-run)",
 options:[{id:"A",text:"AN0992 — Windows: browser-triggered write then execution"},{id:"B",text:"AN0993 — Linux: curl/wget payloads to /tmp"},{id:"C",text:"AN0994 — macOS: Safari child processes"},{id:"D",text:"None — T1659 has no analytics"}],correct:"A"},
{q:"Which containment is the LEAST aggressive correct step?",short:"Block domain at egress and isolate one host",
 options:[{id:"A",text:"Block the delivering domain at egress and isolate the one host"},{id:"B",text:"Reimage the entire laptop fleet tonight"},{id:"C",text:"Cut the office internet until Monday"},{id:"D",text:"Wait for more infections before acting"}],correct:"A"}],
explain:"<p><b>Step 1.</b> PCAP and the payload are <b>volatile evidence</b> — reimaging or deleting destroys exactly what IR needs to prove upstream injection. Collect first, contain second.</p><p><b>Step 2.</b> Windows paths, a browser parent, write-then-run — that is <b>AN0992</b>. AN0993 and AN0994 are the Linux and macOS analytics: plausible near-misses that fail on platform.</p><p><b>Step 3.</b> The <b>least aggressive correct</b> action is an egress block plus isolating one host. Fleet reimaging and an office outage are disproportionate; waiting lets the beacon continue. The sector targeting (diplomats) plus the fake update lure matches the MoustachedBouncer playbook — worth flagging to CTI.</p>"},
{id:"h04",type:"terminal",title:"Capture DNS evidence",summary:"Fake terminal: packet capture on the tap.",
scenario:{summary:"Preserve DNS traffic as evidence on the tap.",
intro:"<p>You are on the <b>gateway tap host</b> (root, Ubuntu). Interface <code>tap0</code> carries the monitored path. You must preserve <b>DNS traffic as evidence</b> for the injected-reply case, writing to <code>/var/tmp/dns_evidence.pcap</code>. No tool is named — you choose it.</p>"},
question:"Produce the capture: interface tap0, write to /var/tmp/dns_evidence.pcap, DNS traffic only (port 53).",
shell:{
banner:"Ubuntu 22.04 — gateway tap host (root)\nObjective: preserve DNS packets as evidence. Choose the right tool yourself.",
prompt:"root@gw-tap:~# ",
expectRe:/^tcpdump(?=[^;|]*\btap0\b)(?=[^;|]*-w\s+\/var\/tmp\/dns_evidence\.pcap\b)/,
out:"listening on tap0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n^C\n412 packets captured\n412 packets received by filter\n0 packets dropped by kernel",
errOut:"bash: invalid option or syntax — nothing captured\n(usage line printed)",
elements:[{re:/(^|\s)tcpdump(\s|$)/,label:"tcpdump (the packet-capture tool)"},{re:/(^|\s)-i\s+tap0(\s|$)/,label:"-i tap0 (the monitored interface)"},{re:/(^|\s)-w\s+\/var\/tmp\/dns_evidence\.pcap\b/,label:"-w /var/tmp/dns_evidence.pcap (the evidence file)"},{re:/port\s+53\b|udp\s+port\s+53\b/,label:"the DNS filter (port 53)"}],
forbidden:[{re:/(^|\s)-r(\s|$)/,label:"-r reads a file instead of capturing",out:"tcpdump: reading packets from file — nothing was captured live",warn:"-r reads an EXISTING file. The evidence was never captured."},
{re:/(rm\s+\/var\/tmp|>\s*\/var\/tmp\/dns_evidence)/,label:"overwriting or deleting the evidence path",out:"\u26a0 prior evidence at this path was destroyed",warn:"A shell redirect (>) or rm on the evidence path destroys prior captures. -w on a fresh file is the safe form."},
{re:/(^|\s)-a(\s|$)/,label:"-A prints ASCII instead of writing a capture",out:"(packets printed to the screen; no evidence file was written)",warn:"-A prints human-readable packets to the screen. The forensic pcap is never written."}],
canon:"tcpdump -i tap0 -w /var/tmp/dns_evidence.pcap port 53",
canonExpl:"<ul><li><b>tcpdump</b> — the standard packet-capture tool.</li><li><b>-i tap0</b> — capture the monitored tap interface; the wrong NIC captures nothing useful.</li><li><b>-w file</b> — write raw packets to a pcap (the evidence artefact).</li><li><b>port 53</b> — keep DNS only; small file, focused evidence.</li></ul>"},
hint:"One classic tool captures packets on Linux. It needs the interface, an output file, and the DNS port.",
explain:"<p>Canonical: <code>tcpdump -i tap0 -w /var/tmp/dns_evidence.pcap port 53</code>. Every element is load-bearing: the right <b>interface</b>, <b>-w</b> to actually write the file, the <b>port filter</b> to keep it small. <b>Dangerous near-misses:</b> <code>-r</code> reads instead of capturing, <code>-A</code> prints to screen so no evidence file exists, and a redirect or rm destroys prior evidence. In IR, the capture IS the case.</p>"},
{id:"h05",type:"fill",title:"macOS analytic",summary:"Name the analytic that covers the Safari drop.",
scenario:{summary:"A Safari child process runs a script.",
intro:"<p>macOS laptop <code>mac-118</code>: <code>Safari</code> downloaded <code>launcher.sh</code> into <code>~/Downloads</code>; two seconds later a shell process ran it. The unified log shows Safari as the parent.</p>"},
question:"Complete the two blanks: which analytic covers this case?",
text:"This case is covered by analytic AN___ , the unified-log analytic for ___ .",
answers:["0994","macOS"],
bank:["0994","0993","0992","macOS","Linux","Windows"],
hint:"The platform decides the analytic number: 92 is Windows, 93 is Linux, 94 is the Mac.",
explain:"<p><b>AN0994</b>: processes spawned from Safari or other browsers that immediately load scripts or executables, and file drops in <b>~/Library/Caches or ~/Downloads</b> executing shortly after being written. AN0992 fails on paths (%AppData% is Windows), AN0993 fails on tooling (curl/wget, /tmp) — near-misses that die on platform. macOS is explicitly a T1659 platform, so no answer says 'out of scope'.</p>"},
{id:"h06",type:"match",title:"Tell-tale evidence",summary:"Match each channel to its injection fingerprint.",
scenario:{summary:"What each injected channel looks like in evidence.",
intro:"<p>Match each channel to the tell-tale evidence you would actually observe.</p>"},
question:"Match each channel to its tell-tale evidence.",
pairs:[{l:"Injected DNS reply",r:"Second A answer, different IP, shorter TTL"},{l:"Injected HTTP reply",r:"Unsolicited duplicate response with a content-type mismatch"},{l:"Injected SMB reply",r:"File-share response pointing to an unexpected path"},{l:"HTTPS with certificate pinning",r:"Injection fails — the client rejects the faked channel"}],
hint:"Duplicates and mismatches on the web, odd second answers in DNS, wrong paths in file shares — and one entry is the control that breaks the trick.",
explain:"<p>DNS injection leaves a <b>second answer</b> with a different IP and a short TTL (keep the victim pinned). HTTP leaves <b>unsolicited duplicates with mismatched content types</b> — the AN0993 IDS check. SMB replies can redirect the client to an <b>unexpected file path</b>. Pinned HTTPS usually <b>breaks</b> injection — which is exactly why the page prescribes M1041 encryption.</p>"},
{id:"h07",type:"multi",title:"Defensive package",summary:"Select every true statement for the CISO.",
scenario:{summary:"What actually reduces the risk?",
intro:"<p>The CISO asks what genuinely reduces T1659 risk. Select every true statement.</p>"},
question:"Which statements are true?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"TLS on protected flows stops third parties from injecting into them"},{id:"B",text:"A VPN moves trust to its provider — vet the provider"},{id:"C",text:"M1021-style blocking of uncommon file types limits payload execution"},{id:"D",text:"Encrypting traffic helps IDS/IPS see injected content"},{id:"E",text:"Keeping some plain HTTP helps defenders inspect content"}],
correct:["A","B","C"],
hint:"Two options reverse the real effect of encryption.",
explain:"<p>A, B and C are the honest package: encryption removes third-party read/change on the wire, the VPN provider becomes your new trust anchor, and M1021 limits what a payload can do if a flow was still exposed. <b>D is backwards</b> — encryption blinds network inspection, including your own IDS; that is the trade-off you accept. <b>E</b> describes exactly the exposure the attacker needs.</p>"},
{id:"h08",type:"order",title:"Response sequence",summary:"Order the five response steps.",
scenario:{summary:"Evidence first, tuning last.",
intro:"<p>An injected response was confirmed. These five response steps are shuffled.</p>"},
question:"Order the five response steps for this case.",
items:[{id:"s1",text:"Preserve volatile evidence: capture the path with PCAP before failover"},{id:"s2",text:"Export and hash the dropped payload from the endpoint"},{id:"s3",text:"Block the delivering domain at egress"},{id:"s4",text:"Tune the matching analytic to cut false positives"},{id:"s5",text:"Brief the CISO with the correlated findings"}],
hint:"Evidence before containment; tuning and reporting come after the fire is out.",
explain:"<p>1) Volatile <b>PCAP</b> first — failover and TTL churn erase it. 2) Export and <b>hash</b> the payload. 3) <b>Block</b> the delivery channel. 4) <b>Tune</b> the analytic once the incident is stable. 5) <b>Brief</b> the CISO with correlated findings. Aggressive early actions can destroy the evidence your report depends on — sequencing is part of the job.</p>"},

{id:"h09",type:"terminal",title:"Classify the sample",summary:"Fake terminal: identify the dropped file's type.",
scenario:{summary:"What IS this file?",
intro:"<p>Linux host <code>web-09</code>. AN0993 flagged a file written to <code>/var/tmp/winupdate.bin</code> that executed two minutes later. Before uploading it to the sandbox, you must classify <b>what kind of file</b> it is. No tool is named.</p>"},
question:"Identify the file type of /var/tmp/winupdate.bin.",
shell:{
banner:"Debian 12 — web-09 (forensic shell, root)\nObjective: identify the file type. Read-only. Choose the tool yourself.",
prompt:"root@web-09:~# ",
expectRe:/^file\s+[^;|]*\/var\/tmp\/winupdate\.bin/,
out:"/var/tmp/winupdate.bin: ELF 64-bit LSB executable, x86-64, dynamically linked, stripped",
errOut:"bash: syntax error near unexpected token\n(usage error printed)",
elements:[{re:/(^|\s)file(\s|$)/,label:"the file tool (magic-byte classification)"},{re:/(^|\s)\/var\/tmp\/winupdate\.bin(\s|$)/,label:"the exact target path"}],
forbidden:[{re:/(^|\s)cat(\s|$)/,label:"cat dumps the binary",out:"(binary garbage floods the terminal; nothing was classified)",warn:"cat prints binary garbage and classifies nothing — and can wreck your terminal session."},
{re:/(^|\s)stat(\s|$)/,label:"stat shows only metadata",out:"  Size: 18432  Blocks: 40 ... (no format information)",warn:"stat gives size and timestamps, not the format. The task asks what the file IS."},
{re:/(^|\s)(sh|bash|chmod|\+x|\.\/)/,label:"executing or arming the sample",out:"\u26a0 You just ran or made executable the untrusted sample on a live host",warn:"Executing (or chmod +x) the sample is the attacker's goal, not yours. Never run untrusted code on production."}],
canon:"file /var/tmp/winupdate.bin",
canonExpl:"<ul><li><b>file</b> — reads the magic bytes and names the format, safely, without running it.</li><li><b>/var/tmp/winupdate.bin</b> — the dropped sample AN0993 flagged.</li><li>Result: an <b>ELF executable</b> — a Linux program, not a document. It belongs in the sandbox, in a cage.</li></ul>"},
hint:"The tool's name is the question. It reads magic bytes and prints the format.",
explain:"<p>Canonical: <code>file /var/tmp/winupdate.bin</code> → ELF executable. <b>Near-misses:</b> <code>stat</code> gives metadata only; <code>cat</code> dumps garbage; anything that executes or chmods the sample plays the attacker's game. This is a different skill from the capture exercise earlier: classify, do not collect.</p>"},
{id:"h10",type:"fill",title:"CISO question",summary:"Does encryption end the risk?",
scenario:{summary:"Answer the CISO honestly.",
intro:"<p>CISO: 'We bought a respected VPN and force TLS everywhere. Can content injection still reach us? Answer in three blanks.'</p>"},
question:"Complete the three blanks for the honest CISO answer.",
text:"Encryption removes ___-party injection on protected flows, but the technique operates on the ___ . A misused ___ provider — or any legacy plain-HTTP flow — keeps the door open.",
answers:["third","path","VPN"],
bank:["third","path","VPN","second","firewall","binary"],
hint:"Ask where the technique happens and who sits there even after encryption.",
explain:"<p>Encryption removes <b>third</b>-party injection on protected flows, but the technique operates on the <b>path</b> itself. A malicious or misused <b>VPN</b> provider — or any other compromised upstream, or a legacy plain-HTTP flow — keeps the door open. Note the page's own wording: '<b>trusted</b> VPNs' — the trust question is built into the mitigation. 'The risk is gone' would give the board false comfort.</p>"},
{id:"h11",type:"multi",title:"Resolver log review",summary:"Find the injected DNS replies in the log.",
scenario:{summary:"Two answers do not belong.",
intro:"<p>Resolver-side capture from the gateway. The authoritative answers for the update CDN arrive seconds apart — but so do two lines that do not belong.</p>",
logs:[{label:"ARTEFACT 1 — Resolver query log (filterable)",lines:[
"09:02:11 q=A updates[.]vendor-cdn[.]example ans=198[.]51[.]100[.]25 ttl=300 via=auth",
"09:02:11 q=A updates[.]vendor-cdn[.]example ans=203[.]0[.]113[.]77 ttl=60 via=on-path dup",
"09:04:31 q=A cdn[.]vendor-cdn[.]example ans=198[.]51[.]100[.]26 ttl=300 via=auth",
"09:07:02 q=AAAA updates[.]vendor-cdn[.]example ans=2001:db8::25 ttl=300 via=auth",
"09:11:47 q=A mail[.]vendor[.]example ans=198[.]51[.]100[.]10 ttl=3600 via=auth",
"09:15:22 q=A updates[.]vendor-cdn[.]example ans=198[.]51[.]100[.]25 ttl=300 via=auth",
"09:15:22 q=A updates[.]vendor-cdn[.]example ans=203[.]0[.]113[.]90 ttl=55 via=on-path dup",
"09:18:09 q=A intranet[.]corp[.]local ans=10[.]1[.]0[.]20 ttl=600 via=internal",
"09:21:33 q=A updates[.]vendor-cdn[.]example ans=198[.]51[.]100[.]25 ttl=300 via=auth",
"09:24:58 q=A telemetry[.]vendor[.]example ans=198[.]51[.]100[.]40 ttl=120 via=auth"]}]},
question:"Select the TWO lines that show injected DNS replies.",
selectNote:"Two lines are correct. Wrong picks subtract from correct ones. Use the filter if you need it.",
options:[{id:"A",text:"09:02:11 ans=203[.]0[.]113[.]77 ttl=60 via=on-path dup"},{id:"B",text:"09:15:22 ans=203[.]0[.]113[.]90 ttl=55 via=on-path dup"},{id:"C",text:"09:04:31 ans=198[.]51[.]100[.]26 ttl=300 via=auth"},{id:"D",text:"09:18:09 ans=10[.]1[.]0[.]20 ttl=600 via=internal"}],
correct:["A","B"],
hint:"Filter 'dup' or the 203[.]0[.]113 prefix — and note how short those TTLs are.",
explain:"<p>Both <b>on-path dup</b> lines carry a <b>different IP with a drastically shorter TTL</b> than the authoritative answer recorded seconds earlier — the injected-answer fingerprint. The short TTL keeps the victim pinned to the malicious IP. The other lines are normal authoritative or internal answers.</p>"},
{id:"h12",type:"match",title:"False positives and tuning",summary:"Match each analytic to its FP risk and tuning.",
scenario:{summary:"Every analytic has a noisy twin.",
intro:"<p>Match each analytic to its main false-positive risk — and the tuning idea that actually fits it.</p>"},
question:"Match each analytic to its false-positive risk and tuning idea.",
pairs:[{l:"AN0992 — browser writes then runs",r:"Users really open downloads — tune by the parent-child chain, not file names"},{l:"AN0993 — curl/wget to /tmp then runs",r:"Admins install tools this way — allow-list known admin hosts"},{l:"AN0994 — Safari child loads a script",r:"Safari opens PDFs and DMGs — scope to script and executable drops"}],
hint:"Each tuning idea must match the analytic's own platform and signal — not another one's.",
explain:"<p>False positives come from <b>legitimate versions of the same pattern</b>: users open downloads (AN0992), admins run curl/wget installers (AN0993), Safari legitimately opens documents (AN0994). Tuning therefore keys on the <b>parent-child chain</b>, <b>known admin hosts</b>, and <b>script/executable drops only</b> — never on file names, which attackers rotate for free.</p>"},
{id:"h13",type:"fill",title:"Report wording",summary:"Complete the detection strategy sentence.",
scenario:{summary:"Correlation is the core idea.",
intro:"<p>Your report must state the detection strategy's core logic in its own words. Fill the two blanks.</p>"},
question:"Fill the two blanks exactly as the detection strategy words it.",
text:"Report: the injected reply pointed the client to hxxp://update-win11[.]example/payload.bin. Per DET0349, we correlate network ___ with subsequent local process creation or ___ execution.",
answers:["anomalies","script"],
bank:["anomalies","script","deletion","rotation"],
hint:"The network side sees something strange; the host side sees code start.",
explain:"<p>DET0349's core idea: correlate <b>network anomalies</b> with <b>process creation or script execution</b> on the host. Neither signal alone is proof; together they catch injection even when the payload rotates its file name. 'Deletion' and 'rotation' are events defenders see — but they are not what this strategy correlates.</p>"},
{id:"h14",type:"choice",title:"Who is this?",summary:"What distinguishes MoustachedBouncer?",
scenario:{summary:"Targeting is the tell.",
intro:"<p>You brief the CISO on campaigns abusing upstream paths. One entry on the ATT&CK page stands apart from commodity campaigns.</p>"},
question:"Which fact distinguishes MoustachedBouncer from commodity campaigns?",
options:[{id:"A",text:"It specifically targeted foreign diplomats via ISP-level compromise"},{id:"B",text:"It sprayed the same lure to millions of randomly chosen victims"},{id:"C",text:"It waited for victims on freshly registered attacker domains"},{id:"D",text:"It relied on mass malicious email attachments to spread"}],
correct:"A",
hint:"The page stresses who was targeted and where the access came from.",
explain:"<p>The published picture: <b>espionage against foreign diplomats in Belarus</b>, content injected at the <b>ISP level</b> — abuse of lawful-intercept-style access — and redirection of <b>specifically-targeted</b> victims to a fake Windows Update page. Commodity campaigns spray broadly and opportunistically; this one selected its victims with care, which changes your risk model if you operate in that sector.</p>"},
{id:"h15",type:"drag",title:"Signals to analytics",summary:"Map each detection lead to its analytic.",
scenario:{summary:"Three leads, three analytics, one decoy.",
intro:"<p>Three detection leads arrived in the queue. Map each signal onto the analytic that covers it. One card is a decoy that no T1659 analytic covers.</p>"},
question:"Drag each signal onto the analytic that detects it.",
slots:[{label:"AN0992"},{label:"AN0993"},{label:"AN0994"}],
bank:[{text:"chrome.exe writes a payload to %AppData%, wscript runs it",ok:true,slot:0},{text:"wget saves a script to /var/tmp, then bash runs it",ok:true,slot:1},{text:"Safari child process loads a script from ~/Downloads",ok:true,slot:2},{text:"A service account was created in Active Directory",ok:false}],
hint:"Match the paths and parent apps: per cent signs, slashes and tildes point to different systems.",
explain:"<p>Per-cent paths and <b>chrome → wscript</b> are Windows → <b>AN0992</b>. <b>wget + /var/tmp</b> is Linux → <b>AN0993</b>. A <b>Safari child</b> is macOS → <b>AN0994</b>. Creating a service account is directory activity — it belongs to account-manipulation techniques, not to any T1659 analytic.</p>"},
{id:"h16",type:"branch",title:"Purple-team drill",summary:"One injection, played from both sides.",
scenario:{summary:"Authorised exercise: red injects, blue detects.",
intro:"<p>Authorised purple-team exercise. <b>Red side:</b> you control an upstream tap; the target Linux test VM fetches a page over <b>plain HTTP</b>. <b>Blue side:</b> the SOC watches with DET0349 analytics. You will play both sides in sequence.</p>",
artefacts:[{label:"ARTEFACT 1 — Exercise rules",code:"- Upstream tap position: allowed\n- Office/enterprise internals: OUT of scope\n- Payload: script writes /tmp/purple_canary then exits\n- Blue team is NOT told the injection time",light:true}]},
hint:"Red is off-path and cannot hold the connection. Blue should trust the analytic whose platform and paths match the canary.",
steps:[
{q:"RED — which injection approach matches T1659 'from the side'?",short:"RED: race an unsolicited fake HTTP reply",
 options:[{id:"A",text:"Send an unsolicited fake reply that races the real HTTP response"},{id:"B",text:"Replace the TLS certificate on the flow"},{id:"C",text:"Email the payload to the test user"},{id:"D",text:"Ask the site admin to add your payload"}],correct:"A"},
{q:"BLUE — the canary lands when the VM runs: curl the script into /tmp, then execute it. Which analytic should fire?",short:"BLUE: AN0993 fires on curl to /tmp then execute",
 options:[{id:"A",text:"AN0993 — curl/wget writes to /tmp, then execution"},{id:"B",text:"AN0992 — the Windows %AppData% pattern"},{id:"C",text:"AN0994 — the macOS Safari pattern"},{id:"D",text:"None — lab traffic is excluded by DET0349"}],correct:"A"},
{q:"BLUE — your analytic fired on the test VM. What is the proportionate next step in an EXERCISE context?",short:"BLUE: verify the chain, confirm the drill",
 options:[{id:"A",text:"Verify the parent chain, then confirm the drill with the red team lead"},{id:"B",text:"Reimage the whole test cluster tonight"},{id:"C",text:"Disable all analytics to stop the noise"},{id:"D",text:"Ship an emergency firewall change to production"}],correct:"A"}],
explain:"<p><b>Red:</b> from the side means racing an <b>unsolicited fake reply</b> — there is no TLS to break on this flow. A certificate swap would be a middle position with noisy PKI changes; email is a different technique.</p><p><b>Blue:</b> curl → /tmp → execute is the exact <b>AN0993</b> pattern (Linux). The proportionate response verifies the parent chain and confirms the drill with the red lead — reimaging a cluster or emergency production changes are disproportionate for a canary.</p><p><b>The lesson of the drill:</b> the attacker needs to win a race; the defender needs the write-then-run gap plus the network anomaly. Both sides of T1659 in one exercise.</p>"}
];
