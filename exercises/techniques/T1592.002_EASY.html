<script>
var EXAM = {"topicId":"t1592.002","topicTitle":"T1592.002 Gather Victim Host Information: Software","batch":1,"sevName":"EASY","sevClass":"sev-easy","difficulty":"easy","passMark":70,"timerSec":1800,"exercises":[{"id":"e1","type":"qcm","title":"Name the sub-technique","scenario":[["p","You are reading the MITRE ATT&CK page for the first time. Here is the text you see:"],["art","ARTEFACT 1 — ATT&CK excerpt (adapted)","Adversaries may gather information about the victim's host software.\nThis includes types and versions on specific hosts, as well as the\npresence of components that indicate added defensive protections\n(ex: antivirus, SIEMs, etc.)."]],"q":"Which ATT&CK object does this text describe?","hint":"The text is about host *software*, and it belongs to the Gather Victim Host Information family.","expl":"The text is the definition of **T1592.002 Software**. It is a *sub-technique* of T1592 (Gather Victim Host Information). The name \"Software\" matches the words in the text: installed software, versions, and defensive tools like antivirus and SIEMs.","study":"Read the sub-technique list under T1592: Hardware, Software, Firmware, Client Configurations.","options":[{"t":"T1592.001 — Hardware","why":"Hardware is about physical parts, for example CPU model or RAM size. The text talks about programs, not parts."},{"t":"T1592.002 — Software","why":"Correct. The text is the official description of T1592.002: host software, versions, and defensive components."},{"t":"T1592.004 — Client Configurations","why":"Client Configurations is about how client software is set up. The text is about the software itself and its versions."},{"t":"T1082 — System Information Discovery","why":"T1082 gathers similar details, but only *after* the attacker is inside the system. This text is the pre-compromise sub-technique T1592.002."}],"correct":[1]},{"id":"e2","type":"qcm","title":"Find the tactic","scenario":[["p","Your mentor asks: \"T1592.002 happens **before** the attacker touches the victim. Which tactic (the attacker's goal at that stage) owns it?\""]],"q":"Which tactic does T1592.002 belong to?","hint":"The tactic name starts with \"R\" and means \"spying out the target before the attack\".","expl":"T1592.002 belongs to **Reconnaissance (TA0043)**. Reconnaissance means the attacker studies the target from outside, before any break-in. Initial Access starts later, when the attacker uses what recon found.","study":"Look at the ATT&CK matrix top row: Reconnaissance comes first.","options":[{"t":"Reconnaissance (TA0043)","why":"Correct. Gathering host software details is reconnaissance: studying the victim before an attack."},{"t":"Initial Access (TA0001)","why":"Initial Access is the first real break-in step. T1592.002 only *prepares* that step."},{"t":"Discovery (TA0007)","why":"Discovery looks similar, but it happens after the attacker is already inside. T1592.002 is outside, before access."},{"t":"Collection (TA0009)","why":"Collection steals data the victim owns. Here the attacker only reads what the victim exposes publicly."}],"correct":[0]},{"id":"e3","type":"fill","title":"Complete the beginner note","scenario":[["p","A classmate wrote a note and forgot one word. The word bank below has the missing word plus wrong choices. Click the right word, then click the blank."]],"q":"Fill the blank with the correct tactic name.","hint":"The attacker only *looked* from outside. No account, no malware, no entry.","expl":"Reading a server banner from outside is **Reconnaissance**. The attacker used no account and installed nothing. Discovery needs inside access first; Initial Access is the break-in itself; Exfiltration steals data out of the network.","study":"Reconnaissance = outside looking in. Discovery = inside looking around.","pre":"An attacker reads a server banner from the internet. No account is used and nothing is installed yet. In ATT&CK, this behaviour sits in the ___ tactic.","bank":["Reconnaissance","Initial Access","Discovery","Exfiltration"],"blanks":[{"accept":["reconnaissance"],"why":"Reconnaissance covers pre-compromise information gathering such as banner reading."}]},{"id":"e4","type":"multi","title":"What does it collect?","scenario":[["p","An attacker is running T1592.002 against a small company. Think about the official definition: software types, software versions, and defensive components."]],"q":"Select every detail that T1592.002 is designed to collect.","hint":"Stay inside the definition: programs, versions, and security tools.","expl":"The ATT&CK definition lists three things: software **types**, software **versions**, and **defensive components** such as antivirus and SIEMs. Server room temperature and website logos are not host software information.","study":"Re-read the first sentence of the T1592.002 definition.","options":[{"t":"Names of installed programs","why":"Correct. Types and names of installed software are the core of this sub-technique."},{"t":"Version numbers of installed programs","why":"Correct. Versions matter most, because old versions often have known weaknesses."},{"t":"Whether antivirus is present","why":"Correct. Defensive components like antivirus or SIEM agents are exactly what the attacker wants to see."},{"t":"The temperature of the server room","why":"Wrong. Room temperature is physical building data, not host software information."},{"t":"The colour of the company logo","why":"Wrong. A logo is marketing design, not software information."}],"correct":[0,1,2]},{"id":"e5","type":"terminal","title":"Read hidden file details","scenario":[["p","You are a beginner SOC analyst. A partner company sent **photo.jpg** for the public website. Your lead says: \"Find out which software made this file.\""],["p","The lead reminds you: `exiftool` is a free tool that shows hidden file details (metadata). Metadata is extra information stored inside a file, like the program that created it."]],"q":"Type the command that shows the hidden details of photo.jpg, then press Enter and Check.","hint":"The tool is exiftool and the file is photo.jpg — put them together with a space.","expl":"The command is **exiftool photo.jpg**. `exiftool` reads the metadata, and `photo.jpg` is the file to read. The output shows the creating software: \"Adobe Photoshop 21.2\". This is exactly the kind of detail T1592.002 describes: file metadata reveals software names and versions. As a defender you now know the team should scrub metadata before publishing files. As an attacker, this is a free way to learn the victim's tools without touching the network.","study":"Try exiftool on any document at home (safe) and look at the Producer field.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"analyst@workstation","prompt":"analyst@workstation:~$","welcome":["# file dropped here by the web team","# type your command below, then press Enter"],"tools":["exiftool","strings","file","cat"],"expected":"exiftool photo.jpg","outshape":"Producer        : Adobe Photoshop 21.2\nSoftware        : Adobe Photoshop 21.2\nCreate Date     : 2021:03:02 10:14:55","syntax":{"shape":"exiftool FILE — prints the hidden details of a file","example":"exiftool report.pdf","flags":["No options are needed for this task.","Replace FILE with the file you want to read."]},"outsim":[{"re":"^exiftool","out":["Producer        : Adobe Photoshop 21.2","Software        : Adobe Photoshop 21.2 (Windows)","Create Date     : 2021:03:02 10:14:55"]}],"defaultOut":["(the command runs, but it does not show the creating software)"],"elements":[{"re":"^exiftool","label":"tool: exiftool","why":"exiftool is the tool that prints hidden file details."},{"re":"photo\\.jpg","label":"target file: photo.jpg","why":"That is the file named in the task."}],"parts":["`exiftool` — the metadata reader named by your lead.","`photo.jpg` — the target file from the scenario."],"bad":[]}},{"id":"e6","type":"logview","title":"Spot the tool, not the browser","scenario":[["p","You monitor a small web server. Four visitors came this morning. The last field of each line is the **user agent** — it names the visitor's program."]],"q":"Click the ONE line where the visitor's program was a command-line tool, not a normal browser.","hint":"Normal browsers write \"Mozilla\", \"Chrome\", \"Safari\" or \"Firefox\". One line does not.","expl":"Line 3 used **curl/7.68.0**. curl is a command-line tool, not a browser. A tool fetching a PDF can be a person, but in recon it is often a script collecting files to read their metadata — a T1592.002 behaviour. The other lines used normal browsers, which most visitors use every day.","study":"Learn a few normal user agent strings; anything else stands out.","logview":{"click":true,"lines":["203[.]0[.]113[.]7 - - [10/Mar/2026:09:12:01] \"GET /products.html HTTP/1.1\" 200 \"-\" \"Mozilla/5.0 (Windows NT 10.0) Chrome/122.0\"","203[.]0[.]113[.]9 - - [10/Mar/2026:09:12:44] \"GET /index.html HTTP/1.1\" 200 \"-\" \"Mozilla/5.0 (Macintosh) Safari/17.0\"","203[.]0[.]113[.]9 - - [10/Mar/2026:09:13:02] \"GET /downloads/brochure.pdf HTTP/1.1\" 200 \"-\" \"curl/7.68.0\"","203[.]0[.]113[.]9 - - [10/Mar/2026:09:14:10] \"GET /contact.html HTTP/1.1\" 200 \"-\" \"Mozilla/5.0 (X11; Linux) Firefox/123.0\""],"clickCorrect":[2],"why":{"0":"A normal Chrome browser on Windows. Common, everyday traffic.","1":"A normal Safari browser on a Mac. Common, everyday traffic.","2":"curl is a command-line tool, not a browser. It downloaded the PDF — a classic metadata-collection move.","3":"A normal Firefox browser on Linux. Common, everyday traffic."}}},{"id":"e7","type":"match","title":"Match artefact to meaning","scenario":[["p","Three small pieces of evidence were collected during a test. Each one tells the attacker something about software. Drag (or click-then-click) each right-side meaning onto its artefact."]],"q":"Match each artefact with what it tells about software.","help":"Drag a blue chip into the box next to its artefact, or click a chip and then click a box.","hint":"Read each artefact like a sentence: who is speaking, and what version do they admit?","expl":"A **server banner** names the web server program and version. A **user agent string** names the visitor's tool. A **Producer field** in metadata names the program that made the file. All three leak software names and versions — exactly what T1592.002 collects.","study":"Banners, user agents, and metadata are the three easiest software leaks.","left":["ARTEFACT A — HTTP response header:\nServer: Apache/2.4.49 (Ubuntu)","ARTEFACT B — request header:\nUser-Agent: python-requests/2.25","ARTEFACT C — PDF metadata:\nProducer: Microsoft Word 2013"],"right":["name and version of the web server program","name and version of the tool that visited the site","name and version of the program that made the file"],"correct":[0,1,2],"chipWhy":{"r0":"The Server header is spoken by the web server itself, so it names the server program and version.","r1":"The User-Agent header is sent by the visiting tool, so it names the visitor.","r2":"The Producer metadata field records the program that created the document."},"code":false},{"id":"e8","type":"order","title":"Order the attacker steps","scenario":[["p","An attacker plans a simple attack on a company. Put their three steps in the order they happen."]],"q":"Drag the steps (or use the arrows) into the correct order: first at the top.","hint":"Attacks start with looking, then learning, then acting.","expl":"The order is: **find the target**, **collect software details**, **use a weak version to break in**. T1592.002 is the middle step: it turns \"I found a company\" into \"I know their old Apache version, so I can attack it\". The defender view: if step 2 is made hard (no version leaks), step 3 loses its map.","study":"Recon always comes before Initial Access in the ATT&CK matrix order.","correct":["Find the company website from outside","Collect software details (banners, file metadata)","Use a weak, old program version to break in"],"itemWhy":["Reconnaissance starts with picking a target. Nothing technical has happened yet.","T1592.002 lives here: banners, user agents and metadata reveal software names and versions.","Only after learning a weak version does the attacker move to Initial Access."]},{"id":"e9","type":"qcm","title":"Why the version number matters","scenario":[["art","ARTEFACT 1 — banner captured from the target","$ curl -sI hxxp://shop[.]target-example[.]com\nHTTP/1.1 200 OK\nServer: Apache/2.4.49 (Unix)"]],"q":"Why does the attacker care about the number 2.4.49?","hint":"Version numbers can be looked up in public weakness databases.","expl":"**Attacker view:** \"Apache 2.4.49\" is a specific old version with public, documented weak points (CVEs), so the attacker can search for a ready exploit instead of guessing. **Defender view:** that same banner just handed a stranger a target list entry. Removing the version from the banner (part of mitigation M1056) would have hidden it. The other options are nonsense: banners do not count visitors, set passwords, or change colours.","study":"Search \"Apache 2.4.49 CVE\" to see how public weakness databases work.","options":[{"t":"Old versions can have known weak points (CVEs) to look up","why":"Correct. A version number maps to public CVE entries and ready-made exploits."},{"t":"The number shows how many people visit the site","why":"Wrong. A banner is one line of server self-description; it cannot count visitors."},{"t":"The number is the length of the login password","why":"Wrong. Version numbers have no link to password rules."},{"t":"The number changes the website colours","why":"Wrong. Display has nothing to do with the server version string."}],"correct":[0]},{"id":"e10","type":"multi","title":"Reading the defender's list","scenario":[["p","The attacker's T1592.002 notes for one host say: **\"Windows Defender present. No EDR. No backup agent.\"** (An EDR is an advanced endpoint protection tool.)"]],"q":"Select every reason this list helps the attacker.","hint":"Think like the attacker: what do they avoid, and where do they feel safe?","expl":"**Correct items:** knowing the security tools tells the attacker what to **evade** (Defender), and \"no EDR, no backup agent\" shows them **where protection is missing**. **Wrong items:** a software list says nothing about password strength, and it grants no internet access. This is why the definition mentions \"added defensive protections\" — attackers map the defence, not only the software.","study":"Defensive-tool discovery is a core goal of this sub-technique.","options":[{"t":"They know which security tools they must sneak past","why":"Correct. Evasion planning starts with the tool list."},{"t":"They learn where extra protection is missing","why":"Correct. \"No backup agent\" also tells them ransomware would hurt more."},{"t":"It proves the staff passwords are weak","why":"Wrong. Software lists contain no password information at all."},{"t":"It gives them free access to the internet","why":"Wrong. A software inventory grants no network access."}],"correct":[0,1]},{"id":"e11","type":"logview","title":"Read the command line","scenario":[["p","Your EDR recorded one process on HOST-05. Use the filter box if you want, then answer below. (EDR = endpoint detection and response; it records process starts.)"]],"q":"Look at the CommandLine part of the highlighted record. What was collected?","hint":"`wmic product` asks Windows for the list of installed programs.","expl":"`wmic product get name,version` asks Windows: \"list every installed program with its version\". That is host **software inventory** — the internal variant of T1592.002 data. In this training the command appears on an internal host, so a responder would also ask *who* ran it and *why*: the same data attackers want is also collected by admins, so context decides if it is alarming.","study":"Remember: wmic product = installed software list (name + version).","logview":{"click":false,"lines":["2026-03-10T03:12:44Z HOST-05 proc=create cmd=\"wmic product get name,version\" user=svc_backup","2026-03-10T03:12:59Z HOST-05 net=connect dst=10[.]20[.]4[.]9:445 proto=smb","2026-03-10T03:13:10Z HOST-05 proc=exit cmd=\"wmic product get name,version\""],"sub":{"type":"qcm","q":"What does the command `wmic product get name,version` collect?","options":[{"t":"Names and versions of installed programs","why":"Correct. wmic product lists installed software with versions."},{"t":"Open network connections of the host","why":"Wrong. That would be netstat, not wmic product."},{"t":"Saved Wi-Fi passwords","why":"Wrong. wmic product never touches passwords."},{"t":"The content of text files","why":"Wrong. wmic product reads the software inventory, not files."}],"correct":[0]}}},{"id":"e12","type":"dnd","title":"Choose the right command","scenario":[["p","You are on a Windows host during an approved test. You must list the installed programs. One command below does that; the others do different jobs."]],"q":"Drag the correct command chip into the empty shell box.","help":"Drag the chip, or click the chip and then click the box.","hint":"You want program names and versions. Which command mentions \"product\" and \"version\"?","expl":"**`wmic product get name,version`** asks Windows for installed program names and versions. `whoami` prints your own account name, `ping` only tests reachability of an address, and `net user` lists accounts. Only the first one produces the software inventory that T1592.002 describes.","study":"wmic product = software inventory. whoami = identity. ping = reachability.","zones":[{"id":"z1","label":"fake Windows shell — goal: list installed programs"}],"chips":[{"id":"c1","t":"wmic product get name,version","code":true},{"id":"c2","t":"whoami","code":true},{"id":"c3","t":"ping 8[.]8[.]8[.]8","code":true},{"id":"c4","t":"net user","code":true}],"correct":{"c1":"z1"},"chipWhy":{"c1":"Correct: wmic product queries the Windows software inventory with names and versions.","c2":"whoami prints the current account name — no software list.","c3":"ping tests whether an address answers — no software list.","c4":"net user lists user accounts — not installed software."}},{"id":"e13","type":"dnd","title":"Place it in the matrix","scenario":[["p","Your class built a mini ATT&CK matrix on a whiteboard. One chip is loose. Drag it to the column where it belongs."]],"q":"Drag the chip T1592.002 — Software onto its correct tactic column.","help":"Drag the chip, or click the chip and then click a column.","hint":"The technique is pre-compromise spying. Which column name matches \"spying before attack\"?","expl":"T1592.002 lives in the **Reconnaissance** column: it collects victim software details from outside, before any break-in. Initial Access, Discovery, and Exfiltration all happen later in the attack lifecycle.","study":"Matrix order left to right: Reconnaissance, Resource Development, Initial Access, …","zones":[{"id":"z1","label":"Reconnaissance"},{"id":"z2","label":"Initial Access"},{"id":"z3","label":"Discovery"},{"id":"z4","label":"Exfiltration"}],"chips":[{"id":"c1","t":"T1592.002 — Software"}],"correct":{"c1":"z1"},"chipWhy":{"c1":"T1592.002 is a Reconnaissance sub-technique (pre-compromise)."}},{"id":"e14","type":"qcm","title":"Where does it happen?","scenario":[["p","A friend asks: \"If I want to *see* someone doing T1592.002, where should I look?\" Remember the platform tag on the ATT&CK page: PRE."]],"q":"Where does T1592.002 usually take place?","hint":"PRE means \"before the attacker is inside your systems\".","expl":"T1592.002 is **pre-compromise**: the attacker reads banners, user agents, metadata and public texts from **outside** the victim's network. That is why the ATT&CK page says detection is difficult — much of it happens where your logs cannot see. Good defenders therefore focus on what leaks out (M1056) and on early Initial Access signals (DET0888 note).","study":"PRE platform = outside your visibility. Plan detections accordingly.","options":[{"t":"Outside the victim network, before any break-in","why":"Correct. Banners, metadata and public texts are all readable from outside."},{"t":"Inside the SIEM, after the attacker logs in","why":"Wrong. After login it would be Discovery, not Reconnaissance."},{"t":"Only on victim laptops during work hours","why":"Wrong. Recon does not need a victim device or a schedule."},{"t":"In the victim cloud billing portal","why":"Wrong. Billing portals are unrelated to host software banners."}],"correct":[0]},{"id":"e15","type":"qcm","title":"Pick the real mitigation","scenario":[["p","Your GRC team asks which control maps to T1592.002. The ATT&CK page lists one mitigation: **M1056 Pre-compromise** — \"minimise the amount and sensitivity of data available to external parties\"."]],"q":"Which action follows M1056 for this technique?","hint":"You cannot stop someone from looking. You can show them less.","expl":"M1056 says: share **less** with outsiders. Removing version numbers from public banners and scrubbing file metadata does exactly that. Buying monitors helps people, not data; switching the firewall off removes a defence; emailing the software list *increases* exposure — the opposite of M1056.","study":"M1056 Pre-compromise = reduce what outsiders can learn about you.","options":[{"t":"Remove version numbers from public banners and metadata","why":"Correct. Less exposed detail means less useful recon data."},{"t":"Buy bigger monitors for the SOC team","why":"Wrong. Screen size has no effect on exposed data."},{"t":"Turn off the firewall completely","why":"Wrong. That removes a defence and exposes more services."},{"t":"Email the full software list to all staff","why":"Wrong. That spreads the exact data the attacker wants."}],"correct":[0]}],"intro":{"tagline":"Beginner-friendly, scenario-based training on one real ATT&CK technique.","about":"\n<p><b>T1592.002 — Software</b> is a <b>sub-technique</b> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a public catalogue that describes what real attackers do. A <b>sub-technique</b> is one specific way an attacker works. Its parent technique is <b>T1592 Gather Victim Host Information</b>.</p>\n<p>What does this sub-technique describe? Before an attack, an attacker wants to know which <b>programs</b> run on the victim's computers. They look for the <b>names</b> and <b>versions</b> of installed software. They also look for <b>security tools</b>, for example antivirus or a SIEM (a SIEM is a system that collects security alerts). All of this happens <b>before</b> any break-in. In ATT&amp;CK words: it belongs to the <b>Reconnaissance</b> tactic, and its platform is <b>PRE</b> (short for pre-compromise, meaning \"before the attacker gets in\").</p>\n<p>How do attackers collect this? They read <b>server banners</b> (a banner is the short \"hello, I am Apache 2.4.49\" message a server sends). They read <b>user agent strings</b> (the text a browser or tool sends with every visit). They download files from the victim's website and read hidden <b>metadata</b> (metadata is small extra information inside a file, like \"made with Microsoft Word 2013\"). They also read public texts like job adverts or CVs that name tools. The ATT&amp;CK page lists four real users of this technique: <b>Andariel</b>, <b>Magic Hound</b>, <b>Sandworm Team</b>, and the <b>Anthropic AI-orchestrated Campaign</b>.</p>\n<p>Why is this useful at work? Almost every security job meets this technique:</p>\n<ul>\n<li>A <b>SOC analyst</b> watches alerts and triages scanning and enumeration events.</li>\n<li>A <b>CTI analyst</b> (cyber threat intelligence) writes reports that name this technique, exactly like the ATT&amp;CK page does.</li>\n<li>A <b>detection engineer</b> builds alerts from detection strategy <b>DET0888</b>.</li>\n<li>A <b>vulnerability manager</b> checks which exposed software versions need patching first.</li>\n<li>An <b>incident responder</b> knows that software listing before a break-in means preparation.</li>\n<li>A <b>red teamer</b> (a friendly, approved attacker) uses the same steps in authorised tests.</li>\n<li>A <b>GRC analyst</b> maps controls. Here the mitigation is <b>M1056 Pre-compromise</b>: you cannot fully stop outside spying, but you can share less.</li>\n</ul>\n<p>You will learn to recognise the technique, name its tactic, read its evidence in logs, and explain why attackers want software lists. Short sentences. Plain words. You can do this!</p>\n","keywords":[{"t":"Technique identity & family","chips":["T1592.002 Software","Sub-Technique of T1592","T1592.001 Hardware","T1592.003 Firmware","T1592.004 Client Configurations"]},{"t":"Tactic & platform","chips":["Reconnaissance","TA0043","PRE (pre-compromise)"]},{"t":"What it reveals","chips":["installed software names","software versions","antivirus presence","SIEM presence"]},{"t":"Collection vectors","chips":["server banners","user agent strings","file metadata","public datasets"]},{"t":"Lifecycle position","chips":["before Initial Access","feeds T1133 External Remote Services"]},{"t":"Defense","chips":["M1056 Pre-compromise","DET0888 detection strategy","minimise exposed data"]}],"how":"\n<p><b>Goal:</b> score at least <b>70%</b> to pass. This is the <b>EASY</b> tier: one idea per exercise, short scenarios, and guided wording that tells you what to look at.</p>\n<p><b>Exercise types:</b> multiple choice, select-all-that-apply, matching, ordering, drag-and-drop, click-the-log-line, fill-in-the-blank, one small terminal where you type a command (a fake shell — nothing real runs), and one short decision scenario.</p>\n<p><b>Partial credit:</b> exercises with one right answer give full or no credit. Exercises with several items give <b>partial credit</b>: every correct item counts, but every wrong selection <b>subtracts</b> one. Selecting everything is always worth zero. The formula is (correct − wrong) ÷ items.</p>\n<p><b>Check and the timer:</b> when you press <b>Check</b>, the timer <b>stops by itself</b> so you can read the explanation with no time pressure. The timer starts again only when you press <b>Next</b>. You can also press <b>Pause</b> for a normal break — the exercise hides during a break. The timer state is always shown at the top.</p>\n<p><b>Hints and skipping:</b> one hint per exercise. A hint costs <b>10% of that exercise's credit</b>. Every exercise has a <b>Skip</b> button. Skipped exercises wait in a pool, and before the exam ends you may go back and answer them. Skipped-and-never-answered exercises are left out of your score — they neither help nor hurt.</p>\n<p><b>Retake:</b> if you fail, press Retake. Questions and answers are shuffled again.</p>\n"}};

"use strict";
/* ============ Cyber Pulse Academy exam shell — T1592.002 ============ */
var EX = EXAM.exercises;
var ORDER = [];            /* exercise indices in play order */
var ORDERPOS = {};         /* exIndex -> 1-based position label */
var curEx = -1;            /* current exercise index (into EX) */
var fromReview = false;
var skipPool = [];         /* exercise indices skipped & unanswered */
var ansState = {};         /* exIndex -> 'answered' | 'skipped' */
var ansCredit = {};        /* exIndex -> float credit */
var answeredCount = 0;
var creditSum = 0;         /* float accumulator */
var hintUsed = {};         /* exIndex -> true */
var reported = false;
var inReview = false;
var resultsShown = false;
var widget = null;         /* active widget controller */

/* ---- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---- */
var TS = { RUN:'RUNNING', PM:'PAUSED_MANUAL', PA:'PAUSED_AUTO_CHECK', END:'ENDED' };
var tstate = TS.RUN;
var remain = EXAM.timerSec;
var resumeTarget = TS.RUN;
var manualMark = 0, autoMark = 0;
var pauseManualSec = 0, pauseAutoSec = 0;
var exTimerLeft = 0;       /* reduced per-exercise timer (seconds) */
var ended = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtT(s){ s=Math.max(0,s|0); var m=(s/60)|0, r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pct(x){ return Math.round(x*100); }
/* partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){ if(N<=0){return 0;} return Math.max(0,(H-W)/N); }

/* ============ header rendering ============ */
function stateInfo(){
  if(tstate===TS.RUN)  return {cls:'tstate-run',  ic:'▶', w:'RUNNING'};
  if(tstate===TS.PM)   return {cls:'tstate-pm',   ic:'⏸', w:'PAUSED — manual (press Resume)'};
  if(tstate===TS.PA)   return {cls:'tstate-pa',   ic:'⏸', w:'PAUSED — reviewing feedback (resumes on Next)'};
  return {cls:'tstate-end', ic:'⏹', w:'ENDED'};
}
function renderHeader(){
  var si = stateInfo();
  $('t-clock').textContent = '⏱ '+fmtT(remain);
  var st = $('t-state'); st.textContent = si.ic+' '+si.w; st.className = 'hchip '+si.cls;
  var shown = Math.round(creditSum*10)/10;
  var p = answeredCount>0 ? pct(creditSum/answeredCount) : 0;
  $('t-score').innerHTML = 'Score <b>'+shown.toFixed(1)+' / '+answeredCount+'</b> · '+p+'%';
}
function renderCounter(exIdx){
  $('t-count').innerHTML = 'Exercise <b>'+(ORDERPOS[exIdx]||'-')+' of '+EX.length+'</b>';
  var sev = $('t-sev'); if(sev){ /* severity badge is static per file */ }
}

/* ============ pause logging ============ */
function nowSec(){ return Date.now()/1000; }
function enterAutoPause(){
  if(tstate===TS.END){ return; }
  tstate = TS.PA; autoMark = nowSec(); renderHeader();
}
function leaveAutoPause(){
  if(autoMark>0){ pauseAutoSec += Math.max(0, nowSec()-autoMark); autoMark=0; }
}
function manualPause(){
  if(tstate===TS.RUN){ resumeTarget = TS.RUN; }
  else if(tstate===TS.PA){ resumeTarget = TS.PA; }
  else { return; }
  tstate = TS.PM; manualMark = nowSec();
  renderHeader(); showPauseOverlay();
}
function manualResume(){
  if(manualMark>0){ pauseManualSec += Math.max(0, nowSec()-manualMark); manualMark=0; }
  tstate = resumeTarget;
  hidePauseOverlay(); renderHeader();
}
function showPauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  $('stage').classList.add('hid');
  ov.classList.remove('hid');
}
function hidePauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  ov.classList.add('hid');
  $('stage').classList.remove('hid');
}

/* ============ timer ============ */
function tick(){
  if(tstate!==TS.RUN || ended){ return; }
  remain--;
  if(remain<=0){ remain=0; renderHeader(); timeUp(); return; }
  var c = EX[curEx];
  if(c && c.terminal && c.terminal.timerSec && exTimerLeft>0 && ansState[curEx]!=='answered'){
    exTimerLeft--;
    var chip = $('extimer');
    if(chip){ chip.textContent='⏳ '+fmtT(exTimerLeft)+' left on this console'; }
    if(exTimerLeft<=0){ gradeCurrent(true); }
  }
  renderHeader();
}
function timeUp(){
  if(ended){ return; }
  ended = true; tstate = TS.END; renderHeader();
  finish(true);
}

/* ============ flow ============ */
function buildOrder(){
  ORDER = shuffle(EX.map(function(_,i){ return i; }));
  /* brief contract: the two terminal exercises must never be adjacent in play order */
  for(var guard=0; guard<50; guard++){
    var bad = -1;
    for(var k=0;k<ORDER.length-1;k++){
      if(EX[ORDER[k]].type==='terminal' && EX[ORDER[k+1]].type==='terminal'){ bad=k; break; }
    }
    if(bad<0){ break; }
    var other = -1;
    for(var k2=0;k2<ORDER.length;k2++){
      if(k2!==bad && k2!==bad+1 && EX[ORDER[k2]].type!=='terminal' &&
         (bad+2>=ORDER.length || k2!==bad+2) && (bad-1<0 || k2!==bad-1)){ other=k2; break; }
    }
    if(other<0){ break; }
    var tmp = ORDER[bad+1]; ORDER[bad+1] = ORDER[other]; ORDER[other] = tmp;
  }
  ORDERPOS = {};
  ORDER.forEach(function(exIdx,i){ ORDERPOS[exIdx] = i+1; });
}
function startExam(){
  $('intro').classList.add('hid');
  $('exam').classList.remove('hid');
  buildOrder();
  renderHeader();
  nextUnanswered();
}
function nextUnanswered(){
  fromReview = false; inReview = false;
  var next = null;
  for(var k=0;k<ORDER.length;k++){
    var i = ORDER[k];
    if(!ansState[i]){ next = i; break; }
  }
  if(next===null){
    if(skipPool.length>0){ showReview(); } else { finish(false); }
    return;
  }
  renderExercise(next,false);
}
function showReview(){
  inReview = true; fromReview = false;
  updateHeaderButtons();
  var host = $('stage'); host.innerHTML='';
  var h = '<div class="card skipwrap"><h2>Review skipped exercises</h2>'+
    '<p>You skipped '+skipPool.length+' exercise'+(skipPool.length===1?'':'s')+
    '. You can go back to any of them and answer it now, as long as the timer has not ended. '+
    'Skipped exercises that stay unanswered are excluded from your score — they do not count for or against you.</p><div class="rlist">';
  skipPool.forEach(function(i){
    h += '<div class="ritem"><span class="ic">⚠</span><span>'+esc(EX[i].title)+'</span>'+
         '<button class="btn" data-rev="'+i+'">Answer this one</button></div>';
  });
  h += '</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
       '<button class="btn primary" id="btn-finish">Finish exam</button></div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-rev]'), function(b){

}

/* ============ exercise rendering ============ */
function fmtText(s){
  var t = esc(s);
  t = t.replace(/`([^`]+)`/g, function(m,a){ return '<code class="inline-code">'+a+'</code>'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, function(m,a){ return '<b>'+a+'</b>'; });
  t = t.replace(/\n/g,'<br>');
  return t;
}
function scenarioHTML(ex){
  var inner = '';
  (ex.scenario||[]).forEach(function(p){
    if(p[0]==='p'){ inner += '<p class="prose">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='art'){
      inner += '<div class="art"><div class="art-h">'+esc(p[1])+'</div><div class="art-b"><div class="mono">'+esc(p[2])+'</div></div></div>';
    }
    else if(p[0]==='note'){ inner += '<p class="small">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='tbl'){
      var rows = p[1]; var t='<table class="tbl">';
      rows.forEach(function(r,ri){ t+='<tr>'; r.forEach(function(c){ t+= (ri===0?'<th>':'<td>')+fmtText(c)+ (ri===0?'</th>':'</td>'); }); t+='</tr>'; });
      inner += t+'</table>';
    }
  });
  if(ex.collapsed){
    return '<details class="artwrap"><summary>📁 SCENARIO — '+esc(ex.summary||'read the scenario')+' (click to expand)</summary><div class="blk-b">'+inner+'</div></details>';
  }
  return '<div class="blk-h">🧾 SCENARIO</div><div class="blk-b">'+inner+'</div>';
}
function renderExercise(i, reviewMode){

/* ============ grading ============ */
function gradeCurrent(autoExpired){
  var i = curEx, ex = EX[i];
  if(ansState[i]==='answered'){ return; }
  /* FIRST action per spec: stop the timer into the auto-check pause state */
  enterAutoPause();
  if(autoExpired){ exTimerLeft = 0; var chip=$('extimer'); if(chip){ chip.textContent='⏳ time on this console has run out'; } }
  var res = widget.grade();            /* {H,W,N,items[],expl?} */
  var credit = scoreExercise(res.H,res.W,res.N);
  if(hintUsed[i]){ credit = Math.max(0, credit - 0.10); }
  ansCredit[i] = credit; ansState[i]='answered'; answeredCount++; creditSum += credit;
  renderFeedback(ex, res, credit, autoExpired);
  renderHeader(); updateHeaderButtons();
  var fbh = $('fbhost');
  if(fbh && fbh.scrollIntoView){ fbh.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function fbLabel(credit){
  if(credit>=0.9999){ return {t:'✓ CORRECT', cls:'ok'}; }
  if(credit>0){ return {t:'◐ PARTIALLY CORRECT', cls:'part'}; }
  return {t:'✗ INCORRECT', cls:'bad'};
}
function renderFeedback(ex, res, credit, autoExpired){
  var L = fbLabel(credit);
  var isMulti = res.N>1;
  var h = '<div class="fb '+L.cls+'"><div class="fb-h">'+L.t+'</div><div class="fb-b">';
  if(hintUsed[curEx]){ h += '<p class="small" style="margin:0 0 8px">💡 Hint was used on this exercise — the 10% credit reduction is already applied below.</p>'; }
  if(isMulti){ h += '<div class="fb-credit">credit '+credit.toFixed(2)+' — '+res.H+'/'+res.N+' items</div>'; }
  if(autoExpired){ h += '<p class="small">⏳ The console timer ran out, so your answer was submitted automatically.</p>'; }
  if(isMulti && res.items && res.items.length){
    h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok' ? '✓' : (it.s==='bad' ? '✗' : '○');
      var cl = it.s==='ok' ? 'ok' : (it.s==='bad' ? 'bad' : 'miss');
      var w  = it.s==='ok' ? 'Correct' : (it.s==='bad' ? 'Wrong' : 'Missed');
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why? ' — '+fmtText(it.why):'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<p class="prose">'+fmtText(res.expl || ex.expl || '')+'</p>';
  if(res.N===1 && res.items && res.items.length){ h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok'?'✓':'✗'; var cl = it.s==='ok'?'ok':'bad'; var w = it.s==='ok'?'Correct':'Wrong';
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why?' — '+fmtText(it.why):'')+'</span></div>';
    }); h += '</div>'; }
  if(ex.type==='terminal'){
    var term = ex.terminal;
    h += '<div class="synpanel"><h4>CANONICAL COMMAND</h4><div class="copyblk"><code class="inline-code" id="canon">'+esc(term.expected)+'</code>'+
         '<button class="copybtn" id="btn-copy">Copy</button></div>'+
         '<p style="margin:.5rem 0 0">Why it is built this way:</p><ul class="small">';
    (term.parts||[]).forEach(function(p){ h += '<li>'+fmtText(p)+'</li>'; });
    (term.bad||[]).forEach(function(bd){ h += '<li>⚠ '+fmtText(bd.why)+'</li>'; });
    h += '</ul></div>';
  }
  if(ex.study){ h += '<div class="study"><b>What to study next:</b> '+fmtText(ex.study)+'</div>'; }
  var isLast = (function(){
    for(var k=0;k<ORDER.length;k++){ var j=ORDER[k]; if(j!==curEx && !ansState[j]){ return false; } }
    return true;
  })();
  var reviewNeeded = skipPool.filter(function(i){ return ansState[i]!=='answered'; }).length>0;
  var nxt = !isLast ? 'Next ▸' : (reviewNeeded ? 'Review skipped ⏭' : 'Final Submit');
  h += '</div></div><div style="margin-top:12px"><button class="btn primary" id="btn-next">'+nxt+'</button></div>';
  $('fbhost').innerHTML = h;
  var cb = $('btn-copy');
  if(cb){ cb.addEventListener('click', function(){
    try{ navigator.clipboard.writeText($('canon').textContent); cb.textContent='Copied ✓'; setTimeout(function(){cb.textContent='Copy';},1500); }
    catch(e){ cb.textContent='Select & copy'; }
  }); }
  $('btn-next').addEventListener('click', function(){
    leaveAutoPause();
    if(tstate!==TS.END){ tstate = TS.RUN; }
    renderHeader();
    widget = null;
    if(fromReview){ fromReview=false; showReview(); }
    else if(isLast){
      if(reviewNeeded){ showReview(); } else { finish(false); }
    }
    else { nextUnanswered(); }
  });
  /* disable answering further */
  var aa = $('ansarea'); if(aa){ aa.classList.add('disabled'); Array.prototype.forEach.call(aa.querySelectorAll('button,input,select'), function(el){ el.disabled=true; }); }
}

/* ============ skip ============ */
function skipCurrent(){
  var i = curEx;

}

/* ============ results ============ */

  var skippedLeft = Object.keys(ansState).filter(function(k){ return ansState[k]==='skipped'; }).map(Number);
  var neverTouched = EX.length - answeredIdx.length - skippedLeft.length;

         '<p class="small">Cyber Pulse Academy · MITRE ATT&CK '+esc(EXAM.topicId.toUpperCase())+' · '+esc(EXAM.sevName)+' tier</p></div>';

    '<div class="res-card"><div class="n">'+zero+'</div><div class="l">✗ fully incorrect</div></div>'+
    '<div class="res-card"><div class="n">'+(skippedLeft.length+neverTouched)+'</div><div class="l">⚠ skipped / unanswered (excluded)</div></div>'+
    '</div>';
  h += '<div class="pauselog">⏱ Time paused manually: <b>'+fmtT(Math.round(pauseManualSec))+'</b> · '+

    else { ic='⚠'; tx='skipped — excluded from score'; }

function clearShuffles(){

/* ============ website integration ============ */
function reportScore(cSum, answeredN){

/* ================= WIDGET FACTORY ================= */
function makeWidget(ex, host, reviewMode){
  var w = { ex:ex, host:host, reviewMode:reviewMode };
  var builders = {
    qcm: buildQcm, multi: buildQcm, fill: buildFill, match: buildMatch, dnd: buildDnd,
    order: buildOrderW, rank: buildOrderW, terminal: buildTerminal, logview: buildLogview,
    tree: buildTree, selblank: buildSelblank
  };
  var b = builders[ex.type] || buildQcm;
  w.render = function(){ b(w); };
  w.grade = function(){ return w._grade ? w._grade() : {H:0,W:0,N:1,items:[],expl:ex.expl}; };
  return w;
}
function letters(i){ return 'ABCDEFGH'.charAt(i%8)+'.'; }
function clip(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

/* ---------- QCM / multi-select ---------- */
function buildQcm(w){
  var ex = w.ex, host = w.host;
  if(!ex._optOrder){ ex._optOrder = shuffle(ex.options.map(function(_,i){return i;})); }
  var multi = ex.type==='multi';
  var h = '<div class="opts" role="'+(multi?'group':'radiogroup')+'">';
  ex._optOrder.forEach(function(oi,k){
    h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(ex.options[oi].t)+'</span></button>';
  });
  h += '</div>';
  if(multi){ h += '<p class="small" style="margin-top:8px">Select all that apply, then press Check. Wrong selections subtract from correct ones.</p>'; }
  host.insertAdjacentHTML('afterbegin', h);
  var sel = {};
  Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){
      var i = btn.getAttribute('data-i');
      if(multi){
        sel[i] = !sel[i]; btn.classList.toggle('sel', !!sel[i]);
      } else {
        sel = {}; sel[i] = true;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
      }
    });
  });
  w._grade = function(){
    var chosen = Object.keys(sel).filter(function(k){ return sel[k]; }).map(Number);
    var corr = ex.correct;
    var H=0, W=0, items=[];
    var lab = function(ci){ return letters(ex._optOrder.indexOf(ci))+' '+clip(ex.options[ci].t,90); };
    if(multi){
      corr.forEach(function(ci){
        if(sel[ci]){ H++; items.push({s:'ok', label:lab(ci), why:ex.options[ci].why}); }
        else { items.push({s:'miss', label:lab(ci), why:ex.options[ci].why}); }
      });
      chosen.forEach(function(ci){
        if(corr.indexOf(ci)<0){ W++; items.push({s:'bad', label:lab(ci), why:ex.options[ci].why}); }
      });
      return {H:H, W:W, N:corr.length, items:items, expl:ex.expl};
    }
    var ok = chosen.length===1 && corr.indexOf(chosen[0])>=0;
    if(ok){ H=1; }
    corr.forEach(function(ci){
      items.push({s: ok?'ok':'miss', label:lab(ci), why:ex.options[ci].why});
    });
    if(!ok && chosen.length===1){
      items.push({s:'bad', label:'Your choice: '+lab(chosen[0]), why:ex.options[chosen[0]].why});
    }
    return {H:H, W:W, N:1, items:items, expl:ex.expl};
  };
}

/* ---------- fill-in-the-blank (chips -> inline blanks) ---------- */
function buildFill(w){
  var ex = w.ex, host = w.host;
  if(!ex._bank){ ex._bank = shuffle(ex.bank.slice()); }
  var parts = ex.pre.split('___');
  var h = '<p class="prose">';
  parts.forEach(function(p,i){
    h += fmtText(p);
    if(i<parts.length-1){ h += '<span class="blank" data-b="'+i+'">…</span>'; }
  });
  h += '</p><div class="bank" id="fillbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#fillbank');
  var selChip = null;
  var placed = {};           /* blankIdx -> chip element */
  ex._bank.forEach(function(word){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=word;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    bank.appendChild(c);
  });
  Array.prototype.forEach.call(host.querySelectorAll('.blank'), function(z){
    z.addEventListener('click', function(){
      if(!selChip){ return; }
      var bi = z.getAttribute('data-b');
      if(placed[bi]){ placed[bi].classList.remove('placed'); }
      z.textContent = selChip.textContent;
      placed[bi] = selChip;
      selChip.classList.add('placed'); selChip.classList.remove('sel');
      selChip = null;
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bset,bi){
      var chipEl = placed[bi];
      var got = chipEl ? chipEl.textContent : '';
      var ok = got!=='' && bset.accept.some(function(a){ return a.toLowerCase()===got.toLowerCase(); });
      if(got===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
      else if(ok){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+got, why:bset.why}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+got, why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- shared chip->slot mechanics (match / dnd) ---------- */
function chipSlotWidget(w, cfg){
  var ex = w.ex, host = w.host;
  if(!ex._chips){ ex._chips = shuffle(cfg.chips.slice()); }
  var h = '<p class="small">'+(cfg.help||'Drag a chip into a box, or click a chip and then click a box.')+'</p>';
  h += '<div class="zones" id="zwrap">';
  cfg.zones.forEach(function(z){
    h += '<div class="zone" data-z="'+z.id+'" tabindex="0"><div class="zone-h">'+esc(z.label)+'</div><div class="zslots"></div></div>';
  });
  h += '</div><div class="bank" id="cbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#cbank');
  var selChip = null;
  var placed = {};           /* chipId -> zoneId */
  ex._chips.forEach(function(ch){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'+(ch.code?' code':''); c.textContent=ch.t; c.setAttribute('data-c',ch.id);
    c.draggable = true;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    c.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', ch.id); }catch(e){} selChip=c; c.classList.add('sel'); });
    bank.appendChild(c);
  });
  function dropInto(z, c){
    if(!c || !z){ return; }
    var zid = z.getAttribute('data-z');
    if(c._slot && c._slot.parentNode){ c._slot.parentNode.removeChild(c._slot); }
    var slot = document.createElement('span');
    slot.className='slot chip'+(c.classList.contains('code')?' code':'');
    slot.textContent = c.textContent;
    z.querySelector('.zslots').appendChild(slot);
    c._slot = slot;
    c.classList.add('placed'); c.classList.remove('sel');
    placed[c.getAttribute('data-c')] = zid;
    selChip = null;
  }
  Array.prototype.forEach.call(host.querySelectorAll('.zone'), function(z){
    z.addEventListener('click', function(){ if(selChip){ dropInto(z, selChip); } });
    z.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && selChip){ ev.preventDefault(); dropInto(z, selChip); } });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var cid=''; try{ cid = ev.dataTransfer.getData('text/plain'); }catch(e){}
      var c = bank.querySelector('[data-c="'+cid+'"]') || selChip;
      dropInto(z, c);
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[],N=0;
    cfg.chips.forEach(function(ch){
      var got = placed[ch.id];
      var want = cfg.correct[ch.id];
      var why = (cfg.chipWhy&&cfg.chipWhy[ch.id])||'';
      if(want){
        /* scored item: a chip with a correct home */
        N++;
        if(!got){ items.push({s:'miss', label:ch.t, why:why}); }
        else if(got===want){ H++; items.push({s:'ok', label:ch.t, why:why}); }
        else { W++; items.push({s:'bad', label:ch.t+' → placed in “'+(cfg.zoneName?cfg.zoneName[got]||got:got)+'”', why:why}); }
      } else if(got){
        /* distractor chip with no home: placing it anywhere is a wrong item */
        W++;
        items.push({s:'bad', label:ch.t+' → does not belong in any box', why:why||'This chip is a distractor — it is not part of the correct answer.'});
      }
    });
    if(N===0){ N=1; }
    return {H:H,W:W,N:N,items:items,expl:ex.expl};
  };
}
function buildMatch(w){
  var ex = w.ex;
  var chips = ex.right.map(function(r,i){ return {id:'r'+i, t:r, code:!!ex.code}; });
  var zones = ex.left.map(function(l,i){ return {id:'l'+i, label:l}; });
  /* chip-keyed map: chip rX belongs in zone lY  (grade looks up by chip id) */
  var correct = {}; ex.left.forEach(function(_,i){ correct['r'+ex.correct[i]] = 'l'+i; });
  var zoneName = {}; zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:zones, chips:chips, correct:correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}
function buildDnd(w){
  var ex = w.ex;
  var zoneName = {}; ex.zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:ex.zones, chips:ex.chips, correct:ex.correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}

/* ---------- order / rank ---------- */
function buildOrderW(w){
  var ex = w.ex, host = w.host;
  var ctx = ex.rankNote ? '<p class="small">'+esc(ex.rankNote)+'</p>' : '';
  if(!ex._shuf){ ex._shuf = shuffle(ex.correct.map(function(_,i){return i;})); }
  host.insertAdjacentHTML('afterbegin', ctx+'<div class="olist" id="olist"></div>');
  var list = host.querySelector('#olist');
  function bindAll(){
    Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var p = parseInt(b.getAttribute('data-p'),10);
        move(p, b.getAttribute('data-mv')==='up'? p-1 : p+1);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.oitem'), function(it){
      it.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      it.addEventListener('drop', function(ev){
        ev.preventDefault();
        var from = parseInt(ev.dataTransfer.getData('text/plain'),10);
        var to = parseInt(it.getAttribute('data-p'),10);
        if(!isNaN(from)){ move(from,to); }
      });
    });
  }
  function render(){
    list.innerHTML='';
    ex._shuf.forEach(function(itemIdx,pos){
      var d = document.createElement('div');
      d.className='oitem'; d.draggable=true; d.setAttribute('data-p',String(pos));
      d.innerHTML = '<span class="pos">'+(pos+1)+'</span><span style="flex:1">'+esc(ex.correct[itemIdx])+'</span>'+
        '<span class="obtns"><button type="button" aria-label="move up" data-mv="up" data-p="'+pos+'">▲</button>'+
        '<button type="button" aria-label="move down" data-mv="dn" data-p="'+pos+'">▼</button></span>';
      d.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', String(pos)); }catch(e){} d.classList.add('dragging'); });
      d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
      list.appendChild(d);
    });
    bindAll();
  }
  function move(from,to){
    if(from<0||to<0||from>=ex._shuf.length||to>=ex._shuf.length){ return; }
    var t = ex._shuf[from]; ex._shuf[from]=ex._shuf[to]; ex._shuf[to]=t; render();
  }
  render();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.correct.forEach(function(_,pos){
      var gotIdx = ex._shuf[pos];
      var ok = gotIdx===pos;
      if(ok){ H++; items.push({s:'ok', label:'Position '+(pos+1)+': '+clip(ex.correct[pos],70), why:ex.itemWhy?ex.itemWhy[pos]:''}); }
      else { W++; items.push({s:'bad', label:'Position '+(pos+1)+': you placed “'+clip(ex.correct[gotIdx],60)+'” — expected “'+clip(ex.correct[pos],60)+'”', why:ex.itemWhy?ex.itemWhy[pos]:''}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items,expl:ex.expl};
  };
}

/* ---------- select-blank report drafting ---------- */
function buildSelblank(w){
  var ex = w.ex, host = w.host;
  var h = '<div class="prose">';
  ex.parts.forEach(function(p){
    if(typeof p==='string'){ h += fmtText(p); }
    else { h += '<select data-b="'+p.b+'" aria-label="blank '+(p.b+1)+'" style="min-height:44px;background:#0f1826;color:#e6edf7;border:1.5px solid var(--blue);border-radius:8px;padding:6px 8px;font-size:.92rem;max-width:260px"></select>'; }
  });
  h += '</div>';
  host.insertAdjacentHTML('afterbegin', h);
  ex.parts.forEach(function(p){
    if(typeof p==='string'){ return; }
    var sel = host.querySelector('select[data-b="'+p.b+'"]');
    var opts = shuffle(p.o.map(function(_,i){return i;}));
    sel.insertAdjacentHTML('beforeend','<option value="">— choose —</option>');
    opts.forEach(function(oi){ sel.insertAdjacentHTML('beforeend','<option value="'+oi+'">'+esc(p.o[oi])+'</option>'); });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bi){
      var sel = host.querySelector('select[data-b="'+bi+'"]');
      var v = sel ? sel.value : '';
      if(v===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+ex.optsFor[bi][ex.correct[bi]]+'”. '+ex.why[bi]}); }
      else if(parseInt(v,10)===ex.correct[bi]){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+ex.optsFor[bi][ex.correct[bi]], why:ex.why[bi]}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+ex.optsFor[bi][parseInt(v,10)], why:'Correct: “'+ex.optsFor[bi][ex.correct[bi]]+'”. '+ex.why[bi]}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- terminal ---------- */
function normCmd(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function buildTerminal(w){
  var ex = w.ex, host = w.host, T = ex.terminal;
  if(!ex._timerInit){ ex._timerInit = true; exTimerLeft = T.timerSec||0; }
  var h = '';
  if(T.outshape){
    h += '<div class="synpanel"><h4>EXPECTED OUTPUT SHAPE</h4><div class="mono">'+esc(T.outshape)+'</div></div>';
  }
  if(T.syntax){
    h += '<div class="synpanel"><h4>SYNTAX REMINDER</h4>';
    h += '<p style="margin:.2rem 0">'+fmtText(T.syntax.shape)+'</p>';
    if(T.syntax.example){ h += '<p style="margin:.2rem 0">Example on a <b>different</b> target: <code class="inline-code">'+esc(T.syntax.example)+'</code></p>'; }
    if(T.syntax.flags && T.syntax.flags.length){ h += '<ul class="small" style="margin:.3rem 0 0 1.2rem">'; T.syntax.flags.forEach(function(f){ h+='<li>'+fmtText(f)+'</li>'; }); h+='</ul>'; }
    h += '</div>';
  }
  h += '<div class="term"><div class="term-h"><span>🖥 '+esc(T.termTitle||'simulation only — nothing real is executed')+'</span><span>'+esc(T.user||'analyst')+'</span></div>'+
       '<div class="term-out" id="tout"></div>'+
       '<div class="term-in"><span class="ps">'+esc(T.prompt||'$')+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="type your command and press Enter"></div></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var out = host.querySelector('#tout'), inp = host.querySelector('#tin');
  var lastCmd = '';
  (T.welcome||[]).forEach(function(l){
    var d=document.createElement('div'); d.textContent=l; out.appendChild(d);
  });
  function run(cmdRaw){
    var d1=document.createElement('div'); d1.textContent=(T.prompt||'$')+' '+cmdRaw; out.appendChild(d1);
    var cmd = normCmd(cmdRaw);
    lastCmd = cmd;
    var first = cmd.split(' ')[0];
    if(cmd===''){ /* nothing typed */ }
    else if(T.tools.indexOf(first)<0){
      var d2=document.createElement('div'); d2.textContent = (first? first+': ' : '')+'command not found';
      d2.style.color='#f0a8a4'; out.appendChild(d2);
    } else {
      var matched = null;
      (T.outsim||[]).some(function(os){ if(os.re && new RegExp(os.re,'i').test(cmd)){ matched = os; return true; } return false; });
      var lines = matched ? matched.out : (T.defaultOut||['(the command runs)']);
      lines.forEach(function(l){ var d3=document.createElement('div'); d3.textContent=l; out.appendChild(d3); });
    }
    out.scrollTop = out.scrollHeight;
  }
  inp.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){ var v=inp.value; inp.value=''; run(v); }
  });
  w._grade = function(){
    var cmd = lastCmd;
    var H=0,W=0,items=[];
    (T.elements||[]).forEach(function(el){
      var ok = new RegExp(el.re,'i').test(cmd);
      if(ok){ H++; items.push({s:'ok', label:el.label, why:el.why}); }
      else { items.push({s:'miss', label:el.label, why:el.why}); }
    });
    (T.bad||[]).forEach(function(bd){
      if(new RegExp(bd.re,'i').test(cmd)){ W++; items.push({s:'bad', label:bd.label, why:bd.why}); }
    });
    return {H:H,W:W,N:(T.elements||[]).length,items:items,expl:ex.expl};
  };
}

/* ---------- log viewer ---------- */
function buildLogview(w){
  var ex = w.ex, host = w.host, L = ex.logview;
  var h = '<div class="logbar"><input id="lf" type="text" placeholder="filter… (case-insensitive)" aria-label="filter log lines">'+
          '<span class="cnt" id="lcnt"></span></div><div class="lg" id="lg"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var lg = host.querySelector('#lg'), lf = host.querySelector('#lf'), cnt = host.querySelector('#lcnt');
  var sel = {};
  function render(filter){
    lg.innerHTML='';
    var shown=0;
    L.lines.forEach(function(line, i){
      if(filter && line.toLowerCase().indexOf(filter.toLowerCase())<0){ return; }
      shown++;
      var b = document.createElement('button');
      b.type='button'; b.className='lg-line'; b.setAttribute('data-i',String(i));
      b.textContent = line;
      if(L.click && sel[i]){ b.classList.add('sel'); }
      lg.appendChild(b);
    });
    cnt.textContent = shown+' / '+L.lines.length+' lines';
    Array.prototype.forEach.call(lg.querySelectorAll('.lg-line'), function(b){
      b.addEventListener('click', function(){
        if(!L.click){ return; }
        var i = parseInt(b.getAttribute('data-i'),10);
        sel[i] = !sel[i]; b.classList.toggle('sel', !!sel[i]);
      });
    });
  }
  render('');
  lf.addEventListener('input', function(){ render(lf.value.trim()); });
  if(L.click){
    host.insertAdjacentHTML('beforeend','<p class="small" style="margin-top:8px">Click line(s) in the log to select them as your answer. Use the filter box to narrow the view first.</p>');
  } else if(L.sub){
    var sub = document.createElement('div');
    sub.style.marginTop='10px';
    host.appendChild(sub);
    var subEx = Object.assign({}, L.sub, {type:L.sub.type||'qcm', id:ex.id+'-sub', title:ex.title, expl:ex.expl, hint:ex.hint, study:ex.study});
    var sw = makeWidget(subEx, sub, w.reviewMode);
    sw.render();
    w._grade = function(){ return sw._grade ? sw._grade() : {H:0,W:0,N:1,items:[],expl:ex.expl}; };
    return;
  }
  w._grade = function(){
    if(L.click){
      var H=0,W=0,items=[];
      L.clickCorrect.forEach(function(ci){
        if(sel[ci]){ H++; items.push({s:'ok', label:'Log line '+(ci+1)+' — “'+clip(L.lines[ci],70)+'”', why:L.why?L.why[ci]:''}); }
        else { items.push({s:'miss', label:'Log line '+(ci+1)+' — “'+clip(L.lines[ci],70)+'”', why:'You did not select it. '+(L.why?L.why[ci]:'')}); }
      });
      Object.keys(sel).forEach(function(k){
        var i=parseInt(k,10);
        if(sel[i] && L.clickCorrect.indexOf(i)<0){ W++; items.push({s:'bad', label:'Log line '+(i+1)+' — “'+clip(L.lines[i],70)+'”', why:(L.why&&L.why[i])||'This line does not show the behaviour asked in the question.'}); }
      });
      return {H:H,W:W,N:L.clickCorrect.length,items:items,expl:ex.expl};
    }
    return {H:0,W:0,N:1,items:[],expl:ex.expl};
  };
}

/* ---------- branching decision tree / simulation ---------- */
function buildTree(w){
  var ex = w.ex, host = w.host;
  var step = 0; var chosen = {};
  function renderStep(){
    var n = ex.steps.length;
    var s = ex.steps[step];
    if(!s._order){ s._order = shuffle(s.opts.map(function(_,i){return i;})); }
    var h = '<div><span class="stepchip">STEP '+(step+1)+' OF '+n+'</span></div>'+
            '<p class="prose" style="font-weight:600">'+fmtText(s.q)+'</p><div class="opts">';
    s._order.forEach(function(oi,k){
      h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(s.opts[oi].t)+'</span></button>';
    });
    h += '</div><div id="treeout"></div>';
    host.innerHTML = h;
    Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        var oi = parseInt(btn.getAttribute('data-i'),10);
        chosen[step] = oi;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
        var o = s.opts[oi];
        var last = (step===n-1);
        document.getElementById('treeout').innerHTML =
          '<div class="outcome"><b>RESULT OF YOUR CHOICE</b>'+fmtText(o.out)+'</div>'+
          '<button class="btn '+(last?'good':'primary')+'" id="tstep">'+(last?'Check final answer':'Confirm & continue ▸')+'</button>';
        document.getElementById('tstep').addEventListener('click', function(){
          if(last){ gradeCurrent(false); }
          else { step++; renderStep(); }
        });
      });
    });
  }
  renderStep();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.steps.forEach(function(s,i){
      var oi = chosen[i];
      var o = s.opts[oi];
      var lbl = 'Step '+(i+1)+': '+(o? clip(o.t,80) : '(no choice made)');
      if(o && o.ok){ H++; items.push({s:'ok', label:lbl, why:o.why||''}); }
      else if(o){ W++; items.push({s:'bad', label:lbl, why:o.why||''}); }
      else { items.push({s:'miss', label:lbl, why:''}); }
    });
    return {H:H,W:W,N:ex.steps.length,items:items,expl:ex.expl};
  };
}

  h += '<p class="sub">'+esc(I.tagline)+' <span id="who" style="font-weight:700"></span></p>';
  h += '<div class="card"><h2>About the ATT&CK object you will master</h2>'+I.about+'</div>';
  h += '<div class="card"><h2>Keywords covered in this exam</h2>';
  I.keywords.forEach(function(k){
    h += '<div class="kw-theme"><h3>'+esc(k.t)+'</h3><div class="kwrow">';
    k.chips.forEach(function(c){ h += '<span class="kw">'+esc(c)+'</span>'; });
    h += '</div></div>';
  });
  h += '</div>';

       '<button class="btn primary" id="btn-start" style="font-size:1.05rem;padding:12px 26px">▶ Start the exam</button>'+
       '<span class="small">Timer '+Math.round(EXAM.timerSec/60)+' minutes · '+EX.length+' exercises · pass mark '+EXAM.passMark+'%</span></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}
function boot(){
  $('btn-pause').addEventListener('click', manualPause);
  $('btn-resume').addEventListener('click', manualResume);
  $('btn-skip').addEventListener('click', skipCurrent);
  $('btn-hint').addEventListener('click', useHint);

  renderHeader();
  updateHeaderButtons();

}
document.addEventListener('DOMContentLoaded', boot);
