<script type="application/json" id="exam-data">{"meta": {"id": "T1601.001", "name": "Patch System Image", "parent": "T1601 Modify System Image", "domain": "Enterprise", "tactic": "Defense Impairment", "platform": "Network Devices", "topicId": "t1601.001", "version": "2.0", "updated": "12 May 2026", "estMin": 40, "budgetSec": 2400, "siteTitle": "T1601.001 Patch System Image — MEDIUM", "title_tag": "T1601.001 — MEDIUM practice exam", "sev": "MEDIUM", "sevClass": "sev-medium", "sevVar": "var(--sev-medium)", "difficulty": "medium", "batch": 2, "passMark": 70}, "learn": "\n<p>You already know what <b>T1601.001 — Patch System Image<\/b> is: a sub-technique of <b>T1601 — Modify System Image<\/b>, where an attacker changes the operating system of a <b>network device<\/b> — the one file that holds the whole OS. This exam pushes one step further: you will connect <b>two ideas at a time<\/b>. For example: read a device log <i>and<\/i> name the technique; pick a mitigation <i>and<\/i> say what it protects.<\/p>\n<p>These are real work shapes. A <b>SOC analyst<\/b> triages an image-transfer alert and decides the next step. A <b>detection engineer<\/b> builds rules from the detection strategy <b>DET0469 / analytic AN1293<\/b>, which watches CLI commands, config changes, and runtime memory manipulation. A <b>network security engineer<\/b> verifies image hashes out-of-band and enforces <b>TACACS+/RADIUS<\/b> multi-factor login. An <b>incident responder<\/b> chooses actions that keep evidence and uptime safe. A <b>GRC analyst<\/b> points auditors at the right controls.<\/p>\n<p>Expect artefacts: TACACS+ command accounting, config diffs, syslog, and hash tables. Expect decisions, not just recall. Every wrong answer still teaches you something — the feedback explains each item in plain words.<\/p>\n", "keywords": [{"theme": "Technique mechanics", "items": ["Storage patch: copy tftp → boot variable → reload", "Memory patch: debug commands", "Persistence: ROMMONkit (T1542.004) combo", "False CLI output (patched show version)", "Flash vs running memory"]}, {"theme": "Detection strategy DET0469 / AN1293", "items": ["Anomalous image transfers (TFTP, SCP, FTP)", "Unauthorized CLI altering boot system variables", "Integrity mismatch: running vs baseline image", "Runtime memory manipulation attempts", "Suspicious chain: upload → boot param change → reload/reboot"]}, {"theme": "Data components", "items": ["Command Execution DC0064 (networkdevice:cli)", "File Modification DC0061 (networkdevice:config)", "Firmware Modification DC0004 (firmware:runtime)"]}, {"theme": "Mitigations in depth", "items": ["M1046 Boot Integrity (signature at boot)", "M1045 Code Signing (vendor-signed images)", "M1032 Multi-factor Authentication (TACACS+/RADIUS)", "M1026 Privileged Account Management", "M1043 Credential Access Protection", "M1027 Password Policies"]}, {"theme": "Telemetry & roles", "items": ["TACACS+ command accounting", "Config archive diffs (out-of-band)", "Vendor-published image hashes", "SOC triage, detection engineering, IR decisions"]}], "howExtra": "<li><b>Two ideas per exercise:<\/b> expect to combine an artefact with a technique name, or a goal with a control. Distractors are mild but real — always ask <i>why<\/i> an option is wrong.<\/li>", "exercises": [{"id": "M01", "type": "qcm", "persp": "def", "summary": "Name the technique behind a TACACS+ line", "scenario": "<p>Monday shift. The AAA server sent you one TACACS+ command-accounting line from <b>core-sw-07<\/b>. The account <code>svc_monitor<\/code> should only collect telemetry, never install software. Your lead asks two things: what is happening, and which ATT&amp;CK sub-technique it matches.<\/p>", "artefacts": [{"label": "Artefact 1 — TACACS+ command accounting", "code": "Oct 11 03:12:07 acct: user=svc_monitor on core-sw-07 (vty1, 10[.]30[.]7[.]15): copy tftp://10[.]30[.]7[.]15/ios-image.bin flash:"}], "question": "Which sub-technique does this line most directly indicate?", "options": [{"t": "T1601.001 Patch System Image", "ok": true, "why": "A new OS image file is being copied into flash: — the first step of patching the device's system image."}, {"t": "T1601.002 Downgrade System Image", "ok": false, "why": "A downgrade also moves an image, but nothing here shows an older version being installed. The patch path is the direct match."}, {"t": "T1542.004 ROMMONkit", "ok": false, "why": "ROMMONkit implants code in the boot loader before the OS. This line is a normal CLI file copy while the OS runs."}, {"t": "T1078 Valid Accounts", "ok": false, "why": "The svc_monitor account may be abused, but the behaviour captured is an image copy — T1601.001 names that behaviour."}], "hint": "Ask what the command moves and where: an OS image file, into flash.", "explain": "The command copies an OS image into flash — the storage-patch entry step of T1601.001. Two ideas connect here: the artefact (a privileged copy command from an account that should not do it) and the technique (image patching). T1601.002 is the near miss: it also transfers an image, but the downgrade signature is an older version, which this line never claims. ROMMONkit would appear as boot-loader work, not a runtime copy.", "study": "T1601.001 vs T1601.002 vs T1542.004 on the ATT&CK site; TACACS+ command accounting basics."}, {"id": "M02", "type": "multi", "persp": "def", "summary": "Select the analytic's signals in a night of events", "scenario": "<p>You are tuning the new detection for <b>rtr-border-09<\/b>. The analytic <b>AN1293<\/b> looks for anomalous image-file transfers, unauthorized CLI that alters boot variables, integrity mismatches, and a chain of upload → boot change → reload. Here is the night's event list from three sources.<\/p>", "artefacts": [{"label": "Event list — rtr-border-09, last night", "code": "01) 03:11:50  TFTP transfer of ios-image.bin from 10[.]31[.]8[.]77 (no change ticket found)\n02) 03:12:31  startup-config now has: boot system flash:ios-image.bin\n03) 03:18:05  device reloaded (requested from vty session of the same host)\n04) 04:02:00  failed SSH login for account 'printer01'\n05) 04:40:11  BGP session flap (ISP says planned maintenance)\n06) 05:00:00  NTP clock sync succeeded"}], "question": "Select ALL events that analytic AN1293 treats as signals of this technique.", "options": [{"t": "1 — TFTP image transfer with no ticket", "ok": true, "why": "Anomalous image-file transfer is the first signal the analytic names."}, {"t": "2 — boot system variable changed", "ok": true, "why": "Unauthorized CLI/config that alters boot parameters is the second signal."}, {"t": "3 — reload right after the boot change", "ok": true, "why": "Upload → boot param change → reload is the suspicious chain the analytic describes."}, {"t": "4 — failed SSH login for printer01", "ok": false, "why": "A failed login is a different problem (possible brute force), not an image-patch signal."}, {"t": "5 — BGP flap from ISP maintenance", "ok": false, "why": "A routing flap is noise here; the analytic does not look at routing events."}, {"t": "6 — NTP sync", "ok": false, "why": "Clock sync is routine. It neither moves an image nor changes boot parameters."}], "hint": "Three events touch the image file, the boot variable, or the reload. The other three are other stories.", "explain": "AN1293 fires on the chain: image transfer, boot-variable change, then reload — events 1, 2, 3. The failed printer login, the BGP flap, and the NTP sync are realistic noise you must learn to set aside. This is exactly how detection engineers tune: same log stream, different stories, only one chain matches the technique.", "study": "The Detection Strategy table on the T1601.001 page (analytic AN1293)."}, {"id": "M03", "type": "match", "persp": "def", "summary": "Match each listed mitigation to its effect", "scenario": "<p>Your GRC analyst must defend four control choices in an audit. She asks you to check that each mitigation does what the team claims. Match every mitigation to its real effect; two effects are decoys.<\/p>", "question": "Match each mitigation to the effect it provides for T1601.001.", "left": ["M1046 Boot Integrity", "M1045 Code Signing", "M1032 Multi-factor Authentication", "M1026 Privileged Account Management"], "right": ["The device verifies the image's cryptographic signature each time it boots", "Only vendor-signed OS images are deployed, so a patched fake fails validation", "Device logins need a second factor through TACACS+ or RADIUS", "Admin accounts stay few, least-privileged, and without shared passwords", "User emails are backed up to the cloud nightly", "All inbound email attachments are blocked at the gateway"], "hint": "Two mitigations are about the image itself (boot-time and deploy-time), two are about who may touch the device.", "explain": "M1046 and M1045 attack the patch directly: signature checks at boot and signed images at deploy time mean a patched image is refused or flagged. M1032 and M1026 attack the access an attacker needs first: a second factor on TACACS+/RADIUS logins, and few, clean admin accounts. The decoys belong to email security, not to network device integrity — a classic audit mix-up.", "study": "The Mitigations table of the T1601.001 page."}, {"id": "M04", "type": "dnd", "persp": "def", "summary": "Sort artefacts into the analytic's data components", "scenario": "<p>As the detection engineer, you must feed analytic AN1293 with the right telemetry. The page lists three data components. Sort each artefact into the component that should carry it.<\/p>", "question": "Drag each artefact into the data component that produces it.", "banks": [{"label": "Command Execution (DC0064, networkdevice:cli)"}, {"label": "File Modification (DC0061, networkdevice:config)"}, {"label": "Firmware Modification (DC0004, firmware:runtime)"}], "items": [{"t": "TACACS+ log: 'copy tftp://10[.]30[.]7[.]15/ios-image.bin flash:' typed on vty0", "bank": 0, "why": "A privileged command typed in the CLI is Command Execution."}, {"t": "TACACS+ log: 'boot system flash:ios-image.bin' typed on vty0", "bank": 0, "why": "The boot system command entered via CLI is Command Execution; the config side is captured separately."}, {"t": "Config archive diff: startup image path now points to ios-image.bin", "bank": 1, "why": "A change to the stored configuration's image path is File Modification."}, {"t": "Config archive diff: boot loader parameters changed on fw-dmz-02", "bank": 1, "why": "Boot-loader parameter changes in the configuration are File Modification."}, {"t": "Runtime sensor: memory write into the running OS image region", "bank": 2, "why": "Runtime manipulation of OS memory is Firmware Modification on the firmware:runtime channel."}, {"t": "Runtime sensor: debug session attached to live OS memory", "bank": 2, "why": "A debug session touching OS memory is runtime firmware manipulation."}], "hint": "Ask for each artefact: was it a command someone typed, a change saved in config, or a live memory edit?", "explain": "The analytic consumes three streams: privileged commands (DC0064), stored configuration changes (DC0061), and runtime memory manipulation (DC0004). The same attack shows up in all three: the attacker types commands, saves a boot change, and may patch memory directly. If you collect only one stream you see only one third of the technique — that is why coverage reasoning matters.", "study": "The Detection Strategy table: data components and their channels."}, {"id": "M05", "type": "order", "persp": "def", "summary": "Order the image-integrity validation workflow", "scenario": "<p>An alert says <b>rtr-border-09<\/b> received an image file overnight. Your runbook says: validate before you escalate, and never trust the device's own CLI output alone. Put the runbook steps in order.<\/p>", "question": "Drag the four runbook steps into the correct order (first step on top).", "steps": ["Get the vendor-published hash for the exact image version and filename", "Compute the hash of the flash file out-of-band, away from the device's own CLI", "Compare the two values and record the result with a timestamp", "Escalate to incident response with the evidence if the hashes differ"], "hint": "You need a trusted reference before you can compare anything, and a comparison before any escalation.", "explain": "Validation has an order: reference first (vendor hash), measurement second (out-of-band, because a patched CLI can lie), comparison third, escalation last with evidence attached. Skipping to escalation wastes IR time; trusting the device CLI can miss the attack — the description says patched images can make commands print false output.", "study": "Vendor image-integrity guidance referenced by ATT&CK (Cisco IOS Software Integrity Assurance)."}, {"id": "M06", "type": "terminal", "persp": "def", "summary": "Compute the image MD5 on the device", "scenario": "<p>Change window on <b>core-sw-07<\/b>. The vendor published an MD5 for <code>ios-image.bin<\/code> in flash. You must make the device compute the hash of that file so you can compare it. You know the tool family for file verification; choose the right options yourself.<\/p>", "question": "Type the privileged CLI command that computes the MD5 hash of flash:ios-image.bin, then press Enter.", "term": {"prompt": "core-sw-07#", "shellName": "network device CLI", "canonical": "verify /md5 flash:ios-image.bin", "canonicalWhy": "'verify' asks the device to check a file; '/md5' selects the MD5 algorithm; 'flash:ios-image.bin' is the target file.", "outputs": [{"re": "verify", "out": "Done!\nMD5 of flash:ios-image.bin is 9f2c...a1 (matches vendor value)"}], "defaultOut": "", "requires": [{"re": "\\bverify\\b", "label": "the verify tool", "why": "verify makes the device compute/check a file's integrity."}, {"re": "/md5", "label": "the /md5 option", "why": "The vendor published an MD5, so you must select the matching algorithm."}, {"re": "flash:[a-z0-9._\\-]+", "label": "the target file in flash (flash:ios-image.bin)", "why": "The hash must be computed over the exact image file."}], "forbid": [{"re": "\\breload\\b|write erase|\\bformat\\b", "label": "a state-changing command (reload / write erase / format)", "why": "A verification step must never change device state."}]}, "hint": "The tool is 'verify'. You still need the algorithm option and the exact file target.", "explain": "The canonical command is verify /md5 flash:ios-image.bin. Two ideas connect: the goal (compute the vendor's algorithm) and the option mapping (/md5). Watch out for near misses: verify with no algorithm, or pointing at the wrong file, gives you an unusable answer. And verification commands must never change state — a reload here would be an outage, not a check.", "study": "Device CLI: the verify command family and its options."}, {"id": "M07", "type": "logview", "persp": "def", "summary": "Find the FIRST step of the chain in accounting logs", "scenario": "<p>The AAA server keeps full command accounting. Below is the night slice for three devices. Use the filter (try <code>flash<\/code>). The chain for a storage patch has a first step — find it.<\/p>", "artefacts": [{"label": "Log — TACACS+ command accounting (excerpt)", "filter": true, "code": "Jul 02 03:11:50 acct: user=svc_backup on rtr-border-09 (vty2, 10[.]31[.]8[.]77): copy tftp://10[.]31[.]8[.]77/ios-image.bin flash:\nJul 02 03:12:14 acct: user=svc_backup on rtr-border-09: conf t\nJul 02 03:12:31 acct: user=svc_backup on rtr-border-09: boot system flash:ios-image.bin\nJul 02 03:13:02 acct: user=netadmin on core-sw-07: show version\nJul 02 03:13:44 acct: user=netadmin on core-sw-07: verify /md5 flash:ios-image.bin\nJul 02 03:18:05 acct: user=svc_backup on rtr-border-09: reload\nJul 02 03:19:20 acct: user=netops on fw-dmz-02: show clock"}], "question": "Which single line is the FIRST step of the storage-patch chain?", "options": [{"t": "The copy tftp:// ... flash: line at 03:11:50", "ok": true, "why": "The chain starts when the patched image arrives. Nothing before this line touches the device image."}, {"t": "The boot system flash:ios-image.bin line at 03:12:31", "ok": false, "why": "The boot change is the SECOND step — it points the device at a file that must already be there."}, {"t": "The reload line at 03:18:05", "ok": false, "why": "The reload is the THIRD step — it activates what was already staged."}, {"t": "The verify /md5 line at 03:13:44", "ok": false, "why": "That is a defender-style integrity check by netadmin, not part of the attacker chain."}], "hint": "Chain order: the file must arrive before anything can point to it or load it.", "explain": "First the file arrives (copy tftp), then the boot variable is aimed at it, then the device reloads. Picking the boot or reload line means you read the chain backwards — the near miss the analytic warns about. Notice the defender line in the middle: netadmin running verify /md5 on a different device, which is exactly the check rtr-border-09 never got.", "study": "The suspicious chain in analytic AN1293: upload → boot parameter change → reload."}, {"id": "M08", "type": "multi", "persp": "att", "summary": "What survives the scheduled reload", "scenario": "<p>Red-team debrief. Your operator memory-patched <b>rtr-border-09<\/b> this afternoon, but the maintenance calendar shows a scheduled <b>reload tonight<\/b>. The lead asks what will survive, per the ATT&amp;CK description's own combinations.<\/p>", "question": "Select the TWO statements that are TRUE about surviving tonight's reload.", "options": [{"t": "A storage patch in flash loads again automatically at boot", "ok": true, "why": "The image file is read at every boot, so a storage patch comes back on its own."}, {"t": "Memory patching combined with ROMMONkit bootloader code can persist", "ok": true, "why": "The page says live memory modification can be combined with ROMMONkit to achieve persistence."}, {"t": "A memory patch alone survives the reboot", "ok": false, "why": "The page says a memory-only patch does not survive across reboots."}, {"t": "The SIEM copies the patch out automatically", "ok": false, "why": "A SIEM stores logs, not device implants. Nothing copies the patch anywhere."}], "hint": "One true answer is about where the file lives; the other is a named combination with boot-loader code.", "explain": "Two facts connect: persistence semantics (storage yes, memory no) and the named combo (memory patch + ROMMONkit). Defenders read the same facts the other way: a device that reloads does not cleanse a storage patch, and ROMMONkit below the OS survives even image replacements — that is why M1046 Boot Integrity, which checks signatures at boot, is on the mitigation list.", "study": "The description sentences about reboots and ROMMONkit; mitigation M1046."}, {"id": "M09", "type": "tree", "persp": "dual", "summary": "Branching triage of an image-transfer alert", "question": "Take the three decision points in order — each choice unlocks the next step.", "scenario": "<p>03:12. Queue shows: “TFTP transfer of ios-image.bin to <b>core-sw-07<\/b> from unknown host 10[.]31[.]8[.]77. No change ticket.” Answer the three decision points.<\/p>", "steps": [{"text": "What do you do FIRST?", "options": [{"t": "Validate the flash file hash out-of-band against the vendor's value", "ok": true, "outcome": "You open the vendor portal, get the published hash, and start an out-of-band check. Solid first move.", "why": "Validating with independent data decides everything that follows; the device's own answers may be patched."}, {"t": "Trust show version on the device — if it prints the right version, close the alert", "outcome": "The device prints the expected version and you close the alert. You never notice the flash file changed.", "why": "A patched image can make the CLI print false output — trusting the device validates nothing."}, {"t": "Reboot the switch immediately to clear any malware", "outcome": "The switch reboots... and loads whatever is staged in flash. If a storage patch exists, you just activated it and caused an outage.", "why": "Rebooting before checking the boot variable can activate a storage patch and destroy runtime evidence."}]}, {"text": "The out-of-band hash does NOT match the vendor value, and the boot variable changed yesterday. What kind of patch is this?", "options": [{"t": "A storage patch — the file in flash was replaced", "ok": true, "outcome": "You record: file hash mismatch plus boot-variable change — a storage patch, active at next boot.", "why": "A changed file plus a changed boot variable is the storage-patch signature."}, {"t": "A memory-only patch", "ok": false, "outcome": "You log the wrong classification and the response plan follows the wrong path.", "why": "Memory patches do not change files or boot variables — the evidence says storage."}, {"t": "You cannot tell from this evidence", "ok": false, "outcome": "You freeze while the evidence was actually decisive.", "why": "Two independent artifacts (hash + boot variable) are enough to classify."}]}, {"text": "Containment choice for the morning bridge — which action do you take?", "options": [{"t": "Isolate the management plane, keep the device running, hand evidence to IR", "ok": true, "outcome": "The device stays up, traffic flows, and IR gets a clean evidence set. Chosen like a senior.", "why": "Least aggressive first: stop access, preserve evidence, let IR decide the rebuild moment."}, {"t": "Reload to the golden image immediately, unscheduled", "outcome": "The switch drops out of production without approval and the running evidence is gone.", "why": "An unscheduled reload destroys runtime evidence and causes an outage nobody approved."}, {"t": "Wait for the next quarterly maintenance window", "outcome": "You wait... while a compromised core switch keeps running with a patch someone installed at 03:12.", "why": "A confirmed image patch cannot wait a quarter. Delay is the wrong extreme."}]}], "hint": "Each step has one choice that is safe, evidence-preserving, and proportionate. Extremes are wrong.", "explain": "This is the classic two-idea triage: validate independently first, classify from decisive evidence, then contain with the least aggressive effective action. Attacker perspective: the attacker needed you to reboot (activating their patch) or to trust the CLI (missing them) — you did neither. Defender perspective: the out-of-band hash plus the config diff decided the case in minutes.", "study": "Validation-before-action runbooks; the false-CLI-output paragraph on the ATT&CK page."}, {"id": "M10", "type": "fill", "persp": "def", "summary": "Complete the analytic's rule sentence", "question": "Complete the three blanks describing analytic AN1293 with words from the bank.", "scenario": "<p>You must brief the SOC on what analytic <b>AN1293<\/b> actually watches. Complete the sentence with words from the bank; four are decoys.<\/p>", "text": "The analytic watches for anomalous transfers of {0} files, for unauthorized CLI commands that alter {1} variables, and for integrity mismatches between the running OS and the {2} image.", "bank": ["image", "boot system", "baseline", "TFTP", "SNMP", "reboot", "ACL", "printer"], "blanks": [{"ok": "image", "accept": ["^image"], "why": "The analytic watches image-file transfers (TFTP, SCP, FTP)."}, {"ok": "boot system", "accept": ["^boot( system)?$"], "why": "Unauthorized CLI that alters boot system variables is a named signal."}, {"ok": "baseline", "accept": ["^baseline"], "why": "Integrity is checked against the approved baseline image."}], "hint": "Blank 1 is what gets transferred; blank 2 is the config setting; blank 3 is the trusted reference.", "explain": "AN1293 in one sentence: watch image transfers, boot-variable changes, and mismatch against the baseline. Word your SIEM rule from exactly these three signals and you reproduce the ATT&CK detection strategy instead of a generic 'file transferred' alert that fires every day.", "study": "The analytic description row (AN1293) on the T1601.001 page."}, {"id": "M11", "type": "qcm", "persp": "dual", "summary": "Why show version cannot settle it", "scenario": "<p>On <b>rtr-border-09<\/b>, <code>show version<\/code> prints the expected “Version 17.9.5a”. Yet the out-of-band MD5 of the flash file does not match the vendor value. Your junior says: “The version matches, so we are fine.” Explain why he is wrong.<\/p>", "question": "Why can the version output NOT be trusted in this case?", "options": [{"t": "A patched image can make the CLI print a false version", "ok": true, "why": "The description says adversaries compromise existing commands to produce false output — for example printing the old, higher version number."}, {"t": "The SIEM clock is wrong", "ok": false, "why": "Clock drift changes timestamps, not the text a device prints about itself."}, {"t": "Versions are random on every device", "ok": false, "why": "Versions are deterministic build identifiers, not random values."}, {"t": "The vendor forgot to publish the version", "ok": false, "why": "The vendor publishes both versions and hashes; the hash is the trusted reference here."}], "hint": "The attacker controls the program that prints the version. Who wins when the liar checks itself?", "explain": "Two ideas connect: the false-output trick from the description, and the hierarchy of trust — an independent hash beats the device's own claim about itself. The page even gives the exact scenario: patching is combined with a downgrade so the fake output shows the original higher revision. Defenders therefore verify out-of-band; attackers rely on defenders forgetting this.", "study": "The false-output paragraph in the T1601.001 description."}, {"id": "M12", "type": "multi", "persp": "att", "summary": "What the attacker can do after patching", "scenario": "<p>Red-team planning: you control a patched border router image for the exercise (rules of engagement signed). The blue team asks your lead what the patch realistically enables, per the ATT&amp;CK description's examples of new capabilities.<\/p>", "question": "Select the TWO statements that describe real post-patch capabilities named on the page.", "options": [{"t": "Relay attacker traffic through the device (Multi-hop Proxy)", "ok": true, "why": "Multi-hop Proxy is named: the device sits in the traffic path, perfect for relaying."}, {"t": "Record what admins type on the device (Keylogging)", "ok": true, "why": "Keylogging is named: the patched OS can watch keystrokes, including admin sessions."}, {"t": "Make the config print on paper faster", "ok": false, "why": "Printing speed is not a capability the OS image patch provides."}, {"t": "Automatically install the vendor's own updates", "ok": false, "why": "Installing vendor updates is a defender action — the opposite of weakening the device."}], "hint": "Think about where the device sits (traffic path) and what it sees (admin sessions).", "explain": "The patch turns a trusted middlebox into an attacker platform: Multi-hop Proxy hides the attacker behind your own device, Keylogging harvests credentials. Both examples come straight from the description's capability list (Keylogging, Multi-hop Proxy, Port Knocking). For the defender, this is the business impact of one file: the technique is about positions of trust, not just one box.", "study": "The capability list in the T1601.001 description."}, {"id": "M13", "type": "triage", "persp": "def", "summary": "Triage three device-image alerts", "question": "Assign exactly one action to each of the three alerts, then press Check once.", "scenario": "<p>You inherit the night shift queue. Three alerts mention device images. One action per alert; press Check once. Partial credit: one item per alert.<\/p>", "alerts": [{"title": "SCP push of ios-image.bin to rtr-border-09", "meta": "14:02, change ticket CM-2214 approved, operator netops, hash matches vendor value", "options": [{"t": "Close as benign, approved change", "ok": true, "why": "Approved ticket, normal hours, matching vendor hash — this is a routine upgrade."}, {"t": "Escalate to IR now", "ok": false, "why": "Escalating a ticketed, hash-matching push buries real incidents in noise."}, {"t": "Reboot the device to be safe", "ok": false, "why": "Never reboot a device as a reflex; the change is verified benign."}]}, {"title": "TFTP upload to core-sw-07 from unknown host", "meta": "03:12, source 10[.]31[.]8[.]77 (not in CMDB), no ticket, image file name ios-image.bin", "options": [{"t": "Investigate: validate hash out-of-band and pull TACACS+ accounting", "ok": true, "why": "Unknown host, no ticket, night time — investigate with independent evidence before any device action."}, {"t": "Close as routine vendor maintenance", "ok": false, "why": "There is no ticket and the source host is unknown; closing loses the chain."}, {"t": "Email the attacker's ISP", "ok": false, "why": "You have no attribution; internal validation comes first."}]}, {"title": "verify /md5 flash:ios-image.bin run by netadmin", "meta": "11:20, change window active, matches CM-2214 validation plan", "options": [{"t": "Close as benign — that is a healthy verification", "ok": true, "why": "A hash verification during an approved window is exactly what the runbook wants."}, {"t": "Investigate the netadmin account", "ok": false, "why": "The action is defensive and ticketed; investigating it wastes the shift."}, {"t": "Escalate to IR", "ok": false, "why": "Nothing here indicates the technique — a check ran, nothing changed."}]}], "hint": "Ask each alert: is there an approved ticket AND independent integrity evidence? Both, or investigate.", "explain": "Triage weighs ticket context plus integrity evidence. Alert 1 has both (ticket + vendor hash) → benign. Alert 2 has neither → investigate. Alert 3 is a defender action → benign. The two ideas: change-management context, and what T1601.001 evidence actually looks like (transfers in, boot changes, hash mismatch — never a verify command).", "study": "Difference between image-writing actions (T1601.001 signals) and image-reading actions (defender hygiene)."}, {"id": "M14", "type": "qcm", "persp": "def", "summary": "What M1032 means on a network device", "scenario": "<p>Your hardening project must satisfy mitigation <b>M1032 Multi-factor Authentication<\/b> for T1601.001. A vendor rep suggests a captive portal. The ATT&amp;CK mitigation text says what device admins should actually use.<\/p>", "question": "Which choice matches M1032 as written for network devices?", "options": [{"t": "Use multi-factor authentication for user and privileged accounts via TACACS+ or RADIUS", "ok": true, "why": "The mitigation text names MFA for user and privileged accounts and points at TACACS+/RADIUS support on embedded devices."}, {"t": "Encrypt the flash chip with a laptop disk-encryption tool", "ok": false, "why": "That is storage encryption, not authentication, and laptop tools do not run on embedded devices."}, {"t": "Move all devices into the guest VLAN", "ok": false, "why": "Segmentation is a different control; M1032 is about authenticating the humans."}, {"t": "Print the admin list weekly", "ok": false, "why": "A printed list proves nothing about how people log in."}], "hint": "MFA = the person proves identity two ways. Which systems hold device accounts?", "explain": "M1032 on this page is concrete: multi-factor for user and privileged accounts, with TACACS+ and/or RADIUS as the device-friendly systems. The second idea is the chain: stolen admin passwords are the cheapest path to privileged CLI, and privileged CLI is what T1601.001 needs — so authentication hardening directly reduces the technique's likelihood.", "study": "The M1032 row in the T1601.001 Mitigations table."}, {"id": "M15", "type": "match", "persp": "att", "summary": "Match each weakened defense to its technique", "scenario": "<p>The description says patching can <b>weaken existing defenses<\/b> and names where each weakening leads in ATT&amp;CK. Match the outcomes; two names are decoys.<\/p>", "question": "Match each weakened defense to the technique it corresponds to.", "left": ["Weaken the device's encryption", "Weaken the device's perimeter role", "Weaken how admins authenticate to the device", "Capture what admins type on the device"], "right": ["Weaken Encryption (T1600)", "Network Boundary Bridging", "Network Device Authentication", "Keylogging", "Data Encrypted for Impact", "Boot or Logon Autostart Execution"], "hint": "One is about crypto, one about the perimeter, one about logins, one about keystrokes.", "explain": "The page names three weakened defenses — encryption (T1600 Weaken Encryption), authentication (Network Device Authentication), and perimeter controls (Network Boundary Bridging) — plus the added capability Keylogging. Knowing the neighbouring objects turns one detection (image patch) into several hypotheses: after T1601.001, hunt for weaker ciphers, bridged boundaries, and tampered logins on the same device.", "study": "The linked techniques inside the T1601.001 description."}, {"id": "M16", "type": "qcm", "persp": "def", "summary": "Out-of-band telemetry for silent devices", "scenario": "<p><b>fw-dmz-02<\/b> is an old firewall that sends almost nothing to the SIEM. The network team still runs a central AAA service, and config backups happen nightly on a separate server. You still want to know if anyone typed image commands on it.<\/p>", "question": "Which out-of-band source would still reveal a 'copy tftp ... flash:' attempt on fw-dmz-02?", "options": [{"t": "TACACS+ command accounting stored on the AAA server", "ok": true, "why": "Commands typed on the device are recorded by the AAA service, even when the device itself logs nothing."}, {"t": "The office printer logs", "ok": false, "why": "Printers do not see device CLI sessions."}, {"t": "Endpoint antivirus on user laptops", "ok": false, "why": "Laptop AV watches laptops, not firewall CLI activity."}, {"t": "Cloud storage audit logs", "ok": false, "why": "The device is on-premise; cloud audit logs cover cloud resources."}], "hint": "Where do the person's keystrokes get recorded when the device itself stays silent?", "explain": "Two ideas connect: telemetry gaps on old devices, and out-of-band sources. TACACS+ command accounting records every privileged command centrally; nightly config archives reveal boot-variable drift. This is why detection coverage for T1601.001 does not depend on the device's own logging being healthy — a lesson that saves you when the attacker (or the vendor) has made the device quiet.", "study": "AAA command accounting; configuration archive tooling (out-of-band sources)."}]}</script>
<script>

(function () {
  'use strict';
  var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
  var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  var EXS = EXAM.exercises;
  var LETTERS = 'ABCDEFGHIJ';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { s = Math.max(0, s | 0); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function normCmd(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[?]+$/, '');
  }

  /* ---------- state ---------- */
  var S = {
    view: 'intro', order: [], i: 0,
    shuffle: {}, answers: {}, results: {}, checked: {}, hintUsed: {},
    collapsed: {}, skipped: [], phase: 'main',
    pauseManualSec: 0, pauseAutoSec: 0,
    reported: false, finalPercent: 0, handshake: null,
    focusTerm: false
  };
  var T = { state: 'IDLE', remaining: EXAM.meta.budgetSec, resumeTo: null };

  /* ---------- scoring (spec contract) ---------- */
  function scoreExercise(selectedItems, correctItems) {
    var ok = {}, i, H = 0, W = 0;
    for (i = 0; i < correctItems.length; i++) ok[correctItems[i]] = true;
    for (i = 0; i < selectedItems.length; i++) { if (ok[selectedItems[i]]) H++; else W++; }
    var N = correctItems.length;
    return { credit: (N ? Math.max(0, (H - W) / N) : 0), H: H, W: W, N: N };
  }

  /* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
  function setTimer(st) { T.state = st; renderTimerChip(); }
  function tick() {
    if (T.state === 'RUNNING') {
      T.remaining -= 1;
      renderTimerChip();
      if (T.remaining <= 0) { T.remaining = 0; endExam('timeout'); return; }
    } else if (T.state === 'PAUSED_MANUAL') { S.pauseManualSec += 1; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { S.pauseAutoSec += 1; }
  }
  setInterval(tick, 1000);

  function curKey() { return S.order[S.i]; }
  function curEx() { return EXS[curKey()]; }

  /* ---------- per-exercise presentation shuffles ---------- */
  function initExerciseState(key) {
    var ex = EXS[key], sh = {}, i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
      sh.opts = [];
      for (i = 0; i < ex.options.length; i++) sh.opts.push(i);
      sh.opts = shuffle(sh.opts);
    } else if (ex.type === 'match') {
      sh.rights = shuffle(ex.right.map(function (w, i) { return i; }));
    } else if (ex.type === 'dnd') {
      sh.chips = shuffle(ex.items.map(function (w, i) { return i; }));
    } else if (ex.type === 'order') {
      sh.chips = shuffle(ex.steps.map(function (w, i) { return i; }));
    } else if (ex.type === 'fill') {
      sh.bank = shuffle(ex.bank.map(function (w, i) { return i; }));
    } else if (ex.type === 'tree') {
      sh.opts = ex.steps.map(function (st) { return shuffle(st.options.map(function (o, i) { return i; })); });
    } else if (ex.type === 'triage') {
      sh.alerts = ex.alerts.map(function (a) { return shuffle(a.options.map(function (o, i) { return i; })); });
    }
    S.shuffle[key] = sh;
    resetAnswer(key);
  }
  function resetAnswer(key) {
    var ex = EXS[key], i, a = {};
    if (ex.type === 'qcm' || ex.type === 'logview') { a = { sel: [] }; }
    else if (ex.type === 'multi') { a = { sel: [] }; }
    else if (ex.type === 'match') { a = { map: {}, picked: null }; }
    else if (ex.type === 'dnd') { a = { place: {}, picked: null }; }
    else if (ex.type === 'order') { a = { slots: [], picked: null }; }
    else if (ex.type === 'fill') { a = { vals: [] }; for (i = 0; i < ex.blanks.length; i++) a.vals.push(''); }
    else if (ex.type === 'terminal') { a = { lines: [] }; }
    else if (ex.type === 'tree') { a = { step: 0, choices: [] }; }
    else if (ex.type === 'triage') { a = { pick: {} }; }
    S.answers[key] = a;
  }
  function canCheck(ex, a) {
    var i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') return a.sel && a.sel.length > 0;
    if (ex.type === 'match') { for (i in a.map) { return true; } return false; }
    if (ex.type === 'dnd') { for (i in a.place) { if (a.place[i].length) return true; } return false; }
    if (ex.type === 'order') { for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) return true; } return false; }
    if (ex.type === 'fill') { for (i = 0; i < a.vals.length; i++) { if (a.vals[i].trim()) return true; } return false; }
    if (ex.type === 'terminal') return a.lines && a.lines.length > 0;
    if (ex.type === 'tree') return a.choices.length === ex.steps.length;
    if (ex.type === 'triage') { for (i in a.pick) { return true; } return false; }
    return false;
  }

  /* ---------- log highlighter ---------- */
  var KWX = /\b(copy|tftp|scp|ftp|boot system|boot|debug|verify|reload|show|version|flash|running-config|startup-config|md5|rommon|firmware|image|deny|permit|audit|tacacs|radius|enable|secret|username|snmp|syslog|port|shutdown)\b/g;
  function hlLine(ln) {
    var e = esc(ln);
    if (/^!!/.test(ln)) return '<span class="b">' + esc(ln.replace(/^!!/, '').replace(/^\s/, '')) + '</span>';
    if (/^\s*[!#]/.test(ln)) return '<span class="c">' + e + '</span>';
    e = e.replace(/&quot;[^&]*?&quot;/g, function (m) { return '<span class="s">' + m + '</span>'; });
    e = e.replace(KWX, function (m) { return '<span class="k">' + m + '</span>'; });
    e = e.replace(/\b\d[\d[\].:]*\b/g, function (m) { return '<span class="n">' + m + '</span>'; });
    return e;
  }
  function hl(code) {
    return String(code || '').split('\n').map(hlLine).join('\n');
  }
  function artefactHTML(a, idx) {
    var id = 'lg' + idx + '_' + curKey();
    var rows = String(a.code).split('\n');
    var inner;
    if (a.filter) {
      inner = '<div class="logview-tools"><input type="text" aria-label="filter log lines" placeholder="filter lines..." ' +
        'oninput="Z.logFilter(this.value,\'' + id + '\')"><span class="logview-count" id="' + id + 'c">' + rows.length + ' lines</span></div>' +
        '<pre class="log" id="' + id + '">' + rows.map(function (ln) {
          return '<span class="lg-row" data-t="' + esc(ln.toLowerCase()) + '">' + hlLine(ln) + '\n</span>';
        }).join('') + '</pre>';
    } else {
      inner = '<pre class="log">' + rows.map(hlLine).join('\n') + '</pre>';
    }
    return '<div class="artefact"><span class="artefact-label">' + esc(a.label) + '</span>' + inner + '</div>';
  }
  function artefactsHTML(ex) {
    if (!ex.artefacts) return '';
    var h = '';
    for (var i = 0; i < ex.artefacts.length; i++) h += artefactHTML(ex.artefacts[i], i);
    return h;
  }

  /* ---------- shared header ---------- */
  function sevBadge() {
    var m = EXAM.meta;
    return '<span class="badge ' + m.sevClass + '" aria-label="Severity ' + esc(m.sev) + '">● ' + esc(m.sev) + '</span>';
  }
  function timerChip() {
    var txt, lab;
    if (T.state === 'IDLE') { txt = '⏱ READY'; lab = 'Timer ready'; }
    else if (T.state === 'RUNNING') { txt = '▶ RUNNING'; lab = 'Timer running'; }
    else if (T.state === 'PAUSED_MANUAL') { txt = '⏸ PAUSED — manual (press Resume)'; lab = 'Timer paused manually'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { txt = '⏸ PAUSED — reviewing feedback (resumes on Next)'; lab = 'Timer paused for feedback review'; }
    else { txt = '■ ENDED'; lab = 'Timer ended'; }
    return '<span class="chipstate tstate ok-z" aria-label="' + lab + ': ' + fmt(T.remaining) + '">' + txt + ' <b>' + fmt(T.remaining) + '</b></span>';
  }
  function renderTimerChip() {
    var el = $('tchip');
    if (el) el.outerHTML = '<span id="tchip">' + timerChip() + '</span>';
  }
  function scoreChip() {
    var sum = 0, n = 0, k;
    for (k in S.results) { if (S.checked[k]) { sum += S.results[k].credit; n++; } }
    var pct = n ? Math.round((sum / n) * 100) : 0;
    return '<span class="chipstate xscore" aria-label="Live score">Score <b>' + sum.toFixed(1) + ' / ' + n + '</b> · ' + pct + '%</span>';
  }
  function headerHTML() {
    var ex = curEx();
    var key = curKey();
    var m = EXAM.meta;
    var counter;
    if (S.phase === 'review') counter = '⚠ Reviewing a skipped exercise — ' + (S.i + 1) + ' of ' + S.order.length;
    else counter = 'Exercise ' + (S.i + 1) + ' of ' + S.order.length;
    var hintDis = (S.checked[key] || S.hintUsed[key]) ? ' disabled' : '';
    var skipDis = (S.phase === 'review' || S.checked[key] || T.state === 'ENDED') ? ' disabled' : '';
    var h = '<div class="xhead"><div class="wrap xhead-in">' +
      '<span class="xcount">' + counter + '</span>' + sevBadge() +
      '<span class="chipstate small dim mono">' + esc(m.id) + ' ' + esc(m.name) + '</span>' +
      '<span id="tchip">' + timerChip() + '</span>' +
      '<span id="schip">' + scoreChip() + '</span>' +
      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-amber" onclick="Z.onHint()"' + hintDis + ' aria-label="Hint: costs 10 percent of this exercise credit">💡 Hint −10%</button>' +
      '<button class="btn btn-ghost" onclick="Z.onSkip()"' + skipDis + ' aria-label="Skip this exercise">⚠ Skip</button>' +
      '<button class="btn btn-ghost" onclick="Z.onPause()" aria-label="Manual pause: hides the exercise">⏸ Pause</button>' +
      '</div></div>' +
      '<div class="wrap"><div class="progress" aria-hidden="true"><i style="width:' + progPct() + '%"></i></div></div></div>';
    return h;
  }
  function progPct() {
    var answered = 0, k;
    for (k in S.checked) { if (S.checked[k]) answered++; }
    return Math.round((answered / S.order.length) * 100);
  }

  /* ---------- intro view (exactly four sections) ---------- */
  function viewIntro() {
    var m = EXAM.meta;
    var hs = '<div class="card" style="border-top:3px solid var(--sev-col,' + m.sevVar + ')">' +
      '<h1 style="margin:0 0 4px;font-size:1.35rem">' + esc(m.id) + ' — ' + esc(m.sev) + ' practice exam</h1>' +
      '<p class="dim" style="margin:0 0 8px">' + esc(m.id) + ' — ' + esc(m.name) + ' · sub-technique of ' + esc(m.parent) +
      ' · Tactic: ' + esc(m.tactic) + ' · Platform: ' + esc(m.platform) + ' · Domain: ' + esc(m.domain) + '</p>' +
      sevBadge() +
      '<div class="facts">' +
      '<div><b>Exercises in this file</b><span>' + EXS.length + '</span></div>' +
      '<div><b>Estimated time</b><span>' + m.estMin + ' minutes</span></div>' +
      '<div><b>Timer budget</b><span>' + fmt(m.budgetSec) + ' (countdown)</span></div>' +
      '<div><b>Pass mark</b><span>' + m.passMark + '%</span></div>' +
      '<div><b>ATT&amp;CK version</b><span>v' + esc(m.version) + ' · ' + esc(m.updated) + '</span></div>' +
      '</div>' +
      (S.handshake && S.handshake.username ? '<p class="small dim" style="margin:10px 0 0">Learner: ' + esc(S.handshake.username) +
        (S.handshake.country && S.handshake.country !== 'ZZ' ? ' · ' + esc(S.handshake.country) : '') + '</p>' : '') +
      '</div>';
    var learn = '<div class="card"><h2>What you will learn here</h2>' + EXAM.learn + '</div>';
    var kw = '<div class="card"><h2>Keywords covered in this exam</h2>';
    for (var i = 0; i < EXAM.keywords.length; i++) {
      var g = EXAM.keywords[i];
      kw += '<div class="kw-theme"><h3>' + esc(g.theme) + '</h3><div class="kw-items">';
      for (var j = 0; j < g.items.length; j++) kw += '<span>' + esc(g.items[j]) + '</span>';
      kw += '</div></div>';
    }
    kw += '</div>';
    var types = {};
    EXS.forEach(function (e) { types[e.type] = true; });
    var typeList = Object.keys(types).map(function (t) { return TYPE_LABELS[t]; }).join(', ');
    var how = '<div class="card"><h2>How this exam works</h2><ul class="rules">' +
      '<li><b>Passing score: ' + m.passMark + '%.</b> Your percentage is computed only over exercises you actually answered. PASS means you scored at least ' + m.passMark + '%; FAIL means you should retake the exam.</li>' +
      '<li><b>Exercise types in this file:</b> ' + esc(typeList) + '.</li>' +
      '<li><b>Timer:</b> a ' + fmt(m.budgetSec) + ' countdown runs while you work. The <b>Pause</b> button stops the timer and hides the exercise (a real break). The moment you press <b>Check</b>, the timer also stops — you can study the feedback for as long as you like, and it resumes only when you press <b>Next</b>.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items score <code>max(0, (H − W) / N)</code> — correct items minus wrong items, divided by the number of items. You can earn 0.60 of an exercise, for example.</li>' +
      '<li><b>Hint:</b> one hint per exercise. It reveals a nudge, never the answer, and costs 10% of that exercise\u2019s credit.</li>' +
      '<li><b>Skip:</b> every exercise has a Skip button. Before you can finish, a review screen lists everything you skipped, so you can go back while the timer still runs. Skipped-and-never-answered exercises are excluded from the score — they count neither for nor against you.</li>' +
      (EXAM.howExtra || '') +
      '</ul><button class="btn btn-primary" style="min-width:180px;min-height:48px" onclick="Z.onStart()">▶ Start the exam</button></div>';
    return hs + learn + kw + how;
  }
  var TYPE_LABELS = {
    qcm: 'multiple choice (single answer)', multi: 'multi-select with partial credit',
    match: 'matching pairs', dnd: 'drag &amp; drop into categories', order: 'timeline ordering',
    fill: 'fill-in-the-blank with a word bank', terminal: 'typed terminal command',
    tree: 'branching decision scenario', triage: 'SOC alert-queue triage',
    logview: 'log analysis with a live filter'
  };

  /* ---------- answer widget renderers ---------- */
  function chipHTML(txt, picked, clickJs, dragJs, retJs) {
    return '<button type="button" class="chip' + (picked ? ' picked' : '') + '" ' +
      (dragJs ? 'draggable="true" ondragstart="' + dragJs + '" ondragend="Z.dragEnd(event)" ' : '') +
      'onclick="' + clickJs + '">' + '<span>' + txt + '</span>' +
      (picked ? '<span class="pick-tag">✓ Picked</span>' : '') +
      (retJs ? '<span class="pick-tag" style="color:var(--text-secondary)">✕ return</span>' : '') +
      '</button>';
  }
  function dragAttrs() {
    return 'ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dragLeave(event)"';
  }

  function optsHTML(ex, key, a) {
    var multi = ex.type === 'multi' || !!ex.multi;
    var h = multi ? '<p class="multi-note">Select ALL that apply — partial credit: wrong picks subtract from correct ones.</p>' : '';
    h += '<div class="opts">';
    S.shuffle[key].opts.forEach(function (uid, i) {
      var o = ex.options[uid];
      var sel = a.sel.indexOf(uid) >= 0;
      h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="Z.optSel(' + uid + ')">' +
        '<span class="opt-letter">' + LETTERS[i] + '.</span><span>' + o.t + '</span>' +
        (sel ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
    });
    return h + '</div>';
  }

  function matchHTML(ex, key, a) {
    var placed = {}, li;
    for (li in a.map) { placed[a.map[li]] = +li; }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Items — drag or click to place</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.matchDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].rights.forEach(function (r) {
      if (!(r in placed)) { anyPool = true; h += chipHTML(esc(ex.right[r]), a.picked === r, 'Z.matchPick(' + r + ')', 'Z.dragStart(event,' + r + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Drop zones — one match per row</div>';
    ex.left.forEach(function (L, i) {
      var r = a.map[i];
      h += '<div class="slot' + (r != null ? ' slot-filled' : '') + '" tabindex="0" role="button" aria-label="drop zone for ' + esc(L) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.matchDrop(event,' + i + ')"'
        + ' onclick="Z.matchSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'matchSlot\',' + i + ')">'
        + '<span class="slot-lab">' + esc(L) + '</span>'
        + (r != null ? chipHTML(esc(ex.right[r]), false, 'Z.matchReturn(' + i + ')', false, true) : '<span class="empty-hint">drop an item here (or pick above, then click)</span>')
        + '</div>';
    });
    return h + '</div></div>';
  }

  function dndHTML(ex, key, a) {
    var placed = {}, b, k;
    for (b in a.place) { a.place[b].forEach(function (it) { placed[it] = +b; }); }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — drag or click to place</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dndDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.items[it].t), a.picked === it, 'Z.dndPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Categories</div>';
    ex.banks.forEach(function (B, bi) {
      var items = a.place[bi] || [];
      h += '<div style="margin-bottom:8px"><div class="bank-h">' + esc(B.label) + '</div>' +
        '<div class="bank-box" tabindex="0" role="button" aria-label="category ' + esc(B.label) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dndDrop(event,' + bi + ')"'
        + ' onclick="Z.dndBank(' + bi + ')"'
        + ' onkeydown="Z.slotKey(event,\'dndBank\',' + bi + ')">';
      items.forEach(function (it) { h += chipHTML(esc(ex.items[it].t), false, 'Z.dndReturn(' + it + ')', false, true); });
      if (!items.length) h += '<span class="empty-hint">drop items here</span>';
      h += '</div></div>';
    });
    return h + '</div></div>';
  }

  function orderHTML(ex, key, a) {
    var n = ex.steps.length;
    if (!a.slots || a.slots.length !== n) { a.slots = []; for (var q = 0; q < n; q++) a.slots.push(null); }
    var placed = {}, i;
    for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) placed[a.slots[i]] = i; }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — build the sequence</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.steps[it]), a.picked === it, 'Z.orderPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Timeline — first line on top</div>';
    for (i = 0; i < n; i++) {
      var it = a.slots[i];
      h += '<div class="slot-row"><div class="slot' + (it != null ? ' slot-filled' : '') + '" tabindex="0" role="button" aria-label="position ' + (i + 1) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,' + i + ')"'
        + ' onclick="Z.orderSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'orderSlot\',' + i + ')">'
        + '<span class="slot-lab">' + (i + 1) + '.</span>'
        + (it != null ? chipHTML(esc(ex.steps[it]), false, 'Z.orderReturn(' + i + ')', false, true) : '<span class="empty-hint">empty position</span>')
        + '</div><div class="seq-btns">'
        + '<button aria-label="move up" onclick="Z.orderMove(' + i + ',-1)">▲</button>'
        + '<button aria-label="move down" onclick="Z.orderMove(' + i + ',1)">▼</button>'
        + '</div></div>';
    }
    return h + '</div></div>';
  }

  function fillHTML(ex, key, a) {
    var h = '<p class="filltext">' + esc(ex.text).replace(/\{(\d+)\}/g, function (m, d) {
      var i = +d;
      return '<input type="text" aria-label="blank ' + (i + 1) + '" value="' + esc(a.vals[i]) + '" oninput="Z.fillSet(' + i + ',this.value)">';
    }) + '</p>';
    h += '<div class="bankrow">';
    S.shuffle[key].bank.forEach(function (bi) {
      var w = ex.bank[bi];
      h += '<button type="button" class="chip" style="width:auto;min-width:0" onclick="Z.fillChip(\'' + w.replace(/'/g, "\\'") + '\')">' + esc(w) + '</button>';
    });
    return h + '</div><p class="small dim">Click a word to drop it into the first empty blank, or type directly. Some words are decoys.</p>';
  }

  function termHTML(ex, key, a) {
    var h = '';
    if (ex.term.syntax) h += '<div class="syntax-panel">' + ex.term.syntax + '</div>';
    h += '<div class="term" id="termScroll" aria-label="simulated terminal">';
    a.lines.forEach(function (ln) {
      h += '<span class="term-line"><span class="term-prompt">' + esc(ex.term.prompt) + '</span> ' + esc(ln) + '</span>';
      var out = termOut(ex, ln);
      if (out) h += '<span class="term-line">' + hl(out) + '</span>';
    });
    if (!a.lines.length) h += '<span class="term-line c">— simulated ' + esc(ex.term.shellName || 'device') + ' shell; nothing executed for real —</span>';
    h += '</div><div class="term-input-row"><span class="term-prompt">' + esc(ex.term.prompt) + '</span>' +
      '<input type="text" id="termIn" aria-label="terminal input" autocomplete="off" spellcheck="false" placeholder="type the command, then press Enter">';
    if (ex.term.sample) h += '<div class="syntax-panel"><b>Expected output shape:</b>' + hl(ex.term.sample) + '</div>';
    return h;
  }
  function termOut(ex, cmd) {
    if (!ex.term.outputs) return '';
    var n = normCmd(cmd), i;
    for (i = 0; i < ex.term.outputs.length; i++) {
      if (new RegExp(ex.term.outputs[i].re, 'i').test(n)) return ex.term.outputs[i].out;
    }
    return ex.term.defaultOut || '';
  }

  function treeHTML(ex, key, a) {
    var i = a.step, st = ex.steps[i];
    var h = '<span class="stepchip">STEP ' + (i + 1) + ' OF ' + ex.steps.length + '</span><p>' + st.text + '</p><div class="opts">';
    S.shuffle[key].opts[i].forEach(function (uid, k) {
      var o = st.options[uid];
      h += '<button type="button" class="opt' + (a.choices[i] === uid ? ' sel' : '') + '" aria-pressed="' + (a.choices[i] === uid) + '" onclick="Z.treeChoice(' + uid + ')">' +
        '<span class="opt-letter">' + LETTERS[k] + '.</span><span>' + o.t + '</span>' +
        (a.choices[i] === uid ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
    });
    h += '</div>';
    if (a.choices[i] != null) {
      var o = st.options[a.choices[i]];
      h += '<div class="outcome"><b>Outcome:</b> ' + o.outcome + '</div>';
      h += '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">';
      if (i > 0) h += '<button class="btn btn-ghost" onclick="Z.treeBack()">◀ Back one step</button>';
      if (i < ex.steps.length - 1) h += '<button class="btn" onclick="Z.treeNext()">Continue ▶ <span class="small dim">(timer keeps running)</span></button>';
      h += '</div>';
    }
    return h;
  }

  function triageHTML(ex, key, a) {
    var h = '<p class="small dim">Work the queue top to bottom. Assign one action per alert, then press Check once. Partial credit: one item per alert.</p>';
    ex.alerts.forEach(function (A, ai) {
      h += '<div class="alert-card"><div class="alert-title">🛰 Alert ' + (ai + 1) + ' — ' + esc(A.title) + '</div>' +
        '<div class="alert-meta">' + esc(A.meta) + '</div><div class="opts" style="margin-top:8px">';
      S.shuffle[key].alerts[ai].forEach(function (uid, k) {
        var o = A.options[uid];
        var sel = a.pick[ai] === uid;
        h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="Z.triagePick(' + ai + ',' + uid + ')">' +
          '<span class="opt-letter">' + LETTERS[k] + '.</span><span>' + o.t + '</span>' +
          (sel ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
      });
      h += '</div></div>';
    });
    return h;
  }

  function answerHTML(ex, key, a) {
    switch (ex.type) {
      case 'qcm': case 'multi': case 'logview': return optsHTML(ex, key, a);
      case 'match': return matchHTML(ex, key, a);
      case 'dnd': return dndHTML(ex, key, a);
      case 'order': return orderHTML(ex, key, a);
      case 'fill': return fillHTML(ex, key, a);
      case 'terminal': return termHTML(ex, key, a);
      case 'tree': return treeHTML(ex, key, a);
      case 'triage': return triageHTML(ex, key, a);
    }
    return '';
  }

  /* ---------- grading ---------- */
  function grade(ex, a) {
    var sel = [], cor = [], rows = [], forbidHit = false, i, j;
    var isMultiPick = (ex.type === 'multi' || (ex.type === 'logview' && ex.multi));
    if (ex.type === 'qcm' || (ex.type === 'logview' && !ex.multi)) {
      var okIdx = -1;
      for (i = 0; i < ex.options.length; i++) { if (ex.options[i].ok) okIdx = i; }
      cor = [String(okIdx)];
      (a.sel || []).forEach(function (u) { sel.push(String(u)); });
      var ch = a.sel && a.sel.length ? a.sel[0] : null;
      if (ch === okIdx) rows.push(['ok', '✓ Correct', '<b>' + esc(ex.options[okIdx].t) + '</b> — ' + esc(ex.options[okIdx].why)]);
      else {
        if (ch != null) rows.push(['bad', '✗ Wrong', 'You chose “' + esc(ex.options[ch].t) + '” — ' + esc(ex.options[ch].why)]);
        rows.push(['miss', '○ Missed', 'Correct answer: <b>' + esc(ex.options[okIdx].t) + '</b> — ' + esc(ex.options[okIdx].why)]);
      }
    } else if (isMultiPick) {
      for (i = 0; i < ex.options.length; i++) {
        var o = ex.options[i], picked = a.sel.indexOf(i) >= 0;
        if (o.ok) {
          cor.push(String(i));
          if (picked) { sel.push(String(i)); rows.push(['ok', '✓ Correct', '<b>' + esc(o.t) + '</b> — ' + esc(o.why)]); }
          else rows.push(['miss', '○ Missed', '<b>' + esc(o.t) + '</b> — ' + esc(o.why)]);
        } else if (picked) {
          sel.push(String(i));
          rows.push(['bad', '✗ Wrong', '“' + esc(o.t) + '” — ' + esc(o.why)]);
        }
      }
    } else if (ex.type === 'match') {
      for (i = 0; i < ex.left.length; i++) {
        cor.push(i + ':' + i);
        var p = a.map[i];
        if (p === i) { sel.push(i + ':' + p); rows.push(['ok', '✓ Correct', esc(ex.left[i]) + ' → <b>' + esc(ex.right[i]) + '</b>']); }
        else if (p != null) { sel.push(i + ':' + p); rows.push(['bad', '✗ Wrong', esc(ex.left[i]) + ' → you placed “' + esc(ex.right[p]) + '”; correct: <b>' + esc(ex.right[i]) + '</b>']); }
        else rows.push(['miss', '○ Missed', esc(ex.left[i]) + ' → correct: <b>' + esc(ex.right[i]) + '</b>']);
      }
    } else if (ex.type === 'dnd') {
      var placedMap = {};
      for (j in a.place) { (a.place[j] || []).forEach(function (it) { placedMap[it] = +j; }); }
      for (i = 0; i < ex.items.length; i++) {
        cor.push(i + ':' + ex.items[i].bank);
        var b = placedMap[i];
        if (b === ex.items[i].bank) { sel.push(i + ':' + b); rows.push(['ok', '✓ Correct', '“' + esc(ex.items[i].t) + '” → ' + esc(ex.banks[b].label)]); }
        else if (b != null) { sel.push(i + ':' + b); rows.push(['bad', '✗ Wrong', '“' + esc(ex.items[i].t) + '” belongs in <b>' + esc(ex.banks[ex.items[i].bank].label) + '</b>, not ' + esc(ex.banks[b].label) + '. ' + esc(ex.items[i].why || '')]); }
        else rows.push(['miss', '○ Missed', '“' + esc(ex.items[i].t) + '” belongs in <b>' + esc(ex.banks[ex.items[i].bank].label) + '</b>. ' + esc(ex.items[i].why || '')]);
      }
    } else if (ex.type === 'order') {
      for (i = 0; i < ex.steps.length; i++) {
        cor.push(i + ':' + i);
        var s = a.slots[i];
        if (s === i) { sel.push(i + ':' + s); rows.push(['ok', '✓ Correct', 'Position ' + (i + 1) + ': ' + esc(ex.steps[i])]); }
        else if (s != null) { sel.push(i + ':' + s); rows.push(['bad', '✗ Wrong', 'Position ' + (i + 1) + ': you put “' + esc(ex.steps[s]) + '”; correct: <b>' + esc(ex.steps[i]) + '</b>']); }
        else rows.push(['miss', '○ Missed', 'Position ' + (i + 1) + ': correct: <b>' + esc(ex.steps[i]) + '</b>']);
      }
    } else if (ex.type === 'fill') {
      for (i = 0; i < ex.blanks.length; i++) {
        cor.push(String(i));
        var v = (a.vals[i] || '').trim().toLowerCase();
        var hit = false;
        for (j = 0; j < ex.blanks[i].accept.length; j++) { if (new RegExp(ex.blanks[i].accept[j], 'i').test(v)) { hit = true; break; } }
        if (hit) { sel.push(String(i)); rows.push(['ok', '✓ Correct', 'Blank ' + (i + 1) + ': “' + esc(a.vals[i]) + '” — ' + esc(ex.blanks[i].why)]); }
        else if (v) { sel.push('BAD:' + i); rows.push(['bad', '✗ Wrong', 'Blank ' + (i + 1) + ': “' + esc(a.vals[i]) + '” — correct: <b>' + esc(ex.blanks[i].ok) + '</b>. ' + esc(ex.blanks[i].why)]); }
        else rows.push(['miss', '○ Missed', 'Blank ' + (i + 1) + ': correct: <b>' + esc(ex.blanks[i].ok) + '</b>. ' + esc(ex.blanks[i].why)]);
      }
    } else if (ex.type === 'terminal') {
      var joined = normCmd(a.lines.join('\n'));
      var els = ex.term.requires;
      for (i = 0; i < els.length; i++) {
        cor.push(els[i].label);
        if (new RegExp(els[i].re, 'i').test(joined)) {
          sel.push(els[i].label);
          rows.push(['ok', '✓ Correct', 'Element: <code>' + esc(els[i].label) + '</code>' + (els[i].why ? ' — ' + esc(els[i].why) : '')]);
        } else {
          rows.push(['miss', '○ Missed', 'Element: <code>' + esc(els[i].label) + '</code>' + (els[i].why ? ' — ' + esc(els[i].why) : '')]);
        }
      }
      var forbids = ex.term.forbid || [];
      for (i = 0; i < forbids.length; i++) {
        if (new RegExp(forbids[i].re, 'i').test(joined)) {
          sel.push('FORBID:' + forbids[i].label);
          forbidHit = true;
          rows.push(['bad', '✗ DANGEROUS — NEAR MISS', '<code>' + esc(forbids[i].label) + '</code> — ' + esc(forbids[i].why)]);
        }
      }
    } else if (ex.type === 'tree') {
      for (i = 0; i < ex.steps.length; i++) {
        var okI = -1, k;
        for (k = 0; k < ex.steps[i].options.length; k++) { if (ex.steps[i].options[k].ok) okI = k; }
        cor.push(i + ':' + okI);
        var c = a.choices[i];
        if (c === okI) { sel.push(i + ':' + c); rows.push(['ok', '✓ Correct', 'Step ' + (i + 1) + ' — ' + esc(ex.steps[i].options[c].why)]); }
        else if (c != null) { sel.push(i + ':' + c); rows.push(['bad', '✗ Wrong', 'Step ' + (i + 1) + ': ' + esc(ex.steps[i].options[c].why) + ' Correct: <b>' + esc(ex.steps[i].options[okI].t) + '</b> — ' + esc(ex.steps[i].options[okI].why)]); }
        else rows.push(['miss', '○ Missed', 'Step ' + (i + 1) + ' correct: <b>' + esc(ex.steps[i].options[okI].t) + '</b> — ' + esc(ex.steps[i].options[okI].why)]);
      }
    } else if (ex.type === 'triage') {
      for (i = 0; i < ex.alerts.length; i++) {
        var okA = -1, k2;
        for (k2 = 0; k2 < ex.alerts[i].options.length; k2++) { if (ex.alerts[i].options[k2].ok) okA = k2; }
        cor.push(i + ':' + okA);
        var pc = a.pick[i];
        if (pc === okA) { sel.push(i + ':' + pc); rows.push(['ok', '✓ Correct', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”) — ' + esc(ex.alerts[i].options[pc].why)]); }
        else if (pc != null) { sel.push(i + ':' + pc); rows.push(['bad', '✗ Wrong', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”): ' + esc(ex.alerts[i].options[pc].why) + ' Correct: <b>' + esc(ex.alerts[i].options[okA].t) + '</b>.']); }
        else rows.push(['miss', '○ Missed', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”): correct: <b>' + esc(ex.alerts[i].options[okA].t) + '</b>. ' + esc(ex.alerts[i].options[okA].why)]);
      }
    }
    var g = scoreExercise(sel, cor);
    g.rows = rows; g.forbidHit = forbidHit;
    return g;
  }

  /* ---------- exam view ---------- */
  function blockScenario(ex, key) {
    var col = S.collapsed[key];
    var h = '<div class="card blk blk-s"><div class="blk-h"><span aria-hidden="true">🧭</span> SCENARIO' +
      '<button class="pin" onclick="Z.toggleScenario()" aria-label="collapse or expand scenario">' + (col ? '⤓ Expand' : '⤒ Collapse') + '</button></div>' +
      '<div class="small dim" style="margin-bottom:6px">' + esc(ex.summary) + '</div>';
    if (!col) h += '<div>' + ex.scenario + '</div>' + artefactsHTML(ex);
    return h + '</div>';
  }
  function viewExam() {
    var key = curKey(), ex = curEx(), a = S.answers[key];
    if (T.state === 'PAUSED_MANUAL') {
      return headerHTML() + '<div class="wrap"><div class="overlay" style="position:fixed"><div class="overlay-card card">' +
        '<div style="font-size:40px" aria-hidden="true">⏸</div><div class="big">PAUSED — manual</div>' +
        '<p class="dim">The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>' +
        '<button class="btn btn-primary" onclick="Z.onResume()">▶ Resume</button></div></div></div>';
    }
    var checked = S.checked[key];
    var h = headerHTML() + '<div class="wrap">';
    h += blockScenario(ex, key);
    h += '<div class="card blk blk-q"><div class="blk-h"><span aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="qtext">' + ex.question + '</div></div>';
    h += '<div class="card blk blk-a"><div class="blk-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>' +
      '<div' + (checked ? ' style="opacity:0.75"' : '') + '>' + answerHTML(ex, key, a) + '</div>';
    if (S.hintUsed[key]) h += '<div class="hintbox" aria-label="hint shown"><b>💡 Hint</b> (this exercise loses 10% of its credit): ' + esc(ex.hint) + '</div>';
    h += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">';
    if (!checked) {
      var dis = canCheck(ex, a) ? '' : ' disabled title="Give an answer first"';
      h += '<button class="btn btn-go" onclick="Z.onCheck()"' + dis + '>✓ Check</button>';
      if (S.phase === 'main') h += '<button class="btn btn-ghost" onclick="Z.onSkip()">⚠ Skip</button>';
      else h += '<button class="btn btn-ghost" onclick="Z.leaveSkipped()">↩ Leave it skipped</button>';
    } else {
      var last = (S.phase === 'main' && S.i === S.order.length - 1);
      if (last) h += '<button class="btn btn-primary" onclick="Z.onFinal()">🏁 Final Submit — see results</button>';
      else if (S.phase === 'review') h += '<button class="btn btn-primary" onclick="Z.onNext()">↩ Back to review list (timer resumes)</button>';
      else h += '<button class="btn btn-primary" onclick="Z.onNext()">Next ▶ (timer resumes)</button>';
    }
    h += '</div>';
    if (checked) h += feedbackHTML(ex, key);
    h += '</div></div>';
    return h;
  }

  function feedbackHTML(ex, key) {
    var g = S.results[key];
    var cls, lab;
    if (g.credit >= 1) { cls = 'fb-correct'; lab = '<span class="ok-c">✓ CORRECT</span> <span class="fb-credit">· Credit ' + g.credit.toFixed(2) + '</span>'; }
    else if (g.credit > 0) { cls = 'fb-partial'; lab = '<span class="ok-p">✓ PARTIALLY CORRECT — credit ' + g.credit.toFixed(2) + ' (' + g.H + '/' + g.N + ' items)</span>'; }
    else { cls = 'fb-incorrect'; lab = '<span class="ok-x">✗ INCORRECT</span> <span class="fb-credit">· Credit ' + g.credit.toFixed(2) + '</span>'; }
    var h = '<div class="fb ' + cls + '" tabindex="-1" aria-label="feedback"><div class="fb-h">' + lab + '</div>';
    if (g.N > 1) h += '<div class="fb-formula">Partial-credit formula: max(0, (H − W) / N) = max(0, (' + g.H + ' − ' + g.W + ') / ' + g.N + ')' +
      (S.hintUsed[key] ? ' · includes the −0.10 hint deduction' : '') + '</div>';
    else if (S.hintUsed[key] && g.credit > 0) h += '<div class="fb-formula">Includes the −0.10 hint deduction.</div>';
    if (g.forbidHit) h += '<div class="fb-items"><li class="bad">✗ <span class="ok-x"><b>DANGEROUS — NEAR MISS:</b> your command would have altered or destroyed state. In real response work that can destroy evidence or extend the outage.</span></li></div>';
    if (ex.type === 'terminal') h += '<div><b>Canonical command</b><div class="canon">' + esc(ex.term.canonical) + '</div>' +
      '<p class="small dim">' + esc(ex.term.canonicalWhy || '') + '</p></div>';
    h += '<ul class="fb-items">';
    g.rows.forEach(function (r) { h += '<li class="' + r[0] + '"><span>' + r[1] + '</span><span>' + r[2] + '</span></li>'; });
    h += '</ul>';
    h += '<div class="fb-why"><b>Why:</b> ' + ex.explain + '</div>';
    if (g.credit < 1 && ex.study) h += '<div class="fb-study"><b>What to study:</b> ' + esc(ex.study) + '</div>';
    return h + '</div>';
  }

  /* ---------- review-skipped view ---------- */
  function viewReview() {
    var h = headerHTML() + '<div class="wrap"><div class="card">' +
      '<h2>⚠ Review skipped exercises</h2>' +
      '<p class="dim">You skipped ' + S.skipped.length + ' exercise' + (S.skipped.length === 1 ? '' : 's') +
      '. You can return to any of them now and answer it, as many times as you need, while the timer runs. ' +
      'If you finish with exercises still unanswered, they are excluded from the score — they count neither for you nor against you.</p>';
    var any = false;
    S.skipped.forEach(function (k) {
      if (S.checked[k]) return;
      any = true;
      var ex = EXS[k];
      h += '<div class="review-row"><span class="chipstate ok-s" aria-label="Skipped">⚠ Skipped</span>' +
        '<b>Exercise ' + (S.order.indexOf(k) + 1) + '</b><span class="dim">' + esc(ex.summary) + '</span>' +
        '<button class="btn" style="margin-left:auto" onclick="Z.reviewAnswer(' + k + ')">Answer now ▶</button></div>';
    });
    if (!any) h += '<p class="ok-c">✓ All skipped exercises have been answered.</p>';
    h += '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">' +
      '<button class="btn btn-primary" onclick="Z.reviewFinish()">🏁 Finish exam — see results</button></div></div></div>';
    return h;
  }

  /* ---------- results view ---------- */
  function viewResults() {
    var m = EXAM.meta;
    var sum = 0, answered = 0, full = 0, part = 0, partSum = 0, wrong = 0, left = 0, k;
    for (k in S.results) {
      if (!S.checked[k]) continue;
      answered++;
      var c = S.results[k].credit;
      sum += c;
      if (c >= 1) full++;
      else if (c > 0) { part++; partSum += c; }
      else wrong++;
    }
    left = S.order.length - answered;
    var percent = answered ? Math.round((sum / answered) * 100) : 0;
    var passed = percent >= m.passMark;
    S.finalPercent = percent;
    if (!S.reported) { S.reported = true; reportScore(sum, answered); }
    var rows = '';
    S.order.forEach(function (kk, i) {
      var ex = EXS[kk];
      var res, col;
      if (S.checked[kk]) {
        var c = S.results[kk].credit;
        if (c >= 1) { res = '✓ Fully correct'; col = 'ok-c'; }
        else if (c > 0) { res = '✓ Partially correct (' + c.toFixed(2) + ')'; col = 'ok-p'; }
        else { res = '✗ Fully incorrect'; col = 'ok-x'; }
      } else if (S.skipped.indexOf(kk) >= 0) { res = '⚠ Skipped — excluded'; col = 'ok-s'; }
      else { res = '⚠ Not answered — excluded'; col = 'ok-s'; }
      rows += '<tr><td>' + (i + 1) + '</td><td>' + esc(ex.summary) + '</td><td class="' + col + '">' + res + '</td>' +
        '<td>' + (S.checked[kk] ? S.results[kk].credit.toFixed(2) : '—') + '</td></tr>';
    });
    var used = m.budgetSec - T.remaining;
    var h = '<div class="wrap">' +
      '<div class="banner ' + (passed ? 'banner-pass' : 'banner-fail') + '">' + (passed ? '✓ PASS' : '✗ FAIL') +
      '<span style="font-size:16px;font-weight:600;color:var(--text-primary)">Final score: ' + sum.toFixed(1) + ' / ' + answered +
      ' answered — ' + percent + '% (pass mark ' + m.passMark + '%)</span></div>' +
      '<div class="result-grid">' +
      '<div class="result-cell" style="border-color:var(--state-correct)"><span class="ok-c">✓ Fully correct</span><b class="ok-c">' + full + '</b></div>' +
      '<div class="result-cell" style="border-color:var(--state-partial)"><span class="ok-p">✓ Partially correct</span><b class="ok-p">' + part +
      (part ? '<span class="small dim" style="font-size:13px"> avg ' + (partSum / part).toFixed(2) + '</span>' : '') + '</b></div>' +
      '<div class="result-cell" style="border-color:var(--state-incorrect)"><span class="ok-x">✗ Fully incorrect</span><b class="ok-x">' + wrong + '</b></div>' +
      '<div class="result-cell"><span class="ok-s">⚠ Skipped — excluded</span><b class="ok-s">' + left + '</b></div>' +
      '</div>' +
      '<div class="card"><h2>⏱ Time report</h2>' +
      '<p class="dim">Time used: <b>' + fmt(used) + '</b> of ' + fmt(m.budgetSec) + ' · Manual pause total: <b>' + fmt(S.pauseManualSec) + '</b> · Feedback-review pause total: <b>' + fmt(S.pauseAutoSec) + '</b></p></div>' +
      '<div class="card"><h2>Exercise report</h2><table class="xtable"><tr><th>#</th><th>Exercise</th><th>Result</th><th>Credit</th></tr>' + rows + '</table></div>' +
      '<div class="card" style="text-align:center">' +
      (passed ? '<p><b>Well done.</b> You passed the ' + esc(m.sev) + ' exam for ' + esc(m.id) + '.</p>' :
        '<p><b>You must retake this exam.</b> Study the exercise report above, then try again — the questions and answer choices will be shuffled.</p>') +
      '<button class="btn btn-primary" style="min-width:200px;min-height:48px" onclick="Z.onRetake()">↻ Retake exam</button></div>' +
      '</div>';
    return h;
  }

  /* ---------- score report to the site ---------- */
  function reportScore(creditSum, answeredCount) {
    if (!(window.parent && window.parent !== window)) return;  /* opened directly: nothing to report to */
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: EXAM.meta.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= META.passMark
      }, location.origin);
    } catch (e) { /* cross-origin parent; the site receives it via its own listener */ }
  }

  /* ---------- flow transitions ---------- */
  function onStart() {
    S.order = shuffle(EXS.map(function (e, i) { return i; }));
    S.order.forEach(function (k) { initExerciseState(k); });
    S.i = 0; S.results = {}; S.checked = {}; S.hintUsed = {}; S.collapsed = {};
    S.skipped = []; S.phase = 'main'; S.reported = false; S.view = 'exam';
    T.remaining = EXAM.meta.budgetSec; setTimer('RUNNING');
    render();
  }
  function onCheck() {
    var key = curKey(), ex = curEx(), a = S.answers[key];
    if (S.checked[key] || !canCheck(ex, a)) return;
    var g = grade(ex, a);
    if (S.hintUsed[key]) g.credit = Math.max(0, g.credit - 0.10);
    S.results[key] = g;
    S.checked[key] = true;
    setTimer('PAUSED_AUTO_CHECK');   /* auto-pause first, then feedback renders */
    render();
  }
  function onNext() {
    if (T.state === 'PAUSED_AUTO_CHECK') setTimer('RUNNING');
    if (S.phase === 'review') { S.view = 'review'; render(); return; }
    if (S.i < S.order.length - 1) { S.i += 1; render(); }
    else toReviewOrResults();
  }
  function onFinal() { toReviewOrResults(); }  /* pending skips still get their review screen */
  function onSkip() {
    if (S.phase === 'review') return;
    var key = curKey();
    if (S.skipped.indexOf(key) < 0) S.skipped.push(key);
    if (S.i < S.order.length - 1) { S.i += 1; render(); }
    else toReviewOrResults();
  }
  function toReviewOrResults() {
    var open = S.skipped.filter(function (k) { return !S.checked[k]; });
    if (open.length) { S.view = 'review'; render(); }
    else endExam('submitted');
  }
  function onHint() {
    var key = curKey();
    if (S.checked[key] || S.hintUsed[key]) return;
    S.hintUsed[key] = true;
    render();
  }
  function onPause() {
    if (S.view !== 'exam') return;
    if (T.state === 'RUNNING' || T.state === 'PAUSED_AUTO_CHECK') { T.resumeTo = T.state; setTimer('PAUSED_MANUAL'); }
    render();
  }
  function onResume() { setTimer(T.resumeTo || 'RUNNING'); T.resumeTo = null; render(); }
  function onRetake() {
    S.view = 'intro'; S.phase = 'main'; S.results = {}; S.checked = {}; S.hintUsed = {};
    S.skipped = []; S.reported = false;
    T.remaining = EXAM.meta.budgetSec; setTimer('IDLE');
    render();
  }
  function endExam(reason) {
    setTimer('ENDED');
    S.view = 'results';
    render();
  }
  function reviewAnswer(k) { S.phase = 'review'; S.i = S.order.indexOf(k); S.view = 'exam'; render(); }
  function reviewFinish() { endExam('submitted'); }
  function leaveSkipped() { S.view = 'review'; setTimer('RUNNING'); render(); }

  /* ---------- render dispatch (restores keyboard focus across re-render) ---------- */
  function render() {
    var root = $('app');
    var af = document.activeElement;
