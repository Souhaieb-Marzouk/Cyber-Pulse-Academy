.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}

  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}

  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.004","batch":2,"difficulty":"medium","severity":"MEDIUM","passMark":70,"estimatedMinutes":28,"mitreId":"T1553.004","mitreName":"Install Root Certificate","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.004, called Install Root Certificate. A sub-technique is one specific way attackers reach a goal. This one belongs to the Defense Evasion tactic: a trusted root makes the attacker's certificates look legitimate, so checks that depend on trust stop warning anyone.","You already know the basics; here you connect two ideas at a time. You will read a Windows command or event and decide what it changed, then decide what that change means for the attacker and for the defenders.","The exam walks the real workflow of a SOC shift. An alert fires on certutil. You check whether the change hit the machine-wide store or only one user's store. You compare the command against the change tickets, you separate sanctioned TLS-inspection roots from rogue ones, and you choose evidence-preserving next steps.","These skills map to real roles. SOC analysts triage the alert. Incident responders preserve evidence before anyone touches the store. Threat hunters search for trust-store changes that no rule ever saw. Detection engineers tune rules around install commands and registry keys. GRC reviewers judge whether managed trust through GPO or MDM is documented and small.","By the end you should be able to read any trust-store event and answer two questions quickly: what exactly changed, and is that change sanctioned?"],"keywords":[{"theme":"Windows trust internals","items":["LocalMachine Root store","CurrentUser Root store","CAPI2 operational log","SystemCertificates registry keys"]},{"theme":"Commands read vs write","items":["certutil -store (read-only)","certutil -addstore (state change)","update-ca-certificates","update-ca-trust extract","sha256sum baseline"]},{"theme":"Separate app stores","items":["Firefox NSS store","app-packaged CA bundles","command-line trust overrides","enterprise-roots managed exception"]},{"theme":"Response flow","items":["evidence before change","GPO/MDM managed trust","EDR alerting on install commands"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can carry out this workflow on your own shift.","Exercise types in this exam: multiple choice (single answer and select-two or select-three), matching pairs, sorting cards into zones (drag and drop), fill-in-the-blank, a decision-tree scenario, and one simulated terminal exercise.","A countdown timer runs for 28 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all.","The terminal exercise simulates a shell. Type the command, press Enter, then press Check. Nothing is executed for real, and read-only commands are always safe to try."]},"exercises":[{"id":"e01","type":"single","perspective":"defender","scenario":{"summary":"Sysmon EID 1: certutil -addstore on WKS-FIN-03 at 02:47","text":["You are on the overnight SOC shift. A Sysmon Event ID 1 alert fires on WKS-FIN-03, a finance workstation.","The command line reads: certutil -addstore Root C:\\Windows\\Temp\\updroot.cer, launched by svc-update.exe from a PowerShell parent.","Your runbook says: first say what the command changed, then say why it matters to the attacker."],"artefacts":[{"label":"ARTEFACT 1 — Sysmon Event ID 1 (process creation)","kind":"log","lines":["2024-05-14 02:47:31  EventID=1  Image=C:\\Windows\\Temp\\svc-update.exe","CommandLine=\"certutil\" -addstore Root C:\\Windows\\Temp\\updroot.cer","ParentImage=C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe","User=ACME\\h.lepidus   Host=WKS-FIN-03   Ticket=INC-2201"]}]},"question":"What did this command achieve for the attacker?","options":[{"id":"a","text":"It listed the machine Root store and wrote the output to disk"},{"id":"b","text":"Chains signed by updroot.cer's key are now trusted, so HTTPS warnings disappear"},{"id":"c","text":"It disabled real-time protection and cleared the event logs"},{"id":"d","text":"It exported the machine Root store's private keys to the Temp folder"}],"correct":["b"],"hint":"Follow the two halves of the runbook: what changed, and what that change lets the attacker do next.","explain":["certutil -addstore Root installs updroot.cer into the machine-wide trusted-root store. From that moment, any certificate chain the attacker signs with that CA's key is trusted, which is exactly what makes HTTPS warnings disappear — the T1553.004 goal.","Option a describes a read-only listing, but -addstore writes state. Option c mixes in techniques this command cannot do. Option d is impossible: root CA certificates are public, the store holds no private keys."]},{"id":"e02","type":"match","perspective":"neutral","scenario":{"summary":"Windows trust internals for the shift notes","text":["You are updating the shift notes so new analysts stop mixing up Windows trust concepts.","Match each concept to its meaning; every right-hand card is used exactly once."]},"question":"Match each Windows trust concept to its meaning.","pairs":[{"left":"LocalMachine\\Root","right":"Machine-wide trusted roots: every account on the host is affected"},{"left":"CurrentUser\\Root","right":"Trusted roots for the signed-in user's profile only"},{"left":"CAPI2 operational log","right":"Event log that records certificate chain validation in detail"}],"hint":"Two cards differ by scope, and the third is a log source, not a store.","explain":["LocalMachine\\Root holds the trusted roots for the whole host, so an install there affects every account. CurrentUser\\Root affects only that user's profile, which is why attackers without admin rights sometimes use it.","The CAPI2 operational log is not a store at all: it records chain-building and validation events, which makes it a detection source for trust abuse."]},{"id":"e03","type":"blank","perspective":"defender","scenario":{"summary":"Runbook: Linux rebuild order and a from-scratch caution","text":["Your Linux fleet has two families: Debian/Ubuntu servers such as DB-LNX-02, and RHEL family hosts.","The runbook section below carries the order rule and one caution line. Fill both blanks."]},"question":"Complete the two runbook lines.","blanks":[{"before":"On both families the order is fixed: the CA file lands in the source directory ","after":" the rebuilder runs, because the rebuilder bundles only what the directory already holds.","answer":["before"],"hint":"first or second? what must exist before a rebuild can include it"},{"before":"Caution line: on a host under investigation, update-ca-certificates run with the ","after":" flag rebuilds the bundle from scratch and replaces the current file — capture the old bundle's hash first.","answer":["--fresh","fresh"],"hint":"the one-word flag (dashes included) that forces a from-scratch rebuild"}],"hint":"One blank fixes the sequence of the two steps; the other names the flag that turns a routine rebuild into a from-scratch one.","explain":["The order rule is the fact responders get wrong under pressure: the rebuilder can only bundle files the source directory already holds, so the drop-in (or anchor) file always lands first and the rebuild runs second. Reversing the order rebuilds a bundle without the new CA.","The caution line names the flag: it rebuilds from scratch and replaces the current bundle file, so on a host under investigation it would overwrite the state you may need to prove. Capture the old bundle's hash, and run it only inside a change window after evidence is captured."]},{"id":"e04","type":"multi","perspective":"attacker","scenario":{"summary":"Purple-team debrief: what the rogue root enabled","text":["A purple-team exercise installed a rogue root on MAC-DEV-01 and WKS-FIN-03 with the owners' approval.","In the debrief, the blue team must state which attacker goals the installed root directly served. Select the THREE real ones."]},"question":"Select the THREE goals the installed root directly enables.","options":[{"id":"a","text":"Malware signed by the rogue CA looks like it comes from a trusted vendor"},{"id":"b","text":"The trust survives reboots, giving quiet persistence"},{"id":"c","text":"HTTPS sessions can be intercepted by faking the sites' certificates"},{"id":"d","text":"Password hashes can be cracked offline much faster"},{"id":"e","text":"USB storage devices are silently blocked"}],"correct":["a","b","c"],"hint":"The root changes what the machine believes about certificates; keep to outcomes that follow from belief, not from unrelated powers.","explain":["A trusted rogue CA gives the attacker three things: signatures that look vendor-legitimate (a), a trust change that survives reboots and works as persistence (b), and the ability to fake site certificates so HTTPS can be intercepted without warnings (c).","Option d belongs to credential-access tooling, not to trust stores. Option e is a device-control action. Neither follows from installing a root certificate."]},{"id":"e05","type":"drag","perspective":"defender","scenario":{"summary":"Sort the evidence by store scope","text":["Four pieces of evidence from INC-2201 are on your desk.","The first response question is always scope: does the change affect the whole machine, or only one user's profile? Sort the evidence."]},"question":"Sort each piece of evidence into the correct scope.","zones":[{"id":"z1","label":"Machine-wide change","accepts":["i1","i3"]},{"id":"z2","label":"Single-user change","accepts":["i2","i4"]}],"items":[{"id":"i1","text":"Registry write under HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\Root"},{"id":"i2","text":"Registry write under HKCU\\SOFTWARE\\Microsoft\\SystemCertificates\\Root"},{"id":"i3","text":"certutil -addstore Root run from an elevated shell"},{"id":"i4","text":"certutil -user -addstore Root run in the user's session"}],"hint":"HKLM and an elevated certutil reach the whole host; HKCU and the -user switch stay with one profile.","explain":["The machine-wide column takes the HKLM registry write and the elevated certutil -addstore: both change the store every account uses.","The single-user column takes the HKCU write and the -user variant, which only affect one profile. Scope decides severity, because a machine-wide rogue root follows every account, while a user-scope one follows only that profile."]},{"id":"e06","type":"single","perspective":"defender","scenario":{"summary":"Pick the strongest T1553.004 signal in the registry log","text":["You are tuning the week's alerts. The telemetry excerpt below shows four trust-store related events from different hosts.","Change ticket CHG-7741 covers the sanctioned corporate TLS-inspection root refresh, deployed by SCCM. One line is a genuine T1553.004 tampering signal; the others are routine.","Use the filter box to search the log, then pick the line your detection should escalate."],"artefacts":[{"label":"ARTEFACT 1 — trust-store telemetry, 24h (Sysmon + CAPI2)","kind":"log","filter":true,"lines":["2024-05-14 02:47:33  EventID=13  EventType=SetValue   TargetObject=HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\Root\\Certificates\\8F2B44AA71\\Blob   Image=C:\\Windows\\Temp\\svc-update.exe   Host=WKS-FIN-03","2024-05-14 02:52:10  EventID=13  EventType=CreateKey  TargetObject=HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\Root\\Certificates\\C0A19D33\\  Image=C:\\Windows\\CCM\\ccmexec.exe   Note=CHG-7741 sanctioned inspection-root refresh","2024-05-14 03:15:02  Source=CAPI2/Operational  Process=firefox.exe  chain-build events consult the user Root store at browser start (read-only)","2024-05-14 09:01:44  EventID=13  EventType=SetValue   TargetObject=HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\CA\\Certificates\\B7E55102\\Blob   Image=C:\\Windows\\system32\\certcli.dll   Note=domain auto-enrolment"]}]},"question":"Which observation is the strongest tampering signal to escalate?","options":[{"id":"a","text":"A Root-store Blob written by an executable running from a Temp folder"},{"id":"b","text":"A Root-store key created by the SCCM client under change ticket CHG-7741"},{"id":"c","text":"A CAPI2 chain-build event from Firefox consulting the user Root store at browser start"},{"id":"d","text":"A CA-store Blob written by the domain certificate service"}],"correct":["a"],"hint":"Two lines have an owner you can name from the ticket or the service; one line has neither.","explain":["A Root-store certificate blob written by svc-update.exe from C:\\Windows\\Temp has no change record, no owner, and an install path that no deployment tool uses — that is the T1553.004 signal.","The SCCM line is sanctioned by CHG-7741, the CAPI2 row is a read (chain building consults the store but writes nothing), and the certcli line is routine domain auto-enrolment into the intermediate CA store. Escalating those would burn analyst time on benign events."]},{"id":"e07","type":"terminal","perspective":"defender","scenario":{"summary":"Terminal: list the machine Root store on WKS-FIN-03","text":["INC-2201, second stage: you are on a read-only triage session for WKS-FIN-03.","The runbook step says: list the certificates in the local machine Root store so the fingerprints can be compared with the golden image.","Type the certutil command that lists the machine Root store. It must stay read-only — this session is for looking, not changing."]},"question":"Type the read-only command that lists the machine Root store.","terminal":{"prompt":"analyst@WKS-FIN-03","banner":["Microsoft Windows triage shell — INC-2201","read-only session: listing stores is safe; changing them is not"],"solution":"certutil -store Root","elements":[{"label":"tool certutil","re":"^certutil( |$)"},{"label":"read-only -store switch","re":"(^| )-store( |$)"},{"label":"store name Root","re":"(^| )Root( |$)"}],"outputs":[{"re":"^certutil -store Root","lines":["================ Certificate Root Store ================","================ Certificate 0 ================","Serial: 4A1C  Issuer: CN=ACME-SSL-Inspect Root CA, DC=acme,DC=local","NotBefore: 2023-11-02 03:11  NotAfter: 2033-11-02  (CHG-7741 baseline)","---------------- Certificate 1 ----------------","Serial: 77D0  Issuer: CN=ZZ-Update Validation CA, O=Personal, OU=Unknown","NotBefore: 2024-05-14 02:40  NotAfter: 2026-05-14  <-- no change record","CertUtil: -store command completed successfully."]},{"re":"^certutil$","lines":["CertUtil: a verb is required. Common verbs:","  -store      list a certificate store (read-only)","  -addstore   add a certificate to a store (state change)","  -delstore   delete from a store (state change)","CertUtil: -? lists every verb."]}],"nearMiss":[{"re":"^certutil\\s+.*(-addstore|-delstore|-delroot)","msg":"This changes the trust store. This session is read-only — use -store to list."},{"re":"^certutil\\s+-user\\s+","msg":"The -user switch targets the signed-in user's store; the ticket asks for the machine store."}],"nearMissSample":"certutil -addstore Root C:\\Windows\\Temp\\updroot.cer","partialSample":"certutil"},"hint":"The listing verb and the store name are the two halves of the command; the alert already showed you the install verb to avoid.","explain":["The canonical command is certutil -store Root: the tool, the read-only listing verb, and the store name. It prints every certificate in the machine Root store without changing anything.","Typing the bare tool name only opens the verb menu, so the listing never appears. The add and delete verbs are near misses: they would alter the store you were sent to observe, which destroys the difference between triage and tampering."]},{"id":"e08","type":"match","perspective":"neutral","scenario":{"summary":"Read or write? Match each command to its effect","text":["Your runbook has a rule: before running anything against a trust store, classify it as read-only or state-changing.","Match each real command to its effect so the classification table is complete."]},"question":"Match each command to its effect.","pairs":[{"left":"certutil -addstore Root root.cer","right":"Installs root.cer into the machine Root store (state change)"},{"left":"certutil -store Root","right":"Lists the machine Root store's certificates (read-only)"},{"left":"security add-trusted-cert -r trustAsRoot cert.pem","right":"Trusts cert.pem as if it were a root, in the current user's trust settings (state change)"},{"left":"security find-certificate -a -p /Library/Keychains/System.keychain","right":"Prints all system-keychain certificates as PEM (read-only)"}],"hint":"Two commands add or trust something; two only print what is already there.","explain":["The two state changes are certutil -addstore on Windows and security add-trusted-cert on macOS: both turn a file into trust. Note the macOS scope nuance — without the -d flag, add-trusted-cert writes the current user's trust settings rather than the whole Mac, which is exactly what this table teaches.","The two read-only commands print information: certutil -store lists a store, and security find-certificate with -p exports PEM text. Classifying first prevents an evidence-destroying mistake during an incident."]},{"id":"e09","type":"blank","perspective":"defender","scenario":{"summary":"Detection rules for install commands","text":["A detection engineer drafts two alert rules after INC-2201 and leaves the key terms blank for review.","Complete both rules so the tuning meeting can approve them."]},"question":"Complete the two detection rules.","blanks":[{"before":"Rule A (Windows/macOS): alert when certutil runs with ","after":" , or when the macOS security tool runs add-trusted-cert outside a change window.","answer":["-addstore"],"hint":"the certutil verb that changes state"},{"before":"Rule B (Linux): alert when a file appears in /usr/local/share/ca-certificates and is followed by ","after":" running outside the package pipeline.","answer":["update-ca-certificates"],"hint":"the Debian rebuilder command"}],"hint":"Rule A names one certutil verb; Rule B names the Debian command that rebuilds the bundle after a drop-in file appears.","explain":["Rule A fires on the state-changing verb -addstore (and, on macOS, on add-trusted-cert): those are the install actions of T1553.004. Listing verbs stay silent so the rule stays usable.","Rule B catches the Linux pattern: a drop-in file plus update-ca-certificates outside the package pipeline. Together the rules cover the install step on all three platforms without drowning the queue in read-only noise."]},{"id":"e10","type":"branch","perspective":"defender","scenario":{"summary":"Decision tree: rogue root confirmed on WKS-FIN-03","text":["You confirm a rogue root named ZZ-Update Validation CA in the machine Root store of WKS-FIN-03 (INC-2201).","Work the decision tree: each choice shapes the next step, and the final choice is the one your lead will read out in the stand-up."]},"question":"Choose the correct option at each step.","branch":{"steps":[{"prompt":"The rogue root is confirmed. What is your very first action?","options":[{"id":"a","text":"Delete the rogue root immediately before it is used"},{"id":"b","text":"Export the store listing and record the root's fingerprint"},{"id":"c","text":"Reboot the host to clear the trust change"}],"correct":"b","outcome":"You keep tamper evidence: the listing and the fingerprint go into INC-2201 before anything changes."},{"prompt":"The fingerprint matches no published vendor value, and the Temp-folder installer is accounted for. Next?","options":[{"id":"a","text":"Map which accounts ran install commands, and when"},{"id":"b","text":"Reimage the host straight away and close the ticket"},{"id":"c","text":"Leave the root trusted until management approves a report"}],"correct":"a","outcome":"The timeline and the account scope are established, so containment can be sized correctly."}],"final":{"question":"Which closing action matches incident-response practice here?","options":[{"id":"a","text":"Remove the root, then write the record afterwards from memory"},{"id":"b","text":"Preserve evidence, scope the change, then remove it under a change record"},{"id":"c","text":"Leave the root in place permanently because removal might break the user's apps"}],"correct":["b"]}},"hint":"Evidence first, then scope, and only then change state — the middle step decides how big the containment must be.","explain":["The tree rewards the same order every time: capture the listing and fingerprint, scope the timeline and accounts, and only then remove the root under a change record.","Deleting first destroys the very evidence that proves what happened. Rebooting changes nothing here because the trust persists. Reimaging without scoping loses the timeline, and leaving a rogue root trusted leaves the attacker's capability active."]},{"id":"e11","type":"single","perspective":"neutral","scenario":{"summary":"GPO deploys the inspection root — who still distrusts it?","text":["IT pushes the corporate inspection root, ACME-SSL-Inspect Root CA, to every Windows machine through GPO (CHG-7741).","A QA engineer asks a fair question: after this GPO deployment, which software on a managed Windows machine will still NOT trust the new root?"]},"question":"Which software will still not trust the GPO-deployed root?","options":[{"id":"a","text":"Microsoft Edge, because it keeps its own store"},{"id":"b","text":"Firefox, because it uses its own NSS trust store"},{"id":"c","text":"Chrome on Windows, because Google rejects all corporate roots"},{"id":"d","text":"Windows Update, because system services skip the user store"}],"correct":["b"],"hint":"One of these browsers does not read the operating system's trust decisions at all.","explain":["Firefox reads its own NSS trust store, so a root deployed only through the Windows store does not change what Firefox trusts. That is why managed fleets deploy the inspection root to NSS as well.","Edge and Chrome on Windows use the operating system trust store, so both trust the GPO-deployed root. Windows Update uses the machine store too, so option d is wrong."]},{"id":"e12","type":"drag","perspective":"dual","scenario":{"summary":"Reconstruct the operator's two phases","text":["You are replaying the INC-2201 operator's playbook for the detection team.","Sort the four observed actions into the two phases of the attack: getting the root trusted, and cashing in that trust."]},"question":"Sort each action into the correct phase.","zones":[{"id":"z1","label":"Get the root trusted","accepts":["i1","i2"]},{"id":"z2","label":"Abuse the trust","accepts":["i3","i4"]}],"items":[{"id":"i1","text":"Deliver updroot.cer inside a fake updater that lands in the Temp folder"},{"id":"i2","text":"Run certutil -addstore Root from the updater's parent shell"},{"id":"i3","text":"Serve a fake certificate for the bank's login page"},{"id":"i4","text":"Read the decrypted HTTPS session inside a proxy the user never sees"}],"hint":"Phase one ends when the machine believes the CA; phase two spends that belief.","explain":["Attacker perspective: phase one is delivery and install — the fake updater lands the file and certutil -addstore Root turns it into machine trust; phase two spends that trust by faking the bank's certificate and reading the decrypted session inside a proxy the user never sees.","Defender perspective: each phase is a detection point — the install command and the registry write are observable before any traffic flows, so alerting on phase one breaks the chain before the attacker can spend the trust.","Splitting the phases this way shows the detection team exactly where to intervene: before phase one completes."]},{"id":"e13","type":"multi","perspective":"defender","scenario":{"summary":"Mitigation shortlist under least privilege","text":["After INC-2201, the GRC board asks for a shortlist that fits a least-privilege model.","Two proposals fit the model and the estate. Select those TWO."]},"question":"Select the TWO proposals that fit a least-privilege model.","options":[{"id":"a","text":"Give every user a local admin account so they can approve prompts faster"},{"id":"b","text":"Remove local admin rights from standard users"},{"id":"c","text":"Let scripts modify the trust store silently to avoid prompts"},{"id":"d","text":"Manage trust-store changes through GPO/MDM with an approval record"}],"correct":["b","d"],"hint":"Least privilege takes rights away from people and gives changes an owner and a record.","explain":["Removing local admin rights (b) means a rogue install needs an elevation the attacker no longer has, and GPO/MDM-managed changes with an approval record (d) make every legitimate trust change attributable.","Option a multiplies the risk by giving everyone the very right the model removes, and option c removes the human approval step that the model depends on."]},{"id":"e14","type":"match","perspective":"neutral","scenario":{"summary":"Which apps escape the OS trust store — and which exception exists?","text":["The application team asks which of their products ignore Windows trust decisions — and whether any managed exception exists.","Match each app behaviour to its consequence so the answer is exact."]},"question":"Match each app behaviour to its consequence.","pairs":[{"left":"Node.js app shipping its own CA bundle","right":"Trusts the bundle packaged with the app, not the OS store"},{"left":"curl run with --cacert pointing at a custom bundle","right":"Trusts only the bundle named on the command line for that call"},{"left":"Firefox with the enterprise-roots policy enabled","right":"Also imports the OS store's roots — the managed exception"}],"hint":"One app carries a bundle, one takes the store from the command line, and one can be managed into importing OS roots.","explain":["A packaged Node.js bundle and a curl --cacert override both bypass the Windows store: the first trusts what shipped with the app, the second trusts exactly the file the command names, for that one call. A rogue root in the OS store changes neither.","The managed exception is Firefox's enterprise-roots policy: with it enabled, Firefox imports the OS store's roots as well, which is how managed fleets extend the inspection root to Firefox without touching NSS. Knowing which apps are exempt — and which one policy closes the gap — tells responders where a rogue root still works, and where a managed setting quietly fixes it."]},{"id":"e15","type":"blank","perspective":"defender","scenario":{"summary":"Trust-store baseline procedure","text":["The tuning meeting approved one more control: a weekly baseline of every trust store.","Complete the two procedure lines for the wiki."]},"question":"Complete the two baseline procedure lines.","blanks":[{"before":"Weekly on Linux: the bundle's hash is compared against the value recorded at build time from the ","after":"-image capture, because a hash means nothing without a known-good reference.","answer":["golden"],"hint":"the adjective for the reference image the estate builds from"},{"before":"Weekly on Windows: diff the live Root store against the ","after":" recorded when that reference image was built.","answer":["baseline"],"hint":"the recorded reference state every diff is measured against"}],"hint":"One blank names the reference image; the other names the recorded state that diffs are measured against.","explain":["A hash is only meaningful next to a known-good reference, so the Linux check compares against the golden-image value recorded at build time — never against last week's value, which an attacker may already have tampered with.","The Windows diff needs the recorded baseline from the same reference image. Comparing the live store against a trusted reference is what turns a silent install into a one-line diff — exactly the signal that was missing during INC-2201, and one that command-based rules can miss entirely."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +

          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +

          '<div class="factrow">' +

            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +

    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +
        '<button type="button" class="scen-toggle" id="btn-scen" aria-expanded="' + (!long) + '">' + (long ? 'Show scenario' : 'Hide scenario') + '</button></div>' +
      (long ? '<div class="scen-summary" id="scen-summary">' + esc(sc.summary || '') + ' — collapsed</div>' : '') +
      '<div class="block-b">' + body + '</div>' +
    '</section>';
    html += '<section class="block" aria-label="Question">' +
      '<div class="block-h h-question"><span class="bico" aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="block-b"><p class="q-text">' + esc(ex.question) + '</p></div>' +
    '</section>';
    html += '<section class="block" aria-label="Your answer">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>' +
      '<div class="block-b">' + widgetHtml(ex) + '</div>' +
    '</section>';
    html += '<div id="fb-slot"></div>';
    html += '<div class="actionbar">' +
      '<button type="button" class="btn btn-primary" id="btn-check">Check answer</button>' +
      '<button type="button" class="btn btn-primary" id="btn-next" style="display:none"></button>' +
      '<span class="note">Check stops the timer so you can read the feedback without pressure.</span>' +
    '</div>';
    return html;
  }
  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {
        var cur = a.match ? a.match[i] : '';
        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +
          '<select class="match-sel" data-left="' + i + '" aria-label="Match for: ' + esc(p.left) + '">' +
          '<option value="">— choose —</option>' +
          rights.map(function (r) { return '<option value="' + esc(r) + '"' + (cur === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') +
          '</select></div>';
      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {
        var idxs = ex.steps.map(function (_, i) { return i; });
        a.arr = shuffled(idxs, mulberry32(exSeed(ex, 3)));
      }
      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {
        return '<li class="orderitem" data-pos="' + pos + '">' +
          '<span class="rank">' + (pos + 1) + '</span>' +
          '<span class="order-text">' + esc(ex.steps[si]) + '</span>' +
          '<span class="order-btns">' +
            '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up: ' + esc(ex.steps[si]) + '">▲</button>' +
            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +
          '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">' + label + ' 1 is the first position. Use the arrows to reorder.</p>';
    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +
          inBank.map(function (iid) {
            var it = ex.items.find(function (x) { return x.id === iid; });
            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {
              return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(it.id) + '" data-inzone="' + esc(z.id) + '">' + esc(it.text) + '<span class="place-note">Click to send back to the bank</span></button>';
            }).join('') + '</div></div>';
        }).join('') + '</div></div>';
    } else if (ex.type === 'terminal') {
      if (!a.scroll) {
        a.scroll = (ex.terminal.banner || []).slice();
        a.lastCmd = '';
        a.nearMiss = null;
      }
      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      var stepsTotal = br.steps.length + 1;
      if (st < br.steps.length) {
        var step = br.steps[st];
        inner = '<span class="branch-step">STEP ' + (st + 1) + ' OF ' + stepsTotal + '</span>' +
          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(step.prompt) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {
            var isSel = a.bsel === o.id;

              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="branch-confirm"><button type="button" class="btn" id="btn-bconfirm" disabled>Confirm step</button></div>' +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      } else {
        var f = br.final;
