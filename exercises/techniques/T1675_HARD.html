var META={"topicId":"t1675","mitreId":"T1675","name":"ESXi Administration Command","mitreName":"ESXi Administration Command","objectType":"technique","title":"T1675 ESXi Administration Command — HARD","difficulty":"hard","severity":"hard","severityLabel":"HARD","batch":3,"questionCount":15,"estimatedMinutes":24,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1675 — ESXi Administration Command</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>HARD mode — correlated evidence, plausible traps.<\/b> In this unit you work T1675 like a senior analyst: two or three interacting signals at once, artefacts from <b>hostd.log<\/b> and <b>vpxd logs<\/b>, and real tradecraft. <b>UNC3886<\/b> used <b>vmtoolsd.exe<\/b> to run commands on guest VMs from a compromised ESXi host; the <b>VIRTUALPITA<\/b> backdoor executes commands on guests from compromised hypervisors; <b>The Gentlemen Ransomware<\/b> used ESXi admin commands including <b>vmkfstools<\/b> to modify the system.<\/p><p>The traps are calibrated: backup accounts that <b>look alarming but are benign<\/b>; three quiet calls that <b>look benign but are alarming<\/b>; and moments where the <b>least aggressive action<\/b> is the correct one. Near-miss options are defensible elsewhere but wrong here — check the account, the schedule and the API before you judge. Detection anchors: <b>unusual API frequency<\/b>, an <b>unexpected management account<\/b>, <b>off-hours execution<\/b>, and the <b>VirtualMachine.GuestOperations<\/b> permission inventory.<\/p><p>Take your time. Every wrong option here is one a real analyst has picked before.<\/p>","themes":[{"name":"ESXi and VMware Tools fundamentals","concepts":["vmtoolsd.exe"]},{"name":"Running commands inside guests","concepts":["Guest Operations APIs","StartProgramInGuest","ListProcessesInGuest"]},{"name":"Real-world abuse vs administration","concepts":["UNC3886 guest command execution","VIRTUALPITA backdoor","The Gentlemen Ransomware vmkfstools","benign automation lookalikes","credential-store enumeration","host-side vs guest-side distinction"]},{"name":"Follow-on behaviours","concepts":["T1083 file and directory discovery","T1005 data from local system","T1003 credential dumping follow-on"]},{"name":"Privileges, logs and incident decisions","concepts":["hostd.log","vpxd logs","unusual API frequency","unexpected management account","off-hours execution","VirtualMachine.GuestOperations privileges","role permission inventory","least aggressive containment"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Name the actor and procedure behind the vmtoolsd.exe guest calls.","concepts":["UNC3886 guest command execution","vmtoolsd.exe"],"scenario":"<p>Threat-intel briefing, Monday morning. Last week an actor with links to a Chinese espionage cluster compromised the ESXi host esxi07 at a logistics firm. They held vSphere Guest Operations rights and ran commands inside <b>Windows guest VMs<\/b> by way of the guests' Tools agent binary — without ever authenticating to any guest. The report adds: \"No guest accounts were touched; the actions came from the host side.\"<\/p><p>Your manager asks which documented actor and procedure this matches.<\/p>","question":"<p>Which attribution matches the described procedure?<\/p>","options":["The Gentlemen Ransomware — because vmtoolsd.exe is an encryption helper for guest disks","LOCKBIT — because ESXi ransomware always uses vmtoolsd.exe for lateral movement","UNC3886 — the procedure matches using vmtoolsd.exe from a compromised ESXi host to run commands on guest VMs","VIRTUALPITA — because it is a Windows worm that spreads through VMware Tools shares"],"correct":2,"hint":"Match the mechanism in the report — host-side privileges plus the Windows Tools binary — to a documented procedure example, not to a name you recognise from the news.","explanation":"<p>The procedure — running commands on guest VMs with <b>vmtoolsd.exe<\/b> from a compromised ESXi host, without guest credentials — is the documented <b>UNC3886<\/b> (G1048) example for T1675. The Gentlemen used host-side tools like <b>vmkfstools<\/b> to modify the system, and VIRTUALPITA is a backdoor that executes commands on guests from compromised hypervisors, not a Windows worm spreading via shares. LOCKBIT is not part of this technique's procedure table.<\/p>","study":"ATT&CK T1675 'Procedure Examples': UNC3886 (G1048), VIRTUALPITA (S1217), The Gentlemen (S9051)."},{"id":"EX-02","type":"line-select","summary":"hostd.log: separate the documented backup window from the burst.","concepts":["hostd.log","unusual API frequency","unexpected management account"],"scenario":"<p>Night shift on esxi03. The estate has a documented backup-verification job: account <span class=\"mono\">svc-backup<\/span>, window <b>01:30–01:45<\/b>, ticketed and unchanged for months. Everything else that touched guests last night is fair game.<\/p>","question":"<p>Click <b>every<\/b> line that is NOT explained by the documented backup job.<\/p>","logLines":["2025-04-16T01:30:02Z esxi03 hostd: [sub=GuestOperationsManager] ListProcessesInGuest : 36 VMs batch start, account NORTHWIND\\svc-backup (backup-verify, window 01:30-01:45, CHG-1902)","2025-04-16T01:30:44Z esxi03 hostd: [sub=GuestOperationsManager] ListProcessesInGuest : vm-2051 (vmweb07), account NORTHWIND\\svc-backup, completed","2025-04-16T01:52:11Z esxi03 hostd: [sub=GuestOperationsManager] StartProgramInGuest : vm-2051 (vmweb07), account NORTHWIND\\svc-vsphereapi, program /bin/sh -c id","2025-04-16T01:52:40Z esxi03 hostd: [sub=Vimsvc.TaskManager] Task Completed : haTask-51-vim.vm.guest.ProcessManager.startProgramInGuest","2025-04-16T01:53:02Z esxi03 hostd: [sub=GuestOperationsManager] StartProgramInGuest : vm-2060 (vmdb03), account NORTHWIND\\svc-vsphereapi, program /bin/sh -c cat /etc/hostname","2025-04-16T01:54:19Z esxi03 hostd: [sub=GuestOperationsManager] ListFileInGuest : vm-2060 (vmdb03), account NORTHWIND\\svc-vsphereapi, path /home/","2025-04-16T02:05:00Z esxi03 hostd: [sub=Vmsvc] tools upgrade check for 42 VMs: no action","2025-04-16T02:06:11Z esxi03 hostd: [sub=Hostsvc] datastore capacity report generated"],"badLines":[2,4,5],"hint":"The backup job is ListProcessesInGuest only, under svc-backup, inside 01:30–01:45. Everything with a different account, API or clock time is out of scope for that job.","explanation":"<p>The documented job covers the svc-backup ListProcessesInGuest calls (lines 1–2). Lines 3, 5 and 6 come from <b>svc-vsphereapi<\/b> — an unexpected management account — between 01:52 and 01:54, outside the window, using <b>StartProgramInGuest<\/b> (an execution API) and <b>ListFileInGuest<\/b>. That is the unusual-frequency cluster. Lines 4, 7 and 8 are routine task and host records.<\/p>","study":"Correlate hostd guest-ops lines against account + API + approved window before judging."},{"id":"EX-03","type":"qcm-single","summary":"118 nightly guest-ops calls — incident or documented job? (alarming but benign)","concepts":["benign automation lookalikes","unusual API frequency"],"scenario":"<p>03:15. A junior analyst escalates, voice shaking: \"<span class=\"mono\">NORTHWIND\\svc-backup<\/span> ran ListProcessesInGuest on 118 VMs last night! 118 calls! That has to be the ESXi attacker from the news.\" You pull the detection history for the account:<\/p><pre class=\"art mono\">svc-backup · ListProcessesInGuest · daily 01:30–01:38 · 118 VMs · pattern unchanged for 6 months\nOwner: BackupOps · Job: backup-verify (CHG-1902, recurring) · vCenter events match the job schedule exactly\nNo StartProgramInGuest, no file transfer, no other account in the window<\/pre><p>The shortcut says: big API burst equals incident. What is the correct read?<\/p>","question":"<p>What is the correct assessment?<\/p>","options":["Incident — API bursts at that scale are always guest-operations abuse","Benign — the calls match a documented, ticketed backup job on a fixed nightly schedule, with no execution or transfer APIs involved","Incident — Guest Operations must never be used by backup software","Benign — the account name contains 'backup', so no further checks are needed"],"correct":1,"hint":"Frequency alone is not the signal — check who owns the pattern, whether it is ticketed, and which APIs were used.","explanation":"<p>This is the classic <b>benign automation lookalike<\/b>: the frequency is high, but the pattern is <b>documented, ticketed, fixed-window, owner-confirmed, and read-only<\/b> (ListProcessesInGuest only). Option A and C overreact to volume; option D is the lazy version of the right answer — 'backup' in a name proves nothing without the schedule and ownership you were given. Verdict: benign, keep the baseline.<\/p>","study":"Baseline discipline: frequency + account + API mix + change history, never frequency alone."},{"id":"EX-04","type":"drag-drop","summary":"Sort six artefacts: guest-side abuse, host-side commands, routine activity.","concepts":["host-side vs guest-side distinction","The Gentlemen Ransomware vmkfstools"],"scenario":"<p>You are briefing the IR team on what actually happened on the compromised cluster last week. Six findings, three buckets — and two near-misses that only fit if you check <i>where<\/i> the action executed.<\/p>","question":"<p>Place each finding in the right bucket.<\/p>","bank":["StartProgramInGuest ran /bin/sh on vmweb01 from the host side","InitiateFileTransferFromGuest copied /etc/shadow out of vmdb03","vmkfstools expanded a .vmdk while typed on the local ESXi shell","esxcli network firewall ruleset toggle run on the host","A finance user edits a spreadsheet inside their own VM session","vmware-tools-daemon health check answers the host's routine ping"],"slots":[{"label":"Guest-side execution via Guest Operations APIs — T1675 pattern","accept":[0,1]},{"label":"Host-side ESXi commands — not T1675","accept":[2,3]},{"label":"Routine guest-internal activity","accept":[4,5]}],"hint":"T1675 needs the guest-ops APIs. vmkfstools and esxcli stay on the hypervisor even though ransomware groups also use them.","explanation":"<p>Guest-side T1675: <b>StartProgramInGuest<\/b> and <b>InitiateFileTransferFromGuest<\/b> — both go through the Tools daemon into the guest. Host-side: <b>vmkfstools<\/b> (the disk tool The Gentlemen Ransomware used to modify the system) and <b>esxcli<\/b> run on the ESXi shell — real attacker activity, but not this technique. Routine: a user in their own session, and the Tools health check that is part of normal operation.<\/p>","study":"The vmkfstools contrast: attacker present on the host does not equal guest-ops abuse."},{"id":"EX-05","type":"multi-step","summary":"61 StartProgramInGuest calls by a helpdesk principal + role inventory.","concepts":["unexpected management account","role permission inventory","least aggressive containment"],"scenario":"<p>02:05, Saturday. vCenter shows <b>61 StartProgramInGuest calls in 12 minutes<\/b> from <span class=\"mono\">NORTHWIND\\helpdesk-rp<\/span> — a helpdesk service principal — against 34 guests, including two domain controllers. Nothing similar in the previous 90 days.<\/p><pre class=\"art mono\">hostd 01:52:11 StartProgramInGuest vm-2051 (vmweb07) NORTHWIND\\helpdesk-rp /bin/sh -c id\nhostd 01:53:02 StartProgramInGuest vm-2060 (vmdb03) NORTHWIND\\helpdesk-rp /bin/sh -c cat /etc/hostname\nhostd 02:04:44 StartProgramInGuest vm-2007 (vm-dc01) NORTHWIND\\helpdesk-rp /bin/sh -c whoami<\/pre><p>The team pulls the vCenter permission inventory:<\/p><pre class=\"art mono\">Role: Helpdesk-Tools (created 2025-04-14 by NORTHWIND\\admin-mk)\n  VirtualMachine.GuestOperations.Execute  -&gt; VM folder \\All VMs\n  VirtualMachine.GuestOperations.Query    -&gt; VM folder \\All VMs\nPrincipal: NORTHWIND\\helpdesk-rp (role bound 2025-04-14)\nadmin-mk: on leave since 2025-04-13 · no change ticket found<\/pre>","question":"<p>Work the three decisions in order.<\/p>","steps":[{"prompt":"First analytic move?","options":["Power off the ESXi host to stop everything at once","Pull the vCenter permission inventory and hostd/vpxd context around the burst window","Email the helpdesk team a warning and close the alert"],"correct":1,"outcome":"Correct — the burst only means something once you know whether helpdesk-rp could legitimately hold Guest Operations rights and what else it did."},{"prompt":"The inventory shows an unapproved role grant two days ago by an admin who is on leave. The API mix is execution-only. Next?","options":["Confirm with IAM that the grant was unapproved, and check vpxd for who created the role and any new sessions","Delete helpdesk-rp's account immediately so the logs are clean","Ignore — role changes by admins are always safe"],"correct":0,"outcome":"Correct — you now have an unexpected management account with an execution API. Confirm the grant's provenance before choosing containment; deleting the account would destroy evidence."},{"prompt":"IAM confirms the grant was never approved. Choose the containment.","options":["Remove GuestOperations privileges from helpdesk-rp's role and preserve logs — do not power off the host","Reboot all 34 guest VMs at once to kill any session","Reinstall VMware Tools on every guest"],"correct":0,"outcome":"Correct — the least aggressive effective action: revoke the capability (the attacker's whole access path) while keeping hosts, guests and evidence intact."}],"hint":"Order matters: capability, provenance, containment. Powering things off is the aggressive shortcut, not the answer.","explanation":"<p>The chain: <b>unexpected management account<\/b> (helpdesk-rp) + <b>unusual frequency<\/b> (61 calls/12 min) + execution API = guest-ops abuse. The <b>role permission inventory<\/b> proved an unapproved grant; removing the <b>VirtualMachine.GuestOperations<\/b> privileges is the <b>least aggressive containment<\/b> — it cuts the technique's entire access path without downtime or evidence loss. Reboots and reinstalls do not touch the vSphere-side privilege at all.<\/p>","study":"M1018 in practice: restrict VirtualMachine.GuestOperations privileges where not required."},{"id":"EX-06","type":"fill-blank","summary":"Complete the analytic sentence for the IR report.","concepts":["StartProgramInGuest","vmtoolsd.exe"],"scenario":"<p>Draft the key sentence of the IR report on the esxi07 incident. It must name the API and the mechanism.<\/p>","question":"<p>Fill the blanks: from the compromised ESXi host the actor called <input1> through the vSphere SDK, and the program ran inside the Windows guest under <input2>, the VMware Tools daemon — no guest password was used.<\/p>","template":"Fill the blanks: from the compromised ESXi host the actor called <input1> through the vSphere SDK, and the program ran inside the Windows guest under <input2>, the VMware Tools daemon — no guest password was used.","blanks":[{"answer":"StartProgramInGuest","alts":["startprograminguest","start program in guest"],"placeholder":"API name","width":22},{"answer":"vmtoolsd.exe","alts":["vmtoolsd"],"placeholder":"daemon binary","width":14}],"hint":"First blank: the execution API. Second blank: the Windows Tools binary that actually spawned the process.","explanation":"<p><b>StartProgramInGuest<\/b> is the execution API; the command then runs under <b>vmtoolsd.exe<\/b>, the Windows VMware Tools daemon — that is why the parent process in guest telemetry is vmtoolsd.exe with no interactive login. This is the UNC3886 procedure pattern for T1675.<\/p>","study":"ATT&CK T1675: API (host side) and daemon (guest side) are two halves of one action."},{"id":"EX-07","type":"qcm-single","summary":"Three quiet guest-ops calls on domain controllers (benign but alarming).","concepts":["credential-store enumeration","T1003 credential dumping follow-on"],"scenario":"<p>You review a quiet week and find only three guest-ops calls that stand out — all from <span class=\"mono\">NORTHWIND\\vc-admin-lf<\/span>, a legitimate vCenter admin with <b>no open tickets<\/b> this week:<\/p><pre class=\"art mono\">11:04 ListFileInGuest  vm-dc01  path C:\\Users\\  (2 entries)\n11:06 ListFileInGuest  vm-dc02  path C:\\Users\\  (2 entries)\n11:09 ListFileInGuest  vm-dc03  path C:\\Windows\\System32\\config\\  (1 entry)<\/pre><p>A colleague shrugs: \"Three calls, one admin, no malware alerts — nothing to see.\" Volume-based rules agree: three calls never crosses any threshold.<\/p>","question":"<p>What is the correct assessment?<\/p>","options":["Benign — only three API calls is too low volume to matter","Alarming — a privileged account quietly enumerating credential-related paths on domain controllers is a classic pre-dumping staging pattern (T1003)","Alarming — any ListFileInGuest call on a domain controller means the firewall failed","Benign — domain admins may list files on domain controllers at any time without tickets"],"correct":1,"hint":"Do not judge by volume. Judge by target (DCs), paths (credential stores) and the absence of a ticket.","explanation":"<p>This is the <b>benign-looking, alarming<\/b> case: the <b>credential-store enumeration<\/b> is quiet but pointed — user profiles plus <span class=\"mono\">System32\\config\\<\/span> (registry hives that hold password hashes) on all three domain controllers, from an admin with no ticket. That is exactly the staging that precedes <b>T1003 OS Credential Dumping<\/b> on guests. Volume misses it; context catches it. Firewalls are irrelevant to guest-ops, and 'admins can do anything' is not a control.<\/p>","study":"Pair T1675 with T1083/T1003: quiet ListFileInGuest on credential paths is high-value hunting."},{"id":"EX-08","type":"ordering","summary":"Order the follow-on chain from execution to credentials.","concepts":["StartProgramInGuest","T1083 file and directory discovery","T1005 data from local system","T1003 credential dumping follow-on"],"scenario":"<p>Timeline reconstruction for the IR report: the actor's guest-ops session progressed in a strict order. Rebuild it.<\/p>","question":"<p>Order the steps from first to last.<\/p>","items":["StartProgramInGuest runs a discovery script inside each target guest","ListFileInGuest maps user directories and credential stores (T1083)","InitiateFileTransferFromGuest pulls archives out of the guests (T1005)","Collected material enables OS credential dumping on the guests (T1003)"],"hint":"You run something first, then discover, then collect — the dumping stage feeds on what was collected.","explanation":"<p>The chain: <b>StartProgramInGuest<\/b> executes first (you need code inside to gather anything useful), <b>ListFileInGuest<\/b> performs discovery (T1083), <b>InitiateFileTransferFromGuest<\/b> collects the data out (T1005), and the collected material then enables <b>T1003 OS Credential Dumping<\/b>. The same guest-ops access powers every stage — which is why the privilege, not the network, is the control point.<\/p>","study":"T1675 follow-ons: T1083 → T1005 → T1003, all reachable without a single guest login."}];

EXERCISES.push({"id":"EX-09","type":"drag-drop","summary":"Dual perspective: red-team value vs blue-team signal over one excerpt.","concepts":["hostd.log","Guest Operations APIs","off-hours execution"],"scenario":"<p>One excerpt, two audiences. The red team wants to know what this access bought the attacker; the blue team wants to know what it left behind. Both read the same six observations.<\/p><pre class=\"art mono\">01:52:11 hostd StartProgramInGuest vm-2051 (vmweb07) NORTHWIND\\svc-vsphereapi /bin/sh -c id\n01:53:02 hostd StartProgramInGuest vm-2060 (vmdb03) NORTHWIND\\svc-vsphereapi /bin/sh -c cat /etc/hostname\n01:54:19 hostd ListFileInGuest      vm-2060 (vmdb03) NORTHWIND\\svc-vsphereapi path /home/\n01:58:40 hostd InitiateFileTransferFromGuest vm-2060 (vmdb03) NORTHWIND\\svc-vsphereapi file /home/ops/.ssh/id_rsa\n(all calls 01:52-02:04 · no vCenter tickets · account normally used only for host patching)<\/pre>","question":"<p>Drag each observation to the side that owns it.<\/p>","bank":["StartProgramInGuest executed commands in three guests without any guest credentials","The API session returned command output and a private key straight to the host","hostd.log records account, API, VM and timestamp for every call","All calls ran 01:52–02:04 — outside business hours","Privileges came from the vSphere side, so guest logins were never touched","vCenter events give one central trail across all hosts for the hunt"],"slots":[{"label":"Attacker value (red side)","accept":[0,1,4]},{"label":"Defender signal (blue side)","accept":[2,3,5]}],"hint":"Red items describe what the adversary gained; blue items describe what the adversary left for you to find.","explanation":"<p>Red: credential-free execution, output and the <span class=\"mono\">id_rsa<\/span> key returning over the API, and the vSphere-side privilege path that bypassed guest logins. Blue: <b>hostd.log<\/b>'s full record (account, API, VM, time), the <b>off-hours<\/b> window, and the centralised vCenter event trail — three concrete starting points for detection and scoping.<\/p>","study":"Practise reading one artefact twice: once for capability, once for evidence."},
{"id":"EX-10","type":"line-select","summary":"vpxd: off-hours database pull and staging command.","concepts":["vpxd logs","off-hours execution","T1005 data from local system"],"scenario":"<p>vpxd excerpt from vc01, chronological. The finance application vmapp02 normally sees no guest-ops traffic after 19:00. Two lines belong together.<\/p>","question":"<p>Click the <b>two<\/b> lines that show the adversary collecting data from vmapp02.<\/p>","logLines":["2025-04-17T18:22:10Z vc01 vpxd: Guest Operations: ListFileInGuest on vm-3011 (vmapp02) by NORTHWIND\\svc-reporting (job report-inventory)","2025-04-17T23:58:41Z vc01 vpxd: Guest Operations: InitiateFileTransferFromGuest on vm-3011 (vmapp02) by NORTHWIND\\svc-vsphereapi, file /var/opt/app/payroll.db","2025-04-18T00:04:12Z vc01 vpxd: Task Completed : haTask-3011-vim.vm.guest.FileManager.initiateFileTransferFromGuest","2025-04-18T00:31:57Z vc01 vpxd: Guest Operations: StartProgramInGuest on vm-3011 (vmapp02) by NORTHWIND\\svc-vsphereapi, program /bin/sh -c tar czf /tmp/.c /home","2025-04-18T00:32:10Z vc01 vpxd: alarm DatastoreUsageAlarm cleared on ds1","2025-04-18T00:40:05Z vc01 vpxd: Session terminated: user NORTHWIND\\svc-vsphereapi (SSO, idle timeout)","2025-04-18T06:30:00Z vc01 vpxd: Scheduled backup hook: guest ops reserved for NORTHWIND\\svc-backup","2025-04-18T07:12:44Z vc01 vpxd: Daily inventory report generated (svc-reporting)"],"badLines":[1,3],"hint":"One line moves data OUT of the guest; the other packs it up first. Both are after 19:00 and from the wrong account.","explanation":"<p>Line 2: <b>InitiateFileTransferFromGuest<\/b> pulling <span class=\"mono\">payroll.db<\/span> at 23:58. Line 4: <b>StartProgramInGuest<\/b> running <span class=\"mono\">tar czf /tmp/.c /home<\/span> at 00:31 — staging an archive for transfer. Together they are off-hours <b>T1005 Data from Local System<\/b> collection through guest ops. The task-completed, alarm, session-timeout, backup-hook and report lines are routine.<\/p>","study":"Staging (tar/zip) via StartProgramInGuest followed by a file transfer is a paired signature."},
{"id":"EX-11","type":"drag-drop","summary":"Attribute six evidence lines to the actor or tool that produced them.","concepts":["UNC3886 guest command execution","VIRTUALPITA backdoor","The Gentlemen Ransomware vmkfstools"],"scenario":"<p>Final briefing slide: three real procedure examples from the T1675 table. Get the attributions exactly right — the near-misses are deliberately swapped in the wrong rows during the draft.<\/p>","question":"<p>Place each evidence line under the actor or tool it points to. Two lines fit each actor.<\/p>","hint":"Two lines per actor: pair the tooling with the behaviour each group is documented for.","explanation":"<p>UNC3886 is documented using <b>vmtoolsd.exe<\/b> to run commands on guest VMs from a compromised ESXi host and used datastore-level tooling in its ESXi intrusions. VIRTUALPITA is a backdoor that executes commands on guests from compromised hypervisors — seen here as guest API calls from an unexpected management source and guest process listing. The Gentlemen Ransomware used ESXi administration commands including <b>vmkfstools<\/b> to modify the compromised system, which matches the encrypted-disks and bulk datastore-job evidence.<\/p>","study":"ATT&CK T1675 'Procedure Examples' — quote the rows verbatim in your next report.","bank":["vmtoolsd.exe spawned as a child of vmware-hostd on three guests within 4 minutes","Guest Operations API calls issued from a management workstation never used for VM admin","vmkfstools invoked with -E on datastore volumes holding customer file servers","A small Go backdoor polling the hypervisor for guest process lists","vSphere events showing InitiateFileTransferFromGuest against domain-joined VMs","Encrypted guest disks found after a bulk shadow-parse job on the datastore"],"slots":[{"label":"UNC3886 (G1048)","accept":[0,2]},{"label":"VIRTUALPITA (S1217)","accept":[1,4]},{"label":"The Gentlemen Ransomware (S9051)","accept":[3,5]}]},
{"id":"EX-12","type":"terminal","summary":"Tool not named: scope guest processes through the vSphere CLI.","concepts":["Guest Operations APIs","ListProcessesInGuest"],"scenario":"<p>Scoping task. Your workstation has a vSphere CLI configured and already authenticated to vCenter vc01 — the tool's name is yours to recall. Guest vmweb01 is a key target in the esxi07 incident. You must list the processes running <b>inside<\/b> vmweb01 through the Guest Operations API. SSH to the guest is not possible and not permitted — everything goes through vCenter.<\/p>","question":"<p>Type the command that lists the processes inside guest vmweb01.<\/p>","shellPrompt":"analyst@ws5:~$","expected":"govc guest.ps -vm vmweb01","elements":[{"any":["govc"],"label":"the vSphere CLI binary"},{"any":["guest.ps","guest start"],"label":"the guest-operations process-listing subcommand"},{"any":["vmweb01","web01"],"label":"the target VM"}],"hint":"Do not SSH to the guest — the vSphere CLI's guest namespace is the path; its process listing mirrors ListProcessesInGuest.","explanation":"<p><span class=\"mono\">govc guest.ps -vm vmweb01<\/span> uses the CLI's guest-operations namespace — the ListProcessesInGuest API — to enumerate processes inside vmweb01 through vCenter, using your vSphere identity. No guest credentials, no SSH. The three scored parts: the binary, the guest process subcommand, the target VM.<\/p>","study":"Practise govc guest.ps / guest.ls / guest.start against a lab vCenter."},
{"id":"EX-13","type":"qcm-single","summary":"Confirmed compromised svc-vsphereapi — choose the containment. (least aggressive)","concepts":["least aggressive containment","VirtualMachine.GuestOperations privileges"],"scenario":"<p>IR has confirmed that the vCenter service account <span class=\"mono\">NORTHWIND\\svc-vsphereapi<\/span> is compromised. It holds <b>VirtualMachine.GuestOperations.*<\/b> on all 200 VMs and has demonstrably used StartProgramInGuest on six of them. The change-freeze ends in 40 minutes; the backup window is still running. Three options are on the incident bridge.<\/p>","question":"<p>Which action is the correct containment?<\/p>","options":["Power off the ESXi cluster to guarantee the attacker is cut off","Reboot vCenter during the remaining backup window and revoke every admin role at once","Remove the account's VirtualMachine.GuestOperations privileges, rotate its credential, and preserve the logs","Uninstall VMware Tools from all 200 guest VMs"],"correct":2,"hint":"The attacker's entire access path is one privilege family on one identity. Cut that, and nothing else needs to burn.","explanation":"<p>The <b>least aggressive containment<\/b> targets the mechanism: strip <b>VirtualMachine.GuestOperations.*<\/b> from svc-vsphereapi and rotate the credential. That ends the technique with no downtime and preserves evidence. Powering off the cluster is self-inflicted outage; mass role revocation breaks management during backups; uninstalling Tools from 200 guests is slow, disruptive and leaves the privilege standing.<\/p>","study":"Containment principle: remove the abused privilege, keep the estate and the evidence alive."},
{"id":"EX-14","type":"fill-blank","summary":"Complete the detection-strategy sentence (DET0232 / AN0646).","concepts":["unusual API frequency","unexpected management account","off-hours execution"],"scenario":"<p>Your detection engineer asks you to write the strategy sentence for the Guest Operations abuse rule into the catalogue. Complete it.<\/p>","question":"<p>Fill the blanks: DET0232 / AN0646 hunts Guest Operations abuse through an unusual <input1> of guest-ops API calls, invocation by an <input2> management account, and execution outside <input3>.<\/p>","template":"Fill the blanks: DET0232 / AN0646 hunts Guest Operations abuse through an unusual <input1> of guest-ops API calls, invocation by an <input2> management account, and execution outside <input3>.","blanks":[{"answer":"frequency","alts":["volume","rate","number"],"placeholder":"noun","width":12},{"answer":"unexpected","alts":["unfamiliar","unknown","wrong"],"placeholder":"adjective","width":12},{"answer":"business hours","alts":["working hours","office hours"],"placeholder":"time window","width":16}],"hint":"How often, by whom, and at what time of day.","explanation":"<p>The documented strategy: <b>unusual frequency<\/b> of Guest Operations API calls, an <b>unexpected management account<\/b> doing the invoking, and execution outside <b>business hours<\/b>. Note EX-03's lesson: frequency alone false-positives on backup jobs — the three signals must be read together.<\/p>","study":"ATT&CK T1675 'Detection' (DET0232 / AN0646): frequency, unexpected accounts, off-hours."},
{"id":"EX-15","type":"multi-step","summary":"Midnight decision: freeze and capture, or shut everything down? (cost)","concepts":["least aggressive containment","role permission inventory"],"scenario":"<p>00:20, incident bridge, Heliotrope Logistics. Evidence shows guest-ops calls enumerating guests across two hosts; the estate's backup window runs 00:00–04:00 and is still executing. The on-call IR lead and the platform lead disagree on the first move.<\/p>","question":"<p>Two decisions, then the night is yours.<\/p>","steps":[{"prompt":"Platform lead: 'Power everything off — containment beats evidence.' IR lead: 'We lose volatile guest state.' You hold the tie-break.","options":["Freeze: keep everything running, capture vpxd/hostd logs and vCenter events to the evidence store first","Power off all hosts now — containment beats everything","Text all staff to shut down their laptops"],"correct":0,"outcome":"Correct — a live estate plus preserved logs lets you scope precisely; a powered-off estate destroys live guest state and blinds the investigation."},{"prompt":"Capture is underway. The IR lead now wants to revoke the abused role's GuestOperations privileges. Timing?","options":["Revoke first — logs can be re-imported later","Complete the event and log capture, then revoke — minutes of extra risk, preserved evidence","Do nothing tonight and revisit on Monday"],"correct":1,"outcome":"Correct — capture-then-revoke balances both: the <b>role permission inventory<\/b> and events are on disk before the attacker loses access, and containment still lands tonight."}],"hint":"The privilege revocation is reversible and immediate; a powered-off estate is neither.","explanation":"<p>The <b>least aggressive containment<\/b> keeps the estate alive long enough to capture vpxd/hostd logs and vCenter events, then removes the abused privilege. Powering off loses volatile guest state and the backup window; doing nothing leaves an active abuse path. Order: freeze → capture → revoke.<\/p>","study":"Incident sequencing: preserve, then contain, then eradicate."});

          var up = el('button', null, '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');

    } else if (ex.type === 'matching') {

      var mw = el('div', 'matchwrap');

        rcol.querySelectorAll('.mchip').forEach(function (x) { x.remove(); });

          b.addEventListener('click', function () {

            wstate.activeLeft = (wstate.activeLeft === li ? null : li); drawMatch();
          });

        });
        S.shuffles[S.current].right.forEach(function (ri, pos) {
          var usedBy = -1; Object.keys(wstate.assign).forEach(function (k) { if (wstate.assign[k] === ri) usedBy = parseInt(k, 10); });
          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));
          b.type = 'button';
          if (usedBy >= 0) b.classList.add('paired');
          b.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();
          });
          rcol.appendChild(b);
        });
      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));

      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);

    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');

          row.addEventListener('click', function () {

    function drawStep() {
      var sw = el('div', null, '');

      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];

      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));

      st.options.forEach(function (o, i) {
        var r = optRow(i, o);

        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));

      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';

    /* action row */
    var actions = el('div', 'actions');

    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');

      if (a.hintUsed || a.status === 'checked') return;

    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');

    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */

  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');

    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });

    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();

  function showPauseVeil() {

      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();
