<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.003 Distributed Component Object Model — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

e":"Process-Lineage Forensics","items":["svchost -k DcomLaunch parent lineage","mmc.exe and EXCEL.EXE activation children","In-process Shell objects with no new process","CLSID resolution under HKLM\\SOFTWARE\\Classes\\CLSID"]},{"theme":"Detection Engineering","items":["Joining Security 4624 with Sysmon event 1","Scoped exceptions for documented admin tools","System 10016 baselining and suppression","Rule blind spots and coverage replay"]},{"theme":"Hardening & Permission Drift","items":["MachineLaunchRestriction drift auditing","EnableDCOM = N via Dcomcnfg","netsh dynamicport range review","M1042, M1030 and M1026 control mapping"]}]}</script>

var EXAMS = [{"id":"e01","type":"mcq","title":"Conflicting stories","summary":"Choose the most defensible conclusion on mixed evidence.","scenario":"Three facts arrive together for CTX-SHARD09 at 02:47. One: ISystemActivator activation from IT-JMP02 over Kerberos. Two: the change calendar shows an approved DCOM test window for 02:00–03:00 owned by the platform team. Three: the platform team's runbook uses PowerShell GetTypeFromProgID, but script-block logs show GetTypeFromCLSID with a GUID the runbook never mentions.","question":"Which conclusion is most defensible on the current evidence?","hint":"Two facts support the change; one fact does not fit — neither extreme conclusion survives that.","explanation":"The window and host match an approved change, but the technique does not match the runbook — a real mismatch with two explanations: the team improvised, or someone is borrowing their window. The defensible move verifies cheaply without destroying evidence, which rules out closing the case, declaring a confirmed intrusion on one mismatch alone, and isolating production first. Confirmation bias in either direction is the failure mode at this level.\n\nDefender view: change windows are the favourite cloak of hands-on-keyboard operators — verify the method, not just the calendar. Attacker view: hijacking an approved window with a slightly different toolchain buys minutes of hesitation exactly like this.","study":"Study change-window validation and evidence-preserving verification steps.","options":["Close it as approved change work because host and window both match the calendar","Verify the CLSID mismatch with the platform team while preserving live evidence","Escalate as confirmed intrusion because the runbook never mentions CLSID use","Isolate CTX-SHARD09 immediately and continue questions during the outage"],"correct":1},{"id":"e02","type":"multi","title":"RPC internals check","summary":"Mark the consultant's statements true or wrong before publication.","scenario":"You are reviewing the network forensics chapter a consultant wrote for the DCOM case. The chapter mixes real RPC mechanics with plausible-sounding inventions, and the client will publish it. Mark only the correct statements before publication, because wrong mechanics in print are costly to retract.","question":"Select all statements that are technically correct:","hint":"Two sentences were written by someone who confuses DCOM with SMB and with the RDP port.","explanation":"The three correct statements are the actual chain: 135 hands out the endpoint, ISystemActivator carries the activation call, and the bind authenticates with NTLM or Kerberos. DCOM does not tunnel through SMB named pipes by default — that confuses it with named-pipe transports used elsewhere — and the oxid resolver is part of RPC object-reference handling over the same session, not a UDP 135 ritual.\n\nStudy tip: verify consultant prose against MS-RPCE and the public DCOM research before it ships.","study":"Study the MS-RPCE and MS-DCOM abstracts plus the public ISystemActivator write-ups.","options":["The endpoint mapper on 135 returns the dynamic port to use","RemoteCreateInstance inside ISystemActivator performs the activation","The RPC bind can carry NTLM or Kerberos authentication context","DCOM activation tunnels its RPC inside an SMB3 named pipe by default","Oxid resolution happens over UDP 135 on every activation"],"correct":[0,1,2]},{"id":"e03","type":"match","title":"Frame to stage","summary":"Assign each wire frame to its activation stage.","scenario":"The packet annex lists five frames from one DCOM activation between LAB-RED03 and CTX-SHARD09. The annex column naming the stage was lost during the export. Rebuild it so the client's forensics team can reuse the annex as a teaching artefact for their own juniors.","question":"Pair each frame with its stage in the activation:","hint":"Doorbell, address, authentication, activation, execution.","explanation":"The five frames are the canonical activation story: knock on 135, learn the dynamic port, authenticate the bind, activate the class through ISystemActivator, then invoke methods on the same session. Readers who swap authentication and activation misread captures, and the method frames are the stage that actually does the damage — everything before it was preparation.\n\nStudy tip: rehearse this five-line story until you can narrate a capture live.","study":"Study DCERPC PDU ordering: bind, bind_ack, request, response.","pairs":[{"left":"TCP SYN to port 135","right":"Endpoint-mapper contact"},{"left":"EPM response naming port 49731","right":"Dynamic endpoint resolution"},{"left":"DCERPC bind with NTLM auth on 49731","right":"Authenticated session setup"},{"left":"RemoteCreateInstance on ISystemActivator","right":"COM class activation"},{"left":"Method invocation frames on 49731","right":"Command execution inside the object"}]},{"id":"e04","type":"match","title":"Artefact to verdict","summary":"Label each host artefact as evidence, noise or state.","scenario":"The triage board for CTX-SHARD09 collected six artefacts. The client asks for a one-line verdict per artefact: live evidence, benign noise, or configuration state. Complete the verdict table before the client call, because mixing the categories is how teams either panic over settings or miss the session that mattered.","question":"Pair each artefact with its correct verdict:","hint":"One is the notorious noise event; two are permission values that describe state.","explanation":"The lineage pair and the 4624/4672 pair are live evidence; System 10016 is the documented local-permission noise every Windows host produces; and the two permission values are configuration state — one dangerous (wide launch ACL) and one protective (DCOM disabled). Mixing configuration with evidence is how teams either panic over settings or miss the session that mattered.\n\nStudy tip: sort artefacts into evidence, noise and state before you write any conclusion.","study":"Study triage taxonomy: volatile evidence, baseline noise, configuration state.","pairs":[{"left":"mmc.exe under svchost -k DcomLaunch","right":"Evidence of COM activation"},{"left":"System 10016 repeated hourly","right":"Benign local permission noise"},{"left":"MachineLaunchRestriction = wide ACL","right":"Hardening drift to fix"},{"left":"4624 type 3 plus 4672 seconds apart","right":"Evidence of privileged network logon"},{"left":"EnableDCOM = N in the Ole key","right":"Hardening state, DCOM disabled"}]},{"id":"e05","type":"order","title":"Full operator chain","summary":"Order the complete intrusion chain through DCOM.","scenario":"The forensic reconstruction for the CTI report needs the operator's full chain — from foothold to clean-up — across four hosts. Public reporting documents comparable chains for financially motivated groups; your report must stay neutral and precise, and the chain spans credential access, activation and clean-up.","question":"Arrange the reconstructed operator steps into the order they occurred:","hint":"Credential access precedes everything; the ticket step precedes the remote activation.","explanation":"The chain follows dependency order: privileges first, a usable ticket second, reachability third, activation fourth, execution fifth, and operational-security clean-up last. Each step leaves a different artefact — 4624/4672 for the logon, endpoint-mapper frames for the probe, script-block logs for the activation line, and Sysmon lineage for the mmc.exe child. The clean-up step is where the reconstruction gets hard, because tampering degrades exactly the logs you need.\n\nAttacker view: the chain is deliberately quiet — no 3389, no new services, one privileged account. Defender view: the chain is also brittle — break any earlier step and the later artefacts never appear, which is why layered controls beat single detections.","study":"Study ATT&CK chaining: T1003 credential access into T1021.003 lateral movement.","items":["Escalate on the foothold and harvest a domain admin credential","Forge or reuse a Kerberos ticket for the admin account","Probe TCP 135 on CTX-SHARD09 from IT-JMP02","Activate the MMC20.Application class on CTX-SHARD09 by ProgID","Call Document.ExecuteShellCommand to stage a second implant","Tamp script-block logging and rotate the implant's call-home port"]},{"id":"e06","type":"fill","title":"Drift audit values","summary":"Complete the permission-drift audit sentence.","scenario":"You are writing the drift-audit section of the hardening report. The section compares what the standard says with what the hosts actually hold, and one sentence carries the three key facts. Fill the blanks exactly; the report goes to the audit committee, where imprecision costs credibility.","question":"Complete the drift-audit sentence with terms from the bank:","hint":"One value disables DCOM; one tool shows the dynamic port range; one key holds the machine ACLs.","explanation":"EnableDCOM = N is the disabled state, the machine-wide ACLs sit under HKLM\\SOFTWARE\\Microsoft\\Ole, and netsh exposes the dynamic port range the firewall team must allow for RPC. Y is the enabled state the standard forbids here, Classes holds the CLSID catalogue rather than ACLs, and regedit is an editor, not a reporting command the firewall review can cite.\n\nStudy tip: audit reports fail on imprecise values — quote the state, the key and the command.","study":"Study netsh int ipv4 show dynamicport and the Ole key values.","text":"The standard requires EnableDCOM = ___ for hosts that need no DCOM, verification of MachineLaunchRestriction under the ___ key, and a documented ___ dynamic-port range for the firewall review.","blanks":["N","Ole","netsh"],"bank":["N","Ole","netsh","Y","Classes","regedit"]},{"id":"e07","type":"fill","title":"Detection join design","summary":"Complete the correlated-rule specification.","scenario":"Detection engineering is turning the confirmed case into a rule. The specification sentence below defines the join, and the false-positive budget depends on getting every term right. Fill the blanks from the case facts so the query team can implement without guessing.","question":"Complete the rule specification with terms from the bank:","hint":"The join keys on host and time; the lineage anchor is the service group.","explanation":"The join is Security 4624 with Sysmon 1 — the logon and the child process — keyed on host and a ten-second window, with the DcomLaunch parent as the lineage anchor. 4688 records process creation in Security but lacks the parent-image detail Sysmon provides, 3 is the logon type rather than an event ID, and RpcSs hosts other RPC activity and would flood the rule.\n\nStudy tip: write the join in one sentence before you write the query; ambiguous specs become noisy rules.","study":"Study detection-as-code specifications and false-positive budgeting.","text":"Fire when Security ___ (type 3) and Sysmon ___ (process create) occur within 10 seconds on the same host, the child image is mmc.exe or EXCEL.EXE, and the parent hosts the ___ service group.","blanks":["4624","1","DcomLaunch"],"bank":["4624","1","DcomLaunch","4688","3","RpcSs"]},{"id":"e08","type":"fill","title":"Grandchild forensics","summary":"Complete the lineage-forensics sentence.","scenario":"The forensics annex must explain, for a non-technical reader, why the mmc.exe line matters even though mmc.exe is a signed Microsoft binary. One sentence carries the whole argument, and every blank in it must be restored from the bank before the annex is filed.","question":"Complete the lineage sentence with terms from the bank:","hint":"Signed binaries obey whoever calls them; the parent names the caller.","explanation":"DcomLaunch in the parent chain is the fingerprint of RPC-activated COM, the type 3 logon ties the activation to a source host, and the cmd.exe grandchild is the intruder's actual payload visible as lineage. RpcSs and explorer.exe parents tell innocent stories, and type 10 would mean RDP — every wrong blank tells the reader a different, false mechanism.\n\nStudy tip: lineage answers 'who asked for this process', which is the whole question.","study":"Study process-lineage analysis and parent-image meaning on Windows.","text":"The parent svchost -k ___ proves the object was RPC-activated rather than opened by a user, the type ___ network logon names the activating host, and the ___ grandchild shows what the intruder ran.","blanks":["DcomLaunch","3","cmd.exe"],"bank":["DcomLaunch","3","cmd.exe","RpcSs","10","explorer.exe"]},{"id":"e09","type":"logview","title":"Find the real activation","summary":"One unexplained activation hides in the noise — find it.","scenario":"The endpoint-mapper session summary for CTX-SHARD09 covers one hour. Baseline chatter is heavy: monitoring probes, backup RPC, and a documented admin tool inside its approved window. Exactly one sequence is a full remote COM activation that the change calendar does not explain. Bracketed notes mark the known baseline.","question":"Which sequence is the unexplained remote COM activation?","hint":"The real one shows endpoint resolution, an authenticated ISystemActivator bind and RemoteCreateInstance.","explanation":"The 02:47 sequence from IT-JMP02 — EPM bind, resolution to 49712, authenticated bind to ISystemActivator, RemoteCreateInstance, then method frames — is a complete activation, and it is the only one the change calendar does not cover. The monitoring probes stop at the EPM step, the backup host's traffic stays on its registered port, and the admin tool's activation at 01:58 matches the approved window, so all three are noise here.\n\nStudy tip: completeness is the discriminator — partial sequences are probes, full sequences are activations.","study":"Study distinguishing RPC probes from full remote activations in captures.","filterable":true,"log":{"header":["time","peer","detail"],"lines":["01:58:10  OPS-ADM01  EPM bind 135; resolved 49510; ISystemActivator bind (Kerberos); RemoteCreateInstance  [change window CHG-4471]","02:03:33  MON-SRV02  EPM bind 135 only, repeated x4  [monitoring probe]","02:11:07  BCK-VND04  RPC on registered port 56022  [nightly backup]","02:31:44  MON-SRV02  EPM bind 135 only  [monitoring probe]","02:47:12  IT-JMP02   EPM bind 135","02:47:12  IT-JMP02   resolved dynamic port 49712","02:47:13  IT-JMP02   DCERPC bind 49712  iface=ISystemActivator  auth=Kerberos  user=svc_platform","02:47:13  IT-JMP02   RemoteCreateInstance  clsid={49B2791A-B1AE-4C90-9B8E-E860BA07F889}","02:47:14  IT-JMP02   method frames on 49712  op=ExecuteShellCommand","02:52:20  MON-SRV02  EPM bind 135 only  [monitoring probe]","03:05:51  BCK-VND04  RPC on registered port 56022  [nightly backup]","03:19:02  IT-JMP02   session on 49712 closed","03:31:10  MON-SRV02  EPM bind 135 only  [monitoring probe]","03:58:00  OPS-ADM01  EPM bind 135 only  [post-change verify]"]},"widget":{"type":"mcq","question":"Which sequence is the unexplained remote COM activation?","options":["OPS-ADM01 at 01:58 — CHG-4471 change-window activation","IT-JMP02 at 02:47 — full activation chain, no change ticket","MON-SRV02 — endpoint-mapper probes with no follow-up","BCK-VND04 — backup RPC on its registered port"],"correct":1}},{"id":"e10","type":"terminal","title":"Dynamic port range","summary":"Show the RPC dynamic port range for the firewall review.","scenario":"The firewall team needs the exact dynamic port range for the RPC review ticket on CTX-SHARD09. Read-only — nobody touches the range during an open incident. The console in front of you is already on the host, and the output goes straight into the review ticket.","question":"Run the read-only command that displays the TCP dynamic port range:","hint":"netsh in the ipv4 context shows the dynamic port configuration.","explanation":"netsh int ipv4 show dynamicport tcp prints the start port and the number of ports the RPC runtime may allocate — the facts the firewall rule needs. Setting the range mid-incident would break live RPC bindings and is a change-control action, not a triage step. This range is also why blocking 'the high ports' needs a rule for 49152–65535, not a single port.\n\nDefender view: capture this range per host family — custom images sometimes narrow it, and your segmentation rules must match reality. Attacker view: the range tells an operator which ports their activation session may land on, useful when egress filters exist.","study":"Study netsh dynamicport syntax and pre-Vista versus modern ranges.","prompt":"PS C:\\Users\\analyst>","skill":"rpc-dynamic-port-mapping","knownTools":["netsh","netstat","reg","Set-NetTCPSetting"],"expected":"netsh int ipv4 show dynamicport tcp","elements":[{"label":"the netsh context tool","any":["netsh"]},{"label":"the ipv4 protocol context","any":["ipv4"]},{"label":"the dynamic port query","any":["dynamicport"]},{"label":"the tcp protocol argument","any":["tcp"]}],"forbidden":[{"any":["set dynamicport","start=","numrange"],"why":"Changing the dynamic port range on a live host breaks RPC bindings mid-incident — schedule it as a change, never run it during triage."}],"output":["PS C:\\Users\\analyst> netsh int ipv4 show dynamicport tcp","Protocol         : Tcp","Start Port       : 49152","Number of Ports  : 16384"]},{"id":"e11","type":"decision","title":"Do nothing yet","summary":"Three steps where the last one is discipline, not action.","scenario":"The 02:47 activation on CTX-SHARD09 is confirmed unexplained. Executive pressure demands isolating the host immediately. Your data: the activation ran ExecuteShellCommand once at 02:47:14, the session closed at 03:19, no later frames exist, and EDR shows the mmc.exe child exited after two minutes with no persistence artefacts so far.","question":"Step through all three decisions; the final one tests discipline:","hint":"Isolation destroys the very session data that answers the scope question.","explanation":"This is the do-nothing-yet case: the correct action is escalation with preserved evidence plus enhanced monitoring, because destructive or impulsive steps — isolating a session host mid-flight, rebooting, deleting log entries 'as a test' — destroy the artefacts that answer scope and attribution. The discipline is procedural, not passive: monitoring, evidence preservation and IR handover all run at full speed.\n\nDefender view: write down what you did NOT do and why; auditors and IR both ask. Attacker view: an operator who sees the host rebooted knows the defenders panicked — and plans around the gaps that reboot created.","study":"Study escalation criteria and evidence-preservation checklists.","steps":[{"label":"STEP 1 OF 3 — weigh isolation","prompt":"Executives want CTX-SHARD09 isolated now.","question":"What is the strongest argument to record?","options":["Isolation now destroys live session state that scoping needs; targeted monitoring preserves it","Isolation is always the first step in any confirmed case","Isolation is never justified for a single activation"],"correct":0,"why":"Blanket rules fail both ways: immediate isolation destroys volatile scope evidence, and never-isolating ignores real risk — the record must argue proportion, not reflex."},{"label":"STEP 2 OF 3 — cheap verification","prompt":"The platform account svc_platform was used; the owner is reachable by phone.","question":"What do you run first?","options":["Call the owner while pulling 4688 history and the script-block log for 02:47","Disable all platform accounts estate-wide before anyone answers","Wait for the next change meeting to ask in person"],"correct":0,"why":"One call plus read-only logs resolves the borrowed-window question in minutes; estate-wide disablement outruns the evidence and stalls the business."},{"label":"STEP 3 OF 3 — the disciplined call","prompt":"The owner denies everything; the borrowed session remains unexplained.","question":"Which answer is correct right now?","options":["Do nothing destructive yet — escalate to IR with the evidence pack and enhanced monitoring in place","Reboot the host to clear the session and continue in the morning","Delete the script-block entries to test whether the intruder re-creates them"],"correct":0,"why":"Escalation with preserved evidence and monitoring is the proportionate move; reboots and log tampering destroy exactly what IR needs and are never tests."}]},{"id":"e12","type":"logview","title":"Merged view, three blanks","summary":"Complete the board sentence from the merged export.","scenario":"The merged export for CTX-SHARD09 pairs Security events with Sysmon and a script-block capture. The client's oversight board will read one sentence from it; three values were removed for this exercise and must be restored from the export alone, never from memory or assumption.","question":"Complete the oversight sentence using only values that appear in the export:","hint":"One blank is an account, one a parent service group, one an event number.","explanation":"The export shows svc_platform's type 3 logon at 02:47:12, 4672 seconds later, then Sysmon 1 with mmc.exe under svchost -k DcomLaunch and the script-block line with the MMC20 CLSID and ExecuteShellCommand. The blanks read svc_platform, DcomLaunch and 4624 — the account, the lineage anchor and the logon event. Any other value either belongs to another row or names a different mechanism entirely.\n\nStudy tip: oversight sentences get quoted in board packs — restore them from the log, never from memory.","study":"Study building board-ready evidence sentences that trace back to raw events.","filterable":true,"log":{"header":["time","source","detail"],"lines":["02:47:12  Sec4624  Logon Type 3  user=svc_platform  src=10[.]93[.]12[.]40  host=CTX-SHARD09","02:47:13  Sec4672  Special privileges  user=svc_platform","02:47:13  PShost  ScriptBlock  text=[activator]::CreateInstance([type]::GetTypeFromCLSID('{49B2791A-B1AE-4C90-9B8E-E860BA07F889}','CTX-SHARD09'))","02:47:14  Sec4688  New process  creator=svchost  name=mmc.exe","02:47:14  Sysmon1  ProcessCreate  image=mmc.exe  parent=svchost.exe (-k DcomLaunch)","02:47:15  PShost  ScriptBlock  text=$o.Document.ExecuteShellCommand('cmd',$null,'/c net user /domain',$null)","02:47:16  Sysmon1  ProcessCreate  image=cmd.exe  parent=mmc.exe  cmdline=cmd /c net user /domain","02:49:30  Sysmon3  NetworkConnect  image=cmd.exe  dst=10[.]93[.]12[.]40:445","02:49:31  Sysmon5  ProcessTerminate  image=cmd.exe","03:19:02  Sec4634  Logoff  user=svc_platform","04:00:00  Sysmon1  ProcessCreate  image=LogScavenge.exe  parent=services.exe","04:12:00  Sec4688  New process  creator=services  name=vmbackup.exe"]},"widget":{"type":"fill","question":"Which three values complete the oversight sentence?","text":"The board sentence reads: 'Account ___ performed the activation, the object ran under svchost -k ___ , and Security event ___ logged the network logon that preceded it.'","blanks":["svc_platform","DcomLaunch","4624"],"bank":["svc_platform","DcomLaunch","4624","svc_backup","RpcSs","4688"]}},{"id":"e13","type":"terminal","title":"Resolve the CLSID","summary":"Look up the observed CLSID in the COM catalogue.","scenario":"The wire capture on LAB-RED03 recorded CLSID {C08AFD90-F2A1-11D1-8455-00A0C91F3880} in the activation frame. Before the report names the object, the catalogue on the target image must confirm the mapping — a read-only query only, because the catalogue is cited as evidence in the report.","question":"Run the read-only command that queries the CLSID key for that object:","hint":"The catalogue lives under HKLM\\SOFTWARE\\Classes\\CLSID; reg query takes the full key path.","explanation":"reg query against HKLM\\SOFTWARE\\Classes\\CLSID\\{C08AFD90-…} confirms which COM class the GUID names, so the report can say ShellBrowserWindow with a registry citation. reg add or reg delete would mutate the COM catalogue, which corrupts the very mapping you are citing and can break applications; the query answers the question with zero side effects.\n\nDefender view: cite catalogue paths in reports so reviewers can re-verify every claim. Attacker view: operators resolve GUIDs the same way when choosing which object to abuse next.","study":"Study the Classes\\CLSID subkey layout and its default, ProgID and AppID values.","prompt":"PS C:\\Users\\analyst>","skill":"dcom-clsid-registration-lookup","knownTools":["reg","regedit","Get-ItemProperty"],"expected":"reg query HKLM\\SOFTWARE\\Classes\\CLSID\\{C08AFD90-F2A1-11D1-8455-00A0C91F3880}","elements":[{"label":"the reg query read","any":["reg query"]},{"label":"the COM catalogue path","any":["classes\\clsid"]},{"label":"the ShellBrowserWindow GUID","any":["{c08afd90-f2a1-11d1-8455-00a0c91f3880}"]}],"forbidden":[{"any":["reg add","reg delete"],"why":"Writing or deleting COM registration corrupts the catalogue and the evidence — always query, never mutate during an investigation."}],"output":["PS C:\\Users\\analyst> reg query HKLM\\SOFTWARE\\Classes\\CLSID\\{C08AFD90-F2A1-11D1-8455-00A0C91F3880}","HKEY_LOCAL_MACHINE\\SOFTWARE\\Classes\\CLSID\\{C08AFD90-F2A1-11D1-8455-00A0C91F3880}","    (Default)    REG_SZ    ShellBrowserWindow","    AppID        REG_SZ    {C08AFD90-F2A1-11D1-8455-00A0C91F3880}","PS C:\\Users\\analyst> _"]},{"id":"e14","type":"mcq","title":"Noise, sized correctly","summary":"Interpret a 10016 flood during the live case.","scenario":"Mid-case, the client's dashboard shows CTX-SHARD09 producing 2,000 System 10016 events per day for CLSIDs that also fire on untouched reference hosts at similar rates. The client wants the DCOM rule to alert on 10016 spikes, and the review must size the noise correctly before any change.","question":"What should the review conclude about alerting on 10016 spikes?","hint":"Noise events can join a story but must never start one.","explanation":"System 10016 is documented local-permission noise whose volume varies by host; the defensible design baselines it per host and never alerts on it alone, reserving 10016 as context joined to activation evidence. Threshold and CLSID-set alerts still fire on noise because the noise is the baseline behaviour, and dropping it from collection loses cheap context for real cases.\n\nStudy tip: noise events can join a story but must never start one.","study":"Study detection tuning with baseline hosts and context-only event joins.","options":["Alert whenever the daily count exceeds three times the reference-host average","Never alert on 10016 alone — baseline it and join to activation evidence","Alert only when the firing CLSID differs from the reference-host CLSID set","Drop 10016 from collection entirely because it is documented pure noise"],"correct":1},{"id":"e15","type":"decision","title":"Tune under pressure","summary":"The rule fires on a documented tool — tune without losing coverage.","scenario":"After the case, the DCOM lineage rule fires twice weekly on OPS-ADM01 activating objects on CTX-SHARD09 — the platform team's documented patch tool, confirmed by CMDB and six months of history. The client demands the noise stop; the CISO demands coverage stay. You own the tuning decision and its proof.","question":"Resolve each of the three tuning decisions in turn:","hint":"The exception must name the exact trust anchors, or it becomes a tunnel.","explanation":"Tuning is a trade done in public: the exception names source, account, target and window; a near-miss alert keeps spoofed sources visible; and the coverage claim is proven with before-and-after fire rates plus a replay. Quietness alone proves nothing, and estate-wide or host-wide suppressions are tunnels an operator can drive through.\n\nDefender view: every exception is an attacker-shaped hole until you prove otherwise — test it. Attacker view: operators read tuned detections and aim exactly for the suppressed corners, which is why near-miss alerting matters.","study":"Study exception design: trust anchors, near-miss alerting, replay-based coverage proof.","steps":[{"label":"STEP 1 OF 3 — scope the exception","prompt":"Benign pattern: source OPS-ADM01, account svc_platform, target CTX-SHARD09, patch window.","question":"Which exception is safe?","options":["Suppress only when source, account, target and window all match","Suppress all mmc.exe-under-svchost lineage estate-wide","Suppress OPS-ADM01 from every DCOM rule"],"correct":0,"why":"All four anchors matching makes the exception as narrow as the benign behaviour; broad suppressions create tunnels an operator can drive through."},{"label":"STEP 2 OF 3 — keep the edge","prompt":"The exception must not hide a source host that spoofs OPS-ADM01.","question":"Which guard keeps coverage?","options":["Alert when the pattern matches the exception except for the source host","Alert only on weekends when the tool never runs","Add a second rule for EXCEL.EXE lineages only"],"correct":0,"why":"Near-miss alerting keeps the rule honest: same behaviour from a different source still fires. Time and object filters do not address spoofing at all."},{"label":"STEP 3 OF 3 — measure","prompt":"Two weeks after tuning, the client asks for coverage proof.","question":"What do you report?","options":["Fire-rate before and after, plus the purple-team replay showing the rule still catches unknown sources","A statement that the rule is now quiet and therefore better","Nothing until the next quarterly review"],"correct":0,"why":"Coverage claims need a replay: fire-rate plus a controlled test from an unknown source proves the exception did not blind the rule."}]},{"id":"e16","type":"decision","title":"Scope or contain?","summary":"The final step decides how far the case reaches.","scenario":"IR accepts the escalated case. The evidence shows one unexplained activation on CTX-SHARD09 using svc_platform, one command run, session closed. MachineLaunchRestriction on two other shard hosts shows the same wide ACL the case host had. The client asks whether this is one host or an estate problem, and the answer drives the budget.","question":"Decide each of the three steps below, from framing to recommendation:","hint":"The wide ACL on other hosts changes the question from 'this host' to 'this class of host'.","explanation":"The case separates proven compromise (one host), configuration exposure (five hosts) and benign overlap (two hosts), then treats each accordingly: restore, monitor, and prove with a replay. Collapsing those categories — treating exposure as compromise or ignoring it — is how estate problems get mis-scoped and repeated.\n\nAttacker view: one wide ACL found by chance usually means more; assume the operator will look for the same drift. Defender view: configuration diffs are your cheapest estate-wide wins — schedule them monthly.","study":"Study scope framing: proven compromise versus configuration exposure versus benign overlap.","steps":[{"label":"STEP 1 OF 3 — frame the problem","prompt":"One confirmed activation; three hosts share the same wide launch ACL.","question":"What is the correct frame?","options":["One intrusion plus one estate-wide hardening exposure to verify","One intrusion, nothing else to check","Three confirmed intrusions already"],"correct":0,"why":"Evidence proves intrusion on one host; the shared ACL is exposure, not compromise — the frame must separate what is proven from what is possible."},{"label":"STEP 2 OF 3 — verify the exposure","prompt":"The client authorises two hours of checks across the shard fleet.","question":"Which check settles it fastest?","options":["Query MachineLaunchRestriction on all shard hosts and diff against the baseline","Reboot every shard host and see what breaks","Re-run the intrusion on one host as a live test"],"correct":0,"why":"A read-only diff across the fleet proves the exposure scope in minutes; reboots and live exploitation create the very incidents you are scoping."},{"label":"STEP 3 OF 3 — recommend","prompt":"The diff shows five shard hosts with the wide ACL, two with activations from known tools, three with nothing.","question":"What does the report recommend?","options":["Restore the ACL on all five, monitor the two tool hosts, and schedule a purple-team replay","Restore only the confirmed host and close the rest","Restore nothing until the intrusion case closes"],"correct":0,"why":"Fix the class of exposure once, keep monitoring where benign tools overlap, and prove the fix with a replay — that is proportionate and complete."}]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });

  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)

      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");

  sev.textContent = META.severity.replace("_", " ");

  $("tb-scoreval").textContent = fmt1(S.score);

    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;

  /* buttons */
  var ex = curPos();

  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}
