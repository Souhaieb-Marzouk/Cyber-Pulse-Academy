<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.004 SSH — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--green);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 6px 30px rgba(0,0,0,.5)}

  .res-head{padding:18px}
  .term-out{max-height:260px}

  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.004","attackName":"SSH","objectType":"sub-technique","severity":"HARD","topicId":"t1021.004","batch":3,"title":"T1021.004 SSH — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":17,"passMark":70,"learn":["You will learn what T1021.004 — the SSH sub-technique of the T1021 Remote Services family in MITRE ATT&CK — covers, and why OpenSSH servers on TCP 22 are both the administrator's front door and a favourite lateral-movement path.","You will learn to read sshd_config directives such as PermitRootLogin, PasswordAuthentication, AllowGroups and Match, plus authorized_keys options like command= and no-port-forwarding, and to say in one line what each one blocks.","You will learn the daily work this sub-technique creates: SOC analysts triage 'Accepted publickey' and 'Failed password' lines in auth.log or secure, IR staff inventory ~/.ssh and agent sockets, and detection engineers watch authorized_keys writes and tunnel setup.","You will learn attacker moves: stealing private keys from ~/.ssh, hijacking a forwarded ssh-agent, opening -L, -R and -D tunnels, hopping through jump hosts with ProxyJump, and reusing ControlMaster master sessions.","You will learn defender answers: passphrase-protected keys, short-lived SSH certificates, disabled agent forwarding, SFTP-only service accounts and throttling — and how to explain all of it in plain B1 English."],"keywords":[{"theme":"Config & Identity","items":["PermitRootLogin prohibit-password","PasswordAuthentication no","AllowGroups ssh-login","Match + ForceCommand internal-sftp","authorized_keys command= option","X11Forwarding no"]},{"theme":"Telemetry & Forensic Artefacts","items":["auth.log 'Accepted publickey'","auth.log 'Failed password'","pam_unix session opened/closed pairs","~/.ssh/authorized_keys mtime","SSH_AUTH_SOCK agent sockets","known_hosts entries"]},{"theme":"Attacker Moves","items":["key theft from ~/.ssh","ssh-agent forwarding abuse","-L / -R / -D tunnels","ProxyJump through a jump host","ControlMaster session reuse"]},{"theme":"Hardening & Certificates","items":["short-lived SSH certificates","passphrase-protected keys","disabled agent forwarding","fail2ban throttling","source-pinned service logins"]}]}</script>

nels","ProxyJump through a jump host","ControlMaster session reuse"]},{"theme":"Hardening & Certificates","items":["short-lived SSH certificates","passphrase-protected keys","disabled agent forwarding","fail2ban throttling","source-pinned service logins"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Root's key still worked","summary":"Concept: prohibit-password keeps key logins open.","scenario":"After a Friday-night breach, Kestrel Freight's IR team reviews the sshd_config snapshot of db-core-fra-02. Global hardening is visible: PasswordAuthentication no, X11Forwarding no, AllowUsers a.weiss svc-backup. One line reads PermitRootLogin prohibit-password, and auth.log still shows 'Accepted publickey for root from 10[.]66[.]9[.]4'. The review board wants the exact reason root could log in at all.","question":"Which reading of the snapshot explains root's successful key login?","hint":"prohibit-password removes one authentication path, not all of them.","explanation":"PermitRootLogin prohibit-password blocks password authentication for root but still accepts key-based logons, so a stolen root key walks straight in; only PermitRootLogin no closes the door completely.\n\nThe near-misses each swap one detail: AllowUsers filters which users may try, it grants no root exception; PasswordAuthentication no removes passwords for everyone; Match blocks only override settings for the users they name, and none names root here.\n\nDefender view: audit tools that only check 'is PasswordAuthentication off' will certify this host while root keys stay live — check the PermitRootLogin value too.","study":"Study the four PermitRootLogin values: yes, no, prohibit-password, forced-commands-only.","options":["prohibit-password blocks root passwords but keys still work","AllowUsers quietly re-opens root access for the accounts listed","PasswordAuthentication no turns key logins on for root too","Match blocks switch PermitRootLogin back on by default"],"correct":0},{"id":"e02","type":"multi","title":"What the contractor key can and cannot do","summary":"Multi: three options that really restrict a key.","scenario":"Kestrel Freight's contractor t.novak needs to refresh backups on repo-fra-01. The platform team writes his public key into svc-backup's authorized_keys with extra options, and the security review asks which lines actually reduce what the key can do — and which only decorate it.","question":"Select the three key options that genuinely restrict this key:","hint":"Two of the five options add features or set values instead of taking anything away.","explanation":"no-port-forwarding kills tunnels, no-pty removes the interactive shell, and command=\"…\" pins every login to one script — those three reduce the key's reach.\n\nThe missed items: environment= only sets a variable and tunnel= grants a TUN device, so neither restricts anything; both were the decoys. On a breached host the pinned command can still be the weak point if the script itself is writable, so check its permissions during review.","study":"Study authorized_keys options: command=, no-pty, no-port-forwarding, no-agent-forwarding, restrict.","options":["no-port-forwarding blocks every tunnel the key could open","no-pty removes the interactive shell this key could start","command=\"/usr/local/bin/backup-snapshot\" pins the key to one script","environment=\"MAIL=/var/mail/relbot\" just sets one mail path","tunnel=\"0\" grants a TUN device to whoever holds the key"],"correct":[0,1,2]},{"id":"e03","type":"match","title":"Directive cheat-card","summary":"Match: five sshd_config lines to their effects.","scenario":"The platform team pins a laminated card next to the config terminal at Kestrel Freight. Each sshd_config line must carry a one-line meaning, because new engineers keep guessing what Match blocks and X11Forwarding actually do. Draft the five pairings for the card.","question":"Match each config line to the effect it produces:","hint":"Two lines close doors, two narrow who may enter, one pins an account to a tool.","explanation":"PermitRootLogin no closes every root session, PasswordAuthentication no accepts keys only, AllowGroups limits the logon right to one group, X11Forwarding no stops remote GUI channels, and ForceCommand internal-sftp inside a Match block pins the account to file transfers.\n\nThe card matters at 03:00: an analyst who confuses ForceCommand with a firewall rule will hunt the wrong layer for ten minutes, and one who reads AllowGroups as an encryption setting misses the identity control entirely.","study":"Study the sshd_config man page: Match blocks override global values per user.","pairs":[{"left":"PermitRootLogin no","right":"no root session can start at all"},{"left":"PasswordAuthentication no","right":"keys only — every password is refused"},{"left":"AllowGroups ssh-login","right":"the logon right shrinks to one group"},{"left":"X11Forwarding no","right":"remote GUI channels cannot open"},{"left":"Match User svc-backup + ForceCommand internal-sftp","right":"the account is pinned to file transfer"}]},{"id":"e04","type":"order","title":"One stolen laptop, two hosts","summary":"Order: the key-theft and agent-load chain.","scenario":"Public reporting documents intrusions that start with a stolen laptop rather than a password guess. Kestrel Freight replays such a chain in a purple-team drill: the operator never guesses a single password, yet ends up on db-core-fra-02 as a regular admin. Rebuild the five cards in the order the operator played them.","question":"Order the operator's five cards from first to last:","hint":"The stolen files tell the operator where the key works before anything connects.","explanation":"The operator reads the stolen ~/.ssh to learn targets, checks the key's reach, loads it into a local agent, rides ProxyJump through the edge gateway, and only then harvests the new host.\n\nAttacker view: no step looks loud — file reads, one agent, one clean key login — yet the chain crosses two trust zones; that is why ~/.ssh inventories and ProxyJump audit trails matter more than password alerts.\n\nDefender view: passphrase-protected keys and disabled agent forwarding break this chain at cards one and three, before any host is touched.","study":"Study key theft from ~/.ssh and ProxyJump chains in T1021.004 reporting.","items":["Read id_ed25519 and known_hosts from ~/.ssh on the stolen laptop","Match the key's fingerprint against the hosts listed in known_hosts","Load the stolen key into ssh-agent on the operator workstation","SSH with ProxyJump through edge-gw-fra-01 to db-core-fra-02","Harvest credentials and host keys from the fresh admin session"]},{"id":"e05","type":"fill","title":"Two log lines, one story","summary":"Fill: publickey, Failed and pam_unix wording.","scenario":"Kestrel Freight's triage card quotes auth.log lines verbatim, but the print shop dropped three words, leaving blanks. The card must teach the exact wording, because grep rules fail when 'publickey' and 'password' get mixed up. svc-backup's key login and a failed root attempt both appear on the card.","question":"Fill the three wording blanks from the bank:","hint":"One blank names the accepted method, one names the failure line, one names the session source.","explanation":"A key login writes 'Accepted publickey for …', a wrong password writes 'Failed password for …', and the session record comes from pam_unix(sshd:session) — 'session opened for user …'.\n\n'Invalid' belongs to lines for usernames that do not exist, and CRON marks scheduled jobs, so both blanks were decoys; exact wording is what grep keys on, and a rule written for the wrong word pages nobody.","study":"Study auth.log phrasing: Accepted publickey, Failed password, session opened by pam_unix.","text":"A key login writes 'Accepted ___ for svc-backup', a wrong password writes '___ password for root', and the session then logs '___(sshd:session): session opened for user svc-backup'.","blanks":["publickey","Failed","pam_unix"],"bank":["publickey","Failed","pam_unix","Invalid","CRON","sshd"]},{"id":"e06","type":"terminal","title":"Read the effective sshd config","summary":"Terminal: sshd -T on the gateway.","scenario":"During the review the board doubts the snapshot: files drift. From a shell already open on edge-gw-fra-01 you confirm the running daemon's real settings in one read-only command and paste the output into the ticket. You must not change anything — the gateway carries live sessions for every deploy.","question":"Run the read-only command that prints the effective sshd configuration:","hint":"sshd can print its parsed, effective settings; then filter for the root directive.","explanation":"sudo sshd -T parses the live configuration exactly as the daemon sees it, and grep -i permitrootlogin pulls the one line the board argues about — output that beats any file snapshot because drift cannot hide.\n\nThe traps: removing config or key material destroys the evidence the review needs, chmod 777 on sshd_config breaks the daemon and leaks secrets, and stopping sshd mid-review can lock live responders out. Keep the session read-only and let the tool do the reading.","study":"Study sshd -T effective configuration and why file snapshots drift.","prompt":"analyst@edge-gw-fra-01:~$","skill":"sshd-effective-config","knownTools":["sshd","grep","sudo","diff"],"expected":"sudo sshd -T | grep -i permitrootlogin","elements":[{"label":"the effective-config parse","any":["sshd -t"]},{"label":"the filter for the root directive","any":["grep -i permitrootlogin"]}],"forbidden":[{"any":["rm -rf","rm -f"],"why":"removing configuration or key material destroys the evidence the review needs"},{"any":["chmod 777"],"why":"world-writable config and key files break sshd and leak secrets"},{"any":["systemctl stop sshd","service ssh stop"],"why":"stopping sshd during the review can lock live responders out"}],"output":["permitrootlogin no","passwordauthentication no","pubkeyauthentication yes","x11forwarding no","allowgroups ssh-login"]},{"id":"e07","type":"logview","title":"The 02:14 key login","summary":"Logview: one accepted key, later password guesses.","scenario":"The overnight export of db-core-fra-02 sits in the panel. svc-backup's pull job runs at 02:14 from the backup subnet and is in the runbook; but the same address shows up again an hour later trying passwords for a.weiss, which no runbook explains. The panel mixes both stories on purpose, and the triage note must name them in one breath.","question":"Complete the triage note from the log panel:","hint":"Read the accepted line's method first, then follow the source address.","explanation":"The 02:14 acceptance is the documented backup pull, but 03:01 shows the same address failing passwords for a.weiss and root — credential guessing from a host that already holds a working key.\n\nThe missed items: the source is trusted for one narrow job, not as a whole subnet; and simply blocking the address would break the next backup, so containment belongs to the key review instead.\n\nAlarming-looks-benign check: one quiet 'Accepted publickey' line is exactly how this story starts.","study":"Study accepted-versus-failed pairing by source address in auth.log.","filterable":true,"log":{"header":["time","line"],"lines":["02:14:07 sshd[2141]: Accepted publickey for svc-backup from 10[.]82[.]5[.]61 port 51422 ssh2: ED25519 SHA256:9t2vKx","02:14:08 sshd[2141]: pam_unix(sshd:session): session opened for user svc-backup by (uid=0)","02:19:33 sshd[2141]: pam_unix(sshd:session): session closed for user svc-backup","03:01:12 sshd[2233]: Failed password for a.weiss from 10[.]82[.]5[.]61 port 51502 ssh2","03:01:14 sshd[2233]: Failed password for a.weiss from 10[.]82[.]5[.]61 port 51504 ssh2","03:01:16 sshd[2233]: Failed password for root from 10[.]82[.]5[.]61 port 51506 ssh2","03:01:18 sshd[2233]: Connection closed by authenticating user root 10[.]82[.]5[.]61 port 51506 [preauth]","03:05:40 CRON[2261]: pam_unix(cron:session): session opened for user svc-backup by (uid=0)"]},"widget":{"type":"fill","question":"Fill the triage sentence about the 02:14 and 03:01 lines:","text":"The 02:14 line accepted an ___ login for svc-backup, and by 03:01 the same source ___ had turned to password guessing, so the source address is no longer ___.","blanks":["publickey","10[.]82[.]5[.]61","trusted"],"bank":["publickey","10[.]82[.]5[.]61","trusted","password","10[.]44[.]9[.]13","blocked"]}},{"id":"e08","type":"decision","title":"The key line during freeze","summary":"Decision: capture, attribute, contain.","scenario":"08:12 — the config monitor flags a new line in a.weiss's authorized_keys on repo-fra-01: 'ssh-ed25519 AAAA…mQ2 rel-bot@ci-runner-fra-04'. No change ticket covers it, and the change freeze runs until Friday. a.weiss is on leave until Monday. Work the three steps; each locks when confirmed.","question":"Work the three decision steps in order:","hint":"Capture before you touch; attribute before you block.","explanation":"Capture, attribute, contain: the order keeps evidence intact, separates 'used' from 'meant harm', and aims containment at the exact mechanism.\n\nThe traps: rebooting or deleting first erases the timeline; reading the CI login as proof of compromise overstates what one accepted line can say; and waiting for a leave-bound account leaves a working key in place over the weekend.","study":"Study authorized_keys change handling: preserve, attribute, then remove.","steps":[{"label":"STEP 1 OF 3 — capture","prompt":"The monitor shows the new key line and an mtime of 08:09 on authorized_keys.","question":"What do you do first?","options":["Copy the key line and fingerprint, then preserve the file's mtime","Delete the line so it cannot be used this morning","Reboot repo-fra-01 to drop any live session"],"correct":0,"why":"The line, its fingerprint and the mtime are the evidence; deleting or rebooting first destroys context you will want in the report."},{"label":"STEP 2 OF 3 — attribute","prompt":"auth.log shows 'Accepted publickey for a.weiss from 10[.]8[.]40[.]12' at 08:14 — the CI runner subnet.","question":"What does the log evidence establish?","options":["The key was used, but intent still depends on the CI job's owner","The key proves the CI runner was compromised","The login proves a.weiss came in from home"],"correct":0,"why":"A successful key login from the CI subnet names the path, not the purpose; the deploy job's schedule and owner decide whether the use was legitimate."},{"label":"STEP 3 OF 3 — contain","prompt":"The CI owner confirms no job needed a.weiss this morning.","question":"Which containment fits the facts?","options":["Remove the key line, rotate a.weiss's keys, and review the CI job","Block the whole CI subnet at the firewall for a week","Wait for a.weiss to return on Monday and ask"],"correct":0,"why":"The unauthorised key is the problem, so remove it, rotate the affected identity, and fix the CI path — blocking a shared subnet punishes every pipeline at once."}]},{"id":"e09","type":"mcq","title":"The 400 failures that weren't an attack","summary":"MCQ: noise that trips the ban threshold.","scenario":"fail2ban banned ci-runner-fra-04 overnight after 400 'Failed password for root' lines against db-core-fra-02 within nine minutes. The morning queue wants to treat the CI runner as compromised. The backup job on that runner runs at 01:55 nightly, and a config error yesterday replaced its key with an expired one; the job retried until the wrapper crashed at 02:04 and was patched at 07:30.","question":"Which single detail best supports treating the burst as operational noise?","hint":"Look for the detail that explains both the timing and the sudden stop.","explanation":"The regular nightly minute plus a stop right after the wrapper was patched point to the misconfigured job; the alarming look — root, high volume, a ban — is just the wrapper retrying a dead password.\n\nThe near-misses describe why the burst alarmed, not what it was; volume and target account say nothing about intent.\n\nAlarming-looks-benign works both ways: the same shape from a new subnet with no job owner would flip the verdict to intrusion, so the job inventory decides, not the volume.","study":"Study benign-looks-alarming patterns: retry loops with fixed schedules.","options":["Failures hit one fixed minute nightly and stopped after patching","The traffic targets root, the single most valuable account on the host","The volume crosses the fail2ban threshold within nine minutes","The source sits just outside the database management subnet"],"correct":0},{"id":"e10","type":"match","title":"Artefact or accident?","summary":"Match: five artefacts to first readings.","scenario":"The IR trainee empties a folder onto Kestrel Freight's war-room table: config metadata, log lines, a socket listing. The senior asks for a first reading of each item before anyone touches a host. Five artefacts, five one-line readings — the folder mixes genuine signals with background noise on purpose.","question":"Match each artefact to the reading it deserves:","hint":"One item matches the runbook, one is a wall of noise, two need owner checks.","explanation":"The mtime newer than the ticket reads as possible persistence, the unknown-host known_hosts row as contact with an unmanaged host, the socket as a reused master session, the svc-relbot acceptance as runbook traffic, and the no-CRON session line as an unexplained session.\n\nMissed readings cost time: treating the CI acceptance as an intrusion burns the deploy team's morning, while waving away the mtime change loses the persistence lead entirely.","study":"Study first-pass triage: separate runbook noise, unexplained items and persistence markers.","pairs":[{"left":"authorized_keys mtime newer than the last change ticket","right":"possible key persistence — verify the ticket"},{"left":"known_hosts row for backup-nas[.]home-arpa","right":"contact with a host outside the CMDB"},{"left":"~/.ssh/cm-svc-relbot@repo-fra-01:22 socket present","right":"a multiplexed master session is being reused"},{"left":"'Accepted publickey for svc-relbot from 10[.]8[.]40[.]12' at 01:55","right":"matches the documented CI pull window"},{"left":"'session opened for user svc-relbot' with no CRON pair","right":"unexplained session — ask for the job owner"}]},{"id":"e11","type":"fill","title":"The baseline sentence","summary":"Fill: no, no and a Match block.","scenario":"After the drill, Kestrel Freight writes its SSH baseline. The reviewer strikes one adjective from every sentence so the final card states settings exactly: values, not moods. Three blanks remain where the values belong, and the bank still holds the reviewer's old soft words to trip anyone who skims.","question":"Fill the three baseline values from the bank:","hint":"Two blanks take the same short value; the third names a config block.","explanation":"PermitRootLogin no, PasswordAuthentication no and a Match block that pins svc-backup to internal-sftp make up the core: no root, no passwords, service accounts limited to one command.\n\n'without-password' is the near-miss — it still lets root keys in, which the root-key finding just closed; 'yes' and 'optional' are the old soft words the reviewer struck, and either one silently re-opens the doors this baseline exists to shut.","study":"Study the SSH baseline trio: root off, passwords off, service accounts pinned.","text":"The baseline sets PermitRootLogin to ___, keeps PasswordAuthentication at ___ so stolen passwords are useless, and adds a ___ block that pins svc-backup to internal-sftp.","blanks":["no","no","Match"],"bank":["no","Match","yes","without-password","optional"]},{"id":"e12","type":"logview","title":"Certificates on the gateway","summary":"Logview: two cert logins, one plain key.","scenario":"Kestrel Freight moved admins to short-lived SSH certificates in February. The March 05 export from edge-gw-fra-01 shows the new certificate lines, one leftover plain-key service login, and the usual internet noise against port 22. The helpdesk still cannot tell certificate lines from plain key lines, so you annotate the export for them.","question":"Annotate the export for the helpdesk:","hint":"The certificate lines carry an ID and a serial; the plain key line does not.","explanation":"Both certificate lines print 'ED25519-CERT' with an ID, a serial and the signing CA; the svc-relbot line is a plain public key, and the oracle lines are failed guesses that never authenticated.\n\nMissing item check: the 02:32 disconnect is m.kovac leaving, not a second login. Certificates give revocation and short lifetimes — the plain svc-relbot key is the one that needs rotation planning.","study":"Study OpenSSH certificate lines: ID, serial and CA fields in auth.log.","filterable":true,"log":{"header":["time","line"],"lines":["01:12:44 sshd[8801]: Accepted publickey for a.weiss from 10[.]44[.]12[.]7 port 49112 ssh2: ED25519-CERT ID a.weiss-fra-2025 (serial 41) CA ED25519 SHA256:mK2xQ","01:12:45 sshd[8801]: pam_unix(sshd:session): session opened for user a.weiss by (uid=0)","01:47:03 sshd[8844]: Invalid user oracle from 203[.]0[.]113[.]44 port 40012","01:47:05 sshd[8844]: Failed password for invalid user oracle from 203[.]0[.]113[.]44 port 40012 ssh2","02:03:19 sshd[8890]: Accepted publickey for svc-relbot from 10[.]8[.]40[.]12 port 55210 ssh2: ED25519 SHA256:Qz8pL","02:31:55 sshd[8901]: Accepted publickey for m.kovac from 10[.]44[.]12[.]7 port 49150 ssh2: ED25519-CERT ID m.kovac-fra-2025 (serial 42) CA ED25519 SHA256:mK2xQ","02:32:01 sshd[8901]: Received disconnect from 10[.]44[.]12[.]7 port 49150:11: disconnected by user"]},"widget":{"type":"multi","question":"Select the two lines that prove certificate-based logons:","options":["the 01:12 accepted line for a.weiss, ID a.weiss-fra-2025, serial 41","the 02:31 accepted line for m.kovac, ID m.kovac-fra-2025, serial 42","the 02:03 accepted line for svc-relbot with a plain ED25519 key","the 01:47 invalid-user line for oracle"],"correct":[0,1]}},{"id":"e13","type":"order","title":"Rollout without breaking the nightly pull","summary":"Order: inventory, baseline, certs, forwarding, alerts.","scenario":"The board approves the baseline and one rule: the 01:55 backup pull from ci-runner-fra-04 must keep working through every step. The platform team orders five changes so each builds on the last and the pull survives. Draft the order for the change calendar before Friday's window opens.","question":"Order the five rollout steps from first to last:","hint":"Inventory before identity changes; alerting after the pattern exists.","explanation":"First inventory keys so nothing is orphaned, then ship the server baseline, then move flows to certificates, then close client-side forwarding, then alert on key-file writes — testing rides along at each gate.\n\nDefender view: alerts before the baseline would page on every legitimate change, and certificates before the inventory strands the backup pull's key mid-flight. The pull keeps working because its job owner is in the loop from step one.","study":"Study change-safe SSH hardening: inventory, baseline, identity, forwarding, monitoring.","items":["Inventory every key and principal in ~/.ssh across the fleet","Ship the sshd_config baseline: root off, passwords off, AllowGroups","Move admin and deploy flows to short-lived SSH certificates","Disable agent and X11 forwarding in the managed client profile","Alert on authorized_keys writes outside the change system"]},{"id":"e14","type":"decision","title":"Outbound SSH from the database","summary":"Decision: classify, verify, contain.","scenario":"16:40 — the flow monitor flags db-core-fra-02 initiating TCP 22 to 198[.]51[.]100[.]77, an address with no business record. Databases at Kestrel Freight never open SSH outbound. The session has been up for 40 minutes and carries steady traffic. Work the three steps in order.","question":"Move through the three decisions in sequence, selecting one answer at each:","hint":"Classify the move before choosing the counter-move.","explanation":"Classify from what the host is for, verify with read-only socket-to-PID work, contain the exact mechanism.\n\nAttacker view: a reverse tunnel needs only one low-privilege shell and one outbound port — the cheap half of T1021.004. Defender view: 'databases never open SSH outbound' is the kind of one-line baseline that turns this flow into a same-hour catch.","study":"Study -R remote forwards and socket-to-PID attribution with ss.","steps":[{"label":"STEP 1 OF 3 — classify","prompt":"Outbound SSH from a database host to an unrecorded external address.","question":"What does this pattern most likely show?","options":["An attacker tunneling back out from the database host","A database replicating to a partner over SSH","A monitoring agent updating its certificates"],"correct":0,"why":"Databases hold no reason to start SSH outbound; a steady 40-minute session to an unrecorded address fits a reverse tunnel far better than replication or agent traffic."},{"label":"STEP 2 OF 3 — verify","prompt":"You can run read-only checks from the bastion while the session stays alive.","question":"Which check pins down the process behind the socket?","options":["Match the socket to a PID with ss and inspect its open files","Restart sshd so the tunnel drops and the attacker leaves","Block the external address and watch what breaks"],"correct":0,"why":"The PID behind the socket, its user and its open files name the mechanism; restarting or blocking destroys the live picture before it is captured."},{"label":"STEP 3 OF 3 — contain","prompt":"The PID is a user-run ssh -R on an account that should never hold a shell.","question":"Which containment fits best?","options":["Kill the tunnel process, preserve its command line, and cut the account's logon right","Wipe the host and reimage it tonight","Change the database service password and close the ticket"],"correct":0,"why":"The tunnel is the active path, so stop that process after capturing it, then remove the logon right that made it possible; reimaging is disproportionate, and a password change leaves the shell and the key in place."}]},{"id":"e15","type":"mcq","title":"The nightly line that isn't nightly","summary":"MCQ: one field breaks the routine story.","scenario":"Every night at 01:55, auth.log on repo-fra-01 shows 'Accepted publickey for svc-relbot from 10[.]8[.]40[.]12' — the CI pull, page two of the runbook. On Thursday the same minute shows 'Accepted publickey for svc-relbot' again, same account, same method, but from 10[.]44[.]12[.]7. The queue auto-closed it as routine within a second.","question":"Why is Thursday's line not the routine pull?","hint":"Compare the one field that the runbook pins down.","explanation":"The runbook pins the pull to the CI runner range; Thursday's line keeps account and method but swaps the source, and that single field is the whole signal.\n\nThe near-misses all quote the parts that stayed normal — shape, account, method — which is exactly why the auto-close fired. Alarming-looks-benign: a correct-looking line from the wrong subnet is the classic quiet pivot.","study":"Study source-aware SSH detections: pin service logins to their subnet.","options":["The source is the admin VPN subnet, not the CI runner range","The record arrives in auth.log in the same shape as every pull","The account name matches the documented service account","The method is publickey, exactly like the documented pull"],"correct":0},{"id":"e16","type":"terminal","title":"Find forwarded agent sockets","summary":"Terminal: hunt agent sockets in /tmp.","scenario":"The IR lead suspects a forwarded ssh-agent was left on db-core-fra-02 after this week's maintenance logins. From the bastion you drop onto the host and list the live agent sockets under /tmp, read-only, before the next standing meeting. Do not remove anything — the sockets may still be attached to live sessions.","question":"Run the read-only command that lists agent sockets under /tmp:","hint":"OpenSSH names every forwarded socket agent.<pid> under a random /tmp directory.","explanation":"find /tmp -name 'agent.*' lists the per-connection agent sockets OpenSSH leaves under randomised /tmp/ssh-XXXXXX directories; each one can be hijacked by the local user to sign the next hop without ever holding the key.\n\nThe traps: removing the sockets or killing sshd destroys the evidence and the sessions attached to it. Each socket maps to an agent-forwarded session — pair the PID with w or ss to name the owner.","study":"Study ssh-agent forwarding abuse and socket locations in /tmp/ssh-*.","prompt":"analyst@db-core-fra-02:~$","skill":"agent-socket-hunt","knownTools":["find","ls","ss","stat"],"expected":"find /tmp -name 'agent.*' 2>/dev/null","elements":[{"label":"the find on /tmp","any":["find /tmp"]},{"label":"the agent socket name pattern","any":["agent.*"]}],"forbidden":[{"any":["rm -rf","rm -f"],"why":"deleting sockets or their directories destroys live evidence and can break running sessions"},{"any":["kill -9","pkill sshd"],"why":"killing sshd or sessions mid-investigation cuts the audit trail you are building"}],"output":["/tmp/ssh-Xq7f2K1234/agent.2231","/tmp/ssh-Qb8nR0912/agent.4180","/tmp/ssh-Vt4mP0731/agent.5512"]},{"id":"e17","type":"fill","title":"Three forwards, three names","summary":"Fill: local, remote and dynamic tunnels.","scenario":"The network team keeps mixing up SSH forwarding names in incident notes, so Kestrel Freight's wiki page gets one summary sentence. The wording must match the man page, because the firewall reviewers key on those three names when they approve or deny tunnel requests each quarter.","question":"Fill the three forwarding names from the bank:","hint":"-L pulls a port home, -R pushes one back, -D chains everything.","explanation":"A local forward (-L) pulls a remote port to your machine, a remote forward (-R) pushes a listener back onto the server, and a dynamic proxy (-D) builds a SOCKS endpoint that any client can chain through.\n\n'Static' and 'TLS' are the decoys — neither names an SSH forwarding mode; -R deserves the sharpest eye because it opens a listener inside your network.","study":"Study SSH forwarding: -L local, -R remote, -D dynamic SOCKS.","text":"An SSH ___ forward (-L) pulls a remote port to your machine, a ___ forward (-R) pushes a listener back onto the server, and a ___ proxy (-D) chains any client through the tunnel.","blanks":["local","remote","dynamic"],"bank":["local","remote","dynamic","static","TLS","kernel"]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){

      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);

}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';

        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }

    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);

}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;

  for(var z = 0; z < n; z++){

  }

  });

    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });

        e.preventDefault(); zz.classList.remove("dragover");

        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }

        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();

function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';

    list.innerHTML = "";

      var li = document.createElement("li");

      li.setAttribute("data-pos", String(pos));

      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";

        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);

          if(dir < 0 || dir >= ans.seq.length) return;

        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}
