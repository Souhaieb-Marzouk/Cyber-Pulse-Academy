.items{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.it{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.it .i{font-weight:800;white-space:nowrap}
.it .i.ok{color:var(--state-correct)} .it .i.bad{color:var(--state-incorrect)} .it .i.miss{color:var(--state-skipped)} .it .i.danger{color:var(--state-incorrect)}
.it .w{color:var(--text-secondary)}
.expl{font-size:14.5px;border-top:1px dashed var(--border);padding-top:10px;margin-top:10px}
.expl p{margin:6px 0}
.copyblk{position:relative;margin:8px 0}
.copyblk pre{background:var(--bg-deep);border:1px solid var(--border-strong);border-radius:var(--radius);padding:12px 14px;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;white-space:pre-wrap;word-break:break-word}
/* ---------- paused veil ---------- */
.veil{position:absolute;inset:0;background:var(--veil-bg);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:40;border-radius:var(--radius)}
.veil-card{text-align:center;padding:30px}
.veil-card .pi{font-size:44px;color:var(--state-paused)}
.veil-card .pw{color:var(--state-paused);font-weight:800;font-size:17px;letter-spacing:.05em}
.veil-card .ps{color:var(--text-secondary);font-size:13.5px;margin-top:6px}
/* ---------- review skipped ---------- */
.rev-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface-2);padding:12px 14px;margin:10px 0}
.rev-item .t{flex:1}
.rev-item .t b{display:block}
.rev-item .t span{color:var(--text-secondary);font-size:13.5px}
.rev-clock{font-size:13.5px;color:var(--text-secondary);margin:2px 0 10px}
.rev-clock b{color:var(--text-primary)}
/* ---------- results ---------- */
.res-hero{padding:26px 22px;text-align:center;position:relative;overflow:hidden}
.res-hero .big{font-size:52px;font-weight:800;margin:6px 0}
.res-hero.pass{border-color:var(--state-correct)}
.res-hero.pass:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 50% 0%,var(--tint-green-12),transparent);pointer-events:none}
.res-hero.fail{border-color:var(--state-incorrect)}
.res-hero .lbl{font-size:20px;font-weight:800;letter-spacing:.12em}
.res-hero.pass .lbl{color:var(--state-correct)} .res-hero.fail .lbl{color:var(--state-incorrect)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:13px;color:var(--text-secondary)}
.stat.ok .v{color:var(--state-correct)} .stat.part .v{color:var(--state-partial)} .stat.bad .v{color:var(--state-incorrect)} .stat.skip .v{color:var(--state-skipped)} .stat.pause .v{color:var(--state-paused)}
.res-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res-row{display:flex;gap:10px;align-items:baseline;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.res-row .st{font-weight:700;white-space:nowrap}
.res-row .st.ok{color:var(--state-correct)} .res-row .st.part{color:var(--state-partial)} .res-row .st.bad{color:var(--state-incorrect)} .res-row .st.skip{color:var(--state-skipped)}
.res-row .cr{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)}
.center{text-align:center}
@media (max-width:720px){
  .xhead-in{gap:6px 10px}
  .mrow{grid-template-columns:1fr}
  .intro-title{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .prog-fill:after{animation:none}
  *{transition:none!important}
}

<script>
"use strict";
var EXAM = {"severity":"EXTREMELY HARD","attckId":"T1590.004","attckName":"Network Topology","intro":{"learn":["<p>Welcome. This exam drills one small part of the <b>MITRE ATT&amp;CK<\/b> framework: the Sub-Technique <b>T1590.004 — Gather Victim Network Information: Network Topology<\/b>. ATT&amp;CK is a public catalogue of adversary behaviour. A sub-technique is a specialised child of a broader technique: the parent T1590 covers information gathering about a victim's network, and T1590.004 covers one slice of it — the network topology. That means the physical and logical arrangement of a network: which segments exist, where the external-facing edge ends, what sits inside, and how gateways and routers link it all together. It belongs to the Reconnaissance tactic (TA0043) and runs on the PRE platform — the pre-attack phase, before the adversary touches your systems.<\/p>","<p>You will meet this sub-technique in real daily work. Triage analysts see its traces in a SIEM such as CoreSight: slow subnet sweeps, odd route changes, portal logins that seem to follow a map. Threat-intel analysts read reports in which G1045 Salt Typhoon used configuration files from exploited network devices to discover upstream and downstream segments, in which mapped data was later shared or sold (the G0069 MuddyWater pattern), and in which AI-orchestrated campaigns such as C0062 mapped a complete topology in hours. Detection engineers tune the DET0819 strategy and its analytic AN1951, which is famously noisy. Risk and GRC teams ask a simpler question: how much of our layout can an outsider learn today?<\/p>","<p>The sixteen exercises put you in the senior seat at Solstice Media Group, a fictional broadcaster, with analysts Nadia Rahim and Chris Doyle. You will weigh conflicting evidence — a leaked map against live routing data — decide what to commit to under stakeholder pressure, choose evidence-preserving actions over costly ones, and resist the comfortable answer when the trusted source is the outdated one. Expect several correct answers that say <i>gather more evidence<\/i> or <i>escalate<\/i>: knowing when that is the senior move is the skill being graded.<\/p>","<p>Why it matters: an accurate map is the adversary's cheapest weapon. It turns a blind scan into a targeted plan and feeds staging (T1583/T1584) and first access (T1133). You cannot stop someone from looking — M1056 Pre-compromise makes that explicit — but you can shrink what is visible, detect the looking, and make every decision survive scrutiny. Mastering this exam protects exactly that.<\/p>"],"keywords":[{"theme":"Technique identity","items":["T1590.004","Network Topology","Reconnaissance","Gather Victim Network Information","TA0043"]},{"theme":"Collection vectors","items":["T1595","T1598","T1594","T1596","T1593"]},{"theme":"Next stages and staging","items":["T1583","T1584","T1133","M1056"]},{"theme":"Real campaigns","items":["C0062","G1045","G0069","G1016","G1017"]},{"theme":"Detection and defence","items":["DET0819","AN1951","false-positive rate","CoreSight"]}]},"exercises":[{"id":"e01","type":"blank","title":"Source of truth on trial: CMDB map vs live routing","scenario":"<p>Ticket #54107, 09:15. An anonymous paste-site post claims to show the internal layout of Solstice Media Group. CISO Renata Kovac wants a one-paragraph verdict by 09:30. Chris Doyle points at the CMDB: the diagram is our system of record. Nadia Rahim checks: the diagram was last reviewed in 2019, its owner left the company in 2021, and the partner-feed DMZ is missing from it entirely. This morning's routing snapshot from SM-CORE-RTR-01 shows a static route into that DMZ which no document contains.<\/p><p>She drafts the verdict note. Complete it.<\/p>","artefacts":[{"label":"CMDB diagram register (excerpt)","kind":"table","head":["Field","Value"],"rows":[["Diagram","SM-HQ-logical-v3"],["Last reviewed","2019-11-04"],["Segments shown","Core 172[.]26[.]10[.]0/24; Broadcast 172[.]26[.]20[.]0/24; North Studio 172[.]26[.]30[.]0/24"],["Partner-feed DMZ 172[.]26[.]40[.]0/24","not present"],["Owner","Network team (left the company 2021)"]]},{"label":"CoreSight — routing change events, this morning","kind":"logview","body":"2025-05-14T06:02:11Z host=SM-CORE-RTR-01 event=static-route-add dst=172[.]26[.]40[.]0/24 via=172[.]26[.]20[.]5 user=svc_netops table=1002\n2025-05-14T06:02:12Z host=SM-CORE-RTR-01 event=config-save revision=8841\n2025-05-14T06:15:04Z host=CoreSight job=asset-reconcile status=completed mismatches=3\n2025-05-14T06:15:40Z host=CoreSight job=license-sweep status=completed findings=0"},{"label":"Paste-site post (captured)","kind":"text","body":"solstice media group hq layout: core /24, broadcast vlan /24, studio /24 behind its own gateway. dmz sits behind the same core. more segments available if the price is right. <i>[no timestamp, no author]<\/i>"},{"label":"Facilities notice (background)","kind":"text","body":"Badge-reader firmware update window Friday 22:00-23:00, lobby doors on manual hold. No network impact expected. — Facilities"}],"question":"Complete the verdict note: enter one term for each blank.","hint":"Constraint to keep in mind: an artefact with no review date and no current owner cannot outrank data captured this morning.","explanation":"<p>Live routing data captured this morning beats a diagram nobody has reviewed since 2019. The CMDB has no owner and misses a whole segment, so calling it outdated is generous and system of record is wrong this week. The paste post carries no timestamp, so it can be neither confirmed nor denied — it is context, not evidence. The behaviour under review is topology reconnaissance: T1590.004, a Sub-Technique of T1590, under the Reconnaissance tactic, on the PRE platform. Trusting the CMDB automatically is the widely used best practice that fails here: documentation only wins when it is reconciled against the wire.<\/p><p><b>Study this:<\/b> T1590.004 Network Topology — why live routing and configuration state must be reconciled against documented topology before any impact claim.<\/p>","blanks":[{"label":"Authoritative source for the impact assessment","accept":["live routing table","the live routing table","routing table","the routing table","routing snapshot","the routing snapshot","router snapshot"],"why":"Data read off SM-CORE-RTR-01 this morning is current and testable; the diagram is neither."},{"label":"Status of the 2019 CMDB diagram","accept":["outdated","stale","unverified","obsolete","out of date","out-of-date","not current"],"why":"Unreviewed since 2019, owner gone, and contradicted by live routing — it cannot be treated as current."},{"label":"ATT&CK Sub-Technique under review","accept":["t1590.004","t1590 004"],"why":"Mapping segments and gateways is Gather Victim Network Information: Network Topology."},{"label":"Tactic","accept":["reconnaissance","recon"],"why":"Information gathering before any intrusion attempt sits in Reconnaissance (TA0043), platform PRE."}],"bank":["live routing table","outdated","T1590.004","Reconnaissance","Initial Access","the 2019 diagram"]},{"id":"e02","type":"steps","title":"Gist or gate? Leaked map vs live probing","scenario":"<p>Ticket #54118, 11:00. A former Solstice network engineer, D. Marek, keeps a public gist titled home lab notes. The shared snapshot contains what looks like a near-current Solstice map: North Studio behind SM-BR-GW-02, the partner-feed DMZ, VLAN names. No commit dates are visible in the snapshot.<\/p><p>CoreSight is logging a low-and-slow probe of the HQ core range from hosting-provider address 45[.]155[.]204[.]71: one SYN per host, six hours, no payload. Chris Doyle notes the probe order matches the gist, host for host.<\/p><p>CISO Renata Kovac: in fifteen minutes I need to know if the attacker is working from Marek's map — if yes, Legal joins. Broadcast Ops adds that North Studio is live at 20:00.<\/p>","artefacts":[{"label":"CoreSight — probe timeline (HQ core range)","kind":"logview","body":"2025-05-14T09:10:02Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]12 proto=tcp flags=SYN note=single packet\n2025-05-14T09:10:41Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]13 proto=tcp flags=SYN note=single packet\n2025-05-14T09:11:20Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]14 proto=tcp flags=SYN note=single packet\n2025-05-14T09:12:02Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]15 proto=tcp flags=SYN note=single packet\n2025-05-14T09:12:39Z host=CoreSight rule=low-slow-sweep score=41 confidence=low"},{"label":"Gist snapshot (captured)","kind":"text","body":"home lab notes — d. marek (public gist)\n- HQ core: 172[.]26[.]10[.]0/24\n- broadcast VLAN: 172[.]26[.]20[.]0/24, label BCAST-PROD\n- North Studio: 172[.]26[.]30[.]0/24 behind SM-BR-GW-02\n- partner-feed DMZ: 172[.]26[.]40[.]0/24, same core egress\n(no commit dates visible in the shared snapshot)"},{"label":"War-room chat","kind":"chat","body":["Renata Kovac (CISO): 15 minutes — is the attacker working from Marek's map? If yes, Legal joins.","Tom Barry (Broadcast Ops): studio is live at 20:00, do not touch the studio path.","Chris Doyle: probe order matches the gist host for host. Too neat for a random sweep."]},{"label":"D. Marek public profile (background)","kind":"text","body":"Public CV page: Network Engineer, Solstice Media Group, 2016-2021. CCNA. Hobbies: home labs and studio lighting rigs. — unrelated to today's routing state"}],"question":"Walk the three decision points in order.","hint":"Constraint to keep in mind: the gist snapshot you hold carries no commit dates, so current is an inference, not a fact.","explanation":"<p>Every step chooses evidence over reflex. Correlating first costs nothing and tests the cheapest hypothesis; isolating the studio gateway would pay a real outage for a device the probes never touch. The extra probed range proves the actor knows more than the gist alone can teach — one leak is rarely the whole exposure. And the sentence Legal can defend separates observation from inference: a former employee's map appears to be in use, exposure is likely but unconfirmed, collection continues. Naming Marek as a suspect, claiming no exposure, or declaring a breach each outrun the artefacts.<\/p><p><b>Study this:<\/b> T1590.004 exposure plus Active Scanning (T1595) — correlate leaks against live probing before committing to a story.<\/p>","steps":[{"question":"What do you commit to first while the CISO waits?","options":[{"t":"Isolate SM-BR-GW-02 now and start forensics","why":"A costly outage on a device the probes never target; nothing yet justifies it."},{"t":"Treat the gist as unverified and correlate the probe ordering against it","correct":true,"why":"Cheapest, fastest, evidence-first: the ordering either matches or it does not."},{"t":"Message Marek and ask him to delete the gist","why":"Does not answer whether a copy is already in use, and may tip off the actor."},{"t":"Block 45[.]155[.]204[.]71 at the edge and declare containment","why":"One rented address; blocking hides the probe without answering the map question."}],"advance":"<p>Nadia pulls the probe ordering: it matches the gist closely — but one probed range, 172[.]26[.]35[.]0/24, appears in neither the gist nor the CMDB. The CISO pings again.<\/p>"},{"question":"The probes also touch 172[.]26[.]35[.]0/24, which is in neither the gist nor the CMDB. What is the strongest reading?","options":[{"t":"The gist is confirmed fake because it misses a range","why":"A fake would not predict the ordering; a missing range weakens nothing that strongly."},{"t":"The 35 range is a CoreSight parsing error; wait it out","why":"Possible, but unverified — waiting without checking is not analysis."},{"t":"The actor has at least one source beyond the gist; map exposure is wider than one leak","correct":true,"why":"Knowledge of a range absent from both known sources implies another source or inside knowledge."},{"t":"The actor is sweeping addresses at random","why":"Random sweeps do not follow a document's ordering host for host."}],"advance":"<p>Chris checks the 35 range: an abandoned lab segment, physically dismantled in 2022, still routed on paper. Legal joins the call and asks what can be said on the record.<\/p>"},{"question":"Legal needs one sentence for the record. Which survives scrutiny?","options":[{"t":"We confirm the gist is the attacker's source and Marek is under investigation","why":"Unverified and names a person without proof — a legal risk, not an analysis."},{"t":"A former employee's map appears to be in use for recon; exposure is likely but unconfirmed, and evidence collection continues","correct":true,"why":"Separates what is observed from what is inferred — the only formulation that cannot collapse under questioning."},{"t":"No exposure exists because the probed hosts answered nothing","why":"Topology recon succeeds without any host answering; silence maps a layout just fine."},{"t":"We were breached by a state actor using the leaked map","why":"No attribution evidence exists, and PRE-phase recon is not a breach."}],"advance":"<p>Nadia sends the sentence at 11:14. Legal accepts the wording without a single change; evidence collection continues on the probed ranges, and the gist snapshot is filed as a corroborating artefact.<\/p>"}]},{"id":"e03","type":"multi","title":"Seized device config: upstream and downstream discovery","scenario":"<p>Ticket #54231. TransAlpine Carrier, Solstice's upstream transit provider, sends a formal notice: a device seized in a law-enforcement action held configuration files used, in the manner recorded for G1045 Salt Typhoon, to discover upstream and downstream network segments. The extract names Solstice's transit handoff and a downstream studio gateway. Chris Doyle flags two problems: the extract lists a management segment, 172[.]26[.]29[.]0/24, that appears nowhere in the CMDB, and the notice's incident date (March) does not match what the carrier first said (January). The partner SLA demands an acknowledgement within four hours.<\/p>","artefacts":[{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"G1045 Salt Typhoon has used configuration files from exploited network devices to help discover upstream and downstream network segments."},{"label":"Seized device config extract","kind":"code","body":"interface Tunnel11\n description TRANSIT-HANDOFF-TO-SOLSTICE-MEDIA\n ip route 172[.]26[.]30[.]0 255[.]255[.]255[.]0 172[.]26[.]40[.]5 name SOLSTICE-STUDIO\n ip route 172[.]26[.]29[.]0 255[.]255[.]255[.]128 172[.]26[.]40[.]6 name SOLSTICE-STUDIO-MGMT\n snmp-server community transalpine-readonly RO\n banner motd #TransAlpine NOC managed device - authorised use only#\n! last full config archive: 2022 (SNMP line predates current policy)"},{"label":"CoreSight — search for the unknown segment","kind":"logview","body":"2025-05-14T07:41:02Z analyst=c.doyle query=172[.]26[.]29[.]0/24 result=0 flows in retention window\n2025-05-14T07:41:03Z analyst=c.doyle query=SM-BR-GW-02 mgmt-interface result=1 heartbeat only, 30-day retention\n2025-05-14T07:41:05Z note=segment 172[.]26[.]29[.]0/24 absent from CMDB v2024-09 export"},{"label":"Carrier correspondence","kind":"chat","body":["M. Aalto (TransAlpine NOC): device seized in a law-enforcement action; extract shared under the disclosure agreement. The notice says March; our first statement said January — the police report is still pending.","Renata Kovac (CISO): four hours to acknowledge. What do we say?","Chris Doyle: the 29 segment is not in our CMDB and I cannot find a single flow for it. That is either a ghost or a gap."]},{"label":"Studio Ops notice (background)","kind":"text","body":"North Studio catering: cold-chain delivery rerouted 14:00 during the studio upgrade. No impact on broadcast or IT. — Studio Ops"}],"question":"Select the THREE conclusions the artefacts actually support.","hint":"Constraint to keep in mind: zero flows for the 29 segment is a retention question — the window may simply be too short.","explanation":"<p>Three conclusions survive. The behaviour matches the G1045 Salt Typhoon entry: configuration files from exploited devices mapping upstream and downstream segments. The unknown 29 segment must be verified on the wire rather than believed or dismissed — it exists in an external source but not in the inventory, and the retention window is only 30 days. And the pattern is PRE-phase topology reconnaissance aimed at the layout, not at hosts. The others overreach: a date mismatch is a confidence problem, not proof of forgery; attribution belongs to the investigating authorities, not to a victim's report; and the SNMP string is 2022-era carrier noise that says nothing about scanning of Solstice.<\/p><p><b>Study this:<\/b> G1045 Salt Typhoon — configuration files from exploited network devices used to discover upstream and downstream network segments.<\/p>","options":[{"t":"The extract matches G1045 Salt Typhoon's documented use of device configurations to discover upstream and downstream segments","correct":true,"why":"The quoted behaviour — config-driven mapping of segments above and below — is exactly what the ATT&CK entry records for G1045."},{"t":"The date mismatch proves the extract is forged end to end","why":"A mismatch lowers confidence and demands the police report; it does not by itself prove forgery of a config with plausible internal detail."},{"t":"Treat 172[.]26[.]29[.]0/24 as an undocumented segment and verify it on the wire","correct":true,"why":"It appears in an external source, is absent from the CMDB, and has no flows in retention — verify, then document or dismiss it."},{"t":"Attribute the carrier incident to Salt Typhoon in Solstice's report","why":"Behaviour echo is not naming rights; attribution rests with the investigation, and Solstice holds no evidence of its own."},{"t":"The activity is consistent with pre-compromise topology reconnaissance aimed at the layout, not the hosts","correct":true,"why":"Mapping upstream and downstream segments is PRE-phase topology recon (T1590.004); nothing in the extract shows host compromise at Solstice."},{"t":"The SNMP community string in the extract proves Solstice was actively scanned","why":"The string lives on the carrier's device; it is leftover 2022 configuration and says nothing about Solstice."}]},{"id":"e04","type":"order","title":"Evidence-first triage order before the 20:00 broadcast","scenario":"<p>Ticket #54118 continues, 14:00. The CISO accepts the working theory — a leaked map is in use and probing continues — and orders action now. Tom Barry reminds her that SM-BR-GW-02 has no failover and North Studio is live at 20:00; pulling the gateway means 45-90 minutes off air. Nadia must sequence the response so evidence survives and the studio stays on air. The costly option is on the table — but nothing yet places the actor on the branch gateway, and the decision needs scope first.<\/p>","artefacts":[{"label":"Action menu (unsorted)","kind":"table","head":["Action","Business cost","Evidence value"],"rows":[["Preserve probe logs and packet capture","storage only","high"],["Read-only state capture from SM-CORE-RTR-01","none","high"],["Reconcile leaked subnets vs live routing","1-2 analyst-hours","high"],["Pull SM-BR-GW-02 for forensic imaging","45-90 min studio outage, no failover","uncertain — nothing places the actor on this device"],["Brief CISO with exposure statement","none","enables the decision"]]},{"label":"CoreSight — probe continuing","kind":"logview","body":"2025-05-14T09:58:02Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]31 proto=tcp flags=SYN\n2025-05-14T09:59:11Z src=45[.]155[.]204[.]71 dst=172[.]26[.]10[.]32 proto=tcp flags=SYN\n2025-05-14T10:00:00Z host=CoreSight job=daily-digest status=ok recipients=214"},{"label":"War-room chat","kind":"chat","body":["Renata Kovac (CISO): I want the gateway pulled now. Now means now.","Tom Barry (Broadcast Ops): SM-BR-GW-02 has no failover. Pull it and the 20:00 bulletin is off air.","Nadia Rahim: then we sequence — evidence first, decision after scoping. I own the order.","Renata Kovac (CISO): fine. But if this bites us tonight, it is on your order."]},{"label":"Facilities notice (background)","kind":"text","body":"Studio floor repaint 17:00-19:00; car park B closed for the OB truck. — Facilities"}],"question":"Rank the five actions from first to last.","hint":"Constraint to keep in mind: the only action that cannot be undone — the studio outage — must not precede the actions that decide whether it is needed.","explanation":"<p>The order follows dependency, not urgency. Volatile probe evidence is preserved first because retention will destroy it; the disputed route state is captured read-only second because it is the fact everyone is arguing about; scoping runs third because it decides whether the expensive action is justified at all; only then is the CISO briefed, because a brief without those artefacts is an opinion. The gateway pull comes last and conditional: it costs 45-90 minutes of live broadcast and nothing yet places the actor on that device. Pulling it first is the intuitive decisive move and it is wrong here — it buys an outage before it buys information.<\/p><p><b>Study this:<\/b> evidence-first incident sequencing — volatile data, then disputed state, then scope, then decision, then costly action.<\/p>","items":["Preserve the probe logs and packet capture for the probe window","Capture routing, interface and config state read-only from SM-CORE-RTR-01, with hashes","Reconcile the leaked subnets against live routing and the asset inventory","Brief the CISO with an exposure statement and a confidence level","Schedule the SM-BR-GW-02 forensic pull for after the 20:00 broadcast, only if scoping justifies it"],"itemWhy":["Most volatile evidence first: nothing else can be rebuilt if the retention window rolls over.","The route table is the disputed fact; a hashed read-only export makes it courtroom-ready.","Scoping decides whether the gateway pull is justified at all.","Decisions need the exposure picture, which only exists after the three evidence steps above.","The costly action — 45-90 minutes of studio outage with no failover — comes last and only on evidence."]},{"id":"e05","type":"qcm","title":"Broker channel sample: what can the board be told?","scenario":"<p>Ticket #54244, 16:00. A monitored criminal channel is selling internal network maps of EU broadcasters, advertised as fresh. The sample image shows Solstice VLAN labels and gateways — including the broadcast range and a label STUDIO-N for North Studio, while current inventory spells the label STUDIO-NTH. The seller claims the pack is current for this quarter; the sample carries no timestamp. Legal counsel Elena Vasquez needs one line for the board in ten minutes, and the line has to survive being challenged.<\/p>","artefacts":[{"label":"Monitored channel (capture)","kind":"chat","body":["mapdealer_kz: EU broadcaster packs — internal segments and gateways, Q2 fresh, 3 BTC","buyer_44: sample?","mapdealer_kz: sample has 4 vlans, see watermark","Elena Vasquez (Legal): I need one defensible line for the board in ten minutes."]},{"label":"Sample map vs current inventory","kind":"table","head":["Element","Sample shows","Current inventory says"],"rows":[["Broadcast VLAN","172[.]26[.]20[.]0/24","match"],["North Studio","172[.]26[.]30[.]0/24, label STUDIO-N","range matches; label differs (inventory: STUDIO-NTH)"],["Partner-feed DMZ","172[.]26[.]40[.]0/24","match — added 2023, absent from the 2019 diagram"],["Management","172[.]26[.]99[.]0/24","absent from sample"]]},{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"G0069 MuddyWater has mapped target networks; access to this information has then been shared with and sold to other Iran-linked threat actors."},{"label":"Channel sidebar (background)","kind":"text","body":"Same seller also advertises VPN config bundles and CV templates. Unrelated product lines, same watermark — noted for the record, not for the board."}],"question":"Which line is the one Legal can defend?","hint":"Constraint to keep in mind: the sample's DMZ entry post-dates the only internal source the 2019 diagram represents.","explanation":"<p>The defensible line commits to what the artefact shows: a third party holds a map accurate enough — including the 2023 DMZ that the 2019 diagram never had — to plan access to Solstice's segments, and exposure is treated as likely while verification continues. The MuddyWater excerpt describes the resale pattern, not an identification: behaviour echo is never attribution. One differing label does not make a hoax when three current ranges match, and the 2019 export cannot be the source because the sample knows about the DMZ. Waiting for the full map forfeits the verification window and gives the board nothing. Note the gap: no timestamp on the sample, so currency rests on content, not on dates.<\/p><p><b>Study this:<\/b> G0069 MuddyWater — mapped network data shared and sold — and how to state exposure without overclaiming attribution.<\/p>","options":[{"t":"G0069 MuddyWater has breached Solstice and is reselling our network data","why":"The excerpt records a resale behaviour, not an identification; no intrusion evidence exists in this file."},{"t":"Someone holds a map accurate enough — including post-2019 changes — to plan access to our segments; exposure is likely and under verification","correct":true,"why":"States exactly what the artefact proves, flags exposure honestly, and survives a challenge for the underlying evidence."},{"t":"The sample is a hoax because one VLAN label differs from our inventory","why":"Three current ranges match and one label drifted; a hoax that accurate would be pointless."},{"t":"The map comes from our 2019 CMDB export and is therefore stale","why":"The sample includes the 2023 DMZ, which the 2019 export predates and does not contain."},{"t":"No action is needed until the seller publishes the full map","why":"Waiting forfeits the verification window and is not a board line at all."}]},{"id":"e06","type":"match","title":"Four artefacts, four recon vectors","scenario":"<p>Ticket #54231 follow-up. Chris Doyle is tuning the DET0819 topology-recon strategy and its analytic AN1951, and asks Nadia to classify four verified artefacts by the collection vector each shows. He warns her that AN1951 already runs hot — a very high false-positive rate — so every mislabelled artefact becomes a fake finding in next quarter's report. One open question the artefacts cannot answer: whether anyone actually replied to the audit form, because mail gateway retention only starts on 1 May.<\/p>","artefacts":[{"label":"CoreSight — sweep window","kind":"logview","body":"2025-05-13T22:14:09Z src=91[.]219[.]238[.]24 dst=172[.]26[.]10[.]40 proto=tcp flags=SYN\n2025-05-13T22:14:52Z src=91[.]219[.]238[.]24 dst=172[.]26[.]10[.]41 proto=tcp flags=SYN\n2025-05-13T22:15:30Z src=91[.]219[.]238[.]24 dst=172[.]26[.]10[.]42 proto=tcp flags=SYN\n2025-05-13T22:16:11Z host=CoreSight rule=sweep-window note=4 hosts in 6h window, no payload"},{"label":"Supplier audit form (email extract)","kind":"text","body":"From: network-audit@solsticemedia-support[.]example\nSubject: Mandatory network audit - Q2\nPlease confirm how many routers sit between your studios and the internet, and whether the studio gateway terminates VPN directly. (Domain registered 11 days ago. No record of any reply — mail retention starts 1 May.)"},{"label":"Careers page snippet","kind":"text","body":"solstice-media[.]example/careers — North Studio expansion: new 172[.]26[.]30[.]0/24 rollout on Cisco routing, live in Q3. Join the team that wires our studios."},{"label":"Public DNS-mapping site (extract)","kind":"text","body":"DNS-Dumpster-style public mapping tool, graph for solstice-media[.]example: mail, autodiscover, edge-rtr, vpn-hub. Relationships drawn from public DNS records; last crawler pass unknown."},{"label":"SOC channel (background)","kind":"chat","body":["SOC channel: the coffee machine keeps flapping its SNMP trap. Ticket #54388 — nobody drinks the espresso until Monday."]}],"question":"Classify each of the four artefacts by the recon vector it shows.","hint":"Constraint to keep in mind: none of the four artefacts contains an authentication attempt or an established session.","explanation":"<p>The sequential sweep is direct measurement of the layout — Active Scanning (T1595). The lookalike-domain form extracts topology facts from people — Phishing for Information (T1598), no link or attachment required. The careers page is data Solstice published about itself — Search Victim-Owned Websites (T1594). The DNS graph is a third party's aggregation of public records — Search Open Technical Databases (T1596). T1133 does not fit because nothing authenticates, and T1590.006 does not fit because no artefact is about an appliance — these are segments, gateways and layout. That discipline is exactly what AN1951 tuning needs: vector labels decide which detections could ever see the activity.<\/p><p><b>Study this:<\/b> T1590.004 collection vectors — Active Scanning, Phishing for Information, Search Victim-Owned Websites — plus the T1596 enrichment path.<\/p>","pairs":[{"l":"Six-hour single-SYN sweep across one internal range from a hosting provider","r":"Active Scanning (T1595)","why":"Direct measurement of the layout: sequential probes are the classic T1595 footprint on a topology."},{"l":"Lookalike-domain audit form asking which routers sit between studios and the internet","r":"Phishing for Information (T1598)","why":"Eliciting topology facts from humans is T1598, even with no attachment or link."},{"l":"Careers page naming the new studio range and its routing vendor","r":"Search Victim-Owned Websites (T1594)","why":"The data was published by Solstice itself; reading the victim's own sites is T1594."},{"l":"Public DNS-mapping graph of Solstice mail, edge and VPN hostnames","r":"Search Open Technical Databases (T1596)","why":"DNS relationship dumps live in open technical databases; harvesting them is T1596."}],"decoys":[{"r":"External Remote Services (T1133)","why":"No artefact shows a login or session; T1133 is the access stage that may follow the mapping."},{"r":"Network Security Appliances (T1590.006)","why":"That sibling targets firewalls and proxies; every artefact here is about segments, gateways and layout."}]},{"id":"e07","type":"blank","title":"Two logs, one gateway, zero agreement","scenario":"<p>Ticket #54399 opens at 03:20. CoreSight flow records show SM-BR-GW-02 forwarding session traffic into the partner-feed DMZ at 03:12 — but the gateway's April config backup says the DMZ static route was removed in March under change #54099, approved and closed. SM-CORE-RTR-01's NetFlow returns zero records for the exact 03:05-03:20 window. Chris Doyle proposes to reboot the gateway to clear the phantom state; Nadia Rahim stops him. Renata Kovac wants one defensible line in the morning note. Complete the escalation note.<\/p>","artefacts":[{"label":"CoreSight — flow records and the empty window","kind":"logview","body":"2025-05-14T03:12:07Z dev=SM-BR-GW-02 evt=flow-fwd dst=172[.]26[.]40[.]11 proto=tcp dport=443 bytes=1240\n2025-05-14T03:12:51Z dev=SM-BR-GW-02 evt=flow-fwd dst=172[.]26[.]40[.]11 proto=tcp dport=8443 bytes=980\n2025-05-14T03:20:00Z host=CoreSight note=netflow SM-CORE-RTR-01 window 03:05-03:20 returned 0 records"},{"label":"Config backup SM-BR-GW-02 (April)","kind":"code","body":"! config backup SM-BR-GW-02 2025-04-01\n! change #54099 (2025-03-08, approved, closed)\nno ip route 172[.]26[.]40[.]0 255[.]255[.]255[.]0 172[.]26[.]30[.]5\n! partner feed egress moved to HQ - route removed\nsnmp-server contact noc@solstice-media[.]example"},{"label":"Change ticket #54099 (summary)","kind":"text","body":"Change #54099 — Remove studio-side route to partner-feed DMZ; egress moves to HQ. Approved 2025-03-07, implemented 2025-03-08, closed without rollback. Post-check: route absent from running config."},{"label":"War-room chat","kind":"chat","body":["Chris Doyle: gateway forwards to the DMZ at 03:12, but the route was removed in March. Reboot it — that clears phantom state.","Nadia Rahim: no. We preserve state first. A reboot destroys exactly the thing we cannot reproduce.","Renata Kovac (CISO): I need one line for the morning note. Make it defensible."]},{"label":"CoreSight health (background)","kind":"text","body":"Database index rebuild scheduled Sunday 02:00. Expected ingest pause: 4 minutes. No data loss expected. — Platform team"}],"question":"Complete the escalation note: one entry per blank.","hint":"Constraint to keep in mind: the empty NetFlow window is an absence of recording, not proof of an absence of traffic.","explanation":"<p>The two sources contradict each other, so neither can be promoted to truth: flows say the route was used, the config backup and the closed change record say it was removed. The senior move is to preserve state read-only and escalate, because the decision needs evidence nobody holds yet. The reboot instinct is the widely trusted practice that is wrong here — it destroys volatile routing state to settle a question that state exists to answer. And the empty NetFlow window must be named as a gap: zero records can mean no traffic or no telemetry, and from inside the window you cannot tell which. That combination — conflict plus gap — is precisely what escalation is for.<\/p><p><b>Study this:<\/b> handling contradictory telemetry — preserve, declare the gap, escalate; never reboot first.<\/p>","blanks":[{"label":"The flow records and the April config backup are best described as","accept":["contradictory","conflicting","in conflict","inconsistent"],"why":"One source says the route was used, the other says it was removed; neither wins alone."},{"label":"First action on SM-BR-GW-02 before any change","accept":["preserve","capture","snapshot","preserve state","capture state","back up","backup"],"why":"State first: you cannot analyse what you overwrote."},{"label":"Rebooting the gateway to clear the odd state is classified as","accept":["destructive","harmful","damaging","evidence destruction","destructive to evidence"],"why":"Volatile routing state is destroyed by the reboot and never comes back."},{"label":"Because two sources disagree and one window is empty, the note must","accept":["escalate","escalation","escalate it","escalate to ir"],"why":"With sources in conflict and a telemetry gap, one analyst should not close the question alone."}],"bank":["contradictory","preserve","destructive","escalate","reboot","accept the flows"]},{"id":"e08","type":"dragdrop","title":"Adversary view: place each action on the campaign board","scenario":"<p>Purple-team prep, Wednesday afternoon — and this one is built from the attacker's side. Chris Doyle wants the campaign board of a topology-focused adversary: what such an actor does, in ATT&amp;CK terms, before ever touching Solstice. The rules of engagement are strict: external, open-source and passive work only; the board must stay in PRE. Two submissions on the table are deliberate traps, and one line of chatter is unrelated. Build the board.<\/p>","artefacts":[{"label":"Rules of engagement (extract)","kind":"text","body":"Scope: external and open-source only. No exploitation, no authentication attempts, no contact with live Solstice services. Deliverable: campaign board mapped to ATT&CK stages, PRE only. — C. Doyle"},{"label":"External footprint summary","kind":"table","head":["Surface","Note"],"rows":[["Careers site","studio range and routing vendor named in a Q3 post"],["Conference talk","multi-studio routing at scale — slide includes VLAN naming"],["DNS relationship maps","public graphs of solstice-media[.]example hostnames"],["Studio VPN portal","per March scan reachable at SM-BR-GW-02:443; not re-verified since"]]},{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"Gather Victim Network Information: Network Topology (T1590.004) enables Search Open Technical Databases (T1596), establishing operational resources — Acquire Infrastructure (T1583) or Compromise Infrastructure (T1584) — and initial access via External Remote Services (T1133). Mitigation M1056 Pre-compromise: minimise the amount and sensitivity of data available to external parties."},{"label":"Team chat (background)","kind":"chat","body":["Chris Doyle: (off-topic) the licence-server migration slipped to Friday — ignore yesterday's mail."]}],"question":"As the red lead: place every action at its campaign stage.","hint":"Constraint to keep in mind: the board covers PRE only — anything that assumes a foothold inside the estate is out of scope.","explanation":"<p>The chain runs: read what Solstice published about itself (T1594/T1593), measure the layout directly (T1595), acquire staging resources that look legitimate (T1583), then probe the reachable external service (T1133). The two rejected cards fail on scope: credential dumping is a post-compromise action forbidden by the rules of engagement, and mapping managed providers belongs to the sibling Sub-Technique T1590.003, which deals with trust dependencies, not layout. Keeping the board PRE-honest is what makes the red-team report comparable with the blue team's DET0819 coverage. Note the gap in the footprint table: the portal's exposure is asserted by a March scan nobody has repeated — a red lead would re-verify before touching it.<\/p><p><b>Study this:<\/b> the T1590.004 chain into T1583/T1584 and T1133 — and the PRE boundary that separates recon from intrusion.<\/p>","slots":[{"label":"Open-source collection (PRE)","accept":"a1","why":"Reading Solstice's own published pages and talks is victim-owned-website collection."},{"label":"Direct measurement (PRE)","accept":"a2","why":"A sweep measures the real layout; it is the direct collection vector."},{"label":"Operational staging (PRE)","accept":"a3","why":"Renting exits and registering lookalikes is the adversary obtaining infrastructure."},{"label":"Access staging (PRE to first touch)","accept":"a4","why":"Probing a reachable remote service is the outer edge of PRE and the door to T1133."}],"chips":[{"k":"a1","t":"Read careers pages and conference talks for studio segments","sub":"T1594 / T1593","why":"Published by Solstice itself; harvesting it is Search Victim-Owned Websites and Search Open Websites/Domains."},{"k":"a2","t":"Run a low-and-slow sweep of the exposed ranges","sub":"T1595","why":"Direct probing of the layout — Active Scanning."},{"k":"a3","t":"Rent VPN exit nodes and register lookalike domains","sub":"T1583","why":"Acquiring operational resources before any contact — Acquire Infrastructure."},{"k":"a4","t":"Probe the studio VPN portal for reachable endpoints","sub":"T1133","why":"Testing an external remote service is where recon becomes access."},{"k":"c5","t":"Dump credentials from a domain controller","sub":"T1003","why":"An executed, post-compromise action — far outside PRE and forbidden by the rules of engagement."},{"k":"c6","t":"Map which managed providers hold elevated access","sub":"T1590.003","why":"That is the sibling Sub-Technique Network Trust Dependencies, not Network Topology."}]},{"id":"e09","type":"terminal","title":"Terminal: capture route state without destroying it","scenario":"<p>Ticket #54399, 12:40. Legal needs the current routing state of SM-CORE-RTR-01 as an exhibit that survives scrutiny: read-only, complete, reproducible, hashable. You are on sm-evd-01, an audit jump host with a read-only role on the router's management plane. The morning's anomaly — a static route into the partner-feed DMZ — was found in a non-main routing table, and nobody knows what the other tables hold. Renata Kovac gives you ten minutes; Broadcast Ops forbids anything that could bounce a link; Chris's runbook points at a host retired in 2023.<\/p>","artefacts":[{"label":"Legal custody requirement","kind":"text","body":"E.Vasquez: Exhibits must be read-only captures, hashable, timestamped, and reproducible. Any command that changes device state makes the exhibit challengeable in court. — Legal, 12:40"},{"label":"War-room chat","kind":"chat","body":["Renata Kovac (CISO): You have ten minutes. Legal wants the route state on the record.","Tom Barry (Broadcast Ops): Nothing that blinks a link. The studio path is sacred until 20:15.","Nadia Rahim: Read-only, complete, one command. I am not flushing anything."]},{"label":"Chris's runbook (stale)","kind":"code","body":"RUNBOOK rev 2019 - route evidence\n  host: sm-legacy-rtr-01\n  cmd : show run | include ip route\n! host retired 2023 - runbook never updated"},{"label":"CoreSight — config-change feed (last 24h)","kind":"logview","body":"2025-05-14T06:02:11Z host=SM-CORE-RTR-01 event=static-route-add dst=172[.]26[.]40[.]0/24 via=172[.]26[.]20[.]5 table=1002\n2025-05-14T06:02:12Z host=SM-CORE-RTR-01 event=config-save revision=8841\n2025-05-14T06:44:29Z host=CoreSight note=no further routing changes in window"}],"question":"Type the single read-only command that prints every routing table on SM-CORE-RTR-01.","hint":"Constraint to keep in mind: the role is read-only, and the anomaly was hiding in a table other than main.","explanation":"<p>ip route show table all is the one command that answers the legal question: it prints the main table and every other table, read-only, reproducible on demand. Each part matters — ip is the state tool, route is the disputed object, show never mutates, and table all is what would have caught the table-1002 route the main view hides. ip route flush and ip route del are the DANGEROUS near misses: both rewrite live routing state on the very device Legal is evidencing, and neither is reversible. nmap and traceroute fail differently — they inject fresh traffic into the evidence window and answer questions the route table already answers. State-destroying convenience is how evidence dies.<\/p><p><b>Study this:<\/b> evidence-preserving state capture with ip route show table all — read-only verbs, complete table coverage, and the near misses that destroy routing state.<\/p>","prompt":"nadia@sm-evd-01:~$","banner":"sm-evd-01 — role 'auditor' (read-only) — SM-CORE-RTR-01 management plane. Type your command, then press Enter (simulated).","elements":[{"label":"uses the ip tool","re":"\\bip\\b","why":"ip is the read-safe state tool; nothing changes unless an explicit write verb is used."},{"label":"targets the route object","re":"\\broute\\b","why":"route is the object that answers what this box believes the layout is."},{"label":"prints rather than modifies (show)","re":"\\bshow\\b","why":"show is read-only; add, del and flush change state and are off-limits on evidence."},{"label":"covers every routing table (table all)","re":"table\\s+all\\b","why":"The anomaly lived outside the main table; only table all gives the complete view."}],"bads":[{"re":"\\bflush\\b","note":"ip route flush empties routing state on a live router — exactly the evidence Legal needs — and it is irreversible.","dangerous":true},{"re":"\\bdel\\b","note":"ip route del removes the very static route under investigation: destructive, irreversible, and fatal to the exhibit.","dangerous":true},{"re":"\\bnmap\\b","note":"nmap from the management plane writes new traffic into the evidence window and maps nothing the route table does not already state."},{"re":"\\btraceroute\\b","note":"traceroute sends live probes from a monitored host: it pollutes the capture window and answers a different question (path, not state)."}],"canonical":"ip route show table all","out":"default via 172[.]26[.]10[.]1 dev eth0 proto static\n172[.]26[.]10[.]0/24 dev eth0 proto kernel scope link\n172[.]26[.]20[.]0/24 dev eth2 proto kernel scope link\n172[.]26[.]40[.]0/24 via 172[.]26[.]20[.]5 dev eth2 table 1002 proto static\nlocal 127[.]0[.]0[.]1 dev lo table local scope host"},{"id":"e10","type":"multi","title":"Pull the gateway now? Scope versus outage","scenario":"<p>Ticket #54399 continues, 15:30. Renata Kovac has read the morning findings and orders: take SM-BR-GW-02 for forensics — now. Tom Barry counters: the gateway has no failover and North Studio is live at 20:00; a pull means 45-90 minutes off air. Nothing in the week's artefacts places the actor on the branch gateway itself — the probes targeted the HQ core, and no studio-side session appears in telemetry. Elena Vasquez adds that whatever Nadia commits to must be repeatable on the record. Answer the CISO with the two commitments you can defend to both sides.<\/p>","artefacts":[{"label":"Options board (with costs)","kind":"table","head":["Option","Business cost","Evidence value"],"rows":[["Isolate SM-BR-GW-02 immediately","45-90 min studio outage, no failover","nothing yet places the actor on this device"],["Read-only state capture + targeted watches","none","preserves state, adds telemetry on studio and DMZ ranges"],["Scheduled forensic pull after the broadcast","outage late evening, agreed window","full imaging once scope justifies it"],["Reboot the gateway during the bulletin","brief outage + destroys volatile state","negative — the state is the evidence"],["Block the probing address at the edge","none","actor likely rents it; blocking announces awareness"]]},{"label":"War-room chat","kind":"chat","body":["Renata Kovac (CISO): Pull it now. I will not explain to the board why we only watched.","Tom Barry (Broadcast Ops): No failover. Pull it and the 20:00 bulletin is dark.","Elena Vasquez (Legal): Commit to what you can repeat on the record.","Nadia Rahim: Then I commit to evidence and a window — not to a reflex."]},{"label":"CoreSight — studio-range summary (7d)","kind":"logview","body":"2025-05-14T15:31:02Z query=172[.]26[.]30[.]0/24 outbound-sessions=214 inbound=0 unexpected=0\n2025-05-14T15:31:02Z query=SM-BR-GW-02 mgmt-plane logins=netops-only window=7d\n2025-05-14T15:31:03Z note=probes continue against HQ core range, not the studio range"},{"label":"Newsdesk note (background)","kind":"text","body":"The 20:00 bulletin lead story changed twice today; the OB truck books at 18:30. — Newsdesk"}],"question":"Choose the TWO commitments Nadia can defend to Legal and Broadcast Ops.","hint":"Constraint to keep in mind: no artefact yet places the actor on the branch gateway itself.","explanation":"<p>The two defensible commitments buy evidence and optionality: capture now, read-only, and widen telemetry with targeted watches; and schedule the expensive pull behind a scope gate and the broadcast window. Immediate isolation belongs to the world where the device is implicated — a world these artefacts do not support, at a cost the business cannot cheaply pay. Waiting until Monday forfeits a live evidence window, rebooting destroys the volatile state and risks the bulletin at once, and blocking one rented address is theatre that tells the adversary it is seen. This is the costly-action trade-off in its cleanest form: the right decision is not never pulling the gateway — it is pulling it when the scope says so, not when the pressure does.<\/p><p><b>Study this:<\/b> scoping before costly response — accept the outage only when evidence, not pressure, justifies it.<\/p>","options":[{"t":"Commit to a read-only state and config capture now, plus targeted CoreSight watches on the studio and DMZ ranges","correct":true,"why":"Preserves and grows evidence at zero business cost, and it is repeatable on the record."},{"t":"Isolate SM-BR-GW-02 immediately and accept the studio outage","why":"Defensible only if the device were implicated; here it costs 45-90 live minutes for a device no artefact points at."},{"t":"Schedule the full forensic pull for the window after the 20:00 broadcast, contingent on scope","correct":true,"why":"Keeps the costly option alive and scheduled without paying for it before evidence justifies it."},{"t":"Do nothing until Monday's change window and reassess then","why":"Four days of probes and log rotation stand between now and then; the evidence window is live."},{"t":"Reboot the gateway during the bulletin to clear the suspicious state","why":"Destroys the volatile state Legal needs while risking the broadcast — wrong on both sides at once."},{"t":"Block the probing address at the edge and declare the incident contained","why":"A rented address is trivially swapped; the declaration would be false and the adversary learns it is seen."}]},{"id":"e11","type":"qcm","title":"Consultant headline: naming G1017 before proof","scenario":"<p>Ticket #54399, 16:20. Greyloch Advisory, the retained consultancy, emails the CISO directly: the slow-sweep pattern matches G1017 Volt Typhoon pre-compromise topology recon, their assessment is high confidence, and boards should know that 2025's AI-orchestrated campaigns (see C0062) can map a full topology in hours — so assume Solstice is being staged. The board sits at 18:00. Renata Kovac asks Nadia one question: do I put Volt Typhoon in front of the board tonight, yes or no?<\/p>","artefacts":[{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"G1017 Volt Typhoon has conducted extensive reconnaissance, including identifying network topologies of targeted organisations."},{"label":"Greyloch email (extract)","kind":"text","body":"From: assessment team, Greyloch Advisory. Pattern match to G1017 Volt Typhoon, high confidence. Note C0062-style AI-orchestrated mapping shortens the timeline. Recommend the board be told a state-nexus actor is staging. No artefacts attached; supporting dataset available on request."},{"label":"CoreSight — sweep pattern (verified)","kind":"logview","body":"2025-05-14T09:10:02Z src=45[.]155[.]204[.]71 one SYN per host, 6h window, HQ core range\n2025-05-14T15:58:11Z analyst=n.rahim note=behaviour: pre-compromise topology recon, confidence moderate\n2025-05-14T15:58:12Z analyst=n.rahim note=attribution: no evidence held"},{"label":"CoreSight weekly health (background)","kind":"table","head":["Metric","Value"],"rows":[["Ingest latency p95","1.2 s"],["Parser failures","0"],["Retention coverage","30 days"]]}],"question":"Which board line is defensible at 18:00?","hint":"Constraint to keep in mind: an assessment that attaches no artefacts is an opinion, not evidence.","explanation":"<p>The defensible line separates behaviour from naming: the artefacts show pre-compromise topology reconnaissance, and the ATT&CK entry for G1017 Volt Typhoon documents exactly that behaviour among others — but behaviour echo is not attribution, and Greyloch attached no evidence to its high-confidence claim. The C0062 reference is real and relevant to how fast mapping can happen, yet it says nothing about who is doing this to Solstice. Repeating the consultancy's headline inherits its confidence without its dataset; the scanner story misreads the source; PRE does not mean nothing to report; and the hedge still names a state. Attribution caution is the senior skill here: describe what is observed and hold the name until evidence earns it.<\/p><p><b>Study this:<\/b> G1017 Volt Typhoon's documented reconnaissance behaviour — and the discipline of separating behavioural consistency from attribution.<\/p>","options":[{"t":"It is our own vulnerability scanner misconfigured again","why":"Scanner runs are scheduled and internal; this sweep is external, unscheduled and sequential."},{"t":"Volt Typhoon is mapping us for a living-off-the-land intrusion; the board should assume staging","why":"Repeats the consultancy's headline without its missing evidence; it collapses under the first challenge."},{"t":"Say probable state-nexus activity to hedge the risk","why":"A hedge that still names a state; it carries the attribution risk without the evidence."},{"t":"The observed activity is consistent with pre-compromise topology reconnaissance; attribution to any named group is not supported by current evidence","correct":true,"why":"Reports the behaviour with the right confidence and cannot be collapsed by a request for the underlying dataset."},{"t":"Because the behaviour is PRE, there is nothing to report to the board","why":"PRE does not mean harmless: exposure and staging decisions belong to the board."}]},{"id":"e12","type":"steps","title":"Carrier-range logins: which chain, what commitment","scenario":"<p>Ticket #54399 escalates, 17:05. CoreSight shows three failed VPN logins to the North Studio portal on SM-BR-GW-02:443 from 82[.]114[.]66[.]40 — inside the subnet TransAlpine announced for its availability checker. TransAlpine's NOC asks Solstice not to block the range and offers to corroborate with source ports and timestamps. Retained VPN telemetry goes back 30 days only; nothing older exists. Renata Kovac wants the attack chain on one slide and a commitment in one line. Chris Doyle reminds her that T1583 and T1584 are different worlds for Legal.<\/p>","artefacts":[{"label":"CoreSight — VPN portal, studio gateway","kind":"logview","body":"2025-05-14T11:02:18Z dev=SM-BR-GW-02 app=vpn evt=auth-fail user=svc_studio src=82[.]114[.]66[.]40\n2025-05-14T11:07:44Z dev=SM-BR-GW-02 app=vpn evt=auth-fail user=studio_admin src=82[.]114[.]66[.]40\n2025-05-14T11:12:03Z dev=SM-BR-GW-02 app=vpn evt=auth-fail user=svc_studio src=82[.]114[.]66[.]40 note=staggered, same /24\n2025-05-14T11:12:40Z note=no successful auth from this range anywhere in retention"},{"label":"TransAlpine NOC reply","kind":"text","body":"The 82[.]114[.]66[.]0/24 subnet runs our customer availability checker. We ask that you not block it. We can corroborate our own traffic with source ports and timestamps on request. — M. Aalto, TransAlpine NOC"},{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"Network Topology (T1590.004) enables establishing operational resources — Acquire Infrastructure (T1583) or Compromise Infrastructure (T1584) — and initial access via External Remote Services (T1133). G1016 FIN13 similarly searched for infrastructure that can provide remote access to an environment."},{"label":"War-room chat","kind":"chat","body":["Renata Kovac (CISO): Chain on one slide. Commitment in one line. Broadcast is at 20:00.","Chris Doyle: If the staging box is the carrier's own device, that is T1584, not T1583. Legal will care.","Tom Barry (Broadcast Ops): Whatever you decide, the portal stays up until after the bulletin."]},{"label":"HR notice (background)","kind":"text","body":"Flu-jab clinic Thursday 10:00-14:00, studio lobby. Walk-ins welcome. — HR"}],"question":"Walk the three decision points in order.","hint":"Constraint to keep in mind: no successful VPN login exists anywhere in the retained telemetry.","explanation":"<p>The chain is T1590.004, then T1584, then T1133: the staging source is a third party's device from a class already being seized and exploited, so it is compromise rather than acquisition — and the portal attempts are external remote services, the first touch. The conflict resolves by testing the carrier's claim against data both sides hold: the port behaviour separates their checker from the attempts, so neither blanket trust nor blanket blocking is defensible. The commitment raises the adversary's cost without irreversible moves: step-up authentication, watching, and holding the block until the port evidence lands. Every step was shaped by the declared gap — 30 days of telemetry and no successful login — so the story stops at the door, and the line says so.<\/p><p><b>Study this:<\/b> the T1590.004 into T1584 into T1133 chain — and resolving a third-party counter-claim with corroboration instead of trust or reflex blocking.<\/p>","steps":[{"question":"Which chain do you put on the slide?","options":[{"t":"Topology exposure (T1590.004) — rented infrastructure (T1583) — VPN portal probing (T1133)","why":"T1583 means the adversary acquired its own resources; the observed box is the carrier's."},{"t":"Topology exposure (T1590.004) — Trusted Relationship (T1199) — VPN portal probing (T1133)","why":"T1199 is the sibling T1590.003 chain about trust dependencies; no trust artefact exists here."},{"t":"Topology exposure (T1590.004) — compromised third-party device used for staging (T1584) — VPN portal probing (T1133)","correct":true,"why":"The observed source belongs to a third party whose device class is already being seized and exploited: compromise, not acquisition."},{"t":"Appliance recon (T1590.006) — compromised device (T1584) — portal probing (T1133)","why":"T1590.006 targets firewalls and proxies; these artefacts map segments and gateways."}],"advance":"<p>Kovac approves the chain slide, then asks the harder question: do we block the carrier's range before the 20:00 broadcast?<\/p>"},{"question":"The carrier claims the source subnet is their friendly checker. What resolves the conflict?","options":[{"t":"Accept the claim and whitelist the /24","why":"A compromised third party would say exactly this; whitelisting without corroboration is the trap."},{"t":"Block the whole /24 now and argue the SLA later","why":"Legitimate traffic rides that range; a blanket block has real cost and may breach the transit agreement."},{"t":"Log it and wait for the carrier's formal report","why":"Three staggered attempts with privileged usernames is patterned; passive waiting is not analysis."},{"t":"Corroborate with the carrier's offered source ports and timestamps against CoreSight before any block","correct":true,"why":"The claim is testable with data both sides hold; verification decides, not assumption."}],"advance":"<p>Port comparison shows the failed logins use random high ports at wide spacing, unlike the checker's documented fixed-port probes. TransAlpine escalates internally; the block decision is still open.<\/p>"},{"question":"Commitment line for the CISO before the broadcast?","options":[{"t":"Block the carrier range network-wide now","why":"Pays a business and contractual cost before the evidence lands — and a watch would catch nothing less."},{"t":"Treat the portal as actively targeted: raise step-up authentication for studio accounts, watch the range, hold the block decision pending the carrier's port evidence","correct":true,"why":"Raises the adversary's cost, keeps evidence flowing, and avoids an irreversible move before proof."},{"t":"Disable the studio VPN portal until Monday","why":"Cuts a live operational dependency before a live broadcast; no artefact shows a successful login."},{"t":"Close the ticket as user error","why":"Privileged usernames tried from a carrier range is not user error; closing invites the 03:00 sequel."}],"advance":"<p>Kovac reads the line aloud at 17:55: targeted, watchful, nothing irreversible. The carrier's port evidence lands at 19:40 and confirms the checker does not match the attempts.<\/p>"}]},{"id":"e13","type":"match","title":"Signals to next stages: what does each enable?","scenario":"<p>17:40. Nadia consolidates the week's verified signals for the AN1951 coverage review. Chris Doyle's warning stands: the classic error is mapping everything to T1133 because it feels decisive. Each signal maps to the ATT&amp;CK stage it actually indicates — and one register line is housekeeping, not a signal at all. The broker post is verified as a channel post, but the sample has not been obtained, so its currency remains open.<\/p>","artefacts":[{"label":"Signal register (verified)","kind":"table","head":["Signal","Status"],"rows":[["Public gist with the current segment map","verified genuine"],["Rented VPN exit nodes used as probe sources","verified from ASN data"],["Failed portal logins from the carrier range","verified; no success in retention"],["Broker offering broadcaster maps for sale","verified channel post; sample not obtained"],["AN1951 dashboard mail went to spam","housekeeping"]]},{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"T1590.004 enables Search Open Technical Databases (T1596), establishing operational resources — T1583 Acquire Infrastructure / T1584 Compromise Infrastructure — and initial access via External Remote Services (T1133). Mitigation M1056 Pre-compromise: minimise the amount and sensitivity of data available to external parties."},{"label":"CoreSight — probe source enrichment","kind":"logview","body":"2025-05-14T09:10:02Z src=45[.]155[.]204[.]71 asn=AS-RENTED-EXIT type=vps\n2025-05-14T11:02:18Z src=82[.]114[.]66[.]40 asn=AS-TRANSALPINE type=transit-provider\n2025-05-14T15:31:04Z note=enrichment cached; do not re-query the ASN service tonight"},{"label":"Team chat (background)","kind":"chat","body":["Chris Doyle: (housekeeping) I fixed the AN1951 mail sender policy — dashboards will mail again tomorrow."]}],"question":"Map each verified signal to the stage it actually indicates.","hint":"Constraint to keep in mind: map the signal, not the story you fear — three of these are PRE logistics, one is the first touch.","explanation":"<p>A verified map raises the value of compromised third-party staging (T1584) — the pattern G1045 made famous; rented exit nodes are acquired infrastructure (T1583); the portal attempts are the T1133 first touch; and the broker post is G0069-style resale, where the map itself is the weapon. T1596 does not fit because no signal shows a public-database lookup, and T1003 does not fit because nothing here runs on an endpoint. Keeping T1133 for the genuine first touch — and not for every scary line — is what stops the coverage matrix from lying. The broker line stays open until a sample is obtained; that is the register's declared gap.<\/p><p><b>Study this:<\/b> next-stage mapping from T1590.004 — T1583 versus T1584 versus T1133 — and resale of mapped data as an exposure in its own right.<\/p>","pairs":[{"l":"Verified gist with the current segment map","r":"Compromise Infrastructure (T1584)","why":"A precise map is what makes staging on a compromised third-party box valuable — the T1584 risk rises."},{"l":"Rented VPN exit nodes as probe sources","r":"Acquire Infrastructure (T1583)","why":"Renting exit nodes is the adversary obtaining its own operational resources."},{"l":"Failed portal logins from the carrier range","r":"External Remote Services (T1133)","why":"Probing a reachable remote service is the T1133 precursor — the first touch."},{"l":"Broker offering broadcaster maps for sale","r":"Weaponised exposure: the map is the commodity (G0069 behaviour)","why":"The artefact is resale of topology data — the G0069 pattern — not a new intrusion capability."}],"decoys":[{"r":"Search Open Technical Databases (T1596)","why":"T1596 is the adversary reading public technical data; none of these four signals is a database lookup."},{"r":"Credential Access (T1003)","why":"T1003 runs on compromised endpoints; this file holds no endpoint telemetry at all."}]},{"id":"e14","type":"order","title":"Adversary order: from public footprint to resale","scenario":"<p>Purple-team debrief, 18:10 — again from the attacker's chair. Chris Doyle asks Nadia to reconstruct the adversary's operational order from the week's artefacts, as the adversary would run it. The dependency chain matters because detection coverage is ordered by what the attacker needs next, not by which Solstice tool logs loudest. The recovered worklog fragment lost its timestamps in a forum wipe, so the sequence must be argued from dependency, not read from a clock.<\/p>","artefacts":[{"label":"Debrief brief","kind":"text","body":"Goal: rebuild the adversary sequence behind this week's activity. Each step feeds the next; the order is the detection roadmap. Timestamps on the worklog fragment are unrecoverable after the forum wipe. — C. Doyle"},{"label":"ATT&CK excerpt (quoted)","kind":"attack","body":"Reconnaissance (TA0043, PRE): victim-owned and open sources (T1594/T1593) — Network Topology (T1590.004) — validation by Active Scanning (T1595) — staging via T1583/T1584 — access attempts via T1133. Mapped data may be shared or sold (G0069 MuddyWater)."},{"label":"Adversary worklog (recovered fragment, undated)","kind":"table","head":["Fragment","Field note"],"rows":[["sweep validates the map or it is worthless","validation step"],["portals before people","access step"],["the pack sells better with the gateways named","monetisation step"],["careers page did half our work","collection step"],["exits and domains look legitimate by Thursday","staging step"]]},{"label":"CoreSight — nightly maintenance (background)","kind":"logview","body":"2025-05-13T23:00:01Z job=backup-hq status=completed duration=41m\n2025-05-13T23:41:02Z job=index-opt status=completed\n2025-05-14T00:00:00Z job=retention-sweep status=completed deleted=1.2TB"}],"question":"Rebuild the adversary's five-step operational order.","hint":"Constraint to keep in mind: each step feeds the next — a sweep only pays off against a map that already exists.","explanation":"<p>The dependency chain is the answer. Public footprint comes first because the careers page and DNS graphs are free. Validation comes second, because acting on an unvalidated map wastes the staging budget and raises noise. Staging comes third, because contact needs resources that look legitimate. The first touch comes fourth, from staged sources, against services the map says are reachable. Monetisation comes last, when the pack is complete enough to sell — the G0069 end state. Read backwards, this is also the blue team's coverage order: detect published leaks, then slow sweeps, then staging, then watch the portals. The undated worklog is the information gap; arguing the order from dependency is exactly the skill the debrief is testing.<\/p><p><b>Study this:<\/b> the adversary dependency chain from T1594/T1593 through T1590.004, T1595, T1583/T1584 and T1133 — with resale (G0069) as the end state.<\/p>","items":["Harvest the public footprint: careers pages, talks, DNS graphs","Validate the map with a low-and-slow internal sweep","Stage operational infrastructure: rented exits, lookalike domains","Touch the exposed remote services from staged sources","Monetise: share or sell the validated map with gateways named"],"itemWhy":["Everything downstream depends on published data — the careers page did half the work.","A sweep only pays off once there is a map to validate; unvalidated sweeps are noise and risk.","Contact requires resources that look legitimate; staging follows validation.","Portal attempts come from staged infrastructure, after the map and the exits exist.","Resale is the end state in the G0069 pattern — the pack sells better complete."]},{"id":"e15","type":"cloze","title":"Board assessment: insert the exact terms","scenario":"<p>16:45. Renata Kovac's board one-pager goes through Legal review, and Elena Vasquez rejects drafts that use terms loosely. The assessment line must carry exact ATT&amp;CK terms, declare the telemetry gap honestly, and phrase the ask in M1056's own logic. Nadia drafts the sentence; Legal checks four words first. The attachment lists the signal register and the exhibit list, and the skeleton declares the known gap so nobody can claim it was hidden.<\/p>","artefacts":[{"label":"Legal style rules","kind":"text","body":"Use technique IDs verbatim. Never name a group without evidence in the same document. Declare gaps as gaps. Phrase asks in Pre-compromise terms: minimise the amount and sensitivity of data available to external parties. — E.Vasquez"},{"label":"ATT&CK reference text","kind":"attack","body":"T1590.004 Gather Victim Network Information: Network Topology — Sub-Technique of T1590 — Reconnaissance (TA0043) — Platform PRE. Mitigation M1056 Pre-compromise. Detection strategy DET0819, analytic AN1951: very high occurrence and false-positive rate; activity may take place outside the victim's visibility."},{"label":"One-pager skeleton","kind":"table","head":["Section","Content"],"rows":[["Assessment line","the sentence below — four terms to fix"],["Audience","Board of directors"],["Deadline","17:00 today"],["Known gap","telemetry before 14 April not retained"]]},{"label":"Legal chat (background)","kind":"chat","body":["Elena Vasquez (Legal): (housekeeping) the NDA signature page moved to the portal — ignore the fax instruction."]}],"question":"Fill the four terms Legal will check first.","hint":"Constraint to keep in mind: the draft declares a gap, and Legal's own rules give the gap its honest name.","explanation":"<p>The four terms are the ones Legal audits. The exact Sub-Technique name is Gather Victim Network Information: Network Topology — the siblings cover appliances and trust dependencies, not layout. The tactic is Reconnaissance: this is PRE-phase collection, and nothing has been accessed. The empty window is declared as an information gap — Legal's own rule for zero-record results, which are neither incidents nor indicators. And attribution is not supported: the artefacts show behaviour, not a named actor, and probable quietly borrows the consultancy's confidence. Precision here is what makes the document survive the board.<\/p><p><b>Study this:<\/b> T1590.004 naming, the Reconnaissance tactic boundary, and M1056 Pre-compromise as the frame for minimising exposed topology data.<\/p>","template":"Assessment: verified artefacts are consistent with %0 (T1590.004) under tactic %1; the empty NetFlow window is declared as an %2; attribution is %3 from current evidence; under M1056 we will minimise externally visible topology data.","choices":[["Network Security Appliances","Gather Victim Network Information: Network Topology","Network Trust Dependencies"],["Initial Access","Discovery","Reconnaissance"],["incident","information gap","indicator"],["confirmed","probable","not supported"]],"correct":[1,2,1,2],"why":["Mapping segments and gateways is the definition of the T1590.004 Sub-Technique; the other two are siblings with different subjects.","Information gathering before any intrusion sits in Reconnaissance; Initial Access and Discovery are later tactics.","Legal's own rule: declare gaps as gaps — an empty window is an information gap, not an incident or an indicator.","The artefacts show behaviour, not a named actor; probable and confirmed inherit attribution risk Legal will not sign."]},{"id":"e16","type":"dragdrop","title":"Exhibit register: what survives scrutiny?","scenario":"<p>16:55. Elena Vasquez's exhibit handover is at 17:00. The rule: an exhibit is original, hashed, and relevant to the intrusion window; anything that reflects later state is excluded or declared; background context is marked as context, never as evidence of the layout. Chris Doyle argues the CMDB diagram should go in as the source of truth; Elena overrules him — a source proven wrong this week is context, not evidence. One locker item is pure noise. Build the register.<\/p>","artefacts":[{"label":"Legal custody memo","kind":"text","body":"Exhibits: original capture, hash present, timestamp present, relevant to the window under review. State captured after an unforced change is declared, not exhibited. Documentation contradicted by live data is context only. — E.Vasquez, 16:55"},{"label":"Evidence locker export (unsorted)","kind":"table","head":["Item","Hash","Provenance"],"rows":[["Route-table export, SM-CORE-RTR-01, 12:51","SHA-256 present","read-only capture, audit role"],["CoreSight flow records, 03:12 window","SHA-256 present","SIEM export"],["NetFlow rows 03:05-03:20","n/a","retention query returned 0 records"],["2019 CMDB logical diagram","SHA-256 present","document store, never reconciled"],["Gateway state snapshot, Thursday 14:00 (after test reboot)","SHA-256 present","console capture, post-reboot"],["Digital signage playlist, Q2","SHA-256 present","content system export"]]},{"label":"Evidence locker audit log","kind":"logview","body":"2025-05-14T12:51:10Z action=hash item=route-export result=ok\n2025-05-14T12:52:03Z action=hash item=flows-0312 result=ok\n2025-05-14T12:55:44Z action=export item=netflow-0305-0320 result=0 records\n2025-05-14T13:01:22Z action=hash item=cmdb-2019 result=ok\n2025-05-14T13:04:51Z note=printer toner order confirmed — repro 2 packs"},{"label":"War-room chat","kind":"chat","body":["Elena Vasquez (Legal): 17:00. Register sorted, or nothing is admissible.","Chris Doyle: the CMDB diagram is the source of truth — it should be an exhibit.","Elena Vasquez (Legal): It is proven wrong this week, Chris. Context only.","Nadia Rahim: agreed — and the post-reboot snapshot declares itself."]}],"question":"Sort every locker item into the exhibit register before 17:00.","hint":"Constraint to keep in mind: an exhibit must reflect the intrusion window — not the state after someone touched the device.","explanation":"<p>The route-table export is the core exhibit: original, hashed, read-only, captured inside the window. The flow records corroborate it from an independent system, which is what makes the pair strong. The zero-row NetFlow result is declared as an information gap — hiding it would be the one thing Legal cannot defend. The 2019 CMDB diagram is the best-practice-wrong case: a trusted source of truth that was proven wrong this week is context, never evidence of the layout. The post-reboot snapshot and the playlist fail relevance: one reflects Thursday's reboot rather than the intrusion window, the other is noise that happens to have a hash. A hash proves integrity, not relevance.<\/p><p><b>Study this:<\/b> exhibit discipline — original, hashed, relevant, in-window — and the difference between corroborating telemetry, declared gaps, and context.<\/p>","slots":[{"label":"Admissible exhibit (core)","accept":"a1","why":"Original, hashed, read-only capture of the disputed state — the exhibit that survives scrutiny."},{"label":"Corroborating telemetry","accept":"a2","why":"Independent SIEM flows for the same window corroborate the route export."},{"label":"Declared information gap","accept":"a3","why":"The empty window must be declared as a gap, not hidden or filled."},{"label":"Context only — excluded from layout claims","accept":"a4","why":"The 2019 diagram is contradicted by live data; it is background, not evidence."}],"chips":[{"k":"a1","t":"Read-only route-table export with SHA-256 and timestamp","why":"Original, hashed, captured read-only inside the window — the definition of admissible."},{"k":"a2","t":"CoreSight flow records for the 03:12 window","why":"Independent telemetry for the same window; it corroborates without depending on the router."},{"k":"a3","t":"NetFlow rows 03:05-03:20 — retention query returned zero","why":"An empty query result is an information gap to declare, exactly as the custody memo requires."},{"k":"a4","t":"2019 CMDB logical diagram, never reconciled","why":"Proven wrong this week: the widely trusted source of truth is context only here."},{"k":"c5","t":"Gateway state snapshot captured after Thursday's test reboot","why":"Post-reboot state reflects the reboot, not the intrusion window; it is declared, not exhibited."},{"k":"c6","t":"Digital signage playlist export, Q2","why":"Realistic, hashed, and completely irrelevant to topology — pure noise in the locker."}]}]};

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(src){var a=src.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.;:!]+$/,'');}
function fmtClock(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function fmt1(x){var v=(Math.round(x*100)/100).toFixed(2);return v.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');}
function fmt2(x){return (Math.round(x*100)/100).toFixed(2);}
function pct(sum,count){return count>0?Math.round((sum/count)*100):0;}
