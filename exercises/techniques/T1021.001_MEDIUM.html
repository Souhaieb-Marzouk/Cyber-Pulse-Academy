<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.001 Remote Desktop Protocol — MEDIUM</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.001","attackName":"Remote Desktop Protocol","objectType":"sub-technique","severity":"MEDIUM","topicId":"t1021.001","batch":2,"title":"T1021.001 Remote Desktop Protocol — MEDIUM","difficulty":"medium","estimatedMinutes":35,"timerMinutes":35,"questionCount":16,"passMark":70,"learn":["You will learn how T1021.001 — the Remote Desktop Protocol sub-technique of T1021 in the MITRE ATT&CK Lateral Movement tactic — leaves traces across several Windows logs, and how analysts turn those traces into a session timeline.","You will see who works with this daily: SOC analysts filter event exports, threat hunters write reconnect queries, detection engineers turn 4624 type 10 patterns into alerts, and purple teams replay the operator chain from stolen credential to desktop.","You will practise with wevtutil query-events, quser against a remote host, and merged exports that mix Security, LocalSessionManager and RemoteConnectionManager lines in one stream.","Your daily tasks: tell fresh logons from reconnects and unlocks, name the listener event that exposes the client address, and explain why NLA and CredSSP change what an unauthenticated probe can see.","The risks: calling a disconnect a logoff, or an attempt a success, sends teams chasing ghosts — while a missed type 10 logon from an unknown subnet lets a real intruder settle in quietly."],"keywords":[{"theme":"Telemetry & Log Sources","items":["Security 4624 logon type 10","Security 4778/4779 window-station pair","TerminalServices-LocalSessionManager 21/24/25","TerminalServices-RemoteConnectionManager 1149","wevtutil qe channel export"]},{"theme":"Session Lifecycle & Authentication","items":["NLA before the desktop loads","CredSSP handshake","logon type 7 unlock versus fresh type 10","disconnect, reconnect and logoff moments","TCP 3389 plus UDP 3389"]},{"theme":"Enablement & Hardening","items":["fDenyTSConnections master switch","UserAuthentication NLA value","Remote Desktop Users group trimming","jump host subnet restrictions","account tiering"]}]}</script>

var META = {"attackId":"T1021.001","attackName":"Remote Desktop Protocol","objectType":"sub-technique","severity":"MEDIUM","topicId":"t1021.001","batch":2,"title":"T1021.001 Remote Desktop Protocol — MEDIUM","difficulty":"medium","estimatedMinutes":35,"timerMinutes":35,"questionCount":16,"passMark":70,"learn":["You will learn how T1021.001 — the Remote Desktop Protocol sub-technique of T1021 in the MITRE ATT&CK Lateral Movement tactic — leaves traces across several Windows logs, and how analysts turn those traces into a session timeline.","You will see who works with this daily: SOC analysts filter event exports, threat hunters write reconnect queries, detection engineers turn 4624 type 10 patterns into alerts, and purple teams replay the operator chain from stolen credential to desktop.","You will practise with wevtutil query-events, quser against a remote host, and merged exports that mix Security, LocalSessionManager and RemoteConnectionManager lines in one stream.","Your daily tasks: tell fresh logons from reconnects and unlocks, name the listener event that exposes the client address, and explain why NLA and CredSSP change what an unauthenticated probe can see.","The risks: calling a disconnect a logoff, or an attempt a success, sends teams chasing ghosts — while a missed type 10 logon from an unknown subnet lets a real intruder settle in quietly."],"keywords":[{"theme":"Telemetry & Log Sources","items":["Security 4624 logon type 10","Security 4778/4779 window-station pair","TerminalServices-LocalSessionManager 21/24/25","TerminalServices-RemoteConnectionManager 1149","wevtutil qe channel export"]},{"theme":"Session Lifecycle & Authentication","items":["NLA before the desktop loads","CredSSP handshake","logon type 7 unlock versus fresh type 10","disconnect, reconnect and logoff moments","TCP 3389 plus UDP 3389"]},{"theme":"Enablement & Hardening","items":["fDenyTSConnections master switch","UserAuthentication NLA value","Remote Desktop Users group trimming","jump host subnet restrictions","account tiering"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"NLA and the missing login screen","summary":"Concept: CredSSP proves users pre-session.","scenario":"Ashgrove Insurance enforces NLA on SRV-APP12 after a pentest finding. Weeks later the red team demonstrates that their unauthenticated listener probe receives no login screen at all, and the blue team must explain why in the post-incident review. Two facts connect here: what NLA requires, and at which point of the connection it finishes.","question":"Why does NLA leave the listener probe without a login screen?","hint":"Which protocol does NLA ride on, and when does it finish its work?","explanation":"NLA uses CredSSP to finish user authentication during the connection sequence, before the full desktop session is created, so unauthenticated clients never receive a login screen.\n\nThe other options confuse NLA with transport encryption, port-knocking myths or name resolution. In the review this matters because the finding is closed by design, not by a firewall trick.","study":"Study the CredSSP handshake order inside an RDP connection sequence.","options":["CredSSP proves the user before the session starts","CredSSP encrypts the desktop after login completes","TLS blocks probes until a port knock arrives","NLA hides the server until DNS is resolved"],"correct":0},{"id":"e02","type":"multi","title":"Proof of a fresh session","summary":"Multi: the two records that mark session start.","scenario":"You are writing the hunting query library for Ashgrove Insurance and the first card must state exactly which records prove that a NEW RDP session started on a host. Two entries in the card are deliberately wrong so it teaches the contrast between starts, drops and failures.","question":"Select the two records that prove a new RDP session started:","hint":"One record is from Security, one from LocalSessionManager; the wrong ones are other moments.","explanation":"A fresh RDP logon writes 4624 with logon type 10 in Security and event 21 in LocalSessionManager. Event 24 marks a disconnect of an existing session, 4624 type 3 is a network logon such as a share access, and 4625 records a FAILED logon.\n\nHunt queries that forget the logon type or pick the disconnect event badly over-count sessions, and the resulting noise erodes trust in the whole library.","study":"Study which events mark session start, disconnect, reconnect and logoff.","options":["Security 4624 with logon type 10","LocalSessionManager event 21","LocalSessionManager event 24","Security 4624 with logon type 3","Security 4625 for a failed RDP logon"],"correct":[0,1]},{"id":"e03","type":"match","title":"Event card sort","summary":"Match: five event IDs to their moments.","scenario":"The detection team at Ashgrove Insurance sorts a whiteboard full of event IDs into a cheat-card for the new alert definitions. The card must separate what the Security log writes from what the TerminalServices operational logs write, because the hunting queries use different channels for each side.","question":"Match each event to the moment it records:","hint":"Reconnect and disconnect have a pair each; the listener event is not a logon.","explanation":"4624 type 10 is the RDP logon itself. 4778 and 4779 are the window-station reconnect and disconnect pair in Security. 1149 shows the listener accepting an attempt together with the client address, and 25 is the LocalSessionManager reconnection record.\n\nTelling attempts (1149) apart from successes (4624) is the difference between 'someone knocked' and 'someone walked in' — the alerts and the response differ completely.","study":"Study event pairs: 4778/4779 in Security, 24/25 in LocalSessionManager.","pairs":[{"left":"Security 4624 type 10","right":"successful RDP logon"},{"left":"Security 4778","right":"session reconnected to a window station"},{"left":"Security 4779","right":"session disconnected from a window station"},{"left":"RemoteConnectionManager 1149","right":"listener accepted a connection attempt"},{"left":"LocalSessionManager 25","right":"session reconnection succeeded"}]},{"id":"e04","type":"order","title":"From stolen password to desktop","summary":"Order: the operator's five-step chain.","scenario":"Ashgrove Insurance runs a purple-team drill modelled on public reporting of intrusions where a single stolen helpdesk password becomes an interactive session on a server. The five cards below are the operator's chain; some steps prepare access, one monetises it, and each card enables the next.","question":"Rebuild the operator's chain from credential theft to hands-on access:","hint":"Prove the credential works before using it; the fresh session is what gets dumped.","explanation":"The chain runs: harvest, verify against the port, log on, stage storage on the redirected drive, then harvest new credentials from the interactive session.\n\nAttacker view: each step is quiet on its own — one TCP connect, one type 10 logon, one mapped drive — but stacked inside an hour they form the classic lateral-movement shape. This is why correlation beats single-event alerts.","study":"Study how single benign events stack into a lateral-movement chain.","items":["Harvest a password from a leaked helpdesk email","Test the password against TCP 3389 on SRV-APP12","Log on with mstsc using the helpdesk account","Map a tsclient drive to hold copied files","Dump credentials from the fresh interactive session"]},{"id":"e05","type":"fill","title":"Onboarding sentence fill","summary":"Fill: CredSSP and the UDP port.","scenario":"The Ashgrove Insurance runbook for server onboarding includes one sentence about how RDP authenticates and transports data. A contractor replaced two words with blanks on purpose, so every new engineer fills them in during their first week as a small knowledge check before they get production access.","question":"Fill the two protocol and port blanks from the bank:","hint":"One blank is a protocol NLA rides on, one is a port number RDP shares with TCP.","explanation":"NLA finishes through the CredSSP protocol before the desktop loads, and beside TCP 3389 the service binds UDP 3389 to carry lossy data such as screen updates.\n\nNTLM and Kerberos sit underneath CredSSP in real deployments, but the runbook names the handshake protocol itself; 445 belongs to SMB and 3390 is a common misleading port guess.","study":"Study the RDP connection sequence: CredSSP authentication, then TCP and UDP 3389 transports.","text":"Network Level Authentication finishes through the ___ protocol before the desktop loads, and beside TCP 3389 the service binds UDP ___ to carry lossy data such as screen updates.","blanks":["CredSSP","3389"],"bank":["CredSSP","3389","NTLM","445","Kerberos","3390"]},{"id":"e06","type":"terminal","title":"Export the session channel","summary":"Terminal: wevtutil qe on LocalSessionManager.","scenario":"The jump host OPS-JUMP01 is the only box allowed to RDP into servers at Ashgrove Insurance. From a shell already open on SRV-APP12 you export the LocalSessionManager channel for the last shift, read-only, for the daily note that goes to the team lead before 09:00.","question":"Run the command that queries the LocalSessionManager channel in text form:","hint":"qe queries events; name the full channel in quotes and ask for text.","explanation":"wevtutil qe reads an event channel; the full LocalSessionManager channel name goes in quotes, /c:10 caps the count and /f:text keeps the output readable for the note.\n\nwevtutil cl would clear the whole channel — never run it during triage. Also keep the channels straight: LocalSessionManager is about sessions, RemoteConnectionManager is about attempts reaching the listener.","study":"Study wevtutil qe syntax: /q: XPath filters, /c: count, /rd: direction.","prompt":"responder@srv-app12>","skill":"rdp-log-export","knownTools":["wevtutil","netstat","tasklist","reg"],"expected":"wevtutil qe \"Microsoft-Windows-TerminalServices-LocalSessionManager/Operational\" /c:10 /f:text","elements":[{"label":"the wevtutil query-events action","any":["wevtutil qe"]},{"label":"the LocalSessionManager channel","any":["localsessionmanager/operational"]},{"label":"the /f:text output format","any":["/f:text"]}],"forbidden":[{"any":["wevtutil cl"],"why":"cl clears (wipes) an event channel — that destroys evidence"}],"output":["Event 21: Session logon succeeded, user=k.osei, session=3","Event 22: Shell start notification received, user=k.osei","Event 24: Session disconnected, user=k.osei, session=3","Event 25: Session reconnection succeeded, user=k.osei","Export captured 10 records, newest first."]},{"id":"e07","type":"logview","title":"Disconnect, reconnect or logoff?","summary":"Logview: pin the first disconnect moment.","scenario":"A trainee at Ashgrove Insurance mixed up disconnects, reconnects and logoffs in the shift note for OPS-JUMP01. The merged export below shows Security and LocalSessionManager lines in one stream; fix the trainee's note by picking the right timestamp, and be ready to explain the difference on the call.","question":"Which timestamp marks the first disconnect of k.osei's session?","hint":"A disconnect keeps the session alive; a logoff ends it.","explanation":"The first disconnect is the 19:47:03 event 24 — the session stays assigned and the user returns with a 25 reconnect later. The 20:31 window-station disconnect (4779) is a second drop, 20:40 is a reconnect, and 21:12 is the true logoff pair (23 plus 4647).\n\nConfusing the disconnect moment with the logoff moment inflates 'attackers on the jump host' counts and sends teams chasing sessions that never actually ended.","study":"Study the session lifecycle: logon, disconnect, reconnect, logoff.","filterable":true,"log":{"header":["time","event","detail"],"lines":["18:02:11  4624  Type 10  user=k.osei   src=10[.]33[.]7[.]52  host=OPS-JUMP01","18:02:12  21    session logon        user=k.osei   session=3","19:47:03  24    session disconnect   user=k.osei   session=3","19:55:26  25    session reconnect    user=k.osei   session=3","20:31:44  4779  window station disconnected  user=k.osei","20:31:45  24    session disconnect   user=k.osei   session=3","20:40:12  4778  window station reconnected   user=k.osei","20:40:13  25    session reconnect    user=k.osei   session=3","21:12:50  23    session logoff       user=k.osei   session=3","21:12:51  4647  user-initiated logoff  user=k.osei","22:15:08  4624  Type 10  user=m.tanaka  src=10[.]33[.]7[.]52  host=OPS-JUMP01","22:15:09  21    session logon        user=m.tanaka  session=4"]},"widget":{"type":"mcq","question":"At which timestamp did k.osei's session first disconnect?","options":["19:47:03","20:31:44","20:40:12","21:12:50"],"correct":0}},{"id":"e08","type":"decision","title":"3 a.m. helpdesk alert","summary":"Decision: verify, attribute, contain.","scenario":"03:50 — the Ashgrove Insurance SIEM raises an alert: twelve 4625 failures (logon type 3) from 10[.]203[.]88[.]4 against SRV-APP12 within four minutes, then one 4624 type 10 success as k.osei from the same address. k.osei is a named helpdesk account that normally works from 10[.]33[.]7[.]x. Work the three steps in order; each locks after you confirm it.","question":"Work the three decision steps in order:","hint":"Guess-then-enter, then attribute, then cut the credential.","explanation":"The alert shape (many failures, then one success) names the attack; attribution (owner call plus session records) decides whether it is misuse or compromise; containment removes the credential and watches the path.\n\nEach step protects the next: skipping attribution leads to over- or under-reaction, and containment without a watching rule invites a repeat with the next stolen password.","study":"Study alert handling: pattern reading, attribution, proportionate containment.","steps":[{"label":"STEP 1 OF 3 — read the shape","prompt":"12 failed 4625 logons, then a successful type 10 for k.osei, all from one address.","question":"What does this pattern most likely show?","options":["Password guessing that ended in one working credential","A service account restarting on schedule","A backup job authenticating with an old password"],"correct":0,"why":"A burst of failures followed by one success is the classic guess-then-enter shape; services and backups do not fail twelve times and then log on interactively."},{"label":"STEP 2 OF 3 — weigh the account","prompt":"k.osei is a named helpdesk account; the source subnet is unknown to the asset list.","question":"What is the sound next move?","options":["Call k.osei's owner while pulling 4778/4779 for the session","Wipe SRV-APP12 and rebuild from a golden image now","Close the alert as a failed login typo"],"correct":0,"why":"Attribution plus session context is cheap and fast; wiping production destroys evidence for a case that may still be an honest typo."},{"label":"STEP 3 OF 3 — contain","prompt":"The owner confirms k.osei did not work at 03:50; the password is compromised.","question":"Which containment is proportionate?","options":["Disable the account, rotate its password, alert on further type 10 for k.osei","Disable all helpdesk accounts for the week","Wait for the next business day and monitor only"],"correct":0,"why":"Killing the credential and the logon path stops the move; disabling every helpdesk account halts the business, and waiting leaves a working password in the attacker's hands."}]},{"id":"e09","type":"match","title":"Baseline settings explained","summary":"Match: four settings to their roles.","scenario":"After the drill, Ashgrove Insurance writes a hardening baseline for every server. The baseline names four settings, but the review board wants each one explained in a single line before they sign it off. You draft the matching lines so the sign-off meeting can move quickly.","question":"Match each baseline setting to the role it plays:","hint":"Two live in the registry, one is a group, one is a firewall collection.","explanation":"fDenyTSConnections is the allow/deny master switch; UserAuthentication (1) requires NLA; Remote Desktop Users grants the logon right to named accounts; the Remote Desktop firewall rule group opens the 3389 transports.\n\nA baseline that misses UserAuthentication leaves pre-auth probing alive, and one that forgets the group leaves every domain user able to attempt a logon.","study":"Study where each RDP setting lives: registry values, groups, firewall rule groups.","pairs":[{"left":"fDenyTSConnections","right":"registry switch that allows or denies RDP"},{"left":"UserAuthentication","right":"registry value that turns NLA on"},{"left":"Remote Desktop Users","right":"group that grants the remote logon right"},{"left":"Remote Desktop rule group","right":"firewall group that opens TCP and UDP 3389"}]},{"id":"e10","type":"order","title":"Hardening rollout order","summary":"Order: GPO, groups, network, alerts, test.","scenario":"The review board signs the RDP baseline and asks the platform team at Ashgrove Insurance to roll it out across SRV-APP12 and its peers without breaking the helpdesk's nightly work. Order the rollout so each step builds on the one before it and nothing breaks mid-flight.","question":"Order the five rollout steps from first to last:","hint":"Authentication and people come before network limits; testing closes the work.","explanation":"First the GPO raises the authentication bar, then group membership is trimmed to named admins, then network reachability shrinks to the jump subnet, then alerting watches for paths outside the pattern, and finally a controlled test proves the helpdesk still works.\n\nDefender view: the order matters because alerting tuned before the pattern exists would drown in noise, and network limits without group trims just push attackers to hunt better accounts.","study":"Study change-safe hardening: identity controls before network controls before alerting.","items":["Require NLA through the domain GPO","Trim the Remote Desktop Users groups to named admins","Limit 3389 to the jump host subnet in the firewall","Alert on type 10 logons from non-jump subnets","Test the path with a runbook mstsc session"]},{"id":"e11","type":"fill","title":"Reconnect pair fill","summary":"Fill: 24, 4779 and 25.","scenario":"The Ashgrove Insurance hunting query for reconnects has three placeholders where the event numbers belong. The analyst who wrote it left for holiday and the query must run for the quarterly review. Fill the placeholders from the bank so the query is faithful to the real event pairs.","question":"Fill the three event-number blanks from the bank:","hint":"Disconnect and reconnect each have a Security and a LocalSessionManager twin.","explanation":"A disconnect writes 24 (LocalSessionManager) and 4779 (Security window station); a reconnect writes 25 and 4778. 21 is the session logon and 4624 the generic logon — useful, but not the disconnect/reconnect pair.\n\nPairs matter because one side alone misses legacy or filtered sources, and correlating both catches clock-skew gaps between hosts.","study":"Study the 4778/4779 and 24/25 pairs and when each log wins.","text":"When a session drops, LocalSessionManager writes event ___ and Security writes ___; when the user returns, LocalSessionManager writes ___ and Security writes 4778.","blanks":["24","4779","25"],"bank":["24","4779","25","21","4778","4624"]},{"id":"e12","type":"logview","title":"The listener's view","summary":"Logview: event 1149 and its address field.","scenario":"The Ashgrove Insurance network team captured the listener-side view of the 02:41 wave against SRV-APP12 and pasted it into the ticket. You annotate which event gives the client address, so responders understand why the source subnet was visible before any logon succeeded or failed.","question":"Complete the annotation about the listener event and its address field:","hint":"The event number sits at the top of every line; the field name is camel case.","explanation":"Event 1149 fires in the TerminalServices-RemoteConnectionManager log when the listener accepts a connection attempt, and its ClientAddress field names the source before any authentication result exists.\n\nThat is why the 02:41 entry shows the odd subnet while the logon results (4625 failures, later one type 10 success) land in Security. Attempts and outcomes live in different channels on purpose.","study":"Study the RemoteConnectionManager log and the fields event 1149 reports.","filterable":true,"log":{"header":["time","event","detail"],"lines":["02:41:10  1149  listener accepted  user=k.osei  domain=ASHGROVE  src=10[.]203[.]88[.]4","02:41:11  4625  failed logon  type 3  user=k.osei  src=10[.]203[.]88[.]4","02:42:03  4625  failed logon  type 3  user=k.osei  src=10[.]203[.]88[.]4","02:58:07  1149  listener accepted  user=k.osei  domain=ASHGROVE  src=10[.]203[.]88[.]4","02:58:08  4624  type 10  user=k.osei  src=10[.]203[.]88[.]4","02:58:09  21    session logon  user=k.osei  session=2","07:15:44  1149  listener accepted  user=adm_billing  domain=ASHGROVE  src=10[.]33[.]7[.]52","07:15:45  4624  type 10  user=adm_billing  src=10[.]33[.]7[.]52","07:15:46  21    session logon  user=adm_billing  session=3"]},"widget":{"type":"fill","question":"Which event records the listener attempt, and which field holds the source address?","text":"Event ___ records the listener accepting a connection attempt, and the source address in its ___ field tells you where the client came from.","blanks":["1149","ClientAddress"],"bank":["1149","ClientAddress","21","SourceAddress","DestAddress","4624"]}},{"id":"e13","type":"mcq","title":"Two similar nights","summary":"MCQ: which night deserves the chase.","scenario":"Two nights look similar at Ashgrove Insurance. Night A: one type 10 logon for adm_billing from OPS-JUMP01 at 07:15, inside a documented change window. Night B: one type 10 logon for the same account at 07:15, but the source is HR-WS233 — a workstation never used for admin work — and no ticket exists. Both nights passed the 'has a type 10' alert unchanged.","question":"Which difference makes Night B the alert worth chasing?","hint":"Ask what the jump-host design promises about sources.","explanation":"The jump-host design promises that admin RDP comes from OPS-JUMP01; Night B breaks that promise while everything else stays ordinary. Same hour, same account, same event type — only the source carries the signal.\n\nThis is the alarming-looks-benign trap: one field in an otherwise boring event carries the whole meaning, so detections must key on the pattern that matters rather than on loudness.","study":"Study source-aware detections: key alerts on broken baselines, not volume.","options":["The source host is out of pattern","The logon happened at a routine hour","The account is a billing administrator","The alert matched a type 10 logon"],"correct":0},{"id":"e14","type":"terminal","title":"Who is on SRV-APP12?","summary":"Terminal: quser against a remote host.","scenario":"The Ashgrove Insurance response bridge needs a quick list of who is logged on to SRV-APP12 right now, with session IDs, for the call. From the response workstation you run one read-only query against the server and paste the table into the bridge chat before the next speaker starts.","question":"Run the read-only command that lists logon sessions on SRV-APP12:","hint":"quser answers 'who is logged on'; aim it with /server:.","explanation":"quser /server:SRV-APP12 lists users with session names, IDs, states and idle time — read-only and quick. The session ID column feeds the next commands, so capture it into the timeline.\n\nrwinsta or 'reset session' would disconnect real users mid-response; the bridge wants observation first. Idle time also helps: the 02:58 session shows none, meaning someone is driving it right now.","study":"Study quser output columns and which follow-up reads stay read-only.","prompt":"responder@soc-ws11>","skill":"rdp-session-enum","knownTools":["quser","qwinsta","tscon","mstsc"],"expected":"quser /server:SRV-APP12","elements":[{"label":"the quser query tool","any":["quser"]},{"label":"the /server: switch naming SRV-APP12","any":["/server:srv-app12"]}],"forbidden":[{"any":["rwinsta","reset session"],"why":"those reset (kick) sessions — destructive during a live response"}],"output":[" USERNAME     SESSIONNAME  ID  STATE   IDLE  LOGONTIME"," k.osei       rdp-tcp#2    2   Active  .     02:58"," adm_billing  rdp-tcp#3    3   Active  12    07:15","Session 2 matches the incident logon from 02:58."]},{"id":"e15","type":"fill","title":"Fresh logon or unlock?","summary":"Fill: type 10, event 21, type 7.","scenario":"A junior hunter at Ashgrove Insurance finds a 4624 with logon type 7 on SRV-APP12 and calls it a new RDP logon. The senior rewrites the cheat-card so the difference between a fresh session and an unlocked one is explicit, leaving three blanks to complete before the card goes live.","question":"Complete the fresh-session versus unlock card from the bank:","hint":"Fresh sessions pair two numbers; unlock has its own logon type.","explanation":"A fresh RDP logon pairs 4624 type 10 with LocalSessionManager 21. Reconnecting to an existing session can surface as logon type 7 (unlock), which is not a new logon at all — the session was already there.\n\nHunt queries that count type 7 as fresh access overstate attacker activity; keep start, unlock and reconnect separate in the query library.","study":"Study logon type 7 (unlock) and how RDP reconnects surface in the logs.","text":"A fresh RDP logon pairs Security 4624 type ___ with LocalSessionManager event ___, while an UNLOCK of an existing session shows logon type ___ instead.","blanks":["10","21","7"],"bank":["10","21","7","3","24","5"]},{"id":"e16","type":"match","title":"Controls and the moves they break","summary":"Match: four controls to attacker moves.","scenario":"The board asks the Ashgrove Insurance CISO office to justify each RDP control with the attack it removes. One line each goes into the ri /* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null) return;
  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";
  res.items.forEach(function(it){
    var ic = it.state === "ok" ? "✓" : (it.state === "bad" ? "✗" : "○");
    rows += '<div class="fi ' + it.state + '"><span class="ic" aria-hidden="true">' + ic + '</span><span>' + esc(String(it.text).replace(/^[✓✗○]\s*/, "")) + "</span></div>";
  });
  (res.warn || []).forEach(function(wn){
    rows += '<div class="fi warn"><span class="ic" aria-hidden="true">⚠</span><span>' + esc(wn) + "</span></div>";

  var explain = String(ex.explanation).split(/\n\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  var canon = res.canon ? '<div class="mono" role="figure" aria-label="Canonical command">canonical: ' + esc(res.canon) + "</div>" : "";
  $("fbslot").innerHTML = '<div class="fb ' + res.head + '" role="status">' +
    '<div class="fb-head"><span aria-hidden="true">' + (res.head === "ok" ? "✓" : res.head === "bad" ? "✗" : "✓") + "</span><span>" + esc(res.headText.replace(/^[✓✗]\s*/, "")) + '</span><span class="fb-credit">credit ' + res.credit.toFixed(2) + " / 1.00" +
    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +
    '<div class="fb-explain">' + explain + '<div class="fb-study">📚 ' + esc(ex.study) + "</div></div>" +
    "</div></div>";
  $("btn-check").disabled = true;
  $("btn-check").textContent = "✓ Checked";
  var nb = $("btn-next");
  nb.disabled = false;
  nb.focus();

  nb.innerHTML = S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise");
  $("actnote").textContent = "";

}

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null || S.hintsUsed[i]) return;
  S.hintsUsed[i] = true;
  $("hintslot").innerHTML = hintHTML(ex);
  $("btn-hint").disabled = true;
  updateHeader();
}
function showReview(){
  S.screen = "review";
  S.phase = "review";
  S.reviewPos = -1;
  var pend = pendingSkips();
  S.reviewTotal = pend.length;
  var m = $("main");
  if(pend.length === 0){ finish(); return; }
  var rows = pend.map(function(exIdx, k){
    var ex = EXAMS[exIdx];
    return '<div class="revrow"><span class="rn">#' + (k + 1) + '</span><span class="rt"><b>' + esc(ex.title) + "</b> — " + esc(ex.summary) + "</span>" +
      '<span class="badge-skip">⚠ Skipped</span><button class="btn" data-ex="' + exIdx + '" type="button">Answer now</button></div>';
  }).join("");
  m.innerHTML =
    '<section class="blk blk-question" style="--blk:var(--amber)"><div class="blk-label"><span class="dot"></span>REVIEW SKIPPED EXERCISES</div>' +
    '<p class="q-text">You skipped ' + pend.length + ' exercise' + (pend.length > 1 ? "s" : "") + '.</p>' +
    '<p class="scen-body" style="color:var(--ink-dim);margin:8px 0 14px">Answer them now, or leave them — exercises you never answer are excluded from both your score and the total. <span class="dim">The timer is still running.</span></p>' +
    '<div class="revlist">' + rows + "</div>" +
    '<div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="btn-finish" type="button">Finish exam — see results</button></div></section>';
  var btns = byClass(m, "btn");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      if(btn.hasAttribute("data-ex")){
        btn.addEventListener("click", function(){
          S.idx = S.order.indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          S.reviewPos = pendingSkips().indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          renderReviewItem();
        });
      }
    })(btns[b]);
  }
  $("btn-finish").addEventListener("click", function(){ finish(); });
  updateHeader();
}
function renderReviewItem(){
  var exIdx = curPos();
  S.screen = "review";
  renderExercise();
  var nb = $("btn-next");
  nb.innerHTML = "Back to review list";
  updateHeader();
}
function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
