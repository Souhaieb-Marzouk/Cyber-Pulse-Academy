<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.006 Windows Remote Management — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

var EXAMS = [{"id":"e01","type":"logview","title":"The CI node's hourly rounds","summary":"Baseline the jenkins automation and find the odd session.","scenario":"Hanse-Metall's CI node BUILD-NODE02 remotes to APP-KPI02 every hour under svc_jenkins and always runs the same three Get-* commands — the deployment smoke test. The export below covers 09:00 to 13:00 on one morning. One session does not fit the shape. Filter, compare, and complete the hunt note.","question":"Complete the hunt note from the log:","hint":"The hourly rows differ only in the hour; two rows break the shape.","explanation":"Every hourly session runs the same three Get-* commands — that is the CI smoke test and pure noise. At 11:52:17 the same account runs local-admin enumeration and then copies a tool from the jump host's hidden share: recon plus staging, in CI clothing. The note records the first off-pattern timestamp and the source of the dropped file. Treating the hourly rows as anomalies would bury the real hit in noise.","study":"Study baselining automation accounts: fixed commands, fixed hours, everything else is a candidate finding.","filterable":true,"log":{"header":["time","event","detail"],"lines":["09:00:03  4104  ScriptBlock: Get-Service KpiCore  user=svc_jenkins","09:00:04  4104  ScriptBlock: Get-Process -Name KpiWorker  user=svc_jenkins","09:00:05  4104  ScriptBlock: Get-Content D:\\kpi\\build.id  user=svc_jenkins","10:00:03  4104  ScriptBlock: Get-Service KpiCore  user=svc_jenkins","10:00:04  4104  ScriptBlock: Get-Process -Name KpiWorker  user=svc_jenkins","10:00:05  4104  ScriptBlock: Get-Content D:\\kpi\\build.id  user=svc_jenkins","11:00:03  4104  ScriptBlock: Get-Service KpiCore  user=svc_jenkins","11:00:04  4104  ScriptBlock: Get-Process -Name KpiWorker  user=svc_jenkins","11:00:05  4104  ScriptBlock: Get-Content D:\\kpi\\build.id  user=svc_jenkins","11:52:17  4104  ScriptBlock: Get-LocalGroupMember Administrators  user=svc_jenkins","11:52:18  4104  ScriptBlock: Copy-Item \\\\CORP-JMP05\\it$\\tools\\r.exe D:\\kpi\\  user=svc_jenkins","12:00:03  4104  ScriptBlock: Get-Service KpiCore  user=svc_jenkins","12:00:04  4104  ScriptBlock: Get-Process -Name KpiWorker  user=svc_jenkins","12:00:05  4104  ScriptBlock: Get-Content D:\\kpi\\build.id  user=svc_jenkins","13:00:03  4104  ScriptBlock: Get-Service KpiCore  user=svc_jenkins","13:00:04  4104  ScriptBlock: Get-Process -Name KpiWorker  user=svc_jenkins","13:00:05  4104  ScriptBlock: Get-Content D:\\kpi\\build.id  user=svc_jenkins"]},"widget":{"type":"fill","question":"Fill the hunt note from the export:","text":"The off-pattern 4104 lines appear at ___ and the second one drops a file from ___ .","blanks":["11:52:17","CORP-JMP05"],"bank":["11:52:17","CORP-JMP05","09:00:03","BUILD-NODE02","Copy-Item","Get-Service"]}},{"id":"e02","type":"decision","title":"The CI session that was not CI","summary":"Escalate with evidence, do not smash the floor.","scenario":"The 11:52 session continues: the SOC owns the hunt note, the build team is mid-release, and the release manager warns that freezing BUILD-NODE02 costs a customer shipment. Move through the chain; at least one correct step deliberately takes no disruptive action.","question":"Move through the three decision steps:","hint":"One correct step is 'escalate and preserve', not 'isolate everything'.","explanation":"Scoping first: the same off-pattern lines are absent on every other host, so the staging is one host wide. Verification follows: the release manager confirms no CI job ran at 11:52, which makes the session hostile — but the response still avoids destructive moves. The proportionate step is escalating to IR with evidence preserved and watching: killing the build node mid-release hides the operator's next move and costs the shipment.\n\nDefender view: escalation with preserved evidence is an action, not a delay — it buys the IR team a clean picture while the operator still believes the noise worked.","study":"Study proportionate response under business pressure: scope, verify, escalate with evidence.","steps":[{"label":"STEP 1 OF 3 — scope","prompt":"Hunt note: off-pattern 4104 at 11:52 on APP-KPI02, tool copied from CORP-JMP05.","question":"What do you check first?","options":["Search every host for the same 11:52 pattern and the r.exe drop","Freeze BUILD-NODE02 and APP-KPI02 at once","Reply to the release manager that all is well"],"correct":0,"why":"Scoping decides whether you face one host or a chain before any disruptive move."},{"label":"STEP 2 OF 3 — verify","prompt":"No other host shows the pattern; the CI calendar has no 11:52 job.","question":"The release manager insists nothing ran at 11:52. What does that make the session?","options":["Hostile staging under a trusted CI account","A forgotten manual smoke test","A monitoring artefact"],"correct":0,"why":"Calendar plus denial removes the benign explanation; the account was borrowed."},{"label":"STEP 3 OF 3 — act","prompt":"The release completes in forty minutes; the operator's next move is unknown.","question":"Which action fits right now?","options":["Escalate to IR with logs preserved and keep watching the host","Power off BUILD-NODE02 and APP-KPI02 immediately","Delete the 4104 events to stop the alert storm"],"correct":0,"why":"Preserved evidence plus watchfulness catches the next move; a mid-release freeze costs a shipment and blinds you."}]},{"id":"e03","type":"mcq","title":"What JEA actually gives","summary":"Pick the honest description of a JEA endpoint.","scenario":"Hanse-Metall's helpdesk pool enters a JEA endpoint on IT-JIT02 for password resets and service restarts. A new platform manager calls it 'a full admin shell with logging'. The detection engineer disagrees. The shift needs the honest one-sentence description before the manager's slides go out.","question":"Which description of the helpdesk JEA endpoint is correct?","hint":"The endpoint decides which functions exist before anyone types.","explanation":"A JEA endpoint runs a constrained PowerShell space: only whitelisted functions load, commands execute under a virtual account rather than a personal admin, and every session is transcribed. 'A full administrator shell with a transcript' is the dangerous misread — the whole point is that full admin never appears. RDP desktops and hardened listeners describe other access models entirely.","study":"Study JEA fundamentals: role capabilities, session configurations, virtual accounts.","options":["A constrained endpoint with whitelisted functions and a virtual account","A full administrator shell where every command is written to a transcript file","An RDP desktop limited to a few approved applications","A hardened second listener next to the TCP 5986 port"],"correct":0},{"id":"e04","type":"fill","title":"The JEA file types","summary":"Complete the JEA building-blocks sentence.","scenario":"The platform team documents JEA for the auditor: which file whitelists the functions, which file binds the endpoint, and where the evidence of every session lands. You fill the blanks; the auditor will re-read the files themselves afterwards.","question":"Complete the JEA sentence with values from the bank:","hint":"Two extensions rhyme; the third is not a file at all.","explanation":".psrc is the role capability that lists functions, cmdlets and external programs; .pssc is the session configuration that ties the role to groups and the virtual account; and the transcript is the session recording JEA writes automatically. .ps1 and .psm1 are ordinary script and module files, and a snapshot is a VM concept, not JEA evidence.","study":"Study New-PSRoleCapabilityFile and New-PSSessionConfigurationFile and the transcript directory setting.","text":"The whitelisted functions live in a role capability file with the ___ extension, the endpoint binding is defined in a session configuration file with the ___ extension, and every session writes a full ___ to the evidence folder.","blanks":[".psrc",".pssc","transcript"],"bank":[".psrc",".pssc","transcript",".ps1",".psm1","snapshot"]},{"id":"e05","type":"match","title":"JEA parts and their job","summary":"Match each JEA part to what it does.","scenario":"The auditor's checklist names five JEA parts with descriptions that the platform lead calls 'half right at best'. You rebuild the mapping before the review call, because a wrong row here becomes a wrong control next quarter.","question":"Match each JEA part to its real job:","hint":"The session type decides which commands exist at all; the transcript decides what you can prove.","explanation":"The RoleCapabilities folder holds the whitelisted functions. SessionType RestrictedRemoteServer exposes only the small fixed set of session commands, nothing more. RunAsVirtualAccount maps the session to a temporary local account with the rights the role defines — no personal admin password involved. TranscriptDirectory is where sessions are recorded, and Register-PSSessionConfiguration is the cmdlet that binds it all into an endpoint.","study":"Study the five JEA parts as a chain: role, session type, account, transcript, registration.","pairs":[{"left":"RoleCapabilities folder","right":"Holds the whitelisted functions"},{"left":"SessionType RestrictedRemoteServer","right":"Exposes only the fixed session commands"},{"left":"RunAsVirtualAccount","right":"Maps the session to a temporary account"},{"left":"TranscriptDirectory","right":"Where session transcripts land"},{"left":"Register-PSSessionConfiguration","right":"Binds the configuration into an endpoint"}]},{"id":"e06","type":"order","title":"Inside the constrained endpoint","summary":"Order the documented way a JEA endpoint becomes a foothold.","scenario":"Public research on JEA abuse describes how a stolen helpdesk credential can turn a constrained endpoint into full code execution when a role is too generous. Hanse-Metall's red team rehearses the chain in the lab so the blue team learns its fingerprints. Order the steps.","question":"Arrange the steps into the documented order:","hint":"Enumeration comes before escape; persistence comes after escape.","explanation":"The stolen pool credential enters the endpoint first. Enumerating the allowed functions shows which of them can run code — a function that calls scripts from a writable path is the classic gap. Misusing that function escapes the whitelist, and registering a new, permissive session configuration turns the escape into persistence.\n\nAttacker view: the endpoint's own telemetry — transcripts and 4104 — records every step, which is why attackers prefer endpoints whose logging nobody reads.","study":"Study JEA escape research and how over-broad role capabilities are found.","items":["Enter the endpoint with the stolen pool credential","Enumerate the allowed functions and their code paths","Misuse an over-broad function to run arbitrary code","Register a permissive session configuration for persistence"]},{"id":"e07","type":"fill","title":"The custom endpoint","summary":"Complete the endpoint-registration sentence.","scenario":"Hanse-Metall builds a finance read-only endpoint named FinanceRO for the accounting team. The wiki page explains registration, how a client reaches the endpoint, and what the defender reads afterwards. You fill the blanks for the review.","question":"Complete the wiki sentence with values from the bank:","hint":"The parameter that selects an endpoint is not the one that selects a computer.","explanation":"Register-PSSessionConfiguration -Name FinanceRO binds the configuration; the client selects it with Enter-PSSession -ConfigurationName FinanceRO — ComputerName would only choose the host. Transcripts then hold the full session record, richer than any single event line. Listeners are transport endpoints, not session records.","study":"Study -ConfigurationName on the client side and where JEA transcripts default to.","text":"Register-PSSessionConfiguration -Name ___ creates the endpoint, the client reaches it with Enter-PSSession -___ FinanceRO, and afterwards defenders read the session ___ for the full record.","blanks":["FinanceRO","ConfigurationName","transcripts"],"bank":["FinanceRO","ConfigurationName","transcripts","ComputerName","listeners","transcription"]},{"id":"e08","type":"terminal","title":"List session configurations","summary":"Show every registered endpoint and who may enter.","scenario":"During the JEA review you need the inventory: which session configurations exist on IT-JIT02 and which groups hold entry rights. One command, read-only, output trimmed to name and permission. The simulator knows the tools below; registering or removing endpoints is out of scope for an audit.","question":"Run the command that lists every session configuration with its name and permission:","hint":"One cmdlet lists the configurations; Select-Object trims the output to the two audit fields.","explanation":"Get-PSSessionConfiguration lists every registered endpoint; piping to Select-Object Name,Permission gives the audit exactly the entry inventory. Unregister-PSSessionConfiguration deletes an endpoint mid-audit and Set-PSSessionConfiguration edits it — both destroy or alter the thing you are measuring. Enter-PSSession would join an endpoint, not list them.","study":"Study Get-PSSessionConfiguration fields: Name, Permission, PSVersion, RunAsUser.","prompt":"PS C:\\Users\\p.winkler>","skill":"jea-endpoint-audit","knownTools":["Get-PSSessionConfiguration","Register-PSSessionConfiguration","Enter-PSSession","Select-Object"],"expected":"Get-PSSessionConfiguration | Select-Object Name,Permission","elements":[{"label":"the session configuration inventory cmdlet","any":["get-pssessionconfiguration"]},{"label":"the output trimmer","any":["select-object"]},{"label":"the two audit fields","any":["name,permission"]}],"forbidden":[{"any":["unregister-pssessionconfiguration","set-pssessionconfiguration"],"why":"Deleting or editing endpoints during an audit destroys or alters the very configuration under review."}],"output":["Name                  Permission","----                  ----------","FinanceRO             HMG\\AccountingRO AccessGranted","Helpdesk              HMG\\HelpdeskPool AccessGranted","Microsoft.PowerShell  BUILTIN\\Administrators AccessGranted"]},{"id":"e09","type":"mcq","title":"The argument against panic","summary":"Which observation argues the CI remoting is still routine?","scenario":"The SOC debates whether svc_jenkins remoting is compromised after the 11:52 find. Four claims say 'the account is dangerous' — it administers forty hosts, it logs on with type 3 constantly, it ran Copy-Item, one session came from an odd source. One claim, however, argues the hourly pattern itself is still routine automation.","question":"Which observation argues that the hourly pattern is still routine?","hint":"Routine means fixed shape, fixed time, fixed commands — regardless of power.","explanation":"The hourly sessions always run the same three Get-* commands from the build node inside CI windows — that shape is the baseline and stays routine even though the account is powerful. The admin rights, the constant type 3 logons, the odd source and the Copy-Item all argue the opposite: they are exactly why the 11:52 session mattered.","study":"Study argumentation in triage: which facts support 'routine' and which support 'borrowed'.","options":["The hourly sessions always run the same three Get-* commands","The account holds admin rights on forty hosts at once","One session arrived from a consultant workstation","A 4104 line shows a tool being copied over a network share path"],"correct":0},{"id":"e10","type":"multi","title":"Harden without breaking the helpdesk","summary":"Select every control that keeps JEA working.","scenario":"The board wants WinRM risk down by Friday without breaking the helpdesk endpoint, the CI smoke test or monitoring. Five proposals reach your desk; some keep the business running, some quietly break it, and one makes the attacker's life easier.","question":"Select all proposals that reduce risk while keeping the service working:","hint":"One proposal hands out full shells; one widens the network path.","explanation":"Keeping 4104 script block logging on for the JEA endpoint preserves the evidence stream; binding the helpdesk pool to its specific JEA configuration with a virtual account keeps rights minimal; and restricting remoting entry to the documented jump host group through firewall and allow-lists shrinks the attacker's entry set. Full admin PSSessions 'to simplify' destroy the constrained model, and opening TCP 5985 to every VLAN multiplies the entry set — both break the intent.","study":"Study hardening that survives operations: logging, least privilege, entry-set control.","options":["Keep 4104 script block logging on for the JEA endpoint","Bind the helpdesk pool to its specific JEA configuration","Restrict remoting entry to the documented jump host group","Give the helpdesk full admin PSSessions to simplify support","Open TCP 5985 to every VLAN to speed up support"],"correct":[0,1,2]},{"id":"e11","type":"match","title":"Signal, rule, verdict","summary":"Match each telemetry signal to the rule it feeds.","scenario":"The detection engineering team rewrites its WinRM rule pack for Hanse-Metall this quarter. Each signal below feeds exactly one rule; two rules must not fire on the same row or the NOC drowns in doubles. Match them cleanly.","question":"Match each signal to the rule it feeds:","hint":"Three rules are alerts; two are baseline or watchlist entries.","explanation":"Workstation-to-workstation type 3 logons feed the lateral movement alert — servers never remote from desks. wsmprovhost.exe spawning net.exe feeds the in-session discovery alert. 4104 text containing WSMan configuration writes feeds the tampering alert. Hourly Get-* from the build node belongs on the noise watchlist, and a 4648 with a service host as source feeds the explicit credential alert.","study":"Study rule hygiene: one signal, one rule, documented noise watchlists.","pairs":[{"left":"Type 3 from workstation to workstation","right":"Lateral movement alert"},{"left":"wsmprovhost.exe spawning net.exe","right":"In-session discovery alert"},{"left":"4104 writing to WSMan:\\ paths","right":"WinRM tampering alert"},{"left":"Hourly Get-* from the build node","right":"Noise watchlist entry"},{"left":"4648 with a service host as source","right":"Explicit credential alert"}]},{"id":"e12","type":"logview","title":"Monitoring noise hides one stranger","summary":"Separate the monitoring heartbeat from the odd logon.","scenario":"OPS-MON01 remotes to DB-PROD04 every fifteen minutes under svc_opsmon for health checks — the same shape, hour after hour. Security also captured one more type 3 in the window. The export below is compressed to the interesting rows. Complete the duty note.","question":"Complete the duty note from the log:","hint":"The heartbeat rows share one user, one source and one command; exactly one session breaks all three.","explanation":"svc_opsmon rows are the fifteen-minute heartbeat: same source, same single Get-Service command, hour after hour — noise by design. The 12:44 session under k.iwinski from the consultant workstation WKS-CON01 runs two discovery commands against AD — computer inventory and group membership — none of which a health check needs. The duty note names the user, the host and the command count that break the shape.","study":"Study noise-first triage: define the heartbeat, then read only what breaks it.","filterable":true,"log":{"header":["time","event","detail"],"lines":["11:00:02  4624  Type 3  user=svc_opsmon  src=OPS-MON01","11:00:03  4672  Special privileges  user=svc_opsmon","11:00:04  4104  ScriptBlock: Get-Service MSSQLSERVER  user=svc_opsmon","11:15:02  4624  Type 3  user=svc_opsmon  src=OPS-MON01","11:15:03  4672  Special privileges  user=svc_opsmon","11:15:04  4104  ScriptBlock: Get-Service MSSQLSERVER  user=svc_opsmon","12:44:51  4624  Type 3  user=k.iwinski  src=WKS-CON01","12:44:52  4672  Special privileges  user=k.iwinski","12:44:53  4104  ScriptBlock: Get-ADComputer -Filter * -Properties OperatingSystem  user=k.iwinski","12:45:10  4104  ScriptBlock: Get-ADGroupMember 'DB Operations'  user=k.iwinski","12:47:22  4634  Logoff  user=k.iwinski","13:00:02  4624  Type 3  user=svc_opsmon  src=OPS-MON01","13:00:03  4672  Special privileges  user=svc_opsmon","13:00:04  4104  ScriptBlock: Get-Service MSSQLSERVER  user=svc_opsmon"]},"widget":{"type":"fill","question":"Fill the duty note from the export:","text":"Ignoring the heartbeat noise, the odd session belongs to user ___ from host ___ and ran ___ discovery commands.","blanks":["k.iwinski","WKS-CON01","two"],"bank":["k.iwinski","WKS-CON01","two","svc_opsmon","OPS-MON01","three"]}},{"id":"e13","type":"order","title":"When the jump host falls","summary":"Order the five response moves for a compromised jump host.","scenario":"IR confirms an operator held CORP-JMP05 for at least two days and remoted onward to server tiers with stored credentials of admins who had used the host. The server tier stays online; the response must remove the access and find every hop without hiding the trail. Order the moves.","question":"Arrange the five response moves:","hint":"Evidence first, timeline second, rotation third — and the hunt must span the fleet.","explanation":"Preserving logs first keeps PowerShell/Operational and Security intact before anything rotates. Building the source-host timeline shows every hop the operator took. Rotating the exposed credentials then removes the road without waiting for the hunt. Hunting the same source and tool pattern across the fleet finds parallel paths, and the final tiering review stops the next jump host from collecting admin credentials again.\n\nAttacker view: the jump host is a credential pond — every admin who typed there left something in memory, so defenders who rotate late leave the pond stocked.\n\nDefender view: rotation before preservation would destroy the evidence needed to size the intrusion.","study":"Study jump host incident response: preserve, timeline, rotate, hunt, tier.","items":["Preserve PowerShell/Operational and Security logs from CORP-JMP05","Build the timeline of onward remoting by source host and account","Rotate every credential exposed on the jump host","Hunt the tool pattern and source host across the fleet","Review credential tiering so admins stop working from the jump host"]},{"id":"e14","type":"fill","title":"The alias problem, precisely","summary":"Complete the SPN troubleshooting note.","scenario":"Hanse-Metall's automation remotes to the alias KPI-JOB, which points at APP-KPI02. After a DNS cleanup the job fails with a Kerberos name error. The runbook note explains why, the honest fixes, and the fallback nobody may take. Fill the blanks.","question":"Complete the runbook note with values from the bank:","hint":"One blank is a record type Kerberos checks, one is the honest host name, one is the list that downgrades trust.","explanation":"Kerberos matches the name you connect to against the SPN the machine owns; an alias owns none, so the check fails. Registering an SPN for the alias or using the canonical host name fixes it honestly. Falling back to NTLM via TrustedHosts 'works' but downgrades authentication — which is why the runbook forbids it. CNAME is the alias record itself, Kerberos is the protocol that failed, and Basic is an auth scheme unrelated to name checks.","study":"Study SPN anatomy and the exact error text Kerberos name failures produce.","text":"A DNS alias owns no ___ of its own, so Kerberos fails; the honest fixes are SETSPN registration or connecting by the ___ name, while the forbidden fallback is NTLM through the ___ list.","blanks":["SPN","canonical","TrustedHosts"],"bank":["SPN","canonical","TrustedHosts","CNAME","Kerberos","Basic"]},{"id":"e15","type":"decision","title":"The DC that remoted to a member server","summary":"A domain controller opened a WinRM session — decide with the baseline.","scenario":"Tuesday 09:41: DC-HM01 opened a type 3 session to DB-PROD04 under svc_opsmon. Monitoring remotes in the other direction only. The NOC wants the DC isolated; the DB team wants the session ignored; the platform team notes that a monitoring upgrade shipped Monday night. Handle the conflicting signals in order.","question":"Handle the three decision steps in sequence:","hint":"One correct step is deliberately 'no containment yet'.","explanation":"The 4104 text decides first: exactly one Get-Service MSSQLSERVER line matches the monitoring upgrade's new DC-to-DB check shipped Monday night. The schedule check comes second: 09:41 sits inside the upgrade's documented rollout window. Third, with text, schedule and a shipped change all agreeing, containment is disproportionate — record the session, add the new pair to the baseline, and open a tracking ticket. Isolating a production DC on a maybe is the outage nobody needed; ignoring it without the three checks is the breach nobody caught.\n\nDefender view: 'do nothing yet' is a verdict, not a shrug — it needs the same three checks written down.","study":"Study conflicting-signal triage: command text, schedule proof, change record — then decide.","steps":[{"label":"STEP 1 OF 3 — read the text","prompt":"DC-HM01 → DB-PROD04, type 3, svc_opsmon, 09:41.","question":"What decides what the session actually did?","options":["The 4104 command text of that session","The direction of the monitoring heartbeat","The DB team's group membership"],"correct":0,"why":"Command text is the only ground truth about what ran."},{"label":"STEP 2 OF 3 — check the schedule","prompt":"The 4104 shows exactly one Get-Service MSSQLSERVER — the upgrade's new check.","question":"Which proof makes the timing innocent?","options":["The monitoring upgrade's rollout window covers Tuesday 09:41","The DC's uptime of three weeks","The absence of any firewall alert"],"correct":0,"why":"A documented rollout window plus matching text closes the timing question."},{"label":"STEP 3 OF 3 — decide","prompt":"Text, schedule and change record all agree.","question":"Which verdict holds now?","options":["No containment yet — record it, baseline the new pair, open a ticket","Isolate DC-HM01 until the monitoring vendor signs off","Ignore it; monitoring never needs review"],"correct":0,"why":"Three agreeing signals justify watch-and-record; a DC isolation for a verified heartbeat is self-harm."}]},{"id":"e16","type":"terminal","title":"Check the listener hygiene","summary":"List the listener containers read-only.","scenario":"The Friday review needs the listener inventory on DB-PROD04: which transport containers exist, nothing more. You are in a PowerShell prompt with rights on the host. The simulator knows the tools below; listeners are read today and reconfigured never.","question":"Run the read-only command that lists the WinRM listener containers:","hint":"The WSMan drive exposes listeners as child items; a simple listing suffices.","explanation":"Get-ChildItem WSMan:\\localhost\\Listener lists the listener containers with their transport and port values one level down. Remove-Item on the container deletes listeners and kills remoting on a production database host, and winrm delete winrm/config/listener does the same from the classic client — both are reconfigurations, not reviews.","study":"Study the WSMan drive: Listener container, child keys, and the values each transport carries.","prompt":"PS C:\\Users\\p.winkler>","skill":"listener-hygiene-audit","knownTools":["Get-ChildItem","Remove-Item","winrm","Get-Item"],"expected":"Get-ChildItem WSMan:\\localhost\\Listener","elements":[{"label":"the listing cmdlet","any":["get-childitem"]},{"label":"the WSMan listener container path","any":["wsman:\\localhost\\listener"]}],"forbidden":[{"any":["remove-item wsman:\\localhost\\listener","winrm delete winrm/config/listener"],"why":"Deleting listeners stops remoting on a production database host — an inventory must not reconfigure it."}],"output":["Name                Transport   Port","----                ---------   ----","Listener_HTTP1      HTTP        5985","Listener_HTTPS1     HTTPS       5986","[review] read-only listing; no listener changed"]},{"id":"e17","type":"mcq","title":"The tampering line","summary":"Which 4104 finding proves listener tampering?","scenario":"The new 'WinRM tampering' rule fires on four different 4104 lines this month. The detection engineer asks the shift to rank them: one proves someone created an endpoint, the others are reads, restarts or routine checks. Pick the line that earns an incident, not a glance.","question":"Which 4104 line proves a listener was created?","hint":"Look for the verb that adds an object, not the verbs that read or restart.","explanation":"New-Item under the WSMan Listener path creates a fresh listener — a standing change to how the host accepts remoting, and no ticket covers it. Get-ChildItem and Get-Item only read the configuration, and Restart-Service WinRM restarts the service without changing any setting. Reads and restarts get a glance; a created listener gets an incident.","study":"Study the 4104 verbs worth alerting on: New-Item, New-WSManInstance, Set-Item under WSMan paths.","options":["New-Item WSMan:\\localhost\\Listener\\Listener_HTTP9","Get-ChildItem WSMan:\\localhost\\Listener -Recurse -Force","Restart-Service WinRM -Force with verbose output","Get-Item WSMan:\\localhost\\Service and its Auth values"],"correct":0},{"id":"e18","type":"fill","title":"The jump host pond","summary":"Complete the tiering note.","scenario":"The post-incident review writes its first recommendation: stop the jump host from being a credential pond. The note names what accumulates there, the account discipline that prevents it, and the network control that limits where a stolen session may go. Fill the blanks.","question":"Complete the review recommendation with values from the bank:","hint":"One blank is what leaks, one is the account discipline, one is the port that pairs with 5986.","explanation":"Jump hosts accumulate the credentials of every admin who worked from them, which public reporting on intrusion chains describes repeatedly. Tiering separates admin accounts from daily-driver accounts so the pond stops filling, and blocking outbound 5985/5986 except to documented targets limits where a stolen session can go. Tokens are a related memory artefact but the sentence says stored credentials, and 445 or 3389 are other services' ports.","study":"Study credential tiering models and egress control for administration paths.","text":"Public reporting describes chains where a compromised jump host exposes the stored ___ of administrators who used it; the durable fixes are credential ___ for admin accounts and blocking outbound TCP ___ and 5986 from the jump host except to documented targets.","blanks":["credentials","tiering","5985"],"bank":["credentials","tiering","5985","tokens","445","3389"]},{"id":"e19","type":"order","title":"The rule pack that survives Monday","summary":"Order the five steps of the detection rollout.","scenario":"After the incident, Hanse-Metall rebuilds its WinRM rule pack. The order must survive Monday: baselines before alerts, alerts before tuning, tuning before the human review loop. A rule pack deployed backwards buries the NOC in its first hour.","question":"Arrange the five rollout steps:","hint":"You cannot alert on 'new' before you know 'normal'.","explanation":"Baselines per host pair come first — they define 'normal' for the 'new source pair' alert. The new-pair alert is written second and tuned third, with documented automation whitelisted by ticket. The 4104 configuration-write alert follows because it needs no baseline at all, and the weekly JEA transcript review closes the loop with human eyes. Deploying the new-pair alert without baselines fires on every monitoring host in the first hour.","study":"Study detection engineering order: baseline, alert, tune, config-writes, human review.","items":["Baseline remoting pairs per host, account and command shape","Write the new source-pair alert on top of the baseline","Tune the alert with whitelisted automation from tickets","Add the 4104 WSMan configuration-write alert","Schedule the weekly JEA transcript review"]},{"id":"e20","type":"mcq","title":"The JEA debate","summary":"Answer the 'JEA is pointless' claim with the operational truth.","scenario":"In the architecture review, a senior engineer argues: 'JEA is theatre — determined admins and attackers escape constrained endpoints anyway, so hand out domain admin and stop pretending.' The room looks at the JEA transcripts folder, which nobody has opened in a year. You answer for the control.","question":"Which reply holds up against the claim?","hint":"A control can reduce routine risk and generate evidence even if a determined actor can escape.","explanation":"JEA removes routine full-admin risk and its transcripts make every session — including escape attempts — visible and attributable; escape attempts themselves become the highest-value events to monitor. Dropping JEA for domain admin removes both the constraint and the evidence, and claiming JEA cannot be escaped justifies removing the monitoring that makes the debate resolvable. The unread transcripts folder is an argument for a review cadence, not against the control.","study":"Study control arguments: risk reduction versus detectability, and the cost of each alternative.","options":["JEA cuts routine risk and its transcripts make escape visible","Drop JEA and hand out domain admin to end the debate","JEA cannot be escaped at all, so no transcript review is ever needed","Replace JEA with full RDP desktops for every admin task"],"correct":0}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);

}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);

          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {

          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });

function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;

  for(var z = 0; z < n; z++){

    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){

        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });

        if(!isNaN(r)) assign(z, r);
      });

  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }

        e.dataTransfer.setData("text/plain", String(c));

      });
    })(ci);
  }

function renderOrder(ex, root, ans, lock, res){

        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";

        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;

    var it = ans.seq.splice(from, 1)[0];

  }

}
