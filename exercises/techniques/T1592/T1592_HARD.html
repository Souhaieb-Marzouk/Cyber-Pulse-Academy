<script>
var EXAM = {"meta":{"topicId":"t1592","batch":3,"title":"T1592 Gather Victim Host Information — Hard","difficulty":"hard","questionCount":15,"estimatedMinutes":45,"passMark":70},"severity":{"label":"HARD","cls":"hard","meaning":"Two or three interacting ideas. Near-miss answers. Some things look alarming but are benign, and some look benign but are not."},"keywords":[{"theme":"Technique basics","items":["T1592 — Gather Victim Host Information","Technique (object type)","Tactic: Reconnaissance (TA0043)","Pre-compromise phase","Sub-technique T1592.001 Hardware","Sub-technique T1592.002 Software","Sub-technique T1592.003 Firmware","Sub-technique T1592.004 Client Configurations"]},{"theme":"What attackers collect","items":["CPU and RAM details","Device models","BIOS / UEFI versions","Operating system and patch level","Installed software versions","Service banners","SNMP sysDescr strings","Browser and mail client settings"]},{"theme":"How attackers collect","items":["Banner grabbing (curl -I, telnet, netcat)","SNMP queries (snmpwalk) with 'public'","nmap -sV service detection","masscan port sweeps","Shodan / Censys device databases","Wappalyzer / BuiltWith web fingerprinting","Reading victim-owned websites","Job postings and asset leaks"]},{"theme":"Neighbouring techniques","items":["T1589 Gather Victim Identity Information","T1590 Gather Victim Network Information","T1591 Gather Victim Org Information","T1593 Search Open Websites/Domains","T1594 Search Victim-Owned Websites","T1595 Active Scanning","T1595.002 Vulnerability Scanning","T1596 Search Open Technical Databases","T1597 Search Closed Sources"]},{"theme":"Telemetry and detection","items":["Web access logs (method + User-Agent)","Firewall and connection logs","IDS/IPS scanner signatures","DNS analytics","Honeypots","Probe cadence and low-and-slow patterns","False positives: uptime monitors, vendor scans","Tuning with asset and maintenance inventories"]},{"theme":"Mitigations and controls","items":["M1056 Pre-compromise","server_tokens off / banner discipline","Disable SNMP v1/v2c 'public'","Remove end-of-life exposed hosts","Patch and reduce exposed surface","Rate limiting and tarpits","WAF header normalisation"]},{"theme":"Real-world use and roles","items":["SOC alert triage","CTI reporting with ATT&CK IDs","Attack surface management","Detection engineering","Red team OSINT in authorised tests","Exploit tailoring before T1190","Edge-device recon playbooks (Volt Typhoon-style)"]}],"intro":["This exam is about <b>MITRE ATT&amp;CK technique T1592 — Gather Victim Host Information<\/b>. ATT&amp;CK is a free, public knowledge base that describes what real attackers do. Every action gets an ID. T1592 is a <b>Technique<\/b> (an object type that describes one attacker behaviour). It lives inside the <b>Reconnaissance tactic (TA0043)<\/b>. A tactic is a phase of an attack. Reconnaissance is the first phase: it happens <b>before<\/b> the attacker gets into a network. In this phase you will learn how attackers study a victim's computers, and how defenders work with that behaviour.","<b>What the technique describes.<\/b> The attacker collects facts about the victim's hosts (computers and devices). The facts fall into four groups, and each group is a sub-technique with its own ID: <b>T1592.001 Hardware<\/b> (CPU, RAM, device models), <b>T1592.002 Software<\/b> (operating systems, installed programs, exact versions, patch levels), <b>T1592.003 Firmware<\/b> (BIOS/UEFI versions baked into chips), and <b>T1592.004 Client Configurations<\/b> (browser types and versions, mail client settings, VPN client setups on staff devices).","<b>Why attackers do it.<\/b> Host facts make attacks precise. If an attacker learns that a web server runs an old software version, they can search for a known bug in that version. If they learn which remote-access tool a company uses, they can prepare an attack that fits that tool. Good reconnaissance saves the attacker attempts and lowers the chance that noise triggers an alert. This is why T1592 often feeds the next phase, Initial Access, for example exploiting a public-facing application (T1190).","<b>How attackers do it.<\/b> Often from outside the victim's network. They grab service banners (a banner is the short introduction a service sends: for example a web server saying 'Server: nginx/1.18.0'). They query devices with SNMP when the default community string 'public' still works. They scan with tools like nmap or masscan. They read public device databases such as Shodan or Censys, which index banners from millions of exposed devices. They fingerprint web technology from the browser with tools like Wappalyzer.","<b>Where you meet T1592 in real work.<\/b> A <b>SOC analyst<\/b> triages scan alerts and separates real recon from benign scanners. A <b>threat intelligence (CTI) analyst<\/b> maps attacker reports to T1592 and writes briefings with the correct IDs. A <b>detection engineer<\/b> builds analytics on web access logs, firewall logs and IDS alerts to catch fingerprinting. An <b>attack surface management<\/b> or vulnerability management team reduces what leaks: hiding version banners, turning off SNMP 'public', removing end-of-life hosts. A <b>red teamer<\/b> uses the same actions in authorised tests. A <b>GRC analyst<\/b> checks that policies cover information exposure. Deliverables include alert tickets, exposure reports, CTI reports with ATT&amp;CK IDs, and detection rules.","<b>The risk it addresses, and one honest limit.<\/b> If attackers learn your exact versions, their attacks get sharper and harder to spot. Note the limit: much of this activity happens outside your network, so you often cannot see it directly. ATT&amp;CK itself lists the mitigation <b>M1056 Pre-compromise<\/b> for T1592: you cannot stop someone thinking about you, but you can shrink what they learn — and you can watch your edge for probing patterns."],"typeList":"log analysis with a filter box, multiple-choice questions, branching decision trees, matching, terminal emulator exercises, drag & drop, click-the-line artefact analysis, ordering and ranking, multi-select with partial credit","exercises":[{"id":"H01","type":"logview","typeName":"Log analysis","title":"Scan, fingerprint, or exploit?","summary":"Mixed DMZ artefacts with a filter box — separate T1592 from T1595 and T1190.","blocks":[{"k":"p","t":"Friday 01:02. The DMZ web host web02 logged a burst of activity from one outside IP. The SOC lead says: 'Do not classify the whole burst as one thing. Some lines are scanning, some are fingerprinting, and one looks like exploitation. I need the fingerprinting lines for the recon report.' Use the filter box if helpful, then select ALL lines where the actor collects host software/version information (T1592)."},{"k":"art","label":"ARTEFACT — web02 access log and firewall, 01:02–01:05","wrap":true,"lines":["01:02:11 fw: ALLOW tcp 203[.]0[.]113[.]45:51022 -> 192[.]0[.]2[.]10:443","01:02:12 fw: ALLOW tcp 203[.]0[.]113[.]45:51023 -> 192[.]0[.]2[.]10:22","01:02:15 web02: \"HEAD / HTTP/1.1\" 200 - \"python-requests/2.31.0\"","01:02:31 web02: \"GET /cgi-bin/.%2e/.%2e/.%2e/bin/sh HTTP/1.1\" 400 - \"-\"","01:03:02 web02: \"GET / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","01:04:44 web02: \"HEAD /server-info HTTP/1.1\" 403 \"masscan/1.3\""]}],"question":"Select ALL lines where the actor is collecting host software or version information (T1592).","hint":"Ask per line: does it read what the host RUNS (version info), sweep what is OPEN (scan), or try to DO something (exploit)?","explanation":"Line 01:02:15 (HEAD / via python-requests) is banner grabbing: the actor reads response headers to learn the software stack — T1592.002. Line 01:04:44 (HEAD /server-info via masscan) is a version/info endpoint probe — also T1592, even though the server refused it with 403. Line 01:02:12 plus the firewall pair is open-port sweeping: T1595 active scanning, not host facts. Line 01:02:31 is an exploitation attempt against a known path-traversal pattern — that is T1190 territory, past recon. The Chrome/120 GET looks like ordinary browsing. Correlating these three shapes correctly is exactly what separates a recon finding from a wrong incident report.","study":"T1592 (collect host facts) versus T1595 (scan ports) versus T1190 (exploit) — discriminating log shapes.","data":{"lines":["01:02:11 fw: ALLOW tcp 203[.]0[.]113[.]45:51022 -> 192[.]0[.]2[.]10:443","01:02:12 fw: ALLOW tcp 203[.]0[.]113[.]45:51023 -> 192[.]0[.]2[.]10:22","01:02:15 web02: \"HEAD / HTTP/1.1\" 200 - \"python-requests/2.31.0\"","01:02:31 web02: \"GET /cgi-bin/.%2e/.%2e/.%2e/bin/sh HTTP/1.1\" 400 - \"-\"","01:03:02 web02: \"GET / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","01:04:44 web02: \"HEAD /server-info HTTP/1.1\" 403 \"masscan/1.3\""],"mode":"multi","sub":{"options":["01:04:44 HEAD /server-info — masscan UA","01:02:12 firewall ALLOW to port 22","01:02:31 GET /cgi-bin/.%2e/...bin/sh","01:03:02 GET / — Chrome/120 browser","01:02:15 HEAD / — python-requests UA"],"answers":[4,0],"instruction":"Select all that apply. Partial credit applies.","itemWhy":{"4":"Scripted HEAD on the root reads version-bearing headers: T1592.002.","0":"A probe of an info endpoint, refused or not, seeks version facts: T1592."},"wrongWhy":{"1":"Open-port sweep: T1595 active scanning, no host facts gathered.","2":"An exploitation attempt: beyond recon (T1190 territory).","3":"Ordinary browser traffic."}}}},{"id":"H02","type":"qcm","typeName":"Near-miss mapping","title":"Router banner: which sub-technique?","summary":"One device banner, four tempting mappings — pick the precise one.","blocks":[{"k":"p","t":"During a DMZ audit you capture the telnet banner of an edge switch (the team already knows telnet is exposed — that ticket is separate). The banner reads below. The recon report must name exactly one sub-technique for 'collecting the IOS version string'."},{"k":"art","label":"ARTEFACT — edge switch telnet banner","wrap":true,"lines":["User Access Verification","Cisco IOS Software, C2960 Software (C2960-LANLITEK9-M), Version 15.2(2)E","Compiled Wed 26-Jul-23 by prod_rel_team"]}],"question":"Which mapping is the precise one for collecting the IOS version string?","hint":"IOS is the operating system the switch runs. Hardware would be the box itself; firmware would be a BIOS/UEFI-class image.","explanation":"The version string describes the switch's operating system (Cisco IOS), so it is T1592.002 Software. The near-misses are tempting: the box itself is hardware (T1592.001), 'C2960' hints at a model, and embedded device images feel 'firmware-ish' (T1592.003) — but the collected fact is the OS version, and T1590 is about network facts like ranges and DNS, not banner contents. Precision here decides which detections the finding feeds.","study":"Software versus firmware versus hardware classification for network-device banners.","data":{"options":["T1592.002 Software — IOS is the OS the device runs","T1592.001 Hardware — it is a physical network device","T1592.003 Firmware — device images are firmware","T1590 — banners describe the network layer"],"answer":0,"why":"The collected fact is the operating system version: Software. The model string is a secondary hardware hint."}},{"id":"H03","type":"branch","typeName":"Decision tree","title":"Fingerprinting at trading peak","summary":"Four linked decisions on a Friday evening — every option has a cost.","blocks":[{"k":"p","t":"Friday 18:10, peak trading. The e-commerce checkout host shop-web01 shows HEAD probes with rotating User-Agents from 198[.]51[.]100[.]0/24 — bursts of 5, then silence for 20 minutes. Marketing is live with a campaign; any downtime is measured in lost orders per minute. The SOC lead hands you the wheel for four calls."}],"question":"Step through the four decisions and pick the best option each time.","hint":"Business impact is part of every correct answer tonight. Loud moves cost the business; silent moves cost evidence.","explanation":"Step 1: keep serving and start correlation — capture plus log analysis while the campaign runs; taking checkout offline or blocking at the edge during peak are business-destroying moves, and 'watch silently' loses evidence. Step 2: rotating UAs in tidy bursts from one /24 is a distributed slow fingerprinting pattern — CDN health checks come from provider ranges with consistent UAs, crawlers respect patterns, and internal jobs never come from outside. Step 3: HEAD bursts reading headers target software versions (T1592.002); firmware, client configs and identity are different collections. Step 4: the least-aggressive effective action — a WAF rule that normalises HEAD bursts and tarpits repeats — keeps business up and starves the recon. Blocking the /24 risks partner traffic; patching during peak violates the freeze; doing nothing leaves the recon free.","study":"Deciding under business pressure: evidence-keeping, correct interpretation, and least-aggressive containment.","attdef":"Attacker view: burst-and-rest cadence evades simple rate limits. Defender view: normalise and tarpit — make recon slow without breaking service.","data":{"steps":[{"q":"18:12 — first call: what do you do with checkout live?","short":"Correlate while serving","options":["Take shop-web01 offline until Monday","Block 198[.]51[.]100[.]0/24 at the edge right now","Mark the alert informational and watch silently with no capture","Keep serving; start packet capture and correlate logs across the week"],"answer":3,"whyOk":"Keeps revenue flowing and preserves evidence — both matter at peak."},{"q":"18:25 — the burst pattern holds: 5 HEADs, rotating UAs, 20 min rest, one /24. Best interpretation?","short":"Slow distributed fingerprinting","options":["An SEO crawler indexing the shop","A misdirected internal monitoring job","A distributed slow fingerprinting operation","CDN health checks misconfigured"],"answer":2,"whyOk":"Rotating UAs and burst-rest cadence from one external /24 is deliberate recon, not health checks or crawling."},{"q":"18:40 — what is the operation collecting?","short":"Software versions","options":["Employee identities for phishing (T1589)","Host software and version facts (T1592.002)","BIOS/UEFI versions from the fleet (T1592.003)","Browser settings of our customers (T1592.004)"],"answer":1,"whyOk":"HEAD requests target response headers: the software/version layer."},{"q":"18:55 — what do you push to the WAF now?","short":"Least-aggressive containment","options":["Shut the API gateway for the night","Patch the checkout app during peak","Block the whole /24 including partner ranges","A rule that normalises HEAD bursts and tarpits repeats"],"answer":3,"whyOk":"Starves the recon with minimal business cost; the other options cost revenue, evidence, or partners."}]}},{"id":"H04","type":"qcm","typeName":"Dual perspective — red","title":"Red team: cash the intel","summary":"Authorised engagement — turn three banner facts into the next move.","blocks":[{"k":"p","t":"You are the red teamer in an authorised, scoped engagement. Banner grabbing on the target edge returns: vpn01 answers 'OpenVPN 2.4.9'; the portal answers 'nginx/1.20.2'; and the portal login page source reveals 'SolarWinds Serv-U 15.3'. Your engagement rules allow public exploit research against in-scope hosts."},{"k":"art","label":"ARTEFACT — your recon scratchpad","wrap":true,"lines":["vpn01.corp.example  : OpenVPN 2.4.9","portal.corp.example : nginx/1.20.2","portal login page   : SolarWinds Serv-U 15.3"]}],"question":"As the red teamer, what is the highest-value next move enabled by this intel?","hint":"Which collected string is a product name attached to a known vulnerable line? Let the version facts pick the weapon.","explanation":"Serv-U 15.3 is the actionable string: the Serv-U product line had a publicly exploited file-transfer bug family (CVE-2021-35211-era research, and later CVE-2024-5806-class issues), so matching a known bug to that exact product and version is the classic T1592 payoff — recon feeding a targeted exploit attempt (T1190) against an in-scope host. OpenVPN 2.4.9 and nginx 1.20.2 are context but no standing public exploit fits this scenario. Phishing, badge walks, and password brute force ignore the host facts you just paid to collect.","study":"How red teams convert collected versions into exploit selection — and why scope rules matter.","attdef":"Attacker view: the rare product string is the door. Defender view: the portal page source leaked a product name — version and product disclosure is recon fuel.","data":{"options":["Match a known Serv-U bug to 15.3 and plan the exploit","Launch a phishing wave against the full staff list","Plan an on-site badge walk into the main office","Brute-force every login password on vpn01"],"answer":0,"why":"The Serv-U 15.3 string maps to a product line with public bugs — the recon-to-exploit chain."}},{"id":"H05","type":"match","typeName":"Dual perspective — blue","title":"Blue team: catch it next time","summary":"Same recon, blue view: match each telemetry source to its verdict.","blocks":[{"k":"p","t":"Same engagement, now from the defence side: the SOC learns that the authorised red team collected vpn01, portal and Serv-U banners purely from outside, without touching any endpoint or person. The CISO asks which telemetry would have shown it, and wants the blind spots named too. For each source, pick the verdict that survives review."},{"k":"art","label":"ARTEFACT — available telemetry sources","wrap":true,"lines":["A. Edge service access logs: vpn01 + portal, with method and User-Agent fields","B. Endpoint antivirus consoles of employee laptops","C. Payroll system logs","D. Office badge reader data"]}],"question":"Match each telemetry source to its correct verdict for this recon.","hint":"The recon never touched an endpoint or a person. It touched your edge services — where do those services write down every request?","explanation":"Edge service access logs are the earliest and only direct witness: repeated HEAD/GET patterns and odd UAs on vpn01 and portal ARE the fingerprint. Antivirus consoles stay silent because no endpoint was touched; payroll is unrelated to DMZ banners; badge readers record people, not edge requests. This is why detection engineers anchor T1592 analytics on web/access and firewall logs rather than endpoint tooling — the technique's weakness is that it still talks to your services.","study":"Data-source selection for T1592 analytics: edge logs beat endpoint tools for external recon.","attdef":"Defender view: every banner grab is a logged request — make the logs rich and read them. Attacker view: noisy tools expose themselves to exactly these logs.","data":{"left":["vpn01 + portal access logs (method + User-Agent)","Endpoint antivirus consoles","Payroll system logs","Office badge reader data"],"right":["Silent: no endpoint or file was touched","Would surface the fingerprinting earliest","Records people at doors, not edge requests","Unrelated to DMZ banner recon"],"pairs":[1,0,3,2],"itemWhy":["The fingerprinting requests live in these logs.","No endpoint was touched, so AV never sees it.","Payroll has nothing to do with DMZ banners.","Badge data records people, not network recon."]}},{"id":"H06","type":"match","typeName":"Matching","title":"Five artefacts, five techniques","summary":"Match collected artefacts to techniques — two near-miss rows.","blocks":[{"k":"p","t":"From a long engagement report, five collected artefacts need mapping before the finding goes to the client. Two rows are deliberate near-misses: firmware feels like software, and identity feels like host data. Read each row literally."},{"k":"art","label":"ARTEFACT — collected items","wrap":true,"lines":["1. Serial numbers and RAM sizes from an asset spreadsheet","2. Exchange build banner 15.1.2507.0 on mail01","3. BIOS string 'B140 v1.12' collected from laptops","4. Chrome 121 and default proxy settings from staff images","5. The target's public ASN and IP ranges"]}],"question":"Match each artefact to the technique it maps to.","hint":"Spreadsheet hardware = .001. Mail server build = .002. BIOS = .003. Staff app settings = .004. ASN/ranges = T1590.","explanation":"Serial numbers and RAM are physical asset facts: T1592.001 Hardware. The Exchange build is server software: T1592.002. The BIOS string is firmware: T1592.003. Browser and proxy settings from staff devices are client configurations: T1592.004. ASN and IP ranges describe the network, not a host: T1590. The near-misses (calling BIOS 'software', calling ranges 'host data') are exactly the mapping errors reviewers catch in real reports.","study":"Precise artefact-to-technique mapping across the T1592 family and T1590.","data":{"left":["Serial numbers and RAM sizes from an asset spreadsheet","Exchange build banner 15.1.2507.0 on mail01","BIOS string 'B140 v1.12' collected from laptops","Chrome 121 and default proxy settings from staff images","The target's public ASN and IP ranges"],"right":["T1592.003 — Firmware","T1592.002 — Software","T1592.001 — Hardware","T1592.004 — Client Configurations","T1590 — Gather Victim Network Information"],"pairs":[2,1,0,3,4],"itemWhy":["Physical asset facts: hardware.","A mail server build number is software.","BIOS is the firmware layer.","User app settings are client configurations.","ASN and ranges describe the network, not one host."]}},{"id":"H07","type":"terminal","typeName":"Terminal","title":"Quiet service enumeration","summary":"Pick the tool and the flags yourself — no tool named, no aggressive switches.","blocks":[{"k":"p","t":"Attack box: Kali Linux with the usual recon tools installed. Target: 203[.]0[.]113[.]70, a public web host in your client's authorised scope. The client's rules of engagement say: quiet assessment — no OS-guessing scripts, no aggressive timing, and you must enumerate which service versions answer on the target. Choose your tool and flags accordingly."},{"k":"art","label":"Environment","wrap":true,"lines":["Box: Kali (standard recon tools present)","Target: 203[.]0[.]113[.]70 (in scope, public)","Constraint: enumerate SERVICE VERSIONS; stay quiet (no aggressive timing, no OS-guess module)"]}],"question":"Type the single command that enumerates service versions on the target while respecting the constraint. Run it, then Check.","hint":"The service-version detection switch of the classic scanner is one flag. Aggressive mode and timing templates violate the constraint.","explanation":"The canonical command is: nmap -sV 203[.]0[.]113[.]70. nmap is the scanner; -sV performs service/version detection — exactly the deliverable; the target completes it. Near-misses: -sS alone sweeps ports but never asks services what they are (that is T1595 scanning, not version collection); -O guesses the OS, which the client banned; -A is aggressive mode (version + OS + scripts + traceroute) and -T5 is max-speed timing — both violate 'quiet'. If you typed those, the run would have been loud, in scope but against the rules, and detectable.","study":"nmap -sV for version enumeration; why -A/-T5 break quiet-assessment rules.","attdef":"Defender view: version detection is what IDS/IPS scanner signatures watch for. Attacker view: the constraint exists because -A/-T5 fingerprint loudly.","data":{"ps1":"root@kali","banner":["Connected to kali attack box (authorised engagement).","Rules of engagement: quiet assessment on 203[.]0[.]113[.]70."],"simTool":["nmap"],"output":["Starting Nmap 7.94 ( quiet service-version scan )","22/tcp  open  ssh      OpenSSH 8.2p1","443/tcp open  ssl/http nginx/1.20.2","Nmap done: 1 IP address scanned in 4.31 seconds"],"placeholder":"type your scanner command","expected":"nmap -sV 203[.]0[.]113[.]70","required":[{"label":"Scanner tool nmap","all":["nmap"],"why":"The scenario leaves tool choice to you; nmap is the version-enumeration scanner.","whyOk":"Correct tool choice."},{"label":"Service/version flag -sV","any":["-sv"],"why":"-sV is the service and version detection switch.","whyOk":"-sV enumerates service versions."},{"label":"Target 203[.]0[.]113[.]70","all":["203[.]0[.]113[.]70"],"why":"The named in-scope target.","whyOk":"Correct target."}],"forbidden":[{"label":"Aggressive mode (-A) or OS guessing (-O) or -T5 timing","re":"(^|\\s)-a(\\s|$)|(^|\\s)-t5(\\s|$)|(^|\\s)-o(\\s|$)","any":["-t5"],"why":"-A bundles OS guessing and scripts; -T5 screams across the wire. The client banned aggressive and OS-guessing behaviour; these switches also change the scan from recon-quiet to loud."}],"parts":[{"c":"nmap","w":"The network scanner chosen for version enumeration."},{"c":"-sV","w":"Service and version detection: asks open ports what they are."},{"c":"203[.]0[.]113[.]70","w":"The in-scope public target."}]}},{"id":"H08","type":"qcm","typeName":"Benign-or-malicious trap","title":"The 02:00 visitor that looks terrible","summary":"An alarming-looking daily pattern with a boring true story.","blocks":[{"k":"p","t":"Daily at 02:00–02:10, web01 logs HEAD / from 192[.]0[.]2[.]200 with the UA 'SitePulse Monitor/1.0'. Always the same IP, same UA, ten requests, nothing else ever. The analyst on call wants to declare an APT. The asset register shows 192[.]0[.]2[.]200 belongs to 'SitePulse GmbH — availability monitoring', contract SOW-88, '10 head-checks nightly'."}],"question":"What is the correct assessment and handling?","hint":"Compare the pattern to the contract line by line. Then decide what 'handling' means for an expected source.","explanation":"Every attribute of the scary pattern matches a documented, contracted source: same IP, same UA, fixed window, exactly ten head-checks. The correct handling is to document it as expected activity and alert only on deviation (different IP, UA, window, or volume). 'APT staging' has no supporting evidence; ransomware pre-lock and insider exfil do not fit the direction and rhythm. Alarming-looking does not mean malicious — verification against inventories is the analyst's job, and tuning keeps real deviations visible.","study":"Expected-source verification against contracts and asset registers; alerting on deviation.","data":{"options":["Ransomware pre-lock: isolate web01 immediately","Insider exfiltration: suspend the on-call admin","Benign: matches the contract; alert only on deviation","APT staging: declare a major incident right away"],"answer":2,"why":"Pattern matches the signed monitoring contract exactly; deviation-based alerting keeps the defence alive."}},{"id":"H09","type":"qcm","typeName":"Least-aggressive trap","title":"Do not unplug the payments API","summary":"A leaky header, an ops team that wants drama, and a 24/7 API.","blocks":[{"k":"p","t":"Exposure scan finding: the public payments API returns 'Server: nginx/1.18.0' and 'X-Powered-By: Express'. Ops proposes taking the API offline tonight until a rebuild next week. The API processes 24/7 partner payments; every hour down is contractually penalised. No exploitation has been observed."}],"question":"Which action is correct for this finding?","hint":"The finding is an information leak. Match the response's aggressiveness to the actual risk and the business cost.","explanation":"The right action is a config change in the next release window: hide the version tokens (server_tokens off, suppress X-Powered-By) with zero downtime — the leak is information, not compromise. Taking a penalised 24/7 API offline for a header is a wildly disproportionate response; ignoring it permanently leaves free T1592.002 material exposed; a framework rewrite is a project, not a fix. The least-aggressive effective action is the professional default here.","study":"Proportionate response to information-exposure findings; header-discipline config changes.","data":{"options":["Rewrite the API in another framework this month","Strip version headers by config next release window","Take the payments API offline tonight until next week","Ignore the finding permanently; banners do not matter"],"answer":1,"why":"Header changes fix the leak with zero downtime; the other options are disproportionate or negligent."}},{"id":"H10","type":"dragdrop","typeName":"Drag & drop","title":"Map the campaign behaviours","summary":"Six observed behaviours onto six technique slots — two are not T1592.","blocks":[{"k":"p","t":"A threat-hunt report lists six behaviours an actor displayed against your edge. Map each to the correct technique. Careful: two of the six are NOT T1592 at all — one is pure scanning, one is network info."},{"k":"art","label":"ARTEFACT — observed behaviours","wrap":true,"lines":["1. masscan sweep across 1,000 ports on the DMZ range","2. HEAD / bursts reading the Server header on web02","3. Collection of staff laptop BIOS strings via an inventory leak","4. Listing CPU models and RAM of database servers","5. Recording which browser and OS employees use","6. Reading the target's public DNS records and ASN"]}],"question":"Drag each behaviour onto its correct technique.","hint":"Sweeps = scanning. DNS/ASN = network. The four collection behaviours split across the T1592 sub-techniques.","explanation":"The masscan sweep is T1595 Active Scanning: it maps open ports, not host facts. Public DNS/ASN reading is T1590 (network information). The four T1592 splits: HEAD bursts reading Server headers are .002 Software; BIOS strings are .003 Firmware; CPU/RAM listings are .001 Hardware; browser/OS of employees is .004 Client Configurations. Mixing scanning with fingerprinting is the most common mapping error in recon reports — sweeps discover doors, fingerprints describe what is behind them.","study":"T1595 versus T1590 versus the four T1592 sub-techniques.","data":{"buckets":["T1592.001 Hardware","T1592.002 Software","T1592.003 Firmware","T1592.004 Client Configurations","T1595 — Active Scanning","T1590 — Network Information"],"items":[{"t":"masscan sweep across 1,000 DMZ ports","b":4},{"t":"HEAD bursts reading the Server header","b":1},{"t":"BIOS strings collected via an inventory leak","b":2},{"t":"CPU models and RAM of DB servers listed","b":0},{"t":"Browser and OS usage of employees recorded","b":3},{"t":"Public DNS records and ASN read","b":5}],"itemWhy":["A port sweep is active scanning.","Header reading is software fingerprinting.","BIOS is firmware.","CPU/RAM is hardware.","Employee app usage is client configurations.","DNS/ASN are network facts."]}},{"id":"H11","type":"cardsel","typeName":"Click the line","title":"When recon crossed the line","summary":"Six log lines — click the moment recon became exploitation.","blocks":[{"k":"p","t":"The same actor session, one minute of web02 log. Most lines are harmless-looking probing. One line shows the actor moved from collecting host information to trying an exploit. Click that line."},{"k":"art","label":"ARTEFACT — web02 access log, one actor session","wrap":true,"lines":["10:14:02 \"HEAD / HTTP/1.1\" 200 \"python-requests/2.31.0\"","10:14:11 \"GET /static/app.js HTTP/1.1\" 200 \"Mozilla/5.0 Chrome/120\"","10:14:19 \"GET /cgi-bin/.%2e/.%2e/.%2e/bin/sh HTTP/1.1\" 400 \"python-requests/2.31.0\"","10:14:26 \"HEAD /server-info HTTP/1.1\" 403 \"python-requests/2.31.0\"","10:14:33 \"GET /favicon.ico HTTP/1.1\" 200 \"Mozilla/5.0 Chrome/120\"","10:14:41 \"HEAD /robots.txt HTTP/1.1\" 200 \"python-requests/2.31.0\""]}],"question":"Click the line where the actor moved from fingerprinting to exploitation (T1190 territory, not T1592).","hint":"Fingerprinting reads what the server IS. Exploitation attempts a crafted path or payload to DO something.","explanation":"The '/cgi-bin/.%2e/.%2e/.%2e/bin/sh' line is a crafted path-traversal payload trying to reach a shell — an exploitation attempt in the Apache 2.4.49-style family, i.e. T1190, no longer recon. The HEAD lines are banner grabs (T1592), and the browser-UA GETs are ordinary browsing. The trap: the exploit line sits quietly between benign noise, and a reader skimming for 'HEAD' patterns misses that a real payload just went by. Read paths, not only methods.","study":"Distinguishing recon requests from exploitation payloads in access logs.","data":{"lines":["10:14:02 \"HEAD / HTTP/1.1\" 200 \"python-requests/2.31.0\"","10:14:11 \"GET /static/app.js HTTP/1.1\" 200 \"Mozilla/5.0 Chrome/120\"","10:14:19 \"GET /cgi-bin/.%2e/.%2e/.%2e/bin/sh HTTP/1.1\" 400 \"python-requests/2.31.0\"","10:14:26 \"HEAD /server-info HTTP/1.1\" 403 \"python-requests/2.31.0\"","10:14:33 \"GET /favicon.ico HTTP/1.1\" 200 \"Mozilla/5.0 Chrome/120\"","10:14:41 \"HEAD /robots.txt HTTP/1.1\" 200 \"python-requests/2.31.0\""],"correct":[2],"why":["Banner grab — recon.","Static asset fetch.","A crafted traversal payload seeking a shell: exploitation attempt.","Info endpoint probe — recon.","Static asset fetch.","Meta-file fetch."]}},{"id":"H12","type":"qcm","typeName":"Attribution reasoning","title":"How confident dare we be?","summary":"A CTI assessment under attribution uncertainty.","blocks":[{"k":"p","t":"Your CTI note describes: slow, version-specific probes against VPN and firewall banners from residential-proxy IPs; sessions 3–7 days apart; only edge devices touched; no mass scanning anywhere. A colleague suggests writing 'This is Volt Typhoon, confirmed.' The style guide demands defensible confidence language."}],"question":"Which assessment line belongs in the report?","hint":"The behaviour matches a published pattern, but overlap is not proof. What does professional language say?","explanation":"Defensible CTI says: the patient, edge-focused, version-specific fingerprinting is consistent with documented Volt Typhoon-style edge-device reconnaissance, at low-to-moderate confidence, pending infrastructure corroboration. 'Confirmed' from TTP overlap alone overstates the evidence — TTPs are shared and spoofable, and infrastructure correlation is missing. Dismissing it as script-kiddie masscan noise contradicts the slow targeted pattern; 'internal testing' is unsupported without a change record. Attribution language is a discipline: describe overlap, state confidence, name what would raise it.","study":"Attribution confidence language: consistent with / moderate confidence / what would corroborate.","data":{"options":["Confirmed Volt Typhoon; publish the attribution immediately","Confirmed script kiddie running a leaked masscan config","Confirmed internal staff running an unapproved test","TTPs overlap public edge-recon playbooks; low–moderate confidence"],"answer":3,"why":"TTP overlap supports a hedged assessment; confirmation requires infrastructure or other independent evidence."}},{"id":"H13","type":"order","typeName":"Ranking","title":"Prioritise the four exposures","summary":"Rank four banner exposures by attacker value for remediation order.","blocks":[{"k":"p","t":"The vulnerability council meets. Four recon-relevant exposures are on the table; remediation slots are limited. Rank them from highest attacker value (1) to lowest (4). Attacker value = how directly the fact leads to a workable attack."},{"k":"art","label":"ARTEFACT — exposure list","wrap":true,"lines":["A. mail01 banner: Exchange 2016 build 15.1.2507.0 — multiple known critical bugs for that build","B. edge-fw SNMP open with community 'public' (full sysDescr readable)","C. web02 nginx shows exact version 1.18.0","D. O365 login page shows standard Microsoft branding"]}],"question":"Rank the exposures: 1 = highest attacker value, 4 = lowest.","hint":"Ask: does the fact hand the attacker a bug, a full device description, a partial hint, or nothing?","explanation":"A first: an Exchange build with known critical bugs is a ready-made exploit map — highest value. B second: SNMP 'public' hands over a complete device description (model, OS, uptime) in one query — broad, actionable context. C third: an exact nginx version helps bug lookup but fits no standing critical bug in this scenario. D last: standard login branding is generic; every Microsoft tenant looks the same, so it adds nothing. This ordering is exactly the remediation queue a rns are classic signature targets.","1":"Cadence and port behaviour are visible pre-service."},"wrongWhy":{"2":"Payroll is unrelated to DMZ banners.","3":"Badges record people, not edge probes."}}},{"id":"H15","type":"terminal","typeName":"Terminal","title":"Audit the edge device's SNMP tree","summary":"Assemble the snmpwalk with the right version, community and target.","blocks":[{"k":"p","t":"You are auditing your own edge router (192[.]0[.]2[.]1) after a recon report showed an actor querying it. The running config exposes the read-only SNMP community 'pubread'. Your admin box has snmpwalk. The audit standard says: read the device's whole info tree using SNMP v2c with the configured community, against the router's address."},{"k":"art","label":"Environment","wrap":true,"lines":["Admin box: mgmt01 (snmpwalk installed)","Target: 192[.]0[.]2[.]1 (your edge router)","Configured community (read-only): pubread","Required protocol version: v2c"]}],"question":"Type the snmpwalk command that reads the router's full info tree per the audit standard. Run it, then Check.","hint":"snmpwalk takes the version flag, the community flag with its value, and the target. The version must be v2c, not v1.","explanation":"The canonical command is: snmpwalk -v2c -c pubread 192[.]0[.]2[.]1. snmpwalk walks the device's whole SNMP tree; -v2c fixes the protocol version per the standard; -c pubread supplies the configured community; the target completes it. Wrong shapes: snmpget would fetch one OID only (no tree); -v1 would use the older protocol the standard forbids; omitting the community fails authentication. This is a defender exercise: reading your own device tree shows exactly what an attacker with the community string gets — full model, OS and uptime (T1592 material).","study":"snmpwalk anatomy and why community strings are secrets, not defaults.","attdef":"Defender view: the audit shows your own exposure in one run. Attacker view: the same command is free host intel when communities stay default.","data":{"ps1":"admin@mgmt01","banner":["Connected to mgmt01 (audit workstation).","Audit standard: SNMPv2c, community pubread, full tree, target 192[.]0[.]2[.]1."],"simTool":["snmpwalk"],"output":["SNMPv2-MIB::sysDescr.0 = STRING: EdgeRouter ER-4, Version 2.0.9","SNMPv2-MIB::sysUpTime.0 = Timeticks: (355140744) 41 days","IF-MIB::ifNumber.0 = INTEGER: 9"],"placeholder":"type your snmpwalk command","expected":"snmpwalk -v2c -c pubread 192[.]0[.]2[.]1","required":[{"label":"Tool snmpwalk (full tree)","all":["snmpwalk"],"why":"Only snmpwalk reads the whole tree; snmpget reads one OID.","whyOk":"Correct tool for a full tree walk."},{"label":"Protocol version v2c","any":["v2c"],"why":"The audit standard demands v2c.","whyOk":"v2c as required."},{"label":"Community flag and value -c pubread","all":["-c","pubread"],"why":"The configured read-only community is pubread; -c carries it.","whyOk":"Correct community usage."},{"label":"Target 192[.]0[.]2[.]1","all":["192[.]0[.]2[.]1"],"why":"The edge router's address.","whyOk":"Correct target."}],"forbidden":[{"label":"Wrong tool: snmpget / snmpset","any":["snmpget","snmpset"],"why":"snmpget fetches a single OID, not the tree the audit demands; snmpset would try to write."}],"parts":[{"c":"snmpwalk","w":"Walks the device's entire SNMP information tree."},{"c":"-v2c","w":"Protocol version 2c, per the audit standard."},{"c":"-c pubread","w":"The read-only community string from the running config."},{"c":"192[.]0[.]2[.]1","w":"The edge router being audited."}]}}]};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function range(n){ var r=[]; for(var i=0;i<n;i++) r.push(i); return r; }

function fmtClock(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function hasAll(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())<0) return false; } return true; }
function hasAny(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())>=0) return true; } return false; }
function normCmd(c){
  c = String(c||'').toLowerCase().replace(/\s+/g,' ').trim();
  c = c.replace(/^[a-z0-9]+:\/\//,'');
  c = c.replace(/\b(\d{1,3})\s*\.\s*(\d{1,3})\s*\.\s*(\d{1,3})\s*\.\s*(\d{1,3})\b/g,'$1[.]$2[.]$3[.]$4');
  c = c.replace(/-\s*v\s+2c/g,'-v2c');
  return c;
}
function hl(line){
  var e = esc(line);

    function(m,q,ip,kw,num){

      if(kw) return '<span class="hl-kw">'+kw+'</span>';
      if(num) return '<span class="hl-num">'+num+'</span>';
      return m;
    });
  return e;
}

/* ---------- timer state machine ----------
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED.
   Check -> PAUSED_AUTO_CHECK (before feedback renders). Next / Final Submit -> RUNNING or ENDED.
   Skip and Hint never change the state. Manual pause may sit on top of the auto-pause. */
function setState(st){ S.timer.prevState = S.timer.state; S.timer.state = st; renderHeader(); }
setInterval(function(){
  var t=S.timer;
  if((S.phase==='exam' && !S.reviewingId) || S.phase==='review' || (S.phase==='exam' && S.reviewingId)){
    if(t.state==='RUNNING'){
      t.remaining--;
      if(t.per && S.phase==='exam' && t.per.exId===S.renderedId && !S.checked[S.renderedId]){
        t.per.remaining--;
        var pc=$('pertime'); if(pc) pc.textContent=fmtClock(t.per.remaining);
        if(t.per.remaining<=0){ t.per.remaining=0; if(pc) pc.textContent=fmtClock(0); renderHeader(); doCheck(); return; }
      }
      if(t.remaining<=0){ t.remaining=0; renderHeader(); onTimeout(); return; }
    } else if(t.state==='PAUSED_AUTO_CHECK'){ t.pa++; }
    else if(t.state==='PAUSED_MANUAL'){ t.pm++; }
  }
  renderHeader();
},1000);
function onTimeout(){

}
