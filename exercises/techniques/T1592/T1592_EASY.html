var EXAM = {"meta":{"topicId":"t1592","batch":1,"title":"T1592 Gather Victim Host Information — Easy","difficulty":"easy","questionCount":15,"estimatedMinutes":25,"passMark":70},"severity":{"label":"EASY","cls":"easy","meaning":"One idea per exercise. Short scenarios. Clear hints. You build the foundations."},"keywords":[{"theme":"Technique basics","items":["T1592 — Gather Victim Host Information","Technique (object type)","Tactic: Reconnaissance (TA0043)","Pre-compromise phase","Sub-technique T1592.001 Hardware","Sub-technique T1592.002 Software","Sub-technique T1592.003 Firmware","Sub-technique T1592.004 Client Configurations"]},{"theme":"What attackers collect","items":["CPU and RAM details","Device models","BIOS / UEFI versions","Operating system and patch level","Installed software versions","Service banners","SNMP sysDescr strings","Browser and mail client settings"]},{"theme":"How attackers collect","items":["Banner grabbing (curl -I, telnet, netcat)","SNMP queries (snmpwalk) with 'public'","nmap -sV service detection","masscan port sweeps","Shodan / Censys device databases","Wappalyzer / BuiltWith web fingerprinting","Reading victim-owned websites","Job postings and asset leaks"]},{"theme":"Neighbouring techniques","items":["T1589 Gather Victim Identity Information","T1590 Gather Victim Network Information","T1591 Gather Victim Org Information","T1593 Search Open Websites/Domains","T1594 Search Victim-Owned Websites","T1595 Active Scanning","T1595.002 Vulnerability Scanning","T1596 Search Open Technical Databases","T1597 Search Closed Sources"]},{"theme":"Telemetry and detection","items":["Web access logs (method + User-Agent)","Firewall and connection logs","IDS/IPS scanner signatures","DNS analytics","Honeypots","Probe cadence and low-and-slow patterns","False positives: uptime monitors, vendor scans","Tuning with asset and maintenance inventories"]},{"theme":"Mitigations and controls","items":["M1056 Pre-compromise","server_tokens off / banner discipline","Disable SNMP v1/v2c 'public'","Remove end-of-life exposed hosts","Patch and reduce exposed surface","Rate limiting and tarpits","WAF header normalisation"]},{"theme":"Real-world use and roles","items":["SOC alert triage","CTI reporting with ATT&CK IDs","Attack surface management","Detection engineering","Red team OSINT in authorised tests","Exploit tailoring before T1190","Edge-device recon playbooks (Volt Typhoon-style)"]}],"intro":["This exam is about <b>MITRE ATT&amp;CK technique T1592 — Gather Victim Host Information<\/b>. ATT&amp;CK is a free, public knowledge base that describes what real attackers do. Every action gets an ID. T1592 is a <b>Technique<\/b> (an object type that describes one attacker behaviour). It lives inside the <b>Reconnaissance tactic (TA0043)<\/b>. A tactic is a phase of an attack. Reconnaissance is the first phase: it happens <b>before<\/b> the attacker gets into a network. In this phase you will learn how attackers study a victim's computers, and how defenders work with that behaviour.","<b>What the technique describes.<\/b> The attacker collects facts about the victim's hosts (computers and devices). The facts fall into four groups, and each group is a sub-technique with its own ID: <b>T1592.001 Hardware<\/b> (CPU, RAM, device models), <b>T1592.002 Software<\/b> (operating systems, installed programs, exact versions, patch levels), <b>T1592.003 Firmware<\/b> (BIOS/UEFI versions baked into chips), and <b>T1592.004 Client Configurations<\/b> (browser types and versions, mail client settings, VPN client setups on staff devices).","<b>Why attackers do it.<\/b> Host facts make attacks precise. If an attacker learns that a web server runs an old software version, they can search for a known bug in that version. If they learn which remote-access tool a company uses, they can prepare an attack that fits that tool. Good reconnaissance saves the attacker attempts and lowers the chance that noise triggers an alert. This is why T1592 often feeds the next phase, Initial Access, for example exploiting a public-facing application (T1190).","<b>How attackers do it.<\/b> Often from outside the victim's network. They grab service banners (a banner is the short introduction a service sends: for example a web server saying 'Server: nginx/1.18.0'). They query devices with SNMP when the default community string 'public' still works. They scan with tools like nmap or masscan. They read public device databases such as Shodan or Censys, which index banners from millions of exposed devices. They fingerprint web technology from the browser with tools like Wappalyzer.","<b>Where you meet T1592 in real work.<\/b> A <b>SOC analyst<\/b> triages scan alerts and separates real recon from benign scanners. A <b>threat intelligence (CTI) analyst<\/b> maps attacker reports to T1592 and writes briefings with the correct IDs. A <b>detection engineer<\/b> builds analytics on web access logs, firewall logs and IDS alerts to catch fingerprinting. An <b>attack surface management<\/b> or vulnerability management team reduces what leaks: hiding version banners, turning off SNMP 'public', removing end-of-life hosts. A <b>red teamer<\/b> uses the same actions in authorised tests. A <b>GRC analyst<\/b> checks that policies cover information exposure. Deliverables include alert tickets, exposure reports, CTI reports with ATT&amp;CK IDs, and detection rules.","<b>The risk it addresses, and one honest limit.<\/b> If attackers learn your exact versions, their attacks get sharper and harder to spot. Note the limit: much of this activity happens outside your network, so you often cannot see it directly. ATT&amp;CK itself lists the mitigation <b>M1056 Pre-compromise<\/b> for T1592: you cannot stop someone thinking about you, but you can shrink what they learn — and you can watch your edge for probing patterns."],"typeList":"multiple-choice questions, matching, click-the-line artefact analysis, drag & drop, fill-in-the-blank, log analysis with a filter box, ordering and ranking, terminal emulator exercises, SOC alert-triage queues","exercises":[{"id":"E01","type":"qcm","typeName":"Knowledge check","title":"Where does T1592 live in the matrix?","summary":"One ATT&CK matrix question — find the right tactic for T1592.","blocks":[{"k":"p","t":"A SOC student is reading the MITRE ATT&CK matrix. She finds the technique T1592, 'Gather Victim Host Information'. She wants to know which tactic (attack phase) it belongs to. Her mentor says: 'The tactic tells you the goal of the behaviour, not the tool.'"},{"k":"art","label":"ATT&CK excerpt — T1592 card","wrap":true,"lines":["ID: T1592","Name: Gather Victim Host Information","Sub-techniques: T1592.001 Hardware, T1592.002 Software, T1592.003 Firmware, T1592.004 Client Configurations","Tactic: ??? (you must find it)"]}],"question":"Which tactic does T1592 belong to?","hint":"This tactic is the very first phase. It happens before the attacker gets inside the network.","explanation":"T1592 belongs to the Reconnaissance tactic, TA0043. Reconnaissance means: the attacker studies the target before the attack. Gathering host information is exactly that: learning about the victim's machines first. Initial Access (TA0001) comes later, when the attacker gets in. Collection (TA0009) happens much later, after the attacker is inside and steals data. Exfiltration (TA0010) is the last step, when data leaves the network.","study":"The ATT&CK tactic order: Reconnaissance (TA0043) is the first tactic in the attack lifecycle.","data":{"options":["Reconnaissance (TA0043)","Initial Access (TA0001)","Collection (TA0009)","Exfiltration (TA0010)"],"answer":0,"why":"Reconnaissance is the pre-compromise phase where the attacker studies the victim, and gathering host information is part of it."}},{"id":"E02","type":"match","typeName":"Matching","title":"Match the four sub-techniques","summary":"Match T1592.001 to T1592.004 with plain-English descriptions.","blocks":[{"k":"p","t":"T1592 has four sub-techniques. Each one is one group of facts about the victim's hosts. Read each ID and pick the description that fits it. An example: 'CPU model and RAM size' belongs to Hardware, because you can touch hardware."},{"k":"art","label":"ATT&CK excerpt — T1592 sub-technique list","wrap":true,"lines":["T1592.001  Hardware","T1592.002  Software","T1592.003  Firmware","T1592.004  Client Configurations"]}],"question":"Match each sub-technique to its correct plain-English description.","hint":"Hardware is physical. Firmware is code inside chips. Software is installed programs. Client configurations are settings on user devices.","explanation":"T1592.001 Hardware covers physical parts: CPU, RAM, device models. T1592.002 Software covers installed programs and their versions: operating systems, web servers, apps. T1592.003 Firmware covers code stored inside chips: BIOS and UEFI versions. T1592.004 Client Configurations covers settings on the devices people use: browser types, mail client settings, VPN client setups. Knowing the four groups helps you name what an attacker collected in a report.","study":"The four T1592 sub-technique names and one example fact for each.","data":{"left":["T1592.001","T1592.002","T1592.003","T1592.004"],"right":["Physical parts: CPU, RAM, device models","Installed programs and their exact versions","Code inside chips: BIOS / UEFI versions","Settings on user devices: browser, mail, VPN client"],"pairs":[0,1,2,3],"itemWhy":["Hardware is the physical machine.","Software is what is installed and running.","Firmware is the low-level code in chips.","Client configurations are the settings of apps people use."]}},{"id":"E03","type":"cardsel","typeName":"Click the line","title":"What does a web banner show?","summary":"One HTTP response header block — click the line that shows server software.","blocks":[{"k":"p","t":"When you visit a website, the web server sends back response headers. Attackers read these headers too. This is called banner grabbing, and it is one simple way to collect victim host information (T1592). Look at this captured response from a company web server."},{"k":"art","label":"ARTEFACT — HTTP response headers from web01 (captured)","wrap":true,"lines":["HTTP/1.1 200 OK","Date: Mon, 14 Sep 2026 03:12:44 GMT","Server: nginx/1.18.0","Content-Type: text/html","Set-Cookie: sid=8f3a91; HttpOnly","Connection: keep-alive"]}],"question":"Click the line that shows which server software and version the website runs.","hint":"The server usually announces its software family in one special header line.","explanation":"The line 'Server: nginx/1.18.0' names the software family (nginx) and the exact version (1.18.0). This is T1592.002, Software. An attacker can search for bugs that are known for nginx 1.18.0. The other lines give a date, a content type, a session cookie, and a connection setting. They are useful, but they do not name the software version.","study":"The 'Server:' response header and why version numbers in banners are useful to attackers.","data":{"lines":["HTTP/1.1 200 OK","Date: Mon, 14 Sep 2026 03:12:44 GMT","Server: nginx/1.18.0","Content-Type: text/html","Set-Cookie: sid=8f3a91; HttpOnly","Connection: keep-alive"],"correct":[2],"why":["Status line only.","Just a timestamp.","Names the software family AND the exact version — that is T1592.002 information.","Media type only.","A session cookie value.","A transport setting."]}},{"id":"E04","type":"dragdrop","typeName":"Drag & drop","title":"Hardware or software?","summary":"Sort four collected facts into Hardware and Software buckets.","blocks":[{"k":"p","t":"During authorised reconnaissance, a pentester collects four facts about the target company's hosts. Each fact is either Hardware (T1592.001) or Software (T1592.002). Sort them. Tip: if you can physically touch it, it is hardware."},{"k":"art","label":"ATT&CK reminder","wrap":true,"lines":["T1592.001 Hardware: CPU, RAM, device models","T1592.002 Software: operating systems, installed programs, versions"]}],"question":"Drag each fact into the correct bucket.","hint":"Ask yourself: is this a physical part of the machine, or a program running on it?","explanation":"The CPU model (Xeon Silver 4110) and the RAM size (64 GB) are physical parts, so they are Hardware, T1592.001. Apache Tomcat 9.0.65 and MySQL 8.0.31 are installed programs with versions, so they are Software, T1592.002. When you report collected facts, putting each fact in the right sub-technique makes the report precise and comparable.","study":"The difference between T1592.001 Hardware and T1592.002 Software.","attdef":"Attacker view: hardware facts guide which physical or cloud host to attack; software versions point to known bugs. Defender view: both facts leak through banners, so hide versions and limit what responses reveal.","data":{"buckets":["Hardware (T1592.001)","Software (T1592.002)"],"items":[{"t":"CPU model: Xeon Silver 4110","b":0},{"t":"Apache Tomcat 9.0.65 installed","b":1},{"t":"64 GB of RAM","b":0},{"t":"MySQL 8.0.31 running","b":1}],"itemWhy":["A CPU is a physical chip — hardware.","An application server with a version is software.","RAM is a physical part — hardware.","A database program with a version is software."]}},{"id":"E05","type":"fill","typeName":"Fill the blanks","title":"Complete the recon sentence","summary":"Fill two blanks in a summary sentence about T1592.","blocks":[{"k":"p","t":"Complete this short summary. Pick words from the bank. The bank is shuffled, and one word is a distractor."}],"question":"Fill both blanks with the correct words from the bank.","hint":"First blank: the tactic name. Second blank: does recon happen before or after getting in?","explanation":"T1592 belongs to the Reconnaissance tactic. It happens before the attacker tries to break in. Recon means learning first, attacking later. 'Initial Access' is the wrong tactic here: that is the moment the attacker gets inside, which comes after the learning phase.","study":"T1592 = Reconnaissance tactic, pre-compromise phase.","data":{"text":"T1592 belongs to the {0} tactic. Attackers gather host information {1} they try to break in.","bank":["Reconnaissance","Initial Access","before","after"],"answers":["Reconnaissance","before"],"itemWhy":["Reconnaissance (TA0043) is the tactic of T1592.","Recon happens pre-compromise, so before."]}},{"id":"E06","type":"qcm","typeName":"Knowledge check","title":"Can the victim see it?","summary":"One question about how visible T1592 activity is to the victim.","blocks":[{"k":"p","t":"A beginner asks the SOC team: 'If an attacker gathers host information about us, will our tools alert us right away?' The team lead answers with the honest, general truth about T1592."}],"question":"Which statement is true about detecting T1592 activity?","hint":"Think about where the attacker physically sits while doing this: inside your network, or far away on the internet?","explanation":"Most host information gathering happens outside the victim network: banner grabbing, SNMP queries from the internet, or public databases like Shodan. The victim's servers cannot easily see someone reading a banner. That is why T1592 is hard to detect directly. What you can do: reduce what you expose, and watch your edge for probing patterns. It is false that it always drops malware or changes files — T1592 is a learning step, not an infection.","study":"Why pre-compromise reconnaissance is hard for victims to observe.","data":{"options":["It always drops malware, so antivirus catches it.","It always changes files, so file checks catch it.","Most of it happens outside the victim network, so it is hard to see.","Most of it happens inside the victim network, so alerts fire at once."],"answer":2,"why":"The activity is largely external (banners, public databases), so victims see little of it directly."}},{"id":"E07","type":"cardsel","typeName":"Click the line","title":"The SSH banner leak","summary":"One SSH connection banner — click the leaking line.","blocks":[{"k":"p","t":"When any SSH client connects to a server, the server sends a banner first. A SOC student connects to the company's own server to see what it announces. This is the same thing an outside attacker would see."},{"k":"art","label":"ARTEFACT — SSH connection to web01.corp.example","wrap":true,"lines":["Trying 192[.]0[.]2[.]10...","Connected to web01.corp.example.","SSH-2.0-OpenSSH_7.4","Password authentication required."]}],"question":"Click the line that leaks the SSH software name and version.","hint":"SSH servers announce themselves with a line that starts with SSH-2.0.","explanation":"The banner 'SSH-2.0-OpenSSH_7.4' gives the protocol (SSH-2.0) and the exact software and version (OpenSSH 7.4). This is software information, T1592.002. Anyone on the internet can collect it by simply connecting. The connection lines only say where the student connected, and the last line only describes the login policy.","study":"SSH version banners and T1592.002 Software.","data":{"lines":["Trying 192[.]0[.]2[.]10...","Connected to web01.corp.example.","SSH-2.0-OpenSSH_7.4","Password authentication required."],"correct":[2],"why":["Dial attempt only.","Target name only.","Protocol plus exact software version — a classic banner leak.","A login policy note."]}},{"id":"E08","type":"logview","typeName":"Log analysis","title":"What is this outside IP doing?","summary":"Three firewall drops from one external IP — recognise simple probing.","blocks":[{"k":"p","t":"You are a SOC analyst on day shift. The firewall shows three dropped connections, all from the same outside IP, within one minute. Read the log and decide what is most likely happening."},{"k":"art","label":"ARTEFACT 1 — Firewall log, fw01","wrap":true,"lines":["Sep 14 03:12:44 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=443","Sep 14 03:13:02 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=22","Sep 14 03:13:19 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=8443"]}],"question":"What is the outside IP most likely doing?","hint":"Look at the destination ports: 443, 22, 8443. What is the visitor checking?","explanation":"The same outside IP touches several different well-known service ports (443 HTTPS, 22 SSH, 8443 alt-HTTPS) in one minute. That is a simple probe: the visitor is checking which services the host offers. This is the kind of activity that supports host information gathering and active scanning. It is not email spam (no port 25), not updates (updates are pulled from inside), and not backups (backups run from inside to a backup server).","study":"Port probing patterns in firewall logs and how they relate to Reconnaissance.","data":{"lines":["Sep 14 03:12:44 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=443","Sep 14 03:13:02 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=22","Sep 14 03:13:19 fw01 kernel: DROP eth0 saddr=203[.]0[.]113[.]45 dst=192[.]0[.]2[.]10 proto=TCP dport=8443"],"mode":"qcm","sub":{"options":["Installing security updates on the host","Backing up files from the host","Checking which services this host offers","Sending email spam to the host"],"answer":2,"why":"Probing several service ports one after another is a classic service discovery check."}}},{"id":"E09","type":"order","typeName":"Ordering","title":"Three steps of a simple attack","summary":"Order three basic phases: learn, choose, break in.","blocks":[{"k":"p","t":"An instructor asks: 'Why does an attacker first gather host information?' Put the three steps of a simple targeted attack in the correct order."}],"question":"Drag the three steps into the correct order (first step on top).","hint":"Learning comes first, and getting inside comes last.","explanation":"The correct order is: first learn which software the target runs (T1592), then choose an attack that fits that software (for example an exploit for that exact version), then try to get into the network (Initial Access). Attackers follow this order because precise information saves them many failed attempts, and failed attempts make noise that defenders can see.","study":"How T1592 feeds the attacker's choice of Initial Access technique.","data":{"items":["Learn which software the target runs (T1592)","Choose an attack that fits that software","Try to get into the network (Initial Access)"],"itemWhy":["Recon first: gather host facts.","Match the attack to the learned facts.","Break in last, with a precise plan."]}},{"id":"E10","type":"qcm","typeName":"Knowledge check","title":"Spot the client configuration fact","summary":"One question about T1592.004 Client Configurations.","blocks":[{"k":"p","t":"A CTI analyst reads a report that says: 'The actor collected facts about the workforce's devices: which browser and which version each team uses, and the default settings of the mail client.' She must map this to the right sub-technique of T1592."}],"question":"Which item is client configuration information (T1592.004)?","hint":"Client configurations are the settings of the apps that people use on their own devices.","explanation":"The browser type and version that employees use is a client configuration: a setting of software on user devices, mapped to T1592.004. CPU cores are hardware (T1592.001). A BIOS version is firmware (T1592.003). The rack size of a server room is physical facilities, not a host fact that T1592 collects.","study":"T1592.004 Client Configurations: browsers, mail clients, VPN client settings.","data":{"options":["Server-room rack sizes and labels","Browser types and versions in use","CPU core counts on a database server","BIOS versions of fleet laptops"],"answer":1,"why":"Browser type and version on user devices are client configurations, exactly what T1592.004 describes."}},{"id":"E11","type":"match","typeName":"Matching","title":"Match the IDs to the names","summary":"Match three ATT&CK IDs to their object names.","blocks":[{"k":"p","t":"Reports use ATT&CK IDs all the time. Match each ID to its correct name so you can read reports faster."},{"k":"art","label":"ATT&CK IDs to place","wrap":true,"lines":["T1592","TA0043","T1592.002"]}],"question":"Match each ID to its correct name.","hint":"TA numbers are tactics. T numbers with a dot are sub-techniques.","explanation":"T1592 is the technique Gather Victim Host Information. TA0043 is the tactic Reconnaissance. T1592.002 is its Software sub-technique. Reading IDs fluently is a daily skill for SOC and CTI analysts, because reports, tickets and detection rules all use them.","study":"ATT&CK ID patterns: T for techniques, TA for tactics, dotted T numbers for sub-techniques.","data":{"left":["T1592","TA0043","T1592.002"],"right":["Gather Victim Host Information","Reconnaissance","Software"],"pairs":[0,1,2],"itemWhy":["The parent technique ID.","The tactic ID for Reconnaissance.","The dotted ID is the Software sub-technique."]}},{"id":"E12","type":"terminal","typeName":"Terminal","title":"Check your own banner (guided)","summary":"Type one guided curl command to read your server's response headers.","blocks":[{"k":"p","t":"You are a SOC engineer. Task: see what banner your own web server, web01.corp.example, shows to every visitor. The tool is curl. curl sends a web request from the command line and shows the answer. The -I option asks only for the response headers, which is exactly where the banner lives."},{"k":"art","label":"Reminder — this is your own server, this is authorised","wrap":true,"lines":["Target: web01.corp.example (your company's web server)","Goal: read the response headers only (no page body)"]}],"question":"Type the curl command that asks web01.corp.example for its response headers only, then press Enter, then Check.","hint":"The command has three parts: the tool name, the headers-only flag, and the target host. The syntax panel shows the shape.","explanation":"The canonical command is: curl -I web01.corp.example. curl is the tool that makes web requests. -I asks for a HEAD-style answer: response headers only, no page body. web01.corp.example is your target host. Running it shows headers like 'Server: nginx/1.18.0' — the same banner an outside attacker would collect for T1592.002. Knowing what your own servers announce is the first step of banner discipline.","study":"curl -I for banner checks, and what your own servers reveal in headers.","data":{"ps1":"analyst@jumpbox","banner":["Connected to jumpbox (authorised internal host).","Type your command below."],"syntaxPanel":["Command shape:  curl -I <host>","  curl  : the web request tool","  -I    : show response headers only (HEAD request)","Example on another host:  curl -I mail01.corp.example"],"sampleOutput":["HTTP/1.1 200 OK","Server: Apache/2.4.41 (Ubuntu)"],"simTool":["curl"],"output":["HTTP/1.1 200 OK","Server: nginx/1.18.0","Content-Type: text/html"],"placeholder":"e.g. curl -I somehost.corp.example","expected":"curl -I web01.corp.example","required":[{"label":"The curl tool","all":["curl"],"why":"curl is the named tool for banner checks.","whyOk":"Correct tool: curl makes the web request."},{"label":"The -I headers-only flag","any":["-i"],"why":"Without -I, curl downloads the whole page instead of just headers.","whyOk":"-I asks for response headers only."},{"label":"Target host web01.corp.example","all":["web01.corp.example"],"why":"The scenario names web01.corp.example as the target.","whyOk":"Correct target host."}],"forbidden":[],"parts":[{"c":"curl","w":"The command-line web request tool."},{"c":"-I","w":"HEAD-style request: response headers only, no page body."},{"c":"web01.corp.example","w":"Your own web server — the thing whose banner you want to see."}]}},{"id":"E13","type":"cardsel","typeName":"Spot the mistake","title":"Find the leaky config line","summary":"One router config excerpt — click the line that leaks host information.","blocks":[{"k":"p","t":"A colleague configured an edge device. A senior engineer glances at it and says: 'One line here announces device facts to anyone who asks.' SNMP is a protocol that lets tools read device information strings. If it uses the default community string 'public', anyone can read them."},{"k":"art","label":"ARTEFACT — edge device configuration excerpt","wrap":true,"lines":["line vty 0 4"," transport input ssh"," snmp-server community public ro"," service password-encryption"]}],"question":"Click the line that leaks host information to anyone who asks.","hint":"Look for the SNMP line. Which community string does it use?","explanation":"The line 'snmp-server community public ro' allows read-only SNMP queries with the default community string 'public'. Anyone on the network can then read the device's info strings (sysDescr: model, OS version, uptime) — classic T1592.001/.002 material. The other lines are fine: SSH-only remote access and password encryption are good settings. Removing or replacing 'public' with a strong string is the fix.","study":"Default SNMP community strings and how they expose device details.","attdef":"Attacker view: one SNMP query returns a full device description for free. Defender view: default communities are pure leak — change or remove them.","data":{"lines":["line vty 0 4"," transport input ssh"," snmp-server community public ro"," service password-encryption"],"correct":[2],"why":["Terminal line settings only.","SSH-only access is good practice.","Default community 'public' lets anyone read device facts — the leak.","Password encryption is good practice."]}},{"id":"E14","type":"qcm","typeName":"Knowledge check","title":"Find the right ID","summary":"One lookup question: which ID is Gather Victim Host Information?","blocks":[{"k":"p","t":"You are writing your first CTI note. Your lead asks you to cite the correct ATT&CK ID for 'Gather Victim Host Information'. You open the ATT&CK website and check."}],"question":"Which ATT&CK ID is 'Gather Victim Host Information'?","hint":"It is a T number near 1590. The 1590 family is all victim information gathering.","explanation":"T1592 is Gather Victim Host Information. The neighbours are easy to mix up: T1590 is Gather Victim Network Information (IP ranges, DNS), T1589 is Gather Victim Identity Information (people, emails), and T1595 is Active Scanning. Quoting the right ID keeps reports and detections precise.","study":"The victim-information family: T1589 identity, T1590 network, T1591 org, T1592 hosts.","data":{"options":["T1590","T1589","T1595","T1592"],"answer":3,"why":"T1592 is the canonical ID for Gather Victim Host Information."}},{"id":"E15","type":"triage","typeName":"SOC triage queue","title":"Two small decisions on shift","summary":"A tiny alert queue: choose the best action for each of two alerts.","blocks":[{"k":"p","t":"You are alone on the SOC night shift. Two small items arrive. For each one, choose the best simple action. Tip: good SOC habits are: verify first, do not destroy evidence, and never publish internal facts."},{"k":"art","label":"ARTEFACT — mini alert queue","wrap":true,"lines":["ALERT-1  Web server log: 40 HEAD requests in 2 minutes from one outside IP with changing User-Agent names","ALERT-2  Help-desk email from an unknown address asks for the exact BIOS versions of all company laptops"]}],"question":"Choose the best action for each alert.","hint":"Alert 1: report what you see, keep the evidence. Alert 2: an unknown stranger asks for host facts — check who they are first.","explanation":"Alert 1: repeated HEAD requests with changing User-Agent names is a banner-grabbing pattern (T1592.002 activity). The right move is to flag it as possible reconnaissance and tell the SOC lead, keeping the logs intact. Replying to the probe IP, deleting logs, or opening new ports would all be wrong: they destroy evidence or help the attacker. Alert 2: an unknown requester asking for BIOS versions is a classic information-collection attempt. Verify who asks and why before answering anything. Posting versions publicly or answering at once hands free T1592.003 data to a stranger.","study":"Evidence-friendly triage habits and verifying unusual information requests.","attdef":"Attacker view: both moves are cheap T1592 collection attempts — probes from outside, and social asks from inside. Defender view: keep evidence, verify the requester.","data":{"alerts":[{"t":"ALERT-1: 40 HEAD requests, changing User-Agents, from one outside IP","actions":["Flag as possible reconnaissance and tell the SOC lead","Reply to the outside IP with a warning","Delete the web logs to save space","Open port 8080 to test if it stops"],"correct":0,"whyOk":"Recon patterns get escalated with evidence kept, never deleted."},{"t":"ALERT-2: unknown email asks for BIOS versions of all laptops","actions":["Check who asks and why before answering","Post all BIOS versions on the public website","Send the BIOS versions to the requester at once","Turn off all laptops until the request is checked"],"correct":0,"whyOk":"Unverified requests for host facts must be verified first — this is a T1592.003 collection attempt."}]}}]};

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function hasAll(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())<0) return false; } return true; }
function hasAny(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())>=0) return true; } return false; }
function normCmd(c){

function setState(st){ S.timer.prevState = S.timer.state; S.timer.state = st; renderHeader(); }
setInterval(function(){
  var t=S.timer;
  if((S.phase==='exam' && !S.reviewingId) || S.phase==='review' || (S.phase==='exam' && S.reviewingId)){
    if(t.state==='RUNNING'){
      t.remaining--;
      if(t.per && S.phase==='exam' && t.per.exId===S.renderedId && !S.checked[S.renderedId]){
        t.per.remaining--;
        var pc=$('pertime'); if(pc) pc.textContent=fmtClock(t.per.remaining);
        if(t.per.remaining<=0){ t.per.remaining=0; if(pc) pc.textContent=fmtClock(0); renderHeader(); doCheck(); return; }
      }
      if(t.remaining<=0){ t.remaining=0; renderHeader(); onTimeout(); return; }
    } else if(t.state==='PAUSED_AUTO_CHECK'){ t.pa++; }
    else if(t.state==='PAUSED_MANUAL'){ t.pm++; }
  }
  renderHeader();
},1000);
function onTimeout(){
  if(S.phase==='results'||S.phase==='intro') return;
  setState('ENDED');
  finish('timeout');
}
function renderHeader(){
  var t=S.timer, idx='', h=$('hdr'); if(!h) return;
  var badge='<span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>';
  if(S.phase==='exam'){
    idx = S.reviewingId ? ('Review skipped — '+skippedOpen().length+' left') : ('Exercise '+(S.cur+1)+' of '+S.order.length);
  } else if(S.phase==='review'){ idx='Review skipped — '+skippedOpen().length+' left'; }
  else if(S.phase==='results'){ idx='Results'; }
  else { idx='Introduction'; }
  var ts;
  if(t.state==='RUNNING') ts='<span class="tstate t-run">&#9654; Running</span>';
  else if(t.state==='PAUSED_MANUAL') ts='<span class="tstate t-man">&#10074;&#10074; Paused — manual (press Resume)</span>';
  else if(t.state==='PAUSED_AUTO_CHECK') ts='<span class="tstate t-auto">&#10074;&#10074; Paused — reviewing feedback (resumes on Next)</span>';
  else ts='<span class="tstate t-end">&#9632; Ended</span>';
  h.innerHTML =
    '<div class="hdr-l"><span class="hdr-idx">'+esc(idx)+'</span>'+badge+'</div>'+
    '<div class="hdr-m"><span class="hdr-timer">&#9201; '+fmtClock(t.remaining)+'</span>'+ts+'</div>'+
    '<div class="hdr-r"><span class="hdr-score">&#11088; '+liveScore().txt+'</span>'+
    '<button type="button" class="btn ghost" data-act="pause"'+(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'?'':' disabled')+'>&#10074;&#10074; Pause</button>'+
    '<button type="button" class="btn ghost" data-act="resume"'+(t.state==='PAUSED_MANUAL'?'':' disabled')+'>Resume</button>'+
    '<button type="button" class="btn warn" data-act="hint"'+((S.phase==='exam'&&!S.checked[currentExId()]&&!S.hintUsed[currentExId()])?'':' disabled')+'>&#128161; Hint (&minus;10%)</button>'+
    '<button type="button" class="btn ghost" data-act="skip"'+((S.phase==='exam'&&!S.checked[currentExId()])?'':' disabled')+'>&#9193; Skip</button>'+
    '</div>';
}
function currentExId(){ return S.renderedId || ''; }

      '<b>How this exam works (please read once)</b>'+

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(range(EXS.length));
  S.cur=0; S.phase='exam'; S.wallStart=Date.now();
  setState('RUNNING');
  renderExercise(currentEx(),{});
}
function renderExercise(ex,opts){
  opts=opts||{};
  var w=WIDGETS[ex.type]; if(!w){ return; }
  S.renderedId = String(ex.id);
  if(!S.ans[ex.id]) S.ans[ex.id]={};
  var blocks='', b, art;
  for(var i=0;i<ex.blocks.length;i++){
    b=ex.blocks[i];
    if(b.k==='p'){ blocks+='<p>'+esc(b.t)+'</p>'; }
    else if(b.k==='art'){
      var lines='';
      for(var j=0;j<b.lines.length;j++) lines+=hl(b.lines[j])+'\n';
      blocks+='<div class="art"><div class="art-h">'+esc(b.label)+'</div><pre class="'+(b.wrap?'wrap':'')+'">'+lines+'</pre></div>';
    }
    else if(b.k==='table'){
      var thead='', trows='';
      for(var c=0;c<b.head.length;c++) thead+='<th>'+esc(b.head[c])+'</th>';
      for(var r=0;r<b.rows.length;r++){
        trows+='<tr>';
        for(var d=0;d<b.rows[r].length;d++) trows+='<td>'+hl(b.rows[r][d])+'</td>';
        trows+='</tr>';
      }
      blocks+='<div class="art"><div class="art-h">'+esc(b.label)+'</div><table class="tri"><thead><tr>'+thead+'</tr></thead><tbody>'+trows+'</tbody></table></div>';
    }
  }
  var collapsible = ex.blocks.length>=3 || blocks.length>1400;
  var scn = '<div class="blk blk-scn" id="scnblk">'+
    '<div class="blk-h">&#128674; Scenario <span class="grow"></span>'+
    (collapsible?'<button type="button" class="collapser" data-act="collapse" id="collapseBtn" aria-expanded="true">Collapse &#9650;</button>':'')+
    '</div>'+
    (collapsible?'<div class="scn-summary" id="scnSummary">'+esc(ex.summary)+'</div>':'')+
    '<div class="blk-b" id="scnBody">'+blocks+'</div></div>';
  var stepNote='';
  if(ex.type==='branch'){ stepNote='<span class="typechip" id="stepchip">STEP 1 OF '+ex.data.steps.length+'</span>'; }
  var per = (ex.timerSec && !S.checked[ex.id]) ? '<span class="perchip" id="perchip">&#9201; Exercise timer: <b id="pertime">'+fmtClock(ex.timerSec)+'</b></span>' : '';
  if(ex.timerSec && !S.checked[ex.id] && (!S.timer.per || S.timer.per.exId!==ex.id)){ S.timer.per={exId:ex.id, remaining:ex.timerSec}; }
  var reviewNote = opts.review ? '<div class="review-note">&#9888; You are answering a skipped exercise. Answer it and press Next to go back to the review list.</div>' : '';
  $('main').innerHTML =
  '<section class="ex">'+
    '<div class="ex-top"><span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>'+
    '<span class="typechip">'+esc(ex.typeName)+'</span><span class="ex-title">'+esc(ex.title)+'</span>'+per+'</div>'+
    reviewNote+
    scn+
    '<div class="blk blk-q"><div class="blk-h">&#10067; Question <span class="grow"></span>'+stepNote+'</div>'+
      '<div class="blk-b"><p class="q-text">'+esc(ex.question)+'</p>'+
      '<div class="hintpanel" id="hintPanel" hidden>&#128161; <b>Hint:</b> '+esc(ex.hint)+' <span class="small">(Using this hint costs 10% of this exercise credit, applied at Check.)</span></div></div></div>'+
    '<div class="blk blk-a"><div class="blk-h">&#9997; Your answer</div>'+
      '<div class="blk-b" id="answerArea"></div></div>'+
    '<div class="actions">'+
      '<button type="button" class="btn primary" id="btnCheck" data-act="check">'+(ex.type==='branch'?'Check final answer':'Check')+'</button>'+
      '<button type="button" class="btn ghost" id="btnNext" data-act="next" hidden>Next &#9654;</button>'+
      '<span class="spacer"></span>'+
      '<span class="small">Skip and Hint are also in the top bar.</span>'+
    '</div>'+
    '<div id="fbHolder" aria-live="polite"></div>'+
  '</section>';
  w.render(ex, $('answerArea'), S.ans[ex.id], opts);
  window.scrollTo(0,0);
  renderHeader();
}
function doHint(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var p=$('hintPanel'); if(p) p.hidden=false;
  renderHeader();
}
function doSkip(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]) return;
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  if(S.reviewingId){ openReview(); return; }   /* skipping inside review stays in review */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else { openReview(); }
}
function gradeExercise(ex){
  var g=WIDGETS[ex.type].grade(ex);
  g.credit0=scoreExercise(g.H,g.W,g.N);
  g.credit=S.hintUsed[ex.id]?Math.max(0,g.credit0-0.10):g.credit0;
  return g;
}
function doCheck(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]) return;
  var g=gradeExercise(ex);
  S.credits[ex.id]=g.credit;
  S.checked[ex.id]=true;
  S.timer.per=null;
  setState('PAUSED_AUTO_CHECK');           /* first action: stop the timer before feedback shows */
  buildFeedback(ex,g);
  var aa=$('answerArea'); if(aa) aa.classList.add('locked');
  var cb=$('btnCheck'); if(cb) cb.disabled=true;
  var nb=$('btnNext'); if(nb){ nb.hidden=false; nb.innerHTML=nextLabel()+' &#9654;'; }
  renderHeader();
  var fb=$('fbHolder');
  if(fb && fb.scrollIntoView){
    var smooth=true;
    try{ smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    fb.scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest'});
  }
}
function nextLabel(){
  if(S.reviewingId){ return skippedOpen().length<=1 ? 'Finish exam' : 'Back to review'; }
  var last = S.cur>=S.order.length-1;
  if(last && skippedOpen().length===0) return 'Final Submit';
  if(last) return 'Review skipped';
  return 'Next';
}
function goNext(){
  if(!S.checked[S.renderedId]) return;
  if(S.reviewingId){
    S.reviewingId=null;
    if(skippedOpen().length===0){ submitExam(); } else { openReview(); }
    return;
  }
  setState('RUNNING');   /* Next ends the Check auto-pause; last exercise ends below */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else if(skippedOpen().length>0){ openReview(); }
  else { submitExam(); }
}

/* ---------- feedback ---------- */
function buildFeedback(ex,g){
  var cls, label, icon;
  if(g.credit>=0.999){ cls='fb-correct'; label='CORRECT'; icon='&#9989;'; }
  else if(g.credit>0){ cls='fb-partial'; label='PARTIALLY CORRECT'; icon='&#9989;'; }
  else { cls='fb-wrong'; label='INCORRECT'; icon='&#10060;'; }
  var creditLine='';
  if(g.N>1){
    var got=g.H;
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +' — '+got+'/'+g.N+' items'+(g.credit<g.credit0?' (after &minus;0.10 hint)':'')+'</span>';
  } else {
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +'</span>';
  }
  var items='';
  for(var i=0;i<g.items.length;i++){
    var it=g.items[i], ic, st;
    if(it.status==='correct'){ ic='<span class="ic-c">&#10003; Correct</span>'; }
    else if(it.status==='wrong'){ ic='<span class="ic-w">&#10007; Wrong</span>'; }
    else { ic='<span class="ic-m">&#9675; Missed</span>'; }
    items+='<li>'+ic+' — '+esc(it.label)+(it.why?(' — '+esc(it.why)):'')+'</li>';
  }
  var paras=ex.explanation.split('\n\n'), ptxt='';
  for(var p=0;p<paras.length;p++) ptxt+='<p>'+esc(paras[p])+'</p>';
  if(ex.attdef) ptxt+='<p>'+esc(ex.attdef)+'</p>';
  var canon='';
  if(WIDGETS[ex.type] && WIDGETS[ex.type].canonical) canon=WIDGETS[ex.type].canonical(ex);
  $('fbHolder').innerHTML =
  '<div class="fb '+cls+'">'+
    '<div class="fb-h">'+icon+' '+label+creditLine+'</div>'+
    '<div class="fb-b">'+
      (g.N>1?'<b>Item by item:</b><ul class="fb-items">'+items+'</ul>':'<ul class="fb-items">'+items+'</ul>')+
      '<b>Why:</b>'+ptxt+
      (canon||'')+
      '<div class="study">&#128218; What to study next: '+esc(ex.study)+'</div>'+
    '</div>'+
  '</div>';
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase='review'; S.reviewingId=null;
  if(S.timer.state==='PAUSED_AUTO_CHECK' && S.timer.remaining>0) setState('RUNNING');
  var pool=skippedOpen();
  var list='';
  for(var i=0;i<pool.length;i++){
    var ex=byId(pool[i]);
    list+='<div class="rv-item"><span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>'+
      '<span class="rt"><b>'+esc(ex.title)+'</b><br><span class="small">'+esc(ex.summary)+'</span></span>'+
      '<button type="button" class="btn" data-act="rvans" data-id="'+esc(ex.id)+'">Answer now</button></div>';
  }
  $('main').innerHTML =
  '<div class="intro-card"><h1>Review skipped exercises</h1>'+
  '<p>You skipped '+pool.length+' exercise(s). You can answer them now, as many times as needed, while the timer is still running. '+
  'If you submit with skipped exercises left, they are <b>excluded from the score</b>: they count as neither correct nor wrong.</p>'+
  (pool.length?list:'<p><b>All skipped exercises have been answered. You can submit the exam.</b></p>')+
  '<div class="actions"><button type="button" class="btn primary" data-act="submit">Submit exam &#9654;</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
}
function reviewAnswer(id){
  var ex=byId(id); if(!ex) return;
  S.reviewingId=String(id);
  S.phase='exam';
  for(var i=0;i<S.order.length;i++){
    if(String(EXS[S.order[i]].id)===String(id)){ S.cur=i; break; }
  }
  renderExercise(ex,{review:true});
}
function byId(id){ for(var i=0;i<EXS.length;i++){ if(String(EXS[i].id)===String(id)) return EXS[i]; } return null; }
function submitExam(){ finish('submit'); }

/* ---------- results ---------- */
function finish(){
  setState('ENDED');
  showResults();
}
function showResults(){
  S.phase='results';
  var full=0, part=0, wrong=0, skippedN=0, sum=0, answered=0, partSum=0;
  for(var i=0;i<EXS.length;i++){
    var ex=EXS[i], c=S.credits[ex.id];
    if(S.checked[ex.id]){
      answered++; sum+=c;
      if(c>=0.999){ full++; }
      else if(c>0){ part++; partSum+=c; }
      else { wrong++; }
    } else if(S.skipped.indexOf(ex.id)>=0){ skippedN++; }
    else { skippedN++; }
  }
  var pct = answered>0 ? Math.round((sum/answered)*100) : 0;
  var passed = pct>=M.passMark;
  var avg = part>0 ? (Math.round((partSum/part)*100)/100) : 0;
  var mins = Math.round((Date.now()-S.wallStart)/60000);
  var cert = passed ?
    '<div class="cert"><h3>&#127942; CERTIFICATE OF COMPLETION</h3>'+
    '<p><b>'+esc(S.init&&S.init.username?S.init.username:'Learner')+'</b> passed the '+SEV.label+' practice exam</p>'+
    '<p>'+esc(M.title)+'</p><p>Score: <b>'+pct+'%</b> &nbsp;&bull;&nbsp; Pass mark: '+M.passMark+'% &nbsp;&bull;&nbsp; '+new Date().toLocaleDateString()+'</p></div>' : '';
  $('main').innerHTML =
  '<div class="res">'+
    '<h2>Results — '+SEV.label+' exam</h2>'+
    '<p class="pct '+ (passed?'res-pass':'res-fail') +'">'+pct+'%</p>'+
    '<p>'+(passed?'<b>PASS.</b> Well done — you reached the pass mark of '+M.passMark+'%.':'<b>FAIL.</b> You need '+M.passMark+'% or more. You must retake the exam to pass.')+'</p>'+
    cert+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+full+'</b>Fully correct</div>'+
      '<div class="stat"><b>'+part+'</b>Partially correct'+(part?(' (avg credit '+avg+')'):'')+'</div>'+
      '<div class="stat"><b>'+wrong+'</b>Fully incorrect</div>'+
      '<div class="stat"><b>'+skippedN+'</b>Skipped, never answered (excluded)</div>'+
    '</div>'+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+(answered>0?(Math.round(sum*10)/10):'0')+' / '+answered+'</b>Sum of credits over answered exercises</div>'+
      '<div class="stat"><b>~'+mins+' min</b>Wall time in the exam</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pm)+'</b>Time paused manually</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pa)+'</b>Time reviewing feedback (auto-pause)</div>'+
    '</div>'+
    '<p class="small">Skipped-and-never-answered exercises are excluded from both the score and the total. The percentage above is computed only over answered exercises.</p>'+
    '<div class="actions"><button type="button" class="btn primary" data-act="retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
  reportScore(sum,answered,pct);
}
function reportScore(sum,answered,pct){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(sum),
      total:answered,
      percent:pct,
      passed:pct>=M.passMark
    }, location.origin);
  }catch(e){ /* opened directly in a browser; nothing to report to */ }
}
function retake(){
  S.phase='exam'; S.cur=0; S.ans={}; S.credits={}; S.checked={}; S.hintUsed={};
  S.skipped=[]; S.reviewingId=null; S.reported=false; S.wallStart=Date.now();
  S.timer={ state:'RUNNING', remaining:M.estimatedMinutes*60, prevState:null, pm:0, pa:0, per:null };
  S.order=shuffle(range(EXS.length));
  renderExercise(currentEx(),{});
}

/* ---------- manual pause ---------- */
function doPause(){
  var st=S.timer.state;
  if(st!=='RUNNING' && st!=='PAUSED_AUTO_CHECK') return;
  setState('PAUSED_MANUAL');
  var ov=$('pauseOv'); if(ov) ov.classList.add('show');
  document.body.classList.add('manual-paused');
}
function doResume(){
  if(S.timer.state!=='PAUSED_MANUAL') return;
  var back = (S.timer.prevState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  setState(back);
  var ov=$('pauseOv'); if(ov) ov.classList.remove('show');
  document.body.classList.remove('manual-paused');
}

/* ---------- website handshake (both init names accepted; works with none) ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.init={ username:event.data.username||'', country:event.data.country||'', theme:event.data.theme||'light' };
});

/* ---------- global click routing ---------- */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  if(el.disabled) return;
  var act=el.getAttribute('data-act');
  if(act==='start'){ startExam(); }
  else if(act==='pause'){ doPause(); }
  else if(act==='resume'){ doResume(); }
  else if(act==='hint'){ doHint(); }
  else if(act==='skip'){ doSkip(); }
  else if(act==='check'){ doCheck(); }
  else if(act==='next'){ goNext(); }
  else if(act==='submit'){ submitExam(); }
  else if(act==='retake'){ retake(); }
  else if(act==='rvans'){ reviewAnswer(el.getAttribute('data-id')); }
  else if(act==='collapse'){
    var body=$('scnBody'), btn=$('collapseBtn'), sum=$('scnSummary');
    if(!body) return;
    var open = body.style.display!=='none';
    body.style.display = open?'none':'block';
    if(sum) sum.style.display = open?'flex':'none';
    if(btn){ btn.innerHTML = open?'Expand &#9660;':'Collapse &#9650;'; btn.setAttribute('aria-expanded', open?'false':'true'); }
  }
});



/* ---------- shared pure graders ---------- */
function gradeQCM(d,A){
  if(A.sel===null||A.sel===undefined){
    return {H:0,W:1,N:1,items:[{label:'No answer selected — correct was: '+d.options[d.answer],status:'wrong',why:'You did not select an option, so the exercise scores 0.'}]};
  }
  var ok=(A.sel===d.answer);
  var lbl = ok ? ('You selected the correct answer: '+d.options[d.answer])
               : ('You selected "'+d.options[A.sel]+'". Correct answer: '+d.options[d.answer]);
  return {H:ok?1:0,W:ok?0:1,N:1,items:[{label:lbl,status:ok?'correct':'wrong',why:ok?(d.why||''):(d.whyWrong||'This option does not fit the scenario. Re-read the explanation below.')}]};
}
function gradeMulti(d,A){
  var sel=A.sel||[], N=d.answers.length, H=0, W=0, items=[], i, j;
  for(i=0;i<d.options.length;i++){
    var isAns=d.answers.indexOf(i)>=0, isSel=sel.indexOf(i)>=0;
    if(isAns&&isSel){ H++; items.push({label:d.options[i],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'Part of the correct answer set.'}); }
    else if(isAns&&!isSel){ items.push({label:d.options[i],status:'missed',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'You missed this correct item.'}); }
    else if(!isAns&&isSel){ W++; items.push({label:d.options[i],status:'wrong',why:d.wrongWhy&&d.wrongWhy[i]?d.wrongWhy[i]:'This is not part of the correct answer in this scenario.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}
function gradeCardsel(d,A){
  var sel=A.sel||[], N=d.correct.length, H=0, W=0, items=[], i;
  for(i=0;i<d.lines.length;i++){
    var isC=d.correct.indexOf(i)>=0, isS=sel.indexOf(i)>=0;
    if(isC&&isS){ H++; items.push({label:'Selected line: '+d.lines[i],status:'correct',why:d.why&&d.why[i]?d.why[i]:''}); }
    else if(!isC&&isS){ W++; items.push({label:'Selected line: '+d.lines[i],status:'wrong',why:d.why&&d.why[i]?d.why[i]:'This line is not the right one.'}); }
    else if(isC&&!isS){ items.push({label:'Correct line: '+d.lines[i],status:'missed',why:d.why&&d.why[i]?d.why[i]:'You missed this line.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}

/* ---------- QCM (single answer) ---------- */
WIDGETS.qcm={
  render:function(ex,host,A){
    if(!A.perm){ A.perm=shuffle(range(ex.data.options.length)); A.sel=null; }
    draw();
    function draw(){
      var h='<div role="radiogroup" aria-label="Answer options">';
      for(var i=0;i<A.perm.length;i++){
        var oi=A.perm[i], on=(A.sel===oi);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-oi="'+oi+'" role="radio" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+i)+'.</span><span>'+esc(ex.data.options[oi])+'</span></button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      var b=e.target.closest?e.target.closest('[data-oi]'):null;
      if(!b||S.checked[ex.id]) return;
      A.sel=parseInt(b.getAttribute('data-oi'),10);
      draw();
    };
  },
  grade:function(ex){ return gradeQCM(ex.data,S.ans[ex.id]); }
};

/* ---------- multi-select with partial credit ---------- */
WIDGETS.multi={
  render:function(ex,host,A){
    if(!A.perm){ A.perm=shuffle(range(ex.data.options.length)); A.sel=[]; }
    draw();
    function draw(){
      var h='<p class="small">'+esc(ex.data.instruction||'Select all that apply. Partial credit applies: wrong selections subtract.')+'</p><div role="group" aria-label="Answer options">';
      for(var i=0;i<A.perm.length;i++){
        var oi=A.perm[i], on=(A.sel.indexOf(oi)>=0);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-oi="'+oi+'" role="checkbox" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+i)+'.</span><span>'+esc(ex.data.options[oi])+'</span></button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      var b=e.target.closest?e.target.closest('[data-oi]'):null;
      if(!b||S.checked[ex.id]) return;
      var oi=parseInt(b.getAttribute('data-oi'),10), p=A.sel.indexOf(oi);
      if(p>=0) A.sel.splice(p,1); else A.sel.push(oi);
      draw();
    };
  },
  grade:function(ex){ return gradeMulti(ex.data,S.ans[ex.id]); }
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match={
  render:function(ex,host,A){
    if(!A.rOrder){ A.rOrder=shuffle(range(ex.data.right.length)); A.sel={}; }
    draw();
    function draw(){
      var h='<p class="small">For each row, pick the matching description from the list.</p>';
      for(var i=0;i<ex.data.left.length;i++){
        var opts='<option value="">— choose —</option>';
        for(var j=0;j<A.rOrder.length;j++){
          var ri=A.rOrder[j];
          opts+='<option value="'+ri+'"'+(A.sel[i]===ri?' selected':'')+'>'+esc(ex.data.right[ri])+'</option>';
        }
        h+='<div class="mrow"><span class="mlab">'+esc(ex.data.left[i])+'</span>'+
           '<select data-li="'+i+'" aria-label="Match for row '+(i+1)+'">'+opts+'</select></div>';
      }
      host.innerHTML=h;
    }
    host.onchange=function(e){
      if(!e.target||!e.target.matches||!e.target.matches('select[data-li]')) return;
      if(S.checked[ex.id]) return;
      var i=parseInt(e.target.getAttribute('data-li'),10);
      A.sel[i]=e.target.value===''?null:parseInt(e.target.value,10);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.left.length;i++){
      var s=A.sel[i];
      if(s===null||s===undefined){ items.push({label:d.left[i],status:'missed',why:'No match chosen for this row.'}); }
      else if(s===d.pairs[i]){ H++; items.push({label:d.left[i]+' → '+d.right[d.pairs[i]],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:''}); }
      else { W++; items.push({label:d.left[i],status:'wrong',why:'You matched it to "'+d.right[s]+'". Correct: "'+d.right[d.pairs[i]]+'".'+(d.itemWhy&&d.itemWhy[i]?(' '+d.itemWhy[i]):'')}); }
    }
    return {H:H,W:W,N:d.left.length,items:items};
  }
};

/* ---------- drag & drop into buckets (partial credit per item) ---------- */
WIDGETS.dragdrop={
  render:function(ex,host,A){
    if(!A.placed){ A.placed={}; A.selItem=null; A.bankOrder=shuffle(range(ex.data.items.length)); }
    draw();
    function chip(ii){
      var inBucket=A.placed[ii]!==undefined;
      return '<button type="button" class="chip'+(A.selItem===ii?' sel':'')+'" draggable="true" data-item="'+ii+'">'+esc(ex.data.items[ii].t)+'</button>';
    }
    function draw(){
      var bank='<div class="bank" id="ddBank" data-bucket="-1">';
      for(var k=0;k<A.bankOrder.length;k++){ var ii=A.bankOrder[k]; if(A.placed[ii]===undefined) bank+=chip(ii); }
      bank+='</div>';
      var cols='';
      for(var b=0;b<ex.data.buckets.length;b++){
        var inner='';
        for(var id in A.placed){ if(A.placed[id]===b) inner+=chip(parseInt(id,10)); }
        cols+='<div class="bucket" data-bucket="'+b+'"><h4>'+esc(ex.data.buckets[b])+'</h4><div class="bitems">'+inner+'</div></div>';
      }
      host.innerHTML='<p class="small">Click an item, then click a bucket. You can also drag items with the mouse. Click a placed item to send it back.</p>'+bank+'<div class="buckets">'+cols+'</div>';
      var chips=host.querySelectorAll('.chip');
      for(var c=0;c<chips.length;c++){
        chips[c].addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',this.getAttribute('data-item')); });
      }
      var bks=host.querySelectorAll('.bucket, .bank');
      for(var d=0;d<bks.length;d++){
        bks[d].addEventListener('dragover',function(e){ e.preventDefault(); this.classList.add('dragover'); });
        bks[d].addEventListener('dragleave',function(){ this.classList.remove('dragover'); });
        bks[d].addEventListener('drop',function(e){
          e.preventDefault(); this.classList.remove('dragover');
          if(S.checked[ex.id]) return;
          var ii=parseInt(e.dataTransfer.getData('text/plain'),10);
          if(isNaN(ii)) return;
          var b=this.getAttribute('data-bucket');
          if(b==='-1'||b===null){ delete A.placed[ii]; } else { A.placed[ii]=parseInt(b,10); }
          A.selItem=null; draw();
        });
      }
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var ch=e.target.closest?e.target.closest('[data-item]'):null;
      if(ch){
        var ii=parseInt(ch.getAttribute('data-item'),10);
        if(A.placed[ii]!==undefined && A.selItem!==ii){ delete A.placed[ii]; A.selItem=null; }
        else { A.selItem=(A.selItem===ii)?null:ii; }
        draw(); return;
      }
      var bk=e.target.closest?e.target.closest('[data-bucket]'):null;
      if(bk && A.selItem!==null && A.selItem!==undefined){
        var b=bk.getAttribute('data-bucket');
        if(b==='-1'||b===null){ delete A.placed[A.selItem]; }
        else { A.placed[A.selItem]=parseInt(b,10); }
        A.selItem=null; draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.items.length;i++){
      var p=A.placed[i];
      if(p===undefined){ items.push({label:d.items[i].t,status:'missed',why:'You left this item in the bank.'}); }
      else if(p===d.items[i].b){ H++; items.push({label:d.items[i].t+' → '+d.buckets[d.items[i].b],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:''}); }
      else { W++; items.push({label:d.items[i].t,status:'wrong',why:'You placed it in "'+d.buckets[p]+'". Correct bucket: "'+d.buckets[d.items[i].b]+'".'}); }
    }
    return {H:H,W:W,N:d.items.length,items:items};
  }
};

/* ---------- ordering / ranking (partial credit per position) ---------- */
WIDGETS.order={
  render:function(ex,host,A){
    if(!A.rows){ A.rows=shuffle(range(ex.data.items.length)); }
    draw();
    function draw(){
      var h='<p class="small">Put the items in the requested order. Use the arrows, or drag rows with the mouse.</p>';
      for(var i=0;i<A.rows.length;i++){
        h+='<div class="ordrow" draggable="true" data-pos="'+i+'"><span class="pos">'+(i+1)+'</span>'+
           '<span class="otext">'+esc(ex.data.items[A.rows[i]])+'</span>'+
           '<button type="button" class="mv" data-mv="up" data-i="'+i+'" aria-label="Move up">&#8593;</button>'+
           '<button type="button" class="mv" data-mv="down" data-i="'+i+'" aria-label="Move down">&#8595;</button></div>';
      }
      host.innerHTML=h;
      var rows=host.querySelectorAll('.ordrow');
      for(var r=0;r<rows.length;r++){
        rows[r].addEventListener('dragstart',function(e){ this.classList.add('dragging'); e.dataTransfer.setData('text/plain',this.getAttribute('data-pos')); });
        rows[r].addEventListener('dragend',function(){ this.classList.remove('dragging'); });
        rows[r].addEventListener('dragover',function(e){ e.preventDefault(); });
        rows[r].addEventListener('drop',function(e){
          e.preventDefault();
          if(S.checked[ex.id]) return;
          var from=parseInt(e.dataTransfer.getData('text/plain'),10), to=parseInt(this.getAttribute('data-pos'),10);
          if(isNaN(from)||isNaN(to)||from===to) return;
          var it=A.rows.splice(from,1)[0];
          A.rows.splice(to,0,it);
          draw();
        });
      }
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var b=e.target.closest?e.target.closest('[data-mv]'):null;
      if(!b) return;
      var i=parseInt(b.getAttribute('data-i'),10), j=(b.getAttribute('data-mv')==='up')?i-1:i+1;
      if(j<0||j>=A.rows.length) return;
      var t=A.rows[i]; A.rows[i]=A.rows[j]; A.rows[j]=t;
      draw();
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<A.rows.length;i++){
      var it=A.rows[i], ok=(it===i);
      if(ok) H++; else W++;
      items.push({label:'Position '+(i+1)+': '+d.items[it],status:ok?'correct':'wrong',
        why:ok?'':('Correct item for this position: "'+d.items[i]+'"')});
    }
    return {H:H,W:W,N:d.items.length,items:items};
  }
};

/* ---------- fill-in-the-blank with word bank (partial credit per blank) ---------- */
WIDGETS.fill={
  render:function(ex,host,A){
    if(!A.filled){ A.filled={}; A.selSlot=null; A.bankOrder=shuffle(range(ex.data.bank.length)); }
    draw();
    function draw(){
      var parts=ex.data.text.split(/\{(\d+)\}/), h='<p class="filltext">';
      for(var i=0;i<parts.length;i++){
        if(i%2===0){ h+=esc(parts[i]); }
        else{
          var k=parseInt(parts[i],10), w=A.filled[k];
          h+='<button type="button" class="slotbtn'+(w?' filled':'')+(A.selSlot===k?' sel':'')+'" data-slot="'+k+'">'+(w?esc(w):'blank '+(k+1))+'</button>';
        }
      }
      h+='</p><p class="small">Word bank (shuffled). Click a blank, then a word — or click a word first. Click a filled blank to clear it.</p><div class="bank" id="fillBank">';
      for(var j=0;j<A.bankOrder.length;j++){
        var b=A.bankOrder[j], used=false;
        for(var key in A.filled){ if(A.filled[key]===ex.data.bank[b]) used=true; }
        h+='<button type="button" class="chip'+(used?' used':'')+'" data-bank="'+b+'">'+esc(ex.data.bank[b])+'</button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var sl=e.target.closest?e.target.closest('[data-slot]'):null;
      if(sl){
        var k=parseInt(sl.getAttribute('data-slot'),10);
        if(A.filled[k]){ delete A.filled[k]; A.selSlot=null; }
        else { A.selSlot=k; }
        draw(); return;
      }
      var ch=e.target.closest?e.target.closest('[data-bank]'):null;
      if(ch){
        var w=ex.data.bank[parseInt(ch.getAttribute('data-bank'),10)];
        var target=(A.selSlot!==null&&A.selSlot!==undefined)?A.selSlot:null;
        if(target===null){
          for(var t=0;t<ex.data.answers.length;t++){ if(!A.filled[t]){ target=t; break; } }
        }
        if(target!==null){ A.filled[target]=w; A.selSlot=null; }
        draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var k=0;k<d.answers.length;k++){
      var w=A.filled[k];
      if(!w){ items.push({label:'Blank '+(k+1),status:'missed',why:'You left this blank empty.'}); }
      else if(w.toLowerCase()===String(d.answers[k]).toLowerCase()){ H++; items.push({label:'Blank '+(k+1)+': '+d.answers[k],status:'correct',why:d.itemWhy&&d.itemWhy[k]?d.itemWhy[k]:''}); }
      else { W++; items.push({label:'Blank '+(k+1),status:'wrong',why:'You wrote "'+w+'". Correct: "'+d.answers[k]+'".'}); }
    }
    return {H:H,W:W,N:d.answers.length,items:items};
  }
};

/* ---------- terminal emulator (fake shell, normaliser, element scoring) ---------- */
WIDGETS.terminal={
  render:function(ex,host,A){
    if(!A.hist){ A.hist=[]; A.cmd=''; }
    var d=ex.data;
    var syn=d.syntaxPanel?'<div class="synpanel"><b>Syntax reminder</b>'+d.syntaxPanel.map(function(l){return esc(l);}).join('<br>')+'</div>':'';
    var samp=d.sampleOutput?'<div class="synpanel"><b>Sample output on a different target</b><pre class="plain" style="margin:6px 0 0">'+esc(d.sampleOutput.join('\n'))+'</pre></div>':'';
    host.innerHTML=
      '<p class="small">'+esc(d.note||'Type the command, press Enter to run it in the fake shell, then press Check.')+'</p>'+syn+samp+
      '<div class="term"><div class="term-out" id="termOut"></div>'+
      '<div class="term-line"><span class="ps1">'+esc(d.ps1)+'$</span>'+
      '<input id="termIn" class="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder="'+esc(d.placeholder||'type a command and press Enter')+'"></div></div>';
    var out=$('termOut'), inp=$('termIn');
    function line(txt,dim){ var p=document.createElement('div'); if(dim) p.style.opacity='.75'; p.textContent=txt; out.appendChild(p); out.scrollTop=out.scrollHeight; }
    for(var i=0;i<d.banner.length;i++) line(d.banner[i],true);
    if(d.banner.length) line(' ');
    inp.onkeydown=function(e){
      if(e.key!=='Enter') return;
      var c=inp.value; inp.value='';
      if(!c.trim()) return;
      A.cmd=c; A.hist.push(c);
      line(d.ps1+'$ '+c,false);
      var tok=c.trim().split(/\s+/)[0].toLowerCase();
      if(d.simTool.indexOf(tok)>=0){ for(var k=0;k<d.output.length;k++) line(d.output[k],false); }
      else if(tok==='clear'){ out.innerHTML=''; }
      else { line(tok+': command not found'); }
      line(' ',false);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    var cmd=normCmd(A.cmd||(A.hist.length?A.hist[A.hist.length-1]:''));
    var H=0,W=0,items=[],i,el,ok;
    for(i=0;i<d.required.length;i++){
      el=d.required[i]; ok=false;
      if(el.all&&hasAll(cmd,el.all)) ok=true;
      if(!ok&&el.any&&hasAny(cmd,el.any)) ok=true;
      if(ok) H++;
      items.push({label:el.label,status:ok?'correct':'missed',why:ok?(el.whyOk||''):(el.why||'This element is missing from your command.')});
    }
    for(i=0;i<(d.forbidden||[]).length;i++){
      var f=d.forbidden[i], bad=false;
      if(f.any&&hasAny(cmd,f.any)) bad=true;
      if(!bad&&f.re){ try{ bad=new RegExp(f.re,'i').test(cmd); }catch(e){} }
      if(bad){ W++; items.push({label:f.label,status:'wrong',why:f.why}); }
    }
    if(!cmd){ items.push({label:'No command typed',status:'wrong',why:'You did not type or run any command.'}); W+=1; }
    return {H:H,W:W,N:d.required.length,items:items};
  },
  canonical:function(ex){
    var d=ex.data, h='<b>Canonical command (copyable):</b><pre class="plain" id="canonCmd">'+esc(d.expected)+'</pre>'+
      '<div class="actions" style="margin-top:-6px"><button type="button" class="btn ghost" data-act="copy">&#128203; Copy command</button></div>'+
      (d.parts?'<b>Part by part:</b><ul class="fb-items">':'');
    if(d.parts){
      for(var i=0;i<d.parts.length;i++) h+='<li><code>'+esc(d.parts[i].c)+'</code> — '+esc(d.parts[i].w)+'</li>';
      h+='</ul>';
    }
    return h;
  }
};

/* ---------- log viewer (filter box + embedded answer) ---------- */
WIDGETS.logview={
  render:function(ex,host,A){
    if(!A.f){ A.f=''; }
    if(!A.sel) A.sel=[];
    if(!A.sub) A.sub={};
    var clicky=(ex.data.mode==='cardsel');
    var rows='';
    for(var i=0;i<ex.data.lines.length;i++){
      rows+='<div class="ll'+(clicky?' clicky':'')+(clicky&&A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
    }
    host.innerHTML=
      '<div class="logv"><div class="logv-bar"><input id="logF" type="text" placeholder="Filter lines (plain text)…" value="'+esc(A.f)+'" aria-label="Filter log lines">'+
      '<span class="logv-cnt" id="logC"></span></div><div class="logv-lines" id="logL">'+rows+'</div></div>'+
      '<div id="logAns"></div>';
    var f=$('logF');
    function applyF(){
      A.f=f.value;
      var lls=$('logL').querySelectorAll('.ll'), n=0;
      for(var k=0;k<lls.length;k++){
        var show=!A.f||ex.data.lines[k].toLowerCase().indexOf(A.f.toLowerCase())>=0;
        lls[k].classList.toggle('off',!show);
        if(show) n++;
      }
      $('logC').textContent='showing '+n+' of '+ex.data.lines.length+' lines';
    }
    f.oninput=applyF; applyF();
    if(clicky){
      $('logL').onclick=function(e){
        if(S.checked[ex.id]) return;
        var r=e.target.closest?e.target.closest('[data-li]'):null;
        if(!r) return;
        var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
        if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
        r.classList.toggle('sel',A.sel.indexOf(i)>=0);
      };
    }
    var subHost=$('logAns');
    if(ex.data.mode==='qcm'){ WIDGETS.qcm.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
    else if(ex.data.mode==='multi'){ WIDGETS.multi.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    if(d.mode==='qcm') return gradeQCM(d.sub,A.sub);
    if(d.mode==='multi') return gradeMulti(d.sub,A.sub);
    return gradeCardsel(d,A);
  }
};

/* ---------- cardsel: click lines in an artefact ---------- */
WIDGETS.cardsel={
  render:function(ex,host,A){
    if(!A.sel) A.sel=[];
    draw();
    function draw(){
      var h='<p class="small">Click the line(s) inside the artefact. Click again to un-select.</p>'+
        '<div class="logv"><div class="logv-lines" id="csL">';
      for(var i=0;i<ex.data.lines.length;i++){
        h+='<div class="ll clicky'+(A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
      }
      host.innerHTML=h+'</div></div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var r=e.target.closest?e.target.closest('[data-li]'):null;
      if(!r) return;
      var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
      if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
      draw();
    };
  },
  grade:function(ex){ return gradeCardsel(ex.data,S.ans[ex.id]); }
};

/* ---------- branching decision tree (auto-pause only on final Check) ---------- */
WIDGETS.branch={
  render:function(ex,host,A){
    if(A.step===undefined){ A.step=0; A.picks=[]; A.sel=null; }
    host.innerHTML='<div id="brMini" aria-live="polite"></div><div id="brStep"></div>';
    draw();
    function draw(){
      var steps=ex.data.steps, i=A.step, st=steps[i];
      var chip=$('stepchip'); if(chip) chip.textContent='STEP '+(i+1)+' OF '+steps.length;
      if(!A.perm){ A.perm={}; }
      if(!A.perm[i]){ A.perm[i]=shuffle(range(st.options.length)); }
      var h='<p class="small">Decision tree: choose one option, then confirm. The timer keeps running between steps and stops only on the final Check.</p>';
      h+='<div style="margin-bottom:8px"><b>'+esc(st.q)+'</b></div>';
      var perm=(A.perm&&A.perm[i])?A.perm[i]:range(st.options.length);
      for(var j=0;j<perm.length;j++){
        var oi=perm[j], on=(A.sel===oi);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-boi="'+oi+'" role="radio" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+j)+'.</span><span>'+esc(st.options[oi])+'</span></button>';
      }
      h+='<div class="actions"><button type="button" class="btn '+(i===steps.length-1?'primary':'ghost')+'" id="brNext">'+(i===steps.length-1?'Check final answer':'Confirm step')+'</button></div>';
      $('brStep').innerHTML=h;
      $('brNext').onclick=function(){
        if(S.checked[ex.id]) return;
        if(A.sel===null){ $('brMini').innerHTML='<p class="small">Select an option first.</p>'; return; }
        A.picks[i]=A.sel;
        if(i<steps.length-1){
          var ok=(A.sel===steps[i].answer);
          $('brMini').innerHTML='<p class="small">'+(ok?'&#10003; Step '+(i+1)+' recorded — that is a reasonable step.':'&#10007; Step '+(i+1)+' recorded — keep it in mind; the full picture appears at the final Check.')+'</p>';
          A.step=i+1; A.sel=null;
          draw();
        } else {
          doCheck();
        }
      };
      host.onclick=function(e){
        var b=e.target&&e.target.closest?e.target.closest('[data-boi]'):null;
        if(!b) return;
        A.sel=parseInt(b.getAttribute('data-boi'),10);
        var all=$('brStep').querySelectorAll('[data-boi]');
        for(var k=0;k<all.length;k++){ var on2=all[k].getAttribute('data-boi')==String(A.sel); all[k].classList.toggle('sel',on2); all[k].setAttribute('aria-checked',on2?'true':'false'); }
      };
    }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.steps.length;i++){
      var st=d.steps[i], pick=A.picks[i];
      if(pick===undefined||pick===null){ items.push({label:'Step '+(i+1),status:'missed',why:'No choice recorded.'}); continue; }
      var ok=(pick===st.answer);
      if(ok) H++; else W++;
      items.push({label:'Step '+(i+1)+': '+st.short,status:ok?'correct':'wrong',
        why:ok?st.whyOk:('You chose "'+st.options[pick]+'". Best choice: "'+st.options[st.answer]+'". '+st.whyOk)});
    }
    return {H:H,W:W,N:d.steps.length,items:items};
  }
};

/* ---------- SOC alert triage queue (partial credit per alert) ---------- */
WIDGETS.triage={
  render:function(ex,host,A){
    if(!A.orders){ A.orders=[]; A.picks={}; for(var i=0;i<ex.data.alerts.length;i++) A.orders.push(shuffle(range(ex.data.alerts[i].actions.length))); }
    var h='<p class="small">Choose the best action for each alert, then press Check. Each alert scores one item.</p>';
    h+='<table class="tri"><thead><tr><th style="width:46%">Alert</th><th>Best action</th></tr></thead><tbody>';
    for(var a=0;a<ex.data.alerts.length;a++){
      var al=ex.data.alerts[a];
      var opts='<option value="">— choose —</option>';
      for(var j=0;j<A.orders[a].length;j++){
        var ai=A.orders[a][j];
        opts+='<option value="'+ai+'"'+(A.picks[a]===ai?' selected':'')+'>'+esc(al.actions[ai])+'</option>';
      }
      h+='<tr><td><b>'+esc(al.t)+'</b></td><td><select data-ai="'+a+'" aria-label="Action for alert '+(a+1)+'">'+opts+'</select></td></tr>';
    }
    host.innerHTML=h+'</tbody></table>';
    host.onchange=function(e){
      if(!e.target||!e.target.matches||!e.target.matches('select[data-ai]')) return;
      if(S.checked[ex.id]) return;
      var a=parseInt(e.target.getAttribute('data-ai'),10);
      A.picks[a]=e.target.value===''?null:parseInt(e.target.value,10);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var a=0;a<d.alerts.length;a++){
      var p=A.picks[a];
      if(p===null||p===undefined){ items.push({label:d.alerts[a].t,status:'missed',why:'No action chosen for this alert.'}); }
      else if(p===d.alerts[a].correct){ H++; items.push({label:d.alerts[a].t,status:'correct',why:d.alerts[a].whyOk||''}); }
      else { W++; items.push({label:d.alerts[a].t,status:'wrong',why:'You chose "'+d.alerts[a].actions[p]+'". Best: "'+d.alerts[a].actions[d.alerts[a].correct]+'". '+(d.alerts[a].whyOk||'')}); }
    }
    return {H:H,W:W,N:d.alerts.length,items:items};
  }
};

/* ---------- copy support for canonical command blocks ---------- */
document.addEventListener('click', function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act="copy"]'):null;
  if(!el) return;
  var pre=$('canonCmd');
  if(pre && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pre.textContent).catch(function(){});
  }
});

/* ---------- boot ---------- */
renderHeader();
showIntro();
})();

</script>
