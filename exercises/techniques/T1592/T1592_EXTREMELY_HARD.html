<script>
var EXAM = {"meta":{"topicId":"t1592","batch":4,"title":"T1592 Gather Victim Host Information — Extremely Hard","difficulty":"extremely-hard","questionCount":15,"estimatedMinutes":60,"passMark":70},"severity":{"label":"EXTREMELY HARD","cls":"xhard","meaning":"Senior-analyst decisions. Several chained concepts, conflicting signals, missing information, and real business cost in the choices."},"keywords":[{"theme":"Technique basics","items":["T1592 — Gather Victim Host Information","Technique (object type)","Tactic: Reconnaissance (TA0043)","Pre-compromise phase","Sub-technique T1592.001 Hardware","Sub-technique T1592.002 Software","Sub-technique T1592.003 Firmware","Sub-technique T1592.004 Client Configurations"]},{"theme":"What attackers collect","items":["CPU and RAM details","Device models","BIOS / UEFI versions","Operating system and patch level","Installed software versions","Service banners","SNMP sysDescr strings","Browser and mail client settings"]},{"theme":"How attackers collect","items":["Banner grabbing (curl -I, telnet, netcat)","SNMP queries (snmpwalk) with 'public'","nmap -sV service detection","masscan port sweeps","Shodan / Censys device databases","Wappalyzer / BuiltWith web fingerprinting","Reading victim-owned websites","Job postings and asset leaks"]},{"theme":"Neighbouring techniques","items":["T1589 Gather Victim Identity Information","T1590 Gather Victim Network Information","T1591 Gather Victim Org Information","T1593 Search Open Websites/Domains","T1594 Search Victim-Owned Websites","T1595 Active Scanning","T1595.002 Vulnerability Scanning","T1596 Search Open Technical Databases","T1597 Search Closed Sources"]},{"theme":"Telemetry and detection","items":["Web access logs (method + User-Agent)","Firewall and connection logs","IDS/IPS scanner signatures","DNS analytics","Honeypots","Probe cadence and low-and-slow patterns","False positives: uptime monitors, vendor scans","Tuning with asset and maintenance inventories"]},{"theme":"Mitigations and controls","items":["M1056 Pre-compromise","server_tokens off / banner discipline","Disable SNMP v1/v2c 'public'","Remove end-of-life exposed hosts","Patch and reduce exposed surface","Rate limiting and tarpits","WAF header normalisation"]},{"theme":"Real-world use and roles","items":["SOC alert triage","CTI reporting with ATT&CK IDs","Attack surface management","Detection engineering","Red team OSINT in authorised tests","Exploit tailoring before T1190","Edge-device recon playbooks (Volt Typhoon-style)"]}],"intro":["This exam is about <b>MITRE ATT&amp;CK technique T1592 — Gather Victim Host Information<\/b>. ATT&amp;CK is a free, public knowledge base that describes what real attackers do. Every action gets an ID. T1592 is a <b>Technique<\/b> (an object type that describes one attacker behaviour). It lives inside the <b>Reconnaissance tactic (TA0043)<\/b>. A tactic is a phase of an attack. Reconnaissance is the first phase: it happens <b>before<\/b> the attacker gets into a network. In this phase you will learn how attackers study a victim's computers, and how defenders work with that behaviour.","<b>What the technique describes.<\/b> The attacker collects facts about the victim's hosts (computers and devices). The facts fall into four groups, and each group is a sub-technique with its own ID: <b>T1592.001 Hardware<\/b> (CPU, RAM, device models), <b>T1592.002 Software<\/b> (operating systems, installed programs, exact versions, patch levels), <b>T1592.003 Firmware<\/b> (BIOS/UEFI versions baked into chips), and <b>T1592.004 Client Configurations<\/b> (browser types and versions, mail client settings, VPN client setups on staff devices).","<b>Why attackers do it.<\/b> Host facts make attacks precise. If an attacker learns that a web server runs an old software version, they can search for a known bug in that version. If they learn which remote-access tool a company uses, they can prepare an attack that fits that tool. Good reconnaissance saves the attacker attempts and lowers the chance that noise triggers an alert. This is why T1592 often feeds the next phase, Initial Access, for example exploiting a public-facing application (T1190).","<b>How attackers do it.<\/b> Often from outside the victim's network. They grab service banners (a banner is the short introduction a service sends: for example a web server saying 'Server: nginx/1.18.0'). They query devices with SNMP when the default community string 'public' still works. They scan with tools like nmap or masscan. They read public device databases such as Shodan or Censys, which index banners from millions of exposed devices. They fingerprint web technology from the browser with tools like Wappalyzer.","<b>Where you meet T1592 in real work.<\/b> A <b>SOC analyst<\/b> triages scan alerts and separates real recon from benign scanners. A <b>threat intelligence (CTI) analyst<\/b> maps attacker reports to T1592 and writes briefings with the correct IDs. A <b>detection engineer<\/b> builds analytics on web access logs, firewall logs and IDS alerts to catch fingerprinting. An <b>attack surface management<\/b> or vulnerability management team reduces what leaks: hiding version banners, turning off SNMP 'public', removing end-of-life hosts. A <b>red teamer<\/b> uses the same actions in authorised tests. A <b>GRC analyst<\/b> checks that policies cover information exposure. Deliverables include alert tickets, exposure reports, CTI reports with ATT&amp;CK IDs, and detection rules.","<b>The risk it addresses, and one honest limit.<\/b> If attackers learn your exact versions, their attacks get sharper and harder to spot. Note the limit: much of this activity happens outside your network, so you often cannot see it directly. ATT&amp;CK itself lists the mitigation <b>M1056 Pre-compromise<\/b> for T1592: you cannot stop someone thinking about you, but you can shrink what they learn — and you can watch your edge for probing patterns."],"typeList":"branching decision trees, multiple-choice questions, multi-select with partial credit, log analysis with a filter box, terminal emulator exercises, matching, click-the-line artefact analysis, ordering and ranking, fill-in-the-blank, drag & drop","exercises":[{"id":"X01","type":"branch","typeName":"Decision tree","title":"CR-2026-09: five calls in a live campaign","summary":"Day 5 of a campaign: separate two scan sources, protect evidence, push back on a bad best-practice.","blocks":[{"k":"p","t":"Nordhaul Logistics, day 5. Two scan sources overlap: (1) IDS fired a masscan signature from 198[.]51[.]100[.]77 — inside partner Baltic Transit's announced scan window (ticket PT-2214, signed, Sep 14–15); (2) web logs show slow HEAD probes with rotating UAs from 45[.]155[.]205[.]11, five days, always 3–7 probes per night, reading Server headers on web01 and probing SNMP on the edge firewall. You hold the IR lead seat. The CISO wants a decision every hour. Five calls, in order."},{"k":"art","label":"ARTEFACT — two sources at a glance","wrap":true,"lines":["Source A: 198[.]51[.]100[.]77  | masscan burst | Baltic Transit partner | window PT-2214 Sep 14-15 | broad port sweep","Source B: 45[.]155[.]205[.]11  | slow HEAD + SNMP reads | unknown | 5 days, 3-7 probes/night | version + sysDescr focus"]}],"question":"Step through the five decisions in order. Each choice shapes the next.","hint":"Two sources are not one incident. Evidence beats reflex; the loud best-practice answer is not always the right one; containment that destroys evidence loses the case.","explanation":"Call 1: separate the sources first — one is contractually explained (A), one is not (B); blocking both destroys the partner relationship and the evidence at once. Call 2: source B's shape (low-rate, version-focused, SNMP reads) is targeted pre-compromise recon, not a crawler, backup job, or flood. Call 3: country-wide blocking is the CISO's instinct but it breaks partner traffic, misses proxy-routed actors, and tips the actor off — the correct answer rejects the popular best practice with reasons and offers targeted containment instead. Call 4: before touching web01, capture volatile data — network traffic and memory — because every rebuild or reboot erases it. Call 5: escalate to IR with the evidence package and contain SNMP read access; wiping now is irreversible, waiting silently risks the actor's next phase, and a premature public breach statement has legal consequences. Five chained calls, each dependent on the last: that is senior IR work.","study":"Source separation, evidence-first sequencing, best-practice pushback, volatile-order capture, escalation.","attdef":"Attacker view: hiding inside a partner's legitimate scan window is a classic cover. Defender view: the actor's patience is the tell — and your evidence discipline decides the outcome.","data":{"steps":[{"q":"Hour 1 — both sources still active. First move?","short":"Separate the two sources","options":["Block both IPs at the edge immediately","Reboot the edge firewall to clear its state","Brief the CEO that a partner is attacking","Pull 7 days of DMZ logs and split the two sources into separate timelines"],"answer":3,"whyOk":"Two sources with different owners and cadences must be separated before any action is defensible."},{"q":"Hour 2 — source B isolated: 3-7 probes/night, 5 days, Server headers + SNMP sysDescr. Assessment?","short":"Targeted recon, not noise","options":["A misrouted backup job","The start of a DDoS flood","Targeted pre-compromise reconnaissance (host fingerprinting)","A broken search-engine crawler"],"answer":2,"whyOk":"Low-rate, version-focused, edge-scoped persistence is recon — floods, crawls and backups look nothing like this."},{"q":"Hour 3 — CISO: 'Just block that whole country at the firewall, best practice.' Your response?","short":"Reject the popular move with reasons","options":["Publish the actor's IOCs on the company blog","Propose targeted containment (rate-limit + SNMP closure) and keep evidence intact; country blocks break partners and miss proxies","Execute the country block immediately as asked","Ignore the CISO and change nothing at all"],"answer":1,"whyOk":"The widely quoted best practice fails here: it breaks partner traffic, misses proxy-routed actors, and burns your quiet observation."},{"q":"Hour 4 — web01 still live and possibly beaconing. What do you capture FIRST, and how?","short":"Volatile data to external media","options":["Network traffic and memory, in that order, to external evidence media — before any reboot","A screenshot of the console","A full disk image that takes nine hours","Nothing; let it run another week"],"answer":0,"whyOk":"Volatile order matters: network and memory die first; slow disk images let them die while you wait."},{"q":"Hour 5 — what is the decision of record?","short":"Escalate with evidence","options":["Stay silent and watch for two more weeks","Announce a public breach statement before facts are established","Escalate to formal IR with the evidence package; close SNMP reads; no destructive action yet","Wipe web01 and rebuild tonight"],"answer":2,"whyOk":"Escalation with intact evidence plus surgical containment is the defensible record; wiping, waiting, or announcing early all lose."}]}},{"id":"X02","type":"qcm","typeName":"Conflicting signals","title":"Ten minutes for the CISO","summary":"Two contradictory signals, one decision window, one defensible call.","blocks":[{"k":"p","t":"09:58. The CISO walks over: 'Ten minutes. Is the partner attacking us or not?' You have: IDS masscan signature from 198[.]51[.]100[.]77 (Baltic Transit range) — and ticket PT-2214 confirming a partner scan window covering today — plus five days of slow version probes from the unrelated 45[.]155[.]205[.]11 that nobody owns. The board meets at noon."}],"question":"What do you tell the CISO — the call that survives scrutiny at noon?","hint":"One signal has an owner and a ticket; the other has neither. What is the defensible position on each, in ten minutes?","explanation":"The defensible ten-minute call: treat the partner masscan as expected-but-verified — confirm it against the signed ticket while the clock runs — and keep the team watching the unowned IP while evidence gathers. Declaring a P1 'partner attack' against a ticketed window would collapse at noon and damage a business relationship; 'nothing at all' ignores five days of targeted recon; blocking the whole partner ASN punishes a partner for its own contracted scan. Senior triage often means holding two truths at once: one signal explained, one under active observation.","study":"Decision discipline under time pressure: verify owned signals, observe unowned ones, commit to neither prematurely.","data":{"options":["Verify the partner scan against PT-2214; watch the unknown IP","Declare a P1 incident now: the partner is attacking us","Take no action on any of the signals today","Block the whole Baltic Transit ASN at the edge now"],"answer":0,"why":"Ticketed activity gets verified, not weaponised; unowned targeted recon gets observation and evidence — both positions survive scrutiny."}},{"id":"X03","type":"multi","typeName":"Evidence-bounded conclusions","title":"What may we actually claim?","summary":"Four candidate conclusions — select only those the artefacts support.","blocks":[{"k":"p","t":"The day-5 evidence pack contains: 5 days of HEAD probes reading Server headers on web01 (logged 200s), partial SNMP captures showing sysDescr reads on edge-fw, the partner scan ticket PT-2214, and no outbound anomaly findings. Legal will read your conclusions literally. Select ONLY the conclusions the evidence supports."},{"k":"art","label":"ARTEFACT — evidence pack summary","wrap":true,"lines":["E1: 5 days of HEAD 200s on web01 reading Server headers, source 45[.]155[.]205[.]11","E2: partial SNMP captures: sysDescr reads on edge-fw, source unknown (capture gaps)","E3: ticket PT-2214: partner Baltic Transit scan window Sep 14-15","E4: outbound analysis: no anomaly findings (as of day 5)"]}],"question":"Select ALL conclusions that the evidence pack actually supports.","hint":"Supported means: a reasonable reviewer reading E1–E4 cannot reasonably disagree. Watch for the word 'all' and the word 'proves'.","explanation":"Supported: an unknown external actor ran low-and-slow host fingerprinting (E1, and E2's SNMP reads fit the same patient profile); at least one software version was learned (E1 shows the Server header was served, 200s); SNMP exposure increased recon value (E2). NOT supported: the partner scan explains ALL probes — E1 and E3 differ in source, cadence and depth; and exfiltration is 'proven' nowhere — E4 explicitly found no outbound anomaly. Legal-grade writing claims only what evidence compels.","study":"Evidence-bounded writing: each claim must trace to an artefact; absence of proof is not proof of absence.","data":{"options":["Attackers learned at least one software version from banners","Data exfiltration is proven by the evidence pack","The open SNMP service raised the recon value for the actor","An unknown actor ran low-and-slow host fingerprinting for five days","The partner scan explains ALL observed probe activity"],"answers":[3,0,2],"instruction":"Select all that apply. Partial credit applies.","itemWhy":{"3":"E1's five-day pattern from an unowned source supports it directly.","0":"E1 shows version-bearing headers served with 200s — the fact left the perimeter.","2":"E2 shows sysDescr reads succeeding through the open community."},"wrongWhy":{"4":"E1 and E3 differ in source, cadence and depth — 'ALL' is contradicted by the artefacts.","1":"E4 found no outbound anomaly; nothing proves exfiltration."}}},{"id":"X04","type":"logview","typeName":"Log analysis","title":"Find the patient signal in the noise","summary":"Twelve noisy lines — select the three low-and-slow recon probes.","blocks":[{"k":"p","t":"web01's week-long window, condensed to twelve lines. The monitor vendor health-checks /health every few hours from its fixed IP. Backups pull /backup-status nightly at 02:00 from inside. Somewhere in here, an unknown IP collected host information three times. Select ALL three recon lines."},{"k":"art","label":"ARTEFACT — web01 access log, condensed week","wrap":true,"lines":["Tue 01:57  \"HEAD /server-info HTTP/1.1\" 403 \"python-requests/2.31.0\"  saddr=45[.]155[.]205[.]11","Tue 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Tue 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Wed 03:14  \"HEAD / HTTP/1.1\" 200 \"curl/8.5.0\"                        saddr=45[.]155[.]205[.]11","Wed 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Thu 01:12  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Thu 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Thu 04:38  \"HEAD /server-info HTTP/1.1\" 403 \"curl/8.5.0\"              saddr=45[.]155[.]205[.]11","Fri 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Fri 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Sat 04:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Sun 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200"]}],"question":"Select the THREE lines that belong to the unknown low-and-slow actor.","hint":"Two sources are owned and rhythmic (monitor, backup). The actor is neither — follow source, method, and irregular times.","explanation":"The three recon lines are Tuesday 01:57, Wednesday 03:14 and Thursday 04:38 from 45[.]155[.]205[.]11: HEAD probes of / and /server-info at irregular night hours — classic low-and-slow version collection. The monitor (SitePulse, 192[.]0[.]2[.]200, rhythmic /health) and the backup agent (10[.]20[.]30[.]9, exact 02:00, /backup-status) are owned sources with fixed rhythms. The detection lesson: cadence and source consistency separate the patient actor from three kinds of legitimate traffic, and a naive 'alert on HEAD' rule would have drowned in health-check noise.","study":"Low-and-slow detection: source consistency, irregular cadence, and info-endpoint focus.","attdef":"Attacker view: hiding inside nightly rhythms works — until defenders correlate sources. Defender view: baselines per source make the odd man out jump out.","data":{"lines":["Tue 01:57  \"HEAD /server-info HTTP/1.1\" 403 \"python-requests/2.31.0\"  saddr=45[.]155[.]205[.]11","Tue 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Tue 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Wed 03:14  \"HEAD / HTTP/1.1\" 200 \"curl/8.5.0\"                        saddr=45[.]155[.]205[.]11","Wed 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Thu 01:12  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Thu 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Thu 04:38  \"HEAD /server-info HTTP/1.1\" 403 \"curl/8.5.0\"              saddr=45[.]155[.]205[.]11","Fri 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Fri 02:00  \"GET /backup-status HTTP/1.1\" 200 \"backup-agent/3.2\"       saddr=10[.]20[.]30[.]9","Sat 04:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200","Sun 05:00  \"GET /health HTTP/1.1\" 200 \"SitePulse Monitor/1.0\"         saddr=192[.]0[.]2[.]200"],"mode":"multi","sub":{"options":["Thu 04:38 HEAD /server-info from 45[.]155[.]205[.]11","Tue 02:00 GET /backup-status from 10[.]20[.]30[.]9","Sat 04:00 GET /health from 192[.]0[.]2[.]200","Tue 01:57 HEAD /server-info from 45[.]155[.]205[.]11","Wed 03:14 HEAD / from 45[.]155[.]205[.]11"],"answers":[3,4,0],"instruction":"Select all that apply. Partial credit applies.","itemWhy":{"3":"Unowned source, info endpoint, irregular hour.","4":"Same unowned source, banner grab, different night.","0":"Third probe in the patient series."},"wrongWhy":{"1":"The owned backup agent on its exact schedule.","2":"The owned monitor on its rhythm."}}}},{"id":"X05","type":"terminal","typeName":"Terminal — timed","title":"Evidence before everything","summary":"One timed command: capture volatile network evidence to external media. Reduced timer: 4 minutes.","timerSec":240,"blocks":[{"k":"p","t":"IR lead, 23:40. web01 (Ubuntu 20.04, DMZ) is suspected compromised and still beaconing. Legal's requirement: evidence that survives scrutiny. Constraints: the host stays live; NOTHING is written onto the compromised disk; the mounted USB evidence drive is /mnt/usb (read-write). tcpdump is on the host. Interface: eth0. You get a reduced 4-minute timer for this command — then the window closes."},{"k":"art","label":"ARTEFACT — constraints card","wrap":true,"lines":["Host: web01 (suspected compromised, LIVE, do not stop the service)","Evidence rule: nothing on the compromised disk; write to /mnt/usb only","Goal: capture volatile network traffic to a file on the USB drive","Interface: eth0   |   Tool on host: tcpdump"]}],"question":"Type the tcpdump command that writes a packet capture of eth0 to a file on /mnt/usb. Run it, then Check.","hint":"The safe and the destructive commands differ by ONE path. The evidence must not touch the compromised disk — and the interface flag belongs to tcpdump, not to you.","explanation":"The canonical command is: tcpdump -i eth0 -w /mnt/usb/web01-evidence.pcap. tcpdump captures raw traffic; -i eth0 selects the interface the beaconing must cross; -w writes the raw capture to a file — and /mnt/usb keeps it off the compromised disk, preserving admissibility. The dangerous near-miss: '-w /var/log/evidence.pcap' or any path on the compromised disk — writing evidence onto a compromised filesystem taints it, and may overwrite data you later need. Likewise 'dd' of the live disk or stopping the interface would destroy or freeze the volatile state legal needs. The command is the easy part; choosing the safe one under pressure is the test.","study":"Volatile-order evidence capture; admissible storage; tcpdump -i/-w anatomy.","attdef":"Defender view: the safe command is the only one that survives court. Attacker view: defenders who panic with dd or reboots do you a favour — do not be that defender.","data":{"ps1":"ir-lead@web01","banner":["Connected to web01 (SUSPECTED COMPROMISED — LIVE).","Legal: evidence must survive scrutiny. Nothing writes to the compromised disk.","Evidence drive mounted at /mnt/usb."],"simTool":["tcpdump"],"output":["listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes","capturing to /mnt/usb/web01-evidence.pcap ..."],"placeholder":"type your tcpdump command","expected":"tcpdump -i eth0 -w /mnt/usb/web01-evidence.pcap","required":[{"label":"Tool tcpdump","all":["tcpdump"],"why":"tcpdump is the on-host capture tool; it observes without altering state.","whyOk":"Correct capture tool."},{"label":"Interface -i eth0","all":["-i","eth0"],"why":"The beaconing crosses eth0; without the interface flag the capture may bind elsewhere.","whyOk":"Correct interface selection."},{"label":"Output to /mnt/usb via -w","all":["-w","/mnt/usb"],"why":"Legal requires evidence on external media; -w writes the raw capture.","whyOk":"Evidence lands on external media, off the compromised disk."}],"forbidden":[{"label":"Evidence written onto the compromised disk","re":"\\s-w\\s*/(var|tmp|root|home|opt|usr|etc)(/|\\s|$)","any":["-w /var","-w /tmp","-w /root","-w /home","-w /opt","-w /usr","-w /etc"],"why":"Writing the capture onto the compromised filesystem taints the evidence chain and may clobber data — legal would likely reject it."},{"label":"State-destroying action (dd / reboot / shutdown / downing the interface)","any":["dd ","reboot","shutdown","eth0 down","ifconfig eth0 down","ip link set eth0 down"],"why":"Disk imaging freezes the volatile window for hours and dd/reboot/downing the interface destroys the live state you were sent to preserve."}],"parts":[{"c":"tcpdump","w":"Raw network capture — read-only observation of live traffic."},{"c":"-i eth0","w":"Bind the capture to the interface the beaconing must cross."},{"c":"-w /mnt/usb/web01-evidence.pcap","w":"Write the raw capture to the external evidence drive, off the compromised disk."}]}},{"id":"X06","type":"qcm","typeName":"Best-practice trap","title":"When the standard is wrong tonight","summary":"Rebuild-on-suspicion meets a legal hold — which wins, and why.","blocks":[{"k":"p","t":"Ops standard OPS-114 says: 'On suspected compromise, rebuild the host from the golden image immediately.' Legal has placed a preservation hold on web01: they need the live state captured first. The on-call manager says: 'Standards exist for a reason — rebuild now.'"}],"question":"Which decision is correct under the preservation hold?","hint":"Both rules are real. One serves the incident, one serves the court. Sequence them.","explanation":"The correct call: capture volatile evidence first, then rebuild per OPS-114 — the hold legally suspends the rebuild deadline, and wiping now destroys the exact state the court will ask about. 'Rebuild instantly' applies the right standard at the wrong time; 'never rebuild' abandons a needed control; 'ask the attacker' is absurd. Senior engineers know when a good default is wrong: context (a legal hold) reorders even excellent practices.","study":"Legal holds versus operational standards; sequencing evidence capture before remediation.","data":{"options":["Never rebuild web01; leave it as a permanent monument","Email the attacker and politely ask for a pause","Capture volatile evidence first, then rebuild per OPS-114","Rebuild instantly — the standard overrides everything"],"answer":2,"why":"The hold reorders the sequence, not the standard: capture, then rebuild."}},{"id":"X07","type":"match","typeName":"Matching","title":"Map the five artefacts, hedge included","summary":"Five campaign artefacts — one of them is NOT the actor you think.","blocks":[{"k":"p","t":"From the CR-2026-09 pack, five artefacts need mapping before the executive brief. One row belongs to the partner's contracted scan, not the unknown actor. Read each row literally."},{"k":"art","label":"ARTEFACT — items to map","wrap":true,"lines":["1. HEAD probes reading web01's Server header (5 days, unowned source)","2. Collector pulling BIOS strings of DMZ hosts via an inventory export","3. Baltic Transit's broad port sweep during the ticketed window","4. Email addresses harvested from Nordhaul's job postings","5. Nordhaul's public DNS zone records read"]}],"question":"Match each artefact to the technique it maps to.","hint":"Banners = host software. BIOS = firmware. The ticketed sweep is scanning, not fingerprinting. Job-posting addresses are identity. Zone records are network.","explanation":"Row 1 is T1592.002 (Software) — the campaign's core behaviour. Row 2 is T1592.003 (Firmware) — BIOS strings. Row 3 is T1595 Active Scanning — ticketed, broad, and NOT the unknown actor. Row 4 is T1589 (Identity) — job-posting harvesting, a different technique family. Row 5 is T1590 (Network Information). Executive briefs that lump all five into 'the attack' misdirect both the response and the partner conversation.","study":"Artefact-to-technique mapping across the recon family, with owner disambiguation.","data":{"left":["HEAD probes reading web01's Server header","Collector pulling BIOS strings via an inventory export","Baltic Transit's broad port sweep (ticketed window)","Email addresses harvested from job postings","Nordhaul's public DNS zone records read"],"right":["T1595 — Active Scanning","T1592.002 — Software","T1589 — Gather Victim Identity Information","T1592.003 — Firmware","T1590 — Gather Victim Network Information"],"pairs":[1,3,0,2,4],"itemWhy":["Header reads are host software collection.","BIOS strings are firmware facts.","A ticketed broad sweep is scanning, not fingerprinting.","Job-posting addresses are identity data.","Zone records are network facts."]}},{"id":"X08","type":"cardsel","typeName":"Click the line","title":"Audit the CTI note","summary":"Five draft lines — click the one that overstates the evidence.","blocks":[{"k":"p","t":"Legal reviews the draft CTI note before it goes to the board. One line overstates what the evidence shows and must be rewritten. Click it."},{"k":"art","label":"ARTEFACT — draft CTI note","wrap":true,"lines":["1. For five days, an unknown external actor sent low-rate HEAD probes reading Server headers on web01.","2. Partial SNMP captures show sysDescr reads against the edge firewall.","3. The activity pattern is consistent with patient edge-device reconnaissance campaigns.","4. The actor is Volt Typhoon; attribution is certain based on a single HEAD request.","5. Recommended: close SNMP default reads and preserve evidence before containment."]}],"question":"Click the line that overstates the evidence and must be rewritten.","hint":"Lines 1, 2, 3 and 5 each trace to artefacts or hedged language. One line makes a certainty claim nothing supports.","explanation":"Line 4 claims certainty ('is Volt Typhoon', 'attribution is certain') from a single behavioural artefact — no infrastructure, tooling or independent corroboration backs it; attribution claims need hedged confidence language and corroborating evidence. Lines 1–2 restate artefacts, line 3 hedges properly ('consistent with'), and line 5 is an actionable recommendation. Boards act on overclaimed certainty; that is exactly what legal is screening for.","study":"Attribution overreach: certainty language versus hedged, evidence-traced claims.","data":{"lines":["1. For five days, an unknown external actor sent low-rate HEAD probes reading Server headers on web01.","2. Partial SNMP captures show sysDescr reads against the edge firewall.","3. The activity pattern is consistent with patient edge-device reconnaissance campaigns.","4. The actor is Volt Typhoon; attribution is certain based on a single HEAD request.","5. Recommended: close SNMP default reads and preserve evidence before containment."],"correct":[3],"why":["Restates E1 faithfully.","Restates E2 faithfully.","Hedged language: defensible.","Certainty from one artefact — classic overreach.","Sound recommendation."]}},{"id":"X09","type":"order","typeName":"Ranking","title":"Sequence the response under constraints","summary":"Five actions, real costs — order them for the next 24 hours.","blocks":[{"k":"p","t":"Change freeze until Monday; the campaign is live. Order the five response actions for the next 24 hours: from do-first (1) to do-last (5). Balance: evidence value, containment value, and business impact."},{"k":"art","label":"ARTEFACT — candidate actions","wrap":true,"lines":["A. Capture volatile evidence on web01 (network + memory) to external media","B. Disable SNMP default reads on the edge firewall (config-only)","C. Push a WAF rule normalising HEAD bursts on web01","D. Isolate web01 from the internet (orders stop until rebuild)","E. Country-wide firewall block (partner traffic rides the same path)"]}],"question":"Rank the actions: 1 = do first, 5 = do last.","hint":"Volatile evidence dies first. Config-only wins before downtime. The costliest, blundest tools come last — if at all.","explanation":"A first: volatile evidence decays fastest and everything legal needs depends on it. B second: config-only SNMP closure cuts the actor's free sysDescr feed with zero downtime. C third: WAF normalisation starves the fingerprinting without breaking orders. D fourth: isolating web01 is decisive but stops trading — justified only if A–C fail or the actor advances. E last: the blunt country block breaks partner traffic, misses proxies, and tips the actor off — lowest precision per unit of damage. Sequencing under constraints is the executive skill: each position is defensible in writing.","study":"Response sequencing: volatile order, config-only before downtime, blunt tools last.","data":{"items":["Capture volatile evidence on web01 to external media","Disable SNMP default reads on the edge firewall (config-only)","WAF rule normalising HEAD bursts on web01","Isolate web01 from the internet (trading stops)","Country-wide firewall block (breaks partner traffic)"],"itemWhy":["Decays fastest: do first.","Zero downtime, high cut: early.","Starves recon, keeps business: middle.","Decisive but costly: late.","Bluntest tool: last."]}},{"id":"X10","type":"multi","typeName":"Multi-select","title":"Three moves that fit the freeze","summary":"Change freeze until Monday: select the THREE mitigations that work anyway.","blocks":[{"k":"p","t":"Constraints: change freeze until Monday (no rebuilds, no service restarts), no downtime acceptable, the actor is watching. Select the THREE mitigation moves that reduce T1592's value while fitting every constraint."}],"question":"Select the THREE actions that fit all constraints and cut recon value.","hint":"Config-only and monitoring changes fit a freeze. Anything needing a rebuild, a restart, or downtime does not.","explanation":"Fitting the freeze: WAF header normalisation (hides versions at the edge, config-only), disabling SNMP default reads (config-only on the firewall), and alert tuning for HEAD-burst cadence (monitoring change, zero touch on services). Rebuilding web01 violates both the freeze and the legal hold; migrating the datacentre is a project, not a mitigation. Constraint-aware control selection is what separates security plans from wish lists.","study":"Mitigation selection under change freezes: config-only, monitoring-only, zero-downtime moves.","data":{"options":["Tune alerts on HEAD-burst cadence and info endpoints","Rebuild web01 from the golden image tonight","Migrate the whole DMZ to a new cloud provider this week","WAF rewrite: strip version tokens at the edge","Disable SNMP v1/v2c default reads on the edge firewall"],"answers":[3,4,0],"instruction":"Select three. Partial credit applies.","itemWhy":{"3":"Edge-side config: no service restart, hides versions.","4":"Device config change: closes the free sysDescr feed.","0":"Monitoring change: makes the pattern visible, touches nothing."},"wrongWhy":{"1":"Violates the freeze and the legal hold; destroys evidence.","2":"Not a mitigation; a programme with weeks of downtime."}}},{"id":"X11","type":"qcm","typeName":"Attribution wording","title":"One line for the board pack","summary":"Pick the attribution sentence that survives counsel review.","blocks":[{"k":"p","t":"The board pack needs one attribution line for the CR-2026-09 recon activity. TTP overlap with publicly documented edge-device campaigns exists; no infrastructure or tooling corroboration yet. Counsel warns: 'Defensible, or nothing.'"}],"question":"Which attribution line belongs in the board pack?","hint":"Confidence language must match evidence depth. What does 'TTP overlap only' buy you?","explanation":"The defensible line states overlap, names the hedge, and marks confidence as low-to-moderate pending corroboration — it survives new evidence in either direction. Absolute claims ('100% Volt Typhoon') collapse under cross-examination and corner the board into premature commitments; 'no group does this' is factually false; a competitor guess is fabrication. Boards can act on hedged intelligence; they cannot defend overclaims.","study":"Board-grade attribution language: overlap + hedge + confidence + corroboration path.","data":{"options":["Attribution: our competitor, beyond any doubt","TTP overlap with edge-recon campaigns; low–moderate confidence","This is Volt Typhoon with 100% certainty, no doubt at all","No group behaves this way; ignore the activity"],"answer":1,"why":"Hedged, evidence-traced, and revisable — the only formulation counsel will pass."}},{"id":"X12","type":"fill","typeName":"Report drafting","title":"The executive summary, precisely","summary":"Four blanks in the day-5 executive summary — every word is load-bearing.","blocks":[{"k":"p","t":"Complete the executive summary. Four blanks; the bank contains three distractors. Legal reads this page first, so precision beats drama."}],"question":"Fill all four blanks with the correct entries.","hint":"Blank 1: the sub-technique ID for software collection. Blank 2: the SNMP community in the config. Blank 3: the partner's name. Blank 4: the evidence path.","explanation":"The completed summary: fingerprinted DMZ hosts maps to T1592.002 (Software); the SNMP service used the default 'public' community; partner scanner activity came from Baltic Transit's ASN and was ruled expected; volatile evidence went to /mnt/usb. Distractors: T1190 would claim exploitation, 'private' is not the configured community, '/var/log' would mean evidence written to the compromised disk — each distractor is precisely the error legal fears.","study":"Executive-summary precision: IDs, config facts, ownership rulings, evidence locations.","data":{"text":"Over five days, an unknown external actor fingerprinted DMZ hosts ({0}, Software). Probes targeted web01 and the edge firewall, whose SNMP service used the default {1} community. Partner scanner activity from {2} was ruled expected. Volatile evidence was captured to {3} before containment.","bank":["T1592.002","public","Baltic Transit","/mnt/usb","T1190","private","/var/log"],"answers":["T1592.002","public","Baltic Transit","/mnt/usb"],"itemWhy":["Software is the sub-technique for version collection.","The config exposed the default 'public' community.","PT-2214 names Baltic Transit as the scan owner.","/mnt/usb is the external evidence drive."]}},{"id":"X13","type":"cardsel","typeName":"Click the line","title":"Where does the trail go cold?","summary":"Five firewall lines — click the one where source attribution becomes impossible.","blocks":[{"k":"p","t":"The firewall team exports five lines for the evidence pack. Netflow anonymisation masked one line's source field, and log rotation lost another hour. You must flag the line where SOURCE ATTRIBUTION is impossible because the source field itself is masked."},{"k":"art","label":"ARTEFACT — firewall export, day 5","wrap":true,"lines":["03:04:11 ALLOW tcp saddr=45[.]155[.]205[.]11:53001 -> 192[.]0[.]2[.]10:443","03:04:29 ALLOW tcp saddr=45[.]155[.]205[.]11:53002 -> 192[.]0[.]2[.]10:443","03:05:02 ALLOW tcp saddr=10[.]30[.]x[.]x:51110 -> 192[.]0[.]2[.]10:161  (netflow anonymised)","03:06:44 ALLOW tcp saddr=198[.]51[.]100[.]77:44712 -> 192[.]0[.]2[.]0/24 (PT-2214 window)","03:07:15 DENY  tcp saddr=45[.]155[.]205[.]11:53003 -> 192[.]0[.]2[.]10:161"]}],"question":"Click the line where source attribution is impossible because the source field is masked.","hint":"Three lines carry full addresses. One carries a ticket reference. One carries 'x[.]x' where a host address should be.","explanation":"Line 03:05:02 shows 'saddr=10[.]30[.]x[.]x' — the netflow anonymisation replaced the host octets, so no source system can ever be named from this line alone; the case file must note it as incomplete and corroborate elsewhere. The other lines carry full sources or a ticket reference. Reasoning around incomplete data — flagging exactly where the trail goes cold — is a core senior-analyst habit: it tells legal and the board what the record can and cannot prove.","study":"Incomplete telemetry handling: flag masked fields, corroborate elsewhere, never guess.","data":{"lines":["03:04:11 ALLOW tcp saddr=45[.]155[.]205[.]11:53001 -> 192[.]0[.]2[.]10:443","03:04:29 ALLOW tcp saddr=45[.]155[.]205[.]11:53002 -> 192[.]0[.]2[.]10:443","03:05:02 ALLOW tcp saddr=10[.]30[.]x[.]x:51110 -> 192[.]0[.]2[.]10:161  (netflow anonymised)","03:06:44 ALLOW tcp saddr=198[.]51[.]100[.]77:44712 -> 192[.]0[.]2[.]0/24 (PT-2214 window)","03:07:15 /* ---------- timer state machine ----------

  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  if(S.reviewingId){ openReview(); return; }   /* skipping inside review stays in review */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else { openReview(); }
}
function gradeExercise(ex){
  var g=WIDGETS[ex.type].grade(ex);
  g.credit0=scoreExercise(g.H,g.W,g.N);
  g.credit=S.hintUsed[ex.id]?Math.max(0,g.credit0-0.10):g.credit0;
  return g;
}
function doCheck(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]) return;
  var g=gradeExercise(ex);
  S.credits[ex.id]=g.credit;
  S.checked[ex.id]=true;
  S.timer.per=null;
  setState('PAUSED_AUTO_CHECK');           /* first action: stop the timer before feedback shows */
  buildFeedback(ex,g);
  var aa=$('answerArea'); if(aa) aa.classList.add('locked');
  var cb=$('btnCheck'); if(cb) cb.disabled=true;
  var nb=$('btnNext'); if(nb){ nb.hidden=false; nb.innerHTML=nextLabel()+' &#9654;'; }
  renderHeader();
  var fb=$('fbHolder');
  if(fb && fb.scrollIntoView){
    var smooth=true;
    try{ smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    fb.scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest'});
  }
}
function nextLabel(){
  if(S.reviewingId){ return skippedOpen().length<=1 ? 'Finish exam' : 'Back to review'; }
  var last = S.cur>=S.order.length-1;
  if(last && skippedOpen().length===0) return 'Final Submit';
  if(last) return 'Review skipped';
  return 'Next';
}
function goNext(){
  if(!S.checked[S.renderedId]) return;
  if(S.reviewingId){
    S.reviewingId=null;
    if(skippedOpen().length===0){ submitExam(); } else { openReview(); }
    return;
  }
  setState('RUNNING');   /* Next ends the Check auto-pause; last exercise ends below */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else if(skippedOpen().length>0){ openReview(); }
  else { submitExam(); }
}

/* ---------- feedback ---------- */
function buildFeedback(ex,g){
  var cls, label, icon;
  if(g.credit>=0.999){ cls='fb-correct'; label='CORRECT'; icon='&#9989;'; }
  else if(g.credit>0){ cls='fb-partial'; label='PARTIALLY CORRECT'; icon='&#9989;'; }
  else { cls='fb-wrong'; label='INCORRECT'; icon='&#10060;'; }
  var creditLine='';
  if(g.N>1){
    var got=g.H;
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +' — '+got+'/'+g.N+' items'+(g.credit<g.credit0?' (after &minus;0.10 hint)':'')+'</span>';
  } else {
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +'</span>';
  }
  var items='';
  for(var i=0;i<g.items.length;i++){
    var it=g.items[i], ic, st;
    if(it.status==='correct'){ ic='<span class="ic-c">&#10003; Correct</span>'; }
    else if(it.status==='wrong'){ ic='<span class="ic-w">&#10007; Wrong</span>'; }
    else { ic='<span class="ic-m">&#9675; Missed</span>'; }
    items+='<li>'+ic+' — '+esc(it.label)+(it.why?(' — '+esc(it.why)):'')+'</li>';
  }
  var paras=ex.explanation.split('\n\n'), ptxt='';
  for(var p=0;p<paras.length;p++) ptxt+='<p>'+esc(paras[p])+'</p>';
  if(ex.attdef) ptxt+='<p>'+esc(ex.attdef)+'</p>';
  var canon='';
  if(WIDGETS[ex.type] && WIDGETS[ex.type].canonical) canon=WIDGETS[ex.type].canonical(ex);
  $('fbHolder').innerHTML =
  '<div class="fb '+cls+'">'+
    '<div class="fb-h">'+icon+' '+label+creditLine+'</div>'+
    '<div class="fb-b">'+
      (g.N>1?'<b>Item by item:</b><ul class="fb-items">'+items+'</ul>':'<ul class="fb-items">'+items+'</ul>')+
      '<b>Why:</b>'+ptxt+
      (canon||'')+
      '<div class="study">&#128218; What to study next: '+esc(ex.study)+'</div>'+
    '</div>'+
  '</div>';
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase='review'; S.reviewingId=null;
  if(S.timer.state==='PAUSED_AUTO_CHECK' && S.timer.remaining>0) setState('RUNNING');
  var pool=skippedOpen();
  var list='';
  for(var i=0;i<pool.length;i++){
    var ex=byId(pool[i]);
    list+='<div class="rv-item"><span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>'+
      '<span class="rt"><b>'+esc(ex.title)+'</b><br><span class="small">'+esc(ex.summary)+'</span></span>'+
      '<button type="button" class="btn" data-act="rvans" data-id="'+esc(ex.id)+'">Answer now</button></div>';
  }
  $('main').innerHTML =
  '<div class="intro-card"><h1>Review skipped exercises</h1>'+
  '<p>You skipped '+pool.length+' exercise(s). You can answer them now, as many times as needed, while the timer is still running. '+
  'If you submit with skipped exercises left, they are <b>excluded from the score</b>: they count as neither correct nor wrong.</p>'+
  (pool.length?list:'<p><b>All skipped exercises have been answered. You can submit the exam.</b></p>')+
  '<div class="actions"><button type="button" class="btn primary" data-act="submit">Submit exam &#9654;</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
}
function reviewAnswer(id){
  var ex=byId(id); if(!ex) return;
  S.reviewingId=String(id);
  S.phase='exam';
  for(var i=0;i<S.order.length;i++){
    if(String(EXS[S.order[i]].id)===String(id)){ S.cur=i; break; }
  }
  renderExercise(ex,{review:true});
}
function byId(id){ for(var i=0;i<EXS.length;i++){ if(String(EXS[i].id)===String(id)) return EXS[i]; } return null; }
function submitExam(){ finish('submit'); }

/* ---------- results ---------- */
function finish(){
  setState('ENDED');
  showResults();
}
function showResults(){
  S.phase='results';
  var full=0, part=0, wrong=0, skippedN=0, sum=0, answered=0, partSum=0;
  for(var i=0;i<EXS.length;i++){
    var ex=EXS[i], c=S.credits[ex.id];
    if(S.checked[ex.id]){
      answered++; sum+=c;
      if(c>=0.999){ full++; }
      else if(c>0){ part++; partSum+=c; }
      else { wrong++; }
    } else if(S.skipped.indexOf(ex.id)>=0){ skippedN++; }
    else { skippedN++; }
  }
  var pct = answered>0 ? Math.round((sum/answered)*100) : 0;
  var passed = pct>=M.passMark;
  var avg = part>0 ? (Math.round((partSum/part)*100)/100) : 0;
  var mins = Math.round((Date.now()-S.wallStart)/60000);
  var cert = passed ?
    '<div class="cert"><h3>&#127942; CERTIFICATE OF COMPLETION</h3>'+
    '<p><b>'+esc(S.init&&S.init.username?S.init.username:'Learner')+'</b> passed the '+SEV.label+' practice exam</p>'+
    '<p>'+esc(M.title)+'</p><p>Score: <b>'+pct+'%</b> &nbsp;&bull;&nbsp; Pass mark: '+M.passMark+'% &nbsp;&bull;&nbsp; '+new Date().toLocaleDateString()+'</p></div>' : '';
  $('main').innerHTML =
  '<div class="res">'+
    '<h2>Results — '+SEV.label+' exam</h2>'+
    '<p class="pct '+ (passed?'res-pass':'res-fail') +'">'+pct+'%</p>'+
    '<p>'+(passed?'<b>PASS.</b> Well done — you reached the pass mark of '+M.passMark+'%.':'<b>FAIL.</b> You need '+M.passMark+'% or more. You must retake the exam to pass.')+'</p>'+
    cert+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+full+'</b>Fully correct</div>'+
      '<div class="stat"><b>'+part+'</b>Partially correct'+(part?(' (avg credit '+avg+')'):'')+'</div>'+
      '<div class="stat"><b>'+wrong+'</b>Fully incorrect</div>'+
      '<div class="stat"><b>'+skippedN+'</b>Skipped, never answered (excluded)</div>'+
    '</div>'+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+(answered>0?(Math.round(sum*10)/10):'0')+' / '+answered+'</b>Sum of credits over answered exercises</div>'+
      '<div class="stat"><b>~'+mins+' min</b>Wall time in the exam</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pm)+'</b>Time paused manually</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pa)+'</b>Time reviewing feedback (auto-pause)</div>'+
    '</div>'+
    '<p class="small">Skipped-and-never-answered exercises are excluded from both the score and the total. The percentage above is computed only over answered exercises.</p>'+
    '<div class="actions"><button type="button" class="btn primary" data-act="retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
  reportScore(sum,answered,pct);
}
function reportScore(sum,answered,pct){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(sum),
      total:answered,
      percent:pct,
      passed:pct>=M.passMark
    }, location.origin);
  }catch(e){ /* opened directly in a browser; nothing to report to */ }
}
function retake(){
  S.phase='exam'; S.cur=0; S.ans={}; S.credits={}; S.checked={}; S.hintUsed={};
  S.skipped=[]; S.reviewingId=null; S.reported=false; S.wallStart=Date.now();
  S.timer={ state:'RUNNING', remaining:M.estimatedMinutes*60, prevState:null, pm:0, pa:0, per:null };
  S.order=shuffle(range(EXS.length));
  renderExercise(currentEx(),{});
}

/* ---------- manual pause ---------- */
function doPause(){
  var st=S.timer.state;
  if(st!=='RUNNING' && st!=='PAUSED_AUTO_CHECK') return;
  setState('PAUSED_MANUAL');
  var ov=$('pauseOv'); if(ov) ov.classList.add('show');
  document.body.classList.add('manual-paused');
}
function doResume(){
  if(S.timer.state!=='PAUSED_MANUAL') return;
  var back = (S.timer.prevState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  setState(back);
  var ov=$('pauseOv'); if(ov) ov.classList.remove('show');
  document.body.classList.remove('manual-paused');
}

/* ---------- website handshake (both init names accepted; works with none) ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.init={ username:event.data.username||'', country:event.data.country||'', theme:event.data.theme||'light' };
});

/* ---------- global click routing ---------- */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  if(el.disabled) return;
  var act=el.getAttribute('data-act');
  if(act==='start'){ startExam(); }
  else if(act==='pause'){ doPause(); }
  else if(act==='resume'){ doResume(); }
  else if(act==='hint'){ doHint(); }
  else if(act==='skip'){ doSkip(); }
  else if(act==='check'){ doCheck(); }
  else if(act==='next'){ goNext(); }
  else if(act==='submit'){ submitExam(); }
  else if(act==='retake'){ retake(); }
  else if(act==='rvans'){ reviewAnswer(el.getAttribute('data-id')); }
  else if(act==='collapse'){
    var body=$('scnBody'), btn=$('collapseBtn'), sum=$('scnSummary');
    if(!body) return;
    var open = body.style.display!=='none';
    body.style.display = open?'none':'block';
    if(sum) sum.style.display = open?'flex':'none';
    if(btn){ btn.innerHTML = open?'Expand &#9660;':'Collapse &#9650;'; btn.setAttribute('aria-expanded', open?'false':'true'); }
  }
});



/* ---------- shared pure graders ---------- */
function gradeQCM(d,A){
  if(A.sel===null||A.sel===undefined){
    return {H:0,W:1,N:1,items:[{label:'No answer selected — correct was: '+d.options[d.answer],status:'wrong',why:'You did not select an option, so the exercise scores 0.'}]};
  }
  var ok=(A.sel===d.answer);
  var lbl = ok ? ('You selected the correct answer: '+d.options[d.answer])
               : ('You selected "'+d.options[A.sel]+'". Correct answer: '+d.options[d.answer]);
  return {H:ok?1:0,W:ok?0:1,N:1,items:[{label:lbl,status:ok?'correct':'wrong',why:ok?(d.why||''):(d.whyWrong||'This option does not fit the scenario. Re-read the explanation below.')}]};
}
function gradeMulti(d,A){
  var sel=A.sel||[], N=d.answers.length, H=0, W=0, items=[], i, j;
  for(i=0;i<d.options.length;i++){
    var isAns=d.answers.indexOf(i)>=0, isSel=sel.indexOf(i)>=0;
    if(isAns&&isSel){ H++; items.push({label:d.options[i],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'Part of the correct answer set.'}); }
    else if(isAns&&!isSel){ items.push({label:d.options[i],status:'missed',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'You missed this correct item.'}); }
    else if(!isAns&&isSel){ W++; items.push({label:d.options[i],status:'wrong',why:d.wrongWhy&&d.wrongWhy[i]?d.wrongWhy[i]:'This is not part of the correct answer in this scenario.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}
function gradeCardsel(d,A){
  var sel=A.sel||[], N=d.correct.length, H=0, W=0, items=[], i;
  for(i=0;i<d.lines.length;i++){
    var isC=d.correct.indexOf(i)>=0, isS=sel.indexOf(i)>=0;
    if(isC&&isS){ H++; items.push({label:'Selected line: '+d.lines[i],status:'correct',why:d.why&&d.why[i]?d.why[i]:''}); }
    else if(!isC&&isS){ W++; items.push({label:'Selected line: '+d.lines[i],status:'wrong',why:d.why&&d.why[i]?d.why[i]:'This line is not the right one.'}); }
    else if(isC&&!isS){ items.push({label:'Correct line: '+d.lines[i],status:'missed',why:d.why&&d.why[i]?d.why[i]:'You missed this line.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}

/* ---------- QCM (single answer) ---------- */
WIDGETS.qcm={
  render:function(ex,host,A){
    if(!A.perm){ A.perm=shuffle(range(ex.data.options.length)); A.sel=null; }
    draw();
    function draw(){
      var h='<div role="radiogroup" aria-label="Answer options">';
      for(var i=0;i<A.perm.length;i++){
        var oi=A.perm[i], on=(A.sel===oi);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-oi="'+oi+'" role="radio" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+i)+'.</span><span>'+esc(ex.data.options[oi])+'</span></button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      var b=e.target.closest?e.target.closest('[data-oi]'):null;
      if(!b||S.checked[ex.id]) return;
      A.sel=parseInt(b.getAttribute('data-oi'),10);
      draw();
    };
  },
  grade:function(ex){ return gradeQCM(ex.data,S.ans[ex.id]); }
};

/* ---------- multi-select with partial credit ---------- */
WIDGETS.multi={
  render:function(ex,host,A){
    if(!A.perm){ A.perm=shuffle(range(ex.data.options.length)); A.sel=[]; }
    draw();
    function draw(){
      var h='<p class="small">'+esc(ex.data.instruction||'Select all that apply. Partial credit applies: wrong selections subtract.')+'</p><div role="group" aria-label="Answer options">';
      for(var i=0;i<A.perm.length;i++){
        var oi=A.perm[i], on=(A.sel.indexOf(oi)>=0);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-oi="'+oi+'" role="checkbox" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+i)+'.</span><span>'+esc(ex.data.options[oi])+'</span></button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      var b=e.target.closest?e.target.closest('[data-oi]'):null;
      if(!b||S.checked[ex.id]) return;
      var oi=parseInt(b.getAttribute('data-oi'),10), p=A.sel.indexOf(oi);
      if(p>=0) A.sel.splice(p,1); else A.sel.push(oi);
      draw();
    };
  },
  grade:function(ex){ return gradeMulti(ex.data,S.ans[ex.id]); }
};

/* ---------- matching (partial credit per pair) ---------- */
WIDGETS.match={
  render:function(ex,host,A){
    if(!A.rOrder){ A.rOrder=shuffle(range(ex.data.right.length)); A.sel={}; }
    draw();
    function draw(){
      var h='<p class="small">For each row, pick the matching description from the list.</p>';
      for(var i=0;i<ex.data.left.length;i++){
        var opts='<option value="">— choose —</option>';
        for(var j=0;j<A.rOrder.length;j++){
          var ri=A.rOrder[j];
          opts+='<option value="'+ri+'"'+(A.sel[i]===ri?' selected':'')+'>'+esc(ex.data.right[ri])+'</option>';
        }
        h+='<div class="mrow"><span class="mlab">'+esc(ex.data.left[i])+'</span>'+
           '<select data-li="'+i+'" aria-label="Match for row '+(i+1)+'">'+opts+'</select></div>';
      }
      host.innerHTML=h;
    }
    host.onchange=function(e){
      if(!e.target||!e.target.matches||!e.target.matches('select[data-li]')) return;
      if(S.checked[ex.id]) return;
      var i=parseInt(e.target.getAttribute('data-li'),10);
      A.sel[i]=e.target.value===''?null:parseInt(e.target.value,10);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.left.length;i++){
      var s=A.sel[i];
      if(s===null||s===undefined){ items.push({label:d.left[i],status:'missed',why:'No match chosen for this row.'}); }
      else if(s===d.pairs[i]){ H++; items.push({label:d.left[i]+' → '+d.right[d.pairs[i]],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:''}); }
      else { W++; items.push({label:d.left[i],status:'wrong',why:'You matched it to "'+d.right[s]+'". Correct: "'+d.right[d.pairs[i]]+'".'+(d.itemWhy&&d.itemWhy[i]?(' '+d.itemWhy[i]):'')}); }
    }
    return {H:H,W:W,N:d.left.length,items:items};
  }
};

/* ---------- drag & drop into buckets (partial credit per item) ---------- */
WIDGETS.dragdrop={
  render:function(ex,host,A){
    if(!A.placed){ A.placed={}; A.selItem=null; A.bankOrder=shuffle(range(ex.data.items.length)); }
    draw();
    function chip(ii){
      var inBucket=A.placed[ii]!==undefined;
      return '<button type="button" class="chip'+(A.selItem===ii?' sel':'')+'" draggable="true" data-item="'+ii+'">'+esc(ex.data.items[ii].t)+'</button>';
    }
    function draw(){
      var bank='<div class="bank" id="ddBank" data-bucket="-1">';
      for(var k=0;k<A.bankOrder.length;k++){ var ii=A.bankOrder[k]; if(A.placed[ii]===undefined) bank+=chip(ii); }
      bank+='</div>';
      var cols='';
      for(var b=0;b<ex.data.buckets.length;b++){
        var inner='';
        for(var id in A.placed){ if(A.placed[id]===b) inner+=chip(parseInt(id,10)); }
        cols+='<div class="bucket" data-bucket="'+b+'"><h4>'+esc(ex.data.buckets[b])+'</h4><div class="bitems">'+inner+'</div></div>';
      }
      host.innerHTML='<p class="small">Click an item, then click a bucket. You can also drag items with the mouse. Click a placed item to send it back.</p>'+bank+'<div class="buckets">'+cols+'</div>';
      var chips=host.querySelectorAll('.chip');
      for(var c=0;c<chips.length;c++){
        chips[c].addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',this.getAttribute('data-item')); });
      }
      var bks=host.querySelectorAll('.bucket, .bank');
      for(var d=0;d<bks.length;d++){
        bks[d].addEventListener('dragover',function(e){ e.preventDefault(); this.classList.add('dragover'); });
        bks[d].addEventListener('dragleave',function(){ this.classList.remove('dragover'); });
        bks[d].addEventListener('drop',function(e){
          e.preventDefault(); this.classList.remove('dragover');
          if(S.checked[ex.id]) return;
          var ii=parseInt(e.dataTransfer.getData('text/plain'),10);
          if(isNaN(ii)) return;
          var b=this.getAttribute('data-bucket');
          if(b==='-1'||b===null){ delete A.placed[ii]; } else { A.placed[ii]=parseInt(b,10); }
          A.selItem=null; draw();
        });
      }
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var ch=e.target.closest?e.target.closest('[data-item]'):null;
      if(ch){
        var ii=parseInt(ch.getAttribute('data-item'),10);
        if(A.placed[ii]!==undefined && A.selItem!==ii){ delete A.placed[ii]; A.selItem=null; }
        else { A.selItem=(A.selItem===ii)?null:ii; }
        draw(); return;
      }
      var bk=e.target.closest?e.target.closest('[data-bucket]'):null;
      if(bk && A.selItem!==null && A.selItem!==undefined){
        var b=bk.getAttribute('data-bucket');
        if(b==='-1'||b===null){ delete A.placed[A.selItem]; }
        else { A.placed[A.selItem]=parseInt(b,10); }
        A.selItem=null; draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.items.length;i++){
      var p=A.placed[i];
      if(p===undefined){ items.push({label:d.items[i].t,status:'missed',why:'You left this item in the bank.'}); }
      else if(p===d.items[i].b){ H++; items.push({label:d.items[i].t+' → '+d.buckets[d.items[i].b],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:''}); }
      else { W++; items.push({label:d.items[i].t,status:'wrong',why:'You placed it in "'+d.buckets[p]+'". Correct bucket: "'+d.buckets[d.items[i].b]+'".'}); }
    }
    return {H:H,W:W,N:d.items.length,items:items};
  }
};

/* ---------- ordering / ranking (partial credit per position) ---------- */
WIDGETS.order={
  render:function(ex,host,A){
    if(!A.rows){ A.rows=shuffle(range(ex.data.items.length)); }
    draw();
    function draw(){
      var h='<p class="small">Put the items in the requested order. Use the arrows, or drag rows with the mouse.</p>';
      for(var i=0;i<A.rows.length;i++){
        h+='<div class="ordrow" draggable="true" data-pos="'+i+'"><span class="pos">'+(i+1)+'</span>'+
           '<span class="otext">'+esc(ex.data.items[A.rows[i]])+'</span>'+
           '<button type="button" class="mv" data-mv="up" data-i="'+i+'" aria-label="Move up">&#8593;</button>'+
           '<button type="button" class="mv" data-mv="down" data-i="'+i+'" aria-label="Move down">&#8595;</button></div>';
      }
      host.innerHTML=h;
      var rows=host.querySelectorAll('.ordrow');
      for(var r=0;r<rows.length;r++){
        rows[r].addEventListener('dragstart',function(e){ this.classList.add('dragging'); e.dataTransfer.setData('text/plain',this.getAttribute('data-pos')); });
        rows[r].addEventListener('dragend',function(){ this.classList.remove('dragging'); });
        rows[r].addEventListener('dragover',function(e){ e.preventDefault(); });
        rows[r].addEventListener('drop',function(e){
          e.preventDefault();
          if(S.checked[ex.id]) return;
          var from=parseInt(e.dataTransfer.getData('text/plain'),10), to=parseInt(this.getAttribute('data-pos'),10);
          if(isNaN(from)||isNaN(to)||from===to) return;
          var it=A.rows.splice(from,1)[0];
          A.rows.splice(to,0,it);
          draw();
        });
      }
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var b=e.target.closest?e.target.closest('[data-mv]'):null;
      if(!b) return;
      var i=parseInt(b.getAttribute('data-i'),10), j=(b.getAttribute('data-mv')==='up')?i-1:i+1;
      if(j<0||j>=A.rows.length) return;
      var t=A.rows[i]; A.rows[i]=A.rows[j]; A.rows[j]=t;
      draw();
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<A.rows.length;i++){
      var it=A.rows[i], ok=(it===i);
      if(ok) H++; else W++;
      items.push({label:'Position '+(i+1)+': '+d.items[it],status:ok?'correct':'wrong',
        why:ok?'':('Correct item for this position: "'+d.items[i]+'"')});
    }
    return {H:H,W:W,N:d.items.length,items:items};
  }
};

/* ---------- fill-in-the-blank with word bank (partial credit per blank) ---------- */
WIDGETS.fill={
  render:function(ex,host,A){
    if(!A.filled){ A.filled={}; A.selSlot=null; A.bankOrder=shuffle(range(ex.data.bank.length)); }
    draw();
    function draw(){
      var parts=ex.data.text.split(/\{(\d+)\}/), h='<p class="filltext">';
      for(var i=0;i<parts.length;i++){
        if(i%2===0){ h+=esc(parts[i]); }
        else{
          var k=parseInt(parts[i],10), w=A.filled[k];
          h+='<button type="button" class="slotbtn'+(w?' filled':'')+(A.selSlot===k?' sel':'')+'" data-slot="'+k+'">'+(w?esc(w):'blank '+(k+1))+'</button>';
        }
      }
      h+='</p><p class="small">Word bank (shuffled). Click a blank, then a word — or click a word first. Click a filled blank to clear it.</p><div class="bank" id="fillBank">';
      for(var j=0;j<A.bankOrder.length;j++){
        var b=A.bankOrder[j], used=false;
        for(var key in A.filled){ if(A.filled[key]===ex.data.bank[b]) used=true; }
        h+='<button type="button" class="chip'+(used?' used':'')+'" data-bank="'+b+'">'+esc(ex.data.bank[b])+'</button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var sl=e.target.closest?e.target.closest('[data-slot]'):null;
      if(sl){
        var k=parseInt(sl.getAttribute('data-slot'),10);
        if(A.filled[k]){ delete A.filled[k]; A.selSlot=null; }
        else { A.selSlot=k; }
        draw(); return;
      }
      var ch=e.target.closest?e.target.closest('[data-bank]'):null;
      if(ch){
        var w=ex.data.bank[parseInt(ch.getAttribute('data-bank'),10)];
        var target=(A.selSlot!==null&&A.selSlot!==undefined)?A.selSlot:null;
        if(target===null){
          for(var t=0;t<ex.data.answers.length;t++){ if(!A.filled[t]){ target=t; break; } }
        }
        if(target!==null){ A.filled[target]=w; A.selSlot=null; }
        draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var k=0;k<d.answers.length;k++){
      var w=A.filled[k];
      if(!w){ items.push({label:'Blank '+(k+1),status:'missed',why:'You left this blank empty.'}); }
      else if(w.toLowerCase()===String(d.answers[k]).toLowerCase()){ H++; items.push({label:'Blank '+(k+1)+': '+d.answers[k],status:'correct',why:d.itemWhy&&d.itemWhy[k]?d.itemWhy[k]:''}); }
      else { W++; items.push({label:'Blank '+(k+1),status:'wrong',why:'You wrote "'+w+'". Correct: "'+d.answers[k]+'".'}); }
    }
    return {H:H,W:W,N:d.answers.length,items:items};
  }
};

/* ---------- terminal emulator (fake shell, normaliser, element scoring) ---------- */
WIDGETS.terminal={
  render:function(ex,host,A){
    if(!A.hist){ A.hist=[]; A.cmd=''; }
    var d=ex.data;
    var syn=d.syntaxPanel?'<div class="synpanel"><b>Syntax reminder</b>'+d.syntaxPanel.map(function(l){return esc(l);}).join('<br>')+'</div>':'';
    var samp=d.sampleOutput?'<div class="synpanel"><b>Sample output on a different target</b><pre class="plain" style="margin:6px 0 0">'+esc(d.sampleOutput.join('\n'))+'</pre></div>':'';
    host.innerHTML=
      '<p class="small">'+esc(d.note||'Type the command, press Enter to run it in the fake shell, then press Check.')+'</p>'+syn+samp+
      '<div class="term"><div class="term-out" id="termOut"></div>'+
      '<div class="term-line"><span class="ps1">'+esc(d.ps1)+'$</span>'+
      '<input id="termIn" class="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder="'+esc(d.placeholder||'type a command and press Enter')+'"></div></div>';
    var out=$('termOut'), inp=$('termIn');
    function line(txt,dim){ var p=document.createElement('div'); if(dim) p.style.opacity='.75'; p.textContent=txt; out.appendChild(p); out.scrollTop=out.scrollHeight; }
    for(var i=0;i<d.banner.length;i++) line(d.banner[i],true);
    if(d.banner.length) line(' ');
    inp.onkeydown=function(e){
      if(e.key!=='Enter') return;
      var c=inp.value; inp.value='';
      if(!c.trim()) return;
      A.cmd=c; A.hist.push(c);
      line(d.ps1+'$ '+c,false);
      var tok=c.trim().split(/\s+/)[0].toLowerCase();
      if(d.simTool.indexOf(tok)>=0){ for(var k=0;k<d.output.length;k++) line(d.output[k],false); }
      else if(tok==='clear'){ out.innerHTML=''; }
      else { line(tok+': command not found'); }
      line(' ',false);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    var cmd=normCmd(A.cmd||(A.hist.length?A.hist[A.hist.length-1]:''));
    var H=0,W=0,items=[],i,el,ok;
    for(i=0;i<d.required.length;i++){
      el=d.required[i]; ok=false;
      if(el.all&&hasAll(cmd,el.all)) ok=true;
      if(!ok&&el.any&&hasAny(cmd,el.any)) ok=true;
      if(ok) H++;
      items.push({label:el.label,status:ok?'correct':'missed',why:ok?(el.whyOk||''):(el.why||'This element is missing from your command.')});
    }
    for(i=0;i<(d.forbidden||[]).length;i++){
      var f=d.forbidden[i], bad=false;
      if(f.any&&hasAny(cmd,f.any)) bad=true;
      if(!bad&&f.re){ try{ bad=new RegExp(f.re,'i').test(cmd); }catch(e){} }
      if(bad){ W++; items.push({label:f.label,status:'wrong',why:f.why}); }
    }
    if(!cmd){ items.push({label:'No command typed',status:'wrong',why:'You did not type or run any command.'}); W+=1; }
    return {H:H,W:W,N:d.required.length,items:items};
  },
  canonical:function(ex){
    var d=ex.data, h='<b>Canonical command (copyable):</b><pre class="plain" id="canonCmd">'+esc(d.expected)+'</pre>'+
      '<div class="actions" style="margin-top:-6px"><button type="button" class="btn ghost" data-act="copy">&#128203; Copy command</button></div>'+
      (d.parts?'<b>Part by part:</b><ul class="fb-items">':'');
    if(d.parts){
      for(var i=0;i<d.parts.length;i++) h+='<li><code>'+esc(d.parts[i].c)+'</code> — '+esc(d.parts[i].w)+'</li>';
      h+='</ul>';
    }
    return h;
  }
};

/* ---------- log viewer (filter box + embedded answer) ---------- */
WIDGETS.logview={
  render:function(ex,host,A){
    if(!A.f){ A.f=''; }
    if(!A.sel) A.sel=[];
    if(!A.sub) A.sub={};
    var clicky=(ex.data.mode==='cardsel');
    var rows='';
    for(var i=0;i<ex.data.lines.length;i++){
      rows+='<div class="ll'+(clicky?' clicky':'')+(clicky&&A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
    }
    host.innerHTML=
      '<div class="logv"><div class="logv-bar"><input id="logF" type="text" placeholder="Filter lines (plain text)…" value="'+esc(A.f)+'" aria-label="Filter log lines">'+
      '<span class="logv-cnt" id="logC"></span></div><div class="logv-lines" id="logL">'+rows+'</div></div>'+
      '<div id="logAns"></div>';
    var f=$('logF');
    function applyF(){
      A.f=f.value;
      var lls=$('logL').querySelectorAll('.ll'), n=0;
      for(var k=0;k<lls.length;k++){
        var show=!A.f||ex.data.lines[k].toLowerCase().indexOf(A.f.toLowerCase())>=0;
        lls[k].classList.toggle('off',!show);
        if(show) n++;
      }
      $('logC').textContent='showing '+n+' of '+ex.data.lines.length+' lines';
    }
    f.oninput=applyF; applyF();
    if(clicky){
      $('logL').onclick=function(e){
        if(S.checked[ex.id]) return;
        var r=e.target.closest?e.target.closest('[data-li]'):null;
        if(!r) return;
        var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
        if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
        r.classList.toggle('sel',A.sel.indexOf(i)>=0);
      };
    }
    var subHost=$('logAns');
    if(ex.data.mode==='qcm'){ WIDGETS.qcm.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
    else if(ex.data.mode==='multi'){ WIDGETS.multi.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    if(d.mode==='qcm') return gradeQCM(d.sub,A.sub);
    if(d.mode==='multi') return gradeMulti(d.sub,A.sub);
    return gradeCardsel(d,A);
  }
};

/* ---------- cardsel: click lines in an artefact ---------- */
WIDGETS.cardsel={
  render:function(ex,host,A){
    if(!A.sel) A.sel=[];
    draw();
    function draw(){
      var h='<p class="small">Click the line(s) inside the artefact. Click again to un-select.</p>'+
        '<div class="logv"><div class="logv-lines" id="csL">';
      for(var i=0;i<ex.data.lines.length;i++){
        h+='<div class="ll clicky'+(A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
      }
      host.innerHTML=h+'</div></div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var r=e.target.closest?e.target.closest('[data-li]'):null;
      if(!r) return;
      var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
      if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
      draw();
    };
  },
  grade:function(ex){ return gradeCardsel(ex.data,S.ans[ex.id]); }
};

/* ---------- branching decision tree (auto-pause only on final Check) ---------- */
WIDGETS.branch={
  render:function(ex,host,A){
    if(A.step===undefined){ A.step=0; A.picks=[]; A.sel=null; }
    host.innerHTML='<div id="brMini" aria-live="polite"></div><div id="brStep"></div>';
    draw();
    function draw(){
      var steps=ex.data.steps, i=A.step, st=steps[i];
      var chip=$('stepchip'); if(chip) chip.textContent='STEP '+(i+1)+' OF '+steps.length;
      if(!A.perm){ A.perm={}; }
      if(!A.perm[i]){ A.perm[i]=shuffle(range(st.options.length)); }
      var h='<p class="small">Decision tree: choose one option, then confirm. The timer keeps running between steps and stops only on the final Check.</p>';
      h+='<div style="margin-bottom:8px"><b>'+esc(st.q)+'</b></div>';
      var perm=(A.perm&&A.perm[i])?A.perm[i]:range(st.options.length);
      for(var j=0;j<perm.length;j++){
        var oi=perm[j], on=(A.sel===oi);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-boi="'+oi+'" role="radio" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+j)+'.</span><span>'+esc(st.options[oi])+'</span></button>';
      }
      h+='<div class="actions"><button type="button" class="btn '+(i===steps.length-1?'primary':'ghost')+'" id="brNext">'+(i===steps.length-1?'Check final answer':'Confirm step')+'</button></div>';
      $('brStep').innerHTML=h;
      $('brNext').onclick=function(){
        if(S.checked[ex.id]) return;
        if(A.sel===null){ $('brMini').innerHTML='<p class="small">Select an option first.</p>'; return; }
        A.picks[i]=A.sel;
        if(i<steps.length-1){
          var ok=(A.sel===steps[i].answer);
          $('brMini').innerHTML='<p class="small">'+(ok?'&#10003; Step '+(i+1)+' recorded — that is a reasonable step.':'&#10007; Step '+(i+1)+' recorded — keep it in mind; the full picture appears at the final Check.')+'</p>';
          A.step=i+1; A.sel=null;
          draw();
        } else {
          doCheck();
        }
      };
      host.onclick=function(e){
        var b=e.target&&e.target.closest?e.target.closest('[data-boi]'):null;
        if(!b) return;
        A.sel=parseInt(b.getAttribute('data-boi'),10);
        var all=$('brStep').querySelectorAll('[data-boi]');
        for(var k=0;k<all.length;k++){ var on2=all[k].getAttribute('data-boi')==String(A.sel); all[k].classList.toggle('sel',on2); all[k].setAttribute('aria-checked',on2?'true':'false'); }
      };
    }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.steps.length;i++){
      var st=d.steps[i], pick=A.picks[i];
      if(pick===undefined||pick===null){ items.push({label:'Step '+(i+1),status:'missed',why:'No choice recorded.'}); continue; }
      var ok=(pick===st.answer);
      if(ok) H++; else W++;
      items.push({label:'Step '+(i+1)+': '+st.short,status:ok?'correct':'wrong',
        why:ok?st.whyOk:('You chose "'+st.options[pick]+'". Best choice: "'+st.options[st.answer]+'". '+st.whyOk)});
    }
    return {H:H,W:W,N:d.steps.length,items:items};
  }
};

/* ---------- SOC alert triage queue (partial credit per alert) ---------- */
WIDGETS.triage={
  render:function(ex,host,A){
    if(!A.orders){ A.orders=[]; A.picks={}; for(var i=0;i<ex.data.alerts.length;i++) A.orders.push(shuffle(range(ex.data.alerts[i].actions.length))); }
    var h='<p class="small">Choose the best action for each alert, then press Check. Each alert scores one item.</p>';
    h+='<table class="tri"><thead><tr><th style="width:46%">Alert</th><th>Best action</th></tr></thead><tbody>';
    for(var a=0;a<ex.data.alerts.length;a++){
      var al=ex.data.alerts[a];
      var opts='<option value="">— choose —</option>';
      for(var j=0;j<A.orders[a].length;j++){
        var ai=A.orders[a][j];
        opts+='<option value="'+ai+'"'+(A.picks[a]===ai?' selected':'')+'>'+esc(al.actions[ai])+'</option>';
      }
      h+='<tr><td><b>'+esc(al.t)+'</b></td><td><select data-ai="'+a+'" aria-label="Action for alert '+(a+1)+'">'+opts+'</select></td></tr>';
    }
    host.innerHTML=h+'</tbody></table>';
    host.onchange=function(e){
      if(!e.target||!e.target.matches||!e.target.matches('select[data-ai]')) return;
      if(S.checked[ex.id]) return;
      var a=parseInt(e.target.getAttribute('data-ai'),10);
      A.picks[a]=e.target.value===''?null:parseInt(e.target.value,10);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var a=0;a<d.alerts.length;a++){
      var p=A.picks[a];
      if(p===null||p===undefined){ items.push({label:d.alerts[a].t,status:'missed',why:'No action chosen for this alert.'}); }
      else if(p===d.alerts[a].correct){ H++; items.push({label:d.alerts[a].t,status:'correct',why:d.alerts[a].whyOk||''}); }
      else { W++; items.push({label:d.alerts[a].t,status:'wrong',why:'You chose "'+d.alerts[a].actions[p]+'". Best: "'+d.alerts[a].actions[d.alerts[a].correct]+'". '+(d.alerts[a].whyOk||'')}); }
    }
    return {H:H,W:W,N:d.alerts.length,items:items};
  }
};

/* ---------- copy support for canonical command blocks ---------- */
document.addEventListener('click', function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act="copy"]'):null;
  if(!el) return;
  var pre=$('canonCmd');
  if(pre && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pre.textContent).catch(function(){});
  }
});

/* ---------- boot ---------- */
renderHeader();
showIntro();
})();

</script>
