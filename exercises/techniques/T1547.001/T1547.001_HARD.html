  "subheading": "Tier 3 of 4 — HARD. Terse, realistic work: several artefacts that must be correlated, near-miss answers that are defensible somewhere else, and at least one case where the least aggressive action is the correct one.",
  "objectType": "Sub-Technique (child of Technique T1547)",
  "explanationHtml": "<h3>What you are looking at</h3><p>This page is about MITRE ATT&amp;CK sub-technique <strong>T1547.001, Registry Run Keys and Startup Folder</strong>. In ATT&amp;CK the object type here is a <strong>sub-technique</strong>. A sub-technique is one exact piece of attacker behaviour that belongs to a larger technique. The parent technique is T1547, Boot or Logon Autostart Execution. You will learn what this sub-technique does, why an attacker picks it, what it leaves behind in logs, and which controls reduce it.</p><h3>The simple idea</h3><p>Imagine you are the attacker. You have a program on a Windows computer and you want it to start again by itself, without you. Windows already keeps a list of programs that start when a user logs on, so you add your program to that list. Windows then starts it for you at every logon. This is <strong>Persistence (TA0003)</strong>: access that survives a reboot or a logoff. When the entry sits in a machine wide place and starts with higher rights, it also serves <strong>Privilege Escalation (TA0004)</strong>.</p><h3>Where the list lives</h3><ul><li><strong>HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run</strong> and RunOnce: starts for the user who is logging on. A normal user can write here.</li><li><strong>HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run</strong> and RunOnce: starts for every user. Writing here needs Administrator rights.</li><li>RunServices, RunServicesOnce and the Explorer Run policy keys are less common variants of the same idea.</li><li><strong>RunOnceEx</strong> and its Depend subkey are documented on the ATT&CK page as a way to load a DLL at logon, and the Shell Folders and User Shell Folders keys can be changed so that the Startup folder points somewhere else.</li><li>Two more documented locations start code even earlier: the <strong>Load</strong> value under Windows NT\\CurrentVersion\\Windows for one user, and the <strong>BootExecute</strong> value under the Session Manager for the whole machine.</li><li><strong>Startup folders</strong>: %APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup for one user, and C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup for all users. A file placed there starts at logon.</li></ul><h3>What it leaves behind</h3><p>Registry value writes (Windows Registry data source), the program that starts at logon (Process creation), the command line that wrote the entry (Command execution), and new files in a Startup folder (File creation). Windows Event ID 4657 can show a registry value change when registry auditing is switched on, and Sysmon events 12, 13 and 14 show registry activity in many SOCs. ATT&CK also names a detection strategy for this exact behaviour, DET0365 Detect Registry and Startup Folder Persistence on Windows, and it marks the Windows Registry data source DS0024 as deprecated while the framework moves to data components.</p><h3>Why it matters</h3><ul><li>The attacker keeps access after a reboot. Cleaning the malware without removing the autostart entry means the malware comes back.</li><li>The entry normally runs at logon with the rights of the user. A machine wide entry written by an Administrator is more dangerous.</li><li>Autostart entries hide easily among real updaters, so a detection that is not tuned creates false positives.</li></ul>",
  "workHtml": "<h3>Who uses it at work</h3><ul><li><strong>SOC analyst</strong>: triages alerts about new autostart entries and decides if they come from normal software or from an intrusion.</li><li><strong>Detection engineer</strong>: writes and tunes the analytic for autostart registry writes, and removes the false positives caused by normal updaters.</li><li><strong>Threat hunter</strong>: sweeps hosts for unusual Run keys and compares them with a known good baseline.</li><li><strong>Incident responder</strong>: preserves the registry evidence first, then removes the persistence and hunts for the same entry on other hosts.</li><li><strong>CTI analyst</strong>: reports that a named group uses this procedure, and maps the procedure to ATT&amp;CK for the customer.</li><li><strong>GRC analyst and control owner</strong>: checks that the control really covers this behaviour, and records the evidence for the audit.</li><li><strong>Red teamer</strong>: picks this autostart method when the operation must survive a reboot with low noise.</li></ul><h3>Tools you will see</h3><ul><li>reg.exe (reg add, reg query, reg export) and regedit, on the attacker side and on the responder side.</li><li>Sysinternals Autoruns and autorunsc for a baseline of every autostart location.</li><li>Sysmon, Windows Security auditing (Event 4657) and an EDR console for telemetry.</li><li>The ATT&CK detection strategies DET0365 for this behaviour and DET0274 for the parent technique, used as the reference when an analytic is written.</li><li>PowerShell, GPO, and WDAC or AppLocker for control and hardening.</li></ul><h3>Daily tasks and deliverables</h3><ul><li>Triage: what wrote the value, which process, which user, is the path signed, has it been seen before.</li><li>Deliverables: triage note, detection rule with tuning notes, hunt report, IR timeline, registry export kept as evidence, control gap record.</li><li>The daily question: is this entry normal for this host, and what does it start next.</li></ul><h3>Risks and framework links</h3><ul><li>Risk: quiet persistence that survives a reboot and can lead to ransomware or to long term espionage access.</li><li>NIST CSF: PR.AC, PR.IP and DE.CM. CIS Controls v8: 4 secure configuration, 5 account management, 8 audit log management, 10 malware defenses. ISO 27001:2022: A.8.2 privileged access, A.8.16 monitoring, A.8.19 installation of software.</li></ul>",

    a = a.slice();

      var t = a[i]; a[i] = a[j]; a[j] = t;

  /* token based syntax highlighter for every mono block */
  function hl(text) {
    var TOK = [];
    function tok(html) { TOK.push(html); return '\u0001' + String.fromCharCode(0xE000 + TOK.length - 1) + '\u0001'; }
    var t = esc(text);
    t = t.replace(/^[ \t]*(#|;)[^\n]*/gm, function (m) { return tok('<span class="tc">' + m + '</span>'); });
    t = t.replace(/&quot;[^&\n]*&quot;/g, function (m) { return tok('<span class="tv">' + m + '</span>'); });
    t = t.replace(/\b(?:HKLM|HKCU|HKU|HKCR|HKEY_[A-Z_]+)\b/g, function (m) { return tok('<span class="tk">' + m + '</span>'); });
    t = t.replace(/\b(?:reg|reg\.exe|powershell|pwsh|cmd|cmd\.exe|rundll32|mshta|schtasks|wmic|autorunsc|wscript|cscript|bitsadmin|certutil)\b/gi,
      function (m) { return tok('<span class="tw">' + m + '</span>'); });
    t = t.replace(/\b(?:EventID|Image|TargetObject|Details|EventType|CommandLine|ParentImage|ParentCommandLine|User|UtcTime|RuleName|Provider|ProcessId|Hashes|Key|Value|Type|StartupFolder)\b/g,
      function (m) { return tok('<span class="tp">' + m + '</span>'); });
    t = t.replace(/\b(?:T\d{4}(?:\.\d{3})?|TA\d{4}|M\d{4}|G\d{4}|S\d{4}|DET\d{4})\b/g,
      function (m) { return tok('<span class="tk">' + m + '</span>'); });
    t = t.replace(/\b\d{3,5}\b/g, function (m) { return tok('<span class="tn">' + m + '</span>'); });

  /* ===================== ANSWER WIDGETS ===================== */
  function renderAnswer(mount, view, ex) {

        S.branchResults[ex.id].push({ ok: ok, given: given, correct: correctText, explain: st.explain, study: st.study });
        S.step += 1;
        if (S.step >= ex.steps.length) {
          var all = S.branchResults[ex.id].every(function (r) { return r.ok; });
          record(ex.id, all, S.hintUsed[ex.id], S.branchResults[ex.id].map(function (r, i) { return 'Step ' + (i + 1) + ': ' + r.given; }).join('   ||   '), ex.steps.map(function (s, i) { return 'Step ' + (i + 1) + ': ' + (s.options.filter(function (o) { return o.correct; })[0] || {}).text; }).join('   ||   '));
          S.step = 0;
          $('#feedbackMount').innerHTML = feedbackHTML(ex, S.resp[ex.id], ex.explain, true);
          showNextButton(ex);
          paintHeader();
        } else {
          renderExercise();
        }
      });
      return;
    }
    record(ex.id, ok, S.hintUsed[ex.id], given, correctText);
    $('#feedbackMount').innerHTML = feedbackHTML(ex, S.resp[ex.id], ex.explain);
    showNextButton(ex);
    paintHeader();
    var b = $('#submitAnswer');
    if (b) { b.disabled = true; }
    var nb = $('#nextBtn');
    if (nb) { nb.focus(); }
  }
  function showNextButton(ex) {
    var fb = $('#feedbackMount');
    var row = el('div', 'btnrow');
    var b = el('button', 'btn primary', S.i + 1 >= S.order.length ? 'Finish and check skipped' : 'Next exercise');
    b.type = 'button'; b.id = 'nextBtn';
    b.addEventListener('click', nextExercise);
    row.appendChild(b);
    if (openSkippedCount() > 0) {
      var s = el('button', 'btn ghost', 'Review skipped (' + openSkippedCount() + ')');
      s.type = 'button';
      s.addEventListener('click', function () { openSkipped(false); });
      row.appendChild(s);
    }
    fb.appendChild(row);
  }
  function record(id, ok, hint, given, correctText) {
    S.resp[id] = {
      answered: true, ok: !!ok, hint: !!hint, given: given, correct: correctText,
      credit: ok ? (hint ? 0.9 : 1) : 0
    };
  }
  function viewFor(ex) {
    if (ex.type === 'branch') {
      return { question: ex.question || 'Work through this exercise step by step.', options: [], terminal: null, summary: ex.summary };
    }
    return ex;
  }
  function feedbackHTML(ex, rec, explain, isBranchEnd) {
    var ok = rec.ok;
    var h = '<div class="fb ' + (ok ? 'ok' : 'no') + '" style="margin-top:14px">' +
      '<div class="fb-h"><span aria-hidden="true">' + (ok ? '✓' : '✗') + '</span> ' + (ok ? 'CORRECT' : 'INCORRECT') + '</div>';
    if (rec.hint) { h += '<p class="tiny">A hint was used on this exercise, so it is worth 0.9 instead of 1 point.</p>'; }
    h += '<h4>Correct answer</h4><p>' + fmtAns(rec.correct) + '</p>';
    if (!ok) { h += '<h4>Your answer</h4><p class="muted">' + fmtAns(rec.given) + '</p>'; }
    h += '<h4>Why</h4><p>' + nl2br(explain || ex.explain || '') + '</p>';
    if (ex.attacker) { h += '<h4>Attacker view</h4><p>' + nl2br(ex.attacker) + '</p>'; }
    if (ex.defender) { h += '<h4>Defender view</h4><p>' + nl2br(ex.defender) + '</p>'; }
    if (ex.workTask) { h += '<h4>In a real job</h4><p>' + nl2br(ex.workTask) + '</p>'; }
    if (ex.type === 'terminal' && ex.terminal) {
      var submitted = normCmd(rec.given);
      var close = ((ex.terminal.nearMiss || []).concat(ex.terminal.danger || [])).filter(function (m) {
        return normCmd(m.cmd) === submitted;
      })[0];
      if (close) {
        h += '<div class="warnbox"><strong>About the command you submitted:</strong> ' + esc(close.msg) +
          ' This is a teaching point rather than a silent zero: read the note, then compare it with the canonical command below.</div>';
      }
      h += '<h4>Canonical command</h4>';
      h += '<div class="ref mono" id="canonCmd">' + esc(ex.terminal.canonical) + '</div>';
      h += '<div class="copybar"><button class="btn ghost tiny" type="button" id="copyCanon">Copy command</button></div>';
      if (ex.terminal.parts) {
        h += '<h4>Part by part</h4><ul>' + ex.terminal.parts.map(function (p) {
          return '<li><strong class="mono">' + esc(p.p) + '</strong> — ' + esc(p.w) + '</li>';
        }).join('') + '</ul>';
      }
      if (ex.terminal.nearMiss) {
        h += '<h4>Near misses seen in real work</h4><ul>' + ex.terminal.nearMiss.map(function (m) {
          return '<li><strong class="mono">' + esc(m.cmd) + '</strong> — ' + esc(m.msg) + '</li>';
        }).join('') + '</ul>';
      }
      if (ex.terminal.danger) {
        h += '<div class="warnbox"><strong>Danger:</strong> ' + ex.terminal.danger.map(function (m) {
          return '<span class="mono">' + esc(m.cmd) + '</span> — ' + esc(m.msg);
        }).join(' ') + '</div>';
      }
    }
    if (!ok) { h += '<h4>What to study</h4><div class="study">' + esc(ex.study || ex.studyTip || 'Read the ATT&CK description of this object again and note which data source proves the behaviour.') + '</div>'; }
    h += '</div>';
    return h;
  }
  function nextExercise() {
    if (S.resp[S.order[S.i].id] && S.resp[S.order[S.i].id].answered) {
      S.i += 1;
      if (S.i >= S.order.length) { requestFinish(); return; }
      renderExercise();
    } else {
      skipExercise();
    }
  }
  function useHint() {
    var ex = S.order[S.i];
    if (!ex || (S.resp[ex.id] && S.resp[ex.id].answered) || S.hintUsed[ex.id]) { return; }
    S.hintUsed[ex.id] = true;
    var view = ex.type === 'branch' ? ex.steps[S.step] : ex;
    $('#hintMount').innerHTML = '<div class="hintbox"><strong>Hint used on this exercise (−10% if you are correct).</strong> ' +
      esc((view && view.hint) || ex.hint || 'Look again at the part of the scenario that the question points at.') + '</div>';
    paintHeader();
  }
  function skipExercise() {
    var ex = S.order[S.i];
    if (!ex) { return; }
    if (!(S.resp[ex.id] && S.resp[ex.id].answered)) {
      if (S.skipped.indexOf(ex.id) < 0) { S.skipped.push(ex.id); }
      S.step = 0;
      S.i += 1;
      if (S.i >= S.order.length) { requestFinish(); return; }
    } else {
      S.i += 1;
      if (S.i >= S.order.length) { requestFinish(); return; }
    }
    renderExercise();
  }
  function indexOfId(id) {
    for (var i = 0; i < S.order.length; i++) { if (S.order[i].id === id) { return i; } }
    return -1;
  }
  function openSkipped(forFinish) {
    var list = S.skipped.filter(function (id) { return !(S.resp[id] && S.resp[id].answered); });
    var rows = list.map(function (id) {
      var ex = S.order[indexOfId(id)];
      return '<div class="rrow"><span class="m">' + esc(ex.theme || '') + ' — ' + esc(ex.summary || ex.question) + '</span>' +
        '<button class="btn" type="button" data-return="' + esc(id) + '">Return to this exercise</button></div>';
    }).join('');
    var html = '<div class="review"><h2>Skipped exercises</h2>' +
      '<p>These exercises are skipped and have no answer yet. You can return to them as long as the timer is still running. ' +
      'If you submit the exam while they are still unanswered, they are <strong>left out of the score</strong>: not correct, not wrong, and not counted in the total.</p>' +
      (list.length ? '<div class="rlist">' + rows + '</div>' : '<p class="muted">Nothing is skipped right now.</p>') +
      '<div class="btnrow">' +
      '<button class="btn primary" type="button" id="closeSkipped">Back to the exam</button>' +
      '<button class="btn warn" type="button" id="submitNow">Submit the exam now</button>' +
      '<span class="pill">Timer ' + mmss(S.remaining) + '</span>' +
      '</div></div>';
    $('#skippedScreen').innerHTML = html;
    $('#examScreen').classList.add('hidden');
    $('#skippedScreen').classList.remove('hidden');
    $('#closeSkipped').addEventListener('click', function () { closeSkipped(); });
    $('#submitNow').addEventListener('click', function () {
      if (window.confirm('Submit now? Skipped exercises without an answer will be excluded from the score.')) { finishExam(false); }
    });
    $$('button[data-return]', $('#skippedScreen')).forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.remaining <= 0) { finishExam(true); return; }
        var idx = indexOfId(b.dataset.return);
        if (idx >= 0) { S.i = idx; S.step = 0; }
        closeSkipped();
        renderExercise();
      });
    });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function closeSkipped() {
    $('#skippedScreen').classList.add('hidden');
    if (!S.finished) { $('#examScreen').classList.remove('hidden'); }
  }
  function requestFinish() {
    if (openSkippedCount() > 0) {
      openSkipped(true);
      return;
    }
    finishExam(false);
  }

  /* ===================== PER-EXERCISE TIMER (terminal exercises) ===================== */
  function startExTimer(sec, api) {
    S.exRemaining = sec;
    var pill = $('#exTimerPill');
    function paint() {
      if (pill) { pill.textContent = 'This exercise is timed: ' + mmss(S.exRemaining) + ' left'; }
    }
    paint();
    stopExTimer();
    S.extid = setInterval(function () {
      if (S.paused || S.finished) { return; }
      S.exRemaining -= 1;
      paint();
      if (S.exRemaining <= 0) {
        stopExTimer();
        if (pill) { pill.textContent = 'Time is up for this exercise — your command was submitted.'; }
        var ex = S.order[S.i];
        if (api && api.ready()) { submitAnswer(api, ex, null); }
        else { skipExercise(); }
      }
    }, 1000);
  }
  function stopExTimer() { if (S.extid) { clearInterval(S.extid); S.extid = null; } }

  /* ===================== RESULTS ===================== */
  function computeResult() {
    var answered = 0, correct = 0, wrong = 0, sum = 0;
    var perTheme = {};
    S.order.forEach(function (ex) {
      var r = S.resp[ex.id];
      var theme = ex.theme || 'General';
      perTheme[theme] = perTheme[theme] || { answered: 0, ok: 0 };
      if (r && r.answered) {
        answered += 1; sum += r.credit;
        perTheme[theme].answered += 1;
        if (r.ok) { correct += 1; perTheme[theme].ok += 1; } else { wrong += 1; }
      }
    });
    var creditRounded = Math.round(sum * 10) / 10;
    var percent = answered ? Math.round((creditRounded / answered) * 100) : 0;
    return {
      answered: answered, correct: correct, wrong: wrong, sum: creditRounded,
      percent: percent, excluded: S.order.length - answered,
      passMark: META.passMark || 70, perTheme: perTheme
    };
  }
  function finishExam(byTimeout) {
    if (S.finished) { return; }
    S.finished = true;
    stopTimer(); stopExTimer();
    if (S.paused) { setPaused(false); }
    S.byTimeout = !!byTimeout;
    S.result = computeResult();
    renderResults();
  }
  function reportScore(correctCount, totalCount) {
    var percent = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: correctCount,
        total: totalCount,
        percent: percent,
        passed: percent >= (META.passMark || 70)
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }
  function renderResults() {
    var R = S.result;
    var pass = R.percent >= R.passMark;
    var themes = Object.keys(R.perTheme).map(function (t) {
      var d = R.perTheme[t];
      return '<tr><td>' + esc(t) + '</td><td>' + d.ok + ' / ' + d.answered + '</td><td>' +
        (d.answered ? Math.round((d.ok / d.answered) * 100) + '%' : '—') + '</td></tr>';
    }).join('');
    var report = S.order.map(function (ex, i) {
      var r = S.resp[ex.id];
      var cls = !r || !r.answered ? 'na' : (r.ok ? 'ok' : 'no');
      var head = !r || !r.answered ? '⚠ Not answered — excluded from score' : (r.ok ? '✓ Correct' : '✗ Incorrect');
      var body = '<div class="rcard ' + cls + '"><h4>Exercise ' + (i + 1) + ' — ' + head + ' · ' + esc(ex.theme || '') + '</h4>' +
        '<p class="ans">' + esc(ex.question) + '</p>';
      if (r && r.answered) {
        body += '<p class="ans"><strong>Correct answer:</strong> ' + fmtAns(r.correct) + '</p>';
        if (!r.ok) { body += '<p class="ans"><strong>Your answer:</strong> ' + fmtAns(r.given) + '</p>'; }
        if (ex.type === 'terminal' && ex.terminal) {
          body += '<p class="ans"><strong>Canonical command:</strong> <span class="mono">' + esc(ex.terminal.canonical) + '</span></p>';
          var cl = ((ex.terminal.nearMiss || []).concat(ex.terminal.danger || [])).filter(function (m) {
            return normCmd(m.cmd) === normCmd(r.given);
          })[0];
          if (cl) { body += '<div class="warnbox">' + esc(cl.msg) + '</div>'; }
        }
      } else if (ex.type === 'terminal' && ex.terminal) {
        body += '<p class="ans"><strong>Canonical command you did not run:</strong> <span class="mono">' + esc(ex.terminal.canonical) + '</span></p>';
      }
      body += '<p>' + nl2br(ex.explain || '') + '</p>';
      if (ex.attacker) { body += '<p><strong>Attacker view:</strong> ' + nl2br(ex.attacker) + '</p>'; }
      if (ex.defender) { body += '<p><strong>Defender view:</strong> ' + nl2br(ex.defender) + '</p>'; }
      if (r && !r.ok) { body += '<div class="study">Study next: ' + esc(ex.study || 'Re-read the ATT&CK entry for this object.') + '</div>'; }
      if (!r || !r.answered) { body += '<div class="study">Study next: ' + esc(ex.study || 'Re-read the ATT&CK entry for this object.') + '</div>'; }
      body += '</div>';
      return body;
    }).join('');
    var cert = pass
      ? '<div class="cert"><div class="seal" aria-hidden="true">✓</div><h2>' + esc(CONFIG.sevLabel) + ' certificate of completion</h2>' +
        '<p><strong>' + esc(INTRO.heading) + '</strong></p>' +
        '<p>' + (candidate.username ? esc(candidate.username) + ' reached ' : 'You reached ') + '<strong>' + R.percent + '%</strong> with a pass mark of ' + R.passMark + '%.</p>' +
        '<p class="small muted">Topic ' + esc(META.topicId || '') + ' · batch ' + esc(META.batch || 1) + ' of 4 · ' + new Date().toLocaleDateString() + '</p></div>'
      : '<div class="fb no"><div class="fb-h"><span aria-hidden="true">✗</span> FAIL — retake required</div>' +
        '<p>You reached <strong>' + R.percent + '%</strong> and the pass mark is <strong>' + R.passMark + '%</strong>. ' +
        'Read the report below, then use the Retake button. The exercises and the answer choices are shuffled again for the new attempt.</p></div>';
    var html = '<div class="res">' +
      '<h2>Results — ' + esc(INTRO.heading) + '</h2>' +
      (S.byTimeout ? '<div class="warnbox">The timer reached zero, so the exam was submitted automatically. Unanswered exercises are excluded from the score.</div>' : '') +
      '<div class="metrics">' +
        metric(R.percent + '%', 'final score over answered exercises') +
        metric(String(R.correct), 'answered correctly') +
        metric(String(R.wrong), 'answered incorrectly') +
        metric(String(R.excluded), 'skipped and never answered (excluded)') +
      '</div>' +
      '<p class="small muted">Score maths: ' + R.sum + ' point(s) from ' + R.answered + ' answered exercise(s) = ' + R.percent + '%. ' +
      'Pass mark ' + R.passMark + '%. Exercises without an answer are left out of both the top and the bottom of the fraction.</p>' +
      cert +
      '<h3 style="margin-top:16px">Per-theme result</h3><table class="themetbl"><thead><tr><th>Theme</th><th>Correct / answered</th><th>Result</th></tr></thead><tbody>' + themes + '</tbody></table>' +
      '<h3 style="margin-top:18px">Detailed report — every exercise</h3><div class="rpt">' + report + '</div>' +
      '<div class="btnrow"><button class="btn primary" type="button" id="retakeBtn">Retake exam</button>' +
      '<button class="btn ghost" type="button" id="toTop">Back to the top</button></div>' +
      '<div class="tierbar"><span class="tierchip' + (META.batch === 1 ? ' on' : '') + '">Tier 1 EASY</span><span class="tierchip' + (META.batch === 2 ? ' on' : '') + '">Tier 2 MEDIUM</span><span class="tierchip' + (META.batch === 3 ? ' on' : '') + '">Tier 3 HARD</span><span class="tierchip' + (META.batch === 4 ? ' on' : '') + '">Tier 4 EXTREMELY HARD</span></div>' +
      '</div>';
    $('#examScreen').classList.add('hidden');
    $('#skippedScreen').classList.add('hidden');
    $('#introScreen').classList.add('hidden');
    $('#hdr').classList.add('hidden');
    $('#resultsScreen').innerHTML = html;
    $('#resultsScreen').classList.remove('hidden');
    $('#retakeBtn').addEventListener('click', retake);
    $('#toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); });
    window.scrollTo({ top: 0, behavior: 'auto' });
    /* animate the percentage, then report exactly once for this attempt */
    var big = $('#resultsScreen .metric .big');
    if (RM || !big) {
      reportScore(R.sum, R.answered);
      S.reported = true;
    } else {
      var shown = 0;
      var step = Math.max(1, Math.round(R.percent / 22));
      var t = setInterval(function () {
        shown = Math.min(R.percent, shown + step);
        big.textContent = shown + '%';
        if (shown >= R.percent) {
          clearInterval(t);
          big.textContent = R.percent + '%';
          if (!S.reported) { reportScore(R.sum, R.answered); S.reported = true; }
        }
      }, 40);
    }
  }
  function retake() {
    $('#resultsScreen').classList.add('hidden');
    $('#skippedScreen').classList.add('hidden');
    $('#examScreen').classList.add('hidden');
    $('#hdr').classList.add('hidden');
    S.finished = false; S.started = false; S.reported = false; S.paused = false;
    $('#pauseOverlay').classList.add('hidden');
    $('#introScreen').classList.remove('hidden');
    renderIntro();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ===================== BOOT ===================== */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
