  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}
.paused-card{max-width:460px;width:100%;text-align:center;padding:30px 24px;border-color:var(--state-paused);}

<script>
"use strict";
var EXAM = {"meta":{"topicId":"t1563.001","batch":4,"title":"T1563.001 Remote Service Session Hijacking: SSH Hijacking — EXTREMELY HARD","difficulty":"extremely-hard","questionCount":15,"estimatedMinutes":48,"passMark":70,"mitreId":"T1563.001","mitreName":"Remote Service Session Hijacking: SSH Hijacking","objectType":"Sub-Technique","severityLabel":"EXTREMELY HARD","partLabel":null},"intro":{"learn":["This exam is about **T1563.001 Remote Service Session Hijacking: SSH Hijacking**, a **Sub-Technique** of T1563 in the **Lateral Movement** tactic, taken to expert level. You will work a multi-week targeted intrusion at Meridian Health as a senior incident responder.","An ssh-agent holds private keys in memory and signs requests through a unix socket (`/tmp/ssh-*/agent.<pid>`) named by SSH_AUTH_SOCK. With ForwardAgent, that socket appears on jump hosts. ControlMaster adds a second socket family: multiplexed, already-authenticated sessions under ~/.ssh/. One environment read can hand both to an operator who never authenticated.","You will reconstruct full pivot chains across jump hosts, separate harvest from reuse, read evasion tradecraft (renamed ssh copies, cleared environments, single-use socket access) against normal environment noise, and reason through ptrace-based environ grabs.","You will also make senior calls under pressure: conflicting signals where documented deployment tooling and interactive ancestry disagree, containment actions with real business cost, rotation scopes that match the technique, and ForwardAgent policy trade-offs against developer workflows.","Finally you will phrase the CTI briefing: confidence words that match evidence, sources named by type, and behaviour anchored to publicly documented intrusion reporting. Every decision you make here would be re-read in a post-incident review."],"keywords":[{"theme":"Pivot chains & tradecraft","items":["forwarded-agent jump chains","one socket read unlocks many hosts","/proc/<pid>/environ harvesting","ptrace-based variants","single-use socket reuse"]},{"theme":"ControlMaster deep dive","items":["ControlPath sockets in ~/.ssh/","attach to an authenticated master","ssh -O exit and friends","per-user ControlMaster policy"]},{"theme":"Evasion & noise","items":["renamed ssh copies","cleared environment","living off trusted binaries","normal environment variance"]},{"theme":"Conflicting signals & senior triage","items":["deployment tooling versus adversary ancestry","gather more evidence","volatile evidence cost","real-cost containment"]},{"theme":"Mitigation depth & reporting","items":["ForwardAgent policy trade-offs","bastion hardening","key rotation scope","CTI briefing confidence","public intrusion reporting"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Terminal (fake shell)","Branching scenario"]},"exercises":[{"id":"e01","type":"log-qcm","scenario":{"text":["04:50, week three of MH-8807. The task-force room is on its second coffee pot.","Mer-bastion-02 logs came back from the vendor with a two-hour reconstruction window.","You have the auditd stream, EDR ancestry, the jump-host config and the relay records for the same night.","Executive pressure is explicit: name the stage of the chain that put the operator on mer-pacs-01.","The room already agrees someone harvested a socket path; what is contested is proof of reuse versus proof of harvest.","The auditd stream is the only source that watched the socket itself.","Two lines in the stream do not fit any documented job on this host.","One of them is the reuse proof the steering group needs.","The EDR agent was upgrading, so process command lines for the window are missing — reason from what survived.","Relay records on the targets are complete."],"artefacts":[{"label":"Ticket MH-8807 — steering addendum","text":"CISO needs a defensible chain statement by 06:00. Distinguish: harvest (reading the socket path) versus reuse (making the agent sign). We have one shot at the wording."},{"label":"EDR ancestry — pid 2310","code":"sshd(2201) [d.okafor, login 03:02]\n └─ bash(2287) [d.okafor, pts/2]\n     └─ python3(2310) [uid=1043 svc-hv, auid=unset]\ncmdline: UNAVAILABLE (agent upgrade window)"},{"label":"sshd_config — mer-bastion-02","code":"Match Address 10[.]44.2.*\n    ForwardAgent yes\nPermitRootLogin no\nPasswordAuthentication no"},{"label":"Relay records — target hosts","code":"03:52:21 mer-pacs-01 accepted publickey for d.okafor (fp SHA256:Kw3+ matches 03:02:11 key)\n03:56:44 mer-lab-07  accepted publickey for d.okafor\n04:01:09 mer-git-01  accepted publickey for d.okafor"}]},"log":{"title":"auditd stream — mer-bastion-02 (03:02–04:05, reconstructed)","lines":["03:02:11 sshd[2201]: Accepted publickey for d.okafor from 10[.]44[.]2[.]15 port 51422","03:02:12 edrd: session d.okafor started with ForwardAgent=yes; SSH_AUTH_SOCK=/tmp/ssh-Kd71Qe/agent.2201","03:14:00 auditd: logger restart — gap begins","03:41:59 auditd: logger resume — gap ends","03:44:26 auditd AGENT_SOCK: open /tmp/ssh-Kd71Qe/agent.2201 pid=2287 uid=1001 comm=bash (own)","03:47:03 cron: svc-backup mer-backup.sh started (documented)","03:52:19 auditd AGENT_SOCK: connect /tmp/ssh-Kd71Qe/agent.2201 pid=2310 uid=1043 auid=unset","03:52:20 auditd AGENT_SOCK: send /tmp/ssh-Kd71Qe/agent.2201 pid=2310 uid=1043 (sign)","03:55:44 git: fetch pacs-integration as d.okafor via agent","04:02:30 auditd AGENT_SOCK: open /tmp/ssh-Kd71Qe/agent.2201 pid=2287 uid=1001 comm=bash (own)","04:05:00 sshd[2201]: session closed"]},"question":"Which line is the reuse proof the steering group needs?","answer":{"options":["03:02:12 edrd: session d.okafor started with ForwardAgent=yes","03:44:26 open /tmp/ssh-Kd71Qe/agent.2201 pid=2287 uid=1001 (own)","03:52:19 connect /tmp/ssh-Kd71Qe/agent.2201 pid=2310 uid=1043 auid=unset","04:05:00 sshd[2201]: session closed"],"correct":2},"hint":"Ownership of the socket versus the uid that knocked — one line holds both, and the next line shows it being used.","explanation":["The 03:52:19 line pairs the socket owned by d.okafor's session (uid 1001) with an accessing process under uid 1043, and 03:52:20 shows the agent signing. Harvest plus signing: that is reuse, and the relay records tie the same key to sign-ins on three targets minutes later.","The ForwardAgent line explains why the socket exists on the jump host at all — necessary context, not proof. The 03:44:26 open is the owner using its own agent; the session close is routine.","The collector gap and the missing EDR command lines are real gaps, but the socket record comes from auditd on the host and never depends on the EDR agent — the chain survives both holes."],"perspectives":{"attacker":"I did not need a new credential; I needed one connect on a socket that was already trusted.","defender":"Socket-owner-versus-accessor telemetry is independent of EDR health — keep the host-level watch alive."},"study":"Practise separating harvest evidence from reuse evidence in agent-hijack timelines."},{"id":"e02","type":"fillblank","scenario":{"text":["05:30. The CTI lead drafts the 06:00 executive line for MH-8807.","House style for Meridian Health briefings: confidence wording must match evidence, sources must be named by type, and we never cite reporting we cannot reference.","The socket record, the EDR ancestry and the relay fingerprints all agree, so the reuse assessment is not a guess.","The tradecraft itself — reading a forwarded agent socket on a jump host and riding it to internal hosts — is documented in public intrusion reporting going back years.","No intelligence from restricted channels is being used, and the draft must say so.","Fill the four gaps from the briefing vocabulary.","A wrong confidence word makes the whole paragraph challengeable.","The CTI lead will read your sentence aloud."],"artefacts":[{"label":"Style card — CTI briefing","code":"confidence ladder: low | moderate | high\nevidence rule: three independent sources = high\nsource rule: name the channel (public reporting, internal telemetry)\nnever: unnamed sources, hedging stacks"}]},"question":"Fill every gap with a word from the bank.","answer":{"template":"We assess with ___ confidence that the operator reused a forwarded ___ on mer-bastion-02 to sign into several internal hosts; the tradecraft matches ___ intrusion reporting, and this assessment uses no ___ material.","blanks":["high","agent","public","classified"],"bank":["high","low","agent","daemon","public","classified"]},"hint":"Three agreeing sources set the ladder word; the style card names both the reporting channel and the excluded one.","explanation":["Three independent sources — auditd on the host, EDR ancestry, and the targets' relay records — meet the style card's own bar for **high**. Writing 'low' would understate evidence you can show.","The object reused is the forwarded **agent**; 'daemon' is a generic word that tells the CIO nothing. The tradecraft matches **public** intrusion reporting, which Meridian can actually reference in an audit.","Stating that no **classified** material was used is what makes the sentence defensible: it draws the source boundary instead of hiding it, exactly what the style card demands."],"study":"Practise writing confidence statements that map words to evidence counts."},{"id":"e03","type":"branching","scenario":{"text":["09:10, week three. Mer-pacs-01 now shows its own agent-socket hit, and the room splits.","The hit: pid 6120 running as svc-hv (uid 1043) connected to the agent socket of an interactive session owned by r.silva.","svc-hv is the hospital-view report runner; change CHG-2231 documents it in that exact window every weekday.","On an ordinary day, that is where the story would end.","Today it does not: EDR shows pid 6120's ancestry as an interactive sshd session, not the cron chain the change record describes.","The platform lead insists the runner is untouched and points at eight months of clean windows.","The 03:52 event from mer-bastion-02 is still unresolved for this host, and the collector gap hid the window where a harvest could have happened.","The CISO wants one of two sentences by 09:40: 'documented behaviour' or 'unexplained — contain'.","Both artefact sets are below; the ancestry diff is the pivot.","Grand rounds start at 10:00 and nobody wants PACS in read-only mode during rounds."],"artefacts":[{"label":"auditd — mer-pacs-01","code":"09:10:04 AGENT_SOCK: connect /tmp/ssh-Rt15Wz/agent.5322 pid=6120 uid=1043 (svc-hv)\n09:10:05 AGENT_SOCK: send /tmp/ssh-Rt15Wz/agent.5322 pid=6120 (sign)"},{"label":"Change CHG-2231","text":"svc-hv report runner: cron 09:05 Mon–Fri, user svc-hv, no interactive login. Owner: platform team. Reviewed monthly."},{"label":"EDR ancestry diff","code":"03:52 window: pid 6120 parent cron(4102) > run-parts > svc-hv job [normal]\n09:10 window: pid 6120 parent bash(6090) < sshd(6075) interactive session [NOT in CHG-2231]\nNote: EDR cmdline unavailable for 03:52 (agent upgrade)."},{"label":"Task-force chat (pressure)","text":"platform-lead 09:12: 'our runner is fine, eight months clean'. CISO office 09:15: 'we need the sentence by 09:40, rounds at 10:00'."}]},"question":"Work the contested triage one decision at a time.","hint":"Paperwork describes what should run; telemetry shows what ran.","steps":[{"continuation":"The same pid number, the same user, two different parent chains — and only one of them is written down.","question":"Two signals conflict: the change record versus the ancestry diff. Which wins, and in which direction?","options":["The change record wins: eight months of clean windows outweigh one odd ancestry line","The ancestry diff wins: the same job identity outside its documented chain is unexplained behaviour","Neither wins: agent sockets cannot be touched without root","The auditd line wins: a socket connect is always an incident by itself"],"correct":1},{"continuation":"You call the 09:10 event unexplained. The 03:52 event on this host stays ambiguous because command lines are missing.","question":"Which next step resolves the 03:52 ambiguity without touching a live system?","options":["Reimage mer-pacs-01 before grand rounds start","Pull flow logs and git-audit for 03:52 — sources that survived the collector gap","Delete the agent_sock key from audit.rules to stop the noise","Ask the vendor to backfill the missing command lines and wait a week"],"correct":1},{"continuation":"Flow logs show mer-pacs-01 opened SSH to mer-lab-07 at 03:53 from the same session, and git-audit shows a fetch under r.silva's key.","question":"Containment is approved. Which action accepts a real business cost and is still the right call?","options":["Kill the r.silva and svc-hv sessions and rotate the keys the agent could sign; report jobs will run late","Reboot the PACS database node to clear memory","Silence the agent_sock watch during the response","Wait for the next monthly maintenance window"],"correct":0}],"explanation":["A change record is a claim about what should run; ancestry is an observation about what ran. When they disagree, the observation wins — the same pid with an interactive parent is exactly how a hijacker wears the runner's uniform. Accepting the paperwork because it is eight months old is the near-miss.","Flow logs and git-audit are independent, non-mutating sources that survived the collector gap: they answer the 03:52 question without touching a live host. Reimaging destroys the answer; deleting the watch key destroys the future answer.","Once reuse is confirmed, the agent is a live signing oracle: sessions must die and the keys it could sign must rotate, even though report jobs run late. The CISO pre-agreed that clinical reporting can slip an hour; the database reboot and the watch silencing would only burn evidence and coverage."],"perspectives":{"attacker":"Running under a documented job identity is the best costume on the estate.","defender":"When documentation and ancestry disagree, page first and reconcile later."},"study":"Study ancestry-based analytics that baseline documented job chains."},{"id":"e04","type":"dragdrop","scenario":{"text":["09:55. Containment is approved and the case file is open.","The lead reads the response checklist aloud and asks you to sort it before anyone acts.","Meridian legal has one instruction: nothing on the live hosts may be deleted, and volatile memory outranks everything.","Two checklist items cost the business money; two would burn evidence; the rest are free and fast.","Release engineering warns that key rotation will stall tonight's artefact signing for about an hour.","The CISO has accepted an hour of friction if it closes the signing window.","Sort every item now.","The zones decide execution order."]},"question":"Drag each checklist item into the zone that matches its evidence cost.","answer":{"zones":[{"name":"Evidence-preserving — do first"},{"name":"Costly but justified — approved by CISO"},{"name":"Destroys evidence — never first"}],"items":[{"text":"Copy /proc/4213/environ from the live suspect process to the evidence share","zone":0},{"text":"Export the EDR ancestry graph for pid 2310 into the case file","zone":0},{"text":"Rotate the keys the agent could sign; accept one hour of release friction","zone":1},{"text":"Set ForwardAgent no on the bastion and restart sshd; forwarding workflows break until overrides exist","zone":1},{"text":"Kill every SSH session on all three hosts at once","zone":2},{"text":"Delete the socket directory /tmp/ssh-Kd71Qe","zone":2},{"text":"Run gcore on the suspect shell before any /proc read","zone":2}]},"hint":"Ask what ceases to exist the moment the item runs.","explanation":["The /proc copy and the EDR export are read-only: they capture the only state that dies with the process, so they run first.","Rotation and the sshd policy change are real costs — an hour of stalled signing, broken forwarding workflows — but both close a confirmed window and both were signed off. Cost accepted is not cost avoided.","Mass session kills erase every live process you still needed; deleting the socket directory removes an artefact under legal hold; and gcore before the cheap read pauses or can crash the very process you are trying to observe. Each one is a DANGEROUS first move."],"study":"Practise ordering live-response actions by volatility and reversibility."},{"id":"e05","type":"qcm-single","scenario":{"text":["11:20. Forensics on the mer-bastion-02 image turns up a second socket family in ~/.ssh/.","The operator's shell history shows `ssh -O exit mer-jump` twice, and the artefact shows the config block behind it.","The report writer asks what this family gives an attacker compared with the agent socket.","They are not the same socket and not the same prize.","The agent socket signs authentication requests; the control socket multiplexes an already-authenticated SSH connection.","A live control socket means every new 'session' to that target reuses the established handshake — no new login event, no new key choice.","The task force must describe both precisely or the cleanup list will be wrong.","The distinction also decides which config line mitigates which socket."],"artefacts":[{"label":"~/.ssh/config — d.okafor (image)","code":"Host mer-jump\n    HostName mer-bastion-02\n    ControlMaster auto\n    ControlPath ~/.ssh/cm-%r@%h-%p\n    ControlPersist 10m\n    ForwardAgent yes"}]},"question":"What does a live ControlMaster socket give an operator who never authenticated?","answer":{"options":["The target user's private keys in plaintext","Root privileges on the jump host through the socket","A copy of the user's known_hosts entries","New sessions to the target that reuse the established, authenticated connection"],"correct":3},"hint":"This socket multiplexes a handshake that already succeeded.","explanation":["A ControlMaster socket carries the already-authenticated SSH connection: anyone who can open it gets new multiplexed sessions with no second authentication and no fresh login trail.","It is not the agent socket and never stores keys — the keys-in-plaintext answer confuses the two families, and that confusion would put the wrong cleanup items on the list.","Neither socket grants root, and known_hosts is host bookkeeping. The mitigations differ too: this socket is governed by per-user ControlMaster policy and idle timeouts, the agent socket by ForwardAgent policy."],"perspectives":{"attacker":"One directory in ~/.ssh held two doors: a signer and a handshake I could reuse.","defender":"Write per-user ControlMaster policy and short ControlPersist, or the second door stays open."},"study":"Read how ControlMaster, ControlPath and ControlPersist interact in ssh_config."},{"id":"e06","type":"match","scenario":{"text":["13:00. The evidence review splits artefacts between the agent story and the multiplexing story.","Two interns keep mixing the two socket families and the ptrace line.","The lead wants one matching board that the whole room can agree on.","Left column: artefacts from the image and logs. Right column: what each one means.","The ptrace line came from the syscall ring buffer and never appeared in shell history.","Nothing here needs a tool; it needs precise reading.","One artefact describes a heavier way to get the same environ data.","One artefact is the core hijack signal itself."],"artefacts":[{"label":"Evidence pinboard (extract)","code":"socket /tmp/ssh-Kd71Qe/agent.2201 owner d.okafor\nSSH_AUTH_SOCK present in /proc/2310/environ\nsyscall ring: ptrace(PTRACE_ATTACH, 2287)\nconfig: ControlMaster auto + ControlPath ~/.ssh/cm-%r@%h-%p\nauditd: AGENT_SOCK hit, accessor uid=1043"}]},"question":"Match each artefact to its precise meaning.","answer":{"pairs":[{"left":"agent.2201 owned by d.okafor","right":"the forwarded agent of her interactive session"},{"left":"SSH_AUTH_SOCK in /proc/2310/environ","right":"pid 2310 can reach that agent"},{"left":"ptrace(PTRACE_ATTACH, 2287)","right":"heavier environ grab; leaves syscall traces"},{"left":"ControlMaster auto + ControlPath","right":"multiplexed sessions share one authenticated control socket"},{"left":"AGENT_SOCK hit, accessor uid=1043","right":"uid mismatch — the core hijack signal"}]},"hint":"Two sockets, two jobs: one signs, one multiplexes — and one artefact is the alarm itself.","explanation":["Ownership names the agent; presence of SSH_AUTH_SOCK in another process's environment proves reach; the auditd mismatch on the socket is the event that started the case.","The ptrace attach is the heavyweight variant of the same harvest: instead of reading /proc directly, the operator attached to the shell — louder, riskier, and it leaves syscall traces that a plain environ read does not.","ControlMaster auto with a ControlPath under ~/.ssh is the second socket family: multiplexed sessions that share one authenticated connection. Keeping the three ideas separate is what makes the report defensible."],"study":"Compare direct /proc environ reads with ptrace-based collection and their traces."},{"id":"e07","type":"branching","scenario":{"text":["15:00. Containment holds; the task force moves to keeping this class of access dead.","The CISO opens with 'best practice: disable agent forwarding everywhere, today'.","Release engineering counters: twice-weekly artefact signing uses forwarded agents from two designated runners, and breaking it stalls hospital-facing builds.","Meridian can ship per-group sshd overrides, per-user ControlMaster policies, and idle timeouts; it cannot change developer habits overnight.","The board wants trade-offs stated, not slogans.","Three decisions are on the table: the forwarding policy, the bastion session hygiene, and the rotation scope after a confirmed hijack.","Prove-It validation jobs will fail for roughly an hour when engineer keys rotate.","The CISO has pre-approved that hour.","Every decision needs a sentence the auditor can reuse.","Answer one decision at a time."],"artefacts":[{"label":"Hardening options register","code":"A) global ForwardAgent no + group override\nB) per-user ControlMaster policy\nC) ClientAliveInterval 300 + idle logout\nD) rotation runbook v2\nConstraints: release runners 2x/week; board wants trade-offs"}]},"question":"Work the hardening package one decision at a time.","hint":"Best practice is a direction, not a config line — and the runners were pre-approved to bleed.","steps":[{"continuation":"The room quotes 'disable forwarding' at each other instead of the constraint list.","question":"Decision one: what is the defensible forwarding policy?","options":["Keep ForwardAgent yes everywhere because developers will complain","ForwardAgent no globally, with a per-group override for the two release runners and command-restricted keys","Disable sshd on every jump host until the review ends","Ban SSH entirely and move to desktop sharing"],"correct":1},{"continuation":"The override for the release group is approved with command-restricted keys.","question":"Decision two: which session-hygiene change shrinks the live-socket window most on the bastion?","options":["Rewrite the motd banner to warn about agent misuse","Allow root password logins for faster incident access","ClientAliveInterval 300 plus idle logout, so forgotten sessions die","Disable auditd during business hours to cut noise"],"correct":2},{"continuation":"A hijack is later confirmed: three hosts were reached during a two-hour window.","question":"Decision three: which rotation scope is proportionate, with the hour of Prove-It downtime accepted?","options":["Rotate nothing: the agent never stored key material on disk","Reissue every certificate in the estate, including VPN and code-signing","Delete the bastion host key and postpone any user-key action","Rotate the keys the agent could sign and audit authorized_keys on the reachable hosts"],"correct":3}],"explanation":["The blanket ban is the widely quoted best practice, and here it is wrong as written: it buys little over a scoped override while breaking two named runners. Global off, scoped override with command-restricted keys, is the trade-off the board can defend.","Idle timeouts expire the forgotten sessions every hijack in this case fed on. A banner is theatre, root password logins are a regression, and silencing auditd removes the only independent socket telemetry.","Rotation must match what the agent could actually sign: those keys, plus an authorized_keys audit on the reachable hosts to catch persistence planted during the window. 'Nothing' ignores that signed access may have been converted into lasting credentials; estate-wide reissue is disproportionate and breaks pinning for days."],"perspectives":{"attacker":"A forwarded agent on a shared runner is still a signing oracle; command= is what spoils my day.","defender":"Trade-offs stated in hours of friction and closed windows are what auditors reuse."},"study":"Practise writing scoped sshd Match-group overrides with from= and command= key restrictions."},{"id":"e08","type":"order","scenario":{"text":["16:30. The steering group asks for a one-slide chain of the operator's behaviour, in order, for the board pack.","CTI will annotate each step with the matching sub-technique reference.","The chain must reflect what the artefacts proved, in the order it happened.","Everything below was evidenced this week; nothing is assumed.","One step is pure evasion and one step shows deliberate restraint.","The board reads left to right; the order is the story.","Six steps made the cut.","Drag them into the true sequence."]},"question":"Order the operator's steps from first to last.","answer":{"mode":"timeline","items":["Open an SSH session to mer-bastion-02 with agent forwarding enabled","Enumerate /proc for live shells that carry SSH_AUTH_SOCK","Read the target shell's environ to capture the agent socket path","Point a client at the captured socket and let the agent sign into mer-pacs-01, mer-lab-07 and mer-git-01","Run a renamed copy of ssh from a cache directory to blend with normal work","Use the socket once more, then exit, leaving no key on disk"]},"hint":"Forwarding is chosen at login; the environ read comes before any signing; restraint is last.","explanation":["Forwarding must be enabled when the session opens — it is a login-time choice, so it leads the chain.","Discovery and harvest follow: list the live shells that carry SSH_AUTH_SOCK, then read the chosen environ to get the socket path. Only then can any client be pointed at the agent for the three sign-ins.","The renamed ssh copy is evasion woven around the work, and the single-use final touch shows restraint — the operator kept the socket's footprint small and left no key on disk. Both are tradecraft choices the board should see in order, not as a list."],"study":"Practise turning artefact sets into ordered, evidence-anchored adversary chains."},{"id":"e09","type":"log-qcm","scenario":{"text":["17:10. The steering group asks for today's scope sentence.","Three hosts are proven; the question is what you can claim beyond them.","Mer-pacs-01's own collector had an outage inside the relevant window, so its local view has a hole.","The relay records on the jump host are complete for the whole night.","Mer-lab-07 logs are complete but were not yet re-read after 04:05.","The lab hosts ship their auditd remotely; the remote store is intact.","Choose the sentence the CISO can defend if a regulator reads it.","Overclaiming and underclaiming both fail."]},"log":{"title":"coverage matrix — MH-8807 night one (as known 17:10)","lines":["mer-bastion-02  auditd  COMPLETE (reconstructed 03:14–03:41 from vendor)","mer-bastion-02  relay records  COMPLETE","mer-pacs-01     local auditd   GAP 03:10–03:55 (collector outage INC-2291)","mer-pacs-01     relay records  COMPLETE (3 sign-ins seen)","mer-lab-07      auditd         COMPLETE to 04:05; post-04:05 NOT re-read","mer-lab-07      remote store   INTACT","mer-git-01      auditd         COMPLETE; one agent-backed fetch 04:01","unknown hosts   coverage       NOT ENUMERATED (asset list pending)"]},"question":"Which scope statement is defensible today?","answer":{"options":["Exactly three hosts were reached and the rest of the estate is clean","No compromise occurred on mer-pacs-01 because its own logs show nothing","At least the three proven hosts; scope stays a floor until the collector gap and post-04:05 lab logs are reviewed","The entire estate must be treated as compromised until reimaged"],"correct":2},"hint":"A hole in one source is not a clean bill; it is an open question with a named owner.","explanation":["The defensible claim is bounded: three hosts are proven, and two named review tasks — the 03:10–03:55 collector gap and the post-04:05 lab window — decide whether the floor moves. That is a sentence a regulator can read without finding an overreach.","'Exactly three and the rest clean' claims coverage you do not have; the pacs-01 gap and the unread lab tail sit directly on the attack path. 'No compromise on pacs-01' confuses a blind source with a clean one — its blindness is why the relay records matter.","Estate-wide compromise fails proportionality: relay records bound the night, and the asset list is still pending. Gather the named evidence first; the sentence expands or closes on facts, not mood."],"study":"Practise writing floor-not-ceiling scope statements with named open tasks."},{"id":"e10","type":"dragdrop","scenario":{"text":["18:00. The report needs a clean split between tradecraft and noise, because the board will ask 'how much of this is just our environment?'","Meridian's estate legitimately changes agent socket directories on every sshd restart, and the release runner spawns a dedicated agent per job.","The operator, meanwhile, did at least three things purely to stay invisible.","Two artefacts in the batch belong to completely different techniques and must leave this report.","One artefact shows deliberate restraint: the socket was used once more, then abandoned.","Sort all seven.","Zones: tradecraft, normal variance or documented activity, different technique.","The CTI lead signs the result tonight."]},"question":"Drag every item into the zone it belongs to.","answer":{"zones":[{"name":"Evasion tradecraft"},{"name":"Normal variance / documented activity"},{"name":"Different technique — not agent reuse"}],"items":[{"text":"Runs a copied ssh binary from /tmp/.cache/svupdate","zone":0},{"text":"Unsets SSH_AUTH_SOCK, re-exports it to the victim's socket before one git pull","zone":0},{"text":"Agent socket directory name changes after every sshd restart","zone":1},{"text":"Release runner spawns its own ssh-agent per job (CHG-2214)","zone":1},{"text":"Copies id_rsa out of the engineer's home directory","zone":2},{"text":"Logs in to mer-pacs-01 with a reused password","zone":2},{"text":"Uses the forwarded socket exactly once, then exits the session","zone":0}]},"hint":"Renamed binaries and env switching are choices; a rotating directory name is how sshd works.","explanation":["The copied ssh binary, the deliberate environment switch onto the victim's socket, and the single-use-then-exit pattern are all operator choices that reduce footprint: renamed tooling defeats name-based analytics, the env switch hides intent inside a routine command, and single-use limits the telemetry window.","Rotating socket directory names and per-job runner agents are how sshd and the pipeline are designed to behave — variance, not tradecraft.","Reading id_rsa from disk is T1552.004, and a reused-password login is T1021.004: real findings, wrong report. Moving them out keeps the T1563.001 chain clean."],"study":"Practise separating environment variance from deliberate tradecraft before writing reports."},{"id":"e11","type":"fillblank","scenario":{"text":["19:00. The hardening draft goes to change control tomorrow.","The sshd_config change must be summarised in one sentence for the CAB.","Global forwarding goes off; the release group keeps a scoped override; sessions must die when forgotten.","The CAB rejects vague words like 'harden' — it wants parameter names.","Three parameters carry the whole sentence.","Fill them from the bank.","The wheel group is not involved; the override is for release runners.","PermitRootLogin is already no estate-wide and stays out of this sentence."],"artefacts":[{"label":"sshd_config draft v2 (extract)","code":"Match Group release-runners\n    ForwardAgent yes\n    # keys restricted via from= and command=\nMatch all\n    ForwardAgent no\n    ClientAliveInterval 300\n    ClientAliveCountMax 2"}]},"question":"Fill every gap with a word from the bank.","answer":{"template":"Set ___ to no globally, grant forwarding only to the ___ group with restricted keys, and enforce ___ timeouts so forgotten sessions die.","blanks":["ForwardAgent","release","session"],"bank":["ForwardAgent","PermitRootLogin","release","wheel","session","firewall"]},"hint":"The parameter is a two-word CamelCase directive; the group is not wheel.","explanation":["**ForwardAgent** is the directive that creates the forwarded socket on the jump host; setting it no globally is the M1042-style feature decision that removes the class of access.","The scoped override belongs to the **release** runners — the group with a documented need — not to wheel, which would widen the exception to every administrator.","**Session** timeouts (ClientAliveInterval with a low count) expire forgotten sessions, shrinking the live window every hijack in this case depended on. PermitRootLogin and firewalls address different problems and would make the CAB sentence wrong."],"study":"Practise writing CAB sentences that name parameters instead of intentions."},{"id":"e12","type":"qcm-multi","scenario":{"text":["19:40. The steering group approves the rotation runbook for the confirmed hijack window.","The room must agree on what actually closes the stolen-signing capability and what merely looks decisive.","The agent held d.okafor's ed25519 key; it signed into three hosts during the window.","Nothing was written to disk, and no password was involved.","Finance wants 'everything rotated tonight'; engineering warns the estate-wide option breaks certificate pinning for two days.","The auditor wants the runbook to name why each action is in or out.","Pick the actions that belong in the runbook.","The window closed at 04:05 on night one."]},"question":"Select every action that belongs in the rotation runbook.","answer":{"options":["Rotate the keys the agent signed with during the window","Audit authorized_keys on every host the agent could reach","Reset d.okafor's password only, since that is her credential","Remove keys from running agents and revoke forwarded sessions at session end estate-wide","Rotate the SSH host keys of mer-bastion-02"],"correct":[0,1,3]},"hint":"Close what the attacker actually used; host keys and passwords were never the mechanism.","explanation":["Rotating the signed keys closes the stolen signing capability, and the authorized_keys audit catches persistence planted while the window was open — both target what the technique actually did.","Clearing agents and revoking forwarded sessions estate-wide is the policy change that stops the same inheritance tomorrow; it costs forwarding workflows until overrides exist, which the CISO accepted.","A password reset is cosmetic here: no password was used. Rotating the bastion's host keys addresses server identity, which the hijack never touched — decisive-looking, but off-target."],"study":"Practise scoping credential rotation to the capability that was actually stolen."},{"id":"e13","type":"qcm-multi","scenario":{"text":["20:20. After the rotation approval, the SOC asks for the watch tuning so MH-8807-class alerts survive the noise.","Current state: 1,900 hits in four days, two true positives, everything else documented habit.","Meridian's documented habits: tmux pairing, the CHG-2214 runner window, the nightly root environ read.","Week one proved the true positives shared two properties: uid mismatch and ancestry off the documented paths.","The lead forbids any change that would have hidden week one.","Proposals are on the table; some reduce noise correctly, some blind the watch.","Choose the ones the lead signs.","The decision memo cites each acceptance and rejection."]},"question":"Select every proposal the lead should sign.","answer":{"options":["Suppress all agent-socket events originating from root accounts","Join auditd hits to change records and demote in-window documented jobs","Require EDR ancestry corroboration before a page goes out","Drop events where the accessor is a common shell binary","Scope a tmux allow-list to same-uid access only"],"correct":[1,2,4]},"hint":"Week one's attacker looked like an ordinary shell holding someone else's socket.","explanation":["Change-record joins and mandatory ancestry corroboration add context without losing coverage: documented jobs in their windows get demoted, but a cross-uid accessor with undocumented ancestry still pages — week one fires either way.","The tmux allow-list only works scoped to same-uid access, because peer sharing never crosses the ownership boundary the watch exists for.","Suppressing root is the dangerous proposal: root reads of agent sockets are rare and high-value, and the nightly environ job is exactly where an intruder hides. Binary-name dropping fails the same way renaming defeats it — week one's attacker would have sailed through."],"study":"Practise tuning alerts by enrichment rather than suppression."},{"id":"e14","type":"qcm-single","scenario":{"text":["21:05. One new event, one decision, and the room is tired.","Mer-lab-07 shows a single agent-socket read by an accessor whose uid matches no employee and no service account.","No sign-in followed. No second read. The accessor process is still alive.","The CISO, on her way out, says: 'Pull the plug on all bastion sessions now — I want zero risk tonight.'","Grand rounds finished an hour ago, so clinical pressure is low but not zero; PACS viewers still read from the validation set on mer-lab-07.","Legal hold is active on mer-lab-07.","The task force has 30 minutes of capture work queued that needs the live state.","A mass kill would end the capture plan and the accessor with it.","Ignoring the event is not on the menu either: the uid matches nothing documented.","The post-incident review will read whatever you choose."],"artefacts":[{"label":"Live event — mer-lab-07 21:04","code":"auditd AGENT_SOCK: connect /tmp/ssh-Ab03Td/agent.30122 pid=4213 uid=1102 auid=unset comm=sh\nno subsequent sign request\nEDR: no ancestry match to employee or service accounts"},{"label":"Capture plan (queued)","text":"30 min: /proc snapshot of pid 4213, socket state, memory-resident key handles via EDR, then targeted revoke."}]},"question":"Which response survives the post-incident review?","answer":{"options":["Mass-kill every bastion session immediately — zero risk tonight","Hold the mass kill; run the 30-minute capture on pid 4213, then decide per host with the CISO's office","Ignore the event; the lab is low value and the uid is probably a service","Reboot mer-lab-07 and reopen the ticket if it recurs"],"correct":1},"hint":"Zero risk tonight is one option; zero evidence tomorrow is another.","explanation":["The capture-then-decide line is the defensible one: it keeps the legal hold intact, takes the 30 minutes the evidence needs, and returns the go/no-go to the CISO's office with facts — the 'do nothing drastic yet' answer is itself a decision, made on purpose.","The mass kill delivers the CISO's sentence tonight and destroys the only live evidence of an accessor nobody can name; the reboot does the same damage with extra downtime for PACS viewers.","Ignoring fails too: a uid that matches no employee and no service account is precisely what the watch exists to catch. Least aggressive does not mean inactive — it means capture, then act per host."],"study":"Practise defending 'hold and capture' decisions in post-incident reviews."},{"id":"e15","type":"terminal","scenario":{"text":["21:40. The accessor pid 4213 on mer-lab-07 is confirmed hostile and still running.","The steering group needs the SSH_AUTH_SOCK value it is using, captured into the case log before any containment.","Legal hold: the process must keep running until capture completes; stopping, crashing or disrupting it loses evidence and breaches the hold.","You are in a responder shell on mer-lab-07 with standard tools; the environment is live.","The value lives in the process environment, NUL-separated.","This is the capture the whole case leans on; decide, then type.","The clock on this exercise is intentionally short.","One read is enough — choose it well."]},"question":"Type the single pipeline that prints the SSH_AUTH_SOCK value from the live process without stopping it.","answer":{"shellTitle":"responder@mer-lab-07 — simulated bash","prompt":"responder@mer-lab-07:~$","shellIntro":["Simulated shell. Type the command and press Enter. Nothing is executed for real.","Evidence rule: pid 4213 must stay alive and untouched.","This exercise runs on its own 90-second clock once it starts."],"perExerciseTimeLimit":90,"elements":[{"desc":"reads the live environment of the running process via cat /proc/4213/environ","pattern":"cat\\s+\\/proc\\/4213\\/environ"},{"desc":"converts NUL-separated entries into lines using tr with \\0","pattern":"\\btr\\b[^|]*\\\\0"},{"desc":"keeps only the SSH_AUTH_SOCK line using grep","pattern":"grep\\b.*ssh_auth_sock"}],"wrongPatterns":[{"desc":"kill stops the process: its environment, sockets and memory context die with it — evidence gone and the legal hold breached","pattern":"\\bkill\\b"},{"desc":"rm on the socket or its directory destroys a live artefact under legal hold","pattern":"\\brm\\b"},{"desc":"gcore/gdb dumps are heavier than needed: they pause or can destabilise the target, while a plain /proc read answers the question without touching it","pattern":"\\bgcore\\b|\\bgdb\\b"}],"canonical":"cat /proc/4213/environ | tr '\\0' '\\n' | grep -a SSH_AUTH_SOCK","canonicalParts":["cat /proc/4213/environ — reads the live environment of the running suspect; no state change","tr '\\0' '\\n' — turns NUL-separated entries into one per line","grep -a SSH_AUTH_SOCK — keeps only the agent-socket line; -a treats the binary-ish stream as text"],"expectedOutput":["SSH_AUTH_SOCK=/tmp/ssh-Ab03Td/agent.30122"]},"hint":"The kernel exposes the environment read-only; one pipe answers it.","explanation":["The canonical pipeline reads the environment straight from /proc while the process keeps running: cat opens the environ file, tr converts the NUL separators into lines, and grep -a keeps the single SSH_AUTH_SOCK entry. Nothing about the process changes.","Every destructive near-miss costs the case: `kill -9 4213` deletes the environment and the socket context with the process and breaches the hold; `rm` on the socket removes the artefact the whole chain points to; gcore would pause or can crash the target for data a one-line read already answers.","This command shows up again and again in agent-hijack cases because the socket path only exists in live memory — capture it once, correctly, and the rest of the response can afford to be careful."],"study":"Practise read-only /proc capture on a lab process you own."}]};

function prepareExercise(ex){

      else{
        var w=a._words[f];
        if(w.slot===i){H6++;items6.push({status:'correct',text:'Blank '+(i+1)+': "'+b+'"'});}
        else{W6++;items6.push({status:'wrong',text:'Blank '+(i+1)+': you used "'+w.t+'", correct word: "'+b+'"'});}
      }
    });
    r={H:H6,W:W6,N:a.blanks.length,items:items6};
  }else if(ex.type==='terminal'){
    var norm=normalizeCmd(ex._cmd);
    var H7=0,W7=0,items7=[],danger=false;
    a.elements.forEach(function(el){
      var ok=new RegExp(el.pattern,'i').test(norm);
      if(ok){H7++;items7.push({status:'correct',text:el.desc});}
      else{items7.push({status:'missed',text:el.desc});}
    });
    (a.wrongPatterns||[]).forEach(function(wp){
      if(new RegExp(wp.pattern,'i').test(norm)){W7++;danger=true;items7.push({status:'wrong',text:wp.desc});}
    });
    if(!norm){W7++;items7.push({status:'wrong',text:'No command was entered.'});}
    r={H:H7,W:W7,N:a.elements.length,items:items7,terminal:true,danger:danger};
  }else if(ex.type==='branching'){
    var H8=0,W8=0,items8=[];
    ex.steps.forEach(function(st,i){
      var ok=(st._choice===st._corr);
      if(ok)H8++;else W8++;
      items8.push({status:ok?'correct':'wrong',text:'Step '+(i+1)+' — '+st.options[st.correct]});
    });
    r={H:H8,W:W8,N:ex.steps.length,items:items8,branching:true};
  }else{r={H:0,W:0,N:1,items:[]};}
  var credit=scoreExercise(r.H,r.W,r.N);
  if(hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  r.credit=credit;
  return r;
}
function normalizeCmd(c){
  return String(c||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/;$/,'').replace(/\/$/,'');
}

function scenarioBlock(ex){
  var sc=ex.scenario||{};

  (sc.artefacts||[]).forEach(function(art,i){

function questionBlock(ex){

  }

function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}

      var d=document.createElement('div');d.className='term-line '+(cls||'');d.innerHTML=hl(txt);sc.appendChild(d);sc.scrollTop=sc.scrollHeight;
    }
    (a.shellIntro||[]).forEach(function(l){line(l);});
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){
        var c=inp.value;inp.value='';ex._cmd=c;
        line((a.prompt||'analyst@lab:~$')+' '+c,'');
        if(!c.trim())return;
        (a.expectedOutput&&a.expectedOutput.length?a.expectedOutput:['(simulated) command accepted — output suppressed until you press Check.']).forEach(function(l){line(l);});
      }
    });
    if(a.perExerciseTimeLimit){timer.perLimit=a.perExerciseTimeLimit;timer.perRemain=a.perExerciseTimeLimit;}
    else{timer.perLimit=0;timer.perRemain=0;}
  },
  lock:function(ex,root){var i=$('tin-'+ex.id);if(i)i.disabled=true;timer.perLimit=0;}
};
function perExExpired(){
  var ex=exam.list[exam.current];
  if(!ex||ex.result)return;
  var inp=$('tin-'+ex.id);if(inp)inp.disabled=true;
  doCheck(true);
}

WIDGETS['branching']={
  render:function(ex){
    return ansBox(ex,'<div id="br-'+ex.id+'"></div>');
  },
  bind:function(ex,root){
    renderBranchStep(ex,root);
  },
  lock:function(ex,root){root.querySelectorAll('#br-'+ex.id+' button, #br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});}
};
function renderBranchStep(ex,root){
  var a=ex.steps[ex._step];
  var holder=$('br-'+ex.id);
  var h='';
  h+='<div class="opts">';
  a._disp.forEach(function(o,i){
    h+='<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+md(o.text)+'</span><span class="sel-mark"></span></button>';
  });
  h+='</div><div id="br-verdict-'+ex.id+'"></div><div class="step-actions">';
  h+='<button type="button" class="btn btn-amber" id="br-check-'+ex.id+'">'+(ex._step===ex.steps.length-1?'Check — final':'Check step')+'</button>';
  h+='<button type="button" class="btn hidden" id="br-cont-'+ex.id+'">Continue &#8594;</button></div>';
  holder.innerHTML=h;
  holder.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(a._done)return;
      ex.steps[ex._step]._choice=parseInt(btn.getAttribute('data-i'),10);
      holder.querySelectorAll('.opt').forEach(function(b2){b2.classList.remove('selected');b2.setAttribute('aria-pressed','false');b2.querySelector('.sel-mark').textContent='';});
      btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';
    });
  });
  $('br-check-'+ex.id).addEventListener('click',function(){
    if(ex.steps[ex._step]._choice===null)return;
    checkBranchStep(ex,root);
  });
  $('br-cont-'+ex.id).addEventListener('click',function(){
    ex._step++;
    var qb=$('q-block-'+ex.id);
    if(qb)qb.outerHTML=questionBlock(ex).replace('<section class="block bl-question"','<section id="q-block-'+ex.id+'" class="block bl-question"');
    renderBranchStep(ex,root);
    window.scrollTo({top:0,behavior:scrollBehavior()});
  });
}
function checkBranchStep(ex,root){
  var st=ex.steps[ex._step];
  st._done=true;
  var ok=(st._choice===st._corr);
  var v=$('br-verdict-'+ex.id);
  v.innerHTML='<div class="step-verdict" style="border-color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'"><span style="font-weight:800;color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'">'+(ok?'&#10004; Correct':'&#10007; Incorrect')+'</span><span class="muted small">'+md(st.options[st.correct])+'</span></div>';
  $('br-check-'+ex.id).disabled=true;
  root.querySelectorAll('#br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});
  if(ex._step<ex.steps.length-1){
    $('br-cont-'+ex.id).classList.remove('hidden');
  }else{
    doCheck(false);
  }
}

function startExam(){
  exam.attempt++;

  hintUsed={};reported=false;
  timer.state='IDLE';timer.remain=budget;timer.manualSec=0;timer.autoSec=0;timer.perLimit=0;timer.perRemain=0;pauseEnteredAt=0;

}
function renderExamShell(){

        '<button type="button" class="btn btn-slim" id="btn-pause">&#9208; Pause</button>'+
