<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
  /* derived tints & constants — every rule below consumes variables only */
  --surface-hover:#182238;
  --topbar-bg:rgba(18,26,46,.97);
  --overlay:rgba(11,16,32,.96);
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --shadow-lg:0 8px 22px rgba(0,0,0,.45);
  --sheen:rgba(230,236,255,.35);
  --tint-blue:rgba(90,169,255,.10);
  --tint-blue-strong:rgba(90,169,255,.25);
  --tint-blue-weak:rgba(90,169,255,.12);
  --tint-blue-faint:rgba(90,169,255,.06);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);
  --tint-orange-badge:rgba(255,138,61,.12);
  --tint-red:rgba(255,107,107,.08);
  --tint-red-faint:rgba(255,107,107,.07);
  --tint-red-badge:rgba(255,107,107,.12);
  --tint-red-hero:rgba(255,107,107,.12);
  --tint-purple:rgba(157,123,255,.07);
  --ring-green:0 0 0 2px rgba(87,211,140,.35);
  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;
  --tok-num:#7fd8ff;
  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}
.intro-hero .objline{color:var(--text-secondary);font-size:15px;margin:2px 0}
.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.themebox h4{margin:0 0 8px 0;color:var(--accent-blue);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.themebox ul{margin:0;padding-left:18px;color:var(--text-primary);font-size:14.5px}
.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}
.rulelist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);color:var(--text-primary);font-size:15px;align-items:flex-start}
.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

/* ---------- review & results ---------- */
.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.resultgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1600.001","name":"Weaken Encryption: Reduce Key Space","type":"Sub-Technique","parent":"T1600","tactic":"Defense Impairment (TA0112)","platforms":"Network Devices"},"learn":["This object is a sub-technique. In the MITRE ATT&CK framework, a sub-technique describes one specific way that an attacker can carry out a broader technique. This one belongs to the parent technique T1600, Weaken Encryption. Its job is simple to say: the attacker makes the encryption on a compromised network device weaker, so that cracking the traffic later becomes much cheaper.","Imagine you are a network security engineer at a rail company. Your VPN gateway encrypts traffic with strong, long keys. An attacker who has stolen a management password logs in and changes the key size from thousands of bytes down to a couple of bytes, or swaps a modern cipher for an old, weak one. The device still 'works', so nobody notices — but the attacker can now decrypt everything they capture. That is exactly what T1600.001 describes.","You will meet this object in real work as a SOC analyst (strange crypto config alerts), as a detection engineer (building analytics like ATT&CK detection strategy DET0243 and its analytic AN0681), as an incident responder (deciding how to contain a gateway without destroying evidence), and as a GRC or control owner (writing crypto policy, change control, and backup rules). Tools you will touch: device CLI, configuration archives, firmware records, and traffic analysers that show which ciphers are actually negotiated.","The ATT&CK page for T1600.001 notes that it cannot be easily mitigated with preventive controls, because the attacker abuses normal device features. So defenders lean on configuration change logs, firmware integrity, restricted management access, and traffic analysis. The risks it addresses are unauthorized disclosure of sensitive traffic and follow-on attacks like credential theft. ATT&CK places it in the Defense Impairment tactic (TA0112), on the Network Devices platform. The page references documented attacks on Cisco IOS devices and on legacy devices — old gear with weak defaults is a favourite target."],"kw":["crypto","isakmp","ipsec","transform-set","aes","3des","sha","md5","rsa","tunnel","esp","pre-share","show","write","reload","erase","copy","verify","archive","interface","access-list","permit","deny"],"themes":[{"name":"Adversary behaviour & TTPs","concepts":["reduce cipher strength on a compromised device","shrink the key size the device uses","downgrade to legacy ciphers","pre-position for decrypting captured traffic","modify key size via Network Device CLI (T1059.008)"]},{"name":"Tactics & lifecycle position","concepts":["Defense Impairment (TA0112)","parent technique T1600 Weaken Encryption","sibling T1600.002 Disable Crypto Hardware"]},{"name":"Key space & cipher fundamentals","concepts":["key space","key length in bits and bytes","brute-force cost","legacy vs strong ciphers (3DES vs AES-256)","cipher suites"]},{"name":"Network device CLI & configuration","concepts":["crypto config commands","configuration change logs"]},{"name":"Data sources & telemetry","concepts":["device configuration logs","CLI command logs","firmware change records","traffic analysis of negotiated ciphers"]},{"name":"Mitigations & control limits","concepts":["config integrity monitoring"]}],"exercises":[{"id":"T1600-001-E01","type":"mcq","title":"What 'reduce key space' means","summary":"Definition check — what the attacker actually changes on the device.","concepts":["key space","shrink the key size the device uses","reduce cipher strength on a compromised device"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1600.001)","kind":"text","text":"Adversaries may reduce the level of effort required to decrypt data transmitted over the network by reducing the cipher strength of encrypted communications. They can weaken the encryption software on a compromised network device by reducing the key size used to convert plaintext to ciphertext."}],"question":"According to this excerpt, what does the attacker reduce?","options":[{"t":"The size of the encryption key the device uses","correct":true,"why":"Correct — the technique is literally 'Reduce Key Space': a smaller key makes decryption without the key much cheaper."},{"t":"The number of users allowed on the device","correct":false,"why":"User limits are account management, not encryption. T1600.001 is about cipher strength."},{"t":"The storage space used by device logs","correct":false,"why":"Log storage is unrelated. The technique changes crypto parameters, not disk usage."},{"t":"The speed of the device CPU","correct":false,"why":"CPU tuning is not part of this technique. Only the key size (cipher strength) is changed."}],"hint":"This is about the set of possible keys — a smaller key space makes brute-force decryption cheaper.","explain":"T1600.001 means the attacker shrinks the encryption key size on the device. A shorter key means fewer possible keys to try, so the attacker can decrypt captured traffic with much less effort.","study":"Read the T1600.001 description again and focus on the words 'key size' and 'level of effort'."},{"id":"T1600-001-E02","type":"logview","title":"Spot the weakened cipher","summary":"One config line downgraded the VPN cipher — find it.","concepts":["downgrade to legacy ciphers","legacy vs strong ciphers (3DES vs AES-256)"],"perspective":"defender","tags":[],"logTitle":"edge-rtr-01 running-config (VPN section)","filterPlaceholder":"filter config lines...","log":["hostname edge-rtr-01","banner motd # Authorised access only #","crypto isakmp policy 10"," encryption aes 256"," hash sha"," authentication pre-share"," group 14","crypto isakmp policy 20"," encryption 3des"," hash md5"," authentication pre-share"," group 2","line vty 0 4"," transport input ssh"],"options":[{"t":"Policy 20 uses 3DES with group 2 — a legacy, weak setup","correct":true,"why":"Correct — 3DES with DH group 2 is a legacy, small-key configuration next to the strong AES-256 policy."},{"t":"Policy 10 uses AES 256 — this is the weak one","correct":false,"why":"AES-256 is a strong modern cipher. It is the good example here, not the problem."},{"t":"The banner motd line weakens encryption","correct":false,"why":"A banner is just text users see. It has no effect on encryption."},{"t":"transport input ssh weakens encryption","correct":false,"why":"Restricting VTY to SSH is a hardening step, not a crypto downgrade."}],"question":"Look at the VPN policies and pick the line that shows weakened encryption.","hint":"This is about comparing an old, weak cipher family with a modern strong one.","explain":"3DES with group 2 is a legacy configuration with a small effective key space. AES-256 with group 14 is strong. A device offering policy 20 can be pushed into the weak choice, which is what T1600.001 looks like in a config.","study":"Compare AES-256 and 3DES: key size, age, and why old ciphers are easier to break.","scenario":[{"label":"ARTEFACT 1 — edge-rtr-01 running-config (VPN section)","kind":"text","text":"You are reviewing this export in the SOC log viewer. One config line downgraded the VPN cipher — find it. Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-E03","type":"match","title":"Match crypto terms to meaning","summary":"Three config tokens and what each one means for strength.","concepts":["key length in bits and bytes","legacy vs strong ciphers (3DES vs AES-256)","cipher suites"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Cipher cheat-sheet excerpt","kind":"text","text":"Devices list cipher choices by name and by key length. Longer keys make brute-force attacks (trying every key) much more expensive."}],"question":"Match each item to what it means for encryption strength.","left":[{"t":"AES-256","match":0,"why":"AES-256 with its 256-bit key is a strong modern choice."},{"t":"3DES","match":2,"why":"3DES is an old cipher with a small effective key space — legacy."},{"t":"512-bit RSA key","match":1,"why":"A 512-bit key is so short that it can be factored cheaply — weak."}],"right":[{"t":"A strong modern cipher choice","why":"AES-256 is recommended for data in transit; 512-bit RSA is not."},{"t":"A key so short it is easy to crack","why":"512-bit RSA is breakable with modest resources today."},{"t":"A legacy cipher with a small effective key space","why":"3DES dates from the 1990s and offers a small effective key size."}],"hint":"Two of these are about cipher families (new vs old); one is a key length that is far too small.","explain":"AES-256 is strong. 3DES is legacy with a small effective key space. A 512-bit RSA key is short enough to crack. Knowing which is which is the base for spotting T1600.001 changes.","study":"Key-length guidance: which key sizes NIST considers acceptable for RSA and for AES."},{"id":"T1600-001-E04","type":"mcq","title":"Why the attacker wants a smaller key space","summary":"The attacker's benefit — the reason this technique exists.","concepts":["pre-position for decrypting captured traffic","brute-force cost"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Red-team note","kind":"text","text":"An attacker already controls one management session on the VPN gateway. They record (capture) the site-to-site VPN traffic passing through it. They plan to read that traffic later."}],"question":"What does reducing the key size let the attacker do?","options":[{"t":"Decrypt the captured traffic later with far less effort","correct":true,"why":"Correct — a small key space makes offline decryption cheap, so captured data becomes readable."},{"t":"Stop the device from forwarding any traffic","correct":false,"why":"Stopping traffic is disruptive and loud; T1600.001 keeps the device working so nobody notices."},{"t":"Delete the device configuration completely","correct":false,"why":"Erasing config would cause an outage and is not the goal of this technique."},{"t":"Change the device banner to warn users","correct":false,"why":"A banner change is cosmetic and would only draw attention."}],"hint":"The technique is about the effort needed to decrypt data without the key.","explain":"The attacker's goal is cheap decryption later. Shrinking the key space keeps the tunnel working while making the maths of cracking it easy. The parent technique T1600 warns this can enable Credential Access and Collection afterwards.","study":"The T1600 parent description: why weakened encryption helps credential theft."},{"id":"T1600-001-E05","type":"dnd","title":"Sort the config lines","summary":"Strong, weak, or not an encryption setting at all.","concepts":["legacy vs strong ciphers (3DES vs AES-256)","crypto config commands"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Lines seen on vpn-hub-02","kind":"code","text":"encryption aes 256\nencryption 3des\nbanner motd # Maintenance tonight #"}],"question":"Drag each line to the box that describes it.","zones":[{"name":"Strong encryption","accepts":[0],"why":"AES-256 is the strong modern choice — keep it."},{"name":"Legacy / weakened encryption","accepts":[1],"why":"3DES is the legacy weak cipher — a T1600.001 downgrade sign."},{"name":"Not an encryption setting","accepts":[2],"why":"A banner is display text only; it does not touch crypto."}],"bank":[{"t":"encryption aes 256","whyMiss":"AES 256 is the strong cipher — it belongs in 'Strong encryption'."},{"t":"encryption 3des","whyMiss":"3DES is the legacy cipher — it belongs in 'Legacy / weakened encryption'."},{"t":"banner motd # Maintenance tonight #","whyMiss":"A banner is cosmetic text, not crypto — 'Not an encryption setting'."}],"hint":"One line is strong, one is an old weak cipher, and one is just on-screen text.","explain":"Sorting config lines this way is the first SOC triage step for crypto changes: strong, weak, or unrelated. 3DES is the classic downgrade marker for T1600.001.","study":"Cipher families used on routers: AES vs 3DES, and which config commands set them."},{"id":"T1600-001-E06","type":"order","title":"Order the attacker's steps","summary":"Four steps from access to reading captured traffic.","concepts":["modify key size via Network Device CLI (T1059.008)","pre-position for decrypting captured traffic"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attack notebook (found later)","kind":"text","text":"Steps written by the attacker, in the wrong order, for weakening the VPN gateway."}],"question":"Put the attacker's four steps in the order they happened.","sequence":["Get a management password for the gateway","Open the device CLI (command line)","Change the crypto policy to a small key size","Capture traffic and decrypt it offline later"],"orderWhy":["The attacker needs credentials before anything else — no access, no change.","The Network Device CLI (T1059.008) is how the crypto parameters are reached.","Reducing the key size is the T1600.001 change itself.","The payoff: captured traffic becomes readable offline because the key space is tiny."],"hint":"Start with what the attacker must have first (access), and end with the payoff (reading data).","explain":"The chain is: access, then CLI, then the crypto change, then offline decryption. Each step depends on the one before, which is why stolen management credentials are so dangerous here.","study":"How Modify System Image (T1601) and the Network Device CLI relate to T1600.001."},{"id":"T1600-001-E07","type":"mcq","title":"Which platform?","summary":"ATT&CK lists one platform for T1600.001.","concepts":["Defense Impairment (TA0112)","ATT&CK: platform Network Devices"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK page header (T1600.001)","kind":"text","text":"ID: T1600.001 · Sub-technique of: T1600 · Tactic: Defense Impairment (TA0112) · Platforms: Network Devices · Version 2.0"}],"question":"Look at the header — which platform does ATT&CK list for T1600.001?","options":[{"t":"Network Devices","correct":true,"why":"Correct — the technique is defined on network devices like routers and VPN gateways."},{"t":"Windows workstations","correct":false,"why":"Windows endpoints are a different platform; this technique lives on network gear."},{"t":"Cloud containers","correct":false,"why":"Containers are not the platform for this sub-technique."},{"t":"Mobile phones","correct":false,"why":"Mobile is a separate ATT&CK matrix and not listed here."}],"hint":"This is about the kind of machine whose encryption gets weakened — the box that forwards the traffic.","explain":"T1600.001 applies to Network Devices: routers, switches, VPN gateways. Knowing the platform tells you which logs to collect — device config and CLI logs, not workstation telemetry.","study":"The ATT&CK page header for T1600.001: platform and tactic fields."},{"id":"T1600-001-E08","type":"fib","title":"Complete the policy sentence","summary":"Two words finish the crypto policy line.","concepts":["key space","brute-force cost"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Draft crypto policy","kind":"text","text":"Policy draft: 'The key space is the set of all {b0} a device could possibly use. If an attacker shrinks that set, a brute-force attack (trying keys one by one) becomes much {b1}.'"}],"question":"Fill the two blanks with the words that complete the policy correctly.","template":"The key space is the set of all {b0} a device could use. Shrinking it makes a brute-force attack much {b1}.","blanks":[{"accept":["keys"],"why":"The key space is the set of all possible keys — that is the definition.","whyMiss":"'Passwords' is close but the crypto term for the whole set is 'keys'."},{"accept":["easier","cheaper"],"why":"A smaller key space means fewer keys to try, so brute force gets easier/cheaper.","whyMiss":"The attack gets easier, not harder — that is exactly the attacker's goal in T1600.001."}],"hint":"First blank: the crypto word for the secret that unlocks ciphertext. Second blank: the effect on the attack.","explain":"Key space = all possible keys. Reduce it and brute force gets easier — that one sentence is the heart of T1600.001.","study":"The definition of key space and why its size sets the cost of brute-force attacks."},{"id":"T1600-001-E09","type":"mcq","title":"Name the sibling technique","summary":"T1600 has exactly two sub-techniques — name the other one.","concepts":["sibling T1600.002 Disable Crypto Hardware","parent technique T1600 Weaken Encryption"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK family tree","kind":"text","text":"T1600 Weaken Encryption has two sub-techniques: T1600.001 Reduce Key Space and one more, which attacks the hardware that accelerates crypto instead of the key size."}],"question":"Which ID and name is the sibling sub-technique?","options":[{"t":"T1600.002 — Disable Crypto Hardware","correct":true,"why":"Correct — the sibling turns off crypto accelerators instead of shrinking keys."},{"t":"T1601 — Modify System Image","correct":false,"why":"T1601 is a separate technique the attacker may pair with, not a sibling of T1600.001."},{"t":"T1059.008 — Command and Scripting Interpreter: Network Device CLI","correct":false,"why":"That is the CLI technique used to make the change — related, but not the sibling."},{"t":"T1600.003 — Remove Certificates","correct":false,"why":"No such sub-technique exists under T1600; the family has exactly two children."}],"hint":"This is about the other way to weaken a device: its crypto hardware.","explain":"T1600 has two sub-techniques: .001 Reduce Key Space (this exam) and .002 Disable Crypto Hardware. Knowing the family helps you classify alerts precisely instead of lumping all crypto tampering together.","study":"The ATT&CK page table listing the sub-techniques of T1600."},{"id":"T1600-001-E10","type":"logview","title":"Find the crypto CLI command","summary":"A CLI session log — which command touched encryption?","concepts":["crypto config commands","CLI command logs"],"perspective":"defender","tags":[],"logTitle":"edge-rtr-01 CLI command log (session 88)","filterPlaceholder":"filter commands...","log":["19:02:11 admin vty0 10[.]20[.]5[.]7  show ip interface brief","19:03:40 admin vty0 10[.]20[.]5[.]7  show version","19:07:02 admin vty0 10[.]20[.]5[.]7  configure terminal","19:07:55 admin vty0 10[.]20[.]5[.]7  crypto isakmp policy 10","19:07:56 admin vty0 10[.]20[.]5[.]7  encryption aes 256","19:08:30 admin vty0 10[.]20[.]5[.]7  end","19:08:44 admin vty0 10[.]20[.]5[.]7  write memory"],"options":[{"t":"crypto isakmp policy 10 / encryption aes 256","correct":true,"why":"Correct — entering an ISAKMP policy and setting its encryption is the crypto change in this session."},{"t":"show version","correct":false,"why":"show version only displays software info; it changes nothing."},{"t":"show ip interface brief","correct":false,"why":"That is a read-only interface listing, not a crypto command."},{"t":"write memory","correct":false,"why":"write memory saves the config; the crypto change happened just before it."}],"question":"Look at the session log and pick the command pair that changes encryption settings.","hint":"This is about the config keyword family that starts with the word used for cryptography.","explain":"CLI command logs are a key data source for T1600.001. Lines starting with 'crypto' are the ones that alter encryption behaviour; 'show' lines are read-only and 'write memory' just saves.","study":"Router CLI syntax: which commands display information vs change crypto configuration.","scenario":[{"label":"ARTEFACT 1 — edge-rtr-01 CLI command log (session 88)","kind":"text","text":"You are reviewing this export in the SOC log viewer. A CLI session log — which command touched encryption? Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-E11","type":"mcq","title":"Where would you see the change?","summary":"Pick the data source that records the crypto change.","concepts":["device configuration logs","configuration change logs"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — SOC question of the day","kind":"text","text":"Someone reduced the key size on a VPN gateway last night. The SOC wants to prove which change was made, on which device, and when."}],"question":"Which data source answers that question most directly?","options":[{"t":"The device configuration change log","correct":true,"why":"Correct — config change logs record what changed, where, and when — the core evidence for T1600.001."},{"t":"The building entry badge log","correct":false,"why":"Physical access logs cannot show a config change made over the network."},{"t":"The marketing CRM database","correct":false,"why":"CRM data has nothing to do with device crypto settings."},{"t":"The email spam filter quarantine list","correct":false,"why":"Mail filtering is unrelated to network device configuration."}],"hint":"This is about the log that captures what the device's own settings looked like over time.","explain":"Configuration change logs are the primary data source for T1600.001. Correlating them with traffic analysis (seeing weak ciphers actually negotiated) raises confidence, as analytic AN0681 describes.","study":"Data sources for network device techniques: config logs, CLI logs, firmware records, traffic analysis."},{"id":"T1600-001-E12","type":"terminal","title":"Run the guided device check","summary":"Type the exact guided command to list the VPN transform sets.","concepts":["crypto config commands","CLI command logs"],"perspective":"defender","tags":[],"skill":"guided-read-command","scenario":[{"label":"ARTEFACT 1 — Ticket NET-7412 (summary)","kind":"text","text":"Ticket: a routine audit asks you to confirm which encryption transform sets edge-rtr-01 offers. You have an SSH session open on the device with read privileges."}],"question":"Using the syntax panel below, type the command that lists the IPsec transform sets.","cmd":{"prompt":"edge-rtr-01#","canonical":"show crypto ipsec transform-set","nearMiss":"configure terminal","syntaxPanel":"show crypto ipsec transform-set\n\n  show        — displays information (changes nothing)\n  crypto      — the cryptography command family\n  ipsec       — the VPN protocol family to inspect\n  transform-set — the named sets of encryption algorithms","outputs":[{"re":"show crypto ipsec transform-?set","lines":["Transform set VPN-STRONG: { aes 256  sha  }","Transform set VPN-LEGACY: { 3des  md5  }","2 transform sets found."]}],"unknown":"% Invalid input detected. Use the syntax panel above and try again.","elements":[{"re":"\\bshow\\b","label":"Uses 'show' (read-only display)","why":"'show' displays state without changing the device — the safe verb for audits."},{"re":"\\bcrypto\\b","label":"Targets the crypto family","why":"Crypto settings live under the 'crypto' command family."},{"re":"ipsec","label":"Scope: ipsec","why":"The VPN transform sets are IPsec objects."},{"re":"transform-?set","label":"Scope: transform-set","why":"Transform sets hold the negotiated encryption algorithms."}],"forbidden":[{"re":"\\b(no |erase|write erase|reload|conf t|configure terminal)","label":"a configuration-changing command","why":"The audit is read-only — 'configure terminal', 'no', 'erase' or 'reload' would change the device."}]},"hint":"This is about the read-only command family that displays cryptography settings.","explain":"'show crypto ipsec transform-set' lists the device's VPN algorithm sets without changing anything. Read-only 'show' commands are the safe first step when auditing for T1600.001.","study":"Router 'show crypto' commands and why auditors prefer read-only commands first."},{"id":"T1600-001-E13","type":"order","title":"Order the SOC response","summary":"Three simple defender steps after the downgrade alert.","concepts":["device configuration logs","config integrity monitoring"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — SOC alert (summary card)","kind":"text","text":"Alert: crypto policy changed on vpn-hub-02. The on-shift analyst must check it in the right order."}],"question":"Put the analyst's three steps in the correct order.","sequence":["Open the config change log entry for the alert","Compare the new config with the last backup","Escalate to the network team if the key size shrank"],"orderWhy":["The change log tells you when and by whom — start where the evidence is.","A diff against the backup shows exactly which crypto lines moved.","Only after confirming the downgrade do you escalate — in that order."],"hint":"This is about looking at the evidence first and escalating only after the check.","explain":"Good triage order: read the change log, diff against the last known-good backup, then escalate. Jumping straight to escalation without evidence wastes the network team's time.","study":"Configuration backup and diff workflows for network devices."},{"id":"T1600-001-E14","type":"fib","title":"Fill the ATT&CK family tree","summary":"Two IDs/names complete the sentence about this object.","concepts":["parent technique T1600 Weaken Encryption","Defense Impairment (TA0112)"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Flashcard","kind":"text","text":"Card front: 'T1600.001 Reduce Key Space is a sub-technique of {b0}. ATT&CK places it in the {b1} tactic.'"}],"question":"Fill in the two blanks on the flashcard.","template":"T1600.001 is a sub-technique of {b0}. ATT&CK lists its tactic as {b1}.","blanks":[{"accept":["t1600","t1600 weaken encryption"],"why":"T1600 Weaken Encryption is the parent technique.","whyMiss":"The parent is T1600; other IDs belong to different techniques."},{"accept":["defense impairment"],"why":"ATT&CK v20 lists the tactic as Defense Impairment (TA0112).","whyMiss":"Reconnaissance and Collection are other tactics; this technique sits in Defense Impairment."}],"hint":"First blank: the parent technique ID starting with T16. Second blank: the tactic whose name starts with 'Defense'.","explain":"T1600.001 sits under T1600 Weaken Encryption, in the Defense Impairment tactic (TA0112), on the Network Devices platform.","study":"The T1600.001 page header: parent, tactic, platform fields."},{"id":"T1600-001-E15","type":"match","title":"Match telemetry to what it shows","summary":"Three log types and the question each answers.","concepts":["device configuration logs","traffic analysis of negotiated ciphers","firmware change records"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — SOC data catalogue (extract)","kind":"text","text":"The SOC collects several network-device log types. Each answers a different question during a crypto investigation."}],"question":"Match each log type to the question it answers.","left":[{"t":"Configuration change log","match":0,"why":"Config logs answer 'what setting changed, when, by whom'."},{"t":"Traffic analysis of the tunnel","match":1,"why":"Traffic analysis answers 'which cipher strength is actually in use'."},{"t":"Firmware image record","match":2,"why":"Firmware records answer 'was the device image replaced'."}],"right":[{"t":"Which setting changed and when","why":"Configuration change logs capture setting diffs over time."},{"t":"Which cipher strength is actually being used","why":"Analysing negotiated ciphers shows the real-world effect of a change."},{"t":"Whether the device image was replaced","why":"Firmware records track image versions and checksums."}],"hint":"One log is about settings, one about live traffic, one about the device's software image.","explain":"Config logs show the change, traffic analysis shows its effect, firmware records show image tampering. Analytic AN0681 gets high confidence by correlating a config change with weaker ciphers in traffic.","study":"Detection strategy DET0243: which data sources it combines and why correlation matters."}],"severityWord":"EASY","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}

  var sh = $('shellin'); if(sh){ sh.disabled = true; }
  var tc = $('termcheck'); if(tc){ tc.disabled = true; }
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){
  var ico = state==='correct' ? '✓ Correct' : (state==='wrong' ? '✗ Wrong' : '○ Missed');
  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');
  return '<li><span class="fi-ico '+cls+'">'+ico+'</span><span><b>'+esc(label)+'</b>'+(note ? '<span class="fi-note">'+esc(note)+'</span>' : '')+'</span></li>';
}

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWER</span>'+esc(letterKey(dispKey(ex,ci))+'. '+ex.options[ci].t)+'</div>';

  } else if(ex.type === 'fib'){

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PLACEMENTS</span>'+dc+'</div>';

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT DISPOSITIONS</span>'+tc+'</div>';
  } else if(ex.type === 'multi' || (ex.type === 'logview' && ex.multi)){
    var oc2 = ex.options.map(function(o,i){ return o.correct ? esc(letterKey(dispKey(ex,i))+'. '+o.t) : null; }).filter(Boolean).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span>'+oc2+'</div>';
  } else if(ex.type === 'branch'){

    (ex._autoGrade ? '<p class="creditline">⏱ The terminal budget ran out, so your last command was graded as typed.</p>' : '') +

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, done);
  } else { done(); }
}

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
      (si2 === ex._step && ex._picks[si2] === undefined ? '<button class="btn ghost" style="margin-top:8px" onclick="branchConfirm('+si2+')">▸ Confirm step '+(si2+1)+' (does not stop the timer)</button>' : '')+
      '</div>';
  });
  if(ex._step >= ex.steps.length && !ex._checked){
    htmlp += '<div class="btnrow"><button class="btn green" onclick="gradeCurrent()">✓ Check — grade all '+ex.steps.length+' decisions</button></div>';
  }
  area.innerHTML = htmlp;
}
function branchPick(si2, oi){
  var ex = curEx();
  if(ex._checked || si2 !== ex._step){ return; }
  ex._pendingPick = oi;
  document.querySelectorAll('input[name="bstep'+si2+'"]').forEach(function(el){ var r = el.closest('.opt'); if(r){ r.classList.toggle('selected', el.checked); } });
}
function branchConfirm(si2){
  var ex = curEx();
  var picked = ex._pendingPick;
  if(picked === undefined || picked === null){ return; }
  ex._picks[si2] = picked;
  ex._pendingPick = null;
  ex._step = si2 + 1;
  renderBranchStep();
  updateCheckState();
}

/* ---------- flow: pause / skip / hint / next / review / results ---------- */
var flowLock = false;
function flowLockAcquire(){
  if(flowLock){ return false; }
  flowLock = true;
  return true;
}
function flowLockRelease(){ flowLock = false; }
function pauseManual(){
  if(!T || T.state === 'ENDED'){ return; }
  if(T.state === 'PAUSED_MANUAL'){ return; }
  T.prevState = T.state;
  setTState('PAUSED_MANUAL');
  var ov = document.createElement('div');
  ov.id = 'pauseoverlay';
  ov.innerHTML = '<div class="pausecard"><div class="pico">⏸</div><h2>PAUSED — manual</h2><p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p><button class="btn primary" id="btn-resume" onclick="resumeManual()">▶ Resume</button></div>';
  document.body.appendChild(ov);
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'hidden'; }
}
function resumeManual(){
  var ov = $('pauseoverlay'); if(ov){ ov.remove(); }
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'visible'; }
  setTState(T.prevState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function doHint(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(!ex || ex._hintUsed || ex._checked){ return; }
  ex._hintUsed = true;
  var hp = document.createElement('div');
  hp.className = 'hintpanel';
  hp.innerHTML = '<span class="hint-tag">💡 HINT (one per exercise — costs 10% of this exercise\u2019s credit)</span>' + esc(ex.hint);
  var blk = document.querySelector('.blk.answer .blk-body');
  if(blk){ blk.insertBefore(hp, blk.firstChild); }
  $('btn-hint').disabled = true;
}
function doSkip(){
  if(S.screen !== 'exam'){ return; }
  if(!flowLockAcquire()){ return; }
  var ex = curEx();
  if(!ex || ex._checked){ flowLockRelease(); return; }
  var idx = EXS.indexOf(ex);
  if(S.skipped.indexOf(idx) < 0){ S.skipped.push(idx); }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); openReview(); }
}
function goNext(){
  if(!flowLockAcquire()){ return; }
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  if(S.screen === 'open'){
    S.screen = 'review';
    openReview();
    return;
  }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); finishAttempt(false); }
}
function openReview(){
  flowLockRelease();
  S.screen = 'review';
  S.reviewing = null;
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  updateHeader();
  var items = S.skipped.map(function(idx, pos){
    var ex = EXS[idx];
    return '<li><span class="statechip st-skipped">⚠ Skipped</span><span class="rv-title">'+esc(ex.title)+'</span><button class="btn primary" onclick="openSkipped('+pos+')">↩ Open and answer</button></li>';
  }).join('');
  $('exarea').innerHTML =
    '<div class="card"><h2>⚠ Review skipped exercises ('+S.skipped.length+')</h2>'+
    '<p style="color:var(--text-secondary)">The timer is still running. You can open each skipped exercise as many times as you need until the timer ends or you submit. If you submit now, every skipped-and-never-answered exercise is excluded from the score — it does not count as correct or wrong.</p>'+
    (S.skipped.length ? '<ul class="reviewlist">'+items+'</ul>' : '<p>Nothing left here — you answered everything.</p>')+
    '<div class="btnrow"><button class="btn danger" onclick="showResults()">⏹ Submit exam now</button></div></div>';
  window.scrollTo(0,0);
}
function openSkipped(pos){
  var idx = S.skipped[pos];
  var ordPos = S.order.indexOf(idx);
  if(ordPos < 0){ ordPos = 0; }
  S.cur = ordPos;
  S.reviewPos = pos;
  S.screen = 'open';
  renderExercise();
}
function finishAttempt(auto){
  if(T.iv){ clearInterval(T.iv); }
  var anySkipped = S.skipped.length > 0;
  if(!auto && anySkipped && S.screen === 'exam'){
    openReview();
    return;
  }
  showResults();
}
function showResults(){
  flowLockRelease();
  if(S.screen === 'results'){ return; }
  if(T.iv){ clearInterval(T.iv); }
  setTState('ENDED');
  S.screen = 'results';
  var fully = 0, partial = 0, partialSum = 0, incorrect = 0, skippedN = 0, answeredN = 0;
  EXS.forEach(function(ex){
    if(ex._checked){
      answeredN += 1;
      if(ex._credit >= 1){ fully += 1; }
      else if(ex._credit > 0){ partial += 1; partialSum += ex._credit; }
      else { incorrect += 1; }
    } else { skippedN += 1; }
  });
  var sum = 0;
  EXS.forEach(function(ex){ if(ex._checked){ sum += ex._credit; } });
  var pct = answeredN > 0 ? Math.round((sum / answeredN) * 100) : 0;
  var passed = pct >= META.passMark && answeredN > 0;
  var avgP = partial > 0 ? round1(partialSum / partial).toFixed(2) : '0.00';
  var mins = Math.floor((META.timerMinutes*60 - T.remaining) / 60);
  var cert = passed ?
    '<div class="cert pass"><h2>✓ PASS</h2><p>You reached <b>'+pct+'%</b>, which is at or above the '+META.passMark+'% pass mark. Your result has been reported to the site.</p></div>' :
    '<div class="cert fail"><h2>✗ FAIL</h2><p>You reached <b>'+pct+'%</b>, below the '+META.passMark+'% pass mark. You must retake the exam to pass.</p></div>';
  $('app').innerHTML =
    '<div class="card"><h1>Results — '+esc(META.title)+'</h1>'+
    '<p style="color:var(--text-secondary)">Score computed over <b>'+answeredN+'</b> answered exercise(s). '+skippedN+' skipped-and-never-answered exercise(s) were excluded from both the score and the maximum.</p>'+
    '<div class="factrow"><span class="fact">◎ <span>Final score: <b>'+sum.toFixed(1)+' / '+answeredN+'</b> — <b>'+pct+'%</b></span></span><span class="fact">⏱ <span>timer used: <b>'+mins+' min</b> of '+META.timerMinutes+'</span></span></div>'+
    '</div>'+
    cert+
    '<div class="resultgrid">'+
    '<div class="rcard"><div class="rc-num st-correct">✓ '+fully+'</div><div class="rc-lab">Fully correct (credit 1.0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-partial">✓ '+partial+'</div><div class="rc-lab">Partially correct (avg credit '+avgP+')</div></div>'+
    '<div class="rcard"><div class="rc-num st-incorrect">✗ '+incorrect+'</div><div class="rc-lab">Fully incorrect (credit 0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-skipped">⚠ '+skippedN+'</div><div class="rc-lab">Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="card"><h2>How your time was spent</h2><p class="pauselog">⏸ Total time paused manually (exercise hidden): <b class="mono">'+T.manualTotal+' s</b><br>⏸ Total time paused for feedback review (Check auto-pause): <b class="mono">'+T.autoTotal+' s</b></p></div>'+
    '<div class="btnrow"><button class="btn primary" id="retakebtn" onclick="retake()">↻ Retake Exam</button></div>';
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported = true;
    reportScore(sum, answeredN);
  }
}
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. */ }
}
function retake(){
  var init = S ? S.init : null;
  startAttempt();
  S.init = init;
  updateHeader();
}

/* ---------- handshake & boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S = S || { init: null };
  S.init = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark' /* always 'dark'; the file is dark-only, nothing to switch */
  };
  var uc = document.querySelector('.userchip');
  if (S.init.username && !uc) {
    var hero = document.querySelector('.factrow');
    if (hero) {
      var chip = document.createElement('span');
      chip.className = 'userchip';
      chip.textContent = '👤 Analyst: ' + S.init.username;
      hero.appendChild(chip);
    }
  }
});
S = { init: null };
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
