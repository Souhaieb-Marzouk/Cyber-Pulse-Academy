<script>
window.EXAM_DATA = {"topicId":"t1601.002","batch":2,"objectID":"T1601.002 — Downgrade System Image (Sub-Technique of T1601 — Modify System Image)","passMark":70,"timerSeconds":2880,"estimatedMinutes":48,"sev":{"key":"medium","label":"MEDIUM"},"intro":{"title":"T1601.002 — MEDIUM practice exam","object":"T1601.002 — Downgrade System Image · Sub-Technique of T1601 — Modify System Image · Tactic: Defense Impairment · Platform: Network Devices · ATT&CK Enterprise, v2.0","learn":"<p>You already know what T1601.002 is; now you will learn to <b>connect the dots<\/b>. Imagine you are a SOC analyst with one year of experience. Tonight, three things happen within minutes on different systems: a file transfer, a configuration change, and a reboot. Alone, each is boring. Together, they are an image downgrade. This exam teaches you to combine two facts at a time into one conclusion.<\/p><p>The object is still a <b>Sub-Technique<\/b>: T1601.002, Downgrade System Image, child of T1601 (Modify System Image), tactic Defense Impairment, platform Network Devices. An adversary with privileged access installs an <b>older<\/b> device operating system to weaken security — weaker ciphers, fewer defences — and the change lands at the next reload.<\/p><p>You will practise the two-step work that real roles do daily. <b>SOC analysts<\/b> map a TACACS+ command trail to a technique and check it against the change calendar. <b>NetOps responders<\/b> validate a suspicious device with <span class=\"mono\">verify /md5<\/span> and an off-device baseline. <b>Detection engineers<\/b> tune the four AN1570 signals: older-image transfers, boot-variable changes, reloads, and post-reboot version strings. <b>GRC analysts<\/b> turn mitigations into policy lines (signed images, MFA). <b>Red teamers<\/b> weigh a downgrade's noise against new controls, and <b>incident responders<\/b> decide what to do first without dropping user traffic. The devices in this exam are fictional, but the mechanics — <span class=\"mono\">copy tftp: flash:<\/span>, boot variables, checksums — are the real ones.<\/p><p>By the end you should be able to read an alert, pull the second artefact that confirms or clears it, and name the right ATT&CK object and the right next action.<\/p>","themes":[{"name":"Detection chain (AN1570)","items":["Older-image transfer (TFTP/SCP)","Boot-variable alteration","Reboot / reload of the device","Post-reboot version string","Checksum vs approved baseline"]},{"name":"Evidence & mapping","items":["TACACS+ command accounting to technique","Ticket scope vs observed direction","Timeline reconstruction","Proof of outcome vs proof of intent"]},{"name":"Mitigations in practice","items":["M1046 Boot Integrity at boot time","M1045 Code Signing at install time","M1032 MFA for admin access","M1026 Privileged Account Management"]},{"name":"Response judgement","items":["Independent, out-of-band validation","Least-aggressive next action","Prioritizing findings","Change-review escalation"]}],"how":"<p>This is a <b>certification-style practice exam<\/b>. You need <b>70%<\/b> to pass. Every exercise shows the same three blocks: <b>SCENARIO<\/b> (blue), <b>QUESTION<\/b> (amber) and <b>YOUR ANSWER<\/b> (green). Multi-artefact exercises label each artefact in its own sub-panel.<\/p><p><b>Exercise types in this file:<\/b> multiple-choice (single and multi-select), matching, drag &amp; drop onto chain stages and matrix types, click-to-order timelines and ranking, fill-in-the-blank, policy keyword insertion, alert-queue simulations, branching decision trees, a dual red/blue perspective scenario, and one interactive terminal where IOS interviews you line by line.<\/p><p><b>Timer:<\/b> the countdown runs while you work. <b>Manual Pause<\/b> stops it and hides the exercise for a break. <b>Check auto-pause<\/b> stops it the instant you press Check, so you can study the feedback and the item-by-item breakdown without pressure; it resumes only on Next. Skip and Hint never stop the clock.<\/p><p><b>Scoring:<\/b> exercises with several correct items use partial credit: credit = max(0, (H − W) / N) — wrong picks subtract, so never guess everything. One hint per exercise costs 10% of that exercise's credit. <b>Skipping:<\/b> skipped exercises go to a review pool; you can return to them as often as you like while the timer runs, and anything still unanswered at submit is excluded from the score entirely. Press Start when ready.<\/p>","types":[]},"exercises":[{"id":"m01","type":"mc","summary":"TACACS+ command log — what happened here?","scen":{"lead":"You are the on-call analyst for Meridian Corp. The AAA server forwarded an unusual command-accounting trail from edge router edge-rtr-04. Two steps are needed: first read what the actor did, then name the ATT&CK sub-technique.","arts":[{"label":"ARTEFACT 1 — TACACS+ command accounting (edge-rtr-04)","body":"<b class=\"t\">02:14:09<\/b> user=svc-archive  priv=15  cmd=show clock\n<b class=\"t\">02:15:31<\/b> user=svc-archive  priv=15  cmd=<b class=\"k\">copy tftp://10[.]44[.]9[.]31/c2900-legacy-k9.bin flash:<\/b>\n<b class=\"t\">02:17:02<\/b> user=svc-archive  priv=15  cmd=conf t\n<b class=\"t\">02:17:40<\/b> user=svc-archive  priv=15  cmd=<b class=\"k\">boot system flash:c2900-legacy-k9.bin<\/b>\n<b class=\"t\">02:18:15<\/b> user=svc-archive  priv=15  cmd=<b class=\"s\">reload<\/b>"},{"label":"ARTEFACT 2 — Image inventory note","body":"c2900-legacy-k9.bin = release 15.1(4)M6a (2015, end-of-support)\ncurrent approved image for edge-rtr-04 = 15.7(3)M9 (signed)"}]},"question":"Reading both artefacts together: which ATT&CK sub-technique does this trail demonstrate?","hint":"Step 1: the actor installed an OLDER image and pointed the boot variable at it. Step 2: which T16xx ID describes installing an older device OS?","correct":"<b>T1601.002 — Downgrade System Image<\/b>: an older image was copied in, the boot variable was changed, and the router was reloaded.","expl":"Step 1 reads the trail: transfer of a 2015 image, boot-variable change, reload. Step 2 maps it: installing an older OS on a network device to weaken security is exactly T1601.002. T1601.001 (Patch System Image) would show a NEWER or modified image; T1600 (Weaken Encryption) is what the actor may enable afterwards, not this action; T1078 (Valid Accounts) covers the stolen svc-archive account used to get in, not the downgrade itself. What to study: mapping a command trail to the right sub-technique.","items":[{"label":"The sub-technique in this trail","note":"Older image + boot variable + reload on a network device = T1601.002, tactic Defense Impairment."}],"data":{"options":["T1601.001 Patch System Image","T1601.002 Downgrade System Image","T1600 Weaken Encryption","T1078 Valid Accounts"],"correct":1}},{"id":"m02","type":"mcs","summary":"Select the downgrade evidence","scen":{"lead":"Same incident, wider view. The hunt team collected six observations across Meridian Corp systems. Your job: mark every observation that genuinely supports \"edge-rtr-04 was downgraded\", and leave out the ones that do not.","arts":[{"label":"ARTEFACT — collected observations","body":"A. TFTP session 02:15 to 10[.]44[.]9[.]31 fetching c2900-legacy-k9.bin\nB. Boot variable on edge-rtr-04 now points at c2900-legacy-k9.bin\nC. %SYS-5-RELOAD on edge-rtr-04 at 02:18\nD. Approved image list updated to ADD a 2026 vendor release\nE. After reload: version string shows 15.1(4)M6a\nF. Nightly config backup job completed at 01:00 as always"}]},"question":"Select ALL observations that support the downgrade conclusion.","hint":"The page's chain is: older-image transfer, boot-variable change, reload, old version string afterwards. Two observations are routine noise.","correct":"A, B, C and E support the downgrade. D describes a normal image-list update; F is routine backup noise.","expl":"A is the older-image transfer, B is the boot configuration change, C is the reload, and E is the unexpected old version string after reboot — together they are the full chain from the ATT&CK detection guidance. D is the opposite direction (adding a newer release) and F happens every night, so neither supports the conclusion. Wrong picks subtract credit, so leave noise out. What to study: the four AN1570 signals and how to separate them from routine events.","items":[{"label":"A — older-image TFTP transfer","note":"Correct pick: transfer of an older image is signal one."},{"label":"B — boot variable change","note":"Correct pick: boot config now points at the older image — signal two."},{"label":"C — %SYS-5-RELOAD","note":"Correct pick: the reload activates the change — signal three."},{"label":"D — image list adds a newer release","note":"Not evidence of a downgrade; it describes approved patching activity."},{"label":"E — version string 15.1(4)M6a after reload","note":"Correct pick: unexpected OS version string after reboot — signal four."},{"label":"F — nightly backup completed","note":"Routine noise; happens every night regardless of the incident."}],"data":{"options":["A. TFTP fetch of c2900-legacy-k9.bin","B. Boot variable points at c2900-legacy-k9.bin","C. %SYS-5-RELOAD at 02:18","D. Image list adds a 2026 vendor release","E. Version string 15.1(4)M6a after reload","F. Nightly config backup finished"],"correct":[0,1,2,4]}},{"id":"m03","type":"dnd","summary":"Map artefacts to the detection chain","scen":{"lead":"The ATT&CK detection guidance for this technique describes a suspicious chain: transfer of an older image, alteration of boot configuration, reboot/reload, and independent validation of the result. Sort the five artefacts onto the chain stage each one belongs to.","arts":[{"label":"ARTEFACT — evidence package (edge-rtr-04)","body":"1. TFTP server log: GET /c2900-legacy-k9.bin from 10[.]20[.]4[.]7 at 02:15\n2. Running-config diff: boot system flash:c2900-legacy-k9.bin (new line)\n3. Syslog: %SYS-5-RELOAD at 02:18:15\n4. Out-of-band console capture: version 15.1(4)M6a after restart\n5. Checksum of flash image differs from the approved-baseline value"}]},"question":"Drag each artefact to the chain stage it evidences.","hint":"Ask what each artefact proves: moving a file, choosing the file, restarting, or checking the result.","correct":"1 = image transfer, 2 = boot-config alteration, 3 = reboot/reload, 4 and 5 = validation of OS version and integrity.","expl":"The chain from the page's analytic AN1570 is exactly this order: the transfer moves the older image, the boot-variable change selects it, the reload runs it, and the last stage validates what actually booted — by version string and by checksum against the approved baseline. Note that stage 4 has two artefacts: version and integrity are checked independently, because CLI output itself can be tampered with. What to study: the AN1570 suspicious chain.","items":[{"label":"TFTP GET of the legacy image","note":"Stage 1: anomalous file transfer of an OS image (TFTP/FTP/SCP)."},{"label":"New boot system line in config","note":"Stage 2: configuration change pointing the boot variable at an older image."},{"label":"%SYS-5-RELOAD message","note":"Stage 3: reboot/reload of the device to apply the change."},{"label":"Console capture of old version string","note":"Stage 4: independent validation of the OS version after reboot."},{"label":"Checksum differs from baseline","note":"Stage 4: checksum mismatch against the approved baseline image."}],"data":{"items":["TFTP GET of the legacy image","New boot system line in config","%SYS-5-RELOAD message","Console capture of old version string","Checksum differs from baseline"],"zones":[{"name":"1 · Image transfer","icon":"⇄"},{"name":"2 · Boot-config change","icon":"⚙"},{"name":"3 · Reboot / reload","icon":"↻"},{"name":"4 · Validation of result","icon":"⚓"}],"correct":[0,1,2,3,3]}},{"id":"m04","type":"order","summary":"Rebuild the incident timeline","scen":{"lead":"Five timestamped events from the Meridian incident are shuffled. Drag them into the order they happened.","arts":[{"label":"ARTEFACT — shuffled events","body":"• 02:17:40 boot variable changed to legacy image\n• 02:18:15 device reload\n• 02:15:31 legacy image copied from TFTP into flash\n• 03:02:44 hunt team alerted; baseline diff opened\n• 02:11:03 login with svc-archive from an unknown jump host"}]},"question":"Order the five events from first to last.","hint":"Access comes first, then the three downgrade steps, then the defenders arrive.","correct":"Login (02:11) → copy image (02:15) → boot variable (02:17) → reload (02:18) → hunt team response (03:02).","expl":"The story: the actor first used the svc-archive account from an unknown jump host, then performed the three-step downgrade (transfer, boot-config change, reload), and the defenders started hunting about 45 minutes later. Reading events in time order is the base skill of incident response: each step enables the next, and the response always comes last in the raw trail. What to study: timeline reconstruction from heterogeneous logs.","items":[{"label":"Login with svc-archive","note":"First: the actor needs privileged access before anything else."},{"label":"Legacy image copied to flash","note":"Second: the file must be on the device before it can be selected."},{"label":"Boot variable changed","note":"Third: the config now selects the legacy image."},{"label":"Device reload","note":"Fourth: the reload makes the router boot the older image."},{"label":"Hunt team opens baseline diff","note":"Last: defenders react after the change is already in place."}],"data":{"entries":["Login with svc-archive from unknown jump host","Legacy image copied from TFTP into flash","Boot variable changed to legacy image","Device reload","Hunt team opens baseline diff"],"mode":"timeline"}},{"id":"m05","type":"match","summary":"Which mitigation blunts which step?","scen":{"lead":"GRC asks you to justify four controls from the ATT&CK mitigation list for T1601.002. Match each mitigation to the downgrade step it best blunts.","arts":[{"label":"ARTEFACT — the four controls","body":"M1046 Boot Integrity · M1045 Code Signing · M1032 Multi-factor Authentication · M1026 Privileged Account Management"}]},"question":"Match each mitigation to the attack step it most directly stops.","hint":"Two controls are about identity, two are about the image itself. Read each right-hand card carefully — they look similar on purpose.","correct":"M1046 blocks a tampered image at boot; M1045 blocks unsigned images from being installed; M1032 blocks the stolen-password login; M1026 shrinks who can reach device admin at all.","expl":"<b>M1046<\/b> (Boot Integrity) acts at start-up: a wrong image simply fails to load. <b>M1045<\/b> (Code Signing) acts earlier: only vendor-signed images are accepted, so an old unsigned or re-built image is refused. <b>M1032<\/b> (MFA) and <b>M1026<\/b> (Privileged Account Management) act on access: the first makes a stolen password alone useless, the second keeps the number of privileged accounts tiny so there are fewer svc-archive-style accounts to steal. What to study: which mitigation answers which step.","items":[{"label":"M1046 Boot Integrity","note":"The device verifies image integrity at boot — a tampered or replaced image fails to load."},{"label":"M1045 Code Signing","note":"Only digitally signed OS images are accepted, blocking installs of attacker-supplied images."},{"label":"M1032 Multi-factor Authentication","note":"A second factor stops the stolen-credential login that started the chain."},{"label":"M1026 Privileged Account Management","note":"Fewer, well-managed admin accounts reduce credential overlap and abuse."}],"data":{"lefts":["M1046 Boot Integrity","M1045 Code Signing","M1032 Multi-factor Authentication","M1026 Privileged Account Management"],"rights":["A replaced or tampered image fails to load at start-up","Unsigned or attacker-supplied images are refused at install time","A stolen password alone cannot reach device admin","The pool of admin accounts stays small and managed","Alerts are sent to the SIEM every five minutes"],"correct":[0,1,2,3]}},{"id":"m06","type":"fill","summary":"Complete the validation procedure","scen":{"lead":"Finish the two commands and one concept in the network team's validation procedure for suspected downgrades.","arts":[{"label":"ARTEFACT — procedure draft","body":"1. On the device, run __________ /md5 flash:&lt;image&gt; to compute the file checksum.\n2. Compare the result against the approved __________ held off-device.\n3. Never trust on-device CLI output alone — the analytic warns that actors may alter it."}]},"question":"Fill the three gaps (two commands words and one concept).","hint":"Blank 1 is the IOS word for verifying; blank 3 is the trusted reference list defenders keep.","correct":"1) <b>verify<\/b> /md5 flash:&lt;image&gt; · 2) compare with the approved <b>baseline<\/b> · 3) use an <b>out-of-band<\/b> channel.","expl":"The procedure encodes two ideas from the detection guidance: checksum verification (<span class=\"mono\">verify /md5<\/span>) and comparison against an approved baseline kept <i>off the device<\/i>. The third gap matters most in real incidents: because an attacker with admin rights can alter CLI output, validation must happen through an independent channel (console, out-of-band management). What to study: independent validation of OS version and integrity.","items":[{"label":"Blank 1 — checksum command","note":"verify is the IOS command that computes file checksums."},{"label":"Blank 2 — the reference","note":"The approved baseline (kept off-device) is the comparison point."},{"label":"Blank 3 — the channel","note":"Out-of-band / independent validation defeats CLI-output tampering."}],"data":{"text":"1. Run ⟦0⟧ /md5 flash:&lt;image&gt; on the device. 2. Compare against the approved ⟦1⟧ held off-device. 3. Validate through an ⟦2⟧ channel, not the device CLI alone.","blanks":[["verify"],["baseline","baselines","approved baseline"],["out-of-band","out of band","independent","oob"]],"bank":["out-of-band","baseline","verify"]}},{"id":"m07","type":"flow","summary":"NetOps alert queue — triage four alerts","scen":{"lead":"Scenario simulation: you hold the NetOps queue for Meridian Corp this morning. Four alerts, four decisions. Choose the best first action for each; the queue moves on as you decide.","arts":[{"label":"ARTEFACT — change calendar extract","body":"CHG-2214  tonight 02:00-04:00  upgrade lab-sw-09 (approved)\nCHG-2215  Fri 23:00        replace fan tray edge-rtr-04 (approved, hardware)"}]},"question":"Triage each alert with the best first action.","hint":"Check every event against the change calendar first; then look at the direction — upgrade or downgrade?","correct":"Alert 1 = benign (scheduled lab upgrade), Alert 2 = investigate (downgrade outside any change), Alert 3 = benign (hardware change), Alert 4 = open a change-review case (downgrade direction inside an approved window for different work).","expl":"The two-step skill here: (1) match to the change calendar, (2) check the direction. Alert 1 matches CHG-2214 and is an upgrade — benign. Alert 2 has no change record at all — investigate. Alert 3 matches the fan-tray change — benign. Alert 4 is the trap: edge-rtr-04 has an approved window, but for hardware, and the action observed is a <i>downgrade<\/i> — the ticket does not cover it, so the right move is a change-review case, not closure. What to study: ticket scope versus observed action.","items":[{"label":"Alert 1 — lab-sw-09 new image 02:03","note":"Benign: matches approved upgrade CHG-2214, direction is newer."},{"label":"Alert 2 — br-rtr-12 image transfer 02:31, no ticket","note":"Investigate: no change record covers it; image transfer is the first downgrade step."},{"label":"Alert 3 — edge-rtr-04 reload 23:04 Fri","note":"Benign: matches the hardware change window CHG-2215."},{"label":"Alert 4 — edge-rtr-04 boot var to older image 03:40 tonight","note":"Escalate via change review: the approved window does not cover an image downgrade."}],"data":{"steps":[{"scen":"<b>Alert 1 of 4<\/b> — 02:03 lab-sw-09 transferred a NEWER image; change CHG-2214 covers tonight's upgrade of this switch.","question":"Best first action?","opts":["Close as benign — approved upgrade in window","Escalate to security — image change on a switch"],"correct":0},{"scen":"<b>Alert 2 of 4<\/b> — 02:31 TFTP transfer of an older image into br-rtr-12. No change ticket mentions this device.","question":"Best first action?","opts":["Close as routine — transfers are common","Open a security investigation — no ticket, older image"],"correct":1},{"scen":"<b>Alert 3 of 4<\/b> — 23:04 Friday reload of edge-rtr-04; CHG-2215 (fan tray replacement) is in its window.","question":"Best first action?","opts":["Close as benign — hardware change window","Escalate — any reload is suspicious"],"correct":0},{"scen":"<b>Alert 4 of 4<\/b> — 03:40 tonight the boot variable of edge-rtr-04 changed to an OLDER image, inside the CHG-2215 window.","question":"Best first action?","opts":["Close — the device had an approved window tonight","Open change review — the ticket covers hardware, not an image downgrade"],"correct":1}]}},{"id":"m09","type":"mc","summary":"The ticket trap — approved window, wrong direction","scen":{"lead":"Near-miss exercise. Last night inside an approved maintenance window, core-sw-02 pulled an image from the TFTP server. This morning the queue wants to close the alert as \"covered by ticket\".","arts":[{"label":"ARTEFACT 1 — Alert","body":"02:22 core-sw-02 transferred c2960-<b class=\"s\">lanbasek9-mz.122-58<\/b>.bin (2013 release)\n02:24 boot variable changed to that file · 02:26 reload"},{"label":"ARTEFACT 2 — Change CHG-2218 (approved)","body":"\"Patch core-sw-02 to the LATEST recommended release, 02:00-04:00 tonight.\nRollback plan: none needed.\""}]},"question":"What is the correct assessment?","hint":"The ticket exists and the window matches. Read the ticket's verb one more time before you answer.","correct":"<b>Suspicious — treat as a possible downgrade.<\/b> The approved change is an upgrade to the latest release; an image that moves <i>backwards<\/i> to a 2013 release is the opposite of the ticket's intent.","expl":"Two facts must both hold for \"covered by ticket\": the device matches AND the action matches. Here the device matches but the action is the opposite — the ticket says patch to the latest, the logs show a rollback to an old release. That is precisely how T1601.002 hides: it borrows the legitimacy of real maintenance windows. The right assessment is suspicious, with change-review and security both involved. What to study: ticket scope versus observed direction.","items":[{"label":"The assessment","note":"Window and device match, but the direction (older release) contradicts the approved upgrade — treat as suspicious."}],"data":{"options":["Benign — the change window covers any image work tonight","Suspicious — the action is a downgrade, the opposite of the approved upgrade","Benign — 2013 releases are stable and well known","Suspicious — transfers should never happen inside change windows"],"correct":1}},{"id":"m08","type":"term","summary":"Terminal: stage an approved test image (interactive copy)","scen":{"lead":"Terminal exercise with the tool named. You are preparing an APPROVED lab test on edge-rtr-04 (training simulator): copy the lab image from the Meridian TFTP server into flash. The device will interview you line by line, exactly like IOS does.","arts":[{"label":"ARTEFACT — copy parameters (approved)","body":"TFTP server (defanged): 10[.]44[.]9[.]31\nSource file: lab-test-image.bin\nDestination: flash (local storage)"}]},"question":"Run <b>copy tftp: flash:<\/b> and answer the three IOS prompts correctly.","hint":"IOS asks three questions in order: the remote host, the source file name, the destination file name. Type the values exactly as printed (defanged form included).","correct":"<b>copy tftp: flash:<\/b> with remote host <b>10[.]44[.]9[.]31<\/b>, source <b>lab-test-image.bin<\/b>, destination <b>lab-test-image.bin<\/b>.","expl":"<b>copy tftp: flash:<\/b> starts an interactive transfer: IOS asks for the remote host, then the source file, then the destination name. In real work this same command is what an attacker abuses to stage an older image — which is why transfer telemetry (source host, file name, time) is signal one in the detection guidance. Here you used it for an approved lab staging, the same mechanics. What to study: the IOS copy interview and the telemetry it leaves.","items":[{"label":"Remote host answer","note":"The TFTP server address, in the defanged form printed in the artefact."},{"label":"Source file answer","note":"The source file name on the TFTP server."},{"label":"Destination file answer","note":"The destination name in flash — normally the same file name."}],"data":{"mode":"seq","banner":"edge-rtr-04 con0 — approved lab staging — training simulator, no real device","prompt":"edge-rtr-04#","prompts":[{"ask":"copy tftp: flash: — Address or name of remote host []?","accept":["10\\[\\.\\]44\\[\\.\\]9\\[\\.\\]31","10\\[\\.44\\.\\]9\\[\\.31\\]","10\\[\\.\\]44\\.9\\[\\.\\]31"]},{"ask":"Source filename []?","accept":["lab-test-image\\.bin","lab-test-image"]},{"ask":"Destination filename [lab-test-image.bin]?","accept":["lab-test-image\\.bin","lab-test-image"]}],"elements":[{"kind":"need","re":"10\\[\\.\\]44\\[\\.\\]9\\[\\.\\]31","label":"Remote host answer"},{"kind":"need","re":"lab-test-image(\\.bin)?","label":"Source file answer"},{"kind":"need","re":"lab-test-image(\\.bin)?","label":"Destination file answer"}],"canonical":"copy tftp: flash:\n  Address or name of remote host []? 10[.]44[.]9[.]31\n  Source filename []? lab-test-image.bin\n  Destination filename [lab-test-image.bin]? lab-test-image.bin\nAccessing tftp://10[.]44[.]9[.]31/lab-test-image.bin...\nLoading lab-test-image.bin, 41 MB: [OK]"}},{"id":"m10","type":"mc","summary":"Which artefact proves what actually booted?","scen":{"lead":"The team agrees an older image is in flash and the boot variable points at it. The lead asks the sharper question: which single artefact proves the device is now actually RUNNING that older image?","arts":[{"label":"ARTEFACT — available artefacts","body":"A. TFTP log: image transferred to flash at 02:15\nB. Running config: boot system flash:c2900-legacy-k9.bin\nC. Console capture AFTER the reload: \"System image file is\n   \\\"flash:c2900-legacy-k9.bin\\\" ... Version 15.1(4)M6a\"\nD. %SYS-5-RELOAD at 02:18:15"}]},"question":"Which artefact proves the older image is actually running?","hint":"Intent, selection and restart are not proof. Only one artefact observes the device after the boot happened.","correct":"<b>C — the post-reload console capture<\/b> showing the image file and version string the device actually booted.","expl":"A proves a file arrived, B proves a setting changed, D proves a restart happened — but none of them proves which software is running now. Only a post-reboot observation of the version string does, and it is signal three in the page's analytic (unexpected OS version strings after reboot). Best practice is to capture it out-of-band, because an attacker with admin rights could alter what the CLI prints. What to study: proof of outcome versus proof of intent.","items":[{"label":"The proving artefact","note":"C observes the device after the reload; A, B and D only show intent, selection and restart."}],"data":{"options":["A — the TFTP transfer log","B — the boot system line in the config","C — the post-reload console capture of the version string","D — the %SYS-5-RELOAD message"],"correct":2}},{"id":"m11","type":"selects","summary":"Draft the hardening policy line","scen":{"lead":"Policy-drafting exercise. The network team writes its hardening standard using the ATT&CK mitigation list. Complete the sentence by choosing the right keyword in each dropdown.","arts":[{"label":"ARTEFACT — policy draft 4.2","body":"\"Network devices shall load only ______ images at boot (controls M1045 / M1046),\nand administrative access shall require ______ (control M1032).\""}]},"question":"Pick the two keywords that complete the policy correctly.","hint":"First blank: what kind of images may load. Second blank: what login must require on top of the password.","correct":"\"...load only <b>signed<\/b> images at boot (M1045 / M1046), and administrative access shall require <b>multi-factor authentication<\/b> (M1032).\"","expl":"The policy turns two page mitigations into one sentence. <b>Signed<\/b> images implement Code Signing (M1045) and are verified at boot by Boot Integrity (M1046) — an attacker's older or rebuilt image is refused. <b>Multi-factor authentication<\/b> (M1032) means the svc-archive-style stolen password is no longer enough on its own. Generic wording like \"modern\" or \"tested\" would not give the device a technical way to refuse a bad image. What to study: turning ATT&CK mitigations into policy wording.","items":[{"label":"Keyword 1 — image property","note":"Signed is the property that M1045/M1046 enforce; it lets the device refuse unsigned images."},{"label":"Keyword 2 — access control","note":"MFA adds a second proof of identity on top of the password (M1032)."}],"data":{"text":"Network devices shall load only {{0}} images at boot (M1045 / M1046), and administrative access shall require {{1}} (M1032).","slots":[{"opts":["signed","modern","frequently updated"],"correct":0},{"opts":["multi-factor authentication","a strong password","a VPN connection"],"correct":0}]}},{"id":"m12","type":"flow","summary":"Dual perspective — same router, red and blue","scen":{"lead":"Dual-perspective exercise, two steps. The stage: edge-rtr-04, a Meridian edge router. STEP 1 is the red side; STEP 2 is the blue side. Both questions use the same facts.","arts":[{"label":"ARTEFACT — the facts","body":"Meridian just deployed a monthly checksum-baseline control:\nflash checksums of every edge device are compared off-device.\nBoot-variable diffs alert to the SIEM.\nNo boot-integrity signing on this router model."}]},"question":"Answer for the red team (step 1) and the blue team (step 2).","hint":"Red: which action still works now that version strings and checksums are watched? Blue: which observation survives even a clever red choice?","correct":"Red: downgrade but keep the version string plausible is still defeated by checksum; the viable red move given the controls is to attack the baseline data itself. Blue: the off-device checksum comparison still exposes the tampered image.","expl":"Red view: with version-string and boot-variable alerts in place, a downgrade is noisy; the red team would try to make the image <i>look<\/i> legitimate — but the checksum baseline compares the file itself, so any replaced image differs unless the baseline is also changed. Blue view: because the comparison data lives off-device, the control survives admin-level tampering on the router — that independence is the whole point of the AN1570 validation rule. Defender takeaway: protect the baseline store as fiercely as the devices. What to study: attacker trade-offs against a checksum-baseline control.","items":[{"label":"Red decision — staying under the controls","note":"Best red choice: target the comparison data; any plain downgrade still changes the flash checksum."},{"label":"Blue decision — the surviving control","note":"The off-device checksum comparison detects the replaced image even when CLI output looks normal."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 2<\/b> — RED perspective. You hold admin on edge-rtr-04. Version strings are checked after reboots and boot-variable changes alert. Which action keeps your downgrade viable?","question":"Which red action do you take?","opts":["Downgrade and also alter what the device prints for version checks, accepting checksum risk","Downgrade only the boot variable, never reload","Do nothing — the controls cannot be overcome"],"correct":0},{"scen":"<b>STEP 2 OF 2<\/b> — BLUE perspective. The red actor downgraded the image and tried to disguise the version string. Which control still exposes the tampered image?","question":"Which blue control catches it?","opts":["The off-device checksum comparison against the approved baseline","The boot-variable alert — it fires on every change","Nothing — a disguised version string defeats all telemetry"],"correct":0}]}},{"id":"m13","type":"flow","summary":"Decision tree — checksum mismatch on core-sw-02","scen":{"lead":"Branching scenario, three decisions. You are the duty responder. Monitoring reports a checksum mismatch against the approved baseline on core-sw-02, a production switch. Decide step by step.","arts":[{"label":"ARTEFACT — quick facts","body":"core-sw-02: production, carries 3 user VLANs.\nBaseline: approved image v14, checksum list on the mgmt station.\nNo ticket open for tonight. Reload by you would drop user traffic."}]},"question":"Work through the three decisions in order.","hint":"The analytic's rule is independent validation first; the business rule is: do not drop user traffic without a reason you can defend.","correct":"1) re-verify the checksum independently (out-of-band), 2) do NOT reload yet, keep monitoring, 3) escalate with evidence to change review and security.","expl":"Decision 1: a single mismatch from the monitoring path must be re-validated independently — the analytic warns that on-device output and even monitoring data paths deserve a second source. Decision 2: reloading now would drop user traffic and also destroy the running state before anyone has confirmed anything — the least aggressive action is to keep serving traffic under enhanced monitoring. Decision 3: a confirmed mismatch on a production switch with no ticket is a security matter, so escalate with the evidence package. What to study: sequencing response actions under business constraints.","items":[{"label":"Decision 1 — first action","note":"Independent re-verification first: never act on one unconfirmed signal."},{"label":"Decision 2 — reload now?","note":"Do not reload yet: it drops traffic and destroys state before confirmation."},{"label":"Decision 3 — what next","note":"Escalate with the evidence package to change review and security."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 3<\/b> — The monitoring station reports the flash checksum of core-sw-02 differs from the approved baseline.","question":"What do you do first?","opts":["Re-verify the checksum through an independent, out-of-band path","Reload the switch immediately to clear the bad image","Ignore it — checksum jobs drift sometimes"],"correct":0},{"scen":"<b>STEP 2 OF 3<\/b> — The independent check confirms the mismatch. Traffic is flowing; it is mid-morning.","question":"Do you reload the switch now to force a clean image?","opts":["No — keep it serving under enhanced monitoring and preserve evidence","Yes — wipe and reload immediately, downtime is acceptable"],"correct":0},{"scen":"<b>STEP 3 OF 3<\/b> — Confirmed tampering, no ticket, production switch, traffic flowing.","question":"What is your next move?","opts":["Escalate to security and change review with the evidence package","Silently swap the image during lunch and tell no one","Post the findings in the public team chat channel"],"correct":0}]}},{"id":"m14","type":"mc","summary":"Platform and privilege — where does T1601.002 apply?","scen":{"lead":"A GRC reviewer marked T1601.002 as \"apply to all servers and cloud tenants\" in the control matrix. You must correct the scoping before the audit.","arts":[{"label":"ARTEFACT — ATT&CK page facts","body":"Platforms: Network Devices\nThe behaviour targets the device boot chain: image in storage, boot\nvariable, reload. Cloud SaaS tenants have no local device boot chain."}]},"question":"Which scoping statement is correct for T1601.002?","hint":"Read the platform field, then ask: who must the actor already be to change what a device boots from?","correct":"It applies to <b>network devices<\/b>, and the actor needs privileged administrative access to the device to change its boot image.","expl":"The platform is Network Devices — routers, switches, firewalls — not Windows or Linux servers, and not cloud tenants, so the GRC row must be narrowed. The privilege nuance matters too: an attacker needs device-level administrative access to install an image and change the boot variable, which is why M1032 and M1026 (identity controls) are on the mitigation list. \"Read-only network access\" is not enough to perform this technique. What to study: platform and permissions-required fields on the ATT&CK page.","items":[{"label":"The correct scoping","note":"Platform: Network Devices. Requirement: privileged (administrative) access to the device."}],"data":{"options":["All endpoint laptops with EDR agents","Network devices, requiring privileged administrative access","Any cloud SaaS tenant with an admin portal","Printers and IoT cameras only"],"correct":1}},{"id":"m15","type":"order","summary":"Rank the four findings","scen":{"lead":"Prioritization exercise. Four findings from last night sit in the queue and one analyst (you) can work them. Rank them from most urgent (rank 1) to least.","arts":[{"label":"ARTEFACT — the four findings","body":"F1  edge-rtr-04: boot var changed to older image, no ticket\nF2  lab-sw-77: checksum job has not run for 30 days (gap)\nF3  core-sw-02: approved upgrade completed, new baseline stored\nF4  br-sw-19: old release still running, but change approved for next month"}]},"question":"Drag the findings into urgency order (1 = work first).","hint":"Ask two questions per finding: is an adversary action possibly in progress, and is a production edge device affected?","correct":"F1 (active unexplained boot-variable change on an edge router) first, then F2 (detection gap), then F4 (known, scheduled old release), then F3 (routine, completed, healthy).","expl":"Ranking mixes likelihood and impact. F1 shows a live indicator of the technique with no ticket — act first. F2 is not an attack but a blind spot: while you cannot check checksums, you cannot detect this technique — second. F4 is a known, documented old release with a fix scheduled — third. F3 is normal patching with a fresh baseline — last. What to study: prioritizing indicators versus hygiene gaps versus approved risk.","items":[{"label":"F1 — boot var change, no ticket","note":"Rank 1: live possible downgrade indicator on an edge device, unexplained."},{"label":"F2 — checksum job gap (30 days)","note":"Rank 2: a detection gap for exactly this technique; fix soon."},{"label":"F4 — old release, change approved","note":"Rank 3: known risk with a scheduled, approved fix."},{"label":"F3 — approved upgrade completed","note":"Rank 4: routine and healthy; no action beyond recording."}],"data":{"entries":["F1 edge-rtr-04: boot var to older image, no ticket","F2 lab-sw-77: checksum job not run for 30 days","F4 br-sw-19: old release, approved change next month","F3 core-sw-02: approved upgrade completed"],"mode":"rank"}},{"id":"m16","type":"dnd","summary":"ATT&CK objects — technique or mitigation?","scen":{"lead":"Matrix exercise. New analysts often mix ATT&CK object types. Sort the four objects by type, using the mini matrix extract as a guide.","arts":[{"label":"ARTEFACT — mini matrix extract","body":"Defense Impairment column: T1600 Weaken Encryption, T1601 Modify\nSystem Image (sub: T1601.001, T1601.002).\nMitigations table: M1045 Code Signing, M1046 Boot Integrity."}]},"question":"Drag each object to its type.","hint":"Techniques describe what the adversary does; mitigations describe what defenders deploy.","correct":"T1600 and T1601.002 are techniques (adversary behaviour); M1045 and M1046 are mitigations (defender controls).","expl":"Technique IDs start with <b>T<\/b> and live in the matrix columns; they describe adversary behaviour — here T1601.002 (the downgrade) and T1600 (the weaker-encryption behaviour a downgrade can enable). Mitigation IDs start with <b>M<\/b> and describe defensive controls — M1045 (accept only signed images) and M1046 (verify image integrity at boot). Keeping the two families apart is the base skill for reading any ATT&CK page. What to study: ATT&CK object types and ID prefixes.","items":[{"label":"T1601.002 Downgrade System Image","note":"A technique: adversary behaviour in the Defense Impairment column."},{"label":"T1600 Weaken Encryption","note":"A technique: the behaviour a downgrade can enable."},{"label":"M1045 Code Signing","note":"A mitigation: vendor-signed images to validate integrity."},{"label":"M1046 Boot Integrity","note":"A mitigation: cryptographic image verification at boot."}],"data":{"items":["T1601.002 Downgrade System Image","T1600 Weaken Encryption","M1045 Code Signing","M1046 Boot Integrity"],"zones":[{"name":"Technique — adversary behaviour","icon":"☠"},{"name":"Mitigation — defender control","icon":"⛨"}],"correct":[0,0,1,1]}}]};

'use strict';
var EXAM = window.EXAM_DATA;
function $(s){ return document.querySelector(s); }
function mk(tag, cls, html){ var e=document.createElement(tag); if(cls){e.className=cls;} if(html!==undefined){e.innerHTML=html;} return e; }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtClock(sec){ var m=Math.floor(Math.max(0,sec)/60), s=Math.max(0,sec)%60; return pad2(m)+':'+pad2(s); }
function norm(s){ return (''+s).toLowerCase().replace(/\s+/g,' ').replace(/[.,;:]+$/,'').trim(); }
function smoothOK(){ return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* generic partial-credit scoring: H = selected correct, W = selected wrong, N = total correct */
function scoreExercise(sel, corr){
  var corrSet = {}; for(var i=0;i<corr.length;i++){ corrSet[corr[i]] = true; }
  var H=0, W=0;
  for(var j=0;j<sel.length;j++){ if(corrSet[sel[j]]){ H++; } else { W++; } }
  var N = corr.length; var c = Math.max(0,(H-W)/N);
  return {H:H,W:W,N:N,credit:c};
}
/* ---------------- global state ---------------- */
var S = {
  phase:'intro', order:[], idx:0, credits:{}, answered:{}, checked:{}, hintUsed:{},

};
var T = { state:'IDLE', remain:EXAM.timerSeconds, lastTick:0, iv:null };
var TIMER_LABELS = {
  RUNNING:'\u25B6 RUNNING', PAUSED_MANUAL:'\u23F8 PAUSED \u2014 manual (press Resume)',
  PAUSED_AUTO_CHECK:'\u23F3 AUTO-PAUSED \u2014 reviewing feedback (resumes on Next)', ENDED:'\u23F9 ENDED', IDLE:'\u25B6 READY'
};
function setState(st){ T.state = st; renderHeader(); }
function tTick(){
  var now = Date.now(); var dt = Math.floor((now - T.lastTick)/1000);
  if(dt <= 0){ return; }
  T.lastTick = now;
  if(T.state==='PAUSED_MANUAL'){ S.manualTotal += dt; return; }
  if(T.state==='PAUSED_AUTO_CHECK'){ S.reviewTotal += dt; return; }
  if(T.state!=='RUNNING'){ return; }
  if(S.phase==='review'){ /* timer keeps running in review by design */ }
  T.remain -= dt;
  var cur = curEx();
  if(cur && cur.perEx && !S.checked[cur.id] && (S.phase==='exam')){
    S.perExLeft -= dt;
    if(S.perExLeft <= 0){ S.perExLeft = 0; doCheck(true); }
  }
  if(T.remain <= 0){ T.remain = 0; setState('ENDED'); finishExam(); return; }
  renderHeader();
}
function startTimer(){ T.lastTick = Date.now(); if(!T.iv){ T.iv = setInterval(tTick, 500); } setState('RUNNING'); }
function curEx(){ return S.order[S.idx] || null; }
/* ---------------- header ---------------- */
function renderHeader(){
  var t = $('#hdr'); if(!t){ return; }
  $('#clock').textContent = fmtClock(T.remain);
  $('#tstate').textContent = TIMER_LABELS[T.state] || '';
  $('#tstate').className = 'tstate ' + (T.state==='RUNNING'?'running':(T.state==='PAUSED_MANUAL'?'paused-manual':(T.state==='PAUSED_AUTO_CHECK'?'paused-check':'ended')));
  $('#tstate').setAttribute('aria-label','Timer state: '+(TIMER_LABELS[T.state]||''));
  var sum=0, cnt=0;
  for(var k in S.answered){ if(S.answered[k]){ sum += S.credits[k]; cnt++; } }
  var pct = cnt>0 ? Math.round((sum/cnt)*100) : 0;
  $('#lscore').innerHTML = '<b>'+sum.toFixed(1)+'</b> <span>/ '+cnt+' answered ('+pct+'%)</span>';
  var prog = Math.round((Object.keys(S.answered).length / S.order.length)*100);
  $('#pbarfill').style.width = (isFinite(prog)?prog:0) + '%';
  var px = $('#perex');
  if(px){ px.textContent = '\u23F1 Per-exercise timer: ' + fmtClock(S.perExLeft); }
}

function manualPause(){
  if(S.phase!=='exam' && S.phase!=='review'){ return; }
  if(T.state==='RUNNING' || T.state==='PAUSED_AUTO_CHECK'){
    setState('PAUSED_MANUAL');
    $('#btnPause').classList.add('hidden'); $('#btnResume').classList.remove('hidden');
    var m = mk('div','pausedmask'); m.id='pmask';
    m.innerHTML = '<div class="card"><div class="pl">\u23F8 PAUSED \u2014 manual (press Resume)</div>'+
      '<p>The exercise is hidden while you are on this break. The countdown is stopped.</p>'+
      '<button class="primary" id="btnResume2">\u25B6 Resume</button></div>';
    document.body.appendChild(m);
    m.querySelector('#btnResume2').addEventListener('click', manualResume);
    $('#exammain').classList.add('hidden');
  }
}
function manualResume(){
  var m = $('#pmask'); if(m){ m.remove(); }
  $('#exammain').classList.remove('hidden');
  $('#btnResume').classList.add('hidden'); $('#btnPause').classList.remove('hidden');
  T.lastTick = Date.now();
  if(S.checked[curEx() ? curEx().id : null]){ setState('PAUSED_AUTO_CHECK'); } else { setState('RUNNING'); }
}

/* per-type widget builders; each returns {node, collect()} */
function buildWidget(ex){
  var D = ex.data, body;
  if(ex.type==='mc'){
    var idxs = shuffle(D.options.map(function(_,i){return i;}));
    var wrap = mk('div','opts'); var sel = -1;
    idxs.forEach(function(oi, pos){
      var r = optRow(letters(pos), D.options[oi], false);
      r.addEventListener('click', function(){ sel = oi;
        wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
        r.classList.add('sel'); r.setAttribute('aria-pressed','true'); });
      wrap.appendChild(r);
    });
    body = wrap;
    return {node:body, collect:function(){ return {sel:sel}; }};
  }
  if(ex.type==='mcs'){
    var idxs2 = shuffle(D.options.map(function(_,i){return i;}));

/* ---------------- exercise lifecycle ---------------- */
function renderEx(){
  var ex = curEx(); if(!ex){ toReviewOrResults(); return; }
  S.widget = null;
  S.perExLeft = ex.perEx || 0;
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = (S.returnTo==='review' ? 'Returned skipped \u00B7 ' : '') + 'Exercise '+(S.idx+1)+' of '+S.order.length;
  main.appendChild(scenBlock(ex));
  var qb = mk('section','blk question');
  qb.appendChild(mk('header',null,'<span aria-hidden="true">\u276F</span> QUESTION'));
  qb.appendChild(mk('div','body','<p>'+ex.question+'</p>'));
  main.appendChild(qb);
  var ab = ansBlock(ex.ansNote);
  var w = buildWidget(ex);
  ab.querySelector('.body').appendChild(w.node);
  main.appendChild(ab);
  S.widget = w;
  var acts = mk('div','actions');
  var bh = mk('button','ghost','\u25C6 Hint (\u221210% credit)');
  bh.id='btnHint'; bh.type='button';
  bh.disabled = !!S.hintUsed[ex.id];
  bh.setAttribute('aria-label','Show one hint; costs 10 percent of this exercise credit');
  bh.addEventListener('click', function(){ doHint(ex); });
  var bs = mk('button','ghost','\u26A0 Skip');
  bs.id='btnSkip'; bs.type='button';
  bs.setAttribute('aria-label','Skip this exercise; it goes to the skipped pool without revealing the answer');
  bs.addEventListener('click', skipEx);
  var bc = mk('button','primary','\u2713 Check answer');
  bc.id='btnCheck'; bc.type='button';
  bc.setAttribute('aria-label','Check answer; the timer pauses until you press Next');
  bc.addEventListener('click', function(){ doCheck(false); });
  var bn = mk('button','primary hidden','Next \u25B6');
  bn.id='btnNext'; bn.type='button';
  bn.setAttribute('aria-label','Next exercise; the timer resumes');
  bn.addEventListener('click', nextEx);
  acts.appendChild(bh); acts.appendChild(bs); acts.appendChild(bc); acts.appendChild(bn);
  main.appendChild(acts);
  main.appendChild(mk('div',null,'')).id='fbhost';
  var hb2 = $('#hbtnHint'); var sb2 = $('#hbtnSkip');
  if(hb2){ hb2.classList.remove('hidden'); hb2.disabled = !!S.hintUsed[ex.id]; }
  if(sb2){ sb2.classList.remove('hidden'); sb2.disabled = false; }
  renderHeader();
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
}
function doCheck(auto){
  var ex = curEx();
  if(!ex || S.checked[ex.id]){ return; }
  var res = gradeEx(ex);
  var credit = res.credit;
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit - 0.10); }
  S.credits[ex.id] = credit; S.answered[ex.id] = true; S.checked[ex.id] = true; S.gradeDetail = res;
  S.autoChecked = !!auto;
  var p = S.skippedPool.indexOf(ex.id);
  if(p !== -1){ S.skippedPool.splice(p,1); }
  renderFeedback(ex, res, credit);
  $('#btnCheck').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');
  var hs = $('#hbtnSkip'); if(hs){ hs.classList.add('hidden'); }
  var hh = $('#hbtnHint'); if(hh){ hh.disabled = true; }
  var bn = $('#btnNext');
  bn.textContent = (S.returnTo==='review') ? 'Back to review \u25B6' : ((S.idx === S.order.length-1) ? 'Continue \u25B6' : 'Next \u25B6');
  if(T.state !== 'ENDED'){ setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
}
function skipEx(){
  var ex = curEx(); if(!ex || S.checked[ex.id]){ return; }
  if(S.skippedPool.indexOf(ex.id) === -1){ S.skippedPool.push(ex.id); }
  if(S.returnTo === 'review'){ S.returnTo = null; if(T.state==='PAUSED_AUTO_CHECK'){ setState('RUNNING'); } renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
function nextEx(){
  var ex = curEx();
  if(T.state === 'PAUSED_AUTO_CHECK'){ setState('RUNNING'); }
  if(S.returnTo === 'review'){ S.returnTo = null; renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
/* ---------------- grading per type ---------------- */
function gradeEx(ex){
  var D = ex.data, c = S.widget.collect(), out = {H:0,W:0,N:0,items:[],dangerous:false};
  function mkItems(states){ for(var i=0;i<ex.items.length;i++){ out.items.push({label:ex.items[i].label, note:ex.items[i].note||'', state:states[i]||'miss'}); } }
  if(ex.type==='mc'){
    out.N = 1;
    if(c.sel === D.correct){ out.H = 1; mkItems(['ok']); } else if(c.sel === -1){ mkItems(['miss']); } else { mkItems(['bad']); }
  } else if(ex.type==='mcs'){
    var corr = D.correct; out.N = corr.length;
    var sel = c.sel || [];
    var states = [];
    for(var i=0;i<ex.items.length;i++){
      var wasSel = sel.indexOf(i) !== -1;
      var isCorr = corr.indexOf(i) !== -1;
      if(wasSel && isCorr){ out.H++; states.push('ok'); }
      else if(wasSel && !isCorr){ out.W++; states.push('bad'); }
      else if(!wasSel && isCorr){ states.push('miss'); }
      else { states.push('miss'); }
    }
    mkItems(states);
  } else if(ex.type==='order'){
    out.N = D.entries.length;
    var st2 = [];
    for(var p=0; p<out.N; p++){
      if(p < c.placed.length){
        if(c.placed[p] === p){ out.H++; st2.push('ok'); } else { out.W++; st2.push('bad'); }
      } else { st2.push('miss'); }
    }
    mkItems(st2);
  } else if(ex.type==='match'){
    out.N = D.lefts.length;
    var st3 = [];
    for(var l=0; l<out.N; l++){
      if(c.picks[l] === null){ st3.push('miss'); }
      else if(c.picks[l] === D.correct[l]){ out.H++; st3.push('ok'); }
      else { out.W++; st3.push('bad'); }
    }
    mkItems(st3);
  } else if(ex.type==='fill'){
    out.N = D.blanks.length;
    var st4 = [];
    for(var b=0; b<out.N; b++){
      var v = (c.vals[b]||'');
      if(v.trim()===''){ st4.push('miss'); }
      else {
        var nv = norm(v); var ok = false;
        for(var a=0; a<D.blanks[b].length; a++){ if(nv === norm(D.blanks[b][a])){ ok = true; break; } }
        if(ok){ out.H++; st4.push('ok'); } else { out.W++; st4.push('bad'); }
      }
    }
    mkItems(st4);
  } else if(ex.type==='dnd'){
    out.N = D.items.length;
    var zoneOf = {};
    for(var z=0; z<c.inzone.length; z++){ zoneOf[c.inzone[z].oi] = c.inzone[z].zi; }
    var st5 = [];
    for(var oi=0; oi<out.N; oi++){
      if(zoneOf[oi] === undefined){ st5.push('miss'); }
      else if(zoneOf[oi] === D.correct[oi]){ out.H++; st5.push('ok'); }
      else { out.W++; st5.push('bad'); }
    }
    mkItems(st5);
  } else if(ex.type==='term'){
    var needs = D.elements.filter(function(e){ return e.kind==='need'; });
    var forbids = D.elements.filter(function(e){ return e.kind==='forbid'; });
    out.N = needs.length;
    var txts;
    if(D.mode==='seq'){ txts = c.answers || []; }
    else { txts = [c.input || ''].concat(c.transcript || []); }
    var joined = norm(txts.join(' \u00A6 '));
    var st6 = [];
    for(var nI=0; nI<needs.length; nI++){
      var re = new RegExp(needs[nI].re, 'i');
      var anyHit = false;
      if(D.mode==='seq'){
        /* grade each seq element against its own answer line */
        if(txts[nI] !== undefined && re.test(norm(txts[nI]))){ anyHit = true; }
      } else {
        for(var tI=0; tI<txts.length; tI++){ if(re.test(norm(txts[tI]))){ anyHit = true; break; } }
      }
      if(anyHit){ out.H++; st6.push('ok'); } else { st6.push('miss'); }
    }
    var nI2 = 0, fI2 = 0;
    for(var i7=0; i7<ex.items.length; i7++){
      var itm = ex.items[i7];
      if(itm.kind === 'forbid'){
        var fEl = D.elements.filter(function(e){ return e.kind==='forbid' && e.label===itm.label; })[0];
        var bad = fEl ? new RegExp(fEl.re,'i').test(joined) : false;
        if(bad){ out.W++; }
        out.items.push({label:itm.label, note:itm.note||'', state: bad?'bad':'ok'});
      } else {
        out.items.push({label:itm.label, note:itm.note||'', state: st6[nI2]||'miss'}); nI2++;
      }
    }
    if(D.dangerRe && new RegExp(D.dangerRe.re,'i').test(joined)){ out.dangerous = true; }
  } else if(ex.type==='flow'){
    out.N = D.steps.length;
    var st7 = [];
    for(var sI=0; sI<out.N; sI++){
      var pick = c.picks[sI];
      if(pick === undefined || pick === null){ st7.push('miss'); }
      else if(pick === D.steps[sI].correct){ out.H++; st7.push('ok'); }
      else { out.W++; st7.push('bad'); }
    }
    mkItems(st7);
  } else if(ex.type==='selects'){
    out.N = D.slots.length;
    var st8 = [];
    for(var q=0; q<out.N; q++){
      var pk = c.picks[q];
      if(pk === null || pk === undefined){ st8.push('miss'); }
      else if(pk === D.slots[q].correct){ out.H++; st8.push('ok'); }
      else { out.W++; st8.push('bad'); }
    }
    mkItems(st8);
  }
  var credit = out.N > 0 ? Math.max(0,(out.H-out.W)/out.N) : 0;
  out.credit = credit;
  return out;
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex, res, credit){
  var host = $('#fbhost'); if(!host){ return; }
  host.innerHTML='';
  var cls = credit >= 0.999 ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
  var icon = credit >= 0.999 ? '\u2713' : (credit > 0 ? '\u2713' : '\u2717');
  var word = credit >= 0.999 ? 'CORRECT' : (credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT');
  var fb = mk('section','feedback '+cls);
  var sub = credit >= 0.999 ? '' : (credit > 0 ? ' \u2014 credit '+credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' items' : '');
  var fhd = mk('header',null,'');
  fhd.innerHTML = '<span aria-hidden="true">'+icon+'</span> '+word+sub+
    (S.autoChecked ? ' <span class="exTimerNote">(auto-checked: the per-exercise timer reached zero)</span>' : '');
  fb.appendChild(fhd);
  fb.setAttribute('role','status');
  fb.setAttribute('aria-label', word);
  var body = mk('div','fbody');
  body.appendChild(mk('p','credline','Scoring formula: credit = max(0, (H \u2212 W) / N) = max(0, ('+res.H+' \u2212 '+res.W+') / '+res.N+') = '+credit.toFixed(2)+
    (S.hintUsed[ex.id] ? ' \u00B7 hint used: \u22120.10 applied' : '')));
  if(res.items.length > 0){
    var it = mk('div','items');
    for(var i=0;i<res.items.length;i++){
      var it_ = res.items[i];
      var stTxt = it_.state==='ok' ? '<span class="st">\u2713 Correct</span>' : (it_.state==='bad' ? '<span class="st">\u2717 Wrong</span>' : '<span class="st">\u25CB Missed</span>');
      var row = mk('div','itemrow '+(it_.state==='ok'?'ok':(it_.state==='bad'?'bad':'miss')));
      row.innerHTML = stTxt + '<span><b>'+it_.label+'</b> \u2014 '+it_.note+'</span>';
      it.appendChild(row);
    }
    body.appendChild(it);
  }
  if(res.dangerous){
    var dw = mk('div','itemrow bad');
    dw.innerHTML = '<span class="st">\u2717 DANGEROUS \u2014 NEAR MISS</span><span>'+ex.data.dangerNote+'</span>';
    body.appendChild(dw);
  }
  body.appendChild(mk('div','canon','<span class="clabel">Correct answer</span>'+(ex.correct||'')));
  body.appendChild(mk('p',null,ex.expl));
  fb.appendChild(body);
  host.appendChild(fb);
  fb.scrollIntoView({behavior:(smoothOK()?'smooth':'auto'), block:'nearest'});
}
/* ---------------- review skipped ---------------- */
function renderReview(){
  S.phase = 'review';
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = 'Review skipped exercises';
  var hbR = $('#hbtnHint'); if(hbR){ hbR.classList.add('hidden'); }
  var sbR = $('#hbtnSkip'); if(sbR){ sbR.classList.add('hidden'); }
  main.appendChild(mk('section','blk scenario')).innerHTML = '';
  var sb = main.querySelector('section');
  sb.innerHTML = '<header><span aria-hidden="true">\u26A0</span> REVIEW SKIPPED EXERCISES</header><div class="body">'+
    '<p>You skipped '+S.skippedPool.length+' exercise(s). You can return to any of them and answer it, as many times as you need, while the timer is still running ('+fmtClock(T.remain)+' left).</p>'+
    '<p>If you submit now, every skipped-and-never-answered exercise is excluded from the score: it counts as neither correct nor wrong, and its points are not added to the total possible points.</p></div>';
  S.skippedPool.forEach(function(id, i){
    var ex = EXAM.exercises.filter(function(x){ return x.id===id; })[0];
    var row = mk('div','skipitem');
    row.innerHTML = '<span class="t">\u26A0 Skipped</span><span>'+ex.summary+'</span>';
    var b = mk('button','primary','Answer now');
    b.type='button';
    b.addEventListener('click', function(){
      S.returnTo = 'review';
      S.idx = S.order.map(function(x){return x.id;}).indexOf(id);
      S.phase = 'exam';
      renderEx();
    });
    row.appendChild(b);
    main.appendChild(row);
  });
  var acts = mk('div','actions');
  var sub2 = mk('button','primary','\u2713 Submit exam (final results)');
  sub2.type='button'; sub2.setAttribute('aria-label','Submit exam and show final results');
  sub2.addEventListener('click', function(){ finishExam(); });
  acts.appendChild(sub2);
  main.appendChild(acts);
  renderHeader();
}
/* ---------------- results ---------------- */
function finishExam(){
  S.phase = 'results';
  setState('ENDED');
  var hpF = $('#btnPause'); if(hpF){ hpF.classList.add('hidden'); }
  var hbF = $('#hbtnHint'); if(hbF){ hbF.classList.add('hidden'); }
  var sbF = $('#hbtnSkip'); if(sbF){ sbF.classList.add('hidden'); }
  var main = $('#exammain'); if(main){ main.remove(); }
  var sum = 0, cnt = 0, full = 0, part = 0, partSum = 0, zero = 0, skipped = 0;
  S.order.forEach(function(ex){
    if(S.answered[ex.id]){
      cnt++; sum += S.credits[ex.id];
      var cr = S.credits[ex.id];
      if(cr >= 0.999){ full++; } else if(cr > 0){ part++; partSum += cr; } else { zero++; }
    } else if(S.skippedPool.indexOf(ex.id) !== -1 || S.checked[ex.id] !== true){ skipped++; }
  });
  var pct = cnt > 0 ? Math.round((sum/cnt)*100) : 0;
  var passed = pct >= EXAM.passMark;
  var used = EXAM.timerSeconds - T.remain;
  var wrap = mk('main','wrap results'); wrap.id='resmain';
  var v = mk('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML = (passed ? '\u2713 PASS' : '\u2717 FAIL') + ' \u2014 final score '+sum.toFixed(1)+' / '+cnt+' answered \u2014 <span class="big">'+pct+'%</span>';
  var grid = mk('div','resgrid');
  grid.innerHTML =
    '<div class="rescard ok"><div class="n">'+full+'</div><div>\u2713 Fully correct</div></div>'+
    '<div class="rescard part"><div class="n">'+part+'</div><div>\u2713 Partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="rescard bad"><div class="n">'+zero+'</div><div>\u2717 Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="n">'+skipped+'</div><div>\u26A0 Skipped \u2014 excluded</div></div>';
  var info = mk('div','card');
  info.innerHTML = '<p><b>Time used:</b> '+fmtClock(used)+' of '+fmtClock(EXAM.timerSeconds)+' budget \u00B7 <b>Paused manually:</b> '+fmtClock(S.manualTotal)+
    ' \u00B7 <b>Paused for feedback review:</b> '+fmtClock(S.reviewTotal)+'</p>'+
    '<p>Percentage computed over answered exercises only. Pass mark: '+EXAM.passMark+'%. '+(passed ?
    'Well done \u2014 you demonstrated a working command of '+EXAM.objectID+' at this severity.' :
    'You must retake this exam to reach the pass mark. Study the explanations you saw after each Check, then press Retake Exam.')+'</p>';
  var acts = mk('div','actions');
  var rb = mk('button','primary','\u21BA Retake Exam');
  rb.type='button'; rb.setAttribute('aria-label','Retake the exam with reshuffled questions');
  rb.addEventListener('click', retake);
  acts.appendChild(rb);
  wrap.appendChild(v); wrap.appendChild(grid); wrap.appendChild(info); wrap.appendChild(acts);
  $('#app').appendChild(wrap);
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
  if(!S.reported){ S.reported = true; reportScore(sum, cnt); }
}
/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(creditSum*10)/10,
      total: answeredCount,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  } catch(e) { /* opened directly, not inside the site */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  S.user = event.data.username || '';
  S.country = event.data.country || '';
  S.locale = event.data.locale || 'en';
  /* theme field is always 'dark'; the file is dark-only by contract, nothing to toggle */
});
/* ---------------- retake ---------------- */
function retake(){
  var hpR = $('#btnPause'); if(hpR){ hpR.classList.remove('hidden'); }
  S.idx = 0; S.credits = {}; S.answered = {}; S.checked = {}; S.hintUsed = {};
  S.skippedPool = []; S.returnTo = null; S.flowState = {}; S.manualTotal = 0; S.reviewTotal = 0;
  S.reported = false; S.autoChecked = false;
  T.remain = EXAM.timerSeconds; T.state = 'IDLE';
  S.order = shuffle(EXAM.exercises);
  var rm = $('#resmain'); if(rm){ rm.remove(); }
  var em = $('#exammain');
  if(!em){ em = mk('main','wrap'); em.id='exammain'; $('#app').appendChild(em); }
  else { em.innerHTML=''; }
  startTimer();
  renderEx();
}
/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', function(){ renderIntro(); });

</script>
