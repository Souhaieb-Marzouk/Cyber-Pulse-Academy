/* ================= widgets ================= */
function makeWidget(ex){
  var w=$('widget');
  if(ex.type==='mcq'||ex.type==='multi') return wChoice(ex,w);
  if(ex.type==='match') return wMatch(ex,w);
  if(ex.type==='sort') return wSort(ex,w);
  if(ex.type==='order') return wOrder(ex,w);
  if(ex.type==='blank') return wBlank(ex,w);
  if(ex.type==='terminal') return wTerminal(ex,w);
  if(ex.type==='flow') return wFlow(ex,w);
  return wChoice(ex,w);
}
function wChoice(ex,root){
  var opts=shuffle(ex.options);
  var sel={};
  root.innerHTML='<div class="opts">'+opts.map(function(o,i){
    return '<button type="button" class="opt" data-oid="'+o.id+'"><span class="tag">'+letters(i)+'.</span><span>'+o.t+'</span><span class="selmark" aria-hidden="true"></span></button>';
  }).join('')+'</div>';
  var multi=(ex.type==='multi');
  root.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=btn.getAttribute('data-oid');
      if(multi){ sel[id]=!sel[id]; btn.classList.toggle('sel',!!sel[id]); btn.querySelector('.selmark').textContent=sel[id]?'● Selected':''; }
      else{
        for(var k in sel){ delete sel[k]; }
        root.querySelectorAll('.opt').forEach(function(b){ b.classList.remove('sel'); b.querySelector('.selmark').textContent=''; });
        sel[id]=true; btn.classList.add('sel'); btn.querySelector('.selmark').textContent='● Selected';
      }
    });
  });
  return { ex:ex, getValue:function(){ return Object.keys(sel).filter(function(k){return sel[k];}); },
           lock:function(){ root.querySelectorAll('.opt').forEach(function(b){ b.disabled=true; }); } };
}
function wMatch(ex,root){
  var rights=shuffle(ex.right);
  root.innerHTML='<div class="small">For each item on the left, choose the matching item from the list.</div><div class="opts">'+
    ex.left.map(function(l,i){
      return '<div class="opt" style="cursor:default;flex-wrap:wrap"><span class="tag">'+(i+1)+'.</span><span style="flex:1 1 240px">'+l.t+'</span>'+
        '<select data-lid="'+l.id+'" aria-label="Match for: '+esc(l.t)+'"><option value="">— choose —</option>'+
        rights.map(function(r){ return '<option value="'+r.id+'">'+r.t+'</option>'; }).join('')+'</select></div>';
    }).join('')+'</div>';
  return { ex:ex, getValue:function(){
      var v={}; root.querySelectorAll('select[data-lid]').forEach(function(s){ v[s.getAttribute('data-lid')]=s.value; }); return v;
    }, lock:function(){ root.querySelectorAll('select').forEach(function(s){ s.disabled=true; }); } };
}
function wSort(ex,root){
  var toks=shuffle(ex.tokens);
  root.innerHTML='<div class="dnd-hintline">Drag each card into a box — or click a card to pick it up, then click a box. The ↩ button puts a card back.</div>'+
    '<div class="dnd"><div class="dnd-bank" id="dnd-bank" data-zone="__bank"><div class="zone-h">(cards to sort)</div></div><div class="zones">'+
    ex.zones.map(function(z){ return '<div class="zone" data-zone="'+z.id+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(z.label)+'"><div class="zone-h">▣ '+esc(z.label)+'</div></div>'; }).join('')+
    '</div></div>';
  var loc={}; toks.forEach(function(t){ loc[t.id]='__bank'; });
  function paint(){
    ex.zones.forEach(function(z){ var zEl=root.querySelector('.zone[data-zone="'+z.id+'"]'); zEl.querySelectorAll('.token').forEach(function(t){ t.remove(); }); });
    var bank=root.querySelector('#dnd-bank'); bank.querySelectorAll('.token').forEach(function(t){ t.remove(); });
    toks.forEach(function(t){
      var el=document.createElement('button'); el.type='button'; el.className='token'; el.draggable=true; el.setAttribute('data-tid',t.id);
      el.innerHTML='<span>'+t.t+'</span><span class="rm" role="button" aria-label="Return card to bank" title="Return card">↩</span>';
      el.addEventListener('dragstart',function(ev){ el.classList.add('dragging'); try{ ev.dataTransfer.setData('text/plain',t.id); }catch(e){} });
      el.addEventListener('dragend',function(){ el.classList.remove('dragging'); });
      el.addEventListener('click',function(ev){
        if(ev.target.classList.contains('rm')){ loc[t.id]='__bank'; paint(); return; }
        root.querySelectorAll('.token').forEach(function(x){ x.classList.remove('picked'); });
        el.classList.add('picked'); el.setAttribute('data-picked','1');
      });
      var host=(loc[t.id]==='__bank')?bank:root.querySelector('.zone[data-zone="'+loc[t.id]+'"]');
      host.appendChild(el); if(loc[t.id]!=='__bank') el.classList.add('token-inzone');
    });
  }
  ex.zones.forEach(function(z){
    var zEl=root.querySelector('.zone[data-zone="'+z.id+'"]');
    function drop(tid){ if(!tid) return; loc[tid]=z.id; paint(); }
    zEl.addEventListener('dragover',function(ev){ ev.preventDefault(); zEl.classList.add('drag-over'); });
    zEl.addEventListener('dragleave',function(){ zEl.classList.remove('drag-over'); });
    zEl.addEventListener('drop',function(ev){ ev.preventDefault(); zEl.classList.remove('drag-over'); drop(ev.dataTransfer.getData('text/plain')); });
    zEl.addEventListener('click',function(){ var p=root.querySelector('.token.picked'); if(p){ drop(p.getAttribute('data-tid')); } });
    zEl.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ var p=root.querySelector('.token.picked'); if(p){ ev.preventDefault(); drop(p.getAttribute('data-tid')); } } });
  });
  paint();
  return { ex:ex, getValue:function(){ return loc; }, lock:function(){ root.querySelectorAll('.token').forEach(function(b){ b.draggable=false; b.disabled=true; }); } };
}
function wOrder(ex,root){
  var items=shuffle(ex.items);
  root.innerHTML='<div class="dnd-hintline">Drag rows to reorder — or use the ▲ ▼ buttons. First row = first event.</div><div class="ordlist" id="ordlist"></div>';
  var ord=items.map(function(i){ return i.id; });
  function paint(){
    var list=root.querySelector('#ordlist'); list.innerHTML='';
    ord.forEach(function(id,i){
      var it=ex.items.filter(function(x){return x.id===id;})[0];
      var el=document.createElement('div'); el.className='orditem'; el.draggable=true; el.setAttribute('data-oid',id);
      el.innerHTML='<span class="num">'+(i+1)+'</span><span class="txt">'+it.t+'</span><span class="mv">'+
        '<button type="button" aria-label="Move up" onclick="EX_ordMove(-1,this)">▲</button><button type="button" aria-label="Move down" onclick="EX_ordMove(1,this)">▼</button></span>';
      el.addEventListener('dragstart',function(ev){ el.classList.add('dragging'); try{ ev.dataTransfer.setData('text/plain',id); }catch(e){} });
      el.addEventListener('dragend',function(){ el.classList.remove('dragging'); });
      el.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      el.addEventListener('drop',function(ev){ ev.preventDefault(); var src=ev.dataTransfer.getData('text/plain'); if(!src||src===id) return;
        var from=ord.indexOf(src), to=ord.indexOf(id); ord.splice(from,1); ord.splice(to,0,src); paint(); });

    var el=btn?btn.closest('.orditem'):null;
    if(!el) return; var id=el.getAttribute('data-oid'); var i=ord.indexOf(id); var j=i+dir; if(j<0||j>=ord.length) return;
    var t=ord[i]; ord[i]=ord[j]; ord[j]=t; paint();
    var ne=document.querySelector('.orditem[data-oid="'+id+'"] .mv button:nth-child('+(dir>0?2:1)+')'); if(ne) ne.focus();
  };
  paint();
  return { ex:ex, getValue:function(){ return ord.slice(); }, lock:function(){ root.querySelectorAll('.orditem .mv button').forEach(function(b){ b.disabled=true; }); root.querySelectorAll('.orditem').forEach(function(d){ d.draggable=false; }); } };
}
function wBlank(ex,root){

function wTerminal(ex,root){
  var sh=ex.shell;
  var h='';
  if(ex.syntax){
    h+='<div class="syntaxpanel"><div class="h">SYNTAX REMINDER</div><div class="codeblock" style="margin:6px 0">'+ex.syntax.shape+'</div>'+
       '<ul>'+ex.syntax.notes.map(function(n){ return '<li>'+n+'</li>'; }).join('')+'</ul>'+
       (ex.syntax.example?'<div style="margin-top:6px" class="small">Example on a different target:<br><span class="mono" style="color:var(--text-mono)">'+esc(ex.syntax.example)+'</span></div>':'')+'</div>';
  }
  if(ex.sample){
    h+='<div class="syntaxpanel"><div class="h">EXPECTED OUTPUT SHAPE</div><div class="codeblock" style="margin:6px 0">'+ex.sample.map(esc).join('\n')+'</div></div>';
  }
  h+='<div class="term"><div class="term-h"><span class="lamp g" aria-hidden="true"></span>'+esc(sh.user)+'@'+esc(sh.host)+' — simulation only, nothing real runs</div>'+
     '<div class="term-scroll" id="term-scroll" aria-live="polite">'+sh.welcome.map(function(l){ return '<span class="dim">'+esc(l)+'</span>'; }).join('\n')+'\n</div>'+
     '<div class="term-line"><span class="pr">'+esc(sh.prompt)+'</span><input id="term-in" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div></div>'+
     '<div class="small" style="margin-top:8px">Type the command and press Enter to run it. Press Check when your last command is the one you want to submit.</div>';
  root.innerHTML=h;
  var sc=root.querySelector('#term-scroll'), inp=root.querySelector('#term-in');
  var lastCmd='';
  function run(){
    var cmd=inp.value; if(!cmd.trim()) return;
    lastCmd=cmd; inp.value='';
    var line='<span class="dim">'+esc(sh.prompt)+'</span> '+esc(cmd);
    var norm=normCmd(cmd);
    var out='';
    if(ex.successRegex&&new RegExp(ex.successRegex,'i').test(norm)){ out=ex.output.map(function(l){ return '<span class="out">'+esc(l)+'</span>'; }).join('\n'); }
    else if(ex.nearMissRegex&&new RegExp(ex.nearMissRegex,'i').test(norm)){ out='<span class="err">⛔ DANGEROUS — NEAR MISS ('+esc(ex.nearMissLabel||'state-changing command')+')</span>\n<span class="err">'+esc(ex.nearMissNote||'This command pattern changes state and is not allowed in this lab.')+'</span>'; }
    else{ out='<span class="err">command not found: the lab shell only understands the command this exercise asks for</span>'; }
    sc.innerHTML+='\n'+line+'\n'+out+'\n'; sc.scrollTop=sc.scrollHeight;
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); run(); } });
  return { ex:ex, getValue:function(){ return lastCmd; }, lock:function(){ inp.disabled=true; } };
}
function normCmd(c){ return String(c||'').trim().replace(/\s+/g,' '); }
function wFlow(ex,root){
  CUR_step={i:0,chosen:[]};
  root.innerHTML='<div id="flow-box"></div>';
  paintFlow(ex,root);
  return { ex:ex, getValue:function(){ return CUR_step.chosen; }, lock:function(){ root.querySelectorAll('.opt,select,button').forEach(function(b){ b.disabled=true; }); } };
}
var CUR_step=null;
function flowComplete(ex){ return CUR_step&&CUR_step.chosen.length>=ex.steps.length; }
function paintFlow(ex,root){
  var box=root.querySelector('#flow-box'); var i=CUR_step.i; var st=ex.steps[i];
  var done=CUR_step.chosen.map(function(c,k){ return '<span>Step '+(k+1)+' — done</span>'; }).join('');
  var h='';
  if(done) h+='<div class="stepdone">'+done+'</div>';
  h+='<div class="flow-step">STEP '+(i+1)+' OF '+ex.steps.length+'</div>';
  h+='<div style="margin-bottom:8px">'+st.text+'</div><div class="opts">';
  h+=st.options.map(function(o,k){ return '<button type="button" class="opt" data-oid="'+o.id+'"><span class="tag">'+letters(k)+'.</span><span>'+o.t+'</span></button>'; }).join('');
  h+='</div><div id="flow-cq"></div>';
  box.innerHTML=h;
  box.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      box.querySelectorAll('.opt').forEach(function(b){ b.disabled=true; });
      var oid=btn.getAttribute('data-oid');
      CUR_step.chosen.push(oid);
      var cq=st.conseq[oid]||'';
      box.querySelector('#flow-cq').innerHTML='<div class="conseq">'+cq+'</div>'+
        (i+1<ex.steps.length?'<button class="btn" onclick="EX_flowNext()">→ Confirm &amp; continue</button>':'<button class="btn primary" onclick="EX_flowDone()">→ Confirm &amp; finish scenario — Check is now ready</button>');
    });
  });
}
function EX_flowNext(){ CUR_step.i++; paintFlow(curExercise(),$('widget')); }
function EX_flowDone(){ renderNav(curExercise(),false); var b=$('btn-check'); if(b){ b.disabled=false; b.focus(); } }

/* part C: grading, feedback, review/results, site reporting, boot */
'use strict';
function itRow(label,state,note){ return {label:label,state:state,note:note}; }
function why(ex,id){ return (ex.itemWhy&&ex.itemWhy[id])?(' '+ex.itemWhy[id]):''; }
function optText(ex,id){ var o=(ex.options||[]).filter(function(x){return x.id===id;})[0]; return o?o.t:id; }
function rText(ex,arr,id){ var o=(arr||[]).filter(function(x){return x.id===id;})[0]; return o?o.t:id; }

function gradeExercise(ex){
  var res={H:0,W:0,N:0,items:[],danger:[]};
  var g=CUR?CUR.getValue():null;
  var selmap={}; (ex.type==='mcq'||ex.type==='multi')?(g||[]).forEach(function(id){ selmap[id]=true; }):null;
  if(ex.type==='mcq'||ex.type==='multi'){
    res.N=ex.answer.length;
    ex.options.forEach(function(o){
      var inAns=ex.answer.indexOf(o.id)>=0;
      if(inAns){
        if(selmap[o.id]){ res.H++; res.items.push(itRow(o.t,'c','✓ You selected this — it belongs in the answer.'+why(ex,o.id))); }
        else{ res.items.push(itRow(o.t,'m','○ You missed this item.'+(why(ex,o.id)||' It belongs in the answer.'))); }
      } else if(selmap[o.id]){ res.W++; res.items.push(itRow(o.t,'w','✗ You selected this, but it is not part of the answer here.'+why(ex,o.id))); }
    });
  } else if(ex.type==='match'){
    res.N=ex.left.length;
    ex.left.forEach(function(l){
      var chosen=(g||{})[l.id]||''; var ok=chosen===ex.answer[l.id];
      var mine=chosen?('“'+rText(ex,ex.right,chosen)+'”'):'(no choice made)';
      var corr='“'+rText(ex,ex.right,ex.answer[l.id])+'”';
      if(ok){ res.H++; res.items.push(itRow(l.t,'c','✓ Correct match: '+corr+'.'+why(ex,l.id))); }
      else{ res.W++; res.items.push(itRow(l.t,'w','✗ You chose '+mine+'. Correct: '+corr+'.'+why(ex,l.id))); }
    });
  } else if(ex.type==='sort'){
    res.N=ex.tokens.length;
    var zlab={}; ex.zones.forEach(function(z){ zlab[z.id]=z.label; });
    ex.tokens.forEach(function(t){
      var z=(g||{})[t.id]; var ok=z===ex.answer[t.id];
      if(ok){ res.H++; res.items.push(itRow(t.t,'c','✓ Correctly placed in “'+zlab[z]+'”.'+why(ex,t.id))); }
      else{ res.W++; res.items.push(itRow(t.t,'w','✗ You placed it in “'+(zlab[z]||'no box')+'”. Correct: “'+zlab[ex.answer[t.id]]+'”.'+why(ex,t.id))); }
    });
  } else if(ex.type==='order'){
    res.N=ex.items.length;
    ex.items.forEach(function(it,i){
      var placed=(g||[])[i]; var ok=placed===it.id;
      if(ok){ res.H++; res.items.push(itRow('Position '+(i+1)+' — '+it.t,'c','✓ Correct position.'+why(ex,it.id))); }
      else{ res.W++; res.items.push(itRow('Position '+(i+1)+' — should be “'+it.t+'”','w','✗ You placed “'+rText(ex,ex.items,placed)+'” here.'+why(ex,it.id))); }
    });
  } else if(ex.type==='blank'){
    var slots=ex.template.match(/\{\{(b\d+)\}\}/g)||[];
    res.N=slots.length;
    slots.forEach(function(sl,i){
      var key=sl.replace(/[{}]/g,''); var chosen=(g||{})[key]||''; var ok=chosen===ex.answer[key];
      var corr=rText(ex,ex.bank,ex.answer[key]); var mine=chosen?('“'+rText(ex,ex.bank,chosen)+'”'):'(empty)';
      if(ok){ res.H++; res.items.push(itRow('Blank '+(i+1),'c','✓ Correct: “'+corr+'”.'+why(ex,key))); }
      else{ res.W++; res.items.push(itRow('Blank '+(i+1),'w','✗ You chose '+mine+'. Correct: “'+corr+'”.'+why(ex,key))); }
    });
  } else if(ex.type==='terminal'){
    var cmd=normCmd(g||'');
    res.N=ex.elements.length;
    ex.elements.forEach(function(el){
      var ok=el.accept&&new RegExp(el.accept,'i').test(cmd);
      if(ok){ res.H++; res.items.push(itRow(el.label,'c','✓ Found in your command.'+why(ex,el.id))); }
      else{ res.items.push(itRow(el.label,'m','○ Not found in your command. Expected: '+el.desc)); }
    });
    if(ex.nearMissRegex&&cmd&&new RegExp(ex.nearMissRegex,'i').test(cmd)){
      res.W+=(ex.nearMissWeight||1);
      res.danger.push(ex.nearMissNote||'This command pattern is close but dangerous.');
      res.items.push(itRow(ex.nearMissLabel||'Near-miss pattern','w','✗ DANGEROUS — NEAR MISS. '+(ex.nearMissNote||'')));
    }
  } else if(ex.type==='flow'){
    res.N=ex.steps.length;
    ex.steps.forEach(function(st,i){
      var mine=(g||[])[i]; var ok=mine===st.correct;
      if(ok){ res.H++; res.items.push(itRow('Step '+(i+1),'c','✓ Good decision: “'+rText(ex,st.options,mine)+'”.'+why(ex,'s'+i))); }
      else{ res.W++; res.items.push(itRow('Step '+(i+1),'w','✗ You chose “'+rText(ex,st.options,mine)+'”. Better: “'+rText(ex,st.options,st.correct)+'”.'+why(ex,'s'+i))); }
    });
  }
  return res;
}
function lockWidget(){ if(CUR&&CUR.lock){ CUR.lock(); } }

/* ---------- Check / Next / Skip / Hint ---------- */
function EX_check(){
  var ex=curExercise(); if(!ex||S.lastGrade[ex.id]) return;
  if(ex.type==='flow'&&(!CUR_step||CUR_step.chosen.length<ex.steps.length)) return;
  timerSet('PAUSED_AUTO_CHECK'); /* first action: stop the clock before feedback renders */
  var res=gradeExercise(ex);
  var credit=Math.max(0,(res.H-res.W)/res.N);
  if(S.hintUsed[ex.id]) credit=Math.max(0,credit-0.10);
  S.credits[ex.id]=credit; delete S.skipped[ex.id];
  S.lastGrade[ex.id]=res;
  lockWidget();
  renderFeedback(ex,res,credit);
  renderNav(ex,true);
  renderTopbar();
}
window.EX_check=EX_check;
function EX_next(){
  if(T&&T.state==='PAUSED_AUTO_CHECK') timerSet('RUNNING');
  if(S.fromReview){ S.fromReview=false; showReview(true); return; }
  if(S.idx>=S.order.length-1){ endAttempt(); } else { gotoIdx(S.idx+1); }
}
window.EX_next=EX_next;
function EX_skip(){
  var ex=curExercise(); if(!ex||S.credits.hasOwnProperty(ex.id)) return;
  S.skipped[ex.id]=true;
  if(S.fromReview){ S.fromReview=false; showReview(true); return; }
  if(S.idx>=S.order.length-1){ endAttempt(); } else { gotoIdx(S.idx+1); }
}
window.EX_skip=EX_skip;
function EX_hint(){
  var ex=curExercise(); if(!ex||S.hintUsed[ex.id]||S.credits.hasOwnProperty(ex.id)) return;
  S.hintUsed[ex.id]=true;
  $('hint-slot').innerHTML='<div class="hintbox" role="note"><div class="h">💡 HINT — using it costs 10% of this exercise\'s credit</div>'+ex.hint+'</div>';
  renderTopbar();
}
window.EX_hint=EX_hint;
function EX_finish(){ endAttempt(); }
window.EX_finish=EX_finish;
function EX_submit(){ endAttempt(); }
window.EX_submit=EX_submit;
function endAttempt(){
  var sk=skippedIds();
  if(sk.length>0){
    if(T&&T.state==='PAUSED_AUTO_CHECK'){ timerSet('RUNNING'); } /* leaving feedback: review happens on the running clock */
    showReview(T&&T.state!=='ENDED');
  }
  else{ if(T&&T.state!=='ENDED') timerSet('ENDED'); timerStopClock(); showResults(); }
}
function onTimeEnd(){
  timerStopClock();
  var sk=skippedIds();
  if(sk.length>0&&S.phase==='exam'){ showReview(false); }
  else if(S.phase!=='results'){ showResults(); }
}
function perExExpire(){
  S.perExRemaining=0;
  var ex=curExercise();
  if(ex&&ex.perExTimer&&!S.lastGrade[ex.id]&&!S.credits.hasOwnProperty(ex.id)){ EX_check(); }
}

/* ---------- feedback ---------- */
function renderFeedback(ex,res,credit){
  var cls= credit>=1?'correct':(credit>0?'partial':'incorrect');
  var icon= credit>=1?'✓':(credit>0?'✓':'✗');
  var word= credit>=1?'CORRECT':(credit>0?'PARTIALLY CORRECT':'INCORRECT');
  var h='<div class="fb '+cls+'" role="status"><div class="fb-h"><span>'+icon+' '+word+'</span>'+
    (res.N>1?'<span class="fb-credit">'+Math.round(res.H)+' / '+res.N+' items · credit '+credit.toFixed(2)+'</span>':'')+
    '</div><div class="fb-b">';
  if(res.N>1){
    h+='<div class="fb-items">'+res.items.map(function(it){
      var sc= it.state==='c'?'<span class="st s-c">✓ Correct</span>':(it.state==='w'?'<span class="st s-w">✗ Wrong</span>':'<span class="st s-m">○ Missed</span>');
      return '<div class="fb-item">'+sc+'<span><b>'+it.label+'</b> — '+it.note+'</span></div>';
    }).join('')+'</div>';
  }
  (res.danger||[]).forEach(function(d){ h+='<div class="fb-item" style="border-color:var(--state-incorrect)"><span class="st s-w">✗ DANGEROUS — NEAR MISS</span><span>'+d+'</span></div>'; });
  if(ex.type==='terminal'){
    h+='<div class="fb-ans"><b>Canonical command (copyable):</b><div class="codeblock">'+esc(ex.canonical)+'</div>'+
       '<div class="small">'+ex.elements.map(function(el){ return '• <b>'+esc(el.label)+'</b>: '+esc(el.desc); }).join('<br>')+'</div></div>';
  } else {
    h+='<div class="fb-ans"><b>Correct answer:</b> '+ex.answerText+'</div>';
  }
  h+='<p>'+ex.explain+'</p>';
  if(credit<1&&ex.study){ h+='<div class="fb-study"><b>What to study:</b> '+ex.study+'</div>'; }
  h+='</div></div>';
  $('fb-slot').innerHTML=h;
  var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('fb-slot').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});
}

/* ---------- review skipped ---------- */
function showReview(canAnswer){
  S.phase='review'; renderTopbar();
  var sk=skippedIds();
  var rows=sk.map(function(id){
    var ex=byId(id);
    return '<div class="revrow"><span class="lab">⚠ Skipped</span><span class="txt">'+esc(ex.summary)+'</span>'+
      (canAnswer?'<button class="btn" onclick="EX_revAns(\''+id+'\')">→ Answer now</button>':'<span class="small">■ Timer ended — cannot be answered</span>')+'</div>';
  }).join('');
  $('main').innerHTML='<section class="card"><h2 style="margin:0 0 6px;font-size:19px;color:var(--state-skipped)">⚠ Review skipped exercises ('+sk.length+')</h2>'+
    '<p class="small">Skipped-and-never-answered exercises are excluded from the score: they do not count as correct or wrong, and their points are not added to the total possible. '+(canAnswer?'The timer is still running, so you can return to each one now. You can do this as many times as you need.':'The timer has ended, so these exercises can no longer be answered.')+'</p>'+
    '<div class="revlist">'+rows+'</div>'+
    '<div class="navrow"><button class="btn primary" onclick="EX_finalResults()">■ Go to final results</button></div></section>';
}
function EX_revAns(id){
  var i=S.order.indexOf(id); if(i<0) return;
  if(CUR_step){ CUR_step=null; }
  gotoIdx(i);
  S.fromReview=true; /* set after gotoIdx, which resets it */
}
window.EX_revAns=EX_revAns;
function EX_finalResults(){ if(T&&T.state!=='ENDED') timerSet('ENDED'); timerStopClock(); showResults(); }
window.EX_finalResults=EX_finalResults;

/* ---------- results ---------- */
function showResults(){
  S.phase='results';
  if(T&&T.state!=='ENDED') timerSet('ENDED');
  timerStopClock();
  renderTopbar();
  var n=answeredCount(); var sum=creditSum();
  var pct=n>0?Math.round((sum/n)*100):0; var pass=pct>=CFG.passMark;
  var full=0,part=0,inc=0,partSum=0;
  for(var k in S.credits){ var c=S.credits[k]; if(c>=1) full++; else if(c>0){ part++; partSum+=c; } else inc++; }
  var avg=part>0?(partSum/part):0;
  var skipped=skippedIds().length;
  var elapsed=T?(T.total-T.remaining):0;
  var who=S.username?'<p class="small">Analyst: '+esc(S.username)+'</p>':'';
  var cert= pass?
    '<div class="cert"><div class="big">✓ PASS</div><p>You reached '+pct+'%, above the '+CFG.passMark+'% pass mark. Well done — you showed solid command of '+esc(CFG.objId)+' at '+CFG.sevWord+' level.</p></div>':
    '<div class="cert fail"><div class="big">✗ FAIL</div><p>You reached '+pct+'%, below the '+CFG.passMark+'% pass mark. You must retake this exam to pass. Review the feedback you collected, then press Retake Exam.</p></div>';
  $('main').innerHTML='<section class="card">'+
    '<h2 style="margin:0 0 6px;font-size:20px">■ Final results — '+esc(CFG.title)+'</h2>'+who+
    '<p style="font-size:20px;margin:6px 0">Final score: <b>'+sum.toFixed(1)+' / '+n+'</b> answered · <b>'+pct+'%</b> <span class="small">(pass mark '+CFG.passMark+'%, computed only over answered exercises)</span></p>'+
    '<div class="res-grid">'+
      '<div class="res-cell c-corr"><div class="n">'+full+'</div><div class="l">✓ Fully correct</div></div>'+
      '<div class="res-cell c-part"><div class="n">'+part+'</div><div class="l">✓ Partially correct — avg '+avg.toFixed(2)+'</div></div>'+
      '<div class="res-cell c-inc"><div class="n">'+inc+'</div><div class="l">✗ Fully incorrect</div></div>'+
      '<div class="res-cell c-skip"><div class="n">'+skipped+'</div><div class="l">⚠ Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="small" style="margin:8px 0">Time used: <b>'+fmtTime(elapsed)+'</b> of '+CFG.timerMinutes+' min · ⏸ Manual pause total: <b>'+fmtTime(T?T.manualSec:0)+'</b> · ⏸ Feedback-review pause total: <b>'+fmtTime(T?T.autoSec:0)+'</b></div>'+
    cert+
    '<div class="navrow"><button class="btn primary" onclick="EX_retake()">↻ Retake Exam</button></div>'+
    '</section>';
  if(!S.reported){ S.reported=true; reportScore(sum,n); }
}
function EX_retake(){ beginAttempt(); }
window.EX_retake=EX_retake;
function reportScore(creditSumVal, answeredCountVal){
  var percent = answeredCountVal>0 ? Math.round((creditSumVal/answeredCountVal)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      batch:CFG.batch,
      score:Math.round(creditSumVal),
      total:answeredCountVal,
      percent:percent,
      passed: percent>=CFG.passMark
    }, location.origin);
  }catch(e){ /* Opened directly rather than inside the site. Nothing to report to. */ }
}
window.addEventListener('message',function(event){
  var d=event&&event.data; if(!d) return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT') return;
  try{ S.username=String(d.username||''); }catch(e){ S.username=''; }
  /* theme field is always 'dark' — the file is dark-only by contract, nothing to switch */
});

/* ---------- boot ---------- */
function boot(){
  S=freshState();
  S.order=CFG.exercises.map(function(e){ return e.id; });
  renderIntro();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
