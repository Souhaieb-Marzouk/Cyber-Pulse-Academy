/* ---------- start / boot ---------- */
function deAdjacentTerminals(order){
  /* keep terminal exercises from landing next to each other after a shuffle */
  var isT = {};
  EXAM.exercises.forEach(function(e){ if (e.type === 'terminal') isT[e.id] = true; });
  var hasAny = Object.keys(isT).length > 0;
  if (!hasAny) return order;
  for (var pass = 0; pass < 6; pass++) {
    var fixed = true;
    for (var i = 0; i < order.length - 1; i++) {
      if (isT[order[i]] && isT[order[i + 1]]) {
        fixed = false;
        for (var j = 0; j < order.length; j++) {
          if (isT[order[j]]) continue;
          if (Math.abs(j - i) <= 1) continue;
          var leftN = j > 0 ? isT[order[j - 1]] : false;
          var rightN = j < order.length - 1 ? isT[order[j + 1]] : false;
          if (leftN || rightN) continue;
          var t = order[i + 1]; order[i + 1] = order[j]; order[j] = t;
          break;
        }
      }
    }
    if (fixed) break;
  }
  return order;
}
function startExam(){
  S.order = deAdjacentTerminals(shuffle(EXAM.exercises.map(function(e){ return e.id; })));
  S.pos = 0; S.sum = 0; S.ansN = 0;
  S.credits = {}; S.checked = {}; S.hintUsed = {};
  S.skipped = []; S.inReview = false;
  S.left = EXAM.timer; S.perOn = false; S.perLeft = 0;
  S.manualSec = 0; S.autoSec = 0;
  S.reported = false;
  S.tState = 'RUNNING'; S.preManual = null;
  S.scr = 'exam';
  S.cur = exById(S.order[0]);
  if (tbRefs.bar) tbRefs.bar.style.display = '';
  showEx();
}

/* ===== engine part B: widgets, grading, feedback, boot ===== */

function optLetter(i){ return 'ABCDEFGH'.charAt(i) + '.'; }

function buildWidget(ex, container){
  if (ex.type === 'choice') return wChoice(ex, container);
  if (ex.type === 'fill') return wFill(ex, container);
  if (ex.type === 'place') return wPlace(ex, container);
  if (ex.type === 'match') return wMatch(ex, container);
  if (ex.type === 'lines') return wLines(ex, container);
  if (ex.type === 'triage') return wTriage(ex, container);
  if (ex.type === 'branch') return wBranch(ex, container);
  if (ex.type === 'terminal') return wTerminal(ex, container);
  return wChoice(ex, container);
}

/* ---------- choice (QCM single / multi-select) ---------- */
function wChoice(ex, container){
  var multi = !!ex.multi;
  var opts = shuffle(ex.options.map(function(o){ return { t: o.t, ok: !!o.ok, why: o.why || '' }; }));
  var sel = {};
  var list = el('div', 'opts');
  opts.forEach(function(o, i){
    var b = el('button', 'opt'); b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.appendChild(el('span', 'ol', optLetter(i)));
    b.appendChild(el('span', 'ot', o.t));
    b.appendChild(el('span', 'sel-tag', 'selected'));
    b.addEventListener('click', function(){
      if (multi) { sel[i] = !sel[i]; }
      else { sel = {}; sel[i] = true; }
      Array.prototype.forEach.call(list.children, function(c, k){ c.classList.toggle('sel', !!sel[k]); c.setAttribute('aria-pressed', sel[k] ? 'true' : 'false'); });
    });
    list.appendChild(b);
  });
  container.appendChild(list);
  var okIdx = [];
  opts.forEach(function(o, i){ if (o.ok) okIdx.push(i); });
  return {
    empty: function(){ return okIdx.length ? Object.keys(sel).length === 0 : true; },
    grade: function(){
      var N = okIdx.length || 1;
      var H = 0, W = 0, items = [];
      opts.forEach(function(o, i){
        if (o.ok) {
          if (sel[i]) { H++; items.push({ st: 'ok', t: o.t, why: o.why }); }
          else items.push({ st: 'miss', t: o.t, why: o.why || 'This option belongs to the correct answer.' });
        } else if (sel[i]) {
          W++; items.push({ st: 'bad', t: o.t, why: o.why || 'This option is not part of the correct answer in this scenario.' });
        }
      });
      var credit = scoreMulti(H, W, N);
      var corr = okIdx.map(function(i){ return opts[i].t; });
      return { credit: credit, items: items.length > 1 || N > 1 ? items : null, correct: 'The correct answer is: <span class="mono">' + esc(corr.join('  ·  ')) + '</span>' };
    },
    lock: function(){ Array.prototype.forEach.call(list.children, function(c){ c.disabled = true; }); }
  };
}

/* ---------- fill in the blanks ---------- */
function wFill(ex, container){
  var blanks = ex.blanks;
  var inputs = [];
  var list = el('div', 'blanks');
  blanks.forEach(function(b, i){
    var row = el('div', 'blank-row');
    row.appendChild(el('label', null, (i + 1) + '. ' + (b.label || 'Blank')));
    var inp;
    if (b.mode === 'select') {
      inp = document.createElement('select');
      inp.className = 'fill-in';
      var ph = el('option'); ph.value = ''; ph.textContent = '— choose —'; inp.appendChild(ph);
      shuffle(b.opts).forEach(function(t){ var o = el('option'); o.value = t; o.textContent = t; inp.appendChild(o); });
    } else {
      inp = el('input'); inp.type = 'text'; inp.className = 'fill-in';
      inp.setAttribute('autocomplete', 'off'); inp.setAttribute('spellcheck', 'false');
    }
    row.appendChild(inp);
    list.appendChild(row);
    inputs.push(inp);
  });
  container.appendChild(list);
  return {
    empty: function(){ return inputs.every(function(i){ return !norm(i.value); }); },
    grade: function(){
      var H = 0, W = 0, items = [];
      blanks.forEach(function(b, i){
        var v = norm(inputs[i].value);
        var good = b.accept.some(function(a){ return norm(a) === v; });
        if (good) { H++; items.push({ st: 'ok', t: (i + 1) + '. ' + (b.label || '') + ' — "' + inputs[i].value + '"', why: b.why }); }
        else {
          W++;
          items.push({ st: 'bad', t: (i + 1) + '. ' + (b.label || '') + ' — "' + (inputs[i].value || 'empty') + '"', why: (b.why || '') + ' Correct: "' + b.accept[0] + '".' });
        }
      });
      var corr = blanks.map(function(b, i){ return (i + 1) + '. ' + b.accept[0]; }).join('  ·  ');
      return { credit: scoreMulti(H, W, blanks.length), items: items, correct: 'Correct blanks: <span class="mono">' + esc(corr) + '</span>' };
    },
    lock: function(){ inputs.forEach(function(i){ i.disabled = true; }); }
  };
}

/* ---------- drag & drop / matrix / ordering / ranking ---------- */
function wPlace(ex, container){
  var slots = ex.slots;
  var items = shuffle(ex.items.map(function(it, i){ return { t: it.t, s: it.s, key: i }; }));
  var picked = null;
  var placed = {};
  var bank = el('div', 'bank');
  var grid = el('div', 'slots' + (ex.vert ? ' vert' : ''));
  var chipEls = {};
  function makeChip(it){
    var c = el('button', 'chip'); c.type = 'button'; c.textContent = it.t;
    c.setAttribute('draggable', 'true');
    c.addEventListener('click', function(){
      if (placed[it.key] !== undefined && placed[it.key] !== null) {
        /* return to bank */
        var si = placed[it.key];
        placed[it.key] = null;
        bank.appendChild(c);
        refreshSlots();
        picked = null;
        return;
      }
      var was = picked;
      picked = (was === it.key) ? null : it.key;
      Object.keys(chipEls).forEach(function(k){ chipEls[k].classList.toggle('picked', chipEls[k] === c && picked !== null); });
    });
    c.addEventListener('dragstart', function(ev){ try { ev.dataTransfer.setData('text/plain', String(it.key)); } catch (e) {} picked = it.key; });
    return c;
  }
  var slotEls = [];
  slots.forEach(function(sl, si){
    var s = el('div', 'slot'); s.setAttribute('tabindex', '0');
    s.appendChild(el('span', 'sl', sl.l));
    var box = el('div', 'sbox');
    s.appendChild(box);
    function take(){
      if (picked === null) return;
      var it = items.filter(function(x){ return x.key === picked; })[0];
      if (!it) return;
      /* if something already sits here, send it back */
      Object.keys(placed).forEach(function(k){
        if (placed[k] === si && String(k) !== String(it.key)) {
          var other = items.filter(function(x){ return x.key === Number(k); })[0];
          if (other) bank.appendChild(chipEls[other.key]);
          placed[k] = null;
        }
      });
      placed[it.key] = si;
      box.appendChild(chipEls[it.key]);
      chipEls[it.key].classList.remove('picked');
      picked = null;
      refreshSlots();
    }
    s.addEventListener('click', take);
    s.addEventListener('dragover', function(ev){ ev.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('over'); });
    s.addEventListener('drop', function(ev){ ev.preventDefault(); s.classList.remove('over'); var k = ev.dataTransfer.getData('text/plain'); picked = k !== '' ? Number(k) : picked; take(); });
    slotEls.push(s);
    grid.appendChild(s);
  });
  function refreshSlots(){
    Array.prototype.forEach.call(bank.children, function(c){ c.classList.remove('used'); });
    Object.keys(placed).forEach(function(k){ if (placed[k] !== null && chipEls[k]) chipEls[k].classList.add('used'); });
  }
  items.forEach(function(it){ var c = makeChip(it); chipEls[it.key] = c; bank.appendChild(c); });
  container.appendChild(el('div', 'lv-hint', 'Drag a card into a slot, or click a card and then click a slot. Click a placed card to send it back.'));
  container.appendChild(bank);
  container.appendChild(grid);
  return {
    empty: function(){ return items.every(function(it){ return placed[it.key] === undefined || placed[it.key] === null; }); },
    grade: function(){
      var H = 0, W = 0, M = 0, itemsFb = [];
      items.forEach(function(it){
        var p = placed[it.key];
        var slotLab = p !== undefined && p !== null ? slots[p].l : 'not placed';
        if (p === it.s) { H++; itemsFb.push({ st: 'ok', t: '"' + it.t + '" → ' + slotLab, why: ex.itemsWhy ? ex.itemsWhy[it.s] : '' }); }
        else if (p === undefined || p === null) { M++; itemsFb.push({ st: 'miss', t: '"' + it.t + '" → ' + slots[it.s].l, why: (ex.itemsWhy ? ex.itemsWhy[it.s] : '') + ' You did not place this card.' }); }
        else { W++; itemsFb.push({ st: 'bad', t: '"' + it.t + '" → ' + slotLab, why: 'Correct slot: ' + slots[it.s].l + '. ' + (ex.itemsWhy ? ex.itemsWhy[it.s] : '') }); }
      });
      var corr = ex.items.map(function(it){ return '"' + it.t + '" → ' + slots[it.s].l; }).join('  ·  ');
      return { credit: scoreMulti(H, W, items.length), items: itemsFb, correct: 'Correct placement: <span class="mono">' + esc(corr) + '</span>' };
    },
    lock: function(){ Array.prototype.forEach.call(container.querySelectorAll('button.chip'), function(c){ c.disabled = true; }); }
  };
}

/* ---------- matching ---------- */
function wMatch(ex, container){
  var lefts = shuffle(ex.lefts.map(function(l){ return l; }));
  var rights = shuffle(ex.rights.slice());
  var sels = [];
  var rows = el('div', 'match-rows');
  lefts.forEach(function(l, i){
    var row = el('div', 'match-row');
    row.appendChild(el('span', 'ml', l.t));
    var s = document.createElement('select');
    var ph = el('option'); ph.value = ''; ph.textContent = '— match —'; s.appendChild(ph);
    rights.forEach(function(r){ var o = el('option'); o.value = r; o.textContent = r; s.appendChild(o); });
    s.addEventListener('change', function(){});
    row.appendChild(s);
    rows.appendChild(row);
    sels.push({ l: l, sel: s });
  });
  container.appendChild(rows);
  return {
    empty: function(){ return sels.every(function(x){ return !x.sel.value; }); },
    grade: function(){
      var H = 0, W = 0, items = [];
      sels.forEach(function(x){
        var v = x.sel.value;
        if (v === x.l.r) { H++; items.push({ st: 'ok', t: x.l.t + ' → ' + v, why: x.l.why }); }
        else if (!v) { items.push({ st: 'miss', t: x.l.t + ' → ' + x.l.r, why: x.l.why }); }
        else { W++; items.push({ st: 'bad', t: x.l.t + ' → ' + v, why: 'Correct match: ' + x.l.r + '. ' + (x.l.why || '') }); }
      });
      var corr = ex.lefts.map(function(l){ return l.t + ' = ' + l.r; }).join('  ·  ');
      return { credit: scoreMulti(H, W, lefts.length), items: items, correct: 'Correct pairs: <span class="mono">' + esc(corr) + '</span>' };
    },
    lock: function(){ sels.forEach(function(x){ x.sel.disabled = true; }); }
  };
}

/* ---------- log viewer / spot the line ---------- */
function wLines(ex, container){
  var correct = {};
  ex.correct.forEach(function(i){ correct[i] = true; });
  var sel = {};
  var lns = el('div', 'lns');
  var idxMap = [];
  function draw(filter){
    lns.innerHTML = ''; idxMap = [];
    ex.lines.forEach(function(t, i){
      if (filter && norm(t).indexOf(norm(filter)) === -1) return;
      idxMap.push(i);
      var b = el('button', 'ln'); b.type = 'button';
      b.appendChild(el('span', 'no', String(i + 1).padStart(2, ' ')));
      var sp = el('span'); sp.innerHTML = hl(t); b.appendChild(sp);
      if (sel[i]) b.classList.add('sel');
      b.addEventListener('click', function(){
        if (ex.single) { sel = {}; }
        sel[i] = !sel[i];
        Array.prototype.forEach.call(lns.children, function(c, k){ c.classList.toggle('sel', !!sel[idxMap[k]]); });
      });
      lns.appendChild(b);
    });
  }
  draw('');
  if (ex.filter) {
    var tools = el('div', 'lv-tools');
    var f = el('input', 'lv-filter'); f.type = 'text'; f.placeholder = 'filter… (e.g. CreateVolume)';
    f.setAttribute('aria-label', 'Filter log lines');
    f.addEventListener('input', function(){ draw(f.value); });
    tools.appendChild(f);
    tools.appendChild(el('span', 'lv-hint', ex.single ? 'Click ONE line.' : 'Click a line to select / deselect it.'));
    container.appendChild(tools);
  } else {
    container.appendChild(el('div', 'lv-hint', ex.single ? 'Click ONE line.' : 'Click a line to select / deselect it.'));
  }
  container.appendChild(lns);
  return {
    empty: function(){ return Object.keys(sel).length === 0; },
    grade: function(){
      var H = 0, W = 0, items = [];
      ex.lines.forEach(function(t, i){
        if (correct[i]) {
          if (sel[i]) { H++; items.push({ st: 'ok', t: 'Line ' + (i + 1), why: ex.why && ex.why[i] ? ex.why[i] : 'This line is part of the answer.' }); }
          else items.push({ st: 'miss', t: 'Line ' + (i + 1) + ' — ' + t.slice(0, 90), why: ex.why && ex.why[i] ? ex.why[i] : 'This line is part of the answer.' });
        } else if (sel[i]) {
          W++; items.push({ st: 'bad', t: 'Line ' + (i + 1) + ' — ' + t.slice(0, 90), why: ex.why && ex.why[i] ? ex.why[i] : 'This line is not part of the answer.' });
        }
      });
      return { credit: scoreMulti(H, W, ex.correct.length), items: items, correct: 'The correct line' + (ex.correct.length > 1 ? 's are' : ' is') + ': <span class="mono">' + esc(ex.correct.map(function(i){ return 'line ' + (i + 1); }).join(', ')) + '</span>' };
    },
    lock: function(){ Array.prototype.forEach.call(lns.children, function(c){ c.disabled = true; }); var f = container.querySelector('.lv-filter'); if (f) f.disabled = true; }
  };
}

/* ---------- triage queue ---------- */
function wTriage(ex, container){
  var q = el('div', 'alertq');
  var picks = {};
  ex.alerts.forEach(function(a, ai){
    var card = el('div', 'alert');
    var h = el('div', 'ah');
    h.appendChild(el('b', null, a.h));
    if (a.m) h.appendChild(el('span', 'am', a.m));
    card.appendChild(h);
    if (a.body) card.appendChild(el('div', 'abody', a.body));
    var opts = el('div', 'opts');
    var obtns = [];
    a.opts.forEach(function(o, oi){
      var b = el('button', 'opt'); b.type = 'button';
      b.appendChild(el('span', 'ol', optLetter(oi)));
      b.appendChild(el('span', 'ot', o.t));
      b.appendChild(el('span', 'sel-tag', 'selected'));
      b.addEventListener('click', function(){
        picks[ai] = oi;
        obtns.forEach(function(x, k){ x.classList.toggle('sel', k === oi); });
      });
      obtns.push(b);
      opts.appendChild(b);
    });
    card.appendChild(opts);
    q.appendChild(card);
  });
  container.appendChild(q);
  return {
    empty: function(){ return ex.alerts.every(function(a, ai){ return picks[ai] === undefined; }); },
    grade: function(){
      var H = 0, W = 0, items = [];
      ex.alerts.forEach(function(a, ai){
        var p = picks[ai];
        if (p === undefined) { items.push({ st: 'miss', t: a.h + ' — not decided', why: a.why }); return; }
        var o = a.opts[p];
        if (o.ok) { H++; items.push({ st: 'ok', t: a.h + ' — ' + o.t, why: a.why }); }
        else { W++; items.push({ st: 'bad', t: a.h + ' — ' + o.t, why: 'Correct: "' + (a.opts.filter(function(x){ return x.ok; })[0] || {}).t + '". ' + a.why }); }
      });
      return { credit: scoreMulti(H, W, ex.alerts.length), items: items, correct: 'Correct handling: <span class="mono">' + esc(ex.alerts.map(function(a){ return a.h + ' → ' + (a.opts.filter(function(x){ return x.ok; })[0] || { t: '?' }).t; }).join('  ·  ')) + '</span>' };
    },
    lock: function(){ Array.prototype.forEach.call(container.querySelectorAll('button.opt'), function(b){ b.disabled = true; }); }
  };
}

/* ---------- branching decision tree ---------- */
function wBranch(ex, container){
  var stepIdx = 0;
  var picks = {};
  var box = el('div');
  var tag = el('span', 'step-tag');
  var txt = el('div', 'step-text');
  var optsBox = el('div', 'opts');
  var note = el('div', 'step-note');
  var confirmB = el('button', 'btn btn-amber', 'Confirm & continue →');
  confirmB.type = 'button';
  var obtns = [];
  function drawStep(){
    var stp = ex.steps[stepIdx];
    tag.textContent = 'STEP ' + (stepIdx + 1) + ' OF ' + ex.steps.length;
    txt.innerHTML = stp.text;
    optsBox.innerHTML = ''; obtns = [];
    stp.opts.forEach(function(o, oi){
      var b = el('button', 'opt'); b.type = 'button';
      b.appendChild(el('span', 'ol', optLetter(oi)));
      b.appendChild(el('span', 'ot', o.t));
      b.appendChild(el('span', 'sel-tag', 'selected'));
      b.addEventListener('click', function(){
        picks[stepIdx] = oi;
        obtns.forEach(function(x, k){ x.classList.toggle('sel', k === oi); });
      });
      obtns.push(b);
      optsBox.appendChild(b);
    });
    note.textContent = stepIdx < ex.steps.length - 1
      ? 'Confirming a step does NOT pause the timer and does not reveal the answer. The final Check reveals everything.'
      : 'This is the final step. Press Check above to submit the whole chain for grading.';
    confirmB.style.display = '';
    confirmB.disabled = true;
  }
  confirmB.addEventListener('click', function(){
    if (picks[stepIdx] === undefined) return;
    obtns.forEach(function(b){ b.disabled = true; });
    if (stepIdx < ex.steps.length - 1) { stepIdx++; drawStep(); }
    else { confirmB.style.display = 'none'; note.textContent = 'Chain complete. Press ✓ Check to submit.'; }
  });
  box.appendChild(tag); box.appendChild(txt); box.appendChild(optsBox); box.appendChild(note);
  box.appendChild(confirmB);
  container.appendChild(box);
  return {
    empty: function(){ return Object.keys(picks).length < ex.steps.length; },
    grade: function(){
      var H = 0, W = 0, items = [];
      ex.steps.forEach(function(stp, si){
        var p = picks[si];
        if (p === undefined) { items.push({ st: 'miss', t: 'Step ' + (si + 1) + ' — not answered', why: stp.why }); return; }
        var o = stp.opts[p];
        if (o.ok) { H++; items.push({ st: 'ok', t: 'Step ' + (si + 1) + ' — ' + o.t, why: stp.why }); }
        else { W++; items.push({ st: 'bad', t: 'Step ' + (si + 1) + ' — ' + o.t, why: 'Correct: "' + stp.opts.filter(function(x){ return x.ok; })[0].t + '". ' + stp.why }); }
      });
      return { credit: scoreMulti(H, W, ex.steps.length), items: items, correct: 'Correct chain: <span class="mono">' + esc(ex.steps.map(function(s, i){ return 'Step ' + (i + 1) + ': ' + s.opts.filter(function(x){ return x.ok; })[0].t; }).join('  ·  ')) + '</span>' };
    },
    lock: function(){ Array.prototype.forEach.call(container.querySelectorAll('button.opt'), function(b){ b.disabled = true; }); confirmB.disabled = true; }
  };
}

/* ---------- terminal emulator ---------- */
function wTerminal(ex, container){
  var t = ex.term;
  var lastCmd = '';
  if (t.panel) {
    var pn = el('div', 'term-panel');
    pn.innerHTML = t.panel;
    container.appendChild(pn);
  }
  var box = el('div', 'term');
  var bar = el('div', 'term-bar');
  var dots = el('span', 'dots'); dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
  bar.appendChild(dots);
  bar.appendChild(el('span', null, t.title || 'simulated shell — nothing real is executed'));
  box.appendChild(bar);
  var out = el('div', 'term-out');
  (t.welcome || []).forEach(function(l){ out.innerHTML += hl(l) + '\n'; });
  out.innerHTML = out.innerHTML.replace(/\n$/, '');
  box.appendChild(out);
  var row = el('div', 'term-in');
  row.appendChild(el('span', 'pr', t.prompt || 'analyst@soc:~$'));
  var inp = el('input'); inp.type = 'text';
  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('aria-label', 'Shell input');
  row.appendChild(inp);
  box.appendChild(row);
  container.appendChild(box);
  function run(){
    var v = inp.value; if (!norm(v)) return;
    lastCmd = v;
    var line = el('div'); line.innerHTML = '<span class="tk-k">' + esc(t.prompt || 'analyst@soc:~$') + '</span> ' + esc(v);
    out.appendChild(line);
    var n = norm(v);
    var okAll = t.elements.every(function(e){ return new RegExp(e.re, 'i').test(n); });
    var wrongHit = (t.wrong || []).filter(function(wr){ return new RegExp(wr.re, 'i').test(n); });
    var resp = el('div');
    if (okAll) resp.innerHTML = hl(t.sample || 'OK — the simulator accepts this command.');
    else if (wrongHit.length) resp.innerHTML = '<span class="tk-d">SIMULATION BLOCK:</span> ' + esc(wrongHit[0].sim || 'This command would change state. In this training shell it is blocked — press Check to grade it.');
    else resp.innerHTML = '<span class="tk-c">Unknown command or wrong syntax for this simulator. Adjust it, or press Check to grade what you typed.</span>';
    out.appendChild(resp);
    out.scrollTop = out.scrollHeight;
    inp.value = '';
  }
  inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); run(); } });
  return {
    empty: function(){ return !lastCmd; },
    grade: function(){
      var n = norm(lastCmd);
      var H = 0, W = 0, items = [], danger = [];
      t.elements.forEach(function(e){
        if (new RegExp(e.re, 'i').test(n)) { H++; items.push({ st: 'ok', t: e.l, why: e.why }); }
        else items.push({ st: 'miss', t: e.l, why: e.why });
      });
      (t.wrong || []).forEach(function(wr){
        if (new RegExp(wr.re, 'i').test(n)) { W++; danger.push(wr.l); items.push({ st: 'bad', t: wr.l, why: wr.why }); }
      });
      var credit = scoreMulti(H, W, t.elements.length);
      return {
        credit: credit, items: items, danger: danger,
        correct: 'Canonical command: <span class="mono">' + esc(t.canonical) + '</span>',
        canonical: t.canonical
      };
    },
    lock: function(){ inp.disabled = true; }
  };
}

/* ---------- feedback ---------- */

  var cls = credit >= 1 ? 'fb-correct' : (credit > 0 ? 'fb-partial' : 'fb-incorrect');

  var box = el('div', 'fb ' + cls);

  if (g.auto) h.appendChild(el('span', 'small', '⏱ auto-submitted (per-exercise clock ran out)'));

      var iw = el('span', 'iw');
      iw.innerHTML = '<b>' + icon + ' ' + word + '</b>' + esc(it.t) + (it.why ? '<br><span class="small">' + esc(it.why) + '</span>' : '');

  if (ex.study) {
    var st = el('div', 'study', '📚 What to study: ' + ex.study);
    b.appendChild(st);
  }
  box.appendChild(b);
  fb.appendChild(box);
  var isSeqLast = !S.inReview && S.pos >= S.order.length - 1;
  var bNext = el('button', 'btn btn-primary', (isSeqLast ? (S.skipped.length ? 'Next → review skipped' : '✓ Final Submit → results') : (S.inReview ? 'Next → back to review' : 'Next →')));
  bNext.type = 'button'; bNext.id = 'btnNext';
  bNext.addEventListener('click', doNext);
  fb.appendChild(bNext);
  try { fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

/* ---------- boot ---------- */
buildTopbar();
setInterval(tick, 1000);
renderIntro();

</script>
</body>
</html>
