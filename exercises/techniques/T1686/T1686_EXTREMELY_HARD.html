.intro-sub{color:var(--text-secondary);font-size:15px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:16px}
.fact .fl{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.fact .fv{font-weight:800;font-size:16.5px;margin-top:2px}
.sec-title{font-size:19px;font-weight:800;margin:26px 0 0;padding-left:12px;border-left:4px solid var(--accent-blue)}
.kw-theme{
  border:1px solid var(--border-soft);border-radius:8px;
  background:var(--bg-surface-2);padding:12px 14px;margin-top:12px;
}
.kw-theme .kt{font-weight:800;font-size:14px;color:var(--accent-amber);letter-spacing:.03em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--tint-blue-08);border:1px solid var(--border);
  color:var(--text-primary);border-radius:999px;padding:4px 13px;font-size:13.5px;
}
.rules{margin:10px 0 0;padding-left:22px}
.rules li{margin:7px 0}
.rules .ico{font-weight:800}
/* ---------- pause overlay ---------- */
.pausemask{
  position:fixed;inset:0;background:var(--pausemask-bg);z-index:90;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
}
.pausemask .inner{max-width:520px}
.pausemask .big{font-size:22px;font-weight:800;color:var(--state-paused);margin:12px 0 8px}
.pausemask .sub{color:var(--text-secondary)}
/* ---------- review skipped ---------- */
.sk-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sk-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:12px 14px;
}
.sk-row .sk-ico{color:var(--state-skipped);font-weight:800}
.sk-row .sk-t{flex:1;min-width:200px}
.sk-row .sk-t .n{font-weight:700}
.sk-row .sk-t .d{font-size:13.5px;color:var(--text-secondary)}
/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 30px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono-font);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px}
.res-cell .rc-ico{font-size:20px;font-weight:800}
.res-cell.ok .rc-ico{color:var(--state-correct)}
.res-cell.part .rc-ico{color:var(--state-partial)}
.res-cell.bad .rc-ico{color:var(--state-incorrect)}
.res-cell.skip .rc-ico{color:var(--state-skipped)}
.res-cell .rc-n{font-size:26px;font-weight:800;font-family:var(--mono-font)}
.res-cell .rc-l{font-size:13.5px;color:var(--text-secondary)}
.cert{
  margin-top:18px;border:2px solid var(--state-correct);border-radius:10px;
  background:var(--tint-green-07);padding:20px 22px;text-align:center;
}
.cert.fail{border-color:var(--state-incorrect);background:var(--tint-red-06)}
.cert .c-big{font-size:30px;font-weight:800;color:var(--state-correct)}
.cert.fail .c-big{color:var(--state-incorrect)}
.cert .c-sub{color:var(--text-secondary);margin-top:6px}
.time-report{margin-top:14px;font-size:14px;color:var(--text-secondary)}
.time-report b{color:var(--text-primary)}
.hidden{display:none!important}
.footer-note{margin-top:26px;text-align:center;font-size:12.5px;color:var(--text-secondary)}
@media (max-width:760px){
  .wrap{padding:10px 12px 50px}
  .intro-title{font-size:21px}
  .res-pct{font-size:40px}
  .card{padding:13px 14px}
}

<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1686","batch":4,"title":"T1686 Disable or Modify System Firewall — EXTREMELY HARD","difficulty":"extremely-hard","questionCount":16,"estimatedMinutes":60,"passMark":70,"sev":"extremely-hard","timerSeconds":3600},"introHtml":"\n<div class=\"intro-head\">\n  <h1 class=\"intro-title\">T1686 — EXTREMELY HARD practice exam<\/h1>\n  <p class=\"intro-sub\">MITRE ATT&amp;CK object: <b>T1686 — Disable or Modify System Firewall<\/b> (Technique) &middot; Tactic: Defense Impairment (TA0112)<\/p>\n  <div class=\"facts\">\n    <div class=\"fact\"><div class=\"fl\">Severity<\/div><div class=\"fv\"><span class=\"badge sev-extreme\">EXTREMELY HARD<\/span><\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Exercises in this file<\/div><div class=\"fv\">16<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Estimated time<\/div><div class=\"fv\">60 minutes<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Timer budget<\/div><div class=\"fv\">60:00 countdown<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Pass mark<\/div><div class=\"fv\">70%<\/div><\/div>\n  <\/div>\n<\/div>\n\n<h2 class=\"sec-title\">What you will learn here<\/h2>\n<div class=\"card\">\n  <p class=\"body\">This is the senior room. The artefacts no longer speak for themselves: a change window overlaps an intrusion, a best practice backfires, a monitoring agent looks like a recon step, and the correct move sometimes costs the business real money — or is to <b>do nothing yet<\/b>. You will learn to resolve <b>conflicting signals<\/b> explicitly and to defend the choice.<\/p>\n  <p class=\"body\">The object is the <b>Technique T1686 — Disable or Modify System Firewall<\/b> (Defense Impairment, TA0112) and its full family: T1686.001 cloud, T1686.002 network devices, T1686.003 Windows hosts, plus the Linux, macOS and ESXi coverage of the parent. You will chain detection strategies across layers — DET0145's platform analytics (AN0406–AN0410), DET0424 for the cloud control plane, DET0306 for perimeter devices, DET0901 for Windows — the way a senior analyst does when one incident spans them all.<\/p>\n  <p class=\"body\">These are the moments senior <b>incident commanders<\/b>, <b>detection engineers<\/b>, <b>CTI leads<\/b> and <b>GRC owners<\/b> earn their seat: sequencing response under a CISO deadline, writing the executive line that names the sub-technique and the control, ranking actions by real exposure, and knowing when a monitoring rollout makes a hunt hit a non-event. One exercise drops you on a perimeter device with a five-minute clock and a rule that says: <b>evidence must survive scrutiny<\/b>.<\/p>\n<\/div>\n\n<h2 class=\"sec-title\">Keywords covered in this exam<\/h2>\n<div class=\"card\">\n  <div class=\"kw-theme\"><div class=\"kt\">Conflicting-signal resolution<\/div><div class=\"chips\"><span class=\"chip\">change window vs intrusion staging<\/span><span class=\"chip\">read-only command vs tampering alert<\/span><span class=\"chip\">which signal wins and why<\/span><span class=\"chip\">do-nothing-yet decisions<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Multi-layer impairment chains<\/div><div class=\"chips\"><span class=\"chip\">cloud SG + perimeter ACL + host profiles in one campaign<\/span><span class=\"chip\">identity pivot (deploy roles)<\/span><span class=\"chip\">GuardDuty suppression (Pacu-style)<\/span><span class=\"chip\">coordinated window: 40 minutes<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Analytics and detection engineering<\/div><div class=\"chips\"><span class=\"chip\">AN0406–AN0410 platform mapping<\/span><span class=\"chip\">AN1188 beyond-baseline rule expansion<\/span><span class=\"chip\">over-narrow SIEM predicates<\/span><span class=\"chip\">compensating detections without EDR<\/span><span class=\"chip\">config diff vs golden baseline<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Evidence and cost<\/div><div class=\"chips\"><span class=\"chip\">volatile state before restore<\/span><span class=\"chip\">safe verbs only (show / get)<\/span><span class=\"chip\">isolation that halts a payment batch<\/span><span class=\"chip\">evidence that survives scrutiny<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Governance under pressure<\/div><div class=\"chips\"><span class=\"chip\">M1018 least privilege on identities<\/span><span class=\"chip\">M1047 audit evidence<\/span><span class=\"chip\">executive reporting with sub-technique named<\/span><span class=\"chip\">PCI segmentation obligations<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Real procedures resurfacing<\/div><div class=\"chips\"><span class=\"chip\">Gentlemen-style profile kills<\/span><span class=\"chip\">HiddenFace-style rule names<\/span><span class=\"chip\">Salt Typhoon-style ACL edits<\/span><span class=\"chip\">UNC3886-style hypervisor changes<\/span><\/div><\/div>\n<\/div>\n\n<h2 class=\"sec-title\">How this exam works<\/h2>\n<div class=\"card\">\n  <ul class=\"rules\">\n    <li><span class=\"ico\">&#10003; Pass mark:<\/span> 70%. Exercises chain <b>three or more<\/b> ideas and contain at least one genuinely ambiguous signal each. Several correct answers are \"gather more evidence\" or carry a real cost you must consciously accept. Distractors are defensible in other worlds — resolve the conflict in <i>this<\/i> one.<\/li>\n    <li><span class=\"ico\">&#9881; Exercise types in this file:<\/span> multi-artefact correlation, branching incident command decisions, priority ranking, analytics matching, executive-report drafting, spot-the-gap in detection logic, cloud-log noise hunting, and one timed terminal on a perimeter device (it has its own 5-minute clock, announced before it starts).<\/li>\n    <li><span class=\"ico\">&#9201; Timer:<\/span> 60:00 countdown, state <b>&#9654; RUNNING<\/b>. <b>Pause<\/b> = manual break, exercise hidden. <b>Check<\/b> = automatic pause (&#9208; reviewing feedback, unlimited); the timer restarts only on <b>Next<\/b>. The one timed terminal shows its own remaining seconds; it stops while the main timer is paused.<\/li>\n    <li><span class=\"ico\">&#10100; Partial credit:<\/span> multi-item exercises score max(0, (correct − wrong) / total). Selecting everything scores 0 — claim only what the artefacts support.<\/li>\n    <li><span class=\"ico\">&#128161; Hints:<\/span> one per exercise, −10% credit. Hints restate a constraint you may have missed; they never point at the answer.<\/li>\n    <li><span class=\"ico\">&#9888; Skip:<\/span> free, timer keeps running. Review skipped exercises before finishing; never-answered skips are excluded from the score.<\/li>\n  <\/ul>\n  <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-primary btn-big\" id=\"btnStart\">&#9654; Start the exam<\/button><\/div>\n<\/div>\n","exercises":[{"id":"X01","type":"branch","title":"Payment segment, 03:04 — staging or migration?","summary":"Four incident-command decisions with real costs","scenario":["03:04. The payment-segment dashboard lights up. On PAY-CORE-02: netsh advfirewall set allprofiles state off, then sc stop mpssvc — run by a local admin account CREATED 20 MINUTES EARLIER.","Conflict: change CHG-4100 'payment segment migration prep' is ACTIVE tonight. The runbook said migrations touch cloud security groups, not host firewalls.","Incomplete info: EDR is offline on two of the five payment hosts, so you cannot see whether they show the same pattern.","Business constraint: PAY-CORE-02 runs the overnight settlement batch; isolation halts it for at least 40 minutes.","Four decisions. Each step assumes the previous one."],"question":"Make each of the four incident-command decisions.","hint":"The constraint you may have skipped: the ticket scope. It names security groups, not host firewalls — read who created the account, and when.","steps":[{"prompt":"STEP 1 — Which reading of the conflicting signals wins?","options":[{"id":"A","text":"Intrusion staging wins: the ticket covers security groups, not host firewalls; a minutes-old local admin killing profiles and the service is not migration behaviour.","outcome":"You commit to intrusion staging. The change-window overlap was the coincidence; the account creation is the tell.","why":"Correct — the ticket's scope excludes the observed action, and the fresh account breaks the benign reading."},{"id":"B","text":"The migration wins: window is active, so all changes tonight are covered.","outcome":"You filed a hostile impairment under a ticket that never mentioned it. The segment stays open while you assume.","why":"Ticket coverage is not blanket — scope text decides."},{"id":"C","text":"Unresolvable — wait for the migration team to confirm by email.","outcome":"The attacker gets the settlement batch's runtime; nothing about the pattern will change while you wait.","why":"The evidence already points one way; waiting is a choice too, with a price."}],"correct":"A","why":"Conflicts resolve on scope and context: the ticket never covers this action, and a 20-minute-old admin account is attacker infrastructure."},{"prompt":"STEP 2 — Containment for PAY-CORE-02, knowing the batch halts 40 minutes if isolated?","options":[{"id":"A","text":"Isolate the host's VLAN with full packet capture; accept the batch delay and tell the business now.","outcome":"Batch delayed 47 minutes; finance informed; capture shows beacon attempts to a parked domain. The cost bought you the story.","why":"Correct — you accept a real, bounded cost to stop an active stage and preserve proof."},{"id":"B","text":"Power off the host immediately — fastest containment.","outcome":"Memory, connections and the in-flight batch are gone; the case lost its volatile evidence and finance lost the run.","why":"Maximum cost, evidence destroyed, and the attacker's other footholds remain."},{"id":"C","text":"Watch-only for now — the batch matters more than containment.","outcome":"30 minutes later the same account created a second admin and opened SMB wide. Watching was a decision too.","why":"Known active staging plus watch-only is how segments fall."}],"correct":"A","why":"Accept the business cost consciously — bounded, explained, and it preserves both the segment and the case."},{"prompt":"STEP 3 — When do you re-enable the host firewall?","options":[{"id":"A","text":"Not yet — after imaging and config review; restore from the golden baseline with the account revoked, not by flipping the switch on a tampered host.","outcome":"Imaging finds the scheduled task recreating the profile kill; the golden-baseline restore lands clean.","why":"Correct — restore from known-good after the persistence is gone; a live tampered config is a booby trap."},{"id":"B","text":"Immediately — protection first, review later.","outcome":"The task re-kills the profiles at 03:41; your dashboard shows protection flapping and your case shows nothing about why.","why":"Re-enabling on a tampered host is a loop, not a fix."},{"id":"C","text":"Never — the host stays isolated permanently.","outcome":"Safe but unbounded; the business now pays daily for a decision that needed one hour.","why":"Containment must converge to restoration."}],"correct":"A","why":"Sequence: image, review, revoke the enabler, then restore from baseline — protection that survives the attacker's persistence."},{"prompt":"STEP 4 — The line you give the CISO (they want it in one sentence)?","options":[{"id":"A","text":"'Confirmed intrusion staging on the payment segment, T1686.003 profile and service kill plus a fresh admin account; contained with a 47-minute batch delay; imaging under way.'","outcome":"The CISO forwards it verbatim to the board; the batch delay is understood as a chosen, bounded cost.","why":"Correct — behaviour named, technique mapped, cost owned, next step clear."},{"id":"B","text":"'Everything is under control; the change window explains the alerts.'","outcome":"Two hours later the board hears the opposite from finance; your credit and the segment's safety are gone.","why":"Never file a hostile act under the benign flag to buy calm."},{"id":"C","text":"'We were breached and data is stolen.'","outcome":"Over-claim without flow evidence; legal and PR spin up for a fact you do not hold.","why":"Claim what the artefacts support — no more."}],"correct":"A","why":"Executive lines carry the technique, the state, the cost and the next step — nothing more, nothing less."}],"explanation":"The chain: scope text beats the calendar (staging), a bounded cost beats both extremes (isolate with capture), known-good beats live re-enable (persistence first), and the executive line claims exactly what artefacts support. Notice the recurring shape: every wrong branch either pays an unbounded cost or banks an unearned comfort. That is the EXTREMELY HARD core — the decisions are all defensible somewhere; only one survives here.","study":"Rewrite the four correct decisions as a one-page incident-card for your own payment segment."},{"id":"X02","type":"multi","title":"Three layers in 40 minutes","summary":"Claim only what four artefacts support","scenario":["The case file holds four artefacts collected between 02:58 and 03:38 UTC across three layers. Some are noise. One gap: the perimeter appliance has no endpoint telemetry, so you cannot see who typed on it."],"artefacts":[{"label":"ARTEFACT 1 — EDR, jump host PAY-JMP-01","kind":"log","filter":true,"lines":["03:12:04  process-create  cmd: netsh advfirewall set allprofiles state off   user: PAY\\pay_adm2  (account created 02:54)"]},{"label":"ARTEFACT 2 — perimeter firewall syslog","kind":"log","filter":true,"lines":["03:21:18 config commit  src 198[.]51[.]100[.]77  policy 'Any-Any-Allow' created  user: admin_local"]},{"label":"ARTEFACT 3 — cloud control plane (CloudTrail extract)","kind":"log","lines":["02:58:41  UpdateDetector  detector: prod-main  action: archiveFinding  identity: terraform-ci","03:02:33  AuthorizeSecurityGroupIngress  tcp 445  from 0[.]0[.]0[.]0/0  identity: terraform-ci"]},{"label":"ARTEFACT 4 — change database + housekeeping noise","kind":"log","lines":["CHG-4114  Nightly S3 lifecycle policy update  owner: data-eng  02:30  success","CHG-4117  RDS minor version maintenance  scheduled 03:00-04:00  success","NTP drift 41ms corrected 03:33"]}],"question":"Select the <b>THREE<\/b> conclusions the artefacts actually support.","hint":"Layer, identity, timing. One identity recurs across the cloud events; the fresh account recurs on the host. Certainty is not support.","options":[{"id":"A","text":"The campaign impaired three layers in 40 minutes: cloud rule, perimeter policy, host profiles — coordination, not coincidence.","why":"Correct — three layers, 26 minutes, each change expanding access."},{"id":"B","text":"The terraform-ci identity is the pivot and must be treated as compromised pending review.","why":"Correct — archiving the detection and opening the rule from one identity is not a deployment pattern."},{"id":"C","text":"The host-side account pay_adm2 was created minutes before use — attacker-made, not HR-provisioned.","why":"Correct — creation at 02:54, use at 03:12, on a segment nothing else touches at night."},{"id":"D","text":"Cardholder data was exfiltrated through the opened paths.","why":"No flow or volume evidence exists in the artefacts; exposure is shown, theft is not."},{"id":"E","text":"The perimeter admin_local typed the commands personally — the same human as the cloud actor.","why":"No endpoint telemetry on the appliance links admin_local to the others; the sessions are unlinked."},{"id":"F","text":"No incident exists — three artefacts sit inside ticketed maintenance windows.","why":"The tickets cover lifecycle and RDS work; none of them covers security groups, ACLs or host firewalls."}],"correct":["A","B","C"],"explanation":"Supportable claims travel exactly as far as the artefacts: a coordinated three-layer impairment (A), one identity as the pivot pending review (B), and an attacker-made local account (C). Exfiltration (D) needs flows you do not have; unifying the human behind admin_local (E) needs telemetry the appliance does not produce; the all-clear (F) leans on tickets whose scopes exclude everything observed. Senior triage is the discipline of the unsaid.","study":"For your next big case, write two columns — 'supported' and 'suspected' — and never let the second borrow the first's language."},{"id":"X03","type":"terminal","title":"Perimeter device — evidence that survives scrutiny","summary":"Timed terminal: five minutes, safe verbs only","scenario":["Legal holds the case. Your instruction from counsel: <i>capture the device's effective configuration so it survives scrutiny — change nothing, delete nothing, log nothing off<\/i>. You have one admin session on FG-EDGE-01 and five minutes before the next change window opens. This exercise has its own 5-minute limit, shown above your answer area.","You are in the FortiOS CLI. The safe verb family here is show (reads). The dangerous verbs — execute, delete, unset, erase — mutate the box. Choose whether to run at all; choose what to run."],"question":"Type the command that dumps the full effective configuration (read-only), run it, then press Check.","hint":"Restating the constraint: nothing may be written. FortiOS shows the full effective config with the two words after your session prompt — one verb, one target.","perEx":300,"terminal":{"title":"FG-EDGE-01 — simulated FortiOS CLI (admin session 88213)","prompt":"FG-EDGE-01 # ","banner":["FortiOS 7.4 — simulation for training only.","Counsel's constraint: evidence survives scrutiny; the box must not change."],"expected":"show full-configuration","elements":["show","full-configuration"],"elWhy":{"show":"the read verb — it prints; it never writes.","full-configuration":"the entire effective config (policies, objects, admin settings) in one read-only dump."},"dangerous":["execute","delete","unset","erase","factoryreset","reboot","shutdown"],"dangerousMsg":"That verb mutates the device — the opposite of counsel's constraint. Under legal hold, a changed configuration is evidence destroyed and a finding in the post-incident review.","outputLines":["config system global","    set hostname \"FG-EDGE-01\"","end","config firewall policy","    edit 1","        set srcintf \"wan1\"","        set dstintf \"lan\"","        set action accept","        set schedule \"Any-Allow-Out\"   <-- UNEXPECTED: created 03:21 by admin_local","    next","... (412 further lines captured to case file)","Read-only capture complete. Hash logged: case#88213."],"genericErr":"Not the capture command — and on a device under legal hold you get one session. Think: verb that reads, target that is whole."},"explanation":"show full-configuration is the read-only, complete capture: policies, objects, admin settings — the evidence counsel asked for, with the rogue Any-Any-Allow policy visible in place. The tempting verbs are the trap family: execute (reboot, factoryreset), delete, unset, erase all write — and under legal hold a written device is evidence lost. The command was the easy half; knowing that this is the right command, now, in this order, was the test.","study":"Pair every device you administer with its 'legal-hold verb': show, get, list, display — and rehearse it until it is reflex."},{"id":"X04","type":"multi","title":"Routine deployment — or cover for it?","summary":"Resolve the cloud noise against the deployment story","scenario":["The cloud team asserts: nightly Terraform runs at 03:00 under CHG-4110 ('state refresh only'), so the 03:02 security-group change is routine. You hold the control-plane extract."],"artefacts":[{"label":"ARTEFACT 1 — control-plane extract, 02:50–03:10 UTC","kind":"log","filter":true,"lines":["02:58:41  UpdateDetector action: archiveFinding  finding: UnauthorizedAPICall  identity: terraform-ci","02:59:12  GetAccessKeyLastUsed  identity: terraform-ci  key-age: 3 days  review-status: pending","03:02:33  AuthorizeSecurityGroupIngress  tcp 445  0[.]0[.]0[.]0/0  identity: terraform-ci","03:03:50  Terraform plan/apply  resources: 0 changed  (CHG-4110)"]},{"label":"ARTEFACT 2 — ticket CHG-4110 (full text)","kind":"log","lines":["'Nightly Terraform state refresh. No infrastructure changes expected. No security-group edits. No detector changes.'"]}],"question":"Select the <b>THREE<\/b> conclusions that survive the artefacts.","hint":"The ticket says what the deployment would NOT do. One identity did all three exceptional things. 'Pending' on a key review is a fact, not an accusation.","options":[{"id":"A","text":"The identity did three exceptional things in four minutes: archived the alert, opened the rule — while its own key review is still pending.","why":"Correct — detector change, SG change, and an unresolved key review on one identity."},{"id":"B","text":"The 03:02 change defeats the 'routine deployment' reading: the Terraform run itself changed zero resources.","why":"Correct — a zero-change run cannot produce a security-group edit that appears outside it."},{"id":"C","text":"The security-group change is malicious — the ticket explicitly excludes security-group edits.","why":"Correct — the scope text excludes it, so 'routine' is falsified by the ticket itself."},{"id":"D","text":"The nightly Terraform pipeline itself is the attacker's tool and must be rebuilt from scratch.","why":"The pipeline did nothing; the identity using it (or around it) is the problem. Rebuilding is a later, harder question."},{"id":"E","text":"No conclusion is possible until Terraform's authorisation logs arrive.","why":"Waiting on more logs while holding a detector-archive plus rule-open pair is not prudence — the pivot identity is actionable now."},{"id":"F","text":"The 3-day-old key proves the cloud team knew and approved the change.","why":"A pending review is the opposite of approval; the artefact shows a gap, not a sign-off."}],"correct":["A","B","C"],"explanation":"The conflict resolves on three legible facts: one identity performed the alert-archive, the rule-open, and carries an unresolved key review (A); the deployment run changed nothing, so it cannot be the change's author (B); and the ticket's own text excludes the change, falsifying the routine story (C). The pipeline-rebuild claim (D) jumps ahead of the identity investigation, the wait-for-logs position (E) leaves an actionable pivot untouched, and reading 'pending review' as approval (F) inverts the artefact. This is AN1188's world: expansions beyond baselines correlated with privileged API activity.","study":"Read ticket scope text first, pipeline telemetry second — the order that lets a cover story collapse in one line."},{"id":"X05","type":"order","title":"Sequence the senior response","summary":"Five actions across volatile and durable evidence","scenario":["Confirmed: perimeter ACL opened, cloud SG opened, host profiles killed. Devices hold volatile session state; CloudTrail persists; the identity still holds keys. Order the five response actions — two orderings differ by real cost."],"question":"Drag the five actions into the order you would run them.","hint":"Volatile captures precede revocations; revocations precede restores; restores precede paperwork. Device sessions evaporate — CloudTrail does not.","items":[{"id":"s1","label":"Capture device config diffs and admin-session state (volatile)"},{"id":"s2","label":"Revoke the rogue ACL and security-group rules"},{"id":"s3","label":"Rotate device and deploy-role credentials, kill active sessions"},{"id":"s4","label":"Restore host firewall profiles from the golden baseline"},{"id":"s5","label":"Deliver the executive report with the confirmed timeline"}],"correct":["s1","s2","s3","s4","s5"],"why":["Device session state and unsaved diffs evaporate on logout or commit — capture them before any revocation touches the box.","With volatile proof safe, close the live exposure: rogue rules go first because they are open doors this second.","Rotate next: every open door was opened with credentials; revoking doors without revoking keys invites door number two.","Restore host profiles only after the identity is dead — otherwise the next netsh run re-kills them (persistence beats switches).","Report last, with the timeline the previous four steps produced — executives can only trust what you verified."],"explanation":"The senior sequence prices each artefact: device session state is the most perishable thing in the case, so it is captured first even though revocation 'feels' urgent. CloudTrail, by contrast, persists — which is why a cloud-only ranking can safely lead with revocation, and this one cannot: here the device itself is the recorder, and it forgets on logout. Restore-after-rotation is the anti-persistence rule: never re-enable protection under credentials the attacker still holds.","study":"Redraw this order for three of your real systems, labelling each step 'volatile' or 'durable'."},{"id":"X06","type":"qcm","title":"The best practice that backfires","summary":"Why the reboot playbook is wrong on this host","scenario":["War room, 04:10. PAY-CORE-02 is isolated with capture running. A senior colleague proposes the house playbook: <i>'Reboot to clear memory-resident malware, then re-enable the firewall — standard practice.'<\/i>","Known facts: the impairment was registry-side (EnableFirewall=0 plus service stop) and a scheduled task re-applies it; memory capture is still in progress."],"question":"Why is the colleague's standard practice wrong here?","hint":"Two claims hide in 'standard practice': that a reboot clears the problem, and that it costs nothing. Check both against registry-side persistence and the running capture.","options":[{"id":"A","text":"The impairment is configuration-persisted and task-reapplied — a reboot neither restores rules nor removes the task, and it destroys the memory capture in progress.","why":"Correct — reboot solves neither half of THIS problem while erasing the evidence half."},{"id":"B","text":"Reboots are only wrong on legacy operating systems.","why":"The OS version is irrelevant; the persistence mechanism and the capture are the issue."},{"id":"C","text":"The playbook is right; the firewall will simply come back on after reboot.","why":"The registry value says otherwise — profiles come back off, and the task re-kills anything you fix."},{"id":"D","text":"Rebooting is wrong because the malware would spread during the reboot window.","why":"The host is already isolated; spreading during reboot is not the failure mode here."}],"correct":["A"],"explanation":"Best practices carry assumptions. 'Reboot to clear memory' assumes the problem lives in memory; here it lives in the registry and a scheduled task that re-applies it — the reboot would return a host whose firewall is still off and whose re-killer still runs. Worse, the reboot would wipe the memory capture that is half-finished. This is the EXTREMELY HARD trap in its pure form: a widely used practice, wrong in this specific world, and the cost would be silent.","study":"For each playbook step you own, write its hidden assumption — then find the artefact that would falsify it."},{"id":"X07","type":"spot","title":"Why the SIEM missed the quiet path","summary":"Find the line that narrows the detection to death","scenario":["Post-incident: the SIEM rule 'FW-PROFILE-KILL' never fired although the attacker used PowerShell Set-NetFirewallProfile -Enabled False and a registry write. The rule DID fire once in testing, months ago. The saved search is below."],"question":"Click the <b>one line<\/b> that caused the coverage gap.","hint":"The attacker used two mechanisms that were never netsh. One line hard-codes that single mechanism.","code":{"label":"ARTEFACT 1 — saved search FW-PROFILE-KILL (pseudo-SPL)","lines":["index=win host=PAY-* EventCode=4688","  AND process=netsh.exe","  AND cmdline MATCHES /set allprofiles state off/","  | alert severity=critical to soc","  # owner: det-eng, reviewed 2026-02"]},"correct":["3"],"lineWhy":{"3":"The command-line predicate matches only the literal netsh profile-kill phrasing — Set-NetFirewallProfile and registry writes share none of those tokens, so the rule is blind to them.","1":"Scoping to payment hosts and 4688 events is intentional coverage, not the gap.","2":"Anchoring on netsh.exe is fine for one path — the gap is that NOTHING else is covered by the other lines.","4":"Alert routing does not affect detection logic.","5":"A review comment documents age; it does not filter events."},"explanation":"Line 3 welds the detection to one literal command. The technique T1686.003 has at least three roads — netsh, the PowerShell cmdlet, the registry — and the rule watches one. The fix is behavioural: alert on the outcome (profile state change events, FirewallPolicy registry writes, service stop) rather than on a command string. This is why the ATT&CK analytic AN0406 lists processes AND registry — the union, not the union's most famous member.","study":"For each command-string rule you own, enumerate the other roads to the same outcome — then decide which of them your telemetry can see."},{"id":"X08","type":"multi","title":"Compensating detections where EDR cannot live","summary":"Three real witnesses for perimeter devices","scenario":["The perimeter appliances cannot run endpoint agents — vendor policy, no exceptions. Yet DET0306 expects config-change detection there. You must design compensating detections with what the devices CAN emit."],"question":"Select the <b>THREE<\/b> compensating detections that actually work on these devices.","hint":"What can a firewall appliance emit at all? Config changes, admin sessions, and its own running config — nothing else.","options":[{"id":"A","text":"Stream config-change syslog (with commit session metadata) to the SIEM and alert on unusual sources","why":"Correct — the device's own change records are its honest witness."},{"id":"B","text":"Correlate admin authentication from out-of-band sources (AAA/IdP) against commit sessions","why":"Correct — session identity plus commit metadata reconstructs who did what."},{"id":"C","text":"Scheduled config diff against a golden baseline with review of unexplained deltas","why":"Correct — catches silent drift even when the change events were missed or suppressed."},{"id":"D","text":"Install antivirus on the appliance to catch rule-change malware","why":"There is no such agent, and rule changes are admin-plane actions, not binaries."},{"id":"E","text":"Rely on the EDR telemetry of the appliance itself","why":"No agent exists on the device — that is the premise of the exercise."},{"id":"F","text":"Watch only external TCP reachability of the management interface","why":"Sees one exposure shape; blind to rule-base decay, logging cuts and internal-side changes."}],"correct":["A","B","C"],"explanation":"Compensating detection starts from what the asset can honestly emit: config-change syslog (the action), out-of-band auth correlation (the actor), and baseline diffs (the drift). The wrong answers all import an endpoint assumption the device cannot satisfy. This is how DET0306 gets built in the real world — not by wishing for EDR, but by triangulating the three witnesses the box actually offers.","study":"Pick one agent-less device in your estate and map its three witnesses tonight; one of them is usually not wired up."},{"id":"X09","type":"branch","title":"The 03:00 hit that may be a non-event","summary":"Do-nothing-yet done properly","scenario":["03:00 — hunt hit: netsh advfirewall show allprofiles on PAY-JMP-01, account agent-rollout. No state change recorded, no rule edits, nothing else on the host.","Conflicts: agent-rollout was created 2 days ago by the platform team; ticket CHG-4123 covers a 500-host monitoring-agent rollout TONIGHT; the agent's vendor config includes a nightly firewall-state read. But your hunt rule exists precisely because attackers use netsh first.","The CISO's standing order: no wolf-cries, no missed wolves."],"question":"Work the three decisions that separate a non-event from a wolf.","hint":"The command's verb, the ticket's scope, and the account's birth certificate. Read-only plus rollout equals verification — not escalation, not closure without a note.","steps":[{"prompt":"STEP 1 — First interpretation of the hit?","options":[{"id":"A","text":"Likely benign pending verification — the verb is read-only, the ticket is live and fleet-wide, the account is new but platform-owned.","outcome":"You keep the case open with 'verify' as the next action — no page, no silence.","why":"Correct — the pattern matches a documented rollout; verification is still owed."},{"id":"B","text":"Escalate as T1686 reconnaissance — netsh at 03:00 is never benign.","outcome":"You wake three teams for a vendor agent's nightly read; the second wolf-cry this quarter costs you the third one's urgency.","why":"The verb and the ticket argue against escalation — burning the alert budget on a read is the classic overreach."},{"id":"C","text":"Close it outright — tickets make everything safe.","outcome":"Closed cases need no evidence; if the agent config ever changes to a write verb, nobody is looking anymore.","why":"Closure without verification is the mirror-image error of over-escalation."}],"correct":"A","why":"Do-nothing-yet is a decision with content: hold the case, name the verification, refuse both panic and shrug."},{"prompt":"STEP 2 — What do you verify (pick the complete check)?","options":[{"id":"A","text":"Confirm PAY-JMP-01 is inside CHG-4123's scope AND the agent's shipped config runs show allprofiles (read-only) nightly.","outcome":"Both confirmed: host in scope, agent config read-only. The hit now has a complete benign explanation.","why":"Correct — scope AND behaviour: either alone leaves the door open."},{"id":"B","text":"Ask the platform team 'is this you?' and accept a yes.","outcome":"A yes without the agent config is a promise, not evidence — vendor configs ship surprises.","why":"Verbal confirmation is not artefact confirmation."},{"id":"C","text":"Verify nothing — the ticket number in the log is enough.","outcome":"The ticket never named this host's inclusion or the read behaviour; you inferred both.","why":"Inference from a ticket ID is how non-events get wrongly closed and events get wrongly filed."}],"correct":"A","why":"The complete check pairs inclusion (scope) with behaviour (the verb actually shipped)."},{"prompt":"STEP 3 — Final disposition and guardrail?","options":[{"id":"A","text":"Close as verified non-event with the artefacts attached; keep the hunt rule but exclude nothing — let it keep firing on the agent so a future config change cannot hide.","outcome":"The case closes with proof; the rule stays honest — the day the agent writes instead of reads, you see it immediately.","why":"Correct — verified closure plus an unblinded rule: the CISO's two orders both survive."},{"id":"B","text":"Close and add a permanent exclusion for agent-rollout netsh activity.","outcome":"The exclusion outlives the rollout: if the agent (or its stolen identity) ever runs set, the rule is blind by your own hand.","why":"Permanent exclusions are attacker real estate; carve-outs must expire with their reason."},{"id":"C","text":"Keep the case open indefinitely 'for monitoring'.","outcome":"An open case with no owner decays into noise; your queue learns to ignore it.","why":"Open-forever is closure for people who dislike decisions."}],"correct":"A","why":"The guardrail completes the senior pattern: close on evidence, keep the sensor honest, let expiry discipline the exceptions."}],"explanation":"The chain: interpretation (read-only + live ticket = verify, not panic), verification (scope AND shipped behaviour — artefacts, not promises), disposition (close on evidence, rule stays unexcluded). Each wrong branch fails the CISO's standing order in a different direction: wolf-crying (B1), quiet-closing (C1, B2), or queue rot (C3). Note the expiry principle from step 3 — the same one that governs the migration exception in the HARD file: carve-outs die when their reason dies.","study":"Draft your own 'non-event card': verb, scope, behaviour check, disposition, guardrail — five lines you can defend."},{"id":"X10","type":"match","title":"Route six artefacts to six analytics","summary":"The full DET0145 family plus the cloud analytic","scenario":["Triage routing drill. Six artefacts from one multi-layer case must each reach the analytic that fires on them."],"question":"Match each artefact to the analytic that covers it.","hint":"The platform names the analytic: Windows netsh, Linux iptables, macOS tools, ESXi CLI, network ACL commits — and the cloud control plane has its own.","items":[{"id":"w1","label":"netsh advfirewall set allprofiles state off on PAY-JMP-01","why":"Windows host path — AN0406."},{"id":"w2","label":"iptables -F (flush) on a Linux bastion","why":"Linux rule tampering — AN0407."},{"id":"w3","label":"socketfilterfw --globalstate off on a macOS laptop","why":"macOS application firewall — AN0408."},{"id":"w4","label":"esxcli network firewall set --enabled=false on ESXI-03","why":"Hypervisor firewall via CLI — AN0409."},{"id":"w5","label":"'no access-list 101' config commit on the core router","why":"Network device ACL logic — AN0410."},{"id":"w6","label":"AuthorizeSecurityGroupIngress allowing 0[.]0[.]0[.]0/0 in the cloud console","why":"Cloud control-plane expansion — AN1188 under DET0424."}],"slots":[{"id":"z1","label":"AN0406 — Windows hosts"},{"id":"z2","label":"AN0407 — Linux"},{"id":"z3","label":"AN0408 — macOS"},{"id":"z4","label":"AN0409 — ESXi"},{"id":"z5","label":"AN0410 — network device ACL CLI"},{"id":"z6","label":"AN1188 — cloud control plane (DET0424)"}],"correct":{"w1":"z1","w2":"z2","w3":"z3","w4":"z4","w5":"z5","w6":"z6"},"explanation":"One campaign, six artefacts, six analytics — and four owner teams. The mapping is the case's spine: it tells you which telemetry to pull next, which team to page, and where coverage gaps would hide. Drills like this are how senior analysts keep the whole DET0145 family in their head when the multi-layer incident lands at 03:00 and the war room is loud.","study":"Recreate this match from memory in a week; then annotate each pair with the owning team in your organisation."},{"id":"X11","type":"fill","title":"The executive incident report","summary":"Five keywords the board requires","scenario":["Counsel requires the executive summary to be precise: sub-technique named, detection strategy named, mitigation named, no adjectives doing technical work. Draft below — insert the five keywords."],"question":"Complete the executive report with the five missing keywords.","hint":"Two blanks are IDs (one sub-technique, one strategy), one is a cloud term, one is the address notation counsel insisted on, one is a mitigation ID for identities.","template":"At 03:02 UTC an unauthorised actor expanded the production security group to <b>{{1}}<\/b> — any source — within the cloud <b>{{2}}<\/b>. The action is consistent with sub-technique <b>{{3}}<\/b>; the control-plane change class is covered by detection strategy <b>{{4}}<\/b>. Immediate actions: revoke the rule, rotate the deploy-role credentials, and enforce <b>{{5}}<\/b> least-privilege review on cloud identities.","blanks":[{"id":"1","correct":"0[.]0[.]0[.]0/0","distractors":["10[.]0[.]0[.]0/8","one specific address"],"why":"The artefact shows the any-source expansion; the defanged notation is the report standard."},{"id":"2","correct":"control plane","distractors":["data plane","storage layer"],"why":"Security-group edits happen in the control plane — the management surface, not the traffic path."},{"id":"3","correct":"T1686.001","distractors":["T1686.003","TA0112"],"why":"Cloud firewall tampering is T1686.001; the Windows sub-technique and the tactic ID are near-misses."},{"id":"4","correct":"DET0424","distractors":["DET0145","DET0306"],"why":"DET0424 is the cloud-firewall detection strategy; DET0145 is the OS family, DET0306 the perimeter device one."},{"id":"5","correct":"M1018","distractors":["M1051","M1024"],"why":"Least-privilege on identities is M1018 User Account Management — the mitigation the review implements."}],"explanation":"Every keyword does legal-grade work: the defanged any-source notation (no ambiguity about exposure), control plane (which surface), T1686.001 (which behaviour), DET0424 (which detection class — proving the gap was known and documented), M1018 (which control the review implements). Boards act on reports whose nouns are ATT&CK nouns; near-miss IDs route the follow-up work to the wrong teams.","study":"Take one past executive summary of yours and replace every vague noun with an ATT&CK noun; feel the difference in length."},{"id":"X12","type":"order","title":"Rank the five cloud actions — exposure arithmetic","summary":"Priority ranking on the durable-evidence slice of the case","scenario":["Cloud-only slice of the payment-segment case, on your desk while the device team works its own queue. Facts: the rogue security-group rule is live; the compromised deploy-role identity still holds active keys and sessions; CloudTrail records this layer durably, so nothing here is perishable; a compliance notification clock started when the exposure was confirmed; and the root-cause fix for the finding that let the identity archive its own alert is still unscheduled. Rank the five actions — first is 'do this minute'."],"question":"Drag the five actions into priority order (most urgent first).","hint":"Exposure this minute, then the actor, then the sweep, then the obligations, then the hardening. CloudTrail persists — nothing on this list spoils while you think.","items":[{"id":"p1","label":"Revoke the rogue security-group ingress rule"},{"id":"p2","label":"Disable the compromised deploy-role identity, rotate its keys, kill its sessions"},{"id":"p3","label":"Diff the full security-group estate against baseline for sibling rogue rules"},{"id":"p4","label":"Start the compliance notification workflow with the confirmed facts"},{"id":"p5","label":"Schedule the remediation of the finding that let the identity archive its own alert"}],"correct":["p1","p2","p3","p4","p5"],"why":["The any-source rule is the only thing actively harming the business this minute; revoking it is seconds of work and durable evidence is untouched by it.","The identity is the generator: while its keys work, every door you close reopens. Kill the actor before the sweep.","Attackers rarely open exactly one rule; the baseline diff finds siblings while the estate is still freshly mapped.","The notification clock is real, and it can only start truthfully once exposure is closed and the actor is dead.","The root-cause remediation matters, but nothing about it is urgent this minute; schedule it while attention lasts."],"explanation":"This ranking is exposure arithmetic on durable evidence: rule, actor, sweep, obligations, hardening. Because CloudTrail persists, nothing here spoils — which is exactly why the volatile-capture-first rule of the response-sequence exercise does not apply on this slice: there, device sessions evaporated on logout, here nothing does. The classic fails are patch-first (feels proactive, ignores the open door) and notify-first (starts a clock on a story you cannot yet describe truthfully).","study":"Split your next incident's actions into 'perishable' and 'durable' columns — the ranking order lives in that split."},{"id":"X13","type":"qcm","title":"Two dashboards, one host, two truths","summary":"Which signal wins when the state views disagree?","scenario":["05:10, war room. The SIEM dashboard tile for PAY-CORE-02 shows 'Firewall profiles: OFF' with last event 03:12. A live config pull run at 05:08 shows all three profiles ON with the standard rule set.","Known facts from the case: the impairment at 03:12 was registry-side; the responder runbook step 'restore profiles from golden baseline' was executed at 03:58 and logged as completed; the SIEM tile renders the last seen EVENT, not the current state."],"question":"Which reading wins, and what is the right follow-up?","hint":"One signal is a view of history, the other is a measurement of now. One case artefact explains why 'now' looks different from 03:12.","options":[{"id":"A","text":"The live pull wins — the 03:58 baseline restore is the missing link; attach the restore artefact to the tile's history and note the tile's time basis explicitly.","why":"Correct. The tile shows the newest event it ever saw; the pull measures the present; the 03:58 restore explains the difference."},{"id":"B","text":"The dashboard wins — a red tile means the profiles are still off; re-run containment now.","why":"Re-containment on a host whose profiles are verifiably on burns an hour and treats a display artefact as an intrusion."},{"id":"C","text":"Both views are broken — the host must be reimaged because its true state cannot be known.","why":"The state IS known: the live pull is current truth; the tile is an event-history view doing a state job."},{"id":"D","text":"Profiles ON is the hostile reading — the attacker must have flipped them back to look clean.","why":"ON is the intended state; the suspicious direction is OFF, and the logged restore already explains the flip."}],"correct":["A"],"explanation":"The conflict is not between two sensors but between two TIME BASES: the tile renders the last event it recorded (03:12, the registry-side kill), while the pull reads the host as it is now. The 03:58 golden-baseline restore sits between them and fully explains the difference. The senior follow-up is to close the confusion explicitly — the restore artefact on the tile's history, a note about the tile's event-history basis — because an unexplained red tile re-triggers the same false alarm on the next shift. And 'profiles ON' is the intended state: treating it as hostile inverts the technique's direction of harm.","study":"Label each of your dashboards 'event-history' or 'current-state'; most shift-time confusion is a time-basis error, not a threat."},{"id":"X14","type":"spot","title":"One rule in the baseline is not the baseline","summary":"Find the rogue rule wearing a friendly name","scenario":["A GPO-managed firewall policy exports 400 rules. Your diff job flags 4 lines. The baseline document (below) lists every approved exception. One flagged line is not in the baseline — and its name is chosen to blend in."],"artefacts":[{"label":"ARTEFACT 1 — baseline document, approved inbound exceptions","kind":"log","lines":["APPROVED: SCCM-Client tcp/10123 (change CHG-3891)","APPROVED: Domain-Join tcp/88 (change CHG-3500)","APPROVED: Netlogon-Service tcp/123 (change CHG-3500)","NOT APPROVED: any rule named after OS components; any port above 10240"]}],"question":"Click the <b>one line<\/b> that is not part of the approved baseline.","hint":"Check each rule name and port against the approved list. One name borrows the operating system's innocence; one port range is explicitly excluded.","code":{"label":"ARTEFACT 2 — flagged rule lines (diff, click to select)","lines":["add  name=\"SCCM-Client\" dir=in action=allow protocol=TCP localport=10123","add  name=\"Domain-Join\" dir=in action=allow protocol=TCP localport=88","add  name=\"Cortana\" dir=in action=allow protocol=TCP localport=47000","add  name=\"Netlogon-Service\" dir=in action=allow protocol=TCP localport=123"]},"correct":["3"],"lineWhy":{"3":"'Cortana' on tcp/47000: the name mimics an OS component and 47000 sits in the explicitly excluded port range — and it is absent from the approved list. This mirrors the HiddenFace procedure.","1":"SCCM-Client tcp/10123 is approved under CHG-3891 — name and port match the baseline.","2":"Domain-Join tcp/88 is approved under CHG-3500.","4":"Netlogon-Service tcp/123 is approved under CHG-3500."},"explanation":"Line 3 fails every test at once: the name borrows an OS component's innocence, the port sits in the excluded range, and no change record approves it — the same shape as the HiddenFace procedure from the T1686.003 table, where a rule named 'Cortana' opened TCP 47000. The near-misses are genuinely approved rules, which is exactly why rule-name governance matters: attackers name rules to survive eyeballs. Your diff job plus the baseline document is the pair that catches this.","study":"If your rule base lacks a baseline document with change records, that absence is your first finding — write it up."},{"id":"X15","type":"multi","title":"What the business must hear","summary":"Two impacts the artefacts support, three they do not","scenario":["The payment segment's firewall rules were opened to any source for 38 minutes before revocation. Flow telemetry for the window is incomplete (two collectors were offline). Leadership asks: what must we tell the business NOW?"],"question":"Select the <b>TWO<\/b> impact statements the artefacts support today.","hint":"Exposure is provable; theft needs flows you do not have. Say what the doors were, not what walked through them.","options":[{"id":"A","text":"The segmentation assumption between corporate zones and cardholder-data systems was broken for 38 minutes — a compliance-relevant exposure.","why":"Correct — the opened rules are documented; the segmentation control demonstrably failed its window."},{"id":"B","text":"A lateral-movement path into payment systems existed via actor-controlled infrastructure documented in the case.","why":"Correct — the opened rules prove the path existed; the actor's infrastructure is documented in the case file."},{"id":"C","text":"Cardholder data was exfiltrated during the window.","why":"The collectors that would show it were offline — the artefacts neither prove nor exclude theft; claiming it invents a fact."},{"id":"D","text":"The firewall platform is end-of-life and must be replaced this quarter.","why":"A procurement opinion, not an incident impact; nothing in the artefacts speaks to lifecycle."},{"id":"E","text":"Internet bandwidth costs will rise because the rules were open.","why":"Rule openness does not bill bandwidth; this is filler with a decimal point."}],"correct":["A","B"],"explanation":"Two statements survive the incomplete telemetry: the segmentation control demonstrably failed for a documented window (a compliance fact), and a lateral path existed via actor-controlled infrastructure (a case fact). Exfiltration (C) is exactly the claim the offline collectors make unprovable — the honest line is 'cannot exclude, investigating', which is a different sentence with different liabilities. D and E are plausible-sounding filler that boards smell instantly.","study":"Practise the three-part sentence: what the artefact proves, what it cannot exclude, what happens next."},{"id":"X16","type":"order","title":"Rebuild the attack lifecycle from six artefacts","summary":"Order the campaign's steps for the final report","scenario":["Six dated artefacts from the multi-layer case. Order them into the attacker's lifecycle for the report's timeline figure. The timestamps are the backbone; the dependency logic confirms them: the commit needed the device login, the RDP needed the host kill."],"artefacts":[{"label":"ARTEFACT 1 — case artefact index","kind":"log","lines":["02:31  exploit against the exposed VPN appliance (vendor CVE, packet captures)","02:47  valid-account login to device management from 198[.]51[.]100[.]77","03:21  perimeter policy 'Any-Any-Allow' created (commit 88213)","03:12  netsh advfirewall set allprofiles state off on PAY-JMP-01","03:30  RDP session from PAY-JMP-01 to PAY-CORE-02","03:35  beacon to parked domain from PAY-CORE-02 over an opened path"]}],"question":"Drag the six artefacts into lifecycle order.","hint":"Entry, then identity, then the two impairments (device first or host first? follow the timestamps), then movement, then the traffic that needed both doors.","items":[{"id":"l1","label":"Exploit of the exposed VPN appliance"},{"id":"l2","label":"Valid-account login to device management"},{"id":"l3","label":"Perimeter policy 'Any-Any-Allow' created"},{"id":"l4","label":"Host firewall profiles killed on PAY-JMP-01"},{"id":"l5","label":"RDP from PAY-JMP-01 to PAY-CORE-02"},{"id":"l6","label":"Beacon from PAY-CORE-02 over the opened path"}],"correct":["l1","l2","l4","l3","l5","l6"],"why":["Entry first: the appliance exploit at 02:31 starts everything.","Identity next: the valid-account device login at 02:47 turns a foothold into admin reach.","The host impairment at 03:12 — the T1686.003 action that opened the interior first, run by the fresh local admin on the jump host.","The perimeter impairment at 03:21 — the commit needed only the 02:47 device login, and it lands after the host kill in the timeline.","Movement: RDP across the segment at 03:30 needed the host-side door.","The beacon (03:35) is the payoff that used both doors — the last artefact, not the first."],"explanation":"The timeline tells a coherent story: exploit, identity, two impairments (host, then perimeter), movement, and the beacon that both doors were built for. The timestamps decide the two impairments — the 03:12 host kill precedes the 03:21 perimeter commit — and the dependency logic confirms the rest: both impairments hang off the identity established at 02:47, and the 03:30 RDP needed the host-side door. That is what turns six rows into an argument a board and a forensic reviewer can both follow. Note the technique IDs that anchor the figure: T1686.003 and T1686.002, with the entry technique and the valid accounts named beside them.","study":"Redraw this timeline with tactic columns — the same six artefacts, now wearing their tactic labels."}]};</script>

function normCmd(c){return String(c||'').trim().replace(/\s+/g,' ').toLowerCase();}
/* ---------------- grading ---------------- */
function scoreExercise(H,W,N){return Math.max(0,(H-W)/N);}
function grade(ex,ans){
 var H=0,W=0,N=0,items=[];
 function add(label,st,why){items.push({label:label,st:st,why:why||''});}
 var t=ex.type;
 if(t==='qcm'||t==='multi'){
  var C=ex.correct,Nn=C.length;
  var sel=ans||[];var hit=0,bad=0;
  ex.options.forEach(function(o){
   var inC=C.indexOf(o.id)>=0,inS=sel.indexOf(o.id)>=0;
   if(inC&&inS){hit++;add(o.text,'ok',o.why||'');}
   else if(inC&&!inS){add(o.text,'miss',o.why||'');}
   else if(!inC&&inS){bad++;add(o.text,'bad',o.why||'This option does not belong in the correct answer.');}
  });
  H=hit;W=bad;N=Nn;
 }else if(t==='triage'){
  N=ex.alerts.length;
  ex.alerts.forEach(function(a){var c=ex.correct[a.id],g=ans[a.id];
   var albl=byId(ex.actions,c).label;
   if(g===c){H++;add(a.id+' \u2192 '+albl,'ok',a.why||'');}
   else if(g){W++;add(a.id+' \u2192 '+byId(ex.actions,g).label,'bad',a.why||'');}
   else{add(a.id+' \u2192 '+albl,'miss',a.why||'');}});
 }else if(t==='branch'){
  N=ex.steps.length;
  ex.steps.forEach(function(s,i){var g=ans[i];
   var cl=byId(s.options,s.correct).text;
   if(g===s.correct){H++;add('Step '+(i+1)+': '+cl,'ok',s.why||'');}
   else if(g){W++;add('Step '+(i+1)+': '+byId(s.options,g).text,'bad',s.why||'');}
   else{add('Step '+(i+1)+': '+cl,'miss',s.why||'');}});
 }else if(t==='dragdrop'||t==='match'){
  N=ex.items.length;
  ex.items.forEach(function(it){var c=ex.correct[it.id],g=ans[it.id];
   var cl=byId(ex.slots,c).label;
   if(g===c){H++;add(it.label+' \u2192 '+cl,'ok',it.why||'');}
   else if(g){W++;add(it.label+' \u2192 '+byId(ex.slots,g).label,'bad',it.why||'');}
   else{add(it.label+' \u2192 '+cl,'miss',it.why||'');}});
 }else if(t==='order'){
  N=ex.correct.length;
  ex.correct.forEach(function(cid,i){var g=ans[i];
   var cl=byId(ex.items,cid).label;
   if(g===cid){H++;add('Position '+(i+1)+': '+cl,'ok',(ex.why||[])[i]||'');}
   else if(g){W++;add('Position '+(i+1)+': '+byId(ex.items,g).label,'bad',(ex.why||[])[i]||'');}
   else{add('Position '+(i+1)+': '+cl,'miss',(ex.why||[])[i]||'');}});
 }else if(t==='fill'){
  N=ex.blanks.length;
  ex.blanks.forEach(function(b){var g=ans[b.id];
   if(g===b.correct){H++;add('Blank '+b.id+': '+b.correct,'ok',b.why||'');}
   else if(g){W++;add('Blank '+b.id+': '+g,'bad',b.why||'');}
   else{add('Blank '+b.id+': '+b.correct,'miss',b.why||'');}});
 }else if(t==='spot'){
  var C2=ex.correct;N=C2.length;
  var seen={};
  (ans||[]).forEach(function(lid){seen[lid]=true;});
  C2.forEach(function(lid){
   var lbl='Line '+lid;
   if(seen[lid]){H++;add(lbl,'ok',(ex.lineWhy||{})[lid]||'');}
   else{add(lbl,'miss',(ex.lineWhy||{})[lid]||'');}});
  Object.keys(seen).forEach(function(lid){if(C2.indexOf(lid)<0){W++;add('Line '+lid,'bad',(ex.lineWhy||{})[lid]||'This line is not the mistake.');}});
 }else if(t==='terminal'){
  var tt=ex.terminal,norm=normCmd(ans),exp=normCmd(tt.expected);
  N=tt.elements.length;
  var tokens=norm?norm.split(' '):[];
  var expectedSet={};
  tt.elements.forEach(function(e){expectedSet[e]=true;});
  tt.elements.forEach(function(e){
   var got=e.indexOf(' ')>=0?(norm.indexOf(e)>=0):(tokens.indexOf(e)>=0);
   if(e.indexOf('=')>=0)got=norm.indexOf(e)>=0;
   if(got){H++;add(e,'ok',(tt.elWhy||{})[e]||'');}
   else{add(e,'miss',(tt.elWhy||{})[e]||'');}});
  tokens.forEach(function(tok){
   if(!tok)return;
   if(tt.elements.indexOf(tok)>=0)return;
   var isArg=tok.indexOf('=')>=0;
   var isKnownExtra=tt.allowedExtra&&tt.allowedExtra.indexOf(tok)>=0;
   if(isArg&&!isKnownExtra){var keyOk=tt.elements.some(function(e){return e.indexOf('=')>=0&&e.split('=')[0]===tok.split('=')[0];});
    if(!keyOk){W++;add(tok,'bad','This option is not needed and points the command in the wrong direction.');}}
  });
  if(tokens[0]&&tt.elements[0]&&tokens[0]!==tt.elements[0].split(' ')[0]){W++;add(tokens[0],'bad','Wrong tool for this goal.');}
 }
 var credit=scoreExercise(H,W,N);
 if(S.hintUsed[ex.id])credit=Math.max(0,credit-0.10);
 var g={credit:credit,items:items,H:H,W:W,N:N};
 if(t==='terminal'){
  var tt2=ex.terminal,norm2=normCmd(ans);
  g.dangerous=tt2.dangerous&&norm2!==normCmd(tt2.expected)&&tt2.dangerous.some(function(d){return norm2.indexOf(d.toLowerCase())>=0;});
 }
 return g;
}

 $('examView').classList.add('hidden');$('reviewView').classList.add('hidden');$('resultsView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:'+SEVCOL[SEV]+'"><span class="ic">\u{1F4CA}</span> RESULTS \u2014 '+esc(META.title)+'</div><div class="blk-b">';
 h+='<div class="res-head"><div><div class="res-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div><div style="color:var(--text-secondary)">final score \u00B7 '+S.sum.toFixed(1)+' credits / '+S.answered+' answered</div></div></div>';
 h+='<div class="res-grid">';
 h+='<div class="res-cell ok"><div class="rc-ico">\u2714 Fully correct</div><div class="rc-n">'+byIdc.ok+'</div><div class="rc-l">exercises with credit 1.0</div></div>';
 h+='<div class="res-cell part"><div class="rc-ico">\u2714 Partially correct</div><div class="rc-n">'+byIdc.part+'</div><div class="rc-l">'+(byIdc.part?('avg credit '+(partSum/byIdc.part).toFixed(2)):'no partial answers')+'</div></div>';
 h+='<div class="res-cell bad"><div class="rc-ico">\u2716 Fully incorrect</div><div class="rc-n">'+byIdc.bad+'</div><div class="rc-l">credit 0.0</div></div>';
 h+='<div class="res-cell skip"><div class="rc-ico">\u26A0 Skipped \u2014 excluded</div><div class="rc-n">'+skippedList.length+'</div><div class="rc-l">not counted in numerator or denominator</div></div>';
 h+='</div>';
 if(skippedList.length){h+='<p class="body" style="margin-top:12px;color:var(--state-skipped)">\u26A0 Excluded (never answered): '+skippedList.map(function(e){return esc(e.title);}).join(' \u00B7 ')+'</p>';}
 h+='<div class="time-report">Time report \u2014 timer budget: <b>'+Math.round(META.timerSeconds/60)+' min</b> \u00B7 time left: <b>'+clock(S.timer.remaining)+'</b> \u00B7 paused manually: <b>'+clock(S.timer.manualSec)+'</b> \u00B7 paused for feedback review: <b>'+clock(S.timer.autoSec)+'</b> \u00B7 ended by: <b>'+(reason==='timeout'?'timer reached 00:00':'you pressed Submit')+'</b></div>';
 if(passed){
  h+='<div class="cert"><div class="c-big">\u2714 PASS \u2014 Certified: '+esc(META.title)+'</div><div class="c-sub">You reached '+pct+'%, above the 70% pass mark. Strong work: you can read, recognise and respond to this ATT&amp;CK object like a working analyst.</div></div>';
 }else{
  h+='<div class="cert fail"><div class="c-big">\u2716 FAIL \u2014 '+pct+'% (pass mark 70%)</div><div class="c-sub">Not this time. Re-read the intro notes, review the feedback from each exercise, and try again \u2014 every retake reshuffles questions and options.</div></div>';
 }
 h+='<div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnRetake">\u21BB Retake Exam</button></div>';
 h+='</div></section>';
 $('resultsView').innerHTML=h;
 var rb=$('btnRetake');
 if(rb)rb.addEventListener('click',function(){startExam(true);});
 reportScore(S.sum,S.answered,pct,passed);
 renderHeader();
}
function reportScore(creditSum,answeredCount,percent,passed){
 if(S.reported)return;S.reported=true;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
 var d=event.data;if(!d)return;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 S.user={name:d.username||'',country:d.country||'',locale:d.locale||''};
 /* theme field is always 'dark'; this file is dark-only by contract, nothing toggles */
 renderHeader();
});
/* ---------------- pause / hint ---------------- */
function togglePause(){
 if(S.view==='results')return;
 if(S.timer.state==='PAUSED_MANUAL'){
  tSet(S.pausePrev||'RUNNING');S.pausePrev=null;
  var m=$('pauseMask');if(m)m.remove();
 }else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.pausePrev=S.timer.state;tSet('PAUSED_MANUAL');
  var d=document.createElement('div');d.id='pauseMask';d.className='pausemask';
  d.innerHTML='<div class="inner"><div style="font-size:44px">\u23F8</div><div class="big">PAUSED \u2014 manual</div><div class="sub">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</div><div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnResume">\u25B6 Resume</button></div></div>';
  document.body.appendChild(d);
  $('btnResume').addEventListener('click',togglePause);
 }
}
$('btnPause').addEventListener('click',togglePause);
$('btnHint').addEventListener('click',function(){
 if(S.view!=='exam'||S.phase!=='idle'||!TX)return;
 if(S.hintUsed[TX.id])return;
 S.hintUsed[TX.id]=true;
 $('hintArea').innerHTML='<div class="hint-panel"><span class="h-ico">\u{1F4A1} Hint (\u221210% of this exercise\u2019s credit):</span>'+TX.hint+'</div>';
 $('btnHint').disabled=true;});
$('btnSkip').addEventListener('click',function(){if(S.view==='exam'&&S.phase==='idle')doSkip();});
/* ---------------- intro ---------------- */
function renderIntro(){
 $('hSev').textContent=SEVWORD[SEV];
 $('hSev').className='badge '+SEVCLASS[SEV];
 $('introView').innerHTML=DATA.introHtml;
 $('btnStart').addEventListener('click',function(){startExam(false);});
 renderHeader();
}
renderIntro();
})();

</script>
</body>
</html>
