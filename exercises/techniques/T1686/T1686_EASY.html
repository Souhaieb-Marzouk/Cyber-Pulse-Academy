.fact .fl{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.fact .fv{font-weight:800;font-size:16.5px;margin-top:2px}
.sec-title{font-size:19px;font-weight:800;margin:26px 0 0;padding-left:12px;border-left:4px solid var(--accent-blue)}
.kw-theme{
  border:1px solid var(--border-soft);border-radius:8px;
  background:var(--bg-surface-2);padding:12px 14px;margin-top:12px;
}
.kw-theme .kt{font-weight:800;font-size:14px;color:var(--accent-amber);letter-spacing:.03em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--tint-blue-08);border:1px solid var(--border);
  color:var(--text-primary);border-radius:999px;padding:4px 13px;font-size:13.5px;
}
.rules{margin:10px 0 0;padding-left:22px}
.rules li{margin:7px 0}
.rules .ico{font-weight:800}
/* ---------- pause overlay ---------- */
.pausemask{
  position:fixed;inset:0;background:var(--pausemask-bg);z-index:90;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
}
.pausemask .inner{max-width:520px}
.pausemask .big{font-size:22px;font-weight:800;color:var(--state-paused);margin:12px 0 8px}
.pausemask .sub{color:var(--text-secondary)}
/* ---------- review skipped ---------- */
.sk-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sk-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:12px 14px;
}
.sk-row .sk-ico{color:var(--state-skipped);font-weight:800}
.sk-row .sk-t{flex:1;min-width:200px}
.sk-row .sk-t .n{font-weight:700}
.sk-row .sk-t .d{font-size:13.5px;color:var(--text-secondary)}
/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 30px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono-font);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px}
.res-cell .rc-ico{font-size:20px;font-weight:800}
.res-cell.ok .rc-ico{color:var(--state-correct)}
.res-cell.part .rc-ico{color:var(--state-partial)}
.res-cell.bad .rc-ico{color:var(--state-incorrect)}
.res-cell.skip .rc-ico{color:var(--state-skipped)}
.res-cell .rc-n{font-size:26px;font-weight:800;font-family:var(--mono-font)}
.res-cell .rc-l{font-size:13.5px;color:var(--text-secondary)}
.cert{
  margin-top:18px;border:2px solid var(--state-correct);border-radius:10px;
  background:var(--tint-green-07);padding:20px 22px;text-align:center;
}
.cert.fail{border-color:var(--state-incorrect);background:var(--tint-red-06)}
.cert .c-big{font-size:30px;font-weight:800;color:var(--state-correct)}
.cert.fail .c-big{color:var(--state-incorrect)}
.cert .c-sub{color:var(--text-secondary);margin-top:6px}
.time-report{margin-top:14px;font-size:14px;color:var(--text-secondary)}
.time-report b{color:var(--text-primary)}
.hidden{display:none!important}
.footer-note{margin-top:26px;text-align:center;font-size:12.5px;color:var(--text-secondary)}
@media (max-width:760px){
  .wrap{padding:10px 12px 50px}
  .intro-title{font-size:21px}
  .res-pct{font-size:40px}
  .card{padding:13px 14px}
}

<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1686","batch":1,"title":"T1686 Disable or Modify System Firewall — EASY","difficulty":"easy","questionCount":16,"estimatedMinutes":25,"passMark":70,"sev":"easy","timerSeconds":1500},"introHtml":"\n<div class=\"intro-head\">\n  <h1 class=\"intro-title\">T1686 — EASY practice exam<\/h1>\n  <p class=\"intro-sub\">MITRE ATT&amp;CK object: <b>T1686 — Disable or Modify System Firewall<\/b> (Technique) &middot; Tactic: Defense Impairment (TA0112)<\/p>\n  <div class=\"facts\">\n    <div class=\"fact\"><div class=\"fl\">Severity<\/div><div class=\"fv\"><span class=\"badge sev-easy\">EASY<\/span><\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Exercises in this file<\/div><div class=\"fv\">16<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Estimated time<\/div><div class=\"fv\">25 minutes<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Timer budget<\/div><div class=\"fv\">25:00 countdown<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Pass mark<\/div><div class=\"fv\">70%<\/div><\/div>\n  <\/div>\n<\/div>\n\n<h2 class=\"sec-title\">What you will learn here<\/h2>\n<div class=\"card\">\n  <p class=\"body\">Imagine you are a new SOC analyst. An attacker is already inside a company computer. The firewall is the guard that says which network traffic may pass and which traffic must stop. In this exam you will learn how an attacker <b>turns a firewall off or changes its rules<\/b> so their own traffic can pass. That behaviour has a name in MITRE ATT&amp;CK: <b>T1686 — Disable or Modify System Firewall<\/b>.<\/p>\n  <p class=\"body\">This ATT&amp;CK object is a <b>Technique<\/b>. A technique describes <i>how<\/i> an attacker reaches a goal. The goal here comes from the tactic called <b>Defense Impairment (TA0112)<\/b>: weakening the protections that defenders put in place. T1686 has three sub-techniques, one for each place a firewall lives: <b>T1686.001 Cloud Firewall<\/b> (security groups in cloud platforms), <b>T1686.002 Network Device Firewall<\/b> (routers and perimeter devices), and <b>T1686.003 Windows Host Firewall<\/b> (the firewall inside Windows).<\/p>\n  <p class=\"body\">You will see where this technique is used in real work. A <b>SOC analyst<\/b> meets it when triage alerts show netsh or firewall changes. A <b>threat hunter<\/b> searches for it in logs. An <b>incident responder<\/b> reverses its changes during an incident. A <b>CTI analyst<\/b> writes reports that name the groups using it, like Lazarus Group or Salt Typhoon. A <b>detection engineer<\/b> builds alert rules from the detection strategies DET0145, DET0901, DET0306 and DET0424. A <b>GRC or control owner<\/b> checks that the mitigations (M1018, M1047, M1022, M1024) really work. The risk it addresses is simple: if the firewall falls, the attacker can talk to their own servers, reach remote services like RDP, and move through the network.<\/p>\n<\/div>\n\n<h2 class=\"sec-title\">Keywords covered in this exam<\/h2>\n<div class=\"card\">\n  <div class=\"kw-theme\"><div class=\"kt\">Technique identity and purpose<\/div><div class=\"chips\"><span class=\"chip\">T1686 Disable or Modify System Firewall<\/span><span class=\"chip\">disable firewall profiles<\/span><span class=\"chip\">add or change firewall rules<\/span><span class=\"chip\">open blocked ports<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Tactics and lifecycle<\/div><div class=\"chips\"><span class=\"chip\">Defense Impairment tactic TA0112<\/span><span class=\"chip\">attacker goal: unblock traffic<\/span><span class=\"chip\">needs administrator rights<\/span><span class=\"chip\">happens after first foothold<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Sub-techniques and platforms<\/div><div class=\"chips\"><span class=\"chip\">T1686.001 Cloud Firewall<\/span><span class=\"chip\">T1686.002 Network Device Firewall<\/span><span class=\"chip\">T1686.003 Windows Host Firewall<\/span><span class=\"chip\">Windows, Linux, macOS, ESXi, network devices, IaaS<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Commands and artefacts<\/div><div class=\"chips\"><span class=\"chip\">netsh advfirewall set allprofiles state off<\/span><span class=\"chip\">firewall add rule (inbound allow)<\/span><span class=\"chip\">iptables on Linux<\/span><span class=\"chip\">esxcli on ESXi<\/span><span class=\"chip\">socketfilterfw on macOS<\/span><span class=\"chip\">registry EnableFirewall = 0<\/span><span class=\"chip\">cloud security group ingress rule<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Defences and response<\/div><div class=\"chips\"><span class=\"chip\">M1018 User Account Management<\/span><span class=\"chip\">M1047 Audit<\/span><span class=\"chip\">M1024 Restrict Registry Permissions<\/span><span class=\"chip\">benign change vs tampering<\/span><span class=\"chip\">read-only checks first<\/span><\/div><\/div>\n<\/div>\n\n<h2 class=\"sec-title\">How this exam works<\/h2>\n<div class=\"card\">\n  <ul class=\"rules\">\n    <li><span class=\"ico\">&#10003; Pass mark:<\/span> you need <b>70%<\/b> to pass. A PASS means you can recognise and explain this technique at a basic level. A FAIL means you should re-read the notes above and try again — every retake reshuffles the questions.<\/li>\n    <li><span class=\"ico\">&#9881; Exercise types in this file:<\/span> multiple-choice questions, a SOC alert-queue triage, matching pairs, drag-and-drop sorting, timeline ordering, fill-in-the-blank notes, a spot-the-mistake registry panel, one multi-select with partial credit, and one interactive terminal command.<\/li>\n    <li><span class=\"ico\">&#9201; Timer:<\/span> a 25:00 countdown runs while the timer state shows <b>&#9654; RUNNING<\/b>. The <b>Pause<\/b> button is a manual break: the timer stops and the exercise is hidden until you press Resume. When you press <b>Check<\/b>, the timer <b>stops automatically<\/b> (state &#9208; PAUSED — reviewing feedback) so you can read the feedback as long as you want. It starts again only when you press <b>Next<\/b>.<\/li>\n    <li><span class=\"ico\">&#10100; Partial credit:<\/span> exercises with several correct items give part of the point for each correct item, and wrong items subtract. The formula is max(0, (correct − wrong) / total). Selecting everything is worth 0, not full marks.<\/li>\n    <li><span class=\"ico\">&#128161; Hints:<\/span> one hint per exercise, and it costs 10% of that exercise's credit.<\/li>\n    <li><span class=\"ico\">&#9888; Skip:<\/span> the Skip button moves an exercise to a review pool without showing the answer and without stopping the timer. At the end you get a review screen where you can answer skipped exercises as long as the timer runs. Skipped-and-never-answered exercises are excluded from the score — they count as neither correct nor wrong.<\/li>\n  <\/ul>\n  <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-primary btn-big\" id=\"btnStart\">&#9654; Start the exam<\/button><\/div>\n<\/div>\n","exercises":[{"id":"E01","type":"qcm","title":"What T1686 describes","summary":"SOC induction — reading an ATT&CK technique card","scenario":["It is your first week as a SOC analyst. Your team lead asks you to read the technique card for <b>T1686 — Disable or Modify System Firewall<\/b> before your first shift.","The card says: <i>Adversaries may disable or modify host-based or network firewalls to impair defensive mechanisms and enable further action.<\/i>"],"question":"In one sentence: what does an adversary <b>do<\/b> when using T1686?","hint":"The technique name is the biggest clue. What happens to the system firewall?","options":[{"id":"A","text":"The adversary turns a firewall off or changes its rules so traffic is no longer restricted.","why":"Correct. T1686 is exactly this: disabling the firewall or modifying its rules and profiles."},{"id":"B","text":"The adversary steals password hashes from the system memory.","why":"That is credential dumping, a different ATT&CK technique. No firewall is touched."},{"id":"C","text":"The adversary sends phishing emails to company employees.","why":"That is phishing, an Initial Access technique. It does not change a firewall."},{"id":"D","text":"The adversary deletes backup files so data cannot be recovered.","why":"That is data destruction, an Impact technique. T1686 does not delete files."}],"correct":["A"],"explanation":"T1686 covers two actions: turning a firewall off, or changing its rules so that traffic which was blocked can now pass. The attacker does this to make their next steps easier, for example command-and-control traffic or remote access. Passwords, phishing emails and backups are covered by other techniques, so B, C and D are wrong.","study":"Re-read the intro section: T1686 is about firewall settings only — never about passwords, phishing or backups."},{"id":"E02","type":"qcm","title":"Which tactic T1686 sits in","summary":"Navigating the ATT&CK matrix columns","scenario":["In ATT&amp;CK, a <b>tactic<\/b> is the attacker's goal, shown as a column of the matrix. A technique is one way to reach that goal.","The T1686 card shows: <b>Tactic: Defense Impairment (TA0112)<\/b>."],"question":"Which tactic does T1686 belong to, and what is the goal of that tactic?","hint":"The tactic name starts with a word that means protecting something. The attacker is weakening that protection.","options":[{"id":"A","text":"Initial Access — getting the first foothold inside the network.","why":"Initial Access is the entry tactic. T1686 needs an inside machine first, so it comes later."},{"id":"B","text":"Defense Impairment — weakening protections so other actions work better.","why":"Correct. The firewall is a protection, and weakening protections is the Defense Impairment goal."},{"id":"C","text":"Collection — gathering data such as files and keystrokes.","why":"Collection is about gathering data, not about switching protections off."},{"id":"D","text":"Lateral Movement — moving from one system to another.","why":"Lateral Movement often becomes easier AFTER the firewall is weakened, but it is not the tactic of T1686."}],"correct":["B"],"explanation":"T1686 lives in the Defense Impairment tactic (TA0112). The attacker's goal there is to weaken protections — the firewall in this case — so that other actions, like command-and-control or lateral movement, stop being blocked. The technique describes the how; the tactic describes the why.","study":"Learn the difference: tactic = the goal (Defense Impairment), technique = the action (disabling or modifying the firewall)."},{"id":"E03","type":"match","title":"The three sub-techniques","summary":"Match each sub-technique to the place its firewall lives","scenario":["T1686 has three sub-techniques. Each one targets the firewall that runs in a different place. Your team lead pins the card excerpt below to the ticket."],"artefacts":[{"label":"ATT&CK excerpt — T1686 sub-techniques","kind":"code","lines":["T1686.001  Cloud Firewall          - firewall inside a cloud platform","T1686.002  Network Device Firewall - firewall on routers and perimeter devices","T1686.003  Windows Host Firewall   - the firewall inside the Windows OS"]}],"question":"Match each sub-technique to the system its firewall protects.","hint":"Each sub-technique name already tells you the place: cloud, network device, or Windows host.","items":[{"id":"i1","label":"T1686.001 Cloud Firewall","why":"The cloud platform holds the firewall rules as security groups, controlled from the cloud console."},{"id":"i2","label":"T1686.002 Network Device Firewall","why":"Routers and perimeter devices enforce rules with ACLs and firewall policies."},{"id":"i3","label":"T1686.003 Windows Host Firewall","why":"Windows Defender Firewall runs inside the Windows operating system itself."}],"slots":[{"id":"s1","label":"Firewall in a cloud platform (security groups)"},{"id":"s2","label":"Router or perimeter network device"},{"id":"s3","label":"Windows Defender Firewall on a PC or server"}],"correct":{"i1":"s1","i2":"s2","i3":"s3"},"explanation":"T1686.001 is about cloud security groups and firewall rules. T1686.002 is about routers, switches and perimeter devices with their ACLs. T1686.003 is the firewall built into Windows. Keeping these three places separate helps you know which console, which logs and which team own each firewall."},{"id":"E04","type":"fill","title":"Read the netsh command","summary":"A Windows process log shows one netsh command","scenario":["An EDR process log on server WEB-01 recorded one command. You must describe it in the ticket."],"artefacts":[{"label":"ARTEFACT 1 — EDR process event, WEB-01","kind":"log","lines":["2026-05-11 03:12:04 UTC  process-create  parent: cmd.exe   cmd: netsh advfirewall set allprofiles state off   user: svc_reports"]}],"question":"Complete the ticket sentence with the two missing words.","hint":"Look at the last two words of the command in the log: state off.","template":"The netsh command turns the Windows firewall <b>{{1}}<\/b>, and it does this for <b>{{2}}<\/b> firewall profiles (Domain, Private and Public together).","blanks":[{"id":"1","correct":"off","distractors":["on","back up"],"why":"The words state off mean the firewall state is switched off."},{"id":"2","correct":"all","distractors":["one","no"],"why":"allprofiles means every profile at once: Domain, Private and Public."}],"explanation":"The command netsh advfirewall set allprofiles state off switches the firewall off for every profile at the same time. This is a classic T1686.003 action on a Windows host. If you see it outside a planned change window, it is a strong tampering signal.","study":"Practise reading netsh word by word: set = change something, allprofiles = every profile, state off = turn it off."},{"id":"E05","type":"qcm","title":"What the new rule allows","summary":"A firewall rule was added on a compromised host","scenario":["Threat-intel work: during an incident, the team found this command in the attacker's activity on host APP-07."],"artefacts":[{"label":"ARTEFACT 1 — command found on APP-07","kind":"log","lines":["netsh advfirewall firewall add rule name=\"SGAccessInboundRule\" dir=in protocol=udp action=allow localport=49683"],"filter":true}],"question":"What did this command enable on APP-07?","hint":"Read the command pieces one by one: dir=in, action=allow, protocol=udp, localport=49683.","options":[{"id":"A","text":"Incoming UDP traffic on port 49683 is now allowed.","why":"Correct. dir=in is inbound, action=allow permits it, udp is the protocol, and localport=49683 is the port."},{"id":"B","text":"All outgoing UDP traffic is now blocked.","why":"The rule allows one inbound port. It blocks nothing and says nothing about outbound traffic."},{"id":"C","text":"The remote desktop service now listens on port 49683.","why":"No service is started here. Only a firewall rule was added; RDP is not mentioned."},{"id":"D","text":"The firewall service was stopped completely.","why":"The firewall stays on. Adding a rule changes the rule set, not the service state."}],"correct":["A"],"explanation":"This command adds a new inbound allow rule for UDP port 49683. Adding rules instead of switching the firewall off is a quieter T1686 variant: the firewall looks normal, but one door is now open. Attackers use this to receive traffic on a port of their choice, for example for a backdoor.","study":"Learn the meaning of dir=in or dir=out, action=allow or action=block, and localport — then any netsh firewall rule becomes readable."},{"id":"E06","type":"dragdrop","title":"Tools and their platforms","summary":"Sort four firewall tools to the right operating system","scenario":["You are preparing a threat-hunt cheat sheet. Each tool below changes or reads firewall settings, but each one exists on only one platform."],"question":"Drag each tool onto the platform where it is used.","hint":"Each tool name matches its platform. iptables starts with IP like Linux networking; esxcli is the ESXi shell tool.","items":[{"id":"i1","label":"netsh advfirewall","why":"netsh advfirewall is the Windows command-line firewall tool."},{"id":"i2","label":"iptables","why":"iptables is the classic Linux packet-filter tool."},{"id":"i3","label":"esxcli network firewall","why":"esxcli is the ESXi hypervisor command line."},{"id":"i4","label":"socketfilterfw","why":"socketfilterfw (the application firewall tool) is macOS."}],"slots":[{"id":"s1","label":"Windows hosts"},{"id":"s2","label":"Linux hosts"},{"id":"s3","label":"ESXi hosts"},{"id":"s4","label":"macOS hosts"}],"correct":{"i1":"s1","i2":"s2","i3":"s3","i4":"s4"},"explanation":"Every platform has its own firewall tool: netsh advfirewall on Windows, iptables on Linux, esxcli network firewall on ESXi, and socketfilterfw on macOS. Threat hunters search for these exact tool names per platform, and the ATT&CK detection strategy DET0145 lists them all.","study":"Memorise the four tool-platform pairs — they appear in almost every firewall-tampering alert and hunt query."},{"id":"E07","type":"qcm","title":"Why the attacker touches the firewall","summary":"Think like the attacker for one minute","scenario":["An attacker already has administrator rights on an internal server.","Their command-and-control channel out to their own server is blocked by the firewall, and remote desktop to a second server is blocked too. The attacker decides to use T1686."],"question":"Why does the attacker disable or modify the firewall here?","hint":"Think about what the firewall is blocking right now: connections the attacker wants to make.","options":[{"id":"A","text":"To remove the traffic blocks so their command channel and remote access start working.","why":"Correct. With the firewall weakened, their C2 and RDP connections are no longer stopped."},{"id":"B","text":"To make their ransomware encrypt files faster.","why":"Encryption speed has nothing to do with the firewall. T1686 changes network filtering."},{"id":"C","text":"To read user passwords out of the network traffic.","why":"Reading passwords is credential access. The firewall change alone does not reveal passwords."},{"id":"D","text":"To delete the security logs of the server.","why":"Log clearing is a different Defence technique. T1686 changes firewall state and rules."}],"correct":["A"],"explanation":"From the attacker's point of view, the firewall is a locked door between them and their own infrastructure. Disabling it or adding allow rules opens that door: the command-and-control channel flows, remote services like RDP become reachable, and lateral movement gets easier. This is why T1686 so often appears right before an attacker's next big step.","study":"For every technique, ask: what does the attacker gain in the next five minutes? For T1686 it is unblocked traffic.","perspective":{"attacker":"I have admin rights, but my C2 beacon and RDP keep failing. One netsh line turns the guard off, and my traffic flows. It is fast, it needs no extra tools, and it works on every Windows box I touch.","defender":"A firewall state change right before new outbound or inbound connections is a high-value signal. I correlate the change with the network connections that follow it, which is exactly what detection strategy DET0901 does."}},{"id":"E08","type":"fill","title":"Complete the SOC note","summary":"Fill the incident note with the right keywords","scenario":["You must write the first SOC note for the WEB-01 event. The note below has three missing keywords. Choose them from the dropdowns."],"question":"Complete the SOC note with the three correct keywords.","hint":"One blank needs a technique ID that starts with T, another needs the firewall state word, the last one is the action you take on an unwanted change.","template":"SOC note: at 03:12 UTC a process ran netsh and the Windows firewall state changed to <b>{{1}}<\/b>. Later the host opened an inbound port. This matches technique <b>{{2}}<\/b> in the Defense Impairment tactic. We must identify who ran the command and <b>{{3}}<\/b> the firewall change.","blanks":[{"id":"1","correct":"Off","distractors":["On","Unchanged"],"why":"The event showed the firewall being switched off, so the state is Off."},{"id":"2","correct":"T1686","distractors":["T1059","TA0112"],"why":"T1686 is the firewall technique. T1059 is scripting, and TA0112 is the tactic, not a technique."},{"id":"3","correct":"reverse","distractors":["ignore","repeat"],"why":"Responders undo unwanted firewall changes so the protection works again."}],"explanation":"A good SOC note names the observed change (state Off), maps it to the technique (T1686), and states the response (reverse the change). TA0112 is the tactic name, so it does not belong in the technique slot. T1059 describes running scripts, which is a different behaviour.","study":"Write three SOC notes this week using the pattern: observed change, technique ID, response. It trains clean reporting."},{"id":"E09","type":"multi","title":"Who can change the Windows firewall","summary":"Select the TWO accounts that may modify Windows firewall settings","scenario":["A colleague asks: which accounts can normally change Windows firewall settings? Select the two correct answers."],"question":"Select the <b>TWO<\/b> kinds of accounts that can normally change Windows firewall settings.","hint":"Think about the mitigation M1018 — User Account Management: only people with real rights should be able to touch the firewall.","options":[{"id":"A","text":"A member of the local Administrators group","why":"Correct. Administrator-level rights are needed to change firewall profiles and rules."},{"id":"B","text":"A service or admin account with delegated firewall-management rights","why":"Correct. Delegated management rights also allow the change — this is why account reviews matter."},{"id":"C","text":"A standard user with no extra rights","why":"Standard users cannot change firewall profiles. If one does, it is a red flag."},{"id":"D","text":"A guest account with no settings access","why":"Guest accounts are the most restricted; they cannot manage the firewall."}],"correct":["A","B"],"explanation":"Changing firewall profiles and rules needs administrator-level rights: either full Administrators group membership or explicitly delegated management rights. That is why mitigation M1018 (User Account Management) and M1047 (Audit) focus on keeping and checking those rights. If a standard or guest account changes the firewall, treat it as tampering, because it should be impossible.","study":"Read the mitigation list on the T1686 page: M1018, M1047, M1022, M1024 — all of them limit who or what can change firewall settings."},{"id":"E10","type":"spot","title":"Find the turned-off firewall in the registry","summary":"A registry export from a suspicious host","scenario":["ZxShell-style malware flips a registry value to kill the Windows firewall. You have a registry export from host FS-02."],"question":"Click the <b>one line<\/b> that shows a firewall profile was switched off.","hint":"In the value EnableFirewall, 1 means on and 0 means off. Look for the zero.","code":{"label":"ARTEFACT 1 — registry export, FirewallPolicy keys","lines":["[HKLM\\SYSTEM\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\StandardProfile]","\"EnableFirewall\"=dword:00000001","\"DisableNotifications\"=dword:00000000","[HKLM\\SYSTEM\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\DomainProfile]","\"EnableFirewall\"=dword:00000000","\"DisableNotifications\"=dword:00000000"]},"correct":["5"],"lineWhy":{"2":"StandardProfile EnableFirewall = 1: this profile is ON, not the mistake.","5":"DomainProfile EnableFirewall = 0: this profile is switched OFF — the tampering sign.","3":"DisableNotifications = 0 means notifications are still active; harmless here.","6":"DisableNotifications = 0; harmless here."},"explanation":"The value EnableFirewall under a FirewallPolicy profile key is 1 when the firewall is on and 0 when it is off. Line 5 shows the Domain profile switched off — that is the tampering. The analytic AN0406 of detection strategy DET0145 watches exactly these registry changes under FirewallPolicy, because malware like ZxShell used this quiet path instead of running netsh.","study":"Remember the registry path HKLM\\SYSTEM\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy and the meaning of EnableFirewall 0 and 1."},{"id":"E11","type":"match","title":"Mitigations in plain words","summary":"Match each mitigation to what it actually does","scenario":["Your GRC colleague must present the T1686 mitigations to management — without jargon. Help by matching each mitigation ID to its plain-language meaning."],"question":"Match each mitigation to the plain-language description of what it does.","hint":"Each mitigation name tells you its target: accounts, audits, or the registry.","items":[{"id":"i1","label":"M1018 — User Account Management","why":"Fewer powerful accounts means fewer people who can switch a firewall off."},{"id":"i2","label":"M1047 — Audit","why":"Regular audits confirm that only expected roles may modify system firewalls."},{"id":"i3","label":"M1024 — Restrict Registry Permissions","why":"Registry permissions stop malware from flipping firewall values in the registry."}],"slots":[{"id":"s1","label":"Give users only the rights they need"},{"id":"s2","label":"Regularly check which roles may modify firewalls"},{"id":"s3","label":"Protect the keys that store firewall settings"}],"correct":{"i1":"s1","i2":"s2","i3":"s3"},"explanation":"M1018 keeps the number of privileged accounts small. M1047 audits role permissions so drift is caught. M1024 locks the registry keys where firewall state lives. Together they make both attack paths — an admin command and a silent registry edit — much harder. Note that T1686.002 (network devices) adds M1051 Update Software, because exposed firewalls must be patched.","study":"Connect each mitigation ID to one sentence you could say to a manager without reading notes."},{"id":"E12","type":"order","title":"The attacker's small timeline","summary":"Put four attacker steps in the right order","scenario":["Reconstruct the attacker's timeline for one T1686 incident, from the first requirement to the final connection."],"question":"Drag the four steps into the order the attacker performed them.","hint":"The attacker first needs power over the system, then silences the guard, then opens a door, then walks through it.","items":[{"id":"o1","label":"Get administrator rights on the server"},{"id":"o2","label":"Turn the firewall off with netsh"},{"id":"o3","label":"Add a firewall rule that opens a port"},{"id":"o4","label":"Connect back to their server through the opened path"}],"correct":["o1","o2","o3","o4"],"why":["Administrator rights come first: without them the firewall refuses every change (the T1686 page says attackers need sufficient privileges first).","With rights in hand, the attacker disables or weakens the firewall — the T1686 action itself.","Next they add or modify rules to open a specific path, for example one inbound port.","Only then can their traffic flow: command-and-control or remote access through the opened path."],"explanation":"The order matters for detection: privileges first, the firewall change second, rule changes third, traffic last. If your alerts only watch the traffic, you arrive at step 4 — too late. Watching steps 1 to 3 (account use, netsh and firewall events) catches the attacker before the connection happens.","study":"Practise placing firewall changes inside the attack timeline, not as an isolated event."},{"id":"E13","type":"qcm","title":"Which ID is a sub-technique of T1686?","summary":"Reading ATT&CK IDs correctly","scenario":["A ticket writes four IDs in a hurry. You must pick the one that is truly a sub-technique of T1686."],"question":"Which of these is a <b>sub-technique of T1686<\/b>?","hint":"Sub-technique IDs start with the parent ID followed by a dot and three digits.","options":[{"id":"A","text":"T1686.001 — Cloud Firewall","why":"Correct. The parent ID T1686 plus .001 makes it a sub-technique of T1686."},{"id":"B","text":"T1685 — Disable or Modify Tools","why":"T1685 is a separate technique next to T1686, not a child of it."},{"id":"C","text":"T1078 — Valid Accounts","why":"Valid Accounts is an unrelated technique attackers use to get the rights they need."},{"id":"D","text":"TA0112 — Defense Impairment","why":"TA0112 is a tactic, not a technique, and tactics are never sub-techniques."}],"correct":["A"],"explanation":"Sub-technique IDs reuse the parent number: T1686.001, T1686.002 and T1686.003 are the children of T1686. T1685 is a neighbouring technique in the same family (weakening tools instead of firewalls). TA0112 is the tactic column where these techniques live.","study":"Practise reading ATT&CK IDs: T = technique, TA = tactic, the dot-number means child of that technique."},{"id":"E14","type":"terminal","title":"Check the firewall state (read-only)","summary":"One safe command in the simulated Windows shell","scenario":["You are on Windows server WEB-01. Your lead asks: <i>tell me the current firewall state<\/i>. Use the built-in Windows tool <b>netsh<\/b> — the Windows network settings tool you can run in the shell below.","This command only <b>shows<\/b> the state. It changes nothing. Type the command in the simulated shell, press Enter to run it, then press Check."],"question":"Type the command that <b>shows<\/b> the on/off state of all firewall profiles.","hint":"The command shape is in the syntax panel: it starts with netsh advfirewall and the word show comes before allprofiles.","terminal":{"title":"WEB-01 — simulated cmd.exe (no real system is touched)","prompt":"C:\\Windows\\system32>","banner":["Microsoft Windows [Version 10.0.19045]","(c) Microsoft Corporation. Simulation for training only.","Type the command and press Enter."],"expected":"netsh advfirewall show allprofiles state","elements":["netsh","advfirewall","show","allprofiles","state"],"elWhy":{"netsh":"netsh is the Windows network configuration tool — the right tool here.","advfirewall":"advfirewall selects the advanced firewall context inside netsh.","show":"show reads settings; set would change them — the safe verb is show.","allprofiles":"allprofiles covers Domain, Private and Public in one call.","state":"state limits the output to the on/off status."},"dangerous":["set","off","disable","stop"],"dangerousMsg":"You typed a command that would CHANGE firewall state. In a real incident that destroys the very state you were asked to report. The safe command only shows the state.","outputLines":["Domain Profile Settings:","State                                 ON","","Private Profile Settings:","State                                 ON","","Public Profile Settings:","State                                 ON","","Ok."],"syntaxPanel":"Shape:  netsh advfirewall show &lt;target&gt; state<br>netsh = Windows network tool &middot; advfirewall = the firewall part &middot; show = display, read-only &middot; the target word is the group of profiles you want &middot; state = show only on/off.<br>Example on a different target: netsh advfirewall show domainprofile state &mdash; that one shows only the Domain profile; note how the target word changes but the shape stays.<br>Expected output shape: blocks named 'Domain Profile Settings:', 'Private Profile Settings:' and 'Public Profile Settings:', each with a 'State' line showing ON or OFF.","genericErr":"The simulated shell does not recognise that command. Check the shape in the syntax panel and try again."},"explanation":"netsh advfirewall show allprofiles state prints the on/off state of the Domain, Private and Public profiles. It is the first, safest check in any firewall-tampering ticket: you look before you touch. The verb matters — show reads, set changes. A command like set allprofiles state off would itself be T1686.003.","study":"Run the show, set and rule commands for netsh advfirewall in a lab so the shapes feel familiar before an incident."},{"id":"E15","type":"multi","title":"Which two artefacts show T1686?","summary":"Select the TWO firewall-tampering artefacts","scenario":["Four artefacts were collected from one host overnight. Two show T1686 behaviour, two do not."],"question":"Select the <b>TWO<\/b> artefacts that show T1686 behaviour.","hint":"T1686 is only about the firewall: its state, its services, or its rules.","options":[{"id":"A","text":"Firewall state changed to OFF by a script at 03:12","why":"Correct. Turning the firewall state off is the core T1686 action."},{"id":"B","text":"New inbound firewall rule allowed TCP 3389 for any source","why":"Correct. Adding an allow rule (here for RDP) modifies the firewall rule set — T1686 again."},{"id":"C","text":"Antivirus engine updated its definitions to version 2145","why":"An antivirus update is normal maintenance; the firewall is not involved."},{"id":"D","text":"A user changed their own account password successfully","why":"A password change is account management, not firewall tampering."}],"correct":["A","B"],"explanation":"T1686 covers the firewall state (switching it off) and the firewall rule set (adding, deleting or changing rules). Both A and B are exactly that. Definition updates and password changes are normal, unrelated events — selecting them subtracts credit, so only pick what the technique truly covers.","study":"When triaging, ask for each artefact: does it touch firewall state, firewall rules, or firewall services? If not, it is another technique."},{"id":"E16","type":"triage","title":"Firewall change or normal work?","summary":"Decide two firewall-change events in the morning queue","scenario":["You are on SOC morning duty. Two firewall-change events wait in the queue. For each one, choose what it looks like.","Runbook reminder: changes made by named IT admins during a planned change window are normal work. Changes by unusual accounts, outside windows, deserve investigation."],"question":"For each event, choose the correct decision.","hint":"Check WHO made the change and WHEN. The runbook line above tells you what counts as normal.","alerts":[{"id":"a1","time":"02:14","source":"Host FW-04","text":"netsh advfirewall set allprofiles state off run by account svc_reports — this account never ran firewall commands before, and no change window is open.","why":"An unusual account, at night, with no change window, turning every profile off: that is T1686.003 tampering — investigate."},{"id":"a2","time":"10:05","source":"Host HR-PC-12","text":"Public profile switched ON by account j.moreau (IT admin) during planned change window CHG-2211 which covers firewall hardening.","why":"A known IT admin, inside a documented change window, making the firewall stronger: normal planned work — close."}],"actions":[{"id":"investigate","label":"Investigate — possible T1686"},{"id":"close","label":"Normal — planned admin work"}],"correct":{"a1":"investigate","a2":"close"},"explanation":"The same netsh capability is used by admins and attackers — the difference is context. Event a1 has the tampering pattern: unknown account, night time, no change window, all profiles off. Event a2 has the benign pattern: named admin, documented window, and the change strengthens the firewall. Judging context, not just the command, is the core SOC skill this technique trains.","study":"Build a habit: for every firewall change, look up the account, the time, and the change ticket before you judge."}]};</script>
<script>

(function(){
'use strict';
var DATA=window.__EXAM_DATA__;
var META=DATA.meta, EXS=DATA.exercises;
var SEV=META.sev, SEVCLASS={easy:'sev-easy',medium:'sev-medium',hard:'sev-hard','extremely-hard':'sev-extreme'};
var SEVWORD={easy:'EASY',medium:'MEDIUM',hard:'HARD','extremely-hard':'EXTREMELY HARD'};
var SEVCOL={easy:'var(--sev-easy)',medium:'var(--sev-medium)',hard:'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'};
var TYPE_LABEL={qcm:'Multiple-choice question',multi:'Multi-select with partial credit',triage:'SOC alert-queue triage simulation',branch:'Branching incident-response decision',dragdrop:'Drag-and-drop sorting',order:'Timeline ordering',match:'Matching pairs',fill:'Fill-in-the-blank / report drafting',terminal:'Interactive terminal command',spot:'Spot the mistake'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clock(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
/* ---------------- state ---------------- */
var S={view:'intro',order:[],cur:0,phase:'idle',status:{},answers:{},credits:{},hintUsed:{},
 timer:{state:'ENDED',remaining:0,manualSec:0,autoSec:0,stamp:0},
 sum:0,answered:0,reviewMode:false,reported:false,perExLeft:0,
 user:{name:'',country:'',locale:''},pausePrev:null};
var TX=null; /* current exercise */
var tick=null;
var REDUCED=false;
try{REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){REDUCED=false;}
/* ---------------- timer state machine ---------------- */
function flushPause(){
 if(S.timer.stamp){var d=Math.round((Date.now()-S.timer.stamp)/1000);
  if(S.timer.state==='PAUSED_MANUAL')S.timer.manualSec+=d;
  else if(S.timer.state==='PAUSED_AUTO_CHECK')S.timer.autoSec+=d;
  S.timer.stamp=0;}
}
function tSet(next){
 var cur=S.timer.state;
 if(cur===next)return;
 if(cur==='RUNNING'){}else{flushPause();}
 S.timer.state=next;S.timer.stamp=0;
 if(next!=='RUNNING'&&next!=='ENDED')S.timer.stamp=Date.now();
 renderHeader();
}
function startTicker(){
 if(tick)return;
 tick=setInterval(function(){
  if(S.view==='results'||S.timer.state==='ENDED')return;
  if(S.timer.state==='RUNNING'){
   S.timer.remaining-=1;
   if(TX&&TX.perEx&&S.phase==='idle'&&S.view==='exam'){S.perExLeft=Math.max(0,S.perExLeft-1);renderPerEx();
    if(S.perExLeft===0){doCheck();return;}}
   if(S.timer.remaining<=0){S.timer.remaining=0;renderHeader();finishExam('timeout');return;}
   renderHeader();
  }
 },1000);
}
function startExam(retake){
 if(!retake){S.order=[];}
 S.order=shuffle(EXS.map(function(e,i){return i;}));
 /* keep terminal exercises non-adjacent */
 for(var i=1;i<S.order.length-1;i++){
  if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])||isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
 }
 S.cur=0;S.status={};S.answers={};S.credits={};S.hintUsed={};S.sum=0;S.answered=0;
 S.timer.remaining=META.timerSeconds;S.timer.manualSec=0;S.timer.autoSec=0;S.reported=false;
 S.phase='idle';S.reviewMode=false;S.perExLeft=0;
 tSet('RUNNING');
 S.view='exam';
 $('introView').classList.add('hidden');$('resultsView').classList.add('hidden');$('reviewView').classList.add('hidden');
 $('examView').classList.remove('hidden');$('progressWrap').classList.remove('hidden');
 renderCurrent();
 startTicker();
}
function isTerm(oi){return EXS[oi].type==='terminal';}
function resolvedCount(){var n=0;for(var k in S.status){if(S.status[k])n++;}return n;}
function updateProgress(){
 var tot=EXS.length,done=resolvedCount();
 var p=tot?Math.round(done/tot*100):0;
 var b=$('pbar');b.style.width=p+'%';b.style.background='linear-gradient(90deg,'+SEVCOL[SEV]+',var(--accent-blue))';
}
/* ---------------- header ---------------- */
function renderHeader(){
 $('hEx').textContent=(S.view==='exam')?('Exercise '+(S.cur+1)+' of '+EXS.length):(EXS.length+' exercises');
 var ts=$('hTstate'),st=S.timer.state;
 if(st==='RUNNING'){ts.className='tstate run';ts.textContent='\u25B6 RUNNING';}
 else if(st==='PAUSED_MANUAL'){ts.className='tstate pm';ts.textContent='\u23F8 PAUSED \u2014 manual (press Resume)';}
 else if(st==='PAUSED_AUTO_CHECK'){ts.className='tstate pa';ts.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)';}
 else{ts.className='tstate end';ts.textContent='\u25A0 ENDED';}
 $('hTimer').textContent=clock(Math.max(0,S.timer.remaining));
 var c=S.sum.toFixed(1),pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 $('hScore').innerHTML='<b>'+esc(c)+'</b> / '+S.answered+' \u00B7 '+pct+'%';
 $('btnPause').innerHTML=(st==='PAUSED_MANUAL')?'\u25B6 Resume':'\u23F8 Pause';
 $('hUser').textContent=S.user.name?('Analyst: '+S.user.name+(S.user.country&&S.user.country!=='ZZ'?' \u00B7 '+S.user.country:'')):'';
 updateProgress();
}
function renderPerEx(){
 var el=$('perExChip');if(!el)return;
 el.textContent='\u23F1 Exercise timer: '+clock(S.perExLeft)+' remaining (stops when the main timer pauses)';
 el.classList.toggle('hidden',!(TX&&TX.perEx&&S.phase==='idle'));
}
/* ---------------- rendering helpers ---------------- */
var LOGRX=/(20\d\d-\d\d-\d\d[T ]\d\d:\d\d:\d\d(?:Z)?)|(\b\d{1,3}(?:\[\.\]){3}\d{1,3}(?:\/\d{1,2})?\b)|("(?:[^"\\]|\\.)*")|(\b(?:allow|allowed|deny|denied|drop|dropped|reject|blocked|block|disabled|disable|enabled|enable|deleted|delete|flush|flushed|permit|failed|success|modified|created|error|critical|warning|state|profiles?|rules?)\b)|(\b\d{2,6}\b)/gi;
function hlLog(line){
 var e=esc(line);
 e=e.replace(LOGRX,function(m,ts,ip,str,kw,num){
  if(ts)return '<span class="ts">'+ts+'</span>';
  if(ip)return '<span class="ip">'+ip+'</span>';
  if(str)return '<span class="str">'+str+'</span>';
  if(kw)return '<span class="kw">'+kw+'</span>';
  if(num)return '<span class="num">'+num+'</span>';
  return m;});
 return e;
}
function hlCode(line){
 var e=esc(line);
 if(/^\s*(#|REM\b|\/\/)/i.test(e))return '<span class="cm">'+e+'</span>';
 /* single pass: command word at start/after space, and key=value args; never re-processes its own markup */
 return e.replace(/(^|\s)([A-Za-z][\w.\-\/]*)|(\S+=\S+)/g,function(m,pre,cmd,arg){
  if(cmd)return pre+'<span class="cmd">'+cmd+'</span>';
  if(arg)return '<span class="arg">'+arg+'</span>';
  return m;
 });
}
function artefactHtml(a,idx){
 var h='<div class="art"><div class="art-h"><span class="art-lbl">ARTEFACT '+(idx+1)+' \u2014 '+esc(a.label)+'</span>';
 if(a.kind==='log'&&a.filter)h+='<input type="text" class="flt" placeholder="Filter lines (e.g. netsh, 3389)" aria-label="Filter log lines" data-art="'+idx+'">';
 h+='</div>';
 if(a.kind==='log'){
  h+='<div class="log mono" id="art'+idx+'">';
  a.lines.forEach(function(l){h+='<span class="ln">'+hlLog(l)+'</span>';});
  h+='</div>';
 }else if(a.kind==='code'){
  h+='<pre class="code mono">';
  a.lines.forEach(function(l){h+=hlCode(l)+'\n';});
  h+='</pre>';
 }else{
  h+='<div class="blk-b" style="padding:12px 14px;font-size:15px">'+a.body+'</div>';
 }
 return h+'</div>';
}
function scenHtml(ex){
 var h='<section class="card blk blk-scenario" id="blkScen">';
 h+='<div class="blk-h"><span class="ic">\u{1F5C2}\uFE0F</span> SCENARIO<button type="button" class="collapse-btn" id="colBtn">\u25BE Collapse</button></div>';
 if(ex.summary)h+='<div class="sc-summary">'+esc(ex.summary)+'</div>';
 h+='<div class="blk-b">';
 (ex.scenario||[]).forEach(function(p){h+='<p class="body">'+p+'</p>';});
 (ex.artefacts||[]).forEach(function(a,i){h+=artefactHtml(a,i);});
 h+='</div></section>';
 return h;
}
/* ---------------- widgets ---------------- */
var W={};
function optRows(ex,multi,sel){
 var opts=shuffle(ex.options);
 var h='<div class="opts" id="opts" role="'+(multi?'group':'radiogroup')+'" aria-label="Answer options">';
 opts.forEach(function(o,i){
  h+='<button type="button" class="opt'+(sel&&sel.indexOf(o.id)>=0?' sel':'')+'" data-oid="'+o.id+'"><span class="ol">'+String.fromCharCode(65+i)+'.</span><span>'+o.text+'</span></button>';
 });
 return h+'</div>';
}
W.qcm=function(ex,area){var sel=[];area.innerHTML=optRows(ex,false,sel);
 area.addEventListener('click',function(ev){var b=ev.target.closest('.opt');if(!b||S.phase!=='idle')return;
  sel=[b.getAttribute('data-oid')];
  var all=area.querySelectorAll('.opt');for(var i=0;i<all.length;i++)all[i].classList.toggle('sel',all[i]===b);});
 return {get:function(){return sel.slice();}};};
W.multi=function(ex,area){var sel=[];area.innerHTML='<p class="hintline">Select all that apply. Partial credit applies.</p>'+optRows(ex,true,sel);
 area.addEventListener('click',function(ev){var b=ev.target.closest('.opt');if(!b||S.phase!=='idle')return;
  var oid=b.getAttribute('data-oid'),ix=sel.indexOf(oid);
  if(ix>=0){sel.splice(ix,1);b.classList.remove('sel');}else{sel.push(oid);b.classList.add('sel');}});
 return {get:function(){return sel.slice();}};};
W.spot=function(ex,area){
 var sel=[];var a=ex.code;var h='<p class="hintline">Click the line (or lines) that contain the mistake. Click again to deselect. Keyboard: Tab to a line, press Enter or Space to toggle it.</p>';

function normCmd(c){return String(c||'').trim().replace(/\s+/g,' ').toLowerCase();}

function scoreExercise(H,W,N){return Math.max(0,(H-W)/N);}
function grade(ex,ans){
 var H=0,W=0,N=0,items=[];
 function add(label,st,why){items.push({label:label,st:st,why:why||''});}
 var t=ex.type;
 if(t==='qcm'||t==='multi'){
  var C=ex.correct,Nn=C.length;
  var sel=ans||[];var hit=0,bad=0;
  ex.options.forEach(function(o){
   var inC=C.indexOf(o.id)>=0,inS=sel.indexOf(o.id)>=0;
   if(inC&&inS){hit++;add(o.text,'ok',o.why||'');}
   else if(inC&&!inS){add(o.text,'miss',o.why||'');}
   else if(!inC&&inS){bad++;add(o.text,'bad',o.why||'This option does not belong in the correct answer.');}
  });
  H=hit;W=bad;N=Nn;
 }else if(t==='triage'){
  N=ex.alerts.length;
  ex.alerts.forEach(function(a){var c=ex.correct[a.id],g=ans[a.id];
   var albl=byId(ex.actions,c).label;
   if(g===c){H++;add(a.id+' \u2192 '+albl,'ok',a.why||'');}
   else if(g){W++;add(a.id+' \u2192 '+byId(ex.actions,g).label,'bad',a.why||'');}
   else{add(a.id+' \u2192 '+albl,'miss',a.why||'');}});
 }else if(t==='branch'){
  N=ex.steps.length;
  ex.steps.forEach(function(s,i){var g=ans[i];
   var cl=byId(s.options,s.correct).text;
   if(g===s.correct){H++;add('Step '+(i+1)+': '+cl,'ok',s.why||'');}
   else if(g){W++;add('Step '+(i+1)+': '+byId(s.options,g).text,'bad',s.why||'');}
   else{add('Step '+(i+1)+': '+cl,'miss',s.why||'');}});
 }else if(t==='dragdrop'||t==='match'){
  N=ex.items.length;
  ex.items.forEach(function(it){var c=ex.correct[it.id],g=ans[it.id];
   var cl=byId(ex.slots,c).label;
   if(g===c){H++;add(it.label+' \u2192 '+cl,'ok',it.why||'');}
   else if(g){W++;add(it.label+' \u2192 '+byId(ex.slots,g).label,'bad',it.why||'');}
   else{add(it.label+' \u2192 '+cl,'miss',it.why||'');}});
 }else if(t==='order'){
  N=ex.correct.length;
  ex.correct.forEach(function(cid,i){var g=ans[i];
   var cl=byId(ex.items,cid).label;
   if(g===cid){H++;add('Position '+(i+1)+': '+cl,'ok',(ex.why||[])[i]||'');}
   else if(g){W++;add('Position '+(i+1)+': '+byId(ex.items,g).label,'bad',(ex.why||[])[i]||'');}
   else{add('Position '+(i+1)+': '+cl,'miss',(ex.why||[])[i]||'');}});
 }else if(t==='fill'){
  N=ex.blanks.length;
  ex.blanks.forEach(function(b){var g=ans[b.id];
   if(g===b.correct){H++;add('Blank '+b.id+': '+b.correct,'ok',b.why||'');}
   else if(g){W++;add('Blank '+b.id+': '+g,'bad',b.why||'');}
   else{add('Blank '+b.id+': '+b.correct,'miss',b.why||'');}});
 }else if(t==='spot'){
  var C2=ex.correct;N=C2.length;
  var seen={};
  (ans||[]).forEach(function(lid){seen[lid]=true;});
  C2.forEach(function(lid){
   var lbl='Line '+lid;
   if(seen[lid]){H++;add(lbl,'ok',(ex.lineWhy||{})[lid]||'');}
   else{add(lbl,'miss',(ex.lineWhy||{})[lid]||'');}});
  Object.keys(seen).forEach(function(lid){if(C2.indexOf(lid)<0){W++;add('Line '+lid,'bad',(ex.lineWhy||{})[lid]||'This line is not the mistake.');}});
 }else if(t==='terminal'){
  var tt=ex.terminal,norm=normCmd(ans),exp=normCmd(tt.expected);
  N=tt.elements.length;
  var tokens=norm?norm.split(' '):[];
  var expectedSet={};
  tt.elements.forEach(function(e){expectedSet[e]=true;});
  tt.elements.forEach(function(e){
   var got=e.indexOf(' ')>=0?(norm.indexOf(e)>=0):(tokens.indexOf(e)>=0);
   if(e.indexOf('=')>=0)got=norm.indexOf(e)>=0;
   if(got){H++;add(e,'ok',(tt.elWhy||{})[e]||'');}
   else{add(e,'miss',(tt.elWhy||{})[e]||'');}});
  tokens.forEach(function(tok){
   if(!tok)return;
   if(tt.elements.indexOf(tok)>=0)return;
   var isArg=tok.indexOf('=')>=0;
   var isKnownExtra=tt.allowedExtra&&tt.allowedExtra.indexOf(tok)>=0;
   if(isArg&&!isKnownExtra){var keyOk=tt.elements.some(function(e){return e.indexOf('=')>=0&&e.split('=')[0]===tok.split('=')[0];});
    if(!keyOk){W++;add(tok,'bad','This option is not needed and points the command in the wrong direction.');}}
  });
  if(tokens[0]&&tt.elements[0]&&tokens[0]!==tt.elements[0].split(' ')[0]){W++;add(tokens[0],'bad','Wrong tool for this goal.');}
 }
 var credit=scoreExercise(H,W,N);
 if(S.hintUsed[ex.id])credit=Math.max(0,credit-0.10);
 var g={credit:credit,items:items,H:H,W:W,N:N};
 if(t==='terminal'){
  var tt2=ex.terminal,norm2=normCmd(ans);
  g.dangerous=tt2.dangerous&&norm2!==normCmd(tt2.expected)&&tt2.dangerous.some(function(d){return norm2.indexOf(d.toLowerCase())>=0;});
 }
 return g;
}

 else if(ex.type==='spot'){
  all=$('answerArea').querySelectorAll('.optline');
  for(i=0;i<all.length;i++){el=all[i];var lid=el.getAttribute('data-lid');
   if(ex.correct.indexOf(lid)>=0)el.style.outline='2px solid var(--state-correct)';
   else if(ans.indexOf(lid)>=0)el.style.outline='2px solid var(--state-incorrect)';}}
}
function doSkip(){
 if(S.phase!=='idle')return;
 S.status[TX.id]='skipped';
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function doNext(){
 if(S.phase!=='checked')return;
 tSet('RUNNING');
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function advance(){
 if(S.cur>=S.order.length-1){showReview();return;}
 S.cur++;renderCurrent();
}
/* ---------------- review skipped ---------------- */
function showReview(){
 var pending=[];
 S.order.forEach(function(oi,i){var ex=EXS[oi];if(S.status[ex.id]!=='answered'){pending.push({i:i,ex:ex});}});
 var unansweredSkipped=pending.filter(function(p){return S.status[p.ex.id]==='skipped';});
 if(S.timer.remaining<=0||S.timer.state==='ENDED'){finishExam(S.answered>0?'timeout':'timeout');return;}
 if(pending.length===0){finishExam('submit');return;}
 S.view='review';
 $('examView').classList.add('hidden');$('reviewView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:var(--state-skipped)"><span class="ic">\u26A0\uFE0F</span> REVIEW SKIPPED EXERCISES</div><div class="blk-b">';
 h+='<p class="body">You have '+pending.length+' exercise(s) without a final answer. You can go back to any of them while the timer is running, or submit now. Skipped exercises that are never answered are <b>excluded</b> from the score \u2014 they count as neither correct nor wrong.</p>';
 h+='<div class="sk-list">';
 pending.forEach(function(p){
  h+='<div class="sk-row"><span class="sk-ico">\u26A0 Skipped</span><span class="sk-t"><span class="n">'+esc(p.ex.title)+'</span><br><span class="d">'+esc(p.ex.summary||'')+'</span></span><button type="button" class="btn" data-res="'+p.i+'">\u2192 Resume this exercise</button></div>';});
 h+='</div><div class="btn-row"><button type="button" class="btn btn-primary btn-big" id="btnFinalSubmit">\u2713 Submit final results</button></div>';
 h+='</div></section>';
 $('reviewView').innerHTML=h;
 $('reviewView').querySelectorAll('[data-res]').forEach(function(b){
  b.addEventListener('click',function(){
   S.cur=parseInt(b.getAttribute('data-res'),10);S.reviewMode=true;S.view='exam';
   $('reviewView').classList.add('hidden');$('examView').classList.remove('hidden');
   renderCurrent();});});
 $('btnFinalSubmit').addEventListener('click',function(){finishExam('submit');});
 renderHeader();
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex,g){
 var cl,word,ico;
 if(g.credit>=1){cl='fb-correct';word='CORRECT';ico='\u2714';}
 else if(g.credit>0){cl='fb-partial';word='PARTIALLY CORRECT';ico='\u2714';}
 else{cl='fb-incorrect';word='INCORRECT';ico='\u2716';}
 var h='<section class="fb '+cl+'" id="fbBlock"><div class="fb-h"><span>'+ico+'</span> '+word;
 if(g.N>1)h+=' <span class="credit">\u2014 '+Math.round(g.H)+'/'+g.N+' items, credit '+g.credit.toFixed(2)+'</span>';
 h+='</div><div class="fb-b">';
 if(g.dangerous)h+='<div class="study" style="border-color:var(--state-incorrect);background:var(--tint-red-08)"><b style="color:var(--state-incorrect)">\u2717 DANGEROUS \u2014 NEAR MISS:</b> '+esc((ex.terminal&&ex.terminal.dangerousMsg)||'That command would have changed state or destroyed evidence.')+'</div>';
 if(ex.type==='terminal'){
  var t=ex.terminal;
  h+='<div class="canon"><div class="t">Canonical command (you can copy it):</div><pre class="code mono">'+hlCode(t.expected)+'</pre></div>';
  /* per-element breakdown from the graded items: what you got right, missed, or got wrong */
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span><b>'+esc(it.label)+'</b>'+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
  if(t.dangerNote)h+='<div class="study">'+t.dangerNote+'</div>';
 }else if(g.items.length){
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span>'+esc(it.label)+'<span class="why">'+esc(it.why)+'</span></span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
 }
 h+='<p class="body" style="margin-top:12px">'+ex.explanation+'</p>';
 if(ex.perspective){
  h+='<div class="persp">';
  if(ex.perspective.attacker)h+='<div class="red"><b>\u2694 Attacker view:</b> '+ex.perspective.attacker+'</div>';
  if(ex.perspective.defender)h+='<div class="blue"><b>\u{1F6E1} Defender view:</b> '+ex.perspective.defender+'</div>';
  h+='</div>';
 }
 if(g.credit<1&&ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></section>';
 $('fbArea').innerHTML=h;
 var fb=$('fbBlock');if(fb)fb.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
}
/* ---------------- results ---------------- */
function finishExam(reason){
 flushPause();tSet('ENDED');
 var byIdc={ok:0,part:0,bad:0},partSum=0,skippedList=[];
 EXS.forEach(function(ex){
  var st=S.status[ex.id];
  if(st==='answered'){var c=S.credits[ex.id]||0;
   if(c>=1)byIdc.ok++;else if(c>0){byIdc.part++;partSum+=c;}else byIdc.bad++;}
  else{skippedList.push(ex);}
 });
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var passed=pct>=70&&S.answered>0;
 S.view='results';
 $('examView').classList.add('hidden');$('reviewView').classList.add('hidden');$('resultsView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:'+SEVCOL[SEV]+'"><span class="ic">\u{1F4CA}</span> RESULTS \u2014 '+esc(META.title)+'</div><div class="blk-b">';
 h+='<div class="res-head"><div><div class="res-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div><div style="color:var(--text-secondary)">final score \u00B7 '+S.sum.toFixed(1)+' credits / '+S.answered+' answered</div></div></div>';
 h+='<div class="res-grid">';
 h+='<div class="res-cell ok"><div class="rc-ico">\u2714 Fully correct</div><div class="rc-n">'+byIdc.ok+'</div><div class="rc-l">exercises with credit 1.0</div></div>';
 h+='<div class="res-cell part"><div class="rc-ico">\u2714 Partially correct</div><div class="rc-n">'+byIdc.part+'</div><div class="rc-l">'+(byIdc.part?('avg credit '+(partSum/byIdc.part).toFixed(2)):'no partial answers')+'</div></div>';
 h+='<div class="res-cell bad"><div class="rc-ico">\u2716 Fully incorrect</div><div class="rc-n">'+byIdc.bad+'</div><div class="rc-l">credit 0.0</div></div>';
 h+='<div class="res-cell skip"><div class="rc-ico">\u26A0 Skipped \u2014 excluded</div><div class="rc-n">'+skippedList.length+'</div><div class="rc-l">not counted in numerator or denominator</div></div>';
 h+='</div>';
 if(skippedList.length){h+='<p class="body" style="margin-top:12px;color:var(--state-skipped)">\u26A0 Excluded (never answered): '+skippedList.map(function(e){return esc(e.title);}).join(' \u00B7 ')+'</p>';}
 h+='<div class="time-report">Time report \u2014 timer budget: <b>'+Math.round(META.timerSeconds/60)+' min</b> \u00B7 time left: <b>'+clock(S.timer.remaining)+'</b> \u00B7 paused manually: <b>'+clock(S.timer.manualSec)+'</b> \u00B7 paused for feedback review: <b>'+clock(S.timer.autoSec)+'</b> \u00B7 ended by: <b>'+(reason==='timeout'?'timer reached 00:00':'you pressed Submit')+'</b></div>';
 if(passed){
  h+='<div class="cert"><div class="c-big">\u2714 PASS \u2014 Certified: '+esc(META.title)+'</div><div class="c-sub">You reached '+pct+'%, above the 70% pass mark. Strong work: you can read, recognise and respond to this ATT&amp;CK object like a working analyst.</div></div>';
 }else{
  h+='<div class="cert fail"><div class="c-big">\u2716 FAIL \u2014 '+pct+'% (pass mark 70%)</div><div class="c-sub">Not this time. Re-read the intro notes, review the feedback from each exercise, and try again \u2014 every retake reshuffles questions and options.</div></div>';
 }
 h+='<div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnRetake">\u21BB Retake Exam</button></div>';
 h+='</div></section>';
 $('resultsView').innerHTML=h;
 var rb=$('btnRetake');
 if(rb)rb.addEventListener('click',function(){startExam(true);});
 reportScore(S.sum,S.answered,pct,passed);
 renderHeader();
}
function reportScore(creditSum,answeredCount,percent,passed){
 if(S.reported)return;S.reported=true;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
 var d=event.data;if(!d)return;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 S.user={name:d.username||'',country:d.country||'',locale:d.locale||''};
 /* theme field is always 'dark'; this file is dark-only by contract, nothing toggles */
 renderHeader();
});
/* ---------------- pause / hint ---------------- */
function togglePause(){
 if(S.view==='results')return;
 if(S.timer.state==='PAUSED_MANUAL'){
  tSet(S.pausePrev||'RUNNING');S.pausePrev=null;
  var m=$('pauseMask');if(m)m.remove();
 }else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.pausePrev=S.timer.state;tSet('PAUSED_MANUAL');
  var d=document.createElement('div');d.id='pauseMask';d.className='pausemask';
  d.innerHTML='<div class="inner"><div style="font-size:44px">\u23F8</div><div class="big">PAUSED \u2014 manual</div><div class="sub">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</div><div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnResume">\u25B6 Resume</button></div></div>';
  document.body.appendChild(d);
  $('btnResume').addEventListener('click',togglePause);
 }
}
$('btnPause').addEventListener('click',togglePause);
$('btnHint').addEventListener('click',function(){
 if(S.view!=='exam'||S.phase!=='idle'||!TX)return;
 if(S.hintUsed[TX.id])return;
 S.hintUsed[TX.id]=true;
 $('hintArea').innerHTML='<div class="hint-panel"><span class="h-ico">\u{1F4A1} Hint (\u221210% of this exercise\u2019s credit):</span>'+TX.hint+'</div>';
 $('btnHint').disabled=true;});
$('btnSkip').addEventListener('click',function(){if(S.view==='exam'&&S.phase==='idle')doSkip();});
/* ---------------- intro ---------------- */
function renderIntro(){
 $('hSev').textContent=SEVWORD[SEV];
 $('hSev').className='badge '+SEVCLASS[SEV];
 $('introView').innerHTML=DATA.introHtml;
 $('btnStart').addEventListener('click',function(){startExam(false);});
 renderHeader();
}
renderIntro();
})();

</script>
</body>
</html>
