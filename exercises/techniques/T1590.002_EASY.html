.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.002","name":"Gather Victim Network Information: DNS","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique. In MITRE ATT&CK, it describes one specific way to carry out the parent technique T1590, Gather Victim Network Information. Here the target of the gathering is the victim's DNS: the system that turns names like harbourline-freight[.]com into server addresses.","Imagine you work in the SOC of a shipping company. An attacker, sitting somewhere outside your network, quietly asks public DNS servers: 'Which servers handle this company's mail? Which name servers run its zones? What addresses do its subdomains point to?' Each answer is a small clue — mail vendors, cloud providers, live subdomains — and together the clues become a map of your attack surface. That is T1590.002.","You will meet this object as a CTI analyst (profiling how attackers prepare), as a pentester (running the same queries on purpose), as a SOC analyst ( spotting recon in DNS telemetry), and as a detection engineer (writing analytics like ATT&CK detection strategy DET0843 and its analytic AN1975). Tools on both sides: dig and nslookup for direct queries, passive DNS datasets such as CIRCL's, DNS Dumpster-style mapping sites, and your own DNS server logs.","ATT&CK places this sub-technique in the Reconnaissance tactic (TA0043) on the PRE platform — meaning it happens before the attack touches you, often outside your visibility. The page lists one mitigation, M1054 Software Configuration: restrict zone transfers to validated servers only. It also warns that a DNS zone transfer (AXFR) against a misconfigured server can leak every record at once. Detection is hard — high volume, high false positives — so defenders watch for later stages like Initial Access. Real cases on the page include a wrong BIND configuration that exposed a country's TLD records and CISA's warning that AXFR requests may leak domain information."],"kw":["dig","nslookup","host","axfr","nxdomain","mx","txt","soa","ptr","cname","spf","name-server","zone","transfer","recursion","include","all","in","grep","head"],"themes":[{"name":"Recon objective & lifecycle","concepts":["Reconnaissance tactic (TA0043)","PRE platform","parent T1590","feeds Active Scanning (T1595)"]},{"name":"DNS record types & what they reveal","concepts":["A / AAAA records","MX records and mail providers","NS records / registered name servers","CNAME records"]},{"name":"Collection methods","concepts":["direct DNS queries (active)","Passive DNS datasets","DNSDumpster-style mapping tools","dig / nslookup / host tools"]},{"name":"Zone transfer (AXFR)","concepts":["AXFR query type","leaks the full zone","restrict transfers to validated secondaries"]},{"name":"Mitigations & controls","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)"]},{"name":"Data sources & telemetry","concepts":["zone transfer attempt logs"]},{"name":"Detection logic & analytics","concepts":["AN1975 analytic","high false-positive rate","activity outside the victim's visibility"]},{"name":"Attacker value & next steps","concepts":["map mail flow for phishing","find live subdomains"]},{"name":"Reference cases from the page","concepts":["CIRCL Passive DNS","DNS Dumpster"]}],"exercises":[{"id":"T1590-002-E01","type":"logview","title":"What does an MX query reveal?","summary":"A public DNS query log — find the line that maps the mail flow.","concepts":["MX records and mail providers","direct DNS queries (active)"],"perspective":"attacker","tags":[],"logTitle":"resolver query log (public view, 14:02)","filterPlaceholder":"filter queries...","log":["14:02:01  A     www.harbourline-freight[.]com  -> 203[.]0[.]113[.]10","14:02:07  AAAA  www.harbourline-freight[.]com  -> 2001:db8::10","14:02:15  MX    harbourline-freight[.]com      -> 10 aspmx.l.google[.]com","14:02:16  TXT   harbourline-freight[.]com      -> \"v=spf1 include:_spf.google[.]com ~all\"","14:02:40  A     ftp-old.harbourline-freight[.]com -> 203[.]0[.]113[].44"],"options":[{"t":"The MX query — it names the mail provider for the domain","correct":true,"why":"Correct — the MX answer shows the domain's mail runs on Google's servers, a prime recon nugget."},{"t":"The A query for www — it shows the mail vendor","correct":false,"why":"A records map names to web host addresses; mail vendors live in MX answers."},{"t":"The AAAA query — IPv6 always reveals the mail system","correct":false,"why":"AAAA is just the IPv6 address of a name; it says nothing about mail."},{"t":"The TXT query — text records only carry slogans","correct":false,"why":"TXT records carry SPF policy data — here they confirm the Google mail setup too, but the MX line is the mail-flow map."}],"question":"Look at the query types and pick the line that maps the victim's mail flow.","hint":"This is about the record type whose whole job is listing mail servers.","explain":"MX answers list a domain's mail exchangers. An attacker reading 'aspmx.l.google[.]com' instantly knows the mail platform — exactly the kind of clue T1590.002 collects.","study":"DNS record types: what MX returns and why attackers care.","scenario":[{"label":"ARTEFACT 1 — resolver query log (public view, 14:02)","kind":"text","text":"You are reviewing this export in the SOC log viewer. A public DNS query log — find the line that maps the mail flow. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-E02","type":"mcq","title":"What does T1590.002 collect?","summary":"The scope of the sub-technique in one question.","concepts":["parent T1590","Reconnaissance tactic (TA0043)"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1590.002)","kind":"text","text":"Adversaries may gather information about the victim's DNS... including registered name servers as well as records that outline addressing for a target's subdomains, mail servers, and other hosts. DNS MX, TXT, and SPF records may also reveal the use of third party cloud and SaaS providers."}],"question":"According to the excerpt, what is the attacker gathering?","options":[{"t":"Information about the victim's DNS records and name servers","correct":true,"why":"Correct — the technique is literally about DNS information used during targeting."},{"t":"Passwords stored in the victim's password manager","correct":false,"why":"Credential theft is a different technique family; nothing here touches stored secrets."},{"t":"The victim's physical office floor plan","correct":false,"why":"Physical recon is not DNS; this sub-technique only queries name systems."},{"t":"The victim's staff holiday calendar","correct":false,"why":"HR data is out of scope — the excerpt is entirely about DNS records."}],"hint":"This is about the system that turns domain names into addresses.","explain":"T1590.002 = gathering victim DNS information: name servers, A/AAAA, MX, TXT/SPF and more. It sits under T1590 in the Reconnaissance tactic, on the PRE platform.","study":"The T1590.002 description and its parent technique T1590."},{"id":"T1590-002-E03","type":"match","title":"Match the record to its clue","summary":"Three record types and the recon answer each one gives.","concepts":["A / AAAA records","MX records and mail providers","NS records / registered name servers","CNAME records"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Recon cheat-sheet","kind":"text","text":"Each DNS record type answers a different question about the victim. Attackers read them like a directory."}],"question":"Match each record type to the question it answers.","left":[{"t":"A record","match":0,"why":"A maps a name to an IPv4 address — the hosting question."},{"t":"MX record","match":1,"why":"MX lists the mail exchangers — the mail question."},{"t":"NS record","match":2,"why":"NS lists the authoritative name servers — the DNS-provider question."},{"t":"CNAME record","match":3,"why":"CNAME is an alias — it points one name at another name."}],"right":[{"t":"Which server hosts this name (IPv4)","why":"A records return the IPv4 address for a hostname."},{"t":"Which servers receive this domain's mail","why":"MX records name the mail exchangers in priority order."},{"t":"Which name servers hold the zone","why":"NS records name the authoritative servers for the domain."},{"t":"Which other name this name is an alias of","why":"CNAME chains reveal third-party hosted services behind friendly names."}],"hint":"Mail, hosting, DNS hosting — one record type each.","explain":"A = addresses, MX = mail, NS = name servers. Reading all three gives an attacker a first sketch of the victim's internet footprint — the heart of T1590.002.","study":"Common DNS record types and the information each exposes."},{"id":"T1590-002-E04","type":"mcq","title":"Where does this sit in ATT&CK?","summary":"Tactic and platform of T1590.002.","concepts":["Reconnaissance tactic (TA0043)","PRE platform"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK page header (T1590.002)","kind":"text","text":"ID: T1590.002 · Sub-technique of: T1590 · Tactic: Reconnaissance (TA0043) · Platforms: PRE · Version 1.2"}],"question":"Look at the header — which tactic and platform does ATT&CK list?","options":[{"t":"Reconnaissance, platform PRE","correct":true,"why":"Correct — the technique runs before the attack (PRE) and belongs to the Reconnaissance tactic."},{"t":"Initial Access, platform Windows","correct":false,"why":"Initial Access comes later; this gathering happens before any access is attempted."},{"t":"Collection, platform Linux","correct":false,"why":"Collection happens inside the victim environment; this recon is external and pre-compromise."},{"t":"Defense Impairment, platform Network Devices","correct":false,"why":"That pairing belongs to a different technique family entirely — not this recon sub-technique."}],"hint":"This is about the phase before the attack touches the victim at all.","explain":"T1590.002 lives in Reconnaissance (TA0043) on the PRE platform: outside the victim's estate, before Initial Access. That placement explains why victims often never see the queries.","study":"The ATT&CK page header fields for T1590.002."},{"id":"T1590-002-E05","type":"dnd","title":"Sort the clue types","summary":"Mail infrastructure, host addressing, or not a DNS record.","concepts":["A / AAAA records","MX records and mail providers","direct DNS queries (active)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker's note cards","kind":"code","text":"MX harbourline-freight[.]com\nA www.harbourline-freight[.]com\nvisitor badge log, dock 4"}],"question":"Drag each note card to the box that describes it.","zones":[{"name":"Reveals mail infrastructure","accepts":[0],"why":"The MX query maps the mail exchangers."},{"name":"Reveals host addressing","accepts":[1],"why":"The A query maps a name to its server address."},{"name":"Not a DNS record","accepts":[2],"why":"A visitor badge log is physical-world data, not DNS."}],"bank":[{"t":"MX harbourline-freight[.]com","whyMiss":"MX is the mail record — 'Reveals mail infrastructure'."},{"t":"A www.harbourline-freight[.]com","whyMiss":"A records give addresses — 'Reveals host addressing'."},{"t":"visitor badge log, dock 4","whyMiss":"Badge logs are physical security data — 'Not a DNS record'."}],"hint":"One card maps mail, one maps a web host, one is not DNS at all.","explain":"Attackers sort every clue by what it reveals. MX → mail, A → hosting, badge log → physical world. Knowing which DNS records answer which question is the core recon skill of T1590.002.","study":"Which DNS record types expose mail and hosting infrastructure."},{"id":"T1590-002-E06","type":"order","title":"Order the recon steps","summary":"Four light-touch steps from name to plan.","concepts":["direct DNS queries (active)","find live subdomains","feeds Active Scanning (T1595)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Recon notebook pages","kind":"text","text":"Pages, out of order: 'list the mail servers (MX)' · 'pick the target domain' · 'ask which name servers run the zone (NS)' · 'collect addresses for interesting subdomains (A)'."}],"question":"Put the attacker's four steps in the order they happened.","sequence":["Pick the target domain","Ask which name servers run the zone (NS)","List the mail servers (MX)","Collect addresses for interesting subdomains (A)"],"orderWhy":["Every recon chain starts with the target name.","NS first shows where the authoritative answers live.","Mail mapping comes next — a favourite phishing input.","Address collection on subdomains rounds out the footprint and feeds scanning."],"hint":"Start with the name itself, end with the detailed addresses.","explain":"The order goes broad to narrow: domain, then NS, then MX, then per-subdomain addresses. The final page feeds the next ATT&CK step — Active Scanning (T1595) of the found hosts.","study":"How DNS recon feeds Active Scanning and Acquire Infrastructure."},{"id":"T1590-002-E07","type":"mcq","title":"What is passive DNS?","summary":"The dataset half of DNS recon — no packets sent to the victim.","concepts":["Passive DNS datasets","direct DNS queries (active)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — CTI team glossary","kind":"text","text":"Glossary: 'Passive DNS — a dataset collected by third parties from resolver traffic, recording which names resolved to which addresses over time. Querying it touches the dataset, never the victim's servers.'"}],"question":"Which statement describes passive DNS correctly?","options":[{"t":"Historical resolution data collected from resolver traffic by third parties","correct":true,"why":"Correct — passive DNS is somebody else's recorded answers; querying it sends nothing to the victim."},{"t":"A firewall that blocks all DNS queries","correct":false,"why":"Blocking queries is a control, not a dataset — and unrelated to recon collection."},{"t":"Sending queries directly to the victim's name servers","correct":false,"why":"That is ACTIVE collection — the opposite of passive; direct queries can be seen by the victim."},{"t":"A protocol for encrypting DNS answers","correct":false,"why":"Encryption of DNS traffic (DoH/DoT) is a transport feature, not a recon dataset."}],"hint":"This is about asking someone else's notes instead of asking the victim.","explain":"Passive DNS lets an attacker learn historical name-to-address mappings without touching the victim's infrastructure — invisible to the victim, which is exactly why AN1975 calls this activity hard to detect.","study":"Passive DNS datasets (for example CIRCL's) and how they differ from active queries."},{"id":"T1590-002-E08","type":"fib","title":"Complete the AXFR sentence","summary":"Two words finish the zone-transfer warning.","concepts":["AXFR query type","leaks the full zone"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Draft hardening note","kind":"text","text":"Draft: 'An AXFR request asks a DNS server for the {b0} zone — every record at once. It should only succeed for {b1} name servers.'"}],"question":"Fill the two blanks in the hardening note.","template":"An AXFR request asks a DNS server for the {b0} zone — every record at once. It should only succeed for {b1} name servers.","blanks":[{"accept":["entire","full","whole"],"why":"AXFR pulls the entire zone — that is what makes it dangerous.","whyMiss":"AXFR is not a partial answer; the whole point is the complete zone."},{"accept":["secondary","trusted","validated"],"why":"Only validated secondaries should ever receive a transfer.","whyMiss":"Random internet hosts must never be allowed — only approved secondaries."}],"hint":"First blank: the opposite of 'partial'. Second blank: the word for approved partner servers.","explain":"AXFR = a full copy of the zone in one request. Restricting it to validated secondaries is the control ATT&CK lists as M1054 for this technique.","study":"The M1054 mitigation text on the T1590.002 page."},{"id":"T1590-002-E09","type":"mcq","title":"Why mail mapping helps phishing","summary":"The attacker's next step after reading MX records.","concepts":["map mail flow for phishing","MX records and mail providers"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker planning note","kind":"text","text":"The attacker now knows the freight company's mail runs on a large cloud mail platform, and that the domain publishes an SPF record allowing that platform only."}],"question":"How does the mail-flow map help the attacker's next step?","options":[{"t":"They can craft spoofing or lookalike lures that fit the real mail setup","correct":true,"why":"Correct — knowing the mail vendor (and SPF) tells them how legitimate mail looks, so fake lures blend in."},{"t":"It lets them shut down the victim's mail servers","correct":false,"why":"Reading public DNS gives no control over the servers; disruption is not the goal here."},{"t":"It reveals every employee's password","correct":false,"why":"DNS records never contain passwords — that is a different attack entirely."},{"t":"It lets them unsubscribe the company from its own mail","correct":false,"why":"Mail-flow knowledge does not grant any administrative action."}],"hint":"This is about looking legitimate, not about control.","explain":"Mail-flow knowledge shapes convincing phishing: the right vendor look, the right SPF expectations, the right 'from' patterns. T1590.002 exists to feed exactly these follow-on steps.","study":"How recon output feeds Phishing (T1566) and Acquire Infrastructure (T1583)."},{"id":"T1590-002-E10","type":"logview","title":"Spot the zone-transfer attempt","summary":"Query-type column — which line is an AXFR?","concepts":["AXFR query type","zone transfer attempt logs"],"perspective":"defender","tags":[],"logTitle":"authoritative NS query log (18:44)","filterPlaceholder":"filter queries...","log":["18:44:02  A      portal.harbourline-freight[.]com   from 198[.]51[.]100[.]7","18:44:05  TXT    harbourline-freight[.]com          from 198[.]51[.]100[.]7","18:44:11  AXFR   harbourline-freight[.]com          from 198[.]51[.]100[.]231","18:44:12  status REFUSED  axfr denied (not in allowed list)","18:44:20  MX     harbourline-freight[.]com          from 198[.]51[.]100[.]7"],"options":[{"t":"18:44:11 — the AXFR query from 198[.]51[.]100[.]231","correct":true,"why":"Correct — AXFR is the zone-transfer type; that line is the attempt (and the next line shows it was refused)."},{"t":"18:44:02 — the A query for the portal","correct":false,"why":"An A query is a normal lookup any visitor could make."},{"t":"18:44:05 — the TXT query","correct":false,"why":"TXT lookups (SPF checks are common) are routine and high-volume."},{"t":"18:44:12 — the REFUSED status line","correct":false,"why":"That is the server's response to the attempt — the attempt itself is the AXFR line above it."}],"question":"Look at the query types and pick the line that shows a zone-transfer attempt.","hint":"This is about the four-letter query type that asks for everything at once.","explain":"AXFR is the zone-transfer query type. Seeing it from an external address means someone asked for the entire zone — the exact behaviour T1590.002 names, and the thing M1054 policies must refuse.","study":"Zone-transfer attempts in authoritative server logs.","scenario":[{"label":"ARTEFACT 1 — authoritative NS query log (18:44)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Query-type column — which line is an AXFR? Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-E11","type":"mcq","title":"Which mitigation does ATT&CK list?","summary":"The single M-ID attached to this sub-technique.","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK mitigations table (T1590.002)","kind":"text","text":"M1054 Software Configuration: 'Consider implementing policies for DNS servers, such as Zone Transfer Policies, that enforce a list of validated servers permitted for zone transfers.'"}],"question":"Which mitigation does ATT&CK list for T1590.002?","options":[{"t":"M1054 — Software Configuration","correct":true,"why":"Correct — M1054 with zone-transfer policies restricted to validated servers."},{"t":"M1027 — Privilege Levels","correct":false,"why":"M1027 restricts who administers network devices — it does nothing about public DNS records."},{"t":"M1041 — Encrypt Sensitive Information","correct":false,"why":"Encryption of data is not the listed control for this recon technique."},{"t":"M0932 — Account Use Policies","correct":false,"why":"Account policies target credential abuse, not DNS zone transfers."}],"hint":"This is about the mitigation whose name starts with 'Software'.","explain":"ATT&CK lists M1054 Software Configuration: DNS server policies that only allow validated servers to request zone transfers. It directly targets the AXFR path of T1590.002.","study":"The mitigation table on the T1590.002 page."},{"id":"T1590-002-E12","type":"terminal","title":"Run the guided NS lookup","summary":"Type the guided command to list the domain's name servers.","concepts":["dig / nslookup / host tools","NS records / registered name servers"],"perspective":"attacker","tags":[],"skill":"guided-lookup-command","scenario":[{"label":"ARTEFACT 1 — Lab brief (authorised training range)","kind":"text","text":"In the training range, you are asked to list the name servers for the practice domain. You are given the exact tool and its purpose: dig sends one DNS query and prints the answer."}],"question":"Using the syntax panel, type the command that asks for the NS records of harbourline-freight[.]com.","cmd":{"prompt":"recon-lab:~$","canonical":"dig NS harbourline-freight[.]com","nearMiss":"dig axfr harbourline-freight[.]com","syntaxPanel":"dig  <record-type>  <domain>\n\ndig  — sends one DNS query and prints the answer\nNS   — the record type: name servers for the zone\n<domain> — the name you are asking about","outputs":[{"re":"dig\\s+ns\\s+harbourline-freight\\[.\\]com","lines":[";; ANSWER SECTION:","harbourline-freight[.]com. 3600 IN NS ns1.harbourline-freight[.]com.","harbourline-freight[.]com. 3600 IN NS ns2.provider-dns[.]net."]}],"unknown":"command not recognised — check the syntax panel: dig, then record type, then domain.","elements":[{"re":"\\bdig\\b","label":"Uses dig","why":"dig is the given query tool in this lab."},{"re":"(^|\\s)ns(\\s|$)","label":"Asks for NS records","why":"The goal is the name-server list, which lives in NS records."},{"re":"harbourline-freight\\[.\\]com","label":"Targets the practice domain","why":"The query must name the exact domain from the brief."}],"forbidden":[{"re":"\\baxfr\\b","label":"a zone-transfer attempt","why":"The brief asks for name servers only — an AXFR would be an unauthorised full-zone pull."}]},"hint":"This is about the query tool that sends one DNS question — ask it for the name-server record type.","explain":"'dig NS harbourline-freight[.]com' returns the zone's name servers. One record type, one domain — the simplest possible active recon query, and the base pattern for every other lookup.","study":"dig basics: query name, record type, and the answer section."},{"id":"T1590-002-E13","type":"order","title":"Order the AXFR response","summary":"Three defender steps when the alert shows an external AXFR.","concepts":["zone transfer attempt logs","restrict transfers to validated secondaries"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — SOC alert card SEC-4402","kind":"text","text":"Alert: AXFR attempt against ns1 from an external address. Work the alert in the right order."}],"question":"Put the analyst's three steps in the correct order.","sequence":["Read the full alert entry (source, query type, response)","Check whether the server allowed or refused the transfer","Confirm the transfer policy lists only validated secondaries"],"orderWhy":["Read the whole record first — source and response matter.","The allowed/refused status decides severity immediately.","Only then verify the standing policy is correct for the future."],"hint":"Read, then check the outcome, then check the standing control.","explain":"Alert triage order: read, outcome, policy. A refused AXFR with a correct policy is a closed case; an allowed one is an incident. Either way the policy check prevents a repeat.","study":"Alert triage for zone-transfer attempts."},{"id":"T1590-002-E14","type":"match","title":"Match the tool to its purpose","summary":"Three recon tools and what each one is for.","concepts":["dig / nslookup / host tools","Passive DNS datasets","DNSDumpster-style mapping tools","CIRCL Passive DNS","DNS Dumpster"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Recon toolkit card","kind":"text","text":"Three tools, three jobs: ask one question, read history, or map the subdomain tree."}],"question":"Match each tool to its purpose.","left":[{"t":"dig","match":0,"why":"dig asks one DNS question and prints the answer."},{"t":"CIRCL passive DNS","match":1,"why":"A passive DNS dataset gives historical resolutions without touching the victim."},{"t":"DNS Dumpster-style site","match":2,"why":"Mapping sites aggregate a domain's public DNS surface into one tree view."}],"right":[{"t":"Send one DNS query and read the answer","why":"dig/nslookup style tools do exactly one query."},{"t":"Read historical name-to-address data without querying the victim","why":"Passive DNS datasets hold years of resolver observations."},{"t":"See the public DNS surface as one map","why":"Aggregator sites visualise subdomains and records together."}],"hint":"One asks live, one reads history, one draws the map.","explain":"Active tools (dig) touch the victim's resolvers; passive datasets do not. Knowing which is which tells you what the victim can and cannot see — a key idea in DET0843's detection logic.","study":"Active vs passive DNS collection, and the tools listed on the T1590.002 page."},{"id":"T1590-002-E15","type":"fib","title":"Complete the detection note","summary":"Two words finish the AN1975 summary for beginners.","concepts":["AN1975 analytic","high false-positive rate","activity outside the victim's visibility"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — SOC wiki stub","kind":"text","text":"Draft: 'Recon DNS activity has a very high {b0} rate, and much of it happens outside the victim's {b1}. Detection therefore focuses on later stages such as Initial Access.'"}],"question":"Fill the two blanks in the wiki stub.","template":"Recon DNS activity has a very high {b0} rate, and much of it happens outside the victim's {b1}. Detection therefore focuses on later stages such as Initial Access.","blanks":[{"accept":["false-positive","false positive"],"why":"Normal lookups look like recon — the false-positive rate is the analytic's headline problem.","whyMiss":"The problem is noise from normal traffic, not silence."},{"accept":["visibility"],"why":"External queries against public servers sit outside the victim's visibility.","whyMiss":"The victim cannot see most of the recon — that is the point of the note."}],"hint":"Blank one: the word that describes normal traffic being mistaken for recon. Blank two: what the victim lacks.","explain":"AN1975's two headline reasons: high false positives (everyone queries DNS) and outside visibility (PRE platform). That is why the analytic redirects attention to Initial Access stages.","study":"The detection strategy DET0843 / analytic AN1975 text."}],"severityWord":"EASY","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

  } else if(S.screen === 'review'){

  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;

  }
  $('exarea').innerHTML = reviewBanner + scenarioHtml(ex) + q + ans + '<div id="fback" role="status" aria-live="polite"></div>';

    if(ex._log.length === 0 && ex.cmd.banner){ ex._log.push({t: ex.cmd.banner, err:false}); }
    var si = $('shellin'); if(si){ si.focus(); }
    if(ex._tleft !== null && ex._tleft !== undefined && !ex._checked){
      var tc0 = $('termclock');
      if(tc0){ tc0.textContent = '⏱ ' + Math.floor(ex._tleft/60) + ':' + (ex._tleft%60 < 10 ? '0' : '') + (ex._tleft%60) + ' left on this terminal (pauses with the exam timer)'; }
    }
  }
  if(ex.type === 'order'){ renderSeqList(); }
  if(ex.type === 'branch'){ renderBranchStep(); }
  updateCheckState();
  updateHeader();
  flowLockRelease();
  var key = S.screen + ':' + S.cur;
  if(key !== LASTKEY){ LASTKEY = key; window.scrollTo(0,0); }

function updateCheckState(){
  var cb = $('checkbtn');
  if(!cb){ return; }
  var ex = curEx();
  if(ex && ex.type === 'branch' && !ex._checked && ex._step < ex.steps.length){
    cb.disabled = true;
    cb.title = 'Confirm every step first — confirming a step does not stop the timer.';
  } else {
    cb.disabled = false;
    cb.title = '';
  }
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');

function isLastGraded(){

}
function copyCmd(btn, txt){

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
      (si2 === ex._step && ex._picks[si2] === undefined ? '<button class="btn ghost" style="margin-top:8px" onclick="branchConfirm('+si2+')">▸ Confirm step '+(si2+1)+' (does not stop the timer)</button>' : '')+
      '</div>';
  });
  if(ex._step >= ex.steps.length && !ex._checked){
    htmlp += '<div class="btnrow"><button class="btn green" onclick="gradeCurrent()">✓ Check — grade all '+ex.steps.length+' decisions</button></div>';
  }
  area.innerHTML = htmlp;
}
function branchPick(si2, oi){
  var ex = curEx();
  if(ex._checked || si2 !== ex._step){ return; }
  ex._pendingPick = oi;
  document.querySelectorAll('input[name="bstep'+si2+'"]').forEach(function(el){ var r = el.closest('.opt'); if(r){ r.classList.toggle('selected', el.checked); } });
}
function branchConfirm(si2){
  var ex = curEx();
  var picked = ex._pendingPick;
  if(picked === undefined || picked === null){ return; }
  ex._picks[si2] = picked;
  ex._pendingPick = null;
  ex._step = si2 + 1;
  renderBranchStep();
  updateCheckState();
}

/* ---------- flow: pause / skip / hint / next / review / results ---------- */
var flowLock = false;
function flowLockAcquire(){
  if(flowLock){ return false; }
  flowLock = true;
  return true;
}
function flowLockRelease(){ flowLock = false; }
function pauseManual(){
  if(!T || T.state === 'ENDED'){ return; }
  if(T.state === 'PAUSED_MANUAL'){ return; }
  T.prevState = T.state;
  setTState('PAUSED_MANUAL');
  var ov = document.createElement('div');
  ov.id = 'pauseoverlay';
  ov.innerHTML = '<div class="pausecard"><div class="pico">⏸</div><h2>PAUSED — manual</h2><p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p><button class="btn primary" id="btn-resume" onclick="resumeManual()">▶ Resume</button></div>';
  document.body.appendChild(ov);
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'hidden'; }
}
function resumeManual(){
  var ov = $('pauseoverlay'); if(ov){ ov.remove(); }
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'visible'; }
  setTState(T.prevState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function doHint(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(!ex || ex._hintUsed || ex._checked){ return; }
  ex._hintUsed = true;
  var hp = document.createElement('div');
  hp.className = 'hintpanel';
  hp.innerHTML = '<span class="hint-tag">💡 HINT (one per exercise — costs 10% of this exercise\u2019s credit)</span>' + esc(ex.hint);
  var blk = document.querySelector('.blk.answer .blk-body');
  if(blk){ blk.insertBefore(hp, blk.firstChild); }
  $('btn-hint').disabled = true;
}
function doSkip(){
  if(S.screen !== 'exam'){ return; }
  if(!flowLockAcquire()){ return; }
  var ex = curEx();
  if(!ex || ex._checked){ flowLockRelease(); return; }
  var idx = EXS.indexOf(ex);
  if(S.skipped.indexOf(idx) < 0){ S.skipped.push(idx); }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); openReview(); }
}
function goNext(){
  if(!flowLockAcquire()){ return; }
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  if(S.screen === 'open'){
    S.screen = 'review';
    openReview();
    return;
  }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); finishAttempt(false); }
}
function openReview(){
  flowLockRelease();
  S.screen = 'review';
  S.reviewing = null;
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  updateHeader();
  var items = S.skipped.map(function(idx, pos){
    var ex = EXS[idx];
    return '<li><span class="statechip st-skipped">⚠ Skipped</span><span class="rv-title">'+esc(ex.title)+'</span><button class="btn primary" onclick="openSkipped('+pos+')">↩ Open and answer</button></li>';
  }).join('');
  $('exarea').innerHTML =
    '<div class="card"><h2>⚠ Review skipped exercises ('+S.skipped.length+')</h2>'+
    '<p style="color:var(--text-secondary)">The timer is still running. You can open each skipped exercise as many times as you need until the timer ends or you submit. If you submit now, every skipped-and-never-answered exercise is excluded from the score — it does not count as correct or wrong.</p>'+
    (S.skipped.length ? '<ul class="reviewlist">'+items+'</ul>' : '<p>Nothing left here — you answered everything.</p>')+
    '<div class="btnrow"><button class="btn danger" onclick="showResults()">⏹ Submit exam now</button></div></div>';
  window.scrollTo(0,0);
}
function openSkipped(pos){
  var idx = S.skipped[pos];
  var ordPos = S.order.indexOf(idx);
  if(ordPos < 0){ ordPos = 0; }
  S.cur = ordPos;
  S.reviewPos = pos;
  S.screen = 'open';
  renderExercise();
}
function finishAttempt(auto){
  if(T.iv){ clearInterval(T.iv); }
  var anySkipped = S.skipped.length > 0;
  if(!auto && anySkipped && S.screen === 'exam'){
    openReview();
    return;
  }
  showResults();
}
function showResults(){
  flowLockRelease();
  if(S.screen === 'results'){ return; }
  if(T.iv){ clearInterval(T.iv); }
  setTState('ENDED');
  S.screen = 'results';
  var fully = 0, partial = 0, partialSum = 0, incorrect = 0, skippedN = 0, answeredN = 0;
  EXS.forEach(function(ex){
    if(ex._checked){
      answeredN += 1;
      if(ex._credit >= 1){ fully += 1; }
      else if(ex._credit > 0){ partial += 1; partialSum += ex._credit; }
      else { incorrect += 1; }
    } else { skippedN += 1; }
  });
  var sum = 0;
  EXS.forEach(function(ex){ if(ex._checked){ sum += ex._credit; } });
  var pct = answeredN > 0 ? Math.round((sum / answeredN) * 100) : 0;
  var passed = pct >= META.passMark && answeredN > 0;
  var avgP = partial > 0 ? round1(partialSum / partial).toFixed(2) : '0.00';
  var mins = Math.floor((META.timerMinutes*60 - T.remaining) / 60);
  var cert = passed ?
    '<div class="cert pass"><h2>✓ PASS</h2><p>You reached <b>'+pct+'%</b>, which is at or above the '+META.passMark+'% pass mark. Your result has been reported to the site.</p></div>' :
    '<div class="cert fail"><h2>✗ FAIL</h2><p>You reached <b>'+pct+'%</b>, below the '+META.passMark+'% pass mark. You must retake the exam to pass.</p></div>';
  $('app').innerHTML =
    '<div class="card"><h1>Results — '+esc(META.title)+'</h1>'+
    '<p style="color:var(--text-secondary)">Score computed over <b>'+answeredN+'</b> answered exercise(s). '+skippedN+' skipped-and-never-answered exercise(s) were excluded from both the score and the maximum.</p>'+
    '<div class="factrow"><span class="fact">◎ <span>Final score: <b>'+sum.toFixed(1)+' / '+answeredN+'</b> — <b>'+pct+'%</b></span></span><span class="fact">⏱ <span>timer used: <b>'+mins+' min</b> of '+META.timerMinutes+'</span></span></div>'+
    '</div>'+
    cert+
    '<div class="resultgrid">'+
    '<div class="rcard"><div class="rc-num st-correct">✓ '+fully+'</div><div class="rc-lab">Fully correct (credit 1.0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-partial">✓ '+partial+'</div><div class="rc-lab">Partially correct (avg credit '+avgP+')</div></div>'+
    '<div class="rcard"><div class="rc-num st-incorrect">✗ '+incorrect+'</div><div class="rc-lab">Fully incorrect (credit 0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-skipped">⚠ '+skippedN+'</div><div class="rc-lab">Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="card"><h2>How your time was spent</h2><p class="pauselog">⏸ Total time paused manually (exercise hidden): <b class="mono">'+T.manualTotal+' s</b><br>⏸ Total time paused for feedback review (Check auto-pause): <b class="mono">'+T.autoTotal+' s</b></p></div>'+
    '<div class="btnrow"><button class="btn primary" id="retakebtn" onclick="retake()">↻ Retake Exam</button></div>';
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported = true;
    reportScore(sum, answeredN);
  }
}
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. */ }
}
function retake(){
  var init = S ? S.init : null;
  startAttempt();
  S.init = init;
  updateHeader();
}

/* ---------- handshake & boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S = S || { init: null };
  S.init = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark' /* always 'dark'; the file is dark-only, nothing to switch */
  };
  var uc = document.querySelector('.userchip');
  if (S.init.username && !uc) {
    var hero = document.querySelector('.factrow');
    if (hero) {
      var chip = document.createElement('span');
      chip.className = 'userchip';
      chip.textContent = '👤 Analyst: ' + S.init.username;
      hero.appendChild(chip);
    }
  }
});
S = { init: null };
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
