<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
  /* derived tints & constants — every rule below consumes variables only */
  --surface-hover:#182238;
  --topbar-bg:rgba(18,26,46,.97);
  --overlay:rgba(11,16,32,.96);
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --shadow-lg:0 8px 22px rgba(0,0,0,.45);
  --sheen:rgba(230,236,255,.35);
  --tint-blue:rgba(90,169,255,.10);
  --tint-blue-strong:rgba(90,169,255,.25);
  --tint-blue-weak:rgba(90,169,255,.12);
  --tint-blue-faint:rgba(90,169,255,.06);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);
  --tint-orange-badge:rgba(255,138,61,.12);
  --tint-red:rgba(255,107,107,.08);
  --tint-red-faint:rgba(255,107,107,.07);
  --tint-red-badge:rgba(255,107,107,.12);
  --tint-red-hero:rgba(255,107,107,.12);
  --tint-purple:rgba(157,123,255,.07);
  --ring-green:0 0 0 2px rgba(87,211,140,.35);
  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;
  --tok-num:#7fd8ff;
  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}
.intro-hero .objline{color:var(--text-secondary);font-size:15px;margin:2px 0}
.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.themebox h4{margin:0 0 8px 0;color:var(--accent-blue);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.themebox ul{margin:0;padding-left:18px;color:var(--text-primary);font-size:14.5px}
.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}
.rulelist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);color:var(--text-primary);font-size:15px;align-items:flex-start}
.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

/* ---------- review & results ---------- */
.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.resultgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1600.001","name":"Weaken Encryption: Reduce Key Space","type":"Sub-Technique","parent":"T1600","tactic":"Defense Impairment (TA0112)","platforms":"Network Devices"},"learn":["This object is a sub-technique. In the MITRE ATT&CK framework, a sub-technique describes one specific way that an attacker can carry out a broader technique. This one belongs to the parent technique T1600, Weaken Encryption. Its job is simple to say: the attacker makes the encryption on a compromised network device weaker, so that cracking the traffic later becomes much cheaper.","Imagine you are a network security engineer at a rail company. Your VPN gateway encrypts traffic with strong, long keys. An attacker who has stolen a management password logs in and changes the key size from thousands of bytes down to a couple of bytes, or swaps a modern cipher for an old, weak one. The device still 'works', so nobody notices — but the attacker can now decrypt everything they capture. That is exactly what T1600.001 describes.","You will meet this object in real work as a SOC analyst (strange crypto config alerts), as a detection engineer (building analytics like ATT&CK detection strategy DET0243 and its analytic AN0681), as an incident responder (deciding how to contain a gateway without destroying evidence), and as a GRC or control owner (writing crypto policy, change control, and backup rules). Tools you will touch: device CLI, configuration archives, firmware records, and traffic analysers that show which ciphers are actually negotiated.","The ATT&CK page for T1600.001 notes that it cannot be easily mitigated with preventive controls, because the attacker abuses normal device features. So defenders lean on configuration change logs, firmware integrity, restricted management access, and traffic analysis. The risks it addresses are unauthorized disclosure of sensitive traffic and follow-on attacks like credential theft. ATT&CK places it in the Defense Impairment tactic (TA0112), on the Network Devices platform. The page references documented attacks on Cisco IOS devices and on legacy devices — old gear with weak defaults is a favourite target."],"kw":["crypto","isakmp","ipsec","transform-set","aes","3des","sha","md5","rsa","tunnel","esp","pre-share","show","write","reload","erase","copy","verify","archive","interface","access-list","permit","deny"],"themes":[{"name":"Adversary behaviour & TTPs","concepts":["pre-position for decrypting captured traffic","modify key size via Network Device CLI (T1059.008)","pair with Modify System Image (T1601)"]},{"name":"Tactics & lifecycle position","concepts":["unauthorized disclosure risk"]},{"name":"Key space & cipher fundamentals","concepts":["IKE phase parameters"]},{"name":"Network device CLI & configuration","concepts":["key management files","management access control"]},{"name":"Data sources & telemetry","concepts":["device configuration logs","CLI command logs","traffic analysis of negotiated ciphers"]},{"name":"Detection logic & analytics","concepts":["correlation of config change + weaker ciphers","confidence level"]},{"name":"Mitigations & control limits","concepts":["config integrity monitoring","trusted image verification","change control","configuration backups","management network segmentation"]},{"name":"Framework mappings & real work","concepts":["IR evidence handling"]},{"name":"Reference cases from the page","concepts":["attacks on Cisco IOS devices (Holmes 2015)","targeting of legacy devices (Santos 2020)"]}],"exercises":[{"id":"T1600-001-X01","type":"mcq","title":"The CISO's 03:00 demand","summary":"Block the attacker now, or keep the session alive for evidence?","concepts":["IR evidence handling","correlation of config change + weaker ciphers","pre-position for decrypting captured traffic"],"perspective":"defender","tags":["trap:escalate-or-gather","trap:best-practice-wrong"],"scenario":[{"label":"ARTEFACT 1 — Incident bridge, 03:06","kind":"text","text":"vpn-hub-02: unticketed save at 03:12 yesterday, tunnel rekeyed to 3DES, session source still live. CISO on the bridge: 'Best practice — block their IP at the perimeter right now.'"},{"label":"ARTEFACT 2 — Constraint","kind":"text","text":"You have not yet captured which files the session touched, nor confirmed whether the image itself was modified. A perimeter block ends the session instantly."}],"question":"What is the correct call on the bridge?","options":[{"t":"Keep the session alive; start passive capture and snapshot state first","correct":true,"why":"Correct — the session is your only live window into the attacker's toolkit; capture before you cut, then block."},{"t":"Block the attacker IP at the perimeter immediately","correct":false,"why":"It sounds like best practice, but here it destroys the live session and the evidence it holds — and tips the attacker off."},{"t":"Do nothing at all and revisit at the morning review","correct":false,"why":"'Gather evidence' does not mean idle: passive capture and snapshots start now, or the window closes."},{"t":"Reload the gateway to sever the session cleanly","correct":false,"why":"A reload erases volatile evidence; if the image was modified (T1601), the tampering simply reloads with it."}],"hint":"The constraint artefact says what you still lack — you cannot get it after the session dies.","explain":"Senior judgement: the 'obvious best practice' (instant block) is wrong while the live session is the only source of key evidence. Evidence-first does not mean passive — capture, snapshot, then cut. That is the escalate-or-gather discipline.","study":"Evidence-first containment for live attacker sessions on network infrastructure."},{"id":"T1600-001-X02","type":"branch","title":"Four decisions under pressure","summary":"Expired ticket, unknown session, signalling SLA — decide each step.","concepts":["change control","management network segmentation","IR evidence handling","config integrity monitoring"],"perspective":"defender","tags":["trap:conflicting-signals","trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Case snapshot 26-0412","kind":"text","text":"Ticket CHG-2288 'cipher migration to legacy for partner gate' was approved last month and expired 30 days ago. Tonight policy 10 (HQ tunnel, AES-256 baseline) switched to 3DES right after an unticketed save. Session source: 10[.]20[.]5[.]44, an address from a decommissioned management range."},{"label":"ARTEFACT 2 — SLA card","kind":"text","text":"Signalling telemetry SLA: max 15 minutes of tunnel downtime per month, currently 3 minutes used."}],"question":"Make the four senior-analyst decisions in order.","steps":[{"text":"Decision 1 — The expired CHG-2288 mentions legacy ciphers. How do you read it against tonight's change?","options":[{"t":"The expired ticket explains history, not tonight — treat the change as unauthorised","correct":true,"why":"Correct — the ticket window ended 30 days ago and never covered vpn-hub-02; the conflicting signal resolves against it.","outcome":"The register confirms: expired window, different device. Tonight's change stands unauthorised.","outcomeBad":false},{"t":"Treat the change as approved because a similar ticket once existed","correct":false,"why":"Wrong — approval is bound to scope and window; a stale ticket for another gate proves nothing.","outcome":"You would wave through a real downgrade because of a lookalike record.","outcomeBad":true},{"t":"Ignore tickets entirely and judge the cipher by eye","correct":false,"why":"The register is exactly what separates benign legacy use from a fresh downgrade.","outcome":"Without the register, baseline comparisons lose their anchor.","outcomeBad":true}]},{"text":"Decision 2 — The session is live on 10[.]20[.]5[.]44. What do you do with it right now?","options":[{"t":"Start passive capture at core-sw-01 and snapshot device state before touching the session","correct":true,"why":"Correct — the live session plus snapshots answer 'what else did they touch' — the branching evidence you will need.","outcome":"Capture begins; the TACACS copy shows key-management file writes you had not seen.","outcomeBad":false},{"t":"Kill the session immediately to stop the bleeding","correct":false,"why":"Costly here: you lose the live window before snapshots — the attacker's other changes stay invisible.","outcome":"Session dead; two further touched files never get identified.","outcomeBad":true},{"t":"Reply in the CLI to ask what they are doing","correct":false,"why":"Contacting the operator warns them and gains nothing forensically.","outcome":"The session cleans up and disconnects within seconds.","outcomeBad":true}]},{"text":"Decision 3 — You must stop further crypto changes but keep the tunnel up. Which containment fits the SLA?","options":[{"t":"Move the management interface into the OOB quarantine VLAN only","correct":true,"why":"Correct — the data plane tunnel stays up (SLA intact) while the management plane is cut: minimum cost that works.","outcome":"Tunnel uptime preserved; further CLI access impossible; 0 additional SLA minutes used.","outcomeBad":false},{"t":"Reload the gateway to evict the session","correct":false,"why":"A reload drops the tunnel for minutes (SLA breach) and the modified image reloads the tampering.","outcome":"11 SLA minutes burned; the 3DES policy returns with the image.","outcomeBad":true},{"t":"Shut the tunnel interface entirely overnight","correct":false,"why":"Massively over the SLA — signalling telemetry stops, a business outage you must justify and did not need.","outcome":"Telemetry dark for hours; the SLA breach lands on your desk.","outcomeBad":true}]},{"text":"Decision 4 — Restore or keep running overnight?","options":[{"t":"Prepare a failover gateway and restore only after evidence capture completes","correct":true,"why":"Correct — restore is right, but sequencing it after capture avoids destroying proof, and failover respects the SLA.","outcome":"Failover ready by 04:30; capture finished 04:12; restore executed cleanly at 04:31.","outcomeBad":false},{"t":"Restore immediately — evidence can wait for the vendor","correct":false,"why":"Immediate restore overwrites the tampered state — the artefact your report depends on.","outcome":"Restore at 03:40; the tampered config is gone; the case weakens to 'we think'.","outcomeBad":true},{"t":"Keep the weakened tunnel running for the rest of the month","correct":false,"why":"Every hour of weak crypto is exposure; there is no defensible reason to wait weeks.","outcome":"Captured traffic for three weeks becomes crackable — unauthorised disclosure risk accepted for nothing.","outcomeBad":true}]}],"hint":"Conflicting signals resolve to scope and window; every choice has a cost — pick the cheapest one that still works.","explain":"The chain: resolve the ticket conflict, milk the live session for evidence, cut only the management plane (SLA-safe), then restore in the right order. Each decision depends on the previous one — change one answer and the later steps change too.","study":"SLA-aware containment planning and decision logging under executive pressure."},{"id":"T1600-001-X03","type":"terminal","title":"Extract the attacker's CLI history","summary":"Read-only extraction from the TACACS log — nothing may be modified.","concepts":["CLI command logs","IR evidence handling","modify key size via Network Device CLI (T1059.008)"],"perspective":"defender","tags":["trap:real-cost"],"skill":"evidence-extraction-pipeline","scenario":[{"label":"ARTEFACT 1 — Environment","kind":"text","text":"You are on the TACACS+ server (Linux). Objective: show the first 40 lines mentioning crypto or encryption from the authentication/command log, so the bridge sees the attacker's typed commands. Rules: read-only; the log is evidence; nothing may be truncated, moved, or restarted."}],"question":"Type the command that prints those 40 lines without altering anything.","cmd":{"timeLimit":300,"prompt":"ir@tacacs01:~$","canonical":"grep -E \"crypto|encryption\" /var/log/tacacs/tac_plus.log | head -40","nearMiss":"grep -E \"crypto|encryption\" /var/log/tacacs/tac_plus.log > /var/log/tac_plus.log","outputs":[{"re":"grep\\s+-e?\\s*[\\\"']?crypto\\|encryption[\\\"']?\\s+/var/log/tacacs/tac_plus\\.log\\s*\\|\\s*head\\s+-?40","lines":["03:11:58 vty0 10[.]20[.]5[.]44 svc-backup  configure terminal","03:12:04 vty0 10[.]20[.]5[.]44 svc-backup  crypto isakmp policy 10","03:12:06 vty0 10[.]20[.]5[.]44 svc-backup  encryption 3des","03:12:31 vty0 10[.]20[.]5[.]44 svc-backup  end","03:12:40 vty0 10[.]20[.]5[.]44 svc-backup  write memory"]}],"unknown":"command not found or wrong target — check the pattern and the log path.","elements":[{"re":"\\bgrep\\b","label":"grep (search, read-only)","why":"grep prints matches without touching the file — the safe extraction verb."},{"re":"crypto\\|encryption","label":"The pattern 'crypto|encryption'","why":"Both keywords must match; the pipe inside quotes alternates them."},{"re":"/var/log/tacacs/tac_plus\\.log","label":"The evidence log path","why":"That exact file holds the command accounting records."},{"re":"\\|","label":"The shell pipe into head","why":"The pipe forwards matches to the limiter stage."},{"re":"head\\s+-?40|head\\s+-n\\s*40","label":"head limiting to 40 lines","why":"The objective asked for the first 40 lines only."}],"forbidden":[{"re":"\\brm\\b|\\bmv\\b|\\btruncate\\b|>\\s*/var/log|systemctl (restart|stop)","label":"a log-modifying action","why":"Deleting, moving, truncating, redirecting into, or restarting the service destroys or taints evidence — the DANGEROUS near-miss."},{"re":"\\bsudo tee\\b","label":"writing back into the log","why":"Any write to the evidence file breaks its integrity for court."}]},"hint":"Two read-only stages: search with both keywords, then limit the output. The log itself must never be written to.","explain":"'grep -E \"crypto|encryption\" <log> | head -40' answers the bridge read-only. The DANGEROUS near-misses (rm, truncate, redirecting into the log, restarting the service) would destroy the very evidence the case needs — a real cost you must never accept.","study":"Read-only log extraction pipelines and evidence-handling rules for Linux IR."},{"id":"T1600-001-X04","type":"multi","title":"Reason around the missing window","summary":"TACACS logging has a 20-minute gap — which readings stay defensible?","concepts":["confidence level","CLI command logs","correlation of config change + weaker ciphers","config integrity monitoring"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Gap report","kind":"text","text":"TACACS records are missing 02:52-03:12 (server disk pressure purged the buffer). Known despite the gap: unticketed save at 03:12, policy 10 rekeyed to 3DES at 03:14, image checksum drift confirmed at 03:20."}],"question":"Select every statement that is a defensible reading of the incomplete evidence.","options":[{"t":"The gap is incomplete information, not proof the change was authorised","correct":true,"why":"Correct — absence of logs never upgrades an unticketed change to approved."},{"t":"The baseline break on policy 10 remains the anchor signal regardless of the gap","correct":true,"why":"Correct — AES-256 → 3DES on the HQ tunnel is observed in traffic and in the config diff; it does not depend on the missing lines."},{"t":"The image checksum drift corroborates persistence even with the gap","correct":true,"why":"Correct — the checksum is independent telemetry; it shows the downgrade survives reloads."},{"t":"The gap proves the attacker used a different, benign account","correct":false,"why":"It proves nothing of the sort — missing logs cannot identify any account."},{"t":"Without full TACACS coverage the device must be treated as uncompromised","correct":false,"why":"Backwards — incomplete telemetry lowers confidence in innocence, not in compromise."},{"t":"The gap means no report can be written at all","correct":false,"why":"Reports routinely state known facts and mark the gap explicitly — that is standard practice."}],"hint":"Separate what is observed (diff, traffic, checksum) from what is merely missing (two log lines).","explain":"Senior analysts reason around gaps: observed artefacts anchor the case, missing lines are declared as limitations, and no conclusion is drawn from absence. All three correct readings hold without the missing window.","study":"Writing limitations sections in IR reports; evidence hierarchies when telemetry is partial."},{"id":"T1600-001-X05","type":"match","title":"What each artefact really proves","summary":"Four case artefacts — proof, history, constraint, or exculpatory.","concepts":["change control","management access control","IR evidence handling","targeting of legacy devices (Santos 2020)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case 26-0412 shelf, re-tagged","kind":"text","text":"(a) Expired ticket CHG-2288 · (b) TACACS grant 'enable 15' to svc-backup at 02:58 · (c) Signalling-telemetry SLA card · (d) Vendor bulletin VB-77 (AES-GCM migration) signed and published."}],"question":"Match each artefact to what it actually establishes in the case.","left":[{"t":"(a) Expired ticket CHG-2288","match":0,"why":"It explains why legacy-cipher history exists — and fails to authorise tonight."},{"t":"(b) enable-15 grant to svc-backup","match":1,"why":"It is the privilege path that made the crypto commands possible — attacker infrastructure."},{"t":"(c) Telemetry SLA card","match":2,"why":"It is the business constraint that prices every containment option."},{"t":"(d) Signed bulletin VB-77","match":3,"why":"Vendor-signed proof of the legitimate migration — exculpatory for the 03:04 GCM change."}],"right":[{"t":"History that fails to authorise tonight's change","why":"Expired window, different device — context, not clearance."},{"t":"The attacker's privilege-escalation path","why":"An enable-15 grant to a service account is attacker infrastructure, not paperwork."},{"t":"The cost side of every decision","why":"SLAs price downtime; ignoring them causes business impact."},{"t":"Proof that one scary-looking change was legitimate","why":"A signed bulletin exculpates the ticketed migration it documents."}],"hint":"One artefact is attacker infrastructure, one is a business constraint, one is exculpatory, one is stale context.","explain":"Attribution-grade thinking assigns each artefact its true role: attacker path (b), cost constraint (c), exculpatory proof (d), stale context (a). Mis-tagging any of them corrupts the case narrative.","study":"Case artefact tagging: inculpatory, exculpatory, contextual, and constraint evidence."},{"id":"T1600-001-X06","type":"triage","title":"The 03:20 action queue","summary":"Six proposed actions — do now, after evidence, or never.","concepts":["IR evidence handling","management network segmentation","config integrity monitoring","key management files"],"perspective":"defender","tags":["trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Bridge queue at 03:20","kind":"text","text":"State: session captured for 8 minutes, config snapshot done, image checksum drift confirmed, tunnel still on 3DES, SLA 12 minutes remaining."}],"question":"Classify each proposed action for right now.","rows":[{"alert":"Move mgmt interface to OOB quarantine VLAN","detail":"Data tunnel untouched; blocks further CLI.","options":["Do now","Only after evidence capture","Never"],"correctIndex":0,"why":"Capture and snapshot are complete; blocking further changes costs zero SLA minutes.","whyNot":{"1":"The evidence already captured covers the session; waiting only gives the attacker time.","2":"It is the safest containment available — never is wrong."}},{"alert":"Reload vpn-hub-02 to evict everything","detail":"Image checksum drift confirmed earlier.","options":["Do now","Only after evidence capture","Never (as currently planned)"],"correctIndex":2,"why":"With the image tampered, a reload restores the tampering, burns SLA minutes, and adds nothing — prepare failover instead.","whyNot":{"0":"It breaches the SLA and reinstates the attacker's persistent change.","1":"Even after capture it is pointless while the image is modified — failover first."}},{"alert":"Snapshot key-management files to evidence server","detail":"Files referenced by AN0681 indicator list.","options":["Do now","Only after evidence capture","Never"],"correctIndex":0,"why":"The unexpected key-file updates are not yet snapshotted — do it while the device is still live.","whyNot":{"1":"You are already capturing; extend it now rather than scheduling it later.","2":"They are listed indicators — skipping them weakens the case."}},{"alert":"Erase flash to remove the modified image","detail":"Proposal from the ops on-call.","options":["Do now","Only after evidence capture","Never (as currently planned)"],"correctIndex":2,"why":"Erasing flash destroys the image artefact you need to prove T1601 — replace the device via failover instead.","whyNot":{"0":"It is evidence destruction dressed as cleanup.","1":"Even delayed, erasure destroys the artefact; image replacement preserves it."}},{"alert":"Rotate IPsec pre-shared keys and management credentials","detail":"Post-restoration hardening step.","options":["Do now","Only after evidence capture","Never"],"correctIndex":1,"why":"Correct in principle but sequencing matters: rotating now could terminate the live capture session and tip the attacker.","whyNot":{"0":"Doing it now kills your own capture and warns the operator.","2":"It is mandatory after restoration — never is wrong."}},{"alert":"Write the interim CISO brief with confidence level","detail":"Requested for the 04:00 exec sync.","options":["Do now","Only after evidence capture","Never"],"correctIndex":1,"why":"Draft now, finalise after the snapshot completes so the brief quotes complete evidence and the right confidence level.","whyNot":{"0":"Sending it before the snapshot risks quoting a confidence you will have to retract.","2":"Executive comms are part of the response — never is wrong."}}],"hint":"Two columns cost SLA minutes or evidence; one column only sequences the work.","explain":"The queue separates zero-cost containment (do now), sequencing-sensitive actions (after capture), and destructive traps (never as planned). Every 'never' here is a real-cost trap: reload and erase both destroy value while feeling decisive.","study":"Action-queue discipline in IR bridges: cost, sequencing, and irreversibility."},{"id":"T1600-001-X07","type":"logview","title":"Anchor lines in a noisy night","summary":"One multi-select over a noisy log — pick the two anchoring lines.","concepts":["correlation of config change + weaker ciphers","config integrity monitoring","device configuration logs"],"perspective":"defender","tags":["trap:conflicting-signals"],"logTitle":"core-sw-01 SPAN summary + vpn-hub-02 syslog (03:00-03:30)","filterPlaceholder":"filter lines...","multi":true,"log":["03:02:11  BGP flap on uplink A (maintenance, ticketed CHG-2290)","03:12:07  vpn-hub-02  config saved (write memory) — no matching ticket","03:14:02  vpn-hub-02  IKEv2 SELECTED: ENCR=3DES PRF=MD5 DH=group2 (rekey, was AES-GCM-256)","03:17:45  printer-vlan broadcast storm, port te1/0/24 err-disabled","03:20:33  vpn-hub-02  image checksum differs from vendor signed value","03:26:02  facilities  chiller-3 temperature alarm (site ops notified)"],"options":[{"t":"The 03:12 unticketed config save","correct":true,"why":"Correct — the cause-side anchor: an unticketed save immediately preceding the baseline break."},{"t":"The 03:14 SELECTED 3DES rekey of a formerly AES-GCM tunnel","correct":true,"why":"Correct — the effect-side anchor: weak parameters actually negotiated where strong ones were baseline."},{"t":"The 03:02 BGP flap","correct":false,"why":"Ticketed maintenance noise — realistic, but irrelevant to the crypto case."},{"t":"The 03:17 printer-VLAN storm","correct":false,"why":"Endpoint noise; tempting because it is loud, but unrelated."},{"t":"The 03:26 chiller temperature alarm","correct":false,"why":"Facilities telemetry — pure distractor noise."}],"question":"Select the TWO lines that anchor the T1600.001 determination.","hint":"One line is the cause, one is the effect — the noise is genuinely realistic but stays noise.","explain":"Cause (unticketed save) + effect (3DES selected where AES-GCM was baseline) anchor the determination at high confidence. The checksum drift corroborates persistence; the rest is realistic noise that must be left out of the determination.","study":"Determination writing: anchor artefacts versus corroborating versus noise.","scenario":[{"label":"ARTEFACT 1 — core-sw-01 SPAN summary + vpn-hub-02 syslog (03:00-03:30)","kind":"text","text":"You are reviewing this export in the SOC log viewer. One multi-select over a noisy log — pick the two anchoring lines. Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-X08","type":"mcq","title":"The reload 'best practice' trap","summary":"Why the standard reboot-to-clean advice fails on this device.","concepts":["pair with Modify System Image (T1601)","IR evidence handling","attacks on Cisco IOS devices (Holmes 2015)"],"perspective":"attacker","tags":["trap:best-practice-wrong"],"scenario":[{"label":"ARTEFACT 1 — Ops runbook quote","kind":"text","text":"Runbook: 'Suspected compromise of a device? Standard practice: reload from trusted image to clear RAM-resident implants.' Your checksum data says the on-disk image itself was modified (T1601) two minutes before the key-space change."}],"question":"From the attacker's design point of view, why does the runbook advice fail here?","options":[{"t":"The tampering was persisted into the image, so a reload reinstates it and erases volatile evidence","correct":true,"why":"Correct — the attacker banked on responders reaching for the reload reflex; the image change survives and the RAM evidence burns."},{"t":"Reloading takes the device offline longer than five minutes","correct":false,"why":"Downtime is a real cost, but the decisive failure is persistence plus evidence loss, not the wait itself."},{"t":"Reloads are blocked by change control during incidents","correct":false,"why":"Change control can be waived in an incident; this is not the design reason the advice fails."},{"t":"The attacker cannot survive a reload in any scenario","correct":false,"why":"Exactly backwards — with T1601 the tampering is built to survive reloads."}],"hint":"Ask what the attacker prepared two minutes before the crypto change — and what a reload does to RAM.","explain":"The attacker's design goal: make the reflex action (reload) work for them. Persist into the image, let the responder reload, lose the volatile evidence, and keep the weak crypto. That is why 'reload to clean' is the wrong best practice here.","study":"T1601 Modify System Image: persistence design and its interaction with responder reflexes."},{"id":"T1600-001-X09","type":"terminal","title":"Quiet verification of the live transform","summary":"Confirm what the tunnel is using — without dropping it.","concepts":["traffic analysis of negotiated ciphers","IKE phase parameters","CLI command logs"],"perspective":"defender","tags":["trap:real-cost"],"skill":"narrow-state-display","scenario":[{"label":"ARTEFACT 1 — Bridge request","kind":"text","text":"The CISO wants live proof of which transform the HQ tunnel is using right now. Rules: read-only; the tunnel must not renegotiate (SLA); output limited to the transform lines."}],"question":"Type the command that shows only the transform lines of the IPsec security associations.","cmd":{"timeLimit":300,"prompt":"vpn-hub-02#","canonical":"show crypto ipsec sa | include transform","nearMiss":"clear crypto ipsec sa","outputs":[{"re":"show crypto ipsec sa\\s*\\|\\s*include\\s+transform","lines":["sa pkts  auth-algo  enc-algo  transform","#pkts enc: 410321, transform: esp-3des esp-md5-hmac"]}],"unknown":"% Invalid input — that would either answer a different question or disturb the tunnel.","elements":[{"re":"\\bshow\\b","label":"Read-only 'show'","why":"Display only — the SLA forbids anything that renegotiates."},{"re":"ipsec sa","label":"The IPsec SA object","why":"Live tunnel state lives in the security-association table."},{"re":"\\|","label":"The pipe","why":"Feeds the SA dump into the filter."},{"re":"\\binclude\\b","label":"The 'include' filter","why":"Keeps only the transform lines as requested."},{"re":"transform","label":"Filter word: transform","why":"That is the line type the bridge asked for."}],"forbidden":[{"re":"\\bclear\\b","label":"a 'clear' command","why":"'clear crypto sa' forces renegotiation — the DANGEROUS near-miss that drops the tunnel and breaches the SLA."},{"re":"\\b(reload|write|erase|conf|configure)\\b","label":"a state-changing command","why":"Anything altering state violates the read-only rule."},{"re":"\\bdebug crypto\\b","label":"a debug command","why":"'debug crypto' floods the CPU on a live gateway — operationally risky on a signalling path."}]},"hint":"Same family as the SA table — filter it down to the transform lines; do not 'clear' anything.","explain":"'show crypto ipsec sa | include transform' prints the live transform (esp-3des) — clean proof, zero impact. The DANGEROUS near-miss 'clear crypto sa' would renegotiate (SLA breach) and could even re-select the weak proposal.","study":"'show crypto ipsec sa' output and why 'clear' verbs are forbidden on live tunnels."},{"id":"T1600-001-X10","type":"dnd","title":"Build the case board","summary":"Four artefacts into cause, effect, persistence, and constraint columns.","concepts":["device configuration logs","traffic analysis of negotiated ciphers","trusted image verification","IR evidence handling"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Executive case board template","kind":"text","text":"Columns requested by the CISO: CAUSE, EFFECT, PERSISTENCE, BUSINESS CONSTRAINT. Four artefacts must land in exactly one column each."}],"question":"Drag each artefact to its column.","zones":[{"name":"CAUSE","accepts":[0],"why":"The typed CLI change is the cause of the weakened crypto."},{"name":"EFFECT","accepts":[1],"why":"The negotiated 3DES in traffic is the observable effect."},{"name":"PERSISTENCE","accepts":[2],"why":"The image checksum drift shows the tampering survives reloads."},{"name":"BUSINESS CONSTRAINT","accepts":[3],"why":"The SLA card prices every containment and restore option."}],"bank":[{"t":"CLI 03:12 'encryption 3des' (svc-backup)","whyMiss":"A typed command is cause evidence — the act that changed the crypto."},{"t":"SPAN capture: SELECTED esp-3des at 03:14","whyMiss":"Traffic proof is the effect the cause produced."},{"t":"Image checksum drift from vendor value","whyMiss":"Image tampering is persistence — it survives reloads (T1601)."},{"t":"Signalling SLA: 15 min/month cap","whyMiss":"The SLA constrains decisions; it neither caused nor shows the tampering."}],"hint":"Ask of each artefact: did it act, is it observed, does it survive, or does it cost?","explain":"The four-column board is how senior analysts brief executives: cause, effect, persistence, constraint. Mis-filed artefacts produce wrong conclusions — e.g., calling the SLA 'evidence' confuses constraints with proof.","study":"Executive case boards: separating proof of act, proof of effect, persistence, and business constraints."},{"id":"T1600-001-X11","type":"fib","title":"Write the decision record","summary":"Two words finish the decision-record line.","concepts":["IR evidence handling","pre-position for decrypting captured traffic"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Decision record 26-0412-07","kind":"text","text":"Draft: 'The session source is kept alive while {b0} capture runs on core-sw-01, because the signalling SLA forbids unnecessary tunnel {b1}.'"}],"question":"Fill the two blanks in the decision record.","template":"The session source is kept alive while {b0} capture runs on core-sw-01, because the signalling SLA forbids unnecessary tunnel {b1}.","blanks":[{"accept":["passive"],"why":"Passive capture observes without touching the session — the whole point of keeping it alive.","whyMiss":"Active capture would interact with the attacker and defeat the purpose."},{"accept":["downtime","interruption","disruption"],"why":"The SLA caps downtime; that is the cost being avoided.","whyMiss":"The SLA governs tunnel availability, so the forbidden thing is downtime."}],"hint":"Blank one: the capture type that never sends a packet to the attacker. Blank two: what an SLA limits.","explain":"Decision records must name the mechanism (passive capture) and the protected quantity (tunnel uptime). This is the paper trail that justifies keeping a live attacker session for eight minutes.","study":"Decision records in IR: mechanism, constraint, and rationale on one line."},{"id":"T1600-001-X12","type":"order","title":"Sequence the evidence-first response","summary":"Five steps — each depends on the one before.","concepts":["IR evidence handling","management network segmentation","configuration backups","trusted image verification"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Response plan cards (shuffled)","kind":"text","text":"Cards: 'Announce capture window on the bridge' · 'Passive capture at core-sw-01 goes live' · 'Snapshot config, key files, and logs' · 'Quarantine the management plane' · 'Bring failover gateway online and restore'."}],"question":"Order the five steps of the evidence-first response.","sequence":["Announce the capture window on the bridge","Start passive capture at core-sw-01","Snapshot config, key-management files, and logs","Quarantine the management plane (OOB VLAN)","Bring the failover gateway online and restore"],"orderWhy":["Announce first — the bridge must know why the session stays alive.","Capture must exist before anything touches the device.","Snapshots complete the record while the device is still live.","Only now cut management access — zero impact on the tunnel.","Failover last: restore without SLA breach and without losing artefacts."],"hint":"Communication, observation, collection, containment, restoration — nothing touches the device before collection exists.","explain":"The sequence is dependency-driven: no step may destroy what a later step needs. Announcing first keeps the bridge aligned; restoring last preserves both evidence and SLA.","study":"Dependency-ordered IR playbooks for shared infrastructure."},{"id":"T1600-001-X13","type":"multi","title":"Costs worth accepting","summary":"Which two costly actions are actually justified in this case?","concepts":["unauthorized disclosure risk","configuration backups","management access control"],"perspective":"defender","tags":["trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Cost board","kind":"text","text":"Every option costs something. The CISO will only approve costs that buy a concrete risk reduction."}],"question":"Select the two actions whose real cost is justified by a concrete risk reduction.","options":[{"t":"Fail over to the standby gateway at 04:30 with the SLA intact","correct":true,"why":"Correct — the cost (short, planned cutover) buys removal of the weakened crypto from the live path."},{"t":"Rotate all IPsec keys and management credentials post-restore","correct":true,"why":"Correct — the cost (ops toil, brief re-auth storm) buys certainty the stolen credentials stop working."},{"t":"Keep the 3DES tunnel for a month to avoid any cutover","correct":false,"why":"The cost is weeks of crackable traffic — an unauthorised-disclosure risk bought for nothing."},{"t":"Erase the device flash tonight to 'clean' it","correct":false,"why":"Destroys the image artefact proving T1601 — cost with negative value."},{"t":"Buy a new chassis because the old one saw an incident","correct":false,"why":"Hardware replacement neither removes the credential risk nor preserves evidence — cost without reduction."}],"hint":"Justified cost = a named risk that goes away. Look for the two options that name one.","explain":"Failover removes the weak crypto; key rotation removes the stolen-credential risk. The rejected options either keep the exposure, destroy evidence, or spend money without reducing any named risk.","study":"Risk-based cost justification for incident response actions."},{"id":"T1600-001-X14","type":"triage","title":"Answering the CISO's four asks","summary":"Four executive demands — comply, gather first, or decline with rationale.","concepts":["IR evidence handling","pre-position for decrypting captured traffic","management network segmentation","correlation of config change + weaker ciphers"],"perspective":"defender","tags":["trap:escalate-or-gather","trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — CISO asks, 03:40","kind":"text","text":"1) 'Block the session IP now.' 2) 'Give me the confidence level for the exec brief.' 3) 'Post the attacker's TTPs to the company blog.' 4) 'Tell me if the trains are affected.'"}],"question":"Choose the best response to each ask.","rows":[{"alert":"'Block the session IP now'","detail":"Capture running for 22 minutes; snapshots complete.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"Capture and snapshots are complete — the session's evidentiary value is exhausted, so blocking now is safe and correct.","whyNot":{"1":"The evidence that needed the live session is already banked.","2":"Nothing to decline — the request is now cost-free to grant."}},{"alert":"'Give me the confidence level for the brief'","detail":"Cause, effect, and persistence artefacts are all banked.","options":["Comply now (HIGH)","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"Cause + effect + persistence = the analytic's high-confidence pattern; state it with the artefact list.","whyNot":{"1":"The three anchors are complete; delaying the brief adds nothing.","2":"Declining transparency about confidence is worse than stating it."}},{"alert":"'Post the attacker TTPs publicly tonight'","detail":"TTP analysis is partial; the infrastructure is still being mapped.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":1,"why":"Publishing partial TTPs can tip the attacker mid-response; finish the infrastructure mapping first.","whyNot":{"0":"Partial disclosure helps the attacker, not the community.","2":"It is not a refusal — it is sequencing: publish after containment."}},{"alert":"'Tell me if the trains are affected'","detail":"Tunnel stayed up; management plane was the only thing touched.","options":["Comply now (no service impact)","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"The data plane stayed up the whole time — answerable immediately from known facts.","whyNot":{"1":"You already have the uptime records; no gathering needed.","2":"Declining an answerable question erodes trust in the bridge."}}],"hint":"For each ask ask: is the evidence banked, is disclosure safe, and is the question answerable now?","explain":"Executive asks split into comply-now (evidence banked, answerable), gather-first (disclosure could tip the attacker), and never without rationale. Saying 'not yet, because…' to ask 3 is the professional answer.","study":"Managing executive expectations during active incidents: what to answer, delay, or refuse."},{"id":"T1600-001-X15","type":"fib","title":"Finish the persistence finding","summary":"Two words complete the report's key finding.","concepts":["trusted image verification","IR evidence handling","config integrity monitoring"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Report finding 3 (draft)","kind":"text","text":"Draft: 'The checksum drift proves image {b0}; therefore a simple reload would not remove the tampering, so all volatile evidence must be captured {b1} the device is touched.'"}],"question":"Fill the two blanks in the finding.","template":"The checksum drift proves image {b0}; a reload would not remove the tampering, so volatile evidence must be captured {b1} the device is touched.","blanks":[{"accept":["tampering","modification"],"why":"The drift is the fingerprint of image tampering — persistence by design.","whyMiss":"The checksum shows tampering/modification, not 'expiration' or 'rotation'."},{"accept":["before","prior to"],"why":"Volatile evidence dies at first touch — capture ordering is the finding's point.","whyMiss":"After touching the device, RAM-resident evidence is gone — the finding warns against exactly that."}],"hint":"Blank one: what a checksum drift is evidence of. Blank two: the ordering word that protects volatile evidence.","explain":"Finding: image tampering (T1601) means reload-resilience; therefore volatile capture must happen before any touch. One sentence, two words, and the whole response ordering follows from it.","study":"Turning artefact observations into findings that drive response ordering."}],"severityWord":"EXTREMELY HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}

function isLastGraded(){

function copyCmd(btn, txt){
