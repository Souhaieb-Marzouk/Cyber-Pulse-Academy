}

/* ----- terminal ----- */
function termNormalize(cmd) {
  return String(cmd).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[;]+$/, '');
}
function buildTerminal(ex) {
  var root = document.createElement('div');
  var sh = ex.shell;
  var lastCmd = '';
  if (ex.syntaxPanel) {
    var sp = document.createElement('div'); sp.className = 'synpanel'; sp.innerHTML = ex.syntaxPanel;
    root.appendChild(sp);
  }
  var term = document.createElement('div'); term.className = 'term';
  var banner = document.createElement('div'); banner.className = 'term-banner'; banner.textContent = sh.banner || '';
  var scroll = document.createElement('div'); term_scroll(scroll);
  function term_scroll(el) { el.className = 'term-scroll'; }
  var inline = document.createElement('div'); inline.className = 'term-in';
  var prompt = document.createElement('span'); prompt.className = 'term-prompt'; prompt.textContent = sh.prompt + ' ';
  var input = document.createElement('input');
  input.type = 'text'; input.setAttribute('aria-label', 'Type your command'); input.autocomplete = 'off'; input.spellcheck = false;
  var runBtn = document.createElement('button'); runBtn.className = 'btn'; runBtn.textContent = 'Run ⏎';
  inline.appendChild(prompt); inline.appendChild(input); inline.appendChild(runBtn);
  term.appendChild(banner); term.appendChild(scroll); term.appendChild(inline);
  root.appendChild(term);
  function run() {
    var cmd = input.value;
    if (!cmd.trim()) return;
    lastCmd = cmd;
    var n = termNormalize(cmd);
    var echo = document.createElement('pre'); echo.textContent = sh.prompt + ' ' + cmd;
    scroll.appendChild(echo);
    var out = simulate(ex, n);
    var op = document.createElement('pre'); op.textContent = out;
    scroll.appendChild(op);
    input.value = '';
    scroll.scrollTop = scroll.scrollHeight;
    api.onChange();
  }
  runBtn.addEventListener('click', run);
  input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); run(); } });
  function simulate(exx, n) {
    if (!n) return '';
    var tool = n.split(' ')[0];
    var tools = (sh.tools || []).map(function (x) { return String(x).toLowerCase(); });
    if (tools.indexOf(tool) === -1) return tool + ': command not found';
    var all = (exx.expected || []).every(function (e) { return new RegExp(e.re).test(n); });
    if (all) return sh.output || 'command completed';
    var wrongHit = (exx.wrong || []).some(function (w) { return new RegExp(w.re).test(n); });
    if (wrongHit) return sh.dangerOutput || 'operation completed. WARNING: this command changed system state.';
    return sh.usageError || 'Incorrect syntax — check the tool options and try again.';
  }
  var api = {
    el: root,
    getAnswer: function () { var cmd = lastCmd || input.value; return { ready: !!termNormalize(cmd), value: termNormalize(cmd) }; },
    lock: function () { input.disabled = true; runBtn.disabled = true; },
    onChange: function () {}
  };
  return api;
}

/* ----- triage ----- */
function buildTriage(ex) {
  var root = document.createElement('div');
  var sel = {};
  var table = document.createElement('table'); table.className = 'triage-table';
  var html = '<thead><tr><th>Alert</th><th>Your triage decision</th></tr></thead><tbody>';
  ex.alerts.forEach(function (a, ai) {
    html += '<tr><td><span class="alert-id">' + esc(a.id) + '</span><br>' + esc(a.text) +
      (a.meta ? '<br><span class="alert-meta">' + esc(a.meta) + '</span>' : '') + '</td><td><div class="triage-actions" data-alert="' + ai + '">';
    a.options.forEach(function (o, oi) {
      html += '<button class="tact" type="button" data-a="' + ai + '" data-o="' + oi + '">' + esc(o.t) + '</button>';
    });
    html += '</div></td></tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
  root.appendChild(table);
  Array.prototype.forEach.call(root.querySelectorAll('.tact'), function (b) {
    b.addEventListener('click', function () {
      var ai = b.getAttribute('data-a'), oi = parseInt(b.getAttribute('data-o'), 10);
      sel[ai] = oi;
      Array.prototype.forEach.call(root.querySelectorAll('[data-alert="' + ai + '"] .tact'), function (x) { x.classList.remove('picked'); });
      b.classList.add('picked');
      api.onChange();
    });
  });
  var api = {
    el: root,
    getAnswer: function () {
      var ready = true;
      for (var i = 0; i < ex.alerts.length; i++) if (sel[i] === undefined) ready = false;
      return { ready: ready, value: { sel: sel } };
    },
    lock: function () {
      Array.prototype.forEach.call(root.querySelectorAll('.tact'), function (b) {
        b.disabled = true;
        var ai = parseInt(b.getAttribute('data-a'), 10), oi = parseInt(b.getAttribute('data-o'), 10);
        if (ex.alerts[ai].options[oi].c) b.classList.add('done-ok');
        else if (sel[ai] === oi) b.classList.add('done-bad');
      });
    },
    onChange: function () {}
  };
  return api;
}

/* ----- branching scenario ----- */
function buildBranch(ex) {
  var root = document.createElement('div');
  var step = 0;
  var sel = {};
  var LETTERS = ['A', 'B', 'C', 'D', 'E'];
  var badge = document.createElement('div'); badge.className = 'step-badge';
  var optsBox = document.createElement('div'); optsBox.className = 'opts';
  var btnRow = document.createElement('div'); btnRow.className = 'actions';
  var confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary'; confirmBtn.textContent = 'Confirm & continue ▸';
  btnRow.appendChild(confirmBtn);
  root.appendChild(badge); root.appendChild(optsBox); root.appendChild(btnRow);
  function renderStep() {
    if (step >= ex.steps.length) {
      badge.textContent = '✓ All ' + ex.steps.length + ' steps answered — press Check to see your result';
      optsBox.innerHTML = '<p class="widget-hintline">All steps answered.</p>';
      confirmBtn.disabled = true;
      return;
    }
    var st = ex.steps[step];
    badge.textContent = 'STEP ' + (step + 1) + ' OF ' + ex.steps.length;
    optsBox.innerHTML = '';
    st.options.forEach(function (o, oi) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt' + (sel[step] === oi ? ' sel' : '');
      b.innerHTML = '<span class="optkey">' + LETTERS[oi] + '.</span><span class="opttext">' + esc(o.t) + '</span>' +
        '<span class="selmark" aria-hidden="true">' + (sel[step] === oi ? '● Selected' : '') + '</span>';
      b.addEventListener('click', function () {
        sel[step] = oi;
        confirmBtn.disabled = false;
        Array.prototype.forEach.call(optsBox.querySelectorAll('.opt'), function (x) { x.classList.remove('sel'); var sm = x.querySelector('.selmark'); if (sm) sm.textContent = ''; });
        b.classList.add('sel');
        b.querySelector('.selmark').textContent = '● Selected';
        api.onChange();
      });
      optsBox.appendChild(b);
    });
    confirmBtn.textContent = step === ex.steps.length - 1 ? 'Confirm final step — then press Check' : 'Confirm & continue ▸';
    if (sel[step] === undefined) confirmBtn.disabled = true; else confirmBtn.disabled = false;
  }
  confirmBtn.addEventListener('click', function () {
    if (sel[step] === undefined) return;
    var st = ex.steps[step];
    if (st.add) {
      var slot = document.getElementById('scen-body');
      if (slot) {
        var art = document.createElement('div'); art.className = 'artefact';
        art.innerHTML = '<span class="artefact-label">DEVELOPMENT ' + (step + 1) + '</span><div class="artefact-body"><p>' + esc(st.add) + '</p></div>';
        slot.appendChild(art);
      }
    }
    step++;
    renderStep();
    api.onChange();
  });
  renderStep();
  var api = {
    el: root,
    getAnswer: function () {
      var ready = ex.steps.every(function (s, i) { return sel[i] !== undefined; });
      return { ready: ready, value: { sel: sel } };
    },
    lock: function () { Array.prototype.forEach.call(root.querySelectorAll('button'), function (b) { b.disabled = true; }); },
    onChange: function () {}
  };
  return api;
}

/* ----- spot the mistake ----- */
function buildSpot(ex) {
  var root = document.createElement('div');
  var sel = [];
  var note = document.createElement('p'); note.className = 'widget-hintline';
  note.textContent = ex.spotNote || 'Click every line you believe is the problem. Click again to unselect.';
  var box = document.createElement('div'); box.className = 'linesel';
  ex.lines.forEach(function (ln, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'linerow'; b.setAttribute('data-line', i);
    b.innerHTML = '<span class="no">' + (i + 1) + '</span><code>' + esc(ln) + '</code>';
    b.addEventListener('click', function () {
      var k = sel.indexOf(i);
      if (k > -1) { sel.splice(k, 1); b.classList.remove('sel'); }
      else { sel.push(i); b.classList.add('sel'); }
      api.onChange();
    });
    box.appendChild(b);
  });
  root.appendChild(note); root.appendChild(box);
  var api = {
    el: root,
    getAnswer: function () { return { ready: sel.length > 0, value: sel.slice() }; },
    lock: function () {
      Array.prototype.forEach.call(root.querySelectorAll('.linerow'), function (b) {
        b.disabled = true;
        var i = parseInt(b.getAttribute('data-line'), 10);
        if (ex.bad.indexOf(i) > -1) b.classList.add(ex.bad.indexOf(i) > -1 && sel.indexOf(i) > -1 ? 'done-ok' : 'done-miss');
        else if (sel.indexOf(i) > -1) b.classList.add('done-bad');
      });
    },
    onChange: function () {}
  };
  return api;
}

/* ============ GRADING ============ */
function row(st, t) { return { st: st, ic: st === 'ok' ? '✓' : st === 'bad' ? '✗' : '○', t: t }; }
function grade(ex, val) {
  var t = ex.type;
  if (t === 'logview') return grade(ex.answer, val);
  if (t === 'mcq' || t === 'multi') return gradeChoice(ex, val, t === 'multi');
  if (t === 'match') return gradeMatch(ex, val);
  if (t === 'order' || t === 'rank') return gradeOrder(ex, val);
  if (t === 'categorize') return gradeCategorize(ex, val);
  if (t === 'fill') return gradeFill(ex, val);
  if (t === 'terminal') return gradeTerminal(ex, val);
  if (t === 'triage') return gradeTriage(ex, val);
  if (t === 'branch') return gradeBranch(ex, val);
  if (t === 'spot') return gradeSpot(ex, val);
  return { credit: 0, total: 1, hGot: 0, hBad: 0, hMiss: 0, rows: [row('bad', 'Grading not available for this type.')] };
}
function gradeChoice(ex, val, multi) {
  var correct = ex.options.filter(function (o) { return o.c; });
  if (!multi) {
    var pickedOpt = ex.options[val[0]];
    var isOk = pickedOpt && pickedOpt.c;
    var correctText = correct[0] ? correct[0].t : '';
    return {
      credit: isOk ? 1 : 0, total: 1, hGot: isOk ? 1 : 0, hBad: isOk ? 0 : 1, hMiss: 0,
      rows: [isOk ? row('ok', 'You selected: “' + pickedOpt.t + '” — that is the correct answer.')
                 : row('bad', 'You selected: “' + (pickedOpt ? pickedOpt.t : 'nothing') + '”. The correct answer is: “' + correctText + '”.')]
    };
  }
  var N = correct.length, H = 0, W = 0, rows = [];
  ex.options.forEach(function (o, oi) {
    var picked = val.indexOf(oi) > -1;
    if (o.c && picked) { H++; rows.push(row('ok', '“' + o.t + '” — you selected it, and it belongs in the answer.')); }
    else if (o.c && !picked) { rows.push(row('miss', '“' + o.t + '” — you missed this one. It belongs in the answer.' + (o.why ? ' Why: ' + o.why : ''))); }
    else if (!o.c && picked) { W++; rows.push(row('bad', '“' + o.t + '” — you selected it, but it does not belong.' + (o.why ? ' Why not: ' + o.why : ''))); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeMatch(ex, val) {
  var N = ex.left.length, H = 0, W = 0, rows = [];
  ex.left.forEach(function (ltxt, li) {
    var correctR = null;
    ex.pairs.forEach(function (p) { if (p[0] === li) correctR = p[1]; });
    var userP = null;
    val.forEach(function (p) { if (p[0] === li) userP = p[1]; });
    if (userP === null) { rows.push(row('miss', '“' + ltxt + '” — you left this item without a pair. Correct partner: “' + ex.right[correctR] + '”.')); }
    else if (userP === correctR) { H++; rows.push(row('ok', '“' + ltxt + '” → “' + ex.right[correctR] + '” — correct pair.')); }
    else { W++; rows.push(row('bad', '“' + ltxt + '” → “' + ex.right[userP] + '” is wrong. Correct partner: “' + ex.right[correctR] + '”.')); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeOrder(ex, val) {
  var N = ex.items.length, H = 0, W = 0, rows = [];
  val.forEach(function (oi, pos) {
    if (oi === pos) { H++; rows.push(row('ok', 'Position ' + (pos + 1) + ': “' + ex.items[oi] + '” — correct place.')); }
    else { W++; rows.push(row('bad', 'Position ' + (pos + 1) + ': you put “' + ex.items[oi] + '”, but this is where “' + ex.items[pos] + '” belongs.')); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeCategorize(ex, val) {
  var assign = val.assign || {};
  var N = ex.items.length, H = 0, W = 0, rows = [];
  ex.items.forEach(function (txt, i) {
    var correctCat = -1;
    ex.categories.forEach(function (c, ci) { if (c.members.indexOf(i) > -1) correctCat = ci; });
    var userCat = assign[i];
    if (userCat === undefined || userCat === null) { rows.push(row('miss', '“' + txt + '” — you left it unsorted. It belongs in “' + ex.categories[correctCat].name + '”.')); }
    else if (userCat === correctCat) { H++; rows.push(row('ok', '“' + txt + '” — correctly placed in “' + ex.categories[correctCat].name + '”.')); }
    else { W++; rows.push(row('bad', '“' + txt + '” — you put it in “' + ex.categories[userCat].name + '”, but it belongs in “' + ex.categories[correctCat].name + '”.')); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeFill(ex, val) {
  var placed = val.placed || {};
  var N = ex.answers.length, H = 0, W = 0, rows = [];
  for (var b = 1; b <= N; b++) {
    var wi = placed[b];
    var userWord = wi !== undefined ? ex.bank[wi] : null;
    var ans = ex.answers[b - 1];
    if (userWord === null) rows.push(row('miss', 'Blank ' + b + ' — left empty. Correct word: “' + ans + '”.'));
    else if (userWord === ans) { H++; rows.push(row('ok', 'Blank ' + b + ': “' + userWord + '” — correct.')); }
    else { W++; rows.push(row('bad', 'Blank ' + b + ': you wrote “' + userWord + '”, but the correct word is “' + ans + '”.')); }
  }
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeTerminal(ex, cmd) {
  var N = (ex.expected || []).length, H = 0, W = 0, rows = [];
  (ex.expected || []).forEach(function (e) {
    var re = new RegExp(e.re);
    if (re.test(cmd)) { H++; rows.push(row('ok', 'Command element present: ' + e.label + '.')); }
    else rows.push(row('miss', 'Missing element: ' + e.label + '.'));
  });
  var dangerHit = false;
  (ex.wrong || []).forEach(function (w) {
    var re = new RegExp(w.re);
    if (re.test(cmd)) {
      W++;
      if (w.danger) dangerHit = true;
      rows.push(row('bad', 'Problem element found: ' + w.label + (w.danger ? ' — ⚠ DANGEROUS — NEAR MISS: this command would work but would change or destroy state.' : '')));
    }
  });
  var extra = '<div class="study" style="border-color:var(--accent-blue)"><b>Canonical command:</b>' + copyBtnHtml(ex.canonical) +
    '<div style="margin-top:8px">' + (ex.parts || []).map(function (p) { return '<div>• ' + esc(p) + '</div>'; }).join('') + '</div></div>';
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows, extra: extra, dangerHit: dangerHit };
}
function gradeTriage(ex, val) {
  var sel = val.sel || {};
  var N = ex.alerts.length, H = 0, W = 0, rows = [];
  ex.alerts.forEach(function (a, ai) {
    var correctOi = -1;
    a.options.forEach(function (o, oi) { if (o.c) correctOi = oi; });
    var userOi = sel[ai];
    if (userOi === undefined) rows.push(row('miss', a.id + ' — you left this alert without a decision. Correct action: “' + a.options[correctOi].t + '”.'));
    else if (userOi === correctOi) { H++; rows.push(row('ok', a.id + ' — “' + a.options[userOi].t + '” is the right call.')); }
    else { W++; rows.push(row('bad', a.id + ' — you chose “' + a.options[userOi].t + '”, but the right call is “' + a.options[correctOi].t + '”.' + (a.options[correctOi].why ? ' Why: ' + a.options[correctOi].why : ''))); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeBranch(ex, val) {
  var sel = val.sel || {};
  var N = ex.steps.length, H = 0, W = 0, rows = [];
  ex.steps.forEach(function (s, i) {
    var correctOi = -1;
    s.options.forEach(function (o, oi) { if (o.c) correctOi = oi; });
    var userOi = sel[i];
    if (userOi === undefined) rows.push(row('miss', 'Step ' + (i + 1) + ' — no choice recorded. Correct: “' + s.options[correctOi].t + '”.'));
    else if (userOi === correctOi) { H++; rows.push(row('ok', 'Step ' + (i + 1) + ': “' + s.options[userOi].t + '” — good decision.')); }
    else { W++; rows.push(row('bad', 'Step ' + (i + 1) + ': you chose “' + s.options[userOi].t + '”. Correct: “' + s.options[correctOi].t + '”.' + (s.options[correctOi].why ? ' Why: ' + s.options[correctOi].why : ''))); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}
function gradeSpot(ex, val) {
  var N = ex.bad.length, H = 0, W = 0, rows = [];
  ex.bad.forEach(function (li) {
    if (val.indexOf(li) > -1) { H++; rows.push(row('ok', 'Line ' + (li + 1) + ' — you found it: “' + ex.lines[li] + '”.')); }
    else rows.push(row('miss', 'Line ' + (li + 1) + ' — you missed it: “' + ex.lines[li] + '”. This line is the problem.'));
  });
  val.forEach(function (li) {
    if (ex.bad.indexOf(li) === -1) { W++; rows.push(row('bad', 'Line ' + (li + 1) + ' — “' + ex.lines[li] + '” is not the problem; this line is normal.')); }
  });
  return { credit: scoreExercise(H, W, N), total: N, hGot: H, hBad: W, hMiss: N - H, rows: rows };
}

</script>
<script>
/* ============ CyberPulse exam engine — core (state, timer FSM, flow) ============ */
'use strict';
var M = (function () {
  var el = document.getElementById('cm-exercise-meta');
  try { return JSON.parse(el.textContent); } catch (e) { return {}; }
})();
var D = window.EXAM_DATA || { exercises: [] };
var EXS = D.exercises || [];
var USERNAME = '';

/* ---------- tiny utils ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function shuffle(a) {
  var r = a.slice();
  for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function fmtClock(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), sec = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}
function fmtDur(s) { s = Math.round(s); var m = Math.floor(s / 60), sec = s % 60; return m + 'm ' + (sec < 10 ? '0' : '') + sec + 's'; }
function sevClass() {
  var d = (M.difficulty || 'easy');
  return d === 'extremely-hard' ? 'sev-extreme' : 'sev-' + d;
}
function sevWord() {
  var d = (M.difficulty || 'easy');
  if (d === 'easy') return 'EASY';
  if (d === 'medium') return 'MEDIUM';
  if (d === 'hard') return 'HARD';
  return 'EXTREMELY HARD';
}

/* ---------- session state ---------- */
var S = null, widget = null, reviewMode = false, reported = false, timer = null;
var TYPE_LABEL = {
  mcq: 'multiple choice', multi: 'multi-select', match: 'matching pairs', order: 'timeline ordering',
  rank: 'priority ranking', categorize: 'drag & drop sorting', fill: 'fill in the blanks',
  logview: 'log analysis', terminal: 'terminal command', triage: 'alert triage',
  branch: 'branching scenario', spot: 'spot the mistake'
};

function newState() {
  var order = [];
  for (var i = 0; i < EXS.length; i++) order.push(i);
  order = shuffle(order);
  /* keep terminal exercises apart (best effort) */
  var termPos = [];
  for (var k = 0; k < order.length; k++) if (EXS[order[k]].type === 'terminal') termPos.push(k);
  if (termPos.length > 1) {
    var mid = Math.floor(order.length / 2);
    var j = mid;
    while (Math.abs(j - termPos[0]) < 2 && j < order.length - 1) j++;
    var tmp = order[termPos[1]]; order[termPos[1]] = order[j]; order[j] = tmp;
  }
  return {
    order: order, pos: 0,
    status: EXS.map(function () { return 'pending'; }),
    credits: EXS.map(function () { return null; }),
    hintUsed: EXS.map(function () { return false; }),
    sum: 0, answered: 0,
    pausedManualSec: 0, pausedAutoSec: 0, startedAt: Date.now()
  };
}
function cur() { return S.order[S.pos]; }
function pendingList() {
  var out = [];
  for (var k = 0; k < S.order.length; k++) { var i = S.order[k]; if (S.status[i] === 'pending') out.push(i); }
  return out;
}
function skippedList() {
  var out = [];
  for (var k = 0; k < S.order.length; k++) { var i = S.order[k]; if (S.status[i] === 'skipped') out.push(i); }
  return out;
}
function scoreExercise(H, W, N) { return Math.max(0, (H - W) / N); }

/* ---------- timer state machine ----------
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
function makeTimer(budgetSec) {
  var t = {
    state: 'IDLE', remaining: budgetSec, budget: budgetSec,
    prevBeforeManual: 'RUNNING', _int: null, _lastTs: 0, _enterTs: 0, onTimeout: function () {},
    _setState: function (s) {
      if (t.state === s) return;
      var now = Date.now();
      if (S) {
        if (t.state === 'PAUSED_MANUAL') S.pausedManualSec += (now - t._enterTs) / 1000;
        if (t.state === 'PAUSED_AUTO_CHECK') S.pausedAutoSec += (now - t._enterTs) / 1000;
      }
      t._enterTs = now; t._lastTs = now; t.state = s; renderHeader();
    },
    tick: function () {
      if (t.state !== 'RUNNING') return;
      var now = Date.now(); var dt = (now - t._lastTs) / 1000; t._lastTs = now;
      t.remaining -= dt;
      if (t.remaining <= 0) { t.remaining = 0; t._setState('ENDED'); t.onTimeout(); return; }
      renderHeader();
    },
    start: function () { t._lastTs = Date.now(); t._enterTs = Date.now(); t._setState('RUNNING'); if (t._int) clearInterval(t._int); t._int = setInterval(t.tick, 250); },
    stop: function () { if (t._int) { clearInterval(t._int); t._int = null; } },
    pauseAuto: function () { if (t.state === 'RUNNING') t._setState('PAUSED_AUTO_CHECK'); },
    resumeAuto: function () { if (t.state === 'PAUSED_AUTO_CHECK') t._setState('RUNNING'); },
    pauseManual: function () { if (t.state === 'RUNNING' || t.state === 'PAUSED_AUTO_CHECK') { t.prevBeforeManual = t.state; t._setState('PAUSED_MANUAL'); } },
    resumeManual: function () {
      if (t.state !== 'PAUSED_MANUAL') return;
      if (t.prevBeforeManual === 'PAUSED_AUTO_CHECK') t._setState('PAUSED_AUTO_CHECK'); else t._setState('RUNNING');
    }
  };
  return t;
}

/* ---------- header ---------- */
function renderHeader() {
  if (!S) return;
  var i = cur();
  $('h-count').textContent = 'Exercise ' + (S.pos + 1) + ' of ' + EXS.length;
  $('h-sev').textContent = '◆ ' + sevWord();
  $('h-sev').className = 'sev-badge ' + sevClass();
  $('h-timer').textContent = fmtClock(timer.remaining);
  var ts = $('h-tstate');
  if (timer.state === 'RUNNING') { ts.textContent = '▶ RUNNING'; ts.className = 'tstate ok'; }
  else if (timer.state === 'PAUSED_MANUAL') { ts.textContent = '⏸ PAUSED — manual (press Resume)'; ts.className = 'tstate paused'; }
  else if (timer.state === 'PAUSED_AUTO_CHECK') { ts.textContent = '⏳ PAUSED — reviewing feedback (resumes on Next)'; ts.className = 'tstate paused'; }
  else { ts.textContent = '⏹ ENDED'; ts.className = 'tstate ended'; }
  var answered = 0;
  for (var k = 0; k < EXS.length; k++) if (S.status[k] === 'checked') answered++;
  $('h-score').innerHTML = 'Score <b>' + S.sum.toFixed(1) + '</b> / ' + answered +
    ' (' + (answered ? Math.round((S.sum / answered) * 100) + '%' : '—') + ')';
  $('btn-pause').textContent = timer.state === 'PAUSED_MANUAL' ? '▶ Resume' : '⏸ Pause';
  $('btn-hint').disabled = !EXS[i] || S.hintUsed[i] || S.status[i] !== 'pending';
  $('btn-skip').disabled = !EXS[i] || S.status[i] !== 'pending';
  var sk = skippedList().length;
  $('h-skips').textContent = sk ? '⚠ Skipped: ' + sk : '';
  var done = 0;
  for (var k2 = 0; k2 < EXS.length; k2++) if (S.status[k2] !== 'pending') done++;
  $('progress-fill').style.width = Math.round((done / EXS.length) * 100) + '%';
}

/* ---------- exercise rendering ---------- */
function buildAndShow(i, review) {
  reviewMode = !!review;
  widget = buildWidget(EXS[i]);
  var ex = EXS[i];
  var longScen = scenarioLen(ex) > 700;
  var partsHtml = scenarioHtml(ex);

      '<section class="blk blk-q"><header class="blk-head">❓ QUESTION</header>' +

      '</section>' +
      '<div id="fb-slot"></div>' +
    '</article>';

  if (longScen) {

function scenarioLen(ex) {
  var n = 0;
  (ex.scenario || []).forEach(function (p) { n += (p.p ? p.p.length : 0) + (p.code ? p.code.length : 0); });

}
function scenarioHtml(ex) {
  var out = '';
  (ex.scenario || []).forEach(function (p) {

      out += p.label ? '<div class="artefact"><span class="artefact-label">' + esc(p.label) + '</span><div class="artefact-body">' +

    } else if (p.code != null) {

/* ---------- flow: check / next / skip / hint / pause ---------- */
function onCheck() {
  var i = cur();
  if (!S || S.status[i] !== 'pending') return;
  var ans = widget.getAnswer();
  if (!ans.ready) { $('answer-need').hidden = false; return; }
  $('answer-need').hidden = true;
  var g = grade(EXS[i], ans.value);
  var credit = g.credit;
  if (S.hintUsed[i]) credit = Math.max(0, credit - 0.10);
  S.credits[i] = credit; S.status[i] = 'checked'; S.sum += credit;
  widget.lock();
  $('btn-check').disabled = true;
  timer.pauseAuto();           /* Check-triggered auto-pause: timer stops until Next */
  renderFeedback(i, g, credit);
  renderHeader();
  window.scrollTo(0, 0);
}
function renderFeedback(i, g, credit) {
  var ex = EXS[i];
  var cls, label, icon;
  if (g.dangerHit) { cls = 'fb-bad'; label = '⚠ DANGEROUS — NEAR MISS'; icon = '⚠'; }
  else if (credit >= 1) { cls = 'fb-ok'; label = 'CORRECT'; icon = '✓'; }
  else if (credit > 0) { cls = 'fb-part'; label = 'PARTIALLY CORRECT'; icon = '✓'; }
  else { cls = 'fb-bad'; label = 'INCORRECT'; icon = '✗'; }
  var creditLine = '<p class="fb-credit">Credit ' + credit.toFixed(2);
  if (g.total > 1) {
    creditLine += ' — ' + g.hGot + '/' + g.total + ' items correct' +
      (g.hBad ? ', ' + g.hBad + ' wrong' : '') + (g.hMiss ? ', ' + g.hMiss + ' missed' : '');
  }
  if (S.hintUsed[i]) creditLine += ' (includes the −0.10 hint cost)';
  creditLine += '</p>';
  var rows = (g.rows || []).map(function (r) {
    return '<div class="fbrow ' + r.st + '"><span class="ic">' + r.ic + ' ' + (r.st === 'ok' ? 'Correct' : r.st === 'bad' ? 'Wrong' : 'Missed') + '</span><span class="t">' + r.t + '</span></div>';
  }).join('');
  var study = (credit < 1 && ex.study) ? '<div class="study"><b>What to study:</b> ' + esc(ex.study) + '</div>' : '';
  var remainPending = pendingList().length > 0;
  var nextLabel;
  if (reviewMode) nextLabel = 'Back to review ▸';
  else if (remainPending) nextLabel = 'Next exercise ▸';
  else if (skippedList().length) nextLabel = 'Review skipped (' + skippedList().length + ') ▸';
  else nextLabel = 'Final Submit';
  $('fb-slot').innerHTML =
    '<section class="fb ' + cls + '"><header class="fb-head">' + icon + ' ' + label + '</header><div class="fb-body">' +
    creditLine + '<div class="fb-rows">' + rows + '</div>' +
    '<p class="expl">' + esc(ex.explanation) + '</p>' + (g.extra || '') + study +
    '<div class="nextrow"><button id="btn-next" class="btn btn-primary">' + nextLabel + '</button>' +
    (timer.state === 'PAUSED_AUTO_CHECK' ? '<span class="small">⏳ Timer paused while you read this — it resumes when you press Next.</span>' : '') +
    '</div></div></section>';
  $('btn-next').addEventListener('click', onNext);
}
function onNext() {
  timer.resumeAuto();
  if (reviewMode) {
    /* unanswered review exercise goes back to the skipped pool */
    var ci = cur();
    if (S.status[ci] === 'pending') S.status[ci] = 'skipped';
    openReview();
    renderHeader();
    return;
  }
  var pend = pendingList();
  if (pend.length) {
    var nxt = pend[0];
    S.pos = S.order.indexOf(nxt);
    buildAndShow(nxt, false);
  } else if (skippedList().length) {
    openReview();
  } else {
    finish();
  }
  renderHeader();
}
function onSkip() {
  var i = cur();
  if (!S || S.status[i] !== 'pending') return;
  S.status[i] = 'skipped';
  var pend = pendingList();
  if (pend.length) {
    var nxt = pend[0];
    S.pos = S.order.indexOf(nxt);
    buildAndShow(nxt, false);
  } else if (skippedList().length) {
    openReview();
  } else {
    finish();
  }
  renderHeader();
}
function onHint() {
  var i = cur();
  if (!S || S.hintUsed[i] || S.status[i] !== 'pending') return;
  S.hintUsed[i] = true;
  $('hint-slot').innerHTML = '<div class="hint-panel" role="note"><b>💡 Hint</b> (costs 10% of this exercise\'s credit): ' + esc(EXS[i].hint) + '</div>';
  $('btn-hint').disabled = true;
}
function onPause() {
  if (timer.state === 'PAUSED_MANUAL') {
    timer.resumeManual();
    $('pause-overlay').hidden = true;
    $('exercise-root').style.visibility = '';
  } else if (timer.state === 'RUNNING' || timer.state === 'PAUSED_AUTO_CHECK') {
    timer.pauseManual();
    $('pause-overlay').hidden = false;
    $('exercise-root').style.visibility = 'hidden';
  }
  renderHeader();
}

/* ---------- review skipped ---------- */
function openReview() {
  timer.resumeAuto(); /* reviewing screen = timer running again */
  var list = skippedList();
  var items = list.map(function (i) {
    return '<div class="rv-item"><span class="skip-badge">⚠ Skipped</span>' +
      '<span class="sum">' + esc(EXS[i].summary || EXS[i].question) + '</span>' +
      '<button class="btn" data-rv="' + i + '">Answer now</button></div>';
  }).join('');
  $('view-review').innerHTML =
    '<section class="card intro-sec"><h2>⚠ Review skipped exercises (' + list.length + ')</h2>' +
    '<p class="muted">The timer is still running. You can answer skipped exercises as many times as you like until the timer ends. ' +
    'If you submit now, every exercise left unanswered is <b>excluded from your score</b> (it does not count for or against you).</p>' +
    (items || '<p class="muted">No skipped exercises remain.</p>') +
    '<div class="startbar"><button id="btn-finish" class="btn btn-primary">🏁 Submit the exam now</button>' +
    (list.length ? '<button id="btn-backfirst" class="btn btn-ghost">◂ Go to next unanswered exercise</button>' : '') + '</div></section>';
  showView('view-review');
  Array.prototype.forEach.call(document.querySelectorAll('[data-rv]'), function (b) {
    b.addEventListener('click', function () {
      var i = parseInt(b.getAttribute('data-rv'), 10);
      S.pos = S.order.indexOf(i);
      S.status[i] = 'pending'; /* answerable again while under review */
      showView('view-exam');
      buildAndShow(i, true);
    });
  });
  var bf = $('btn-backfirst');
  if (bf) bf.addEventListener('click', function () {
    var pend = pendingList();
    if (pend.length) { S.pos = S.order.indexOf(pend[0]); showView('view-exam'); buildAndShow(pend[0], false); }
    else if (skippedList().length) openReview(); else finish();
  });
  $('btn-finish').addEventListener('click', finish);
  renderHeader();
}

/* ---------- finish & report ---------- */
function finish() {
  if (!S) return;
  timer.stop();
  timer._setState('ENDED');
  var answered = 0, full = 0, part = 0, partSum = 0, zero = 0, skip = 0;
  for (var k = 0; k < EXS.length; k++) {
    if (S.status[k] === 'checked') {
      answered++;
      var c = S.credits[k];
      if (c >= 1) full++; else if (c > 0) { part++; partSum += c; } else zero++;
    } else if (S.status[k] === 'skipped') skip++;
  }
  var percent = answered ? Math.round((S.sum / answered) * 100) : 0;
  var passed = percent >= (M.passMark || 70);
  var used = timer.budget - timer.remaining;
  var breakdown =
    '<div class="stat-grid">' +
    '<div class="stat c-ok"><div class="n">' + full + '</div><div class="l">✓ Fully correct</div></div>' +
    '<div class="stat c-part"><div class="n">' + part + '</div><div class="l">✓ Partially correct' + (part ? ' — avg ' + (partSum / part).toFixed(2) : '') + '</div></div>' +
    '<div class="stat c-bad"><div class="n">' + zero + '</div><div class="l">✗ Fully incorrect</div></div>' +
    '<div class="stat c-skip"><div class="n">' + skip + '</div><div class="l">⚠ Skipped — excluded</div></div>' +
    '</div>';
  var panel = passed
    ? '<div class="pass-panel"><div class="big">✓ PASS</div><p>Congratulations — you reached ' + percent + '%, above the ' + (M.passMark || 70) + '% pass mark. You mastered this practice exam.</p></div>'
    : '<div class="fail-panel"><div class="big">✗ FAIL</div><p>You reached ' + percent + '%, below the ' + (M.passMark || 70) + '% pass mark. You must retake this exam. Read the feedback you collected, then try again.</p></div>';
  $('view-results').innerHTML =
    '<section class="card result-head"><div class="pct">' + percent + '%</div>' +
    '<div class="sub">Final score <b>' + S.sum.toFixed(1) + '</b> over <b>' + answered + '</b> answered exercise' + (answered === 1 ? '' : 's') +
    ' (skipped-and-never-answered exercises are excluded from both the points and the total).</div>' +
    panel + breakdown +
    '<div class="time-stats">⏱ Time used: ' + fmtDur(used) + ' of ' + fmtDur(timer.budget) +
    ' · ⏸ Manual pause: ' + fmtDur(S.pausedManualSec) +
    ' · 💭 Feedback review time: ' + fmtDur(S.pausedAutoSec) + '</div>' +
    '<div class="startbar" style="justify-content:center"><button id="btn-retake" class="btn btn-primary startbtn">↻ Retake exam</button></div>' +
    '</section>';
  showView('view-results');
  $('btn-retake').addEventListener('click', startAttempt);
  if (!reported) {
    reported = true;
    reportScore(S.sum, answered);
  }
}
function reportScore(creditSum, answeredCount) {
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  /* Opened directly (file://), parent === window: self-posting only produces a
     console warning, so report nothing — the exam works either way. */
  if (window.parent === window) return;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: M.topicId,
      batch: M.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= (M.passMark || 70)
    }, location.origin);
  } catch (e) {
    /* Opened inside a cross-origin frame rather than the site. Nothing to report to. */
  }
}
function onTimeout() {
  /* timer hit zero: everything still pending counts as skipped-and-unanswered */
  for (var k = 0; k < EXS.length; k++) if (S.status[k] === 'pending') S.status[k] = 'skipped';
  finish();
}

/* ---------- attempt start & retake ---------- */
function startAttempt() {
  S = newState();
  reported = false; reviewMode = false;
  timer = makeTimer((M.estimatedMinutes || 30) * 60);
  timer.onTimeout = onTimeout;
  showView('view-exam');
  buildAndShow(S.order[0], false);
  timer.start();
  renderHeader();
}

/* ---------- handshake (accept both init types; dark-only, theme ignored) ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  /* event.data.username, country, theme ('dark' — file is dark-only, no toggle), locale, topicId, batch */
  try {
    if (event.data.username) {
      USERNAME = String(event.data.username);
      var c = $('h-user');
      if (c) { c.hidden = false; c.textContent = '👤 ' + USERNAME; }
    }
  } catch (e) { /* ignore */ }
});

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', function () {
  renderIntro();
  $('btn-pause').addEventListener('click', onPause);
  $('btn-hint').addEventListener('click', onHint);
  $('btn-skip').addEventListener('click', onSkip);
  $('pause-resume').addEventListener('click', onPause);
});

</script>
</body>
</html>
