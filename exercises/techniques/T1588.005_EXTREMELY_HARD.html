.items-table .it-state.wrong { color: var(--state-incorrect); }
.items-table .it-state.missed { color: var(--state-skipped); }
.fb-block { margin: 8px 0 0; }
.fb-block h5 { margin: 10px 0 4px; font-size: 13px; letter-spacing: 1px; color: var(--text-secondary); text-transform: uppercase; }
.fb-block p { margin: 0 0 6px; font-size: 15px; }
.fb-why { color: var(--text-primary); }
.fb-study { color: var(--text-secondary); }
.fb-study b { color: var(--accent-amber); }

/* ============ Skipped review ============ */
.skip-list { list-style: none; padding: 0; margin: 0; }
.skip-item {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px; margin: 10px 0;
}
.skip-item .s-no { font-family: var(--font-mono); color: var(--text-secondary); font-size: 13px; }
.skip-item .s-text { flex: 1; min-width: 200px; font-size: 15px; }
.skip-item .badge { white-space: nowrap; }

/* ============ Results ============ */
.results-hero { text-align: center; padding: 26px 20px 18px; }
.results-hero .pct { font-size: 52px; font-weight: 900; font-family: var(--font-mono); line-height: 1; }
.results-hero .verdict { font-size: 24px; font-weight: 900; letter-spacing: 2px; margin-top: 8px; display: inline-flex; align-items: center; gap: 10px; }
.verdict.pass { color: var(--state-correct); }
.verdict.fail { color: var(--state-incorrect); }
.cert-panel {
  border: 2px solid var(--state-correct); border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(87, 211, 140, 0.08), rgba(87, 211, 140, 0.02));
  padding: 18px 22px; margin: 16px 0; text-align: center;
}
.cert-panel .cert-title { font-size: 20px; font-weight: 800; color: var(--state-correct); letter-spacing: 1px; }
.cert-panel p { color: var(--text-secondary); margin: 6px 0 0; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 16px 0; }
.res-cell { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.res-cell .r-no { font-size: 26px; font-weight: 800; font-family: var(--font-mono); }
.res-cell .r-label { color: var(--text-secondary); font-size: 13.5px; display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.res-cell.fully .r-no { color: var(--state-correct); }
.res-cell.partial .r-no { color: var(--state-partial); }
.res-cell.incorrect .r-no { color: var(--state-incorrect); }
.res-cell.skipped .r-no { color: var(--state-skipped); }
.res-meta { color: var(--text-secondary); font-size: 14px; margin: 12px 0; }
.res-meta b { color: var(--text-primary); }
.results-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

/* ============ Responsive ============ */
@media (max-width: 760px) {
  .screen { padding: 8px 10px 32px; }
  .intro-head, .intro-section { padding: 16px; }
  .hdr-title .t { max-width: 150px; }
  .ex-card { padding: 14px; }
  .hdr-btns .btn { padding: 8px 10px; }
  .match-select { min-width: 140px; }
  .fill-input { width: 110px; }
  .items-table .it-state { width: 96px; }
}

/* ============ Manual pause cover ============ */
#pause-cover {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(11, 16, 32, 0.98);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.pause-card {
  max-width: 460px; width: 100%;
  background: var(--bg-surface); border: 1px solid var(--state-paused);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 30px 28px; text-align: center;
}
.pause-card .pause-ico { font-size: 44px; margin: 0 0 6px; color: var(--state-paused); }
.pause-card h2 { color: var(--state-paused); margin: 0 0 10px; font-size: 20px; letter-spacing: 1px; }
.pause-card p { color: var(--text-secondary); margin: 0 0 18px; }

</style>

window.__CPA_INTRO__ = {"intro":{"partLine":null,"learn":["\u003cp\u003e\u003cb\u003eT1588.005 — Exploits\u003c/b\u003e is a \u003cb\u003esub-technique of T1588 — Obtain Capabilities\u003c/b\u003e, and both sit inside the \u003cb\u003eResource Development tactic (TA0042)\u003c/b\u003e.\u003c/p\u003e","\u003cp\u003eThis is the \u003cb\u003eEXTREMELY HARD tier\u003c/b\u003e for \u003cb\u003eT1588.005 — Exploits\u003c/b\u003e. Scenarios carry \u003cb\u003econflicting signals, realistic noise and named information gaps\u003c/b\u003e: a senior analyst's job is to say what the evidence supports, what it does not, and what that costs.\u003c/p\u003e","\u003cp\u003eThe pre-publication thread: adversaries \u003cb\u003etarget the systems of exploit researchers\u003c/b\u003e to steal unreleased knowledge, and they \u003cb\u003emonitor exploit-provider forums\u003c/b\u003e to track existing and newly discovered exploits during the disclosure delay. The same channels feed defender availability reporting.\u003c/p\u003e","\u003cp\u003eThe evidence-first thread: \u003cb\u003eKEV-style prioritisation\u003c/b\u003e lets observed in-the-wild exploitation override CVSS ordering — and the \u003cb\u003eassume-acquisition\u003c/b\u003e posture treats absence of purchase intelligence as nothing. Detection anchors honestly at the \u003cb\u003euse phase\u003c/b\u003e, because acquisition sits outside enterprise visibility (DET0827 / AN1959).\u003c/p\u003e","\u003cp\u003eThe governance thread: red teams source exploits only through \u003cb\u003eapproved channels\u003c/b\u003e with recorded \u003cb\u003eprovenance\u003c/b\u003e; when an actively exploited bug demands a fix that costs downtime, the defensible decision \u003cb\u003eaccepts the cost\u003c/b\u003e and records it.\u003c/p\u003e","\u003cp\u003eReal procedure at report level: \u003cb\u003eKimsuky (G0094)\u003c/b\u003e obtained exploit code for various CVEs. One exercise uses a simulated, strictly read-only terminal with a destructive-input trap.\u003c/p\u003e"],"keywords":[{"theme":"Pre-publication theft","items":["Researcher targeting","0-day head start","Disclosure delay"]},{"theme":"Marketplace intelligence","items":["Provider forums","Escrow and reputation","Listing triage"]},{"theme":"Evidence-first prioritisation","items":["KEV-style lists","CVSS limits","Assume acquisition"]},{"theme":"Use-phase anchors","items":["Anomalous appliance sessions","IPS blocks","Crashes and tunnels"]},{"theme":"Governance and cost","items":["Approved channels","Provenance","Accepted downtime"]}],"types":"multiple choice, multi-select, matching, ordering, drag & drop, fill in the blanks, decision branch, simulated read-only terminal","howExtra":["\u003cp\u003eThe terminal exercise is \u003cb\u003esimulated\u003c/b\u003e and \u003cb\u003eread-only\u003c/b\u003e — nothing is executed, and destructive input loses credit.\u003c/p\u003e","\u003cp\u003eEvery scenario includes deliberate noise and at least one information gap: conclusions must survive the missing pieces.\u003c/p\u003e"]},"parentId":"T1588","parentName":"Obtain Capabilities"};
window.__EX_A__ = [{"id":"EX-01","type":"branch","concepts":["C18","C39"],"scenario":"Lindqvist Cyber Labs, IR-9001: the lab's exploit researchers hold pre-publication analyses under vendor embargo, and the ticket queue says one of them just opened a spearphish. Dr I. Voss reports a forged conference invitation with a 'benchmark suite' attachment; telemetry shows her workstation beaconing to an unknown domain within four minutes. The page's description is unambiguous about why labs like this get targeted: adversaries go after the systems of those known to conduct exploit research and development, to gain that knowledge for use in a subsequent operation. The duty manager is pushing to treat it as ordinary phishing because 'nothing is confirmed stolen'. The research director is reachable tonight, and the affected vendors under embargo can be briefed quietly before disclosure dates arrive. There is no DLP coverage on the research VLAN, so nobody can say whether anything left the workstation. Decide the containment, the risk framing, and the final position — in that order, and expect the post-incident review to read all three. The detonation queue can wait; preservation cannot.","artefacts":[{"kind":"text","title":"Ticket IR-9001 — phishing report, 07:42","body":"Reported by: Dr I. Voss, exploit research group.\nSender: programme-desk[.]auroraconf[.]example — 'PC-review invitation: please run the attached benchmark suite.'\nAttachment: benchmark_suite_v2.zip — hashed, detonation pending.\nTelemetry: workstation VOSS-WS1 resolved cdn-metrics[.]top three times within 4 minutes of the attachment being opened.\nNoise in the same mailbox: two marketing emails, one calendar spam.\nUnknown: whether any pre-publication material left the workstation; no DLP coverage on the research VLAN."}],"question":"Step through the branch and choose the defensible decision at each step.","hint":"Restate the missed constraint: no DLP means exfiltration can be neither confirmed nor excluded — decisions must be robust to both.","steps":[{"continuation":"First: containment on VOSS-WS1, right now, before the detonation queue finishes.","question":"What is the correct immediate containment step?","options":[{"id":"A","text":"Isolate VOSS-WS1 from all networks and preserve memory and disk before any cleanup"},{"id":"B","text":"Have Voss run a scheduled antivirus scan and keep the workstation online"},{"id":"C","text":"Reply to the sender to verify whether the invitation is genuine"}],"correct":"A","why":"Beaconing after an attachment plus pre-publication material on disk means isolate-then-preserve: cleanup before forensics destroys the evidence the review will demand."},{"continuation":"Second: the duty manager calls the risk 'just a mailbox' and wants the ticket triaged low.","question":"What is the highest-value asset actually at risk?","options":[{"id":"A","text":"The mailbox alone; research material is backed up, so nothing is at risk"},{"id":"B","text":"Pre-publication exploit research and embargoed advisories on the researcher's systems — exactly what researcher-targeting exists to steal"},{"id":"C","text":"The lab's public website and its press archive"}],"correct":"B","why":"The page states the motive plainly: knowledge for use in a subsequent operation. Embargoed analyses on the endpoint are the prize; backups do not reduce the theft risk."},{"continuation":"Third: the 11:00 leadership sync needs a final position, and the duty manager wants to close as routine phishing.","question":"What is the defensible final decision?","options":[{"id":"A","text":"Close as ordinary phishing — no confirmed data loss, so no escalation"},{"id":"B","text":"Wait a week and watch before informing anyone"},{"id":"C","text":"Escalate to the research director and national CERT: assume the exploit knowledge is at risk, hunt for exfiltration, and brief the affected vendors under embargo"}],"correct":"C","why":"Escalation does not require proof of theft: the targeting logic already puts the knowledge at risk, and embargoed vendors need time to prepare. Waiting converts a stolen head start into someone else's 0-day."}],"explanation":"A researcher's workstation holds exactly what this sub-technique says adversaries hunt: pre-publication exploit knowledge. Isolate first, preserve second, assume last: without DLP, exfiltration can be neither confirmed nor excluded, so the decision must be robust to both. Escalation is the control here — researchers, vendors under embargo and CERT all move faster when told early. Waiting for the attacker to confirm the theft is not a decision.","study":"Draft the one-line escalation trigger your lab would use for researcher-targeting cases."},{"id":"EX-02","type":"qcm","concepts":["C18"],"scenario":"Ostro Systems, OS-771: the CTI brief covers a pattern the page states plainly — adversaries target the systems of those known to conduct exploit research and development, to gain that knowledge for use during a subsequent operation. A director challenges it in review: 'Why would a serious crew bother with a lone researcher instead of just buying capability?' The brief's answer is due to the CISO within the hour, and the director will read every word. Two draft explanations lean on generic motives — botnets, cryptojacking — that fit any breach and therefore explain nothing. The strong answer names the asset and the timing: what sits on a researcher's systems, and when it is worth most. The CISO has cancelled this section twice before for vagueness. Keep it to one answer. The artefact quotes both struck drafts. Struck drafts teach what vague looks like. One sentence must carry the asset, the timing and the use.","question":"Why do adversaries target the systems of known exploit researchers?","hint":"Restate the missed constraint: the answer must name the asset and the timing — generic motives cancel the section.","artefacts":[{"kind":"text","title":"Review minutes OS-771 (extract)","body":"Director: 'Why a lone researcher, when capability can simply be bought?'\nDraft 1: struck — 'botnet motive, generic'.\nDraft 2: struck — 'cryptojacking, generic'.\nDue: CISO briefing, within the hour."}],"options":[{"id":"A","text":"Their endpoints are easy cryptojacking targets with idle GPU capacity"},{"id":"B","text":"To steal unreleased exploits and pre-publication knowledge, gaining a 0-day head start on a later operation"},{"id":"C","text":"To conscript the machines into a DDoS botnet rented out by the hour"},{"id":"D","text":"Because researchers publish instantly, there is nothing valuable left to steal"}],"correct":"B","optionWhy":{"A":"Cryptojacking fits any breach and explains nothing about this specific targeting; the CISO will strike it.","C":"A DDoS botnet is a generic motive that ignores the one asset unique to these systems — the unpublished work.","D":"Self-defeating: the whole pattern exists because disclosure has not happened yet. Publication destroys the value; it is not assumed."},"explanation":"The page is explicit: adversaries target the systems of those known to conduct exploit research and development to gain knowledge for use in a subsequent operation. The prize is the unreleased exploit and the pre-publication window it opens. Botnets and cryptojacking explain almost any breach, which is what makes them useful-sounding and wrong here.","study":"Compare the theft chain's economics with a broker purchase — timing is the difference."},{"id":"EX-03","type":"multi","concepts":["C28"],"scenario":"Halvorsen Media, CTI-204: the desk is building its first exploit-availability watchlist, and the intern assumed provider forums are just shops. The page describes them as monitoring channels: adversaries watch the state of existing exploits and catch newly discovered ones during the disclosure delay. This week's extract sits in artefact 1; the gateway vendor's reassurance sits in artefact 2. The editorial board wants the watchlist justified before budget sign-off. Your lead wants statements that separate what forum monitoring actually is — for adversaries and for us — from folklore. Watch the noise: a rumour is not a listing, and an unverified auction is not availability. Note the gap: nothing in the extract proves the mail-gateway claim either way, and the vendor note is unsigned. Grade the extract row by row: code beats claims, claims beat rumours. The auction row is not about our products, but it prices the market. Bring the graded extract to sign-off.","artefacts":[{"kind":"table","title":"Forum watchlist extract — week 46","rows":[["Channel","Signal","Status","Our product?"],["provider forum /mkt","'working n-day, mail-gw suite'","claimed","yes"],["provider forum /auc","0-day auction, edge appliance family","claimed, unverified","no"],["repo watch","public PoC commit, CVE-2025-28897","public code","yes"],["broker chatter","'researcher material circulating'","rumour","unknown"]]},{"kind":"text","title":"Vendor note (quoted in CTI-204)","body":"'No listings mention your product family this month; you are probably fine.' — sent 04 Nov, unsigned, no data attached."}],"question":"Select all the statements that reflect what forum monitoring actually is.","hint":"Restate the missed constraint: claims, rumours and vendor reassurance are three different evidence grades — availability needs the strongest one.","options":[{"id":"A","text":"Crews watch these channels to track existing exploits and catch new ones early"},{"id":"B","text":"Availability signals — public PoC commits, weaponised-use claims — feed our patch priorities"},{"id":"C","text":"Defenders read the same channels; an unsigned 'probably fine' is not monitoring"},{"id":"D","text":"Forums are only shops, so the watchlist has no defender value"},{"id":"E","text":"Every forum claim counts as proven availability, including unverified rumours"}],"correct":["A","B","C"],"optionWhy":{"A":"This is the page's own wording: monitoring the state of existing exploits, not just shopping.","B":"The repo row is the strongest grade in the extract — public code — and is exactly what moves a patch queue.","C":"The same channels serve both sides; a reassurance with no data is the absence of evidence, not evidence.","D":"The page says the opposite: the channels carry state-of-the-market intelligence both sides use.","E":"Claims and rumours are the noise tier; triage grades them below public code and observed use."},"explanation":"Forum monitoring is intelligence, not shopping: crews track existing exploits and catch new ones during the disclosure delay, and defenders run availability reporting on the same channels. But a claim is not availability — rumours and unverified auctions are noise to triage, not signals to report. An unsigned vendor note is the absence of evidence, which is exactly what the watchlist exists to replace.","study":"Grade your own feed sources: public code, observed use, listing, rumour, reassurance."},{"id":"EX-04","type":"match","concepts":["C44"],"scenario":"Cranmore University, CTI-455: the CTI induction pack includes a brief card on Kimsuky, the actor the page credits with obtaining exploit code for various CVEs. A student draft has merged the card with another actor's row, giving Kimsuky an exclusive edge-appliance 0-day that belongs elsewhere on the page. The card must survive the external examiner, who checks every claim against the page. Group id, object obtained, and coverage breadth are the three pairings to fix. The examiner's rule is simple: each claim attaches to the group the page names. 'Various' is doing real work in the page's wording — preserve it. The decoy row stays on the card unpaired, as a standing trap for next year's cohort. The card's history is part of the lesson. Two cohorts have merged the same rows. Fix the three pairings and leave the decoy breathing. Pairing three of three is the pass mark.","artefacts":[{"kind":"text","title":"CTI-455 brief card header (student draft)","body":"Actor: Kimsuky.\nClaims to pair: group id; object obtained; coverage breadth.\nStanding decoy: one claim lifted from a different actor's row — pair it to nothing.\nCard history: corrected twice; the examiner failed the 2043 cohort on exactly this merge."}],"question":"Pair each Kimsuky fact to its correct completion.","hint":"Restate the missed constraint: the page's row covers many bugs at once — a single exclusive 0-day belongs to a different actor's row.","left":[{"id":"L1","text":"Kimsuky — the group id"},{"id":"L2","text":"Kimsuky — what was obtained"},{"id":"L3","text":"The CVE coverage"}],"right":[{"id":"R1","text":"G0094"},{"id":"R2","text":"exploit code"},{"id":"R3","text":"various CVEs — many different bugs, not one flagship"},{"id":"R4","text":"a single exclusive 0-day for an edge appliance"}],"map":{"L1":"R1","L2":"R2","L3":"R3"},"why":{"L1":"The page's group table: G0094 is Kimsuky.","L2":"The page row: Kimsuky has obtained exploit code.","L3":"The wording is 'various CVEs' — plural, many bugs, not one flagship exclusive."},"explanation":"The page's row for Kimsuky is compact: the group (G0094) obtained exploit code for various CVEs — plural, many bugs, not one flagship exclusive. The edge-appliance 0-day belongs to a different actor on the same page. Keeping claims attached to the right group is the whole job of a brief card.","study":"Rewrite the Kimsuky row from memory and check every word against the page."},{"id":"EX-05","type":"terminal","concepts":["C40"],"scenario":"Pinecrest Cloud ticket SOC-8842, 02:40 shift: the dashboard claims every edge appliance reports into the SIEM, but the on-call lead does not accept dashboard colour as proof. Last night the collector restarted during maintenance, and one appliance's stream may have dropped silently — the dashboard would still show green. The raw index for the edge fleet is on disk at /data/siem/edge_index.log on collector siem-col-01; your session is strictly read-only. Prove ingestion per appliance, not per dashboard: a per-host count over last night's window. Rows from other sources sit in the same file; count only the edge-appliance rows. If an appliance is missing from the counts, that is your finding — the dashboard will not tell you. The lead wants the counts, the window, and one sentence on the gap. The window runs 23:40 to 02:40. Count the file as it lies; do not touch rotation. A silent host in the tally is the finding.","question":"Type the read-only command that counts the edge-appliance events per appliance host from the index file.","hint":"Restate the constraint: per-appliance counts from the on-disk index — one grand total cannot expose a silent appliance.","artefacts":[{"kind":"log","title":"Index sample — /data/siem/edge_index.log (window 23:40-02:40)","lines":["2025-11-02T23:41:07Z,eg-appl-01,session.admin,src=203[.]0[.]113[.]44,outcome=fail","2025-11-02T23:41:09Z,eg-appl-01,session.admin,src=203[.]0[.]113[.]44,outcome=success","2025-11-02T23:52:44Z,eg-appl-02,tunnel.new,peer=198[.]51[.]100[.]77","2025-11-02T23:58:03Z,collector,maintenance,restart reason=package update","2025-11-03T00:14:02Z,webproxy-07,request.render,host=status-page[.]example","2025-11-03T02:12:33Z,eg-appl-04,session.admin,src=203[.]0[.]113[.]58,outcome=success"]}],"promptUser":"analyst","promptHost":"siem-col-01","welcome":["Simulated shell — nothing here is real.","Read-only session: no writes, no log rotation, no deletion. Verification only."],"expected":"awk -F, '/eg-appl/ {c[$2]++} END {for (k in c) print k, c[k]}' /data/siem/edge_index.log","elements":[{"id":"tool","label":"count tool","match":"\\bawk\\b","why":"A small counting program aggregates per-host tallies in one pass."},{"id":"fieldsep","label":"comma field separator","match":"\\s-f,","why":"Index rows are comma-separated; the appliance name is field 2."},{"id":"pattern","label":"appliance row pattern","match":"eg-appl","why":"Keeps only edge-appliance rows; web proxy and collector rows are noise here."},{"id":"accum","label":"per-host accumulator","match":"c\\[","why":"Counts events per appliance host instead of one lump total."},{"id":"endblock","label":"END block prints the tally","match":"\\bend\\b","why":"The tally prints once after all rows are read."},{"id":"path","label":"the raw index file","match":"edge_index\\.log","why":"Reads the on-disk index — the evidence — not the dashboard."},{"id":"total","label":"grand-total tools","match":"\\b(wc|grep\\s+-c)\\b","why":"A single grand total collapses every appliance together — a silent appliance stays invisible.","penalty":true}],"dangerous":{"match":"\\b(delete|purge|rotate|truncate|rm)\\b","note":"rolling or deleting index data would destroy the very evidence you are verifying — read-only contract"},"simOutput":["eg-appl-01 214","eg-appl-02 149","eg-appl-04 187"],"explanation":"Three appliances appear in the tally; eg-appl-03 is silent across the whole window after the collector restart — ingestion is not proven for the fleet. Use-phase telemetry is the only anchor defenders get, because acquisition is invisible, so ingestion gaps are findings, not footnotes. Take the gap to the platform team with timestamps, not to the dashboard vendor.","study":"Run the same proof on one of your own indexes and name the silent host, if any."},{"id":"EX-06","type":"qcm","concepts":["C35"],"scenario":"Corvale Logistics, VM-730: the change board deadlocked for the third week over the ageing file-transfer appliance. The scanner scores the flaw 7.1, which parks it mid-table behind a backlog of higher-scored internal library bumps, none of them known-exploited. The national CERT lists the bug as known-exploited, a public PoC exists, and the appliance terminates remote access for the whole depot network. The queue extract is artefact 1. The board chair asks one question before voting: which statement about KEV-style prioritisation is actually true. The vendor's advisory sits unread in the queue tool, which some board members treat as the deciding document. You have five minutes to answer. The queue extract is one page, deliberately short. The score column and the KEV column disagree on the appliance row. That disagreement is the vote. Bring the sentence, not the methodology.","artefacts":[{"kind":"table","title":"Queue extract — VM-730 (top rows)","rows":[["Rank","Item","CVSS","KEV","Facing"],["12","internal library bump","8.8","no","internal"],["38","edge appliance RCE (this bug)","7.1","listed","internet-facing"],["41","desktop app flaw","7.0","no","internal"]]}],"question":"Which statement about KEV-style prioritisation is true?","hint":"Restate the missed constraint: the list adds one fact — exploitation observed in the wild — and changes nothing else.","options":[{"id":"A","text":"A KEV listing re-scores the bug upward in CVSS terms"},{"id":"B","text":"KEV listings replace vendor advisories and fixed-build lists"},{"id":"C","text":"A listing proves that our own estate was exploited"},{"id":"D","text":"Observed in-the-wild exploitation reprioritises the bug regardless of its CVSS score"}],"correct":"D","optionWhy":{"A":"The list does not touch the score; that is precisely why it overrides score order instead of re-entering it.","B":"Advisories and fixed-build lists stay the source of truth for what to patch; the list changes when, not what.","C":"The listing shows exploitation in the wild — the market exists; it does not say your estate was hit.","D":"This is the whole point: one decisive observed fact outranks a score that knows nothing about exploit markets."},"explanation":"KEV-style lists do not re-score anything and do not replace advisories; they add one decisive fact — exploitation observed in the wild — which reprioritises regardless of CVSS. The listing also does not prove your estate was hit; it proves the market exists. Boards that ask this question usually need the sentence, not the methodology.","study":"Find one bug in your queue where the KEV column and the score column disagree."},{"id":"EX-07","type":"multi","concepts":["C39"],"scenario":"Vantry Health, EX-510: the board minute asks a single question — 'CTI reports no marketplace listings and no vendor statements naming our estate. Are we safe?' The estate extract behind the minute is less comforting than the wording. Two internet-facing VPN concentrators sit below the vendor's fixed build with a review nine months stale; the mail gateway is at the fixed build but its review is three weeks old; an internal application gateway has never been reviewed and its build is unknown. The board convenes in forty minutes and the CISO wants priorities, not reassurances. Absence of purchase intelligence is an absence of evidence, and the extract shows the review program itself is the gap. Answer the board with actions, not moods. The minute's wording invites a comfort answer; the extract does not support one. Nine months of staleness is its own finding. The unreviewed internal gateway stays on the list — unknown build, unknown risk. Forty minutes is enough for three actions.","artefacts":[{"kind":"text","title":"Board minute, EX-510","body":"'CTI reports no marketplace listings and no vendor statements naming our estate. The board asks: are we safe?' — minute 7.3, 12 Nov."},{"kind":"table","title":"Edge estate extract — EX-510","rows":[["Asset","Facing","Build vs fixed","Last review"],["vpn-conc-01..04","internet","below fixed","9 months ago"],["mail-gw-01","internet","at fixed","3 weeks ago"],["app-gw-02","internal","unknown","never"]]}],"question":"Select all the priorities that answer the board correctly.","hint":"Restate the missed constraint: the board asked an intel question, but the extract's answers are exposure and telemetry, not listings.","options":[{"id":"A","text":"Assume the adversary already holds a working exploit for our edge appliances"},{"id":"B","text":"Treat the absence of purchase intelligence as evidence of absence and close the review"},{"id":"C","text":"Reduce exposure now: inventory, patch or restrict the internet-facing edge, starting with the stale concentrators"},{"id":"D","text":"Keep build numbers out of estate documentation so exploits cannot be matched"},{"id":"E","text":"Hunt for use-phase signals: anomalous appliance sessions, crashes, new tunnels"}],"correct":["A","C","E"],"optionWhy":{"A":"This is the assume-acquisition posture: acquisition is invisible, so the safe baseline is that the exploit already exists.","B":"Absence of intel on your estate says nothing about the market; closing on it is the exact failure the board minute invites.","C":"Exposure reduction is the control that works regardless of what the adversary bought — and the concentrators are the weakest point in the extract.","D":"Secrecy is not a control; the build is discoverable by anyone who can reach the banner.","E":"Use is the only phase your telemetry can see — hunt where the evidence can actually appear."},"explanation":"Assume-acquisition is the honest reading: no purchase intel on your estate is an absence of evidence, not evidence of absence. The priorities follow: reduce exposure on the internet-facing edge, hunt for use-phase signals, and treat secrecy as a convenience rather than a control. 'Are we safe' has no intel-free answer — which is why the board funds the hunt instead.","study":"Turn the board minute into three funded actions and one explicit accepted risk."},{"id":"EX-08","type":"branch","concepts":["C38"],"scenario":"Nordvik Ferries, OPS-330: the vendor advisory from 24 Mar describes an actively exploited authentication bypass in the VPN gateway OS — the fleet runs 4.9.2 against fixed 5.0.1, and the bug sits on the national known-exploited list with a public PoC. Two ferry-sector peers have disclosed intrusions this quarter. The fix requires a 45-minute full-VPN outage across all eight terminals and twelve vessels, and finance quarter-close runs 27 Mar to 02 Apr with a treasury request for 'zero infrastructure events'. The vendor's IPS ruleset — deployable within two hours — covers the known pattern but guarantees nothing. The captain's committee meets at 15:00, and the duty director wants a recommendation that survives the post-incident review either way. Walk the verify-act-communicate chain and be honest about the cost. The exposure panel shows every gateway below the fix. The booking platform is unaffected and stays out of scope. Two facts carry the decision: the listing, and the build gap.","artefacts":[{"kind":"text","title":"Change ticket CHG-7102 — OPS-330","body":"Scope: vpn-gw-01..08 (all terminals) and ship-offload-01..12 (12 vessels).\nFix: vendor kernel update to build 5.0.1; requires a 45-minute full VPN outage, all sites, single window.\nConstraint: finance quarter-close 27 Mar to 02 Apr; treasury has asked for 'zero infrastructure events' until 02 Apr.\nCompensating control: vendor IPS ruleset deployable within 2 hours; blocks the known exploit pattern, coverage not guaranteed."},{"kind":"table","title":"Exposure panel — OPS-330","rows":[["Asset","Installed build","Fixed build","Internet-facing","KEV"],["vpn-gw-01..08","4.9.2","5.0.1","yes","listed"],["ship-offload-01..12","4.9.2","5.0.1","via VPN hub","listed"],["booking-front-01","2.3.9","not affected","no","not listed"]]}],"question":"Step through the verify-act-communicate chain and choose the defensible decision at each step.","hint":"Restate the missed constraint: the IPS ruleset is a stopgap with no coverage guarantee — 'zero events until 02 Apr' is a wish, not a control.","steps":[{"continuation":"First: verify, before anything is promised to the captain's committee.","question":"What confirms the fleet is actually exposed?","options":[{"id":"A","text":"Confirm fleet builds against the vendor's fixed-build list and pull appliance session logs for post-disclosure anomalies"},{"id":"B","text":"Trust the asset register's 'patched: pending' flag as current"},{"id":"C","text":"Ask the vendor whether other customers were hit"}],"correct":"A","why":"Build truth plus session logs is evidence you own; register flags and vendor hearsay are not."},{"continuation":"Second: the evidence holds — builds are below the fix, KEV-listed, sector intrusions confirmed. Treasury's blackout stands.","question":"What is the correct action now?","options":[{"id":"A","text":"Deploy the IPS ruleset and defer the reboot until after quarter-close, whatever the exploit reports show"},{"id":"B","text":"Accept the queue: schedule the fix for the annual maintenance contract in Q3"},{"id":"C","text":"Schedule the emergency 45-minute patch window now — pre-stage rollback, notify finance and ship ops, and accept the downtime"}],"correct":"C","why":"Actively exploited plus listed means the exposure is live; the ruleset is a stopgap, and the least-bad decision accepts a bounded, pre-staged outage now rather than an unbounded one later."},{"continuation":"Third: the decision is made — the 45-minute window runs tonight. The board note is due.","question":"How is the decision framed in the record?","options":[{"id":"A","text":"Present it as avoided downtime because the IPS ruleset covers everything"},{"id":"B","text":"Present the accepted 45-minute outage as the cost of closing an actively exploited exposure — with start time, rollback plan and named approver"},{"id":"C","text":"Present nothing until the next audit cycle asks"}],"correct":"B","why":"The record must survive the review either way: a named cost, a bounded window and an approver is what defensible decisions look like; 'avoided downtime' claims a guarantee the ruleset does not make."}],"explanation":"The verify-act-communicate chain ends in an expensive truth: when a bug is actively exploited and the fix requires downtime, the least-bad decision accepts the 45-minute outage — pre-staged, communicated, with a named approver. Virtual patching buys hours, not quarters, and 'zero infrastructure events until 02 Apr' is a wish, not a control. Presenting the outage as the price of closing exposure is what survives a post-incident review.","study":"Draft your own costly-correct template: window, rollback, approver, affected parties."}];
</script>

<script>
window.__EX_B__ = [{"id":"EX-09","type":"multi","concepts":["C40"],"scenario":"Elmsworth Bank, SOC-5521: after two sector peers were breached through edge appliances, the CIO funded a use-phase detection review. The blunt constraint comes from the page itself: exploit acquisition happens outside the visibility of the target organisation, so the wallboard can only anchor on use. The SOC lead collected this week's candidate signals into one table and wants the anchors separated from the noise before the wallboard is rebuilt. Two of the six candidates are somebody else's telemetry — signals the bank cannot observe at all. One of them is marketing. Which two is not marked, and that is the review's job. The wallboard rebuild closes on Friday. The CIO will ask why the chatter posts are not on the wallboard. The answer is a scope line, not an argument. Anchor cards must name their observable source.","artefacts":[{"kind":"table","title":"Candidate signals — SOC-5521 (this week)","rows":[["Signal","Source","This week"],["admin sessions outside change windows","edge appliances","2 hits"],["IPS blocks matching the disclosed pattern","IPS","14 hits"],["appliance process restarts","appliance logs","1 unexplained"],["new outbound tunnel","netflow","1"],["marketplace chatter about our vendor","CTI listening post","3 posts"],["vendor quarterly bulletin","vendor portal","1 issue"]]}],"question":"Select all the candidate signals that are genuine use-phase detection anchors for the bank.","hint":"Restate the missed constraint: acquisition-side signals live outside bank telemetry — anchor only on what your sensors can observe.","options":[{"id":"A","text":"Anomalous admin sessions on edge appliances outside change windows"},{"id":"B","text":"IPS blocks matching the disclosed bug's exploit pattern"},{"id":"C","text":"Unexplained appliance process crashes or service restarts"},{"id":"D","text":"New outbound tunnels or sessions originating from the appliances"},{"id":"E","text":"Marketplace chatter about the bank's vendor"},{"id":"F","text":"The vendor's quarterly marketing bulletin"}],"correct":["A","B","C","D"],"optionWhy":{"A":"Appliance sessions outside change windows are the classic use-phase anchor — observable, time-bound, alertable.","B":"Pattern blocks at the IPS are direct evidence of exploit attempts against your own surface.","C":"Failed exploitation often ends in a crash; unexplained restarts on exposed services deserve triage.","D":"Tunnels from appliances are what post-exploitation looks like in netflow — observable and triageable.","E":"Marketplace chatter is acquisition-side: real intelligence, but no bank sensor can observe it — it belongs on the CTI desk, not the wallboard.","F":"Marketing bulletins are noise by construction and anchor nothing."},"explanation":"After acquisition — which no enterprise sensor can see — detection lives entirely at the use phase: anomalous appliance sessions, pattern blocks, crashes and tunnels are the anchors the page's detection note points to. Marketplace chatter is acquisition-side and outside your telemetry; vendor marketing is noise. The wallboard should list anchors it can actually observe.","study":"Map each wallboard card to its observable source, and delete the cards that have none."},{"id":"EX-10","type":"qcm","concepts":["C39"],"scenario":"Ryemarsh Insurance, VM-905: the vulnerability-management policy is explicit — patch order follows CVSS, highest first, no exceptions without CISO sign-off. The scanner puts a 7.1 edge-appliance RCE at position 38, behind forty-odd internal library bumps. The same flaw sits on the national known-exploited list, a public PoC exists, and the appliance terminates remote access for 4,000 staff. The CISO's assistant wants a one-line recommendation before the 09:00 risk call. The policy author is in the room and will hear any exception wording. Choose the call that is right here, not just procedurally clean. The exception process has never been used this year. Nobody wants to be first, which is how queues ossify. The appliance's user base is 4,000 remote staff. Score order was written for internal libraries, not for listed, exploited, internet-facing bugs. The policy author wrote the exception clause herself. Unused clauses expire in audits.","question":"What is the right call for VM-905?","hint":"Restate the missed constraint: the policy is a good default — and this case is what the exception process exists for.","artefacts":[{"kind":"text","title":"Policy excerpt VM-905 (standing text)","body":"'Patch order follows CVSS, highest first. Exceptions require CISO sign-off, recorded.'\nCurrent queue position for the edge appliance: 38 of 214.\nExceptions used this year: zero."}],"options":[{"id":"A","text":"Override the score-first policy: known exploitation plus internet-facing edge means patch now, and record the exception"},{"id":"B","text":"Follow the policy — score order exists precisely so queues stay exception-free"},{"id":"C","text":"Quietly raise the CVSS to 10.0 in the scanner so the queue reorders itself"},{"id":"D","text":"Wait for the vendor's next bulletin before touching the queue"}],"correct":"A","optionWhy":{"B":"This is the common best practice being wrong here: a score sort cannot see exploit markets, and 4,000 remote users ride on the appliance.","C":"Gaming the metric forces the same outcome while destroying the score's credibility and the audit trail with it.","D":"The advisory already exists and the market is active; waiting adds risk and nothing else."},"explanation":"Score-first ordering is a good default and exactly wrong here: known exploitation plus internet-facing edge outranks dozens of unscored library bumps. The override is the exception process working as designed — recorded, signed, and boring. Gaming the score to force the same outcome destroys the metric's credibility and the audit trail with it.","study":"Write the exception wording you would attach, and what evidence it cites."},{"id":"EX-11","type":"order","concepts":["C18"],"scenario":"Windrose CERT (fictional), CTI-6001: the training cell wants analysts to reconstruct the researcher-targeting chain from a case card, in order, with the page's wording in mind. The chain explains why a never-published exploit showed up in someone else's intrusion months before any advisory. Trainees keep ordering the spearphish first and the identification last, which is backwards and misses the selection logic. The card's unknowns are deliberate: a reconstruction should note them, not invent them. Each stage gets the page's logic attached. The exercise is read-only: no tooling, just ordering and reasoning. Mark the unknowns in your notes for the debrief. Time-box: eight minutes. The debrief compares orders, not prose. Selection logic is the stage trainees skip. The card's unknowns stay unknown.","artefacts":[{"kind":"text","title":"Case card CTI-6001","body":"A composite assembled by Windrose CERT for analyst training.\nStage material: a researcher's workstation breached after a spearphish; an archive of embargoed analyses accessed; a subsequent intrusion at a different organisation using a never-published exploit.\nUnknown from the card: which researcher and which advisory were targeted — those fields were lost to the breach.\nTask: reconstruct the four-stage chain the page describes."}],"question":"Order the four stages of the researcher-targeting chain from first to last.","hint":"Restate the missed constraint: selection precedes access — the adversary must know whom to target before phishing anyone.","items":[{"id":"I1","text":"Identify the researchers known to conduct exploit research and development"},{"id":"I2","text":"Spearphish the researchers' systems to gain access"},{"id":"I3","text":"Steal pre-publication exploit knowledge before disclosure"},{"id":"I4","text":"Convert the stolen knowledge into a head start for a later operation"}],"why":{"I1":"Selection first: the page's targeting is deliberate — adversaries pick people known to do exploit research.","I2":"Access second: the spearphish is the delivery mechanism against the chosen researcher.","I3":"Theft third: pre-publication knowledge is the prize, taken before disclosure destroys its value.","I4":"Use last: the knowledge becomes a 0-day head start in a subsequent operation."},"explanation":"The chain mirrors the page: identify researchers, spearphish their systems, steal pre-publication knowledge, and convert it into a head start for a later operation. Each stage narrows the gap between private knowledge and weaponised use. Defenders shorten the same timeline from the other side — embargo hygiene, researcher endpoint monitoring, and fast disclosure discipline.","study":"Pick one stage and write the control that would have broken the chain there."},{"id":"EX-12","type":"fill","concepts":["C38"],"scenario":"Ashcombe Rail, AR-GOV-9: the governance memo is being re-issued after the internal audit found two red-team exploit purchases with no provenance record and one sourced from an unvetted individual seller. The CISO wants the blanks in the excerpt closed in the re-issue, and the audit finding worded identically. Red-team leads pushed back that 'records slow down sourcing'; the audit note answers that unrecorded sourcing is precisely what cannot be defended post-incident. Provenance here means origin and licence, not price. The re-issue is due with the quarter's close-out. Keep the blanks to single terms the auditor can lift verbatim. The audit cites the memo, so the words must match. The unvetted seller purchase is the case study. One term per blank, no slogans. The excerpt is one sentence long. Lift the terms; do not paraphrase. AF-2211 quotes the memo line directly. Matching words close findings.","artefacts":[{"kind":"text","title":"AR-GOV-9 (excerpt, with blanks)","body":"'Red teams may source exploits only through ____ channels. Every purchase must be logged with its ____ — who sold it, what was bought, and for which engagement.'\nAudit finding AF-2211: two of nine purchases carry no record; one sourced outside any listed channel."}],"question":"Fill in both blanks in memo AR-GOV-9.","hint":"Restate the missed constraint: the auditor lifts these words verbatim — the terms must name the control, not the price.","template":"AR-GOV-9: red teams may source exploits only through {{1}} channels, and every purchase must be logged with its {{2}}.","blanks":[{"accept":["approved","authorised","authorized","sanctioned"],"display":"approved","why":"Governance restricts sourcing to channels the organisation has approved — everything else is the audit finding."},{"accept":["provenance","origin","licence","license","provenance record","provenance records"],"display":"provenance","why":"Provenance — origin and licence — is what makes a purchase auditable after the fact."}],"explanation":"Approved channels and recorded provenance are what make red-team purchases auditable: who bought what, from whom, for which engagement. The memo's blank fields are the governance difference between a capability program and an uncontrolled supply chain. Missing provenance on two purchases is exactly the finding the memo exists to prevent.","study":"Check the last three red-team purchases in your organisation for a provenance record."},{"id":"EX-13","type":"dd","concepts":["C28","C35"],"scenario":"Kolbern Retail, SOC-7105: the monitoring program is being rebuilt, and the playcard arrives with six rows written by three different teams. CTI wrote the forum row, the SOC wrote the KEV and advisory rows, GRC wrote the provenance row, and nobody owns the escrow or researcher rows. The lead wants each row assigned to the right owner: adversary-side behaviour to understand, defender-side monitoring to operate, or governance obligation to enforce. Two rows describe what only adversaries can do; assigning them to the SOC is how programs rot. The board reviews owner assignments next week. Unowned rows were the audit's finding last year. Sort the six rows. The playcard fits one screen, which is the point. Owner, cadence, deliverable — in that order. Escrow and researcher rows have sat unowned for two quarters. Two quarters of drift is the cost of unowned rows.","artefacts":[{"kind":"text","title":"Playcard SOC-7105 — six unowned rows, three owner bins","body":"Rows collected from CTI, SOC and GRC wikis in week 44.\nTwo rows describe adversary-only behaviour.\nOwner review: board, next week.\nPrior finding: unowned rows (audit, last year)."}],"question":"Drag each monitoring row into the owner bin it belongs to.","hint":"Restate the missed constraint: an owner must be able to perform the row — if only adversaries can, it is not your SOC's card.","bins":[{"id":"B1","text":"Adversary-side behaviour"},{"id":"B2","text":"Defender-side monitoring"},{"id":"B3","text":"Governance obligation"}],"items":[{"id":"T1","text":"Watch exploit-provider forums for the state of existing and new exploits","bin":"B1"},{"id":"T2","text":"Target the systems of exploit researchers for pre-publication work","bin":"B1"},{"id":"T3","text":"Route marketplace payments through escrow to reduce fraud","bin":"B1"},{"id":"T4","text":"Track known-exploited (KEV-style) listings for estate products","bin":"B2"},{"id":"T5","text":"Monitor vendor advisories and exploit-availability feeds weekly","bin":"B2"},{"id":"T6","text":"Record provenance and approval for every red-team exploit purchase","bin":"B3"}],"why":{"T1":"Forum watching is what the page says adversaries do — a behaviour to model, not a SOC task.","T2":"Researcher targeting is an adversary operation against third parties; the SOC can only watch for echoes.","T3":"Escrow is a marketplace mechanism the criminal channel uses; the defender observes it, never operates it.","T4":"KEV tracking is a defender monitoring row with a clear owner and a weekly cadence.","T5":"Advisory and availability monitoring is the SOC's feed side — operated, owned, reported.","T6":"Provenance records are a governance obligation — GRC owns the rule, red team owns the compliance."},"explanation":"The same marketplace family serves both sides, which is why the playcard splits by role: adversary behaviours (forum watching, researcher targeting, escrowed deals) versus defender monitoring (KEV tracking, advisory and availability feeds) versus governance (provenance for every purchase). Mixing the rows is how teams end up 'monitoring' behaviours only attackers can perform. Assign each row an owner, or it will not happen.","study":"Take one row per bin and write the owner, cadence and first deliverable."},{"id":"EX-14","type":"match","concepts":["C44","C18","C39"],"scenario":"Delvern Utilities, CTI-338: the induction pack for senior analysts compresses three doctrine rows from this topic onto one card: a real example row, a researcher-targeting row, and an assume-acquisition row. Two decoy claims from a vendor pitch deck are floating in the pack and must not be paired. The pack's reviewer wants each row paired to its exact doctrine, with the decoys left unpaired. The three rows come straight from the page and the doctrine note. If a pairing cannot be sourced to the page, it does not ship. The decoys are attractive because they sound like diligence. Vendor claims die here or they spread. The card fits one page, which is why the rows are terse. Terse rows attract sloppy pairings. The reviewer's red pen has already killed two drafts. One page, three rows, two traps.","question":"Pair each doctrine row to its exact statement.","hint":"Restate the missed constraint: every paired statement must be sourced to the page — if it sounds like a sales deck, leave it.","artefacts":[{"kind":"text","title":"Doctrine card CTI-338 (pack page 3)","body":"Row 1: real example — actor, object, coverage.\nRow 2: researcher targeting — motive and timing.\nRow 3: assume-acquisition — posture and anchors.\nFloating claims: two, from a vendor deck; pair to nothing."}],"left":[{"id":"L1","text":"Kimsuky (G0094)"},{"id":"L2","text":"Targeting exploit researchers"},{"id":"L3","text":"Assume-acquisition doctrine"}],"right":[{"id":"R1","text":"obtained exploit code for various CVEs"},{"id":"R2","text":"aims at pre-publication exploit theft before disclosure"},{"id":"R3","text":"reduce exposure and hunt at the use phase; secrecy is not a control"},{"id":"R4","text":"ranks every flaw by CVSS before anything else"},{"id":"R5","text":"makes acquisition visible to enterprise logging"}],"map":{"L1":"R1","L2":"R2","L3":"R3"},"why":{"L1":"The page row: Kimsuky has obtained exploit code for various CVEs.","L2":"Researcher targeting exists to steal pre-publication knowledge — the 0-day head start.","L3":"Assume-acquisition means acting on exposure and use-phase telemetry, because acquisition is invisible."},"explanation":"Three doctrine rows, one page: Kimsuky obtained exploit code for various CVEs; researcher targeting aims at pre-publication theft; assume-acquisition doctrine prioritises exposure reduction and use-phase hunting. The decoys invert the doctrine — CVSS-first ranking and enterprise visibility of acquisition are exactly what this sub-technique teaches against.","study":"Explain to a peer why each decoy fails, in one sentence each."},{"id":"EX-15","type":"multi","concepts":["C28","C18"],"scenario":"Sutter Point MSP, CTI-995: the listening post captured four listings in one week, all touching the same two product families your clients run. The MSP's playbook says escalate what is corroborated, dismiss the scam pattern, and never let a headline do the triage. Listing A looks expensive and professional; listing C undercuts it from a two-day-old account; listing B is cheap with mismatched screenshots; listing D claims researcher access and refuses escrow. The demo video for A has been requested twice and not supplied — triage must survive without it. Two clients run the GlobalEdge appliance family; one runs the mail gateway. The client briefing is Thursday, and every verb — escalate or dismiss — will be challenged. A's demo video may never arrive; triage does not wait for it. The prior-sales line on A is the strongest single corroboration. D's refusal of escrow is a claim, not a disqualifier. Thursday's briefing grades the verbs, not the volume.","artefacts":[{"kind":"table","title":"Listings panel — CTI-995 (week 46)","rows":[["Listing","Headline","Price","Escrow","Seller rep","Notes"],["A","0-day, GlobalEdge VPN appliance","180k","accepted","94/100","demo video on request; two prior sales visible"],["B","n-day CVE-2025-28897 PoC","900","refused","12/100","screenshots with mismatched timestamps"],["C","same 0-day as A, 'urgent sale'","90k","refused","3/100","claims same seller; new account, 2 days old"],["D","pre-publication advisory access, mail gateway","on ask","refused","61/100","claims researcher breach source; no sample"]]}],"question":"Select all the triage verdicts the playbook supports.","hint":"Restate the missed constraint: corroboration — escrow, reputation, consistent detail — separates escalation from the scam pattern.","options":[{"id":"A","text":"Treat any CVE id in a headline as proof the exploit works"},{"id":"B","text":"Escalate listing A — escrow acceptance, strong reputation and consistent detail corroborate it"},{"id":"C","text":"Dismiss listing B — low reputation plus staged screenshots is the classic scam pattern"},{"id":"D","text":"Dismiss listing C — a duplicate repost undercutting A points to impersonation, not inventory"},{"id":"E","text":"Escalate listing D — pre-publication claims match documented researcher-theft behaviour, even when unverified"}],"correct":["B","C","D","E"],"optionWhy":{"A":"Headline-reading is what the playbook forbids; a CVE id proves a bug exists, not that working code does.","B":"Escrow plus a 94/100 reputation plus visible prior sales is the corroboration tier the playbook escalates.","C":"Refused escrow, 12/100 reputation and mismatched screenshots is the scam pattern; dismiss and note the id.","D":"A two-day-old account undercutting A by 50% is an impersonation pattern; escalate the original, dismiss the repost.","E":"Unverifiable, but pre-publication claims are exactly the documented researcher-theft behaviour — escalate to the CERT, not to the client's patch queue."},"explanation":"Corroboration is the triage skill: escrow acceptance, sustained reputation and consistent detail make listing A escalation-worthy; pre-publication claims (D) match documented researcher-theft behaviour and escalate even when unverifiable. Low-reputation, staged-screenshot listings (B) and undercutting duplicate reposts (C) are the scam pattern to dismiss. A CVE id in a headline proves nothing — which is why triage, not headline-reading, is the job.","study":"Write your own three-question triage: who corroborates, what tier, who is told."},{"id":"EX-16","type":"qcm","concepts":["C35","C40"],"scenario":"Tarnwell Grid, SOC-4012: the edge appliance sits on the national known-exploited list, the advisory is nine days old, and the SOC has three admin sessions on it that no change record explains. The banner that would show the installed build was stripped in a hardening pass nobody can find a ticket for, so the build is unknown. The duty manager wants to declare a confirmed intrusion and page the IR retainer; the platform team wants it closed as 'automated scanning'. Both readings fit the four log lines, and only two facts are missing: the build, and the rest of the session logs. The retainer pages cost money and credibility. Closed alerts are expensive to reopen. Choose the next step as if the post-incident review will read it. The fixed-build list is public and takes minutes to check. Session logs for the full window exist on the collector. Neither fact is in the ticket yet. Minutes of checking beat a week of retainer billing.","artefacts":[{"kind":"log","title":"Alert extract — SOC-4012 (appliance session log)","lines":["0     if (event.data.locale) handshake.locale = event.data.locale;
  });

  /* ---------------- score report (exam -> site) ---------------- */

    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;

    if (DATA.intro.howExtra) DATA.intro.howExtra.forEach(function (r) { rules.push(["➕", r]); });

  /* ================= EXERCISE RENDER ================= */

  function highlightLog(ln) {

    out = out.replace(/\b(ERROR|CRIT|CRITICAL|FATAL|ALERT)\b/g, "<span class='sev-ERROR'>$1</span>");

    out = out.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, "<span class='quoted'>$1</span>");
    out = out.replace(/\b((?:SHA)?[0-9a-f]{32,64}|[A-Z]{2,6}[-_]?\d{4,6})\b/g, "<span class='uid'>$1</span>");
    return out;
  }
  function highlightCode(src) {

  function typeName(t) {
    return ({ qcm: "Multiple choice (single answer)", multi: "Multi-select (partial credit)", match: "Matching (partial credit)", order: "Ordering (partial credit)", fill: "Fill in the blank (partial credit)", dd: "Drag & drop (partial credit)", terminal: "Terminal (partial credit)", branch: "Decision tree (partial credit)" })[t] || t;
  }

  /* ---------------- widgets ---------------- */
  var W = null; /* current widget state */

  function makeWidget(ex, idx) {
    var disp = Attempt.optionOrders[idx];
    if (ex.type === "qcm" || ex.type === "multi") return widgetChoice(ex, idx, disp);
    if (ex.type === "match") return widgetMatch(ex, idx, disp);

  function choiceRow(o, key, isMulti, onPick) {
    var b = el("button", {
      class: "opt-row", type: "button", role: isMulti ? "checkbox" : "radio",
      "aria-checked": "false", "data-oid": o.id

  }

  function widgetChoice(ex, idx, disp) {
    var isMulti = ex.type === "multi";
    var node = el("div", { class: "widget", role: isMulti ? "group" : "radiogroup", "aria-label": "Answer options" });
    if (isMulti) node.appendChild(el("p", { class: "widget-note", text: "Select all options that apply. Wrong selections subtract credit." }));
    var picked = {};
    function refreshCheck() {
      var n = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
      var cb = $("#btn-check");
      if (cb) cb.disabled = n === 0;
    }
    disp.forEach(function (oid, i) {
      var o = ex.options.filter(function (x) { return x.id === oid; })[0];
      var row = choiceRow(o, String.fromCharCode(65 + i), isMulti, function (id, btnEl) {
        if (isMulti) {
          picked[id] = !picked[id];
          btnEl.setAttribute("aria-checked", picked[id] ? "true" : "false");
          btnEl.classList.toggle("selected", !!picked[id]);
          btnEl.querySelector(".sel-word").classList.toggle("hidden", !picked[id]);
        } else {
          Object.keys(picked).forEach(function (k) { picked[k] = false; });
          $$(".opt-row", node).forEach(function (r) {
            r.setAttribute("aria-checked", "false");
            r.classList.remove("selected");
            r.querySelector(".sel-word").classList.add("hidden");
          });
          picked[id] = true;
          btnEl.setAttribute("aria-checked", "true");
          btnEl.classList.add("selected");
          btnEl.querySelector(".sel-word").classList.remove("hidden");
        }
        refreshCheck();
      });
      node.appendChild(row);
    });
    W = {
      selection: function () {
        var sel = Object.keys(picked).filter(function (k) { return picked[k]; });
        return {
          selected: sel,
          correct: isMulti ? ex.correct : [ex.correct],
          items: buildOptionItems(ex, sel, isMulti)
        };
      }
    };
    return { node: node };
  }
  function buildOptionItems(ex, sel, isMulti) {
    var corr = isMulti ? ex.correct : [ex.correct];
    var rows = [];
    var order = dispOrderFor(ex);
    order.forEach(function (oid) {
      var o = ex.options.filter(function (x) { return x.id === oid; })[0];
      var isC = corr.indexOf(oid) !== -1, isS = sel.indexOf(oid) !== -1;
      if (!isC && !isS) return;
      var st = isC && isS ? "correct" : (!isC && isS ? "wrong" : "missed");
      var why = (ex.optionWhy && ex.optionWhy[oid]) || "";
      rows.push({ state: st, text: o.text, why: why });
    });
    return rows;
  }
  function dispOrderFor(ex) {
    return Attempt.optionOrders[Attempt.currentIdx()] || (ex.options || []).map(function (o) { return o.id; });
  }

  function widgetMatch(ex, idx, disp) {
    var node = el("div", { class: "widget" });
    node.appendChild(el("p", { class: "widget-note", text: "Assign each item on the left to the correct match on the right. Each correct pair earns credit; each wrong pair subtracts." }));

      var sel = el("select", { class: "match-select", "data-lid": L.id, "aria-label": "Match for: " + L.text });
      sel.appendChild(el("option", { value: "", text: "— choose a match —" }));
      (disp || shuffle(ex.right.map(function (r) { return r.id; }))).forEach(function (rid) {
        var r = ex.right.filter(function (x) { return x.id === rid; })[0];
        sel.appendChild(el("option", { value: rid, text: r.text }));
      });
      sel.addEventListener("change", function () {
        chosen[L.id] = sel.value || null;

        if (cb) cb.disabled = ex.left.some(function (l) { return !chosen[l.id]; });

      t.appendChild(el("tr", {}, [
        el("td", { class: "match-row-no", text: String(i + 1) + "." }),

    W = {

          corr.push(L.id + ":" + c);

          var rText = function (rid) { var r = ex.right.filter(function (x) { return x.id === rid; })[0]; return r ? r.text : "(no answer)"; };
          items.push({
            state: isC ? "correct" : (chosen[L.id] ? "wrong" : "missed"),
            text: L.text + " → " + rText(c),

        return { selected: sel, correct: corr, items: items };

  }

  function widgetOrder(ex, idx, disp) {
    var node = el("div", { class: "widget" });
    node.appendChild(el("p", { class: "widget-note", text: "Put the items in the correct order. Use the arrow buttons or drag the rows. Each item in its correct position earns credit; each misplaced item subtracts." }));
    var list = el("ul", { class: "order-list" });
    node.appendChild(list);
    var cur = (disp && disp.length ? disp.slice() : shuffle(ex.items.map(function (i) { return i.id; })));
    function itemById(id) { return ex.items.filter(function (i) { return i.id === id; })[0]; }
    function draw() {
      list.innerHTML = "";
      cur.forEach(function (id, i) {
        var li = el("li", { class: "order-item", draggable: "true", "data-oid": id });
        li.appendChild(el("span", { class: "pos-no", text: String(i + 1) }));
        li.appendChild(el("span", { class: "o-text", text: itemById(id).text }));
        var btns = el("span", { class: "order-btns" });
        var up = el("button", { type: "button", text: "↑", "aria-label": "Move item " + (i + 1) + " up" });
        var dn = el("button", { type: "button", text: "↓", "aria-label": "Move item " + (i + 1) + " down" });
        up.addEventListener("click", function () { if (i > 0) { var t = cur[i - 1]; cur[i - 1] = cur[i]; cur[i] = t; draw(); } });
        dn.addEventListener("click", function () { if (i < cur.length - 1) { var t = cur[i + 1]; cur[i + 1] = cur[i]; cur[i] = t; draw(); } });
        btns.appendChild(up); btns.appendChild(dn);
        li.appendChild(btns);
        li.addEventListener("dragstart", function (ev) { ev.dataTransfer.setData("text/plain", String(i)); li.classList.add("dragging"); });
        li.addEventListener("dragend", function () { li.classList.remove("dragging"); });
        li.addEventListener("dragover", function (ev) { ev.preventDefault(); li.classList.add("drag-over"); });
        li.addEventListener("dragleave", function () { li.classList.remove("drag-over"); });
        li.addEventListener("drop", function (ev) {
          ev.preventDefault();
          var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (!isNaN(from) && from !== i) {
            var m = cur.splice(from, 1)[0];
            cur.splice(i, 0, m);
            draw();
          }
        });
        list.appendChild(li);
      });
    }
    draw();
    W = {
      selection: function () {
        var sel = [], corr = [], items = [];
        cur.forEach(function (id, i) {
          sel.push("pos" + i + ":" + id);
          items.push({ state: ex.items[i].id === id ? "correct" : "wrong", text: itemById(id).text, why: (ex.why && ex.why[id]) || ("Correct position: " + (ex.items.map(function (x) { return x.id; }).indexOf(id) + 1) + ".") });
        });
        ex.items.forEach(function (it, i) { corr.push("pos" + i + ":" + it.id); });
        return { selected: sel, correct: corr, items: items };
      }
    };
    return { node: node };
  }

  function widgetFill(ex, idx) {
    var node = el("div", { class: "widget" });
    var parts = String(ex.template).split(/\{\{(\d+)\}\}/);
    var line = el("div", { class: "fill-line" });
    var inputs = {};
    parts.forEach(function (p) {
      if (/^\d+$/.test(p)) {
        var inp = el("input", { class: "fill-input", type: "text", "aria-label": "Blank " + p, autocomplete: "off", spellcheck: "false" });
        inputs[p] = inp;
        line.appendChild(inp);
      } else {
        line.appendChild(document.createTextNode(p));
      }
    });
    node.appendChild(line);
    node.appendChild(el("p", { class: "widget-note", text: "Type one word or short phrase per blank. Spelling must match the accepted form. Each correct blank earns credit." }));
    function norm(v) {
      return String(v || "").toLowerCase().trim().replace(/\s+/g, " ").replace(/[.,;:!"]+$/g, "");
    }
    W = {
      selection: function () {
        var sel = [], corr = [], items = [];
        var hits = 0, wrong = 0, base = 0;
        ex.blanks.forEach(function (b, i) {
          var id = "b" + (i + 1);
          var inp = inputs[String(i + 1)];
          var v = norm(inp ? inp.value : "");
          if (v !== "") sel.push(id);
          var ok = b.accept.map(norm).indexOf(v) !== -1;
          corr.push(id); /* display: N = every blank */
          if (v !== "") { if (ok) hits += 1; else wrong += 1; } /* scoring: H = correct filled, W = wrong filled, N = every blank */
          items.push({
            state: ok ? "correct" : (v !== "" ? "wrong" : "missed"),
            text: "Blank " + (i + 1) + " — expected: " + b.display,
            why: b.why || ""
          });
        });
        base = Math.max(0, (hits - wrong) / Math.max(1, ex.blanks.length));
        return { selected: sel, correct: corr, items: items, base: base };
      }
    };
    return { node: node };
  }

  function widgetTerminal(ex, idx) {
