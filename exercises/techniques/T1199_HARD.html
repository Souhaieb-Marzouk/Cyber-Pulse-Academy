.rules{margin:0;padding-left:20px;color:var(--text-secondary);font-size:.95rem}
.rules li{margin:7px 0}
.rules b{color:var(--text-primary)}
.typlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.typ{border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.8rem;color:var(--text-secondary);background:var(--bg-surface-2)}
.hidden{display:none!important}
@media (max-width:640px){
  .matchwrap{grid-template-columns:1fr}
  #app{padding:10px 10px 32px}
  .block-b{padding:10px 12px}

}
@media (prefers-reduced-motion:reduce){
  .progress>i{animation:none}
  *{transition:none!important;scroll-behavior:auto!important}
}
.tb-part{color:var(--text-secondary);font-size:.85rem;letter-spacing:.02em}
.t-dot.d-r{background:var(--state-incorrect)}.t-dot.d-a{background:var(--state-partial)}.t-dot.d-g{background:var(--state-correct)}
.ordlist li button{min-width:44px;min-height:44px}
.sc-toggle{min-height:44px}

var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1199 — Trusted Relationship</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>Senior-shift material.<\/b> In these exercises the concepts interact: you correlate partner logins with elevation, separate <b>trusted-relationship abuse<\/b> from stolen staff credentials and from <b>supply-chain<\/b> compromise, and judge partner actions that look alarming but are benign — or look routine but are not.<\/p><p>Real actors from the ATT&amp;CK procedure table appear as evidence: APT28's committee-to-committee pivot, GOLD SOUTHFIELD's ransomware through MSPs, menuPass riding legitimate MSP access, POLONIUM arriving with IT-company credentials, and RedCurl entering through a contractor.<\/p><p>You will also choose the <b>least-aggressive<\/b> containment that still works, read one artefact from both the red side and the blue side, and dodge the plausible shortcuts that feel right and are wrong. Watch the ticket, the scope, and the role — the paper trail separates partner work from partner abuse.<\/p>","themes":[{"name":"Telemetry & detection chains","concepts":["correlating partner logins with elevation events","legitimate delegated admin activity","detection strategy DET0488 analytics (AN1344–AN1347)"]},{"name":"Containment & vendor governance","concepts":["conditional access for external identities","least-aggressive containment of third-party sessions"]},{"name":"Real actors & analytical traps","concepts":["trusted relationship vs stolen employee creds","supply chain vs trusted relationship","scheduled vendor maintenance (looks benign, may not be)","multi-customer MSP pivot attribution","real actor procedures (APT28, APT29, GOLD SOUTHFIELD, HAFNIUM, LAPSUS$, menuPass, NIMBUS MANTICORE, POLONIUM, RedCurl)"]}]};
var EXERCISES=[{"id":"EX-01","type":"line-select","summary":"Find the partner chain in a correlated auth panel.","concepts":["correlating partner logins with elevation events","detection strategy DET0488 analytics (AN1344–AN1347)"],"scenario":"<p>Correlated panel from Northwind bastion <span class=\"mono\">bastion-nw01<\/span> (auth + sudo). The vendor account is <span class=\"mono\">svc-redoak<\/span> (RedOak Operations, partner ASN 9009).<\/p>","question":"<p>Click <b>every<\/b> line that belongs to the AN1345-style third-party chain (partner login → elevation → sensitive target).<\/p>","logLines":["01:12  sshd  accepted publickey for svc-redoak from 198[.]51[.]100[.]40 port 51022  (partner ASN 9009)","01:13  sudo: svc-redoak : TTY=pts/0 ; PWD=/home/svc-redoak ; USER=root ; COMMAND=/usr/bin/id","01:41  sshd  accepted publickey for deployci from 198[.]51[.]100[.]40 port 51190  (partner ASN 9009)","02:03  sudo: deployci : command not allowed ; USER=root ; COMMAND=/bin/cat /etc/shadow","02:20  sshd  accepted publickey for svc-redoak from 203[.]0[.]113[.]88 port 33010  (residential ASN)","02:26  sshd  connection closed by 10[.]20[.]4[.]31 port 22 [preauth]"],"badLines":[0,1,3],"artifactNote":"Correlated sshd + sudo panel, single night.","hint":"Partner ASN first, then what each identity does in the minutes after.","explanation":"<p>Lines 1, 2 and 4 form the chain: partner-ASN SSH login as <span class=\"mono\">svc-redoak<\/span>, immediate sudo toward root, and — from the same tunnel — <span class=\"mono\">deployci<\/span> probing <span class=\"mono\">/etc/shadow<\/span>. Line 5 is the same vendor account later from a residential ASN: notable, but a separate thread, not this chain. The preauth close is noise.<\/p>","study":"DET0488 analytics AN1344–AN1347: each one chains third-party context with elevation and target."},{"id":"EX-02","type":"qcm-single","summary":"Which evidence proves third-party context, not stolen staff creds?","concepts":["trusted relationship vs stolen employee creds"],"scenario":"<p>Two sign-ins reached the same file share on <span class=\"mono\">SRV-DC02<\/span> within ten minutes: one with a valid Northwind admin account from the office range, one with <span class=\"mono\">svc-corevantage-admin@corevantage[.]example<\/span> over delegated admin from the partner ASN. The incident owner asks which one is the <b>T1199<\/b> case.<\/p>","question":"<p>Which single artefact settles the classification?<\/p>","options":["The number of files each identity copied","The delegated-admin sign-in's cross-tenant and partner-ASN metadata","The file share ACL showing the admin account as owner","The office badge record for the staff admin"],"correct":1,"hint":"Classification needs identity origin, not damage size.","explanation":"<p>T1199 is defined by the <b>entry path<\/b>: the partner-identity sign-in with cross-tenant metadata and partner ASN proves third-party context. Copy counts, share ACLs, and badge records describe activity or the employee — not the relationship that opened the door.<\/p>","study":"Classify first by who the identity belongs to; decide impact after."},{"id":"EX-03","type":"multi-step","summary":"GOLD SOUTHFIELD-style MSP breach is unfolding.","concepts":["least-aggressive containment of third-party sessions","multi-customer MSP pivot attribution"],"scenario":"<p>04:10. Your EDR flags the CoreVantage RMM agent pushing a ransomware loader to three Northwind servers. Intel note: GOLD SOUTHFIELD (G0115) historically breached MSPs to deliver ransomware to their customers. The MSP console is still connected. Finance runs its overnight batch in 50 minutes.<\/p>","question":"<p>You run the bridge. Three calls.<\/p>","steps":[{"prompt":"What is the least-aggressive action that still stops the push?","options":["Shut down all three servers and the whole estate","Block the RMM agent's egress and revoke its active sessions at the network edge","Unplug the building's internet line"],"correct":1,"outcome":"Right — cut the vendor channel's egress and kill the sessions; the hosts stay up and the batch keeps its chance."},{"prompt":"The MSP console also pushes into customer blocks you do not own. What next?","options":["Log into the MSP console and wipe it to protect everyone","Notify the MSP's security contact and your national CSIRT channel with timestamps","Post the IOCs on public social media first"],"correct":1,"outcome":"Correct — the MSP and CSIRT can warn other customers; tampering with a shared console destroys multi-tenant evidence."},{"prompt":"Finance demands the batch runs. What do you allow?","options":["Run the batch only after the RMM egress block is verified and the three hosts are re-imaged","Run it anyway with no checks","Cancel the quarter's reporting permanently"],"correct":0,"outcome":"Good — verified containment first, then business as usual; least-aggressive does not mean least-careful."}],"hint":"Cut the channel, not the hospital: contain the path, preserve the evidence, involve those who own the other tenants.","explanation":"<p>Least-aggressive containment blocks the <b>vendor channel<\/b> (egress plus sessions) instead of torching hosts, coordinates through the MSP and CSIRT because other customers share the console, and lets business resume only after verified containment. Real G0115 cases spread exactly this way.<\/p>","study":"ATT&CK G0115 GOLD SOUTHFIELD procedure example; pre-write your MSP incident SLA."},{"id":"EX-04","type":"fill-blank","summary":"Complete the external-identity conditional access rule.","concepts":["conditional access for external identities"],"scenario":"<p>Draft the partner-side conditional access rule for the identity team's design doc.<\/p>","question":"<p>Fill the blanks: conditional access for partner identities should demand <input1> on every session and scope the session to the <input2> named in the contract.<\/p>","template":"Fill the blanks: conditional access for partner identities should demand <input1> on every session and scope the session to the <input2> named in the contract.","blanks":[{"answer":"MFA","alts":["mfa","multi-factor authentication","multifactor authentication","phishing-resistant mfa"],"placeholder":"control","width":6},{"answer":"applications","alts":["apps","resources"],"placeholder":"noun","width":13}],"hint":"Blank 1 is the ATT&CK mitigation M1032; blank 2 is what the contract names.","explanation":"<p>Require <b>MFA (M1032)<\/b> for external identities and scope sessions to the contract-named <b>applications<\/b>. A stolen partner password alone is then not enough, and even a valid partner session cannot wander outside its agreement.<\/p>","study":"Draft one CA policy: guests and partner ASNs → MFA + app filter + short session lifetime."},{"id":"EX-05","type":"terminal","summary":"Prove the vendor chain on the Linux bastion.","concepts":["correlating partner logins with elevation events","detection strategy DET0488 analytics (AN1344–AN1347)"],"scenario":"<p>You are on <span class=\"mono\">bastion-nw01<\/span>. Objective: pull every authentication line for the vendor account <span class=\"mono\">svc-redoak<\/span> out of <span class=\"mono\">/var/log/auth.log<\/span>, keeping the full lines for the ticket. No tool names are given — choose your own.<\/p>","question":"<p>Type one command that prints all auth.log lines mentioning <span class=\"mono\">svc-redoak<\/span>.<\/p>","shellPrompt":"bastion-nw01:~$ ","expected":"grep svc-redoak /var/log/auth.log","elements":[{"any":["grep","egrep","rg","awk"],"label":"a text-filtering tool"},{"any":["auth.log"],"label":"the auth.log file"},{"any":["svc-redoak"],"label":"the vendor account name"}],"hint":"One filter command, one file, one account name — full lines land in the ticket.","explanation":"<p><span class=\"mono\">grep svc-redoak /var/log/auth.log<\/span> (or an awk/rg equivalent) keeps whole lines — timestamps, source IPs, sudo records — which is exactly the evidence AN1345 correlates. Over-filtering or cutting fields would destroy the context your correlation needs.<\/p>","study":"Practise pulling one identity's full history from auth.log without losing fields."},{"id":"EX-06","type":"qcm-multi","summary":"Three customers, one MSP, one night.","concepts":["multi-customer MSP pivot attribution"],"scenario":"<p>Same night, same partner ASN, same RMM loader hash: Northwind Traders, HelioGuard Manufacturing, and Lakeview Dental all show it. The MSP denies everything.<\/p>","question":"<p>Select the <b>two<\/b> professionally correct moves.<\/p>","options":["Close three independent cases and never record the link between them","Treat the MSP compromise as the likely common root and correlate the three timelines","Name GOLD SOUTHFIELD as the confirmed attacker in all three public reports","Notify through the incident channels agreed with the MSP and CSIRT so other customers get warned"],"correct":[1,3],"hint":"Common root first; responsible sharing second; public attribution is not yours to confirm.","explanation":"<p>Correlate around the likely <b>MSP root compromise<\/b> and warn peers through agreed channels. Siloing the cases loses the pattern, and publicly naming G0115 without evidence is attribution you cannot yet prove.<\/p>","study":"Practise multi-tenant IR: one evidence board, many victim organisations."},{"id":"EX-07","type":"drag-drop","summary":"Sort partner actions: documented maintenance vs quiet abuse.","concepts":["scheduled vendor maintenance (looks benign, may not be)","legitimate delegated admin activity"],"scenario":"<p>Four CoreVantage actions are queued for review. The clock reads 02:00–03:10 in all of them — so the hour will not help you.<\/p>","question":"<p>Place each action into the right bucket.<\/p>","bank":["RMM script push at 02:00 inside the documented change window with ticket #CH-2201","Delegated admin resets a locked service account, ticketed and within its assigned role","Partner tech exports the full user list at 03:00, no ticket, outside contract scope","Delegated admin adds itself to the billing admin role at 03:10 with no change record"],"slots":[{"label":"Looks alarming but is benign","accept":[0,1]},{"label":"Looks routine but is abuse","accept":[2,3]}],"hint":"Check ticket, scope, and role: the paper trail separates them, not the clock.","explanation":"<p>The 02:00 script push and the ticketed account reset <b>look alarming but are benign<\/b> — documented window, named ticket, within role. The unticketed 03:00 export and the self-assigned billing role <b>look routine but are abuse<\/b>: quiet scope creep is exactly how T1199 stays invisible.<\/p>","study":"Judge partner activity by ticket + scope + role, never by hour alone."},{"id":"EX-08","type":"qcm-single","summary":"Is this supply chain or trusted relationship abuse?","concepts":["supply chain vs trusted relationship"],"scenario":"<p>CoreVantage's monitoring stack was hit in two variants. Variant A: attackers hid malware inside the agent's signed installer, which every customer then downloaded. Variant B: attackers stole CoreVantage's console credentials and used the console's normal remote commands to reach customers.<\/p>","question":"<p>Which statement classifies variant B correctly?<\/p>","options":["Supply chain compromise — the shipped installer was tampered with","Both variants are supply chain compromise by definition","Trusted relationship abuse — normal partner tooling used with stolen access","Neither variant is in scope of T1199 at all"],"correct":2,"hint":"Ask what was changed: the shipped software, or who holds the keys to normal access.","explanation":"<p>Variant B is <b>trusted relationship abuse (T1199)<\/b>: the attacker uses the partner's standing access and normal tooling. Variant A tampers with shipped software — that is supply chain compromise. The difference decides whether you hunt bad binaries or bad sessions.<\/p>","study":"Compare ATT&CK T1199 with the supply-chain techniques; note where they can chain."}];

EXERCISES.push({"id":"EX-09","type":"line-select","summary":"Pick the delegated-admin escalation lines in the mixed panel.","concepts":["legitimate delegated admin activity","correlating partner logins with elevation events"],"scenario":"<p>Mixed Azure AD sign-in + audit panel for Northwind. The partner identity is <span class=\"mono\">svc-corevantage-admin<\/span>; its contracted support scope is Exchange helpdesk tasks only.<\/p>","question":"<p>Click the <b>two<\/b> audit lines showing delegated-admin role escalation by the partner identity.<\/p>","logLines":["09:02  SignIn  svc-corevantage-admin  userType=Guest  partner ASN 9009  result=success","09:04  Audit   Add member to role 'Exchange Administrator'  actor=svc-corevantage-admin  target=self","09:05  SignIn  d.reyes@northwind[.]example  userType=Member  corp range  result=success  mfa=satisfied","09:18  Audit   Set-Mailbox -AutoReply for shared-sales  actor=svc-corevantage-admin  (assigned role scope)","09:26  Audit   Add member to role 'Global Administrator'  actor=svc-corevantage-admin  target=self","09:31  SignIn  svc-corevantage-admin  result=failure  error=50126"],"badLines":[1,4],"artifactNote":"Azure AD mixed sign-in + audit panel, morning window.","hint":"Which role additions exceed what a support partner ever needs?","explanation":"<p>Lines 2 and 5 are the partner <b>adding itself<\/b> to Exchange Administrator and Global Administrator — escalation far outside support scope. Line 4's mailbox autoreply change sits inside the delegated role; the plain sign-in and the failed login are context, not escalation.<\/p>","study":"Alert on any partner role self-add; support partners never need directory roles."},
{"id":"EX-10","type":"multi-step","summary":"One DAP console, two sides of the glass.","concepts":["correlating partner logins with elevation events","legitimate delegated admin activity","detection strategy DET0488 analytics (AN1344–AN1347)"],"scenario":"<p>Same artefact for both questions — the delegated-admin panel:<\/p><pre class=\"art mono\">DAP session  partner=CoreVantage IT  tenant=northwind\n10:12  sign-in from partner ASN 9009  mfa=satisfied\n10:15  role activated: Helpdesk Administrator (scoped)\n10:22  role activated: Global Administrator (unscoped!)\n10:24  mailbox export started on CFO mailbox<\/pre>","question":"<p>Three decisions across the glass.<\/p>","steps":[{"prompt":"[Red side] You have just captured this partner's session. What is your next move to keep access durable?","options":["Add a new federation or OAuth trust from the tenant so access survives token rotation","Change one helpdesk password and leave","Delete the mailbox export history"],"correct":0,"outcome":"As red you persist by adding your own trust — a new grant or app consent survives even when the partner password rotates."},{"prompt":"[Blue side] You see this panel in the SOC. Which detection step catches the pivot earliest?","options":["Alert on delegated-admin role activation that exceeds the partner's contracted scope","Wait for antivirus to flag the export tool","Only review sign-ins monthly"],"correct":0,"outcome":"Blue catches it at 10:22 — a scoped partner activating an unscoped Global Admin role is the earliest, cheapest tell (AN1347)."},{"prompt":"[Decision] Which single control would have stopped 10:22 outright?","options":["Conditional access limiting partner roles to the contracted set","A faster firewall","Disabling the finance team's laptops"],"correct":0,"outcome":"Right — the role-scope control kills the escalation itself, which is cheaper than hunting the export afterwards."}],"hint":"Red wants durable access; blue wants the cheapest earliest signal; the control should kill the role jump itself.","explanation":"<p>Red persists by creating a <b>new trust<\/b>, blue's earliest catch is the <b>out-of-scope role activation<\/b>, and a role-scope conditional access control stops the jump at 10:22. Reading both sides of one artefact is how T1199 cases are argued end-to-end.<\/p>","study":"Write the red/blue pair into your T1199 tabletop plan."},
{"id":"EX-11","type":"ordering","summary":"Order the multi-tenant MSP pivot investigation.","concepts":["multi-customer MSP pivot attribution","least-aggressive containment of third-party sessions"],"scenario":"<p>You are first on the multi-tenant bridge after the MSP pivot is confirmed. Put the investigation steps in order.<\/p>","question":"<p>Order the steps from first to last.<\/p>","items":["Freeze and export your own tenant's logs first","Confirm partner context on every flagged session","Agree a joint timeline with the MSP and the other affected customers","Choose the containment window that fits all tenants"],"hint":"Your evidence first, context second, cooperation third, shared window last.","explanation":"<p>Export your logs before they rotate, confirm partner context so you chase the right sessions, build the joint timeline with the MSP and peers, then pick a containment window all tenants can survive.<\/p>","study":"Rehearse the sequence on paper before the real multi-tenant call."},
{"id":"EX-12","type":"qcm-single","summary":"02:00 agent script push with a change ticket: call it?","concepts":["scheduled vendor maintenance (looks benign, may not be)"],"scenario":"<p>02:00. The CoreVantage RMM pushes a PowerShell script to 40 workstations. The hash matches last quarter's maintenance package. Change <span class=\"mono\">#CH-2201<\/span> is approved, the window is booked, and the MSP's on-call engineer confirms by the emergency line. One workstation failed to run it.<\/p>","question":"<p>What is the correct call?<\/p>","options":["Declare an incident and isolate all 40 hosts now","Reply-all to the change ticket asking again","Disable the MSP account permanently mid-window","Documented maintenance — log it and note the failed host, no incident"],"correct":3,"hint":"Ticket, window, hash, live confirmation: what else would an attacker have had to fake?","explanation":"<p>Every marker of <b>documented maintenance<\/b> checks out — booked window, approved change, matching hash, live confirmation — so it is alarming-looking but benign. Note the one failed host and move on; mass isolation mid-window would break the very governance process your trust model relies on.<\/p>","study":"Keep a 'verified maintenance' board so the SOC can clear these in seconds."},
{"id":"EX-13","type":"matching","summary":"Match real actors to their trusted-relationship tradecraft.","concepts":["real actor procedures (APT28, APT29, GOLD SOUTHFIELD, HAFNIUM, LAPSUS$, menuPass, NIMBUS MANTICORE, POLONIUM, RedCurl)"],"scenario":"<p>You are building the T1199 actor card from the ATT&amp;CK procedure table.<\/p>","question":"<p>Match each actor to its documented third-party angle.<\/p>","pairs":[{"left":"APT28 (G0007)","right":"used the DCCC foothold to pivot into the DNC across the trust between the related organisations"},{"left":"menuPass (G0045)","right":"operated through legitimate MSP access to reach victims"},{"left":"POLONIUM (G1005)","right":"used IT company credentials to reach a law firm and an aviation target"},{"left":"RedCurl (G1039)","right":"pivoted through a contractor into the victim's infrastructure"}],"hint":"Committee-to-committee pivot, MSP access, IT-company creds, contractor pivot.","explanation":"<p>From the ATT&amp;CK procedure examples: <b>APT28<\/b> pivoted from the DCCC into the DNC via trusted overlap; <b>menuPass<\/b> used legitimate MSP access; <b>POLONIUM<\/b> abused IT-company credentials against a law firm and an aviation target; <b>RedCurl<\/b> entered through a contractor.<\/p>","study":"Read the T1199 procedure table and note each actor's third-party angle."},
{"id":"EX-14","type":"fill-blank","summary":"Complete the AN1344 analytic in words.","concepts":["detection strategy DET0488 analytics (AN1344–AN1347)"],"scenario":"<p>Write the Windows analytic into the detection handbook, in words.<\/p>","question":"<p>Fill the blanks: AN1344 on Windows fires when a third-party logon is followed by token <input1> and unusual <input2> access from that same context.<\/p>","template":"Fill the blanks: AN1344 on Windows fires when a third-party logon is followed by token <input1> and unusual <input2> access from that same context.","blanks":[{"answer":"elevation","alts":["elevation event","escalation","escalation event"],"placeholder":"rights event","width":10},{"answer":"resource","alts":["data"],"placeholder":"target","width":9}],"hint":"One word for rights going up, one word for what is being touched.","explanation":"<p>AN1344 correlates third-party logon → token <b>elevation<\/b> → unusual <b>resource<\/b> access. The analytics win by chaining, because each step alone is common and quiet on a real network.<\/p>","study":"DET0488's four analytics: AN1344 Windows, AN1345 sshd, AN1346 macOS, AN1347 delegated admin."},
{"id":"EX-15","type":"matching","summary":"Match each external-identity control to what it stops.","concepts":["conditional access for external identities"],"scenario":"<p>Finish the identity workshop. Three controls, three attacker behaviours.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"Require MFA for all external users","right":"blocks replay of a phished partner password"},{"left":"Block legacy authentication protocols","right":"stops logins that bypass modern MFA"},{"left":"Contract-scoped app filter","right":"keeps a valid partner session inside its agreement"}],"hint":"Password replay, protocol bypass, scope creep — one control each.","explanation":"<p>MFA requirements stop <b>password replay<\/b>; legacy-auth blocks stop protocols that <b>bypass MFA<\/b>; a contract-scoped app filter stops <b>scope creep<\/b> by an otherwise valid session. Together they answer most partner-identity risk.<\/p>","study":"Turn the three pairs into real policy names in your identity provider."});

  function tick() {

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {

      });

    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */

  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');

    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');

  }
  function showPauseVeil() {

    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');

  function hidePauseVeil() {

  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);

      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);

  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });

    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
