  wrap.appendChild(ans);
  v.appendChild(wrap);
  $('#scen-sum').textContent = ex.scenario.summary;
  var hb = $('#btn-hint'); if (hb) hb.disabled = !!S.hintUsed[ex.uid];
  EXSTATE[ex.uid] = { ready: false };
  RENDER[ex.type](ex, $('#widget'));
  buildActions();
}

function buildActions(){
  var ex = curEx();
  var box = $('#ex-actions'); box.innerHTML = '';
  var isChecked = !!S.checked[ex.uid];
  if (!isChecked){
    var b = mk('button', 'btn-check', '✓ Check');
    b.id = 'btn-check';
    b.addEventListener('click', onCheck);
    box.appendChild(b);
    var nx = mk('button', 'btn-next hidden', S.idx === EXERCISES.length - 1 ? 'Final Submit ➜' : 'Next ➜');
    nx.id = 'btn-next'; box.appendChild(nx);
  } else {
    var nx2 = mk('button', 'btn-next', (S.fromReview ? '↩ Back to skipped review' : (S.idx === EXERCISES.length - 1 ? '🏁 Final Submit' : 'Next ➜')));
    nx2.id = 'btn-next';
    nx2.addEventListener('click', onNext);
    box.appendChild(nx2);
  }
}

function onCheck(){
  var ex = curEx();
  if (S.checked[ex.uid]) return;
  var st = EXSTATE[ex.uid];
  var res = COLLECT[ex.type](ex, st);
  if (res == null){
    var flash = $('#ans-flash');
    if (!flash){ flash = mk('div', 'fb-flash', ''); flash.id = 'ans-flash'; $('#ex-actions').parentNode.insertBefore(flash, $('#ex-actions')); }
    flash.innerHTML = '⚠ <b>Not answered yet.</b> Choose an answer (or press Skip to come back later).';
    flash.setAttribute('role', 'alert');
    return;
  }
  var oldFlash = $('#ans-flash'); if (oldFlash) oldFlash.remove();
  var sc = scoreExercise(res.sel, res.correct);
  var credit = sc.credit;
  if (S.hintUsed[ex.uid]) credit = Math.max(0, credit - 0.10);
  S.checked[ex.uid] = true;
  S.credits[ex.uid] = credit;
  S.sum += credit; S.answered += 1;
  tSet('PAUSED_AUTO_CHECK');
  updateScore();
  var fb = $('#fb');
  fb.appendChild(renderFeedback(ex, sc, credit, res));
  var hb2 = $('#btn-hint'); if (hb2) hb2.disabled = true;
  if (S.idx === EXERCISES.length - 1){
    $('#btn-next') && ($('#btn-next').innerHTML = '🏁 Final Submit');
  } else {
    $('#btn-next') && $('#btn-next').classList.remove('hidden');
  }
  var bc = $('#btn-check'); if (bc) bc.classList.add('hidden');
  $('#widget').querySelectorAll('button').forEach(function(b){ if (b.id !== 'btn-next') b.disabled = true; });
  buildActions();
  var nx = $('#btn-next'); if (nx) nx.focus();
  sIntoView(fb);
}

function label(x){ return x > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT'; }
function stripTags(s){ return String(s).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
function zoneName(ex, zid){ var z = ex.zones.filter(function(z2){ return z2.id === zid; })[0]; return z ? z.name : zid; }
/* keyMap: every selectable key -> {label, why} so wrong picks can be explained row by row */
function keyMapFor(ex){
  var m = {}, i, j;
  var okkOf = function(opts){ var r = -1; opts.forEach(function(o, k){ if (r < 0 && o.ok) r = k; }); return r; };
  if (ex.type === 'mcq' || ex.type === 'multi'){
    ex.options.forEach(function(o, k){ m[k] = { label: stripTags(o.t).slice(0, 70), why: o.why || '' }; });
  } else if (ex.type === 'match'){
    ex.left.forEach(function(l, i){
      ex.right.forEach(function(r, j){
        var ok = ex.pairs[i] === j;
        m['L' + i + 'R' + j] = { label: l + ' → ' + r,
          why: ok ? (ex.why[i] || '') : ('“' + l + '” pairs with “' + ex.right[ex.pairs[i]] + '”, not with “' + r + '”. ' + (ex.why[i] || '')) };
      });
    });
  } else if (ex.type === 'dnd'){
    ex.items.forEach(function(it, i){
      ex.zones.forEach(function(z){
        var ok = it.z === z.id;
        m[i + ':' + z.id] = { label: stripTags(it.t).slice(0, 70) + ' → ' + z.name,
          why: ok ? (it.why || '') : ('Correct zone: ' + zoneName(ex, it.z) + '. ' + (it.why || '')) };
      });
    });
  } else if (ex.type === 'fill'){
    ex.answers.forEach(function(a, bi){
      ex.bank.forEach(function(w){
        var ok = w === a;
        m[bi + ':' + w] = { label: 'Blank ' + (bi + 1) + ': “' + w + '”',
          why: ok ? (ex.why[bi] || '') : ('Blank ' + (bi + 1) + ' needs “' + a + '”. ' + (ex.why[bi] || '')) };
      });
    });
  } else if (ex.type === 'order'){
    ex.items.forEach(function(it, i){
      ex.correctOrder.forEach(function(ci, pos){
        var ok = ci === i;
        m[pos + ':' + i] = { label: 'Position ' + (pos + 1) + ': ' + stripTags(it.t).slice(0, 70),
          why: ok ? (ex.why[i] || '') : ('Position ' + (pos + 1) + ' needs “' + stripTags(ex.items[ci].t) + '”. ' + (ex.why[ci] || ex.why[i] || '')) };
      });
    });
  } else if (ex.type === 'list'){
    ex.list.forEach(function(it, i){
      var okk = okkOf(it.options);
      it.options.forEach(function(o, k){
        m[i + ':' + k] = { label: stripTags(it.t).slice(0, 64) + '…',
          why: k === okk ? (it.why || '') : ('The right call here is “' + stripTags(it.options[okk].t) + '”. ' + (it.why || '')) };
      });
    });
  } else if (ex.type === 'steps'){
    ex.steps.forEach(function(s, i){
      var okk = okkOf(s.options);
      s.options.forEach(function(o, k){
        m[i + ':' + k] = { label: 'Step ' + (i + 1),
          why: k === okk ? (s.why || '') : ('Better: “' + stripTags(s.options[okk].t) + '”. ' + (s.why || '')) };
      });
    });
  }
  return m;
}

/* ---------- feedback rendering (correct + missed + wrong rows) ---------- */
function renderFeedback(ex, sc, credit, res){
  var cls = sc.credit === 1 ? 'fb-correct' : (sc.credit > 0 ? 'fb-partial' : 'fb-incorrect');
  var icon = sc.credit === 1 ? '✓' : (sc.credit > 0 ? '✓' : '✗');
  var word = sc.credit === 1 ? 'CORRECT' : (sc.credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT');
  var d = mk('div', 'fb ' + cls);
  var head = '<span class="fb-label" role="status" aria-label="' + word + '">' + icon + ' ' + word + '</span>';
  if (sc.N > 1) head += '<div class="credit-line">credit ' + credit.toFixed(2) + ' — ' + sc.H + '/' + sc.N + ' items correct' + (sc.W ? ', ' + sc.W + ' wrong item(s) selected' : '') + (S.hintUsed[ex.uid] ? ' · hint used: −0.10' : '') + '</div>';
  else head += '<div class="credit-line">credit ' + credit.toFixed(2) + (S.hintUsed[ex.uid] ? ' · hint used: −0.10' : '') + '</div>';
  d.innerHTML = head;
  if (ex.itemsMeta && ex.itemsMeta.length > 0){
    var rows = mk('div', 'item-rows');
    var rendered = {};
    function addRow(kind, lbl, why){
      var r = mk('div', 'item-row ' + (kind === 'c' ? 'ir-correct' : kind === 'w' ? 'ir-wrong' : 'ir-missed'));
      var iw = kind === 'c' ? '<span class="iw">✓ Correct</span>' : kind === 'w' ? '<span class="iw">✗ Wrong</span>' : '<span class="iw">○ Missed</span>';
      r.innerHTML = iw + '<span class="inote"><b>' + esc(lbl) + '</b> — ' + esc(why) + '</span>';
      rows.appendChild(r);
    }
    ex.itemsMeta.forEach(function(m){
      var selKey = res.sel.indexOf(m.key) >= 0, corKey = res.correct.indexOf(m.key) >= 0;
      var kind = corKey && selKey ? 'c' : (corKey && !selKey ? 'm' : (!corKey && selKey ? 'w' : null));
      if (!kind) return;
      rendered[m.key] = 1;
      addRow(kind, m.label, m.why);
    });
    (res.sel || []).forEach(function(sk){
      if (rendered[sk] || res.correct.indexOf(sk) >= 0) return;
      var info = (ex.keyMap || {})[sk];
      if (info) addRow('w', info.label, info.why);
    });
    d.appendChild(rows);
  }
  d.appendChild(mk('div', null, '<p>' + ex.explain + '</p>'));
  if (ex.persp) d.appendChild(mk('p', 'small', ex.persp));
  if (sc.credit < 1 && ex.study) d.appendChild(mk('div', 'study', '📚 <b>What to study:</b> ' + ex.study));
  return d;
}

function onNext(){
  var ex = curEx();
  if (!S.checked[ex.uid]) return;
  if (S.fromReview){
    S.fromReview = false;
    S.skipped = S.skipped.filter(function(u){ return u !== ex.uid; });
    if (T.state === 'PAUSED_AUTO_CHECK') tSet('RUNNING');
    renderReview();
    return;
  }
  if (S.idx < EXERCISES.length - 1){
    S.idx += 1;
    tSet('RUNNING');
    renderExercise();
  } else {
    finishAttempt();
  }
  /* Next ends the Check auto-pause: state transitions PAUSED_AUTO_CHECK -> RUNNING (or review/results) */
}

function onSkip(){
  if (S.view !== 'exam') return;
  var ex = curEx();
  if (S.checked[ex.uid]) return;
  if (S.skipped.indexOf(ex.uid) < 0) S.skipped.push(ex.uid);
  updateProgress();
  if (S.fromReview){ S.fromReview = false; renderReview(); return; }
  var n = nextUnanswered();
  if (n === -1){ renderReview(); return; }
  S.idx = n;
  renderExercise();
}
function nextUnanswered(){
  for (var i = 0; i < S.order.length; i++){
    var uid = EXERCISES[S.order[i]].uid;
    if (!S.checked[uid] && S.skipped.indexOf(uid) < 0) return i;
  }
  return -1;
}

function onHint(){
  if (S.view !== 'exam') return;
  var ex = curEx();
  if (S.checked[ex.uid] || S.hintUsed[ex.uid]) return;
  S.hintUsed[ex.uid] = true;
  var hb = $('#btn-hint'); if (hb) hb.disabled = true;
  $('#hintbox').innerHTML = '<div class="hint-panel" role="note" aria-label="Hint">💡 <b>Hint (this exercise −10% credit):</b> ' + ex.hint + '</div>';
}

function onManualPause(){
  if (S.view !== 'exam' && S.view !== 'review') return;
  if (T.state === 'RUNNING' || T.state === 'PAUSED_AUTO_CHECK'){
    T._prevBeforeManual = T.state;
    tSet('PAUSED_MANUAL');
    var ov = mk('div', 'pause-overlay');
    ov.innerHTML = '<div class="big">⏸ PAUSED — manual break</div><p>The exercise is hidden and the timer is stopped.</p><p class="small">Press Resume to go back. If you paused while reviewing feedback, you return to that state.</p>';
    var rb = mk('button', 'btn-primary', '▶ Resume');
    rb.addEventListener('click', function(){ ov.remove(); tSet(T._prevBeforeManual); });
    ov.appendChild(rb);
    document.body.appendChild(ov);
  }
}

function onTimeout(){
  S.view = 'review';
  if (S.skipped.length > 0){ renderReview(); }
  else { finishAttempt(true); }
}

function sweepUnanswered(){
  /* any exercise that was never answered (and not yet pooled) joins the
     skipped pool so the results screen can show it as excluded */
  EXERCISES.forEach(function(e){
    if (!S.checked[e.uid] && S.skipped.indexOf(e.uid) < 0) S.skipped.push(e.uid);
  });
}

/* ---------- review skipped ---------- */
function renderReview(){
  S.view = 'review';
  updateCounter(); renderTimerChip();
  var v = $('#view'); v.innerHTML = '';
  var ended = T.state === 'ENDED';
  var card = mk('div', 'card');
  card.innerHTML = '<div class="panel-head ph-grey"><span class="ic">⚠</span>Review skipped exercises</div>' +
    '<p class="small">Each row below was skipped. You may go back and answer it while the timer has not ended. Skipped exercises that stay unanswered are excluded from your score.</p>';
  if (ended) card.appendChild(mk('p', null, '<span class="rev-badge">⚠ Time is over</span> — <span class="small">you can no longer answer skipped exercises. Finish to see your result.</span>'));
  if (S.skipped.length === 0){
    card.appendChild(mk('p', null, 'No skipped exercises are waiting. You answered everything.'));
  } else {
    var orderPos = {};
    S.order.forEach(function(exIdx, pos){ orderPos[EXERCISES[exIdx].uid] = pos; });
    S.skipped.forEach(function(uid){
      var e2 = EXERCISES.filter(function(e3){ return e3.uid === uid; })[0];
      var row = mk('div', 'rev-row');
      row.innerHTML = '<span class="rev-badge">⚠ Skipped</span><span class="rt"><b>' + esc(e2.scenario.summary) + '</b><br><span class="small">' + esc(TYPE_NAMES[e2.type]) + '</span></span>';
      var btn = mk('button', 'btn-next', 'Answer now');
      if (ended){ btn.disabled = true; }
      btn.addEventListener('click', function(){
        S.idx = orderPos[uid]; S.fromReview = true; S.view = 'exam';
        if (T.state !== 'ENDED' && T.state !== 'PAUSED_MANUAL') tSet('RUNNING');
        renderExercise();
      });
      row.appendChild(btn);
      card.appendChild(row);
    });
  }
  var fin = mk('button', 'btn-primary', 'Finish and see results');
  fin.addEventListener('click', function(){ finishAttempt(true); });
  var wr = mk('div', 'start-row'); wr.appendChild(fin); card.appendChild(wr);
  v.appendChild(card);
}

/* ---------- results ---------- */
var reported = false;
function reportScore(){
  var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(S.sum),
      total: S.answered,
      percent: percent,
      passed: percent >= 70
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
function finishAttempt(force){
  /* The timer only ENDS when results are actually shown. Final Submit with a
     non-empty skipped pool first shows the review screen and keeps the timer
     state, so the learner can still answer skipped exercises while time runs. */
  if (!force && T.state !== 'ENDED'){
    sweepUnanswered();
    if (S.skipped.length > 0){
      if (T.state === 'PAUSED_AUTO_CHECK') tSet('RUNNING');
      renderReview();
      return;
    }
  }
  sweepUnanswered();
  tSet('ENDED');
  renderResults();
}
function renderResults(){
  S.view = 'results';
  ['#btn-hint', '#btn-pause', '#btn-skip'].forEach(function(id2){ var b = $(id2); if (b) b.classList.add('hidden'); });
  var full = 0, part = 0, zero = 0, skipped = S.skipped.length, partSum = 0;
  Object.keys(S.checked).forEach(function(uid){
    var c = S.credits[uid];
    if (c === 1) full++; else if (c > 0){ part++; partSum += c; } else zero++;
  });
  var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
  var passed = percent >= 70;
  var v = $('#view'); v.innerHTML = '';
  var card = mk('div', 'card');
  card.innerHTML = '<div class="panel-head ph-blue"><span class="ic">🏁</span>Final results</div>' +
    '<div class="res-grid">' +
      '<div class="res-cell res-correct"><div class="num">' + full + '</div><div class="lbl">✓ Fully correct</div></div>' +
      '<div class="res-cell res-partial"><div class="num">' + part + '</div><div class="lbl">✓ Partially correct' + (part ? ' — avg ' + (partSum / part).toFixed(2) : '') + '</div></div>' +
      '<div class="res-cell res-incorrect"><div class="num">' + zero + '</div><div class="lbl">✗ Fully incorrect</div></div>' +
      '<div class="res-cell res-skipped"><div class="num">' + skipped + '</div><div class="lbl">⚠ Skipped — excluded</div></div>' +
    '</div>' +
    '<p class="mono">Answered: ' + S.answered + ' · Sum of credits: ' + S.sum.toFixed(1) + ' · Final percent: <b>' + percent + '%</b> (pass mark 70%)</p>' +
    '<p class="pause-log">Time paused manually: ' + fmtSecs(T.manualMs) + ' · Time paused reviewing feedback: ' + fmtSecs(T.autoMs) + '</p>' +
    '<div class="verdict ' + (passed ? 'verdict-pass' : 'verdict-fail') + '">' +
      '<div class="v-big" aria-label="' + (passed ? 'PASS' : 'FAIL') + '">' + (passed ? '✓ PASS' : '✗ FAIL') + '</div>' +
      '<p>' + (passed ? 'You have reached the pass mark. Well done.' : 'You are below the pass mark. Review the explanations and retake the exam.') + '</p>' +
    '</div>';
  var row = mk('div', 'start-row');
  var ret = mk('button', 'btn-primary', '↻ Retake exam');
  ret.addEventListener('click', function(){ reported = false; startExam(); });
  row.appendChild(ret); card.appendChild(row);
  v.appendChild(card);
  if (!reported){ reportScore(); reported = true; }
}

/* ---------- handshake ---------- */
window.addEventListener('message', function(event){
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  /* username, country, locale, topicId, batch are accepted; theme is always 'dark' — the file is dark-only, nothing to switch. */
});

/* ---------- renderers & collectors ---------- */
var TYPE_NAMES = {
  mcq: 'Single-answer question (QCM)', multi: 'Multi-select question with partial credit',
  match: 'Matching pairs with partial credit', dnd: 'Drag-and-drop classification with partial credit',
  fill: 'Fill-in-the-blank from a shuffled word bank', order: 'Ordering / ranking with partial credit',
  list: 'Per-item decision exercise with partial credit', steps: 'Multi-step branching scenario'
};
var RENDER = {}, COLLECT = {};

/* mcq + multi */
RENDER.mcq = RENDER.multi = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.opts = shuffle(ex.options.map(function(o, i){ return { i: i, o: o }; }));
  st.sel = [];
  var b = mk('div', null);
  st.opts.forEach(function(p, k){
    var r = mk('button', 'opt-row');
    r.type = 'button';
    r.setAttribute('aria-pressed', 'false');
    r.innerHTML = '<span class="ol">' + 'ABCDEF'[k] + '.</span><span>' + p.o.t + '</span>';
    r.addEventListener('click', function(){
      if (S.checked[ex.uid]) return;
      if (ex.type === 'mcq'){
        st.sel = [p.i]; 
        b.querySelectorAll('.opt-row').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        r.setAttribute('aria-pressed', 'true');
      } else {
        var ix = st.sel.indexOf(p.i);
        if (ix >= 0){ st.sel.splice(ix, 1); r.setAttribute('aria-pressed', 'false'); }
        else { st.sel.push(p.i); r.setAttribute('aria-pressed', 'true'); }
      }
    });
    b.appendChild(r);
  });
  if (ex.type === 'multi') b.appendChild(mk('p', 'small', 'Select all options that apply. Partial credit applies: correct picks add, wrong picks subtract.'));
  box.appendChild(b);
};
COLLECT.mcq = COLLECT.multi = function(ex, st){
  if (!st.sel || st.sel.length === 0) return null;
  var correct = [];
  ex.options.forEach(function(o, i){ if (o.ok) correct.push(i); });
  return { sel: st.sel, correct: correct };
};
/* itemsMeta for mcq/multi */
function metaMcqMulti(ex){
  return ex.options.map(function(o, i){ return { key: i, label: o.t.slice(0, 70), why: o.why }; });
}

/* match */
RENDER.match = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.rightOrder = shuffle(ex.right.map(function(r, i){ return i; }));
  st.pairs = {}; st.selL = null; st.selR = null;
  var w = mk('div', 'match-wrap');
  var L = mk('div'), R = mk('div');
  L.appendChild(mk('p', 'small mono', 'LEFT — click one, then its partner on the right'));
  ex.left.forEach(function(l, i){
    var c = mk('div', 'mcard'); c.tabIndex = 0; c.setAttribute('role', 'button'); keyact(c);
    c.innerHTML = '<b>' + esc(l) + '</b><div class="pairline" id="pl-L' + i + '"></div>';
    c.addEventListener('click', function(){
      if (S.checked[ex.uid]) return;
      if (st.pairs[i] != null){ delete st.pairs[i]; $('#pl-L' + i).textContent = ''; renderMatchRight(); return; }
      st.selL = i;
      w.querySelectorAll('.mcard').forEach(function(x){ x.classList.remove('sel'); });
      c.classList.add('sel');
      if (st.selR != null){ doPair(i, st.selR); }
    });
    L.appendChild(c);
  });
  R.appendChild(mk('p', 'small mono', 'RIGHT — click one to pair it'));
  ex.right.forEach(function(r, i){
    var c = mk('div', 'mcard'); c.tabIndex = 0; c.setAttribute('role', 'button'); keyact(c); c.id = 'mr-' + i;
    c.innerHTML = '<b>' + esc(r) + '</b>';
    c.addEventListener('click', function(){
      if (S.checked[ex.uid]) return;
      if (st.selL != null){ doPair(st.selL, i); }
      else { st.selR = i; w.querySelectorAll('.mcard').forEach(function(x){ x.classList.remove('sel'); }); c.classList.add('sel'); }
    });
    R.appendChild(c);
  });
  function doPair(l, r){
    Object.keys(st.pairs).forEach(function(k){ if (st.pairs[k] === r) delete st.pairs[k]; });
    st.pairs[l] = r; st.selL = null; st.selR = null;
    w.querySelectorAll('.mcard').forEach(function(x){ x.classList.remove('sel'); });
    $('#pl-L' + l).textContent = '→ ' + ex.right[r];
    renderMatchRight();
  }
  function renderMatchRight(){
    ex.left.forEach(function(l, i){ $('#pl-L' + i).textContent = st.pairs[i] != null ? '→ ' + ex.right[st.pairs[i]] : ''; });
  }
  w.appendChild(L); w.appendChild(R);
  box.appendChild(w);
  st._renderRight = renderMatchRight;
};
COLLECT.match = function(ex, st){
  var any = false;
  ex.left.forEach(function(x, i){ if (st.pairs[i] != null) any = true; });
  if (!any) return null;
  var selKeys = [], correctKeys = [];
  ex.left.forEach(function(x, i){
    correctKeys.push('L' + i + 'R' + ex.pairs[i]);
    if (st.pairs[i] != null) selKeys.push('L' + i + 'R' + st.pairs[i]);
  });
  return { sel: selKeys, correct: correctKeys };
};
function metaMatch(ex){
  return ex.left.map(function(l, i){ return { key: 'L' + i + 'R' + ex.pairs[i], label: l + ' → ' + ex.right[ex.pairs[i]], why: ex.why[i] }; });
}

/* dnd (classify / assign / matrix) */
RENDER.dnd = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.items = shuffle(ex.items.map(function(it, i){ return { i: i, t: it.t }; }));
  st.placed = {}; st.picked = null;
  var bank = mk('div', 'bank');
  bank.appendChild(mk('p', 'small mono', 'ITEM BANK — click an item, then click a zone (or drag it)'));
  var bwrap = mk('div'); bank.appendChild(bwrap);
  st.items.forEach(function(p){
    var pill = mk('span', 'pill'); pill.draggable = true; pill.tabIndex = 0; pill.setAttribute('role', 'button'); keyact(pill);
    pill.dataset.i = p.i; pill.id = 'pill-' + p.i;
    pill.innerHTML = '<span>' + esc(p.t) + '</span>';
    pill.addEventListener('click', function(){
      if (S.checked[ex.uid] || st.placed[p.i] != null) return;
      st.picked = (st.picked === p.i ? null : p.i);
      bwrap.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('picked'); });
      if (st.picked != null) pill.classList.add('picked');
    });
    pill.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', String(p.i)); });
    bwrap.appendChild(pill);
  });
  box.appendChild(bank);
  var zones = mk('div', 'zones');
  ex.zones.forEach(function(z){
    var zd = mk('div', 'zone'); zd.dataset.z = z.id; zd.tabIndex = 0; zd.setAttribute('role', 'button');
    zd.setAttribute('aria-label', 'Drop zone: ' + z.name + '. Select an item first, then press Enter here to place it.');
    keyact(zd);
    zd.innerHTML = '<h4>' + esc(z.name) + '</h4><div class="zitems"></div>';
    zd.addEventListener('click', function(){
      if (S.checked[ex.uid] || st.picked == null) return;
      place(st.picked, z.id);
    });
    zd.addEventListener('dragover', function(ev){ ev.preventDefault(); zd.classList.add('over'); });
    zd.addEventListener('dragleave', function(){ zd.classList.remove('over'); });
    zd.addEventListener('drop', function(ev){
      ev.preventDefault(); zd.classList.remove('over');
      if (S.checked[ex.uid]) return;
      place(Number(ev.dataTransfer.getData('text/plain')), z.id);
    });
    zones.appendChild(zd);
  });
  function place(i, zid){
    if (st.placed[i] != null) return;
    st.placed[i] = zid; st.picked = null;
    var pill = $('#pill-' + i); if (pill) pill.classList.add('picked');
    var zp = $('[data-z="' + zid + '"] .zitems');
    var chip = mk('span', 'pill'); chip.dataset.i = i; chip.tabIndex = 0; chip.setAttribute('role', 'button');
    chip.setAttribute('aria-label', 'Placed: ' + String(ex.items[i].t).replace(/<[^>]+>/g, ' ').trim() + '. Activate to return it to the item bank.');
    keyact(chip);
    chip.innerHTML = '<span>' + esc(ex.items[i].t) + '</span><span class="rm" aria-hidden="true">✕</span>';
    chip.addEventListener('click', function(){
      if (S.checked[ex.uid]) return;
      delete st.placed[i];
      var back = $('#pill-' + i); if (back) back.classList.remove('picked');
      chip.remove();
    });
    zp.appendChild(chip);
    var back = $('#pill-' + i); if (back) back.classList.remove('picked');
  }
  box.appendChild(zones);
};
COLLECT.dnd = function(ex, st){
  var sel = [], correct = [], n = 0;
  ex.items.forEach(function(it, i){
    correct.push(i + ':' + it.z);
    if (st.placed[i] != null) sel.push(i + ':' + st.placed[i]);
  });
  if (Object.keys(st.placed).length === 0) return null;
  return { sel: sel, correct: correct };
};
function metaDnd(ex){
  return ex.items.map(function(it, i){ return { key: i + ':' + it.z, label: it.t + ' → ' + ex.zones.filter(function(z){ return z.id === it.z; })[0].name, why: it.why }; });
}

/* fill */
RENDER.fill = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.bank = shuffle(ex.bank.map(function(w, i){ return { w: w, i: i, used: false }; }));
  st.placed = [];
  var p = mk('p', null);
  var parts = ex.text.split(/\{\{(\d+)\}\}/);
  p.innerHTML = parts.map(function(seg, k){
    if (k % 2 === 1) return ' <span class="blank" data-b="' + seg + '" role="button" tabindex="0" aria-label="Blank ' + seg + '">____</span> ';
    return esc(seg);
  }).join('');
  box.appendChild(p);
  var bank = mk('div', 'bank');
  bank.appendChild(mk('p', 'small mono', 'WORD BANK (shuffled) — click a word, then click a blank'));
  var bw = mk('div'); bank.appendChild(bw);
  st.bank.forEach(function(b, bi2){
    var pill = mk('span', 'pill'); pill.tabIndex = 0; pill.setAttribute('role', 'button'); keyact(pill);
    pill.dataset.wi = bi2; pill.innerHTML = '<span>' + esc(b.w) + '</span>';
    pill.addEventListener('click', function(){
      if (S.checked[ex.uid] || b.used) return;
      st.pick = bi2;
      bw.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('picked'); });
      pill.classList.add('picked');
    });
    bw.appendChild(pill);
  });
  box.appendChild(bank);
  p.querySelectorAll('.blank').forEach(function(bl){
    function act(){
      if (S.checked[ex.uid]) return;
      var bi = Number(bl.dataset.b);
      if (st.placed[bi] != null){
        var wi = st.placed[bi]; st.bank[wi].used = false; delete st.placed[bi];
        bl.textContent = '____'; bl.classList.remove('filled');
        var bp = bw.querySelector('[data-wi="' + wi + '"]'); if (bp) bp.classList.remove('picked'), bp.style.opacity = '1';
        st.pick = null; return;
      }
      if (st.pick == null) return;
      st.placed[bi] = st.pick; st.bank[st.pick].used = true;
      bl.textContent = st.bank[st.pick].w; bl.classList.add('filled');
      var bp2 = bw.querySelector('[data-wi="' + st.pick + '"]'); if (bp2){ bp2.classList.remove('picked'); bp2.style.opacity = '.35'; }
      st.pick = null;
    }
    bl.addEventListener('click', act);
    bl.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
  });
};
COLLECT.fill = function(ex, st){
  var sel = [], correct = [];
  var any = false;
  ex.answers.forEach(function(a, bi){
    correct.push(bi + ':' + a);
    if (st.placed[bi] != null){ sel.push(bi + ':' + st.bank[st.placed[bi]].w); any = true; }
  });
  if (!any) return null;
  return { sel: sel, correct: correct };
};
function metaFill(ex){
  return ex.answers.map(function(a, bi){ return { key: bi + ':' + a, label: 'Blank ' + (bi + 1) + ' = “' + esc(a) + '”', why: ex.why[bi] }; });
}

/* order */
RENDER.order = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.seq = shuffle(ex.items.map(function(it, i){ return i; }));
  var w = mk('div');
  box.appendChild(w);
  function draw(){
    w.innerHTML = '';
    st.seq.forEach(function(itemIdx, pos){
      var row = mk('div', 'ord-item'); row.draggable = true;
      row.innerHTML = '<span class="ordn">' + (pos + 1) + '.</span><span>' + esc(ex.items[itemIdx].t) + '</span>';
      var btns = mk('div', 'ord-btns');
      var up = mk('button', null, '↑'); up.setAttribute('aria-label', 'Move up');
      var dn = mk('button', null, '↓'); dn.setAttribute('aria-label', 'Move down');
      up.addEventListener('click', function(){ if (S.checked[ex.uid] || pos === 0) return; var t = st.seq[pos - 1]; st.seq[pos - 1] = st.seq[pos]; st.seq[pos] = t; draw(); });
      dn.addEventListener('click', function(){ if (S.checked[ex.uid] || pos === st.seq.length - 1) return; var t = st.seq[pos + 1]; st.seq[pos + 1] = st.seq[pos]; st.seq[pos] = t; draw(); });
      btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
      row.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', String(pos)); });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault();
        if (S.checked[ex.uid]) return;
        var from = Number(ev.dataTransfer.getData('text/plain'));
        var to = pos;
        var it = st.seq.splice(from, 1)[0]; st.seq.splice(to, 0, it); draw();
      });
      w.appendChild(row);
    });
  }
  draw();
};
COLLECT.order = function(ex, st){
  var sel2 = [], cor2 = [];
  ex.correctOrder.forEach(function(itemIdx, pos){ cor2.push(pos + ':' + itemIdx); sel2.push(pos + ':' + st.seq[pos]); });
  return { sel: sel2, correct: cor2 };
};
function metaOrder(ex){
  return ex.correctOrder.map(function(itemIdx, pos){ return { key: pos + ':' + itemIdx, label: 'Position ' + (pos + 1) + ': ' + ex.items[itemIdx].t, why: ex.why[itemIdx] }; });
}

/* list (true/false classify, triage queues) */
RENDER.list = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.pick = {};
  ex.list.forEach(function(it, i){
    var d = mk('div', 'list-item');
    d.innerHTML = '<div class="li-txt">' + it.t + '</div>';
    var opts = mk('div', 'li-opts');
    it.options.forEach(function(o, k){
      var b = mk('button', 'li-opt'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.textContent = o.t;
      b.addEventListener('click', function(){
        if (S.checked[ex.uid]) return;
        st.pick[i] = k;
        opts.querySelectorAll('.li-opt').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      });
      opts.appendChild(b);
    });
    d.appendChild(opts); box.appendChild(d);
  });
};
COLLECT.list = function(ex, st){
  var sel = [], correct = [], any = false;
  ex.list.forEach(function(it, i){
    var okk = it.options.map(function(o, k){ return o.ok ? k : -1; }).filter(function(k){ return k >= 0; })[0];
    correct.push(i + ':' + okk);
    if (st.pick[i] != null){ sel.push(i + ':' + st.pick[i]); any = true; }
  });
  if (!any) return null;
  return { sel: sel, correct: correct };
};
function metaList(ex){
  return ex.list.map(function(it, i){
    var okk = it.options.map(function(o, k){ return o.ok ? k : -1; }).filter(function(k){ return k >= 0; })[0];
    return { key: i + ':' + okk, label: it.t.slice(0, 64) + '…', why: it.why };
  });
}

/* steps (branching scenario) */
RENDER.steps = function(ex, box){
  var st = EXSTATE[ex.uid];
  st.step = 0; st.pick = {};
  drawStep();
  function drawStep(){
    var s = ex.steps[st.step];
    var d = mk('div', null);
    d.innerHTML = '<span class="step-tag">STEP ' + (st.step + 1) + ' OF ' + ex.steps.length + '</span>' +
      (s.add ? '<div class="card card-tint-blue" style="margin:8px 0"><div class="panel-head ph-blue"><span class="ic">🧭</span>SCENARIO — update</div><p>' + s.add + '</p>' +
      (s.artefacts || []).map(function(a){ return '<details class="artefact" open><summary>' + esc(a.label) + '</summary><div class="art-body">' + hl(a.body) + '</div></details>'; }).join('') + '</div>' : '') +
      '<p><b>' + s.q + '</b></p>';
    var opts = mk('div', null);
    s.options.forEach(function(o, k){
      var r = mk('button', 'opt-row'); r.type = 'button'; r.setAttribute('aria-pressed', 'false');
      r.innerHTML = '<span class="ol">' + 'ABCDEF'[k] + '.</span><span>' + o.t + '</span>';
      r.addEventListener('click', function(){
        if (st.done) return;
        st.pick[st.step] = k;
        opts.querySelectorAll('.opt-row').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        r.setAttribute('aria-pressed', 'true');
        var nb = $('#step-go');
        if (nb) nb.disabled = false;
      });
      opts.appendChild(r);
    });
    d.appendChild(opts);
    var act = mk('div', 'actions');
    var go = mk('button', 'btn-check', st.step === ex.steps.length - 1 ? '✓ Check — final step' : 'Continue ▶');
    go.id = 'step-go';
    if (st.pick[st.step] == null) go.disabled = true;
    go.addEventListener('click', function(){
      if (st.pick[st.step] == null) return;
      if (st.step < ex.steps.length - 1){
        st.step += 1; drawStep();
        sIntoView(box);
      } else {
        st.done = true;
        go.disabled = true;
        go.classList.add('hidden');
        var real = $('#btn-check'); if (real) real.click();
      }
    });
    act.appendChild(go); d.appendChild(act);
    box.innerHTML = '';
    box.appendChild(d);
  }
};
COLLECT.steps = function(ex, st){
  if (st.pick[ex.steps.length - 1] == null) return null;
  var sel = [], correct = [];
  ex.steps.forEach(function(s, i){
    var okk = s.options.map(function(o, k){ return o.ok ? k : -1; }).filter(function(k){ return k >= 0; })[0];
    correct.push(i + ':' + okk);
    if (st.pick[i] != null) sel.push(i + ':' + st.pick[i]);
  });
  return { sel: sel, correct: correct };
};
function metaSteps(ex){
  return ex.steps.map(function(s, i){ return { key: i + ':' + (s.options.map(function(o, k){ return o.ok ? k : -1; }).filter(function(k){ return k >= 0; })[0]), label: 'Step ' + (i + 1), why: s.why }; });
}

/* wire itemsMeta per type */
function itemsMetaFor(ex){
  switch (ex.type){
    case 'mcq': case 'multi': return metaMcqMulti(ex);
    case 'match': return metaMatch(ex);
    case 'dnd': return metaDnd(ex);
    case 'fill': return metaFill(ex);
    case 'order': return metaOrder(ex);
    case 'list': return metaList(ex);
    case 'steps': return metaSteps(ex);
  }
  return [];
}
EXERCISES.forEach(function(e){ e.itemsMeta = itemsMetaFor(e); e.keyMap = keyMapFor(e); });

/* ---------- boot ---------- */
buildHeader();
renderIntro();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
