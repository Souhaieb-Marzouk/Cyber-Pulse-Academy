    }).join('');
  });
}
function itemClick(iid){
  if(!R||R.checked)return;
  if(R.place[iid]){delete R.place[iid];R.picked=null;drawDD();return;}
  R.picked=(R.picked===iid)?null:iid;drawDD();
}
function slotClick(sid){
  if(!R||R.checked)return;
  if(R.picked){
    var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===sid;})[0];
    if(cur)delete R.place[cur];
    R.place[R.picked]=sid;R.picked=null;drawDD();
  }
}
function slotKey(ev,sid){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();slotClick(sid);}}
function ddStart(ev,iid){ev.dataTransfer.setData('text/plain',iid);}
function ddOver(ev){if(R&&R.checked)return;ev.preventDefault();ev.currentTarget.classList.add('over');}
function ddLeave(ev){ev.currentTarget.classList.remove('over');}
function ddDrop(ev,where){
  if(!R||R.checked)return;
  ev.preventDefault();ev.currentTarget.classList.remove('over');
  var iid=ev.dataTransfer.getData('text/plain');if(!iid)return;
  if(where==='__bank'){delete R.place[iid];}
  else{var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===where;})[0];if(cur)delete R.place[cur];R.place[iid]=where;}
  R.picked=null;drawDD();
}
/* ---------- match ---------- */
function buildMatch(ex){
  var rights=ex._shufR||(ex._shufR=shuffle(ex.rights));
  R.pair={};R.pickedLeft=null;
  var L='<div><div class="slot-title">LEFT COLUMN &mdash; tap one</div>'+ex.lefts.map(function(l){
    return '<button class="pairopt" id="pl-'+l.id+'" onclick="pickLeft(\''+l.id+'\')">'+esc(l.x)+'</button>';
  }).join('')+'</div>';
  var Rt='<div><div class="slot-title">RIGHT COLUMN &mdash; then tap its match</div>'+rights.map(function(r){
    return '<button class="pairopt" id="pr-'+r.id+'" onclick="pickRight(\''+r.id+'\')">'+esc(r.x)+'</button>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="pairwrap">'+L+Rt+'</div><div id="pairchips"></div>';
  drawPairs();
}
function pickLeft(id){if(!R||R.checked)return;R.pickedLeft=(R.pickedLeft===id)?null:id;drawPairs();}
function pickRight(id){
  if(!R||R.checked)return;
  if(!R.pickedLeft)return;
  /* several lefts may legitimately map to the same right (many-to-one matching):
     reassigning pickedLeft's pair only, never stealing other lefts' pairs */
  R.pair[R.pickedLeft]=id;R.pickedLeft=null;drawPairs();
}
function unpair(l){if(!R||R.checked)return;delete R.pair[l];drawPairs();}
function drawPairs(){
  var ex=R.ex;
  ex.lefts.forEach(function(l){var p=$('#pl-'+l.id);if(p)p.classList.toggle('picked',R.pickedLeft===l.id);});
  ex.rights.forEach(function(r){var p=$('#pr-'+r.id);if(p)p.classList.remove('picked');});
  $('#pairchips').innerHTML=ex.lefts.filter(function(l){return R.pair[l.id];}).map(function(l){
    var r=ex.rights.filter(function(x){return x.id===R.pair[l.id];})[0];
    return '<div class="pairchip">&#128279; <b>'+esc(l.x)+'</b> &#8594; '+esc(r.x)+
      '<button class="x" onclick="unpair(\''+l.id+'\')" aria-label="Remove pair">&#10007;</button></div>';
  }).join('')||'<div class="smallnote">No pairs yet.</div>';
}
/* ---------- order / rank ---------- */
function buildOrder(ex){
  R.seq=ex._shuf||(ex._shuf=shuffle(ex.items.map(function(i){return i.id;})));
  drawOrder();
}
function drawOrder(){
  var ex=R.ex;
  $('#answ').innerHTML='<div class="ordlist">'+R.seq.map(function(id,i){
    var it=ex.items.filter(function(x){return x.id===id;})[0];
    return '<div class="orditem" draggable="true" ondragstart="ordStart(event,'+i+')" data-i="'+i+'">'+
      '<span class="pos">'+(i+1)+'.</span><span>'+esc(it.x)+'</span>'+
      '<span class="updown"><button onclick="ordMove('+i+',-1)" aria-label="Move up">&#9650;</button>'+
      '<button onclick="ordMove('+i+',1)" aria-label="Move down">&#9660;</button></span></div>';
  }).join('')+'</div><p class="smallnote">Drag rows or use the arrows. Position 1 = first / most important.</p>';
}
function ordMove(i,d){
  if(!R||R.checked)return;
  var j=i+d;if(j<0||j>=R.seq.length)return;
  var t=R.seq[i];R.seq[i]=R.seq[j];R.seq[j]=t;drawOrder();
}
function ordStart(ev,i){ev.dataTransfer.setData('text/plain',String(i));R._dragI=i;
  var n=ev.currentTarget;n.classList.add('dragging');}
document.addEventListener('dragend',function(ev){if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove('dragging');});
document.addEventListener('dragover',function(ev){
  if(!R||R.checked||R._dragI===undefined)return;
  var t=ev.target.closest?ev.target.closest('.orditem'):null;if(!t)return;
  ev.preventDefault();
  var j=parseInt(t.getAttribute('data-i'),10);
  if(j===R._dragI)return;
  var seq=R.seq,id=R.seq[R._dragI];
  seq.splice(R._dragI,1);seq.splice(j,0,id);
  R._dragI=j;drawOrder();
});
/* ---------- fill ---------- */
function buildFill(ex){
  R.blank={};R.selBlank=null;
  var line=ex.parts.map(function(p){
    if(p.t==='x')return '<span>'+p.x+'</span>';
    return ' <button class="blank" id="bl-'+p.id+'" data-bid="'+p.id+'" onclick="blankClick(\''+p.id+'\')">&#8230;</button> ';
  }).join('');
  var bank=ex._shufB||(ex._shufB=shuffle(ex.bank));
  $('#answ').innerHTML='<div class="fillline">'+line+'</div>'+
    '<div class="bankrow">'+bank.map(function(t){return '<button class="chip" id="ch-'+b32(t)+'" onclick="chipClick(\''+esc(t)+'\')">'+esc(t)+'</button>';}).join('')+'</div>'+
    '<p class="smallnote">Tap a word, then tap a blank. Tap a filled blank to empty it again.</p>';
}
function b32(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))&0xfffff;}return h.toString(32);}
function blankClick(bid){
  if(!R||R.checked)return;
  if(R.blank[bid]){delete R.blank[bid];drawBlanks();return;}
  R.selBlank=bid;
  document.querySelectorAll('.blank').forEach(function(b){b.classList.toggle('picked',b.getAttribute('data-bid')===bid);});
}
function chipClick(tok){
  if(!R||R.checked)return;
  var ex=R.ex;
  var bid=R.selBlank||Object.keys(ex.answers).filter(function(k){return !R.blank[k];})[0];
  if(!bid)return;
  R.blank[bid]=tok;R.selBlank=null;drawBlanks();
}
function drawBlanks(){
  var ex=R.ex;
  Object.keys(ex.answers).forEach(function(bid){
    var b=$('#bl-'+bid);if(!b)return;
    var v=R.blank[bid];
    b.innerHTML=v?esc(v):'&#8230;';
    b.classList.toggle('filled',!!v);
    b.classList.toggle('picked',R.selBlank===bid);
  });
  ex.bank.forEach(function(t){
    var c=$('#ch-'+b32(t));if(!c)return;
    var used=Object.keys(R.blank).some(function(k){return R.blank[k]===t;});
    c.classList.toggle('used',used);
  });
}
/* ---------- terminal ---------- */
function buildTerminal(ex){
  R.lines=[];R.lastCmd='';
  var syn='';
  if(ex.syntax){
    syn='<div class="synpanel"><h5>SYNTAX REMINDER</h5><div class="mono">'+ex.syntax.shape+'</div>'+
      '<ul class="rules" style="margin:8px 0 4px">'+ex.syntax.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>'+
      '<p class="smallnote">Example on a different file: <span class="mono" style="padding:2px 6px">'+ex.syntax.example+'</span></p>'+
      '<p class="smallnote">Expected output shape: <span class="mono" style="padding:2px 6px">'+ex.syntax.outshape+'</span></p></div>';
  }
  $('#answ').innerHTML=syn+
    '<div class="term"><div class="term-scroll" id="tscroll"></div>'+
    '<div class="term-inrow"><span class="pr">analyst@lab:~$</span>'+
    '<input class="term-input" id="tin" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" aria-label="terminal input"></div></div>'+
    '<p class="smallnote">Type the command, press Enter, then press Check. Nothing real is executed &mdash; this is a simulation.</p>';
  $('#tin').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){var v=this.value;this.value='';runCmd(v);}
  });
  termOut('<span class="dm">simulation shell &mdash; only the commands relevant to this exercise are available</span>');
}
function normCmd(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
function runCmd(raw){
  var ex=R.ex,c=normCmd(raw);
  R.lines.push({in:raw});
  if(c===''){drawTerm();return;}
  R.lastCmd=raw;
  var out=null;
  if(ex.outputs){ex.outputs.forEach(function(o){if(out===null&&new RegExp(o.m).test(c))out=o.x;});}
  if(out===null){
    if(/^(clear|cls)$/.test(c)){R.lines=[];drawTerm();return;}
    var bin=c.split(' ')[0];
    out='sh: command not found: '+bin+'  <span class="dm">(this simulation only knows the commands needed here)</span>';
  }
  R.lines.push({out:out});
  drawTerm();
}
function termOut(html){R.lines.push({out:html});drawTerm();}
function drawTerm(){
  var t=$('#tscroll');if(!t)return;
  t.innerHTML=R.lines.map(function(l){
    if(l.in!==undefined)return '<div class="term-line"><span class="pr">analyst@lab:~$</span> <span class="in">'+esc(l.in)+'</span></div>';
    return '<div class="term-line"><span class="out">'+l.out+'</span></div>';
  }).join('')+'\n';
  t.scrollTop=t.scrollHeight;
}
/* ---------- logsel ---------- */
function buildLogsel(ex){
  R.sel={};
  var filt=ex.filter?'<input class="logfilter" id="logf" placeholder="filter lines (text match)..." aria-label="filter log lines">':'';
  $('#answ').innerHTML=filt+'<div class="logbox" id="logbox"></div>'+
    '<p class="smallnote">Click a line to select it. Click again to deselect.'+(ex.filter?' The filter box only narrows the view &mdash; it does not change your selection.':'')+'</p>';
  drawLog();
  if(ex.filter){$('#logf').addEventListener('input',function(){drawLog(this.value);});}
}
function drawLog(f){
  var ex=R.ex;
  f=(f||'').toLowerCase();
  $('#logbox').innerHTML=ex.lines.map(function(l){
    var show=!f||l.x.toLowerCase().indexOf(f)>-1;
    return '<div class="logline'+(R.sel[l.id]?' sel':'')+(show?'':' off')+'" data-lid="'+l.id+'" role="checkbox" aria-checked="'+(!!R.sel[l.id])+'" tabindex="0" onclick="lineSel(\''+l.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lineSel(\''+l.id+'\');}">'+
      '<span class="lnum">'+l.id+'</span><span class="selmark" style="display:'+(R.sel[l.id]?'inline':'none')+'">&#10003;</span><span class="mono" style="background:none;border:none;padding:0;white-space:pre-wrap">'+esc(l.x)+'</span></div>';
  }).join('');
}
function lineSel(id){
  if(!R||R.checked)return;
  if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
  var n=document.querySelector('.logline[data-lid="'+id+'"]');
  if(n){n.classList.toggle('sel',!!R.sel[id]);n.setAttribute('aria-checked',!!R.sel[id]);
    var m=n.querySelector('.selmark');if(m)m.style.display=R.sel[id]?'inline':'none';}
}
/* ---------- sim (multi-step) ---------- */
function buildSim(ex){
  R.stepIdx=0;R.choices={};R.log=[];
  drawStep();
}
function drawStep(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  $('#scenbody').innerHTML=ex.scen.map(artefactHtml).join('')+
    (R.log.length?'<div class="caselog">'+R.log.map(function(l){return '<div class="cl">'+l+'</div>';}).join('')+'</div>':'');
  var qblock=document.querySelector('.block.amb .bc');
  qblock.innerHTML='<span class="steps-tag">STEP '+(R.stepIdx+1)+' OF '+ex.steps.length+'</span><br><b>'+st.q+'</b>';
  var opts=st._shuf||(st._shuf=shuffle(st.options));
  $('#answ').innerHTML=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  document.querySelector('#actrow .smallnote').textContent='Intermediate steps do not stop the timer. The timer pauses only on the final Check.';
  var cb=$('#checkbtn');cb.disabled=true;cb.title='Available on the final step';
  document.getElementById('scenh').querySelector('.sub').textContent=ex.summary;
  window.scrollTo(0,0);
}
function pickSim(id){
  if(!R||R.checked)return;
  R._curChoice=id;
  document.querySelectorAll('#answ .opt').forEach(function(n){
    var on=n.getAttribute('data-oid')===id;
    n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
  });
  var cb=$('#checkbtn');
  if(R.stepIdx===R.ex.steps.length-1){cb.disabled=false;cb.innerHTML='&#10003; Check final answers';cb.title='';}
  else{cb.disabled=false;cb.innerHTML='&#10145; Confirm &amp; continue';cb.title='';}
}
function simConfirm(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  var opt=st.options.filter(function(o){return o.id===R._curChoice;})[0];
  if(!opt)return;
  R.choices[st.id]=R._curChoice;
  R.log.push('<b>Step '+(R.stepIdx+1)+':</b> '+opt.outcome);
  if(R.stepIdx<ex.steps.length-1){
    R.stepIdx++;drawStep();
    var cb=$('#checkbtn');cb.innerHTML='&#10003; Check';cb.disabled=true;
  }else{
    onCheck();
  }
}
function pickOpt(id){
  if(!R||R.checked)return;
  if(R.ex.type==='sim'){pickSim(id);return;}
  var ex=R.ex;
  if(ex.type==='mcq'){
    R.sel=id;
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=n.getAttribute('data-oid')===id;
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }else{
    if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=!!R.sel[n.getAttribute('data-oid')];
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });

}

/* ================= widget builder ================= */
function buildWidget(ex){
  if(ex.type==='mcq'||ex.type==='multi')buildMCQ(ex);
  else if(ex.type==='categorize')buildCategorize(ex);
  else if(ex.type==='match')buildMatch(ex);
  else if(ex.type==='order')buildOrder(ex);
  else if(ex.type==='fill')buildFill(ex);
  else if(ex.type==='terminal')buildTerminal(ex);
  else if(ex.type==='logsel')buildLogsel(ex);
  else if(ex.type==='sim'){buildSim(ex);document.getElementById('checkbtn').onclick=function(){if(R&&!R.checked)simConfirm();};}
}

/* ================= collectors ================= */
function collect(R){
  var ex=R.ex,res={selected:[],correct:[],items:[]};
  if(ex.type==='mcq'){
    res.selected=R.sel?[R.sel]:[];
    res.correct=[ex.correct];
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    if(R.sel===ex.correct){res.items.push({name:'Answer',state:'ok',note:co.why});}
    else{
      var wo=R.sel?ex.options.filter(function(o){return o.id===R.sel;})[0]:null;
      if(wo)res.items.push({name:'Your pick',state:'wrong',note:wo.why});
      res.items.push({name:'Correct',state:'missed',note:co.why});
    }
  }else if(ex.type==='multi'){
    res.selected=Object.keys(R.sel);
    res.correct=ex.correct;
    ex.options.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>-1,isS=!!R.sel[o.id];
      if(isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'ok',note:o.why});
      else if(isC&&!isS)res.items.push({name:o.id.toUpperCase(),state:'missed',note:o.why});
      else if(!isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'wrong',note:o.why});
    });
  }else if(ex.type==='categorize'){
    ex.slots.forEach(function(s){
      var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];
      var good=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];
      if(!iid){res.items.push({name:s.label,state:'missed',note:s.why});}
      else if(iid===good){
        res.items.push({name:s.label,state:'ok',note:s.why});
        res.selected.push(s.id+'='+iid);res.correct.push(s.id+'='+good);
      }else{
        res.items.push({name:s.label,state:'wrong',note:s.why+' The item you placed there belongs elsewhere.'});
        res.selected.push(s.id+'='+iid);
      }
      if(good)res.correct.push(s.id+'='+good);
    });
    res.correct=ex.slots.map(function(s){var g=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];return g?s.id+'='+g:null;}).filter(Boolean);
    res.selected=ex.slots.map(function(s){var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];return iid?s.id+'='+iid:null;}).filter(Boolean);
  }else if(ex.type==='match'){
    ex.lefts.forEach(function(l){
      var p=R.pair[l.id];
      var corr=ex.correct[l.id];
      if(!p){res.items.push({name:l.short,state:'missed',note:ex.why[l.id]});}
      else{
        res.selected.push(l.id+'='+p);
        if(p===corr){res.items.push({name:l.short,state:'ok',note:ex.why[l.id]});}
        else{res.items.push({name:l.short,state:'wrong',note:ex.why[l.id]});}
      }
      res.correct.push(l.id+'='+corr);
    });
  }else if(ex.type==='order'){
    ex.correctOrder.forEach(function(id,i){
      var placed=R.seq[i];
      res.selected.push(i+'='+placed);res.correct.push(i+'='+id);
      if(placed===id)res.items.push({name:'Position '+(i+1),state:'ok',note:ex.why[id]});
      else res.items.push({name:'Position '+(i+1),state:'wrong',note:ex.why[id]});
    });
  }else if(ex.type==='fill'){
    Object.keys(ex.answers).forEach(function(bid){
      var raw=R.blank[bid]||'';
      var v=raw.trim().toLowerCase();
      var a=ex.answers[bid].trim().toLowerCase();
      res.correct.push(bid+'='+a);
      var nm='Blank: '+(ex.blankNames&&ex.blankNames[bid]||bid);
      if(raw.trim()!==''){
        res.selected.push(bid+'='+v);
        res.items.push({name:nm,state:v===a?'ok':'wrong',note:ex.why[bid]});
      }else{
        /* an untouched blank was never answered: it is missed, never wrong */
        res.items.push({name:nm,state:'missed',note:ex.why[bid]});
      }
    });
  }else if(ex.type==='terminal'){
    var c=normCmd(R.lastCmd||'');
    var toks=c?c.split(' '):[];
    function tokTest(rx){var re=new RegExp(rx);return toks.some(function(t){return re.test(t);});}
    function fullTest(rx){var re=new RegExp(rx);return re.test(c);}
    var danger=(ex.dangerous||[]).some(function(d){return new RegExp(d).test(c);});
    R._danger=danger;
    ex.parts.forEach(function(p,i){
      var test=(p.mode==='full')?fullTest:tokTest;
      var ok=c&&test(p.ok)&&!(p.bad&&test(p.bad));
      var bad=c&&p.bad&&test(p.bad);
      if(ok){res.selected.push('e'+i);res.items.push({name:p.name,state:'ok',note:p.why});}
      else if(bad){res.selected.push('w'+i);res.items.push({name:p.name,state:'wrong',note:p.why+' What you typed fails this part.'});}
      else{res.items.push({name:p.name,state:'missed',note:p.why});}
      res.correct.push('e'+i);
    });
    if(!c){res.items=res.items.map(function(it){return {name:it.name,state:'missed',note:it.note};});}
  }else if(ex.type==='logsel'){
    res.selected=Object.keys(R.sel);res.correct=ex.correct;
    ex.lines.forEach(function(l){
      if(ex.correct.indexOf(l.id)>-1){
        var st=R.sel[l.id]?'ok':'missed';
        res.items.push({name:'Line '+l.id,state:st,note:ex.why[l.id]});
      }else if(R.sel[l.id]){
        res.items.push({name:'Line '+l.id,state:'wrong',note:ex.why[l.id]});
      }
    });
  }else if(ex.type==='sim'){
    ex.steps.forEach(function(st){
      var ch=R.choices[st.id];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      res.correct.push(st.id+'='+corr.id);
      if(!ch){res.items.push({name:st.label,state:'missed',note:corr.why});}
      else{
        res.selected.push(st.id+'='+ch);
        var o=st.options.filter(function(x){return x.id===ch;})[0];
        res.items.push({name:st.label,state:ch===corr.id?'ok':'wrong',note:ch===corr.id?o.why:(corr.why+' '+o.why)});
      }
    });
  }
  return res;
}

/* ================= lock & feedback ================= */
function lockWidget(){
  var a=$('#answ');if(a)a.classList.add('locked');
  a.querySelectorAll('button,input').forEach(function(n){n.disabled=true;});
  var cb=$('#checkbtn');if(cb){cb.disabled=true;}
}
function renderFeedback(){
  var ex=R.ex,res=R.res,credit=R.credit;
  var label,state,cls;
  if(credit>=0.999){label='&#10003; CORRECT';state='Correct';cls='correct';}
  else if(credit>0){label='&#10003; PARTIALLY CORRECT';state='Partially correct';cls='partial';}
  else{label='&#10007; INCORRECT';state='Incorrect';cls='incorrect';}
  var multi=ex.type!=='mcq';
  var html='<div class="fb '+cls+'" role="status">'+
    '<div class="fb-title '+cls+'">'+label+
    '<span class="fb-credit">credit '+credit.toFixed(2)+(multi?' &middot; '+Math.round(credit*res.correct.length)+'/'+res.correct.length+' items':'')+'</span></div>';
  if(R._danger)html+='<div class="fb-title incorrect" style="margin-top:8px;font-size:14px">&#10007; DANGEROUS &mdash; NEAR MISS: this command would have destroyed or altered evidence. Always preserve before you clean.</div>';
  if(multi){
    html+=res.items.map(function(it){
      var ic=it.state==='ok'?'&#10003;':(it.state==='wrong'?'&#10007;':'&#9675;');
      var st=it.state==='ok'?'Correct':(it.state==='wrong'?'Wrong':'Missed');
      return '<div class="fb-item '+it.state+'"><span class="ic">'+ic+'</span><span class="nm">'+esc(it.name)+' &mdash; '+st+'</span><span class="nt">'+it.note+'</span></div>';
    }).join('');
  }else{
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    html+='<div class="fb-item ok"><span class="ic">&#10003;</span><span class="nm">Correct answer</span><span class="nt">'+co.x+'</span></div>';
  }
  if(ex.type==='terminal'){
    html+='<div style="margin-top:10px"><div class="arte-label" style="border-radius:6px 6px 0 0">CANONICAL COMMAND</div><div class="mono">'+esc(ex.canonical)+'</div></div>';
    html+='<p class="smallnote" style="margin-top:6px">'+ex.canonWhy+'</p>';
  }
  html+='<div class="fb-exp"><b>Why:</b> '+ex.expl+'</div>';
  if(credit<0.999)html+='<div class="fb-study"><b>What to study:</b> '+ex.study+'</div>';
  html+='</div>';
  var last=(S.pos>=S.order.length-1);
  var nextLbl=R.fromReview?'&#8617; Return to skipped list':(last?'&#10003; Final Submit':'Next &#10145;');
  html+='<div class="startrow"><button class="btn primary" onclick="onNext()">'+nextLbl+'</button></div>';
  $('#fbzone').innerHTML=html;
  var ab=$('#actrow');if(ab)ab.classList.add('hidden');
}

renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
