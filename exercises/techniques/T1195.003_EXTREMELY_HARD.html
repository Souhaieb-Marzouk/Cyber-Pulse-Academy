<style>:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --text-primary:#e6ecff; --text-secondary:#a9b4d0;

  --state-incorrect:#ff6b6b; --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;

  --tint-green-07:rgba(87,211,140,.07); --tint-green-10:rgba(87,211,140,.1); --tint-green-12:rgba(87,211,140,.12);
  --tint-amber-07:rgba(255,180,84,.07); --tint-amber-10:rgba(255,180,84,.1); --tint-amber-12:rgba(255,180,84,.12);
  --tint-hard-12:rgba(255,138,61,.12); --tint-extreme-07:rgba(255,107,107,.07); --tint-extreme-12:rgba(255,107,107,.12);
  --tint-paused-12:rgba(157,123,255,.12); --tint-skipped-12:rgba(169,180,208,.12);
  --tint-border-40:rgba(36,48,73,.4); --sheen:rgba(255,255,255,.22);

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.6; min-height:100vh;
}
#wrap{max-width:1060px;margin:0 auto;padding:0 16px 80px}
.mono,code,kbd,.term,.logbox{

}
.mono{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-mono);padding:10px 12px;font-size:14.5px;line-height:1.6;
  white-space:pre;overflow-x:auto}
code{background:var(--bg-surface-2);color:var(--text-mono);padding:1px 6px;border-radius:4px;font-size:.92em}
.kw{color:var(--hl-kw)} .st{color:var(--hl-str)} .wn{color:var(--hl-warn)}
.er{color:var(--hl-err)} .dm{color:var(--hl-dim)} .ok{color:var(--state-correct)}
/* ---------- sticky exam header ---------- */
#hdr{
  position:sticky;top:0;z-index:50;background:var(--bg-surface);
  border-bottom:1px solid var(--border);box-shadow:var(--shadow);
  padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;
}
#hdr .hcell{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary)}

#hdr .mono-t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--text-primary);

.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;

.badge.easy{background:var(--tint-green-12);color:var(--sev-easy);border-color:var(--sev-easy)}
.badge.medium{background:var(--tint-amber-12);color:var(--sev-medium);border-color:var(--sev-medium)}
.badge.hard{background:var(--tint-hard-12);color:var(--sev-hard);border-color:var(--sev-hard)}
.badge.extreme{background:var(--tint-extreme-12);color:var(--sev-extreme);border-color:var(--sev-extreme)}
.badge.paused{background:var(--tint-paused-12);color:var(--state-paused);border-color:var(--state-paused)}
.badge.running{background:var(--tint-blue-12);color:var(--accent-blue);border-color:var(--accent-blue)}
.badge.skip{background:var(--tint-skipped-12);color:var(--state-skipped);border-color:var(--state-skipped)}

/* ---------- generic cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.block{background:var(--bg-surface);border:1px solid var(--border);border-left:4px solid var(--accent-blue);

.block.amb{border-left-color:var(--accent-amber)} .block.grn{border-left-color:var(--accent-green)}

.bh.blue{color:var(--accent-blue)} .bh.amb{color:var(--accent-amber)} .bh.grn{color:var(--accent-green)}
.bh .sub{margin-left:auto;font-weight:600;letter-spacing:.2px;color:var(--text-secondary);font-size:12.5px}
.bc{padding:14px 16px}
.arte{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.arte-label{display:block;padding:6px 12px;font-size:12px;letter-spacing:.8px;font-weight:700;

.arte-body{padding:10px 12px}
.logbox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;

.logline.off{display:none}
.logfilter{width:100%;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;

/* ---------- options ---------- */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;

.opt:hover{border-color:var(--accent-blue)}
.opt .olid{font-weight:800;color:var(--accent-amber);min-width:26px}
.opt .selmark{margin-left:auto;font-weight:700;color:var(--accent-green);display:none;white-space:nowrap}
.opt.sel{border-color:var(--accent-green);box-shadow:inset 3px 0 0 var(--accent-green)}
.opt.sel .selmark{display:inline}
.opt.good{border-color:var(--state-correct);box-shadow:inset 3px 0 0 var(--state-correct)}
.opt.bad{border-color:var(--state-incorrect);box-shadow:inset 3px 0 0 var(--state-incorrect)}
.opt.locked{cursor:default;opacity:.92}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 20px;

.btn:hover{border-color:var(--accent-blue)}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:var(--on-blue)}
.btn.green{background:var(--state-correct);border-color:var(--state-correct);color:var(--on-green)}
.btn.warn{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:8px 14px;font-size:13.5px}
button:focus-visible,.opt:focus-visible,.slot:focus-visible,.bankitem:focus-visible,
.logline:focus-visible,.orditem:focus-visible,.pairopt:focus-visible,.blank:focus-visible{

/* ---------- feedback ---------- */
.fb{border:1px solid var(--border);border-left:5px solid var(--state-skipped);border-radius:var(--radius);
  background:var(--bg-surface);padding:14px 16px;margin:16px 0;box-shadow:var(--shadow)}
.fb.correct{border-left-color:var(--state-correct)} .fb.partial{border-left-color:var(--state-partial)}
.fb.incorrect{border-left-color:var(--state-incorrect)}
.fb-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.4px}
.fb-title.correct{color:var(--state-correct)} .fb-title.partial{color:var(--state-partial)}
.fb-title.incorrect{color:var(--state-incorrect)}
.fb-credit{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--text-primary)}
.fb-item{display:flex;gap:9px;padding:6px 4px;border-bottom:1px dashed var(--border);font-size:14.5px;align-items:flex-start}
.fb-item:last-child{border-bottom:none}
.fb-item .ic{font-weight:900;min-width:20px;text-align:center}
.fb-item.ok .ic,.fb-item.ok .nm{color:var(--state-correct)}
.fb-item.wrong .ic,.fb-item.wrong .nm{color:var(--state-incorrect)}
.fb-item.missed .ic,.fb-item.missed .nm{color:var(--state-skipped)}
.fb-item .nm{font-weight:700;min-width:96px}
.fb-item .nt{color:var(--text-secondary)}
.fb-exp{margin-top:10px;font-size:15px}
.fb-study{margin-top:8px;font-size:14.5px;color:var(--accent-amber)}
.hintbox{border:1px dashed var(--accent-amber);border-radius:8px;background:var(--tint-amber-07);
  color:var(--text-primary);padding:10px 14px;margin:10px 0;font-size:14.5px}
/* ---------- drag & drop / matching / order / fill ---------- */
.ddwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.ddwrap{grid-template-columns:1fr}}
.bank,.slots{display:flex;flex-direction:column;gap:8px}
.bank{background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px;min-height:80px}
.slot{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:56px}
.slot-title{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--accent-blue);margin-bottom:6px}
.slot.over{border-color:var(--accent-green);border-style:dashed}
.bankitem,.pairopt,.orditem,.blank{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:8px;color:var(--text-primary);padding:9px 12px;font-size:14.5px;cursor:grab;

.bankitem{display:block;width:100%}
.bankitem.picked{border-color:var(--accent-green);box-shadow:inset 3px 0 0 var(--accent-green);cursor:pointer}
.bankitem.dragging{opacity:.4}
.slot .inbank{margin-top:4px}
.slot .bankitem{cursor:grab}
.drag-tag{font-size:11.5px;color:var(--hl-dim);letter-spacing:.5px;font-weight:700}
.pairwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.pairwrap{grid-template-columns:1fr}}
.pairopt.picked{border-color:var(--accent-amber);box-shadow:inset 3px 0 0 var(--accent-amber)}
.pairchip{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13.5px}
.pairchip .x{margin-left:auto;color:var(--state-incorrect);cursor:pointer;font-weight:900;border:none;background:none;
  min-width:44px;min-height:44px;font-size:15px}
.ordlist{display:flex;flex-direction:column;gap:6px}
.orditem{display:flex;gap:10px;align-items:center;cursor:grab}
.orditem .pos{font-weight:800;color:var(--accent-amber);min-width:22px;font-family:ui-monospace,Menlo,Consolas,monospace}
.orditem .updown{margin-left:auto;display:flex;gap:4px}
.orditem .updown button{min-width:44px;min-height:44px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-surface-2);color:var(--text-primary);cursor:pointer;font-size:14px}
.orditem.dragging{opacity:.35}
.fillline{font-size:16px;line-height:2.15}
.blank{display:inline-block;min-width:120px;min-height:44px;padding:4px 10px;border:1px dashed var(--accent-amber);
  border-radius:6px;background:var(--bg-surface-2);color:var(--text-mono);font-family:ui-monospace,Menlo,Consolas,monospace;
  text-align:center;font-size:14.5px;cursor:pointer;vertical-align:middle}
.blank.filled{border-style:solid;border-color:var(--accent-green);cursor:pointer}
.bankrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bankrow .chip{min-height:44px}
.chip{background:var(--bg-surface);border:1px solid var(--border);border-radius:999px;color:var(--text-primary);
  padding:7px 16px;font-size:14.5px;min-height:44px;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}
.chip.used{opacity:.35;pointer-events:none;text-decoration:line-through}
/* ---------- terminal ---------- */
.term{background:var(--term-bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text-mono);font-size:14.5px}
.term-scroll{max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6;margin-bottom:8px}
.term-line .out{color:var(--term-out)} .term-line .in{color:var(--text-mono)}
.term-line .pr{color:var(--accent-green);font-weight:700}
.term-inrow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding-top:8px}
.term-inrow .pr{color:var(--accent-green);font-weight:700}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);min-height:44px;

.synpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-green);
  border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.synpanel h5{margin:2px 0 8px;color:var(--accent-green);letter-spacing:.6px;font-size:12.5px}
/* ---------- intro / results ---------- */
.intro-hero{background:linear-gradient(160deg,var(--tint-blue-12),var(--tint-green-07) 60%,transparent);
  border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin:18px 0;box-shadow:var(--shadow)}
.intro-hero h1{margin:0 0 6px;font-size:25px;letter-spacing:.3px}
.intro-hero .obj{color:var(--text-secondary);font-size:15.5px;margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:6px;font-size:14.5px}
.facts .f{display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
.facts .f b{color:var(--text-primary)}
h2.sec{font-size:19px;margin:26px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
h2.sec .n{color:var(--accent-amber);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.themebox{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;margin:10px 0}
.themebox h4{margin:0 0 8px;font-size:13.5px;letter-spacing:.8px;color:var(--accent-blue)}
.kwlist{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}

.rules{padding-left:20px}
.rules li{margin:9px 0;font-size:15.2px}
.rules b{color:var(--text-primary)}
.startrow{display:flex;justify-content:center;margin:26px 0 10px}
.startbtn{min-width:260px;min-height:52px;font-size:17px}
.res-hero{text-align:center;padding:30px 20px}
.res-hero .big{font-size:44px;font-weight:900;letter-spacing:1px;margin:6px 0}
.res-hero .pct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:var(--text-secondary)}
.passpanel{border:1px solid var(--state-correct);border-radius:var(--radius);

.rescell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.rescell .num{font-size:26px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace}
.rescell .lbl{font-size:13px;color:var(--text-secondary);margin-top:4px}
.rescell.ok{border-color:var(--state-correct)} .rescell.ok .num{color:var(--state-correct)}
.rescell.part{border-color:var(--state-partial)} .rescell.part .num{color:var(--state-partial)}

.rescell.skip{border-color:var(--state-skipped)} .rescell.skip .num{color:var(--state-skipped)}
.paused-overlay{position:fixed;inset:0;background:var(--ovl-bg);z-index:80;display:flex;

.paused-overlay .p1{font-size:22px;font-weight:800;color:var(--state-paused)}
.paused-overlay .p2{color:var(--text-secondary)}
/* ---------- misc ---------- */
.smallnote{font-size:13.5px;color:var(--text-secondary)}
.divider{border:none;border-top:1px solid var(--border);margin:22px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;border:1px solid var(--border);

.steps-tag{display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber-10);

.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){
  #prog-in::after{animation:none}
  *{transition:none!important;animation:none!important}

of custody","preserving packaging & seals","dangerous near-miss commands"]},{"name":"Estate-wide response","items":["blast-radius mapping by batch and serial range","batch quarantine","credential rotation reachable from device","business-cost acceptance"]},{"name":"Coverage gaps (expert view)","items":["EDR blindness below OS","registry-side analytics earlier than endpoint","SBOM/HBOM divergence as post-hoc signal","signature trust vs signing-identity compromise","build-VLAN network baselining"]},{"name":"Programme-level workflow","items":["freeze & preserve","first-seen determination","blast radius","coordinated containment","disclosure & postmortem"]},{"name":"Stakeholder needs","items":["CISO: risk decision with costs","Legal: disclosure duties, admissibility","Procurement: batch hold, remedies","SOC lead: telemetry scope, containment"]}],"types":"a 4-step senior decision scenario over five correlated artefacts, a forensic terminal command with dangerous near-misses, near-miss single choice, ranking under business constraints, multi-select coverage analysis, evidence-first ordering, expert classification, executive summary drafting, a high-noise log hunt, evidence-handling selection, and stakeholder matching"},"exercises":[{"id":"x1","type":"sim","title":"The batch that argues with itself","summary":"Five artefacts, four decisions &mdash; and two signals that contradict","scen":[{"t":"mono","label":"ARTEFACT 1 — ATTESTATION EXPORT (storage server, batch ST-6400)","x":"unit A11: TPM attestation OK, PCR chain matches baseline\nunit A12: <span class='er'>attestation FAIL, PCR[1] deviates</span>\nunit A13: TPM attestation OK, PCR chain matches baseline"},{"t":"mono","label":"ARTEFACT 2 — FIRMWARE COMPARISON (A11 vs A12)","x":"A11 fw build B-90211, sha256 <span class='ok'>matches vendor</span>\nA12 fw build B-90211, sha256 <span class='er'>deviates</span>\nboth units: signed by vendor key <span class='ok'>verified</span>"},{"t":"mono","label":"ARTEFACT 3 — VENDOR THREAD (excerpt)","x":"vendor L1: &ldquo;batch ST-6400 built in plant 2, all units B-90211&rdquo;\nvendor L2 (later): &ldquo;cannot confirm flash layout for rev D units&rdquo;\n<em>(no answer on whether rev D used a second SPI chip)</em>"},{"t":"mono","label":"ARTEFACT 4 — PROXY LOG (management VLAN)","x":"A12 mgmt: TLS to updates-vendor-cdn[.]example (expected channel)\nA12 mgmt: <span class='er'>DNS TXT to metrics-relay[.]example, 31-min interval</span>\nA11/A13 mgmt: no external TXT queries"},{"t":"mono","label":"ARTEFACT 5 — NOISE (unrelated, real queue traffic)","x":"vpn: two logins from new region (separate ticket)\nmarketing: email about product launch banner"}],"q":"(shown per step)","steps":[{"id":"s1","label":"Step 1","q":"Unit A12 carries a <b>valid vendor signature</b> AND a <b>deviating hash</b> plus TXT beacons. Which signal wins, and what do you do first?","options":[{"id":"o1","x":"The hash deviation + beacons win; signatures attest the publisher, not this unit&rsquo;s flash &mdash; treat A12 as suspected tampered","correct":true,"outcome":"The case is framed: publisher identity does not certify unit integrity, and the beacon pattern is unit-specific.","why":"Correct: a signature answers &lsquo;who built this firmware line&rsquo;, never &lsquo;is this exact unit unmodified&rsquo; &mdash; and the beacon asymmetry versus A11/A13 is unit-level evidence."},{"id":"o2","x":"The valid signature wins; hash tooling must be wrong &mdash; clear A12 for production","correct":false,"outcome":"A12 joins production with an unexplained beacon pattern and a deviating hash on record.","why":"Not correct: it elevates one signal to infallibility and ignores the unit-specific asymmetry the other units lack."},{"id":"o3","x":"Signals void each other &mdash; do nothing until EDR fires","correct":false,"outcome":"The case idles; EDR will not fire on firmware by design.","why":"Not correct: contradiction is a reason to arbitrate signals, not to abandon judgement &mdash; and EDR is structurally blind here."}]},{"id":"s2","label":"Step 2","q":"The CISO asks for immediate action on A12. What is the first physical action?","options":[{"id":"o1","x":"Read-only preservation: dump A12&rsquo;s SPI flash and boot logs, hash them, start the custody record","correct":true,"outcome":"Evidence is on disk and hashed before anyone touches the device; the vendor now has something it can analyse.","why":"Correct: evidence is perishable and the vendor&rsquo;s own analysis (their L2 could not answer rev D questions) will need your dump."},{"id":"o2","x":"Reflash A12 with the vendor image so it is clean before the weekend","correct":false,"outcome":"The flash is rewritten &mdash; the pre-reflash state no longer exists for vendor analysis or forensics.","why":"Not correct: destroying the questioned state to obtain a clean one is evidence destruction dressed as hygiene."},{"id":"o3","x":"Ship A12 back to the vendor immediately","correct":false,"outcome":"Your only physical evidence leaves the building without a dump or custody record.","why":"Not correct: the vendor asked questions your artefacts answer &mdash; and once shipped, chain of custody is theirs, not yours."}]},{"id":"s3","label":"Step 3","q":"The datacenter expansion needs all 12 units racked by Monday. Legal asks about risk. What is the call?","options":[{"id":"o1","x":"Delay the batch; rack only after per-unit hash + attestation baselining &mdash; accept the schedule cost","correct":true,"outcome":"The expansion slips days; every unit enters production with a recorded integrity baseline.","why":"Correct: the cost is real and accepted &mdash; racking a possibly-tampered batch to save days is the worse trade."},{"id":"o2","x":"Rack on schedule; the risk lives only in A12","correct":false,"outcome":"Eleven unverified units go live next to a confirmed anomaly from the same batch.","why":"Not correct: one confirmed anomaly in a batch is evidence about the batch&rsquo;s chain, not about one unit."},{"id":"o3","x":"Rack everything except A12 and re-baseline &lsquo;later&rsquo;","correct":false,"outcome":"&lsquo;Later&rsquo; never has a change window; the batch baseline quietly dies.","why":"Not correct: &lsquo;later&rsquo; baselining has no owner and no deadline &mdash; it is deferral in a costume."}]},{"id":"s4","label":"Step 4","q":"Which escalation closes the case correctly for now?","options":[{"id":"o1","x":"Supply-chain risk board with the evidence pack; procurement holds the batch; vendor gets the flash dump under NDA","correct":true,"outcome":"Three owners, three artefacts, one custody chain &mdash; the case now moves in parallel where it should.","why":"Correct: T1195.003 at batch scale is a governance event &mdash; it exceeds the SOC&rsquo;s remit the moment a second unit or a plant question appears."},{"id":"o2","x":"Close the SOC ticket for A12 and note &lsquo;vendor informed&rsquo;","correct":false,"outcome":"One ticket closed; eleven units, a contract question and a custody chain have no owner.","why":"Not correct: the ticket scope was one unit; the case scope is a batch and a chain."},{"id":"o3","x":"Public disclosure to pressure the vendor","correct":false,"outcome":"Legal is now managing press instead of evidence, and the vendor&rsquo;s cooperation drops.","why":"Not correct: disclosure is a legal decision with contractual timing &mdash; not a lever to pull mid-investigation."}]}],"hint":"Arbitrate signals by what each can actually prove; preserve before anything moves; accept the cost that keeps evidence alive; escalate at the scale the evidence implies.","expl":"<b>Attacker view:</b> the attacker&rsquo;s residual risk is a per-unit comparison &mdash; A11 vs A12 is exactly the diff that exposes unit-targeted interdiction; one valid batch-wide signature does not survive that diff. <b>Defender view:</b> the four answers form the senior playbook: arbitrate signals explicitly, preserve read-only, accept schedule cost over unknown integrity, escalate at batch scale. Note the noise (VPN logins, marketing mail) belongs to other cases &mdash; folding it in would have diluted every answer.","study":"Rewrite the four answers as your organisation&rsquo;s &lsquo;suspected batch&rsquo; policy card."},{"id":"x2","type":"terminal","title":"Preserve the flash, lose nothing","summary":"Read-only SPI flash dump to evidence storage &mdash; the safe command is the test","scen":[{"t":"p","x":"You are on A12&rsquo;s service shell (a minimal Linux boot environment with the mtd SPI driver loaded). Legal&rsquo;s instruction: <b>&ldquo;we need evidence that survives scrutiny&rdquo;</b> &mdash; nothing may write to the chip, and the dump must land under <span class='mono'>/mnt/evidence/</span> (a read-write mount you attach from a clean USB bridge). The SPI flash is <span class='mono'>/dev/mtd0</span>. Choose the command a forensic reviewer would sign off."}],"q":"Create the evidence image of <b>/dev/mtd0</b> under <b>/mnt/evidence/</b>, reading only. Type the command, press Enter, then Check.","canonical":"dd if=/dev/mtd0 of=/mnt/evidence/spi0.bin bs=4k","canonWhy":"<span class='kw'>dd</span> performs a raw block copy; <b>if=/dev/mtd0</b> names the flash as the read source; <b>of=/mnt/evidence/spi0.bin</b> writes the copy to the evidence mount (never to the chip); <b>bs=4k</b> matches the SPI erase-block size so the dump aligns with the flash&rsquo;s own geometry. Swapping if/of writes to the chip &mdash; that is the destructive near-miss this exercise is built around.","parts":[{"name":"tool: raw block copier","ok":"^dd$","bad":"^flashrom$|^shred$|^mkfs$|^cp$","why":"dd is the canonical raw copy tool present on the shell. flashrom -w is a writer; shred and mkfs destroy; cp between device nodes is not the audited pattern."},{"name":"input is the flash chip","ok":"^if=/dev/mtd0$","bad":"^of=/dev/mtd","why":"The chip must be the <b>input</b>. Any command that names /dev/mtd0 as output writes to the very evidence you are protecting."},{"name":"output under the evidence mount","ok":"^of=/mnt/evidence/","bad":"^of=/dev/","why":"The dump must land under /mnt/evidence/. Writing to another device node is either meaningless or destructive."},{"name":"block size aligned to SPI geometry","ok":"^bs=4k$|^bs=4096$","bad":"","why":"bs=4k (4096 bytes) aligns the copy with the SPI erase blocks &mdash; the dump reviews cleanly block-by-block. Omitting bs still works but produces an unaligned artefact a reviewer would query."}],"dangerous":["of=/dev/mtd","flashrom\\s+.*-w","shred","mkfs","dd[^|]*of=/dev/","rm\\s+-rf"],"outputs":[{"m":"dd\\s+if=/dev/mtd0\\s+of=/mnt/evidence/\\S+.*bs=","x":"32768+0 records in\n32768+0 records out\n134217728 bytes (134 MB, 128 MiB) copied, 41.2 s, 3.3 MB/s"},{"m":"dd\\s+if=/dev/mtd0\\s+of=/mnt/evidence/","x":"32768+0 records in\n32768+0 records out\n134217728 bytes (134 MB, 128 MiB) copied, 43.9 s, 3.1 MB/s  <span class='dm'>(no bs given &mdash; unaligned but complete)</span>"},{"m":"dd[^|]*of=/dev/mtd|flashrom\\s+.*-w|shred|mkfs","x":"dd: opening &lsquo;/dev/mtd0&rsquo;: Read-only file system  <span class='er'>(SIMULATION STOP &mdash; in production this wrote to the chip. You just modified the evidence.)</span>"},{"m":"^dd","x":"dd: unrecognized operand &mdash; this simulation accepts dd with if=/dev/mtd0, of=/mnt/evidence/..., optional bs=4k"}],"hint":"Legal wants the chip read, never written. In dd vocabulary, which operand reads and which writes &mdash; and where does the copy go?","expl":"<b>The safe command is the test.</b> <span class='mono'>dd if=/dev/mtd0 of=/mnt/evidence/spi0.bin bs=4k</span> reads the chip once and writes to the evidence mount. The near-miss <span class='mono'>dd of=/dev/mtd0</span> reverses it and <b>overwrites the flash</b> &mdash; in production that is evidence destruction with one swapped argument, which is why it is flagged DANGEROUS here. <span class='mono'>flashrom -w</span> is an explicit chip writer; <span class='mono'>shred</span> destroys. <b>Follow-up discipline:</b> hash the dump (sha256sum) and record the hash in the custody log before anything else touches the device.","study":"Practise the if/of muscle memory on a USB stick you do not care about &mdash; then explain to a colleague why the swapped version destroys evidence."},{"id":"x3","type":"mcq","title":"Two signals, one verdict","summary":"Valid attestation on one unit vs hash mismatch on its twin","scen":[{"t":"p","x":"Twin servers A11 and A12 shipped in the same batch. <b>A11: TPM attestation passes</b>, PCR chain matches the recorded baseline. <b>A12: firmware hash deviates</b> from the vendor build, but a consultant notes &ldquo;attestation on our lab twin passed too&rdquo;. The CISO asks which signal wins."},{"t":"mono","label":"ARTEFACT 1 — CONSULTANT&rsquo;S NOTE","x":"&ldquo;TPM attestation proves the platform is healthy. Trust it over hash tooling, which is easy to misconfigure.&rdquo;"}],"q":"Which reasoning wins, and why?","options":[{"id":"a","x":"The hash mismatch wins: attestation proves the measured chain <i>as configured</i>, not that flash matches the vendor build &mdash; a tampered unit measures its own tampered state consistently","why":"Correct: measured boot records what booted; it cannot by itself know what <i>should</i> have booted. Only the vendor-build comparison answers that &mdash; and only A12 deviates."},{"id":"b","x":"The attestation wins: hardware-rooted evidence outranks software hash tooling","why":"Near miss &mdash; &lsquo;hardware-rooted&rsquo; sounds decisive, but the TPM reports measurements, not correctness; the consultant&rsquo;s lab twin is a different physical unit."},{"id":"c","x":"Neither wins &mdash; conflicting signals cancel until EDR finds something","why":"Not correct: cancellation is not arbitration, and EDR cannot observe this layer at all."},{"id":"d","x":"Both are void because the baseline was recorded on the same day as the scan","why":"Not correct: baseline recency affects drift detection, not a cross-unit deviation between two shipped units."}],"correct":"a","hint":"Ask what each signal can actually prove: measurements of what booted, versus comparison with what the vendor built. Only one compares against the vendor.","expl":"The consultant&rsquo;s note commits the classic category error: <b>attestation integrity vs content correctness</b>. A tampered platform measures its tampered firmware faithfully &mdash; the TPM chain is intact precisely because the implant bootstrapped cleanly. The discriminating evidence is the <b>cross-unit diff</b>: A11 matches the vendor build, A12 does not. <b>Lesson:</b> when two signals conflict, name what each one proves before ranking them; here the ranking is not close.","study":"Explain the difference between &lsquo;measured boot&rsquo; and &lsquo;verified boot&rsquo; to your team &mdash; the confusion is widespread."},{"id":"x4","type":"order","title":"Estate triage under budget","summary":"Rank five findings for first response, given real constraints","scen":[{"t":"p","x":"One response engineer, one week. Five findings across the estate. Rank by first-response order &mdash; position 1 = go there first. Exposure and evidence-perishability both count."},{"t":"mono","label":"ARTEFACT 1 — FINDINGS","x":"E1 edge firewall: attestation FAIL, internet-facing, live\nE2 core DC switch: fw hash mismatch, internal, live\nE3 spare unit, same batch as E2: in stock, powered off\nE4 branch printer: fw version drift (baseline 2 years old)\nE5 lab device: attestation FAIL, already isolated for a month"}],"q":"Rank the findings for first response.","items":[{"id":"o1","x":"E1 &mdash; edge firewall, internet-facing, attestation failing"},{"id":"o2","x":"E2 &mdash; core DC switch with firmware hash mismatch"},{"id":"o3","x":"E3 &mdash; powered-off spare from the suspect batch"},{"id":"o4","x":"E4 &mdash; branch printer with stale-baseline version drift"},{"id":"o5","x":"E5 &mdash; lab device already isolated for a month"}],"correctOrder":["o1","o2","o3","o4","o5"],"why":{"o1":"Correct at 1: internet-facing, live, and actively failing attestation &mdash; highest exposure with perishable evidence.","o2":"Correct at 2: internal but domain-critical; the hash mismatch is a hard anomaly and its live state decays with every reboot.","o3":"Correct at 3: the powered-off spare from the same batch &mdash; cheap to secure now, and it must never re-enter service unchecked; its packaging evidence also degrades in stock.","o4":"Correct at 4: the printer&rsquo;s &lsquo;drift&rsquo; is against a two-year-old baseline &mdash; probably a stale record, not an implant; a documentation task.","o5":"Correct at 5: already isolated for a month and stable &mdash; containment exists, so response effort earns nothing new this week."},"hint":"Exposure first, evidence-perishability second, and &lsquo;already contained&rsquo; last &mdash; also ask whether the baseline behind E4 can even produce a true alarm.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 5)</span>. The ranking weighs <b>exposure &times; impact &times; perishability</b>: E1 is live at the boundary; E2 is internal but domain-critical with a hash mismatch; E3 is the cheap win that stops the suspect batch re-entering service (and its packaging evidence degrades in stock); E4&rsquo;s &lsquo;drift&rsquo; is probably a stale baseline &mdash; a documentation task, not an incident; E5 has been contained for a month and keeps. <b>Senior note:</b> placing E3 above E4 is the counter-intuitive step most teams miss &mdash; inventory control is cheaper than incident response.","study":"Re-rank your own open findings with the exposure &times; impact &times; perishability rule."},{"id":"x5","type":"multi","title":"Coverage gaps only experts name","summary":"Select the true expert statements about T1195.003 detection coverage","scen":[{"t":"p","x":"The detection engineering lead asks you to review the draft &lsquo;coverage gap&rsquo; slide before it goes to the CISO. Six statements are on it. Select every TRUE statement."}],"q":"Select all true statements.","options":[{"id":"a","x":"EDR rarely flags firmware installer activity because the parent processes are trusted toolchain binaries","why":"Correct: fwupd, vendor flashing utilities and OEM agents are trusted parents &mdash; the very trust the implant abuses also blinds the agent."},{"id":"b","x":"Registry-side analytics (manufacturer or maintainer changes) fire earlier than any endpoint telemetry","why":"Correct: a change in who can sign firmware is visible upstream of every device &mdash; the earliest available signal in this domain."},{"id":"c","x":"SBOM/HBOM divergence is a post-hoc signal &mdash; it confirms exposure after installation, it cannot block it","why":"Correct: the bill of materials is compared after goods arrive; it is detection and scoping, not prevention."},{"id":"d","x":"Signature validation alone is insufficient when the signing identity itself is compromised","why":"Correct: a stolen or coerced signing identity produces perfectly signed tampered firmware &mdash; signatures answer &lsquo;who&rsquo;, not &lsquo;is this unit modified&rsquo;."},{"id":"e","x":"Network detection for build-VLAN anomalies has zero false positives once baselined","why":"Not correct: no network analytic in a dynamic VLAN is zero-FP; CDN and telemetry churn guarantee tuning work."},{"id":"f","x":"Firmware telemetry is universally collected by EDR products today","why":"Not correct: coverage is patchy and vendor-specific &mdash; assuming universality is how the gap hides."}],"correct":["a","b","c","d"],"hint":"Three true statements describe blind spots of trust, timing and identity; one promises a perfection no real analytic has.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 4)</span>. The four true statements are the honest gaps: trusted-parent blindness, upstream registry signals, post-hoc BOM value, and identity-compromised signatures. The two false ones promise universality and perfection &mdash; the two claims that never survive a real SOC. <b>Slide review habit:</b> a coverage slide that admits gaps with numbers beats one that hides them with adjectives.","study":"Score your own estate against the four true gaps and bring numbers to the next review."},{"id":"x6","type":"order","title":"Programme-level investigation","summary":"Order the evidence-first investigation from freeze to disclosure","scen":[{"t":"p","x":"A suspected interdicted batch spans three sites. This is not a device-level case any more &mdash; it is a programme-level investigation. Five phases are shuffled; two orders destroy evidence or leak disclosure timing."}],"q":"Order the five phases from first to last.","items":[{"id":"o1","x":"Freeze affected devices; preserve flash dumps, attestations and packaging with custody records"},{"id":"o2","x":"Establish first-seen: shipping timeline, first beacon in logs, batch provenance"},{"id":"o3","x":"Map blast radius: same batch and serial range across all sites and stock"},{"id":"o4","x":"Coordinated containment: quarantine the batch, rotate credentials reachable from affected devices"},{"id":"o5","x":"Disclosure and postmortem: legal-timed notifications and the process fix"}],"correctOrder":["o1","o2","o3","o4","o5"],"why":{"o1":"Correct first: freezing and preserving comes before scoping, because flash dumps and packaging degrade or vanish while you plan.","o2":"Correct second: first-seen reconstructs the timeline from preserved artefacts &mdash; it tells you how far back the chain failure reaches.","o3":"Correct third: blast radius turns one device into a batch problem &mdash; same serial ranges, same shipment routes, all sites.","o4":"Correct fourth: coordinated containment follows scope &mdash; quarantine the batch and rotate every credential the affected devices could reach.","o5":"Correct last: disclosure timing is a legal decision that depends on facts from phases 1&ndash;4; speaking earlier freezes the wrong facts."},"hint":"Preserve what decays, reconstruct the timeline, scope the blast radius, contain in coordination, then speak &mdash; in that order.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 5)</span>. The programme ladder differs from the device ladder (preserve &rarr; compare &rarr; isolate) by adding <b>first-seen</b> and <b>blast radius</b> before containment: you cannot quarantine a batch you have not scoped, and you cannot scope it without the timeline. Disclosure comes last because legal timing depends on facts established in phases 1&ndash;4 &mdash; disclosing early freezes the wrong facts. <b>Contrast with h7:</b> that ladder handled one device; this one handles a batch across sites, which is why scope precedes containment here.","study":"Write the two ladders side by side &mdash; device-level and programme-level &mdash; and mark where they diverge."},{"id":"x7","type":"categorize","title":"Supply chain or not &mdash; expert cut","summary":"Six signals, four buckets: the three T1195 siblings and &lsquo;not supply chain&rsquo;","scen":[{"t":"p","x":"Six signals from a joint CTI/AppSec review. Every bucket takes exactly one signal. Two of these will tempt you toward the same bucket &mdash; the tamper point decides."}],"q":"Drag each signal to its bucket.","slots":[{"id":"s1","label":"T1195.003 &mdash; hardware / firmware","why":"Correct: a controller hidden inside shipped rack hardware is tampering in the physical chain, before delivery."},{"id":"s2","label":"T1195.002 &mdash; software product / update channel","why":"Correct: replacing the vendor&rsquo;s own distributed image attacks the product&rsquo;s delivery channel."},{"id":"s3","label":"T1195.001 &mdash; dependencies / dev tools","why":"Correct: a hijacked maintainer account pushing a poisoned plugin attacks the developer ingredient layer."},{"id":"s4","label":"Not supply chain","why":"Correct: an insider exfiltrating over VPN is post-access data theft &mdash; no product or delivery mechanism was touched."}],"items":[{"id":"i1","x":"Console cable with a hidden micro-controller ships inside a rack consignment"},{"id":"i2","x":"Vendor&rsquo;s official update ISO is replaced on their download portal"},{"id":"i3","x":"Hijacked marketplace account pushes a backdoored IDE plugin to developers"},{"id":"i4","x":"Insider copies the customer database over VPN from a contracted laptop"}],"correct":{"i1":"s1","i2":"s2","i3":"s3","i4":"s4"},"hint":"Ask what was touched: the physical chain, the product&rsquo;s distribution, the developer&rsquo;s ingredients &mdash; or nothing a buyer ever receives.","expl":"The three T1195 siblings each own a tamper point: <b>physical chain (.003), product distribution (.002), code ingredients (.001)</b>. The insider case names the boundary of the family: nothing in the buyer&rsquo;s supply chain was modified, so no sibling applies. <b>Expert cut:</b> &lsquo;supply chain&rsquo; is not shorthand for &lsquo;anything bad&rsquo; &mdash; the phrase survives only when a product or its delivery mechanism is the vehicle.","study":"Take three headlines from this month&rsquo;s news and cut them into these four buckets."},{"id":"x8","type":"fill","title":"Executive summary drafting","summary":"Complete the board summary with five precise terms","scen":[{"t":"p","x":"The board summary must be precise: five terms carry the entire technical story. The bank is shuffled and includes one decoy."}],"q":"Fill the five blanks with words from the bank.","parts":[{"t":"x","x":"Remote "},{"t":"b","id":"b1"},{"t":"x","x":" failed on one unit of the batch; "},{"t":"b","id":"b2"},{"t":"x","x":" boot logs show an unsigned SMM driver. The unit was quarantined with full "},{"t":"b","id":"b3"},{"t":"x","x":" of "},{"t":"b","id":"b4"},{"t":"x","x":", and the vendor&rsquo;s "},{"t":"b","id":"b5"},{"t":"x","x":" did not list the extra flash chip found on inspection."}],"bank":["attestation","measured","chain","custody","HBOM","antivirus"],"answers":{"b1":"attestation","b2":"measured","b3":"chain","b4":"custody","b5":"HBOM"},"blankNames":{"b1":"remote check","b2":"which boot logs","b3":"evidence term 1","b4":"evidence term 2","b5":"which bill"},"why":{"b1":"Correct: remote <b>attestation</b> is the TPM-backed check that failed &mdash; the technical trigger of the case.","b2":"Correct: <b>measured</b> boot logs are what recorded the unsigned SMM driver &mdash; name the log class, not just &lsquo;logs&rsquo;.","b3":"Correct: the evidence phrase is &lsquo;chain of custody&rsquo; &mdash; <b>chain</b> starts it.","b4":"Correct: &hellip;and <b>custody</b> completes it: who touched the evidence, when, and why.","b5":"Correct: the <b>HBOM</b> is the hardware bill of materials &mdash; the document that failed to list the extra chip."},"hint":"The five terms: the check that failed, the logs that recorded it, the two-word evidence phrase, and the bill that missed the chip.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 5)</span>. The sentence carries the case in one breath: <b>attestation failure</b> (trigger), <b>measured boot logs</b> (evidence), <b>chain of custody</b> (admissibility), <b>HBOM divergence</b> (the physical lie). Boards act on sentences like this; vague ones &lsquo;we found some malware stuff&rsquo; produce no decisions. The decoy (&lsquo;antivirus&rsquo;) has no role at this layer &mdash; which is itself the lesson.","study":"Condense your last incident into five precise terms and one sentence."},{"id":"x9","type":"sim","title":"Ship or stop &mdash; the release call","summary":"Four decisions on release day with a suspect batch and a live deadline","scen":[{"t":"mono","label":"ARTEFACT 1 — SITUATION BOARD","x":"release: datacenter expansion, 12 servers, contractual deadline tomorrow\nfinding: 1 of 12 fails attestation; vendor email &lsquo;batch OK&rsquo; (no unit-level data)\nauditors: want the evidence pack for the quarterly review\nVP: &ldquo;we ship tonight, we verify next sprint&rdquo;"},{"t":"mono","label":"ARTEFACT 2 — NOISE (real, irrelevant)","x":"canteen menu change; parking-lot resurfacing notice"}],"q":"(shown per step)","steps":[{"id":"s1","label":"Step 1","q":"The VP&rsquo;s proposal is on the table: &lsquo;wipe all 12, rebuild tonight, ship&rsquo;. Your move as the senior engineer in the room?","options":[{"id":"o1","x":"Reject the wipe-for-speed trade: preserve first &mdash; the unit-level evidence disappears the moment re-imaging starts","correct":true,"outcome":"The wipe is deferred; preservation starts on the one unit that matters most, right now.","why":"Correct: &lsquo;rebuild everything&rsquo; destroys the evidence the auditors need and answers nothing about firmware, which wiping does not even reach."},{"id":"o2","x":"Accept the VP&rsquo;s plan &mdash; rebuilds are harmless","correct":false,"outcome":"Twelve rebuilds tonight; the attestation evidence is gone and the firmware question is untouched.","why":"Not correct: the plan destroys evidence and addresses the wrong layer &mdash; the implant, if any, is below the OS image."},{"id":"o3","x":"Do nothing until the vendor replies","correct":false,"outcome":"The deadline passes while &lsquo;waiting&rsquo; &mdash; and preservation never happened either.","why":"Not correct: waiting is a choice with costs too; the only zero-regret move tonight is preservation."}]},{"id":"s2","label":"Step 2","q":"How do you treat the vendor&rsquo;s &lsquo;batch OK&rsquo; email?","options":[{"id":"o1","x":"Ask for unit-level data: per-unit builds, hashes and plant records &mdash; a batch-level &lsquo;OK&rsquo; cannot clear a unit-level anomaly","correct":true,"outcome":"The vendor escalates internally; you receive plant records that show the batch route.","why":"Correct: the granularity must match the anomaly &mdash; unit-level deviation, unit-level answer."},{"id":"o2","x":"Accept the email as clearance &mdash; the vendor knows its own factory","correct":false,"outcome":"The email clears nothing: it contains no unit identifiers at all.","why":"Not correct: a batch-level assertion without unit data is not clearance; it is correspondence."},{"id":"o3","x":"Reply publicly on social media to force a faster answer","correct":false,"outcome":"Public pressure burns the relationship and your legal position in one post.","why":"Not correct: vendor escalation runs through contract channels, not through the timeline."}]},{"id":"s3","label":"Step 3","q":"The deadline is real. Final call on the release?","options":[{"id":"o1","x":"Delay the batch; ship after per-unit hash + attestation baselining &mdash; state the cost openly to the VP","correct":true,"outcome":"The release slips days with a written rationale; the batch enters service with baselines recorded.","why":"Correct: accepting a known, stated cost beats accepting an unknown integrity risk into production."},{"id":"o2","x":"Ship tonight; the odds favour a clean batch","correct":false,"outcome":"Eleven unverified units enter production; the odds argument has no data behind it.","why":"Not correct: &lsquo;odds favour&rsquo; is a feeling &mdash; the one known anomaly already breaks the assumption."},{"id":"o3","x":"Ship the 11 &lsquo;clean&rsquo; units, hold one","correct":false,"outcome":"The batch evidence says the chain, not the unit, is in question.","why":"Not correct: holding one unit treats a batch problem as a unit problem &mdash; the same error in nicer clothes."}]},{"id":"s4","label":"Step 4","q":"What goes to the auditors and the board this quarter?","options":[{"id":"o1","x":"The evidence pack: attestation export, flash dump hash, custody record, vendor correspondence, and the decision log with costs","correct":true,"outcome":"Auditors sign off on a documented decision with accepted costs &mdash; the strongest possible quarter.","why":"Correct: a decision file with evidence and costs is what governance means; it also protects you personally."},{"id":"o2","x":"A verbal note that &lsquo;the vendor said it was fine&rsquo;","correct":false,"outcome":"The auditor&rsquo;s finding writes itself: undocumented decision, missing evidence.","why":"Not correct: verbal assurance is not a control and will not survive the review."},{"id":"o3","x":"Nothing &mdash; the case is closed because the release shipped","correct":false,"outcome":"The gap between the finding and the record is now your largest audit risk.","why":"Not correct: shipping is not closing; the record must exist either way."}]}],"hint":"Preserve what dies, match granularity to granularity, accept a stated cost over an unknown risk, and let the record protect the decision.","expl":"<b>Conflicting signals resolved explicitly:</b> the vendor&rsquo;s batch-level &lsquo;OK&rsquo; loses to your unit-level anomaly, because clearance granularity must match anomaly granularity. <b>Real cost accepted:</b> the delay is stated, written and owned &mdash; the exercise&rsquo;s &lsquo;cost&rsquo; requirement. <b>Best practice refused:</b> &lsquo;wipe and rebuild&rsquo; is standard hygiene and still wrong here &mdash; it destroys evidence and misses the layer. <b>Attacker view:</b> the attacker&rsquo;s win condition is a rushed ship night; your whole play denies the rush.","study":"Draft the one-page decision memo this scenario should produce &mdash; it is a template you will reuse."},{"id":"x10","type":"match","title":"Analytics and their false positives","summary":"Match each detection idea to its main false-positive source","scen":[{"t":"p","x":"Four detection ideas for T1195.003 signals. Every analytic has a dominant false-positive source &mdash; knowing it is what makes the analytic tunable. Match each to its FP source."}],"q":"Match each analytic to its dominant false-positive source.","lefts":[{"id":"l1","x":"Alert on new external domains resolved from the build/management VLAN","short":"New domains"},{"id":"l2","x":"Alert on manufacturer or firmware-signing entity changes","short":"Entity changes"},{"id":"l3","x":"Alert on unsigned drivers loading right after boot","small":"","short":"Unsigned drivers"},{"id":"l4","x":"Alert when the HBOM differs from the inspected unit","short":"HBOM divergence"}],"rights":[{"id":"r1","x":"CDN and telemetry domains churn constantly &mdash; the baseline decays weekly"},{"id":"r2","x":"Legitimate ownership transfers and vendor acquisitions happen"},{"id":"r3","x":"Some legacy appliances legitimately ship unsigned vendor drivers"},{"id":"r4","x":"Inventory tooling version drift misreports components"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"},"why":{"l1":"Correct pair: new-domain analytics drown in CDN/telemetry churn &mdash; tuning means allow-listing the known churn, which decays and needs refresh.","l2":"Correct pair: signing-entity analytics fire on real acquisitions and handovers; the signal needs a human verdict each time.","l3":"Correct pair: unsigned-driver analytics collide with legacy appliances that ship unsigned drivers &mdash; scope by model baseline.","l4":"Correct pair: HBOM diffing inherits inventory tooling errors &mdash; calibrate the scanner before accusing the vendor."},"hint":"Two FP sources are about the world changing (churn, transfers), two are about imperfect records (legacy, tooling).","expl":"Every T1195.003 analytic trades sensitivity for noise, and each trade has a name: <b>domain churn, entity transfer, legacy unsigned, tooling drift</b>. <b>Detection-engineering discipline:</b> document the FP source inside the analytic&rsquo;s description &mdash; an alert whose FP profile is unknown gets tuned by whoever is most annoyed, which is how detections die. <b>Senior note:</b> the entity-change analytic (l2) is the earliest signal in the whole domain &mdash; and the one whose FPs are most political.","study":"Add an &lsquo;expected FP source&rsquo; field to three of your own analytics this week."},{"id":"x11","type":"mcq","title":"The best practice that fails here","summary":"Which widely-recommended action is wrong in this specific context?","scen":[{"t":"p","x":"After the suspected interdiction of a switch batch, the team proposes four actions. One of them is a widely recommended best practice that is <b>wrong in this context</b>. Find it."},{"t":"mono","label":"ARTEFACT 1 — PROPOSALS","x":"P1. Auto-apply all pending vendor firmware updates from the vendor CDN tonight\nP2. Verify firmware hashes against the vendor&rsquo;s signed baseline before any flash\nP3. Quarantine the suspect batch pending the vendor&rsquo;s unit-level answer\nP4. Add firmware telemetry (attestation, versions) to the detection baselines"}],"q":"Which proposal is the best practice that fails in this context?","options":[{"id":"a","x":"P1 &mdash; auto-apply vendor updates from the CDN tonight","why":"Correct here &mdash; and wrong only here: auto-updating is excellent hygiene <i>until the update channel itself is under suspicion</i>; writing a possibly-compromised image to suspect flash destroys the evidence and may install the implant&rsquo;s sibling."},{"id":"b","x":"P2 &mdash; verify against the signed baseline first","why":"Correct practice in every context: no flash happens before verification &mdash; this is M1046 thinking."},{"id":"c","x":"P3 &mdash; quarantine the suspect batch","why":"Correct here: one confirmed unit-level anomaly makes the batch, not the unit, the containment scope."},{"id":"d","x":"P4 &mdash; add firmware telemetry to baselines","why":"Correct here: every future detection depends on exactly this telemetry existing."}],"correct":"a","hint":"Best practices assume a trusted channel. Re-read the artefacts and ask what this specific case just did to that assumption.","expl":"<b>The named trap:</b> &lsquo;always keep firmware updated&rsquo; is textbook guidance &mdash; and in this case the textbook is wrong, because the suspect material is the channel and the flash itself. Writing tonight&rsquo;s update over suspect flash destroys the evidence state and can silently complete an attacker&rsquo;s persistence. <b>Lesson:</b> best practices are context-free rules for context-full worlds; the senior skill is knowing which assumption each one silently makes &mdash; here, &lsquo;the vendor channel is intact&rsquo;.","study":"Take one of your standard practices and write down the hidden assumption that could break it."},{"id":"x12","type":"logsel","title":"High-noise hunt on the merged export","summary":"Filter 40 lines &mdash; find the unsigned SMM driver, the TXT beacon and the out-of-window flash write","scen":[{"t":"p","x":"A merged export from the suspected unit: kernel ring, DNS resolver snippets, and maintenance scheduler output &mdash; 40 lines, mostly noise. The case needs three artefact classes: an unsigned SMM driver load, an external TXT beacon, and a flash write outside a maintenance window. Filter, find, select one line of each class."}],"q":"Select the three lines: (1) unsigned SMM driver, (2) external TXT beacon, (3) out-of-window flash write.","lines":[{"id":1,"x":"jun 14 22:00:01 kernel: UEFI v2.7 (EDK II) boot"},{"id":2,"x":"jun 14 22:00:01 kernel: ACPI: Core Revision 20200528"},{"id":3,"x":"jun 14 22:00:02 kernel: smpboot: CPU0: scalable boot"},{"id":4,"x":"jun 14 22:00:02 kernel: pci 0000:00:1f.2: AHCI controller"},{"id":5,"x":"jun 14 22:00:03 kernel: SMM: module 'svcsmm' loaded (unsigned, vendor unknown)"},{"id":6,"x":"jun 14 22:00:03 kernel: mpt3sas: version 32.0 loaded"},{"id":7,"x":"jun 14 22:00:04 kernel: nvme nvme0: 4/0/0 default/read/poll queues"},{"id":8,"x":"jun 14 22:00:05 systemd: reached target Basic System"},{"id":9,"x":"jun 14 22:00:06 named: A updates-vendor-cdn[.]example (expected, allow-listed)"},{"id":10,"x":"jun 14 22:00:07 fwupd: 0 updates pending"},{"id":11,"x":"jun 14 22:05:00 sched: nightly integrity job queued (window 22:05-23:00)"},{"id":12,"x":"jun 14 22:05:10 kernel: mtd: spi0 flash device registered"},{"id":13,"x":"jun 14 22:05:30 cron: integrity job started"},{"id":14,"x":"jun 14 22:06:02 kernel: SPI flash erase+write at 0x007f0000 (window active)"},{"id":15,"x":"jun 14 22:07:00 cron: integrity job finished OK"},{"id":16,"x":"jun 14 23:10:00 systemd: daily maintenance complete"},{"id":17,"x":"jun 15 01:14:00 named: A ntp-lan (internal)"},{"id":18,"x":"jun 15 01:14:09 named: A repo-lan (internal)"},{"id":19,"x":"jun 15 01:31:00 named: TXT metrics-relay[.]example"},{"id":20,"x":"jun 15 01:31:02 named: TXT response k8=9c.. received"},{"id":21,"x":"jun 15 02:02:00 named: A ntp-lan (internal)"},{"id":22,"x":"jun 15 02:02:11 named: A repo-lan (internal)"},{"id":23,"x":"jun 15 03:00:00 logrotate: rotate complete"},{"id":24,"x":"jun 15 03:31:00 named: TXT metrics-relay[.]example"},{"id":25,"x":"jun 15 03:31:01 named: TXT response dl=none received"},{"id":26,"x":"jun 15 04:00:00 backup: snapshot job started"},{"id":27,"x":"jun 15 04:00:41 backup: snapshot OK (2.1 TB)"},{"id":28,"x":"jun 15 04:10:00 named: A repo-lan (internal)"},{"id":29,"x":"jun 15 05:00:00 sched: patch window opens 05:00-07:00"},{"id":30,"x":"jun 15 05:05:00 kernel: SPI flash write at 0x00021000 (OUTSIDE window -- none open)"},{"id":31,"x":"jun 15 05:05:02 kernel: mtd: write verify skipped"},{"id":32,"x":"jun 15 05:06:00 named: A ntp-lan (internal)"},{"id":33,"x":"jun 15 06:00:00 sched: patch window closed, no jobs ran"},{"id":34,"x":"jun 15 06:31:00 named: TXT metrics-relay[.]example"},{"id":35,"x":"jun 15 06:31:01 named: TXT response cmd=slot3 received"},{"id":36,"x":"jun 15 07:00:00 systemd: startup finished"},{"id":37,"x":"jun 15 07:05:00 auditd: policy reloaded"},{"id":38,"x":"jun 15 07:10:00 kernel: mpt3sas: reset issued (routine)"},{"id":39,"x":"jun 15 07:30:00 backup: catalog pruned"},{"id":40,"x":"jun 15 08:00:00 daily: summary mail sent"}],"correct":[5,19,30],"filter":true,"why":{"5":"Correct: the unsigned SMM driver with an unknown vendor &mdash; SMM is the highest-privilege firmware context on x86, and &lsquo;unsigned&rsquo; here means the platform could not attribute it.","19":"Correct: the first external TXT beacon to the relay domain at 01:31 &mdash; outside every maintenance window, from a host whose only expected external name is the allow-listed vendor CDN.","30":"Correct: the SPI flash write at 05:05 with the scheduler recording <i>no open window</i> &mdash; firmware was rewritten by something with no right to do it.","1":"Noise: UEFI boot banner &mdash; every boot starts this way.","2":"Noise: ACPI core revision &mdash; standard.","3":"Noise: CPU boot line &mdash; standard.","4":"Noise: AHCI controller probe &mdash; standard.","6":"Noise: a signed storage-controller driver &mdash; the healthy pattern.","7":"Noise: NVMe queue setup &mdash; standard.","8":"Noise: systemd target reached &mdash; standard.","9":"Context: the vendor CDN lookup is allow-listed &mdash; the one external name that is normal; do not select it as the beacon.","10":"Noise: fwupd reporting no pending updates.","11":"Context: the scheduler defines the nightly integrity window &mdash; this line is what makes line 14 legal and line 30 illegal.","12":"Noise: the mtd device registering is normal on systems with SPI flash.","13":"Noise: the integrity job starting inside its window.","14":"The trap: a flash write inside the 22:05&ndash;23:00 integrity window &mdash; byte-identical activity to line 30, opposite verdict. Context decides, not the string.","15":"Noise: the integrity job finishing OK inside its window.","16":"Noise: maintenance-complete marker.","17":"Noise: internal NTP lookup &mdash; baseline.","18":"Noise: internal repo lookup &mdash; baseline.","20":"Context only: the beacon&rsquo;s response payload &mdash; pairs with line 19 but is not the query artefact.","21":"Noise: internal NTP lookup.","22":"Noise: internal repo lookup.","23":"Noise: logrotate &mdash; routine.","24":"Second beacon &mdash; same artefact class as line 19; the case asked for one line per class.","25":"Context only: beacon response payload.","26":"Noise: backup snapshot starting.","27":"Noise: backup finishing OK.","28":"Noise: internal repo lookup.","29":"Context: the patch window opens 05:00&ndash;07:00 &mdash; which is exactly why line 30&rsquo;s 05:05 write is still out-of-window: the scheduler record at 33 says no jobs ran.","31":"Context only: &lsquo;write verify skipped&rsquo; corroborates line 30 but is not the write artefact.","32":"Noise: internal NTP lookup.","33":"Context: &lsquo;no jobs ran&rsquo; in the patch window &mdash; the line that closes the innocent explanation for line 30.","34":"Third beacon &mdash; same class again; regularity ~31 min, one line suffices.","35":"Context only: the &lsquo;cmd=slot3&rsquo; payload &mdash; a command arriving over DNS TXT.","36":"Noise: startup-finished marker.","37":"Noise: audit policy reload &mdash; routine.","38":"Noise: routine controller reset.","39":"Noise: backup catalog pruning.","40":"Noise: the daily summary mail."},"hint":"Filter on &lsquo;SMM&rsquo;, then &lsquo;TXT&rsquo;, then &lsquo;window&rsquo;. Read line 14 carefully before choosing a flash line &mdash; one of the writes is inside a legitimate window.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 3)</span>. The three artefact classes are line 5 (unsigned SMM driver &mdash; ring -2 persistence), line 19 (first external TXT beacon; 19/24/34 repeat the same class, one line suffices), and line 30 (flash write with <b>no</b> window open). The deliberate trap is line 14: a flash write that <i>is</i> inside the 22:05&ndash;23:00 integrity window &mdash; looks identical, means maintenance. <b>Analyst discipline:</b> window context turns an identical byte pattern into opposite verdicts; filters find candidates, context decides.","study":"Reproduce this hunt on a real merged export and write down what your own appliance&rsquo;s &lsquo;window&rsquo; baseline is."},{"id":"x13","type":"multi","title":"Evidence handling under legal review","summary":"Select the three actions that preserve evidentiary value","scen":[{"t":"p","x":"Legal&rsquo;s checklist for the suspected unit is being assembled. Six proposed actions exist; select every action that <b>preserves</b> evidentiary value."}],"q":"Select all actions that preserve evidentiary value.","options":[{"id":"a","x":"Hash the flash dump, then copy it, recording both hashes in the custody log","why":"Correct: hash-then-copy proves the working copy matches the original &mdash; the foundation of admissibility."},{"id":"b","x":"Keep a chain-of-custody log: who touched the device, when, and why","why":"Correct: custody is what turns a file into evidence; gaps in it are what opposing experts attack."},{"id":"c","x":"Preserve the original packaging, seals and desiccant with photos before opening","why":"Correct: physical tampering evidence lives on the packaging &mdash; resealed seams, replaced labels, extra holes."},{"id":"d","x":"Reflash the device to a clean image before dumping, &lsquo;to stabilise it&rsquo;","why":"Not correct: reflashing rewrites the questioned state &mdash; the single most destructive well-intentioned act in this domain."},{"id":"e","x":"Wipe NVRAM variables after imaging &lsquo;to remove persistence&rsquo;","why":"Not correct: NVRAM boot entries are themselves evidence of what the platform was told to boot."},{"id":"f","x":"Discard the packaging after taking one casual photo","why":"Not correct: one photo loses seal texture, screw heads and label details that close tamper questions."}],"correct":["a","b","c"],"hint":"Three actions add proof; three subtract the questioned state. Evidence is the <i>questioned state itself</i>, not your fix of it.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 3)</span>. The preserving actions create <b>verifiability</b> (hashes), <b>accountability</b> (custody), and <b>physical context</b> (packaging). The destroying actions share one error: they treat the device as something to fix rather than something to prove. <b>Real-world task:</b> this checklist is lifted almost verbatim from forensic first-responder guides &mdash; it belongs in your hardware IR annex.","study":"Add the three preserving actions to your IR plan as numbered steps with named owners."},{"id":"x14","type":"mcq","title":"First move on an ambiguous signal","summary":"A serious-but-unproven signal lands at 16:40 on a Friday &mdash; what is the first move?","scen":[{"t":"mono","label":"ARTEFACT 1 — THE SIGNAL","x":"16:40 Friday: one core switch reports an attestation failure.\nNothing else anomalous. Vendor unreachable until Monday.\nChange window: none. Next business impact review: Monday 09:00."}],"q":"What is the correct first move?","options":[{"id":"a","x":"Preserve read-only telemetry from the switch and escalate quietly to the on-call chain for a Monday plan","why":"Correct: evidence is captured while fresh, nobody&rsquo;s weekend is burned on a destructive action, and Monday starts with a plan instead of a mystery."},{"id":"b","x":"Power off the entire core stack now to be safe","why":"The cost trap: an outage of the core over one unproven signal is a business decision made in panic &mdash; and booting the stack later destroys volatile state anyway."},{"id":"c","x":"Do nothing until Monday&rsquo;s review &mdash; collect nothing, tell nobody","why":"Not correct: telemetry decays over a weekend of logs and reboots; silence also removes your options on Monday."},{"id":"d","x":"Post the finding on a public channel to crowdsource a diagnosis","why":"Not correct: public disclosure of an unverified internal finding is a legal and reputational own-goal."}],"correct":"a","hint":"The exercise set rewards the option that keeps every later option open &mdash; ask which action forecloses the fewest paths.","expl":"This is the &lsquo;do nothing yet &mdash; gather more evidence&rsquo; exercise: the correct answer is a <b>non-technical action with a technical payload</b>. Preservation is cheap, quiet and reversible; the core-stack shutdown is irreversible and costs the business; total inaction loses the weekend&rsquo;s telemetry. <b>Senior register:</b> escalate quietly does not mean escalate invisibly &mdash; the on-call chain is told, in one line, with the artefact attached.","study":"Write your own &lsquo;Friday 16:40&rsquo; one-liner template for signals like this."},{"id":"x15","type":"match","title":"Who needs what","summary":"Match each stakeholder to the deliverable they need from a hardware supply chain case","scen":[{"t":"p","x":"The case file is being packaged for four stakeholders. Each needs a different deliverable &mdash; giving them all the same document is how cases stall."}],"q":"Match each stakeholder to the deliverable they need.","lefts":[{"id":"l1","x":"CISO","short":"CISO"},{"id":"l2","x":"Legal &amp; privacy","short":"Legal"},{"id":"l3","x":"Procurement","short":"Procurement"},{"id":"l4","x":"SOC lead","short":"SOC lead"}],"rights":[{"id":"r1","x":"A risk decision memo: options, costs, recommendation"},{"id":"r2","x":"Disclosure obligations review and evidence admissibility assessment"},{"id":"r3","x":"Batch hold notice and contract-remedies brief"},{"id":"r4","x":"Telemetry scope and containment runbook"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"},"why":{"l1":"Correct: the CISO owns the decision &mdash; they need options with costs, not raw telemetry.","l2":"Correct: legal owns judgement &mdash; what must be disclosed, when, and whether the evidence survives challenge.","l3":"Correct: procurement owns buying power &mdash; the batch hold and the contract remedies that fund the fix.","l4":"Correct: the SOC lead owns hunting &mdash; telemetry scope and the containment runbook."},"hint":"One decides, one judges, one buys, one hunts. Which deliverable belongs to which verb?","expl":"<b>Decision (CISO):</b> options with costs &mdash; delay, replace, accept risk. <b>Judgement (Legal):</b> what must be disclosed, when, and whether the evidence would survive challenge. <b>Buying power (Procurement):</b> the batch hold and the contract clauses that pay for the failure. <b>Hunting (SOC lead):</b> what to collect and how to contain. <b>Real-world failure mode:</b> sending the SOC runbook to the CISO produces micromanagement; sending the risk memo to procurement produces nothing &mdash; matching deliverables to stakeholders is an incident skill, not paperwork.","study":"List your four stakeholders by name and write the one-line deliverable each will get next time."}]};

  var H=0,W=0,cs={};
  correct.forEach(function(c){cs[c]=1;});
  selected.forEach(function(x){ if(cs[x])H++; else W++; });
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED */
function tSet(next){
  var prev=S.timerState;
  if(prev==='PAUSED_MANUAL' && next!=='PAUSED_MANUAL'){S.manualPauseSec+=(Date.now()-S.ovStart)/1000;}
  if(prev==='PAUSED_AUTO_CHECK' && next!=='PAUSED_AUTO_CHECK'){S.feedbackPauseSec+=(Date.now()-S.fbStart-S.ovAccum)/1000;S.ovAccum=0;}
  if(next==='PAUSED_MANUAL' && prev!=='PAUSED_MANUAL'){S.ovStart=Date.now();}
  if(next==='PAUSED_AUTO_CHECK' && prev!=='PAUSED_AUTO_CHECK'){S.fbStart=Date.now();}
  S.timerState=next; updateHeader();
}
function startTimer(){
  if(S.tick)clearInterval(S.tick);
  S.tick=setInterval(function(){
    if(S.timerState!=='RUNNING')return;
    S.secondsLeft--;
    if(S.secondsLeft<=0){S.secondsLeft=0;updateHeader();timerEnd();return;}
    updateHeader();
  },1000);
  tSet('RUNNING');
}
function timerEnd(){
  if(S.tick)clearInterval(S.tick);
  tSet('ENDED');
  if(S.screen==='exam'||S.screen==='review'){showResults();}
}

/* ================= flow ================= */
function startExam(){
  document.body.setAttribute('data-sev',sevClass());
  S.pos=0;S.credit={};S.answered={};S.status={};S.hintUsed={};S.skipped=[];
  S.secondsLeft=DATA.timerBudget;S.reported=false;
  S.manualPauseSec=0;S.feedbackPauseSec=0;S.ovAccum=0;
  /* clear per-attempt shuffle caches so retakes reshuffle answers too */
  DATA.exercises.forEach(function(e){
    delete e._shuf;delete e._shufR;delete e._shufB;
    if(e.steps)e.steps.forEach(function(st){delete st._shuf;});
  });
  S.order=shuffle(DATA.exercises.map(function(_,i){return i;}));
  /* keep terminal exercises non-adjacent after shuffle */
  for(var i=1;i<S.order.length-1;i++){
    if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])&&isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
  }
  S.screen='exam';startTimer();renderExercise();
}
function isTerm(i){return DATA.exercises[i].type==='terminal';}
function curEx(){return DATA.exercises[S.order[S.pos]];}
function advanceOrFinish(){
  S.pos++;
  if(S.pos>=S.order.length){ if(S.skipped.length>0){renderReview();if(S.timerState!=='ENDED')tSet('RUNNING');} else {showResults();} return;}
  renderExercise();
}
function showChrome(){var h=$('#hdr');if(h)h.classList.remove('hidden');var p=$('#prog');if(p)p.classList.remove('hidden');}
function hideChrome(){var h=$('#hdr');if(h)h.classList.add('hidden');var p=$('#prog');if(p)p.classList.add('hidden');}
function onCheck(){
  if(!R||R.checked)return;
  var res=collect(R);
  var credit=scoreExercise(res.selected,res.correct);
  if(S.hintUsed[R.ex.id])credit=Math.max(0,credit-0.10);
  R.checked=true;R.credit=credit;R.res=res;
  S.credit[R.ex.id]=credit;S.answered[R.ex.id]=true;
  S.status[R.ex.id]=credit>=0.999?'correct':(credit>0?'partial':'incorrect');
  /* an answered exercise never belongs in the skipped pool, whatever path answered it */
  var k=S.skipped.indexOf(R.ex.id);if(k>-1)S.skipped.splice(k,1);
  tSet('PAUSED_AUTO_CHECK');
  lockWidget();renderFeedback();updateHeader();
}
function onNext(){
  if(!R||!R.checked)return;
  if(R.fromReview){renderReview();tSet('RUNNING');return;}
  advanceOrFinish();
  if(S.screen==='exam'&&S.timerState!=='ENDED')tSet('RUNNING');
}
function onSkip(){
  if(S.screen!=='exam'||!R||R.checked)return;
  S.status[R.ex.id]='skipped';
  if(S.skipped.indexOf(R.ex.id)<0)S.skipped.push(R.ex.id);
  advanceOrFinish();
}
function onHint(){
  if(S.screen!=='exam'||!R||R.checked||S.hintUsed[R.ex.id])return;
  S.hintUsed[R.ex.id]=true;
  var hb=$('#hintpanel');if(hb)hb.classList.remove('hidden');
  var b=$('#hintbtn');if(b)b.disabled=true;
}
function onPauseToggle(){
  if(S.screen!=='exam'&&S.screen!=='review')return;
  var ov=$('#pauseov');
  if(ov){ov.remove();if(R&&R._pausedOnAuto){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}return;}
  var keep=R?R.stateName:null;
  if(R&&R.checked&&S.timerState==='PAUSED_AUTO_CHECK'){R._pausedOnAuto=true;}
  var o=el('div','paused-overlay');
  o.id='pauseov';
  o.innerHTML='<div class="p1">&#9208; PAUSED &mdash; manual (press Resume)</div>'+
    '<div class="p2">The exercise is hidden while you take a break. The timer is stopped.</div>';
  var b=el('button','btn primary','&#9654; Resume');
  b.addEventListener('click',function(){o.remove();if(R&&R._pausedOnAuto&&S.timerState==='PAUSED_MANUAL'){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}});
  o.appendChild(b);
  document.body.appendChild(o);
  tSet('PAUSED_MANUAL');
}

/* ================= site report ================= */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:DATA.meta.topicId,
      batch:DATA.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=DATA.meta.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}

});

function scoreSummary(){
  var sum=0,n=0;
  Object.keys(S.answered).forEach(function(k){if(S.answered[k]){sum+=S.credit[k]||0;n++;}});
  var pct=n>0?Math.round((sum/n)*100):0;
  return {sum:sum,n:n,pct:pct};
}
function answeredOrSkipped(){var c=0;DATA.exercises.forEach(function(e){if(S.answered[e.id]||S.status[e.id]==='skipped')c++;});return c;}

  var t=$('#h-timer');if(t)t.innerHTML='&#9201; '+fmtTime(S.secondsLeft);

      var it=ex.items.filter(function(x){return x.id===iid;})[0];
