<style>

}
*{box-sizing:border-box}

button{font-family:var(--sans)}

/* ---------- persistent exam header ---------- */
#hdr{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--bg-base);border-bottom:1px solid var(--border);padding:10px 4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px}

.hdr-title{font-weight:700;font-size:13px;color:var(--text-2)}
.hdr-counter{font-size:13px;font-weight:700;color:var(--text-1);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.hdr-timer{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}
#t-time.low{color:var(--sev-extreme)}
.ts-run{color:var(--accent-green)}
.ts-pman{color:var(--accent-amber)}
.ts-pauto{color:var(--accent-blue)}

#t-state{font-family:var(--sans);font-size:12px;font-weight:700}
.hdr-score{font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-surface-2);color:var(--text-1);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-blue)}
.btn.primary{border-color:var(--accent-green);background:var(--accent-green-dim)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;min-width:44px;padding:6px 12px;font-size:13px}
.btn.big{min-height:52px;padding:12px 34px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.hintbtn{border-color:var(--accent-amber)}
.btn.skipbtn{border-color:var(--border-strong)}

/* ---------- intro ---------- */
.strip{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--text-2)}
.i-sec{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:16px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw-chip{display:inline-block;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--text-2)}

/* ---------- badges ---------- */

.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--sev-easy-dim)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--sev-medium-dim)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--sev-hard-dim)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--sev-extreme-dim)}

/* ---------- exercise card and fixed three-block accents ---------- */
.card{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.block{border:1px solid var(--border);border-left:4px solid var(--b-accent);background:var(--bg-surface-2);border-radius:10px;padding:12px 16px;margin:12px 0}
.block-scenario{--b-accent:var(--accent-blue)}
.block-question{--b-accent:var(--accent-amber)}
.block-answer{--b-accent:var(--accent-green)}
.block-label{font-size:11px;letter-spacing:.14em;color:var(--b-accent);font-weight:800;margin-bottom:6px}
.block-body{color:var(--text-1)}
.block-body.collapsed{display:none}
.log{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;color:var(--term-out);white-space:pre-wrap;overflow-x:auto;margin:8px 0}
.log .hi{color:var(--accent-blue);font-weight:700}
code{font-family:var(--mono);font-size:13px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--term-out)}

/* ---------- options ---------- */
.opts{margin:4px 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1)}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}
.opt input{margin-top:4px;accent-color:var(--accent-green);width:18px;height:18px;flex:none}
.opt-txt{flex:1}
.opt-b{display:block;width:100%;text-align:left;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1);color:var(--text-1);font-size:15px}
.opt-b:hover{border-color:var(--border-strong)}
.opt-b.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}

/* ---------- matching ---------- */
.pair{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--bg-surface-1);flex-wrap:wrap}

select{min-height:44px;background:var(--bg-surface-2);color:var(--text-1);border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
option{color:var(--text-1);background:var(--bg-surface-2)}

/* ---------- drag and drop ---------- */

.dd-zone{border:1px solid var(--border-strong);border-radius:10px;padding:8px;min-height:104px;background:var(--bg-surface-1)}
.dd-zone.over{border-color:var(--accent-blue);background:var(--accent-blue-dim)}
.dd-zl{font-weight:800;color:var(--accent-blue);font-size:13px;margin-bottom:6px}
.dd-drop{display:flex;flex-direction:column;gap:6px;min-height:58px}
.dd-chip{display:block;width:100%;text-align:left;min-height:44px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-surface-2);color:var(--text-1);font-size:14px;cursor:grab}
.dd-chip.picked{border-color:var(--accent-amber);background:var(--accent-amber-dim)}

/* ---------- ordering ---------- */
.ord-row{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:6px 10px;margin:8px 0;background:var(--bg-surface-1)}
.ord-n{font-family:var(--mono);color:var(--text-3);min-width:22px;text-align:right}
.ord-t{flex:1}
.ord-btns{display:flex;gap:6px}

/* ---------- fill ---------- */

.t-warn{color:var(--sev-hard);font-weight:700}

.term-in:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- hint, feedback ---------- */
.hintbox{border:1px solid var(--accent-amber);background:var(--accent-amber-dim);padding:10px 14px;border-radius:10px;margin-top:12px;color:var(--text-1)}

/* ---------- paused card ---------- */

.r-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--bg-surface-1)}

/* ---------- results ---------- */
.res-hero{text-align:center;background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:26px 20px;margin-top:18px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-banner{display:inline-block;margin-top:10px;padding:8px 22px;border:1px solid;border-radius:999px;font-weight:800;letter-spacing:.06em}
.res-banner.pass{color:var(--ok);border-color:var(--ok);background:var(--ok-dim)}
.res-banner.fail{color:var(--bad);border-color:var(--bad);background:var(--bad-dim)}

.res-box.warn b{color:var(--warn)}
.res-box.bad b{color:var(--bad)}
.res-box.neu b{color:var(--neutral)}
.res-lab{color:var(--text-2);font-size:13px}
.res-list{margin-top:14px}
.res-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:6px 0;background:var(--bg-surface-1);font-size:14px;flex-wrap:wrap}
.res-state{font-weight:700;white-space:nowrap}
.res-cred{font-family:var(--mono);color:var(--text-2)}
.res-pause{margin-top:14px;font-size:13px;color:var(--text-2);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--mono)}

<script id="cm-exercise-meta" type="application/json">{"topicId":"t1586.003","batch":2,"difficulty":"medium","passMark":70,"questionCount":15,"estimatedMinutes":25}</script>
<script id="exam-data" type="application/json">{"config":{"title":"T1586.003 MEDIUM exam - Compromise Accounts: Cloud Accounts","sevName":"MEDIUM","passMark":70,"estimatedMinutes":25,"budgetSeconds":1500,"introLearn":["T1586.003 is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework. Its full name is <b>Compromise Accounts: Cloud Accounts<\/b>, and it sits in the <b>Resource Development<\/b> tactic: attackers take over a cloud account to prepare resources for a later attack. This exam goes one level deeper than the basics.","You practise the attacker path step by step: beating MFA with push spam, abusing OAuth consent pages to get a token without a password, and creating resources such as virtual machines, storage buckets and new access keys. You also practise reading signs: impossible travel, new OAuth grants, and strange keys in logs.","You also learn the defender moves: which logs to open first (CloudTrail, Entra ID sign-in logs, OAuth consent audits), how to respond to a suspicious account (revoke sessions, rotate keys, disable), and why phishing-resistant MFA and number matching stop the common ways in. Finally you learn how this technique connects to <b>T1078.004 Valid Accounts: Cloud Accounts<\/b>, which covers the later use of the same account."],"keywords":["OAuth consent","OAuth token","access key","session cookie","impossible travel","CloudTrail","Entra ID sign-in logs","phishing-resistant MFA","number matching","persistence","S3 bucket","billing alert","revoke sessions","T1078.004"],"introHow":["<b>Passing score.<\/b> You need 70% or more to pass. Each exercise gives 1 point. Exercises with several correct parts give part marks.","<b>Exercise types.<\/b> Single-choice, multi-select, matching, one drag-and-drop sorting task, one ordering task, and a fill-in-the-blank task.","<b>Timer.<\/b> Your budget is 25 minutes. Press <b>Pause<\/b> to stop the clock at any time. When you press <b>Check<\/b>, the clock stops by itself while you read the feedback, and starts again on Next. Hint and Skip never stop the clock.","<b>Scoring.<\/b> Multi-part exercises give part marks: correct parts add, wrong picks subtract, never below zero. Using the Hint costs 10% of that exercise's credit.","<b>Skip.<\/b> Skipped exercises wait in a review screen at the end. Exercises you never answer are not counted in your score.","Press Start when you are ready. Good luck."]},"exercises":[{"id":"m01","type":"qcm-single","label":"Beating MFA pushes","persp":"attacker","scenario":"<pre class='log'>Target: cloud engineer at a SaaS company\nHeld:      username + password (phished)\nStatus:    MFA push approval is ON\nGoal:      get into the account for Resource Development<\/pre>","question":"The password works but MFA blocks the sign-in. What is the attacker's most realistic next move?","hint":"The attacker cannot read the user's phone, but can make the user's phone buzz many times.","explain":"With only a password, the classic move is <b>MFA fatigue<\/b>: send many push prompts and hope a tired user taps Approve. Waiting for users to disable MFA almost never happens, the provider will not email a password, and signing in from the user's laptop needs access the attacker does not have.","options":[{"html":"Email the cloud provider and ask for the password"},{"html":"Restart the sign-in from the user's own laptop"},{"html":"Spam push prompts until someone taps Approve, ideally late at night"},{"html":"Wait until the user turns MFA off by themselves"}],"answer":2},{"id":"m02","type":"qcm-multi","label":"Resources to develop","persp":"attacker","scenario":"An attacker is inside a compromised AWS account. The plan is Resource Development: build capabilities for a later campaign, quietly.","question":"Select <b>all<\/b> the actions that are typical Resource Development moves inside the stolen cloud account.","hint":"Four options prepare the attack; two do not even belong to the cloud account.","explain":"Typical Resource Development moves are <b>hosting tools on a VM<\/b>, <b>staging files in a bucket<\/b>, <b>keeping a new access key<\/b> and <b>registering a look-alike domain<\/b>. You missed one of these if any stayed unselected. The on-prem domain admin password cannot be reset from a cloud console, and Office updates on laptops are maintenance, not development.","options":[{"html":"Register a look-alike domain through the account's registrar service"},{"html":"Reset the on-prem domain admin password from the cloud console"},{"html":"Install Office updates on the target's laptops"},{"html":"Start a small virtual machine to host tools"},{"html":"Create an S3 bucket to stage files"},{"html":"Create a new access key for later use"}],"answer":[3,4,5,0]},{"id":"m03","type":"dragdrop","label":"Get it vs use it","persp":"attacker","scenario":"A teacher draws two boxes on the whiteboard: one for actions that <i>get<\/i> the cloud account, and one for actions an attacker does <i>inside<\/i> the account, after access.","question":"Sort each action into the right box.","hint":"Three actions give the attacker access; three actions spend that access.","explain":"The <b>Get<\/b> box takes the ways in: the fake SSO page (phishing), MFA push spam, and the SIM swap. The <b>Use<\/b> box takes what happens inside: creating a bucket, adding a key and starting a VM. Mixing them usually means reading the action as 'does it need the account first?'","data":{"zones":[{"id":"get","label":"Get the account"},{"id":"use","label":"Use the account"}],"items":[{"id":"i1","html":"Send a fake SSO login page","zone":"get"},{"id":"i2","html":"Spam MFA push alerts","zone":"get"},{"id":"i3","html":"SIM swap the user's phone number","zone":"get"},{"id":"i4","html":"Create a storage bucket","zone":"use"},{"id":"i5","html":"Add a new access key","zone":"use"},{"id":"i6","html":"Start a virtual machine","zone":"use"}]}},{"id":"m04","type":"qcm-single","label":"Impossible travel alert","persp":"defender","scenario":"<pre class='log'>09:00  Successful sign-in  London, UK      user's laptop\n09:40  Successful sign-in  Singapore       new device\nAlert: IMPOSSIBLE TRAVEL - 40 minutes, 10,800 km<\/pre>","question":"What is the best first reaction to this alert?","hint":"Geo data can be wrong, but two successes that close together mean one session is not the user.","explain":"Two successful sign-ins 40 minutes apart on two continents means at least one of them is not the real user. The right move is to <b>check what the session did, revoke sessions and contact the user<\/b>. Ignoring geo data completely throws away real signals, deleting logs destroys evidence, and mailing raw logs helps nobody.","options":[{"html":"Ignore it, because geo data is always wrong"},{"html":"Delete the log entry to keep the dashboard clean"},{"html":"Email the raw log to all staff"},{"html":"Treat it as a strong signal: check recent actions, revoke sessions, and contact the user"}],"answer":3},{"id":"m05","type":"fill","label":"Consent phishing words","persp":"attacker","scenario":"A security awareness writer drafts a short paragraph about a phishing mail that carries a link to an 'Add secure mail reader' app. The app page shows a standard approval screen with the company logo on it.","question":"Fill both blanks with the correct words.","hint":"First blank: the approval screen name. Second blank: what the attacker's app receives.","explain":"The trick is <b>consent phishing<\/b>: the user sees an OAuth <b>consent<\/b> screen and approves it, and the attacker's app gets an <b>OAuth token<\/b>. The token can read mail or files, so the attacker never needed the password or an MFA prompt.","data":{"template":"An attacker sends an OAuth [[0]] page that looks safe. If the user approves it, the attacker's app receives a [[1]] and can read data without the password.","blanks":[{"answers":["consent"],"label":"approval screen"},{"answers":["token"],"label":"what the app receives"}]}},{"id":"m06","type":"order","label":"Attacker workflow order","persp":"attacker","scenario":"An incident review lists four attacker actions in random order. The team wants the true timeline for the report.","question":"Put the attacker's steps in the order they happened.","hint":"Access comes first, resources come last, and a key is created before it can be used.","explain":"The true order is: <b>1)<\/b> harvest the password with a phishing page, <b>2)<\/b> beat MFA with push spam, <b>3)<\/b> create a new access key (persistence), and <b>4)<\/b> start a virtual machine (Resource Development). A key cannot be created before the account is reachable, and the VM comes last because it uses the session.","data":{"items":["Send a phishing page and harvest the password","Beat MFA with push spam","Create a new access key","Start a virtual machine for later use"],"initial":[1,0,3,2]}},{"id":"m07","type":"matching","label":"Signal to meaning","persp":"defender","scenario":"A detection engineer writes a cheat sheet that maps cloud log signals to the most likely attacker behaviour behind them.","question":"Match each signal to its most likely meaning.","hint":"Two signals are about access, one is about a token, and one is about staying inside.","explain":"A <b>new-country sign-in<\/b> points to stolen credentials. <b>Many denied prompts<\/b> is the signature of MFA push spam. A <b>new OAuth grant<\/b> to an unknown app is consent phishing that ends in a token. A <b>new access key<\/b> is persistence: the attacker keeps a way back in that survives a password reset. The two leftover rows were harmless events.","data":{"pairs":[{"left":"Sign-in from a new country","right":"Password may be stolen"},{"left":"Many denied MFA prompts","right":"MFA push spam in progress"},{"left":"New OAuth grant to an unknown app","right":"Token access via consent phishing"},{"left":"New access key never seen before","right":"Attacker is keeping a way back in"}],"rights":["Password may be stolen","MFA push spam in progress","Token access via consent phishing","Attacker is keeping a way back in","A password reset done by the user","A failed backup job"]}},{"id":"m08","type":"qcm-single","label":"Control that still works","persp":"defender","scenario":"A CISO reads a report: attackers phished 40 passwords last quarter. She asks which control keeps protecting an account even after the password is stolen.","question":"Which control still works when the password is phished?","hint":"It must check the website itself, not a secret the user can type on a fake page.","explain":"A <b>FIDO2 security key<\/b> (and passkeys) cryptographically binds the sign-in to the real website, so a fake page cannot use it even with the password in hand. Long passwords, hidden hints and monthly changes do nothing once the real password is phished.","options":[{"html":"A 16-character password"},{"html":"Disabled password hints"},{"html":"Monthly password changes"},{"html":"Phishing-resistant MFA such as a FIDO2 security key"}],"answer":3},{"id":"m09","type":"qcm-multi","label":"Logs to check first","persp":"defender","scenario":"A help desk ticket says a user's cloud account 'did something strange'. A first responder has ten minutes and must pick the best data sources.","question":"Select <b>all<\/b> the data sources that help most when checking a suspicious cloud account.","hint":"Think cloud audit trail, sign-in logs, app approvals, and money.","explain":"The useful four are <b>CloudTrail<\/b> (what was done in AWS), <b>Entra ID sign-in logs<\/b> (who signed in where), <b>OAuth consent audits<\/b> (which apps got tokens) and <b>billing alerts<\/b> (resources the attacker created cost money). DHCP logs show office address leases, and bookmarks say nothing about account abuse.","options":[{"html":"The office DHCP server log"},{"html":"The user's browser bookmarks"},{"html":"AWS CloudTrail event history"},{"html":"Entra ID (Azure AD) sign-in logs"},{"html":"OAuth app consent audit logs"},{"html":"Cloud billing alerts and spend reports"}],"answer":[2,3,4,5]},{"id":"m10","type":"qcm-single","label":"Why consent works","persp":"attacker","scenario":"An attacker registers an app named 'Mail Cleaner Pro' and sends employees a link to its consent page. One employee clicks Approve.","question":"Why does the victim's approval help the attacker?","hint":"The approval is a grant, not a login.","explain":"Approving a consent screen grants the attacker's app an <b>OAuth token<\/b>. The token itself can read data through the API, so the whole password-and-MFA path is skipped. Nothing is installed, no antivirus is touched, files are read through the API, and the password stays with the victim.","options":[{"html":"The approval moves the victim's files to the attacker's PC"},{"html":"The approval resets the victim's password"},{"html":"The approval gives the attacker's app an OAuth token, so no password or MFA is needed"},{"html":"The approval turns off the victim's antivirus"}],"answer":2},{"id":"m11","type":"qcm-single","label":"ATT&CK mapping of later use","persp":"concept","scenario":"A threat-log entry says: 'Account compromised during Resource Development; same account used days later to sign in and create resources.' The analyst must cite the right ATT&CK entries.","question":"Which ATT&CK entry covers the later use of the compromised cloud account to sign in and act?","hint":"Using an account you should not have is 'Valid Accounts'.","explain":"Getting the account is <b>T1586.003<\/b>; using that valid account later to sign in and act is <b>T1078.004 Valid Accounts: Cloud Accounts<\/b> under the Defense Evasion and other tactics. Phishing may have been the way the credentials were stolen, and ransomware encryption is a different world.","options":[{"html":"T1486 Data Encrypted for Impact"},{"html":"T1078.004 Valid Accounts: Cloud Accounts"},{"html":"T1586.003 again, because it is the same account"},{"html":"T1566 Phishing"}],"answer":1},{"id":"m12","type":"qcm-multi","label":"Response steps","persp":"defender","scenario":"Monday 08:10: the SOC believes a marketing user's cloud account is compromised. The on-call analyst opens the response runbook.","question":"Select <b>all<\/b> the response steps that make sense for a suspected cloud account compromise.","hint":"Two steps cut the attacker off, one removes their way back, and one learns what happened.","explain":"Correct response: <b>revoke sessions and tokens<\/b> (cookies survive a password reset), <b>disable the account<\/b>, <b>rotate access keys<\/b> (the attacker's way back in) and <b>review CloudTrail<\/b> to scope the damage. Waiting lets the attacker work, and deleting logs destroys the evidence you need.","options":[{"html":"Wait a week to see if it happens again"},{"html":"Delete the CloudTrail logs to tidy up"},{"html":"Revoke active sessions and OAuth tokens"},{"html":"Disable the account"},{"html":"Rotate (delete and replace) its access keys"},{"html":"Review CloudTrail for what was done"}],"answer":[2,3,4,5]},{"id":"m13","type":"qcm-single","label":"Reading a defanged URL","persp":"concept","scenario":"A report line reads: <code>hxxps://sso-login-verify[.]com/auth<\/code>","question":"What do the <code>hxxps://<\/code> and <code>[.]<\/code> tell you?","hint":"The writer did not want the text to work as a link.","explain":"<code>hxxps<\/code> and <code>[.]<\/code> are the standard way to <b>defang<\/b> a URL in reports: the text stays readable but cannot be clicked or turned into a live link by accident. It is not a typo, not an old protocol, and definitely not a safe link: the real address behind it should be treated as hostile.","options":[{"html":"The link is broken because of a typing error"},{"html":"The site uses an old protocol version"},{"html":"The link is safe to open as it is"},{"html":"The URL was defanged on purpose so readers cannot click it by accident"}],"answer":3},{"id":"m14","type":"qcm-single","label":"Why a company account","persp":"attacker","scenario":"A criminal forum post asks: 'Why bother taking over a company cloud account when I can make ten free mailboxes in an hour?'","question":"Why is a compromised company cloud account more valuable than a fresh free webmail account?","hint":"Think about what already exists inside the company account.","explain":"A company cloud account ships with <b>billing, running services and a trusted name<\/b>. New VMs or buckets look like normal tenant activity, and the victim pays the bill. Tracking still exists (CloudTrail and sign-in logs remain), storage size is not the point, and no hacking tools come with it.","options":[{"html":"It cannot be tracked by anyone"},{"html":"It comes with free hacking tools"},{"html":"It already has billing, services and a trusted company name, so new resources blend in"},{"html":"It always has more storage than any free account"}],"answer":2},{"id":"m15","type":"qcm-single","label":"2 a.m. push prompt","persp":"defender","scenario":"It is 2 a.m. A sleeping employee's phone buzzes with an MFA approval prompt they did not start. The screen says 'Approve sign-in from new device'.","question":"What should the employee do?","hint":"Nobody legitimate is asking at this hour, and one tap is enough for the attacker.","explain":"An unexpected prompt means someone else holds the password and is trying to get in. The right move is to <b>deny and report<\/b>. Approving hands over the account; approving 'and fixing it later' hands it over too, and the attacker changes the settings first; silencing the phone ignores that the prompts will continue until someone approves.","options":[{"html":"Put the phone on silent and keep sleeping"},{"html":"Deny the prompt and report it to the security team"},{"html":"Approve it so the phone stops buzzing"},{"html":"Approve it and change the password the next morning"}],"answer":1}]}</script>
<script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var RAW=JSON.parse(document.getElementById('exam-data').textContent);
var CFG=RAW.config, EXS=RAW.exercises;
window.__EXAM__={config:CFG,exercises:EXS,meta:META};
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function elt(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function stripTags(s){var d=elt('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function shortLabel(o){var t=o.short?o.short:stripTags(o.html||o.text||'');return (t||'item').slice(0,52);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtD(sec){sec=Math.round(sec);var m=Math.floor(sec/60);return m+'m '+('0'+(sec%60)).slice(-2)+'s';}
function sevClass(){return {EASY:'sev-easy',MEDIUM:'sev-medium',HARD:'sev-hard','EXTREMELY HARD':'sev-extreme'}[CFG.sevName]||'sev-easy';}

/* ---------------- timer state machine ----------------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
   - Check switches to PAUSED_AUTO_CHECK before feedback is rendered.
   - Next / Final Submit switch back to RUNNING (or ENDED on the last exercise).
   - Skip and Hint never change the timer state.
   - Manual Pause works on top of any state and returns to it on Resume. */
var T={state:'IDLE',remaining:CFG.budgetSeconds,since:0,resumeTo:null,acc:{RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0}};
function accrue(){if(T.since&&T.acc[T.state]!=null){T.acc[T.state]+=(Date.now()-T.since)/1000;}T.since=Date.now();}
function setState(s){if(T.state===s){renderTimer();return;}accrue();T.state=s;if(T.acc[s]==null){T.since=0;}renderTimer();}
function hardResetTimer(){T.state='IDLE';T.since=0;T.remaining=CFG.budgetSeconds;T.resumeTo=null;T.acc={RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0};renderTimer();}
setInterval(function(){
  if(T.state!=='RUNNING'){return;}
  T.remaining-=1;
  if(T.remaining<=0){T.remaining=0;renderTimer();finishExam(true);return;}
  renderTimer();
},1000);
var TMETA={RUNNING:['\u25B6','running'],PAUSED_MANUAL:['\u23F8','Paused'],PAUSED_AUTO_CHECK:['\u23F3','Auto-paused \u00B7 checking'],ENDED:['\u25A0','ended'],IDLE:['\u25CB','ready']};
function renderTimer(){
  var ic=$('#t-icon'),tm=$('#t-time'),st=$('#t-state');
  if(!ic||!tm||!st){return;}
  var m=TMETA[T.state]||TMETA.IDLE;
  ic.textContent=m[0];st.textContent=m[1];tm.textContent=fmtT(Math.max(0,T.remaining));
  st.className={RUNNING:'ts-run',PAUSED_MANUAL:'ts-pman',PAUSED_AUTO_CHECK:'ts-pauto',ENDED:'ts-end',IDLE:'ts-end'}[T.state]||'ts-end';
  tm.classList.toggle('low',T.remaining<=60&&T.state==='RUNNING');
  $('#hdr-timer').setAttribute('aria-label','Timer, state '+m[1]+', time left '+fmtT(Math.max(0,T.remaining)));
}

/* ---------------- session state ---------------- */
var S=null;
function resetAttempt(){
  S={screen:'intro',idx:0,mode:'main',credits:{},checked:{},hint:{},skipped:[],cur:null,prevScreen:'exercise',posted:false,timeUp:false,ddSel:null};
}
resetAttempt();
function scoreSum(){var s=0,k;for(k in S.credits){s+=S.credits[k];}return s;}
function exById(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id){return EXS[i];}}return null;}

/* ---------------- header ---------------- */
function renderHeader(){
  var hdr=$('#hdr');if(!hdr){return;}
  var inExam=(S.screen==='exercise'||S.screen==='paused'||S.screen==='review');
  hdr.classList.toggle('hidden',!inExam);
  if(!inExam){return;}
  var counter=$('#hdr-counter'),sev=$('#hdr-sev'),scoreEl=$('#hdr-score'),
      hintB=$('#btn-hint'),skipB=$('#btn-skip'),pauseB=$('#btn-pause');
  if(!counter||!sev||!scoreEl||!hintB||!skipB||!pauseB){return;}
  if(S.mode==='review'||S.screen==='review'){counter.textContent='Reviewing skipped \u00B7 '+S.skipped.length+' left';}
  else{counter.textContent='Exercise '+(S.idx+1)+' of '+EXS.length;}
  scoreEl.textContent='Score: '+(Math.round(scoreSum()*10)/10).toFixed(1);
  sev.className='badge '+sevClass();sev.textContent=CFG.sevName;
  var cur=S.cur;
  var onEx=(S.screen==='exercise');
  hintB.disabled=!onEx||!cur||!!cur.graded||!!S.hint[cur.ex.id];
  skipB.disabled=!onEx||!cur||!!cur.graded||S.mode==='review';
  pauseB.textContent=(T.state==='PAUSED_MANUAL')?'\u23F8 Resume':'\u23F8 Pause';
}

/* ---------------- screens ---------------- */
function show(sc){S.screen=sc;render();}
function render(){
  var st=$('#stage');st.innerHTML='';
  if(S.screen==='intro')renderIntro(st);
  else if(S.screen==='exercise')renderExerciseScreen(st);
  else if(S.screen==='paused')renderPaused(st);
  else if(S.screen==='review')renderReview(st);
  else if(S.screen==='results')renderResults(st);
  renderHeader();renderTimer();
}
function renderIntro(st){
  var w=elt('div','intro');
  var strip=elt('div','strip');
  strip.innerHTML='<h1>'+CFG.title+'</h1>'
    +'<div class="chips">'
    +'<span class="chip">'+EXS.length+' exercises</span>'
    +'<span class="badge '+sevClass()+'">'+CFG.sevName+'</span>'
    +'<span class="chip">Estimated time: '+CFG.estimatedMinutes+' min</span>'
    +'<span class="chip">Timer budget: '+fmtT(CFG.budgetSeconds)+'</span>'
    +'<span class="chip">Pass mark: '+CFG.passMark+'%</span>'
    +'</div>';
  w.appendChild(strip);
  var s1=elt('section','i-sec');
  s1.appendChild(elt('h2',null,'What you will learn here'));
  CFG.introLearn.forEach(function(p){s1.appendChild(elt('p',null,p));});
  w.appendChild(s1);
  var s2=elt('section','i-sec');
  s2.appendChild(elt('h2',null,'Keywords covered in this exam'));
  var kc=elt('div','kw');
  CFG.keywords.forEach(function(k){kc.appendChild(elt('span','kw-chip',k));});
  s2.appendChild(kc);
  w.appendChild(s2);
  var s3=elt('section','i-sec');
  s3.appendChild(elt('h2',null,'How this exam works'));
  CFG.introHow.forEach(function(p){s3.appendChild(elt('p',null,p));});
  var b=elt('button','btn primary big','Start');
  b.id='btn-start';b.type='button';
  b.addEventListener('click',startExam);
  s3.appendChild(b);
  w.appendChild(s3);
  st.appendChild(w);
}
function startExam(){
  resetAttempt();
  hardResetTimer();
  S.mode='main';S.idx=0;
  startExercise();
  setState('RUNNING');
}

/* ---------------- exercise flow ---------------- */
function startExercise(){
  var ex=EXS[S.idx];
  S.cur={ex:ex,sel:-1,selM:[],match:{},place:{},order:(ex.data&&ex.data.initial?ex.data.initial.slice():[]),moved:[],vals:[],
         branch:{node:0,picks:[],final:[]},term:{lastRel:{},lines:[]},graded:null};
  S.screen='exercise';
  render();
}
function onCheck(){
  var c=S.cur;if(!c||c.graded)return;
  if(c.ex.type==='branch'&&c.branch.node<c.ex.data.nodes.length)return;
  setState('PAUSED_AUTO_CHECK');       /* auto-pause happens BEFORE feedback is rendered */
  c.graded=grade(c);
  S.credits[c.ex.id]=c.graded.final;
  S.checked[c.ex.id]=true;
  render();
}
function nextLabel(){
  if(S.mode==='review')return (S.skipped.length>1)?'Back to review':'Finish exam';
  if(S.idx<EXS.length-1)return 'Next exercise';
  return S.skipped.length?('Review skipped ('+S.skipped.length+')'):'Final Submit';
}
function onNext(){
  if(S.mode==='review'){
    S.skipped=S.skipped.filter(function(id){return id!==S.cur.ex.id;});
    if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
    else{finishExam(false);}
    return;
  }
  if(S.idx<EXS.length-1){S.idx++;startExercise();setState('RUNNING');}
  else if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
  else{finishExam(false);}
}
function onSkip(){
  var c=S.cur;
  if(!c||c.graded||S.mode==='review'||S.screen!=='exercise')return;
  S.skipped.push(c.ex.id);           /* timer keeps running: no state change */
  if(S.idx<EXS.length-1){S.idx++;startExercise();}
  else{S.screen='review';render();}  /* skipped pool is never empty here */
}
function onHint(){
  var c=S.cur;
  if(!c||c.graded||S.hint[c.ex.id]||S.screen!=='exercise')return;
  S.hint[c.ex.id]=true;              /* timer keeps running: no state change */
  render();
}
function onPause(){
  if(T.state==='PAUSED_MANUAL'){
    var back=T.resumeTo||'RUNNING';
    T.resumeTo=null;
    setState(back);
    show(S.prevScreen);
    return;
  }
  if(T.state==='RUNNING'||T.state==='PAUSED_AUTO_CHECK'){
    T.resumeTo=T.state;
    S.prevScreen=S.screen;
    setState('PAUSED_MANUAL');
    show('paused');
  }
}
function finishExam(timeUp){
  S.timeUp=!!timeUp;
  S.screen='results';
  setState('ENDED');
  render();
  setTimeout(postScore,750);         /* post after the score animation has settled */
}
function postScore(){
  if(S.posted)return;S.posted=true;
  var sum=0,total=0;
  EXS.forEach(function(ex){if(S.checked[ex.id]){sum+=S.credits[ex.id];total++;}});
  sum=Math.round(sum*10)/10;         /* rounding happens only here */
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var msg={type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,score:sum,total:total,percent:percent,passed:passed};
  try{parent.postMessage(msg,location.origin);}catch(e){}
}

/* ---------------- paused + review screens ---------------- */
function renderPaused(st){
  var c=elt('div','pausecard');
  c.innerHTML='<div class="pause-ic">\u23F8</div><h2>Paused</h2><p>The clock is stopped. Your answers are safe.</p>';
  var b=elt('button','btn primary big','Resume');
  b.addEventListener('click',onPause);
  c.appendChild(b);
  st.appendChild(c);
}
function renderReview(st){
  var w=elt('div','review');
  w.appendChild(elt('h2',null,'Review skipped exercises'));
  w.appendChild(elt('p',null,'You skipped '+S.skipped.length+' exercise(s). Answer them now, or finish and leave the rest unanswered. The clock is still running.'));
  var list=elt('div','r-list');
  S.skipped.forEach(function(id){
    var ex=exById(id);
    var row=elt('div','r-row');
    row.appendChild(elt('span','r-lab',ex.label));
    var b=elt('button','btn','Answer');
    b.addEventListener('click',function(){S.mode='review';S.idx=EXS.indexOf(ex);startExercise();});
    row.appendChild(b);
    list.appendChild(row);
  });
  w.appendChild(list);
  var fin=elt('button','btn ghost','Finish and leave the rest unanswered');
  fin.addEventListener('click',function(){finishExam(false);});
  w.appendChild(fin);
  st.appendChild(w);
}

function runCmd(c,cmd){
  var d=c.ex.data,L=c.term.lines;
  L.push({cls:'t-cmd',html:escHtml(cmd)});
  var i,dk=null;
  for(i=0;i<(d.dangerous||[]).length;i++){if(re(d.dangerous[i].match).test(cmd)){dk=d.dangerous[i];break;}}
  if(dk){
    L.push({cls:'t-warn',html:'\u26A0 DANGEROUS \u2014 NEAR MISS: '+dk.why});
    (d.tasks||[]).forEach(function(t,ti){if(t.danger&&re(t.danger).test(cmd)){c.term.lastRel[ti]='danger';}});
    render();
    return;
  }
  var sim=null;
  for(i=0;i<(d.sim||[]).length;i++){if(re(d.sim[i].match).test(cmd)){sim=d.sim[i];break;}}
  if(sim){
    String(sim.out).split('\n').forEach(function(ln){L.push({cls:'t-out',html:escHtml(ln)});});
  }else{
    L.push({cls:'t-err',html:'sh: command not found: '+escHtml(cmd)});
  }
  (d.nearmiss||[]).forEach(function(r){
    if(re(r.match).test(cmd))L.push({cls:'t-note',html:'\u26A0 Near miss: '+r.note});
  });
  (d.tasks||[]).forEach(function(t,ti){
    if(!c.term.lastRel[ti]&&re(t.accept).test(cmd)){
      c.term.lastRel[ti]='correct';
      L.push({cls:'t-ok',html:'\u2713 Task '+(ti+1)+' command accepted.'});
    }
  });
  render();
}

/* ---------------- grading ---------------- */
function grade(c){
  var ex=c.ex,type=ex.type,raw=0,items=[],N,H,W,i;
  if(type==='qcm-single'){
    var ok=(c.sel===ex.answer);
    raw=ok?1:0;
    if(ok)items.push({label:shortLabel(ex.options[ex.answer]),state:'hit'});
    else{
      if(c.sel>=0)items.push({label:shortLabel(ex.options[c.sel]),state:'wrong'});
      items.push({label:shortLabel(ex.options[ex.answer]),state:'missed'});
    }
  }else if(type==='qcm-multi'){
    var ans=ex.answer;N=ans.length;H=0;W=0;
    ex.options.forEach(function(o,oi){
      var isA=ans.indexOf(oi)>=0,sel=c.selM.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='matching'){
    var rights=ex.data.rights;N=ex.data.pairs.length;H=0;W=0;
    ex.data.pairs.forEach(function(p,pi){
      var v=c.match[pi];
      if(v!=null&&rights[v]===p.right){H++;items.push({label:p.left,state:'hit'});}
      else if(v!=null){W++;items.push({label:p.left,state:'wrong'});}
      else{items.push({label:p.left,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='dragdrop'){
    N=ex.data.items.length;H=0;W=0;
    ex.data.items.forEach(function(it){
      var z=c.place[it.id];
      if(z&&z===it.zone){H++;items.push({label:stripTags(it.html),state:'hit'});}
      else if(z){W++;items.push({label:stripTags(it.html),state:'wrong'});}
      else{items.push({label:stripTags(it.html),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='order'){
    N=ex.data.items.length;H=0;W=0;
    for(i=0;i<N;i++){
      var itIdx=c.order[i];
      if(itIdx===i){H++;items.push({label:ex.data.items[i],state:'hit'});}
      else if(c.moved.indexOf(itIdx)>=0){W++;items.push({label:ex.data.items[itIdx],state:'wrong'});}
      else{items.push({label:ex.data.items[itIdx],state:'missed'});}
    }
    raw=Math.max(0,(H-W)/N);
  }else if(type==='fill'){
    N=ex.data.blanks.length;H=0;W=0;
    ex.data.blanks.forEach(function(b,bi){
      var v=(c.vals[bi]||'').trim().toLowerCase();
      var good=b.answers.some(function(a){return a.trim().toLowerCase()===v;});
      if(v===''){items.push({label:b.label||('Blank '+(bi+1)),state:'missed'});}
      else if(good){H++;items.push({label:b.label||('Blank '+(bi+1)),state:'hit'});}
      else{W++;items.push({label:b.label||('Blank '+(bi+1)),state:'wrong'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='branch'){
    var fans=ex.data.final.answer;N=fans.length;H=0;W=0;
    ex.data.final.options.forEach(function(o,oi){
      var isA=fans.indexOf(oi)>=0,sel=c.branch.final.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='terminal'){
    N=(ex.data.tasks||[]).length;H=0;W=0;
    (ex.data.tasks||[]).forEach(function(t,ti){
      var rel=c.term.lastRel[ti];
      if(rel==='correct'){H++;items.push({label:t.label,state:'hit'});}
      else if(rel==='danger'){W++;items.push({label:t.label,state:'wrong'});}
      else{items.push({label:t.label,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }
  var hint=!!S.hint[ex.id];
  var fin=Math.max(0,Math.round((raw-(hint?0.10:0))*100)/100);
  var verdict=(fin>=0.999)?'correct':(fin>0?'partial':'incorrect');
  return {raw:raw,final:fin,hint:hint,items:items,verdict:verdict};
}

function renderResults(st){
  var answered=[],unanswered=[];
  EXS.forEach(function(ex){(S.checked[ex.id]?answered:unanswered).push(ex);});
  var full=[],part=[],zero=[],sum=0;
  answered.forEach(function(ex){
    var cr=S.credits[ex.id];sum+=cr;
    if(cr>=0.999)full.push(ex);else if(cr>0)part.push(ex);else zero.push(ex);
  });
  sum=Math.round(sum*10)/10;
  var total=answered.length;
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var avgPart=part.length?(part.reduce(function(a,e){return a+S.credits[e.id];},0)/part.length):0;
  var w=elt('div','results');
  var hero=elt('div','res-hero');
  var pct=elt('div','res-pct','0%');pct.id='res-pct';
  hero.appendChild(pct);
  hero.appendChild(elt('div',null,'You answered '+total+' of '+EXS.length+' exercises. Unanswered and skipped exercises are not counted.'));
  var ban=elt('div','res-banner '+(passed?'pass':'fail'),passed?'\u2713 Passed':'\u2717 Not passed');
  hero.appendChild(ban);
  if(S.timeUp)hero.appendChild(elt('div','res-note','\u23F1 Time is up. Exercises you never answered were not scored.'));
  hero.appendChild(elt('div','res-note','Pass mark: '+CFG.passMark+'% \u00B7 Final score: '+sum.toFixed(1)+' points'));
  w.appendChild(hero);
  var grid=elt('div','res-grid');
  function box(cls,icon,num,lab){
    var b=elt('div','res-box '+cls);
    b.appendChild(elt('b',null,icon+' '+num));
    b.appendChild(elt('div','res-lab',lab));
    return b;
  }
  grid.appendChild(box('ok','\u2713',full.length,'Fully correct'));
  grid.appendChild(box('warn','\u2713',part.length,'Partially correct'+(part.length?(' \u00B7 avg partial credit '+avgPart.toFixed(2)):'')));
  grid.appendChild(box('bad','\u2717',zero.length,'Fully incorrect'));
  grid.appendChild(box('neu','\u26A0',unanswered.length,'Skipped / never answered (not scored)'));
  w.appendChild(grid);
  var acc=T.acc;
  w.appendChild(elt('div','res-pause','Time on the clock: '+fmtD(CFG.budgetSeconds-T.remaining)
    +' \u00B7 Running: '+fmtD(acc.RUNNING)
    +' \u00B7 Manual pause: '+fmtD(acc.PAUSED_MANUAL)
    +' \u00B7 Checking pause: '+fmtD(acc.PAUSED_AUTO_CHECK)));
  var list=elt('div','res-list');
  EXS.forEach(function(ex){
    var row=elt('div','res-row');
    row.appendChild(elt('span',null,ex.label));
    if(S.checked[ex.id]){
      var cr=S.credits[ex.id];
      var st=(cr>=0.999)?['res-state','\u2713 Correct','it-hit']:(cr>0)?['res-state','\u2713 Partially correct','it-hit']:['res-state','\u2717 Incorrect','it-wrong'];
      row.appendChild(elt('span',st[0]+' '+st[2],st[1]));
      row.appendChild(elt('span','res-cred',cr.toFixed(2)+(S.hint[ex.id]?' \u00B7 hint used':'')));
    }else{
      row.appendChild(elt('span','res-state it-missed','\u26A0 Skipped \u00B7 not scored'));
      row.appendChild(elt('span','res-cred','\u2014'));
    }
    list.appendChild(row);
  });
  w.appendChild(list);
  var act=elt('div','actions');
  var rb=elt('button','btn primary big','Retake exam');
  rb.id='btn-retake';rb.type='button';
  rb.addEventListener('click',function(){
    resetAttempt();
    hardResetTimer();
    show('intro');
  });
  act.appendChild(rb);
  w.appendChild(act);
  st.appendChild(w);
  /* score animation, then the score is posted by finishExam's timer */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||percent===0){
    pct.textContent=percent+'%';
  }else{
    var t0=null,dur=600;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      pct.textContent=Math.round(percent*(p<1?(1-Math.pow(1-p,3)):1))+'%';
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
}

/* ---------------- boot ---------------- */
$('#btn-hint').addEventListener('click',onHint);
$('#btn-skip').addEventListener('click',onSkip);
$('#btn-pause').addEventListener('click',onPause);
show('intro');
})();

</script>
</body>
</html>
