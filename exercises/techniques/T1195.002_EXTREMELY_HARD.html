    } else if (S.timerState === 'PAUSED_MANUAL') {
      hidePauseOverlay();
      document.body.classList.remove('paused');
      setTimerState(S.pausedFrom || 'RUNNING');
      S.pausedFrom = null;
    }
  }
  function showPauseOverlay() {
    var ov = $('pause-overlay');
    ov.hidden = false;
    ov.innerHTML = '<div class="pause-card"><div class="big">&#9208; PAUSED</div>' +
      '<p>Manual break — the timer is stopped and the exercise is hidden.</p>' +
      '<p style="margin-top:6px;">Press Resume to continue where you were.</p>' +
      '<button class="btn btn-primary" id="resumeBtn" style="margin-top:14px;">&#9654; Resume</button></div>';
    $('resumeBtn').addEventListener('click', togglePause);
  }
  function hidePauseOverlay() { $('pause-overlay').hidden = true; }
  function showHint() {
    var i = exIdx();
    if (S.hintUsed[i] || S.cur.checked) return;
    S.hintUsed[i] = true;
    var hb = mk('div', 'hintbox', '<b>&#9432; Hint (costs &minus;10% of this exercise&#39;s credit):</b> ' + esc(ex().hint));
    $('a-body').insertBefore(hb, $('a-body').firstChild);
    $('hintBtn').disabled = true;
  }

  /* ================= review skipped ================= */
  function showReview(fromReturn) {
    if (S.ended) { finishExam(); return; }
    S.reviewMode = true;
    if (fromReturn || S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING');
    var html = '<div class="card"><div class="sec-title"><span class="bar"></span><h2>&#9888; Review skipped exercises</h2></div>';
    html += '<p class="sub">The timer is still running. You can answer as many skipped exercises as you want, as many times as needed, until the timer ends or you press Final Submit. Skipped-and-never-answered exercises are excluded from your score.</p></div>';
    if (S.skipped.length === 0) {
      html += '<div class="card"><p>No skipped exercises left. &#10003;</p><button class="btn btn-primary" id="finalBtn">&#9632; Final Submit</button></div>';
    } else {
      html += '<div class="card">';
      S.skipped.forEach(function (i) {
        html += '<div class="rev-row"><span class="st skip">&#9888; Skipped</span><div class="t"><b>' + esc(EXR[i].title) + '</b><span>' + esc(EXR[i].summary) + '</span></div>' +
          '<button class="btn" data-ex="' + i + '">&#9998; Answer now</button></div>';
      });
      html += '<button class="btn btn-primary" id="finalBtn">&#9632; Final Submit</button></div>';
    }
    $('view-review').innerHTML = html;
    showView('review');
    var fb = $('finalBtn');
    if (fb) fb.addEventListener('click', finishExam);
    document.querySelectorAll('#view-review button[data-ex]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-ex'), 10);
        S.idx = S.seq.indexOf(i);
        showView('exam');
        renderExercise();
      });
    });
  }

  /* ================= results ================= */
  function finishExam() {
    if (S.ended) return;
    S.ended = true;
    setTimerState('ENDED');
    hidePauseOverlay();
    var sum = creditSum();
    var n = answeredCount();
    var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
    var fully = 0, partial = 0, partialSum = 0, wrong = 0;
    var recap = [];
    S.seq.forEach(function (i) {
      var has = Object.prototype.hasOwnProperty.call(S.credits, i);
      var c = has ? S.credits[i] : null;
      var st, word;
      if (!has && S.skipped.indexOf(i) !== -1) { st = 'skip'; word = '&#9888; Skipped — excluded'; }
      else if (!has) { st = 'skip'; word = '&#9888; Not answered — excluded'; }
      else if (c >= 1) { st = 'ok'; word = '&#10003; Fully correct'; fully++; }
      else if (c > 0) { st = 'part'; word = '&#10003; Partially correct'; partial++; partialSum += c; }
      else { st = 'bad'; word = '&#10007; Fully incorrect'; wrong++; }
      recap.push('<div class="recap-row"><span class="st ' + st + '">' + word + '</span><span>' + esc(EXR[i].title) + '</span><span class="cr">' + (has ? (Math.round(c * 100) / 100) : '&mdash;') + '</span></div>');
    });
    var passed = pct >= META.passMark && n > 0;
    var html = '<section class="card res-top"><h1>Results — ' + esc(META.title) + '</h1>';
    html += (INTRO.username ? '<p class="sub">Operator: ' + esc(INTRO.username) + '</p>' : '');
    html += '<div class="pct">' + pct + '%</div><p class="sub">' + (Math.round(sum * 10) / 10) + ' credit points over ' + n + ' answered exercise' + (n === 1 ? '' : 's') + ' &middot; pass mark ' + META.passMark + '%</p></section>';
    html += passed
      ? '<div class="pass-panel"><div class="big">&#10003; PASS</div><p>Certificate-level performance on ' + esc(META.severityLabel) + ' for ' + esc(META.id) + '.</p></div>'
      : '<div class="fail-panel"><div class="big">&#10007; FAIL</div><p>You must retake this exam to reach the ' + META.passMark + '% pass mark. Study the feedback, then press Retake Exam.</p></div>';
    html += '<div class="res-grid">';
    html += '<div class="res-cell c-correct"><div class="num">' + fully + '</div><div class="lbl">&#10003; Fully correct</div></div>';
    html += '<div class="res-cell c-partial"><div class="num">' + partial + '</div><div class="lbl">&#10003; Partially correct' + (partial > 0 ? ' — avg ' + (Math.round((partialSum / partial) * 100) / 100) : '') + '</div></div>';
    html += '<div class="res-cell c-incorrect"><div class="num">' + wrong + '</div><div class="lbl">&#10007; Fully incorrect</div></div>';
    html += '<div class="res-cell c-skipped"><div class="num">' + (EXR.length - n) + '</div><div class="lbl">&#9888; Skipped — excluded</div></div>';
    html += '</div>';
    html += '<section class="card"><div class="sec-title"><span class="bar"></span><h2>Time and pause report</h2></div><ul class="how-list">';
    html += '<li>Timer budget used: <b>' + fmt(S.budget - Math.max(0, S.remaining)) + '</b> of ' + fmt(S.budget) + (S.ended && S.remaining <= 0 ? ' (time ran out)' : '') + '</li>';
    html += '<li>&#9208; Time paused manually (breaks): <b>' + fmt(S.manualPauseSec) + '</b></li>';
    html += '<li>&#9208; Time paused for feedback review (after Check): <b>' + fmt(S.feedbackPauseSec) + '</b></li>';
    html += '<li>&#9432; Hints used: <b>' + Object.keys(S.hintUsed).length + '</b> (&minus;10% credit each, on that exercise only)</li>';
    html += '</ul></section>';
    html += '<section class="card"><div class="sec-title"><span class="bar"></span><h2>Per-exercise recap</h2></div>' + recap.join('') + '</section>';
    html += '<div style="display:flex;gap:12px;"><button class="btn btn-primary" id="retakeBtn" style="font-size:1.05rem;padding:12px 26px;">&#8635; Retake Exam</button></div>';
    $('view-results').innerHTML = html;
    showView('results');
    $('retakeBtn').addEventListener('click', startExam);
    reportScore(sum, n);
  }
  function endExam() { finishExam(); }
  function reportScore(creditSumRaw, answeredN) {
    if (S.reported) return;
    S.reported = true;
    var percent = answeredN > 0 ? Math.round((creditSumRaw / answeredN) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumRaw),
        total: answeredN,
        percent: percent,
        passed: percent >= META.passMark
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  /* ================= site handshake ================= */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    INTRO.username = event.data.username || '';
    /* theme is always 'dark' — the file is dark-only by contract, nothing to switch */
  });

  /* ================= renderers ================= */
  function optRow(letter, text, kind) {
    return '<button type="button" class="opt" data-k="' + kind + '"><span class="opt-label">' + letter + '.</span><span class="opt-txt">' + esc(text) + '</span><span class="sel-ind">&#9673; Selected</span></button>';
  }
  function wireOpts(container, single, onSelect) {
    var opts = container.querySelectorAll('.opt');
    opts.forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.cur.checked) return;
        if (single) {
          opts.forEach(function (o) { o.classList.remove('sel'); });
          this.classList.add('sel');
        } else {
          this.classList.toggle('sel');
        }
        if (onSelect) onSelect();
      });
    });
  }

  var RENDER = {};
  var GRADER = {};

  /* ---- QCM (single answer) ---- */
  RENDER.qcm = function (e) {
    var d = e.data;
    var order = shuffle(d.options.map(function (o, i) { return i; }));
    S.cur.order = order;
    var html = '<div class="opts" id="opts">';
    order.forEach(function (oi, pos) {
      html += optRow('ABCD'[pos], d.options[oi], oi);
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    wireOpts($('opts'), true, function () { $('checkBtn').disabled = false; });
    addFooter(true);
  };
  GRADER.qcm = function (e, cur, done) {
    var sel = document.querySelector('#opts .opt.sel');
    if (!sel) return done(false, null);
    var picked = parseInt(sel.getAttribute('data-k'), 10);
    var ok = picked === e.data.correct;
    var rows = ok ? [] : [{ txt: 'The correct answer was: ' + e.data.options[e.data.correct], st: 'm' }];
    done(true, {
      credit: ok ? 1 : 0, h: ok ? 1 : 0, n: 1, rows: rows,
      expl: '<p>' + e.explanation + '</p>'
    });
  };

  /* ---- Multi-select (partial credit) ---- */
  RENDER.multi = function (e) {
    var d = e.data;
    var order = shuffle(d.options.map(function (o, i) { return i; }));
    S.cur.order = order;
    var html = '<p class="hintline">&#10022; Select <b>every</b> option that applies. Wrong picks subtract from your credit.</p><div class="opts" id="opts">';
    order.forEach(function (oi, pos) {
      html += optRow(String.fromCharCode(65 + pos), d.options[oi], oi);
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    wireOpts($('opts'), false, function () { $('checkBtn').disabled = false; });
    addFooter(true);
  };
  GRADER.multi = function (e, cur, done) {
    var sel = document.querySelectorAll('#opts .opt.sel');
    if (sel.length === 0) return done(false, null);
    var picked = [];
    sel.forEach(function (b) { picked.push(parseInt(b.getAttribute('data-k'), 10)); });
    var correct = e.data.correct;
    var H = 0, W = 0, rows = [];
    correct.forEach(function (ci) {
      var txt = e.data.options[ci];
      if (picked.indexOf(ci) !== -1) { H++; rows.push({ txt: txt, st: 'c' }); }
      else { rows.push({ txt: txt, st: 'm' }); }
    });
    picked.forEach(function (pi) {
      if (correct.indexOf(pi) === -1) { W++; rows.push({ txt: e.data.options[pi], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, correct.length);
    done(true, { credit: credit, h: H, n: correct.length, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- True / False ---- */
  RENDER.tf = RENDER.qcm;
  GRADER.tf = GRADER.qcm;

  /* ---- Fill in the blanks ---- */
  RENDER.fill = function (e) {
    var d = e.data;
    var parts = d.template.split('___');
    var html = '<p class="fill-text">';
    for (var i = 0; i < parts.length; i++) {
      html += esc(parts[i]);
      if (i < parts.length - 1) {
        html += '<select class="fill-select" data-b="' + i + '" aria-label="Blank ' + (i + 1) + '"><option value="">— choose —</option>';
        shuffle(d.bank).forEach(function (w) { html += '<option value="' + esc(w) + '">' + esc(w) + '</option>'; });
        html += '</select>';
      }
    }
    html += '</p><div class="bank"><span class="hintline">Word bank (shuffled):</span>';
    shuffle(d.bank).forEach(function (w) { html += '<span class="chip banked">' + esc(w) + '</span>'; });
    html += '</div>';
    $('a-body').innerHTML = html;
    $('a-body').querySelectorAll('.fill-select').forEach(function (s) {
      s.addEventListener('change', function () { updateCheckState(); });
    });
    addFooter(true);
  };
  GRADER.fill = function (e, cur, done) {
    var sels = document.querySelectorAll('.fill-select');
    var any = false;
    sels.forEach(function (s) { if (s.value) any = true; });
    if (!any) return done(false, null);
    var answers = e.data.answers;
    var H = 0, W = 0, rows = [];
    sels.forEach(function (s, i) {
      var v = s.value;
      if (!v) { rows.push({ txt: 'Blank ' + (i + 1) + ' — correct word: ' + answers[i], st: 'm' }); }
      else if (v === answers[i]) { H++; rows.push({ txt: 'Blank ' + (i + 1) + ': ' + answers[i], st: 'c' }); }
      else { W++; rows.push({ txt: 'Blank ' + (i + 1) + ' — you chose ' + v + ', correct word: ' + answers[i], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, answers.length);
    done(true, { credit: credit, h: H, n: answers.length, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Matching ---- */
  RENDER.match = function (e) {
    var d = e.data;
    var right = shuffle(d.pairs.map(function (p) { return p[1]; }));
    S.cur.right = right;
    var html = '<p class="hintline">&#10022; Click a left item, then its matching chip on the right. Each correct pair scores one item.</p><div class="match-grid"><div class="m-left" id="mleft">';
    d.pairs.forEach(function (p, i) {
      html += '<div class="m-item" data-l="' + i + '"><b>' + esc(p[0]) + '</b><div class="pairline" hidden></div></div>';
    });
    html += '</div><div class="m-right" id="mright">';
    right.forEach(function (r) { html += '<button type="button" class="chip" data-r="' + esc(r) + '">' + esc(r) + '</button>'; });
    html += '</div></div>';
    $('a-body').innerHTML = html;
    var selLeft = null;
    $('a-body').querySelectorAll('.m-item').forEach(function (mi) {
      mi.addEventListener('click', function () {
        if (S.cur.checked) return;
        $('a-body').querySelectorAll('.m-item').forEach(function (m) { m.classList.remove('sel'); });
        this.classList.add('sel');
        selLeft = this;
      });
    });
    $('a-body').querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        if (S.cur.checked || !selLeft) return;
        var pair = selLeft.querySelector('.pairline');
        pair.hidden = false;
        pair.innerHTML = '&#8594; ' + esc(this.getAttribute('data-r')) + ' <button type="button" class="unpick" aria-label="Undo pair">&#10007; undo</button>';
        pair.querySelector('.unpick').addEventListener('click', function (ev) {
          ev.stopPropagation();
          pair.hidden = true; pair.innerHTML = '';
        });
        selLeft.classList.remove('sel'); selLeft = null;
        updateCheckState();
      });
    });
    addFooter(true);
  };
  GRADER.match = function (e, cur, done) {
    var items = document.querySelectorAll('#mleft .m-item');
    var any = false;
    items.forEach(function (mi) { if (mi.querySelector('.pairline') && !mi.querySelector('.pairline').hidden) any = true; });
    if (!any) return done(false, null);
    var H = 0, W = 0, rows = [];
    items.forEach(function (mi, i) {
      var pl = mi.querySelector('.pairline');
      var paired = pl && !pl.hidden;
      var rightTxt = paired ? pl.getAttribute('data-paired') || e.data.pairs[i][1] : null;
      if (!paired) { rows.push({ txt: e.data.pairs[i][0] + ' — correct match: ' + e.data.pairs[i][1], st: 'm' }); return; }
      /* read the paired text from the rendered chip label */
      var chipTxt = pl.textContent.replace(/^→\s*/, '').replace(/\s*✗\s*undo\s*$/, '');
      if (chipTxt === e.data.pairs[i][1]) { H++; rows.push({ txt: e.data.pairs[i][0] + ' → ' + e.data.pairs[i][1], st: 'c' }); }
      else { W++; rows.push({ txt: e.data.pairs[i][0] + ' — you paired ' + chipTxt + ', correct: ' + e.data.pairs[i][1], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, e.data.pairs.length);
    done(true, { credit: credit, h: H, n: e.data.pairs.length, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Ordering ---- */
  RENDER.order = function (e) {
    var d = e.data;
    var order = shuffle(d.items.map(function (t, i) { return i; }));
    S.cur.order = order;
    var html = '<p class="hintline">&#10022; Put the items in the correct order (1 = first). Use the arrow buttons or drag rows.</p><div id="ordlist">';
    order.forEach(function (oi) {
      html += '<div class="ord-row" draggable="true" data-oi="' + oi + '"><span class="ord-num">&#8226;</span><span class="ord-txt">' + esc(d.items[oi]) + '</span>' +
        '<span class="ord-btns"><button type="button" class="ord-btn" data-dir="-1" aria-label="Move up">&#9650;</button>' +
        '<button type="button" class="ord-btn" data-dir="1" aria-label="Move down">&#9660;</button></span></div>';
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    var list = $('ordlist');
    function renumber() {
      list.querySelectorAll('.ord-num').forEach(function (n, i) { n.textContent = String(i + 1); });
      updateCheckState();
    }
    list.querySelectorAll('.ord-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.cur.checked) return;
        var row = this.closest('.ord-row');
        var dir = parseInt(this.getAttribute('data-dir'), 10);
        var rows = Array.prototype.slice.call(list.querySelectorAll('.ord-row'));
        var i = rows.indexOf(row);
        var j = i + dir;
        if (j < 0 || j >= rows.length) return;
        if (dir === -1) list.insertBefore(row, rows[j]);
        else list.insertBefore(rows[j], row);
        renumber();
      });
    });
    var dragRow = null;
    list.querySelectorAll('.ord-row').forEach(function (row) {
      row.addEventListener('dragstart', function () { dragRow = row; });
      row.addEventListener('dragover', function (ev) { ev.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function () { row.classList.remove('dragover'); });
      row.addEventListener('drop', function (ev) {
        ev.preventDefault(); row.classList.remove('dragover');
        if (!dragRow || dragRow === row) return;
        var rows = Array.prototype.slice.call(list.querySelectorAll('.ord-row'));
        if (rows.indexOf(dragRow) < rows.indexOf(row)) list.insertBefore(dragRow, row.nextSibling);
        else list.insertBefore(dragRow, row);
        renumber();
      });
    });
    renumber();
    addFooter(true);
  };
  GRADER.order = function (e, cur, done) {
    var rows = document.querySelectorAll('#ordlist .ord-row');
    if (!rows.length) return done(false, null);
    var H = 0, W = 0, rowsOut = [];
    rows.forEach(function (r, pos) {
      var oi = parseInt(r.getAttribute('data-oi'), 10);
      if (oi === pos) { H++; rowsOut.push({ txt: 'Position ' + (pos + 1) + ': ' + e.data.items[oi], st: 'c' }); }
      else { W++; rowsOut.push({ txt: 'Position ' + (pos + 1) + ' — you placed ' + e.data.items[oi] + ', correct: ' + e.data.items[pos], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, e.data.items.length);
    done(true, { credit: credit, h: H, n: e.data.items.length, rows: rowsOut, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Drag & drop into buckets ---- */
  RENDER.dnd = function (e) {
    var d = e.data;
    S.cur.chipState = {};
    var html = '<p class="hintline">&#10022; Drag a chip into a bucket, or click a chip and then a bucket. Click the &times; on a placed chip to send it back.</p><div class="dd-wrap">';
    html += '<div class="chipbank" id="chipbank">';
    shuffle(d.chips.map(function (c, i) { return i; })).forEach(function (ci) {
      html += '<button type="button" class="chip" draggable="true" data-ci="' + ci + '">' + esc(d.chips[ci].label) + '</button>';
    });
    html += '</div><div class="buckets" id="buckets">';
    d.buckets.forEach(function (b, bi) {
      html += '<div class="bucket" data-bi="' + bi + '"><h4>' + esc(b) + '</h4><div class="b-in"></div><div class="drop-here">Drop here or click while a chip is selected</div></div>';
    });
    html += '</div></div>';
    $('a-body').innerHTML = html;
    var selChip = null;
    function placeIn(chipBtn, bucket) {
      var inner = bucket.querySelector('.b-in');
      var wrap = mk('div', 'chip-inbucket');
      var c2 = chipBtn.cloneNode(true);
      c2.classList.remove('selchip'); c2.classList.add('banked'); c2.draggable = false;
      wrap.appendChild(c2);
      var un = mk('button', 'unpick', '&#10007; back');
      un.setAttribute('aria-label', 'Return chip to bank');
      un.addEventListener('click', function (ev) {
        ev.stopPropagation();
        wrap.remove();
        chipBtn.hidden = false;
        delete S.cur.chipState[chipBtn.getAttribute('data-ci')];
        updateCheckState();
      });
      wrap.appendChild(un);
      inner.appendChild(wrap);
      bucket.querySelector('.drop-here').hidden = inner.children.length > 0;
      chipBtn.hidden = true;
      chipBtn.classList.remove('selchip');
      S.cur.chipState[chipBtn.getAttribute('data-ci')] = parseInt(bucket.getAttribute('data-bi'), 10);
      updateCheckState();
    }
    $('a-body').querySelectorAll('#chipbank .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        if (S.cur.checked) return;
        $('a-body').querySelectorAll('.chip').forEach(function (x) { x.classList.remove('selchip'); });
        if (this.hidden) return;
        this.classList.add('selchip');
        selChip = this;
      });
      c.addEventListener('dragstart', function () { selChip = c; });
    });
    $('a-body').querySelectorAll('.bucket').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.cur.checked || !selChip) return;
        placeIn(selChip, b);
        selChip = null;
      });
      b.addEventListener('dragover', function (ev) { ev.preventDefault(); b.classList.add('over'); });
      b.addEventListener('dragleave', function () { b.classList.remove('over'); });
      b.addEventListener('drop', function (ev) {
        ev.preventDefault(); b.classList.remove('over');
        if (!selChip) return;
        placeIn(selChip, b);
        selChip = null;
      });
    });
    addFooter(true);
  };
  GRADER.dnd = function (e, cur, done) {
    var assigned = Object.keys(cur.chipState);
    if (assigned.length === 0) return done(false, null);
    var H = 0, W = 0, rows = [];
    e.data.chips.forEach(function (c, i) {
      var got = cur.chipState[String(i)];
      if (got === undefined) { rows.push({ txt: c.label + ' — correct bucket: ' + e.data.buckets[c.bucket], st: 'm' }); }
      else if (got === c.bucket) { H++; rows.push({ txt: c.label + ' → ' + e.data.buckets[c.bucket], st: 'c' }); }
      else { W++; rows.push({ txt: c.label + ' — you placed it in ' + e.data.buckets[got] + ', correct: ' + e.data.buckets[c.bucket], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, e.data.chips.length);
    done(true, { credit: credit, h: H, n: e.data.chips.length, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Log viewer with filter + click ---- */
  RENDER.logclick = function (e) {
    var d = e.data;
    var html = '<input type="text" class="log-filter" id="logfilter" placeholder="Filter events (e.g. type a word: powershell, curl, apt…)" aria-label="Filter log lines">';
    html += '<div id="loglist">';
    d.lines.forEach(function (ln, i) {
      html += '<button type="button" class="logline ' + (ln.cls || '') + '" data-li="' + i + '"><span class="sh-line">' + hl(ln.t) + '</span><span class="sel-ind">&#9673; Selected</span></button>';
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    $('logfilter').addEventListener('input', function () {
      var q = this.value.toLowerCase();
      document.querySelectorAll('#loglist .logline').forEach(function (b) {
        b.style.display = (!q || b.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
      });
    });
    document.querySelectorAll('#loglist .logline').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.cur.checked) return;
        document.querySelectorAll('#loglist .logline').forEach(function (x) { x.classList.remove('sel'); });
        this.classList.add('sel');
        updateCheckState();
      });
    });
    addFooter(true);
  };
  GRADER.logclick = function (e, cur, done) {
    var sel = document.querySelector('#loglist .logline.sel');
    if (!sel) return done(false, null);
    var picked = parseInt(sel.getAttribute('data-li'), 10);
    var ok = picked === e.data.correctLine;
    var rows = ok ? [] : [{ txt: 'The line that answers the question: ' + e.data.lines[e.data.correctLine].t, st: 'm' }];
    done(true, { credit: ok ? 1 : 0, h: ok ? 1 : 0, n: 1, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Spot the mistake ---- */
  RENDER.spot = function (e) {
    var d = e.data;
    var html = '<p class="hintline">&#10022; One part of this draft is wrong. Click the wrong part.</p><p class="spot-wrap" id="spotwrap">';
    d.segments.forEach(function (seg) {
      if (typeof seg === 'string') html += esc(seg) + ' ';
      else html += '<button type="button" class="phrase" data-ph="' + esc(seg.ph) + '">' + esc(seg.ph) + '</button> ';
    });
    html += '</p>';
    $('a-body').innerHTML = html;
    document.querySelectorAll('#spotwrap .phrase').forEach(function (p) {
      p.addEventListener('click', function () {
        if (S.cur.checked) return;
        document.querySelectorAll('#spotwrap .phrase').forEach(function (x) { x.classList.remove('sel'); });
        this.classList.add('sel');
        updateCheckState();
      });
    });
    addFooter(true);
  };
  GRADER.spot = function (e, cur, done) {
    var sel = document.querySelector('#spotwrap .phrase.sel');
    if (!sel) return done(false, null);
    var ok = sel.classList.contains('mistake');
    var ph = sel.getAttribute('data-ph');
    var rows = ok ? [] : [{ txt: 'The wrong part was: ' + e.data.mistake, st: 'm' }];
    done(true, { credit: ok ? 1 : 0, h: ok ? 1 : 0, n: 1, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };
  /* mark the mistake phrase at render time */
  var _origSpot = RENDER.spot;
  RENDER.spot = function (e) {
    _origSpot(e);
    document.querySelectorAll('#spotwrap .phrase').forEach(function (p) {
      if (p.getAttribute('data-ph') === e.data.mistake) p.classList.add('mistake');
    });
  };

  /* ---- Signal duel ---- */
  RENDER.duel = function (e) {
    var d = e.data;
    var html = '<p class="hintline">&#10022; Two signals conflict. Click the one that must win the argument.</p><div class="duel" id="opts">';
    var sigs = [['a', d.a], ['b', d.b]];
    sigs.forEach(function (s, i) {
      html += '<button type="button" class="opt" data-k="' + s[0] + '"><h4>' + esc(s[1].title) + '</h4><span class="opt-txt">' + esc(s[1].body) + '</span><span class="sel-ind">&#9673; Selected</span></button>';
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    wireOpts($('opts'), true, function () { $('checkBtn').disabled = false; });
    addFooter(true);
  };
  GRADER.duel = function (e, cur, done) {
    var sel = document.querySelector('#opts .opt.sel');
    if (!sel) return done(false, null);
    var ok = sel.getAttribute('data-k') === e.data.winner;
    var winTxt = e.data.winner === 'a' ? e.data.a.title : e.data.b.title;
    var rows = ok ? [] : [{ txt: 'The signal that must win: ' + winTxt, st: 'm' }];
    done(true, { credit: ok ? 1 : 0, h: ok ? 1 : 0, n: 1, rows: rows, expl: '<p>' + e.explanation + '</p>' });
  };

  /* ---- Terminal ---- */
  RENDER.terminal = function (e) {
    var d = e.data;
    S.cur.termCmd = '';
    var html = '<div class="shell"><div class="sh-title"><span class="sh-dot"></span>' + esc(d.title || 'Simulation shell — nothing real is executed') + '</div>' +
      '<div class="sh-back" id="shback">' + d.banner.map(function (l) { return '<div class="sh-line">' + hl(l) + '</div>'; }).join('') + '</div>' +
      '<div class="sh-inputrow"><span class="sh-prompt">' + esc(d.prompt) + '</span>' +
      '<input type="text" class="sh-input" id="shinput" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div></div>';
    if (d.syntaxPanel) html += '<div class="syntax-panel"><span class="t">SYNTAX REMINDER</span>' + d.syntaxPanel + '</div>';
    if (d.outputSample) html += '<div class="syntax-panel"><span class="t">EXPECTED OUTPUT SHAPE</span><pre class="mono">' + hl(d.outputSample) + '</pre></div>';
    if (d.exTimer) {
      S.cur.exTimerTotal = d.exTimer; S.cur.exTimerLeft = d.exTimer;
      html += '<span class="ex-timer">&#9201; This task has its own clock: <b id="ex-timer-val">' + fmt(d.exTimer) + '</b> — it pauses with the main timer.</span>';
    }
    html += '<p class="hintline" style="margin-top:10px;">&#10022; Type the command and press Enter to run it (simulation). Then press Check.</p>';
    $('a-body').innerHTML = html;
    var inp = $('shinput');
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        var cmd = this.value;
        if (!cmd.trim()) return;
        var back = $('shback');
        back.insertAdjacentHTML('beforeend', '<div class="sh-line"><span class="sh-p">' + esc(d.prompt) + '</span> <span class="sh-echo">' + hl(cmd) + '</span></div>');
        if (d.simOutput) {
          back.insertAdjacentHTML('beforeend', '<div class="sh-out">' + hl(d.simOutput) + '</div>');
        }
        back.scrollTop = back.scrollHeight;
        S.cur.termCmd = cmd;
        this.value = '';
        updateCheckState();
      }
    });
    addFooter(true);
  };
  function normCmd(s) {
    return s.trim().replace(/\s+/g, ' ').toLowerCase();
  }
  GRADER.terminal = function (e, cur, done) {
    var raw = cur.termCmd || '';
    if (!raw.trim()) return done(false, null);
    var norm = normCmd(raw);
    var d = e.data;
    var H = 0, W = 0, rows = [], dangerous = false, dangerNote = '';
    d.elements.forEach(function (el) {
      if (getRe(el.re).test(norm)) { H++; rows.push({ txt: el.desc, st: 'c' }); }
      else { rows.push({ txt: el.desc, st: 'm' }); }
    });
    (d.danger || []).forEach(function (dg) {
      if (getRe(dg.re).test(norm)) { W++; dangerous = true; dangerNote += dg.desc + ' '; }
    });
    var credit = scoreExercise(H, W, d.elements.length);
    done(true, {
      credit: credit, h: H, n: d.elements.length, rows: rows,
      canonical: d.canonical, dangerous: dangerous, dangerNote: dangerNote.trim() || 'This command would have altered or destroyed evidence.',
      expl: '<p><b>Canonical command:</b></p><p>' + d.canonicalExpl + '</p>' + '<p>' + e.explanation + '</p>'
    });
  };
  function autoCheckTerminal() {
    if (S && !S.ended && ex() && ex().type === 'terminal' && S.cur && !S.cur.checked) {
      if (S.cur.exTimerFired) return;
      S.cur.exTimerFired = true;
      if (!S.cur.termCmd) { renderTimer(); return; } /* nothing typed — let the student answer under the main timer */
      setTimerState('PAUSED_AUTO_CHECK');
      onCheck();
    }
  }

  /* ---- Decision tree ---- */
  RENDER.tree = function (e) {
    var d = e.data;
    S.cur.treeStep = 0;
    S.cur.treeChoices = [];
    S.cur.treeOrders = [];
    renderTreeStep(e);
  };
  function renderTreeStep(e) {
    var d = e.data;
    var si = S.cur.treeStep;
    var step = d.steps[si];
    var ctx = $('sc-block').querySelector('.block-body');
    ctx.innerHTML = '<div class="artifact"><span class="art-label">ARTEFACT — Situation for step ' + (si + 1) + '</span><div class="prose">' + step.context + '</div></div>';
    renderQBody(e, { n: si + 1, total: d.steps.length, q: step.q });
    var order = shuffle(step.options.map(function (o, i) { return i; }));
    S.cur.treeOrders[si] = order;
    var html = '<div class="opts" id="opts">';
    order.forEach(function (oi, pos) {
      html += optRow('ABCD'[pos], step.options[oi], oi);
    });
    html += '</div>';
    $('a-body').innerHTML = html;
    $('fb-slot').innerHTML = '';
    var foot = $('ex-footer');
    foot.innerHTML = '';
    var isLastStep = si === d.steps.length - 1;
    var btn = mk('button', 'btn btn-primary', isLastStep ? '&#10003; Check (final step)' : '&#8594; Confirm and continue');
    btn.disabled = true;
    btn.addEventListener('click', function () {
      if (S.cur.checked) return;
      var sel = document.querySelector('#opts .opt.sel');
      if (!sel) return;
      var picked = parseInt(sel.getAttribute('data-k'), 10);
      S.cur.treeChoices[si] = picked;
      if (!isLastStep) {
        S.cur.treeStep++;
        renderTreeStep(e);
        window.scrollTo(0, 0);
      } else {
        onCheck();
      }
    });
    foot.appendChild(btn);
    wireOpts($('opts'), true, function () { btn.disabled = false; });
  }
  GRADER.tree = function (e, cur, done) {
    var d = e.data;
    var H = 0, W = 0, rows = [];
    d.steps.forEach(function (st, i) {
      var picked = cur.treeChoices[i];
      var pickedTxt = picked !== undefined ? st.options[picked] : '(no answer)';
      if (picked === st.correct) { H++; rows.push({ txt: 'Step ' + (i + 1) + ': ' + st.options[st.correct], st: 'c' }); }
      else if (picked === undefined) { rows.push({ txt: 'Step ' + (i + 1) + ' — correct: ' + st.options[st.correct], st: 'm' }); }
      else { W++; rows.push({ txt: 'Step ' + (i + 1) + ' — you chose ' + pickedTxt + ', correct: ' + st.options[st.correct], st: 'w' }); }
    });
    var credit = scoreExercise(H, W, d.steps.length);
    var expl = '<p>' + d.steps.map(function (st, i) { return '<p><b>Step ' + (i + 1) + ':</b> ' + st.why + '</p>'; }).join('') + (e.explanation ? '<p>' + e.explanation + '</p>' : '');
    done(true, { credit: credit, h: H, n: d.steps.length, rows: rows, expl: expl });
  };

  /* ================= footer / check button ================= */
  function addFooter(needsCheck) {
    var foot = $('ex-footer');
    foot.innerHTML = '';
    if (needsCheck) {
      var cb = mk('button', 'btn btn-primary', '&#10003; Check');
      cb.id = 'checkBtn';
      cb.disabled = true;
      cb.addEventListener('click', onCheck);
      foot.appendChild(cb);
      var note = mk('span', 'note', '&#10022; Checking stops the timer so you can study the feedback without pressure.');
      foot.appendChild(note);
    }
    updateCheckState();
  }
  function updateCheckState() {
    var cb = $('checkBtn');
    if (!cb || (S && S.cur && S.cur.checked)) return;
    var e = ex();
    var ok = false;
    if (e.type === 'qcm' || e.type === 'tf' || e.type === 'duel') ok = !!document.querySelector('#opts .opt.sel');
    else if (e.type === 'multi') ok = document.querySelectorAll('#opts .opt.sel').length > 0;
    else if (e.type === 'fill') { ok = false; document.querySelectorAll('.fill-select').forEach(function (s) { if (s.value) ok = true; }); }
    else if (e.type === 'match') { ok = false; document.querySelectorAll('#mleft .m-item').forEach(function (m) { var p = m.querySelector('.pairline'); if (p && !p.hidden) ok = true; }); }
    else if (e.type === 'order') ok = !!document.querySelector('#ordlist');
    else if (e.type === 'dnd') ok = S.cur && Object.keys(S.cur.chipState || {}).length > 0;
    else if (e.type === 'logclick') ok = !!document.querySelector('#loglist .logline.sel');
    else if (e.type === 'spot') ok = !!document.querySelector('#spotwrap .phrase.sel');
    else if (e.type === 'terminal') ok = !!(S.cur && S.cur.termCmd);
    else if (e.type === 'tree') ok = true; /* handled by per-step button */
    cb.disabled = !ok;
  }

  /* ================= init ================= */
  document.addEventListener('DOMContentLoaded', function () {
    renderIntro();
    showView('intro');
  });

})();
</script>
</body>
