var EXAM = {"topicId":"t1553.006","mitreId":"T1553.006","objectName":"Code Signing Policy Modification","objectType":"Sub-Technique","severity":"MEDIUM","timerMinutes":32,"estimatedMinutes":32,"passMark":70,"learnIntro":["Code signing policies are the rules a computer uses to decide which software may run. Windows uses Driver Signature Enforcement, a TESTSIGNING boot flag, and application controls that allow only signed DLLs; macOS uses System Integrity Protection. In this exam you study T1553.006 — Code Signing Policy Modification, a Sub-Technique of T1553 (Subvert Trust Controls) in the Defense Evasion tactic TA0005. The adversary does not fake a signature here — they change or relax the policy itself so unsigned or self-signed code becomes acceptable.","You will practise the work you meet on a SOC or IR shift: reading process telemetry for bcdedit.exe, spotting Registry writes to code signing policy keys, confirming boot configuration state with bcdedit /enum, reading SIP state on a Mac with csrutil status, and matching each step of an attack to the telemetry that catches it. You will also connect the published cases — APT39, BlackEnergy, Hikit, Pandora, and Turla — to the exact modification method each one used.","The risk you are defending against is a host that stays durably weaker: unsigned drivers and rootkits can load, blue screens become more likely, and a visible Test Mode watermark may be the only hint something changed. Every method needs elevated rights, and the kernel-memory path needs kernel-mode privileges first. You will also map the three mitigations — M1046 Boot Integrity, M1026 Privileged Account Management, and M1024 Restrict Registry Permissions — to the paths they block."],"keywords":[{"theme":"Modification methods","items":["command-line utilities","GUI utilities","Registry tampering (T1112)","debug or recovery boot","kernel memory variables"]},{"theme":"Windows mechanisms","items":["Driver Signature Enforcement","TESTSIGNING","Boot Configuration Data","bcdedit","g_CiOptions","Test Mode watermark","signed vulnerable driver"]},{"theme":"macOS mechanisms","items":["System Integrity Protection","csrutil status","csrutil disable","recoveryOS","SIP state"]},{"theme":"Application control","items":["RequireSigned","signed DLLs only","unsigned DLL load","APT39"]},{"theme":"Defence and response","items":["M1046 Boot Integrity","M1026 Privileged Account Management","M1024 Restrict Registry Permissions","read-only inspection","escalate to IR","Secure Boot"]}]};
var EXERCISES = [{"id":"e01","type":"match","perspective":"defender","scenario":{"title":"Hunt wrap-up — label the four modification methods","blocks":[{"kind":"text","body":"You are m.duval on the Corvid Freight Systems SOC day shift. A week of hunting found four separate attempts to weaken code signing policies, each using a different method. Detection engineer a.nakamura asks you to label the cases so every method is mapped to the enforcement mechanism it attacks. The ATT&CK page for T1553.006 names exactly these four method families."}]},"question":"Match each modification method to the enforcement mechanism it weakens.","answer":{"left":[{"id":"l1","text":"bcdedit.exe -set TESTSIGNING ON"},{"id":"l2","text":"Registry key tampering (T1112)"},{"id":"l3","text":"Rebooting into a debug or recovery mode"},{"id":"l4","text":"Altering variables in kernel memory"}],"right":[{"id":"r1","text":"System Integrity Protection (SIP) on macOS"},{"id":"r2","text":"Boot Configuration Data and its TESTSIGNING flag"},{"id":"r3","text":"Code signing policy values held in Registry keys"},{"id":"r4","text":"Driver Signature Enforcement via g_CiOptions"}],"correct":{"l1":"r2","l2":"r3","l3":"r1","l4":"r4"}},"explanation":"bcdedit writes to the Boot Configuration Data, where the TESTSIGNING flag lives. Registry tampering (T1112) changes the policy values stored in keys — the route Hikit took. A debug or recovery boot is what makes SIP changes such as csrutil disable possible on macOS. Direct kernel memory writes flip variables like g_CiOptions to switch off Driver Signature Enforcement — the route Turla took.","hint":"Think where each change lands: boot store, Registry, recovery environment, kernel RAM."},{"id":"e02","type":"qcm","perspective":"defender","scenario":{"title":"INC-30517 — registry tampering on FIN-WS-31","blocks":[{"kind":"text","body":"You are reviewing closed cases with m.duval. On FIN-WS-31 the telemetry shows tampering with Registry keys related to code signing policy, followed by an attempt to load a rootkit driver component. The boot configuration was never touched and no kernel exploit was observed. The team wants the published case that used this exact method."},{"kind":"artefact","label":"ARTEFACT 1 — Case summary INC-30517","body":"host: FIN-WS-31 · date: 2026-03-05\nwrites to Registry keys related to code signing policy,\nincluding values under HKLM\\SYSTEM\\CurrentControlSet\\Control\\CI\noutcome: driver signing verification bypassed before a\nrootkit driver load was attempted\nnot seen: boot option change, kernel exploit, macOS tooling"}]},"question":"Which published procedure example used this registry-based method against driver signing verification?","answer":{"options":["G0087 APT39 — turned off a signed-DLL application control","S0089 BlackEnergy — enabled a test signing boot option","S0009 Hikit — tampered with several Registry keys","G0010 Turla — modified variables in kernel memory"],"correctIndex":2},"explanation":"Hikit (S0009) attempted to disable driver signing verification by tampering with several Registry keys before loading a rootkit driver component — exactly the artefacts on FIN-WS-31. APT39 changed an application control feature, BlackEnergy changed a boot option, and Turla wrote kernel memory, so none of them matches a Registry-only case.","hint":"The artefact block says which surface was touched — keys, boot store, or RAM."},{"id":"e03","type":"multi","perspective":"defender","scenario":{"title":"INC-30522 — hunt log from APP-SRV-11","blocks":[{"kind":"text","body":"You are a.nakamura, reviewing the hunt log for INC-30522. The log below shows one full policy-modification chain on APP-SRV-11, from the first command to the unsigned driver load. Detection coverage for T1553.006 must name which telemetry caught which step. Study each line and pick the telemetry types that actually observed a step of the chain."},{"kind":"log","label":"ARTEFACT 1 — Hunt log APP-SRV-11 (2026-03-09)","lines":["2026-03-09T21:14:02Z  PROC    app-srv-11  bcdedit.exe -set TESTSIGNING ON  user=SVC-FREIGHT-ADM","2026-03-09T21:14:03Z  ALERT   app-srv-11  privileged utility executed: bcdedit used with a write option","2026-03-09T21:47:55Z  BOOT    app-srv-11  boot configuration state change recorded: testsigning=Yes","2026-03-09T22:02:47Z  DRIVER  app-srv-11  load  freight_mon.sys  signature=NONE  verdict=ALLOWED","2026-03-09T22:02:48Z  ALERT   app-srv-11  unsigned driver loaded after test signing enabled","2026-03-09T22:03:10Z  NET     app-srv-11  connection to 198[.]51[.]100[.]77:443 established"]}]},"question":"Select the three telemetry types that caught the three steps of this modification chain.","answer":{"options":["Process creation with command line — caught bcdedit.exe -set TESTSIGNING ON","Boot configuration state telemetry — caught testsigning=Yes after the reboot","Driver / system file load telemetry — caught unsigned freight_mon.sys","Network connection telemetry — caught the callback to 198[.]51[.]100[.]77","Email gateway telemetry — caught the phishing mail that started it all"],"correct":[0,1,2]},"explanation":"The chain had three observable steps: the boot flag was flipped, the reboot made it effective, and the unsigned driver loaded. Process creation with command line recorded the bcdedit execution, boot configuration state recorded testsigning=Yes, and driver load telemetry recorded freight_mon.sys with no signature. Network and email telemetry help with the intrusion story, but they did not observe any policy modification step.","study":"Study: the data sources behind T1553.006 — process creation with command line, registry modification, driver and system file loads, boot configuration state, macOS unified log / SIP state.","hint":"Find the three steps that changed or used the signing policy, then name the log that saw each one."},{"id":"e04","type":"terminal","perspective":"defender","scenario":{"title":"INC-30540 — boot configuration check on APP-SRV-11","blocks":[{"kind":"text","body":"IR bridge for INC-30540: APP-SRV-11 shows test signing enabled and an unsigned driver load, and IR lead t.okonkwo asks you to capture the full boot configuration state before anyone discusses changes. You are on a responder session with read-only intent. The bcdedit tool can list the whole boot store or a single entry, and it can also write entries — writing is not your job today and would break the evidence chain."},{"kind":"code","label":"SYNTAX REMINDER (example on a different entry)","lines":["$ bcdedit /enum {bootmgr}","  /enum        lists entries from the boot store (read only)","  {bootmgr}    one specific entry object, not the whole store"]}]},"question":"Type the command that lists all boot configuration entries on this host.","answer":{"prompt":"responder@app-srv-11:~$","termTitle":"simulated Windows shell — nothing real is executed","required":[{"desc":"runs the bcdedit tool","re":"^bcdedit"},{"desc":"uses the read-only /enum option","re":"/enum"}],"forbidden":[{"desc":"changing the boot store with -set","re":"-set","danger":true,"note":"bcdedit -set writes to the boot configuration. A responder confirms state first; changes need change control."}],"canonical":"bcdedit /enum","output":["Windows Boot Manager","--------------------","identifier              {bootmgr}","device                  partition=\\Device\\HarddiskVolume1","","Windows Boot Loader","-------------------","identifier              {current}","device                  partition=C:","path                    \\Windows\\system32\\winload.exe","testsigning             Yes"]},"explanation":"bcdedit /enum prints the boot store read-only, and the output confirms the weakened state: testsigning is Yes on the {current} loader. That is your evidence for the bridge. bcdedit -set is the write path — the very action the intruder used — so it is forbidden in an inspection session.","hint":"The tool starts with bcd; you want the option that lists entries, not the one that writes them."},{"id":"e05","type":"fill","perspective":"defender","scenario":{"title":"Gap analysis — what each method needs first","blocks":[{"kind":"text","body":"You are writing the gap-analysis note for INC-30540 with t.okonkwo. The note must state what an intruder needs before each modification method works. Complete the sentence using the word bank so the prerequisites are correct."}]},"question":"Fill the two gaps with the best bank words.","answer":{"segments":["Enabling TESTSIGNING with bcdedit or editing code signing policy values in the Registry both need "," rights on the compromised host. Writing to kernel memory to change g_CiOptions demands a second prerequisite first: "," privileges, which Turla and Pandora obtained by exploiting vulnerabilities."],"blanks":[{"accept":["administrator","admin"],"note":"Policy modification is an elevated operation — this is why M1026 helps."},{"accept":["kernel-mode","kernel mode"],"note":"Kernel memory is only reachable from kernel mode (T1068 exploitation)."}],"bank":["administrator","standard user","kernel-mode","user-mode","remote user","guest"],"mode":"select"},"explanation":"Both simple methods are elevated operations, so administrator rights are the gate — that is why M1026 Privileged Account Management reduces the risk. Kernel memory writes need kernel-mode privileges first, normally obtained by exploiting a vulnerability: Pandora used CVE-2017-15303 to disable DSE, and Turla exploited vulnerabilities to reach kernel mode before changing variables. Standard user, user-mode, remote user, and guest rights reach neither prerequisite.","hint":"First blank: the account level bcdedit needs. Second blank: the execution mode kernel memory lives in."},{"id":"e06","type":"dragdrop","perspective":"defender","scenario":{"title":"Hardening review — match mitigations to paths","blocks":[{"kind":"text","body":"You are preparing the hardening review that follows INC-30540. GRC needs the three published mitigations for T1553.006 sorted by the path each one blocks, before the budget meeting. Six control statements are on the table. Drag each statement into the bucket of the mitigation that delivers it."}]},"question":"Drag each control statement into the bucket of the mitigation it belongs to.","answer":{"buckets":[{"id":"b1","label":"M1046 Boot Integrity"},{"id":"b2","label":"M1026 Privileged Account Management"},{"id":"b3","label":"M1024 Restrict Registry Permissions"}],"items":[{"id":"i1","text":"Secure Boot limits the test signing boot path"},{"id":"i2","text":"Users cannot edit code signing policy keys"},{"id":"i3","text":"Daily work uses non-admin accounts, so bcdedit writes fail"},{"id":"i4","text":"Debug and recovery boot abuse becomes harder"},{"id":"i5","text":"Hikit-style Registry tampering is blocked at the key"},{"id":"i6","text":"Fewer staff hold local admin, so policy flips need a stolen admin"}],"correct":{"i1":"b1","i2":"b3","i3":"b2","i4":"b1","i5":"b3","i6":"b2"}},"explanation":"M1046 Boot Integrity covers the boot path: Secure Boot may prevent test signing and debug boot implementations. M1026 Privileged Account Management removes the elevated rights that every method needs for day-to-day users. M1024 Restrict Registry Permissions protects the keys that hold code signing policy values, which is what stops Hikit-style tampering.","study":"Study: mitigation IDs M1046, M1026, and M1024 for code signing policy modification.","hint":"Two statements per bucket: one bucket is about booting, one about accounts, one about Registry keys."},{"id":"e07","type":"qcm","perspective":"defender","scenario":{"title":"INC-30522 retro — the TESTSIGNING boot route","blocks":[{"kind":"text","body":"Threat-hunt retro on INC-30522: on OPS-WKS-17 a service account ran bcdedit.exe -set TESTSIGNING ON, the host rebooted, and a driver component then loaded that had been rejected before the change. The hunt lead wants the retro to cite the published case that used this boot-option route. Every case in the options enabled the same option — only the actor differs."}]},"question":"Which procedure example matches this TESTSIGNING boot-option change?","answer":{"options":["G0087 APT39 — enabled the TESTSIGNING boot option","S0089 BlackEnergy — enabled the TESTSIGNING boot option","S0664 Pandora — enabled the TESTSIGNING boot option","G0010 Turla — enabled the TESTSIGNING boot option"],"correctIndex":1},"explanation":"BlackEnergy (S0089) enabled the TESTSIGNING boot configuration option to facilitate loading a driver component — the same pattern of boot flag, reboot, driver load. APT39's published case was the RequireSigned application control, Pandora's was CVE-2017-15303 against DSE, and Turla's was kernel memory, so none of them used the TESTSIGNING boot option.","hint":"Only one of the four published cases used the boot configuration store."},{"id":"e08","type":"branch","perspective":"dual","scenario":{"title":"INC-30540 bridge — response decisions on APP-SRV-11","blocks":[{"kind":"text","body":"You are IR lead t.okonkwo on the INC-30540 bridge for APP-SRV-11, where TESTSIGNING is now enabled and an unsigned driver loaded. A red teamer on the call notes that defenders always hesitate here, and predicts your decisions. Walk the three decisions and prove the prediction wrong. Each step builds on the previous one."}]},"question":"Answer the three steps in order.","answer":{"steps":[{"text":"State is confirmed: testsigning=Yes in the boot store and an unsigned driver loaded. First move?","options":["Capture read-only evidence (bcdedit /enum output, driver load events) into the case","Flip the same values back live to restore protection immediately","Ask the user to reboot and keep working","Delete the unsigned driver file and close the ticket"],"correctIndex":0},{"text":"Evidence shows the Registry keys holding code signing policy values were also weakened. Which control would have prevented that step?","options":["M1046 Boot Integrity (Secure Boot)","M1026 Privileged Account Management","M1024 Restrict Registry Permissions","None — Registry hardening cannot stop this"],"correctIndex":2},{"text":"Final containment call for a host whose kernel trust is weakened. What do you decide?","options":["Only reboot — a restart restores every protection","Escalate to IR full scope: isolate the host and plan a re-image or an approved policy revert","Leave test signing enabled so developers can keep testing","Ask the vendor for a signed replacement next quarter"],"correctIndex":1}]},"explanation":"Read-only capture comes first because a live flip destroys evidence of how the policy was changed. The Registry-held values are exactly what M1024 Restrict Registry Permissions protects. And a reboot does not revert TESTSIGNING — the weakened state persists in the boot store until an approved revert or a re-image, so the host must be contained and remediated deliberately.","hint":"Step 1 is evidence before action; step 2 matches the control to the surface; step 3 remembers what survives a reboot."},{"id":"e09","type":"order","perspective":"attacker","scenario":{"title":"Red-team report — the kernel-memory chain on LAB-HOST-03","blocks":[{"kind":"text","body":"You are the red team lead writing the debrief for the lab exercise on LAB-HOST-03, run in the agreed scope. You simulated the Turla-style kernel path and now list its stages for the report. The detection team wants the stages in the exact order an intruder must chain them, because each stage needs the one before it."}]},"question":"Order the five stages of the kernel-memory path from first to last.","answer":{"items":[{"id":"o1","text":"Gain administrator access on the host"},{"id":"o2","text":"Load a signed but vulnerable driver (BYOVD)"},{"id":"o3","text":"Exploit the driver for kernel-mode privileges (T1068)"},{"id":"o4","text":"Alter g_CiOptions in kernel memory to disable DSE"},{"id":"o5","text":"Load the unsigned driver that was blocked before"}],"correctOrder":["o1","o2","o3","o4","o5"]},"explanation":"Nothing in this path works without elevation, so administrator access comes first. A signed but vulnerable driver then provides the lever — the BYOVD pattern — and exploiting it yields kernel-mode privileges (T1068). With kernel access, g_CiOptions can be altered to disable Driver Signature Enforcement, and only then does the previously blocked unsigned driver load. Pandora reached the same goal with CVE-2017-15303, and Turla used exploited kernel-mode privileges for its memory write.","hint":"You cannot exploit a driver you have not loaded, and the unsigned driver is the last thing in."},{"id":"e10","type":"fill","perspective":"defender","scenario":{"title":"INC-30540 note — artifacts and persistence","blocks":[{"kind":"text","body":"You are finishing the INC-30540 note for the fleet team. It must warn them about the two trade-offs every responder should know for TESTSIGNING changes: what becomes visible, and how long the weakened state lasts. Complete the sentence with the word bank."}]},"question":"Complete the warning sentence with two words from the bank.","answer":{"segments":["Enabling Test Signing paints a "," in a corner of the desktop, and the change only takes effect once the host is ",". Until the state is reverted, the host stays durably weaker than its baseline."],"blanks":[{"accept":["watermark"],"note":"The visible Test Mode artifact."},{"accept":["rebooted"],"note":"A restart applies the boot configuration change."}],"bank":["watermark","banner","signature","rebooted","logged off","restored"],"mode":"select"},"explanation":"The Test Mode watermark is the visible artifact of test signing, and removing it is itself adversary behaviour worth hunting. TESTSIGNING lives in the boot configuration, so the change applies at the next boot — and it also survives it: a reboot does not undo the weakened state, only an approved revert or a re-image does. Banner, signature, logged off, and restored do not describe what this policy change leaves behind.","hint":"One blank is something you can see on screen; the other is something the machine must do."},{"id":"e11","type":"multi","perspective":"defender","scenario":{"title":"INC-30561 — RequireSigned switched off on FILE-SRV-02","blocks":[{"kind":"text","body":"INC-30561: on FILE-SRV-02, malware disabled the RequireSigned application-control feature, which had ensured that only signed DLLs could run. Afterwards, unsigned DLLs executed without any error. The team debates whether this even counts as code signing policy modification. Pick the two statements that describe this case correctly for the report."}]},"question":"Select the two statements that correctly describe this RequireSigned case.","answer":{"options":["RequireSigned was an application control that allowed only signed DLLs to run","Turning it off relaxed the policy itself — no certificate was forged or abused","The malware forged a valid digital certificate to pass the DLL check","RequireSigned is the macOS name for System Integrity Protection","The attackers replaced bcdedit with a GUI utility to change the boot store"],"correct":[0,1]},"explanation":"APT39 (G0087) used malware to turn OFF the RequireSigned feature, which ensures only signed DLLs can run on Windows — a configurable application control, not a certificate. Switching it off is code signing POLICY modification because the enforcement itself was relaxed, and no signature was faked. RequireSigned is not SIP, and no boot store change was involved here.","hint":"Ask what the feature checked before, and what switching it off changed — nothing was signed."},{"id":"e12","type":"dragdrop","perspective":"attacker","scenario":{"title":"Red-team op report — artefacts per platform","blocks":[{"kind":"text","body":"You are the red team lead closing the dual-platform lab engagement for Corvid Freight's detection team. Your operators left policy-weakening artefacts on a Windows lab host (LAB-WIN-03) and a macOS lab host (LAB-MAC-04). The detection team must tune per-OS rules, so they ask you to sort every artefact by the platform it belongs to. Drag each artefact into the right bucket."}]},"question":"Drag each artefact into the platform bucket it belongs to.","answer":{"buckets":[{"id":"b1","label":"Windows lab artefacts"},{"id":"b2","label":"macOS lab artefacts"}],"items":[{"id":"i1","text":"A Test Mode watermark in the desktop corner"},{"id":"i2","text":"bcdedit.exe -set TESTSIGNING ON in process telemetry"},{"id":"i3","text":"g_CiOptions altered in kernel memory to disable DSE"},{"id":"i4","text":"csrutil disable run from a recoveryOS boot"},{"id":"i5","text":"csrutil status reporting SIP is disabled"},{"id":"i6","text":"An unsigned process executed after the SIP state changed"}],"correct":{"i1":"b1","i2":"b1","i3":"b1","i4":"b2","i5":"b2","i6":"b2"}},"explanation":"The watermark, the TESTSIGNING boot option, and g_CiOptions are all Windows artefacts — the boot store and the code-integrity kernel variable are Windows mechanisms. csrutil, recoveryOS, and SIP state are macOS artefacts; macOS unified log and SIP state telemetry ties the recoveryOS change to unsigned process executions. Sorting by platform keeps the detection ruleset honest.","hint":"bcdedit, TESTSIGNING, DSE, and the watermark are one platform; csrutil and recoveryOS are the other."},{"id":"e13","type":"triage","perspective":"defender","scenario":{"title":"Weekend shift — policy-modification queue","blocks":[{"kind":"text","body":"You are m.duval on the Saturday shift. Four alerts about code signing policy modification are queued, and none of the hosts has an approved change for this window. Triage each alert with one action: escalate means hand to IR with the artefacts you have; close means record a benign reason you do not actually have."}]},"question":"Triage every alert with a single action.","answer":{"alerts":[{"id":"a1","title":"bcdedit.exe -set TESTSIGNING ON on APP-SRV-11","detail":"Process creation shows the boot option flipped by a service account, and no change ticket matches. Server OUs never need test signing.","actions":["Escalate to IR with the evidence","Close as a developer convenience","Reboot the host only"]},{"id":"a2","title":"Unsigned driver load allowed after policy change","detail":"Driver load telemetry shows freight_mon.sys with signature=NONE executing right after testsigning=Yes appeared in boot state.","actions":["Close — unsigned drivers are normal after any change","Escalate to IR with artefacts","Whitelist the driver hash"]},{"id":"a3","title":"SIP disabled on MAC-INT-02","detail":"csrutil status reports SIP disabled, and the macOS admin team confirms no approved recoveryOS session took place.","actions":["Escalate to IR with artefacts","Close as an approved change","Delete the local unified log"]},{"id":"a4","title":"Registry write to code signing policy keys on FIN-WS-44","detail":"Registry telemetry shows writes to keys related to code signing policy, followed by a blocked unsigned driver load attempt.","actions":["Close — Registry writes are routine noise","Only watch it for a week","Escalate to IR with artefacts"]}],"correct":{"a1":0,"a2":1,"a3":0,"a4":2}},"explanation":"Each alert is a policy-weakening step with no matching approval: a flipped boot option on a server, an unsigned driver allowed through, a Mac with SIP off, and Registry tampering on a finance host. Closing, whitelisting, or delaying would leave hosts durably weaker, so each one goes to IR with the artefacts already captured.","hint":"None of these hosts has an approved change — match the strength of the evidence to the action."},{"id":"e14","type":"terminal","perspective":"defender","scenario":{"title":"INC-30583 — SIP state on MAC-INT-02","blocks":[{"kind":"text","body":"INC-30583: MAC-INT-02, an integrations Mac, tried to load an unsigned kernel extension called freight_sync.kext, and macOS admin j.pereira asks you to confirm the System Integrity Protection state before escalation. A normal session can print the SIP state; changing it needs a recoveryOS boot, which nobody here is doing. The syntax panel shows the status report with extra detail on another option."},{"kind":"code","label":"SYNTAX REMINDER (example with a different option)","lines":["$ csrutil status --verbose","  status      prints the current SIP state (read only)","  --verbose   adds detail for each protection part"]}]},"question":"Type the command that prints the current SIP state.","answer":{"prompt":"analyst@mac-int-02:~$","termTitle":"simulated macOS shell — nothing real is executed","required":[{"desc":"uses the csrutil tool","re":"^csrutil"},{"desc":"asks for the status report, not a change","re":"status"}],"forbidden":[{"desc":"disabling SIP","re":"disable","danger":true,"note":"csrutil disable switches SIP off. It needs recoveryOS and it is exactly the attacker's action — never the inspector's."}],"canonical":"csrutil status","output":["System Integrity Protection status: disabled."]},"explanation":"csrutil status is the read-only way to read SIP state from a normal macOS session, and the output shows SIP is disabled — which explains the unsigned kext attempt and is your escalation evidence. csrutil disable would change the policy, the exact behaviour T1553.006 abuses, and belongs only in a controlled recoveryOS session.","hint":"The tool starts with csr; ask it for the current state, not for any change."},{"id":"e15","type":"qcm","perspective":"attacker","scenario":{"title":"Debrief — what made the kernel write possible","blocks":[{"kind":"text","body":"Red-team debrief with Corvid Freight's blue team. You summarise the published Turla case (G0010): Turla modified variables in kernel memory to turn off Driver Signature Enforcement after exploiting vulnerabilities that obtained kernel-mode privileges. The blue team asks what made the kernel write possible at all. Your answer should name the single essential prerequisite."}]},"question":"What was the essential prerequisite for Turla's kernel memory modification?","answer":{"options":["A Test Mode watermark already present on the desktop","A valid certificate issued for the unsigned driver","Physical access to the boot menu on every restart","Kernel-mode privileges obtained by exploiting vulnerabilities"],"correctIndex":3},"explanation":"Kernel memory is only reachable from kernel mode. Turla first exploited vulnerabilities to obtain kernel-mode privileges and only then turned off DSE by changing kernel variables. A watermark is an artifact, not an enabler; a certificate for the blocked driver is irrelevant while enforcement runs; and the boot menu is a different, recovery-mode method entirely.","hint":"Ask which execution mode can even write to kernel memory — and how Turla got there."},{"id":"e16","type":"match","perspective":"defender","scenario":{"title":"Detection onboarding — five published cases","blocks":[{"kind":"text","body":"You are shadowing detection engineer a.nakamura during onboarding. She hands you the five published procedure examples for T1553.006 and asks you to memorise them as a quick reference for future hunts. Each case used a different modification method, and no method repeats. Match every actor or malware family to its exact method."}]},"question":"Match each published case to the exact method it used.","answer":{"left":[{"id":"l1","text":"G0087 APT39"},{"id":"l2","text":"S0089 BlackEnergy"},{"id":"l3","text":"S0009 Hikit"},{"id":"l4","text":"S0664 Pandora"},{"id":"l5","text":"G0010 Turla"}],"right":[{"id":"r1","text":"Enabled the TESTSIGNING boot configuration option"},{"id":"r2","text":"Turned off the RequireSigned signed-DLL-only feature"},{"id":"r3","text":"Tampered with several Registry keys before loading a rootkit driver"},{"id":"r4","text":"Modified variables in kernel memory to turn off DSE"},{"id":"r5","text":"Used CVE-2017-15303 to disable DSE and load its driver"}],"correct":{"l1":"r2","l2":"r1","l3":"r3","l4":"r5","l5":"r4"}},"explanation":"These are the five published procedure examples for T1553.006: APT39 switched off the RequireSigned signed-DLL application control, BlackEnergy enabled TESTSIGNING in the boot configuration, Hikit tampered with Registry keys, Pandora used CVE-2017-15303 against DSE, and Turla wrote kernel memory variables after reaching kernel mode. Together they cover every method family on the page.","study":"Study: the five published procedure examples for T1553.006 and their methods.","hint":"Match the surface: application control, boot store, Registry, a CVE, and kernel RAM."}];

/* ================= tiny utilities ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rng){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function range(n){ var a = []; for(var i = 0; i < n; i++){ a.push(i); } return a; }
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
function shortTxt(s, n){ s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
