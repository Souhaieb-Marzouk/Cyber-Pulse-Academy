<script>
var DATA = {"meta":{"topicId":"t1195.003","batch":2,"title":"T1195.003 Compromise Hardware Supply Chain — MEDIUM","difficulty":"medium","questionCount":15,"estimatedMinutes":30,"passMark":70},"severity":"MEDIUM","timerBudget":1800,"intro":{"learn":["This is the <b>MEDIUM</b> exam for <b>T1195.003 &mdash; Compromise Hardware Supply Chain</b>. You already know the basics: an attacker changes a device&rsquo;s hardware or firmware <b>before</b> the buyer receives it, so the implant starts before the operating system. Now we go one level deeper: how the attack actually happens in the wild, and what defenders collect to see it.","You will work with the real ATT&amp;CK building blocks. The technique maps to the <b>Initial Access</b> tactic and runs on <b>Linux, Windows, and macOS</b>. ATT&amp;CK&rsquo;s detection strategy for it, <b>DET0368</b>, chains signals: firmware version drift, secure boot or signature failures, hardware inventory drift, and unknown drivers that load right after boot. Its mitigation, <b>M1046 Boot Integrity</b>, uses UEFI Secure Boot, TPM attestation, bootloader passwords, and runtime integrity checks.","In this exam you play working roles. As a <b>SOC analyst</b> you triage a firmware-drift alert and decide what to collect. As a <b>detection engineer</b> you map data sources like Windows CodeIntegrity logs, Linux auditd calls, and the macOS unified log to what they reveal. As <b>procurement</b> you harden the intake process. As an <b>incident responder</b> you prioritise which devices to audit first.","Expect near-miss answers. The classic trap here is confusing T1195.003 with <b>T1542 Pre-OS Boot</b> (firmware persistence that an attacker installs <b>after</b> breaking in) or <b>T1200 Hardware Additions</b> (rogue devices plugged in <b>on site</b>). The timing of the tampering &mdash; before or after delivery &mdash; is the line between them."],"themes":[{"name":"Detection telemetry (DET0368)","items":["firmware version drift","secure boot / signature failures","hardware inventory drift","unknown boot-start drivers","Windows CodeIntegrity + Sysmon (AN1035)","auditd firmware_update, fwupd (AN1036)","macOS unified log + AMFI (AN1037)"]},{"name":"Mitigation M1046 in practice","items":["UEFI Secure Boot","TPM attestation","bootloader / BIOS passwords","runtime integrity monitoring"]},{"name":"Attack mechanics","items":["shipment interdiction","factory tamper","repack and deliver","first beacon after deployment"]},{"name":"Intake & procurement controls","items":["tamper-evident seals","serial verification","firmware hash baselines","approved delivery channel"]},{"name":"Near-miss discrimination","items":["T1542 Pre-OS Boot (tamper after access)","T1200 Hardware Additions (rogue device on site)","benign firmware updates"]},{"name":"Prioritisation","items":["internet-facing devices first","domain-critical servers","internal switching","peripherals last"]}],"types":"single and multi-select questions, matching, drag & drop sorting, ordering and ranking, word blanks, a filterable log viewer, one terminal command with options, a line-selection exercise, and a 3-step triage scenario"},"exercises":[{"id":"m1","type":"mcq","title":"Version mismatch on arrival","summary":"New firewall firmware does not match the vendor baseline","scen":[{"t":"p","x":"A brand-new firewall arrives and is racked during the change window. Before joining it to the network, an engineer compares the preinstalled firmware with the vendor&rsquo;s published baseline for that exact model."},{"t":"mono","label":"ARTEFACT 1 — VENDOR BASELINE (model FW-500, build 2.4.x)","x":"model FW-500, hardware rev C\npublished firmware for rev C: <span class='ok'>2.4.0</span>  (SHA-256 published)\nnotes: rev C never shipped with 2.4.1"},{"t":"mono","label":"ARTEFACT 2 — UNIT ON THE BENCH","x":"model FW-500, hardware rev C\npreinstalled firmware: <span class='er'>2.4.1</span>\nsha256: (not yet computed)"}],"q":"What is the best first conclusion for the engineer to record?","options":[{"id":"a","x":"Consistent with possible hardware supply chain tampering; verify with the vendor before it goes live","why":"Correct: a build the vendor says never shipped, preinstalled on a delivered unit, is exactly the T1195.003 pattern &mdash; and the right next step is verification, not panic."},{"id":"b","x":"The invoice probably has a typo; proceed with deployment","why":"The discrepancy is in the device&rsquo;s own firmware, not in paperwork. Deploying would put an unverified implant one step from production."},{"id":"c","x":"The unit is certainly counterfeit but harmless; shelve it","why":"Even if counterfeit, &lsquo;harmless&rsquo; is not established &mdash; and shelving without verification leaves the root cause unknown."},{"id":"d","x":"Someone must have clicked a phishing link","why":"Phishing is an after-delivery attack path. Nothing here involves a user or a message."}],"correct":"a","hint":"Two artefacts, one question: does the vendor say this build ever shipped for this hardware revision? Then decide the wording: &lsquo;consistent with&rsquo;, not &lsquo;proven&rsquo;.","expl":"<b>Step 1</b> reads the facts: the unit carries a firmware build the vendor never published for rev C. <b>Step 2</b> maps it to ATT&amp;CK: tampering <b>before receipt</b> is the T1195.003 pattern. Good practice is precise language &mdash; &ldquo;consistent with&rdquo; &mdash; plus a verification step: ask the vendor, compute the published hash. <b>Attacker view:</b> they need a build that looks plausible; 2.4.1 next to 2.4.0 looks plausible. <b>Defender view:</b> the baseline comparison is what breaks the plausibility.","study":"Check whether your intake process records the exact firmware build of every network device on arrival."},{"id":"m2","type":"multi","title":"Which telemetry supports the concern?","summary":"Select every signal that supports a firmware-tamper investigation","scen":[{"t":"p","x":"The SOC opens a low-confidence case: &ldquo;possible firmware tampering on a delivered server&rdquo;. The detection engineer lists candidate signals from DET0368-style analytics. Select every signal that genuinely supports this specific concern."}],"q":"Select all signals that support a firmware-tamper investigation.","options":[{"id":"a","x":"Secure boot attestation events fail their baseline check","why":"Correct: attestation failures are a first-class DET0368 signal &mdash; the boot chain no longer matches what the platform measured before."},{"id":"b","x":"Firmware version drifts from the vendor baseline for the model","why":"Correct: version drift against a vendor baseline is the anchor analytic of hardware supply chain detection."},{"id":"c","x":"An unexpected device appears in hardware inventory telemetry","why":"Correct: inventory drift &mdash; a component the host never had before &mdash; fits the &lsquo;unexpected modules or devices enumerated at boot&rsquo; chain."},{"id":"d","x":"An unsigned boot-start driver loads right after boot","why":"Correct: DET0368&rsquo;s last chain step is follow-on execution &mdash; unknown or unsigned drivers loading after a modified boot."},{"id":"e","x":"An Excel macro alert fires on a user laptop","why":"Not correct: a user-document macro alert belongs to user-focused malware detections, not to the boot or firmware layer."},{"id":"f","x":"A VPN login arrives from a new country","why":"Not correct: account telemetry is real and useful, but it says nothing about the firmware of a delivered device."}],"correct":["a","b","c","d"],"hint":"DET0368&rsquo;s behavioural chain lives at the boot layer: version changes, signature failures, inventory drift, then follow-on drivers. Everything above the OS boot layer is someone else&rsquo;s alert.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 4)</span>. The four correct signals follow DET0368&rsquo;s chain: (1) firmware/version or signature anomalies, (2) hardware inventory drift, (3) failed attestation, (4) unknown drivers after boot. The macro and VPN signals are real detections &mdash; just for other techniques. Keeping signal layers separate is the core detection-engineering skill here.","study":"Sketch DET0368&rsquo;s four-step behavioural chain and one log source for each step."},{"id":"m3","type":"categorize","title":"Right technique, right bucket","summary":"Four findings &mdash; T1195.003, T1542, T1200, or benign","scen":[{"t":"p","x":"Four findings from different tickets. The timing of each event &mdash; before or after delivery, on site or in the chain &mdash; decides the technique. One finding per bucket."}],"q":"Drag each finding to its correct bucket.","slots":[{"id":"s1","label":"T1195.003 — tampered before delivery","why":"Correct: a sealed component containing an extra chip on <b>arrival</b> is tampering in the supply chain, before the buyer controls it."},{"id":"s2","label":"T1542 — Pre-OS Boot (after access)","why":"Correct: the bootkit was installed <b>after</b> an admin was phished and ran a malicious image &mdash; firmware persistence after access, not supply chain."},{"id":"s3","label":"T1200 — Hardware Additions","why":"Correct: a rogue device physically <b>plugged in on site</b> by an intruder is Hardware Additions, not pre-delivery tampering."},{"id":"s4","label":"Benign — verified vendor operation","why":"Correct: a signed image from the vendor portal whose hash matches the published value is the normal update path."}],"items":[{"id":"i1","x":"Sealed spare disk controller arrives; opening shows an extra chip glued to the board"},{"id":"i2","x":"Admin phished into mounting an ISO; bootkit found in UEFI the next day"},{"id":"i3","x":"Unknown switch found plugged into an IDF closet after badge misuse at night"},{"id":"i4","x":"Switch firmware updated from the vendor portal; signed hash matches the published one"}],"correct":{"i1":"s1","i2":"s2","i3":"s3","i4":"s4"},"hint":"Ask of each finding: who touched it, and were they inside your walls yet? Before delivery = T1195.003; after access = T1542; on site = T1200; verified vendor = benign.","expl":"The discriminating question is always <b>when and where</b> the tampering happened. <b>Attacker view:</b> each bucket is a different attacker with different access: a logistics-positioned actor (.003), one who already phished an admin (T1542), one walking your halls (T1200). <b>Defender view:</b> each bucket has a different owner &mdash; procurement, IR, physical security, and IT operations respectively.","study":"Write the one-line discriminator for each of the four buckets on a sticky note."},{"id":"m4","type":"match","title":"Data sources to meaning","summary":"Match each log source to what it reveals","scen":[{"t":"p","x":"You are building the detection plan for hardware supply chain compromise. The candidates are on the left; what each one actually tells you is on the right."}],"q":"Match each log source to the meaning it carries.","lefts":[{"id":"l1","x":"Windows CodeIntegrity log","short":"CodeIntegrity"},{"id":"l2","x":"Linux auditd firmware_update calls","short":"auditd"},{"id":"l3","x":"macOS unified log","short":"macOS ulog"},{"id":"l4","x":"CMDB / asset records","short":"Asset records"}],"rights":[{"id":"r1","x":"Code integrity violations in boot-start drivers or firmware (AN1035)"},{"id":"r2","x":"Firmware change attempts such as firmware_update or kexec_load (AN1036)"},{"id":"r3","x":"EFI firmware integrity check failures and unapproved system extensions (AN1037)"},{"id":"r4","x":"Serial or model mismatches against the vendor scheme at intake"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"},"why":{"l1":"Correct: on Windows, AN1035 reads the CodeIntegrity operational log for boot-start driver and firmware integrity violations.","l2":"Correct: on Linux, AN1036 watches auditd for firmware_update and kexec_load syscalls, plus fwupd logs.","l3":"Correct: on macOS, AN1037 reads the unified log for EFI integrity check failures and pairs it with EndpointSecurity and AMFI events.","l4":"Correct: asset records are not a host log &mdash; they are the intake layer that catches serial and model mismatches before first power-on."},"hint":"AN1035 is Windows, AN1036 is Linux, AN1037 is macOS &mdash; and one source on the right is not a host log at all.","expl":"This is DET0368 as a mapping exercise: one platform per analytic, plus the intake layer that runs before any host telemetry exists. <b>Defender view:</b> if you only collect Windows events, your Linux and Mac fleet is blind to T1195.003 signals &mdash; coverage must match the platform mix. <b>Real-world task:</b> this table is literally a detection engineer&rsquo;s backlog item list.","study":"Confirm which of these three host logs your SIEM actually ingests today."},{"id":"m5","type":"order","title":"Interdiction lifecycle","summary":"Order the four stages of a shipment interdiction attack","scen":[{"t":"p","x":"Public reporting on hardware interdiction operations describes a repeatable lifecycle. The four stage cards fell out of the deck."}],"q":"Order the four stages from first to last.","items":[{"id":"o1","x":"Attacker learns which hardware the target buys and when it ships"},{"id":"o2","x":"Shipment is intercepted in transit"},{"id":"o3","x":"Firmware is modified or a chip is added; the box is repacked"},{"id":"o4","x":"Device is deployed and the implant beacons to attacker infrastructure"}],"correctOrder":["o1","o2","o3","o4"],"why":{"o1":"Correct as stage 1: interdiction needs targeting first &mdash; the attacker must know what to intercept and where.","o2":"Correct as stage 2: the physical interception happens in transit, outside the victim&rsquo;s visibility.","o3":"Correct as stage 3: the tampering itself is quick &mdash; flash firmware or solder a chip &mdash; then repack so seals look original.","o4":"Correct as stage 4: the payoff only arrives when the victim deploys the device and the implant calls home."},"hint":"Knowledge first, physical access second, soldering third, payoff last.","expl":"<b>Attacker view:</b> the hard parts are stages 1 and 2 &mdash; targeting and physical access. Stage 3 is routine for a capable actor. <b>Defender view:</b> stage 4 is your first real signal, which is why beacon detection from management interfaces and firmware baselines at intake matter more than hope. Note the asymmetry: the attacker invests most before you can see anything at all.","study":"For each stage, name one control that would break it &mdash; even a partial one."},{"id":"m6","type":"fill","title":"Procurement policy draft","summary":"Complete the intake policy sentence with four keywords","scen":[{"t":"p","x":"The GRC team drafts the hardware intake policy. Legal approved the sentence below, but the four control keywords were left out. Fill them from the shuffled bank."}],"q":"Fill the four blanks with words from the bank.","parts":[{"t":"x","x":"All network hardware must arrive through the "},{"t":"b","id":"b1"},{"t":"x","x":" delivery channel. On receipt, staff must verify the "},{"t":"b","id":"b2"},{"t":"x","x":" seal is intact, compare the "},{"t":"b","id":"b3"},{"t":"x","x":" number with the vendor record, and record the installed "},{"t":"b","id":"b4"},{"t":"x","x":" hash in the asset register."}],"bank":["approved","tamper-evident","serial","firmware","cheapest","wireless"],"answers":{"b1":"approved","b2":"tamper-evident","b3":"serial","b4":"firmware"},"blankNames":{"b1":"channel","b2":"seal type","b3":"identity check","b4":"recorded hash"},"why":{"b1":"Correct: an <b>approved</b> channel is the contract-backed route that keeps the chain of custody known.","b2":"Correct: <b>tamper-evident</b> seals make interference visible &mdash; that is their entire purpose.","b3":"Correct: the <b>serial</b> number is the unit&rsquo;s identity and is compared against the vendor&rsquo;s records.","b4":"Correct: recording the <b>firmware</b> hash at intake creates the baseline every later check compares against."},"hint":"The four blanks are: which route, which seal, which number, which hash.","expl":"This sentence is a complete intake control in one breath: approved channel, tamper-evident seal, serial verification, firmware hash baseline. <b>Real-world task:</b> GRC analysts turn exactly these four words into supplier contracts and dock procedures. The two decoy words (&lsquo;cheapest&rsquo;, &lsquo;wireless&rsquo;) are the opposite of what the policy needs &mdash; cheapest routes are precisely where interdiction is easiest.","study":"Compare this sentence with your organisation&rsquo;s actual intake policy and note the gaps."},{"id":"m7","type":"terminal","title":"Verify against the checksum file","summary":"Use sha256sum -c to check the vendor checksum file","scen":[{"t":"p","x":"You are on the intake bench. The vendor ships a sidecar checksum file next to every firmware image. The image is <b>fw-switch-3.2.1.img</b>; the sidecar is <b>fw-switch-3.2.1.img.sha256</b> and contains the expected hash and filename."},{"t":"mono","label":"ARTEFACT 1 — SIDECAR FILE CONTENT (fw-switch-3.2.1.img.sha256)","x":"<span class='ok'>9f2c41d0...e81a</span>  fw-switch-3.2.1.img"}],"q":"Type the command that makes <b>sha256sum</b> verify the image automatically against the sidecar checksum file, instead of printing a hash for you to compare by eye.","canonical":"sha256sum -c fw-switch-3.2.1.img.sha256","canonWhy":"<span class='kw'>sha256sum</span> is the tool; <b>-c</b> (&lsquo;check&rsquo;) tells it to read expected hashes from the given file and compare them automatically; <b>fw-switch-3.2.1.img.sha256</b> is the checksum sidecar. The output is a per-file <span class='ok'>OK</span> or <span class='er'>FAILED</span> verdict.","parts":[{"name":"tool","ok":"^sha256sum$","bad":"^md5sum$|^sha1sum$|^shasum$","why":"The vendor sidecar is a SHA-256 file in coreutils format, so sha256sum is the matching tool. shasum would need extra flags and md5/sha1 do not match the published digest."},{"name":"check flag","ok":"^-c$","bad":"","why":"-c switches sha256sum from &lsquo;print a hash&rsquo; to &lsquo;verify against a list&rsquo; &mdash; that is what the question demands."},{"name":"target file","ok":"^fw-switch-3\\.2\\.1\\.img\\.sha256$","bad":"^fw-switch-3\\.2\\.1\\.img$","why":"The argument of -c must be the checksum file (ending .sha256). Passing the .img itself would just print a hash again, with nothing to compare against."}],"dangerous":["flashrom","dd\\s","rm\\s+-rf"],"outputs":[{"m":"^sha256sum\\s+-c\\s+.*\\.sha256","x":"fw-switch-3.2.1.img: OK"},{"m":"^sha256sum\\s+-c","x":"sha256sum: no properly formatted checksum lines found in this simulation"},{"m":"^sha256sum","x":"9f2c41d0aa7be8813f6c22d5a4b7e0f19c8d3a6251bb4c7e90f2d6a381cce81a  fw-switch-3.2.1.img"}],"hint":"You do not want a hash printed for manual comparison &mdash; you want the tool itself to compare. Which single flag does that, and which file does it read?","expl":"<b>Attacker view:</b> manual comparison is where humans slip &mdash; the attacker hopes for a tired engineer who eyeballs two similar strings. <b>Defender view:</b> automation removes the slip: <span class='mono'>-c</span> gives a machine verdict (OK/FAILED) that can be logged and alerted on. If the verdict is FAILED, the file stops there &mdash; never flash it.","study":"Run sha256sum -c on a real sidecar file and see the OK/FAILED output format."},{"id":"m8","type":"mcq","title":"Why the EDR stays quiet","summary":"Why do endpoint tools usually miss hardware implants?","scen":[{"t":"p","x":"After the firmware-drift incident, a manager asks: &ldquo;We pay for EDR on every machine. Why did it say nothing?&rdquo;"}],"q":"Which is the most accurate answer?","options":[{"id":"a","x":"The implant runs before the OS and the EDR agent are loaded, so the agent never sees the earliest stage","why":"Correct: the EDR is a guest of the operating system; firmware code starts before the host does."},{"id":"b","x":"EDR products only watch network port 443","why":"False and too narrow: EDR watches processes, files, drivers &mdash; its gap here is the boot stage, not one port."},{"id":"c","x":"The antivirus licence had expired on that host","why":"A licensing story explains nothing systematic; the gap is architectural."},{"id":"d","x":"Implants hide inside spreadsheet attachments","why":"That is user-malware imagery, not firmware &mdash; and irrelevant to the boot stage."}],"correct":"a","hint":"Draw the power-on sequence and place the EDR agent on the timeline. What starts before it?","expl":"<b>Attacker view:</b> the implant deliberately lives below the EDR&rsquo;s birth moment &mdash; that is the point of the technique. <b>Defender view:</b> the answer is not &lsquo;more endpoint agents&rsquo; but telemetry from the earlier layer: secure boot state, firmware measurements (TPM), and boot logs &mdash; exactly what DET0368 consumes. The manager&rsquo;s question is the best possible opening to ask for boot-integrity telemetry.","study":"Explain to a non-technical colleague why &lsquo;we have EDR&rsquo; is not an answer to hardware implants."},{"id":"m9","type":"logsel","title":"Spot the faulty baseline line","summary":"One line in the hardening baseline weakens boot integrity","scen":[{"t":"mono","label":"ARTEFACT 1 — DRAFT HARDENING BASELINE v0.9 (boot integrity section)","x":"1. Enable UEFI Secure Boot on all endpoints and servers.\n2. Configure TPM-backed measured boot and forward the log to the SIEM.\n3. Set a bootloader/BIOS password on all network gear.\n4. Secure Boot may be disabled on servers to speed up patching windows.\n5. Verify firmware hashes against the vendor baseline at intake."}],"q":"Click the one baseline line that weakens T1195.003 defence, then press Check.","lines":[{"id":1,"x":"1. Enable UEFI Secure Boot on all endpoints and servers."},{"id":2,"x":"2. Configure TPM-backed measured boot and forward the log to the SIEM."},{"id":3,"x":"3. Set a bootloader/BIOS password on all network gear."},{"id":4,"x":"4. Secure Boot may be disabled on servers to speed up patching windows."},{"id":5,"x":"5. Verify firmware hashes against the vendor baseline at intake."}],"correct":[4],"why":{"4":"Correct: disabling Secure Boot removes the control that blocks unsigned bootloaders and firmware &mdash; the exact protection M1046 prescribes. Patching speed is not worth reopening the boot chain.","1":"This line strengthens defence: signed bootloaders only (M1046, &lsquo;Implementation of Secure Boot&rsquo;).","2":"This line strengthens defence: TPM measurements are what make boot changes detectable.","3":"This line strengthens defence: a bootloader password blocks attackers with physical access from flipping boot settings.","5":"This line strengthens defence: the intake hash baseline is the T1195.003 anchor control."},"hint":"Four lines implement M1046; one line quietly removes its centrepiece. Which one would an implant&rsquo;s author write?","expl":"The faulty line trades the boot chain&rsquo;s signature check for patch-window minutes. With Secure Boot off, an unsigned implant bootloader runs freely &mdash; the exact scenario M1046 exists to stop. <b>Spot-the-mistake habit:</b> read hardening baselines as if you were the attacker looking for the one permission that undoes the rest.","study":"Review one hardening baseline in your environment for a line that contradicts another."},{"id":"m10","type":"sim","title":"Triage the firmware-drift alert","summary":"Three triage decisions on a new firewall with drifted firmware","scen":[{"t":"p","x":"You are the on-call SOC analyst. A brand-new firewall generated a firmware-drift alert during intake. Three decisions shape the outcome. Intermediate steps do not stop the timer; the final check does."}],"q":"(shown per step)","steps":[{"id":"s1","label":"Step 1","q":"The alert says firmware 2.4.1 but the vendor baseline for this hardware rev says 2.4.0. First action?","options":[{"id":"o1","x":"Pull the full firmware inventory of the unit and the vendor advisory for this model","correct":true,"outcome":"You now hold the exact build string and the vendor&rsquo;s published range &mdash; the facts you need.","why":"Correct: collect facts before acting; the vendor advisory is the trusted comparison."},{"id":"o2","x":"Reboot the device and see if the version changes","correct":false,"outcome":"The version is the same after reboot, and you have spent 20 minutes learning nothing.","why":"Not correct: rebooting neither verifies nor preserves anything."},{"id":"o3","x":"Open a ticket and move on until someone picks it up","correct":false,"outcome":"The ticket sits. The device waits half-racked and unverified.","why":"Not correct: drift on a not-yet-live device is cheap to check now and expensive to ignore."}]},{"id":"s2","label":"Step 2","q":"Boot logs show Secure Boot disabled and an unsigned module loaded at boot. What now?","options":[{"id":"o1","x":"Keep the device off the network and isolate it on the bench","correct":true,"outcome":"The device is isolated. If an implant exists, it cannot beacon.","why":"Correct: containment while you verify &mdash; the least aggressive action that stops the bleeding."},{"id":"o2","x":"Ignore it; new gear often logs odd things the first week","correct":false,"outcome":"The device joins the network. If the module is an implant, it now has a route out.","why":"Not correct: disabled Secure Boot plus an unsigned module is not &lsquo;odd&rsquo; &mdash; it is the DET0368 alarm pattern."},{"id":"o3","x":"Factory-reset the device immediately","correct":false,"outcome":"The reset wipes evidence. A firmware implant can survive resets anyway.","why":"Not correct: destructive first steps destroy the evidence you will want within the hour."}]},{"id":"s3","label":"Step 3","q":"The vendor answers: this serial number is not from any of their factories. Final call?","options":[{"id":"o1","x":"Treat it as suspected supply-chain compromise; escalate to IR and procurement","correct":true,"outcome":"IR owns the device, procurement opens the chain-of-custody review, and the vendor is asked for the real records.","why":"Correct: a serial the vendor disowns is a supply chain failure &mdash; it now belongs to IR and procurement, not to the SOC alone."},{"id":"o2","x":"Ship it back to the sender and close the ticket","correct":false,"outcome":"The device leaves with your only evidence on board, and the origin question dies with it.","why":"Not correct: returning evidence destroys it; a return is a business action to decide after investigation."},{"id":"o3","x":"Keep it in production but watch it closely","correct":false,"outcome":"A device the vendor disowns is now protecting your network boundary.","why":"Not correct: &lsquo;watch it closely&rsquo; is not containment for a disowned unit."}]}],"hint":"Each step has a pattern: collect facts, contain without destroying, then hand to the owner of that layer.","expl":"<b>Attacker view:</b> the attack succeeded if the device reached production; every hour of delay helps. <b>Defender view:</b> the triage pattern &mdash; verify, contain non-destructively, escalate to the right owner &mdash; turns a scary alert into a controlled case. Note how step 2 rejected both the passive and the destructive option: the correct action is the least aggressive one that stops exposure.","study":"Write the three decisions as a one-page runbook entry for your shift."},{"id":"m11","type":"match","title":"M1046 measures to effects","summary":"Match each M1046 measure to what it actually stops","scen":[{"t":"p","x":"Mitigation <b>M1046 Boot Integrity</b> lists four implementation measures. Match each measure to the attack step it stops."}],"q":"Match each measure to its effect.","lefts":[{"id":"l1","x":"UEFI Secure Boot","short":"Secure Boot"},{"id":"l2","x":"TPM-based attestation","short":"TPM attestation"},{"id":"l3","x":"Bootloader / BIOS password","short":"Boot password"},{"id":"l4","x":"Runtime integrity monitoring","short":"Runtime checks"}],"rights":[{"id":"r1","x":"Blocks an unsigned, malicious bootloader from executing at all"},{"id":"r2","x":"Makes any firmware or bootloader change detectable after the fact"},{"id":"r3","x":"Stops an attacker with physical access from turning boot protections off"},{"id":"r4","x":"Catches modified kernel modules loaded after the boot finished"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"},"why":{"l1":"Correct: Secure Boot verifies signatures before anything runs &mdash; the malicious bootloader never executes (M1046, measure 1).","l2":"Correct: attestation records the boot chain so a modified step is provable (M1046, measure 2).","l3":"Correct: the password protects the settings an attacker with hands on the device would flip (M1046, measure 3).","l4":"Correct: runtime checks cover the post-boot window where modules get swapped (M1046, measure 4)."},"hint":"Two measures act before boot completes, one guards the settings, one acts after boot.","expl":"M1046 is a layered control: prevent unsigned boot (Secure Boot), prove integrity (TPM), guard the switches (password), and watch the running state (runtime checks). <b>Defender view:</b> removing any layer narrows the defence to a single moment &mdash; which is why the faulty baseline line in the previous exercise was so damaging. <b>Attacker view:</b> a capable implant author targets the layer your organisation skipped.","study":"Score your own estate: which of the four measures is deployed, partially deployed, or absent?"},{"id":"m12","type":"multi","title":"Implants versus software backdoors","summary":"Select the true statements about hardware implants","scen":[{"t":"p","x":"A junior engineer wrote four statements about hardware implants for a slide. Some are true, some are not. Select every TRUE statement."}],"q":"Select all true statements.","options":[{"id":"a","x":"They can survive a full OS reinstall because they live in firmware","why":"Correct: reinstalling the OS rewrites the disk, not the chip &mdash; the implant waits for the next boot."},{"id":"b","x":"They persist even when the hard disk is wiped or swapped","why":"Correct: the implant&rsquo;s home is the SPI flash or a chip, so the storage device is irrelevant to its survival."},{"id":"c","x":"They usually require access during manufacturing or shipping","why":"Correct: the defining property of T1195.003 is tampering <b>before delivery</b>, which needs chain access."},{"id":"d","x":"They are always visible to antivirus scans","why":"Not correct: quite the opposite &mdash; they run before AV/EDR loads, which is their main appeal."},{"id":"e","x":"They only work on macOS devices","why":"Not correct: ATT&amp;CK lists Linux, Windows and macOS platforms for this technique &mdash; and network gear besides."}],"correct":["a","b","c"],"hint":"Two statements describe where the implant lives and when it gets there; two describe a world that does not exist.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 3)</span>. The three true statements are the properties that make T1195.003 special: lives in firmware, survives disk operations, and is planted before delivery. The false ones reverse its key trait (visibility to AV) or narrow its platforms. <b>Defender view:</b> these three properties are also why response ends in hardware replacement, not re-imaging.","study":"Add these three true properties to your team&rsquo;s knowledge base page on firmware threats."},{"id":"m13","type":"logsel","title":"Find the two damning lines","summary":"Use the filter to locate the signature failure and the unsigned driver","scen":[{"t":"p","x":"An appliance&rsquo;s boot and attestation log is long. The case hinges on two lines: one shows a firmware signature verification problem, the other shows an unknown driver loading after boot. Use the filter box to find them, then select both."},{"t":"mono","label":"ARTEFACT 1 — APPLIANCE BOOT + ATTESTATION EXPORT (excerpt, 18 lines)","x":"<span class='dm'>(full export available in the log viewer below)</span>"}],"q":"Select the two lines that show (1) a firmware signature verification failure and (2) an unexpected driver loading right after boot.","lines":[{"id":1,"x":"00:00:01 kernel: boot device nvme0n1 online"},{"id":2,"x":"00:00:01 fwupd: firmware database opened"},{"id":3,"x":"00:00:02 secureboot: state=enabled"},{"id":4,"x":"00:00:02 attestation: PCR[0..7] extended"},{"id":5,"x":"00:00:03 firmware: verifying vendor signature for fw-2.4.0"},{"id":6,"x":"00:00:03 firmware: SIGNATURE CHECK FAILED fw-2.4.0 (hash 9f2c..e81a expected)"},{"id":7,"x":"00:00:03 firmware: fallback path taken"},{"id":8,"x":"00:00:04 clock: NTP sync ok"},{"id":9,"x":"00:00:04 net: link up 1G, dhcp ok"},{"id":10,"x":"00:00:05 module: loading signed module nvme_core"},{"id":11,"x":"00:00:05 module: loading signed module crypto_aes"},{"id":12,"x":"00:00:06 module: UNSIGNED module 'fwassist' loaded from unknown source"},{"id":13,"x":"00:00:06 service: sshd started"},{"id":14,"x":"00:00:07 service: webui started"},{"id":15,"x":"00:00:08 snmp: polling enabled"},{"id":16,"x":"00:00:09 backup: schedule loaded"},{"id":17,"x":"00:00:10 audit: policy loaded"},{"id":18,"x":"00:00:11 boot: complete in 11.2s"}],"correct":[6,12],"filter":true,"why":{"6":"Correct: the explicit SIGNATURE CHECK FAILED line for the vendor firmware image is the tamper signal &mdash; the image on flash does not match the vendor&rsquo;s signature.","12":"Correct: an unsigned module from an unknown source loading right after the failed check is DET0368&rsquo;s &lsquo;follow-on execution&rsquo; step &mdash; the implant&rsquo;s helper arriving on stage.","1":"A normal storage line &mdash; noise by design.","2":"Normal fwupd bookkeeping.","3":"Secure Boot enabled is good news, not bad &mdash; note the failed signature check still fired, which the explanation covers.","4":"PCR extensions are normal measured-boot events.","5":"Verification starting is normal; its <b>result</b> on line 6 is the signal.","7":"The fallback path is suspicious in context, but it is a consequence, not one of the two demanded artefacts &mdash; select the failure and the module, not the footnote.","8":"Time sync &mdash; noise.","9":"Network bring-up &mdash; noise.","10":"A <b>signed</b> module loading is the healthy pattern.","11":"Another healthy signed module.","13":"sshd starting is normal on an appliance.","14":"The web UI starting is normal.","15":"SNMP polling is a config fact, not a boot-integrity signal.","16":"Backup schedules are irrelevant here.","17":"Audit policy loading is normal.","18":"A clean boot time &mdash; irony, but noise."},"hint":"Filter on &lsquo;signature&rsquo; first; then filter on &lsquo;module&rsquo; and look for the one without &lsquo;signed&rsquo;.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 2)</span>. Line 6 is the tamper artefact; line 12 is the follow-on artefact. Together they form DET0368&rsquo;s behavioural chain: signature failure first, unknown execution second. One without the other is weaker evidence &mdash; a signature failure alone could be a bad update; an unsigned module alone could be legacy vendor software. <b>Detection-engineering note:</b> this pairing is why the analytic chains signals instead of alerting on each separately.","study":"Try the same filter workflow on a real appliance export and time yourself."},{"id":"m14","type":"order","title":"Audit priority queue","summary":"Rank four devices for firmware audit, most urgent first","scen":[{"t":"p","x":"Budget allows a firmware audit of one device per week. Four devices are due. Rank them by urgency for T1195.003 exposure &mdash; position 1 = audit first."}],"q":"Rank the devices, most urgent first.","items":[{"id":"o1","x":"Internet-facing edge firewall"},{"id":"o2","x":"Domain controller server"},{"id":"o3","x":"Internal office switch"},{"id":"o4","x":"Meeting-room printer"}],"correctOrder":["o1","o2","o3","o4"],"why":{"o1":"Correct at 1: the edge firewall is internet-facing and defends the boundary &mdash; highest exposure and highest impact.","o2":"Correct at 2: the domain controller holds the keys to the Windows estate; huge impact, no direct internet exposure.","o3":"Correct at 3: the office switch moves internal traffic &mdash; real impact, lower exposure than the first two.","o4":"Correct at 4: the printer matters (peripherals are in ATT&amp;CK&rsquo;s scope!) but exposure and impact are the lowest of the four."},"hint":"Two exposure questions per device: can the internet reach it, and how much damage if it lies?","expl":"Prioritisation multiplies a small budget: the same one-hour firmware check catches more risk at the edge than at the printer. <b>Defender view:</b> exposure times impact is the standard ranking logic. <b>Attacker view:</b> an interdiction actor targets exactly the devices at the top of this list &mdash; edge gear ships through more hands and pays more. Remember that ATT&amp;CK&rsquo;s description includes <b>peripherals</b>: &lsquo;last&rsquo; does not mean &lsquo;never&rsquo;.","study":"Apply the ranking to your own device list and write next week&rsquo;s audit order."},{"id":"m15","type":"mcq","title":"DET0368&rsquo;s data diet","summary":"Which telemetry does the detection strategy consume?","scen":[{"t":"p","x":"A vendor claims: &ldquo;Our product detects hardware supply chain compromise using only DNS query logs.&rdquo; You compare that claim with ATT&amp;CK&rsquo;s detection strategy DET0368."}],"q":"Which best describes the data DET0368 actually relies on?","options":[{"id":"a","x":"Boot, firmware and host status telemetry: secure boot state, firmware versions and integrity checks, boot logs, hardware inventory","why":"Correct: DET0368&rsquo;s three analytics (AN1035/36/37) consume host status, code integrity, driver loads, firmware update logs, and EFI integrity events."},{"id":"b","x":"Only process creation events from endpoints","why":"Process telemetry matters elsewhere, but the technique&rsquo;s signals live below the process layer."},{"id":"c","x":"Only DNS query logs from the network","why":"This is the vendor&rsquo;s claim, not DET0368&rsquo;s design &mdash; a DNS-only view cannot see boot-stage tampering."},{"id":"d","x":"Only cloud audit logs of the SaaS consoles","why":"Cloud consoles postdate the boot entirely; they cannot observe firmware."}],"correct":"a","hint":"The signals live at power-on: boot state, firmware checks, inventory. Which option describes that layer?","expl":"DET0368 is host-status-and-boot-centric: AN1035 (Windows: Security 1166/7045, CodeIntegrity, Sysmon 6/7/10), AN1036 (Linux: auditd firmware_update/kexec_load, fwupd), AN1037 (macOS: unified log EFI failures, EndpointSecurity). <b>Vendor-claim lesson:</b> when a product claims to detect a technique, compare its inputs with the technique&rsquo;s actual data sources &mdash; a layer mismatch means a coverage gap.","study":"Pick one analytic (AN1035, AN1036 or AN1037) and check whether its named log sources reach your SIEM."}]};

'use strict';
/* ================= utilities ================= */
function $(s){return document.querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}

/* ================= state ================= */
var S={
  screen:'intro', pos:0, order:[],
  credit:{}, answered:{}, status:{}, hintUsed:{}, skipped:[],
  secondsLeft:0, timerState:'IDLE', tick:null,
  manualPauseSec:0, feedbackPauseSec:0, ovStart:0, ovAccum:0, fbStart:0,
  reported:false, attempt:1,
  user:{name:'',country:'',locale:'en',topicId:'',batch:null,theme:'dark'}
};
var R=null; /* runtime state of the exercise on screen */

/* ================= scoring (partial credit) ================= */
function scoreExercise(selected,correct){
  var N=correct.length; if(N===0)return 0;
  var H=0,W=0,cs={};
  correct.forEach(function(c){cs[c]=1;});
  selected.forEach(function(x){ if(cs[x])H++; else W++; });
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED */
function tSet(next){
  var prev=S.timerState;
  if(prev==='PAUSED_MANUAL' && next!=='PAUSED_MANUAL'){S.manualPauseSec+=(Date.now()-S.ovStart)/1000;}
  if(prev==='PAUSED_AUTO_CHECK' && next!=='PAUSED_AUTO_CHECK'){S.feedbackPauseSec+=(Date.now()-S.fbStart-S.ovAccum)/1000;S.ovAccum=0;}
  if(next==='PAUSED_MANUAL' && prev!=='PAUSED_MANUAL'){S.ovStart=Date.now();}
  if(next==='PAUSED_AUTO_CHECK' && prev!=='PAUSED_AUTO_CHECK'){S.fbStart=Date.now();}
  S.timerState=next; updateHeader();
}
function startTimer(){
  if(S.tick)clearInterval(S.tick);
  S.tick=setInterval(function(){
    if(S.timerState!=='RUNNING')return;
    S.secondsLeft--;
    if(S.secondsLeft<=0){S.secondsLeft=0;updateHeader();timerEnd();return;}
    updateHeader();
  },1000);
  tSet('RUNNING');
}
function timerEnd(){
  if(S.tick)clearInterval(S.tick);
  tSet('ENDED');
  if(S.screen==='exam'||S.screen==='review'){showResults();}
}

/* ================= flow ================= */
function startExam(){
  document.body.setAttribute('data-sev',sevClass());
  S.pos=0;S.credit={};S.answered={};S.status={};S.hintUsed={};S.skipped=[];
  S.secondsLeft=DATA.timerBudget;S.reported=false;
  S.manualPauseSec=0;S.feedbackPauseSec=0;S.ovAccum=0;
  /* clear per-attempt shuffle caches so retakes reshuffle answers too */
  DATA.exercises.forEach(function(e){
    delete e._shuf;delete e._shufR;delete e._shufB;
    if(e.steps)e.steps.forEach(function(st){delete st._shuf;});
  });
  S.order=shuffle(DATA.exercises.map(function(_,i){return i;}));
  /* keep terminal exercises non-adjacent after shuffle */
  for(var i=1;i<S.order.length-1;i++){
    if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])&&isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
  }
  S.screen='exam';startTimer();renderExercise();
}
function isTerm(i){return DATA.exercises[i].type==='terminal';}
function curEx(){return DATA.exercises[S.order[S.pos]];}
function advanceOrFinish(){
  S.pos++;
  if(S.pos>=S.order.length){ if(S.skipped.length>0){renderReview();if(S.timerState!=='ENDED')tSet('RUNNING');} else {showResults();} return;}
  renderExercise();
}
function showChrome(){var h=$('#hdr');if(h)h.classList.remove('hidden');var p=$('#prog');if(p)p.classList.remove('hidden');}
function hideChrome(){var h=$('#hdr');if(h)h.classList.add('hidden');var p=$('#prog');if(p)p.classList.add('hidden');}
function onCheck(){
  if(!R||R.checked)return;
  var res=collect(R);
  var credit=scoreExercise(res.selected,res.correct);
  if(S.hintUsed[R.ex.id])credit=Math.max(0,credit-0.10);
  R.checked=true;R.credit=credit;R.res=res;
  S.credit[R.ex.id]=credit;S.answered[R.ex.id]=true;
  S.status[R.ex.id]=credit>=0.999?'correct':(credit>0?'partial':'incorrect');
  /* an answered exercise never belongs in the skipped pool, whatever path answered it */
  var k=S.skipped.indexOf(R.ex.id);if(k>-1)S.skipped.splice(k,1);
  tSet('PAUSED_AUTO_CHECK');
  lockWidget();renderFeedback();updateHeader();
}
function onNext(){
  if(!R||!R.checked)return;
  if(R.fromReview){renderReview();tSet('RUNNING');return;}
  advanceOrFinish();
  if(S.screen==='exam'&&S.timerState!=='ENDED')tSet('RUNNING');
}
function onSkip(){
  if(S.screen!=='exam'||!R||R.checked)return;
  S.status[R.ex.id]='skipped';
  if(S.skipped.indexOf(R.ex.id)<0)S.skipped.push(R.ex.id);
  advanceOrFinish();
}
function onHint(){
  if(S.screen!=='exam'||!R||R.checked||S.hintUsed[R.ex.id])return;
  S.hintUsed[R.ex.id]=true;
  var hb=$('#hintpanel');if(hb)hb.classList.remove('hidden');
  var b=$('#hintbtn');if(b)b.disabled=true;
}
function onPauseToggle(){
  if(S.screen!=='exam'&&S.screen!=='review')return;
  var ov=$('#pauseov');
  if(ov){ov.remove();if(R&&R._pausedOnAuto){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}return;}
  var keep=R?R.stateName:null;
  if(R&&R.checked&&S.timerState==='PAUSED_AUTO_CHECK'){R._pausedOnAuto=true;}
  var o=el('div','paused-overlay');
  o.id='pauseov';
  o.innerHTML='<div class="p1">&#9208; PAUSED &mdash; manual (press Resume)</div>'+
    '<div class="p2">The exercise is hidden while you take a break. The timer is stopped.</div>';
  var b=el('button','btn primary','&#9654; Resume');
  b.addEventListener('click',function(){o.remove();if(R&&R._pausedOnAuto&&S.timerState==='PAUSED_MANUAL'){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}});
  o.appendChild(b);
  document.body.appendChild(o);
  tSet('PAUSED_MANUAL');
}
function onSubmitAll(){
  showResults();
}

/* ================= site report ================= */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:DATA.meta.topicId,
      batch:DATA.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=DATA.meta.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}

/* ================= handshake ================= */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'en';
  S.user.theme=event.data.theme||'dark'; /* dark-only file: no theme switch */
  var c=$('#candname');
  if(c&&S.user.name)c.textContent='Candidate: '+S.user.name;
});

/* ================= header ================= */
function stateBadge(){
  if(S.timerState==='RUNNING')return '<span class="badge running">&#9654; RUNNING</span>';
  if(S.timerState==='PAUSED_MANUAL')return '<span class="badge paused">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.timerState==='PAUSED_AUTO_CHECK')return '<span class="badge paused">&#8214; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  if(S.timerState==='ENDED')return '<span class="badge ended">&#9632; ENDED</span>';
  return '<span class="badge ended">&#9679; READY</span>';
}
function sevClass(){return {EASY:'easy',MEDIUM:'medium',HARD:'hard','EXTREMELY HARD':'extreme'}[DATA.severity];}
function scoreSummary(){
  var sum=0,n=0;
  Object.keys(S.answered).forEach(function(k){if(S.answered[k]){sum+=S.credit[k]||0;n++;}});
  var pct=n>0?Math.round((sum/n)*100):0;
  return {sum:sum,n:n,pct:pct};
}
function answeredOrSkipped(){var c=0;DATA.exercises.forEach(function(e){if(S.answered[e.id]||S.status[e.id]==='skipped')c++;});return c;}
var HDR_KEY=null;
function updateHeader(){
  var h=$('#hdr');if(!h)return;
  var ss=scoreSummary();
  var checked=R&&R.checked;
  var key=S.screen+'|'+S.pos+'|'+S.timerState+'|'+(checked?'c':'u')+'|'+S.order.length;
  if(key!==HDR_KEY){
    HDR_KEY=key;
    var posTxt;
    if(S.screen==='exam')posTxt='Exercise '+(S.pos+1)+' of '+S.order.length;
    else if(S.screen==='review')posTxt=(R&&R.fromReview&&!checked)?'Reviewing a skipped exercise':'Review skipped exercises';
    else posTxt='&nbsp;';
    var dis=(checked||S.screen!=='exam'&&S.screen!=='review')?' disabled':'';
    h.innerHTML=
      '<div class="hcell"><b>'+posTxt+'</b></div>'+
      '<div class="hcell"><span class="badge '+sevClass()+'">'+esc(DATA.severity)+'</span></div>'+
      '<div class="hcell"><span class="mono-t" id="h-timer">&#9201; '+fmtTime(S.secondsLeft)+'</span> '+stateBadge()+'</div>'+
      '<div class="hcell">Score <span class="score-sum" id="h-score">'+(ss.n>0?fmt1(ss.sum):'0.0')+' / '+ss.n+'</span> <span class="mono-t" id="h-pct">'+ss.pct+'%</span></div>'+
      '<div class="hcell" style="margin-left:auto;display:flex;gap:8px">'+
        '<button id="hintbtn" class="btn small ghost" onclick="onHint()"'+dis+'>&#128161; Hint</button>'+
        '<button class="btn small ghost" onclick="onPauseToggle()">&#9208; Pause</button>'+
        '<button class="btn small ghost" onclick="onSkip()"'+dis+'>&#9888; Skip</button>'+
      '</div>';
  }
  var t=$('#h-timer');if(t)t.innerHTML='&#9201; '+fmtTime(S.secondsLeft);
  var sc=$('#h-score');if(sc)sc.textContent=(ss.n>0?fmt1(ss.sum):'0.0')+' / '+ss.n;
  var pc=$('#h-pct');if(pc)pc.textContent=ss.pct+'%';
  var hb=$('#hintbtn');if(hb&&!checked)hb.disabled=!!(R&&S.hintUsed[R.ex.id]);
  var p=$('#prog-in');
  if(p)p.style.width=(100*answeredOrSkipped()/DATA.exercises.length)+'%';
}

/* ================= intro screen ================= */
function renderIntro(){
  S.screen='intro';hideChrome();
  if(S.tick){clearInterval(S.tick);S.tick=null;}
  var m=DATA.meta;
  var themes=DATA.intro.themes.map(function(t){
    return '<div class="themebox"><h4>'+esc(t.name)+'</h4><ul class="kwlist">'+
      t.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>';
  }).join('');
  var learn=DATA.intro.learn.map(function(p){return '<p>'+p+'</p>';}).join('');
  var types=DATA.intro.types;
  var app=$('#main');
  app.innerHTML=
  '<div class="intro-hero">'+
    '<h1>'+esc(m.title)+'</h1>'+
    '<div class="obj">MITRE ATT&amp;CK object: <b>T1195.003 &mdash; Supply Chain Compromise: Compromise Hardware Supply Chain</b> &middot; a <b>Sub-Technique</b> of T1195, mapped to the <b>Initial Access</b> tactic (TA0001) <span id="candname" class="tag"></span></div>'+
    '<div class="facts">'+
      '<span class="f">&#127919; Severity: <span class="badge '+sevClass()+'">'+esc(DATA.severity)+'</span></span>'+
      '<span class="f">&#128218; Exercises in this file: <b>'+DATA.exercises.length+'</b></span>'+
      '<span class="f">&#9201; Estimated time: <b>'+m.estimatedMinutes+' minutes</b> (timer budget '+fmtTime(DATA.timerBudget)+')</span>'+
      '<span class="f">&#10003; Pass mark: <b>'+m.passMark+'%</b></span>'+
    '</div>'+
  '</div>'+
  '<h2 class="sec"><span class="n">2.</span> What you will learn here</h2>'+
  '<div class="card">'+learn+'</div>'+
  '<h2 class="sec"><span class="n">3.</span> Keywords covered in this exam</h2>'+
  '<div class="card">'+themes+'</div>'+
  '<h2 class="sec"><span class="n">4.</span> How this exam works</h2>'+
  '<div class="card"><ul class="rules">'+

/* ================= results screen ================= */
function showResults(){
  S.screen='results';showChrome();updateHeader();
  if(S.tick)clearInterval(S.tick);
  if(S.timerState!=='ENDED')tSet('ENDED');
  var sum=0,n=0,full=0,part=0,partSum=0,zero=0,skipped=0;
  DATA.exercises.forEach(function(e){
    if(S.answered[e.id]){
      n++;var c=S.credit[e.id]||0;sum+=c;
      if(c>=0.999)full++;else if(c>0){part++;partSum+=c;}else zero++;
    }
  });
  skipped=DATA.exercises.length-n; /* every unanswered exercise (skipped or cut off by the timer) is excluded from the score */
  var pct=n>0?Math.round((sum/n)*100):0;
  var passed=pct>=DATA.meta.passMark;
  if(!S.reported){S.reported=true;reportScore(sum,n);}
  var avg=part>0?(Math.round((partSum/part)*100)/100):0;
  var cand=S.user.name?('<div class="smallnote" style="margin-top:8px">Candidate: '+esc(S.user.name)+'</div>'):'';
  var panel=passed?
    ('<div class="passpanel"><div style="font-size:34px">&#127942;</div><h2 style="margin:6px 0">&#10003; PASS &mdash; certificate earned</h2>'+
     '<p style="max-width:640px;margin:8px auto">You reached '+pct+'% on this '+esc(DATA.severity)+' exam for <b>T1195.003 &mdash; Compromise Hardware Supply Chain</b>. You can now read real hardware supply-chain reports and recognise this technique in your own telemetry.</p>'+cand+'</div>'):
    ('<div class="failpanel"><div style="font-size:34px">&#128542;</div><h2 style="margin:6px 0">&#10007; FAIL &mdash; retake required</h2>'+
     '<p style="max-width:640px;margin:8px auto">You reached '+pct+'%, below the '+DATA.meta.passMark+'% pass mark. Read the feedback from each exercise again, then press Retake. The exercises and answers will be shuffled.</p>'+cand+'</div>');
  var pauseInfo='<p class="smallnote" style="text-align:center">Time paused manually: <b>'+fmtTime(Math.round(S.manualPauseSec))+'</b> &middot; Time spent reviewing feedback (auto-pause): <b>'+fmtTime(Math.round(S.feedbackPauseSec))+'</b></p>';
  $('#main').innerHTML=
    '<div class="res-hero"><div class="smallnote">'+esc(DATA.meta.title)+' &middot; attempt '+S.attempt+'</div>'+
    '<div class="big" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+fmt1(sum)+' / '+n+'</div>'+
    '<div class="pct">final score '+pct+'% &middot; pass mark '+DATA.meta.passMark+'%</div></div>'+
    panel+
    '<div class="resgrid">'+
      '<div class="rescell ok"><div class="num">'+full+'</div><div class="lbl">&#10003; Fully correct</div></div>'+
      '<div class="rescell part"><div class="num">'+part+'</div><div class="lbl">&#10003; Partially correct'+(part>0?' (avg '+avg+')':'')+'</div></div>'+
      '<div class="rescell bad"><div class="num">'+zero+'</div><div class="lbl">&#10007; Fully incorrect</div></div>'+
      '<div class="rescell skip"><div class="num">'+skipped+'</div><div class="lbl">&#9888; Skipped &mdash; excluded</div></div>'+
    '</div>'+
    pauseInfo+
    '<div class="startrow" style="gap:14px">'+
      '<button class="btn primary startbtn" onclick="retake()">&#8635; Retake exam</button>'+
      '<button class="btn ghost" onclick="renderIntro()">&#8962; Back to intro</button>'+
    '</div>';
  window.scrollTo(0,0);
}
function retake(){
  S.attempt++;S.reported=false;
  startExam();
}


/* ================= exercise rendering ================= */
function blockHeader(cls,icon,word,extra){

}

function renderExercise(idx,fromReview){

function toggleScen(){

  else{b.classList.add('hidden');}
}
function optRow(o,letter){
  return '<button class="opt" data-oid="'+o.id+'" onclick="pickOpt(\''+o.id+'\')" aria-pressed="false">'+
    '<span class="olid">'+letter+'.</span><span>'+o.x+'</span><span class="selmark">&#10003; selected</span></button>';
}
function lettersOf(n){var L='ABCDEFGHIJ';return L[n]||String(n+1);}

/* ---------- mcq / multi ---------- */
function buildMCQ(ex){
  var opts=ex._shuf||(ex._shuf=shuffle(ex.options));
  var html=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  if(ex.type==='multi')html='<p class="smallnote">Select all options that apply. Wrong selections subtract.</p>'+html;
  $('#answ').innerHTML=html;
  R.sel=(ex.type==='multi')?{}:null;
}
/* ---------- categorize (drag & drop) ---------- */
function buildCategorize(ex){
  var items=ex._shuf||(ex._shuf=shuffle(ex.items));
  R.place={};R.picked=null;
  var bank='<div class="bank" id="bank" ondragover="ddOver(event)" ondrop="ddDrop(event,\'__bank\')">'+
    '<div class="slot-title">ITEMS TO PLACE <span class="drag-tag">drag &middot; or tap item then tap a slot</span></div><div id="banklist"></div></div>';
  var slots='<div class="slots">'+ex.slots.map(function(s){
    return '<div class="slot" id="slot-'+s.id+'" data-sid="'+s.id+'" tabindex="0" role="button" '+
      'ondragover="ddOver(event)" ondragleave="ddLeave(event)" ondrop="ddDrop(event,\''+s.id+'\')" '+
      'onclick="slotClick(\''+s.id+'\')" onkeydown="slotKey(event,\''+s.id+'\')">'+
      '<div class="slot-title">'+esc(s.label)+'</div><div class="inbank" id="slotlist-'+s.id+'"></div></div>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="ddwrap">'+bank+slots+'</div>';
  drawDD();
}
function drawDD(){
  var ex=R.ex;
  var bankItems=ex._shuf.filter(function(it){return !R.place[it.id];});
  $('#banklist').innerHTML=bankItems.map(function(it){
    return '<button class="bankitem'+(R.picked===it.id?' picked':'')+'" data-iid="'+it.id+'" draggable="true" ondragstart="ddStart(event,\''+it.id+'\')" onclick="itemClick(\''+it.id+'\')">'+(R.picked===it.id?'&#10003; ':'')+esc(it.x)+'</button>';
  }).join('')||'<span class="smallnote">All items placed.</span>';
  ex.slots.forEach(function(s){
    var inv=Object.keys(R.place).filter(function(iid){return R.place[iid]===s.id;});
    $('#slotlist-'+s.id).innerHTML=inv.map(function(iid){
      var it=ex.items.filter(function(x){return x.id===iid;})[0];
      return '<button class="bankitem" data-iid="'+iid+'" draggable="true" ondragstart="ddStart(event,\''+iid+'\')" onclick="itemClick(\''+iid+'\')" title="Click to return to the bank">&#128465; '+esc(it.x)+'</button>';
    }).join('');
  });
}
function itemClick(iid){
  if(!R||R.checked)return;
  if(R.place[iid]){delete R.place[iid];R.picked=null;drawDD();return;}
  R.picked=(R.picked===iid)?null:iid;drawDD();
}
function slotClick(sid){
  if(!R||R.checked)return;
  if(R.picked){
    var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===sid;})[0];
    if(cur)delete R.place[cur];
    R.place[R.picked]=sid;R.picked=null;drawDD();
  }
}
function slotKey(ev,sid){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();slotClick(sid);}}
function ddStart(ev,iid){ev.dataTransfer.setData('text/plain',iid);}
function ddOver(ev){if(R&&R.checked)return;ev.preventDefault();ev.currentTarget.classList.add('over');}
function ddLeave(ev){ev.currentTarget.classList.remove('over');}
function ddDrop(ev,where){
  if(!R||R.checked)return;
  ev.preventDefault();ev.currentTarget.classList.remove('over');
  var iid=ev.dataTransfer.getData('text/plain');if(!iid)return;
  if(where==='__bank'){delete R.place[iid];}
  else{var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===where;})[0];if(cur)delete R.place[cur];R.place[iid]=where;}
  R.picked=null;drawDD();
}
/* ---------- match ---------- */
function buildMatch(ex){
  var rights=ex._shufR||(ex._shufR=shuffle(ex.rights));
  R.pair={};R.pickedLeft=null;
  var L='<div><div class="slot-title">LEFT COLUMN &mdash; tap one</div>'+ex.lefts.map(function(l){
    return '<button class="pairopt" id="pl-'+l.id+'" onclick="pickLeft(\''+l.id+'\')">'+esc(l.x)+'</button>';
  }).join('')+'</div>';
  var Rt='<div><div class="slot-title">RIGHT COLUMN &mdash; then tap its match</div>'+rights.map(function(r){
    return '<button class="pairopt" id="pr-'+r.id+'" onclick="pickRight(\''+r.id+'\')">'+esc(r.x)+'</button>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="pairwrap">'+L+Rt+'</div><div id="pairchips"></div>';
  drawPairs();
}
function pickLeft(id){if(!R||R.checked)return;R.pickedLeft=(R.pickedLeft===id)?null:id;drawPairs();}
function pickRight(id){
  if(!R||R.checked)return;
  if(!R.pickedLeft)return;
  /* several lefts may legitimately map to the same right (many-to-one matching):
     reassigning pickedLeft's pair only, never stealing other lefts' pairs */
  R.pair[R.pickedLeft]=id;R.pickedLeft=null;drawPairs();
}
function unpair(l){if(!R||R.checked)return;delete R.pair[l];drawPairs();}
function drawPairs(){
  var ex=R.ex;
  ex.lefts.forEach(function(l){var p=$('#pl-'+l.id);if(p)p.classList.toggle('picked',R.pickedLeft===l.id);});
  ex.rights.forEach(function(r){var p=$('#pr-'+r.id);if(p)p.classList.remove('picked');});
  $('#pairchips').innerHTML=ex.lefts.filter(function(l){return R.pair[l.id];}).map(function(l){
    var r=ex.rights.filter(function(x){return x.id===R.pair[l.id];})[0];
    return '<div class="pairchip">&#128279; <b>'+esc(l.x)+'</b> &#8594; '+esc(r.x)+
      '<button class="x" onclick="unpair(\''+l.id+'\')" aria-label="Remove pair">&#10007;</button></div>';
  }).join('')||'<div class="smallnote">No pairs yet.</div>';
}
/* ---------- order / rank ---------- */
function buildOrder(ex){
  R.seq=ex._shuf||(ex._shuf=shuffle(ex.items.map(function(i){return i.id;})));
  drawOrder();
}
function drawOrder(){
  var ex=R.ex;
  $('#answ').innerHTML='<div class="ordlist">'+R.seq.map(function(id,i){
    var it=ex.items.filter(function(x){return x.id===id;})[0];
    return '<div class="orditem" draggable="true" ondragstart="ordStart(event,'+i+')" data-i="'+i+'">'+
      '<span class="pos">'+(i+1)+'.</span><span>'+esc(it.x)+'</span>'+
      '<span class="updown"><button onclick="ordMove('+i+',-1)" aria-label="Move up">&#9650;</button>'+
      '<button onclick="ordMove('+i+',1)" aria-label="Move down">&#9660;</button></span></div>';
  }).join('')+'</div><p class="smallnote">Drag rows or use the arrows. Position 1 = first / most important.</p>';
}
function ordMove(i,d){
  if(!R||R.checked)return;
  var j=i+d;if(j<0||j>=R.seq.length)return;
  var t=R.seq[i];R.seq[i]=R.seq[j];R.seq[j]=t;drawOrder();
}
function ordStart(ev,i){ev.dataTransfer.setData('text/plain',String(i));R._dragI=i;
  var n=ev.currentTarget;n.classList.add('dragging');}
document.addEventListener('dragend',function(ev){if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove('dragging');});
document.addEventListener('dragover',function(ev){
  if(!R||R.checked||R._dragI===undefined)return;
  var t=ev.target.closest?ev.target.closest('.orditem'):null;if(!t)return;
  ev.preventDefault();
  var j=parseInt(t.getAttribute('data-i'),10);
  if(j===R._dragI)return;
  var seq=R.seq,id=R.seq[R._dragI];
  seq.splice(R._dragI,1);seq.splice(j,0,id);
  R._dragI=j;drawOrder();
});
/* ---------- fill ---------- */
function buildFill(ex){
  R.blank={};R.selBlank=null;
  var line=ex.parts.map(function(p){
    if(p.t==='x')return '<span>'+p.x+'</span>';
    return ' <button class="blank" id="bl-'+p.id+'" data-bid="'+p.id+'" onclick="blankClick(\''+p.id+'\')">&#8230;</button> ';
  }).join('');
  var bank=ex._shufB||(ex._shufB=shuffle(ex.bank));
  $('#answ').innerHTML='<div class="fillline">'+line+'</div>'+
    '<div class="bankrow">'+bank.map(function(t){return '<button class="chip" id="ch-'+b32(t)+'" onclick="chipClick(\''+esc(t)+'\')">'+esc(t)+'</button>';}).join('')+'</div>'+
    '<p class="smallnote">Tap a word, then tap a blank. Tap a filled blank to empty it again.</p>';
}
function b32(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))&0xfffff;}return h.toString(32);}
function blankClick(bid){
  if(!R||R.checked)return;
  if(R.blank[bid]){delete R.blank[bid];drawBlanks();return;}
  R.selBlank=bid;
  document.querySelectorAll('.blank').forEach(function(b){b.classList.toggle('picked',b.getAttribute('data-bid')===bid);});
}
function chipClick(tok){
  if(!R||R.checked)return;
  var ex=R.ex;
  var bid=R.selBlank||Object.keys(ex.answers).filter(function(k){return !R.blank[k];})[0];
  if(!bid)return;
  R.blank[bid]=tok;R.selBlank=null;drawBlanks();
}
function drawBlanks(){
  var ex=R.ex;
  Object.keys(ex.answers).forEach(function(bid){
    var b=$('#bl-'+bid);if(!b)return;
    var v=R.blank[bid];
    b.innerHTML=v?esc(v):'&#8230;';
    b.classList.toggle('filled',!!v);
    b.classList.toggle('picked',R.selBlank===bid);
  });
  ex.bank.forEach(function(t){
    var c=$('#ch-'+b32(t));if(!c)return;
    var used=Object.keys(R.blank).some(function(k){return R.blank[k]===t;});
    c.classList.toggle('used',used);
  });
}
/* ---------- terminal ---------- */
function buildTerminal(ex){
  R.lines=[];R.lastCmd='';
  var syn='';
  if(ex.syntax){
    syn='<div class="synpanel"><h5>SYNTAX REMINDER</h5><div class="mono">'+ex.syntax.shape+'</div>'+
      '<ul class="rules" style="margin:8px 0 4px">'+ex.syntax.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>'+
      '<p class="smallnote">Example on a different file: <span class="mono" style="padding:2px 6px">'+ex.syntax.example+'</span></p>'+
      '<p class="smallnote">Expected output shape: <span class="mono" style="padding:2px 6px">'+ex.syntax.outshape+'</span></p></div>';
  }
  $('#answ').innerHTML=syn+
    '<div class="term"><div class="term-scroll" id="tscroll"></div>'+
    '<div class="term-inrow"><span class="pr">analyst@lab:~$</span>'+
    '<input class="term-input" id="tin" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" aria-label="terminal input"></div></div>'+
    '<p class="smallnote">Type the command, press Enter, then press Check. Nothing real is executed &mdash; this is a simulation.</p>';
  $('#tin').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){var v=this.value;this.value='';runCmd(v);}
  });
  termOut('<span class="dm">simulation shell &mdash; only the commands relevant to this exercise are available</span>');
}
function normCmd(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
function runCmd(raw){
  var ex=R.ex,c=normCmd(raw);
  R.lines.push({in:raw});
  if(c===''){drawTerm();return;}
  R.lastCmd=raw;
  var out=null;
  if(ex.outputs){ex.outputs.forEach(function(o){if(out===null&&new RegExp(o.m).test(c))out=o.x;});}
  if(out===null){
    if(/^(clear|cls)$/.test(c)){R.lines=[];drawTerm();return;}
    var bin=c.split(' ')[0];
    out='sh: command not found: '+bin+'  <span class="dm">(this simulation only knows the commands needed here)</span>';
  }
  R.lines.push({out:out});
  drawTerm();
}
function termOut(html){R.lines.push({out:html});drawTerm();}
function drawTerm(){
  var t=$('#tscroll');if(!t)return;
  t.innerHTML=R.lines.map(function(l){
    if(l.in!==undefined)return '<div class="term-line"><span class="pr">analyst@lab:~$</span> <span class="in">'+esc(l.in)+'</span></div>';
    return '<div class="term-line"><span class="out">'+l.out+'</span></div>';
  }).join('')+'\n';
  t.scrollTop=t.scrollHeight;
}
/* ---------- logsel ---------- */
function buildLogsel(ex){
  R.sel={};
  var filt=ex.filter?'<input class="logfilter" id="logf" placeholder="filter lines (text match)..." aria-label="filter log lines">':'';
  $('#answ').innerHTML=filt+'<div class="logbox" id="logbox"></div>'+
    '<p class="smallnote">Click a line to select it. Click again to deselect.'+(ex.filter?' The filter box only narrows the view &mdash; it does not change your selection.':'')+'</p>';
  drawLog();
  if(ex.filter){$('#logf').addEventListener('input',function(){drawLog(this.value);});}
}
function drawLog(f){
  var ex=R.ex;
  f=(f||'').toLowerCase();
  $('#logbox').innerHTML=ex.lines.map(function(l){
    var show=!f||l.x.toLowerCase().indexOf(f)>-1;
    return '<div class="logline'+(R.sel[l.id]?' sel':'')+(show?'':' off')+'" data-lid="'+l.id+'" role="checkbox" aria-checked="'+(!!R.sel[l.id])+'" tabindex="0" onclick="lineSel(\''+l.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lineSel(\''+l.id+'\');}">'+
      '<span class="lnum">'+l.id+'</span><span class="selmark" style="display:'+(R.sel[l.id]?'inline':'none')+'">&#10003;</span><span class="mono" style="background:none;border:none;padding:0;white-space:pre-wrap">'+esc(l.x)+'</span></div>';
  }).join('');
}
function lineSel(id){
  if(!R||R.checked)return;
  if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
  var n=document.querySelector('.logline[data-lid="'+id+'"]');
  if(n){n.classList.toggle('sel',!!R.sel[id]);n.setAttribute('aria-checked',!!R.sel[id]);
    var m=n.querySelector('.selmark');if(m)m.style.display=R.sel[id]?'inline':'none';}
}
/* ---------- sim (multi-step) ---------- */
function buildSim(ex){
  R.stepIdx=0;R.choices={};R.log=[];
  drawStep();
}
function drawStep(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  $('#scenbody').innerHTML=ex.scen.map(artefactHtml).join('')+
    (R.log.length?'<div class="caselog">'+R.log.map(function(l){return '<div class="cl">'+l+'</div>';}).join('')+'</div>':'');
  var qblock=document.querySelector('.block.amb .bc');
  qblock.innerHTML='<span class="steps-tag">STEP '+(R.stepIdx+1)+' OF '+ex.steps.length+'</span><br><b>'+st.q+'</b>';
  var opts=st._shuf||(st._shuf=shuffle(st.options));
  $('#answ').innerHTML=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  document.querySelector('#actrow .smallnote').textContent='Intermediate steps do not stop the timer. The timer pauses only on the final Check.';
  var cb=$('#checkbtn');cb.disabled=true;cb.title='Available on the final step';
  document.getElementById('scenh').querySelector('.sub').textContent=ex.summary;
  window.scrollTo(0,0);
}
function pickSim(id){
  if(!R||R.checked)return;
  R._curChoice=id;
  document.querySelectorAll('#answ .opt').forEach(function(n){
    var on=n.getAttribute('data-oid')===id;
    n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
  });
  var cb=$('#checkbtn');
  if(R.stepIdx===R.ex.steps.length-1){cb.disabled=false;cb.innerHTML='&#10003; Check final answers';cb.title='';}
  else{cb.disabled=false;cb.innerHTML='&#10145; Confirm &amp; continue';cb.title='';}
}
function simConfirm(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  var opt=st.options.filter(function(o){return o.id===R._curChoice;})[0];
  if(!opt)return;
  R.choices[st.id]=R._curChoice;
  R.log.push('<b>Step '+(R.stepIdx+1)+':</b> '+opt.outcome);
  if(R.stepIdx<ex.steps.length-1){
    R.stepIdx++;drawStep();
    var cb=$('#checkbtn');cb.innerHTML='&#10003; Check';cb.disabled=true;
  }else{
    onCheck();
  }
}
function pickOpt(id){
  if(!R||R.checked)return;
  if(R.ex.type==='sim'){pickSim(id);return;}
  var ex=R.ex;
  if(ex.type==='mcq'){
    R.sel=id;
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=n.getAttribute('data-oid')===id;
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }else{
    if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=!!R.sel[n.getAttribute('data-oid')];
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }
}

/* ================= widget builder ================= */
function buildWidget(ex){
  if(ex.type==='mcq'||ex.type==='multi')buildMCQ(ex);
  else if(ex.type==='categorize')buildCategorize(ex);
  else if(ex.type==='match')buildMatch(ex);
  else if(ex.type==='order')buildOrder(ex);
  else if(ex.type==='fill')buildFill(ex);
  else if(ex.type==='terminal')buildTerminal(ex);
  else if(ex.type==='logsel')buildLogsel(ex);
  else if(ex.type==='sim'){buildSim(ex);document.getElementById('checkbtn').onclick=function(){if(R&&!R.checked)simConfirm();};}
}

/* ================= collectors ================= */
function collect(R){
  var ex=R.ex,res={selected:[],correct:[],items:[]};
  if(ex.type==='mcq'){
    res.selected=R.sel?[R.sel]:[];
    res.correct=[ex.correct];
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    if(R.sel===ex.correct){res.items.push({name:'Answer',state:'ok',note:co.why});}
    else{
      var wo=R.sel?ex.options.filter(function(o){return o.id===R.sel;})[0]:null;
      if(wo)res.items.push({name:'Your pick',state:'wrong',note:wo.why});
      res.items.push({name:'Correct',state:'missed',note:co.why});
    }
  }else if(ex.type==='multi'){
    res.selected=Object.keys(R.sel);
    res.correct=ex.correct;
    ex.options.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>-1,isS=!!R.sel[o.id];
      if(isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'ok',note:o.why});
      else if(isC&&!isS)res.items.push({name:o.id.toUpperCase(),state:'missed',note:o.why});
      else if(!isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'wrong',note:o.why});
    });
  }else if(ex.type==='categorize'){
    ex.slots.forEach(function(s){
      var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];
      var good=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];
      if(!iid){res.items.push({name:s.label,state:'missed',note:s.why});}
      else if(iid===good){
        res.items.push({name:s.label,state:'ok',note:s.why});
        res.selected.push(s.id+'='+iid);res.correct.push(s.id+'='+good);
      }else{
        res.items.push({name:s.label,state:'wrong',note:s.why+' The item you placed there belongs elsewhere.'});
        res.selected.push(s.id+'='+iid);
      }
      if(good)res.correct.push(s.id+'='+good);
    });
    res.correct=ex.slots.map(function(s){var g=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];return g?s.id+'='+g:null;}).filter(Boolean);
    res.selected=ex.slots.map(function(s){var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];return iid?s.id+'='+iid:null;}).filter(Boolean);
  }else if(ex.type==='match'){
    ex.lefts.forEach(function(l){
      var p=R.pair[l.id];
      var corr=ex.correct[l.id];
      if(!p){res.items.push({name:l.short,state:'missed',note:ex.why[l.id]});}
      else{
        res.selected.push(l.id+'='+p);
        if(p===corr){res.items.push({name:l.short,state:'ok',note:ex.why[l.id]});}
        else{res.items.push({name:l.short,state:'wrong',note:ex.why[l.id]});}
      }
      res.correct.push(l.id+'='+corr);
    });
  }else if(ex.type==='order'){
    ex.correctOrder.forEach(function(id,i){
      var placed=R.seq[i];
      res.selected.push(i+'='+placed);res.correct.push(i+'='+id);
      if(placed===id)res.items.push({name:'Position '+(i+1),state:'ok',note:ex.why[id]});
      else res.items.push({name:'Position '+(i+1),state:'wrong',note:ex.why[id]});
    });
  }else if(ex.type==='fill'){
    Object.keys(ex.answers).forEach(function(bid){
      var raw=R.blank[bid]||'';
      var v=raw.trim().toLowerCase();
      var a=ex.answers[bid].trim().toLowerCase();
      res.correct.push(bid+'='+a);
      var nm='Blank: '+(ex.blankNames&&ex.blankNames[bid]||bid);
      if(raw.trim()!==''){
        res.selected.push(bid+'='+v);
        res.items.push({name:nm,state:v===a?'ok':'wrong',note:ex.why[bid]});
      }else{
        /* an untouched blank was never answered: it is missed, never wrong */
        res.items.push({name:nm,state:'missed',note:ex.why[bid]});
      }
    });
  }else if(ex.type==='terminal'){
    var c=normCmd(R.lastCmd||'');
    var toks=c?c.split(' '):[];
    function tokTest(rx){var re=new RegExp(rx);return toks.some(function(t){return re.test(t);});}
    function fullTest(rx){var re=new RegExp(rx);return re.test(c);}
    var danger=(ex.dangerous||[]).some(function(d){return new RegExp(d).test(c);});
    R._danger=danger;
    ex.parts.forEach(function(p,i){
      var test=(p.mode==='full')?fullTest:tokTest;
      var ok=c&&test(p.ok)&&!(p.bad&&test(p.bad));
      var bad=c&&p.bad&&test(p.bad);
      if(ok){res.selected.push('e'+i);res.items.push({name:p.name,state:'ok',note:p.why});}
      else if(bad){res.selected.push('w'+i);res.items.push({name:p.name,state:'wrong',note:p.why+' What you typed fails this part.'});}
      else{res.items.push({name:p.name,state:'missed',note:p.why});}
      res.correct.push('e'+i);
    });
    if(!c){res.items=res.items.map(function(it){return {name:it.name,state:'missed',note:it.note};});}
  }else if(ex.type==='logsel'){
    res.selected=Object.keys(R.sel);res.correct=ex.correct;
    ex.lines.forEach(function(l){
      if(ex.correct.indexOf(l.id)>-1){
        var st=R.sel[l.id]?'ok':'missed';
        res.items.push({name:'Line '+l.id,state:st,note:ex.why[l.id]});
      }else if(R.sel[l.id]){
        res.items.push({name:'Line '+l.id,state:'wrong',note:ex.why[l.id]});
      }
    });
  }else if(ex.type==='sim'){
    ex.steps.forEach(function(st){
      var ch=R.choices[st.id];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      res.correct.push(st.id+'='+corr.id);
      if(!ch){res.items.push({name:st.label,state:'missed',note:corr.why});}
      else{
        res.selected.push(st.id+'='+ch);
        var o=st.options.filter(function(x){return x.id===ch;})[0];
        res.items.push({name:st.label,state:ch===corr.id?'ok':'wrong',note:ch===corr.id?o.why:(corr.why+' '+o.why)});
      }
    });
  }
  return res;
}

/* ================= lock & feedback ================= */
function lockWidget(){
  var a=$('#answ');if(a)a.classList.add('locked');
  a.querySelectorAll('button,input').forEach(function(n){n.disabled=true;});
  var cb=$('#checkbtn');if(cb){cb.disabled=true;}
}
function renderFeedback(){
  var ex=R.ex,res=R.res,credit=R.credit;
  var label,state,cls;
  if(credit>=0.999){label='&#10003; CORRECT';state='Correct';cls='correct';}
  else if(credit>0){label='&#10003; PARTIALLY CORRECT';state='Partially correct';cls='partial';}
  else{label='&#10007; INCORRECT';state='Incorrect';cls='incorrect';}
  var multi=ex.type!=='mcq';
  var html='<div class="fb '+cls+'" role="status">'+
    '<div class="fb-title '+cls+'">'+label+
    '<span class="fb-credit">credit '+credit.toFixed(2)+(multi?' &middot; '+Math.round(credit*res.correct.length)+'/'+res.correct.length+' items':'')+'</span></div>';
  if(R._danger)html+='<div class="fb-title incorrect" style="margin-top:8px;font-size:14px">&#10007; DANGEROUS &mdash; NEAR MISS: this command would have destroyed or altered evidence. Always preserve before you clean.</div>';
  if(multi){
    html+=res.items.map(function(it){
      var ic=it.state==='ok'?'&#10003;':(it.state==='wrong'?'&#10007;':'&#9675;');
      var st=it.state==='ok'?'Correct':(it.state==='wrong'?'Wrong':'Missed');
      return '<div class="fb-item '+it.state+'"><span class="ic">'+ic+'</span><span class="nm">'+esc(it.name)+' &mdash; '+st+'</span><span class="nt">'+it.note+'</span></div>';
    }).join('');
  }else{
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    html+='<div class="fb-item ok"><span class="ic">&#10003;</span><span class="nm">Correct answer</span><span class="nt">'+co.x+'</span></div>';
  }
  if(ex.type==='terminal'){
    html+='<div style="margin-top:10px"><div class="arte-label" style="border-radius:6px 6px 0 0">CANONICAL COMMAND</div><div class="mono">'+esc(ex.canonical)+'</div></div>';
    html+='<p class="smallnote" style="margin-top:6px">'+ex.canonWhy+'</p>';
  }
  html+='<div class="fb-exp"><b>Why:</b> '+ex.expl+'</div>';
  if(credit<0.999)html+='<div class="fb-study"><b>What to study:</b> '+ex.study+'</div>';
  html+='</div>';
  var last=(S.pos>=S.order.length-1);
  var nextLbl=R.fromReview?'&#8617; Return to skipped list':(last?'&#10003; Final Submit':'Next &#10145;');
  html+='<div class="startrow"><button class="btn primary" onclick="onNext()">'+nextLbl+'</button></div>';
  $('#fbzone').innerHTML=html;
  var ab=$('#actrow');if(ab)ab.classList.add('hidden');
}

renderIntro();
</script>
