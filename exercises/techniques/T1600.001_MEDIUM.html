<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
  /* derived tints & constants — every rule below consumes variables only */
  --surface-hover:#182238;
  --topbar-bg:rgba(18,26,46,.97);
  --overlay:rgba(11,16,32,.96);
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --shadow-lg:0 8px 22px rgba(0,0,0,.45);
  --sheen:rgba(230,236,255,.35);
  --tint-blue:rgba(90,169,255,.10);
  --tint-blue-strong:rgba(90,169,255,.25);
  --tint-blue-weak:rgba(90,169,255,.12);
  --tint-blue-faint:rgba(90,169,255,.06);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);
  --tint-orange-badge:rgba(255,138,61,.12);
  --tint-red:rgba(255,107,107,.08);
  --tint-red-faint:rgba(255,107,107,.07);
  --tint-red-badge:rgba(255,107,107,.12);
  --tint-red-hero:rgba(255,107,107,.12);
  --tint-purple:rgba(157,123,255,.07);
  --ring-green:0 0 0 2px rgba(87,211,140,.35);
  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;
  --tok-num:#7fd8ff;
  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}
.intro-hero .objline{color:var(--text-secondary);font-size:15px;margin:2px 0}
.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.themebox h4{margin:0 0 8px 0;color:var(--accent-blue);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.themebox ul{margin:0;padding-left:18px;color:var(--text-primary);font-size:14.5px}
.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}
.rulelist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);color:var(--text-primary);font-size:15px;align-items:flex-start}
.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

/* ---------- review & results ---------- */
.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.resultgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1600.001","name":"Weaken Encryption: Reduce Key Space","type":"Sub-Technique","parent":"T1600","tactic":"Defense Impairment (TA0112)","platforms":"Network Devices"},"learn":["This object is a sub-technique. In the MITRE ATT&CK framework, a sub-technique describes one specific way that an attacker can carry out a broader technique. This one belongs to the parent technique T1600, Weaken Encryption. Its job is simple to say: the attacker makes the encryption on a compromised network device weaker, so that cracking the traffic later becomes much cheaper.","Imagine you are a network security engineer at a rail company. Your VPN gateway encrypts traffic with strong, long keys. An attacker who has stolen a management password logs in and changes the key size from thousands of bytes down to a couple of bytes, or swaps a modern cipher for an old, weak one. The device still 'works', so nobody notices — but the attacker can now decrypt everything they capture. That is exactly what T1600.001 describes.","You will meet this object in real work as a SOC analyst (strange crypto config alerts), as a detection engineer (building analytics like ATT&CK detection strategy DET0243 and its analytic AN0681), as an incident responder (deciding how to contain a gateway without destroying evidence), and as a GRC or control owner (writing crypto policy, change control, and backup rules). Tools you will touch: device CLI, configuration archives, firmware records, and traffic analysers that show which ciphers are actually negotiated.","The ATT&CK page for T1600.001 notes that it cannot be easily mitigated with preventive controls, because the attacker abuses normal device features. So defenders lean on configuration change logs, firmware integrity, restricted management access, and traffic analysis. The risks it addresses are unauthorized disclosure of sensitive traffic and follow-on attacks like credential theft. ATT&CK places it in the Defense Impairment tactic (TA0112), on the Network Devices platform. The page references documented attacks on Cisco IOS devices and on legacy devices — old gear with weak defaults is a favourite target."],"kw":["crypto","isakmp","ipsec","transform-set","aes","3des","sha","md5","rsa","tunnel","esp","pre-share","show","write","reload","erase","copy","verify","archive","interface","access-list","permit","deny"],"themes":[{"name":"Adversary behaviour & TTPs","concepts":["shrink the key size the device uses","downgrade to legacy ciphers","pre-position for decrypting captured traffic"]},{"name":"Tactics & lifecycle position","concepts":["enables Credential Access and Collection","unauthorized disclosure risk"]},{"name":"Key space & cipher fundamentals","concepts":["key space","key length in bits and bytes","brute-force cost","legacy vs strong ciphers (3DES vs AES-256)","entropy"]},{"name":"Network device CLI & configuration","concepts":["crypto config commands","firmware images"]},{"name":"Data sources & telemetry","concepts":["device configuration logs","CLI command logs","firmware change records","traffic analysis of negotiated ciphers"]},{"name":"Detection logic & analytics","concepts":["DET0243 detection strategy","AN0681 analytic","downgraded algorithms","key length parameter changes","correlation of config change + weaker ciphers","confidence level","unexpected key management file updates"]},{"name":"Mitigations & control limits","concepts":["no easy preventive control (abuse of system features)","config integrity monitoring","trusted image verification","restricted management access","management network segmentation"]},{"name":"Framework mappings & real work","concepts":["NIST CSF PR.DS-2 data-in-transit","ISO/IEC 27001 A.8.24 use of cryptography","IR evidence handling"]}],"exercises":[{"id":"T1600-001-M01","type":"logview","title":"Read the config diff","summary":"Before/after diff on vpn-hub-02 — what moved and why it matters.","concepts":["device configuration logs","shrink the key size the device uses","downgrade to legacy ciphers"],"perspective":"defender","tags":[],"logTitle":"vpn-hub-02 config diff (TACACS export)","filterPlaceholder":"filter diff lines...","multi":false,"log":["--- backup-2026-09-14.cfg","+++ running-config 2026-10-02 03:12:07","@@ crypto section @@","- crypto isakmp policy 10","-  encryption aes 256","-  group 14","-  lifetime 86400","+ crypto isakmp policy 10","+  encryption 3des","+  group 2","+  lifetime 86400","@@ end @@"],"options":[{"t":"ISAKMP policy 10 was downgraded from AES-256/group 14 to 3DES/group 2","correct":true,"why":"Correct — the diff shows exactly the T1600.001 change: strong cipher and big DH group replaced by weak ones."},{"t":"The tunnel lifetime was shortened from 86400 to 3600","correct":false,"why":"The lifetime line is unchanged at 86400 — a near-miss if you skim the diff header only."},{"t":"A new ISAKMP policy 20 was added next to policy 10","correct":false,"why":"No policy 20 appears; the diff modifies policy 10 in place."},{"t":"The pre-shared key was rotated as part of the change","correct":false,"why":"Nothing in the diff touches authentication keys — only encryption and group."}],"question":"Read the diff and choose the statement that correctly describes the change.","hint":"Focus on the lines with a minus sign versus a plus sign — what replaced what.","explain":"The minus lines are the old strong settings (AES-256, group 14); the plus lines are weak replacements (3DES, group 2). A config diff like this is the primary evidence for a T1600.001 change.","study":"Reading unified diffs of router configs, and DH group sizes (group 2 vs group 14).","scenario":[{"label":"ARTEFACT 1 — vpn-hub-02 config diff (TACACS export)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Before/after diff on vpn-hub-02 — what moved and why it matters. Use the filter box to narrow the lines before answering."}]},{"id":"T1600-001-M02","type":"mcq","title":"Why 3DES helps the attacker","summary":"The concrete cryptographic reason a 3DES downgrade is valuable.","concepts":["legacy vs strong ciphers (3DES vs AES-256)","brute-force cost"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Analyst note","kind":"text","text":"An attacker moved a VPN gateway from AES-256 to 3DES and now captures tunnel traffic. A junior asks why 3DES matters if it still encrypts the data."}],"question":"Which explanation gives the real cryptographic reason?","options":[{"t":"3DES has a small effective key space, so offline cracking becomes practical","correct":true,"why":"Correct — 3DES offers only about 112 effective bits and is deprecated; cracking cost drops massively versus AES-256."},{"t":"3DES removes all encryption, so traffic is plaintext","correct":false,"why":"3DES still encrypts — disabling encryption entirely is the sibling technique T1600.002, not this."},{"t":"3DES compresses the traffic, making capture easier","correct":false,"why":"Ciphers do not compress; this confuses encryption with bandwidth tricks."},{"t":"3DES makes the tunnel invisible to the IDS","correct":false,"why":"Cipher choice does not hide traffic from an IDS — the IDS still sees the packets."}],"hint":"Think about how many keys a code-breaker would have to try — and how that number changed.","explain":"AES-256's key space is astronomically large; 3DES's effective key space is small enough for well-funded attackers to brute force offline. That gap is the whole point of T1600.001.","study":"Effective key length of 3DES vs AES-256, and NIST's deprecation of 3DES."},{"id":"T1600-001-M03","type":"multi","title":"Corroborate the downgrade","summary":"Which telemetry pairs with the config change to raise confidence (AN0681).","concepts":["correlation of config change + weaker ciphers","traffic analysis of negotiated ciphers","CLI command logs","confidence level"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Analytic AN0681 (extract)","kind":"text","text":"Suspicious indicators include configuration changes that downgrade encryption algorithms or key length parameters. Correlation across device config logs and traffic analysis showing weaker ciphers provides higher confidence of malicious key space reduction."},{"label":"ARTEFACT 2 — Evidence shelf","kind":"text","text":"You already have the config diff. Choose every additional source that genuinely raises confidence."}],"question":"Select all the evidence sources that corroborate a malicious key-space reduction.","options":[{"t":"The CLI session log showing the crypto commands entered","correct":true,"why":"Correct — CLI command logs show who typed the crypto change and from where."},{"t":"Traffic capture showing the tunnel now negotiating 3DES","correct":true,"why":"Correct — AN0681 explicitly pairs config changes with weaker ciphers seen in traffic."},{"t":"The firmware image checksum changing the same night","correct":true,"why":"Correct — attackers often pair this with Modify System Image (T1601); a checksum shift is a strong corroboration."},{"t":"The vending machine purchase log","correct":false,"why":"Physical-world purchase logs have no bearing on device crypto."},{"t":"A marketing newsletter send report","correct":false,"why":"Unrelated business telemetry — noise in the queue, not evidence."}],"hint":"AN0681 wants sources that show the change, the actor, and the effect — not business data.","explain":"CLI logs (the actor), negotiated-cipher traffic (the effect), and firmware checksums (the paired tampering) all raise confidence. Unrelated corporate logs only add noise.","study":"Detection strategy DET0243 for T1600.001 and its correlation logic."},{"id":"T1600-001-M04","type":"branch","title":"Triage the crypto-change alert","summary":"Three decisions from alert to verified incident.","concepts":["device configuration logs","correlation of config change + weaker ciphers","restricted management access"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Alert SEC-4417","kind":"text","text":"03:12 — vpn-hub-02 crypto policy changed. Config backup diff available. Work on it as the on-call analyst."}],"question":"Work through the three triage decisions and choose the best option at each step.","steps":[{"text":"Step 1 — The alert fired at 03:12. What is your first verification move?","options":[{"t":"Pull the config archive diff for the change window","correct":true,"why":"Correct — the diff is the fastest authoritative record of what changed.","outcome":"The diff confirms ISAKMP policy 10 moved from AES-256 to 3DES at 03:12.","outcomeBad":false},{"t":"Reboot the VPN gateway to clear any tampering","correct":false,"why":"Rebooting first destroys volatile evidence and interrupts the rail network.","outcome":"The reboot succeeds; the config change remains, but session evidence is gone.","outcomeBad":true},{"t":"Email the whole company asking about the change","correct":false,"why":"A company-wide mail tips off any insider and slows you down.","outcome":"The mail thread grows noisy; nobody claims the change.","outcomeBad":true}]},{"text":"Step 2 — The diff shows AES-256 downgraded to 3DES. What do you correlate next?","options":[{"t":"Check who held the CLI session and from which source IP","correct":true,"why":"Correct — attribution of the session is the second idea in the analytic: actor + change.","outcome":"The session came from 10[.]20[.]5[.]44 — a jump host not used by the network team.","outcomeBad":false},{"t":"Check the canteen menu for tonight","correct":false,"why":"Unrelated noise; do not spend triage time on it.","outcome":"Pasta. Meanwhile the attacker session context stays unknown.","outcomeBad":true},{"t":"Check next quarter's browser rollout plan","correct":false,"why":"End-user browser plans have no link to device crypto.","outcome":"No link found — time lost during an active incident.","outcomeBad":true}]},{"text":"Step 3 — The session came from an unknown jump host. What is the proportionate next move?","options":[{"t":"Escalate to the IR lead with the diff and session evidence attached","correct":true,"why":"Correct — a confirmed downgrade from an unknown host is an incident; escalate with evidence.","outcome":"IR lead opens the case, contains the management access, and preserves the evidence.","outcomeBad":false},{"t":"Delete the changed policy yourself to restore strength","correct":false,"why":"Editing configs mid-incident without change control can break the tunnel and destroys the changed state as evidence.","outcome":"The tunnel flaps; the original state is now harder to reconstruct.","outcomeBad":true},{"t":"Wait a week for the monthly review to discuss it","correct":false,"why":"This is an active compromise indicator — the review cycle is far too slow.","outcome":"The attacker enjoys small-key VPN traffic for another week.","outcomeBad":true}]}],"hint":"Verify with records first, attribute second, escalate with evidence third.","explain":"Two connected ideas run through this flow: (1) prove what changed using configuration records, (2) prove who did it using session logs — then escalate. Each step feeds the next, and evidence stays intact.","study":"Incident triage for network devices: config diff, session attribution, escalation."},{"id":"T1600-001-M05","type":"fib","title":"Complete the analytic description","summary":"Three words finish the AN0681 summary sentence.","concepts":["AN0681 analytic","downgraded algorithms","correlation of config change + weaker ciphers"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Draft wiki entry","kind":"text","text":"Draft: 'Analytic AN0681 looks for config changes that {b0} key strength, and correlates them with traffic that negotiates {b1} ciphers. Confidence is {b2} when both signals match.'"}],"question":"Fill the three blanks so the wiki entry matches the analytic.","template":"Analytic AN0681 looks for config changes that {b0} key strength, and correlates them with traffic negotiating {b1} ciphers. Confidence is {b2} when both match.","blanks":[{"accept":["reduce","weaken","lower","downgrade"],"why":"The analytic watches for changes that reduce/weaken key strength.","whyMiss":"Strengthening key length is the opposite of what T1600.001 does."},{"accept":["weaker","legacy","older"],"why":"The effect shows up as weaker ciphers actually negotiated in traffic.","whyMiss":"The traffic would get weaker, not stronger, after a key-space reduction."},{"accept":["higher","high"],"why":"Two matching signals raise confidence — that is the point of correlation.","whyMiss":"Correlation is used to increase confidence, not to leave it unchanged."}],"hint":"Direction matters: the config change weakens, the traffic gets weaker, the confidence gets higher.","explain":"AN0681 = reduce (config) + weaker (traffic) + higher (confidence). This correlation design is what separates a real downgrade from a mislabelled log line.","study":"The AN0681 analytic description on the T1600.001 page."},{"id":"T1600-001-M06","type":"mcq","title":"Why the VPN gateway?","summary":"Attacker reasoning — target choice inside the technique.","concepts":["pre-position for decrypting captured traffic","unauthorized disclosure risk"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker planning note","kind":"text","text":"The attacker can reach many machines. They choose the site-to-site VPN gateway as the place to weaken encryption rather than a single workstation."}],"question":"From the attacker's point of view, what is the main advantage of weakening the gateway?","options":[{"t":"All tunneled site traffic becomes cheap to decrypt from one change","correct":true,"why":"Correct — the gateway sees every tunneled flow, so one small change exposes far more data than one host."},{"t":"Gateways are easier to physical-steal than laptops","correct":false,"why":"Theft is a different attack entirely; T1600.001 is done remotely through the CLI."},{"t":"Gateway changes are always auto-approved by change management","correct":false,"why":"If anything, device changes are closely tracked — the attacker accepts that risk for the payoff."},{"t":"It crashes the monitoring servers first","correct":false,"why":"Nothing in this technique attacks monitors; it silently weakens crypto instead."}],"hint":"Think about what flows through the chosen machine — and what one change unlocks.","explain":"The gateway is a chokepoint: weaken it once and every captured tunnel flow becomes readable. That leverage is why network devices, despite their logging, remain high-value T1600.001 targets.","study":"Chokepoint value of VPN gateways and the risk of unauthorized disclosure on compromised devices."},{"id":"T1600-001-M07","type":"triage","title":"Classify the change queue","summary":"Four config-change alerts — indicator, benign, or unrelated.","concepts":["key length parameter changes","downgrade to legacy ciphers","firmware change records","unexpected key management file updates"],"perspective":"defender","tags":["trap:alarming-but-benign"],"scenario":[{"label":"ARTEFACT 1 — Change queue (Monday 08:00)","kind":"text","text":"Four network-device changes await review. Approved maintenance: an approved ticket exists only for the SNMP string rotation."}],"question":"Classify each change: T1600.001 indicator, routine approved change, or unrelated noise.","rows":[{"alert":"edge-rtr-01: ISAKMP key size 4096 → 512","detail":"No matching ticket in the register.","options":["T1600.001 indicator","Routine approved change","Unrelated noise"],"correctIndex":0,"why":"A 4096→512 key-length collapse with no ticket is the textbook T1600.001 signature.","whyNot":{"1":"There is no approved ticket for this change — it cannot be the routine one.","2":"A key-length change is directly the technique — never noise."}},{"alert":"core-sw-01: SNMP community string rotated","detail":"Ticket CHG-2201 approved for tonight.","options":["T1600.001 indicator","Routine approved change","Unrelated noise"],"correctIndex":1,"why":"SNMP string rotation with a matching approved ticket is routine maintenance.","whyNot":{"0":"SNMP strings are not encryption keys — nothing about cipher strength changed.","2":"It matches an approved ticket, so it is routine, not noise."}},{"alert":"vpn-hub-02: 3DES enabled where AES-256 removed","detail":"No ticket; change outside maintenance window.","options":["T1600.001 indicator","Routine approved change","Unrelated noise"],"correctIndex":0,"why":"Swapping a strong cipher for a legacy one without a ticket is the downgrade marker.","whyNot":{"1":"No ticket exists — 'routine' has no basis here.","2":"Cipher downgrades are exactly the technique, not background noise."}},{"alert":"edge-rtr-01: banner text updated to new hotline number","detail":"Looks dramatic in the diff viewer.","options":["T1600.001 indicator","Routine approved change","Unrelated noise"],"correctIndex":2,"why":"Banners are display text — alarming-looking in a diff, but no crypto effect.","whyNot":{"0":"No crypto parameter appears in this change at all.","1":"There is no ticket for it either — it is simply unrelated to crypto."}}],"hint":"Ask two questions per row: does it touch cipher strength, and is there an approved ticket?","explain":"Key-length and cipher changes without tickets are T1600.001 indicators; ticketed non-crypto work is routine; banner edits are noise that merely looks dramatic. This 'two questions' habit keeps the queue fast.","study":"Change-management registers and which device changes actually affect cipher strength."},{"id":"T1600-001-M08","type":"terminal","title":"Pull only the crypto lines","summary":"The tool is named; work out the options to filter for crypto config.","concepts":["CLI command logs","crypto config commands"],"perspective":"defender","tags":[],"skill":"pipeline-filter-selection","scenario":[{"label":"ARTEFACT 1 — Ticket note","kind":"text","text":"Ticket NET-7488: the full running-config is long. You only need the lines that touch encryption. You are already in privileged mode on edge-rtr-01."}],"question":"Type the command that prints only the configuration lines containing crypto settings.","cmd":{"prompt":"edge-rtr-01#","canonical":"show running-config | include crypto","nearMiss":"show running-config | section crypto","outputs":[{"re":"show (run|running-config)\\s*\\|\\s*include\\s+crypto","lines":["crypto isakmp policy 10"," encryption 3des"," group 2","crypto isakmp key mini-rail-2026 address 10[.]20[.]99[.]10","crypto ipsec transform-set VPN-LEGACY esp-3des esp-md5-hmac"]}],"unknown":"% Invalid input detected — remember you can pipe 'show' output through a filter.","elements":[{"re":"show (run|running-config)","label":"Displays the running configuration","why":"The crypto settings live in the running config; 'show run' prints it."},{"re":"\\|","label":"Pipes the output into a filter","why":"The pipe sends the config text to the filter stage."},{"re":"\\binclude\\b","label":"Uses the 'include' filter","why":"'include' keeps only matching lines — the IOS way to grep."},{"re":"\\bcrypto\\b","label":"Filters for the word 'crypto'","why":"Every encryption line on IOS contains the 'crypto' keyword."}],"forbidden":[{"re":"\\b(exclude|section)\\b","label":"the wrong filter keyword","why":"'exclude' drops matching lines and 'section' prints blocks — both give the wrong output for this task."},{"re":"\\b(copy|write|erase|reload)\\b","label":"a state-changing command","why":"This is a read-only audit; changing state is out of scope."}]},"hint":"You need to see only the lines that contain the word used for cryptography — IOS lets you filter show output.","explain":"'show running-config | include crypto' prints just the crypto lines. 'include' is the IOS filter that keeps matches; 'exclude' would drop them — a classic near-miss. Read-only pipelines like this are how analysts audit for T1600.001 quickly.","study":"IOS output filters: include, exclude, section — and when each is correct."},{"id":"T1600-001-M09","type":"match","title":"Match controls to what they stop","summary":"Three compensating controls and the behaviour each limits.","concepts":["config integrity monitoring","restricted management access","trusted image verification","no easy preventive control (abuse of system features)"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK mitigation note (T1600.001)","kind":"text","text":"This technique cannot be easily mitigated with preventive controls because it abuses normal device features. Defence therefore leans on layered compensating controls."}],"question":"Match each compensating control to the attacker behaviour it limits.","left":[{"t":"Config-archive diff alerts","match":0,"why":"Diff alerts surface any manual crypto change almost immediately."},{"t":"Management ACL (only 2 admin hosts)","match":1,"why":"A tight ACL shrinks who can even reach the CLI to make the change."},{"t":"Signed, verified firmware images","match":2,"why":"Image verification blocks tampered firmware that carries the change."}],"right":[{"t":"Silent manual edits to crypto settings","why":"Diffs between running config and archive expose silent edits."},{"t":"Unknown machines reaching the device CLI","why":"Management ACLs decide which hosts can open a CLI session at all."},{"t":"A modified image that re-enables weak crypto","why":"Signature verification rejects images that were not signed by the vendor."}],"hint":"One control watches changes, one gates access, one protects the software image.","explain":"Because T1600.001 abuses normal features, defence is layered: watch for changes (diff alerts), gate the door (management ACL), and protect the platform (signed images). Each control limits a different step of the attack.","study":"Layered compensating controls for network devices when ATT&CK lists no direct mitigation."},{"id":"T1600-001-M10","type":"fib","title":"Write the incident sentence","summary":"Numbers and the key term for the IR report.","concepts":["key length in bits and bytes","key space","entropy"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Draft IR report line","kind":"text","text":"Draft: 'The RSA management key on vpn-hub-02 was cut from {b0} bits to 512 bits, collapsing the {b1} the attacker must search to break it.'"}],"question":"Fill the two blanks for the IR report.","template":"The RSA key was cut from {b0} bits to 512 bits, collapsing the {b1} the attacker must search.","blanks":[{"accept":["2048","4096","3072"],"why":"Modern RSA keys are 2048 bits or more — any of these completes the sentence sensibly.","whyMiss":"A 'from' value below 512 makes no sense; use a standard modern RSA size."},{"accept":["key space"],"why":"The searchable set is the key space — the core term of T1600.001.","whyMiss":"'Password list' or 'database' are not the cryptographic term for the set of possible keys."}],"hint":"First blank: a common modern RSA key size. Second blank: the two-word crypto term for all possible keys.","explain":"From 2048 (or larger) down to 512 bits is a collapse of the key space — exactly the measurable outcome T1600.001 aims for.","study":"Standard RSA key sizes and how key space grows with key length."},{"id":"T1600-001-M11","type":"dnd","title":"Map artefacts to data sources","summary":"Four pieces of evidence into four telemetry buckets.","concepts":["device configuration logs","CLI command logs","firmware change records","traffic analysis of negotiated ciphers","firmware images"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Evidence locker","kind":"text","text":"During the vpn-hub-02 review you collect four artefacts. Tag each with the data source it belongs to."}],"question":"Drag each artefact to its correct data-source bucket.","zones":[{"name":"CLI command logs","accepts":[0],"why":"A typed command line belongs to the CLI command log."},{"name":"Traffic analysis","accepts":[1],"why":"Negotiated ciphers are observed in traffic, not in device logs."},{"name":"Firmware change records","accepts":[2],"why":"Image versions and checksums live in firmware records."},{"name":"Configuration logs","accepts":[3],"why":"Policy diffs are configuration history."}],"bank":[{"t":"'crypto isakmp policy 10 / encryption 3des' typed at 03:12","whyMiss":"This is a typed CLI line — CLI command logs."},{"t":"Packet capture showing IKE proposing 3DES","whyMiss":"Cipher negotiation is visible only in traffic — traffic analysis."},{"t":"Image checksum changed from vendor value","whyMiss":"Image checksums are firmware records."},{"t":"Config diff: aes 256 → 3des","whyMiss":"A diff of settings over time is configuration logging."}],"hint":"Ask: was it typed, sniffed, flashed, or stored as settings?","explain":"Typed → CLI logs; sniffed → traffic analysis; flashed → firmware records; stored → configuration logs. DET0243 correlates these buckets to reach high confidence.","study":"The data components behind detection strategy DET0243."},{"id":"T1600-001-M12","type":"mcq","title":"Pick the framework mapping","summary":"Which control-family line matches 'protect data in transit on network devices'.","concepts":["NIST CSF PR.DS-2 data-in-transit","ISO/IEC 27001 A.8.24 use of cryptography"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — GRC review question","kind":"text","text":"The GRC team maps the VPN gateway hardening programme to recognised frameworks. The programme's goal: keep data protected while it crosses the network."}],"question":"Which framework mapping best fits that goal?","options":[{"t":"NIST CSF PR.DS-2 — data-in-transit is protected","correct":true,"why":"Correct — PR.DS-2 is exactly the data-in-transit protection category."},{"t":"NIST CSF RC.RP — recovery plan execution","correct":false,"why":"RC.RP is about recovering after an incident, not protecting traffic."},{"t":"NIST CSF ID.AM — asset inventory","correct":false,"why":"Knowing your assets matters, but it does not protect data in motion."},{"t":"ISO 27001 A.5.17 — authentication information","correct":false,"why":"That covers passwords and secrets handling, not channel encryption."}],"hint":"This is about the control category whose name literally mentions data moving across a network.","explain":"PR.DS-2 ('data-in-transit is protected') is the natural NIST CSF anchor for VPN crypto hardening; ISO/IEC 27001 A.8.24 (use of cryptography) is the natural ISO anchor. Framework mappings help GRC justify the spend.","study":"NIST CSF PR.DS category and ISO/IEC 27001 A.8.24."},{"id":"T1600-001-M13","type":"order","title":"Order the containment plan","summary":"Four responder actions, least disruptive first.","concepts":["config integrity monitoring","management network segmentation","trusted image verification","IR evidence handling"],"perspective":"defender","tags":["trap:least-aggressive"],"scenario":[{"label":"ARTEFACT 1 — IR bridge decision","kind":"text","text":"Confirmed: vpn-hub-02 crypto downgraded by an unknown session. The rail control centre must keep running while you respond."}],"question":"Put the four containment actions in the correct order.","sequence":["Snapshot the running config and logs to the evidence server","Restrict management access to the two known admin hosts","Restore the known-good config with a strong cipher policy","Verify the restored image signature before returning to service"],"orderWhy":["Evidence first — anything else risks destroying the record of the change.","Cutting management access stops the attacker changing things again while you work.","Restore strength only once the attacker cannot interfere.","Signature verification last confirms the platform itself was not re-tampered."],"hint":"Evidence, then cut access, then fix, then verify — the least aggressive step that works comes first.","explain":"Least-aggressive-first ordering preserves evidence and service: snapshot, restrict, restore, verify. Reloading or wiping early would erase evidence and interrupt trains for no gain.","study":"Network device IR playbooks: evidence capture before restoration."},{"id":"T1600-001-M14","type":"multi","title":"What the weakened tunnel enables","summary":"Two follow-on gains per the parent technique description.","concepts":["enables Credential Access and Collection","unauthorized disclosure risk"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Parent technique T1600 (extract)","kind":"text","text":"Compromising a device's encryption may facilitate data manipulation, Credential Access, or Collection efforts, and poses a greater risk of unauthorized disclosure."}],"question":"Select the two gains the attacker most directly gets from the weakened VPN.","options":[{"t":"Reading captured tunnel traffic offline","correct":true,"why":"Correct — unauthorized disclosure is the direct gain; the small key space makes captured data readable."},{"t":"Harvesting credentials that travel inside the tunnel","correct":true,"why":"Correct — Credential Access is named in the parent description; login flows inside the tunnel become crackable."},{"t":"Silently corrupting files on a laptop","correct":false,"why":"Endpoint file tampering is unrelated to weakening the tunnel cipher."},{"t":"Raising the device's CPU clock","correct":false,"why":"Hardware tuning is not a goal of this technique at all."}],"hint":"The parent page names two follow-on tactics; both start with what becomes readable.","explain":"Weakened encryption exposes captured traffic (Collection / unauthorized disclosure) and any credentials inside it (Credential Access). That chain is why T1600.001 sits in the Defence Impairment area but pays off later.","study":"The T1600 parent description and the tactics it enables downstream."},{"id":"T1600-001-M15","type":"mcq","title":"Name the detection strategy","summary":"Which ATT&CK detection strategy ID covers this technique on network devices.","concepts":["DET0243 detection strategy","confidence level"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Detection engineering ticket","kind":"text","text":"Ticket DET-119: 'Build the analytic for Weaken Encryption: Reduce Key Space on Network Devices. Reference the ATT&CK detection strategy for this exact sub-technique.'"}],"question":"Which detection strategy ID should the ticket reference?","options":[{"t":"DET0243 — Reduce Key Space on Network Devices","correct":true,"why":"Correct — DET0243 is the strategy published for T1600.001, with analytic AN0681."},{"t":"DET0339 — Weaken Encryption (parent) on Network Devices","correct":false,"why":"DET0339 covers the parent T1600 broadly; the ticket asks for the sub-technique-specific strategy."},{"t":"M1027 — Privilege Levels","correct":false,"why":"M1027 is a mitigation ID (device privilege levels), not a detection strategy — different object type."},{"t":"AN0681 used alone as the strategy","correct":false,"why":"AN0681 is the analytic inside DET0243; the strategy is the DET-level object."}],"hint":"This is about the DET-prefixed object written for exactly this sub-technique name.","explain":"DET0243 is the published detection strategy for T1600.001 and contains analytic AN0681. Parent-level DET0339 is broader, and M-IDs are mitigations, not detections.","study":"ATT&CK object types: strategies (DET), analytics (AN), mitigations (M)."}],"severityWord":"MEDIUM","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="trirrow"><span class="t-alert">'+esc(r.alert)+'</span><select class="anssel" id="tri-'+ri+'" onchange="pickTriage()" aria-label="Disposition for alert '+(ri+1)+'">'+opts+'</select><span class="t-detail">'+esc(r.detail)+'</span></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');

}

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWER</span>'+esc(letterKey(dispKey(ex,ci))+'. '+ex.options[ci].t)+'</div>';

  } else if(ex.type === 'fib'){

  } else if(ex.type === 'dnd'){

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PLACEMENTS</span>'+dc+'</div>';

  } else if(ex.type === 'multi' || (ex.type === 'logview' && ex.multi)){
    var oc2 = ex.options.map(function(o,i){ return o.correct ? esc(letterKey(dispKey(ex,i))+'. '+o.t) : null; }).filter(Boolean).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span>'+oc2+'</div>';

  var cc = $('copycanon');

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
