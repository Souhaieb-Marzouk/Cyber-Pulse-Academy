<script>
/* Cyber Pulse Academy exercise engine — MITRE ATT&CK T1659 Content Injection
   Shared vanilla-JS engine for all four difficulty files. No external requests. */
window.ExamEngine=(function(){
'use strict';
/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function words(s){return String(s||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(function(x){return x;}).length;}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
/* ---------------- syntax highlight ---------------- */
var KW=['DNS','HTTP','HTTPS','SMB','FTP','GET','POST','PUT','200','302','404','Content-Type','Content-Length','text/html','application/octet-stream','curl','wget','tcpdump','wscript','cscript','Safari','chrome','firefox','msedge','browser','Exec','exec','payload','update','pcap','AN0992','AN0993','AN0994','DET0349','T1659','T1557','T1189','T1105','M1041','M1021','TA0001','TA0011','Windows','Linux','macOS','GET','vsftpd','wupdate','winupdate','Vary','Server','nginx','apache','IDs','TTL','time','date','GET','http'];
var HL_RE=null;
function buildHL(){
  var seen={},ks=[];
  KW.forEach(function(k){if(!seen[k]){seen[k]=1;ks.push(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));}});
  HL_RE=new RegExp('(&quot;[^&]*&quot;|\'[^\']*\')|(\\b\\d[\\d.]*\\b)|(\\b(?:'+ks.join('|')+')\\b)','g');
}
function hl(line){
  var s=esc(line);
  return s.replace(HL_RE,function(m,str,num,kw){
    if(str)return '<span class="hl-s">'+str+'</span>';
    if(num)return '<span class="hl-n">'+num+'</span>';
    return '<span class="hl-k">'+kw+'</span>';
  });
}
/* ---------------- scoring (partial credit contract) ---------------- */
function scoreExercise(sel,correct){
  var N=correct.length,H=0,W=0,i;
  for(i=0;i<sel.length;i++){if(correct.indexOf(sel[i])>=0)H++;else W++;}
  return Math.max(0,(H-W)/N);
}
/* ---------------- timer state machine ---------------- */
var TS={R:'RUNNING',PM:'PAUSED_MANUAL',PA:'PAUSED_AUTO_CHECK',EN:'ENDED'};
var E={d:null,phase:'intro',inst:[],idx:0,skipped:[],hint:{},report:false,username:'',prev:null,deadLeft:null,timeoutHit:false};
function tState(){return E.timer.state;}
function setTS(st){
  E.timer.state=st;
  var c=$('#hTimer');if(!c)return;
  c.classList.remove('st-run','st-pm','st-pa','st-en');
  var txt='',icon='';
  if(st===TS.R){c.classList.add('st-run');icon='&#9654;';txt='RUNNING';}
  else if(st===TS.PM){c.classList.add('st-pm');icon='&#9208;';txt='PAUSED &mdash; manual (press Resume)';}
  else if(st===TS.PA){c.classList.add('st-pa');icon='&#9208;';txt='PAUSED &mdash; reviewing feedback (resumes on Next)';}
  else{c.classList.add('st-en');icon='&#9635;';txt='ENDED';}
  c.innerHTML='<span class="tdot">'+icon+'</span>&nbsp;'+fmt(E.timer.remaining)+' &middot; '+txt;
}
function tick(){
  if(!E||!E.timer)return;
  if(tState()!==TS.R)return;
  if(E.phase!=='exam'&&E.phase!=='review')return;
  E.timer.remaining--;
  var inst=E.inst[E.idx];
  if(E.phase==='exam'&&E.deadLeft!=null&&inst&&inst.deadline&&!inst.checked){
    E.deadLeft--;
    var d=$('#deadChip');
    if(d)d.innerHTML='&#9201; Exercise timer: <span id="deadVal">'+fmt(E.deadLeft)+'</span> &mdash; stops on Check';
    if(E.deadLeft<=0){autoCheck();}
  }
  if(E.timer.remaining<=0){E.timer.remaining=0;setTS(TS.EN);timeUp();return;}
  setTS(tState());
}
function timeUp(){
  E.timeoutHit=true;
  if(E.phase==='exam'||E.phase==='review'){renderResults(true);}
}
/* ---------------- header ---------------- */
function buildHeader(){
  var h=$('#hdr');
  h.innerHTML='<div class="hdr-in">'+
    '<div class="hdr-brand">'+esc(E.d.brand)+'</div>'+

/* ---------------- exam flow ---------------- */
function startExam(){
  buildInstances();
  E.report=false;
  E.phase='exam';E.idx=0;E.deadLeft=null;
  setTS(TS.R);
  renderExercise();
}
function buildInstances(){
  E.inst=[];E.skipped=[];E.hint={};E.deadLeft=null;E.timeoutHit=false;
  var order=shuffle(E.d.exercises);
  order.forEach(function(ex){
    var inst={ex:ex,type:ex.type,raw:null,checked:false,credit:0,fromReview:false,deadline:ex.deadlineSec||null,checkedWithHint:false};
    prepare(inst);
    E.inst.push(inst);
  });
}
function prepare(inst){
  var ex=inst.ex;
  if(ex.type==='choice'||ex.type==='multi'){
    inst.opts=shuffle(ex.options.map(function(o){return {id:o.id,text:o.text};}));
  }else if(ex.type==='order'){
    inst.disp=shuffle(ex.items.map(function(i){return i.id;}));
  }else if(ex.type==='match'){
    inst.lefts=shuffle(ex.pairs.map(function(p,i){return {id:'L'+i,text:p.l};}));
    inst.rights=shuffle(ex.pairs.map(function(p,i){return {id:'R'+i,text:p.r};}));
    inst.pairMap={};inst.selL=null;
  }else if(ex.type==='drag'){
    inst.bank=shuffle(ex.bank.map(function(b,i){return {id:'B'+i,text:b.text,ok:b.ok,slot:b.slot};}));
    inst.place={};inst.selChip=null;
  }else if(ex.type==='fill'){
    inst.bankOpts=shuffle(ex.bank.slice());
  }else if(ex.type==='branch'){
    inst.stepRaws=[];
    inst.stepOpts=ex.steps.map(function(s){return shuffle(s.options.map(function(o){return {id:o.id,text:o.text};}));});
    inst.cur=0;
  }
}
function curInst(){return E.inst[E.idx];}

function bindLogViewer(root,lg){

/* choice + multi */
function wChoice(inst,box,multi){
  var ex=inst.ex;inst.raw=multi?[]:null;
  if(ex.selectNote)box.appendChild(el('p','small muted',ex.selectNote));
  inst.opts.forEach(function(o){

    b.addEventListener('click',function(){

        if(i>=0){inst.raw.splice(i,1);b.classList.remove('sel');b.setAttribute('aria-pressed','false');}
        else{inst.raw.push(o.id);b.classList.add('sel');b.setAttribute('aria-pressed','true');}
      }else{
        inst.raw=o.id;

        b.classList.add('sel');b.setAttribute('aria-pressed','true');

/* ordering */
function wOrder(inst,box){
  var ex=inst.ex,list=el('ul','ordlist');
  function rowFor(id,idx){
    var item=null;ex.items.forEach(function(it){if(it.id===id)item=it;});
    var li=el('li','ordrow');
    li.innerHTML='<span class="oh" data-h aria-label="Drag handle">&#8801;</span><span class="ordnum">'+(idx+1)+'.</span><span class="ox">'+esc(item.text)+'</span>';
    var up=el('button','oup','&uarr;');up.type='button';up.setAttribute('aria-label','Move up');
    var dn=el('button','odn','&darr;');dn.type='button';dn.setAttribute('aria-label','Move down');
    up.addEventListener('click',function(){if(inst.checked)return;move(id,-1);});
    dn.addEventListener('click',function(){if(inst.checked)return;move(id,1);});
    li.appendChild(up);li.appendChild(dn);
    li.dataset.id=id;
    dragRow(li,function(){draw();});
    return li;
  }
  function move(id,dir){
    var i=inst.disp.indexOf(id),j=i+dir;
    if(j<0||j>=inst.disp.length)return;
    inst.disp.splice(j,0,inst.disp.splice(i,1)[0]);draw();
  }
  function draw(){
    list.innerHTML='';
    list.__owner=inst;
    inst.disp.forEach(function(id,i){list.appendChild(rowFor(id,i));});
  }
  draw();
  box.appendChild(el('p','small muted','Put the steps in the right order. Use the arrows or drag the handle.'));
  box.appendChild(list);
}
function dragRow(li,after){
  var handle=$('[data-h]',li);
  handle.addEventListener('pointerdown',function(ev){
    var cardEl=li.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    ev.preventDefault();
    var list=li.parentNode,rows=Array.prototype.slice.call(list.children);
    var startY=ev.clientY,rect=li.getBoundingClientRect(),offY=startY-rect.top;
    li.classList.add('dragging');
    var ghost=li.cloneNode(true);ghost.className='ghost';ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    function pos(y){
      ghost.style.left=rect.left+'px';ghost.style.top=(y-offY)+'px';
      var target=null;
      rows.forEach(function(r){
        if(r===li)return;
        var rr=r.getBoundingClientRect();
        if(y>rr.top-8&&y<rr.bottom+8)target=r;
      });
      if(target){
        var ti=rows.indexOf(target),ci=rows.indexOf(li);
        if(ti>ci)list.insertBefore(li,target.nextSibling);else list.insertBefore(li,target);
        rows=Array.prototype.slice.call(list.children);
      }
    }
    function mv(e){pos(e.clientY);}
    function up(){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();li.classList.remove('dragging');
      var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});
      var owner=list.__owner||li.closest('.excard').__inst;
      if(owner)owner.disp=ids;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* matching */
function wMatch(inst,box){
  var ex=inst.ex,wrap=el('div','match-wrap');
  var lc=el('div'),rc=el('div');
  lc.innerHTML='<div class="mcol-h">Column 1 &mdash; click an item</div>';

    var b=el('button','mchip');b.type='button';b.dataset.id=l.id;
    b.innerHTML='<span>'+esc(l.text)+'</span><span class="pairout"></span>';
    b.addEventListener('click',function(){
      if(inst.checked)return;
      inst.selL=l.id;
      $all('.mchip',lc).forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
    });

  });
  inst.rights.forEach(function(r){
    var b=el('button','mchip');b.type='button';b.dataset.id=r.id;
    b.innerHTML='<span>'+esc(r.text)+'</span>';
    b.addEventListener('click',function(){
      if(inst.checked||!inst.selL)return;
      for(var k in inst.pairMap){if(inst.pairMap[k]===r.id)delete inst.pairMap[k];}
      inst.pairMap[inst.selL]=r.id;

      }else{b.classList.remove('paired');out.innerHTML='';}
    });
    $all('.mchip',rc).forEach(function(b){
      var used=false;for(var k in inst.pairMap){if(inst.pairMap[k]===b.dataset.id)used=true;}
      b.classList.toggle('paired',used);
    });
  }
  refresh();
  wrap.appendChild(lc);wrap.appendChild(rc);
  box.appendChild(el('p','small muted','Click one item on the left, then its partner on the right. Click again to change.'));
  box.appendChild(wrap);
}
/* drag & drop */
function wDrag(inst,box){
  var ex=inst.ex;
  var bank=el('div','bank');bank.dataset.bank='1';
  var slotCount=ex.slots.length;
  var slots=el('div','slots '+(slotCount>=3?'cols-3':'cols-2'));
  ex.slots.forEach(function(s,i){
    var d=el('div','slot');d.dataset.slot=String(i);
    d.innerHTML='<div class="slot-h">'+esc(s.label)+'</div>';
    slots.appendChild(d);
  });
  function chipEl(item){
    var c=el('button','chip');c.type='button';c.dataset.id=item.id;c.textContent=item.text;
    c.addEventListener('click',function(){
      if(inst.checked)return;
      if(c.parentElement&&c.parentElement.classList.contains('slot'))return; /* slot click handler returns it */
      if(inst.selChip===item.id){inst.selChip=null;c.classList.remove('sel');}
      else{inst.selChip=item.id;$all('.chip',box).forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');}
    });
    dragChip(c,bank,slots,function(){draw();});
    return c;
  }
  function placeItem(itemId,slotIdx){
    for(var k in inst.place){if(inst.place[k]===itemId)delete inst.place[k];}
    inst.place[slotIdx]=itemId;
    inst.selChip=null;
    $all('.chip',box).forEach(function(x){x.classList.remove('sel');});
    draw();
  }
  function findSlotOf(itemId){for(var k in inst.place){if(inst.place[k]===itemId)return k;}return null;}
  function draw(){
    bank.innerHTML='';
    inst.bank.forEach(function(item){
      if(findSlotOf(item.id)!=null)return;
      bank.appendChild(chipEl(item));
    });
    $all('.slot',slots).forEach(function(sd){
      var i=sd.dataset.slot,id=inst.place[i];
      $all('.chip',sd).forEach(function(x){x.remove();});
      if(id){
        var item=null;inst.bank.forEach(function(b){if(b.id===id)item=b;});
        sd.appendChild(chipEl(item));
      }
    });
  }
  slots.addEventListener('click',function(ev){
    if(inst.checked)return;
    var chipBtn=ev.target.closest('.chip');
    var sd=ev.target.closest('.slot');if(!sd)return;
    if(chipBtn&&!inst.selChip){
      for(var k in inst.place){if(inst.place[k]===chipBtn.dataset.id)delete inst.place[k];}
      draw();return;
    }
    if(inst.selChip)placeItem(inst.selChip,sd.dataset.slot);
  });
  bank.addEventListener('click',function(ev){
    if(inst.checked)return;
    if(ev.target===bank&&inst.selChip){
      var sid=findSlotOf(inst.selChip);
      if(sid!=null){delete inst.place[sid];inst.selChip=null;draw();}
    }
  });
  draw();
  box.appendChild(el('p','small muted','Drag each item into a slot, or click the item then the slot. Tap a placed item to send it back.'));
  box.appendChild(bank);box.appendChild(slots);
  inst.__draw=draw;
}
function dragChip(chip,bank,slots,after){
  chip.addEventListener('pointerdown',function(ev){
    var cardEl=chip.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    var inst=cardEl?cardEl.__inst:null;
    ev.preventDefault();
    var rect=chip.getBoundingClientRect(),offX=ev.clientX-rect.left,offY=ev.clientY-rect.top;
    var ghost=chip.cloneNode(true);ghost.className='chip ghost';
    ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    var curSlot=null;
    function mv(e){
      ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(curSlot&&curSlot!==sl)curSlot.classList.remove('over');
      curSlot=sl;if(sl)sl.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();
      if(curSlot)curSlot.classList.remove('over');
      if(!inst||inst.checked){after();return;}
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(sl){
        var i=sl.dataset.slot;
        for(var k in inst.place){if(inst.place[k]===chip.dataset.id)delete inst.place[k];}
        if(inst.place[i]&&inst.place[i]!==chip.dataset.id){delete inst.place[i];}
        inst.place[i]=chip.dataset.id;
      }else{
        var inSlot=chip.parentElement&&chip.parentElement.classList.contains('slot');
        if(inSlot){
          var si=chip.parentElement.dataset.slot;
          if(inst.place[si]===chip.dataset.id)delete inst.place[si];
        }
      }
      inst.selChip=null;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* fill in the blanks */

/* terminal */
function wTerminal(inst,box){

  if(sh.support)box.appendChild(el('div','hintbox',sh.support));
  var term=el('div','term');
  term.innerHTML='<div class="term-out" data-out>'+esc(sh.banner||'')+'</div>'+

    (sh.note?'<div class="term-note">'+sh.note+'</div>':'');
  box.appendChild(term);
  var out=$('[data-out]',term),inp=$('[data-cmd]',term);
  inst.lastCmd=null;inst.ran=false;
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){
      var cmd=inp.value;inp.value='';
      runCmd(inst,out,cmd);
    }
  });
  if(sh.deadlineNote)box.appendChild(el('p','small muted',sh.deadlineNote));

function runCmd(inst,out,cmd){
  var sh=inst.ex.shell;
  out.textContent+='\n'+sh.prompt+cmd+'\n';
  var n=norm(cmd);
  if(!n){out.scrollTop=out.scrollHeight;return;}
  inst.lastCmd=n;inst.ran=true;
  var dangerous=null;
  (sh.forbidden||[]).forEach(function(f){if(f.re.test(n))dangerous=f;});
  var ok=sh.expectRe?sh.expectRe.test(n):true;
  if(dangerous){out.textContent+='\n'+dangerous.out+'\n';}
  else if(ok){out.textContent+='\n'+(sh.out||'(no output)')+'\n';}
  else{
    var tok=n.split(' ')[0];
    out.textContent+='\n'+(sh.errOut||('bash: '+tok+': command not found'))+'\n';
  }
  out.scrollTop=out.scrollHeight;
}

/* Engine part B — grading, feedback, flow, results, integration */
'use strict';
/* ---------------- grading ---------------- */
function grade(inst){
  var ex=inst.ex,res={items:[],detail:'',cls:'bad',label:'INCORRECT',credit0:0};
  if(inst.type==='choice'){
    var correct=[ex.correct];
    res.credit0=scoreExercise(inst.raw?[inst.raw]:[],correct);
    inst.opts.forEach(function(o){
      if(o.id===ex.correct)res.items.push({st:'ok',t:esc(o.text)+' — correct answer'});
      else if(inst.raw===o.id)res.items.push({st:'bad',t:esc(o.text)+' — your choice'});
    });
  }else if(inst.type==='multi'){
    var sel=inst.raw||[];
    res.credit0=scoreExercise(sel,ex.correct);
    inst.opts.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>=0,isS=sel.indexOf(o.id)>=0;
      if(isC&&isS)res.items.push({st:'ok',t:esc(o.text)});
      else if(isC)res.items.push({st:'miss',t:esc(o.text)});
      else if(isS)res.items.push({st:'bad',t:esc(o.text)});
    });
  }else if(inst.type==='order'){
    var arr=inst.disp||[],N=arr.length,H=0,W=0;
    arr.forEach(function(id,i){
      var item='';ex.items.forEach(function(it){if(it.id===id)item=it.text;});
      var good=ex.items[i].id===id;
      if(good){H++;res.items.push({st:'ok',t:'Position '+(i+1)+': '+esc(item)});}
      else{W++;res.items.push({st:'bad',t:'Position '+(i+1)+': '+esc(item)+' — should be: '+esc(ex.items[i].text)});}
    });
    res.credit0=Math.max(0,(H-W)/N);
  }else if(inst.type==='match'){
    var cnt=0,Wm=0,N=ex.pairs.length;
    inst.lefts.forEach(function(l){
      var oi=parseInt(l.id.slice(1),10);
      var chosen=inst.pairMap[l.id];
      if(chosen==='R'+oi){cnt++;res.items.push({st:'ok',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)});}
      else if(chosen){
        Wm++;
        var txt='';inst.rights.forEach(function(r){if(r.id===chosen)txt=r.text;});
        res.items.push({st:'bad',t:esc(ex.pairs[oi].l)+' → '+esc(txt)+' (wrong partner)'});
      }else res.items.push({st:'miss',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)+' (missed)'});
    });
    res.credit0=Math.max(0,(cnt-Wm)/N);
  }else if(inst.type==='drag'){
    var okN=0,Wn=0,N2=ex.slots.length;
    ex.slots.forEach(function(s,i){
      var id=inst.place?inst.place[String(i)]:null;
      var item=null;
      if(id!=null)inst.bank.forEach(function(b){if(b.id===id)item=b;});
      if(item&&item.ok&&String(item.slot)===String(i)){okN++;res.items.push({st:'ok',t:esc(s.label)+': '+esc(item.text)});}
      else if(item){
        Wn++;
        var why=(item.ok&&item.slot!==undefined&&String(item.slot)!==String(i))?' — right idea, wrong slot':' — wrong item here';
        res.items.push({st:'bad',t:esc(s.label)+': '+esc(item.text)+why});
      }
      else{
        var right='';ex.bank.forEach(function(b){if(b.ok&&b.slot===i)right=b.text;});
        res.items.push({st:'miss',t:esc(s.label)+': '+esc(right)+' (missed)'});
      }
    });
    res.credit0=Math.max(0,(okN-Wn)/N2);
  }else if(inst.type==='fill'){
    var vals=inst.raw||[],H2=0,W2=0,N3=ex.answers.length;
    ex.answers.forEach(function(a,i){
      var v=vals[i]||'';
      if(norm(v)===norm(a)){H2++;res.items.push({st:'ok',t:'Blank '+(i+1)+': '+esc(a)});}
      else if(v){W2++;res.items.push({st:'bad',t:'Blank '+(i+1)+': you chose "'+esc(v)+'" — answer is "'+esc(a)+'"'});}
      else res.items.push({st:'miss',t:'Blank '+(i+1)+': '+esc(a)+' (left empty)'});
    });
    res.credit0=Math.max(0,(H2-W2)/N3);
  }else if(inst.type==='terminal'){
    gradeTerminal(inst,res);
  }else if(inst.type==='branch'){
    var N4=ex.steps.length,H3=0,W3=0;
    ex.steps.forEach(function(s,i){
      var got=inst.stepRaws[i];
      if(got===s.correct){H3++;res.items.push({st:'ok',t:'Step '+(i+1)+': '+esc(s.short||'correct')});}
      else{
        if(got)W3++;
        var badTxt='';
        if(got){s.options.forEach(function(o){if(o.id===got)badTxt=o.text;});}
        res.items.push({st:'bad',t:'Step '+(i+1)+': you chose "'+esc(badTxt||'(no answer)')+'" — better: '+esc(s.short||s.correct)});
      }
    });
    res.credit0=Math.max(0,(H3-W3)/N4);
  }
  var used=E.hint[inst.ex.id];
  var credit=Math.max(0,res.credit0-(used?0.10:0));
  inst.credit=credit;
  if(credit>=0.999){res.cls='ok';res.label='CORRECT';}
  else if(credit>0){res.cls='part';res.label='PARTIALLY CORRECT';}
  else{res.cls='bad';res.label='INCORRECT';}
  res.credit=credit;res.hintUsed=used;
  return res;
}
function gradeTerminal(inst,res){
  var sh=inst.ex.shell,els=sh.elements||[];
  var n=inst.lastCmd||'';
  var H=0,W=0;
  els.forEach(function(e){
    if(n&&e.re.test(n)){H++;res.items.push({st:'ok',t:'Element: '+esc(e.label)});}
    else res.items.push({st:'miss',t:'Element: '+esc(e.label)+(n?' (missing)':' (no command run)')});
  });
  var dang=null;
  (sh.forbidden||[]).forEach(function(f){if(n&&f.re.test(n)){W++;dang=f;}});
  if(dang)res.items.push({st:'bad',t:'⚠ '+esc(dang.label)});
  res.credit0=Math.max(0,(H-W)/els.length);
  if(dang)res.detail+='<div class="study">⚠ <b>Close but dangerous:</b> '+dang.warn+'</div>';
  res.detail+='<div class="art canon"><div class="art-l">Canonical command</div>'+
    '<pre class="code" data-canon>'+esc(sh.canon)+'</pre>'+
    '<div class="blk-b"><button type="button" class="btn light copybtn" data-copy>Copy command</button></div></div>'+
    (sh.canonExpl?('<div class="fb-ex">'+sh.canonExpl+'</div>'):'');
}
/* ---------------- check / next / pause / hint / skip ---------------- */
function onCheck(inst,ablk,fbEl,btn){
  var ex=inst.ex;
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(inst.type==='order'){
    var list=$('.ordlist',ablk);
    if(list){var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});inst.disp=ids;}
  }
  if(inst.type==='drag'&&inst.__draw)inst.__draw();
  /* FIRST action: auto-pause before rendering feedback */
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  disableWidget(ablk);
  renderFeedback(inst,res,fbEl);
  updateHeader();
  /* swap button to Next / Final Submit */
  var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
  btn.textContent=last?'Final Submit':'Next &#9654;';
  btn.innerHTML=last?'Final Submit':'Next &#9654;';
  btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  var noteEl=$('.acts .note',ablk);
  if(noteEl)noteEl.textContent=(tState()===TS.PA)?'Timer paused while you study this feedback. Press Next to continue — the timer restarts then.':'';
  syncHeaderButtons();
}
function autoCheck(){
  var inst=curInst();
  if(!inst||inst.checked)return;
  var ablk=ablkOf(inst),fbEl=fbElOf(inst),btn=$('#bCheck');
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  if(ablk)disableWidget(ablk);
  if(fbEl)renderFeedback(inst,res,fbEl);
  updateHeader();
  if(btn){
    var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
    btn.innerHTML=last?'Final Submit':'Next &#9654;';
    btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  }
}
function disableWidget(ablk){
  $all('button, input, select',ablk).forEach(function(x){

}
function markOptions(inst,ablk){
  var ex=inst.ex;
  if(inst.type==='choice'||inst.type==='multi'){
    var opts=$all('.opt',ablk);
    var ids=[];
    inst.opts.forEach(function(o,i){
      var elx=opts[i];

      }else{
        var isC=ex.correct.indexOf(o.id)>=0,isS=(inst.raw||[]).indexOf(o.id)>=0;
        if(isC&&isS)elx.classList.add('state-ok');
        else if(isC)elx.classList.add('state-miss');

      }

function renderFeedback(inst,res,fbEl){
  markOptions(inst,$('.excard .b-answer',$('#stage')));
  var creditTxt='';
  var nItems=0;
  if(inst.type==='multi'||inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill'||inst.type==='terminal'||inst.type==='branch'){
    var N=0;
    if(inst.type==='multi')N=inst.ex.correct.length;
    else if(inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill')N=res.items.length;
    else if(inst.type==='terminal')N=inst.ex.shell.elements.length;
    else if(inst.type==='branch')N=inst.ex.steps.length;
    var itemsRight=0,itemsWrong=0;
    res.items.forEach(function(it){if(it.st==='ok')itemsRight++;else if(it.st==='bad')itemsWrong++;});
    creditTxt='<span class="credit-chip">credit '+res.credit.toFixed(2)+(N?' — '+itemsRight+' correct'+(itemsWrong?', '+itemsWrong+' wrong':'')+' of '+N+' items':'')+'</span>';
  }
  var icon=res.cls==='ok'?'&#10003;':(res.cls==='part'?'&#10003;':'&#10007;');
  var html='<div class="fb-h"><span class="fi" style="font-size:18px">'+icon+'</span><span>'+res.label+'</span>'+creditTxt+
    (res.hintUsed?'<span class="credit-chip">hint used: &minus;10% applied</span>':'')+'</div>';
  html+='<div class="fb-b">';
  if(res.items.length)html+='<ul class="fb-items">'+res.items.map(function(it){
    var ic=it.st==='ok'?'<span class="fi ok">&#10003;</span>':(it.st==='bad'?'<span class="fi bad">&#10007;</span>':'<span class="fi miss">&#9675;</span>');
    var w=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
    return '<li>'+ic+'<span><b>'+w+'</b> — '+it.t+'</span></li>';
  }).join('')+'</ul>';
  html+='<div class="fb-ex">'+inst.ex.explain+'</div>';
  if(res.detail)html+=res.detail;
  html+='</div>';
  fbEl.innerHTML='';
  fbEl.appendChild(el('div','fb '+res.cls,html));
  var cb=$('[data-copy]',fbEl);
  if(cb)cb.addEventListener('click',function(){
    var txt=$('[data-canon]',fbEl).textContent;
    try{navigator.clipboard.writeText(txt);}catch(e){}
    cb.textContent='Copied';
  });
  fbEl.scrollIntoView({behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth',block:'nearest'});
}
function onNext(inst,ablk,fbEl,btn){
  if(tState()===TS.PA){
    if(E.timer.remaining>0)setTS(TS.R);else setTS(TS.EN);
  }
  var fromReview=inst.fromReview;

    inst.fromReview=false;
    renderReview();

  }
  if(E.idx<E.inst.length-1){
    E.idx++;renderExercise();

    var pending=E.skipped.filter(function(i){return !E.inst[i].checked;});

/* ---------------- results ---------------- */
function renderResults(timeout){
  E.phase='results';
  if(tState()!==TS.EN)setTS(TS.EN);
  updateHeader();
  var st=$('#stage');
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skipped=0,i;
  for(i=0;i<E.inst.length;i++){
    var inst=E.inst[i];
    if(inst.checked){answered++;sum+=inst.credit;
      if(inst.credit>=0.999)full++;
      else if(inst.credit>0){part++;partSum+=inst.credit;}
      else zero++;
    }else skipped++;
  }
  var pct=answered>0?Math.round((sum/answered)*100):0;
  var passed=pct>=70;
  var d=E.d;
  var sealSvg='<svg class="c-seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d3f" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="#2a2413" stroke="#b08d3f" stroke-width="2"/><path d="M32 52 L45 65 L70 38" fill="none" stroke="#e0b95c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var panel=passed?

intro:{
headline:"T1659 — Content Injection — EXTREMELY HARD practice exam",
entityTitle:"About MITRE ATT&CK T1659 — Content Injection",
entityHtml:"<p><b>The object.</b> T1659 is a <b>Technique</b> (no sub-techniques) in MITRE ATT&CK named <b>Content Injection</b>, serving two tactics: <b>Initial Access</b> (TA0001) and <b>Command and Control</b> (TA0011). Platforms: <b>Linux, Windows, macOS</b>.</p>"+
"<p><b>The behaviour.</b> The attacker reaches into channels the victim already uses and injects content into the replies — instead of hosting content and waiting for victims (Drive-by Target T1608.004 → Drive-by Compromise T1189). <b>From the middle</b>: in-between the legitimate online client-server communications, similar but distinct from Adversary-in-the-Middle (T1557), which ATT&CK limits to enterprise environments. <b>From the side</b>: an unsolicited fake reply racing the legitimate server's response. Injection often originates in compromised <b>upstream channels</b> — at the ISP level, including abused 'lawful interception' systems. Channels: <b>DNS, HTTP, SMB replies</b>. The channel later carries additional payloads (Ingress Tool Transfer, T1105).</p>"+
"<p><b>Detection.</b> Strategy <b>DET0349</b>: <b>AN0992</b> Windows (browser-triggered file creation in %AppData%/Temp then execution; correlate network anomalies with local execution), <b>AN0993</b> Linux (curl/wget saving payloads to /tmp or /var/tmp then execution; PCAP and IDS/IPS alerts for injected responses or mismatched content types), <b>AN0994</b> macOS (unified logs; Safari/browser child processes loading scripts or executables; ~/Library/Caches and ~/Downloads drops executing shortly after write).</p>"+
"<p><b>Mitigations.</b> <b>M1041 Encrypt Sensitive Information</b> (trusted VPNs — with the trust and visibility trade-offs) and <b>M1021 Restrict Web-Based Content</b> (block uncommon file types). <b>Real cases.</b> <b>MoustachedBouncer</b> (G1019) — espionage against foreign diplomats in Belarus via ISP-level injection into DNS/HTTP/SMB replies and a fake Windows Update page; tool <b>Disco</b> (S1088).</p>"+
"<p><b>At this tier you act like a senior responder:</b> you resolve contradictory signals explicitly, accept real costs knowingly, refuse best practices that do not fit the context, and calibrate attribution language. Several correct answers are 'gather more evidence' or 'escalate' rather than a technical action.</p>",
workHtml:"<ul>"+
"<li><b>Senior SOC / IR lead:</b> you sequence response under CISO pressure, protect volatile evidence, and choose the least destructive correct action.</li>"+
"<li><b>Detection engineering lead:</b> you own coverage across AN0992/0993/0994, spot platform gaps, and refuse telemetry-breaking 'improvements'.</li>"+
"<li><b>Senior CTI analyst:</b> you brief ministries — separating page facts from inference, and refusing unsupported attribution claims.</li>"+
"<li><b>Security architecture:</b> you weigh M1041/M1021 against each other and against your own telemetry needs.</li></ul>",
extraNotes:["<b>Terminals:</b> two fake terminals, no tool names. One runs under its own reduced 3-minute timer that stops on Check. Destructive near-miss commands exist; the safe command is always correct.","<b>Hint policy:</b> hints only restate a constraint — they never point at the answer."]
},

window.EXAM_DATA.exercises=[
{id:"x01",type:"choice",title:"Embassy conclusion",summary:"Decide what the evidence supports in 10 minutes.",
scenario:{summary:"Four artefacts, one noise line, one honest gap.",
intro:"<p>03:40, embassy network. The ministry needs a decision in 10 minutes. Four artefacts below; one of them is noise. One piece of information is missing — reason around it.</p>",
artefacts:[{label:"ARTEFACT 1 — Gateway tap summary",code:"09:14:03 GET www[.]ministry-partner[.]example/portal (plain HTTP)\n  resp1: 200 text/html bytes=12044 (legitimate)\n  resp2: 200 text/html bytes=12871 unsolicited, +410ms, different server fingerprint\n  body(resp2): hidden iframe -> hxxp://update-win11[.]example/x.bin",light:false},
{label:"ARTEFACT 2 — Endpoint EDR (diplomat ws-2)",code:"09:15:10 chrome.exe -> write %Temp%\\winupdate.vbs\n09:15:26 wscript.exe winupdate.vbs -> 203[.]0[.]113[.]77:80\n09:20:02 vbs self-deleted; sample NOT recoverable from disk",light:false},
{label:"ARTEFACT 3 — Enterprise infra",code:"proxy, resolver, switches: clean configs, no tampering\nno AiTM appliance present; egress leaves via the national ISP",light:true},
{label:"ARTEFACT 4 — Unrelated ticket",code:"14:02 printer HP-4250 offline — ticket #2210 (facilities)",light:true}]},
question:"Which single conclusion is best supported right now?",
options:[{id:"A",text:"Upstream ISP-path injection; no enterprise compromise needed"},{id:"B",text:"An insider with console access injected the response"},{id:"C",text:"The embassy's own resolver poisoned its cache"},{id:"D",text:"The printer outage interrupted the update flow"}],
correct:"A",
hint:"Restate the constraint: two artefacts point outside your perimeter, and one artefact is a distraction.",
explain:"<p>An <b>unsolicited duplicate</b> response with a different server fingerprint, an enterprise path that is <b>clean</b>, and egress via the national ISP — the consistent story is <b>upstream T1659 injection</b>. The insider theory (B) and resolver poisoning (C) have zero artefact support; the printer line (D) is noise. The honest gap: the sample self-deleted, so payload-level proof is incomplete — your report must say 'consistent with', not 'proven'. Senior judgement names what the evidence supports AND what it cannot.</p>"},
{id:"x02",type:"match",title:"Precise mapping",summary:"Pair each behaviour with its right ATT&CK object.",
scenario:{summary:"Separate T1659 from its neighbours.",
intro:"<p>Senior CTI mapping review. Each behaviour below came with a proposed ATT&CK placement. Pair each behaviour with the placement that is actually correct.</p>"},
question:"Match each behaviour to its correct ATT&CK placement.",
pairs:[{l:"First foothold from an injected SMB reply",r:"T1659 — under Initial Access"},{l:"Injected channel later delivers another tool",r:"T1659 — also Command and Control, with T1105"},{l:"Poisoning LLMNR inside the office",r:"T1557.001 — not T1659"},{l:"Staging content and waiting for victims",r:"T1608.004 — then T1189, not T1659"},{l:"Password spraying an RDP portal",r:"T1110 — not T1659"}],
hint:"Two behaviours belong to T1659's two tactics; three belong to neighbour techniques entirely.",
explain:"<p>Foothold from an injected reply is <b>T1659 under Initial Access</b>; the same channel delivering another tool is <b>T1659 under Command and Control, pairing with T1105</b>. LLMNR poisoning inside the enterprise is <b>T1557.001</b> — the AiTM boundary ATT&CK draws. Staging content and waiting for visitors is <b>T1608.004</b> (then T1189) — the exact pattern T1659 contrasts itself with. Password spraying is <b>T1110</b> — nothing to do with injected content.</p>"},
{id:"x03",type:"branch",title:"Signed payload conflict",summary:"Valid signature, unknown channel — four decisions with real cost.",
scenario:{summary:"Resolve the contradiction before you act.",
intro:"<p>09:30. IDS alert: unsolicited duplicate HTTP response, content-type mismatch, delivering <code>agent_update.bin</code>. EDR: it executed on two workstations. Twist: the binary is <b>signed with the vendor's valid certificate</b>. The domain is in no TI list. WSUS is your normal update channel; the fleet patching window opens tonight. CISO wants a decision in 15 minutes.</p>",
artefacts:[{label:"ARTEFACT 1 — IDS + EDR",code:"dup-response unsolicited, content-type mismatch\ndomain : update[.]vendor-agent[.]example (not in TI feeds)\npayload: agent_update.bin — Authenticode signature VALID (chain ok)\nhost s : ws-2210, ws-2211 executed it",light:false},
{label:"ARTEFACT 2 — Change records",code:"WSUS serves ALL fleet updates from 10[.]1[.]0[.]60\nNo change record for update[.]vendor-agent[.]example\nVendor contract: updates ship ONLY via the WSUS package",light:true}]},
hint:"A signature proves who built the binary, not who delivered it. Check the normal channel before you touch the firewall.",
steps:[
{q:"Signature valid, domain unknown. Best next move?",short:"Gather evidence: revocation plus the normal channel",
 options:[{id:"A",text:"Gather more evidence: check revocation and how the fleet normally receives this update"},{id:"B",text:"Declare a false positive — signed binaries are safe"},{id:"C",text:"Block the domain fleet-wide right now"},{id:"D",text:"Reimage the two workstations immediately"}],correct:"A"},
{q:"Channel check done: this domain is NOT the vendor's channel; WSUS is. Revocation on the cert was requested an hour ago. Decide.",short:"Block domain at egress; WSUS keeps patching",
 options:[{id:"A",text:"Block the domain at egress and let WSUS patching proceed as normal"},{id:"B",text:"Do nothing — the signature is proof of safety"},{id:"C",text:"Open the firewall so staff fetch updates from the new domain directly"},{id:"D",text:"Disable WSUS and move fleet updates to the new domain"}],correct:"A"},
{q:"Legal asks what you can claim about the injection source.",short:"Claim upstream injection, actor unknown",
 options:[{id:"A",text:"Duplicate unsolicited responses upstream of our boundary support an upstream-injection claim; the actor is unknown"},{id:"B",text:"We can state the vendor did it"},{id:"C",text:"We can claim our own proxy was hacked — the logs do not matter"},{id:"D",text:"We cannot put any claim in writing, ever"}],correct:"A"},
{q:"Which standing control package do you recommend afterwards?",short:"Keep TLS/VPN plus IDS checks plus PCAP sampling",
 options:[{id:"A",text:"Keep M1041 TLS/VPN on the sensitive link, retain IDS content checks and PCAP sampling"},{id:"B",text:"Drop TLS so IDS can see everything again"},{id:"C",text:"Rely only on signature checks going forward"},{id:"D",text:"Stop patching to reduce the attack surface"}],correct:"A"}],
explain:"<p><b>Step 1 — gather evidence.</b> The contradiction (valid signature vs unknown delivery channel) is resolved by facts: revocation status and the normal distribution channel. Blocking now risks breaking legitimate patching for nothing — the real cost of a hasty 'best practice'.</p><p><b>Step 2 — block, cheaply.</b> The domain is not the vendor's channel, so the egress block costs nothing: WSUS keeps patching tonight. Options C and D would move the fleet onto the attacker's channel; B trusts the wrong signal.</p><p><b>Step 3 — calibrated claim.</b> You can defend 'upstream injection, actor unknown' — nothing more. Naming the vendor would be defamation; 'nothing in writing' abandons your duty.</p><p><b>Step 4 — layered.</b> Keep encryption AND detection: each covers the other's blind spot. Signature-only defence is exactly what this incident defeated.</p>"},
{id:"x04",type:"terminal",title:"Evidence under the clock",summary:"Capture the injected traffic before failover — 3:00 timer.",
scenario:{summary:"The tap goes dark in minutes. Preserve the evidence.",
intro:"<p>04:58. The provider will <b>fail over the link in minutes</b>; tap path <code>tap0</code> goes dark with it. The ministry needs evidence of the injected DNS and HTTP sessions, preserved so it survives scrutiny. Choose commands as if a court will read them.</p>"},
question:"Start the evidence capture now: interface tap0, write to /var/tmp/embassy_inc.pcap, DNS and HTTP traffic only.",
deadlineSec:180,
shell:{
banner:"Ubuntu 22.04 — gateway tap host (root) — LIVE INCIDENT\nLink failover imminent. The capture IS the evidence.\nNo tool name is given. The safe command beats the fast one.",
prompt:"root@gw-tap:~# ",
note:"This exercise runs under its own 3:00 timer (shown above). It ticks only while the exam timer runs and stops when you press Check.",
expectRe:/^tcpdump(?=[^;|]*\btap0\b)(?=[^;|]*-w\s+\/var\/tmp\/embassy_inc\.pcap\b)/,
out:"listening on tap0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n^C\n11890 packets captured\n11890 packets received by filter\n0 packets dropped by kernel",
errOut:"tcpdump: argument error — nothing captured\n(usage line printed)",
elements:[{re:/(^|\s)tcpdump(\s|$)/,label:"tcpdump"},{re:/(^|\s)-i\s+tap0(\s|$)/,label:"-i tap0 (the live tap interface)"},{re:/(^|\s)-w\s+\/var\/tmp\/embassy_inc\.pcap\b/,label:"-w /var/tmp/embassy_inc.pcap (fresh evidence file)"},{re:/port\s+(53|80)\b/,label:"a DNS/HTTP port filter (53 or 80)"}],
forbidden:[{re:/(service\s+network\s+(re)?start|systemctl\s+restart\s+network)/,label:"restarting the network service",out:"\u26a0 tap0 bounced — the live evidence stream was interrupted",warn:"Restarting networking bounces the interface and drops the very traffic you must preserve. Never change state during evidence collection."},
{re:/(rm\s+-[a-z]*r[a-z]*f?[a-z]*\s+\/var\/tmp|>\s*\/var\/tmp\/embassy_inc)/,label:"destroying the evidence path",out:"\u26a0 existing evidence destroyed",warn:"rm or a shell redirect on the evidence path destroys prior captures. -w on a fresh name is the safe form."},
{re:/(^|\s)-c\s*1\b/,label:"capturing a single packet (-c 1)",out:"1 packet captured — not enough to survive scrutiny",warn:"-c 1 stops after one packet; a one-packet record does not survive legal scrutiny."}],
canon:"tcpdump -i tap0 -w /var/tmp/embassy_inc.pcap port 53 or port 80",
canonExpl:"<ul><li><b>tcpdump -i tap0</b> — capture the live monitored path before it disappears.</li><li><b>-w fresh file</b> — raw packets to disk; nothing overwritten, nothing truncated.</li><li><b>port 53 or port 80</b> — DNS plus the plain-HTTP flow where the injection happened.</li><li>The judgement under pressure: read-only, fresh file, right interface. Restarting networking or truncating the file would have destroyed the case.</li></ul>",
deadlineNote:"Reduced per-exercise timer: 3 minutes. It stops on Check."},
hint:"Restate the constraint only: the link dies soon and the file must survive scrutiny.",
explain:"<p>Canonical: <code>tcpdump -i tap0 -w /var/tmp/embassy_inc.pcap port 53 or port 80</code>. Under time pressure the command is the easy part — the judgement is <b>read-only, fresh file, right interface</b>. Restarting the network service bounces the tap; rm or a redirect destroys evidence; -c 1 preserves almost nothing. When the failover hit, this capture kept the ministry's case alive.</p>"},
{id:"x05",type:"match",title:"Legal evidence",summary:"Match each artefact to what it can prove.",
scenario:{summary:"What proves WHERE it happened?",
intro:"<p>The ministry's legal team asks what each artefact can actually prove: 'What is decisive for proving the injection happened outside our boundary?' Pair each artefact with the honest answer.</p>"},
question:"Match each artefact to what it proves.",
pairs:[{l:"Unsolicited duplicate response upstream, enterprise components clean",r:"Proves the injection sits outside your boundary"},{l:"EDR process tree on the diplomat workstation",r:"Proves what executed on the host, not where injection happened"},{l:"Firewall deny counts for the last month",r:"Proves only what your firewall blocked"},{l:"Printer outage ticket from the same morning",r:"Proves nothing about the incident"}],
hint:"Legal needs proof about a place; one artefact is noise.",
explain:"<p>The decisive artefact answers <b>where</b>: an unsolicited duplicate arriving on the path <b>while every enterprise component shows clean</b> — the injection sits outside your boundary, on the upstream path. The EDR tree proves host-side execution; deny counts prove firewall behaviour; the printer ticket is noise. This is the artefact that anchors the diplomatic protest.</p>"},
{id:"x06",type:"multi",title:"M1041 limits",summary:"Why the VPN alone is not 'done'.",
scenario:{summary:"Pressure-test the mitigation claim.",
intro:"<p>The ministry proposes: 'Just buy a VPN (M1041) and we are done.' Select every true statement.</p>"},
question:"Which statements are TRUE?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"Some victim flows may still use plain HTTP and stay injectable"},{id:"B",text:"The lawful-intercept system on the path may itself be the trusted VPN path"},{id:"C",text:"Encryption cannot undo a payload that was already delivered"},{id:"D",text:"M1041 does not block payloads — M1021's file-type restriction is a separate control"},{id:"E",text:"Once a VPN is installed, injection becomes impossible"}],
correct:["A","B","C","D"],
hint:"Count what encryption does NOT cover: unencrypted flows, the provider itself, past deliveries, and execution.",
explain:"<p>M1041 protects <b>encrypted</b> flows against <b>third parties</b>. It does not cover legacy plain-HTTP flows (A). It cannot help when the trust anchor — the provider or the intercept system — IS the injector (B): MoustachedBouncer's ISP-level access is exactly that scenario. It is not retroactive (C). And it never blocks execution — that is M1021's job (D). The 'done' claim (E) collapses on all four.</p>"},

scenario:{summary:"Same request id, two answers.",
intro:"<p>Proxy records from the incident window. The duplicates reuse the request id of a legitimate line — two answers to one request.</p>",
logs:[{label:"ARTEFACT 1 — Proxy record (filterable)",lines:[
"04:59:01 GET /portal id=8811 resp=200 text/html bytes=12044 rtt=0.22s",

"05:02:44 GET /portal id=8814 resp=200 text/html bytes=12051 rtt=0.20s",
"05:05:12 GET /portal id=8820 resp=200 text/html bytes=12049 rtt=0.21s",
"05:09:03 GET /api/status id=8831 resp=200 application/json bytes=402 rtt=0.18s",
"05:12:29 GET /portal id=8844 resp=200 text/html bytes=12044 rtt=0.22s",
"05:12:29 GET /portal id=8844 resp=200 application/octet-stream bytes=2211 rtt=0.71s dup unsolicited",
"05:15:50 GET /portal id=8851 resp=304 - bytes=0 rtt=0.05s",

"05:21:16 GET /portal id=8863 resp=200 text/html bytes=12052 rtt=0.23s"]}]},
question:"Select the TWO lines that prove the injected duplicates on /portal.",
selectNote:"Two correct lines. Wrong picks subtract from correct ones. The duplicates share their request id with a legitimate line.",
options:[{id:"A",text:"04:59:01 GET /portal id=8811 ... application/octet-stream ... dup unsolicited"},{id:"B",text:"05:12:29 GET /portal id=8844 ... application/octet-stream ... dup unsolicited"},{id:"C",text:"05:02:44 GET /portal id=8814 ... text/html bytes=12051"},{id:"D",text:"05:15:50 GET /portal id=8851 resp=304 - bytes=0"}],

explain:"<p>Both <b>dup unsolicited</b> lines reuse the request id of a legitimate response — two answers to one request, the attacker's injected copy, 400+ ms late but accepted. The plain 200s and the 304 are normal. Together the pairs prove the race on <b>/portal</b> ran twice during the window — and give legal the ids to cite.</p>"},
{id:"x08",type:"order",title:"Senior sequence",summary:"Order the five actions under pressure.",
scenario:{summary:"What comes first when everyone is watching?",
intro:"<p>The embassy incident is confirmed. The CISO, legal and the CERT are waiting. Sequence the five actions.</p>"},
question:"Order the five actions first-to-last.",
items:[{id:"p1",text:"Preserve volatile evidence: PCAP before link failover"},{id:"p2",text:"Brief CISO and legal; alert the national CERT through the diplomatic channel"},{id:"p3",text:"Block the delivery domain at egress in a coordinated window"},{id:"p4",text:"Rotate credentials for sessions exposed on the injected channel"},{id:"p5",text:"Add standing controls: TLS/VPN (M1041), file-type restriction (M1021), IDS content checks"}],
hint:"Evidence first, then the people who must know, then the block, then cleanup, then the durable fixes.",
explain:"<p>1) Preserve the <b>PCAP</b> — it dies with the link. 2) Brief <b>CISO/legal/CERT</b> — diplomatic incidents need coordinated language before actions tip anyone off. 3) The <b>coordinated egress block</b>. 4) Rotate <b>credentials</b> that crossed the injected channel. 5) The durable package: <b>M1041 + M1021 + detection</b>. <b>Attacker view:</b> an uncoordinated block just tells the operator to move infrastructure. <b>Defender view:</b> sequencing protects evidence first and relationships second.</p>"},

{id:"x09",type:"fill",title:"Report capstone",summary:"Complete the five-blank incident report.",
scenario:{summary:"The report must carry the right IDs.",
intro:"<p>The incident report goes to the ministry tomorrow. Fill all five blanks; the bank contains near-misses on purpose.</p>"},
question:"Complete the five blanks of the report.",
selectNote:"Five blanks, one bank. Near-miss IDs are in the list.",
text:"REPORT: An unsolicited ___ reply racing a legitimate response redirected a diplomat's browser to hxxp://update-win11[.]example. Behaviour matches ATT&CK ___ (Content Injection), tactics ___ and ___; the diplomat's Windows workstation was covered by analytic ___.",
answers:["HTTP","T1659","Initial Access","Command and Control","AN0992"],
bank:["HTTP","T1659","T1557","Initial Access","Command and Control","AN0992","AN0993","DNS"],
hint:"Restate the constraint: the racing reply answered a page request; the diplomat's workstation runs Windows; the two tactics are the ones on the page.",
explain:"<p><b>HTTP</b> — the unsolicited racing reply on the portal request (the embassy artefacts show the duplicate arriving on the plain-HTTP GET). <b>T1659</b> — Content Injection (T1557 is the enterprise-AiTM near-miss). Tactics <b>Initial Access</b> and <b>Command and Control</b> — both listed on the page. <b>AN0992</b> — the Windows analytic (AN0993 is the Linux near-miss; the diplomat host is Windows). A report with the right IDs survives legal and peer review; near-miss IDs poison it.</p>"},
{id:"x10",type:"fill",title:"DoH proposal",summary:"A best practice that is wrong here.",
scenario:{summary:"Refuse the proposal with a reason.",
intro:"<p>After the incident, a SOC lead proposes: 'Enable DNS-over-HTTPS fleet-wide. Encrypted DNS stops DNS injection — best practice.' Your detection stack relies on resolver logs and PCAP DNS views.</p>"},
question:"Complete the three blanks that explain the refusal.",
text:"Fleet-wide DoH takes away your own resolver and PCAP view of ___ traffic, and it does nothing against injection into ___ replies or ___ replies.",
answers:["DNS","HTTP","SMB"],
bank:["DNS","HTTP","SMB","TLS","ICMP","ARP"],
hint:"Restate the constraint: DoH encrypts one protocol's replies; the campaign used three.",
explain:"<p>DoH encrypts DNS <b>against your own visibility</b> too — the AN0993-style resolver and PCAP checks lose their <b>DNS</b> view, and the incident's key evidence (injected DNS replies) would have been invisible. And the campaign injected into <b>HTTP</b> and <b>SMB</b> as well, which DoH does not touch. A best practice is only right when it fits the environment: here it shrinks coverage without removing the threat.</p>"},
{id:"x11",type:"branch",title:"Attribution discipline",summary:"Calibrate the attribution claim in three steps.",
scenario:{summary:"The minister wants a name. The evidence says otherwise.",
intro:"<p>Overlap with the publicly reported MoustachedBouncer playbook is strong: ISP-level access abuse, diplomat targeting in the region, injected DNS/HTTP/SMB replies, fake Windows Update lure. BUT: a different ISP and a different country than the published cases. The minister's office wants a name today.</p>"},
hint:"Restate the constraint: the playbook matches but the infrastructure does not. Confidence follows the weaker of the two.",
steps:[
{q:"Attribution confidence you can defend today?",short:"Moderate: playbook match, different infra",
 options:[{id:"A",text:"Moderate — the playbook matches, the infrastructure differs"},{id:"B",text:"Definitive — it is the same state programme"},{id:"C",text:"Zero — a different ISP means no relation at all"}],correct:"A"},
{q:"Which evidence would RAISE confidence?",short:"Shared infrastructure, tooling or timing",
 options:[{id:"A",text:"Shared infrastructure, tooling or timing patterns with the published cases"},{id:"B",text:"The fact that the embassy is politically important"},{id:"C",text:"A senior officer's hunch"},{id:"D",text:"The printer outage during the incident"}],correct:"A"},
{q:"What goes into the public-facing statement?",short:"TTP overlap only — no actor named",
 options:[{id:"A",text:"TTP overlap with publicly reported activity; no actor named"},{id:"B",text:"The full state attribution with all evidence"},{id:"C",text:"A statement that nothing happened"},{id:"D",text:"A list of suspects"}],correct:"A"}],
explain:"<p><b>Step 1 — moderate.</b> Strong <b>TTP overlap</b> with different <b>infrastructure</b> supports a moderate judgement, nothing stronger. 'Definitive' outruns the evidence; 'zero' ignores a real playbook match.</p><p><b>Step 2 — what would move it.</b> Shared infrastructure, tooling or timing patterns are the artefacts that legitimately raise confidence. Political importance and hunches are not evidence.</p><p><b>Step 3 — public language.</b> 'TTP overlap with publicly reported activity; no actor named' is defensible under scrutiny. Claiming state attribution on TTPs alone is the overreach that ends careers and damages cases.</p>"},
{id:"x12",type:"fill",title:"Coverage gap",summary:"Close the macOS gap properly.",
scenario:{summary:"Two analytics tuned, one platform dark.",
intro:"<p>Your SOC runs tuned AN0992 (Windows) and AN0993 (Linux). The macOS fleet has no coverage. Leadership asks for the three-part closing move. 'Skip it' and 'run the macOS analytic on other platforms' are the traps to refuse.</p>"},
question:"Complete the three blanks of the coverage-closing move.",
text:"Ship AN0994-style ___ forwarding for macOS; deploy ___ on macOS to catch browser-child executions; and add an M1021-style ___-type restriction as a compensating mitigation meanwhile.",
answers:["unified log","EDR","file"],
bank:["unified log","EDR","file","Firewall rule","Honeypot","DLP agent"],
hint:"Restate the constraint: the gap is macOS telemetry; the page names the macOS log source; and M1021 restricts what by type?",
explain:"<p>The valid move has three parts: collect <b>macOS unified logs</b> (AN0994's data source), add <b>EDR</b> to catch the same browser-child pattern, and use <b>M1021</b> file-type restriction as a compensating mitigation while telemetry lands. 'Safari's sandbox makes this impossible' is factually wrong — the page lists macOS as a T1659 platform and AN0994 exists for it. Running AN0994 on Linux servers detects nothing: analytics are platform-specific.</p>"},
{id:"x13",type:"terminal",title:"Unified log query",summary:"Fake terminal: macOS log query for the Safari child.",
scenario:{summary:"Query the unified log like AN0994 does.",
intro:"<p>macOS analyst workstation <code>mac-118</code>, Terminal.app, log access granted. AN0994 hunts processes spawned from <b>Safari</b>. The incident window is the <b>last 30 minutes</b>. No tool is named.</p>"},
question:"Query the unified log for the last 30 minutes, filtered to Safari process events.",
shell:{
banner:"mac-118 — zsh — analyst (unified log access)\nObjective: unified-log query, last 30 minutes, Safari process filter.\nChoose the tool yourself.",
prompt:"analyst@mac-118 ~ % ",
expectRe:/^log\s+show(?=[^;|]*--last\s+30m(in)?\b)(?=[^;|]*--predicate\b)/,
out:"Timestamp            Process        Event\n09:14:42.117         Safari         NSWorkspace launch of launcher.sh (child process)\n09:14:43.891         Safari         Safari downloaded launcher.sh to ~/Downloads\n(2 events shown)",
errOut:"zsh: invalid option for log\n(usage line printed)",
elements:[{re:/(^|\s)log\s+show(\s|$)/,label:"the 'log show' tool"},{re:/(^|\s)--last\s+30m(in)?(\s|$)/,label:"--last 30m (the incident window)"},{re:/(^|\s)--predicate(\s|$)/,label:"--predicate (the filter mechanism)"},{re:/process\s*==\s*['\"]?safari/,label:"a predicate naming Safari as the process"}],
forbidden:[{re:/(^|\s)rm\s|(^|\s)erase\s|(^|\s)clear\s+log/,label:"deleting or clearing log data",out:"\u26a0 log store modification denied",warn:"Deleting or clearing log data destroys the evidence AN0994 relies on."},
{re:/(^|\s)--last\s+[4-9]\d?\s?[hmd]|--last\s+[1-9]\d\d+\s?[hmd]/,label:"a window that misses the 30-minute incident",out:"(query returned — but the window does not match the brief)",warn:"A wider or shifted window drowns the signal or misses the incident. The brief says: last 30 minutes."}],
canon:"log show --last 30m --predicate 'process == \"Safari\"'",
canonExpl:"<ul><li><b>log show</b> — reads the macOS unified log.</li><li><b>--last 30m</b> — bounds the query to the incident window.</li><li><b>--predicate</b> — filters events; here events whose <b>process</b> is Safari — the browser whose children AN0994 watches.</li><li>This is the AN0994 workflow: browser child, immediate script/executable load — a log query, not a packet capture.</li></ul>"},
hint:"Restate the constraint only: last 30 minutes, and the filter must name Safari.",
explain:"<p>Canonical: <code>log show --last 30m --predicate 'process == \"Safari\"'</code>. Three elements make the query: the tool, the window, the filter. The output shows Safari's own events around the launch of <code>launcher.sh</code> — the AN0994 pattern. A wrong window buries or misses the signal; a cleared log store destroys the evidence entirely. Second terminal skill in this file: query, do not capture.</p>"},
{id:"x14",type:"choice",title:"Which signal wins?",summary:"Resolve the contradiction explicitly.",
scenario:{summary:"Signature vs channel.",
intro:"<p>Two signals conflict. The <b>fake update domain</b> delivered the payload through an unsolicited injected reply. The <b>binary's signature</b> was valid at download time.</p>"},
question:"Which signal wins, and why?",
options:[{id:"A",text:"Delivery wins — a signature proves the publisher, not the channel"},{id:"B",text:"The signature wins — a valid signature means the binary is safe"},{id:"C",text:"Neither wins — the signals cancel and no decision is possible"},{id:"D",text:"The newest TLS version on the flow decides which signal wins"}],
correct:"A",
hint:"Restate the constraint: the attacker does not need to forge the binary — only the delivery.",
explain:"<p>The attacker reused a legitimately signed binary — or signed their own with a valid-but-abused cert — and changed <b>where it came from</b>. Signatures authenticate the publisher; they say nothing about the distribution channel. The injected <b>channel evidence</b> decides. This contradiction is the trap that lets signed malware sail through signature-only defences — and why the channel is what your analytics must watch.</p>"},
{id:"x15",type:"drag",title:"Confidence buckets",summary:"Sort the briefing claims by evidence strength.",
scenario:{summary:"Facts, inference, and the claim you must refuse.",
intro:"<p>Your CTI briefing must separate facts from inference. Drag each claim into the right bucket — one claim per slot. One card belongs to no bucket.</p>"},
question:"Drag each claim to its evidence bucket.",
slots:[{label:"High confidence — page fact (1)"},{label:"High confidence — page fact (2)"},{label:"Moderate — pattern overlap only"},{label:"Unsupported — do not claim"}],
bank:[{text:"Injected into DNS, HTTP and SMB replies",ok:true,slot:0},{text:"Fake Windows Update page was the lure",ok:true,slot:1},{text:"ISP-level access abuse consistent with the reported playbook",ok:true,slot:2},{text:"A named government ordered this operation",ok:true,slot:3},{text:"The group uses only macOS devices",ok:false}],
hint:"Restate the constraint: two claims are page facts, one is an inference, and one is the claim you must refuse to make.",
explain:"<p><b>High confidence:</b> injected DNS/HTTP/SMB replies and the fake Windows Update lure are stated on the T1659 page (MoustachedBouncer G1019, Disco S1088). <b>Moderate:</b> ISP-level abuse inferred from overlap needs hedged wording. <b>Unsupported:</b> naming a government exceeds the evidence — refuse it. The macOS-only claim is bait: the page lists three platforms, and 'only macOS' is supported by nothing.</p>"},
{id:"x16",type:"multi",title:"Review the draft",summary:"Find the planted mistakes in the finding.",
scenario:{summary:"Three mistakes hide in the draft.",
intro:"<p>Draft finding, ready for the ministry — or so a colleague thinks:</p>",
artefacts:[{label:"ARTEFACT 1 — Draft finding (excerpt)",code:"'...attributed to technique T1557 Content Injection.\n Origin host 10[.]0[.]4[.]7 delivered the payload (IOCs defanged).\n Platforms affected: Windows only.\n Content Injection is a mitigation we should adopt.\n Attached: full PCAP, hash list...'",light:true}]},
question:"Select ALL mistakes in the draft.",
selectNote:"Three mistakes are planted. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"Wrong technique ID — T1557 is AiTM; Content Injection is T1659"},{id:"B",text:"Wrong platform claim — the page lists Linux, Windows and macOS"},{id:"C",text:"Content Injection is a technique, not a mitigation"},{id:"D",text:"The IOC line writes the IP as 10[.]0[.]4[.]7"}],
correct:["A","B","C"],
hint:"Restate the constraint: one ID swap, one platform claim, one object-type mix-up. The defanged IP line is correct.",
explain:"<p>Three real mistakes: <b>T1557</b> is Adversary-in-the-Middle — Content Injection is <b>T1659</b>; the platform claim is wrong — the page lists <b>Linux, Windows and macOS</b>, so 'Windows only' understates scope; and Content Injection is a <b>technique</b>, not a mitigation — you adopt mitigations like M1041 and M1021, you do not adopt techniques. The defanged IP line is <b>correct</b> practice: 10[.]0[.]4[.]7 cannot be clicked. A finding with a wrong ID or an unchecked platform claim gets bounced in review.</p>"}
];
