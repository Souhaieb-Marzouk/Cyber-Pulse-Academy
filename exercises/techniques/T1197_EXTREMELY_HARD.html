var META={"topicId":"t1197","mitreId":"T1197","name":"BITS Jobs","mitreName":"BITS Jobs","objectType":"technique","title":"T1197 BITS Jobs — EXTREMELY HARD","difficulty":"extremely-hard","severity":"extremely-hard","severityLabel":"EXTREMELY HARD","batch":4,"questionCount":15,"estimatedMinutes":28,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Welcome to the EXTREMELY HARD room — the one where the BITS desk gets a live incident.<\/b> T1197, BITS Jobs, is a Technique in MITRE ATT&amp;CK: adversaries abuse the Windows Background Intelligent Transfer Service — a trusted, low-priority transfer service — to download payloads, run hidden notify commands, persist for up to 90 days, clear their tracks with /complete, and even exfiltrate data with upload jobs. In the earlier exams you learned the tools, the PowerShell road, the event log, and the near-miss traps. Here you put all of that to work at once, the way it happens in real work.<\/p><p>These fifteen exercises follow one live case at a fictional company: an updater-lookalike job name, a lookalike domain nine days old, a hijacked service account, and a month-end close that cannot stop. You will resolve conflicting evidence explicitly, choose containment that does not cost the business more than the intrusion, rank evidence-preserving actions before destructive ones, and sometimes answer \"do nothing yet — escalate\". You will decide when common best practice is wrong for this estate, and you will type compound capture-then-act commands in the correct order.<\/p><p>This is the register of senior work: a SOC incident commander holding a bridge, an IR lead on a client call, a threat hunter validating a hypothesis, a detection engineer scoping a rule, and a CTI analyst attributing with care. Take your time — twenty-eight minutes — read every artefact twice, and expect several options to be almost right. In this room, the almost-right ones are the trap.<\/p>","themes":[{"name":"BITS fundamentals","concepts":["compound command authoring"]},{"name":"Attacker behaviours with BITS","concepts":["updater-like job naming","upload-based exfiltration","SetNotifyCmdLine persistence mechanics","complete-switch indicator removal","BITS tradecraft advantage"]},{"name":"Spotting abuse in telemetry","concepts":["conflicting signals","DET0098 chain correlation","owner-logged-on condition"]},{"name":"Known threat actors","concepts":["documented procedures","Bazar download via BITS"]},{"name":"Mitigation and response","concepts":["evidence-safe vs destructive","containment under pressure","real-cost trade-off","escalate-or-wait decision","M1037 Filter Network Traffic","M1028 Operating System Configuration"]}]};
var EXERCISES=[{"id":"EX-01","type":"line-select","summary":"SRV-FS01: mark the four lines that resolve the NW-Upd-Agent conflict","concepts":["conflicting signals","DET0098 chain correlation"],"artifactNote":"Bridge timeline SRV-FS01, 06:12–08:24 — Bits-Client events, DNS enrichment, process spawns","scenario":"<p>You are the duty IR lead for Northwind Traders. It is 08:20 on the last business day of the month. The finance close is running on SRV-FS01, the file server that hosts the close workbooks, and the CFO has already called twice about downtime. The network bridge team has raised P1 ticket IR-2025-0142 on an updater-looking BITS job. The job is named <span class=\"mono\">NW-Upd-Agent<\/span> — it slots into our internal updater naming scheme as neatly as the real ones do. Its owner is <span class=\"mono\">svc_patch<\/span>, the same trusted service account that legitimately runs the nightly <span class=\"mono\">WSUS-Pull<\/span> job against the internal WSUS host. On paper, every label in that sentence is trusted, and that is the problem.<\/p><p>The conflict you must resolve is simple to state and hard to certify. The name and the owner say <i>internal updater<\/i>. The egress team says the job's destination is <span class=\"mono\">nwtrd-updates[.]example<\/span> — one character different from our own domain. SRV-FS01 has no EDR agent, so the evidence is the bridge timeline below plus a DNS enrichment from your CTI feed. Incomplete data is part of the case: the dropped file has not been recovered, and the second creation event at 08:23 has no capture attached yet. The DET0098 chain rule needs three anchors — creation with a destination, transfer, and notify execution — and the review board wants the anchors that also resolve the conflict, not just any activity lines. Click those four lines.<\/p>","question":"<p>Select the <b>four<\/b> timeline lines that together resolve the name-versus-destination conflict and complete the T1197 chain on SRV-FS01.<\/p>","hint":"Byte counts prove a transfer happened but not where — the resolving lines carry the destination URL, the domain age, the notify event, and the child process.","explanation":"<p>The four resolving lines are 2, 3, 5 and 6. Line 2 pairs the job name with its destination URL — the lookalike <span class=\"mono\">nwtrd-updates[.]example<\/span> — so the familiar name is no longer evidence by itself. Line 3 dates that domain at nine days old, which no legitimate Northwind updater domain would be. Line 5 is the notify event proving the job executed a command. Line 6 is the spawn record: <span class=\"mono\">rundll32.exe<\/span> running under <span class=\"mono\">svchost.exe -k netsvcs -s BITS<\/span> — the T1197 execution anchor, and a process chain no real updater here produces. The lines you left out matter too: line 1 is the genuine WSUS-Pull baseline from the same owner, which makes a hijacked <span class=\"mono\">svc_patch<\/span> plausible rather than exotic; line 4 confirms a transfer but carries no destination and no process, so it supports the chain without resolving the conflict; line 7 shows recurrence but has no capture, so it scopes the case rather than proving it; line 8 is a scheduled WMI health probe, plain noise. Together the four clicked lines give destination, domain age, trigger, and execution — a complete T1197 chain behind a trusted-looking job.<\/p>","study":"ATT&CK T1197 detection strategy: correlate job creation, transfer, and notify-command execution across sources before verdicts.","logLines":["06:12:44  bits  EID 59  job created:  name=WSUS-Pull  owner=NWTRADER\\svc_patch  url=hxxp[:]//wsus[.]nwtraders[.]example/wu[.]cab","07:41:10  bits  EID 59  job created:  name=NW-Upd-Agent  owner=NWTRADER\\svc_patch  url=hxxp[:]//nwtrd-updates[.]example/u[.]bin","07:41:12  dns   SRV-FS01 resolved nwtrd-updates[.]example at 185[.]199[.]110[.]153  (TI note: domain registered 9 days ago; no other estate resolver hits)","07:42:05  bits  EID 3   transfer complete:  job=NW-Upd-Agent  bytes=71,680","07:42:06  bits  EID 25  notify command:  job=NW-Upd-Agent  cmd=C:\\ProgramData\\upd\\u[.]bin","07:42:07  proc  svchost.exe -k netsvcs -s BITS spawned C:\\Windows\\System32\\rundll32.exe C:\\ProgramData\\upd\\u[.]bin,RunUpdates","08:23:19  bits  EID 59  job created:  name=NW-Upd-Agent  owner=NWTRADER\\svc_patch  url=hxxp[:]//nwtrd-updates[.]example/u2[.]bin  (no capture yet)","08:24:51  proc  wmiprvse.exe  WMI health probe (scheduled, hourly)"],"badLines":[1,2,4,5]},{"id":"EX-02","type":"qcm-single","summary":"Resolve the NW-Upd-Agent name-versus-domain conflict for the P1 bridge","concepts":["conflicting signals","updater-like job naming","BITS tradecraft advantage"],"scenario":"<p>You take the presenter's chair on the P1 bridge at 08:40. Twelve people are waiting for one word: malicious or benign. The case so far: SRV-FS01 is running a BITS job called <span class=\"mono\">NW-Upd-Agent<\/span>, and every label on it looks legitimate. The name follows our internal updater naming scheme, and the owner <span class=\"mono\">svc_patch<\/span> is the trusted account that legitimately runs the nightly <span class=\"mono\">WSUS-Pull<\/span> job against <span class=\"mono\">wsus[.]nwtraders[.]example<\/span>.<\/p><div class=\"ticket\"><span class=\"k\">P1 IR-2025-0142<\/span> · SRV-FS01 · job NW-Upd-Agent · owner svc_patch · dest nwtrd-updates[.]example (CTI: registered 9 days ago) · notify cmd rundll32.exe C:\\ProgramData\\upd\\u[.]bin,RunUpdates · month-end close ends 17:00 · EDR: not installed<\/div><p>The update team has no record of any job with this name, and the real updater ships signed binaries from the WSUS host only. The destination is the first tell: <span class=\"mono\">nwtrd-updates[.]example<\/span> is one character away from our own domain, it is nine days old, and no other host in the estate has ever resolved it. The notify chain is the second tell: on completion the job ran <span class=\"mono\">rundll32.exe<\/span> from <span class=\"mono\">C:\\ProgramData\\upd\\<\/span> under <span class=\"mono\">svchost.exe -k netsvcs -s BITS<\/span>, which no updater in our baseline does. This is exactly where the BITS tradecraft advantage cuts: a trusted service, firewall-allowed egress, no new files or registry keys, job state hidden in the job database. Everything about this channel is designed to look like routine maintenance, including the name. The sandbox verdict on <span class=\"mono\">u[.]bin<\/span> is still queued, so binary confirmation is not available yet. Incomplete data cuts both ways: we cannot yet name the payload family, but we do not need it to answer the question on the table. The bridge chair asks you to commit to a verdict now, on the evidence in the ticket.<\/p>","question":"<p>Which single verdict does the evidence actually support? Resolve the name-versus-destination conflict explicitly.<\/p>","hint":"The naming scheme is not the evidence in question — check which facts in the ticket carry the destination and the process chain.","explanation":"<p>The verdict is <b>malicious<\/b>. Option 1 fails because an updater-style name is trivially copyable — mimicking a trusted naming scheme is a documented camouflage, and no real updater owns this job. Option 2 fails because trusted accounts get hijacked: <span class=\"mono\">svc_patch<\/span>'s own baseline job goes to the internal WSUS host, never to a nine-day-old lookalike. Option 3 is wrong because waiting for the sandbox withholds a decision the destination and chain evidence already support, and it burns response time on a live P1. The correct verdict, option 4, is the one the resolving evidence forces: spoofed trust in the name, a lookalike domain nine days old, and a rundll32 notify chain under the BITS service — abuse, stated explicitly despite the missing binary verdict.<\/p>","study":"Threat hunting methodology: weigh destination and chain evidence over labels when artefacts conflict.","options":["Benign — the updater-style job name matches our internal naming scheme, so this is a naming collision with the real updater","Benign — svc_patch is a trusted service account, and a trusted account cannot be used to stage attacker tooling","Inconclusive — the bridge must wait for the sandbox verdict on u[.]bin before saying anything at all","Malicious — the updater-like name is spoofed trust; the 9-day-old lookalike domain, the rundll32 notify chain, and the recurrence decide it"],"correct":3},{"id":"EX-03","type":"fill-blank","summary":"IR note: write the freeze-first capture command for the suspect job","concepts":["evidence-safe vs destructive"],"artifactNote":"Runbook note IR-2025-0142 — freeze-first step-1 command with blanks","scenario":"<p>The freeze-first rule goes into the runbook note tonight, and the IR lead wants it written so that even the 03:00 helpdesk shift cannot get it wrong. The situation: SRV-FS01 carries at least three <span class=\"mono\">NW-Upd-Agent<\/span> jobs and one legitimate <span class=\"mono\">WSUS-Pull<\/span> job, all in the same job queue. A helpdesk engineer has already offered \"just run the reset, it lists everything\" in the bridge chat — which is precisely the instinct the note must kill. <span class=\"mono\">bitsadmin /reset<\/span> cancels every job in the queue and clears their entries from the job database, so the quick look would delete the evidence it was looking for. The note therefore fixes one command for step 1: a read-only display of the suspect job's full state, redirected into the case share. Only switches that <i>display<\/i> state qualify; anything that <i>changes<\/i> state — cancel, reset, complete — belongs to step 2 behind change-control. The output file already exists on the case share and is write-only for the helpdesk role. The IR lead will paste this command verbatim into three runbooks, so spelling counts. Approval for step 2 is already scheduled for 07:30. Nobody has touched job state yet, and the note exists to keep it that way until then. Fill the blanks so the command in the note is complete.<\/p><pre class=\"art mono\">RUNBOOK NOTE — IR-2025-0142 — FREEZE-FIRST RULE\nStep 1 (any analyst, read-only, before anything else):\n  bitsadmin ________ NW-Upd-Agent ________ &gt; E:\\IR-2025-0142\\nw-upd-agent-job[.]txt\nStep 2 (change-control only): bitsadmin /cancel NW-Upd-Agent\nNEVER: bitsadmin /reset — cancels every job on the host, including the\n  legitimate WSUS-Pull job, and clears the job-store entries we need.<\/pre>","question":"<p>Complete the step-1 command: which two read-only switches go in the blanks, in the order shown?<\/p>","template":"bitsadmin <input1> NW-Upd-Agent <input2> — read-only capture of the job's full state, output redirected to the case file.","blanks":[{"answer":"/info","alts":["info"],"placeholder":"display switch","width":8},{"answer":"/verbose","alts":["verbose"],"placeholder":"detail switch","width":10}],"hint":"The note kills the reset instinct twice — only switches that display more state qualify for a read-only capture.","explanation":"<p><span class=\"mono\">/info<\/span> displays the job's state — owner, URLs, notify command line, progress — without changing anything. <span class=\"mono\">/verbose<\/span> adds the full detail view on top, which is what the review board asked for. Together they are the canonical freeze-first capture for a suspect BITS job. <span class=\"mono\">/reset<\/span> was the helpdesk instinct, and it is the destructive one: it cancels all jobs and erases their job-store entries. <span class=\"mono\">/cancel<\/span> changes state too, so it waits for change-control in step 2. <span class=\"mono\">/complete<\/span> would clear the job exactly the way the attacker's own cleanup does. Display, never destroy, until the evidence is exported.<\/p>","study":"bitsadmin reference: /info /verbose for state display; contrast with /cancel, /reset and /complete."},{"id":"EX-04","type":"multi-step","summary":"Four containment calls on the SRV-FS01 bridge under month-end pressure","concepts":["containment under pressure","real-cost trade-off","evidence-safe vs destructive","documented procedures","Bazar download via BITS"],"artifactNote":"Bridge log 08:35 — SRV-FS01, month-end close, pending decisions","scenario":"<p>You run containment for the SRV-FS01 bridge, and the clock is the enemy. The month-end close finishes at 17:00; every hour of downtime on this file server is measured in accounting overtime, and the CFO has made that arithmetic explicit. The good news is that the freeze-first note has already executed: job exports, the Bits-Client event export, and the <span class=\"mono\">qmgr.db<\/span> image all sit in the case share before anyone touched job state. What has not happened is any change to the host or the network.<\/p><pre class=\"art mono\">BRIDGE 08:35 — IR-2025-0142 — SRV-FS01 (month-end close, ends 17:00)\n08:22  NW-Upd-Agent notify ran rundll32 (captured, read-only)\n08:26  egress block for nwtrd-updates[.]example staged, not yet applied\n08:27  svc_patch credential not yet disabled (owns legit WSUS-Pull)\n08:29  CFO on the bridge: \"the close must finish; what do you need?\"\n08:30  sandbox on u[.]bin still queued; no verdict<\/pre><p>Four calls are yours to make, in order, and each one trades cost against risk. The operator has already shown persistence behaviour: a second job creation forty minutes after the first, from the same hijacked service account. The sandbox verdict is still pending, so you are deciding on destination and chain evidence alone — that is normal, and the documented cases say a BITS-delivered loader is exactly what this pattern resembles. Say each call out loud to the bridge chair and own its cost.<\/p>","question":"<p>Make the four calls in order. Partial credit per correct step.<\/p>","hint":"The first two steps must not cost the close; only a later step earns the downtime.","explanation":"<p>Step 1: capture first, always — the read-only evidence set costs minutes and every later decision stands on it, while immediate isolation halts the close for hours and <span class=\"mono\">/reset<\/span> destroys the evidence outright. Step 2: quiet containment — the egress block plus quarantining the <span class=\"mono\">svc_patch<\/span> credential cuts the operator off at minimum cost, the core real-cost trade-off of this case. Step 3: recurrence from a second owner defeats the quiet-containment assumption, so the correct call is escalation and full isolation now — the downtime is finally justified, and wiping files would miss the job store anyway. Step 4: Bazar (S0534) is the documented loader downloaded onto hosts via BITS, the closest match for a first-stage BITS-delivered loader; MarkiRAT (S0652) used BITS for C2, and Egregor (S0554) executed DLLs via BITSadmin — both near-misses, and attribution stays preliminary until binary analysis confirms.<\/p>","study":"Graduated containment playbooks; ATT&CK procedure examples for BITS-delivered loaders (S0534).","steps":[{"prompt":"The bridge asks for your first call at 08:35. What do you order?","options":["Isolate SRV-FS01 from the network immediately — speed beats everything","Order the read-only capture set: job state, Bits-Client export, and the qmgr.db image, then decide containment on that evidence","Run bitsadmin /reset on SRV-FS01 so the job disappears before the CFO sees it"],"correct":1,"outcome":"Correct — the capture is read-only, takes minutes, and every later action stands on it. Isolating first would halt the month-end close for hours; /reset would delete the evidence and break the legitimate patch job."},{"prompt":"Capture done at 08:50. The evidence shows three NW-Upd-Agent jobs from svc_patch, all aimed at the lookalike domain. Containment call?","options":["Wait for the sandbox verdict on u[.]bin before touching anything","Isolate SRV-FS01 now — the month-end close stops until forensics finishes","Apply the egress block for the lookalike domain and quarantine the svc_patch credential — quiet containment that keeps the close running"],"correct":2,"outcome":"Correct — the block and the credential quarantine cut the operator off at minimum cost. That is the real-cost trade-off: full isolation protects best but stops the finance close; quiet containment accepts minutes of risk instead of hours of downtime."},{"prompt":"At 09:12 a new NW-Upd-Agent creation fires from a second owner, NWTRADER\\m.reyes, despite the block. Call?","options":["Escalate: declare a wider incident, isolate SRV-FS01 now, and page the IR lead — recurrence after containment means the operator is still inside","Keep quiet containment and re-check in four hours — the block will hold","Wipe C:\\ProgramData\\upd on SRV-FS01 to remove the dropped files"],"correct":0,"outcome":"Correct — recurrence from a second owner defeats the quiet-containment assumption, so escalate and isolate. Deleting files is destructive and misses the job store; waiting four hours gives the operator a free run."},{"prompt":"For the 10:00 board note: which documented procedure example matches a first-stage loader delivered onto a host via BITS?","options":["MarkiRAT (S0652) — documented as using a BITS utility for its C2 communications","Bazar (S0534) — documented as a loader downloaded onto hosts via BITS","Egregor (S0554) — documented as BITSadmin downloading and executing payload DLLs"],"correct":1,"outcome":"Correct — Bazar (S0534) is the documented BITS-delivered loader and the closest starting point for the report. MarkiRAT used BITS for C2, not delivery; Egregor executed DLLs via BITSadmin — a near-miss. Mark the attribution preliminary until binary analysis confirms."}]},{"id":"EX-05","type":"drag-drop","summary":"Sort six proposed actions: do now, after approval, or never","concepts":["evidence-safe vs destructive","escalate-or-wait decision","containment under pressure"],"scenario":"<p>The bridge chat has become a firehose of proposals, and the incident commander asks you to triage all six before someone acts on a bad one. The rules you set on day one still stand: reversible and evidence-preserving actions run now; anything that stops a production service or changes job state waits for change-control at 07:30; anything that destroys evidence or breaks the estate is refused outright, however confident the proposer sounds. Two proposals quote a second owner, <span class=\"mono\">m.reyes<\/span>, whom nobody has interviewed — treat their scope claims as unverified. The egress team is on shift and can block in minutes. The evidence room is staffed all night. The finance close has four hours left and the CFO is watching the downtime meter. One proposal is the <span class=\"mono\">/reset<\/span> reflex that returns at every incident, and another is the fleet-hardening reflex from the audit debate. Neither survives contact with the evidence plan: one deletes the job-store entries still pending export, the other breaks patching, month-end transfers, and backup deltas across the estate. Both also pre-empt the escalation decision the IR lead owns. Sort all six.<\/p>","question":"<p>Place each proposed action into the correct bucket.<\/p>","hint":"Approval-gated is not never: only actions that delete job-store evidence or break load-bearing services belong in the third bucket.","explanation":"<p><b>Do now:<\/b> the egress block is reversible in seconds and stops exfil or C2 immediately, and the read-only <span class=\"mono\">/info /verbose<\/span> captures preserve everything while changing nothing. <b>After approval:<\/b> isolating SRV-FS01 is the strongest containment but takes the month-end file service offline, and <span class=\"mono\">/cancel<\/span> changes job state — both are correct actions that simply wait for the 07:30 board. <b>Never:<\/b> a fleet-wide <span class=\"mono\">/reset<\/span> cancels every job everywhere, wipes un-exported evidence, and kills in-flight legitimate transfers; disabling BITS fleet-wide breaks WSUS-Pull patching, FinClose-Sync transfers, and backup deltas. The never bucket is not about courage — it is about evidence and collateral damage.<\/p>","study":"Incident response gradation: reversible evidence-preserving actions first; destructive and service-affecting actions behind approval.","bank":["Block nwtrd-updates[.]example at the egress firewall and export the Bits-Client log","Capture bitsadmin /info /verbose output for every job owned by svc_patch or m.reyes","Isolate SRV-FS01 — the month-end file service goes offline until forensics clears it","Cancel the confirmed NW-Upd-Agent jobs with bitsadmin /cancel","Run bitsadmin /reset on every server to clear all jobs at once","Disable the BITS service fleet-wide tonight via Group Policy"],"slots":[{"label":"Do now — reversible, evidence-preserving","accept":[0,1]},{"label":"After change-control approval at 07:30","accept":[2,3]},{"label":"Never — destroys evidence or breaks the estate","accept":[4,5]}]},{"id":"EX-06","type":"terminal","summary":"One compound line: capture verbosely, then cancel only NW-Upd-Agent","concepts":["evidence-safe vs destructive","compound command authoring","real-cost trade-off"],"scenario":"<p>Change-control has approved exactly one action on SRV-FS01 this minute, and you will type it yourself on the server console: <b>capture the full job inventory verbosely into the case file, then cancel only the confirmed-malicious job<\/b> — in one compound line, capture strictly first. The host still runs the legitimate <span class=\"mono\">WSUS-Pull<\/span> patch job and two in-flight <span class=\"mono\">FinClose-Sync<\/span> month-end transfers owned by other accounts, so a bulk <span class=\"mono\">/reset<\/span> is out of the question: it would cancel those jobs, interrupt the close, and erase every job-store entry including the ones not yet exported. The case directory <span class=\"mono\">E:\\IR-2025-0142<\/span> exists. The console session is being recorded, and the bridge wants one auditable action rather than a sequence of half-steps. Approval note: targeted <span class=\"mono\">/cancel NW-Upd-Agent<\/span> is authorized; anything wider is not. The review board will read this line later, so the ordering — capture before cancel — is itself evidence of discipline.<\/p>","question":"<p>Type the single compound command that (1) writes the verbose job inventory into <span class=\"mono\">E:\\IR-2025-0142\\bits-jobs[.]txt<\/span> and then (2) cancels only <span class=\"mono\">NW-Upd-Agent<\/span>.<\/p>","shellPrompt":"PS C:\\Windows\\system32&gt;","expected":"bitsadmin /list /verbose > E:\\IR-2025-0142\\bits-jobs[.]txt && bitsadmin /cancel NW-Upd-Agent","elements":[{"any":["bitsadmin","bitsadmin.exe"],"label":"the bitsadmin tool"},{"any":["/list"],"label":"the inventory capture (/list /verbose)"},{"any":[">","out-file","outfile"],"label":"the redirect that lands the capture in the case file"},{"any":["/cancel"],"label":"the targeted /cancel for NW-Upd-Agent only"}],"hint":"The command has two halves joined by &amp;&amp; — and the second half must name one job, not the whole queue.","explanation":"<p>The canonical line is <span class=\"mono\">bitsadmin /list /verbose &gt; E:\\IR-2025-0142\\bits-jobs[.]txt &amp;&amp; bitsadmin /cancel NW-Upd-Agent<\/span>. The first half is the evidence-safe half: <span class=\"mono\">/list /verbose<\/span> reads every job's full state and the redirect writes it to the case file before anything changes. Only then does <span class=\"mono\">&amp;&amp;<\/span> let the second half run, and it names exactly one job: <span class=\"mono\">/cancel NW-Upd-Agent<\/span> removes the confirmed-malicious job while <span class=\"mono\">WSUS-Pull<\/span> and the two in-flight <span class=\"mono\">FinClose-Sync<\/span> transfers survive. That is the real-cost trade-off in one line — targeted action protects the estate's work; a bulk <span class=\"mono\">/reset<\/span> here would have destroyed un-exported evidence and interrupted the close.<\/p>","study":"Compound command authoring for IR: read-only capture, then minimal state change; compare /cancel and /reset scopes."},{"id":"EX-07","type":"qcm-single","summary":"Audit finding H-2213: disable BITS everywhere — why that is wrong here","concepts":["M1028 Operating System Configuration","real-cost trade-off"],"artifactNote":"Hardening audit finding H-2213 — remediation due in 5 days","scenario":"<p>You are the detection engineering lead, and the hardening audit has landed on your desk with a five-day deadline. Finding H-2213 reads: \"The BITS service shall be DISABLED on all Windows endpoints and servers\", with the auditor note that this removes the T1197 execution surface entirely. On a clean estate that is textbook M1028 Operating System Configuration, and the auditor cites exactly that mitigation.<\/p><pre class=\"art mono\">HARDENING AUDIT — FINDING H-2213 (remediation due in 5 days)\n\"The BITS service shall be DISABLED on all Windows endpoints and servers.\"\nAuditor note: removes the T1197 BITS Jobs execution surface entirely.<\/pre><p>Northwind is not a clean estate, and this month it is not even a calm one. The nightly <span class=\"mono\">WSUS-Pull<\/span> job under <span class=\"mono\">svc_patch<\/span> pulls the update catalogue via BITS on more than four hundred endpoints — kill BITS and patching stops estate-wide. The finance tool <span class=\"mono\">FinClose-Sync<\/span> moves close workbooks with <span class=\"mono\">Start-BitsTransfer<\/span> all through month-end, which is precisely the window you are in. The backup vendor's delta agent queues its transfers through BITS on the file servers, including SRV-FS01, which is currently your incident scene. Your own survey of BITS dependencies is only 60% complete, so nobody can even list what else would break. The real-cost trade-off is therefore brutal: the control does remove the technique's surface, and it also removes three production lifelines during a live incident, with an unquantified fourth. M1028 is still the right mitigation — but scoped: disable BITS only on hosts that never need it, cap job size and lifetime through Group Policy on the rest, and lean on network-side egress filtering for the containment this case actually needs. The auditor's intent is sound; the blanket scope is wrong here. What do you sign?<\/p>","question":"<p>Which response to H-2213 is correct for this estate?<\/p>","hint":"Re-read which production jobs depend on the service before judging the checklist item.","explanation":"<p>Option 1 is wrong because \"worth the outage\" ignores that the outage is patching plus finance transfers plus backups, during a live incident, with a 60%-known dependency map. Option 2 is the correct one: it keeps M1028 but scopes it — disable only where BITS is unneeded, cap jobs by Group Policy elsewhere, and pair with network-side egress filtering — because BITS is load-bearing here. Option 3 is wrong because authority is not the argument; the finding fails on operational impact, not on jurisdiction. Option 4 is wrong because timing is not the flaw either — a deferred blanket disable breaks the same lifelines next quarter. Common best practice, \"disable unused services everywhere\", is genuinely wrong on an estate where the service is not unused.<\/p>","study":"M1028 Operating System Configuration applied with scope; asset-dependency mapping before hardening changes.","options":["Accept H-2213 as written — removing the execution surface is worth the outage, and missed work will simply re-queue","Reject the blanket scope: disable only where BITS is unneeded, cap jobs by Group Policy elsewhere, and add network-side egress filtering","Reject H-2213 outright — service configuration sits outside the audit programme's authority and needs no technical justification","Accept H-2213 but defer it one quarter — the finding is technically correct and only its timing is wrong"],"correct":1},{"id":"EX-08","type":"ordering","summary":"Rank five response actions from most to least evidence-preserving","concepts":["evidence-safe vs destructive","real-cost trade-off"],"scenario":"<p>The IR lead wants the response ladder written down before the approvals arrive, because the order decides what survives the night. Five actions are on the ladder, and your ranking becomes the runbook. Read-only display first: it costs minutes and destroys nothing, which is why the freeze-first note already made it step 1. The job-store image second: BITS keeps its state self-contained in the job database, so that image is the closest thing to the operator's whole playbook, and it is the only copy if the host dies. Targeted cancellation third: it stops the malicious job but leaves every other job and every un-exported entry intact. Bulk clearing fourth: it is fast and thorough and wipes the remaining evidence with it, which is acceptable only as approved end-of-shift hygiene. Reimaging last: it is the cleanest security outcome and the permanent loss of the host-side evidence, and the CFO will like its certainty more than your forensics team will. Incomplete constraint: the case share has room for the exports and one 20 GB database image, so the ladder is not theoretical — someone will execute exactly what you rank. Rank the five actions from most evidence-preserving to least.<\/p>","question":"<p>Order the five actions from most evidence-preserving to least.<\/p>","hint":"Rank by what each action does to the job store: display, copy, targeted removal, bulk removal, full wipe.","explanation":"<p>The evidence-preserving order is: read-only <span class=\"mono\">/info /verbose<\/span> export, then the <span class=\"mono\">qmgr.db<\/span> image, then targeted <span class=\"mono\">/cancel<\/span>, then bulk <span class=\"mono\">/reset<\/span>, then reimage. The display step creates evidence without touching state. The database image copies the self-contained job store before anything can clear it — on a technique whose stealth is precisely that its state hides in the job database, that image is the case. Targeted cancellation removes only confirmed-malicious jobs. Bulk reset removes every job and every remaining entry, justified only when the inventory is already exported. Reimaging wipes the host entirely — the best security reset and the worst evidence outcome, so it belongs last on an evidence ladder even when operations would rank it first.<\/p>","study":"Evidence hierarchy in IR: display, acquire, minimize state change, bulk clear only after export, reimage last.","items":["Export job details read-only with bitsadmin /info /verbose into the case file","Image the BITS job database (qmgr.db) from the live volume","Cancel only the confirmed-malicious jobs with bitsadmin /cancel","Clear every job on the host with bitsadmin /reset","Reimage the host from the clean golden image"]}];

EXERCISES.push({"id":"EX-09","type":"fill-blank","summary":"CISO memo: attach the two funded mitigation IDs, in memo order","concepts":["M1037 Filter Network Traffic","M1028 Operating System Configuration"],"artifactNote":"CISO memo budget line SEC-118 — two funded controls, IDs missing","scenario":"<p>The CISO has funded two controls against T1197 and wants the memo completed before the budget line locks at month-end. The controls were chosen in the workshop after the SRV-FS01 incident review, and the memo already fixes their order — network side first, host side second. Your job is to attach the correct ATT&amp;CK mitigation IDs, and only that. The finance director is CC'd and will read exactly these two codes.<\/p><pre class=\"art mono\">CISO MEMO — BUDGET LINE SEC-118 — T1197 BITS JOBS\nFunded control 1 (network side): restrict BITS egress to approved\n  destinations only; block at the proxy and host firewall.\nFunded control 2 (host side): where BITS is not needed, cap job size\n  and lifetime via Group Policy; disable the service on a short\n  exceptions list. Load-bearing hosts (WSUS-Pull, FinClose-Sync)\n  keep the service with compensating monitoring.\nAttach ATT&CK mitigation IDs: [ ____ ] and [ ____ ]<\/pre><p>Control 1 restricts BITS egress to approved destinations only — the proxy rule that would have contained the lookalike domain on day one, plus matching host-firewall rules. Control 2 is the operating-system side: Group Policy caps on job size and lifetime, and disabling the service only on a short exceptions list — never fleet-wide, as the H-2213 debate proved. A third candidate, limiting which accounts can create or modify BITS jobs, was discussed and deliberately deferred to next quarter's funding round, so its mitigation ID must not appear in this memo. The incident review recorded that the lookalike domain would have been harmless under control 1 and that the job caps would have shortened the attacker's persistence window under control 2. The memo deliberately does not restate the incident, so the IDs must come from your knowledge of the technique's mitigation set. Attach the IDs in memo order — a swapped pair routes both budgets to the wrong teams, and the lookalike-domain rule never gets built.<\/p>","question":"<p>Fill the two mitigation IDs, in memo order.<\/p>","template":"Funded control 1 maps to ATT&amp;CK mitigation <input1>, and funded control 2 maps to ATT&amp;CK mitigation <input2>.","blanks":[{"answer":"M1037","alts":["m1037","filter network traffic"],"placeholder":"M-ID","width":8},{"answer":"M1028","alts":["m1028","operating system configuration"],"placeholder":"M-ID","width":8}],"hint":"The memo already fixes the order: network-side first, host-side second.","explanation":"<p>Control 1 is <b>M1037 Filter Network Traffic<\/b> — restricting and blocking BITS traffic to unapproved destinations is exactly what that mitigation covers, and it is the control that would have contained the lookalike domain on day one. Control 2 is <b>M1028 Operating System Configuration<\/b> — Group Policy caps on job size and lifetime, and disabling the service only where it is not needed, which is the scoped version of the H-2213 idea. The deferred candidate was M1018 User Account Management; it is real and relevant, but it is explicitly not funded this quarter, so it must not appear. Memo order is network side first, host side second.<\/p>","study":"ATT&CK mitigation entries for T1197: M1037, M1028, and the deferred M1018."},
{"id":"EX-10","type":"line-select","summary":"Day 2: prove the BITS upload exfiltration in mixed proxy and BITS logs","concepts":["upload-based exfiltration","conflicting signals"],"artifactNote":"Day-2 mix — FIN-WKS07 proxy records and Bits-Client events, 09:41–10:12","scenario":"<p>Day 2, 10:30. The egress block has held on SRV-FS01, but the evening sweep has now flagged FIN-WKS07, the finance workstation of analyst <span class=\"mono\">m.okafor<\/span>. The proxy team says they saw an \"exfil attempt\" — a POST to the lookalike domain at 10:02:11 — but the byte counter on that first POST reads zero, and an empty POST is also what a health probe or a stalled connection looks like. The CTI feed has meanwhile confirmed the domain as malicious infrastructure, which raises the temperature but does not prove anything left the building.<\/p><p>The Bits-Client log tells the other half of the story, and it carries a nasty surprise: the upload job is named <span class=\"mono\">FinClose-Sync<\/span> — the exact name of the legitimate month-end transfer tool from the H-2213 debate — but the legitimate tool sends to SRV-FS01 over the internal share, never to an internet host, and never with <span class=\"mono\">type=upload<\/span>. The conflicting signals resolve the same way they did on day one: the name is camouflage, the destination and the upload type are the evidence. APT39's documented use of the BITS protocol to exfiltrate stolen data is the closest prior art your CTI analyst cites for the report, and the upload pattern itself maps to exfiltration over an alternative protocol rather than a tool-transfer download.<\/p><p>Prove the exfiltration end to end: click the four lines that show the upload job, the matched byte counts across both telemetry sources, and the notify command that cleaned the staging folder afterwards. Note what is missing — <span class=\"mono\">C:\\EOY\\staging<\/span> is gone, so the file list itself may never be recoverable, which is exactly why these four lines must carry the case.<\/p>","question":"<p>Click the <b>four<\/b> lines that together prove the upload exfiltration and its cover-up.<\/p>","hint":"The zero-byte POST is the decoy — the proof is a matched byte count across two sources, plus the upload-type job and the cleanup command.","explanation":"<p>The four proving lines are 3, 5, 6 and 7. Line 3 is the Bits-Client creation of an <b>upload-type<\/b> job to the lookalike domain, wearing the legitimate <span class=\"mono\">FinClose-Sync<\/span> name — destination and type defeat the camouflage. Line 5 is the transfer-complete record: 48,112,640 bytes out. Line 6 is the proxy POST with <b>the same byte count<\/b> and a 200 status — two independent sources agreeing is what turns \"suspicious traffic\" into proof. Line 7 is the notify command deleting the staging files: the exfil finished and the operator cleaned up, which also explains why the staging folder cannot be enumerated. The lines you left out: line 1 is the legitimate WSUS baseline, line 2 is the zero-byte POST — consistent with a probe, not proof of exfil — and line 8 is a routine Windows Update poll. Together the four clicked lines give motive, mechanism, volume, and cleanup: a complete upload-exfiltration case.<\/p>","study":"BITS upload jobs as exfiltration over an alternative protocol; byte-count correlation between proxy and Bits-Client telemetry.","logLines":["09:41:02  proxy  GET hxxp[:]//wsus[.]nwtraders[.]example/wu[.]cab  host=FIN-WKS07  bytes_in=2,301,440","10:02:11  proxy  POST hxxp[:]//nwtrd-updates[.]example/up  host=FIN-WKS07  user=NWTRADER\\m.okafor  bytes_out=0","10:02:14  bits   EID 59  job created:  name=FinClose-Sync  owner=NWTRADER\\m.okafor  url=hxxp[:]//nwtrd-updates[.]example/up  type=upload","10:02:15  dns    FIN-WKS07 resolved nwtrd-updates[.]example at 185[.]199[.]110[.]153","10:04:40  bits   EID 3   transfer complete:  job=FinClose-Sync  bytes=48,112,640","10:04:41  proxy  POST hxxp[:]//nwtrd-updates[.]example/up  host=FIN-WKS07  user=NWTRADER\\m.okafor  bytes_out=48,112,640  status=200","10:04:42  bits   EID 25  notify command:  job=FinClose-Sync  cmd=cmd.exe /c del C:\\EOY\\staging\\close*.tmp","10:12:03  proc   svchost.exe -k netsvcs -p -s wuauserv  (Windows Update poll)"],"badLines":[2,4,5,6]},
{"id":"EX-11","type":"matching","summary":"Review board: pair four evidence exhibits with their forced conclusions","concepts":["conflicting signals","owner-logged-on condition","SetNotifyCmdLine persistence mechanics","complete-switch indicator removal"],"scenario":"<p>The review board for IR-2025-0142 has four evidence exhibits and a simple instruction: for each one, state the only conclusion the evidence forces — no adjectives, no speculation. The exhibits were agreed with legal so the report can quote them verbatim. Exhibit A is the job itself: an updater-style name, <span class=\"mono\">NW-Upd-Agent<\/span>, whose destination is <span class=\"mono\">nwtrd-updates[.]example<\/span>, a domain nine days old at first use. Exhibit B is the transfer window: across nine days of history, the job's transfers ran only between 08:00 and 18:00, and every window falls inside a recorded interactive session of <span class=\"mono\">svc_patch<\/span>. Exhibit C is the trigger: after each transfer <i>error<\/i> — not only after completions — event 25 fired and the same <span class=\"mono\">rundll32<\/span> line re-ran. Exhibit D is the cleanup: three minutes after every notify execution, <span class=\"mono\">bitsadmin /complete<\/span> cleared the job and its entry in the job store, and a fresh job appeared within the hour.<\/p><p>The board's chair reminds everyone why this format exists. The name in Exhibit A <i>looks<\/i> like maintenance, the window in Exhibit B <i>looks<\/i> like patch cadence, the errors in Exhibit C <i>look<\/i> like a flaky transfer, and the cleanup in Exhibit D <i>looks<\/i> like good hygiene. Each of those readings is the trap. Each exhibit also forces exactly one mechanical conclusion once you apply what the technique itself guarantees about naming, logon gating, notify triggers, and the complete switch. Pair the four exhibits with those conclusions.<\/p>","question":"<p>Pair each exhibit with the only conclusion it forces.<\/p>","hint":"Each right-hand card states a mechanism from the technique itself — match the mechanism the evidence actually demonstrates, not the feeling.","explanation":"<p>Exhibit A forces the name-lie conclusion: an updater-style name over a nine-day-old lookalike domain is spoofed trust, resolved by destination evidence. Exhibit B forces the logon gate: BITS transfers only run while the owning user is logged on, so the tidy 08:00–18:00 windows map directly onto <span class=\"mono\">svc_patch<\/span>'s sessions — which is why scoping that account matters. Exhibit C forces the trigger conclusion: notify commands fire on completion <b>or<\/b> error, so the operator deliberately used the error path to re-run the rundll32 line — a persistence trigger, not flakiness. Exhibit D forces the cleanup conclusion: <span class=\"mono\">/complete<\/span> clears the job and its store entry, and running it on a three-minute schedule after every execution is deliberate indicator removal, not hygiene. Every tempting surface reading is answered by the mechanism the technique guarantees.<\/p>","study":"T1197 mechanics: job naming as camouflage, the owner-logged-on transfer gate, notify on completion or error, /complete as indicator removal.","pairs":[{"left":"Job NW-Upd-Agent: updater-style name, destination nwtrd-updates[.]example (9 days old)","right":"the name is spoofed trust — destination evidence marks the job as malicious"},{"left":"Transfers ran only 08:00–18:00, each window inside a recorded svc_patch session","right":"BITS transfers only run while the owning user is logged on — the windows map to that account's sessions"},{"left":"EID 25 fired after every transfer error, re-running the same rundll32 line","right":"notify commands run on completion or error — the error path itself was the persistence trigger"},{"left":"Three minutes after each notify execution, bitsadmin /complete cleared the job","right":"deliberate indicator removal — the operator cleaned the job store on a schedule"}]},
{"id":"EX-12","type":"multi-step","summary":"Four pressure calls: scope, hold, comms, and one active execution","concepts":["containment under pressure","escalate-or-wait decision","real-cost trade-off"],"artifactNote":"Bridge log day 2, evening — CFO demands, evidence 80%, watchlist armed","scenario":"<p>Day two, evening, and the pressure has changed shape. The file server is contained; the questions are now about scope, patience, and words. The CFO wants a number for the audit committee. The evidence team wants ninety more minutes. The watchlist on the finance workstation is armed and waiting. Four calls are yours, and two of them test whether you can hold the line when everyone wants motion.<\/p><pre class=\"art mono\">BRIDGE 19:40 — IR-2025-0142 — day 2, evening\n19:05  egress block live; SRV-FS01 isolated since 09:12\n19:22  CFO: \"did finance data leave? I need a number for the board.\"\n19:24  evidence ~80%: job exports done, qmgr.db image done;\n       FIN-WKS07 volatile memory not yet captured\n19:30  audit committee call scheduled 20:15\n22:10  (later) watchlist: new upload-type job on FIN-WKS07 fires\n       while m.okafor's session is idle<\/pre><p>Remember the discipline that got the case this far: scope with data, hold when containment is working, speak in verified facts, and let defined triggers end the hold. A fleet-wide <span class=\"mono\">/reset<\/span> has been refused twice already and stays refused — it would destroy the evidence the remaining 20% of collection still needs. The watchlist trigger was written in the morning: observed active execution ends any hold. Make the calls.<\/p>","question":"<p>Make the four pressure calls in order. Partial credit per correct step.<\/p>","hint":"Steps 1 to 3 test restraint, not action — only the watchlist event in the final step is a defined trigger.","explanation":"<p>Call 1: scope with data — the 30-day fleet-wide sweep of upload-type jobs and lookalike-domain egress answers \"did data leave\" with evidence; guessing low is indefensible if a third host appears, and <span class=\"mono\">/reset<\/span> destroys what you still need. Call 2: hold — with containment live and collection nearly done, the escalate-or-wait discipline says finish the evidence and escalate the FIN-WKS07 finding; declaring a breach on partial scope or resetting the estate would both destroy or distort what you can still learn. Call 3: the factual holding line — specific, verifiable, no speculation; overclaiming creates legal exposure you cannot take back, and stonewalling burns stakeholder trust while containment is actually working. Call 4: isolate now — the morning's trigger was observed active execution, and a new upload job firing during an idle session is exactly that; rebooting would destroy volatile memory evidence and might not even stop the job, because BITS jobs survive reboots.<\/p>","study":"Escalate-or-wait decision frameworks; defining containment triggers in advance; stakeholder communication under uncertainty.","steps":[{"prompt":"Step 1 — scope. The CFO demands the blast radius now. First move?","options":["Tell the CFO that only one file server is affected — it is the fastest defensible answer","Run bitsadmin /reset across all finance hosts to stop further uploads tonight","Query upload-type BITS jobs and lookalike-domain egress fleet-wide for the last 30 days before giving any number"],"correct":2,"outcome":"Correct — you scope with data, not guesses. The 30-day sweep answers \"did data leave\" with evidence; guessing low collapses if a third host appears, and /reset would destroy the evidence you still need."},{"prompt":"Step 2 — hold. The sweep shows one extra host (FIN-WKS07), evidence is 80% collected, and the close ends in 40 minutes. Call?","options":["Declare a full breach to the board now — better safe than sorry","Hold: keep containment as is, finish evidence collection, and escalate the FIN-WKS07 finding to the IR lead — no fleet-wide action yet","Push an estate-wide /reset so nothing else can upload tonight"],"correct":1,"outcome":"Correct — the escalate-or-wait discipline: with containment live and collection nearly done, finish the evidence, escalate, and hold. Declaring a breach on partial scope and resetting the estate would both destroy or distort what you can still learn."},{"prompt":"Step 3 — comms. The audit committee asks for one factual line for the 20:15 call.","options":["\"A sophisticated APT has compromised the entire finance estate and data theft is confirmed\"","\"We cannot share anything until the vendor report is published\"","\"One lookalike domain, one file server isolated, one finance host under watch; containment active; no confirmed data classification yet\""],"correct":2,"outcome":"Correct — a factual holding line: specific, verifiable, no speculation. Overclaiming creates legal exposure you cannot take back; stonewalling destroys stakeholder trust while containment is working."},{"prompt":"Step 4 — execution. At 22:10 the watchlist fires: a new upload-type job runs on FIN-WKS07 while the owner's session is idle. Final call?","options":["Isolate FIN-WKS07 now — observed active execution overrides the hold","Keep watching until the close officially ends","Reboot FIN-WKS07 to clear memory and running jobs"],"correct":0,"outcome":"Correct — the hold ends when the adversary acts. Active execution on a scoped host is the trigger you defined in the morning; isolate now and preserve volatile memory per process. Rebooting destroys memory evidence and may not stop a persisted job — BITS jobs survive reboots."}]},
{"id":"EX-13","type":"qcm-multi","summary":"Choose the two actions that can run unattended tonight","concepts":["escalate-or-wait decision","M1037 Filter Network Traffic","evidence-safe vs destructive"],"scenario":"<p>It is 21:00 on day two, the bridge is closing for the night, and the IR lead asks what runs unattended until the 07:30 change-control board. Five proposals are on the table and exactly two are defensible right now. The egress team is staffed and can push an edge block in minutes. The evidence room is staffed and can pull exports and database images all night. Change-control is the only path to anything that stops a production service, so isolation and cancellation wait for the morning. The CTI report on the lookalike domain is three days out; standing down to wait for it would hand the operator a quiet night inside whatever access remains. The <span class=\"mono\">/reset<\/span> reflex has been refused twice this incident and refusing it a third time is itself a night action — nobody should type it. Choose the two actions that run tonight, and be ready to defend each one at 07:30.<\/p>","question":"<p>Select the <b>two<\/b> defensible actions for tonight.<\/p>","hint":"Two actions can run in parallel tonight: one at the network edge, one in the evidence room.","explanation":"<p>The two defensible actions are the edge block and the evidence preservation. Blocking <span class=\"mono\">nwtrd-updates[.]example<\/span> and its parking IP at the egress edge is M1037 Filter Network Traffic in action: reversible in seconds, staffed, and it starves any remaining job of its destination all night. Exporting Bits-Client logs and imaging the <span class=\"mono\">qmgr.db<\/span> stores is the evidence-safe half — read-only, unattended-friendly, and it makes the 07:30 decisions possible on full data. The rejected three: a fleet-wide <span class=\"mono\">/reset<\/span> tonight would destroy job-store evidence still pending export (refused twice already); disabling BITS on file and print servers during month-end is a service-affecting change that belongs behind change-control and breaks load-bearing transfers; standing down for 72 hours is not patience, it is dwell time — the escalate-or-wait discipline never means waiting for intel you can act without.<\/p>","study":"Overnight incident cadence: unattended containment and preservation vs approval-gated state changes.","options":["Run bitsadmin /reset on every server tonight so no job survives to morning","Block nwtrd-updates[.]example and its known parking IP at the egress edge (M1037 Filter Network Traffic)","Disable the BITS service on all file and print servers during month-end close","Export Bits-Client logs and image the qmgr.db stores from the scoped hosts into the case share","Stand down completely for 72 hours until CTI publishes a report on the domain"],"correct":[1,3]},
{"id":"EX-14","type":"ordering","summary":"Rebuild the IR-2025-0142 chronology for the final report","concepts":["conflicting signals","containment under pressure"],"artifactNote":"Draft chronology inputs — registration, first job, execution, bridge, change-control","scenario":"<p>The final report needs one clean chronology, and the drafting committee has left it to you. Two rules from the review board govern the order. First, the chronology must show that the earliest event predates every host activity — the infrastructure was staged before the first job ever ran, which kills the \"accidental naming collision\" reading for good. Second, it must show that the last two response steps were gated by approvals rather than reflexes.<\/p><div class=\"ticket\"><span class=\"k\">Draft chronology inputs<\/span> · nwtrd-updates[.]example registered: D-9 · first NW-Upd-Agent creation on SRV-FS01: D-0 07:41 · first notify/rundll32 execution: D-0 07:42 · bridge opens, captures and egress block: D-0 08:35–08:50 · change-control: targeted /cancel then isolation after recurrence: D-0 09:12–10:00<\/div><p>The conflicting-signal row stays in the report: the committee wants future readers to see that the updater-style name delayed nothing because the destination evidence decided the case within the hour. The containment row must also answer the question the CFO will ask again — why isolation waited for change-control while the block did not. The answer is the cost trade-off, documented: read-only captures and an edge block are reversible, a file-server isolation during month-end close is not. Place the five events in order.<\/p>","question":"<p>Order the five events from earliest to latest.<\/p>","hint":"One event predates every host activity by days — and the approvals gate the final two entries.","explanation":"<p>The chronology is: domain registration nine days out, first job creation at 07:41, notify execution of the rundll32 payload at 07:42, the bridge response with captures and the egress block at 08:35–08:50, and finally change-control approving the targeted <span class=\"mono\">/cancel<\/span> and then the isolation after recurrence at 09:12–10:00. The registration date leads because nine days of staging proves intent and removes the accident theory. Creation precedes execution because the notify command fires only when the job completes its transfer. The bridge response precedes the approvals because reversible evidence and edge actions are exactly what can run without them. Isolation comes last because recurrence was the agreed trigger and downtime is the cost the board signed off. Every timestamp in the ticket supports one position only.<\/p>","study":"Incident report chronologies: infrastructure staging, execution, response, and approval gates as separate rows.","items":["nwtrd-updates[.]example is registered — nine days before anything else in this case","Job NW-Upd-Agent is created on SRV-FS01 by svc_patch and pulls u[.]bin from the lookalike domain","Job completion fires the notify command; rundll32 loads the payload under the BITS service","The SOC bridge opens; read-only captures and the egress block land while the close keeps running","Change-control approves targeted /cancel and then full isolation after recurrence"]},
{"id":"EX-15","type":"terminal","summary":"End of shift: verbose capture to file, then the approved bulk clear","concepts":["evidence-safe vs destructive","compound command authoring","real-cost trade-off"],"scenario":"<p>It is 22:45, end of your shift on the IR-2025-0142 follow-up. Change-control has approved the <b>final hygiene pass<\/b> on SRV-PRINT01, the print server that also showed two <span class=\"mono\">NW-Upd-Agent<\/span> creations before the domain block: <b>first<\/b> write the verbose inventory of everything still in the job queue into <span class=\"mono\">E:\\IR-2025-0142\\srv-print01-bits[.]txt<\/span>, <b>then<\/b> — only then — run the approved bulk clear of the whole job queue with <span class=\"mono\">/reset<\/span>. The sequencing is the whole test: an analyst on day shift ran the <span class=\"mono\">/reset<\/span> first and lost the only un-exported job entry on that host, and the review board has asked for a note on evidence-safe ordering. The approved cost is real: <span class=\"mono\">/reset<\/span> will also cancel two queued <span class=\"mono\">FinClose-Sync<\/span> transfers, and the finance team has agreed they will re-queue in the morning, so the downtime is signed off. Nothing else may run on this console tonight — one line, in the right order, and the shift log will quote it verbatim.<\/p>","question":"<p>Type the single compound command: verbose inventory into <span class=\"mono\">E:\\IR-2025-0142\\srv-print01-bits[.]txt<\/span>, then the approved bulk clear.<\/p>","shellPrompt":"PS C:\\Windows\\system32&gt;","expected":"bitsadmin /list /verbose > E:\\IR-2025-0142\\srv-print01-bits[.]txt && bitsadmin /reset","elements":[{"any":["bitsadmin","bitsadmin.exe"],"label":"the bitsadmin tool"},{"any":["/list"],"label":"the final inventory (/list /verbose)"},{"any":[">","out-file","outfile"],"label":"the redirect that writes the inventory first"},{"any":["/reset"],"label":"the approved bulk clear (/reset) after the capture"}],"hint":"The order is the test — nothing may be cleared before the inventory line has written its file.","explanation":"<p>The canonical line is <span class=\"mono\">bitsadmin /list /verbose &gt; E:\\IR-2025-0142\\srv-print01-bits[.]txt &amp;&amp; bitsadmin /reset<\/span>. The first half is the evidence-safe half: <span class=\"mono\">/list /verbose<\/span> reads the whole remaining queue and the redirect writes it into the case file. Only after that file exists does <span class=\"mono\">&amp;&amp;<\/span> permit the destructive half: <span class=\"mono\">/reset<\/span> clears every job and every job-store entry on the host. That bulk destruction is approved here — the inventory is exported, and the two cancelled <span class=\"mono\">FinClose-Sync<\/span> transfers re-queue in the morning, a signed-off real cost. The contrast with a targeted <span class=\"mono\">/cancel<\/span> is the skill being graded: when other jobs must survive, cancel by name; when the board has approved a full clear, sequence capture before reset, never after.<\/p>","study":"Sequencing destructive maintenance after evidence export; /cancel vs /reset scope; sign-off of collateral downtime."});

      '<li><b>Skipping:</b> every exercise has a Skip button. Skipped exercises are collected in a review screen before you finish, and you can answer them there while the timer still runs. Skipped-and-never-answered exercises are excluded from your score.</li>'));
    how.appendChild(el('div', 'typlist', '<span class="typ">' + META.questionCount + ' exercises</span><span class="typ">timer ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span><span class="typ">pass 70%</span><span class="typ">severity: ' + esc(META.severityLabel) + '</span>'));
    var startRow = el('div', 'actions');

  function startExam() {

  /* ---------------- widgets ---------------- */
  function optRow(idx, text) {

    b.type = 'button'; b.dataset.idx = idx;

  }
  function widgetFor(ex, box, wstate) {
    if (ex.type === 'qcm-single' || ex.type === 'qcm-multi') {
      var wrap = el('div', null, '');
      wstate.sel = wstate.sel || [];
      ex.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (ex.type === 'qcm-single') { wstate.sel = [i]; wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); }); r.classList.add('sel'); }
          else { var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); r.classList.remove('sel'); } else { wstate.sel.push(i); r.classList.add('sel'); } }
        });
        wrap.appendChild(r);

    } else if (ex.type === 'fill-blank') {

          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));
          inp.value = wstate.vals[bi] || '';

    } else if (ex.type === 'drag-drop') {
      wstate.place = wstate.place || {}; // bankIdx -> slotIdx

      var dd = el('div', 'ddwrap');
      var bank = el('div', 'ddbank'); bank.dataset.bank = '1';
      bank.setAttribute('aria-label', 'Item bank');

          if (S.answers[S.current].status === 'checked') return;
          if (inSlot) { delete wstate.place[bi]; wstate.active = null; rerender(); }

        c.addEventListener('dragstart', function (ev) { try { ev.dataTransfer.setData('text/plain', String(bi)); } catch (e) { } });
        return c;

        ex.slots.forEach(function (sl, si) {
          var body = dd.querySelector('[data-slot="' + si + '"]');

      bank.appendChild(bankH); bank.appendChild(bankList); dd.appendChild(bank);
      var slotsBox = el('div', 'ddslots');
      ex.slots.forEach(function (sl, si) {

        body.addEventListener('drop', function (ev) {

        });

      dd.appendChild(slotsBox);

    } else if (ex.type === 'ordering') {
      wstate.order = wstate.order || S.shuffles[S.current].ord.slice();
      var ol = el('ul', 'ordlist'); ol.setAttribute('aria-label', 'Ordering list — use the arrows to reorder');
      function drawOrd() {

    } else if (ex.type === 'matching') {

            wstate.activeLeft = (wstate.activeLeft === li ? null : li); drawMatch();

          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));
          b.type = 'button';
          if (usedBy >= 0) b.classList.add('paired');
          b.addEventListener('click', function () {

            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();

      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');

      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });

    } else if (ex.type === 'line-select') {

          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });

      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {

    var card = el('div', 'card');

    var sc = el('div', 'block blk-scenario');

      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';

    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';

  function renderTopbarButtons() {

  function showPauseVeil() {

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
