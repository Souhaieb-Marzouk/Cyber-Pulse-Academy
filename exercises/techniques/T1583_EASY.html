var DATA = {"meta": {"topicId": "t1583", "batch": 1, "title": "T1583 Acquire Infrastructure — EASY", "difficulty": "easy", "questionCount": 17, "estimatedMinutes": 25, "passMark": 70}, "severity": "EASY", "sevKey": "easy", "intro": {"hero": "<h1>T1583 — Acquire Infrastructure <span class=\"badge b-easy\">EASY · tier 1<\/span><\/h1><div class=\"sub\">Scenario-based certification exam on one MITRE ATT&amp;CK technique · object type: Technique · tactic: Resource Development (TA0042) · platforms: PRE<\/div><div class=\"chips\"><span class=\"mchip\">17 exercises<\/span><span class=\"mchip\">25 minutes<\/span><span class=\"mchip\">Pass mark: 70%<\/span><span class=\"mchip\">Partial credit scoring<\/span><span class=\"mchip\">ATT&amp;CK v20 data<\/span><\/div>", "entity": "\n<h2>About this ATT&amp;CK object (read before you start)<\/h2>\n<p><b>T1583 — Acquire Infrastructure<\/b> is one object of the MITRE ATT&amp;CK framework.\nIts object type is a <b>Technique<\/b>. A technique describes one clear way an attacker acts.\nIt is not a tactic, not a mitigation, and not a group.<\/p>\n<p>Imagine you want to attack a company. Before you touch that company, you need your own place on the\ninternet: a website name (a domain), a rented server, or an account on a popular website.\nT1583 describes exactly this step. The attacker <b>buys, rents, or registers<\/b> this infrastructure.\nIt sits in the <b>Resource Development<\/b> tactic (TA0042). That tactic is the preparation phase.\nIt happens <b>before<\/b> the attacker sends one phishing email or touches one company computer.\nATT&amp;CK marks its platforms as <b>PRE<\/b> for this reason.<\/p>\n<p>T1583 has <b>eight sub-techniques<\/b>. In plain words: <b>.001 Domains<\/b> — buying a website name;\n<b>.002 DNS Server<\/b> — running your own name servers; <b>.003 Virtual Private Server<\/b> — renting a\ncloud machine; <b>.004 Server<\/b> — buying or renting a real server; <b>.005 Botnet<\/b> — renting a\nnetwork of infected devices; <b>.006 Web Services<\/b> — signing up for sites like GitHub, Dropbox or\nTwitter; <b>.007 Serverless<\/b> — using cloud functions such as Cloudflare Workers or AWS Lambda;\n<b>.008 Malvertising<\/b> — buying online adverts that push malware.<\/p>\n<p><b>Why does an attacker do this?<\/b> Own infrastructure gives them: a place to host fake login pages;\na place to stage malware; servers to receive stolen data (command and control); and traffic that blends\nin with normal cloud or web traffic. They can provision it fast, change it fast, and shut it down fast.\nThey can pay with crypto, use free trials, use private WHOIS, or buy an old domain that already looks\ntrustworthy. All of this makes it hard to tie the infrastructure back to a person.<\/p>\n<p><b>Who uses this object in real work?<\/b> Almost every security role touches it:<\/p>\n<ul>\n<li><b>SOC analysts<\/b> see the results: alerts about new or strange domains and fresh servers.<\/li>\n<li><b>CTI analysts<\/b> track which actor bought what, and write reports naming T1583.<\/li>\n<li><b>Detection engineers<\/b> build watches on WHOIS, passive DNS, certificate logs and scan data\n(DET0895 / AN2027 in ATT&amp;CK).<\/li>\n<li><b>Threat hunters and IR<\/b> pivot on infrastructure: domain age, hosting, certificates.<\/li>\n<li><b>Red teamers<\/b> rent the same services for authorised engagements.<\/li>\n<li><b>GRC and control owners<\/b> accept that this phase cannot be stopped directly — ATT&amp;CK lists\nonly <b>M1056 Pre-compromise<\/b> — so controls focus on the follow-on attack.<\/li>\n<\/ul>\n<p><b>Tools and deliverables<\/b> you will meet: WHOIS lookups, passive DNS, certificate transparency\nlogs, internet-scan services, newly-registered-domain feeds, brand monitoring, takedown requests, and\nATT&amp;CK-mapped threat intel reports. <b>The risks it addresses:<\/b> phishing from lookalike domains,\nmalware hosting, C2 servers, and malicious adverts — all built on acquired infrastructure.<\/p>\n", "themes": [{"name": "Technique identity & matrix position", "items": ["T1583 Acquire Infrastructure", "Technique (not a tactic)", "Tactic: Resource Development (TA0042)", "Platforms: PRE", "Siblings: T1584 Compromise Infrastructure, T1588 Obtain Capabilities", "Feeds Phishing (T1566), Drive-by Compromise (T1189), C2 (T1071/T1102), Proxy (T1090)"]}, {"name": "The eight sub-techniques (acquisition targets)", "items": ["T1583.001 Domains", "T1583.002 DNS Server", "T1583.003 Virtual Private Server", "T1583.004 Server", "T1583.005 Botnet", "T1583.006 Web Services", "T1583.007 Serverless", "T1583.008 Malvertising"]}, {"name": "Adversary motivations & trade-offs", "items": ["Blend in with normal traffic", "Rapidly provision / modify / shut down", "Hard to tie back to the attacker", "Free trial periods", "Bulletproof & minimal-KYC hosting", "Aged / expired domain reputation", "Homoglyphs, typosquats, IDN homograph attacks", "Private WHOIS & varied registrars", "Residential proxy services", "Payment in crypto / prepaid cards"]}, {"name": "Telemetry, data sources & detection strategy", "items": ["Detection Strategy DET0895 (analytic AN2027)", "Internet-scan data: listening services, certificates in use, SSL/TLS negotiation features", "DNS registry data", "Logged DNS data", "WHOIS registration data", "Detection focus on follow-on stages (e.g. Command and Control)"]}, {"name": "Mitigations & control limits", "items": ["M1056 Pre-compromise", "No direct preventive control (outside enterprise visibility)", "Newly-registered-domain feeds", "Brand monitoring & takedowns", "Ad blockers against malvertising follow-on", "Aged-domain evasion of age-based blocks"]}, {"name": "Real-world procedure examples", "items": ["Agrius, Contagious Interview, Ember Bear (commercial VPN services)", "Kimsuky (crypto-funded servers)", "Sandworm Team (resellers, email campaign services)", "Star Blizzard (HubSpot, MailerLite)", "Sea Turtle (VPN networks, adversary-in-the-middle DNS)", "APT41 DUST (Cloudflare Workers)", "Mustard Tempest & Raspberry Robin (malvertising)", "APT5 / HAFNIUM / Ke3chang (ORB networks)"]}, {"name": "Attribution & infrastructure intelligence", "items": ["Infrastructure overlap is a weak signal alone", "Shared registrars & privacy services", "Reseller chains blur ownership", "ORB networks raise defender cost", "Confidence language in CTI reporting"]}], "focus": "This tier builds your foundations: what T1583 is, its eight sub-techniques, and simple attacker and defender first steps.", "rules": "\n<h2>How this exam works<\/h2>\n<ul>\n<li><b>Goal:<\/b> master <b>T1583 — Acquire Infrastructure<\/b> at the <b>EASY<\/b> level.\nEvery exercise tests one idea at a time, in plain words.<\/li>\n<li><b>Questions:<\/b> 17 exercises. <b>Pass mark: 70%.<\/b> <b>Timer: 25 minutes.<\/b><\/li>\n<li><b>Exercise types in this tier:<\/b> short guided questions, matching, drag &amp; drop, ordering, one small log viewer, and one whois shell exercise.<\/li>\n<li><b>Partial credit:<\/b> some exercises have more than one right part. Each right part earns a share\nof the score. Wrong picks subtract from your score. If you select everything, you get 0 for that\nexercise. A partly right answer still earns part of the credit: credit = (H − W) / N.<\/li>\n<li><b>Check stops the clock:<\/b> when you press <b>Check<\/b>, the timer stops by itself. You can read\nthe notes for as long as you want. The timer starts again only when you press <b>Next<\/b>\n(or Final Submit on the last exercise).<\/li>\n<li><b>Manual pause:<\/b> the Pause button stops the timer and hides the exercise. Press Resume to continue.<\/li>\n<li><b>Hint:<\/b> one hint per exercise. It costs 10% of that exercise's credit. Hints never reveal the answer.<\/li>\n<li><b>Skip:<\/b> every exercise has a Skip button. Skipping does not stop the timer and does not show\nthe answer. Before you finish, you get a screen to return to skipped exercises. Skipped exercises you\nnever answer are excluded from the score — they count as neither right nor wrong.<\/li>\n<li><b>Retake:<\/b> if you fail, you can retake the exam. Questions and answer choices are shuffled again.<\/li>\n<li><b>Defanged indicators:<\/b> this lab writes harmful addresses safely, like\n<code>hxxp://evil[.]example<\/code> and <code>45[.]33[.]10[.]7<\/code>. In terminal exercises, type\ndomains the same defanged way.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "e01", "type": "fill", "sum": "Which tactic owns T1583?", "scen": "You are reading the MITRE ATT&amp;CK website. You open the page for technique <b>T1583 — Acquire Infrastructure<\/b>. You want to know which tactic it belongs to.", "arts": [], "q": "Complete the sentence with the right tactic name.", "note": "Pick one word or phrase for each blank from the word bank.", "hint": "T1583 happens before the attack starts. It is preparation work.", "study": "ATT&amp;CK tactic names and IDs: Reconnaissance TA0043, Resource Development TA0042, Initial Access TA0001, Command and Control TA0011.", "ex": "<p>T1583 describes buying or renting infrastructure. That is preparation. It happens before the attack touches the victim. ATT&amp;CK calls this phase <b>Resource Development (TA0042)<\/b>. Initial Access starts when the attacker contacts the victim. Command and Control starts after a machine is infected. Reconnaissance is about learning things about the victim, not buying servers.<\/p>", "seg": ["T1583 — Acquire Infrastructure belongs to the ", {"a": "Resource Development", "why": "Buying servers and domains is preparation work, so ATT&amp;CK files it under Resource Development (TA0042)."}, " tactic (TA0042)."], "bank": ["Resource Development", "Initial Access", "Command and Control", "Reconnaissance"]}, {"id": "e02", "type": "match", "sum": "Match four sub-technique names to plain words", "scen": "Your instructor shows you four sub-technique names from the T1583 page. Read each name. Pick the definition that fits best.", "arts": [], "q": "Match each sub-technique to its plain-language meaning.", "hint": "Think about what each name literally means: a name, a rented machine, infected machines, popular websites.", "study": "The eight T1583 sub-techniques: Domains, DNS Server, Virtual Private Server, Server, Botnet, Web Services, Serverless, Malvertising.", "ex": "<p>Each sub-technique is one kind of infrastructure. Domains are names. VPS are rented machines. Botnets are networks of infected devices the attacker rents. Web services are normal websites the attacker signs up for. Knowing these four covers most real cases you will see.<\/p>", "pairs": [{"l": "T1583.001 — Domains", "r": "Buying a website name that looks like a company name", "why": ["A domain is the human-readable name, for example corp-login[.]com."]}, {"l": "T1583.003 — Virtual Private Server", "r": "Renting a virtual machine in the cloud, ready in minutes", "why": ["A VPS is a rented machine inside a provider cloud, such as a small Linux server."]}, {"l": "T1583.005 — Botnet", "r": "Renting a network of already-infected devices", "why": ["A botnet is many infected computers that follow one attacker."]}, {"l": "T1583.006 — Web Services", "r": "Signing up for popular sites like GitHub or Dropbox", "why": ["Web services are normal public websites the attacker abuses for storage or C2."]}]}, {"id": "e03", "type": "qcm", "sum": "Read a WHOIS record", "scen": "A defender found the domain <b>corp-login[.]com<\/b> in a phishing email. Here is a shortened WHOIS record for it.", "arts": [{"label": "WHOIS record (shortened)", "text": "Domain Name:  corp-login[.]com\nRegistrar:    NameSilo, LLC\nCreation Date: 2026-10-11  (3 days ago)\nExpiry Date:  2027-10-11\nRegistrant:   Privacy service, Reykjavik, IS\nName Server:  ns1.corp-login[.]com"}], "q": "Look at the Creation Date. What does it suggest?", "note": null, "hint": "This is about the creation date in the record. Ask: how old is this name?", "study": "WHOIS records show Creation Date, Registrar and Registrant. Fresh creation dates matter for T1583.001.", "ex": "<p>The Creation Date says the domain is 3 days old. Attackers often register a domain days before they use it, then throw it away. The privacy service hides the owner. So: fresh name plus private owner plus phishing email equals likely acquired infrastructure. This is sub-technique T1583.001.<\/p>", "opts": [{"t": "The record shows the domain was registered only 3 days ago, just before the phishing wave", "c": true, "why": ["A very young creation date next to a phishing email is a classic sign of acquired infrastructure (T1583.001)."]}, {"t": "The record shows the domain has been trusted and in stable use for over ten years", "c": false, "why": ["The record says 3 days, not ten years."]}, {"t": "The record shows the domain is managed day to day by our own internal IT team", "c": false, "why": ["The registrant is a privacy service in another country, not the company IT team."]}, {"t": "The record shows the domain belongs to a government office in another country", "c": false, "why": ["Nothing in the record points to a government office."]}]}, {"id": "e04", "type": "dd", "sum": "Sort four activities into sub-techniques", "scen": "A CTI report lists four activities. Each one matches a different T1583 sub-technique. Sort them. Drag each card into the right bucket.", "arts": [], "q": "Drag each activity to the sub-technique it matches.", "note": null, "hint": "Two are about running your own systems (name servers, a machine). One is code without servers. One is paid adverts.", "study": "T1583.002 DNS Server, T1583.004 Server, T1583.007 Serverless (AWS Lambda, Cloudflare Workers), T1583.008 Malvertising.", "ex": "<p>Own name servers give the attacker control over DNS answers. A bought physical server is the Server sub-technique. Cloud functions like Lambda are Serverless. Paying for adverts that push malware is Malvertising. These four sub-techniques cover very different buying choices.<\/p>", "zones": [{"k": "dns", "n": "T1583.002 — DNS Server"}, {"k": "server", "n": "T1583.004 — Server"}, {"k": "serverless", "n": "T1583.007 — Serverless"}, {"k": "ads", "n": "T1583.008 — Malvertising"}], "items": [{"t": "Set up own name servers to answer malware queries", "z": "dns", "why": ["Running your own name servers is the DNS Server sub-technique."]}, {"t": "Buy a physical machine and put it in a rack", "z": "server", "why": ["A real, physical machine is the Server sub-technique."]}, {"t": "Deploy a small cloud function on AWS Lambda", "z": "serverless", "why": ["Lambda functions are serverless: code without a managed server."]}, {"t": "Pay for a fake browser-update advert in search results", "z": "ads", "why": ["Buying malicious ads is Malvertising."]}]}, {"id": "e05", "type": "fill", "sum": "Complete three sentences about T1583", "scen": "You write your first study note about T1583. Complete it with words from the bank.", "arts": [], "q": "Fill the three blanks.", "note": "Pick one word or phrase for each blank from the word bank.", "hint": "Tactic first: it is the preparation tactic. Then the timing. Then the verb for getting infrastructure.", "study": "Resource Development (TA0042); acquisition happens before victim contact; acquiring means buy / rent / register.", "ex": "<p>Three facts to remember: T1583 lives in Resource Development (TA0042); it happens before the attack; acquiring means buying, renting or registering. If the attacker <i>breaks into<\/i> someone else’s server instead, that is a different technique — T1584, Compromise Infrastructure.<\/p>", "seg": ["T1583 sits in the ", {"a": "Resource Development", "why": "TA0042 Resource Development is the preparation tactic."}, " tactic. It happens ", {"a": "before", "why": "Acquisition is preparation; it precedes victim contact."}, " the attacker touches the victim. The attacker ", {"a": "rents", "why": "Acquiring means buying, renting or registering — not stealing."}, " the infrastructure."], "bank": ["Resource Development", "before", "rents", "Initial Access", "during", "breaks into"]}, {"id": "e06", "type": "order", "sum": "Order a simple attack setup", "scen": "An attacker wants to steal bank logins. They bought a domain and rented a small server. Put their setup steps in the order they really happen.", "arts": [], "q": "Order the four steps from first to last.", "note": "Put the steps in the correct order. Use the arrows or drag the rows.", "hint": "First you need the name, then the name must point somewhere, then content goes live, then results arrive.", "study": "A phishing setup chain: register domain (T1583.001) → point DNS → host page → collect credentials.", "ex": "<p>The order follows how the internet works. First the domain exists. Then DNS points it to the server. Then the fake page goes live. Only then can credentials arrive. The first two steps are pure T1583 work — acquiring and wiring infrastructure before any victim contact.<\/p>", "items": [{"t": "Register the lookalike domain"}, {"t": "Point the domain’s DNS record at the rented server"}, {"t": "Host a fake bank login page on the server"}, {"t": "Collect the victim logins that arrive"}]}, {"id": "e07", "type": "logq", "sum": "Find the freshly acquired domain in a proxy log", "scen": "You are a SOC analyst. Your feed added a domain-age column to today’s proxy log. Old domains are usually normal. Very young domains deserve a look.", "arts": [], "q": "Look at the AGE column. Which domain was most likely just acquired by an attacker?", "note": null, "hint": "One line has an age in days, not years, and the name copies the company name.", "study": "Newly registered domains that imitate your brand are the strongest cheap signal of T1583.001.", "ex": "<p>Only <b>northwind-login[.]net<\/b> is 2 days old, and its name copies the company brand. The proxy already blocked it. Everything else is years old and expected. Age plus brand imitation is the simplest attacker-infrastructure signal in daily SOC work.<\/p>", "log": "09:02:11  10[.]0[.]4[.]15  login.microsoftonline[.]com   AGE 12 years   allow\n09:05:47  10[.]0[.]4[.]15  logistics-partner[.]com       AGE 4 years    allow\n09:07:03  10[.]0[.]4[.]22  northwind-login[.]net         AGE 2 days     block\n09:09:44  10[.]0[.]5[.]31  cdn.jsdelivr[.]net            AGE 8 years    allow\n09:12:18  10[.]0[.]5[.]31  stats.nw-shop[.]com           AGE 3 years    allow\n09:14:52  10[.]0[.]7[.]9   payrolls-secure[.]com         AGE 5 days     block", "logLabel": "Proxy log with domain age (2026-10-14)", "widget": {"type": "qcm", "opts": [{"t": "northwind-login[.]net", "c": true}, {"t": "logistics-partner[.]com", "c": false}, {"t": "cdn.jsdelivr[.]net", "c": false}, {"t": "stats.nw-shop[.]com", "c": false}]}}, {"id": "e08", "type": "qcm", "sum": "Attacker view: why buy a lookalike name?", "scen": "You play the attacker in a training lab. You registered <b>nwlogistics-support[.]com<\/b>. The real company is Northwind Logistics.", "arts": [], "q": "Why did you buy a name so close to the real one?", "note": null, "hint": "This is about trust. What does the name borrow from the real company?", "study": "Typosquatting and lookalike domains (T1583.001) power phishing (T1566).", "ex": "<p>From the attacker side: the name does the lying for free. Employees see a familiar name and trust the page. From the defender side: that is exactly why fresh lookalike domains are watched so closely. The domain is T1583.001; the phishing it enables later is T1566.<\/p>", "opts": [{"t": "To trick employees into trusting a fake login or invoice page", "c": true, "why": ["Lookalike names borrow the trust people have in the real brand. That is the whole point of T1583.001."]}, {"t": "To sell the domain back to the company for a profit later on", "c": false, "why": ["Reselling is not the goal here; the domain is used in the attack."]}, {"t": "To host the company’s real public website on faster servers", "c": false, "why": ["The attacker cannot host the real website; they do not own it."]}, {"t": "To test how fast the company’s mail servers respond today", "c": false, "why": ["Mail server speed has nothing to do with a lookalike domain."]}]}, {"id": "e09", "type": "qcm", "sum": "Defender view: first action on a lookalike domain", "scen": "You are the SOC analyst. A feed found <b>nw-benefits-login[.]com<\/b>, registered 3 days ago. Nobody in the company has visited it yet.", "arts": [], "q": "What is the best first action?", "note": null, "hint": "Nobody has clicked yet. The safest step watches instead of touching.", "study": "Least-aggressive response: watchlist + alerting first; visit only in a sandbox; never share live links.", "ex": "<p>The domain has not been used yet. A watchlist gives you a free tripwire: if anyone visits, you get an alert and can act in seconds. Visiting it yourself is risky. Ignoring it loses your early warning. This watch-first habit is the defender’s answer to acquired infrastructure.<\/p>", "opts": [{"t": "Add it to a watchlist and alert if any employee visits it", "c": true, "why": ["Watching costs nothing and catches the first visit. It is the least aggressive correct step."]}, {"t": "Visit the site from a work laptop to see what it currently shows", "c": false, "why": ["Never visit attacker pages from a work machine. Use a safe sandbox outside the company."]}, {"t": "Ignore it completely — newly registered domains are never dangerous", "c": false, "why": ["Fresh lookalike domains are one of the most common phishing setups."]}, {"t": "Email all staff a clickable link so everyone can inspect the domain", "c": false, "why": ["Sending the live link invites clicks. Share a screenshot without the link instead."]}]}, {"id": "e10", "type": "match", "sum": "Who sells what?", "scen": "Attackers use normal internet shops. Match each seller to what it sells.", "arts": [], "q": "Match each provider to its role.", "hint": "One sells names, one sells fast machines, one ignores complaints.", "study": "Registrar (names), VPS provider (cloud machines), bulletproof host (abuse-tolerant hosting).", "ex": "<p>The attacker shops like everyone else. Registrars sell names (T1583.001). VPS providers sell quick cloud machines (T1583.003). Bulletproof hosts are the dark corner: they ignore abuse reports, so attacker servers stay online longer.<\/p>", "pairs": [{"l": "A domain registrar", "r": "Sells the right to use a website name for a year", "why": ["Registrars sell domain names, for example .com or .net names."]}, {"l": "A bulletproof hosting provider", "r": "Rents servers and ignores abuse complaints", "why": ["Bulletproof hosts keep serving criminals even after reports."]}, {"l": "A VPS provider", "r": "Rents ready-to-use virtual machines in minutes", "why": ["VPS providers sell fast cloud machines with little paperwork."]}]}, {"id": "e11", "type": "dd", "sum": "Bought or broken into?", "scen": "Two techniques sit side by side in ATT&amp;CK: <b>T1583 Acquire Infrastructure<\/b> (the attacker gets their own) and <b>T1584 Compromise Infrastructure<\/b> (the attacker takes over someone else’s). Sort the six actions.", "arts": [], "q": "Drag each action to the correct technique.", "note": null, "hint": "Ask one question per card: does the attacker own or rent this — or did they take it from a victim?", "study": "T1583 = acquire (own/rent/register). T1584 = compromise (use victim-owned systems). Aged auction domains are still T1583.", "ex": "<p>The line is ownership. Bought, rented or registered → T1583. Taken from a victim → T1584. Both are Resource Development techniques. From both sides: attackers choose T1583 for control and quiet start-up, and T1584 for free reputation. Defenders mostly meet the victim-side wreckage of T1584, while T1583 shows up as fresh domains and rented servers.<\/p>", "zones": [{"k": "acq", "n": "T1583 — Acquire Infrastructure"}, {"k": "comp", "n": "T1584 — Compromise Infrastructure"}], "items": [{"t": "Registers payroll-portal[.]com", "z": "acq", "why": ["Registering a new name is acquisition."]}, {"t": "Rents a VPS from a no-questions-asked host", "z": "acq", "why": ["Renting is acquisition (T1583.003)."]}, {"t": "Signs up for a free Dropbox account", "z": "acq", "why": ["Web-service sign-up is acquisition (T1583.006)."]}, {"t": "Hacks a university web server to host phishing", "z": "comp", "why": ["Taking over someone else’s server is compromise (T1584)."]}, {"t": "Uses a hacked home router as C2", "z": "comp", "why": ["The router belongs to a victim; using it is compromise (T1584)."]}, {"t": "Buys an expired shopping domain at an auction", "z": "acq", "why": ["Buying an aged expired domain is still acquisition (T1583.001)."]}]}, {"id": "e12", "type": "qcm", "sum": "Why is the link written with [.] ?", "scen": "A CTI report writes the address as <code>hxxp://login-bank[.]com<\/code> instead of a normal link.", "arts": [], "q": "Why do professionals write indicators this way?", "note": null, "hint": "This is about writing style in reports. What happens if a reader clicks a real link?", "study": "Defanged IOCs: hxxp:// and domain[.]com keep links inert in reports and tickets.", "ex": "<p>Defanging turns a live link into plain text. Nobody clicks it by accident. Mail systems do not autolink it. It also signals professionalism: this report carries real indicators. You will see defanged addresses in every artefact of this exam.<\/p>", "opts": [{"t": "So readers cannot click it by accident, and the report carries no live link", "c": true, "why": ["Defanging is a professional habit that keeps readers and mail scanners safe."]}, {"t": "Because the attacker’s site is broken and currently offline for repairs", "c": false, "why": ["Defanging is a writing style, not a status of the site."]}, {"t": "Because HTTPS certificates hide the real address from ordinary readers", "c": false, "why": ["Certificates have nothing to do with this writing style."]}, {"t": "Because a shortened address keeps the incident report within its page limit", "c": false, "why": ["It actually makes the text longer, not shorter."]}]}, {"id": "e13", "type": "match", "sum": "Match sub-technique IDs to names", "scen": "Reports often cite only the ID. Match the four IDs to their names.", "arts": [], "q": "Match each ID to its sub-technique name.", "hint": "001 Domains · 003 VPS · 006 Web Services · 007 Serverless.", "study": "Sub-technique IDs of T1583: .001 Domains, .002 DNS Server, .003 VPS, .004 Server, .005 Botnet, .006 Web Services, .007 Serverless, .008 Malvertising.", "ex": "<p>ATT&amp;CK sub-technique IDs keep reports short and exact. Dot-001 is Domains, dot-003 is Virtual Private Server, dot-006 is Web Services, dot-007 is Serverless. If you know the eight IDs by heart, you can read any CTI report about this technique at full speed.<\/p>", "pairs": [{"l": "T1583.001", "r": "Domains", "why": ["The dot-001 child of T1583 is Domains."]}, {"l": "T1583.003", "r": "Virtual Private Server", "why": ["Dot-003 is the VPS sub-technique."]}, {"l": "T1583.006", "r": "Web Services", "why": ["Dot-006 covers GitHub, Dropbox, Twitter and friends."]}, {"l": "T1583.007", "r": "Serverless", "why": ["Dot-007 covers Cloudflare Workers, AWS Lambda, Google Apps Script."]}]}, {"id": "e14", "type": "fill", "sum": "One-word definition: botnet", "scen": "You explain botnets to a new colleague. Complete the sentence.", "arts": [], "q": "Fill the blank.", "note": "Pick one word or phrase for each blank from the word bank.", "hint": "The devices were captured, not bought new.", "study": "T1583.005 Botnet: a rented network of compromised systems; booter/stresser services sell access.", "ex": "<p>A botnet is a herd of infected devices — routers, cameras, computers — that follow one attacker. Other actors can rent parts of that herd (T1583.005). ATT&amp;CK also notes ORB networks, which mix rented VPS with infected routers to hide the attacker even better.<\/p>", "seg": ["A botnet is a network of ", {"a": "infected", "why": "Botnets are made of infected devices under attacker control."}, " devices that the attacker can command at the same time."], "bank": ["infected", "brand-new", "offline"]}, {"id": "e15", "type": "dd", "sum": "Spot the attacker-owned assets", "scen": "An asset list mixes normal company systems with attacker infrastructure. Drag the two attacker-acquired items into the attacker bucket.", "arts": [], "q": "Sort all five cards into the right bucket.", "note": null, "hint": "Ask for each card: does the company own it and know about it?", "study": "Asset inventories help defenders spot unowned assets — the shadow infrastructure of attackers.", "ex": "<p>The two attacker items share a pattern: nobody in the company owns them. A rented VPS hosting a fake portal and a fresh unmatched domain are both T1583 results. This is why asset inventories matter: what you cannot match to an owner deserves a closer look.<\/p>", "zones": [{"k": "atk", "n": "Attacker-acquired infrastructure"}, {"k": "co", "n": "Normal company asset"}], "items": [{"t": "VPS rented last week; no business owner; hosts a fake VPN portal", "z": "atk", "why": ["No owner plus a fake portal on a rented VPS is acquired infrastructure."]}, {"t": "Domain nw-benefits[.]com registered 4 days ago; no vendor matches it", "z": "atk", "why": ["A fresh, unmatched lookalike domain is T1583.001."]}, {"t": "Our public web server, asset tag NW-WEB-01", "z": "co", "why": ["A tagged, owned server is a company asset."]}, {"t": "Staff laptops managed in the company MDM", "z": "co", "why": ["Managed endpoints belong to the company."]}, {"t": "Our Microsoft 365 tenant", "z": "co", "why": ["The tenant is company-owned infrastructure."]}]}, {"id": "e16", "type": "term", "sum": "Run a WHOIS lookup in the lab shell", "scen": "Your manager asks: “When was that odd domain registered?” This lab gives you a small fake shell with the <b>whois<\/b> tool. <b>Lab rule:<\/b> type domains defanged, exactly like in the reports: corp-login[.]com", "arts": [{"label": "Syntax reminder (example on a different target)", "text": "whois <domain>\n\nAsks the registrar database about a domain name.\nIt answers with dates, registrar and owner contact data.\n\nExample on a different target (do not copy it):\n    whois big-shop[.]example"}, {"label": "Expected output shape", "text": "Domain Name: CORP-LOGIN[.]COM\nCreation Date: 2026-10-11T09:14:00Z\nRegistrar: NameSilo, LLC"}], "q": "Type the whois command for corp-login[.]com and run it.", "note": "Type the command, press Enter (or Run), then press Check.", "hint": "Type the tool name first, then the domain. The syntax panel above shows the exact shape.", "study": "whois usage: whois &lt;domain&gt; — returns registrar, creation and expiry dates, registrant.", "ex": "<p>whois asks the registrar database for registration facts. The answer shows Creation Date (2026-10-11 — three days before the phishing wave) and a privacy service as owner. Fresh date plus hidden owner = classic acquired domain. The same fact appeared in the EASY reading exercise — here you produced it yourself.<\/p>", "term": {"prompt": "analyst@lab:~$", "avail": ["whois"], "canonical": "whois corp-login[.]com", "out": {"whois corp-login[.]com": "Domain Name:  CORP-LOGIN[.]COM\nRegistrar:    NameSilo, LLC\nCreation Date: 2026-10-11T09:14:00Z\nRegistry Expiry Date: 2027-10-11T09:14:00Z\nRegistrant Organization: Privacy service, Reykjavik, IS"}, "elements": [{"re": "(^| )whois( |$)", "name": "tool: whois", "desc": "The registry lookup tool that answers with registrar and dates."}, {"re": "corp-login\\.com", "name": "target: corp-login[.]com", "desc": "The domain to ask about, typed defanged as this lab requires."}], "forbidden": []}, "terminal": true, "avail": ["whois"]}, {"id": "e17", "type": "order", "sum": "Order the defender’s response", "scen": "A brand-protection feed spotted a lookalike domain. Put the defender’s three steps in the order they should happen.", "arts": [], "q": "Order the three steps from first to last.", "note": "Put the steps in the correct order. Use the arrows or drag the rows.", "hint": "Notice first, then enrich with facts, then act.", "study": "Defender loop for acquired domains: detect (feeds) → enrich (WHOIS) → respond (block, takedown, brand team).", "ex": "<p>Good responders look before they block. First the feed points at the domain. Then WHOIS tells you it is fresh and hidden. Only then do you block and wake the brand team. Skipping the middle step is how companies block their own marketing campaigns by mistake.<\/p>", "items": [{"t": "Spot the lookalike in a certificate-transparency / brand feed"}, {"t": "Check the WHOIS creation date and owner"}, {"t": "Block at the mail gateway and notify the brand team"}]}]};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!=null){e.innerHTML=html;}return e;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function copyTxt(btn,txt){try{navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},1200);},function(){});}catch(e){}}
function hl(text){
  var lines=String(text).split('\n'),out=[];
  for(var i=0;i<lines.length;i++){
    var L=esc(lines[i]);
    L=L.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.Z+-]*)/,'<span class="t-ts">$1</span>');
    L=L.replace(/^(\d{2}:\d{2}:\d{2})/,'<span class="t-ts">$1</span>');
    L=L.replace(/(\d{1,3}\[\.\]){3}\d{1,3}/g,'<span class="t-ip">$&</span>');
    L=L.replace(/([a-z0-9][a-z0-9-]*\[\.\])+(com|net|org|io|ru|cn|su|top|xyz|info|biz|online|shop|site|link|live|app|dev|co|uk|de|fr|nl|is|cc|tv|me|gov|edu|mil)\b/gi,'<span class="t-dom">$&</span>');
    L=L.replace(/hxxps?:\/\/[^\s<"'）)]+/g,'<span class="t-url">$&</span>');
    L=L.replace(/\b(GET|POST|DNS|TXT|TLS|SSL|HTTP|HTTPS|OK|FAILED|query|response|53)\b/g,'<span class="t-kw">$&</span>');
    out.push(L);
  }
  return out.join('\n');
}

/* ================= scoring core (contract) ================= */
/* scoreExercise(selectedItems, correctItems, optTotal) -> credit in [0,1]
   H = |selected & correct|, W = |selected \ correct|, N = optTotal or correct.length
   credit = max(0, (H - W) / N) */
function scoreExercise(selectedItems, correctItems, optTotal){
  var corr={};for(var i=0;i<correctItems.length;i++){corr[correctItems[i]]=true;}
  var H=0,W=0,seen={};
  for(var j=0;j<selectedItems.length;j++){
    var id=selectedItems[j];
    if(seen[id]){continue;}
    seen[id]=true;
    if(corr[id]){H++;}else{W++;}
  }
  var N=(typeof optTotal==='number')?optTotal:correctItems.length;
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED        */
function setState(st){S.tState=st;renderHeader();}
function startTimer(){
  if(S.tick){clearInterval(S.tick);}
  setState('RUNNING');
  S.tick=setInterval(function(){
    if(S.tState!=='RUNNING'){return;}
    S.remaining--;
    if(S.remaining<=0){S.remaining=0;renderHeader();timerEnd();return;}
    renderHeader();
  },1000);
}
function stopTick(){if(S.tick){clearInterval(S.tick);S.tick=null;}}
function pauseAuto(){ /* Check pressed: first action = stop the clock, before feedback renders */
  if(S.tState==='RUNNING'){S.pauseStart=Date.now();setState('PAUSED_AUTO_CHECK');}
}
function pauseManual(){
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S.pauseStart=Date.now();
    S.resumeTo=(S.tState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
    setState('PAUSED_MANUAL');
    showOverlay(true);
  }
}
function resumeManual(){
  if(S.tState!=='PAUSED_MANUAL'){return;}
  var d=Math.max(0,Math.round((Date.now()-S.pauseStart)/1000));
  if(S.resumeTo==='PAUSED_AUTO_CHECK'){S.autoSec+=d;}else{S.manualSec+=d;}
  showOverlay(false);
  setState(S.resumeTo||'RUNNING');
}
function timerEnd(){stopTick();S.tState='ENDED';renderHeader();endExam(true);}

/* per-exercise reduced timer (EXTREMELY HARD terminal only) */
function startPerEx(sec){
  S.perExRemaining=sec;
  if(S.perExHandle){clearInterval(S.perExHandle);}
  S.perExHandle=setInterval(function(){
    if(S.tState!=='RUNNING'||S.perExHandle===null){return;}
    S.perExRemaining--;
    var c=document.getElementById('perx-time');
    if(c){c.textContent=fmtT(Math.max(0,S.perExRemaining));}
    if(S.perExRemaining<=0){stopPerEx();perExExpire();}
  },1000);
}
function stopPerEx(){if(S.perExHandle){clearInterval(S.perExHandle);S.perExHandle=null;}}

function removeFromSkip(i){

/* skip / hint / next */
function onSkip(){
  if(locked){return;}
  if(!S.skipSet[S.cur]){S.skip.push(S.cur);S.skipSet[S.cur]=true;}
  S.reviewReturn=false; /* rejoining the main flow: do not bounce back to the review screen later */
  stopPerEx();
  if(S.pos>=S.order.length-1){
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }else{
    S.pos++;renderExercise(S.order[S.pos],false);
  }
}
function onHint(){
  if(S.hint[S.cur]||locked){return;}
  S.hint[S.cur]=true;
  var exd=DATA.exercises[S.cur];
  var hb=document.querySelector('.hintbox-slot');
  if(hb){hb.innerHTML='<div class="hintbox"><b>Hint</b> — '+exd.hint+' <span class="hintcost">(costs 10% of this exercise\'s credit)</span></div>';}
  document.getElementById('btn-hint').disabled=true;
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){setState('RUNNING');}
  /* Next is only reachable after Check (it is hidden until then); if it ever
     fires with the current exercise unanswered, do nothing rather than
     silently abandoning the exercise. */
  if(!S.answered[S.cur]){return;}
  var isLast=(S.pos>=S.order.length-1);
  if(S.reviewReturn){S.reviewReturn=false;screenReview();return;}
  if(!isLast){S.pos++;renderExercise(S.order[S.pos],false);}
  else{
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }
}

function fbLabel(credit){

/* ================= widgets ================= */
function WQCM(box,exd,api){
  var st={sel:null};
  var opts=exd.opts.map(function(o,i){return {o:o,i:i};});
  opts=shuffle(opts);
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.innerHTML='<span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      st.sel=p.i;
      var all=wrap.querySelectorAll('.opt');
      for(var z=0;z<all.length;z++){all[z].classList.remove('sel');all[z].setAttribute('aria-pressed','false');}
      b.classList.add('sel');b.setAttribute('aria-pressed','true');api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=-1;
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct=i;break;}}
    var selArr=(st.sel==null)?[]:[st.sel];
    var credit=scoreExercise(selArr,[correct],1);
    var items=[];
    exd.opts.forEach(function(o,i){
      if(i===correct){items.push({label:o.t,status:(st.sel===i)?'ok':'miss',note:o.why||''});}
      else if(st.sel===i){items.push({label:o.t,status:'bad',note:o.why||''});}
    });
    return {credit:credit,H:(st.sel===correct?1:0),W:(st.sel!=null&&st.sel!==correct?1:0),N:1,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMULTI(box,exd,api){
  var st={sel:{}};
  var opts=shuffle(exd.opts.map(function(o,i){return {o:o,i:i};}));
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F','G'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="box" aria-hidden="true"></span><span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.addEventListener('click',function(){
      st.sel[p.i]=!st.sel[p.i];
      if(!st.sel[p.i]){delete st.sel[p.i];}
      b.classList.toggle('sel',!!st.sel[p.i]);
      b.setAttribute('aria-pressed',st.sel[p.i]?'true':'false');
      api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=[];
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct.push(i);}}
    var selArr=[];for(var k in st.sel){if(st.sel[k]){selArr.push(parseInt(k,10));}}
    var N=correct.length;
    var corr={};correct.forEach(function(i){corr[i]=true;});
    var H=0,W=0;
    selArr.forEach(function(i){if(corr[i]){H++;}else{W++;}});
    var credit=scoreExercise(selArr,correct,N);
    var items=[];
    exd.opts.forEach(function(o,i){
      var picked=!!st.sel[i];
      if(o.c){items.push({label:o.t,status:picked?'ok':'miss',note:o.why||'This belongs in the answer set.'});}
      else if(picked){items.push({label:o.t,status:'bad',note:o.why||'This does not belong in the answer set.'});}
    });
    return {credit:credit,H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMATCH(box,exd,api){
  var rights=shuffle(exd.pairs.map(function(p){return p.r;}));
  var st={};
  var wrap=el('div');
  exd.pairs.forEach(function(p,i){
    var row=el('div','mrow');
    var selHtml='<select class="selctl" data-i="'+i+'" aria-label="Match for item '+(i+1)+'"><option value="">— choose —</option>';
    rights.forEach(function(r){selHtml+='<option>'+esc(r)+'</option>';});
    selHtml+='</select>';
    row.innerHTML='<div class="mleft">'+esc(p.l)+'</div>'+selHtml;
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  wrap.addEventListener('change',function(e){if(e.target.tagName==='SELECT'){st[e.target.getAttribute('data-i')]=e.target.value;api.mark();}});
  return function(){
    var N=exd.pairs.length;
    var corr=[],selArr=[],items=[];
    exd.pairs.forEach(function(p,i){
      corr.push('ok:'+i);
      var v=st[i]||'';
      if(!v){items.push({label:p.l+' → '+p.r,status:'miss',note:p.why||''});}
      else if(v===p.r){selArr.push('ok:'+i);items.push({label:p.l+' → '+p.r,status:'ok',note:p.why||''});}
      else{selArr.push('bad:'+i);items.push({label:p.l+' — you chose "'+v+'", correct is "'+p.r+'"',status:'bad',note:p.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});

function WDD(box,exd,api){

    st[chip.getAttribute('data-i')]=zd.getAttribute('data-zone');

    api.mark();
  }

  function zoneAt(x,y){
    var els=document.elementsFromPoint?document.elementsFromPoint(x,y):[];
    for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains('zone')){return els[i];}}

  });
  wrap.addEventListener('pointerdown',function(e){
    var chip=e.target.closest?e.target.closest('.chip'):null;
    if(!chip||locked){return;}
    drag={chip:chip,sx:e.clientX,sy:e.clientY,pid:e.pointerId,ghost:null,moved:false};
    try{chip.setPointerCapture(e.pointerId);}catch(err){}
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&(Math.abs(dx)>7||Math.abs(dy)>7)){
      drag.moved=true;
      var g=drag.chip.cloneNode(true);
      g.className='chip ghost';g.style.width=drag.chip.offsetWidth+'px';
      document.body.appendChild(g);drag.ghost=g;drag.chip.classList.add('src');
    }
    if(drag.moved){
      if(drag.ghost){drag.ghost.style.left=(e.clientX+10)+'px';drag.ghost.style.top=(e.clientY+10)+'px';}
      var z=zoneAt(e.clientX,e.clientY);

      if(z){z.classList.add('over');}

    }
  });
  wrap.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(drag.moved){
      var z=zoneAt(e.clientX,e.clientY);
      var all=zg.querySelectorAll('.zone.over');
      for(var i=0;i<all.length;i++){all[i].classList.remove('over');}
      if(z){place(drag.chip,z);}
      if(drag.ghost){drag.ghost.remove();}
      drag.chip.classList.remove('src');
    }else{
      var ch=drag.chip;
      if(picked===ch){ch.classList.remove('picked');picked=null;}
      else{
        if(picked){picked.classList.remove('picked');}
        if(ch.parentElement&&ch.parentElement.classList&&ch.parentElement.classList.contains('zone-items')){
          bank.appendChild(ch);delete st[ch.getAttribute('data-i')];
        }else{picked=ch;ch.classList.add('picked');}
      }
    }
    drag=null;
  });
  wrap.addEventListener('click',function(e){
    if(!picked||locked){return;}
    var z=e.target.closest?e.target.closest('.zone'):null;
    if(z){place(picked,z);picked.classList.remove('picked');picked=null;}
  });
  return function(){

    exd.items.forEach(function(it,i){
      corr.push('ok:'+i);
      var zname='';

      var v=st[i]||'';

      else if(v===it.z){selArr.push('ok:'+i);items.push({label:it.t+' → '+zname,status:'ok',note:it.why||''});}
      else{selArr.push('bad:'+i);items.push({label:it.t+' — you placed it in "'+zones[v].n+'", correct is "'+zname+'"',status:'bad',note:it.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };

function WORDER(box,exd,api){

    });

function WTERM(box,exd,api){
  var term=el('div','term');
  var out=el('div','term-out');
  var line=el('div','term-line');
  var inp=document.createElement('input');
  inp.className='tin';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','Terminal input');
  var run=el('button','btn mini','Run');run.type='button';
  line.innerHTML='<span class="tp">'+esc(exd.term.prompt)+'</span>';
  line.appendChild(inp);line.appendChild(run);
  term.appendChild(out);term.appendChild(line);
  box.appendChild(term);
  var lastCmd='';
  var norm=function(c){return String(c).toLowerCase().replace(/\s+/g,' ').replace(/[\[\]]/g,'').replace(/['"]/g,'').trim();};
  var outMap={};
  var k;
  if(exd.term.out){for(k in exd.term.out){outMap[norm(k)]=exd.term.out[k];}}
  function echo(cmd,n){
    out.appendChild(el('div','tline','<span class="tp">'+esc(exd.term.prompt)+'</span> '+esc(cmd)+(n!==norm(cmd)?'   <span class="t-ts">[normalised: '+esc(n)+']</span>':'')));
  }
  function puts(txt,cls){
    String(txt).split('\n').forEach(function(l){out.appendChild(el('div','tline'+(cls?' '+cls:''),hl(l)));});
  }
  function runCmd(){
    var v=inp.value;
    if(!v.trim()){return;}
    var n=norm(v);
    echo(v,n);
    if(n==='clear'){out.innerHTML='';}
    else if(n==='pwd'){puts('/home/analyst');}
    else if(n==='ls'||n==='ls -la'||n==='ls -l'){puts('cases   evidence   logs   notes.txt');}
    else if(n==='help'){puts('Commands known in this lab: '+(exd.term.avail||[]).join(', ')+', plus pwd / ls / clear / help.');}
    else if(outMap[n]!=null){
      lastCmd=n;
      puts(outMap[n]);
    }else{
      var tok=v.trim().split(/\s+/)[0];
      out.appendChild(el('div','tline t-err','bash: '+esc(tok)+': command not found (this lab only knows: '+(exd.term.avail||[]).join(', ')+')'));
      lastCmd=n; /* wrong tool attempt is graded too */
    }
    inp.value='';
    out.scrollTop=out.scrollHeight;
    api.mark();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){runCmd();}});
  run.addEventListener('click',runCmd);
  return function(){
    var els=exd.term.elements;
    var forb=exd.term.forbidden||[];
    var N=els.length;
    var corr=[],selArr=[],items=[],danger=[];
    els.forEach(function(e2,i){
      corr.push('ok:'+i);
      var hit=new RegExp(e2.re,'i').test(lastCmd);
      if(hit){selArr.push('ok:'+i);items.push({label:e2.name,status:'ok',note:e2.desc});}
      else{items.push({label:e2.name,status:'miss',note:e2.desc});}
    });
    forb.forEach(function(f){
      if(new RegExp(f.re,'i').test(lastCmd)){
        selArr.push('bad:f'+danger.length);
        items.push({label:f.name,status:'bad',note:f.desc});
        danger.push('<b>'+esc(f.name)+'</b> — '+f.desc);
      }
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    var g={credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:danger.length?danger.join('<br>'):''};
    g.postRender=function(zone){
      var code=el('div');
      code.innerHTML='<div class="qnote" style="margin-top:10px"><b>Canonical command:</b></div><pre class="codeblk">'+esc(exd.term.canonical)+'</pre>';
      var cb=el('button','btn mini','Copy');cb.type='button';
      cb.addEventListener('click',function(){copyTxt(cb,exd.term.canonical);});
      code.appendChild(cb);
      var parts='';
      for(var i=0;i<exd.term.elements.length;i++){parts+='<li><b>'+esc(exd.term.elements[i].name)+'</b> — '+exd.term.elements[i].desc+'</li>';}
      var expl=el('div');
      expl.innerHTML='<ul>'+parts+'</ul>';
      code.appendChild(expl);
      zone.appendChild(code);
    };
    if(!lastCmd){g.exHTML='<p><b>No command was run.</b> In the fake shell, type a command and press Enter (or press Run), then press Check. This attempt scored 0 because no command could be graded.</p>'+exd.ex;}
    return g;
  };
}
function WBRANCH(box,exd,api){
  var st={step:0,picks:[],done:false};
  var wrap=el('div');

  var stepBox=el('div');
  wrap.appendChild(prog);wrap.appendChild(stepBox);
  box.appendChild(wrap);
  var blogEl=wrap.querySelector('#blog');
  function renderStep(){
    var k=st.step;
    var s=exd.steps[k];
    stepBox.innerHTML='';
    var head=el('div');
    var opts=s.opts.map(function(o){return o;});
    opts=shuffle(opts);
    var html='<p><span class="stepchip">STEP '+(k+1)+' OF '+exd.steps.length+'</span></p>';
    if(s.add){html+='<div class="prose" style="margin-top:8px">'+s.add+'</div>';}
    html+='<p style="margin-top:10px"><b>'+s.q+'</b></p><div class="opts">';
    var letters=['A','B','C','D'];
    opts.forEach(function(p,i){
      html+='<button class="opt" type="button" data-i="'+p.i+'"><span class="lbl">'+letters[i]+'.</span><span>'+p.o.t+'</span></button>';
    });
    html+='</div><div style="margin-top:10px"><button class="btn primary" type="button" id="bconfirm" disabled>Confirm step</button></div>';
    head.innerHTML=html;
    stepBox.appendChild(head);
    var selIdx=null;
    var bc=stepBox.querySelector('#bconfirm');
    var ob=stepBox.querySelectorAll('.opt');

      ob[i].addEventListener('click',function(){

      if(k<exd.steps.length-1){st.step++;renderStep();}
      else{st.done=true;stepBox.innerHTML='<div class="qnote">All steps recorded. Press <b>Check</b> to grade the whole decision chain.</div>';api.mark();}
    });
  }
  renderStep();
  return function(){
    var N=exd.steps.length;
    var corr=[],selArr=[],items=[];
    exd.steps.forEach(function(s,i){
      corr.push('ok:'+i);

      var right=null;
      for(var j2=0;j2<s.opts.length;j2++){if(s.opts[j2].o.c){right=s.opts[j2].o;break;}}
      if(p==null){items.push({label:'Step '+(i+1),status:'miss',note:'No choice recorded. Correct was: "'+right.t+'".'});}
      else if(chosen.o.c){selArr.push('ok:'+i);items.push({label:'Step '+(i+1)+' — '+chosen.o.t,status:'ok',note:chosen.o.why||''});}
      else{selArr.push('bad:'+i);items.push({label:'Step '+(i+1)+' — you chose "'+chosen.o.t+'", best is "'+right.t+'"',status:'bad',note:chosen.o.why||right.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };

  var w=el('main','wrap');w.id='intro';
  var hero=el('div','hero');
  hero.innerHTML=DATA.intro.hero;
  w.appendChild(hero);
  var ab=el('div','hero prose');
  ab.innerHTML=DATA.intro.entity;
  w.appendChild(ab);
  var th=el('div','hero');
  th.innerHTML='<div class="sec-h">Keywords covered in this exam (all four tiers of topic '+esc(TOPIC)+')</div><div class="themes">'
    +DATA.intro.themes.map(function(t){return '<div class="theme"><div class="theme-h">'+esc(t.name)+'</div><div class="theme-items">'+t.items.map(esc).join(' · ')+'</div></div>';}).join('')
    +'</div>';
  w.appendChild(th);
  var rules=el('div','hero prose');
  rules.innerHTML=DATA.intro.rules;
  w.appendChild(rules);
  var nav=el('div','nav');
  var b=el('button','btn primary','Start the exam');
  b.type='button';b.style.fontSize='18px';b.style.padding='14px 30px';
  b.addEventListener('click',function(){startExam();});
  nav.appendChild(b);
  w.appendChild(nav);
  app.appendChild(w);
}
function startExam(){
  S=freshState();
  examShell();
  buildOrder();
  S.pos=0;
  startTimer();
  renderExercise(S.order[0],false);
}
function buildOrder(){
  var ord=shuffle(DATA.exercises.map(function(_,i){return i;}));
  var isT=function(i){return !!DATA.exercises[i].terminal;};
  var guard=0;
  while(guard++<60){
    var fixed=false;
    for(var k=0;k<ord.length-1;k++){
      if(isT(ord[k])&&isT(ord[k+1])){
        var cut=ord.splice(k+1,1)[0];
        var placed=false;
        for(var t=0;t<40&&!placed;t++){
          var p=Math.floor(Math.random()*(ord.length+1));
          var badB=(p>0&&isT(ord[p-1])&&isT(cut));
          var badA=(p<ord.length&&isT(ord[p])&&isT(cut));
          if(!badB&&!badA){ord.splice(p,0,cut);placed=true;}
        }
        if(!placed){
          if(ord.length&&isT(ord[ord.length-1])&&!isT(ord[0])){ord.unshift(cut);}
          else{ord.push(cut);}
        }
        fixed=true;break;
      }
    }
    if(!fixed){break;}
  }
  S.order=ord;
}
function screenReview(){
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  var main=document.getElementById('main');
  main.innerHTML='';
  var hero=el('div','hero');
  var sp=scoreParts();
  hero.innerHTML='<h1 style="margin:4px 0">Review skipped exercises</h1>'
    +'<p class="sub">You skipped '+S.skip.length+' exercise(s). The timer is still running ('+fmtT(S.remaining)+' left). '
    +'Answer them now, or submit. Skipped exercises you never answer are excluded from your score.</p>'
    +'<div class="chips"><span class="mchip">Answered so far: '+sp.n+'</span><span class="mchip">Live score: '+(Math.round(sp.sum*10)/10)+' / '+sp.n+'</span></div>';
  main.appendChild(hero);
  S.skip.forEach(function(i){
    var exd=DATA.exercises[i];
    var c=el('div','revcard');
    c.innerHTML='<span class="badge b-'+SEVK+'">'+esc(SEV)+'</span><div class="rt">'+esc(exd.sum)+'</div>';
    var b=el('button','btn primary','Answer');b.type='button';
    b.addEventListener('click',function(){
      S.reviewReturn=true;
      S.pos=i;
      renderExercise(i,true);
    });
    c.appendChild(b);
    main.appendChild(c);
  });
  var nav=el('div','nav');
  var sub=el('button','btn danger','Submit exam now');sub.type='button';
  sub.addEventListener('click',function(){endExam(false);});
  nav.appendChild(sub);
  main.appendChild(nav);
  window.scrollTo(0,0);
}
function endExam(byTimeout){
  stopTick();stopPerEx();S.tState='ENDED';
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  document.getElementById('btn-pause').style.display='none';
  var ids=[];
  S.order.forEach(function(i){if(S.answered[i]){ids.push(i);}});
  var sum=0,full=0,part=0,partSum=0,zero=0;
  ids.forEach(function(i){var c=S.credit[i];sum+=c;if(c>=1){full++;}else if(c>0){part++;partSum+=c;}else{zero++;}});
  var answered=ids.length;
  var skipped=DATA.exercises.length-answered;
  var pct=answered?Math.round(sum/answered*100):0;
  var passed=pct>=70;
  if(!S.reported){
    S.reported=true;
    try{
      parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,batch:BATCH,
        score:Math.round(sum),total:answered,percent:pct,passed:passed},location.origin);
    }catch(e){/* opened directly: nothing to report to */}
  }
  var main=document.getElementById('main');
  main.innerHTML='';
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML='<div class="pct">'+pct+'%</div>'
    +'<div style="font-size:19px;font-weight:800">'+(passed?'PASS':'FAIL')+' — '+esc(DATA.meta.title)+'</div>'
    +'<p style="margin:8px 0 0">'+(byTimeout?'The exam timer ended. ':'')+'Score over answered exercises only: '+sum.toFixed(1)+' credits / '+answered+' answered. Pass mark: 70%.</p>';
  main.appendChild(hero);
  if(passed){
    var cert=el('div','cert');
    cert.innerHTML='<b>Certificate of completion</b><br>Topic '+esc(TOPIC)+' — tier '+esc(SEV)
      +'<br>Learner: '+esc(USERNAME||'anonymous learner')
      +'<br>Result: '+pct+'% (pass mark 70%) — '+sum.toFixed(1)+' / '+answered+' credits';
    main.appendChild(cert);
  }else{
    var f=el('div','hero prose');
    f.innerHTML='<p>You did not reach the pass mark of 70%. You must retake this tier. Questions and answers will be shuffled again.</p>';
    main.appendChild(f);
  }
  var grid=el('div','statgrid');
  var rows=[['Fully correct',String(full)],['Partially correct',part?(''+part+' (avg '+(partSum/part).toFixed(2)+')'):'0'],['Fully incorrect',String(zero)],['Skipped — excluded',String(skipped)]];
  for(var i=0;i<rows.length;i++){
    var s=el('div','stat');
    s.innerHTML='<div class="n">'+rows[i][1]+'</div><div class="l">'+rows[i][0]+'</div>';
    grid.appendChild(s);
  }
  main.appendChild(grid);
  var pauseStats=el('div','hero prose');
  pauseStats.innerHTML='<div class="sec-h">How your time was spent</div><ul>'
    +'<li>Time in manual breaks: <b>'+fmtT(S.manualSec)+'</b></li>'
    +'<li>Time reviewing feedback (auto-pause on Check): <b>'+fmtT(S.autoSec)+'</b></li>'
    +'<li>Time left on the exam clock: <b>'+fmtT(S.remaining)+'</b></li></ul>';
  main.appendChild(pauseStats);
  var nav=el('div','nav');
  var rb=el('button','btn primary','Retake exam');rb.type='button';
  rb.addEventListener('click',function(){startExam();});
  nav.appendChild(rb);
  main.appendChild(nav);
  renderHeader();
  window.scrollTo(0,0);
}

/* ================= website handshake (optional) ================= */
window.addEventListener('message',function(event){
  if(!event.data){return;}
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT'){return;}
  try{
    if(event.data.username){USERNAME=String(event.data.username).slice(0,40);}
    var g=document.getElementById('greet');
    if(!g&&USERNAME&&S&&S.tState==='ENDED'&&document.getElementById('intro')){
      g=el('div','greet','Signed in as: '+esc(USERNAME));
      g.id='greet';g.style.maxWidth='1000px';g.style.margin='10px auto 0';
      app.insertBefore(g,app.firstChild);
    }
    if(g&&USERNAME){g.textContent='Signed in as: '+USERNAME;}
  }catch(e){}
});

/* ================= boot ================= */
S=freshState();
screenIntro();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
