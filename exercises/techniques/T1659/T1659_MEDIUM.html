<script>
/* CyberPulseAcademy exercise engine — MITRE ATT&CK T1659 Content Injection
   Shared vanilla-JS engine for all four difficulty files. No external requests. */
window.ExamEngine=(function(){
'use strict';
/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function words(s){return String(s||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(function(x){return x;}).length;}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
/* ---------------- syntax highlight ---------------- */
var KW=['DNS','HTTP','HTTPS','SMB','FTP','GET','POST','PUT','200','302','404','Content-Type','Content-Length','text/html','application/octet-stream','curl','wget','tcpdump','wscript','cscript','Safari','chrome','firefox','msedge','browser','Exec','exec','payload','update','pcap','AN0992','AN0993','AN0994','DET0349','T1659','T1557','T1189','T1105','M1041','M1021','TA0001','TA0011','Windows','Linux','macOS','GET','vsftpd','wupdate','winupdate','Vary','Server','nginx','apache','IDs','TTL','time','date','GET','http'];
var HL_RE=null;
function buildHL(){
  var seen={},ks=[];
  KW.forEach(function(k){if(!seen[k]){seen[k]=1;ks.push(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));}});
  HL_RE=new RegExp('(&quot;[^&]*&quot;|\'[^\']*\')|(\\b\\d[\\d.]*\\b)|(\\b(?:'+ks.join('|')+')\\b)','g');
}
function hl(line){
  var s=esc(line);
  return s.replace(HL_RE,function(m,str,num,kw){
    if(str)return '<span class="hl-s">'+str+'</span>';
    if(num)return '<span class="hl-n">'+num+'</span>';
    return '<span class="hl-k">'+kw+'</span>';
  });
}
/* ---------------- scoring (partial credit contract) ---------------- */
function scoreExercise(sel,correct){
  var N=correct.length,H=0,W=0,i;
  for(i=0;i<sel.length;i++){if(correct.indexOf(sel[i])>=0)H++;else W++;}
  return Math.max(0,(H-W)/N);
}
/* ---------------- timer state machine ---------------- */
var TS={R:'RUNNING',PM:'PAUSED_MANUAL',PA:'PAUSED_AUTO_CHECK',EN:'ENDED'};
var E={d:null,phase:'intro',inst:[],idx:0,skipped:[],hint:{},report:false,username:'',prev:null,deadLeft:null,timeoutHit:false};
function tState(){return E.timer.state;}
function setTS(st){
  E.timer.state=st;
  var c=$('#hTimer');if(!c)return;
  c.classList.remove('st-run','st-pm','st-pa','st-en');
  var txt='',icon='';
  if(st===TS.R){c.classList.add('st-run');icon='&#9654;';txt='RUNNING';}
  else if(st===TS.PM){c.classList.add('st-pm');icon='&#9208;';txt='PAUSED &mdash; manual (press Resume)';}
  else if(st===TS.PA){c.classList.add('st-pa');icon='&#9208;';txt='PAUSED &mdash; reviewing feedback (resumes on Next)';}
  else{c.classList.add('st-en');icon='&#9635;';txt='ENDED';}
  c.innerHTML='<span class="tdot">'+icon+'</span>&nbsp;'+fmt(E.timer.remaining)+' &middot; '+txt;
}
function tick(){
  if(!E||!E.timer)return;
  if(tState()!==TS.R)return;
  if(E.phase!=='exam'&&E.phase!=='review')return;
  E.timer.remaining--;
  var inst=E.inst[E.idx];
  if(E.phase==='exam'&&E.deadLeft!=null&&inst&&inst.deadline&&!inst.checked){
    E.deadLeft--;

  }
  if(E.timer.remaining<=0){E.timer.remaining=0;setTS(TS.EN);timeUp();return;}
  setTS(tState());
}
function timeUp(){
  E.timeoutHit=true;
  if(E.phase==='exam'||E.phase==='review'){renderResults(true);}
}
/* ---------------- header ---------------- */
function buildHeader(){
  var h=$('#hdr');
  h.innerHTML='<div class="hdr-in">'+
    '<div class="hdr-brand">'+esc(E.d.brand)+'</div>'+
    '<div class="hdr-chip" id="hCounter">Intro</div>'+

/* ---------------- exam flow ---------------- */
function startExam(){
  buildInstances();
  E.report=false;
  E.phase='exam';E.idx=0;E.deadLeft=null;
  setTS(TS.R);
  renderExercise();
}
function buildInstances(){
  E.inst=[];E.skipped=[];E.hint={};E.deadLeft=null;E.timeoutHit=false;
  var order=shuffle(E.d.exercises);
  order.forEach(function(ex){
    var inst={ex:ex,type:ex.type,raw:null,checked:false,credit:0,fromReview:false,deadline:ex.deadlineSec||null,checkedWithHint:false};
    prepare(inst);
    E.inst.push(inst);
  });
}
function prepare(inst){
  var ex=inst.ex;
  if(ex.type==='choice'||ex.type==='multi'){
    inst.opts=shuffle(ex.options.map(function(o){return {id:o.id,text:o.text};}));
  }else if(ex.type==='order'){
    inst.disp=shuffle(ex.items.map(function(i){return i.id;}));
  }else if(ex.type==='match'){
    inst.lefts=shuffle(ex.pairs.map(function(p,i){return {id:'L'+i,text:p.l};}));
    inst.rights=shuffle(ex.pairs.map(function(p,i){return {id:'R'+i,text:p.r};}));
    inst.pairMap={};inst.selL=null;
  }else if(ex.type==='drag'){
    inst.bank=shuffle(ex.bank.map(function(b,i){return {id:'B'+i,text:b.text,ok:b.ok,slot:b.slot};}));
    inst.place={};inst.selChip=null;
  }else if(ex.type==='fill'){
    inst.bankOpts=shuffle(ex.bank.slice());
  }else if(ex.type==='branch'){
    inst.stepRaws=[];
    inst.stepOpts=ex.steps.map(function(s){return shuffle(s.options.map(function(o){return {id:o.id,text:o.text};}));});
    inst.cur=0;
  }
}
function curInst(){return E.inst[E.idx];}

function bindLogViewer(root,lg){

/* choice + multi */
function wChoice(inst,box,multi){
  var ex=inst.ex;inst.raw=multi?[]:null;

/* ordering */
function wOrder(inst,box){
  var ex=inst.ex,list=el('ul','ordlist');
  function rowFor(id,idx){
    var item=null;ex.items.forEach(function(it){if(it.id===id)item=it;});
    var li=el('li','ordrow');
    li.innerHTML='<span class="oh" data-h aria-label="Drag handle">&#8801;</span><span class="ordnum">'+(idx+1)+'.</span><span class="ox">'+esc(item.text)+'</span>';
    var up=el('button','oup','&uarr;');up.type='button';up.setAttribute('aria-label','Move up');
    var dn=el('button','odn','&darr;');dn.type='button';dn.setAttribute('aria-label','Move down');
    up.addEventListener('click',function(){if(inst.checked)return;move(id,-1);});
    dn.addEventListener('click',function(){if(inst.checked)return;move(id,1);});
    li.appendChild(up);li.appendChild(dn);
    li.dataset.id=id;
    dragRow(li,function(){draw();});
    return li;
  }
  function move(id,dir){
    var i=inst.disp.indexOf(id),j=i+dir;
    if(j<0||j>=inst.disp.length)return;
    inst.disp.splice(j,0,inst.disp.splice(i,1)[0]);draw();
  }
  function draw(){
    list.innerHTML='';
    list.__owner=inst;
    inst.disp.forEach(function(id,i){list.appendChild(rowFor(id,i));});
  }
  draw();
  box.appendChild(el('p','small muted','Put the steps in the right order. Use the arrows or drag the handle.'));
  box.appendChild(list);
}
function dragRow(li,after){
  var handle=$('[data-h]',li);
  handle.addEventListener('pointerdown',function(ev){
    var cardEl=li.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    ev.preventDefault();
    var list=li.parentNode,rows=Array.prototype.slice.call(list.children);
    var startY=ev.clientY,rect=li.getBoundingClientRect(),offY=startY-rect.top;
    li.classList.add('dragging');
    var ghost=li.cloneNode(true);ghost.className='ghost';ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    function pos(y){
      ghost.style.left=rect.left+'px';ghost.style.top=(y-offY)+'px';
      var target=null;
      rows.forEach(function(r){
        if(r===li)return;
        var rr=r.getBoundingClientRect();
        if(y>rr.top-8&&y<rr.bottom+8)target=r;
      });
      if(target){
        var ti=rows.indexOf(target),ci=rows.indexOf(li);
        if(ti>ci)list.insertBefore(li,target.nextSibling);else list.insertBefore(li,target);
        rows=Array.prototype.slice.call(list.children);
      }
    }
    function mv(e){pos(e.clientY);}
    function up(){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();li.classList.remove('dragging');
      var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});
      var owner=list.__owner||li.closest('.excard').__inst;
      if(owner)owner.disp=ids;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* matching */
function wMatch(inst,box){
  var ex=inst.ex,wrap=el('div','match-wrap');

    b.innerHTML='<span>'+esc(l.text)+'</span><span class="pairout"></span>';

    });
    $all('.mchip',rc).forEach(function(b){
      var used=false;for(var k in inst.pairMap){if(inst.pairMap[k]===b.dataset.id)used=true;}
      b.classList.toggle('paired',used);
    });
  }
  refresh();
  wrap.appendChild(lc);wrap.appendChild(rc);
  box.appendChild(el('p','small muted','Click one item on the left, then its partner on the right. Click again to change.'));
  box.appendChild(wrap);

/* drag & drop */
function wDrag(inst,box){
  var ex=inst.ex;
  var bank=el('div','bank');bank.dataset.bank='1';
  var slotCount=ex.slots.length;
  var slots=el('div','slots '+(slotCount>=3?'cols-3':'cols-2'));
  ex.slots.forEach(function(s,i){
    var d=el('div','slot');d.dataset.slot=String(i);
    d.innerHTML='<div class="slot-h">'+esc(s.label)+'</div>';
    slots.appendChild(d);
  });
  function chipEl(item){
    var c=el('button','chip');c.type='button';c.dataset.id=item.id;c.textContent=item.text;
    c.addEventListener('click',function(){
      if(inst.checked)return;
      if(c.parentElement&&c.parentElement.classList.contains('slot'))return; /* slot click handler returns it */
      if(inst.selChip===item.id){inst.selChip=null;c.classList.remove('sel');}
      else{inst.selChip=item.id;$all('.chip',box).forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');}
    });
    dragChip(c,bank,slots,function(){draw();});
    return c;
  }
  function placeItem(itemId,slotIdx){
    for(var k in inst.place){if(inst.place[k]===itemId)delete inst.place[k];}
    inst.place[slotIdx]=itemId;
    inst.selChip=null;
    $all('.chip',box).forEach(function(x){x.classList.remove('sel');});
    draw();
  }
  function findSlotOf(itemId){for(var k in inst.place){if(inst.place[k]===itemId)return k;}return null;}
  function draw(){
    bank.innerHTML='';
    inst.bank.forEach(function(item){
      if(findSlotOf(item.id)!=null)return;
      bank.appendChild(chipEl(item));
    });
    $all('.slot',slots).forEach(function(sd){
      var i=sd.dataset.slot,id=inst.place[i];
      $all('.chip',sd).forEach(function(x){x.remove();});
      if(id){
        var item=null;inst.bank.forEach(function(b){if(b.id===id)item=b;});
        sd.appendChild(chipEl(item));
      }
    });
  }
  slots.addEventListener('click',function(ev){
    if(inst.checked)return;
    var chipBtn=ev.target.closest('.chip');
    var sd=ev.target.closest('.slot');if(!sd)return;
    if(chipBtn&&!inst.selChip){
      for(var k in inst.place){if(inst.place[k]===chipBtn.dataset.id)delete inst.place[k];}
      draw();return;
    }
    if(inst.selChip)placeItem(inst.selChip,sd.dataset.slot);
  });
  bank.addEventListener('click',function(ev){
    if(inst.checked)return;
    if(ev.target===bank&&inst.selChip){
      var sid=findSlotOf(inst.selChip);
      if(sid!=null){delete inst.place[sid];inst.selChip=null;draw();}
    }
  });
  draw();
  box.appendChild(el('p','small muted','Drag each item into a slot, or click the item then the slot. Tap a placed item to send it back.'));
  box.appendChild(bank);box.appendChild(slots);
  inst.__draw=draw;
}
function dragChip(chip,bank,slots,after){
  chip.addEventListener('pointerdown',function(ev){
    var cardEl=chip.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    var inst=cardEl?cardEl.__inst:null;
    ev.preventDefault();
    var rect=chip.getBoundingClientRect(),offX=ev.clientX-rect.left,offY=ev.clientY-rect.top;
    var ghost=chip.cloneNode(true);ghost.className='chip ghost';
    ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    var curSlot=null;
    function mv(e){
      ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(curSlot&&curSlot!==sl)curSlot.classList.remove('over');
      curSlot=sl;if(sl)sl.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();
      if(curSlot)curSlot.classList.remove('over');
      if(!inst||inst.checked){after();return;}
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(sl){
        var i=sl.dataset.slot;
        for(var k in inst.place){if(inst.place[k]===chip.dataset.id)delete inst.place[k];}
        if(inst.place[i]&&inst.place[i]!==chip.dataset.id){delete inst.place[i];}
        inst.place[i]=chip.dataset.id;
      }else{
        var inSlot=chip.parentElement&&chip.parentElement.classList.contains('slot');
        if(inSlot){
          var si=chip.parentElement.dataset.slot;
          if(inst.place[si]===chip.dataset.id)delete inst.place[si];
        }
      }
      inst.selChip=null;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* fill in the blanks */
function wFill(inst,box){

/* terminal */
function wTerminal(inst,box){
  var ex=inst.ex,sh=ex.shell;
  if(sh.support)box.appendChild(el('div','hintbox',sh.support));
  var term=el('div','term');
  term.innerHTML='<div class="term-out" data-out>'+esc(sh.banner||'')+'</div>'+

    (sh.note?'<div class="term-note">'+sh.note+'</div>':'');
  box.appendChild(term);
  var out=$('[data-out]',term),inp=$('[data-cmd]',term);
  inst.lastCmd=null;inst.ran=false;
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){
      var cmd=inp.value;inp.value='';
      runCmd(inst,out,cmd);
    }
  });
  if(sh.deadlineNote)box.appendChild(el('p','small muted',sh.deadlineNote));

function runCmd(inst,out,cmd){
  var sh=inst.ex.shell;
  out.textContent+='\n'+sh.prompt+cmd+'\n';
  var n=norm(cmd);
  if(!n){out.scrollTop=out.scrollHeight;return;}
  inst.lastCmd=n;inst.ran=true;
  var dangerous=null;
  (sh.forbidden||[]).forEach(function(f){if(f.re.test(n))dangerous=f;});
  var ok=sh.expectRe?sh.expectRe.test(n):true;
  if(dangerous){out.textContent+='\n'+dangerous.out+'\n';}
  else if(ok){out.textContent+='\n'+(sh.out||'(no output)')+'\n';}
  else{
    var tok=n.split(' ')[0];
    out.textContent+='\n'+(sh.errOut||('bash: '+tok+': command not found'))+'\n';
  }
  out.scrollTop=out.scrollHeight;
}

/* Engine part B — grading, feedback, flow, results, integration */
'use strict';
/* ---------------- grading ---------------- */
function grade(inst){
  var ex=inst.ex,res={items:[],detail:'',cls:'bad',label:'INCORRECT',credit0:0};
  if(inst.type==='choice'){
    var correct=[ex.correct];
    res.credit0=scoreExercise(inst.raw?[inst.raw]:[],correct);
    inst.opts.forEach(function(o){
      if(o.id===ex.correct)res.items.push({st:'ok',t:esc(o.text)+' — correct answer'});
      else if(inst.raw===o.id)res.items.push({st:'bad',t:esc(o.text)+' — your choice'});
    });
  }else if(inst.type==='multi'){
    var sel=inst.raw||[];
    res.credit0=scoreExercise(sel,ex.correct);
    inst.opts.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>=0,isS=sel.indexOf(o.id)>=0;
      if(isC&&isS)res.items.push({st:'ok',t:esc(o.text)});
      else if(isC)res.items.push({st:'miss',t:esc(o.text)});
      else if(isS)res.items.push({st:'bad',t:esc(o.text)});
    });
  }else if(inst.type==='order'){
    var arr=inst.disp||[],N=arr.length,H=0,W=0;
    arr.forEach(function(id,i){
      var item='';ex.items.forEach(function(it){if(it.id===id)item=it.text;});
      var good=ex.items[i].id===id;
      if(good){H++;res.items.push({st:'ok',t:'Position '+(i+1)+': '+esc(item)});}
      else{W++;res.items.push({st:'bad',t:'Position '+(i+1)+': '+esc(item)+' — should be: '+esc(ex.items[i].text)});}
    });
    res.credit0=Math.max(0,(H-W)/N);
  }else if(inst.type==='match'){
    var cnt=0,Wm=0,N=ex.pairs.length;
    inst.lefts.forEach(function(l){
      var oi=parseInt(l.id.slice(1),10);
      var chosen=inst.pairMap[l.id];
      if(chosen==='R'+oi){cnt++;res.items.push({st:'ok',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)});}
      else if(chosen){
        Wm++;
        var txt='';inst.rights.forEach(function(r){if(r.id===chosen)txt=r.text;});
        res.items.push({st:'bad',t:esc(ex.pairs[oi].l)+' → '+esc(txt)+' (wrong partner)'});
      }else res.items.push({st:'miss',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)+' (missed)'});
    });
    res.credit0=Math.max(0,(cnt-Wm)/N);
  }else if(inst.type==='drag'){
    var okN=0,Wn=0,N2=ex.slots.length;
    ex.slots.forEach(function(s,i){
      var id=inst.place?inst.place[String(i)]:null;
      var item=null;
      if(id!=null)inst.bank.forEach(function(b){if(b.id===id)item=b;});
      if(item&&item.ok&&String(item.slot)===String(i)){okN++;res.items.push({st:'ok',t:esc(s.label)+': '+esc(item.text)});}
      else if(item){
        Wn++;
        var why=(item.ok&&item.slot!==undefined&&String(item.slot)!==String(i))?' — right idea, wrong slot':' — wrong item here';
        res.items.push({st:'bad',t:esc(s.label)+': '+esc(item.text)+why});
      }
      else{
        var right='';ex.bank.forEach(function(b){if(b.ok&&b.slot===i)right=b.text;});
        res.items.push({st:'miss',t:esc(s.label)+': '+esc(right)+' (missed)'});
      }
    });
    res.credit0=Math.max(0,(okN-Wn)/N2);
  }else if(inst.type==='fill'){
    var vals=inst.raw||[],H2=0,W2=0,N3=ex.answers.length;
    ex.answers.forEach(function(a,i){
      var v=vals[i]||'';
      if(norm(v)===norm(a)){H2++;res.items.push({st:'ok',t:'Blank '+(i+1)+': '+esc(a)});}
      else if(v){W2++;res.items.push({st:'bad',t:'Blank '+(i+1)+': you chose "'+esc(v)+'" — answer is "'+esc(a)+'"'});}
      else res.items.push({st:'miss',t:'Blank '+(i+1)+': '+esc(a)+' (left empty)'});
    });
    res.credit0=Math.max(0,(H2-W2)/N3);
  }else if(inst.type==='terminal'){
    gradeTerminal(inst,res);
  }else if(inst.type==='branch'){
    var N4=ex.steps.length,H3=0,W3=0;
    ex.steps.forEach(function(s,i){
      var got=inst.stepRaws[i];
      if(got===s.correct){H3++;res.items.push({st:'ok',t:'Step '+(i+1)+': '+esc(s.short||'correct')});}
      else{
        if(got)W3++;
        var badTxt='';
        if(got){s.options.forEach(function(o){if(o.id===got)badTxt=o.text;});}
        res.items.push({st:'bad',t:'Step '+(i+1)+': you chose "'+esc(badTxt||'(no answer)')+'" — better: '+esc(s.short||s.correct)});
      }
    });
    res.credit0=Math.max(0,(H3-W3)/N4);
  }
  var used=E.hint[inst.ex.id];
  var credit=Math.max(0,res.credit0-(used?0.10:0));
  inst.credit=credit;
  if(credit>=0.999){res.cls='ok';res.label='CORRECT';}
  else if(credit>0){res.cls='part';res.label='PARTIALLY CORRECT';}
  else{res.cls='bad';res.label='INCORRECT';}
  res.credit=credit;res.hintUsed=used;
  return res;
}
function gradeTerminal(inst,res){
  var sh=inst.ex.shell,els=sh.elements||[];
  var n=inst.lastCmd||'';
  var H=0,W=0;
  els.forEach(function(e){
    if(n&&e.re.test(n)){H++;res.items.push({st:'ok',t:'Element: '+esc(e.label)});}
    else res.items.push({st:'miss',t:'Element: '+esc(e.label)+(n?' (missing)':' (no command run)')});
  });
  var dang=null;
  (sh.forbidden||[]).forEach(function(f){if(n&&f.re.test(n)){W++;dang=f;}});
  if(dang)res.items.push({st:'bad',t:'⚠ '+esc(dang.label)});
  res.credit0=Math.max(0,(H-W)/els.length);
  if(dang)res.detail+='<div class="study">⚠ <b>Close but dangerous:</b> '+dang.warn+'</div>';
  res.detail+='<div class="art canon"><div class="art-l">Canonical command</div>'+
    '<pre class="code" data-canon>'+esc(sh.canon)+'</pre>'+
    '<div class="blk-b"><button type="button" class="btn light copybtn" data-copy>Copy command</button></div></div>'+
    (sh.canonExpl?('<div class="fb-ex">'+sh.canonExpl+'</div>'):'');
}
/* ---------------- check / next / pause / hint / skip ---------------- */
function onCheck(inst,ablk,fbEl,btn){
  var ex=inst.ex;
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(inst.type==='order'){
    var list=$('.ordlist',ablk);
    if(list){var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});inst.disp=ids;}
  }
  if(inst.type==='drag'&&inst.__draw)inst.__draw();
  /* FIRST action: auto-pause before rendering feedback */
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  disableWidget(ablk);
  renderFeedback(inst,res,fbEl);
  updateHeader();
  /* swap button to Next / Final Submit */
  var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
  btn.textContent=last?'Final Submit':'Next &#9654;';
  btn.innerHTML=last?'Final Submit':'Next &#9654;';
  btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  var noteEl=$('.acts .note',ablk);
  if(noteEl)noteEl.textContent=(tState()===TS.PA)?'Timer paused while you study this feedback. Press Next to continue — the timer restarts then.':'';
  syncHeaderButtons();
}
function autoCheck(){
  var inst=curInst();
  if(!inst||inst.checked)return;
  var ablk=ablkOf(inst),fbEl=fbElOf(inst),btn=$('#bCheck');
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  if(ablk)disableWidget(ablk);
  if(fbEl)renderFeedback(inst,res,fbEl);
  updateHeader();
  if(btn){
    var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
    btn.innerHTML=last?'Final Submit':'Next &#9654;';
    btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  }
}
function disableWidget(ablk){
  $all('button, input, select',ablk).forEach(function(x){
    if(x.id==='bCheck')return;
    x.disabled=true;
    x.classList.add('disabled-ui');
  });
}
function markOptions(inst,ablk){
  var ex=inst.ex;
  if(inst.type==='choice'||inst.type==='multi'){
    var opts=$all('.opt',ablk);
    var ids=[];
    inst.opts.forEach(function(o,i){
      var elx=opts[i];
      if(ex.type==='choice'){
        if(o.id===ex.correct)elx.classList.add('state-ok');
        else if(inst.raw===o.id)elx.classList.add('state-bad');
      }else{
        var isC=ex.correct.indexOf(o.id)>=0,isS=(inst.raw||[]).indexOf(o.id)>=0;
        if(isC&&isS)elx.classList.add('state-ok');
        else if(isC)elx.classList.add('state-miss');
        else if(isS)elx.classList.add('state-bad');
      }
    });
  }
}
function renderFeedback(inst,res,fbEl){
  markOptions(inst,$('.excard .b-answer',$('#stage')));
  var creditTxt='';
  var nItems=0;
  if(inst.type==='multi'||inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill'||inst.type==='terminal'||inst.type==='branch'){
    var N=0;
    if(inst.type==='multi')N=inst.ex.correct.length;
    else if(inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill')N=res.items.length;
    else if(inst.type==='terminal')N=inst.ex.shell.elements.length;
    else if(inst.type==='branch')N=inst.ex.steps.length;
    var itemsRight=0,itemsWrong=0;
    res.items.forEach(function(it){if(it.st==='ok')itemsRight++;else if(it.st==='bad')itemsWrong++;});
    creditTxt='<span class="credit-chip">credit '+res.credit.toFixed(2)+(N?' — '+itemsRight+' correct'+(itemsWrong?', '+itemsWrong+' wrong':'')+' of '+N+' items':'')+'</span>';
  }
  var icon=res.cls==='ok'?'&#10003;':(res.cls==='part'?'&#10003;':'&#10007;');
  var html='<div class="fb-h"><span class="fi" style="font-size:18px">'+icon+'</span><span>'+res.label+'</span>'+creditTxt+
    (res.hintUsed?'<span class="credit-chip">hint used: &minus;10% applied</span>':'')+'</div>';
  html+='<div class="fb-b">';
  if(res.items.length)html+='<ul class="fb-items">'+res.items.map(function(it){
    var ic=it.st==='ok'?'<span class="fi ok">&#10003;</span>':(it.st==='bad'?'<span class="fi bad">&#10007;</span>':'<span class="fi miss">&#9675;</span>');
    var w=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
    return '<li>'+ic+'<span><b>'+w+'</b> — '+it.t+'</span></li>';
  }).join('')+'</ul>';
  html+='<div class="fb-ex">'+inst.ex.explain+'</div>';
  if(res.detail)html+=res.detail;
  html+='</div>';
  fbEl.innerHTML='';
  fbEl.appendChild(el('div','fb '+res.cls,html));
  var cb=$('[data-copy]',fbEl);
  if(cb)cb.addEventListener('click',function(){
    var txt=$('[data-canon]',fbEl).textContent;
    try{navigator.clipboard.writeText(txt);}catch(e){}
    cb.textContent='Copied';
  });
  fbEl.scrollIntoView({behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth',block:'nearest'});
}
function onNext(inst,ablk,fbEl,btn){
  if(tState()===TS.PA){
    if(E.timer.remaining>0)setTS(TS.R);else setTS(TS.EN);
  }
  var fromReview=inst.fromReview;
  if(fromReview){
    inst.fromReview=false;
    renderReview();
    return;
  }
  if(E.idx<E.inst.length-1){
    E.idx++;renderExercise();
  }else{
    var pending=E.skipped.filter(function(i){return !E.inst[i].checked;});
    if(pending.length>0)renderReview();

/* ---------------- results ---------------- */
function renderResults(timeout){
  E.phase='results';
  if(tState()!==TS.EN)setTS(TS.EN);
  updateHeader();
  var st=$('#stage');
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skipped=0,i;
  for(i=0;i<E.inst.length;i++){
    var inst=E.inst[i];
    if(inst.checked){answered++;sum+=inst.credit;
      if(inst.credit>=0.999)full++;
      else if(inst.credit>0){part++;partSum+=inst.credit;}
      else zero++;
    }else skipped++;
  }
  var pct=answered>0?Math.round((sum/answered)*100):0;
  var passed=pct>=70;
  var d=E.d;
  var sealSvg='<svg class="c-seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d3f" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="#2a2413" stroke="#b08d3f" stroke-width="2"/><path d="M32 52 L45 65 L70 38" fill="none" stroke="#e0b95c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var panel=passed?
    ('<div class="cert">'+sealSvg+'<h2>Certificate of completion</h2>'+
     '<p class="muted">This certifies that <b>'+esc(E.username||'the learner')+'</b> passed the</p>'+

    '<div class="stat"><div class="sv" style="color:#ff9c9c">'+zero+'</div><div class="sl">&#10007; Fully incorrect</div></div>'+

window.EXAM_DATA={
brand:"MITRE ATT&CK · T1659 Content Injection",
meta:{topicId:"t1659",batch:2,title:"T1659 Content Injection — MEDIUM",difficulty:"medium",questionCount:16,estimatedMinutes:32,passMark:70},
severity:"MEDIUM",sevClass:"sev-medium",techniqueId:"T1659",techniqueName:"Content Injection",
timerSeconds:32*60,
intro:{
headline:"T1659 — Content Injection — MEDIUM practice exam",
entityTitle:"About MITRE ATT&CK T1659 — Content Injection",
entityHtml:"<p><b>The object.</b> T1659 is a <b>Technique</b> (no sub-techniques) in MITRE ATT&CK, the public catalogue of attacker behaviours. It is called <b>Content Injection</b>. It lives in two tactics at once: <b>Initial Access</b> (TA0001) and <b>Command and Control</b> (TA0011). Platforms: <b>Linux, Windows, macOS</b>.</p>"+
"<p><b>The behaviour.</b> Instead of luring victims to attacker-hosted pages (the drive-by pattern: Drive-by Target T1608.004 followed by Drive-by Compromise T1189), the attacker reaches into channels the victim already uses and injects content into the replies. Two positions are described: <b>from the middle</b> — in-between the legitimate online client-server communications, similar but distinct from Adversary-in-the-Middle (T1557), which ATT&CK limits to enterprise environments; and <b>from the side</b> — an injected fake reply that races the real response of the legitimate server. Injection often comes from compromised upstream channels, for example at the <b>ISP level</b>, as with abused 'lawful interception' systems. The channels named: <b>DNS, HTTP and SMB replies</b>. The same channel later carries more payloads — Ingress Tool Transfer (T1105) territory — which is why the tactic list includes Command and Control.</p>"+
"<p><b>Detection and mitigation.</b> Detection strategy <b>DET0349</b> has three analytics: <b>AN0992</b> (Windows: browser-triggered file creation in %AppData% or Temp, then process execution; correlate network anomalies), <b>AN0993</b> (Linux: curl/wget saving executables or scripts to /tmp or /var/tmp, then execution; packet captures and IDS/IPS alerts for injected responses or mismatched content types), <b>AN0994</b> (macOS: unified logs, processes spawned from Safari or other browsers, drops in ~/Library/Caches or ~/Downloads executing shortly after write). Mitigations: <b>M1041 Encrypt Sensitive Information</b> (trusted VPNs) and <b>M1021 Restrict Web-Based Content</b> (block uncommon file types).</p>"+
"<p><b>Real cases.</b> The page lists the group <b>MoustachedBouncer</b> (G1019) — espionage against foreign diplomats in Belarus, ISP-level injection, fake Windows Update page — and its software <b>Disco</b> (S1088), delivered through injected DNS, HTTP and SMB replies that redirect targeted hosts to malicious downloads.</p>",
workHtml:"<ul>"+
"<li><b>SOC analysts</b> work the alerts these analytics fire: browser writes then executes, mismatched content types, duplicate responses. At MEDIUM level you combine two facts before you decide.</li>"+
"<li><b>Detection engineers</b> tune AN0992/0993/0994 and design the IDS/IPS content checks the Linux analytic calls for.</li>"+
"<li><b>CTI analysts</b> cite the right object types in reports: the technique (T1659), the group (G1019), the software (S1088), the tactic (TA0001/TA0011).</li>"+
"<li><b>Incident responders</b> preserve PCAP and payloads; <b>network/security engineers</b> roll out M1041 and M1021 with their trade-offs.</li>"+
"<li><b>Red teamers</b> demonstrate the risk of unencrypted upstream paths in authorised exercises — the attacker perspective you will also practise here.</li></ul>",
extraNotes:["<b>Terminal exercise:</b> one exercise uses a fake Linux terminal. The tool is named and the goal is clear, but you pick the options yourself. Wrong flags are not forgiven."]
},
keywords:[
{theme:"Technique identity and framework position",items:["T1659 Content Injection","Technique — no sub-techniques","Initial Access (TA0001)","Command and Control (TA0011)","Platforms: Linux, Windows, macOS"]},
{theme:"Injection modes and adversary behaviour",items:["From the middle","From the side (man-on-the-side)","Fake reply races the real one","Compromised data-transfer channels","Upstream compromise (ISP level)","Lawful interception abuse","vs Drive-by Target (T1608.004) / Drive-by Compromise (T1189)","similar but distinct vs Adversary-in-the-Middle (T1557)"]},
{theme:"Protocols and delivery vectors",items:["DNS replies","HTTP replies","SMB replies","Redirect to malicious download","Fake Windows Update page","Ingress Tool Transfer (T1105)"]},
{theme:"Telemetry and data sources",items:["Browser-triggered file creation","Process execution after write","%AppData% and Temp","/tmp and /var/tmp","curl and wget","PCAP","IDS/IPS alerts","Mismatched content types","macOS unified logs","Safari child processes","~/Library/Caches","~/Downloads"]},
{theme:"Detection strategy and analytics",items:["DET0349","AN0992 (Windows)","AN0993 (Linux)","AN0994 (macOS)","Network-to-host correlation","False-positive tuning"]},
{theme:"Mitigations and controls",items:["M1041 Encrypt Sensitive Information (trusted VPNs)","M1021 Restrict Web-Based Content (uncommon file types)","Control trade-offs"]},

window.EXAM_DATA.exercises=[
{id:"m01",type:"choice",title:"Proxy alert triage",summary:"One GET, two responses — name the technique.",
scenario:{summary:"One GET request received two responses.",
intro:"<p>You triage a web-proxy alert. One GET request to a news site the user visits daily received <b>two responses</b>.</p>",
artefacts:[{label:"ARTEFACT 1 — Proxy log (excerpt)",code:"14:02:11  GET hxxp://news[.]example/sport   client 10[.]1[.]4[.]12\n  -> response 1: 200 OK  content-type: text/html   bytes 18204  rtt 0.24s\n  -> response 2: 200 OK  content-type: application/octet-stream  bytes 942\n                 rtt 0.59s  (unsolicited — no second request was sent)\n  body(response 2) begins with: MZ ... [PE binary]",light:false}]},
question:"What is happening, and which technique matches best?",
options:[{id:"A",text:"Content injection (T1659) — an unsolicited reply carried a payload"},{id:"B",text:"Drive-by compromise (T1189) — the user opened a malicious website"},{id:"C",text:"Valid accounts (T1078) — an outsider reused a staff login"},{id:"D",text:"Data from local system (T1005) — files were collected from the host"}],
correct:"A",
hint:"Response 2 was never requested and its content type does not match a news page.",
explain:"<p>Two answers to one request — the second <b>unsolicited</b> and carrying a binary — is injected content on the path. The user never visited attacker infrastructure, so it is not drive-by compromise; no login was involved; nothing was collected. This matches <b>T1659 Content Injection</b>, most likely from the side: the injected reply raced in after the real one.</p>"},
{id:"m02",type:"fill",title:"Disco facts",summary:"Complete the procedure example.",
scenario:{summary:"Read the procedure example for Disco (S1088).",
intro:"<p>Read the ATT&CK procedure example for the software <b>Disco</b>:</p>",
artefacts:[{label:"ARTEFACT 1 — ATT&CK procedure example",code:"S1088  Disco\n\nDisco has achieved initial access and execution\nthrough content injection into DNS, HTTP, and SMB\nreplies to targeted hosts that redirect them to\ndownload malicious files.",light:true}]},
question:"Complete the two blanks from the procedure example.",
text:"Per the example, Disco achieved initial access and execution through content injection into DNS, HTTP and ___ replies, redirecting targeted hosts to download ___ files.",
answers:["SMB","malicious"],
bank:["SMB","malicious","FTP","harmless","RDP","encrypted"],
hint:"One blank is the third reply type on the page; the other describes the files the redirect delivers.",
explain:"<p>The example says Disco injected into <b>DNS, HTTP and SMB</b> replies and redirected targeted hosts to download <b>malicious</b> files. Two readings to avoid: the page never limits Disco to Windows Server, and Disco is software (ID prefix S), not a mitigation. When you cite procedure examples, quote exactly what the source claims.</p>"},
{id:"m03",type:"branch",title:"Windows triage",summary:"Browser drops a VBS, wscript runs it — three decisions.",
scenario:{summary:"Windows laptop: browser writes payload, wscript executes it.",
intro:"<p>Your SOC, ticket <b>#4417</b>. EDR on a Windows 11 laptop: <code>chrome.exe</code> wrote <code>update_loader.vbs</code> into <code>%AppData%</code>; four seconds later <code>wscript.exe</code> ran it. Your IDS had flagged 'HTTP response with mismatched content type' six seconds before, on the same flow.</p>",
artefacts:[{label:"ARTEFACT 1 — EDR alert",code:"parent : chrome.exe (browser)\nwrite  : C:\\Users\\mrossi\\AppData\\Roaming\\update_loader.vbs\nexec   : wscript.exe C:\\Users\\mrossi\\AppData\\Roaming\\update_loader.vbs   (+4s)\nnote   : script deleted itself 60s later",light:true},
{label:"ARTEFACT 2 — IDS alert",code:"IDS alert\nmsg : HTTP response content-type mismatch\nflow: client 10[.]1[.]4[.]12 -> 203[.]0[.]113[.]77:80\ninfo: response 2 of 2 on this GET; text/html expected, binary seen",light:false}]},
hint:"Analytic 92 is the Windows one. And ask: did anyone actually request that second response?",
steps:[
{q:"Does this case match detection analytic AN0992?",short:"Yes — AN0992 (Windows browser write-then-run)",
 options:[{id:"A",text:"Yes — browser file creation then execution, plus a network anomaly"},{id:"B",text:"No — it matches AN0993, the Linux analytic"},{id:"C",text:"No — it matches AN0994, the macOS analytic"},{id:"D",text:"No — no analytic covers browser downloads"}],correct:"A"},
{q:"Which extra evidence best confirms real content injection instead of a normal download?",short:"The unsolicited second response on the same GET",
 options:[{id:"A",text:"The IDS flow showing a second, unsolicited response on the same GET"},{id:"B",text:"The laptop's wallpaper version number"},{id:"C",text:"A screenshot of the browser window"},{id:"D",text:"Nothing else — EDR alerts are always correct on their own"}],correct:"A"},
{q:"What is the best first action?",short:"Isolate the laptop and block the delivering IP",
 options:[{id:"A",text:"Isolate the laptop and block the delivering IP at the web filter"},{id:"B",text:"Reimage the entire laptop fleet tonight"},{id:"C",text:"Ignore it — VBS files are always harmless"},{id:"D",text:"Email all staff a copy of the malicious file as a warning"}],correct:"A"}],
explain:"<p><b>Step 1 — Yes.</b> AN0992 is the Windows analytic: browser-triggered file creation in %AppData%, then process execution, correlated with a network anomaly. AN0993 is Linux, AN0994 is macOS.</p><p><b>Step 2.</b> The confirming evidence is the <b>unsolicited second response</b> on the same GET — a normal download has exactly one requested response. Wallpaper and screenshots prove nothing, and EDR alerts still need correlation.</p><p><b>Step 3.</b> Isolate the one host and block the delivery IP: proportionate and reversible. Reimaging the fleet is disproportionate, VBS files are a common malware loader, and redistributing the sample would spread it.</p><p><b>Attacker view:</b> the four-second write-then-run gap is the whole point — code execution without a user prompt. <b>Defender view:</b> the same gap plus the network anomaly is your detection anchor.</p>"},
{id:"m04",type:"drag",title:"Two tactics, four behaviours",summary:"Place each behaviour in its tactic.",
scenario:{summary:"Which tactic does each behaviour belong to?",
intro:"<p>T1659 serves two phases of an attack. Place each behaviour in the right slot — one behaviour per slot. One card is a decoy that belongs to neither.</p>"},
question:"Drag each behaviour to the correct slot.",
slots:[{label:"Initial Access — behaviour 1"},{label:"Initial Access — behaviour 2"},{label:"Command and Control — behaviour 1"},{label:"Command and Control — behaviour 2"}],
bank:[{text:"Injected DNS reply gives the first foothold",ok:true,slot:0},{text:"Victim downloads the fake update payload",ok:true,slot:1},{text:"Injected channel delivers a second tool (Ingress Tool Transfer)",ok:true,slot:2},{text:"Injected channel keeps talking to the compromised host",ok:true,slot:3},{text:"Attacker encrypts files and demands ransom",ok:false}],
hint:"First foothold and the download belong to Initial Access. Delivering tools later and keeping the channel belong to Command and Control.",
explain:"<p><b>Initial Access:</b> the injected reply that gives the first foothold, and the payload download it causes. <b>Command and Control:</b> the same channel used to deliver more tools — that pairs with T1105 Ingress Tool Transfer — and to keep talking to the victim. Ransomware encryption is an Impact-tactic behaviour, not part of T1659.</p>"},
{id:"m05",type:"terminal",title:"Find dropped files",summary:"Fake terminal: files in /tmp modified in the last 24h.",
scenario:{summary:"List files dropped into /tmp in the last day.",
intro:"<p>Linux build server <code>build-03</code>. Analytic AN0993 watches <b>/tmp</b> and <b>/var/tmp</b> for saved payloads. The team asks: which <b>files</b> (not folders) appeared in /tmp in the <b>last 24 hours</b>?</p>"},
question:"Use find to list files in /tmp modified in the last 24 hours (1440 minutes).",
shell:{
banner:"CentOS Stream 9 — build-03 (audit shell)\nGoal: files in /tmp, modified within the last 1440 minutes.\nThe tool is find — the options are yours to choose.",
prompt:"[svc-audit@build-03 ~]$ ",
support:"<b>You know the tool and the goal. Think:</b> which folder, files not folders, and a time filter counted in minutes. A minus sign means 'less than'.",
expectRe:/^find(?=[^;|]*\/tmp\b)(?=[^;|]*-type\s+f\b)(?=[^;|]*-mmin\s+-1440\b)/,
out:"/tmp/.cache-clean\n/tmp/sysdiag.sh\n/tmp/beat.log\n/tmp/winupdate.bin",
errOut:"find: invalid predicate or missing argument\n(usage line printed)",
elements:[{re:/(^|\s)find(\s|$)/,label:"the find tool"},{re:/(^|\s)\/tmp(\/|\s|$)/,label:"the /tmp folder"},{re:/(^|\s)-type\s+f(\s|$)/,label:"-type f (files, not folders)"},{re:/(^|\s)-mmin\s+-1440(\s|$)/,label:"-mmin -1440 (younger than 1440 minutes)"}],
forbidden:[{re:/(^|\s)-delete\b|(^|\s)rm\s|(^|\s)mv\s/,label:"a deleting flag or command",out:"\u26a0 The command ran and deleted evidence. The payloads AN0993 watches are gone.",warn:"-delete (or rm/mv) destroys exactly the payloads the analytic watches. Triage commands must be read-only."},
{re:/(^|\s)-mtime\s+-?\d/,label:"-mtime (days) used instead of minutes",out:"(the filter matched whole days, not the 24-hour window asked for)",warn:"-mtime counts in DAYS. The task asked for minutes: -mmin -1440. Close, but not the asked filter."}],
canon:"find /tmp -type f -mmin -1440",
canonExpl:"<ul><li><b>find /tmp</b> — search inside /tmp.</li><li><b>-type f</b> — only files, not folders.</li><li><b>-mmin -1440</b> — modified less than 1440 minutes ago; minus means 'younger than'. 1440 minutes = 24 hours.</li></ul>"},
hint:"find needs the folder, -type f for files, and -mmin with a minus for 'younger than'.",
explain:"<p>Canonical: <code>find /tmp -type f -mmin -1440</code>. Every element filters: the folder, files only, the 24-hour window in minutes. <b>Near-misses:</b> <code>-mtime -1</code> counts days and includes a different set than asked; <code>-delete</code> destroys the evidence. Note the output: a script and a binary in /tmp — exactly the write-then-run material AN0993 correlates.</p>"},
{id:"m06",type:"match",title:"Control trade-offs",summary:"Match each control to its trade-off or effect.",
scenario:{summary:"Every control has a cost.",
intro:"<p>Controls always have trade-offs. Match each control to the trade-off or effect that really belongs to it.</p>"},
question:"Match each control to its real trade-off or effect.",
pairs:[{l:"M1041 — trusted VPNs",r:"Your trust moves to the VPN provider — choose and vet it"},{l:"M1021 — block uncommon file types",r:"Can break legitimate software downloads that use those types"},{l:"Encrypting traffic (M1041)",r:"Stops third parties from reading or changing content on the wire"}],
hint:"Think: who do you trust afterwards, what might break, and what does encryption actually stop?",
explain:"<p><b>M1041</b> encrypts traffic: third parties on the path can no longer read or alter content — but you now trust the VPN provider instead. <b>M1021</b> blocks uncommon file types: effective against injected payloads, yet it can break real downloads using those types. Naming trade-offs out loud is what control owners do when they design mitigations.</p>"},
{id:"m07",type:"choice",title:"Race lost, payload still landed",summary:"Explain the race in the PCAP.",
scenario:{summary:"The real reply came first — the payload still landed.",
intro:"<p>Forensic PCAP. One HTTP GET received two responses: the <b>real</b> one first (200, text/html), then an <b>unsolicited</b> one 350 ms later (200, application/octet-stream, MZ header). The client accepted the second.</p>"},
question:"Why did the victim receive the payload even though the real reply came first?",
options:[{id:"A",text:"The client accepted the injected second response"},{id:"B",text:"The news web server sent the payload by mistake"},{id:"C",text:"DNS changed the site's IP address mid-session"},{id:"D",text:"The PCAP is corrupt — this pattern cannot happen"}],
correct:"A",
hint:"Look at who sent the second reply and whether the client asked for it.",
explain:"<p>This is the man-on-the-<b>side</b> pattern: the attacker holds no middle position, so they <b>race</b> the real reply with an injected fake. Even when the genuine answer arrives first, the unsolicited second reply still reaches the client and can be accepted. A legitimate server never sends two responses to one GET — the pattern itself is the tell.</p>"},
{id:"m08",type:"multi",title:"Telemetry scope",summary:"Which data sources do the analytics rely on?",
scenario:{summary:"Scoping telemetry for DET0349.",
intro:"<p>You scope telemetry for detection strategy DET0349 (Content Injection) across the three platforms.</p>"},
question:"Which data sources do the three analytics rely on?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"Browser-triggered file creation"},{id:"B",text:"Process execution after the file write"},{id:"C",text:"PCAP or IDS/IPS alerts for injected responses"},{id:"D",text:"macOS unified logs"},{id:"E",text:"Windows logon event 4624 history"},{id:"F",text:"Group Policy object edits"}],
correct:["A","B","C","D"],
hint:"Three analytics, three operating systems — plus the network side. Two options are generic directory noise.",
explain:"<p>AN0992 needs browser <b>file creation</b> plus <b>process execution</b>; AN0993 adds <b>PCAP / IDS-IPS</b> coverage for injected responses and mismatched content types; AN0994 needs <b>macOS unified logs</b>. Logon 4624 history and GPO edits are real telemetry — but they play no role in this detection strategy.</p>"},

{id:"m09",type:"order",title:"Attack chain",summary:"Order the five chain steps.",
scenario:{summary:"From upstream position to reusable channel.",
intro:"<p>These are the five steps of a content injection campaign, shuffled.</p>"},
question:"Order the five chain steps from first to last.",
items:[{id:"c1",text:"The attacker compromises an upstream channel on the victim's path"},{id:"c2",text:"An injected DNS/HTTP reply redirects the victim"},{id:"c3",text:"The victim downloads the fake update payload"},{id:"c4",text:"The payload is written to a temp folder and executes"},{id:"c5",text:"The attacker reuses the injected channel to deliver more tools"}],
hint:"Position first, then redirect, then download, then execute, then reuse the channel.",
explain:"<p>1) The attacker gains an upstream position. 2) An injected reply redirects the victim. 3) The payload download happens. 4) Write-then-execute on the host. 5) The channel becomes a delivery path for more tools — that is why T1659 also sits in Command and Control, and why step 5 pairs with T1105 Ingress Tool Transfer.</p><p><b>Attacker view:</b> one position, two gains — initial access and a standing channel. <b>Defender view:</b> break any link; encryption (M1041) on the path kills steps 2 to 5, and the analytics catch step 4 when encryption cannot be enforced.</p>"},
{id:"m10",type:"fill",title:"AN0993 wording",summary:"Fill the Linux analytic's logic.",
scenario:{summary:"Complete the analytic's logic.",
intro:"<p>Detection engineers write analytic logic from the ATT&CK description. Fill the three blanks exactly.</p>"},
question:"Fill the three blanks of the Linux analytic.",
text:"AN0993: detect ___ or ___ commands saving executable or script payloads to /tmp or /var/tmp, followed by ___.",
answers:["curl","wget","execution"],
bank:["curl","wget","execution","deletion","python"],
hint:"Two download tools are named in the analytic; then comes what happens right after the save.",
explain:"<p>The analytic watches <b>curl</b> and <b>wget</b> writing executables or scripts into temp folders, and the <b>execution</b> that follows. Deletion is not part of the logic; python is a different interpreter the analytic does not name. The save-then-execute pair is what turns two boring events into one strong signal.</p>"},
{id:"m11",type:"fill",title:"Why M1041 works",summary:"Name the mechanism behind the mitigation.",
scenario:{summary:"The mechanism behind encryption.",
intro:"<p>Your team enforces TLS on all web flows and adds a trusted VPN for remote staff (M1041).</p>"},
question:"Complete the two blanks about why this reduces T1659 risk.",
text:"Encryption means third parties on the path can no longer ___ the content, so they cannot rebuild or inject into the flow. Blocking uncommon file types is M___ , a separate control.",
answers:["read","1021"],
bank:["read","execute","1021","1028","1048"],
hint:"Injection needs the ability to read what it changes; and M1021 is the file-type mitigation from the page.",
explain:"<p>Encryption protects <b>confidentiality and integrity</b> on the wire: a party on the path cannot <b>read</b> the plaintext, so it cannot rebuild or inject content into the flow. It does not block file types — that is <b>M1021</b> — and it does not replace detection. Note why 'execute' is wrong for blank 1: running code is not what the on-path attacker needs; reading and rewriting the traffic is.</p>"},
{id:"m12",type:"choice",title:"Red team approach",summary:"Attacker perspective: pick the T1659 approach.",
scenario:{summary:"Authorised exercise: choose the injection approach.",
intro:"<p>Authorised red-team exercise. Scope: an internal test user whose traffic to a partner site is <b>plain HTTP</b>. You have read-only access to an <b>upstream tap</b> on that path. Goal: show the risk of unencrypted upstream paths — without touching anything inside the office network.</p>"},
question:"Which approach matches T1659 'from the side' within this scope?",
options:[{id:"A",text:"Inject a fake HTTP reply from the tap that races the real response"},{id:"B",text:"Install a rogue proxy inside the office network"},{id:"C",text:"Send the test user a phishing email with the payload"},{id:"D",text:"Ask the partner site to serve the malicious file directly"}],
correct:"A",
hint:"You are outside the office, you cannot hold the connection, and the enterprise is out of scope.",
explain:"<p>From the <b>side</b> fits exactly: you are off the path, so you <b>race</b> the real reply with an injected fake from the tap. A rogue proxy would be an enterprise-internal AiTM — T1557 territory and out of scope. Phishing is a different technique entirely. <b>Trade-off you accept:</b> a side injection can lose the race — the real reply may arrive first, so you repeat the attempt.</p>"},
{id:"m13",type:"multi",title:"Blue team reads the log",summary:"Blue side of the same exercise: find the injected responses.",
scenario:{summary:"The blue side sees the same traffic.",
intro:"<p>Now the blue side of the same authorised exercise. The proxy recorded everything during the injection window. The red team managed to inject <b>two</b> fake replies.</p>",
logs:[{label:"ARTEFACT 1 — Proxy log (filterable)",lines:[
"13:58:02 GET /news client=10[.]1[.]7[.]40 200 text/html bytes=18122",
"13:58:44 GET /news client=10[.]1[.]7[.]40 200 text/html bytes=18144",
"14:01:10 GET /partner/status client=10[.]1[.]7[.]40 200 text/html bytes=9022",
"14:01:10 GET /partner/status client=10[.]1[.]7[.]40 200 application/octet-stream bytes=1188 dup-response unsolicited",
"14:03:31 GET /partner/status client=10[.]1[.]7[.]40 200 text/html bytes=9022",
"14:05:02 GET /news client=10[.]1[.]7[.]40 200 text/html bytes=18190",
"14:07:55 GET /download client=10[.]1[.]7[.]41 200 application/pdf bytes=442310",
"14:09:18 GET /partner/status client=10[.]1[.]7[.]40 200 text/css bytes=842 dup-response unsolicited",
"14:11:40 GET /news client=10[.]1[.]7[.]40 304 - bytes=0",
"14:12:03 GET /partner/status client=10[.]1[.]7[.]40 200 text/html bytes=9018"]}]},
question:"Select the TWO log lines that show the injected responses.",
selectNote:"Two lines are correct. Wrong picks subtract from correct ones. Use the filter if you need it.",
options:[{id:"A",text:"14:01:10 /partner/status 200 application/octet-stream dup-response unsolicited"},{id:"B",text:"14:09:18 /partner/status 200 text/css dup-response unsolicited"},{id:"C",text:"14:07:55 /download 200 application/pdf bytes=442310"},{id:"D",text:"14:11:40 /news 304 - bytes=0"}],
correct:["A","B"],
hint:"Filter for 'dup-response'. A requested PDF download is normal; a 304 is a cache hit.",
explain:"<p>Both <b>dup-response unsolicited</b> lines are the injected fakes: one delivered a binary where the client expected HTML, the other pushed CSS mid-stream. The PDF download was requested and normal; the 304 is a standard cache answer. The blue side sees exactly what AN0993's IDS check alerts on: <b>unsolicited responses with mismatched content</b>. Red chose the race; blue reads its debris.</p>"},
{id:"m14",type:"match",title:"Name the objects",summary:"Match each role to its ATT&CK object.",
scenario:{summary:"Group vs software vs the rest.",
intro:"<p>CTI report draft: '...injected DNS, HTTP and SMB replies; targeted victims redirected to a fake Windows Update page to download malware...'</p>"},
question:"Match each role to the correct ATT&CK object.",
pairs:[{l:"The GROUP behind the Disco tool",r:"G1019 MoustachedBouncer"},{l:"The SOFTWARE used in the campaign",r:"S1088 Disco"},{l:"The TACTIC of the first foothold",r:"TA0001 Initial Access"},{l:"The MITIGATION that encrypts traffic",r:"M1041 Encrypt Sensitive Information"}],
hint:"The ID prefix tells you the object type: G, S, TA, M.",
explain:"<p><b>G1019 MoustachedBouncer</b> is the group; <b>S1088 Disco</b> is the software it used; <b>TA0001 Initial Access</b> is the tactic where injection gives the first foothold; <b>M1041</b> is the encryption mitigation. CTI analysts cite all four object types in one report — the actor (G), the tool (S), the technique (T1659) and the tactic (TA) — so readers can walk the chain.</p>"},
{id:"m15",type:"match",title:"Case facts",summary:"Match each name to its fact from the page.",
scenario:{summary:"Who did what, per the page.",
intro:"<p>Match each name to the fact the page reports about it.</p>"},
question:"Match each name to its fact.",
pairs:[{l:"MoustachedBouncer (G1019)",r:"Espionage against foreign diplomats in Belarus"},{l:"Disco (S1088)",r:"Delivered by injected DNS, HTTP and SMB replies redirecting to downloads"},{l:"Fake Windows Update page",r:"The lure that made targeted victims download the malware"}],
hint:"Who, which tool, which lure.",
explain:"<p>The group conducted <b>espionage against foreign diplomats in Belarus</b> (public reporting, 2023). <b>Disco</b> is the tool delivered through injected replies. The <b>fake Windows Update page</b> was the lure that made victims download it. These three facts are the anchor you will reuse later for attribution reasoning.</p>"},
{id:"m16",type:"fill",title:"Config gap",summary:"Why did the .vbs pass the filter?",
scenario:{summary:"The filter blocked only one file type.",
intro:"<p>Your web filter config, and the campaign that defeated it:</p>",
artefacts:[{label:"ARTEFACT 1 — Web filter rule",code:"rule  name=block-exec\n  action   block\n  file ext match: exe\n  applies  browser downloads",light:true},
{label:"ARTEFACT 2 — What was delivered",code:"Injected page told the browser to download:\n  update_loader.vbs  (script)\nThe rule did not match. The script executed via wscript.exe.",light:false}]},
question:"Complete the two blanks about the gap and the M1021 fix.",
text:"M1021 says to block download/transfer and ___ of uncommon file types. The rule only matched ___ , so the .vbs walked through and executed.",
answers:["execution","exe"],
bank:["execution","exe","vbs","upload","dll"],
hint:"One blank is the second action the mitigation names; the other is the extension the rule actually listed.",
explain:"<p>M1021 says block <b>download/transfer AND execution</b> of potentially uncommon file types. The rule only covered <b>.exe</b>, so the <b>.vbs</b> walked through and executed. The fixes: widen the type list with uncommon script types (vbs, hta) and block execution of browser-downloaded files. Allowing every type or trusting users to spot fake update pages is the opposite of the mitigation.</p>"}
];
