<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;

  --ok-dim:rgba(87,211,140,.08); --part-dim:rgba(255,180,84,.08); --bad-dim:rgba(255,107,107,.08);
  --skip-dim:rgba(169,180,208,.08); --pause-dim:rgba(157,123,255,.10);
  --accent-blue-dim:rgba(90,169,255,.14); --accent-amber-dim:rgba(255,180,84,.14); --accent-green-dim:rgba(87,211,140,.14);
  --ok-glow:rgba(87,211,140,.06); --ok-wash:rgba(87,211,140,.07); --bad-wash:rgba(255,107,107,.07);
  --part-border:rgba(255,180,84,.4); --hint-dim:rgba(255,180,84,.07); --hint-border:rgba(255,180,84,.35);
  --chip-k-border:#33415f; --opt-hover:#16203a; --ink-dark:#08101f; --ink-amber:#201503; --row-dash:#202b45;

}
body[data-sev="easy"]{--sev:var(--sev-easy)}
body[data-sev="medium"]{--sev:var(--sev-medium)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);
  font-size:16px;line-height:1.55;

.wrap{max-width:940px;margin:0 auto;padding:14px 16px 60px}

:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font-family:inherit}
a{color:var(--accent-blue)}
.mono{font-family:var(--font-mono);color:var(--text-mono)}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);

.badge.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:var(--bad-dim)}

/* ---------- sticky exam header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--hdr-bg);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);padding:8px 14px;display:none}

#hdr .title{font-weight:700;font-size:14px;margin-right:2px}

.tchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:14px;

.tchip .lbl{font-family:var(--font-sans);font-size:12px;color:var(--text-secondary)}

#hdr button{min-height:44px}
#prog{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);position:relative;overflow:hidden;display:none}

#prog .fill::after{content:"";position:absolute;inset:0;

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);padding:9px 16px;min-height:44px;font-size:15px;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sev);border-color:var(--sev);color:var(--ink-dark);font-weight:700}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--ink-dark);font-weight:700}
.btn.amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--ink-amber);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:17px;padding:12px 26px}
/* ---------- intro ---------- */
.intro-hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.intro-hdr h1{margin:0;font-size:22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.fact .k{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.fact .v{font-size:15px;font-weight:600}
.learn p{margin:9px 0}
.kw-theme{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.kw-theme h3{margin:0 0 8px;font-size:14px;color:var(--accent-blue)}
.howlist{margin:8px 0;padding-left:0;list-style:none}
.howlist li{margin:7px 0;padding-left:26px;position:relative;color:var(--text-primary)}
.howlist li::before{content:"\25B8";position:absolute;left:6px;color:var(--accent-green)}
/* ---------- exercise blocks ---------- */
.ex-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 4px}
.ex-top .cnt{font-weight:700}
.blk{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);margin:14px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:700;font-size:14px;
  letter-spacing:.8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);min-height:44px}
.blk-h .ic{font-size:15px}
.blk-h .sum{font-weight:400;color:var(--text-secondary);font-size:13px;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-h .tgl{font-size:12px;color:var(--text-secondary);font-weight:400}
.blk.scen .blk-h{color:var(--accent-blue);background:linear-gradient(90deg,var(--accent-blue-dim),transparent)}
.blk.q .blk-h{color:var(--accent-amber);background:linear-gradient(90deg,var(--accent-amber-dim),transparent);cursor:default}
.blk.ans .blk-h{color:var(--accent-green);background:linear-gradient(90deg,var(--accent-green-dim),transparent);cursor:default}
.blk .blk-b{padding:13px 15px;background:var(--bg-surface)}
.blk.collapsed .blk-b{display:none}
.blk.q .blk-b{font-weight:700;font-size:16.5px}
.artefact{border:1px solid var(--border);border-radius:6px;margin:10px 0;background:var(--bg-surface-2)}
.artefact .art-lbl{display:block;font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:6px 12px;border-bottom:1px solid var(--border);letter-spacing:.5px}
.artefact pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:var(--font-mono);font-size:14px;line-height:1.6;color:var(--text-mono)}
.artefact p{margin:0;padding:10px 12px;color:var(--text-primary)}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);overflow-x:auto;margin:8px 0}
/* syntax highlight tokens */
.tk-time{color:var(--tk-time)}.tk-path{color:var(--accent-amber)}.tk-ip{color:var(--tk-ip)}.tk-key{color:var(--state-paused)}
.tk-lvl{color:var(--state-incorrect);font-weight:600}.tk-str{color:var(--accent-green)}.tk-file{color:var(--text-mono)}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:11px 13px;
  min-height:44px;font-size:15px;cursor:pointer;transition:background .12s ease}
.opt:hover{background:var(--opt-hover)}
.opt .lt{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);min-width:22px}
.opt.sel{border-color:var(--sev);box-shadow:inset 3px 0 0 var(--sev),0 0 0 1px var(--sev)}
.opt.sel .tag{color:var(--sev);font-size:12px;font-weight:700;margin-left:auto}
.opt.right{border-color:var(--state-correct)}
.opt.wrong{border-color:var(--state-incorrect)}
.opt.dim{opacity:.75}
/* ---------- matching ---------- */
.matchrow{display:grid;grid-template-columns:1fr 240px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--row-dash)}
.matchrow:last-child{border-bottom:none}
.matchrow .lt{color:var(--text-primary)}
.matchrow select{width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-primary);
  border:1px solid var(--border);border-radius:6px;padding:8px;font-size:14px}
.matchrow select:disabled{opacity:.8}
/* ---------- fill ---------- */
.fillwrap .sent{font-size:16px;line-height:2}
.fillwrap input{background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  color:var(--text-mono);font-family:var(--font-mono);font-size:15px;border-radius:6px 6px 0 0;
  padding:7px 10px;min-width:110px;min-height:44px;margin:0 4px}
.fillwrap input:disabled{opacity:.85}
/* ---------- dnd / order ---------- */
.dndgrid{display:grid;gap:12px}
.dnd-zones{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.zone{border:1px dashed var(--border);border-radius:6px;background:var(--bg-surface-2);min-height:70px;padding:8px}
.zone.over{border-color:var(--accent-green);background:var(--ok-glow)}
.zone .z-h{font-size:13px;font-weight:700;color:var(--accent-blue);margin:0 0 6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-surface);border:1px solid var(--border);
  border-radius:999px;padding:6px 12px;margin:3px;cursor:pointer;min-height:44px;font-size:14px;color:var(--text-primary)}
.pill.sel{border-color:var(--sev);box-shadow:0 0 0 1px var(--sev)}
.pill[draggable="true"]{cursor:grab}
.bank{background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;padding:8px;min-height:52px}
.bank .b-h{font-size:12px;color:var(--text-secondary);margin:0 0 4px}
.seq{list-style:none;margin:8px 0 0;padding:0}
.seq li{display:flex;gap:8px;align-items:center;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;margin:6px 0;min-height:44px}
.seq .n{font-family:var(--font-mono);color:var(--accent-amber);font-weight:700}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono)}
.term .scr{min-height:60px;max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term .pline{display:flex;gap:8px;align-items:center;margin-top:8px}
.term .pr{color:var(--accent-green);font-weight:700;white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);
  font-size:14px;padding:8px 2px;min-height:44px}
.term .err{color:var(--state-incorrect)}
.term .out{color:var(--text-secondary)}
.synpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-blue);
  border-radius:6px;padding:10px 12px;margin:10px 0;font-size:14px}
.synpanel .h{color:var(--accent-blue);font-weight:700;font-size:13px;margin-bottom:6px}
.synpanel pre{margin:6px 0;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono)}
.synpanel ul{margin:6px 0 0 18px;padding:0;color:var(--text-secondary);font-size:13.5px}
/* ---------- branch steps ---------- */
.stepchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;
  padding:4px 10px;font-size:12.5px;margin:2px 6px 2px 0;color:var(--text-secondary);background:var(--bg-surface-2)}
.stepchip.cur{color:var(--accent-amber);border-color:var(--accent-amber);font-weight:700}
/* ---------- feedback ---------- */
.fbk{border:1px solid var(--border);border-left:4px solid var(--text-secondary);border-radius:var(--radius);
  background:var(--bg-surface);margin:16px 0 0;padding:13px 15px}
.fbk.ok{border-left-color:var(--state-correct)}
.fbk.part{border-left-color:var(--state-partial)}
.fbk.bad{border-left-color:var(--state-incorrect)}
.fbk .fbk-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:700;font-size:16px}
.fbk .credit{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;margin:4px 0;
  background:var(--bg-surface-2);border:1px solid var(--border);font-size:14px}
.items .v{font-weight:700;white-space:nowrap}
.v.ok{color:var(--state-correct)}.v.bad{color:var(--state-incorrect)}.v.miss{color:var(--state-skipped)}.v.danger{color:var(--state-incorrect)}
.fbk .why{color:var(--text-secondary);font-size:14px;margin:9px 0 0}
.fbk .study{margin:9px 0 0;padding:9px 12px;border-radius:6px;background:var(--part-dim);
  border:1px solid var(--part-border);font-size:14px}
.fbk .study .h{color:var(--accent-amber);font-weight:700}
.hintbox{margin:12px 0 0;padding:10px 13px;border-radius:6px;background:var(--hint-dim);
  border:1px solid var(--hint-border);font-size:14px}
.hintbox .h{color:var(--accent-amber);font-weight:700}
.exfoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/* ---------- pause overlay ---------- */
#pauseOverlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(3px)}
#pauseOverlay .box{text-align:center;max-width:420px;padding:30px}
#pauseOverlay .big{font-size:44px;color:var(--state-paused)}
#pauseOverlay h2{color:var(--state-paused);margin:10px 0 6px}
#pauseOverlay p{color:var(--text-secondary)}
/* ---------- review & results ---------- */
.revlist{list-style:none;margin:10px 0;padding:0}
.revlist li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin:8px 0}
.revlist .t{flex:1 1 auto;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.stat .n{font-size:26px;font-weight:800;font-family:var(--font-mono)}
.stat .l{color:var(--text-secondary);font-size:13px}
.stat.ok .n{color:var(--state-correct)}.stat.part .n{color:var(--state-partial)}
.stat.bad .n{color:var(--state-incorrect)}.stat.skip .n{color:var(--state-skipped)}
.verdict{border-radius:var(--radius);border:1px solid;padding:18px;margin:16px 0;text-align:center}
.verdict.pass{border-color:var(--state-correct);background:var(--ok-wash)}
.verdict.fail{border-color:var(--state-incorrect);background:var(--bad-wash)}
.verdict .big{font-size:30px;font-weight:800;letter-spacing:1px}
.verdict.pass .big{color:var(--state-correct)}
.verdict.fail .big{color:var(--state-incorrect)}
.verdict p{color:var(--text-secondary);margin:8px 0 0}
.score-line{font-family:var(--font-mono);font-size:17px}
.score-line b{color:var(--sev)}
/* ---------- responsive & motion ---------- */
@media (max-width:640px){
  .matchrow{grid-template-columns:1fr}
  .blk-h .sum{display:none}
  body{font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  #prog .fill::after{animation:none;display:none}
  *{transition:none!important;animation:none!important}
}
</style>

window.EXAM = {"meta": {"topicId": "t1547", "batch": 3, "title": "T1547 Boot or Logon Autostart Execution \u2014 HARD", "difficulty": "hard", "questionCount": 16, "estimatedMinutes": 50, "passMark": 70}, "severity": {"key": "hard", "label": "HARD"}, "timer": {"budgetSeconds": 3000}, "intro": {"objectLine": "T1547 - Boot or Logon Autostart Execution - MITRE ATT&CK Technique - Tactics: Persistence, Privilege Escalation - Platforms: Windows, macOS, Linux", "learn": ["This is the hard step for T1547 - Boot or Logon Autostart Execution. The two earlier levels gave you the concepts and the two-step reasoning. Here the answers fight back: several options will look almost right, and one or two will look alarming while being innocent - or look routine while being the real threat.", "You will read realistic artefact sets: Sysmon extracts with change tickets and patch windows, triage queues, and intelligence notes that name real actors and tools from the ATT&CK procedure examples. Your job is to correlate, not to keyword-match: the same log line can be benign in one context and malicious in another.", "You will also act. Two terminal exercises put you in live-response and on a Linux jump host with strict read-only instructions - the discipline of choosing a safe command when a dangerous one is one typo away. A decision tree walks a full incident from a modified Winlogon value to evidence-safe removal, and one exercise asks you to rank five alerts the way a duty lead would.", "Keep one habit from the earlier levels and sharpen it here: for every artefact, ask 'what will Windows, lsass.exe, spoolsv.exe, or the kernel load because of this line?' - and only then decide how much it matters."], "keywords": [{"t": "System-level autostart discrimination", "items": ["T1547.002 Authentication Package (Lsa value)", "T1547.003 Time Providers (W32Time)", "T1547.004 Winlogon Helper DLL (Userinit / Shell / Notify)", "T1547.005 Security Support Provider (Security Packages)", "T1547.012 Print Processors (prtprocs)", "T1547.014 Active Setup (StubPath)", "T1547.006 Kernel Modules and Extensions (/Library/Extensions)"]}, {"t": "Attribution and procedure examples", "items": ["PipeMon - print processor install", "Mimikatz - SSP implementation", "APT32 - macOS kernel modules", "Kimsuky - shortcut modification", "Turla - Winlogon Shell value", "MuddyWater - run keys and Startup items"]}, {"t": "Detection and response under pressure", "items": ["Near-miss log reading (benign vs malicious shape)", "Coverage-gap analysis across detection sets", "Alert prioritisation axes", "Read-only live response discipline", "Evidence-safe removal order", "Verified-benign handling (CMDB, signing, baseline)"]}, {"t": "Controls", "items": ["Least privilege (M1026 family)", "Execution prevention (M1038)", "Restricted registry permissions (M1024)", "Behaviour prevention on endpoint (M1040)"]}], "how": ["You need 70% to pass. The score counts only the exercises you actually answered.", "This file has 16 exercises: one four-step decision tree, two terminal tasks, multi-select, matching, drag and drop, fill the blank, ordering, and single choice questions - several with a log viewer you can filter.", "Exercises with several parts give partial credit: each correct part adds credit, each wrong part you select removes credit. Guessing everything can bring your credit to zero.", "The timer counts down from 50 minutes. Press Pause for a real break: the exercise hides and the timer stops until you press Resume.", "When you press Check, the timer stops automatically so you can study the item-by-item feedback. It starts again when you press Next. Skip and Hint do not stop the timer.", "Skipped exercises go to a review pool you can revisit before finishing. Skipped exercises you never answer are excluded from the score.", "One hint per exercise is allowed. A hint costs 10% of that exercise's credit - and here the hint only removes one wrong path, it never names the answer."]}, "exercises": [{"id": "H01", "type": "qcm", "title": "W32Time loads a new DLL", "summary": "Time provider registration on SRV-DC-05 - which sub-technique?", "scenario": [{"p": "Domain controller SRV-DC-05 raised two correlated events during the night. The host is otherwise quiet."}, {"log": "ARTEFACT 1 - Sysmon events (SRV-DC-05)", "lines": ["2026-10-22 02:37:44  EID 13  reg.exe wrote", "  HKLM\\SYSTEM\\CurrentControlSet\\Services\\W32Time\\TimeProviders\\CustomTP\\DllName", "  data: C:\\Windows\\System32\\ntpx64.dll", "2026-10-22 02:37:51  EID 7  svchost.exe (W32Time service) loaded C:\\Windows\\System32\\ntpx64.dll  (unsigned, not in baseline)"]}], "question": "Which T1547 sub-technique do these two events describe?", "hint": "Identify the service that loaded the DLL, then match it to the sub-technique that service hosts.", "explain": "The W32Time service (inside svchost.exe) loads every DLL registered under Services\\W32Time\\TimeProviders at boot - that is T1547.003 Time Providers. The near-misses all load DLLs too, but through different hosts: LSA packages go through lsass.exe, print processors through spoolsv.exe, and Winlogon helpers through winlogon.exe. On a domain controller, an unsigned DLL in the time service is also a privilege-escalation problem, because the service runs as SYSTEM.", "study": "Read the T1547.003 description and note both the registry key and the hosting service.", "options": [{"t": "T1547.002 - Authentication Package", "why": "Authentication packages are loaded by lsass.exe, not the time service."}, {"t": "T1547.012 - Print Processors", "why": "Print processors are loaded by spoolsv.exe from the prtprocs directory."}, {"t": "T1547.004 - Winlogon Helper DLL", "why": "Winlogon helpers are tied to logon, not to the time service."}, {"t": "T1547.003 - Time Providers", "why": "Correct - the W32Time service loads the DLL registered under TimeProviders."}], "correct": [3]}, {"id": "H02", "type": "branch", "title": "Winlogon Userinit incident", "summary": "Decision tree: ACC-FIN-07 Userinit abuse (4 steps)", "scenario": [{"p": "Workstation ACC-FIN-07 (finance). EDR in detect mode raised no blocks but logged the events below. The user still works normally."}, {"log": "ARTEFACT 1 - Sysmon events (ACC-FIN-07)", "lines": ["2026-10-21 17:58:02  EID 13  update.exe wrote", "  HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Userinit", "  new data: C:\\Windows\\system32\\userinit.exe,C:\\Users\\Public\\svhost.exe", "2026-10-21 17:57:40  EID 11  File created: C:\\Users\\Public\\svhost.exe  (unsigned, hash unknown)", "2026-10-21 17:57:12  EID 11  File created: C:\\ProgramData\\update.exe  (unsigned)"]}], "question": "Work the four decision steps for this incident.", "hint": "Take the steps in order; each step assumes the facts confirmed so far, not the ones you wish you had.", "explain": "The appended path in Userinit means Windows runs svhost.exe (a deliberate misspelling of svchost.exe) at every interactive logon. Least-aggressive containment - isolate, keep power on - preserves the memory and sessions the IR team needs. Because update.exe ran with admin rights, one autostart is never the whole story: sibling Winlogon values, LSA keys, and run keys in every hive must be checked. Removal comes after recording exact values, and binaries go last.", "study": "Study the Winlogon values list (Notify, Userinit, Shell) and practise reasoning about layered persistence.", "steps": [{"q": "STEP 1 - What does the modified Userinit value actually mean?", "options": [{"t": "Windows runs userinit.exe and then svhost.exe at every interactive logon", "why": "Correct - anything appended after the comma runs at logon."}, {"t": "Windows only runs the first path; the second path is ignored", "why": "Windows executes every comma-separated entry, not just the first."}, {"t": "It is a benign typo for svchost.exe and can be ignored", "why": "The misspelling is the attacker's camouflage; svhost.exe in Users\\Public is not a Windows file."}, {"t": "Userinit values only apply to service accounts", "why": "Userinit applies to interactive logons of any account."}], "correct": 0}, {"q": "STEP 2 - Containment decision. The attacker had admin-level code execution. What do you do first?", "options": [{"t": "Isolate the host from the network, keep it powered on, and notify IR", "why": "Correct - least aggressive action that still stops C2 and preserves evidence."}, {"t": "Power the host off immediately to freeze the attacker", "why": "Power-off destroys memory, running processes, and live connections."}, {"t": "Delete the registry value now and watch whether it returns", "why": "Deleting before evidence capture hides the artefact and leaves the binary in place."}, {"t": "Wait for the weekly patch window to clean it", "why": "Days of dwell time is an unacceptable delay with admin-level compromise."}], "correct": 0}, {"q": "STEP 3 - update.exe had admin rights. Before you call the scope 'one autostart', what must you check?", "options": [{"t": "Sibling Winlogon values and every other autostart location in all hives", "why": "Correct - admin-rights actors layer persistence (Winlogon Shell, LSA keys, run keys)."}, {"t": "Only the current user's HKCU Run key", "why": "Too narrow: with admin rights, HKLM and system keys are at least as likely."}, {"t": "Nothing - one modified value means one autostart", "why": "Layered persistence is the norm, not the exception, after admin access."}, {"t": "Only the browser extensions on the host", "why": "Browser extensions are unrelated to T1547 autostart persistence."}], "correct": 0}, {"q": "STEP 4 - You confirm a second autostart: a new DLL under the Lsa Security Packages value. Evidence-safe removal order?", "options": [{"t": "Record exact values, remove both autostart entries, then remove the binaries", "why": "Correct - capture, then registry removal, then files."}, {"t": "Delete the binaries first so the attacker loses their tools", "why": "Deleting binaries first loses hash-and-quarantine evidence for other hosts."}, {"t": "Delete the Userinit value and leave the LSA entry for later", "why": "Partial removal leaves a working autostart - the host re-persists."}, {"t": "Remove nothing and reimage, since reimage is always safer", "why": "Reimaging without collection destroys the evidence the IR team still needs."}], "correct": 0}]}, {"id": "H03", "type": "multi", "title": "Malicious or installer?", "summary": "Select every observation that increases malicious confidence", "scenario": [{"p": "Three run key entries are in your triage queue, each with the observations listed below. You must justify which observations actually increase malicious confidence."}, {"log": "ARTEFACT 1 - Triage queue extract", "lines": ["Entry 1: value written by a process that matches no known installer; binary located in C:\\Users\\Public", "Entry 2: value data points to an unsigned binary created two minutes before the write", "Entry 3: value name imitates 'OneDriveSetup'; the hash is new to the whole fleet", "Entry 4: the entry sits under HKCU (current user hive)", "Entry 5: the binary has a valid vendor signature", "Entry 6: a Startup folder .lnk created by the documented IT onboarding script"]}], "question": "Select every observation that increases confidence the entry is malicious.", "hint": "Three of the six observations are true red flags. The other three are perfectly normal for legitimate software.", "explain": "No-installer origin plus a user-writable folder like Users\\Public, a freshly created unsigned binary, and an imitating name with a fleet-new hash are all genuine red flags. Legitimate software constantly uses HKCU and valid signatures, and the onboarding script is documented - those observations actually argue for benign.", "study": "Practise separating weak indicators (location, hive) from strong ones (provenance, signing, baseline novelty).", "options": [{"t": "Written by a process matching no known installer; binary in Users\\Public", "why": "Correct - installers have known hashes and paths; Public is not an installer location."}, {"t": "Unsigned binary created two minutes before the run key write", "why": "Correct - the payload was dropped moments before registering itself."}, {"t": "Name imitates a known entry; hash is new to the whole fleet", "why": "Correct - imitation plus baseline novelty is a strong malicious signal."}, {"t": "The entry sits under HKCU", "why": "Weak - thousands of legitimate tools use HKCU run keys."}, {"t": "The binary has a valid vendor signature", "why": "This argues for benign, not malicious - though stolen certs exist."}, {"t": "The .lnk came from the documented IT onboarding script", "why": "Documented, expected activity argues for benign."}], "correct": [0, 1, 2]}, {"id": "H04", "type": "qcm", "title": "One real finding in the night shift", "summary": "Log viewer: which line is the true high-severity persistence?", "scenario": [{"p": "Night shift on SRV-APP-11. Nine events are in the log viewer. A change ticket (CHG-2231) documents a printer migration tonight, and Patch Tuesday updates ran at 08:00. One line is a real, high-severity persistence finding."}, {"log": "ARTEFACT 1 - Sysmon events (SRV-APP-11)", "filter": true, "lines": ["2026-10-23 03:14:02  EID 1  spoolsv.exe -> cmd.exe  cmdline: cmd.exe /c printmig.exe b C:\\backups\\printers.cat", "2026-10-23 03:41:19  EID 13  reg.exe wrote HKCU\\...\\CurrentVersion\\Run\\OneDriveSetup  data: \"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe\" /background", "2026-10-23 02:14:55  EID 13  svcinst.exe wrote HKLM\\...\\Control\\Lsa\\Notification Packages  += websec.dll", "2026-10-23 02:15:01  EID 11  File created: C:\\Windows\\System32\\websec.dll  (unsigned, 6 KB)", "2026-10-23 07:58:03  EID 1  chrome.exe -> chrome.exe (renderer child process)", "2026-10-23 08:02:11  EID 3  teams.exe -> 52[.]113[.]194[.]180:443 (allowed, corporate proxy)", "2026-10-23 08:10:44  EID 12  Registry key deleted: HKCU\\...\\RunOnce\\NextRun (post-update cleanup)", "2026-10-23 08:22:30  EID 1  wuauclt.exe (Windows Update) started evaluation scan", "2026-10-23 08:31:12  EID 11  File created: C:\\Users\\svc_backup\\AppData\\Local\\Temp\\backup_schedule.tmp"]}], "question": "Which single line is the true high-severity persistence finding?", "hint": "Ask which line plants code that Windows itself will load on the next boot, and which lines have documented or baseline-backed explanations.", "explain": "The 02:14 write adds websec.dll to the Lsa Notification Packages value: lsass.exe will load it as an authentication package at boot, which is T1547.002, and the unsigned DLL dropped into System32 one step earlier corroborates it. The 03:14 spoolsv-to-cmd line looks dramatic but matches the documented printer migration tool. The OneDrive run key is signed and matches baseline. The RunOnce deletion removes an entry rather than adding one, and the rest are routine.", "study": "Practise reading registry writes as 'what will Windows load because of this line?' rather than 'how scary does it look?'", "options": [{"t": "03:14 spoolsv.exe spawning cmd.exe /c printmig.exe", "why": "Alarming shape, but printmig is the documented migration tool in CHG-2231."}, {"t": "02:14 write adding websec.dll to Lsa Notification Packages", "why": "Correct - lsass.exe will load it at every boot (T1547.002), backed by the unsigned System32 drop."}, {"t": "03:41 OneDriveSetup run key write", "why": "Signed Microsoft binary at its baseline path - benign autostart noise."}, {"t": "08:10 deletion of the RunOnce entry", "why": "A deletion removes a trigger; it cannot plant persistence."}], "correct": [1]}, {"id": "H05", "type": "terminal", "title": "Read-only autostart sweep", "summary": "Type the read-only command for the full machine-wide run key sweep", "scenario": [{"p": "You are in a live-response session on server SRV-DB-01 (PowerShell). The IR lead's instruction is strict: 'Read-only. Show every value under the machine-wide Run key, including anything in subkeys, on screen. Touch nothing.'"}], "question": "Type the command that performs this read-only, recursive enumeration.", "hint": "One Windows tool reads the Registry without changing it; it has a switch that includes subkeys.", "explain": "reg query with the key path and /s reads the key and every subkey without changing anything - exactly what volatile-order evidence work requires. reg save would export hive files (a heavier, state-touching operation), and add or delete would modify the host: the IR lead's 'touch nothing' rules them out. The canonical command is reg query \"HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\" /s.", "study": "Compare reg query /s, reg save, and reg export - similar verbs, very different side effects.", "term": {"prompt": "PS C:\\> ", "canonical": "reg query \"HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\" /s", "out": ["", "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run", "    OneDrive    REG_SZ    \"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe\" /background", "    UpdateAssist    REG_SZ    \"C:\\Program Files\\UpdateAssist\\uassist.exe\" /quiet"], "elements": [{"all": ["reg", "query"], "desc": "reg.exe with the read-only verb query", "why": "query lists values; it changes nothing on the host."}, {"all": ["hklm\\software\\microsoft\\windows\\currentversion\\run"], "desc": "the machine-wide run key path", "why": "This is the autostart key the IR lead asked for."}, {"all": ["/s"], "desc": "the /s switch for all subkeys", "why": "The instruction explicitly includes subkeys; without /s you get one level only."}], "forbid": [{"any": ["reg add", "reg delete", "reg restore", "reg load", "reg compare /f"], "desc": "state-changing reg verbs (add, delete, restore, load)", "danger": true, "why": "'Touch nothing' means read-only - these verbs modify the host and can destroy evidence."}, {"any": ["reg save", "reg export"], "desc": "reg save / reg export", "danger": false, "why": "Not destructive, but they write files and go beyond 'show on screen'; query is the precise tool."}], "syntax": null}}, {"id": "H06", "type": "match", "title": "Threat-actor playbook to sub-technique", "summary": "Match six documented actors and tools to their autostart behaviour", "scenario": [{"p": "You are preparing a threat-profile briefing. Each row pairs an actor or tool with a documented behaviour from public reporting. Match each behaviour to the sub-technique it demonstrates."}], "question": "For each actor or tool, choose the sub-technique its behaviour demonstrates.", "hint": "Anchor on the artefact in each behaviour: print processor DLL, SSP, kernel extension, shortcut, Winlogon Shell value, run keys.", "explain": "PipeMon installed itself as a print processor (T1547.012). Mimikatz ships an SSP implementation that lsass.exe can load (T1547.005). APT32 used kernel modules and extensions on macOS (T1547.006). Kimsuky modified shortcuts so targets executed payloads (T1547.009). Turla set Winlogon Shell values to run alongside explorer.exe (T1547.004). MuddyWater used run keys and Startup items (T1547.001). These pairings come from the ATT&CK procedure examples and give you ready-made hunt hypotheses.", "study": "Open the procedure examples table on the T1547 sub-technique pages and note the actor-tool pairings.", "pairs": {"left": ["PipeMon (installer modified the prtprocs registry key)", "Mimikatz (ships a loadable SSP implementation)", "APT32 (macOS kernel module / extension use)", "Kimsuky (re-pointed shortcut targets)", "Turla (Shell value under the Winlogon key)", "MuddyWater (run keys and Startup folder items)"], "right": [{"id": "t012", "label": "T1547.012 Print Processors"}, {"id": "t005", "label": "T1547.005 Security Support Provider"}, {"id": "t006", "label": "T1547.006 Kernel Modules and Extensions"}, {"id": "t009", "label": "T1547.009 Shortcut Modification"}, {"id": "t004", "label": "T1547.004 Winlogon Helper DLL"}, {"id": "t001", "label": "T1547.001 Registry Run Keys / Startup Folder"}, {"id": "t013", "label": "T1547.013 XDG Autostart Entries"}], "answers": ["t012", "t005", "t006", "t009", "t004", "t001"], "whys": ["PipeMon registered itself as a print processor loaded by spoolsv.", "Mimikatz's SSP (mimilib) is the classic T1547.005 implementation.", "APT32's macOS tooling included kernel module and extension persistence.", "Kimsuky's shortcut tampering is documented under T1547.009.", "Turla's Winlogon Shell value is a textbook T1547.004 case.", "MuddyWater's run key and Startup folder use maps to T1547.001."]}}, {"id": "H07", "type": "multi", "title": "Coverage gap in the detection set", "summary": "Select the two locations the current detections do not watch", "scenario": [{"p": "Your Windows-only fleet has three detections: (1) a registry analytic on CurrentVersion\\Run values in both hives, (2) file events in user and common Startup folders, (3) an EDR rule for unsigned DLLs written to System32 by non-installers."}], "question": "Select the TWO of these four locations that the current set does not watch.", "hint": "Test each location against all three detections - a location is covered only if at least one analytic would fire on it.", "explain": "Active Setup (Installed Components with StubPath) and the Winlogon Userinit value are registered through registry writes outside CurrentVersion\\Run, and no file event or System32 rule reliably covers them - so both are gaps. The HKCU and HKLM Run values are exactly what detection (1) watches, and Startup folder files are detection (2).", "study": "Practise mapping each detection to the artefact locations it actually covers, then list what falls through.", "options": [{"t": "HKCU\\...\\CurrentVersion\\Run values", "why": "Covered - detection (1) watches Run values in both hives."}, {"t": "HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components", "why": "Correct - no analytic covers the Active Setup key (T1547.014)."}, {"t": "Startup folder file creation", "why": "Covered - detection (2) watches both Startup folders."}, {"t": "HKLM\\...\\Winlogon\\Userinit value", "why": "Correct - the registry write to Winlogon is outside all three detections (T1547.004)."}], "correct": [1, 3]}, {"id": "H08", "type": "qcm", "title": "Persistence after the hardening GPO", "summary": "Attacker view: which path still works for a standard user?", "scenario": [{"p": "You are the red team operator emulating a standard-user threat actor on a hardened workstation. New GPO settings deny standard users write access to the CurrentVersion\\Run keys in both HKLM and HKCU."}], "question": "Which T1547.001-family persistence still works for you without admin rights?", "hint": "The GPO blocks registry writes in two hives - ask which autostart mechanism is a file, not a registry value.", "explain": "The Startup folder is a directory on disk, not a registry key: a standard user can still drop a payload or a shortcut into their own Startup folder and it will run at next logon. The GPO gaps are worth reporting - hardening that blocks registry run keys but leaves Startup folders writable misses half of T1547.001.", "study": "Re-read the T1547.001 description: it covers run keys AND the Startup folder.", "options": [{"t": "Dropping a payload shortcut into the user's own Startup folder", "why": "Correct - file-based autostart is untouched by a registry-write GPO."}, {"t": "Writing an HKLM Run key value anyway", "why": "The GPO explicitly denies standard users the HKLM write."}, {"t": "Registering a Winlogon helper DLL", "why": "Winlogon lives under HKLM and needs admin - blocked as well."}, {"t": "Installing a print processor DLL", "why": "Print processors need SeLoadDriverPrivilege and admin rights."}], "correct": [0]}, {"id": "H09", "type": "order", "title": "Rank the persistence alerts", "summary": "Prioritise five alerts from most to least urgent", "scenario": [{"p": "Five alerts wait in the morning queue. The duty lead wants them worked in priority order: most urgent first. Use likelihood of true T1547 persistence and impact to rank them."}], "question": "Click the alerts in priority order, highest first.", "hint": "Weigh three signals: what wrote it, whether the artefact is signed or documented, and what the target is worth.", "explain": "The Word-parented unsigned run key write is the classic phishing-to-persistence chain - first. The server-side Userinit change without a ticket is system-level and unexplained - second. The unsigned macOS kext on an executive laptop is serious but needs verification - third. The spooler change during the documented patch window - fourth. The signed vendor installer writing its own updater key is normal software behaviour - last.", "study": "Practise ranking with three axes: provenance, artefact quality, target value.", "items": [{"id": "a4", "txt": "Print processor key write on a print server during the documented patch window, by SCCM"}, {"id": "a1", "txt": "reg.exe (parent WINWORD.EXE) wrote a new HKCU Run value to an unsigned binary in %APPDATA%"}, {"id": "a5", "txt": "msiexec.exe (signed vendor installer) wrote an HKLM Run value for its updater"}, {"id": "a2", "txt": "New second path in HKLM Winlogon Userinit on a file server - no change ticket"}, {"id": "a3", "txt": "Unsigned kernel extension load alert on the CFO's MacBook - no MDM profile"}], "correct": ["a1", "a2", "a3", "a4", "a5"], "whyPos": ["Phishing-parented, unsigned, fleet-new - the classic chain, work it now.", "System-level autostart on a server with no documentation is high impact.", "Serious, but the alert needs verification before response at scale.", "Documented change by a management tool - verify the ticket, low urgency.", "Signed installer writing its own updater is normal software behaviour."]}, {"id": "H10", "type": "qcm", "title": "Expected activity or new threat?", "summary": "Choose the least aggressive correct action for a verified-benign alert", "scenario": [{"p": "Alert at 09:02: new HKCU Run value 'DeployAgent' written by deployclient.exe. The CMDB confirms DeployAgent is your in-house deployment tool, the signature is valid, and the hash matches the fleet baseline. The laptop was re-imaged yesterday after a hardware swap, so the tool re-registered itself."}], "question": "What is the right action?", "hint": "Everything about the artefact checks out - the question is what a mature process does with a verified-benign alert.", "explain": "The provenance is verified: signed, hashed, documented, and explained by the re-imaging. Isolating or wiping again would burn hours for nothing, removing the key breaks a legitimate tool, and disabling the analytic throws away coverage for every future alert. The professional action is to annotate the alert with the verification evidence and keep watching for genuinely new changes.", "study": "Practise the benign-verdict habit: record why it is benign, never just close it.", "options": [{"t": "Isolate and re-image the laptop again", "why": "Destructive action with zero justification - everything verified benign."}, {"t": "Remove the run key so the alert stops firing", "why": "Breaks a legitimate tool; the next swap will re-alert anyway."}, {"t": "Annotate the alert as expected activity and keep watching for new changes", "why": "Correct - verified benign, documented, coverage stays intact."}, {"t": "Disable the run key analytic entirely", "why": "Removes your main T1547.001 detection for the whole fleet."}], "correct": [2]}, {"id": "H11", "type": "fill", "title": "macOS kernel extension folder", "summary": "Fill the blank: the third-party kext location on macOS", "scenario": [{"p": "Authorized test on a lab MacBook: the red team drops an unsigned kernel extension that must load when the machine boots (T1547.006 on macOS). Third-party kernel extensions are installed under a well-known system folder."}], "question": "Complete the path with the folder name.", "hint": "The folder is named after what kernel extensions are called on macOS - it sits under /Library.", "explain": "Third-party kernel extensions are installed under /Library/Extensions, and the system loads them at boot - which is what makes T1547.006 powerful: the code runs with kernel privileges before any user logs in. Apple has largely moved to system extensions, but legacy and unmanaged devices still expose this path, which is why kext-load alerts matter.", "study": "Read the T1547.006 page and note the macOS paths next to the Linux module paths.", "blanks": [{"name": "kext-dir", "pre": "Third-party kernel extensions are installed under /Library/", "post": " , and macOS loads them at boot (T1547.006 on macOS).", "answers": ["Extensions", "extensions"], "why": "/Library/Extensions is the third-party kext folder.", "width": 12}]}, {"id": "H12", "type": "multi", "title": "Hunt for the reported actor behaviour", "summary": "Select every artefact the MuddyWater hunt should collect", "scenario": [{"p": "Your CTI lead circulates an intelligence note and asks the hunt team to sweep the Windows estate this week."}, {"artefact": "ARTEFACT 1 - CTI note (extract)", "text": "Reporting (ATT&CK G0069, MuddyWater): the group has used registry run keys and Startup folder items to establish persistence on compromised Windows hosts (T1547.001). Focus your sweep on artefacts left by that behaviour."}], "question": "Select every artefact the hunt should collect.", "hint": "Collect what the behaviour actually leaves behind: the key values, the folder contents, and the command that wrote them.", "explain": "The reported behaviour is run keys plus Startup items, so the sweep collects Run key values in both hives, Startup folder contents, and the process events of reg.exe or script hosts adding run values. Everything else - web history, domain-wide Kerberos logs, BIOS versions - does not record T1547.001 artefacts and would only slow the hunt.", "study": "Turn each ATT&CK procedure example into a list of concrete artefacts before hunting.",         inst.stepViews[i].forEach(function (x, vi) { if (x.oi === st.correct) wantV = vi; });
        var v3 = (pick === wantV) ? 'ok' : (pick === -1 ? 'miss' : 'bad');

  function gradeRaw(ex, cmd) {

  /* ---------------- check / next / skip / hint ---------------- */
  function onCheck() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    if (inst.ex.type === 'branch' && inst.step < inst.ex.steps.length - 1) {
      if (inst._pick == null || inst._pickStep !== inst.step) return;
      inst.stepAns[inst.step] = inst._pick;
      inst.step++; inst._pick = null; inst._pickStep = null;
      renderEx(); return;
    }
    setT('PAUSED_AUTO_CHECK');
    if (inst.ex.type === 'branch' && inst._pick != null && inst._pickStep === inst.step && inst.stepAns[inst.step] === -1) {
      /* record the final step's choice before grading (intermediate steps already stored theirs) */
      inst.stepAns[inst.step] = inst._pick;
    }
    var res = grade(inst);
    res.base = res.credit;
    if (S.hints[inst.ex.id]) res.credit = Math.max(0, res.credit - 0.10);
    inst.graded = true; inst.lastRes = res;
    S.credits[inst.ex.id] = res.credit;
    S.bases[inst.ex.id] = res.base;
    S.answered[inst.ex.id] = true;
    delete S.skipped[inst.ex.id];
    renderEx();
  }
  function showFeedback(inst, res, silent) {

    var eff = (res.base == null) ? res.credit : res.base;
    var cls = eff >= 0.999 ? 'ok' : (eff > 0 ? 'part' : 'bad');
    var lbl = eff >= 0.999 ? '\u2713 CORRECT' : (eff > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
    var f = el('div', 'fbk ' + cls);
    var hh = el('div', 'fbk-h');
    hh.innerHTML = esc(lbl) + ' <span class="credit">credit ' + (Math.round(res.credit * 100) / 100).toFixed(2) + '</span>' +
      (res.danger && res.danger.length ? ' <span class="badge bad">\u2717 DANGEROUS \u2014 NEAR MISS</span>' : '');
    f.appendChild(hh);
    var multi = ['multi', 'match', 'dnd', 'fill', 'order', 'terminal', 'branch'].indexOf(ex.type) !== -1;
    if (multi && res.rows.length) {
      var ul = el('ul', 'items');
      res.rows.forEach(function (r) {
        var li = el('li');
        var vmap = { ok: '\u2713 Correct', bad: '\u2717 Wrong', miss: '\u25CB Missed', danger: '\u2717 Dangerous' };
        li.innerHTML = '<span class="v ' + r.v + '">' + vmap[r.v] + '</span><span><b>' + r.t + '</b>' +
          (r.why ? ' \u2014 ' + esc(r.why) : '') + '</span>';
        ul.appendChild(li);
      });
      f.appendChild(ul);
    } else if (ex.type === 'qcm') {
      var ci = ex.correct[0];
      var p = el('p', 'why');
      p.innerHTML = 'Correct answer: <b>' + esc(ex.options[ci].t) + '</b>';
      f.appendChild(p);
    }
    var why = el('p', 'why'); why.innerHTML = esc(res.explain || ex.explain || '');
    f.appendChild(why);
    if (res.canonical) {
      var cb = el('div');
      cb.innerHTML = '<div class="sec-note">Canonical command (copyable):</div><pre class="code">' + esc(res.canonical) + '</pre>';
      f.appendChild(cb);
      var T = ex.term;
      var ul2 = el('ul', 'items');
      T.elements.forEach(function (e2) {
        var li = el('li');
        li.innerHTML = '<span class="v miss">\u25B8 Part</span><span>' + esc(e2.desc) + (e2.why ? ' \u2014 ' + esc(e2.why) : '') + '</span>';
        ul2.appendChild(li);
      });
      f.appendChild(ul2);
    }
    if (eff < 0.999 && ex.study) {
      var st = el('div', 'study');
      st.innerHTML = '<span class="h">What to study:</span> ' + esc(ex.study);
      f.appendChild(st);
    }
    holder.appendChild(f);
    var bn = document.getElementById('btnNext');
    bn.style.display = 'inline-flex';
    bn.textContent = (S.pos === S.order.length - 1 && !S.reviewReturn)
      ? ((skippedOpen() > 0) ? 'Final Submit \u2192 review skipped' : 'Final Submit \u2192 results')
      : 'Next \u2192';
    var bc = document.getElementById('btnCheck');
    bc.disabled = true;
    renderHdr();
    if (!silent) {
      try { f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
    }
  }

  /* override: attach explain after grade (kept simple) */
  var _grade = grade;
  grade = function (inst) {
    var r = _grade(inst);
    r.explain = inst.ex.explain;
    return r;
  };

  function onNext() {
    var inst = curInst();
    if (!inst || !inst.graded) return;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) {
      S.pos++; setT('RUNNING'); renderEx();
      window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    } else {
      if (skippedOpen() > 0 && S.remain > 0) { showReview(); }
      else { showResults(); }
    }
  }
  function onSkip() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    S.skipped[inst.ex.id] = true;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) { S.pos++; renderEx(); }
    else if (skippedOpen() > 0) { showReview(); }
    else { showResults(); }
    renderHdr();
  }
  function onHint() {
    var inst = curInst();
    if (!inst || inst.graded || S.hints[inst.ex.id]) return;
    S.hints[inst.ex.id] = true;
    var hb = document.getElementById('hintBox');
    document.getElementById('hintTxt').textContent = inst.ex.hint || '';
    hb.style.display = 'block';
    document.getElementById('btnHint').disabled = true;
  }
  function onPause() {
    if (S.tState === 'RUNNING' || S.tState === 'PAUSED_AUTO_CHECK') {
      S.manualFrom = S.tState;
      setT('PAUSED_MANUAL');
      var ov = document.getElementById('pauseOverlay');
      ov.style.display = 'flex';
    }
  }
  function onResume() {
    var ov = document.getElementById('pauseOverlay');
    ov.style.display = 'none';
    setT(S.manualFrom || 'RUNNING');
    S.manualFrom = null;
  }
  function finishTimeout() {
    stopClock();
    var inst = curInst();
    if (inst && !inst.graded && S.view === 'exam') S.skipped[inst.ex.id] = true;
    S.timeoutHit = true;
    showResults();
  }

  /* ---------------- review skipped ---------------- */
  function showReview() {
    S.view = 'review'; S.reviewReturn = false;
    document.getElementById('examView').style.display = 'none';
    document.getElementById('resultsView').style.display = 'none';
    var v = document.getElementById('reviewView');
    v.style.display = 'block';
    var h = '<div class="card"><h2>\u26A0 Review skipped exercises</h2>' +
      '<p class="sec-note">The timer is still running. You can answer a skipped exercise now, or final-submit and leave it out of the score.</p><ul class="revlist">';
    S.order.forEach(function (idx, pos) {
      var ex = EXS[idx];
      if (S.skipped[ex.id] && !S.answered[ex.id]) {
        h += '<li><span class="badge skip">\u26A0 Skipped</span><span class="t">' + esc(ex.title) + '</span>' +
          '<button class="btn amber" data-pos="' + pos + '">\u2192 Answer now</button></li>';
      }
    });
    h += '</ul><div class="exfoot">' +
      '<button class="btn primary" id="btnFinalGo">\u2713 Final submit anyway (' + skippedOpen() + ' excluded)</button></div></div>';
    v.innerHTML = h;
    v.querySelectorAll('button[data-pos]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.pos = parseInt(b.getAttribute('data-pos'), 10);
        S.reviewReturn = true; S.view = 'exam';
        v.style.display = 'none';
        document.getElementById('examView').style.display = 'block';
        setT('RUNNING'); renderEx();
      });
    });
    document.getElementById('btnFinalGo').addEventListener('click', showResults);
    setT('RUNNING');
    renderHdr();
  }

  /* ---------------- results ---------------- */
  function showResults() {
    if (S.tState !== 'ENDED') { setT('ENDED'); stopClock(); }
    S.view = 'results';
    document.getElementById('examView').style.display = 'none';
    document.getElementById('reviewView').style.display = 'none';
    var v = document.getElementById('resultsView');
    v.style.display = 'block';
    var full = 0, part = 0, bad = 0, skip = 0, partSum = 0;
    EXS.forEach(function (ex) {
      if (S.answered[ex.id]) {
        var b = (S.bases[ex.id] != null) ? S.bases[ex.id] : (S.credits[ex.id] || 0);
        var c = S.credits[ex.id] || 0;
        if (b >= 0.999) full++;
        else if (b > 0) { part++; partSum += c; }
        else bad++;
      } else { skip++; }
    });
    var answered = full + part + bad;
    var sum = 0; EXS.forEach(function (ex) { if (S.answered[ex.id]) sum += (S.credits[ex.id] || 0); });
    var percent = answered ? Math.round(sum / answered * 100) : 0;
    var pass = percent >= CFG.meta.passMark;
    var avg = part ? Math.round(partSum / part * 100) / 100 : 0;
    var h = '<div class="card"><h2>Results \u2014 ' + esc(CFG.meta.title) + '</h2>' +
      '<p class="score-line">Score <b>' + (Math.round(sum * 10) / 10).toFixed(1) + '</b> / ' + answered + ' answered \u2014 <b>' + percent + '%</b> (pass mark ' + CFG.meta.passMark + '%)</p>' +
      (S.timeoutHit ? '<p class="sec-note">\u23F1 Time ran out \u2014 unanswered exercises were excluded from the score.</p>' : '') +
      '<div class="statgrid">' +
      stat(full, '\u2713 Fully correct', 'ok') +
      stat(part, '\u2713 Partially correct' + (part ? ' \u00b7 avg ' + avg : ''), 'part') +
      stat(bad, '\u2717 Fully incorrect', 'bad') +
      stat(skip, '\u26A0 Skipped \u2014 excluded', 'skip') +
      '</div>';
    h += '<p class="sec-note">\u23F8 Time paused manually: ' + fmtTime(S.pauseManualMs / 1000) +
      ' \u00b7 \u23F8 Time reviewing feedback: ' + fmtTime(S.pauseAutoMs / 1000) + '</p>';
    if (pass) {
      h += '<div class="verdict pass"><div class="big">\u2713 PASS</div>' +
        '<p>Certificate-style result: you reached ' + percent + '%, above the ' + CFG.meta.passMark + '% pass mark. Well done \u2014 you can now take the next severity file for ' + esc(CFG.meta.topicId.toUpperCase()) + '.</p></div>';
      h += '<div class="exfoot"><button class="btn primary" id="btnRetake">\u21BA Retake exam (new shuffle)</button></div>';
    } else {
      h += '<div class="verdict fail"><div class="big">\u2717 FAIL</div>' +
        '<p>' + percent + '% is below the ' + CFG.meta.passMark + '% pass mark. You must retake this exam. Study the "What to study" hints, then try again \u2014 the questions and answers will be shuffled.</p></div>';
      h += '<div class="exfoot"><button class="btn primary big" id="btnRetake">\u21BA Retake exam</button></div>';
    }
    h += '</div>';
    v.innerHTML = h;
    document.getElementById('btnRetake').addEventListener('click', startExam);
    renderHdr();
    reportScore(sum, answered, percent, pass);
  }
  function stat(n, l, cls) {
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function reportScore(sum, answered, percent, pass) {
    if (S.reported) return;
    S.reported = true;
    if (window.parent === window && location.protocol === 'file:') {
      /* Opened directly from disk: parent is this page itself, nothing to report to. */
      return;
    }
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.meta.topicId,
        batch: CFG.meta.batch,
        score: Math.round(sum),
        total: answered,
        percent: percent,
        passed: percent >= CFG.meta.passMark
      }, location.origin);
    } catch (e) { /* opened directly \u2014 nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.user = event.data.username || null;
    /* theme field is always 'dark'; the file is dark-only by contract, nothing to switch */
  });

  /* ---------------- wire up ---------------- */
  function boot() {
    renderIntro();
    document.getElementById('btnSkip').addEventListener('click', onSkip);
    document.getElementById('btnHint').addEventListener('click', onHint);
    document.getElementById('btnPause').addEventListener('click', onPause);
    document.getElementById('btnResume').addEventListener('click', onResume);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
