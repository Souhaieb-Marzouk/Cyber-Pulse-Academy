window.EXAM.introHTML =
'<h2 style="font-size:19px;margin:20px 0 4px">What you will learn</h2>'+
'<p>This exam is about one MITRE ATT&amp;CK object: <b>T1595.002 \u2014 Vulnerability Scanning</b>. It is a <b>sub-technique</b>. A sub-technique is a child of a bigger technique. Its parent is <b>T1595 \u2014 Active Scanning</b>. Both belong to the <b>Reconnaissance</b> tactic (TA0043). "Reconnaissance" means "collecting information before an attack".</p>'+
'<p><b>What the technique means.</b> Imagine a thief who walks around a building before breaking in. The thief looks for an open window. Vulnerability scanning is the digital version of this. The attacker sends probes to your systems. Each probe asks: "Which software do you run? Which version? Does it have a known weakness (a CVE)?" The attacker uses the answers to pick the easiest way in. ATT&amp;CK places this technique on the <b>PRE</b> platform. That means the scan runs on the attacker\u2019s own machines, not on yours. The attacker needs <b>no account and no permission</b> on your systems. That is why this behaviour happens <b>before</b> any break-in attempt (Initial Access, TA0001).</p>'+
'<p><b>Where you meet it at work.</b> Almost every security role touches this technique:</p>'+
'<ul>'+
'<li><b>SOC analyst</b> \u2014 you triage firewall and IDS alerts. You decide: hostile scan, our own scanner, or a harmless monitor?</li>'+
'<li><b>Threat hunter</b> \u2014 you hunt quiet, slow scans that the alerts missed.</li>'+
'<li><b>Incident responder</b> \u2014 you check whether scanning happened before a breach, and from where.</li>'+
'<li><b>CTI analyst</b> \u2014 you write short intel reports about scanning waves, for example the Log4Shell wave in December 2021.</li>'+
'<li><b>Detection engineer</b> \u2014 you build analytics that catch scan patterns: many ports in a short time, or probe strings like Nessus plugin checks and Nmap NSE scripts.</li>'+
'<li><b>Red teamer / penetration tester</b> \u2014 you run authorised scans. You must respect scope, or you break the law and the rules of engagement.</li>'+
'<li><b>Vulnerability manager / GRC analyst</b> \u2014 you run the same technique <i>for</i> the company (weekly scans; CIS Control 7; ISO/IEC 27001 A.8.8; NIST CSF "Identify"), so you find weak spots before attackers do.</li>'+
'<li><b>Control owner</b> \u2014 you patch software and reduce exposed services, so scans find nothing useful.</li>'+
'</ul>'+
'<p><b>Common tools on both sides:</b> Nmap (with its NSE scripting engine), Nessus, OpenVAS / Greenbone, Qualys, Rapid7 Nexpose, masscan, ZMap, Nikto, WPScan and Burp Suite. Passive services such as Shodan and Censys list exposed systems <i>without touching them</i> \u2014 useful to know, because they are NOT active scanning.</p>'+
'<p><b>Why it matters.</b> A scan is often the first footprint of an attack. Scans of weak VPNs and file-transfer servers came before many ransomware cases. If you can see the scan, you can act before the break-in. But scans are also normal noise: your own scans, uptime monitors and web crawlers all look similar. That is what makes this technique hard: it is common, legal in the right hands, and harmful in the wrong hands.</p>'+
'<p><b>Defence in one sentence:</b> you cannot stop someone from scanning you, so reduce what they can find \u2014 fewer exposed services (communication reduction, M0802-style), fast patching, and good analytics that spot the scan early.</p>';

 e=e.replace(/\b(GET|POST|CONNECT|HEAD|PUT) /g,'<span class="a">$1 </span>');

function makeDrag(node,onDrop){
 node.addEventListener('pointerdown',function(ev){
  if(ev.button!==undefined&&ev.button!==0)return;
  var rect=node.getBoundingClientRect();
  var ghost=node.cloneNode(true);ghost.className+=' ghost';
  ghost.style.width=rect.width+'px';document.body.appendChild(ghost);
  var gx=ev.clientX-rect.left,gy=ev.clientY-rect.top;
  moveGhost(ev);
  node.classList.add('dragging');
  var lastSl=null;
  function moveGhost(e){ghost.style.left=(e.clientX-gx)+'px';ghost.style.top=(e.clientY-gy)+'px';
   var t=document.elementFromPoint(e.clientX,e.clientY);
   var sl=t?t.closest('.slot,.bank,.blank'):null;
   if(lastSl&&lastSl!==sl)lastSl.classList.remove('over');
   if(sl){sl.classList.add('over');lastSl=sl}}
  function mv(e){moveGhost(e);e.preventDefault()}
  function up(e){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
   ghost.remove();node.classList.remove('dragging');
   if(lastSl)lastSl.classList.remove('over');
   var t=document.elementFromPoint(e.clientX,e.clientY);
   var sl=t?t.closest('.slot,.bank,.blank'):null;
   if(sl)onDrop(sl)}
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
  ev.preventDefault();
 });
}

 h+='</div><div class="tl"><span class="pl">'+esc(ex.prompt)+'</span><input id="cm-tin" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div></div>';
 if(ex.expectedShape)h+='<div class="synpanel"><b>Expected output looks like:</b><br><span class="mono">'+esc(ex.expectedShape)+'</span></div>';
 h+='<p class="termnote">Type the command and press Enter. Press Check when you are done. Nothing real is executed \u2014 this is a simulation.</p>';
 return h;
}
function bindTerm(r){
 var ex=r.ex.terminal,scr=document.getElementById('cm-scr'),tin=document.getElementById('cm-tin');
 function addLine(s){scr.textContent+=s+'\n';scr.scrollTop=scr.scrollHeight}
 function cmdMatches(v){var c=ncmd(v);try{
  return ex.elements.every(function(ee){return ee.all?ee.all.every(function(rx){return new RegExp(rx).test(c)}):new RegExp(ee.re).test(c)})
 }catch(e){return false}}
 tin.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
   var v=tin.value;tin.value='';
   addLine(ex.prompt+v);
   if(v.trim()!==''){
    var t0=ncmd(v).split(' ')[0];
    if(ex.tools&&ex.tools.indexOf(t0)<0)addLine('bash: '+t0+': command not found (available here: '+ex.tools.join(', ')+')');
    else if(cmdMatches(v)&&ex.out&&ex.out.length){addLine('');ex.out.forEach(function(l){addLine(l)});addLine('')}
    else addLine('(no output captured \u2014 the command ran, but it does not match what this exercise asked for)');
    r.last=v;
   }
  }});
 setTimeout(function(){tin.focus()},50);
}
function logHTML(r){
 var ex=r.ex;
 var h='<div class="logbar"><label for="cm-fil" class="sr">Filter logs</label><input id="cm-fil" placeholder="Filter (e.g. an IP or a word)\u2026" value="'+esc(S.filter)+'"><span class="cnt" id="cm-lc"></span></div>';
 h+='<pre class="log" id="cm-log"></pre>';
 h+='<p class="termnote">'+(ex.lognote||'')+'</p>';
 h+='<label for="cm-lin" class="sr">Your answer</label><input id="cm-lin" class="ansin" placeholder="'+esc(ex.ans.ph||'Type your answer\u2026')+'" value="'+esc(r.ans)+'">';
 return h;
}
function bindLog(r){
 var w=document.getElementById('cm-ans');
 function paintLog(){
  var f=nword(S.filter),ex=r.ex,lines=[],i;
  for(i=0;i<ex.logs.length;i++){
   if(f===''||nword(ex.logs[i]).indexOf(f)>=0)lines.push(ex.logs[i])}
  document.getElementById('cm-log').innerHTML=lines.map(colorize).join('\n')||'(no lines match the filter)';
  document.getElementById('cm-lc').textContent=lines.length+' / '+ex.logs.length+' lines shown';
 }
 paintLog();
 document.getElementById('cm-fil').oninput=function(e){S.filter=e.target.value;paintLog()};
 document.getElementById('cm-lin').oninput=function(e){r.ans=e.target.value};
}
function simHTML(r){
 var h='',L=['A','B','C','D','E'];
 r.ex.alerts.forEach(function(a,i){
  h+='<div class="alertcard"><div class="ah">'+(i+1)+'. '+a.t+'</div><div class="am">'+a.meta+'</div>';
  h+='<label class="sr" for="cm-sim'+i+'">Decision for alert '+(i+1)+'</label><select id="cm-sim'+i+'" data-i="'+i+'"><option value="">\u2014 choose a decision \u2014</option>';
  r.opts[i].forEach(function(o,oi){h+='<option value="'+oi+'">'+L[oi]+'. '+o.t+'</option>'});
  h+='</select></div>'});
 return h;
}
function bindSim(r){
 r.ex.alerts.forEach(function(a,i){
  var s=document.getElementById('cm-sim'+i);
  if(r.sel[i]!==undefined)s.value=r.sel[i];
  s.onchange=function(){r.sel[i]=s.value===''?undefined:parseInt(s.value,10)}});
}
function branchHTML(r){
 var ex=r.ex,i=r.step,st=ex.steps[i];
 document.getElementById('cm-stepbar').textContent='Step '+(i+1)+' of '+ex.steps.length;
 var h='<p class="qtxt" style="font-size:16px">'+st.q+'</p>',L=['A','B','C','D'];
 r.stepOpts[i].forEach(function(o,oi){
  h+='<button type="button" class="opt'+(r.stepSel===oi?' sel':'')+'" data-i="'+oi+'" aria-pressed="'+(r.stepSel===oi)+'"><span class="k">'+L[oi]+'.</span><span>'+o.t+'</span></button>'});
 h+='<div class="foot"><button class="btn pri" id="cm-conf">'+(i===ex.steps.length-1?'\u2713 Check (final step)':'Confirm step \u2192')+'</button></div>';
 return h;
}
function bindBranch(r){
 var w=document.getElementById('cm-ans');
 w.querySelectorAll('.opt').forEach(function(b){
  b.onclick=function(){if(!answerEnabled())return;
   r.stepSel=parseInt(b.getAttribute('data-i'),10);
   w.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel')});
   b.classList.add('sel')}});
 document.getElementById('cm-conf').onclick=function(){
  if(!answerEnabled())return;
  if(r.stepSel===null){warnChoose();return};
  r.ans[r.step]=r.stepSel;r.stepSel=null;
  if(r.step<r.ex.steps.length-1){r.step++;renderAnswer()}
  else{onCheck()}};
}
function lockAnswer(){
 var w=document.getElementById('cm-ans');
 w.querySelectorAll('button,optgroup,select,input').forEach(function(x){x.disabled=true;x.style.cursor='default'});
}
/* ---------- recommended per-exercise timer ---------- */
function startRec(r){
 stopRec();S.recWarned=false;
 if(!r.ex.rec)return;
 S.recLeft=r.ex.rec;paintRec();
 r.recInt=setInterval(function(){
  if(T.st==='RUNNING'&&!r.checked){S.recLeft--;paintRec();
   if(S.recLeft<=0&&!S.recWarned){S.recWarned=true;
    var b=document.getElementById('cm-rec');
    if(b){b.classList.add('late');b.textContent='\u23f1 Recommended time is up \u2014 you may still answer, with no penalty.'}}}
 },1000);
}
function paintRec(){var b=document.getElementById('cm-rec');
 if(b)b.textContent='\u23f1 Recommended time for this exercise: '+fmtT(S.recLeft*1000)+' (no penalty if it runs out)'}
function stopRec(){if(cur&&cur.recInt)clearInterval(cur.recInt)}
/* ---------- check / next / skip / hint / pause ---------- */
function onCheck(){
 var r=cur;if(!r||r.checked||S.view!=='exam')return;
 if(T.st!=='RUNNING')return;
 if(!answerGiven(r)){warnChoose();return}
 setT('PAUSED_AUTO_CHECK');S.pauseStart=Date.now();
 holdTimer();
 r.checked=true;S.checked=true;
 var res=grade(r);
 var pen=r.hint?0.10:0;
 r.raw=res.credit;
 r.credit=Math.max(0,res.credit-pen);
 if(r.hint)S.hintUsedGlobal++;
 S.scoreSum+=r.credit;S.answered++;
 res.credit=r.credit;
 renderFeedback(r,res);
 lockAnswer();paintFoot();paintHeader();paintScore();
 stopRec();
}
function answerGiven(r){
 var t=r.ex.type;
 if(t==='qcm'||t==='multi'||t==='clickpick')return r.sel.length>0;
 if(t==='match')return Object.keys(r.place).length>0;
 if(t==='order')return true;
 if(t==='fill')return Object.keys(r.slot).length>0;
 if(t==='terminal')return r.last!=='';
 if(t==='logview')return r.ans!=='';
 if(t==='sim')return r.sel.some(function(x){return x!==undefined});
 if(t==='branch')return r.ans.length===r.ex.steps.length;
 return true;
}
function warnChoose(){
 var w=document.getElementById('cm-fb');
 w.innerHTML='<div class="errbox">\u26a0 Choose an answer first, then press Check.</div>';
}
function renderFeedback(r,res){
 var fb=document.getElementById('cm-fb');
 var cls=res.credit>=0.999?'ok':(res.credit>0?'part':'bad');
 var label=res.credit>=0.999?'\u2713 CORRECT':(res.credit>0?'\u2713 PARTIALLY CORRECT':'\u2717 INCORRECT');
 var h='<div class="fbk '+cls+'" role="status" aria-live="polite">';
 h+='<div class="fb-h">'+label+'</div>';
 if(res.N>1)h+='<div class="fb-cred">Credit '+res.credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' items right'+(res.W>0?', '+res.W+' wrong':'')+(r.hint?', \u22120.10 hint penalty applied':'')+'</div>';
 else if(r.hint)h+='<div class="fb-cred">\u22120.10 hint penalty applied.</div>';
 if(res.items.length){
  h+='<ul class="fb-items">';
  res.items.forEach(function(it){h+='<li><span class="fb-ic">'+it.ic+'</span><b>'+it.w+'</b> \u2014 '+it.t+'</li>'});
  h+='</ul>';
 }
 h+='<div class="fb-exp">'+r.ex.explain+(r.ex.rb||'')+'</div>';
 if(r.ex.type==='terminal'){
  var t=r.ex.terminal;
  h+='<div style="margin-top:10px"><b>Canonical command:</b><pre class="canon" id="cm-canon">'+esc(t.canonical)+'</pre><button class="btn" id="cm-copy">\u29c9 Copy command</button></div>';
  h+='<div class="fb-exp"><b>Element by element:</b><ul>'+t.elements.map(function(ee){return '<li><span class="mono">'+esc(ee.n)+'</span></li>'}).join('')+'</ul></div>';
  h+='<div><b>Realistic output:</b><pre class="log">'+t.out.map(esc).join('\n')+'</pre></div>';
 }
 if(res.credit<1&&r.ex.study)h+='<div class="fb-study"><b>\ud83d\udcd6 What to study:</b> '+r.ex.study+'</div>';
 h+='</div>';
 fb.innerHTML=h;
 var cb=document.getElementById('cm-copy');
 if(cb)cb.onclick=function(){
  var txt=document.getElementById('cm-canon').textContent;
  try{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();cb.textContent='\u2713 Copied'}
  catch(e){cb.textContent='Select and copy manually'}
  setTimeout(function(){cb.textContent='\u29c9 Copy command'},1500)};
}
function onNext(){
 var r=cur;if(!r||!r.checked)return;
 S.autoMs+=Date.now()-S.pauseStart;
 releaseTimer();setT('RUNNING');
 if(S.fromReview){S.fromReview=false;show('review');return}
 if(S.idx>=list.length-1){
  if(pendingSkips()>0)show('review');else finishExam(false);
 }else{S.idx++;renderEx()}
}
function pendingSkips(){var n=0;list.forEach(function(r){if(r.skipped&&!r.checked)n++});return n}
function onSkip(){
 var r=cur;if(!r||r.checked)return;
 r.skipped=true;
 if(S.fromReview){S.fromReview=false;show('review');return}
 if(S.idx>=list.length-1){if(pendingSkips()>0)show('review');else finishExam(false)}
 else{S.idx++;renderEx()}
}
function onHint(){
 var r=cur;if(!r||r.checked||r.hint)return;
 r.hint=true;
 var w=document.getElementById('cm-fb');
 w.innerHTML='<div class="hintbox"><b>\ud83d\udca1 Hint (costs \u221210% of this exercise):</b> '+r.ex.hint+'</div>';
 paintHeader();
}
function onPause(){
 if(T.st==='RUNNING'){holdTimer();S.pausedFrom='RUNNING';S.pauseStart=Date.now();setT('PAUSED_MANUAL');showOverlay()}
 else if(T.st==='PAUSED_AUTO_CHECK'){S.autoMs+=Date.now()-S.pauseStart;holdTimer();S.pausedFrom='PAUSED_AUTO_CHECK';S.pauseStart=Date.now();setT('PAUSED_MANUAL');showOverlay()}
}
function showOverlay(){
 var d=el('div','overlay');d.id='cm-manual';
 d.innerHTML='<div class="ovcard"><div style="font-size:40px">\u23f8</div><h2 style="margin:8px 0">Paused \u2014 manual break</h2>'
 +'<p>The timer is stopped and the exercise is hidden.</p>'
 +'<button class="btn pri" id="cm-resume">\u25b6 Resume</button></div>';
 document.body.appendChild(d);
 document.getElementById('cm-resume').onclick=function(){
  d.remove();
  S.manualMs+=Date.now()-S.pauseStart;S.pauseStart=Date.now();
  if(S.pausedFrom==='PAUSED_AUTO_CHECK'){setT('PAUSED_AUTO_CHECK')}
  else{releaseTimer();setT('RUNNING')}
  paintHeader();
 };
}
/* ---------- review & results ---------- */
function vReview(){
 var h='<div class="panel"><h1 class="h1">Review skipped exercises</h1>'
 +'<p>You skipped '+pendingSkips()+' exercise(s). You can go back to any of them and answer it while the timer is still running. When you are done, press Final Submit \u2014 anything you leave unanswered will be excluded from your score.</p>';
 list.forEach(function(r,i){if(r.skipped&&!r.checked){
  h+='<div class="revitem"><div><div class="rt">'+(i+1)+'. '+r.ex.title+'</div><div class="rs">'+esc(r.ex.summary)+'</div></div>'
  +'<button class="btn" data-ret="'+i+'">\u2190 Return to it</button></div>'}});
 h+='<div class="foot"><button class="btn grn" id="cm-final">\u25b6 Final Submit</button></div></div>';
 var vw=document.getElementById('cm-view');vw.innerHTML=h;
 vw.querySelectorAll('[data-ret]').forEach(function(b){b.onclick=function(){
  S.idx=parseInt(b.getAttribute('data-ret'),10);S.fromReview=true;show('exam');renderEx()}});
 document.getElementById('cm-final').onclick=function(){finishExam(false)};
}
function vResults(){
 var full=0,part=0,zero=0,skipn=0,partSum=0,i;
 list.forEach(function(r){
  if(r.checked){if(r.credit>=0.999)full++;else if(r.credit>0){part++;partSum+=r.credit}else zero++}
  else if(r.skipped)skipn++;
 });
 var pct=S.answered>0?Math.round(S.scoreSum/S.answered*100):0;
 var passed=pct>=70;
 var avg=part>0?(partSum/part):0;
 var h='<div class="panel">';
 h+='<h1 class="h1">Results \u2014 T1595.002 ('+E.severity.label+')</h1>';
 if(passed){
  h+='<div class="passtile"><div style="font-size:44px">\ud83c\udfc6</div><div class="big">PASS \u2014 '+pct+'%</div>'
  +'<div style="margin-top:6px">Certified pass: <b>T1595.002 Vulnerability Scanning \u2014 '+E.severity.label+'</b></div></div>';
 }else{
  h+='<div class="failtile"><div style="font-size:38px">\u2717</div><div class="big" style="color:#e98886">FAIL \u2014 '+pct+'%</div>'
  +'<div style="margin-top:6px">You need 70% to pass. Review the feedback and retake the exam \u2014 questions and options will be shuffled.</div></div>';
 }
 h+='<p style="text-align:center;font-size:18px">Score: <b>'+S.scoreSum.toFixed(1)+'</b> over <b>'+S.answered+'</b> answered exercise(s) \u2192 <b>'+pct+'%</b></p>';
 h+='<div class="resgrid">'
 +'<div class="rescard"><div class="num">'+full+'</div><div class="lbl">\u2713 Fully correct</div></div>'
 +'<div class="rescard"><div class="num">'+part+'</div><div class="lbl">\u25d1 Partially correct'+(part>0?' \u2014 avg '+avg.toFixed(2):'')+'</div></div>'
 +'<div class="rescard"><div class="num">'+zero+'</div><div class="lbl">\u2717 Fully incorrect</div></div>'
 +'<div class="rescard"><div class="num">'+skipn+'</div><div class="lbl">\u26a0 Skipped, never answered (excluded)</div></div>'
 +'</div>';
 h+='<div class="mech"><b>How your time was used</b><ul>'
 +'<li>Time paused \u2014 manual: <b class="pause-manualSec">'+fmtMin(S.manualMs)+'</b> \u00b7 reviewing feedback: <b class="pause-autoSec">'+fmtMin(S.autoMs)+'</b></li>'
 +'<li>Hints used: <b>'+S.hintUsedGlobal+'</b></li>'
 +'</ul></div>';
 h+='<div class="foot"><button class="btn pri" id="cm-retake">\u21ba Retake Exam</button></div>';
 h+='</div>';
 document.getElementById('cm-view').innerHTML=h;
 document.getElementById('cm-retake').onclick=function(){startExam()};
 if(!S.reported){S.reported=true;reportScore()}
}
function finishExam(timeout){
 stopRec();
 if(T.int){clearInterval(T.int);T.int=null}
 setT('ENDED');
 show('results');
}
function reportScore(){
 var ac=S.answered,percent=ac>0?Math.round((S.scoreSum/ac)*100):0,cs=Math.round(S.scoreSum);
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:E.meta.topicId,batch:E.meta.batch,score:cs,total:ac,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly \u2014 nothing to report to */}
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(ev){
 var d=ev.data;if(!d)return;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 if(d.username&&!S.greet){S.greet=d.username;var g=document.querySelector('.sub');if(g)g.innerHTML=g.innerHTML+' \u00b7 Welcome, <b>'+esc(d.username)+'</b>'}
});
/* ---------- boot ---------- */
function boot(){
 app=document.getElementById('cm-app');
 show('intro');
}
window.CM={start:startExam,check:onCheck,next:onNext,skip:onSkip,hint:onHint,pause:onPause,finish:finishExam,
 get state(){return{T:T.st,idx:S.idx,scoreSum:S.scoreSum,answered:S.answered}},get list(){return list}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

</script>
</body>
</html>
