<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.007 Cloud Services — MEDIUM</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,8,13,.97);display:flex;align-items:center;justify-content:center;padding:20px}
.ovpanel{max-width:420px;width:100%;text-align:center;background:var(--bg-panel);border:1px solid var(--amber);border-radius:16px;padding:34px 28px}
.ovpanel .ic{font-size:40px;display:block;margin-bottom:10px}
.ovpanel h2{margin:0 0 8px;color:var(--amber);letter-spacing:.08em}
.ovpanel p{color:var(--ink-dim);margin:0 0 20px}
.hidden{display:none!important}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--green);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 6px 30px rgba(0,0,0,.5)}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .main{padding:14px 10px 30px}
  .mgrid{grid-template-columns:1fr}
  .topbar{gap:8px;padding:8px 10px}
  .tb-title{display:none}
  .intro-head{padding:18px 16px 16px}
  .intro-head h1{font-size:21px}
  .res-head{padding:18px}
  .term-out{max-height:260px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.007","attackName":"Cloud Services","objectType":"sub-technique","severity":"MEDIUM","topicId":"t1021.007","batch":2,"title":"T1021.007 Cloud Services — MEDIUM","difficulty":"medium","estimatedMinutes":35,"timerMinutes":35,"questionCount":16,"passMark":70,"learn":["T1021.007 is a sub-technique of T1021 Remote Services in the Lateral Movement tactic. It covers adversaries who log into cloud services with valid accounts — often on-premises identities synchronised or federated to the cloud — and then run commands or open sessions on other machines through the cloud control plane.","You will learn to read the two connected halves of the evidence: the control-plane audit, such as AWS CloudTrail events like StartSession and SendCommand and Azure Activity Log entries like runCommand/action, and the guest-side trace, such as the SSM Agent log and the Azure Run Command handler files.","You will see who uses this daily: SOC analysts triage cloud audit alerts, incident responders tie role assumption chains to real commands, threat hunters look for CLI user-agents at odd hours, and detection engineers turn those patterns into rules that survive automation.","Your tasks in this exam: name the API behind an event, trace who really acted through AssumeRole chains, correlate an audit event with the agent log on the instance, and separate one-shot Run Command from interactive sessions.","The risk grows with privilege: one compromised admin identity with broad ssm:* or VM contributor rights can pivot across a whole fleet quietly, because the control plane executes on the attacker's behalf. Public reporting on well-documented intrusions describes exactly this pattern with synchronised identities."],"keywords":[{"theme":"Cloud Audit Telemetry","items":["CloudTrail eventName SendCommand","CloudTrail eventName StartSession","Azure Activity Log runCommand/action","userIdentity, sourceIPAddress and user-agent fields","AssumeRole events preceding execution"]},{"theme":"Attribution & Correlation","items":["AssumeRole chains between principals","federated or synchronised on-prem identities","CLI user-agent versus console login","correlating CloudTrail with the SSM Agent log","one-shot SendCommand versus interactive StartSession"]},{"theme":"Analyst Workflow","items":["aws cloudtrail lookup-events","az monitor activity-log list","session transcripts delivered to S3","baseline of normal admin hours","scoping who ran what on which target"]}]}</script>

theme":"Attribution & Correlation","items":["AssumeRole chains between principals","federated or synchronised on-prem identities","CLI user-agent versus console login","correlating CloudTrail with the SSM Agent log","one-shot SendCommand versus interactive StartSession"]},{"theme":"Analyst Workflow","items":["aws cloudtrail lookup-events","az monitor activity-log list","session transcripts delivered to S3","baseline of normal admin hours","scoping who ran what on which target"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Name that API call","summary":"Which CloudTrail event proves Run Command ran?","scenario":"The night shift hands over a CloudTrail extract: one identity, 40 instance targets, a shell document, 02:40 UTC. The handover note just says 'commands were run'. For the report you must name the exact API event that proves a Run Command execution took place, because feature names and API names differ.","question":"Which CloudTrail eventName proves that a Run Command execution happened?","hint":"The event name is the API call, not the feature name.","explanation":"The Run Command feature calls the SendCommand API, so CloudTrail records eventName SendCommand. StartSession opens interactive shells, ExecuteCommand and PutCommand are not the API names for this feature, and GetCommandInvocation only reads the result of a send.\n\nFeature name and API name differ — always quote the API name in reports.","study":"Study the mapping from SSM features to API names: Run Command sends SendCommand.","options":["ExecuteCommand","PutCommand","SendCommand","StartSession"],"correct":2},{"id":"e02","type":"match","title":"Event name to meaning","summary":"Assign each CloudTrail event its real-world meaning.","scenario":"You are labelling a printed CloudTrail extract for the incident binder. Five event names appear in the window that matters for the case. Each label below describes what the event actually did — the binder needs the right pairs before the 09:00 review with the account owner and the platform lead.","question":"Assign each CloudTrail event name to its meaning:","hint":"Two events touch instances directly; two change or assume identity; one edits tooling.","explanation":"StartSession opened an interactive shell, SendCommand pushed a one-shot document to instances, AssumeRole switched a principal into a new role, RunInstances created a machine, and UpdateSSMDocument edited the tooling that commands run through.\n\nA binder with correct pairs lets the next reader rebuild the story without re-querying.","study":"Study the small dictionary of SSM and IAM event names before your next cloud case.","pairs":[{"left":"StartSession","right":"Session Manager opened an interactive shell"},{"left":"SendCommand","right":"A one-shot document ran on target instances"},{"left":"AssumeRole","right":"A principal switched into another IAM role"},{"left":"RunInstances","right":"A new EC2 instance was created"},{"left":"UpdateSSMDocument","right":"The content of an SSM document changed"}]},{"id":"e03","type":"logview","title":"Read the 00:14 window","summary":"Find who really pushed the commands.","scenario":"Meridian Freight's audit extract for one hour is loaded in the panel. The SOC suspects commands were pushed to the fleet just after midnight. Two identities appear, and one of them acts only through a role. Filter the lines, then answer the question about the acting principal in the task below.","question":"Which principal executed the SendCommand push in this extract?","hint":"Follow the AssumeRole line first; the actor field changes after it.","explanation":"adm.ito only assumed the role; the SendCommand lines carry principal ops-ssm-runner, the assumed role created at 00:12:47. ci-deploy only ran DescribeInstances, and the extract contains no command run without an assumption in front of it.\n\nTwo connected ideas here: identity switch and command execution. In reports, name both the origin identity and the acting role.","study":"Study reading AssumeRole chains: origin identity, assumed role, then the action.","filterable":true,"log":{"header":["time","event","detail"],"lines":["2026-04-18T00:02:11Z GetUser principal=adm.ito agent=console src=198[.]51[.]100[.]24","2026-04-18T00:12:47Z AssumeRole principal=adm.ito role=ops-ssm-runner src=198[.]51[.]100[.]24","2026-04-18T00:13:05Z ListCommands principal=ops-ssm-runner agent=aws-cli/2.15 src=198[.]51[.]100[.]24","2026-04-18T00:14:32Z SendCommand document=AWS-RunShellScript targets=12 principal=ops-ssm-runner agent=aws-cli/2.15","2026-04-18T00:19:08Z StartSession target=i-0d41e7b29ac31f806 principal=ops-ssm-runner agent=aws-cli/2.15","2026-04-18T01:02:15Z DescribeInstances principal=ci-deploy agent=aws-cli/2.15 src=10[.]42[.]0[.]9","2026-04-18T01:05:41Z GetCallerIdentity principal=ci-deploy agent=aws-cli/2.15 src=10[.]42[.]0[.]9","2026-04-18T01:31:29Z TerminateSession target=i-0d41e7b29ac31f806 principal=ops-ssm-runner agent=aws-cli/2.15"]},"widget":{"type":"mcq","question":"Which principal executed the SendCommand push in this extract?","options":["adm.ito acting directly","ci-deploy from the build network","ops-ssm-runner assumed by adm.ito","No SendCommand appears in the extract"],"correct":2}},{"id":"e04","type":"order","title":"Triage the 02:40 push","summary":"Order the five triage moves for a fleet-wide SendCommand.","scenario":"The alert says one role pushed AWS-RunShellScript to 40 instances at 02:40 UTC. The lead wants a clean triage trail in the ticket: verify the actor first, then the chain, then the payload targets, then the guests, and only then compare the whole pattern with the history of the same role.","question":"Arrange the five triage moves in the correct order:","hint":"You cannot trace a chain you have not confirmed, and history comes last.","explanation":"Confirm the source address and user-agent of the SendCommand event, then trace the AssumeRole chain that produced the acting role, then pull the target list and document name, then check each target's agent log for what executed, and only then compare the pattern with past admin runs.\n\nEach step feeds the next; comparing history first biases the whole case.","study":"Study the triage order for cloud command alerts: verify, trace, scope, guest-check, baseline.","items":["Confirm source address and user-agent on the SendCommand event","Trace the AssumeRole chain that produced the acting role","Pull the target list and document name from the event","Check each target's agent log for what actually executed","Compare the pattern with past runs by the same role"]},{"id":"e05","type":"fill","title":"Two homes of session evidence","summary":"Name where transcripts and control-plane events land.","scenario":"A reviewer asks whether the team can replay what an operator typed in Session Manager. The honest answer depends on two homes: the preferences-driven transcript bucket, and the audit trail that always records the session even when transcripts are off. Complete the note with those two homes, spelled exactly.","question":"Complete the note with the two missing terms:","hint":"One is an S3 noun; the other is the audit service you already know.","explanation":"Session Manager writes shell transcripts to an S3 bucket when the preferences document says so, while the StartSession control-plane event lands in CloudTrail regardless. Without the preferences, CloudTrail shows who connected when — but never what was typed.\n\nThat gap is exactly why defenders turn transcripts on before an incident, not after.","study":"Study the SSM-SessionManagerRunShell preferences and their S3 and CloudWatch targets.","text":"A Session Manager shell writes its transcript to an S3 ___ when preferences allow, and every control-plane session event still lands in ___ first.","blanks":["bucket","CloudTrail"],"bank":["bucket","CloudTrail","table","KMS","queue","console"]},{"id":"e06","type":"terminal","title":"Pull the SendCommand events","summary":"Use the CloudTrail CLI to fetch one event type.","scenario":"The console search is slow, so you fall back to the CLI. Meridian Freight's trail is healthy and you need every SendCommand event from the last window for the ticket. The simulator recognises the lab toolset only, and stopping or deleting the trail is out of the question while the case is open.","question":"Type the command that looks up SendCommand events in CloudTrail:","hint":"lookup-events takes a lookup attribute: key EventName, value SendCommand.","explanation":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand queries management events by name and prints the matching records. delete-trail or stop-logging would blind the whole account mid-incident — the one action that is never acceptable.\n\nRead-only lookups are the bread and butter of cloud triage.","study":"Study aws cloudtrail lookup-events attribute syntax for EventName and resource filters.","prompt":"analyst@soc-jump:~$","skill":"cloudtrail-triage","knownTools":["aws","jq","grep","column"],"expected":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand","elements":[{"label":"the CloudTrail lookup command","any":["aws cloudtrail lookup-events"]},{"label":"the lookup-attribute key","any":["AttributeKey=EventName"]},{"label":"the lookup-attribute value","any":["AttributeValue=SendCommand"]}],"forbidden":[{"any":["delete-trail","stop-logging"],"why":"Stopping or deleting the trail blinds every account mid-incident — evidence destruction."}],"output":["Events found: 3 (newest first)","2026-04-18T02:03:55Z SendCommand doc=AWS-RunShellScript targets=6 principal=ops-ssm-runner","2026-04-18T01:41:09Z SendCommand doc=AWS-RunPowerShellScript targets=1 principal=ops-ssm-runner","2026-04-18T00:14:32Z SendCommand doc=AWS-RunShellScript targets=12 principal=ops-ssm-runner"],"syntaxPanel":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=<Key>,AttributeValue=<Value>\n  lookup-events   query past management events\n  AttributeKey    field to filter on, e.g. EventName or ResourceName\n  example:        aws cloudtrail lookup-events --lookup-attributes AttributeKey=ResourceName,AttributeValue=i-0aa11bb22cc33dd44","sampleOutput":"Events found: 1 (newest first)\n2026-04-18T00:14:32Z SendCommand doc=AWS-RunShellScript targets=12"},{"id":"e07","type":"mcq","title":"The Azure twin","summary":"Name the Azure Activity Log operation for Run Command.","scenario":"Half the fleet runs on Azure. The alert forwarding rule for the Activity Log must include the exact operation name that proves Run Command executed on a virtual machine, so the SOC can route those events into the same channel as the AWS ones and read one coherent story across clouds.","question":"Which operation name proves Run Command executed on an Azure virtual machine?","hint":"Provider namespace, resource type, then the action verb.","explanation":"Microsoft.Compute/virtualMachines/runCommand/action is the exact operation recorded when the VM agent executes a Run Command job. The start and restart operations manage power state, and the Network namespace never carries a runCommand action — that string is a fabricated near-miss.\n\nOperation strings follow provider/type/action; learning the shape beats memorising every entry.","study":"Study Azure Activity Log operation strings for the Compute resource provider.","options":["Microsoft.Compute/virtualMachines/runCommand/action","Microsoft.Compute/virtualMachines/start/action","Microsoft.Compute/virtualMachines/restart/action","Microsoft.Compute/virtualMachineScaleSets/virtualMachines/runCommand/action"],"correct":0},{"id":"e08","type":"decision","title":"Fleet-wide push at 02:40","summary":"Verify, scope, then act — in that order.","scenario":"Alert: role ops-ssm-runner pushed AWS-RunShellScript to 40 instances at 02:40 UTC, source IP 198[.]51[.]100[.]24, user-agent aws-cli/2.15. The same role also pushed commands last Tuesday at 14:00 for a documented patch job. Work the three steps in order; each step locks when you confirm it.","question":"Work through the three decision steps and pick the best action at each:","hint":"One step is deliberately 'verify before you move' — the source may be the patch runner.","explanation":"Verification first: the same role ran a documented patch push last week, so the source and user-agent need confirming against that history before anyone calls it an incident. Scoping second: the document content and the 40 targets decide blast radius. Action last: if the run matches the patch calendar and prints expected output, the proportionate move is a ticketed note and a tighter alert threshold, not a fleet rebuild.\n\nTwo connected ideas drive the tree: baseline the actor, then size the payload before acting.","study":"Study alert handling for fleet automation: baseline, blast radius, proportionate action.","steps":[{"label":"STEP 1 OF 3 — verify the actor","prompt":"Event: SendCommand, role ops-ssm-runner, 02:40 UTC, source 198[.]51[.]100[.]24, agent aws-cli/2.15.","question":"What do you check first?","options":["Past SendCommand runs by this role: source, hours and documents","Isolate all 40 instances from the network at once","Close the alert because patch jobs are normal"],"correct":0,"why":"History for the same role gives the baseline in one query and avoids both panic and complacency."},{"label":"STEP 2 OF 3 — scope the payload","prompt":"History shows the role pushed the same document last Tuesday at 14:00 for patching.","question":"What decides the blast radius right now?","options":["The document name, its parameters and the 40 target IDs","The price of the instances involved","The on-call engineer's personal opinion"],"correct":0,"why":"Document plus targets is the payload; nothing else sizes the impact objectively."},{"label":"STEP 3 OF 3 — act","prompt":"The run matches the patch calendar and agent logs show the expected patch output.","question":"Which action fits the evidence?","options":["Revoke the role and rebuild all 40 instances tonight","Ticket the run, note the baseline match, tighten the alert threshold for 02:00 sends","Delete the CloudTrail events to reduce noise"],"correct":1,"why":"A matching baseline plus clean output means record and tune, not rebuild — and deleting audit events is never an option."}]},{"id":"e09","type":"match","title":"Telemetry source to what it shows","summary":"Assign each source to the truth it can prove.","scenario":"The incident review board asks exactly which source proves which fact. Four sources are in scope: the AWS control-plane trail, the Azure activity stream, the Google audit log, and the agent's own log inside the guest. Each proves one specific thing and nothing more, so the mapping must be exact.","question":"Assign each telemetry source to the fact it proves:","hint":"Only one source lives inside the guest.","explanation":"AWS CloudTrail proves control-plane calls such as StartSession and SendCommand with actor and source. Azure Activity Log proves runCommand/action with caller and machine. GCP Cloud Audit Logs prove OS Login key imports and instance sessions. The agent log inside the guest proves what actually executed there.\n\nEvery claim in a report needs the right source behind it.","study":"Study the four telemetry homes for cloud remote services before writing your next report.","pairs":[{"left":"AWS CloudTrail","right":"Control-plane calls like StartSession and SendCommand"},{"left":"Azure Activity Log","right":"runCommand/action with caller and machine"},{"left":"GCP Cloud Audit Logs","right":"OS Login key imports and instance sessions"},{"left":"Agent log on the guest","right":"What actually executed inside the machine"}]},{"id":"e10","type":"fill","title":"The synchronised identity shortcut","summary":"Complete the note on federated identity abuse.","scenario":"You are adding a paragraph to the threat briefing. Public reporting on T1021.007 intrusions keeps describing the same shortcut: the attacker never needed cloud-native passwords, because synchronised on-premises identities already worked in the cloud, and the work happened through the CLI rather than the browser.","question":"Complete the briefing paragraph with the correct terms:","hint":"The identities come from on-premises; the tool is command-line, not graphical.","explanation":"Synchronised on-premises identities log straight into the cloud when federation is in place, and the provider's CLI drives the run-command service without a browser. Guest accounts are cloud-native, GUI means the web console, and SSH is the classic path this technique replaces.\n\nThis is why on-prem password hygiene is cloud perimeter hygiene.","study":"Study identity synchronisation and federation as the bridge from on-prem compromise to cloud access.","text":"Reported cases show attackers reusing ___ identities synchronised to the cloud, and driving the run-command service with the provider's ___ instead of the web console.","blanks":["on-premises","CLI"],"bank":["on-premises","CLI","guest","GUI","SSH","managed"]},{"id":"e11","type":"logview","title":"Azure Activity Log extract","summary":"Find the Run Command caller and the storage action.","scenario":"The Azure side of Meridian Freight forwards its Activity Log to the panel below. One identity appears three times with Run Command on finance machines, and the same identity also touched a storage account. Filter the stream, then complete the note in the task with the two values it asks for.","question":"Complete the note below the log with the two missing values:","hint":"The caller repeats on every runCommand line; the storage action is a list of keys.","explanation":"svc-deploy ran runCommand/action on three finance machines, and the same identity also executed the listKeys action on a storage account — a storage-key grab is a common second step after command execution. adm.hart only changed diagnostic settings and deallocated a machine, which stays noise here.\n\nFollow the identity across operations, not just the alarming ones.","study":"Study Azure Activity Log correlation across resource providers for one caller.","filterable":true,"log":{"header":["time","operation","detail"],"lines":["2026-04-18T00:14:32Z Microsoft.Compute/virtualMachines/runCommand/action caller=svc-deploy@corp[.]example vm=vm-finance-03 status=Succeeded","2026-04-18T00:15:02Z Microsoft.Compute/virtualMachines/runCommand/action caller=svc-deploy@corp[.]example vm=vm-finance-08 status=Succeeded","2026-04-18T00:15:44Z Microsoft.Compute/virtualMachines/runCommand/action caller=svc-deploy@corp[.]example vm=vm-finance-11 status=Succeeded","2026-04-18T00:31:09Z Microsoft.Storage/storageAccounts/listKeys/action caller=svc-deploy@corp[.]example status=Succeeded","2026-04-18T00:44:51Z Microsoft.Compute/virtualMachines/deallocate/action caller=adm.hart@corp[.]example vm=vm-finance-07 status=Succeeded","2026-04-18T01:12:38Z Microsoft.Insights/diagnosticSettings/write caller=adm.hart@corp[.]example status=Succeeded","2026-04-18T01:40:20Z Microsoft.Compute/virtualMachines/restart/action caller=svc-deploy@corp[.]example vm=vm-finance-03 status=Succeeded"]},"widget":{"type":"fill","question":"Complete the note with the Run Command caller and the storage action:","text":"The repeated Run Command caller is ___ and the storage action it also triggered was ___.","blanks":["svc-deploy","listKeys"],"bank":["svc-deploy","listKeys","adm.hart","deallocate","diagnosticSettings","restart"]}},{"id":"e12","type":"terminal","title":"Azure Activity Log from the CLI","summary":"Fetch the last day of activity-log events.","scenario":"You are bridging the Azure case into the same ticket. The jump host has the az CLI logged in read-only to the subscription. The lead wants the last 24 hours of Activity Log entries in the terminal, and the simulator forbids anything that deletes a machine or a resource group.","question":"Type the command that lists the last 24 hours of Activity Log events:","hint":"az monitor activity-log list takes a time window with --offset.","explanation":"az monitor activity-log list --offset 24h pulls the last day of control-plane events, including runCommand/action entries. az vm delete or az group delete would destroy the machines and their agent-side traces — the textbook evidence-destroying move.\n\nThe offset switch is the quick way to window a stream in the az CLI.","study":"Study az monitor activity-log list and its --offset and --query options.","prompt":"analyst@soc-jump:~$","skill":"azure-activity-review","knownTools":["az","jq","grep","column"],"expected":"az monitor activity-log list --offset 24h","elements":[{"label":"the Activity Log CLI command","any":["az monitor activity-log list"]},{"label":"the time-window switch","any":["--offset"]},{"label":"the 24 hour window","any":["24h"]}],"forbidden":[{"any":["az vm delete","az group delete"],"why":"Deleting a machine or a group removes the guests and every local trace — never during triage."}],"output":["Retrieved 12 activity events (last 24h)","00:14:32Z runCommand/action vm-finance-03 caller=svc-deploy@corp[.]example","00:15:02Z runCommand/action vm-finance-08 caller=svc-deploy@corp[.]example","00:31:09Z listKeys/action storage-meridian-01 caller=svc-deploy@corp[.]example"],"syntaxPanel":"az monitor activity-log list [--offset <duration>]\n  activity-log list   read control-plane events for the subscription\n  --offset            how far back to read, e.g. 6h, 24h, 7d\n  example:            az monitor activity-log list --offset 6h","sampleOutput":"Retrieved 4 activity events (last 6h)\n00:14:32Z runCommand/action vm-finance-03 caller=svc-deploy@corp[.]example"},{"id":"e13","type":"mcq","title":"Metadata, not movement","summary":"Contrast IMDS with cloud-service lateral movement.","scenario":"During the tabletop, a teammate claims that reading instance metadata from inside a machine is 'the same T1021.007 move'. You have one minute to correct the record so the detection plan does not chase the wrong technique and the team budgets its engineering time on the right signals.","question":"Why is reading instance metadata a different technique from T1021.007?","hint":"One reads data on the local machine; the other reaches other machines.","explanation":"IMDS is a local data service on each machine — it returns facts and credentials about that single guest and requires code already running on it. T1021.007 moves an operator between machines through cloud management services and shows up in control-plane audit logs. The two can appear in the same incident, but their telemetry and mitigations differ, so detections must not be merged.","study":"Study IMDS as a separate technique and why its detections differ from cloud-service movement.","options":["IMDS serves local facts; T1021.007 reaches other machines","IMDS requires Session Manager to be enabled first","T1021.007 only works from the web console UI","Both techniques leave the very same audit trail behind them"],"correct":0},{"id":"e14","type":"order","title":"Switch transcripts on","summary":"Order the four steps to make sessions reviewable.","scenario":"Post-incident, the board demands that every Session Manager shell becomes reviewable. The platform team proposes four steps: create the destination, point the preferences document at it, restrict who can even start sessions, and only then alert on unusual session hours so the alerts finally have complete data to read.","question":"Arrange the four steps in the correct order:","hint":"Storage first, configuration second, restriction third, alerting last.","explanation":"The transcript destination must exist before the preferences document can point at it; the preferences change then makes future sessions replayable; restricting ssm:StartSession to a named admin role shrinks who can appear in those transcripts; alerting on odd hours comes last because it reads the now-complete record.\n\nAlerting before logging produces alerts about nothing.","study":"Study the Session Manager preferences document fields for S3 and CloudWatch delivery.","items":["Create the dedicated S3 bucket for session transcripts","Point the Session Manager preferences document at the bucket","Restrict ssm:StartSession to a named admin role","Alert on StartSession events outside admin hours"]},{"id":"e15","type":"multi","title":"Two controls, two traps","summary":"Select the proposals that genuinel /* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function answeredCount(){

  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null) return;
  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";
  res.items.forEach(function(it){
    var ic = it.state === "ok" ? "✓" : (it.state === "bad" ? "✗" : "○");
    rows += '<div class="fi ' + it.state + '"><span class="ic" aria-hidden="true">' + ic + '</span><span>' + esc(String(it.text).replace(/^[✓✗○]\s*/, "")) + "</span></div>";
  });
  (res.warn || []).forEach(function(wn){
    rows += '<div class="fi warn"><span class="ic" aria-hidden="true">⚠</span><span>' + esc(wn) + "</span></div>";
  });
  if(S.hintsUsed[i]) rows += '<div class="fi note"><span class="ic" aria-hidden="true">💡</span><span>Hint used on this exercise — credit reduced by 0.10.</span></div>';
  var explain = String(ex.explanation).split(/\n\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  var canon = res.canon ? '<div class="mono" role="figure" aria-label="Canonical command">canonical: ' + esc(res.canon) + "</div>" : "";
  $("fbslot").innerHTML = '<div class="fb ' + res.head + '" role="status">' +
    '<div class="fb-head"><span aria-hidden="true">' + (res.head === "ok" ? "✓" : res.head === "bad" ? "✗" : "✓") + "</span><span>" + esc(res.headText.replace(/^[✓✗]\s*/, "")) + '</span><span class="fb-credit">credit ' + res.credit.toFixed(2) + " / 1.00" +
    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +
    '<div class="fb-explain">' + explain + '<div class="fb-study">📚 ' + esc(ex.study) + "</div></div>" +
    "</div></div>";
  $("btn-check").disabled = true;
  $("btn-check").textContent = "✓ Checked";
  var nb = $("btn-next");
  nb.disabled = false;
  nb.focus();
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  nb.innerHTML = S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise");
  $("actnote").textContent = "";
  updateHeader();
}

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null || S.hintsUsed[i]) return;
  S.hintsUsed[i] = true;
  $("hintslot").innerHTML = hintHTML(ex);
  $("btn-hint").disabled = true;
  updateHeader();
}
function showReview(){
  S.screen = "review";
  S.phase = "review";
  S.reviewPos = -1;
  var pend = pendingSkips();
  S.reviewTotal = pend.length;
  var m = $("main");
  if(pend.length === 0){ finish(); return; }
  var rows = pend.map(function(exIdx, k){
    var ex = EXAMS[exIdx];
    return '<div class="revrow"><span class="rn">#' + (k + 1) + '</span><span class="rt"><b>' + esc(ex.title) + "</b> — " + esc(ex.summary) + "</span>" +
      '<span class="badge-skip">⚠ Skipped</span><button class="btn" data-ex="' + exIdx + '" type="button">Answer now</button></div>';
  }).join("");
  m.innerHTML =
    '<section class="blk blk-question" style="--blk:var(--amber)"><div class="blk-label"><span class="dot"></span>REVIEW SKIPPED EXERCISES</div>' +
    '<p class="q-text">You skipped ' + pend.length + ' exercise' + (pend.length > 1 ? "s" : "") + '.</p>' +
    '<p class="scen-body" style="color:var(--ink-dim);margin:8px 0 14px">Answer them now, or leave them — exercises you never answer are excluded from both your score and the total. <span class="dim">The timer is still running.</span></p>' +
    '<div class="revlist">' + rows + "</div>" +
    '<div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="btn-finish" type="button">Finish exam — see results</button></div></section>';
  var btns = byClass(m, "btn");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      if(btn.hasAttribute("data-ex")){
        btn.addEventListener("click", function(){
          S.idx = S.order.indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          S.reviewPos = pendingSkips().indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          renderReviewItem();
        });
      }
    })(btns[b]);
  }
  $("btn-finish").addEventListener("click", function(){ finish(); });
  updateHeader();
}
function renderReviewItem(){
  var exIdx = curPos();
  S.screen = "review";
  renderExercise();
  var nb = $("btn-next");
  nb.innerHTML = "Back to review list";
  updateHeader();
}
function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
