var ansCredit = {};        /* exIndex -> float credit */
var answeredCount = 0;
var creditSum = 0;         /* float accumulator */
var hintUsed = {};         /* exIndex -> true */
var reported = false;
var inReview = false;
var resultsShown = false;
var widget = null;         /* active widget controller */

/* ---- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---- */
var TS = { RUN:'RUNNING', PM:'PAUSED_MANUAL', PA:'PAUSED_AUTO_CHECK', END:'ENDED' };
var tstate = TS.RUN;
var remain = EXAM.timerSec;
var resumeTarget = TS.RUN;
var manualMark = 0, autoMark = 0;
var pauseManualSec = 0, pauseAutoSec = 0;
var exTimerLeft = 0;       /* reduced per-exercise timer (seconds) */
var ended = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtT(s){ s=Math.max(0,s|0); var m=(s/60)|0, r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pct(x){ return Math.round(x*100); }
/* partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){ if(N<=0){return 0;} return Math.max(0,(H-W)/N); }

/* ============ header rendering ============ */
function stateInfo(){
  if(tstate===TS.RUN)  return {cls:'tstate-run',  ic:'▶', w:'RUNNING'};
  if(tstate===TS.PM)   return {cls:'tstate-pm',   ic:'⏸', w:'PAUSED — manual (press Resume)'};
  if(tstate===TS.PA)   return {cls:'tstate-pa',   ic:'⏸', w:'PAUSED — reviewing feedback (resumes on Next)'};
  return {cls:'tstate-end', ic:'⏹', w:'ENDED'};
}
function renderHeader(){
  var si = stateInfo();
  $('t-clock').textContent = '⏱ '+fmtT(remain);
  var st = $('t-state'); st.textContent = si.ic+' '+si.w; st.className = 'hchip '+si.cls;
  var shown = Math.round(creditSum*10)/10;
  var p = answeredCount>0 ? pct(creditSum/answeredCount) : 0;
  $('t-score').innerHTML = 'Score <b>'+shown.toFixed(1)+' / '+answeredCount+'</b> · '+p+'%';
}
function renderCounter(exIdx){
  $('t-count').innerHTML = 'Exercise <b>'+(ORDERPOS[exIdx]||'-')+' of '+EX.length+'</b>';
  var sev = $('t-sev'); if(sev){ /* severity badge is static per file */ }
}

/* ============ pause logging ============ */
function nowSec(){ return Date.now()/1000; }
function enterAutoPause(){
  if(tstate===TS.END){ return; }
  tstate = TS.PA; autoMark = nowSec(); renderHeader();
}
function leaveAutoPause(){
  if(autoMark>0){ pauseAutoSec += Math.max(0, nowSec()-autoMark); autoMark=0; }
}
function manualPause(){
  if(tstate===TS.RUN){ resumeTarget = TS.RUN; }
  else if(tstate===TS.PA){ resumeTarget = TS.PA; }
  else { return; }
  tstate = TS.PM; manualMark = nowSec();
  renderHeader(); showPauseOverlay();
}
function manualResume(){
  if(manualMark>0){ pauseManualSec += Math.max(0, nowSec()-manualMark); manualMark=0; }
  tstate = resumeTarget;
  hidePauseOverlay(); renderHeader();
}
function showPauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  $('stage').classList.add('hid');
  ov.classList.remove('hid');
}
function hidePauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  ov.classList.add('hid');
  $('stage').classList.remove('hid');
}

/* ============ timer ============ */
function tick(){
  if(tstate!==TS.RUN || ended){ return; }
  remain--;
  if(remain<=0){ remain=0; renderHeader(); timeUp(); return; }
  var c = EX[curEx];
  if(c && c.terminal && c.terminal.timerSec && exTimerLeft>0 && ansState[curEx]!=='answered'){
    exTimerLeft--;
    var chip = $('extimer');
    if(chip){ chip.textContent='⏳ '+fmtT(exTimerLeft)+' left on this console'; }
    if(exTimerLeft<=0){ gradeCurrent(true); }
  }
  renderHeader();
}
function timeUp(){
  if(ended){ return; }
  ended = true; tstate = TS.END; renderHeader();
  finish(true);
}

/* ============ flow ============ */
function buildOrder(){
  ORDER = shuffle(EX.map(function(_,i){ return i; }));
  /* brief contract: the two terminal exercises must never be adjacent in play order */
  for(var guard=0; guard<50; guard++){
    var bad = -1;
    for(var k=0;k<ORDER.length-1;k++){
      if(EX[ORDER[k]].type==='terminal' && EX[ORDER[k+1]].type==='terminal'){ bad=k; break; }
    }
    if(bad<0){ break; }
    var other = -1;
    for(var k2=0;k2<ORDER.length;k2++){
      if(k2!==bad && k2!==bad+1 && EX[ORDER[k2]].type!=='terminal' &&
         (bad+2>=ORDER.length || k2!==bad+2) && (bad-1<0 || k2!==bad-1)){ other=k2; break; }
    }
    if(other<0){ break; }
    var tmp = ORDER[bad+1]; ORDER[bad+1] = ORDER[other]; ORDER[other] = tmp;
  }
  ORDERPOS = {};
  ORDER.forEach(function(exIdx,i){ ORDERPOS[exIdx] = i+1; });
}
function startExam(){
  $('intro').classList.add('hid');
  $('exam').classList.remove('hid');
  buildOrder();
  renderHeader();
  nextUnanswered();
}
function nextUnanswered(){
  fromReview = false; inReview = false;
  var next = null;
  for(var k=0;k<ORDER.length;k++){
    var i = ORDER[k];
    if(!ansState[i]){ next = i; break; }
  }
  if(next===null){
    if(skipPool.length>0){ showReview(); } else { finish(false); }
    return;
  }
  renderExercise(next,false);
}
function showReview(){
  inReview = true; fromReview = false;
  updateHeaderButtons();
  var host = $('stage'); host.innerHTML='';
  var h = '<div class="card skipwrap"><h2>Review skipped exercises</h2>'+
    '<p>You skipped '+skipPool.length+' exercise'+(skipPool.length===1?'':'s')+
    '. You can go back to any of them and answer it now, as long as the timer has not ended. '+
    'Skipped exercises that stay unanswered are excluded from your score — they do not count for or against you.</p><div class="rlist">';
  skipPool.forEach(function(i){
    h += '<div class="ritem"><span class="ic">⚠</span><span>'+esc(EX[i].title)+'</span>'+
         '<button class="btn" data-rev="'+i+'">Answer this one</button></div>';
  });
  h += '</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
       '<button class="btn primary" id="btn-finish">Finish exam</button></div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-rev]'), function(b){
    b.addEventListener('click', function(){
      var i = parseInt(b.getAttribute('data-rev'),10);
      inReview = false; fromReview = true; renderExercise(i,true);
    });
  });
  $('btn-finish').addEventListener('click', function(){ finish(false); });
}

/* ============ exercise rendering ============ */
function fmtText(s){
  var t = esc(s);
  t = t.replace(/`([^`]+)`/g, function(m,a){ return '<code class="inline-code">'+a+'</code>'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, function(m,a){ return '<b>'+a+'</b>'; });
  t = t.replace(/\n/g,'<br>');
  return t;
}
function scenarioHTML(ex){
  var inner = '';
  (ex.scenario||[]).forEach(function(p){
    if(p[0]==='p'){ inner += '<p class="prose">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='art'){
      inner += '<div class="art"><div class="art-h">'+esc(p[1])+'</div><div class="art-b"><div class="mono">'+esc(p[2])+'</div></div></div>';
    }
    else if(p[0]==='note'){ inner += '<p class="small">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='tbl'){
      var rows = p[1]; var t='<table class="tbl">';
      rows.forEach(function(r,ri){ t+='<tr>'; r.forEach(function(c){ t+= (ri===0?'<th>':'<td>')+fmtText(c)+ (ri===0?'</th>':'</td>'); }); t+='</tr>'; });
      inner += t+'</table>';
    }
  });
  if(ex.collapsed){
    return '<details class="artwrap"><summary>📁 SCENARIO — '+esc(ex.summary||'read the scenario')+' (click to expand)</summary><div class="blk-b">'+inner+'</div></details>';
  }
  return '<div class="blk-h">🧾 SCENARIO</div><div class="blk-b">'+inner+'</div>';
}
function renderExercise(i, reviewMode){
  curEx = i;
  var ex = EX[i];
  var host = $('stage');
  var collapsed = !!ex.collapsed;
  var h = '<div class="ex-head"><span class="exnum">Exercise '+(ORDERPOS[i]||'-')+' of '+EX.length+'</span>'+
          '<span class="badge-sev '+EXAM.sevClass+'">'+esc(EXAM.sevName)+'</span>'+
          '<span class="ex-title">'+esc(ex.title)+'</span>'+
          (ex.terminal && ex.terminal.timerSec ? '<span class="exchip" id="extimer">⏳ '+fmtT(ex.terminal.timerSec)+' left on this console</span>':'')+
          '</div>';
  h += '<div class="blk scenario">'+scenarioHTML(ex)+'</div>';
  h += '<div class="blk question"><div class="blk-h">❓ QUESTION</div><div class="blk-b"><p class="qtext">'+fmtText(ex.q)+'</p></div></div>';
  h += '<div class="blk answer"><div class="blk-h">✍️ YOUR ANSWER</div><div class="blk-b" id="ansarea"></div></div>';
  h += '<div id="fbhost"></div>';
  host.innerHTML = h;
  renderCounter(i);
  $('fbhost').innerHTML='';
  widget = makeWidget(ex, $('ansarea'), reviewMode);
  widget.render();
  var bar = document.createElement('div');
  bar.style.cssText='display:flex;gap:10px;margin-top:12px;flex-wrap:wrap';
  bar.innerHTML = (ex.type==='tree'?'':'<button class="btn good" id="btn-check">Check</button>')+
                  (hintUsed[i]?'':'<button class="btn warn" id="btn-hint2">💡 Hint (−10% of this exercise)</button>');
  $('ansarea').appendChild(bar);
  var cb = $('btn-check');
  if(cb){ cb.addEventListener('click', function(){ gradeCurrent(false); }); }
  var hb = $('btn-hint2');
  if(hb){ hb.addEventListener('click', function(){ useHint(); }); }
  if(ex.hint && hintUsed[i]){ /* already used before returning from review */ }
  updateHeaderButtons();
}
function updateHeaderButtons(){
  var inactive = (curEx<0 || inReview || ansState[curEx]==='answered');
  var sk = $('btn-skip');
  if(sk){ sk.disabled = inactive; }
  var pa = $('btn-pause');
  if(pa){ pa.disabled = (tstate===TS.END); }
  var hh = $('btn-hint');
  if(hh){ hh.disabled = (inactive || !!hintUsed[curEx]); }
}
function useHint(){
  var i = curEx, ex = EX[i];
  if(i<0 || !ex || hintUsed[i] || ansState[i]==='answered'){ return; }
  hintUsed[i] = true;
  updateHeaderButtons();
  var fb = $('fbhost');
  var note = document.createElement('div');
  note.className = 'outcome';
  note.innerHTML = '<b>💡 HINT (this exercise will lose 10% of its credit)</b>'+fmtText(ex.hint||'Look again at the scenario and the question.');
  fb.insertBefore(note, fb.firstChild);
  var b2 = $('btn-hint2'); if(b2){ b2.remove(); }
}

/* ============ grading ============ */
function gradeCurrent(autoExpired){
  var i = curEx, ex = EX[i];
  if(ansState[i]==='answered'){ return; }
  /* FIRST action per spec: stop the timer into the auto-check pause state */
  enterAutoPause();
  if(autoExpired){ exTimerLeft = 0; var chip=$('extimer'); if(chip){ chip.textContent='⏳ time on this console has run out'; } }
  var res = widget.grade();            /* {H,W,N,items[],expl?} */
  var credit = scoreExercise(res.H,res.W,res.N);
  if(hintUsed[i]){ credit = Math.max(0, credit - 0.10); }
  ansCredit[i] = credit; ansState[i]='answered'; answeredCount++; creditSum += credit;
  renderFeedback(ex, res, credit, autoExpired);
  renderHeader(); updateHeaderButtons();
  var fbh = $('fbhost');
  if(fbh && fbh.scrollIntoView){ fbh.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function fbLabel(credit){
  if(credit>=0.9999){ return {t:'✓ CORRECT', cls:'ok'}; }
  if(credit>0){ return {t:'◐ PARTIALLY CORRECT', cls:'part'}; }
  return {t:'✗ INCORRECT', cls:'bad'};
}
function renderFeedback(ex, res, credit, autoExpired){
  var L = fbLabel(credit);
  var isMulti = res.N>1;
  var h = '<div class="fb '+L.cls+'"><div class="fb-h">'+L.t+'</div><div class="fb-b">';
  if(hintUsed[curEx]){ h += '<p class="small" style="margin:0 0 8px">💡 Hint was used on this exercise — the 10% credit reduction is already applied below.</p>'; }
  if(isMulti){ h += '<div class="fb-credit">credit '+credit.toFixed(2)+' — '+res.H+'/'+res.N+' items</div>'; }
  if(autoExpired){ h += '<p class="small">⏳ The console timer ran out, so your answer was submitted automatically.</p>'; }
  if(isMulti && res.items && res.items.length){
    h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok' ? '✓' : (it.s==='bad' ? '✗' : '○');
      var cl = it.s==='ok' ? 'ok' : (it.s==='bad' ? 'bad' : 'miss');
      var w  = it.s==='ok' ? 'Correct' : (it.s==='bad' ? 'Wrong' : 'Missed');
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why? ' — '+fmtText(it.why):'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<p class="prose">'+fmtText(res.expl || ex.expl || '')+'</p>';
  if(res.N===1 && res.items && res.items.length){ h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok'?'✓':'✗'; var cl = it.s==='ok'?'ok':'bad'; var w = it.s==='ok'?'Correct':'Wrong';
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why?' — '+fmtText(it.why):'')+'</span></div>';
    }); h += '</div>'; }
  if(ex.type==='terminal'){
    var term = ex.terminal;
    h += '<div class="synpanel"><h4>CANONICAL COMMAND</h4><div class="copyblk"><code class="inline-code" id="canon">'+esc(term.expected)+'</code>'+
         '<button class="copybtn" id="btn-copy">Copy</button></div>'+
         '<p style="margin:.5rem 0 0">Why it is built this way:</p><ul class="small">';
    (term.parts||[]).forEach(function(p){ h += '<li>'+fmtText(p)+'</li>'; });
    (term.bad||[]).forEach(function(bd){ h += '<li>⚠ '+fmtText(bd.why)+'</li>'; });
    h += '</ul></div>';
  }
  if(ex.study){ h += '<div class="study"><b>What to study next:</b> '+fmtText(ex.study)+'</div>'; }
  var isLast = (function(){
    for(var k=0;k<ORDER.length;k++){ var j=ORDER[k]; if(j!==curEx && !ansState[j]){ return false; } }
    return true;
  })();
  var reviewNeeded = skipPool.filter(function(i){ return ansState[i]!=='answered'; }).length>0;
  var nxt = !isLast ? 'Next ▸' : (reviewNeeded ? 'Review skipped ⏭' : 'Final Submit');
  h += '</div></div><div style="margin-top:12px"><button class="btn primary" id="btn-next">'+nxt+'</button></div>';
  $('fbhost').innerHTML = h;
  var cb = $('btn-copy');
  if(cb){ cb.addEventListener('click', function(){
    try{ navigator.clipboard.writeText($('canon').textContent); cb.textContent='Copied ✓'; setTimeout(function(){cb.textContent='Copy';},1500); }
    catch(e){ cb.textContent='Select & copy'; }
  }); }
  $('btn-next').addEventListener('click', function(){
    leaveAutoPause();
    if(tstate!==TS.END){ tstate = TS.RUN; }
    renderHeader();
    widget = null;
    if(fromReview){ fromReview=false; showReview(); }
    else if(isLast){
      if(reviewNeeded){ showReview(); } else { finish(false); }
    }
    else { nextUnanswered(); }
  });
  /* disable answering further */
  var aa = $('ansarea'); if(aa){ aa.classList.add('disabled'); Array.prototype.forEach.call(aa.querySelectorAll('button,input,select'), function(el){ el.disabled=true; }); }
}

/* ============ skip ============ */
function skipCurrent(){
  var i = curEx;
  if(ansState[i]==='answered'){ return; }
  if(ansState[i]!=='skipped'){ ansState[i]='skipped'; skipPool.push(i); }
  widget=null;
  if(fromReview){ fromReview=false; showReview(); return; }
  nextUnanswered();
}

/* ============ results ============ */
function finish(timeRanOut){
  if(resultsShown){ return; }
  resultsShown = true;
  if(timeRanOut){ /* timer already marked ENDED */ } else { ended = true; tstate = TS.END; renderHeader(); }
  hidePauseOverlay();
  var answeredIdx = Object.keys(ansState).filter(function(k){ return ansState[k]==='answered'; }).map(Number);
  var full=0, part=0, zero=0, partSum=0;
  answeredIdx.forEach(function(i){ var c=ansCredit[i]; if(c>=0.9999){full++;} else if(c>0){part++; partSum+=c;} else {zero++;} });
  var skippedLeft = Object.keys(ansState).filter(function(k){ return ansState[k]==='skipped'; }).map(Number);
  var neverTouched = EX.length - answeredIdx.length - skippedLeft.length;
  var pctFinal = answeredIdx.length>0 ? Math.round(creditSum/answeredIdx.length*100) : 0;
  var passed = pctFinal>=EXAM.passMark;
  $('exam').classList.add('hid');
  var r = $('results'); r.classList.remove('hid');
  var h = '<div class="card res"><h2>'+(timeRanOut?'⏹ Time is up — final results':'🏁 Final results')+'</h2>';
  h += '<p class="small">Score is computed only over exercises you actually answered. Skipped-and-unanswered exercises are excluded from the score completely.</p>';
  h += '<div class="score-big">'+(Math.round(creditSum*10)/10).toFixed(1)+' / '+answeredIdx.length+' · '+pctFinal+'%</div>';
  if(passed){
    h += '<div class="cert"><div class="big">✓ PASS — Congratulations!</div>'+
         '<p>You passed the '+esc(EXAM.sevName)+' practice exam for <b>'+esc(EXAM.topicTitle)+'</b> with '+pctFinal+'% (pass mark '+EXAM.passMark+'%).</p>'+
         '<p class="small">Cyber Pulse Academy · MITRE ATT&CK '+esc(EXAM.topicId.toUpperCase())+' · '+esc(EXAM.sevName)+' tier</p></div>';
  } else {
    h += '<div class="fail"><div class="big">✗ FAIL — '+pctFinal+'%</div>'+
         '<p>You need at least '+EXAM.passMark+'% to pass. You must retake this exam.</p>'+
         '<p class="small">Review the explanations you saw after each Check, then try again.</p></div>';
  }
  h += '<div class="res-grid">'+
    '<div class="res-card"><div class="n">'+full+'</div><div class="l">✓ fully correct</div></div>'+
    '<div class="res-card"><div class="n">'+part+'</div><div class="l">◐ partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="res-card"><div class="n">'+zero+'</div><div class="l">✗ fully incorrect</div></div>'+
    '<div class="res-card"><div class="n">'+(skippedLeft.length+neverTouched)+'</div><div class="l">⚠ skipped / unanswered (excluded)</div></div>'+
    '</div>';
  h += '<div class="pauselog">⏱ Time paused manually: <b>'+fmtT(Math.round(pauseManualSec))+'</b> · '+
       '⏸ Time reviewing feedback (auto-pause): <b>'+fmtT(Math.round(pauseAutoSec))+'</b> · '+
       'Time remaining: <b>'+fmtT(remain)+'</b></div>';
  h += '<div class="rlist">';
  ORDER.forEach(function(i){
    var st = ansState[i];
    var ic, tx;
    if(st==='answered'){ var c=ansCredit[i]; ic = c>=0.9999?'✓':(c>0?'◐':'✗'); tx='credit '+c.toFixed(2); }
    else { ic='⚠'; tx='skipped — excluded from score'; }
    h += '<div class="ritem"><span class="ic">'+ic+'</span><span>Exercise '+(ORDERPOS[i])+' — '+esc(EX[i].title)+'</span><span style="margin-left:auto">'+tx+'</span></div>';
  });
  h += '</div><div style="margin-top:16px"><button class="btn primary" id="btn-retake">↺ Retake Exam</button></div></div>';
  r.innerHTML = h;
  $('btn-retake').addEventListener('click', retake);
  reportScore(creditSum, answeredIdx.length);
}
function clearShuffles(){
  EX.forEach(function(ex){
    delete ex._optOrder; delete ex._bank; delete ex._chips; delete ex._shuf; delete ex._timerInit;
    if(ex.steps){ ex.steps.forEach(function(s){ delete s._order; }); }
  });
}
function retake(){
  reported = false; ended = false; tstate = TS.RUN; resultsShown = false;
  remain = EXAM.timerSec; creditSum = 0; answeredCount = 0;
  ansState = {}; ansCredit = {}; hintUsed = {}; skipPool = [];
  pauseManualSec = 0; pauseAutoSec = 0; manualMark = 0; autoMark = 0;
  clearShuffles();
  $('results').classList.add('hid');
  $('exam').classList.remove('hid');
  $('stage').innerHTML='';
  buildOrder(); renderHeader(); nextUnanswered();
}

/* ============ website integration ============ */
function reportScore(cSum, answeredN){
  if(reported){ return; }
  reported = true;
  var percent = answeredN>0 ? Math.round((cSum/answeredN)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(cSum),
      total: answeredN,
      percent: percent,
      passed: percent>=EXAM.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){ return; }
  try{
    if(event.data.username && $('who')){ $('who').textContent = 'Good luck, '+String(event.data.username).slice(0,40)+'!'; }
  }catch(e){}
});


/* ================= WIDGET FACTORY ================= */
function makeWidget(ex, host, reviewMode){
  var w = { ex:ex, host:host, reviewMode:reviewMode };
  var builders = {
    qcm: buildQcm, multi: buildQcm, fill: buildFill, match: buildMatch, dnd: buildDnd,
    order: buildOrderW, rank: buildOrderW, terminal: buildTerminal, logview: buildLogview,
    tree: buildTree, selblank: buildSelblank
  };
  var b = builders[ex.type] || buildQcm;
  w.render = function(){ b(w); };
  w.grade = function(){ return w._grade ? w._grade() : {H:0,W:0,N:1,items:[],expl:ex.expl}; };
  return w;
}
function letters(i){ return 'ABCDEFGH'.charAt(i%8)+'.'; }
function clip(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

/* ---------- QCM / multi-select ---------- */
function buildQcm(w){
  var ex = w.ex, host = w.host;
  if(!ex._optOrder){ ex._optOrder = shuffle(ex.options.map(function(_,i){return i;})); }
  var multi = ex.type==='multi';
  var h = '<div class="opts" role="'+(multi?'group':'radiogroup')+'">';
  ex._optOrder.forEach(function(oi,k){
    h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(ex.options[oi].t)+'</span></button>';
  });
  h += '</div>';
  if(multi){ h += '<p class="small" style="margin-top:8px">Select all that apply, then press Check. Wrong selections subtract from correct ones.</p>'; }
  host.insertAdjacentHTML('afterbegin', h);
  var sel = {};
  Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){
      var i = btn.getAttribute('data-i');
      if(multi){
        sel[i] = !sel[i]; btn.classList.toggle('sel', !!sel[i]);
      } else {
        sel = {}; sel[i] = true;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
      }
    });
  });
  w._grade = function(){
    var chosen = Object.keys(sel).filter(function(k){ return sel[k]; }).map(Number);
    var corr = ex.correct;
    var H=0, W=0, items=[];
    var lab = function(ci){ return letters(ex._optOrder.indexOf(ci))+' '+clip(ex.options[ci].t,90); };
    if(multi){
      corr.forEach(function(ci){
        if(sel[ci]){ H++; items.push({s:'ok', label:lab(ci), why:ex.options[ci].why}); }
        else { items.push({s:'miss', label:lab(ci), why:ex.options[ci].why}); }
      });
      chosen.forEach(function(ci){
        if(corr.indexOf(ci)<0){ W++; items.push({s:'bad', label:lab(ci), why:ex.options[ci].why}); }
      });
      return {H:H, W:W, N:corr.length, items:items, expl:ex.expl};
    }
    var ok = chosen.length===1 && corr.indexOf(chosen[0])>=0;
    if(ok){ H=1; }
    corr.forEach(function(ci){
      items.push({s: ok?'ok':'miss', label:lab(ci), why:ex.options[ci].why});
    });
    if(!ok && chosen.length===1){
      items.push({s:'bad', label:'Your choice: '+lab(chosen[0]), why:ex.options[chosen[0]].why});
    }
    return {H:H, W:W, N:1, items:items, expl:ex.expl};
  };
}

/* ---------- fill-in-the-blank (chips -> inline blanks) ---------- */
function buildFill(w){
  var ex = w.ex, host = w.host;
  if(!ex._bank){ ex._bank = shuffle(ex.bank.slice()); }
  var parts = ex.pre.split('___');
  var h = '<p class="prose">';
  parts.forEach(function(p,i){
    h += fmtText(p);
    if(i<parts.length-1){ h += '<span class="blank" data-b="'+i+'">…</span>'; }
  });
  h += '</p><div class="bank" id="fillbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#fillbank');
  var selChip = null;
  var placed = {};           /* blankIdx -> chip element */
  ex._bank.forEach(function(word){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=word;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    bank.appendChild(c);
  });
  Array.prototype.forEach.call(host.querySelectorAll('.blank'), function(z){
    z.addEventListener('click', function(){
      if(!selChip){ return; }
      var bi = z.getAttribute('data-b');
      if(placed[bi]){ placed[bi].classList.remove('placed'); }
      z.textContent = selChip.textContent;
      placed[bi] = selChip;
      selChip.classList.add('placed'); selChip.classList.remove('sel');
      selChip = null;
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bset,bi){
      var chipEl = placed[bi];
      var got = chipEl ? chipEl.textContent : '';
      var ok = got!=='' && bset.accept.some(function(a){ return a.toLowerCase()===got.toLowerCase(); });
      if(got===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
      else if(ok){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+got, why:bset.why}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+got, why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- shared chip->slot mechanics (match / dnd) ---------- */
function chipSlotWidget(w, cfg){
  var ex = w.ex, host = w.host;
  if(!ex._chips){ ex._chips = shuffle(cfg.chips.slice()); }
  var h = '<p class="small">'+(cfg.help||'Drag a chip into a box, or click a chip and then click a box.')+'</p>';
  h += '<div class="zones" id="zwrap">';
  cfg.zones.forEach(function(z){
    h += '<div class="zone" data-z="'+z.id+'" tabindex="0"><div class="zone-h">'+esc(z.label)+'</div><div class="zslots"></div></div>';
  });
  h += '</div><div class="bank" id="cbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#cbank');
  var selChip = null;
  var placed = {};           /* chipId -> zoneId */
  ex._chips.forEach(function(ch){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'+(ch.code?' code':''); c.textContent=ch.t; c.setAttribute('data-c',ch.id);
    c.draggable = true;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    c.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', ch.id); }catch(e){} selChip=c; c.classList.add('sel'); });
    bank.appendChild(c);
  });
  function dropInto(z, c){
    if(!c || !z){ return; }
    var zid = z.getAttribute('data-z');
    if(c._slot && c._slot.parentNode){ c._slot.parentNode.removeChild(c._slot); }
    var slot = document.createElement('span');
    slot.className='slot chip'+(c.classList.contains('code')?' code':'');
    slot.textContent = c.textContent;
    z.querySelector('.zslots').appendChild(slot);
    c._slot = slot;
    c.classList.add('placed'); c.classList.remove('sel');
    placed[c.getAttribute('data-c')] = zid;
    selChip = null;
  }
  Array.prototype.forEach.call(host.querySelectorAll('.zone'), function(z){
    z.addEventListener('click', function(){ if(selChip){ dropInto(z, selChip); } });
    z.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && selChip){ ev.preventDefault(); dropInto(z, selChip); } });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var cid=''; try{ cid = ev.dataTransfer.getData('text/plain'); }catch(e){}
      var c = bank.querySelector('[data-c="'+cid+'"]') || selChip;
      dropInto(z, c);
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[],N=0;
    cfg.chips.forEach(function(ch){
      var got = placed[ch.id];
      var want = cfg.correct[ch.id];
      var why = (cfg.chipWhy&&cfg.chipWhy[ch.id])||'';
      if(want){
        /* scored item: a chip with a correct home */
        N++;
        if(!got){ items.push({s:'miss', label:ch.t, why:why}); }
        else if(got===want){ H++; items.push({s:'ok', label:ch.t, why:why}); }
        else { W++; items.push({s:'bad', label:ch.t+' → placed in “'+(cfg.zoneName?cfg.zoneName[got]||got:got)+'”', why:why}); }
      } else if(got){
        /* distractor chip with no home: placing it anywhere is a wrong item */
        W++;
        items.push({s:'bad', label:ch.t+' → does not belong in any box', why:why||'This chip is a distractor — it is not part of the correct answer.'});
      }
    });
    if(N===0){ N=1; }
    return {H:H,W:W,N:N,items:items,expl:ex.expl};
  };
}
function buildMatch(w){
  var ex = w.ex;
  var chips = ex.right.map(function(r,i){ return {id:'r'+i, t:r, code:!!ex.code}; });
  var zones = ex.left.map(function(l,i){ return {id:'l'+i, label:l}; });
  /* chip-keyed map: chip rX belongs in zone lY  (grade looks up by chip id) */
  var correct = {}; ex.left.forEach(function(_,i){ correct['r'+ex.correct[i]] = 'l'+i; });
  var zoneName = {}; zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:zones, chips:chips, correct:correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}
function buildDnd(w){
  var ex = w.ex;
  var zoneName = {}; ex.zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:ex.zones, chips:ex.chips, correct:ex.correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}

/* ---------- order / rank ---------- */
function buildOrderW(w){
  var ex = w.ex, host = w.host;
  var ctx = ex.rankNote ? '<p class="small">'+esc(ex.rankNote)+'</p>' : '';
  if(!ex._shuf){ ex._shuf = shuffle(ex.correct.map(function(_,i){return i;})); }
  host.insertAdjacentHTML('afterbegin', ctx+'<div class="olist" id="olist"></div>');
  var list = host.querySelector('#olist');
  function bindAll(){
    Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var p = parseInt(b.getAttribute('data-p'),10);
        move(p, b.getAttribute('data-mv')==='up'? p-1 : p+1);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.oitem'), function(it){
      it.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      it.addEventListener('drop', function(ev){
        ev.preventDefault();
        var from = parseInt(ev.dataTransfer.getData('text/plain'),10);
        var to = parseInt(it.getAttribute('data-p'),10);
        if(!isNaN(from)){ move(from,to); }
      });
    });
  }
  function render(){
    list.innerHTML='';
    ex._shuf.forEach(function(itemIdx,pos){
      var d = document.createElement('div');
      d.className='oitem'; d.draggable=true; d.setAttribute('data-p',String(pos));
      d.innerHTML = '<span class="pos">'+(pos+1)+'</span><span style="flex:1">'+esc(ex.correct[itemIdx])+'</span>'+
        '<span class="obtns"><button type="button" aria-label="move up" data-mv="up" data-p="'+pos+'">▲</button>'+
        '<button type="button" aria-label="move down" data-mv="dn" data-p="'+pos+'">▼</button></span>';
      d.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', String(pos)); }catch(e){} d.classList.add('dragging'); });
      d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
      list.appendChild(d);
    });
    bindAll();
  }
  function move(from,to){
    if(from<0||to<0||from>=ex._shuf.length||to>=ex._shuf.length){ return; }
    var t = ex._shuf[from]; ex._shuf[from]=ex._shuf[to]; ex._shuf[to]=t; render();
  }
  render();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.correct.forEach(function(_,pos){
      var gotIdx = ex._shuf[pos];
      var ok = gotIdx===pos;
      if(ok){ H++; items.push({s:'ok', label:'Position '+(pos+1)+': '+clip(ex.correct[pos],70), why:ex.itemWhy?ex.itemWhy[pos]:''}); }
      else { W++; items.push({s:'bad', label:'Position '+(pos+1)+': you placed “'+clip(ex.correct[gotIdx],60)+'” — expected “'+clip(ex.correct[pos],60)+'”', why:ex.itemWhy?ex.itemWhy[pos]:''}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items,expl:ex.expl};
  };
}

/* ---------- terminal ---------- */
function normCmd(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function buildTerminal(w){
  var ex = w.ex, host = w.host, T = ex.terminal;
  if(!ex._timerInit){ ex._timerInit = true; exTimerLeft = T.timerSec||0; }
  var h = '';
  if(T.outshape){
    h += '<div class="synpanel"><h4>EXPECTED OUTPUT SHAPE</h4><div class="mono">'+esc(T.outshape)+'</div></div>';
  }
  if(T.syntax){
    h += '<div class="synpanel"><h4>SYNTAX REMINDER</h4>';
    h += '<p style="margin:.2rem 0">'+fmtText(T.syntax.shape)+'</p>';
    if(T.syntax.example){ h += '<p style="margin:.2rem 0">Example on a <b>different</b> target: <code class="inline-code">'+esc(T.syntax.example)+'</code></p>'; }
    if(T.syntax.flags && T.syntax.flags.length){ h += '<ul class="small" style="margin:.3rem 0 0 1.2rem">'; T.syntax.flags.forEach(function(f){ h+='<li>'+fmtText(f)+'</li>'; }); h+='</ul>'; }
    h += '</div>';
  }
  h += '<div class="term"><div class="term-h"><span>🖥 '+esc(T.termTitle||'simulation only — nothing real is executed')+'</span><span>'+esc(T.user||'analyst')+'</span></div>'+
       '<div class="term-out" id="tout"></div>'+
       '<div class="term-in"><span class="ps">'+esc(T.prompt||'$')+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="type your command and press Enter"></div></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var out = host.querySelector('#tout'), inp = host.querySelector('#tin');
  var lastCmd = '';
  (T.welcome||[]).forEach(function(l){
    var d=document.createElement('div'); d.textContent=l; out.appendChild(d);
  });
  function run(cmdRaw){
    var d1=document.createElement('div'); d1.textContent=(T.prompt||'$')+' '+cmdRaw; out.appendChild(d1);
    var cmd = normCmd(cmdRaw);
    lastCmd = cmd;
    var first = cmd.split(' ')[0];
    if(cmd===''){ /* nothing typed */ }
    else if(T.tools.indexOf(first)<0){
      var d2=document.createElement('div'); d2.textContent = (first? first+': ' : '')+'command not found';
      d2.style.color='#f0a8a4'; out.appendChild(d2);
    } else {
      var matched = null;
      (T.outsim||[]).some(function(os){ if(os.re && new RegExp(os.re,'i').test(cmd)){ matched = os; return true; } return false; });
      var lines = matched ? matched.out : (T.defaultOut||['(the command runs)']);
      lines.forEach(function(l){ var d3=document.createElement('div'); d3.textContent=l; out.appendChild(d3); });
    }
    out.scrollTop = out.scrollHeight;
  }
  inp.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){ var v=inp.value; inp.value=''; run(v); }
  });
  w._grade = function(){
    var cmd = lastCmd;
    var H=0,W=0,items=[];
    (T.elements||[]).forEach(function(el){
      var ok = new RegExp(el.re,'i').test(cmd);
      if(ok){ H++; items.push({s:'ok', label:el.label, why:el.why}); }
      else { items.push({s:'miss', label:el.label, why:el.why}); }
    });
    (T.bad||[]).forEach(function(bd){
      if(new RegExp(bd.re,'i').test(cmd)){ W++; items.push({s:'bad', label:bd.label, why:bd.why}); }
    });
    return {H:H,W:W,N:(T.elements||[]).length,items:items,expl:ex.expl};
  };
}

/* ---------- log viewer ---------- */
function buildLogview(w){

  } else if(L.sub){

      var H=0,W=0,items=[];
      L.clickCorrect.forEach(function(ci){

        else { items.push({s:'miss', label:'Log line '+(ci+1)+' — “'+clip(L.lines[ci],70)+'”', why:'You did not select it. '+(L.why?L.why[ci]:'')}); }
      });
      Object.keys(sel).forEach(function(k){
        var i=parseInt(k,10);
        if(sel[i] && L.clickCorrect.indexOf(i)<0){ W++; items.push({s:'bad', label:'Log line '+(i+1)+' — “'+clip(L.lines[i],70)+'”', why:(L.why&&L.why[i])||'This line does not show the behaviour asked in the question.'}); }
      });
      return {H:H,W:W,N:L.clickCorrect.length,items:items,expl:ex.expl};
    }
    return {H:0,W:0,N:1,items:[],expl:ex.expl};
  };
}

/* ---------- branching decision tree / simulation ---------- */
function buildTree(w){
  var ex = w.ex, host = w.host;
  var step = 0; var chosen = {};
  function renderStep(){
    var n = ex.steps.length;
    var s = ex.steps[step];
    if(!s._order){ s._order = shuffle(s.opts.map(function(_,i){return i;})); }
    var h = '<div><span class="stepchip">STEP '+(step+1)+' OF '+n+'</span></div>'+
            '<p class="prose" style="font-weight:600">'+fmtText(s.q)+'</p><div class="opts">';
    s._order.forEach(function(oi,k){
      h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(s.opts[oi].t)+'</span></button>';
    });
    h += '</div><div id="treeout"></div>';
    host.innerHTML = h;
    Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        var oi = parseInt(btn.getAttribute('data-i'),10);
        chosen[step] = oi;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
        var o = s.opts[oi];
        var last = (step===n-1);
        document.getElementById('treeout').innerHTML =
          '<div class="outcome"><b>RESULT OF YOUR CHOICE</b>'+fmtText(o.out)+'</div>'+
          '<button class="btn '+(last?'good':'primary')+'" id="tstep">'+(last?'Check final answer':'Confirm & continue ▸')+'</button>';
        document.getElementById('tstep').addEventListener('click', function(){
          if(last){ gradeCurrent(false); }
          else { step++; renderStep(); }
        });
      });
    });
  }
  renderStep();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.steps.forEach(function(s,i){
      var oi = chosen[i];
      var o = s.opts[oi];
      var lbl = 'Step '+(i+1)+': '+(o? clip(o.t,80) : '(no choice made)');
      if(o && o.ok){ H++; items.push({s:'ok', label:lbl, why:o.why||''}); }
      else if(o){ W++; items.push({s:'bad', label:lbl, why:o.why||''}); }
      else { items.push({s:'miss', label:lbl, why:''}); }
    });
    return {H:H,W:W,N:ex.steps.length,items:items,expl:ex.expl};
  };
}


function renderIntro(){
  var I = EXAM.intro;
  var h = '<h1>'+esc(EXAM.topicTitle)+' — '+esc(EXAM.sevName)+' practice exam</h1>';
  h += '<p class="sub">'+esc(I.tagline)+' <span id="who" style="font-weight:700"></span></p>';
  h += '<div class="card"><h2>About the ATT&CK object you will master</h2>'+I.about+'</div>';
  h += '<div class="card"><h2>Keywords covered in this exam</h2>';
  I.keywords.forEach(function(k){
    h += '<div class="kw-theme"><h3>'+esc(k.t)+'</h3><div class="kwrow">';
    k.chips.forEach(function(c){ h += '<span class="kw">'+esc(c)+'</span>'; });
    h += '</div></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2>How this exam works</h2>'+I.how+'</div>';
  h += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0">'+
       '<button class="btn primary" id="btn-start" style="font-size:1.05rem;padding:12px 26px">▶ Start the exam</button>'+
       '<span class="small">Timer '+Math.round(EXAM.timerSec/60)+' minutes · '+EX.length+' exercises · pass mark '+EXAM.passMark+'%</span></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}
function boot(){
  $('btn-pause').addEventListener('click', manualPause);
  $('btn-resume').addEventListener('click', manualResume);
  $('btn-skip').addEventListener('click', skipCurrent);
  $('btn-hint').addEventListener('click', useHint);
  renderIntro();
  renderHeader();
  updateHeaderButtons();
  setInterval(tick, 1000);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
