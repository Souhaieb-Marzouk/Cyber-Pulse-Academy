recycled code, and silence on one sensor is not evidence about another. Which artefact describes what the code actually DID?","expl":"The chain: a watering-hole-style collector (the documented G0138 Andariel pattern for T1592.002 — browser and Flash version capture) sits on your own legacy vhost; proxy evidence shows visitor-side collection; EDR silence is irrelevant because agents do not cover the web tier, and Flash being absent on workstations says nothing about the **collection** the script performs server-side. The conflict (hostile hash vs calm EDR) is resolved in favour of **the artefact that describes behaviour** — the sandbox emulation. Every branch below follows that reading: scoped containment, evidence preservation, honest attribution wording, and an M1056-grade standing fix.","study":"When reputation and telemetry disagree, adjudicate with behaviour: emulate the artefact, then scope.","steps":[{"q":"Step 1 — The sandbox hash says Andariel-grade collector; EDR is silent. Which signal wins, and on what basis?","opts":[{"t":"The sandbox behaviour verdict — it describes what the code actually does","ok":true,"why":"Emulated behaviour is primary evidence; a hash is reputation, and EDR silence here is a coverage fact, not an alibi. Behaviour resolves the conflict.","out":"You brief the CISO: collector behaviour confirmed on a legacy vhost; scoping starts now."},{"t":"EDR silence — no endpoint alerts means nothing happened","ok":false,"why":"EDR agents do not cover the web tier; absence of telemetry on one sensor never outweighs positive evidence on another.","out":"You log \"no endpoint impact\" and close; the collector keeps profiling visitors all morning."},{"t":"The hash alone — declare a confirmed Andariel operation","ok":false,"why":"A hash match supports a hypothesis, not a campaign attribution; hashes collide across recycled and shared code, so reputation is corroboration, not proof.","out":"Your report asserts Andariel; the vendor callback later shows the hash belongs to a recycled sample — credibility spent."}]},{"q":"Step 2 — The signature event is at 11:00. What happens in the next ten minutes?","opts":[{"t":"Take only the legacy vhost out of the serving path; preserve the JS and logs","ok":true,"why":"Scoped containment stops the collection at near-zero business cost; preserving the artefact and the 7-day window protects the investigation.","out":"partner-legacy is pulled from the serving path; the JS, proxy log and vhost config are hashed to the IR share."},{"t":"Emergency takedown of the whole portal estate","ok":false,"why":"Defensible for confirmed server compromise, but the evidence shows one legacy vhost; a global takedown on the morning of the signature event is self-inflicted cost.","out":"Partners cannot reach any portal; the deal team escalates before the CISO does."},{"t":"Leave it in place — EDR is clean, the ticket says decommission is coming","ok":false,"why":"Every hour of serving is another cohort of visitors profiled; decommission-someday is not a control.","out":"The vhost serves for six more hours; the post-incident review makes this the headline failure."}]},{"q":"Step 3 — Visitors were profiled. What do you do about them right now?","opts":[{"t":"Notify the IR lead and freeze proxy/vhost logs; no partner messaging yet","ok":true,"why":"Exposure is not yet scoped (server-side logs vanish at 7 days; you do not know who was hit); premature mass notification causes harm you cannot yet measure.","out":"Log preservation orders go out; partner messaging waits for the scoped list."},{"t":"Email all partners a warning immediately — transparency first","ok":false,"why":"A widely praised \"best practice\" that is wrong under time pressure: you would alarm hundreds of contacts about an exposure you have not scoped, before the IR lead even has the data.","out":"The inbox floods with partner questions the team cannot answer; legal opens a communications incident."},{"t":"Publish an advisory naming Andariel and the collector hash","ok":false,"why":"Public attribution on day one, before scoping and vendor coordination, is both an attribution and a legal risk.","out":"The advisory trends; the hash turns out to be a recycled sample; your name is on it."}]},{"q":"Step 4 — The CTI lead asks for the attribution line. What is defensible?","opts":[{"t":"Consistent with the collector behaviour reported for G0138; low confidence, no infra overlap","ok":true,"why":"Behaviour-level consistency with a documented T1592.002 procedure example, honest confidence, and the criteria that would raise it: independent evidence layers.","out":"The report ships with \"consistent with, low confidence\" — and survives the vendor callback."},{"t":"Confirmed Andariel campaign against our portal","ok":false,"why":"No infrastructure overlap, no independent evidence — one hash and a behaviour class cannot carry \"confirmed\".","out":"The confirmation is walked back within a day; the report is quoted back at you."},{"t":"Attribute to Magic Hound — they also capture user agents","ok":false,"why":"G0059 captures UAs on phishing sites — a different vector and infrastructure; technique similarity is not attribution.","out":"The CTI lead returns the draft with a one-line review: \"wrong actor, wrong vector\"."}]},{"q":"Step 5 — What is the standing fix so this cannot recur?","opts":[{"t":"Finish the decommission, minimise public exposure (M1056), add a canary script","ok":true,"why":"Removes the unowned asset, shrinks what recon can read, and plants a tripwire that fires on the next collector — the layered pre-compromise answer.","out":"The legacy vhost dies; a canary script lands; the next scan beacons into your queue, not theirs."},{"t":"Block Flash at the perimeter firewall","ok":false,"why":"Flash is already absent on managed endpoints, and the collector still harvests browser family and system language; this closes a door that is already shut.","out":"The rule is deployed, celebrated, and catches nothing — the collector keeps working."},{"t":"Add two SOC analysts to night shift","ok":false,"why":"Headcount is not a control for an unowned internet-facing asset; the gap was governance, not watch-floor capacity.","out":"Hiring opens; the next legacy vhost is discovered by an attacker first."}]}]},{"id":"x2","type":"logview","title":"Weekend staging — rebuild the incomplete chain","scenario":[["p","A service account **audit.r** (created three days ago, ticket references lost during a migration) ran overnight jobs on DC-FS01 and FIN-SQL01. The capture rolled over at 04:12 Saturday, so the perimeter record is truncated. WSUS, backups and badge printing are all ticketed. The CTI lead wants the collection-and-staging chain isolated before Monday’s hunt."],["art","ARTEFACT 1 — context","Reporting anchor: G0034 Sandworm Team has been observed collecting **lists of computers running specific software** for targeting — that staging pattern is what you are hunting. Account audit.r is NOT yet adjudicated; judge the behaviour, not the name."]],"q":"Click every log line that is part of the collection/staging chain, then Check.","hint":"The chain has four links: build the target list, harvest the inventory, pack it, ship it — and the harvest repeats on a second host.","expl":"Five lines form the chain. **Line 2** assembles the target list — a query for computers running a specific server OS, the documented Sandworm staging pattern. **Line 3** harvests the installed-software inventory to a file. **Line 5** packs it into an encrypted archive. **Line 6** ships 1.9 MB out to external infrastructure. **Line 8** repeats the harvest on a second host — scoping, not a one-off. Everything else is ticketed noise (backup, WSUS, spooler, macros), the truncated perimeter line is the documented capture gap you must reason around, and line 12 is account lifecycle context — interesting for the hunt, not part of the collection chain itself.","study":"Staging = list → harvest → pack → ship, and the harvest walks to every host the list names.","logview":{"click":true,"lines":["Fri 18:02 IT-JMP02 user=svc_backup proc=nbbackup job=weekly status=ok (ticketed)","Fri 21:14 DC-FS01 user=audit.r proc=\"adfind -f \"operatingSystem=*Server*\" name\" parent=wmiprvse out=targets.txt","Fri 21:31 DC-FS01 user=audit.r proc=\"reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall /s\" parent=wmiprvse out=sw.csv","Fri 21:47 DC-FS01 proc=spoolsv job=HR-badges status=printed (ticketed)","Fri 22:03 IT-JMP02 user=audit.r proc=\"7z a -p swinv.7z C:\\Windows\\Temp\\sw.csv\"","Fri 22:09 DC-FS01 user=audit.r net=\"POST hxxp://203[.]0[.]113[.]9/up\" bytes=1942911","Fri 22:30 DC-FS01 user=svc_wsus proc=wsussync status=ok (ticketed)","Sat 00:41 FIN-SQL01 user=audit.r proc=\"Get-WmiObject Win32_Product\" parent=wmiprvse out=sw2.csv","Sat 01:02 DC-FS01 user=svc_backup proc=\"vssadmin list writers\" status=ok (ticketed)","Sat 02:10 IT-JMP02 user=helpdesk.k proc=tagui macro=invoice-batch (ticketed)","Sat 04:12 perimeter: 203[.]0[.]113[.]9 → tcp/8443 (record truncated at capture rollover)","Sun 23:58 DC-FS01 user=audit.r last interactive logon (account created three days earlier)"],"clickCorrect":[1,2,4,5,7],"why":{"0":"Ticketed weekly backup — noise by design.","1":"Builds the list of computers running a specific OS — the Sandworm-style staging anchor.","2":"Recursive installed-software harvest to sw.csv — the T1592.002 collection act itself.","3":"Badge printing on the spooler — noise.","4":"Packing the harvest into a password-protected archive — staging for exfil.","5":"Shipping 1.9 MB to external infrastructure — the departure link.","6":"Ticketed WSUS synchronisation — noise.","7":"Second-host software inventory — the harvest walking the estate: scoping, not accident.","8":"Ticketed VSS writer check — noise.","9":"Ticketed finance macro — noise.","10":"The truncated perimeter record: real but unusable — the incomplete information you reason around, not a link you can click.","11":"Account lifecycle context for the hunt — not part of the collection chain."}}},{"id":"x3","type":"qcm","title":"23:40, nine-day freeze — the next action","scenario":[["p","**23:40 Thursday.** A regulatory change freeze starts at 00:00 and runs nine days; any unapproved change is a reportable finding. Since Tuesday, the proxy has caught nightly POSTs of software-inventory-shaped bodies from **BUILD-07** to `hxxp://cdn-updates[.]example[.]net/up` — 2–3 MB per night, always 03:12, UA `python-requests/2.25`. EDR on BUILD-07: no alerts, agent healthy. The CISO is on a flight until 06:00. Legal has hinted at a **legal hold** but nothing is signed."],["p","Three of your four options are technically defensible somewhere. Exactly one is defensible **here, now, on this evidence**."]],"q":"Choose the action you take in the next twenty minutes.","hint":"Whatever you touch at 00:05 becomes evidence about YOU first. What is reversible, and what is not?","expl":"The evidence supports nightly scripted collection from one host with an unknown owner — no exploitation, no lateral movement. The defensible next step is **escalation plus preservation**: the on-call IR lead owns the decision while the CISO is unreachable, and volatile data plus logs on BUILD-07 are preserved before anything else can touch them, ready for a legal hold. **Sinkholing** the domain is a good play in an active intrusion, but here it tips the operator, severs your own visibility into further collection, and counts as a change inside the freeze. **Reimaging** destroys the primary evidence source for a recon-stage event. **Enterprisewide forced rotation** is the reflex \"best practice\" that breaches the freeze and imposes fleet-wide disruption that the evidence does not justify — a signature MOVE that protects nothing the attacker has not already read.","study":"Under a freeze with incomplete scoping: preserve, escalate, and keep every option open.","options":[{"t":"Escalate to the IR on-call; preserve BUILD-07 volatile data and logs","why":"Correct. Reversible, freeze-clean, keeps evidence intact and puts a named decision-maker on the clock."},{"t":"Sinkhole cdn-updates[.]example[.]net at 00:05 sharp","why":"Near-miss — right in an active intrusion. Here it tips the operator, blinds you, and breaches the freeze as an unapproved change."},{"t":"Reimage BUILD-07 from the golden image before 06:00","why":"Near-miss for containment purists. It destroys the best evidence source over a recon-stage signal with no exploitation evidence."},{"t":"Force an enterprisewide password rotation at 00:05","why":"The reflex best-practice. Freeze-breaching, fleet-disrupting, and justified by nothing the evidence shows — the attacker harvested data, not credentials."}],"correct":[0]},{"id":"x4","type":"terminal","title":"Console 1 — preserve what the lawyer needs","scenario":[["p","**Environment:** bash, read-only sudo, on the IR jump host. WEB-05 is still serving production (the business refused a stop). For weeks the attacker harvested document metadata from `/srv/www/uploads`; the harvested files themselves are the artefacts counsel wants. An evidence USB is mounted read-write at `/media/ir-usb`. Console ships: `tar`, `cp`, `mv`, `dd`, `md5sum`, `sha256sum`, `exiftool`, `rm`, `shred`."],["p","**Objective (counsel’s words):** \"A copy that survives scrutiny, and the server’s state must not change by one bit. I need the documents preserved **and** proof they have not been altered since you took them.\""],["note","⏳ This console auto-submits 03:30 after it opens — the reduced timer is deliberate; preservation runs first in real incidents."]],"q":"Assemble the preservation command, run it, then Check.","hint":"Two requirements, two command stages: everything under the path goes out to the USB in one container, then the container proves its own integrity.","expl":"Canonical: **tar -czf /media/ir-usb/uploads_evidence.tgz -C /srv www/uploads && md5sum /media/ir-usb/uploads_evidence.tgz**. Stage one archives the whole tree (read-only on the source) to the external USB; stage two hashes the container so any later alteration is provable — exactly \"survives scrutiny\". Every rejected path fails a stated requirement: `exiftool` reads metadata but preserves no documents; `cp` without a hash cannot prove integrity; `dd` of a live disk takes hours while writes continue underneath; and `rm`, `shred`, `mv` or any output written back under `/srv` changes the very evidence counsel swore you would not touch. If you typed one of those, the feedback above says so plainly — that is the teaching moment this console exists for.","study":"Preserve = copy out + hash. On live evidence: read the source, write elsewhere, hash the result.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"ir@jumphost","prompt":"ir@jumphost:~$","welcome":["# target: /srv/www/uploads (live server — do not alter it)","# evidence USB: /media/ir-usb (read-write)","# console auto-submits 03:30 after opening"],"tools":["tar","cp","mv","dd","md5sum","sha256sum","exiftool","rm","shred"],"expected":"tar -czf /media/ir-usb/uploads_evidence.tgz -C /srv www/uploads && md5sum /media/ir-usb/uploads_evidence.tgz","outsim":[{"re":"^tar","out":["uploads_evidence.tgz: 1184 files, 412.6 MB compressed (ok)","(archive written to /media/ir-usb — the source tree was only read)"]},{"re":"md5sum|sha256sum","out":["b71c94ae77d02f1c88e5a4d9c2f60b31  /media/ir-usb/uploads_evidence.tgz"]},{"re":"^exiftool","out":["(metadata extracted — but the documents themselves are not preserved; counsel asked for the files)"]},{"re":"^cp","out":["(copy completed — no hash produced, so integrity cannot be proven later)"]},{"re":"^dd","out":["dd: reading /dev/sda … estimated 6+ hours on the live volume; writes continue underneath the copy"]},{"re":"^(rm|shred)","out":["files removed — the evidence is gone; this cannot be undone"]},{"re":"^mv","out":["files moved — the source tree changed; counsel was explicit about that"]}],"defaultOut":["(the command runs)"],"elements":[{"re":"\\btar\\b","label":"tool: tar (tree-preserving container)","why":"One archive holds the whole tree with structure and timestamps intact."},{"re":"ir-usb","label":"destination: /media/ir-usb (external evidence media)","why":"Output goes to the USB, never back onto the compromised host."},{"re":"uploads","label":"source: /srv/www/uploads","why":"The tree counsel named, archived in place (-C /srv www/uploads keeps paths relative)."},{"re":"md5sum|sha256sum","label":"integrity proof: hash of the archive","why":"The hash is what makes the copy survive scrutiny later."}],"parts":["`tar -czf /media/ir-usb/uploads_evidence.tgz` — one gzip container on the evidence USB.","`-C /srv www/uploads` — archive the uploads tree with clean relative paths; the source is only read.","`&& md5sum …` — stage two runs only if stage one succeeded, and prints the integrity hash."],"bad":[{"re":"\\brm\\b|shred|-delete|\\bmv\\b","label":"destructive operation on live evidence","why":"Delete, shred or move changes the source tree — the exact thing counsel forbade."},{"re":"(of=|>)\\s*/srv|-f\\s*/srv","label":"output written back onto the compromised server","why":"Writing the archive under /srv alters the evidence host and risks tipping the operator."},{"re":"dd if=/dev/","label":"raw device imaging of a live server","why":"Hours-long, and the running system keeps writing underneath — not forensically sound without taking the volume offline."}]}},{"id":"x5","type":"dnd","title":"Sort the leak into its vector","scenario":[["p","Six findings from a red-team debrief must be filed under the T1592.002 collection vector each one abuses. One finding per vector is a near-miss pair; read each artefact as the attacker would."]],"q":"Drag each finding onto the collection vector it demonstrates.","help":"Drag the chips, or click a chip and then click a bucket.","hint":"Ask who is speaking: the server names itself, the visitor announces itself, the document remembers its maker, the organisation publishes, and the planted script watches.","expl":"**Banners** — the load balancer speaks its own name and version, and NSE-style manager probes are the banner-grab cadence. **User agent strings** — the phishing form stores what the visitor announced. **File metadata** — the PDF remembers the program that made it. **Accessible data sets** — the job advert names the DLP product; the organisation published the intel itself. **Content on compromised sites** — the planted script records browser family and Flash version: the documented G0138 Andariel procedure. The near-miss pair is c3 vs c5: both touch browsers, but one is a planted script on a compromised site and the other is passive capture of a visitor’s own declaration.","study":"Five vectors, five speakers: the server, the visitor, the document, the organisation, the planted script.","zones":[{"id":"z1","label":"Server banners"},{"id":"z2","label":"User agent strings"},{"id":"z3","label":"File metadata"},{"id":"z4","label":"Accessible data sets"},{"id":"z5","label":"Content on compromised sites"}],"chips":[{"id":"c1","t":"Load balancer replies: Server: nginx/1.18.0"},{"id":"c2","t":"Job advert: \"admin experience with Symantec DLP required\""},{"id":"c3","t":"Phishing-site form stores each visitor’s User-Agent header"},{"id":"c4","t":"Portal PDF metadata: Producer: InDesign 17.2"},{"id":"c5","t":"GET /manager/html from 60 sources in 9 minutes, UA: Nmap Scripting Engine"},{"id":"c6","t":"Watering-hole JS logs browser family + Flash Player version"}],"correct":{"c1":"z1","c2":"z4","c3":"z2","c4":"z3","c5":"z1","c6":"z5"},"chipWhy":{"c1":"The server names its own software and version in a response header — the banner vector.","c2":"The organisation published the software detail itself — accessible data set.","c3":"The visitor’s own declaration, captured passively — the G0059 Magic Hound pattern.","c4":"The creating program is recorded inside the document — file metadata.","c5":"NSE probing of a management path is banner/version enumeration at scale — the active-scanning face of the banner vector.","c6":"A planted script on a (watering-hole) site recording visitor software — the G0138 Andariel pattern."}},{"id":"x6","type":"selblank","title":"The 08:00 board notice — wording discipline","scenario":[["p","Legal reviews every word before it reaches the board. One overstatement creates liability; one understatement hides a risk. Choose the defensible term for each gap."]],"q":"Complete the notice with the four defensible terms.","hint":"Statement of fact first: what was collected, what it is called, where it sits in the lifecycle, and what the evidence does — and does not — show.","expl":"**Installed software details** is what the artefacts show; \"staff passwords\" and \"network diagrams\" overstate the evidence. **T1592.002** is the behaviour; T1592.001 is hardware and M1056 is the mitigation — a category error legal would catch. **Reconnaissance** is the tactic for pre-compromise collection; Initial Access and Discovery both place the actor somewhere the evidence does not. **No evidence of** is the only supportable entry phrase: absence of evidence must be stated as exactly that, and the monitoring caveat is honest because analytic AN2020 documents a very high false-positive rate for this class — claiming \"antivirus scans only\" would hide a known blind spot.","study":"Board notices: name the behaviour, the tactic, and the limits of the evidence — nothing more.","parts":["Since Monday, an external actor has collected ",{"b":0,"o":["installed software details","staff passwords","internal network diagrams"]}," from our public web tier. The behaviour maps to ",{"b":1,"o":["T1592.002","T1592.001","M1056"]}," under the ",{"b":2,"o":["Reconnaissance","Initial Access","Discovery"]}," tactic. At this time we have ",{"b":3,"o":["no evidence of","confirmed evidence of","partial evidence of"]}," entry into the internal network; our visibility relies on banner and metadata analytics, whose documented false-positive rate is high."],"blanks":[0,1,2,3],"optsFor":{"0":["installed software details","staff passwords","internal network diagrams"],"1":["T1592.002","T1592.001","M1056"],"2":["Reconnaissance","Initial Access","Discovery"],"3":["no evidence of","confirmed evidence of","partial evidence of"]},"correct":[0,0,0,0],"why":["The artefacts show software names and versions; passwords and diagrams overstate what was collected.","T1592.002 is the software sub-technique; T1592.001 is hardware and M1056 is a mitigation, not a behaviour.","Pre-compromise collection is Reconnaissance; the actor has not entered, and Discovery needs a foothold.","Evidence discipline: say what the evidence does not show, without claiming proof of a negative beyond it."]},{"id":"x7","type":"multi","title":"What does this evidence actually support?","collapsed":true,"summary":"Six nights of scripted probing, one unresolved VPN-pool session, and an excluded scanner range — select only the supportable conclusions","scenario":[["art","ARTEFACT 1 — perimeter (six nights)","UA constant: python-requests/2.25 · requests: HEAD / + GET /server-status\nsources rotate nightly across 203[.]0[.]113[.]0/24 · no exploit payloads\n(note: /24 is a commercial cloud ASN; thousands of unrelated tenants share it)"],["art","ARTEFACT 2 — CMDB extract","Approved scanner (AcmeScan) egress: 198[.]51[.]100[.]0/24, Tue 02:00-04:00 ticketed windows.\nNo overlap with the observed range."],["art","ARTEFACT 3 — VPN edge (night 4)","One session from the concentrator’s own client-pool address to DMZ host WEB-09.\nAuth logs: retained 30 days, access request submitted — result pending."],["p","The exec committee wants a position paper tonight. Every option below is phrased the way a colleague would say it out loud."]],"q":"Select the THREE conclusions the evidence supports. The other two would embarrass you in the room.","hint":"Separate what the artefacts show, what they exclude, and what is merely pending — then check each option against all three.","expl":"**Automated tooling** — one constant UA and metronomic cadence across six nights is a script, not a person. **External, not the approved scanner** — the ranges do not overlap and the windows do not match. **The night-4 session may be attacker pivoting, pending auth logs** — that is precisely how you phrase an unresolved signal: named, bounded, and explicitly awaiting the one artefact that can resolve it. \"Sandworm Team\" has no supporting layer here (no infra overlap, no tooling signature) — a technique class is not attribution. \"Already has a foothold; isolate the DMZ\" outruns the evidence: the only internal signal is unresolved, and isolation is the expensive answer to a question the auth logs will answer for free.","study":"A defensible position paper separates shown, excluded, and pending — and prices each action.","options":[{"t":"The tooling is automated and scripted","why":"Correct. Identical UA and cadence over six nights is machine behaviour."},{"t":"The activity is external and is not the approved scanner","why":"Correct. Different /24, different schedule — the CMDB excludes AcmeScan cleanly."},{"t":"The night-4 VPN-pool session may be pivoting — pending auth logs","why":"Correct. Named, bounded, and explicitly waiting on the artefact that resolves it."},{"t":"The actor is Sandworm Team (G0034)","why":"Wrong. No infrastructure, tooling or targeting overlap; a collection pattern is common property, not a signature."},{"t":"The actor already holds a DMZ foothold; isolate the DMZ now","why":"Wrong. The only internal signal is unresolved; isolation buys certainty at maximum cost while the auth logs answer for free."}],"correct":[0,1,2]},{"id":"x8","type":"order","title":"True order across unsynchronised clocks","collapsed":true,"summary":"WAF clock runs 7 minutes fast — reconstruct the true sequence before the report goes out","scenario":[["art","ARTEFACT 1 — change ticket #9023","\"Known issue: WAF appliance clock runs 7 minutes FAST (NTP drift, vendor fix scheduled next window).\nAll other sources — intel-vps telemetry, web01, WSUS, VPN gateway — are NTP-synced.\""],["p","The report’s timeline must survive a hostile expert witness. The WAF stamps below are as-recorded; the truth is seven minutes earlier for every WAF line. Order the six events by when they **actually happened**."]],"q":"Drag the events into true chronological order (earliest at top).","rankNote":"WAF lines are stamped 7 minutes fast. The routine sync is exactly what its stamp says.","hint":"Subtract seven from the WAF stamps first, then sort everything by the corrected times.","expl":"Correct the WAF skew first: its 02:14 stamp is a true 02:07, and its 02:40 stamp is a true 02:33. The true order: banner probes begin (02:07) → CVE lookup on the actor’s own NTP-synced host (02:19) → the metadata-bearing document fetched (02:26) → the routine WSUS sync (02:31, exactly on time) → the /manager/html burst (true 02:33) → the VPN login attempt (02:47). The naive order — trusting WAF stamps at face value — swaps the CVE lookup and the banner probes, and puts the manager burst before the document fetch: exactly the error a defence expert would use to break the timeline. Note how the chain still reads correctly once corrected: probes, then the actor cross-references versions (T1597), the victim document is fetched for metadata, the burst escalates, and the access attempt comes last (T1133).","study":"Correlate across hosts only after normalising clocks — a fast clock relocates events in the story.","correct":["WAF 02:14 — banner probes begin on tcp/80,443 (WAF clock fast by 7 min)","intel-vps 02:19 — CVE lookup for Apache 2.4.49 (NTP-synced)","web01 02:26 — crawler fetches Q3-report.pdf for its metadata (NTP-synced)","WSUS 02:31 — routine update sync (NTP-synced)","WAF 02:40 — /manager/html probe burst (WAF clock fast by 7 min)","VPN 02:47 — login attempt from new tooling (NTP-synced)"],"itemWhy":["02:14 minus 7 minutes = true 02:07 — the first movement.","02:19 on a synced clock beats a corrected 02:26.","02:26 true — the document fetch follows the version discovery that motivated it.","02:31 exactly as stamped — routine, ticketed, and correctly placed.","02:40 minus 7 minutes = true 02:33 — just after the sync, before the login attempt.","02:47 synced — the last event; the chain ends in an access attempt."]},{"id":"x9","type":"qcm","title":"Risk committee — the freeze wins, or do you?","scenario":[["art","ARTEFACT 1 — the exposure","Vendor portal (2016-era, EOL component) leaks software details via banners and\ndocument metadata. Nightly external harvesting is confirmed for 11 days."],["art","ARTEFACT 2 — the constraints","Vendor patch: first available slot is after the 9-day regulatory change freeze.\nBusiness veto: zero downtime during the freeze (filing week).\nCompensating controls available at no downtime: banner suppression on two\nvirtual hosts, canary documents, daily analytic review, risk-register entry."]],"q":"Which decision do you take to the risk committee?","hint":"The committee votes on records, not intentions — what does each option leave behind on paper?","expl":"The defensible committee position is a **documented, temporary risk acceptance with compensating controls** and remediation scheduled the day the freeze lifts. An emergency patch tonight breaches the freeze during filing week — the regulator sees your change record before it sees your risk register, and the \"best practice\" of always-patch-now is the wrong answer in this specific governance context. Decommissioning the portal mid-freeze has the same breach problem plus a business cost. And an **undocumented** acceptance — \"revisit next quarter\" — is not acceptance at all: it is the finding the auditors will write for you. The paper trail is the control; the patch is already scheduled.","study":"Risk acceptance is a dated, signed, compensating-control record — not a shrug.","options":[{"t":"Documented acceptance + compensating controls, patch after the freeze","why":"Correct. Freeze-clean, downtime-free, auditable, and the remediation date is committed in writing."},{"t":"Emergency patch tonight despite the active freeze","why":"Near-miss — right instinct in an exploitation event. Here it converts a recon problem into a compliance finding during filing week."},{"t":"Decommission the portal during the regulatory freeze","why":"Wrong twice: the same freeze breach, plus a business cost the veto explicitly rules out."},{"t":"Accept silently and promise to revisit next quarter","why":"Wrong. Undocumented acceptance is an audit finding wearing a smile — nothing records the decision, the controls, or the date."}],"correct":[0]},{"id":"x10","type":"tree","title":"Vendor installer — supply chain or sloppiness?","collapsed":true,"summary":"A signed installer leaks build-host names in its metadata; a researcher cries supply chain; 30% of the estate is unmanaged","scenario":[["art","ARTEFACT 1 — the installer","Vendor \"DocuForge Suite 9.2\" signed installer, published last night.\nFile metadata: Producer string names three internal build hosts\n(BLD-VND-01..03) and tool versions of the vendor’s build chain."],["art","ARTEFACT 2 — the noise","A researcher’s post (240 reposts): \"supply chain attack — build hosts in metadata!\"\nNo downstream reporting; no binary diff published; vendor silent so far."],["art","ARTEFACT 3 — your estate","EDR: no alerts. Managed endpoints (70%): deployment records show only the\nprevious 9.1 build. Unmanaged endpoints (30%): deployment state unknown."],["p","Counsel’s framing: \"Do not defame the vendor, and do not miss a real supply-chain event. Both failures are career-ending.\" The T1592.002 link is direct: the metadata field is the same leak this technique abuses — today it burned the vendor; tomorrow it burns you."]],"q":"Work the four branches.","hint":"Metadata proves what was recorded, not what was done. And your estate question splits by management status, not by panic level.","expl":"The chain: the artefact is a metadata-hygiene observation — observable, common, and **not evidence of compromise** (this is the same T1592.002 metadata class, appearing as someone else’s incident). The researcher’s post is noise with reach. The defensible path verifies your own estate from authoritative records (deployment hashes) rather than trusting silence or blocking a vendor at scale, treats the 30% unmanaged gap as an ITAM reconciliation task instead of a fleet-wide panic scan during finance close, and keeps the external posture private and coordinated — publication before vendor contact is both a legal and an operational mistake. If the hashes diverge, the tree reopens at step 2 with a real incident.","study":"Metadata leaks tell you the vendor forgot a flag — they do not tell you the vendor was breached.","steps":[{"q":"Step 1 — What does the metadata actually prove?","opts":[{"t":"Build hygiene only — recorded facts, not actions; common and benign by itself","ok":true,"why":"A Producer string proves the build environment recorded its own names — the same field T1592.002 hunting reads. It evidences no tampering.","out":"You log \"metadata hygiene issue — vendor notified privately.\" The tree continues calmly."},{"t":"Proof of a supply-chain compromise of DocuForge 9.2","ok":false,"why":"Nothing shows the binary was altered; the metadata is consistent with ordinary sloppy builds.","out":"The block goes out; the vendor’s PSIRT answers in ninety minutes with a clean diff — and your escalation memo."},{"t":"Proof the vendor is malicious","ok":false,"why":"Attributing intent from a metadata field is indefensible; even a compromise would not prove malice by the vendor.","out":"Counsel calls before the press does."}]},{"q":"Step 2 — What do you verify first on your own estate?","opts":[{"t":"Hashes: what the official download serves vs what managed endpoints actually received","ok":true,"why":"Deployment records plus a fresh official hash answer \"is our estate running what the vendor published\" — the core supply-chain question — from authoritative data.","out":"Nine minutes later: 100% of managed endpoints match the official 9.1 hash; nothing received 9.2 at all."},{"t":"Block the vendor domain enterprisewide first","ok":false,"why":"Defensible for confirmed compromise; here it stops a business-critical vendor on the strength of a metadata field — real cost, no evidence.","out":"The nightly integration batch fails; the vendor’s account manager is now on the incident call."},{"t":"Wait for EDR — it said no alerts","ok":false,"why":"EDR covers managed endpoints and detects execution, not deployment-state questions; silence here answers nothing about 9.2.","out":"The day passes; nobody can state what the unmanaged 30% is running."}]},{"q":"Step 3 — The unmanaged 30%. Proportionate move?","opts":[{"t":"Send the gap to ITAM for emergency reconciliation; no panic scans at 08:00","ok":true,"why":"The least-aggressive action that actually closes the question: enumerate what the unmanaged hosts run, quietly, through the owners.","out":"By noon ITAM reports 214 unmanaged hosts; 12 received 9.2 — all from the official URL, hashes matching."},{"t":"Force a full AV sweep fleet-wide now — finance close can wait","ok":false,"why":"The reflex best-practice that is wrong here: it degrades endpoint performance during close, and AV sweeps answer execution questions, not provenance questions.","out":"Two trading applications choke during close; the sweep finds nothing because there is nothing to find."},{"t":"Exclude the unmanaged 30% from the assessment","ok":false,"why":"Exactly the gap an attacker would live in; excluding it makes the all-clear letter a fiction.","out":"The report ships with a hole in it; the auditors find the hole before you do."}]},{"q":"Step 4 — External posture, today?","opts":[{"t":"Coordinate privately with the vendor PSIRT; hold publication until facts settle","ok":true,"why":"Responsible coordination keeps you credible in both failure modes counsel named — defamation and missed compromise.","out":"The PSIRT responds in hours with build records; a joint statement is drafted on your terms."},{"t":"Publish the hashes and the metadata now","ok":false,"why":"Publication before vendor contact tips any real operator, defames on thin evidence, and forfeits the coordinated-disclosure position.","out":"Your post is quoted by the researcher; the metadata sample turns out to be three years old."},{"t":"Report the vendor to the regulator immediately","ok":false,"why":"With no evidence of compromise there is no reportable event — only a grievance, and it is on record forever.","out":"The regulator asks for the technical basis; the file closes with a policy note on premature referrals."}]}]},{"id":"x11","type":"rank","title":"Rank the hypotheses (ACH, one shot)","collapsed":true,"summary":"Four hypotheses, six nights of evidence — rank by support, not by noise","scenario":[["art","ARTEFACT SET (six nights, consolidated)","1 · UA constant python-requests/2.25; cadence nightly 03:12±3 min\n2 · targets: only the 12 hosts named in your public network-map PDF (published 2 months ago)\n3 · sources: rotating hosts in one cloud /24; approved scanner range excluded\n4 · one unresolved VPN-pool session (night 4); auth logs pending\n5 · no payloads, no auth failures, no exploit content"]],"q":"Rank the four hypotheses, Rank 1 = best supported by THIS evidence set.","rankNote":"Rank 1 = most supported. Drag or use the arrows. Support is judged on the five consolidated facts only.","hint":"Fact 2 is the discriminator: who reads a published map before visiting exactly those hosts?","expl":"**Rank 1 — targeted collection using your own published map:** fact 2 is the strongest single signal — the actor’s target list *is* your published target list, which fits the accessible-data-sets chain (map → hosts → software inventory) perfectly. **Rank 2 — automated mass scan:** fact 1 fits (scripted cadence, constant UA), but mass scans are broad and indiscriminate; twelve map-derived targets cut this hypothesis down without killing it. **Rank 3 — compromised partner reselling access:** the only support is the unresolved night-4 session — possible, pending, one leg to stand on. **Rank 4 — rogue insider:** nothing internal supports it — every observed source is external, and the audit trail shows no internal tooling; it survives on drama alone. The exercise is classic ACH discipline: the discriminator fact (2) lifts one hypothesis and demotes another that shares every other fact.","study":"Find the fact the hypotheses disagree about, and let it rank them.","correct":["H2 — Targeted collection using our published network map","H1 — Automated mass internet scan from rented cloud hosts","H3 — Compromised partner reselling access into the VPN pool","H4 — Rogue insider misusing corporate tooling"],"itemWhy":["The target list matches the published map exactly — targeting, not chance; the datasets chain fits.","Scripted cadence and constant UA fit — but twelve fixed targets contradict \"mass scan\".","One unresolved session is a thread, not a case; it stays pending the auth logs.","Every observed source is external; no internal telemetry supports it at all."]},{"id":"x12","type":"logview","title":"Proxy log, then the interpretation call","scenario":[["p","BUILD-07 again — but judge only what the proxy shows. Marketing pixels, printer update checks and sync traffic are all ticketed. One request line breaks the pattern."]],"q":"After reading the log, choose the single best-supported interpretation.","hint":"Count the nights, the hours, the sizes — and note which request does NOT look like the others.","expl":"The log shows **three consecutive nights of large POSTs from BUILD-07 at 03:12** with software-inventory-shaped sizes — a scripted cadence, not browsing — plus **one 04:01 run dressed as Mozilla/5.0**: an impersonated-browser attempt, which is itself a signature of intent. \"Human browsing noise\" ignores size and cadence; \"backup misconfiguration\" fails on the schedule (the ticketed backup runs 22:00, on a different host); \"EDR alert confirms malware\" cites evidence that does not exist — there is no EDR alert in the set, and inventing one is the failure mode this exercise exists to catch. The defensible call names the pattern, the anomaly, and nothing more.","study":"Interpretations must cite artefacts that exist. \"EDR confirms\" with no EDR alert is a fiction.","logview":{"click":false,"lines":["Mon 03:12 BUILD-07 → cdn-updates[.]example[.]net:80  POST 2100112 bytes  UA=python-requests/2.25","Mon 09:15 any-host → cdn-marketing[.]example/pixel.gif  GET 1 KB  UA=Mozilla/5.0","Tue 03:12 BUILD-07 → cdn-updates[.]example[.]net:80  POST 2488311 bytes  UA=python-requests/2.25","Tue 11:40 PRN-02 → updates.hp[.]example  GET 4 MB  UA=HPE-Update (ticketed)","Wed 03:11 BUILD-07 → cdn-updates[.]example[.]net:80  POST 2304189 bytes  UA=python-requests/2.25","Wed 22:00 FS-01 → backup-infra[.]internal  ticketed job (different host, different window)","Thu 04:01 BUILD-07 → cdn-updates[.]example[.]net:80  POST 2252800 bytes  UA=Mozilla/5.0 (Windows NT 10.0; Win64; x64)","Thu 10:02 any-host → m365-sync[.]example  GET/POST sync (ticketed)"],"sub":{"type":"qcm","q":"Which single interpretation is best supported by the log alone?","options":[{"t":"Nightly scripted collection from BUILD-07, plus one impersonated-browser run","why":"Correct. Three cadenced nights plus a UA anomaly is a pattern with an intent signal — exactly what the log shows."},{"t":"Human browsing noise; the sizes are coincidence","why":"Wrong. Browsing does not repeat at 03:12 with multi-megabyte POST bodies."},{"t":"Backup job misconfiguration sending to the wrong host","why":"Wrong. The ticketed backup is a different host in a different window; these POSTs are their own pattern."},{"t":"The EDR alert confirms malware on BUILD-07","why":"Wrong. There is no EDR alert in this evidence set — the interpretation invents an artefact, which is the cardinal sin."}],"correct":[0]}}},{"id":"x13","type":"match","title":"Which sensor sees which vector?","scenario":[["p","Detection engineering review. Five telemetry sources, five T1592.002 collection vectors. Each source can reliably see exactly one of them — mispaired sources are how vectors end up uncovered while budgets look spent."]],"q":"Match each telemetry source to the collection vector it can actually see.","help":"Drag a chip onto its source box, or click a chip and then click a box.","hint":"Follow the data: where does each artefact physically travel, and which sensor stands on that path?","expl":"**Web server access logs** see the visitor’s declaration — rare user agents and banner-probe cadence. **Outbound proxy / DLP** stand on the egress path where collected inventories and metadata-bearing documents leave. **HR and procurement publishing review** is the control that catches job adverts and invoices naming the estate *before* publication — the only pre-publication sensor for the data-sets vector. **WAF / client-side telemetry** sees the injected collector being fetched and firing in visitors’ browsers. **Mail gateway + attachment sandbox** sees the phishing lures that ask for software details. Every mispair is plausible in a budget meeting — which is exactly why the pairing belongs to the detection engineer.","study":"Coverage = vector × sensor-on-path. If nothing stands where the data flows, the vector is dark.","left":["Web server access logs","Outbound proxy / DLP","HR and procurement publishing review","WAF / client-side telemetry","Mail gateway + attachment sandbox"],"right":["rare user agents and banner-probe cadence","inventories and documents with metadata leaving the estate","job adverts and invoices that name the software estate","visitor fetches and execution of an injected collector script","phishing lures that ask recipients for software details"],"correct":[0,1,2,3,4],"chipWhy":{"r0":"The visitor’s UA and the probe cadence are recorded by the web server itself.","r1":"Egress is the one path every collected dataset must cross to leave.","r2":"Only a pre-publication review can catch the estate naming itself in adverts and invoices.","r3":"The collector is fetched and runs in the browser — client-side and WAF telemetry live there.","r4":"Lures asking for software details arrive by mail; the gateway and sandbox see them first."}},{"id":"x14","type":"multi","title":"Tune the analytic to survive 40k events/day","scenario":[["art","ARTEFACT 1 — draft analytic \"banner-ua-collection\"","MATCH: HEAD / OR GET /server-status OR UA ∉ browser-baseline\nDRAFT VOLUME ESTIMATE: 41,000 events/day (marketing crawlers, monitors,\nMSP scans, partner health checks — all legitimate)\nGOAL: survive AN2020’s documented very-high occurrence and false-positive rate"],["art","ARTEFACT 2 — environment facts","MSP approved scanner: UA \"AcmeScan/3.1\", Tue 02:00-04:00, ticketed.\nPartner health checks: fixed 6 UA strings, hourly.\nCanary documents: available, unadvertised URLs, never fetched by anyone legitimate."]],"q":"Select the THREE components the analytic needs to survive production.","hint":"The estimate is 41k/day. Name what separates the actor’s pattern from each documented legitimate population — including the ones nobody pointed at.","expl":"**Source dedupe per rolling window** collapses the 41k raw events into distinct behaviours — the only way a signal can exist above the occurrence rate. **Baselining the MSP scanner** removes the loudest legitimate look-alike (and its ticketed hours) — the near-miss is tuning only your own assets and letting the MSP re-teach you this lesson monthly. **Canary documents** are the discriminator no crawl pattern can fake: legitimate populations never fetch unadvertised URLs, so a canary hit converts \"probably a crawler\" into \"targeted collection\" with near-zero false positives. Alerting on every HEAD request is the draft’s own 41k/day headline. Sampling down retention destroys the evidence you would need for exactly the chains these exercises built. Critical-severity auto-isolation is h7’s flaw reborn: automated disruption on a noisy recon signal.","study":"Survival tuning: collapse volume, baseline the legitimate, and plant the discriminator.","options":[{"t":"Dedupe by source per rolling window before alerting","why":"Correct. Turns 41k events into distinct behaviours the queue can actually judge."},{"t":"Baseline the MSP scanner UA and its ticketed hours","why":"Correct. The loudest legitimate look-alike must be known by name, not discovered by pager."},{"t":"Canary documents as the targeted-vs-ambient discriminator","why":"Correct. Unadvertised URLs give a near-zero-FP tripwire that crawls cannot fake."},{"t":"Alert on every single HEAD request received","why":"Wrong. That IS the 41,000 events/day — the analytic would drown in its own headline."},{"t":"Sample down log retention to cut the noise","why":"Wrong. Retention is evidence; the chains you investigated this week died without it."},{"t":"Critical severity + auto-isolation on every match","why":"Wrong. Automated disruption on a high-FP recon signal is self-inflicted outage at scale."}],"correct":[0,1,2]},{"id":"x15","type":"terminal","title":"Console 2 — quiet read on a live host","scenario":[["p","**Environment:** your IR workstation, DA-signed emergency authorisation in hand. WEB-05 is **live and the operator is likely present** — interactive logons are visible to them. The remote registry service on WEB-05 is confirmed running and is already within your approved access scope. Legal needs the installed-software versions for CVE mapping **without** writing anything to the host and **without** generating a new authentication event beyond that scope. Console ships: `reg`, `reg.exe`, `wmic`, `psexec`, `winrs`, `powershell`, `shutdown`, `tasklist`."],["p","**Objective (scope memo):** \"Read the software inventory. Zero writes. Zero new logon events. Nothing the operator would notice.\""],["note","⏳ This console auto-submits 04:00 after it opens. Two of the tempting commands announce you; one of them reconfigures the host."]],"q":"Type the quiet, read-only enumeration command, run it, then Check.","hint":"The service already open to you answers questions without logging you in. Everything that authenticates as you is in the memo’s blast radius.","expl":"Canonical: **reg query \\\\WEB-05\\HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall /s**. The remote registry path is already within your approved scope: it reads the uninstall keys (names and DisplayVersion strings — exactly what CVE mapping needs), writes nothing, and generates no new authentication event. Every rejected path fails the memo: `wmic … product` (Win32_Product) **triggers MSI reconfiguration** — three products \"repaired\" themselves and thousands of events landed on a live, watched host; `psexec`/`winrs`/`Invoke-Command` install a service and authenticate interactively — precisely the notice an attentive operator watches for; `shutdown` destroys volatile evidence; and delete-class commands are evidence destruction, full stop. If the MSI-reconfiguration line appeared in your console output, that is the lesson: on live hosts, the quietest command is the one that only reads.","study":"On a watched host: use the service already in scope, read only, and never let a query repair anything.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"ir@ir-ws","prompt":"PS C:\\>","welcome":["# WEB-05: live, operator likely present, remote registry IN approved scope","# memo: zero writes · zero new logon events · console auto-submits 04:00 after opening"],"tools":["reg","reg.exe","wmic","psexec","winrs","powershell","shutdown","tasklist"],"expected":"reg query \\\\WEB-05\\HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall /s","outsim":[{"re":"^reg(\\.exe)? query.*web-05","out":["HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ApacheHTTPServer","    DisplayVersion    REG_SZ    2.4.49","HKEY_LOCAL_MACHINE\\...\\Uninstall\\{9A2B…}","    DisplayVersion    REG_SZ    14.3.2 (read-only — nothing written, no logon event)"]},{"re":"^wmic","out":["Win32_Product: MSI RECONFIGURATION of 3 products triggered","21429 events written to WEB-05 — the operator now has something to watch"]},{"re":"^(psexec|winrs)","out":["PSEXESVC installed on WEB-05; interactive logon event written — you just announced yourself"]},{"re":"invoke-command|enter-pssession","out":["PowerShell remoting session opened — a new authenticated logon, outside the approved scope"]},{"re":"^shutdown","out":["WEB-05 is going down — volatile evidence lost, operator fully alerted"]},{"re":"^tasklist","out":["(process list only — no installed-software versions; the CVE map stays empty)"]}],"defaultOut":["(the command runs)"],"elements":[{"re":"^reg(\\.exe)? query","label":"tool: reg query (registry read, no authentication)","why":"Uses the already-in-scope remote registry service: read-only, quiet."},{"re":"web-05","label":"target: \\\\WEB-05 (remote node)","why":"The live host named in the memo."},{"re":"uninstall","label":"key: CurrentVersion\\Uninstall","why":"Where installed programs expose their names and DisplayVersion strings."},{"re":"/s","label":"recursion: /s","why":"Without it you get only key names — no DisplayVersion values to map CVEs against."}],"parts":["`reg query` — read-only registry access over the in-scope remote registry service.","`\\\\WEB-05` — the remote node; no interactive authentication is performed.","`HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall` — the installed-programs key.","`/s` — recursive: pulls DisplayVersion for every product, which the CVE map needs."],"bad":[{"re":"^wmic|\\bproduct\\b","label":"wmic product (Win32_Product)","why":"Triggers MSI reconfiguration — real state change plus an event storm on a watched host."},{"re":"psexec|winrs|invoke-command|enter-pssession","label":"interactive remote shell","why":"Installs a service and authenticates you — the exact notice the memo forbade."},{"re":"shutdown|restart-computer","label":"reboot / shutdown","why":"Destroys volatile evidence and alerts everyone at once."},{"re":"\\bdel\\b|\\brd\\b|remove-item","label":"delete-class command","why":"Evidence destruction on a live host — indefensible in every world."}]}},{"id":"x16","type":"qcm","title":"Which source wins — and what that means?","scenario":[["art","ARTEFACT 1 — EDR console (DMZ subnet)","Zero enumeration processes on all DMZ hosts for the entire window.\nNo alerts, no suspicious parents, no command lines of interest."],["art","ARTEFACT 2 — network capture (same window)","Complete software inventory — names and versions of 41 DMZ hosts —\nexiting via one POST to 203[.]0[.]113[.]9. Captured in full, no gaps."],["art","ARTEFACT 3 — maintenance calendar","\"EDR agent upgrade — DMZ wave 2, this window (agents offline during rollout)\""]],"q":"The two sources contradict. Which statement is correct?","hint":"One source reports activity; the other reports a condition. A condition is not an alibi.","expl":"The sources do not actually cancel: the capture **proves collection happened**, while EDR silence — explained by its own maintenance calendar — **proves only that EDR saw nothing**. Absence of telemetry is not absence of activity; treating a blind sensor as an alibi is the classic DMZ failure. The correct position trusts the network evidence (positive, complete, independent of the blind sensor), scopes the DMZ as exposed to collection, and verifies agent health so the next window does not repeat the blindness. \"Trust EDR, call the capture a false positive\" elevates a maintenance condition over captured bytes. \"Duplicate of the EDR alert\" invents an alert that does not exist. \"Sources cancel out\" is the give-up answer — proven presence always outranks unproven coverage.","study":"Proven presence beats unproven absence — verify the sensor before you let its silence speak.","options":[{"t":"Trust the capture: the DMZ was collected; verify EDR agent health","why":"Correct. Positive, complete evidence outranks a sensor whose calendar explains its own blindness."},{"t":"Trust EDR silence; the capture is a false positive","why":"Near-miss — the calm-looking call. It lets a maintenance window testify that nothing happened."},{"t":"File it as a duplicate of the EDR alert","why":"Wrong. There is no EDR alert to duplicate; the filing invents an artefact."},{"t":"Close as unknown — the sources cancel each other","why":"Wrong. They do not cancel: one proves activity, the other proves only blindness."}],"correct":[0]}],"intro":{"tagline":"Expert tier: chained concepts, conflicting signals, senior decisions under pressure.","about":"\n<p><b>T1592.002 — Software</b> is a <b>sub-technique</b> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a public catalogue that describes what real attackers do. A <b>sub-technique</b> is one specific way an attacker works. Its parent technique is <b>T1592 Gather Victim Host Information</b>, and its siblings are <b>.001 Hardware</b>, <b>.003 Firmware</b> and <b>.004 Client Configurations</b>. The sub-technique sits in the <b>Reconnaissance</b> tactic (TA0043) and its platform is <b>PRE</b> — pre-compromise, meaning \"before the attacker gets in\". It describes an attacker learning which <b>programs and versions</b> run on the victim's hosts, including <b>defensive components</b> such as antivirus or a SIEM (a SIEM is a system that collects security alerts).</p>\n<p>How is it collected? Attackers read <b>server banners</b> (the short \"hello, I am Apache 2.4.49\" message a server sends), capture <b>user agent strings</b> (the text a browser or tool sends with each visit), plant <b>scripts on compromised sites</b> that record visitors, read <b>file metadata</b> (small extra information inside files, like \"made with Word 2013\") and mine <b>accessible data sets</b> such as job adverts, network maps, assessment reports, resumes and purchase invoices. Versions are then cross-referenced with public <b>CVE</b> databases (a CVE is a public entry for a known vulnerability) to plan exploitation.</p>\n<p>Where you will meet it at work: a <b>SOC analyst</b> triages scanning alerts; a <b>CTI analyst</b> reports it with the right ID and confidence; a <b>detection engineer</b> tunes the analytics under detection strategy <b>DET0888</b>, whose ATT&amp;CK analytic <b>AN2020</b> documents a <b>very high occurrence and false-positive rate</b>; a <b>vulnerability manager</b> maps exposed versions to CVEs; an <b>incident responder</b> reads software listing as preparation for intrusion; a <b>red teamer</b> replicates it under authorisation; a <b>GRC analyst</b> maps mitigation <b>M1056 Pre-compromise</b> — you cannot stop outside spying, but you can share less. Documented real users you must recognise: <b>Andariel (G0138)</b>, <b>Magic Hound (G0059)</b>, <b>Sandworm Team (G0034)</b> and the <b>Anthropic AI-orchestrated Campaign (C0062)</b>.</p>\n<p>This is the <b>EXTREMELY HARD</b> tier. Every exercise chains three or more concepts, and every set contains at least one <b>conflicting or ambiguous signal</b> that you must resolve explicitly, one piece of <b>irrelevant noise</b>, and one piece of <b>incomplete information</b> you must reason around. Some correct answers are \"gather more evidence\" or \"escalate\". Some correct actions carry a real cost you must accept; some widely used \"best practices\" are wrong here. The hint (if you dare) only restates a constraint — it never names the answer.</p>\n","keywords":[{"t":"Chain & lifecycle","chips":["T1592.002 → T1597 CVE lookup","T1587/T1588 capabilities","T1195 supply chain","T1133 external remote services","PRE · TA0043"]},{"t":"Vectors under pressure","chips":["banners","user agents","file metadata → CVE","accessible data sets","compromised-site scripts"]},{"t":"Actors & procedures","chips":["G0138 Andariel","G0059 Magic Hound","G0034 Sandworm Team","C0062 Anthropic campaign"]},{"t":"Defence & governance","chips":["M1056 pre-compromise","DET0888 / AN2020 FP rate","canary documents","legal hold","risk acceptance"]},{"t":"Senior decision skills","chips":["conflicting signals","least-cost confirmation","hypothesis ranking","telemetry gaps","hint = constraint only"]}],"how":"\n<p><b>Goal:</b> score at least <b>70%</b> to pass. This is the <b>EXTREMELY HARD</b> tier: three or more chained concepts per exercise, at least one genuinely ambiguous or conflicting signal to resolve, branching decisions where a later step depends on your earlier interpretation, and stakeholder-style pressure language instead of tidy questions.</p>\n<p><b>Exercise types:</b> multi-step decision trees, log-viewer triage with decoys and truncated records, hypothesis ranking, evidence-to-support judgement, detection tuning, timeline reconstruction across <b>unsynchronised clocks</b>, board/legal wording discipline, and <b>two terminal exercises</b> (non-adjacent, different skills) that run under a <b>reduced console timer</b> — one embeds a safe-vs-destructive choice where the wrong command destroys evidence.</p>\n<p><b>Partial credit:</b> multi-item exercises score (correct − wrong) ÷ items. Wrong selections subtract; selecting everything is zero; single-answer exercises are pass/fail. A hint costs 10% of that exercise's credit and only restates a constraint you may have missed.</p>\n<p><b>Check and the timer:</b> <b>Check</b> stops the timer automatically for unlimited feedback reading; it resumes on <b>Next</b>. In branching exercises only the final Check pauses the timer. <b>Pause</b> hides the exercise for a normal break. Console timers are shown on screen before the exercise starts and auto-submit when they run out.</p>\n<p><b>Skipping:</b> skipped exercises wait in a pool and can be answered until the timer ends; skipped-and-never-answered ones are excluded from the score. <b>Retake</b> reshuffles everything.</p>\n"}};
