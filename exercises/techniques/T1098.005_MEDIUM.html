var META = {"topicId":"t1098.005","batch":2,"title":"T1098.005 Device Registration — MEDIUM","difficulty":"medium","questionCount":16,"estimatedMinutes":35,"passMark":70,"sevName":"MEDIUM","page_title":"T1098.005 — MEDIUM practice exam"};
var INTRO = {"title":"T1098.005 — MEDIUM practice exam","object":"ATT&CK object: T1098.005 — Account Manipulation: Device Registration (a Sub-Technique)","partLabel":"","learn":["This is the <b>MEDIUM</b> level for <b>T1098.005 — Account Manipulation: Device Registration</b>, a Sub-Technique of T1098 in the MITRE ATT&amp;CK framework. The EASY level taught you the basics: an attacker with a stolen password can add their <b>own device</b> to an MFA system (Duo, Okta) or to <b>Microsoft Entra ID</b> with <b>Microsoft Intune</b>, and the device then looks trusted.","At this level you combine <b>two ideas at a time</b>. You will read a <code class=\"inline\">dsregcmd</code> status excerpt and decide what to do next. You will tell apart <b>registered</b>, <b>joined</b> and <b>enrolled</b> devices. You will map raw log lines to <b>data sources</b> a detection engineer needs, and you will tune a detection so onboarding noise does not bury real attacks. You will also write one real defender command in a fake PowerShell console.","In real work these are the daily tasks of a <b>SOC analyst</b> (triage and escalation), a <b>detection engineer</b> (turning the ATT&amp;CK detection strategy DET0036 into working alerts), an <b>identity team member</b> (self-enrollment settings and conditional access), and an <b>incident responder</b> (containment of rogue devices). The tools you will touch: Entra ID audit logs, sign-in logs, device management consoles, MFA admin panels, and PowerShell.","The risks stay the same as on the ATT&amp;CK page: <b>persistence</b> and <b>privilege escalation</b>, <b>bypassing MFA and conditional access</b>, believable <b>internal spearphishing</b> from a trusted device, and even <b>service exhaustion</b> when huge numbers of devices are registered. Each exercise makes you connect two facts — identify the behaviour, then choose the correct reaction to it."],"keywords":[{"theme":"Technique & detection strategy","items":["Device Registration (T1098.005)","DET0036 suspicious device registration","AN0103 self-enrollment portals (Entra, Okta, Duo)","AN0104 Windows / Intune registration pipeline"]},{"theme":"Device states & platforms","items":["registered (Workplace Join)","Entra joined","Intune enrolled / compliant","Identity Provider, Windows"]},{"theme":"Telemetry & data sources","items":["Entra ID audit log events","sign-in logs with device details","process creation (dsregcmd)","device management logs"]},{"theme":"Mitigations & policy","items":["M1032 Multi-factor Authentication","temporary access pass","trusted locations","restricting who may register devices"]},{"theme":"ATT&CK placement","items":["Persistence, Privilege Escalation","T1098.001 Additional Cloud Credentials","T1098.003 Additional Cloud Roles","T1098.004 SSH Authorized Keys"]}],"how":["<b>Pass mark: 70%</b>, computed over the exercises you actually answered (skipped-and-never-answered are excluded from both sides).","<b>16 exercises, two connected ideas each.</b> Types in this file: single and multi-select questions, matching, fill-in-the-blank with a word bank, click-to-place drag &amp; drop, ordering and priority ranking, a log viewer with a filter box, a SOC triage queue, and <b>one PowerShell terminal exercise</b> where you type a real defender command.","<b>Timer:</b> a 35-minute countdown. <b>⏸ Pause</b> is a real break: timer stops, exercise hidden, Resume brings it back.","<b>Check buys free thinking time:</b> pressing <b>✓ Check</b> stops the timer automatically ('⏸ PAUSED — reviewing feedback'). Read the feedback and the explanation as long as you want — the timer resumes only on <b>Next</b>.","<b>Partial credit:</b> multi-item exercises score each item: credit = max(0, (H − W) ÷ N). Selecting everything scores zero, because wrong items cancel correct ones.","<b>Hint:</b> one per exercise, −10% of that exercise's credit. It narrows the direction, it does not give the answer.","<b>Skip:</b> every exercise can be skipped. Before finishing you get a review screen where you can answer skipped exercises while the timer still runs. Unanswered skipped exercises are simply excluded from the score."]};
var EXERCISES = [{"type":"qcm","summary":"Read a dsregcmd status excerpt and pick the correct conclusion and next step","short":"dsregcmd excerpt — meaning + next step","scenario":"Ticket #6620: a user reports their new work laptop 'behaves strangely'. You pull the local registration state from the machine. The Azure AD tenant name shown belongs to your company, but the device was never issued by IT — no asset record exists for it.","artefacts":[{"label":"ARTEFACT 1 — dsregcmd /status (excerpt)","body":"<pre class=\"logbox\">AzureAdJoined   : <span class=\"tok-k\">YES</span>\nDeviceId        : d-77aa19-c2\nDeviceName      : DESKTOP-LT4471\nTenantName      : corp.example\nMdmUrl          : <span class=\"tok-cm\">(empty)</span>\nAzureAdPrt      : <span class=\"tok-k\">YES</span></pre>"},{"label":"ARTEFACT 2 — IT asset register","body":"<pre class=\"logbox\">asset search: 'DESKTOP-LT4471' → <span class=\"tok-n\">no results</span>\nintune enrollment for user u3551 → <span class=\"tok-n\">none</span></pre>"}],"question":"What is the correct reading of these two artefacts, and what should you do next?","options":[{"id":"a","label":"The device is joined to the tenant and holds a PRT, but is not MDM-managed — treat as rogue and investigate"},{"id":"b","label":"The output proves a normal Autopilot build — close the ticket"},{"id":"c","label":"The empty MdmUrl means the device cannot reach the internet — fix Wi-Fi first"},{"id":"d","label":"AzureAdPrt YES is an error code — reboot the laptop"}],"correct":["a"],"itemWhy":{"b":"Autopilot builds are enrolled in Intune — the empty MdmUrl and missing asset record contradict that.","c":"An empty MdmUrl means no mobile device management enrollment, not a network problem.","d":"AzureAdPrt YES simply says the device holds a Primary Refresh Token — which is exactly the risk here."},"hint":"Two facts must combine: the state shown on the host, and the fact that IT never issued this machine.","explain":"<p><b>Step one:</b> AzureAdJoined YES + AzureAdPrt YES means the machine is joined to your tenant and holds a <b>Primary Refresh Token</b> — a token that gives silent single sign-on. <b>Step two:</b> no asset record and no MDM enrollment means IT did not provision it. Together: a device joined your tenant outside your process — the classic T1098.005 outcome when an attacker registers their own machine. PRT holders pass 'registered device' checks, so investigate, do not close.</p>","study":"how a PRT makes a registered device pass device-based checks."},{"type":"match","summary":"Classify four enrollment stories into the correct device state","short":"Registered vs joined vs enrolled vs MFA-enrolled","scenario":"Four users did four different things this week. Classify each story into the device state it produced, so the identity team can size the attack surface for T1098.005.","question":"Match each story to the device state it describes.","pairs":[{"left":"k.meyer added her personal laptop to the tenant from the 'Anywhere access' web page","right":"device registered (Workplace Join) — personal device, light management","why":"Self-service registration from the web attaches a personal device without full company management."},{"left":"IT provisioned a new company laptop that is fully owned and policy-managed by the tenant","right":"device joined — corporate-owned, managed by the organisation","why":"Entra Join is for company-owned devices under organisational control."},{"left":"The same company laptop was additionally placed under mobile device management and checked for compliance","right":"device enrolled and compliance-managed (Intune-style)","why":"Enrollment into the device management system adds compliance evaluation on top of identity."},{"left":"b.ali installed the MFA app and added his phone as his second-factor device","right":"MFA self-enrollment into Duo/Okta — not an Entra device object","why":"MFA systems enroll devices for authentication; the ATT&CK page names Duo and Okta for this path."}],"hint":"Ask for each: who owns the device, and who manages it?","explain":"<p>Four states, four ownership stories: <b>registered</b> (personal device attached), <b>joined</b> (corporate-owned), <b>enrolled + compliant</b> (managed and checked), and <b>MFA-enrolled</b> (second-factor device in Duo/Okta). Attackers can abuse every one of them — T1098.005 covers the MFA-system path and the Entra ID / Intune path, which is why the page lists platform as <b>Identity Provider, Windows</b>.</p>","study":"registered vs joined vs enrolled vs MFA-enrolled devices."},{"type":"blank","summary":"Complete the detection logic for T1098.005","short":"Fill the detection rule wording","scenario":"You are the detection engineer turning analytic AN0103 of detection strategy DET0036 into a first alert. Complete the rule wording with the word bank.","question":"Complete the three gaps of the detection rule.","text":"Alert when the Entra ID audit log shows activityDisplayName equal to '[[0]]' for a principal that is NOT in the approved-registrars group, OR when the process [[1]] is executed on a Windows host with an enrollment flag. To cut onboarding noise, suppress only devices that are already [[2]]-managed with a change ticket.","blanks":[{"accept":["register device","device registered","register-device"],"why":"The tenant-side audit event for T1098.005 is 'Register device'."},{"accept":["dsregcmd"],"why":"dsregcmd is the Windows command-line tool whose enrollment flags trigger host-side registration."},{"accept":["intune","mdm"],"why":"Legit corporate onboarding flows through the MDM (Intune) pipeline with tickets — suppress those, alert on the rest."}],"hint":"One gap is an exact audit event name, one is a Windows binary, one is the management system that signs off legit laptops.","explain":"<p>DET0036's two analytics cover both doors: <b>AN0103</b> watches self-enrollment portals (Entra, Okta, Duo) for new devices on compromised accounts; <b>AN0104</b> watches the Windows/Intune registration pipeline with stolen credentials. Your rule mirrors that: audit event <b>'Register device'</b> outside the approved group, or <b>dsregcmd</b> with an enrollment flag on the host — with the managed-and-ticketed flow suppressed to keep false positives low.</p>","study":"detection strategy DET0036 and its two analytics."},{"type":"logview","summary":"Pick the three lines that form the attacker's registration chain","short":"Find the attacker registration chain","scenario":"Eight lines from yesterday, mixed sources. A dormant finance account was reactivated from an unknown network. Three lines together show the T1098.005 chain: the registration itself, the host-side command that did it, and the first trusted use of the new device.","question":"Click the three lines that belong to the attacker's device-registration chain.","lines":[{"id":"c1","text":"audit  activityDisplayName='Register device'  actor=finance-dormant@corp.example  ip=198[.]51[.]100[.]77  result=success","related":true,"why":"The registration event from a non-corporate IP — the core T1098.005 action."},{"id":"c2","text":"edr  proc  dsregcmd.exe /register  parent=explorer.exe  host=FIN-VM-02  user=finance-dormant","related":true,"why":"The host-side command performing enrollment — the AN0104-style telemetry."},{"id":"c3","text":"signin  user=finance-dormant  device='NEW-DEVICE-d-91f2'  mfa='satisfied by device'  ip=198[.]51[.]100[.]77","related":true,"why":"First sign-in trusted by the freshly registered device from the same IP — the payoff."},{"id":"c4","text":"audit  activityDisplayName='Reset user password'  actor=helpdesk-agent@corp.example","related":false,"why":"A legitimate helpdesk reset — different behaviour, different technique."},{"id":"c5","text":"signin  user=marketing-01  result=blocked  reason=password spray  ip=203[.]0[.]113[.]9","related":false,"why":"Password-spray noise against another user — keep it separate from the registration chain."},{"id":"c6","text":"audit  activityDisplayName='Add delegated permission'  actor=finance-dormant  target=mailbox shared-fin","related":false,"why":"A sibling T1098.002 action by the same account — notable, but not the device chain."},{"id":"c7","text":"edr  proc  dsregcmd.exe /status  parent=cmd.exe  host=FIN-VM-02  user=finance-dormant","related":false,"why":"Reading status changes nothing — near-miss: same tool, no enrollment flag."},{"id":"c8","text":"audit  activityDisplayName='Consent to application'  app='Finance Reporter'  actor=finance-dormant","related":false,"why":"OAuth consent — another sibling technique family, not device registration."}],"hint":"The chain is: cloud registration event → host command WITH an enrollment flag → first trusted sign-in. /status alone proves nothing.","explain":"<p>C1 (tenant-side registration), C2 (host-side <code class=\"inline\">dsregcmd /register</code>) and C3 (first device-trusted sign-in from the same IP) form the chain. C7 is the classic near-miss: <code class=\"inline\">dsregcmd /status</code> only <b>reads</b> state and does not enroll anything. C6 and C8 are real account manipulation by the same account — worth their own tickets — but the device chain is C1+C2+C3.</p>","study":"correlating audit, EDR process and sign-in telemetry for T1098.005."},{"type":"dnd","summary":"File three artefacts under the data sources a detection needs","short":"Map artefacts to data source classes","scenario":"Your detection coverage review for T1098.005 needs a data-source inventory. File each artefact you already collect into the right class, so the matrix shows which of the three classes you actually cover.","question":"Drag each artefact into the data source class it belongs to.","itemsPool":[{"id":"a1","label":"Audit event 'Register device' with actor and IP"},{"id":"a2","label":"EDR record: dsregcmd.exe launched with /register"},{"id":"a3","label":"Sign-in entry where MFA was satisfied by a device"}],"slots":[{"label":"Cloud service audit / control-plane logs","accept":["a1"],"why":"Tenant audit events are the identity platform's control plane — the primary witness of registration."},{"label":"Endpoint process execution telemetry","accept":["a2"],"why":"The EDR saw the enrollment command run on the Windows host — process telemetry."},{"label":"Authentication / logon session logs","accept":["a3"],"why":"Sign-ins are authentication telemetry — they show how the registered device is then used."}],"hint":"One artefact is a cloud event, one is an endpoint process, one is an authentication session.","explain":"<p>Good T1098.005 coverage needs all three classes: <b>cloud control-plane</b> (did a registration happen), <b>endpoint process</b> (did an enrollment command run, and who launched it), and <b>authentication</b> (is the device now being used to get in). Detection strategy DET0036 draws on exactly these sources — a gap in any one of them blinds one whole class of detections.</p>","study":"data sources behind the T1098.005 detection strategies."},{"type":"qcm","summary":"Why register a device instead of just reusing the stolen password?","short":"Attacker trade-off: register vs reuse","scenario":"A red-team reviewer challenges your incident report: 'The attacker already had valid credentials. Why would they bother registering a device at all — that leaves audit noise?' Pick the answer that best states the attacker's benefit AND the trade-off they accept.","question":"Which option correctly states the attacker's benefit and the accepted trade-off?","options":[{"id":"a","label":"Benefit: the device satisfies device rules and carries a PRT; trade-off: the registration itself is auditable"},{"id":"b","label":"Benefit: it hides the stolen password from logs; trade-off: slower access"},{"id":"c","label":"Benefit: registration deletes older audit entries; trade-off: MFA must be re-solved"},{"id":"d","label":"Benefit: registered devices cannot be disabled; trade-off: none"}],"correct":["a"],"itemWhy":{"b":"Registration does not hide the password — the password still appears in sign-in logs.","c":"Registration deletes nothing from the audit log, and MFA becomes easier, not harder.","d":"Registered devices CAN be disabled by admins — that is a standard containment step."},"hint":"The benefit must explain why credentials alone are not enough — and every cloud action costs the attacker something.","explain":"<p><b>Attacker reasoning:</b> credentials alone still hit MFA walls and 'unmanaged device' blocks. A <b>registered device</b> flips both: it can receive the MFA prompt and satisfy device-based conditional access, and on Entra ID it can hold a <b>PRT</b> for silent sign-on. The trade-off is real: the registration writes a loud audit event and creates a disable-able object. Attackers accept it because the foothold is worth the noise — and, as the ATT&amp;CK page notes, dormant accounts sometimes need <b>only username and password</b> to enroll a first device, which removes even the trade-off.</p><p><b>Defender view:</b> that same trade-off is your opening — the enrollment writes a loud 'Register device' audit event and creates a device object you can disable and delete, so a new-device alert plus a fast session revocation takes away the foothold the attacker just paid for.</p>","study":"attacker incentives and trade-offs of device registration."},{"type":"triage","summary":"Triage four device-registration alerts with business context","short":"SOC triage: 4 registration alerts","scenario":"Four alerts sit in the queue, each with business context. Choose the correct triage decision per alert. One is routine onboarding, one is a known re-enrollment, and two carry attacker signals of different strength.","question":"Choose the best decision for each alert.","alerts":[{"title":"New Windows device registered for hr-recruiter02","meta":"03:12 UTC · source IP: hosting provider · user has never registered a device · no ticket","options":[{"id":"o1","label":"Escalate as likely T1098.005 — contain device, verify with user"},{"id":"o2","label":"Close — recruiters travel and use hotel Wi-Fi"},{"id":"o3","label":"Ask the hosting provider to confirm the IP owner"}],"correct":"o1","why":"Dormant-hour registration from a hosting provider with no ticket and no history is the AN0103 pattern — escalate and contain."},{"title":"New device registered for new-hire-042","meta":"09:30 UTC · office IP · Autopilot onboarding wave scheduled today · ticket ONB-2280","options":[{"id":"o1","label":"Close as expected — scheduled onboarding with ticket and office IP"},{"id":"o2","label":"Escalate — new hires are risky"},{"id":"o3","label":"Disable the Autopilot pipeline for everyone"}],"correct":"o1","why":"Ticket + office IP + scheduled wave = expected enrollment. Closing with the ticket keeps the baseline clean."},{"title":"Second device registered for finance-dormant, then sign-in from it","meta":"registration from hosting IP, sign-in 6 minutes later satisfying device-based CA","options":[{"id":"o1","label":"Close — one extra device is within policy"},{"id":"o2","label":"Escalate to IR — registration followed by device-trusted sign-in is active misuse"},{"id":"o3","label":"Reset the device name only"}],"correct":"o2","why":"The registration was immediately monetised — a device-trusted sign-in means the attacker already uses the foothold."},{"title":"Re-registration of wiped device LAP-TS-118 for ts-support3","meta":"14:02 UTC · office IP · ticket HD-9917 're-enroll after OS wipe' open with the same device id","options":[{"id":"o1","label":"Close as expected — documented re-enrollment of a known device"},{"id":"o2","label":"Escalate — re-enrollment is always suspicious"},{"id":"o3","label":"Delete the device object and wait"}],"correct":"o1","why":"Same device id, open matching ticket, office network — textbook legitimate re-enrollment."}],"hint":"For each alert pair two facts: does a business reason exist, and is the registration immediately used?","explain":"<p>The discriminator is <b>context plus follow-through</b>. Hosting-IP registrations at night without tickets go up (alerts 1 and 3), and alert 3 is worse because the device was <b>used</b> straight away — that is persistence in action. Ticketed onboarding and documented re-enrollment of a known device close as expected (alerts 2 and 4). This is exactly the false-positive profile DET0036 tuning has to encode.</p>","study":"false-positive tuning for device-registration alerts."},{"type":"order","summary":"Order the five responder steps after a rogue-registration alert","short":"Order the responder workflow","scenario":"An alert fired: a device was registered for a user on leave, from a hosting IP. Put the responder's five steps into the correct working order.","question":"Click the five steps in the correct order (first click = step 1).","steps":[{"id":"d1","label":"Pull the audit event details: actor, IP, device id, timestamp","why":"Scope first: the audit event names the actor, the network and the exact device object."},{"id":"d2","label":"Check the user's recent sign-ins and risk state","why":"Correlate: is this account otherwise behaving like its owner? Risk state shapes urgency."},{"id":"d3","label":"Confirm out-of-band with the user or their manager","why":"Humans confirm ownership; in-band confirmation could reach the attacker."},{"id":"d4","label":"Disable the device object and revoke the user's sessions","why":"Contain: disabling the device kills its access path; revoking sessions drops stolen tokens."},{"id":"d5","label":"Record the case and tune the detection with the outcome","why":"Learn: every closed case feeds the analytic's precision (true/false-positive profile)."}],"hint":"Scope → correlate → confirm → contain → learn. Containment before confirmation wastes nothing, but confirmation comes from humans, not the attacker's session.","explain":"<p>The order matters: <b>scope</b> (audit details) → <b>correlate</b> (sign-ins, risk) → <b>confirm</b> (out-of-band, never via the possibly-owned mailbox) → <b>contain</b> (disable device + revoke sessions) → <b>learn</b> (tune). Skipping scope leads to blind containment; skipping the out-of-band check risks tipping the attacker who may be reading the user's mail.</p>","study":"incident-response workflow for rogue device registrations."},{"type":"qcm","multi":true,"summary":"Select the TWO controls that directly reduce T1098.005 risk","short":"Pick the two on-topic controls","scenario":"The CISO asks which controls from the proposal actually target Device Registration (T1098.005). Four candidates are on the table; exactly two address this technique, the other two belong to different problems.","question":"Select the TWO options that directly reduce the T1098.005 risk.","options":[{"id":"a","label":"Require MFA — or a temporary access pass — at device-registration time"},{"id":"b","label":"Segment the lab network from the office network"},{"id":"c","label":"Limit which users and groups may register devices at all"},{"id":"d","label":"Block USB storage drives on endpoints"}],"correct":["a","c"],"itemWhy":{"b":"Network segmentation is a real control, but registration happens over the identity control plane, not across a network segment.","d":"USB blocking stops removable-media paths — unrelated to cloud enrollment."},"hint":"Both correct options act on the enrollment moment itself — one on the factor required, one on who is allowed.","explain":"<p>The two on-topic controls mirror the ATT&amp;CK mitigation guidance: <b>M1032 Multi-factor Authentication</b> (require MFA to register devices, use temporary access passes for first enrollment) and <b>user-account management</b> (restrict who may register devices, disallow enrollment for inactive accounts). Segmentation and USB blocking are legitimate controls — for different techniques.</p>","study":"which mitigations the T1098.005 page lists, and why they fit this technique."},{"type":"term","summary":"Write the PowerShell query that pulls 'Register device' audit events","short":"Terminal: pull registration audit events","scenario":"You are on the detection team. The Microsoft Graph PowerShell SDK is connected with the right scopes (AuditLog.Read.All). Pull the directory audit events so you can filter for the exact activity name that T1098.005 produces. You need only events whose activityDisplayName is exactly 'Register device'.","question":"Type the command that retrieves the directory audit log filtered to activityDisplayName 'Register device', then run it and press Check.","term":{"prompt":"PS C:\\Tools>","banner":["Windows PowerShell 7.4 (module: Microsoft.Graph, connected)","Scopes: AuditLog.Read.All, Device.Read.All","Hint: the directory audit cmdlet supports -Filter with an expression."],"canonical":"Get-MgAuditLogDirectoryAudit -Filter \"activityDisplayName eq 'Register device'\"","elements":[{"reSrc":"get-mgauditlogdirectoryaudit","label":"cmdlet: Get-MgAuditLogDirectoryAudit","why":"This is the Graph SDK cmdlet for the directory audit log — the log that records 'Register device'."},{"reSrc":"-filter","label":"parameter: -Filter","why":"Server-side filtering is done with -Filter."},{"reSrc":"activitydisplayname\\s*eq\\s*'register device'","label":"expression: activityDisplayName eq 'Register device'","why":"The exact activity name that T1098.005 device registration writes to the audit log."}],"penalties":[{"reSrc":"get-azureadauditdirectorylogs","label":"retired cmdlet: Get-AzureADAuditDirectoryLogs","why":"The old AzureAD/MSOnline module is retired — the Graph SDK cmdlet is required."},{"reSrc":"signins|signinreports","label":"wrong log: sign-in log cmdlet","why":"Sign-in logs record authentications — the registration event lives in the directory audit log."}],"danger":[],"parts":[{"k":"Get-MgAuditLogDirectoryAudit","v":"Graph SDK cmdlet that reads the directory audit log"},{"k":"-Filter","v":"passes a server-side OData filter expression"},{"k":"\"activityDisplayName eq 'Register device'\"","v":"keeps only the audit activities that T1098.005 device registration produces"}]},"hint":"Two decisions: which LOG cmdlet reads audit events, and which parameter narrows it to one activity name.","explain":"<p>The canonical command is <code class=\"inline\">Get-MgAuditLogDirectoryAudit -Filter \"activityDisplayName eq 'Register device'\"</code>. Element by element: the Graph SDK <b>audit</b> cmdlet (not the retired AzureAD one, not the sign-in report), the <b>-Filter</b> parameter, and the exact <b>activityDisplayName</b> that T1098.005 writes. This query is the practical form of analytic AN0103's data pull.</p>","study":"pulling identity audit events with Microsoft Graph PowerShell."},{"type":"match","summary":"File four account-manipulation behaviours under the right sub-technique IDs","short":"Behaviours → T1098.x sub-techniques","scenario":"A quarterly ATT&CK-mapping workshop gives you four observed behaviours. File each under the correct sub-technique of Account Manipulation, using the current ATT&CK names.","question":"Match each behaviour to its sub-technique.","pairs":[{"left":"A new MFA-capable device was enrolled on a stolen account","right":"T1098.005 — Device Registration","why":"Enrolling a device into MFA or Entra ID is exactly Device Registration."},{"left":"An extra application password / cloud credential was added to an account","right":"T1098.001 — Additional Cloud Credentials","why":"Adding new cloud credentials is the Additional Cloud Credentials sub-technique."},{"left":"The attacker granted themselves a privileged cloud role on the subscription","right":"T1098.003 — Additional Cloud Roles","why":"Granting cloud roles is Additional Cloud Roles."},{"left":"A public key line appeared in a server's authorized_keys file","right":"T1098.004 — SSH Authorized Keys","why":"Adding an SSH key is the SSH Authorized Keys sub-technique."}],"hint":"Devices, credentials, roles, SSH keys — each behaviour names its object.","explain":"<p>All four live under T1098 Account Manipulation, but each changes a different object: <b>devices</b> (.005), <b>credentials</b> (.001), <b>roles</b> (.003), <b>SSH keys</b> (.004). Keeping these apart matters in reports and detection coverage — a 'device registered' alert is never an SSH-key event, even when the same attacker did both in one campaign.</p>","study":"the sub-technique list of T1098 with current names."},{"type":"qcm","summary":"Who can trigger device registration in a default tenant?","short":"Permission needed for self-enrollment","scenario":"An asset-owner insists: 'Only Global Administrators can register devices, so my standard users cannot be abused this way.' The tenant's self-service registration setting is ON (the default posture the ATT&CK page describes for MFA self-enrollment). Assess the claim.","question":"Which statement is correct for this tenant?","options":[{"id":"a","label":"Any standard user with valid credentials can register a device when self-service enrollment is on"},{"id":"b","label":"Only Global Administrators can ever produce a registration event"},{"id":"c","label":"Registration requires physical console access to the target machine only"},{"id":"d","label":"Registration requires no account at all — anyone from the internet can enroll"}],"correct":["a"],"itemWhy":{"b":"Admins can too — but self-service enrollment deliberately gives standard users the same ability.","c":"Enrollment runs over the identity platform from anywhere; console access is not the gate.","d":"An account with valid credentials is required — the ATT&CK page starts from 'an adversary that compromises a user's credentials'."},"hint":"The whole reason M1032 exists is that ordinary accounts can self-enroll — what does that imply?","explain":"<p>With self-service enrollment on, <b>any standard user</b> — and therefore any attacker holding a user's credentials — can trigger device registration. That is why the ATT&amp;CK mitigation guidance focuses on the enrollment moment: require MFA (or a temporary access pass), restrict enrollment to trusted locations or devices, and block enrollment for inactive accounts. The asset-owner's claim fails because self-service is the default they turned on.</p>","study":"self-service enrollment settings and the permissions behind T1098.005."},{"type":"dnd","summary":"Explain what each Entra audit event actually did","short":"Three audit events, three meanings","scenario":"Three audit events from one account confuse the shift. File each under what it actually did, so the timeline in the ticket is written correctly.","question":"Drag each event to the meaning it carries.","itemsPool":[{"id":"e1","label":"activityDisplayName: 'Register device'"},{"id":"e2","label":"activityDisplayName: 'Add registered owner to device'"},{"id":"e3","label":"activityDisplayName: 'Update device'"}],"slots":[{"label":"A new device object was created in the tenant","accept":["e1"],"why":"The registration event creates the device object — the core T1098.005 action."},{"label":"A user was linked to an existing device as its owner","accept":["e2"],"why":"'Add registered owner' links a user to a device that already exists — common right after a rogue registration."},{"label":"Properties or state of an existing device changed","accept":["e3"],"why":"'Update device' mutates an existing object — e.g., profile or management data changed."}],"hint":"Only one of the three events creates something new. The other two touch a device that already exists.","explain":"<p><b>'Register device'</b> creates the device object (T1098.005's core). <b>'Add registered owner'</b> links a user to it — attackers do this to make their account the device's owner. <b>'Update device'</b> changes an existing object's properties. Reading the three apart turns a confusing blob of events into a clean narrative: create → own → modify.</p>","study":"Entra audit events around device objects."},{"type":"logview","summary":"Click the lines showing the new device being used from the anomalous network","short":"New device + anomalous network","scenario":"After a registration alert you review six sign-in lines for one user. Two lines together show the registered device being used to sign in from the same anomalous network where it was registered.","question":"Click the two lines showing the registered device in use from the anomalous network.","lines":[{"id":"s1","text":"signin  user=l.tanaka  ip=192[.]0[.]2[.]44 (office)  device=LAP-TT-31  mfa='device satisfied'  result=success","related":false,"why":"Device-trusted, but from the office network — normal use, not the anomalous pair."},{"id":"s2","text":"signin  user=l.tanaka  ip=198[.]51[.]100[.]77 (hosting)  device='NEW-d-91f2'  mfa='device satisfied'  result=success","related":true,"why":"The new device, device-trusted, from the hosting IP — the anomalous pattern."},{"id":"s3","text":"signin  user=l.tanaka  ip=198[.]51[.]100[.]77 (hosting)  device=none  result=blocked  reason='device requirement not met'","related":false,"why":"Same bad IP, but blocked and device-less — a failed attempt, not trusted use."},{"id":"s4","text":"signin  user=l.tanaka  ip=198[.]51[.]100[.]77 (hosting)  device='NEW-d-77aa'  mfa='device satisfied'  result=success","related":true,"why":"A second new device, device-trusted, same hosting IP — the same attacker pattern repeated."},{"id":"s5","text":"signin  user=s.volkov  ip=198[.]51[.]100[.]77 (hosting)  device='NEW-d-91f2'  result=success","related":false,"why":"Different user — out of scope for l.tanaka's review even though the IP matches."},{"id":"s6","text":"signin  user=l.tanaka  ip=192[.]0[.]2[.]44 (office)  device=none  mfa='push'  result=success","related":false,"why":"Plain office sign-in with push MFA — no device involvement at all."}],"hint":"The pair must satisfy all three: device-trusted, the NEW device, and the hosting-provider IP.","explain":"<p>S2 and S4: a <b>newly registered device</b>, <b>device-satisfied MFA</b>, and the <b>hosting-provider IP</b> — the registered device doing its job for the attacker. S1 is device-trusted but office-based (normal). S3 is from the bad IP but <b>blocked</b> with no device. S5 is another user sharing the IP. Three conditions must hold at once — that is the two-step reasoning this level trains.</p>","study":"correlating device identity with network anomaly in sign-in logs."},{"type":"qcm","summary":"Choose the tuning that reduces false positives without blinding you","short":"Tune the registration alert","scenario":"Your 'Register device' alert fires 40 times a day and onboarding noise drowns it. The identity team will not disable self-service enrollment (field staff need it). Choose the tuning that cuts the noise without hiding attacker behaviour.","question":"Which tuning is the correct one?","options":[{"id":"a","label":"Suppress only ticketed, MDM-pipeline enrollments; keep alerting on all others, risk-weighted"},{"id":"b","label":"Alert only between 00:00 and 06:00 UTC"},{"id":"c","label":"Alert only on the fifth registration per user per day"},{"id":"d","label":"Turn the alert off and rely on the monthly audit review"}],"correct":["a"],"itemWhy":{"b":"Attackers work at 14:00 too — time windows hide most of the behaviour.","c":"Threshold-of-five lets the first four registrations through — the first one is the incident.","d":"A monthly review cannot contain an active foothold; detection must be real-time."},"hint":"Good tuning removes a NAMED legitimate flow — it never removes a whole dimension like time or count.","explain":"<p>Correct tuning suppresses a <b>specific, documented legitimate flow</b> (ticketed MDM/Intune pipeline enrollment) and keeps everything else alerting, weighted by risk signals. Time-window, count-threshold and switch-off tunings all hide the exact behaviour DET0036 exists to catch. Remember the business constraint: self-service stays, so the detector — not the platform — has to carry the precision.</p>","study":"detection tuning versus detection blindness."},{"type":"order","rankMode":true,"summary":"Rank four registration events by urgency","short":"Rank by urgency","scenario":"End of shift. Four registration events await prioritisation for tomorrow morning. Rank them so the most dangerous gets attention first (click order = rank).","question":"Click the four events in order of urgency (first click = most urgent).","steps":[{"id":"r1","label":"Registration from hosting IP for a finance user, no ticket, sign-in 5 min later","why":"Registration AND immediate use — an active foothold right now."},{"id":"r2","label":"Registration for a dormant account that has not signed in for 14 months","why":"The ATT&CK page flags inactive accounts as a preferred door — high risk even without a sign-in yet."},{"id":"r3","label":"Registration during the scheduled onboarding wave, ticketed, office IP","why":"Documented, expected, ticketed — lowest urgency."},{"id":"r4","label":"Device rename event on an existing, compliant device","why":"A property change on a managed device — routine unless other signals appear."}],"hint":"Ask two questions per event: is a foothold already in use, and how easy was the door?","explain":"<p>Urgency follows <b>use</b> first (r1: registered and immediately used), then <b>exposure</b> (r2: dormant account — the page's named weak spot), then <b>documented normality</b> (r3), then routine property changes (r4). Ranking forces you to weigh 'what happened' against 'what might happen next' — the exact judgement the MEDIUM level is built around.</p>","study":"prioritising identity events by risk signals."}];
'use strict';
/* CyberPulseAcademy exam engine — shared across all T1098.005 severity files.
 * Expects globals: META, INTRO, EXERCISES (injected before this script). */
(function () {
  var $id = function (i) { return document.getElementById(i); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function pct(n) { return Math.round(n * 100); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60);
    m = m % 60;
    var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
    var out = (h > 0 ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
    return out;
  }
  function scoreHW(H, W, N) { return Math.max(0, (H - W) / N); }

  var SEV_CLASS = { 'easy': 'badge-easy', 'medium': 'badge-medium', 'hard': 'badge-hard', 'extremely-hard': 'badge-extreme' };

  var state = {
    screen: 'intro', mode: 'exam', pos: 0, queue: [],
    answered: {}, credits: {}, results: {}, skipped: [], currentIdx: -1,
    usedHint: {}, hintShown: {},
    shuffles: {}, trans: {},
    timer: { state: 'IDLE', remain: 0, total: 0, lastTs: 0, manualMs: 0, autoMs: 0, autoStart: 0, pauseStart: 0 },
    pauseReturn: 'RUNNING', reported: false, user: { name: '', country: '', locale: '' }
  };
  var tickHandle = null;

  /* ---------------- timer state machine ---------------- */
  // States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
  function setTimerState(s) {
    state.timer.state = s;
    if (s === 'RUNNING') { state.timer.lastTs = Date.now(); }
    renderTimerBar();
  }
  function startTimer() {
    state.timer.total = META.estimatedMinutes * 60;
    state.timer.remain = state.timer.total;
    state.timer.manualMs = 0; state.timer.autoMs = 0; state.timer.autoStart = 0;
    setTimerState('RUNNING');
    if (tickHandle) { clearInterval(tickHandle); }
    tickHandle = setInterval(tick, 250);
  }
  function tick() {
    var t = state.timer;
    if (t.state === 'ENDED') { return; }
    var now = Date.now();
    if (t.state !== 'RUNNING') { t.lastTs = now; return; }
    var dt = (now - t.lastTs) / 1000;
    t.lastTs = now;
    t.remain -= dt;
    if (t.remain <= 0) { t.remain = 0; renderTimerBar(); finishExam(true); return; }
    renderTimerBar();
  }
  function renderTimerBar() {
    var t = state.timer;
    $id('timerVal').textContent = fmtTime(t.remain);
    var st = $id('timerState'), box = $id('timerBox');
    var banner = $id('pauseBanner');
    if (t.state === 'RUNNING') {
      st.textContent = '▶ RUNNING'; st.className = 'ts-running';
      box.setAttribute('aria-label', 'Timer running');
      banner.style.display = 'none';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
      document.body.classList.remove('manually-paused');
    } else if (t.state === 'PAUSED_MANUAL') {
      st.textContent = '⏸ PAUSED_MANUAL'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused manually');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — manual (press Resume)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">▶</span> Resume';
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      st.textContent = '⏸ PAUSED_AUTO_CHECK'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused while reviewing feedback');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — reviewing feedback (resumes on Next)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
    } else if (t.state === 'ENDED') {
      st.textContent = '■ ENDED'; st.className = 'ts-ended';
      banner.style.display = 'none';
    } else {
      st.textContent = '— READY'; st.className = 'ts-running';
      banner.style.display = 'none';
    }
  }
  function onPauseBtn() {
    if (state.screen !== 'exam') { return; }
    if (state.timer.state === 'PAUSED_MANUAL') { onResumeBtn(); return; }
    var t = state.timer;
    if (t.state === 'RUNNING') {
      t.pauseStart = Date.now(); state.pauseReturn = 'RUNNING';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
      t.pauseStart = Date.now(); state.pauseReturn = 'PAUSED_AUTO_CHECK';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    }
  }
  function onResumeBtn() {
    var t = state.timer;
    if (t.state !== 'PAUSED_MANUAL') { return; }
    t.manualMs += Date.now() - t.pauseStart; t.pauseStart = 0;
    showPauseCover(false);
    setTimerState(state.pauseReturn || 'RUNNING');
    if ((state.pauseReturn || 'RUNNING') === 'PAUSED_AUTO_CHECK' && !t.autoStart) { t.autoStart = Date.now(); }
    document.body.classList.remove('manually-paused');
  }
  function showPauseCover(on) {
    var c = $id('pauseCover');
    if (!c) { return; }
    if (on) {
      c.classList.remove('hidden');
      c.innerHTML = '<div class="card" style="max-width:520px;margin:60px auto;text-align:center">' +
        '<h2>⏸ PAUSED — manual</h2><p style="color:var(--text-secondary)">The exercise is hidden while you take a break.' +
        ' The countdown is stopped. Press Resume to continue.</p>' +
        '<button class="btn btn-primary" id="resumeBtn2">▶ Resume</button></div>';
      $id('resumeBtn2').addEventListener('click', onResumeBtn);
    } else { c.classList.add('hidden'); c.innerHTML = ''; }
  }

  /* ---------------- scoring core ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    // Mandatory formula: credit = max(0, (H - W) / N)
    var N = correctItems.length, H = 0, W = 0;
    selectedItems.forEach(function (s) { if (correctItems.indexOf(s) >= 0) { H++; } else { W++; } });
    return { N: N, H: H, W: W, credit: scoreHW(H, W, N) };
  }

  /* ---------------- flow ---------------- */
  function startExam() {
    state.screen = 'exam'; state.mode = 'exam';
    state.pos = 0; state.queue = shuffle(EXERCISES.map(function (e, i) { return i; }));
    state.answered = {}; state.credits = {}; state.results = {}; state.skipped = [];
    state.usedHint = {}; state.hintShown = {}; state.shuffles = {}; state.trans = {};
    state.reported = false;
    $id('screen-intro').classList.add('hidden');
    $id('screen-results').classList.add('hidden');
    $id('screen-exam').classList.remove('hidden');
    $id('sevBadge2').className = 'badge ' + SEV_CLASS[META.difficulty];
    $id('sevBadge2').innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('partLabel').textContent = INTRO.partLabel || '';
    startTimer();
    showExercise();
  }
  function sevIcon() { return META.difficulty === 'extremely-hard' ? '◉' : '◆'; }
  function curEx() { return EXERCISES[state.currentIdx]; }
  function processedCount() {
    var a = 0; Object.keys(state.answered).forEach(function (k) { if (state.answered[k]) { a++; } });
    return a + state.skipped.length;
  }
  function updateProgress() {
    var f = $id('progressFill');
    f.style.width = Math.min(100, (processedCount() / EXERCISES.length) * 100) + '%';
  }
  function updateLiveScore() {
    var sum = 0, n = 0;
    Object.keys(state.answered).forEach(function (k) {
      if (state.answered[k]) { sum += state.credits[k]; n++; }
    });
    $id('scoreVal').textContent = (n > 0 ? (Math.round(sum * 10) / 10) + ' / ' + n + ' (' + pct(sum / n) + '%)' : '0 / 0 (—%)');
  }
  function showExercise() {
    var idx = state.queue[state.pos];
    state.currentIdx = idx;
    $id('exCounter').textContent = 'Exercise ' + (state.pos + 1) + ' of ' + EXERCISES.length;
    renderExercise(idx, state.mode === 'review-item');
    updateProgress(); updateLiveScore();
    $id('checkBtn').classList.remove('hidden');
    $id('checkBtn').disabled = true;
    $id('checkBtn').textContent = '✓ Check';
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.remove('hidden');
    $id('hintBtn').classList.remove('hidden');
    $id('hintBtn').disabled = false;
    document.getElementById('exerciseArea').scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function onSkip() {
    if (state.screen !== 'exam' || state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
    var idx = state.currentIdx;
    if (state.skipped.indexOf(idx) < 0) { state.skipped.push(idx); }
    state.currentIdx = -1;
    if (state.mode === 'review-item') { showReview(); return; }
    state.pos++;
    proceedOrFinish(false);
    updateProgress();
  }
  function proceedOrFinish(cameFromCheck) {
    if (state.mode === 'review-item') { showReview(); return; }
    if (state.pos < state.queue.length) {
      showExercise();
    } else {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
    }
  }
  function onCheck() {
    // FIRST action: stop the timer (Check-triggered auto-pause), then grade.
    var t = state.timer;
    if (t.state === 'RUNNING') { t.autoStart = Date.now(); setTimerState('PAUSED_AUTO_CHECK'); }
    var idx = state.currentIdx;
    var res = gradeExercise(curEx(), idx);
    if (state.usedHint[idx]) { res.credit = Math.max(0, res.credit - 0.10); }
    state.answered[idx] = true;
    state.credits[idx] = res.credit;
    state.results[idx] = res;
    var si = state.skipped.indexOf(idx);
    if (si >= 0) { state.skipped.splice(si, 1); }
    renderFeedback(curEx(), idx, res);
    updateLiveScore(); updateProgress();
    $id('checkBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').disabled = true;
    var nb = $id('nextBtn');
    nb.classList.remove('hidden');
    if (state.mode === 'review-item') {
      nb.textContent = '⟲ Back to review (timer resumes)';
    } else if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      nb.textContent = un.length > 0 ? '⟲ Review skipped exercises' : '⏹ Final Submit';
    } else {
      nb.textContent = 'Next ▶';
    }
  }
  function onNext() {
    var t = state.timer;
    if (t.state === 'PAUSED_AUTO_CHECK' && t.autoStart) {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
    }
    if (state.mode === 'review-item') {
      setTimerState('RUNNING');
      showReview(); return;
    }
    if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
      return;
    }
    setTimerState('RUNNING');
    state.pos++;
    showExercise();
  }
  function onHint() {
    var idx = state.currentIdx;
    if (state.usedHint[idx] || state.answered[idx]) { return; }
    state.usedHint[idx] = true;
    state.hintShown[idx] = true;
    var ex = EXERCISES[idx];
    var hp = $id('hintPanel');
    hp.innerHTML = '<span class="ic">💡 Hint</span> ' + esc(ex.hint);
    hp.classList.remove('hidden');
    $id('hintBtn').disabled = true;
  }
  function showReview() {

  function wireAnswer(ex, idx) {

      Array.prototype.forEach.call(area.querySelectorAll('[data-tg]'), function (b) {
        b.addEventListener('click', function () {
          var g = b.getAttribute('data-tg'), oid = b.getAttribute('data-toid');
          tr.sel['a' + g] = oid;
          Array.prototype.forEach.call(area.querySelectorAll('[data-tg="' + g + '"]'), function (x) { x.classList.remove('selected'); });
          b.classList.add('selected');
          enableCheck();
        });
      });
    } else if (ex.type === 'logview') {
      var f = $id('logFilter');
      f.addEventListener('input', function () {
        var q = norm(f.value);
        Array.prototype.forEach.call(area.querySelectorAll('.log-line'), function (row) {
          var txt = row.querySelector('.lt').textContent;
          row.style.display = (q === '' || norm(txt).indexOf(q) >= 0) ? '' : 'none';
        });
      });
      Array.prototype.forEach.call(area.querySelectorAll('.log-line'), function (row) {
        function toggle() {
          var lid = row.getAttribute('data-line');
          tr.sel[lid] = !tr.sel[lid];
          row.classList.toggle('selected', !!tr.sel[lid]);
          row.setAttribute('aria-pressed', tr.sel[lid] ? 'true' : 'false');
          var mark = row.querySelector('.log-mark');
          if (tr.sel[lid] && !mark) {
            var m = document.createElement('span'); m.className = 'log-mark'; m.textContent = '● selected'; row.appendChild(m);
          } else if (!tr.sel[lid] && mark) { mark.remove(); }
          enableCheck();
        }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      });
    } else if (ex.type === 'tree') {
      Array.prototype.forEach.call(area.querySelectorAll('[data-treeopt]'), function (b) {
        b.addEventListener('click', function () {
          tr.picks[tr.step] = b.getAttribute('data-treeopt');
          Array.prototype.forEach.call(area.querySelectorAll('[data-treeopt]'), function (x) { x.classList.remove('selected'); });
          b.classList.add('selected');
          $id('treeConfirm').disabled = false;
          if ((tr.step || 0) === ex.tree.steps.length - 1) { enableCheck(); }
        });
      });
      $id('treeConfirm').addEventListener('click', function () {
        var st = tr.step || 0;
        if (!tr.picks[st]) { return; }
        var isLast = st === ex.tree.steps.length - 1;
        if (!isLast) {
          tr.step = st + 1;
          renderExercise(idx, state.mode === 'review-item');
          enableCheck(); // final Check becomes enabled once last step is selected
          $id('checkBtn').disabled = true;
        }
        // On the last step, the outer Check button grades the whole tree (auto-pause applies there only).
      });
    }
  }
  function hasAnyPlacement(ex, tr) {
    return ex.slots.some(function (s, si) { return (tr.slots[si] || []).length > 0; });
  }
  /* ---------------- grading ---------------- */
  function gradeExercise(ex, idx) {
    var tr = state.trans[idx] || { sel: {}, seq: [], picked: null, step: 0, picks: [], slots: [], cmd: '' };
    var t = ex.type, r = { N: 0, H: 0, W: 0, credit: 0, items: [], answerHtml: '', extraHtml: '' };
    if (t === 'qcm') {
      var correctIds = ex.correct;
      var selIds = Object.keys(tr.sel).filter(function (k) { return tr.sel[k]; });
      var s = scoreExercise(selIds, correctIds);
      r.N = s.N; r.H = s.H; r.W = s.W; r.credit = s.credit;
      ex.options.forEach(function (o) {
        var isC = correctIds.indexOf(o.id) >= 0, sel = !!tr.sel[o.id];
        if (isC) {
          r.items.push({ st: sel ? 'c' : 'm', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This is part of the correct answer.' });
        } else if (sel) {
          r.items.push({ st: 'w', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This option is not part of the correct answer.' });
        }
      });
      r.answerHtml = correctIds.map(function (cid) {
        return '<b>' + (ex.options.filter(function (o) { return o.id === cid; })[0] || {}).label + '</b>';
      }).join(' and ');
    } else if (t === 'match') {
      r.N = ex.pairs.length; var H = 0, W = 0;
      ex.pairs.forEach(function (p, i) {
        var sel = tr.sel['m' + i];
        if (!sel) { r.items.push({ st: 'm', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else if (norm(sel) === norm(p.right)) { H++; r.items.push({ st: 'c', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else { W++; r.items.push({ st: 'w', label: strip(p.left) + ' → ' + sel, why: p.why }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.pairs.map(function (p) { return strip(p.left) + ' → <b>' + esc(p.right) + '</b>'; }).join('; ');
    } else if (t === 'blank') {
      r.N = ex.blanks.length; H = 0; W = 0;
      ex.blanks.forEach(function (b, i) {
        var val = norm(tr.sel['b' + i]);
        var ok = b.accept.some(function (a) { return norm(a) === val; });
        if (val === '') { r.items.push({ st: 'm', label: 'Blank ' + (i + 1), why: 'Correct: ' + b.accept[0] + '. ' + b.why }); }
        else if (ok) { H++; r.items.push({ st: 'c', label: 'Blank ' + (i + 1) + ' = ' + val, why: b.why }); }
        else { W++; r.items.push({ st: 'w', label: 'Blank ' + (i + 1) + ' = "' + val + '"', why: b.why + ' Correct: ' + b.accept[0] + '.' }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.blanks.map(function (b, i) { return 'Blank ' + (i + 1) + ': <b>' + esc(b.accept[0]) + '</b>'; }).join('; ');
    } else if (t === 'dnd') {
      r.N = ex.slots.length; H = 0; W = 0;
      ex.slots.forEach(function (s, si) {
        var placed = tr.slots[si] || [];
        if (placed.length === 0) { r.items.push({ st: 'm', label: 'Slot: ' + s.label, why: s.why }); return; }
        placed.forEach(function (iid, k) {
          var it = ex.itemsPool.filter(function (x) { return x.id === iid; })[0];
          var lab = it ? it.label : iid;
          if (k === 0 && s.accept.indexOf(iid) >= 0) { H++; r.items.push({ st: 'c', label: 'Slot "' + s.label + '" ← ' + lab, why: s.why }); }
          else { W++; r.items.push({ st: 'w', label: 'Slot "' + s.label + '" ← ' + lab, why: (s.acceptWrong && s.acceptWrong[iid]) ? s.acceptWrong[iid] : 'This item does not belong in this slot. ' + s.why }); }
        });
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.slots.map(function (s) {
        var labels = s.accept.map(function (aid) {
          var it = ex.itemsPool.filter(function (x) { return x.id === aid; })[0];
          return it ? it.label : aid;
        });
        return '"' + esc(s.label) + '" ← <b>' + esc(labels.join(' / ')) + '</b>';
      }).join('; ');
    } else if (t === 'order') {
      r.N = ex.steps.length; H = 0; W = 0;
      ex.steps.forEach(function (s, i) {
        var got = tr.seq[i];
        if (!got) { r.items.push({ st: 'm', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else if (got === s.id) { H++; r.items.push({ st: 'c', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else {
          W++;
          var it = ex.steps.filter(function (x) { return x.id === got; })[0];
          r.items.push({ st: 'w', label: 'Position ' + (i + 1) + ': you placed "' + (it ? it.label : got) + '"', why: s.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<ol style="margin:4px 0 0 18px;padding:0">' + ex.steps.map(function (s) { return '<li>' + esc(s.label) + '</li>'; }).join('') + '</ol>';
    } else if (t === 'term') {
      var cmd = norm(tr.cmd || '');
      r.N = ex.term.elements.length; H = 0; W = 0;
      var rc = termRC(ex);
      if (cmd === '') {
        ex.term.elements.forEach(function (el) { r.items.push({ st: 'm', label: el.label, why: el.why }); });
      } else {
        rc.els.forEach(function (pair) {
          if (pair.re.test(cmd)) { H++; r.items.push({ st: 'c', label: pair.e.label, why: pair.e.why }); }
          else { r.items.push({ st: 'm', label: pair.e.label, why: pair.e.why }); }
        });
        rc.pens.forEach(function (pair) {
          if (pair.re.test(cmd)) { W++; r.items.push({ st: 'w', label: pair.p.label, why: pair.p.why }); }
        });
      }
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<div class="codeblock mono" style="background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text-mono);font-size:14.5px">' +
        '<span style="color:#7f8db3"># canonical command (copyable)</span>\n' + esc(ex.term.canonical) + '</div>';
      r.extraHtml = '<p style="margin:8px 0 0;color:var(--text-secondary)"><b style="color:var(--text-primary)">Part by part:</b></p><ul style="margin:6px 0 0 18px;padding:0">' +
        ex.term.parts.map(function (p) { return '<li style="margin-bottom:4px"><code class="inline">' + esc(p.k) + '</code> — ' + p.v + '</li>'; }).join('') + '</ul>';
      var dangerHit = null;
      rc.dan.forEach(function (pair) { if (pair.re.test(cmd)) { dangerHit = pair.d; } });
      if (dangerHit) {
        r.extraHtml = '<div class="fb-danger">✗ DANGEROUS — NEAR MISS: ' + dangerHit.msg + '</div>' + r.extraHtml;
      }
    } else if (t === 'triage') {
      r.N = ex.alerts.length; H = 0; W = 0;
      ex.alerts.forEach(function (a, i) {
        var sel = tr.sel['a' + i];
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        if (!sel) { r.items.push({ st: 'm', label: 'Alert ' + (i + 1) + ' — correct: ' + corr.label, why: a.why }); }
        else if (sel === a.correct) { H++; r.items.push({ st: 'c', label: 'Alert ' + (i + 1) + ' — ' + corr.label, why: a.why }); }
        else {
          W++;
          var picked = a.options.filter(function (o) { return o.id === sel; })[0];
          r.items.push({ st: 'w', label: 'Alert ' + (i + 1) + ' — you chose "' + picked.label + '"', why: a.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.alerts.map(function (a, i) {
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        return 'Alert ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    } else if (t === 'logview') {
      var rel = ex.lines.filter(function (l) { return l.related; });
      r.N = rel.length; H = 0; W = 0;
      rel.forEach(function (l, i) {
        var sel = !!tr.sel[l.id];
        if (sel) { H++; r.items.push({ st: 'c', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
        else { r.items.push({ st: 'm', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
      });
      ex.lines.forEach(function (l) {
        if (!l.related && tr.sel[l.id]) {
          W++; r.items.push({ st: 'w', label: 'Line L' + (ex.lines.indexOf(l) + 1) + ' (not evidence)', why: l.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = 'Evidence lines: <b>' + rel.map(function (l) { return 'L' + (ex.lines.indexOf(l) + 1); }).join(', ') + '</b>';
    } else if (t === 'tree') {
      r.N = ex.tree.steps.length; H = 0; W = 0;
      ex.tree.steps.forEach(function (st, i) {
        var got = tr.picks[i];
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        if (!got) { r.items.push({ st: 'm', label: 'Step ' + (i + 1) + ' — correct: ' + corr.label, why: st.why }); }
        else if (got === st.correct) { H++; r.items.push({ st: 'c', label: 'Step ' + (i + 1) + ' — ' + corr.label, why: st.why }); }
        else {
          W++;
          var picked = st.options.filter(function (o) { return o.id === got; })[0];
          r.items.push({ st: 'w', label: 'Step ' + (i + 1) + ' — you chose "' + picked.label + '"', why: st.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.tree.steps.map(function (st, i) {
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        return 'Step ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    }
    return r;
  }
  function strip(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || ''; }
  function termRC(ex) {
    if (!ex._rc) {
      ex._rc = {
        els: (ex.term.elements || []).map(function (e) { return { e: e, re: new RegExp(e.reSrc, 'i') }; }),
        pens: (ex.term.penalties || []).map(function (p) { return { p: p, re: new RegExp(p.reSrc, 'i') }; }),
        dan: (ex.term.danger || []).map(function (d) { return { d: d, re: new RegExp(d.reSrc, 'i') }; })
      };
    }
    return ex._rc;
  }

  /* ---------------- feedback ---------------- */
  function renderFeedback(ex, idx, res) {
    var multi = res.N > 1;
    var cls, word, ic;
    if (res.credit >= 1) { cls = 'fb-correct'; word = 'CORRECT'; ic = '✓'; }
    else if (res.credit > 0) { cls = 'fb-partial'; word = 'PARTIALLY CORRECT'; ic = '✓'; }
    else { cls = 'fb-incorrect'; word = 'INCORRECT'; ic = '✗'; }
    var h = '<div class="feedback" id="feedbackBlock"><div class="fb-head ' + cls + '">' +
      '<span aria-hidden="true" style="font-size:20px">' + ic + '</span> <span>' + word + '</span>' +
      (multi || res.credit < 1 ? '<span class="fb-credit">✓ ' + res.H + '/' + res.N + ' items · credit ' + res.credit.toFixed(2) + '</span>' : '') +
      '</div><div class="fb-b">' +
      '<div class="fb-answer"><b>Correct answer:</b> ' + res.answerHtml + '</div>';
    if (multi) {
      h += '<p style="margin:6px 0 10px;color:var(--text-secondary);font-size:14px">Item-by-item breakdown — credit formula: max(0, (H − W) ÷ N) = max(0, (' + res.H + ' − ' + res.W + ') ÷ ' + res.N + ') = ' + res.credit.toFixed(2) + '</p>';
      h += res.items.map(function (it) {
        var stc = it.st === 'c' ? 'fi-correct' : (it.st === 'w' ? 'fi-wrong' : 'fi-missed');
        var w = it.st === 'c' ? ['✓', 'Correct'] : (it.st === 'w' ? ['✗', 'Wrong'] : ['○', 'Missed']);
        return '<div class="fb-item ' + stc + '"><span class="ic" aria-hidden="true">' + w[0] + '</span>' +
          '<span><span class="word">' + w[1] + '</span> — ' + esc(it.label) + '<span class="why">' + esc(it.why) + '</span></span></div>';
      }).join('');
    }
    h += '<div class="fb-explain">' + ex.explain +
      (res.credit < 1 && ex.study ? '<p class="study">📖 What to study: ' + esc(ex.study) + '</p>' : '') +
      '</div>' + (res.extraHtml || '') + '</div></div>';
    var area = $id('exerciseArea');
    area.insertAdjacentHTML('beforeend', h);
    // disable inputs
    Array.prototype.forEach.call(area.querySelectorAll('.opt, .chip, .slot-drop, [data-seq], [data-unseq], .match-row select, .blank-in, .log-line, .filter-in, [data-treeopt], #treeConfirm, #termRun, .shell-in'), function (el) {
      el.disabled = true;
      el.classList.add('disabled');
      el.style.pointerEvents = 'none';
    });
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    $id('introTitle').textContent = INTRO.title;
    $id('introObject').textContent = INTRO.object;
    var b = $id('sevBadge');
    b.className = 'badge ' + SEV_CLASS[META.difficulty];
    b.innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('introFacts').innerHTML =
      fact('Exercises in this file', String(EXERCISES.length)) +
      fact('Estimated time', META.estimatedMinutes + ' minutes') +
      fact('Timer budget', META.estimatedMinutes + ' min countdown') +
      fact('Pass mark', META.passMark + '%') +
      (INTRO.partLabel ? fact('Batch', INTRO.partLabel) : '');
    $id('learnBody').innerHTML = INTRO.learn.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $id('kwBody').innerHTML = INTRO.keywords.map(function (k) {
      return '<div class="kw-theme"><h3>' + esc(k.theme) + '</h3><ul class="kw-list">' +
        k.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    $id('howBody').innerHTML = '<ul class="how-list">' + INTRO.how.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
  }
  function fact(k, v) { return '<span class="fact"><b>' + esc(k) + ':</b> ' + esc(v) + '</span>'; }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    // theme field is always 'dark' — the file is dark-only, so appearance does not change.
    state.user.name = event.data.username || '';
    state.user.country = event.data.country || '';
    state.user.locale = event.data.locale || 'en';
  });

  /* ---------------- init ---------------- */
  function init() {
    renderIntro();
    renderTimerBar();
    $id('startBtn').addEventListener('click', startExam);
    $id('checkBtn').addEventListener('click', function () {
      if (state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
      onCheck();
    });
    $id('nextBtn').addEventListener('click', onNext);
    $id('skipBtn').addEventListener('click', onSkip);
    $id('hintBtn').addEventListener('click', onHint);
    $id('pauseBtn').addEventListener('click', onPauseBtn);
    $id('retakeBtn').addEventListener('click', onRetake);
    $id('finalSubmitBtn').addEventListener('click', onFinishBtn);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
